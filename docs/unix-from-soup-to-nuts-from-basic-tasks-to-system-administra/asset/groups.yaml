    \ your instructions.)\n\n***\n\n[content]\n## crontab Entry Requirements\n\n|\
    \ Field Number | Field Name | Acceptable Values |\n|---|---|---|\n| 1 | Minute\
    \ | 0-59 |\n| 2 | Hour | 0-23 |\n| 3 | Day of the month | 1-31 |\n| 4 | Month\
    \ of the year | 1-12 |\n| 5 | Day of the week | 0-6 0=Sunday, 1=Monday, 2=Tuesday,\
    \ 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday |\n| 6 | Command | Executable\
    \ file or command syntax. It is best to use the absolute path of executables in\
    \ the crontab since you cannot depend on your shell environment variables being\
    \ active when you are not logged in.| |\n\nAn asterisk (*) may be substituted\
    \ for a number in any of the first five fields of a crontab entry. The asterisk\
    \ represents a wildcard that represents all legal values for that field. So field\
    \ five which is the day of the week field, * and 0-6 and 0,1,2,3,4,5,6 all have\
    \ the same meaning and are all legal values. The hyphen in the 0-6 represents\
    \ an inclusive range. In the previous example, the numbers have been separated\
    \ by commas. You do not need to list a complete range of numbers to use the comma\
    \ separator. You could have used 0,3,5 if you just wanted to execute a command\
    \ on Sunday, Wednesday, and Friday.\n\n## UNIX From Soup To Nuts\n\nA pound sign\
    \ (#) identifies a comment in the crontab file. If the pound sign is in the first\
    \ position on a line, then the whole line is ignored. If the pound sign is to\
    \ the right of the command string to be executed, then everything to the right\
    \ of the pound sign is ignored.\n\nYou may have noticed that both the third and\
    \ fifth fields of the crontab entry represents days. If both of these fields include\
    \ numerical values, the command string will be executed on specified days. So\
    \ if the third field has a 3 and the fifth field has a 2, then the command string\
    \ will be executed on the third day of the month no matter what day of the week\
    \ is as well as every Tuesday of the month. If the third day of the month is a\
    \ Tuesday, nothing special happens; the command string is executed only once that\
    \ day. The following are a few examples of legal crontab entries:\n\n- 10 3 *\
    \ * * /usr/sbin/test_script1 # This script will be executed at 3:10 am every day\
    \ of May.\n- 30 20 * * 1 /usr/local/bin/test_script2 # This script will be executed\
    \ at 8:30 pm on every Monday.\n- #10 22 * * * /usr/local/test_script3 # This script\
    \ will not be executed because the pound sign in the first position identifies\
    \ the line as a comment.\n\nSimilar to cron is the [at] command. Unlike cron,\
    \ which is used to run jobs on a regularly scheduled basis, the at command runs\
    \ a job once and then forgets about it. I recommend that new UNIX users use cron\
    \ rather than because the scheduled jobs are much easier to keep track of. If\
    \ you still think you want to, take a crack at using the at command.\n\nThe syntax\
    \ is pretty straightforward. You just tell the system at the command line that\
    \ you want to execute something “at” a certain time. Like this: (at 0815am Jan\
    \ 24 uptime >>long.txt). In the previous example, the uptime command will be executed\
    \ and the output will be appended to a file called long.txt at the designated\
    \ time and date. The at command also accepts common definitions of times in text\
    \ format like now, noon, and midnight.\n\nThe privileges of the at command are\
    \ usually more secure than the crontab because of the possibility of its malicious\
    \ use. Don’t be surprised if you get a message from the system like “at: you are\
    \ not authorized to use at.\n\nSorry,” when you try to use the at command. The\
    \ privileges for the at command are controlled by the system administrator. To\
    \ modify the privileges for a user associated with the at command, you must modify\
    \ one of the following files depending on how the security has been setup for\
    \ the at command.\n\n```\n/usr/lib/cron/at.allow and /usr/lib/cron/at.deny\n```\n\
    \nor\n\n```\n/etc/at.allow and /etc/at.deny\n```\n\nIf the at.allow file exists,\
    \ then only users listed in the file are allowed to use the at command to submit\
    \ commands for execution at a later time. The format of the at.allow file is one\
    \ user per line. No white space is allowed inside the file. The root user is allowed\
    \ to use the at command at all times, even if it is not listed in the at.allow\
    \ file.\n\nIf the at.allow file does not exist, the system will check the at.deny\
    \ file for a list of users that are not allowed to submit commands for execution\
    \ at a later time. The format of the at.deny file is the same as the at.allow\
    \ file. If the at.allow file does not exist and the at.deny file is empty, then\
    \ all users are allowed to use the at utility.\n\nThe reason the privileges for\
    \ the at command are so tightly managed is because once an command has been submitted\
    \ for later execution, it is not easy to detect as a scheduled cron job that is\
    \ plainly visible in the crontab file. Although the creators of the at command\
    \ had good intentions when they created it, the opportunity for malicious users\
    \ of the at command is too great. For the sake of security and system stability,\
    \ I recommend that the at command be used sparingly.\n\n## SOLUTIONS FOR EXERCISES\n\
    \n### 1 – Solutions for Basics\n\n- 1. / represents the complete path of a file\
    \ from the root directory.\n- 2. The relative path represents the direct route\
    \ to a file from current location.\n- 3. The $PATH variable holds the locations\
    \ in system where Kernel will look for files. If a directory is not listed in\
    \ your $PATH, Kernel will not find it when you try to execute it.\n- 4. Network\
    \ Filesystem.\n- 5. Journaled Filesystem.\n- 6. The df command displays information\
    \ about mounted filesystems.\n- 7. An inode holds information about files like\
    \ the size of a file; the UID of the file's owner; the GID of the file's owner;\
    \ a unique identification number, called an inode number; the file's permission\
    \ mode; some timestamps indicating when the inode was changed last, known as the\
    \ (ctime); when the content of the file was last modified, known as the (mtime);\
    \ and when the file was accessed, known as the (atime); and a counter that keeps\
    \ track of how many links are pointing to the inode.\n- 9. echo $HOME or env |\
    \ grep HOME or set | grep HOME or cd.\n- 10. df -i for all mounted filesystems\
    \ or df -i filesystem name for a specific filesystem.\n\n### 2 – Solutions for\
    \ Manipulating Files\n\n- 1. cp file1\n- 2. du -hs /home/username\n- 3. passwd\n\
    - 4. groups or more /etc/group or Do a long listing of a file you have made.\n\
    - 5. more /etc/group\n- 6. touch gfile or chmod 774 gfile\n- 7. chgrp staff oldgroup\n\
    - 8. touch .profile\n- 9. head -n 3\n\n### 3 – Solutions for Editors\n\n- 1. Command\
    \ mode and insert mode\n- 2. dd\n- 3. :q!\n- 4. S\n- 5. D\n- 6. The “/ slash\n\
    - 7. $EDITOR\n- 8. set -o vi\n- 9. Esc k\n\n### 4 – Solutions for Filesystems,\
    \ Directories, and Paths\n\n- 1. more /etc/passwd\n- 2. du -hs /home/username\n\
