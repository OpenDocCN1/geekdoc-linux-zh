    # 6 BASH, THE BOURNE AGAIN SHELL


    The bash shell is the shell, command language interpreter, that will appear in
    the GNU operating system distributions. The bash shell is a sh-compatible shell
    that incorporates useful features from the Korn shell (ksh) and C shell (esh).
    The bash shell is intended to conform to the IEEE POSIX P1003.2/ISO 9945.2 Shell
    and Tools standard. The bash shell offers functional improvements over sh for
    both programming and interactive use. In addition, most sh scripts can be run
    by bash without modification.


    The bash shell is quite portable. It uses a configuration system that discovers
    characteristics of the compilation platform at build time, and may therefore be
    built on nearly every flavor of UNIX. The bash shell ports to UNIX-like systems,
    such as Linux, and to non-UNIX-like operating systems, such as IBM''s OS/2 and
    Microsoft Windows operating systems.


    There are other shells available to users, many of which are installed as part
    of the UNIX operating system by default. Since the bash shell is so user friendly
    and increasing in popularity, I have endeavaved to focus on the use of the bash
    shell in all examples in this book applicable. In addition to many other features,
    the bash shell includes the following useful features. There are entire books
    and websites devoted to the bash shell and its features. I encourage readers to
    pursue the subject of shell features further as it


    # UNIX From Soup To Nuts


    will undoubtedly make your user experience easier and more enjoyable as you use
    the UNIX operating system.


