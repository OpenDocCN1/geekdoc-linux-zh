    of the difference between the two files being compared. The cmp command can be
    used in a script to test if files are identical. Beyond that, I find that the
    lack of descriptive output from this command to be a hindrance in my efforts.


    Therefore, if I really want to find out what the difference between two files
    is, I opt to use the cmp command instead of the cmp command. If the two files
