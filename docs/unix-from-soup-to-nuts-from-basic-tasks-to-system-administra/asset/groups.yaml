    # Adding Line Numbers to Output


    To add line numbers to command line output, you may use the [nl] or cat command
    with either the -n or -b option. The default behavior of the nl command is to
    insert line numbers at the beginning of each line in a file and display the file
    to standard output. The original file will not be modified. The line numbers will
