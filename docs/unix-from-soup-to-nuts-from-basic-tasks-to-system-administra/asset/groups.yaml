    ```


    This output is not very helpful is it? You can see if the first character is different
    in the two files just by looking at them. However, if you just want to know if
    the files are different or alike, use the cmp command. the cmp command has an
    option that suppresses all output except the exit status of the command. You can
    use this in a script for a simple true-false logic. The following table includes
    two options for the cmp command that you may wish to try.'
