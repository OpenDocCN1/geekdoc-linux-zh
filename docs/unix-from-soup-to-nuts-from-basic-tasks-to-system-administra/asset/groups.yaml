    # Displaying and Printing Files


    As with any other task in the UNIX operating system, there are multiple ways to
    display information from files, or files in their entirety. Some of the common
    commands to perform these tasks are the cat, pg, more, less, head, and tail commands.
    The following describes how the commands are used and how they differ from each
    other.


    The pg or page command, is used to display a file page or one full screen at a
    time. The default behavior of the pg command is to display the first page of information
    and then pause until the enter is hit. The file being displayed will then display
    the next page and pause again until the enter is hit again and until the EOF is
    reached. The pg command will allow you to use the vi search function within the
    file if your EDITOR environment variable is set to vi. If you finished viewing
    a file before the EOF you can use the Esc-c key sequence to return to the command
    prompt.


    The more command will display the first page of a file similar to the pg command.
    The difference between the pg command and the more command'
  - '[PAGE 54]


    # UNIX From Soup To Nuts


    is the more command will allow you to move through a file one line at a time or
    one page at a time. As with the pg command, the more command will advance one
    screen or page at a time by hitting the enter key. The more command also allows
    you to advance one line at a time by hitting the space bar. The vi search function
    may be used within the file. If you are finished viewing a file before the EOF
    is reached, you can use the Esc-c key sequence to return to the command prompt.


    Similar to the more command is the less command. The less command will display
    the first page of a file, similar to the more command. The difference between
    the less command and the more command is the less command will allow you to move
    backward through a file at any point until the EOF is reached. The less command
    navigation functions for advancing one page at a time or one line at a time are
    the same as the more command. The backward navigation is achieved with the use
    of the arrow keys. The less command will display a file faster than other commands
    because it does not read the entire file before displaying it on the screen. Depending
    on the speed of your UNIX server, this difference in performance may or may not
    be noticeable. The vi search function may be used within the file. If you are
    finished viewing a file before the EOF is reached, you can use the Esc-c key sequence
    to return to the command prompt.


    The cat or concatenate command will display an entire file without pausing. The
    behavior of not pausing makes files difficult to read if they are longer than
    one page unless you use another command like pg in conjunction with it to add
    the pausing behavior. The cat variety is very useful at the command line and within
    scripts for finding a particular line or word if it is used in conjunction with
    one of the grep variants. The cat command can also be used to feed a file to a
    redirector like |, or <.


    If you just want to display the beginning or the end of a file, the head and tail
    commands are the correct tool for the job. The default behavior of both the head
    and tail commands is to display 10 lines. You may alter the number of lines to
    display with the -n option. The syntax to change the number of lines is head -n
    filename. An important note is that you do not actually type the "n". The "n"
    is just a placeholder for the number of lines you want to view. So if you wanted
    to view 15 lines instead of the default 10, you would type head -15 filename.'
