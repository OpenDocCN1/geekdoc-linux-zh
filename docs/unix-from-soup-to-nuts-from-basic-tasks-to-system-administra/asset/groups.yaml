    | Command | Description |

    | --- | --- |

    | sed ''s/^g*/'' coins | grep -v ''^$'' | wc -l | Count lines in the coins file
    that do not start with a (g). |

    | cat coins | sed ''s/gold/mold/g'' | awk ''/old/'' | awk ''{print $1, $2, $3}''
    | Change (gold) to (mold) and print fields 1, 2, and 3 lines in the coins file
    that contain (old). |

    | cat file1 | sed -F, ''/abc/d'' | awk ''{print $2; print $1}'' | Delete lines
    that contain (abc) and print columns 2 and 1 on their own line with a comma as
    a field delimiter. |


