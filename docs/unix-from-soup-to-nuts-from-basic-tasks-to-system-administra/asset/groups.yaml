    ## split 工具


    *split* 工具用于将一个文件分成若干部分。最终，你会遇到或创建一个大到无法处理、传输或存储在便携介质上的文件。对于这些情况，split 工具是完美的解决方案。split
    工具可以按大小或行/记录数来分割大文件。split 工具的语法非常简单，可以很容易插入到脚本循环中，将一个大文件分成多个较小文件。split 工具将使用原始文件名命名输出文件，并附加顺序后缀。split
    工具的局限性是从一个输入文件最多生成 676 个输出文件。下表描述了 split 工具的选项。


    | 选项 | 描述 |

    | --- | --- |

    | -b n | 将文件分成大小为 n 字节的部分。 |

    | -b nk | 将文件分成大小为 n * 1024 字节的部分。 |

    | -b nm | 将文件分成大小为 n * 1048576 字节的部分。 |

    | -l | 按行数分割文件。 |


    以下是一个示例，将一个名为 file1 的文件分成 100 个每份 100 行的块。


    ```

    #split -l 100 file1

    ```


    ## swap 工具


    *swap* 工具对于管理和监控操作系统内存管理器使用的系统交换区（swap areas）非常有用。交换空间本质上是系统与物理内存相关的逻辑区域。你也可以从磁盘空间创建交换空间。你只需要创建一个磁盘分区并告诉操作系统它将用作交换。然后你需要使用
    swap 工具将该磁盘分区作为新的交换分区添加。虽然交换空间对于系统的最佳性能至关重要，但要小心不要用磁盘分区创建超过你所需的交换空间。


    磁盘空间通常是稀缺资源，你你不希望将其浪费在并不真正需要的交换空间上。然而，如果你有空闲磁盘，使用磁盘分区作为交换空间可以支撑到你为系统购买内存，或将其中一个内存密集型应用程序迁移到另一个服务器为止。有时应用程序会出现所谓的*内存泄漏*。被足够客户报告的内存泄漏通常会在下一个发布的应用程序补丁集中得到修复，但在它们存在你的系统期间，你必须处理它们。


    内存泄漏是指应用程序基本上没有管理它正在使用的内存。结果是系统内存最终会被耗尽。重启系统将临时清理内存问题，但如果你正在运行任务关键型应用程序，你可能无法重启系统。在这种情况下，添加交换空间可能会推迟不可避免的系统重启。


    | 选项 | 描述 |

    | --- | --- |

    | -a | 添加交换空间。 |

    | -d | 删除指定的交换空间。 |

    | -l | 列出所有定义的系统交换区的状态。 |

    | -s | 显示系统交换区的摘要。 |


    要显示交换统计的摘要，请使用带有 -s 选项的 swap 命令，如下例所示：


    ```

    #swap -s

    ```


    ```

    total: 476904k bytes allocated + 38800k reserved = 515704k, 1367896k available

    ```


    要显示交换统计的长列表或详细列表，请使用带有 -l 选项的 swap 命令，如下例所示：


    ```

    #swap -l


    swapfile dev swaplo blocks free

    /dev/dsk/c0r0d0s1 136,9 16 1049312 1049312

    ```


    ## uname 命令


    [uname] 命令显示机器的唯一硬件 ID 号。这与操作系统的帧序列号或零件号不同。唯一 ID 号是硬件型号、子型号和服务器背板 ID 的组合。整个系统的唯一
    ID 应该是一个 12 位数字。


    根据我的经验，前两个数字总是 00。这些数字可能是为型号较长的系统提供的占位符，或者是尚未包含或已停止包含在 uname 输出中的信息。下表解释了使用 uname
    命令显示特定系统信息的哪些选项。


    | uname 命令选项 | 描述 |

    | --- | --- |

    | -a | 所有信息。 |

    | -n | 节点名称。 |

    | -m | 机器架构。 |

    | -p | 硬件名称。 |

    | -v | 操作系统。 |

    | -X | CPU 数量。 |


    ## uptime 命令


    [uptime] 命令将告诉你系统运行了多久。uptime 输出包括自启动以来的时间、登录用户数以及过去 1、5、15 分钟的平均负载。


    ```

    #uptime

    01:26:02 up 1:00, 1 user, load average: 0.10, 0.05

    ```


    ## vmstat（内存统计）命令


    vmstat 命令用于显示活动进程、内存、交换空间、I/O（输入/输出）、系统和 CPU 当前状态。使用 vmstat 的简单方法是输入 vmstat 后跟一个空格、一个数字、另一个数字。第一个数字是延迟，第二个数字是样本数。如果你想看
    3 行，应该请求 4，并忽略第一行。


    ```

    vmstat 2 3

    procs ----------memory----------swap-----io----cpu-----

    r b swpd free buff cache si bo in cs us id st

    0 0 446552 68624 296708 0 0 180 32 79 71 75 0 0 1 95 3

    0 0 446552 68624 296736 0 0 0 0 71 75 0 0 1 100 0

    1 0 446120 68628 296836 0 0 48 60 0 99 131 0 2 91 6 0

    ```


    vmstat 输出的第一行是自上次系统启动以来的平均值。报告第一行之后的每一行都是指定间隔内的平均值。


    | 表头 | 描述 |

    | --- | --- |

    | r | 等待运行的进程数。 |

    | b | 处于不可中断睡眠的进程数。 |

    | swpd | 使用的虚拟内存量。 |

    | free | 空闲内存。 |

    | buff | 缓冲区使用的内存。 |

    | cache | 缓存使用的内存。 |

    | si | 从磁盘交换入的内存。 |

    | so | 交换到磁盘的内存。 |

    | bi | 从块设备接收的块数。 |

    | bo | 发送到块设备的块数。 |

    | in | 每秒中断数。 |

    | cs | 每秒上下文切换数。 |

    | us | 在用户模式下花费的时间。 |

    | sy | 在内核模式下花费的时间。 |

    | id | 空闲。 |

    | wa | 等待 I/O 的时间。 |

    | st | 被虚拟机窃用的时间。 |


