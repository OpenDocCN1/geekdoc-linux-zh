    从基础任务到系统管理


    Robert Fay, MIS


    # UNIX

    从入门到精通


    Robert B. Fay


    # 献辞


    我的妻子 Alayna 以及我的孩子们 Dakota 和 Kiana。愿生活继续带给你们成功与快乐。


    # 目录


    - 致谢 i

    - 1 UNIX 基础 第 1 页

    - 2 使用文件 第 34 页

    - 3 编辑器 第 56 页

    - 4 文件系统、目录与路径 第 84 页

    - 5 用户、组与权限 第 91 页

    - 6 bash – 再次回归 Bourne 的 Shell 第 104 页

    - 7 进程管理 第 116 页

    - 8 杂项 UNIX 工具 第 123 页

    - 9 比较、排序与压缩 第 142 页

    - 10 备份 第 155 页


    # 致谢


    Robert 感谢 L.D. Bartholome 说服他申请了他的第一份 UNIX 系统管理员职位。此外，Robert 还要感谢 Rick Parker、Lynn
    Harris 和 Gordon Howell，感谢他们提供了从 RPG 程序员转变为 UNIX 系统管理员和数据库管理员的机会。这种职业路径的转变开启了新的机会之门。Robert
    特别感谢他的朋友兼学习伴侣 Susan Mock，感谢她投入了大量时间进行校对和编辑工作。


    # 1 UNIX 基础


    本书旨在供 UNIX 和 Linux 操作系统的用户阅读。然而，在本文正文中，除非讨论的是 Linux 发行版特有的功能，否则所有讨论均指 UNIX 操作系统。我的意图是介绍
    UNIX 操作系统用户和系统管理员都必须掌握的基础性及核心概念。我涵盖了从初级 UNIX 培训课程到中级系统管理课程的课题。


    本书并不是作为一本系统管理手册。相反，它旨在作为一份路线图，向 UNIX 用户介绍 UNIX 系统的各种工具、命令、协议和程序。它的编写方式旨在提供层层递进的概念。每一章或主要主题领域将包含一个常用命令或工具选项表，以及一些语法示例和示例输出。此外，在每一章的末尾都有让你练习所学知识的机会。章节练习题的答案在书末页提供。我不建议你在第一次阅读本书时跳跃得太厉害。在初读之后，我希望你会发现这本书是一本实用且易于使用的快捷参考书。


    # 本书使用的约定


    以下提供的一系列约定，旨在帮助你理解书中示例以及其他主流 UNIX 文档源中使用的各种符号。我使用了行业标准的方法和约定，以帮助你无缝阅读本书并在 UNIX
    机器上尝试练习，而无需翻译任何内容。


    - Dot（点）。“点”不要与句号（period）混淆。点用于识别隐藏文件。如果文件名以点开头，那么在列出文件时，除非你指定显示隐藏文件，否则该文件不会显示。点也用于识别目录中的位置。一个点表示当前目录。两个点表示目录树中你当前位置的上一级目录。

    - file - 对文件的引用。这是在命令语法中放置文件的位置。

    - filename - 表示在此处插入你的文件名。

    - file.out - 这是跟在它之前的任何语法之后的输出文件。

    - infile - 这是命令的输入文件。

    - " - 双引号之间的任何内容都是字面量（literal）。

    - # - 井号。在 UNIX 世界中被称为哈标记（hash mark）。此符号右侧的所有内容都是注释，而不是代码。井号也常用作 root 用户的命令提示符，但这并不是系统的要求。书中的示例以
    # 符号开头，表示我正在命令行提示符下运行这些命令。当你在 UNIX 系统上尝试这些示例时，不需要输入 # 符号。如果你输入了，将会得到错误。

    - ! - 感叹号。在 UNIX 世界中被称为 bang 符号（bang symbol）。bang 符号在比较语句中代替“not”一词，表示“不等于”。

    - Environment Variables（环境变量）- 使用全大写字母表示。

    - / - 斜杠。目录树中所有的斜杠都是正斜杠 /。（与微软操作系统的相反。）

    - Blank Lines（空行）- 文件中的空行和其他空格会被忽略。


    # UNIX 从入门到精通


    - [] 方括号。每当书中首次引入一个新的 UNIX 命令时，它会被方括号括起来，以便你能在句子中更容易识别出它们。

    - {} 圆括号。注释和示例被括在括号中。

    - Tables 表格——当我谈到表格时，指的是类似于电子表格的图表，它包含带有标题的正规列的相关信息。


    # 文件扩展名


    文件扩展名是文件名点后面的字母。由于有许多类型的文件，我包含了一些常见类型。我认为这样更容易阅读和演示。


    | 常用扩展名 |

    | 扩展名 | 说明 |

    | :--- | :--- |

    | .bak | 备份文件 |

    | .c | c源代码 |

    | .c++ | c++ 源代码 |

    | .cf | 配置文件 |

    | .cnf | 配置文件 |

    | .conf | 配置文件 |

    | .dat | 数据文件 |

    | .db | 数据库文件 |

    | .dbf | 数据库文件 |

    | .err | 错误日志文件 |

    | .gif | 图形交换格式 |

    | .gz | Gzip压缩文件 |

    | .htm | HTML |

    | .html | HTML |

    | .idx | 索引文件 |

    | .jar | Java 归档文件 |

    | .ksh | Korn shell 脚本 |

    | .lic | 许可证文件 |

    | .lock | 系统锁文件 |

    | .log | 日志文件 |

    | .out | 脚本输出文件 |

    | .pl | Perl 脚本文件 |

    | .sh | Shell 脚本 |

    | .tar | 归档文件 |

    | .txt | 文本文件 |

    | .war | Java Web 归档文件 |

    | .Z | 压缩文件 |

    | .zip | Zip 文件 |


    # 常用目录名称


    某些目录名称在 UNIX 的多个位置使用。你可能在运行于 UNIX 平台的应用程序中看到它们。这种标准化让我们直观地知道去哪里查找以及放置特定类型的文件。列表包含了常用目录的名称和说明。


    | 名称 |  |

    | :--- | :--- |

    | bin | 包含可执行文件、工具和系统启动所需的就绪程序的目录。将其想象成物理存储桶。 |

    | dev | 此目录包含支持设备的文件。 |

    | etc | 包含配置文件的目录。在不知道自己在做什么之前，不要在这里乱搞。至少在编辑任何配置文件之前，要创建一个副本。在未来的某个时刻，你会感激自己采取了在更改前先备份的习惯。
    |

    | home | 这是一个充满子目录的目录。每个在系统中拥有账户的用户都应该有一个子目录。用户的家目录是用户登录系统时所处的位置。家目录是用户应该存储所有个人文件的地方。
    |


    '
