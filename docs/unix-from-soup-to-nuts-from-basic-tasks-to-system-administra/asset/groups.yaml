    ## The ls (List) Command


    The ls or list command is perhaps the easiest-to-remember and most frequently
    used command. Type ls at any location in a UNIX operating system, and you will
    get a list of all visible files and directories contained in the current directory
    you are sitting in. To generate a similar list of a directory you are not sitting
    in, you either change to that directory first or just feed the command the absolute
    directory path as input. The ls has plenty of options that can accompany it to
    show you various pieces of information or arrangements of the information. I typically
    use the -a and the -l options.


    The -a is for all of the current directory''s contents. Remember earlier I indicated
    that ls would show all of the visible files and directories. If you use the -a
    option, you will also see the invisible contents. The invisible contents are any
    file or directory that has a dot or period as the first character. The -l option
    is for long output. I use this option to show me all of the information I will
    need related to the ownership, permissions, etc., of the subject I am looking
    at. Although the -a stands for all, I tell myself -al together means all, because
    that way I can see all of the files and all of the information related to the
    files. That was the easiest way for me to remember it when I was getting started
    with UNIX. The remaining typically used and sometimes-useful options for the ls
    command are included in the following table.


    | ls Command Options | Command | Options | Description |

    |---|---|---|---|

    | | ls | | Lists the contents of a directory. |

    | | -a | Displays all files including hidden files. |

    | | -c | When used together with -lt displays files in modified time order. |

    | | -g | Displays files in long format with group name but not the owner. |

    | | -h | Display in human readable format. |

    | | -l | Displays files in long format. |

    | | -t | Displays files in create time order. |


