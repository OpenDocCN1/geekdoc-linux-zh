    G（吉字节）。这比在 `df` 显示可用磁盘时进行数学计算要容易得多。


    `df` 命令以 512 字节块显示可用磁盘。


    inode（索引节点）是一个跟踪文件信息的小家伙。我听说过 inode 这个词是“I''m Not Operating DOS”（我不是 DOS）的缩写。事实是，大多数
    UNIX 用户可能无法给你关于 inode 是什么或其用途的充分解释。每个文件或目录都被分配了一个 inode。inode 存储了如下信息：

