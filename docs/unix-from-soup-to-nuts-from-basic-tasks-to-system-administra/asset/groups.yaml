    # System Configuration Files


    The system configuration files are a set of files that provide instructions to
    the kernel and the utility programs. The kernel and the utility programs read
    the configuration files at startup to decide how to behave during execution time.
    The UNIX kernel and utilities are flexible programs, and certain aspects of their
    behavior can be controlled. The configuration files are the medium you can use
    to exercise this control. Since the kernel and utility programs read the configuration
    files at startup, it usually takes a reboot of the system or a restart of a service
    or utility program before the changes to the configuration files are noticed and
    the changes are implemented. It should be noted that startup means means different
    things for the kernel than it does for a utility program.


    To the kernel, startup means to reboot the operating system. While it is possible
    to make the kernel refresh itself by rereading the configuration files, it is
    much easier to reboot the entire operating system. However, make sure you understand
    what the changes to the kernel will affect before you implement them. I recommend
    making any system changes on a test system first. As a matter of fact, when you
    are testing a new kernel parameter, you should not only verify that the system
    reboots successfully, you should also verify that all of the normal application
    functions still work for a while. Sometimes it can take a bit for problems to
    show up after a configuration change.


    To utility programs, startup or restarting is much simpler than dealing with the
    system Kernel. The operating system will chug along just fine whether or not most
    utility programs are running. Therefore, you can shut down a utility program or
    the service it provides independent of the operating system. In other words, leave
    the operating system running and just kill the utility program. Then use the normal
    startup process to reinitialize and start the utility program. If it starts up,
    monitor it for a while to verify the old functionality you wanted to keep still
    there, as well as to verify that the changes you made have accomplished the desired
    results.


    One example of a system configuration file is the filesystem table. The filesystem
    table is named differently depending on what version of the UNIX or Linux operating
    system you are running. Some of the systems I have used'
