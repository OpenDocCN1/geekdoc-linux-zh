    shell 字段，将用户的默认登录 shell 设置为 `rbash`。


    以下项目记录了对使用受限 shell（restricted shell）作为 shell 环境的用户特定限制。受限 shell 不允许用户执行以下操作：


    - 更改工作目录：`cd` 命令无效。如果使用 `rbash` 的用户尝试使用它，将得到错误信息：`bash: cd: restricted`。

    - 将输出重定向到文件：不允许使用重定向符号 `>`、`|`、`<>` 和 `>>`。

    - 为环境变量 `SHELL` 或 `PATH` 分配新值。

    - 指定任何包含斜杠（`/`）的路径名。shell 将当前目录之外的文件视为“未找到”。

    - 使用内置命令 `exec`。

    - 将包含 `/` 的文件名作为参数传递给内置命令。

    - 在启动时从 shell 环境导入函数定义。

    - 使用 `-f` 和 `-d` 选项添加或删除内置命令。

    - 为内置命令指定 `-p` 选项。

    - 使用 `set +r` 关闭受限模式。


    `rbash` 限制在用户的 `.bash_profile` 和环境文件运行后生效。因此，谨慎的系统管理员会在授予客用户访问受 `rbash` 控制的之前，将用户的
    `.bash_profile` 和 `.bashrc` 的所有者改为 `root`，并将这些文件设置为只读。用户的家目录也也应该是只读的。


    这意味着 `rbash` shell 用户的整个环境都在 `/etc/profile` 和 `.bash_profile` 中设置。由于用户无法访问 `/etc/profile`
    且无法覆盖 `.bash_profile`，这允许系统管理员根据自己的需要配置环境，而无受限用户逃逸到另一个 shell 或更改其环境配置的危险。


    我使用了两种方法来限制某些类型用户的操作。第一方法是将用户限制在一个目录中，并在 `PATH` 环境变量中为其放置一组安全的命令供受限账户使用。限制访问或权限有限的用户操作的第二种方法是创建一个用户可以登录的屏幕，他们可以在菜单中选择操作。此类选择可能包括生成为用户设计的特定报告、查看备份统计数据或查看系统日志。


