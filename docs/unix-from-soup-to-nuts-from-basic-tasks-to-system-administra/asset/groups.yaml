    # ROBERT B. FAY


    window titles, desktop resizing, icons, toolbars, desktop backgrounds/menus, and
    many other user interface elements. Some window managers also ship with their
    own set of desktop applications like file browsers, mail clients, and other common
    utilities.


    Because the window manager is just a piece of software that sits on top of X,
    there may be several different GUIs to choose from on one given UNIX system. Linux
    systems, in particular, often have a number of different GUIs to choose from at
    the console login screen (or via some other mechanism once you''ve logged in).


    There are many window managers available for UNIX systems. Because the open-source
    nature of UNIX, most window managers either work on all UNIX systems out of the
    box or can be configured to do so with a little effort. The CDE, KDE, and Gnome
    window managers tend to be more widely used than others. Their popularity is largely
    because of their pleasant and intuitive feel and functionality. They are also
    widely available either on the Internet or come prebundled with popular flavors
    of UNIX.


    The Common Desktop Environment - CDE is an open standard that has had commercial
    success. Parts of CDE grew out of an older desktop environment called Motif. CDE
    ships, or has shipped, with Sun, HP, and IBM workstations. CDE is available from
    commercial sources for other operating systems as Linux.


    The K Desktop Environment otherwise known as KDE is an open source desktop environment
    for UNIX systems. KDE is included with some distributions of Linux as the default
    window manager. KDE is open source and can be used on any UNIX/X11 system. Due
    to its open source roots, KDE is primarily used on free UNIX operating systems
    as Linux and FreeBSD.


    The Gnome window manager is an open source desktop environment for UNIX systems
    that competing with KDE for the title of the most popular window manager in the
    open systems community. Gnome is included with some distributions of Linux as
