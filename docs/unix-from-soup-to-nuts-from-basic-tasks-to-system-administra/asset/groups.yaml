    was the driving factor behind the creating of the UNIX operating system was the
    requirement for a multi-user, multi-tasking operating system for programmers.


    The job of an operating system is to control system hardware like the processor,
    memory, and disk drives to perform useful tasks. When you want the computer to
    do something for you, start a program, copy a file, or display the contents of
    a directory, it is the operating system that must perform tasks for you.


    The philosophy behind the design of UNIX was to provide simple yet powerful utilities
    that could be pierced together in a manner to perform a wide variety of tasks.
