- md: '

    ## ROBERT B. FAY


    The following table lists common shells found on UNIX systems:


    | Description | Absolute Path | Shell |

    | --- | --- | --- |

    | Bash shell | /usr/bin/bash | bash |

    | Bourne shell | /usr/bin/sh | sh |

    | C shell | /usr/bin/csh | csh |

    | Korn shell | /usr/bin/ksh | ksh |

    | Tcsh shell | /usr/bin/tcsh | tcsh |

    | Zsh shell | /usr/bin/zsh | zsh |


    There is usually more than one way to perform a task in UNIX. You will develop
    preferences for certain methods that may be different than others. That is fine
    as long as you remember neither is necessarily the only or best method. To demonstrate
    this concept, I have listed different methods of displaying what shell I am using.
    All three are about the same amount of keystrokes. In other situations, different
    methods may use drastically different amounts of keystrokes. Given that situation,
    I will almost always opt for the fewer keystrokes method. However, folks who type
    really fast are wasting many keystrokes by constantly hitting the backspace to
    correct what they mistyped.


    ```

    echo $SHELL

    env | grep SHELL

    set | grep SHELL

    ```


    The preceding commands will give you slightly different output, but they will
    include the value of your current environment variable. To change your active
    shell, you need to change the value of your environment variable and then export.
    The export part tells the system to re-read the specified environment variable
    and implement it. To change your shell to bash from other shell, you should execute
    the following syntax:


    ```bash

    export SHELL=/usr/bin/bash

    ```


    The change in shells will not be immediately apparent until you try to use features.
    The operating system will allow you to run multiple nested shells. However, when
    you set up variables, they will not be available in nested shell. To return to
    the previous shell, just type "exit" and hit the return key once. Keep track of
    how many shells you are running or can log out of them.


    ## Standard Input and Output


    Standard input and output, or I/O as it is called, refers to the interface. Standard
    input comes from the keyboard or mouse if you are using a graphical interface,
    and standard output goes to the screen. Other types of input and output can come
    from or go to commands and other devices.


    The output from one command can be used as the input to another command. The "|"
    character is called a pipe. Just like a pipe in the plumbing of your house, it
    transports something from one place to another. Only in this case are we using
    pipes to transport data. Data flows through pipes from left to right. So the output
    from the command to the left of the pipe becomes the input for the command to
    the right of the pipe. Go ahead and try the following command. It is harmless.
    Without getting far ahead, it tells you that this command will display active
    process information one page at a time. Use the enter key to advance through the
    pages. If you are using a system that does not have the command, substitute the
    "more" command in its place.


    ```bash

    ps -ef | more

    ps -ef | more

    ```


    ## Getting Started


    ### Connecting To UNIX


    There are a couple of ways you can access a UNIX system. The main mode of access
    to a UNIX machine is through a terminal. A terminal includes a keyboard and a
    video monitor. The Kernel runs a process called getty that connects to the UNIX
    system, accepts input from the terminal and sends output to the terminal. The
    getty processes are utility programs, and they must be told the capabilities of
    the terminal in order to correctly read from and write to the terminal. If the
    getty process receives incorrect information about the terminal type, unexpected
    results can occur. To display the current terminal type, enter the following syntax
    at the command prompt:


    ```bash

    echo $TERM

    ```


    To change your current terminal type to vt100, enter the following syntax at the
    command prompt:


    ```bash

    export TERM=vt100

    ```


    I have found that vt100 or vt220 is the correct emulation for terminal programs
    running on personal computers. If you are using just a dumb terminal, then you
    should be able to tell the operating system exactly what kind of display you are
    using. It should say on the front of the monitor what type of display it is. If
    not, the old "wyse60" seems to work on many dumb terminals. The wyse60 emulation
    mimics the appearance of a Wyse model 60 terminal, which is popular because of
    its high-resolution character cell that displays crisp characters. You will appreciate
    the high-resolution characters when you are pulling an all-nighter because someone
    promised you would deliver something on an unreasonable schedule, and you get
    left holding the bag.


    ## The System Console


    ## UNIX From Soup To Nuts


    The console is a special type of terminal that is recognized when the system is
    started. Some UNIX system operations must be performed at the console. Typically,
    the console is only accessible by the system administrator. Facilities that have
    large numbers of rack-mounted servers do not have room for a physical console
    to be attached to each server individually. For this reason, some vendors have
    incorporated into their hardware design a port that can be accessed either by
    way of a management network connection or a temporary laptop connection. I say
    temporary because the console does not need to be connected for UNIX to perform
    its functions. It is just required in the event that maintenance or some type
    of failure prohibits remote connection.


    SUN Microsystems has developed what is known as a LOM (Lights Out Management)
    port on their systems. The LOM port will remain functional even if the operating
    system is down as long as power is connected to the server. The LOM connection
    will allow the system administrator to perform maintenance when the system is
    not fully functional or when connectivity is not available. Other versions are
    ALOM, iLO, or IDMI.


    ## Dumb Terminals


    ### ROBERT B. FAY


    Some terminals are referred to as "dumb" terminals because they only have the
    ability to send characters as input to the UNIX system and receive characters
    as output from it. They cannot execute programs or perform any computing on their
    own. Personal computers are often used to emulate dumb terminals, so they can
    be connected remotely. There are plenty to choose from. Many are free and some
    are not. I use the same free program at work and at home. It is called "putty,"
    and I recommend it highly. The price is right, you can customize and save your
    session parameters, and it has different connection methods available, including
    ssh, which is required by most security-conscious organizations. To obtain a copy
    of putty, just search for it with your favorite search engine. It is small and
    portable. I carry around a copy of putty on a flash drive so I have access to
    the environment I am used to working in with little no setup. I also keep a copy
    on a CD in the disaster recovery bins at work. This is a good idea, you never
    know if you will be able to download stuff from the Internet following a disaster.

