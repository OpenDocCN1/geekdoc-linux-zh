  mdcn: "\n\n## ROBERT B. FAY\n\nawk 并不真正适合处理大型或复杂的任务。由于 awk 是一种解释型语言，awk 脚本需要相应的二进制文件来运行。这意味着基本上你无法编译\
    \ awk 脚本后，然后在一个没有包含 awk 二进制程序的系统上单独运行它。与编译后的代码相比，awk 脚本的运行速度较慢，因为每次运行 awk 脚本时，操作系统都会调用\
