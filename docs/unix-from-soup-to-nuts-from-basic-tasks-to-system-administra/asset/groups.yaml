    - 7. 节点（inode）存储有关文件的信息，如文件大小、所有者 UID、所有者 GID、一个唯一标识符（inode 号）、文件权限模式；以及指示 inode
    最后更改时间的时间戳（ctime）、文件内容最后修改时间（mtime）和文件最后访问时间（atime），以及跟踪指向 inode 的链接数的计数器。

