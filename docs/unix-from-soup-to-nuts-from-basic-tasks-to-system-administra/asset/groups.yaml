    # Find 命令


    `find` 命令的作用正如其名。它寻找东西。`find` 命令有非常有用的操作数，可以与其结合，帮助你通过名称、年龄或大小查找文件。我最喜欢的查找命令的方法是使用名称操作数，因为它允许使用通配符。这意味着我不需要确切知道文件的文件名就能找到它。此外，在大型系统中查找文件可能需要一些时间，所以如果你知道文件位于系统的哪个部分，或者至少是哪个文件系统，可以通过告诉
