    ## The file Command


    The file command is used to discover what type of files you are looking at or
    working with. Unlike other operating systems, UNIX does not require different
    file types to include a file extension to identify what type of file it is. You
    may use file extensions like txt or exe, but the extensions are for the convenience
    of humans only. The UNIX operating system does not need them. When you need to
    know what type of file a file is, just use the file command. The syntax is simple.
    You can display the file types of all files in the local directory by typing "file
    *", or you can specify a specific file by name as follows: file filename. Following
    is an example of output from the file command issued in a directory that contains
    a tar file, a sub-directory, a text file, a zip file, and an executable script
    file.


    file *


