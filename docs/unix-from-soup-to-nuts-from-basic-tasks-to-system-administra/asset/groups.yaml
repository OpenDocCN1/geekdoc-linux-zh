    ```


    The above command string sends the output of the ls -al command to the file named
    file.out. If the file.out did not exist before, it has just been created. If the
    file.out file did exist before, it has just been overwritten. In either case,
    the output is sent to the file only. No output is displayed on the screen.


    ## ls -al | tee file.out


    The above tee sends the output of the ls -al command to the screen as well as
    a file named file.out. If the file.out did not exist before, it has just been
    created. If the file.out did exist before, it has just been overwritten. Notice
    the tee command requires the help of the pipe when used in this manner. This is
    because tee is performing a command function rather than simply redirecting output.


    ## Quoting Rules


    The UNIX shell uses three characters for quoting: single quotes (''), double quotes
    ("), and backslashes (\). The following table explains the different methods of
    quoting and when to use them. Quotes allow characters to be used as literals.
    This allows the operating system to ignore special characters and words that would
    normally be commands.


    | Type | Description | When to Use Each Method of Quoting |

    | --- | --- | --- |

    | \ | Backslash | A backslash (\) protects the next character except if it is
