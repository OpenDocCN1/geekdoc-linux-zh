    # Control of Built-in Commands


    The bash shell includes several built-in commands to give users more control over
    which commands are executed, or more accurately, the command and built-in built-ins
    change the order in the bash shell searches for commands. The enable built-in
    allows other built-in commands to be selectively enabled or disabled. On operating
    systems that provide the dynamic loading feature, new built-ins may be loaded
    into the current shell from an object file.


    The newly loaded built-ins will have access to all of the active shell facilities.
    Clear as mud, right? Okay, think of a built-in command as something that is part
    of the shell itself. The shell already knows about it when you ask for it to be
    executed, the bash shell just executes it right away thinking about it. When a
    command is not built-in, the bash shell has to fork a new process to look for
    the command. When it finds it, it executes it. So think of using the built-ins
    as taking out the middleman.


    # The Directory Stack


    The bash shell provides a “directory stack”, to which directories are added that
    you have recently visited. As you change your current working directory, the [pushd]
    builtin adds the directory to your directory stack. The [dirs] builtin displays
    the current contents of your directory stack. The contents of your directory stack
    may also'
