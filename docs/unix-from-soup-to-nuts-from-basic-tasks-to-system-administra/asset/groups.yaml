    - 文件系统 (ufs);

    - 日志文件系统 (jfs);

    - 网络文件系统 (nfs);

    - CDrom 文件系统 (cdfs);

    - (ext2)，许多 Linux 发行版的默认文件系统类型；

    - (ext3)，它本质上是 ext2 加上了日志功能；

    - (devfs)，用于设备的特殊文件系统；

