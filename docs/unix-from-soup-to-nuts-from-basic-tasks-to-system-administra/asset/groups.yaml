    The awk programming language, or sometimes called the awk line editor, is used
    to format output and omit unnecessary information from command output. The following
    example directs input into awk with a pipe. It is then used to select the desired
    fields from the input and displays them on standard output. The second example
    shows the output without using awk to format the output. awk is mentioned in this
