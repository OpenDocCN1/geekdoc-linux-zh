    with searching for occurrences stated with double digits. So if you are having
    problems with a double-digit occurrence edit, ask your system administrator nicely
    to update the sed binary in your system. However, realistically speaking, some
    other system requirement or security bulletin should have required a newer version
    of binaries before you make your request.


    ## Restricting sed by Line Number


    Restricting sed edits to a specific line number is easy. You just insert the line
    number after the first tick mark and before the edit option. In the following
    syntax example, I want to perform a substitution only on the third line of the
    input file.


    ```bash

    #sed ''3 s/abc/ABC/'' < filename

    ```


    ## Restricting sed to Ranges of Lines


    Restricting sed edits to a range of lines within a file is almost as easy as restricting
    sed edits to a specific line number. The difference is that you have to identify
    the first and last numbers of the range and separate them with a comma. In the
    following syntax example, I want to perform a substitution only on the lines within
    the range of line three through line thirty of the input file.


    ```bash

    #sed ''3,30 s/abc/ABC/'' < filename

    ```


    ## Combining sed with Other UNIX Programs


    Similar to other UNIX utilities, part of the flexibility of sed stems from how
    easy it is to combine sed syntax with another UNIX command to perform a more powerful
    function than either utility is capable of individually. When I say combine, I
    mean use in conjunction with. Don''t waste your time trying to actually rewrite
    the binaries to perform functions they were not originally intended for. To combine
    with another UNIX command, just use the pipe "|" to feed the sed output to another
    UNIX command as input. You may also use the pipe to feed sed input from the output
    of other UNIX commands. The following table includes examples of sed being used
    at the beginning, in the middle, and at the end of various combinations of combined
    UNIX commands. Check out the examples and then come up with a few of your own
    and try them out. The coins file refers to the file used in the awk section.


