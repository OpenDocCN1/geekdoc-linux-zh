    /usr section of the operating system. Doing so without cause may be detrimental
    to your operating system. The /usr directory is actually an acronym for UNIX shared
    resources. This is where most of your commands live.


    ## Utility Programs


    The utility programs are really the core of the UNIX command set. These programs
    include simple utilities, like email and word processing, as well as complex utilities,
    like the shell that allows you to issue commands to the operating system. There
    are not clearly defined sub-categories of UNIX utilities, because UNIX was designed
    for programmers in mind and as is not as intuitive as operating systems that were
    designed with the general public in mind.


    Some utility programs are definitely used for system or administrative functions,
    like mkfs to make new filesystems or fsck to check the status and integrity of
    filesystems. You will know if a utility is for system use rather than for the
    general population of users if you try to run one while logged in as a user other
    than the root user; the operating system will respond with a message like “mkfs:
    Operation not allowed” or something equally as rude. The system messages are not
    very friendly, but they get their point across. They can be very useful once learn
    how to read them. Sometimes they point you right to the problem. The previous
    one, for example, tells me that I am not allowed to use the mkfs command. In other
    words, the user I am logged in as has inadequate permissions to access or execute
    the mkfs file or command. Remember to UNIX, everything is a file.


    ## System Configuration Files


    The system configuration files are a set of files that provide instructions to
    the kernel and the utility programs. The kernel and the utility programs read
    the configuration files at startup to decide how to behave during execution time.
    The UNIX kernel and utilities are flexible programs, and certain aspects of their
    behavior can be controlled. The configuration files are the medium you can use
    to exercise this control. Since the kernel and utility programs read the configuration
    files at startup, it usually takes a reboot of the system or a restart of a service
    or utility program before the changes to the configuration files are noticed and
    the changes are implemented. It should be noted that startup means different things
    for the kernel than it does for a utility program.


    To the kernel, startup means to reboot the operating system. While it is possible
    to make the kernel refresh itself by rereading the configuration files, it is
    much easier to reboot the entire operating system. However, make sure you understand
    what the changes to the kernel will affect before you implement them. I recommend
    making any system changes on a test system first. As a matter of fact, when you
    are testing a new kernel parameter, you should not only verify that the system
    reboots successfully, you should also verify that all of the normal application
    functions still work for a while. Sometimes it can take a bit for problems to
    show up after a configuration change.


    To utility programs, startup or restarting is much simpler than dealing with the
    system Kernel. The operating system will chug along just fine whether or not most
    utility programs are running. Therefore, you can shut down a utility program or
    the service it provides independent of the operating system. In other words, leave
    the operating system running and just kill the utility program. Then use the normal
    startup process to reinitialize and start the utility program. If it starts up,
    monitor it for a while to verify the old functionality you wanted to keep still
    there, as well as to verify that the changes you made have accomplished the desired
    results.


    One example of a system configuration file is the filesystem table. The filesystem
    table is named differently depending on what version of the UNIX or Linux operating
    system you are running. Some of the systems I have used From Soup To Nuts call
    the filesystem table names like [vfstab], [fstab]. The filesystem table is a configuration
    file that tells the Kernel to mount all of the filesystems on the disk drives
    as well as when to mount them. Another example is the syslog log configuration
    file [syslog.conf], which tells the Kernel how to record the various kinds of
    events and errors it may encounter. The filesystem table and the syslog.conf file
    can be found in the /etc directory.


    ## Protocols


    A protocol is a set of rules that the operating system must use to communicate
    with other computers. By adhering to the protocol standards, computers understand
    the format of the communication for a given task. For example, Hypertext Transfer
    Protocol (HTTP) outlines the rules for a computer''s web browser to interpret
    files it is accessing on a server so that it can accurately display a web page
    on your monitor when the server responds to your request for a page.


    The following table lists some common protocols you may have already become familiar
    with or will surely encounter in your dealings on a UNIX computer. A more complete
    list of protocols can be viewed in the [protocols] file located at /etc/inet/protocols.
    A list of services supported by these protocols can be viewed in the [services]
    file located at /etc/inet/services.


    | Protocols | Description |

    | :--- | :--- |

    | FC | Fibre Channel |

    | FTP | File Transfer Protocol |

    | HTTP | Hypertext Transfer Protocol |

    | ICMP | Internet Control Message Protocol |

    | IP | Internet Protocol |

    | LDAP | Lightweight Directory Access Protocol |

    | NTP | Network Time Protocol |

    | POP | Post Office Protocol |

    | TCP | Transmission Control Protocol |

    | UDP | User Datagram Protocol |


    You may or not have noticed the difference with the Fibre Channel at the beginning
    of the previous table. While it is a valid protocol that I use regularly, you
    probably will not deal with this unless you are managing a storage network (SAN).
    The reason I added FC to the list of protocols was to make you aware that not
    protocol acronyms end with “P”. Most of them do, but it is not an industry requirement.
    Additionally, for those of you that have not dealt with a SAN or fibre optics,
    the correct spelling for fibre is “fibre” and not fiber”. spell checker does not
    like fibre, but that is the way it is. If you want fiber, have a bran muffin.


    ## Services


    A service is a tool or function of the operating system that makes something available
    to you. Most services in a UNIX environment are related to networking or system
    security. For example, the Domain Name Service (DNS) translates human recognizable
    names to IP addresses and vice versa. This is a useful service for networking
    between two or computers because the operating system uses IP addresses to identify
    computers, but it is easier for people to remember names like Web_Server or Jupiter
    than an IP address like 192.168.10.1. The following table identifies services
    that are available on UNIX systems.


    | UNIX Services | Description |

    | :--- | :--- |

    | mail | Email service |

    | news | Print news items |

    | dns | Domain name service |

    | nfs | Network file service |

    | nis | Network information name service |

    | whois | Internet user name directory service |


    ## The Shell


    The *shell* is a command programming language that provides an interface for users
    to communicate with and make requests from the UNIX operating system. Before window
    systems were developed, the shell was the only interface available to UNIX users.
    The /etc/shells file will list all of the shells available for your system. If
    this is not the exact location on your system, the file should still be called
    shells or some variation of the word “shell”. The following illustration demonstrates
    the shell’s role as a barrier of protection from the users. Like a physical shell
    or wall if you will, the UNIX shell protects what is inside from being damaged
    or affected by what is going on outside. The shell is a good thing. The shell
    is there for reason.

