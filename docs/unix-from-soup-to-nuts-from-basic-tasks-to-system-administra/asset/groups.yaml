    原始版本发生了巨大变化。由于经过了向 C 语言的完全重写，并且多年来由不同的供应商开发版本，上述内核的布局可能并不适用于你正在使用的版本。顺便提一下，当你读
    `/usr` 这个名字时，你可能把它读作“user”，这通常被认为是正确的发音。但请注意，这个目录并不包含你的用户信息。我在书中通过不同的方式来阐述这一点，因为它非常重要。系统用户不应该在操作系统的
    `/usr` 部分胡乱。无故这样做可能会对你的操作系统产生不利。`/usr` 目录实际上是 UNIX shared resources（共享共享资源）的缩写。这是你大部分命令所在的地方。


    ## 实用程序 (Utility Programs)


    实用程序是 UNIX 命令集的核心。这些程序包含了简单的实用程序，如电子邮件和文字处理，以及复杂的实用程序，如允许你向操作系统发布命令的 shell（壳）。UNIX
    实用程序没有明确定义的子类别，因为 UNIX 的设计初衷是针对程序员的，不像那些为普通公众设计的操作系统那样直观。


    某些实用程序显然用于系统或管理功能，例如用于创建新文件系统的 `mkfs` 或用于检查系统状态和完整性的 `fsck`。如果你尝试以 root 用户以外的用户登录并运行某个实用程序，你就会知道该实用程序是供系统使用的而非供普通用户使用的；操作系统会返回类似“mkfs:
    Operation not allowed”或同样粗鲁的消息。系统信息并不友好，但它们传达了意图。一旦学会了如何阅读它们，它们会非常有用。有时，它们会直接指出问题所在。例如，上一个信息告诉我我不被允许使用
    `mkfs` 命令。换句话说，我登录的用户没有足够的权限访问或执行 `mkfs` 文件或命令。记住，在 UNIX 中，万一切皆文件。


    ## 系统配置文件 (System Configuration Files)


    系统配置文件是一组为内核和实用程序提供指令的文件。内核和实用程序在启动时读取配置文件，以决定在执行期间如何行事。UNIX 内核和实用程序是灵活的程序，它们行为的某些方面是可以控制的。配置文件就是你执行这种控制的媒介。由于内核和实用程序在启动时读取配置文件，通常需要重启系统或重启服务或实用程序，配置文件的更改才会被注意到并生效。需要注意的是，“启动”对于内核和对于实用程序来说具有不同的含义。


    对于内核来说，启动意味着重启操作系统。虽然可以通过重新读取配置文件让内核刷新自身，但重启整个操作系统要简单得多。然而，在实施更改之前，请确保你理解内核的更改将影响什么。我建议先在测试系统上进行任何系统更改。事实上，当你测试新的内核参数时，不仅要验证系统是否成功重启，还要验证所有正常的应用程序功能在一段时间内是否仍然正常。有时在更改配置后，问题需要一段时间才会显现。


    对于实用程序来说，启动或重启比处理系统内核要简单得多。无论大多数实用程序是否在运行，操作系统都能良好运行。因此，你可以独立于操作系统关闭某个实用程序或其提供的服务。换句话说，让操作系统保持运行，直接杀掉该实用程序即可。然后使用正常的启动过程重新初始化并启动实用程序。如果它启动了，监控它一段时间，以验证你想要保留的老功能是否仍然存在，并验证你所做的更改是否实现了预期结果。


    系统配置文件的一个示例是文件系统表（filesystem table）。根据你运行的 UNIX 或 Linux 操作系统系统的不同，文件系统表的命名也不同。我用过的一些“从入门到精通”系统将文件系统表命名为
    `[vfstab]`、`[fstab]`。文件系统表是一个告诉内核挂载磁盘驱动器上所有文件系统以及何时挂载的文件。另一个示例是 syslog 日志 `[syslog.conf]`，它告诉内核如何记录它可能遇到的各种事件和错误。文件系统表和
    `syslog.conf` 文件可以在 `/etc` 目录下找到。


    ## 协议 (Protocols)


    协议是操作系统必须使用以与其他计算机通信的一set规则。通过遵循协议标准，计算机可以理解针对特定任务的通信格式。例如，超文本传输协议（HTTP）概述了计算机网络浏览器解释其在服务器上访问的文件的规则，以便当服务器响应你对页面的请求时，能够在你的显示器上准确显示网页。


    下表列出了一些你可能已经熟悉或在操作 UNIX 计算机时一定会遇到的常见协议。更完整的协议列表可以在位于 `/etc/inet/protocols` 的 `[protocols]`
    文件中查看。这些协议支持的服务列表可以在 `/etc/inet/services` 的 `[services]` 文件中查看。


    | 协议 (Protocols) | 说明 (Description) |

    | :--- | :--- |

    | FC | 光纤 (Fibre Channel) |

    | FTP | 文件传输协议 (File Transfer Protocol) |

    | HTTP | 超文本传输协议 (Hypertext Transfer Protocol) |

    | ICMP | 互联网控制消息协议 (Internet Control Message Protocol) |

    | IP | 互联网协议 (Internet Protocol) |

    | LDAP | 轻量目录访问协议 (Lightweight Directory Access Protocol) |

    | NTP | 网络时间协议 (Network Time Protocol) |

    | POP | 邮局协议 (Post Office Protocol) |

    | TCP | 传输控制协议 (Transmission Control Protocol) |

    | UDP | 用户数据报协议 (User Datagram Protocol) |


    你可能注意到了表格开头 Fibre Channel 的不同。虽然是我经常使用的有效协议，但除非你正在管理存储网络（SAN），否则你可能不会接触它。我将 FC
    加入协议列表是为了让你意识到并不是所有的协议缩写都以“P”结尾。大多数都是，但并不是行业要求。此外，对于那些没有处理过 SAN 或光纤的人来说，纤维的正确拼写是
    “fibre” 而不是 “fiber”。拼写检查器不喜欢 fibre，但事实就是如此。如果你想要 fiber，去吃个麦片松饼吧。


    ## 服务 (Services)


    服务是操作系统的一种工具或功能，可以为你提供某些功能。UNIX 环境中的大多数服务与网络或系统安全有关。例如，域名系统服务（DNS）将人类可读的名字转换为
    IP 地址，反之亦然。对于两台或多个计算机之间的网络，这是一个非常有用的服务，因为操作系统使用 IP 地址来识别计算机，但人们记住 Web_Server 或
    Jupiter 这样的名字比记住 192.168.10.1 这样的 IP 地址更容易。下表识别了 UNIX 系统可用的服务。


    | UNIX 服务 (UNIX Services) | 说明 (Description) |

    | :--- | :--- |

    | mail | 电子邮件服务 |

    | news | 打印新闻项目 |

    | dns | 域名系统服务 |

    | nfs | 网络文件服务 |

    | nis | 网络信息命名服务 |

    | whois | 用户用户名目录服务 |


    ## Shell (The Shell)


    *shell* 是一种命令编程语言，为与 UNIX 操作系统通信并提出请求提供了接口。在窗口系统开发之前，shell 是 UNIX 用户唯一的可用接口。`/etc/shells`
    文件将列出系统中所有可用 shell。如果这不是你系统上的确切位置，该文件也应该被称为 shells 或 “shell” 的某种变体。下面的插图展示了 shell
    作为保护屏障的作用。就像物理上的外壳或墙一样，UNIX shell 保护内部免受外部发生的事情的影响或损坏。shell 是件好事。shell 的存在是有原因的。


    '
