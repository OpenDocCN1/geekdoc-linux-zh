    # The sar (System Activity Reporter) Command


    Use the [sar] system activity reporter to collect and display information from
    operating system cumulative activity counters. You do not have to set these counters
    up. They are constantly collecting information and refreshing themselves. However,
    you may save sar output to a file for later reference or multiple files for comparison
    and analysis of system trends. The following example demonstrates how to use sar
    with the -t option to retrieve and display unused memory statistics with 3 samples
    4 seconds apart.


    ```

    #sar -t 4 3


    00:20:28 freemem swap


    00:20:32 139528 2734464


    00:20:36 139527 2734464


    00:20:40 139527 2734464

    ```


    Average 139527 2734464


    The following table includes useful options for the sar utility. I have found
    that database administrators like to see sar reports. You will find that you and
    the people you support will be much happier if you can write scripts they can
    run on demand for database tuning or just for their own curiosity.


    If you find that you are writing a large number of report-generating scripts for
    users, you should consider writing a menu that users can launch and select scripts
    from. You will still have to set up users with permissions to access the menu
    and individual selections on the menu, but you will only have to do it once for
    each user. This is much better than manually running the save script for a user
    all the time. It will also put an end to users coming to you and saying, "Can
