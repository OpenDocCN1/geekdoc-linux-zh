    ## wc (Word Count) Command


    The `wc` command does what the name suggests. It counts how many words are in
    the file you feed it as input. If you just want to know the number of words in
    a file, then use the `-w` option. If you just want to know the number of lines
    in a file, then use the `-l` option. If you want to know both, then just use the
    `wc` command with no options and you will get both pieces of information.


    ## wc Command Options |

    | Option | Description |

    | :--- | :--- |

    | -l | Display number of lines only. |

    | -w | Display number of words only. |


    Use the word count command to display the number of lines in testfile.


    ```

    #wc -l testfile

    ```


    Use the word count command to display the number of words in testfile.


    ```

    #wc -w testfile

    ```


