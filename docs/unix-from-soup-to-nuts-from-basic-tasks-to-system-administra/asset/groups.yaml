    - 4. PPID 代表父进程标识 (Parent Process Identifier)。

    - 5. 你可以使用 kill 或 pkill 命令结束你拥有的进程。

    - 6. 在使用 kill 命令时配合 -9 选项，如果该进程有仍在运行的子进程，将强制将其终止。会导致子进程变为孤儿进程并可能创建僵尸进程。然而，在某些情况下，确实强制结束一个进程。

    - 7. 不会死的进程被称为僵尸进程。从技术上讲，当进程处于僵尸状态时，它不再真正存在了；它只是进程表中的一个项目。它几乎不消耗系统资源。唯一的实际影响是会让
    ps 输出变得混乱，这对于试图查看进程信息的人来说非常痛苦。

    - 8. 消除死亡进程或僵尸进程的最佳方法是重启服务器。

