    程序会针对每个搜索模式扫描输入文件的每一行，并对找到的每个字符串执行相应的动作。一旦文件扫描完成，可以使用 `END` 子句来执行任何所需的最终动作。


    因此，由于所有这些示例都在统计文件中记录的数量，该示例并没有对输入行执行任何处理。整个示例只是扫描文件并执行一个最终动作：打印文件中的行数，这是由 `NR`
    变量提供的。`NR` 变量代表“记录数”（number of records）。`NR` 是 awk 的预定义变量之一。还有其他变量；例如，变量 `NF`
    给每行字段的数量。


