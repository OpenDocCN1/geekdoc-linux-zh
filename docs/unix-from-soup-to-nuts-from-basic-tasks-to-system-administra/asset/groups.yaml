    This sort of searching through a file for content is easily enough accomplished
    with other UNIX commands like grep or find, so you may ask yourself why you should
    learn how to use awk. While it is true that grep and find are capable of finding
    the gold coins in the file, awk is capable of doing so much more than just finding
    a target and displaying what it finds. For example, suppose I am not interested
    in all of the information in the coins file and just want to know the descriptions
    of the coins. With awk I can easily omit the information I do not want. To accomplish
    this, all I have to do rerun the previous awk syntax and add the numerical variable
    for the columns I want to print. In this case, I know that the description field
    contains from one to four pieces of data (words) and begins in the fifth column
    of the file. Remember for those lines in the file that have just a one- or two-word
    description, awk will just ignore the missing columns or print them as blank.
    Either way, it will look the same to you. So I would modify the previous syntax
    to include columns 5 thru 8 as follows:


    ```

    #awk ''/gold/ {print $5, $6, $7, $8}'' coins

