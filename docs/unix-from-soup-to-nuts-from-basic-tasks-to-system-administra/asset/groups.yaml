    scp command except it uses shell [ssh] for authentication. Before beginning the
    copy process, scp will ask for a password to access the remote server.


    | Command | Option | Description |

    |---|---|---|

    | scp | | Make a secure copy of a file from a remote host. |

    | | -C | Enable compression. This passes the -C flag to ssh. |

    | | -P | Preserves original file attributes like mode, access time, and modification
    time. |

    | | -P port # | Used to connect to a specific port on a remote host. |

    | | -q | Turns off the default progress meter. |

    | | -r | Recursive copy of a directory |

    | | -v | Verbose mode. Causes scp and ssh to display progress messages. May be
    used for debugging. |


    Another form of copying a file is to make a link to it. A soft or symbolic link
    is essentially a virtual copy of a file in a new location. When you make a symbolic
    link to a file, what happens instead of making a duplicate of the file, it simply
    creates a pointer to the original file.


    There are a few differences between hard links and soft links. Perhaps the most
    significant is that hard links cannot span filesystems and soft links can. Additionally,
    the first file created among hard links has the same status as those created after.
    Unlike hard links, soft links, or symbolic links as they are frequently called,
    are all dependent on the original file.


    If a file has been deleted but a process is holding it open, what will you temporarily
    end up with is an inode that has no links. The file will be removed from the inode
    table when the last process referencing the file completes.


    If you use the ls command to list the contents of the directory that contains
    a symbolic link, you will see the file name listed with the rest of the files.
    It will seem like the file is local to that directory. But if you use the ls command
    to display a long listing of the directory contents, the first character on the
    left will display an “l” to identify that the file is actually a link. The rightmost
    column in the ls -l output will display the file name, followed by an arrow that
    points to the right, followed by the original file''s name. You must identify
    the original file by absolute path when creating a link if it is not in your current
    directory. If you do not, you will get an error saying that the original file
    does not exist. You will also get the same error if you get the filename and link
    name in the wrong order. The following examples illustrate the command syntax
    to make both hard and soft links:


    ```

    #ln original_file link    (Creates a hard link)

    # ls -i /scripts/file1

    358979 /scripts/file1

    # ls -i /scripts/dir1/file1

    358979 /scripts/dir1/file1

    ```


    The above output demonstrates that the original file /scripts/file1 and the hard
    link to that file located at /scripts/dir1/file1 are using the same inode to identify
    it. So although this file appears to exist in two places, as far as the operating
    system is concerned, there is just one file.


    ```

    #ln -s original_file link    (Creates a soft link)

    # ls -i /scripts/file2

    358980 /scripts/file2

    # ls -i /scripts/dir1/file2

    413703 /scripts/dir1/file2

    # ls -al file2

    lrwxrwxrwx 1 root  root  14 Oct 23 15:52 file2 -> /scripts/file2

    ```


    # ROBERT B. FAY


    The above output demonstrates the original file /scripts/file2 and the soft or
    symbolic link to file located at /scripts/dir1/file2 are using unique inodes.
    The operating system thinks of the original file and the soft link as separate
    files. However, if you look at the ls -al output, you can see that the soft link
    is clearly pointing to the original file, as indicated by the arrow on the right
    side of the output and the “l”, which stands for link at the beginning of the
    output.


    # Moving or Renaming


    The move and rename are used synonymously in the UNIX world. The truth is, there
    is no rename command. Both functions are accomplished with the move [mv] command.
    This is because to UNIX, moving a file from one location to another is the same
    as moving a file from one name to another. Remember, UNIX uses the file''s inode
    to rename where it is. The names are just for us people. You do not need to be
    sitting in the source or destination directory of the move command syntax in order
    to move a file between them. The syntax to move a file within the same directory
    is (mv oldfile newfile). To move a file from your current directory to the /tmp
    directory, the syntax would be (mv oldfile /tmp/newfile). Actually, if the filename
    is going to be the same at the new location, you can save yourself some keystrokes
    and use the syntax (mv oldfile /tmp/). The last slash at the end of /tmp/ tells
    UNIX to drop it in the /tmp directory with the same name.


    Incidentally, it is always a good idea to use absolute paths if you are moving
    a file to a new directory it ends up where you wanted it. If you miss a file,
    you may be forced to learn how to use the [find] command. Actually, you should
    learn how to use the find command anyway, but it is better to learn how to use
    the find before you HAVE to find something. That way you are more likely to be
    successful at finding it.


    # Removing or Deleting


    The remove [rm] command is self-explanatory. It is used to remove files or directories.
    Be careful with this command. UNIX does not have a recycle bin. If you delete
    a file, it is gone. The following section discusses how to find a file, how to
    generate lists, and how to print files.


    # The Find Command


    The find command does exactly what the name implies. It finds stuff. The find
    command has useful operands that can be coupled with it to help you find a file
    by name, age, or size. My favorite way to find the command is with the name operand
    because it allows wild cards to be used with it. This means that I do not have
    to know exactly what the file''s name is to find it. Additionally, trying to find
    a file on a large system can take a while, so if you know what part of the system,
    or at least what filesystem, the file lives in, you can greatly cut down the search
    time by telling find where to start. The syntax of how to find a file by name
    named test1 starting in the /tmp directory is as follows:


    ```

    find /tmp -name test1

    ```


    # ROBERT B. FAY


    The command line syntax breakdown for the preceding command line is demonstrated
    in the following manner:


    | Command | Where to Start Looking | Operand to Use | Name of the File |

    |---|---|---|---|

    | find | /tmp | -name | test1 |


    If we do not know where to look, we may have to run the command on a few directories
    or file systems before we find it. Alternately, if you have root or superuser
    permissions, you can start looking in the “/” root directory. This tells the find
    command to look everywhere in the system beginning in the root directory. The
    reason I do not recommend beginning in the root directory if you do not have root
    privileges is that your display will fill up with messages warning you that you
    do not have permission to look in a bunch of locations. If you do have root privileges,
    then by all means go for it. You are not going to hurt anything by running a find
    command. If we were to look for a file that had the word “test” somewhere in the
    name and we had no idea where to look and we had root privileges, the command
    syntax would look like the following:


    ```

    # find / -name *test*

    ```'
