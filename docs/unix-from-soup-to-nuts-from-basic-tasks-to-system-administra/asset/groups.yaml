    # cpio


    The cpio utility is also used to perform backups. The name cpio describes the
    commands function. It is used to copy file archives in and out of devices, another
    file, or a pipe leading to another command. The input and output can be read from
    and written to tape devices or other mountable media.


    The cpio utility has many options that allow it to be quite a versatile tool,
    but personally I have never acquired a taste for it. But that does not mean the
    utility is completely without merit. I have in the past worked with another system
    administrator who seemed to be quite comfortable with regular use of cpio to perform
    backup and data transfer tasks. I think he just liked to use it because it was
    the first backup method he was taught and was comfortable with it. Like the tar
    utility, the cpio utility is free and comes with or is portable to all flavors
    of UNIX, the choice is yours.


    The cpio utility has three operating modes. the copy-in and copy-out modes copy
    files into an archive. It reads a list of filenames from standard input and writes
    the archive to standard output. An easy way to generate a list of filenames for
    input to cpio is with the find command. Just search for what you want to back
    up with the find command, and it will generate a list of absolute path filenames
    to feed to the cpio utility.


    Another cpio mode is the copy-pass mode. It copies files from one directory tree
    to another, combining the copy-out and copy-in steps. The destination directory
    is given as an argument. I recommend using the find command output as input to
    cpio as the copy-pass mode is more difficult than it needs to be.


    The cpio utility creates binary format archives by default. For the sake of compatibility,
    the creators of cpio had the foresight to have it automatically recognize which
    kind of archive it is. The cpio utility creates archives in a slightly different
    manner than tar. While tar will archive everything from its starting point on,
    including subdirectories, cpio will only archive what is exclusively instructed
    by the input list. To create an archive with the cpio command, use the -o (copy
    out) option. This will cause it to read a list of files from stdin, create the
    archive, and write the archive to stdout.


    # UNIX From Soup Nuts


    Using the input list is with the find command. To create an archive of a directory,
    including all its contents, compress it with gzip and write the results to a file.
    The following is a syntax example of how to do this:


    ```bash

    find dir1 -print | cpio -o | gzip > dir1.cpio.gz

    ```


    To perform an incremental backup with cpio of files that have changed from the
    previous day, use the following syntax: `(find dir1 -ctime -1 -print | cpio -o
    | gzip >dir1.cpio.gz)`.


    Using the find command to create the input list of files opens the door to your
    ability to be very selective in the manner in which you archive your files. A
    quick review of the find command should hopefully ignite some spark for a few
    ideas of how to generate a list of files based on age, location, owner or whatever
    else is relevant information at the time.


    Once you have developed a few of your favorite ways to create file lists, it is
    a simple step from there to put those commands into a script and execute them
    whenever you want. You can even use the systems scheduler to kick off your backup
    jobs on a regularly scheduled basis. To extract files from an archive, use the
    -i (copy in) command line. That will tell cpio to read an archive from stdin and
    extract the files from it. So, assuming the archive is compressed, do this: `gzcat
    dir1.cpio.gz | cpio -i`.


