    好了，你现在可能在对自己说，这些都很有趣，但与 UNIX 有什么关系？嗯，既然市上有这么多不同的 UNIX 版本（flavors），开发翻译文档以协助在不同版本的
    UNIX 上执行常见任务就变得很有必要。在同一个环境中，发现由不同供应商制造、支持不同版本 UNIX 的服务器的数据中心是非常常见的。这些翻译文档可能以多种形式存在，但它们统称为“罗塞塔石”。


