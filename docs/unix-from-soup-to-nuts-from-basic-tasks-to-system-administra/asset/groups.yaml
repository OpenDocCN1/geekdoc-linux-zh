    ### bc (布尔计算器) 命令


    使用 `bc` 命令运行布尔计算器工具来执行数学函数。`bc` 工具对于计算大数字非常方便用，因为它可以处理任何你能放入系统内存和交换空间（swap space）的数字。如果在命令行上定义并请求了选项、变量和数学库文件，`bc`
    工具可以完成某些非常复杂的计算。尽管如此，本节的目的是让你了解 `bc` 工具，并演示一些基础的数学函数。


    如果你对学习更多关于 `bc` 命令感兴趣，我鼓励你查阅 `bc` 的 man 手页。很快后，你就会在命令行上编写大量的公式，这些公式看起来非常像 C 语言的函数。这是因为
    `bc` 和 C 语言具有相似的语法。你将在下表中找到 `bc` 工具的一些有用选项。


    | 选项 | 描述 |

    | :--- | :--- |

    | -h | 帮助 |

    | -i | 交互模式。 |

    | -l | 定义数学库。 |

    | -q | 静默模式。（跳过欢迎消息。） |

    | -v | 显示你正在使用的 bc 版本。 |

    | -w | 显示警告。 |


    `bc` 中最基本的元素是数字。数字以十进制格式显示，所有计算都以十进制进行。数字有两个属性：长度（length）和刻度（scale）。长度是数字的数字位数，刻度是小数点后的总位数。接下来的两个示例演示了长度和刻度属性。


    示例 1: 123456


