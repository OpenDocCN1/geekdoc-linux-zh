    but sometimes they have different options available.


    ## UNIX Versus Popular Operating Systems with Graphical Windows


    Since most of us who are endeavoring to enhance our knowledge of computers and
    operating systems are already reasonably comfortable with our ability to use a
    personal computer running a Microsoft Windows operating system, it seems sensible
    to include a brief comparison between UNIX and Microsoft Windows. This is not
    intended to be a Windows bashing session. Nor is it intended to be a lecture about
    how UNIX is better than Windows. I just thought now would be a good time to bring
    your attention to features that are generally recognized to be true about the
    two types of operating systems as far as strengths and weaknesses go. However,
    I wish to be clear that I am only presenting these items as matters of my own
    opinion. You, course, are welcome to form your own opinion if you have not done
    so already.


    The UNIX operating system is a multi-user and multi-tasking environment. What
    I mean by that is that any number of people can be logged into a UNIX machine
    doing independent tasks while sharing the system resources. UNIX has many layers
    of built-in security features. These features not only restrict people from logging
    in to a UNIX machine, also govern what a person can do while logged in. UNIX is
    what is known as open system. The term open system refers to the ability to make
    changes to the operating system as well as the user’s environment. UNIX is able
    to run on multiple platforms, it is reliable and robust, and it provides an excellent
    back end for heavy transaction applications like databases, data warehouses, web
    hosting, and anyical and scientific applications.


    The Microsoft Windows operating system is a single-user environment. It has what
    most people would call a user-friendly interface. It is relatively easy to learn
    how to use. It is the market leading operating system for personal computers.
    It is easy to get compatible software for and is easy to install. All that being
    said, don''t expect to go to Berkeley or Stanford and impress people because you
    can change your wallpaper on your Windows desktop.


    ## Parts and Pieces


    The UNIX operating system is comprised of essentially three main parts: The Kernel,
    the standard utility programs, and the system configuration files. There are other
    goodies that come with it and there is plenty that can be added to it, to be sure,
    but the three aforementioned parts are what make up the original portable operating
    system.


    ## The Kernel


    The Kernel is the core of the UNIX operating system. Basically, the Kernel is
    a large program (sometimes referred to as the master control program) that is
    loaded into memory when the machine is turned on. The Kernel controls the allocation
    of hardware resources from boot time until shutdown. The Kernel knows what hardware
    resources are available, and it has the necessary programs, a.k.a. drivers, to
    talk to all the devices connected to. One of the most important high-level tasks
    the Kernel performs the scheduling of devices access. This is necessary to prevent
    two programs from trying to gain control of a device simultaneously. The Kernel
    has special rights granted it to use system resources that users do not have access
    to. This is known as overhead and defines the division between user space and
    system space.


    Originally the Kernel was located in /usr/sys and contained several sub-components
    located in various sub-directories. The configuration files were located in /usr/sys/conf,
    and the device drivers were located in /usr/sys/dev, and so on. Get the idea.
    The structure of UNIX has

