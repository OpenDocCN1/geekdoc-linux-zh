- md: '

    # UNIX


    From Soup To Nuts


    ![](img/89df3d0f73a9f8ee67c84c5b320e4e83_0_0.png)


    From Basic Tasks to System Administration


    Robert Fay, MIS


    # UNIX

    From Soup To Nuts


    Robert B. Fay


    # DEDICATION


    To my wife, Alayna, and my kids, Dakota and Kiana. May life continue to bring
    you success and happiness.


    # CONTENTS


    - Acknowledgments i

    -1 UNIX Basics Pg 1

    2 Working With Files Pg 34

    3 Editors Pg 56

    4 Filesystems, Directories, and Paths Pg 84

    5 Users, Groups, and Permissions Pg 91

    6 bash – The Bourne Again Shell Pg 104

    7 Managing Processes Pg 116

    8 Miscellaneous UNIX Utilities Pg 123

    9 Comparing, Sorting, and Compressing Pg 142

    10 Backups Pg 155


    # ACKNOWLEDGMENTS


    Robert would like to thank L.D. Bartholome for talking him into applying for his
    first position as a UNIX System Administrator. Additionally, Robert would like
    to thank Rick Parker, Lynn Harris, and Gordon Howell for the opportunity to make
    the switch from RPG programmer to UNIX System Administrator and Database Administrator.
    The ability to make that switch in career path opened new doors of opportunity.
    Robert would like to offer special thanks to his friend and study partner Susan
    Mock for her many hours of proof reading and editing.


    # 1 UNIX BASICS


    This book is intended for users of UNIX and Linux operating systems. However,
    throughout the body of this text, the discussions refer to the UNIX operating
    system unless a feature is being discussed that is unique to a distribution of
    the Linux operating system. My intent is to introduce basic and vital concepts
    that must be grasped by both users and Systems Administrators of UNIX operating
    systems alike. I have included topics in beginner UNIX training courses up through
    intermediate-level System Administration courses.


    This book is not intended to be a System Administration manual. Rather, it is
    intended to be a road map to introduce UNIX users to utilities, commands, protocols,
    and programs found on UNIX operating systems. It is written in a fashion to provide
    concepts that build on each other. Each chapter or main subject area will include
    a table of common command or utility options along with some syntax examples and
    sample output. Additionally, at the end of each chapter are a few opportunities
    for you to exercise what you have just learned. The solutions to the chapter exercises
    are provided in the back of this book. I do not recommend that you skip around
    too much the first time through reading this book. After your initial read, I
    hope you will find this book useful as a handy, easy-to-use reference.


    # Conventions Used in This Book


    The following is a list of conventions provided to help you understand the various
    used in the examples in this book as well as other mainstream UNIX documentation
    sources. I have used industry standard methods and conventions to assist you to
    seamlessly read this book and try lessons on a UNIX machine without having to
    translate anything. I believe you will find that the lessons contained in this
    book are directly portable to mainstream UNIX and Linux operating systems.


    - Dot. The dot is not to be confused with the period. The dot is used to identify
    an invisible file. If a filename begins with a dot, then the file will not show
    up when files are listed unless you specify to show you invisible files. The dot
    is also used to identify locations in a directory. One dot mean the current directory.
    Two dots mean the directory directly above where you are in the directory tree.

    - file - Is a reference to a file. This is where a file goes in the syntax of
    a command.

    - filename - Means to insert the name of your file here.

    - file.out - This is the output file from whatever syntax it is preceded by.

    - infile - This is the input file for a command.

    - " - Whatever is between the double quotes is a literal.

    - # - Pound sign. This is known in the UNIX world as a hash mark. Everything to
    the right of this is a comment and not code. The hash mark is also commonly used
    as the command prompt for the root user, but this is not a system requirement.
    The examples in this book begin with a # symbol to indicate that I am running
    these commands at the command prompt. You do not need to type the # symbol when
    you are trying these examples out on your UNIX system. If you do, you will get
    an error.

    - ! - Exclamation mark or exclamation point. This is known in the UNIX world as
    a bang symbol. The bang symbol is used in place of the word “not” as not equal
    to in a comparison statement.

    - Environment Variables - Are in all capital letters.

    - / - Slash. All slashes are forward slashes / in a directory tree. (The opposite
    of Microsoft operating systems.)

    - Blank Lines - Blank lines and other white space in a file are ignored.


    # UNIX From Soup To Nuts


    - [] Square braces. The first time a new UNIX command is introduced in this book,
    it will be surrounded by square braces so you can pick them out more easily in
    a sentence.

    - {} Parentheses. Comments and examples are enclosed in parentheses.

    - Tables – When I talk about tables, I am talking about a chart like a spreadsheet
    that contains related information in formatted columns with headers.


    # File Extensions


    A file extension is the letters that follow the dot in a filename. A file extension
    is the letters that follow the dot in a filename. A file extension is the letters
    that follow the dot in a filename. A file extension is the letters that follow
    the dot in a filename. A file extension is the letters that follow the dot in
    a filename. Since there are many types of file, I have included some of the more
    common types. I think this is much easier to read and demonstrates.


    | Common Extensions |

    | Extension | Description |

    | .bak | Backup File |

    | .c | c source code |

    | .c++ | c++ source code |

    | .cf | Configuration file |

    | .cnf | Configuration file |

    | .conf | Configuration file |

    | .dat | Data file |

    | .db | Database file |

    | .dbf | Database file |

    | .err | Error log file |

    | .gif | Graphics Interchange Format |

    | .gz | Gzipped file |

    | .htm | Hypertext markup language |

    | .html | Hypertext markup language |

    | .idx | Index file |

    | .jar | Java archive file |

    | .ksh | Korn shell script |

    | .lic | License file |

    | .lock | System lock file |

    | .log | Log file |

    | .out | Output file from a script |

    | .pl | Perl script file |

    | .sh | Shell script |

    | .tar | Tape archive |

    | .txt | Text file |

    | .war | Java web archive file |

    | .Z | Compressed file |

    | .zip | Zipped file |


    # Common Directory Names


    Certain directory names are used in more than one location in UNIX. You may also
    see them used within applications that run on UNIX platforms. This standardization
    allows us to intuitively know where to look for and where to put certain types
    of files. The following list includes the names and descriptions of common directories.


    | Name | Description |

    | bin | This is a directory that holds executable files, utilities, and ready-to-run
    programs that the system needs to boot. Think of this as a physical storage bin.
    |

    | dev | This directory holds files that support devices. |

    | etc | This is a directory that holds configuration files. Do not mess around
    in here until you know what you are doing. At the very least, make a copy of any
    configuration file before you edit it. At some point in the future, you will be
    glad you adopted the practice of making copies before changing something. |

    | home | This is a directory full of sub-directories. There should be a sub-directory
    for every user that has an account on the system. The user''s home directory is
    where the user will be placed when they log on to the system. The home directory
    is where users should store all of their personal files. |

    '
