    # File Permissions Notation


    Text representation like "-rwxr--r--",


    Displayed in UNIX long directory listings. The first character shows the file
    type. The next nine characters are permissions, consisting of three groups: owner,
    group, and world. Each group consists of three symbols: rwx, if some permission
    is denied, a dash "-" is used instead.


    Example: -rwxr--r-- 0 "-" is the type of the file.


    Symbol in the position 0 ("-") is the type of the file. It is either "d" if the
    item is a directory or "l" if it is a link or "." if the item is a regular file.


    Symbols in positions 1 to 3 ("rwx") are permissions for the owner of the file.


