    ability to be very selective in the manner in which you archive your files. A
    quick review of the find command should hopefully ignite some spark for a few
    ideas of how to generate a list of files based on age, location, owner or whatever
    else is relevant information at the time.


    Once you have developed a few of your favorite ways to create file lists, it is
