    # UNIX：从入门到精通


    ![](img/89df3d0f73a9f8ee67c84c5b320e4e83_94_0.png)


    操作系统中的路径就像荒野中的小径。你需要沿着这条路才能到达你想去的地方。`PATH` 环境变量就像一张地图，告诉操作系统你想去哪里。要查看你的 `PATH`
    中的目录，请使用 `echo $PATH` 命令。这将显示所有你可以运行的命令所在的位置，而无需告诉 UNIX 去去哪里查找它们。列表的格式是使用冒号（:`）分隔或划分的目录路径。如果一个目录不在你的
    `PATH` 变量中，那么你无法找到它或执行该目录中的命令，除非你显式地告诉操作系统它在哪里。这种显式的指示被称为绝对路径。


    绝对路径指的是系统分级结构中某处的位置。引用始终从根目录（用 `/` 表示）开始，并构建出通往目标文件或目录的路径。在使用 `cd`（切换目录）命令、配置文件或作为脚本的一部分时，绝对路径实际上是引用系统位置最准确的方法。因此，如果你想从
    `/var/tmp` 跳转到 `/usr/local/bin`，只需使用以下命令语法：`cd /usr/local/bin`。


    相对路径从你当前的工作目录开始。因此，使用 `pwd` 命令来确定执行相对命令的起点。例如，如果你想从 `/var/tmp` 切换目录 `/usr/local/bin`，只需使用以下相对命令语法：`cd
    ../ /usr/local/bin`。前面的命令语法是告诉操作系统你想向后退两个目录，然后向前三个目录到达 `/usr/local/bin`。


