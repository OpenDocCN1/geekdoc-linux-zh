    These files are read every time you log into the system. The login environment
    is determined by variable settings in a system configuration file called /etc/profile.
    You may override these settings as well as add additional variables by adding
    them to your home directory .profile. The system does not make the .profile for
    you, but it looks for it. If a user does not have a .profile, they will just get
    the environment that is setup in /etc/profile.


    You can display your current environment with the `env` or `set` commands. If
    you want to display one particular variable, you can use the `echo` command followed
    by a space, a dollar sign, and the variable name (`echo $PATH`). You can set variables
    within a shell after you are logged in without having them in your .profile, but
    they will only be available for that session. The following is an example of common
    entries found in a user''s .profile file.


    ```bash

    export PS1="$LOGNAME@uname -n:\n${PWD}>"


    export PATH=$PATH:/usr/local:


    export TERM=vt100


    set -o vi


    export EDITOR=vi


    stty erase

    ```


