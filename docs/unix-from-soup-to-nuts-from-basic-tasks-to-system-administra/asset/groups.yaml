    在 UNIX 中，完成一项任务通常有多种方法。你会对某些方法产生偏好，这些偏好可能与其他方法不同。只要你记住没有哪种方法是唯一或最好的，这没有关系。为了演示这一概念，我列出了显示我正在使用什么
    shell 的不同方法。这三种方法所需的按键次数大致相等。在其他情况下，不同方法使用的按键次数可能差异巨大。鉴于这种情况，我几乎总是选择按键次数最少的方法。然而，对于打字速度快的人来说，不断按退格键来纠正错误输入实际上是在浪费许多按键次数。


    ```

