    then move on.


    A great way to find what you are looking for is the vi search function. Once you
    have opened the man page, type a forward slash character without hitting the return
    key. The system is now waiting for you to enter a search word. Type something
    you want to search for and hit the return key. The system will jump to the first
    occurrence of the search word in the man page. If you want to jump to the next
    occurrence, just hit the “n” key and you will be off to overzealous with your
    n''s, just hit the “b” key. To learn about how to use the man page, use man to
    look up man. Also, learn to use the vi navigation functions. Reading man pages
    in their entirety can be very time-consuming and boring.


    # Command Not Found Errors


    The command not found error is very common. It usually means that you either spelled
    the desired command incorrectly or it is not in your $PATH. If you do not normally
    need the command in your path, you can execute it by entering the absolute path
    of the command. If you are sitting in the directory where the executable file
    resides, you can execute it by preceding it with a dot and a forward slash “./file”.
    The preceding trick only works to help you execute a command that your $PATH cannot
    find but you have the proper permissions to execute the file. Executing the command
    from the local directory or adding the location of the executable to your $PATH
    variable will do you no good if you do not own the file or the file does not have
    the execute bit set. However, if you do not have permission to execute the file
    or if the execute bit is not set, you will get a different error. In either of
    these cases, the error will say “Permission denied”.'
