    # 7 MANAGING PROCESSES


    A process is created every time a command is executed. In fact, depending on the
    command, you may initiate more than a single process. When you execute a command,
    your cursor will drop to the next line and sit until the process completes, unless
    you run your process in the background. It almost gives the appearance that the
    system is thinking about what you just asked it to do. When the process completes,
    your command prompt will reappear.


    The ps command is used to display information about processes. When executed without
    any options, the ps command will list information about processes you own. At
    the very least, you should see a process for your shell session and a process
    for your execution of the ps command. If you have additional shell sessions open
    with the same user account or have background jobs running, you should see information
    about those processes as well.


    When the ps command is executed with the -f option, it will display more detailed
    information about your processes. The ps command with the -e option will display
    information about all running processes regardless of who owns them. You can of
    course combine options to do something like detailed information about all running
    processes by combining the ps command with the options -e and -f.


    The execution of large batch-processing jobs has traditionally been done at night
    or on weekends. Depending on your hardware and operating system, this may or may
    not be necessary. Since we are focusing on UNIX here, it makes sense to point
    out some features of UNIX that allow you to control the timing of job processing.

