    # Job Control


    On systems that support it, the bash shell provides an interface to the operating
    system’s job control facilities. The operating system’s job control facility controls
    which processes take precedence over other processes. For example, the operating
    system performs regular housekeeping processes that have a low priority. If a
    user were to initiate a task that requires system resources, the operating system
    may decide to suspend the housekeeping duties until such time as the system resources
    are complete.


    If a user has multiple processes running, the user may decide which of their own
    processes should have a higher priority than the user’s other processes. By allowing
    the user to interface with the job control facility, the bash shell allows the
    user to direct the processes they own to be suspended and restarted or moved between
    the foreground and background.


