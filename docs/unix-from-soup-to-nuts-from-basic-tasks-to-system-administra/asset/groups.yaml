    # 7 MANAGING PROCESSES


    A process is created every time a command is executed. In fact, depending on the
    command, you may initiate more than a single process. When you execute a command,
    your cursor will drop to the next line and sit until the process completes, unless
    you run your process in the background. It almost gives the appearance that the
    system is thinking about what you just asked it to do. When the process completes,
    your command prompt will reappear.


    The ps command is used to display information about processes. When executed without
    any options, the ps command will list information about processes you own. At
    the very least, you should see a process for your shell session and a process
    for your execution of the ps command. If you have additional shell sessions open
    with the same user account or have background jobs running, you should see information
    about those processes as well.


    When the ps command is executed with the -f option, it will display more detailed
    information about your processes. The ps command with the -e option will display
    information about all running processes regardless of who owns them. You can of
    course, combine options to do something like detailed information about all running
    processes by combining the ps command with the options -e and -f.


    The execution of large batch-processing jobs has traditionally been done at night
    or on weekends. Depending on your hardware and operating system, this may or may
    not be necessary. Since we are focusing on UNIX here, it makes sense to point
    out some features of UNIX that allow you to control the timing of job processing.'
- md: '

    The first method is background processing. Running a process in the background
    refers to the ability to execute a UNIX command or script and walk away from it
    or even log out of the system without ending the process. When you run a process
    in the background, it is submitted, and the operating system gives you back your
    command line prompt so you can continue with whatever you were doing.


    The background process will sit there and wait for system resources to become
    available. Normal processes will have a higher precedence than background processes.
    Therefore, if a background process is using system resources and a normal process
    is started, the background process will give up its resources until the normal
    process ends. Then the background process will resume its processing and so on
    until it completes. A background process is initiated by following a UNIX command
    with a space and an ampersand (&) symbol.


    The second method of controlling the timing of processes has to do with sequential
    processing. To begin a process immediately after the end of a preceding process,
    place a (;) semicolon character between the two commands on the command line.
    (command1; command2)


    The third method of controlling the timing of processes has to do with parallel
    processing. To run two processes simultaneously, place an ampersand (&) character
    after each command on the command line. This essentially puts all processes in
    the background at which point the Kernel will share resources between them. (command1
    & command2). The following table is a quick reference for the ps command and the
    most useful command options used with it.


    | Command | Option | Description |

    | --- | --- | --- |

    | ps | | List process table entries. |

    | | -e | Display information about all running processes. |

    | | -f | Display more detailed information about processes. |

    | | -u | Display process information about a particular userid. You must specify
    the userid following the -u and a delimiting. |

    | | -x | Display all active processes except those connected to an active tty
    session. |

    | | -A | Display all active processes. |


