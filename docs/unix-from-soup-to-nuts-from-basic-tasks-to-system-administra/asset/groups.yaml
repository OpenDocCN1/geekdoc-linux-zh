    # Saving Time at the Command Line


    # Recalling previously typed commands at the command prompt.


    Two methods can be used to set up the recall feature in the UNIX shell environment.
    The first method is to include the line set -vi in your .profile file. This takes
    precedence over variables that may have been set up for all users. The second
    method is to set the EDITOR environment variable to vi.


    # Editing the command line so that you don''t have to retry it.


    Once the recall feature has been set up, the Esc-k key sequence (type the Esc
    escape key and the letter k key at the same time) will recall previously used
    commands to the command line. Using the Esc-k sequence will retrieve the last
    command you executed on the command line. Continuing to hit the k key will scroll
    through your previously entered commands. A command will not be executed until
    you press the enter key. If you cannot find what you are


