    # Utility Programs


    The utility programs are really the core of the UNIX command set. These programs
    include simple utilities, like email and word processing, as well as complex utilities,
    like the shell that allows you to issue commands to the operating system. There
    are not clearly defined sub-categories of UNIX utilities, because UNIX was designed
    for programmers in mind and as is not as intuitive as operating systems that were
    designed with the general public in mind.


    Some utility programs are definitely used for system or administrative functions,
    like mkfs to make new filesystems or fsck to check the status and integrity of
    filesystems. You will know if a utility is for system use rather than for the
    general population of users if you try to run one while logged in as a user other
    than the root user; the operating system will respond with a message like “mkfs:
    Operation not allowed” or something equally as rude. The system messages are not
