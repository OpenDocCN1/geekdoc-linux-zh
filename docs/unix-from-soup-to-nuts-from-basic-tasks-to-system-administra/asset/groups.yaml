    # File Extensions


    A file extension is the letters that follow the last dot in a file name. Strictly
    speaking, UNIX does not care how a file is named. But certain applications may
    depend on a file extension-naming convention. Since there are so many types of
    file extensions, I have only included some of the more common types you are likely
    to see on a UNIX operating system.


    If you are using a Linux operating system, you may notice that file names are
    displayed with different color lets depending on what type of file they are. Some
    examples are as follows: An executable file will be green, a directory will be
    dark blue, and a tar file will be red. This behavior is controlled by the variable
    called LS_COLORS. I have purposely omitted graphics files from the list because
    you cannot manually edit them from the command line. One change that I always
    make to a Linux environment when I login is to change the LS_COLORS entry for
    directories to 00 (di=0). This will change the colors of the letters from dark
    blue on a black background to white letters on a black background. I think this
    is much easier to read and demonstrates your ability to manipulate the environment
    based on file types.


    | Common File Extensions |

