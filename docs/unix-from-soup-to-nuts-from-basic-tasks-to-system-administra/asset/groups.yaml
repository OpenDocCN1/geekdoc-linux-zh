    # UNIX：从入门到精通


    ## 在设备之间移动数据


    偶尔你可能需要进行磁带到磁带的拷贝。这对于冗余和回收来说都是好主意。当你有几盘磁带，每盘磁带上只有少量数据或少量相关数据时，就可以进行磁带回收。其核心思想是将几盘磁带上的微小数据传输到一盘或更少的磁带上，从而回收浪费的磁带空间。这就是“回收”一词的由来。执行这种磁带到磁带传输的优秀工具是
    `dd` 命令。


    dd 工具用于将指定的输入文件复制到指定的输出文件。文件可以位于任何类型的可访问原始设备上。这使得它适用于原始磁盘和磁带设备。输入文件通过 `if=` 参数指定，而输出文件通过
    `of=` 参数指定。如果没有声明输入或输出文件，则执行 `dd` 命令时默认使用标准输入和输出。


    你可以可以使用可选的 `-b` 标志（后跟一个空格和一个数字）来控制块大小。块大小以字节为单位。如果你在块大小后加上 `k`，输出文件将以 1024 字节块创建。如果你在块大小数字后加上
    `b`，输出文件将以 512 字节块创建。以下示例演示了从磁带驱动器 rmt0 拷贝名为 `datafile` 的文件到磁带驱动器 rmt1 的所需语法。示例假设原始磁带设备的命名规范为
    `/dev/rmt#`。


    ```

    #dd if=/dev/rmt0/datafile of=/dev/rmt1/datafile

    ```


    dd 命令执行任务的层次比标准的 UNIX `cp` 命令更低，更适合拷贝整个磁盘分区或整个磁盘。这使得它成为备份磁盘引导扇区等系统功能的可以接受的选项。`cp`
    命令非常适合这项工作，因为它不会逐迹道地拷贝磁盘空间。它仅仅拷贝可见的文件，忽略磁盘上的空白区域、隐藏文件和仍然存在于磁盘上的已删除文件。


    dd 命令有时被戏称为“销毁数据”（Destroy Data）命令。这当然是对该命令功能的一种不准确但很幽默的描述。该命令确实拥有允许从 EBCDIC 到
    ASCII 以及反之的数据转换以及大小写转换的选项，但这些功能超出了本文的讨论。然而，如果你只有一个磁带驱动器，就不必包含此 `-f` 选项。mt 工具将使用由
    `TAPE` 环境变量定义的任何内容。如果未定义 `TAPE` 环境变量，`mt` 将假设你的磁带设备位于 `/dev/rmt/0n`。`count` 参数告诉
    mt 执行指定命令的次数，它是可选的。如果你不指定 `count` 参数，默认执行一次指定的命令。下表解释了可以与 mt 工具配合使用的的命令。


    # mt 工具命令


    | 命令 | 描述 |

    | --- | --- |

    | eof | 在磁带当前位置写入 `count` 个 EOF 标记。 |

    | weof | 在磁带当前位置写入 `count` 个 EOF 标记。 |

    | fsf |向前跳过 `count` 个 EOF 标记。磁带位于文件的第一个块。 |

    | fsr |向前移动 `count` 条记录。 |

    | bsf | 向后跳过 `count` 个 EOF 标记。磁带位于上一个 EOF 标记的开头。 |

    | bsr | 向后移动 `count` 条记录。 |

    | nbsf | 向后移动 `count` 个文件。磁带位于文件的第一个块。 |

    | asf | 绝对移动到第 `count` 个文件。这等于先回退磁带然后使用 fsf 命令向前移动。 |

    | com | 移动到磁带上记录媒体的末尾。这对于在之前写入的磁带上追加文件有用。 |

    | rewind | 回退磁带。 |

    | offline | 回退磁带并使磁带设备离线。 |

    | rewoffl | 回退磁带并使磁带设备离线。 |

    | status | 显示磁带设备的状态信息。 |

    | retension | 回退磁带，然后将其移动到卷末，然后再次回退。这样做是为了释放磁带张力。 |

    | reserve | 允许磁带驱动器在关闭设备后保持预留状态。 |

    | release | 关闭设备后释放磁带驱动器。 |

    | erase | 擦除磁带。 |


    '
