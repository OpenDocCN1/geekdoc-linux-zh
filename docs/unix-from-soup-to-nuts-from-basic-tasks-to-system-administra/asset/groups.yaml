    ## 压缩


    压缩文件和解压缩文件是用户和管理员经常需要执行的操作。通过对你不使用的文件进行压缩，你可以在 UNIX 文件系统上优化存储空间的利用，并防止在文件系统突然写满时被人指指点点。我将讨论我认为
    UNIX 世界中常见的常见的压缩工具。这三种方法是 [compress](#compress)、[gzip](#gzip) 和 [tar](#tar)。


    压缩工具背后的逻辑非常简单。它们执行任务的方式并不相同，但本质上，工具会移除你不需要的所有内容，以维持你所压缩内容的完整性。通常这意味着去掉所有不实际包含数据的空白和其他位。这些工具会以某种方式记录空白的位置，并在文件解压缩时重新插入。


    ## compress


    `compress` 命令非常直观。你只需要在命令后面跟上想要压缩的文件名即可。在使用 `compress` 命令压缩文件后，你会发现文件后面被添加了“Z”
    扩展名。这非常方便，因为它以后会提醒你它是什么类型的文件。


    要解压缩已压缩的文件，你需要使用 `uncompress` 命令，而不是带选项的 `compress` 命令。别问我为什么这样做，但它确实有效，记住它并继续即可。以下两个示例演示了如何使用这两个相应的命令进行压缩和解压缩。


    ```

    #compress filename

    ```


    ```

    #uncompress filename

    ```


    ## zcat


    `zcat` 工具用于在标准输出显示用 UNIX compress 命令压缩文件的解压缩形式。使用 `zcat` 等同于使用带有 `-c` 选项的 `uncompress`
    命令。使用 `zcat` 显示压缩文件的内容不会影响压缩文件本身。


    ## zip 和 gzip


    `zip` 压缩工具像 `compress` 工具一样，有一个配套命令来解压缩 zip 文件。你猜对了，它被称为 `unzip`。我喜欢 `zip` 命令，因为它在创建压缩文件时会告诉你它节省了多少空间。例如，如果我让它压缩一个名为
    coins 的文件，它会响应：adding coins (deflated 88%) 或其他百分比，取决于文件的内容和大小。


    zip 文件需要你告诉它为创建的新压缩文件命名什么，因为它并不是简单地压缩原始文件。`zip` 命令会创建原始文件的压缩副本并为新文件添加“.zip”扩展名。因此，如果你的目标是节省空间，你需要在创建压缩后的
    zip 文件后删除原始文件。


    GNU 组织开发了一个较新版本的 zip，称为 `gzip`。可以说，它的功能与 zip 几乎完全相同。它有一个名为 [gunzip](#gunzip) 的命令。gzip
    命令集现在似乎更受欢迎，因为它更更新，这表明它在原始 zip 二进制文件的基础上进行了改进。不过，熟悉两者都是好的。


    zip 和 gzip 功能之间最显著的区别是，当你压缩一个文件时，你是在对原始文件进行 gzip 操作（直接压缩）。因此，你不会在原始文件所在的目录下得到一个原始文件的压缩版本。你仍然拥有原始文件，只是变小了。被
    gzipped 处理过的文件很容易识别，因为它们在创建时被赋予了“.gz”扩展名，所以你确切知道使用哪种工具来提取它们。


    如果你想查看压缩和解压缩文件之外 zip 和 gzip 之间的差异，可以通过系统上的 man page（帮助手册）进行查询。`zip` 命令有很多可以尝试的选项。以下四个示例演示了如何使用
    zip 和 gzip 命令集来压缩和解压缩文件。


