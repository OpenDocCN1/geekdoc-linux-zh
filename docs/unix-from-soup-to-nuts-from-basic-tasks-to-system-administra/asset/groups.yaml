    # The uptime Command


    The [uptime] command will tell you how long the operating system has been running
    or in other words, how long it has been since the last system reboot. The uptime
    output output includes the current time and a count of days since the last system
    reboot unless the system has been rebooted within the previous 24 hours. If the
    system has been rebooted within the previous 24 hours, the time since the last
    reboot is displayed in hours, minutes, and seconds. The uptime command also displays
    the number of users that are currently logged in. The last bit of information
    the uptime command provides is the average number of jobs in the system run queue
    during the previous one, five, and 15-minute intervals.


    The following uptime output indicates the system has been recently rebooted as
    indicated by the output in the format of hours, minutes, and seconds rather than
    in days. As you can see, since this system is only being used to host some lightweight
    web applications and to write this book, there is very little load reported by
    the uptime command.


    ```

    #uptime

    01:26:02 up 1:00, 1 user, load average: 0.10, 0.05, 0.15

    ```


    # The vmstat (Virtual Memory Statistics) Command


    The [vmstat] command is used to display information about the current status of
    the system''s active processes, memory, swap space, I/O (Input and Output), system,
    and CPUs. The simplest way to use the vmstat command is to type vmstat followed
    by a space, a number, another space, and another number and hit the enter key.
    The first number is the delay key and the second number is the number of lines
    of information to display.


    So if you were to enter vmstat 2 3 and hit the return key, the system would respond
    with three lines of statistics displayed two apart as follows. It should be noted
    that the first line of the report is an average since the last system boot. Each
    line of the report after the first line is an average since the last report line
    interval. So if you want to see 3 current average lines of output, you should
    request 4 for the number of samples and disregard the first line as it is not
    really current data.'
