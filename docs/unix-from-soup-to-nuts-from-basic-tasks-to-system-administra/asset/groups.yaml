    ## UNIX 名称的由来


    “UNIX 的名字从哪里来？”你可能会问。在 20 世纪 60 年，AT&T、通用电气（GE）和麻省理工学院（MIT）合作开发了一个名为多路信息计算系统（Multics）的操作系统，它运行在
    GE 的大型机上。Multics 项目从未取得过太大的商业成功，主要是因为其性能糟糕，但它的开发为交互式系统生成了新的能力，例如增强的安全功能。


    在 Multics 项目结束后，AT&T 将其开发资源投入了一个新项目。该项目被命名为单用户信息计算系统（Unics）。一位名叫 Brian Kernighan
    的开发者被认为贡献了 Unics 这个名字，但我想我们完全可以达成共识，它是对 Multics 项目名称的变体。后来，拼写被更改为 UNIX。


