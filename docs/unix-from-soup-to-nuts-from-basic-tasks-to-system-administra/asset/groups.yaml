    # Aliases


    The [alias] mechanism is available to create a user-defined identifier to a command
    or list of commands that will be executed when the identifier is used at the command
    line. Simply stated, the alias command allows a user to remember a single word
    or command that is used to execute a more complicated or difficult to remember
    command syntax. A common alias I have seen on many UNIX operating systems is for
    the df command. The df command is almost always executed with a common option
    like -k or -h, depending on the user''s personal preference. So, when a user creates
    an alias of df for the command syntax -h, the user will just need to type df at
    the command line and the system will run df -h. Obviously this example is not
    a difficult to remember syntax, rather the alias is used to save three key strokes
    whenever the frequently used df -h command is executed. As simple as the previous
    example is, I believe a UNIX user will understand how powerful the alias command
    can be to save time, key strokes, and the need to memorize complicated commands.


    The alias command can be used to display the aliases that are active in the current
    shell and how the aliases are defined. To view the defined aliases, simply execute
    the alias command by itself without any arguments. If an alias is defined incorrectly,
    or if you simply want to remove an alias, use the [unalias] command. The argument
    you must provide the unalias command is the name of the alias you would like to
    remove. An alias that defined in a session will only be available for that particular
    login session unless the user defines the alias within their .profile file in
    their home directory.


    # ROBERT B. FAY


    Anything defined within a user''s .profile will be defined every time the user
    logs into the system. Additionally, if all users need to have the same alias defined,
    the system administrator may define the alias for all users. This task can be
    performed in different ways depending on the system administrator''s preference
    and the flavor of UNIX being used. A common way to perform this task would be
    to insert the alias definition into the /etc/profile file. This file is read by
    the operating system every time someone logs into the system. The following two
    examples demonstrate how to properly define an alias for a single command as well
    as how to define an alias for a command string.


    ```

    #alias newcommand=oldcommand

    ```


    ```

    #alias newcommand=''old command string''

    ```


    # Rules for Entering UNIX Commands


    # Wildcards


    The following special characters are called wildcards. They can be used to list
    or search for multiple files at the same time, which can save you a ton of typing
    and time. If you learn to use your wildcards effectively, you will be a much happier
    and more efficient UNIX user.


    | Wildcard | Description |

    |---|---|

    | ? | Matches any single character. |

    | * | Matches any single character or multiple characters. |

    | [] | Matches one of the characters included inside the [ ] symbols. |


    The following are some examples for using the above wildcards:


    ```

    #ls stuff?

    ```


    The above command will list any file in the current directory that begins with
    the word “stuff” followed by one more character. So if the following files were
    in the current directory, they would show up in the results (stuff1, stuffs, stuffy).
    Some files that would not show up in the results are (stuff11, stuffed, stuff).
    These file names do not qualify for the list because they start with the word
    stuff and then have more than one character. If the command syntax had called
    for two question marks like (stuff??) then the three files that did not qualify
    would have qualified for the list but the original files that qualified would
    not. The three original files that qualified would no longer qualify because (stuff??)
    calls for any two more characters and not one or two.


    # # ls stuff*


    The above command will list any file in the current directory that begins with
    the word “stuff.” So of all the names in the following list qualify (stuff, stuff1,
    stuffs, stuff, stuffy). The asterisk character accepts any additional characters
    or none at all.


    # # ls stuff[1,2,y,z]


    The above command will list any file in the current directory that begins with
    the word “stuff” followed by one more character that is included in the square
    braces. So if the following files were in the current directory, they would show
    up in the results (stuff1, stuff2, stuffy, stuffz). Some files that would not
    show up in the results are (stuff11, stuff3, stuffy1). These file names do not
    qualify for the list because they start with the word “stuff” and have more than
    one character or a character that is not included in the square braces.


    # Command Options, Arguments, and Required Spaces


    *Options are supported variations of a command. Options are specified by entering
    a space after a command followed by a dash “-” (most of the time) and the desired
    option character. I say of the time, because most commands require the dash, but
    not all of them. However, the commands that do not require the dash will allow
    it without complaining, so the safe bet is to always include the dash.


    An option character for one command may be used for a different purpose with a
    different command. Another popular term you may hear among UNIX users is the word
    "flag." A command flag and command option are the same thing. Either term is acceptable
    and is regularly used. If somebody does not know what you are talking about say
    the word "flag." An argument is the subject or target of the command. It is entered
    last on the command line. Example: In the command string (tar -cvf file.tar),
    the c means to create a tar file. Spaces are not required between options if only
    the first option needs to be preceded by a dash (-).


    # Man (Manual) Pages


    The [man] command can display a “man page” for every command on the system. The
    man pages are documentation you have access to. UNIX was the first operating system
    to include all of its documentation. To use the man pages enter the command "man"
    on the command line followed by a space and an argument. In this case, the argument
    would be the UNIX command, protocol, or service you want help with. The man page
    will respond by listing several pages of output that consists of the following
    sections:


    # man Page Information by Section


    | Command | The Command You Looked Up |

    | --- | --- |

    | Name | The command followed by a description of what it is used for. |

    | Synopsis | An example of the syntax the command is used in. |

    | Description | A more verbose description of what the command is used for and
    how to use it. |

    | Options | A definition of each option supported for the command. |

    | Operands | Types of arguments that may be specified with the command like a
    file or a pattern. |

    | Usage | Examples of how to use the command. |

    | Environment Variables | A list of environment variables that can affect the
    execution of the command. |

    | Exit Status | Possible exit status codes. |

    | Attributes | Characteristics of the command. |

    | Files | Files that are related to the current command being looked up. |

    | Notes | Notes of useful information from the author of the command. |


    The documentation included:

    - man — Manual pages for each command, library component, system call, header
    file, etc.

    - doc — Longer documents detailing major subsystems, such as the C language and
    troff.

