    ## crontab 条目要求


    | 字段编号 | 字段名称 | 可接受值 |

    |---|---|---|

    | 1 | 分钟 | 0-59 |

    | 2 | 小时 | 0-23 |

    | 3 | 日 | 1-31 |

    | 4 | 月份 | 1-12 |

    | 5 | 星期 | 0-6 0=周日, 1=周一, 2=周二, 3=周三, 4=周四, 5=周五, 6=周六 |

    | 6 | 命令 | 可执行文件或命令语法。在 crontab 中最好使用执行文件的绝对路径，因为在你未登录时无法依赖 shell 环境变量的激活。 |


    在 crontab 条目的前五个字段中，都可以用星号 (**) 替换数字。星号代表通配符，表示该字段的所有合法值。因此，第五字段（星期字段），`*`、`0-6`
    以及 `0,1,2,3,4,5,6` 的含义完全相同且都是合法值。`0-6` 中的连字符表示闭区间范围。在之前的示例中，数字是用逗号分隔的。使用逗号分隔符时，不需要列出完整的数字范围。如果你只想在周日、周三和周五执行命令，可以使用
    `0,3,5`。


    ## UNIX 从入门到精通 (Soup To Nuts)


    井号 (#) 用于标识 crontab 文件中的注释。如果井号出现在行的开头，则整行将被忽略。如果井号位于要执行的命令字符串的右侧，则井号之后的所有内容都将被忽略。


    你可能注意到，crontab 条目的第三字段和第五字段都代表日期。如果这两个字段都包含数值，命令字符串将在指定的日期执行。例如，如果第三字段是 `3`，第五字段是
    `2`，那么命令字符串将在每月的 3 号（无论是周几）以及每月的周二执行。如果该月的 3 号恰好是周二，则不会发生特殊情况；命令在当天仅执行一次。以下是几个合法的
    crontab 条目示例：


    - 10 3 * * * /usr/sbin/test_script1 # 此脚本将在 5 月的每天凌晨 3:10 执行。

    - 30 20 * * 1 /usr/local/bin/test_script2 # 此脚本将在每周一的晚上 8:30 执行。

    - #10 22 * * * /usr/local/test_script3 # 此脚本不会执行，因为开头的井号将该行识别为注释。


    与 `cron` 类似的是 `at` 命令。`cron` 用于定期计划运行任务，而 `at` 命令只运行一次任务后就会忘记。我建议新 UNIX 用户使用 `cron`
    而不是 `at`，因为计划任务更容易被追踪。如果你仍然想尝试，可以试用一下 `at` 命令。


    其语法非常直观。你只需要在命令行告诉系统你想在某个特定“时间”执行某些内容。例如：`at 0815am Jan 24 uptime >>long.txt`。在之前的示例中，`uptime`
    命令将在指定的日期时间执行，输出将追加到名为 `long.txt` 的文件中。`at` 命令还接受文本格式的常用时间定义，如 now（现在）、noon（正午）和
    midnight（午夜/凌晨）。


    由于可能被恶意使用，`at` 命令的权限通常比 crontab 更严格。如果你尝试使用 `at` 命令时收到类似“at: you are not authorized
    to use at. Sorry,”的系统消息，不要惊讶。`at` 命令的权限由系统管理员控制。要修改与 `at` 命令相关的用户权限，必须根据 `at`
    命令的安全设置来修改以下文件之一：


    ```

    /usr/lib/cron/at.allow and /usr/lib/cron/at.deny

    ```


    或


    ```

    /etc/at.allow and /etc/at.deny

    ```


    如果 `at.allow` 文件存在，只有文件中列出的用户允许使用 `at` 命令提交以后执行的命令。`at.allow` 格式为每行一个用户，文件中不允许有空格。root
    用户即使未列在 `at.allow` 文件中，也允许随时使用 `at` 命令。


    如果 `at.allow` 文件不存在，系统将检查 `at.deny` 文件，获取不允许提交以后执行命令的用户列表。`at.deny` 的格式与 `at.allow`
    相同。如果 `at.allow` 不存在且 `at.deny` 为空，则所有用户都允许使用 `at` 工具。


    `at` 命令权限管理得如此严格，是因为一旦命令被提交以后执行，它不像在 crontab 文件中那样清晰可见的 cron 任务容易被检测。尽管 `at` 命令的创建者初衷是好的，但恶意用户利用它的机会太大了。出于安全和系统稳定性考虑，我建议谨慎使用
    `at` 命令。


    ## 练习答案


    ### 1 – 基础知识答案


    - 1. `/` 代表从根目录到文件的完整路径。

    - 2. 相对路径代表从当前位置到文件的直接路径。

