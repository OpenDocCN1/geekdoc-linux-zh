    ## Displaying DOS Files in UNIX


    Files that have been created or modified in a DOS or Windows environment will
    often include control characters, end of line markers, or carriage return symbols.
    Since these symbols are foreign to UNIX, the UNIX Kernel does not interpret the
    characters correctly and may process the files or display them incorrectly. To
    deal with this situation, the `dos2unix` command was invented to strip out the
    unacceptable characters to make the file readable by UNIX correctly. So if you
    think a file is corrupt for some reason and cannot figure out why, try using the
    dos2unix command to convert the file before giving up on it. The worst that can
    happen is the file will still be corrupt, so you have nothing to lose.


    Conversely, a [unix2dos] command exists to insert the special characters into
    a file created or modified in a UNIX environment to allow the file to be processed,
    displayed, or printed properly in a DOS or Windows environment. If you send a
    text file to a Windows environment that was created with an editor on a UNIX system,
    the file will be readable, since, there are no end of line markers or carriage
    characters, a word-processing program in a Windows environment will usually display
    each paragraph as one long line. You can fix this by hitting the return key wherever
    the line should wrap on the screen in your word processor or convert the file
    with the unix2dos command on a UNIX system. The following two examples demonstrate
    the proper use of the dos2unix and unix2dos commands:


    ```

    #dos2unix dosfile unixfile

    ```


    # UNIX From Soup To Nuts


    # unix2dos unixfile dosfile


    # Printing Files


    As with other operating systems, the way to print a file is to send a copy of
    the file to a print queue. The print queue is a holding area where print jobs
    wait their turn to be printed. In UNIX, a print queue must be configured for each
    printer the operating system is going to send print jobs to. The print job will
    sit in the print queue either the operating system wakes up the printer and tells
    it there is a print job waiting in the queue, or if the printer is already active,
    the print job may sit in the print queue until the jobs ahead of it in the queue
    are gone and the printer device is ready to process it. If there is only one print
    queue configured on the system, then that is the only printer the operating system
    knows about, and it will be the default printer for all print jobs. However, if
    there is more than one print queue configured, print jobs will need to be directed
    to a particular print queue with the [lp] command.


    The [lp] command can be used to send a print job to a printer. If there is only
    one print queue defined, then the syntax is simply lp filename. However, if your
    operating system has multiple print queues defined, you will need to use the -d
    option to direct your print job to a particular printer. So if you want to send
    the print job to the printer you have named printer1, you would type the following
    syntax at the command prompt:


    ```

    #lp -d printer1 printme

    ```


    > (Where printme is the name of the file to be printed.)


    To verify the print job sent to the correct print queue, you may use the [lpstat]
    command, which will show you the status of all defined print queues. The lpstat
    only shows what is currently waiting to be printed in the queue.

