    If the at.allow file exists, then only users listed in the file are allowed to
    use the at command to submit commands for execution at a later time. The format
    of the at.allow file is one user per line. No white space is allowed inside the
    file. The root user is allowed to use the at command at all times, even if it
    is not listed in the at.allow file.


    If the at.allow file does not exist, the system will check the at.deny file for
    a list of users that are not allowed to submit commands for execution at a later
    time. The format of the at.deny file is the same as the at.allow file. If the
    at.allow file does not exist and the at.deny file is empty, then all users are
    allowed to use the at utility.


    The reason the privileges for the at command are so tightly managed is because
    once an command has been submitted for later execution, it is not easy to detect
    as a scheduled cron job that is plainly visible in the crontab file. Although
    the creators of the at command had good intentions when they created it, the opportunity
    for malicious users of the at command is too great. For the sake of security and
    system stability, I recommend that the use of the at command be locked down. Failure
    to do so is an open invitation for a user to set a ticking time bomb in your system.'
