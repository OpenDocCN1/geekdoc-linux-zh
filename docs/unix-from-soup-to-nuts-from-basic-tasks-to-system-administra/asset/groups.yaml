    ## Compressing Files


    Files


    Compressing files and uncompressing files are things that users and administrators
    alike will need to do from time to time. Keeping things you are not using compression
    to make optimal use of your storage on the UNIX filesystems and can keep people
    from pointing at you when a filesystem suddenly fills up. I am going to discuss
    what I believe are the most common compression tools in the UNIX world. The three
    methods are [compress], [gzip], and [tar].


    The logic behind the compression tools is pretty straightforward. They do not
    perform the tasks in the same way, but essentially, the tool removes everything
    that you don''t need to maintain the integrity of what you are compressing. Usually
    this means getting rid of all of the white space and other bits that do not actually
    hold data. Somehow the tools map where the white space goes and reinserts it when
    the files are uncompressed.


    ## compress


    The `compress` command is very straightforward. You just follow the command with
    the name of the file you want to compress. After you use the compress command
    to compress a file, you will notice that the file has a “Z” extension tacked on
    to it. This is handy because it reminds you later what type of file it is.


    To uncompress the compressed file, you use the `uncompress` command rather than
    the compress command with an option. Don''t ask me why this was done, but it works,
    just remember it and move on. The following two examples demonstrate how to compress
    and uncompress with the two respective commands.


    ```

    #compress filename

    ```


    ```

    #uncompress filename

    ```


    ## zcat


    The `zcat` utility is used to display on standard output the uncompressed form
    of a file that has been compressed using the UNIX compress command. Using zcat
    is essentially the equivalent of using the uncompress command with the `-c` option.
    Using zcat to display the contents of a compressed file does not affect the compressed
    file.


    ## zip and gzip


    The `zip` compression tool, like the compress tool, has a companion command to
    unzip zipped files. You guessed it, it is called `unzip`. I like the zip command
    because when it makes the zipped file, it tells you how much space it saved. For
    example, if I ask it to zip a file called coins, it will respond with with: adding
    coins (deflated 88%) or some other percentage, depending on the contents and size
    of the file.


    The zip file needs you to tell it what to name the new zipped file it is creating
    because it does not simply zip the original file. The zip command makes a zipped
    copy of the original file and adds the extension of “.zip” to the new file. So
    if your goal is to save space, you will need to delete the original file after
    you create the compressed zip file.


    There is a newer version of zip there developed by the GNU organization called
    gzip. Suffice to say that it does pretty much the same thing zip. It has a command
    called [gunzip]. The gzip set of commands seems to be more popular these days
    because it is newer, which suggests it has improved upon the original zip binary.
    However, it is good to be familiar with both of them.


    The most notable difference between zip and gzip functionality is when you zip
    a file, you are gzi the original file-gzipping the original file. So you do not
    end up with a compressed version of your original file in the same directory as
    your original file. You have the original file still, it is just smaller. Files
    that have been gzipped are easy to spot because they are given a “.gz” extension
    when they are created so you know exactly which tool to use to extract them.


    If you care to examine the differences between zip and gzip beyond how to compress
    and uncompress files, look them up with the man page on your system. The zip commands
    have plenty of options you can play around with. The following four examples demonstrate
    how to zip and unzip a file using the zip and gzip command sets.


    ```

    #zip filename original_file

    ```


    ```

    #unzip filename original_file

    ```


    ```

    #gzip filename original_file

    ```


    ```

    #gunzip filename original_file

    ```


