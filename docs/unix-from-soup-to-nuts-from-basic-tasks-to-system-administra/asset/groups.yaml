    # UNIX From Soup To Nuts


    # Inodes


    Inodes or as the operating system knows them, "inodes" with a lowercase i, are
    data structures that contain information about files. Each file has an inode and
    is identified by an inode number. inodes keep track of information about files,
    such as user and group ownership, access mode (read, write, execute permissions),
    and type.


    There are a set number of inodes per filesystem. If you run out of inodes, all
    you need is another filesystem. Realistically speaking, you should never run out
    of inodes, but it is theoretically possible. To run out of inodes, you would need
    to create a tremendous amount of files without ever removing any. Basically, you
    are more likely to run into other problems caused by lack of disk space or poor
    systems management before lack of available inodes becomes a problem. A file''s
    inode number can be found using the ls -i command. For more detail about the file,
    you can add the -/ flag.


    # Modes


    vi has two modes used for two types of functions. The first mode is command mode.
    When you begin a vi session, it will automatically be in command mode. While in
    command mode, vi will accept basic cursor movement and file navigation instructions,
    perform pattern searches, and perform basic editing functions, like cut and paste
    or yank and put. The second mode is known by a few names, depending on whom you
    ask. You may hear insert mode, edit mode, or input mode. Whatever you choose to
    call the second mode, it is used to insert new and edit existing text in a file.
    For the purpose of discussion, I will refer to the second mode as edit mode. This
    makes the most sense to me since what we want to do in this mode is edit something.
    While in edit mode, you will be peruming your actual editing of the file. To save
    your edits, you will need to first return to command mode. To return to command
