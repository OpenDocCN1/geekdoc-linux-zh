    ## Where UNIX Got Its Name


    “Where does the name UNIX come from?” you may ask. Well, in the 1960s, AT&T, General
    Electric (GE), and the Massachusetts Institute of Technology (MIT) worked on a
    collaborative effort to develop an operating system called the Multiplexed Information
    and Computing System (Multics), which ran on GE’s mainframe computer. The Multics
    project never realized much commercial success primarily because of its poor performance,
    but its development generated new capabilities for interactive systems, like enhanced
    security features.


    After the Multics project was over, AT&T committed its development resources to
    a new project. The project was called the Uniped Information and Computing System
    (Unics). A developer by the name of Brian Kernighan has been credited for the
    name Unics, but I think we can definitely agree that it is a play on the name
    of the Multics project. The spelling was later changed to UNIX.


    ## The Rosetta Stone


    The Rosetta stone has Egyptian and Greek writing on it. The writings were made
    using Hieroglyphic, Demotic, and Greek script. It was written in three scripts
    because when it was written, there were three scripts being used in Egypt. The
    Hieroglyphic script was used for important documents like those with religious
    significance. The Demotic script was the common script of Egypt. Greek was the
    language of the rulers of Egypt at that time. The Rosetta stone was written in
    all three scripts so that the priests, government officials, and rulers of Egypt
    could all read it. It could also be used as a translation tool because it contains
    the same writings in different languages and scripts. Therefore, if you can read
    at least one of the scripts, you can make at least an educated guess as to what
    the characters in the other scripts represent.


    Okay, so you are probably saying to yourself, this is all very interesting, but
    what does it have to do with UNIX? Well, since there are so many flavors of UNIX
    out there, it has become necessary to develop translation documents to assist
    with the ability to perform common tasks on different flavors of UNIX. It is quite
    common to find data centers with servers made by different vendors supporting
    different flavors of UNIX in the same environment. These translation documents
    may be found in many forms, but they are collectively referred to as Rosetta stones.


    A quick search on the Internet with your search engine choice should respond with
    several choices of Rosetta stone documents, or at least enough information to
    assist you in creating your work. Try searching for “UNIX Rosetta stone” and see
    what you get. I just tried it and got 97,000 hits. The number-one hit was a Java
    script in which you could choose from a list of 17 flavors of UNIX to compare.


    If you have experience with another operating system like DOS or PIC, you may
    find it useful to find or create a Rosetta stone document to translate those commands
    to UNIX. This will be useful until you start thinking in the new OS you are learning.
    I know for a while how to do things easily off the top of my head with AIX commands.
