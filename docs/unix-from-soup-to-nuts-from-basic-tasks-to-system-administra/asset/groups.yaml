    \ chgrp staff oldgroup\n- 8. touch .profile\n- 9. head -n 3\n\n### 5 – Solutions\
    \ for Users, Groups, and Permissions\n\n- 1. more /etc/passwd\n- 2. du -hs /home/username\n\
    - 3. passwd\n- 4. groups or more /etc/group or Do a long listing of a file you\
    \ have made.\n- 5. more /etc/group\n- 6. touch gfile or chmod 774 gfile\n- 7.\
    \ chgrp staff oldgroup\n- 8. touch .profile\n- 9. head -n 3\n[/content] (Wait,\
