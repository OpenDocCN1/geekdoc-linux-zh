    I/O 竞争，特别是当文件系统包含数据库或其他 I/O 密集型应用程序时。并不是说你不能构建大文件系统。大文件系统在企业级服务器上很常见，但大文件系统通常用于大文件，而不是大量小文件。占据大量小文件相同磁盘空间的少数大文件将使用的
    inode 数量较少。传统的 UNIX 文件系统在达到限制后没有分配额外 inode 空间的能力。inode 属性取决于具体的 UNIX 版本和使用的文件系统类型（如
