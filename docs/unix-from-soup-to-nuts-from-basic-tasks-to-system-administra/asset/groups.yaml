    内置允许选择性地启用或禁用其他内置命令。在提供动态加载功能的操作系统上，可以从对象文件中加载新的内置命令到当前 shell。


    新加载的内置命令将访问所有激活的 shellset。听起来一头雾水，对吧？好的，把内置命令想象成 shell 自身的一部分当你当你执行它时，shell 已经知道它了，bash
    shell 只是直接执行它而无需思考。当一个命令不是内置的时，bash shell 必须 fork 一个新进程来查找该命令。找到它后，再执行它。所以，把使用内置命令看作去掉中间人。


    # 目录栈 (The Directory Stack)


    bash shell 提供了一个“目录栈”，你访问的目录会被添加。当你更改当前目录时，`pushd` 内置会将目录添加到目录栈。`dirs` 内置可以显示目录栈的内容。通过显示
    `IRSTACK` 变量也可以查看目录栈的内容。与目录栈相关的另一个内置命令是 `popd`。`popd` 内置负责从目录栈中移除目录。


    目录栈功能对于需要在两个目录之间切换的人非常有用。要在目录栈中后退一个目录，使用 `cd` 命令配合双点 `..`。要在目录栈中后退两个目录，使用 `../..`
    作为目标。要在目录栈中前进，使用 `cd` 命令配合 `/.next_directory` 作为目标，其中 `“next_directory` 实际上是目录名。如果不使用目录栈，你每次离开都需要输入目的地的绝对路径。


    # 目录栈示例


    - cd ..（返回上一级目录）

    - cd ../（返回上一级目录）

    - cd ../../（返回上级目录）

    - cd /.next_directory（前进一个目录）

    - cd /.next_directory/another_directory（前进两个目录）


