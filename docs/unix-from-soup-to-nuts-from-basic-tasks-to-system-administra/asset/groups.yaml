    ```

    #awk ''/gold/ {ounces += $2} END {print "value = " $475*ounces"} coins

    ```


    The result of this one line awk script is: value = $2185


    In this example, ounces is a user-defined variable. You can use almost any string
    of characters as a variable name in awk, as long as the name doesn''t conflict
    with some string that has a specific meaning to awk, such as print or NF. A variable
    handled as a string is initialized to the null string, so there is no need to
    manually set the value to null. Similarly, a numeric variable will be initialized
    to zero. So the program action to column two of the coins file to ounces += $2
    is as follows:


    ```

    {ounces += $2}

    ```


    The preceding line sums the weight of the coin on each matched line of the coins
    file into the variable ounces. The += operator is a shorthand way of expressing:


    ```

    {ounces = ounces + $2}

    ```


    The next and final action in this awk script is to compute and print the value
    of the gold coins in the coins file with the following syntax:


    ```

    END { print "value = " $475*ounces"}

    ```


    The only thing of interest is that the two print parameters, the literal "value
    = $\$" and the expression "475*ounces", are separated by a space, not a comma.
    This concatenates the two parameters together on output, without any spaces between
    the dollar sign and the numerical value of the coins.


