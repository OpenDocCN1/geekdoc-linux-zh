    # 花括号扩展 (Brace Expansion)


    花括号扩展是生成一组具有共同前缀或后缀的字符串列表的简单方法。要生成具有共同前缀或后缀的字符串列表，只需使用 `echo` 或其他输出定向命令，并将花括号括起的逗号分隔字符列表作为前缀或后缀。以下示例通过使用逗号分隔的列表
    `(b,c,h,r)` 和后缀 `“at”` 创建了字符串 bat、cat、hat 和 rat。


    ```bash

    #echo {b,c,h,r}at

    ```


    结果是：bat cat hat rat


    在创建同时具有前缀和后缀的字符串时，适用于花括号扩展的相同规则同样适用。要生成具有共同前缀和后缀的字符串列表，只需使用 `echo` 或某些输出定向命令，并将你的前缀和后缀连在一起，在前后缀和后缀之间放入一个花括号括起的逗号分隔字符列表。以下示例通过在前缀
    `“m”` 和后缀 `“n”` 之间使用逗号分隔的列表 `(a,i,o)` 创建了字符串 man、min 和 mon。


    ```bash

    #echo m{a,i,o}n

    ```


    结果是：man min mon


    需要注意的是，虽然为花括号扩展提供的示例使用了单字母前缀或后缀，但单字母前缀和后缀功能并不是花括号扩展的限制。可以使用相同的过程创建具有较大前缀或后缀的字符串。


