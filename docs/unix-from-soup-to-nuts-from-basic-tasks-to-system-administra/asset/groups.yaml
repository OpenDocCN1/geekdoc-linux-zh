    ROBERT B. FAY


    vi、sed 和 awk 工具本质上都用于处理文本。由于我包含了关于 vi、sed 和 awk 的内容，我认为对在什么情况下使用什么工具提供建议是有意义的。你不需要学习所有这些工具，但如果你学习了，你将会好奇在精通这三者之前，你以前是如何做那些事的。vi
    工具应该用于执行选择性的文件操作。sed 工具应该用于执行简单的重复任务，如全局字符替换或删除。awk 工具应该用于执行更复杂的任务，如格式化、重新排列以及从
    UNIX 命令的输出或现有文件中省略数据列。


    ## awk 简介


    [awk] 命令，或者更准确地说，一种编程语言，是一个非常强大的工具，经常用于清理、解析和重新排列。在我们深入研究 awk 之前，我想澄清几个误解。awk
    这个名字并不像某些 UNIX 命令那样是英语单词的缩写。a、w、k 这三个字母实际上是创建它的开发者姓氏的首字母。这三位开发者的名字分别是 Alfred Aho、Peter
    Weinberger 和 Brian Kernighan。这三位绅士在 70 年代在贝尔实验室工作时开发了 awk。


    在原始 awk 开发之后，出现了其他版本。其他版本包括 [gawk]，它是 awk 的 GNU 版本；[mawk]，它是 awk 的一个更快的重写。我将专注于原始
    awk，因为它存在时间最长，并包含在你正在使用的任何 UNIX 版本中。简单来说，这些都是为了增加改进构想而开发的更新版本。尽管如此，涵盖 awk 的主题也适用于新版本。


