    ## The GREP (Global Regular Expression Parser) Command


    The *grep, egrep, and fgrep commands* can be used to locate a search argument
    in a file. The default output of the grep command is to display the entire line
    of the file that the search argument is located in. The grep command is very helpful
    when you are dealing with large files or commands that generate many pages of
    output. The grep commands are used as filters. They scan input and return only
    lines that contain the specified pattern as output omitting the rest. The grep
    command is actually an acronym for Global Regular Expression Parser or Print.
    The egrep version of the grep command uses full regular expressions that include
    the full alphanumeric and special character set. The fgrep is a Fast version of
    the grep command. It uses a different algorithm that searches for strings rather
    than a pattern.


    | Command | Option | Description |

    |---|---|---|

    | grep | | Searches for lines that include a pattern. |

    | | -c | Returns a count of the number of lines that contain a pattern. |

    | | -i | Searches for lines that include a pattern in lower or uppercase form.
    |

    | | -l | Returns names of files that contain a pattern. |

    | | -n | Precedes each line by its line number in a file. |

    | | -v | Searches for lines that do not include a pattern. |

    | | -w | Searches for lines that include a pattern as a separate word. |


