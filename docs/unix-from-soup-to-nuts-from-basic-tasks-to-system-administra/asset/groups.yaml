    For more examples and command options, see the section that discusses awk in greater
    detail. The following two examples illustrate the difference of using grep to
    find a subject and using grep with awk to find a subject and weed out information
    you do not care to see.


    ```bash

    #df -h | grep swap


    swap        5.3G 48K 5.3G 1% /var/run

    swap        512M 768K 511M 1% /tmp

    ```

