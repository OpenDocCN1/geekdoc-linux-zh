    ## Specifying a Number of Occurrences


    With no flags, the first pattern is changed. With the "g" option, all patterns
    are changed. If you want to modify a particular pattern that is not the first
    one on the line, you can add a number after the substitution command to indicate
    you want to match that particular pattern. Sound confusing? It really isn’t. Just
    check out the following examples:


    ```bash

    #sed ''s/abc/ABC/2'' < filename

    #sed ''s/abc/ABC/20'' < filename

    ```


    You may never need to edit the 20th occurrence of something, but if you do, you''ll
    be ready. Ha! But honestly, if you deal with large files of numbers or repetitive
    data, this will come in handy. You are lucky if you are just starting to use sed.
    In the early days of sed, we could only edit occurrences of the first nine matches
