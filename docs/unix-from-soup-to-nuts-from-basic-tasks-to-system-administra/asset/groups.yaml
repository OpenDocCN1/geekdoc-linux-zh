    # ROBERT B. FAY


    default shell, his her ability to navigate around the system and write files will
    be limited. You may set a user''s default login shell to rbash by modifying the
    shell field in the user''s record in the /etc/passwd or /etc/shadow file.


    The following items document the specific restrictions placed on users who use
    the restricted shell as their shell environment. The restricted shell disallows
    a user from doing the following:


    - Changing working directories: cd is inoperative. If a user with rbash tries
    to use it, he or she will get the error message bash: cd: restricted.

    - Redirecting output to a file: the redirectors >, |, <>, and >> are not allowed.

    - Assigning a new value to the environment variables SHELL or PATH.

    - Specifying any pathnames with slashes (/) in them. The shell will treat files
    outside of the current directory as "not found".

    - Using the exec built-in.

    - Specifying a filename containing a / as an argument to the built-in command.

    - Importing function definitions from the shell environment at startup.

    - Adding or deleting built-in commands with the -f and -d options to enable the
    built-in command.

    - Specifying the -p option to the built-in command.

    - Turning off restricted mode with set +r.


    The rbash restrictions go into effect after the user''s .bash_profile and environment
    files are run. Therefore, a cautious system administrator will change the owner
    of the users'' .bash_profile and .bashrc to root, and make these files read-only
    before granting the guest user access to the rbash controlled account. The users''
    home directory should also be read-only.


    This means that the rbash shell user''s entire environment is set up in /etc/profile
    and .bash_profile. Since the user cannot access /etc/profile and can''t overwrite
    .bash_profile, this lets the system administrator configure the environment as
    he or she sees fit without the danger of the restricted user escaping to another
    shell or changing the configuration of their own environment.


    I have used two methods to contain the actions of certain types of users. The
    first method is to restrict the user to a directory and place a safe set of commands
    for them to use in the PATH environment variable for the restricted account to
    use. The second method for containing the actions of users with limited access
    or authority is to create a screen the user can log in where they can select actions
    from a menu. Such selections may include generating a specific report that has
    been designed for the user, viewing backup statistics, or viewing system logs.


    If the screen and menu are written correctly, all actions should end with the
    user being placed back into the menu screen where they started. The only way for
    the restricted user to escape from the menu screen should be to select the menu
    option that terminates their session and exits them from the system.


