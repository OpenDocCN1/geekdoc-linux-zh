    # The Shell


    The *shell* is a command programming language that provides an interface for users
    to communicate with and make requests from the UNIX operating system. Before window
    systems were developed, the shell was the only interface available to UNIX users.
    The /etc/shells file will list all of the shells available for your system. If
    this is not the exact location on your system, the file should still be called
    shells or some variation of the word “shell”. The following illustration demonstrates
    the shell’s role as a barrier of protection from the users. Like a physical shell
    or wall if you will, the UNIX shell protects what is inside from being damaged
    or affected by what is going on outside. The shell is a good thing. The shell
    is there for reason.


