    # Editing and Completion of Commands


    The bash shell offers a command-line editing facility, which permits users to
    edit command lines using familiar emacs or vi-style editing commands (see vi chapter
    for list of vi-style editing commands). Editing allows corrections to be made
    without having to erase back to the point of error or retyping a long and complicated
    command line. The editing facilities include a feature that allows users to complete
