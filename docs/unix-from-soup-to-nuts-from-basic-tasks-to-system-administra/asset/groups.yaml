  - '[PAGE 94]


    # UNIX From Soup To Nuts


    ![](img/89df3d0f73a9f8ee67c84c5b320e4e83_94_0.png)


    A path in the operating system is symbolic of a path in the wilderness. You need
    to follow the path to get to where you want to be. The PATH environment variable
    is like a map to tell the operating system where you want to be able to go. To
    view the directories in your PATH, use the echo $PATH command. This will display
    the locations of all commands you can run without telling UNIX where to look for
    them. The format of the listing is directory paths delimited or separated by the
    colon character (:). If a directory is not in your PATH variable, then you will
    not be able to find it or execute commands that reside in the directory unless
    you explicitly tell the operating system where it is. Such explicit directions
    are called absolute paths.


    An absolute path refers to a location somewhere in a systems hierarchical structure.
    The reference always begins with the root directory (represented by /) and builds
    a path to its destination file or directory. An absolute path is really the most
    accurate way to reference system locations when used with the cd (change directory)
    command, within a configuration file, or as part of a script. So, if you wanted
    to cd to /usr/local/bin from /var/tmp, you would simply use the following command
    syntax: cd /usr/local/bin.'
  - '[PAGE 95]


    A relative path starts in your current working directory. So use the pwd command
    to establish where to start your relative command from. As an example, if you
    wanted to change the directory /usr/local/bin from /var/tmp, you could simply
    use the following relative command syntax: cd ../ /usr/local/bin. The preceding
    command syntax is telling the operating system that you want to back up two directories
    and then go forward three directories to /usr/local/bin.


    By this time you know what a directory is, as a point of clarification there are
    a few terms used when referring to directories that need to be understood. The
    working directory is where you are ever that may be. The pwd command will display
    or "print" working directory to your screen.


    The term *print* is used in the print working directory command because when UNIX
    was created, the printer was the system visual interface. You could not see what
    you were doing on a monitor like you can today. So use the pwd command if you
    get lost to find out exactly where you are in the system directory structure.


    The term *parent directory* refers to the directory one level up from your working
    directory. So, if your working directory is /usr/local/bin, then the parent directory
    would be /usr/local. A *child directory* is any directory that is located inside
    a parent directory.


    A *filesystem* is a section of disk space that has been defined to the operating
    system. The disk space does not all need to be on the same physical disk. Does
    it not need to be local to the machine the filesystem is defined on. The disk
    may be part of an external disk or disk array. It may also be located on another
    server. The only requirement is that the disk is accessible so that the operating
    system can access it. The filesystem definition includes information like the
    name of the filesystem, the absolute path of the mount point, the disk volume
    that the filesystem resides on, and whether or not the filesystem should automatically
    be mounted at boot time.


    All filesystems have a mount point. A mount point* is the directory in which the
    filesystem begins. So before you can mount a filesystem, you need to make the
    mount point directory. Do not put files in the directory before the filesystem
    is mounted. If you do, they will be covered up by the filesystem.'
  - '[PAGE 96]


    # UNIX From Soup To Nuts


    They will still be there, but you will not be able to access them until you unmount
    the filesystem.


    The syntax to mount a directory is just the mount command followed by the filesystem
    name and the mount point. If I wanted to mount a cdrom on a mount point called
    /mnt, I would use the (mount cdrom /mnt) command. You would only need to mount
    a filesystem manually if it were new, or if you had defined it to mount automatically
    at boot time.


    There is more than one type of filesystem. Some of the popular ones that you are
    likely to run into on UNIX are filesystems (ufs); Journaled filesystems (jfs);
    Network filesystems (nfs); and CDrom filesystems (cdfs); (ext2), the default filesystem
    type for many Linux distributions; (ext3), which is essentially ext2 plus journaling;
    (devfs), a special filesystem for devices; and (proc), which is a special filesystem
    that does not actually exist on disk but is created virtually on the fly by the
    Kernel.


    There are several commands that deal directly with the creating, manipulating,
    and viewing of filesystem information. The specific flavor of UNIX you are using
    may provide slightly different utilities, but they will perform the same tasks.
    To define a new filesystem, AIX uses the crfs command, while Solaris uses the
    mkfs command. AIX also offers the chfs command to change and the lsfs command
    to view the properties of a filesystem. They both offer the df command to view
    the status of mounted filesystems.


    The df command is primarily used to keep track of what percentage of allocated
    disk space is still available. The df command by default displays the remaining
    disk in 512-byte blocks. Most people combine the df command with the -k option
    because that will display in 1024-byte blocks, which is equal to a megabyte. Solaris
    also offers the -h option to the df command, which displays in human readable
    format. That means it lists the output with the appropriate notation of K for
    kilobytes, B for bytes, or G for gigabytes. That tends to be considerably easier
    than doing the math when the df command displays the available disk space in a
    seven-digit 512-byte block number.


    The inode is a little guy that keeps track of information about your files. I
    have heard that the term inode is an acronym for I''m Not Operating DOS'
  - '[PAGE 97]


    Ever, but it is more likely that it refers to something to do with operating system
    indexes. The subject of inodes will no doubt get the attention of and impress
    the other geeks at a party, primarily because inode is a bit of a buzz word in
    UNIX crowds. The truth is, most UNIX users would not be able to give you an adequate
    explanation about what an inode is or what it is used for. For that you would
    probably need to find a seasoned system administrator.


    Every file or directory is assigned its own inode. The inode stores information
    like the size of a file; the UID of the file''s owner; the GID of the files owner;
    a unique identification number called an inode number; the file''s permission
    mode; some timestamps indicating when the inode was changed last, known as the
    (mime); and when the file was last modified, known as the (atime)and a counter
    that keeps track of how many links are pointing to the inode. Use the (ls -i)
    command to view a detailed listing of inode and file information. The information
    stored by inodes is defined by the POSIX standards for filesystem behavior. Adherence
    to these standards enables traditional UNIX utilities like fsck the ability to
    recover damaged filesystems.


    Although a UNIX filesystem has a limited number of inodes, it is unlikely that
    this limitation will cause you problems. This is primarily because in many other
    settings with UNIX, the limit is set so high to begin with that it should never
    cause a problem. If you are having filesystem related performance degradation,
    it is much more likely that your filesystem is too large or your filesystems are
    not laid out optimally on your disks. Poor filesystem setup can cause disk I/O
    contention, especially if the filesystem contains a database or some other I/O
    intensive application. That is not to say you can''t build large filesystems.
    Large filesystems are quite common on enterprise-class servers, but large filesystems
    are usually used for large files, not a large number of small files. A few large
    files that occupy the same amount of disk space as many small files will use a
    fewer number of inodes.


    A traditional UNIX filesystem does not have the ability to allocate additional
    inode space once the limit is reached. The inode attributes may vary depending
    on the specific flavor of UNIX and type of filesystem being used (jfs, ufs, zfs).
    If you suspect you are experiencing an inode shortage problem, use the (df -i)
    command to display the number of free inodes'
- md: '

    # UNIX From Soup To Nuts


    your filesystem. If you do run out of inodes, the command or application being
    used when the inode limit is reached will generate an error message from the operating
    system that refers to being unable to make a file. This is because all files are
    links to unique inode number. Whenever a program refers to a file name, the operating
    system references a table to look up its corresponding inode number. If multiple
    files in a filesystem have the same inode number, then they are hard links to
    each other.


    The following short exercises will get you familiar with how to navigate and manipulate
    directories. So if you have a UNIX system available, take the time to walk through
    the exercises in this book in your home directory. I recommend that you perform
    the exercises in your home directory. That will prevent any permissions problems
    or accidental damage to system files. The (cd) command executed with no argument
    will take you to your home directory. To verify that your home directory is supposed
    to be you execute the (echo $HOME) command. This will display the value of your
    HOME variable.


    Depending on how the home filesystem has been setup, your home directory may be
    a subdirectory of /home or /export/home. Some system administrators will create
    home directories for users on one server that exists for that purpose. The home
    directories are then mounted with nfs to whatever server you log in to, all of
    your scripts and personal files are there for you as well as any custom environment
    variables you have created. So every server will have the same working environment
    for the users. This also saves disk space that would otherwise be used duplicating
    files for users on every server they have a user account.


    # Exercises for Filesystems, Directories, and Paths


    - 1. What character represents the root directory?

    - 2. What is meant by absolute path?

    - 3. What is meant by relative path?

    - 4. What is the $PATH environment variable used for?

    - 5. What does the acronym NFS stand for?

    - 6. What does the acronym JFS stand for?

    - 7. What is the df command used for?

    - 8. What does an inode do?

    - 9. What command can be used to display what your home directory is?

    - 10. What command can be used to view the inode information for a filesystem?


    # 5 USERS, GROUPS, AND PERMISSIONS


    ### Users


    If a user is defined locally, then there will be an entry for the user in the
    password file. The password file is located at /etc/passwd or /etc/shadow, depending
    on the flavor of UNIX operating system you are working with. If your system has
    a shadow file, you should make any manual user account edits to the shadow file
    rather than the passwd (password) file. The system will automatically insert your
    changes into the passwd file for you. The purpose of the shadow file is to give
    you a place to work on accounts while the system is running. Since you are not
    actually working on the main passwd file, you do not interfere with users who
    are trying to log in to the system.


    When you have completed your work and saved the changes to the shadow file, the
    system will sync the shadow file with the passwd making them the same. If your
    system does not have a shadow file, you are stuck with editing the main passwd
    file. If this is the case, I suggest you make a copy of the passwd file before
    you begin and make your changes to the copy. When you are finished, you can manually
    move the copy into place and save a version of the old passwd file. A copy of
    the old passwd file can really save your bacon if your changes cause a problem.


    A problem with the passwd file can cause the system to hang when the system is
    rebooted. If this happens, the easiest solution is usually to boot the system
    from a removable media, like DVD or tape. Once the system is up and running from
    the removable media, you can mount the root filesystem in an alternate location
    and modify the password file with the copy you saved before you edited the file.
    Most systems have an alternate boot built in for you. Look in your root directory.
    If you see something like /a that has no apparent purpose, that is what it is
    there for. If you do not have such a directory, it is easy enough to make a directory.
    Right? After you fix the problematic passwd file, just remove the removable media
    and reboot the system. With a good password file in place, the system should boot
    without any problems.


    The passwd and shadow files store the following information about each locally
    defined system user in a colon-delimited format.


    | Field | Description |

    |---||---|

    | User name | The account name you log in with. |

    | Password | The passwords are stored in an encrypted format. They cannot be viewed
    or copied. |

    | UID | User ID - The system uses numbers to identify users. Each UID is unique
    and is associated with a unique user name. |

    | GID | Group ID – the system uses numbers to identify groups. The group text
    description is strictly for system users. |

    | Comment | The comment field is usually used to hold the user’s complete name
    and company or team. (John Smith – IFMC). |

    | Home Directory | The absolute path of the user’s home directory. |

    | Login shell | The absolute path of the user’s default shell. |


    If a user is defined in ldap (Lightweight Directory Access Protocol), then the
    same information is stored on a central ldap master server. This allows the information
    to be shared with all servers in the environment. However, it does not mean that
    a user will have access to all servers in the environment. If you have more than
    a handful of UNIX servers, you should really use ldap to manage the system.


    ### The Home Directory


    The home directory is where the user stores their personal files and configurations.
    It is the default directory when a user logs in. The path to the home directory
    is specified in the password file. If the home directory does not exist, the user
    may not be able to log in correctly.


    ### Passwords


    The password is used to authenticate the user. It is stored in an encrypted format
    in the shadow file. The password command is used to change the password. If a
    user forgets their password, the system administrator can reset it.

    '
