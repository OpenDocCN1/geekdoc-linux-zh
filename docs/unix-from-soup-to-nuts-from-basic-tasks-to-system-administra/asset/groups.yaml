    # Substituting or Removing Text from a File


    The *tr* command can be used to translate characters in a file to another character.
    Unless otherwise directed, the output will be sent to standard output. This means
    that the characters will not actually be changed in the file by default, but the
    file will be displayed on your screen as if the file has changed. This is an important
    safety feature that allows you to view what the command syntax you have chosen
    will do before you actually commit it to a file. To modify the file, you will
    need to redirect the output to a file. The following examples demonstrate how
    to direct input and output for the tr command. In the following example, file1
    will be sent to standard output, but any occurrences of the letter k will be deleted.
    The contents of file1 will remain unaltered.


    # tr -d k < file1


    In the following example, file1 will be the input for the tr command. The -s will
    translate any occurrence of the lowercase k into an uppercase K. The output will
    be sent to file2. The contents of file1 will remain unaltered. If file2 already
    exists, it will be overwritten.


    # tr -s k < file1 > file2


    # ROBERT B. FAY


    If you truly wanted to change all occurrences of k to K in file1 at this point,
    all you would need to do is move file2 to file1. Although for the sake of your
    data, you should make a copy of file1 first. This is always a good idea when manipulating
    data because the end result is not always what you expect it to be. To replace
    the original file with the new modified version file2, use the following syntax:


    ```

    #mv file2 file1

    ```


    The following table defines the flags used with the tr command.


    | Command | Option | Description |

    | --- | --- | --- |

    | tr | | Translate a single character into another. |

    | | -d | Delete the specified character. |

    | | -s | Substitute a single character for another. |


    The following table contains examples of ways to manipulate strings in a file.
    These are just some quick examples to get you thinking. Obviously these methods
    can be combined, modified, and can incorporate other UNIX commands. You should
    play around with these scenarios until you understand what each part is doing
    and then develop your own method to suit your needs. Once you get good at this
    sort of thing, you can begin writing your own commands by writing a command string
    and then using the alias command to create a one-word name or command to execute
    the string. For example, you could write a string to change the case of letters
    and call the command "case". There are a few ways to do this in the following
    examples.


    | Command Syntax | Description |

    | --- | --- |

    | cat file1 | sed ''s/abc/def/g'' file2 | Replace the string abc with def. This
    command reads text from file1 and writes it to file2. Every occurrence of the
    string abc is replaced by def. |

    | perl -i.bak -pe ''s/abc/def/g'' file1 | Replace the string abc with def in the
    file itself, and generate a backup of the original file in file1.bak. This command
    reads text from the file file1 and writes it back into the same file where every
    occurrence of the string abc is replaced by def. The original contents of file1
    are copied into file1.bak. |

    | cat file1 | tr ''[:upper:]'' ''[:lower:]'' > file2 | Change everything to lowercase.
    This command reads text from file1 and writes it in lowercase to file2. |

    | cat file1 | tr ''[:lower:]'' ''[:upper:]'' > file2 | Change everything to uppercase.
    This command reads text from file1 and writes it in uppercase to file2. |

    | cat file1 | tr ''[:a-z]'' ''[:A-Z]'' > file2 | Change everything to uppercase.
    This command reads text from file1 and writes it in uppercase to file2. |

    | cat file1 | tr -s ''[:space:]'' '' '' > file2 | Replace whitespace with a single
    space. This command reads text from file1 and writes it to file2 after replacing
    all types of whitespace (horizontal and vertical) with a single space. |

    | cat file1 | sed ''s/[0-9]/ DIGIT/g'' > file2 | Replace digits with the string
    " DIGIT ". This command reads text from file1 and writes it to file2 after replacing
    all appearances of digits with the string " DIGIT ". |

    | uniq file1 > file2 | The uniq command is used to remove duplicate lines from
    being repeated immediately after each other in a file. |

    | fold -w 10 file1 > file2 | The *fold command* is used to wrap the lines in a
    file to a specified width. The *–w flag* is used to specify the desired width
    of the lines in the file. |


