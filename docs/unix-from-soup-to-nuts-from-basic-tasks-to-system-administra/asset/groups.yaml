    ## Moving Data Between Devices


    Occasionally you may need to make tape-to-tape copies. This is a good idea for
    redundancy as well as reclamation. Tape reclamation is done when you have several
    tapes that each have either small amounts of data on them or small amounts of
    relevant data. The idea is that you can transfer the small bits of data from several
    tapes onto one or at least fewer tapes, thereby reclaiming the wasted tape space.
    Hence the name, reclamation. An excellent utility for performing this tape-to-tape
    transfer is the dd command.


    The dd utility is used to copy a specified input file to a specified output file.
    The files can be located on any type of accessible raw device. This makes it suitable
    to work with raw disks and tape devices. The input file is specified with the
    if= parameter, while the output file is specified by the of= parameter. If no
    input or output files are declared the dd command is executed, standard input
    and output are used by default.


    You may control the block size with the optional -b flag followed by a space and
    a number. Block sizes are specified in bytes. If you follow the block size with
    a k, the output file will be made in 1024-byte blocks. If you follow the block
    size number with a b, the output file will be made in 512-byte blocks. The following
    example demonstrates the required syntax to copy a file called datafile from tape
    drive rmt0 to tape drive rmt1. The example assumes the naming convention for raw
    tape devices is /dev/rmt#.


    ```

    #dd if=/dev/rmt0/datafile of=/dev/rmt1/datafile

    ```


    The dd command performs its function at a lower level than the standard UNIX cp
    command, it is better suited for copying entire disk partitions or entire disks.
    This makes it an acceptable option for system functions like backing up the boot
    sector on a disk. The cp command is well suited for this job because it does not
    copy disk space track for track. it merely copies the visible files ignoring white
    space, hidden files, and deleted files that are still present on a disk.


