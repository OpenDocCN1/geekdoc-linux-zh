    ## 8 杂类 UNIX 工具


    以下是大多数主流 UNIX 版本中包含的许多工具/命令之一。与任何其他 UNIX 命令一样，这些工具会根据执行该工具时使用的选项表现出不同的行为。因此，以下关于使用这些工具的描述和示例包含了
