    ## 8 MISCELLANEOUS UNIX UTILITIES


    The following are some of the many utilities / commands that are part of most
    mainstream flavors of UNIX. Like any other UNIX command, these utilities exhibit
    different behaviors based on the options the utility is executed with. Therefore,
    the following descriptions and examples of how to use the utilities include basic
    options that a UNIX user or administrator should learn. The list of options is
    not all-inclusive because of the differences between flavors and versions of UNIX.


    For a brief synopsis of available options with UNIX commands and utilities, try
    using the -h or -- (two dashes) options to display help. Many UNIX commands have
    the h option reserved for help. Usually the help consists of a list of available
    options with a brief description. Once you have tried these utilities out, you
    should look at the man page for the utilities on your operating system to see
    what additional options, features, and related commands are available.


    Most of the following utilities and commands include a table of useful options
    that may be executed to enhance or modify the output. It should be noted that
    although the options are listed individually for clarity, they can be executed
    together. You should try the options individually and then in different combinations
    to see which output format you find useful and easiest to read.


    ## UNIX From Soup To Nuts


    ### The bc (Boolean Calculator) Command


    Use the `bc` command to run the Boolean calculator utility to perform mathematical
    functions. The bc utility is handy for calculating large numbers because it can
    handle whatever numbers you can fit into your systems RAM and swap space. The
    bc utility can accomplish some very complicated calculations with the use of options,
    variables, and math library files if defined and requested on the command line.
    That being said, the purpose of this section is to make you aware of the bc utility
    and demonstrate some basic mathematical functions.


    If you are interested in learning more about the bc command, I encourage you to
    look up the man page for bc. Before long you will be hammering out extensive formulas
    on the command line that look much like C programming language functions. This
    is because bc and C have similar syntax. You will find some useful options for
    the bc utility in the following table.


    | Option | Description |

    | :--- | :--- |

    | -h | Help |

    | -i | Interactive mode. |

    | -l | Define the math library. |

    | -q | Quiet mode. (Skip the welcome message.) |

    | -v | Display the version of bc you are using. |

    | -w | Display warnings. |


    The most basic element in bc is the number. Numbers are displayed in decimal format
    and all computation is done in decimal. There are two attributes of numbers, the
    length and the scale. The length is the total number of digits in a number and
    the scale is the total number of digits after the decimal point. The following
    two examples demonstrate the length and scale attributes.


    Example 1: 123456


    Example 2: 1234.56


    The first example shows a number with a length of six. The second example shows
    a number with a length of six and a scale of two. This means that there are six
    digits in the number with four of the digits to the left of the decimal and two
    digits to the right of the decimal. The first example also has a scale value,
    but the value is zero so it is not necessary to tell you about it.


    The following examples demonstrate some simple addition, multiplication, and division
    calculations with bc with and without using the scale attribute. Start by entering
    bc on the command line and hit the return key. Enter the numbers separated by
    the calculation symbol you want to perform and hit the enter key again.


    The command prompt will stay in mode until you use the Control-d key sequence
    to escape back to the regular UNIX command prompt. If you want to use the scale
    attribute, you need to enter it before the calculation is performed, then hit
    enter and enter your numbers separated by the calculation symbol. The result to
    the calculation will be displayed in decimal format with the scale you asked for.


    Use the bc utility to add two whole numbers.


    ```bash

    #bc

    2+2

    ```


    Use the Ctrl-d key sequence to quit.


    Use the bc utility to multiply two whole numbers.


    ```bash

    #bc

    2*2

    ```


    Use the Ctrl-d key sequence to quit.


    ## UNIX From Soup To Nuts


    Use bc to divide 100 by 3 and display the result with 2 decimal places to the
    right of the decimal.


    ```bash

    #bc

    scale=2

    100/3

    ```


    Use the Ctrl-d key sequence to quit.


    ### The cal (Calendar) Command


    The `cal` or calendar command can be used to display a one month calendar for
    any month in the past, present day, or future. If executed with no argument cal
    will display the calendar for the current month based on the system clock. If
    executed with the argument of cal 7 1776, the cal command will display the calendar
    for July 1776. If executed with the argument of cal 12 3000, the cal command will
    display the calendar for December 3000. You can have some fun with the cal command.
    I like to use it to see what day of the week my birthday and holidays will be
    on the following year.


    Use the calendar to show what day of the week the fourth of July was on in the
