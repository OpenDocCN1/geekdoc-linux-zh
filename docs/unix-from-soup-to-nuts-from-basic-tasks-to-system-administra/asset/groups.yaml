    # ROBERT B. FAY


    Things awk is not really well suited for large or complicated tasks. Since awk
    is an interpreted language, awk scripts require the binary to run them. This means
    basically that you cannot compile the awk script and then run it by itself on
    a system that does not include the awk binary program. Compared to compiled code,
    awk scripts run relatively slowly because every time an awk script is run, the
    script is interpreted by the awk binary that is called by the operating system.
    However, as I said, the difference between compiled codes and interpreted script
    is vast in computer processing time, but to a human, the difference is negligible.
    You probably will not even notice the script is being read. Most of the time,
    the response to an executed awk script should seem instant at the command prompt.
    If the processing time difference is a problem for you, then you can purchase
    a second party application to compile and speed up the processing time, but you
    will have to pay for such a program where awk comes with the UNIX operating system
    at no additional charge.


    Although the tasks I use for the most are quick and dirty juggling of data, awk
    can actually be used for more sophisticated tasks, like creating small databases
    and performing mathematical operations on files that contain numerical data. The
    mechanisms that awk uses to perform functions are simple enough that people familiar
    with programming languages like BASIC or C should pick it up with no problem.
    If you have never worked with a programming language before, simply observe the
    following one liner examples to figure out what individual functions awk can perform,
    then move on to more complicated functions addressed by the database section.
    You will have it figured out in no time.


    # Command Line Examples (One Liners)


    It is easy to use awk from the command line to perform simple operations on text
    files. Suppose I have a file named “coins” that describes a coin collection. Each
    line in the file contains the following information: the mineral the coin is made
    of; the weight of the coin measured in ounces, the date the coin was minted, the
    country of origin, and a description of the coin.'
