    a comment. The following four examples illustrate how pound signs are used in
    a file to create a space where comments or notes can be made about the file and
    ignored by the shell. Note that everything to the left of the first pound sign
    is ignored by the operating system. The four examples are meant to demonstrate
    that white space, special characters, additional pound signs, and test are disregarded
    when they are preceded by a pound sign.


    ```

