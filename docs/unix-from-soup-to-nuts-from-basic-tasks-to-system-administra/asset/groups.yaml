    # Moving or Renaming


    The move and rename are used synonymously in the UNIX world. The truth is, there
    is no rename command. Both functions are accomplished with the move [mv] command.
    This is because to UNIX, moving a file from one location to another is the same
    as moving a file from one name to another. Remember, UNIX uses the file''s inode
    to rename where it is. The names are just for us people. You do not need to be
    sitting in the source or destination directory of the move command syntax in order
    to move a file between them. The syntax to move a file within the same directory
    is (mv oldfile newfile). To move a file from your current directory to the /tmp
    directory, the syntax would be (mv oldfile /tmp/newfile). Actually, if the filename
    is going to be the same at the new location, you can save yourself some keystrokes
    and use the syntax (mv oldfile /tmp/). The last slash at the end of /tmp/ tells
    UNIX to drop it in the /tmp directory with the same name.


    Incidentally, it is always a good idea to use absolute paths if you are moving
    a file to a new directory it ends up where you wanted it. If you miss a file,
    you may be forced to learn how to use the [find] command. Actually, you should
    learn how to use the find command anyway, but it is better to learn how to use
    the find before you HAVE to find something. That way you are more likely to be
    successful at finding it.


    # Removing or Deleting


    The remove [rm] command is fairly self-explanatory. It is used to remove or delete
    unwanted files or directories. Be careful with this command. UNIX does not have
    a recycle bin. I really cannot stress this point enough. Once you remove a file,
    it is gone. If the file was created since the last backup was made of the system,
    there will be no way to get it back. The syntax for the remove'
  - '[PAGE 48]


    # UNIX From Soup To Nuts


    command is simply the command followed by the file you want to remove (rm file).
    The remove command accompanied by the -r option is very efficient for removing
    directories and everything in them. This includes sub-directories and anything
    in them as well. Because it is so efficient, it is also very dangerous. The operating
    system will not pause and ask you if you are sure. Once you hit the return key,
    whatever you told UNIX to remove will be gone. UNIX also offers the remove directory
    [rmdir] command. But the rmdir command only works on empty directories.


    | Command | Option | Description |

    |---|---|---|

    | rm | | Remove a file. |

    | | -r | Recursive remove a file or directory. |


    # Listing, Finding, and Printing Files


    The following section discusses how to find a file, how to generate lists of files,
    and how to tell what kind of file it is. To accomplish these tasks, the [find],
    ls, [grep], [egrep], [fgrep], and [file] commands will be used. A brief discussion
    and example will be provided for each of these commands.


    # The Find Command


    The find command does exactly what the name implies. It finds stuff. The find
    command has useful operands that can be coupled with it to help you find a file
    by the file''s name, age, or size. My favorite way to find the command is with
    the name operand because it allows wild cards to be used with it. This means that
    I do not have to know exactly what the file''s name is to find it. Additionally,
    trying to find a file on a large system can take a while, so if you know what
    part of the system, or at least what filesystem, the file lives in, you can greatly
    cut down on the search time by telling find where to start looking. The syntax
    of how to find a file by name named testfile1 starting in the /tmp directory is
    as follows.


    ```

    #find /tmp -name testfile1

    ```'
