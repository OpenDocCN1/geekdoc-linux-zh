    | tty | tin | Time receiving input from tty |

    | tty | tout | Time sending output to tty |

    | dad0 | kps | Kilobytes read per second |

    | dad0 | tps | Transfers per second issued to the device |

    | dad0 | serv | Time waiting for service |

    | dad1 | kps | Kilobytes read per second |

    | dad1 | tps | Transfers per second issued to the device |

    | dad1 | serv | Time waiting for service |

    | ramdisk1 | kps | Kilobytes read per second |

    | ramdisk1 | tps | Transfers per second issued to the device |

    | ramdisk1 | serv | Time waiting for service |

    | sd1 | kps | Kilobytes read per second |

