    ## 杀死你的进程


    用户不能杀死其他用户的进程。该规则的例外是 root 用户。系统管理员使用 root 用户来管理系统。root 用户拥有控制所有进程的权限。我所说的控制是指
    root 用户可以杀死或取消进程，或者更改进程的优先级。通过在后台运行进程，该进程的优先级会降低。


    系统资源将被高优先级进程使用，直到它们完成，此时低优先级的进程将重新获得系统资源（如 CPU 周期和内存）。你可以使用 kill 命令杀死你自己的进程。有时命令会被接受，但进程不会结束。这通常意味着该进程仍有子进程在运行。如果你仍然杀死父进程，可以使用带有
    -9 选项的 kill 命令。这意味着无论如何都杀死该进程。


    杀死或取消进程的语法是 kill #，其中 # 是来自进程表的进程标识符或 (pid) 号。你也可以使用 pkill 命令取消你自己的进程。pkill 命令的用法与
    kill 命令相同，只是你可以用进程名代替 pid。在下面的示例中，使用 ps -elf 命令生成进程详情。pid 是 1001，进程名是 inet。


    | PID | PPID | PGID | UID | STIME | COMMAND |

    | --- | --- | --- | --- | --- | --- |

    | 1001 | | | | | inet |


    在下面的示例中，使用 ps -elf 命令生成进程详情。pid 是 1001，进程名是 inet。


    ```

    - kill #pid

    - pkill name

    ```


    ## 僵尸进程


    僵尸进程是已执行但在进程表中仍有条目的进程。这种情况发生是因为父进程尚未读取退出状态。僵尸进程不消耗资源，但占用进程 ID。如果父进程未能回收其子进程，它们会被
    init 进程收养，并由其回收。


    ## 守护进程


    Daemon（发音同 day，而不是 demon）是在启动时启动并等待请求的进程。大多数守护进程对系统无害。僵尸的存在仅仅令人讨厌。守护进程的示例包括 ntpd
    和 syslogd。很容易看出这两个守护进程的用途。对吧？


    ntpd 守护进程在后台运行并频繁与网络时间服务器通信。通过使用网络时间协议，系统时与网络上的所有其他服务器保持同步。准确的系统时间对于日志以及依赖时间的应用程序（如数据库）非常重要。


