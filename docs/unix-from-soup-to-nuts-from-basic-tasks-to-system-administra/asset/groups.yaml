    ## Using sed


    *sed* command is a program for editing data. It stands for stream editor. The
    general syntax of sed is (sed options input file). The command options will be
    applied to each line of input file. If no input file is specified, standard input
    is assumed. As sed applies the indicated command options to each line, it writes
    the results to standard output unless otherwise directed. I almost always direct
    sed to send the output to a file. If you do not do this, you will have to rerun
    the same sed command every time you want to reference the data. If you''re going
    to use the cpu cycles to edit a stream of data, you may well put them somewhere
    you can use them. The exception here is if you just need to see that you got the
    syntax correct. The following table has the typical command options used for simple
    stream editing.


    | Command | Option | Description |

    | --- | --- | --- |

    | sed | | |

    | | d | Delete. |

    | | g | Replace the contents of the pattern space with the contents of the hold
    space. |

    | | -n | Don''t print this line unless directed to the p option. |

    | | p | Print (Override the n option). |

    | | s | Substitution. |


    ## d - Delete


    This option is pretty straightforward. So be careful with it. The danger comes
    from its simplicity. The d option will delete whatever you tell it to, not whatever
    you meant to tell it. A good practice is to send the output for a file so you
    can review it before you commit to saving the output to a file. The following
    sed command syntax demonstrates how delete lines that contain the word “junk”
    from a file.


    ```

    # sed ''/junk/d'' < filename

    ```


    ## g - Global


    Like UNIX utilities, the default behavior of sed is to work on files, reading
    one line at a time. If you tell sed to change a word, it will only change

    '
