    第一方法是后台处理。在后台运行进程是指能够执行 UNIX 命令或脚本，然后离开它甚至注销系统而不结束该进程的能力。当你在后台运行一个进程时，它会被提交，操作系统会向你返回命令行提示符，这样你就可以继续你之前正在做的工作。


    后台进程将停留在那里等待系统资源可用。普通进程的优先级高于后台进程。因此，如果一个后台进程正在使用系统资源，而启动了一个普通进程，则后台进程将放弃其资源，直到普通进程结束。然后，后台进程将恢复其处理，依此类推，直到其完成。通过在
    UNIX 命令后加上空格和和符符号（&）可以启动后台进程。


    控制进程时机的第二种方法与顺序处理有关。要在上一个进程结束后立即开始一个进程，请在命令行中的两个命令之间放置一个分号（;）。(command1; command2)


    第三种控制进程时机的方法与并行处理有关。要同时运行两个进程，请在命令行中的每个命令后放置一个和符（&）。这本质上是将所有进程都放在后台运行，此时内核将在它们之间共享资源。(command1
    & command2)。下表是 ps 命令及其最常用命令选项的快速参考。


    | 命令 | 选项 | 说明 |

    | --- | --- | --- |

    | ps | | 列出进程表项。 |

    | | -e | 显示所有运行进程的信息。 |

    | | -f | 显示有关进程的更详细信息。 |

    | | -u | 显示特定 userid 的进程信息。你必须在 -u 之后指定 userid 和分隔符。 |

    | | -x | 显示除连接到活动 tty 会话的所有活动进程。 |

    | | -A | 显示所有活动进程。 |


