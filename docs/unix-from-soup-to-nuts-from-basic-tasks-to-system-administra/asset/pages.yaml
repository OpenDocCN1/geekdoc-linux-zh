    ## Displaying DOS Files in UNIX

    nFiles that have been created or modified in a DOS or Windows environment will
    often include control characters, end of line markers, or carriage return symbols.
    Since these symbols are foreign to UNIX, the UNIX Kernel does not interpret the
    characters correctly and may process the files or display them incorrectly. To
    deal with this situation, the `dos2unix` command was invented to strip out the
    unacceptable characters to make the file readable by UNIX correctly. So if you
    think a file is corrupt for some reason and cannot figure out why, try using the
    dos2unix command to convert the file before giving up on it. The worst that can
    happen is the file will still be corrupt, so you have nothing to lose.


