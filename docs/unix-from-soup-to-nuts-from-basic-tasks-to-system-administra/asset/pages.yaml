  md: '# UNIX From Soup To Nuts


    Using the input list is with the find command. To create an archive of a directory,
    including all of its contents and possible sub-directories, compress it with gzip
    and write the results to a file. The following is a syntax example of how to do
    this:


    ```

    #find dir1 -print | cpio -o | gzip > dir1.cpio.gz

    ```


    To perform an incremental backup with cpio of files that have changed from the
    previous day, use the following syntax: (find dir1 -ctime -1 -print | cpio -o
    | gzip >dir1.cpio.gz).


    Using the find command to create the input list of files opens the door to your
    ability to be very selective in the manner in which you archive your files. A
    quick review of the find command should hopefully ignite some spark for a few
    ideas of how to generate a list of files based on age, location, owner or whatever
    else is relevant information at the time.


    Once you have developed a few of your favorite ways to create file lists, it is
    a simple step from there to put those commands into a script and execute them
    whenever you want. You can even use the systems scheduler to kick off your backup
    jobs on a regularly scheduled basis. To extract files from an archive, use the
    -i (copy in) command line. That will tell cpio to read an archive from stdin and
    extract the files from it. So, assuming the archive is compressed, do this: (gzcat
    dir1.cpio.gz | cpio -i).


    Although cpio archives are usually smaller than tar archives, the following example
    shows perfectly why I prefer to use the tar method over the cpio method when given
    the choice. As you can see, the following example performs the very basic task
    of backing up the contents of the current directory. The cpio command requires
    the help of another command and significantly more keystrokes to perform the same
    function.'
  merge: -1
