    # Standards


    Although UNIX is considered to be an open system, there are still certain standards
    that are followed by vendors and developers. Adhering to these standards helps
    to insure the portability of applications and utilities between different UNIX
    platforms and distributions. Beginning in the late 1980s, an open operating system
    standardization effort now known as POSIX provided a common baseline for all operating
    systems; IEEE based POSIX around the common structure of the major competing variants
    of the UNIX system, publishing the first POSIX standard in 1988. At around the
    same time, a separate but very similar standard known as the Single UNIX Specification
    was produced by the Open Group. The following groups have been formed to develop
    standards for UNIX.


