    # The Home Directory


    A home directory can be on a local device or it can be mounted from another server.
    Keeping home directories on a central server and nfs mounting them to all other
    servers in an environment can be handy. NFS-mounted home directories allows users
    to have access to all of their files wherever they are logged in. Additionally,
    it stops users from asking the system administrator why files were deleted when
    the real problem is the user cannot remember which server they were logged into
    when they created a file.


    The home directory is where a user will be placed when they log in to the system.
    The home directory is where you should keep all of your files that you do not
    share with other users. Your home directory shares disk space with all of the
    other system users, so if you are not responsible about the housekeeping of your
    home directory, you may hear about it from other users or the system administrator
    when the /home or /export/home filesystem fills up.


