    The term *print* is used in the print working directory command because when UNIX
    was created, the printer was the system visual interface. You could not see what
    you were doing on a monitor like you can today. So use the pwd command if you
    get lost to find out exactly where you are in the system directory structure.


    The term *parent directory* refers to the directory one level up from your working
    directory. So, if your working directory is /usr/local/bin, then the parent directory
    would be /usr/local. A *child directory* is any directory that is located inside
    a parent directory.


    A *filesystem* is a section of disk space that has been defined to the operating
    system. The disk space does not all need to be on the same physical disk. Does
    it not need to be local to the machine the filesystem is defined on. The disk
    may be part of an external disk or disk array. It may also be located on another
    server. The only requirement is that the disk is accessible so that the operating
    system can access it. The filesystem definition includes information like the
    name of the filesystem, the absolute path of the mount point, the disk volume
    that the filesystem resides on, and whether or not the filesystem should automatically
    be mounted at boot time.


    All filesystems have a mount point. A mount point* is the directory in which the
    filesystem begins. So before you can mount a filesystem, you need to make the
    mount point directory. Do not put files in the directory before the filesystem
    is mounted. If you do, they will be covered up by the filesystem.'
