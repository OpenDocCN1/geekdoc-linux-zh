    # Quoting Rules


    The UNIX shell uses three characters for quoting: single quotes (''), double quotes
    ("), and backslashes (\). The following table explains the different methods of
    quoting and when to use them. Quotes allow characters to be used as literals.
    This allows the operating system to ignore special characters and words that would
    normally be commands.


    | Type | Description | When to Use Each Method of Quoting |

    | --- | --- | --- |

    | \ | Backslash | A backslash (\) protects the next character except if it is
    a newline. (\n) If a backslash precedes a newline, it prevents the newline from
    being interpreted as a command separator. |

    | " | Single quotes | Single quotes (''...'') protect everything (even backslashes,
    newlines, etc.) except single quotes, until the next single quote. |

    | "" | Double quotes | Double quotes (""...") protect everything except double
    quotes, backslashes, dollar signs, and back quotes, until the next double quote.
    A backslash can be used to protect ", \, $, or ` within double quotes. |'
