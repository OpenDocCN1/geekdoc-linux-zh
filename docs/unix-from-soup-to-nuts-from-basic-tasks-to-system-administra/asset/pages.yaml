    I usually do not concern myself with the specific definitions of exit statuses
    because it is a general rule that an exit status of 0 indicates success, while
    anything greater than 0 is a failure. However, in the case of the mt utility,
    I make an exception because there are only two other possible exit statuses and
    knowing the difference between the two may assist in debugging a problem.


    The exit status of 1 indicates that the issued command was unrecognized or mt
    for some reason. The reasons for getting an exit status of 1 are usually because
    you mistyped the command, the tape drive is powered off, or there is a communication
    problem with the tape device. A communication problem can take a few forms. It
    could mean that the device is not defined correctly, there could be an I/O cable
    problem, or the device may not be terminated correctly. The exit status of 2 simply
    means the operation failed. This is not very helpful, but at least you know you
    didn''t type the command wrong. In this case, it is more likely that there may
    be a problem with the tape media.


    Tapes do not last forever and they have their faults, but most of the time they
    work and they can save you when those important files go missing or get corrupted.
    Some of the common problems with overused tapes are that they can break when they
    finish rewinding, and sometimes the see-saw effect of positioning the tape to
    find a record can stretch the tape over time. When a tape gets stretched, the
    blocking gets distorted and it becomes unreadable. New tapes tend to some of the
    magnetic matter flake off the first couple of times they are used. This does not
    damage the tape, but the particles of magnetic matter get on the heads of the
    tape drive, which requires the drive'
