    the file will be readable, since, since there are no end of line markers or carriage
    characters, a word-processing program in a Windows environment will usually display
    each paragraph as one long line. You can fix this by hitting the return key wherever
    the line should wrap on the screen in your word processor or convert the file
    with the unix2dos command on a UNIX system. The following two examples demonstrate
    the proper use of the dos2unix and unix2dos commands:


