    5=Friday, 6=Saturday |

    | 6 | Command | Executable file or command syntax. It is best to use the absolute
    path of executables in the crontab since you cannot depend on your shell environment
    variables being active when you are not logged in.|


    An asterisk (*) may be substituted for a number in any of the first five fields
    of a crontab entry. The asterisk represents a wildcard that represents all legal
    values for that field. So field five which is the day of the week field, * and
    0-6 and 0,1,2,3,4,5,6 all have the same meaning and are all legal values. The
    hyphen in the 0-6 represents an inclusive range. In the previous example, the
    numbers have been separated by commas. You do not need to list a complete range
    of numbers to use the comma separator. You could have used 0,3,5 if you just wanted
    to execute a command on Sunday, Wednesday, and Friday.'
