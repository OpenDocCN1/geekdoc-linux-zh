    # Aliases


    The [alias] mechanism is available to create a user-defined identifier to a command
    or list of commands that will be executed when the identifier is used at the command
    line. Simply stated, the alias command allows a user to remember a single word
    or command that is used to execute a more complicated or difficult to remember
    command syntax. A common alias I have seen on many UNIX operating systems is for
    the df command. The df command is almost always executed with a common option
    like -k or -h, depending on the user''s personal preference. So, when a user creates
    an alias of df for the command syntax -h, the user will just need to type df at
    the command line and the system will run df -h. Obviously this example is not
    a difficult to remember syntax, rather the alias is used to save three key strokes
    whenever the frequently used df -h command is executed. As simple as the previous
    example is, I believe a UNIX user will understand how powerful the alias command
    can be to save time, key strokes, and the need to memorize complicated commands.


    The alias command can be used to display the aliases that are active in the current
    shell and how the aliases are defined. To view the defined aliases, simply execute
    the alias command by itself without any arguments. If an alias is defined incorrectly,
    or if you simply want to remove an alias, use the [unalias] command. The argument
    you must provide the unalias command is the name of the alias you would like to
    remove. An alias that defined in a session will only be available for that particular
    login session unless the user defines the alias within their .profile file in
    their home directory.


