  md: 'The following example demonstrates the simplest form of syntax in an awk script:


    ```

    #awk <search pattern> {<program actions>} filename

    ```


    The awk binary searches through the input file for each line that contains the
    search pattern. For each line found that meets the search criteria, awk then performs
    the specified actions. In this example, the action is specified as {print $5,
    $6, $7, $8}, so awk prints the fifth through the eighth column of data which in
    the coins file is the description. The purpose of the print statement is to display
    column five through eight only. The preceding $ with the numerical column identifier
    identifies it as a field variable, which stores the words in each line of text
    by their numeric sequence. $1, for example, stores the first word in the line,
    $2 has the second, and so on. By default, a word is defined as any string of printing
    characters separated by spaces.


    Since coins has the structure of mineral, weight in oz, date, country, and description,
    then the field variables are matched to each line of text in the file as follows:


    +   mineral: $1

    weight: $2

    date: $3

    country: $4

    description: $5 through $8


    The program action in this example prints the fields that contain the description.
    The description field in the file may actually include from one to four words,
    but that''s not a problem, since "print" simply ignores any undefined fields.
    Awk’s default program’s logical action is to print the entire line, which is what
    print does when invoked without parameters. This means that the first example:


    ```

    #awk ''/gold/'' coins, is the same as #awk ''/gold/ {print}'' coins

    ```'
