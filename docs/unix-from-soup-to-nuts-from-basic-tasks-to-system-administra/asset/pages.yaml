    # Introduction to awk


    The [awk] command, or more stated, programming language, is a very powerful tool
    frequently used to clean up, parse, and rearrange the text or numerical output
    from other UNIX commands. Before we get into awk, I would like to clear up a few
    misconceptions about awk and perhaps provide some trivia for the next gathering
    of Geeks you attend. The sed and awk tools are often mentioned together as if
    they are one. I have seen books with sed and awk together in the title. Perhaps
    this is simply because there is not enough interesting material available to write
    an entire book on one or the other subject, so they are combined into one source.
    Whatever the reason, my point is that although they can certainly be used in conjunction
    with one another, sed and awk are not dependent on each other. They are separate
    tools that were developed separately.

    Now for the trivia. The name awk does not actually mean anything like some UNIX
    commands that are abbreviations for proper English words. The letters a, w, and
    k are actually the first letters of the last names of the developers who created
    awk. The names of the three developers are Alfred Aho, Peter Weinberger, and Brian
    Kemighiga. These three gentlemen worked together at Bell labs in the 1970s when
    they developed awk.

    Since the development of the original awk, there have been other releases developed.
    The other releases are [gawk], which is the GNU version of awk; [mawk], which
    is a speedier rewrite of awk; which is the new


