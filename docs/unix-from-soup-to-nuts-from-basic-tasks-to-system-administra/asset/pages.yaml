  md: '# 4 FILESYSTEMS, DIRECTORIES, AND PATHS


    The UNIX operating system has a hierarchical structure. The filesystems and directory
    structure can be represented with an inverted tree diagram. Just as a tree has
    roots, the operating system has a root directory from which all other directories
    stem.


    The root directory is represented by the forward slash symbol /. At boot time
    the operating system reads the filesystem configuration file being used by your
    particular flavor of UNIX. Some locations you may find the filesystem configuration
    file are /etc/fstab, /etc/filesystems, or /etc/fstab. For the purposes of this
    discussion, I will refer to vfstab as the configuration file being used. The vfstab
    provides the operating system kernel instructions on what order to mount the filesystems
    and where to mount them. When I say “mount", that refers to the location the filesystem
    will be found in the tree diagram for your system. Every filesystem has a mount
    point.


    The mount point is the directory which is the absolute path where the filesystem
    starts. The mount point is one of the pieces of information stored in the vfstab.
    The vfstab also includes information like what storage device a filesystem is
    associated with, what type of filesystem each filesystem is, and if a filesystem
    should be automatically mounted at boot time. The vfstab is stored in the /etc
    directory. Since /etc is not a filesystem, it is a sub Gli of the root directory
    (/). So it is located in the root filesystem.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# UNIX From Soup To Nuts


    ![](img/89df3d0f73a9f8ee67c84c5b320e4e83_94_0.png)


    A path in the operating system is symbolic of a path in the wilderness. You need
    to follow the path to get to where you want to be. The PATH environment variable
    is like a map to tell the operating system where you want to be able to go. To
    view the directories in your PATH, use the echo $PATH command. This will display
    the locations of all commands you can run without telling UNIX where to look for
    them. The format of the listing is directory paths delimited or separated by the
    colon character (:). If a directory is not in your PATH variable, then you will
    not be able to find it or execute commands that reside in the directory unless
    you explicitly tell the operating system where it is. Such explicit directions
    are called absolute paths.


    An absolute path refers to a location somewhere in a systems hierarchical structure.
    The reference always begins with the root directory (represented by /) and builds
    a path to its destination file or directory. An absolute path is really the most
    accurate way to reference system locations when used with the cd (change directory)
    command, within a configuration file, or as part of a script. So, if you wanted
    to cd to /usr/local/bin from /var/tmp, you would simply use the following command
    syntax: cd /usr/local/bin.'
