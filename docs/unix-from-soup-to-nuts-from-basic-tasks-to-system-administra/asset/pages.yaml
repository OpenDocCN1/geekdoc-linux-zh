  md: '# Redirecting Files and Output


    The redirection of files and output can be achieved through the use of the following
    commands:


    | Command | Name | Description |

    | | | pipe | Make the output of the command to the left of the pipe input to the
    command to the right of the pipe. |

    | > | | Send output to a new file or overwrite an existing file. |

    | >> | | Send output to a new file if the specified file does not exist. If the
    specified already exists, then append the output to the end of the file. |

    | tee | tee | Send output to two places like standard output and a file simultaneously.
    |


    The following examples demonstrate the use of the redirection symbols.


    ```

    #ls -al | grep x

    ```


    The above command string sends the output of the ls -al command to the grep command.
    The grep command then displays only the lines of the ls -al output that contain
    the letter “x”. The result is the listing only executable files or files with
    the letter x in the name.


    ```

    #ls -al > file.out

    ```


    The above command string sends the output of the ls -al command to the file named
    file.out. If the file.out did not exist before, it has just been created. If the
    file.out file did exist before, it has just been overwritten. In either case,
    the output is sent to the file only. No output is displayed on the screen.'
