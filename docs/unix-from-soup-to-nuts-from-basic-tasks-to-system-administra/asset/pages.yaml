    # Common Directory Names


    Certain directory names are used in more than one location in UNIX. You may also
    see them used within applications that run on UNIX platforms. This standardization
    allows us to intuitively know where to look for and where to put certain types
    of files. The following list includes the names and descriptions of common directories.


    | Name | Description |

    | bin | This is a directory that holds executable files, utilities, and ready-to-run
    programs that the system needs to boot. Think of this as a physical storage bin.
    |

    | dev | This directory holds files that support devices. |

    | etc | This is a directory that holds configuration files. Do not mess around
    in here until you know what you are doing. At the very least, make a copy of any
    configuration file before you edit it. At some point in the future, you will be
    glad you adopted the practice of making copies before changing something. |

    | home | This is a directory full of sub-directories. There should be a sub-directory
    for every user that has an account on the system. The user''s home directory is
    where the user will be placed when they log on to the system. The home directory
    is where users should store all of their personal files. |'
