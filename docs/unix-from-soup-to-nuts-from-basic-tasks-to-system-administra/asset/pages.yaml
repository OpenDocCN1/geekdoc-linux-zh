    # Connecting To Accessing UNIX


    There are a couple of ways you can access a UNIX system. The main mode of access
    to a UNIX machine is through a terminal. A terminal includes a keyboard and a
    video monitor. The Kernel runs a process called a ty that connects to the UNIX
    system, accepts input from the terminal and sends output to the terminal. The
    ty processes are utility programs, and they must be told the capabilities of the
    terminal in order to correctly read from, and write to, the terminal. If the ty
    process receives incorrect information about the terminal type, unexpected results
    can occur. To display the current terminal type, enter the following syntax at
    the command prompt:


    ```

    #echo $TERM

    ```


