- img_proc: true
  md: 'The logic behind the compression tools is pretty straightforward. They do not
    perform the tasks in the same way, but essentially, the tool removes everything
    that you don''t need to maintain the integrity of what you are compressing. Usually
    this means getting rid of all of the white space and other bits that do not actually
    hold data. Somehow the tools map where the white space goes and reinserts it when
    the files are uncompressed.


    # compress


    The `compress` command is very straightforward. You just follow the command with
    the name of the file you want to compress. After you use the compress command
    to compress a file, you will notice that the file has a “Z” extension tacked on
    to it. This is handy because it reminds you later what type of file it is.


    To uncompress the compressed file, you use the `uncompress` command rather than
    the compress command with an option. Don''t ask me why this was done, but it works,
    just remember it and move on. The following two examples demonstrate how to compress
    and uncompress with the two respective commands.


    ```

    #compress filename

    ```


    ```

    #uncompress filename

    ```


    # zcat


    The `zcat` utility is used to display on standard output the uncompressed form
    of a file that has been compressed using the UNIX compress command. Using zcat
    is essentially the equivalent of using the uncompress command with the `-c` option.
    Using zcat to display the contents of a compressed file does not affect the compressed
    file.


    # zip and gzip


    The `zip` compression tool, like the compress tool, has a companion command to
    unzip zipped files. You guessed it, it is called `unzip`. I like the zip command
    because when it makes the zipped file, it tells you how much space it saved. For
    example, if I ask it to zip a file called coins, it will respond with'
