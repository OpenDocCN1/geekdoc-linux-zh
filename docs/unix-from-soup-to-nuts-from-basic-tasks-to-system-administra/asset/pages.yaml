    # Printing Files


    As with other operating systems, the way to print a file is to send a copy of
    the file to a print queue. The print queue is a holding area where print jobs
    wait their turn to be printed. In UNIX, a print queue must be configured for each
    printer the operating system is going to send print jobs to. The print job will
    sit in the print queue either the operating system wakes up the printer and tells
    it there is a print job waiting in the queue, or if the printer is already active,
    the print job may sit in the print queue until the jobs ahead of it in the queue
    are gone and the printer device is ready to process it. If there is only one print
    queue configured on the system, then that is the only printer the operating system
    knows about, and it will be the default printer for all print jobs. However, if
    there is more than one print queue configured, print jobs will need to be directed
    to a particular print queue with the [lp] command.


    The [lp] command can be used to send a print job to a printer. If there is only
    one print queue defined, then the syntax is simply lp filename. However, if your
    operating system has multiple print queues defined, you will need to use the -d
    option to direct your print job to a particular printer. So if you want to send
    the print job to the printer you have named printer1, you would type the following
    syntax at the command prompt:


    ```

    #lp -d printer1 printme


    > (Where printme is the name of the file to be printed.)

    ```


    To verify the print job sent to the correct print queue, you may use the [lpstat]
    command, which will show you the current status of all defined print queues. The
    lpstat only shows what is currently waiting to be printed in the print queue.
    So if your print jobs before you can type the lpstat command, you will never see
    it listed in the queue. I usually use the lpstat command to monitor the status
    of print queues of very busy printers where users are frequently printing large
    batch reports. Sometimes a user will get anxious and submit the same print job
    multiple times because it did not print immediately. While the reason your print
    job did not immediately may take some detective work, they will be calling asking
    you to increase their priority in the print queue or to cancel the print jobs
    they submitted that have finally begun to print over and over.'
