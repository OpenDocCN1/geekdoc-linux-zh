  md: '# System Configuration Files


    The system configuration files are a set of files that provide instructions to
    the kernel and the utility programs. The kernel and the utility programs read
    the configuration files at startup to decide how to behave during execution time.
    The UNIX kernel and utilities are flexible programs, and certain aspects of their
    behavior can be controlled. The configuration files are the medium you can use
    to exercise this control. Since the kernel and utility programs read the configuration
    files at startup, it usually takes a reboot of the system or a restart of a service
    or utility program before the changes to the configuration files are noticed and
    the changes are implemented. It should be noted that startup means means different
    things for the kernel than it does for a utility program.


    To the kernel, startup means to reboot the operating system. While it is possible
    to make the kernel refresh itself by rereading the configuration files, it is
    much easier to reboot the entire operating system. However, make sure you understand
    what the changes to the kernel will affect before you implement them. I recommend
