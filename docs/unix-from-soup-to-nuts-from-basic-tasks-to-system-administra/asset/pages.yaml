    # The uname Command


    The [uname] command displays the machine’s unique hardware ID

    number. This is not the same as the frame serial number or part number for

    the operating system. The unique ID number is a combination of the

    hardware model, sub-model, and the ID of the server back plane. The unique

    ID for the entire system should be a 12-digit number.


    It has been my experience that the first two digits are always 00. These

    digits are perhaps place-holders for systems with longer model numbers or

    for information that is not yet or has ceased to be included in the uname

    output. The following table explains which options to use to display specific

    system information with the uname command.


    | uname Command Options |

    | Option | Description |

    | -a | All information. |

    | -n | Node name. |

    | -m | Machine ID number. |

    | -p | Architecture of system processor (SPARC, RISC, AMD, Intel). |

    | -v | Operating System version. |

    | -X | Number of CPUs. |'
