  md: '# 1 UNIX BASICS


    This book is intended for users of UNIX and Linux operating systems. However,
    throughout the body of this text, the discussions refer to the UNIX operating
    system unless a feature is being discussed that is unique to a distribution of
    the Linux operating system. My intent is to introduce basic and vital concepts
    that must be grasped by both users and Systems Administrators of UNIX operating
    systems alike. I have included topics in beginner UNIX training courses up through
    intermediate-level System Administration courses.


    This book is not intended to be a System Administration manual. Rather, it is
    intended to be a road map to introduce UNIX users to utilities, commands, protocols,
    and programs found on UNIX operating systems. It is written in a fashion to provide
    concepts that build on each other. Each chapter or main subject area will include
    a table of common command or utility options along with some syntax examples and
    sample output. Additionally, at the end of each chapter are a few opportunities
    for you to exercise what you have just learned. The solutions to the chapter exercises
    are provided in the back of this book. I do not recommend that you skip around
    too much the first time through reading this book. After your initial read, I
    hope you will find this book useful as a handy, easy-to-use reference.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Conventions Used in This Book


    The following is a list of conventions provided to help you understand the verriage
    used in the examples in this book as well as other mainstream UNIX documentation
    sources. I have used industry standard methods and conventions to assist you to
    seamlessly read this book and try lessons on a UNIX machine without having to
    translate anything. I believe you will find that the lessons contained in this
    book are directly portable to mainstream UNIX and Linux operating systems.


    +   - Dot. The dot is not to be confused with the period. The dot is used to identify
    an invisible file. If a filename begins with a dot, then the file will not show
    up when files are listed unless you specify to show you invisible files. The dot
    is also used to identify locations in a directory. One dots mean the current directory.
    Two dots mean the directory directly above where you are in the directory tree.

    - file - Is a reference to a file. This is where a file goes in the syntax of
    a command.

    - filename - Means to insert the name of your file here.

    - file.out - This is the output file from whatever syntax it is preceded by.

    - infile - This is the input file for a command.

    " - Whatever is between the double quotes is a literal.

    - # - Pound sign. This is known in the UNIX world as a hash mark. Everything to
    the right of this is a comment and not code. The hash mark is also commonly used
    as the command prompt for the root user, but this is not a system requirement.
    The examples in this book begin with a # symbol to indicate that I am running
    these commands at the command prompt. You do not need to type the # symbol when
    you are trying these examples out on your UNIX system. If you do, you will get
    an error.

    - ! - Exclamation mark or exclamation point. This is known in the UNIX world as
    a bang symbol. The bang symbol is used in place of the word “not” as not equal
    to in a comparison statement.

    - Environment Variables - Are in all capital letters.

    - / - Slash. All slashes are forward slashes / in a directory tree. (The opposite
    of Microsoft operating systems.)

    - Blank Lines - Blank lines and other white space in a file are ignored.'
  merge: -1
