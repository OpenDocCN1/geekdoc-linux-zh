  md: 'ROBERT B. FAY


    Every file or directory in UNIX has access permissions. There are three levels
    of permissions. The three levels of file permissions are read, write, and execute.
    There is actually another level of no access, but that is pretty self-explanatory,
    and having that level of access won''t get you anywhere. It is important to note
    that the permissions are not tied to each other. In other words, a user may have
    any combination of read, write, and execute. They may may have just execute, or
    read and execute, or read and write, or no permissions at all.


    Permissions are defined for three types of users:


    +   - Owner (The owner of the file).

    - Group (The group the owner belongs to.)

    - World (All other users).


    Thus, UNIX file permissions are nine bits of information (three types of permissions
    for three types of users). Each of the three user types may have one of two values
    for each bit of information. The two values are denied access or allowed access.


    # File Permissions Notation


    Text representation like "-rwxr--r--",


    Displayed in UNIX long directory listings. The first character shows the file
    type. The next nine characters are permissions, consisting of three groups: owner,
    group, and world. Each group consists of three symbols: rwx, if some permission
    is denied, a dash "-" is used instead.


    Example: -rwxr--r-- 0 "-" is the type of the file.


    Symbol in the position 0 ("-") is the type of the file. It is either "d" if the
    item is a directory or "l" if it is a link or "." if the item is a regular file.


    Symbols in positions 1 to 3 ("rwx") are permissions for the owner of the file.


    98'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# UNIX From Soup To Nuts


    Symbols in positions 4 to 6 ("r---") are permissions for the group.


    Symbols in positions 7 to 9 ("r---") are permissions for others.


    | Text Notation | Description |

    | --- | --- |

    | r | Read access is allowed |

    | w | Write access is allowed |

    | x | Execute access is allowed |

    | - | Replaces "r", "w", or "x" if according access type is denied |


    Examples of text notation:


    | Text Notation | Description |

    | --- | --- |

    | -rwxr-xr-x | File, owner has read, write, and execute permissions, group: only
    has read and execute permissions, others: only read and execute permissions. |

    | dr-x------ | Directory, owner has read and execute access; group and others
    have no access. |


    Numeric (octal) representation like "644",


    If a numeric representation is used, like in the chmod command, then it is in
    the octal format (with the base of 8), and digits involved are 0 to 7. Octal format
    is used for the simplicity of understanding: every octal digit combines read,
    write and execute permissions together.'
