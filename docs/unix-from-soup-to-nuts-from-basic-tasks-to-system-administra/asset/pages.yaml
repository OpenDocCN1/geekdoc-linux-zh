    # Brace Expansion


    Brace expansion is an easy way to generate a list of strings that share a common
    prefix or suffix. To generate the list of strings with a common prefix or suffix,
    just use the echo or some other output direction command and feed your prefix
    or suffix with a commadelimited list of characters enclosed in braces. The following
    example creates the strings bat, cat, hat, and rat by using the comma delimited
    list of (b,c,h,r) and the suffix of “at”.


    ```

    #echo {b,c,h,r}at

    ```


    The result is: bat cat hat rat


    The same rules for brace expansion apply when creating strings with both a prefix
    and a suffix. To generate the list of strings with a common prefix and suffix,
    just use the echo or some output direction command and feed your prefix and suffix
    together with a comma-delimited list in the middle of your prefix and suffix of
    characters enclosed in braces. The following example creates the strings man,
    min, and mon by using the comma-delimited list of (a,i,o) between the prefix of
    “m” and the suffix of “n”.


    ```

    #echo m{a,i,o}n

    ```


    The result is: man min mon


    It should be noted that although the examples provided for brace expansion use
    a single-letter prefix or suffix, single-letter prefix and suffix functions is
    not a limitation of brace expansion. The same process can be used to create strings
