  md: '# UNIX From Soup To Nuts


    to be cleaned more frequently. Remember to periodically clean your tape drive.
    It can save you from backup and restore headaches.


    Earlier in this chapter, I briefly mentioned the system scheduler. In UNIX the
    scheduler is called cron. This stands for chronological scheduler. All system
    may use cron to schedule jobs as long as the cron daemon is running and the system
    administrator has not specifically denied you to the scheduler by creating an
    entry for your account in the /etc/cron.deny file.


    A user accesses the scheduler with the crontab command. There are two flags to
    be used with crontab. The -e flag allows you to edit your schedule, while -l flag
    simply displays a listing of your schedule. Never execute the crontab command
    without one of these flags. If you do this accidentally, don''t panic. Use the
    Control – c key sequence to escape back to the command line.


    Do not use the Control – d sequence. If you do, you will find out the hard way
    that this re-initializes your schedule. In other words, it wipes out any entries
    you previously had stored in your schedule. The first time you use the crontab
    command, the system will create your own scheduler file in the /var/spool/cron/crontabs
    directory. The file names will match your user name.


    A crontab file consists of lines of six fields each. The fields of the crontab
    are separated by spaces or tabs. The first five fields contain numbers that specify
    the following: The first field represents minutes and can contain a numerical
    value of 0 – 59. The second field represents hours and can contain a numerical
    value of 0 – 23. The third field represents the days of the month and can contain
    a numerical value of 1 – 31. The fourth field represents the month of the year
    and can contain a numerical value of 1 – 12. The sixth field represents the day
    of the week and can contain the value of 0 – 6. Just for the sake of clarity,
    I have defined the day values for you. The numerical day values are 0 = Sunday,
    1 = Monday, 2 = Tuesday, 3 = Wednesday, 4 = Thursday, 5 = Friday, and 6 = Saturday.
    The sixth field is where you enter the name of the executable file, script, or
    command argument that you want to be executed at the day and time indicated by
    the first five fields of the crontab entry. For the sake of clarity, I have explained
    the fields of the crontab entries in the following table:


    167'
