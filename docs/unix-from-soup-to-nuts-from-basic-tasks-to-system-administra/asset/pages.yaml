  md: '# UNIX From Soup To Nuts


    The console is a special type of terminal that is recognized when the system is
    started. Some UNIX system operations must be performed at the console. Typically,
    the console is only accessible by the system administrator. Facilities that have
    large numbers of rack-mounted servers do not have room for a physical console
    to be attached to each server individually. For this reason, some vendors have
    incorporated into their hardware design a port that can be accessed either by
    way of a management network connection or a temporary laptop connection. I say
    temporary because the console does not need to be connected for UNIX to perform
    its functions. It is just required in the event that maintenance or some type
    of failure prohibits remote connection.


    SUN Microsystems has developed what is known as a LOM (Lights Out Management)
    port on their systems. The LOM port will remain functional even if the operating
    system is down as long as power is connected to the server. The LOM connection
    will allow the system administrator to perform maintenance when the system is
    not fully functional or when connectivity is not available. Other versions of
    the LOM interface are the ALOM or Advanced LOM and the ILOM or Integrated LOM.
    Other hardware vendors have developed similar technology for communicating with
    a server without an active operating system, but SUN is one of the big players
    in the UNIX arena.


    For facilities that have large numbers of rack-mounted servers that do not have
    room for a physical console to be attached to each server individually and do
    not have a Lights Out Management network configured, another solution is the “crash
    cart”. Similar to a hospital crash cart that is highly mobile and contains devices
    typically needed for a patient in cardiac arrest or some other medical emergency,
    a data center crash cart has the server needs to save it quickly. A data center
    crash cart typically has a display, keyboard, mouse, box of cables, and set of
    tools on it. The idea is that if a server goes down unexpectedly, the crash cart
    can be used to quickly gain console access to the server to determine why the
    server went down and resolve the problem. A crash cart can also be used to configure
    new servers that do not have an operating system installed or network connectivity
    configured yet.


