    # The UNIX Graphical User Interface (GUI), X, and Window Managers


    It is important to recognize that in UNIX operating systems, the GUI is separate
    from the operating system itself. This is unlike Microsoft Windows operating systems,
    which won''t run without the GUI (or at the very least is extremely crippled if
    you do so). The GUI on UNIX is a separate layer that sits on top of the core operating
    system. The GUI can be completely uninstalled from UNIX, and you would still have
    a completely functional operating system.


    I worked with UNIX for several years before my employer even had the software
    and hardware necessary to run the GUI and never had a situation that required
    a GUI. These days, whenever I am faced with using a system console that launches
    a GUI, the first thing I do is find the utilities and open the command window
    interface. Then I can use real UNIX commands to talk straight to the Kernel and
    get some real work done or have some real fun, whatever the case may be.


    Version 11 of the X Window System is the underlying graphics layer on most modern
    UNIX systems. "X Windows," or "X11," or just "X" as it is commonly called, provides
    the glue between the underlying operating system, graphical applications, and
    graphics hardware. There are many software applications that are written for the
    X window system.


    X by itself is not a GUI. Rather, X provides the facilities that a GUI requires
    - the ability to accept input from devices like a mouse and keyboard, and the
    ability to draw graphical objects to a display. So, despite its name, the X Window
    System cannot draw "windows," at least not by the modern definition of a window.
    This is the job of another piece of software called the window manager. There
    are many different window managers available for X. Some of these are proprietary
    and will only run on system that has X type of UNIX. Some of these are open and
    will run on any system that has X installed.


    For the most part, the window manager is what defines the look and feel of an
    X-based GUI. It provides features such as window frames and buttons,'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# ROBERT B. FAY


    window titles, desktop resizing, icons, toolbars, desktop backgrounds/menus, and
    many other user interface elements. Some window managers also ship with their
    own set of desktop applications like file browsers, mail clients, and other common
    utilities.


    Because the window manager is just a piece of software that sits on top of X,
    there may be several different GUIs to choose from on one given UNIX system. Linux
    systems, in particular, often have a number of different GUIs to choose from at
    the console login screen (or via some other mechanism once you''ve logged in).


    There are many window managers available for UNIX systems. Because the open-source
    nature of UNIX, most window managers either work on all UNIX systems out of the
    box or can be configured to do so with a little effort. The CDE, KDE, and Gnome
    window managers tend to be more widely used than others. Their popularity is largely
    because of their pleasant and intuitive feel and functionality. They are also
    widely available either on the Internet or come prebundled with popular flavors
    of UNIX.


    The Common Desktop Environment - CDE is an open standard that has had commercial
    success. Parts of CDE grew out of an older desktop environment called Motif. CDE
    ships, or has shipped, with Sun, HP, and IBM workstations. CDE is available from
    commercial sources for other operating systems as Linux.


    The K Desktop Environment otherwise known as KDE is an open source desktop environment
    for UNIX systems. KDE is included with some distributions of Linux as the default
    window manager. KDE is open source and can be used on any UNIX/X11 system. Due
    to its open source roots, KDE is primarily used on free UNIX operating systems
    as Linux and FreeBSD.


    The Gnome window manager is an open source desktop environment for UNIX systems
    that competing with KDE for the title of the most popular window manager in the
    open systems community. Gnome is included with some distributions of Linux as
    the default window manager. Like KDE, Gnome is open source and can be used on
    any UNIX/X11 system. Due to its open source roots, Gnome has up to now been primarily
    used on free UNIX operating systems. Sun Microsystems has recently announced that
    Gnome will ship with Solaris as the default window manager.


    132'
