- img_proc: true
  md: '# Zombies


    Zombies are processes that seemingly will not die on their own and you can not
    kill them. Technically when a process is in the zombie state, it isn''t really
    a process anymore, rather it is just an entry in the process table. It takes almost
    no system resources.


    Typically a zombie is a program process that has died but has not yet given its
    process table entry back to the system. Once this happens, the process ID number
    can be reassigned to a new process. Sometimes zombies will hang around until the
    system is rebooted. At system boot time, the process table will be wiped clean
    by the init process, and the zombie will go away, along with any other processes
    that were running the last time the system was running.


    Zombie processes are for the most part harmless but can be annoying. The presence
    of zombie processes is usually not detrimental to the operating system, they are
    just a pain for system administrators or anybody else who is trying to view information
    in the process table. Normal system and application activity does not spawn zombies.
    A zombie is usually created by the abnormal termination of an application or by
    a user killing its parent process.


    # Daemons


    A daemon, pronounced like daymon, not demon, is a process that starts at boot
    time and runs in the background waiting for requests. Because the daemons are
    initiated at boot time and are system related, the daemon processes are owned
    by the root user. A normal user should not be able to terminate a daemon process.


    If a daemon process is killed, the daemon process can be easily restarted by the
    system administrator. However, most of the time daemons will restart on their
    own. The term used to describe a daemon or any other process restarting itself
    is called re-awning. By convention the names of most daemons end with the letter
    "d". This naming convention makes daemon processes pretty easy to identify in
    a process table listing. Additionally, the names of the daemons are usually fairly
    intuitive of what they are for.'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'Examples of daemons are ntpd and syslogd. It is pretty easy to figure out what
    these two daemons are for. Right?


    The ntpd daemon runs in the background and checks in frequently with the network
    time server. By using the network time protocol, the system clock is constantly
    in sync with all other servers on the network. Accurate system time is very important
    for logging and applications like databases that depend on accurate time to maintain
    the state of the database. Don''t believe me? Try this little exercise on a test
    system.


    Find a database that is actively logging transactions and shut it down with the
    normal shutdown process. (You may need a database administrator to help you with
    this part.) Then manually set the system time to a time between the time the database
    last started and the time you shut the database down. Usually, the database will
    detect the time discrepancy and refuse to start. If it does start, it will be
    in an unhappy state because it will have logged transactions that took place after
    the current time.'
  merge: -1
