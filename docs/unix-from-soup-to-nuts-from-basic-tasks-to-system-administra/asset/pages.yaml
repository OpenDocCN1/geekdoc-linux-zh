    # The iostat (Input/Output Statistics) Command


    As the name suggests, the [iostat] command is used to report input / output statistics
    as well as cpu, devices, and partition information. The simplest way to use the
    iostat command is to type iostat followed by a space, a number, another space,
    and another number and hit the enter key. The first number is the delay key and
    the second number is the number of lines of information to display.


    So if you were to enter iostat 2 3 and hit the return key, the system would respond
    with three lines of statistics displayed two seconds apart as follows. It should
    be noted that the first line of the report is an average since the last system
    boot. Each line of the report after the first line is an average since the last
    report line interval.


    ```

    #iostat 2 3

    ```


    | tty dad0 dad1 ramdisk1 sd1 cpu |

    | tin tout kps tps serv kps tps serv kps tps us sy wt id |

    | 0 10 158 14 25 608 53 35 0 0 0 0 7 46 37 0 18 |

    | 0 119 24 1 4 68 1 21 0 0 0 0 0 65 35 0 0 |

    | 0 40 145 25 4 40 3 7 0 0 0 0 0 66 34 0 0 |


    The following is an example of the iostat command option to use to display cpu
    utilization followed by the system output.


    ```

    #iostat -c

    ```


    ```

    cpu us sy wt id

    35 38 0 28

    ```


    The headers in the default iostat command without any options are explained in
    the following table. The headers will change depending on what options you execute
    with the iostat command. For further explanation of'
