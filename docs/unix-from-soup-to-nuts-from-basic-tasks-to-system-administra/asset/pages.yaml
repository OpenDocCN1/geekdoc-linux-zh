    # Parts and Pieces


    The UNIX operating system is comprised of essentially three main parts:

    The Kernel, the standard utility programs, and the system configuration files.

    There are other goodies that come with it and there is plenty that can be

    added to it, to be sure, but the three aforementioned parts are what make up

    the original portable operating system.


    # The Kernel


    The Kernel is the core of the UNIX operating system. Basically, the

    Kernel is a large program (sometimes referred to as the master control

    program) that is loaded into memory when the machine is turned on. The

    Kernel controls the allocation of hardware resources from boot time until

    shutdown. The Kernel knows what hardware resources are available, and it

    has the necessary programs, a.k.a. drivers, to talk to all the devices connected

    to One of the most important high-level tasks the Kernel performs the

    scheduling of devices access. This is necessary to prevent two programs from

    trying to gain control of a device simultaneously. The Kernel has special

    rights granted it to use system resources that users do not have access to.

    This is known as overhead and defines the division between user space and

    system space.


    Originally the Kernel was located in /usr/sys and contained several sub-

    components located in various sub-directories. The configuration files were

    located in /usr/sys/conf, and the device drivers were located in

    /usr/sys/dev, and so on. Get the idea. The structure of UNIX has'
