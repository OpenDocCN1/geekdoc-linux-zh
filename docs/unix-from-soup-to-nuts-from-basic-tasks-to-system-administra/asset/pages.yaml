  md: 'The first method is background processing. Running a process in the background
    refers to the ability to execute a UNIX command or script and walk away from it
    or even log out of the system without ending the process. When you run a process
    in the background, it is submitted, and the operating system gives you back your
    command line prompt so you can continue with whatever you were doing.


    The background process will sit there and wait for system resources to become
    available. Normal processes will have a higher precedence than background processes.
    Therefore, if a background process is using system resources and a normal process
    is started, the background process will give up its resources until the normal
    process ends. Then the background process will resume its processing and so on
    until it completes. A background process is initiated by following a UNIX command
    with a space and an ampersand (&) symbol.


    The second method of controlling the timing of processes has to do with sequential
    processing. To begin a process immediately after the end of a preceding process,
    place a (;) semicolon character between the two commands on the command line.
    (command1; command2)


    The third method of controlling the timing of processes has to do with parallel
    processing. To run two processes simultaneously, place an ampersand (&) character
    after each command on the command line. This essentially puts all processes in
    the background at which point the Kernel will share resources between them. (command1
    & command2). The following table is a quick reference for the ps command and the
    most useful command options used with it.


    | Command | Option | Description |

    | --- | --- | --- |

    | ps | | List process table entries. |

    | | -e | Display information about all running processes. |

    | | -f | Display more detailed information about processes. |'
