  md: '# 9 COMPARING, SORTING, AND COMPRESSING


    This section is devoted to the various commands and the most useful options for
    comparing two files to each other, sorting files, and compressing files. The reason
    for comparing files should be pretty straightforward. There are other ways to
    tell if files are exactly the same. You can determine if two files are the same
    with the chksum value of a file. You can also look at the size, create date, line
    count, and word count of a file. Suffice to say that there are many ways to determine
    if two files are the same. What we are going to cover here is how to tell what
    the difference is between two files.


    The sort section is also pretty straightforward. The *sort command* is used for
    sorting files or the output of a command, but there is more to it than that. I
    will discuss different ways to sort files and output, including a built-in function
    for the sole purpose of sorting calendar files by month.


    There are so many ways to compress files. I wanted to discuss each method briefly
    and help you identify which method creates and can be used to uncompress files
    with certain file extensions. File compression is useful for many reasons. Compressing
    files makes them easier to back up, easier to transport, easier to transmit, and
    save disk space. Hopefully the compression section will provide enough of an introductory
    to file compression methods that you will be able to experiment with the different
    methods and select which method fits your needs or is at least the most comfortable
    for you to use on a regular basis. If you learn just one thing in this chapter,
    it should be that there are multiple ways to do things in UNIX'
  merge: -1
  pgno: 154
