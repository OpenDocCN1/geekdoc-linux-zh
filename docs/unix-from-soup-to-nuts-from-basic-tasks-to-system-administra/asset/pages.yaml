    their password. However, non-administrative users do not have the ability to change
    other users'' passwords. Password requirements can be configured by the root user.


    If your system account is being managed locally, and you need to change your password,
    just type passwd at the command prompt. The system will ask you to type your old
    password for user authentication. If you type the old'
