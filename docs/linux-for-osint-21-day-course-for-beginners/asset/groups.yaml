    \ (main) $ \n\nEnough for now. We have learned the most basic commands for working\
    \ with Linux files. And we tried the simplest options to use them. But all utilities\
    \ mentioned in this lesson (cat, ls, cd, rm) have many different options.\n\n\
    To find out all the options of any Linux command use the man (manual) command.\
    \ For example:\n\n```\nman rm\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_12_0.png)\n\
    \nPress **q** to exit.\n\nIf you did something wrong when typing some commands,\
    \ always remember that you can create a new workspace, if you are working on Gitpod.\n\
    \nIf you are working on your computer, VM or VPS, delete the folder with the files\
    \ for this course\nand copy it again from Github.\n\n## Day 2. Basic Bash syntax\n\
    \nWhat is the most important point of using the command line to perform various\
    \ tasks instead of the GUI?\n\nThe ability to record and repeatedly perform different\
    \ sequences of actions to automate your work.\n\nBash (https://www.gnu.org/software/bash/)\
    \ is a Unix shell and command language written by Brian Fox and first released\
    \ in 1989. This is what we will use to write commands to automate various tasks\
    \ in Linux, combining Bash scripts with tools written in other programming languages\
    \ (Python, Go etc).\n\nCommands for later execution can be stored in files with\
    \ the extension **.sh**. Let's take a look at how this works rightaway.\n\nGo\
    \ to current folder:\n\n```\ncd Day_2\n```\n\nAnd run file create_folders.sh:\n\
    \n```\nbash create_folders.sh\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_13_0.png)\n\
    \nIf you didn't miss yesterday's lesson, you can see that this script creates\
    \ three directories with different names.\n\nThe .sh extension is used to store\
    \ files with code written in the Shell Script language or Bash script language.\n\
    \nNow let's break down the most basic elements of Bash syntax.\n\n### Variables\
    \ and string concatenation\n\nRun in command line:\n\n```\nbash variables.sh\n\
    ```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_14_0.png)\n\nComments in the code\
    \ denote by the # symbol in this cases will not affect the scripts, but I recommend\
    \ you indicate on the first line of .sh:\n\n```bash\n#!/bin/bash\n```\n\nCreate\
    \ variable contain string \"John\":\n\n```bash\nName=\"John\"\n```\n\nCreate variable\
    \ contain string \"Smith\":\n\n```bash\nSurname=\"Smith\"\n```\n\nCreate variable\
    \ contain Name and space:\n\n```bash\nPerson=\"$Name $Surname\"\n```\n\n### Conditional\
    \ operator\n\nRun conditional.sh:\n\n```bash\nconditional.sh\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_15_0.png)\n\
    \nAsk the user how old he is:\n\n```bash\necho \"How old are you?\"\n```\n\nRead\
    \ the value of AGE entered by the user:\n\nIf AGE is greater than 27, we tell\
    \ the user that is old:\n\n```bash\nif [ $AGE -gt 27 ]; then\n  echo \"You are\
    \ old\"\n```\n\nIf AGE is less than 27, we tell the user that is young:\n\n```bash\n\
    elif [ $AGE -lt 27 ]; then\n  echo \"You are young\"\nfi\n```\n\n### Loops\n\n\
    There are three kinds of loops in bash: \"while loop\", \"until loop\" and \"\
    for loop\".\n\n### While loop\n\nRun in command line:\n\n```bash\nwhile.sh\n```\n\
    \nAs long as the variable x does not equal 5, perform the following:\n\n```bash\n\
    while [ $x -ne 5 ]; do\n  echo $x\n  x=$((x + 1))\ndone\n```\n\n### Until loop\n\
    \nRun:\n\n```bash\nuntil.sh\n```\n\nAs long as the variable x greater than 10,\
    \ perform the following:\n\n```bash\nuntil [ $x -gt 10 ]; do\n  echo $x\n  x=$((x\
    \ - 1))\ndone\n```\n\n### For loop\n\nRun:\n\n```bash\nfor.sh\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_18_0.png)\n"
