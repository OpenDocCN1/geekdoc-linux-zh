    | for name in [ in [ word ... ] ]; do list; Done | |

    | :--- | :--- |

    | 随后的单词列表将被展开，生成一个项目列表。变量名被设置为 |

    | 依次处理此列表中的每个元素，并每次执行 list。如果单词写为 |

