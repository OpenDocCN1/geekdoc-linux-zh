    \n# Day 17. File sharing sites, torrents, FTP\n\nToday we will return to the topic\
    \ we started about Day 5: downloading content (for later automatic analysis).\
    \ This time we will talk about slightly more complex things but in a more superficial\
    \ way: FTP servers, torrents, file sharing and social media. Today we're not going\
    \ to run examples of commands, we're just going to talk about different tools\
    \ that are worth knowing.\n\n# FTP\n\nOn the fifth day, we already talked about\
    \ the curl utility which supports uploading through different protocols, including\
    \ the FTP protocol. But still, the FTP utility (https://www.gnu.org/software/inetutils/manual/html/ftp-invocation.html)\
    \ is a bit more convenient for this task. If you need to transfer files, you will\
    \ probably be more comfortable using a GUI client such as FileZilla (https://wiki.filezilla-project.org/Main_Page)\
    \ rather than command line. But FileZilla (like many other FTP clients) allows\
    \ you to automate various actions using the command line (https://wiki.filezilla-project.org/Command-line_arguments).\n\
    \n# Torrents\n\nIt is illegal to use leaked data files, but many OSINT professionals\
    \ use them anyway to gather more information. Often the leaked data is stored\
    \ as huge files on torrents. For example, I had to deal with one social network\
    \ leak that weighed hundreds of gigabytes. Unpacking the archives and extracting\
    \ the necessary data using the jq utility took more than two days! Thanks to screen\
    \ (Day 9) I only had to spend an hour writing commands and checking sessions a\
    \ few times to see if everything's going well.\n\nSeedbox is a high-bandwidth\
    \ remote server used to upload and download digital files from a peer-to-peer\
    \ (P2P) network (tech slang). Here are some examples of popular services for monthly\
    \ seedbox rentals:\n\n- RapidSeedbox (https://www.rapidseedbox.com)\n- Cloudboxes\
    \ (https://cloudboxes.io)\n- DediSeedbox (https://dediseedbox.com/)\n\nSeedboxes\
    \ is a very handy thing, but you can run command torrent clients on your VPS if\
    \ you want:\n\n- Aria (https://aria2.github.io)\n- Transmission-cli (https://cli-ck.io/transmission-cli-user-guide/)\n\
    - WebTorrent-cli (https://github.com/webtortrent/webtortrent-cli)\n- Stig (https://github.com/rndusr/stig)\n\
    \n# File sharing services\n\nWhen using files are uploaded to various file sharing\
    \ sites in investigations, you should keep in mind that their downloading can\
    \ be automated. Here are some examples of command line utilities for different\
    \ services that will help you do:\n\n- Google Drive (https://github.com/glotlabs/qdrive)\n\
    - Dropbox (https://github.com/dropbox/dbxcli)\n- Mega.nz (https://github.com/meganz/MEGAcmd)\n\
    - OneDrive (https://github.com/skilion/onedrive)\n\nBut be careful when using\
    \ them and never use accounts where you have important information stored for\
    \ authorization. **After all, these are unofficial utilities and accounts can\
    \ be blocked for using them.**\n\n# Social media\n\nWhen you work with a lot of\
    \ content that is published on some popular social network, check to see if someone\
    \ else has made a utility to automate its uploading. For example:\n\n- YouTube-dl\
    \ (https://youtube-dl.org)\n- SlideShare (https://github.com/mohan3d/slideshare-go)\n\
    - Spotify (https://github.com/spotDL/spotify-downloader)\n- You Get (https://github.com/soimort/you-get)\n"
