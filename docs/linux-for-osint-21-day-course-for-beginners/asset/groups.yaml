  - '[PAGE 150]


    Maybe after reading this book, Gitpod or even just browser-based versions of Linux
    will be enough for you:


    https://copy.sh/v86/?profile=linux26

    https://www.masswerk.at/jsuix/index.html

    https://bellard.org/jilinux/vm.html?cpu=riscv64&url=fedora33-riscv.cfg&mem=


    You might be comfortable using Linux on an Android smartphone using terminal emulators
    such as Termux (https://termux.dev/en/).


    You will never know what''s best for you until you try to solve your personal
    everyday problems.


    # Does it make sense to use Linux as your primary operating system


    To be honest, I''ve only worked on a MacBook for 9 years now. And I do much of
    my work in macOS.


    I use Linux several times a week to automate various tasks. But there are so many
    people who use it all the time and there are several reasons why this is a good
    practice.'
  - '[PAGE 151]


    # Libre Cloud Services.


    Opendktop.org is a platform providing free cloud storage, online office writing,
    contacts calendar tools, personal chat and messaging, as well as project development
    and product publishing for people who value freedom and openness.

    Get a free account to enjoy true freedom with all the services below.


    ![](img/03e4d38bded7def6bb51288422c4f89d_151_0.png)


    Firstly, it is an opportunity to significantly reduce the influence of global
    corporations on your life. If this idea inspires you, you can also opt out of
    Microsoft and Google online services like calendar, maps, cloud file storages,
    as well as streaming services and social networks. You can find decentralised
    open source analogues for all this on OpenDesktop (https://www.opendesktop.org).


    (But keep in mind that you won''t get rid of the influence of corporations on
    your life until the end, as the leading technology companies spend a lot of money
    to support Linux foundation and Open Source community).'
