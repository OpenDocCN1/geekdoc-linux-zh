  - "[PAGE 38]\n\n# # Day 6. Search in files. Grep\n\nWhat can you do with the downloaded\
    \ files? Lots of different things. But the most important thing OSINT specialist\
    \ should be able to do is automatically search and extract different data.\n\n\
    Grep (https://www.gnu.org/software/grep/) is one of the oldest UNIX utilities,\
    \ released in November 1973 (50 years in 2023!). It allows searching for matches\
    \ to certain text patterns (regular expressions) in files.\n\nThe Grep utility\
    \ does not require installation. It is available in Linux by default.\n\n```\n\
    $ gitpod /workspaces/linux-OSINT-21-day (main) $ grep --help\nusage grep [OPTION]...\
    \ PATTERN [FILE]...\nSearch for PATTERN in each file:\nExample: grep -l 'hello\
    \ world' menu.h.c\nGrep can contain multiple patterns separated by newlines.\n\
    \nPattern selection and interpretation:\n-E,--extended-regexp    PATTERNS are\
    \ extended regular expressions\n-F,--fixed-strings      PATTERNS are strings\n\
    -G,--basic-regex       PATTERNS are basic regular expressions\n-P,--perl-regexp\
    \         PATTERNS are Perl regular expressions\n-i,--ignore-PATTERNS   PATTERNS\
    \ for matching\n-f,--file              take PATTERNS FROM FILE\n-n,--ignore-case\
    \         ignore case distinctions in patterns and data\n  --ignore-case     \
    \     do not ignore case distinctions (default)\n-w,--word-regexp        match\
    \ only words\n-l,--line-regexp        match only lines\n-z,--null-data       \
    \   a data line ends in 0 byte, not newline\n\nMiscellaneous:\n-s,--messages \
    \          suppress error messages\n-v,--non-match          select non-matching\
    \ lines\n-v,--version            display version information and exit\n--help\
    \                  display this text and exit\n\nOutput control:\n-c,--max-count=N\
    \       stop after NM selected lines\n-b,--byte-offset        print the byte offset\
    \ with output lines\n-n,--line-number        print line number with output lines\n\
    -U,--buffered           flush output on every line\n-H,--hostname          print\
    \ name with output lines\n-h,--filename          suppress the file name prefix\
    \ on output\n--label=LABEL           use LABEL as the standard input file name\
    \ prefix\n-O,--only-matching      show only parts of lines that match\n-q,--quiet\
    \ --silent     suppress all normal output\n--binary-type=TYPE     assume binary\
    \ files are TYPE:\n```\n\nRun the help command to appreciate that just how many\
    \ options are: this seemingly utility has.\n\nLet's try to find lines in the file\
    \ that includes \"gmail\". Use -F flag for search strings (it's option, you can\
    \ also miss this flag):"
