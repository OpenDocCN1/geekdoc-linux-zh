    # AWK


    Awk (https://www.gnu.org/software/gawk/manual/gawk.html) is a scripting language
    for text processing. Interesting fact. Awk is not a technical acronym, but simply
    the initials of the three developers of this language: Alfred V. Aho, Peter J.
    Weiner and Brian W. Kernighan.


    Awk, like Sed does not require installation as it is included in Linux by default.


