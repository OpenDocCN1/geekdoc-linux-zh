    \ days you can already successfully scrape web pages on Linux. But it is worth\
    \ exploring a few more tools to be more effective.\n\n# Katana\n\nFirst of all,\
    \ let's learn how to make a list of URLs of all pages of the site (or rather,\
    \ all pages linked from other pages starting with the main page). This is very\
    \ easy if you have the wonderful Katana (https://github.com/projectdiscovery/katana)\
    \ tool from ProjectDiscovery (https://github.com/projectdiscovery).\n\n```bash\n\
    go install github.com/projectdiscovery/katana/cmd/katana@latest\n```\n\n# katana\n\
    \nIf you want to collect github links from a whole list of domains, use the -list\
    \ flag. And let's save the result this time to a text file so we can use it when\
    \ we run the next command:\n\n```bash\nkatana -list domains.txt > results.txt\n\
    ```\n\n# Nuclei\n\nNuclei (https://github.com/projectdiscovery/nuclei) is another\
    \ great tool from ProjectDiscovery. It is primarily designed to scan sites for\
    \ vulnerabilities but it also does an excellent job of collecting data from web\
    \ pages.\n\n```bash\ngo install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest\n\
    ```\n\nClone Juicy templates (we'll talk more about the command on day 19):\n\n\
    ```bash\n$ gitpod /workspace/linux-for-OSINT-21-day/Day_15 (main)\n$ git clone\
