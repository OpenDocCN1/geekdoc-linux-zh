    You can use Linux as a virtual machine. Download images of different distributions
    in the LinuxVMImages website (https://www.linuxvmimages.com/).


    But think about other forms of usage such as VPS (virtual private server). The
    cost of renting starts at a few dollars a month (few examples from $3.99 to $15)
    or bootable USB drive (example of instruction for Ubuntu and Windows https://ubuntu.com/create-usb-stick-for-windows-overview).


    | Host | LXC | OS | CPU | RAM | Disk | COW | Import image | Load | Memory Dump
