    Using this query, we retrieved JSON file with detailed domain information found
    in Netlas IP search engine by query "lid.com". You can view it in a convenient
    format using some JSON viewer tools (https://jsonviewer.stack.hu/).


    On Day 14, we''ll talk a little more about data in JSON format and learn how to
    process it using the jq utility.


    ![](img/03e4d38bded7def6bb51288422c4f89d_35_0.png)


    In addition to the Netlas API, which can be used to collect domain or IP address
    data, there are hundreds of other different APIs that can be used for OSINT.


    They can help you collect information about emails, phone numbers, physical addresses,
    companies, cryptocurrency wallets, flights, and more. You can find a list of them
    in the **APIs for OSINT** repository on Github (https://github.com/cipher387/API-s-for-OSINT).


