    \n```\nsudo apt clean\nsudo apt autoclean\nsudo apt update\nsudo apt-get install\
    \ poppler-utils --fix-missing\n```\n\n# pdftotext result.txt\n\nYou can now return\
    \ to Day 6 and Day 7 to use the commands described there to work with text extracted\
