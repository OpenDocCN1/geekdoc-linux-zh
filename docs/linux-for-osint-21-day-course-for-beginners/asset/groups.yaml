    \ -sf archive.zip\nArchive contains:\ntest1.txt\ntest2.txt\nTotal 2 entries (0\
    \ bytes)\ngitpod/workspace/linux-for-OSINT-21-day/Day_3 (main) $ \n```\n\nNow\
    \ let's see what files are in the archive using -sf flag:\n\n# zip -sf archive.zip\n\
    \n![](img/03e4d38bded7def6bb51288422c4f89d_24_0.png)\n\nYou can unzip the archive\
    \ to a specific folder using unzip command:\n\n# unzip archive.zip -d archive\n\
    \nYou can use the rar and unrar archive to work with WinRAR archives.\n\nIn the\
    \ example above, we used apt package manager (https://ubuntu.com/server/docs/package-management),\
    \ which is installed by default in Ubuntu. But there are other package managers\
    \ that can be used both in Ubuntu and other distributions. Few examples:\n\nPyPI\
    \ (https://pypi.org) - Python Package Index.\n\n# pip3 install ddgr\n\nSnap Store\
    \ (https://snapcraft.io/store) - software store developed by Canonical."
