    # Day 9. Screen and Crone


    Screen can take a very long time to execute. Sometimes even for several days.
    For example, if you want to process hundreds of gigabytes of text data on a server
    with modest technical capacity.


    Screen (https://www.gnu.org/software/screen/) allows you to perform multiple tasks
    simultaneously in the background. Roughly speaking, it allows you to make one
    terminal into several terminals working independently of each other.


    Let''s start with the installation:


    # sudo apt-get install screen


    ![](img/03e4d38bded7def6bb51288422c4f89d_61_0.png)


    Create new session with name "demo-screen":


    ```

    screen -S demo-screen

    ```'
- md: '

    # PROBLEMS OUTPUT PORTS DEBUG CONSOLE TERMINAL


    ```

    $ |

    ```


    Run some commands in it and press Ctrl+A+D to exit.


    ```

    $ cat readme.md

    cat readme: No such file or directory

    Day_1 Day_12 Day_15 Day_18 Day_20 Day_7 Day_8 netlas_results.txt search_osint.txt

    Day_38 Day_13 Day_16 Day_19 Day_2 Day_6 osint_Duckduckgo_search.txt

    Day_31 ... netlas_results_extracted.txt README.md

    $ cat README.md

    cat README: No such file or directory

    $ cat README.md

    # Linux for OSINT. 21 day course for beginners

    In this repository you will find sample code files for each day of the course
    "Linux for OSINT. A 21-day course for beginners".

    $ |

    ```


    Now let''s get the list of active sessions to see if there is a new session called
    "demo-screen":


    ```

    screen -ls

    ```


    To return to a session named "demo-screen" simply type in the command line:


    ```

    # screen -r demo-screen

    ```


    And press Ctrl+A+D to exit again.


    If you want to delete a session named "demo-screen", type:


    ```

    gitpod /workspace/linux-for-OSINT-21-day/Day_9 (main) $

    * gitpod /workspace/linux-for-OSINT-21-day/Day_9 (main) $ screen XS demo-screen
    quit

    * gitpod /workspace/linux-for-OSINT-21-day/Day_9 (main) $ screen -ls

    No Sockets found in /run/screen/S-gitpod

    ```


    # screen -XS demo-screen quit


    After that, check the list of sessions to make sure the deletion was successful.


    ```

    # screen -ls

    ```


    Unfortunately, Gitpod is not very suitable for demonstrating the capabilities
    of Screen, because after closing the workspace tab and after the user is inactive
    for more than half an hour, all commands are stopped.


    If you will be using the Screen on your own VM, make sure it is running until
    all the commands you need are executed in all sessions.


    The ideal option for using the Screen is a VPS (Virtual Private Server) that runs
    24/7 and can just connect via SSH to it from time to time.


    # Crontab


    Another important advantage of using crontab is the ability to schedule a certain
    sequence of actions for a certain time.


    Crontab (https://ss64.com/bash/crontab.html) is a utility for editing the crontab
    file, which stores a schedule of commands to be executed by the cron daemon (on
    UNIX term).


    Here is an example from Wikipedia of what a crontab file might like:


    ```

    # /etc/crontab system-wide crontab

    # Unlike any other crontab you don''t have to run the ''crontab''

    # command to install the new version when you edit this file

    # and refer to /etc/crontab. These files also have username fields,

    # that none of the other crontabs do.

    PATH=/usr:/local/sbin:/usr/local/bin:/sbin:/bin

    # * * * * user

    17 * * * root test -x /usr/bin/anacron --report /etc/cron.hourly |

    25 6 * * root test -x /usr/bin/anacron || daily

    47 6 * * root test -x /usr/bin/anacron --report /etc/cron.weekly |

    32 6 1 * root test -x /usr/bin/anacron --report /etc/cron.monthly |

    #

    ```


    Gitpod prohibits the use of Crontab utility at all. we''re not going to try any
    more commands today.


    But lastly, I want to tell you about one very good service that will come in handy
    when you work with Crontab on a VM or VPS.


    # crontab guru


    The quick and simple editor for cron schedule expressions by Cronitor


    # “At 22:00 on every day-of-week from Monday through Friday.”


    ```

    next at 2023-05-17 22:00:00

    then at 2023-05-18 22:00:00

    then at 2023-05-19 22:00:00

    then at 2023-05-22 22:00:00

    then at 2023-05-23 22:00:00


    random

    ```


    ```

    0 22 * * 1-5

    ```


    ```

    minute hour day month day

    (month) (week)

    * any value

    value list

    separator

    range of values

    / step Values

    *yearly (non-standard)

    @annually (non-standard)

    @monthly (non-standard)

    @weekly (non-standard)

    @daily (non-standard)

    @hourly (non-standard)

    @reboot (non-standard)

    ```


    Crontab Guru (https://crontab.guru/) - is an online service that allows you to
    quickly compose crone schedule expressions.


    # Day 10. Text analyzing and editing utilities


    A significant part of this course is devoted to working with various text formats.
    After all, the most important advantage of Linux is the significant reduction
    of routine work. Here are some more universal commands that are useful to know.
    All of them are available in Linux by default.


    # Cat


    Cat (https://pubs.opengroup.org/onlinepubs/9699919799/utilities/cat.html) - utility
    that allows to view the contents of a text file. We have already used it in previous
    lessons and it may seem very simple, but it is not quite so. Second examples.


    It allows to view the contents of multiple files at once and save them all at
    once to a single file:


    ![](img/03e4d38bded7def6bb51288422c4f89d_66_0.png)


    ```

    cd Day_10

    cat file1.txt file2.txt >file3.txt

    ```


    You can use it to collect the content of all files with a certain extension (or
    containing a certain word in the name) into one:


    ![](img/03e4d38bded7def6bb51288422c4f89d_67_0.png)


    ```

    cat *.txt >alltext.txt

    ```


    # Cut


    Cut (https://pubs.opengroup.org/onlinepubs/9699919799/utilities/cut.html) is utility
    for cutting sections from each line of a file. Recall that we used the Sed utility
    to cut lines from the file, and the Aw utility to cut individual columns (Day
    7). Let''s try to extract the first character from each line:


    ```

    cut -c 1 cut_example.csv

    ```


    And here''s a command that cuts the first through tenth characters from each line:


    ```

    gitpod /workspace/linux-for-OSINT-21-day/Day_10 (main) $ cut -c 5-10 cut_example.csv

    ```


    Cut can also be used to cut individual bytes or fields with delimiter (another
    method for extracting columns from CSV files).


    # Uniq


    Uniq (https://pubs.opengroup.org/onlinepubs/969991799/utilities/uniq.html) - utility
    that allows you to remove all duplicate lines from a file. Let''s try:


    ```

    cat cut_example.csv second_column.txt > uniq_example.csv

    ```


    ```

    Day_10 > uniq_example.csv

    ```


    # Sort


    Sort (https://pubs.opengroup.org/onlinepubs/969991799/utilities/sort.html) - utility
    that sorts files in alphabetical and reverse alphabetical order, as well as descending
    and ascending order.


    ```

    # sort -r cut_example.csv

    ```


    Here we used the -r flag to sort the rows in reverse alphabetical order.


    Iconv (https://pubs.opencv.org/onlinepubs/9691799/utilities/iconv.html)) utility
    that convert text in one encoding to another. We won''t run this command (I don''t
    have a suitable test file right now), but it will be useful for you to know about
    its existence. If some text displays characters instead of letters, saving the
    file in a different encoding using this command.


    ```

    iconv -f UTF-8 -t ASCII//TRANSLIT utf8.txt acii.txt

    ```


    ![](img/03e4d38bded7def6bb51288422c4f89d_71_0.png)


    This is the last chapter in this book about automating text file manipulation
    in Linux. If you are interested in this topic, I recommend you to check out the
    repository **Text processing Recipes Linux** (https://github.com/adrianlarion/text-processing-recipes-linux).


