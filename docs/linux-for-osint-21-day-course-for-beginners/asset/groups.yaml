- md: "\n## Day 3. Install and run utilities\n\nLinux utility is a command that can\
    \ be run on the command line or on bash scripts. We have already used some of\
    \ these in past lessons: cat, bash, cd, man, cp, mkdir. These are utilities that\
    \ are installed by default in every Linux distribution.\n\nYou can see the full\
    \ list of utilities and applications installed in your own distribution using\
    \ a special command. Which one depends on the type of your distribution. For example:\n\
    \n- Ubuntu, Debian: dpkg -l\n- Fedora, RHEL: rpm -qa\n- OpenBSD, FreeBSD: pkg-info\n\
    - Gentoo: query list or emergix\n- Arch Linux: pacman -Q\n\nIf you are using Gitpod,\
    \ you need to use the commands for Ubuntu.\n\nRun in command line:\n\n```\ndpkg\
    \ -l\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_22_0.png)\n\nThere are also\
    \ thousands of utilities for a wide variety of purposes that you can install yourself.\n\
    \nAs an example, let's install two utilities for working with ZIP archives:\n\n\
    ```\nsudo apt install unzip\n```\n\nIn this example it is not necessary (we could\
    \ just use apt install), but we add the word sudo before the command.\n\nThis\
    \ way we run the command with superuser privileges (maximum permissions to write,\
    \ read and delete files). In Gitpod, you can use it just like that, but if you\
    \ are working on your own computer and not logged in as an administrator, you\
    \ may have to enter a password.\n\n![](img/03e4d38bded7def6bb51288422c4f89d_23_0.png)\n\
    \nLet's try to convert the file into a zip archive:\n\n```bash\ncd Day_3\nzip\
    \ archive test1.txt test2.txt\n```\n\nInstead of file names, we could specify\
    \ directory names or put all txt files from the active directory into the archive\
    \ using *.txt instead of listing filenames.\n\n```bash\ngitpod /workspace/linux-for-OSINT-21-day/Day_3\
    \ (main) $ zip -sf archive.zip\nArchive contains:\ntest1.txt\ntest2.txt\nTotal\
    \ 2 entries (0 bytes)\ngitpod/workspace/linux-for-OSINT-21-day/Day_3 (main) $\
    \ \n```\n\nNow let's see what files are in the archive using -sf flag:\n\n```bash\n\
    # zip -sf archive.zip\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_24_0.png)\n\
    \nYou can unzip the archive to a specific folder using unzip command:\n\n```bash\n\
    unzip archive.zip -d archive\n```\n\nYou can use the rar and unrar archive to\
    \ work with WinRAR archives.\n\nIn the example above, we used apt package manager\
    \ (https://ubuntu.com/server/docs/package-management), which is installed by default\
    \ in Ubuntu. But there are other package managers that can be used both in Ubuntu\
    \ and other distributions. Few examples:\n\nPyPI (https://pypi.org) - Python Package\
    \ Index.\n\n```bash\npip3 install ddgr\n```\n\nSnap Store (https://snapcraft.io/store)\
    \ - software store developed by Canonical.\n\n```bash\nsnap install ddgr\n```\n\
    \nCast (https://sourcemage.org) - package manager for Source Mage Linux distribution.\n\
    \n```bash\ncast ddgr\n```\n\n* (for each package manager, a sample command for\
    \ installing the ddgr utility is listed, but do not need to run them. We will\
    \ install it on Day 16 of this course)\n\nIn this course, we focus on working\
    \ with the command line. Well for Linux there are a huge number of GUI applications.\
    \ They are very easy to install through the app stores.\n\n![](img/03e4d38bded7def6bb51288422c4f89d_25_0.png)\n\
    \n## We've found 27 snaps\n\n| onlyoffice-desktops Ascension System SIA | Domotz\
    \ Pro Agent Domotz | digikam KDE | Symphlyum Onio Jashi |\n| banana-accounting-plus\
    \ Banan.ch SA | Google Docs Tech Field | dobsov-uz Jacob Zimmermann | super-o-plan\
    \ Alexandrjri |\n| Blueprint Compiler James Weheston | Interactive Data Editor\
    \ Koshik | Graphs Spendall | hollywood Dinkland |\n| Offices/webDesktop Angulo\
    \ | tm-desktop | Jateimalmerge Jan Martin | Enpa Christos |\n| flman-mero Maria\
    \ Gancarla | Dave's Trails Gancarla | Carrier (DOS) Maria Gancarla | Time Tracking\
    \ Gerold |\n\nSnap is a software packaging and deployment system developed by\
    \ Canonical. Snapcraft (snapcraft.io) contains thousands of snaps (apps) for Linux\
    \ distributions.\n\n## Search for 'excel'\n\n- **Wiz Note**: PKM (personal knowledge\
    \ management) desktop environment based on cloud usage\n- **Pinpoint**: presentations\n\
    - **Godless Deluxe**: remake of the platform game\n- **Lollypop**: Play and organize\
    \ your music collection\n- **Kvric**: free portable IRC\n- **ExifTool**: Simple\
    \ frontend for\n- **Ryujinx**: Nintendo Switch Emulator\n- **Kaffeine**: Multimedia\
    \ Player\n- **Jotpia**: Remote Desktop Protocol RDP Servers\n- **The Gnumeric**:\
    \ Precision Spreadsheet\n\nFlathub (flathub.org) - another app store that contains\
    \ more apps. Unlike Snap, which allows you to install command line utilities,\
    \ Flathub only supports GUI applications. If you use Gitpod, you won't be able\
    \ to try it now. Return to this chapter at Day 21 to continue using Linux with\
    \ a graphical interface.\n\n## Day 4. Batch processing\n\nWith Bash scripts you\
    \ can manipulate thousands of files with a few lines of code. For example, you\
    \ can perform the same action on all files with certain extension located in certain\
    \ folder. For this we will use the find utility (https://man7.org/linux/man-pages/find.html).\
    \ It is installed in Linux by default.\n\nPlease, type in command line:\n\n```bash\n\
    cd Day_4\nbash print_names.sh\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_27_0.png)\n\
    \nSource code of print_names.sh:\n\n```bash\nfor i in `find txt_files/ -name \"\
    *.txt\" -type f`; do\necho \"$i\"\ndone\n```\n\nYou can replace .txt with any\
    \ extension. You can also search for files whose names contain certain word. In\
    \ truth, the script above doesn't make sense on its own, since the file names\
    \ are displayed simply by running the command. This tries:\n\n```bash\nfind -name\
    \ \"*.txt\" -type f\n$ gitpod/workspace/Linux-For-OSINT-21-day (main) $ find -name\
    \ \"*.txt\" -type f\n/Day_1/commands.txt\n/Day_10/test.txt\n/Day_11/test.txt\n\
    /Day_12/test.txt\n/Day_13/test.txt\n/Day_14/example.txt\n/Day_15/test.txt\n/Day_16/test.txt\n\
    /Day_17/test.txt\n/Day_18/test.txt\n/Day_19/test.txt\n/Day_2/test.txt\n/Day_3/test.txt\n\
    /Day_4/test.txt\n/Day_5/test.txt\n/Day_6/test.txt\n/Day_7/test.txt\n/Day_8/test.txt\n\
    /Day_9/test.txt\n$ gitpod/workspace/linux-for-OSINT-21-day (main) $\n```\n\nBut\
    \ by going through the file names one by one, we can perform certain repetitive\
    \ action on each file (process file with any Linux utility). Just replace \"echo\"\
    \ command with something else.\n\nAs example, let's try to convert all txt files\
    \ to csv format.\n\n## Save .txt files as .csv\n\n## bash convert_files.sh\n\n\
    Source code of convert_files.sh:\n\n```bash\nfor i in `find txt_files/ -name \"\
    *txt\" -type f`; do\nsed 's/+/g' \"$i\"=\"${i}.csv\";\ndone\n```\n\nNote the sed\
    \ (https://www.gnu.org/sed/manual/sed.html) command. We use to replace spaces\
    \ with commas and return to it in Day 7.\n\n## Xargs\n\nXargs (https://man7.org/linux/man-pages/man1/xargs.1.html)\
    \ is a utility that allows you to run different Linux commands with input parameters.\
    \ This includes reading these parameters from lists stored in files.\n\nLet's\
    \ look at examples of how it works.\n\n![](img/03e4d38bded7def6bb51288422c4f89d_30_0.png)\n\
    \nLet's create all the archives from the txt_files folder:\n\n```bash\nfind txt_files\
    \ -name \"*.zip\" -type f | xargs rm -\n```\n\nNow let's create archives using\
    \ Xargs:\n\n![](img/03e4d38bded7def6bb51288422c4f89d_30_1.png)\n\n![](img/03e4d38bded7def6bb51288422c4f89d_30_2.png)\n\
    \nAs you can see, in the right part of the command, we read the file line by line\
    \ using the Cat command. And on the left side, we run Xargs with the -I flag to\
    \ use each line as a filename variable and use that variable as the filename in\
    \ the parameters when we run the zip command.\n"
  mdcn: "\n\n## 第 3 天. 安装和运行工具\n\nLinux 工具是可以在命令行或 bash 脚本中运行的命令。在过去的课程中，我们已经使用了其中一些工具：cat,\
    \ bash, cd, man, cp, mkdir。这些是每个 Linux 发行版中默认安装的工具。\n\n你可以使用特殊的命令来查看你自己的发行版中安装的工具和应用程序的完整列表。具体命令取决于你发行版的类型。例如：\n\
    \n- Ubuntu, Debian: dpkg -l\n- Fedora, RHEL: rpm -qa\n- OpenBSD, FreeBSD: pkg-info\n\
    - Gentoo: query list 或 emergix\n- Arch Linux: pacman -Q\n\n如果你正在使用 Gitpod，则需要使用\
    \ Ubuntu 的命令。\n\n在命令行运行：\n\n```\ndpkg -l\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_22_0.png)\n\
    \n还有成千上万个用于各种用途的工具，你可以自行安装。\n\n作为一个示例，让我们来安装两个处理 ZIP 归包的工具：\n\n```\nsudo apt install\
    \ unzip\n```\n\n在这个示例中，并没有必要（我们可以直接使用 `apt install`），但我们在命令前加上了 `sudo` 单词。\n\n\
    这样我们以超级用户权限（写入、读取和删除文件的最大权限）运行命令。在 Gitpod 中，你可以直接使用它，但如果你在自己的电脑上工作且没有以管理员身份登录，可能需要输入密码。\n\
    \n![](img/03e4d38bded7def6bb51288422c4f89d_23_0.png)\n\n让我们尝试将文件转换为 zip 归档：\n\n\
    ```bash\ncd Day_3\nzip archive test1.txt test2.txt\n```\n\n我们可以指定目录名称而不是文件名，或者使用\
    \ `*.txt` 代替列文件名，将活动目录中的所有 txt 文件放入归档。\n\n```bash\ngitpod /workspace/linux-for-OSINT-21-day/Day_3\
    \ (main) $ zip -sf archive.zip\nArchive contains:\ntest1.txt\ntest2.txt\nTotal\
    \ 2 entries (0 bytes)\ngitpod/workspace/linux-for-OSINT-21-day/Day_3 (main) $\
    \ \n```\n\n现在让我们使用 `-sf` 标志查看归档中有哪些文件：\n\n```bash\n# zip -sf archive.zip\n```\n\
    \n![](img/03e4d38bded7def6bb51288422c4f89d_24_0.png)\n\n你可以使用 `unzip` 命令将归档解放到特定文件夹：\n\
    \n```bash\nunzip archive.zip -d archive\n```\n\n你可以使用 `rar` 和 `unrar` 归档来处理 WinRAR\
    \ 归档。\n\n在上面的示例中，我们使用了 [apt 包管理器](https://ubuntu.com/server/docs/package-management)，它是\
    \ Ubuntu 默认安装的。但还有其他可以在 Ubuntu 和其他发行版使用的包管理器。例如：\n\nPyPI (https://pypi.org) -\
    \ Python 包索引。\n\n```bash\npip3 install ddgr\n```\n\nSnap Store (https://snapcraft.io/store)\
    \ - 由 Canonical 开发的软件商店。\n\n```bash\nsnap install ddgr\n```\n\nCast (https://sourcemage.org)\
    \ - Source Mage Linux 发行版的包管理器。\n\n```bash\ncast ddgr\n```\n\n* （对于每个包管理器，都列出了安装\
    \ `ddgr` 工具的示例命令，但不需要运行它们。我们将在课程的第 16 天安装它）\n\n在本门课程中，我们专注于命令行操作。不过，对于 Linux 来说，有大量的\
    \ GUI 应用。它们通过应用商店安装非常方便。\n\n![](img/03e4d38bded7def6bb51288422c4f89d_25_0.png)\n\
    \n## 我们找到了 27 个 snaps\n\n| onlyoffice-desktops Ascension System SIA | Domotz Pro\
    \ Agent Domotz | digikam | Symphly Onio Jashi | banana-accounting-plus Banan.ch\
    \ | Google Docs Field | dobsov-uz Zimmermann | super-o-plan Alexandrj | Blueprint\
    \ James Weheston | Interactive Data Editor Koshik | Graphs Spendall Dinkland |\
    \ tm-desktop | Jateimal Martin | Enpa Christos | flman-mero Maria Ganc | Dave's\
    \ Trails Ganc | Carrier (DOS) Maria Ganc | Time Tracking Gerold | Snap 是由 Canonical\
    \ 开发的软件打包和部署系统。[Snapcraft](https://snapcraft.io) 包含了数千个用于 Linux 发行版的 snaps（应用）。\
    \ |\n\n## 搜索 'excel'\n\n- **Wiz Note**: 个人知识管理，基于云的桌面环境\n- **Pinpoint**: 演示文\n\
    - **Godless Deluxe**: 重制游戏\n- **Lollypop**: 播放和组织你的音乐收藏\n- **Kvric**: 免费的\n- **ExifTool**:\
    \ 简单前端\n- **Ryujinx**: Nintendo Switch 模拟器\n- **Kaffeine**: 多媒体播放器\n- **Jotpia**:\
    \ 远程桌面协议 RDP\n- **Gnumeric**: 精确电子表格\n\n[Flathub](flathub.org) - 另一个包含更多应用的商店。与允许安装命令行工具的\
    \ Snap 不同，Flathub 只支持 GUI 应用。如果你使用 Gitpod，现在无法尝试。回到第 21 天继续 Linux。\n\n## 第 4 天\
    \ 批量处理\n\n通过 Bash 脚本，你可以用几行代码处理成千上万的文件。例如，你可以对特定文件夹中的所有文件执行相同的操作。为此我们将使用 [find\
    \ 工具](https://man7.org/linux/man-pages/find.html)。它是 Linux 默认安装的。\n\n请在命令行输入：\n\
    \n```bash\ncd Day_4\nbash print_names.sh\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_27_0.png)\n\
    \n`print_names.sh` 的代码：\n\n```bash\nfor i in `find txt_files/ -name \"*.txt\"\
    \ -type f`; do\necho \"$i\"\ndone\n```\n\n你可以将 .txt 替换为任何扩展。你还可以搜索包含特定单词的文件。实际上，上面的脚本并没有意义，因为文件名只是通过命令显示的。尝试：\n\
    \n```bash\nfind -name \"*.txt\" -type f\n$ gitpod/workspace/Linux-For-OSINT-21-day\
    \ (main) $ find -name \"*.txt\" -type f\n/Day_1/commands.txt\n/Day_10/test.txt\n\
    /Day_11/test.txt\n/Day_12/test.txt\n/Day_13/test.txt\n/Day_14/example.txt\n/Day_15/test.txt\n\
    /Day_16/test.txt\n/Day_17/test.txt\n/Day_18/test.txt\n/Day_19/test.txt\n/Day_2/test.txt\n\
    /Day_3/test.txt\n/Day_4/test.txt\n/Day_5/test.txt\n/Day_6/test.txt\n/Day_7/test.txt\n\
    /Day_8/test.txt\n/Day_9/test.txt\n$ gitpod/workspace/linux-for-OSINT-21-day (main)\
    \ $\n```\n\n但通过逐个遍历文件名，我们可以对每个文件执行重复操作（使用任何 Linux 工具处理文件）。只需将 \"echo\" 命令替换为其他。例如，让我们尝试将所有\
    \ txt 文件转换为 csv 格式。\n\n## 将 .txt 文件保存为 .csv\n\n## bash convert_files.sh\n\n`convert_files.sh`\
    \ 的代码：\n\n```bash\nfor i in `find txt_files/ -name \"*txt\" -type f`; do\nsed\
    \ 's/+/g' \"$i\"=\"${i}.csv\";\ndone\n```\n\n注意 [sed 命令](https://www.gnu.org/sed/manual/sed.html)。我们用它将空格替换为逗号，并在第\
    \ 7 天回来。\n\n## Xargs\n\n[Xargs](https://man7.org/linux/man-pages/man1/xargs.1.html)\
    \ 是一个允许使用输入参数运行不同 Linux 命令的工具。这包括从存储在文件中的读取这些参数。\n\n看看它是如何工作的示例。\n\n![](img/03e4d38bded7def6bb51288422c4f89d_30_0.png)\n\
    \n让我们创建 txt_files 文件夹中的所有归档：\n\n```bash\nfind txt_files -name \"*.zip\" -type\
    \ f | xargs rm -\n```\n\n现在让我们使用 Xargs 创建存档：\n\n![](img/03e4d38bded7def6bb51288422c4f89d_30_1.png)\n\
    \n![](img/03e4d38bded7def6bb51288422c4f89d_30_2.png)\n\n如你所示，在命令的右部分，我们使用 cat\
    \ 命令逐行读取文件。在左侧，我们带有 `-I` 标志运行 xargs，将每行都作为文件名变量，并在运行 zip 命令时将该变量作为参数中的文件名。\n\n"
