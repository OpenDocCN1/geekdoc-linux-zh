  - '[PAGE 121]


    To collect the maximum amount of data, I recommend that you collect results not
    only from DuckDuckGo, but also from other search engines using the tools like:


    PyDock (https://github.com/blacknon/pydork) - search in Google, Bing, DuckDuckGo,
    Baidu and Yahoo Japan.

    Fast Google Dorks Scan (https://github.com/IvanGlinkin/Fast-Google-Dorks-Scan)

    0xDork (https://github.com/ryonheart/oxdork) - search in Google.


    and many others.


    Tools for automating the collection of search results for different search engines
    are plentiful. You can find a list of them in the Dorks collection list repository
    (https://github.com/cipher387/Dorks-collections-list).


    In addition, these tools are quite simple and you can easily make your own using
    APIs, a list of which can be found at “Search engines API” section of API for
    OSINT repository (https://github.com/cipher387/API-s-for-OSINT).


    # IP search engines


    It is worth talking separately about automating the collection of IP search engines
    (Shodan, Censys, Fofa, Netlas) search results. This is a bit more complex process,
    as search results contain much more information than Google or DuckDuckGo search
    results.


    IP search engines differ from “normal” search engines in that they do not index
    web pages to which they can find links, but all IP addresses connected to the
    Internet. That is, not only websites, but all other servers and devices.


    As usual, I''ll use Netlas for an example.'
