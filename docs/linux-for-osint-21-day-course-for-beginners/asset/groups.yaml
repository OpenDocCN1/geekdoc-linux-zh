    # # Instructions for Adding Your Logo & Address to AAO-HNSF Patient Handouts


    CO-BRANDING AAO-HNSF PATIENT HANDOUTS IS AS EASY AS 1-2-3!


    +   ### 1 Download & Save Patient Handout

    * Download the handout

    nYou will need Adobe Acrobat Reader.

    You can install it for free here: get.adobe.com/reader

    * Save it to your computer

    Remember where you saved it; you will need to access it in the following steps.


    +   ### 2 Upload Your Logo & Address

    Your image must be saved as a .pdf file!

    * For additional information on how to save your logo/address as a .pdf file,
    please see the instructions below.

    * You will not be able to upload your personal information to the patient handout
    if the file is not saved in the .pdf format.

    * Open the saved handout document

    * Click in the white space at the bottom of the page

    * Within the Select Icon window,

    * Browse to the pdf file you would like to Insert and then click, OK

    * The logo/and address file will resize appropriately for the text.

    * Type your web address in the blue rectangle below the white image-field.


    +   ### 3 You''re Ready to Print!

    * Save your file.

    Make sure to save your file before you close the document to ensure your logo/or
    address will be there the next time you open the document.

    * You are now ready to print!


    ![](img/03e4d38bded7def6bb51288422c4f89d_85_0.png)


    When viewing a file, the text should be available for selection, copying and pasting.


