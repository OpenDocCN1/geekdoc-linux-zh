    # Linux 用于 OSINT：面向初者的 21 天课程


    @cyb_detective 2023年12月28日


    在制作这门课程时，我给一个朋友打了电话并问道：


    - 还记得六个月前你说你开始读一本关于 Kali Linux 取证分析的书吗？

    - 记得。

    - 你读了多少了？

    - 我停在第 5 章了。

    - 那本书叫什么名字？

    - 《安装 Kali Linux》


    对话结束后，我打开了这本书的文件，并删除了所有需要使用 Linux 虚拟机的章节。为了让读者没有理由停止，前 20 天我们将仅在浏览器中操作。直到第 21
    天，我们才会考虑是否是时候安装 Linux 了。


