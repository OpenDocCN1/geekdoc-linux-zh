- md: "\nLet's run:\n\n```\ncd Day 12\nocrymypdf pdf for ocr.pdf result.pdf\n```\n\
    \nIf it happens, I picked a not-so-great PDF that already has a text layer. So\
    \ the --force-ocr flag is used to create another layer.\n\n```\nocrymypdf --force-ocr\
    \ pdf for ocr.pdf result.pdf\n```\n\nThe command may take time to execute, depending\
    \ on the number of pages in the document.\n\n![](img/03e4d38bded7def6bb51288422c4f89d_84_0.png)\n\
    \nIf you use Gitpod, you need to download the PDF document to your computer to\
    \ view it. Right-click-on and select Download.\n\n84\n\n# Instructions for Adding\
    \ Your Logo & Address to AAO-HNSF Patient Handouts\n\nCO-BRANDING AAO-HNSF PATIENT\
    \ HANDOUTS IS AS EASY AS 1-2-3!\n\n### 1 Download & Save Patient Handout\n- Download\
    \ the handout\nYou will need Adobe Acrobat Reader.\nYou can install it for free\
    \ here: get.adobe.com/reader\n- Save it to your computer\nRemember where you saved\
    \ it; you will need to access it in the following steps.\n\n### 2 Upload Your\
    \ Logo & Address\nYour image must be saved as a .pdf file!\n- For additional information\
    \ on how to save your logo/address as a .pdf file, please see the instructions\
    \ below.\n- You will not be able to upload your personal information to the patient\
    \ handout if the file is not saved in the .pdf format.\n- Open the saved handout\
    \ document\n- Click in the white space at the bottom of the page\n- Within the\
    \ Select Icon window,\n- Browse to the pdf file you would like to Insert and then\
    \ click, OK\n- The logo/and address file will resize appropriately for the text.\n\
    - Type your web address in the blue rectangle below the white image-field.\n\n\
    ### 3 You're Ready to Print!\n- Save your file.\nMake sure to save your file before\
    \ you close the document to ensure your logo/or address will be there the next\
    \ time you open the document.\n- You are now ready to print!\n\n![](img/03e4d38bded7def6bb51288422c4f89d_85_0.png)\n\
    \nWhen viewing a file, the text should be available for selection, copying and\
    \ pasting.\n\nNow let's try to extract the text from the PDF file and save it\
    \ to a separate file. We will use pdftotext command, part of poppler-utils (https://popper.js.org/docs/v2/utils/).\n\
    \n# Extract text from PDF\n\n```\nGet27 http://archive.ubuntu.com/jammy-backports/universe/amd64\
