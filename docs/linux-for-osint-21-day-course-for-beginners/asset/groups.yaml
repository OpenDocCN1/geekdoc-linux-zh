    # Linux for OSINT. 21-day course for beginners


    @cyb_detective 28 December 2023


    While working on this course, I called a friend and asked:


    - Remember six months ago when you said you started reading a book about Kali
    Linux for forensics?

    - Yes.

    - How much have you read?

    - I stopped at chapter 5.

    - What''s it called?

    - Installing Kali Linux


    After our conversation ended, I opened the file of this book and cut out all the
    chapters that require the use of Linux Virtual Machines. To give the reader no
    reason to stop, for the first 20 days, we will work in a browser only. It''s not
    until day 21 that we think about whether it''s time to install Linux.


    # Table of contents


    # Who Is This Course For?


    # Who should avoid this course?


    # Day 0. Getting ready to work


    # Day 1. Basic skills of working with files and directories in command line


    # Day 2. Basic bash script syntax


    # Day 3. Install and run utilities


    # Day 4. Batch file processing


    # Day 5. Downloading files and working with APIs. Curl.


    # Day 6. Search in files. Grep


    # Day 7. Sed and Awk


    # Day 8. Vim text editor


    # Day 9. Screen and Cron


    # Day 10. Text analyzing and editing utilities


    # Day 11. Video, audio and images


    # Day 12. Analyze PDF


    # Day 13. MS Office files


    # Day 14. JSON, XML, CSV


    # Day 15. Scraping


    # Day 16. Web search automation tools


    # Day 17. File sharing sites, torrents, FTP


    # Day 18. Domain investigation


    # Day 19. Git and Github


    # Day 20. Tools to make Linux easier to use


    # Day 21. Which Linux distribution is better to use?


    # What to do next?


    Application. Is it possible to do the same thing on Windows?


    ## Who Is This Course For?


    The course is primarily intended for those **who are professionally involved in
    or simply interested in OSINT**. And you will find in it a lot about automation
    of collection and analysis of various data.


    On my Twitter (https://twitter.com/cyb_detective) account, I regularly write about
    useful tools for OSINT, including various Linux utilities. And many times readers
    have asked, "Cool! Is it possible to run this on Windows".


    Yes, there are different methods of running Linux utilities on Windows. But they
    are more complicated than running Linux on a VM (virtual machine), VPS (virtual
    private server) or in an online development environment.


    This short tutorial is created to show you clearly:


    - Linux and the command line are very easy to use. Really easy. Extremely easy.

    - hundreds of tasks (OSINT related and not only) can be simplified and automated
    with Linux.

    - using Linux command line is a real, unparalleled pleasure.


    This course is designed **for the total beginners**. I won''t even ask you to
    install a VM with Linux until the last day, all examples can be tried in a browser.
    You also won''t need any special knowledge. If you know how to use e-mail, you
    will be able to handle this course. Just relax and follow the instructions carefully.


    When reading, keep in mind that this is a short course and so many things are
    left out. And really important things have been left out. It is designed primarily
    to show you the capabilities of Linux and to show you "which way to look" when
    faced with different tasks.


    ## Who should avoid this course?


    Linux is good because you can solve the same problem in many different ways. I
    am not sure that the ways described in this course are the best and fastest ways
    to solve problems. They are written to visually show you the magic of the command
    line and stimulate your inner inventor.


    I would advise the following categories of readers to treat this book as critically
    and certainly not read:


    - students who are preparing for exams

    - IT specialists who are preparing for Linux-related job

    - people who want to become Linux experts

    - pentes and bug hunters


    This book is primarily about OSINT.


    # Day 0. Getting ready to work


    Eric Raymond, in his article "How to become a hacker" (December 1997, https://cs.r.edu/~ray/BecomeHacker.pdf),
    recommended going to a local Linux meeting and asking for beer. In the last 26
    years progress has gone a long way I''ll just ask you to open a new tab in your
    browser.


    Gitpod is a service that provides online development environments based on Linux
    (https://ubuntu.com). You can use it for 50 hours a month for free. This is definitely
    enough for you to take this course many times.


    You should use Github (https://github.com/) account (registration is fast and
    also free). Open this link and create a workspace with standard settings: https://gitpod.io/#linux-for-21-day


    Welcome to Gitpod! Now you''re ready to start the first lesson! If you are already
    using some Linux distribution, you can simply clone the https://github.com/linux-for-21-day
    repository to your computer or server. If you don''t know how to clone recommend
    using Gitpod for now. On **Day 19** you will learn how to clone, and on **Day
    21** you will think about which Linux distribution is best for you.


    # Day 1. Basic skills of working with files and directories in command line


    If you did not miss **Day 0**, you should now have the command line open and the
    directory linux-for-21-day active. Let''s see what folders and files are inside.
    Type `ls` at the command line and press Enter:


    | EXPLORER | | PROBLEMS | OUTPUT | PORTS | DEBUG CONSOLE | TERMINAL |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | OPEN EDITORS | | LINUX-FOR-OSINT-21-day | | | | |

    | | | linux-for-OSINT-21-day | Day_1 Day_2 Day_3 Day_4 Day_5 Day_6 Day_7 Day_8
    Day_9 Day_10 Day_11 Day_12 Day_13 Day_14 Day_15 Day_16 Day_17 Day_18 Day_19 Day_20
    Day_21 README.md | | | gitpod /workspace/linux-for-OSINT-21-day (main) $ |


    Now let''s go to the **Day_1** folder:


    | PROBLEMS | OUTPUT | PORTS | DEBUG CONSOLE | TERMINAL | Gitpod Task 1 bash |
    | ... |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | gitpod /workspace/linux-for-OSINT-21-day (main) $ cd Day_1 | | | | | | | |

    | gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $ ls | | | | | | | |

    | commands. gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $ | | | | |
    | | |


    At the moment there is only a text file with all the commands from this book.
    Let''s add something else to the **Day_1** folder.


    # mkdir new folder


    # PROBLEMS OUTPUT PORTS DEBUG CONSOLE TERMINAL


    ```

    gitpod /workspace/linux-for-OSINT-21-day (main) $ cd Day_1

    gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $ ls

    commands.txt

    gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $ mkdir new_folder

    gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $ ls

    commands.txt new_folder

    gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $

    ```


    Let''s create a new empty file in this folder.


    # cat>new_file.txt


    Enter some text and press "Ctrl+D".


    Let''s check if the file was created successfully:


    # PROBLEMS OUTPUT PORTS DEBUG CONSOLE TERMINAL


    ```

    gitpod /workspace/linux-for-OSINT-21-day (main) $ cd Day_1

    gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $ cat>new_file.txt

    Hello!

    gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $ ls

    commands.txt new_file.txt new_folder

    gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $

    ```


    Let''s go to the parent directory use this command:


    # cd ..


    ```

    gitpod /workspace/linux-for-OSINT-21-day/Day_1 (main) $ cd ..

    gitpod /workspace/linux-for-OSINT-21-day (main) $ cd ..

    gitpod /workspace $

    ```


    Go to the directory located several levels below by specifying the path to it:

