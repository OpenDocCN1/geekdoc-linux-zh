    # 第15天：爬取 (Scraping)\n\n爬取是从网页中自动提取数据的过程。如果你擅长使用几天提到的 `curl`、`grep` 和 `awk`，你已经在\
    \ Linux 上成功爬取网页。但值得探索更多工具以提高效率。\n\n# Katana\n\n首先，让我们学习制作网站所有页面的 URL 列表（或者说是从主页面链接到所有页面）。如果你有来自\
    \ ProjectDiscovery (https://github.com/projectdiscovery) 的优秀工具 Katana，这会非常简单。\n\
    \n```bash\ngo install github.com/projectdiscovery/katana/cmd/katana@latest\n```\n\
    \n# katana\n\n如果你想从整个域名列表收集 github 链接，请使用 `-list` 标志。这次让我们将结果保存到文件中，以便运行下一个命令时使用：\n\
    \n```bash\nkatana -list domains.txt > results.txt\n```\n\n# Nuclei\n\nNuclei (https://github.com/projectdiscovery/nuclei)\
    \ 是 ProjectDiscovery 的另一个优秀工具。它主要用于扫描网站漏洞，但在从网页收集数据方面也做得出色。\n\n```bash\ngo install\
    \ -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest\n```\n\n克隆 Juicy\
    \ templates（我们将在第19天详细讨论该命令）：\n\n```bash\n$ gitpod /workspace/linux-for-OSINT-21-day/Day_15\
    \ (main)\n$ git clone https://github.com/cipher87/juicyinfo-nuclei-templates\n\
