    $ gitpod/workspace/linux-for-OSINT-21-day (main) $

    ```


    But by going through the file names one by one, we can perform a certain repetitive
    action on each file (process file with any Linux utility). Just replace "echo"
    command with something else.


    As example, let''s try to convert all txt files to csv format.


    # Save .txt files as .csv'
  - '[PAGE 29]


    # bash convert_files.sh


    Source code of convert_files.sh:


    ```

    for i in `find txt_files/ -name "*txt" -type f`; do

    sed ''s/\+/g'' "$i="$(i).csv";

    done

    ```


    Note the sed (https://www.gnu.org/sed/manual/sed.html) command. We use to replace
    spaces with commas and return to it in Day 7.'
  - '[PAGE 30]


    # Xargs


    Xargs (https://man7.org/linux/man-pages/man1/xargs.1.html) is a utility that allows
    you to run different Linux commands with certain input parameters. This includes
    reading these parameters from lists stored in files.


    Let''s look at examples of how it works.


    ![](img/03e4d38bded7def6bb51288422c4f89d_30_0.png)


    Let''s create all the archives from the txt_files folder:


    ```

    find txt_files -name "*.zip" -type f | xargs rm -

    ```


    Now let''s create archives using Xargs:


    ![](img/03e4d38bded7def6bb51288422c4f89d_30_1.png)


    ![](img/03e4d38bded7def6bb51288422c4f89d_30_2.png)'
  - '[PAGE 31]


    As you can see, in the right part of the command, we read the file line by line
    using the Cat command. And on the left side, we run Xargs with the -I flag to
    use each line as a filename variable and use that variable as the filename in
    the parameters when we run the zip command.


    The material on this day can be combined with almost all of the chapters in our
    course. But I recommend that you pay special attention to some of them:


    +   - Day 5 - file downloading.

    - Day 7 and Day 10 - text file editing.

    - Day 11 - working with video, audio and images.

    - Day 12 - working with PDF.

    - Day 13 - working with MS Office files.

    - Day 14 - working with JSON, CSV and XML files.


    After reading the lesson in each of these days, I recommend running at least one
    command in combination with Xargs.


    # Day 5. Downloading files and working with APIs. Curl.'
- md: "\nToday we're going to learn one of the most important skills for automating\
    \ data collection in Linux - downloading files using the Curl utility. This comes\
    \ in handy when processing requests, scraping websites, downloading data from\
    \ archives or other sources.\n\n![](img/03e4d38bded7def6bb51288422c4f89d_32_0.png)\n\
    \nThis is not the full help, this menu is stripped into categories. Use \"--help\
    \ category\" to get an overview of all categories. For all options use the manual\
    \ or \"--help all\".\n\nCurl (https://curl.se/) is a tool to transfer data from\
    \ or to a server, using one of the lot of supported protocols (DICT, FILE, FTP,\
    \ FPS, GOPHER, HTTP, HTTPS, IMAP, IMAPS, LDAP, LDAPS, POP3S, RTSP, SCP, SFTP,\
    \ SMB, SMBS, SMTP, SMTPS, TELNET). It does not require installation. It is available\
    \ in Linux by default.\n\nLet's try to download file. Change original name to\
    \ file.pdf with -o flag:\n\n![](img/03e4d38bded7def6bb51288422c4f89d_32_1.png)\n\
    \nEnter in command line:\n\n## Cd Day 5\ncurl https://eduscol.education.fr/document/3366/download\
    \ -o file.pdf\n\nNow let's try downloading files from the list of links using\
    \ the Xargs command (we talked about it yesterday).\n\n![](img/03e4d38bded7def6bb51288422c4f89d_33_0.png)\n\
    \n## xargs -n 1 curl -O < urls.txt\n\nUsing the -H flag, you can send requests\
    \ with different http headers. This function is useful when automating the requests\
    \ to various APIs.\n\nSimple example for Netlas API (https://github.com/netlas-io/netlas-cookbook):\n\
    \n### curl -X\n```bash\ncurl -X 'https://api.netlas.io/api/responses?q=lid.com&source_type=include&start=0&fields=*'\
    \ -H 'accept: application/json' > api_request_result.txt\n```\n\n```json\njsonviewer.stack.hash\n\
    {\n  \"JSON\": {\n    \"items\": [\n      {\n        \"highlight\": {\n      \
    \    \"data\": {\n            \"updated\": \"2023-10-19T13:29:53.501Z\",\n   \
    \         \"hash\": \"2aa2cd000aa2ed00042d42d0050d7691d884b6fa8f9fc5c2b4b882cc\"\
    ,\n            \"isp\": \"China Mobile\",\n            \"ip\": \"223.119.235.192\"\
    ,\n            \"certificate\": {\n              \"uri\": \"https://223.119.235.192:443/\"\
    ,\n              \"host_type\": \"\",\n              \"target\": {\n         \
    \       \"geo\": {\n                  \"country\": \"CN\"\n                },\n\
    \                \"path\": \"\",\n                \"protocol\": \"https\",\n \
    \               \"port\": \"443\",\n                \"timestamp\": \"2023-10-19T13:29:53.501Z\"\
    \n              },\n              \"who\": {\n                \"port\": \"443\"\
    ,\n                \"host\": \"223.119.235.192\",\n                \"iteration\"\
    : \"0\"\n              },\n              \"http\": \"\"\n            }\n     \
    \     }\n        }\n      }\n    ]\n  }\n}\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_34_0.png)\n\
    \nUsing this query, we retrieved JSON file with detailed domain information found\
    \ in Netlas IP search engine by query \"lid.com\". You can view it in a convenient\
    \ format using some JSON viewer tools (https://jsonviewer.stack.hu/).\n\nOn Day\
    \ 14, we'll talk a little more about data in JSON format and learn how to process\
    \ it using jq utility.\n\n![](img/03e4d38bded7def6bb51288422c4f89d_35_0.png)\n\
    \nIn addition to the Netlas API, which can be used to collect domain data, there\
    \ are hundreds of other different APIs that can be used for OSINT. They can help\
    \ you collect information about emails, phone numbers, physical addresses, cryptocurrency\
    \ wallets, and more. You can find a list of them in repository (https://github.com/cipher387/python-for-OSINT).\n\
    \n## Easily generate curl commands\n\n| Header | Header value |\n| :--- | :---\
    \ |\n| GET | |\n| Authorization | |\n| REMOVE | |\n| ADD | |\n| Content-Type |\
    \ |\n| Accept | self-signed |\n| Verbose | |\n\n```bash\ncurl -X GET://github.com/cipher387/python-for-OSINT-21-days/raw/Python-for-OSINT.\n\
    ```\n\nFor complex queries, you can use a special service to view information\
    \ about web pages. Use -I flag to send HEAD request and retrieve the headers (without\
    \ the body):\n\n```bash\n$ gitpod /workspace/linux-for-OSINT-21-day/day_5 (main)\
    \ $ curl -I https://osint.nl/\nHTTP/200 OK\ndate: Wed 23 Oct 2023 23:36:23 GMT\n\
    content-type: text/html; charset=utf-8\ncache-control: max-age=3600\nexpires:\
    \ Wed 23 Oct 2023 23:36:23 GMT\nx-cache: hit-from-cache-b6d3f5f7963d5eb\nexpires=25-Dec-2023\
    \ 22:36:23 GMT; Max-Age=3600; path=/; domain=.osint.nl; secure; HttpOnly; Same\n\
    vary: *\nmodified: Thu, 11 Jul 2023 04:50:26 GMT\nserver: cloudflare\nset-cookie:\
    \ \"success;max-age=60000\"\ncf-ray: 63ba433372-sg\nct-ray: 63ba433372-sg\nc-control:\
    \ public, no-transform, max-age=60000\n\n$ gitpod /workspace/linux-for-OSINT-21-day/day_5\
    \ (main) $\n```\n\n```bash\ncurl -I https://sector.\n```\n\nThis can be used,\
    \ for example, to safely open short links:\n\n```bash\n$ gitpod /workspace/linux-for-OSINT-21-day/Day_5\
    \ (main) $ curl -sIL https://rb.gy/899j0\nHTTP/2 200\ndate: Mon, 25 Oct 2023 22:20:22\
    \ GMT\nlocation: https://google.com/\ncache-control: no-cache, no-store\nexpires:\
    \ -1\nengine: cloudflare, redirect, version 2.2\nstrict-transport-security: max-age=15552000\n\
    \nHTTP/2 200\naccept-ranges: bytes\ncontent-type: text/html\ndate: Mon, 25 Oct\
    \ 2023 22:20:22 GMT\netag: \"57ff4ea1b38da1-\"\nlast-modified: Sun, 27 Oct 2023\
    \ 23:36:54 GMT\nserver: Microsoft-IIS\nx-powered-by: ASP.NET\ncontent-length:\
    \ 9966\n$ curl -sIL https://rb.gy/899j0 | grep ^location: https://google.com/\n\
    gitpod /workspace/linux-for-OSINT-21-day/Day_5 $\n```\n\n## curl -siL https://rb.gy/899j0\
    \ | grep ^location\n\nNote that here we are combining Curl with the Grep command,\
    \ using the | to cut out the string that starts with \"location\" from the result.\
    \ Tomorrow we will talk more about this wonderful utility.\n\n## Day 6. Search\
    \ in files. Grep\n\nWhat can you do with the downloaded files? Lots of different\
    \ things. But the most important thing OSINT specialist should be able to do is\
    \ automatically search and extract different data.\n\nGrep (https://www.gnu.org/software/grep/)\
    \ is one of the oldest UNIX utilities, released in November 1973 (50 years in\
    \ 2023!). It allows searching for matches to certain text patterns (regular expressions)\
    \ in files.\n\nThe Grep utility does not require installation. It is available\
    \ in Linux by default.\n\n```bash\n$ gitpod /workspaces/linux-OSINT-21-day (main)\
    \ $ grep --help\nusage grep [OPTION]... PATTERN [FILE]...\nSearch for PATTERN\
    \ in each file:\nExample: grep -l 'hello world' menu.h.c\nGrep can contain multiple\
    \ patterns separated by newlines.\n\nPattern selection and interpretation:\n-E,--extended-regexp\
    \    PATTERNS are extended regular expressions\n-F,--fixed-strings      PATTERNS\
    \ are strings\n-G,--basic-regex       PATTERNS are basic regular expressions\n\
    -P,--perl-regexp         PATTERNS are Perl regular expressions\n-i,--ignore-PATTERNS\
    \   PATTERNS for matching\n-f,--file              take PATTERNS FROM FILE\n-n,--ignore-case\
    \         ignore case distinctions in patterns and data\n  --ignore-case     \
    \     do not ignore case distinctions (default)\n-w,--word-regexp        match\
    \ only words\n-l,--line-regexp        match only lines\n-z,--null-data       \
    \   a data line ends in 0 byte, not newline\n\nMiscellaneous:\n-s,--messages \
    \          suppress error messages\n-v,--non-match          select non-matching\
    \ lines\n-v,--version            display version information and exit\n--help\
    \                  display this text and exit\n\nOutput control:\n-c,--max-count=N\
    \       stop after NM selected lines\n-b,--byte-offset        print the byte offset\
    \ with output lines\n-n,--line-number        print line number with output lines\n\
    -U,--buffered           flush output on every line\n-H,--hostname          print\
    \ name with output lines\n-h,--filename          suppress the file name prefix\
    \ on output\n--label=LABEL           use LABEL as the standard input file name\
    \ prefix\n-O,--only-matching      show only parts of lines that match\n-q,--quiet\
    \ --silent     suppress all normal output\n\nRun the help command to appreciate\
    \ that just how many options are: this seemingly utility has.\n\nLet's try to\
    \ find lines in the file that includes \"gmail\". Use -F flag for search strings\
    \ (it's option, you can also miss this flag):\n"
  mdcn: "\n今天，我们将学习 Linux 中自动化数据收集最重要的技能之一 - 使用 `Curl` 工具下载文件。这在处理请求、爬取网站、从归档或其他源下载数据时非常派用场。\n\
    \n![](img/03e4d38bded7def6bb51288422c4f89d_32_0.png)\n\n这并不是完整的帮助文档，此菜单是按类别拆分的。使用使用\
    \ `--help category` 可以获取所有类别的概览。要查看所有选项，请查阅手册或使用 `--help all`。\n\n[Curl](https://curl.se/)\
    \ 是一个从服务器或向服务器传输数据的工具，支持支持的许多协议之一（DICT, FILE, FTP, FPS, GOPHER, HTTP, HTTPS, IMAP,\
    \ IMAPS, LDAP, LDAPS, POP3S, RTSP, SCP, SFTP, SMB, SMBS, SMTP, SMTPS, TELNET）。它不需要安装，在\
    \ Linux 中默认可用。\n\n让我们尝试下载文件。使用 `-o` 标记将原始文件名更改为 `file.pdf`：\n\n![](img/03e4d38bded7def6bb51288422c4f89d_32_1.png)\n\
    \n在命令行中输入：\n\n## Cd 第 5 天\ncurl https://eduscol.education.fr/document/3366/download\
    \ -o file.pdf\n\n现在让我们尝试使用 `Xargs` 命令（我们昨天讨论过它）从链接列表下载文件。\n\n![](img/03e4d38bded7def6bb51288422c4f89d_33_0.png)\n\
    \n## xargs -n 1 curl -O < urls.txt\n\n使用 `-H` 标记，你可以发送带有不同 http 头的请求。此功能在自动化向各种\
    \ API 发送请求时非常有用。\n\nNetlas API (https://github.com/netlas-io/netlas-cookbook)\
    \ 的简单示例：\n\n### curl -X\n```bash\ncurl -X 'https://api.netlas.io/api/responses?q=lid.com&source_type=include&start=0&fields=*'\
    \ -H 'accept: application/json' > api_request_result.txt\n```\n\n```json\njsonviewer.stack.hash\n\
    {\n  \"JSON\": {\n    \"items\": [\n      {\n        \"highlight\": {\n      \
    \    \"data\": {\n            \"updated\": \"2023-10-19T13:29:53.501Z\",\n   \
    \         \"hash\": \"2aa2cd000aa2ed00042d42d0050d7691d884b6fa8f9fc5c2b4b882cc\"\
    ,\n            \"isp\": \"中国移动\",\n            \"ip\": \"223.119.235.192\",\n\
    \            \"certificate\": {\n              \"uri\": \"https://223.119.235.192:443/\"\
    ,\n              \"host_type\": \"\",\n              \"target\": {\n         \
    \       \"geo\": {\n                  \"country\": \"CN\"\n                },\n\
    \                \"path\": \"\",\n                \"protocol\": \"https\",\n \
    \               \"port\": \"443\",\n                \"timestamp\": \"2023-10-19T13:29:53.501Z\"\
    \n              },\n              \"who\": {\n                \"port\": \"443\"\
    ,\n                \"host\": \"223.119.235.192\",\n                \"iteration\"\
    : \"0\"\n              },\n              \"http\": \"\"\n            }\n     \
    \     }\n        }\n      }\n    ]\n  }\n}\n```\n\n![](img/03e4d38bded7def6bb51288422c4f89d_34_0.png)\n\
    \n通过此查询，我们从 Netlas IP 搜索引擎中通过查询 \"lid.com\" 获取了包含详细域名信息的 JSON 文件。你可以使用一些 JSON\
    \ 查看器工具（https://jsonviewer.stack.hu/）以方便的格式查看它。\n\n在第 14 天，我们将更多地讨论 JSON 格式的数据，并学习如何使用\
    \ `jq` 工具对其进行处理。\n\n![](img/03e4d38bded7def6bb51288422c4f89d_35_0.png)\n\n除了可以收集域名数据的\
    \ Netlas API 之外，还有数百种其他可用于 OSINT（开源情报）的 API。它们可以帮助收集电子邮件、电话号码、物理地址、加密货币钱包等信息。你可以在仓库（https://github.com/cipher387/python-for-OSINT）中找到它们。\n\
    \n## 轻松生成 curl 命令\n\n| Header | Header 取值 |\n| :--- | :--- |\n| GET | |\n| Authorization\
    \ | |\n| REMOVE | |\n| ADD | |\n| Content-Type | |\n| Accept | 自签名 |\n| Verbose\
    \ | |\n\n```bash\ncurl -X GET://github.com/cipher387/python-for-OSINT-21-days/raw/Python-for-OSINT.\n\
