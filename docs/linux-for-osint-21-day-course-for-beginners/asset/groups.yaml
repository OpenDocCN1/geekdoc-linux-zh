    DOCX / 13,51 MB\n\n下载\nsample3.docx\nDOCX / 33,57 KB\n```\n\n# html2text example.html\n\
    \n# 其他工具\n\n网页爬取是一个包含许多细节的巨大话题，需要专门的一本书来介绍。今天我们刚刚学会了如何从 html 代码中提取信息。\n\n但有时，从网站收集数据需要自动打开浏览器并模拟不同的用户操作（因为必须的数据只有在执行\
    \ JavaScript 代码后才会加载）。在这种情况下，你需要使用可以在命令行中运行浏览器（例如 Firefox 或 Chromium）的工具。\n\n\
    应该说的是，Linux 和 Bash 并不总是爬虫的正确工具。对于许多与 OSINT 相关的任务，任何支持以 CSV 格式导出数据的许多爬虫浏览器插件（特别注意\
    \ AI 爬取）可能就足够了，正如所知，这些插件在 Linux 中处理非常方便。几个例子如下：\n\n- Webscraper.io (https://webscraper.io)\n\
    - DataMiner (https://dataminer.io)\n- Instant Data Scraper (https://chromewebstore.google.com/detail/instant-data-scraper/ofaokhiedipichpaobibbibbnahnkdoijah)\n\
    \n以及许多许多其他。\n\n# 第 16 天。网络搜索自动化工具\n\n在 Google 或另一个搜索引擎上搜索信息可能会占用大量 OSINT 专业人员的时间。因此，即使你忘记了书中的所有其他章节，仅自动化这一过程，也足以通过自动化来减少工作时间了。\n\
    \n有很多工具可以自动化你与不同搜索引擎的工作，但它们彼此都非常相似。今天，我将向你展示工具类型——一种是自动化传统的搜索（搜索页面），另一种是自动化 IP\
    \ 搜索（搜索所有连接到设备的设备）。\n\n# DuckDuckGo 搜索自动化\n\n```\nPROMPT OUTPUT PORT CONSOLE TERMINAL\n\
    $ pip install duckduckgo-osint-21-Day_21 [main] & Edit Day_17\n$ pip install duckduckgo-osint-21-Day_21\
    \ [main] & pip install ddgr\n(collecting)\nDownloading ddgr-2.1-py3-none-any.whl\
    \ (38 KB)\nInstalling collected packages: ddgr-2.1\nSuccessfully installed ddgr-2.1.\n\
    ```\n\n从终端使用 DuckDuckGo。\n\n位置参数：\nKEYWORD\n\n```\n搜索关键词\n选项:\n--help        \
    \          显示帮助信息并退出\n--page N               输出页码（默认: 20）显示每页获取的结果数\n--region-specific\
    \ search -u --region=us (默认: 默认) https://duckduckgo.com/us\n--colorize       \
    \      输出颜色（默认: auto）意味着仅当输出为 tty 设备时；- 无颜色\n--timeout SEC           超时，等同于 colour-timeout\n\
    --json                 以 JSON 格式输出；意味着 --n--limit LIMIT             限制结果（1 天,\
    \ 1 小, 1 周, 1 月, 1 年）\n--time-limit SPAN      时间限制（秒）\n--expand              \
    \ 扩展搜索查询\n--proxy URL            设置 HTTP 代理 URL；格式：http://[user:password@]host[:port]\n\
    --unsafe               禁用安全搜索\n--max N                最大结果数\n--json          \
    \       json\n--py-browser           使用无头浏览器\n--no-prompt            不提示\n--rev,--reverse\
    \         反向列出条目\n```\n\nDuckDuckGo search (https://github.com/jarun/ddgr) 是一个用\
    \ Python 编写的命令行实用，允许你自动化 DuckDuckGo 搜索。\n\n让我们从 PyPI 包管理器安装：\n\n```\npip install\
