  - '[PAGE 117]


    But sometimes collecting data from websites requires automating the opening of
    the browser and simulating different user actions (because the necessary data
    is loaded only after executing JavaScript code). In this case, you need to use
    tools that run browsers (for example, Firefox or Chromium) in the command line.


    It should also be said that Linux and Bash are not always the right tools for
    scraping. For many OSINT-related tasks, any of the many scraping browser plugins
    that support exporting data in CSV format (pay special attention to AI scraping),
    which, as you know, is very convenient to work with in Linux, may be sufficient.
    Few examples:


    Webscraper.io (https://webscraper.io)

    DataMiner (https://dataminer.io)


    Instant Data Scraper (https://chromewebstore.google.com/detail/instant-data-scraper/ofaokhiedipichpaobibbibbnahnkdoijah)


    and many many others.'
  - '[PAGE 118]


    # # Day 16. Web search automation tools


    Searching for information on Google or another search engine can take up of OSINT
    professional''s time. Therefore, even if you forget about all the other chapters
    in this book and automate only this process, this would already be enough to reduce
    work time through automation.


    There are many tools for automating your work with different search engines, but
    they are all pretty similar to each other. Today, I will show you types of tools
    - one that automates a traditional search (searches pages) and one that automates
    an IP search (searches through all the devices connected to the internet).


    # DuckDuckGo search automation


    ```

    PROMPT OUTPUT PORT CONSOLE TERMINAL

    $ pip install duckduckgo-osint-21-Day_21 [main] & Edit Day_17

    $ pip install duckduckgo-osint-21-Day_21 [main] & pip install ddgr

    (collecting)

    Downloading ddgr-2.1-py3-none-any.whl (38 KB)

    Installing collected packages: ddgr-2.1

    Successfully installed ddgr-2.1.

    ```


    DuckDuckGo from the terminal.


    positional arguments:

    KEYWORD


    ```

    search keywords

    options:

    --help                  show help message and exit

    --page N               output page (default: 20) show number of results fetched
    per page

    --region-specific search -u --region=us (default: default) https://duckduckgo.com/us

    --colorize             output color (default: auto) means only when output is
    a tty device; - without color

    --timeout SEC           timeout equivalent to colour-timeout

    --json                 output in JSON format; implies --n--limit LIMIT             limit
    results (1 d, 1 h, 1 w, 1 month, 1 year)

    --time-limit SPAN      time limit in seconds

    --expand               expand search query

    --proxy URL            set an HTTP proxy URL; format: http://[user:password@]host[:port]

    --unsafe               disable safe search

    --max N                max number of results

    --json                 json

    --py-browser           use headless browser

    --no-prompt            do not prompt

    --rev,--reverse         list entries in reversed order

    ```


    DuckDuckGo search (https://github.com/jarun/ddgr) is a command-line utility written
    in Python that allows you to automate DuckDuckGo searches.


    Lets'' install from PyPI package manager:'
