  - '[PAGE 147]


    # Day 21. Which Linux distribution is better to use?


    The short answer is the one that you are comfortable working with and the one
    that you put the most effort into setting up. Try different distributions. But
    I would still recommend that you start with the ones that are actively developing
    at the moment and have a large community of users around them.


    Here are some examples of distributions that were created for cybersecurity researchers:


    +   - Tsurugi Linux Acquire (https://tsurugi-linux.org/tsurugi_acquire.php) -
    lightweight distribution (the installation file is just over 1 GB, there is a
    32-bit version, very good for running from a USB device) with many pre-installed
    tools for OSINT.

    - Kali Linux (https://www.kali.org/get-kali/) - the world''s most popular distribution
    for pentest and ethical hacking.

    - CSI Linux (https://csilinux.com) - complete “cyber forensic” platform based
    on Ubuntu.

    - BlackArch (https://blackarch.org) - lightweight (Slim ISO 5 Gb) expansion to
    Arch Linux for penetration testers.


    Here are a couple more long lists of Linux distributions for cybersecurity professionals:


    +   - Distro Forensics Github repository (https://github.com/CScorza/DistroForensics)
    Linux for OSINT Twitter list (https://twitter.com/cyb_detective/status/1441860681173033473)


    But if you work in cybersecurity, that doesn''t mean you need to use distributions
    that are designed for cybersecurity professionals. It''s not necessary at all.


    And there is absolutely no way to say that one distribution is better than another.
    After all, the answer to question is different for each person and changes over
    time.'
  - '[PAGE 148]


    ![](img/03e4d38bded7def6bb51288422c4f89d_148_0.png)


    Image from Reddit.


    There are hundreds of different Linux distributions and their variations (see
    picture above).

    Choose the one that:


    +   - suits your computer''s system requirements and runs quickly

    - is convenient and understandable for you personally (you can only find out which
    one is by\practice)


    Your work performance depends on how much effort you put into customizing the
    distribution for your personal tasks. The toolkit is different for each researcher
    anyway and you''ll still have to install a lot of the tools yourself.


    And most importantly, remember that the Linux philosophy is about no rules, maximum
    flexibility and maximum attention for the user''s individuality and goals.


    148'
