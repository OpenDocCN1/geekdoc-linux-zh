    \ (main)\n$ git clone https://github.com/cipher87/juicyinfo-nuclei-templates\n\
    ```\n\nNow, let's scan through all the links we've collected using Katana and\
    \ extract links that contain the word Github from the pages (we'll use the github\
    \ template to do):\n\n```bash\nnuclei -t juicyinfo-nuclei-templates/juicyinfo/github.yaml\
    \ -l results.txt > extracted_github_links.txt\n```\n\nSimilarly, you can collect\
    \ links to other social networks, phone numbers, IP addresses, cryptocurrency\
    \ wallet addresses, etc. (template names are intuitive). Nuclei also allows you\
