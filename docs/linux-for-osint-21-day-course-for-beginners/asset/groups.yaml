  - '[PAGE 32]


    Today we''re going to learn one of the most important skills for automating data
    collection in Linux - downloading files using the Curl utility. This comes in
    handy when processing requests, scraping websites, downloading data from archives
    or other sources.


    ![](img/03e4d38bded7def6bb51288422c4f89d_32_0.png)


    This is not the full help, this menu is stripped into categories. Use "--help
    category" to get an overview of all categories. For all options use the manual
    or "--help all".


    Curl (https://curl.se/) is a tool to transfer data from or to a server, using
    one of the lot of supported protocols (DICT, FILE, FTP, FPS, GOPHER, HTTP, HTTPS,
    IMAP, IMAPS, LDAP, LDAPS, POP3S, RTSP, SCP, SFTP, SMB, SMBS, SMTP, SMTPS, TELNET).
    It does not require installation. It is available in Linux by default.


    Let''s try to download file. Change original name to file.pdf with -o flag:


    ![](img/03e4d38bded7def6bb51288422c4f89d_32_1.png)


    Enter in command line:


    32'
