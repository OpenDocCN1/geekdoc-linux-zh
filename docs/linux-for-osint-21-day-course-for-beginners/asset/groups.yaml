    # Day 15. Scraping


    Scraping is the process of automatically extracting different data from web pages.
    If you are good at using curl, grep, sed and awk mentioned in the previous days,
    you can already successfully scrape web pages on Linux. But it''s worth exploring
    a few more tools to be more effective.


    # Katana


    First of all, let''s learn how to make a list of URLs of all pages of the site
    (or rather, all pages that are linked from other pages of the site, starting with
    the main page).


    This is very easy if you have the wonderful Katana (https://github.com/projectdiscovery/katana)
    tool from Project Discovery (https://github.com/projectdiscovery).


    ![](img/03e4d38bded7def6bb51288422c4f89d_109_0.png)


    Let''s install:


    ```

    go install github.com/projectdiscovery/katana/cmd/katana@latest

    ```'
  - '[PAGE 110]


    # katana -u sector035.nl'
  - '[PAGE 111]


    If you want to collect github links from a whole list of domains, use the -list
    flag. And let''s save the result this time, to a text file, so we can use it when
    we run the next command:


    ```

    cd Day 15

    Katana -list domains.txt>results.txt

    ```


    # NUCLEI


    Nuclei (https://github.com/projectdiscovery/nuclei) is another great tool from
    Project Discovery. It is primarily designed to scan sites for vulnerabilities,
    but it also does an excellent job of collecting investigative data from web pages.


    Let''s install:


    ![](img/03e4d38bded7def6bb51288422c4f89d_111_0.png)


    ```

    go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

    ```


    Clone "Juicy" into Nuclei templates (we''ll talk more about the git command on
    day 19):'
