    # Day 19. Git and Github


    Git (https://git-scm.com) is a software version control system created by Linus
    Torvalds. According to StackOverflow''s 2022 survey, more than 93% of developers
    use it as their primary version control (https://survey.stackoverflow.com/2022/#section-version-control-version-control-systems).


    The situation with Git and Linux is exceptionally rare where one person managed
    to invent two game-changing software in one lifetime (1991, Git in 2005).


    Even if you don''t intend to do any development work, you can still benefit from
    basic Git skills for OSINT, running different tools, as well as analyzing Github
    repositories that store large amounts of text data (e.g., phishing domain lists
    or smart contract files).


    Gitpod already has Git installed, but in others cases you may need to install
    it:


    ```bash

    sudo apt-get update

    sudo apt-get install git

    ```


    ![](img/03e4d38bded7def6bb51288422c4f89d_135_0.png)


    Let''s go to https://github.com/new and create new empty Github repository.


    # Create a repository


    A repository contains all project files, including the revision history. Already
    have a project repository elsewhere? Import it.


    Required fields are marked with an asterisk (*):


    | | Repository name * |

    |---|---|

    | cipher387 | linux_for_osint_21_day |

    | | linux_for_osint_21_day is available. |


    Description (optional)


    Text repository for your book


    | | Visibility |

    |---|---|

    | Public | Everyone can see and clone this repository. You can change this later.
    |

    | Private | Only you can see and commit to this repository. |


    Initialize this repository with:


    | Add a README file |

    |---|---|

    | [ ] This is where you can write a long description for your project. Learn about
    README. |


    Add .gitignore


    | | gitignore |

    |---|---|

    | | Choose from a template to ignore a list of files. Learn about .gitignore.
    |


    Choose a license


    | | License |

    |---|---|

    | | A license tells others what they can and can''t do with your code. Learn about
    licenses. |


    This will be set as the default. Change the default name in your settings.


    You are creating a private repository in your personal account.


    ![](img/03e4d38bded7def6bb51288422c4f89d_136_0.png)


    Look at the image, fill in the repository name and description fields, make the
    repository private, create a README.MD file and click on Create repository.


    Now go back to Gitpod and in the command line:


