    ```


    Open the title.yaml file and simply replace the title with some other title. If
    you wish, save the template under a different name and run Nuclei in the above
    way.


    And, of course, you can use whatever regular expressions you can think of for
    your tasks in the templates.


    You could do the same thing with the curl and grep command combinations we talked
    about on Days 5 and 6, but Nuclei is much faster and easier to set up.


    # HTML2TEXT


    Html2text (https://alir3z4.github.io/html2text/) is a very simple Python script
    that cleans up the text of web pages from html tags and makes it easy to read
    and automated information retrieval.'
