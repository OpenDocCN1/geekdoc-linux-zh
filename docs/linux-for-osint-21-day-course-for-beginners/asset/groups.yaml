    # git status


    There are about a dozen different git commands. But the most important thing you
    should realize from this tutorial is that working with Github repositories using
    the command line is easy and convenient.


    ![](img/03e4d38bded7def6bb51288422c4f89d_139_0.png)


    Github is not only a service for organizing collaboration on software development.
    It is also a huge platform for free distribution of open source software and technical
    knowledge.


    You can also find an active OSINT-enthusiast community, including thousands of
    users and repositories.


    You''ve probably already created a Github profile to authorize Gitpod. Feel free
    to use it to interact with the global OSINT community:


    - give stars to repositories you like. Pay special attention to good and little-known
    projects that have very few stars.

    - If you encounter any errors while running any tools, feel free to write about
    them in Issues.

    - If you have something useful, even if it''s just a list of tools or a cheat
    sheet with useful commands, feel free to put it in the public repository.

    - and, of course, don''t forget to subscribe to my profile (https://github.com/cipher387).


    # Day 20. Tools to make Linux easier to use


    In this book, I have already written about tools that can help you write commands
    in Linux. For example, in the chapters on **Sed** and **Awk**, JSON and XML. Today
    we will talk about more universal tools.


    The most important thing you should know about the Linux command line is that
    you need to know almost nothing about it to successfully solve your problems using
    it.


    ## AI tools


    Using AI assistants to write code has become very popular in the last year and
    a half. Many popular chatbots can generate both individual commands and full-fledged
    bash scripts:

