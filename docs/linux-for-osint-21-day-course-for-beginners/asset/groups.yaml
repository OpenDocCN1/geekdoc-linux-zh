    # Exit Vim


    ![](img/03e4d38bded7def6bb51288422c4f89d_57_0.png)


    This is a very important question that has inspired hundreds of people to create
    memes (google vim exit memes). Save these instructions somewhere.


    +   1. Press the **Esc** key to switch to command mode.

    2. Type `:q!** and press Enter (or type `:wq!` and press Enter, if you want to
    save the changes)


    In case you forget these instructions remember that you can always just click
    the right cross and close the terminal (in Gitpod too).


    If suddenly, for some reason, the instructions above seem too simple for you,
    you can try a dozen other ways to quit vim (https://github.com/hakluke/how-to-exit-vim).'
  - '[PAGE 58]


    # Using Vim


    Let''s-open the file again:


    ```

    vim text_example.txt

    ```


    And let''s try to navigate through the text:


    ![](img/03e4d38bded7def6bb51288422c4f89d_58_0.png)


    +   - G - move to the last line.

    - gg - move to the first line

    - ^ - move to the first character of current line

    - + - move to the first character of next line

    - yyp - duplicate current line

    - dd - delete current line

    - g; - go back to the last modified location

    - x - delete character or selected

    - y - delete character or selected

    - / - find text


    (If something suddenly doesn''t work, press Esc to enter command mode).


    And the bottom line is that there are over a thousand such quick commands. Over
    a thousand commands for working with text files. Here''s a list of 1,349, but
    it''s probably not complete, since Vim is infinite (https://pastebin.com/xBRYzAw0).'
