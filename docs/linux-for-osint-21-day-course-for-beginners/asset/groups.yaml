  - '[PAGE 125]


    Today we will return to the topic we started talking about Day 5. It''s downloading
    content (for later automatic analysis). This time we will talk about slightly
    more complex things, but in a more superficial way: FTP servers, torrents, file
    sharing and social media.


    Today we''re not going to run examples of commands, we''re just going to talk
    about different tools that we are worth knowing.


    # FTP


    ![](img/03e4d38bded7def6bb51288422c4f89d_125_0.png)


    On the fifth day, we already talked about the curl utility, which supports uploading
    through different protocols, including the FTP protocol.


    But still, the FTP utility [](https://www.gnu.org/software/inetutils/manual/html_node/ftp-invocation.html)
    is a bit more convenient for this task.


    If you need to transfer files, you will probably be more comfortable using a GUI
    FTP client such as FileZilla [](https://wiki.filezilla-project.org/Main_Page)
    rather than the command line.


    But FileZilla (like many other FTP clients) allows you to automate various actions
    using the command line [](https://wiki.filezilla-project.org/Command-line_arguments
    (Client)).'
  - '[PAGE 126]


    # Torrents


    It is illegal to use leaked data files, but many OSINT professionals use them
    anyway to gather more information. Often the leaked data is stored as huge files
    on torrents.


    For example, I had to deal with one social network leak that weighed hundreds
    of gigabytes. Unpacking the archives and extracting the necessary data using the
    JQ utility took more than two days! Thanks to the screen (Day 9) I only had to
    spend an hour writing commands and check screen sessions a few times to see if
    everything''s going well.


    Seedbox is a high-bandwidth remote server used to upload and download digital
    files from a peer-to-peer (P2P) network (tech slang).


    Here are some examples of popular services for monthly seedbox rentals:


    +   - RapidSeedbox (https://www.rapidseedbox.com)

    - Cloudboxes (https://cloudboxes.io)

    - DediSeedbox (https://dediseedbox.com/)


    Seedboxes is a very handy thing, but you can run command torrent clients on your
    VPS if you want:


    - Aria (https://aria2.github.io)

    - Transmission-cli (https://cli-ck.io/transmission-cli-user-guide/)

    - WebTorrent-cli (https://github.com/webtorrent/webtorrent-cli)

    - Stig (https://github.com/rndusr/stig)


    # File sharing services


    When using files are uploaded to various file sharing sites in investigations,
    you should keep in mind that their downloading can be automated. Here are some
    examples of command line utilities for different services that will help you do:


    Google Drive (https://github.com/glotlabs/qdrive)


    Dropbox (https://github.com/dropbox/dbxcli)'
  - '[PAGE 127]


    Mega.nz (https://github.com/meganz/MEGAcmd)


    OneDrive (https://github.com/skilion/onedrive)


    But be careful when using them and never use accounts where you have important
    information stored for authorization. **After all, these are unofficial utilities
    and accounts can be blocked for using them.**


    # Social media


    When you work with a lot of content that is published on some popular social network,
    check to see if someone else has made a utility to automate its uploading. For
    example:


    YouTube-dl (https://youtube-dl.org)


    SlideShare (https://github.com/mohan3d/slideshare-go)


    Spotify (https://github.com/spotDL/spotify-downloader)


    You Get (https://github.com/soimort/you-get)


    And I''ll say it again. We are talking about unofficial clients, the use of which
    can lead to blocked accounts. Be very careful.


    # Day 18. Domain investigation


    Perhaps when you first saw this book, you thought of it as being mostly about
    automating the network information gathering. But this book has the goal of teaching
    OSINT technicians minimal Linux skills.


    Therefore, I will cover only the most basic techniques.'
