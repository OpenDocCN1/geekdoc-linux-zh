  md: '# Day 2. Basic Bash syntax


    What is the most important point of using the command line to perform various
    tasks instead of the GUI?


    The ability to record and repeatedly perform different sequences of actions to
    automate your work.


    Bash (https://www.gnu.org/software/bash/) is a Unix shell and command language
    written by Brian Fox and first released in 1989. This is what we will use to write
    commands to automate various tasks in Linux, combining Bash scripts with tools
    written in other programming languages (Python, Go etc).


    Commands for later execution can be stored in files with the extension **.sh**.
    Let''s take a look at how this works right away.


    Go to current folder:


    ```

    cd Day_2

    ```


    And run file create_folders.sh:


    ```

    bash create_folders.sh

    ```


    ![](img/03e4d38bded7def6bb51288422c4f89d_13_0.png)


    If you didnt miss yesterday''s lesson, you can see that this script creates three
    directories with different names.'
  merge: -1
  pgno: 13
- img_proc: true
