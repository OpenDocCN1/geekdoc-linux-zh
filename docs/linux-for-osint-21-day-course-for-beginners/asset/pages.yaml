    ```

    $ gitpod /workspace/linux-for-OSINT-21-day/13 (main) jq -h

    j - commandline JSON parser (version 1.6)

    ```


    ```

    Usage: jq [options] jq filter [file...]

    jq [options] --args jq filter [strings...]

    jq [options] --jsonargs jq filter [JSON_TEXTS...]

    ```


    jq is a tool for processing JSON inputs, applying the given filter to its JSON
    input and producing the results as JSON on standard output.


    The simplest filter is ., which copies jq''s input to its output unmodified (except
    for formatting), but note that IEEE754 is used for numeric representation internally,
    with all that implies).


    For more advanced filters use the jq(i) map("jq") and/or https://github.io/jq/


    Example:


    ```

    $ echo ''{"foo": 0}'' | jq

    { "foo": 0}

    ```


    +   Some of the options include:

    - compact indent-printed output;

    - null as the single input value;

    - set the exit status code on the output;

    - read (slurp) Inputs into an array; apply to it;

    - read raw strings, no JSON texts;

    - colorize JSON;

    - monochrome (don''t colorize JSON);

    - sort keys of objects on output;

    - use tabs for indentation

    - set variable $a to value <>


    ```

    -arg a v

    ```


