  md: '# Xargs


    Xargs (https://man7.org/linux/man-pages/man1/xargs.1.html) is a utility that allows
    you to run different Linux commands with certain input parameters. This includes
    reading these parameters from lists stored in files.


    Let''s look at examples of how it works.


    ![](img/03e4d38bded7def6bb51288422c4f89d_30_0.png)


    Let''s create all the archives from the txt_files folder:


    ```

    find txt_files -name "*.zip" -type f | xargs rm -

    ```


    Now let''s create archives using Xargs:


    ![](img/03e4d38bded7def6bb51288422c4f89d_30_1.png)


    ![](img/03e4d38bded7def6bb51288422c4f89d_30_2.png)'
