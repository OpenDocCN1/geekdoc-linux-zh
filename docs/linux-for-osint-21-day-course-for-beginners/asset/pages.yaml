    \ json_test.json > x\nDay_14 > json_test.json >\n{\n  \"people\": [\n    {\n \
    \     \"firstName\": \"Joe\",\n      \"lastName\": \"Jackson\",\n      \"gender\"\
    : \"male\",\n      \"age\": 25,\n      \"number\": \"7349282382\"\n    },\n  \
    \  {\n      \"firstName\": \"Emily\",\n      \"lastName\": \"Junes\",\n      \"\
    gender\": \"female\",\n      \"age\": 24,\n      \"number\": \"567856567\"\n \
    \   }\n  ]\n}\n```\n\nJSON is format for representing structured data based on\
    \ JavaScript object syntax. That is, data in it are describ in the form of objects\
    \ (example on the picture - **people**), each of which has a set of certain properties\
    \ (example on the picture - **firstName, lastName, gender**) and each property\
    \ can have a certain value (example on the picture - **\"Joe\", \"Jackson\", \"\
    male\"**).\n\nJQ (https://iqlang.github.io/jq/) is one of most popular command\
    \ line JSON processor. It is installed by default in most Linux distributions."
