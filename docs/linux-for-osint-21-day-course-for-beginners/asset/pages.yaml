    # FTP


    ![](img/03e4d38bded7def6bb51288422c4f89d_125_0.png)


    On the fifth day, we already talked about the curl utility, which supports uploading
    through different protocols, including the FTP protocol.


    But still, the FTP utility [](https://www.gnu.org/software/inetutils/manual/html_node/ftp-invocation.html)
    is a bit more convenient for this task.


    If you need to transfer files, you will probably be more comfortable using a GUI
    FTP client such as FileZilla [](https://wiki.filezilla-project.org/Main_Page)
    rather than the command line.


    But FileZilla (like many other FTP clients) allows you to automate various actions
    using the command line [](https://wiki.filezilla-project.org/Command-line_arguments
    (Client)).'
