  md: '# Day 4. Batch file processing


    With Bash scripts you can manipulate thousands of files with a few lines of code.


    For example, you can perform the same action on all files with a certain extension
    located in a certain folder. For this we will use the Find utility (https://man7.org/linux/man-pages/man1/find.html).
    It is installed in Linux by default.


    Please, type in command line:


    ```

    cd Day 4

    bash print file_names.sh

    ```


    ![](img/03e4d38bded7def6bb51288422c4f89d_27_0.png)


    Source code of print_file_names.sh:


    ```

    for i in `find txt_files/. -name "*.txt" -type f; do

    echo "$i"

    done

    ```'
