  md: '# Day 7. Sed and Awk


    Today is one of the longest lessons with the most examples. Some people will find
    it the most boring in the course. But believe me, from the point of view of learning
    to save time, it is the most useful day. It is even more useful than the day in
    which we will talk about AI assistants.


    Sed (https://www.gnu.org/software/sed/) is a non-interactive command-line text
    editor (it would be more accurate to say stream editor). In other words, it allows
    you to make changes to a text file without opening.


    ```

    $ gitpod/workspace/linux-OSINT-21-day (main) $ sed -h

    sed: invalid option -- ''h''

    Usage: sed [OPTION]... [script-only-if-no-other-script] [input-file]...

    -h, --quiet, --silent

    ssuppress automatic printing of pattern space

    --debug

    annotate program execution

    -e script, --expression=script

    edit the script to the commands to be executed

    -f script-file, --script-file

    add the contents of script-file to the commands to be executed

    --follow-symlinks

    follow symlinks when processing in place

    -i [SUFFIX],--in-place [SUFFIX]

    edit files in place (backup if SUFFIX supplied)

    -L N, --line-length N

    specify the desired line-wrap length for the ''l'' command

    --posix

    disable GNU extensions.

    -E, -r, --regexp=extended

    use regular expressions in the script

    (for portability use POSIX -E).

    -s, --separate

    consider files as separate rather as a single,

    continuous stream.

    --sandbox

    operate in sandbox mode (disable c/rw commands)

    -U, --unbuffered

    load minimal amounts of data from the input files and flush

    the outputs more often

    -z, --null-data

    separate lines by NULL characters

    --help

    display this help and exit

    --version

    output version information and exit

    ```


