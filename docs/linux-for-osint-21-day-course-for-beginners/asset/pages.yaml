  md: '# Day 3. Install and run utilities


    Linux utility is a command that can be run on the command line or on bash scripts.
    We have already used some of these in past lessons: cat, bash, cd, man, cp, mkdir.
    These are utilities that are installed by default in every Linux distribution.


    You can see the full list of utilities and applications installed in your own
    distribution using a special command. Which one depends on the type of your distribution.
    For example:


    +   - Ubuntu, Debian: dpkg -l

    - Fedora, RHEL: rpm -qa

    - OpenBSD, FreeBSD: pkg-info

    - Gentoo: query list or eiix

    - Arch Linux: pacman -Q


    If you are using Gitpod, you need to use the commands for Ubuntu.


    Run in command line:


    ```

    dpkg -l

    ```


    ![](img/03e4d38bded7def6bb51288422c4f89d_22_0.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'There are also thousands of utilities for a wide variety of purposes that you
    can install yourself.


    As an example, let''s install two utilities for working with ZIP archives:


    ```

    sudo apt install unzip

    ```


    In this example it is not necessary (we could just use apt install), but we add
    the word sudo before the command.


    This way we run the command with superuser privileges (maximum permissions to
    write, read and delete files). In Gitpod, you can use it just like that, but if
    you are working on your own computer and not logged in as an administrator, you
    may have to enter a password.


    ![](img/03e4d38bded7def6bb51288422c4f89d_23_0.png)


    Let''s try to convert the file into a zip archive:


    ```

    cd Day_3

    zip archive test1.txt test2.txt

    ```


    Instead of file names, we could specify directory names or put all txt files from
    the active directory into the archive using *.txt instead of listing filenames.'
  merge: -1
  pgno: 23
