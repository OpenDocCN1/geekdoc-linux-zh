  md: 'Don''t forget to subscribe to me on Twitter, Mastodon, Telegram, BlueSky, Substack,
    Medium to get regular news about OSINT tools, and not to miss new books. All links
    can be found at cybdetective.com.


    Once you''ve had at least a little bit of practice and you want to learn something
    new again, you can also read "Python for OSINT. A 21-day course for beginners"
    (https://github.com/cipher387/python-for-OSINT-21-days). It''s also distributed
    freely (donate what you want and if you want).


    Also remember that the global open source community is growing due to the small
    efforts of each of the tens of millions of enthusiasts around the world.


    Don''t forget to write about open source tools in your social networks, support
    developers with good reviews and donations, and if you like programming, don''t
    hesitate to contribute to various projects on Github. Even if you don''t know
    much yet, you can help with testing or writing documentation.


    # Application. Is it possible to do the same thing on Windows?


    Yes, it is possible and plenty of people do it. But as mentioned above, it''s
    easier to run Linux VM or VPS than to think about how to do the same thing on
    Windows.'
