  md: 'Patterns to search with **Grep** With their help you can search not only numbers
    and emails, but also URLs, IP addresses, crypto currency wallets, usernames, ZIP
    codes, code comments and much more.


    We will not go into their syntax in this course. For most OSINT purposes, you
    will just need to copy a regular expressions from Stackoverflow or some online
    library:


    RegexLib (https://regexlib.com/)


    RegexHub (https://projects.lukehaas.com/regexhub/)


    And, of course, you can always use ChatGPT or Phind to compose a regular expression
    for you (we''ll talk more about helper tools on **Day 20**.


    If you are interested in this topic, Medium blog has a very detailed and long
    article about: **How regular expressions can be useful in OSINT. Theory and method
    using Google Sheets


    (https://medium.com/osint-ambition/this-article-consists-of-three-short-parts-31d31fab5d).


    We can also use regular expressions when working with other Linux utilities: **find,
    sed, awk, tr,** and others.


    If you want to search for files strictly with a certain extension or for files
    whose name contains a certain string, replace part of the file name with asterisks:


    ```

    grep -n "gmail" *.txt

    PROBLEMS OUTPUT PORTS DEBUG CONSOLE TERMINAL

