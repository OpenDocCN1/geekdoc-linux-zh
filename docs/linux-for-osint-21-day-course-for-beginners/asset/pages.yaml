    bash variables.sh

    ```


    ![](img/03e4d38bded7def6bb51288422c4f89d_14_0.png)


    Comments in the code denote by the symbol #.


    In this cases will not affect the scripts, but I recommend that you indicate on
    the first line of the .sh files that it is a Bash script:


    ```

    #!/bin/bash

    ```


