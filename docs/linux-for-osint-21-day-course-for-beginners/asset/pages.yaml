  md: '# # Day 0. Getting ready to work


    Eric Raymond, in his article “How to become a hacker” (1 December 1997, https://cs.fit.edu/~wds/classes/cdc/Readings/BecomeAHacker.pdf),
    recommended going to a local Linuxoid meeting and asking to burn some dismos in
    exchange for beer (I found this article, but "where to get Linux" no longer working).


    In the last 26 years progress has gone a long way and I''ll just ask you to open
    a new tab in your browser.


    Gitpod is a service that provides online development environments based on the
    Linux distribution Ubuntu (https://ubuntu.com). You can use it for 50 hours a
    month for free. This is definitely enough time for you to take this course **many
    times**.


    You should use a Github (https://github.com/) account for authorization (registration
    is very fast and also free).


    Open this link and create a workspace with standard settings:


