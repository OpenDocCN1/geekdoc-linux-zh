    # .docx files


    Pandoc (https://pandoc.org/MANUAL.html) is a universal utility for analyzing,
    converting and generating text documents (web pages, ebooks and more).


    ```

    -f format -t FORMAT --from=FORMAT --read=FORMAT


    Specify input format. FORMAT can be:

    * bibtex (BibTeX bibliography)

    * biblatex (BibLaTeX bibliography)

    * bits (XML for parsers)

    * commonmark (CommonMark Markdown)

    * commonmark_x (CommonMark Markdown with extensions)

    * creole (AsciiWiki)

    * csl (CSJSON bibliography)

    * csv (CSV table)

    * tsv (TSV table)

    * docbook (DocBook)

    * docx (Word docx)

    * duckowiki (MediaWiki markup)

    * erdtree (FreeText XML)

    * epub (EPUB format)

    * f2b (reStructured e-book)

    * gfm (GitHub-Flavored Markdown, or the deprecated and less accurate markdown_github)

    * gfm_github (GitHub Markdown markup)

    * html (HTML)

    * ipypn (Jupyter notebook)

    * jsjax (MathJax)

    * jira (Jira/Confluence wiki markup)

    * json (JSON format of native AST)

    * latex (LaTeX-like)

    * markdown (Pandoc''s Markdown)

    * markdown_md (MultiMarkdown)

    * markdown_atx (EPDF Markdown Extra)

