- img_proc: true
  md: 'The real power of Grep comes in combination with other commands. For example,
    you can use it to filter the output of the command:


    ```

    ls -R | grep ".txt"

    ```


    Note that we used the ls command with the -R flag to display the list of files
    in the subdirectories too.


    ![](img/03e4d38bded7def6bb51288422c4f89d_43_0.png)


    Also, grep allows you to search for strings that do NOT contain the word you are
    looking for or match a regular expression. The -v flag:


    ```

    grep -v "gmail" example.txt

    ```'
