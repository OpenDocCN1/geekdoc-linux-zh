  md: "Now the task is a little more difficult. Let's find the strings that contain\
    \ emails:\n\n```\ngrep -E -o\n\"[A-Za-z0-9][A-Za-z0-9.%+-]+@[A-Za-z0-9][A-Za-z0-9.-]+\\\
    .[A-Za-z]{2,6}\" \n```\n\nWe use a few other useful flags in this command:\n\n\
    E - use extended regular expressions syntax.\n\no - show only parts of lines that\
