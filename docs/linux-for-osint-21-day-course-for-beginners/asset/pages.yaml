  md: 'Like many other programming languages, bash allows you to combine long programs
    into

    functions, so that you can then trigger their execution with a short function
    name.


    Let''s look at an example.


    Run in command line:


    ```

    bash function.sh

    ```


    ![](img/03e4d38bded7def6bb51288422c4f89d_20_0.png)


