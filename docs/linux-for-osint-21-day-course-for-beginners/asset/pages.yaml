    \n```\n#!/bin/bash\n# Example: ShellCheck can detect some lower semantic problems\n\
    while getopts \"f:s:\" opt; do\n  case $opt in\n    f) file=\"$OPTARG\";\n   \
    \ s) set -- \"$OPTARG\";\n    *) echo \"\";\nesac\ndone\nif [ -f \"$file\" ];\
