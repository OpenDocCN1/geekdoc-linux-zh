    on a ramdisk. All we have to do is create a second extended filesystem on a ramdisk
    device, mount it and copy files to it. Once the filesystem is populated with all
    the files that the root disk needs, we unmount it, compress and write it to a
    floppy.


    +   * For this work, we need to make sure the system for building has ramdisk
    support. If ramdisk is not available it is also possible to use a loopback device.
    See the Bootdisk–HOWTO for more information on using loopback devices.


