    ```


    # 7.3.4. Create support files in /etc


    # 7.3.4.1. /etc/issue


    Create the file ~/staging/issue using the example below or design a customized
    message.


    Connected to \l at \ bps.

    Be sure that "L" is a lowercase L and not the number one.


    # 7.3.4.2. /etc/passwd


    Use a text editor to create a minimal passwd file conforming to the Linux Standards
    Base (LSB) document. Save the file as ~/staging/etc/passwd


    ```

    root:0:0:Super User:/root:/bin/sh

    bin:x:1:1:Legacy UID:/bin/bin/false

    daemon:x:2:2:Legacy UID:/sbin:/bin/false

    ```


