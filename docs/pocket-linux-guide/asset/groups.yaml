    ### 5.4.1. System startup


    Using the following procedure:


    - Boot the PC using the floppy labeled "root disk".

    - At the grub prompt, type the kernel and boot commands, but without the rw parameter
    this time. In other words, type kernel (fd0)/boot/vmlinux init=/bin/sh root=/dev/fd0
    load_ramdisk=1 prompt_ramdisk=1, press boot and press Enter.

    - In the recently created root disk when prompted.


