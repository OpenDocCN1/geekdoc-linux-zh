- md: "\n# Chapter 9. Project Wrap Up\n\n## 9.1. Celebrating Accomplishments\n\nThe\
    \ Pocket Linux Project draws to a close; we should take a moment to celebrate\
    \ all of our accomplishments. Some of the highlights are listed below:\n\n- We\
    \ have built a system, from source code only, that fully implements all of the\
    \ commands described in the Filesystem Hierarchy Standard requirements for a root\
    \ system.\n- We have learned how to use Internet resources to locate and download\
    \ the source code needed to build a GNU/Linux system.\n- We have written basic\
    \ system setup and shutdown scripts and configured them to execute in the proper\
    \ runlevels.\n- We have included support for multiple users on virtual consoles\
    \ and implemented permissions on system files.\n- But most importantly, we have\
    \ learned some good design techniques and project management skills that will\
    \ enable us to tackle any future projects with ease and confidence.\n\n## 9.2.\
    \ Planning Next Steps\n\nThe Pocket Linux system is nearly overflowing, so there\
    \ is really no room to expand the current root diskette to support any additional\
    \ commands and features. This leaves us with a few choices of where to go next.\
    \ We can:\n\n- Find a way to expand the current system just enough to host a small\
    \ application. (For more information about hosting applications with Pocket Linux,\
    \ see Appendix A)\n- Remove multi-user capability and some of the least used commands\
    \ from the root disk, replacing them with utilities like tar and gzip that would\
    \ be useful for a rescue/restore diskset.\n- Use the techniques we have learned\
    \ to design and build an entire GNU/Linux system and install it on a more spacious\
    \ hard disk partition. (For more information about building a larger system, check\
    \ out the GNU/Linux System Architect Toolkit at: http://architect.sourceforge.net/)\n\
    \nWhatever path is chosen, we can move forward confidently, armed with the knowledge\
    \ we need in our endeavors.\n\n# Appendix A. Hosting Applications\n\n## A.1. Analysis\n\
    \nAn operating system by itself is not much fun. What makes an OS great is the\
    \ applications that can be run on top of it. Unfortunately, Pocket Linux currently\
    \ does not have much room for anything other than system programs. Still, it would\
    \ be nice to expand the system just to host some cool applications. Obviously\
    \ a full-blown X–Windows GUI is out of the question, but running a console-based\
    \ program should be within our reach.\n\nRather than doing a typical \"hello world\"\
    \ program as an example, application hosting will be demonstrated using a console-based\
    \ audio player called mp3blaster. Building mp3blaster offers much more technical\
    \ challenge than \"hello world\" and the finished product would be a lot more.\
    \ However, it should not be construed that a console-based jukebox is the only\
    \ application for Pocket Linux. On the contrary, after completing this phase the\
    \ reader will have the knowledge and tools to build any-based program he or she\
    \ desires.\n\nSo what will it take to turn a pocket-sized GNU/Linux system into\
    \ a pocket-sized mp3 player? A few things are listed below.\n\n- Add support for\
    \ audio hardware.\n- Create space for the mp3blaster program.\n- Provide a convenient\
    \ way to access audio files.\n\n## A.2. Design\n\n### A.2.1. Support for audio\
    \ hardware\n\nThere is a vast proliferation of audio hardware on the market and\
    \ each sound card has its particular configuration. For details on how to set\
    \ up a particular sound card we can turn to the Sound–HOWTO available from The\
    \ Linux Documentation Project. In a broader sense, however, we can turn a sound\
    \ card like any other piece of hardware. To add new hardware to a GNU/Linux system\
    \ we will need to configure the kernel to recognize it and /dev files on the root\
    \ disk to access it.\n\n#### A.2.1.1. Kernel support for audio\n\nIn order to\
    \ support sound, a new kernel will have to be built. It is very important that\
    \ audio support is configured as built-in, because Pocket Linux is not set up\
    \ to handle kernel modules.\n\n#### A.2.1.2. Root disk support for audio\n\nSearching\
    \ devices.txt for the keyword \"sound\" will list quite a few possible audio devices,\
    \ but usually only /dev/dsp and /dev/mixer are required to get sound from a PC.\
    \ These two files control the digital audio output and mixer controls, respectively.\n\
    \n### A.2.2. Creating space for the program\n\nThe easiest way to create more\
    \ space for the mp3blaster program is to put an additional storage device. There\
    \ are several choices for mount points. So far /usr, /home and /opt are all directories\
    \ and any of them could be used to mount a floppy, CD-ROM or additional ramdisk\
    \ image. The /usr directory is a logical choice for a place to put an application,\
    \ but what about the choice of media? Mp3blaster and its required libraries are\
    \ too big to fit on a 1.44M floppy and a CD-ROM seems like a lot of work for one\
    \ little program. Given these constraints, the best choice would be to put the\
    \ program on a compressed floppy.\n\n#### A.2.2.1. Mounting additional compressed\
    \ floppies\n\nMounting CDs and uncompressed diskettes is easy, but what about\
    \ loading compressed images into ramdisk? It will have to be done manually, unless\
    \ automatic mounting of compressed floppies only works for the root disk. Since\
    \ there is no filesystem on the disk, there are only the contents of a gzip file.\
    \ The actual filesystem is inside the gzip file. How can we mount the ramdisk\
    \ buried the gzip file? This puzzle can be solved by examining the steps used\
    \ to create the familiar compressed root disk floppy.\n\n1. A ramdisk is created,\
    \ mounted and filled with files.\n2. The ramdisk device is unmounted.\n3. The\
    \ contents of the ramdisk are dumped to an image file using dd.\n4. The image\
    \ is compressed with gzip.\n5. The compressed image file is written to floppy\
    \ with dd.\n\nIf that is the compressed image makes its way from ramdisk to compressed\
    \ floppy, then going from compressed floppy to ramdisk should be as simple as\
    \ running through the steps in reverse:\n\n1. The compressed image file is read\
    \ from floppy with dd.\n2. The image is uncompressed with gzip.\n3. The contents\
    \ of the image file are dumped into ramdisk using dd.\n4. The ramdisk is mounted.\n\
    5. The files are available.\n\nWe can cut the intermediate image file by using\
    \ a pipe to combine dd and gzip: dd if=/dev/fd0 | gzip -cq > /dev/ram1. Now the\
    \ compressed floppy goes straight into ramdisk, decompressing on the fly.\n\n\
    #### A.2.2.2. Root support for additional ramdisks\n\nWe already have kernel support\
    \ for ramdisks, because we are using a compressed root disk, but we need to create\
    \ more ramdisks in /dev. Typically the kernel supports eight ramdisks on /dev/ram0\
    \ through /dev/ram7 with ram0 being used for the rootdisk. The devices.txt file\
    \ included in the Linux source documentation.\n\n### A.2.3. Accessing audio files\n\
    \n#### A.2.3.1. CD-ROM hardware support\n\nMost CD-ROM drives use IDE devices\
    \ /dev/hdd. To support these CD-ROM drives we will have to include support in\
    \ the kernel and create the device files.\n\n#### A.2.3.2. CD-ROM filesystem support\n\
    \nMost CD-ROMs have different filesystems than hard disks and floppies. To support\
    \ these CD-ROMs we will have to include support in the kernel.\n\n### A.2.4. Other\
    \ required files\n\nBecause mp3blaster uses the curses (or ncurses) control library\
    \ there is one additional file we need. The curses library to know the characteristics\
    \ of the terminal it is controlling and it gets information from the terminfo\
    \ database. The terminfo database consists of all the files that use /usr/share/terminfo\
    \ directory and is very large compared to our available disk space. But, since\
    \ Linux only supports the PC console, we only have one terminal type to worry\
    \ about and therefore need only one file. \n\n### A.2.5. Summary of tasks\n\n\
    Between sound cards, ramdisk, CD-ROMs and terminfo there is quite a lot to keep\
    \ track of. So let's take a moment to organize and summarize the tasks necessary\
    \ to make the pocket jukebox viable.\n\n- Create a new kernel that includes built-in\
    \ support for audio hardware, IDE devices and CD-ROM filesystems.\n- Create the\
    \ appropriate /dev files on the root disk to support audio hardware, additional\
    \ ramdisks and IDE CD-ROMs.\n- Install the gunzip utility to enable decompression\
    \ of the usr image.\n- Create a startup script to load a compressed image into\
    \ a ramdisk and mount the /usr.\n- Create a compressed floppy that holds the mp3blaster\
    \ program, its required libraries and terminfo files.\n\n# A.3. Construction\n"
