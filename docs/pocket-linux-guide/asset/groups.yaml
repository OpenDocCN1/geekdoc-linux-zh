    ## Chapter 4. Some Basic Utilities


    ## 4.1. Analysis


    In the previous chapter it might seem we did not accomplish very much. A lot of
    energy was expended redesigning the root disk, but the functionality is basically
    the same as in the initial prototype phase. The root disk does not very much.
    But we did make significant improvements when it comes to space savings. In this
    chapter we will put that extra space to use and start the root disk with as many
    utilities as it can hold.


    The two root disks we built only had shell built–in commands like **echo** and
    **pwd**. This time it would be nice to have some of the commonly used external
    commands like **cat**, **ls**, **mkdir**, **rm** and so on the root disk. Keeping
    this in mind we can define the goals for this phase as follows:


    - Retain all of the functionality from the previous root disk.

    - Add some of the commonly used external commands.


    ## 4.2. Design


    ### 4.2.1. Determining Required Commands


    The first question that might come to mind is, "How do we know which commands
    are needed?" It is possible to start with cat and then install other commands
    as we discover a need for them. This is terribly inefficient. We need a plan or
    a blueprint for work. From this we can turn to the Filesystem Hierarchy Standard
    (FHS) available at http://www.pathname.com/hs/; The FHS dictates what commands
    should be present on a Linux system and where they should be placed in the directory
    structure.


    ## 4.2.2. Locating Source Code


    The next question is, "Now that we know what we need, where do we get the source
    code?" One way to find the answer to this question is to check the packages. We
    can search the packages included with one of the GNU Linux distributions or use
    one of the package engines listed at http://www.linux.org/docs/html#man. One that
    should tip you off as where to find the source code for a particular command is
    the email address listed for reporting bugs. The cat manager lists bug-textutils@gnu.org.
    From this email address we can deduce that cat is part of the textutils package
    from GNU.


    ### 4.2.3. Leveraging FHS


    So let''s look at the FHS requirements for the /bin directory. The first commands
    in the list are **cat**, **chgrp**, **chmod** and **chown**. We already know that
    cat is part of GNU''s. Using the next commands as keywords in a package search
    we discover that GNU''s fileutils for chmod, chgrp and chown are in fact. In fact
    a few of the commands in /bin come from GNU''s utils. The **date** also comes
    from a GNU package called-utils. A good way to tackle the problem of finding source
    code might be to group the commands together as shown below:


    - The BASH shell --- echo, false, pwd, sh, true

    - GNU textutils --- cat

    - GNU fileutils -- chgrp, chown, cp, dd, df, ls, mkdir, mknod, mv, rm, rmdir,
    sync

    - GNU sh-utils -- date, hostname, stty, su, uname


    These four packages do not contain all the commands in the /bin directory, but
    they represent over 70% of them. That should be enough to achieve our goal of
    adding some of the commonly used external commands. We can worry about the other
    commands in later phases of the project.


    ## 4.2.4. Downloading Source Code


    To fetch the source code we simply need to connect to GNU''s FTP site and navigate
    to the appropriate package directory.


    When we get to download for textutils there are several versions available. There
    is also a note informing that the package has been renamed to coreutils. The same
    message about coreutils appears in the and sh-utils directories as well. Instead
    of downloading three separate packages we can get everything in one convenient
    bundle in the coreutils directory.


    ## 4.3. Construction


    Rather than copying files directly to the ramdisk, we can make things easier by
    setting up a staging area. The staging area will give us room to work without
    worrying about the space constraints of the ramdisk. This also provide a way to
    save our work and make it easier to enhance the rootdisk in later phases of the
    project.


    The staging procedure will work like this:


    1. Create a directory structure as defined in the FHS.

    2. Copy the files from phase 2''s root disk.

    3. Build the new package from source code.

    4. Install files into the correct FHS directories.

    5. Strip the binaries to save space.

    6. Check library dependencies.

    7. Copy to the whole directory structure to the ramdisk.

    8. Compress the ramdisk and write it out to floppy.


    ### 4.3.1. Create a staging area


    ```bash

    bash mkdir ~/staging

    bash cd ~/staging

    bash mkdir bin boot dev etc home mnt opt proc root sbin usr var

    bash mkdir var/log/run

    ```


    ### 4.3.2. Copy contents of phase 2 rootdisk


    ```bash

    bash dd if=/phase2-image.gz | gunzip -c > /dev/ram7

    bash mount /dev/ram7 /mnt

    bash cp -dPR /mnt/* ~/staging

    bash umount /dev/ram7

    bash rmdir ~/staging/lost+found

    ```


    ### 4.3.3. Install binaries from GNU coreutils


    ```bash

    # cd /usr/src/coreutils-5.2.1

    bash# export CC="gcc -mcpu=i386"

    bash# ./configure --host=i386-pc-linux-gnu

    bash# make

    bash# cd src

    bash# cp chgrp chmod cp cp date df ~/staging/bin

    bash# cp hostname ln ld mkdir mkifno mkn ~/staging/bin

    bash# cp mv rmdir stty sync uname ~/staging/bin

    ```


    ### 4.3.4. Copy additional libraries


    Check library requirements using ldd on some of the new binaries.


    ```bash

    # ldd ~/staging/bin/cat

    bash# ldd ~/staging/bin/ls

    bash# ldd ~/staging/bin/su

    bash# ldd ~/staging/lib

    ```


    The differences in the required, as shown by the ldd command, and the libraries
    present in the staging area, as shown by the ls command, then copy any missing
    libraries to the staging area.


    ```bash

    # cp /lib/librt.so.1 ~/staging/lib

    bash# cp /lib/libthread.so.0 ~/staging/lib

    bash# cp /lib/libcrypt.so.1 ~/staging/lib

    ```


    ### 4.3.5. Strip binaries and libraries


    ```bash

    # strip ~/staging/bin/*

    bash# strip --strip-unneeded ~/staging/lib/*

    ```


    ### 4.3.6. Create a compressed root disk image


    ```bash

    # cd /

    nbash# dd if=/dev/zero of=/dev/ram7 bs=1k=4096

    bash# mk2fs -m0 /dev/ram7 4096

    bash# mount /dev/ram7 /mnt

    bash# cp -dpr ~/staging/* /mnt

    bash# umount /dev/ram7

    bash# dd if=/dev/ram7 of=/phase3-image bs=1k=4096

    bash# gzip -9 ~/phase3-image

    ```


    > The process for creating the compressed root disk image will change very little
    throughout the chapters. Writing a simple script to handle this can be a great
    time saver.


    ### 4.3.7. Write the root disk image to floppy


    Insert the diskette labeled "root" into drive fd0.


    ```bash

    # dd if=/phase3-image.gz of=/dev/fd0 bs=1k

    ```

