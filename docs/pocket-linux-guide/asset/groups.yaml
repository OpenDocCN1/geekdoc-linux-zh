    ## 第 5 章 检查与挂载磁盘


    ## 5.1. 分析


    在上一章中，我们通过安装 coreutils 添加了许多新命令，但仍然缺少一些内容。其中一个非常突出的问题是没有挂载磁盘的方法。为了获得读写文件系统，我们不得不在
    `grub>` 提示符处传递 `rw` 内核参数。这是为了紧急情况，但正常的系统启动过程应该有所不同。


    大多数 GNU/Linux 发行版通过几个步骤来挂载文件系统。观察启动过程或研究流行的 Linux 发行版的启动脚本，可以发现以下事件序列：


    - 1. 内核自动将根文件系统挂载为只读。

    - 2. 对所有本地文件系统进行检查。

    - 3. 如果文件系统正常，则将根重新挂载为读写。

    - 4. 挂载其余本地文件系统。

    - 5. 挂载网络文件系统。


    到目前为止，我们的 Linux 系统只能完成第一步，仅此而已。如果我们想有一个看起来专业的启动 /root 磁盘集，我们必须做得比五分之一更好。在项目的这个阶段，我们将处理第二和第三步。第四步和第五步可以等。由于这是一个基于磁盘的系统，除了根目录外没有其他文件系统。


    考虑到以上所有信息，本阶段的目标定义如下：


    - 检查文件系统完整性的方法。

    - 挂载文件系统的能力。

    - 用于自动检查和挂载本地文件系统的脚本。


    ## 5.2. 确定必要的工具。


    ### 5.2.1. 寻找源代码


    我们可以使用文件系统层次结构标准 (FHS) 文档来寻找需要的工具名称以及它们在目录结构中的位置。FHS 的 `/sbin` 目录列出了用于检查文件系统的
    `fsck` 和名为 `fsk.` 的工具。由于我们使用二级扩展 (ext2) 文件系统，对于我们的目的，`fsk.` 变成了 `fsck2`。挂载文件系统使用
    `/bin` 目录下的 `mount` 和 `umount` 命令完成。然而，找不到自动挂载本地文件系统的脚本名称。在大多数系统中，此类类型的脚本位于 `/etc`
    目录，但 FHS 没有列出它。几个 GNU/Linux 发行版使用 `/etc/init.d` 作为存放启动脚本的地方，我们将文件系统挂载脚本放在那里。


    在上一章中，我们使用了寻找源代码的方法。在这一章中，我们将使用 Linux 软件地图 (LSM)。LSM 是 GNU/Linux 软件数据库，跟踪包名、作者、组成包的二进制文件以及下载站点等信息。使用
    LSM 搜索引擎，我们可以以 Linux 命令为关键词定位软件包。


    如果在 http://www.ibiblio.org/pub/Linux/ 搜索 Ibiblio Linux Software Map (LSM) 关键词
    "fck"，我们得到了大量的匹配项。由于我们使用二级扩展文件系统（简称为 e2fs），可以使用 "ext2" 作为关键词细化搜索。将两个关键词都提交给 LSM
    搜索引擎会得到一个名为 e2sprogs 的包。查看 e2fsprogs 的 LSM，我们发现该包包含了 e2fs、mke2fs、mke2dumpe、fsck
    工具。我们还发现 e2fsprogs 的 LSM 已经一段时间没有使用了。那里肯定有一个更新的版本。另一个用于源代码的良好的网络资源是 http://sourceforge.net/  SourceForge。在
    SourceForge 搜索引擎中使用关键词 "e2fsprogs" 可以得到更新版本的 e2fsprogs。


    寻找 fsck 是一次冒险，但现在我们转向寻找 mount 和 unmount。在 LSM 上搜索会出现许多匹配项，但都指向一个名为 util-linux
    包的不同版本。我们做的只是搜索并选择最新版本。util-linux 的 LSM 条目列出了 mount 和 unmount 之外的许多工具。我们应该确实搜索该列表，看看是否有任何其他
    util-linux 命令出现在 FHS 对 /bin 和 /sbin 的要求中。


    以下是我们目前收集的软件包列表以及符合 FHS 的工具。


    | 软件包 | 工具 |

    | :--- | :--- |

    | e2sprogs | fsck, mkfs.ext2 (e2fsck), mkfs.ext2 (mke2fs) |

    | util-linux | dmesg, getty (agate), kill, mount, swap, unmount |


    ### 5.2.3. 自动化 fsck 和 mount


    现在我们有了 fsck 和 mount 命令，我们需要用一个 shell 脚本来自动检查和挂载文件系统。任何实现此方法都是编写一个调用 fsck 和 mount
    的短行脚本。但是，如果文件系统不是正常的怎么办？系统绝对不应该尝试挂载损坏的文件系统。我们需要决定一种在挂载之前确定文件系统状态的方法。fsck 的映射对如何使用返回码实现这一点提供了一些见解。基本上，如果
    fsck 返回代码零或一，则意味着文件系统是良好的，返回代码二或更大意味着需要某些手动干预。一个简单的 if-then 语句可以评估 fsck 返回码以决定是否应该挂载文件系统。关于编写脚本的帮助，我们可以使用
    BASH-guide。


    ### 5.2.4. 文件依赖


    唯一要做的就是创建设备文件。我们需要 /dev/ram0，因为根文件系统位于那里。我们还需要 /dev/fd0 来挂载其他磁盘，以及 /dev/null 供某些命令使用。


