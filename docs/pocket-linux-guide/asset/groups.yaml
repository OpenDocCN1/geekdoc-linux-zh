    # A.2.2.1. Mounting additional compressed floppies


    Mounting CDs and uncompressed diskettes is easy, but what about loading compressed
    images into ramdisk? It will have to be done manually, unless automatic mounting
    of compressed floppies only works for the root disk. Since there no filesystem
    on the disk, there are only the contents of a gzip file. The actual filesystem
    is inside the gzip file. How can we mount the ramdisk buried the gzip file? This
    puzzle can be solved by examining the steps used to create the familiar compressed
    root disk floppy.


    +   1. A ramdisk is created, mounted and filled with files.

    2. The ramdisk device is unmounted.

    3. The contents of the ramdisk are dumped to an image file using dd.

    4. The image is compressed with gzip.

    5. The compressed image file is written to floppy with dd.


    If that is the compressed image makes its way from ramdisk to compressed floppy,
    then going from compressed floppy to ramdisk should be as simple as running through
    the steps in reverse


    +   1. The compressed image file is read from floppy with dd.

    2. The image is uncompressed with gzip.

    3. The contents of the image file are dumped into ramdisk using dd.

    4. The ramdisk is mounted.

    5. The files are available.


    We can cut the intermediate image file by using a pipe to combine dd and gzip:
    dd if=/dev/fd0 | gzip -cq > /dev/ram1. Now the compressed floppy goes straight
    into ramdisk, decompressing on the fly.


    # A.2.2.2. Root support for additional ramdisks


    We already have kernel support for ramdisks, because we are using a compressed
    root disk, but we need to create more ramdisks in /dev. Typically the kernel supports
    eight ramdisks on /dev/ram0 through /dev/ram7 with ram0 being used for the rootdisk.
    The devices.txt file included in the Linux source documentation will be helpful
    for matching devices to major and minor numbers.


    # A.2.3. Accessing audio files


    The sample file that we will be using in our example is small enough to fit on
    an uncompressed floppy disk so there is no need to burn a CD. However, serious
    music lovers may want the capability to mount a CD-ROM full of tunes and that
    will require support for additional hardware.


    Appendix A. Hosting Applications'
  - '[PAGE 55]


    # A.2.3.1. CD-ROM hardware support


    Most modern CD-ROM drives will use IDE devices /dev/hdc or /dev/hdd. To support
    these CD-ROM drives we will have to configure IDE support in the kernel and create
    the appropriate device files on the root disk.


    # A.2.3.2. CD-ROM filesystem support


    CD-ROMs have different filesystems than hard disks and floppies. Most CD burning
    applications use a filesystem ISO-9660 and have the capability to support Joliet
    or Ridgecliff extensions. We will have to include support for these filesystems
    in the kernel in order to mount CD-ROMs.


    # A.2.4. Other required files


    We will want to have all mp3blaster''s libraries and other supporting files available
    as part of the compressed /usr image so that mp3blaster can run correctly. The
    familiar ldd command can determine which mp3blaster may require. Any additional
    libraries can be placed in /usr/lib. Even though some of the libraries may appear
    in /lib on the development system, they can still go in /usr/lib on the Pocket
    Linux system. The dynamic linker, lld-linux.so, is smart enough to look in both
    places when loading libraries.


    Because mp3blaster uses the curses (or ncurses) control library there is one additional
    file we need. The curses library to know the characteristics of the terminal it
    is controlling and it gets information from the terminfo database. The terminfo
    database consists of all the files that use /usr/share/terminfo directory and
    is very large compared to our available disk space. But, since Linux only supports
    the PC console, we only have one terminal type to worry about and therefore need
    only one file. The piece of the terminfo database we need is the file /usr/share/terminfo/1/linux,
    because we are using a "Linux" terminal. For more information about the subject
    of curses, see John Strang''s book "Programming with Curses" available from O''Reilly
    publishing


    # A.2.5. Summary of tasks


    Between sound cards, ramdis, CD-ROMs and terminfo there is quite a lot to keep
    track of. So let''s take a moment to organize and summarize the tasks necessary
    to make the pocket jukebox viable.


    +   * Create a new kernel that includes built-in support for audio hardware, IDE
    devices and CD-ROM filesystems.

    * Create the appropriate /dev files on the root disk to support audio hardware,
    additional ramdisks and IDE CD-ROMs.

    * Install the gunzip utility to enable decompression of the usr image.

    * Create a startup script to load a compressed image into a ramdisk and mount
    the /usr.

    * Create a compressed floppy that holds the mp3blaster program, its required libraries
    and terminfo files.


