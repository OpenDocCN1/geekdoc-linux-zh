    \ 0\ntimeout 3\ntitle Pocket Linux Boot Disk\nkernel (fd0)/vmlinuz root=/dev/fd0\
    \ load_ramdisk=1 prompt_ramdisk=1\n```\n\n### 6.3.2. 安装 sysinit 工具\n\n从 http://ftp.cisron.in/pub/people/miquels/software/\
