    ## 第 4 章：基础实用工具


    ## 4.1. 分析


    在上一章节中，似乎我们并没有完成多少工作。我们花费了大量的精力重新设计根磁盘，但其功能基本上与初始原型阶段相同。根磁盘并没有发挥太大作用。但在节省空间方面，我们确实取得了重大的改进。在本章中，我们将利用这些额外空间，并尽可能地容纳尽可能多的实用工具来启动根磁盘。


    我们构建的两个根磁盘只内置了如 **echo** 和 **pwd** 这样的 shell 内置命令。这次，如果能在根磁盘中包含一些常用的外部命令，如 **cat**、**ls**、**mkdir**、**rm**
    等，将是太棒了。考虑到这一点，我们可以将此阶段的目标定义如下：


    - 留留上一个根磁盘的所有功能。

    - 增加一些通用的外部命令。


    ## 4.2. 设计


    ### 4.2.1. 确定所需的命令


    脑海中出现的第一个问题可能是：“我们如何知道需要哪些命令？”也许从 cat 开始，然后在发现需要其他命令时再进行安装。这是非常低效的。我们需要一个工作计划或蓝图。为此，我们可以参考位于
    http://www.pathname.com/hs/ 的文件系统层次结构标准 (FHS)。FHS 规定了 Linux 系统应该包含哪些命令，以及它们应该放置在目录结构的什么位置。


    ## 4.2.2. 定位源代码


    下一个问题是：“既然我们知道需要什么，去哪里获取源代码？”找到答案的方法之一是检查软件包。我们可以搜索某个 GNU Linux 发行版包含的软件包，或者使用
    http://www.linux.org/docs/html#man 列出的包管理器之一。列出的报告 bug 的邮箱地址可以提示你从哪里找到特定命令的源代码。cat
    管理器列出的邮箱是 bug-textutils@gnu.org。通过这个邮箱地址，我们可以断出 cat 是 GNU textutils 软件包的一部分。


    ### 4.2.3. 利用 FHS


    让我们看看 FHS 对 /bin 目录的 own。列表中的前几个命令是 **cat**、**chgrp**、**chmod** 和 **chown**。我们已经知道
    cat 是 GNU 的一部分。将接下来的命令作为包搜索的关键词，我们发现 GNU 的 chmod、chgrp 和 chown 实际上属于 fileutils。事实上，/bin
    中的几个命令来自 GNU 的 utils。**date** 也来自一个名为-utils 的 GNU 软件包。解决寻找源代码问题的一个好方法是将命令分组，如下所示：


    - BASH 壳 --- echo, false, pwd, sh, true

    - GNU textutils --- cat

    - GNU fileutils -- chgrp, chown, cp, dd, df, ls, mkdir, mknod, mv, rm, rmdir,
    sync

    - GNU sh-utils -- date, hostname, stty, su, uname


    这四个软件包并不完全包含 /bin 目录中的所有命令，但它们代表了其中的 70% 以上。这应该足够实现我们添加一些常用外部命令的目标了。我们可以在项目的后期阶段考虑其他命令。


    ## 4.2.4. 下载源代码


    为了获取源代码，我们只需要连接到 GNU 的 FTP 站点并导航到相应的软件包目录。


    当我们到达 textutils 下载时，有几个版本可用。还有一条注释提示该软件包已重命名为 coreutils。关于 coreutils 的相同信息也出现在
    text 和 sh-utils 目录中。我们不需要下载三个独立的软件包，可以在 coreutils 目录中通过一个方便的组合包获取所有内容。


    ## 4.3. 构建


    与其直接将文件复制到 ramdisk，不如通过设置一个暂存区（staging area）让工作变得更简单。暂存区将为我们提供空间，使我们无需担心 ramdisk
    的限制。


    暂存区的流程如下：


    1. 按照 FHS 创建目录结构。

    2. 将阶段 2 的内容拷贝到根磁盘。

    3. 从源码构建二进制文件。

    4. 将文件安装到正确的 FHS 目录。

    5. 压缩二进制文件以节省空间。

    6. 检查库依赖。

    7. 将根磁盘写入 ramdisk。

    8. 压缩根磁盘并写入软盘。


    ### 4.3.1. 创建暂存区


    ```bash

    # mkdir ~/staging

    # cd ~/staging

    ```


    ### 4.3.2. 拷贝阶段 2 的内容


    ```bash

    # dd if=/phase2-image.gz | gunzip -c > /dev/ram7

    # mount /dev/ram7 /mnt

    # cp /mnt

    ```


    ### 4.3.3. 从 GNU 安装二进制文件


    ```bash

    # cd /usr/src/coreutils-5.2.1

    # export CC="gcc -mcpu=i86"

    # ./configure --host=i386-linux-gnu

    # make

    # cd ..

    # cp date ~/staging/bin

    ```


    ### 4.3.4. 拷贝额外的库


    使用 ldd 对一些新二进制文件检查库需求。


    ```bash

    # ldd ~/staging/bin/cat

    # ldd ~/staging/bin/ls

    # ldd ~/staging/bin/su

    # ldd ~/staging/lib

    ```


    根据 ldd 命令显示的库与 ls 命令显示的暂存区中库之间的差异，将缺失的库拷贝到暂存区。


    ```bash

    # cp /lib/librt.so.1 ~/staging/lib

    # cp /lib/libthread.so.0 ~/staging/lib

    # cp /lib/libcrypt.so.1 ~/staging/lib

    ```


    ### 4.3.5. 压缩二进制文件和库


    ```bash

    # strip ~/staging/bin/*

    # strip --strip-unneeded ~/staging/lib/*

    ```


    ### 4.3.6. 创建压缩的根磁盘镜像


    ```bash

    # cd /

    # dd if=/dev/zero of=/dev/ram7 bs=1k=4096

    # mk2fs -m0 /dev/ram7 4096

    # mount /dev/ram7 /mnt

    # cp -dpr ~/staging/* /mnt

    # umount /dev/ram7

    # dd if=/dev/ram7 of=/phase3-image bs=1k=4096

    # gzip -9 ~/phase3-image

    ```


    > 创建压缩根镜像的过程在整个章节中变化很小。编写一个简单的脚本来处理它可以节省大量时间。


    ### 4.3.7. 将根磁盘镜像写入软盘


    将标记为 "root" 的软盘插入驱动器 fd0。


    ```bash

    # dd if=/phase3-image.gz of=/dev/fd0 bs=1k

    ```


