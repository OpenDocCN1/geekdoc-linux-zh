    Finally, we can tackle the problem of how to build a compressed root filesystem.
    The Bootdisk-HOWTO suggests three ways of constructing a compressed filesystem
    using either a ramdisk, a hard drive partition or a loopback device. This project
    will concentrate on using the ramdisk approach. It seems logical'
