    \ $(cat /etc/hostname)\nelse\nhostname gnu-linux\nfi\n#\n# end of hostname\n```\n\
    \n### 6.3.7. Create halt & reboot scripts\n\nUse a text editor to create ~/staging/etc/init.d/halt\
    \ as shown below.\n\n```bash\n#!/bin/sh\n#\nhalt - halt the system\n#\nPATH=/sbin:/bin;\
    \ export PATH\necho \"Initiating system halt.\"\nhalt\n#\n# end of /init.d/halt\n\
    ```\n\nCreate the following script and save it as ~/staging/etc/init.d/reboot\n\
    \n```bash\n#!/bin/sh\n#\n# reboot the system\n#\nPATH=/sbin:/bin; export PATH\n\
    \necho \"Initiating system reboot.\"\nreboot\n#\n# end of /init.d/reboot\n```\n\
    \nFlag all script files as executable.\n\n```bash\nchmod +x ~/staging/etc/init.d/*\n\
    ```\n\n### 6.3.8. Create rc directories and links\n\n```bash\ncd /staging/etc\n\
    mkdir rc0.d rc1.d rc2.d rc3.d rc4.d rc5.d rc6.d\ncd rc5.d\nln -s ../init.d/local_fs\n\
    ln -s ../init.d/hostname\ncd ../rc0.d\nln -s ../init.d/local_fs\nln -s ../init.d/halt\n\
    cd ../rc6.d\nln -s ../init.d/local_fs\nln -s ../init.d/reboot\n```\n\n### 6.3.9.\
    \ Create the root disk image\n\n```bash\ncd\ndd if=/dev/zero of=/ramdisk bs=1k\
    \ count=4096\nmkfs -m /ramdisk\nmount /ramdisk /mnt\ncp -dr /staging/* /mnt\n\
    umount /mnt\ngzip -9 ~/phase5-image\n```\n\n### 6.3.10. Copy the image to the\
    \ diskette\n\nInsert the diskette labeled \"root disk\" into drive fd0.\n\n```bash\n\
    dd if=~/phase5-image.gz of=/fd0 bs=1k\n```\n\n## 6.4. Implementation\n\n### 6.4.1.\
    \ System Startup\n\nBoot the PC using the floppy labeled \"boot disk\". Place\
    \ the recently created root disk in fd0 when prompted. The output should resemble\
    \ the example:\n\n```\nGNU GRUB version 0.95\nUncompressing Linux... Ok, booting\
    \ kernel.\n[Various kernel messages]\nVFS: Insert root floppy to be loaded into\
    \ RAM disk and press ENTER\nRAMDISK: Compressed image found at block 0\nVFS: Mounted\
    \ root (ext2 filesystem) readonly.\nFreeed kernel (memory): 178k freed\nChecking\
    \ local filesystem integrity;\n/dev/mem: clean 105/1024 files 284/4096 blocks\n\
    Remounting as read-write.\nMounting local filesystems.\nSetting the hostname.\n\
    INIT: Entering runlevel: 1\n```\n\n### 6.4.2. Verify success of startup scripts\n\
    \nUse the `mount` command to check that local filesystems are mounted as read-write.\
    \ The output should look like the example below.\n\n```bash\nmount\n/dev/root\
    \ on / type ext2 (rw)\nproc on /proc type proc (rw)\nCheck the hostname.\nuname\
    \ -n\ngnu-linux\n```\n\n### 6.4.3. System shutdown\n\nBring the system down gracefully\
    \ with the `shutdown` command.\n\n```bash\nshutdown -h now\n```\n\nWe will see\
    \ the following output from `init` and the shutdown scripts:\n\n```\nINIT: Switching\
    \ to runlevel: 0\nINIT: Sending processes the TERM signal\nTerminated\nINIT: Sending\
    \ processes the KILL signal\nUnmounting local filesystems.\nInitiating system\
    \ halt.\nSystem halted.\n```\n\n## Chapter 7. Enabling Multiple Users\n\n### 7.1.\
    \ Analysis\n\nUp to now the system has been operating in single–user mode. There\
    \ is no login process and anyone who boots the system gets into a shell with root\
    \ privileges. Obviously, this is not the normal operating mode for GNU/Linux distributions.\
    \ Most systems feature multi-user capability where many users can access the system\
    \ simultaneously with different privilege levels. multi-user systems also support\
    \ virtual consoles so the keyboard and video display can be multiplexed between\
    \ several terminal sessions. So in this phase we would like to add the following\
    \ enhancements to the system:\n\n- Enable multi-user capability.\n- Create multiple,\
    \ virtual consoles.\n\n### 7.2. Design\n\n### 7.2.1. The login process\n\nThe\
    \ From–PowerUp–To–BASH–Prompt–HOWTO does a good job of outlining the steps in\
    \ the login process. Basically it works like this:\n\n1. The init daemon starts\
    \ a getty process on the terminal.\n2. The getty process displays the contents\
    \ of /etc/issue and prompts for a user name.\n3. When the user name is entered,\
    \ control is handed off to the login process.\n4. The login program asks for a\
    \ password and verifies the credentials using /etc/passwd, /etc/group and possibly\
    \ /etc/shadow.\n5. If everything is okay the user’s shell is started.\n\n### 7.2.2.\
    \ Obtaining source code\n\nThe getty and login programs were already installed\
    \ as part of the util–linux package so there is no need to download any new source\
    \ code.\n\n### 7.2.3. Creating support files\n\n#### 7.2.3.1. Device nodes\n\n\
    Details about virtual console device files can be found in the Linux kernel source\
    \ code file devices.txt in the Documentation directory. We will need to create\
    \ tty through t6 for each of the virtual consoles as well as tty0 and tty to represent\
    \ the current virtual console.\n\n#### 7.2.3.2. /etc/issue\n\nThe /etc/issue file\
    \ is pretty easy to construct. It can contain any text we want displayed on the\
    \ screen prior to the login prompt. It could be something like \"Welcome to Pocket\
    \ Linux\", something menacing like \"Authorized users only!\" or informational\
    \ like \"Connected to tty at 9600bps\". getty(8) manpage explains how to display\
    \ information like tty line and baud rate using escape codes.\n"
