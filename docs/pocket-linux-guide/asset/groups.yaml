    # # Chapter 6. Automating Startup & Shutdown


    # ## 6.1. Analysis


    The root disk from the last chapter is looking pretty good. It has about seventy
    percent of the commands that the Filesystem Hierarchy Standard (FHS) document
    requires for the root filesystem. It plus commands for checking and monitoring
    filesystems. But even with all of this root disk is far from perfect. The list
    below outlines three things that could use improvement if the Pocket Linux system
    is to stand next to the more professional looking distributions.


    +   - The system currently requires the kernel parameters to be typed at the `grub>`
    prompt in order to start properly. On any other GNU/linux system this is only
    done in an emergency situation when the system is corrupted.

    - Checking and mounting the root filesystem has to be done manually by running
    a script at shell prompt. Most modern operating systems this is handled automatically
    as part of the system start-up process.

    - Using `CTRL-ALT-DELETE` for shutdown is not very graceful. Filesystems should
    be unmounted and cached information should be flushed prior to shutdown. Again,
    this is something most operating systems handle automatically.


    Taking the above list into consideration, the goals for this phase are defined
    as follows:


    +   - Leads without manual intervention.

    - Automated system start-up sequence.

    - Graceful shutdown capability.


    # ## 6.2. Design


    # ### 6.2.1. Determining necessary utilities


    Loading the kernel without manually typing parameters is easy to do if we read
    the root info page. According to the section "configuration" of all the commands
    for booting can be put in a file `menu.lst` and placed in the `/boot/grub` directory.


    > Be sure to type the menu.lst filename correctly with a lowercase L after the
    dot and not a number one. To automate system start-up we will need an init daemon.
    We know this because the Bootdisk-HOWTO and From-Power-To-BASH-Prompt-HOWTO both
    make of init as the first program to start after the kernel loads. The latter
    HOWTO also goes into detail about the /etc/inittab file and the organization of
    startup scripts. This could be helpful for FHS, the blueprint we have used so
    far, makes no recommendation for init scripts.


    We will also need to perform the shutdown command to fulfill the goal of graceful
    shutdown capability.


    # ## 6.2.2. Obtaining source code


    Searching the Linux Software Map for Ibhib for the keyword "init" gives a large
    number of results. From reading the From-Power-To-BASH-Prompt-HOWTO however, we
    know that most Linux systems use a'
  - '[PAGE 34]


    # Pocket Linux Guide


    System V style init daemon. Narrowing the search with the additional key phrase
    of "System V" gives much better results. The sysvinit contains init, shutdown,
    halt and reboot which is everything we need. The version listed by the LSM entry
    looks to be pretty old, but there is a primary-site URL that will probably lead
    to the latest version.


    # 6.2.3. Checking dependencies


    The manage for init mentions a FIFO called /dev/initctl that is required for init
    to communicate with other programs in the sysvinit package. We will need to create
    this for init to function properly.


    # 6.2.4. Designing a simple GRUB configuration file.


    Using a GRUB configuration file is slightly more complex than specifying the bootloader
    commands manually. There are directives for like menu, defaults and timeouts that
    need to be specified in the configuration file as well as the familiar kernel
    command. The info page for GRUB gives us much of the necessary information. We
    may also be able to use the GRUB configuration on the development system as a
    template. However, there is some inconsistency between vendors as to the name
    and location of the file. Regardless of what is on the development system it should
    be /boot/grub/menu.list on the Linux System.


    # 6.2.5. Outlining start-up scripts


    Many of the GNU/Linux distributions use System V style init scripts. Since we
    are using a "sysvinit" daemon it makes sense to use System V style scripts as
    well. The following documents all touch upon the System V style init in some ways
    and serve as references when building the scripts for this project:


    +   - The Debian Policy Manual — available online at http://www.debian.org/doc/debian-policy.

    - The Linux Base specification — downloadable in many formats from http://www.linuxbase.org/spec/index.html.

    - Essential System Administration, 3rd Edition by Aeleen Frisch — available at
    libraries, bookstores or or directly from O''Reilly Publishing at http://www.oreilly.com/


    After glancing one or two of the above references we should have a good idea of
    how the System V style initialization process works. We should also know what
    it takes to create System V style scripts for the Pocket Linux project. Below
    is a list of what needs to be:


    +   - Create an inittab file to call an rc script with a numerical argument giving
    the runlevel.

    - Write an rc script that uses the runlevel argument to execute the "K" and "S"
    scripts.

    - Modify the previously built local_fs script to start and stop arguments.

    - Create new scripts for shutdown and reboot.

    - Set up /etc/rc.d directories and links to scripts in /etc/init.d.


    As always, the BASH(1) manage and the Advanced Bash Scripting Guide are very helpful
    for writing and understanding shell scripts.'
