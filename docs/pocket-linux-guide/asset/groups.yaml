    # end of /etc/init.d/rc\n```\n\nMake the file chmod +x ~/staging/etc/init.d/local_fs\n\
    \n### 6.3.5. Modify /etc/init.d/local_fs script\n\nA case statement is added to\
    \ allow the script to mount or unmount local filesystems depending on the command-line\
    \ argument given. The original script is contained inside the \"start\" portion\
    \ of the case statement. The \"stop\" portion is new.\n\n```bash\n#!/bin/sh\n\
    #\n/local_fs - check and mount local filesystems\n#\nPATH=/sbin:/bin; export PATH\n\
    \ncase $1 in\nstart)\necho \"Checking local filesystem integrity.\"\nfsck -ATcp\n\
