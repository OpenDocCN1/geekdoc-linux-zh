    \ 创建 /etc/inittab 文件\n\n使用文本编辑器创建该文件并保存为 ~/staging/etc/inittab\n\n```bash\n# /etc/inittab\
    \ - init 守护进程配置文件\n#\n# 默认运行级别\nid:1:initdefault:\n#\n# 系统初始化\ninit:sysinit:/etc/init.d/rc\
    \ S\n#\n# 运行级别脚本\nr0:0:wait:/etc/init.d/rc 0\nr1:1:respawn:/bin/sh\nr2:2:wait:/etc/init.d/rc\
    \ 2\nr3:3:wait:/etc/init.d/rc 3\nr4:4:wait:/etc/init.d/rc 4\nr5:5:wait:/etc/init.d/rc\
    \ 5\nr6:6:wait:/etc/init.d/rc 6\n#\n# end of /etc/inittab\n```\n\n## 第6章 自动化启动与关机\n\
    \n### 6.3.4. 创建 /etc/init.d/rc 脚本\n\n使用文本编辑器创建以下文件并保存为 ~/staging/etc/init.d/rc\n\
    \n```bash\n#!/bin/sh\n#\n/etc/init.d/rc - 运行级别切换脚本\n#\nPATH=/sbin:/bin\nSCRIPT_DIR=\"\
    /etc/rc1$\"\n\n# 检查 rc.d 目录是否存在。\nif [ -d $SCRIPT_DIR ]; then\n# 先执行 kill 脚本。\n\
    for SCRIPT in $SCRIPT_DIR/K*; do\nif [ -x $SCRIPT ]; then\n $SCRIPT stop\nfi\n\
    done\nfi\n# 最后执行 Start 脚本。\nfor SCRIPT in $SCRIPT_DIR/S*; do\nif [ -x $SCRIPT\
    \ ]; then\n $SCRIPT start\nfi\ndone\n\n# end of /etc/init.d/rc\n```\n\n为文件赋予执行权限\
    \ `chmod +x ~/staging/etc/init.d/local_fs`\n\n### 6.3.5. 修改 /etc/init.d/local_fs\
    \ 脚本\n\n添加了一个 case 语句允许脚本根据提供的命令行参数挂载或卸载本地文件系统。原始脚本包含在 case 语句的“start”部分。“stop”部分是新增的。\n\
    \n```bash\n#!/bin/sh\n#\n/local_fs - 检查并挂载本地文件系统\n#\nPATH=/sbin:/bin; export PATH\n\
    \ncase $1 in\nstart)\necho \"Checking local filesystem integrity.\"\nfsck -ATcp\n\
    if [ $? -gt 1 ]; then\necho \"Filesystem errors still exist! Manual intervention\
    \ required.\"\n/bin/sh\n\necho \"Remounting / as read-write\"\nmount -n -o remount,rw\
    \ /\necho -n > /etc/mtab\nmount -f -o remount,rw /\necho \"Unmounting local filesystems\"\
    \nmount -a -t nonfs,smbfs\nfi\n\nstop)\necho \"Unmounting local filesystems\"\n\
    mount -a -r\nfi\n\n*)\necho \"usage: $0 start|stop\";\nesac\n#\n# end of local_fs\n\
    ```\n\n### 6.3.6. 创建主机名脚本\n\n使用文本编辑器创建以下脚本并保存为 ~/staging/etc/init.d/hostname\n\
    \n```bash\n#!/bin/sh\n# hostname - 将系统名称设置为存储在 /etc/hostname 中的名称\n#\nPATH=/sbin:/bin;\
