    # 第 9 章. 项目总结


    ## 9.1. 庆祝成就


    Pocket Linux 项目即将圆满结束；我们应该花一点时间庆祝我们取得的所有成就。以下列出了一些亮点：


    - 我们仅通过源代码构建了一个系统，该系统完全实现了《文件系统层级标准》（Filesystem Hierarchy Standard）中为根系统描述的所有命令。

    - 我们学习了如何利用互联网资源来定位并下载构建 GNU/Linux 系统所需的源码。

    - 我们编写了基础的系统启动和关机脚本，并配置了它们在正确的运行级别（runlevels）中执行。

    - 我们在虚拟控制台上引入了对多用户的支持，并对系统文件实施了权限管理。

    - 但最重要的是，我们学习了一些良好的设计技术和项目管理技能，这将使我们能够从容自信地应对任何未来的项目。


    ## 9.2. 计划下一步


    Pocket Linux 系统几乎已经满负荷运行，因此确实没有空间来扩展当前的根磁盘以支持任何额外的命令和功能。这为我们留下了几个接下来的方向选择：


    - 找到一种扩展当前系统的方法，使其足以运行一个小型应用程序。（有关如何使用 Pocket Linux 托管应用程序的更多信息，请参见附录 A）

    - 从根磁盘中移除多用户功能和最少使用的命令，用 tar 和 gzip 等工具替换它们，这些工具对于救援/恢复磁盘集非常有用。

    - 使用我们学到的技术设计并构建一个完整的 GNU/Linux 系统，并将其安装在空间更充足的硬盘分区上。（有关构建更大系统的更多信息，请查看 GNU/Linux
    系统架构师工具包：http://architect.sourceforge.net/）


    无论选择哪条路径，只要我们掌握了目标所需的知识，就可以充满信心地迈进。


    # 附录 A. 托管应用程序


    ## A.1. 分析


    操作系统本身并没有什么趣味。让一个操作系统变得伟大的是运行在其之上的应用程序。遗憾的是，Pocket Linux 目前除了系统程序之外，没有多少空间运行其他东西。尽管如此，如果能扩展系统来托管一些酷炫的应用程序将很不错。显而易见，运行完整的
    X–Windows GUI 是可能的，但运行一个基于控制台的程序应该是我们可以触及的。


    我们不会使用典型的“Hello World”程序作为示例，而是将使用一个名为 mp3blaster 的基于控制台的音频播放器来演示应用程序托管。构建 mp3blaster
    比“Hello World”具有更大的技术挑战，而且成品会丰富得多。然而，不应将其理解为基于控制台的点机是 Pocket Linux 的唯一应用程序。相反，在完成这一阶段后，读者将拥有构建任何他或她所需的各种类型程序的知识和工具。


    那么，将一个口袋大小的 GNU/Linux 系统变成口袋大小的 mp3 播放器什么？下面列出了几点：


    - 添加对音频硬件的支持。

    - 为 mp3blaster 程序创建空间。

    - 提供访问音频文件的方便方法。


    ## A.2. 设计


    ### A.2.1. 音频硬件的支持


    市场上存在大量的音频硬件，每块声卡都有特定的配置。关于如何设置特定声卡的详情，我们可以参考 Linux 文档项目提供的 Sound–HOWTO。但从更广泛的意义上说，可以将声卡视为任何其他硬件。要向
    GNU/Linux 系统添加新硬件，我们需要配置内核来识别它，并在根磁盘上配置 /dev 文件来访问它。


    #### A.2.1.1. 内核对音频的支持


    为了支持声音，必须构建一个新的内核。将音频支持配置为内置（built-in）是非常重要的，因为 Pocket Linux 并没有被设置为处理内核模块。


    #### A.2.1.2. 根磁盘对音频的支持


    在 devices.txt 中搜索关键字“sound”会列出许多可能的音频设备，但通常只需要 /dev/dsp 和 /dev/mixer 就能从 PC 获取声音。这两个文件分别控制数字音频输出和混音器控制。


    ### A.2.2. 为程序创建空间


    为 mp3blaster 程序创建更多空间的最简单方法是放置额外的存储设备。挂载点有几种选择。到为止，/usr、/home 和 /opt 都是目录，其中任何一个都可以用于挂载软磁盘、CD-ROM
    或额外的内存磁盘（ramdisk）镜像。/usr 目录是存放应用程序的逻辑选择，但介质的选择呢？Mp3blaster 及其所需的库太大了，无法放入 1.44M
    的软磁盘，而对于一个小程序来说，使用 CD-ROM 似乎工作量太大。考虑到这些限制，最好的选择是将程序放在压缩后的软磁盘上。


    #### A.2.2.1. 挂载额外的压缩软磁盘


    挂载 CD 和未压缩的软磁盘是简单的，但将压缩镜像加载到内存磁盘中呢？除非压缩软磁盘的自动挂载仅适用于根磁盘，否则这必须手动完成。由于磁盘上没有文件系统，因此只有内容。


    磁盘磁盘磁盘磁盘磁盘磁盘磁盘。除非压缩软磁盘的自动挂载仅适用于根磁盘，否则这必须手动完成。由于磁盘上没有文件系统，因此只有内容。


    磁盘磁盘根根磁盘的


    1。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。磁盘。。。。。。.除非压缩软磁盘的自动挂载仅适用于根磁盘。

    2.除非压缩软磁盘的自动挂载仅适用于根磁盘，否则这必须手动完成。


    通过通过管道 dd 和 gzip  ：：`dd ifdev/fd0 | gzip -cq /dev/ram1`。现在压缩软磁盘直接进入内存磁盘，在时解解。


    #### A.2...2.  根对内存磁盘的支持的支持




    已经已经内存内存磁盘，，，因为 Linux Linux Linux根根磁盘，但我们需要在 /dev 创建更多内存磁盘。通常内核支持 /dev/ram0 到
    /dev/ram7，其中 ram0 用于根。


    ### A.2.3. 访问音频文件


    #### A.2.3.1. CD-ROM 硬件支持


    大多数 CD-ROM 驱动器使用 IDE 设备 /dev/hdd。支持这些 CD-ROM 驱动器需要在内核中包含支持并创建设备文件。


    #### A.2.3.2. CD-ROM 文件系统支持


    大多数 CD-ROM 的文件系统与硬盘和软磁盘不同。支持这些 CD-ROM 需要在内核中包含支持。


    ### A.2.4. 其他所需的文件


    由于 mpaster 使用 curses（或 ncurses）控制库，我们需要一个额外的文件。curses 库用于了解它所控制的终端特性，它从 terminfo
    数据库获取信息。infini 数据库由使用 /usr/share/terminfo 目录的所有文件组成，与我们的可用磁盘空间相比很大。但是，由于 Linux
    只支持 PC 控制台，我们只需要担心一种终端类型，因此只需要一个文件。


    ### A.2.5. 任务总结


    在声卡、内存磁盘、CD-ROM 和 terminfo 之间，有很多内容需要跟踪。因此，让我们花一点时间整理并总结使口袋点机可行的任务。


    - 创建一个新内核，包含对音频硬件、IDE 设备和 CD-ROM 文件系统的内置支持。

    - 在根磁盘上创建适当的 /dev 文件以支持音频硬件、额外的内存磁盘和 IDE CD-ROM。

    - 安装 gunzip 工具以启用镜像的解压缩。

    - 创建一个启动脚本，将压缩镜像加载到内存磁盘并挂载 /usr。

    - 创建一个包含 mp3blaster 程序、所需库和 terminfo 文件的压缩软磁盘。


