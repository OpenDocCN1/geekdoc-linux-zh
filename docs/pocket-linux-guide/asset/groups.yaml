    \ labeled \"root disk\" into drive fd0.\n\n```bash\nbash# dd if=/phase8-image.gz\
    \ of=/dev/fd0 bs=1k\n```\n\n## A.3.3. Create a compressed /usr disk for mp3blaster\n\
    \nThe compressed /usr diskette will be created in the same process that is used\
    \ to create the root disk. We will copy files to a staging area, copy the staging\
    \ area to ramdisk, compress the ramdisk and write it to disk.\n\n#### A.3.3.1.\
    \ Create a staging area\n\n```bash\nbash# mkdir ~/usr-staging\nbash# cd ~/usr-staging\n\
    bash# mkdir bin\nbash# mkdir -p share/terminfo\n```\n\n#### A.3.3.2. Install the\
    \ mp3blaster program\n\nDownload the latest version of mp3blaster source code\
    \ from its home at http://www.kernel.org/~mp3blaster/\n\n```bash\nbash# cd ~/usr/src/mp3blaster-3.2.0\n\
    bash# ./configure\nbash# make\nbash# cp src/mp3blaster ~/usr-staging/bin\n```\n\
    \n#### A.3.3.3. Copy additional libraries and terminfo\n\nUse ldd to find which\
    \ libraries are needed for mp3blaster. The following is an example from the author's\
    \ system. It is possible that different systems may yield different results in\
