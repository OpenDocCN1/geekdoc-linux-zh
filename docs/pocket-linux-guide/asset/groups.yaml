    # 便口袋 Linux 指南


    David Horton


    <dhorton<AT>NOSPAM.member.fsf.org>


    # 修订历史


    | 版本 | 日期 | 修订人 | 说明 |

    | :--- | :--- | :--- | :--- |

    | 版本 3.1 | 2005–04–09 | 修订人：DH | 细微说明和拼写修正。 |

    | 版本 3.0 | 2004–11–02 | 修订人：DH | 将引导程序更改为 GRUB 而非 LILO。更新了所有源代码包的版本号。对某些 shell
    命令和脚本增加了细微说明。 |

    | 版本 2.1 | 2004–02–18 | 修订人：DH | 修正了类型。将资源站点托管迁移到 SourceForge。增加了附录 B，将 GNU 自由文档许可证作为本文档的一部分。
    |

    | 版本 2.0 | 2003–11–08 | 修订人：DH | 更新使用 coreutils 代替 fileutils、sh-utils 和 textutils。更新了许多真实源码包的版本号。引入了
    Freshheat 作为查找源码的资源。将 /etc/mtab 改为真实文件而非使用指向 /proc/mount 的符号链接。修正了 local_fs 脚本错误。更新了电子邮件地址。
    |

    | 版本 1.2 | 2003–05–31 | 修订人：DH | 修正了 “strip –o” 命令中的错误。 |

    | 版本 1.1 | 2003–05–21 | 修订人：DH | 修复 Bug，修正拼写错误并改进了 XML 标记。 |

    | 版本 1.0 | 2003–02–17 | 修订人：DH | 初版，由 LLP 审阅。 |


    《便口袋 Linux 指南》适用于任何对从源码构建 GNU/Linux 系统技术感兴趣的人。该指南以项目的形式组织，构建一个名为 Pocket Linux
    的小型基于磁盘的 GNU/Linux 系统。每一都探索整个系统的一个小部分，解释其工作原理、为什么需要它以及如何构建。在完成 Pocket Linux 项目后，读者将对
    GNU/Linux 的运行机制有更深入的了解，并有探索更大、更复杂的仅源码项目的信心。


