    init:sysinit:/etc/init.d/rc S\n#\n# Runlevel scripts\nr0:0:wait:/etc/init.d/rc\
    \ 0\nr1:1:respawn:/bin/sh\nr2:2:wait:/etc/init.d/rc 2\nr3:3:wait:/etc/init.d/rc\
