    # 口袋版 Linux 指南


    为了进一步减少时间投入，Pocket Linux 项目被分为几个阶段，每个阶段的长度相同。每个阶段都构建整个项目的一个小部分，但同时每一章的结论都会产生一个自包含的、可运行的系统。这种循序渐进的方法允许读者按照自己的节奏进行，而不必急于立即看到结果。


    章节进一步分为四个部分。前两个部分是“分析”和“设计”，侧重于每个阶段要完成的任务的理论及其原因。最后两个部分是“构建”和“实现”，详细说明了实际构建所需的步骤。对于可能熟悉特定章节中所列理论的高级读者，出于时间考虑，鼓励他们跳过分析和设计部分。理论与动手练习的分离使所有技能水平的读者都能完成项目，而不会感到完全迷失方向，或纠结于过多的细节中。


    最后，Pocket Linux 项目将尽力使用 GNU/GPL 软件，在没有 GNU/GPL 替代方案时使用其他开源许可软件。此外，Pocket Linux
    绝不会要求任何比 BASH Shell 脚本更复杂的编程内容。


    ## 第 2 章 一个简单的原型


    ### 2.1. 分析


    由于这是项目的第一个阶段，它将保持非常简单。这里的目标不是在第一次尝试就创建一个终极 GNU/Linux 系统。相反，我们将构建一个非常精简、可运行的系统，作为项目后续阶段的构建模块。考虑到这一点，我们可以为第一阶段列出几个目标：


    - 保持简单以避免产生压力。

    - 构建一个能带来即时满足感的东西。

    - 制作一个在项目后期阶段有用的东西。


    ### 2.2. 设计


    ### 2.2.1. 简化


    花一点点时间快速浏览一下 Bootdisk-HOWTO 或 From-PowerUp-to-BASH-Prompt-HOWTO。这些 HOWTO 文档可以在网上
    http://www.ldp.org/docs.html#howto 找到。这两份文档都对让一个 GNU/Linux 系统启动并运行所需的条件提供了极佳的视角。其中也有大量信息需要消化。记住我们的目标之一是“保持简单以避免产生压力”，所以我们想忽略启动根磁盘中绝对关键以外的所有部分。


    基本上，它归结为以下必需项：


    - 一个引导加载程序 (boot loader)

    - Linux 内核

    - 一个 shell (壳)

    - 一些 /dev 文件


    我们甚至不需要 init 守护进程 (init daemon)。通过向引导加载程序传递选项，可以告诉内核直接运行 shell。


    为了方便构建，我们将构建一个双磁盘的启动根集，而不是尝试将所有内容都放到一张软盘上。引导加载程序和内核将放在启动磁盘上，而 shell 将位于根磁盘上。


    ### 2.2.2. 启动磁盘


    对于启动磁盘，我们只需要安装 GRUB 引导加载程序和一个 Linux 内核。我们需要使用一个不需要为我们需要访问的硬件提供模块的内核。主要地，它应该包含对软驱驱动器、内存磁盘
    (ram disk)、某些扩展文件系统、proc 文件系统、ELF 二进制文件和文本控制台的编译内置支持。如果没有这样的内核，则需要从源代码编译。Kwan
    的《内核重构指南》是这项任务的良好参考，但我们可以忽略处理模块和初始内存磁盘（ramdisk）的部分。


    ### 2.2.3. 根磁盘


    对于根磁盘，我们需要一张准备好文件系统的软盘。我们还需要一个静态链接的 BASH shell，以便我们避免共享库带来的额外复杂性。BASH 源代码中的 `configure`
    程序识别用于此功能的 `--enable-static-link` 选项。我们还将使用 `--enable-minimal-config` 选项将 BASH
    二进制文件的大小保持在可管理的范围内。根磁盘的额外要求是一个 `/dev` 设备和一个用于控制台的文件。控制台设备是必需的。


    '
