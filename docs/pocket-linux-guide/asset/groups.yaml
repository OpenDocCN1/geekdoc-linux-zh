    \ b 22 0\nbash# mknod -m640 ~/staging/dev/hdd b 22 64\n```\n\nOptionally create\
    \ additional IDE devices.\n\n#### A.3.2.1.2. Ramdisk\n\n```bash\nbash# mknod -m640\
    \ ~/staging/dev/ram1 b 1 1\nbash# mknod -m640 ~/staging/dev/ram2 b 1 2\nbash#\
    \ mknod -m640 ~/staging/dev/ram3 b 1 3\nbash# mknod -m640 ~/staging/dev/ram4 b\
    \ 1 4\nbash# mknod -m640 ~/staging/dev/ram5 b 1 5\nbash# mknod -m640 ~/staging/dev/ram6\
    \ b 1 6\nbash# mknod -m640 ~/staging/dev/ram7 b 1 7\n```\n\n#### A.3.2.1.3. Audio\n\
    \n```bash\nbash# mknod -m664 ~/staging/dev/dsp c 14 3\nbash# mknod -m664 ~/staging/dev/mixer\
