    bash# cp /usr/lib/libgcc.so ~/usr-staging/lib\nbash# cd ~/usr-staging/share/terminfo\n\
    bash# cp /usr/share/terminfo/*\n```\n\n#### A.3.3.4. Make a compressed image and\
    \ copy it to diskette\n\n```bash\nbash# cd /\nbash# dd if=/dev/zero of=/dev/ram7\
    \ bs=1k count=4096\nbash# mkfs -m0 /dev/ram7\nbash# mount /dev/ram7 /mnt\nbash#\
    \ cp -d ~/staging/* /mnt\nbash# umount /dev/ram7\n```\n\n```bash\nbash# dd if=/dev/ram7\
    \ of=~/mp3blaster-image bs=1k\nbash# gzip -9 ~/mp3blaster-image\n```\n\nInsert\
    \ the diskette labeled \"mp3blaster\" into drive fd0.\n\n```bash\nbash# dd if=~/mp3blaster-image.gz\
    \ of=/dev/fd0 bs=1k\n```\n\n## A.4. Implementation\n\n### A.4.1. System Startup\n\
    \n1. Boot from the kernel diskette.\n2. Insert the root floppy when prompted.\n\
    3. When prompted for a /usr diskette, say 'Y'.\n4. Insert the mp3blaster diskette\
    \ and press Enter.\n\n### A.4.2. Verify that the /usr diskette loaded properly\n\
    \n```bash\nbash# mount\nbash# ls -lR /usr\n```\n\n### A.4.3. Check the audio device\
    \ initialization\n\n```bash\nbash# dmesg | more\nymfci: YMC740AC at 0xf480000\
    \ IRQ 10\nac97_codec: AC97 Audio codec, id: 0x4144:0x5303 (Analog Devices AD1819)\n\
    ```\n\nIf everything worked there should be a line or two indicating that the\
    \ kernel found the audio hardware. The example below shows how the kernel might\
    \ report a Yamaha integrated sound system.\n\n### A.4.4. Test audio output\n\n\
    ```bash\nbash# echo \"Garbage\" > /dev/dsp\n```\n\nA burst of static coming from\
    \ the PC speakers indicates that sound is working.\n\n### A.4.5. Play a sample\
    \ file\n\nInsert the diskette containing the sample audio file.\n\n```bash\nmount\
    \ /dev/fd0 /home\nbash# /usr/bin/mp3blaster\n```\n\nUse mp3blaster to select and\
    \ play the file /home/torvalds-says-linux.mp3. Use mp3blaster's mixer controls\
