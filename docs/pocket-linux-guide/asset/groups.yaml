    Basically it boils down to the following required items:


    +   * A boot loader

    * The Linux kernel

    * A shell

    * Some /dev files


    We don''t even need an init daemon. The kernel can be told to run the shell directly
    by passing it an option through the boot loader.


    For easy construction we will build a two-disk boot root set rather than trying
    to get everything onto a single diskette. The boot loader and kernel will go on
    the boot disk and the shell will reside on the root disk.


    # 2.2.2. Boot Disk


    For the boot disk we simply need to install the GRUB bootloader and a Linux kernel.
    We will need to use a kernel that does not require modules for the hardware we
    need to access. Mainly, it should have compiled-in support for the floppy drive,
    ram disk, some extended filesystem, proc filesystem, ELF binaries, and a text-based
    console. If such a kernel is not available, it will need to be built from source
    code. Kwan''s Kernel Rebuild Guide is a good reference for this task, however
    we can ignore the sections that deal with modules and the initial ramdisk.'
  - '[PAGE 12]


    # 2.2.3. Root Disk


    For the root disk we will need a floppy that has been prepared with a filesystem.
    We will also need a BASH shell that is statically-linked so we can avoid the additional
    complexities of shared libraries. The configure program in the BASH source code
    recognizes the --enable-static-link option for this feature. We will also be using
    the --enable-minimal-config option to keep the BASH binary down to a manageable
    size. Additional requirements for the root disk are a /dev device and a file for
    the console. The console device is required for BASH to be able to communicate
    with the keyboard and video display.


    # 2.2.4. CPU Compatibility


    There is one less, obvious requirement to keep in mind that is CPU compatibility.
    Each generation of CPU features a far more complex architecture than its predecessor.
    Late generation chips have additional registers and instructions when compared
    to an older 486 or 386. A kernel optimized for a new, fast 686 machine will not
    run on an older box.(See the README file in the Linux kernel code for details.)
    A BASH shell built for x86 will probably not run on an older processor either.
    To avoid this problem, we can choose the 386 as a lowest denominator CPU and build
    all for that architecture.


    # 2.3. Construction


    In this section, we will be building the actual boot disk and root disk floppies.
    Lines preceded by bash# indicate a shell command and lines starting with grub>
    indicate a command typed within the grub shell.


    # 2.3.1. Prepare the boot disk media


    Insert a blank disk labeled "boot disk".


    > It may be necessary to erase the "blank" disk if it comes factory pre-formatted
    for another, non-Linux operating system. You can do this using the command dd
    if=/dev/zero of=/dev/fd0 bs=1k count=1440


    # 2.3.2. Build the GRUB bootloader


    The GRUB source code from http://alpha.gnu.org/gnu/grub/ and unpack it into the
    /usr/src directory.


    Configure and build the GRUB source for an i386 processor using the following
    commands:


    ```

    bash# cd /usr/src/grub-0.95

    bash# export CC="gcc -m3pu=i386"

    bash# ./configure --host=i386-pc-linux-gnu --without-curses

    bash# make

    ```'
  - '[PAGE 13]


    # Pocket Linux Guide


    # 2.3.3. Copy the bootloader files to diskette


    Normally, after compiling source code, one would use the command make install
    to copy the finished files to their proper destinations in the filesystem. However,
    using make install does not work with small media the floppy disks we are using.
    The problem is that there are many files in a package besides the actual binaries
    that get the job done. For example, there are man or info pages that provide documentation.
    These extra files can take up more space than we span on the disk. We can work
    around this by limitation copying essential files manually rather than using make
    install.


    For GRUB to boot we will need to copy the stage1 and stage2 bootloader files to
    the /boot/grub directory on the floppy.


    ```

    bash# mkdir -p /mnt/boot/grub

    bash# cp /usr/src/grub-0.95/stage1/stage1 /mnt/boot/grub

    bash# cp /usr/src/grub-0.95/stage2/stage2 /mnt/boot/grub

    ```


    # 2.3.4. Finish bootloader installation


    Once the bootloader are copied to the disk we can enter the grub shell to finish
    the installation.


    ```

    bash# /usr/src/grub-0.95/grub/grub

    grub> root (fd0)

    grub> setup (fd0)

    grub> quit

    ```


