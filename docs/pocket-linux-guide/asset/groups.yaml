    \ $(cat /etc/hostname)\nelse\nhostname gnu-linux\nfi\n#\n# end of hostname\n```\n\
    \n### 6.3.7. 创建 halt & reboot 脚本\n\n使用文本编辑器创建 ~/staging/etc/init.d/halt，如下文所示。\n\
