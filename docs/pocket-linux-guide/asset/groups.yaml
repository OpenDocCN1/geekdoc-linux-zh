    The steps for building the kernel were tested using Linux kernel version 2.4.26
    and should work any 2.4.x or 2.6.x kernel. The latest version of the kernel source
    code may be downloaded from http://www.kernel.org/ or one of its mirrors.


    > The instructions are very brief and intended for someone who has previous experience
    building custom kernels. A more detailed explanation of the kernel building process
    can be found in the Kernel Rebuild Guide by Kwan Lowe.


    ```

    bash# cd /usr/src/linux

