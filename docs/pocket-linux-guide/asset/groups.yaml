- md: "\n# Pocket Linux Guide\n\nTry the following commands and verify that they do\
    \ not work.\n\n```bash\nbash$ ls /root\nbash$ /sbin/shutdown -h now\nbash$ su\
    \ -\n```\n\n## 7.4.4. System shutdown\n\nSwitch back to tty1 where root is logged\
    \ in.\n\n```bash\nbash# shutdown -h now\n```\n\n# Chapter 8. Filling in the Gaps\n\
    \n## 8.1. Analysis\n\nThe root disk has come a long way since its humble beginnings\
    \ as a statically-linked shell. It now shares features with the popular, ready-made\
    \ distributions. For example it has:\n\n- Several common utilities like cat, ls\
    \ and so on.\n- Startup scripts that automatically check and mount filesystems.\n\
    - Graceful shutdown capability.\n- Support for multiple users and virtual terminals.\n\
    \nAs a final test, we can put the root disk using the Filesystem Hierarchy Standard\
    \ (FHS) requirements for the root filesystem. (We will ignore anything in the\
    \ /usr hierarchy of space constraints.) Compared to FHS requirement, the only\
    \ files missing are a few commands in the /bin directory. Specifically, the root\
    \ disk lacks the following commands:\n\n- more\n- ps\n- sed\n\nIn addition to\
    \ the required commands, it might be nice to include the \"ed\" editor list as\
    \ an option by the FHS. It is not as robust as vi or emacs, but it works and should\
    \ fit onto the tiny root filesystem.\n\nSo in order to finish this phase of the\
    \ project, we need to accomplish the following goals:\n\n- Add the more, ps and\
    \ sed commands.\n- Install the optional ed editor.\n\n## 8.2. Design\n\n### 8.2.1.\
    \ more\n\nThere is a more command that comes with util-linux, but it will not\
    \ work for this project. The reason is because of library dependencies and space\
    \ constraints. The util-supplied more needs either the libncurses or libterm to\
    \ work and there is not enough space on the root disk floppy to fit everything.\
    \ So, in order to have a more command we will have to create.\n\nThe more command\
    \ is used to display a file page by page. It's a little like having a cat command\
    \ that pauses twenty-five lines. The basic logic is outlined below.\n\n- Read\
    \ one line of the file.\n- Display the line on the screen.\n- If 25 lines have\
    \ been displayed, pause.\n- Loop and do it again.\n\nOf course there are some\
    \ details left out what to do if the screen dimensions are not what we anticipated,\
    \ but overall it is a fair representation of what more does. Given this simple\
    \ program logic, it should not be hard to put together a short shell script that\
    \ emulates the basic functionality of more. The BASH(1) manpage and Adv-BASH-Scripting-Guide\
    \ will serve as references.\n\n### 8.2.2. More device files\n\nThe more script\
    \ will need access to device files that are not on the disk yet. Specifically\
    \ more needs stdin, stdout and stderr while we are at it it should check for any\
    \ missing /dev files. The Linux Standard Base requires null, zero and tty to be\
    \ present in the /dev directory. For null and tty already present from previous\
    \ phases of the project, but we still need /dev/zero. We can refer to devices.txt\
    \ in the Linux source Documentation directory for major and minor numbers.\n\n\
    ### 8.2.3. ps, sed & ed\n\nThese three packages can be found using the Internet\
    \ resources we have used plus one new site. The \"sed\" and \"ed\" packages can\
    \ be found at the same place where BASH, the GNU FTP server. The procs package\
    \ shows up in Ibiblio LSM search, but it is an old version. In order to find the\
    \ latest version we can go to the website at http://freshmeet.net and search for\
    \ \"procs\" in projects.\n\nBoth \"sed\" and \"ed\" package GNU's basic configure\
    \ script are therefore very easy to build. There is no configure for \"procs\"\
    \ which does not make things difficult. We can just read the package's README\
    \ file to find out how to set various configuration options. We can use one of\
    \ these options to avoid the complexity of installing and linking. Setting SHARED=0\
    \ makes libproc part of ps rather than a separate, shared library.\n\n## 8.3.\
    \ Construction\n\n### 8.3.1. Write a \"more\" script\n\nCreate the following script\
    \ with a text editor and save it as ~/staging/bin/more.sh\n\n```bash\n#!/bin/sh\n\
    #\n# more.sh     emulates the basic functions of the \"more\" binary without\n\
    #               requiring ncurses or termcap libraries.\n#\n# Assume input is\
    \ coming from STDIN unless a valid file is given as\n#   a command-line argument.\n\
    if [ -f $1 ]; then\n  INPUT=\"$1\"\nelse\n  INPUT=\"/dev/stdin\"\nfi\n\n# Set\
    \ IFS to newline one. See BASH(1) manpage for details on IFS.\nIFS=$'\\n'\n\n\
    # If terminal dimensions are not already set as shell variables, take\n# a guess\
    \ of 80x25.\nif [ \"$COLUMNS\" = \"\" ]; then\n  let COLUMNS=80\nfi\nif [ \"$LINES\"\
    \ = \"\" ]; then\n  let LINES=25;\nfi\n\n# Initialize line counter variable\n\
    let LINE_COUNTER=$LINES\n\n# Read the input file line at a time and display on\
    \ STDOUT until\n# the page fills up. Display \"Press <Enter>\" message on STDERR.\n\
    while read -r line; do\n  echo \"$line\"\n  let LINE_COUNTER=$((LINE_COUNTER -\
    \ 1))\n  if [ $LINE_COUNTER -le 0 ]; then\n    echo \"Press <Enter>\" >&2\n  \
    \  read -r\n    let LINE_COUNTER=$LINES\n  fi\ndone < \"$INPUT\"\n```\n\n*(Note:\
    \ The OCR text for the script was heavily fragmented and corrupted across pages.\
    \ I have reconstructed the logical flow based on the provided snippets and standard\
    \ shell scripting for a `more` implementation.)*\n"
  mdcn: "\n\n# 口袋 Linux 指南\n\n尝试以下命令并验证它们无法运行。\n\n```bash\nbash$ ls /root\nbash$ /sbin/shutdown\
