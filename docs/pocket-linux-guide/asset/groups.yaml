  - '[PAGE 40]


    # Chapter 7. Enabling Multiple Users


    # 7.1. Analysis


    Up to now the system has been operating in single–user mode. There is no login
    process and anyone who boots the system gets into a shell with root privileges.
    Obviously, this is not the normal operating mode for GNU/Linux distributions.
    Most systems feature multi-user capability where many users can access the system
    simultaneously with different privilege levels. multi-user systems also support
    virtual consoles so the keyboard and video display can be multiplexed between
    several terminal sessions. So in this phase we would like to add the following
    enhancements to the system:


    +   - Enable multi-user capability.

    - Create multiple, virtual consoles.


    # 7.2. Design


    # 7.2.1. The login process


    The From–PowerUp–To–BASH–Prompt–HOWTO does a good job of outlining the steps in
    the login process. Basically it works like this:


    +   1. The init daemon starts a getty process on the terminal.

    2. The getty process displays the contents of /etc/issue and prompts for a user
    name.

    3. When the user name is entered, control is handed off to the login process.

    4. The login program asks for a password and verifies the credentials using /etc/passwd,/etc/group
    and possibly /etc/shadow.

    5. If everything is okay the user’s shell is started.


    # 7.2.2. Obtaining source code


    The getty and login programs were already installed as part of the util–linux
    package so there is no need to download any new source code.


    # 7.2.3. Creating support files


    # 7.2.3.1. Device nodes


    Details about virtual console device files can be found in the Linux kernel source
    code file called devices.txt in the Documentation directory. We will need to create
    tty through t6 for each of the virtual consoles as well as tty0 and tty to represent
    the current virtual console.


    # 7.2.3.2. /etc/issue


    The /etc/issue file is pretty easy to construct. It can contain any text we want
    displayed on the screen prior to the login prompt. It could be something like
    "Welcome to Pocket Linux", something menacing like "Authorized users only!" or
    informational like "Connected to tty at 9600bps". getty(8) manpage explains how
    to display information like tty line and baud rate using escape codes.'
- md: '

    ## 7.2.3.3. /etc/passwd


    The format of /etc/passwd can be obtained by reading passwd(5) manpage. We can
    easily create a user account by adding a line `root:0:0:superuser:root:/bin/sh`
    to the file.


    Maintaining passwords will be somewhat challenging because the system being loaded
    into ramdisk. Any changes to /etc/passwd will be lost when the system is shut
    down. To make things easy, we will create all users with null passwords.


    ## 7.2.3.4. /etc/group


    The structure of /etc/group is available from group(5) manpage. A line of `root::0:root`
    would define a group called `root` with no password, a group or user assigned
    to it as the only member.


    ## 7.2.3.5. Conventions


    User and group name and id''s are generally not chosen at random. Most Linux systems
    have very similar looking /etc/passwd and /etc/group files. Definitions for commonly
    used id and group assignments may be found in one of several places:


    - /etc/passwd and /etc/group files on any popular GNU/Linux distribution.

    - The Debian Policy Manual — available at http://www.debian.org/doc/debian-policy/

    - The Linux Standard Base specification — downloadable in many formats from http://www.linuxbase.org/spec/index.html.

    - Essential System Administration, 3rd Edition by Aeleen Frisch — available at
    libraries, bookstores or O''Reilly Publishing at http://www.oreilly.com/


    ## 7.2.4. Dependencies


    Running id on the login program from util-linux will reveal that it is linked
    to the libraries libcrypt.so.1, libc.so.6 and ld-linux.so.2. In addition to these
    libraries there is another, dependency on the configuration file /etc/nwitch.conf.


    The name service switch library libnssfiles.so.2 and nswitch.conf are required
    for libc.so, which the login program, to access the /etc/passwd file. Without
    it and its configuration file, all logins will mysteriously fail. More information
    about glibc''s use of the name service switches can be found http://www.gnu.org/software/libc/manual/html/node/Service-Switch.html.


    ## 7.2.5. Assigning ownership and permissions


    Previously, with the single user system, there was no need to worry about permissions
    when installing directories, files and device nodes. The shell was effectively
    operating as root, so everything was accessible. Things become more complex with
    the addition of multiple user capability. We need to make sure that every user
    has access to what they need and at the same time get blocked from what they do
    not need.


    A good guideline for assigning ownership and permissions would be to give the
    minimum level of access required. The /bin directory as an example. The Filesystem
    Hierarchy (FHS) document, "bin commands that may be used by the system administrator
    and users". From that statement we can infer that /bin should have read and execute
    permission for everyone. On the other hand, the /boot directory contains files
    for the boot loader. Chances that regular users will not need to access anything
    in the /boot directory. So the minimum level of access would be read permission
    for the root user and other administrators who are members of the root group.
    Normal users would have no permissions assigned to the /boot directory.


    Most of the time we can assign permissions to all the commands in a directory,
    but there are some programs that may be exceptions to the rule. The su command
    is a good example. Other commands in the /bin directory have a minimum requirement
    of read and execute, but the su command needs to be setuid in order to run correctly.
    Since it is setuid binary, it might not be a good idea to allow anyone to run
    it. Ownership of 0 (root, root group) and permissions of rwsxr-x (octal 4750)
    would be a good fit for it.


    The same logic can be applied to other directories and files in the root filesystem
    using the following steps:


    1. Assign ownership to the root user and root group.

    2. Set the most restrictive permissions possible.

    3. Adjust ownership and permissions on an "needed" basis.


    ## 7.3. Construction


    ### 7.3.1. Verify presence of getty and login


    ```bash

    bash ls ~/staging/sbin/getty

    bash ls ~/staging/bin/login

    ```


    ## 7.3.2. Modify initab for multi–user mode


    Modify ~/staging/etc/initab by changing the default level and adding getty entries
    as shown below.


    ```

    # /etc/initab - init daemon configuration file

    #

    # Default runlevel

    id:2:initdefault:

    #

    # System initialization

    sS:sysinit:/etc/init.d/rc S

    #

    # Runlevel scripts

    r0:wait/etc/init.d/rc 0

    r1:respawn:/bin/sh

    r2:wait/etc/init.d/rc 2

    r3:wait/etc/init.d/rc 3

    r4:wait/etc/init.d/rc 4

    r5:wait/etc/init.d/rc 5

    r6:wait/etc/init.d/rc 6

    #

    # Spawn virtual terminals

    1:235:respawn:/sbin/getty 38400 tty1 linux

    2:235:respawn:/sbin/getty 38400 tty2 linux

    3:235:respawn:/sbin/getty 38400 tty3 linux

    ```


    ### 7.3.3. Create tty devices


    ```bash

    bash# cd ~/staging/dev

    bash# mknod ~/staging/dev/tty0 c 4 0

    bash# mknod ~/staging/dev/tty1 c 4 1

    bash# mknod ~/staging/dev/tty2 c 4 2

    bash# mknod ~/staging/dev/tty3 c 4 3

    bash# mknod ~/staging/dev/tty4 c 4 4

    bash# mknod ~/staging/dev/tty5 c 4 5

    bash# mknod ~/staging/dev/tty6 c 4 6

    bash# mknod ~/staging/dev/tty7 c 5 0

    ```


    ### 7.3.4. Create support files in /etc


    ### 7.3.4.1. /etc/issue


    Create the file ~/staging/issue using the example below or design a customized
    message.


    Connected to \l at \ bps.

    Be sure that "L" is a lowercase L and not the number one.


    ### 7.3.4.2. /etc/passwd


    Use a text editor to create a minimal passwd file conforming to the Linux Standards
    Base (LSB) document. Save the file as ~/staging/etc/passwd


    ```

    root:0:0:Super User:/root:/bin/sh

    bin:x:1:1:Legacy UID:/bin/bin/false

    daemon:x:2:2:Legacy UID:/sbin:/bin/false

    ```


    ### 7.3.4.3. /etc/group


    Use a text editor to create an LSB conforming group file and save it as ~/staging/etc/group


    ```

    root:x:1:root,bin,daemon

    daemon:x:2:root,bin,daemon

    ```


    ### 7.3.4.4. /etc/nsswitch.conf


    Create the following file and save it as ~/staging/etc/nsswitch.conf


    ```

    passwd: files

    group: files

    ```


    ### 7.3.5. Copy required libraries


    ```

    passwd: files

    group: files

    ```


    ### 7.3.6. Set ownership and permissions


    ### 7.3.7. Create the root image


    ```bash

    bash# cd /

    bash# dd if=/dev/zero of=/dev/ram7 bs=1k count=4096

    bash# mount /dev/ram7 /mnt

    bash# cp -dr ~/staging/* /mnt

    bash# umount /dev/ram7

    bash# dd if=/dev/ram7 of=/phase6-image bs=1k=4096

    bash# gzip -9 /phase6-image

    ```


    ### 7.3.8. Copy the image to diskette


    Insert the diskette labeled "root disk" into drive fd0.


    ```bash

    bash# dd if=/phase6-image.gz of=/dev/fd0 bs=1k

    ```

