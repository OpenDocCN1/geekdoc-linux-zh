    \n```bash\ncd /usr/src/sysinit-2.85/src\n# make CC=gcc -mpu=i386\n# cp halt halt\
    \ shutdown ~/staging/sbin\n# ln -s halt ~/staging/sbin/reboot\n# ln -s init ~/staging/sbin/telinit\n\
    # mknod ~/staging/dev/initctl p\n```\n\n> In the interest of respect we are skipping\
    \ the steps for checking libraries and stripping binaries. The library for sysinit\
