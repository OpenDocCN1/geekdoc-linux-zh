    ## Introduction


    ## 1. About Pocket Linux


    The Pocket Linux Guide demonstrates how to build a small console–based GNU/Linux
    system using only source code and a couple of diskettes. It is intended for Linux
    users who would like to gain a deeper understanding of how their system works
    beneath the shroud of distribution specific features and tools.


    ## 2. Prerequisite Skills


    This guide is intended for intermediate to advanced Linux users. It is not intentionally
    obscure, but certain assumptions about the readers skill level are made. Success
    with this guide depends in part on being able to perform the following tasks:


    - Use basic shell commands

    - Reference man and info pages

    - Build a custom Linux kernel

    - Compile source code using make and related tools


    ## 3. Project Format


    The Pocket Linux Guide takes a hands-approach to learning. The guide is written
    with each chapter building a piece of an overall project. Chapters are further
    broken into sections of Analysis, Design, Construction and Implementation. This
    format is derived from Rapid Application Development (RAD) methodology. Without
    going into detail about design methodologies, the sections may be summed up as
    follows.


    - The Analysis section gives a high-level overview of what is to be accomplished
    in each chapter. It will introduce the tasks that need to be completed and why
    they are important to the overall system.

    - The Design section defines the source code packages, files and configuration
    necessary to address the requirements set forth in the Analysis section. Much
    of the theory of why certain system files exist and what their purpose is can
    be found here.

    - The Construction section is where the hands-on action takes place. This section
    goes into detail about building source code and configuring the system files.

    - The Implementation section will test the proper execution of the project at
    the end of each chapter. There are often a few shell commands to perform and samples
    of screened output are given.


    Readers interested in learning more about RAD may want to consult a textbook systems
    analysis and design or visit the following University of California, Davis website
    on the subject: http://sysdev.ucavis.edu/WEBADM/document/rad–stages.htm.


    ## 4. Help & Support


    Readers are encouraged to visit the Pocket Linux Resource Site at http://pocket-linux.sourceforge.net/.
    The resource site is home to:


    - Information about the Pocket Linux mailing list.


    Introduction


    - A web-based troubleshooting forum where readers can ask questions and give tips
    to others.

    - A collection of diskette images for various chapters.

    - Additional projects that may be of interest.


    ## 5. Feedback


    For technical questions about Pocket Linux use the mailing list or the resource
    site. General comments and suggestions may be sent to the author directly.


    ## Chapter 1. Project Initiation


    ### 1.1. A Brief History of GNU/Linux


    In the early 90s GNU/Linux systems consisted of little than a beta–quality kernel
    and a small collection of software ported from the GNU project. It was a true
    hacker''s operating system. Toward the middle of the decade GNU/Linux distributions
    began appearing. One of the first was Slackware since 1993 and then have been
    others. Even though there are many “flavors” of Linux today, the main purpose
    remains the same. A notable indication of this movement was the publication of
    the Linux-From-Scratch-HOWTO version 1.0 by Gerard Beekmans in 1999. Ragib Hasan’s
    “History of Linux” at http://netlify.uiuc.edu/hasan


    ### 1.2. The Goal of Pocket Linux


    The purpose of Pocket Linux is to support and encourage people who wish to explore
    Linux by building a GNU/Linux system from nothing but code. Pocket Linux is not
    intended to be a full featured system, but rather to give the reader a taste of
    what is involved in building an operating system from source code. After completing
    the Pocket Linux system the reader should have enough knowledge to confidently
    build any project using only source code. Given this can put a few constraints
    on the project.


    - The main focus should be learning. The project should not just describe how
    to do something, it should also describe why it should be done.

    - The required time commitment should be minimal and manageable.

    - The project should not require any investment in additional hardware or reconfiguration
    of existing hardware to set up a lab environment.

    - Readers should not need to know any programming languages in order to complete
    the project.

    - To remain true to the spirit of GNU/Linux, all software used in the project
    should be covered under the GNU/GPL or another, similarly limited, open-source
    license.


    ### 1.3. Working Within The Constraints


    The Pocket Linux gets its name from the fact that the bulk of it fits onto two
    disks making possible to carry the entire working system around in one. This has
    the advantage of not needing any additional hardware since any PC can be booted
    from the diskettes without disrupting any OS that exists on the hard drive. Using
    diskettes also partially addresses the aspect of time commitment, because the
    project size and complexity is necessarily limited by the 1.44 Megabyte size of
    the installation media.

