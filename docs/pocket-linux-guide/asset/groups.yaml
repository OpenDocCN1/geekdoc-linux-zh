  - "[PAGE 28]\n\n# 5.2.4.2./etc/mtab\n\nThe /etc file presents a unique challenge,\
    \ because it does not contain static information like fstab. The mtab file tracks\
    \ mounted filesystems and therefore its contents change from time to time. We\
    \ are particularly interested in the state of mtab when the system starts up,\
    \ before any filesystems are mounted. At this point /etc/mtab should be empty\
    \ so we may configure a startup script to create an empty /etc/mtab before any\
    \ filesystems are mounted. But it is not possible to create files in the /etc\
    \ directory because is read-only at startup. This creates a paradox. We cannot\
    \ create an empty mtab, because the filesystem is not mounted as writable and\
    \ we should not mount any filesystems until we have created an empty mtab. In\
    \ order to sidestep this problem we need to do the following:\n\n+   1. Read as-write,\
