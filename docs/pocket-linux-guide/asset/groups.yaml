    ## 4.4.3. System shutdown


    Remove the diskette from fd0 and restart the system using CTRL-ALT-DELETE.


    ## Chapter 5. Checking and Mounting Disks


    ## 5.1. Analysis


    In the previous chapter we added many new commands by installing coreutils and
    there are still a few things lacking. One thing that really stands out is that
    there was no way to mount disks. In order to get a read-write filesystem we had
    to resort to passing the `rw` kernel parameter at the `grub>` prompt. This is
    for an emergency situation, but a normal system boot process should do things
    differently.


    Most GNU/Linux distributions take several steps to mount filesystems. Watching
    the boot process or digging into the startup scripts one of the popular Linux
    distributions reveals the following sequence of events:


    - 1. The kernel automatically mounts the root filesystem as read-only.

    - 2. All local filesystems are checked for errors.

    - 3. If filesystems are clean, root is remounted as read-write.

    - 4. The rest of the local filesystems are mounted.

    - 5. Network filesystems are mounted.


    So far our Linux system can do step one and that is it. If we want to have a professional
    looking boot /root diskset we have to do better than one out of five. In this
    phase of the project we will work on steps two and three. Steps four and five
    can wait. Since this is a diskette-based system, there really are no other filesystems
    besides root.


    Taking into account all of the above information, the goals for this phase are
    defined as follows:


    - A way to check filesystem integrity.

    - The ability to mount filesystems.

    - A script to automate checking and mounting of local filesystems.


    ## 5.2. Determining necessary utilities.


    ### 5.2.1. Finding source code


    We can use the Filesystem Hierarchy Standard (FHS) document to find the names
    of utilities we need and where they reside in the directory structure. The FHS
    `/sbin` directory lists `fsck` and something called `fsk.` for checking filesystems.
    Since we are using a Second Extended (ext2) filesystem the `fsk.` becomes `fsck2`
    for our purposes. Mounting filesystems is done using the commands `mount` and
    `umount` in the `/bin` directory. However, the name of a script to automatically
    mount local filesystems cannot be found. In most systems this type of script is
    in the `/etc` directory, while FHS does not list it. Several GNU/Linux distributions
    use `/etc/init.d` as the place to hold startup scripts we will put our filesystem
    mounting script there.


    In the previous chapter we used methods to find source code. In this chapter we
    will use a tool Linux Software Map (LSM). LSM is a database of GNU/Linux software
    that tracks such things as package name, author, of binaries that make up the
    package and download sites. Using an LSM search engine, we can locate packages
    Linux command as keywords.


    If we search Ibiblio Linux Software Map (LSM) at http://www.ibiblio.org/pub/Linux/
    for the keyword "fck" we get a large number of matches. Since we are using a Second
    Extended filesystem, called e2fs for short, we can refine the search using "ext2"
    as a keyword. Publishing both keywords to the LSM search engine comes with a package
    called e2sprogs. Looking at the LSM for e2fsprogs we find out that this package
    contains the utilities e2fs, mke2fs, mke2dumpe, fsck. We also find that the LSM
    for e2fsprogs has not been used for a while. There is almost certainly a newer
    version there somewhere. Another good Internet resource for source code is SourceForge
    at http://sourceforge.net/. Using the keyword "e2fsprogs" in the SourceForge search
    engine results in a newer version of e2fsprogs.


    Finding fsck was quite an adventure, but now we move on to finding mount and unmount.
    A search on LSM comes up a number of matches, but from point to various versions
    of a package called util-linux. All we have do is to search and pick the most
    recent version. The LSM entry for util-linux lists a of utilities besides mount
    and unmount. We should definitely search the list to see if any of the other util-linux
    commands show in the FHS requirements for /bin and /sbin.


    Below is a list of packages we have gathered so far and the utilities that match
    up with FHS.


    | Package | Utilities |

    | :--- | :--- |

    | e2sprogs | fsck, mkfs.ext2 (e2fsck), mkfs.ext2 (mke2fs) |

    | util-linux | dmesg, getty (agate), kill, mount, swap, unmount |


    ### 5.2.3. Automating fsck and mount


    Now that we have fsck and mount commands we need to do with a shell script to
    automate checking and mounting the filesystems. Any way to do this would be to
    write a short, line script that calls fsck and mount. But, what if the filesystems
    are not clean? The system should definitely not try to mount a corrupted filesystem.
    We need to decide a way of determining the status of the filesystems before mounting.
    The mapping for fsck gives some insight into how this can be achieved using return
    codes. Basically, if fsck returns a code of zero or one it means the filesystem
    is okay and a return code of two or greater means some manual intervention is
    needed. A simple if-then statement could evaluate the fsck return code to determine
    whether or not the filesystem should be mounted. For help on writing scripts we
    can use-BASH-guide.


    ### 5.2.4. File dependencies


    The only thing to do is to create device files. We need /dev/ram0, because that
    is where the root filesystem is located. We also need /dev/fd0 to mount other
    disks and /dev/null for use by some of the commands.


    '
