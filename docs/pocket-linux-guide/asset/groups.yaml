    \nPlace the boot disk in drive fd0\n\n```bash\nbash# mount /dev/fd0 /mnt\nbash#\
    \ cp /usr/src/linux/arch/i386/boot/bzImage /mnt/boot/vmlinux\n```\n\n### A.3.1.3.\
    \ Unmount the boot disk\n\n```bash\nbash# cd /\nbash# unmount /mnt\n```\n\n##\
