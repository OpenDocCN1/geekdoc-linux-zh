    # A.3.3. Create a compressed /usr disk for mp3blaster


    The compressed /usr diskette will be created in the same process that is used
    to create the compressed root disk. We will copy files to a staging area, copy
    the staging area to ramdisk, compress the ramdisk and write it to disk.


    # A.3.3.1. Create a staging area


    ```

    bash# mkdir ~/usr-staging

    bash# cd ~/usr-staging

    bash# mkdir bin lib

    bash# mkdir -p share/terminfo/1

    ```


    # A.3.3.2. Install the mp3blaster program


    Download the latest version of mp3blaster source code from its home at http://www.stack.nl/~brama/mp3blaster/


    ```

    bash# cd ~/usr/src/mp3blaster-3.2.0

    bash# .//configure

    bash# make

    bash# cp src/mp3blaster ~/usr-staging/bin

    ```


    # A.3.3.3. Copy additional libraries and terminfo


    Use ld to find which libraries are needed for mp3blaster.


    > The following is an example from the author''s development system. It is possible
    that different systems may yield different results in terms of library requirements.


    ```

    bash# cd ~/usr-staging/lib

    bash# ldd ~/usr-staging/bin/mp3blaster

    bash# cp /usr/lib/ncurses.so.5.0

    bash# cp /usr/lib/libc++.so.3

    bash# cp /usr/lib/libgcc_s.so.1

    bash# cd ~/usr-staging/share/terminfo/1

    bash# cp /usr/share/terminfo/1/*

    ```


    # A.3.3.4. Make a compressed image and copy it to a diskette


    ```

    bash# cd /

    bash# dd if=/dev/zero of=/dev/ram7 bs=1lk count=4096

    bash# mk2fs -m0 /dev/ram7

    bash# mount /dev/ram7 /mnt

    bash# cp -dPR ~/usr-staging/* /mnt

    bash# umount /dev/ram7

    ```


    Appendix A. Hosting Applications'
