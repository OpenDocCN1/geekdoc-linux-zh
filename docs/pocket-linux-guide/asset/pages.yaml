- img_proc: true
  md: '# # Chapter 1. Project Initiation


    # ## 1.1. A Brief History of GNU/Linux


    In the early 90s GNU/Linux systems consisted of little than a beta–quality Linux
    kernel and a small collection of software ported from the GNU project. It was
    a true hacker''s operating system. There were no CD-ROMs or GNU installation tools;
    everything had to be compiled and configured by the end user. Being a Linux Expert
    knowing your system inside and out.


    Toward the middle of the decade GNU/Linux distributions began appearing. One of
    the first was Slackware since 1993 and then have been many others. Even though
    there are many “flavors” of Linux today, the main purpose of the distribution
    remains the same. The distribution automates many of the tasks involved in GNU/Linux
    installation and configuration taking the burden off of the system administrator.
    Being a Linux Expert now knowing which to click in the GUI administration tool.


    Recently there has been a yearn for a return to the “good old days” of Linux when
    sysadmins were hardcore geeks and everything was compiled from source code. A
    notable indication of this movement was the publication of the Linux-From-Scratch-HOWTO
    version 1.0 by Gerard Beekmans in 1999. Being a Linux Expert once again means
    knowing how to do it yourself.


    For more historical information, Ragib Hasan’s “History of Linux” at http://netlify.uiuc.edu/rhasan/linux


    # ## 1.2. The Goal of Pocket Linux


    The purpose of Pocket Linux is to support and encourage people who wish to explore
    Linux by building a GNU/Linux system from nothing but code. Pocket Linux is not
    intended to be a full featured system, but rather to give the reader a taste of
    what is involved in building an operating system from source code. After completing
    the Pocket Linux system the reader should have enough knowledge to confidently
    build any project using only source code. Given this can put a few constraints
    on the project.


    +   * The main focus should be learning. The project should not just describe
    how to do something, it should also describe why it should be done.

    * The required time commitment should be minimal and manageable.

    * The project should not require any investment in additional hardware or reconfiguration
    of existing hardware to set up a lab environment.

    * Readers should not need to know any programming languages in order to complete
    the project.

    * To remain true to the spirit of GNU/Linux, all software used in the project
    should be covered under the GNU/GPL or another, similarly limited, open-source
    license.


    # ## 1.3. Working Within The Constraints


    The Pocket Linux gets its name from the fact that the bulk of it fits onto two
    disks making possible to carry the entire, working system around in one. This
    has the advantage of not needing any additional hardware since any PC can be booted
    from the diskettes without disrupting any OS that exists on the hard drive. Using
    diskettes also partially addresses the aspect of time commitment, because the
    project size and complexity is necessarily limited by the 1.44 Megabyte size of
    the installation media.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Pocket Linux Guide


    To further reduce the time commitment, the Pocket Linux project is divided into
    several phases, each one in length. Each phase builds a small piece of the overall
    project, but at the same time the conclusion of each chapter results in a self-contained,
    working system. This step-by-step approach should allow readers to pace themselves
    and not feel the need to see results.


    Chapters are further subdivided into four sections. The first two sections, analysis
    and design, focus on the theory of what is to be accomplished in each phase and
    why. The last two sections, construction and implementation, detail the steps
    needed to do the actual building. Advanced readers, who may be familiar with the
    theories laid out in a particular chapter are encouraged to gloss over the analysis
    and design sections in the interest of time. The separation of theory from hands-on
    exercises should allow readers of all skill levels to complete the project without
    feeling completely lost or minded in too much detail.


    Finally, the Pocket Linux project will strive to use GNU/GPL software when possible
    and other open–source licensed software when there is no GNU/GPL alternative.
    Also, Pocket Linux will never require any programming more complex than a BASH
    shell script.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Chapter 2. A Simple Prototype


    # 2.1. Analysis


    Since this is the first phase of the project it will be kept very simple. The
    goal here is not to create the ultimate GNU/Linux system on the first try. Instead,
    we will be building a very minimal, working system to be used as a building block
    in subsequent phases of the project. Keeping this in mind, we can list a few goals
    for phase one.


    +   * Keep it simple to avoid stress out.

    * Build something that works for instant gratification.

    * Make something that it is useful in later phases of the project.


    # 2.2. Design


    # 2.2.1. Simplification


    Take a moment to skim through the Bootdisk-HOWTO or the From-PowerUp-to-BASH-Prompt-HOWTO.
    These HOWTO documents can be found online at http://www.ldp.org/docs.html#howto.
    Both documents offer an excellent view of what it takes to get a GNU/Linux system
    up and running. There is also a lot of information to digest. Remember that one
    of our goals,"keep it simple to avoid stress out," so we want to ignore everything
    but the absolutely critical pieces of boot root disk.


    Basically it boils down to the following required items:


    +   * A boot loader

    * The Linux kernel

    * A shell

    * Some /dev files


    We don''t even need an init daemon. The kernel can be told to run the shell directly
    by passing it an option through the boot loader.


    For easy construction we will build a two-disk boot root set rather than trying
    to get everything onto a single diskette. The boot loader and kernel will go on
    the boot disk and the shell will reside on the root disk.


    # 2.2.2. Boot Disk


    For the boot disk we simply need to install the GRUB bootloader and a Linux kernel.
    We will need to use a kernel that does not require modules for the hardware we
    need to access. Mainly, it should have compiled-in support for the floppy drive,
    ram disk, some extended filesystem, proc filesystem, ELF binaries, and a text-based
    console. If such a kernel is not available, it will need to be built from source
    code. Kwan''s Kernel Rebuild Guide is a good reference for this task, however
    we can ignore the sections that deal with modules and the initial ramdisk.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# 2.2.3. Root Disk


    For the root disk we will need a floppy that has been prepared with a filesystem.
    We will also need a BASH shell that is statically-linked so we can avoid the additional
    complexities of shared libraries. The configure program in the BASH source code
    recognizes the --enable-static-link option for this feature. We will also be using
    the --enable-minimal-config option to keep the BASH binary down to a manageable
    size. Additional requirements for the root disk are a /dev device and a file for
    the console. The console device is required for BASH to be able to communicate
    with the keyboard and video display.


    # 2.2.4. CPU Compatibility


    There is one less, obvious requirement to keep in mind that is CPU compatibility.
    Each generation of CPU features a far more complex architecture than its predecessor.
    Late generation chips have additional registers and instructions when compared
    to an older 486 or 386. A kernel optimized for a new, fast 686 machine will not
    run on an older box.(See the README file in the Linux kernel code for details.)
    A BASH shell built for x86 will probably not run on an older processor either.
    To avoid this problem, we can choose the 386 as a lowest denominator CPU and build
    all for that architecture.


    # 2.3. Construction


    In this section, we will be building the actual boot disk and root disk floppies.
    Lines preceded by bash# indicate a shell command and lines starting with grub>
    indicate a command typed within the grub shell.


    # 2.3.1. Prepare the boot disk media


    Insert a blank disk labeled "boot disk".


    > It may be necessary to erase the "blank" disk if it comes factory pre-formatted
    for another, non-Linux operating system. You can do this using the command dd
    if=/dev/zero of=/dev/fd0 bs=1k count=1440


    # 2.3.2. Build the GRUB bootloader


    The GRUB source code from http://alpha.gnu.org/gnu/grub/ and unpack it into the
    /usr/src directory.


    Configure and build the GRUB source for an i386 processor using the following
    commands:


    ```

    bash# cd /usr/src/grub-0.95

    bash# export CC="gcc -m3pu=i386"

    bash# ./configure --host=i386-pc-linux-gnu --without-curses

    bash# make

    ```'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Pocket Linux Guide


    # 2.3.3. Copy the bootloader files to diskette


    Normally, after compiling source code, one would use the command make install
    to copy the finished files to their proper destinations in the filesystem. However,
    using make install does not work with small media the floppy disks we are using.
    The problem is that there are many files in a package besides the actual binaries
    that get the job done. For example, there are man or info pages that provide documentation.
    These extra files can take up more space than we span on the disk. We can work
    around this by limitation copying essential files manually rather than using make
    install.


    For GRUB to boot we will need to copy the stage1 and stage2 bootloader files to
    the /boot/grub directory on the floppy.


    ```

    bash# mkdir -p /mnt/boot/grub

    bash# cp /usr/src/grub-0.95/stage1/stage1 /mnt/boot/grub

    bash# cp /usr/src/grub-0.95/stage2/stage2 /mnt/boot/grub

    ```


    # 2.3.4. Finish bootloader installation


    Once the bootloader are copied to the disk we can enter the grub shell to finish
    the installation.


    ```

    bash# /usr/src/grub-0.95/grub/grub

    grub> root (fd0)

    grub> setup (fd0)

    grub> quit

    ```


    # 2.3.5. Build the Linux kernel


    The steps for building the kernel were tested using Linux kernel version 2.4.26
    and should work any 2.4.x or 2.6.x kernel. The latest version of the kernel source
    code may be downloaded from http://www.kernel.org/ or one of its mirrors.


    > The instructions are very brief and intended for someone who has previous experience
    building custom kernels. A more detailed explanation of the kernel building process
    can be found in the Kernel Rebuild Guide by Kwan Lowe.


    ```

    bash# cd /usr/src/linux

    bash# make menustconfig

    ```


    Be sure to configure support for the:


    +   * 386 processor

    * Console on virtual terminal (2.4.x kernels only)

    * ELF binaries

    * Floppy disk

    * proc filesystem

    * RAM disk with a default size of 4096K

    * Second extended (ext2) filesystem

    * VGA console


    ```

    bash# make dep

    bash# make clean

    bash# make bzimage

    ```


