  md: '# Introduction


    # 1. About Pocket Linux


    The Pocket Linux Guide demonstrates how to build a small console–based GNU/Linux
    system using only source code and a couple of diskettes. It is intended for Linux
    users who would like to gain a deeper understanding of how their system works
    beneath the shroud of distribution specific features and tools.


    # 2. Prerequisite Skills


    This guide is intended for intermediate to advanced Linux users. It is not intentionally
    obscure, but certain assumptions about the readers skill level are made. Success
    with this guide depends in part on being able to perform the following tasks:


    +   * Use basic shell commands

    * Reference man and info pages

    * Build a custom Linux kernel

    * Compile source code using made and related tools


    # 3. Project Format


    The Pocket Linux Guide takes a hands-approach to learning. The guide is written
    with each chapter building a piece of an overall project. Chapters are further
    broken into sections of Analysis, Design, Construction and Implementation. This
    format is derived from Rapid Application Development (RAD) methodology. Without
    going into detail about design methodologies, the sections may be summed up as
    follows.


    +   * The Analysis section gives a high-level overview of what is to be accomplished
    in each chapter. It will introduce the tasks that need to be completed and why
    they are important to the overall system.

    * The Design section defines the source code packages, files and configuration
    necessary to address the requirements set forth in the Analysis section. Much
    of the theory of why certain system files exist and what their purpose is can
    be found here.

    * The Construction section is where the hands-on action takes place. This section
    goes into detail about building source code and configuring the system files.

    * The Implementation section will test the proper execution of the project at
    the end of each chapter. There are often a few shell commands to perform and samples
    of screened output are given.


    Readers interested in learning more about RAD may want to consult a textbook systems
    analysis and design or visit the following University of California, Davis website
    on the subject: http://sysdev.ucavis.edu/WEBADM/document/rad–stages.htm.


    # 4. Help & Support


    Readers are encouraged to visit the Pocket Linux Resource Site at http://pocket-linux.sourceforge.net/.
    The resource site is home to:


    +   * Information about the Pocket Linux mailing list.


    Introduction'
  merge: -1
  pgno: 7
- img_proc: true
