  md: '# # Chapter 9. Project Wrap Up


    # ## 9.1. Celebrating Accomplishments


    The Pocket Linux Project draws to a close we should take a moment to celebrate
    all of our accomplishments. Some of the highlights are listed below:


    +   - We have built a system, from source code only, that fully implements all
    of the commands described in the Filesystem Hierarchy Standard requirements for
    a root system.

    - We have learned how to use Internet resources to locate and download the source
    code needed to build a GNU/Linux system.

    - We have written basic system setup and shutdown scripts and configured them
    to execute in the proper runnels.

    - We have included support for multiple users on virtual consoles and implemented
    permissions on system files.

    - But most importantly, we have learned some good design techniques and project
    management skills that will enable us to tackle any future projects with ease
    and confidence.


    # ## 9.2. Planning Next Steps


    The Pocket Linux system is nearly overflowing, so there is really no room to expand
    the current root diskette to support any additional commands and features. This
    leaves us with a few choices of where to go next. We can:


    +   - Find a way to expand the current system just enough to host a small application.(For
    more information about hosting applications with Pocket Linux, see Appendix A)

    - Remove multi-user capability and some of the least used commands from the root
    disk, replacing them with utilities like tar and gzip that would be useful for
    a rescue/restore diskset.

    - Use the techniques we have learned to design and build an entire GNU/Linux system
    and install it on a more spacious hard disk partition. (For more infom about building
    a larger system, check out the GNU/Linux System Architect Toolkit at: http://architect.sourceforge.net/)


    Which ever path is chosen, we can move forward confidently, armed with the knowledge
    we need in our endeavors.'
