  md: '# Chapter 3. Saving Space


    # 3.1. Analysis


    One of the drawbacks of the prototype phase was that the diskset was not all useful.
    The only commands that worked were the ones built into the BASH shell. We could
    improve our root disk by installing commands like cat, ls, mv, rm and so on. Unfortunately,
    we are short on space. The current root disk has no shared libraries so each utility
    would have to be statically-linked just like the BASH shell. A lot of binaries
    together with a static shell would rapidly exceed the 1.44M of available disk
    space. Our main goal in this phase should be to maximize space savings on the
    root disk and pave the way for expanded functionality in the next phase.


    # 3.2. Design


    Take another look at the Bootdisk-HOWTO and notice how many utilities can be squeezed
    into a 1.44M floppy. There are three things that make this possible. The second
    is stripped binaries. And the third is the use of a compressed filesystem. We
    can use all of these techniques to save space on our root disk.


    # 3.2.1. Shared Libraries


    First, in order to use shared libraries we will need to rebuild the BASH shell.
    This time we will configure it using the --enable-static-link option. Once BASH
    is rebuilt we need to figure out which libraries it is linked with and be sure
    they are on the root disk. The ldd command makes this job easy. By typing ldd
    bash on the command–line we can see a list of all the shared libraries that BASH
    uses. As long as all libraries are copied to the root disk, the new BASH shell
    should work fine.


    # 3.2.2. Stripped Binaries


    Next, we should strip any binaries that get copied to the root disk. The manpage
    for strip does not give much description of what it does other than say, "strip
    discards all symbols from the file." It means removing pieces of a binary would
    render it useless, but this is not the case. The reason it is because a large
    number of these discarded symbols are used for debugging. While debugging symbols
    are very helpful to programmers working to improve the code, they do not for the
    average end-user other than take up disk space. And since space is a premium,
    we should definitely remove as many symbols as possible from BASH and any other
    binaries before we copy over to the ramdisk.


    The process of stripping files to save space also works with shared libraries.
    When stripping libraries it is important to use the --strip-unneeded option so
    as not to break them. Using --strip-unneeded shrinks the file size, but the symbols
    needed for relocation remain intact which is something that shared libraries need
    to function properly.


    # 3.2.3. Compressed Root Filesystem


    Finally, we can tackle the problem of how to build a compressed root filesystem.
    The Bootdisk-HOWTO suggests three ways of constructing a compressed filesystem
    using either a ramdisk, a hard drive partition or a loopback device. This project
    will concentrate on using the ramdisk approach. It seems logical'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'if the root filesystem is going to run from a ramdisk, it may as well be built
    on a ramdisk. All we have to do is create a second extended filesystem on a ramdisk
    device, mount it and copy files to it. Once the filesystem is populated with all
    the files that the root disk needs, we unmount it, compress and write it to a
    floppy.


    +   * For this work, we need to make sure the system for building has ramdisk
    support. If ramdisk is not available it is also possible to use a loopback device.
    See the Bootdisk–HOWTO for more information on using loopback devices.


    # 3.3. Construction


    This section is written using ramdisk (/dev/ram7) to build the root image. There
    is nothing particularly special about ramdisk seven and it is possible to use
    any of the other available ramdisk provided they are not already in use.


    # 3.3.1. Create a ramdisk


    ```

    bash dd if=/dev/sdc0 of=/dev/ram7 bs=1k count=409

    bash# mk2fs -m0 /dev/ram7 4096

    bash# mount /dev/ram7 /mnt

    ```


    # 3.3.2. Rebuild BASH shell


    ```

    bash# cd /usr/src/bash-3.0

    bash# make distclean

    bash# export CC="gcc" -mpu=i386

    bash# ./configure --enable-minimal-config --host=i386-pc-linux-gnu

    bash# make

    bash# strip bash

    ```


    # 3.3.3. Determine which libraries are required


    View the output of the ldd command. It should look similar to the example below.


    ```

    bash# ldd bash

    libdi.so.2 => /lib/libdi.so.2 (0x4001d000)

    libc.so.6 => /lib/libc.so.6 (0x40020000)

    /ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```


    > > Some may have a slightly different library set up. For example, you may see
    libc.so.6 => /lib/tls/libc.so.6 rather than libc.so.6 => /lib/libc.so.6 as shown
    in the example. If your ldd output does not match the example use the path given
    by your ldd command when completing the next step.


    # 3.3.4. Copy BASH and its libraries to the ramdisk


    ```

    bash# mkdir /mnt/bin

    bash# cp bash /mnt/bin

    bash# ln -s bash /mnt/bin/sh

    ```


    Chapter 3. Saving Space'
