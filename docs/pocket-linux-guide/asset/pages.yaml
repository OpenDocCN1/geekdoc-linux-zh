  md: '# # Chapter 4. Some Basic Utilities


    # ## 4.1. Analysis


    In the previous chapter it might seem we did not accomplish very much. A lot of
    energy was expended redesigning the root disk, but the functionality is basically
    the same as in the initial prototype phase. The root disk does not very much.
    But we did make significant improvements when it comes to space savings. In this
    chapter we will put that extra space to use and start the root disk with as many
    utilities as it can hold.


    The two root disks we built only had shell built–in commands like **echo** and
    **pwd**. This time it would be nice to have some of the commonly used external
    commands like **cat**, **ls**, **mkdir**, **rm** and so on the root disk. Keeping
    this in mind we can define the goals for this phase as follows:


    +   - Retain all of the functionality from the previous root disk.

    - Add some of the commonly used external commands.


    # ## 4.2. Design


    # ### 4.2.1. Determining Required Commands


    The first question that might come to mind is, "How do we know which commands
    are needed?" It is possible to start with cat and then install other commands
    as we discover a need for them. This is terribly inefficient. We need a plan or
    a blueprint for work. From this we can turn to the Filesystem Hierarchy Standard
    (FHS) available at http://www.pathname.com/hs/; The FHS dictates what commands
    should be present on a Linux system and where they should be placed in the directory
    structure.


    # ## 4.2.2. Locating Source Code


    The next question is, "Now that we know what we need, where do we get the source
    code?" One way to find the answer to this question is to check the packages. We
    can search the packages included with one of the GNU Linux distributions or use
    one of the package engines listed at http://www.linux.org/docs/html#man. One that
    should tip you off as where to find the source code for a particular command is
    the email address listed for reporting bugs. The cat manager lists bug-textutils@gnu.org.
    From this email address we can deduce that cat is part of the textutils package
    from GNU.


    # ### 4.2.3. Leveraging FHS


    So let''s look at the FHS requirements for the /bin directory. The first commands
    in the list are **cat**, **chgrp**, **chmod** and **chown**. We already know that
    cat is part of GNU''s. Using the next commands as keywords in a package search
    we discover that GNU''s fileutils for chmod, chgrp and chown are in fact. In fact
    a few of the commands in /bin come from GNU''s utils. The **date** also comes
    from a GNU package called-utils. A good way to tackle the problem of finding source
    code might be to group the commands together as shown below:


    +   - The BASH shell --- echo, false, pwd, sh, true

    - GNU textutils --- cat'
