    bash# mkdir /mnt/lib

    bash# strip --strip-unneeded -o /mnt/lib/libld.so.2 /mnt/lib/libld.so.2

    bash# strip --strip-unneeded -o /mnt/lib/libc.so.6 /mnt/lib/libc.so.6

    bash# strip --strip-unneeded -o /mnt/lib/ld-linux.so.2 /mnt/lib/ld-linux.so.2

    bash# chmod +x /mnt/lib/ld-linux.so.2

    ```


    Using strip might seem odd to strip the symbols while the file is in transit from
    the source location to the destination. What it does is the effect of stripping
    symbols from the file on the ramdisk. This has the effect of stripping symbols
    from the library on the ramdisk without altering the libraries on the development
    system. Unfortunately file permissions are lost when copying libraries which is
    why the chmod +x command is used to set the execute flag for the rootdisk''s dynamic
    loader.


