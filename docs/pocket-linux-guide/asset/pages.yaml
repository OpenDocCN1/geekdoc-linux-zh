    \ binary\n\n```\nbash# cd /usr/src/gunzip-1.2.4a\nbash# export CC=\"gcc -mcpu=i386\"\
    \nbash# ./configure --host=i386-pc-linux-gnu\nbash#\nmake\nbash# strip gzip\n\
    bash# cp gzip ~/staging/bin\nbash# ln -s gzip ~/staging/bin/gunzip\n```\n\nDon't\
