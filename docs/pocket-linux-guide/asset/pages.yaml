    \ the gzip binary.\n\n# A.3.2.3. Write a startup script to mount a compressed\
    \ floppy\n\nUse a text editor to create the following script and save it as~/staging/etc/init.d/usr_image\n\
    \n```\n#!/bin/sh\n# usr_image - load compressed images from floppy into ramdisk\
    \ and\n# mount on /usr.\n\necho -n \"Is there a compressed disk to load for /usr\
    \ [y/N]?\"\nread REPLY\nif [ \"$REPLY\" = \"y\" || \"$REPLY\" = \"Y\" ]; then\n\
    \  echo \"Please insert the usr floppy into fd0 and press <ENTER>.\"\n  read REPLY\n\
    \  echo \"Clearing /dev/raml.\"\n  dd if=/dev/zero of=/dev/raml bs=1k count=4096\n\
    \  echo \"Loading compressed image from /dev/fd0 into /dev/raml...\"\n  (dd if=/dev/sd0\
    \ | gunzip -q) >>/dev/null\n  fsck -fp /dev/raml\n  if [ $? -ne 0 ]; then\n  \
    \  echo \"Filesystem errors on /dev/raml! Manual intervention required.\"\n  else\n\
    \    echo \"Mounting /usr.\"\n    mount /dev/raml /usr\n  fi\nfi\n# end of usr_image\n\
    ```\n\nConfigure the script to run right after it is mounted.\n\n```\nbash# ln\
