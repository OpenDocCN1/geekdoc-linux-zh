  md: "# 5.2.4.2./etc/mtab\n\nThe /etc file presents a unique challenge, because it\
    \ does not contain static information like fstab. The mtab file tracks mounted\
    \ filesystems and therefore its contents change from time to time. We are particularly\
    \ interested in the state of mtab when the system starts up, before any filesystems\
    \ are mounted. At this point /etc/mtab should be empty so we may configure a startup\
    \ script to create an empty /etc/mtab before any filesystems are mounted. But\
    \ it is not possible to create files in the /etc directory because is read-only\
    \ at startup. This creates a paradox. We cannot create an empty mtab, because\
    \ the filesystem is not mounted as writable and we should not mount any filesystems\
    \ until we have created an empty mtab. In order to sidestep this problem we need\
    \ to do the following:\n\n+   1. Read as-write, use the -n option so that mount\
    \ does not attempt to write an entry to\n   /etc/mtab which is read-only at this\
    \ point.\n2. Create an empty /etc/mtab file now that the filesystem is writable.\n\
    3. Read as read-write again, this time using the -f option so that an entry is\
    \ written into\n   /etc/mtab, but is not actually mounted a second time.\n\n#\
    \ 5.2.4.3. Device files\n\nThe only thing to do is to create device files. We\
    \ need /dev/ram0, because that is where the root filesystem is located. We also\
    \ need /dev/fd0 to mount other floppy disks and /dev/null for use by some of the\
    \ commands.\n\n# 5.3. Construction\n\n# 5.3.1. Install utilities from e2fsprogs\n\
    \nDownload the e2fsprogs source code package from http://sourceforge.net/projects/e2fsprogs/\n\
    \n```\nbash\ncd /usr/src/e2fsprogs-1.35\nbash export CC=\"gcc -mpu=i386\"\nbash\
    \ ./configure --host=i386-pc-linux-gnu\nbash make\nbash cd e2fsck\nbash cp e2fsck.shared\
    \ /staging/sbin/e2fsck\nbash ln -s e2fsck /staging/sbin/fsck.ext2\nbash cd ../misc\n\
    bash cp fs m2fs /staging/bin\nbash ln -s m2fs /staging/bin/mkfs.ext2\n```\n\n\
    # 5.3.2. Install utilities from util-linux\n\nGet the latest util-linux source\
    \ from http://ftp.lin.net.pl/linux-kernel/local/utils/util-linux/\n\n```\nbash\
    \ cd /usr/src/util-linux-2.12lh\nUse a text editor to make the following changes\
    \ to MCONFIG:\n```\n\n+   • Change \"CPU=\\$(shell uname -name)\" to \"CPU=i386\"\
    \n• Change \"HAVE_SHADOW=yes\" to \"HAVE_SHADOW=no\"\n\n```\nbash ./configure\n\
    ```\n\nChapter 5. Checking and Monitoring Disks\n\n23"
