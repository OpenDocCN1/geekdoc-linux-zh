- pgno: 181
  md: '# Interpreting CVU "Unknown" Output Messages Using Verbose Mode


    Action: Multicast communication must be enabled on all cluster nodes. To determine
    if the multicast requirements are met, run the multicast test tool multicasttest.pl.
    You might also need to install patches.


    Contact My Oracle Support for more information, and to obtain the multicast tool
    and patches.


    See Also: Section 2.7.4, "Multicast Requirements for Networks Used by Oracle Grid
    Infrastructure."


    # Timed out waiting for the CRS stack to start


    Cause: If a configuration issue prevents the Oracle Grid Infrastructure software
    from installing successfully on all nodes, you may see error messages such as
    "Timed out for the CRS stack to start," or you may notice Oracle Clusterware-managed
    resources were not create on some nodes after you exit the installer. You may
    also notice that resources have a status other than ONLINE.


    Action: Deconfigure the Oracle Grid Infrastructure installation without removing
    binaries, and review log files to determine the cause of the configuration issue.
    After you have fixed the configuration issue, rerun the scripts when using to
    install Oracle Clusterware.


    See Also: Section 6.5, "Deconfiguring Oracle Clusterware Without Removing Binaries."


    # YPBINDPROC_DOMAIN: Domain not bound


    Cause: This error can occur during postinstallation when the public network interconnect
    for a node is pulled out, and the VIP does not fail over. Instead, the node and
    users are unable to log into the system. This error occurs when the Oracle home,
    listener.ora, Oracle log files, or any action scripts are located on an NAS device
    or NFS mount, and the name service cache daemon nscd has not activated.


    Action: Enter the following command on all nodes in the cluster to start the nscd
    service:


    ```

    /bin/service nscd start

    ```


    # A.1.1 Other Installation Issues and Errors


    For additional help in resolving error messages, refer to My Oracle Support, the
    note with ID 136763.1 contains some of the most common installation issues for
