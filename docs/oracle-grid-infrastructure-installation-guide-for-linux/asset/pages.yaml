  md: '# Checking the Hardware Requirements


    **Note:** On Linux, Hugepages feature allocates non-swappable memory with large
    page tables using memory-mapped files. If you enable Hugepages, then should deduct
    the memory allocated to HugePages from the RAM before calculating swap space.


    If you encounter an OUI error indicating inadequate swap space size, but your
    swap space meets the requirements listed here, then you can ignore that error.


    # 2.6.3.1 64-bit System and Linux on system Memory Requirements


    Each system must meet the following memory requirements:


    +   At least 2.5 GB of RAM for Oracle Grid Infrastructure for a Cluster installations,
    including installations where you plan to install Oracle RAC.


    +   Swap space equivalent to the multiple of the available RAM, as indicated in
    the following table:


    Table 2-1 Swap Space Required for 64-bit Linux and Linux on System

    | Available RAM | Swap Space Required |

    | --- | --- |

    | Between 2.5 GB and 32 GB | Equal to the size of RAM |

    | More than 16 GB | 16 GB of RAM |


    # 2.6.3.2 Memory Requirements


    Each system must meet the following memory requirements:


    +   At least 2.5 GB of RAM for Oracle Grid Infrastructure for a Cluster installations,
    including installations where you plan to install Oracle RAC.


    +   Swap space equivalent to the multiple of the available RAM, as indicated in
    the following table:


    Table 2-2 Swap Space Required for Linux

    | Available RAM | Swap Space Required |

    | --- | --- |

    | Between 2.5 GB and 16 GB | Equal to the size of RAM |

    | More than 16 GB | 16 GB |


    # 2.6.4 Checking Server Hardware and Memory Configuration


    To ensure that each system meets these requirements, follow these steps:


    +   1. To determine the physical RAM size, enter the following command:


    ```

    # grep MemTotal /proc/meminfo

    ```


    If the size of the physical RAM installed in the system is less than the required
    size, then you must install more memory before continuing.


    +   2. To determine the size of the configured swap space, enter the following
    command:


    ```

    # grep SwapTotal /proc/meminfo

    ```


    If necessary, refer to your operating system documentation for information how
    to configure additional swap space.'
