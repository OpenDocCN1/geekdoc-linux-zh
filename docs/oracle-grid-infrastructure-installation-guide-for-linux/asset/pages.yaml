  md: '**Note:** Oracle Grid Infrastructure installations require SSH, because Oracle
    configuration assistants use SSH for configuration options from local remote nodes.
    Oracle Enterprise Manager also uses SSH. RSH is no longer supported for internode
    communication.


    You can configure SSH from the OUI interface during installation for the user
    account running the installation. The automatic configuration creates passwordless
    SSH connectivity between all cluster nodes. Oracle recommends that you use the
    automatic procedure if possible.


    To enable the script, you must remove stty commands from the profiles of your
    Oracle software installation owners, and remove other security measures that are
    triggered during a login, and that generates messages to the terminal. mail checks,
    and other displays using the SSH configuration script that is built into the Oracle
    Universal Installer. If they are not disabled, SSH must be configured manually
    before an installation can be.


    In rare cases, Oracle Clusterinstallation may fail during the "Attach-Home" operation
    when the remote node closes the SSH connection. To avoid this problem, set the
    following parameter in the SSH daemon configuration file /etc/ssh/sshd_config
    on all cluster nodes to set the timeout to unlimited:


    ```

    LoginGraceTime 0

    ```


    **See Also:** [Preventing Installation Errors Caused by Terminal Output Commands](#)
    for information about how to use stty commands in user profiles


