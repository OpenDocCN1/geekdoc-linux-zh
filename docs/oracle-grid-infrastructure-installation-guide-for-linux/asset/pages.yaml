- pgno: 124
  md: 'Note: You do not have to use the same storage mechanism for Oracle Clusterware,
    Oracle Database files and recovery files. You can use a shared file system for
    one file type and ASM for the other.

    If you choose to enable automated backups and you do not have a shared file system
    available, then you must choose ASM for recovery file storage.


    If you enable automated backups during the installation, then you can select Oracle
    ASM as the storage mechanism for recovery files by specifying an Oracle Automatic
    Storage Management disk group for the Fast Recovery Area. If you select a noninteractive
    installation mode, then by default it creates one disk group and stores the OCR
    and voting disk files. If you want to have any other disk groups in a subsequent
    database install, then you can choose interactive mode, or run ASMCA (or a command
    line tool) to create the appropriate disk groups before starting the database
    install.


    +   2. Choose the Oracle ASM redundancy level to use for the Oracle ASM disk group.

    The redundancy level that you choose for the Oracle ASM disk group determines
    how Oracle ASM mirrors files in the disk group and determines the number of devices
    and amount of free space that you require, as follows:


    +   External redundancy


    An external redundancy disk group requires a minimum of one disk device. The effective
    disk space in an external redundancy disk group is the sum of the disk space in
    all of its devices.


    For Clusterware files, External redundancy disk groups provide 1 voting file,
    and 1 OCR, with no copies. You must use an external technology for mirroring for
    high availability.


    Because Oracle ASM does not mirror data in an external redundancy disk group,
    Oracle recommends that you use external redundancy with storage devices such as
    RAID, or other devices that provide their own protection mechanisms.


    +   Normal redundancy


    In a normal redundancy disk group, to increase performance and reliability, Oracle
    ASM by default uses two-way mirroring. A normal redundancy disk group requires
    a minimum of two devices (or two failure groups). The effective disk space in
    a normal redundancy disk group is half the sum of the disk space in all of its
    devices.


    For Clusterware files, Normal redundancy disk groups provide 3 voting disk files,
    1 OCR and 2 copies (one primary and one secondary mirror). With redundancy, the
    cluster can survive the loss of one failure group.


    For most installations, Oracle recommends that you select normal redundancy.


    +   High redundancy


    In a high redundancy disk group, Oracle ASM uses three-way mirroring to increase
    performance and provide the highest level of reliability. A high redundancy disk
    group requires a minimum of three disk devices (or three failure groups). The
    effective disk space in a high redundancy disk group is one-third the sum of the
    disk space in all of its devices.'
  merge: -1
  img_proc: true
