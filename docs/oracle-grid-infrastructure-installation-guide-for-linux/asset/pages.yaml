- pgno: 177
  md: '# General Installation Issues


    +   - Failed to initialize ocrconfig

    - INS-32026 INSTALL_COMMON_HINT_DATABASE_LOCATION_ERROR

    - MEMORY_TARGET not supported on this system

    - Nodes available for selection from the OUI Node Selection screen

    - Node nodename is unreachable

    - PROT-8: Failed to import data from specified file to the cluster registry

    - PRVE-0038: The SSH LoginGraceTime setting, or fatal: Timeout before authentication

    - root.sh or root.sh Script Failed for the Second Node Due to Multiple Instances

    - Timed out waiting for the CRS stack to start

    - YBINDPROC_DOMAIN: Domain not bound

    - Other Installation Issues and Errors


    An error occurred while trying to get the disks


    Cause: There is an entry in /etc/oracle pointing to a non-existent Oracle home.
    The OUI log file could showing the following: "java.io.IOException: /home/oracle/OraHome/bin/kfld:
    not found"


    Action: Remove the entry in /etc/oracle pointing to a non-existent Oracle home.


    # CSR-5018:(CLSCN00037) Removed unused HAIP route:


    Cause: Typically, this error indicates something (usually Zero Configuration Networking,
    zeroconf) has created the route that is conflicting with the HAIP code. The error
    indicates that the Oracle software has removed the route to ensure appropriate
    stack functioning.


    Action: The Zero Configuration Networking feature should be disabled using Oracle
    Clusterware, as this feature may cause communication issues between cluster nodes.


    To disable Zero Configuration Networking:


    +   1. Log in as root.

    2. Change directory to /etc/sysconfig

    3. Create a copy of /etc/sysconfig/network.old for example:

    # cp network network_old

    4. Use a text editor to open the file /etc/sysconfig/network.

    5. Check the file for value of NOZERCONF to confirm that it is set to yes. If
    you do not have this parameter in the file, then append the following entry to
    the file:

    NOZERCONF=yes

    Save the file after updating this.

    6. Restart the network services. For example:

    # network restart

    7. Repeat this process on each cluster node.


    A-2 Oracle Grid Infrastructure Installation Guide'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Could not execute auto check for display colors using command /usr/X11R6/bin/xdpyinfo


    Cause: Either the DISPLAY variable is not set, the user running the installation
    is not authorized to open an X window. This can occur if you run the installation
    from a remote terminal, or if you use a su command to change from a user who is
    authorized to open an X window to a user account that is not authorized to open
    an X window on the display, such a lower-privileged user opening windows on the
    root''s console display.


    Action: Run the command echo $DISPLAY to ensure that the variable is set to the
    correct visual or the correct host. If the display variable is set correctly then
    ensure that you are logged as a user authorized to open an X window, and run the
    command xhost + to allow any user to open an X window.


    If you are logged in on the server console as root, and used the su-command to
    change to the Oracle Grid Infrastructure installation owner, then log out of the
    server, and log back in as the grid owner.


    # CRS-5823:Could not initialize agent framework.


    Cause: Initialization of Oracle Grid Infrastructure fails when you run root.sh.
    Oracle Grid Infrastructure fails to start because the host entry is missing from
    the hosts file.


    The Oracle Grid Infrastructure alert.log shows the following:


    ```

    /oracle/app/grid/log/oraoagent.bin[11392]CRS-5823:Could not initialize agent framework.
    Details at <CRSAG00120>:

    /oracle/app/grid/log/node01/agent/crsd/oraoagent_root/oraoagent_root.log

    2010-10-04 12:46:25:857:Resource ''ora.crsd'' has failed on server ''node01''.

    ```


    You can verify this as the cause by checking crsdOUT.log file, and finding the
    following:


    Unable to resolve address for localhost:2016

    Runtime exiting

    Fatal error: eONS: eonsapi.c Aug 6 June 2009 02:53:02


    Action: Add the local host entry in the hosts file.


    Failed to connect, Connection refused by user, or Can''t display

    Cause: These are typical of X Window display errors on Windows or Unix systems,
    xhost is not properly configured, or where you are running as a user account that
    is different from the account you used with the startx command to start the X
    server.


    Action: In a local terminal, log in as the user that started the X Window session,
    and enter the following command:


    ```

    $ xhost fullyQualifiedRemoteHostname

    For example:

    $ xhost example.example.com

    ```


    Then, enter the following commands, where hostname is the name and IP address
    of your workstation.


    Bourne, Bash, or Korn shell:


    ```

    $ DISPLAY=hostname:0.0

    $ export DISPLAY

    ```'
  merge: -1
  img_proc: true
