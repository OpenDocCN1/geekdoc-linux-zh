- pgno: 232
  md: '# F.11 Checking Cluster Health Monitor Repository Size After Upgrading


    If you are upgrading from a prior release using IPD/OS to Oracle Grid Infrastructure
    release 2 (11.2.0.2 and later), then you should review the Cluster Health Monitor
    repository size (the CHM repository). Oracle recommends that you view your CHM
    repository needs, and enlarge the repository size if you want to maintain a larger
    CHM repository.


    > Note: Your previous IPD/OS repository is deleted when you install Oracle Grid
    Infrastructure, and you run the root.sh script on each node.


    Cluster Health Monitor is not available with IBM: Linux on System z configurations.


    By default, the CHM repository size for release 11.2.0.2 and later is a minimum
    of either 1GB or 3600 seconds (1 hour). For release 11.2.0.2 and 11.2.0.3, the
    CHM repository is one Gigabyte (1 GB), regardless of the size of the cluster.


    To enlarge the CHM repository, use the following command syntax, where RETENTION_TIME
    is the size of CHM repository in number of seconds:


    ```

    oclumon manage -repos resize RETENTION_TIME

    ```


    The value for RETENTION_TIME must be more than 3600 (one hour) and less than 259200
    (three days). If you enlarge the CHM repository size, then you must ensure that
    there is local space available for the repository size you select on each node
    of the cluster. If there is not sufficient space available, then you can move
    the repository to shared storage.


    For example, set the repository size to four hours:


    ```

    $ oclumon manage -repos resize 14400

    ```'
  merge: -1
