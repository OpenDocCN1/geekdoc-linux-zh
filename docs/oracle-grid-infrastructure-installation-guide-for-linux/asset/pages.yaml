  md: 'Obtain realm authentication information if you have a proxy realm on your network,
    OUI attempts to download updates. You are prompted to provide a proxy realm, and
    user authentication information to access the Internet through the proxy service.
    If you have a proxy realm configured, then be prepared to provide this information.
    If you do not have a proxy realm, then you can leave the proxy authentication
    fields blank.


    Identify shared storage for Oracle Cluster files and prepare storage if necessary


    During installation, you are asked to provide paths for the following Oracle Cluster
    files. These files must be shared across all nodes of the cluster, either on Oracle
    ASM, or on a supported file system:


    +   - Voting disks are files that Oracle Cluster uses to verify cluster node membership
    and status.

    - Voting disk must be owned by the user performing the installation (grid or oracle),
    and must have permissions set to 640.

    - Oracle Cluster Registry files (OCR) contain cluster and database configuration
    information for Oracle Cluster.


    Before installation, OCR files must be owned by the user performing the installation
    (grid or oracle). That user must use installas as their primary group. During
    installation, OUI changes ownership of the OCR files to root.


    If your system does not have external storage redundancy, then recommends that
    you provide two additional locations for the OCR disk, and two additional locations
    for the voting disks, for a total of six partitions (three for OCR, and three
    for voting disks). Creating redundant storage locations protects the OCR and voting
    disk in the event of a failure. To protect your cluster, the storage locations
    for the copies of the OCR and voting disks should completely separate paths, controllers,
    and so that no single point of failure is shared by storage locations.


    When you select to store the OCR on Oracle ASM, the default configuration is to
    create the OCR on one Oracle ASM disk group. The disk group with normal or high
    redundancy, then the OCR is protected from disk failure.


    To protect the OCR from logical disk failure, create another Oracle ASM disk group
    after installation and add the OCR to the second disk group using the orconfig
    command.


    > See Also: Chapter 2, "Advanced Installation Oracle Grid Infrastructure for a
    Cluster Preinstallation Tasks" and Oracle Automatic Storage Management Administrator’s
    Guide for information adding disks to groups


    # Ensure cron jobs do not run during cluster installation


    If the installer is running when daily cron jobs start, you may encounter unexplained
    installation problems if your cron job is performing cleanup, and temporary files
    are deleted before the installation is finished. Oracle recommends that you complete
    installation before daily cron jobs run, or disable daily cron jobs that perform
    cleanup until after the installation is completed.'
