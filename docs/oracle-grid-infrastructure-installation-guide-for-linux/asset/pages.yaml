  md: '# Shared File System Storage Configuration


    **Note:** The intr and nointr mount options are deprecated with Oracle Linux deprecated
    in Oracle Unbreakable Enterprise Linux and Oracle Linux kernels, 2.6.32 and later.


    If you have Grid Infrastructure binaries on an NFS mount, you must include the
    suid option.


    The NFS-client mount options for Oracle Clusterware files (OCR and voting disk
    files) are:


