  md: '# Reviewing Oracle Grid Infrastructure Storage Options


    +   - You can put Oracle Database binaries and administrative files (for example,
    trace files) on Oracle ACFS.


    +   - Oracle ACFS provides a general purpose file system for other files.


    # 3.1.4 General Storage Considerations for Oracle Grid Infrastructure and Oracle
    RAC


    For all installations, you must choose the storage option for Oracle Grid Infrastructure
    (Oracle Clusterware and Oracle ASM), and Oracle Real Application Clusters (Oracle
    RAC) databases. To enable automated backups during the installation, you must
    also choose the storage option to use for recovery files (the Fast Recovery Area).
    You do not have to use the same storage option for each file.


    # 3.1.4.1 General Storage Considerations for Oracle Clusterware


    Oracle Clusterware voting disks are used to monitor node status, and Oracle Cluster
    Registry (OCR) files contain configuration information about the cluster. You
    can place voting disks and OCR files either in an Oracle ASM disk group, or on
    a cluster system or shared file system. Storage must be shared; any node that
    does not have access to an absolute majority of voting disks (more than half)
    will be restarted.


    # 3.1.4.2 General Storage Considerations for Oracle RAC


    Use the following guidelines when choosing the storage options for each file type:


    +   - You can choose any combination of the supported storage options for each
    file type that you satisfy all requirements for the chosen storage options.


    +   - If you plan to install an Oracle RAC home on a shared OCFS2 location, then
    you must upgrade OCFS2 to at least version 1.4.1, which supports writable mmaps.


    +   - Oracle recommends you choose Oracle ASM as the storage option for database
    and recovery files.


    +   - For Standard Edition Oracle RAC installations, Oracle ASM is the only storage
    option for database or recovery files.


    +   - If you intend to use Oracle ASM with Oracle RAC, and you are configuring
    a new Oracle ASM instance, then your system must meet the following conditions:


