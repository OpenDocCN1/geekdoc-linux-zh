- pgno: 188
  md: '# Storage Configuration Issues


    The feature that enables cluster nodes to be removed and added again, so that
    they can be restored from the remaining nodes in the cluster, is called Grid Plug
    and Play (GnP). Grid Plug and Play eliminates per-node configuration data and
    the need for explicit add and delete nodes. This allows a system administrator
    to take a template system image and run it on a new node with no configuration.
    This removes manual operations, reduces the opportunity for errors, and encourages
    configurations that can be changed easily. Removal of the per-node configuration
    makes the nodes easier to replace, because they do not need to contain individually-managed
    state.


    Grid Plug and Play reduces the cost of installing, configuring, and managing database
    nodes by making their per-node state disposable. It allows nodes to be easily
    replaced with regenerated state.


    Initiate recovery of a node using add syntax to the following, where lastnode
    is the node that you are adding back to the cluster:


    If you are using Grid Naming Service (GNS):


    ```

    $ ./addnode.sh "CLUSTER_NEW_NODES=lastnode"

    ```


    If you are not using GNS:


    ```

    $ ./addnode.sh -CLUSTER_NEW_NODES=[lastnode] CLUSTER_NEW_VIRTUAL_HOSTNAMES=[lastnode-vip"

    ```


    Note that you require access to root to be able to run the root.sh script on the
    node you need to restore, recreate OCR keys and perform other configuration tasks.
    When the system prompts you to overwrite your information in /usr/local/bin, accept
    the default (n):


    The file "dbhome" already exists in /usr/local/bin. Overwrite it? (y/n) [n]

    The file "oraenv" already exists in /usr/local/bin. Overwrite it? (y/n) [n]

    The file "oraenm" already exists in /usr/local/bin. Overwrite it? (y/n) [n]:


