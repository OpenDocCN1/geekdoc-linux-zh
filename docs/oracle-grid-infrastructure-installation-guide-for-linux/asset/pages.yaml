- pgno: 31
  md: '# About Installing the Linux Operating System


    This section provides information about installing a supported Linux distribution.
    It contains the following topics:


    +   - Completing a Minimal Linux Installation

    - Completing a Default Linux Installation

    - About Oracle Linux and the Unbreakable Enterprise Kernel

    - About the Oracle Preinstallation and Oracle Validated RPMs

    - Installing the Oracle Preinstallation or Oracle Validated RPM with ULN Support

    - Installing the Oracle Preinstallation RPM From DVDs or Images

    - Using Ksplice for a Zero Downtime Update


    # 2.1.1 Completing a Minimal Linux Installation


    To complete a Minimal installation, select one of the minimal installation options
    (either a custom installation where you select the Minimal option from Package
    Group Selection, or where you delect all packages except for the Base pack). This
    installation marks RPMs for database installation, so you must use an RPM package
    for your Oracle Linux release to install the required packages. The package you
    use depends on your Linux release, and your support status with Unbreakable Linux
    Network (ULN).


    > Note: The Oracle Preinstallation RPM installs the X11 client libraries, but
    does not install the Windows System server packages. To use graphical user interfaces
    such as OUI, configuration assistants, and Oracle Enterprise Manager, set the
    display to a system with X Window server packages.


    Refer to the following URL for documentation regarding installation of a reduced
    set of packages:


    https://support.oracle.com/CSP/main/article?cmd=show&type=NOT&id=728346.1


    > Note: If you are not a member of Unbreakable Linux Network or Red Hat Support
    network, and you are a Oracle Support customer, then you can download instructions
    to configure a script that documents installation of a reduced set of packages:


    https://support.oracle.com/CSP/main/article?cmd=show&type=NOTid=579101.1


    You can also search for "Linux reduced set of packages" to locate the instructions.


    SSH is required for Oracle Grid Infrastructure installation. OpenSSH should be
    included in the Linux distribution minimal installation. To confirm that SSH packages
    are installed, enter the following command:


    ```

    # rpm -qa | grep ssh

    ```


    If you do not see a list of SSH packages, then install those packages for your
    Linux distribution.


    2-2 Oracle Grid Infrastructure Installation Guide'
  merge: -1
  img_proc: true
