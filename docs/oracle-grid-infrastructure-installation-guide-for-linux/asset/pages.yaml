    # 3.2.7 Checking NFS Mount and Buffer Size Parameters for Oracle RAC


    If you have NFS mounts, you must mount NFS volumes for storing database files
    with special mount options on each node that has an Oracle RAC instance. When
    mounting an NFS file system, Oracle recommends that you use the same mount options
    as your NAS used when certifying the device. Refer to your device documentation
    or contact your vendor for about recommended mount-options.


    Update the /etc/fstab file on each node with an entry similar to the following:


