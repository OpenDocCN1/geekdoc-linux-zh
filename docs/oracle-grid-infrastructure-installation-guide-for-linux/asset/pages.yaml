- pgno: 149
  md: '> Note: If you configure IP addresses manually, then avoid changing host names
    after you complete the Oracle Grid Infrastructure installation, including adding
    or deleting domain qualifications. A node with a new host is considered a new
    host, and must be added to the cluster. A node under the old name will appear
    to be there until it is removed from the cluster.


    When you enter the public name, use the primary host name of each node. In other
    words, use the name displayed by the `hostname` command.


    In addition:


    +   Provide a cluster name with the following characteristics:

    * It must be globally unique throughout your host domain.

    * It must be at least one character long and less than equal to 15 characters
    long.

    * It must consist of the same character set used for host names, in accordance
    with RFC 1123: Hyphens (-), and single-byte alphanumeric characters (a to z, A
    to Z, and 0 to 9). If you use third-party vendor clusterware, then Oracle recommends
    you use the cluster name.


    If you are not using Grid Naming (GNS), then determine a virtual host name for
    each node. A virtual host is a public name used to reroute requests to the node
    if the node is down. Oracle Database VIPs for client-database connections, the
    VIP address must be publicly accessible. Oracle recommends that you provide a
    name in the format `hostname-vip`.


    +   Provide SCAN addresses for client access to the cluster. These addresses should
    be configured as round robin addresses on the domain name service (DNS). Oracle
    recommends that you supply three SCAN addresses.


    > Note: The following is a list of additional information about node IP addresses:

    * For the local node only, OUI automatically fills in public and VIP fields. If
    your system uses vendor clusterware, then OUI may fill additional fields.

    * Host names and virtual hosts are not domain-qualified. If you provide a domain
    in the address field during installation, then OUI removes the domain from the
    address.

    * Interfaces identified as private for private IP addresses should not be accessible
    as public interfaces. Using public interfaces for Cache Fusion can cause performance
    problems.


    +   Identify public and private interfaces. OUI configures interfaces for use
    by public and virtual IP addresses, and configures private IP addresses on interfaces.


    The subnet that private interfaces use must connect all the nodes you intend to
    have as cluster members.'
