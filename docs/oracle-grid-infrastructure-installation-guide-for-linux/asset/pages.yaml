    # 2.1.7 Using Ksplice to Perform a Zero Downtime Update


    Ksplice Uptract provides Linux security and bug fix updates, repackaged in a form
    that allows these updates to be applied without restarting the kernel.


    To use Ksplice Uptract:


    +   Obtain or verify your Oracle Linux premium subscription from Unbreakable Linux
    Network:


    ```

    https://linux.oracle.com

    ```


    +   Log in as root.


    +   Ensure that you have access to the Internet on the server where you want to
    use Ksplice. If you are using a proxy server, set the proxy server and port values
    in the shell with commands similar to the following:


    ```

    # export http_proxy=http://proxy.example.com:port

    # export https_proxy=http://proxy.example.com:port

    ```


    +   Download the Ksplice Uptract repository RPM package:


    ```

    https://www.kspline.com/yum/uptract/ol/ksplice-uptract-release.noarch.rpm

    ```


    +   Run the following commands:


    ```

    rpm -i ksplice-uptract-release.noarch.rpm

    yum yum install uptract

    ```


    +   Open /etc/uptract/uptract.conf with a text editor, edit your premium access
    key, and save the file. You must use the same access key for all of your systems.


    +   Run the following command to carry out a zero downtime update of your kernel:


    ```

    uptract-upgrade -y

    ```


    See Also:


    +   The Ksplice Uptract website for more information:


    ```

    http://www.kspline.com

    ```


    +   Oracle Ksplice for Oracle Linux:


    ```

    http://oss.oracle.com/ksplice/docs/ksplice-quickstart.pdf

    ```


