    # 5.2 Tuning Semaphore Parameters


    Refer to the following guidelines only if the default semaphore parameter values
    are too low to accommodate all Oracle processes:


    > Note: Oracle recommends that you refer to the operating system documentation
    for more information about setting semaphore parameters.


    +   1. Calculate the minimum total semaphore requirements using the following
    formula:

    - 2 * sum (process of all database instances on the system) + overhead for background
    processes + systemwide and other application requirements

    - 2. Set semms (total semaphores) to this total.

    - 3. Set semml (semaphores for each set) to 250.'
