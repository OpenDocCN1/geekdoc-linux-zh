- pgno: 117
  md: '# 3.2.5 Configuring Storage NFS Mount and Buffer Size Parameters


    If you are using NFS for the Grid home or Oracle RAC home, then you must set up
    the NFS mounts on the storage so that they allow root on the clients to be considered
    root instead of being mapped to an anonymous user, and allow root the client server
    to create files on the NFS filesystem that are owned by root.


    On NFS, you can obtain root access for writing to the storage by enabling no_root_squash
    on the server side. For example, to set up Oracle Clusterware file storage in
    the path /vol/grid, with nodes node1, node2, and node3 in mycluster.example.com,
    add a line similar to the following for the /etc/exports file:


    ```

    /vol/grid/ node1.mycluster.example.com (rw,no_root_squash)

    node2.mycluster.example.com (rw,no_root_squash) node3.mycluster.example.com (rw,no_root_squash)

    ```


    If the domain or DNS is such that no unauthorized system can obtain an IP address
    on it, then you can grant root access by domain, rather than specifying particular
    cluster nodes:


    For example:

    /vol/grid/ *.mycluster.example.com (rw,no_root_squash)


    Oracle recommends you use a secure DNS or domain, and grant root access to cluster
    nodes using the domain, as this syntax allows you to add or remove nodes without
    the need to reconfigure the NFS server.


    If you use Grid Naming Service (GNS), then the subdomain allocated for resolution
    by DNS is within the cluster domain. Any server without a correctly signed Grid
    Plug and Play (GnP) profile cannot join the cluster, so an unauthorized system
    cannot obtain or use names inside the GNS subdomain.


    > Caution: Granting root access by domain can be used to obtain unauthorized access
    to systems. System administrators should refer to their operating system documentation
    for the risks associated with no_root_squash.


    After changing /etc/exports, reload the file system mount using the following
    command:


    ```

    # /usr/sbin/exportfs -av

    ```


    # 3.2.6 Checking NFS Mount and Buffer Size Parameters for Oracle Clusterware


    On the cluster nodes, you must set the values for the NFS buffer size parameters
    rsize and wsize to 32768.


    The NFS client-side mount options for binaries are:


    ```

    rw,bg,hard,nointr,tcp,vers=3,time=600,rsize=32768,wsize=32768,actime=0

    ```'
  merge: -1
