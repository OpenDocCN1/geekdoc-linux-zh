  md: 'You can upgrade Oracle Automatic Storage Management (Oracle ASM) 11g release
    1 (11.1) without shutting down an RAC database by performing a rolling upgrade
    of individual nodes, or of nodes in the cluster. However, if you have a standalone
    database on a cluster that uses Oracle ASM, you must shut down the standalone
    database before upgrading. If you are upgrading from Oracle ASM 10g, you must
    shut down the entire ASM cluster to perform the upgrade.


    If you have an existing ASM installation, then review Oracle upgrade documentation.
    The location of the ASM home changes in this release, and you may want to consider
    other configuration changes to simplify or customize storage administration. If
    you have an existing ASM home from a previous release, then it should be used
    by the same user that you plan to use for upgrade Oracle Clusterware.


    During rolling upgrades of the operating system, using different operating system
    binaries when both versions of the operating system are certified with the Oracle
    Database release you are using,


    > Note: Using mixed operating system versions is only supported for the duration
    of an upgrade, over the period of a few hours. Oracle Clusterware does not support
    nodes that have processors with different instruction set architectures (ISAs)
    in the same cluster. Each node must be compatible with the other nodes in the
    cluster. For example, you cannot have one node using an Intel 64 processor and
    another node using an IA-64 (Itanium) processor in the same cluster. You could
    have one node using an Intel 64 processor and another node using an AMD4 processor
    in the same cluster because the processors use the x86-64 ISA and run the same
    version of Oracle software.


    Your cluster can have nodes with CPUs of different speeds and sizes, but Oracle
    recommends that you use nodes with the same hardware configuration.


    To find the most recent software updates, and to find best practices regarding
    preupgrade, postupgrade, and interoperability, refer to "Oracle Upgrade Companion."
    "Oracle Upgrade Companion" is available through Note 78535.1 on My Oracle Support:


    https://support.oracle.com


