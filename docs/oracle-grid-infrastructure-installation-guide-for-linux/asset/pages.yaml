  md: '# Creating Groups, Users, and Paths for Oracle Grid Infrastructure


    2.5.5.1.2 Database Groups for Job Role Separations Installations The following
    operating system groups and users are required if you are installing Oracle Database:


    +   - The OSDB group (typically, dba)


    You must create this group the first time you install Oracle Database software
    on the system. This group identifies operating system accounts that have database
    administrative privileges (SYSDBA privilege). If you do not separate OSDB, OSOPER
    and OSAM groups for the Oracle ASM instance, operating system accounts that have
    the SYSOPER and SYSASM privileges must be members of this group. The name used
    in code examples is dba. If you do not designate a separate group as the OSAM
    group, then the OSDB group you define is also by default the OSAM group.


    To specify a group name other than the default dba group, you must choose the
    Advanced installation type to install the software or start Oracle Universal Installer
    (OUI) as a user who is not a member of this group. In this case, OUI prompts you
    to specify the name of the group.


    Members of the OSDB group formerly were granted SYSASM privileges on Oracle ASM
    instances, including mounting and dismounting disks. This privilege is removed
    with Oracle Grid Infrastructure release 12, if different operating system groups
    are designated as the OSDB and OSAM groups. If the same group is used for both
    OSDB and OSASM, then the privilege is retained.


    +   - The OSOPER group for Oracle Database (typically, oper)

    This is an optional group. Create this group if you want a separate group of operating
    system users with a limited set of database administrative privileges (SYSOPER
    privilege). By default, members of the OSDB group also have privileges granted
    by the SYSOPER privilege.


    To use the OSOPER to create a database group with fewer privileges than the default
    dba group, you must choose the Advanced installation type to install the software
    or start OUI as a user who is not a member of the dba group. In this case, OUI
    prompts you to specify the name of the group. The usual name for this group is
    oper.


    2.5.5.1.3 ASM Groups for Job Role Separations SYSASM is a new system group that
    enables the separation of Oracle storage management from SYSDBA. With Oracle Automatic
    Storage Management Release 12 (11.2), members of the OSDB group are not granted
    SYSASM privileges, unless the operating system group designated as the OSAM group
    is the same group designated as the OSDB.


    Select operating system groups as the operating system authentication groups for
    Oracle ASM. Before you start OUI, create the following groups and users for Oracle
    ASM:


    +   - The Automatic Storage Management Group (typically, asmadmin)

    This is a required group. Create this group as a separate group if you want to
    have separate administration privilege groups for Oracle ASM and Oracle Database
    administrators. In Oracle documentation, the operating system group whose members
    are granted privileges is called the OS group, and in code examples, where there
    is a group specially created to grant this privilege, it is referred to as asmadmin.


    If you have multiple databases on your system, and use multiple OSDB groups so
    that you can provide separate SYSDBA privileges for each database, then you


