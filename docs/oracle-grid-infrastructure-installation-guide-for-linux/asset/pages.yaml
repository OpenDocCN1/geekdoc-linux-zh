- pgno: 171
  md: '> Caution: You must use the deinstallation tool to remove Oracle software.
    Do not run the deinstallation tool from a later release to remove Oracle software
    from an earlier release. For example, do not run the deinstallation tool from
    the 12.1.0.1 installation media to remove Oracle software from an existing 11.2.0.4
    home.


    # 6.6.1 About the Deinstallation Tool


    The Deinstallation Tool (deinstall) stops Oracle software, and removes Oracle
    software and configuration files on the operating system. It is available in the
    installation media before installation, and is available in Oracle home directories
    after installation. It is located in the path $ORACLE_HOME/deinstall. The Deinstallation
    tool command is also available for download from Oracle Technology Network (OTN)
    at the following URL:


    ```

    http://www.oracle.com/technwork/database/enterprise-edition/downloads

    ```


    You can download the Deinstallation Tool with the complete Oracle Database 11g
    release 2, or as an archive file. To download the Deinstallation tool separately,
    click the See All link to select the software version.


    The Deinstallation tool uses the information you provide and the information gathered
    from the software home to create a parameter file. Alternatively, you can use
    a parameter file generated by the deinstall command using the -checkonly flag
    and -o flag. You can also edit a response file to create a parameter file.


    The Deinstallation command stops Oracle software, and removes Oracle software
    and configuration files on the operating system for a specific Oracle home. If
    you run the Deinstallation tool to remove an Oracle Grid Infrastructure for a
    cluster installation, then the tool prompts you to run the rootcrs script as root.


    > Caution: When you run the deinstall command, the central inventory (orInventory)
    contains no other registered homes beside the home that you are deconfiguring
    and removing, then the deinstall command removes the following files and directory
    contents in the Oracle RAC base installation owner:


    +   - admin

    - cfgptools

    - checkpoints

    - diag

    - oradata

    - flash_recovery_area


    Oracle recommends that you configure your installations using an Optimal Flexible
    Architecture (OFA) configuration, and that you reserve Oracle base and Oracle
    home paths for exclusive use of Oracle software. If you have any user data in
    these locations in the Oracle base that is owned by the user account that owns
    the Oracle software, then the deinstall command deletes this data.'
