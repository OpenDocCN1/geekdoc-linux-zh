  md: '# Oracle Automatic Storage Management Storage Configuration


    MB, depending on the specific disk group compatibility level. The default value
    is set to 1 MB.


    5. For Clusterware installations, you must also add additional disk space for
    the Oracle ASM metadata. You can use the following formula to calculate the disk
    space requirements (in MB) for OCR and voting files, and the Oracle ASM metadata:


    ```

    total = [2 * ausize disks] + [redundancy * (ausize * nodes (clients + 1) + 30)
    + (64 * nodes) + 533)]

    ```


    Where:


    +   - redundancy = Number of mirrors: external = 1, normal = 2, high = 3.

    - ausize = Metadata AU size in megabytes (default is 1 MB)

    - nodes = Number of nodes in cluster.

    - clients = Number of database instances for each node.

    - disks = Number of disks in disk group.


    For example, for a four-node Oracle RAC installation, using three disks in a normal
    disk group, you require an additional 1684 MB of space:

    [2 * 1 * 3] + [2 * (4 * (4 + 1) + 30)+(64 * 4) + 533]] = 1684 MB


    To ensure high availability of Oracle Cluster files on Oracle ASM, for a normal
    disk group, as a general rule for most instances, you must have at least 2 GB
    of disk space for Oracle Cluster files in three failure groups, with at least
    three physical disks. To ensure that the effective disk space to create Oracle
    Cluster files is 2 GB, best practice suggests that you ensure at least 2.1 GB
    of capacity for each disk, with a total capacity of 6.3 GB for three disks.


    6. Optionally, identify failure groups for the Oracle ASM disk groups.

    If you intend to use a normal or high redundancy disk group, then you can further
    protect your database against hardware failure by associating a set of devices
    in a custom failure group. By default, each device comprises its own failure group.
    However, if two disks are in a normal redundancy disk group attached to the same
    SCSI controller, then the disk group becomes unavailable if the controller fails.
    The controller in this example is a single point of failure.


    To protect against failures of this type, you could use two SCSI controllers,
    with two disks, and define a failure group for the disks attached to each controller.
    This configuration would enable the disk group to tolerate the failure of one
    SCSI controller.


