- pgno: 115
  md: '# 3.2.3.2 Using the oranstab File with Direct NFS Client


    If you use Direct NFS Client, then you can choose to use a new file for Oracle
    data file management, oranstab, to specify additional options specific for Oracle
    Database to Direct NFS Client. For example, you use oranstab to specify additional
    paths for a mount point. You can add /etc or to $ORACLE_HOME/dbms.


    With Oracle RAC, when the oranstab file is placed in $ORACLE_HOME/dbms, the entries
    in the file are specific to a shared database. In this case, all nodes running
    Oracle RAC use the same $ORACLE_HOME/dbms/oranstab file. In non-shared Oracle
    RAC installs, oranstab must be replicated on all nodes.


    When the oranstab file is placed in /etc, then it can contain mount points used
    by all Oracle databases running on nodes in the cluster, including standalone
    databases. However, on Oracle RAC systems, if the oranstab file is placed in /etc,
    then you must replicate the file each /etc/oranstab file synchronized on all nodes,
    just as you must with the /etc/fstab.


    > See Also: Section 3.2.3.5, "Configuring Storage NFS Mount and Buffer Parameters"
    for information about configuring /etc/fstab


    In all cases, mount points must be mounted by the kernel NFS system, even when
    they are being served using Direct NFS Client.


    > Caution: Direct NFS Client will not serve an NFS server with write size (wtmax)
    less than 32768.


    # 3.2.3.3 Mounting NFS Storage Devices with Direct NFS Client


    Direct NFS Client determines mount point settings to NFS storage devices based
    on the configurations in /etc/mtab, which are changed with configuring either
    the /etc/fstab file.


    Direct NFS Client searches for mount entries in the following order:


    +   1. $ORACLE_HOME/dbms/oranstab

    2. /etc/oranstab

    3. /etc/mtab


    Direct NFS Client uses the first matching entry.


    Oracle Database is not shipped with Direct NFS Client enabled by default. To enable
    Direct NFS Client, complete the following steps:


    +   1. Change the directory to $ORACLE_HOME/rdms/lib.


    +   2. Enter the following command:


    ```

    make -f ins_rdms.mk dnfs_on

    ```


    > Note: You can have only one active Direct NFS Client implementation for each
    instance. Using Direct NFS Client on an instance will prevent another Direct NFS
    Client implementation.'
