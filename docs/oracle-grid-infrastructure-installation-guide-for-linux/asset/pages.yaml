- pgno: 62
  md: '# Checking the Network Requirements


    +   - Across the broadcast domain as defined for the private interconnect

    - On the IP address subnet ranges 224.0.0.0/24 and 230.0.0.1/24


    You do not need to multicast communications across routers.


    # 2.7.5 DNS Configuration for Domain Delegation to Grid Naming Service


    If you plan to use DNS, then by Oracle Grid Infrastructure installation, you must
    configure your domain name server (DNS) to send to GNS name requests for the subdomain
    GNS servers, which are the cluster member nodes. The following is an overview
    of what needs to be done for domain delegation. Your actual procedure may be different
    from this example.


    Configure the DNS to send GNS name requests using delegation:


    +   - In the DNS, create an entry for the GNS virtual IP address, where the address
    uses the form-gns.CLUSTERNAME.DOMAINMAINNAME. For example, where the cluster name
    is mycluster, and the domain name is example.com, and the IP address is 192.0.2.1,
    create an entry similar to the following:


    ```

    mycluster-gns.example.com A 192.0.2.1

    ```


    The address you provide must be routable.


    +   - Set up forwarding of the GNS subdomain to the GNS virtual IP address, so
    that GNS resolves to the GNS subdomain. To do this, create a BIND configuration
    similar to the following for the delegated domain, cluster01.example.com is the
    subdomain you want to delegate:


    ```

    cluster01.example.com NS mycluster-gns.example.com

    ```


    +   - When using GNS, you must configure resolve.conf on the cluster (or the file
    on your system that provides resolution information) to contain server entries
    that are resolvable to configure DNS servers. The timeout period—a combination
    of options attempts (retries) and options timeout (exponential backoff)—should
    be less than 30 seconds. For example, www.xxx.xxx.42 and xxx.xxx.xxx.15 are valid
    name addresses in your network, provide an entry similar to the following in /etc/resolve.conf:


    ```

    options attempts: 2

    options timeout: 1

    search cluster01.example.com example.com

    nameserver xxx.xxx.xxx.42

    nameserver xxx.xxx.xxx.15

    ```


    /etc/nswitch.conf controls name service lookup order. In some system configurations,
    the Network Information System (NIS) can cause problems with Oracle SCAN address
    resolution. Oracle recommends placing the nis entry at the end of the search list.
    For example:


    ```

    /etc/nswitch.conf

    hosts: files nis

    ```


    > Note: Be aware that use of NIS is a frequent source of problems when doing pull
    tests, as host name and username registration can fail.


    Advanced Installation Oracle Grid Infrastructure for a Cluster Preinstallation
    Tasks 2-33'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 2.7.6 Grid Naming Service Configuration Example


    If you use GNS, you then need to specify a static IP address for the GNS VIP address,
    and delegate a subdomain be delegated to that static GNS IP address.


    As nodes are added to the cluster, your organization''s DHCP server can provide
    addresses for these nodes dynamically. These addresses are registered automatically
    in GNS, and GNS provides resolution within the subdomain to cluster addresses
    registered with GNS.


    Because allocation and configuration of addresses is performed automatically with
    GNS, no further configuration is required. Oracle Cluster provides dynamic network
    configuration as nodes are added or removed from the cluster. The following example
    is provided for information.


    With a node cluster where you have defined the GNS VIP, after installation you
    might have a configuration similar to a two-node cluster, where the cluster name
