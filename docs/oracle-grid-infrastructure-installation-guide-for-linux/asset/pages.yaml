  md: '# General Installation Issues


    To determine whether X Windows applications display correctly on the local system,
    enter the following command:


    ```

    $ xclock

    ```


    The X clock should appear on your monitor. If this fails to work, then use of
    the xhost command may be restricted.


    If you are using a VNC client to access the server, then ensure that you are accessing
    the visual that is assigned to the user that you are trying to use for the installation.
    For example, if you used the su to become the installation owner on another user
    visual, and the xhost command is restricted, then you cannot use the xhost command
    to change the display. If you use the visual assigned to the installation owner,
    then the correct display will be available, and entering the xclock command will
    display the X clock.


    When the X clock appears, then the X clock and start the installer.


    # Failed to initialize configon


    **Cause:** Have the wrong options configured for NFS in /etc/stab file.

    You can confirm this by checking configlog files located in the path Grid_home/logdenumber/client
    and finding the following:


    ```

    /u02/app/crs/clusterregistry, -1, errno 75, err String too large

    for defined data type

    2007-10-30 11:23:52.101: [OCSRS|1085960886]jutpen:6'': OCR location

    ```


    **Action:** For file systems mounted on NFS, provide the correct configuration
    for NFS mounts in the /etc/stab file:


    > **Note:** You should not have netdev in the mount strings, or netdev option
    is only required for OCSF file systems, and netdev=forces the kernel to mount
    NFS using the older version 2 protocol.


    After correcting the NFS information, remount the NFS mount point, and run the
    root.sh script. For example, with the mount point /u02:


    ```

    #mount /u02

    #mount -a nfs

    #cd $GRID_HOME

    #sh root.sh

    ```


    # INS-3022 INSTALL_COMMON_HINT_DATABASE_LOCATION_ERROR


    **Cause:** The location selected for the Grid home for a cluster installation
    is located under an Oracle base directory.


    **Action:** For Oracle Grid Infrastructure for Cluster installations, the Grid
    home must not be placed under one of the Oracle base directories, or under Oracle
    home directories of Oracle installation owners, or in the home directory of an
    installation owner. During installation, ownership of the Grid home is changed
    to root. This change causes permission errors for other installations. In addition,
    the Oracle Clusterware software may not come under an Oracle base path.


    A-4 Oracle Grid Infrastructure Installation Guide'
