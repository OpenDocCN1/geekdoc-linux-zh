    # D.2 Understanding Storage Configuration


    +   - Understanding Oracle Automatic Storage Management Cluster File System


    +   - About Mitigating Existing ASM Instances


    +   - About Converting Standalone Oracle ASM Installations to Clustered Installations


    # D.2.1 Understanding Oracle Automatic Storage Management Cluster File System


    Oracle Automatic Storage Management has been extended to include a general purpose
    file system, called Oracle Automatic Storage Management Cluster File System (ACFS).
    ACFS is a new multi-platform, scalable file system, and storage management technology
    that extends Oracle Automatic Storage Management (ASM) functionality to support
    customer files maintained outside of the Oracle Database. Files supported by ACFS
    include application binaries and application reports. Other supported files are
    video, audio, text, images, drawings, and other general-purpose-file data.


    # D.2.2 About Mitigating Existing ASM Instances


    If you have an ASM installation from a prior release installed on your server,
    or in an Oracle Clusterware installation, you can use Oracle Automatic Storage
    Management Configuration Assistant (ASMCA, located in the path_home/bin) to upgrade
    the existing ASM instance to ASM 11g Release 2 (11.2), and subsequently configure
    failure groups, ASM volumes, and Oracle Automatic Storage Management Cluster File
    System (Oracle ACFS).


    > Note: You must first shut down all database instances and applications on the
    node where you use ASM instance before upgrading it.


    During installation, if you choose to use ASM and ASMCA detects that there is
    a prior Oracle ASM version installed in another home, then after installing the
    Oracle ASM 11g Release 2 (11.2), you can start ASMCA to upgrade the Oracle ASM
    instance. You can then choose to configure an Oracle ACFS deployment by creating
    ASM volumes and using the upgraded Oracle ASM to create the ACFS.


    On an existing Clusterware or Oracle RAC installation, if the prior version of
    Oracle ASM instances on all nodes is Oracle ASM 11g release 1, then you are provided
    with the option to perform a rolling upgrade of Oracle ASM instances. If the prior
    version of Oracle ASM instances on an Oracle RAC installation are from an Oracle
    ASM release prior to Oracle ASM 11g release 1, then rolling upgrades cannot be
    performed. Oracle ASM is then upgraded on all nodes to 11g Release 2 (11.2).'
