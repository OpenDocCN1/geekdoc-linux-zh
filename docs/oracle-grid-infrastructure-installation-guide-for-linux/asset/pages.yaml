    # 2.1.2 Completing a Default Linux Installation


    If you do not install the Oracle Preinstallation RPM, then Oracle recommends that
    you install your Linux operating system with the default software packages (RPMs).
    This installation includes most of the required packages and helps limit manual
    verification of package dependencies. Oracle recommends that you do not customize
    the RPMs during installation.


    For information about a default installation, log on to Oracle Support:


    ```

    https://support.oracle.com

    ```


    Search for "default rpms linux installation," and look for your Linux distribution.
    For example:


    ```

    https://support.oracle.com/CSP/main/article?cmd=show&type=NOT&id=401167.1

    ```


    After installation, review system requirements for your distribution to ensure
    that you have all required packages installed, and complete all other tasks required
    for your distribution and system configuration.


    # 2.1.3 About Oracle Linux and the Unbreakable Enterprise Kernel


    Oracle''s Unbreakable Kernel delivers the latest innovations from upstream development
    to customers who run Red Enterprise Linux (RHEL) 5 or Oracle Linux 5 in the data
    center. The Unbreakable Enterprise Kernel is included and enabled by default starting
    with Oracle Linux 5 Update 6.


    The Unbreakable Enterprise Kernel is based on a recent stable mainline Linux kernel,
    and includes optimizations developed in collaboration with Oracle Database, Oracle
    middleware, and Oracle engineering teams to ensure stability and performance for
    the most demanding enterprise workloads.


    Oracle highly recommends deploying the Unbreakable Enterprise Kernel in your Linux
    environment, especially if you run enterprise applications. However, using Oracle
    Unbreakable Enterprise Kernel is optional. If you require strict RHEL kernel compatibility,
    Oracle Linux also includes a kernel compatible with the RHEL kernel, compiled
    directly from the RHEL source code.


    You can obtain more about the Unbreakable Enterprise Kernel for Linux at the following:


    ```

    http://www.oracle.com/us/technologies/linux

    ```


    The Oracle Unbreakable Enterprise Kernel for Linux is the standard kernel used
    with Oracle products. The build and QA systems for Oracle Database and other Oracle
    products use the Oracle Unbreakable Enterprise Kernel for Linux exclusively. The
    Oracle Unbreakable Enterprise Kernel for Linux is also the kernel used in Oracle
    Exadata and Oracle Exagic systems. Oracle Unbreakable Enterprise Kernel Linux
    is used in all benchmark tests on Linux in which Oracle participates, as well
    as in the Oracle Preinstallation RPM for x86-64.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# About Installing the Linux Operating System


    Ksplice is part of Oracle Linux, updates the Linux operating system (OS) kernel,
    when it is running, without requiring restarts or any interruption. Ksplice is
    available only with Oracle Linux.


    # 2.1.4 About the Oracle Preinstallation and Oracle Validated RPMs


    If your Linux distribution is Oracle Linux and you are an Oracle Linux customer,
    you can complete most preinstallation configuration tasks by using the Oracle
    Preinstallation RPM or Oracle Validated RPM for your release, which is available
    from the Oracle Linux Network, or available on the Oracle Linux DVDs. Using the
    Oracle Preinstallation RPM is not required, but Oracle recommends you use it to
    save time in setting up your cluster servers.


    When it is installed, the Oracle Preinstallation RPM or Oracle Validated RPM does
    the following:


    +   - downloads and installs all additional packages needed for installing Oracle
    Grid Infrastructure and Oracle Database, and resolves any dependencies


    +   - Creates an oracle user, and creates the oracleInventory (oinstall) and OSDBA
    (dba) groups for that user


    +   - As needed, sets sysctl.conf settings, system startup parameters, and driver
    parameters to values based on recommendations from the Oracle Preinstallation
    RPM program


    +   - Sets hard resource limits


    +   - Sets other recommended parameters, depending on your kernel version


    To become an Oracle Linux Network customer, contact your sales representative,
    or purchase a license from the Oracle Linux store:


    https://shop.oracle.com/product/oraclelinux


    To register your server on the Unbreakable Linux Network, or to find more information,
    see the following URL:


    https://linux.oracle.com


    If you are using Oracle Linux 5.2 and higher, the Oracle Preinstallation RPM is
    included in the install media.


    > Note: The Oracle Preinstallation RPM designated for each Oracle Database sets
    kernel parameters and resource limits only for the user account oracle. To use
    multiple software owners, you must perform system configuration for other accounts
    manually.


    You can obtain Linux kernels from the Oracle Linux public Yum repository. The
    public repository for Oracle Linux 4, Oracle Linux 5 and Oracle Linux 6 is available
    at the following URL:


    http://public-yum.oracle.com/


    To become an Unbreakable Linux Network customer, contact your sales representative,
    or purchase a license from the Unbreakable Linux store:


    https://shop.oracle.com/product/oraclelinux


    4 - Oracle Grid Infrastructure Installation Guide'
  merge: -1
  img_proc: true
