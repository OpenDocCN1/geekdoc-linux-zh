- pgno: 103
  md: 'If you create the path before installation, it should be owned by the installation
    owner of Oracle Grid Infrastructure (typically oracle for a single installation
    owner for all Oracle software, or grid for role-based Oracle installation owners),
    and set to 775 permissions.


    Oracle recommends you install Oracle Grid Infrastructure on local homes, rather
    than using a shared home on shared storage.


    For installations with Oracle Grid Infrastructure only, Oracle recommends that
    you create a path with Optimal Flexible Architecture (OFA) guidelines, so that
    Oracle Universal Installer (OUI) can select that directory during installation.
    For OUI to recognize the path as an Oracle software path, it must be in the form
    u[1-9]-app.


    When OUI finds an OFA-compliant path, it creates the Oracle Grid Infrastructure
    and Oracle Inventory (orInventory) directories for you.


    To create an Oracle Grid Infrastructure path, ensure that it is in a separate
    path, not under an existing Oracle base path. For example:


    ```

    # mkdir -p /u01/app/11.2/grid

    # chown grid:install /u01/app/11.2/grid

    # chmod -R 775 /u01/app/11.2/grid

    ```


    With this, if the installation owner is named grid, then by default OUI creates
    the following path for the Grid home:


    /u01/app/11.2/grid


    Create an Oracle base for database installations, owned by the Database installation
    owner account. The OFA path for an Oracle base is /u01/app/user, where user is
    the name of the Oracle software installation owner account. For example, use the
    following commands to create an Oracle base for the database installation owner
    account:


    ```

    # mkdir -p /u01/app/oracle

    # chown oracle:install /u01/app/oracle

    # chmod -R 775 /u01/app/oracle

    ```


    > Note: If you choose to create an Oracle Grid Infrastructure home manually, do
    not create the Oracle Grid Infrastructure home for a cluster under the grid installation
    owner Oracle base or the Oracle Database installation owner Oracle base: Creating
    an Oracle Clusterware home in an Oracle base directory will cause succeeding Oracle
    installations to fail.


    Oracle Infrastructure homes can be placed in a local home on servers, even if
    your existing Oracle Clusterware home from a prior release is in a shared location.


    Homes for Oracle Grid Infrastructure for a standalone server (Oracle Restart)
    can be under Oracle base. Refer to Oracle Database Installation Guide for your
    platform for more information about Oracle Restart.'
  merge: -1
  img_proc: true
