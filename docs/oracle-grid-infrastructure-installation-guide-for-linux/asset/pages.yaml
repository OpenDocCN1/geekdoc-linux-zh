  md: '# 6.2 Migrating Standalone Grid Infrastructure Servers to a Cluster


    If you have an Oracle Database installation using Oracle Restart (that is, an
    Grid Infrastructure installation for a standalone server), and you want to configure
    that server as a cluster member node, then complete the following tasks:


    > > **Note:** This procedure uses Oracle Clusterware Configuration Wizard, available
    with release 11.2.0.2 and later.


    +   1. Inspect the Oracle Restart configuration with `srvctl` using the following
    syntax, where `db_unique_name` is the unique name for the database, and `lsnrname`
    is the name of the listeners:

    ```bash

    srvctl config database -d db_unique_name

    srvctl config service -d db_unique_name

    srvctl config listener -l lsnrname

    ```

    Write down the information for the server.

    2. Log in as root, and change directory to Grid home/crs/install. For example:

    ```bash

    # cd /u01/app/11.2/grid/crs/install

    ```

    3. Stop all the databases, services, and listeners that you discovered in step
    1.

    4. If present, unmount all ACFS filesystems.

    5. Deconfigure the Oracle Grid Infrastructure installation for a standalone server
    (Oracle Restart), using the following command:

    ```bash

    # roothas.pl -deconfig -force

    ```

    6. Prepare the server for Oracle Clusterware configuration, as described in this
    document. In addition, if you want to install Oracle Grid Infrastructure for a
    Cluster in the same location as Oracle Restart, or in a different location:


    **Installing in the Same Location as Oracle Restart**


    +   a. Use the command `Grid_home/deinstall` to remove the Oracle Restart software,
    but with all disks intact.

    b. Proceed to step 7.


    **Installing in a Different Location than Oracle Restart**


    +   a. Install Oracle Grid Infrastructure for a Cluster in the new Grid home software
    location


    +   7. As the Oracle Grid Infrastructure installation owner, run Oracle Clusterware
    Configuration Wizard, and save and the response file. For example:

    ```bash

    $ Grid_home/crs/config/config.sh -silent -responseFile $HOME/GI.rsp

    ```


    +   8. Run `root.sh` for the Oracle Clusterware Configuration Wizard.


    +   9. Mount the Oracle Restart disk.


    +   10. Enter the `volatile` command to enable all Oracle Restart disk groups.


    +   11. Mount all Oracle ACFS filesystems manually.'
