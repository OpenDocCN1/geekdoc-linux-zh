    # 2.11 Network Time Protocol Setting


    Oracle Clusterware requires the time zone setting on all cluster nodes. During
    installation, the installation process picks up the time zone setting of the Grid
    installation on the node where OUI runs, and that on all nodes as the default
    TZ for all processes managed by Oracle Clusterware. This default is used for databases,
    Oracle ASM, and any other managed processes.


    You have two options for time synchronization: an operating system network time
    protocol (NTP), or Oracle Cluster Time Synchronization Service designed for organizations
    whose cluster servers are able to access NTP services. If you use NTP, then the
    Oracle Cluster Time Synchronization daemon (ctssd) starts up in observer mode.
    If you do not use NTP daemons, then ctssd starts up in active mode and synchronizes
    time among cluster members without contacting an external time server.


    > Note: Before starting the installation of Oracle Grid Infrastructure, Oracle
    recommends that you ensure the clocks on all nodes are set to the same time.


    If you have NTP daemons on your server but cannot configure them to synchronize
    time with a time server, and you want to use Cluster Time Synchronization Service
    to provide synchronization service in the cluster, then deactivate and install
    the NTP.


    To deactivate the NTP service, you must stop the ntpd service, disable it from
    the initialization sequences and remove the ntp.conf file. To complete this step
    on Oracle Linux, and Asianinux systems, run the following commands as root user


