- pgno: 176
  md: '# Troubleshooting the Oracle Grid Infrastructure Installation Process


    This appendix provides troubleshooting information for installing Oracle Grid
    Infrastructure.


    **See Also:** The Oracle Database 11g RAC documentation set in the Documentation
    directory:


    +   - Oracle Clusterware Administration and Deployment Guide

    - Oracle Real Application Clusters Administration and Deployment Guide


    This appendix contains the following topics:

    - General Installation Issues

    - Interpreting CVT "Unknown" Output Messages Using Verbose Mode

    - Interpreting CVT Messages About Oracle Grid Infrastructure Setup

    - About the Oracle Clusterware Alert Log

    - Missing Operating System Packages On Linux

    - Performing Cluster Diagnostics During Oracle Grid Infrastructure Installations

    - About Using CVT Cluster Healthchecks After Installation

    - Interconnect Connection Issues

    - SCAN VIP and SCAN Listener Issues

    - Storage Configuration Issues

    - Completing an Installation Before Finishing Running Scripts


    # A.1 General Installation Issues


    The following is a list of examples of errors that can occur during installation.
    It contains the following issues:


    +   - An error occurred while trying to get the disks

    - Could not execute auto check for display colors using command /usr/X11R6/bin/xdpyinfo

    - CRS-5823:Could not initialize agent framework.

    - Failed to connect to server, Connection refused by server, or Can''t open display'
  merge: -1
