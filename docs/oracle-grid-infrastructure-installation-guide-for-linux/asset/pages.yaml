    # 3.2.3.1 About Direct NFS Client Storage


    With Oracle Database 11g Release 2.1, instead of using the operating system kernel

    FS client, you can configure Oracle Database to access NFS V3 servers directly

    an Oracle internal Direct NFS Client.


    To enable Oracle Database to use Direct NFS Client, the NFS files must be

