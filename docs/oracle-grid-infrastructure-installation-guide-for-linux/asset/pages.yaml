- pgno: 107
  md: '# Reviewing Oracle Grid Infrastructure Storage Options


    +   - Oracle Automatic Storage Management (Oracle ASM): You can install Oracle
    Clusterware files (Oracle Cluster Registry and voting disk files) in Oracle ASM
    disk groups.


    Oracle ASM is the required database storage option for Typical installations,
    and for Standard Edition Oracle RAC installations. It is an integrated, high-performance
    database file system and disk manager for Oracle Clusterware and Oracle Database
    files. It performs striping and mirroring of database files automatically.


    +   - A supported shared file system: Supported file systems include the following:


    +   - Network File System (NFS): Note: if you need to use NFS for your data files,
    then you should create partitions large enough for the database files when you
    create partitions for Oracle Grid Infrastructure. NFS mounts differ for software
    binaries, Oracle Clusterware, and database files.


    Note: Placing Oracle Grid Infrastructure for a cluster binaries on a cluster file
    system is not supported.


    You can no longer use UI to install Oracle Clusterware or Oracle Database files
    on block or raw devices.


    See Also: My Oracle Support for supported file systems and NFS or NAS fibers


    # 3.1.2 Oracle ACFS and Oracle ADVM Support


    Automatic Storage Management Cluster File System (Oracle ACFS) extends Oracle
    ASM technology to support all of your application data in both single and cluster
    configurations. Oracle Automatic Storage Management Dynamic Volume Manager (Oracle
    ADVM) provides volume management services and a standard disk driver interface
    to client Oracle Storage Management Cluster File System supported on Oracle ASM
    through the Oracle Automatic Storage Management Dynamic Volume Manager interface.


    Oracle ACFS and Oracle ADVM are supported on Oracle Linux 5 and Red Hat Enterprise
    Linux 5 for Linux x86 and x86-64. Table 3-1 lists the releases, platforms and
    kernel versions that support Oracle ACFS and Oracle ADVM.


    | Release | Platforms/Operating system |

    |---|-|

    | 11.2.x | Linux x86: Oracle Linux 5 and Red Hat Enterprise Linux 5 | 2.6.18,
    and later updates to 2.6.18 |

    | 11.2.0.1 | Linux x86-64: Oracle Linux 5 and Red Hat Enterprise Linux 5 | 2.6.18,
    and later updates to 2.6.18 |

    | 11.2.0.2 | Linux x86-64: Oracle Linux 5, Red Hat Enterprise Server 5, SUSE Linux
    Server 10 SP3 and later | 2.6.18, and later updates to 2.6.18 |

    | 11.2.0.3 | Linux x86-64: Oracle Linux 5, Red Hat Enterprise Linux 5, SUSE Linux
    Server 10 SP3, and later Linux Enterprise Server 11 SP1 | 2.6.18, and later updates
    to 2.6.18 Oracle Unbreakable Kernel 2.632-100.34.1 and later updates to 2.632-100
    |


    3-2 Oracle Grid Infrastructure Installation Guide'
