    # 2.13 Enabling Intelligent Platform Management Interface (IPMI)


    Intelligent Platform Management Interface (IPMI) provides a set of common interfaces
    to computer hardware and firmware that system administrators can use to monitor
    system health and manage the system. With Oracle 11 release 2, Oracle Cluster
    can integrate IPMI to provide failure isolation support and ensure cluster integrity.


    You can configure node-termination with IPMI during installation by selecting
    a node-termination protocol, as IPMI. You can also configure IPMI after installation
    with crctl commands.


    > See Also: Oracle Cluster Administration and Deployment Guide for information
    about how to configure IPMI after installation


    # 2.13.1 Requirements for Enabling IPMI


    You must have the following hardware and software configured to enable cluster
    nodes to be managed with IPMI:


    +   Each cluster node requires a Baseboard Management Controller (BMC) running
    firmware compatible with IPMI version 1.5 or greater, which supports IPMI over
    LANs, and configured for remote control using LAN.


    +   Each cluster node requires an IPMI driver installed on each node.


    +   The cluster requires a management network for IPMI. This can be a shared network,
    but Oracle recommends that you configure a dedicated network.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Enabling Intelligent Platform Management Interface IPMI


    +   - Each cluster member''s Ethernet port used by BMC must be connected to the
    IPMI management network.

    - Each cluster member must be connected to the management network.

    - Some server platforms put their network interfaces into a saving mode when they
    are powered off. In this case, they may only operate at a lower speed (for example,
    100 MB, instead of 1 GB). For these platforms, the network switch port to which
    the BMC is connected must be auto-negotiate down to the lower speed, or IPMI will
    not function properly.


    # 2.13.2 Configuring the IPMI Management Network


    You can configure the BMC for DHCP, or for static IP addresses. Oracle recommends
    you configure the BMC for dynamic IP address assignment using DHCP. To use this
    option, you must have a DHCP server configured to assign the BMC IP addresses.


    > Note: If you configure IPMI, and use Grid Naming Service (GNS) you must configure
    separate addresses for the IPMI interfaces. If the IPMI adapter is not seen directly
    by the host, the IPMI adapter is not visible to GNS as an address on the host.


    # 2.13.3 Configuring the IPMI Driver


    For Oracle Clusterware to communicate with the BMC, the IPMI driver must be installed
    permanently on each node, so that it is available on system restarts. The IPMI
    driver is available on the Asianux, Oracle Linux, Red Hat Enterprise Linux, and
    SUSE Enterprise distributions supported with this release.


    # 2.13.3.1 Configuring the Open IPMI Driver


    On Linux systems, the OpenIPMI driver is the supported driver for Oracle Clusterware
    deployments with IPMI.


    You can install and configure the driver dynamically by manually loading the required
    modules. Contact your Linux distribution vendor for information on how to configure
    IPMI for your distribution.


    The following example shows how to configure the Open IPMI driver manually on
    Oracle Linux:


    +   1. Log in root.


    +   2. Run the following commands:


    ```

    # /sbin/modprobe ipmi_mshandler

    # /sbin/modprobe ipmi_si

    # /sbin/modprobe ipmi_devintf

    ```


    +   3. (Optional) Run the command /sbin/lsmod | grep ipmi to confirm that the
    IPMI modules are loaded. For example:


    ```

    # /sbin/lsmod | grep ipmi

    ipmi_devintf 12617 0

    ipmi_si 0

    ipmi_mshandler 33701 2 ipmi_devintf,ipmi_si

    ```


    > Note: You can install the modules whether or not a BMC is present.


