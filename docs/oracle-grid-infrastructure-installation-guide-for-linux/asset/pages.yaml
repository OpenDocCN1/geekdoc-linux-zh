  md: 'Checking the Hardware Requirements


    +   * Server Hardware Requirements

    * Server Memory Requirements

    * Checking Server Hardware and Memory Configuration


    #  2.6.1 General Server Requirements


    +   * Ensure the server is started with run level 3 or run level 5.

    * Ensure servers run the same operating system binary. Oracle Grid Infrastructure
    installations and Oracle Real Application Clusters (Oracle RAC) support servers
    with different hardware in the same cluster.


    #  2.6.2 Server Hardware Requirements


    Each system must meet the following minimum hardware requirements:


    +   * At least 1024 x 768 display resolution, so that OUI displays correctly.

    * 1 GB of space in the /tmp directory.

    * 6.6 GB of space for the Oracle Grid Infrastructure for a Cluster home (Grid
    home) this includes ClusterClusterware and Oracle ASM files and log files, ACFS
    log files, and the Cluster Health Monitor repository, if available for your platform.

    * Up to 10 GB of additional space in the Oracle base directory of the Grid Infrastructure
    owner for diagnostic collections generated by Trace File Analyst and Collector.

    * On Linux x86 platforms, if you intend to install Oracle Database, then allocate
    4 GB of space for the Oracle base.

    * For Linux x86_64 platforms, if you intend to install Oracle Database, allocate
    4.6 GB of disk space for the Oracle base.


    > Note: If you intend to install Oracle Databases or an Oracle RAC on the cluster,
    be aware that the size of the /dev/sh mount area on each server must be greater
    than the system global area (SGA) and the program global area (PGA) of the databases
    on the servers. Review expected SGA and PGA sizes with database administrators,
    to ensure that you do not have to increase /dev/shm after databases are installed
    on the cluster.


    If you are installing Oracle Database, then you require additional space, either
    on a file system or in an Oracle Automatic Storage Management disk group, for
    the Fast Recovery Area if you choose to configure automated database backups.


    See Also: Oracle Automatic Storage Management Administrator''s Guide


    #  2.6.3 Server Memory Requirements


    Ensure your system meets the following requirements, depending on your system
    architecture


    +   * 64-bit System and Linux on System z Memory Requirements

    * Memory Requirements


    Advanced Installation Oracle Grid Infrastructure for a Cluster Preinstallation
    Tasks 2-25'
