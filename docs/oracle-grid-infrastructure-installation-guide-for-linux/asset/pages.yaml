  md: '# Creating Directories for Oracle Clusterware Files


    Using the following instructions to create directories for Oracle Clusterware
    files. You can also configure shared file systems for the Oracle Database and
    recovery files.


    > Note: For both NFS and OCF2 storage, you must complete this procedure only if
    you want to place the Oracle Clusterware files on a separate file system from
    the Oracle base directory.


    To create directories for the Oracle Clusterware files on separate file systems
    from the Oracle base directory, follow these steps:


    +   1. If necessary, configure the shared file systems to use and mount them on
    each node.


    > Note: The mount point that you use for the file system must be identical on
    each node. Ensure that the file systems are configured to mount automatically
    when a node restarts.


