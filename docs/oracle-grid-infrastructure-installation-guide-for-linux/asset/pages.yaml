- pgno: 10
  md: '# Preface


    Oracle Grid Infrastructure Installation Guide for Linux explains how to configure
    a server in preparation for installing and configuring an Oracle Grid Infrastructure
    installation (Oracle Clusterware and Oracle Automatic Storage Management). It
    explains how to configure a server and storage in preparation for an Oracle Real
    Application Clusters (Oracle RAC) installation.


    # Intended Audience


    Oracle Grid Infrastructure Installation Guide for Linux provides configuration
    information for network and system administrators, and database installation information
    for database administrators (DBAs) who install and configure Oracle Clusterware
    and Oracle Automatic Storage Management in an Oracle Grid Infrastructure for a
    Cluster installation.


    For customers with specialized system roles who intend to install Oracle RAC,
    this book is intended to be used by system administrators, network administrators,
    or storage administrators to configure a system in preparation for an Oracle Grid
    Infrastructure for a cluster installation, and complete all configuration tasks
    that require system root. When Oracle Grid Infrastructure installation and configuration
    is completed successfully, a system administrator should only need to provide
    configuration information and grant access to the database administrator to run
    scripts during an Oracle RAC installation.


    This guide assumes that you are familiar with Oracle Database concepts. For additional
    information, refer to books in the Related Documents list.


    # Documentation Accessibility


    For information about Oracle''s commitment to accessibility, visit the Oracle
    Accessibility Program website at http://www.oracle.com/pls/topic/lookup?ctx=acc&id=docacc.


    # Access to Oracle Support


    Oracle customers that have purchased support have access to electronic support
    through My Oracle Support. For information, visit http://www.oracle.com/pls/topic/lookup?ctx=acc&id=info
    or visit http://www.oracle.com/pls/topic/lookup?ctx=acc&id=trs if you are hearing
    impaired.


    # Related Documents


    For more information, refer to the following Oracle resources:'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Oracle Clusterware and Real Application Clusters Documentation


    This installation guide reviews steps required to complete an Oracle Clusterware
    and Oracle Automatic Storage Management installation, and to perform preinstallation
    steps for RAC.


    If you need to install Oracle Database or Oracle RAC, then complete preinstallation
    tasks as described in this installation guide, complete Oracle Grid Infrastructure
    installation, and review those installation guides for additional information.
    You can install either Oracle databases for a standalone server on an Oracle Grid
    Infrastructure installation or an Oracle RAC database. If you want to install
    an Oracle Restart deployment of Grid Infrastructure, then refer to Oracle Database
    Installation Guide for Linux


    Most Oracle error message documentation is only available in HTML format. If you
    only have access to the Oracle Documentation media, then browse the error messages
    by range. Use your browser’s “find in page” feature to locate a specific message.
    When connected to the Internet, you can search for a specific error message using
    the error message search feature of the Oracle online documentation.


    # Installation Guides


    +   * Oracle Database Installation Guide for Linux

    * Real Application Clusters Installation Guide for Linux and UNIX


    # Operating System-Specific Administrative Guides


    +   * Oracle Administrator’s Reference, 11g Release 2 (11.2) for UNIX


    # Oracle Clusterware and Oracle Automatic Storage Management Administrative Guides


    +   * Oracle Clusterware Administration and Deployment Guide

    * Oracle Automatic Storage Management Administrator’s Guide


    # Real Application Clusters Administrative Guides


    +   * Real Application Clusters Administration and Deployment Guide

    * Oracle Database 2 Day + Real Application Clusters Guide


    # Generic Documentation


    +   * Oracle Database 2 Day DBA

    * Oracle Database Administrator’s Guide

    * Oracle Database Concepts

    * Oracle Database Net Services Administrator’s Guide

    * Oracle Database Reference


    Printed documentation is available for sale in the Oracle Store at the following
    site:


    ```

    https://shop.oracle.com

    ```


