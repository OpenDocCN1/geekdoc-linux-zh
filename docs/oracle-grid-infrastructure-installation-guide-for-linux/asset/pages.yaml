    +   Do not delete directories in the Grid home. For example, do not delete Home/OPatch.
    If you delete the directory, the Grid infrastructure owner cannot use OPatch to
    patch the Grid home, and OPatch displays the error "checkdir error: cannot create
    Grid_home/OPatch"


    +   To upgrade 11.2.0.1 Oracle Grid Infrastructure installations to Oracle Infrastructure
    11.2.0.2, you must first verify if you need to apply any mandatory patches to
