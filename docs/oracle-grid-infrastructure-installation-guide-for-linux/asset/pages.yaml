  md: '# Performing Rolling Upgrades From an Earlier Release


    +   - src_crshome src_Gridhome

    Use this flag to indicate the location of the source Oracle Clusterware or Grid
    home that you are upgrading, where src_Gridhome is the path to the home that you
    want to upgrade.

    - -dest_crshome dest_Gridhome

    Use this flag to indicate the location of the upgrade Grid home, where dest_Gridhome
    is the path to the Grid home.

    - -dest_version dest_version

    Use the dest_version flag to indicate the release number of the upgrade, including
    any patchset. The release number must include the five digits designating the
    level of the platform-specific patch. For example: 11.2.0.2.

    - -fixup [-fixuppath]

    Use the -fixup flag to indicate that you want to generate instructions for any
    required steps to ensure that your cluster is ready for an upgrade. The default
    location is the CVU work directory. If you want to place the fixup instructions
    in a different directory, then add the flag -fixup, and provide the path to the
    directory where you want to put the instructions for required fixes.

    - -verbose

    Use the -verbose flag to produce detailed output of individual checks


    # F.6.2 Verifying System Readiness for Grid Infrastructure


    You can verify that the permissions for installing Oracle Clusterware have been
    configured on the nodes node1 and node2 by running the following command:

    $ /runcluvfy.sh stage -pre crsin -upgrade -n node1,node2 -rolling -src_crshome
    /u1/app/grid/11.2.0.1 -dest_crshome /u1/app/grid/11.2.0.2 -dest_version 11.2.0.3
    -fixup -fixup /home/grid/fixup -verbose


    # F.6.3 Verifying System Readiness for Oracle Database Upgrades


    Use Cluster Utility to assist you with system checks in preparation for starting
    a database upgrade. The installer runs the appropriate CVU checks automatically,
    and prompts you to fix problems, or provides a fixup script to run on all nodes
    in the cluster before proceeding with the upgrade.


    See Also: Oracle Database Upgrade Guide


    # F.7 Performing Rolling Upgrades From an Earlier Release


    Use the following procedures to upgrade Oracle Clusterware or Oracle Automatic
    Storage Management:


    +   - Performing a Rolling Upgrade of Oracle Clusterware

    - Completing an Oracle Cluster Upgrade when Nodes Become Unreachable

    - Performing a Rolling Upgrade of Oracle Automatic Storage Management'
