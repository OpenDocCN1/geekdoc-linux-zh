- pgno: 44
  md: '# Creating Groups, Users and Paths for Oracle Grid Infrastructure


    If you have created a path for the Oracle Clusterhome that is compliant with Oracle
    Optimal Flexible Architecture (OFA) guidelines for Oracle software paths then
    you do not need to create an Oracle base directory. OUI finds an OFA-compliant
    path, it creates the Oracle base directory in that path.


    For OUI to recognize the path as an Oracle software path, it must be in the form
    [u0-99]/app, and it must be writable by any member of the inventoryowner (oinstall).
    The OFA path for the Oracle base is /u01/app/user, where user is the name of the
    software installation owner.


    Oracle recommends that you create an Oracle Grid Infrastructure home and Oracle
    base homes manually, if you have separate Grid Infrastructure for a cluster and
    Database software owners, so that you can save log files.


    ```

    # mkdir -p /u01/app/11.2.0/grid

    # mkdir -p /u01/app/grid

    # mkdir -p /u01/app/oracle

    # chown grid:install /u01/app/11.2.0/grid

    # chown grid:install /u01/app/grid

    # chown oracle:install /u01/app/oracle

    # chmod -R 775 /u01/

    # chown -R oinstall /u01

    ```


    > Note: Placing Oracle Grid Infrastructure for a cluster binaries on a shared
    OCF2 cluster system is not supported.


    > If you plan to install an Oracle RAC home on a shared OCF2 location, then you
    must upgrade OCFS2 to at least version 1.4.1, which supports writable mmaps.


    # 2.5.5 Creating Role Separation Operating System Privileges Groups and Users


    A job role separation privileges configuration of Oracle ASM is a configuration
    with groups and users that divide administrative privileges to the Oracle ASM
    installation from other administrative privileges and groups associated with other
    Oracle installations. Administrative privileges is granted by membership in separate
    operating system groups, and installation privileges are granted by using different
    installation owners for each Oracle installation.


    > Note: This configuration is optional, to restrict user access by responsibility
    areas for different administrator users.


    If you prefer, you can allocate operating system user privileges so that you can
    use one administrative user and one group for operating system authentication
    for all system privileges on the storage and database tiers.


    For example, you can designate the oracle user to be the installation owner for
    all Oracle software, and designate oinstall to be the group members are granted
    all system privileges for Oracle Clusterware, Oracle ASM, and all Oracle Databases
    on the servers, and all privileges as installation owners. This group must also
    be the Oracle Inventory group.


    Advanced Installation Oracle Grid Infrastructure for a Cluster Preinstallation
    Tasks 2-15'
