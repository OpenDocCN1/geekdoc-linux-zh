  md: '# ### 2.15.3 Check Resource Limits for the Oracle Software Installation Users


    For each installation software owner, check the resource limits for installation,
    using the following recommended ranges:


    Table 2-12 Installation Owner Resource Limit Recommended Ranges


    | Resource Shell Limit | Resource | Soft Limit | Hard Limit |

    | --- | --- | --- | --- |

    | Open file descriptors | nofile | at least 1024 | at least 65536 |

    | Number of processes available to a user | nproc | at least 2047 | at least 16384
    |

    | Size of the stack segment of the process | stack | at least 10240 KB | at least
    10240 KB, and most 32768 KB |


    To check resource limits:


    +   1. Log in as an installation owner.

    2. Check the soft and hard limits for the file descriptor setting. Ensure that
    the result is in the recommended range. For example:

    ```

    $ uimit -Sn

    1024

    $ uimit -Hn

    65536

    ```

    3. Check the soft and hard limits for the number of processes available to a user.
    Ensure that the result is in the recommended range. For example:

    ```

    $ uimit -Su

    2047

    $ uimit -Hu

    16384

    ```

    4. Check the soft limit for the stack setting. Ensure that the result is in the
    recommended range. For example:

    ```

    $ uimit -Ss

    10240

    $ uimit -Hs

    32768

    ```

    5. Repeat this procedure for each Oracle software installation owner.


