    # F.5.2 Running the RACCheck Upgrade Readiness Assessment


    The RACCheck (Oracle RAC Configuration Audit Tool) Upgrade Readiness Assessment
    can be used to obtain an automated upgrade-specific health check for upgrades
    to Oracle Infrastructure 11.2.0.3, 11.2.0.4, and 12.1.0.1. You can run the RACCheck
    Upgrade Readiness Assessment tool and automate many of the manual preupgrade and
    post upgrade checks.


    Oracle recommends that you download and run the latest version of RACcheck from
    My Oracle Support. For information about downloading, configuring, and running
    RACcheck configuration audit tool, refer to My Oracle Support note 1457357.1,
    which is available at the following URL:


    https://support.oracle.com/csp/main/article?cmd=showtype=NOTID&id=1457357.1


    # F.6 Using CVU to Validate Readiness for Oracle Clusterware Updates


    Review the contents in this section to validate that your cluster is ready for
    upgrades.


    # F.6.1 About the CVU Grid Validation Command Options


    Navigating to the stage for the upgrade, where the runcluvfy.sh command is located,
    and run the command runcluvfy.sh stage -pre crsinint -upgrade to check the readiness
    of your Oracle Clusterware installation for upgrades. Running runcluvfy.sh with
    the -pre crsinint -upgrade flags performs system checks to confirm if the cluster
    is in a correct state for upgrading from an existing cluster


    The command uses the following syntax, where variable content is indicated by
    italics:


    ```

    runcluvfy.sh -pre crsinint -upgrade [-n nodelist list] [-rolling] -src_crshome

    src_Gridhome -dest_crsshome dest_Gridhome -dest_version dest_version

    [-fixup (fixupdir path)] [-verbose]

    ```


    The options are:


    +   - nodelist

    The -n flag indicates cluster cluster member nodes, the comma-separated list of
    non-domain qualified node names on you want to run a preupgrade verification.
    If you do not add the -n flag to the verification command, then all the nodes
    in the cluster are verified. You must add the -n flag if the clusterware is down
    on the node where runcluvfy.sh is run.


    +   - rolling


    Use this flag to verify readiness for rolling upgrades.'
