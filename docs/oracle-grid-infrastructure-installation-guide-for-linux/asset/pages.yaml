    # 3.3.1 Identifying Storage Requirements for Oracle Automatic Storage Management


    To identify the storage requirements for using Oracle ASM, you must determine
    how many devices and the amount of free disk space you require. To complete this
    task, follow these steps:


    +   Determine whether you want to use Oracle ASM for Clusterware files (OCR and
    voting disks), Oracle database files, recovery files, or all files except for
    Oracle Clusterware or Oracle Database binaries. Oracle Database files include
    data files, control files, redo log files, the server parameter file, and the
