  md: '# Oracle Grid Infrastructure for a Cluster Installation Concepts


    This appendix explains the reasons for preinstallation tasks that you are asked
    to perform, and other installation concepts.


    This appendix contains the following sections:


    +   - Understanding Preinstallation Configuration

    - Understanding Storage Configuration

    - Understanding Server Pools

    - Understanding Out-of-Place Upgrade


    # D.1 Understanding Preinstallation Configuration


    This section reviews concepts about Oracle Grid Infrastructure for a Cluster preinstallation
    tasks. It contains the following sections:


    +   - Understanding Oracle Groups and Users

    - Understanding the Oracle Base Directory Path

    - Understanding Network Addresses

    - Understanding Network Time Requirements


    # D.1.1 Understanding Oracle Groups and Users


    This section contains the following topics:


    +   - Understanding the Oracle Inventory Group

    - Understanding the Oracle Inventory Directory


    # D.1.1.1 Understanding the Oracle Inventory Group


    You must have a group whose members are granted access to the Oracle Inventory
    (oraInventory) directory which is the central inventory directory of all Oracle
    software installations on servers. Members of this group have write privileges
    to the Oracle central inventory (oraInventory) directory and are also granted
    permissions for Oracle Cluster resources, OCR keys, directories in the Oracle
    Cluster home to which DW access, and other necessary privileges. By default, this
    group is called oinstall. The Oracle inventory group must be the primary group
    for Oracle software installations.


    The oraInventory directory contains the following:'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Understanding Preinstallation Configuration


    +   A registry of the Oracle home directories (Oracle Grid Infrastructure and
    Oracle Database) on the system

    * Installation logs and trace files from installations of Oracle software. These
    files are also copied to the respective Oracle homes for future reference.

    * Other metadata information regarding Oracle installations are stored in the
    individual Oracle home inventory directories, and are separate from the central
    inventory.


    You can configure one group to be the access control group for the Oracle Inventory,
    for database administrators (OSDBA), and for all other control groups used by
    Oracle software for operating system authentication. However, if you use one group
    to provide operating system authentication for all system privileges, this group
    must be the primary group for all users who you want to grant administrative system
    privileges.


    > Note: If software is already installed on the system, then the existing Oracle
    Inventory group must be the primary group of the operating system (oracle or grid)
    that you use to install Oracle Grid Infrastructure. Refer to ''Determining If
    the Oracle Inventory and Oracle Inventory Exists'' to identify an Oracle Inventory
    group.


    # D.1.1.2 Understanding the Oracle Inventory Directory


    The Oracle directory (oraInventory) is the central inventory location for all
    Oracle software installed on a server.


    The first time you install Oracle software on a system, you are prompted to provide
    an orainventory directory path.


    When you provide an Oracle base path not the environment variable ORACLE_BASE
    for the user performing the Oracle Grid Infrastructure installation, OUI creates
    the Oracle inventory in the path ORACLE_BASE../oraInventory. For example, if ORACLE_BASE
    is set to /opt/oracle/11, then the Oracle inventory is created in the path /opt/oracle/oraInventory,
    so that the central inventory for all installations is outside of the Oracle base
    for this particular Oracle installation user.


    If you enter a path not set ORACLE_BASE, then the Oracle Inventory directory is
    placed in the home directory of the user who is performing the installation. For
    example:


    ```

    /home/oracle/oraInventory

    ```


    As this can cause permission errors during subsequent installations with multiple
    Oracle software owners, Oracle recommends that you do not accept this option,
    and use an OFA-compliant path.


    For new installations, Oracle recommends that you create an Oracle path in compliance
    with OFA structure, such as /u01/app/oraInventory, that is owned by an Oracle
    software owner, or you set the Oracle base variable to an OFA-compliant path.


    If you set an Oracle base variable to a path such as /u01/app/grid or /u01/app/oraInventory
    then the Oracle Inventory is defaulted to the path using correct permissions to
    allow all Oracle installation owners to write to this central inventory directory.


    # D-2 Oracle Grid Infrastructure Installation Guide'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'By default, the Oracle Inventory directory is not installed under the Oracle
    base directory for the installation owner. This is because Oracle software installations
    share a common Oracle Inventory, so there is only one Oracle Inventory for all
    users, whereas there is a separate Oracle base for each user.


    # D.1.2 Understanding the Oracle Base Directory Path


    This section contains information about preparing an Oracle base directory.


    # D.1.2.1 Overview of the Oracle Base directory


    During installation, you are prompted to specify an Oracle base location, which
    is owned by the user performing the installation. You can choose a location with
    an existing Oracle home, or choose another directory location that does not have
    the structure for an Oracle base directory.


    Using the Oracle base directory path helps to facilitate the organization of Oracle
    installations, and to ensure that installations of multiple databases maintain
    an Optimal Flexible Architecture (OFA) configuration.


    # D.1.2.2 Understanding Oracle Base and Grid Infrastructure Directories


    Even if you do not use the same software to install Grid Infrastructure (Oracle
    Clusterware and ASM) or Oracle Database, be aware that the root.sh script during
    the Grid Infrastructure installation changes ownership of the home directory where
    cluster binaries are placed to root, and all ancestor directories to the root
    (/) are changed to root. For this reason, the Oracle Grid Infrastructure for a
    cluster home cannot be in the same location as other Oracle software.


    However, Oracle Grid Infrastructure for a standalone database–Oracle Restart can
    be in the same location as Oracle software.


    > See Also: Oracle Database Installation Guide for your platform or more information
    about Oracle Restart


    # D.1.3 Understanding Network Addresses


    During installation, you are asked to identify the planned use for each network
    interface that O detects on your cluster node. Identify each interface as a public
    or private interface, or as an interface you do not want Clusterware to use. Public
    and virtual IP addresses are configured on public interfaces. Private addresses
    are configured on private interfaces.


    Refer to the following details for detailed information about each address type:


    +   - About the Public IP Address

    - About the Private IP Address

    - About the Virtual IP Address

    - About the Grid Naming Service (GNS) Virtual IP Address

    - About the SCAN


    # D.1.3.1 About the Public IP Address


    The public IP address is assigned dynamically using DHCP, or defined statically
    in a DNS or in a hosts file. It uses the public interface (the interface with
    access available to clients).'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Understanding Preinstallation Configuration


    # D.1.3.2 About the Private IP Address


    Oracle Cluster uses interfaces marked as private for internode communication.
    Each cluster node needs to have an interface that you identify during installation
    as a private interface. Private interfaces need to have addresses configured for
    the interface itself, but no additional configuration is required. Oracle Cluster
    uses interfaces you identify as private for the cluster interconnect. If you identify
    multiple interfaces during formation for the private network, then Oracle Cluster
    configures them with Redundant Interconnect Usage. Any interface that you identify
    as private must be on a subnet that connects every node of the cluster. Oracle
    Cluster uses all the interfaces you identify for private interfaces.


    For the private interconnects, because of Cache Fusion and other traffic between
    nodes, Oracle strongly recommends using a physically separate, private network.
    If you configure addresses with a DNS, then you should ensure that the private
    IP addresses are reachable only by the cluster nodes.


    After installation, if you modify the interconnect on Oracle RAC with the CLUSTER_INTERCONNECTS
    initialization parameter, you must change it to a private IP address, on a subnet
    that is not used with a public IP address. Oracle does not support changing the
    interconnect to an interface with a subnet that you have designated as a public
    subnet.


    You should not have a firewall on the network with the private network IP addresses,
    as this can block interconnect traffic.


    # D.1.3.3 About the Virtual IP Address


    The virtual IP (VIP) address is registered in the GNS, or the DNS. Select an address
    for your VIP that meets the following requirements:


    +   - The IP address and host name are currently unused (it can be registered
    in a DNS, but should not be accessible by a ping command)


    +   - The VIP is on the same subnet as your public interface


    # D.1.3.4 About the Grid Naming Service (GNS) Virtual IP Address


    The GNS virtual IP address is a static IP address configured in the DNS. The DNS
    delegates queries to the GNS virtual IP address, and the GNS daemon responds to
    incoming name resolution requests at that address.


    Within the subnet, the GNS uses multicast Domain Name Service (mDNS), with Oracle
    Cluster, to enable the cluster to host host names and addresses added dynamically
    and removed from the cluster, without requiring additional configuration in the
    DNS.


    To enable GNS, you must have your network administrator provide a set of IP addresses
    for a subdomain assigned to the cluster (for example, grid.example.com), and delegate
    DNS requests for subdomain to the GNS virtual IP address for the cluster, which
    will serve. The set of addresses is provided to the cluster through DHCP, which
    must be available on the public network for the cluster.


    > See Also: Oracle Cluster Administration and Deployment Guide for more information
    about Grid Naming Service


    # D.1.3.5 About the SCAN


    Oracle Database 11g release 2 connects to the database using SCANs. The SCAN and
    its associated IP addresses provide a stable name for clients to use for connections,'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'independent of the nodes that make up the cluster. SCAN addresses, virtual
    IP addresses must all be on the same subnet.


    The SCAN is a virtual IP name, similar to the names used for virtual IP addresses,
    such as node-vip. However, unlike a virtual IP, the SCAN is associated with the
    entire cluster, rather than an individual node, and associated with multiple IP
    addresses, not just one.


    The SCAN works by being able to resolve to IP addresses in the cluster handling
    public client connections. When a client requests, the SCAN listener listening
    on a SCAN IP address and the SCAN port is made available to a client. Because
    all services on the cluster are registered with the SCAN listener, the SCAN replies
    with the address of the local listener on the least-loaded node where the service
    is currently being offered. Finally, the client establishes connection to the
    service through the node where service is offered. All of these actions take place
    transparent to the client without any explicit configuration required in the cluster.


    During installation listeners are created. They listen on the SCAN IP addresses
    provided on nodes for the SCAN addresses. Oracle Net Services routes requests
    to the least instance providing the service. Because the SCAN resolves to the
    cluster, rather than a node address in the cluster, nodes can be added to or removed
    from the cluster without affecting the SCAN configuration.


    The SCAN should be configured so that it is resolvable by using Grid Name Service
    (GNS) within the cluster, or by using Domain Name Service (DNS) resolution. For
    high availability and scalability, Oracle recommends that you configure the SCAN
    so it resolves to three IP addresses. At a minimum, the SCAN must resolve to at
    least one address.


    If you specify a DNS name, then the SCAN defaults to clustername-scan.GNS_domain.
    Otherwise, it defaults to clustername-scan.current_domain. For example, if you
    start Grid Infrastructure installation from the server node, the cluster name
    is mycluster, and the DNS is grid.example.com, then the SCAN is mycluster-scan.grid.example.com.


    Clients configured to use IP addresses for Oracle Database releases prior to Oracle
    Database 11g release 2 can continue to use their existing connections: SCAN is
    not required. When you upgrade to Oracle Cluster 11g release 2 (11.2), the SCAN
    becomes available. You should use the SCAN for connections to Oracle Database
    11g 2 or later databases. When an earlier version of Oracle Database is upgraded,
    it registers with the SCAN listeners, and clients can start using the SCAN to
    connect to database. The database registers with the SCAN listener through the
    remote listener parameter in the initora file. The REMOTE_LISTENER parameter must
    be set to SCAN:PORT. Do not use a TNSNAMES alias with a single address for the
    SCAN with HOST+SCAN.


    The SCAN is optimal for most deployments. However, clients using Oracle Database
    11g release 2 and policy-managed databases using server pools should access the
    database using the SCAN. This is because policy-managed databases can run on different
    servers at different times, so connecting to a particular virtual IP address for
    a policy-managed database is not possible.


    # D.1.4 Understanding Network Time Requirements


    Oracle Cluster 11g release 2 (11.2) is automatically configured with Cluster Time
    Synchronization Service (CTSS). This service provides automatic synchronization
    of all cluster nodes using the optimal synchronization strategy for the type of
    cluster'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Understanding Storage Configuration


    deploy. If you have an existing cluster synchronization service, such as NTP,
    then it will start in an observer mode. Otherwise, it will start in an active
    mode to ensure that time is synchronized between cluster nodes. CTSS will not
    cause compatibility issues.


    The CTSS module is installed as a part of Oracle Grid Infrastructure installation.
    CTSS daemons are started by the OHAS daemon (ohasd), and do not require a command-line
