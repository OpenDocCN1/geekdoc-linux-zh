  md: '# Checking the Network Requirements


    > **Note:** All host names must conform to the RFC 952 standard


    # 2.7.8 Network Interface Configuration Options


    The precise configuration you choose for your network depends on the size and
    use of the cluster you want to configure, and the level of availability you require.


    If certified Network-attached Storage (NAS) is used for Oracle RAC and this storage
    is connected through Ethernet-based networks, then you must have a third network
    interface for I/O. Failing to provide three separate interfaces in this case can
    cause performance and stability problems under load.


    # 2.7.9 Multiple Private Interconnects and Linux


    In Kernel 2.6.31 and above, which also includes Oracle Unbreakable Kernel 2.6.32,
    a bug has fix in the Reverse Path Filtering. As a consequence of this correction,
    RAC systems that use multiple NICs for the private interconnect now require specific
    settings for the `rp_filter` parameter. This requirement also applies to all Exadata
    systems that are running Linux 2.6.32 and above. Without these `rp_filter` parameter
    settings, interconnect packets can be blocked or discarded.


    The `rp_filter` value sets the Reverse Path filter to 0, strict filtering (1),
    or to loose filtering (2). Set the `rp_filter` value for the private interconnects
    to 0 or 2. Setting the private interconnect NIC to can cause connection issues
    on the private interconnect. It is not considered safe to disable or relax filtering,
    because the private interconnect should be on a private and isolated network.


    For example, where `eth1` and `eth2` are the private interconnects, and `eth0`
    is the public network, set the `rp_filter` value to 2 (loose filtering), the public
    address to 1 (strict filtering), using the following entries in `/etc/sysctl.conf`:


    ```

    net4.conf.eth2.rp_filter = 2

    net4.conf.eth1.rp_filter = 2

    net4.conf.eth0.rp_filter = 1

    ```


    Enterprise Linux 5.6 (Update 1) includes a fixing in inits-scripts-8.45.33-1.0.4.eli386.rpm,
    which sets the kernel parameter `net4.conf.default.rp_filter` to 2 (relaxed mode).
    For that reason, after you apply Unbreakable Kernel on top of Enterprise Linux
    5.6, you may not need to make manual changes, because the `rp_filter` value of
    all NICs is set to 2. If you require more strict path filtering on the public
    network, set the public `rp_filter` to 1.


    **See Also:** My Support note 1286796.1 rp_filter for multiple private interconnects
    and Linux Kernel 2.6.32+, which is available at the following:


    ```

    https://support.oracle.com

    ```


    # 2.7.10 Enabling the Name Service Cache Daemon


    To allow Oracle Cluster to better tolerate network failures with NAS devices or
    NFS mounts, enable the Name Service Cache Daemon (nscd).'
