- pgno: 136
  md: 'For example: If you have one local disk, /dev/sda, and one disk attached with
    external storage, then your server shows two connections, or paths, to external
    storage.

    The Linux SCSI driver shows both paths. They appear as /dev/sdb and /dev/sdc.
    The system may access it via /dev/sdb or /dev/sdc, but the content is the same
    disk.


    If you enable multipath, you have a multipath disk (/dev/multipath) which can
    access both /dev/sdb and /dev/sdc; any I/O to multipath can use either the sdb
    or sdc path. If a system is using the /dev/sdb path, and that cable is unplugged,
    the system shows an error. The multipath disk will switch from the /dev/sdb path
    to the /dev/sdc path.


    Most system software is unaware of multipath configurations. It can use any paths
    (sdb or sdc path). ASMLIB is also unaware of multipath configurations.


    By default, ASMLIB recognizes the first disk that Linux reports to, but it imprints
    an identity on that disk, it recognizes that only under one path. Depending on
    your storage device, it may recognize the multipath disk, or it may recognize
    one of the single disks


    Instead of reloading the default, you should configure Oracle ASM to recognize
    the multipath disk.


    # 3.3.1.5 Disk Scan Ordering The ASMLIB configuration file is located in the /etc/sysconfig/oracleasm.
    It contains all the configuration you specified with the command /etc/init.d/oracleasm
    configure. That command cannot configure scan ordering.


    The configuration file contains many variables. The ORACLE_SCANORDER specifies
    specific disks to be scanned. The ORACLE_SCANEXCLUDE variable specifies the disks
    that are to be ignored.


    Configure values for ORACLE_SCANORDER using space-delimited prefixes. A prefix
    string is the common string associated with a type of disk. For example, if you
    use the prefix string sda, then this matches all SCSI devices, including /dev/sda,
    /dev/sdb, /dev/sdc and so. Note that these are glo. They do not use glob cards.
    They are prefixes. Also note that the path is not a part of the prefix. For example,
    the /dev/ path is not part of the prefix for SCSI disks that are in the path /dev/.


    For Linux and Red Hat Enterprise Linux version 5, when scanning, the kernel sees
    the devices at /dev/mapper/XXX entries. By default, the 6.2 kernel device naming
    scheme udev creates /dev/mapper/XXX entries for human readability. Any configuration
    using ORACLE_SCANORDER should use the /dev/mapper/XXX entries.


    # 3.3.1.53 Configuring Disk Scan Ordering to Select Multipath Disks To configure
    ASMLIB to select multipath disks first, complete the following procedure:


    +   1. Using a text editor, open the ASMLIB configuration file /etc/sysconfig/oracleasm.


    +   2. Edit the ORACLE_SCANORDER variable to provide the prefix path of the multipath
    disks. For example, if the multipath disks use the prefix path (/dev/mapper/multipatha,
    /dev/mapper/multipathb and so on), the multipath disks mount SCSI disks, provide
    a prefix path similar to the following:


    +   3. Save the file.


    ```

    ORACLE_SCANORDER="multipath sd*"

    ```'
  merge: -1
  img_proc: true
- pgno: 137
  md: "When you have completed this procedure, when ASMLIB scans disks, it first scans\
    \ all disks with the prefix multipath, and labels these disks as Oracle ASM using\
    \ the /dev/mapper/multipathX value. It scans all with the prefix string sdb. However,\
    \ ASMLIB recognizes these disks have already been labeled with the /dev/mapper/multipath\
    \ string values, it ignores them. After scanning for the prefix strings multipath\
    \ and sdb, Oracle ASM then scans for any other disks that do not match the scan\
    \ order.\n\nIn the example in step 2, the key word multipath is actually the alias\
    \ for multipath devices configured in /etc/multipath.conf under the multipaths\
    \ section. For example:\n\n```\nmultipaths {\n    multipath {\n        wvd 3600508b4000156d7000120000000b000\n\
    \        alias multipath\n    }\n    multipath {\n        alias mympath\n    \
    \    ...\n    }\n}\n\n```\n\nThe default device name is in the /dev/mapper/mpath*\
    \ (or a similar path).\n\n# 3.3.1.5.4 Configuring Disk Order Scan to Exclude Single\
    \ Path Paths To configure ASMLIB to exclude particular single path disks, complete\
    \ the following procedure:\n\n+   1. Using a text editor, open the ASMLIB configuration\
    \ file\n/etc/sysconfig/oracleasm.\n\n+   2. Edit the ORACLEASM_SCANNEXCLUDE variable\
    \ to provide the prefix of the single path disks. For example, if you want to\
    \ exclude the single path disks /dev/sdb and /dev/sdc, then provide a prefix similar\
    \ to the following:\nORACLEASM_SCANNEXCLUDE=\"sdb sdc\"\n\n+   3. Save the file.\n\
    When you have completed this procedure, when ASMLIB scans disks, it scans all\
    \ disks except the disks with the sdb and sdc prefixes, so it ignores /dev/sdb\
    \ and /dev/sdc. It does not ignore other SCSI disks, multipath disks. If you have\
    \ a multipath disk (for example, /dev/multipath), which accesses both /dev/sdb\
    \ and /dev/sdc, you have configured ASMLIB to ignore sdb and sdc, then ASMLIB\
    \ ignores these and instead masks only the multipath disk as an Oracle ASM disk.\n\
    \n# 3.3.1.6 Configuring Devices Manually for Oracle ASM\n\nBy default, the 2.6\
    \ kernel file naming scheme udev creates device file names when the server is\
    \ started, and assigns ownership of them to root. udev applies default settings,\
    \ then changes device file names and owners for voting disks or Oracle Cluster\
    \ Registry partitions, for example, a voting disk on a device named /dev/vdd owned\
    \ by the user grid may be on a device named /dev/sdof owned by root after restarting\
    \ the server.\n\nIf you use ASMLIB, you do not need to ensure permissions and\
    \ device path persistency in udev."
