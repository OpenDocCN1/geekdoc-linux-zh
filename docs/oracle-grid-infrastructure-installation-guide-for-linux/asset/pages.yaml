- pgno: 180
  md: '# MEMORY_TARGET not supported on this system


    Cause: On Linux systems, insufficient /dev/shm size for PGA and SGA.


    If you are installing on a Linux system, note that Memory Size (SGA and PGA),
    which sets the initialization parameter MEMORY_TARGET or MEMORY_MAX_TARGET, cannot
    be greater than the shared memory file system (/dev/shm) on your operating system.


    Action: Increase the /dev/shm mountpoint size. For example:


    ```

    # mount -t tmpfs shmfs -o size=4g /dev/shm

    ```


    Also, to make this change persistent across system restarts, add an entry in /etc/fstab
    similar to the following:


    ```

    shms /dev/shm tmpfs size=4g 0

    ```


    # Nodes unavailable for selection from the OUI Node Section screen


    Cause: Oracle Grid Infrastructure is either not installed, or the Oracle Infrastructure
    services are not up and running.


    Action: Install Oracle Grid Infrastructure, or review the status of your installation.
    Consider restarting the nodes, as so may resolve the problem.


    # Node nodename is unreachable


    Cause: Unavailable IP host

    Action: Attempt the following:


    +   1. Run the command ifconfig -a Compare the output of this command with the
    contents of the /etc/hosts file to ensure that the node IP is listed.

    2. Run the command nslookup to see if the host is reachable.


    # PRVE-5: Insufficient space to import data from file to the cluster registry


    Cause: Insufficient space in an existing Oracle Cluster Registry device partition,
    which causes a failure while running rootupgrade.sh. To confirm, look for the
    error "quot:node12:not enough space in the backing store" in the log file Grid_home/hostname/client/ocrconfig_pid.log,
    where pid stands for the process.


    Action: Identify a storage device that has 300 MB or more available space. Oracle
    recommends you allocate the entire disk to Oracle ASM.


    # PRVE-0038: The SSH LoginGraceTime setting, or timeout: before authentication


    PRVE-0038: The SSH LoginGraceTime setting on "nodename" may result in users being
    disconnected before login is completed. This error occurs because the default
    timeout for SSH connections is too low, or if the LoginGraceTime parameter is
    commented out.


    Action: Oracle recommends uncommenting the LoginGraceTime parameter in the Open
    configuration file /etc/ssh/sshd_config, and setting it to a value of 0 (unlimited).


    # root.sh or rootupgrade.sh on the Second Node due to Multicast


    Cause: In the final stages while running root.sh or rootupgrade.sh on the second
    node, the following error is reported and the script fails:


    Failed to start Cluster Synchronisation Service in clustered mode at /u01/app/crs/11.2.0.2/crs/install/ocrconfig_lib.pm
    line 1016.'
  merge: -1
