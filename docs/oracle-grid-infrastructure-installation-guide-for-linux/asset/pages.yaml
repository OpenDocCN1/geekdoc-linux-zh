    # 4.3.2 Installing Oracle Grid Infrastructure Using a Cluster Configuration File


    During installation of Oracle Grid Infrastructure, you are given the option either
    of providing cluster configuration information manually, or of using a cluster
    configuration file. A cluster configuration file is a text file that you can create
    before starting OUI, which provides OUI with cluster node addresses that it requires
    to configure the cluster.


    Oracle suggests that you consider using a cluster configuration file if you intend
    to perform repeated installations on a test cluster, or if you intend to perform
    installation on many nodes.


    To create a cluster configuration file manually, start a text editor, and create
    a file that provides the name of the public and virtual IP addresses for each
    cluster member node, in the following format:


