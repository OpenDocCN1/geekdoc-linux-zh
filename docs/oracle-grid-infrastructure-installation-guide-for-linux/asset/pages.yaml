- pgno: 226
  md: '# Performing Rolling Upgrades from an Earlier Version


    **Note:** When you upgrade to Oracle Clusterware 11g Release 2 (11.2), Oracle
    Automatic Storage Management (ASM) is installed in the same home as Oracle Clusterware.
    In Oracle documentation, this home is called the Grid Infrastructure home, or
    Grid home. Also note that Oracle does not support attempting to add additional
    nodes to a cluster during a rolling upgrade.


    #  7.1.1 Performing a Rolling Upgrade of Oracle Clusterware


    Use the following procedure to upgrade Oracle Clusterware from an earlier release
    to a later release:


    > **Note:** Oracle recommends that you leave RAC instances running. When you start
    the root script on each node, node''s instances are shut down and then started
    again by the `rootupgrade.sh` script. If you upgrade from release 11.2.0.1 to
    any later version (11.2.0.2 or 11.2.0.3), then all nodes are selected by default.
    You can de-select the nodes.


    For single instance Oracle Databases on the cluster, only those that Oracle ASM
    need to be shut down. Listeners do not need to be shut down.


    +   1. Start the installer, and select the option to upgrade an existing Oracle
    Clusterware and ASM installation.

    2. On the node selection, select all nodes.

    3. When prompted, run the `rootupgrade.sh` script on each node in the cluster
    you want to upgrade.


    Run the script on the local node first. The script shuts down the earlier release
    installation, replaces it with the new Oracle Clusterware release, and starts
    the new Clusterware installation.


    After the script completes successfully, you can run the script in parallel on
    all nodes except for one, which you select as the last node. When the script runs
    successfully on all nodes except the last node, run the script on the last node.


    +   4. After running the `rootupgrade.sh` script on the last node in the cluster,
    if you are upgrading from release earlier than 11.2.0.1, and left the check box
    with ASMCA marked, as the default, then ASM Configuration Assistant runs automatically,
    and the Oracle Clusterware upgrade is complete. If you unchecked the box on the
    interview stage of the upgrade, ASMCA is not run.


    If an earlier version of Oracle Automatic Storage Management is installed, then
    the installer starts ASM Configuration Assistant to upgrade Oracle ASM to 11g
    (11.2). You can choose to upgrade Oracle ASM at this time, or upgrade it later.


    Oracle recommends that you upgrade Oracle ASM at the same time that you upgrade
    the Oracle Clusterware binaries. Until ASM is upgraded, databases that use Oracle
    ASM cannot be created. Until Oracle ASM is upgraded,


    How to Upgrade to Oracle Grid Infrastructure 11g Release 2 F-7'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'the 11g Release (11.2) Oracle ASM management tools in the Grid home (for example,
    svctl) will not work.


    +   2. Because the Oracle Grid Infrastructure home is in a different location
    than the former Oracle Cluster and Oracle ASM homes, update any scripts or applications
    that utilize utilities, libraries, or other files that reside in the Oracle Cluster
    and Oracle ASM homes.


    > Note: At the end of the upgrade, if you set the OCR backup location manually
    to the older release Oracle Cluster (CRS home), then you must set the OCR backup
    location to the Oracle Grid Infrastructure home (Grid home). If you did not set
    the OCR backup location manually, then this issue does not concern you.


    Because upgrades of Oracle Clusterware are out-of-place upgrades, the previous
    Oracle Cluster home cannot be the location of the OCR backups. Backups in the
    old Oracle Cluster home must be deleted.


    # F.7.2 Completing an Oracle Cluster Upgrade when Nodes Become Unreachable


    If some nodes become unreachable in the middle of an upgrade, you cannot complete
    the upgrade, because the upgrade script (rootupgrade.sh) did not run on the unreachable
    nodes. Because the upgrade is incomplete, Oracle Clusterware remains in the previous
    version. You can confirm that the upgrade is incomplete by executing the command
    crctl activeversion.


    To resolve this problem, run the rootupgrade.sh command with the -force flag using
    the following syntax:


    ```

    Grid_Home/rootupgrade -force

    ```


    For example:


    ```

    # /u01/app/11.2.0/grid/rootupgrade -force

    ```


    This command forces the upgrade to complete. Verify that the upgrade has been
    completed by the command crctl query activeversion. The active version should
    be the upgrade.


    # F.7.3 Performing a Rolling Upgrade of Oracle Automatic Storage Management


    After you have completed the Oracle Cluster 11g Release 2 (11.2), if you did not
    choose to upgrade ASM when you upgraded Oracle Clusterware, then you can separate
    it using the Oracle Automatic Storage Management Configuration Assistant (asmca)
    to perform rolling upgrades.


    You can asca to complete the upgrade separately, but you should do it soon after
    you upgrade Oracle Cluster, as Oracle ASM management tools as svctl will not work
    until Oracle ASM is upgraded.


    > Note: ASMCA performs a rolling upgrade only if the earlier version of Oracle
    ASM is either 11.1.0.6 or 11.1.0.7. Otherwise, ASMCA performs a normal upgrade,
    in which ASMCA brings down all Oracle ASM instances on all of the nodes, and brings
    them all up in the new Grid home.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# F.7.3.1 Preparing to Upgrade Oracle ASM


    Note the following if you intend to perform rolling upgrades of Oracle ASM


    +   The active version of Oracle Clusterware must be 11g Release 2 (11.2). Determine
    the active version, entering the following command:


    $ csctl crs activeversion


    +   You can upgrade a single instance Oracle ASM installation to a clustered Oracle
    ASM installation. However, you can only upgrade an existing instance Oracle ASM
    installation if you run the installation from the node on which the Oracle ASM
    is installed. You cannot upgrade a single instance ASM installation on a remote
    node.


    +   You must ensure that any rebalance operations on your existing ASM installation
    are completed before starting the upgrade process.

    During the upgrade process, you alter the Oracle ASM instances to an upgrade state.
    Because this upgrade state limits ASM operations, you should complete the upgrade
    process soon after you begin. Here are the operations allowed when Oracle ASM
    instance is in the upgrade state:

    - Diskgroup mounts and dismounts

    - Opening, resizing, or deleting database files

    - Recovering instances

    - Queries of fixed views and packages: Users are allowed to query fixed views
    and run any PL/SQL blocks using fixed packages, such as dbms_diskgroup


    # F.7.3.2 Upgrading Oracle ASM


    Complete the following procedure to upgrade Oracle ASM:


    +   1. On the node you plan to start the upgrade, set the environment variable
    ASMCA_ROLLING_UPGRADE as true. For example:


    $ export ASMCA_ROLLING_UPGRADE=true


    +   2. From the Oracle Grid Infrastructure 11g Release 2 (11.2) home, start ASMCA.
    For example:


    $ cd /u01/11.2/grid/bin

    $ ./.asmca


    +   3. Select Upgrade.

    ASM Configuration Assistant upgrades Oracle ASM in succession for all nodes in
    the cluster.


    +   4. After you complete the upgrade, run the command to unset the ASMCA_ROLLING_UPGRADE
    environment variable.


    See Also: Oracle Database Upgrade Guide and Oracle Automatic Storage Management
    Administrator''s Guide for additional information about preparing an upgrade plan
    for Oracle ASM, and for starting, completing, and stopping Oracle ASM upgrades'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# F.8 Updating DB Control and Grid Control Target Parameters


    Because Oracle Clusterware release 2 (11.2) is an out-of-place upgrade of the
    Oracle Clusterhome in a new location (the Oracle Grid Infrastructure for a Cluster
    home, or Grid home), the path for the CRS HOME parameter in system files must
    be changed. If you do not change the parameter, then you you encounter errors
    such as ''cluster target broken'' on DB control or Grid control.


    Use the following procedure to resolve this issue:


    +   1. Log in dbconsole or gridconsole.

    2. Navigate to the Cluster tab.

    3. Click Monitoring Configuration

    4. Update the value for Oracle Home with the new Grid home path.


    # F.9 Unlocking the Existing Oracle Clusterware Installation


    After upgrade from previous releases, if you want to reinstall the previous release
    Oracle Grid Infrastructure home, then you must first change the permission and
    ownership of the previous release Grid home. Complete this task using the following
    procedure:


    Log in as root and change the permission and ownership of the previous release
    Grid home using the following command syntax, oldGH is the previous release Grid
    home, suowner is the Grid Infrastructure installation owner, and oldGHParent is
    the parent directory of the previous release Grid home:


    ```

    #chmod -R 755 oldGH

    #chown -R suowner oldGH

    #chown -R suowner oldGHParent

    ```


    For example:


    ```

    #chmod -R 755 /u01/app/11.2.0.1/grid

    #chown -R /u01/app/11.2.0.1/grid

    #chown -R /u01/app/11.2.0.1

    ```


    After you change the permissions and ownership of the previous release Grid home,
    log in as the Oracle Grid Infrastructure owner (in the preceding example), and
    use the 11.2.0.2 standalone deinstallation tool to remove the release Grid home
    tool (oldGH).


    You can obtain the standalone deinstallation tool from the following:


    ```

    http://www.oracle.com/technet/database/enterprise-edition/downloads/index.html

    ```


    Click the See All for the downloads for your operating system platform, and scan
    the list of downloads for the deinstallation tool.


    # F.10 Downgrading Oracle Clusterware After an Upgrade


    After a successful or a failed upgrade to Oracle Clusterware 11g Release 2 (11.2),
    you can restore Oracle Clusterware to the previous version.


    The restoration procedure in this section restores the Oracle Clusterware configuration
    to the state it was before the Oracle Clusterware 11g Release 2 (11.2) upgrade.
    Any configuration changes you performed during or after the Oracle Grid Infrastructure
    11g Release 2 (11.2) upgrade are removed and cannot be recovered.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Downgrading Oracle Clusterware After an Upgrade


    In the following procedure, the local node is the first node on which the rootupgrade
    script was run. The remote nodes are all other nodes that were upgraded.

    To restore Oracle Clusterware to the previous release:


    +   1. Use the downgrade procedure for the release to which you want to downgrade.


    **Downgrading to releases prior to 11g release 2 (11.2.0.1)**

    On all remote nodes, use the command syntax `Grid_home/perl/bin/perl rootcrs.pl
    -downgrade [-force]` to stop the 11g Release 2 (11.2) resources, shut down the
    11g Release 2 (11.2) stack.


    > > Note: This command does not reset the OCR, or delete `ocr.loc`.


    Command syntax is as follows:


    ```

    # /u01/app/11.2.0/grid/perl/bin/perl rootcrs.pl -downgrade -oldcrshome -version

    ```


    For example:


    ```

    # /u01/app/11.2.0/grid/perl/bin/perl rootcrs.pl -downgrade -oldcrshome

    /u01/app/crs -version 11.1.0.1

    ```


    > > Note: Ensure that Oracle Cluster version is specified in the correct format.
    For example, 11.1.0.1.


    If you want to stop a partial or failed 11g Release 2 (11.2) installation and
    restore the previous Oracle Clusterware, then use the -force flag with this command.


    **Downgrading to a release 11.2.0.1 or later release:**


    Use the command syntax `Grid_home/perl/bin/perl rootcrs.pl -downgrade -oldcrshomeGridHomePath
    -version oldGridversion`, where oldgridhomepath is the path to the previous release
    Oracle Grid Infrastructure, and oldGridversion is the version you want to downgrade
    to:


    ```

    # /u01/app/11.2.0/grid/perl/bin/perl rootcrs.pl -downgrade

    /u01/app/11.2.0/grid -version 11.2.0.1

    ```


    If you want to stop a partial or failed 11g Release 2 (11.2) installation and
    restore the previous Oracle Clusterware, then use the -force flag with this command.


    +   2. After `rootcrs.pl -downgrade` script executes on all remote nodes, the
    local node uses the command syntax `Grid_home/crs/install/rootcrs.pl -downgrade
    -oldcrshome11.2_crs_home -version 11.2_crs_version [-force]`, where `11.2_crs_home`
    is the home of the earlier Oracle Cluster installation, and `11.2_crs_version`
    is the release number of the earlier Oracle Cluster installation.


    For example:


    ```

    # /u01/app/11.2.0/grid/perl/bin/perl rootcrs.pl -downgrade -lastnode

    -oldcrshome

    /u01/app/crs -version 11.1.0.6

    ```


    How to Upgrade to Oracle Grid Infrastructure 11g Release 2 F-11'
  merge: -1
  img_proc: true
