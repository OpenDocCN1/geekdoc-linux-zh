    # 3.2.8 Enabling Direct NFS Client Disk Manager of NFS


    Complete the following procedure to enable Direct NFS Client:


    +   1. Create an orstab file with the following attributes for each NFS server
    to be

    used using Direct NFS Client:

    * Server: The NFS server name.

    * Local: Up to four paths on the database host, specified by IP address or by

    ame, as using the ifconfig command run on the database host.

    * Path: Up to four network paths to the NFS server, specified either by IP

    address, or by name, as displayed using the ifconfig command on the NFS

    server.

    * Export: The exported path from the NFS server.

    * Mount: timeout (in seconds) the time Direct NFS Client should want

    a a successful mount before timing out. This parameter is optional.

    default timeout is 10 minutes (660).

    * Droute: Specifies that outgoing messages should not routed by the

    operating system, but instead using the IP address to which they are

    bound. Note that this POSIX option sometimes not work on Linux

    systems with paths in the same subnet.

    * management: Enables Direct NFS Client to use the management interface for

    SNMP queries. You can use this parameter if SNMP is running on separate

    management interfaces on the NFS server. The default value is the server

    value.

    * community: Specifies the community string for SNMP queries. Default

    value is public.


    The examples that follow three possible NFS server entries in orstab. A

    single orstab can have multiple NFS server entries.


    Example 3-1 Using Local and Path NFS Server Entries

    The following example uses both local and path. Since they are in different subnets,
    we

    d not have to specify droute.


    ```

    server: MyDatabaseServer

    local: 192.0.2.0

    path: 192.0.100.0

    local: 192.0.100.0

    path: 192.0.100.1

    export: /vol/ordatal mount: /mnt/ordatal

    community: private

    ```'
