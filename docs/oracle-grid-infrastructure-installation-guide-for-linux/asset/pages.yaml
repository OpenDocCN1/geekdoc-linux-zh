- pgno: 14
  md: '# # What''s New in Oracle Grid Infrastructure Installation and Configuration?


    This section describes new features as they pertain to the installation and configuration
    of Oracle Grid Infrastructure (Oracle Clusterware and Oracle Automatic Storage
    Management), and Oracle Real Application Clusters (Oracle RAC). This guide replaces
    Clusterware Installation Guide. The topics in this section are:


    +   - New Features for Release 2 (11.2.0.4)

    - Desupported Options for Release 2 (11.2.0.4)

    - New Features for Release 2 (11.2.0.3)

    - New Features for Release 2 (11.2.0.2)

    - New Features for Release 2 (11.2)

    - New Features for Release 1 (11.1)


    # New Features for Release 2 (11.2.0.4)


    The following is a list of new features for Release 2 (11.2.0.4):


    # ### Cluster and Oracle RAC Diagnosticability Tools Enhancements


    Starting with Oracle Grid Infrastructure 11g Release 2 (11.2.0.4), the Trace File
    Analyzer and Collector is installed automatically with Oracle Grid Infrastructure
    installation. The Trace File Analyzer and Collector is a diagnostic utility to
    simplify diagnostic collection on Oracle Clusterware, Oracle Grid Infrastructure,
    and Oracle RAC systems.


    > > Note: The Trace File Analyzer and Collector is available starting with Oracle
    Grid Infrastructure 11g Release 2 (11.2.0.4).


    See Also: Oracle Clusterware Administration and Deployment Guide for information
    about using Trace File Analyzer and Collector


    # ### Oracle Database Health Checks and Best Practice Recommendation


    Oracle RAC Configuration audit tool (RACcheck) is available with Oracle Grid Infrastructure
    11g Release 2 (11.2.0.4) for assessment of single instance and Oracle RAC database
    installations for known configuration issues, best practices, regular health checks,
    and pre- and post upgrade best practices.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Note: The Oracle RAC Configuration Audit tool is available starting with Oracle
    Grid Infrastructure 11g Release 2 (11.2.0.4).


    See Also: Oracle Real Application Clusters Administration and Deployment Guide


    # Unsupported Options for Release 2 (11.2.0.4)


    The following features are no longer supported with Oracle Grid Infrastructure
    11g Release 2 (11.2.0.4):


    Block and Row Devices Not Supported with OUI

    With this, OUI no longer supports installation of Oracle Cluster files on block
    or row devices. Install Oracle Cluster files either on Oracle Automatic Storage
    Management disk groups, or in a supported file system.


    Deprecation of -cleanupOBase

    The -cleanupBase flag of the deinstallation tool is deprecated in this release.
    There is no replacement for this flag.


    # New Features for Release 2 (11.2.0.3)


    The following is a list of new features for Release 2 (11.2.0.3):


    +   Oracle ACFS and ADVM Support for Oracle Linux (UEK)

    Oracle ASM 11g (11.2.0.3) for Linux on x86-64 bits provides support for Oracle
    Automatic Storage Management Cluster File System (ACFS) and Oracle ASM Dynamic
    Volume Manager (ADVM) on Oracle Linux kernels UEKs-2.6.32-100.34.1 and subsequent
    updates to 2.6.32-100 Oracle kernels.


    +   Oracle ACFS and ADVM Support for SUSE Enterprise Linux 11

    Oracle ASM 11g (11.2.0.3) for Linux on x86-64 bits provides support for Oracle
    Automatic Storage Management Cluster File System (ACFS) and Oracle ASM Dynamic
    Volume Manager (ADVM) on SUSE Enterprise Linux 11 Service Pack 1 (SLES11 SP1),
    64 bit only.


    +   Oracle Clusterware Upgrade Configuration Feature

    If nodes become unreachable in the middle of an upgrade, starting with release
    11.2.0.3, you can run the rootupgrade.sh script with the -force flag to upgrade
    to complete.


    # New Features for Release 2 (11.2.0.2)


    The following is a list of new features for Release 2 (11.2.0.2):


    +   Configuration Wizard for the Oracle Grid Infrastructure Software

    The Oracle Grid Infrastructure Configuration Wizard allows you to configure the
    Oracle Grid Infrastructure software after performing a software-only installation.
    No longer have to manually edit the config_params configuration file as this wizard
    takes you through the process, step by step.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'See Also: Oracle Clusterware Administration and Deployment Guide for more information
    about the configuration wizard.


    # Enhanced Patch Set Installation


    Starting with the release of the 11.2.0.2 patch set for Oracle Grid Infrastructure
    11g Release 2 (Oracle Clusterware and Oracle Automatic Storage Management), Oracle
    Grid Infrastructure patch sets are full installations of the Oracle Grid Infrastructure
    software. The following changes come with the new patch set packaging:


    +   - Direct upgrades from previous releases (11.x, 10.x) to the most recent patch
    set are supported.


    +   - Out-of-place patch sets are only supported. An out-of-place upgrade is one
    in which you install the patch set into a new, separate home.


    +   - New installations consist of installing the most recent patch set, rather
    than installing a base release and upgrading to a patch release.


    See Also: My Oracle Support note 1189783.1, "Important Changes to Oracle Database
    Patch Sets Starting With 11.2.0.2", available from the URL:


    ```

    https://support.oracle.com

    ```


    # Oracle ACFS and ADVM Support for SUSE Linux


    Oracle ASM 11 release 2 (11.2.0.2) and for Linux on x86-64 bit systems support
    for Oracle ASM Dynamic Volume Manager (ADVM) on SUSE Linux 10 Service Pack 3 (SLES10
    SP3) and later SLES10 service packs (64 bit only).


    # Cluster Health Monitor Included with Oracle Clusterware


    Cluster Health Monitor gathers system metrics in real time, and others in its
    repository for later analysis, so that it can determine the root cause of many
    Clusterware and Oracle RAC issues with the assistance of Oracle Support.


    Cluster Health Monitor also works in conjunction with Oracle Database Quality
    of Service Management (QoS) by providing metrics to detect memory over-commitment
    on a node. QoS Management can shut down services on overloaded nodes to relieve
    stress and preserve existing workloads.


    To support QoS Management, Oracle Database Resource Manager and metrics have been
    enhanced to support fine-grained performance metrics, and also can manage workloads
    with user-defined performance classes.


    > Note: Cluster Health Monitor is not available with IBM: Linux on System z.


    # Grid Installation Owner and ASMOPER


    During installation, in the Privileged Operating System groups, it is optional
    to designate a group as the OSOPER for ASM group. If you choose to create an OSOPER
    for ASM group, then you can enter a group name configured on all cluster member
    nodes for the OSOPER for ASM group. In addition, the Grid Infrastructure installation
    owner no longer is required to be a member.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# New Software Updates Option


    Use the Software Updates feature to dynamically download and apply updates as
    part of the Oracle Database installation. You can also download the updates separately
    using the downloadupdates option and later apply them during the installation
    by providing the location where the updates are present.


    # Redundant Interconnect Usage


    In previous releases, make use of redundant networks for the interconnect, bonding,
    trunking, or similar technology was required. Oracle Grid Infrastructure and Oracle
    RAC can now use of redundant network interconnects, without the use of other technology,
    to enhance optical communication in the cluster. This functionality is available
    starting with Oracle Database 11g Release 2 (11.2.0.2).


    Redundant Interconnect Usage enables load-balancing and high availability across
    multiple (up to four) private networks (also known as interconnects).


    # Oracle Database Quality of Service Management


    The Database Quality of Service (QoS) Management Server allows administrators
    to manage application service levels hosted in Oracle clusters by correlating
    run-time performance and resource metrics and analyzing with an expert system
    to produce recommended resource adjustments to meet policy-based objectives.


    Oracle Database Quality of Service Management is not available for Linux on System


    > **See Also:** Oracle Database Quality of Service Management User''s Guide


    # New Features for Release 2 (11.2)


    The following is a list of new features for installation of Oracle Clusterware
    and Oracle ASM 11g release 2 (11.2):


    # Oracle Automatic Storage Management and Oracle Clusterware


    With Oracle Grid Infrastructure 11g release 2 (11.2), Oracle Automatic Storage
    Management (ASM) and Oracle Clusterware are installed into a single home directory,
    which is referred to as the Grid Infrastructure home. Configuration assistants
    start after the installer interview process that configures Oracle ASM and Clusterware.


    The installation of the combined products is called Oracle Grid Infrastructure.
    However, Oracle Clusterware and Oracle Automatic Storage Management remain separate
    products.


    > **See Also:** Oracle Database Guide for Linux for information about how to install
    Oracle Grid Infrastructure (Oracle ASM and Oracle Cluster binaries) for a standalone
    server. This feature helps to ensure high availability for single-instance servers


    # Oracle Automatic Storage Management and Oracle Clusterware Files


    With this release, Oracle Cluster Registry (OCR) and voting disks can be placed
    on Oracle Automatic Storage Management (Oracle ASM).


    This feature enables Oracle ASM to provide a unified storage solution, storing
    all the data for the clusterware and the database, without the need for third-party
    volume managers or cluster filesystems.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'For new installations, OCR and voting disk files can be placed either on Oracle
    ASM, or on a cluster file system or NFS system. Installing Oracle Clusterware
    on raw or block devices is no longer supported, unless an existing system is upgraded.


    # Oracle Automatic Storage Management Cluster File System (Oracle ACFS)


    Oracle Automatic Storage Management Cluster File System (Oracle ACFS) is a new
    multi-platform, scalable file system and storage management design that extends
    Oracle Automatic Storage Management (Oracle ASM) technology to support all application
    data. Oracle ACFS provides dynamic file system resizing, and improved performance
    using the distribution, balancing and striping technology across all available
    disks, and provides storage reliability through the mirroring and parity protection
    Oracle ASM provides.


    # Oracle ASM Job Role Separation with SYSASM


    The SYSASM privilege was introduced in Oracle ASM 11g release 1 (11.1) is fully
    separated from the SYSDBA privilege. If you choose to include this optional feature,
    designate different operating systems as the OSASM and the OSDBA groups, then
    the SYSASM administrative privilege is available only to members of the OSASM
    group. The SYSASM privilege also can be granted with password authentication on
    the Oracle ASM instance.


    You can designate OPERATOR privileges (a subset of the SYSASM privileges, including
    starting and stopping Oracle ASM) to members of the OSOPER for ASM group.


    Providing system privileges for the storage tier using SYSASM instead of the SYSDBA
    privilege provides a clearer division of responsibility between Oracle ASM administration
    and database administration, and to prevent different databases using the same
    storage from accidentally overwriting each other''s files.


    > **See Also:** Oracle Automatic Storage Management Administrator''s Guide


    # Cluster Time Synchronization Service


    Cluster nodes should be synchronized. With this release, Oracle Cluster provides
    Cluster Time Synchronization Service (CTSS), which ensures that there is a synchronization
    service in the cluster. If Network Time Protocol (NTP) is not found during configuration,
    then CTSS is configured to ensure time synchronization.


    # Enterprise Manager Database Cluster Provisioning


    Oracle Manager Database Control 11 provides the capability to automatically provision
    Oracle Grid Infrastructure and Oracle RAC installations on new nodes, and then
    extend the existing Oracle Grid Infrastructure and Oracle RAC database to these
    provisioned nodes. This provisioning procedure requires a successful Oracle RAC
    installation before you can use this feature.


    > **See Also:** Oracle Real Application Clusters Administration and Deployment
    Guide for information about this feature


    # Fixup Scripts and Grid Infrastructure Checks


    With Oracleware 11g release 2 (11.2), Oracle Universal Installer (OUI) detects
    when minimum requirements for installation are not completed, and creates script
    programs, called fixed scripts, to resolve many incomplete system configuration
    requirements. If OUI detects an incomplete task that is marked "fixable", then
    you can'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'easily fix the issue by generating the fixup script by clicking the Fix & Check
    Again button.


    The fixup script is generated during installation. You are prompted to run the
    script as root in a separate terminal session. When you run the script, it raises
    kernel values to required minimums, if necessary, and completes other system configuration
    tasks.


    You also can have Cluster Verification Utility (CVU) generate fixup scripts before
    installation.


    # Grid Plug and Play


    In the past, adding or removing servers in a cluster required extensive manual
    preparation. With this release, you can continue to configure server nodes manually,
    or use Grid Plug and Play to configure them dynamically as nodes are added or
    removed from the cluster.


    Grid Plug and Play reduces the costs of installing, configuring, and managing
    server nodes by starting a grid naming service within the cluster to allow each
    node to perform the following tasks dynamically:


    +   - Negotiating appropriate network identities for itself

    - Acquiring additional information it needs to operate a configuration profile

    - Configuring or reconfiguring itself using profile data, making host names and
    addresses resolves on the network


    Because servers perform these tasks dynamically, the number of steps required
    to add or delete nodes is minimized.


    # Improved Input/Output Fencing Processes


    Oracle Clusterware 11g release 2 (11.2) replaces the oprod and Hangcheck processes
    with the cluster synchronization service daemon Agent and Monitor to provide more
    accurate recognition of hangs and avoid false termination.


    # Intelligent Platform Management Interface (IPMI) Integration


    Intelligent Platform Management Interface (IPMI) is an industry standard management
    protocol that is included with many servers today. IPMI operates independently
    of the operating system, and can operate even if the system is not powered. Servers
    with IPMI contain a baseboard management controller (BMC) which is used to communicate
    to the server.


    If IPMI is configured, Oracle Clusterware uses IPMI when node fencing is required
    and the server is not responding.


    # Oracle Clusterware Out-of-place Upgrade


    With this release, you can install a new version of Oracle Clusterware to a separate
    home from the existing Oracle Cluster installation. This feature reduces the downtime
    to upgrade a node in the cluster. When performing an out-of-place upgrade, the
    old and new version of the software are present on the nodes at the same time,
    each in a different location, but only one version of the software is active.


    # Oracle Clusterware Administration with Oracle Enterprise Manager


    With this release, you can use Oracle Enterprise Manager Cluster Home page to
    perform full administrative and monitoring support for both standalone database
    and'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Oracle RAC environments, using High Availability Application and Oracle Cluster
    Resource Management.


    When Oracle Enterprise Manager is installed with Oracle Clusterware, it can provide
    a set of users who have the Oracle Clusterware Administrator role in Oracle Enterprise
    Manager, and provide full administrative and monitoring support for High Availability
    application and Oracle Clusterware resource management. After you have provisioned
    Oracle Enterprise Manager deployed, you can provision additional nodes added to
    the cluster using Oracle Enterprise Manager.


    # SCAN for Simplified Client Access


    With this release, the Single Client Access Name (SCAN) is the host name to provide
    for all clients connecting to the cluster. The SCAN is registered to at least
    one up to three IP addresses, either in the domain name service (DNS) or the Grid
    Naming Service (GNS). The SCAN eliminates the need to change clients when nodes
    are added or removed from the cluster. Clients can also access the cluster using
    EZCONNECT.


    # SRVCTL Command Enhancements for Patching


    With this release, you can use the server control utility SRVCTL to shut down
    all Oracle software running within an Oracle home, or for patching. Oracle Infrastructure
    patching is automated across all nodes, and patches can be applied in a multi-node,
    multi-patch fashion.


    # Typical Installation Option


    To streamline cluster installations, especially for those customers who are new
    to clustering, Oracle introduces the Typical Installation path. Typical installation
    defaults as many options as possible to follow these recommended best practices.


    # Voting Disk Backup Procedure Change


    In prior releases, backing up the voting disks with a dd command was a required
    postinstallation task. With Oracle Clusterware release 11.2 and later, backing
    up and restoring a voting disk using the dd command is not supported.


    Backing up voting disks manually is no longer required, because voting disks are
    backed up automatically in the OCR or for any configuration change. Voting disk
    data is automatically restored to any added voting disks.


    **See Also:** Oracle Clusterware Administration and Deployment Guide


    # New Features for Release 1 (11.1)


    This is a list of new features for release 1 (11.1).


    # Changes in Installation Documentation


    With Oracle Database 1g release 1, Oracle Cluster can be installed or configured
    as an independent product, and additional documentation is provided on storage
    administration. For installation planning, note the following documentation:


    # Oracle Database 2 Day + Real Application Clusters Guide


    This book provides an overview and examples of the procedures to install and configure
    a two-node Oracle Clusterware and Oracle RAC environment.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Oracle Clusterware Installation Guide


    This book (the guide that you are reading) provides procedures either to install
    Oracle Clusterware as a standalone product, or to install Oracle Clusterware with
    either Oracle Database, or Oracle RAC. It contains system configuration instructions
    that require system administrator privileges.


    # Oracle Real Application Clusters Installation Guide


    This platform-specific book provides procedures to install Oracle RAC after you
    have completed an Oracle Clusterware installation. It contains database configuration
    instructions for database administrators.


    # Oracle Database Storage Administrator''s Guide


    This book provides information for database and storage administrators who administer
    and manage store, or who configure and administer Oracle Automatic Storage Management
    (ASM).


    # Oracle Clusterware Administration and Deployment Guide


    This is the administrator''s reference for Oracle Clusterware. It contains information
    about administrative tasks, including those that involve changes to operating
    system configurations and cloning Oracle Clusterware.


    # Oracle Real Application Clusters Administration and Deployment Guide


    This is the administrator''s reference for Oracle RAC. It contains information
    about administrative tasks. These tasks include database clustering, node addition
    and deletion, Oracle Cluster Registry (OCR) administration, use of SRCTL and other
    database administration utilities, and tuning changes to operating system configurations.


    # Release 1 (11.1) Enhancements and New Features for Installation


    The following is a list of enhancements and new features for Oracle Database 11g
    release (11.1):


    # New SYSASM Privilege and OSASM operating system group for Oracle ASM Administration


    This feature introduces a new SYSASM privilege that is specifically intended for
    performing Oracle ASM administration tasks. Using the SYSASM privilege instead
    of SYDSBA provides a clearer division of responsibility between Oracle ASM and
    database administration.


    OSASM is a operating system group that is used exclusively for Oracle ASM. Members
    of the OSASM group can connect as SYSASM using operating system authentication
    and full access to Oracle ASM.


    # Oracle Preinstallation RPM (formerly Oracle Valid RPM)


    The Preinstallation RPM can be installed on servers using Red Hat Enterprise Linux
    or Oracle Linux operating systems. It is available from the Unbreakable Linux
    Network (ULN). This RPM completes preinstallation configuration tasks required
    for installing Oracle Clusterware, including setting kernel parameters and adding
    required kernel RPMs. It also prepares a server for installing Oracle RAC. To
    register your server on the Unbreakable Linux Network, or to find out more information,
    refer to the following URL:


    ```

    https://linux.oracle.com

    ```'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 1 Typical Installation for Oracle Grid Infrastructure for a Cluster


    This chapter describes the difference between a Typical and Advanced installation
    for Oracle Grid Infrastructure for a cluster, and describes the steps required
    to complete a Typical installation.


    This chapter contains the following sections:


    +   - Typical and Advanced Installation

    - Preinstallation Steps Completed Using Typical Installation

    - Preinstallation Steps Requiring Manual Tasks


    # 1.1 Typical and Advanced Installation


    There are two installation options for Oracle Grid Infrastructure installations:


    +   - **Typical Installation:** The Typical installation option is a simplified
    installation with a minimal number of manual configuration choices. Oracle recommends
    that you select this type of installation for most cluster implementations.

    - **Advanced Installation:** The Advanced installation option is an advanced procedure
    that requires a higher degree of system knowledge. It enables you to select particular
    configuration choices, including additional storage and network choices, use of
    operating system group authentication for role-based administrative privileges,
    integration with IPMI, or more granularity in specifying Oracle Automatic Storage
    Management roles.


    # 1.2 Preinstallation Steps Completed Using Typical Installation


    With Oracle Clusterware 11g Release 2 (11.2), during installation Oracle Universal
    Installer (OUI) generates scripts (`runifup.sh`) that you can run to complete
    preinstallation steps.


    Fixup scripts are generated during installation. You are prompted to run scripts
    as root in a separate terminal session. When you run scripts, they complete the
    configuration tasks:


    +   - If necessary, sets kernel parameters required for installation and runtime
    to at least the minimum value.

    - Reconfigures primary and secondary group memberships for the installation owner,
    if necessary, for the Oracle Inventory directory and the operating system privileges
    groups.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Preinstallation Steps Requiring Manual Tasks


    +   - Sets shell limits if necessary to required values.


    # 1.3 Preinstallation Steps Requiring Manual Tasks


    Complete the following manual configuration tasks


    +   - Verify System Requirements

    - Check Network Requirements

    - Check Operating System Packages

    - Create Groups and Users

    - Check Storage

    - Prepare Storage for Oracle Automatic Storage Management

    - Install Oracle Grid Infrastructure Software


    See Also: Chapter 2, "Advanced Installation Oracle Grid Infrastructure for a Cluster
    Preinstallation Tasks" and Chapter 3, "Configuring Storage for Oracle Grid Infrastructure
    for a Cluster and Oracle RAC" if you need any information about how to complete
    these tasks


    # 1.3.1 Verify System Requirements


    Enter the following commands to check available memory:


    ```

    grep MemTotal /proc/meminfo

    grep SwapTotal /proc/meminfo

    ```


    Ensure that swap space is greater or equal to the minimum size required for installation
    as described in the following tables:


    | Table 1-1 Swap Space Required for 64-bit Linux and Linux on System z |

    | Available RAM | Swap Space Required |

    | Between 2 GB and 32 GB | Equal to the size of RAM |

    | More than 32 GB | 32 GB of RAM |


    If the swap space and the Grid home are on the same filesystem, then add their
    respective requirements for the total minimum space required.


    ```

    df -h

    ```


    This command checks the available space on file systems. If you use normal redundancy
    for Oracle Cluster files, which is three Oracle Cluster Registry (OCR) locations
    and three voting disk locations, you should have at least 2 GB of file space available
    on shared storage volumes reserved for Oracle Grid Infrastructure files.


    > Note: You cannot install OCR or voting disk files (Oracle Cluster files) on
    raw partitions. You can install only on Oracle ASM, or on a supported storage
    option. The only use for raw devices is as Oracle ASM disks.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'If you plan to install on Oracle ASM, to ensure high availability of OCR or
    voting disk files on Oracle ASM, you need to have at least 2 GB for Oracle Cluster
    in three separate failure groups, with at least three physical disks. Each disk
    must have at least 1 GB of capacity to ensure that there is sufficient space to
    create Cluster files.


    Ensure you have at least 6.5 GB of space for Oracle Grid Infrastructure for a
    Cluster home (Grid home). This includes Oracle Clusterware and Oracle Automatic
    Storage Management (Oracle ASM) files and log files, ACFS log files, and includes
    the Cluster Health monitor.


    ```

    df -h /tmp

    ```


    Ensure that you have at least 1 GB of space in /tmp. If this space is not available,
    increase the size, or delete unnecessary files in /tmp.


    > Note: Cluster Health Monitor is not available with IBM: Linux on System.


    See Also: Section 2.6, "Checking the Hardware Requirements" for more information


    # 1.3.2 Check Network Requirements


    Ensure that you have the following available:


    +   * Single Client Access Name (SCAN) for the Cluster

    * IP Address Requirements

    * Redundant Interconnect Usage

    * Intended Use of Network Interfaces


    # 1.3.2.1 Single Client Access Name (SCAN) for the Cluster


    During installation, you are prompted to confirm the default Single Client Access
    Name (SCAN), which is used to connect to databases within the cluster irrespective
    of which nodes they are running on. By default, the name used as the SCAN is also
    the name of the cluster. The default value for the SCAN is based on the local
    name. If you change the SCAN from the default, the name that you use must be globally
    throughout your enterprise.


    In a Typical installation, the SCAN is the name of the cluster. The SCAN and cluster
    name must be at least one character long and no more than 15 characters in length,
    must be alphanumeric, cannot begin with a numeral, and may contain hyphens (-).


    For example:


    ```

    NE-Sa89

    ```


    If you require a SCAN that is longer than 15 characters, be aware that the cluster
    name defaults to the first 15 characters of the SCAN.


    # 1.3.2.2 IP Address Requirements


    Before starting the installation, you must have at least two interfaces configured
    on each node: For the private IP address and one for the public IP address.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# 1.3.2.2.1 IP Addresses Requirements for Manual Configuration If you do not\
    \ enable GNS, then the public and virtual IP addresses for each node must be static\
    \ IP addresses, configured before installation for each node, but not currently\
    \ in use. Public and virtual IP addresses must be on the same subnet.\n\nOracle\
    \ Cluster manages IP addresses in the private subnet on interfaces you identify\
    \ as private during the installation interview.\n\nThe cluster must have the following\
    \ addresses configured:\n\n+   - A IP address for each node, with the following\
    \ characteristics:\n  - Static IP address\n  - Configured before installation\
    \ for each node, and resolvable to that node before installation\n  - On the same\
    \ subnet as all other IP addresses, VIP addresses, and SCAN addresses\n- A virtual\
    \ IP address for each node, with the following characteristics:\n  - Static IP\
    \ address\n  - Configured before installation for each node, but not currently\
    \ in use\n  - On the same subnet as all public IP addresses, VIP addresses, and\
    \ SCAN addresses\n- A Single Client Access Name (SCAN) for the cluster, with the\
    \ following characteristics:\n  - Three Static IP addresses configured on the\
    \ domain name server (DNS) before installation that the three IP addresses are\
    \ associated with the name provided as SCAN, and all three addresses are returned\
    \ in random order by the DNS to the requester\n  - Configured before installation\
    \ in the DNS to resolve to addresses that are not currently in use\n  - Given\
    \ a name that does not begin with a numerical\n  - On the same subnet as all other\
    \ IP addresses, VIP addresses, and SCAN addresses\n  - Conforms with the RFC 952\
    \ standard, which allows alphanumeric characters and hyphens (\"-\"), but does\
    \ not allow underscores (\"_\").\n- A private IP address for each node, with the\
    \ following characteristics:\n  - Static IP address\n  - Configured before installation,\
    \ but on a separate, private network, with its own subnet, that is not resolvable\
    \ except by cluster member nodes\n\n> Note: Oracle strongly recommends that you\
    \ do not configure SCAN VIP addresses the hosts file. Use DNS resolution for SCAN\
    \ VIPs. If you use the hosts file to resolve SCANs, then you will only be able\
    \ to resolve one IP address and you will have only one SCAN addresses.\n\nSee\
    \ Also: Appendix D, \"Understanding Network Addresses\" for more information about\
    \ network addresses"
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.3.2.3 Redundant Interconnect Usage


    In previous releases, to make use of redundant networks for the interconnect,
    bonding, trunking, or similar technology was required. Oracle Grid Infrastructure
    and Oracle RAC can make use of redundant interconnect networks, without the use
    of other network technology, to enhance optimal communication in the cluster.
    This functionality is available starting with Oracle Database 11g Release 2 (11.2.0.2).


    Redundant Interconnect Usage enables load-balancing and high availability across
    multiple (up to 4) private networks (also known as interconnects).


    # 1.3.2.4 Intended Use of Network Interfaces


    During installation, you are asked to identify the use for each network interface
    that OUI detects for each interface as a public or private interface, or as "do
    not use". For interfaces that you plan to use for other purposes—for example,
    an interface dedicated to a network file system—you must identify those instances
    as "do not use", so that Oracle Clusterware ignores them them.


    Redundant Interconnect Usage cannot protect interfaces used for public communication.
    If you require high availability or load balancing for public interfaces, use
    a third-party solution. Typically, bonding, trunking or similar technologies can
    be used for this purpose.


    You can enable Redundant Interconnect Usage for the private by selecting multiple
    interfaces to use as private interfaces. Redundant Interconnect Usage creates
    a redundant interconnect when you identify more than one interface as private.
    This functionality is available starting with Oracle Grid Infrastructure 11g Release
    2 (11.2.0.2).


    # 1.3.3 Check Operating System Packages


    Refer to the tables listed in Section 2.8, "Identifying Software Requirements"
    for the list of required packages for your operating system, or a system configuration
    script such as the Oracle Preinstallation RPM, as described in Section 2.1, "About
    Installing the Linux Operating System".


    # 1.3.4 Create Groups and Users


    Enter the following commands to create default groups and users:


    One system privileges for group for all system-authenticated administration privileges,
    including Oracle RAC (if installed):


    ```

    # groupadd -g 1000 oinstall

    # groupadd -g 1031 dba

    # useradd -u 1101 -g oracle -G dba oracle

    # mkdir -p /u01/app/11.2.0/grid

    # mkdir -p /u01/app/oracle

    # chown -r oracle:oracle:/u01

    # chmod 775 /u01/

    ```


    This set of commands creates a single installation owner, with required system
    privileges to grant the Oracle inventory privileges (installonly), and to grant
    the OSASM/SYSASM and OSDBA/SYSDB privileges. It creates the Oracle base for both
    Oracle Grid Infrastructure and Oracle RAC, /u01/app/oracle. It creates the Grid
    home (the location where Oracle Grid Infrastructure binaries are stored), /u01/app/11.2.0/grid.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 1.3.5 Check Storage


    You must have space available on Oracle ASM for Oracle Cluster files (voting disks
    and Cluster Registries), and for Oracle Database files, if you install standalone
    or Oracle Real Application Clusters Databases. Creating Oracle Clusterware on
    block or raw devices is no longer supported for new installations.


    > ote: When using Oracle ASM for either the Oracle Cluster files or Oracle Database
    files, Oracle creates one Oracle ASM instance on each node in the cluster, regardless
    of the number of databases.


    # 1.3.6 Prepare Storage for Oracle Automatic Storage Management


    nstall the Linux ASMLIB RPMs to simplify storage administration. ASMLIB provides
    persistent permissions and storage devices used with Oracle ASM, eliminating the
    need for updating udev or devlabel files with storage paths and permissions.


    If you cannot install ASMLIB RPMs, or choose to configure your storage devices
    manually, review the relevant sections in Chapter 3.


    > See Also: Chapter 3, "Configuring Storage for Oracle Grid Infrastructure for
    a Cluster and Oracle RAC" if you require detailed storage configuration information,
    or if you require more information about ASMLIB


    ASMLIB 2.0 is delivered as a set of three Linux packages:


    +   - oracleasmlib-2.0 - the Oracle ASM libraries

    - oracleasm-support-2.0 - utilities needed to administer ASMLIB

    - oracleasm - a kernel module for the Oracle ASMLIB library


    Each distribution has its own set of ASMLIB 2.0 packages, and within each distribution,
    each kernel has a version containing oracleasm package.


    # 1.3.6.1 Installing ASMLIB Packages Automatically with ULN


    If you are registered with the Oracle Unbreakable Linux Network (ULN), you can
    download and install ASMLIB packages for your system automatically. Install ASMLIB
    from ULN:


    +   1. Log in as root.

    2. Run the following command:


    ```

    # update2 -i oracleasm-support oracleasmlib-$(uname -r)`

    ```


    This command installs the support tools, and the kernel driver for the Kernel
    version running on your system.


    > See Also: Chapter 2.1, "Installing the Linux Operating System" for information
    about how to register for ULN.


    # 1.3.6.2 Installing ASMLIB Packages Manually


    If you are not a member of ULN, or are using a Red Hat or SUSE Linux kernel, then
    complete the following procedures on each node that you intend to make a member
    of the cluster.'
  merge: -1
  img_proc: true
