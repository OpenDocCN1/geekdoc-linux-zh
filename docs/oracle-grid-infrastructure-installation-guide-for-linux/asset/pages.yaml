    # ### 3.1.3 General Information About Oracle ACFS


    Oracle Automatic Storage Management Cluster File System (Oracle ACFS) provides
    a general purpose file system. You can place Oracle Database binaries on this
    system, but you cannot place Oracle data files or Oracle Clusterfile on Oracle
    ACFS.


    Note the following about Oracle ACFS:


    +   - Oracle Restart does not support root-based Oracle Clusterware resources.
    For this reason, the restrictions apply if you run Oracle ACFS on an Oracle Restart
    Configuration

    - You must manually load and unload Oracle ACFS file systems, after the Oracle
    ACFS ASM instance is running

    - You can place Oracle ACFS database home systems into the Oracle ACFS mount registry,
    along with other registered Oracle ACFS file systems.

    - You cannot put Clusterware binaries and files on Oracle ACFS.

    - You cannot put Oracle Database files on Oracle ACFS.'
