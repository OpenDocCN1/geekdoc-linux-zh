    +   - An Oracle grid installation for a cluster owner (grid), as its primary group,
    and with the OSASM (asmadmin), OSDBA for ASM (asmdba) as a secondary group.


    +   - Two separate OSDB groups for two different databases (dbal and dba2) to
    establish SYDBA privileges for each database.


    +   - Two Oracle Database owners (oracle1 and oracle2), to divide ownership of
    the Oracle database binaries, with the OracleInventory group as their primary
    group, and the OSDBA group for their database (dbal and dba2) and the OSDBA for
    ASM group (asmadmin) as their secondary groups.


    +   - An OFA-compliant mount point /u01 owned by grid:install before installation.


    +   - An Oracle base for the grid installation owner /u01/app/oracle owned by
    grid:install with 775 permissions, and changed during the installation process
    to 755.


    +   - An Oracle base /u01/app/oracle 2 owned by oracle2:install with 775 permissions.


    +   - A Grid home /u01/app/11.2.0/grid owned by grid:install with 775 permissions
    (drwxrxr-x) . These permissions are required for installation, and are changed
