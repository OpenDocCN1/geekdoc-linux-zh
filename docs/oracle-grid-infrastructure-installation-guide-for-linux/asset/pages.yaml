  md: '# B.2.1 Editing a Response File Template


    Oracle provides response file templates for each product and installation type,
    and for each tool. These files are located at `database/response` directory on
    the installation media.


    > Note: If you copied the software to a hard disk, then the response files are
    located in the directory `/response`.


    Table B–1 lists the response files provided with this software:


    | Response File | Description |

    | --- | --- |

    | db_install.rsp | Silent installation of Oracle Database 11g |

    | dbca.rsp | Silent installation of Database Configuration Assistant |

    | netca.rsp | Silent installation of Oracle Net Configuration Assistant |


    Table B–2 Response files for Oracle Grid Infrastructure


    | Response File | Description |

    | --- | --- |

    | grid_install.rsp | Silent installation of Oracle Grid Infrastructure installations
    |


    > Caution: When you modify a response file template and save a file for use, the
    response file may contain plain text passwords. Ownership of the response file
    should be given to the Oracle software installation owner only, and permissions
    on the response file should be changed to 600. Oracle strongly recommends that
    database administrators or other administrators delete or secure response files
    when they are not in use.


    To copy and modify a response file:


    +   1. Copy the response file from the response file directory to a directory
    on your system

    `$ cp /directory_path/response/response_file.rsp local_directory`


    In this example, `directory_path` is the path to the `database` directory on the
    installation media. If you have copied the software to a hard drive, then you
    can edit the file in the `response` directory if you prefer.


    +   2. Open the response file in a text editor:

    `$ vi /local_dir/response_file.rsp`


    *See Also:* Oracle Universal Installer and OPatch User’s Guide for Windows and
    UNIX for detailed information on creating response files


    +   3. Follow the instructions in the file to edit it.'
