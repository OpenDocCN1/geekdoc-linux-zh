    it to finish. If your cluster has four or more nodes, then root.sh can be run
    concurrently on all nodes but the first and last.


    # Decide if you want to install other languages


    During installation, you are asked if you want translation of user interface text
    into languages other than the default, which is English.


    > **Note:** If the language set for the operating system is not supported by the
