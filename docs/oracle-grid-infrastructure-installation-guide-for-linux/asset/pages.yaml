  md: '# # Installing and Configuring Oracle Database Using Response Files


    This appendix describes how to install and configure Oracle products using response
    files. It includes information about the following topics:


    +   - How Response Files Work

    - Preparing a Response File

    - Running the Installer Using a Response File

    - Running Net Configuration Assistant Using a Response File

    - Postinstallation Configuration Using a Response File


    # ## B.1 How Response Files Work


    When you start the installer, you can use a response file to automate the installation
    and configuration of Oracle software, either fully or partially. The installer
    uses the values contained in the response file to provide answers to some or all
    installation prompts.


    Typically, the installer runs in interactive mode, which prompts you to provide
    information in graphical user interface (GUI) screens. When you use response files
    to provide this information, you run the installer from a command prompt using
    either of the following:


    +   - Silent mode


    If you include responses for all of the prompts in the response file and specify
    the **silent** option when starting the installer, then it runs in silent mode.
    During a silent mode installation, the installer does not display any screens.
    Instead, it displays progress information in the terminal that you used to start
    it.


    +   - Response file


    If you include responses for some or all of the prompts in the response file and
    omit the **-silent** option, then the installer runs in response mode. During
    a response file mode installation, the installer displays all the screens, screens
    for which you specify information in the response file, and also screens for which
    you did not specify the required information in the response file.


    You define the settings for a silent or response file installation by entering
    values for the variables listed in the response file. For example, to specify
    the Oracle home name, the appropriate value for the ORACLE_HOME variable:


    ```

    ORACLE_HOME="OracleDBHome"

    ```'
  merge: -1
  img_proc: true
