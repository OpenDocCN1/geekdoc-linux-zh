    # 5.2.3 Creating a Fast Recovery Area Disk Group


    During installation, by default you can create one disk group. If you plan to
    add an Oracle Database for a standalone server or an Oracle RAC database, then
    you should create the Fast Recovery Area for database files.


    # 5.2.3.1 About the Fast Recovery Area and the Fast Recovery Area Disk Group


    The Fast Recovery Area is a unified storage location for all Oracle Database files
    related to recovery. Database administrators define the DB_RECOVERY_FILE_DEST
    parameter for the Fast Recovery Area to enable on-disk backups, and rapid recovery
    of data. Enabling rapid backups for recent data can reduce requests to system
    administrators to retrieve backup for recovery operations.


    When you enable Fast Recovery in the init.ora file, all RMAN backups, archive
    logs, control automatic backups, and database copies are written to the Fast Recovery
    Area. RMAN automatically manages files in the Fast Recovery Area by deleting obsolete
    backups and files no longer required for recovery.


    Oracle recommends that you create a Fast Recovery Area disk group. Cluster files
    and Oracle Database files can be placed on the same disk group, and you can also
    place Fast Recovery files in the same disk group. However, Oracle recommends that
    you create a separate Fast Recovery disk group to reduce device contention.


    The Fast Recovery Area is enabled by setting DB_RECOVERY_FILE_DEST. The size of
    the Fast Recovery Area is set with DB_RECOVERY_FILE_DEST_SIZE. As a general rule,
    the larger the, the more useful it becomes. For ease of use, Oracle recommends
    that you create a Fast Recovery Area disk group on storage devices that can contain
    at least three days of recovery information. Ideally, the Fast Recovery Area should
    be large enough to hold a copy of all your database control files, the online
    redo logs, and the archived redo log files needed to recover your database using
    the data file backups kept under your retention policy.


    Multiple databases can use the same Fast Recovery Area. For example, assume you
    have created one Fast Recovery Area disk group with 50 GB of storage, shared by
    three databases. You can set the size of the Fast Recovery Area for each database.
    For example, if database!1 is your most important database, database 2 is of greater
    importance and database 3 is of greatest importance, then you can set different
    DB_RECOVERY_FILE_SIZE settings for each database to meet your retention target
    for each database: 30 GB for database 1, 50 GB for database 2, and 70 GB for database
    3.


    See Also: Oracle Automatic Storage Management Administrator''s Guide


    # 5.2.3.2 Creating the Fast Recovery Area Disk Group


    To create a fast recovery disk group:


    +   1. Navigate to the Grid home directory, and start ASM Configuration Assistant
    (ASMCA). For example:


    $ cd /u01/app/11.2.0/grid/bin

    $ ./asmca


    +   2. ASMCA opens at the Disk Groups tab. Click Create to create a new disk group'
