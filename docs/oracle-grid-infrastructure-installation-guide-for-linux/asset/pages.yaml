  md: '# # E How to Complete Installation Prerequisite Tasks Manually


    This appendix provides instructions for how to complete configuration tasks manually
    that Cluster Verification Utility (CVU) and the installer (OUI) normally completes
    during installation. Use this appendix as a guide if you cannot use the fixup
    script.


    This appendix contains the following information:


    +   - Configuring SSH Manually on All Cluster Nodes

    - Configuring Kernel Parameters

    - Checking OGFS2 Version Manually


    # ## E.1 Configuring SSH Manually on All Cluster Nodes


    Passwordless SSH configuration is a mandatory installation requirement. SSH is
    used during installation to configure cluster member nodes, and SSH is used after
    installation by configuration agents, Oracle Enterprise Manager, OPatch, and other
    features.


    Passwordless SSH configuration using OUI creates RSA keys on all nodes of the
    cluster. If you have system restrictions that you require to set up SSH manually,
    using DSA keys, then use this procedure as a guide to set up passwordless SSH.


    In the examples that follow, the Oracle software listed is the grid user.


    If SSH is not available, then OUI attempts to use rsh and rcp install. However,
    these services are disabled by default on most Linux systems.


    > Note: The supported version of SSH for Linux distributions is OpenSSH.


    This section contains the following:


    +   - Checking Existing SSH Configuration on the System

    - Configuring SSH on Cluster Nodes

    - Enabling SSH User Equivalency on Cluster Nodes'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Configuring SSH Manually on All Cluster Nodes


    # E.1.1 Checking Existing SSH Configuration on the System


    To determine if ssh is running, enter the following command:


    ```

    $ pgrep sshd

    ```


    If ssh is running, then the response to this command is one or more process ID
    numbers. In the home directory of the installation software owner (grid, oracle),
    use the command -al to ensure that the .ssh directory is owned and writable by
    the user.


    You need an RSA or a DSA key for the SSH protocol. RSA is used with the SSH1.5
    protocol, while DSA is the default for the SSH2.0 protocol. With OpenSSH, you
    can use either RSA or DSA. The instructions that follow for SSH1. If you have
    an SSH2 installation, and cannot use SSH1, then refer to your SSH distribution
    documentation to configure SSH1 compatibility or to configure SSH2 with DSA.


    # E.1.2 Configuring SSH on Cluster Nodes


    To configure SSH, you must first create RSA or DSA keys on each cluster node,
    and then copy all the keys generated on all cluster node members into a file that
    is identical on each node. The SSH files must be readable by root and by the software
    installation user (oracle, grid), as ssh ignores a private key if it is not accessible
    by others. In the examples that follow, the DSA key is used.


    You must configure SSH separately for each Oracle software installation owner
    that you intend to use for installation.


    To configure SSH, complete the following:


    # E.1.2.1 Create SSH Directory, and Create SSH Keys On Each Node


    Complete the following steps on each node:


    +   1. Log in as the software owner (in this example, the grid user).

    2. To ensure that you are logged as the grid user, and to verify that the user
    ID matches the expected user ID you have been assigned to the grid user, enter
    the commands id and grid user. Ensure that Oracle group and user and the terminal
    window process you are using have group and IDs are identical. For example:


    ```

    $ id

    uid=502(grid) gid=501(install) groups=501(install), 502(grid, asmdmin, asmdba)

    gid=grid

    uid=502(grid) gid=501(install) groups=501(install), 502(grid, asmdmin, asmdba)

    ```


    +   3. If necessary, create the .ssh directory in the grid user''s home directory,
    and set permissions on it to ensure that only the oracle user has read and write
    permissions:


    ```

    $ mkdir ~/.ssh

    $ chmod 700 ~/.ssh

    ```


    > Note: SSH configuration will fail if the permissions are not set to 700.


    +   4. Enter the following command:


    ```

    $ /usr/bin/ssh-keygen -t dsa

    ```


    E-2 Oracle Grid Infrastructure Installation Guide'
  merge: -1
  img_proc: true
