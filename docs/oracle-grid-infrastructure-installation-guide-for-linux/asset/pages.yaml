- pgno: 138
  md: "# Oracle Automatic Storage Management Storage Configuration\n\nIf you do not\
    \ use ASMLIB, you must create a custom rules file. When udev is started, sequentially\
    \ carries out rules (configuration directives) in rules files. These files are\
    \ in the path /etc/udev/rules/. Rules files are read in lexical order. For example,\
    \ in the file 90-wacom.rules are parsed and carried out before rules in the rules\
    \ 90-ib.rules.\n\nWhen specifying the device in the UDEV rules file, ensure that\
    \ the OWNER, GROUP and MODE are specified before any other characteristics in\
    \ the order shown. For example, if you want to include the characteristic ACTION\
    \ on the UDEV line, then specify ACTION after OWNER, GROUP, and MODE.\n\nWhere\
    \ rules describe the same device, on the supported Linux kernel versions, the\
    \ last file is the one that is applied.\n\nTo configure permissions for disk devices,\
    \ run the following commands:\n\n+   1. To obtain information about existing blocks,\
    \ run the command scsi_id (/sbin/scsi_id) on devices from one cluster node to\
    \ obtain their unique device identifiers. When running the scsi_id command with\
    \ the -s argument, the device path and name should be relative to the sysfs directory\
    \ /sys (example, /block/device) when referring to /sys/block/device. \nFor example:\n\
    \n```\n# scsi_id -g -s /block/sdb\n3609a000886fe66956988a45333524174\n```\n\n\
    ```\n# scsi_id -g -s /block/ade/sdel\n3609a000886fe66956988a45333524179\n```\n\
    \nRecord the scsi_id identifiers of clusteraware devices, so you can provide them\
    \ when required.\n\n> Note: The command scsi_id should return the same device\
    \ identifier for a given device, regardless of which node the command is run from.\n\
    \n+   2. Configure SCSI devices as trusted devices (white listed), by editing\
    \ the /etc/scsi_id.config file and adding options=-g to the file. For example:\n\
    \n```\n# cat /etc/scsi_id.config\nvendor=\"ATA\",options=-p 0xo\noptions=-g\n\
    ```\n\n+   3. Using a text editor, create a UDEV rules file for the Oracle ASM\
    \ devices, setting permissions to 0660 for the installation owner and group members\
    \ who are administrators of the Oracle Grid Infrastructure. For example, using\
    \ the installation grid and a role-based group configuration, with the OS group\
    \ group asmadmin:\n\n```\n# /etc/udev/rules.99-oracle-asmdevs.rules\n```\n\n```\n\
    KERNEL=\"sd*\", BUS=\"scsi_id\", PROGRAM=\"/sbin/scsi_id\"\nRESULT=\"14f705e666695669c000000000\"\
    , OWNER=\"grid\", GROUP=\"asmadmin\", MODE=\"0660\"\nKERNEL=\"sd*\", BUS=\"scsi_id\"\
    , PROGRAM=\"/sbin/scsi_id\"\nRESULT=\"14f705e666695669c000000001\", OWNER=\"grid\"\
    , GROUP=\"asmadmin\", MODE=\"0660\"\nKERNEL=\"sd*\", BUS=\"scsi_id\", PROGRAM=\"\
    /sbin/scsi_id\"\nRESULT=\"14f705e666695669c000000002\", OWNER=\"grid\", GROUP=\"\
    asmadmin\", MODE=\"0660\"\n```\n\n+   4. Copy the rules to all other nodes on\
    \ the cluster. For\n\nConfiguring Storage for Oracle Grid Infrastructure for Cluster\
    \ and Oracle RAC 3-33"
