    https://support.oracle.com


    +   To upgrade Oracle Grid Infrastructure from 11.2.0.2, to 11.2.0.3 or later,
    you must apply patch 11.2.0.1 (11.2.0.2 PSU) 1 or later.


    +   To upgrade 11.1 Oracle Cluster installations to Oracle Grid Infrastructure
    11.2.0.3 or later, you must patch the release 11 Oracle Cluster home with the
