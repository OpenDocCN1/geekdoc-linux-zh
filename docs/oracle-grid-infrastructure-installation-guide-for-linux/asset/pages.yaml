- pgno: 146
  md: '# # Installing Oracle Grid Infrastructure for a Cluster


    This chapter describes the procedures for installing Oracle Grid Infrastructure
    for a cluster. Oracle Grid Infrastructure consists of Oracle Clusterware and Oracle
    Automatic Storage Management (Oracle ASM). If you plan afterward to install Oracle
    Database with Real Application Clusters (Oracle RAC), then this is phase one of
    two-phase installation.


    This chapter contains the following topics:


    +   - Preparing to Install Oracle Grid Infrastructure with UOI

    - Installing Oracle Grid Infrastructure

    - Installing Oracle Grid Infrastructure Using a Software-Only Installation

    - Restrictions for Oracle Berkeley DB

    - Confirming Oracle Clusterware Function

    - Confirming Oracle ASM Function for Oracle Clusterware Files

    - Understanding Offline Processes in Oracle Grid Infrastructure


    # ## 4.1 Preparing to Install Oracle Grid Infrastructure with UOI


    Before you install Oracle Grid Infrastructure with the installer, use the following
    checklist to ensure you have all the information you will need during installation,
    and to ensure that you have completed all tasks that must be done before starting
    your installation. Check off each task in the following list as you complete it,
    and write down the information needed, so that you can provide it during installation.


    +   - Shut Down Running Oracle Processes


    You may need to shut down running Oracle processes:


    **Installing on a node with a standalone database not using Oracle ASM:** You
    do not need to shut down the database while you install Oracle Grid Infrastructure
    software.


    **Installing on a node that already has a standalone Oracle Database 11g release
    2 (11.2) running on Oracle ASM:** Stop the Oracle ASM instances. The Oracle ASM
    instances are restarted during installation.


    **Installing on an Oracle RAC node:** This installation requires an upgrade of
    Oracle Clusterware, as Oracle Clusterware is required to run Oracle RAC. As part
    of the upgrade, you must shut down the database node at a time as the rolling
    upgrade proceeds from node to node.'
  merge: -1
  img_proc: true
