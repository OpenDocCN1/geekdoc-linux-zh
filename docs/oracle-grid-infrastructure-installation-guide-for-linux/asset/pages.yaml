- pgno: 52
  md: '# Creating Groups, Users and Paths for Oracle Grid Infrastructure


    ```

    # groupadd -g 1000 installall

    # groupadd -g 1031 dba

    # useradd -u 1100 -g install -G dba grid

    # useradd -u 1101 -g install -G dba oracle

    # mkdir -p /u01/app/11.2.0/grid

    # mkdir -p /u01/app/grid

    # chown grid:installall /u01

    # mkdir /u01/app/oracle

    # chown oracle:installall /u01/app/oracle

    # chmod 775 /u01/

    ```


    After running these commands, you may have the following groups:


    +   - An Oracle central inventory group, or orainventory group (installall). Members
    who have the central inventory group as their primary group, are granted the INSTALLALL
    permission to write to the oraInventory directory.

    - A single system privileges group that is used as OSASM, OSDBA, OSDB for ASM,
    and OSOPER (for group dba), members who are granted the SYSASM and SYSOPER privilege
    to administer Oracle Clusterware, Oracle ASM, and Oracle Database, are granted
    SYSASM and OSOPER for access to the Oracle ASM storage.

    - An Oracle grid installation for a cluster owner (grid), with the orainventory
    group as its primary group, with the OSASM group as the secondary group, with
    its Oracle base directory /u01/app/grid.

    - An Oracle Database (oracle) with the orainventory group as its primary group,
    and the OSDBA group as its secondary group, with its Oracle base directory /u01/app/oracle.

    - /u01 owned by grid:install with 775 permissions before installation, and by
    root the root.sh script is run during installation. This ownership and permissions
    enables OI to create the Oracle Inventory directory, in the path /u01/app/oraInventory.

    - /u01 owned by grid:install before installation, and by root the root.sh script
    is run during installation.

    - /u01/11.2.0/grid owned by grid:install with 775 permissions. These permissions
    are required for installation, and are changed during the installation process.

    - /u01 owned by grid:install with 775 permissions before installation, and 755
    permissions after installation.

    - /u01/app/oracle owned by oracle:install with 775 permissions.


    # 2.5.7 Example of Creating Role-allocated Groups, Users, and Paths


