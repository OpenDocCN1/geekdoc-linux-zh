  md: "# 3.3.2.1 Identifying and Using Oracle Database Diskgroups on Oracle ASM\n\n\
    The following section describes how to identify disk groups and determine the\
    \ free space that they contain.\n\n+   - Optionally, identify failure groups for\
    \ the Oracle ASM disk device.\n\nIf you intend to use a normal or high redundancy\
    \ disk group, you can further protect your database against hardware failure by\
    \ associating a set of disk devices in a custom failure group. However, if two\
    \ devices in a normal redundancy disk group are attached to the same SCSI controller,\
    \ then the disk group becomes unavailable if the controller fails. The controller\
    \ in this example is a single point of failure.\n\nto protect against failures\
    \ of this type, you could use two SCSI controllers, with two disks, and define\
    \ a failure group for the disks attached to each controller. This configuration\
    \ would enable the disk group to tolerate the failure of one SCSI controller.\n\
    \n> > Note: If you define custom failure groups, you must specify a minimum of\
    \ two failure groups for normal redundancy and three failure groups for high redundancy.\n\
    \n# 3.3.2.2 Creating Diskgroups for Oracle Database Data Files\n\nIf you are sure\
    \ a suitable disk group does not exist on the system, then install or identify\
    \ appropriate disk devices to add to a new disk group. Use the following guidelines\
    \ when identifying appropriate disk devices:\n\n+   - All of the devices in an\
    \ Oracle ASM disk group should be the same size and have the same performance\
    \ characteristics.\n- Do not specify multiple partitions on a single physical\
    \ disk as a disk group device. Oracle expects each disk device to be on a separate\
    \ physical disk.\n- Although you can specify a logical volume as a device in an\
    \ Oracle ASM disk group, Oracle does not recommend its use because it adds a layer\
    \ of complexity that is unnecessary with Oracle ASM. In addition, Oracle RAC requires\
    \ a cluster volume manager in case you decide to use a logical volume with Oracle\
    \ ASM and Oracle RAC.\n\n# 3.3.3 Configuring Oracle Automatic Storage Management\
    \ Cluster File System\n\nOracle ACFS is installed as part of Oracle RAC Grid Infrastructure\
    \ for Oracle Clusterware and Oracle Automatic Storage Management for 11g Release\
    \ 2 (11.2).\nYou can also create a General Purpose File System configuration of\
    \ ACFS using ASMCA.\n\n> See Also: Section 3.1.3, \"General Information About\
    \ Oracle ACFS\" on page 3-3 for supported deployment options\n\nTo configure ACFS\
    \ for an Oracle Database home for an Oracle RAC database:\n\n+   - Install Grid\
    \ Infrastructure for a cluster (Oracle Clusterware and Oracle Automatic Storage\
    \ Management)\n- Change directory to the Oracle Grid Infrastructure home. For\
    \ example:\n  $ cd /u01/app/11.2.0/grid"
  merge: -1
