- pgno: 172
  md: 'The command uses the following syntax, where variable content is indicated
    by italics:


    ```

    deinstall -home complete path of Oracle home [-silent] [-checkonly] [-local] [-paramfile
    complete path of input parameter property file] [-params name1=value name2=value
    ...] [-o complete path of directory for saving files]

    ```


    The default method for running the reinstall tool is from the reinstall directory
    in the Grid home. For example:


    ```

    $ cd /u01/app/11.2.0/grid/deinstall

    $ ./deinstall

    ```


    In addition, you can run the reinstall tool from other locations, or with a parameter
    file, or select other options to run the tool.


    The options are:


    +   -home

    Use this flag to indicate the home path of the Oracle home that you want to check
    or reinstall. To deinstall Oracle software using the deinstall command in the
    Oracle home you plan to deinstall, provide a parameter file in another location,
    and not use the -home flag.


    +   -silent

    If you run deinstall from $ORACLE_HOME/deinstall path, then the -home flag is
    not required because the tool knows from which home it is running. If you use
    the standalone version of the tool, then -silent is mandatory.

    To create a properties file and provide the required parameters, refer to the
    template file deinstall.rsp, located in the response folder of the Deinstallation
    tool or the Oracle home.

    If you have a working system, instead of using the template file, you can generate
    a properties file by running the deinstall command using the -checkonly flag.
    The deinstall command then discovers information from the Oracle home you want
    to deinstall and deconfigure. It generates a properties file, which you can use
    with the -silent option.


    +   -checkonly

    Use this flag to check the status of the Oracle software home configuration. Running
    the command with the checkonly flag does not remove the Oracle configuration.


    +   -local

    Use this flag on a multinode non-shared environment to deconfigure Oracle software
    in a cluster.

    When you run deinstall with this flag, it deconfigures and reinstalls the Oracle
    software on the local node (the node where deinstall is run) for non-shared home
    directories. On remote nodes, it deconfigures Oracle software, but does not deinstall
    the Oracle software.

    -paramfile complete path of input parameter property file'
