    +   If you have Oracle ACFS file systems on Oracle Grid Infrastructure 11 release
    2 (11.2.0.1), you upgrade Oracle Grid Infrastructure to any later version (11.2.0.2
    or 11.2.0.3), and you take advantage of Redundant interconnect and one or more
    private interfaces to the private network, you must restart the Oracle ASM instance
