    > **Note:** To manage Oracle ASM and Oracle Net release 2 (11.2) or later installations,
    use the srvctl binary in the Oracle Grid Infrastructure for a cluster (Grid home).
    If you have Oracle Real Application Clusters or Database installed, then you cannot
    use the srvctl binary in the database to manage Oracle ASM or Oracle Net.


    # 4.8 Understanding Offline Processes in Oracle Grid Infrastructure


    Oracle Grid Infrastructure provides required resources for various Oracle products
    and components. Some of these products and components are optional, so you can
    install and enable them after installing Grid Infrastructure. To simplify postinstallation,
    Oracle Infrastructure preconfigures and registers all required resources for all
    products and components, but only activates them when you add to them. As a result,
    some components may be listed as OFFLINE after the installation of Grid Infrastructure.


    Resources listed as TARGET/OFF and STATE/OFF do not need to be monitored. They
    represent components that are registered, but not active, so they do not use any
    resources. If an Oracle product or component is installed on the system, and it
    requires a particular resource to be online, then the software will prompt you
    to activate the required offline.


    The Oracle GSD (Global Service Daemon) process, ora.gsd, is typically offline.
    You must enable Oracle GSD manually if you plan to use an Oracle 9i Real Application
    Clusters database on the Oracle Clusterware 11g Release 2 (11.2). Follow the steps
    under Section 5.3.4, Enabling The Global Services Daemon (GSD) for Oracle Database
    Release 9.2 to activate the GSD Daemon.


    4-12 Oracle Grid Infrastructure Installation Guide'
