    # A.4 About the Oracle Cluster Alert Log


    The Clusterware alert log is the first place to look for serious errors. In the
    event of an error, it can contain path information to diagnostic logs that can
    provide specific information about the cause of errors.


    After installation, Oracle Clusterware alerts messages when important events occur.
    For example, you might see alert messages from the Cluster Ready Services (CRS)
    daemon process when it starts, or if the failover process, or if automatic restart
    of a CRS resource failed.


    Oracle Enterprise Manager monitors the Cluster log and posts alerts on the Cluster
    Home page when an error is detected. For example, if a voting disk is not available,
    a CRS-1604 error is raised, and a critical alert is posted to the Cluster Home
    page. You can customize the error detection and alert settings on the Metric and
    Policy Settings page.


    The location of the Cluster log file is CRS_$home/hostname/alert.log, where CRS_HOME
    is the directory where Oracle Cluster was installed and hostname is the host of
    the local node.


    > See Also: Oracle Real Application Clusters Administration and Deployment Guide


