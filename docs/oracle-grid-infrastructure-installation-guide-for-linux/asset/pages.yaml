- pgno: 59
  md: 'You can configure IP addresses with one of the following options:


    +   - IP address assignment using Oracle Grid Naming Service (GNS). If you select
    this option, then administrators assign IP address for the physical host name
    and dynamically allocated IPs for the Oracle Clusterware managed VIP addresses.
    In this case, IP addresses for the VIPs are assigned by a DHCP and resolved using
    a multicast domain server configured as part of the cluster. If you plan to use
    GNS, then you must have the following:


    +   - DHCP service running on the public network for the cluster

    - Enough addresses on the DHCP to provide 1 IP address for each node''s virtual
    IP, and 3 IP addresses for the cluster used by the Client Access Name (SCAN) for
    the cluster


    +   - IP address assignment. If you select this option, then network administrators
    assign a fixed IP address for each physical host in the cluster and IPs for the
    Oracle Clusterware managed VIPs. In addition, domain server (DNS) based static
    name resolution is used for each node. Selecting this option requires that you
    request network administration updates when you modify the cluster.


    > Note: Oracle recommends that you use a static name for all server node hostnames.

    Public addresses and virtual IP addresses must be in the same subnet.

    Oracle only supports DHCP-assigned networks for the default network, not for any
    subsequent networks.


    # 2.7.2.1 IP Address Requirements with Grid Naming Service


    If you enable Grid Naming Service (GNS), then name resolution to the cluster are
    delegated to the GNS, which is listening on the GNS virtual IP address. You define
    this address in the domain server (DNS) domain before installation. The DNS must
    be configured to delegate requests for cluster names (any names in the subdomain
    delegated to the cluster) to the GNS. When a request comes to the DNS, GNS processes
    the requests and responds with the appropriate addresses for the name requested.


    To use GNS, before installation the administrator must establish DNS Lookup to
    direct DNS resolution of a subdomain to the cluster. If you enable GNS, then you
    must have a DHCP service on the public network that allows the cluster to dynamically
    allocate the VIP addresses as required by the cluster.


    > Note: The following restrictions apply to vendor configurations on your system:


    +   - If you have vendor cluster installed, then you cannot choose to use GNS,
    because the vendor cluster does not support it.

    - You cannot use GNS with another multicast DNS. If you want to use GNS, then
    disable any third party mDNS daemons on your system.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 2.7.2.2 IP Address Requirements for Manual Configuration


    If you do not enable GNS, then the public and virtual IP addresses for each node
    must be static IP addresses, configured before installation for each node, but
    not currently in use. Public and virtual IP addresses must be on the same subnet.


    Oracle Clusterware manages private IP addresses in the private subnet on interfaces
    you identify as private during the installation interview.


    The cluster must have the following addresses configured:


    +   - A public IP address for each node, with the following characteristics:

    - Static IP address

    - Configured before installation for each node, and resolvable to that node before
    installation

    - On the same subnet as all other public IP addresses, VIP addresses, and SCAN
    addresses


    +   - A virtual IP address for each node, with the following characteristics:

    - Static IP address

    - Configured before installation for each node, but not currently in use

    - On the same subnet as all other public IP addresses, VIP addresses, and SCAN
    addresses


    +   - A Single Client Access Name (SCAN) for the cluster, with the following characteristics:

    - Three Static IP addresses configured on the domain name server (DNS) before
    installation so that the three IP addresses are associated with the name provided
    as the SCAN, and all three addresses are returned in random order by the DNS to
    the requester

    - Configured before installation in the DNS to resolve addresses that are not
    currently in use

    - Given a name that does not begin with a numeral

    - On the same subnet as all other public IP addresses, VIP addresses, and SCAN
    addresses

    - Conforms with the RFC 952 standard, which allows alphanumeric characters and
    hyphens (“–”), but does not allow underscores (“_").


    +   - A private IP address for each node, with the following characteristics:

    - Static IP address

    - Configured before installation, but on a separate, private network, with its
    own subnet, that is not resolvable by other cluster member nodes


    The SCAN is a name used to provide service access to the cluster. Because the
    SCAN is associated with the cluster as a whole, rather than a particular node,
    the SCAN makes it possible to add or remove nodes from the cluster without needing
    to reconfigure clients. It also adds location independence for the databases,
    so that client configuration does not have to depend on which nodes are running
    a particular database. Clients can continue to access the cluster in the same
    way as previous releases, but Oracle recommends that clients accessing the cluster
    use the SCAN.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Note: In a Typical installation, the SCAN provide is also the name of the cluster,
    so the SCAN name must meet the requirements for a cluster name. In an Advanced
    installation, the SCAN and cluster name are entered in separate fields during
    installation, so cluster name requirements do not apply to the SCAN name.


    You can use the nlookup command to confirm that the DNS is correctly associating
    with the addresses. For example:


    ```

    root@node$ nlookup mycluster-scan

    Server: dns.example.com

    Address: 192.0.2.101

    Name: mycluster-scan.example.com

    Address: 192.0.2.202

    Name: mycluster-scan.example.com

    Address: 192.0.2.203

    ```


    After installation, when a client sends a request to the cluster, Oracle Clusterware
    listeners redirect client requests to servers in the cluster.


    > Note: Oracle strongly recommends that you do not configure SCAN VIP addresses
    in the hosts file. Use DNS resolution for SCAN VIPs. If you use the hosts file
    to resolve SCANs, you will only be able to resolve to one IP address and will
    have only one SCAN address.


    Configuring SCANs in a DNS or a hosts file is the only supported configuration.
    Configuring SCANs in a Network Information Service (NIS) is not supported.


    See Also: Appendix D, “Understanding Network Addresses” for more information about
    network addresses


    # 2.7.3 Broadcast Requirements for Networks Used by Oracle Grid Infrastructure


    Broadcast communications (ARP and UDP) must work properly across all public and
    private interfaces used by Oracle Grid Infrastructure release 2 patchset 1 (11.2.0.2)
    and later releases.


    The broadcast must work across any configured VLANs as used by the public or private
    interfaces.


    # 2.7.4 Multicast Requirements for Networks Used by Oracle Grid Infrastructure


    With Oracle Grid Infrastructure release 2 (11.2), on each cluster member node,
    the Oracle mdns daemon uses multicasting on all interfaces to communicate with
    other nodes in the cluster.


    With Oracle Grid Infrastructure release 2 patchset 1 (11.2.0.2) and later releases,
    multicasting is required on the private interconnect. For this reason, at a minimum,
    you must enable multicasting for the cluster:'
