- pgno: 220
  md: '# How to Upgrade to Oracle Grid Infrastructure 11g Release 2


    This appendix describes how to perform Oracle Clusterware and Oracle Automatic
    Storage Management upgrades.


    Oracle Clusterware upgrades can be rolling upgrades, in which a subset of nodes
    are brought down while other nodes remain active. Oracle Automatic Storage Management
    Release 2 (11.2) upgrades are rolling upgrades. If you upgrade a subset of nodes,
    then a software-only installation is performed on the existing cluster nodes that
    you do not select for upgrade.


    This appendix contains the following topics:


    +   - Back Up the Oracle Software Before Upgrades

    - Unset Oracle Environment Variables

    - About Oracle ASM and Oracle Grid Infrastructure Installation and Upgrade

    - Restrictions for Clusterware and Oracle ASM Upgrades

    - Preparing to Upgrade an Existing Oracle Clusterware Installation

    - Using CVU to Validate Readiness for Oracle Clusterware Upgrades

    - Performing Rolling Upgrades From an Earlier Release

    - Updating DB Control and Grid Control Target Parameters

    - Unlocking the Existing Oracle Clusterware Installation

    - Downgrading Oracle Clusterware After an Upgrade

    - Checking Cluster Health Monitor Repository Size After Upgrading


    # F.1 Back Up the Oracle Software Before Upgrades


    Before you make any changes to the Oracle software, Oracle recommends that you
    create a backup of the Oracle software and databases.


    # F.2 Unset Oracle Environment Variables


    Unset Oracle environment variables.


    If you have set ORA_CRS_HOME as an environment variable, following instructions
    from Oracle Support, unset it before starting an installation or upgrade. You
    should never use ORA_CRS_HOME as an environment variable except under explicit
    direction from Oracle Support.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# About Oracle ASM and Oracle Grid Infrastructure Installation and Upgrade


    Check to ensure that installation owner login shell profiles (for example, .profile
    or .bashrc) do not have ORA_CRS_HOME set.


    If you have an existing installation on your system, and you are using the same
    user account to install this installation, unset the following environment variables:
    ORA_CRS_HOME; ORACLE_HOME; ORA_NLS10; TNS_ADMIN; and any other environment variable
    for the Oracle Infrastructure installation that is connected with Oracle software
    homes.


    # F.3 About Oracle ASM and Oracle Grid Infrastructure Installation and Upgrade


    In past, Oracle Automatic Storage Management (Oracle ASM) was installed as part
    of the Oracle Database installation. With Oracle 11g release 2 (11.2), Oracle
    ASM is installed when you install the Grid Infrastructure components and shares
    an ASM with Oracle Cluster when installed in a cluster such as Oracle RAC or Oracle
    Restart on a standalone server.


    If you have an existing ASM instance, you can upgrade it at the same time you
    install Oracle Infrastructure, or you can upgrade it after the installation, using
    ASM Configuration Assistant (ASMCA). However, beware that a number of ASM features
    are disabled until you upgrade Oracle ASM, and Clusterware does not function until
    Oracle ASM is running in the Grid Infrastructure home. For this reason, Oracle
    recommends that if you do not upgrade ASM at the same time as you upgrade Oracle
    Cluster, you should upgrade Oracle ASM immediately.


    You can perform out-of-place upgrades to an ASM instance using Oracle ASM Configuration
    Assistant (ASMCA). In addition to running ASMCA with the graphic user interface,
    you can run ASMCA in non-interactive (silent) mode.


    In previous releases, you can use Database Upgrade Assistant (DBUA) to upgrade
    either an Oracle Database, or Oracle ASM. That is no longer the case. You can
    only use DBUA to upgrade an Oracle database instance. Use ASM Configuration Assistant
    (ASMCA) to upgrade Oracle ASM.


    > See: Oracle Database Upgrade Guide and Oracle Automatic Storage Management Administrator''s
    Guide for additional information about upgrading Oracle ASM installations


    # F.4 Restrictions for Clusterware and Oracle ASM Upgrades


    Oracle recommends that you use CVU to check if there are any patches required
    for upgrading your Oracle Grid Infrastructure 11g release 2 or Oracle RAC database
    11g Release 2 installations.


    > See: Section F6, “Using CVU to Validate Readiness for Oracle Clusterware Upgrades"


    Be aware of the following restrictions and changes for upgrades to Oracle Grid
    Infrastructure installations, which consists of Clusterware and Oracle Automatic
    Storage Management (Oracle ASM):


    +   To upgrade existing Clusterware installations to Oracle Grid Infrastructure
    11g, your version must be greater than or equal to 10.1.0.5, 10.2.0.3, 11.1.0.6,
    or 11.2.


    F-2 Oracle Grid Infrastructure Installation Guide'
  merge: -1
  img_proc: true
