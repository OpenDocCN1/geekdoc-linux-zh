- pgno: 57
  md: '# 2.7.1 Hardware Requirements


    +   - Grid Naming Service Configuration Options

    - Network Interface Configuration Options

    - Multiple Private Interconnects and Enterprise Linux

    - Enabling the Name Service Cache Daemon


    > Note: For the most-to-date information about supported network protocols and
    hardware for Oracle RAC, refer to the Certify pages on the My Oracle Support Web
    site at the following URL:

    https://support.oracle.com


    The following is a list of requirements for network configuration:


    +   - Each node must have at least two network adapters or network interface cards
    (NICs): one for the public network interface, and one for the private network
    interface (the interconnect).


    With Redundant Interconnect Usage, you should identify multiple interfaces for
    the cluster private network, without the need of using bonding or other technologies.
    This functionality is available with Oracle Database 11g Release 2 (11.2.0.2).


    When you define multiple interfaces, Oracle Cluster creates from one to four highly
    available IP (HAIP) addresses. Oracle RAC and ASM instances use these interfaces
    to ensure highly availability, load-balanced communication between nodes. The
    installer enables Redundant Interconnect Usage to provide a high availability
    private network.


    By default, Oracle Grid Infrastructure software uses all of the HAIP addresses
    for private network communication, providing load-balancing across the set of
    interfaces you identify for the private network. If a private interface fails
    or becomes non-communicative, then Oracle Cluster transparently moves the corresponding
    HAIP address to one of the remaining functional interfaces.


    > Note: If you define more than four interfaces as private network interfaces,
    aware that Oracle Cluster activates only four of the interfaces at a time. However,
    if one of the four active interfaces fails, then Oracle Cluster transitions the
    HAIP addresses configured to the failed interface to one of the reserve interfaces
    in the defined set of private interfaces.


    When you upgrade a node to Oracle Grid Infrastructure 11g release 2 (11.2.0.2)
    or later, the upgraded system uses existing network classifications.


    To configure multiple public interfaces, use a third-party technology for your
    platform to aggregate the multiple public interfaces before you installation,
    and then select the single interface name for the combined interfaces as the public
    interface. Oracle recommends that you do not identify multiple public interface
    names during Oracle Grid Infrastructure installation. Note that if you configure
    two network interfaces as public network interfaces in the cluster without using
    an aggregation technology, the failure of one public interface on a node does
    not result in automatic VIP failover to the other public interface.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Checking the Network Requirements


    Oracle recommends that you use the Redundant Interconnect Usage to make use of
    multiple interfaces for the private network. However, you can also use third-party
    technologies for redundancy in the private network.


    +   - If you Oracle Cluster using OUL, the public interface names associated with
    the network adapters for each node must be the same on all nodes, and the private
    interface names associated with the network adapters should be the same on all
    nodes. This restriction does not apply if you use cloning, to create a new cluster,
    or to add nodes to an existing cluster.


    For Example: With a two-node cluster, you cannot configure network adapters on
    node1 eth0 as the public interface, but on node2 eth1 as the public interface.
    Public interface names must be the same, but you must configure the private interfaces
    on the same network adapters as. If eth is the private interface for node1, then
    eth0 should be the private interface for node2.


    **See Also:** *Oracle Clusterware Administration and Deployment Guide* for information
    about how to add nodes using cloning


    +   - For the public network, each network adapter must support TCP/IP.

    - For the private network, the interface must support the data transport protocol
    (UDP) using high-speed network adapters and switches that support TCP/IP (minimum
    requirement 1 Gigabit Ethernet).


    > > UDP is the default interconnect protocol for Oracle RAC, and TCP is the interconnect
    protocol for Oracle Clusterware. You must use a switch for the interconnect. Oracle
    recommends that you use a dedicated switch.


    Oracle does not support token-rings or crossover cables for the interconnect.


    +   - Each node''s private interface for interconnects must be the same subnet,
    and those subsets must connect to every node of the cluster. For example, if the
    private interfaces have a subnet mask of 255.255.255.0, then your private network
    is in the range 192.168.0.0--192.168.0.255, and your private addresses have a
    subnet mask of 255.255.255.0, then your private addresses can be in the range
    of 192.168.0.[0-255).

    - For clusters using Redundant Interconnect Usage, each private interface should
    be on a different subnet. However, each cluster member node must have an interface
    on each private interconnect subnet, and these subsets must connect to every node
    of the cluster. For example, you can have private networks on subnets 192.168.0
    and 10.0.0, but each cluster member node must have an interface connected to the
    192.168.0 and 10.0.0 subnet.

    - For the private network, the endpoints of all designated interconnect interfaces
    must be completely reachable on the network. There should be no node that is connected
    to every private network interface. You can test if an interconnect is reachable
    using ping.


    # 2.7.2 IP Address Requirements


    Before starting the installation, you must have at least two interfaces configured
    on each node: One for the private IP address and one for the public IP address.


    Advanced Installation Oracle Grid Infrastructure for a Cluster Preinstallation
    Tasks 2-29'
