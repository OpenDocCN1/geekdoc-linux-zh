    # 5.2 Back Up the root.sh Script


    Oracle recommends that you back the root.sh script after you complete an installation.
    If you install other products in the same Oracle home directory, then the installer
    updates the contents of the existing root.sh script during the installation. If
    you require information contained in the original root.sh script, then you can
