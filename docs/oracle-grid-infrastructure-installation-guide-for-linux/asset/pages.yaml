- pgno: 208
  md: '# D.2.3 About Converting Standalone Oracle ASM Installations to Clustered Instalations


    If you have an existing standalone Oracle ASM installations on one or more nodes
    that are member nodes of the cluster, OUI proceeds to install Oracle Grid Infrastructure
    for a cluster.


    If you place Clusterware files (OCR and voting disks) on Oracle ASM, ASMCA is
    started at the beginning of the clusterinstallation, and prompts for you to migrate
    and upgrade the Oracle ASM instance on the local node, so that you have an Oracle
    ASM 11g Release 2 (11.2) installation.


    On remote nodes, ASMCA identifies any standalone Oracle ASM instances that are
    running, and prompts you to shut down Oracle ASM instances, and any database instances
    that use them. ASMCA then extends Cluster ASM instances to all nodes in the cluster.
    However, disk group names on the cluster-enabled Oracle ASM instances must be
    different from existing standalone disk group names.


    > **See:** Oracle Automatic Storage Management Administrator''s Guide


    # D.3 Understanding Server Pools


    The following section provides a short overview of server pools. It contains the
    following topics:


    +   - Overview of Server Pools and Policy-based Management

    - How Server Pools Work

    - The Free Server Pool

    - The Generic Server Pool


    > **See Also:** Cluster Cluster Administration and Deployment Guide for information
    about how to configure and administer server pools


    # D.3.1 Overview of Server Pools and Policy-based Management


    With Clusterware 11g release 2 (11.2) and later, resources managed by Oracle Cluster
    are contained in logical groups of resources called server pools. Resources are
    hosted on a shared infrastructure and are contained within server pools. The resources
    are restricted with respect to their hardware resource (such as CPU and memory)
    consumption by policies, behaving as if they were deployed in a single-system
    environment.


    You can choose to manage resources dynamically using server pools to provide policy-based
    management of resources in the cluster, or you can choose to manage resources
    using the traditional method of physically assigning resources to run on particular
    nodes.


    **Caution:** By default, any named user may create a server pool. To restrict
    the operating system users that have this privilege, Oracle strongly recommends
    that you add specific users to the CRS Administrators list.


    > **See Also:** Oracle Cluster Administration and Deployment Guide for more information
    about adding users to the CRS Administrator''s list.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Understanding Server Pools


    The Oracle Grid Infrastructure installation owner has permissions to create and
    configure server pools, using SRVCTL, Oracle Enterprise Manager Database Control,
    or Oracle Database Configuration Assistant (DBCA).


    Policy-based management:


    +   - Enables dynamic capacity assignment when needed to provide server capacity
    in accordance with the priorities you use with policies

    - Enables allocation of resources by importance, so that applications obtain the
    minimum requirement, whenever possible, and so that lower priority applications
    do not take resources from more important applications

    - Ensures isolation where necessary, so that you can provide dedicated servers
    in a cluster for applications and databases


    Applications and databases running in server pools do not share resources. Because
    of this, server pools isolate resources where necessary, but enable dynamic capacity
    assignments as required. Together with role-separated management, this capability
    addresses the needs of organizations that have a standardized cluster environments,
    but allow multiple administrator groups to share the common cluster infrastructure.


    # D.3.2 How Server Pools Work


    Server pools divide the cluster into groups of servers hosting the same or similar
    resources. They distribute a uniform workload (a set of Oracle Cluster resources)
    over several servers in the cluster. For example, you can restrict Oracle databases
    to run only in a particular server pool. When you enable role-separated management,
    you can explicitly grant permission to operating system users to change attributes
    of server pools.


    Top-level server pools:


    +   - Logically divide the cluster

    - Are always exclusive, meaning that one server can only reside in one particular
    server pool at a certain point in time


    Server pools have three attributes that they are assigned when they are:


    +   - MIN_SIZE: The minimum number of servers the server pool should contain.
    If the number of servers in a server pool is below the value of this attribute,
    then Oracle Cluster automatically moves servers from elsewhere into the server
    pool until the number of servers reaches the attribute value, or until there are
    free servers from less important pools.

    - MAX_SIZE: The maximum number of servers the server pool may contain.

    - IMPORTANCE: A number from 0 to 1000 (0 being least) that ranks a server pool
    among all other server pools in a cluster.


    When Oracle Cluster is installed, two server pools are created automatically:
    Generic and Free. All servers in a new installation are assigned to the Free server
    pool, initially. Servers move from Free to newly defined server pools automatically.
    When you upgrade Oracle Cluster, all nodes are assigned to the Generic server
    pool, to ensure compatibility with database releases before Oracle Database 11g
    release 2 (11.2).


    # D.3.3 The Free Server Pool


    The Free server pool contains servers that are not assigned to any other server
    pools. The attributes of the Free server pool are restricted, as follows:


    D-8 Oracle Grid Infrastructure Installation Guide'
  merge: -1
  img_proc: true
