    # 3.3.1.4 Configuring Disks for Oracle ASM with ASMLIB


    The Oracle Automatic Storage Management (Oracle ASM) library driver simplifies
    the configuration and management of the devices by eliminating the need to rebind
    disk devices used with Oracle ASM each time the system is restarted.


    Without ASMLIB Linux 2.6 kernel and loader, device paths do not maintain permissions
    and path persistence unless you create a permissions or rules file on each cluster
    member node; device paths that /dev/sda can appear as /dev/sdb after a restart.
    Adding new devices requires you to use the udev file to provide permissions and
    path persistence for the new disk.


    With ASMLIB, define the range of disks you want to have available as Oracle ASM
    disks. ASMLIB maintains permissions and disk labels that are persistent on the
    storage device, so that label is available even after an operating system upgrade.
    You can update storage paths on all cluster member nodes by running one oracleasm
    command on each node.


    If you intend to use Oracle ASM on block devices for database storage for Linux,
    Oracle recommends that you install the ASMLIB driver and associated utilities,
    and use them to configure the disks for Oracle ASM.


    > **Caution:** On IBM: Linux on System servers, due to a block size compatibility
    issue, you cannot use ASMLIB with SCSI storage devices and Fibre Channel Protocol
    (FCP) for Oracle Grid Infrastructure 11.2.0.1 and later.


    > **Workaround:** Use block device directly (for example, using paths similar
    to /dev/mapper/mpath_part1), or use DASD disks.


    **See Also:** Oracle Support notes How to Configure Disk Storage devices for use
    with Oracle ASM 11.2 on IBM: Linux on System under SLES (Doc ID 1350088.1) and
    How to Configure Disk Storage devices for use with Oracle ASM 11.2 on IBM: Linux
    on System under Red Hat 5 (Doc ID 1351746.1), available at the URL:


    https://support.oracle.com


    To use the Oracle Automatic Storage Management library driver (ASMLIB) to configure
    Oracle ASM devices, complete the following tasks.


    +   * Installing and Configuring the Oracle ASM Library Driver Software

    * Configuring Disk Devices to Use Oracle ASM Library Driver on x86 Systems

    * Configuring Disk Devices to Use ASM Library Driver on IBM: Linux on System z

    * Administering the Oracle ASMLIB Library Driver and Disks'
