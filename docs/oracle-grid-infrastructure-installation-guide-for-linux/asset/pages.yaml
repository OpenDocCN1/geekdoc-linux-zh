    +   Determine your cluster name, public node names, the SCAN, virtual node names,
    VIP and planned interface use for each node in the cluster


    During installation, you are prompted to provide the public and virtual host name,
    unless you use a third party cluster software. In that case, the host name information
    will be filled in. You are also prompted to identify which interfaces are public,
    private, or interfaces in use for another purpose, such as a network file system.


