    3.3.1.51 Using Oracle ASM with Multipath Disks Oracle ASM requires that each disk
    is uniquely identified. If the same disk appears under multiple paths, then it
    causes errors. In a multipath configuration, the same disk can appear three times:


    +   1. The initial path to the disk

    2. The second path to the disk

    3. The multipath disk access point.'
