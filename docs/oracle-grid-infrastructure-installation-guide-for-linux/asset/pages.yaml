- pgno: 40
  md: '# 2.5.1 Determining If the Oracle Inventory and Inventory Group Exists


    When you install Oracle software on the system for the first time, OUI creates
    the orainst.loc file. This file identifies the name of the Inventory group (by
    default, oinstall), and the path of the Oracle Central Inventory. An orainst.loc
    file has contents similar to the:


    ```

    inventory_loc=central_inventory_location

    inst_group=oinstall

    ```


    In the preceding example, central_inventory_location is the location of the Oracle
    central inventory, and group is the name of the group that has permissions to
    write to the central inventory (the OINSTALL privilege).


    If you have an existing Oracle central inventory, then ensure that you use the
    same Oracle Inventory for all Oracle software installations, and ensure that all
    Oracle users you intend to use for installation have permissions to write to this
    directory.


    To determine if you have an Oracle central inventory directory (oraInventory)
    on your system:


    Enter the following command:


    ```

    # more /etc/orainst.loc

    ```


    If the orainst.loc file exists, the output from this command is similar to the:


    ```

    inventory_loc=/u01/app/oracle/oraInventory

    inst_group=oinstall

    ```


    In the previous output example:


    +   - The inventory_loc group shows the location of the Oracle Inventory.

    - The inst_group parameter shows the name of the Oracle Inventory group (in this
    example, oinstall).


    Use the command grep groupname /etc/group to confirm that the group specified
    exists on the system. For example:


    ```

    $ grep oinstall /etc/group

    oinstall:x:1000:grid,oracle

    ```


    # 2.5.2 Creating the Oracle Inventory Group If an Oracle Inventory Does Not Exist


    If the orainst.loc file does not exist, create the Oracle Inventory group by entering
    a command similar to the following:


    ```

    # /usr/bin/groupadd -g 1000 oinstall

    ```


    The preceding command creates the inventory group oinstall, with the group ID
    number 1000. Members of the inventory group are granted privileges to write to
    the Oracle central inventory (oraInventory).


    By default, if an inventory group does not exist, then the installer lists the
    primary group of the installation owner for the Oracle Grid Infrastructure for
    a Cluster software as the oraInventory group. Ensure that this group is available
    as a primary group for all'
  merge: -1
  img_proc: true
