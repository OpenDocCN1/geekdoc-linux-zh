    1.3.6.2.1 Determine the Correct Oracle Package Determine which kernel you are
    using by logging in as root and running the following command:


    ```

    uname -rm

    ```


    For example:

    # uname -rm

    2.6.9-5.el6.i686

    The example shows that this is a 2.6.9-5 kernel for SMP (multiprocessor) server
    using Intel i686 CPUs.


    1.3.6.2.2 Download and Install the Oracle Package After you install the kernel
    version for your system, complete the following:


    +   1. Open a Web browser using the URL: http://www.oracle.com/technetwork/server-storage/linux/downloads/index-088143.html

    2. Click Linux Drivers for Automatic Storage Management, and select the ASMLIB
    link for your of Linux.

    3. Download the oracleasm and oracleasm-support packages for your version of Linux.

    4. Download the oracleasm package corresponding to your kernel version.

    5. Log in as root and install the ASM packages.


    1.3.6.2.3 Configure ASMLIB Log in as root, and enter the following command:


    ```

    # oracleasm configure -i

    ```


    Provide information as prompted by the system, the oracleasm command by default
    is in the path /usr/sbin. If you enter the command oracleasm without the -i flag,
    they show the current configuration.


    > See Also: Section 3.3.1.41, "Installing and Configuring the Oracle ASM Library
    Driver Software" for additional information about configuration


    1.3.6.3 Mark ASM Candidate Disk Partitions

    For OUI to recognize partitions Oracle ASM disk candidates, you must log in as
    root and mark the disks that Oracle ASM can use. To mark a disk for use by Oracle
    ASM, enter the following command syntax, ASM_DISK_NAME is the name of the Oracle
    ASM disk group, and candidate_disk is the name of the disk device you want to
    assign to that disk group:


    ```

    # oracleasm createdisk ASM_DISK_NAME candidate_disk

    ```


    For example:

    # oracleasm createdisk datal /dev/sdf'
