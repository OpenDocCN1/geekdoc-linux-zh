    # ## 2.5.3 Creating the Oracle Grid Infrastructure User


    You must create a software owner for Oracle Grid Infrastructure in the following
    circumstances:


    +   - If Oracle software owner user does not exist; for example, if this is the
    first installation of software on the system

    - If an Oracle software owner user exists, but you want to use a different operating
    system, with different group membership, to separate Oracle Grid Infrastructure
    administrative from Oracle Database administrative privileges.


    In Oracle documentation, a user created to own only Oracle Grid Infrastructure
    software installations is called the grid user. A user created to own either all
    Oracle installations, or only database installations, is called the oracle user.


    # ### 2.5.3.1 Understanding Restrictions for Oracle Software Installation Owners


    If you intend to use multiple Oracle software owners for different Database homes,
    Oracle recommends that you create a separate software owner for Grid Infrastructure
    software (Oracle Clusterware and ASM), and use that owner to run the Oracle Grid
    Infrastructure.


    ```

    $ ORACLE_HOME=/u01/11.2.0/grid; export ORACLE_HOME

    ```


    If you try to administer using sqlplus, lnrctl, or ascmmd while ORACLE_HOME is
    set to a different binary path, then you will encounter errors. But if you are
    using SRVCTL in the Oracle Grid Infrastructure home, ORACLE_HOME should be set
    or srvctl will fail. If ORACLE_HOME is ignored, then the oracle home path does
    not affect srvctl commands.


    To create separate software owners, you create separate operating systems groups
    for different Oracle software installations, note that each of these users must
    have the Oracle central inventory group (oinventory) as their primary group. Members
    of this group have write privileges to the Oracle Clusterware resources, OCR keys,
    directories in the Oracle Cluster central home to DBAs need access, and other
    necessary privileges. In Oracle documentation, this group is represented as oinstall
    in code examples.


    Each Oracle software owner must be a member of the central inventory group. Oracle
    recommends that you do not have more than one central inventory for Oracle


