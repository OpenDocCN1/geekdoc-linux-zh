  md: 'To check if nscd is set to load when the system is restarted, enter the command

    chkconfig --list nscd. For example:


    ```

    # chkconfig --list nscd

    nscd 0:off 1:off 2:off 3:on 4:off 5:off 6:off

    ```


    In the preceding example, nscd is turned on for run level 3, and turned off for
    run level

    5. The nscd should be turned on for both run level 3 and run level 5.


    To change the configuration to ensure nscd is on for both run level 3 and run
    level

    5, enter one of the following command


    # On Red Hat and Oracle Linux 4 and 5:


    ```

    # chkconfig --level 35 nscd on

    ```


    # On SUSE SLE10 and SLE11:


    ```

    # chkconfig --level 35 nscd on

    ```


    To start up nscd in the current session, enter the command as:


    ```

    # service nscd start

    ```


    To restart nscd with the new setting, enter the following command as:


    ```

    # service nscd restart

    ```


