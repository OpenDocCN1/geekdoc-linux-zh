  md: '# How to Modify or Deinstall Oracle Grid Infrastructure


    This chapter describes how to remove Oracle Clusterware and Oracle ASM.


    Starting with Oracle Database 11g Release 2 (11.2), Oracle recommends that you
    use the deinstallation tool to remove the entire Oracle home associated with the
    Oracle Database, Clusterware, Oracle ASM, Oracle RAC, or Oracle Database client
    installation. Oracle does not support the removal of individual products or components.


    This chapter contains the following topics:


    +   - Deciding When to Uninstall Oracle Clusterware

    - Migrating Standalone Grid Infrastructure Servers to Cluster

    - Relinking Oracle Grid Infrastructure for a Cluster Binaries

    - Changing the Oracle Grid Infrastructure Home Path

    - Deconfiguring Oracle Clusterware Without Removing Binaries

    - Removing Oracle Clusterware and Oracle ASM


    > See Also: Product-specific documentation for requirements and restrictions to
    remove an individual product


    # 6.1 Deciding When to Uninstall Oracle Clusterware


    Remove installed components in the following situations:


    +   - You have successfully installed Oracle Clusterware, and you want to remove
    the Oracle Clusterware installation, either in an educational environment, or
    a test environment.

    - You have encountered errors during or after installing or upgrading Oracle Clusterware,
    and you want to reattempt an installation.

    - Your installation or upgrade stopped because of a hardware or operating system
    failure.

    - You are advised by Oracle Support to reinstall Oracle Clusterware.'
  merge: -1
  img_proc: true
