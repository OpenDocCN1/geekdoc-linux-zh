    ## File Management in Linux


    Every operating system follows its own algorithms to organize files and calls
    them a file management system. Windows users have a simple file management system
    that can be easily modified or applied using keyboard shortcuts or graphical user
    interfaces.


    But in Linux, a set of commands should be learned to perform even simple tasks
    like moving or copying within the directory. This gives a good level of secure
    functionality to Linux. In this section, we will learn about all this stuff in
    detail.


    ## Why do hackers need to be aware of file management in Linux?


    Linux is an operating system that deals with files and directories in a whole
    lot different than Windows. Hackers need to learn about modifying directories
    so that they can easily exploit the system when they gain access. We will know
    about a few of these now.


    ### 1) Absolute path


    Every directory or file has a distinguished path that can be used to notice or
    manage things easily. There is also quite a complex successor of it called a relative
    path about which we will discuss in the next section.


    For example, consider this path


    ```

    /Srujan/downloads/red.mp4

    ```


    This is called an absolute path because it all points towards the file.


    ### 2) Current directory


    When we are working in Linux, we often want to know the current directory so that
    we can easily modify things. You can use the following PWD command to know the
    details of the current directory.


    ```

    vulnerhost@example: cd /etc

    ```


    ### 3) Relative path


    Relative paths are the upper and lower levels of the absolute path that we are
    working with. They are represented by the dots and are called as special directories
    by the Linux creators. Below is a small example using the command to understand
    in a better way.


    ```

    vulnerhost@example: cd /etc

    ......

    vulnerhost@example: cd /etc/

    ```


    ### 4) Touch to Create Command


    Linux uses various methods or commands to process files. Here we will explain
    about creating a new file of any type using touch command.


    Linux can create a lot of file types such as .txt or mp3 by using the touch command
    as shown below using the command.


    First of all, you need to be in the directory you wish to create the file and
    then enter in the following way:


    ```

    vulnerhost@example: touch sample.mp3

    ```


    After entering the check command, you can recheck using the -l command for viewing
    the files in a current directory.


    ### 5) Delete the file


    Deleting a file is a basic task any hacker would need to learn. In Windows, you
    can delete with a click, but Linux offers a special security layer that will not
    let you delete any system files such as log files. To remove any files, you need
    to use the rm command as shown in the following example


    ```

    vulnerhost@example: rm example.gif

    ```


    ### 6) Move or rename files


    Linux provides a command that can be used for both moving and renaming files.
    Moving files may become essential to hide forensic investigators about the attack
    you have done. It may be be a lifesaver to easily get sensitive information.


    This command can also be used to rename files. Below is the example that describes
    the following two use cases:


    ```

    vulnerhost@example: mv example.gif

    [for moving the file]


    vulnerhost@example: mv example.gf report.gif

    [for renaming the files]

    ```


    ### 7) View the file


    Normally text editors or IDEs can be used to view the file content. Certain file
    types for suppose like an MP3 can be opened by a music player software. However,
    Linux provides a command called the cat that will let us read the file in the
    same way as Linux kernel reads it. Below is the command for the cat command with
    an example.


    ```

    vulnerhost@example: cat songs.txt

    ```


    ### 8) Head Command


    Normally files consist of a lot of information and can cause crashes when opening
    using the cat command. To get rid of this disadvantage you can just see the first
    10 lines of any file using the head command. This will help for a fast recheck
    of log files when there is an attack or delete your login information when you
    are the attacker.


    > Below is the command to view the file:


    ```

    vulnerhost@example: head songs.txt

    ```


    ### 9) Tail Command


    If the head command lets the users see the first 10 lines of the files, the tail
    lets the users see the bottom 10 lines of the code. This can be used to easily
    organize the system programs by using their results or to see the final result
    of the system processes.


    Here is an example that describes the following command:


    ```

    vulnerhost@example: tail songs.txt

    ```


    ### 10) Make a directory


    We have already described a directory as a file system that hierarchically stores
    files. This mkdir command can be used to create a new directory on your preferred
    location.


    ```

    vulnerhost@example: mkdir songs

    ```


    ### 11) Delete directories


    Normally hackers delete a lot of directories just for fun. Or sometimes they do
    it to keep their traces off. By using rmdir you can delete the directory. Below
    is an example:


    ```

    vulnerhost@example: rmdir songs

    ```


    ### 12) Copy Directories


    Replication is one of the important concepts that hackers need to learn. When
    you attack and get access to the system you can copy the data to another location.
    For this reason, there is a command called cp. Below we give an example:


    ```

    vulnerhost@example: cp songs movies own```


    ### 13) chmod to Change Permissions


    Linux uses permissions to make things work. Usually only root users can have access.
    However, Linux provides a command called chmod that can be used to change permissions
    or give access to other users. This is very important for hackers.


    Below we explain with example:


    ```

