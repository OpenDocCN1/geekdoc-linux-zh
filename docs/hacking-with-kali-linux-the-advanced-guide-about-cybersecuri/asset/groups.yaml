    等社交网络群中经常找到的分步程序或说明，他们永远无法破解系统。


    但不应该轻视他们的重要性，因为如果系统包含过时的技术，且这些技术存在许多漏洞，脚本小子极有可能利用这些系统。


    ## 层级 2：新手黑客小组 (A group of Novice hackers)


    这里的“新手”是相当水平的同义词。许多黑客花时间在黑客或破解论坛上，试图交换知识并一起进行利用。这一层级的黑客是因为好玩而聚集的。他们经常尝试破解像 Netflix
    这样的网站，并尝试以廉价卖给他们。这些新手黑客使用具有暴力破解能力的破解工具，使用他们通过 SQL 漏洞收集的一系列用户名和密码不断尝试登录。


