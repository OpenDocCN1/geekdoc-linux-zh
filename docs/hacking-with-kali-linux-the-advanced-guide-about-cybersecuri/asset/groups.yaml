    Usually, when we run an ifconfig command everything that is acquired or obtained
    by sending network packets is stored in a configuration file. Configuration files
    are special types of files they maintain a certain order so that the system can
    detect. Not every file need to be a configuration file.


    However, when we boot or switch the system everything that is the input protocol
    information will be deleted forever. So, instead of rekindling the entire procedure
    other time it is best to write into a configuration file which can be easily found
    in the, etc folder.


    In the configuration file enter the network address and network mask in detail.
    It should be important because the manipulated network configuration file can
    be used to do a fingerprinting about the system.


