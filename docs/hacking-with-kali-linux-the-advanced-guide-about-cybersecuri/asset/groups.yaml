    - 1) 首先，安装安装 VPN 所需的工具或证书。通常应该下载 CA 证书并将其上传到系统。该证书由一个哈希代码组成，它让我们通过匿名链接连接到服务器。

    - 2) 在下一步中，我们需要进入网络管理器来启动 VPN 连接。当你启动新的 VPN 连接时，输入由 VPN 提供商提供的网关详情。

    - 3) 在下一步中，你可以提供身份验证详情，简要包含 VPN 服务提供商应用程序或网站中的凭据。


