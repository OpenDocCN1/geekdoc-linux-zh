    usually have computers and these are called hosts and they have an immediate physical
    address known as MAC address. Gateway works as a gate or checking point that checks
    the network packets and sends them to the servers the user is trying to contact.
    It does the same when a response is received. For this reason, gateways are the
    most important part of network systems.


    # Why are gateways important for hackers?


    When you are willing to use a VPN or proxy server then you need to enter the gateway.
    Otherwise, the packets will just pass through the default router gateway.


    Here are commands that can be used to change the default gateway:


    ```

    example@linuxwar : gateway = 214.133.1.1

    ```


    In the next section we will discuss routing and why is important for the better
    performance of the network systems.


