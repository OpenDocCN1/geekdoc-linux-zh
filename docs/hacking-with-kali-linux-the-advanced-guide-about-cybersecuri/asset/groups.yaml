    reason, there are a lot of hardware systems that only work with Linux.


    # 4) Security


    People have a misconception that open-source systems are prone to vulnerabilities
    and easy attacks. But this works oppositely because Linux has more Authorization
    and administration security features than windows. Users can select their security
    features in both basic and advanced levels.


    # 5) Multi-user & Multitasking


    Linux can be used by different users and on different levels by the options they
    select. It doesn''t decrease the speed or change the way the system works. Apart
    from multi-user functionality, Linux is also very good at Multitasking. That is
    performing a lot of tasks in the stack.


    # 6) High level of portability


    As we said before Linux systems can be connected with any other systems from high-end
    servers to low-level Arduinos. This is the reason why Linux is loved by system
    programmers to robotic developers.


