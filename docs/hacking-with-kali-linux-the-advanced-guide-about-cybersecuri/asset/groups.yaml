    Routing is a network protocol system that sends packets in a definite way so that
    the time that takes to transfer the packets reduces. When a lot of packets are
    being sent it usually takes a lot of time and can result in less network bandwidth.
    For this reason, efficient routing protocols are being developed for better transportation
    of packets.


    For this, we need to create a routing table and should calculate for the flags
    that may be present in the network system.


