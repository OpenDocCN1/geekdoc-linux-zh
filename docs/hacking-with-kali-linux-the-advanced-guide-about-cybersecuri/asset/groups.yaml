    create an own shell script that can send back information to our server. For the
    visual demonstration of this topic we will explain about a shell script that performs
    the following functions:


    +   a) The shell script should collect all the user contacts that are present
    on the phone.


    +   b) The shell script should identify any new messages that are received and
    send them to the Metasploit server.


