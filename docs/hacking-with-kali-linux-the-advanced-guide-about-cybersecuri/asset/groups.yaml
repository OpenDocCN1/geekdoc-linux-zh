    In the previous chapter, we had a brief overview of Linux and hacking along with
    a step by step installation of Linux. In this chapter, we will talk about a lot
    of Linux basic concepts like process management and file management with commands
    in detail. This chapter helps us to use the Linux structural concepts to exploit
