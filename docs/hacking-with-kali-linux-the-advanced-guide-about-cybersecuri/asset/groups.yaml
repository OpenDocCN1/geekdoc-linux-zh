    打包好应用程序后，你应该寻找一种聪明的社会工程技术将其发送到受害者的系统。你可以使用一封带有 rar 文件的电子邮件将其发送到手机。当受害者在手机手机上成功安装该应用程序时，该程序将在后台运行，并将所有需要的数据发送到
    Metasploit 服务器。


    关于该漏洞及其使用 Metasploit 接口控制台进行实现的内容就介绍到这里。在下一章中，我们将简要介绍名为 Wireshark 的网络嗅探工具并结束本章。


    ## 无线网络嗅探工具


    在提供的大量的 Kali Linux 工具中，由于无线网络在日常生活中的大量扩展，该工具处于最受欢迎的工具之。从蓝牙设备到无线回声设备，许多无线设备如果连接到不安全的无线网络，就可以被轻易嗅探。


    ## 什么是嗅探？


    通常来说，嗅探（Sniffing）是一个定义为窥视其他内容的术语。在技术术语中，嗅探意味着使用 Wireshark 和 aircrack-ng 等工具查看来自其他设备的网络数据包。我们将在本节中详细讨论这这两个工具。


    ### a) Wireshark


    Wireshark 是一种网络嗅探工具，用于跟踪网络处理的每一个数据包。启动嗅探工具后，你需要等待至少 24 小时，以便嗅探器捕获足够数量的数据包进行分析。在分析过程中，可以很容易找到所有如密码和信用卡号之类的敏感信息。还可能存在使用嗅探工具来破解正在发送的未加密文件和电子邮件。


    这就是为什么黑客应该使用加密邮件服务和虚拟专用网络（VPN）以获得更好安全性的原因。


    ### b) aircrack-ng


    Aircrack-ng 是另一种被广泛用于破解 WiFi 密码的网络嗅探工具。通常情况下，WPA2 WiFi 路由器被认为是最安全的网络路由器，而 WPS
    路由器则留下了可以轻易破解其密码的漏洞。aircrack-ng 利用这一漏洞进行字典攻击扫描并连接到无线网络。Aircrack 是目前市场上最流行的无线网络程序之一。


    到此，我们已经完成了对一些重要的 Kali Linux 工具的详细介绍，并概述了使用这些工具可以完成的实际应用。我们希望通过这一章，你获得了许多有意义的信息。


    本书到此结束，我通过对黑客应该成为什么样的样的清晰解释来结束本书。黑客学习技能并付出极大努力应用它们来破解系统。破解并不意味着去利用并将其用于作恶的目的。破解意味着检查墙是否建造得足够坚固。就是这样，这是黑客需要时刻记住的。祝我们的黑客冒险一切顺利！


    ## 结论


    感谢你读到《Linux 黑客攻击》（Hacking with Linux）的最后，希望它提供了丰富的信息，并能够为你提供实现目标所需的所有工具，无论这些目标是什么。


    下一步是在现实世界和漏洞利用环境中使用这些概念，或者出于善意地保护它们。祝一切顺利！


    最后，如果你在任何方面觉得此书有用，我们将非常感谢你在 Amazon 上给出评价！

