    # Why certificates should be signed for android?


    Installing signed applications is a mandatory thing in iOS however android doesn''t
    have restriction. But from the latest versions of android google made things difficult
    for hackers.


    In the past with the help of remote execution hackers used to install trojans
    and worms with malicious content with a click. However, nowadays it has become
    a lot difficult because the user needs to grant the permissions manually. For
    this reason, you need to polish your social engineering skills before trying to
    send the exploit to the victim. Make them believe with your words that this is
    a necessary application that needs to be installed. That''s what all hackers do
