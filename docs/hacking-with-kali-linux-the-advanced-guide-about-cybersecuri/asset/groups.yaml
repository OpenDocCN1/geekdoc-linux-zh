    # Metasploit


    Metasploit is one of the most important hacking tools due to its huge number of
    features that can be used on a target. The best thing about Metasploit is although
    being a tool that offers a lot of features and it is available as open-source.
    It matters because the burp suite which we discussed before has a premium license
    and restricts some of its features like automatic scanning for free users. Just
    like bur suite Metasploit also offers a professional license.


    The major difference between both versions is that in the free version you can
    only use 32 hosts at a time. This may be quite difficult for hackers trying to
    exploit large systems at once. So choose the version according to your preferences.


    Metasploit is pre-installed in the Kali Linux. If you want to install Metasploit
    in other Linux versions use the following command


    ```

    wget Metasploit

    ```


    Metasploit also gives web interface access which can help us to access all the
    hosts we are using. Create an account and manage everything about the exploits
    here.


    Practical scenario: Use Metasploit to make an exploit app that consists of malicious
    code which can take control of an android phone and can read its files, contacts,
    and messages and send them to a web server of yours.


