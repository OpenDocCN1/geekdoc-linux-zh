    # 为什么黑客喜欢 Linux


    正如我们之前提到的，Linux 是黑客和系统管理员之间广流行的操作系统。许多原因使得世代又世代的黑客选择 Linux 作为他们的默认操作系统。在本节中，我们将详细讨论这一点。


    ### 1) 控制


    普通的 Windows 具有图形用户界面，对于大多数用户来说易于操作。但除了界面简单，Windows 和 Mac 限制了用户操纵他们创建的系统或组织。而 Linux
    的工作方式恰相反。命令行界面作为 Linux 的基本构建模块，可以帮助用户以任何方式操控他们正在工作的系统。这让用户能够执行复杂的任务，而这正是黑客一直需要的。


    ### 2) 安全


    目前，Windows 有海量的应用程序正在开发，其次是 Mac，因为有许多新手用户使用这些系统执行日常任务。这使得他们成为破解者和黑客的易猎物，这些人正拼命在系统中寻找漏洞。但
    Linux 在所有操作系统中拥有更多的安全特性，因此通常被非常看重匿名性的黑客所青睐。


    ### 3) 更改操作系统特性


    与其他系统相比，Linux 允许用户随心所欲地更改。人们可以整理他们使用的重要网络工具并在桌面上对其进行自定义。与 Windows 不同，许多其他功能如内存管理和
    MAC 地址可以使用 Linux 轻松操纵。这种自定义能力是黑客偏好 Linux 的最重要的原因之一。Linux 有许多自定义的 GUI 界面，如 GNOME、KDE、MATE。


    ### 4) 扩展以适应你的喜好


    你可能听过《星球大战》了。它是改变了整个类型的著名科幻小说之一。它基于这样一个概念：人们可以使用星球大战宇宙创建自己的剧情。Linux 也是一样。通过使用内核源码，可以在
    Linux 世界创建名为发行版（Distros）的操作系统。这让组织事情变得更容易。黑客也利用这一功能让事情变得更好。在下一节中，我们将详细讨论这一点。


    # 什么是黑客 Linux 发行版？


    如前所述，Linux 提供了创建预定义系统版本的能力。一些回馈社区的专业黑客社区为黑客创建了 Backtrack 发行版。它取得了巨大的成功，并成为新手黑客的路径。


    Backtrack 在系统中预装了许多开源黑客工具，连同许多编辑工具和 IDE。几年后，Backtrack 停止了更新并演变为一种新形式 Kali Linux，它现在是黑客最常用的操作系统之一。它包含许多整齐组织的黑客工具。除了
    Kali Linux 之外，还有如 Parrot Linux 等被黑客使用的发行版。在本书，我们将使用 Kali Linux 作为默认发行版来解释概念以提供广泛的概述。在下一节中，我们将详细解释如何安装
    Kali Linux。跟随操作以轻松理解。让我们开始吧。


    # Linux 发行版的安装


    在本节中，我们将讨论如何通过步骤说明安装任何 Linux 发行版。我们还将对分区（partition）、引导加载程序（boot loader）等主题进行详细分析，以获得
    Linux 基础知识的良好概述。让我们开始吧！


    # 安装要点


    第 1 步：


    获取你需要在系统中安装的 Linux 发行版的启动 ISO 文件。你可以从网站下载它并加载到启动光盘或 USB 盘中。


    第 2 步：


    如果你感兴趣在系统中同时使用 Windows，可以使用双系统（double boot）选项在启动时选择操作系统。将根据你的选择选择其中任何一个进行启动。


    第 3 步：


    你也可以在 Windows 中使用如 VMWare 等虚拟机软件启动 Linux。这是黑客最青睐的方式，因为当你使用虚拟系统时，追踪它会变得困难。


    通过这个解释，我们已经理解了使用 Linux 的不同方法。现在，在本节中，我们将分步骤安装任何 Linux 发行版。为了方便起见，我们假设为 Kali Linux，因为我们正在学习黑客。


    # 你需要安装的步骤


    1) 启动启动光盘或 USB 或虚拟机以进入安装过程的图形用户界面。还有一个使用命令行界面安装 Kali Linux 的选项。


    2) 在下一步中，启动文件会自动检测所需的驱动程序。如果发生任何故障，系统将不会继续进行安装。如果你卡在任何错误上，可以在 Google 上搜索该错误，以获取逐步的故障排除程序。


    3) 在下一步中，你可以选择你偏好的语言。大多数人会选择“English (us)” 选项。选择任何你想让界面显示的语言。


    4) 在下一步中，你可以选择你的时区和国家。选择你想使用的选项。


    5) 在下一步中，我们需要选择最重要的网络监控设置。如果你愿意，可以连接到任何无线网络。你甚至可以在这一步选择可能需要安装的网络驱动程序。


    6) 在这一步中，我们将进行安装中最重要的步骤——分区。分区将帮助我们确定想要使用的文件系统。有 ext3 或 fat32 等选项，选择你喜欢的即可。


    你也可以根据需要使用自定义分区。


    7) 在下一步中，我们可以为操作系统输入用户名和密码。重新输入凭据并开始安装过程。


    8) 一段时间后，安装程序完成，我们将受到 Kali Linux 或你尝试安装的任何其他 Linux 发行版欢迎面的欢迎。


    就是这样。这就是我们在电脑上安装 Linux 发行版所需要的所有知识。我们现在充满了知识，并在实践上已经做好了就绪，可以尝试 Linux 并开始黑客攻击。准备好在下一章中学习
    Linux 基础并带来乐趣。良好的 Linux 结构概述可以帮助我们有效地进行黑客攻击。所以，让我们开始吧！


