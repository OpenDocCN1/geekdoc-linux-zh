    ## Process Management System


    So before going into further details, we must know what a process is and why it
    is important in the context of Linux and its system functions.


    ## What is the process?


    As deep as it process is just a term that explains that the operating system is
    currently filtering things to process the task. Processes are dynamic and nowadays
    a lot of computer systems are capable of handling multiple processes. Supercomputers
    are said to process trillions of them.


    Linux being a kernel modified system has certain free will restrictions to processes.
    Usually, processes in Linux consist of three cycles namely starting, running and
    blocking. We will explain these three states in detail as shown below.


    ### a) Starting state


    The start state, in brief, describes that the process is getting ready to be allocated
    by the CPU and other resources to run.


    ### b) Running state


    Running state explains that the process that we are currently dealing with is
    running with a certain part of resources. There are tools like task manager that
    can show the process monitoring.


    ### c) Blocking state


    The blocking state explains that a particular process cannot be run anymore. They
    may have been killed on purpose or can be crashed due to errors and warnings.
    Whatever the reason may be blocked state initiated the killing of the process.


    ## Processes, Procedures, and Programs


    We have already discussed processes in detail. Procedures are processes that are
    aligned systematically and linearly. Whereas programs are a set of procedures
    that can be combined to create a good system software.


    There are some important characteristics of processes that hackers should be aware
    of. We will explain some of them:


    - There are two types of processes. The first of them are mutually exclusive processes
    and the second one is synchronization processes.


    - Mutually exclusive processes are little skeptical processes because you cannot
    run them in the background or correlation with others. For example, like a recovery
    software or like using a printer to print papers.


    - Synchronization processes are usual processes that are can be run in the background.
    You can consider a media player process for this example.


    ## Commands for process management


    Usually, the Linux system runs an abundant number of processes. When you start
    and boot up the system tens of processes get initiated. It may be an antivirus
    or backup system software. To look at all of the processes that are running in
    the system you may enter ps command with parameters.


    ```

    vulnerability @ example: ps PID 34534

    ```


    Some of the parameters are present listing, displaying process id and CPU percentage
    used. You can even make processes sleep, pause and give priorities. We will discuss
    some of them in detail here:


    - a) When we enter ps command we will get total processes that are running. The
    first line describes the names of the process and the PID that is assigned to
    them.


    **What is PID?**


    Like User ID (UID) we have discussed before PID is a number that is assigned to
    a particular process. These are not permanent and will get collapsed when the
    process ends, unlike permanent UID.


    - b) The second line describes the initiation time of the process and the percentage
    of the system power it is consuming. This is important for hackers because whenever
    a process is taking a lot of system power one can end it easily using the kill
    command which we will describe in the next section.


    - c) The third line can be used to declare priorities for the processes. For example,
    when you are performing exploitation and backup at the same time you can give
    priority to one of them as you wish to give more system resources. This will help
    hackers when they are doing injections to a lot of databases or networks.


    And at last, we will learn about the termination of processes. A lot of processes
    can decrease the system efficiency and make Linux buggy. So, for a certain interval
    of time, you need to kill some processes by using the kill command. Kill command
    will stop all the processes at once by using killall or will just end the process
    you want to.


    Below is a command that explains how kill works:


    ```

    vulnerhost @ example: kill example process

    ```


    - d) You can even restart the killed processes for once using the same command.
    This just acts like a recycle bin for the processes.


    ```

    vulnerhost @ example : restart exampleprocess

    ```


