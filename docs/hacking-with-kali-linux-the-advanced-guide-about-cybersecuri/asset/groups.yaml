    # Why is Linux the Best Operating System?


    One of the most important success notions for Linux is that it has a great adaptability
    for server-side systems. Database administrators are more comfortable in using
    command-line interfaces than Graphical user interface systems which have become
    common. Below we will discuss other reasons in detail.


    +   1) Open-sourced


    Linux is one of the few open-source operating systems that are available. It means
    that anyone can download it for free and can use it to develop custom or third-party
    operating systems, for example like Red hat Linux.


    +   2) Degree of Modularity


    Linux kernel consists of five different parts that can be changed or organized
    according to their actual needs. That is one can select or filter the functions
    that are important for them. This made individual users interact with the operating
    system more comfortable.


    +   3) Hardware support'
