    \ couldn’t be simpler\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_59_0.png)\n\n\
    ![](img/1f330653f83dcf0397f7d224ce8bbc16_59_1.png)\n\n# 01  **Wire in the switch**\n\
    \nThe first job in interfacing a switch to the Pi is to connect one of the switch’s\
    \ two terminals to a GPIO pin (which will be configured as an input in the software)\
    \ and connect the other of its terminals to 0V (GND). Having done this, the GPIO\
    \ pin will be connected to 0V. A condition that the software will see as a logic\
    \ 0, wherever the switch is closed, ie held down in the case of a push button\
    \ or in its ‘on’ state with a mechanically latching toggle switch.\n\n# 02  **Add\
    \ a pull-up resistor**\n\nAlthough a GPIO pin wired to a switch and 0V will be\
    \ at logic 0 when the switch is closed, it will be ‘floating’ when it’s open.\
    \ In other words, it wouldn’t be certain whether it would be seen as a 0 or a\
    \ 1. To overcome this, it must be wired to +3.3V via a resistor, which is referred\
    \ to as a pull-up resistor. Now, the GPIO pin will be logic 1 when the switch\
    \ is open. The resistor value isn’t critical, but 10k is a good choice.\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_59_2.png)\n\
    \n# 03  **Use built-in pull-ups**\n\nIf you’re wiring the switch to some types\
    \ of other single-board computer or to the Pi’s GPIO via some logic circuitry,\
    \ an external pull-up resistor is the only solution. However, if you’re interfacing\
    \ directly to a GPIO pin, you can, as an option, enable an internal pull-up resistor\
    \ in the Pi’s circuitry. The bit of code reproduced here shows how this is done\
    \ using the RPi.GPIO Python library. The circuit diagrams in the remaining steps\
    \ assume an external pull-up, but, if you’re using an internal pull-up, just omit\
    \ the 10k resistor.\n\n```\n    GPIO.setup(2, GPIO.IN, pull_up_down=GPIO.PUD_UP)\
    \  # set GPIO 2 as input with pull-up\n```\n\n# 04  **Limit the current**\n\n\
    Because GPIO pins are bidirectional, there’s a potential problem if a pin that’s\
    \ attached to a switch is accidentally configured as an output and set to a logic\
    \ 1. This will put 3.3V on the pin which, if the switch is then closed, would\
    \ be connected directly to 0V. This would cause a high current to flow and, potentially,\
    \ damage the Pi. Putting a resistor in series with the switch will prevent this,\
    \ and 1k is the recommended value. The series resistor is also integral to the\
    \ circuit in the next step, so don’t omit it if you want to add de-bounce circuitry.\n\
    \n![](img/1f330653f83dcf0397f7d224ce8bbc16_59_3.png)\n\n# 05  **De-bounce the\
    \ switch**\n\nWhen a switch is operated, the contacts often open and close several\
    \ times very quickly for a short time. This is called bounce, and it might cause\
    \ problems. Perhaps..."
