  md: '![](img/1f330653f83dcf0397f7d224ce8bbc16_88_0.png)


    # Docker 1.12 integration finally makes the transition across to Fedora


    sometimes problematic system programming language, but we’re glad to say this
    is a thing of the past thanks to the inclusion of Rust. albeit not overly well-known,
    Rust’s integration helps eradicate any and all stability issues faced previously;
    another welcome addition, we must say.


    Moving into Fedora Workstation, arguably the biggest addition here is with GNOME
    3.22. There’s an abundance of subtle interface improvements, and we particularly
    like the all-new keyboard settings tool. For developers making changes on the
    fly, this is a helpful asset to have around. Window management has also seen some
    enhancements, and while cosmetically you’ll be hard pressed to really spot any
    differences, being able to multi-select files and systematically edit metadata
    through certain key-bindings proves to be a big help. You’ll also now find decoding
    support for MP3 files, but this seemed to be hit-and-miss with its end results
    during our time with it. Thankfully, users can find alternatives for download
    through the software centre.


    Fedora Server’s CoCaP system has seen a variety of changes, with a new SELinux
    Troubleshooter module on hand to help diagnose problems. Due to the complexities
    of Server as a whole, this module is ideal for finding and fixing faults effortlessly.
    There were a few instances when we relied on SELinux to figure out an issue and
    it solved it with consummate ease. The jury is still out on how it’ll handle more
    advanced failures,


    however. Dig a little deeper and users can also find admin support for SSH keys,
    enabling users to systematically track connected machines at any time. We did
    find some initial slowdown with this feature, but to our knowledge, this seems
    more a hardware fault than anything with the software itself.


    Fedora Atomic was an entirely new flavour for Fedora and first impressions are
    positive. There are ways throughout to help create and deploy container-based
    workloads, linking in well with the Docker integration mentioned previously. While
    this edition perhaps lacks the high-quality Fedora finish we’ve become accustomed
    to, a two-week update cycle is a surprising and welcome twist. We’ll reserve judgement
    until the first point updates have been released.


    We have to say that the Fedora team has seriously done a tremendous job here.
    Each of these editions has upped our expectations of what Fedora is capable of,
    and despite some small flaws, it certainly feels like a near-complete update.
    The promise of dropping Fedora Cloud and subbing in Fedora Atomic is a potentially
    risky move, but early signs are that Atomic is certainly up to scratch. If you’ve
    been biding your time to check out Fedora, now is the perfect time to do so. Beginner
    users should arguably start by using Workstation to get used to the nuances that
    Fedora offers, while advanced users should pick and choose the edition that suits
    them best.


    Oliver Hill


    **Pros**

    Most new additions have dramatically improved the user experience, with bug fixes
    helping to fix previous problems.


    **Cons**

    Integration of certain tools can be hit-and-miss and we’d love to see more crossover
    between the three distinct versions of Fedora 25.


    **Summary**

    Core changes to the Fedora brand are far less than and while none are perfect,
    each individual addition is certainly worth taking the time to check out.

