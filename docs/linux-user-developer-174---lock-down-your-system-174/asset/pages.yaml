- pgno: 80
  md: '# Reviews


    81 **Group test** | 86 **Solwise PL-1200AV** | 88 **Fedora 25** | 90 **Free software**


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_80_0.png)


    # GROUP TEST


    # Web browsers


    Is Chrome still the cream of the crop when it comes to modern, open-source web
    browsing?


    # Midori


    Midori is considered one of the fastest, cutting edge browsers out there, offering
    users the latest web tech and extension system to help make the browser their
    own. It''s comparable to Chrome in a lot of ways, but does it do enough to stand
    out from its shadow?


    midori-browser.org


    # Chrome


    The continuous developments behind Chrome have helped it become one of the biggest
    most widely used web browsers today. Combining simplicity with usability has been
    at the heart of its growth, but it''s also helped propel its competition to improve
    dramatically as well.


    www.google.com


    # Firefox


    One of the reasons Firefox''s reputation continues to grow is due to its customisation
    offerings. Many parts of the browser can be tailored to suit your needs, and because
    of it, there''s been some fantastic spin off products made. Can it claim top spot
    in this group test, however?


    www.firefox.com


    # QupZilla


    QupZilla introduces some interesting concepts. It uses a unified library mode,
    helping keep your bookmarks, history and RSS feeds in a single window. Plus, with
    AdBlock integrated as standard, could QupZilla cause an upset for its bigger rivals?


    www.qupzilla.com'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# # Midori


    ## Lightweight, fast and always on the cutting edge of web developments


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_81_0.png)


    Midori will work a vast selection of search engines, with an installer on hand
    to help you switch when necessary


    # ### Browser design


    The coding behind Midori is fantastic, giving it a beautiful design throughout.
    Everything from bookmarks to tabs is controlled through a single menu, so you
    won''t find any complex windows to navigate through. Best of all, its design carries
    through each and every Linux distribution, so you''re guaranteed the same experience
    every time.


    # ### Web performance


    Speed is of the essence, and we''d go on record and say it''s faster than Chrome.
    At its core is a lightweight webkit rendering engine, which makes loading speeds
    lightning-quick. It''s even above average for image and video-heavy webpages,
    so it''s a great all-rounder. Midori really shows off the benefits of what a lightweight
    design can do for performance.


    # ### Management and settings


    Many of Midori''s core settings are ideal for tailoring privacy, but there''s
    little on offer for browser security. It''s an annoyance, but it would counteract
    the browser''s lightweight build. We did like, however, Midori''s bookmarking
    suite, which can be used to tailor for different site combinations and even create
    a quick load list.


    # ### Plugins and extras


    One of the better extras on offer in Midori is its built-in downloader, a perfect
    accompaniment when it comes to on-the-spot file downloads. It can be a little
    clunky with media files, but it''s a small issue. Other extras are minimal in
    choice, but both the RSS feed manager and spell checker are helpful additions
    for most users. There''s room for more options here, however.


    # ### Overall


    > Midori burns up the rest of the field when it comes to its speed, and while
    a few options are missing, this is a lightweight distribution that seriously challenges
    Chrome''s crown in most areas.


    # # Chrome


    ## Is the king of browsers still managing to hold on to its crown?


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_81_1.png)


    Extensions vary in their use, with some acting as standalone functions and others
    offering links to current apps


    # ### Browser design


    From the outset, Chrome looks like a relatively minimal browser, utilising a single
    bookmark manager as its single standout noticeable feature. One caveat is that
    it does get a little complicated when you start digging through its menu systems,
    of which there are many. You''ll find everything you could need for a good browsing
    experience buried here, however.


    # ### Web performance


    Having the power of Google behind it has helped Chrome tremendously. Whatever
    you throw at it is handled with the utmost ease, no matter the media content within.
    What''s particularly enjoyable about using Chrome is how it deals with older websites,
    performing on-the-spot checks for corrupt code and altering the loading process
    to cater for it.


    # ### Management and settings


    Chrome has one of the best bookmark management tabs out there, enabling them to
    be integrated throughout your desktop and beyond. Alongside that, its history
    tab is packed with great features to help manage previously visited sites with
    ease, and even export them if needed. The amount of choice on offer is a bit overwhelming
    for new users, however.


    # ### Plugins and extras


    We''d say that part of Chrome''s appeal is through its experimental feature page.
    There''s a lot of developmental features here that can be integrated into your
    browser. Of course, some of them can make your browser unusable, but some are
    fantastic additions. Away from that, Chrome''s Web Store has some impressive tools
    that can also be implemented into the browser.


    # ### Overall


    > Chrome still remains one of the best browsers out there. With the Google juggernaut
    behind it, updates are thick and fast, keeping up to date with the latest must-have
    web trends.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Firefox


    # Mozilla’s browser continues to make waves in its field


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_82_0.png)


    ▪ Add-ons allow you to customise how some of the core functions with Firefox actually
    work. They vary in their success and usability


    # Browser design


    Out of all the browsers featured here, Firefox takes the most time to get used
    to. That’s not to say it’s bad by any means, but a lot of core tools are in different
    locations than some users would normally think to look for them. However, several
    of the browser’s key components can be customised, which is a big plus when compared
    to the competition.


    # Web performance


    Firefox’s performance is generally impressive, but it can feel a little sluggish
    at times. The crux of this issue usually stems from the plugin menu, which you’ll
    need to keep a close eye on. Despite this, Mozilla’s backing does help Firefox’s
    reputation as one of the more file-friendly browsers out there, so integrating
    your day-to-day life with the web is easier than you might think.


    # Management and settings


    Managing your various social accounts through one menu within Firefox is a particular
    highlight, and we wish it was something that other browsers looked to implement
    into their offerings. Settings choices aren’t as fully featured as those that
    Chrome offers, which we do actually prefer, but those wanting to experiment with
    their browser may be left disappointed.


    # Plugins and extras


    Firefox offers its Private Browsing with Tracking Protection combo as a one-stop
    tool to help you browse the web anonymously, and in practice, it works an absolute
    treat. We also really liked its intelligent search system that looks to utilise
    its knowledge on your searches and site visits to recommend things that you may
    want to view and read.


    # Overall


    > A lot of Firefox’s extras will be a big incentive for users to check out, and
    rightly so, it does miss some core settings we’d like to have seen, but this is
    still a highly usable browser.


    # QupZilla


    # Fairly new on the scene, does QupZilla deliver a great browsing experience?


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_82_1.png)


    ▪ Native ad-block support is great and even better is that users can configure
    the blocker to their exact tastes and requirements


    # Browser design


    QupZilla’s core design utilises many elements from some of the other browsers
    featured here. That’s not a bad thing by any means, but it’s hard to pinpoint
    the areas that really help make it stand out from the crowd. The minimal design
    is easy to navigate, menu systems are easy to identify and tools are labelled
    correctly. We just wish there was some more originality here.


    # Web performance


    Browsing the web is a pleasure with QupZilla, with loading speeds not hindered
    by pointless animations and other superfluous extras. What we would recommend,
    however, is that you avoid the custom theme library, as we found some issues with
    the browser crashing when we looked to implement one of them. Apart from that,
    all is good here.


    # Management and settings


    QupZilla unifies bookmarks, history and RSS feeds into one place, doing away with
    multiple windows. For end users, it proves to be a helpful addition, allowing
    complete control of the ins and outs of the browser in one place. Another nice
    addition is the ability to import bookmarks from other browsers, despite it being
    a little buggy at times.


    # Plugins and extras


    There aren’t too many extras to speak of in QupZilla, but a couple do shine through.
    Integrated ad-blocking software is a featured point of the browser, enabling users
    to identify the sites they’d like to prevent displaying adverts. There’s also
    a self-styled ‘speed dial’ that can be used to load webpages faster, but again,
    it was a little buggy during testing.


    # Overall


    > Despite some positives, QupZilla still has some annoyances in other areas. We
    must point out that this is still a growing project, and we recommend paying close
    attention to it over the coming months.'
