    # STEAMOS


    # SteamOS 2.97 fixes Steam Controller compatibility woes


    This latest updates provide essential bug fixes for gamers


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_9_0.png)


    Above The Steam Controller now works flawlessly in SteamOS


    Valve has recently launched the stable SteamOS 2.97 maintenance update, almost
    three months since its previous release, SteamOS 2.87. Behind the scenes, SteamOS
    is still in the development phase when it comes to being synchronised with the
    Debian stable repositories, but the latest 2.97 update bridges the gap further
