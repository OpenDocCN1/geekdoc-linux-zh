  md: "# # OPINION  \n# The kernel column  \nJon Masters summarises the latest happenings\
    \ in the Linux kernel community\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_15_0.png)\n\
    \n**Jon Masters** is a Linux-kernel hacker who has been working on Linux for some\
    \ 19 years, since he first attended university at the age of 13. Jon lives in\
    \ Cambridge, Massachusetts, and works for a large enterprise Linux vendor, where\
    \ he is driving the creation of standards for energy efficient ARM-powered servers\n\
    \nLinux Torvalds announced the release of the 4.9 Linux kernel, noting that it\
    \ “is the biggest release we’ve ever had, at least in number of commits.” In fact,\
    \ the numbers aren’t even close. With over 16,000 changesets (3,000 more than\
    \ the previous size), Linux 4.9 is the biggest kernel in some time. Each of those\
    \ changesets represents a group of patches, many of which will have had a number\
    \ of iterations and reviews during development. All of which well explains why\
    \ Linux decided to wait an extra week after a (rare) RCB before pushing the final\
    \ kernel out the door.\n\nThe latest kernel includes a number of new features\
    \ that we have covered in previous issues, including support for Intel’s Memory\
    \ Protection Keys, and Andy Lutomirski’s work on Virtually Mapped Kernel Stacks.\
    \ The latter will increase resilience in the kernel against a number of corner\
    \ case problems, such as overflowing the (fixed size) kernel stack with extremely\
    \ rare code paths, or some of the more obscure forms of security compromise. In\
    \ fact, CONFIG_VMAP has already lead to a number of additional cleanups, including\
    \ better support for virtual address debug, and the identification of a longstanding\
    \ bug in the kernel’s handling of old fashioned 32-bit only x86 processors during\
    \ processor exceptions.\n\nMeanwhile, Intel’s Memory Protection Keys aim to guard\
    \ against certain forms of buffer overflow and other security problems, while\
    \ also providing a means to isolate certain sensitive memory regions (such as\
    \ those containing private keys used for cryptography). Other features in 4.9\
    \ include the useful raft of driver updates, including support for the geybus\
    \ subsystem as used by the (discontinued) Google Ara project that we have covered\
    \ previously as well. Finally, a hardware latency detector originally hacked together\
    \ many years ago by this author (since rewritten more cleanly by another) to diagnose\
    \ problems with real time Linux systems has finally been merged (see the new hwlat\
    \ tracer).\n\nLinux originally had intended for the 4.9 kernel to be released\
    \ a week earlier, but by 4.9-rc6 he was hinting at a potential delay. This was\
    \ confirmed when he added an (unusual) 4.9-rc8, noting that things had not yet\
    \ calmed down enough for him to be confident in a final release. All of this means\
    \ that timing for Linux 4.10 will be awkward to say the least, with the merge\
    \ window closing on Christmas Day. Linus did note, however, that this is “a\n\n\
    pure technicality, because I will certainly stop pulling on the 23rd at the latest,\
    \ and if I get roped into Christmas food prep, even that date might be questionable.”\n\
    \n# ## More security exploits\n\nThree more critical security issues affecting\
    \ the Linux kernel have been announced over the past month. The most serious of\
    \ these was CVE-2016-8655, “Linux af_packet: race condition (local root’”, in\
    \ which a carefully crafted sequence of software calls into the unprivileged namespaces\
    \ code (used by containers on many distributions) could be used to cause the kernel\
    \ to perform a “use after free” type access to memory under the control of the\
    \ attacker, and thus cause escalation of privilege to that of the root user.\n\
    \nThe original discovery of this problem was reported by Philip Pettersson, who\
    \ noted that he “found the bug by reading code paths that have been opened up\
    \ by the emergence of unprivileged namespaces, something I think should be off\
    \ by default in all Linux distributions.” Many of these namespace changes have\
    \ been made in the interest of supporting Linux containers, but some of these\
    \ changes have broken previous assumptions that particular operations were privileged,\
    \ and thus perhaps less subject to the kind of code audit that Philip has undertaken\
    \ here.\n\nOn the face of it, we seem to be experiencing a wave of security bugs\
    \ affecting the Linux kernel these days. But in part, this is because such exploits\
    \ now often come with memorable, cute sounding names, blogs, Twitter handles,\
    \ and corporate PR teams keen to promote their service of discovering the problem\
    \ to begin with. This drives greater attention to security (which isn’t necessarily\
    \ a bad thing). At the same time, Linux is now an incredibly enticing target for\
    \ those up to mischief (or just out for a PR opportunity). In many ways, there\
    \ is more to be gained from compromising Linux than there is in compromising Windows\
    \ or Mac OS, in terms of high value targets.\n\n# ## Heterogeneous memory management\n\
    \nOne of the more interesting trends in hardware is toward sharing memory between\
    \ devices and system applications processors (CPUs) in more homogenous and transparent\
    \ ways. The uptick that we are all hoping will come soon is in the form of coherently"
