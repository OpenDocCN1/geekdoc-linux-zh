  md: '# Tutorial


    # User accounts


    If you are interested in changing a group at a later point in time, you can use
    the `groupmod` command.


    ```

    `~$ groupmod -g 300 mars`

    ```


    The group ID of Mars is changed to 300.


    ```

    `~$ groupmod -n stars venus`

    ```


    The name Venus is changed to Stars.

    Let’s turn our attention to Access Control Lists (ACLs).

    With the help of ACLs, one user can allow others to read, write and execute files
    and directories without requiring the root user to change the user or group that’s
    assigned to them.

    There are a few important things to know about ACLs:


    +   - ACLs need to be enabled on a file system when that file system is mounted

    +   - To add ACLs to a file, you use the `setfacl` command

    +   - To view ACLs set on a file, use the `getfacl` command

    +   - To set the ACLs on any file or a directory, you need to be the actual owner
    assigned to it


    Let’s take a detailed look at the `setfacl` command.

    The system administrator can use this command to modify the ACL permissions (by
    using the `-m` option) or to remove the ACL permissions (by using the `-x` option).


    Below A look at users and groups


    ```

    `~$ setfacl -m u:[username]: rwx file_name`

    ```


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_53_0.png)


    In this command, first we used the `modify (-m)` option followed by the letter
    `u` - this indicates that we are setting the ACL permission for a specific user.
    Then we have specified the username after the colon. After another colon, we have
    the permissions that we want to assign. We can assign read (`r`), write (`w`)
    and / or execute (`x`) permissions to the user or the group.

    Another important aspect that we need to understand with reference to ACL is related
    to the set-up of default ACLs. Setting up default ACLs on a directory enables
    your ACLs to be inherited. In other words, when we create new files and directories
    in that directory, they are assigned the same ACLs. In order to set a user or
    group ACL permission as default, you just need to add `d:` to the user or group
    designation. You can make sure that the default ACL will work by creating a subdirectory
    and running the `getfacl` command. After that, you will see that the default lines
    are added for the user, group and so on, which are actually inherited from the
    directory’s ACL.

    Next, let’s look at how we can enable ACLs. Basic Linux file systems that we create
    after installation have only one user and group assigned to each file and directory
    and thus, they do not include ACL support by default. In order to add ACL support,
    we need to add the `acl mount` option when we mount it. This can be done in multiple
    ways. You can add the `acl` option to the fourth field in the line in the `/etc/fstab`
    file that automatically mounts the file system when the system boots up, or you
    can add the `acl` option to the `mount` command line when you mount the file system
    manually by using the `mount` command.


    | /dev/sdcl | /var/extra_stuff |

    |----------|------------------|

    | ext4 | acl 1 2 |


    Here, we are trying to mount the ext4 file system located on the `/dev/sdcl` device
    to the `/var/extra_stuff` directory.

    Note that instead of the default entry in the fourth field, we have added `acl`.
    If there were already other options set in that field, we need to add a comma
    after the last option and then add `acl`. With this `acl` field, the next time
    the file system is mounted, ACLs are enabled.

    For the second option, add ACL support by mounting the file system by hand and
    using the `acl` option with `mount`. This can be done using a command similar
    to this:


    ```

    `~$ mount -o acl /dev/sdcl /var/extra_stuff`

    ```


    It is important to note here that the `mount` command only mounts a file system
    temporarily. When the system boots, the file system is not mounted again. Thus
    it is necessary to have an entry in the `/etc/fstab` file.

    Let’s take a look at how to add directories for users so that they can collaborate
    among themselves. When we talk about permissions, we know that there are read,
    write and execute bits for users, groups and others. In addition to these bits,
    there are special file permission bits that can be set by using the `chmod` command.
    The bits that you need to use for creating collaborative directories are the set
    group ID bit and the sticky bit. There are specific numeric values associated
    with these bits:'
