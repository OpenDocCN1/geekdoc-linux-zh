    # # Manage user accounts in Ubuntu


    Learn how to effectively manage user accounts, permissions, groups and more


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_51_0.png)


    **Swayam Prakasha** has a master’s degree in computer engineering. He has been
    working in information technology for several years, concentrating on areas such
    as operating systems, networking, network security, electronic commerce, Internet
    services, LDAP and web servers. Swayam has authored a number of articles for trade
    publications, and he presents his own papers at industry conferences. He can be
    reached at **swayam.prakash8@gmail.com**


    # ## Resources


    +   * Unix / Linux Administration

    +       http://bit.ly/2goOTVG

    +   * The Beginner''s Guide to Managing Users and Groups on Linux

    +       http://bit.ly/2Mccv8

    +   * Managing Linux User Account Security

    +       http://bit.ly/2geSYng

    +   * Managing Ubuntu Linux Users and Groups

    +       http://bit.ly/2hwo0wu


    As you might expect, adding and managing users is the most common task of any
    Linux system administrator. User accounts help in keeping boundaries between the
    people who use the system and the processes that run on the system. Groups are
    a means of assigning rights to your system. As expected, each user needs to have
    a separate user account.


    Having a user account provides an area in which you can securely store files.
    One way to add user accounts is through the User Manager windows. The other, very
    straightforward method for creating a new user from the shell is to use the useradd
    command. After opening a Terminal window, you just need to invoke useradd at the
    command prompt. But, please note that for this, you need to have root permissions.
    The useradd command has one required field — the login name of the user — but
    you can also include some additional information using various options. The following
    table describes some of the popularly used options with the useradd command.


    | Option | Description |

    |---|---|

    | `-c "comments"` | Provide a description of the user account |

    | `-d home_dir` | Set the home directory to use for the specific account |

    | `-e expiry_date` | Assign the expiration date for the user account |

    | `-p passwd` | Enter a password for the account that you are adding |

    | `-f 1` | Set the number of days after which password expires |

    | `-s shell` | Specify the command shell to use for this account |


    Let’s look at the **useradd** command with an example.


    ```

    ```bash

    ~$ sudo useradd -c "Swayam Prakasha" swayam

    ```

    ```


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_51_1.png)


    Please note here that we have started with **sudo** as useradd needs root privileges.
    We are trying to create an account for a new user, in this case, the author. Once
    the user is created, the next step is to set up the initial password. This can
    be done using the `passwd` command as shown below (the example includes the author’s
    username; this would be replaced by the username of the user you will be adding).


    ```

    ```bash

    ~$ sudo passwd swayam

    ```

    ```


    A successful execution of the above command prompts the user to type the password
    twice.


    The **useradd** command determines the default values for new accounts by reading
    the **/etc/login.defs** and **/etc/default/useradd** files. You can modify these
    default values by editing the files manually with any text editor. It needs be
    noted here that login.defs is different on different Linux systems. Some of the
    parameters that can be configured in **/etc/login.defs** file are given here.


    +   * PASS_MAX_DAYS

    +   * PASS_MIN_DAYS

    +   * PASS_MIN_LEN

    +   * PASS_WARN_AGE


    Please note that all uncommented lines in **/etc/login.defs** file contain a keyword
    / value pair. As an example, the keyword **PASS_MIN_LEN** is followed by some
    white space and the value 5. This tells the useradd command that the user password
    must be at least five characters. You can refer to the **/etc/default/useradd**
    file in order to view the other default settings. You can also see the default
    settings by using the command useradd with the -D option.


    You can also use the -D option to change the default settings. In order to do
    this, give the -D option first and then add the defaults you want to set. For
    example, to set the default home directory location to /home/swayam, for example,
    you can use the following command.


    ```

    ```bash

    ~$ useradd -D -b /home/swayam

    ```

    ```


    In addition to setting up user defaults, an administrator can also create default
    files that are copied to each user’s home directory for use. These files typically
    include login scripts and the shell configuration files.


    Let’s take a look at another useful command — **usermod** — that can be used to
    modify the settings for an existing account. This command provides a straightforward
    method for changing the account parameters. Many of the options available with'
