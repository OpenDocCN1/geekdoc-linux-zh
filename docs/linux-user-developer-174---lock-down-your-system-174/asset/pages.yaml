- pgno: 20
  md: '# # WATCH LIVE TRAFFIC AND DATA WITH WIRESHARK


    The definitive network protocol analyser


    Wireshark is one of the best-known network analysis tools. It is capable of analysing
    live traffic as well as data captured to the disk. Wireshark can be launched from
    the Sniffing and Spoofing category in the Applications menu in Kali Linux.


    Wireshark has many uses. Chief among these is, should malware make it onto your
    network, you will be able to analyse malicious files as they enter and also find
    what data (if any) was successfully stolen.


    At first the display can seem very garbled, as it will show all data packets.
    Click the filter bar at the top to pare this down. To start, enter http.request.full_uri
    to see HTTP requests.


    Filter displays can be dischained; for example: `http.request.full_uri || ssl.handshake.certificate
    || dns`


    If you regularly use the same search criteria, go to the Analyze\Filter Display
    Macros menu to set up a shortcut. For a full list of display filters, visit www.wireshark.org/docs/dfref.
    Right-click any packets of interest and choose Follow>TCP stream to find out more.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_20_0.png)


    Go to File>Save As to choose which packets to save and in what format. These can
    be opened later in Wireshark and other tools such as Kismet (featured later) for
    analysis.


    The full user guide for Wireshark is available as a PDF from: www.wireshark.org/download/docs/user-guide-3.4.pdf


    # # PREVENT MALWARE FORWARDING WITH CLAMAV


    Check individual files or multiple emails with this powerful antivirus scanner


    Although Linux systems cannot be affected by Windows malware, by default they
    will happily forward on malicious files via internet or USB to more vulnerable
    machines.


    ClamAV is an excellent FOSS (free and open source software) antivirus software
    toolkit. Its database is updated once every few hours and its detection rate beats
    that of many commercial scanners.


    In Kali, run: `apt-get install clamav clamav-update clamdscan clamav-daemon`


    ...to install the necessary files. You can use the command freshclam to update
    the virus database manually, but it''s far better to schedule this as a cron job.
    Run the command:


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_20_1.png)


    ```

    `clamdscan -r <filename>`

    ```


    ...to scan individual files or folders. The ClamAV daemon will launch automatically
    once installed, but is not a real-time scanner in that it will not check files
    as they are written. The application ClamFS, however, can be used to automate
    checks of folders such as Downloads. Visit clamfs.sourceforge.net for more information.


    ClamAV is most commonly used on mail servers running Postfix to prevent the sending
    of malware and phishing emails through installing the additional program ClamSMTP.
    After installation, the ClamAV config files need to be updated to reflect the
    ports used by PostFix. This is to make sure all mail is scanned. Visit the developer
    page at theclavier.tetof.software/clamsmtp for full instructions.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Feature


    # Lock down your system


    # STAY BEHIND UFW


    Protect your ports with a few quick commands


    Ufw (Uncomplicated Firewall) and its graphical companion Gufw serve as front-ends
    for the iptables firewall that is standard in most distributions of Linux.


    Run the following command:


    ```

    apt-get install ufw gufw

    ```


    ...in Kali to explore further.


    Gufw is self-explanatory and comes with a switch to enable the firewall, and wizards
    to block or allow certain ports. There are even preset configurations to allow
    certain applications and games such as Call of Duty. The command-line version
    is almost as easy to use. Run:


    ```

    ufw enable

    ```


    Then to check firewall status, run:


    ```

    ufw status verbose

    ```


    By default, all outgoing connections are enabled and all incoming are disabled.
    You can enable connections with a single command citing the port and protocol.
    For example, if running a Minecraft server, allow incoming TCP traffic with:


    ```

    ufw allow 25565/tcp

    ```


    Services such as SSH follow the following syntax:


    ```

    ufw allow ssh

    ```


    To disable ports or services, replace ‘allow’ with ‘deny’.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_21_0.png)


    Ufw comes pre-installed on Ubuntu and certain other Debian-based distros, but
    is not ideal for RPM-based ones.


    For a true cross-platform solution, consider running a dedicated firewall distro
    such as IPFire (featured later).


    > Sparta will ask you to specify a range of IP addresses to scan. Once the scan
    is complete, Sparta will identify any machines, as well as any open ports or running
    services


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_21_1.png)


    # ANALYSE APPS WITH BURP SUITE


    Lock down your web applications


    Burp Suite is an integrated platform for analysing and attacking web applications.
    The free version, which comes pre-installed in Kali, is likely to meet most admins''
    needs.


    Burp Suite contains an intercepting proxy, which you run on startup on port 8080.
    This allows you to scan any browser traffic through it for analysis. Make a request
    in your web app for the proxy to intercept it. Head over to the Target tab if
    you wish to view a site map.


    From inside the Target tab, find your web application and then right-click one
    of your nodes. Select the ‘spider from here’ option to make sure there are no
    links to sensitive resources like databases that hackers might be able to exploit.


    Back in the Proxy tab, click the Action button, then Send to Intruder to pass
    intercepted traffic to Burp Suite Intruder. This allows you to automate an attack
    against one of your web applications, such as trying to brute-force a user''s
    password.


    Click the Intruder tab and then Positions to configure the request template as
    well as the attack type. The Payloads tab allows you to choose specific payload
    sets. Click the Start Attack button when ready.


    For a complete rundown of all Burp Suite''s features, visit the Developer''s support
    site at portswigger.net/burp/help.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# # TEST YOUR NETWORK WITH SPARTA


    A handy Python GUI for nmap and hydra – this is Sparta


    Sparta, which comes pre-installed in Kali, serves as a front-end for the awesome
    nmap and Nkto tools among others, making network enumeration much easier.


    Upon launch, Sparta will ask you to specify a range of IP addresses to scan. Once
    the scan is complete, Sparta will identify any machines, as well as any open ports
    or running services. Where possible, it will also list the OS in the information
    tab.


    If ports 80 or 443 are open, Sparta will also have Nkto run a scan. Nkto essentially
    checks server software to make sure it''s up to date, as well as ensuring that
    there are no potentially harmful files or programs. Use the Nkto tab to view the
    results and the Notes tab to record


    our progress,


    Sparta also incorporates the ‘hydra’ tool, which can be used to brute-force remote
    authentication services such as SSH. Besides specifying the IP, port and service
    of the remote host, you’ll need to link to a password list. Kali


    includes the ‘rockyou’ list containing thousands of the most commonly used passwords.
    If you want to test Sparta safely, consider using the Metasploitable virtual machine
    (featured later), which intentionally includes vulnerabilities.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_22_0.png)


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_22_1.png)


    # 01  Add hosts


    Launch Sparta in Kali by going to Applications>02  Vulnerability  Analysis>Sparta.
    When the window launches, select ‘Click here to add host(s)’ to scope. A pop-up
    will appear asking you to specify an IP range. You can add a single IP address
    or you already know the host you wish to scan or specify an entire subnet, for
    example 192.168.1.0/24. Click Add to Scope to begin the scan. If you''re checking
    several hosts, right-click each as you go and select Mark as Checked to omit them
    from future scans.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_22_2.png)


    # 02  Gather host information


    Hosts are listed in the left-hand pane. Click on each to see open ports in the
    Services tab. The layout is very clear. Numbered ports are listed under Port and
    the type of service in question such as SSH or FTP is listed under Name. Use the
    information tab to see the total number of open ports. Sparta also uses DS Fingerprinting
    to determine the host''s operating system, but this is not always accurate. Use
    the Notes tab at this stage to record any observations you''ve made so far.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_22_3.png)


    # 03  Check Nkto scan


    This step is optional but recommended. Nkto will automatically scan ports 80 or
    443 if it finds them open. Click on the Nkto tab to see the results of the scan.
    The results can be quite convoluted so it pays to break them down by section.
    The ‘SSL info’ section in the screenshot, for instance, shows that the default
    HTTPS certificate used in devices running Broadcom firmware is installed. This
    certificate is installed on over 480,000 devices so needs to be updated. Other
    alerts such as ‘No CGI Directories found’ are more self-explanatory. Some may
    be prefixed with OSVDB- followed by a number. These are Open Source Vulnerability
    Database designations. Search osvdb.org for further information on individual
    vulnerabilities.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_22_4.png)


    # 04  Select service to brute-force


    you wish to test the strength of passwords on a remote host, click on the Services
    tab and then right-click on the name of the service you wish to attack, such as
    SSH. Click ‘Send to Brute’ to specify the IP, port and service you wish to crack.
    Next, click on the Brute tab and check these are correct.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_22_5.png)


    # 05  Prepare your brute-force attack


    Once you have clicked on the Brute tab, examine the default options. These are
    checked so hydra will look for obvious vulnerabilities such as a blank password
    or a password that''s identical to a username. Below this, you can specify a username
    and/or password manually or choose from a list. Click the Browse button to view
    the /usr/share/wordlists folder. Extract rockyou.txt.gz to try some of the most
    common passwords. Alternatively, use the password list from John the Ripper located
    in /usr/share/john/password.lst or search this list online.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_22_6.png)


    # 06  Launch the brute-force attack


    Click Run to begin force-forcing the password of your chosen host. Pay careful
    attention to the warning message in the pane below; you have not specified a username
    or password, this will display bruts.


    The Threads option on the top-right limits the number of parallel tasks hydra
    will try to carry out. If you are connecting via SSH, Sparta will warn you that
    servers usually support a maximum of four. Click Stop at any time to reconfigure
    before launching the attack again.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# USE THE METASPLOIT FRAMEWORK


    Test your server against thousands of exploits


    The free version of MetaSploit Framework (often shortened to ''msf'') is bundled
    with Kali Linux. Msf is an open source framework for identifying vulnerabilities
    as well as developing and running exploit code.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_23_0.png)


    Kali also comes with the excellent program arrimatte, which serves as a GUI for
    msf. The commercial versions also have a web GUI, but when taking your first tentative
    steps with the framework, the command-line utility is less overwhelming.


    Rapid7, the developer of msf, has also created MetaExploitable 2, a virtual machine
    which intentionally contains a number of vulnerabilities that can be exploited
    by msf, which you can use for the purposes of this tutorial.


    Kali has a built-in command-line tool, nmap, which can be accessed from within
    msf once a vulnerable port/service has been detected. For a more visually appealing,
    categorised view, visit Offensive Security''s online exploit database: www.exploit-db.com.


    The final step is to run the exploit to discover whether your server is vulnerable
    to this particular attack. Msf will inform you one way or the other and save the
    results to its database.


    Once the exploit has been loaded, you can configure it further with the command
    show options.


    +   **01**

    +   Launch MetaSploit Framework


    Launch msf from within Kali by clicking Applications>Exploitation Tools>Metasploit.
    As with other security tools, you may find msf in more than one category as it
    can be used in various ways. If you are using the MetaExploitable 2 virtual machine
    in Virtualbox, which is highly recommended, make sure to create a host-only network
    to which both the Kali and MetaExploitable machine are connected. This will prevent
    either machine from connecting to the real network or the internet.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_23_1.png)


    > > "Run the exploit to see if your server is vulnerable to this particular attack.
    Msf will inform you one way or another"


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_23_2.png)


    +   **02**

    +   Identify remote hosts


    This step simply involves identifying the remote host you wish to exploit through
    the use of nmap. If you wish, you can use nmap''s GUI to do this. Alternatively,
    you can use nmap from the msf command line in the following format:


    For instance:


    ```

    nmap -v 192.168.56.102

    ```


    If you wish to scan an entire subnet, use the \*\* wildcard. For example:


    ```

    nmap -v 192.168.0.*

    ```


    ```

    nmap -v address

    ```'
  merge: -1
