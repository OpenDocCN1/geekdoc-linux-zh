    # Sam Grange


    When you''re coming from a Windows background it does seem counter-intuitive to
    deliberately avoid the user account that offers you the maximum amount of control,
    but there''s a very good reason that lots of Linux professionals do so: security.
    The root account is literally allowed control over everything in a Linux system,
    which sounds like a good idea but in practice means that other users of the computer
    (for example, co-workers on a corporate machine or your kids at home) have the
    opportunity to launch commands that you''re not aware of. Running a command with
    sudo (or multiple commands with su) means that you can take advantage of all the
    power of root when you need to, but that you''re not leaving the shell open, blindly
    set to root privileges – you need to reassert that you have super user access
    with sudo or su each time. This minimises the risk of unwanted, irregular or just
    plain wrong commands being run as root and causing errors on your system. Security
    isn''t just about protecting yourself, your machine and your data from hackers
    – it''s also about protecting it against accidental misuse.


