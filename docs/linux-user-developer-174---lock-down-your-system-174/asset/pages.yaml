    \ server configuration. We have used the path, /var/www/munin.\n\nNext, look for\
    \ the first host tree. It defines how to access and monitor the host machine.\
    \ It should read:\n\n```\n```\n[localhost.localhost]\naddress 127.0.0.1\nuse_node_name\
    \ yes\n```\n\n```\n\nChange the name of that tree to one that uniquely identifies\
    \ the server. This is the name that will be displayed in the Munin web interface.\
    \ Then, you'll need to add all the nodes you'd like to monitor in one of these\
    \ formats. For example, add a node's IPv4 address using this format:\n\n```\n\
    ```\n[node.example.com]\naddress 192.0.2.4\n```\n\n```\n\nIf you have DNS configured,\
    \ you can also use the FQDN of the node instead of its IP address.\n\n```\n```\n\
    [node2.example.com]\naddress node2.example.com\n```\n\n```\n\nMunin also supports\
