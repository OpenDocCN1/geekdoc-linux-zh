    ![](img/1f330653f83dcf0397f7d224ce8bbc16_67_1.png)


    # **Motion tracking**


    To help get the controller tracking in place, David had to use Tkinter. The app
    he made enabled David to factor in both the movement and speed of the controller,
    with different sounds achievable based on certain combinations of these factors


    # **Trigger support**


    To get three sounds on each controller, David had to use the triggers as the primary
    component for the third sound. The pressing of the trigger, along with a specific
    motion of the controller, helps give off the sound of a cymbal or extra drum


    # **Response time**


    One of the key factors about the project was to make sure that the sound response
    time was kept to a minimum. The Raspberry Pi 3 proved to be the perfect fit here,
    helping turn motion and triggers from the controllers into one of the implemented
    drum sounds


    # **Controller compatibility**


    David detailed that getting two controllers two work simultaneously was one of
    the biggest issues. He instead had to do some heavy tinkering with each controller''s
    MAC addresses to get them both working with the Pi, but also in tandem with one
    another


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_67_2.png)


    **Right** Both motion and speed are tracked directly by the Pi unit, which helps
    to then trigger the drum and cymbal sounds achieved by the controllers

    **Below** The project started from David’s purchase of a Silverlit Air Drum Kit,
    which was heavily modified for compatibility with the Raspberry Pi unit


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_67_3.png)


    # ### Components list


    +   - Raspberry Pi 3

    +   - Nintendo Wii controllers

    +   - Silverlit Air Drum Kit

    +   - Python cvvid library

    +   - Tkinter

    +   - Open-source drum samples'
