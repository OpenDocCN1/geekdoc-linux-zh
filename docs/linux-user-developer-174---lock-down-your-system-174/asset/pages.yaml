    # ## Privacy please


    Dear Linux User,


    It strikes me that, given the recent introduction of the so-called ''Snooper''s
    Charter'' in the UK, the frankly ridiculous data breaches at Yahoo et al, and
    the constant news stories surrounding hackers, you would talk more about how ordinary
    users can protect our private data from those who want to get their hands on it.
    Nice shiny versions of Linux like Apricity and elementary, as featured in your
    recent issue, are all very well, but can they stand up to a dedicated mischief-maker
    or state actor? I think not. Some guidance on Linux versions that can would be
    very much appreciated, not only by myself and others who are worried about our
    financial and data security, but for those in places where Big Brother''s watchful
    eye is a very real and present threat.


    Colin Farnwig


    Computer security has rarely been out of the news lately, which is why we decided
    to take an in-depth look at InfoSec this issue! But while our feature is packed
    with ways to lock down and test systems and networks, it''s geared more towards
    the sysadmins of the world and less to home users, who may not have either the
    time or the inclination to watch over logs and pen-test their own security strategies.
    Happily, there are some very good Linux distros out there that concentrate on
    privacy – the reason that we don''t include them on our disc is that, for maximum
    security, you are better off downloading and checking them yourself before installation.
    Tails (http://tails.boum.org/) is the most well known privacy-focused distro,
    Qubes OS (https://www.qubes-os.org/) is another – Edward Snowden apparently swears
    by it. MOFO Linux (http://mofolinux.com/) meanwhile, is especially designed to
    counteract state surveillance and censorship, for those in countries where this
    is a concern. The good thing about the latter is that it''s Ubuntu-based, so it
    works smoothly and offers an easy learning curve, making it suitable for those
    who aren''t technically adept but still need to protect their privacy.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_93_1.png)


    Above Make sure that you are the only one in full control by using sudo and su
    instead of root wherever possible


