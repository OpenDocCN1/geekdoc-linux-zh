  md: "# Tutoriel\n\n# Make Raspberry Pi-based warrant canary\n\nProtect yourself\
    \ from Orwellian gagging orders and secret warrants with your own warrant canary\n\
    \n![](img/1f330653f83dcf0397f7d224ce8bbc16_75_0.png)\n\nNate Drake  \n(@natewriter)\
    \ is a freelance tech journalist specialising in cyber security. He decided to\
    \ use Twitter for his own warrant canary after watching hours of cartoons.\n\n\
    ![](img/1f330653f83dcf0397f7d224ce8bbc16_75_1.png)\n\nThe warrant canary borrows\
    \ its name from the unfortunate bird that was taken down mine shafts. It’s a reaction\
    \ against secret requests to obtain customer’s personal data. For example, when\
    \ a court order is served on a business, its owners are forbidden from alerting\
    \ users that their data has been compromised. Warrant canaries cleverly slalom\
    \ around this legal hurdle through regularly making a statement that they have\
    \ not been subject to such a request. If they switch off their warrant canary,\
    \ as Reddit did in March 2016, users will know that an external agency also has\
    \ access to the data a company stores about them. The legal ramifications of this\
    \ are complex and depend on where you are in the world; this tutorial is an exercise\
    \ in proof-of-concept only.\n\nFor this tutorial, we will use the Raspberry Pi\
    \ along with a dedicated Twitter bot to build your own warrant canary.\n\n‘personal\
    \ website’, enter the URL of your Twitter channel. Tick to say you’ve read and\
    \ agreed to the developer agreement then click Create your Twitter Application.\n\
    \n![](img/1f330653f83dcf0397f7d224ce8bbc16_75_2.png)\n\nLeft  If possible leave\
    \ this page open, as you’ll need the API Keys and Access Tokens shortly\n\n+ \
    \  03  **Create your Access Token**\n+   Click on Keys and Access Tokens. Make\
    \ a note of your API keys. Next, scroll to Token Actions and click Create My Access\
    \ Token. Write down the Access Token and the Access Token secret. Your Raspberry\
    \ Pi will need this information in order to be able to connect securely to Twitter\
    \ later.\n\n+   What you’ll need\n+   Suitable for all models of Raspberry Pi\n\
    \n![](img/1f330653f83dcf0397f7d224ce8bbc16_75_3.png)\n\nLeft  Fill in a valid\
    \ e-mail address and phone number to create a new account\n\n+   01  **Create\
    \ a Twitter account**\n+   Head to Twitter.com and create a new Twitter account.\
    \ You will need a valid e-mail address and mobile phone number. If you already\
    \ have a Twitter account, make sure to add a phone number, as this is required\
    \ in order to use a Twitter bot. See https://support.twitter.com/articles/110250#\
    \ for help with this.\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_75_4.png)\n\n\
    Left  Fill in Name, Description and Website. The other fields can be left blank\n\
    \n+   02  **Create the application**\n+   Once your account is set up, go to http://apps.twitter.com\
    \ on any device and click Create New Application to begin setting up a dedicated\
    \ bot for your warrant canary.\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_75_5.png)\n\
    \nLeft  Click Edit Profile to amend your details. Confirm your e-mail address\
    \ before proceeding\n\n+   04.  **Tweak profile**\n+   Optionally at this stage\
    \ you can choose to delete your mobile phone number from Twitter: It is only required\
    \ once in order to deter spammers. Feel free at this stage to add a profile picture\
    \ to your account and update the bio to explain what your warrant canary is for.\n\
    \n# BEST PRACTICES\n\nTwitter has strict safeguards against spam bots. This is\
    \ why it requires accounts using Applications to be verified by SMS. You may notice\
    \ when testing your script that Twitter will also not allow duplicate statuses.\
    \ Make sure that your tweets are well spaced apart. The above tutorial will have\
    \ your Pi’s canary tweet every day at midnight. If you need them to be closer\
    \ together the raspberrypi.org website has some tips on using Twython to post\
    \ messages at random from a list."
  merge: -1
  img_proc: true
