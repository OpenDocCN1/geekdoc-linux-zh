  md: '![](img/1f330653f83dcf0397f7d224ce8bbc16_8_0.png)


    # TOP FIVE


    # Best distros for ethical hacking practices


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_8_1.png)


    # 1 Kali Linux


    Although it flies under the radar, Kali Linux comes with over 600+ pre-installed
    pen testing tools that mostly enhance your security toolbox. Tools are highly
    flexible and many are being updated regularly. Best of all, they can be easily
    implemented into different platforms, including both ARM and VMware.


    # 2 Pentoo Linux


    Based on Gentoo, Pentoo can be clearly used on top of any existing Sentinel installation.
    Its array of tools vary from exploits to database scanners, equipping you with
    everything you need to put your security to the test.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_8_2.png)


    # 3 Parrot Security OS


    One of the best things about Parrot is just how lightweight it is, making it a
    viable choice for those running old or slow hardware. It doesn''t ramp up on features,
    however, and you''ll have to find every penetration tool you could possibly need.


    # 4 DEFT Linux


    As far as digital forensics go, you can''t look past DEFT Linux. It comes with
    a staggering amount of forensic tools, which are particularly tailored for penetration
    testers. It''s also based on Ubuntu, which helps with its customisation.


    # 5 Caine


    Caine is the best on the list when it comes to combining everyday distro applications,
    such as a browser and email client, with a highly complex forensic suite. It performs
    both functions well and can be run from either a cd or hard disk.


    # DEVELOPMENT


    # Compiling code just got easier


    The Red Hat Developer Toolset gets a major update


    Getting that combination of stable operating system with the latest development
    tools is never an easy feat, so it''s testament to Red Hat''s endeavours that
    its Developer Toolset is reaching its sixth major update. For those unaware, the
    Red Hat Developer Toolset''s primary aim is to help streamline application development
    by enabling developers to get hands on with the latest open-source C++ and C compilers
    profiling tools.


    Through these tools, developers can then compile applications and deploy them
    across multiple versions of Red Hat Enterprise Linux. A key part of this sixth
    update is its expansion into even more architectures. These include Red Hat Enterprise
    Linux on x86 systems, RHEL for z systems and the ARM Developer Preview of RHEL
    as well.


    Avid users will find new tools and updates to take advantage of that form the
    basis of the Developer Toolset and subsequent Red Hat Software Collection. The
    likes of PHP, Python, Ruby and MongoDB have all seen significant updates, while
    Git 2.9, the open-source version control system, makes its debut in the toolset.


    Other new additions include the appearance of the Redis 3.2 and MySQL 5.7 open-source
    databases, as well as a new JVM monitoring tool in Thermostat 16. Eagle-eyed users
    will also find included the latest stable version of Eclipse Neon, an ideal solution
    for those interested in the latest tools within the Eclipse integrated development
    environment.


    Toolset-specific updates are also in abundance in order to really take this toolkit
    above and beyond what the competition offers. Both the GNU Compiler Collection
    and GNU Project Debugger have been updated to their latest versions, while numerous
    toolchain components and performance tools, namely Dyninst and Valgrind, have
    both been enhanced.


    In its current state, the toolset is available to all members of the Red Hat Developer
    Program, as well as those who currently have a select RHEL subscription. Later
    this year, a free RHEL developer subscription will also be included to those who
    have yet to make the plunge, but at the time of writing, it''s unknown what sort
    of terms this will be available under.'
