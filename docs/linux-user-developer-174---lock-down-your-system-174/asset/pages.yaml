    > “

    > **How long has Guinnux been in development for? Where did the original idea
    for it come from?**


    Guinnux started in 2010 as a buildroot project. We soon realised the similarities
    between embedded installations and Linux server deployment in terms of their requirements
    and that it needed to be predominantly unattended. On top of that, we aimed to
    help promote a structured development environment. That’s where many of Guinnux’s
    aims were created.


    Furthermore, buildroot was not flexible enough to move away from uClibc and to
    deploy new solutions on top of existing frameworks. Deploying


    now images instead of staged updates to sites is not viable when you have hundreds
    and thousands of sites. As you can imagine, keeping all of this development and
    the runtime environment in sync ended up becoming a full-time job. Since then,
    we’ve been able to enhance and build upon the principles that Guinnux was based
    on to the project and distribution you see today.


    **For our readers who may be unaware of the Guinnux distribution, could you give
    us an overview of what it is and its key features?**

    Keystone Electronic Solutions’ enterprise embedded Linux – dubbed Guinnux – is
