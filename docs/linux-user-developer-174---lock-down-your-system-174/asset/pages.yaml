    **HARDWARE**


    # Solwise PL-1200AV2-PIGGY


    Faster and more reliable than Wi-Fi, this advanced Powerline adaptor is ideal
    for 4K streaming


    **Price**

    E47 each


    **Website**

    www.solwise.co.uk


    **Specs**

    Qualcomm Atheros QCA7500 chipset

    Pass-through socket with noise filter

    28-bit AES Link Encryption


    Home networks are facing growing demands as 4K media streaming home servers, games
    consoles and an ever-increasing number of internet-connected devices become commonplace,
    while our walls stay as thick as ever. While AC Wi-Fi routers offer one way to
    bolster signal, and Ethernet cables are there for those that want to snake cables
    through their houses, Powerline adaptors offer a third way. For those unfamiliar
    with Powerline (also known as HomePlug), this technology turns your home''s electrical
    wiring into a network, transmitting data packets through the higher frequencies
    your wires support and your 50/60Hz


    electrical power isn''t using, Solwise''s PL-1200AV2-PIGGY Powerline adaptor is
    up there, promising Gigabit speeds with transfer rates up to 1200Mbps. During
    our speed tests, we found the adaptor didn''t quite live up to these grand claims,
    but still managed to trounce our home Wi-Fi, with setup that couldn''t be simpler.


    The PL-1200AV2 uses the latest Qualcomm Atheros QCA7500 chipset, designed specifically
    for Powerlines, and offers enhanced processing power, employing MIMO (multiple
    input multiple output), which offers eight spatial streams, the same as an AC
    router. This means it has much more spectral bandwidth to play around with, which


    86'
