  md: '# **OpenSource**




    ![](img/1f330653f83dcf0397f7d224ce8bbc16_7_0.png)


    # RASPBERRY PI

    Raspberry Pi gets a

    serious speed boost


    Connectivity improvements could usher

    in a new wave of IoT developments


    We all know that the Raspberry Pi has long been heralded as the best single board
    computer made for public use, partially due to the continuous updates that have
    been implemented into it and its wallet-friendly price tag. One of the caveats,
    however, has long been its reliance on Wi-Fi connectivity, a specific problem
    for those looking to start developing for the Internet of Things. However, in
    a recent update, it has been announced that Raspberry Pi 3 owners will soon even
    be able to take full advantage of LTE connectivity on their units. It will soon
    be able to handle low-throughput cellular communications, a massive boost for
    development practices.


    > “Raspberry Pi 3 owners will soon even be able to take full advantage of LTE
    connectivity”


    Developing the chipset is Altair Semiconductor, previously known for its developments
    in LTE chipsets, many of which have been implemented into everyday items. “We
    are dedicated to providing low-cost, high-performance computers to connect people,
    enable them to learn, solve problems and have fun,” said Eben Upton, CEO of Raspberry
    Pi (Trading) Ltd. “Altair has long been regarded as an LTE connectivity leader,
    and we are pleased to collaborate on this trial, which is the first of its kind.
    Users will only benefit by having the choice of using BT, Wi-Fi or LTE.”


    Due to the limitations involved with Wi-Fi networks, the addition of Altair’s
    LTE chipset should help provide wider and more flexible coverage. When implemented
    correctly, users will be able to stream high-definition video from anywhere, while
    also establishing connections with other applications and home automation products.
    The new chipset features downlink speeds of up to 10Mbps and offers extremely
    low power consumption, which blends in well with the Pi’s low-resource demands.
    It’s also completely software upgradable, with updates expected to help bridge
    the connection between Pi and IoT devices even further. Also touted to be showcased
    in the chipset will be an advanced power management unit, a low power CPU subsystem
    and integrated DDR memory with a strong security framework. “The integration of
    Altair’s LTE chipset with Raspberry Pi makes it one of the most portable, affordable,
    and practical connectivity solutions on the market,” said Eran Eshed, co-founder
    and VP of worldwide sales and marketing at Altair. “More than 10 million Raspberry
    Pis have now been sold to date, and we’re pleased to debut this proof-of-concept
    to extend its range and value.”


    The integration of the chipset is said to be a gradual process, but if history
    is anything to go by, we can expect all units to have the chip with this option
    likely available in the first half of 2017. It’s likely we’ll also see the development
    of LTE brought forwards into all future models of the Raspberry Pi. If you’re
    not one of the 10 million owners of a Pi unit, you can head across to www.raspberrypi.org
    for all pricing and shopping options.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_7_1.png)


    *Above: LTE connectivity will soon be a major part of the Pi*'
