  md: '# In brief: compare and contrast our verdicts


    | | Midori | Chrome | Firefox | QupZilla |

    | --- | --- | --- | --- | --- |

    | Browser design | A crisp and clean design carries through well on a host of
    Linux distributions | 9 | Minimal from the outset, but overly complicated when
    digging through the settings | 7 | Its design is a little different from the rest,
    which can take a little time to get accustomed to | 6 | A blend of famous browser
    features gives QupZilla a good look overall | 7 |

    | Web performance | Capable of fast loading times thanks to its lightweight build
    qualities | 9 | Deals with any task with consummate ease, especially older websites
    that lack advanced code | 9 | While integrating files into Firefox is simple,
    it can feel a little sluggish from time to time | 6 | Browsing speeds are fast,
    as long as you avoid the slowdown-ridden custom themes | 8 |

    | Management settings | Tailored for privacy, but lacking in core browser security
    for the most part | 7 | Chrome sports one of the best bookmark and history management
    windows out there | 8 | Settings are more refined than other browsers, with only
    the best options showcased | 9 | QupZilla unifies your bookmarks, RSS feed and
    web history in one manageable menu | 8 |

    | Plugins and extras | Lacking in certain options, but a built-in downloader is
    a great added bonus | 7 | Hundreds of experimental features are on hand so you
    can experiment with Chrome''s capabilities | 10 | A handy Privacy Browsing and
    Tracking Protection combo is a particular highlight | 8 | Integrated ad-blocking
    software is useful, but you can find extensions that are better | 6 |

    | Overall | A few omissions here and there, but this is the closest Chrome beater
    we''ve found | 8 | The gap between Chrome and other browsers is getting smaller,
    but it''s still the king here | 9 | Firefox is a solid alternative to Chrome,
    but we do prefer what Midori offers | 7 | A functional browser that''s missing
    the wow factor that other browsers have | 7 |


    # AND THE WINNER IS...


    # Chrome


    Yes, Chrome is still the best browser around, but it''s nowhere near as superior
    as it once was.


    One of the best things about doing this group test was being able to see first-hand
    how major developments in opposing browsers is quickly closing the gap on Google''s
    juggernaut. Midori was a particular highlight, offering a relatively minimal take
    on the browsing experience, while still boasting an impressive suite of features
    and quick loading times. We''d love to revisit this group in six months and see
    if anything has changed.


    As it stands, Chrome still sits at the top of the pile. While its core browsing
    experience isn''t anything out of this world, it''s the embedded extras that really
    set it apart. For one, the Chrome Web Store has come on leaps and bounds in recent
    years, with thousands of extensions now available for users to expand on their
    Chrome experience. Best of all, many of these are completely free and offer quick
    links to some of your most used apps.


    Similarly, for budding tinkerers out there, the experimental features menu remains
    a hidden treasure trove. While many of these features aren''t yet ready for public
    consumption, some can be integrated into the browser with absolute ease.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_83_0.png)


    # Implement extensions to improve and expand on your current Chrome experience


    What''s even better is that some of these can be edited and tailored to your own
    Chrome download, so the choice is really down to you.


    Chrome has held off against some stiff competition in its time, and it''s testament
    to the continued support from Google that it remains at the top. Frequent updates
    are helping plug any holes, while a growing community is helping to provide instant
    feedback and bug reports when needed. Midori is a worthy runner-up, but it''ll
    take some doing to dethrone the king.


    Oliver Hill'
