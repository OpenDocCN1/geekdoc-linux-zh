  md: '![](img/1f330653f83dcf0397f7d224ce8bbc16_5_0.png)


    # On your free DVD this issue


    Find out what’s on your free disc


    Welcome to the Linux User & Developer DVD. This issue we’re all about InfoSec
    as we help you to test your security, lock down your systems and networks, and
    even explore a deliberately vulnerable VM to learn more about threats and how
    to counter them. Inside our two living distros you’ll also be able to access all
    the FOSS that our InfoSec feature and keep your systems and data completely watertight.


    **Load DVD**


    To access software and tutorial files, simply insert the disc into your computer
    and double-click ‘InfoSec’.


    # Featured software:


    **Live boot**


    To live-boot into the distros supplied on this disc, insert the disc into your
    disc drive and reboot your computer.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_5_1.png)


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_5_2.png)


    **Kali Linux**


    The ultimate security testing distro for Linux users will help you to make your
    system and network watertight. Use it to assess the software in our InfoSec feature
    and to test your systems and networks for the ultimate in secure computing. Please
    note that the default login for the live boot edition of Kali Linux is username:
    root; password: toor.


    **IPFire**


    A professional and hardened Linux firewall distribution that is secure, easy to
    operate and has great functionality. Please note that you will need to install
    IPFire from the live boot distro and, so ensure that you have backed up all of
    your data and partitioned your drive before installing, to avoid losing any of
    your information or partitions.


    **Please note:**


    *   You will need to ensure that your computer is set up to boot from disc (press
    F9 on your computer’s BIOS screen to change Boot Options).

    *   Some computers require you to press a key to enable booting from disc – check
    your manual or the manufacturer’s website to find out if this is the case on your
    PC.

    *   Live-booting distros are read from the disc; they will not be installed permanently
    on your computer unless you choose to do so.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_5_3.png)


    # For best results:


    This disc has been optimised for modern browsers capable of rendering recent updates
    to the HTML and CSS3 standards. So to get the best experience we recommend you
    use:


    *   Internet Explorer 8 or higher

    *   Firefox 3.x or higher

    *   Safari 4 or higher

    *   Chrome 5 or higher


    **Metasploitable**


    Metasploitable is an intentionally-vulnerable Linux virtual machine. This VM can
    be used to conduct security training, test security tools, and practise common
    penetration testing techniques. As it is deliberately insecure, please make sure
    that you don’t store any of your sensitive or personal data on a partition or
    VM running Metasploitable.


    # Problems with the disc?


    Send us an email at lnxuser@ imagine-publishing.co.uk Please note however that
    if you have had problems using the program or resource we provided, then please
    contact the relevant software companies.'
