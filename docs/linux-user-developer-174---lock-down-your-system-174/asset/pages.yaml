- pgno: 57
  md: '# # SECRETS


    of


    # PI INTERFACING


    *Learn how to design simple electronic circuits to interface your Raspberry Pi
    to real-world devices*


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_57_0.png)


    Using a single-board computer such as a Raspberry Pi to control real-world devices
    requires two quite different skills. First, you need to be able to churn out code,
    and, second, you need to be able to interface the Pi to external devices. Here
    we look at the second of those areas: and, in particular, investigate how to go
    beyond using off-the-shelf interfaces like HATs, or even building circuits that
    others have designed, by designing your own electronic circuits. Using this hands-on
    guide, you''ll soon be able to connect switches, LEDs and so much more. Here we''ll
    present circuit diagrams, but if you''re not familiar with them, see our earlier
    guide (Linux User & Developer 169), which explained how to turn a circuit diagram
    into a working circuit.


    Our main emphasis is interfacing to the Raspberry Pi, but most of this can also
    be applied to other small computers such as the Arduino, which are also popular
    for control applications.'
  merge: -1
