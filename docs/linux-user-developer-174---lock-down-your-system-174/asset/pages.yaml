  md: '# HIDS


    # Samhain 4.2.0


    Don’t rely on luck to protect your servers - install a host-based intrusion detection
    system


    **Security** - you know you need it, but **something always gets in the way**.
    If you have one, two or a handful of VPSes, and perhaps an internet-facing server
    or two at home - don’t forget to count that Raspberry Pi project - you’ll have
    at least thought about security, probably even have a firewall, and maybe even
    do daily software updates, but you’ll have been far too busy to get serious about
    Intrusion Detection software. Well, stop procrastinating, postponing and procrastinating,
    and take a look at Samhain.


    One of the best host-based intrusion detection systems (HIDS), Samhain sits stealthily
    on your system monitoring packets and detecting file modifications - as well as
    searching for rootkits


    and detecting rogue SUID executables. It can run as a standalone monitor on a
    single server, or monitor multiple hosts, logging centrally - with all logs sent
    signed and encrypted, naturally.


    Packages are in most repositories, but distros may have compiled Samhain without
    a feature you need, so consider downloading the source; Samhain provides instructions
    for checking its integrity. Dependencies are minimal for reasons of security,
    but it makes for an easy compile. The real work starts when you open /etc/samha
    irc in your favourite editor: time to read through the weighty manual. The terse
    man page is a useful guide to many parts of Samhain, including running in stealth
    mode, with config hidden by steganography.


    # Pros


    Powerful and flexible Intrusion Detection System; the only serious rival to OSSEC.


    # Cons


    To get the most from it you’ll have to spend a lot of time reading the comprehensive
    manual.


    # Great for...


    Stock monitoring on your servers and home work[ing] sites


    [ta-samhna.de/samhain/](ta-samhna.de/samhain/)


    # TERMINAL CLIENT


    # iTerm 1.4.1


    Manage all of your remote terminal sessions with iTerm


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_90_0.png)


    If you regularly shell into remote machines, but are not using a tool for transparent
    sessions across networks like MC or Emacs’ TRAMP mode, then you may be fed up
    of dealing with **remembering the log-in details, and the extra work involved
    in file transfers**. Enter iTerm, a terminal emulator based on VTE with plenty
    of features to make your life easier.


    As well as the standard bells and whistles of tabbed sessions, working remotely
    (SSH, sftp, or even telnet) is facilitated by bookmarks, encrypted password saving
    (and authentication by key), and remote file and directory management: X11 forwarding
    can also be carried out over SSH sessions. There are some editing features, and
    plenty of configuration options such as customised mouse behaviour, for those
    with a particular way of working.


    Additionally, users can send the same commands to clusters of remote servers or
    local desktop sessions - which is also an excellent way to step through parts
    of a shell script for careful testing of its effects on your servers. Very useful.
    Fairly regular releases, with attention to bug fixes as well as new features,
    means users can be confident that time invested in this app will not be squandered.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_90_1.png)


    **Above** iTerm takes the pain out of remote working, giving you the best features
    of command line and GUI


    # Pros


    Combines a good basic terminal client with convenient, time-saving features for
    working across networks.


    # Cons


    It’ll never be as powerful as working across machines from Emacs, MC, etc - but
    does it need to be?


    # Great for...


    Anyone who wants to remote session: from VPS to Rhapsberry Pi


    iTerm.sf.net/


