- pgno: 65
  md: '# Feature   Secrets of Pi interfacing


    # EXCEED LIMITS SAFELY


    Interface devices that exceed the GPIO’s maximum voltage or current rating


    Interfacing an output device such as an LED to a GPIO pin requires that the device
    doesn’t require more than 3.3V and it doesn’t draw more than a GPIO pin’s maximum
    16mA current. Devices such as electric motors and blue or white LEDs, that require
    a higher voltage supply and/or draw a higher current, need special treatment.


    The solution is to use a transistor, which can be thought of as an electronic
    switch. A small current from a GPIO pin turns the transistor on or off, thereby
    turning on or off a separate circuit involving a higher voltage and often a higher
    current than a GPIO pin can supply. This secondary circuit might use the 5V on
    the GPIO header as its supply but, if a higher voltage is required or the current
    will be higher than the GPIO header can supply, an external power supply will
    be needed.


    The circuit diagram shows the general configuration. When 3.3V is applied to the
    transistor’s base via the resistor, it will turn on, a condition that you can
    think of as the transistor’s emitter being connected directly to its collector.
    This means that a current can flow from the high voltage supply, through the load
    (ie motor, blue LED etc) to 0V and so the motor will spin or the LED will illuminate.


    Choosing the type of transistor and the value of the resistor is quite an involved
    process, especially since there is such a staggering choice of different transistors.
    While we can’t fully cover this topic here, we can give some


    pointers. First of all, in the circuit shown, the transistor must be of the type
    referred to as an NPN bipolar transistor. Transistors of this type will also be
    defined by their gain and the maximum current and voltage you can use on the emitter-collector
    circuit. Here is where it starts to get involved, but just let’s say that for
    voltages up to 24V and currents up to 250mA (conservative limits), a BC337 would
    be ideal. With this type of transistor and for this current, a 1k resistor would
    be suitable.


    Finally, if your load is a motor or a relay, it is important to wire a diode in
    parallel with the load (cathode to the supply) to suppress reverse currents which
    these components can generate and which could destroy the transistor. A 1N4148
    would be suitable.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_65_0.png)


    # Interface to mains equipment


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_65_1.png)


    Designing circuitry to control mains equipment isn’t difficult but, if something
    goes wrong, you could destroy your Pi or electrocute yourself. There are HATS
    that you can buy for this purpose, but we don’t recommend these either since the
    mains terminals are close to the lower-voltage circuitry. If a wire comes loose,
    therefore, you could set your Pi on fire, blow up a component, firing straight
    into your face, or leave high voltages precariously close to your fingers.


    For this reason, we recommend that you use off-the-shelf interfaces in which the
    only connection to the mains-powered devices is through a domestic-style 13A socket.
    Energenie (energenie4u.co.uk) offers 13A remote-controlled sockets that can be
    used with a radio-controlled handset rather like a TV remote control. Alternatively,
    they can be used with a radio transmitter module, designed for the Pi, which can
    also be obtained from Energenie. A starter kit comprising two sockets and one
    Pi interface costs £21.99 including VAT and delivery.'
