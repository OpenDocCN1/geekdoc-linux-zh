  md: "# Can you use PyGame instead?\n\nfor each image. The following code is an example\
    \ of how you could do this:\n\n```\n```\nimport kivy\nfrom kivy.app import App\n\
    from kivy.uix.image import Image\nfrom kivy.uix.screenmanager import Screen, ScreenManager,\
    \ FadeTransition\nfrom kivy.clock import Clock\n\nclass PhotoFrame(App):\n   \
    \ def __init__(self):\n        super(PhotoFrame, self).__init__()\n        self.screen_manager\
    \ = ScreenManager()\n        self.transition = FadeTransition()\n        self.screens\
    \ = []\n        self.curr_screen = None\n        self.filelist = []\n        self.build_filelist()\n\
    \        self.build_screens()\n        self.screen_manager.add_widget(self.curr_screen,\
    \ 'current')\n        self.root = self.screen_manager\n        Clock.schedule_interval(self.my_callback,\
    \ 2.5)\n\n    def build_filelist(self):\n        # Create the list of files in\
    \ list filelist\n        self.filelist = []\n        for file in os.listdir('images/'):\n\
    \            if file.endswith(('.jpg', '.jpeg', '.png', '.gif')):\n          \
    \      self.filelist.append('images/' + file)\n        self.filelist.sort()\n\n\
    \    def build_screens(self):\n        # Create screens using filelist\n     \
    \   for file in self.filelist:\n            screen = Image(source=file)\n    \
    \        screen.name = file\n            self.screens.append(screen)\n       \
    \     self.screen_manager.add_widget(screen, screen.name)\n        self.curr_screen\
    \ = self.screens[0]\n\n    def my_callback(dt):\n        # Switch to next screen\n\
    \        index = self.screens.index(self.curr_screen)\n        index = (index\
    \ + 1) % len(self.screens)\n        self.curr_screen = self.screens[index]\n \
    \       self.screen_manager.current = self.curr_screen.name\n        self.screen_manager.transition\
    \ = self.transition\n        self.screen_manager.switch_to(self.curr_screen, direction='left')\n\
    \nif __name__ == '__main__':\n    PhotoFrame().run()\n```\n```\n\nAs you can see,\
    \ there is a bit more involved in creating the screens and adding the images than\
    \ in the previous example. When you loop through the list of image files, you\
    \ need to create a new Image widget. You then create a new Screen widget and add\
    \ the Image widget as a child. The last step is that you need to add the new Screen\
    \ widget to the ScreenManager object that was created at the top of the class.\
    \ We reuse the ‘schedule_interval’ method to\n\nhave the screens transitioning\
    \ every 2.5 seconds. The callback function needs to be changed, though. The ScreenManager\
    \ has an attribute, named ‘current’, that identifies which screen is the one being\
    \ displayed. When you change what is identified by the current attribute, the\
    \ two images are changed using the transition method that was defined when you\
    \ created the ScreenManager object. If you are using the latest version of Kivy,\
    \ there is a new method available, called ‘switch_to’. In this case, you don’t\
    \ need to add the Screen objects as widgets to the ScreenManager object. The ‘switch_to’\
    \ method removes the current displayed screen and adds the new screen, applying\
    \ the transition method being used. The version of Kivy available in the Raspberry\
    \ Pi repository is older, so we’ve used the older method for managing screens.\
    \ The previous example used the FadeTransition method to move from one screen\
    \ to another. The other transitions available are, variously, NoTransition, SlideTransition,\
    \ SwapTransition, WipeTransition, FadeToTransition and RiseInTransition. If you\
    \ want to have even more variety in your image display, you can change the transition\
    \ method for each photo by changing the attribute ‘transition’ for the ScreenManager\
    \ object. This code only displays the images, but that isn’t the only thing you\
    \ can do. You could also create an interactive photo frame that you can use to\
    \ manipulate the pictures. If you have a touchscreen as the display, the code\
    \ is written above, you can swipe back and forth to display other images. If you\
    \ remove the ‘Clock.schedule_interval’ command, then the image display will stay\
    \ static unless you swipe to change the image being displayed. Also, there is\
    \ a widget, called ‘Scatter’, that can load the picture into before adding to\
    \ the screen objects. The Scatter class allows you to use multi-touch to rotate\
    \ the image, stretch it or shrink it. This might be handy if you wanted to create\
    \ a photo album application rather than a photo frame display. Hopefully, this\
    \ has sparked some interest in looking at what can be done with such a powerful\
    \ framework.\n\nOf course, Kivy is not the only framework that you could use to\
    \ create this image display. As another example, we will look at how you could\
    \ use PyGame to do a similar job of showing a series of photos on a Raspberry\
    \ Pi display.\n\n```\n```\nimport pygame\npygame.init()\ndisplay_width = 800\n\
    display_height = 600\ngameDisplay = pygame.display.set_mode([display_width, display_height])\n\
    black = (0,0,0)\nwhite = (255, 255, 255)\nclock = pygame.time.Clock()\n# Create\
    \ the filelist image list\ndef img_swap():\n    gameDisplay.blit(filelist[i],\
    \ (0,0))\n    finished = False\n    x = 0\n    while not finished:\n        for\
    \ event in pygame.event.get():\n            if event.type == pygame.QUIT:\n  \
    \              finished = True\n        gameDisplay.blit(white)\n        img_swap()\n\
    \        pygame.display.update()\n        if x == len(filelist)-1:\n         \
    \   x = 0\n        else:\n            x = x+1\n        clock.tick(60)\n    pygame.quit()\n\
    \    quit()\n```\n```\n\nAs you can see, this code is a bit more low-level. The\
    \ commented line is where you would place the code that creates the list, named\
    \ ‘filelist’, that has the filenames for all the pictures that you wanted to use\
    \ as part of the display. To display the image is a two-step process. You first\
    \ need to fill the window with white to essentially erase the currently displayed\
    \ image. Then the function ‘img_swap’ uses the ‘blit’ method to copy the image\
    \ data to the physical display. Again, to keep the code simple, we used (0,0)\
    \ as the origin to start the drawing of the image. But this means that all of\
    \ the images are displayed in the bottom left-hand corner. You would probably\
    \ want to add code to the function in order to figure out the coordinates to use\
    \ as an origin to put your image in the centre of the window. PyGame also has\
    \ a clock object that you can use to trigger the swapping of the images on a regular\
    \ schedule."
