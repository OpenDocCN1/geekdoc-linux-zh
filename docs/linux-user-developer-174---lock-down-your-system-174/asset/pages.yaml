- pgno: 58
  md: '# UNDERSTAND THE PI''S

    # GPIO HARDWARE


    Discover the Pi''s GPIO hardware — its gateway to the real world


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_58_0.png)


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_58_1.png)


    Even if you''ve never connected external devices to your Raspberry Pi, you can''t
    fail to have noticed the double row of 40 pins at the edge of the board (26 pins
    on the early Pis). This is the GPIO header, otherwise known as the general-purpose
    input/ output connector, and it provides a means of interfacing to real-world
    devices. Before starting to think about designing circuits to interface to the
    Pi, therefore, it''s important to understand the basics of the GPIO hardware.


    # POWER AND GROUND PINS


    Although referred to as the GPIO header, not all the pins connect to the GPIO
    hardware. Some of the other pins provide power and ground connections that are
    also used by hardware that''s connected to the header.


    The Pi''s GPIO header has eight ground pins (GND), which you can identify from
    the documentation. Ground is equivalent to the negative side of the power supply
    and is often referred to as 0V (ie zero volts).


    The GPIO header also has four power supply pins: two that provide +3.3V and two
    that provide +5V. Using the ground and power supply pins allows you to obtain
    power from the Pi for your external interface circuitry so you don''t need a separate
    power supply.


    # GPIO PINS


    With two exceptions, the remainder of the pins on the GPIO header are GPIO pins
    although some also have secondary functions that we''re not going to get embroiled
    in here.


    As the phrase ''general-purpose input/ output'' suggests, these pins can be configured
    in the software to act either as inputs or outputs. When programmed as inputs,
    these pins could be connected to a switch, for example, and the software would
    be able to read whether the switch was open or closed, ie. on or off. Alternatively,
    when programmed as outputs, these pins could be connected to an LED, and the software
    would be able to turn it on or off.


    # MAXIMUM RATINGS


    The Raspberry Pi''s GPIO operates from a supply of 3.3V, so you shouldn''t present
    a higher voltage to any of the pins. Doing so will probably destroy the Pi. However,
    there are ways of interfacing to devices that require higher voltages, as well''
    see later in the ''Exceed limits safely'' section (on page 68). In fact, there
    are even ways of interfacing to mains-powered equipment and this is also something
    we''ll discuss.


    The maximum voltage isn''t the only way of exceeding the GPIO''s maximum rating;
    you should also adhere to its maximum current of 16mA (and a total of 50mA for
    all GPIO pins). In practice, this means that you''ll easily be able to drive an
    LED, which doesn''t require much current, but driving a higher-powered device
    such as an electric motor requires a bit more attention. Again, this is covered
    in the ''Exceed limits safely'' section.


    There are two numbering schemes for GPIO pins. First there''s the physical numbering.
    This reflects each pin''s position on the header, so it runs from 1 and 2 at one
    end to 39 and 40 at the other. Then, for the actual GPIO pins (as opposed to power
    supplies), there are GPIO numbers. You can choose to use either scheme in the
    software.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_58_2.png)


    5v Pwr, GND, GPIO 29, GND, UARTO TX, GND, GPIO 17, GPIO 17, GND, GPIO 22, GND,
    GPIO 27, GND, GPIO 23, GND, GPIO 28, GND, SPI0 MISO, GND, SPI0 SCLK, GND, SPI0
    MISO, GND, Reserved, GPIO 3, GND, GPIO 5, GND, GPIO 12, GND, GPIO 13, GND, GPIO
    19, GND, GPIO 16, GND, GPIO 20, GND, GPIO 21, GND'
