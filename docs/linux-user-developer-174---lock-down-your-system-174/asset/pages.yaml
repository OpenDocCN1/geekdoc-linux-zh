  md: '![](img/1f330653f83dcf0397f7d224ce8bbc16_68_0.png)


    # Raspberry Pi air drum kit


    David Pride’s air drum kit turns the Raspberry Pi into a musical maestro


    **Where did the original idea for the drum kit stem from?**


    What’s always interesting to me is where we find our sources of inspiration. These
    can be a person, a book, a tweet, a website – anything at all. A lot of my project
    ideas start when I find something at the local car boot sale.


    This time what I found was an Air Play ‘Air Drum’ – being offered for the grand
    sum of £1! How could I possibly refuse? So I took it home and had a quick play
    and to be honest, while the concept is great, the actual functionality was a bit
    limited, the sound quality was rubbish and it was also a bit suspect as to what
    sound played with what movements.


    **How was the build process? Did you encounter any issues?**


    This got me to time to be very acceptable on a Pi 3, I posted the code to Github
    and others have also been having fun with it. I’ve seen one version that uses
    the controller code and PyGame to play the sound files; this seems to work better
    on older versions of the Pi.


    **Is there any way you see this project being expanded on? Integrating more sounds
    perhaps?**


    In regards to what else could be done, I am interested in seeing if the actual
    mechanics from the Wii controllers could be mounted in a pair of gloves; this
    could be a really interesting experiment. Additionally, I’d like to configure
    a more refined output that can generate MIDI signals rather than just playing
    stock sound files, this would really open up a whole range of different possibilities.


    Many of our readers will know about your Pi exploits. What’s next for you?


    **Any big projects in the pipeline?**


    In regards to what comes next, I am very fortunate in that I’ve just got my hands
    on a 3D printer so have been having a lot of fun experimenting with that. I’ve
    designed a LEGO-compatible case for the Raspberry Pi Zero, which is proving extremely
    popular. I’ve been selected to take part in Pi Wars, the Raspberry Pi robotics
    competition that takes place in April 2017 so I’ll be doing a lot of preparation
    for that event too in the coming months.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_68_1.png)


    > **David Pride**

    > Is a Raspberry Pi devotee who has played a major role in Pi-centric events throughout
    the UK.


    **Like it?**

    David has been massively involved with the Pi community for a number of years,
    and we’ve featured several of his projects previously. We highly recommend you
    check out his Connect4 robot, which was another novel way into integrating the
    Raspberry Pi into a different type of project: http://bit.ly/2lbxSNw


    **Further reading**

    While the air drum kit being a niche project to undertake, David does explain
    that this is very much a beginner-friendly project he got started with a single
    look at the project can be found on: http://bit.ly/2qhhEE, while all the necessary
    code can be yours from his official GitHub listing: http://bit.ly/2gnHi7b'
