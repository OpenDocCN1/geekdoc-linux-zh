- pgno: 43
  md: '# # Tutorial Munin


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_43_0.png)


    the nodes. To enable tracking via SSH tunneling you need to add a node like this:


    ```

    ```text

    [ssh-node]

    address 127.0.0.1

    port 5050

    ```

    ```


    Then establish a SSH connection using the following:


    ```

    ```text

    $ ssh -L 5050:localhost:4949 -f -N -i keyfile

    user@ssh-node

    ```

    ```


    This will establish a tunnel between TCP ports 5050 on the calling machine to
    4949 on the called machine. It will also send SSH in the background after possibly
    asking for a passphrase.


    Now allow users regular expression matching against the client IP address:


    ```

    ```text

    cidr_allow 192.0.2.1/32


    allow ''^127.*''

    allow ''^192.0.2.1$''

    ```

    ```


    The next step in configuring the Munin node is to decide which plugins to use.
    Once you have decided, just add the plugin file to the directory /etc/munin/plugins.
    The Munin node runs all plugins present in that directory.


    Note that Munin has a plug-and-play architecture with no restrictions on how and
    where a node can be added to the network. So, whenever you need to add a new node
    to your existing network (that is being monitored by Munin), you can simply install
    the Munin node using the command mentioned earlier and allow access to the Munin
    master (using the configuration explained earlier). This will ensure the new node
    is being monitored by Munin.


    # ## 05 Monitor hosts that aren''t directly reachable


    There are a number of situations where you''d like to run a Munin node on hosts
    not directly available to the Munin server. For example, consider a scenario where
    a UNIX server sits between the Munin server and one or more Munin nodes. The server
    in between reaches both the Munin server and the Munin node, but the Munin server
    cannot reach the Munin node or vice versa. There are various approaches to handle
    such scenarios: we''ll look at SSH tunneling. With SSH tunneling, only one SSH
    connection is required, even if you need to reach several hosts on the other side.
    The Munin server can listen to different ports on the localhost interface and
    track


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_43_1.png)


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_43_2.png)


    # ## 06 Munin plugins


    A Munin plugin is a simple executable invoked in a command line environment, whose
    role is to gather a set of facts on a host and present them in a format Munin
    can use. A plugin is usually called without any arguments. In this circumstance,
    the plugin returns the data in a key value format. For example, the load1 plugin,
    which comes as standard with Munin, will output the current system load:


    ```

    ```text

    $ munin-run load

    load.value 0.03

    ```

    ```


    The default directory for plugins is /usr/share/munin/plugins/. You can activate
    a plugin by creating a symbolic link in the /etc/munin/plugins/ for a package
    installation of Munin) and restarting the Munin node.


    The Munin installation procedure uses the utility munin-node-configure to check
    which plugins are suitable for your node and create the links automatically. It
    is called every time a system configuration changes (services, hardware, etc)
    on the node and it will adjust the collection of plugins accordingly.


    # ## 07 Munin plugin invocation


    By default, about a dozen set of plugins are installed and active. In its most
    common form, a plugin is a small Perl program or shell script.


    The plugins are run by munin-node, and they are invoked when successfully contacted
    by the munin master. When this happens the munin-node runs each plugin twice –
    once with the argument config to get graph configuration, and once again with
    no argument to get graph data. This is how they''re handled in a plugin.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'When a plugin is invoked with the config argument it is expected to output
    configuration information for the graph it supports. This output will consist
    of a number of attributes divided into two sets -- global attributes and another
    set of data source-specific attributes. You can check out the details at: list
    via this link: [http://munin.readthedocs.io/en/latest/reference/plugin.html](http://munin.readthedocs.io/en/latest/reference/plugin.html).


    However, when the node receives a fetch command for a plugin the plugin is invoked
    without any arguments on the command line and is expected to emit one or more
    field, value attribute values, one for each thing the plugin observes as defined
    by the config output. The plotting of graphs may be disabled by the config output.


    ```

    graph_label Load

    label.label1 Load


    ECM

    exit 0;;

    esac


    printf "load.value "

    cut -d'' '' -f2 /proc/loadavg

    ```


    # Mumin alarms


    Mumina is a generic interface for receiving warnings and errors. If a Mumin plugin
    discovers that a plugin has a data source breaching its defined limits, Mumini
    is able to alert the administrator either through a more command- line invocations
    or through using a monitoring system like Nagios or Kanga. Note that if the receiving
    system can accept only a limited number of messages at the time, you can use the
    directive contact, contact_max, messages.


    # 08 Sample Munin plugin


    Let''s create a simple Munin plugin. We''ll take the example of the Load Average
    plugin and write it in shell script. In this plugin we want to be able to track
    a node''s overall average load. There is a Linux file that has the info: /proc/loadavg.
    So, let us first read the file and format the output:


    ```

    $ cut -d'' '' -f1 /proc/loadavg

    0.09

    ```


    Also, Munin wants the value in a more structured form, so let''s structure it
    further:


    ```

    # printf "load.value "; cut -d'' '' -f2 /proc/loadavg

    load.value 0.06

    ```


    Here the load is called the field or field name, the value is the attribute, and
    the number is the value. The next step is to make sure the plugin accommodates
    the mandatory requirement of responding with graph-related details when called
    with the config argument. Minimal output should look like this:


    ```

    graph_title Load average

    graph_label Load

    load.label load

    ```


    This is to make sure that when munin-master gets data from the plugin, it knows
    how to plot the data in a graph. Here is the final plugin in one file.


    ```

    #!/bin/sh

    case $1 in

    config)

    cat <<''EOM''

    graph_title Load average

    ```


    > "The plugins are run by munin-node, and invoked when contacted by the munin
    master."


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_44_0.png)


    # 09 Munin buddyinfo plugin


    Linux manages virtual memory on a page granularly. There are some operations,
    however, which require physically contiguous pages to be allocated by the kernel.


    Such allocations may possibly fail if the memory gets fragmented, even when there
    are enough pages free, but they are not contiguous.


    ```

    /proc/buddyinfo

    helps to visualise free memory fragments on your Linux machine. The Munin buddyinfo
    plugin can track this info on all the nodes of your network and help you monitor
    it from the master. This plugin monitors the amount of contiguous areas, called
    higher order pages. The order means the exponent of two of the size of the area,
    so order 2 means 2^2 = 4 pages.

    ```


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_44_1.png)


    # 10 Munin proc plugin


    The Munin proc plugin is used to monitor various aspects of named processes. You
    can configure it by supplying a pipe-delimited list of parameters through environment
    variables. env_procname defines the processname as seen inside the parentheses
    of the second column in /proc/PID/stat. If you don''t get the data you expect,
    you can check if the value is what you expect here. This is used for the first
    filter. Then args/user-filter is applied on top of this filter. Note that <PID>
    is the process ID of the process that you are interested in. Process names including
    non-alphanumeric characters (like space, dash, etc) are Special Names. Also, note
    that if the process name (in env_procname) contains any characters other than
    [a-zA-Z_], they will be internally replaced by underscores.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Tutorial Erlang


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_45_0.png)


    Mihalis Tsoukalos is a UNIX administrator, a programmer (UNIX & IOS), a DBA and
    a mathematician. He has been using Linux since 1993. You can reach him at @mactosouk(Twitter)
    and his website: mtsoukalos.eu


    +   Resources

    +   An installation of Erlang

    +   A text editor such as Emacs or vi


    # Program in Erlang:

    Functions


    Discover Erlang functions and basic Erlang data types as well as other interesting
    and helpful Erlang topics


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_45_1.png)


    This tutorial is the second one in the series of tutorials about the Erlang programming
    language. The main subject of this tutorial is Erlang data types and functions.

    As you might remember from the tutorial in the previous issue, all Erlang code
    comes in modules unless you are experimenting in the Erlang shell. As a result,
    all Erlang code comes in functions. Erlang has a pretty unusual way of defining
    functions, especially if you are used to programming languages such as C or Python,
    which will be explained here. Additionally, as Erlang is a functional programming
    language, it also supports anonymous functions, which are also going to be illustrated.
    You will also learn about atoms, lists, maps and tuples, so start reading!


    # More About Erlang


    Concurrency is a central part of Erlang. As a result, Erlang processes, which
    should not be confused with Linux processes, are lightweight. Put simply, Erlang
    processes are easy to create, much easier than Linux processes, as they require
    a very small amount of time and have a small memory overhead. Erlang processes
    do not communicate with each other using memory, which is a risky thing, but by
    using messages. Furthermore, as processes are independent, the memory space of
    each process can be garbage-collected individually. Last, the failure of a process
    cannot do any damage to other processes, therefore allowing them to continue their
    jobs.


    # More About OTP


    OTP is a central part of Erlang and the Erlang way of thinking, because it allows
    you to make your Erlang applications highly available. This section will talk
    a little bit more about OTP in order to get a better understanding of it.

    OTP is unique among programming languages and allows teams to work and develop
    distributed, fault-tolerant, scalable and highly available systems.

    Despite its name (Open Telecom Platform), OTP is domain independent, which means
    that you can program applications for many different areas.

    OTP consists of three main parts. These are the Erlang language itself, various
    tools that come with Erlang, and the design rules, which are generic behaviours
    and abstract principles that allow you to focus on the logic of the system. The
    behaviours can be worker processes that do the dirty work, while supervisor processes
    monitor workers as well as other supervisors. In order to do this right, the developer
    should structure the processes appropriately.

    That is enough information about OTP for this tutorial; you will learn even more
    details about OTP in forthcoming tutorials.


    # Variables and Numbers


    As expected, Erlang supports two kinds of numbers, integers and floats.

    When defining floats, you should always have a number on the left of the decimal
    point, even if it is zero. If you forget to do so, you will get the following
    kind of error message:'
  merge: -1
  img_proc: true
