    User & Developer** website either via my bookmark or by typing in the address,
    I am sent somewhere else – to a site called gadgetally.xyz. I note that it seems
    to have content on it from **Linux User & Developer** along with many other interesting
    things, however I''m curious as to why I''m being taken there instead of to the
    **Linux User & Developer** site that I''m used to using. Please advise.


    # Harry Rayson


    The old incarnation of the **Linux User & Developer** website is no more – instead,
    several of our technology magazines now aggregate their website content through
    the website of our sister magazine Gadget. You''ll find a wealth of content from
    ourselves and our sister magazines Gadget, iCreate and *Web Designer* – it''s
    an Aladdin''s cave of tips, tutorials, hardware guides and so much more. The reason
    why the old website link automatically redirects you there is because it''s much
    more convenient for you if we just take you to the new home of the content you''re
    looking for, rather than manually redirecting you on the page or with new links
    inside the magazine. And aggregating all of the sites together gives you the opportunity
    to explore more content that you might find interesting, like the latest tech
    or a few clever tricks for working with Apple architecture or web design. Have
    a rummage around the site and you''ll find plenty of interesting stories, guides
    and more!'
