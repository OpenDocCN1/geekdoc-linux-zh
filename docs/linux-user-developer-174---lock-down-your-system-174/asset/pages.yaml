    \n\ndef sense_draw_image():\n    sense.draw_frame([255, 255, 255])\n\n\ndef sense_clear():\n\
    \    sense.clear()\n\n\ndef sense_show_letter(letter):\n    sense.show_letter(letter)\n\
    \n\ndef sense_show_message(message):\n    sense.show_message(message)\n```\n\n\
