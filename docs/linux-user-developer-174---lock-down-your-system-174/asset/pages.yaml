  md: "![](img/1f330653f83dcf0397f7d224ce8bbc16_36_0.png)\n\nfollowing bit of data\
    \ the numbers are likely to be different):\n\n```\nroot@amihan-thinkpad:~/Desktop/Deadstuff/2016Nov/April$\
    \ bash# cat_pingstore.dat\n```\n```\n\n```\ncof\n50.7\n50.3\n204\n53.5\n50.4\n\
    51.0\n50.9\n57.8\n50.0\n53.0\n```\n\n```\n#!/bin/bash\n\ngnuplot <<ENDOFTHISDOC\
    \ &\nset terminal png\nset output ‘goldchart.png’\n plot ‘datasource.txt’ using\
    \ 1:2 axes x1y1 ... \nENOFTHISDOC\n```\n\nThis gnuplot invocation differs from\
    \ the normal ones in that it first sets the Terminal to png, thereby instructing\
    \ the program to plot to a PNG file. Set output is then used to specify the name\
    \ of the file that is to be generated, after which commands can be issued. When\
    \ run, the file containing the shell script will be populated with a graphics\
    \ file. It can then be forwarded to its final destination using a file transfer\
    \ command of choice.\n\n# Differing data\n\nNow that you have a separate .pub\
    \ file loaded into the gnuplot at runtime, we can change the program’s behaviour\
    \ in order to put out data collected by the main shell script during its execution.\
    \ One good example for this would be a plot showing ping times to a server – under\
    \ an assumption of a permanently working network connection, we could assume the\
    \ sending of ten packages to be accomplished in about ten seconds. This makes\
    \ ping an ideal candidate for the final diagramming application of this tutorial\
    \ – showing a historical trend of connection reliability over time gives an additional\
    \ set of meaning to your data.\n\nSadly, the output of ping is not directly usable:\
    \ gnuplot expects uniform numeric values, and is unlikely to be able to parse\
    \ the output directly. Piping can solve this problem – the awk utility allows\
    \ you to cut out parts of texts easily. For example, the following line would\
    \ cut out the relevant column:\n\n```\nping -c 10 www.google.fr | awk -F '[ ]'\
    \ ‘(print $[NF-1])’ > pingstore.dat\n```\n\nWhen run, the file pingstore.dat for\
    \ this author will contain the time with the man page of the product. For the\
    \ average user, however, the instructions discussed in this story are more than\
    \ enough.\n\nFortunately, this problem can be solved via grep. When invoked as\
    \ shown, the program will limit its output to purely numeric data:\n\n```\nping\
    \ -c 10 www.google.fr | awk -F '[ ]' ‘(print $[NF-1])’ | grep -E “[0-9]” > pingstore.dat\n\
    ```\n\nWith that, but one problem remains: graphing the content of the data file:\n\
    \n```\n#!/bin/bash\n\nping -c 10 www.google.fr | awk -F '[ ]' ‘(print $[NF-1])’\
    \ | grep -E “[0-9]” > pingstore.dat\n\ngnuplot -persist <<ENDOFTHISDOC &\nplot\
    \ ‘pingstore.dat’ with lines\nENDOFTHISDOC\n```\n\nOur last example is special\
    \ in that it simply provides gnuplot with the pingstore.dat and instructs it to\
    \ use lines for the drawing operation. gnuplot’s internal algorithms will proceed\
    \ to generating a numerical sequence for the X axis, thereby ensuring that the\
    \ diagram looks great.\n\nAn entire book has been written about Gnuplot – someone\
    \ who does a lot of diagramming should definitely spend a bit of time with the\
    \ man page of the product. For the average user, however, the instructions discussed\
    \ in this story are more than enough.\n\nAnd with that, our trip through the realm\
    \ of shell scripting has come to an end. Even though we covered an amazing amount\
    \ of ground, this is, by far, not everything that can be said about shell scripts.\
    \ Should you find yourself performing any kind of task over and over again, you\
    \ should definitely consider looking for a shell script to handle it instead –\
    \ thanks to the openness and chattiness of UNIX administrators, a simple Google\
    \ search is likely to yield more results than you could have imagined in your\
    \ wildest dreams."
