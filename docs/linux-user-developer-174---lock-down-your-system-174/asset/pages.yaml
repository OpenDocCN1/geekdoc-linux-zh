    allow just as much power over commands, yet I often read things that say it''s
    better to sudo something rather than root. I surely they both essentially do the
    same thing? And if root is the administrator account that has all the power, why
    would you not use that? In Windows if you are anything less than an administrator
    you basically have barely any control over the system at all, so why would you
    ever'
