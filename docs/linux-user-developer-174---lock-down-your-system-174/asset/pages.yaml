    \ are passed as a list. If the function takes no parameters, you should pass an\
    \ empty list. Figure 3 shows how to define and process maps and lists inside the\
    \ Erlang shell.\n\n# Tuples and guards\n\nA **guard** will allow you to specify\
    \ the kind of data a given function will accept. Although it might just look a\
    \ little fuzzy at the moment, you will see Erlang code that uses guards later\
    \ on in this tutorial. The **when** keyword indicates a guard. The condition of\
    \ a guard is relatively simple and will allow you to do pattern matching based\
    \ on the content of the argument and not just on its shape.\n\nA tuple is a composite\
    \ data type, which means that a tuple allows you to combine multiple items into\
    \ a single data type and store them using a single variable. Most of the times\
    \ Erlang tuples group two to five items. Moreover, the first atom of a tuple usually\
    \ identifies the purpose or the category of the tuple. You can declare a tuple\
    \ as follows:\n\n```\n```\n> T1 = [linux, 1].\n   [linux,1]\n```\n\n```\n\nThe\
    \ element() function allows you to access a given item of a tuple:\n\n```\n```\n\
    > element(1, T1).\n   Linux\n```\n\n```\n\nAs you can see, the first element of\
    \ a tuple has an index number of 1. Similarly, the **setelement()** function allows\
    \ you to change the value of an existing tuple item in order to create a new tuple:\n\
    \n```\n```\n> T2 = setelement(1, T1, unix).\n   [unix,1]\n```\n\n```\n\nTuples\
    \ are handy as they let you group data and are frequently used in Erlang as well\
    \ as other programming languages.\n\n# Erlang functions\n\nA function in Erlang\
    \ is a sequence of function clauses that are separated by semicolons and terminated\
