- pgno: 24
  md: '# 03

    ## Choose your exploit


    The nmap utility or Spartat will list all open ports on your remote host. The
    next step is to determine whether any of the services running on these ports is
    vulnerable to an exploit. The easiest way to do this from within msf is to use
    the searchsploit command. However, running searchsploit irc will show potential
    exploits for every version of every IRC program.


    You can narrow this down by scanning the specific port in question to determine
    the software version. For instance, if you want to see if the IRC software running
    on port 6667 on host 192.168.56.102 is vulnerable, run the following command:


    ```

    nmap -A -p 6667 192.168.56.102.

    ```


    In Metasploitable 2, this shows more useful information. The machine is running
    v3.2.8.1 of the Unreal IRC daemon. Running searchsploit unreal irc shows there
    are two possible exploits for this version of Unreal on Linux. The paths are provided
    on the right.


    # 04

    ## Move exploit


    Having identified the exploit you wish to use, it must be moved into Metasploit''s
    modules folder (~/.msf4/modules). The easiest way to do this is to open a new
    Terminal and initially use the **mkdir** command to create a directory named **exploits**.
    Feel free to create subdirectories inside **exploits** to help organise them.
    For instance:


    ```

    cd ~/.msf4/modules

    mkdir -p exploits/linux/remote

    ```


    Next, use the **mv** command to place the exploit where msf can see it. For example:


    ```

    mv /usr/share/exploits/db/platforms/linux/remote/16922_rb ~/.msf4/modules/exploits/linux/remote/16922.rb

    ```


    Either restart msf or use the command `reload_all` to update.


    # 05

    ## Load exploit


    Once msf has restarted or reloaded, load your exploit with the syntax:


    use exploit/path/to/exploit


    For instance, in the case of the IRC exploit listed previously, type:


    use exploit/linux/remote/16922


    Note that there is no need to include the file extension. Exploits are written
    in various programming languages, but msf can recognise these automatically.


    # 06

    ## Configure parameters and run


    Once the exploit has been loaded, you can type **show payloads** and **show options**
    to configure the tool further. When typing the latter, you will be asked to `set
    RHOST`. This is where you specify the IP address of the remote host. For instance:


    set RHOST 192.168.56.102


    If you wish to choose a specific payload, use the same syntax:


    set PAYLOAD <payload>


    Finally, run your exploit with the command:


    exploit'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# Feature  Lock down your system\n\n# ASSESS NETWORK DEVICES WITH KISMET\n\n\
    A handy utility to detect rogue wireless access points passively\n\nUnsecured\
    \ wireless access points as well as ad-hoc networks can cause interference with\
    \ legitimate Wi-Fi areas. They are also potentially an easy way to access passwords\
    \ and other sensitive data on devices that have not been properly locked down.\n\
    \nKismet, which comes pre-installed in Kali, is a wireless network detector built\
    \ along similar lines to Netstumbler for Windows. One important difference is\
    \ that it scans passively, so can discover hidden Wi-Fi networks. While it is\
    \ commonly used for 'war driving', it is also an enormously useful tool for security\
    \ admins to make sure no unauthorised devices in your organisation are set up\
    \ as an access point.\n\nIdeally Kismet needs a dedicated Wi-Fi card, which it\
    \ will place into monitoring mode to detect Wi-Fi points nearby. This will allow\
    \ your device to stay connected to the internet while Kismet is working.\n\nKismet\
    \ supports GPS devices. By default the program can be configured to show your\
    \ device's current location, but through use of add-ons it can also plot the likely\
    \ location of other Wi-Fi networks on maps, making it easier to trace their exact\
    \ location.\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_25_0.png)\n\n+   01 Install\
    \ and launch Kismet\n+   \n+   If you are using Kali, Kismet is pre-installed\
    \ and can be launched from the Terminal with the command kismet -l. Otherwise\
    \ download it from your local repository. Kismet requires root privileges to perform\
    \ some functions. This carries a risk of bugs or exploits damaging your system.\
    \ In Kali, where you work as root by default, this shouldn't be an issue as it\
    \ is designed with security in mind. For other distributions, consider installing\
    \ Kismet with the setuid set, which grants root privileges only to those processes\
    \ that need them.\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_25_1.png)\n\nKISMET\
    \ MENUS\n\nThe Kismet menu allows you to view the Kismet console or add a new\
    \ interface for scanning. Use the Sort menu to change how networks are displayed\n\
    \n+   02 Configure startup options\n+   \n+   On the first run, Kismet will ask\
    \ you to choose your text colour. Click Next to automatically start Kismet Server.\
    \ The Startup Options window will appear, where you can configure any startup\
    \ parameters such as logging. By default, logs are saved to your home folder.\
    \ Click Start when you are ready to continue.\n\n+   03 Add a source\n+   \n+\
    \   Next you will see a message stating that Kismet started with no sources defined.\
    \ Click Yes to choose to add a source now. The 'add source' window will now appear.\
    \ Use the command ip link show or ifconfig in the Kali Terminal to display the\
    \ names of your network interfaces (such as 'wlan0') and enter it here. You can\
    \ also set a name if you wish. Click 'Add' when you are done. Kismet will launch\
    \ and immediately begin to list networks and clients.\n\nNETWORK AND CLIENT LIST\n\
    \nThe Network List displays any wireless networks in range. Hidden networks are\
    \ listed as '<Hidden SSID>'. Clients' MAC addresses are listed below. Use arrow\
    \ keys to scroll up and down\n\nGENERAL INFO\n\nHere Kismet displays information\
    \ such as detection of new networks and when log files have been displayed. The\
    \ current wireless interface is also shown at the bottom-right\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_25_2.png)\n\
    \n![](img/1f330653f83dcf0397f7d224ce8bbc16_25_3.png)\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_25_4.png)\n\
    \n+   04 Set up GPS\n+   \n+   This step is optional but highly recommended for\
    \ hunting down rogue Wi-Fi networks. You will need an external GPS device to be\
    \ connected to your device. In Kali, run:\n\n```\n`sudo apt-get install gpsd gpsd-clients`\n\
    \n...to install the necessary software. Next, connect the GPS dongle and run `dmesg\
    \ | tail -n 5` to determine where it is mounted, such as dev/ttyUSB0. Start the\
    \ GPS device with gpsd <device_location> For instance:\n```\n\n```\n`gpsd /dev/ttyUSB0`\n\
    \nFinally, edit /etc/kismet/kismet.conf and uncomment both the lines '$tstype=serial'\
    \ and 'tspdevicename=/dev/ttyConf0' by removing the hash # at the start. Amend\
    \ '$dev/rfcomm0' to the actual location of your GPS device. Restart Kismet to\
    \ see your current GPS co-ordinates.\n```"
  merge: -1
  img_proc: true
- pgno: 26
  md: '# **TEST WITH METASPLOITABLE 2**


    Practise pen-testing safely with a virtual machine


    Metasploitable is not an application but a virtual machine image based on Ubuntu
    Linux, which contains a number of intentional vulnerabilities. This can be used
    to safely test security tools such as Sparta and the MetaSploit Framework.


    The image itself can be downloaded from **bit.ly/2h8FXM** (or from the cover disc).
    You will need virtual machine software such as VirtualBox (available from **www.virtualbox.org**)
    to run it.


    The easiest and safest way to pen-test Metasploitable is to run Kali in a virtual
    machine. VirtualBox can create a host-only network that will allow Kali and Metasploitable
    to see one another without being exposed to the rest of your network or the internet.


    First go to **File > Preferences > Network > Host Only Network** to create a new
    network. Next, inside each virtual machine, click **Settings > Network** and choose
    **Host Only**


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_26_0.png)


    Adapter in the drop-down ‘Attached To’ menu. The name should populate automatically
    with the host-only network you created. Under **Advanced**, set **Promiscuous
    Mode** to **Allow All**. The default username and password for the


    virtual machine is **msfadmin**. A full video tutorial showing how to set up Metasploitable
    2 in VirtualBox is available on the **Rapid7** website. Point your browser to:
    **community.rapid7.com/t/2007**.


    > “The easiest and safest way to pen-test Metasploitable is to run Kali in a virtual
    machine”


    # **STASH PASSWORDS WITH SYSPASS**


    Secure passwords in a multi-user environment with an easy-to-manage database


    Syspass is a web password manager written in **PHP**. Its chief advantage is that
    it is very lightweight, using an **HTML5** and **AJAX** interface. The database
    is protected by a master password, and individual user accounts and passcodes
    are encrypted with **AES-256-CBC**.


    SysPass will run on any server using **Apache**, **PHP** and **MySQL**, and is
    even designed to be run from a portable flash drive for extra security.


    Once installed, users log in to the interface with their own username and password,
    which is not shared with others. Any users in your organisation who previously
    used a personal password database with **KeyPass** can easily migrate their accounts
    to SysPass. Multiple users can also be added to groups; for instance, all the
    administrators of a particular website can access the username and password to
    connect via **FTP**. The users


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_26_1.png)


    that are ‘Application Admin’ or ‘Account Admin’ can view, modify and delete any
    account. They do this through use of a master password that is required each time
    global changes such as adding a new user are made.


    A demonstration of SysPass’s colourful and simple web interface is available from
    **demo.syspass.org** (use the default passwords shown). Setup instructions can
    be found at **wiki.syspass.org/en/start**.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# ## Feature

    Lock down your system


    # # PROTECT NETWORKS WITH IPFIRE


    Quickly set up a highly customisable firewall for all your networks


    IPFire is an open source firewall Linux distribution. This is an oversimplification,
    however, as it offers a number of other features such as intrusion detection and
    support for Open/VPN. IPFire takes a serious approach to security through using
    an SPI (stateful packet inspection) firewall built on top of netfilter.


    The setup process allows you to configure your network into different security
    segments. Each segment is colour-coded. For instance, the green segment is a safe
    area representing all regular clients connected to the local wired network. The
    red segment represents the internet.


    No traffic can pass from red to any of the other segments unless specifically
    configured in the firewall. The default setup is for a device with two network
    cards with a red and green segment only. However, during the setup process you
    can also set up a blue segment for wireless and an orange one known as the ‘DMZ’
    for any public servers.


    Once setup is complete, you can configure additional options and add-ons through
    an intuitive web interface. IPFire is specifically designed for people without
    large amounts of networking experience and can be deployed in minutes.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_27_0.png)


    > > No traffic can pass from red to any of the other segments unless specifically
    configured in the firewall


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_27_1.png)


    ### 01 Download and install IPFire ISO

    Visit www.ipfire.org/download in order to download the 162MB ISO of IPFire (or
    get it from the cover disc). The default hardware requirements are very minimal.
    Click on Other Download Options to obtain flash images as well as versions compiled
    for ARM architectures. The IPFire site cautions that the software doesn’t run
    well on devices like the Raspberry Pi, nor does it make use of the hardware random
    number generator. Consider having a dedicated server for IPFire or running it
    inside a virtual machine.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_27_2.png)


    ### 02 Run IPFire setup

    The initial setup process is very simple. Select your language and use the space
    bar to indicate you’ve accepted the terms of the GNU licence. You will then see
    a notification saying that the system has been installed. The device will restart,
    at which point you will be asked to select your time zone. Next, you will be asked
    to select a root password to access the IPFire command line, as well as an admin
    password for accessing the web interface later on.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_27_3.png)


    ### 03 Choose network configuration type

    Having chosen a host name and local domain settings, you will be taken to the
    Network Configuration menu. As outlined previously, the default settings are ‘GREEN
    + RED’. These represent devices with Ethernet attached. If you wish to set up
    wireless (blue) or a public server (orange-DMZ), select the ‘Network Configuration’
    type option, then use the arrow keys to select a different setup. You can change
    these options post-install but as IPFire cautions, a network restart is required,
    as well as reassignment of drivers (see Step 4).'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/1f330653f83dcf0397f7d224ce8bbc16_28_0.png)


    # 04 Choose driver assignments


    Next, in the Network Configuration menu, choose Drivers and Card Assignments.
    You will now see the Extended Network menu. Select Green in the first instance.
    The menu will ask you to choose the network card for this interface. If you are
    unsure which to choose, click Identify and the lights on the port in question
    will flash for ten seconds.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_28_1.png)


    # 06 Configure DNS and gateway


    Back in the Network Configuration menu, choose DNS and Gateway Settings. If you
    chose DHCP when configuring the Red interface, your ISP''s DNS servers will be
    used by default and you do not have to configure this further. If you chose a
    static IP or wish to use a different DNS server such as OpenDNS, enter them here,
    leaving the Gateway field blank for now. A full list of public DNS servers is
    available from: [wiki.ipfire.org/en/dns/public-servers].


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_28_2.png)


    # 08 Open web interface


    Once setup is complete, IFFire will restart and load the firewall. You will see
    the IFFire Console. Log in as root with the password you previously chose if you
    wish, then run ifconfig to check that your interfaces are in order.


    You can access the web interface from any device connected to the network by opening
    your web browser and entering https://ipfire.localdomain:444. As IFFire uses a
    self-signed certificate, you may need to confirm a security exception. Enter the
    username admin and the password you chose previously to display the web interface.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_28_3.png)


    # 05 Set network addresses


    Select Address Settings from within the Network Configuration menu. You will then
    be asked to select the interface in question. Green allows you to assign any valid
    IP address for a private network here, for instance 192.168.0.1. There are more
    options for the Red interface, which may vary depending on your ISP. If you do
    choose to assign a static IP, assign it to a different subnet. For example, if
    green is 192.168.0.X, red could be 192.168.2.X. If you are unsure, choose DHCP.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_28_4.png)


    # 07 Configure DHCP server


    Click on Done on the Network Configuration menu to configure the DHCP server for
    the ''green'' interface. Use the space bar to enable, and then specify your desired
    range of addresses within the same subnet as your green interface. For instance,
    if the IP address of your green interface is 192.168.0.1, you could choose a range
    of 192.168.0.10 to 192.168.0.39. Note that the ''Primary IFFire DNS address''
    is the same as the IP address of your green interface. This is because IFFire
    uses a DNS proxy. Leave this as is for now.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_28_5.png)


    # 09 Configure firewall


    The web interface is easy to follow. Take some time to work through it to use
    IFFire''s Intrusion Detection System or set up a VPN. For now, click Firewall>Firewall
    Rules> New Rule. The layout is fairly easy to follow. For instance, if you wish
    to force clients to block all external DNS servers to prevent DNS hijacking, select
    GREEN in the Standards Network menu to indicate you wish only to use IFFire''s
    DNS proxy. Choose RED in the same menu in the Destination section. Finally, under
    Protocol select DNS and make sure REJECT is highlighted. For a full rundown of
    the various configurations, consult IFFire''s firewall documentation at: [wiki.ipfire.org/en/configuration/firewall/start].'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# ## STAY SECURE WITH GOOGLE AUTHENTICATOR


    Secure your SSH connections with minimal fuss through two-step verification


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_29_0.png)


    For system administrators, connecting to servers via SSH is part of a daily routine
    for running updates and modifying files, but this can leave the system open to
    exploitation.


    While you can reduce the chance of this happening by following some SSH best practices
    such as disabling root log-on, changing the default SSH port and using long passwords,
    the previously mentioned tools (Sparta in particular) demonstrate how easily vulnerable
    ports can be scanned and how passwords can be brute-forced.


    Even using programs like fail2ban to limit unsuccessful login attempts or to ban
    certain IPs for a certain amount of time is no magic bullet, as many exploitation
    tools can perform several parallel tasks.


    The security of your SSH server can be hugely increased through Google Authenticator.
    This application uses two-step verification services based on a TOTP


    (time-based one-time password) algorithm. The authenticator works in tandem with
    a mobile app, providing 6-8 digit one-time passwords that are required in addition
    to a username and password. Note that our guide assumes you are using OpenSSH
    server, which is the standard for almost all versions of Linux.


    **01 Installation**


    For Debian-based servers, run:


    `apt-get install libpam-google-authenticator libpam0g-dev`


    ...to try to install the authenticator and related software from the repositories.
    Red Hat, Fedora and CentOS users should run:


    `yum install pam-devel google-authenticator`


    If Google Authenticator doesn’t exist in your distribution’s repositories, you
    can download and compile with the make command from github.com/google/google-authenticator.


    PAM (pluggable authentication module) must also be downloaded and compiled from
    github.com/google/google-authenticator- libpam


    Consider installing the ''ntp'' daemon if you have not done so already to ensure
    the system time is correct, as the Authenticator uses time-based codes.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_29_1.png)


    **02 Generate private key**


    To begin, run the google-authenticator command. Press ‘y’ to indicate you wish
    authentication tokens to be time-based.


    Next, the authenticator will display information about your secret key, along
    with a QR code which you can scan using the mobile app. You will also see emergency
    ''scratch'' codes, which can be used to log in if you ever cannot access your
    mobile device.


    Write down this information in a safe place before continuing, then press ‘y’
    to update your home folder.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_29_2.png)


    **03 Finalise Google Authenticator preferences**


    The authenticator will next ask if you wish to disallow multiple uses of the same
    authentication token. As the authenticator states, selecting this makes man-in-the-middle
    attacks much harder. You can increase the 30-second period for which tokens are
    valid in the next step (if you wish).


    Finally, if you do not already have any programs such as fail2ban installed to
    prevent brute-force attacks, consider pressing ‘y’ to enable rate limiting. This
    limits attacks to no more than three login attempts every 30 seconds.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/1f330653f83dcf0397f7d224ce8bbc16_30_0.png)


    # 04

    Configure SSH to use Google Authenticator


    Open the /etc/ssh/sshd_config file in a text editor. Scroll down to find the line
    that reads `ChallengeResponseAuthentication no` and change it to `ChallengeResponseAuthentication
    yes`. Save the file.


    Next, edit the file /etc/pam.d/sshd and add the following line at the very bottom:


    ```

    auth required pam_google_authenticator.so

    ```


    You must now restart the SSH service to apply the new changes. Run /etc/init.d/ssh
    restart to do this. If your SSH server is not already running, use service sshd
    start.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_30_1.png)


    # 05

    Set up mobile Authenticator app


    Using your smartphone or other portable device, visit the Google Play or iTunes
    Store and install either the official Google Authenticator app or one of its variants
    such as FreeOTP, which is maintained by Red Hat.


    The Google Authenticator app for Android is closed source, so from a security
    perspective FreeOTP is better. Either scan in the QR code generated earlier or
    manually add the `secret` key. The tokens are time-based. If you manually add
    the key in FreeOTP under the Provisioning section, simply enter user@Padress in
    the ID section. In Google Authenticator you would enter this under Account Name.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_30_2.png)


    # 06

    Test login via SSH


    Once your mobile app has been set up, you will see time-based six-digit codes
    being generated. On a separate device, open Terminal and run `ssh user@yourIP`.


    If this is the first time you are connecting via SSH to the server, type ''yes''
    to verify the key fingerprint. You will be asked to type your password in the
    usual way.


    Next, the system will ask for your six-digit verification code. Enter this to
    log in to the server. Switch user and repeat these steps for any additional users
    who wish to log in via SSH.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_30_3.png)


    # 07

    Back up your private keys


    Although you have written down your private keys and scratch codes in a safe place,
    for peace of mind, consider using the `cp` command to copy your Google Authenticator
    file in ~/.google_authenticator to a secure medium.


    For security reasons, Google Authenticator has no way of regenerating the QR code
    with your private key after it is run for the first time. Install the program
    `qrencode` to generate a picture you can open on another device. Once installed,
    the image can be created with the following command:


    ```

    qrencode -o qrcode.png ''otpauth://

    totp/CME:john.doemail.com?secret=HXD

    MVJECTWSRB3HWI2R4FIGJFTXN06O2&i

    ssuer=ACME&algs=&time=1

    &period=30''

    ```


    Replace `ACME`, `john.do@email.com` and the secret key with your own data.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_30_4.png)


    # 08

    Require two-factor authentication for console login


    This step is optional but can be used to secure logins via the console on the
    server itself. In your favourite text editor, simply open /etc/pam.d/login and
    add the same line at the bottom as you did in the SSH configuration:


    ```

    auth required pam_google_authenticator.so

    ```


    Bear in mind that if an attacker can physically access your machine, they may
    target the root account or install a hardware keylogger, so this will not be as
    effective as controlling physical access to the server in the first place.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_30_5.png)


    # 09

    Bypass two-step verification for the local network


    If you find it tiring one having to provide the verification code when connecting
    over the local network, configure Google Authenticator to ignore these addresses.


    Edit the file /etc/pam.d/sshd and replace the following line:


    ```

    auth required pam_google_authenticator.so

    ```


    with this:


    ```

    auth [success=1 default=ignore] pam_access.so accessfile=/etc/security/access.conf

    auth required pam_google_authenticator.so nulloak

    ```


    Next, edit /etc/security/access.conf and add the following lines:


    ```

    two-factor auth can be skipped on local network

    + : All : 192.168.0.1/24

    + : All : LOCAL

    - : All : ALL

    ```


    Replace `192.168.0.1/24` with your desired range of IP addresses.'
  merge: -1
  img_proc: true
