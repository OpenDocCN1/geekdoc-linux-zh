- pgno: 16
  md: 'attached, devices that participate in system-wide cache coherency protocols
    and become instantly aware of any changes made to memory by any other agent or
    processor within the machine. When we reach this eventual stage of evolution,
    it will (theoretically) be possible to build software abstractions that treat
    code running on GPUs, FPGAs, and other accelerators attached to a machine as if
    they''re regular processes.


    But we''re a little way away from utopia today. Until quite recently, data shared
    between GPUs (as an example) and system RAM had to be quite explicitly managed,
    with many extraneous copies of large areas (buffers) of memory as they were passed
    back and forth. Some of the latest hardware on the market greatly improves the
    status quo. For example, Nvidia''s Pascal GP100 supports the ability to trigger
    page faults in unified memory shared between the GPU and system.


    This means that the kernel can maintain a consistent mechanism to manage memory,
    whether it is system RAM or device graphics memory, using the standard page table
    abstraction to translate from the virtual addresses used by software (applications
    on the host Linux system, and code running on the GPU) to underlying physical
    memory that might be located in RAM, or on the GPU. Because devices like the GP100
    can trap on a fault, they can allow the kernel to manage and coordinate ownership
    between the scenes. This is a feature that is leveraged by the HVM (Heterogenous
    Memory Management) patch series from Jérôme Glisse to provide a generic kernel
    mechanism.


    The code has been under development for several years (since at least 2014) but
    there was some resistance to merging it before the upstream maintainers could
    see real-world hardware use cases involving it. There are now several devices
    shipping that can leverage HMM, including both the Nvidia Pascal, as well as the
    Mellanox CX5 network adapter cards. The latest version of the patch series (v14)
    seems to be very close to a final form. The question is whether the process of
    shipping hardware, and the endorsements of those building it, will allow this
    now to be finally merged.


    # The future of third-party driver support


    Linux is famous in developer circles for several fundamental tenets. One of these
    is that "you don''t break userspace". Another is that "there is no kernel ABI".
    The latter means that, unlike other proprietary (and some other open source) Operating
    Systems, Linux doesn''t guarantee stable internal interfaces between the components
    inside the kernel (as opposed to those visible to applications). This is the reason
    that those who use proprietary graphics drivers on Linux must update them every
    time a new upstream kernel is released, for example.


    The kernel doesn''t guarantee that the interfaces needed for drivers don''t change
    radically from one release to the next. Any such changes are typically viewed
    as being self-contained and impacted code is usually updated whenever other infrastructure
    changes are made within the Linux kernel source. Yet for many years, a compromise
    situation has existed in which a Linux kernel could be built with MODVERSIONS
    support. This is a feature that allows the kernel to automatically determine the
    interfaces used by a driver and (at a broad level) whether they remain compatible
    with those provided by the currently running kernel. This feature is often used
    in the commercial Linux distributions, which use this to provide limited support
    for third-party drivers, or updates that didn''t ship with the OS.


    A recent change to the upstream Linux kernel intending to allow the use of EXPORT_SYMBOL
    (a macro used to make kernel functions available across the kernel) within assembly
    code broke kernel module versioning due to a problem with the assembler (binutils)
    used in compiling the Linux kernel. A workaround was merged for 4.9 but it lead
    to a debate in which Linus said, "Some day I really do want to remove MODVERSIONS
    entirely. Sadly, today does not appear to be that day." It will be interesting
    to see what, if anything, directly replaces the functionality required to use
    third-party (even open source) drivers if that day does come.'
