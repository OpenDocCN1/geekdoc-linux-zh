- pgno: 86
  md: '![](img/1f330653f83dcf0397f7d224ce8bbc16_86_0.png)


    > "It has much more spectral bandwidth to play around with, which allows it to
    deliver larger data streams, making it ideal for 4K Netflix"


    allows it to deliver larger data streams, making it ideal for 4K Netflix. The
    PL-1200AV2 also has two Gigabit Ethernet ports, so that you can run multiple devices
    off the one adaptor. These are located on the bottom of the adaptor, which is
    arguably more aesthetically pleasing; but isn''t quite as easy to access.


    Unlike some Powerline accessories, this adaptor also has a pass-through socket,
    so you can continue to use it as a power source (Apparentiy, this is the source
    of the ''PIGGY'' name; it''s like ''piggyback''). The pass-through socket is also
    filtered to help reduce mains noise, if that''s something that bugs you. Something
    of more significance, though, the PL-1200AV2''s security is supported by 128-bit
    AES Link Encryption to keep out eavesdroppers and hackers. However, while some
    simiarly priced Powerline adapters, including models from Devolo and TP-Link,
    include a Wi-Fi transmitter so you can create a hotspot around your socket, this
    one is a feature sadly lacking from the PL-1200AV2.


    Setting up the PL-1200AV2 is almost a case of plug-and-play thanks to the QuickConnect
    button. Like any Powerline network, you require at least two adaptors (so expect
    to pay £94 to start using the PL-1200AV2, rather than just £47). Plug one into
    the socket nearest your router, which you can then hook up to the internet using
    one of the Ethernet ports. Place your second adaptor anywhere in your house where
    you will need reliable internet. Then you have the option to use Solwise''s free
    instalation software to set up a network, but it''s much easier to just press
    the button on the PL-1200AV2 to pair them and watch the LEDs flicker to confirm
    it.


    As we said, in terms of actual performance, our speed test results were nothing
    like the 1, 200Mbps promised on the box. We didn''t actually expect this, as that''s
    a theoretical max speed only. The reality was 385Mbps, which we still consider
    impressive when compared to the 20 to 90Mbps Powerline tech was offering just
    a couple of years ago. Thempaxing was 3ms, which will not do but appeal to online
    gamers. The PL-1200AV2 also uses enhanced Quality of Service (QoS), so it will
    prioritise bandwidth for multimedia payloade - like online gaming, 4K TV and VoIP
    calls - for smoother streaming. However, the advantage of Powerline is not really
    speed, but distance. You can use one PL-1200AV2 adaptor on your ground floor and
    another in your attic without worrying about loss of signal.


    Jack Parsons


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_86_1.png)


    # Pros


    Easy to set up and pair, it boasts some high-end features for a reasonable price
    and delivers impressive performance


    # Cons


    In our tests, it didn''t deliver anywhere near the maximum 1, 200Mbps speed. You''ll
    also need to shell out for at least two adaptors for it to work


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_86_2.png)


    # Summary


    While it doesn''t live up to its name''s claim, the Solwise PL-1200AV2-PiGGOY
    delivers near 400Mbps speeds that are still incredibly impressive. It''s also
    almost a third of the price of many Gigabit Powerline adapters, while still offering
    high quality features, including its Atheros processor, added encryption and enhanced
    QoS.


    8'
