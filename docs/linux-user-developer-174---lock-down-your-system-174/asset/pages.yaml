    chick.png\")\ntime.sleep(2)\nsense.set_rotation()\n```\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_71_1.png)\n\
    \n# **10** Count down to the game starting\n\nOnce the start image has been displayed,\
