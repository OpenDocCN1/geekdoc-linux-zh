  md: '# Welcome


    to issue 174 of Linux User & Developer


    # This issue


    +   - » Lock down your system

    +   - » Power up your Pi

    +   - » Understand exploits

    +   - » Erlang explained


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_2_0.png)


    Welcome to the latest issue of **Linux User & Developer**, the UK and America’s
    favourite Linux and open source magazine. We all worry about security. As Linux
    users we have less chance of our personal machine being co-opted into a botnet,
    but that doesn’t mean that if it picks something up it can’t merrily forward it
    on to its Windows-based brethren. Then there are the risks inherent to networks
    and the Internet of Things, many based on Linux but made up of mixed architectures.
    We can’t rely on Windows, Android or even Apple devices to look after themselves;
    we know how easy it can be to circumvent their protections. Only Linux offers
    the degree of lockdown and the testing tools we need to achieve a reasonable level
    of security for our machines, networks and data. We take an in-depth look at these
    tools and at pro techniques for using them on p18, and you’ll also find them on
    the disc that accompanies the magazine (digital edition readers can find them
    on our FileSilo repo).


    Meanwhile on p58 we’ll show you how to power up your Pi with some clever interfacing
    and electronic tricks. You’ll learn how to get more from your GPIO pins and how
    to work around power limits safely to supercharge your Pi projects. Plus the rest
    of the issue is packed with tutorials on security, programming, admin and more.


    Enjoy the issue!


    **April Madden, Editor**


