  md: "# A Raspberry Pi photo frame\n\nWith some Python code and a nice display screen,\
    \ you can turn your Raspberry Pi into a very nice photo frame\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_77_0.png)\n\
    \nJoey Bernard is a true Renaissance man, splitting his time between building\
    \ furniture, helping researchers with scientific computing problems and writing\
    \ Android apps\n\nIn a previous article, we looked at using Kivy as a cross-platform\
    \ graphical interface framework that you can use with your Raspberry Pi. Unfortunately,\
    \ we did not have the room to really look at any possible uses. This issue, we\
    \ will look at one possible use, that of displaying photos on some kind of display.\
    \ This might be something you do at home, with family pictures, or it could be\
    \ a slideshow for a business or event. If you didn't get a chance to read the\
    \ previous article, that is okay. We will review enough of the basics that you\
    \ should be able to get off to a running start now. You will obviously need a\
    \ physical display attached to your Raspberry Pi to show the images on. There\
    \ are several options available, such as the official 7-inch touch screen. You\
    \ can also use anything that accepts HDMI as input. You will also need your Raspberry\
    \ Pi to start up the X11 server when it boots up. By default, Raspberry should\
    \ do this. But, if you have disabled the X11 server and only use the console,\
    \ you will need to either re-enable the desktop or just reinstall the OS to have\
    \ a clean start.\n\nThe first step is to be sure that the Kivy packages are installed\
    \ on your Raspberry Pi. If you are running Raspbian, you can do this with the\
    \ command\n\n```\nsudo apt-get install python-kivy python-kivy-examples\n```\n\
    \nThis also installs a collection of good examples that you can use as jumping-off\
    \ points for further projects. With Kivy, you subclass the App class to create\
    \ the graphical interface. The core of the Python script would contain the following\
    \ code\n\n```\nsudo pip install kivy\n```\n\nThe commented section of this core\
    \ code is where we will need to pull out all of the Python code that does the\
    \ work of loading images and displaying them. The first step is to get the list\
    \ of image files to use as part of the photo frame. There are several different\
    \ ways you could do this. If you wanted to simply use all of the images within\
    \ a subdirectory, you could create the list with the code here:\n\n```\n# get\
    \ all images in a subdirectory\n\ncurrent_dir = dirname(__file__)\nfilelist =\
    \ glob(join(current_dir, 'images', '*'))\n```\n\nThis pulls all of the files in\
    \ the subdirectory named 'images'. If your images are scattered around your filesystem,\
    \ it might be better to use a text file containing the locations for each of the\
    \ files you want to use. In this case, you would want to accept the following\
    \ code\n\n```\nin_file = open('filelist.txt')\ntemp = in_file.readlines()\nin_file.close()\n\
    filelist = []\nfor line in temp: \n    filelist.append(line.strip())\n```\n\n\
    We need to use the strip method because the readlines method of the file object\
    \ includes the newline character at the end of each line. We need to remove these\
    \ before we can use them later on when we go to load the images. The next step\
    \ is to actually display the images. The simplest method is to just pop them up\
    \ on the screen, one at a time. But this is a bit boring. Instead, we could use\
    \ the available Carousel object to handle transitioning the image from one to\
    \ another. The following code shows how to create this type of display.\n\n```\n\
    import kivy\nfrom kivy.app import App\nfrom kivy.uix.image import Image\n\nfrom\
    \ kivy.uix.carousel import Carousel\nfrom kivy.clock import Clock\n\nclass PhotoFrameApp(App):\
    \ \n    carousel = Carousel(direction='right', loop=True)\n    def my_callback(self,dt):\n\
    \        self.carousel.load_next()\n    def build(self):\n        # Use the filelist\
    \ generation method of choice\n        for curr_image in filelist: \n        \
    \    image = Image(source=curr_image)\n            self.carousel.add_widget(image)\n\
    \        Clock.schedule_interval(self.my_callback, 2.5)\n        return self.carousel\n\
    if __name__ == \"__main__\": \n    PhotoFrameApp().run()\n```\n\n# Why Python?\n\
    \nIt's the official language of the Raspberry Pi. Read the docs at python.org/doc\n\
    \n> \"You subclass the App class to create the graphical interface\"\n\nIn the\
    \ previous code, the carousel object was set to loop. This means that when you\
    \ reach the end of the list of images, it will simply loop back around to the\
    \ beginning of the list, continuing forever. The next portion defines the callback\
    \ for the updating of the carousel. It simply calls the 'load_next()' method of\
    \ the carousel to pull up the next image on the list. In the 'build()' method,\
    \ the first step is to create the list of image filenames. You could use either\
    \ of the methods suggested earlier, or one of your own devising. Once you have\
    \ that list, you can loop through each of them and create a new Image object for\
    \ each of them. These new Image objects are added to the carousel with the 'add_widget()'\
    \ method. The last step in the 'build()' method is to create a schedule using\
    \ the Clock object. Using the 'schedule_interval()' method, this code will change\
    \ the image every 2.5 seconds. This method is good as a first start, but what\
    \ if you want a more interesting transition between images? This can be done by\
    \ using another set of classes called Screen and ScreenManager. If your list of\
    \ images don't take up too much RAM, you can simply create a new Screen object"
