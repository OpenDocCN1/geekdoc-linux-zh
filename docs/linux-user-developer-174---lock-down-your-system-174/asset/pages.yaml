    [node3.example.com]\naddress 2001:db8:de:caf:bad\n```\n\n```\n\n# 03  Munin master\
    \ web server configuration\n\nWithin the same /etc/munin directory, the next\n\
    \nMunin-node for Windows\n\nMunin-node for Windows (munin-node-win32) is a Windows\
    \ client for the Munin monitoring system. It's written in C++ with most plugins\
