  md: "pressing a push button is supposed to turn a LED on or off. Now, if the LED\
    \ is off and you press and release the push button but it switches closed-closed-open\
    \ instead of closed-open, the LED will switch on and off again very quickly, but\
    \ it would appear that nothing has happened. This is remedied by adding a capacitor\
    \ as shown – a value of 100n is typical if you're using a 1k current-limiting\
    \ resistor. Alternatively, software de-bounce can be selected in the RPLGPIO library.\n\
    \n![](img/1f330653f83dcf0397f7d224ce8bbc16_60_0.png)\n\n# 06  Use multi-way switches\n\
    \nA multi-way rotary switch is handled in just the same way as a single-way switch\
    \ except that it connects to several GPIO pins and requires the interface circuitry\
    \ described earlier for each of those pins. The circuit diagram shows how this\
    \ would be done for a four-way switch. De-bounce capacitors aren't included because\
    \ bounce isn't as much a problem with a multi-way or toggle switch as it is with\
    \ a push button, because of their mechanically latching nature.\n\nOPTICAL AND\
    \ ELECTRICAL CHARACTERISTICS (Ta = 25°C, unless otherwise specified)\n\n| PARAMETER\
    \ | TEST CONDITION | SYMBOL | Min. | Typ. | Max. | UNIT |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- |\n| Forward voltage | IF = 10mA | VF | 1.8 | 2.0\
    \ | 2.2 | V |\n| | IF = 30mA | | 2.0 | 2.2 | 2.4 | V |\n| Average current | |\
    \ Ifav | | 50 | | mA |\n| Reverse voltage | VR = 5V | VR | - | | 4.75 | V |\n\
    | Reverse leakage current | VR = 5V, IF = 5mA | IR | | 30 | 40 | uA |\n| External\
    \ dimensions | 10.0 x 3.8 x 1.5 | | | | | mm |\n\n# 07  Understand LED basics\n\
    \nAn LED (light-emitting diode) is a component that produces light when a current\
    \ flows through it. It's a polarised device, so its anode must always be connected\
    \ to the positive supply and its cathode to the negative supply. A fundamental\
    \ property of an LED is its forward voltage, which is usually between 1.8V and\
    \ 3.3V depending on its colour and type. An LED requires this voltage in order\
    \ to illuminate. Also important is the recommended current, at which its brightness\
    \ and so on will be quoted. All these parameters are shown in the LED's specification\
    \ sheet.\n\n# 08  Limit the current\n\nTurning on a LED from a GPIO pin involves\
    \ configuring the pin as an output and then outputting a logic 1. This puts 3.3V\
    \ on the pin, but this will probably exceed the LED's forward voltage, thereby\
    \ causing its maximum current to be exceeded, destroying the LED\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_60_1.png)\n\
    \n> **Resistor and capacitor values**\n> \n> Often, the values of resistors and\
    \ capacitors are not critical, and typical values can be used. However, when interfacing\
    \ an LED, your **must** work out the value of the current-limiting resistor. Often\
    \ you'll find that you can't buy a resistor of the value you've calculated because\
    \ resistors (and capacitors) only come in certain preferred values.\n> \n> In\
    \ the common E-12 series, these values are 1, 1.0, 1.2, 1.5, 1.8, 2.2, 2.7, 3.3,\
    \ 3.9, 4.7, 5.6, 6.8 and 8.2. However, you may come across additional values from\
    \ other series. These values can be multiplied by powers of ten. So, in the case\
    \ of resistors, in addition to 4.7, for example, you'll find 47, 470, 4.7k, 47k,\
    \ 470k and 4.7M.\n> \n> If a resistor isn't available in a value you've calculated,\
    \ the general rule is to play it safe. In the case of an LED current-limiting\
    \ resistor, this means picking the closest larger value.\n\nand possibly damaging\
    \ the PI. This is prevented by adding a series resistor which drops the excess\
    \ voltage. The resistor must drop the difference between 3.3V and the LED's forward\
    \ voltage. The value is worked out using Ohm's law, as described in the next step.\n\
    \n# 09  Use Ohm's law\n\nFirst you need to decide the drive current for the LED.\
    \ This must be less than the LED's recommended current and less than the GPIO\
    \ pin's maximum of 16mA. Also, the total current drawn from all GPIO pins must\
    \ be less than 50mA. 10mA will often give enough light, even if the recommended\
    \ current is greater. Ohm's law is summarised as V = I R. This can be rearranged\
    \ as R = V / I to give the value of the resistor, R, where V is the voltage that\
    \ needs to be dropped (ie 3.3V minus the LED's forward voltage), and I is the\
    \ drive current. For example, a forward voltage of 2.0V and a current of 10mA\
    \ (0.01A) will require a value of (3.3 – 2.0) / 0.01 = 130 ohms.\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_60_2.png)\n\
    \n![](img/1f330653f83dcf0397f7d224ce8bbc16_60_3.png)\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_60_4.png)\n\
    \n# 10  White and blue LEDs\n\nSome LEDs – mainly blue, white and 'pure green'\
    \ – have forward voltage higher than 3.3V, so they can't be driven directly from\
    \ a GPIO pin. Even if the value is specified as 3.3V, driving it directly from\
    \ a GPIO pin would not be safe or reliable. The solution is to drive it from a\
    \ higher voltage, as discussed later in the 'Exceed limits safely' section (page\
    \ 66)."
