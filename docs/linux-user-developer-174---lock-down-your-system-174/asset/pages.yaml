    # # Your letters


    Questions and opinions about the mag, Linux, and open source


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_93_0.png)


    Above MOFO Linux is an Ubuntu-based distro for those who are concerned about surveillance
