- pgno: 19
  md: '![](img/1f330653f83dcf0397f7d224ce8bbc16_19_0.png)


    # PEN-TEST YOUR NETWORK WITH KALI LINUX


    The ultimate Swiss Army knife of ethical hackers


    The most popular pen-testing distro by far is Kali Linux, the full version of
    which is available on the cover DVD.


    When booting, choose the live mode of Kali for now. The default username is root,
    and its password is toor.


    On first boot you will also be asked if you want to use the default configuration
    (four desktops) or just one. Choose accordingly to load the desktop. Click the
    Applications menu to find that the tools have been neatly categorised for you.
    For instance, the awesome network tool nmap can be found under Information Gathering.
    Do not be alarmed if the same tool is listed twice under separate categories.
    By way of example, nmap is listed both under Information Gathering and Vulnerability
    Analysis, as it''s useful for both.


    As time goes on, you may wish to install additional tools and customise the Kali
    desktop to your liking. If this is the case, consider installing Kali to a USB
    stick with persistence. This option is available from the Boot Screen.


    If you only have access to your target device, consider running Kali in a virtual
    machine or even installing to an inexpensive Raspberry Pi computer in order to
    keep it separate from your personal data. Visit www.kali.org/downloads for virtual
    disk and ‘armhf’ images.


    Once installed, follow the developers'' instructions on how to tweak the Kali
    desktop as well as how to upgrade at www.offensive-security.com/kali-linux/top-10-post-install-tips.


    Many of the tools you will explore in Kali do not have a GUI. Nevertheless they
    are simple to use and by default Kali will load the man page of each one to show
    you all available commands.


    > Although Linux systems cannot be affected by Windows malware, by default they
    will happily forward on malicious files via internet or USB to more vulnerable
    machines'
