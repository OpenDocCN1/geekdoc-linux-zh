  md: "# Warrant canary\n\nLeft Twython is a Python wrapper for Twitter’s API\n\n\
    **05** Install Software on the Pi\nOpen Terminal on your Pi or connect via SSH.\
    \ Run...\n\n```\n```\nsudo apt-get update\nand\nsudo apt-get upgrade\nto update\
    \ Raspbian. Next run\nsudo pip install twython requests requests_oauthlib\n```\n\
    ...to install all necessary software.\n```\n\n**06** Create the Python script\n\
    In the Pi Terminal, run the command...\n\n```\n```\nsudo\n```\n...to create your\
    \ script. Next paste in the following:\n```\n\n```\n```python\n#!/usr/bin/env\
    \ python\nimport sys\nfrom twython import Twython\n\ntweetStr = \"I have not been\
    \ subject to any government gagging orders and/or subpoenas at the time of this\
    \ Tweet.\"\n\n# Insert your API keys and access tokens here\napiKey = 'yourapikey'\n\
    apiSecret = 'yoursecret'\naccessToken = 'youraccesstoken'\naccessTokenSecret =\
    \ 'youraccesstokensecret'\n\napi = Twython(apiKey, apiSecret, accessToken, accessTokenSecret)\n\
    \napi.update_status(status=tweetStr)\n\nprint \"Tweeted: \" + tweetStr\n```\n\
    Replace “yourapikey” and so on with the actual values from the page http://apps.twitter.com.\
    \ Press Ctrl-X, then Y, then Return to save and exit.\n```\n\n**07** Test the\
    \ script\nRun this command...\n\n```\n```\npython canary.py\n```\n...to test the\
    \ script. If successful, it will display a message saying that the Tweet has been\
    \ sent.\n```\n\n**08** Schedule your canary\nThe warrant canary should be set\
    \ to tweet daily unless you intervene. In the Pi Terminal run the following...\n\
    \n```\n```\nsudo crontab -e\n```\nLeft When entering the keys, make sure there\
    \ are no spaces inside the quote marks\n```\n\n# ARE WARRANT CANARIES LEGAL?\n\
    \nThe legal loophole that warrant canaries supposedly exploit has yet to be tested.\
    \ In 2015 Australia outlawed them altogether and other countries may follow suit,\
    \ threatening punishment if the canary isn’t maintained. Prosecution would be\
    \ difficult however without revealing the existence of the very information the\
    \ original warrant was designed to suppress in open court. It’s fine to make one\
    \ as a proof of concept, but you’ll need to research to find out if actually using\
    \ one as an injunction warning system is legal where you are.\n\nLeft This command\
    \ sets the canary to tweet every day at midnight. See https://help.ubuntu.com/community/CronHowto\
    \ for more options\n\nIf this is the first time you’ve run crontab, choose option\
    \ 2 to select an editor.\nScroll to the bottom and paste the following:\n\n```\n\
    ```\n@ 0 * * * /usr/bin/python /home/pi/canary.py\n```\nLeft Use the hash (#)\
    \ symbol to comment out the line starting “tweetStr”\n```\n\n**09** Add a photo\
    \ to your Tweets (Optional)\nRun\n\n```\n```\nsudo nano canary.py\n```\n...to\
    \ edit your Python script. Comment out the line beginning “tweetStr”, then replace\
    \ the lines...\n```\n\n```\n```python\n\"api.update_status(status=tweetStr)\n\n\
    print \"Tweeted: \" + tweetStr\n...with:\n\nmessage = \"No FBI here!\"\nwith open('/home/pi/Downloads/image.jpg',\
    \ 'rb') as photo:\n\n    api.update_status_with_media(status=message, media=photo)\n\
    \nprint \"Tweeted: \" + message\n```\n```\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_76_0.png)\n\
    \n![](img/1f330653f83dcf0397f7d224ce8bbc16_76_1.png)\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_76_2.png)\n\
    \n![](img/1f330653f83dcf0397f7d224ce8bbc16_76_3.png)\n\n![](img/1f330653f83dcf0397f7d224ce8bbc16_76_4.png)"
  merge: -1
  img_proc: true
