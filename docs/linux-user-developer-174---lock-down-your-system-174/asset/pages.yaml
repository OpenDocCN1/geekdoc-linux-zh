- pgno: 64
  md: 'a third GPIO pin is also used to drive the enable pin so that all the LEDs
    can be turned off.


    # 06 Implement a bar display(2)


    So far we have a circuit much like that in step 3, but with a means of turning
    off all the LEDs. The circuit in this step shows how adding three AND gates causes
    binary 00 to drive LED 1; binary 01 to drive LEDs 1 and 2; binary 10 to drive
    LEDs 1, 2 and 3; and binary 11 to drive LEDs 1, 2, 3 and 4. Looking back at the
    truth table for the AND gate, it should be fairly clear how this circuit achieves
    this.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_64_0.png)


    # 07 Drive a seven-segment LED


    Driving a seven-segment LED without external logic requires seven GPIO pins plus
    an eighth you want to drive the decimal point. This can be reduced to four or
    five respectively by using a 74HC4511. This seven-segment encoder turns on the
    appropriate LEDs in the seven-segment display depending on the 4-bit binary value
    on its inputs. An interesting exercise is to work out how to drive a 4-digit seven-segment
    display – it doesn’t need four times as many GPIO pins if you multiplex them.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_64_1.png)


    # 08 Encode a switch


    It’s not just outputs driving LEDs that can benefit from logic. By definition,
    a multi-way switch can only have one of its positions closed at once, so the output
    from a 4-way switch can be encoded as a 2-bit binary number. This is the opposite
    of decoding that we saw in Step 2. A chip that can do this is the 74HC148, which
    is actually an 8-to-3 line encoder, but we can use it as a 4-to-2 bit encoder
    by wiring its eight unused inputs to 3.3V.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_64_2.png)


    # 09 Connect unused inputs


    Very often when you use logic chips, only part of the chip will be used. For example,
    if you use a 74HC00 quad NAND gate and you use only two of the four gates, two
    of them will be left unused. This is not a problem, but you shouldn’t leave unused
    inputs unconnected as they can oscillate, causing the chip to draw an excessive
    current and overheat. The solution is to wire any unused inputs to either 3.3V
    or 0V. Unused outputs is OK and should be left unconnected.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_64_3.png)


    # 10 Use 5V logic


    Occasionally you’ll want to interface 5V logic circuitry, which you can’t connect
    directly to your Pi. There are several level converter chips, but most are unidirectional.
    However, Texas Instruments’ TXB0102, TXB0104 and TXB0108 chips (2, 4 and 8 channels,
    respectively) are bidirectional, which means that they’ll work if the GPIO pins
    are configured as input or outputs. The Texas devices offer the TXB0104 and TXB0108
    on breakout boards which are much easier to handle.


    ![](img/1f330653f83dcf0397f7d224ce8bbc16_64_4.png)


    # Power supplies


    If you interface circuitry and external devices require a supply of 3.3V or 5V,
    it can be provided by pins in the GPIO header. Even so, if you have a significant
    amount of external circuitry, it would be good practice to wire capacitors between
    the supply and ground to avoid fluctuations to the supply that could cause the
    circuit to malfunction. Use a single 100µF capacitor plus several 100nF ceramic
    capacitors, one per IC in your circuit, and wired close to those ICs. If you need
    a supply other than 3.3V and 5V, the easiest solution is to use a battery or,
    perhaps, a pack of several 1.5V AA batteries. If you need a voltage that can’t
    easily be obtained with batteries, or you want to create several supply voltages
    from one battery, you can use a component called a voltage regulator.'
