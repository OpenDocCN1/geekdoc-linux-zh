  md: '# #/2. Philosophy


    Shell script programming has a bit of bad press amongst some Unix systems administrators.
    This is normally because of one of two things:


    +   - The speed at which an interpreted program will run as compared to a C program,
    or even an interpreted Perl program.

    - Since it is easy to write a simple batch-job type shell script, there are a
    lot of poor quality shell scripts around.


    It is partly due to this that there is a certain machismo associated with creating
    *good* shell scripts. Scripts which can be used as CGI programs, for example,
    without losing out too much in speed to Perl (though both would lose to C, in
    many cases, were speed the only criterion).


    There are a number of factors which can go into good, clean, quick, shell scripts.


    +   - The most important criteria must be a clear, readable layout.

    - Second is avoiding unnecessary commands.


    A clear layout makes the difference between a shell script appearing as "black
    magic" and one which is easily maintained and understood.

    You may be forgiven for thinking that with a simple script, this is'
  merge: -1
  pgno: 10
