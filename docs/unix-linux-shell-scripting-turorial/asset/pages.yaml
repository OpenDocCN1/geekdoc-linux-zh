  md: 'echo "All users with the word \"steve\" in their passwd"

    echo "Entries are: " tr '' '' ''\012''

    echo \$steves | tr '' '' ''\012''


    Note that tr translated the spaces into octal character 012(NEWLINE). Another
    common use of tr is its use of range... it can

    convert text to upper or lower case, for example:


    ```

    #!/bin/sh

    grep -i steve /etc/passwd | cut -d: -f1

    echo "All users with the word \"steve\" in their passwd"

    echo "Entries are: " tr '' '' ''\012''

    echo \$steves | tr '' '' ''\012'' | tr ''[a-z]'' ''[A-Z]''

    ```


    We have added a translation of [a-z] to [A-Z]. Note that

    there are exactly the same number of values in the range a-z as A-Z. This can
    translate any character falling into the ASCII

    range A-Z ... in other words, converting lowercase letters

    into uppercase. tr is actually cleverer than this: tr [:lower:] [:upper:] would
    do the job just as well, and possibly more

    readably. It''s also not as portable; not every tr can do this.


