  md: 'more common external programs to be used.


    grep is an extremely useful utility for the shell script programmer.

    An example of grep would be:


    ```

    #!/bin/sh

    steves=`grep -i steve /etc/passwd | cut -d: -f1`

    echo "All users with the word \"steve\" in their passwd"

    echo "Entries are: $steves"

    ```


    This script looks fine if there''s only one match. However, if there

    two lines in /etc/passwd with the word "steve" in them, then

    the interactive shell will display:


    ```

    $ grep -i steve /etc/passwd

    steve:x:5062:509:Steve Parker:/home/steve:/bin/bash

    fred:x:5068:512:Fred Stevens:/home/fred:/bin/bash

    $ grep -i steve /etc/passwd | cut -d: -f1

    steve

    fred

    ```


    But the script will display:


    Entries are: steve fred


    By putting the result into a variable we have changed the

    NEWLINEs into spaces; the sh manpage tells us that the first

    character in $IFS will be used for this purpose. IFS is

    <space><tab><cr> by default. Maybe though we wanted to

    keep the NEWLINEs: It could look better if we made the spaces

    tointo NEWLINEs.... This is a job for tr:


    ```

    #!/bin/sh

    steves=`grep -i steve /etc/passwd | cut -d: -f1`

    ```'
