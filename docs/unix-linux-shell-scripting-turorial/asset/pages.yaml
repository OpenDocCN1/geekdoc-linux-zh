  md: '# Search


    When the user searches for "Smith", the script should identify and display all
    "Smith" records. It is up to you whether this search is in Surname only, or in
    the entire record.


    # Add


    Input the data (Name, Surname, Email, Phone, etc). If it appears to be a duplicate,
    for bonus points offer to edit the existing record. Save the record into the data
    file when the user confirms.


    # Remove


    Enter search criteria, narrow it down to one, confirm, then remove that record.


    # Edit


    As remove, but use the existing record for default entries. For example, if you
    change the phone number, the session may look like this, if you only want to change
    John Smith''s Phone Number:


    ```

    Name [ John Smith ]

    Phone [ 12345 ] 54321

    Email [ joe@smith.org.uk ]

    ```


    Remove the old record, and add the new one. Alternatively, edit the existing record,
    though this may be more difficult.'
