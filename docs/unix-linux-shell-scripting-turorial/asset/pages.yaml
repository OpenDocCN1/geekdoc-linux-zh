  md: 'Another special variable is $?. This contains the exit value of the last run
    command. So the code:


    ```

    #!/bin/sh

    /usr/local/bin/my-command

    if [ "$?" -ne "0" ]; then

    echo "Sorry, we had a problem there!"

    fi

    ```


    will attempt to run /usr/local/bin/my-command which should exit with a value of
    zero if all went well well, and a nonzero value on failure. We can then handle
    this by checking the value of $? after calling the command. This helps make scripts
    robust and more intelligent. Well-behaved applications should return zero on success.
    Hence the quote:


    > “One of the main causes of the fall of the Roman Empire was that, lacking zero,
    they had no way to indicate successful termination of their C Programs.” (Robert
    Firth)


    The other two main variables set for you by the environment are $$ and $. These
    are both process numbers. The $$ variable is the PID (Process IDentifier) of the
    currently running shell. This can be useful for creating temporary files, such
    as /tmp/my-script.$$ which is useful if many instances of the script could be
    run at the same time, and they all need their own temporary files. The $! variable
    is the PID of the last run background process. This is useful to keep track of
    the process as it gets on with its job.


    Another interesting variable is IFS. This is the Internal Field Separator. The
    default value is SPACE TAB NEWLINE, but if you are changing it, it''s easier to
    take a copy, as shown:'
