    # ksh


    You can make ksh more usable by adding history commands, either in vi or emacs
    mode. There are a number of ways to do this, depending on the exact circumstances.
    set -o vi, ksh -o vi, or exec ksh -o vi (where "vi" could be replaced by "emacs")
    if you prefer emacs mode).


    If you want to start a ksh session from another interactive shell, you can just
    call ksh like this:


    ```

    csh% # oh no, it''s csh!

    csh% ksh

    ksh$ # phew, that''s better

    ksh$ # do do some stuff under ksh

    ksh$ # then leave it back at the csh prompt:

    ksh$ exit

    csh%

    ```


    This will start a new ksh session, which you can exit from and return to the previous
    shell. Alternatively, you could replace the csh (or whatever shell) with a ksh
    shell, with the exec command:


    ```

    csh% # oh no, it''s csh!

    csh% exec ksh

    ksh$ # do some stuff under ksh

    ksh$ exit

    ```


    login:


    The difference here is that you don''t get the csh session back.


    The good stuff is the history:


    ```

    csh% ksh

    ksh$ set -o vi

    ksh$ # You can now edit the history with vi-like

    ```


