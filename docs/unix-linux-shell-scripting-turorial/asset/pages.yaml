- img_proc: true
  md: 'Line 4 identifies itself as function declaration by ending in ( ). This is
    followed by {, and everything following to the matching } is taken to be the code
    of that function. This code is not executed until the function is called. Functions
    are read in, but basically ignored until they are actually called.


    Note that for this example the userid and passwd commands have been prefixed with
    echo - this is a useful debugging technique to check that the right commands would
    be executed. It also means that you can run the script without being root or adding
    dodgy user accounts to your system!


    We have been used to the idea that a shell script is executed sequentially. This
    is not so with functions. In this case, the function add_a_user is read in and
    checked for syntax, but not executed until it is explicitly called. Execution
    starts with the echo statement "Start of script...". The next line, add_a_user
    bob letmein Bob Holness is recognised as a function call the add_a_user function
    is entered and starts executing with certain additions to the environment:


    ```

    $1=bob

    $2=letmein

    $3=Bob

    $4=Holness

    $5=the

    $6=presenter

    ```


    So within that function, $1 is set to bob, regardless of what $1 may be set to
    outside of the function. So if we want to refer to the "original" $ inside the
    function, we have to assign a name to it - such as: A=$1 before we call the function.
    Then, within the function, we can refer to $A. We use the shift command again
    to get the $3 and onwards parameters into $@. The function then adds the user
    and sets their password. It echoes a comment to that effect, and returns control
    to the next line of the main code.'
  merge: -1
  pgno: 58
