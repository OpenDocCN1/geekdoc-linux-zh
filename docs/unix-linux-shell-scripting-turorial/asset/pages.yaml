  md: 'not significant a problem, but two things here are worth

    bearing in mind.


    +   1. First, a simple script will, more often than anticipated,

    grow into a large, complex one.

    2. Secondly, if nobody else can understand how it works, you

    will be lumbered with maintaining it yourself for the rest

    of your life!


    Something about shell scripts seems to make them particularly

    likely to be badly indented, and since the main control structures

    are if/then/else and loops, indentation is critical for

    understanding what a script does.


    One of the major weaknesses in many shell scripts is lines such

    as as:


    ```

    cat /tmp/myfile | grep "mystring"

    ```


    which would run much faster as:


    ```

    grep "mystring" /tmp/myfile

    ```


    Not much, you may consider; the OS has to load up the

    /bin/grep executable, which is a reasonably small 75600 bytes

    on my system, open a pipe in memory for the transfer, load and

    run the /bin/cat executable, which is an even smaller 9528 bytes

    on my system, attach it to the input of the pipe and let it run.


    Of course, this kind of thing is what the OS is for, and it''s

    normally pretty efficient at doing it. But if this command were in

    a loop running many times over, the saving of not locating and

    loading the cat executable, setting up and releasing the pipe, can

    make some difference, especially in, say, a CGI environment

