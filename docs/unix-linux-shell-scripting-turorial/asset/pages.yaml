  md: "Note: Some shells also accept \"==\" for string comparison; this is not portable,\
    \ a single \"=\" should be used for strings, or \"-eq\" for integers.\n\ntest\
    \ is a simple but powerful comparison utility. For full details, run man test\
    \ on your system, but here are some usages and typical examples.\n\ntest most\
    \ often invoked indirectly via the if and while statements. It is also the reason\
    \ you will come into difficulties if you create a program called test and try\
    \ to run it, as this shell builtin will be called instead of your program! The\
    \ syntax for if...then...else... is:\n\n```\nif [ ... ]\nthen\n    # if-code\n\
    else\n    # else-code\nfi\n```\n\nNote that fi is backwards! This is used again\
    \ later with case and esac. Also, be aware of the syntax - the \"if [ ... ]\"\
    \ and the \"then\" commands must be on different lines. Alternatively, the semicolon\
    \ \";\" can separate them:\n\n```\nif [ ... ]; then\n    # do something\nfi\n\
    ```\n\nYou can also use the elif, like this:\n\n```\nif [ something ]; then\n\
    \    echo \"Something\"\nelif [ something_else ]; then\n    echo \"Something else\"\
    \nelse\n    echo \"None of the above\"\nfi\n```"
