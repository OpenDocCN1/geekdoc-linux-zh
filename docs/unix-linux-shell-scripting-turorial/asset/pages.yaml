  md: "checking in shell scripts. This method may not be the most suitable to your\
    \ particular command-sequence, or may be unmaintainable. Below, we shall investigate\
    \ two alternative approaches.\n\nAs a second approach, we can tidy this somewhat\
    \ by putting the test into a separate function, instead of littering the code\
    \ with lots of 4-line tests:\n\n```\n#!/bin/sh\n# A Tidier approach\n\ncheck_errs()\
    \ {\n  # Function. Parameter 1 is text to display on failure.\n  if [ \"${1}\"\
    \ -ne \"0\" ]; then\n    echo \"ERROR #${1} : ${2}\"\n    # as a bonus, make our\
    \ script exit with the right error code.\n    exit ${1}\n  fi\n}\n```\n\n### main\
    \ script starts here ###\ngrep \"^{1}:\" /etc/passwd > /dev/null 2>&1\ncheck errors\
    \ $ \"User ${1} not found in /etc/passwd\nUSERNAME= grep \"^\\${1}:\" /etc/passwd|cut\
    \ -d:\" -f1\ncheck errors $ \"Cut returned an error\"\necho \"USERNAME: $USERNAME\"\
    \ncheck_errs $ \"echo returned an error - very strange!\"\n\nThis allows us to\
    \ test for errors 3 times, with customised error messages, without having to write\
    \ 3 individual tests. By writing the test routine once, we can call it as many\
    \ times as we wish, creating a more intelligent script, at very little expense\
    \ to the programmer. Perl programmers will recognise this as being similar to\
    \ the die command in Perl."
