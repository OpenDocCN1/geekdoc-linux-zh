  md: 'A function will be called in a sub-shell if its output is piped somewhere else
    - that is, "myfunc 1 2 3 | tee out.log" will still say "x is 1" the second time
    around. This is because a new shell process is called to pipe myfunc(). This can
    make debugging very frustrating; Astrid had a script which suddenly failed when
    the "tee" was added, and it is not immediately obvious why this must be. The tee
    has to be started up before the function to the left of the pipe; with the simple
    example of "ls | grep foo", then grep ls starts. In the shell script, the shell
    has already been started before we even knew we were going to pipe through tee,
    so the operating system has to start tee, then start a new shell to call myfunc().
    This is frustrating, but well worth being aware of.


    Functions cannot change the values they have been called with, either - this must
    be done by changing the variables themselves, not the parameters as passed to
    the script. An example shows this more clearly:'
