  md: '# #!/ch/14


    # ## 14. Hints and Tips


    Unix is full of text manipulating utilities, some of the more powerful of which
    we will now discuss in this section of this tutorial. The significance of this,
    is that virtually everything under Unix is text. Virtually anything you can think
    of is controlled by either a text file, or by a command-line-interface (CLI).
    The only thing you can''t automate using a shell script is a GUI-only utility
    or feature. And under Unix, there aren''t too many of them!


    You may have heard it said, that, with *nix, "everything is a file" - it''s true.


    We have a few subsections here ... what follows is general advice, hints and tips.


    # ## CGI Scripting


    For CGI programming, there are a couple of extra variables to be aware of, and
    a few tips I''ve picked up along the way. Although the shell may not seem the
    obvious choice for CGI programming, it is quick to write and simple to debug.
    As such, it makes for an ideal prototyping language for CGI scripts, and fine
    for simple or little-used CGI scripts permanently cookie.cgi - which calls fortune.cgi'
  merge: -1
  pgno: 66
- img_proc: true
  md: "# Exit Codes\n\nExit codes are a number between 0 and 255, which is returned\
    \ by any Unix command when it returns control to its parent process. Other numbers\
    \ can be used, but these are treated modulo 256, so exit 10 is equivalent to exit\
    \ 246, and exit 257 is equivalent to exit 1.\n\nThese can be used within a shell\
    \ script to change the flow of execution depending on the success or failure of\
    \ commands executed. This was briefly introduced in Chapter 10, “Variables - Part\
    \ II”. Here we shall look in more detail in the available interpretations of exit\
    \ codes.\n\nSuccess is traditionally represented with exit 0; failure is normally\
    \ indicated with a non-zero exit-code. This value can indicate different reasons\
    \ for failure. For example, GNU grep returns 0 on success, 1 if no matches were\
    \ found, and 2 for other errors (syntax errors, non-existent input files, etc).\n\
    \nWe shall look at three different methods for checking error status, and discuss\
    \ the pros and cons of each approach.\n\nFirstly, the simple approach:\n\n```\n\
    ```\n#!/bin/sh\n# First attempt at checking return codes\nUSERNAME=`grep \"^${1}:\"\
    \ /etc/passwd|cut -d:\" -f1`\nif [ \"$?\" -ne \"0\" ]; then\n  echo \"Sorry, cannot\
    \ find user ${1} in /etc/passwd\"\n  exit 1\nfi\nNAME=`grep \"^${1}:\" /etc/passwd|cut\
    \ -d:\" -f5`\nHOMEDIR=`grep \"^${1}:\" /etc/passwd|cut -d:\" -f6`\n\necho \"USERNAME:$USERNAME\"\
    \necho \"NAME: $NAME\"\necho \"HOMEDIR:$HOMEDIR\"\n```\n```"
  merge: -1
  pgno: 67
- img_proc: true
  md: "This script works fine if you supply a valid username in /etc/passwd. However,\
    \ if you enter an invalid code, it does not what you might at first expect - it\
    \ keeps running, and just shows:\n\nUSERNAME:\nNAME:\nHOMEDIR:\n\nWhy is this?\
    \ As mentioned, the $? variable is set to the return code of the last executed\
    \ command. In this case, that is cut. had no problems which it feels like reporting\
    \ - as far as I can tell from testing, and re-reading the documentation, cut returns\
    \ whatever happens! It was fed an empty string, and did its job - returned the\
    \ first field of its input, which just had happened to be the empty string. So\
    \ what do we do? If we have an error here, grep will report it, not cut. Therefore,\
    \ we have to test grep's return code, not cut's.\n\n```\n#!/bin/sh\n# Second attempt\
    \ at checking return codes\ngrep \"^${1}:\" \\ /etc/passwd > /dev/null 2>&1\n\
    if [ \"$$\" -ne \"0\" ]; then\n  echo \"Sorry, cannot find user ${1} in /etc/passwd\"\
    \n  exit 1\nfi\nUSERNAME=`grep \"^${1}:\" \\ /etc/passwd|cut -d:\"\" -f1`\nNAME=`grep\
    \ \"^${1}:\" \\ /etc/passwd|cut -d:\"\" -f5`\nHOMEDIR=grep \"^${1}:\" \\ /etc/passwd|cut\
    \ -d:\"\" -f6`\n```\n\n```\necho \"USERNAME: $USERNAME\"\necho \"NAME: $NAME\"\
    \necho \"HOMEDIR: $HOMEDIR\"\n```\n\nThis fixes the problem for us, though at\
    \ the expense of slightly longer code. That is the basic way which textbooks might\
    \ show you, but it is far from being all there is to know error-\n\nShell Scripting\
    \ Tutorial    Page 67"
  merge: -1
