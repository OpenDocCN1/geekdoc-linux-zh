- img_proc: true
  md: 'This script runs like this if you accept the default by pressing "RETURN":


    ```

    steve$ ./name.sh

    What is your name [ steve ] RETURN

    Your name is : steve

    ```


    ... or, with user input:


    ```

    steve$ ./name.sh

    What is your name [ steve ] foo

    Your name is : foo

    ```


    This could be done better using a shell variable feature. By using curly braces
    and the special ":-\ usage, you can specify a default value to use if the variable
    is unset


    ```

    echo -en "What is your name [ `whoami` ]"

    read myname

    echo "Your name is : ${myname:-`whoami`}"

    ```


    This could be considered a special case – we''re using the output of the whoami
    command, which prints your login name (UID). The more canonical example is to
    use fixed text, like this:


    ```

    echo "Your name is : ${myname:-John Doe}"

    ```


    As with other use of the backticks `whoami` runs in a subshell, so any cd commands,
    or setting any other variables, within the backticks, will not affect the currently-running
    shell.


    # Using and Setting Default Values


    There is another syntax, ":=", which sets the variable to the default if it is
    undefined:


    ```

    echo "Your name is : ${myname=John Doe}"

    ```'
