  md: 'echo "Hello World" # This is a comment, too!


    This time it works. You probably expected that, too, if you experience of other
    programming languages. But the key to understanding what is going on with more
    complex command and shell script, is to understand and be able to explain: Why?
    echo has now been called with just one argument - the string "Hello World". It
    prints out exactly.

    The point to understand here is that the shell parses the arguments before passing
    them on to the program being called. In this case, it strips the quotes but passes
    the string as one argument.

    As a final example, type in the following script. Try to predict the outcome before
    you run it:


    first2.sh^4


    ```

    #!/bin/sh

    # This is a comment!

    echo "Hello World" # This is a comment, too!

    echo "Hello World"

    echo "Hello World * World"

    echo Hello * World

    echo Hello World

    echo "Hello" " World

    echo Hello " " World

    echo "Hello \*\" World"

    echo hello` world

    echo ''hello'' world

    ```


    Is everything as you expected? If not, don''t worry! These are just some of the
    things we will be covering in this tutorial ... and yes, we will be using more
    powerful commands than echo!


