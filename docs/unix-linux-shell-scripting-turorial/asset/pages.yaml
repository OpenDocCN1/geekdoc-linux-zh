    ```


    You will probably have expected that! You could even just run:


    ```

    $ echo Hello World

    Hello World

    $

    ```


    Now let''s make a few changes.

    First, note that echo puts ONE space between its parameters. Put

    a few spaces between "Hello" and "World". What do you expect

    the output to be? What about putting a TAB character between

    them?

    As always with shell programming, try it and see.

    The output is exactly the same! We are calling the echo program

    with two arguments; it doesn''t care any more than cp does about

    gaps in between them. Now modify the code again:


    ```

    #!/bin/sh

