  md: "As a third approach, we shall look at a simpler and cruder method. I tend to\
    \ building Linux kernels - simple automations which, if they go well, should just\
    \ get on with it, but when things go wrong, tend to require the operator to do\
    \ something intelligent (ie, that a script cannot do):\n\n```\n#!/bin/sh\ncd /usr/src/linux\
    \ &&& make modules && \\\nmake dep && make bzImage && make modules && \\\nmake\
