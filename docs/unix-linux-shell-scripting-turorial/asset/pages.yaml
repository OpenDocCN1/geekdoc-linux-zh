  md: "# #!/ch/9\n9. Case\n\nThe case statement saves going through a whole set of\
    \ if .. then .. else statements. Its syntax is really quite simple:\n\ntalk.sh¹⁸\n\
    \n```\n#!/bin/sh\necho \"Please talk to me ...\"\nwhile :\n  read INPUT_STRING\n\
    \  case $INPUT_STRING in\n    hello)\n      echo \"Hello yourself!\"\n      ;;\n\
    \    bye)\n      echo \"See you again!\"\n      break\n      ;;\n    *)\n    \
    \  echo \"Sorry, I don't understand\"\n      ;;\n  esac\ndone\necho\necho \"That's\
