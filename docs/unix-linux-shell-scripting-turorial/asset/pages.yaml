  md: '# #!/ch/1


    # 1. Introduction


    # Purpose Of This Tutorial


    This tutorial is written to help people understand some of the basics of shell
    script programming, and hopefully to introduce some of the possibilities of simple
    but powerful programming available under the bourne shell. As such, it has been
    written as a basis for one-on-one or group tutorials and exercises, and as a reference
    for subsequent use.


    # A Brief History of sh


    Steve Bourne wrote the Bourne shell which appeared in the Seventh Edition Bell
    Labs Research version of Unix. Many other shells have been written; this particular
    tutorial concentrates on the Bourne and the Bourne Again shells. Other shells
    include the Korn Shell (ksh), the C Shell (csh), and variations such as tcsh.
    This tutorial does not cover those shells.


    # Audience


    This tutorial assumes some prior experience; namely:


    +   - Use of an interactive Unix shell

    - Minimal programming knowledge - use of variables, functions, is useful background
    knowledge'
