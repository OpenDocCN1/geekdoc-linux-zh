  md: '# #!/ch/13


    # 13. Functions


    Oneoften-overlooked feature of Bourne shell script programming is that you can
    easily write functions for use within your script. This is generally done in one
    of two ways; with a simple script, the function is simply declared in the same
    file as it is called. However, when writing a suite of scripts, it is often easier
    to write a "library" of useful functions, and source that file at the start of
    the other scripts which use the functions. This will be shown later. The method
    is the same however it is done; we will primarily be using the first way here.
    The second (library) method is basically the same, except that the command


    ```

    . ./library.sh

    ```


    goes at the start of the script.


    There could be some confusion about whether to call shell functions *procedures*
    or *functions*; the definition of a function is traditionally that it returns
    a single value, and does not output anything. A procedure, on the other hand,
    does not return a value, but may produce output. A shell function may do neither,
    either or both. It is generally accepted that in shell scripts they are called
    functions.


    A function may return a value in one of four different ways:


    +   - Change the state of a variable or variables

    - Use the exit command to end the shell script'
  merge: -1
  pgno: 56
- img_proc: true
  md: '+   - Use the return command to end the function, and return the supplied value
    to the calling section of the shell

    - echo output to stdout, which will be caught by the caller just as c=`expr a
    + $b` is caught


    This is rather like C, in that exit stops the program, and return controls to
    the caller. The difference is that a shell function cannot change its parameters,
    though it can change global parameters.


    A simple script using a function would look like this:


    function.sh²²


    ```

    #!/bin/sh

    # A simple script with a function...

    add_a_user()

    {

    USER=$1

    PASSWORD=$2

    shift; shift;

    # Having shifted twice, the rest is now comments ...

    COMMENTS=$@

    echo "Adding user $USER .."

    echo useradd -c "$COMMENTS" $USER

    echo echo passwd $USER $PASSWORD

    echo "Added user $USER ($COMMENTS) with pass $PASSWORD"

    }

    ###

    # Main body of script starts here

    ###

    echo "Start of script..."

    add_a_user bob letmein Holness the presenter

    add_a_user fred badpassword Fred Durst the singer

    add_a_user bilko worseorsepassword Sgt. Bilko the role model

    echo "End of script..."

    ```


    22 function.sh.txt'
