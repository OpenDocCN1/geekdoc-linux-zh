  md: '... which I, personally, find pretty difficult to follow.


    The && and || || operators are the shell''s equivalent of AND and OR tests. These
    can be thrown together as above, or:


    ```

    #!/bin/sh

    cp /foo /bar && echo Success || echo Failed

    ```


    This code will either echo Success or Failed depending on whether or not the cp
    command was successful. Look carefully at this; the construct is:


    ```

    command && command-to-execute-on-success \

    || command-to-execute-on-failure

    ```


    Only one command can be in each part. This method is handy for simple success
    / fail scenarios, but if you want to check on the status of the echo commands
    themselves, it is easy to quickly become confused about which && and || applies
    to which command. It is also very difficult to maintain. Therefore this construct
    is only recommended for simple sequencing of commands.


    In earlier versions, I had suggested that you can use a subshell to execute multiple
    commands depending on whether the cp command succeeded or failed:


    ```

    cp /foo /bar && \

    ( echo Success ; echo Success part II ; ) || \

    ( echo Failed ; echo Failed part II )

    ```


    But in fact, Marcel found out that this does not work properly. The syntax for
    a subshell is:


    ```

    ( command1 ; command2; command3 )

    ```'
  merge: -1
  pgno: 71
- img_proc: true
  md: "The return code of the subshell is the return code of the final command (command3\
    \ in this example). That return code will affect the overall command. So the output\
    \ of this script:\n\n```\ncp /foo /bar && \\\n  echo Success part II; /bin/false\
    \ || \\\\\n  echo Failed; echo Failed part II\nIs that it runs the Success part\
    \ (because cp succeeded, and then - because /bin/false returns failure, it also\
    \ executes the Failure part:\n```\n\nSuccess\nSuccess part II /\nFailed\nFailed\
    \ part II\n\nSo if you need to execute multiple commands as a result of the status\
    \ of some other condition, it is better (and much clearer) to use the standard\
    \ if, then, else syntax.\n\n# Simple Expect Replacement\n\nHere is a simple replacement\
    \ for expect. A number of people have asked how this is done, and inspired by\
    \ Sun's example I showed in Hints and Tips which is used in Sun Microsystems'\
    \ Explorer utility, here is a very simple version of expect²⁷.\n\nThe syntax of\
    \ expect.txt is very simple:\n\n```\nS command E[delay] expected_text\n```\n\n\
    So a command is marked by starting with \"S\" (for Send), and the expected result\
    \ is marked with \"E\". Since some commands can take a while to complete, it is\
    \ possible to specify a delay before expecting the result: \"E10 $\\$ will wait\
    \ for 10 seconds before expecting a dollar prompt. If the expected result is not\
    \ found, the script will wait one second, try again, then wait two seconds, then"
  merge: -1
  pgno: 72
- img_proc: true
  md: "three seconds, until either the expected text is found, or it hits a\nmaximum\
    \ - as defined by MAX_WAITS. The delay is optional, so\n\"E $\" will expect a\
    \ prompt immediately.\n\nNote if MAX_WAITS=5, the maximum delay will not be five,\
