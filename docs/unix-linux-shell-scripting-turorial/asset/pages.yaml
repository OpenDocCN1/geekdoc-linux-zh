    Note that we can use the semicolon (;) to join two lines together. This is often
    done to save a bit of space in simple if statements. The backslash simply tells
    the shell that this is not the end of the line, but the two (or more) lines should
    be treated as one. This is useful for readability. It is customary to indent the
    following line.


    As we see from these examples, test can perform many tests on numbers, strings,
    and filenames.


    Thanks to Aaron for pointing out that -a, -e (both meaning "file exists"), -s
    (file is a Socket), -nt (file is newer than), -ot (file is older than), -ef (paths
    refer to the same file) and -0 (file is not owned by user), are not available
    in the traditional Bourne shell (eg, /bin/sh on Solaris, AIX, HPUX, etc).


    There is a simpler way of writing if statements: The && || commands give code
    to run if the result is true, or false, respectively.


    ```

    #!/bin/sh

    [ $X -ne 0 ] && echo "X isn''t zero" || echo "X is zero"

    [ -f $X ] && echo "X is a file" || echo "X is not a file"

    [ -n $X ] && echo "X is of non-zero length" || \

    echo "X is of zero length"

    ```'
