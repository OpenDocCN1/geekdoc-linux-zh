    echo $fooshine      # $fooshine is undefined\necho ${foo}shine     # displays\
    \ the word \"sunshine\"\n```\n\nThat's not all, though - these fancy brackets\
    \ have another, more powerful use. We can deal with issues of variables being\
    \ undefined or null (in the shell, there's not much difference between undefined\
    \ and null).\n\n# Using Default Values\n\nConsider the following code snippet\
    \ which prompts the user for input, but accepts defaults:\n\n```\n#!/bin/sh\n\
    echo -en \"What is your name [ `whoami` ] \"\nread myname\nif [ -z \"$myname\"\
    \ ]; then\n  myname=`whoami`\nfi\necho \"Your name is : $myname\"\n```\n\nPassing\
    \ the \"-en\" to echo tells it not to add a linebreak (for bash and csh). For\
    \ Dash, Bourne and other compliant shells, you use a \"\\c at the end of the line,\
    \ instead. Ksh understands both forms."
