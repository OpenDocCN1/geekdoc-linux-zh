  md: "# Scope of Variables\n\nProgrammers used to other languages may be surprised\
    \ at the scope rules for shell functions. Basically, there is no scoping, other\
    \ than the parameters ($1, $2, $@, etc). Taking the following simple code segment:\n\
    \n```\n#!/bin/sh\n\nmyfunc()\n{\n    echo \"I was called as : $@\"\n    x=2\n\
    }\n\n### Main script starts here\n\necho \"Script was called with $@\"\nx=1\n\
    echo \"x is $x\"\nmyfunc 1 2 3\necho \"x is $x\"\n```\n\nThe script, when called\
    \ as scope.sh a b c, gives the following output:\n\n```\nScript was called with\
    \ a b c\nx is 1\nI was called as : 1 2 3\nx is 2\n```\n\nThe $@ parameters are\
    \ changed within the function to reflect how the function was called. The variable\
    \ x, however, is effectively a global variable - myfunc changed it, and that change\
    \ is still"
  merge: -1
