    the default catch-all condition; it is not required, but is often

    useful for debugging purposes even if we think we know what

    values the test variable will have.


    The whole case statement is ended with esac (case backwards!)

    then we end the while loop with a done.


    That''s about as complicated as case conditions get, but they can

