- img_proc: true
  md: 'This assigns the string "Hello World" to the variable MY_MESSAGE then echoes
    the value of the variable.

    Note that we need the quotes around the string Hello World. Whereas we could get
    away with echo Hello World because echo will take any number of parameters, a
    variable can only hold one value, so a string with spaces must be quoted so that
    the shell knows to treat it as all one. Otherwise, the shell will try to execute
    the command World after assigning MY_MESSAGE=Hello.


    The shell does not care about types of variables; they may store strings, integers,
    real numbers - anything you like.

    People used to Perl may be quite happy with this; if you''ve grown up with C,
    Pascal, or worse Ada, this may seem quite strange. In truth, these are all stored
    as strings, but routines which expect a number can treat them as such.

    If you assign a string to a variable then try to add 1 to it, you will not get
    away with it:


    ```

    $ x="hello"

    $ expr $x + 1

    expr: non-numeric argument

    $

    ```


    This is because the external program expr only expects numbers. But there is no
    syntactic difference between:


    ```

    MY_MESSAGE="Hello World"

    MY_SHORT MESSAGE=hi

    MY_NUMBER=1

    MY_PI=3.142

    MY_OTHER_PI="3.142"

    MY_MIXED=123abc

    ```


    Note though that special characters must be properly escaped to avoid interpretation
    by the shell.

    This is discussed further in Chapter 6, "Escape Characters".'
  merge: -1
