  md: "```\n#!/bin/sh\n\ntrap cleanup 1 2 3 6\n\ncleanup()\n{\n    echo \"Caught Signal\
    \ ... cleaning up.\"\n    rm -rf /tmp/temp.*$\\$\n    echo \"Done cleanup ...\
    \ quitting\"\n    exit 1\n}\n```\n\n```\n### main script\nfor i in *\ndo\n   \
    \ sed s/FOO/BAR/g $i > /tmp/temp_${i}.$\\$ && mv /tmp/temp_${i}.$\\$ $i\ndone\n\
    ```\n\nThe trap statement tells the script to run cleanup() on signals 1, 2, 3\
    \ or 6. The most common one (CTRL-C) is signal 2 (SIGINT). This can also be used\
    \ for quite interesting purposes:\n\n```\n#!/bin/sh\n\ntrap 'increment' 2\n\n\
    increment()\n{\n    echo \"Caught SIGINT ...\"\n    X=`expr ${X}\\` + 500\n  \
    \  if [ \"$\\${X}\" -gt \"2000\" ]\n    then\n        echo \"Okay, I'll quit ...\"\
    \n        exit 1\nfi}\n```\n\n```\n### main script\nX=0\nwhile\ndo\n    echo \"\
