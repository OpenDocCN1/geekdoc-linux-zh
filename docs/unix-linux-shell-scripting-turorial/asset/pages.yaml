  md: "This syntax is possible because there is a file (or shell-builtin) called [\
    \ which is linked to test. Be careful using this construct, though, as overuse\
    \ can lead to very hard-to-read code. the if...then...else... structure is much\
    \ more readable. Use of the [...] construct is recommended for loops and trivial\
    \ sanity checks with which you do not want to overly distract the reader.\n\n\
    Note that when you set X to a non-numeric value, the first few comparisons result\
    \ in the message:\n\n```\ntest.sh: [: integer expression expected before -lt\n\
    test.sh: [: integer expression expected before -gt\ntest.sh: [: integer expression\
    \ expected before -le\ntest.sh: [: integer expression expected before -ge\n```\n\
    \nThis is because the -lt, -gt, -le and -ge comparisons are only designed for\
    \ integers, and do not work on strings. The string comparisons, such as != will\
    \ happily treat \"5\" as a string, but there is no sensible way of treating \"\
    Hello\" as an integer, so the integer comparisons complain. If you want your shell\
    \ script to behave more gracefully, you will have to check the contents of the\
    \ variable before you test it - maybe something like this:\n\n```\necho -en \"\
    Please guess the magic number: \" \nread X \necho $X | grep \"[0-9]\" > /dev/null\
    \ 2>&1 \nif [ \"$?\" -eq \"0\" ]; then \n  # If the grep found something other\
    \ than 0-9 \n  # then it's not an integer.\n  echo \"Sorry, wanted a number\"\
    \ \nelse \n  # The grep found only 0-9, so it's an integer.\n  # We can safely\
    \ do a test on it.\n  if [ \"$X\" = \"7\" ]; then \n    echo \"You entered the\
    \ magic number!\"\n  fi \nfi\n```\n\nIn this way you can echo a more meaningful\
    \ message to the user, and exit gracefully. The $? variable is explained in \"\
    Variables -\n\nShell Scripting Tutorial"
