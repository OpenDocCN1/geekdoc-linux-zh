    \ 结束（case 反过来！）然后我们用 `done` 结束循环。case 条件已经足够复杂了，但它们是一个非常有用且强大的工具。它们通常用于解析传递给 shell\
    \ 脚本的参数，其他如此。\n\n## 10. Variables - Part II\n\n有一组已经设置好的变量，其中大多数不能被赋值。这些变量可以包含有用信息，脚本可以利用它们来了解其运行的环境。\n\
    \n我们将查看的第一组变量是 `$0 .. $9` 和 `$#`。变量 `$0` 是调用时的程序基名。`$1 .. $9` 是调用脚本时的前 9 个额外参数。变量\
    \ `$@` 是所有参数 `$1 ..` 无论什么。变量 `$*` 类似，但它不会保留任何空格和引号，因此 \"File with spaces\" 会变成\
    \ \"File\" 和 \"spaces\"。这与我们在“第一个脚本”中看到的 echo 内容相似。作为一条通用规则，使用 `$@` 并避免使用 `$$`。`$#`\
    \ 是调用脚本时的参数个数。让我们来看一个示例脚本：\n\n```bash\nvar3.sh\n#!/bin/sh\necho \"I was called\
