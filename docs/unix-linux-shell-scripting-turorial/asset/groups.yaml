    \   *)\n      echo \"Sorry, I don't understand\"\n      ;;\n  esac\ndone\necho\n\
    echo \"That's all folks!\"\n```\n¹⁸ talk.sh.txt\n\n好了，它并不是世界上最棒的聊天者；它只是一个例子！尝试运行并检查它是如何工作的……\n\
