- md: "\nnot significant a problem, but two things here are worth bearing in mind.\n\
    \n- 1. First, a simple script will, more often than anticipated, grow into a large,\
    \ complex one.\n- 2. Secondly, if nobody else can understand how it works, you\
    \ will be lumbered with maintaining it yourself for the rest of your life!\n\n\
    Something about shell scripts seems to make them particularly likely to be badly\
    \ indented, and since the main control structures are if/then/else and loops,\
    \ indentation is critical for understanding what a script does.\n\nOne of the\
    \ major weaknesses in many shell scripts is lines such as:\n\n```\ncat /tmp/myfile\
    \ | grep \"mystring\"\n```\n\nwhich would run much faster as:\n\n```\ngrep \"\
    mystring\" /tmp/myfile\n```\n\nNot much, you may consider; the OS has to load\
    \ up the /bin/grep executable, which is a reasonably small 75600 bytes on my system,\
    \ open a pipe in memory for the transfer, load and run the /bin/cat executable,\
    \ which is an even smaller 9528 bytes on my system, attach it to the input of\
    \ the pipe and let it run.\n\nOf course, this kind of thing is what the OS is\
    \ for, and it's normally pretty efficient at doing it. But if this command were\
    \ in a loop running many times over, the saving of not locating and loading the\
    \ cat executable, setting up and releasing the pipe, can make some difference,\
    \ especially in, say, a CGI environment where there are enough other factors to\
    \ slow things down without the script itself being too much of a hurdle. Some\
    \ Unices are more efficient than others at what they call \"building up and tearing\
    \ down processes” – i.e., loading them up, executing them, and clearing them away\
    \ again. But however good your flavour of Unix is at doing this, it'd rather not\
    \ have to do it at all.\n\nAs a result of this, you may hear mention of the Useless\
    \ Use For Cat Award (UUoC), also known in some circles as **The Award For The\
    \ Most Gratuitous Use Of The Word Cat In A Serious Shell Script** being banded\
    \ about on the comp.unix.shell newsgroup from time to time. This is purely a way\
    \ of peers keeping each other in check, and making sure that things are done right.\n\
    \nWhich leads me nicely on to something else: Don't *ever* feel too close to your\
    \ own shell scripts; by their nature, the source cannot be closed. If you supply\
    \ a customer with a shell script, s/he inspect it quite easily. So you as well\
    \ accept that it will be inspected by anyone you pass it to; use this to your\
    \ advantage with the GPL² - encourage people to give you feedback and bugfixes\
    \ for free!\n\n[2] http://www.gnu.org/copyleft/gpl.html\n\nShell Scripting Tutorial\n\
    Page 11\n\n## 3. A First Script\n\nFor our first shell script, we'll just write\
    \ a script which says \"Hello World\". We will then try to get more out of a Hello\
    \ World program than any other tutorial you've ever read :-) \nCreate a file (first.sh)\
    \ as follows:\n\nfirst.sh\n\n```bash\n#!/bin/sh\n# This is a comment!\necho Hello\
    \ World      # This is a comment, too!\n```\n\nThe first line tells Unix that\
    \ the file is to be executed by /bin/sh. This is the standard location of the\
    \ Bourne shell on just about every Unix system. If you're using GNU/Linux, /bin/sh\
    \ is normally a symbolic link to bash (or, more recently, dash).\n\nThe second\
    \ line begins with a special symbol: #. This marks the line as a comment, and\
    \ it is ignored completely by the shell. The only exception is when the very first\
    \ line of the file starts with #! - as ours does. This is a special directive\
    \ which Unix treats specially. It means that even if you are using csh, ksh, or\
    \ anything else as your interactive shell, what follows should be interpreted\
    \ by the Bourne shell.\n\nSimilarly, a Perl script may start with the line #!usr/bin/perl\n\
    \n- 3 first.sh.txt\n\ntell your interactive shell that the program which follows\
    \ should be executed by Perl. For Bourne shell programming, we shall stick to\
    \ #!/bin/sh.\n\nThe third line runs a command: echo, with two parameters, or arguments\
    \ - the first is \"Hello\"; the second is \"World\".\nNote that echo will automatically\
    \ put a single space between its parameters.\nThe # symbol still marks a comment;\
    \ the # anything following it is ignored by the shell.\n\nnow run chmod 755 first.sh\
    \ to make the text file executable, and run ./first.sh.\nYour screen should then\
    \ look like this:\n\n```\n$ chmod 755 first.sh\n$ ./first.sh\nHello World\n$\n\
