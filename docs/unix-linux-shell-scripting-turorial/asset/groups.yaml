    #!/bin/sh

    echo "What is your name?"

    read MY_NAME

    echo "Hello $MY_NAME - hope you''re well."

    ```


    Mario Bacinsky 友好地指出，我最初在第 3 行漏掉了双引号，这导致单词 "you''re" 中的单引号没有成对匹配，导致了错误。正是这种小细节会让
    shell 程序员抓狂的，所以请务必注意！


    这里使用的是 shell 内置命令 `read`，它从标准输入读取一行并存入提供的变量中。

    请注意，如果你输入全名且在 `echo` 命令周围没有使用双引号，它仍然能正确输出。这是如何做到的？在之前处理 `MY_MESSAGE` 变量时，我们必须在它周围加上双引号来设置它。

    发生的是，`read` 命令会自动在其输入周围加上引号，这样空格就能被正确处理。（当然，你仍然对输出加引号——例如 `echo "$MY_MESSAGE"`）。


    ## 变量作用域


    Bourne shell 中的变量不需要像 C 等语言那样进行声明。但如果你尝试读取一个未声明的变量，结果将是空字符串。你不会收到任何警告或错误。这可能会导致一些细微的
    bug——如果你赋值 `MY_OBFUSCATED_VARIABLE=Hello` 然后执行


    `echo $OBFUSCATED_VARIABLE`


    那么你什么也得不到（因为第二个 `OBFUSCATED` 拼写错误）。


    有一个名为 `export` 的命令，它对变量的作用域有根本性的影响。为了真正了解你的变量发生了什么，你需要了解一些它是如何使用的。


    创建一个短小的 shell 脚本 `myvar2.sh`：


    myvar2.sh


    ```

    #!/bin/sh

    echo "MYVAR is: $MYVAR"

    MYVAR="hi there"

    echo "MYVAR is: $MYVAR"

    ```


    现在运行脚本：


    ```bash

    $ ./myvar2.sh

    MYVAR is:

    MYVAR is: hi there

    ```


    MYVAR 还没有被赋予任何值，所以它是空的。然后我们给它一个值，它就有了预期的结果。

    现在运行：


    ```bash

    $ MYVAR=hello

    $ ./myvar2.sh

    MYVAR is:

    MYVAR is: hi there

    ```


    它还没有被设置！到底是怎么了？！

    当你从交互式 shell 调用 `myvar2.sh` 时，会启动一个新的 shell 来运行该脚本。这部分部分是因为脚本开头的 `#!/bin/sh` 行，我们之前讨论过它。


    我们需要导出该变量，它才能被另一个程序（包括 shell 脚本）继承：


    ```bash

    $ export MYVAR

    $ ./var2.sh

    MYVAR is: hello

    MYVAR is: hi there

    ```


    现在看脚本的第 3 行：这正在改变 MYVAR 的值。但没有办法将这个值传回给你的交互式 shell。尝试读取 MYVAR 的值：


    ```bash

    $ echo $MYVAR

    hello

    $

    ```


    一旦 shell 脚本退出，它的环境就会被销毁。但 MYVAR 在你的交互式 shell 中保留其 `hello` 的值。为了从脚本接收环境变化，我们必须
    `source` 脚本——这实际上是在我们自己的交互式 shell 中运行该脚本，而不是启动另一个 shell 来运行它。我们可以通过 `.` (点) 命令来
    source 脚本：


    ```bash

    $ MYVAR=hello

    $ echo $MYVAR

    hello

    $ ./var2.sh

    MYVAR is: hello

    MYVAR is: hi there

    $ echo $MYVAR

    hi there

    ```


    变化现在再次作用于我们的 shell 了！例如，你的 `.profile` 或 `.bash_profile` 文件就是这样工作的。请注意，在这种情况下，我们不需要
    `export MYVAR`。感谢 sway 指出我最初在上面写的是 `echo MYVAR` 而不是应该的 `echo $MYVAR`。这是另一个在 shell
    脚本中容易犯的简单错误。关于变量，这里还有一点值得提到，即考虑以下 shell 脚本：


    ```bash

    #!/bin/sh

    echo "What is your name?"

    read USER_NAME

    echo "Hello $USER_NAME"

    echo "I will create you a file called $USER_NAME_file"

    touch $USER_NAME_file

    ```


    思考你预期的结果是什么。例如，如果你输入 "steve" 作为 `USER_NAME`，脚本应该创建 `steve_file` 吗？

    实际上，不会。除非有一个名为 `USER_NAME_file` 的变量，否则会导致错误。shell 并不知道变量在哪里结束，其他部分在哪里开始。我们如何定义？

    答案是将变量本身括在*大括号*中：


    ```bash

    user.sh

    #!/bin/sh

    echo "What is your name?"

    read USER_NAME

    echo "Hello $USER_NAME"

    echo "I will create you a file called ${USER_NAME}_file"

    touch "${USER_NAME}_file"

    ```


    shell 现在知道我们引用的是变量 `USER_NAME`，并且我们希望它后面加上后缀 `_file`。这个 `user.sh.txt` 可能是许多新手
    shell 脚本程序员的噩梦，因为问题的源头很难追踪。


    另外注意 `"${USER_NAME}_file"` 周围的引号——如果用户输入 "Steve Parker"（注意空格），如果没有引号，传递给 `touch`
    的参数将是 `Steve` 和 `Parker_file`——也就是说，我们实际上是在说 `touch Steve Parker_file`，这是两个要处理的文件，而不是一个。引号避免了这一点。感谢
    Chris 强调了这一点。


