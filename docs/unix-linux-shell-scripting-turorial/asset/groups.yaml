    \n  shift\ndone\n```\n\nThis script keeps on using shift until $# is down to zero,\
    \ at which point the list is empty.\n\nAnother special variable is $?. This contains\
    \ the exit value of the last run command. So the code:\n\n```\n#!/bin/sh\n/usr/local/bin/my-command\n\
    if [ \"$?\" -ne \"0\" ]; then\necho \"Sorry, we had a problem there!\"\nfi\n```\n\
    \nwill attempt to run /usr/local/bin/my-command which should exit with a value\
    \ of zero if all went well well, and a nonzero value on failure. We can then handle\
    \ this by checking the value of $? after calling the command. This helps make\
    \ scripts robust and more intelligent. Well-behaved applications should return\
    \ zero on success. Hence the quote:\n\n> “One of the main causes of the fall of\
    \ the Roman Empire was that, lacking zero, they had no way to indicate successful\
    \ termination of their C Programs.” (Robert Firth)\n\nThe other two main variables\
    \ set for you by the environment are $$ and $. These are both process numbers.\
    \ The $$ variable is the PID (Process IDentifier) of the currently running shell.\
    \ This can be useful for creating temporary files, such as /tmp/my-script.$$ which\
    \ is useful if many instances of the script could be run at the same time, and\
    \ they all need their own temporary files. The $! variable is the PID of the last\
    \ run background process. This is useful to keep track of the process as it gets\
    \ on with its job.\n\nAnother interesting variable is IFS. This is the Internal\
    \ Field Separator. The default value is SPACE TAB NEWLINE, but if you are changing\
    \ it, it's easier to take a copy, as shown:\n\n# var5.sh21\n\n```\n#!/bin/sh\n\
    old IFS=\"$IFS\"\nIFS=\necho \"Please input some data separated by colons ...\"\
    \nread x y z\nIFS=$old IFS\necho \"x is $x y is $y z is $z\"\n```\n\nThis script\
    \ runs like this:\n\n```\n$ ./ifs.sh\nPlease input some data separated by colons\
    \ ...\nhello:how are you:today\nx is hello y is how are you z is today\n```\n\n\
    ```\n$ ./ifs.sh\nPlease input some data separated by colons ...\nhello:how are\
    \ you:today:my:friend\nx is hello y is how are you z is today:my:friend\n```\n\
    \nIt is important when dealing with IFS in particular (but any variable not entirely\
    \ under your control) to realise that it could contain spaces, newlines and other\
    \ \"uncontrollable\" characters. It is therefore a very good idea to use double-quotes\
    \ around it, ie: old_IFS=\"$IFS\" instead of old_IFS=$IFS.\n\n# #!/ch/11\n\n#\
    \ 11. Variables - Part III\n\nAs we mentioned in Chapter 4 (“Variables - Part\
    \ I”), curly brackets around a variable avoid confusion:\n\n```\nfoo=sun\necho\
    \ $fooshine      # $fooshine is undefined\necho ${foo}shine     # displays the\
    \ word \"sunshine\"\n```\n\nThat's not all, though - these fancy brackets have\
    \ another, more powerful use. We can deal with issues of variables being undefined\
    \ or null (in the shell, there's not much difference between undefined and null).\n\
    \n## Using Default Values\n\nConsider the following code snippet which prompts\
    \ the user for input, but accepts defaults:\n\n```\n#!/bin/sh\necho -en \"What\
    \ is your name [ `whoami` ] \"\nread myname\nif [ -z \"$myname\" ]; then\n  myname=`whoami`\n\
    fi\necho \"Your name is : $myname\"\n```\n\nPassing the \"-en\" to echo tells\
    \ it not to add a linebreak (for bash and csh). For Dash, Bourne and other compliant\
    \ shells, you use a \"\\c at the end of the line, instead. Ksh understands both\
    \ forms.\n\nThis script runs like this if you accept the default by pressing \"\
    RETURN\":\n\n```\nsteve$ ./name.sh\nWhat is your name [ steve ] RETURN\nYour name\
    \ is : steve\n```\n\n... or, with user input:\n\n```\nsteve$ ./name.sh\nWhat is\
    \ your name [ steve ] foo\nYour name is : foo\n```\n\nThis could be done better\
    \ using a shell variable feature. By using curly braces and the special \":-\\\
    \ usage, you can specify a default value to use if the variable is unset\n\n```\n\
    echo -en \"What is your name [ `whoami` ]\"\nread myname\necho \"Your name is\
    \ : ${myname:-`whoami`}\"\n```\n\nThis could be considered a special case – we're\
    \ using the output of the whoami command, which prints your login name (UID).\
    \ The more canonical example is to use fixed text, like this:\n\n```\necho \"\
    Your name is : ${myname:-John Doe}\"\n```\n\nAs with other use of the backticks\
    \ `whoami` runs in a subshell, so any cd commands, or setting any other variables,\
    \ within the backticks, will not affect the currently-running shell.\n\n## Using\
    \ and Setting Default Values\n\nThere is another syntax, \":=\", which sets the\
    \ variable to the default if it is undefined:\n\n```\necho \"Your name is : ${myname=John\
    \ Doe}\"\n```\n\n2. External Programs\n\nExternal programs are often used within\
    \ shell scripts; there are a few builtin commands (echo, which, and test are commonly\
    \ builtin), but many useful commands are actually Unix utilities, such as tr,\
    \ grep, expr and cut.\n\nThe backtick(`)is also often associated with external\
    \ commands. Because of this, we will discuss the backtick first. The backtick\
    \ is used to indicate that the enclosed text is to be executed as a command. This\
    \ is quite simple to understand. First, use an interactive shell to read your\
    \ full name from /etc/passwd:\n\n```\n$ grep \"${USER}\" /etc/passwd | cut -d:\
    \ -f5\nSteve Parker\n```\n\nNow we will grab this output into a variable which\
    \ we can manipulate more easily:\n\n```\n$ MYNAME=`grep \"${USER}\" /etc/passwd\
    \ | cut -d: -f5`\n$ echo $MYNAME\nSteve Parker\n```\n\nSo we see that the backtick\
    \ simply catches the standard output from any command or set of commands we choose\
    \ to run. It can also improve performance if you want to run a slow command or\
    \ set of commands and parse various bits of its output:\n\n```\n#!/bin/sh\nfind\
    \ / -name \"*.html\" -print | grep \"/index.html$\"\nfind / -name \"*.html\" -print\
    \ | grep \"/contents.html$\"\n```\n\nThis code could take a long time to run,\
    \ and we are doing it twice! A better solution is:\n\n```\n#!/bin/sh\nHTML_FILES=`find\
    \ / -name \"*.html\" -print`\necho \"$HTML_FILES\" | grep \"/index.html$\"\necho\
    \ \"$HTML_FILES\" | grep \"/contents.html$\"\n```\n\nNote: the quotes around $HTML_FILES\
    \ are essential to preserve the newlines between each file. Otherwise, grep will\
    \ see one huge line of text, and not line per file.\n\nThis way, we are only running\
    \ the slow find once, roughly halving the execution time of the script.\n\nWe\
    \ discuss specific examples further in Chapter 14, the Hints and Tips section\
    \ of this tutorial.\n\n# 13. Functions\n\nOneoften-overlooked feature of shell\
    \ script programming is that you can easily write functions for use within your\
    \ script. This is generally done in one of two ways; with a simple script, the\
    \ function is simply declared in the same file as it is. However, when writing\
    \ a suite of scripts, it is often easier to write a \"library\" of useful functions,\
    \ and source that file at the start of the other scripts which use them. This\
    \ will be shown later. The method is the same however it is done; we will primarily\
    \ be using the first way here.\n\nThere could be some confusion about whether\
    \ to call shell functions *procedures* or *functions*; the definition of a function\
    \ is traditionally that it returns a single value, and does not output anything.\
    \ A procedure, on the other hand, does not return a value, but may produce output.\
    \ A shell function may do neither, either or both.\n\nA function may return a\
    \ value in one of four different ways:\n\n- Change the state of a variable or\
    \ variables\n- Use the exit command to end the shell script\n"
