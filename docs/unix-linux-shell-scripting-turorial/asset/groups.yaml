    \ may not exist, or may be set to “B2,” or anything else unexpected.\n\nI recently\
    \ found an old thread on Usenet which I had been involved in, where I actually\
    \ learned more ... Google has it here.\n\n- 13 while3b.sh.txt\n\n### A handy Bash\
    \ (but not Bourne Shell) tip I learned from the Linux From Scratch project is:\n\
    \n```bash\nmkdir rc{0,1,2,3,4,5,S}.d\n\ninstead of the cumbersome\n\nfor runlevel\
    \ in 0 1 2 3 4 5 6 S\ndo\n  mkdir rc${runlevel}.d\ndone\n```\n\nAnd this can be\
    \ done recursively, too:\n\n```bash\n$ cd /\n$ ls -ld {usr,usr/local}/{bin,sbin,lib}\n\
    drwxr-xr-x 2 root root 4096 Oct 26 01:00 /bin\ndrwxr-xr-x 6 root root 4096 Jan\
