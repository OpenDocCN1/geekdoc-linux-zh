    commands,

    # and use ESC-k to access the history.


    If you hit ESC then k, then by repeatedly hitting k you scroll backwards through
    the command history. You can use vi command-mode and entry-mode commands to edit
    the commands, like this:


    ```

    ksh$ touch foo

    ESC-k (enter vi mode, brings up the previous command)

    w (skip to the next word, to go from "touch" to "foo")nww (change word)bar (change
    "foo" to "bar")

    ksh$ touch bar

    ```'
