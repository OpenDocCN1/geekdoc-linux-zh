    # #!/ch/14


    # ## 14. Hints and Tips


    Unix is full of text manipulating utilities, some of the more powerful of which
    we will now discuss in this section of this tutorial. The significance of this,
    is that virtually everything under Unix is text. Virtually anything you can think
    of is controlled by either a text file, or by a command-line-interface (CLI).
    The only thing you can''t automate using a shell script is a GUI-only utility
    or feature. And under Unix, there aren''t too many of them!


    You may have heard it said, that, with *nix, "everything is a file" - it''s true.


    We have a few subsections here ... what follows is general advice, hints and tips.


    # ## CGI Scripting


    For CGI programming, there are a couple of extra variables to be aware of, and
    a few tips I''ve picked up along the way. Although the shell may not seem the
    obvious choice for CGI programming, it is quick to write and simple to debug.
    As such, it makes for an ideal prototyping language for CGI scripts, and fine
    for simple or little-used CGI scripts permanently cookie.cgi - which calls fortune.cgi'
- md: "\n# Exit Codes\n\nExit codes are a number between 0 and 255, which is returned\
    \ by any Unix command when it returns control to its parent process. Other numbers\
    \ can be used, but these are treated modulo 256, so exit 10 is equivalent to exit\
    \ 246, and exit 257 is equivalent to exit 1.\n\nThese can be used within a shell\
    \ script to change the flow of execution depending on the success or failure of\
    \ commands executed. This was briefly introduced in Chapter 10, \"Variables -\
    \ Part II\". Here we shall look in more detail in the available interpretations\
    \ of exit codes.\n\nSuccess is traditionally represented with exit 0; failure\
    \ is normally indicated with a non-zero exit-code. This value can indicate different\
    \ reasons for failure. For example, GNU grep returns 0 on success, 1 if no matches\
    \ were found, and 2 for other errors (syntax errors, non-existent input files,\
    \ etc).\n\nWe shall look at three different methods for checking error status,\
    \ and discuss the pros and cons of each approach.\n\nFirstly, the simple approach:\n\
    \n```bash\n#!/bin/sh\n# First attempt at checking return codes\nUSERNAME=`grep\
    \ \"^${1}:\" /etc/passwd|cut -d:\" -f1`\nif [ \"$?\" -ne \"0\" ]; then\n  echo\
    \ \"Sorry, cannot find user ${1} in /etc/passwd\"\n  exit 1\nfi\nNAME=`grep \"\
    ^${1}:\" /etc/passwd|cut -d:\" -f5`\nHOMEDIR=`grep \"^${1}:\" /etc/passwd|cut\
    \ -d:\" -f6`\n\necho \"USERNAME:$USERNAME\"\necho \"NAME: $NAME\"\necho \"HOMEDIR:$HOMEDIR\"\
    \n```\n\nThis script works fine if you supply a valid username in /etc/passwd.\
    \ However, if you enter an invalid code, it does not what you might at first expect\
    \ - it keeps running, and just shows:\n\nUSERNAME:\nNAME:\nHOMEDIR:\n\nWhy is\
    \ this? As mentioned, the $? variable is set to the return code of the last executed\
    \ command. In this case, that is cut. had had no problems which it feels like\
    \ reporting - as far as I can tell from testing, and re-reading the documentation,\
    \ cut returns whatever happens! It was fed an empty string, and did its job -\
    \ returned the first field of its input, which just happened to be the empty string.\
    \ So what do we do? If we have an error here, grep will report it, not cut. Therefore,\
    \ we have to test grep's return code, not cut's.\n\n```bash\n#!/bin/sh\n# Second\
    \ attempt at checking return codes\ngrep \"^${1}:\" /etc/passwd > /dev/null 2>&1\n\
    if [ \"$?\" -ne \"0\" ]; then\n  echo \"Sorry, cannot find user ${1} in /etc/passwd\"\
    \n  exit 1\nfi\nUSERNAME=`grep \"^${1}:\" /etc/passwd|cut -d:\" -f1`\nNAME=`grep\
    \ \"^${1}:\" /etc/passwd|cut -d:\" -f5`\nHOMEDIR=`grep \"^${1}:\" /etc/passwd|cut\
    \ -d:\" -f6`\n\necho \"USERNAME: $USERNAME\"\necho \"NAME: $NAME\"\necho \"HOMEDIR:\
    \ $HOMEDIR\"\n```\n\nThis fixes the problem for us, though at the expense of slightly\
    \ longer code. That is the basic way which textbooks might show you, but it is\
    \ far from being all there is to know checking in shell scripts. This method may\
    \ not be the most suitable to your particular command-sequence, or may be unmaintainable.\
    \ Below, we shall investigate two alternative approaches.\n\nAs a second approach,\
    \ we can tidy this somewhat by putting the test into a separate function, instead\
    \ of littering the code with lots of 4-line tests:\n\n```bash\n#!/bin/sh\n# A\
    \ Tidier approach\n\ncheck_errs() {\n  # Function. Parameter 1 is text to display\
    \ on failure.\n  if [ \"${1}\" -ne \"0\" ]; then\n    echo \"ERROR #${1} : ${2}\"\
    \n    # as a bonus, make our script exit with the right error code.\n    exit\
    \ ${1}\n  fi\n}\n```\n\n### main script starts here ###\ngrep \"^${1}:\" /etc/passwd\
    \ > /dev/null 2>&1\ncheck_errs $? \"User ${1} not found in /etc/passwd\"\nUSERNAME=`grep\
    \ \"^${1}:\" /etc/passwd|cut -d:\" -f1`\ncheck_errs $? \"Cut returned an error\"\
    \necho \"USERNAME: $USERNAME\"\ncheck_errs $? \"echo returned an error - very\
    \ strange!\"\n\nThis allows us to test for errors 3 times, with customised error\
    \ messages, without having to write 3 individual tests. By writing the test routine\
    \ once, we can call it as many times as we wish, creating a more intelligent script,\
    \ at very little expense to the programmer. Perl programmers will recognise this\
    \ as being similar to the die command in Perl.\n\nAs a third approach, we shall\
    \ look at a simpler and cruder method. I tend to building Linux kernels - simple\
    \ automations which, if they go well, should just get on with it, but when things\
    \ go wrong, tend to require the operator to do something intelligent (ie, that\
    \ a script cannot do):\n\n```bash\n#!/bin/sh\ncd /usr/src/linux && make modules\
    \ && \\\nmake dep && make bzImage && make modules && \\\nmake modules install\
    \ && \\\ncp arch/i386/boot/bzImage /boot/my-new-kernel && \\\ncp System.map /boot\
    \ && \\\necho \"Your new kernel awaits, m'lord.\"\n```\n\nThis script runs through\
    \ the the tasks involved in building a Linux kernel (which can take a while),\
    \ and uses the && operator to check for success. To do this with if would involve:\n\
    \n```bash\n#!/bin/sh\ncd /usr/src/linux\nif [ \"$?\" -eq \"0\" ]; then\n  make\
    \ dep\n  if [ \"$?\" -eq \"0\" ]; then\n    make bzImage\n    if [ \"$?\" -eq\
    \ \"0\" ]; then\n      make modules\n      if [ \"$?\" -eq \"0\" ]; then\n   \
    \     make modules install\n        if [ \"$?\" -eq \"0\" ]; then\n          cp\
    \ arch/i386/boot/bzImage /boot/my-new-kernel\n          if [ \"$?\" -eq \"0\"\
    \ ]; then\n            cp System.map /boot/\n            if [ \"$?\" -eq \"0\"\
    \ ]; then\n              echo \"Your new kernel awaits, m'lord.\"\n          \
    \  fi\n          fi\n        fi\n      fi\n    fi\n    fi\n  fi\nfi\n```\n\n...\
    \ which I, personally, find pretty difficult to follow.\n\nThe && and || operators\
    \ are the shell's equivalent of AND and OR tests. These can be thrown together\
    \ as above, or:\n\n```bash\n#!/bin/sh\ncp /foo /bar && echo Success || echo Failed\n\
    ```\n\nThis code will either echo Success or Failed depending on whether or not\
    \ the cp command was successful. Look carefully at this; the construct is:\n\n\
    ```bash\ncommand && command-to-execute-on-success \\\n|| command-to-execute-on-failure\n\
    ```\n\nOnly one command can be in each part. This method is handy for simple success\
    \ / fail scenarios, but if you want to check on the status of the echo commands\
    \ themselves, it is easy to quickly become confused about which && and || applies\
    \ to which command. It is also very difficult to maintain. Therefore this construct\
    \ is only recommended for simple sequencing of commands.\n\nIn earlier versions,\
    \ I had suggested that you can use a subshell to execute multiple commands depending\
    \ on whether the cp command succeeded or failed:\n\n```bash\ncp /foo /bar && \\\
    \n( echo Success ; echo Success part II ) || \\\n( echo Failed ; echo Failed part\
    \ II )\n```\n\nBut in fact, Marcel found out that this does not work properly.\
    \ The syntax for a subshell is:\n\n```bash\n( command1 ; command2; command3 )\n\
    ```\n\nThe return code of the subshell is the return code of the final command\
    \ (command3 in this example). That return code will affect the overall command.\
    \ So the output of this script:\n\n```bash\ncp /foo /bar && \\\n  echo Success\
    \ part II; /bin/false || \\\n  echo Failed; echo Failed part II\n```\n\nIs that\
    \ it runs the Success part (because cp succeeded, and then - because /bin/false\
    \ returns failure, it also executes the Failure part\n\nSo if you need to execute\
    \ multiple commands as a result of the status of some other condition, it is better\
    \ (and much clearer) to use the standard if, then, else syntax.\n\n# Simple Expect\
    \ Replacement\n\nHere is a simple replacement for expect. A number of people have\
    \ asked how this is done, and inspired by Sun's example I showed in Hints and\
    \ Tips which is used in Sun Microsystems' Explorer utility, here is a very simple\
    \ version of expect.\n\nThe syntax of expect.txt is very simple:\n\n```\nS command\
    \ E[delay] expected_text\n```\n\nSo a command is marked by starting with \"S\"\
    \ (for Send), and the expected result is marked with \"E\". Since some commands\
    \ can take a while to complete, it is possible to specify a delay before expecting\
    \ the result: \"E10 \\$ will wait for 10 seconds before expecting a dollar prompt.\
    \ If the expected result is not found, the script will wait one second, try again,\
    \ then wait two seconds, then\n"
  mdcn: "\n\n# 退出码 (Exit Codes)\n\n退出码是一个 0 到 255 之间的数字，当任何 Unix 命令将控制权交还给父进程时返回。可以使用其他数字，但它们会被视为模\
    \ 256 的结果，因此 exit 10 等于 exit 246，而 exit 257 等于 exit 1。\n\n这些代码可以在 Shell 脚本中使用，根据所执行的命令的成功或失败来改变执行流。这在第\
    \ 10 章“变量 - 第二部分”中简要介绍过。在这里，我们将更详细地查看退出码的各种解释。\n\n传统上用 exit 0 表示成功；失败用非零退出码表示。此值可以表示失败的不同原因。例如，GNU\
    \ grep 在成功时返回 0，在未找到匹配项时返回 1，在其他错误（语法错误、输入文件不存在等）时返回 2。\n\n我们将查看检查错误状态的三种方法，并讨论每种方法的优缺点。\n\
    \n首先是简单的方法：\n\n```bash\n#!/bin/sh\n# 第一次检查返回值的尝试\nUSERNAME=`grep \"^${1}:\" /etc/passwd|cut\
    \ -d:\" -f1`\nif [ \"$?\" -ne \"0\" ]; then\n  echo \"Sorry, cannot find user\
    \ ${1} in /etc/passwd\"\n  exit 1\nfi\nNAME=`grep \"^${1}:\" /etc/passwd|cut -d:\"\
    \ -f5`\nHOMEDIR=`grep \"^${1}:\" /etc/passwd|cut -d:\" -f6`\n\necho \"USERNAME:$USERNAME\"\
    \necho \"NAME: $NAME\"\necho \"HOMEDIR:$HOMEDIR\"\n```\n\n如果你在 /etc/passwd 中提供了一个有效的用户名，这个脚本运行良好良好。然而，如果你输入了一个无效的代码，它的表现不像你最初预期的那样的\
    \ - 它会继续运行，并显示：\n\nUSERNAME:\nNAME:\nHOMEDIR:\n\n为什么会这样？如前所述，$? 变量被设置为上一次执行命令的返回码。在这种情况下，命令是\
    \ `cut`。它没有遇到任何它认为需要报告的问题 - 从我通过测试和重新阅读文档来看，`cut` 无论发生什么都会返回！它接收了一个空字符串并完成了工作\
    \ - 返回了它输入的第一个字段，而该字段恰好是空字符串。那么我们该怎么办？如果这里发生了错误，是 `grep` 会报告，而不是 `cut`。因此，我们必须测试\
    \ `grep` 的返回码，而不是 `cut` 的。\n\n```bash\n#!/bin/sh\n# 第二次检查返回值的尝试\ngrep \"^${1}:\"\
    \ /etc/passwd > /dev/null 2>&1\nif [ \"$?\" -ne \"0\" ]; then\n  echo \"Sorry,\
    \ cannot find user ${1} in /etc/passwd\"\n  exit 1\nfi\nUSERNAME=`grep \"^${1}:\"\
    \ /etc/passwd|cut -d:\" -f1`\nNAME=`grep \"^${1}:\" /etc/passwd|cut -d:\" -f5`\n\
    HOMEDIR=`grep \"^${1}:\" /etc/passwd|cut -d:\" -f6`\n\necho \"USERNAME: $USERNAME\"\
    \necho \"NAME: $NAME\"\necho \"HOMEDIR: $HOMEDIR\"\n```\n\n这为我们解决了问题，尽管代价是代码稍微长了。这是教科书中可能会向你展示的基本方法，但远不是\
    \ Shell 脚本中检查状态的全部。这种方法可能不适用于你特定的命令序列，或者可能难以维护。下面，我们将研究两种替代方法。\n\n作为第二种方法，我们可以通过将测试放入单独的函数中来稍微整理一下，而不是在代码中充斥着大量的\
    \ 4 行测试：\n\n```bash\n#!/bin/sh\n# 一种整洁的方法\n\ncheck_errs() {\n  # 函数。参数 1 是失败时显示的文本。\n\
    \  if [ \"${1}\" -ne \"0\" ]; then\n    echo \"ERROR #${1} : ${2}\"\n    # 额外奖励，让我们的脚本以正确的错误码退出。\n\
    \    exit ${1}\n  fi\n}\n```\n\n### 主脚本从这里开始 ###\ngrep \"^${1}:\" /etc/passwd\
    \ > /dev/null 2>&1\ncheck_errs $? \"User ${1} not found in /etc/passwd\"\nUSERNAME=`grep\
    \ \"^${1}:\" /etc/passwd|cut -d:\" -f1`\ncheck_errs $? \"Cut returned an error\"\
    \necho \"USERNAME: $USERNAME\"\ncheck_errs $? \"echo returned an error - very\
    \ strange!\"\n\n这允许我们测试 3 次错误，带有自定义的错误信息，而无需编写 3 个独立的测试。通过编写一次测试程序，我们可以根据需要调用任意次数，创建一个更智能的脚本，而对程序员的开销极小。Perl\
    \ 程序员会识别出这类似于 Perl 中的 `die` 命令。\n\n作为第三种方法，我们将查看一种更简单、更粗暴的方法。我倾向于构建 Linux 内核 -\
    \ 简单的自动化，如果运行顺利，应该直接继续进行；但当出现问题时，往往需要操作人员做一些智能操作（即脚本无法做到的）：\n\n```bash\n#!/bin/sh\n\
    cd /usr/src/linux && make modules && \\\nmake dep && make bzImage && make modules\
    \ && \\\nmake modules install && \\\ncp arch/i386/boot/bzImage /boot/my-new-kernel\
    \ && \\\ncp System.map /boot && \\\necho \"Your new kernel awaits, m'lord.\"\n\
    ```\n\n这个脚本运行构建 Linux 内核涉及的任务（可能需要一段时间时间），并使用 `&&` 运算符检查成功与。使用 `if` 实现将涉及：\n\n\
    ```bash\n#!/bin/sh\ncd /usr/src/linux\nif [ \"$?\" -eq \"0\" ]; then\n  make dep\n\
    \  if [ \"$?\" -eq \"0\" ]; then\n    make bzImage\n    if [ \"$?\" -eq \"0\"\
    \ ]; then\n      make modules\n      if [ \"$?\" -eq \"0\" ]; then\n        make\
    \ modules install\n        if [ \"$?\" -eq \"0\" ]; then\n          cp arch/i386/boot/bzImage\
    \ /boot/my-new-kernel\n          if [ \"$?\" -eq \"0\" ]; then\n            cp\
    \ System.map /boot/\n            echo \"Your new kernel awaits, m'lord.\"\n  \
    \        fi\n        fi\n      fi\n    fi\n  fi\nfi\n```\n\n... 这，我个人觉得这种写法很难跟随。\n\
    \n`&&` 和 `||` 运算符是 Shell 中 AND 和 OR 的等价物。它们可以像上面那样组合：\n\n```bash\n#!/bin/sh\n\
    cp /foo/bar && echo Success || echo Failed\n```\n\n这段代码取决于 `cp` 命令是否成功来输出 Success\
    \ 或 Failed。仔细看这个结构，是：\n\n```bash\ncommand && command-to-execute-on-success\n||\
    \ command-to-execute-on-failure\n```\n\n这种方法适用于简单的成功/失败场景，但如果你想检查命令本身的状态，很容易混淆哪个\
    \ && 对应哪个。它也很难以维护。因此，这种结构只建议用于命令的序列。在较早的版本中，我建议可以使用子 shell 来根据 `cp` 命令的成功或失败来执行多个命令：\n\
    \n```bash\ncp /foo/bar && \\\n  ( echo Success ; echo Success part II ) || \\\n\
    \  ( echo Failed ; echo Failed part II )\n```\n\n但实际上，Marcel 发现这并不有效。子 shell 的语法是：\n\
    \n```\n( command1 ; command2; command3 )\n```\n\n子 shell 的返回码是最后一个命令（示例中的 command3）的返回码。该返回码会影响整体命令。\n\
    \n# 简单的替代替代品\n\n这里有一个 expect 的简单替代品。许多人询问这是如何实现的，受我在 Hints and Tips 中展示的 Sun 示例（用于\
    \ Sun Microsystems 的 Explorer 工具）的启发，这里有一个非常简单的版本。\n\nexpect.txt 的语法非常简单：\n\n\
    ```\nS command E[delay] expected_text\n```\n\n因此，命令以 \"S\"（代表 Send）开头，预期结果用 \"\
    E\" 标记。由于某些命令可能需要一段时间才能完成，可以在预期结果之前指定延迟：“E10 \\$” 将在等待美元提示符之前等待 10 秒。如果未找到预期结果，脚本将等待一秒，重试，然后等待两秒，然后\n\
    \n"
