    # 7. Loops


    Most languages have the concept of loops: If we want to repeat a task twenty times,
    we don''t want to have to type in the code twenty times, with maybe a slight change
    each time. As a result, we have for and while loops in the Bourne shell. This
    is somewhat fewer features than other languages, but nobody claimed that shell
    programming has the power of C.


    # For Loops


    for loops iterate through a set of values until the list is exhausted:


    ```

    for.sh8

    #!/bin/sh

    for i in 1 2 3 4 5

    do

    echo "Looping ... number $i"

    done

    ```


    Try this code and see what it does. Note that the values can be anything at all:'
  - '[PAGE 31]


    ```

    for2.sh


    #!/bin/sh

    for i in hello 1 * 2 goodbye

    do

    echo "Looping ... i is set to $i"

    done

    ```


    This is well worth trying. Make sure that you understand what is happening here.
    Try it without the * and grasp the idea, re-read the Wildcards section and try
    it again with the * in place. Try it also in different directories, and with the
    * surrounded by double quotes, and try it preceded by a backslash (\*)


    In case you don''t have access to a shell at the moment (it is very useful to
    have a shell to hand whilst reading this tutorial), the results of the above two
    scripts are:


    +   - Looping .... number 1

    - Looping .... number 2

    - Looping .... number 3

    - Looping .... number 4

    - Looping .... number 5


    and, for the second example:


    +   - Looping ... i is set to hello

    - Looping ... i is set to 1

    - Looping ... i is set to (name of first file in current directory)

    - ... etc ...n- Looping ... i is set to (name of last file in current directory)

    - Looping ... i is set to 2

    - Looping ... i is set to goodbye


    So, as you can see, for simply loops through whatever input it is'
  - '[PAGE 32]


    given, until it runs out of input.


    # While Loops


    while loops can be much more fun! (depending on your idea of fun, and how often
    you get out of the house... )


    ```

    while.sh¹⁰

    n#!/bin/sh

    INPUT_STRING=hello

    while [ "$INPUT_STRING" != "bye" ]

    do

    echo "Please type something in (bye to quit)"

    read INPUT_STRING

    echo "You typed: $INPUT_STRING"

    done

    ```


    What happens here, is that the echo and read statements will run indefinitely
    until you type "bye" when prompted. Review “Variables - Part 1” (Chapter 4) to
    see why we use

    INPUT_STRING=hello before testing it. This makes it a repeat loop, not a traditional
    while loop.


    The colon (:) always evaluates to true; whilst using this can be necessary times,
    it is often preferable to use a real exit condition. Compare quitting the above
    loop with the one below;

    see which is the more elegant. Also think of some situations in which each one
    would be more useful than the other:'
