    # #!/ch/6


    # 6. Escape Characters


    Certain characters are significant to the shell; we have seen, for example, that
    the use of double quotes ("") characters affect how spaces and TAB characters
    are treated, for example:


    ```

    $ echo Hello World

    Hello World

    $ echo "World"

    Hello World World

    ```


    So how do we display: "World" ?


    ```

    $ echo "\World\""

    ```


    The first and last " characters wrap the whole lot into one parameter passed to
    echo so that the spacing between the two words is kept as is. But the the code:


    ```

    $ echo "Hello" " World ""

    ```


    would be interpreted as three parameters:


    +   - "Hello "

    - World

    - """


    So the output would be


    Shell Scripting Tutorial'
  - '[PAGE 27]


    # Hello World


    Note that we lose the quotes entirely. This is because the first and second quotes
    mark off the Hello and following spaces; the second argument is an unquoted "World"
    and the third argument is the empty string; "".


    Thanks to Patrick for pointing out that this:


    ```

    $ echo "Hello" "World"

    ```


    is actually only one parameter (no spaces between the quoted parameters), and
    that you can test this by replacing the echo command with (for example) ls.


    ```

    $ echo *

    case.shtml escape.shtml first.shtml

    functions.shtml hints.shtml index.shtml

    ip-primer.txt raid1+0.txt

    $ echo *txt

    ip-primer.txt raid1+0.txt

    $ echo "*txt"

    *txt

    ```


    In the first example, * is expanded to mean all files in the current directory.
    In the second example, *txt means all files ending in txt. In the third, we put
    the * in double quotes, and it is is interpreted literally. In the fourth example,
    the same applies, but we have appended txt to the string.


    However, ", $, \`, and \ are still interpreted by the shell, even'
  - '[PAGE 28]


    when they''re in double quotes. The backslash (\ character is used to mark these
    special characters so that they are not interpreted by the shell, passed on to
    the command being run (for example, echo). So to output the string: (Assuming
    that the value of $X is 5):


    A quote is ", backslash is \, backtick is `.

    A few spaces are and dollar is $. $X is 5.


    we would have to write:


    ```

    $ echo "A quote is_\", backslash is \, backtick is \`"

    A quote is \", backslash is \$, backtick is \`

    $ echo "A few spaces are ; dollar is \$. $X is ${X}"

    A few spaces are ; dollar is $. $X is 5.

    ```


    We have seen why the " is special for preserving spacing. Dollar ($) is special
    because it marks a variable, so $X is replaced by the shell with the contents
    of the variable X. Backslash (\) is special because it is itself used to mark
    other characters off; we need the following options for a complete shell:


    ```

    $ echo "This is \\ a backslash"

    This is \ a backslash

    $ echo "This is \" a quote and this is \\ a backslash"

    This is \" a quote and this is \ a backslash

    ```


    So backslash itself must be escaped to show that it is to be taken literally.
    The other special character, the backtick, is discussed later in Chapter 12, "External
    Programs."'
- md: "\n## 7. Loops\n\nMost languages have the concept of loops: If we want to repeat\
    \ a task twenty times, we don't want to have to type in the code twenty times,\
    \ with maybe a slight change each time. As a result, we have for and while loops\
    \ in the Bourne shell. This is somewhat fewer features than other languages, but\
    \ nobody claimed that shell programming has the power of C.\n\n### For Loops\n\
    \nfor loops iterate through a set of values until the list is exhausted:\n\n```bash\n\
    for.sh\n#!/bin/sh\nfor i in 1 2 3 4 5\ndo\necho \"Looping ... number $i\"\ndone\n\
    ```\n\nTry this code and see what it does. Note that the values can be anything\
    \ at all:\n\n```bash\nfor2.sh\n\n#!/bin/sh\nfor i in hello 1 * 2 goodbye\ndo\n\
    echo \"Looping ... i is set to $i\"\ndone\n```\n\nThis is well worth trying. Make\
    \ sure that you understand what is happening here. Try it without the * and grasp\
    \ the idea, re-read the Wildcards section and try it again with the * in place.\
    \ Try it also in different directories, and with the * surrounded by double quotes,\
    \ and try it preceded by a backslash (\\*)\n\nIn case you don't have access to\
    \ a shell at the moment (it is very useful to have a shell to hand whilst reading\
    \ this tutorial), the results of the above two scripts are:\n\n- Looping ....\
    \ number 1\n- Looping .... number 2\n- Looping .... number 3\n- Looping .... number\
    \ 4\n- Looping .... number 5\n\nand, for the second example:\n\n- Looping ...\
    \ i is set to hello\n- Looping ... i is set to 1\n- Looping ... i is set to (name\
    \ of first file in current directory)\n- ... etc ...\n- Looping ... i is set to\
    \ (name of last file in current directory)\n- Looping ... i is set to 2\n- Looping\
    \ ... i is set to goodbye\n\nSo, as you can see, for simply loops through whatever\
    \ input it is given, until it runs out of input.\n\n### While Loops\n\nwhile loops\
    \ can be much more fun! (depending on your idea of fun, and how often you get\
    \ out of the house... )\n\n```bash\nwhile.sh\n#!/bin/sh\nINPUT_STRING=hello\n\
    while [ \"$INPUT_STRING\" != \"bye\" ]\ndo\necho \"Please type something in (bye\
    \ to quit)\"\nread INPUT_STRING\necho \"You typed: $INPUT_STRING\"\ndone\n```\n\
    \nWhat happens here, is that the echo and read statements will run indefinitely\
    \ until you type \"bye\" when prompted. Review “Variables - Part 1” (Chapter 4)\
    \ to see why we use INPUT_STRING=hello before testing it. This makes it a repeat\
    \ loop, not a traditional while loop.\n\nThe colon (:) always evaluates to true;\
    \ whilst using this can be necessary times, it is often preferable to use a real\
    \ exit condition. Compare quitting the above loop with the one below; see which\
    \ is the more elegant. Also think of some situations in which each one would be\
    \ more useful than the other:\n\n```bash\nwhile2.sh\n\n#!/bin/sh\nwhile :\ndo\n\
    \    echo \"Please type something in (Ctrl+C to quit)\"\n    read INPUT_STRING\n\
    \    echo \"You typed: $INPUT_STRING\"\ndone\n```\n\nAnother useful trick is the\
    \ while read f loop. This example uses the case statement, which we'll cover later.\
    \ It reads from the file myfile, and for each line, it tells you what language\
    \ it thinks is being used. Each line must end with a LF (newline) - if cat myfile\
    \ doesn't end with a blank line, that final line will not be processed.\n\n```bash\n\
    while3a.sh\n\n#!/bin/sh\nwhile read f\ndo\n    case $f in\n        hello)    \
    \  echo English ;\n        howdy)      echo American ;\n        gday)       echo\
    \ Australian ;\n        bonjour)     echo French ;\n        \"guten tag\")  echo\
    \ German ;\n        *)          echo Unknown Language: $f\n    esac\ndone < myfile\n\
    ```\n\n- 11 while2.sh.txt\n- 12 while3a.sh.txt\n\nOn many Unix systems, this can\
    \ also be done as:\n\n```bash\nwhile3b.sh\n\n#!/bin/sh\nwhile f=`line`\ndo\n \
    \ .. process f ..\ndone < myfile\n```\n\nBut since the while read f works with\
    \ any *nix, and doesn't depend on the external program line, the former is preferable.\
    \ See “External Programs” (Chapter 12) to see why this method uses the backtick\
    \ (`). Had I referred to $i (not f) case above, there would have been no warnings\
