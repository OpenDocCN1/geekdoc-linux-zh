    \ echo 更强强大的命令！\n\n- 4 first2.sh.txt\n\n## 4. 变量 - 第一部分\n\n几乎每种存在的编程语言都有变量的概念，它是某块内存的符号名称，我们可以对其赋值、读取并操纵其内容。Bourne\
