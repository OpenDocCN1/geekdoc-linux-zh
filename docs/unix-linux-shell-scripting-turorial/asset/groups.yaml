    the downfall of many a new shell script programmer, as the source of the problem
    can be difficult to track down.


    Also note the quotes around "${USER_NAME}_file" - if the user entered "Steve Parker"
    (note the space) then without the quotes, the arguments passed to touch would
    be Steve and Parker_file - that is, we''d effectively be saying touch Steve Parker_file,
    which is two files to be touched, not one. The quotes avoid this. Thanks to Chris
    for highlighting this.'
