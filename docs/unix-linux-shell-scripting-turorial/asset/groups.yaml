    本教程的作者 Steve Parker 编写编写了一本完整的书；由 Wrox 出版，书籍《Shell Scripting: Expert Recipes for
    Linux, Bash and more》在所有优质零售商处买到。ISBN 1118024486。建议零售价 $49.99。Kindle 同样可用：


