  mdcn: "\n## 7. 循环\n\n大多数语言都有循环的概念：如果我们想重复某项任务二十次，我们不希望手动输入二十次代码，而且每次只进行细微的修改。因此，在\
    \ Bourne shell 中我们有了 `for` 和 `while` 循环。与其它语言相比，这些功能要少一些，但没有人声称 shell 编程拥有 C 语言那样的威力。\n\
    \n### For 循环\n\n`for` 循环遍历一组值，直到列表耗尽为止：\n\n```bash\nfor.sh\n#!/bin/sh\nfor i in\
    \ 1 2 3 4 5\ndo\necho \"Looping ... number $i\"\ndone\n```\n\n尝试这段代码并看看它的作用。请注意，这些值可以是任何内容：\n\
    \n```bash\nfor2.sh\n\n#!/bin/sh\nfor i in hello 1 * 2 goodbye\ndo\necho \"Looping\
    \ ... i is set to $i\"\ndone\n```\n\n这非常值得尝试。确保你理解了这里发生了什么。尝试在不带 `*` 的情况下运行并掌握该概念，重新阅读“通配符（Wildcards）”章节，然后在带上\
    \ `*` 的情况下再次尝试。也尝试在不同的目录下运行，以及给 `*` 加上双引号，或者在它前面加上反斜杠 (`\\*`) 尝试。\n\n如果你目前无法访问\
    \ shell（在阅读本教程时手头有一个 shell 是非常有用的），上述两个脚本的结果如下：\n\n- Looping .... number 1\n-\
    \ Looping .... number 2\n- Looping .... number 3\n- Looping .... number 4\n- Looping\
    \ .... number 5\n\n而对于第二个示例：\n\n- Looping ... i is set to hello\n- Looping ...\
    \ i is set to 1\n- Looping ... i is set to (当前目录下第一个文件的文件名)\n- ... 等等 ...\n- Looping\
    \ ... i is set to (当前目录下最后一个文件名)\n- Looping ... i is set to 2\n- Looping ... i\
    \ is set to goodbye\n\n所以，正如你所见，`for` 循环简单地遍历它接收到的任何输入，直到输入耗尽。\n\n### While 循环\n\
    \n`while` 循环可以有趣得多！（取决于你对趣味的理解，以及你离开出门的频率……）\n\n```bash\nwhile.sh\n#!/bin/sh\n\
    INPUT_STRING=hello\nwhile [ \"$INPUT_STRING\" != \"bye\" ]\ndo\necho \"Please\
    \ type something in (bye to quit)\"\nread INPUT_STRING\necho \"You typed: $INPUT_STRING\"\
    \ndone\n```\n\n这里发生的是 `echo` 和 `read` 语句将无限运行，直到你在提示时输入 \"bye\"。回顾“变量 - 第一部分”（第\
    \ 4 章）来了解为什么我们在测试之前使用 `INPUT_STRING=hello`。这使得它成为重复循环，而不是传统的 `while` 循环。\n\n冒号\
    \ (`:`) 始终求值为真；虽然有时使用它可能是必要的，但通常认为使用真实的退出条件更好。比较退出上面的循环和下面的循环；看看哪一个更优雅。也考虑在某些情况下，哪一种会比另一种更有用：\n\
    \n```bash\nwhile2.sh\n\n#!/bin/sh\nwhile :\ndo\n    echo \"Please type something\
    \ in (Ctrl+C to quit)\"\n    read INPUT_STRING\n    echo \"You typed: $INPUT_STRING\"\
    \ndone\n```\n\n另一个实用的技巧是 `while read f` 循环。这个示例使用了 `case` 语句，我们稍后会介绍。它从文件 `myfile`\
    \ 读取内容，对于每一行，它都会告诉你它认为使用的是哪种语言。每行必须以 LF（换行符）结束 - 如果 `cat myfile` 不以空行结尾，那么最后一行将不会被处理。\n\
    \n```bash\nwhile3a.sh\n\n#!/bin/sh\nwhile read f\ndo\n    case $f in\n       \
    \ hello)      echo English ;\n        howdy)      echo American ;\n        gday)\
    \       echo Australian ;\n        bonjour)     echo French ;\n        \"guten\
    \ tag\")  echo German ;\n        *)          echo Unknown Language: $f\n    esac\n\
    done < myfile\n```\n\n- 11 while2.sh.txt\n- 12 while3a.sh.txt\n\n在许多 Unix 系统上，也可以这样做：\n\
    \n```bash\nwhile3b.sh\n\n#!/bin/sh\nwhile f=`line`\ndo\n  .. process f ..\ndone\
    \ < myfile\n```\n\n但由于 `while read f` 适用于任何 *nix 系统，且不依赖于外部程序 `line`，因此前者更优。查看“外部程序（External\
    \ Programs）”（第 12 章）以了解为什么这种方法使用了反引号（`` ``）。如果我在上面引用了 `$i`（而不是 `f`），那么即使 `$i`\
    \ 没有被声明或定义，也不会有警告或错误。例如：\n\n```bash\n$ i=THIS_IS_A_BUG\n$ export i\n$ ./while3.sh\
    \ something\nUnknown Language: THIS_IS_A_BUG\n$ \n```\n\n所以请确保你避免拼写错误。这也是使用 `${x}`\
    \ 而不仅仅是 `$x` 的另一个良好理由 - 如果 `x=\"A\"` 且你想说 \"A1\"，你需要执行 `echo ${x}1`，因为 `echo $x1`\
    \ 将尝试使用变量 `x1`，而该变量可能不存在，或者被设置为“B2”，或其他任何意想不到的内容。\n\n我最近在 Usenet 上发现了一个我参与过的旧帖子，我在那里实际上学到了更多……Google\
    \ 在这里记录。\n\n- 13 while3b.sh.txt\n\n## 我从 Linux From Scratch 项目中学到的实用 Bash（但不是\
    \ Bourne Shell）小技巧是：\n\n```bash\nmkdir rc{0,1,2,3,4,5,S}.d\n```\n\n而不是繁琐的\n\n\
    for runlevel in 0 1 2 3 4 5 6 S\ndo\n  mkdir rc${runlevel}.d\ndone\n```\n\n这也可以递归完成：\n\
    \n```bash\n$ cd /\n$ ls -ld {usr,usr/local}/{bin,sbin,lib}\ndrwxr-xr-x 2 root\
    \ root 4096 Oct 26 01:00 /bin\ndrwxr-xr-x 6 root root 4096 Jan 16 17:19 /usr/bin\n\
    drwxr-xr-x 2 root root 4096 Oct 27 00:02 /sbin\ndrwxr-xr-x 2 root root 40960 Jan\
    \ 16 19:35 /usr/bin\ndrwxr-xr-x 83 root root 49152 Jan 16 17:23 /usr/lib\ndrwxr-xr-x\
    \ 2 root root 4096 Jan 16 22:22 /usr/local/bin\n```\n\n"
