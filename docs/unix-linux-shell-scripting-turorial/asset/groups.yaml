    do\necho \"Enter some text (RETURN to quit)\"\nread X\nif [ -n \"$X\" ]; then\n\
    echo \"You said: $X\"\nfi\ndone\n```\n\n另外注意我在这一页上使用了两种不同的 if 语句语法。它们是：\n\n```bash\n\
