    \n#!/bin/sh\n\n# 1. Introduction\n\n## Purpose Of This Tutorial\n\nThis tutorial\
    \ is written to help people understand some of the basics of shell script programming,\
    \ and hopefully to introduce some of the possibilities of simple but powerful\
    \ programming available under the Bourne shell. As such, it has been written as\
    \ a basis for one-on-one or group tutorials and exercises, and as a reference\
    \ for subsequent use.\n\n## A Brief History of sh\n\nSteve Bourne wrote the Bourne\
    \ shell which appeared in the Seventh Edition Bell Labs Research version of Unix.\
    \ Many other shells have been written; this particular tutorial concentrates on\
    \ the Bourne and the Bourne Again shells. Other shells include the Korn Shell\
    \ (ksh), the C Shell (csh), and variations such as tcsh. This tutorial does not\
    \ cover those shells.\n\n## Audience\n\nThis tutorial assumes some prior experience;\
    \ namely:\n\n- Use of an interactive Unix shell\n- Minimal programming knowledge\
    \ - use of variables, functions, is useful background knowledge\n- Understanding\
    \ of some Unix/Linux commands, and competence in using some of the more common\
    \ ones. Programmers of ruby, perl, python, C, Pascal, or any programming language\
    \ (even BASIC) who can maybe read shell scripts, but don't feel they understand\
    \ exactly how they work.\n\n## Typographical Conventions Used in This Tutorial\n\
    \nSignificant words will be written in italics when mentioned for the first time.\
    \ Code segments and script output will be displayed as monospaced text. Command-line\
    \ entries will be preceded by the Dollar sign ($). If your prompt is different,\
    \ enter the command:\n\n```\nPS1=\"$ \"\n```\n\nThen your interactions should\
    \ match the examples given (such as ./my-script.sh below). Script output (such\
    \ as \"Hello World\" below) is displayed at the start of the line.\n\nText that\
    \ is to be entered by you, is shown in bold text.\n\n```\n$ echo '#!/bin/sh' >\
    \ my-script.sh\n$ echo 'echo Hello World' >> my-script.sh\n$ chmod 755 my-script.sh\n\
    $ ./my-script.sh\nHello World\n$\n```\n\nEntire scripts will include a reference\
    \ to where the plain text of the script may be found – you can download the full\
    \ set of scripts in this book from https://steve-parker.org/shell/download/. It\
    \ is recommended to download these now, so that you have them ready when they\
    \ come up.\n\n```\nfirst.sh¹\n\n#!/bin/sh\n# This is a comment!\necho Hello World\n\
    # This is a comment, too!\n```\n\nNote that to make a file executable, you must\
    \ set the xutable bit, and for a shell script, the Readable bit must also be set:\n\
    \n```\n$ chmod a+rx first.sh\n```\n\n```\n$ ./first.sh\n```\n\nTo get started,\
    \ you can download all of the scripts in this book from https://steve-parker.org/shell/download/.\n\
    \nFootnotes (like that at the bottom of this page) will refer you to the appropriate\
    \ script as you come across it.\n\n¹ first.sh.txt\n\nShell Scripting Tutorial\n\
    \n# 2. Philosophy\n\nShell script programming has a bit of bad press amongst some\
    \ Unix systems administrators. This is normally because of one of two things:\n\
    \n- The speed at which an interpreted program will run as compared to a C program,\
    \ or even an interpreted Perl program.\n- Since it is easy to write a simple batch-job\
    \ type shell script, there are a lot of poor quality scripts around.\n\nIt is\
    \ partly due to this that there is a certain machismo associated with creating\
    \ *good* shell scripts. Scripts which can be used as CGI programs, for example,\
    \ without losing out too much in speed to Perl (though both would lose to C, in\
    \ many cases, were speed the only criterion).\n\nThere are a number of factors\
    \ which can go into good, clean, quick, shell scripts.\n\n- The most important\
    \ criteria must be a clear, readable layout.\n- Second is avoiding unnecessary\
    \ commands.\n\nA clear layout makes the difference between a shell script appearing\
    \ as \"black magic\" and one which is easily maintained and understood. You may\
    \ be forgiven for thinking that with a simple script, this is\n"
