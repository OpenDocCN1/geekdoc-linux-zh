    # #!/ch/8


    # 8. Test


    test is used by virtually every shell script written. It may not seem that way,
    because test is not often called directly. test is more frequently called as [.
    [ is a symbolic link to test, just to make shell programs more readable. If is
    also normally a shell builtin (which means that the shell itself will interpret
    [ as meaning test, even if your Unix environment is set up differently):


    ```

    $ type [

    [ is a shell builtin [

    $ which /usr/bin/

    $ ls -l /usr/bin/ /usr/bin/[ lrwwxrxrwx 1 root root 4 Mar 27 2000 /usr/bin/ ->
    test

    ```


    This means that ''['' is actually a program, just like ls and other programs,
    so it must be surrounded by spaces:


    if [$foo = "bar" ]


    will not work; it is interpreted as if testfoo = "bar" ], which is a '' ]'' without
    a beginning ''[''. Put spaces around all your operators. I''ve highlighted the
    mandatory spaces with the word ''SPACE'' - replace ''SPACE'' with an actual space;
    if there isn''t a space there there, it won''t work:


    ```

    if SPACE [ SPACE "$foo" SPACE = SPACE "bar" SPACE ]

    ```'
  - "[PAGE 37]\n\nNote: Some shells also accept \"==\" for string comparison; this\
    \ is not portable, a single \"=\" should be used for strings, or \"-eq\" for integers.\n\
    \ntest is a simple but powerful comparison utility. For full details, run man\
    \ test on your system, but here are some usages and typical examples.\n\ntest\
    \ most often invoked indirectly via the if and while statements. It is also the\
    \ reason you will come into difficulties if you create a program called test and\
    \ try to run it, as this shell builtin will be called instead of your program!\
    \ The syntax for if...then...else... is:\n\n```\nif [ ... ]\nthen\n    # if-code\n\
    else\n    # else-code\nfi\n```\n\nNote that fi is backwards! This is used again\
    \ later with case and esac. Also, be aware of the syntax - the \"if [ ... ]\"\
    \ and the \"then\" commands must be on different lines. Alternatively, the semicolon\
    \ \";\" can separate them:\n\n```\nif [ ... ]; then\n    # do something\nfi\n\
    ```\n\nYou can also use the elif, like this:\n\n```\nif [ something ]; then\n\
    \    echo \"Something\"\nelif [ something_else ]; then\n    echo \"Something else\"\
    \nelse\n    echo \"None of the above\"\nfi\n```"
  - "[PAGE 38]\n\nThis echo \"Something\" if the [ something ] test succeeds, otherwise\
    \ it will test [ something_else ], and echo \"Something else\" that succeeds.\
    \ If all else fails, it will echo \"None of the above\".\n\nTry following the\
    \ code snippet, before running it set the variable X to various values (try -1,\
    \ 0, 1, hello, bye, etc). You can do this as follows (thanks to Dave for pointing\
    \ out the need to export the variable, as noted in Variables - Part I):\n\n```\n\
    $ X=5\n$ export X //\n$ ./test.sh\n... output of test.sh...\n$ X=hello\n$ ./test.sh\n\
    ... output of test.sh...\n$ X=test.sh\n$ ./test.sh\n... output of test.sh...\n\
    ```\n\nThen try it again, with $X snippet, as the name of an existing file, such\
    \ as /etc/hosts.\n\n```\ntest.sh¹⁶\n\n#!/bin/sh\nif [ \"$X\" -lt \"0\" ]\nthen\n\
    \    echo \"X is less than zero\"\nfi\nif [ \"$X\" -gt \"0\" ]; then\n    echo\
    \ \"X is more than zero\"\nfi\n[ \"$X\" -le \"0\" ] && \\\nn    echo \"X is less\
    \ than or equal to zero\"\n[ \"$X\" -ge \"0\" ] && \\\\n    echo \"X is more than\
    \ or equal to zero\"\n```\n\n16 test.sh.txt"
- md: "\n```bash\n[ \"$X\" = \"0\" ] && \\\necho X is the string or number \"0\"\n\
    [ \"$X = \"hello\" ] && \\\necho X matches the string \"hello\"\n[ \"$X != \"\
    hello\" ] && \\\necho X is not the string \"hello\"\n[ -n \"$X\" ] && \\\necho\
    \ X is of nonzero length\n[ -f \"$X\" ] && \\\necho X is the path of a real file\
    \ || \\\necho No such file: $X\"\n[ -x \"$X\" ] && \\\necho X is the path of an\
    \ executable file\n[ \"$X\" -nt /etc/passwd ] && \\\necho X is a file which is\
    \ newer than /etc/passwd\n```\n\nNote that we can use the semicolon (;) to join\
    \ two lines together. This is often done to save a bit of space in simple if statements.\
    \ The backslash simply tells the shell that this is not the end of the line, but\
    \ the two (or more) lines should be treated as one. This is useful for readability.\
    \ It is customary to indent the following line.\n\nAs we see from these examples,\
    \ test can perform many tests on numbers, strings, and filenames.\n\nThanks to\
    \ Aaron for pointing out that -a, -e (both meaning \"file exists\"), -s (file\
    \ is a Socket), -nt (file is newer than), -ot (file is older than), -ef (paths\
    \ refer to the same file) and -0 (file is not owned by user), are not available\
    \ in the traditional Bourne shell (eg, /bin/sh on Solaris, AIX, HPUX, etc).\n\n\
    There is a simpler way of writing if statements: The && || commands give code\
    \ to run if the result is true, or false, respectively.\n\n```bash\n#!/bin/sh\n\
    [ $X -ne 0 ] && echo \"X isn't zero\" || echo \"X is zero\"\n[ -f $X ] && echo\
    \ \"X is a file\" || echo \"X is not a file\"\n[ -n $X ] && echo \"X is of non-zero\
    \ length\" || \\\necho \"X is of zero length\"\n```\n\nThis syntax is possible\
    \ because there is a file (or shell-builtin) called `[` which is linked to test.\
    \ Be careful using this construct, though, as overuse can lead to very hard-to-read\
    \ code. the if...then...else... structure is much more readable. Use of the [...]\
    \ construct is recommended for loops and trivial sanity checks with which you\
    \ do not want to overly distract the reader.\n\nNote that when you set X to a\
    \ non-numeric value, the first few comparisons result in the message:\n\n```\n\
    test.sh: [: integer expression expected before -lt\ntest.sh: [: integer expression\
    \ expected before -gt\ntest.sh: [: integer expression expected before -le\ntest.sh:\
    \ [: integer expression expected before -ge\n```\n\nThis is because the -lt, -gt,\
    \ -le and -ge comparisons are only designed for integers, and do not work on strings.\
    \ The string comparisons, such as != will happily treat \"5\" as a string, but\
    \ there is no sensible way of treating \"Hello\" as an integer, so the integer\
    \ comparisons complain. If you want your shell script to behave more gracefully,\
    \ you will have to check the contents of the variable before you test it - maybe\
    \ something like this:\n\n```bash\necho -en \"Please guess the magic number: \"\
    \ \nread X \necho $X | grep \"[0-9]\" > /dev/null 2>&1 \nif [ \"$?\" -eq \"0\"\
    \ ]; then \n  # If the grep found something other than 0-9 \n  # then it's not\
    \ an integer.\n  echo \"Sorry, wanted a number\" \nelse \n  # The grep found only\
    \ 0-9, so it's an integer.\n  # We can safely do a test on it.\n  if [ \"$X\"\
    \ = \"7\" ]; then \n    echo \"You entered the magic number!\"\n  fi \nfi\n```\n\
    \nIn this way you can echo a more meaningful message to the user, and exit gracefully.\
    \ The $? variable is explained in \"Variables - Shell Scripting Tutorial II\"\
    \ (Chapter 10), and grep is a complicated beast, so here goes: grep [0-9] finds\
    \ lines of text which contain digits (0-9) and possibly other characters, so the\
    \ caret (^) in grep [0-9] finds only those lines which do not consist only of\
    \ numbers. We can then take the opposite (by acting on failure, not success).\
    \ Okay? The >dev/null 2>&1 directs any output or errors to the special \"null\"\
    \ device, instead of going to the user's screen. Schermerhorn for correcting me\
    \ - this page used to claim that grep -v [0-9] would work, but this is clearly\
    \ too simplistic.\n\nWe can use test in while loops as follows:\n\n```bash\n#\
    \ test2.sh¹⁷\n#!/bin/sh\nX=0\nwhile [ -n \"$X\" ]\ndo\n  echo \"Enter some text\
    \ (RETURN to quit\"\n  read X\n  echo \"You said: $X\"\ndone\n```\n\nThis code\
    \ will keep asking for input until you hit RETURN (X is zero length). Thanks to\
    \ Justin Heath for pointing out that the script didn't work - I'd missed out the\
    \ quotes around $X in the while [ -n \"$X\" ]. Without those quotes, there is\
    \ nothing to test when $X is empty. Alexander Weber has pointed out that running\
    \ this script will end untidily:\n\n```bash\n$ ./test2.sh\nEnter some text (RETURN\
    \ to quit)\nfred\nYou said: fred\nEnter some text (RETURN to quit)\nwilma\nYou\
    \ said: wilma\nEnter some text (RETURN to quit)\n\nYou said:\n$\n```\n\nThis can\
    \ be tidied up with another test within the loop:\n\n```bash\n#!/bin/sh\n\nX=0\n\
    while [ -n \"$X\" ]\ndo\necho \"Enter some text (RETURN to quit)\"\nread X\nif\
    \ [ -n \"$X\" ]; then\necho \"You said: $X\"\nfi\ndone\n```\n\nNote also that\
    \ I've used two different syntaxes for if statements on this page. These are:\n\
    \n```bash\nif [ \"$X\" -lt \"0\" \nthen\necho \"X is less than zero\"\nfi\n```\n\
    \nand ........\n\n```bash\nif [ -n \"$X\" ]; then\necho \"You said: $X\"\nfi\n\
    ```\n\nYou must have a break between the if statement and the then construct.\
    \ This can be a semicolon or a newline, it doesn't matter which, but there must\
    \ be one or the other between the if and the then. It would be nice to just say:\n\
    \n```bash\nif [ ! -n \"$X\" ]\n  echo \"You said: $X\"\n```\n\nbut the then and\
    \ fi are absolutely required.\n\n## 9. Case\n\nThe case statement saves going\
    \ through a whole set of if .. then .. else statements. Its syntax is really quite\
    \ simple:\n\ntalk.sh¹⁸\n\n```bash\n#!/bin/sh\necho \"Please talk to me ...\"\n\
    while :\n  read INPUT_STRING\n  case $INPUT_STRING in\n    hello)\n      echo\
    \ \"Hello yourself!\"\n      ;;\n    bye)\n      echo \"See you again!\"\n   \
    \   break\n      ;;\n    *)\n      echo \"Sorry, I don't understand\"\n      ;;\n\
    \  esac\ndone\necho\necho \"That's all folks!\"\n```\n¹⁸ talk.sh.txt\n\nOkay,\
    \ so it's not the best conversationalist in the world; it's only an example! Try\
    \ running it and check how it works...\n\n```bash\n$ ./talk.sh\nPlease talk to\
    \ me ...\nhello\nHello yourself!\nWhat do you think?\nSorry, I don't understand\n\
    bye\nSee again!\n\nThat's all folks!\n$\n```\n\nThe syntax is quite simple: The\
    \ case line itself means that we are testing the value of variable INPUT_STRING.\
    \ The options we understand are listed and followed by a right bracket, hello\
    \ and bye). This means that if INPUT_STRING matches hello then section of code\
    \ is executed, up to the double semicolon. If INPUT_STRING matches \"bye\" then\
    \ the \"goodbye\" message is printed and the loop exits. The third option here,\
    \ *, is the default catch-all condition; it is not required, but is often useful\
    \ for debugging purposes.\n\nThe whole case statement is ended with esac (case\
    \ backwards!) then we end the loop with done. That's about as complicated as case\
    \ conditions get, but they can be a very useful and powerful tool. They are often\
    \ used to parse the parameters passed to a shell script, amongst other uses.\n\
    \n## 10. Variables - Part II\n\nThere are a set of variables which are set for\
    \ you already, and most of these cannot have values assigned to them. These can\
    \ contain useful information, which can be used by script to know about the environment\
    \ in which it is running.\n\nThe first set of variables we will look at are $0\
    \ .. $9 and $#. The variable $0 is the basename of the program as it was called.\
    \ $1 .. $9 are the first 9 additional parameters the script was called with. The\
    \ variable $@ is all parameters $1 .. whatever. The variable $*, is similar, but\
    \ does not preserve any whitespace, and quoting, so \"File with spaces\" becomes\
    \ \"File\" with \"spaces\". This is similar to the echo stuff we looked at in\
    \ A First Script. As a general rule, use @@ and avoid $$. $# is the number of\
    \ parameters the script was called with. Let's take an example script:\n\n```bash\n\
    var3.sh\n#!/bin/sh\necho \"I was called with $# parameters\"\necho \"My name is\
    \ $0\"\necho \"My first parameter is $1\"\necho \"My second parameter is $2\"\n\
    echo \"All parameters are $@\"\n```\n"
