    MYVAR hasn''t been set to any value, so it''s blank. Then we give it a

    value, and it has the expected result.

    Now run:


    ```

    $ MYVAR=hello

    $ ./myvar2.sh

    MYVAR is:

    MYVAR is: hi there

    ```


    It''s still not set! What''s going on?!

    When you call myvar2.sh from your interactive shell, a new shell


    6 myvar2.sh.txt'
  - '[PAGE 20]


    spawned to run the script. This is partly because of the #!/bin/sh line at the
    start of the script, which we discussed earlier.


    We need to export the variable for it to be inherited by another program - including
    a shell script. Type:


    ```

    $ export MYVAR

    $ ./var2.sh

    MYVAR is: hello

    MYVAR is: hi there

    ```


    Now look at line 3 of the script: this is changing the value of MYVAR. But there
    is no way that this will be passed back to your interactive shell. Try reading
    the value of MYVAR:


    ```

    $ echo $MYVAR

    hello

    $

    ```


    Once the shell script exits, its environment is destroyed. But MYVAR keeps its
    value of hello within your interactive shell. In order to receive environment
    changes back from the script, we must source the script - this effectively runs
    the script within our own interactive shell, instead of spawning another shell
    to run it. We can source a script via the ".\" (dot) command:"


    ```

    $ MYVAR=hello

    $ echo $MYVAR

    hello

    $ ./var2.sh

    MYVAR is: hello

    MYVAR is: hi there

    $ echo $MYVAR

    hi there

    ```


    The change has now made out into our shell again! This is how your .profile or
    .bash_profile file works, for example. Note that in this case, we don''t need
    to export MYVAR. Thanks to sway for pointing out that I''d originally said echo'
  - '[PAGE 21]


    MYVAR above, not echo $MYVAR as it should be. Another example of an easy mistake
    to make with shell scripts. One other thing worth mentioning at this point about
    variables, is to consider the following shell script:


    ```

    #!/bin/sh

    echo "What is your name?"

    read USER_NAME

    echo "Hello $USER_NAME"

    echo "I will create you a file called $USER_NAME_file"

    touch $USER_NAME_file

    ```


    Think about what result you would expect. For example, if you enter "steve" as
    your USER_NAME, should the script create steve_file?

    Actually, no. This will cause an error unless there is a variable called USER_NAME_file.
    The shell does not know where the variable ends and the rest starts. How can we
    define this?

    The answer is, that we enclose the variable itself in *curly*:


    ```

    user.sh⁷

    #!/bin/sh

    echo "What is your name?"

    read USER_NAME

    echo "Hello $USER_NAME"

    echo "I will create you a file called ${USER_NAME}_file"

    touch "${USER_NAME}_file"

    ```


    The shell now knows that we are referring to the variable USER_NAME and that we
    want it suffixed with "_file". This can be


    +   - user.sh.txt'
