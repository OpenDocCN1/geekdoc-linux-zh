    \ you think?\nSorry, I don't understand\nbye\nSee again!\n\nThat's all folks!\n\
    $\n```\n\n语法非常简单：`case` 行本身意味着我们正在测试变量 `INPUT_STRING` 的值。我们理解的选项列出并跟着一个右括号，`hello)`\
    \ 和 `bye)`。这意味着如果 `INPUT_STRING` 匹配 `hello`，则执行相应的代码，直到双分号。如果 `INPUT_STRING` 匹配\
