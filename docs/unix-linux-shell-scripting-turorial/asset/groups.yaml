  - "[PAGE 67]\n\n# Exit Codes\n\nExit codes are a number between 0 and 255, which\
    \ is returned by any Unix command when it returns control to its parent process.\
    \ Other numbers can be used, but these are treated modulo 256, so exit 10 is equivalent\
    \ to exit 246, and exit 257 is equivalent to exit 1.\n\nThese can be used within\
    \ a shell script to change the flow of execution depending on the success or failure\
    \ of commands executed. This was briefly introduced in Chapter 10, “Variables\
    \ - Part II”. Here we shall look in more detail in the available interpretations\
    \ of exit codes.\n\nSuccess is traditionally represented with exit 0; failure\
    \ is normally indicated with a non-zero exit-code. This value can indicate different\
    \ reasons for failure. For example, GNU grep returns 0 on success, 1 if no matches\
    \ were found, and 2 for other errors (syntax errors, non-existent input files,\
    \ etc).\n\nWe shall look at three different methods for checking error status,\
    \ and discuss the pros and cons of each approach.\n\nFirstly, the simple approach:\n\
    \n```\n```\n#!/bin/sh\n# First attempt at checking return codes\nUSERNAME=`grep\
    \ \"^${1}:\" /etc/passwd|cut -d:\" -f1`\nif [ \"$?\" -ne \"0\" ]; then\n  echo\
    \ \"Sorry, cannot find user ${1} in /etc/passwd\"\n  exit 1\nfi\nNAME=`grep \"\
    ^${1}:\" /etc/passwd|cut -d:\" -f5`\nHOMEDIR=`grep \"^${1}:\" /etc/passwd|cut\
    \ -d:\" -f6`\n\necho \"USERNAME:$USERNAME\"\necho \"NAME: $NAME\"\necho \"HOMEDIR:$HOMEDIR\"\
    \n```\n```"
  - "[PAGE 68]\n\nThis script works fine if you supply a valid username in /etc/passwd.\
    \ However, if you enter an invalid code, it does not what you might at first expect\
    \ - it keeps running, and just shows:\n\nUSERNAME:\nNAME:\nHOMEDIR:\n\nWhy is\
    \ this? As mentioned, the $? variable is set to the return code of the last executed\
    \ command. In this case, that is cut. had no problems which it feels like reporting\
    \ - as far as I can tell from testing, and re-reading the documentation, cut returns\
    \ whatever happens! It was fed an empty string, and did its job - returned the\
    \ first field of its input, which just had happened to be the empty string. So\
    \ what do we do? If we have an error here, grep will report it, not cut. Therefore,\
    \ we have to test grep's return code, not cut's.\n\n```\n#!/bin/sh\n# Second attempt\
    \ at checking return codes\ngrep \"^${1}:\" \\ /etc/passwd > /dev/null 2>&1\n\
    if [ \"$$\" -ne \"0\" ]; then\n  echo \"Sorry, cannot find user ${1} in /etc/passwd\"\
    \n  exit 1\nfi\nUSERNAME=`grep \"^${1}:\" \\ /etc/passwd|cut -d:\"\" -f1`\nNAME=`grep\
    \ \"^${1}:\" \\ /etc/passwd|cut -d:\"\" -f5`\nHOMEDIR=grep \"^${1}:\" \\ /etc/passwd|cut\
    \ -d:\"\" -f6`\n```\n\n```\necho \"USERNAME: $USERNAME\"\necho \"NAME: $NAME\"\
    \necho \"HOMEDIR: $HOMEDIR\"\n```\n\nThis fixes the problem for us, though at\
    \ the expense of slightly longer code. That is the basic way which textbooks might\
    \ show you, but it is far from being all there is to know error-\n\nShell Scripting\
    \ Tutorial    Page 67"
  - "[PAGE 69]\n\nchecking in shell scripts. This method may not be the most suitable\
    \ to your particular command-sequence, or may be unmaintainable. Below, we shall\
    \ investigate two alternative approaches.\n\nAs a second approach, we can tidy\
    \ this somewhat by putting the test into a separate function, instead of littering\
    \ the code with lots of 4-line tests:\n\n```\n#!/bin/sh\n# A Tidier approach\n\
    \ncheck_errs() {\n  # Function. Parameter 1 is text to display on failure.\n \
    \ if [ \"${1}\" -ne \"0\" ]; then\n    echo \"ERROR #${1} : ${2}\"\n    # as a\
    \ bonus, make our script exit with the right error code.\n    exit ${1}\n  fi\n\
    }\n```\n\n### main script starts here ###\ngrep \"^{1}:\" /etc/passwd > /dev/null\
    \ 2>&1\ncheck errors $ \"User ${1} not found in /etc/passwd\nUSERNAME= grep \"\
    ^\\${1}:\" /etc/passwd|cut -d:\" -f1\ncheck errors $ \"Cut returned an error\"\
    \necho \"USERNAME: $USERNAME\"\ncheck_errs $ \"echo returned an error - very strange!\"\
    \n\nThis allows us to test for errors 3 times, with customised error messages,\
    \ without having to write 3 individual tests. By writing the test routine once,\
    \ we can call it as many times as we wish, creating a more intelligent script,\
    \ at very little expense to the programmer. Perl programmers will recognise this\
    \ as being similar to the die command in Perl."
