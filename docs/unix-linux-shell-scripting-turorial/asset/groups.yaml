- md: '

    We interactively set variable names using the read command; the following script
    asks you for your name then greets you personally:


    var2.sh


    ```

    #!/bin/sh

    echo "What is your name?"

    read MY_NAME

    echo "Hello $MY_NAME - hope you''re well."

    ```


    Mario Bacinsky kindly pointed out to me that I had originally missed the double-quotes
    in line 3, which meant the single-quote in the word "you''re" was unmatched, causing
    an error. It is this kind of thing which can drive a shell programmer crazy, so
    watch out for them!


    This is using the shell-builtin command read which reads a line from standard
    input into the variable supplied.

    Note that if you give it your full name and don''t use double quotes around the
    echo command, it still outputs correctly. How is this done? With the MY_MESSAGE
    variable earlier we had to put double quotes around it to set it.

    What happens, is that the read command automatically places quotes around its
    input, so that spaces are treated correctly. (You will need to quote the output,
    of course - e.g. echo "$MY_MESSAGE").


    ## Scope of Variables


    Variables in the Bourne shell do not have to be declared, as they do in languages
    like C. But if you try to read an undeclared variable, the result is the empty
    string. You get no warnings or errors. This can cause some subtle bugs - if you
    assign MY_OBFUSCATED_VARIABLE=Hello and then


    echo $OBFUSCATED_VARIABLE

    Then you will get nothing (as the second OBFUSCATED is mis-spelled).


    There is a command called export which has a fundamental effect on the scope of
    variables. In order to really know what''s going with your variables, you will
    need to understand some about how this is used.


    Create a small shell script, myvar2.sh:


    myvar2.sh


    ```

    #!/bin/sh

    echo "MYVAR is: $MYVAR"

    MYVAR="hi there"

    echo "MYVAR is: $MYVAR"

    ```


