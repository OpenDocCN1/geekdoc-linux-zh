    \ first.sh\n$ ./first.sh\nHello World\n$\n```\n\n你可能已经预到了这！你甚至可以直接运行：\n\n```bash\n\
    $ echo Hello World\nHello World\n$\n```\n\n现在让我们做一些更改。\n首先，注意 echo 在其参数之间只留**一个**空格。在\
