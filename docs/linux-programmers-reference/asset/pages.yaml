    The dlsym function obtains the address of the bookinput function and assigns it
    to the bkin function pointer. Then the dlsym function assigns the address of the
    printbook function to the prbook function pointer. These two pointers are then
    used to call their respective functions. The dlclose function then unloads the
    library.


