  md: '# The make Utility 217


    A make variable has as its value string. The string can be any set of characters.
    For example, in the next make example, the string "Printing out the source-code
    files" is assigned to the variable PRINTNOTICE. This variable is then evaluated
    in the print dependency line as the argument to an echo command. The string is
