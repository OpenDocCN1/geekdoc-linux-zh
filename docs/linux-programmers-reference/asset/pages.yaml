  md: '# TCSH Configuration 107


    .login file is a login initialization file that executes each time you log in.
    The .tcshrc file is a shell initialization file that executes each time you enter
    the TCSH shell, either from logging in or by explicitly changing to the TCSH shell
    from another shell with the tcsh command. The .logout file executes each time
    you log out.


    # .login


    The TCSH shell has its own login initialization file called the .login file that
    contains shell commands and special variable definitions used to configure your
    shell. The .login file corresponds to the .profile file used in the BASH and ZSH
    shells.


    A .login file contains setenv commands that assign values to special environment
    variables, such as TERM. You can change these assigned values by editing the .login
    file with any of the standard editors. You can also add new values. Remember,
    however, in the TCSH shell, the command for assigning a value to an environment
    variable is setenv. In the next example, the EXINIT variable is defined and it
    is assigned the Vi editor''s line numbering and autointend options.


    +   > setenv EXINIT ''set nu ai''


    Be careful when editing your .login file. Inadvertent changes could cause variables
    to be set incorrectly or not at all. It is wise to make a backup of your .login
    file before editing it.


    If you have made changes to your .login file and you want the changes to take
    effect during your login session, you will need to reexecute the file. You do
    so using the source command. The source command will actually execute any initialization
    file, including the .tcshrc and .logout files. In the next example, the user reexecutes
    the .login file.


    +   > source .login


    # .tcshrc


    The .tcshrc initialization file is executed each time you enter the TCSH shell
    or generate any subshells. If the TCSH shell is your login shell, the .tcshrc
    file is executed along with your .login file when you log in. If you enter the
    TCSH shell from another shell, the .tcshrc file is automatically executed, and
    the variable and alias definitions it contains will be defined.


    The .tcshrc shell initialization file is actually executed each time you generate
    a shell, such as when you run a shell script. In other'
  merge: -1
