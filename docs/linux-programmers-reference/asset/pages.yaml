  md: '# The Revision Control System: RCS 239


    # make Suffix Rules for RCS Files


    The make utility, described previously in this chapter, has several standard suffix
    rules for managing RCS files. make assumes that an RCS file corresponds to a source-code
    file and includes a source-code file, such as .c. For example, the RCS file for
    main.c is main.c,v, the .v being the suffix for RCS files. make will then use
    a standard suffix rule for the RCS file suffix to extract the source-code file
    using the RCS co command; then make will compile that source-code file to create
    an object-code file. In the case of files with a .c,v suffix, make will use the
    C compiler to create the object-code file. If the RCS file had a .f,v suffix,
    make would use the Fortran compiler.


    In the next example, the user has only two files in the directory, for each source-code
    file in the program. The makefile consists of one dependency line for making the
    bookrec program. Since there are no dependency lines for making the object-code
    files, and there are no source-code files in the directory, make will use a standard
    RCS suffix rule to create the object-code files.


    # makefile


    bookrec : main.o io.o

    cc main.o io.o - bookrec OK


    # $ make


    ```

    co main.c

