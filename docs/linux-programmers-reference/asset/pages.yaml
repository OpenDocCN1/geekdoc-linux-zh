  md: '# TCSH Configuration 105


    # cdpath


    The cdpath variable holds the path names of directories to be searched for specified
    subdirectories referenced with the cd command. These path names form an array
    just like the array of path names assigned to the TCSH shell path variable. Notice
    the space between the path names.


    +   > set cdpath = (/usr/chris/reports /usr/chris/letters)


    # history and savehist


    As learned earlier, the history variable can be used to determine the number of
    history events you saved. You simply assign to it the maximum number of events
    that history should record. When the maximum is reached, the count starts over
    again from 1. The savehist variable, holds the number of events that will be saved
    in the history file when you log out. When you log in again, these events will
    become the initial history list.


    In the next example, up to 20 events will be recorded in your history list while
    you are logged in. However, only the last 5 will be saved in .history file when
    you log out. Upon logging in again, your history list will consist of your last
    5 commands from the previous session.


    +   > set history = 20

    > set savehist = 5


