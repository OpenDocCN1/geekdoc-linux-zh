  md: '# 218 The make Utility


    command name of the system''s Fortran compiler. Compiler options are held in variables
    whose names end with FLAGS. For example, CFLAGS holds the standard C compiler
    options such as -O, which invokes the optimizer. FFLAGS holds the Fortran compiler''s
    standard options.


    The predefined variables, listed in the following table, are useful if you have
    several different compilers for the same computer language, or if the system compiler
    changes frequently. Suppose that you have several different C compilers on your
    system to choose from. One of them will be considered the default and have its
    name assigned to the CC variable. However, in your makefile, you can change the
    value of any of the predefined variables. To use one C compiler or the other,
    just assign that compiler''s command name to the CC variable. The same is true
    for the option variables. To add the -g option to the CFLAGS variable, just assign
    -O to it in your makefile. The advantage of using the predefined variable is that
    command names held in them are also used in implied make operations, that you
    do not explicitly enter in a dependency line.


    | Predefined Variable | Default Value | Description |

    |---|---|---|

    | CC | gcc | C compiler |

    | CFLAGS | -O | Options for the C compiler |

    | AS | as | Assembler |

    | ASFLAGS | | Options for Assembler |

    | FC | f77 | Fortran compiler |

    | FFLAGS | | Options for the Fortran compiler |

    | LD | ld | Loader to link object-code files |

    | LDFLAGS | lex | Lexical Analyzer: creates .c files from .files |

    | LFLAGS | | Lexical options |

    | MAKE | make | The make utility |

    | MAKEFLAGS | b | Options for make |'
