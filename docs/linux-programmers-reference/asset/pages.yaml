    There is a special relationship between the Unix operating system and the C programming
    language. The C programming language was developed specifically as a tool for
    programming the Unix operating system, and the code for the Unix operating system
    is actually written in C. Linux has the same kind of special relationship with
    C. Most Linux systems include the GNU version of the C compiler, gcc. The C programming
    language is a very complex language with many different features. This section
    briefly describes the basic components of the C programming language and uses
    them to construct a useful example. With an example program we can then examine
    the different ways you can compile C programs.


    A C program is made up of a set of function definitions that contain variable
    declarations and statements. Program execution always begins with a function named
    main. The program then progresses from one function to another function calls.
    For example, the printf function is an often-called function that outputs data.


    The definition of a C function consists of a header and a body. The header contains
    the return value of the function, the function name, and argument variables encased
    in parentheses. If there is no return value or no argument variables for the function,
    then the keyword void is used instead. The body of the function consists of variable
    declarations and statements enclosed in opening and closing braces.'
