  md: '# Z-Shell Commands 137


    # notify


    notify job-number


    After you execute any command in Linux, the system will tell you what background
    jobs, if you have any running, have been depleted so far. The system will not
    interrupt any operation, such as editing, to notify you about a completed job.
    If you want to be notified immediately when a certain job ends, no matter what
    you are doing on the system, you can use the notify command to instruct the system
    to tell you. The notify command takes as its argument a job number. When that
    job has finished, the system will interrupt what you are doing to notify you that
    the job has ended. The next example tells the system to notify the user when job
    2 has finished.


    ```

    $ notify %2

    ```


