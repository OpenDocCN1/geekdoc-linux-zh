  md: '# The make Utility 215


    Since the target in such a dependency line is not in any way related to any other
    dependency line, how could it ever be executed? By default, make begins processing
    with the first dependency line in the makefile. However, you can direct make to
    begin processing with a specific dependency line by using its target as an argument
    on the command line. If you list the target of a dependency line, then make will
    execute that dependency line, ignoring the others. In the previous makefile, the
    last dependency line only prints files. Its target is the print. There is no dependency
    list, so if this dependency line is ever processed, it will always execute its
    Linux command.


    ```

    $ make print

    lpr main.c io.c

    $

    ```


    You can actually specify any target on the command line. For example, you could
    explicitly specify main.o as a target on the command line. Then make would only
    execute the main.o dependency line, checking to see if the main.c file should
    be compiled. Notice that for this makefile, the make command by itself and make
    with the bookrec argument have the same effect. bookrec is the target of the first
    dependency line in the file and thus also the default.


    A make argument commonly used with software that you may download is the install
    argument. Usually the makefile is used to both compile a program and then to install
    it into system directories on your system. To compile, you usually just enter
    the make command by itself. To install, you would enter make with the install
    target.


    ```

    $ make install

    ```


