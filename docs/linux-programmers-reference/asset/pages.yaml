  md: '# Chapter 1

    BASH Shell Programming


    The BASH shell has programming-language-like capabilities that allow you to combine
    shell variables, control structures, expressions, and Linux commands to create
    complex shell programs. A shell program combines Linux commands in such a way
    as to perform a specific task. The Linux shell provides you with many programming
    tools with which to create shell programs. You can also define variables and assign
    values to them. You can also define variables in a script file and have a user
    interactively enter values when the script is executed. There are loop and conditional
    control structures that repeat Linux commands or make decisions on which commands
    you want to execute. You can also construct expressions that perform arithmetic
    or comparison operations. All these programming tools operate like those found
    in other programming languages.


    Usually, the instructions making up a shell program are entered into a script
    file that can then be executed. You can create this script file using any standard
    editor. To run the shell program, you execute its script file.


    ![](img/3db93a7d263e3b589612548bc59abfdb_18_0.png)


    A shell script is a text file that contains Linux commands, which you enter using
    any standard editor. You can then execute the commands in the file by using the
    filename as an argument to any sh or dot command (.). The shell then reads and
    executes the commands in the script. You can also make the script file executable
    and use its name directly on the command line, as you would use the name of any
    command.


    You make a script file executable by setting its execute permission with the chmod
    command. The executable permission for the chmod command can be set using either
    symbolic or absolute references. The symbolic reference u+x sets the execute'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Shell Scripts: Commands and Comments


    permission of a file. The command chmod u+x hello will set the execute permission
    of the hello script file. You can now use the script filename hello as if it were
    a Linux command. You only need to set the executable permission once. Once set,
    it remains set until you explicitly change it.


    hello


    echo "Hello, how are you"


    ```

    $ chmod u+x hello

    $ hello

    Hello, how are you

    $ $

    ```


    An absolute reference will set read and write permission at the same time that
    it sets the execute permission. In brief, 700 will set execute as well as read
    and write permission for the user; 600 will set read and write permission, 500
    will set execute and read permission; 400 will set read permission, 300 will set
