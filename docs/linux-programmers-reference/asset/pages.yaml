  md: '# 222 The make Utility


    Target Function


    .SILENT: Do not display commands when executed.


    .SUFFIXES: suffixes Add suffixes to the list of valid suffixes referenced by suffix
    rules. If no suffixes are listed, erase the list of valid suffixes.


    # Suffix Rules


    A suffix rule is a special dependency that specifies how different suffixes depend
    on each other. For example, the main.o file have the same name but different suffixes:
    .c and .o. A suffix rule for files ending in .c and .o would show how a main.o
    file depends on a main.c file. In other words, how you would use a main.c file
    to create a main.o file.


    Suffix rules provide generality to the dependency line. Instead of applying to
    one specific set of files, a suffix rule applies to whole categories of files.
    The categories are determined by the suffixes. For example, you can write a suffix
    rule that applies to all files ending in .o and those ending in .c. Because of
    this generality, suffix rules can drastically reduce the number of dependency
    lines you may need in your makefile. This is particularly true of dependency lines
    to the name of the files specified that perform the same actions and differ only
    with respect except the names of their files. In previous makefile examples, the
    main.o and io dependency lines are identical in every respect both perform the
    same action, specifying how a .o file depends on a .c file and how the gcc command
    creates the .o file. You can replace both of these dependency lines with one suffix
    rule that specifies the dependency of .o and .c files. Moreover, this suffix rule
    would apply to all files you may later add that in .c and .o. You would not have
    to add any new dependency lines for them.


    The target of a suffix rule consists of a sequence of two suffixes, each beginning
    with a period. The second suffix depends on the first suffix. The target for a
    suffix rule for .c and .o files would consist of the suffix followed by :o. A
    .o file depends on a .c file. The syntax for a suffix rule follows.


    ```

    .suffix1.suffix2:

    Linux command

    ```'
