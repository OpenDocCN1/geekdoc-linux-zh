  md: 'Online Manuals for Applications: man


    # Online Manuals for Applications: man


    As you develop a program for use on Linux, you may need to document it. If it
    is a large application worked on by several programmers at once, documentation
    may become essential. Documentation often takes the form of a manual describing
    different commands and features of a program. Many times an application is broken
    down into separate programs. It is very helpful to both users and program developers
    to be able to retrieve and display appropriate sections of an application''s manual.
    Such an online manual provides instant access to documentation by all users and
    developers. The **man** command provides access to an online manual for Linux
    commands, and you can also use the **man** command to manage your own online applications.
    You can create **man** documents using special **man** text-processing macros.
    You can then instruct the **man** command to read these documents.


    One of the most common uses today of **groff** is the creation of online manual
    documents. The online manual that you find on your Linux system is actually a
    **groff** document. You use a set of macros called the **man** macros to create
    your own online manual entries. If you create a new command and want to document
    it, you can create a manual document for it and read this document with the **man**
    command.


    When you call the **man** command with the name of a document, the **man** command
    uses **groff** to format the document and then display it. The actual document
    you create is an unformatted text file with the appropriate **man** macros. The
    **man** macros are very similar to the **ms** macros. You can actually format
    and display a manual document directly by using the **groff** command with the
    **-man** option. In the next example, both commands display the manual document
    for the **ls** command.


    ```

    $ ls

    $ groff -man /usr/man/man1/ls | more

    ```


    # man Document Files


    You can create a **man** document file using any standard text editor. The name
    that you give to the text file is the name of the'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Online Manuals for Applications: man 243


    command or topic it is about, with a section number as an extension. The name
    of a document about the who command would be called who.1. In the example described
    here, the document is about the bookrec command and has a section number 1. Its
    name is bookrec.1. Section numbers are discussed in the next section, "man Directories."


    A man document is organized into sections with a running title at the top. The
    sections may be named anything you wish. By convention, a man document for Linux
    commands is organized into several predetermined sections, such as NAME, SYNOPSIS,
    and DESCRIPTION. You are, however, free to have as many sections as you want and
    give them names of your choosing. The actual document that you create is an unformatted
    text file with the appropriate man macros. A manual document requires at least
    two different macros: .TH and .SH provides a running title that will be displayed
    at the top of each page of the document as well as the document''s section number.
    You use the SH command for each section heading. You can add other macros as you
    need them, such as a .PP macro for paragraph formatting, or an .IP macro for indented
    paragraphs.


    You enter a man in your document at the beginning of a line, preceded by a period.
    Any text that you enter in the lines after the macro will be formatted by it.
    Some macros, .SH and .TH, take arguments until another macro is reached. You enter
    in arguments after the macro on the same line as the .SH macro. The body of the
    section name on the same line as the .SH macro. The body of the section then follows.
    The body of the section text is entered in a series of short lines. These lines
    will later be formatted by man into a justified paragraph. In the next example,
    the user enters a .SH macro and follows it with the section name DESCRIPTION.
    In the following lines, the user enters the text of the section.


    . SH DESCRIPTION


    mylistopst provides alternative ways of displaying your grocery list.

    You can display it with numbers, dates, or save the list in a file.


    Your man document is organized into a series of section-heading macros with their
    names and text. The template below gives you an idea of how to organize your man
    document. It is the organization usually followed by the online manual for Linux
    commands.'
  merge: -1
