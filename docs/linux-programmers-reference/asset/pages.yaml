  md: '# Packaging Your Software: autoconf and rpm 193


    system. It is this new makefile that is used to compile the program.


    autoconf is designed to create values for different features that can be used
    with the makefile.in to create a new makefile containing those features. The feature
    values are placed in special shell variables called output variables. You should
    place references to these shell variables in the makefile.in wherever you want
    to use these values. For example, the CC variable will hold the name of the C
    compiler on your system (cc or gcc). The AC_PROG_CC macro in the configure script
    will detect the C compiler in use and place its name in the CC variable. A reference
    to this variable should be placed in the makefile.in file where you would invoke
    the C compiler. The variable name is bounded by two @ symbols. For example, @CC
    in the makefile.in will reference the CC variable, and its will be substituted
    in that place.


    The following is an example of the autoconf process using the source-code files
    for the bookrec program. The files are kept in a directory called bookrec-1.0.
    The autoconf command takes its argument directory that holds the source-code files.
    Be sure that it also includes the makefile.in file for that program. autoconf
    will create a new file called configure.scan in that directory. We then rename
    the configure.scan file to configure.in. autoconf will only read from a file named
    configure.in.


    ```

    $ autoconf bookrec-1.0

    $ ls bookrec-1.0

    configure.scan io.c main.c makefile.in

    $ cd bookrec-1.0

    $ mv configure.scan configure.in

    $ ls

    configure.in io.c main.c makefile.in

    ```


    An example of a simple configure.in file is shown next. The last line, the AC_OUTPUT
    macro, instructs autoconf to generate the makefile. There are many such autoconf
    macros that you can include in your configure.in file.


    ```

    $ cat configure.in

    dnl Process this file with autoconf to produce a configure script.

    AC_INIT(main.c)

    dnl Checks for programs.

    AC_PROG_CC

    ```'
