    \ is executed before the loop begins. The third expression, incr-expr, is executed\
    \ within the loop after the statements.\n\nfor(init-expr, test-expr; incr-expr)\n\
    {\n  statements;\n}\n\nLabel a block or loop. Used with the next, last, and redo\
    \ commands.\n\nLABEL: block-or-loop\n\nSkip remainder of loop and start next iteration.\
    \ Will execute any continue block. (Like the C continue command.)\n\nnext\n\n\
    Execute continue block as last statements in a loop. Executed even if a next starts\
    \ next iteration.\n\ncontinue {statements;}\n\nReexecute loop even if test fails.\
    \ Skips continue block.\n\nredo LABEL\n\nExit block or loop. Skips continue block,\
    \ if any. (Like the C break statement.)\n\nlast LABEL\n\n# Functions\n\n| Function\
    \ Name/Syntax | Function |\n\nsub function-name;\nsub function-name (\nstatements;\n\
    }\n\nDeclare a function (function-name).\nDefine a function with the name function-name."
