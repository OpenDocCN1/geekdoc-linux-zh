  md: '# 240 The Revision Control System: RCS


    $ variable holds the name of the target without its suffix, such as main derived
    from the target main.o. Here the $* variable is used to construct the name of
    the C source-code file that ends with a .c. When the RCS suffix operates on the
    file main.c, the variable $<$ holds the name main.c,v, $* holds the name main,
    and *.c constructs the name main.c.


    ```

    .c,v.o:

    co $\$

    gcc -O -c $*.c

    rm -f $*.c

    ```


    The target for an RCS suffix rule consists of an RCS suffix followed by the suffix
    for the dependent file. The RCS suffix consists of a source-code suffix followed
    by a .v. The target for the suffix for the rule that compiles a .c file into a
    .o file using an RCS is .c,v.o. For Fortran it is .f,v.o. For a library member
    the target is .c,v.a.


    You can create your own suffix rule for your RCS files. If you are using C source-code
    files, you can use the target .c,v.o, and then specify your own commands. In the
    next myfile example, the suffix rule allows the user to extract a specific version
    from all the RCS files. The version number is held in the variable SVER.


    ```

    .c,v.o:

    co -r$(SVER) $\$

    gcc -O -c $*.c

    rm -f $*.c

    ```


    An RCS suffix is used in the next example to the bookrec program.


    # makefile


    SVER = 1.2


    ```

    bookrec : main.o io.o

    cc main.o io.o -o bookrec

    ```


    ```

    .c,v.o:

    co -p -r$(SVER) $

    gcc -O -c $*.c

    rm -f $*.c

    ```'
