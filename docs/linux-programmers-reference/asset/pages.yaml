  md: '# 232 The Revision Control System: RCS


    you have made to a program. In effect, RCS provides you with a set of prior versions
    of your program. You can view each version and examine the changes made in each.


    RCS is very helpful in a situation in which a team of programmers is working on
    the same program. Each programmer may make changes to the program at different
    times. RCS can record each change a programmer makes and when it was made. It
    can even include notes about a change.


    RCS stores an original version of a file and it records all changes to the file.
    Using this information it can generate any of several possible versions of a file.
    RCS does not actually store separate full versions of a file. Instead it uses
    the information and the original file to create a full version of the file.


    A set of recorded changes to a file is called a version. Each version is assigned
    a version number that has several components, the first two of which are the release
    and level numbers. By default, the first version is assigned a release number
    of 1 and a level number of 1. A version is often referred to by its release and
    level numbers. The first version is called version 1.1 or delta 1.1. Subsequent
    versions will have the same release number with an incremented level number. The
    next version will be 1.2, then 1.3, etc. You can also change the release number
    manually.


    Versions are usually generated sequentially. Each version holds all changes made
    in previous versions. However, you can create a branch version that is a modification
    of the particular versions. Changes made to a branch would not be included in
    later versions. A branch version has four elements: release, level, branch, and
    sequence. Then the branch specifies a branch of that version. The sequence number
    is the number of the version in that branch. Each branch can itself have several
    versions. In a sense, a branch can be thought of as starting a whole new sequence
    of versions. The branch number 1.1.1.1 references the first branch of the first
    version. 1.1.1.2 references that branch but the second version in the branch.
    1.1.2.1 references a second branch of the first version.


    You can easily create extremely complex RCS files that have a multitude of releases,
    versions, and branches, each with their own versions and other branches. You should
    be careful to generate versions only as they are needed and maintain as simple
    a structure as possible.'
  merge: -1
