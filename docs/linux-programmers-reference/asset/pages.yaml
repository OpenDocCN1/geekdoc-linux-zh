  md: '# Online Manuals for Applications: man 247


    /usr/man. The /usr/man directory itself does not contain manual documents. Rather,
    it contains subdirectories called section directories, which in turn contains
    the documents. The name of a section directory begins with the word man and ends
    with the section number. man1 is the name of the first section directory in a
    manual. There are usually about seven section directories, beginning with man1
    and ending with man7. In your own manual you can have as many as few section directories
    as you want, though you always have to have a man1 directory.


    Section directories allow you to create several documents of varying complexity
    and subject matter for the same command or topic. For example, the document in
    section 1 for the man command gives only a general description, whereas the document
    in section 7 for the man command lists all the man macros. The documents are identified
    by section numbers and reside in the appropriate section directory. The section
    number of a document, as noted previously, is entered in as an argument to the
    .TH macro. To retrieve an online document from a particular section, enter in
    the section number before the command name. The next example displays the document
    on the bookrec command that is in the third section directory. If you enter no
    section number, the first section is assumed.


    # $ man 3 bookrec


    When creating your own manual directory, you need to add in section directories.
    Within the section directories you can then place the man documents that you have
    created. At a minimum, you need to have a man1 section directory. The man command
    will always look for a section directory, and if none is specified, will choose
    man1. In the next example, the user creates a directory called man in the user''s
    home directory, in this case /home/chris/man. Within the directory the user creates
    a directory called man1 and copies in the document bookrec to it.


    ```

    $ mkdir man

    $ cd man

    $ mkdir man1

    $ cp ..bookrec.1 man1

    $ cd man1

    $ pwd

    /home/chris/man/man1

    $ ls

    bookrec.1

    ```'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# 248 Online Manuals for Applications: man


    To have the man utility retrieve a manual document from your own manual directory,
    you can use the -M option with that directory path name. The -M option instructs
    man to search a local directory for a man directory. You enter the local directory''s
    path name on the -M option. In the next example, the user looks for a manual document
    in the user''s own directory: /home/chris/man.


    ```

    $ -M $HOME/man bookrec

    ```


    Instead of explicitly specify your own man directory, you can have man automatically
    search it by adding the path name to your MANPATH special variable. You follow
    the same rules for assigning new values as any shell special variable. You may
    want to place this assignment in your initialization file so that your man directory
    will be automatically added to MANPATH each time you log in. The assignment syntax
    differs in the BASH and TCSH shells. In the BASH shell, as illustrated below,
    any new added directories are separated by a colon:


    ```

    $ MANPATH=$MANPATH:$HOME/man

    ```


    In the TCSH shell, as illustrated below, any new directories are added as elements
    in a TCSH shell array. Such an assignment should be placed in your .cshrc initialization
    file.


    ```

    % setenv MANPATH ($MANPATH) /$HOME/man

    ```


    Using MANPATH, the man command will search all system manual directories, as well
    as your own. Should you want to restrict man to search only your own man directories
    when looking for your online documents, you can do so by simply creating your
    own variation of the Linux man command. In the next example, the user creates
    a shell script myman consisting of the man command and the -M option with a specified
    local man directory. The script will only search for manual documents in that
    directory.


    myman


    ```

    man -M $HOME/man $1

    ```


    ```

    $ myman bookrec

    ```'
