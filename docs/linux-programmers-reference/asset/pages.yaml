  md: '# The make Utility 223


    Notice that the suffix rule has no list of dependent files following the colon.
    In a sense, the dependent files are those specified by the first suffix in the
    target, and the target file is the one specified by the second suffix. In the
    case of a .c and .o dependency, if you change a .c file and then execute make,
    the .o suffix rule would be activated and its Linux command executed. The .o suffix
    rule will be activated for each .c file that has been recently changed. However,
    each time you activate the rule, you need to be able to reference, in the Linux
    command, the particular .c file you are dealing with at the time. When the .o
    suffix rule is invoked for, say, the main.c file in the Linux command, the $ special
    variable evaluates to the name of the current dependent file that is causing the
    suffix rule to activate. For example, if you change your main.c file, then, in
    the .o suffix rule, $ will be set to main.c. If you change several .c files, then
    $ will be set in turn to each one as the suffix rule is invoked for.


    We can now construct a suffix rule for the source-code files and their object-code
    files. The target consists of the suffixes .c and .o and the Linux command consists
    of the gcc -c command with the $ special variable:


    ```

    .c.o:

    gcc -c $

    ```


