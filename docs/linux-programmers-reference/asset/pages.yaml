  md: '# Packaging Your Software: autoconf and rpm


    If you already have an rpm package for the source-code files, you can use the
    --rebuild option to create a package for the binaries. This option will install
    the source-code files, compile the program, install it, and then incorporate the
    program into an rpm binary package. With the --recompile option, it will only
    compile and install the program without creating the binary package.


    | Option | Function |

    | -ba | Create both the executable binary and source-code packages. Perform all
    stages in the spec file: prep, build, install, and create the packages. |

    | -bb | Create just the executable binary package. Perform all stages in the spec
    file: prep, build, install, and create the package. |

    | -bp | Run just the prep stage from the spec file (%prep). |

    | -bl | Do a "list" check. The %files section from the spec file is macro-expanded,
    and checks are made to ensure the files exist. |

    | -bc | Do both prep and build stages, unpacking and compiling the software (%prep
    and %build). |

    | -bi | Do the prep, build, and install stages, unpacking, compiling, and installing
    the software (%prep, %build, and %install). |

    | --short-circuit | Skip to specified stage, not executing any previous stages.
    Only valid with -bc and -bi. |

    | --clean | Remove the build tree after the packages are made. |

    | --test | Do not execute any build stages. Used to test spec files. |

    | --recompile source_package_file | rpm installs the source-code package and performs
    a prep, compile, and install. |

    | --rebuild source_package_file | rpm first installs the named source package,
    and does a prep, compile, and install, and then rebuilds a new binary package.
    |

    | --showrc | List the configuration variables for the /etc/rpmrc file. |'
