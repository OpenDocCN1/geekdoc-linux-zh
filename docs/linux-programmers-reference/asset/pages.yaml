    invokes gcc with only object-code files (.o), causing only the linker to be invoked.
    The Linux commands for the main.o and io.o targets compile, creating .o object
    files. The -c option used with gcc ensures that no linking is done, only compilation,
    generating the object-code file for this source-code.


