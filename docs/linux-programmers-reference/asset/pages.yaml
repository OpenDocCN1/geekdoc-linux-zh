    \ and then compile the source code file.\n\nIn addition to the function definition,\
    \ a C program usually contains what is called a preprocessor command. When you\
    \ compile your C program, the source code is first read by a preprocessor utility,\
    \ which generates a modified version of the program that the C compiler will work\
    \ on. The preprocessor performs a word-processing-like operation, generating an\
    \ edited form of the source code file. Preprocessor commands in the source code\
    \ file act as editing commands, instructing the preprocessor on what changes to\
    \ make. All preprocessing commands begin with a sharp (#) sign. #include <stdio.h>\
    \ is a preprocessor command. In the next example, the #include preprocessor command\
    \ performs a file insert, merging the contents of stdio.h file with the greet.c\
    \ source file, to generate a version of a C program that includes the contents\
    \ of stdio.h.\n\nThe stdio.h file stands for standard input/output. It contains\
    \ references to functions contained in C program libraries. When a final executable\
    \ of the following greet.c program is made, it will be linked to precompiled libraries\
    \ that will contain the object code for the printf. You need the references in\
    \ stdio.h in order to ensure a correct connection.\n\n# greet.c\n\n```\n#include\
    \ <stdio.h>\nvoid main(void) {\n    printf(\"Hello, how are you\\n\");\n}\n```\n\
    \nYou invoke the GNU compiler on your Linux system with the gcc command. The gcc\
    \ command, in turn, calls four other components. The first is the preprocessor.\
    \ A C program contains special preprocessor commands that modify the code before\
    \ it is sent to the compiler. The second component is the compiler itself. The\
    \ compiler will process the code and generate an assembly code version of the\
    \ program. The third component is the assembler. The assembler will use the assembly\
    \ code version of the program to generate an object code version. The fourth component\
    \ is the linker. The linker uses the program's object code to generate an executable\
    \ file. The default name of this is a.out. Normally, you should give the executable\
    \ file a name of your own choosing. The -o option takes a filename"
