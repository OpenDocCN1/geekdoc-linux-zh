    # make Special Variables


    make has a set of specially defined variables that hold information about the
    current dependency line. Their values change from one dependency line to another.
    There are three special variables that you can use in any ordinary dependency
    line: $$, $$, and $?. The $ and $$ variables hold the name of the current target.
    The $? variable holds a list of those dependent files whose time stamps are more
    recent than those of the target file. Some of the special variables apply only
    to special kinds of dependency lines. For example, $* and $<$ are used only with
    suffix rules, and $% is used only with library dependency lines. They are discussed
    in later sections. The make special variables are listed in the following table.


    | Variable | Description |

    | --- | --- |

    | @@ | The name of the target file in a dependency line.

    $$ The name of the target file. This variable can only be used in the list of
    dependent files. |

    | $? | The dependent files that are more recent than the target. This variable
    can only be used in the Linux command of a dependency line. |

    | $% | Member files of a library file that are more recent than the library file.
    In iolib.a is composed of input.o, and input.o is more recent than iolib.a, then
    $% evaluates to input.o. |

    | $<$ | In suffix rules, this variable evaluates to the dependent files that are
    more recent than the target (like $?). |


