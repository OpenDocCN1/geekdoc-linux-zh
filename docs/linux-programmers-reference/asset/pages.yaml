  md: '# 244 Online Manuals for Applications: man


    .TH COMMAND Section -number

    .SH NAME

    Command and brief description of function.

    .SH SYNOPSIS

    Command and options. Each option is encased in brackets. This section is sometimes
    called the SYNTAX.

    .SH DESCRIPTION

    Detailed description of command and options. Use paragraph macros for new paragraphs:
    PP, LP, and IP.

    .SH OPTIONS

    Options used for the command.

    .SH EXAMPLES

    Examples of how a command is used.

    .SH FILE

    Files used by the command.

    .SH ''SEE ALSO*

    References to other documentation or manual documents.

    .SH DIAGNOSTICS

    Description of any unusual output.

    .SH WARNINGS

    Warnings about possible dangerous uses of the command.

    .SH BUGS

    Surprising features and bugs.


    Within the text of a section, you can add other macros to specific text-processing
    operations. You enter these macros on lines by themselves. Some will also take
    arguments. The .PP macro starts a new paragraph and is usually used to display
    options. You enter in the option as an argument to the .IP macro and then the
    following text is indented from it. The .I macro underlines text. The .B macro
    will boldface text. Both the .B and I macro take as their argument the word you
    want to bold or underline. By convention, the command name and options in the
    NAME section are set in bold with the .B macro. Any other use of command names
    is usually underlined with the .I macro. One final note, if you use any hyphens,
    you need to quote them with a backslash. The macros for the man utility are listed
    here:'
