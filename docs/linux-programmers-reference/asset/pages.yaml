    Whereas redirection simply places output in a file, pipes send output to another
    Linux command. You may wonder why this cannot be accomplished with redirection.
    You need to keep in mind the difference between a file and a command: A file is
    a storage medium that holds data. You can save data on it or read data from it.
    A command is a program that executes instructions. A command may read or save
    data in a file, but a command is not in itself a file. not on commands. For this
    reason, a redirection operation operates on files, not commands. Redirection can
    send data from a program to a file, or from a file to a program, but it cannot
    send data directly from a program to another program. Only files can be the destination
    of a redirection operation, not other programs.


    You can, however, simulate the piping process through a series of redirection
    operations. You could send the output of one command to a file. Then, on the next
    line, you could execute a command using that file as redirected input. The next
    example uses two redirection operations in two separate commands to print a list
    of filenames. This same task was performed in the previous examples using a single
    pipe operation. The pipe operation literally takes the standard output of one
    command and uses it as standard input for another command.


    ```

    $ ls > tempfile

    $ lpr < tempfile

    ```


    Up to this point we have been using a list of filenames as input, it is important
    to note that pipes operate on the standard output of a command, whatever that
    might be. The contents of whole files or even several files can be piped from
    one command to another. In the next example, the cat reads and outputs the contents
    of the mydata file, which are then piped to the lpr command.


