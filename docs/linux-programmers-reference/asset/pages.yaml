  md: '# Appendix C

    TeX and LaTeX


    TeX is a professional-level character file typesetting application for formatting
    text. It reads a standard character file containing text with tags that instruct
    TeX how to format that text. TeX generates a device-independent (dvi) file that
    can be converted to various forms of output such as a PostScript file or an X-Window
    display. There are basic lower-level TeX commands that can be combined by macros
    to perform more complex tasks such as formatting headings and paragraph. You can
    design your own TeX macros for any given document. TeX has been popularly used
    to typeset technical documents that have complex mathematical formulas. It is
    also portable across any Unix or Linux system.


    LaTeX is a set of TeX macros that provide easy-to-use formatting capabilities.
    Instead of detailing a complex set of TeX commands, you can use a corresponding
    LaTeX macro. LaTeX macros allow you to focus on generating the layout of the text.


