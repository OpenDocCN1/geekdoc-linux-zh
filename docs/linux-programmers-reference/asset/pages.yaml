    # make Variables


    You may often need to use a list of filenames in more than one place in a makefile.
    Instead of retyping the list in several dependency lines, you could assign the
    list to a variable and use the variable in its place. In your makefile you can
    define variables and assign values to them. You can evaluate the variables in
    different dependency lines throughout the makefile. To evaluate a make variable,
    you first encase the variable name within parentheses and then precede the parentheses
    with a dollar sign ($). For example, if you assign a list of filenames, the list
    of filenames that it holds will be substituted for the variable name when you
    evaluate the variable.


