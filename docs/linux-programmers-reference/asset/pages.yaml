    the $$ variable holds the name of the target file, in this case the library file.
    If the target library is iolib.a, then the value of $$ would be iolib.a. The %%
    variable holds the name of the library member that is being updated. If the print.o
    member file needs to be updated, then $$ would hold that member name, print.o.
    In the last command, the rm command removes the object-code file. The %% variable
    is a special variable used only with library dependencies. You can use it either
