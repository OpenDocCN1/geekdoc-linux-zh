  md: '# Chapter 4

    Compilers and Libraries:

    gcc, g++, and gdb


    An application is an executable program created by a programmer using one of several
    programming languages. Linux provides several utilities with which a programmer
    can control development of an application. Foremost among these are the gcc utility,
    which invokes the compiler for the C and C++ programming languages, generating
    an executable version of a program. Most Linux applications are written in the
    C or C++ programming languages.


    Application development often makes extensive use of libraries. You can create
    your own libraries or choose from specialized libraries. You can use libraries
    that have been set up for specific operations, such as the X-Window library for
    programming X-Window displays, or the gdb library, which gives you database access
    to files. Libraries have become more flexible than they were and can now be shared
    or loaded dynamically.


    Other utilities allow you to better manage the development of your applications.
    The gdb symbolic debuggers help you locate run-time errors. indent, cproto, and
    ?? help you prepare your source code. autoconf and rpm help you package your software
    for distribution. There are also compilers for all of the major programming languages,
    including Pascal, Lisp, Ada, Fortran, Basic, and Modula-2.


