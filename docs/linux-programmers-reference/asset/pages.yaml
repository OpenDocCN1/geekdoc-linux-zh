    # Pipe |


    You will find yourself in situations in which you need to send data from one command
    to another. In other words, you will want to send the standard output of a command
    to another command, not to a destination file. Suppose you want to send a list
    of filenames to the printer. You need two commands to do this: the ls command
    to generate a list of filenames and the lpr command to send the list to the printer.
    In effect, you need to take the output of the ls command and use it as input for
    the lpr command, and to form such a connection in Linux, you can think of the
    data as flowing from one command to another, and what you use is called a pipe.
    The pipe operator (vertical bar character: |), placed between two commands forms
    a connection between them. The standard output of one command becomes the standard
    input for the other. The pipe operation receives output from the command placed
    before the pipe and sends this data as input to the command placed after the pipe.
    As shown in the next example, you can connect the ls command and the lpr command
    with a pipe. The list of filenames output by the ls command is piped into the
    lpr command.


    ```

    $ ls | lpr

    ```


    You can combine the pipe operation with other shell features, such as special
    characters, to perform specialized operations. The next example prints only files
    with a .c extension. The ls command is used with the asterisk and .c to generate
    a list of filenames with the .c extension. Then this list is piped to the lpr
    command.'
