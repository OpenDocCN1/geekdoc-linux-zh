    editor is invoked on a file containing these history events. With the -e option
    you can specify the editor to be used. If ename = "*", no editor is invoked. If
    the first event is not specified, it will be set to -1 (the most recent event),
    or to -16 if the -l option is used. If the last event is not specified, it will
    be set to the first event, or to -1 if the -l option is used. The -r option reverses
    the order of the commands, and the -n option suppresses command numbers when displaying
    events. With the -d option, timestamps are displayed for each command, and with
    the -f option, full time-date stamps are displayed. With the -E option, the dates
    are displayed as in the format dd.mm.yyyy. With the -D option, fc displays elapsed
    times.


    fc -R reads the history from the specified file, fc -W writes the history out
    to the specified file, and fc -A appends the history to the specified file. fc
    -AI (-WI) appends (writes) only those events that are new since the last incremental
    append (write) to the history file.


