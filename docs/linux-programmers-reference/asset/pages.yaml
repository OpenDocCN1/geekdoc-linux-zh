    # Operators


    The Z-shell has a standard set of arithmetic, relational, and assignment operators,
    as found in most programming environments, and operators for shell functions such
    as redirection and background operations.


    # Definition and Evaluation of Variables: =, $


    A variable is defined in a shell when you first use the variable''s name. A variable
    name may be any set of alphabetic characters, including the underscore. The name
    may also include a number, but the number cannot be the first character in the
    name. A name may not have any other type of character, such as an exclamation
    point, ampersand, or even a space. Such symbols are reserved for a shell for its
    own use. A name may not include more than one word, because a shell uses spaces
    to parse commands, delimiting command names and arguments.


    You assign a value to a variable with the assignment operator. You type the variable
    name, the assignment operator, =, and then the value assigned. Note that you cannot
    place any spaces around the assignment operator. Any set of characters can be
    assigned to a variable. In the next example, the greeting variable is assigned
    the string "Hello".


    ```

    $ greeting="Hello",

    ```


    Once you have assigned a value to a variable, you can then use that value to reference
    the value. Often you use the values of variables as arguments for a command. You
    can reference the value of a variable using the variable name preceded by the
    $ operator. The dollar sign is a special operator that uses a variable name to
    reference a variable''s value, in effect, evaluating the variable. Evaluation
    retrieves a variable''s value—a set of characters. This set of characters then
    replaces the variable name on the command line. Thus, wherever a $ is placed before
    the variable, the variable name is replaced with the value of the variable.'
