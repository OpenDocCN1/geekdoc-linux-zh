    # indent


    The **indent** utility is designed to make C source code more readable for programmers.
    **indent** will indent opening and closing braces, {}. C and control structures
    make extensive use of braces to enclose the code they affect. As far as the compiler
    is concerned, the braces can occur with any number of intervening spaces, tabs,
    or carriage returns. For example, the opening brace for a function can be placed
    on the same line, on the next line, or on the next line and indented several spaces,
    and you can do it differently for each function. This leads to code that can be
    hard to read. With **indent** you can avoid this problem. **indent** will place
    such braces in the same position for each function. It has numerous options for
    specifying how you want the indentation performed.


