    which you made no changes do not need to be recompiled, just linked. You can direct
    the gcc utility to just that, by mixing source code and object code files as arguments
    on the command line. Source code files have a .c extension, and object code files
    have a .o extension. gcc will compile the source code files you specify on the
    command line, and will link the resulting object code files with the .o files
    listed on the command line. This has the advantage of letting you compile only
    those files where changes have been made. If changes were made in main.c, but
    not in io.c you would not have to be recompiled. You would then specify the source
    code file main.c and the object code file io.o on the command line. In the next
