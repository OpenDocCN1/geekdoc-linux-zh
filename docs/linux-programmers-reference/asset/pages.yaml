  md: '# The make Utility 227


    The library suffix rule has three Linux commands. The first compiles the source-code
    file, creating an object-code file. In the gcc command, the $< variable references
    the current .c file that needs to be updated. For example, if the print.c file
    had been changed, then the value of $$ would print.c. The second command is an
