    # Creating and Using Libraries: Static, Shared, and Dynamic


    There are usually functions in a C program that rarely need to be compiled. There
    may also be functions that you want to use in different programs. Often such functions
    perform standardized tasks, such as database input/output operations or screen
    manipulation. You may precompile such functions and place them together in a special
    type of object code file called a library. The functions in such a library can
    be combined with a program by the linker. They save you the trouble of having
    to recompile them for each program you develop.


    Different types of applications make use of specialized libraries that are placed
    in system directories and made available for use in developing programs. For example,
    there is a library, libdbm, that contains db functions for implementing database
    access to files. You can use these functions in your own programs by linking to
    that library, libm, and X-Window applications. Mathematical applications would
    use the math library, libm, and libX11 library. These libraries are placed within
    system directories such as /usr/lib, where they can be accessed by anyone on the
    system. You can also create your own library for use with your own particular
    program, or make one that you want accessed by others.


    Libraries can be either static, shared, or dynamic. A static library is one whose
    code is incorporated into the program when it is compiled. A shared library, however,
    has its code loaded for'
