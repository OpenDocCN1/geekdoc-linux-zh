    \nci\nci -options filename\n\nThe ci command takes one argument, the name of the\
    \ original file. The RCS file will be created in the RCS directory with the extension\
    \ .v. A main.c file will have an RCS file called main.c,v in the RCS directory.\n\
    \nYou can use the -r option to specify the release and version number you want\
    \ to begin with when creating a new version, as shown here:\n\n```\n$ ci -r5.2\
    \ main.c\n```\n\nIf your program is initially made up of several source-code files,\
    \ you need to create an RCS file for each one, including its source code suffix.\
    \ In the next example, the user creates an RCS file for the main.c program.\n\n\
    ```\n$ ci main.c\nRCS/main.c,v <- main.c\nenter description, terminated with single\
    \ '.' or or of file:\nNOTE: This is NOT the log message!\n>> bookrec main program\n\
    >>\ninitial revision: 1.1\ndone\n```\n\n Ordinarily, a project is worked on by\
    \ several different programmers at once. Each would have access to, and make changes\
    \ to, the source code.\n\nrcs\nrcs -options filename\n\nYou can use the rcs command\
    \ with the -a option to restrict access to an RCS file. Attached to the -a option,\
