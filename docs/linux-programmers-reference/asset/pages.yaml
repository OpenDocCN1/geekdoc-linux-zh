  md: "# The BASH Shell Initialization File: .bashrc\n\n**bashrc** file is an initialization\
    \ file that is executed each time you enter the BASH shell or generate any subshells.\
    \ If the BASH shell is your login shell, **bashrc** is executed along with your\
    \ **bash_login** file when you log in. If you enter the BASH shell from another\
    \ shell, the **bashrc** file is automatically executed, and the variable and alias\
    \ definitions it contains will be defined.\n\nThe **bashrc** shell initialization\
    \ file is actually executed each time you generate a shell, such as when you run\
    \ a shell script. In other words, each time a shell is created, the **bashrc**\
    \ file is executed. This has the effect of exporting any local variables or aliases\
    \ that you have defined in the **bashrc** shell initialization file. The **bashrc**\
    \ file usually contains the definition of aliases and any feature variables used\
    \ to turn on shell features. Aliases and feature variables are locally defined\
    \ within the shell. But the **bashrc** file will define them in every shell. For\
    \ this reason, the **bashrc** usually holds such aliases as those defined for\
    \ the **rm**, **cp**, and **mv** commands. The next example is a **bashrc** file\
    \ with many of the standard definitions.\n\n# .bashrc\n\n```\n# Source global\
    \ definitions\nif [ -f /etc/bashrc ]; then\n    /etc/bashrc\nfi\nset -o ignoreerreof\n\
    set -o noclobber\n\nalias rm 'rm -i'\nalias mv 'mv -i'\nalias cp 'cp -I'\n```\n\
    \nLinux systems usually contain a system **bashrc** file that is executed for\
    \ all users. This may contain global aliases and features needed by all users\
    \ whenever they enter a BASH shell. This is located in the **/etc** directory,\
