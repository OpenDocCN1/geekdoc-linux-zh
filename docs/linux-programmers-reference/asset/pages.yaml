  md: "# BASH Commands 39\n\n# getopts\n\ngetopts is used for detecting options to\
    \ be used for a shell script. The optstring argument specifies a list of characters\
    \ that can be used as valid options for the shell script. If the character is\
    \ followed by a colon, the option is expected to have an argument, separated from\
    \ it by a space. Each time it is executed, getopts places the next option in the\
    \ shell variable name and the index of the next argument to be processed into\
    \ the variable OPTIND. If an option requires an argument, getopts places that\
    \ argument into the variable OPTARG. The shell does not reset OPTIND automatically;\
    \ it must be manually reset between multiple calls to getopts within the same\
    \ shell invocation, if a new set of parameters is to be used. getopts can report\
    \ errors in two ways. If the first character of optstring is a colon, silent error\
    \ reporting is used. In normal operation, diagnostic messages are printed when\
    \ illegal options or missing option arguments are encountered. If the variable\
    \ OPTER is set to 0, no error message will be displayed, if the first character\
    \ of optstring is not a colon.\n\ngetopts normally parses the positional parameters;\
    \ but more arguments are given in arguments, getopts parses those instead. getopts\
    \ returns true if an option, specified or unspecified, is found, or false if the\
    \ end of options is encountered or an error occurs.\n\ngetopts is often used in\
    \ a loop to check for options a user may have entered when invoking three possible\
    \ options to a script: t, r, and s. r with its colon (:) following it, it is expected\
    \ to take an argument. In this example, if the user enters the -a option, the\
    \ ls command with the argument `ls -al` displays all files in a long format. However,\
    \ if the -r option is entered with a filename, then the filename argument is accessed\
    \ from the OPTARG variable and the long format of just that file is displayed.\n\
    \n```\nwhile getopts tr:s myoption\n  do\n    case $myoption in\n      a) ls -al\n\
    \      r) ls -1 $OPTARG\n      s) ls -s\n    esac\n  done\n```"
