  md: '# 190 Copying the Run of a Program: The script Command


    a shell in which everything that appears in the standard input and output is copied
    to a file. Since both standard input and output are copied, script can be used
    to keep a record of an interactive run of a program. Everything typed in, as well
    as output to the screen, will be recorded in a file.


    script takes as its argument the name of the file to which the copy of the session
    is to be written. If no argument is given, then a file with the default name of
    typescript is created. The file will be created and opened, recording all input
    and output. The file will remain open until the script shell is ended with the
    end-of-file character, CTRL-D, entered on the command line. Once the CTRL-D is
    entered, the script file is closed and the script shell is ended. The script file
    will then contain a copy of the run of your program. This file can be printed
    with lp, like any other file. script will record the date and time in the file.


    In the next example, the user runs the bookrec program within a script shell.
    All input and output is saved in the runbook. After the run of the program, the
    user ends the script shell with a CTRL-D. You can then examine the run of your
    program by displaying or printing your script file, in this example, runbook.


    ```

    $ script runbook

    $ bookrec

    Please enter a book record : Raven 2.50

    The book record is : Raven 2.50

    $ ^D

    Script done, file is runbook

    ```


    Be sure to end the script shell before you examine your script file. If you don''t,
    you use the cat command to display the script file, not only will characters be
    output to the screen, but they will also be recorded as more added input for the
    script file. Furthermore, you will not be able to log out while the script shell
    is active. If you have been using the script command and find yourself unable
    to log out, then a script shell is still active and must be ended with a CTRL-D.


    It is also possible to nest script shells. Executing a second script command before
    ending the first one simply records all input and output in the second script
    shell to the first script shell. When the first script shell is finally ended,
    its file will contain everything in the first script shell, as well as everything
    in the second script shell.'
