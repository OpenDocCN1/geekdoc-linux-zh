    # ## Dependency Lines


    A dependency line specifies a dependency relationship between files. make operates
    in terms of dependencies. A source-code file is used to create an object-code
    file, which in turn is used to create a runnable program. The program can be said
    to be dependent on the object-code file, which in turn is dependent on the source-code
    file. You need to specify the dependency relationship between a source-code file
    and an object-code file in a dependency line. In another dependency line you need
    to specify the dependency relationship between an executable file and all its
    object-code files.


    A dependency line can be thought of as a kind of conditional statement. If an
    object-code file depends on a source-code file and the source-code file has been
    recently modified, then the test condition is true and the file is then recompiled.
    However, the syntax for a dependency line is a bit more complex than a standard
    conditional statement. A dependency line consists of three components: a target
    file, a list of dependency files, and a Linux command. If any of the dependency
    files have been modified more recently than the target file, then the Linux command
    is executed. The target file and the dependent files are written on the same line,
    separated by a colon. You can either place the Linux command on the same line,
    separated from the dependent files by a semicolon, or you can place the Linux
    command on the next line, preceded by a tab. You can list more than one Linux
    command if you wish. When entered on the same line, you separate each Linux command
    with semicolons. On separate lines, each Linux command has to be preceded by a
    tab. The dependency line ends with a following empty line. In these examples,
    the Linux command is an invocation of the cc compiler, compiling a source-code
    file or linking object-code files. The syntax for a dependency line is as follows:


    ```

    target file : dependent files ; Linux command

    empty line

    ```


    ```

    target file : dependent files

    tab Linux command

    empty line

    ```'
