    # Programming Tools


    There are several tools available that help you prepare and organize your source
    code. **f2c** and **p2c** can translate Fortran and Pascal programs into C programs.
    **cproto** generates a list of function declarations for all your defined functions,
    for use in header files. The **indent** utility will indent the braces used for
    blocks in a consistent format, making the code easy to read. **xwpe** is an X-Window
    programming environment similar to Turbo C.


    # Conversion Utilities for C: f2c and p2c


    **f2c** and **p2c** perform source-code conversion from Fortran and Pascal into
    C. Both generate a C source-code file with the extension .c. The original name
    is retained. They also have options for handling the conversion of complex programs.
    The following example will convert the Pascal program **mytitle.pas** to a C source-code
    file named **mytitle.c**.


    ```

    $ p2c mytitle.pas

    ```


