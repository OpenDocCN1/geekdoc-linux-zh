    of the OBJECTS variable in both places with $(OBJECTS). Also in the makefile,
    the CFILES variable is defined and assigned the list of all C source-code files.
    This variable is then used in the print dependency line to provide the lp command
    with a list of all C source-code files. Notice that make variables operate somewhat
    like shell variables. You use the assignment operator to assign a string to a
    variable. Then the dollar sign is used to evaluate the variable. However, unlike
    shell variables, when evaluating a variable you must place the variable name within
    parentheses.'
