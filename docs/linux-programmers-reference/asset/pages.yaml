  md: '# Control Structures


    # Control Structures


    You can control the execution of Linux commands in a shell program with control
    structures. Control structures allow you to repeat commands and select certain
    commands over others. A control structure consists of two major components: a
    test and commands. If the test is successful, then the commands are executed.
    In this way, you can use control structures to make decisions as whether commands
    should be executed.


    There are two different kinds of control structures: loops and conditions. A loop
    repeats commands, whereas a command executes a command when certain conditions
    are met. The BASH shell has three loop control structures: while, for, and for-in.
    There are two condition structures: if and case.


    The if and while control structures are useful for general purposes, such as performing
    iterations and making decisions using a variety of different tests. The case and
    for control structures are more specialized. The case structure is a restricted
    form of the if condition and is often used to implement menus. The for structure
    is a limited type of loop. It runs through a list of values, assigning a new value
    to a variable with iteration.


    The if and while control structures have as their test the execution of a Linux
    command. All Linux commands return an exit status after they have finished executing.
    If a command is successful, its exit status will be 0. If the command fails for
    any reason, its exit status is a positive value referencing the type of failure
    that occurred. The if and while control structures check to see if the exit status
    of a Linux command is 0 or some other value. In the case of the if and while structures,
    if the exit status is a zero value, then the command was successful and the structure
    continues.


    # Control Structures:

    AND, OR, &&


    # Function


    The logical AND condition returns a true 0 value if both commands return a true
    0 value; if one returns a nonzero value, then the AND condition is false and also
    returns a nonzero value.


    ```

    command &&& command

    ```'
