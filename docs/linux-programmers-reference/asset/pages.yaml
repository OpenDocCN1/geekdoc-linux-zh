  md: 'words, each time a subshell is created, the .tcshrc file is executed. This
    allows you to define local variables in the .tcshrc initialization file and have
    them, in a sense, exported to any subshells. Even though user-defined variables
    as history are local, they will be defined for each subshell generated. In this
    way, history is set for each subshell. However, each subshell has its own local
    history variable. You could even change the local history variable in one subshell
    without affecting any of those in other subshells. Defining special variables
    in the shell initialization file allows you to treat them like BASH shell exported
    variables. An exported variable in a BASH or ZSH shell only passes a copy of itself
    to any subshell. Changing the copy does not affect the original definition.


    The .tcshrc file also contains the definition of aliases and feature variables
    used to turn on shell features. Aliases and feature variables are locally defined
    within the shell. But the .tcshrc file will define them in every shell. For this
    reason, .tcshrc usually holds aliases as those for the rm, cp, and mv commands.
    The next example is a .tcshrc file with many of the standard definitions.


