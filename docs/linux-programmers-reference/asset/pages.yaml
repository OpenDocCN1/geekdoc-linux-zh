    There are several other options that execute different stages in the packaging
    process, without generating an rpm package. These build commands have the following
    format:


    ```

    rpm -bx [build-options] spec-file

    ```


    The-bp option executes the prep stage, unpacking source files held in an archive
    and then applying update patches to it. The -bc option executes both the prep
    stage and the build stage, unpacking files to the BUILD directory and compiling
    the source-code files into an executable program. The -bi option executes the
    prep, build, and install stages. It unpacks, compiles, and installs the software
    files on your system. It does not, however, create the rpm package. These options
    are designed to let you perform different tasks in the process, depending on what
    stage you be working at. If you just want to unpack the archive and make modifications
    to the software, you can use the -bp option. The -bl option checks to see if all
    the files used for the software are present.'
