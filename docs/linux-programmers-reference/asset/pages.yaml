  md: '# Chapter 5

    Development Tools


    An application is an executable program created by a programmer using one of several
    programming languages. Linux provides several utilities with which a programmer
    can control development of an application. Foremost among these are the make utility.
    The make utility interfaces with the Linux operating system to provide an easy
    way to maintain and compile programs. The r allows you to better control program
    changes. It organizes changes into different versions that can be stored and later
    accessed. You can even use the man utility to create your own online documentation
    for your applications. All of these utilities are complex and powerful tools.


    # The make Utility


    You will often be working with a program that has many source-code files. As you
    develop the program and make modifications, you will need to compile the program
    over and over again. However, you need only compile those source-code files in
    which you made changes. The linker links the newly generated object-code files
    with previously compiled object-code files creating a new executable file. The
    fact that only a few of your source files are actually compiled each time drastically
    cuts down the work of the compiler. Each time you need a new executable program,
    you do not need to recompile each source-code file.


    It can be very difficult in large programs, with many source-code files, to keep
    track of which files have been changed and need to be compiled and which files
    need only to be linked. The make utility will do this for you. make was designed
    for a development environment in which different source-code files in a program
    are constantly modified. make keeps track of which source files have been changed
    and which have not. It recompiles those that have been changed, linking them with
    the rest of the object-code files to create a new executable file. In the next
    example, the user enters the command make on the command'
