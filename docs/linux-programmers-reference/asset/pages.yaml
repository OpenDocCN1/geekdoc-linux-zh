- img_proc: true
  md: '# 104 TCSH Configuration


    symbol or string that you want. To have your command line display a different
    symbol as a prompt, you simply use the set command to assign symbol to the prompt
    variable. In the next example, the user assigns a + sign to the prompt variable,
    making it the new prompt.


    ```

    > set prompt = "*+"

    ```


    You can use a predefined set of codes to make configuring your prompt easier.
    With them, you can make the time, your user name, or your directory path name
    part of your prompt. You can even have your prompt display the history event number
    of the current command you are about to enter. Each code is preceded by a % symbol.
    For example, %/ represents the current working directory; %t, the time; and %n,
    your user name. % will display the next history event number. In the next example,
    the user adds the current working directory to the prompt.


    ```

    > set prompt = "%/% >\n/home/dylan

    ```


    The next example incorporates both the time and the history event number with
    a new prompt.


    ```

    > set prompt = "%t %! %$"

    ```


    Here is a list of the codes:


    | Code | Description |

    | %% | Current working directory |

    | %h, %!, ! | Current history number |

    | %t | Time of day |

    | %n | User name |

    | %d | Day of the week |

    | %w | Current month |

    | %y | Current year |


    The prompt2 variable is used in special cases when a command may take several
    lines to input. prompt2 is displayed for the added lines needed for entering the
    command. prompt3 is the prompt used if the spell check feature is activated.'
