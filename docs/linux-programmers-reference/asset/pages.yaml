  md: '# 162  The C Compiler: gcc


    as its argument. This filename will be the name of the executable file instead
    of the default, a.out.


    gcc takes as possible arguments the source code, object code, and assembly code
    files, as well as several options. gcc recognizes a file by its extension.


    | Extension | Description |

    | --- | --- |

    | .c | source code files |

    | .o | Object code files |

    | .s | Assembly code files |

    | .C | C++ files |

    | .cpp | C++ files |


    In the next example


    ```

    $ gcc greet.c -o greet

    $ greet

    Hello, how are you

    ```


    The gcc utility has many options that can stop the compiling process at any component.
    These are -P for the preprocessor, -S for the assembler, and -c for the compiler.
    The -P option generates a copy of the source code after the preprocessor has worked
    on it. This preprocessor version of the source file is saved in a file with the
    .P extension. For example, the preprocessor version of the greet.c file would
    be saved in a file called greet.P. The -S option generates an assembly code version
    of the program. The assembly code version is saved in a file with the .s extension.
    The assembly code version of the greet.c file would be saved in a file called
    greet.s. The -c option generates only an object code file, not an executable with
    the .o extension. The object code version of the greet.c would be saved in a file
    called greet.o. In the next example, the user generates an assembly code version
    and then an object code version of the program.


    ```

    $ gcc -S greet.c

    $ gcc -c greet.c

    $ ls

    greet.c greet.o

    ```'
