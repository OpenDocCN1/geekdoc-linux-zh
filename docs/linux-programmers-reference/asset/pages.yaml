  md: '# TCSH Commands


    A listing of the TCSH commands follows, arranged alphabetically. In most cases,
    the description for each command begins with its syntax.


    # Numeric Variables: @


    In the TCSH shell, you can declare numeric variables using the @ command instead
    of the set command. You can then perform arithmetic, relational, and bitwise operations
    on such variables. In this respect, the TCSH shell is similar to programming languages.
    Numeric and string variables are two different types of objects, managed in very
    different ways. You cannot use the set command on a numeric variable. The @ command
    consists of the keyword @, the variable name, an assignment operator, and an expression.
    The next example declares the numeric variable num and assigns the value 10 to
    it.


    ```

    > @ num = 10

    ```


    Many different assignment operators are available for you to use, such as increments
    and arithmetic assignment operators. They are the same as those used in the Unix
    programming utility awk and in the C programming language. The expression can
    be any arithmetic, relational, or bitwise expression, and you can create complex
    expressions using parentheses. The operands in an expression should be separated
    from the operator by spaces; for example, 10*5 is not a valid expression and should
    be written with spaces, 10 * 5. You can also use a numeric variable as an operand
    in an expression. In the next example, the variable count is declared as numeric
    and used in an arithmetic expression. Notice that count is evaluated with a $
    operator so that the value of count, 3, is used in the expression. The "Operators"
    section, earlier in this chapter, provides a list of numeric operators.


    ```

    > @ count = 3

    > @ num = 2 * ($count + 10)

    > echo $num

    ```'
