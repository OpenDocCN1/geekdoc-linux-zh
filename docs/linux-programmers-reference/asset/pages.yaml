    # test


    ```

    test value -option value

    test string-string

    ```


    Often you may need to perform a test that compares two values. There is a Linux
    command called test that can perform such a comparison of values. The test command
    will compare two values and return as its status 0 if the comparison is successful.


    With the test command, you can compare integers or strings, and even perform logical
    operations. The command consists of the keyword test followed by the values being
    compared, separated by an option that specifies what kind of comparison is taking
    place. The option can be thought of as the operator, but like other options, with
    a minus sign and letter codes. For example, -eq is the option that represents
    the equality comparison. However, there are two string operations that actually
    use an operator instead of an option. When you compare two strings for equality
    you use the equal (=) sign. For inequality you use !=.


    In the next example, the user compares two integers to see if they are equal.
    In this case, you need to use the equality option, -eq. The exit status of the
    test command is examined to find out the result of the test operation. The shell
    special variable $ holds the exit status of the most recently executed Linux command.


    ```

    $ num=5

    $ test $num -eq 10

    $ echo $?

    ```


    Instead of using the keyword test for the test command, you can use enclosing
    brackets. The command $greeting="hi" can be written as


    ```

    $ [ $greeting="hi" ]

    ```


    Similarly, the test command test $num -eq 10 can be written as


    ```

    $ [ $num -eq 10 ]

    ```'
