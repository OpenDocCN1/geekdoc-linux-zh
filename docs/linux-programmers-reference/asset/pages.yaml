  md: '# INTRODUCTION


    This book is designed to be a programmer''s reference on Linux. It covers the
    commands, syntax, and operators for three major shells used in Linux: the Bourne
    Again shell (BASH), the TCSH shell, and the Z shell. All are enhanced versions
    of their corresponding Unix shells. The BASH shell is an advanced version of the
    Bourne shell, which includes most of the advanced features developed for the Unix
    Korn shell and C shells. TCSH is an enhanced version of the C shell that was originally
    developed for BSD versions of Unix. The Z shell is an enhanced version of the
    Unix Korn shell.


    In addition, the book covers programming tools including compilers, libraries,
    debuggers, and project managers. The GNU C compiler used extensively on Linux
    is discussed, along with the different types of libraries available: static, dynamic,
    and shared. The gdb debugger and make utilities are presented in detail, as well
    as the Revision Control System (RCS) for managing complex programming projects.


    The book also examines software distribution tools. autoconf and configure can
    automatically compile source code on any Linux system. The Redhat Package Manager
    (rpm) automatically installs software packages, placing all appropriate libraries
    and configuration files in their proper directories. Even the man macros for developing
    online manuals are examined.


    Three appendixes at the end of the book contain listings of Perl, Tcl/Tk, and
    TeX/LaTeX commands. Though these are cross-platform programming languages and
    tools, they are used extensively on Linux systems to create customized Linux applications.'
  merge: -1
  pgno: 16
