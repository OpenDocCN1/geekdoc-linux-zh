  md: '# Shell Scripts: Commands and Comments 3


    You may be able to execute a script that is written for one of the Linux shells
    while you are working in another. Suppose you are currently in the TCSH shell
    and want to execute a script you wrote in the BASH shell that contains BASH shell
    commands. First, you would have to change to the BASH shell with the sh command,
    execute the script, and then change back to the TCSH shell. You can, however,
    automate this process by placing the first characters in your script, #!, followed
    by the path name for the shell program on your system.


    Your shell always examines the first character of a script to find out what type
    of script it is—a BASH, ZSH, or TCSH shell script. If the first character is space,
    the script is assumed to be either a BASH or ZSH shell script. If there is a #
    alone, the script is a TCSH shell script. If the # is followed by a #! character,
    your shell reads the path name of a shell program that follows. A #! should always
    be followed by the path name of a shell program identifying the type of the script
    works in. If you are currently in a different shell, that shell will read the
    path name of the shell program, change to that shell, and execute your script.
    If you are in a different shell, the space or # alone is not enough to identify
    a BASH or TCSH shell script. Such identifications work only in their own shells.
    To identify a script from a different shell, you need to include the # characters
    followed by a path name.


    For example, if you put #!/bin/sh at the beginning of the first line of the hello
    script, you could execute it directly from the TCSH shell. The script will first
    change to the BASH shell, execute its commands, and then return to the TCSH shell
    (or whatever type of shell it was executed from). In the next example, the hello
    script includes the #!/bin/sh command. The user then executes the script while
    in the TCSH shell.


    # hello


    ```

    #!/bin/sh

    # The hello script says hello

    echo "Hello, how are you"

    ```


