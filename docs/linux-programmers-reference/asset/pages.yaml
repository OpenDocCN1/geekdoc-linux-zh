    printed. The echo command itself is preceded by an @ operator, which suppresses
    display of the actual echo command. make will display each command that it executes,
    unless instructed not to with the @ operator.


    The list of filenames assigned to a variable is really just a string. Just as
    you can assign filenames to a variable, you can also assign compiler options.
    The options are really just strings as far as the variable is concerned. Options
    are represented with a hyphen followed by a letter code and sometimes an argument.
    In the following example, the variable LINKFLAGS holds the option -o followed
    by a filename. This option allows the user to specify another name for the executable
    file, in this case bookrec.


    # makefile


    ```

    CFILES = main.c io.c

    OBJECTS = main.o io.o

    LINKFLAGS = -g -o bookrec

    PRINTNOTICE = Printing out the source-code files

    ```


    ```

    bookrec : $(OBJECTS)

    cc $(LINKFLAGS) $(OBJECTS)

    ```


    ```

    print :

    @echo $(PRINTNOTICE)

    lp $(CFILES) &

    ```


    ```

    $ make print

    Printing out the source-code files

    lp main.c io.c &

    ```


