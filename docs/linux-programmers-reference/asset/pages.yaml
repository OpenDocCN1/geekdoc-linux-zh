    option used for regular shared libraries. The -fPIC option generates position-independent
    code suitable for dynamically loaded libraries. The following example creates
    libmyio.so prepared for dynamic loading.


    ```

    $ gcc -fPIC -c io.c

    $ gcc -shared -Wl,-soname,libmyio.so.1

    -o libmyio.so.1.0 io.o

