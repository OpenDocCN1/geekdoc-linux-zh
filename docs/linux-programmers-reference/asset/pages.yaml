    # # Packaging Your Software:

    autautoconf and rpm


    Once you have finished developing your software, you may want to distribute it
    to others. Ordinarily you would pack your program into a tar archive file. People
    would then download the file and unpack it. You would have to included detailed
    instructions on how to install it and where to place any supporting documentation
    and libraries. If you were distributing the source code, users would have to figure
    out how to adapt the source code to their systems. There are any number of variations
    that may stop compilation of a program.


    The Redhat Package Manager (rpm) and autoconf are designed to automate these tasks.
    autoconf is used to automatically configure source code to a given system. rpm
    will automatically install software on a system in the designated directories,
    along with any documentation, libraries, or support programs. Both have complex
    and powerful capabilities and are able to handle the most complex programs. Simple
    examples of their use are provided here.


    # # autoconf


    A Unix system can compile any software written in the C programming language.
    However, different Unix systems have different configurations, some using different
    compilers or placing programs and libraries in different system directories. Different
    types of support libraries may be present. In the past, in order to compile software
    on different systems, the software had to be manually configured for each system.
    For example, if your system has the gcc compiler instead of the cc compiler, you
    would have to set that feature in the software''s makefile.


    The autoconf program is designed to automate the configuration process. It automatically
    detects the configuration of the current Unix system and generates an appropriate
    makefile that can then be used to compile software on this particular system.
    Much of the current software on the Internet in source form uses autoconf. A detailed
    manual on autoconf can be found in the /usr/info directory and is called autoconf.info.
