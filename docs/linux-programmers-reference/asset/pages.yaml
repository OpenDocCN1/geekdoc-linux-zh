  md: "# The Revision Control System: RCS 241\n\n```\n$ make\nco -rl1.2 main.c\ngcc\
    \ -O -c main.c\nrm -f main.c\ngcc main.o io.o -o bookrec\n```\n\n# RCS Suffix\
    \ Rules for Header Files\n\nmake also has a standard suffix for header files,\
    \ files with a .h suffix. You can maintain your header files in an RCS file that\
    \ has a .h suffix, for example types.h,v make will always extract the header file\
    \ before it compiles the source-code files that depend on that header file. In\
    \ the next example, main.o depends on types.h. The types.h file is extracted from\
    \ the types.h,v RCS file before main.o is created.\n\n# makefile\n\n```\nbookrec\
    \ : main.o io.o\n\tcc main.o io.o -o bookrec\n\tmain.o: types.h\n```\n\n```\n\
    $ make\nco types.h,v\nco main.c\ngcc -O -c main.c\nrm -f main.c\ngcc main.o io.o\
    \ -o bookrec\n```\n\nNotice that the header file was not removed after it had\
    \ been extracted and used. The reason for this is that several files may depend\
    \ on types.h. Suppose both main.o and io.o depended on types.h as specified in\
    \ a dependency line: types.h. You should need to update main.o, then the RCS suffix\
    \ rule for header files has created a file, types.h, that is also more recent\
    \ than io.o. It is as if you only changed main.c, but also changed types.h. Since\
    \ io.o also depends on types.h, it will also be recompiled - an unnecessary compilation\
    \ since you never changed io.c. The current solution is to simply leave the most\
    \ recently extracted types.h file in your directory. If you need to update types.h\
    \ using the RCS file types.h,v, you can first remove the types.h file."
