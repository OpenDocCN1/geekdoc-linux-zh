    each. An object-file (.o) is dependent on a source-code (.c) file. An a.out is
    dependent on several object-code files (.o). In the following example, a.out is
    dependent on (made up of) the two object-code files main.o and io.o. Each object-code
    file is, in turn, dependent on their respective source-code files; main.o on main.c,
    and io.o on io.c.


