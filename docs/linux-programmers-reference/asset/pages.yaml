  md: '# TCSH Configuration 101


    # TCSH Configuration


    The TCSH shell lets you configure your own shell using shell configuration variables
    and features. You can set features on and off with the set command. The TCSH shell
    also has configuration files for login, logout, and whenever you enter a TCSH
    shell.


    # TCSH Shell Features


    The TCSH shell has several features that allow you to control how different shell
    operations work. The TCSH shell''s features include those in the PDKSH shell as
    well as many of its own. For example, the TCSH shell has a **noclobber** option
    to prevent redirection from overwriting files. Some of the most commonly used
    features are **echo**, **noclobber**, **ignoreof**, and **noglob**. The TCSH shell
    features are turned on and off by defining and undefined a variable associated
    with that feature. A variable is named for each feature; for example, the **noclobber**
    feature is turned on by defining the **set** command to define a variable and
    the **unset** command to undefine a variable. To turn on the **noclobber** feature,
    you issue the command **set noclobber**. To turn it off, you use the command **unset
    noclobber**.


    set feature-variable\unset feature-variable


    These variables are also sometimes referred to as **toggles** since they are used
    to turn features on and off.


    # echo


    Setting **echo** enables a feature that displays a command before it is executed.
    The command **set echo** turns the echo feature on, and the command **unset echo**
    turns it off.


    # ignoreeof


    Setting **ignoreeof** enables a feature that prevents users from logging out of
    the user shell with a CTRL-D. It is designed to prevent accidental logouts. With
    this feature turned off, you can log out by pressing CTRL-D. However, CTRL-D is
    also used to end user input entered directly into the standard input. It is used
    often for the **mail** program or for utilities such as **cat**. You could easily'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# 102 TCSH Configuration


    enter an extra CTRL-D in such circumstances and accidentally log yourself out.
    The ignoreofof feature prevents such accidental logouts. When it is set, you have
    to explicitly log out, using the logout command:


    +   - set ignoreofof

    - ^D


    Use logout to logout


    # noclobber


    Setting noclobber enables a feature that safeguards existing files from redirected
    output. With the noclobber feature, if you redirect output to a file that already
    exists, the file will not be overwritten with the standard output; the original
    file will be preserved. There may be situations in which you use a name that you
    have already given to an existing file as the name for the file to redirected
    output. The noclobber feature prevents you from accidentally overwriting your
    original file:


    +   - set noclobber

    - cat preface > myfile


    myfile: file exists

    \There may be times when you want to overwrite a file with redirected output.
    In this case, you can place an exclamation point after the redirection operator.
    This will override the noclobber feature, replacing the contents of the file with
    the standard output:


    +   - cat preface >! myfile


    # nogglob


    Setting nolob enables a feature that disables special characters in the user shell.
    The characters *, ?, [, ], and ~ will no longer expand to matched filenames. This
    feature is helpful, for some reason, you have special characters as part of a
    filename. In the next example, the user needs to reference a file that ends with
    the ? character: answers?. First, the user turns off special characters, using
    the noglob option. Now the question mark on the command line is taken as part
    of the filename, not as a special character, and the user can reference the answers?
    file.


    +   - set noglob

    - ls answers?

    nanswers?'
