    # make Special Targets


    In addition to the special variables, **make** has a set of special targets used
    to provide different features. A special target is preceded by a period and entered
    in uppercase. For example, the special target **SILENT** will suppress the usual
    display of Linux commands as **IGNORE** will allow your makefile to continue execution
    in dependency lines even if a Linux command fails. By default, **make** will stop
    if it executes a Linux command that returns an error code. The **IGNORE** special
    target ignores all error codes.


    The **PRECIOUS** special target specifies those targets that you do not want removed
    should **make** be interrupted. In some cases you need to retain the target file
    in order to preserve its time stamp. For example, the time stamp of the print
    target file is used to print out those files that have recently been changed.
    If, for some reason, the **lp** command in the print dependency line is interrupted
    during its execution, **make** will by default remove the target, the print file.
    However, you can override this default action by listing **print** with the **PRECIOUS**
    special target. The print file will not be removed.'
