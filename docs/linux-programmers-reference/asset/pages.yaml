  md: '# Chapter 2

    TCSH Shell from other shells in that its control


    The TCSH shell differs from other shells in that its control structures conform
    more to a programming language format. For example, the test condition for a TCSH
    shell''s control structure is an expression, not a Linux command, that evaluates
    to true or false. A TCSH shell uses the same operators as those found in the C
    programming language. You can perform a variety of assignment, arithmetic, relational,
    and bitwise operations. The TCSH shell also allows you to declare numeric variables
    that can easily be used in such operations.


    ![](img/3db93a7d263e3b589612548bc59abfdb_88_0.png)


    You can define variables in a shell and assign values to them, as well as reference
    script arguments. You can also define environment variables that operate much
    like BASH shell exported variables. However, the TCSH shell differs in the way
    it defines variables and the type of variables you can define. The TCSH shell
    defines its variables using the TCSH commands set, @, and setenv. The TCSH shell
    also allows you to define numeric variables and arrays. The @ command defines
    a numeric variable on which you perform arithmetic operations. Parentheses and
    brackets allow you to define and reference arrays.


    Scripts also operate in the same way, but with several crucial differences. A
    TCSH shell must begin with a sharp (or pound) sign (#) in the first column of
    the first line. Also, though prompts can be output using the echo command, there
    is no read command to handle input. Instead, you need to redirect the standard
    input to a variable.'
