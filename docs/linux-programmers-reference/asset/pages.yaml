    # Specifying Dependency Lines Using Target Arguments


    Suppose that you want to use make to execute a specific Linux command for you.
    For example, suppose you would like to use make to execute the Linux command to
    print out all your source-code files. Instead of entering the names of all the
    files on the command line each time you want to print them out, you can have make
    do it for you. Remember that the Linux command in a dependency line can be any
    Linux command, not just a gcc compiler command. You could enter a dependency line
    whose Linux command is an lpr command to print files.


    You would then be using your makefile for two very different purposes: to compile
    a program and to print files. You will have dependency lines that compile your
    program, as well as another dependency line to print your files. However, whereas
    the dependency lines for compiling are all interdependent, the one for printing
    will be independent of any other dependency lines. You do not want to print each
    time you compile and vice versa. You could have a dependency line whose target
    is not listed as a dependent file in any other dependency line. Such a dependency
    line would be disconnected from all others. The target itself does not have to
    be an actual file. It can be what is known as a zero-length file—one that make
    creates for its own purposes. In the next example, the user creates such a dependency
    line whose target is the word print. print is a zero-length file created by make.
    It is not one that you have created.


    makefile


    ```

    bookrec : main.o io.o

    gcc main.o io.o -o bookrec

    ```


    main.o:types.h


    ```

    print :

    lpr main.c io.c &

    ```'
