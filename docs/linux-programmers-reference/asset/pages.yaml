    # Dynamically Linked Libraries


    You can dynamically load shared libraries. This means that they are not loaded
    and referenced by the program until the program is running and specifically loads
    the library. With dynamically loaded libraries, a program could load one library,
    use its functions, unload it, and then load another library. This can drastically
    cut down on memory needed by a program. It may also mean that updating a library
    would not require that the program be recompiled. The program is never compiled
    with the library, it only loads it in run time.


    A dynamically loaded library should be a shared ELF library compiled with the
    -fPIC option. This is different from the -fpic'
