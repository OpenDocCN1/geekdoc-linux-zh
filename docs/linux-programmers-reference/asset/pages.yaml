  md: '# Test Expressions: ()


    The if and while control structures use an expression as their test. A true test
    is any expression that results in a nonzero value. A false test is any expression
    that results in a 0 value. In the TCSH shell, relational and equality expressions
    can be easily used as test expressions, because they result in 1 if true and 0
    false. There are many possible operators that you can use in an expression. The
    test expression can also be arithmetic or a string comparison, but strings can
    only be compared for equality or inequality.


    Unlike the BASH shell, you must enclose the TCSH shell if and while expressions
    within parentheses. The next example shows a simple test expression to test if
    two strings are equal.


    ```

    if ($greeting == "hi") then

    echo Informal Greet

    ```


    The TCSH shell has a separate set of operators for testing strings against other
    strings or against regular expressions. The == and != operators test for the equality
    and inequality of strings. The == and ! operators test a string against a glob
    pattern used for filename substitution to see if a match is successful or not.
    The regular expression can contain any of the shell''s special characters. In
    the next example, any value of greeting that begins with an uppercase or lowercase
    h will match the glob pattern, [Hh]*.


    ```

    if ($greeting == [Hh]) then

    echo Informal Greet

    ```


    Glob patterns use the *, ?, and [] special characters. The * matches any string
    of characters, including the null string. The ? matches any single character.
    The [] matches any of the characters enclosed within it. A range of characters
    is specified by two boundaries separated by a hyphen-[b-k] matches any characters
    between and including b through k. For example, it would match on c or f or any
    others in the range). If you include a ^ with the [] as the first character, then
    it negates the following characters matching anything other than those.[^agm]
    would match on any character other than a, g, and m, and [^a-z-Z] would match
    on anything other than an alphabetical character such as a punctuation mark or
    a number. You can also'
