  md: '# # Appendix B

    nTcl and Tk


    Tcl is a general-purpose command language developed by John Ousterhout in 1987
    at the University of California, Berkeley. Originally designed to customize applications,
    it has become a fully functional language in its own right. As with Perl, you
    can write Tcl scripts, developing your own Tcl programs. Tcl is often used in
    conjunction with Tk to create graphical applications. Tk is used to create graphical
    elements such as windows, and Tcl performs the programming actions such as managing
    user input. Like Java, Tcl and Tk are cross-platform applications.


    Tcl is an interpreted language that, like Perl, operates within its own shell.
    tclsh is the command for invoking the Tcl shell. You can also create files within
    which you can invoke the Tcl shell and list Tcl commands, effectively creating
    a Tcl program. A significant advantage to the Tcl language and its applications
    is the fact that it is fully compatible with the C programming language. Tcl libraries
    can be incorporated directly into C programs.


    The Tk application extends Tcl with commands for creating and managing graphical
    objects such as windows, icons, and text fields. Tk commands create graphic objects
    using the X-Window system. It is an an easier way to program X-Window objects
    than using the X11 toolkit directly. With Tk, you can easily create sophisticated
    window-based user interfaces for your programs.


    The Tk language is organized according to different types of graphical objects
    such as windows, buttons, and scroll bars. Each type of widget is referred to
    as widgets. Each type of widget has its own command with which you can create
    a widget. For example, you can create a button with the button command or a window
    with the window command. A type of widget is considered a class, and the command
    to create a widget is called a class command. The command will create a particular
    instance of that class, a particular widget of that type.


    Tk operates under the X-Window system, within which it uses its own shell—the
    wish shell—to execute Tk commands. To run Tk programs, you first start up your
    X-Window system and then start'
