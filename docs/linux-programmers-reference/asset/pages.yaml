  md: '# The gdb Symbolic Debugger 187


    # xxgdb


    xxgdb provides easy-to-use X-Window access to the gdb debugger. xxgdb is organized
    into a set of vertically positioned subwindows. Initially, five subwindows are
    displayed. A top subwindow, called the file window, displays the name of the file
    currently being displayed. The next subwindow displays the program''s source code
    file and is called the source window. A scroll bar to the left allows you to scroll
    through the text. Below that is the message window for displaying gdb status and
    error messages. The bottom subwindow, called the dialog window, is used for entering
    gdb commands and displaying their results. A scroll bar to the left allows you
    to view previous commands and their results. Above the dialog window is the command
    window. This is a subwindow that lists a series of buttons for different gdb commands.
    To execute a command as run or step, just click on that button. You can horizontally
    change the size of any window using the small squares located on the right side
    of the dividers between subwindows.


    With command buttons, you can easily set gdb commands, indicating breakpoints
    or specifying variables to display. If the command is designed to operate on an
    object such as a variable or function name, you first need to select that object
    in the source-code window. For example, to set a breakpoint on a function, you
    first click on that function name in the source-code window, then click on the
    break button. You will see a red arrow appear in the source-code window pointing
    to the first line of code in that function. As you step through the code, a blue
    pointer to the left will show you what line of code was executed.


    To display the contents of variables, you first select them and then click on
    the display button. This will open another subwindow, called the display window,
    at the bottom of the screen that will display the selected variable. As you choose
    more variables for display, they will be added to the window.


    The print button will print the contents of a selected variable or expression
    in the message window. However, if you right-click on the print button, then a
    separate pop-up window displays the contents of that variable. Above the display
    of the object''s contents is the pop-up''s label with the object''s name. To close
    the pop-up window, click on that label. If you right-click on any address window
    displayed as a pointer value, this will bring up a pop-up to display the contents
    of the object it points to.'
