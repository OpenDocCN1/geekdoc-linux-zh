    The process of loading a library is handled by the program itself. Special function
    calls in the program will load a library and reference its functions. These functions
    are part of the dynamic linker library (libid.so). The special function for dynamically
    loading a library is the dlopen function. This function takes as its arguments
    the name of the library and a permission, usually RD_LAZY. The function returns
    a pointer, usually a handle, which is used to reference that library. Functions
    in a loaded library are referenced within a program through pointers. These pointers
    obtain the address of a function in the library with dlsym function. dlsym takes
    as argument the name of the function you want, and returns its address. This address
    should be assigned to a function pointer. That pointer can be used to call the
    function.


