    # Other Compilers: Pascal, Ada, Lisp, and Fortran


    A great many programming languages are supported on your Linux system. Many are
    available on your OpenLinux CDROM. In addition to C and C++, you can compile Pascal,
    Ada, Lisp, Basic, and Fortran programs. In several cases, the compiling is handled
    by the gcc compiler, which is designed to recognize source code files for other
    programming languages. For example, G77 is the GNU Fortran compiler. This compiler
    is integrated with the gcc compiler. The command g77 will compile a Fortran program
    by invoking the gcc compiler with options to recognize Fortran code, using the
