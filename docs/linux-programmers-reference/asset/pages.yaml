    ```

    io.o : io.c

    gcc -c io.c

    ```


    The flow of control for a dependency line operates somewhat like a series of function
    or procedure calls. Control is transferred from one dependency line to another,
    each time checking the time stamps of files in the list of dependent files. The
    flow of control operates according to three basic rules applied to each dependency
    line.


    +   1. Start checking the list of dependent files. The first dependent file and
    check to see if it is itself a target file in another dependency line. If it is,
    then suspend operation on the current dependency line and transfer control to
    that other dependency line. This operation is similar to a function call, where
    control is transferred from one part of the program to'
