  md: '# ELF and a.out Binary Formats


    There are two possible formats for binary files, such as executable programs.
    The first is the a.out format, which is the original format used on Unix systems,
    as well as early Linux systems. The term a.out comes from the default name given
    to an executable file by the Unix C compiler. As shared libraries come into use,
    difficulties arise with the a.out format. Adapting an a.out format for use as
    a shared library is a very complex operation. For this reason, a new format was
    introduced for Unix System 5, Release 4, and for Solaris. It is called the Executable
    and Linking Format (ELF). Its design allow the easy implementation of shared libraries.


    The ELF format has been adopted as the standard format for Linux systems. All
    binary files generated by the gcc compiler in ELF format (even though the default
    name for the executable file is still a.out). Older programs that may still be
    in the a.out format will still run on a system supporting ELF.


    # C++ and Objective C: g++


    The gcc utility is also a C++ compiler. It can read and compile any C++ program.
    However, it will not automatically link with the C++ Class library. You would
    have to invoke it on the command line. Alternatively, you can use the command
    g++, which invokes the gcc compiler with the C++ Class library.


    C++ source code files have a different extension than regular C files. Several
    different extensions are recognized for C++: .C, .cc, or .cxx where xx can be
    any character, as .cpp. Other than this difference, you compile C++ programs just
    as you would C programs. Instead of gcc, it is preferable to use the g++ command.
    The following example compiles a C++ program, myprog.cpp.


    ```

    $ g++ myprog.cpp -o myprog

    ```


    The gcc compiler also supports Objective-C programs. Objective-C is an object-oriented
    version of C originally developed for NeXT systems. To compile a program in Objective-C,
    you use the gcc command with the -lobjc option. -lobjc links to the Objective-C'
