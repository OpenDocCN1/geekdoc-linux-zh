    # CO


    co option filename


    The RCS co command generates a copy of the source-code file. The co command with
    no options simply generates a read-only copy of the source-code file. The -l option
    generates a copy of the source-code file that you can edit. -l stands for lock,
    and when you use this option, the main.c program in the RCS main.v file is locked.
    No other programmers can access it, even if they would normally have access. This
    means that only programmer at a time can change a given file. When finished, you
    check in the program, registering your changes and unlocking it for others.


    In the next example, the co command generates an editable copy of the source-code
    file main.c.


    ```

    $ co -l main.c

    RCS/main.c,v --> main.c

    revision 1.1 (locked)

    done

    ```


    # ci


    ci filename


    Once you have finished editing your source-code file, you then register your changes
    in the RCS file with the ci command. You enter the key ci followed by the name
    of the RCS file. You are then prompted to enter comments. In effect, editing a
    copy of the file generated with co creates a new version of the source-code file,
    a new set of changes constituting a new version. The version number (1.2) is displayed.
    In the next example, the user saves the changes to main.c by generating a new
    version, 1.2.


    ```

    $ ci main.c

    RCS/main.c,v << main.c

    new revision: 1.2; previous revision: 1.1

    enter log message, terminated with single ''. '' or end

    of file:

    >> Added prompts

    >> .

    done

    ```'
