  md: '# The make Utility 213


    # Implied make Dependencies


    The **make** utility has a set of implied dependency relationships that it automatically
    applies to source-code and object-code files. In Linux, the source-code file for
    any given programming language must contain a specific suffix. C source-code files
    require .c suffix. Fortran files require .f suffix .s is used for assembler source-code
    files. **make** will examine the source-code file of a corresponding object-code
    file in a dependency list and automatically invoke the appropriate compiler for
    that source-code file. This means that by using implied dependencies, you can
    dispense with the dependency lines for compiling source-code files. You can then
    reduce your makefile to one Linux command: the command to link files.


    Exactly how **make** implements implied dependencies is discussed later, during
    the examination of suffix rules. Using such rules you will learn how to create
    your own implied dependencies. For now it is enough to know that you can drastically
    reduce the number of dependency lines in your makefile if you wish to do.


    In the next example, by relying on implied dependencies, the makefile for the
    **bookrec** program is reduced to two dependency lines. When examining the dependency
    list for the **bookrec** dependency line, **make** will look for corresponding
    source-code files in the current directory. It will find **main.c** and **io.c**.
    Since these files have a .c extension, the dependency line would recognize these
    as C source codes and would invoke the **gcc** compiler if necessary. Suppose
    the user recently modified **io.c**. Then **make** would know to compile **io.c**
    with the C compiler, **gcc -c**.


    # makefile


    ```

    bookrec : main.o io.o

    gcc main.o io.o -o bookrec

    ```


    ```

    $ ls *.c

    main.c io.c

    $ make

    gcc -c io.c

    gcc main.o io.o -o bookrec

    ```


    To denote the dependency of header files on an object-code file, you need to add
    a dependency line, but one without a following Linux command. **make** will locate
    the source-code file and compile it to create the object-code file. In the next
    makefile example, another dependency line is added for the **main.o** and **types.h**
    dependency.'
