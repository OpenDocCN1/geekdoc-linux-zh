  md: '# TCSH Configuration 103


    The following table lists several commonly used TCSH shell features:


    | Feature | Function |

    |---|---|

    | set | Turn on shell features. |

    | unset | Turn off shell features. |

    | echo | Display each command before executing it. |

    | ignoreof | Disable CTRL-D logout. |

    | noclobber | Do not overwrite files through redirection. |

    | noglob | Disable special characters used for expansion: *, ~, [, and j. |


    # TCSH Shell Variables


    As in the Bash, you can use special shell variables in the TCSH shell to configure
    your system. Some are defined initially by your system, and you can later redefine
    them with a new value. There are others that you must initially define yourself.
    One of the more commonly used special variables is the **prompt** variable that
    allows you to create your own command-line prompts. Another is the **history**
    variable with which you determine how many history events you want to keep track
    of.


    In the TCSH shell, many special variables have names and functions similar to
    those in the BASH or ZSH shells. Some are in uppercase, but most are written in
    lowercase. The **EXINIT** and **TERM** variables retain their uppercase form.
    However, **history** and **cpath** are written in lowercase. Other special variables
    perform similar functions, but have very different implementations. For example,
    the **mail** variable holds the same information as the BASH shell''s **MAIL**,
    **MAILPATH**, and **MAILCHECK** variables together.


    # prompt, prompt2, prompt3


    The **prompt**, **prompt2**, and **prompt3** variables hold the prompts for your
    command line. You can configure your prompt to be any'
  merge: -1
