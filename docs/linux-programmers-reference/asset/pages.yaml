    # Header Files


    Dependency relationships can be set between files of any type, not just source-code
    and object-code files. For example, you can set up a dependency relationship between
    an object-code file and what is known in C programs as a header file. A header
    file is a text file that contains segments of source code that are inserted into
    your main source-code files by your compiler. They become an actual part of the
    program. In this respect, an object-code file may not only be dependent on a source-code
    file, but also a particular header file. By convention, header files all have
    the extension .h attached to their names. In the next makefile example, both the
    types.h header file and the main.c source-code file are used to create the main.o
    file. An include instruction in main.c instructs the compiler to include the function
    declaration in types.h as part of the main.c source code. Both main.c and types.h
    are now used to create the main.o file. Should you make changes to the types.h
    file, you want to make generate a new main.o file. To do this, you need to place
    types.h as a dependent file in the main.o dependency line. If there are any changes
    to main.c or to the types.h header file, then main.c will be recompiled.


    # makefile


    ```

    a.out : main.o io.o

    gcc main.o io.o

    ```


    ```

    main.o : main.c types.h

    gcc -c main.c

    ```


    ```

    io.o : io.c

    gcc -c io.c

    ```'
