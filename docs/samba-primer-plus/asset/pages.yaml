  md: "# Different UNIX Vendors Use Variations on the SVR4 Startup Scripts Scheme\n\
    \nUnfortunately, each UNIX vendor usually modifies this standard. In HP-UX, for\
    \ example, all the directories mentioned previously use the /sbin tree. However,\
    \ HP provides a control structure under the directory /etc/rc.config.d in this\
    \ directory there is a file for each service. In this file you can centrally whether\
    \ this service is to be started or not, even include variables that will be used\
    \ in the active startup script. A common use of this is to specify command-line\
    \ options that will be passed to the daemon when it starts.\n\nLuckily, as part\
    \ of the Samba source distribution, there is a sample script you can put into\
    \ the /etc/rc.init.d directory. You will find this sample script at $SAMBA_ROOT/examples/svr4-startup/samba.server\
    \ It will look like Listing 2.2.\n\n# LISTING 2.2 Sample Samba Startup Script\n\
    \n```\n#!/bin/sh\n#ident \"(@)samba.server 1.0 96/06/19 TK\" /* SVR4.0 1.1.13.1/*\n\
    # Please send info on modifications to knuutila@cs.stu.fi\n# This file should\
    \ have uid root, gid sys and chmod 704\n#\nif [ ! -d /usr/bin ]\nthen\n    # /usr\
    \ not found\n    exit\nfi\nkillproc() {\n    pid=$/usr/bin/ps -e |\n    /usr/bin/grep\
    \ -w $S |\n    /usr/bin/sed -e 's/\"//*' -e 's//*'\n    [ \"Spid\" = \"\" ] &&\
    \ kill Spid\n}\n# Start/stop processes required for samba\ncase \"$1\" in\n'start')\n\
    #\n# Edit these lines to suit your installation (paths, workgroup, host)\n#\n\
    /opt/samba/bin/smbd -D -s/opt/samba/smb.conf\n/opt/samba/bin/nmbd -D -1/opt/samba/log\
    \ -s/opt/samba/smb.conf\n;\n\n'stop')\nkillproc nmbd\nkillproc smbd\n;\n\n*)\n\
    echo \"Usage: /etc/init.d/samba.server { start | stop }\"\\n;\nesac\n```"
