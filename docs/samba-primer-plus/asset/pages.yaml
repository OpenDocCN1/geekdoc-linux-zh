- img_proc: true
  md: '# Certificate Signing Explained


    Many now sign certificates for a fee. An example of one of these public CAs is
    Verisign (www.verisign.com). Getting your certificate signed by one of these CAs
    is costly and bureaucratic process, but it must be done if you want to be trusted
    throughout the Internet. You need to supply your selected CA with a certificate
    signing request (CSR). This CSR contains your public key and some information
    about your company, as Country (C), State/Region (ST), Location (L), Organization
    name (O), Organizational Unit (OU), and common name (CN). All values combine a
    Distinguished Name (DN). The L is usually the city, the O is the company, and
    the OU is a group within the company (for example, Information Technology). By
    convention, the CN is the hostname of the server the software will be running
    on. In the case of a Server, the CN will be the Web address (for example, www.cyber.com.au)
    and will be the name of the server running Samba (for example, sambaserver.cyber.com.au).


    The CA needs to doubly sure that the supplying the CSR is who it claims to be
    because it is the CA''s reputation on line if it is later found that the company
    was actually pretending to be someone else. After all details are verified, the
    CA sends to the requesting organization its certificate, which contains not only
    all information in the CSR, but also the name of the CA and its digital signature.
    The digital signature is computed using the CA''s private key, which means that
    it is using public/private cryptography, and the company can verify it using the
    CA''s public key or certificate. The company, now has its CSR digitally signed,
    is free to use this certificate with confidence that the identity itself will
    be a trusted entity.


    # How Does the Client Verify a Server-Side Certificate?


    If you think about this process, one small part of the equation is missing. If
    the company uses its certificate on a secure Web site, a browser (client) accessing
    this server begins the secure session and the server sends its certificate. How
    does the client know this certificate is real and the signature is valid? It needs
    to verify the signature on the certificate that was computed by the trusted CA.
    To do this, it needs the CA''s certificate. All the major browsers have the certificates
    of the major players in the CA market already installed. So to verify a certificate,
    the client needs to compute its own digital signature from the details on the
    certificate and if it matches the one that was put by the CA. If there is a match,
    the client will continue to use the encrypted session and all will be well. If
    there is a discrepancy, the client will no doubt sound some alarms to warn the
    user that there be a problem.


    The final step is after the server has authenticated, and optionally, the client
    has authenticated the server is that the encrypted session is set up. This encrypted
    session is where the data transfer between the client and server occurs. The session
    setup involves sending the key to the server that is encrypted with the server''s
    public key. When that is done, all subsequent communications are encrypted. The
    whole SSL establishment process is depicted in Figure 9.2.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# FIGURE 9.2


    The flow of messages during the SSL handshake process.


    Client


    Server


    Client Hello


    Server Hello


    (Optional) Server Certificate


    (Optional) Request Client Certificate


    (Optional) Client Certificate


    Client Key Exchange


    (Optional) Certificate Verify


    Change Cipher Spec


    Change Cipher Spec


    Application data can now be transmitted securely


    The very first messages are sent are **client hello** and **server hello**. A
    number of parameters are exchanged: SSL protocol version, session ID, cipher suite,
    and compression method. The cipher suite is the cipher that will be used when
    the application data starts to be transferred. You will also note that both the
    server certificate and client certificate are optional. If no certificates are
    involved, encryption still occurs, but you need to be trust the server you are
    connected to for 100% as there are no authentication processes in place. For detailed
    information on the internals of the SSL protocol, http://home.netscape.com/eng/ssl13/ssl-toc.html.


    As you can probably imagine, the usefulness of SSL has meant that it has been
    used for many applications other than just Web servers; examples include telnet,
    ftp, and—you guessed—Samba, just to name a few. In Samba, because SMB transactions
    between client and server are in plain text, anyone can sniff on the traffic and
    get an idea of what a user is doing, and in the process possibly see sensitive
    data. Consider this scenario: An organization has sensitive data located on a
    Samba server, and a particular user needs to be able to access this server from
    the Internet. It is a perfect example of how an SSL version of Samba could be
    useful. It demonstrates that a digitally signed **client-side certificate** is
    also needed to verify that the client accessing the Samba server is really who
    it says it.


    A client-side certificate is the reverse of a server-side certificate. It authenticates
    the client to the server. You will generally not just want anyone connecting to
    your Samba server—or even connecting to an SSL ftp or ssl tel server for that
    matter. Each valid Samba user can be issued a certificate that is signed by a
    CA. Most likely the CA in this situation will be the organization itself because
    it can be sure that they are who they say they are, and each employee has his
    own unique certificate.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Creating SSL Certificates for Use with Samba


    Before you can generate an SSL certificate that you can use with Samba, you need
    to check a few things. You need to make sure that OpenSSL is installed on your
    system. If you are running Red Hat Linux 6.1, there is a package on your CD called
    openssl-0.9.3a-3.i386.rpm.

    Install it with:


    ```

    # rpm -i /mnt/cdrom/RedHat/RPMS/openssl-0.9.3a-3.1386.rpm

    ```


    For other versions of UNIX, you can use the OpenSSL Web site at http://www.openssl.org
    and download the source distribution. It is a simple matter following the instructions
    to compile and install OpenSSL. It should compile on all major UNIX platforms.


    To work around a Red Hat distribution packaging bug with Red Hat Linux 6.1 (and
    possibly other versions), you need to create a link for the OpenSSL configuration
    file:


    ```

    # ln -s /etc/openssl.cnf /etc/openssl.cnf

    ```


    To be able to randomize the random number generator for generating the key pair,
    you need to put some random data into a file. Type as this:


    ```

    # cat /tmp/random.txt

    ```


    Then type some random text for a minute to provide enough random data to create
    a strong public/private key pair. When you are done, press Ctrl+D.

    You can now initialize the random number generator:


    ```

    # openssl genrsa -rand /tmp/random.txt > /dev/null

    # rm -f /tmp/random.txt

    ```


    This creates a file called .rnd in the home directory of the user who ran it.
    The information in this file is used by the OpenSSL random number generator when
    choosing random numbers, for example, when generating your public/private key
    pairs. It is very important that you execute the command to remove random.txt
    file. If a bad guy got hands on this file, he would have a head start on cracking
    your encryption!


    Next you need to create a key pair (public/private keys also known as the RSA
    algorithm). This is done using the genrsa command for an RSA key pair:


    ```

    # openssl genrsa -des3 1024 > key.pem

    ```


    The des3 indicates that OpenSSL is using the triple-DES algorithm to protect your
    1024-bit RSA key, and you are asked for a corresponding passphrase to use as the
    encryption key. This key protection with a passphrase locks the private key. This
    means that if someone gets the file where the private key is stored, he cannot
    use it because it is encrypted and he would need to enter the passphrase to unlock
    it. You can generate the private key without encryption (by dropping the -des3
    option), but it is not recommended, because anyone with access to your files can
    copy your private key from. You may choose any encryption algorithm that is supported--all
    supported encryption algorithms are listed in the OpenSSL man page, which you
    can find at http://www.openssl.org/docs/openssl.html. The OpenSSL distribution
