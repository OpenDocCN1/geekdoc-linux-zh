  md: '# CHAPTER 12


    # DEBUGGING SAMBA


    You will learn about the following in this chapter:


    +   - Common mistakes people make when configuring their Samba server

    - Methods of systematically troubleshooting your Samba server

    - How to set up and view Samba debug logs

    - How sniffing the SMB network traffic can help in the debugging process

    - Other resources that are available for you to use if you still cannot get your
    problem sorted out


    This chapter is designed to help you debug any problems you may be having while
    trying to get your Samba configuration up and running the way you want it. The
    common mistakes people make are described. You will probably find that most of
    your questions are answered in section. But if they aren''t, the next section
    covers how to use network monitoring tools to help figure out problems with your
    Samba server. These tools are not as scary as you might think, and are very helpful.
    If you are still stuck after going through the first two sections, the rest of
    the chapter points you to the usual places to help fix your problem, which include
    mailing list archives, Web sites, and newsgroups.


    # Common Mistakes and Troubleshooting Techniques


    This section has a question-answer format to help you debug your problem. But
    first, before you start any troubleshooting, perform the following simple network
    tests. This will pick up any simple network connectivity problems:


    +   - From the Windows box, ping the Samba box.


    You can do this by entering ping sambaserver from a command prompt. See Figure
    12.1 for an example of how to do this.'
