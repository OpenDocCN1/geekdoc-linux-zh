  md: 'Chapter 10 • ADDITIONAL SHARE LEVEL OPTIONS 187


    # # Parameters That Affect Files Located in Shared Resources


    The next set of parameters affect how the files are used in a share to display
    to the user. The parameters covered include `delete readonly`,, which allows a
    connecting user to override the read-only bit on a file to allow file deletions;
    dont descend, which causes certain directories to come up empty; hide files and
    hide dot files, which hide certain files from view in the share although they
    are still visible; and veto, which makes certain files inaccessible.


    # ## delete readonly


    This parameter allows read-only files to be deleted. You would normally need to
    set this. It defaults to `no`. You might find this useful if you have a particular
    directory tree that the read-only parameter set on all the files and you have
    an administrator of that share (who does not know UNIX) uses a different share
    for administrative purposes but points to the place that has this parameter set.
    This allows the administrator to delete files that may not be required anymore.


    # ## dont descend


    The dont descend parameter allows you to specify a comma-separated list of directories
    that Samba displays as empty. This can be very useful if you have certain directory
    paths under a share that you do not want your SMB clients to access. There are
    also areas on a UNIX bus such as `/proc` and `/dev` that make no sense for a user
    to descend into. An example follows:


    ```

    dont descend = /proc, /dev, /stand

    ```


    # ## hide files, hide dot files


    The first hide parameter, hide files, specifies files that are still accessible,
    but hidden from view for this share. These files are separated by a “-” and may
    include spaces and the `*` and `?` DOS wildcards. The hide dot files hides all
    files that begin with a dot. By default, hide dot files is set to yes, but no
    other files are hidden.


    # ## veto files, delete veto files, oplock files


    The veto files option is simple to hide files, but instead of hiding the specified
    files, it makes them inaccessible. The same rules for specifying files apply with
    hide files. If you delete a directory with veto files in it, normally the vetoed
    files are kept and the directory deletion will fail. But there may be times when
    you want the directory to be deleted. If this is what you want, set the delete
    veto files parameter to `true`. The directory deletion will be successful.'
