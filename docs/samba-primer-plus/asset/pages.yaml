    # smbfs


    Remember smclient? You have probably noticed by now that using smclient all the
    time

    can get a bit aggravating, especially if you frequently to access Samba systems.
    smbfs is a

    driver that allows you to mount an SMB drive under a directory on your Linux system.

    Currently, smbfs is available only on Linux systems. All the latest Linux kernels
