  md: '# SAMBA PRIMER PLUS


    store both versions of the password. With all passwords stored as Xes, this disallows
    any connections as any user. You will need to set all users'' passwords to a default.
    You can do this with the command smbpasswd.


    # smbpasswd


    The smbpasswd command is very similar to the regular UNIX passwd command. There
    are two formats of this command. When you run this command as root, you can get
    these options:


    +   smbpasswd [options] [username] [password] options:

    -s use stdin for password prompt

    -D LEVEL debug level

    -U USER remote username

    -r MACHINE remote machine

    -R ORDER name resolve order

    -j DOMAIN join domain name

    -a add user

    -d disable user

    -n set no password

    -m machine trust account


    When you run this command as an unprivileged user, there is a subset of the commands
    available:


    +   smbpasswd [options] [password] options:

    -s use stdin for password prompt

    -D LEVEL debug level

    -U USER remote username

    -r MACHINE remote machine


    Several tasks can be accomplished easily with smbpasswd, as described in the following
    sections.


    # Adding a Large Number of Passwords at Once


    When running smbpasswd as root, you can change any user''s password without knowing
    the original one, with the passwd command. One nice feature is easy password changing.
    For example, if you have 100 UNIX users and a newly created smbpasswd file, you
    can write a script to automatically change all their smb passwords to a default
    by specifying the username and new password on the command line:


    ```

    smbpasswd matt newpassword

    ```


    Using smbpasswd in conjunction with a program that allocates random passwords,
    like the mkpasswd utility with Red Hat Linux, you can quickly set a large number
    of passwords relatively securely.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Adding New Unix Users to smpasswd


    As root, when you add a new UNIX user, you will need to add him to smpasswd as
    well. This process is made simple with the -a option:


    ```

    # smpasswd -a newUser smpasswd

    ```


    This will add newUser to the smpasswd file with the initial password newUsersmpasswd.


    # Users Changing Their Own Passwords


    Any user can change her own password by simply typing at a UNIX shell prompt:


    ```

    $ smpasswd

    Old SMB password:

    New SMB password:

    Retype new SMB password:

    Password changed for user matt

    ```


    She is asked for her old password, then asked for her new password, and then asked
    again for verification.


    # Changing the Password on a Remote SMB Server


    Support is included in smpasswd for changing the passwords on remote SMB servers,
    such as Windows NT. Anyone can issue a command like this:


    ```

    $ smpasswd -r <remote machine>

    ```


    This command by default uses the current UNIX username as the username that the
    user is changing the password for. If you don''t want this, you can specify a
    remote username with the following command:


    ```

    $ smpasswd -r <remote machine> -U <remote username>

    ```


    The parameter <remote machine> can be any Windows NT Server, Samba server, or
    other SMB-style server that supports password changing.


    # Keeping smpasswd Entries and passwd Entries in Sync


    Consider the consequences of using both smpasswd and a regular UNIX passwd file.
    Most of your users would appreciate having one password for both logging on to
    the UNIX server, and making an SMB connection to a share on the same UNIX box.
    When they change their SMB with smpasswd, they need to change their UNIX password
    at the same time to keep everything up-to-date. Samba can be configured to automatically
    change a UNIX password at the same time as the SMB password change. This functionality
    is disabled by default, you need to switch it on:


    ```

    unix password sync = True

    ```


    The other parameters are used in conjunction with unix password sync are passwd
    program and passwd chat. passwd program defines the program that Samba calls as
    root to allow the new password to be set when the smpasswd entry is changed. Set
    passwd program like this:


    ```

    passwd program = /bin/passwd %u

    ```'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# SAMBA PRIMER PLUS


    As usual, u will be replaced with the username doing the password change. The
    passwd parameter is what controls the password changing conversation with the
    passwd program and might need a little tweaking depending on what environment
    you are in. The default setting is passwd chat = *old*password* %0 *new*password*
    %n *new*password* %n *changed*

    nDetails on how you can tweak this parameter is in the smb.conf online manual
    page.


    # Migrating Existing Windows NT Encrypted Passwords to a Samba Server


    The initial set of steps to produce an smpasswd file was most appropriate for
    just using encrypted passwords on a single UNIX server with existing user accounts.
    This is for environment that is predominantly UNIX-based, but with Windows clients
    and a small number of Samba servers dotted around the place. You also want to
    be able to use Samba in a manner without cleartext authentication for your SMB
    connections. Many sites use plaintext authentication when turning on support for
    NT-encrypted passwords is trivial (as you have seen) and that provided added level
    of security.


    There is one other way of creating an smpasswd file. This method is used in environments
    where you have an existing Windows NT server and are migrating all users to a
    Samba UNIX server, and are removing the Windows NT machines when you are done.


    This magical proper is called passwd. It was written by the Samba team and is
    freely available from your closest Samba mirror in /pub/samba/passwd. There are
    three files in this directory, README file, the source code file passwd.c, and
    a Win32 x86 executable passwd.exe. If you are interested in Win32 programming,
    go ahead and look at the source, but if you change anything, you will need a Win32
    compiler such as Microsoft Visual C++ as well as a DES library such as the freely
    available http://ftp.pspy.uq.oz.au/pub/Crypto/DES/libdes-4.01.tar.gz.


    # Using passwd


    Actually using passwd is relatively painless. It works by following the registry
    key HKEY_LOCAL_MACHINE\SAM\Domains\Account\Users and dumping the Windows NT logon
    names and hashed passwords in a file in the smpasswd required format (see the
    preceding section). To do this, you must execute passwd as Administrator, and
    to be able to access the registry keys it, needs to modify the registry permissions
    on each key it needs to access. The permissions are returned to normal after each
    user is dumped. Although to date there are no known problems with this program,
    the Samba team assumes no responsibility for


    If you have multiple Windows NT servers, you are first of all have to decide which
    server to run passwd on. If the users who are being migrated to Samba are on a
    Windows NT domain, you can execute passwd as domain controller that is a member
    of the domain. If the users want to migrate on a Windows NT server, you just need
    to run it on that server.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Chapter 5 • INTEGRATING SAMBA INTO AN EXISTING WINDOWS NETWORK


    If they are registered on Windows NT servers, you can run it on all of them, and
    concatenate the resulting pdwump files. If you are joining multiple pdwump files,
    make sure that in the final file, each user has a unique id (second field in the
    file).


    # Use Caution with the Output File Created by pdwump


    Unlike the UNIX password, the file that is created with pdwump, although not containing
    plaintext passwords, contains the actual hashes that are used in the CIFS authentication
    process. This means that if someone with enough know gets a copy of this file,
    he has enough information to compromise your environment. Always treat the smbpassword
    file with care, and securely copy it from your Windows NT system to your Samba
    system, either using SSH, or floppy disk! and double-check the permissions on
    the smbpassword file on your Samba system are set to owner root and no access
    to anyone else (rw-------).


    Unless you have for other reasons, you do not want to use this method in conjunction
    with continuing to use a Windows NT server. The main reason is that the smbpassword
    file will not keep in sync with your current domain SAM—effectively your users
    need to keep two passwords in sync, and this is not fun! You can use pdwump periodically
    and securely copy the resulting dump file to the Samba server as some form of
    password-syncing process, but if you are doing this, you may as well use the SAM
    on the NT machine for password authentication in the first place by setting the
    security = server option.


    # User Home Directories


    When you have Windows NT servers only, it is more than likely each user has a
    specified home directory, with an accompanying share. Remember that Windows NT
    home directories are specified in User Manager. Samba provides an easy way of
    managing user home directories. There is a special section in the configuration
    file called [homes]. This section causes for the home directories of the users
    registered on your Samba server to be automatically generated on the fly using
    the directories in either /etc/passwd or the smbpassword file as the home directories.
    This is very useful because it means that you do not have to go and create home
    shares for each individual user. This [homes] section is effectively cloned with
    each connection and [homes] is renamed to the service name being connected to.
    An example of a [homes] section is as follows:


    +   [homes]


    ```

    comment = Home Directories

    read only = No

    create mask = 0750

    browseable = No

    ```


    The comment makes for easy identification in a share list, of which share is a
    home directory. The read only parameter allows all home directories to be writable.
    An alternative is to put writable = Yes. Both achieve the same end result! The
    create mask specifies the default permissions of files that are created on the
    share, and browseable indicates that each home share is hidden from the sharelist,
    seen from a net view command or in Network Neighborhood.'
  merge: -1
