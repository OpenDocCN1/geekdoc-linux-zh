  md: '# Chapter 9


    +   1. SSL, together with the authentication handshake, provides a secure means
    of communicating through an unsecured network such as the Internet. SSL has many
    applications, an example of which is that a user can connect to an online shop
    to purchase an item with his credit card, and he is guaranteed that the shop is
    what it says it is through the use of certificates.


    +   2. A CA is a Certification Authority. CAs are entrusted by the public to digitally
    sign certificates. By signing certificates, they indicate that they have done
    the necessary background checks to make sure that the organization supplying the
    certificate is what it says it is so that the public will be able to secure business
    with it.


    +   3. A certificate signing request (CSR) is an unsigned certificate that is
    sent to the CA for signing. The CSR contains both the Distinguished Name (DN)
    and the public key of the organization. The public key is derived from the private
    key, which must be kept private. This process involves some complex mathematics.


    +   4. Client-side certificates would be most important with Samba. In conventional
    applications, they are used with the Web where the server must authenticate to
    the client so the client knows who is talking to. Samba, however, will probably
    be storing sensitive files on it—you don''t just want accessing them with an SSL
    SMB client, even if it is encrypted! So with Samba, the client must authenticate
    to the server so that only SSL-enabled SMB clients are allowed to access the Samba
    server.


    +   5. You would compile and install OpenSSL (source from www.openssl.org), and
    then compile and install Samba yourself from scratch with SSL support (source
    from www.samba.org).


    You would create a CA, generate a certificate for your Samba server, and then
    generate individual certificates for Samba clients. All these certificates will
    be signed using the CA you created.


    You would configure Samba to enable SSL for all connections, or possibly for certain
    IP address ranges. Then you would configure Samba with its server-side certificate,
    and configure your SSL clients (smclient) with their client-side certificate (still
    in sm.conf on the client machine).


    Finally, you would start Samba, enter the passphrase, and Samba would be ready
    to use SSL.


