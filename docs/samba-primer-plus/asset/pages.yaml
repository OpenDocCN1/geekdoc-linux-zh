    When the administrator is finished, she saves the settings to a file called config.pol.
    This file is then put onto the domain controller''s netlogon share, which is accessed
    when users get authenticated. Now that you are using Samba as a domain login server
    for your Windows clients, you can put this config.pol file on the Samba netlogon
    share, and your system policies will continue to restrict what can be done on
