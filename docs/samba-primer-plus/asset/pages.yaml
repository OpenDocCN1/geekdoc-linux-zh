  md: '# An Alternative to Using DNS


    If you are not using DNS, for example, most people with their home networks do
    not bother to run a DNS service. In this case, you can still use the first method.
    All you need to do is edit your system''s hosts file and add an entry for your
    Samba server. For example on Windows NT:


    ```

    C:\notepad %systemroot%\system32\drivers\etc\hosts

    ```


    Or Windows 98:


    ```

    C:\notepad win98\hosts

    ```


    In both cases, simply add a line like this:


    ```

    192.168.66.66 goofey.mycompany.com

    ```


    The second fix is probably more likely to be used if you are not using DNS, and
    is simpler to configure. For Windows NT, open up a command prompt and enter these
    commands:


    ```

    C:\cd %systemroot%\system32\drivers\etc

    C:\WINDOWS\system32\drivers\etc>copy lmhosts.sam lmhosts

    C:\WINDOWS\system32\drivers\etc>notepad lmhosts

    ```


    For Windows 98, open up an MS-DOS prompt, and just enter this command:


    ```

    C:\notepad win98\lmhosts

    ```


    In both cases, enter a line containing the name of your Samba server and its IP
    address, for example:


    192.168.66.66 goofey


    Save it and trying the drive again. It should work with no problems for you now.
    The reason why this works will be unraveled in the next chapter.


    # Samba Server Configuration Problems


    This is obvious, but check that smbd and nmbd are actually running on your Samba
    server. You won''t be able to connect if they have been stopped for some reason.
    Entering the following command will let you know if Samba is currently running:


    ```

    $ ps auxw | grep -e smbd -e nmbd

    ```


    Also, there is a command that with Samba called testpar that you can run which
    runs through your Samba configuration file and reports any errors it finds. You
    just run it like this:


    ```

    $ testpar

    ```


    All your Samba configuration variables will scroll up the screen. This is sometimes
    quite handy if you have a precompiled version of Samba and are not sure what the
    defaults compiled in were set to. Errors in the configuration file are displayed
    to the screen, so fix any if they appear.'
