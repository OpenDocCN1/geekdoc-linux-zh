    needs access to his home directories via Samba.


    # Samba and Encrypted Passwords


    Unfortunately, Microsoft made a serious security blunder in the initial versions
    of Windows

    NT and Windows 95. By default, when connected to SMB servers, it negotiated the
    lowest

    security level of authentication both had in common. This meant that if they con-

    ected with old-style LAN Manager that did not support password encryption, Samba

    connections were negotiated with plaintext passwords, which is an obvious security
    problem.

    Microsoft remedied this problem with file updates for Windows 95 (for more informa-

    , see http://support.microsoft.com/support/kb/articles/I165/04/03.ASP) and

    Pack 3 or greater for Windows NT. 98, luckily, negotiates encrypted pass-

    words by default. Back in Chapter 3, you learn a setting that turns plaintext
    pass-

    words back if you are running Windows 98 or Windows SP3+. That''s for a quick

    test environment, for a full corporate environment, having clearest passwords
    flying

    around your network is not a good idea! What you can do is configure Samba to
    accept

    encrypted passwords, which solves the clearest problem. The following steps outline
    the basic

    procedure to follow enabling NT encrypted password support.


    First of all, make sure encrypted passwords are turned on in smb.conf:


    ```

    encrypt passwords = yes

    ```'
