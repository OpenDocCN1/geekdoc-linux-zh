  md: 'Of course, replace SAMBADOMAIN with the name of your domain, not Samba server.
    The IP address is the address of your Samba server. When trying to join the new
    domain, Windows tries to connect the NetBIOS name of the domain. Adding this entry
    will allow it to resolve the domain name to an IP address so it can contact your
    Samba server.


    Q: I try to connect my NT server/workstation to the Samba PDC by clicking the
    Change button and entering the Samba domain name. It complains about not being
    able to change the domain password.


    A: You probably do not have encrypted passwords to yes in your smb.conf file.


    Q: For some reason my Samba server cannot talk to any Windows machine with smbpasswd
    or smbclient.


    A: Name resolution is probably the culprit here by using the nmblookup command
    on your Samba system:


    ```

    $ nmblookup -B windows

    ```


    This should return the IP address of the Windows client you are trying to access.
    If it doesn''t, and your Samba server is acting as a WINS server, check that the
    machine is correctly configured with the right IP address for the WINS server.


    Q: When adding an account to the smbpasswd file (smbpasswd -a fred), you get the
    error User was not found in system password file.


    A: Before you add users to smbpasswd, they must already exist in the system /etc/passwd
    file first. Add new Samba users to the system as you would normally, possibly
    using the user command, and add them to smbpasswd.


    Hopefully your problem was answered by one of the preceding questions. If not,
    there is a good documentation file that comes with the Samba distribution called
    DIAGNOSIS.txt. It gives you some step-by-step guidelines on helping pinpoint the
    exact problem.


    # Sniffing


    One way to know exactly what is happening in the network and to debug your Samba
    problems is to use a network sniffer. There are a few ways to go about this. One
    is to use the tool, Network Monitor, that comes with Windows NT. This is probably
    the best, and the one with the most user-friendly display. There is also a modified
    version of the old favorite for UNIX systems, tcpdump. The modified version is
    called tcpdump-sm and contains the information required to break out all the information
    in an SMB packet. Finally, there is an Open-Source product, ethereal, which is
    X Windows-based and has a lot of potential. It breaks many different protocols
    in a very user-friendly format, and this tool will probably be in every System
    Administrator''s toolbox in the near future to help track down these nasty problems.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# # Network Monitor


    Network Monitor comes in two versions. There is the one that comes with Windows
    Server and the one that comes with SMS. The former only allows you to monitor
    traffic and from the system it is running on, whereas the latter allows you to
    see all traffic passing by the server it is running on. If you only have Windows
    Workstation, you will need to get your hands on NT Server or SMS to be able to
    use Network Monitor.


    Now a look at two cases. Both depict the servers DAFFY and GOOFEY. DAFFY is in
    a Windows Server and GOOFEY is a Samba box. DAFFY is trying to connect to a service
    on \GOOFEY\TMP. The first trace is shown in Figure 12.6.


    # ### 12.6 A Network Monitor Trace


    in which an SMB server cannot be found.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_222_0.png)


    In this trace, Samba is not running on GOOFEY. DAFFY does three NS: query for
    GOOFEY. This provides a way to map any existing NetBIOS sessions to the NetBIOS
    name GOOFEY if it exists. Then it does Reverse ARP request looking for who belongs
    to the IP address 192.168.66.4. In this particular configuration, there is an
    hosts file that contains the mapping between GOOFEY and this IP address. The Reverse
    ARP request is to satisfy the IP that it can actually talk to GOOFEY. It attempts
    a TCP connection to Samba on GOOFEY four times. You will notice a number of packets
    with the protocol type to TCP. Directly to the protocol is the TCP options, and
    each initiating connection has the S option. So as you can see in Figure 12.6,
    four connections attempt to be initiated, and each time they fail because there
    is nothing listening on port 139 on the server. It tries again four, then fails,
    and then you get the result error message The network path was not found.


    The next trace is of an SMB connection being established for the first time. This
    is shown in Figure 12.7.'
