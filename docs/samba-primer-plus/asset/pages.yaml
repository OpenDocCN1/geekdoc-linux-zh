    You can specify both the username and password on the command line if you want:


    ```

    $ smclient -L //daffy -U matt@myspass

    ```


    In this example, the password is specified as part of the username with a % sign.
    This can be very useful when using smclient as part of scripts. However, be careful
    to protect any files with passwords with 700 permissions (`chmod 700 filename`)
