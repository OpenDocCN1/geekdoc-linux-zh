- img_proc: true
  md: 'As previously mentioned, Samba 2.1 will consist of the missing PDC functionality,
    other fixes for Samba to work with Windows 2000 correctly, and not much else.
    If not released already, it should be finished sometime in 2000. Once 2.1 is in
    production release, it is recommended that you test it in your environment, and
    if everything works, free to upgrade. You should then have a completely working
    PDC implementation that you can install on any UNIX that compiles on.


    Samba NGC consists of bleeding-edge development, and is much more of a moving
    target than the other two CVS branches. Some of the senior Samba developers are
    re-engineering functions of the Samba code to make it easier to upgrade in the
    future. One of the most interesting projects happening is the changing of *smbd*
    to only do file sharing. All non-file-sharing functionality features, like authentication,
    print spooling, and other *tasks*, are being taken out and put into their own
    processes. This will mean that there will be separate processes for all the functionality
    that is now provided by two processes: *mbnd* and *smbd*. It also means that you
    will be able to upgrade a particular function without upsetting the rest, rather
    than those when you upgrade to a particular feature, but something seemingly unrelated.


    Other work that is being done in Samba is the tidying up of internal databases
    with a brand new database engine called TDB (Trivial Database). Samba developer
    Andrew Trigill has this database to take care of a few internal data structures
    that Samba uses to store information. This will include a lot of Samba Windows
    information. In the end, this makes the Samba code cleaner, and hopefully provides
    a performance boost as well.


    Once all these changes have been implemented and when Samba 3.0 is released, it
    should be a fully working alternative to Windows NT/2000 server. The amount of
    work that has been done by the Samba development team to get as far as they have
    to be commended—especially a lot of the implementation details are undocumented
    and have been figured out through trial and reverse engineering.


    # Summary


    In this chapter you have read about the new features of Samba that should be implemented
    into Samba 2.1 by the time you have read this book. Samba 2.1 will include working
    PDC functionality allowing you to use Windows NT/2000 domain administration tools
    such as User Manager and Server Manager. These tools enable you to do a limited
    amount of administration, as well as creating trust relationships. Samba 2.1 should
    also provide support for including ACLs on Samba file shares. In addition, Samba
    should work with Windows 2000 systems as it does with earlier versions of Windows
    NT.


    You have also learned that Windows 2000 brings with it new functionality such
    as Kerberos authentication, Active Directory, and DFS support. These features
    will be implemented in the 3.0 release (or later) of Samba.'
  merge: -1
  pgno: 254
