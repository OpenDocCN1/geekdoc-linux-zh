  md: '# # Samba Help Resources


    Of course, there are many different places you can go if you are really stuck
    with a particular problem and you have tried all to fix it yourself.


    Samba mailing lists are also available. Yes, there is plural. Ten Samba lists
    are shown on the Samba Listproc Archives page. Go to http://www.samba.org and
    choose the mirror closest to you, click Archives in the top-left corner, and they
    are all listed there. You can search archives or just one list and also browse
    the lists. For most Samba problems, you would use the general Samba list, but
    if your problem is related to the NT Domain Controller functionality, you would
    probably want to use samba-ntdom.


    Many helpful resources are available from the main Samba home page. On the documentation
    link, there are a number of FAQs and other bits and pieces that also may contain
    a solution to your problem. Countless pages are available on the Net by people
    sharing their hints and tips on how they got Samba to work well for them.


    There are also newsgroups. If you have a newsreader, look at the comp.protocols.sm
    newsgroup where SMB servers are discussed, most often Samba. If you want to search
    the archives of this newsgroup, search your browser and point it to http://www.deja.com.
    Click Power Search for the keywords to your problem, for example: samba and "slow
    performance"


    Then in the following section,


    comp.protocols.sm


    You should get a list of results back, which hopefully contain relevant information!
    There are also organizations providing commercial Linux support these days. If
    you go to http://www.samba.org/samba/support/, there is a list of companies around
    the world sorted by country that can help you with your Samba problems. Also,
    Hewlett Packard has announced support of Samba on its line of HP9000 servers.
    Of course, Red Hat supports Samba on its Linux distribution, as do most of the
    major distributions provide Linux support.


    # # Summary


    In this chapter, you have learned some techniques to help debug any Samba problems
    that you may come across. Remember the number one tip—make sure that your network
    is operating correctly. Try some simple ping tests between the Windows machine
    and the Samba server. Also, check that you have WINS up correctly, or if you are
    using lmhosts files, check that the correct entries are in for the servers you
    need to access.


    You also learned about network sniffing and how you can use it to look at an entire
    SMB session. After using Network Monitor for a while (or another Network sniffer
    of your choice), you will get the feel of how SMB sessions are supposed to look,
    and hopefully be able to diagnose any problems you you are having yourself.'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'You also found out how to use Sambas debugging features. You can set debugging
    in the Samba configuration file, or set the debug level dynamically while Samba
    is running to fix those-on-the-fly problems.


    Finally, the last section of the chapter explained where to go for support. Most
    of your online Samba support will be through the Samba Web site at http://www.samba.org.
    There are archives of all the Samba mailing lists, as well as copious amounts
    of documentation. There is also list of commercial companies who support Samba,
    and these companies are listed on the Samba home page. You can also get a lot
    of help from the newsgroup comp.protocols.smb. Archives of this newsgroup are
    available at http://www.deja.com.


    # Review Questions


    +   1. I have a problem connecting my Windows NT 4.0 Workstation to my Samba server.
    What is wrong?


    +   2. How do you increase the debugging level of your Samba server on the fly
    without stopping and restarting smbd?


    +   3. How do you get support for Samba when you have run out of ideas of what
    could be wrong?'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# CHAPTER 13


    # SAMBA SECURITY


    You will learn about the following in this chapter:


    +   * What you should know about security

    * Security procedures to follow when setting up a Samba server

    * The differences between proactive security and reactive security

    * Where to go to get the latest security advisories for popular UNIX/Linux variants

    * Why you should use a firewall to partition your local network from the Internet


    T his chapter covers a topic that you as a system administrator should be concerned
    with, no matter what applications you run. The focus of this chapter is security
    in relation to your Samba server, or in fact any SMB server. The chapter gives
    hints on how to make sure your Samba installation is as secure as possible, while
    still providing the functionality required for users. After going through the
    reasons why security is important, the chapter covers two topics: proactive security
    and reactive security. There are some guidelines included on how to go about securing
    your Samba installation, toward the end of the chapter there is a section on where
    to go for more information on good security practices, including Web sites and
    books to read.


    # Why Is Security So Important?


    A security chapter has been included in this book for a very simple reason—nobody
    seems to care as much about security these days as they should! Time and again
    systems get broken because of poor systems administration practices. Because of
    the importance of security, it should be on your list of priorities as a system
    administrator to make it as hard as possible for the bad guys to get in. This
    chapter concentrates on good security practices you should follow if you have
    Samba servers in your network. Throughout the chapter, any references that are
    made to Samba can be used for other SMB servers such as Windows NT. Toward this
    chapter’s end is a section on “Other Resources” that gives you an idea where to
    find more information on this topic.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'Two major methodologies that you can keep in mind to keep your system secure
    are covered. The first is proactive security, the most overlooked aspect of security.
    Proactive security involves looking for problems and potential security issues
    before they actually arise. The second methodology is reactive security. This
    is when you are notified of a particular problem and are given the tools or patches
    to fix it, thereby reacting to a security issue.


    # Proactive Security


    Proactive security involves making your network infrastructure as secure as you
    possibly can using the tools you have available to you at the time. This (includes
    but not limited to):


    +   - Installing the latest patch levels of security patches for the operating
    system

    - Installing the most secure and stable version of Samba currently released (at
    the time of writing, this is 2.0.6)

    - Making sure you have a firewall at the perimeter of your network to stop the
    bad guys from trying to hack into your network

    - Making sure you have configured your operating system to run only the services
    that are actually needed

    - Configuring your Samba server to accept connections only from the machines it
    is supposed to be servicing


    Each of these tools is discussed in turn.


    # Get the Latest Patch Levels for Your Operating System


    Whatever operating system you are running, you should always make an effort to
    keep up to date with the latest security patches as they are released. All the
    major commercial UNIX vendors have security sections on their Web pages. Similarly,
    all the Linux vendors have security-related pages. Table 13.1 shows you where
    to find most of the popular security sites for major operating system releases.


    TABLE 13.1 A List of a Security Web Pages of the Various Popular UNIX Varians


    | Operating System | Web Page |

    | Sun Solaris | http://www.sun.com/security |

    | HP-UX | http://us-support.hp.com |

    | IBM AIX | http://www.ibm.com/servers/aix/support |

    | Red Hat Linux | http://www.redhat.com/corp/support/errata/ |

    | Caldera OpenLinux | http://www.calderasystems.com/support/security/ |

    | SuSE Linux | http://www.suse.de/support/security/ |'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Chapter 13 • SAMBA SECURITY 217


    If your operating system is not listed in Table 13.1, don''t worry. Just go to
    the vendor''s page and the security section will probably be emphasized. Most
    vendors provide security notifications by email. This information will be advertised
    on your vendor''s home page if they provide such a service. The major vendors
    (Sun, HP, IBM, and all the Linux vendors) offer these services.


    # Install the Latest Stable and Secure Version of Samba


    You should always make sure you are installing the most-to-date-production-quality
    version of Samba for two reasons. The first is that the latest production version
    is usually the most bug-free and stable. The second reason is that it usually
    has all the latest security patches applied, which makes it less likely that you
    will have any security-related problems. But don''t take this for granted! Follow
    the directions in the "Reactive Security" section of this chapter, and stay up
    to date!


    # Have an External Router That Filters the NetBIOS Ports


    Having an external router that filters the NetBIOS ports is an obvious precaution
    that many sites do not follow for some reason. There have been many denial of
    service (DoS) attacks in the past that have affected Windows hosts as well as
    Samba systems through the NetBIOS ports (137-139). A DoS attack happens when a
    cracker exploits a bug in an application that either causes the application to
    terminate, or to use huge amounts of resources, which prevents your system from
    protecting against. If you have unprotected SMB servers, it is easy for crackers
    to remotely find out about your servers that will allow people outside your network
    to connect to your file resources and either delete data or copy it and sell it
    to your competitors.


    So, at a minimum, you should protect your Windows and Samba hosts with some external
    router or some other port filtering that stops traffic destined for NetBIOS ports
    from hosts out on the Internet. This infrastructure is commonly referred to as
    a firewall. A sample firewall setup is depicted in Figure 13.1.


    The network diagram in the figure is a typical firewall infrastructure that many
    organizations use. First, this is a perimeter router, which is the first line
    of defense from the Internet. This router contains many access control lists (ACLs)
    that stop all unwanted traffic from entering the network at all. Connected to
    the perimeter router is a network segment commonly referred as a Demilitarized
    Zone (DMZ). In this area, Web servers, FTP servers, and other servers that will
    need to be accessed from the Internet are commonly placed. There are rules on
    the perimeter router to let the appropriate traffic through. Then at least one
    final router separates the DMZ from the internal network. This router also has
    ACLs that stop unwanted DMZ traffic from entering the organization''s internal
    network.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# FIGURE 13.1


    The internal network is being isolated from the Internet.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_233_0.png)


    The idea behind DMZ is that if an intruder finds a security problem that gives
    him full access to that network, he should not be able to get any further without
    getting through this second router. A cracker would have to get through both routers
    before he could access the internal network. Many companies have many levels of
    complexity than this, but the simple design in the figure demonstrates the principles
    of how a firewall is important to your company''s data security.


    Here''s another way of looking at it: Think of your organization''s computer network
    as your personal home, and your firewall as your deadlocked front door. You don''t
    leave your home with the door open all the time; if you did, chances are you would
    get robbed! It is the same with your network.


    Some sites even filter Windows servers from other parts of the corporate network,
    perhaps between divisions of the same company if other areas are considered untrustworthy.
    This is commonly the case when two companies merge or there is a takeover. In
    the early stages of this process, when upper management directs that the computer
    networks should merge, the different IT departments might not trust each other,
    so they put up their own internal walls. Yes, this happens!


    # Run Only the Services That You Require


    A simple rule of thumb to follow is to run only the services that you require.
    If your Samba server is used purely for file and print resource sharing, you should
    only be running the Samba daemons smbd and nmbd and not much else. This serves
    two purposes. Your server is not doing tasks that would be taking resources away
    from the Samba server, and so, there are fewer entry points for a would-be intruder
    to break into your system. Make sure your Samba server is not running services
    such as your intranet, performing mail hub duties, running an NNTP server, or
    other tasks. As you are probably aware, there are always new security bugs in
    sendmail, for example. The fewer services you run, the better.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Implementing Security Measures on Your Samba Server


    You can minimize the incidence of unauthorized users connecting or attempting
    to connect to your Samba server by following some simple techniques in building
    your Samba configuration file, smb.conf. This section covers the use of the hosts
    allow and hosts deny options which you can reduce the exposure of your Samba server
    to unauthorized networks by making sure that guest access is disabled, removing
    anonymous access to your Samba server, and turning on encrypted passwords.


    # hosts allow/hosts deny


    You should use the hosts allow parameter to restrict which hosts can connect to
    your Samba server. You can do this as a global setting that is used for all file
    services, or on a per file basis. If you use the latter method, you can restrict
    access to particular file services on a per IP address basis. In a secure environment,
    this may be what you want. The use of this parameter is best shown with an example:


    ```

    hosts allow = 192.168.,

    ```


    This allows access for all hosts in the 192.168.*. network, and all hosts in the
    10.10.*. network to access the Samba server. Note that the trailing dots are important.
    They signify to Samba that you are specifying the network address of a subnet.
    Another way of saying the same thing is to use the IP address/subnet mask format:


    ```

    hosts allow = 192.168.0.0/255.255.0.0,10.10.0.0/255.255.0.0

    ```


    You can also include exceptions. You can do either this as part of the hosts allow
    statement:


    ```

    hosts allow = 192.168.,10.10. EXCEPT 10.10.3.4

    ```


    Or as part of a hosts deny statement:


    ```

    hosts deny = 10.10.3.4

    ```


    In this case you are allowing everyone in those named networks, except the host
    10.10.3.4, to access the Samba server. You can use any mix of hosts allow and
    hosts deny that you like, and remember that you can use them either as global
    parameters, or on a per file service basis.


    # Guest Access


    Windows NT systems have a guest account, which is disabled by default. Samba also
    has a guest account where the default is to disabled. When a user connects as
    a guest, the SMB connection ignores any username or password specified. This should
    make it obvious to you you generally don''t want this. It makes auditing who accessed
    the system almost impossible!


    Make sure guest ok is set to no. It may be mentioned in some fileservice definitions
    for some reason. If it is not needed, remove it. Another option to look out is
    guest only. When set, this option means that you can only connect to a particular
    service as a guest rather than a normal user.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Anonymous Access


    Sometimes in a Windows environment, machines access an SMB server without a username
    to get certain information such as userlists or sharelists. This is called an
    anonymous connection. If you have a Windows NT machine handy and it is logging
    security messages, scroll through them. You will almost certainly see some messages
    logged by the username ANONYMOUS. In a purely NT environment there is no reason
    why you should let an anonymous process connect. All users have a domain account
    anyway and can be authenticated with additional information about the domain required.
    Like Windows NT, you can turn off anonymous access to your Samba server with the
    restrict anonymous parameter. By default, this is switched to false because it
    could cause communications to fail when Samba interoperates with NT servers. If
    you are only running Windows NT and Samba, you can safely switch this to true.
    If you find that you cannot log on properly if you log out and log in the domain
    again from a Windows NT workstation, If you find this happening, choose to restart
    your machine and then log in rather than just logging out.


    # Encrypted Passwords


    A topic that was discussed in Chapter 5, "Integrating Samba into a Windows Network,"
    is encrypted passwords. Remember that the default behavior of Samba is to use
    cleartext passwords in the authentication process. Chapter 5 showed how simple
    it was to use encrypted passwords, which will make it harder for a-be intruder
    to find out your users'' passwords. If you are unsure about turning encrypted
    passwords on, reread the section "Samba and Encrypted Passwords" in Chapter 5.


    # Reactive Security


    When a security bug is found in a product or operating system, it is either fully
    published on mailing lists, or an overview of the problem is published with information
    on where to get the bug fix, or patch. Reactive security, as the name implies,
    means that a system administrator makes changes to a system configuration or applies
    patches to an operating system or software package to repair a security vulnerability
    (usually because it was found and reported on one of the many mailing lists for
    this purpose). This section gives you information on where to get reactive information
    not just on Samba issues but other security problems as well.


    # Samba Announcement Mailing List


    The Samba Announcement mailing list is the mailing list you should be subscribed
    to to get information on new releases of Samba, security patches for any Samba
    security problems as they arise (not very often), and any other announcements
    that are seen as important to the general Samba community. You subscribe by sending
    a message to majordomo@samba.org with no subject, and in the message body including
    your email address. Here''s an example of how to do this easily on a UNIX host:


    ```

    $ echo ''subscribe samba-announce matt@foo.com'' | mail majordomo@samba.org

    ```'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'Of course, replace my email address with yours. Soon after, you should get
    the mailing list introduction that tells you certain important things like how
    to unsubscribe if you don''t want to be on any list more.


    # CERT


    Numerous Computer Emergency Response Teams (CERTs) around the world specialize
    in collating information about system break-ins, new security holes in both operating
    systems and software, and related topics. The CERT home page is at http://www.cert.org.
    CERT has sister organizations around the world; for example, in Australia it is
    called USCert. CERT organizations are members of the Forum of Incident Response
    and Security Teams (FIRST). All CERT organizations have a mailing list where security
    tips and vulnerabilities are posted. Some of these lists are free and some, as
    USCert, require a fee. The fee is required because some countries CERT organizations
    receive little government funding and need subscription costs to keep them running.
    If you are responsible for looking computer systems, you should be a member of
    the appropriate organization in your country to be up to date on what is considered
    a threat in your area of the world. If you are based in the United States, the
    U.S.-base CERT is free and you can subscribe to their alert mailing list by sending
    a mail message to their list server:


    ```

    $ subscribe matt@foo.com | mail cert-advisory-request@cert.org

    ```


    # Security-Related Linux Mailing Lists


    If you are running Samba, chances are you running Linux. If you are, as a matter
    of course you should be subscribed to the announcement mailing list for your particular
    Linux distribution. For Red Hat you could use this:


    ```

    $ echo "subscribe matt@foo.com" | mail suse-security-announce@suse.com

    hat-announce-list-request@redhat.com

    ```


    For SuSE:


    ```

    $ echo "subscribe slackware-security matt@foo.com" | mail

    majordomo@slack.com

    ```


    For Slack:


    ```

    $ echo "subscribe slackware-security matt@foo.com" | mail

    majordomo@slack.com

    ```


    If your distribution was not mentioned, the distribution vendor is to have a similar
    service, which should be documented on the vendor''s home page.


    # BugTraq and NTBugTraq Mailing Lists


    BugTraq is a moderated list where security exploits for just any operating system
    or software package are posted. NTBugTraq is also a moderated bug mailing list;
    however, the focus here is on Windows-based systems. For both lists, the policy
    is generally full disclosure, so you get to see step by step how to exploit various
    security-related bugs. This should highlight how easy it is for someone to break
    into your system when a new security bug is'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'found—so it should make you aware of how important it is to repair any security
    holes as they are found. Subscription details and archives of the BugTraq list
    can be found at http://www.securityfocus.org. For NTBugTraq, go to http://www.ntbugtraq.com.


    # Other Resources


    Many security-related resources are available. Go to the UNIX or Security section
    in your local bookstore and you will find many good titles on the topic of system
    security.


    Numerous sites on the Internet offer all sorts of useful information. The main
    one you should go to is the BugTraq mailing list where you can get an idea of
    the number of security problems that arise each week! Go to http://www.securityfocus.com
    and click Forums, BugTraq, then Archive, and a list of most recent postings should
    appear.


    Marcus Narayan maintains the Internet FAQ at http://www.clark.net/pub/mjr/pubs/fwaq/.
    There is also the ever-popular firewall toolkit available at http://www.fwtk.org.
    The FTWK is probably the best and most comprehensive firewall solution today.


    These are just a few of the best and most useful resources. Open up your Web browser
    and search if you are hungry for more security-related information.


    # Samba


    In this chapter you learned about security, and more importantly, how it affects
    you if you run Samba servers. Remember that security is not "someone''s problem."
    If you are responsible for any servers, especially when running SMB services like
    Samba, you should tighten the security as much as you can.


    This security tightening should include a firewall between the Internet and your
    local area network. This works by avoiding the cracker from trying to export your
    internal systems. SMB servers are a favorite target, so you need to be extra careful
    that they are protected.


    You learned the differences between proactive and reactive security. Proactive
    security includes all your groundwork of getting the server up, updating it with
    latest patches, and installing the services for your users, in this case Samba.
    You should also make sure that Samba is up to date with security patches applied.
    Reactive security, as the name implies, means reacting to a particular security
    problem. A security alert could be released that requires you to upgrade Samba
    to a newer version if a bug is found that an attacker root privilege, for example.


    You will learn about new security alerts when you are subscribed to the appropriate
    mailing lists. You should be subscribed to samba-announce, where new versions
    of Samba are announced, and also to the security alerts list for your particular
    operating system. Subscription addresses for the common alerts lists were given.'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'Finally, some resources providing more information on security and securing
    your systems were discussed. Go to your local bookstore to find books on the topic
    of system security. There are also some good Web sites out there that have plenty
    of good security information.


    # Review Questions


    +   1. Why is it important to have a firewall at the boundary between your company
    and the Internet?


    +   2. If you have some important and highly confidential data on a particular
    Samba server in your organization, how could you go about protecting it?


    +   3. What is the difference between reactive security and proactive security?'
