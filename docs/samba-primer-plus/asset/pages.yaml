    Note that with these levels you get variable values, which helps the developers
    debugging the problem to find out exactly what is going.


    A nifty feature is that you can temporarily change the debug level of the Samba
    session by sending it a UNIX signal. Namely each SIGUSR1 increases the debug level,
    and the level SIGUSR2 decreases the debug level.


    Here''s an example to increase the debug level by two of the Samba server:


    ```

    # ps auxw | grep smbd

    root 25087 0.0 1.8 2184 856 ? S Dec 3 0:00 smbd

    # kill -USR1 25087

    # kill -USR2 25087

    ```


    Then you can leave it at this debug level as long as you like, perhaps while you
    try to replicate a problem. Then you can decrease the debug level to what it was
    before:


    ```

    # kill -USR1 25087

    # kill -USR2 25087

    ```


    Use the Samba logging function, It can tell you a few things, which may in fact
    solve your problem!'
