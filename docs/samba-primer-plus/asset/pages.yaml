- img_proc: true
  md: '# Samba’s Role in a Windows 9x Network


    Samba provides a number of features that are important or useful in a network
    of Samba 9x clients, other than the usual file-sharing services:


    +   - Domain authentication for users as they log in, identical in functionality
    to the Windows NT domain controller

    - Support for login scripts

    - Support for user home directories

    - Support for roaming profiles

    - Support for Windows 95/98 policies


    The first feature effectively emulates a Windows NT Domain Controller for Windows
    9x clients. It means that you have all the valid users for your site defined on
    the Samba server, and all your Windows clients are configured to use the name
    of your Samba workgroup as the user authentication domain.


    The second feature is support for the batch files that are configured to run when
    users log in. These batch files are called login scripts. They can be defined
    on a per-user basis, or by using a common script for everyone.


    There is also support for the special Windows 9x directive `net use <drive>: /home/`,
    which automatically maps a drive to the currently authenticated user.


    The next feature is support for roaming profiles. An environment is created each
    time a user logs in to a Windows 9x system for the first time. As users change
    settings, these are remembered the next time they log in. This environment is
    called a “user profile,” and normally each user has an individual profile. The
    term “normally” is used here because there are occasions when mandatory user profiles
    are in place by administrators if they want settings each time a user logs in,
    as would be required for a shared account that is used by many people. A “roaming
    profile” is a simple extension that allows users to have the same profile on whatever
    machine they log in to the network. For this occur, when a user logs out of a
    Windows client, the profile must be saved back to a central server, rather than
    the Windows client user was working on.


    System administrators can put restrictions on what users can do to their Windows
    9x machines. These restrictions can include things like not allowing access to
    the registry, allowing only approved software to be executed, disabling access
    to the network settings, and so on. These restrictions are usually enabled in
    the registry using a tool called the System Policy Editor. This policy editor
    creates a file called `config.pol`, which is placed on a read-only share on a
    server. When a user logs in to the Windows client and this `config.pol` file is
    detected, the registry settings in this file are applied to the Windows system
    and the user is restricted to do only what the system administrator has allowed
    him to do.'
  merge: -1
