  md: '# Chapter 3 • BASIC SAMBA CONFIGURATION


    # FIGURE 3.5


    The Shares view when creating a new share.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_52_0.png)


    The most important part of this screen is where you define the directory path
    you want to make available using the sharename you defined. When you are creating
    the new share, you click Commit Changes to save all your modifications!


    Again, here are some steps to follow, so you can see how easy it is to set up
    your own Samba server:


    +   - Click in the text box and type `tmp`.

    - Click Create Share.

    - In the comment field, enter the following text: `This is a share for temporary
    files`.

    - At the read-only variable, select No. If you leave it at Yes, no one will be
    able to write anything to the share.

    - Finally, click the Commit Changes button to write your changes to the Samba
    configuration file.


    # Printers


    The Printers button is very similar to the Shares view, which is not really very
    surprising because they perform similar functions. Here are some simple steps
    to follow to set up access to a printer from your Samba server:


    +   - Click in the text box and type the name of your printer, for example `hplj4`.

    - Click Create Printer.'
