  md: '# Summary


    You have learned some useful tips and techniques for looking at Samba performance
    in this chapter.


    The chapter first took you through choosing a server that should give you adequate
    performance. Remember to purchase the most high-end machine you can afford. When
    installing the operating system, try to put all your Samba partitions on disks
    other than your operating system disk, and for those who can afford it, stripe
    your data partition with either RAID 0 (for speed writing and reading) or RAID
    5 (for read speed and redundancy).


    You should always do some checks to make that Samba is actually your bottleneck.
    Other areas to look at include checking the operating system for problems—some
    runaway processes might be causing your problem. Check for higher than normal
    utilization, and make your hardware is not the problem.


    The chapter also explained Samba configuration parameters that may improve performance
    (or indeed reduce performance!). Remember that there is no one way to make Samba
    perform faster. It depends quite heavily on each individual environment, especially
    what hardware is running and what sort of data you are sharing out with Samba.


    Finally, the chapter looked at client-side tuning. Many Samba problems are in
    fact not Samba issues but problems with the client setup. If you are getting slow
    performance and you rule Samba out as best you can, you should then look at your
    client, perhaps as a first step reinstalling the TCP/IP protocol and seeing whether
    that makes a difference.


    # Review Questions


    +   1. You are buying a system for a small company to run Linux and Samba on.
    What could be a possible configuration for the server given that the company has
    about 20 employees?

    2. Your users are complaining about Samba being too slow. What should you do?

    3. What are opportunistic locks and why are they useful?

    4. How do Level II oplocks differ from normal oplocks?'
  merge: -1
