  md: '# 100 SAMBA PRIMER PLUS


    use for everything. So, after this password is recovered, it will more than likely
    get the cracker

    into other accounts the user holds, including Internet access accounts with the
    local ISP!


    Luckily there is a better way, as shown in Figure 6.2.


    # FIGURE 6.2

    A Windows 95/98 client

    participating in a

    Windows NT domain.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_115_0.png)


    With the Windows NT domain model, all valid accounts in the domain are defined
    on the primary domain controller (PDC), which is replicated to all backup domain
    controllers (BDCs). In simple terms, when a Windows client is a member of the
    domain and it needs to authenticate a user to a particular domain, it first has
    to choose a domain controller to which to authenticate. This is done by requesting
    authentication to an NT server, or a Samba server that has registered the domain
    NetBIOS resource type <16>, which indicates that it provides domain controller
    services (see Chapter 4, "Windows NT Networks"). The Windows client then encrypts
    a challenge that is sent to it the selected Domain Controller using the username/password
    combination that the user initially entered, and sends this encrypted string to
    the Domain Controller. The Domain Controller also encrypts the challenge with
    what it knows as the password. The Domain Controller next compares these encrypted
    strings, and if they are the same, the password, the Domain Controller responds
    by providing access to the domain; if they are different, the Domain Controller
    denies the user access to the domain.'
