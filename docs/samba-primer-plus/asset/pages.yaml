  md: '# CHAPTER 4


    # UNDERSTANDING WINDOWS NT

    NETWORKS


    You will learn about the following in this chapter:


    +   - An introduction to what Windows NT offers and what is implemented in Samba

    - The differences between domains and workgroups

    - The differences between share-level and user-security


    +   - The different services that NetBIOS provides

    - How browsing works in a Windows network

    - The different roles that a Windows NT server can perform, and which of those
    roles Samba do


    If you are serious about implementing Samba in your corporate network from scratch,
    or integrating Samba with your current Windows NT/2000 servers, this chapter is
    required reading. You will learn the concepts behind Windows NT/2000 networks,
    why NT is so popular, and why it''s such a big task for the developers of Samba
    to implement all Windows NT/2000 functions. To be able to use specific features
    of Samba properly, you need to know how the various components of Windows networking
    hangs together. If you already know the basics of Windows NT networking, you can
    skip ahead to the next chapter, which will teach you how to implement these concepts
    in your Samba server, otherwise, read on!


    The purpose of this chapter is to teach you relevant Windows networking technologies,
    which you will need to know for later when you are implementing your Samba servers.
    You will need to know about all these things so you can design your Samba infrastructure
    the best way that you can, making use of any available Windows NT systems and
    being able to link them with your Samba systems.'
