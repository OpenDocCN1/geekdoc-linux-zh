    problems. Get in the habit of checking that information when you see it to make
    sure it is correct. It will save you heartache if you go—otherwise, you could
    spend hours debugging problems that are simply network configuration problems.
    I will be discussing some of the most useful arguments in this help screen later
    in the chapter.


    The following sections first go through an example of an smclient session, and
    then go through some of the most useful options available to you using smclient.


    # An Example of an smclient Session


    Suppose that the UNIX machine running smclient is called GOODY, and the Windows
