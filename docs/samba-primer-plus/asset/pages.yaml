    to know this information for troubleshooting Windows 9x and Windows NT login problems,
    you should have any. Any background information always helps when troubleshooting
    most types of problems, especially Samba-related ones.


    +   1. The user enters his login credentials on a Windows NT or Windows 95/98
    client.

    2. The secure NT login process.

    3. A connection to the share \ntdc\netlogin is established during the login process
    (ntdc is the domain controller authenticating the user during this particular
    login process).

    4. If the user has a roaming profile defined, it is pulled down from the server
    and applied.

    5. If a login script is defined, it is executed (login scripts are located on
    the \ntdc\login share).

    6. The user''s initial Explorer process is started.


    Both the user login scripts and roaming user profiles are set on a per-user basis
    in User Manager for Domains. If you are using Samba, roaming user profiles are
    set globally which is easier to administer, you will find out in Chapters 6 and
    7.


    For more detailed information on the secure login process, see

    ://support.microsoft.com/support/kb/articles/Q139/6/08.asp.


    # Summary


    This chapter started going over the main features of Windows NT and why people
    are moving away from NT to UNIX/Linux-based solutions with Samba instead. That
    discussion was followed by a clarification of how workgroups and domains are.
    A workgroup''s purpose was to separate network resources in an orderly fashion
    for easy browsing. A domain extends the workgroup concept by adding security so
    that not anyone can connect to the network and start accessing resources. Users
    must be authenticated and have the correct access permissions before they can
    access resources in a Windows NT domain. This discussion also showed the differences
    between secure-level security and user-level security.


    The chapter described the NetBIOS session layer, and that it is transport-protocol-independent.
    It also discussed why NetBIOS is so important in Windows networks-virtually all
    Microsoft-provided network applications are written with NetBIOS compatibility.
    The discussion then went through how computer browsing works and how the browse
    list generated when you are searching the network for a particular resource. Finally,
    the main functions of a Windows NT server were explained, and how that compares
    to Samba provides. Samba provides almost everything except for BDC functionality.'
