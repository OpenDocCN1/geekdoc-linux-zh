  md: '# GLOSSARY


    Access Control Entry—Each ACL is made up of access control entries that control
    who has access to the particular file system resource (file or directory).


    Access Control List—A list of ACEs that control who has access to file system
    resources.


    ACE—See Access Control Entry.


    Asymmetric Cryptosystems—Public key cryptography.


    Backup Domain Controller—A specific type of Windows NT server that contains a
    backup of the accounts database that lives on the primary domain controller.


    BDC—See Backup Domain Controller.


    CA—See Certification Authority.


    Certificate Signing Request—A file containing an organization’s public key that
    is sent to the CA for signing and is turned into an X.509 certificate.


    Certification Authority—A trusted entity that signs certificates so they can be
    used in authentication.


    Challenge/Response Authentication—The method of authentication used by Samba and
    Windows NT servers.


    CIFS—See Common Internet File System.


    Ciphertext—Text that has been encrypted.


    Client-Side Certificate—An X.509 certificate that is used for authentication of
    a client.


    Common Internet File System—A revised version of the SMB protocol.


    Daemon—A process (sometimes called a server process) that listens on a particular
    TCP/IP port and services requests to do a specific task.


    Denial of Service Attack—Occurs when someone on a network consumes the server’s
    resources in such a way that it affects the server’s intended purpose.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# SAMBA PRIMER PLUS


    DHCP—See Dynamic Host Configuration Protocol.


    Digital Signature—A unique sequence, or hash, of characters that uniquely identifies
    a piece of text.


    Distinguished Name—Tree-like unique identification of an object.


    DN—See Distinguished Name.


    Dynamic Host Configuration Protocol—A protocol that allows a computer to get its
    TCP/IP configuration from a DHCP server.


    File Transfer Protocol—A method of block-by-block transfer of files between two
    machines on the Internet.


    Firewall—An infrastructure that is used to separate an organization’s internal
    network from the Internet. Its purpose is to stop crackers from breaking into
    systems they should not be accessing.


    FTP—See File Transfer Protocol.


    Interprocess Communication—A method of communication that processes can use to
    communicate with each other.


    IPC—See interprocess communication.


    LAN Manager—The name given to the Microsoft implementation of the SMB/CIFS protocol.


    LANMAN—See LAN Manager.


    Login Scripts—Batch files that are executed when a user logs into a system.


    Name Mangling—A method of shortening filenames so that older versions of Windows
    and DOS that use only filenames in 8.3 format can use the filename.


    NetBIOS—See Network Basic Input and Output System.


    Network Basic Input and Output System—A programming API that is used extensively
    with the SMB; it is now optional with CIFS.


    nmbd—The Samba daemon implements the NetBIOS API.


    PDC—See Primary Domain Controller.


    Primary Domain Controller—Contains the System Account Manager or master user database
    in a Windows NT domain. This is replicated to all the BDCs for backup and fallback
    purposes.


    Public Key Cryptography—Unlike conventional cryptography, in which encryption
    and decryption is done using a single key, this method allows encryption to occur
    using a well-known public key, and the resulting decryption to occur using a private
    key.


    Remote Procedure Call—A piece of code contained on one machine (A) but whose procedure,
    is called by another machine (B). Execution of the code occurs on A.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'RPC—See Remote Procedure Call.


    rpcclient—A program included in the Samba distribution that allows testing of
    the various RPC interfaces on a Windows NT/2000 server.


    SAM—See System Account Manager.


    Server Message Block—The file-sharing protocol used by Microsoft LAN Manager systems
    and Samba.


    Server-Side Certificate—An X.509 certificate that is used for authentication of
    a server.


    Share-Level Security—A form of security in which access to a resource on an SMB
    server is restricted by two different passwords: for read access, and one for
    write.


    SMB—See Server Message Block.


    smclient—A program included with the Samba distribution that allows connection
    to SMB/CIFS resources from the UNIX platform.


    smbd—The Samba daemon that implements the SMB/CIFS protocol.


    Symmetric Cryptosystems—Single shared key cryptography.


    System Account Manager—The main account database that contains all the user/group/machine
    accounts for a Windows NT domain. It is stored on a PDC.


    System Policy Editor—A Microsoft-provided utility used to set system policies
    on client computers. The policy file is read during the logon process from a share
    that is available on all domain controllers.


    User-Level Security—Access to resources on an SMB server that must be authenticated
    using a valid username/password pair.


    Windows Domain—A method of centralized and secure Windows management. Consists
    of one PDC and one or more BDCs.


    Windows Internet Name Service—A central database of IP addresses and NetBIOS naming
    mappings.


    Windows Workgroup—An decentralized method of resource sharing.


    WINS—See Windows Internet Name Service.


    X.509 Certificates—These contain a public key of an organization, as well as a
    signature to prove that the public key actually belongs to the given organization.'
