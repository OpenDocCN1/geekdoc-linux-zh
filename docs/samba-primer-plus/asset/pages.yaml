  md: '# Getting Windows to Talk to Samba


    The reason you want to run Samba in the first place is so you can get your Windows
    clients to talk to it so your users can store all their files on their more reliable
    UNIX servers rather than using a Windows NT server. After all, this Samba Premier
    Plus is all about! To achieve this, you will need to configure all your Windows
    9x and NT clients to talk to the network if you haven''t already. Most likely
    will already be configured for network access, as this is usually done during
    the initial installation. This section provides the background you need to be
    able to configure Windows 9x and Windows clients so they are able to talk to the
    network if they can''t, or alternatively if they already have the appropriate
    network configurations, then use the example screens in this section to help you
    determine if your clients are configured correctly. Note that this section talks
    about Windows 98; however, in most cases a Windows 95 configuration will be similar.


    # Configuring a Windows 98 Client


    Configuring Windows 98 to talk with Samba is a relatively easy matter. Before
    you can do anything, you need to make sure that you have a working network configuration.
    If you are unsure as to how to do, this section goes over the steps to achieve
    this with you.


    First, right-click Network Neighborhood, and select Properties. If your network
    is configured, you will get a display like that in Figure 3.10.


    FIGURE 3.10


    A fully network-ready Windows 98 client.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_58_0.png)'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'If this is the case, you probably already have a configured network client—skip
    down to the section "Connecting to Your First Share on Your Samba Server."


    Otherwise, follow these easy steps:


    +   1. Click Add.


    +   2. Select Network Component Type, choose Adapter (notice that the icon next
    to it looks like a network card), and then click Add.


    +   3. The adapters are sorted by vendor, so it should be easy to find the correct
    driver for your card. When you find it, click OK. An example of this appears in
    Figure 3.11.


    # Figure 3.11

    Selecting the correct network adapter.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_59_0.png)


    The system will automatically add the TCP/IP protocol, which will be bound to
    the adapter you just added. You now need to configure this protocol by clicking
    Properties.


    Notice that you have a choice between using the Dynamic Host Configuration Protocol
    (DHCP) to get your IP address, or manually configuring it. Choose what is appropriate
    in your situation. An example is shown in Figure 3.12.


    Click the Gateway tab, and enter the IP address of your closest gateway. This
    is usually a router if you are doing this on your corporate network. If you are
    at home, unless you have a multisubnet network, it is safe to leave this blank.
    After you have entered the gateway address as applicable, click the Add button.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# FIGURE 3.12

    Configuring TCP/IP

    under Windows 98.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_60_0.png)


    Click the DNS tab. Enter the name of a DNS server on your network if you have
    one, and then click Add.


    Click OK and then OK again. If your network adapter needs manual configuring,
    a screen now pops up asking you to enter the required details, unless you need
    an IRQ and I/O Port address.


    Finally, as most major configuration changes in Windows, you must restart your
    PC for the changes to make effect.


    When Windows 98 finishes rebooting, you should get a login screen. Enter any username
    and password. If it is the first time you have used that username, you will be
    asked to confirm your password. After you have done that, you should be logged
    in to the familiar Windows 98 GUI.


    You should now be ready to make your first client connection to your Samba server.
    Feel free to skip down to the section "Connecting to Your First Share on Your
    Samba Server" if you do not have any Windows NT clients to configure.


    # Configuring a Windows NT Client


    Windows NT is quite a different beast from Windows 98. They may look the same,
    but under the covers, so to speak, they are completely different. Windows NT is
    a fully multitasking operating system, but Windows 98 is still based on the old
    DOS code, and not as reliable as Windows NT. Configuring Windows NT to the network
    is, as you may expect, quite different from configuring Windows 98. First, to
    check whether you have network connectivity already, right-click Network Neighborhood,
    select Properties, and choose Protocols. If the'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'display looks like that in Figure 3.13, there is a good chance you already
    have a working connection, and you should jump directly to the section "Connecting
    to Your First Share on Your Samba Server."


    # FIGURE 3.13


    A fully network-ready Windows NT client.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_61_0.png)


    Otherwise, follow the process described next to configure your Windows NT Workstation
    or Server (both can follow the same procedure) for network access.


    +   - Click the Adapters tab, and choose Add.


