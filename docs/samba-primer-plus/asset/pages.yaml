    In the past, administrators had a number of options for accessing Windows file
    systems from UNIX systems.


    The first option was to use the ftp command from UNIX to Windows NT to retrieve
    files and puts. This is messy and time-consuming, primarily because it requires
    effort to start the ftp command, enter a valid username and password, to change
    the directory, and retrieve or store the required files.


    The next option was to install a Network File System (NFS) server product on the
    Windows server, which allowed any UNIX machine to mount the Windows file system
    using NFS. That''s okay for the UNIX systems because they have NFS installed as
    part of the operating system. But Windows NT does not come with NFS products—they
    must be purchased, and costs money. At least with NFS, however, you can mount
    the Windows file system and write to it in real time; that is an advantage over
    the ftp method, in which files must be retrieved and stored individually.


    A third option was to use the smclient utility that comes as part of the Samba
    distribution. Again, this is similar to the ftp option described initially. You
    need to enter your password to access the resources, and you need to keep retrieving
    and storing files all the time, which isn''t very practical for day-to-day work.


    smbfs, as described in this, provides a method to access your Windows file system
    via an SMB share. The connection to your Windows server appears in the UNIX file
    system under a directory tree structure that you can access interactively just
    like any other UNIX file or directory. It is almost as easy as mounting an NFS
    exported directory, without requiring the extra NFS server software at the other
    end.


    # LinPopUp


    You are probably familiar with the programs WinPopUp in Windows 9x and Windows
    Messenger in Windows NT/2000. You can send messages with these utilities to particular
    usernames or computers on on network. An example of this was given in Chapter
    8, "Using smclient," utilizing the smclient utility and its -M option. A third-party
    application is now available that is a wrapper around smclient and acts just like
    the WinPopUp program, which does on a Linux system in the Windows environment.
    Currently the source is designed for Linux, but it may work on other UNIX variants.


    You can download the binary distribution of LinPopUp from ftp://ftp.samba.org/pub/samba/contributed/LinPopUp-0.9.1.bin.tgz.
    There is a source distribution as well (LinPopUp-0.9.1.src.tgz). After you have
    downloaded LinPopUp and expanded the tarfile, you will be left with a few documentation
    files and the executable LinPopUp. It is recommended that you install'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'the executable to /usr/local/bin. There is one change you need to make to your
    Samba configuration that it can execute LinPopUp when it receives a message. Open
    up sm.conf and add this line:


    message command = /usr/local/bin/LinPopUp "%f" "%m" %s; rm %s


    All this does tells Samba to execute LinPopUp when it receives an SMB datagram
    with a Windows message inside it. You can send a message from your Windows 9x
    machine by running the program WinPopUp. Or, if you are running Windows NT/2000,
    you can drop to an MS-DOS prompt and type a command like this:


    ```

    C:\net send computer "Message"

    ```


