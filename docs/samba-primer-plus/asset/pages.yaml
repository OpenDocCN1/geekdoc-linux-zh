  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT 127


    # FIGURE 7.13


    Samba produces an error when attempting to add a new Access Control Entry to an
    ACL.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_142_0.png)


    If you click the Remove button for a particular ACE, the ACE will disappear from
    the list. In fact, Samba removes all file permissions on the UNIX side, and on
    the Windows NT side, permission “O” signifies that No Access is available to that
    file. Of course the change occurs only to the particular class of user that was
    removed, it is world, group, or user permission. If you come back after clicking
    OK and looks at the permissions after you have removed an ACE, the ACE will appear
    with the Special Access (O) permission. This is illustrated in Figure 7.14. This
    is so that you can add back permissions later if you need to because you cannot
    add a new ACE with the Add button.


    # FIGURE 7.14


    The group matt now has no access.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_142_1.png)


    # Modifying Directory Permissions


    Directory permissions works in a similar manner to File permissions, but they
    are different in that each ACE has two sets of permissions. Consider Figure 7.15.


    # FIGURE 7.15


    The directory permissions on a Samba share.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_142_2.png)'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'There are all three ACEs, one for user, group, and world sets of permissions,
    but there are two sets of permissions for each. Why the first is the set of permissions
    for the directory itself, and the second is called the inherited permissions.
    Each file created in a sub-directory has its default permission to the inherited
    permission of its parent directory.


    In the figure, the directory that''s being used is called papers. The local group
    matt (second ACE) has actual permissions of RWX, but the inherited permission
    is R. So any file created under this directory, papers, is created with the R
    permission set for the local group matt. Because there is no such thing as inherited
    permissions in UNIX, Samba fakes it by showing permissions a file would have if
    it was created in that directory.


    If you decide to change the permissions for a directory, by default the file permissions
    (inherited permissions) are applied to all files in the directory below. If you
    do not want this, be sure to check the box Replace Permissions on Existing Files
    before you click OK.


    Also, you can apply all your changes down a whole directory tree by checking the
    Replace Permissions on Subdirectories box.


    # Controlling the Changing of File and Directory Permissions Within smb.conf


    You can control how permissions are applied to files and directories by using
    configuration directives in your smb.conf file. There are two sets of parameters.
    The first set controls permissions new files and directories receive, and the
    other set controls what permissions of the ACEs in the Windows security dialog
    user can modify when they change the file permissions. The values for all the
    parameters are specified in octal format, which is what the chmod and umask UNIX
    commands use.


    The four parameters that control what permissions a file and directory receive
    when they are created for the first time


    +   - create mask

    - force create mode

    - directory mask

    - force directory mode


    The parameters create mask and force create mode are applied on newly created
    files. The default value for create mask is 0744, which maps to the UNIX permissions:


    ```

    -rwxr-xr-x

    ```


    The default value for force create mode is 0. When a new file is created, Samba
    first maps any DOS attributes to UNIX equivalent permissions. As an example, if
    the DOS attribute read-only is set, the user write bit is not set (effectively
    making the file read-only for the user). After the DOS-UNIX mapping, the resultant
    UNIX permission is bitwise ANDed with the value of create mask. This effectively
    means any bits that are not set in create mask are removed'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT 129


    from the UNIX permission at this stage. Finally, the permission that Samba is
    now left with is ORed with the force create mode parameter. This allows the administrator
    to force certain bits to be on the final UNIX file permission. This is especially
    handy in shared group Samba resources. In that case, you would want the group
    permission to be rw-, allow other members of the group to access and modify the
    file. To do so, you would set force create mode to be 060.


    The other parameters, directory mask and force directory mode, work exactly the
    same as create mask and force create mode, but for directories rather than files.
    The default directory mask is 0755, which maps to the UNIX permissions:


    +   - rwxr-xr-x


    And the default for force directory mode is 0, which means no extra permissions
    are forced to be on.


    The other four parameters that control ACEs a user can change


    +   - security mask


    +   - force security mode


    +   - directory security mask


    +   - directory security mode


    These work in the same manner as the four parameters described, but their purpose
    is slightly different. They were added to allow support for changing of the ACE
    entries in the NT security dialog and how that relates to UNIX permissions. The
    first two, security mask and force security mode, have default values of create
    mask and force create mode respectively. With security mask, when a user changes
    an ACE in the security dialog, any bits not set, or zero bits, are the bits not
    allowed to modify. To achieve this, the security mask parameter is ANDed with
    the changed bits, which are then ORed with force security mode parameter. This
    means that any permission bits set to be in force security mode are set to be
    in the final ACE after the user clicks OK. By default, force security mode is
    set to 0, which means no additional permissions are added.


    directory security mask and force directory security mode are similar, but apply
    to directories rather than files.


    If you want your users to have full control in setting their permissions and you
    don''t want any particular bits to be set on, set the security parameters to these
    values:


    ```

    security mode = 0777

    force security mode = 0

    directory security mask = 0777

    force directory security mode = 0

    ```'
  merge: -1
