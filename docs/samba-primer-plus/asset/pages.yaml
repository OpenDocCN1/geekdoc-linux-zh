- img_proc: true
  md: '# # APPENDIX A


    # # A SAMPLE CIFS/SMB SESSION


    The purpose of this appendix is to introduce you to the Common Internet File System
    (CIFS) protocol, show a real-life CIFS session, and point you to other resources
    if you want to learn more. This appendix is designed for those readers who want
    to learn more about CIFS for analysis or debugging purposes.


    # # A Summary of the Overall CIFS Process


    As you are aware from reading this book, SMB (or CIFS, as it is now known), is
    basically a high-level protocol for accessing files across a network. CIFS can
    either be run via NetBIOS transport over TCP, or it can be run directly over TCP
    using NetBIOS at all (first implemented in Windows 2000).


    CIFS supports all the usual operations you would expect when accessing files;
    these include open, close, read, write, and seek. CIFS also supports the batching
    of multipleS messages into one single message, even if some CIFS messages depend
    on the results of earlier transactions. These batched requests are called And
    messages. This baking can be done because the results of earlier CIFS messages
    are passed down to the next chained command.


    This appendix walks you through a simple CIFS session so you can see how the messages
    come together to get a specific task achieved. Certain main steps take place when
    a connection is established to a server for the first time. Here are the steps
    listed in sequential order:


    +   * Dialect negotiation

    * Authentication

    * Connection to resource

    * Accessing resource

    * Disconnection of resource

    * Logoff of user


    First, the CIFS dialect is negotiated. As you are aware from Chapter 1, "What
    is Samba?" there are many different dialects of the CIFS protocol, ranging from
    the earliest, PC NETWORK PROGRAM 1.0, to the most recent, NTLM 0.12. The client
    sends to the server a NULL terminated list of dialects it supports within the
    CIFS message SMB_COM_NEGOTIATE, and the server'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# SAMBA PRIMER PLUS


    responds with the dialect to be used for the session. There are numerous security
    problems with the server choosing the dialect to use; however, this was designed
    for backward compatibility purposes and not for security reasons. An example of
    this is why a bad guy replaces a legitimate server with one of his, running his
    own modified CIFS server sends SMB_NEGOTIATE message with the earliest dialect,
    which by no coincidence uses plain text passwords. When the user tries to connect
    to a resource using his password, the bad server stores the username and password
    combination to used later. This is only one of many possible attacks.


    If there is no existing connection, the next step is to set up a NetBIOS session
    and then authenticate the user. The CIFS message SMB_COM_SESSION_ANDX is sent
    with the credentials of the requesting user to the server for authentication.
    If the user is authenticated, the response CIFS message from the server contains
    a User ID (UID) variable set to the UID of the user for this NetBIOS session.
    Future CIFS message from this authenticated uses this UID parameter to identify
    itself to the server. This saving to authenticate each time when a new resource
    is required. However, this means the client must always make sure that any CIFS
    message sent has a UID that matches the currently logged-in user.


    Next, a resource can be connected by using the CIFS message SMB_COM_TREE_CONNECT.
    The CIFS message contains the name of the resource, or disk share, which the user
    wants to access, as well as a current, valid TID. If the server successfully processes
    this command, it returns a TID (Tree ID) value, which is the identifier that be
    used for subsequent access to this resource.


    In the next step, all the accessing of the resource takes place. It can be opening
    a file (using SMB_COM_OPEN), reading or writing (SMB_COM_READ or SMB_COM_WRITE),
    closing a file (SMB_COM_CLOSE), or one of many other CIFS messages. All these
    commands the previously set variables, TID, and others.


    When a share is disconnected (perhaps with \server\delete command), the CIFS message
    SMB_COM_TREE_DISCONNECT is sent to the server to release access to the resource
    represented by the TID.


    Finally, when a NetBIOS times out or a user logs off, the CIFS message SMB_COM_LOGOFF_ANDX
    is sent to all servers that the client is still connected to. This means that
    any subsequent connection attempts will require authentication.


    # A Samba CIFS Session


    This section shows you some real CIFS traffic and guides you through what it looks
    like by step. The CIFS session being described is a Windows client called DAFFY,
    connecting to a Samba share located on a Linux box called GOOFEY. The resource
    being connected to is \GOOFEY\TMP. The traffic was captured using Network Monitor
    located on the Windows NT machine. You should have, note, that you can use the
    network traffic capture of your choice. Ethereal was mentioned in Chapter 12,
    "Debugging Samba," and is a graphic network traffic capture tool that displays
    traffic in a similar manner to Network Monitor. Alternatively, if command-line
    is your preference, tcpdump-smb will also do the job (it was also introduced to
    you in Chapter 12).'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Appendix A • A SAMPLE CIFS/SMB MESH


    # FIGURE A.1


    The first section of the CIFS/SMB message transfer.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_260_0.png)


    Figure A.1 shows the parts of the CIFS/share transaction connection.


    The first command executed on the Windows NT client was:


    ```

    C:\net use \goofy\tmp

    ```


    Because there is no NetBIOS session from DAFFY to GOOFEY, DAFFY needs to find
    out the IP address of GOOFEY to be able to establish the NetBIOS channel of communication.
    That is frames 1–5. The first three are NetBIOS broadcasts, basically DAFFY advertising
    GOOFEY''s IP address. After the IP address is found, it then needs to do an ARP
    Request to find the physical address (this is also known as the MAC address),
    so the lower network layers can call GOOFEY. Frame 5 shows GOOFEY replying to
    the ARP request; the MAC address will be in the data payload of that.


    Frame 9 is the beginning of the NetBIOS session setup. DAFFY sends a NetBIOS Session
    Request to GOOFEY, GOOFEY replies in the affirmative in frame 11. This indicates
    that a valid process that NetBIOS is listening on port 139.


    Next you see the first CIFS/SMB protocol packet when the dialect of the protocol
    is to be negotiated (frame 12) and the server responds with its chosen dialect
