- img_proc: true
  md: '# Adding a Samba Server as a Domain Member


    One thing that should be mentioned is that you can also use Windows 2000 instead
    of Windows NT unless otherwise noted.


    In Chapter 5, “Integrating Samba into an Existing Windows Network,” you learned
    that you could direct Samba to send authentication request packets to an existing
    Windows NT domain controller. However, there is a drawback to that method. Suppose
    that you have the following setting in your smb.conf file:


    ```

    security = server

    password server = NTDC1 NTDC2 NTDC3

    ```


    Remember when a user tries to connect to a share on a Samba server, a new smbd
    daemon is spawned for the life of that connection. This means that when an instance
    of smbd starts up, Samba will try each domain controller until it finds a domain
    controller that is available. smbd then connects to this chosen domain controller
    for the life of that particular Samba thread. This is bad for two reasons. First,
    if it connects to the NT server for a lengthy period of time, the resources of
    NT server will get strained, especially if more than one Samba server is doing
    the same thing. Second, if NT server gives down, authentication fail for Samba
    session because it cannot change NT domain controllers. Samba session will have
    to be killed before authentications will work again.


    Now that Samba can participate in a Windows NT domain as a member server, communication
    can become more reliable—because Samba basically acts like an NT server in that
    there is a secure communication channel between the Samba server and an authenticating
    domain controller. This is the same behavior that a regular NT server displays.
    The new configuration is:


    ```

    security = domain

    password server = NTDC1 NTDC2 NTDC3

    ```


    This time is a new security method that this book has not discussed before. It
    is called “domain security.” In this mode, the Samba server makes a secure RPC
    connection to the password servers each user needs when authenticating, and then
    closes the connection. No connections are left open for the life of the Samba
    process. Not only that, but more information is brought back with the authentication
    reply. This includes but is limited to the users’ Windows NT security identifier
    (SID), which they are members of, and the times they are allowed to log in to
    the network. This information is obviously very useful and provides a good framework
    for extending Samba in the future.


    # Configuration Details to Make Samba a Member Server


    Recall that each user who needs access to a domain must have an account in that
    domain. Similarly, each computer in a domain also needs an account in the domain.
    This computer account is called a trust account. Each computer that has a trust
    account and is a member of the domain can authenticate to that domain. Trust accounts
    are a fundamental aspect of the'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT 113


    Windows NT domain security model. Any computer that does not have a trust account
    in a domain cannot access that domain at all from the login prompt. This means
    that only trusted Windows clients are given accounts (usually managed by the IT
    department of a particular organization). The trust accounts are represented by
    <computer-< which is each machine''s NetBIOS name followed by a dollar sign. Each
    computer has its own password as well, which is initially just the computer''s
    NetBIOS name. This password is automatically changed every seven days for security
    reasons, and is initially changed when the computer joins the domain for the first
    time. For your Samba server to be able to participate as a member server, a trust
    account must be created. To do this, open Server Manager on your Windows NT PDC.
    Server Manager is located under Start, Programs, Administrative Tools. Click Computer,
    Add to Domain as shown in Figure 7.1.


    FIGURE 7.1nAdding your Samba server to your Windows NT domain.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_128_0.png)


    Keep the default computer type (Windows NT Workstation or Server) selected, enter
    the name of your Samba server, and click Add. The new server should be added to
    the list of servers in the domain.


    Next, stop all the Samba daemons. In most distributions of Linux, you would do
    as follows:


    ```

    # /etc/rc.d/init.d/smbd stop

    ```


    Now, as root, you need to tell your Samba server it is now a part of the domain.
    If your Windows NT domain is called HOME and your NT PDC is called DAFFY, you
    would type the following command:


    ```

    # smpasswd -j HOME -r DAFFY

    1999/11/08 22:34:56 : change_trust_account_password: Changed

    password for domain HOME.

    ```


    Joined domain HOME.


    Notice that when you added the server to the domain, it immediately changed its
    password. This is for obvious security reasons because the initial password is
    just the name of the server. The new password for this machine''s account on the
    domain is stored in a file of the'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'format DOMAIN.Server.mac (for the preceding example, the file is called

    HOME.DAFFY.mac in the same directory where the smbpasswd file is located in. This
    is usually

    /usr/local/samba/private, but could be anywhere. In Red Hat Linux it is in /etc.
    This file should

    be read/write only to root and no access to any other user. If file were compro

    mised, the integrity of your entire system would come into question.


    Now you need to set up your Samba configuration. You need domain-level security:

    security = domain


    Because of the way domain authentication is implemented in NT, plaintext passwords
    are not

    accepted—you need to turn encrypted passwords if you have not already:


    encrypt passwords = yes


