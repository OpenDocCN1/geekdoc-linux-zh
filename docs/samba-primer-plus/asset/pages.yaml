  md: '# CHAPTER 1


    # WHAT IS SAMBA?


    You will learn about the following in this chapter:


    +   - What Samba actually is and what it can do for you

    - The different functions that Samba can perform

    - A history of how the SMB protocol has developed over the years

    - What the CIFS protocol

    - What the SMB protocol


    T his chapter gives you an overview of what Samba actually is, and puts into perspective
    how Samba fits into the "big picture" of Windows Networks. At the heart of the
    Samba suite of programs is a free implementation of the Server Message Block (SMB)
    protocol. This is the protocol that is used for filesharing by the Microsoft operating
    systems. This chapter provides a brief history of where the SMB protocol came
    from and closes with a discussion on the latest incarnation of SMB—the Common
    Internet File System (CIFS).


    # Overview of Samba


    Samba is a marvelous piece of software that runs on UNIX (including the popular
    free UNIX implementation, Linux) and OpenVMS operating systems to allow them to
    function as Windows File and Print servers. This means that you can map a network
    drive from your Windows PC to a Samba server rather than a conventional NT server.


    The first version of what we commonly know as Samba was originally developed back
    in the early 90s by a man named Andrew Tridrill who was at the Australian National
    University (ANU) in Canberra, Australia. He thought it would be cool to be his
    PC to connect to a network drive that lived on one of his UNIX servers. After
    grabbing the relevant SMB standards (most of which are freely available) and doing
    a lot of reverse engineering of the undocumented parts of the protocol, Tridrill
    built something that was basic, but most importantly, something that worked. He
    found that lots of features were missing, and so slowly increased the featureset
    as needed. The project soon got so big that he needed other'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'people to help, and so the Samba development team was born! After many years
    of development, and a great deal of reverse engineering of Microsoft''s undocumented
    protocols, the team has built a fine solid product that has been proven in many
    of today''s most critical commercial environments.


    With the advent of Samba, if you have a mostly UNIX-based site, and desktop PCs
    for specific tasks such as word processing, you can store all your files in a
    central location on your main UNIX server with all your other data, rather than
    purchasing an NT server for this task. This provides two main advantages:


    +   1. You can keep your organization running UNIX at the back end but still allow
    easy integration with your Windows clients machines.

    2. If you already have a UNIX Enterprise backplane system in place, you need not
    change anything. You just need to make sure that the new areas where you are storing
    the Windows files are added to your backup regime.


    Today, you can build a PC file server for your site for the price of not change
    initial system administration costs. Of course, you need an operating system,
    but why pay for it? An alternative that many small and large companies are choosing
    Linux. If you have not heard about Linux now, you must have lying under a rock
    for the past few years! The reason this operating system is so popular these days
    is that Linux is free and extremely stable. In fact, Linux is proven to outperform
    and is actually more stable than any of the Windows operating systems. This is
    probably the reason why two large corporations, IBM and HP, are now supporting
    Linux on their Intel-based servers. You will find that this will be followed by
    many other companies cashing in on providing commercial Linux support. Armed with
    the Linux distribution of your choice, it becomes easier to install, configure,
    and receive Enterprise-level support (if you choose to) for a fraction of the
    cost of an equivalent Microsoft system, but you still have a stable box that needs
    little maintenance and can serve to your Windows clients (Win95/98 and WinNT 4.0/2000).


    To make it easy for you, all the Linux distributions come with Samba precompiled,
    and with a little configuration, Samba can be up and running before you know it.
    There will be more on this in the next chapter. First, it is useful to know a
    little history on what the SMB protocol is and why it is so important in today''s
    corporate networks.


    # What Is the SMB Protocol?


    The Server Message Block (SMB) protocol has been around for well over ten years.
    SMB is an application-level protocol that can run over network layer protocols,
    such as IPX/SPX, TCP/IP, and NetBEUI. In simple terms, it provides a way of giving
    Windows PC the capability to communicate with other Windows machines'' file system
    over a network. Consider the example shown in Figure 1.1.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# FIGURE 1.1


    The concept of the SMB protocol.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_22_0.png)


    The client machine''s pc1, pc2, and pc3 are all connecting to the shared resource
    on "\servergroup". Both the SMB clients and server participate in an exchange
    of SMB packets with the end result being, in this case, that all the clients have
    drive letter X mapped to this resource. Although it looks like a local device,
    really isn''t; it is a drive letter that is redirected by the operating system
    to the remote machine. This simple example should give you a taste for how the
    SMB protocol is used.


    The SMB protocol is at work in our daily lives. Most of us have a computer on
    our desk with a number of network drives connected to servers around the office.
    These servers are usually running the Windows NT operating system, and that is
    why the SMB protocol is in such widespread use today.


    # A Brief History of the SMB Protocol


    What I will describe is the abridged version of the history of the SMB protocol,
    so you can get a feel for how SMB evolved over the years.


    IBM developed one of the very first versions of the SMB protocol in the mid-80s,
    and then it was called the PPLAN 1.0 protocol. Microsoft and Intel obtained this
    PPLAN 1.0 standard and modified it for their own needs, and it then formed the
    core of a file-sharing protocol later to be known as SMB. They renamed OpenNET/MSNET
    at that stage. This original core protocol contains the basic SMB commands intended
    for use with MS-DOS as OPEN file, CREATE file, CLOSE file, DELETE file, and so
    on.


    After soon, a document was released that was an extension to this created for
    use in Microsoft OS/2 operating system. This document was called "SMB Extensions",
    and the official version of the SMB protocol referenced in this document is LANMAN
    1.0. This extended SMB protocol contained new SMB commands such as FIND, COPY_FILE,
    and MOVE_FILE. Many commands intended for use with OS/2 were also documented.
    LANMAN 1.0 also introduced the concepts of share-level security and user-level
    security.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'With share-level security, a resource on a server is available to anyone on
    the local LAN. This resource can be password-protected or not. If it is protected
    with a password, anyone who knows the password is granted access.


    With user security, a user ID and password must be entered before access to a
    resource is given. Of course, this provides more security because anyone who does
    not have a registered login to the LAN cannot access shared resources on the network
    at all—unless of course they have acquired someone''s login name and password.


    It was LANMAN version 1.0 that first used the challenge/response method of user
    authentication that is in widespread use by Windows NT.


    The next version that came along with the LANMAN 1.2 protocol, which extended
    the LANMAN 1.0 to OS/2, but was designed to apply well to other operating systems
    also. This was a minor update and later as LANMAN 2.0.


    LANMAN 2.1 was released a while later and further revised the protocol to add
    support for Windows NT domains (domains will be described in Chapter 4, "Understanding
    Windows Networks\ The Windows for Workgroups 3.1a dialect followed, which contains
    Windows-SMB commands.


    Microsoft opted OS/2 in favor of building a new, secure operating system, which
    we know as Windows NT. It needed a much secure version of the LANMAN 2.1 protocol
    for Windows NT to have any chance of becoming a Network Operating System (NOS).
    The old LANMAN family of protocols contained specifications not just for the SMB
    protocol, but also detailed on methods of authentication as well. The first authentication
    methods sent in clear text, which obviously was not ideal! Later, a simple challenge/response
    method was used for password authentication. But still, even with the challenge/response
    methods, problems were identified:


    +   - Challenge/Response authentication is susceptible to known plaintext attacks.

    - It has a very small keyspace (case-insensitive passwords).

    - It is susceptible to chosen plaintext attacks.

    - It is susceptible to dictionary attacks.

    - Part of the encryption used a known key that made it possible to reverse the
    encryption and find out the password anyway.

    - It allows users to choose "bad" passwords.


    # A Word About Cryptanalysis


    Here''s a short lesson in Cryptanalysis to make sure you understand the different
    methods of plaintext password attacks. First, Cryptanalysis is the science of
    recovering plaintext from ciphertext without the use of the original encryption
    key. However, this process unlocks the key anyway. Assume you have a plaintext
    password that goes through a magic cryptographic algorithm and produces ciphertext,
    or in this case a password hash.


    A known plaintext attack occurs when you have some given plaintext and the associated
    password hash combinations, and you attempt to break the encryption using only
    this information.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'A chosen plaintext attack is similar, but this time you choose the plaintext
    to be encrypted. This gives you more variety when choosing the plaintext/password
    hash pairs; therefore, you have a better chance to be pick up common elements
    between the password/password hash pairs.

    if you are interested in more information on cryptography in general, I recommend
    you pick up a copy of Applied Cryptography by Bruce Schneier (ISBN:0471117099)
    from your favorite bookstore. It is the industry bible on this topic.


    Because of these borrowings, another version of the LANMAN protocol for NT was
    developed, called NT LM 0.12. It contains Windows NT-specific SMB commands that
    map to the NT file system, including a much better authentication method—and it
    uses a one-way function that “theoretically” cannot be decrypted.


    In 1998, Microsoft addressed many shortcomings in the NT LM protocol and released
    a further version as part of Service Pack 4 for Windows NT. This is known as NTLMv2.

    Table 1.1 gives a summary of all the different dialects as documented by Microsoft.


    # TABLE 1.1 The Various Dialects of the SMB Protocol


    | Dialect Name | Description |

    | PC NETWORK PROGRAM 1.0 | The core MSNET SMB protocol |

    | PLAN1.0 | An alternative name to the core protocol |

    | MICROSOFT NETWORKS 1.03 | Extensions to the core protocol to include Lock&Read
    and Write&Unlock |

    | LANMAN1.0 | Full LANMAN 1.0 Protocol (OS/2 errors) |

    | MICROSOFT NETWORKS 3.0 | Same as LANMAN1.0 except errors are mapped to DOS errors
    |

    | LM1.2X002 | Full LANMAN 2.0 Protocol (OS/2 errors) |

    | DOS LM1.2X002 | Same as LANMAN 2.0 except errors are mapped to DOS errors |

    | LANMAN2.1 | Full LANMAN 2.1 protocol (OS/2 errors) |

    | DOS LANMAN2.1 | Same as LANMAN 2.1 except errors are mapped to DOS errors |

    | Windows for Workgroups 3.1a | Windows for Workgroups version 1.0 specification
    |

    | NT LM 0.12 | First version of the SMB protocol for use in Windows NT environments
    |


    For more technical details on these protocols, refer to Appendix A, "A Sample
    CIFS/SMB Session."


    # Samba’s Main Functions


    You probably want to know how Samba fits into what we have been talking about.
    Samba functions in five main ways:'
