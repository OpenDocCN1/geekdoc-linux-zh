    # Password


    Finally, we come to the password view. If you are using encrypted passwords, in
    this view you can perform maintenance of your Samba users. This requires the use
    of a smbpasswd file, or the security global variable set to Server or Domain.
    Detailed information on setting up encrypted passwords is Chapter 5, "Integrating
    Samba into an Existing Windows Network.". For now, we will see what the password
    view looks like by looking at Figure 3.9.'
