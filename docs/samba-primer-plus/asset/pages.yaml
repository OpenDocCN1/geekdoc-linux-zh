  md: '# Other SSL smb.conf Parameters


    There are many other SSL parameters you can set in the Samba configuration file,
    all of which are outlined in the following sections. They have been included to
    serve as a reference for you. The following list is designed so you can read through
    all the parameters and decide which options you need and which are not required.


    # ssl CA certDir


    The parameter ssl CA certDir is where Samba looks the trusted CAs. It is only
    used when Samba is configured to verify client certificates. Each entry in the
    directory must be a hash value created from the distinguished name of the CA.


    Here''s an example:


    ```

    ssl CA certDir = /etc/ssl/certs

    ```


    # ssl CA certFile


    The parameter ssl CA certFile is an alternative to ssl CA certDir. This time a
    file is specified that contains all the trusted CAs'' certificates, one after
    the other.


    Here''s an example:


    ```

    ssl CA certFile = /etc/ssl/certs/CAcollection.pem

    ```


    # ssl ciphers


    The ssl ciphers parameter allows you to specify the different ciphers to be offered
    during the SSL handshake process. It is recommended that you do not change this
    parameter. If you are interested in what values it could contain, see the OpenSSL
    source code or Web site (http://www.openssl.org).


    Here''s an example:


    ```

    ssl ciphers = DEFAULT

    ```


    # ssl client cert


    The client cert variable is read by smbclient. The value of this parameter is
    required by smbclient if the server requires client certificates.


    An example follows:


    ```

    ssl client cert = /etc/ssl/certs/smbclientcert.pem

    ```


    # ssl client key


    Again, the ssl client key parameter only needs to be used when the server requires
    client certificates. If set, this variable contains the client private key. If
    you are using smbclient, it will look here for its private key.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# 176 SAMBA PRIMER PLUS


    An example follows:


    ```

    ssl client key = /etc/ssl/certs/smbclientkey.pem

    ```


    # ssl compatibility


    The ssl compatibility parameter defines whether or not OpenSSL should be configured
    bug compatibility with other SSL implementations. You should generally leave this
    variable alone.


    This default value is


    ```

    ssl compatibility = no

    ```


    # ssl hosts resign and ssl hosts


    The parameters ssl hosts resign and ssl hosts control whether or not Samba will
    go into SSL mode. This is quite useful if you want SSL to kick in when clients
    connect from untrusted IP addresses. The syntax for these parameters is exactly
    the same as for the hosts allow and deny hosts. If neither parameter is set, Samba
    will allow only SSL connections. If there are hosts in the ssl resign parameter,
    these hosts will not be forced into SSL mode. However, if ssl hosts is set, the
    hosts in that parameter will be forced into SSL mode.


    The following example forces hosts in the untrusted network (137.154) to connect
    via SSL, and the hosts in the trusted network (167.154) to connect via conventional
    methods:


    ```

    ssl hosts = 137.154.

    ssl hosts resign = 167.154.

    ```


    # ssl require clientcert


    The ssl require clientcert variable forces clients to have a valid certificate
    before they will be able to connect. The previously mentioned variables ssl CA
    certDir or ssl CAFile will be used by the server to verify the CAs who signed
    the certificates.


    The default value is


    ```

    ssl require clientcert = no

    ```


    # ssl require servercert


    If ssl require servercert is set, smbclient will request a certificate from the
    server.


    The default value is


    ```

    ssl require servercert = no

    ```


    # ssl version


    The ssl version parameter is where you can define the version of the SSL protocol
    to used. The value can be one of the following:


    ```

    ssl2or3

    ssl12

    ```'
