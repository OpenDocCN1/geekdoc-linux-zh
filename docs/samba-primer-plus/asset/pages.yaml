    +   - Servers. These are usually where all the user''s data is stored. These are
    also used as servers if that functionality is required, among other tasks that
    you do not want a domain controller to do.


    +   - Workstations. These can be Windows NT/2000, Windows 95, Windows 98, or to
    a lesser extent these days, Windows For Workgroups 3.11 clients. Each client can
    be a member of only one domain, and to get access to the resources of a domain,
    a user must provide the correct domain username and password combination.


    On the surface, domains and workgroups seem similar and they are, but domains
    provide an extra level of security that should help you sleep well at night.


    # # NetBIOS Revisited


    You are probably wondering how NetBIOS is related to Samba, and why NetBIOS is
    being discussed in great detail here. NetBIOS is the transport layer used for
    the Server Message Blocks (SMBs) that are used when you connect to a shared resource
    on a Samba or NT server. Understanding the basics of how the NetBIOS API works
    in this process helps you to troubleshoot your Samba servers when things go wrong.
    A very brief overview of NetBIOS was given in Chapter 1. This section goes into
    it a little more.


    In the 1980s, a transport protocol called NetBEUI was developed by Sytek, Inc.
    for IBM’s broadband network. NetBEUI had a network programming interface as part
    of it called NetBIOS (Network Basic Input/Output System). In March of 1987, two
    Requests For Comments (RFCs) were released by the Internet Engineering Task Force
    (IETF), 1001 and 1002 (found at http://www.ietf.org/rfc/). The first, RFC 1001,
    describes the NetBIOS API and what it provides to network applications. The second,
    RFC 1002, gives a detailed explanation of NetBIOS implementation over TCP/IP.
    As the RFCs describe, NetBIOS provides the programming interface to write network-aware
    applications. The original NetBIOS transport NetBEUI is a very fast protocol because
    it has a low number of control bytes for frame set. NetBEUI, however, is not without
    a major disadvantage. This means that it is useful only in single subnet networks,
    even when this is not much of an advantage because small networks are almost nonexistent
    these days. And mainly because of the Internet, almost everyone uses TCP/IP—NetBEUI
    has become extinct.


    Microsoft, picking up the NetBIOS API and developed it for a world standard for
    writing network applications, developed it for its own operating systems. Seeing
    the future disadvantages, Microsoft didn’t like being tied to NetBIOS, so it developed
    NetBIOS to be usable with any transport/network layer protocol. This was fairly
    easy considering that NetBIOS is effectively session-level-based anyway. This
    separation of NetBIOS from NetBEUI provides flexibility in being able to use NetBIOS
    over theoretically any transport protocol, including protocols that are routable
    and common today such as TCP/IP. But it also'
