    # rpcclient Could Be Hazardous to Your Health!


    rpcclient is dangerous if you do not know what you are doing. Because rpcclient
    bypasses the standard Windows NT error-checking interfaces, you could very easily
    fry any of the machines you connect to it. Be careful!


    # Summary


    This chapter began with an explanation of machine trust accounts, and how to add
    Samba to an existing NT domain. You learned that for this happen, the Samba server
    must have a trust account in the domain, and then the Samba server must be joined
    to the domain using the following:


    ```

    smbpasswd -j DOMAIN -r PDC

    ```


    The chapter then discusses the functionality that is implemented in the Samba
    PDC current, and you learned how to make a PDC for your own domain that has any
    number of Windows servers/workstations/other Samba servers can join. At the time
    of this writing, you must download the HEAD from the CVS for Samba PDC code. It
    works fairly well, and the full production release is slated for Samba 2.1.


    File-system permissions come next and what you learned you can currently do with
    the permissions on your Samba shares. The user/group/world UNIX permissions map
    to similar ACEs in the File Permissions dialog box when viewing them on an NT
    machine. Eventually you will be able to manipulate the same way as you can with
    pure NT machines currently.'
