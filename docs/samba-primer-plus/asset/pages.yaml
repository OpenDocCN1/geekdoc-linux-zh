    For the *username*, make sure you specify a username that exists on the server.


    Notice two things here. The first is that normally, you do not have to specify
    a username with the -U option. `smclient` defaults the value of this option to
    the environment variables LOGNAME or USER, if you use them. For some reasons known
    only to the Samba development team, they force the user to provide a username
    when getting a list of resources. The other interest-thing to note is that you
    generally specify resources using forward slashes (/) rather than backslashes
    (\) as you do in the Windows world. The main reason for this is that the backslash
    has a special meaning in the UNIX world—to escape characters. You can specify
    backslashes if you want; `smclient` just converts them to forward slashes when
    processing command arguments.


    You also had to stop and specify a password. If you convert an incorrect password
    or specify an invalid username, you will get an error message like this:


    ```

