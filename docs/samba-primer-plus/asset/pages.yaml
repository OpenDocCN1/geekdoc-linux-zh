  md: '# # CHAPTER 10


    # # ADDITIONAL SHARE LEVEL OPTIONS


    You will learn about the following in this chapter:


    +   - How to execute a script when a user connects and disconnects from a file
    service

    - What "name mangling" is and which Samba parameters control how the name mangling
    works

    - How to hide files from the view of the user on a resource

    - How to limit the number of connections to a share

    - How to ensure connections to a particular share come from a particular user
    or group

    - How to deny specific users to a share


    his explains some of the less frequently used options you can specify as part
    of a file share. Although these options are not used as frequently, Samba does
    not mean they should be ignored—quite the contrary. This chapter covers Samba
    parameters that allow you to execute commands on the server before and after a
    user connects to a share. This chapter introduces the term name mangling, and
    includes parameters to control how the name mangling process works, parameters
    that relate to connecting users on a share (controlling what they can and cannot
    do), parameters that relate to files on a resource, and parameters that control
    share level options.


    # ## preexec, postexec


    Perhaps most useful of the advanced options are the preexec and postexec parameters.
    The preexec parameter allows a program to be executed on the Samba server when
    a user connects to a file. Similarly, the command in the postexec parameter is
    executed when a client disconnects from the file share. These can have quite useful
    applications. Take, for instance, a share you are trying to decommission called
    developers. The share configuration is as follows:


    ```

    [developers]

    path = /export/developers

    public = no

    writable = no

    ```'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'Suppose you want to know if anyone is connecting to this share any more to
    read data from it. You can change the configuration settings and grab a log of
    connections made to it:


    ```

    [developers]

    path = /export/developers

    public = no

    writable = no

    preexec = echo \%S was connected to %%%u\nn>> /var/tmp/samba-connections.log

    ```


    Now, each time a user connects to the share developers, an entry will be made
    in the log file

    /var/tmp/samba-connections.log


    A slightly different version of the same parameters exists called root preexec
    and root postexec. These parameters function identically to the other two except
    for one important difference. The programs they execute are as the root user.
    One obvious application for this is to mount a CD-ROM on connection to the share,
    and unmount it on disconnection:


    ```

    [cdrom]

    path = /mnt/cdrom

    public = no

    root preexec = mount /mnt/cdrom /dev/cdrom

    root postexec = umount /mnt/cdrom

    ```


    This assumes that there is a link in /dev called cdrom that points to the correct
    file for your CD-ROM.


    # What Is “Name Mangling”?


    You have probably heard the concept of name mangling. This was actually more relevant
    back when DOS and Windows 3.1 ruled the world. It came about because of the differences
    in the way filenames are stored in different operating systems. DOS filenames
    have an 8.3 format, whereas UNIX uses longer names. Name mangling is how Samba
    changes UNIX filenames to conform to the DOS 8.3 format. The options that control
    this behavior can be set on a per-service basis or globally.


    The first parameter, default case, controls what the default case is for new files.
    By default it is set to lower. The alternative is upper.


    The next parameter, mangle case, operates on filenames containing characters that
    are not of the default case, like “Mail”. If this parameter is set to yes, a name
    like “Mail” is mangled. The default for this is no.


    The case sensitive parameter determines whether Samba filenames are case sensitive.
    The case-


    serve preserve case parameter determines whether Samba creates new files with
    the case that the client passes, or causes the files to be created with the default
    case. The default for this parameter is yes.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Chapter 10 • ADDITIONAL SHARE LEVEL OPTIONS


    The parameter short preserve case controls whether files conform to 8.3 format
    are created uppercase (like all 8.3 filenames) or forced in the default case.
    The default for this parameter is yes.


    The mangled names parameter controls whether non-DOS names that live in UNIX should
    be mangled to DOS format, or invisible to the connecting DOS client. If you want
    to learn the process of mangling a name, see the smb.conf manual page in the section
    on mangled names. For example, a name like great_train_robbery.txt could turn
    into GREAT-01.TXT. The “-” character can be whatever character you specify in
    the mangling char order. Obviously, by default it is “-”.


    The mangled stack parameter is a global parameter that controls the number of
    mangled names that should be cached in the Samba server. This setting can dramatically
    increase performance in your Samba server because recently mangled names that
    cache do not be mangled again if they are requested a number of times in a relatively
    short period of time. This mangled names cache consists of a stack of recently
    mangled original or base names. The larger this, the more likely that mangled
    names can be successfully converted to correct UNIX names. Each stack element
    costs 256 bytes, the larger this, the more memory required. The default value
    is 50.


    A very useful parameter called mangled map is used to ensure files to be renamed
    in a user-definable name. HTML files are a good example of why this is useful.
    UNIX systems usually name HTML files with a .html extension, whereas on DOS systems
    they are named with a .htm extension. To map all .html files on a UNIX Samba share
    to .htm so that you can see them properly under DOS, you would add this to your
    smb.conf: mangled map = (*.*)


    # Parameters That Control User Access to Resources


    The parameters in this section are for specifying groups and users in certain
    parameters for a shared resource. Described are valid users and invalid users,
    which specify users that are or are not allowed to connect to the resource; write
    list and read list, which allow you to explicitly set who is allowed to write
    to a resource or have read-only access to a resource; force group and force user,
    which overrides a user’s connection with that of another user.


    # valid users, invalid users


    These parameters are pretty self-explanatory: valid users allows you to define
    users or groups that can access this particular share, and invalid users allows
    you to specify users that are not allowed to access the share. The latter option
    is useful when you know there are certain users or groups of users who are not
    connecting to a share. Also note that if you have valid users set, everyone not
    in this list is denied access implicitly. Similarly, if you have invalid users
    set, everyone specified with a prepended “@”. If you are running NIS, the NIS
    netgroup is looked at first,'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# 184 SAMBA PRIMER PLUS


    and then the local UNIX machine''s /etc/group file. There are two additional special
    characters if you want to change this behavior. A “+" prepended to a string indicates
    that the group should be looked at the local machine, and an “&” means to look
    at the NIS netgroup data-base. So &group means is the same as @group.


    # write list, read list


    Using the write list parameter gives you a way to specifically list users or groups
    who can have write access to the share. Similarly, read list provides a method
    of giving specific users or groups who can read-only access to the share. If a
    user is specified in both parameters, the write list takes precedence.


    Here is an example:


    ```

    write list = @operator, @techos, root

    read list = matt, john, @mgmt

    ```


    As usual with smb.conf, the “@” specifies a group rather than a user. The user
    root and the groups operator and techos are given write access, whereas matt,
    john, and the group mgmt are given read-only access. Note that matt was in the
    write list as well as the read list, matt would actually have write access. This
    also applies if matt was in the group operator or techos.


    # force group, force user


    The force parameters allow you to force connections to a particular share to become
    a certain group and/or user. As of Samba 2.0.5, if the force group parameter has
    a “+" prepended to it and the user is already a member of the group, this group
    is forced to be the user’s primary group for this session. All other users retain
    their ordinary primary group.


    Note that with force user, a user still needs to specify a valid username and
    password to connect to the resource. It is just when he is connected, all operations
    are performed as the user specified in force user (which can be a different user).
    These force options can be used in an environment where not all users have a UNIX
    account and there is a common share available for software installations. In this
    case you might create an account install if you put this in smb.conf:


    ```

    [install]

    comment = "This share is for software installations"

    path = /pc/install

    read-only = yes

    force user = install

    ```


    Then all connections to the resource install will be done by the user install
    no matter who connecting.'
