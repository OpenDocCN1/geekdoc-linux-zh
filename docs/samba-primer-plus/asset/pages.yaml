    Q: I am trying to use SWAT with my web browser, connecting to http://sambaserver:901,
    but I get a message no data when trying to connect.


    A: This is almost certainly due to tcp wrappers denying connections to the SWAT.
    Some Linux distributions (namely Red Hat) secure their systems by default quite
    tightly, this stops SWAT working the way you expect it. But this is in fact the
    way it should. You do not want joe connecting to your Samba server and checking
    out your Samba configuration! If you are using the web browser on your Linux system,
    you can most likely get to your SWAT Web site by connecting to http://127.0.0.2:901.
    This is one of the local loop-back network devices that cannot be accessed from
    the network. Your /etc/hosts.allow file will probably contain something like this:


    +   # cat /etc/hosts.allow

