  md: '# Sending a Message to Connected Users


    Messaging can be a very useful tool. In Chapter 5, you learned a method of sending
    a message to all users with a connection to your Samba server. This is a way of
    doing the same thing, but doing it in Server Manager. All you need to do is make
    sure the server to which you want to send messages is highlighted, click Computer,
    Send Message, and you will see a text box in Figure 7.19.


    # FIGURE 7.19

    Sending a Windows pop-up message in Server Manager.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_147_0.png)


    Type some text and click OK. All users connected will get a message like shown
    in Figure 7.20. You may find this especially handy if the server needs to go down
    for emergency maintenance. Using Server Manager for this task is a simple way
    to send a message to all users.


    # FIGURE 7.20

    All users who are connected to the server will receive the message.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_147_1.png)


    Remember that Windows 9x will need to have WinPopUp running to receive any of
    these Windows messages. This is because Windows 9x has no message listening process
    like Windows NT systems.


    # See the SMB Server Statistics


    You can see a number of useful smb-related statistics of your Samba SMB server
    at a glance using Server Manager. If you double-click your server, you will get
    a screen titled, “Properties for GOOFEY." Obviously yours will have a different
    name. The author''s statistics screen is shown in Figure 7.21.


    # FIGURE 7.21

    SMB statistics for Samba—the PDC named GOOFEY.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_147_2.png)'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT 133


    You will see the number of NetBIOS sessions connected, the total number of currently
    open files, file locks, and opened pipes. This is useful if you want to know exactly
    many users are connected at a point in time, or if you need to track down a performance
    problem. The statistics may help you see the cause of a problem. For example,
    a high Sessions number could indicate that Samba is not closing connections properly.


    # Get a List of Currently Connected Users


    When you have the properties for a server displayed and you click the Users button
    at the bottom, you will get a list of who is connected and which computer they
    are connected from. If you click a user at the top of the server, all the resources
    that user has open will be displayed in the bottom half of the screen as seen
    in Figure 7.22.


    # FIGURE 7.22


    Getting a list of users connected to the Samba server.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_148_0.png)


    Many of the features of Server Manager when used with Samba servers are not fully
    implemented yet. For example, if you click the Disconnect button at the bottom
    you will get a message. "The remote procedure call failed."


    # See How Many Connections Are Open to Each Share


    Click Open if you are still in the Users screen, and click Shares. Here you will
    see the full list of all shares on your Samba server. The author''s Samba server
    displayed is shown in Figure 7.23. Again, the Disconnect buttons do not work at
    the time of this writing. If you have network problems, you can bring up this
    list to help pinpoint the cause of the problem.


    # FIGURE 7.23


    Checking the list of shares and connected users in Server Manager.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_148_1.png)'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# See Which Files smbd Has Open


    Finally, you can use the In button to see which files are open on the Samba server
    as to show which files are open with a lock on them (Figure 7.24). Being able
    to see currently open files is extremely useful when you have a problem removing
    a file and cannot figure out why. Bringing up the list of open files can help
    you see in an instant if someone on the network has the file open.


    # FIGURE 7.24


    Checking the files that are open using Server Manager.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_149_0.png)


    # User Manager for Domains


    User Manager for Domains is not very functional now, but it is well on the way.
    You can point User Manager for Domains at your Samba PDC and will list all the
    groups on your system and all username entries in your smpasswd file. Samba PDC
    controls currently, go to Start, Programs, Administrative Tools, User Manager
    for Domains. A list of all users in your smpasswd file and all your entries in
    /etc/group will be displayed as in Figure 7.25. It is the Samba equivalent of
    the Windows SAM.


    # FIGURE 7.25


    The entries in your Samba SAM.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_149_1.png)


    In the figure that Administrator is specified! You are probably wondering how
    that has happened. There is no Administrator account in UNIX! Well, it is quite
    simple. Samba provides a facility to map UNIX accounts to Windows NT account names.
    For this example, this variable was set as follows:'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT 135


    domain user map = /usr/local/samba/lib/domain_user.map


    The contents of this file are currently:


    root "Administrator*


    This maps the UNIX root account to the Administrator name. Next, add the root
    account to smbpasswd:


    ```

    # smpasswd -a root

    ```


    Now, you can log in as Administrator in your Samba-controlled domain! However,
    Administrator does not have the normal administrator privileges. Two other map
    files are needed. They are


    domain group map = /usr/local/samba/lib/domain_group.map

    local group map = /usr/local/samba/lib/local_group.map


    The first maps UNIX group names to Windows NT group names. The second maps UNIX
    group names to Windows NT local group names. There are two important groups on
    regular Windows NT Domain Controllers: the global Domain Admins and the local
    group Administrators. To give your administrator account administrative privileges
    on your Samba server, you need need these groups and Administrator as a member
    of these groups. So put this into your domain group map file:


    adm "Domain Admins"


    And this into your local group map file:

    wheel "Administrators"


    When you open User Manager, you will see Domain Admins and Administrators in the
    group listing instead of adm and wheel. You should see these groups at the bottom
    of Figure 7.25. Now you all need to do for all your administrative accounts is
    to put your usernames into the UNIX group adm and wheel by editing the /etc/group
    file. When you have done that, open User Manager again and double-click the Domain
    Admins group (see Figure 7.26). You should see the user account you added as well
    as Administrator.


    # FIGURE 7.26


    Looking at the contents of the Domain Admins group in User Manager.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_150_0.png)


    While logged in as this user to whom just gave administrative privileges, open
    up User Manager for Domains. Double-click one of your Samba users, and you should
    see something like Figure 7.27.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# FIGURE 7.27


    Viewing an entry in the Samba SAM in User Manager.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_151_0.png)


    The full name is whatever is specified as the name in /etc/passwd. If you click
    the Profile button, you will see the profile settings and home directory setting
    that you set up in smb.conf. For an example, see Figure 7.28.


    # FIGURE 7.28


    Looking at the user profile and home directory settings in User Manager.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_151_1.png)


    You should now be confident doing administrative tasks on your Samba server using
    Server Manager and User Manager for Domains. In the next year or so it will be
    interesting to see the new developments in the Samba code to deal with the remaining
    administrative functions that are currently unimplemented or partially implemented,
    as well as all the new functionality that Microsoft is placing with Windows 2000.


    # Roaming Profiles Under Windows NT


    Setting up roaming profiles in Windows NT is almost the same as doing it for Windows
    9x clients; however, you need to be a little more careful regarding file permissions.
    This section first goes through the login process for a Windows NT workstation,
    and then moves on to how you can have roaming profiles for all your users.


    When you log in to a Windows NT machine for the first time, a subdirectory is
    created under the %SYSTEMROOT%\Profiles directory. The name of this directory
    is the username you use to log in, and this is the directory where the local copy
    of your personal profile is stored. This profile is initially copied from the
    %SYSTEMROOT%\Profiles\Default User directory.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT


    It consists of a set of subdirectories as a file called NTUSER.DAT. The NTUser.DAT
    file contains the data for the registry key known as HKEY_CURRENT_USER. This registry
    key contains a user''s personal preferences for applications and the Windows NT
    system such as wallpaper, screen saver, fonts, and colors. If you want to make
    the default system for all new users who log in, you make the change to the Default
    User profile, which then gets read when new users log in to system.


    One you can use to create a standard environment for all users who use the system
    is to utilize the Windows NT feature that it locks for the Default User profile
    on the netlogon share, before it looking in %SYSTEMROOT%Profiles\Default User.
    Create a user-named profile. Log in as this user and set up the environment the
    way you want to look. You might put a corporate logo as the wallpaper, change
    any colors as appropriate, create shortcuts for the desktop for any corporate
    applications such as a phone directory; and then log out. If your PDC runs Samba,
    temporarily modify the Samba config file with the following line:


    ```

    admin users = matt

    ```


    Of course, replace matt with the username you use to connect. Otherwise, if it
    is an NT PDC, modify the ACLs on the netlogon share so you have write permissions.
    Log back in as Administrator and open a command prompt. Map a temporary drive
    to your PDC''s netlogon share (Samba or NT); this like this:


    ```

    C:>net use * \goofey\netlogon /user:matt The password is invalid for \goofey\netlogon.

    ```


    Type the password for \goofey\netlogon:

    Drive E: is now connected to \goofey\netlogon.


    The command completed successfully.


    Open up Start, Settings, Control Panel and click System. Then click the User Profiles
    tab and you should see an entry for the user profile you logged in as. Before.
    Click the Copy To button and enter the drive letter to which the netlogon drive
    is connected. Then enter the text "Default User",u201d shown in Figure 7.29.


    # FIGURE 7.29


    Copying a user profile to the default.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_152_0.png)


    Once you''ve completed those steps, click OK and the profile will be copied to
    the server.

    Check on the server that it will be accessible to everyone, and then log in as
    a new user and try it out. The user you log in as should have all the preferences
    that you selected when”u201d were logged in as the profile user.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# SAMBA PRIMER PLUS


    Using this method, all users log in with your initial preferences you set the
    user account profile. If you don''t want users to be able to change their own
    profiles, rename NTuser.DAT to NTuser.MAN under the Default Directory. This creates
    a mandatory profile that cannot be changed by the users, even if they try!


    Now that you have your standard environment set up, you want all your users to
    have their environment follow them whenever they log in to a different NT machine.
    Nowadays with Samba, this all happens by default. After you set up Samba to a
    domain login server, by default, all user profiles get to a directory called profile
    under the user''s home directory. Even if it is already set up for you, this section
    goes through the different parameters in case you want to change your default
    values. First, the global parameter logon path in smb.conf should be set to something
    like this:


    ```

    logon path = \\sambaserver\profiles%U

    ```


    By default, it is to:


    ```

    logon path = \\\U\profile

    ```


    It is generally good practice to allocate a share on a server (either NT- or Samba-based)
    dedicated for user profiles. Because by default the user profiles are saved to
    a user''s home directory, users tend to say "Oh, what''s this? I don''t delete
    it!" they wonder why their preferences have disappeared next time they log in!
    The logon path that specified be a directory.


    If you have the logon path per the preceding example, a subdirectory will be created
    for each user when they log in. Make sure that the top level, is, \\sambaserver\profiles,
    has permissions to allow subdirectories to be created for everyone; otherwise,
    the roaming profiles cannot be created. After each individual user''s profile
    is created, check that the permissions on each user''s profile directory are set
    so that only the user who owns the profile can access it (this should be the case
    by default).


    You might also set the logon home global parameter to specify where a user''s
    home directory is if it is different than the user''s UNIX home directory:


    ```

    logon home = \\othermachine\U

    ```


    This defaults to \\\U, which is probably okay in most environments. You will probably
    want to also set the global profile drive to the drive letter the user''s home
    directory mapped to; by default it is set to Z;, but it is more commonly set like
    this:


    ```

    logon drive = h:

    ```


    If you had not guessed, H is for home. Only Windows NT clients use this logon
    drive parameter. See the previous chapter for how to map a home directory with
    Windows 9x.


    Although this is not directly related to profiles, just as with Windows 9x clients,
    you can create system policies using the system policy editor (POLEDEDIT.EXE).
    The procedure for how to do this is out of the scope of this book, the policy
    file you will eventually create using POLEDEDIT.EXE should be put on the \pdc\netlogon
    share. That Windows NT clients look for is NTconfig.pol. This is in contrast to
    what Windows 9x clients expect to see,'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT 139


    which config.pol. This means that both files can be on your PDC if you have a
    mixed network consisting of Windows 9x and Windows NT clients. The system policy
    editor comes on the Windows NT server CD, or if you don''t have that, it is available
    with the download version of Windows NT tools I mentioned at the beginning of
    this chapter.


    # rpcclient


    Remember the smbclient? It was originally designed by the Samba team primarily
    as a testing tool for Samba when they didn''t have a Windows-based machine nearby.
    The rpcclient program is used for a similar purpose. It was designed for the Samba
    team to use in development, but this time it is used as an MS RPC client. You
    can connect to all the different MS RPC services on Windows-based machines (the
    most interesting information, of course, is found when you connect to a Microsoft
    Windows NT machine) and get all kinds of useful information and opportunities,
    being able to browse the registry tree!


    You start rpcclient in a similar manner to smbclient:


    ```

    $ rpcclient -S daffy -U matt

    Added interface ip=192.168.66.64 bcast=192.168.66.65 nmask=255.255.255.0

    session setup up

    Domain=[HOME] OS=[Windows NT 4.0] Server=[NT LAN Manager 4.0]

    smb: >

    ```


    You can then get a list of all the currently supported commands by typing "?":


    ```

    smb: \> ?


    eventlog svencum svcinfo svcstart svcstop

    at at regenum redeletekey regretekey shutdown

    reggeyrval regquerykey redeleteval recreate getsec

    regtestsec spoolenum pools spoolen time

    brinsfo wksinfo srvinfo vrssessions srhverses

    srvrports srconnections svrfiles lsquery laenundominains

    lookupsids looknames queryset ntlogin domstruct

    lookup enumerators addalliasmem delgroup

    deliasms creategroup createalias createuser

    delalias ntpass samusers samuserset2 sampler

    samamproup samalias samalias samamproup testest

    emulailases enundomains enumgroups domino dispinfo

    samsync quit q exit

    help

    \> Bye

    ```


    You can get get information about the NT box you are connected to:


    ```

    smb: \> srvinfo

    srvinfo

    ```


    Server Info Level 10:


    | DAFFY Wk Sv PDC NT LMB

    | platform_id : 500 |

    | os version : 4.0 |'
