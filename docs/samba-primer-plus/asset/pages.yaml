    mickey:1702:B07C6DA065AD3250210A08B34B35104EE:

    F09AB173A328A5F38CA52890|W:LC-382FF25:

    ```


    Remember that in the smbpasswd file, there are two hashes: the LAN Manager (LM)
    hash and the NT LAN Manager (NTLM) hash. The initial password values for machine
    names are their NetBIOS name. These passwords will automatically get changed when
    the Windows NT machines join the domain.


    # What is a Hash?


    A hash is basically the result of a one cryptographic function; it cannot be reversed.
    A hash can go by one many names: compression function, message digest, fingerprint,
    or cryptographic checksum, just to mention a few. Windows NT stores two hashes
    of the one password, both using separate cryptographic algorithms. There is the
    less secure LAN Manager hash (LM) and the more secure NT LAN Manager hash (NTLM).
    The only reason the LM hash is still stored is for backward compatibility—older
    network clients do not understand the NTLM hash. When a password is being checked;
    it is hashed and the resulting value is compared to that stored. If they are identical,
    the password is correct.


    You will also need to create a test account to use when trying to log in to the
    domain for the first time. Create one as follows:


    ```

