    # Share-Level Printer Configuration


    Share-level printer configuration can work in one of two ways. The most common
    minimal configuration is to create a section called [printers] (similar in concept
    to [homes]) in your smb.conf like this:


    [printers]


    ```

    comment = All Printers

    path = /var/spool/samba

    create mask = 0700

    print ok = Yes

    ```


    When Samba starts up and it finds a section like this, all the options in this
    section are used as the default options for each share that is created.


    The other way is to create printer shares individually on a per-printer base like
    this:


    [nplet]


    ```

    comment = HP Printer @ Level 2

    path = /var/spool/samba

    print ok = Yes

    guest ok = Yes

    ```


    This would be useful if you only require a few printers for access from Samba.


    The most common method is to create a [printers] share. The different options
    used are as follows:


    +   - comment (default: none)—This is just a text string that appears when browsing
    the printer shares. This comment will appear next to the name for the share printers.

    - path (default: none)—This is the default directory that is used to store the
    spooled print jobs directly after they arrive from Windows. Make sure the permissions
    are set to drwxrwxrwt for this directory. You can do this with the command: chmod
    1777 /var/spool/samba. This ensures that print jobs are spooled to that directory.
    The ''t'' ensures that users can delete only their own print jobs.'
