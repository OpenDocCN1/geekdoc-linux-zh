  md: '# Samba Configuration Options


    There are many Samba configuration options or compile options that are performance-related.
    This section goes through some of them and comments on whether they are worth
    changing. Note that with all the the different performance options described here,
    it is up to you to try them out. Some work, some may not. Some even make things
    worse if you change them! There are so many different variables, such as what
    the hardware limitations are, and what other tasks the server is doing other than
    file serving. There is no way to make things much faster. Experiment and see what
    works for you.


    # Compile Options


    There is experimental code in the Samba source that opens files using memory mapping.
    This means that the file on disk is mapped to a region of memory, which in theory
    makes it faster to access. To enable memory mapping, you must recompile Samba.
    Run the configure program like this:


    ```

    # ./configure --with-mmap

    ```


    You may find that the memory mapping support makes no difference in your environment
    or could even make performance worse. The only way is to try it and see!


    # Socket Options


    Quite a few TCP socket options are available that may improve performance. The
    various socket options currently supported by Samba are as follows:


    +   * SO_KEEPPALIVE

    * SO_REUSEADDR

    * SO_BROADCAST

    * TCP_NODELAY

    * IPTOS_LOWDEELAY

    * IPTOS_THROUGHPUT

    * SO_SNDBUF (integer argument)

    * SO_RCVBUF (integer argument)

    * SO_SNDLOWAT (integer argument)

    * SO_RCVLOWAT (integer argument)


    Of all these options, the last four can take an integer argument (like =4096),
    and the rest can optionally take a 0 (to disable) or 1 (to enable). If no argument
    is specified, it is assumed you want to enable it.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Chapter 11 · TUNING SAMBA FOR BETTER PERFORMANCE 195


    By default TCP_NODELAY is turned on. In many environments it significantly speeds
    up Samba systems, but this is not to say that it does for all systems. If you
    want to turn TCP_NODELAY off, you can put this line in smb.conf:


    socket options = TCP_NODELAY=


    And you can also combine it with other options:


    socket options = TCP_NODELAY= IPTOS_LOWDELAY


    or:


    socket options = TCP_NODELAY IPTOS_LOWDELAY


    A configuration combination that many people have had success with in the past
    is


    socket options = TCP_NODELAY SO_SNDBUFF=8192 SO_RCVBUF=8192


    But again, your mileage will vary.


    These options are generally operating system-specific, so check out their behavior
    on your system before attempting to use them. Trying setsockopt might help.


    # Optimistic Locks (Oplocks)


    Optimistic locking (oplocks) is the Microsoft method of doing file locks and is
    supposed to speed up performance, but in reality it can cause performance problems
    in some cases, especially with older Paradox and Access databases. Sometimes,
    oplocks turned on cause a performance increase, whereas sometimes it will cause
    performance problems. By default oplocks are turned on. You should turn them off
    only if you are having performance problems and you want to see whether turning
    them off fix it.


    There is also a parameter called level2 oplocks. This is turned off by default
    but will be changed to on by default in a future release. Both parameters are
    share-based. For more information on how oplocks work, see the following sidebar.


    Note that there is also a parameter called fake oplocks. Do not use it! It has
    been deprecated and will be removed in a future release of Samba. It was originally
    put in real oplock support was not part of Samba.


    # Optimistic Locking 101


    Here''s a brief description of how optimistic file locking works, which may make
    things clearer and help you when you are tuning your server.


    When a client opens a file in a nonexclusive mode, the redirector will request
    an exclusive optimistic lock (oplock) of the entire file. As long as no other
    process has this file, the oplock is granted. Currently, the oplock allows the
    client to perform read-ahead, write-behind, and lock caching for that file.'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'Now when another process requests access to the file, the original process
    is asked to either break oplock, or break to level ii oplock. Level ii oplocks
    allow multiple clients to cache their read data locally because they know that
    no other process is currently writing to the file. As soon as a client sends an
    SMB write frame that will modify the contents of the file, all clients with the
    file open with a level ii oplock will be told to invalidate their cached data
    (because it may have changed), flush any writes and locks they may have queued,
    and release their oplock or close the file.


    Level ii opportunistic locks are great for data that gets read-only, like executables.
    It allows clients to cache the file locally without sending SMB requests for parts
    of the file that are needed.


    # read size


    The read size parameter is used to tune the way Samba tries to make efficient
    use of time between the data leaving (entering) the network to the time it hits
    a disk (or reads from a disk). For example, when Samba does an SMB read operation
    of a file from disk and the amount of data being transferred is larger than the
    value of this parameter (default 16384), it begins writing data to the network
    before it has completed reading from the disk. In general, this parameter will
    only be of use if the speeds of network and disk access are similar. There is
    no one optimal value; try it and see what happens in your environment.


    # max xmit


    This is the maximum packet size that Samba will be able to negotiate. The default
    is 65535. Sometimes, smaller values can make your Samba server faster.


    # strict sync


    Windows applications and UNIX systems have two different understandings of what
    a "sync" means. In the Windows world, many applications want to do a sync to disk
    when they really mean they want to flush the buffer contents to disk. The sync
    in the UNIX world means suspend all processing, and flush kernel disk buffers
    to disk, which is slow! So, when a Windows client is connected to a Samba share
    and tells it to sync to disk, Samba suspends and flushes all disk buffers to disk,
    which badly impacts performance on the UNIX server. The default value of strict
    sync is no, which causes Samba to ignore all requests to sync, which is usually
    what you would want.


    # sync always


    The sync always parameter is similar to strict sync. This parameter controls whether
    writes are written to disk before the system call returns. For this parameter
    to have any effect, strict sync must be set to yes.


    # debug level


    Amusingly enough, many people complain about Samba performance when their debug
    level is to an unusually high number! The more logging you do, the less performance
    you should expect out of your Samba server. Set this to 0 (the default), unless
    of course you need to do some debugging.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Chapter 11 • TUNING SAMBA FOR BETTER PERFORMANCE 197


    # read raw


    The read raw parameter controls whether or not Samba will support raw SMB requests
    when serving data to a client. These raw reads support packet sizes up to 65535,
    which generally gives a big performance boost. However, there are some clients
    out there who are incapable of handling this much data at once, for these clients
    you need to disable this parameter. read raw is set to yes by default.


    # getwd cache


    getwd cache is used to control whether or not to use a caching algorithm to reduce
    the time taken to get the current working directory (getwd()). By default, it
    is turned off, but sometimes- there is a large performance boost if you turn it
    on.


    # widelinks


    If there are links in a directory tree that point to some place in the file system
    that is not shared out, the wide links parameter controls whether these links
    should be followed. By default it is set to yes; however, when set to yes, it
    can impact your server''s performance due to the extra system calls required for
    the checks. If you are running into performance problems, you may want to set
    this to no.


    # Client-Side Tuning


    If you experience very slow network access to your Samba server, a lot of the
    problem will be with your client. My first suggestion is to check how many protocols
    you have bound to your network adapter. You should only have one, TCP/IP Protocol.
    If you have others, remove them because having more than one protocol will affect
    performance. If that does not fix your problem, try removing your TCP/IP protocol
    and then reinstalling it. Remember to reboot in between, and also restart your
    current service pack after you reinstall the protocol. In Windows 9x systems,
    if you have the Novell client installed and you do not need it, remove it. It
    has been known to cause problems in the past as well.


    If you have problems, you may need to tune the TCP/IP parameters of your NT. See
    TCP/IP & NB Configuration Parameters for Windows NT.. If you have problems with
    NT on a 100MB Ethernet connection, check out the article Q169789. If you have
    network connection problems with your Windows 9x clients, check out the article
    Q192534. If you have a problem with NT over a WAN link, this article might be
    of interest: Q104502. For a list of other TCP/IP parameters that might be changing
    on NT, see Q102973 and Some LAN Manager tuning values can be found in article
    Q102630.


    Does not seem to be much in the way of Windows 9x tuning. You can try searching
    the Microsoft KnowledgeBase yourself at http://support.microsoft.com to see if
    there''s anything new.'
  merge: -1
