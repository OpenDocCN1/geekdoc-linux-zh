  md: '# SAMBA PRIMER PLUS


    +   * Acts as an SMB server

    * Performs NetBIOS Name Resolution

    * Performs user authentication

    * Provides Computer Browser service

    * Performs domain login capabilities for Windows 9x and Windows NT clients


    # SMB Server


    The core of the Samba suite of programs is the Samba daemon, *smbd*. Essentially,
    Samba speaks a dialect of the NT LM 0.12 protocol, but of course can also speak
    all the earlier LANMAN dialects as well if other clients need to talk to Samba
    servers.


    # NetBIOS Name Resolution


    SMB relies on some type of naming services available so that it can map server
    names to a network address. For historical reasons, SMB requires NetBIOS for its
    service name. NetBIOS itself is not a protocol, although some people mistakenly
    refer to it as one—it is a network programming Application Programming Interface
    (API). There are two Requests For Comments (RFCs) that describe how NetBIOS should
    operate in a TCP/IP environment (RFC 1001 and 1002). 1.2 shows where SMB and NetBIOS
    fit into the standard OSI network stack.


    FIGURE 1.2

    SMB and NetBIOS in the traditional network stack.


    | Applications |

    | SMB |

    | NetBIOS |

    | TCP/IP NetBEBEUI IPX/SPX |

    | Physical Network |


    All Windows machines have what is called a NetBIOS name, which is 16 bytes long.
    The first 15 bytes are an ASCII name, and the 16th byte at the end is reserved
    for describing the service that is advertising the name on the machine. Each NetBIOS
    application is between `<00>` and `<FF>` that is unique for that application and
    is called a NetBIOS resource type. Each Windows machine has what is known as a
    NetBIOS Name Table. Entries in name on the machine, which is designated by the
    NetBIOS resource type code, and the username of the currently logged in user (if
    someone is logged in at the time you do a NetBIOS name listing). You can get a
    NetBIOS listing of any computer on your local LAN by simply entering the `nbtstat`
    command and giving a `<netbios name>` as the argument, as in the following:


    ```

    C:\nbtstat -affy

    NetBIOS Remote Machine Table

    ```'
