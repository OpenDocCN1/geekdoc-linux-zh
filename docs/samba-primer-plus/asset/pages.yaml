    Q: I am trying to connect from Windows, but I get "The network path was not found."

    A: Most likely you have a name resolution problem. Let''s say you are trying to
    connect to \//googey\tmp. If you are running Windows NT and have a DNS server
    available, verify that the Enable DNS for Windows Resolution check box is checked
    in your network properties, and try this insert:


    ```

    C:\ net use * \//googey\full.domain.name\tmp

    ```


    If this works, your DNS lookups are fine and NetBIOS lookups are the problem.
