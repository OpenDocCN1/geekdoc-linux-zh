  md: '# ABOUT THE AUTHOR


    Matthew Gillard has been working in the Information Technology field as a consultant
    for Cybersource Pty. Ltd. for the past five years. He has experience working for
    a wide range of firms, from private multinational organizations to large government
    departments. Matthew specializes in UNIX and Windows NT systems administration,
    but is becoming more involved in security-related projects. He has been a contributing
    author for Red Hat Linux 6 Unleashed, Linux Unleashed, and a technical editor
    for Sams Teach Yourself Microsoft Exchange Server 5.0 in 10 Minutes. Matthew lives
    in Australia''s national capital, Canberra, with his beloved Catherine.'
