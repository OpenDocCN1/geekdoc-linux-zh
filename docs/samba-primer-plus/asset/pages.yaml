    Q: My Samba server does not start.


    A: The most obvious problem you may encounter is that smbd fails to start or does
    not work as you expect. This could be due to some other process using port 139.
    The smbd daemon cannot bind to this port if another process is already using it.
    You can check if this port is being used by already using the netstat command:


    ```

    netstat -a | grep LISTEN

    tcp    0 * :netbios-ssn      **: LISTEN

    tcp    0 * :smtp              **: LISTEN

    tcp    0 * :192.168.64.domain **: LISTEN

