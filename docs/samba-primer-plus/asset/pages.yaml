  md: 'This is the main SWAT home page. In this place you''ll find all the manual
    pages and some other miscellaneous documentation that is useful for reference.
    You can navigate your way around the SWAT page using the seven buttons across
    the top of the page:


    +   * Home

    * Globals

    * Shares

    * Printers

    * Status

    * View

    * Password


    # SWAT Rearranges your smb.conf File If You Already Have One


    If you already have a Samba smb.conf configuration file that you have spent a
    lot of time configuring, be careful! When you start SWAT for the first time, it
    will remove all comments and include= copy lines and rearrange entries for its
    own use. Make a habit of always reading the README files for a new piece of software
    you are installing. Warnings like this are usually highlighted in an obvious place,
    such as a README file that comes with the software distribution.


    To help you understand what each of the buttons is, you need to know the basic
    structure of the Samba configuration file smb.conf is split into two main sections.
    The first is called the "Global" section where all settings are not share-related
    reside, and the second is the "Shares" section, which defines what disk resources,
    or shares, are available for users. The "Shares" section is further subdivided
    into "Disk Shares" and "Printer Shares."


    The following sections discuss each of the buttons in turn, including giving you
    some sample settings to get yourself a Samba server that does something with a
    minimum of fuss.


    # Home


    As the name suggests, regardless of which view you are in, clicking the Home button
    will always take you back to the SWAT front page with the links to all HTML manual
    pages.


    # Globals


    The Globals button is the first of three buttons that are used to edit each of
    the sections of the smb.conf file. Just to point out the obvious, this is used
    to control all the global variables that affect how Samba is to be configured.
    So that you are not inundated with parameters you change, you have the option
    of looking at the most used variables using the Basic view. The Advanced view
    shows all parameters that can be changed. Figure 3.3 shows what this screen looks
    like. Notice that under the text "Global Variables," there are three buttons:
    Commit Changes, Reset Values, and Advanced View. The first, Commit Changes, is
    used to write all your changes to the Samba configuration file. If you make a
    few changes, then'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'decide, before clicking the Commit Changes that you don''t like, the Reset
    Values button will reset all values back to where they were after the Commit Changes
    button last clicked. If you want to see all modifiable parameters, click the Advanced
    View button. If you do this, the Advanced View toggles to Basic View, so if it
    looks too daunting, you can go back to Basic view!


    # Figure 3.3


    The Globals view.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_50_0.png)


    All variables can be changed in one of two ways. You can enter text, for example,
    if you were changing the workgroup. Or you can use a pop-down list of all the
    different values available, for instance, setting the security variable. At any
    point, you can get help on what a variable is used for by clicking the help link
    to the variable name. This takes you to the relevant section of the smb conf manual
    page. If you have changed a parameter at some point and you want to set it back
    to the Samba default, click the Set Default button and it will take care of that.


    Here are some steps for you to follow to start your own Samba server:


    +   1. At the workgroup variable, enter your company name. If you are at home,
    enter HOME. You can only have a workgroup that has a maximum of 15 characters.
    If your company name is longer than this, abbreviate.


    +   2. At the hosts allow variable, you have the option of entering a range of
    IP addresses that are allowed to access your Samba server. If you are at home
    and connected to the Internet occasionally and all your home machines are networked
    without a firewall, you will almost want to add something like: localhost, 192.168.0.0/25.255.255.0,
    by replacing 192.168.0.0 with your home subnet. This disallows any connections
    other than the one you specified. This means any intruders from the Internet trying
    to break into your Samba server will be locked out.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '3. Finally, if your company already has WINS set up on a Windows NT network,
    you can enter the IP address of the WINS NT box down the bottom at the variable
    wins server. This causes nmbd to register with your organization''s WINS when
    it starts up, which allows you to browse the Samba server using any of your Windows
    boxes if you are on a different network segment to the Samba server, and also
    allows NetBIOS names to be looked up from the Samba server using your current
    WINS infrastructure. If you have only a simple network at home, it is safe to
    leave this blank.


    4. Click the Commit Changes button to direct SWAT to write your changes to the
    Samba configuration file.


    # Samba


    Clicking the Shares button opens a screen where you define the disk resources
    you want to make available to your users. Initially this screen will look like
    that in Figure 3.4


    # Figure 3.4


    The Shares view.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_51_0.png)


    If you have not run SWAT previously, there will be no shares defined. Adding a
    share is simply a matter of entering the name which you want the share to be known
    as in the text box. For example, if I enter tmp (so it can be accessed later with
    \unixbox\tmp), and click Create, SWAT brings up some variables I can set for this
    share. These are the called share variables. This will look like Figure 3.5. As
    you can see, the layout is very similar to the Globals screen when you have online
    help available, and at an Advanced view button The main differences are that there
    are different variables to set, and at the top of the screen you have a pop-down
    list of shares you have defined, where you can add more shares or delete existing
    shares.'
  merge: -1
