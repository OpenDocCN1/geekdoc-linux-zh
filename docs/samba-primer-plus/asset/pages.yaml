  md: '# Adding Samba Users and Groups to ACLs on

    NTFS File Systems


    One of the other interesting things you can do with Samba as your PDC is to apply
    your Samba users and groups to your Windows NT ACL lists for files and directories.


    As administrator, create a directory on your NTFS partition or your Windows NT
    machine called Marketing. Create a group on your Samba server (/etc/group) called
    marketing. As a member of this group one of the users in smpasswd file. Modify
    the ACL on this directory you created and click Add. You will get a list of groups
    and users from your Samba domain that you can add to the ACL for this. Choose
    the group you created, martking, as shown in Figure 7.16.


    FIGURE 7.16

    Modifying the permissions of a directory on

    NTFS permission.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_145_0.png)


    Click OK. Now log out, and log back in as the user you added to the marketing
    group. You should be able to put files in there. If you log in again as a user
    who is not in the group, that user should not have any access to the directory
    whatsoever.


    # Server Manager


    In a Windows environment, Server Manager provides a means to tell at a glance
    who is connected to the server, what resources have open files, the resources
    are available, and Server Manager in a Samba environment does exactly the same
    thing. There are some functions that are not implemented at the time of this writing.
    These unimplemented functions include the ability to disconnect users and close
    resources, and the Replication and Alerts buttons in Server Manager. The best
    way to explain how Server Manager can do for you is by running through an example.


    The Samba server in this example is called GOOFEY, and is PDC in the domain TESTDOM.
    First, on your Windows NT machine, go to Start, Programs, Administrative Tools,
    Server Manager. Server Manager will start up and a list of all the servers and
    workstations in your current domain will show up. Click Computer, Select Domain
    and type the name of your Samba server preceded by two backslashes, like \\GOOFEY
    in the example in Figure 7.17.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT


    # FIGURE 7.17

    Selecting a server name in Server Manager.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_146_0.png)


    Click OK, and all servers in the domain that your Samba server is a primary domain
    controller for will appear, as shown in Figure 7.18. In this example there is
    only one server in the domain, which is the Samba server itself. If your Samba
    server is a PDC, it will be specified as a Primary in the Type field. You will
    also notice that Server Manager thinks Samba is Windows NT 4.2. Believe it or
    not, this version number can be changed! in smb.conf you can add a variable, announce
    version. By default it is 4.2. The smb.conf page recommends against changing this
    parameter.


    # FIGURE 7.18

    Browsing a Samba PDC in Server Manager.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_146_1.png)


    With Windows NT servers, you can use Server Manager to perform a number of useful
    administrative functions on your Samba server. You can do things such as send
    Windows messages to connected users, use SMB server statistics, get a list of
    currently connected users to the Samba server, see the number of connections to
    each share, and see what files smbd has open.'
  merge: -1
