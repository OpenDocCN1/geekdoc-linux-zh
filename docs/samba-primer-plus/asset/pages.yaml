    your users.


    # Troubleshooting Samba as a Domain Login Server


    You may come across some problems in the process of working through this chapter.
    This section discusses a couple of the most common issues that are fairly easy
    to remedy.


    If you see the screen in Figure 6.10, you have either entered the wrong password/username
    combination, or you are using a Windows 9x system with encrypted passwords and
    are not using encrypted passwords on the Samba side. If this is the case, enable
    Samba encrypted passwords, or enable plaintext passwords in Windows ("Configuring
    Samba as a Domain Login Server," earlier in this chapter).


    FIGURE 6.10


    Logon incorrect.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_123_0.png)


    You may get the message shown in Figure 6.11. This error means what it says: Windows
    cannot find a domain server to authenticate you to. This can happen for a number
    of reasons:


    +   - You may not have configured the Windows WINS client correctly, either by
    putting an invalid IP address in, or none at all.

    - You may have put the right address in the Windows WINS client, but your Samba
    server may not be configured for WINS support.

    - Your Samba server might be on a different subnet to your Windows machine and
    you expected them to be on the same subnet. If this is the case, configure WINS
    or use an lmhosts file.'
