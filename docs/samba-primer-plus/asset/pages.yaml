    Q: I try to change my password on the SWAT Web page, but it does not work.


    A: The password-changing feature on the SWAT Web page requires smbpasswd to be
    in (that is, encrypted passwords = yes). You are probably not using encrypted
    passwords and that is why it is failing.


    Q: I try to connect my NT server/workstation to the Samba PDC by clicking the
    Change button and entering the Samba domain name. It says it cannot find a domain
    controller for the domain.


    A: Make sure if you are changing the Windows NT Server or Workstation from another
    domain to the Samba domain that you reboot remove it from the first domain before
    putting it in the Samba domain, and reboot again. This is the only way you have
    to do it.


    If you still have problems, your Windows NT machine is having problems resolving
