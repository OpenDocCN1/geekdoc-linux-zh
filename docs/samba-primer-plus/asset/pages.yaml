  md: 'This chapter also discussed the new development model that the Samba team is
    using. There used to be two Samba development trees: one for the current series
    of releases (2.0.x), and another for the next major version (called the 2.1 development
    head). The new CVS tree is called Samba TNG. It contains bleeding-edge work and
