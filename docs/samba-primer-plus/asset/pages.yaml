- img_proc: true
  md: '# Master Browser Elections


    The Master Browser role is allocated during a browser election that happens on
    a per subnet basis, when one of three things happens:


    +   * A computer cannot find its master browser at startup.

    * A computer determines that a master browser of a subnet has disappeared.

    * A computer running Windows NT starts (Windows NT is a preferred master browser).


    Each operating system is given a weighting (a host''s current role is also considered
    as part of this weighting) and a special election is run to elect a new master
    browser. If you are interested, this process is documented in Microsoft''s Technet,
    which is online at http://technet.microsoft.com or on CD if you have that available.


    # Tasks a Windows NT Server Fulfills


    A Windows NT server can be one of four different types:


    +   * Primary Domain Controller (PDC)

    * Backup Domain Controller (BDC)

    * Member Server

    * Standalone Server


    As mentioned earlier, there is only one PDC in a domain. The PDC holds the only
    writable copy of the SAM, which is the user account database that determines what
    hosts and users are allowed access to the domain.


    There are usually multiple BDCs that hold continually updated read-only copies
    of the SAM database. Any one of the BDCs or the PDC can authenticate users logging
    on to the domain.


    A member server is a server that is a part of a domain, but sends all domain requests
    to either the PDC or a BDC for verification. A member server does not hold a copy
    of the Domain SAM for security reasons; however, it does its own SAM with the
    default accounts, Administrator and Guest. This Administrator account is known
    as a local administrator and can perform administration duties on this machine
    only.


    The standalone servers do not perform any domain authentication; they can be file
    servers, database servers, Web servers, application servers, print servers, or
    any other type of server that an organization needs. The four types of servers
    are the backbone of Windows NT Domain. Samba can perform three of these four tasks:
    PDC, Member server, and standalone server. BDC support is slated for version 2.1
    of Samba, which should be out later this year.'
