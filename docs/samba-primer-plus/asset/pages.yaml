    # Turning On Logging


    A debugging resource that is probably not used enough often is the logging capability
    of the Samba server. You can specify the debug level of smb.conf with a line like
    this


    debug level = 3


    Usually, level 3 or 4 is the best level to use. Anything higher than that is for
    Samba developers to really see what is going on behind the scenes! If you have
    a problem that you cannot solve, you probably want to choose one of the higher
    levels (maybe 6 or 7), and send the debug logs to the technical mail list (see
    the latter section "Samba Help Resources").


    You also need to know where your samba logs will be. Check your smb.conf file
    for a line like this:


    ```

    log file = /var/log/samba.log%m

    ```


    This says that all logs are generated for each machine that Samba talks to. For
    example, when the log will be


    ```

    log file = /var/log/samba.daffy

    ```


    An example of debug when using smb.conf might look something like this:


    ```

    [root@goofey #] smbd -d 4

    Added interface ip=192.168.6.44 bcast=192.168.6.15 mask=255.255.255.240

    Client started (version 2.0.5a).

    resolve_name: Attempting hosts lookup for name daffy<0x20>

    getlmhostsnt: lmhost entry: 127.0.0.1 localhost

    resolve_name: Attempting host lookup for name daffy<0x20>

    ```'
