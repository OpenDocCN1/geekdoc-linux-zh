    # Testing Your Samba Configuration


    You can test your Samba configuration without even using a Windows machine, believe
    it or not! Samba ships with a nifty program called smbclient. smclient is specially
    designed for testing your Samba configuration without having to go to a Windows
    machine to do it. If you'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'are familiar with using the command-line version of FTP, then you would quickly
    get it using smbclient''s interface because they are quite similar. smbclient
    was originally created as a tool for the Samba development team so they would
    not have to continually use Windows systems to test the various Samba features.
    You can easily use smbclient in scripts for automatic file transfers and to remotely
    back Windows machines to a UNIX tape drive.


    The following are some features of smbclient:


    +   - It can connect to a share on any machine capable of being an SMB-based fileserver.
    This includes but is not limited to Windows NT, Windows 95/98, Samba servers,
    and any of the many commercial servers available today.

    - It offers an easy-to-use interface, similar to FTP, to navigate around a share''s
    directory structure, being able to create directories, retrieve and send files.

    - It can retrieve a list of shares available on a remote SMB server.

    - You can connect to a printer resource with smbclient, which is handy for connecting
    printers that are available only on Windows boxes.

    - If you are familiar with the UNIX tar command, you can connect to a remote resource
    with smbclient and tar the contents so you can easily back up data from Windows
    to UNIX if you need to for whatever reason.

    - smbclient functions are easily performed in scripts for unattended batch functions.


    # Using smbclient to Test Your Samba Configuration


    It is worth your use to smbclient to do an initial test of your configuration
    before you let your users loose on. It is a very simple process. First, log in
    to a command prompt of your UNIX system as a user who will have access to Samba,
    for example, your own user id.


    Next, start up smbclient like this:


    ```

    matt@pinkie$ smbclient //localhost/tmp

    ```


    Replace tmp with the username you created earlier. Also, localhost may not work
    correctly, depending on how your UNIX machine is configured, so you may need to
    enter your server name. You will then get a password prompt. Enter your regular
    UNIX password. You will see something like this:


    ```

    matt@pinkie$ smbclient //localhost/tmp

    Added interface ip=192.168.66 bcast= nmask=255.255.255.240

    Password:

    Domain=[HOME] OS=[Samba 2.0.3]

    smb >

    ```


    You displayed the domain the server belongs to, the operating system it is running
    on, and the Server comment field. You then get a prompt, dissimilar to your regular
    UNIX prompt. The commands available to you are a hybrid of commands you are familiar
    with both the UNIX command line and FTP clients. Assuming you have the appropriate
    permissions, most'
  merge: -1
  pgno: 56
