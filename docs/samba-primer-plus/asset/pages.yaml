  md: '# CHAPTER 15


    # A LOOK AT SAMBA''S FUTURE


    You will learn about the following in this chapter:


    +   * Which PDC functions are to be completed for the next release of Samba

    * When Samba 2.1 is likely to be released

    * When Windows 2000 support is likely to be implemented, and what features it
    will contain

    * The new philosophy of the Samba development team


    His chapter gives you an insight into what features will be implemented in Samba
    over the next few years. The chapter covers areas such as the missing PDC functionality,
    Windows 2000 support, LDAP support, and where the future of Samba development
    is going. The information in this chapter is based on the author''s research and
    what he thinks will happen next in the Samba development cycle.


    # When Will Samba 2.1 Be Released and Features Will It Contain?


    The question on everyone''s lips is: "When version 2.1 of Samba be released?"
    No one can really answer that. Samba 2.1 should be out sometime in the first half
    of 2000.


    One of the most awaited aspects of Samba 2.0 was its ability to be a Primary Domain
    Controller (PDC). Unfortunately, the release version of Samba 2.0 did not behave
    as expected and a lot of things that were supposed to be working were not. Additionally,
    there are a number of Windows NT functions that are not present in Samba 2.0.
    A list of features that do not exist or are broken in Samba 2.0 follows:


    +   * Ability to act as a full Primary Domain Controller (PDC). This was originally
    a feature planned for 2.0, but unfortunately it was not implemented. Never use
    the PDC functionality that is currently part of 2.0, or you may find that it does
    not behave as you expect or exhibits inconsistent behavior. The working version
    of the PDC functionality is a part of 2.1 development (alpha) tree, which you
    can use until the production 2.1 code is released.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '+   BDC replication. Samba can operate as a Backup Domain Controller (BDC)
    in a Windows NT domain or a Samba domain. This means that you will be able to
    install Samba as a BDC in an existing Windows NT domain, so it can keep a backup
    copy of the accounts database like a regular Windows NT server. You can also run
    a Samba PDC and run Windows NT DCs in the same domain, so that you have backup
    copies of the accounts database.


    +   User Manager for Server Manager support. User Manager allows you to manage
    accounts and groups on your Samba server, and Server Manager allows you to domain-wide
    administration tasks, such as viewing and modifying the various machine accounts
    that are members of the domain, seeing certain file statistics such as many and
    what files are open and how many users are connected, and sending broadcast messages
    to all users connected.


    +   Windows NT trust relationships. Windows NT domains can operate with each other.
    When trust relationships support is included in Samba, you will be able to have
    two or more separate domains. An example could be a Samba domain and a regular
    Windows NT domain. When a trust relationship is in place, these two domains will
    be able to share information between one domain and the other to share resources
    with one account required in either domain. More information on trust relationships
    is found in Chapter 7, "Samba in Windows NT/2000 Domain Environment."


    +   Ability to manipulate Access Control Lists (ACLs) on Samba file shares. This
    is already partially implemented and allows a mapping of UNIX file system permissions
    to Windows NT, like ACLs. In the future you will be able to manipulate the file
    and directory permissions on a Samba file share just as if it were a regular NTFS
    file, including being able to add any number of access control entries (ACEs).


    +   Full Windows NT-like printing subsystem. Currently Samba uses the old LANMAN
    method of printing. This method does not take advantage of the Windows NT method
    of printing, which uses a named pipe \pipe\spooler to talk to the printing subsystem.
    The code for this feature is complete and should it into Samba 2.1.


    This list should give you some idea of what features Samba 2.0 was going to include
    that were left out due to lack of time.


    There have been moves on the Samba developers mailing lists to define exactly
    what should be included for a 2.1 release, and the general consensus has been
    given to the mayority of the missing PDC functionality finished as described.


    # Operating Samba with Windows 2000


    The major Microsoft operating system that has finally been released, Windows 2000,
    is what people are talking about. Now on the Samba mailing lists are wondering
    when Samba will operate properly with Windows 2000. The answer to that is question
    that it depicts'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# New Windows 2000 Features in Samba


    on your definition of "properly." Because there were public betas of Windows 2000
    12 months before it was released, have been many opportunities for people to try
    Windows 2000 and Samba together and see what happens. In the process of doing
    this, interoperability testing problems have been found and corrected. There have
    been reports of people successfully joining a Windows 2000 machine to a Samba
    domain and vice versa. By the time Samba 2.1 comes along, it should support Windows
    2000 in the same way that it supports Windows NT 4.0 currently; hopefully with
    no outstanding issues.


    The next task that is receiving serious attention is to incorporate the new features
    of Windows 2000 into Samba. The main features that are getting this attention
    include the new Active Directory support, Kerberos authentication support, Microsoft''s
    Distributed Filesystem (DFS) support, and the ability to share file systems without
    requiring NetBIOS to be available for name resolution.


    The new Active Directory functionality Microsoft has included with Windows 2000
    should also be fairly easy to add to. Active Directory is Microsoft''s implementation
    of the X.500 standards. This eliminates the security Accounts Manager in which
    usernames and password hashes were previously stored. Now, every in a Windows
    2000 domain will have an entry in the Active Directory including machines, usernames,
    and resources. There is also Lightweight Directory Access Protocol (LDAP) support
    partially implemented in the Samba code; hopefully, it will only be the LDAP functions
    that need to be extended to allow communication with the Windows 2000 Active Directory.


    Kerberos support allows a Samba server to authenticate to a Kerberos IV server
    rather than authenticate using UNIX methods such as NIS or /etc/passwd authentication.
    Support for Kerberos is already incorporated into Samba 2.0, although it is not
    well documented. Note that you have to configure Samba with the --with-krb option
    if you want your Samba server to authenticate to a Kerberos server. Support for
    Kerberos V servers has been incorporated into the latest Samba development trees,
    Samba 2.1 and Samba The Next Generation (TNG). Kerberos has been available as
    part of UNIX systems and others are hoping that the Kerberos implementation is
    standard enough to allow Windows 2000 systems to communicate easily with UNIX
    Kerberos implementations.


    A lot of work has been done over the last few years to get Distributed Filesystem
    (DFS) support into Samba. It is still a compile-time option for Samba 2.0 (--with-dfs),
    but fully this support will be complete for Samba 2.1. Microsoft''s DFS concept
    allows you to create a sharepoint in which each subdirectory is really a share
    to some some other machine. This is similar in concept to having a UNIX file system
    with mountpoints that have NFS mounts from many UNIX NFS servers over the organization.'
  merge: -1
