    tcp    0 * :localhost.domain **: LISTEN

    tcp    0 * :2049              **: LISTEN

    tcp    0 * :635               **: LISTEN

    tcp    0 * :printer            **: LISTEN

    tcp    0 * :linuxconf         **: LISTEN

    ```'
