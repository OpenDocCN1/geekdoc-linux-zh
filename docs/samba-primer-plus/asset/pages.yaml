    dialect of the LAN Manager protocol is selected by the client, the server agrees
    with this dialect, and then the connection to the actual share is initiated by
    DAFFY in frame 12. The first IPC session, which is the Inter Process Communication
    connection. Then the connection to the TMP share is attempted in frame 15. If
    I specified no password, SMB tells the client password must be specified, and
    then the SMB connection attempts to connect again in frame 19. The SMB session
    is successful in frame 21, and the drive is connected to the client.


    Hopefully, that you know what a real SMB session looks like, you will be able
    to compare what you are seeing with what it looks like and make an informed judgement
    about what could be wrong.


    # tcpdump - smb


    If you have no access to the NT Network Monitor, fear not! Use the SMB extensions
    to tcpdump. You can find it at http://ftp.samba.org/pub/samba/tcpdump-called tcpdump-3.4a5-smb,
    which you can patch to the standard tcpdump source distribution. There are also
    precompiled binaries in the binaries directory for Solaris, SunOS, and Linux.


    After you have installed the patch on your system, it is just a matter of running
    it to capture your SMB packets. Try something like this:


    ```

    # tcpdump -1 I eth0 -s 1500 ''port 139''

    ```


    This says listen to interface eth0, be capture the packets to 1500, and all traffic
    that is going to or from TCP/IP port 139. The output of tcpdump is not quite as
    nice as Network Monitor, but it certainly does the job. In some respects it is
    slightly better, as it breaks'
