    ```\n\nThe options you can use are very similar to smbclient, but there are not\
    \ as many of them.\nHere is an example using smbmount to map a drive to a Windows\
    \ system:\n\n```\n# smbmount //goofey/matt -U matt\nAdded interface ip=192.168.66.66\
    \ bcast=192.168.66.15 nmask=255.255.255.240\nPassword:\n```\n\nAs you can see,\
    \ it is a fairly simple process. In the example, the connection is made as a specific\
