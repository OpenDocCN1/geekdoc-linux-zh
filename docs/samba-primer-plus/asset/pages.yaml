- img_proc: true
  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT 141


    You then learned how you can add groups defined on your Samba PDC to regular NTFS
    partition lists. This is quite handy for environments that have file shares on
    NT servers, the domain is controlled by a Samba machine.


    We then went to talk about how you can use the Windows NT Server tools such as
    Server Manager and User Manager for Domains to see SMB statistics, and look through
    all the users and groups defined on your Samba server.


    The last major section of this chapter involved looking at how roaming profiles
    work using Samba as a PDC. You have seen that roaming profiles are enabled by
    default and saved in the user''s home directory under the directory profile. You
    have also learned that should really be changed to some someplace that is dedicated
    to the storage profiles.


    The rpclient utility was quickly reviewed and you learned how useful it can be
    to gain information about your NT machines from UNIX systems. Until now, if you
    needed information as details on registry entry keys, currently connected users,
    and general server information, you needed a Windows machine—but not any more!


    This chapter has given you the information to be able to set up Samba as a domain
    member server or primary controller in a Windows NT/2000 domain environment. You
    also learned that you can do many of the administrative tasks that you can do
    to a Windows NT server, but with the security and scalability of a UNIX server
    running Samba.


    # Review Questions


    +   1. What is a machine trust account?

    2. How do you set up Samba as a member server in an already existing domain?

    3. How do you set up your Samba server as a PDC?

    4. You want to create a group on my Samba PDC called Manufacturing. You have another
    Windows NT server that is a part of the Samba domain that has a share on it you
    want accessed by users in the Manufacturing group. How do you implement this?

    5. Can you use all the normal Windows NT domain tools to manage your Samba server?

    6. Can you implement system policies using your Samba server?

    7. You want to give each user in your company a standard corporate profile incorporating
    the company logo as a background. How do you go about this?

    8. What is the significance of the file NTuser.DAT?

    9. What is rpclient?'
