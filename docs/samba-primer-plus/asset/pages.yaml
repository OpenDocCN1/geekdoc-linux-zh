    Note that the reverse does not hold true in this case. ACME does not trust BITS,
    so there is no way that user accounts in the BITS domain can access resources
    in the ACME domain, which in this case is what should happen. There are a few
    terms you have to come to grips with here. The "trusted" domain is known as the
    accounts domain. The "trusting" domain is known as the resource domain. In the
    diagram you see that the arrow points to the domain that holds the SAM database
    you want to trust.


    A two-way trust is effectively two one-way trusts. In a two-way trust, there are
    separate domains that trust each other, which means that users in both domains
    can access resources in both domains. This situation is pictured in Figure 7.3.
    In this case the domains involved are the United States division of ACME, whose
    domain is called ACME-US, and the Australian division of ACME, called ACME-AUS.
    ACME-US trusts ACME-AUS and ACME-AUS trusts ACME-US. This means that employees
    of each division of the company can access each others'' resources freely without
    requiring extra accounts on either domain.


