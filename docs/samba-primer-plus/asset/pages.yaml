    # Summary


    In this chapter you have learned some of the most interesting (and unusual) smb.conf
    parameters that you can use in your file services to achieve specific effects.


    The chapter started with a discussion on the preexec and postexec parameters.
    These options allow you to execute a UNIX command or script when a client connects
    and disconnects from a share. It was mentioned that this has many uses; a common
    one is to mount a CD when a user connects and unmount when the user disconnects.


    The next section went through the name mangling process and showed how this allows
    DOS and Windows 3.1 clients access to UNIX filenames. It was mentioned that Samba
    uses an algorithm to shorten the name to the 8.3 format required by DOS. You also
    learned which options you may need to tweak the name mangling process.


    We then went through options that specifically affect the way users are handled
    when connecting to a share. You learned that you can force connections to occur
    as a user (force user) or group (force group) and also how to deny users from
    accessing a share (invalid users).


    Next was a discussion on options that affect a share as such as adding a volume
    label (volume) or limiting the number of allowable simultaneous connections (max
    connections).


    Finally, you were taught options that apply to the files on a share. You learned
    some options that hide files but still keep them accessible (hide files) and others
    that hide files and make them inaccessible to the connecting user (veto files).


    # Review Questions


    +   1. You want to make a file share on your UNIX system map to the CD-ROM. The
