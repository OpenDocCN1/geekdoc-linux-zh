  md: '# CHAPTER 8


    # USING SMBCLIENT


    You will learn about the following in this chapter:


    +   - What smbclient is and what it is used for

    - Some common smbclient options

    - How to use smbclient to print to a Windows print server

    - How to use smbclient to back up Windows machines


    The smbclient program is probably one of the most useful utilities available in
    the Samba distribution. It is convenient for debugging when you don''t have a
    Windows machine handy, or even if you do and don''t wish to use it! It can provide
    extra SMB-type services that don''t fit anywhere else. These extra services include
    being able to send Windows Messaging messages to Windows-based machines and sending
    print jobs from UNIX machines to printer shares on Windows machines.


    # The Purpose of smbclient


    smbclient was developed by the Samba team primarily for testing the Samba code.
    It has since developed into a full-fledged smbclient that has an easy-to-use interface.
    If you are familiar with FTP, you will be at home when using smbclient. You can
    effectively connect to any shared resource on any SMB-compliant server and perform
    a number of commands that do different things such as get a directory listing,
    traverse the directories in the share, send and receive files to and from the
    share, and even print to shared resources.


    # Common smbclient Options


    smbclient has quite a few different options. When you execute smbclient with no
    options, you should get output similar to this:


    ```

    $ smbclient

    Added interface ip=192.168.66.44 bcast=192.168.66.15 nmask=255.255.255.240

    Usage: smbclient service [password]

    ```'
