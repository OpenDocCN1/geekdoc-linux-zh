  md: '# CHAPTER 7


    # # SAMBA IN A WINDOWS NT/2000\ DOMAIN ENVIRONMENT


    You will learn about the following in this chapter:


    +   - How to add a Samba server in your NT domain as a member server

    - How to use Server Manager with Samba

    - How to use User Manager for Domains with Samba

    - The different tasks Samba can perform when a PDC role

    - How to set up Samba as a PDC for Windows NT clients using a Samba PDC

    - How to use Windows NT ACLs on your Samba server


    Samba can do many more things in the Windows NT environment than it used to. Until
    the last year or, all you could do with Samba in an NT environment was it purely
    as a file and print server. And of course, Samba could be configured to pass the
    authenticating username/password to an NT domain controller for authentication.
    This was very useful. It means Samba potential users did not need a second account
    on the Samba server; they would still get authenticated by the NT environment
    for access to the Samba resources. However, however, Samba users can go one step
    further.


    This chapter gives you an introduction to Samba in an existing domain environment
    with two new rules. First, you will learn how to use Samba as a member server
    in a domain. Second, you will learn how to use Samba as a Primary Domain Controller
    (PDC). Keep in mind, that most of the PDC functionality is still experimental,
    and full functionality will not be available until Samba 2.1. Also, as it stands
    currently, if you use Samba as your PDC, you cannot have Backup Domain Controllers
    (BDCs) because System Account Manager (SAM) replication is not working in the
    Samba production code; however, it should be covered, which is as the use of the
    standard Windows NT administration tools like User Manager for Domains and Server
    Manager with Samba servers and the information you can gle glean using those tools.
    Finally, you will learn how to set up Windows NT roaming profiles when you have
    Samba as your.'
  merge: -1
