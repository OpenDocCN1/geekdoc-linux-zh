  md: '# CHAPTER 9


    # SAMBA WITH SSL


    You will learn about the following in this chapter:


    +   - What SSL is

    - How the SSL protocol works

    - What a certificate is

    - The significance of a certificate authority

    - How certificate signing works

    - How to generate your own certificates

    - How to compile Samba to include SSL support

    - How to configure Samba to run as an SSL server

    - How to enable client-side certificates


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_176_0.png)


    his chapter discusses how to use the Secure Sockets Layer (SSL) functionality
    of Samba. It begins by discussing how SSL is and why you would want to use it.
    Some new terms are introduced that you will need to know in this section. Next
    is a short discussion on SSL certificates and what they are for. The chapter moves
    on to how go about compiling Samba with SSL support. Then there is a section on
    the Samba configuration options you can set when using SSL, including a sample
    Samba SSL configuration file. Toward the end, there is a discussion on which clients
    you can use to connect to an SSL-enabled Samba server.


    # What Is SSL and How Does It Work?


    SSL stands for Secure Sockets Layer, and is a standard that Netscape put forward
    in the nineties. It was originally intended for the secure transfer of Web pages
    between a Web server and client. Secure is defined in this case to mean that all
    data transferred over the Internet between the Web browser and Web server is encrypted,
    and an authentication protocol is provided so that you know for sure you are talking
    to. The initial design (SSL v1.0) was completed in-1994. SSL v2.0 followed at
    the end of 1994. SSL v3.0 was released in mid-1995, and that is where the standard
    stayed for a few years. Then in January 1999, a proposed'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'extension to SSL v3.0 was released as RFC 2246 (ftp://ftp.isi.edu/in-notes/rfc2246.txt).
    This extension is called the Transport Layer Security (TLS) protocol v1.0, and
    TLS will be used more and more until it succeeds SSL v3.0. Throughout the remainder
    of this chapter, the term SSL will be used refer to both SSL v3.0 and TLS v1.0.


    Since the inception of SSL, it has been extended to many applications. You can
    search through the RFC lists to find emerging standards for TLS working with other
    protocols, such as RFC 2487, "SMTP Service Extension for Secure SMTP over TLS,"
    and RFC 2595, "Using TLS with IMAP, POP3, and ACAP." To give you an idea of how
    SSL fits into the standard host network model, look at Figure 9.1.


    # FIGURE 9.1


    Where SSL fits into the standard host network model.


    | Telnet | FTP | Samba | SMTP | HTTP |

    |---|---|---|---|---|

    | SSL | | | | |

    | TCP | | | | |

    | IP | | | | |

    | Physical Layer | | | | |


    It sits above TCP, which means that after SSL is enabled for a given application,
    all data that passes through is encrypted.


    # Cryptography 101


    There are two general types of cryptography, symmetric and asymmetric. Symmetric
    means that you have a single shared key between two people who want to communicate
    securely. It is usually very fast to process, but you have to share (possibly
    different) key with everyone you want to communicate with. The more people you
    communicate with, the harder it is to manage keys. Asymmetric cryptography is
    also known as public key cryptography. In public key cryptography, you have two
    keys, a public key and a private key. There is a complex mathematical relationship
    linking the two so that you encrypt data with the public key, the only key that
    can decrypt data is the private key, and vice versa. If Alice wants to send encrypted
    files to Bob, Alice gets Bob''s public key, encrypts the data, and sends it to
    him. Bob decrypts that with his private key.


    The great thing about public key cryptography is the relationship between the
    public and private keys. You can give your public key to anyone, but the only
    key that can be used to decrypt data that was encrypted with the public is your
    private one. This solves the key management problem with symmetric cryptosystems.
    For more information on cryptography in general, I recommend the book Applied
    Cryptography by Bruce Schneider (ISBN: 0471170599). It covers cryptography in
    great detail, and includes a lengthy discussion about public key cryptosystems.


    Asymmetric cryptography is used for server and possible client authentication.
    After that done a key is selected by the client and encrypted with the server''s
    public key. The server decrypts it with its private key. Then application data
    is being transferred, it is encrypted using symmetric ciphers because they are
    many times faster than public key ciphers. To make this process easier to understand,
    the steps of the process are listed here:'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Chapter 9 • SAMBA WITH SSL


    +   1. The server is authenticated to the client and optionally the client is
    authenticated to the server.


    +   2. The client selects a key for later using the encrypted session.


    +   3. The client encrypts the selected key with the server''s public key, and
    then sends the resultant ciphercode to the server.


    +   4. The server deciphers the ciphercode with its private key.


    +   5. The data session can now proceed using a single shared key for encryption
    and decryption means of a symmetric cipher. This relies on the fact that the shared
    key is kept private on both the server and client systems. As soon as the shared
    key is compromised, all encrypted communications are compromised.


    +   6. The encrypted session is shut down when both sides have finished communications.


    SSL has many uses. Two common examples are secure transactions such as banking
    and shopping applications where you don''t want a third party snooping on credit
    card or personal information. Of, if you are doing sensitive transactions, it
    is important that the session is encrypted—but you also want to be sure that the
    Web server you are connected to actually is who it is. For all you know, it could
    be else masquerading as your bank, ready to capture your personal banking details.


    SSL solves this problem by introducing the concept of a certificate. A certificate
    effectively adds an identity to a public key. This identity is certified to be
    true by a certification authority (CA). After verifying it, a CA adds a digital
    signature to the certificate. When your browser connects to a secure Web site,
    the Web server serves a certificate to the browser to prove it is what it says.
    This is called a server-side certificate. A server-side certificate authenticates
    the server to the client.


    Anyone can set himself up to be a CA; however, the general public only trusts,
    listed CAs. It depends on the application whether you get your certificate signed
    by a well-known CA, or you create your own CA. For example, if a company has an
    SSL Intranet Web site, it can be that the server''s certificate will likely be
    signed by the company''s own CA. This is in contrast to a bank''s server site
    where the customers will have a high level of confidence that the Web server''s
    certificate has been signed by a publicly trusted CA.


    # An Alternative to SSL: IPsec


    An alternative to using SSL is the new IPsec protocol. This allows secure IP communications
    end-to-end without requiring server and/or client support. This means that you
    will be able to have secure communications between client and the Samba server
    without requiring special SSL versions of the software. All secure communication
    is done in the network layer by the operating system. There are a number of commercial
    implementations of IPsec for Windows 95/98/NT, and Windows 2000 supports it by
    default. Many UNIX variants have IPsec add-ons. For a list of relevant Internet
    Drafts and Request For standards see this Web site.


    ```

    http://www.ietf.org/html.charts/ipsec-charter.html

    ```'
  merge: -1
