  md: '# ABOUT THE CD-ROM


    # Windows 95/98/NT/2000 Installation

    Instructions


    +   1. Insert the CD-ROM disc into your CD-ROM drive.


    +   2. From the Windows desktop, double-click the My Computer icon.


    +   3. Double-click the icon representing your CD-ROM drive.


    +   4. Double-click the file README.TXT to find out what''s on the CD-ROM.


    # Linux and Unix Installation Instructions


    These installation instructions assume that you have a passing familiarity with
    UNIX commands and the basic setup of your machine. As UNIX has many flavors, only
    generic commands are used. If you have any problems with the commands, please
    consult the appropriate man page or your system administrator.


    +   1. Insert the CD-ROM into the CD-ROM drive.


    If you have a volume manager, mounting of the CD-ROM will be automatic. If you
    do not have a volume manager, you can mount the CD-ROM by typing

    mount -iso9660 /dev/cdrom /mnt/cdrom

    NOTE:/mnt/cdrom is just a mount point, but it must exist when you issue the mount
    command. You may also use any empty directory for a mount point if you don''t
    want to use /mnt/cdrom.


    +   2. Navigate to the root directory of your CD-ROM. If your mount point matches
    the example listed above, type


    ```

    cd /mnt/cdrom

    ```


    +   3. Open the file readme.txt with your favorite text editor to find out what''s
    on the CD-ROM.'
