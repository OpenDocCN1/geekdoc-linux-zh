  md: '# SAMBA PRIMER PLUS


    FIGURE 7.9

    Changing file permissions on files located in a Samba share.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_139_0.png)


    If you think about UNIX handles file permissions for a second, you will understand
    how this maps to what you see in the File Permissions dialog box. UNIX has three
    components of a permission bit: user, group and world. Each have three subcomponents,
    (r), (w), and e(x)ecute. Here''s an example:


    ```

    -rw-r--r 1 matt 596 Aug 20 1997 newconf.rtf

    ```


    The user part has read and write permissions and the group and world have only
    the read bit. The user in this case is matt, and the UNIX group is also called
    matt. Some UNIX variants like Red Hat Linux set up each user with a personal group
    because it sometimes makes administration easier.


    The UNIX read permission for this file maps to the Windows NT Everyone global
    group. Because anyone can access this file in UNIX, anyone in NT should be able
    to access it as well. You will notice the first permission in the File Permissions
    dialog in Figure 7.9 is Everyone Read. Note that Windows NT has three more permission
    bits in addition to the standard RWX. The additional permissions are (d)lete,
    change (p)permissions, and Take (o)ownership. The Special Access (R) you notice
    in the figure designates that the combination of permissions (read in this case)
    do not map to one of the Windows special names such as List, Read, Add & Read,
    Change, or Full Control. You will find that all UNIX permissions probably map
    to Special Access because of the differences between the two systems.


    The UNIX group, matt, is the next entry. Now, because the group matt is located
    on the Samba server only, it is classed as a local group. Because the UNIX permission
    is readonly for the matt group, it is also read-only for the Windows NT equivalent
    local group.


    Finally, the user permission is mapped. In this case, matt is the user, so this
    permission is mapped as a Windows NT user permission because of the face next
    to the username. The UNIX user permission is read and write, the Windows NT user
    permission is set accordingly.


    A small note about Windows NT groups: you can distinguish between global and local
    groups by the icon that sits to the left of the group name. If the icon contains
    a picture of the earth, it is a global group; alternatively, if the icon contains
    a picture of a person and a computer, it is a local group.'
