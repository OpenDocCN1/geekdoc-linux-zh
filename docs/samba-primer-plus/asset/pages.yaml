    # Specifying the IP Address of the SMB Server (-I)


    Normally when connecting to a resource, the NetBIOS is resolved to an IP address
    for the NetBIOS session-level connection to kick in. For example:


    ```

    $ smbclient //daffy/ntshare

    ```


    In this example, daffy is the NetBIOS name and it is resolved using the normal
    resolution methods to an IP address. Sometimes, however, this is not possible.
    An example of when you may need to use the -I argument when the DNS name of a
    server does not match the NetBIOS name. If this is the case and you use the -I
    option, then the TCP/IP session is connected to the IP address specified, and
    from then the normal NetBIOS name is used to finish the connection. Here is an
    example of specifying an IP address on the command line, which will cause smbclient
    to skip the name resolution:


    ```

    $ smbclient //daffy/ntshare -I 192.168.66.6

    ```


    Here, smbclient will connect directly to port 139 on the host with IP address
    192.168.66.6. After the TCP connection is made, the NetBIOS session will be made
    with the name DAFFY as usual.


    # Specifying a NetBIOS name (-n)


    If you need to change the name of the host that smbclient is running, you can
    do this easily with the -n command-line parameter:


    ```

    [mattdonald]$ smbclient //daffy/ntshare -n

    ```


    Without the -n option, this command would be seen to come from a host with the
    NetBIOS name donald, but as written, the request to connect will instead be seen
    to come from a host that goes by the NetBIOS name pluto. This parameter is rarely
    used, but on those infrequent occasions, it is helpful to know that you can use
    it if you need to.


    # Default Directory to Change to (-D)


    This option is used to change the working directory that will be dropped into
    when smbclient connects to the server. The argument is simply a valid directory
    path that exists in the share. An example where you will changed into the directory
    apps follows:


    ```

    $ smbclient //daffy/ntshare -D

    ```


    Added interface ip=192.168.66.4 bcast=192.168.66.255 nmask=255.255.250

    Password:


    ```

    Domain=[HOME] OS=[Windows NT 4.0] Server=[NT LAN Manager 4.0]

    smb: \apps\

    ```'
