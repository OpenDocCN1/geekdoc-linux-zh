  md: '# CHAPTER 11


    # TUNING SAMBA FOR BETTER PERFORMANCE


    You will learn about the following in this chapter:


    +   - How to determine whether performance problems are Samba-related or due to
    some other factor

    - What opportunistic file locking is and how you can use it to speed up file operations

    - What tuning you can do on Samba client to improve performance


    The good thing about Samba is that it comes to pretty well self-tuned. The options
    are tuned to the values that are appropriate for most server configurations; however,
    this does not mean they are appropriate for all configurations! This does mean
    you can get Samba up and running with a minimum of fuss and without having to
    delve deeply into the Samba configuration file. This chapter will give you some
    hints and tips on how to make your Samba server run faster


    +   - Pointing out obvious factors when choosing and configuring a server

    - Showing you different Samba configuration parameters that may make things faster
    for you

    - Showing you how to configure your client for better networking and SMB performance


    # Choosing a Machine to Run Samba on


    Most people run Samba on a Linux machine running on a PC server. However, today
    Linux can also run on Sun hardware, Compaq Alpha hardware, and countless others.
    This section presents the information from a PC perspective, but many of the tips
    (such as operating system layout) apply equally to other systems such as SUNs
    or HPs as well.'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'The main factors to look at are as follows:


    +   * CPU

    * Memory

    * Hard drive

    * Network

    * Tape drive


    The obvious factor is to choose a reasonably fast CPU. The simple rule is: Purchase
    the fastest machine you can afford. For many companies, this will be a high-end
    Pentium III, and for others, the old Pentium 66MMX out the back will suffice.
    Also consider how many users will be connecting to your Samba server in this equation.
    There is no point in buying a high-end system if you will have only 10 users connecting
    at a time. However, if you will be using it for your corporate file server with
    hundreds of connections during the day, you could probably do with a reasonably
    high-end system.


    Regarding memory, a rule of thumb that may or not work for you is to allow 128MB
    of memory for the operating system, plus 1MB for every user who will be connecting.
    This may be an overestimation in many circumstances, but it is better to overspecify
    your system rather than underspecify it. Also allow some room for growth.


    Your next decision is to choose the bus type that your hard drives use, SCSI or
    IDE. With hard drives, remember that they are cheap these days! Even SCSI drives
    are only slightly more expensive than their IDE counterparts. For scalability
    you cannot go past SCSI. You can fit up to 15 disks per SCSI chain (the chain
    limit is virtually limited to your hardware)—this is in contrast to IDE, which
    has a maximum of four disks over two channels. Most likely you will have a SCSI
    port to connect the device to, so my recommendation for any serious system with
    many users is SCSI. For smaller systems (less than 100 users), you may not be
    able to afford the cost of SCSI, so IDE would be sufficient. In either case, buy
    as much as you can afford whether you need it or not, because if you buy more
    disk space, the applications quickly eat it up.


    The next decision is to choose your network card. If you already have a 100MB
    Ethernet infrastructure in place, get a good quality 100MB Ethernet card with
    your server. It will make a lot of difference, especially if you have many people
    trying to access the server. The 100MB card will allow you to serve more people
    at one time. Otherwise, the normal 10MB Ethernet would suffice, but make sure
    you get a 100MB/10MB combo card. If you are only using 10MB now, you might upgrade
    in the future to 100MB (if it is getting cheaper), so you can switch your server
    to 100MB immediately without buying new hardware.


    I cannot emphasize enough: Buy a tape drive with your system! You will need to
    back up your system and file services for your users. There is nothing worse than
    having a system with no backup regime. You would not believe the number of companies
    out there that don''t bother to back up their servers! Do a test restore every
    couple of weeks from a random tape to make sure backups are working as they should.'
  merge: -1
  pgno: 207
- img_proc: true
  md: "# Checking Performance\n\nThe first question you may want to ask yourself is:\
    \ How do I know I have bad performance?\nThe next question you may want to ask\
    \ is: Is it Samba that is providing the bad performance?\nOther factors that people\
    \ often forget about\n\n+   - What else is my Samba server doing? Perhaps it is\
    \ too overloaded with many interactive users using all the CPU, and the SMB users\
    \ are left with whatever CPU is left over.\nCheck for processes using large amounts\
    \ of CPU.\n- Is my network problem? Check that your network collisions are not\
    \ too high:\n  `ifconfig eth0`\n\n```\nlink encap:ethernet Hwaddr 00:08:A7:F1:1F\n\
    addr:192.168.66.64 Bcast:192.168.66.15 Mask:255.255.255.240\nUP BROADCAST MULTICAST\
    \ MTU:1500 Metric:1\nRX packets:66847898 errors:4 dropped:0 overruns:0 frame:211\n\
    t packets:114893973 errors:0 dropped:0 overruns:0 carrier:0\ncollisions:7554\n\
    Ethernet:10 address:0x03\n```\n\nIf they are, your network is probably overloaded,\
    \ or you have a faulty network card somewhere the segment. One way to check network\
    \ collisions is to check the value in one time. Transfer a large file over the\
    \ network and check the value again. If it has changed significantly, you are\
    \ likely to have a network problem.\n\n+   - Compare your Samba performance with\
    \ that of another TCP-based protocol such as the File Transfer Protocol (FTP).\
    \ FTP should be slightly faster because it uses a less complex protocol than Samba,\
    \ but it should give you an idea of what sort of maximum file transfer values\
    \ you could expect in your environment.\n\nFinally, an interesting Linux tuning\
    \ tip that Jeremy Allison posted on the Samba mailing list is to increase the\
    \ maximum open files from 1024 to 6000 (or however many files you expect to be\
    \ open at once) and the maximum indexes in memory from 3072 to 12000 (tune this\
    \ to match what you set file-max). For the Linux 2.0.x series, you do it like\
    \ this:\n\n```\necho \"6000\" > /proc/sys/kernel/file-max\necho \"12000\" > /proc/sys/kernel/inode-max\n\
    ```\n\nFor the 2.2.x series:\n\n```\necho \"6000\" > /proc/sys/fs/file-max\necho\
    \ \"12000\" > /proc/sys/fs/inode-max\n```\n\nPut these lines in your rc.local\
    \ file so they execute at boot time. He also suggested that you tell Linux to\
    \ use most of memory for file cache and keep it in memory for a long time. Put\
    \ this in your rc.local file:\n\n```\necho \"80 500 64 64 80 6000 6000 1884 1884\
    \ 2\" > /proc/sys/vm/bdflush\n```"
  merge: -1
