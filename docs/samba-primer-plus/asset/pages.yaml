  md: 'Unfortunately, by default, pwl files are still created that contain a user''s
    username and password. This time, it is a user''s domain password that is stored
    in this file! This means that if these files were cracked, an intruder would have
    a correct username and password and have a head start on gaining unauthorized
    access to the entire domain, not only on the PC he stole from, but any PC that
    is a member of the Windows NT domain! If he gains access to the domain, he has
    access to all file shares that the user he stole has access to. Luckily, you can
    turn off the creation of these pwl files by setting a registry key that disables
    password caching on all your Windows 95 and Windows 98 clients. Start regedit.exe
    and follow the registry tree:


    ```

    HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\Network

    ```


    And add a value with the following parameters:

    "DisablePwCaching"=dword:00000000


    With that key set, and all pwl files deleted from each system, you can be sure
    you have done your best to secure the unsecurable! You can execute this command
    to see if there are any pwl files on your system:


    ```

    C:\dir \*.pwl

    ```


    If your installation of Windows is in an alternative directory, substitute that
    name instead of windows.


    There is one other problem with the less secure Windows clients (any other Windows
    operating system than Windows NT). To join a domain, all that has to be done is
    tell the Microsoft Windows client network layer on the system to authenticate
    to a particular domain name (this is described in "Configuring Samba as a Domain
    Login Server," which follows). Of course anyone who can install Windows on do.
    With Windows NT, not only each user has an account on the PDC, but also each computer
    account name is always the NetBIOS name with a dollar sign at the end; for example,
    if your machine is called daffy, the account on the PDC will be called daffy$.$.
    The good thing about adding a Windows NT client to a domain is that the person
    adding the computer needs to be in the Domain Administrator group. Until a Windows
    NT client has an account on a domain, it may not authenticate any users from the
    initial login dialog box to that. This process will be explained in more detail
    in the next chapter.


    # Configuring Samba as a Domain Login Server


    Setting up Samba as a domain login server is relatively simple and painless process.
    You first have to configure the Samba server, and then configure each Windows
    client. To configure your Samba server, follow these steps:


    +   1. Samba must be configured as a master browser. If you do this, make sure
    that there are no NT domain controllers around, or a browser election could start.
    To do this, set local master in smb.conf to:


    ```

    local master = yes

    ```'
