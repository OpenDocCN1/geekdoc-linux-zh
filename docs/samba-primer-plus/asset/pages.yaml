  md: '4. The h-node mode uses p-node first. If that fails, it fails over b-node as
    a last resort, for example, if the WINS server is unavailable. This is a good
    method in that it uses broadcasts as a last resort, which significantly increases
    LAN performance.


    5. There is another method called a modified b-node mode, which allows the b-node
    to travel across routers. This method uses a file called an hosts file. It is
    similar to a TCP/IP hosts file that it contains name-to-IP address mappings. This
    method works by broadcasting to the subnet. If that fails, the hosts file is looked
    up. If there is no NetBIOS name that will resolve the NetBIOS Name Query, the
    name lookup will fail. This method was used before the WINS existed (prior to
    Windows NT 3.5x). This method suffers from the obvious problem of keeping hosts
    files updated.


    After a name has been resolved to IP address, it is cached for later use and given
    an expiry time when it will be cleared from the cache. All "stale" names are to
    be cleared periodically. This provides fast access next time the same name needs
    to be resolved.


    The most obvious problems with broadcast-based name resolution are as follows:


    +   1. There is a high amount of broadcast traffic.


    +   2. Unless specially configured, routers do not broadcast NetBIOS traffic.


    +   3. All nodes on a subnet have each and every NetBIOS broadcast packet, consuming
    valuable resources.


    That is why WINS servers are so common these days: They have decreased the amount
    of NetBIOS broadcasts on LANs, increasing LAN performance dramatically! Samba
    provides the capability of being a WINS server by a directive in its configuration
    file. WINS functionality is implemented using the nmbd daemon.


    # NetBIOS Session Service


    The NetBIOS session service is best described with an example. This section goes
    through the steps that NetBIOS uses when establishing a session over TCP/IP. For
    simplicity, assume that the client machine is using b-node name resolution. The
    client machine''s name is PINKY and the resource PINKY wants to connect to is
    machine NT001, and called \NT001\APPS.


    +   1. PINKY first of all the NetBIOS name service to send out three broadcasts
    one after the other to the local subnet broadcast address, to find the IP address
    of NT001. If it gets no response, an error message is presented to the user, saying
    something like: The network path was not found.


    +   2. A TCP session is set up over IP to the standard NetBIOS session IP port
    139 to the destination IP address for NT001 found at step 1.


    +   3. A NetBIOS session request packet is sent over this TCP/IP connection from
    PINKY to NT001.


    +   4. If all is okay, NT001 sends a positive confirmation back to PINKY.'
