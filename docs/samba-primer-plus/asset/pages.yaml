    ```

    -a Reset archive bit mode

    -v Verbose mode: echo command

    -s <server> Specify PC Server

    -p <password> Specify PC Password

    -x <share> Specify PC Share backup

    -n <newfile> File for date comparison

    -b <blocksize> Specify tape''s blocksize

    -d <dir> Specify a directory in share \

    -l <log> Specify a Samba Log Level 2

    -u <user> Specify User Name matt

    -t <tape> Specify Tape device tar.out

    ```


    Please enter a command line parameter:


    For reference, the last column contains the default value for each of the switches.
    If the default value is blank, there is no default value for that switch. Here''s
    a simple example:


    ```

    $ smtar -s daffy -p password -x ntshare -t ntshare

    ```


    This example archives the entire contents of ntshare on the server DAFFY to the
    file ntshare.tar. Instead, you can send the contents directly to a tape device
    like this BSD UNIX, such as Linux:


    ```

    $ smtar -s daffy -p password -x ntshare -t /dev/st0

    ```


    Or, like this a System V UNIX, such as Solaris or HP-UX:


    ```

    $ smtar -s daffy -p password -x ntshare -t /dev/rmt/0m

    ```


    Alternatively, you can select a subset of the share like:


    ```

    $ smtar -s daffy -p password -x ntshare -t /dev/rmt/0m apps/*

    ```


    If you have problems and to find out exactly what is going on, use verbose mode:


    ```

    $ smtar -s daffy -p password -x ntshare -t /dev/rmt/0m -v

    ```


    By default, smtar provides no output, which is very useful especially because
    smtar would normally be used as a cronjob entry when output would be a nuisance.


    If you have a small network, a good way to use this functionality of smclient
    would be to create a share on all your Windows machines that points to the root
    directory. When you connect with smtar, you will back up the entire system in
    one go, and then store it compressed on a UNIX disk format, or archive it to tape.


