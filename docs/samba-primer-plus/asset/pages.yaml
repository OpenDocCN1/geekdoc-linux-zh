    client.


    DFS is provided as a download for Windows NT 4.0 environments (http://www.microsoft.com/ntserver/downloads/winfeatures/NTSDirFile/default.asp)
    and is shipped with Windows 2000.


    Finally, CIFS in Windows 2000 promises to be able to file sharing without requiring
    the dreaded NetBIOS for name resolution. This means that for the first time, Windows
    will be able to use DNS to resolve names. This also means that CIFS will be able
    to run over TCP as the transport, rather than using a NetBIOS session connection.
    This removes some of the complexity of the current SMB filtering operations, and
    hopefully makes things a little more stable.


    # The Future Direction of Samba Development


    As of December 1999, the Samba development has branched into three releases. The
    first is the CVS branch which will continue to use on the 2.0 series. Samba 2.0.7
    should be released soon and fixes some problems that 2.0.6, such as a minor issue
    with user files. The second development version is Samba 2.1, which is the successor
    to 2.0. Finally, a new branch called Samba The Next Generation (TNG), which will
    turn into Samba 3.0, is not expected to be released until sometime in 2001.


    The current CVS branch used for the 2.0 series will continue to be used to create
    new releases in the 2.0.x Samba series. Stay on these versions if you want total
    stability of your system and are not too concerned about requiring PDC functionality.'
