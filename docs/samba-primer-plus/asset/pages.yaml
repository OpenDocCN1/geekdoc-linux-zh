    # Receiving Windows Messages on UNIX


    Believe it or not, you can set up Samba to receive Windows Messenger messages
    sent to it! The global variable message command controls this. An example might
    be


    message command = /bin/sh -c "cat %s*" &


    This will send the contents of the net command as a broadcast to all logged-in
    users. Make sure that whatever command you specify here, you put an ampersand
    (&) at the end. Samba expects the command to return immediately. If there is any
    delay, Samba processing may stop and a performance hit might occur—for example,
    if hundreds of users are logged in at one time, it might take a while for wall
    to send out the message to everyone.


    # Summary


    This chapter started by discussing the different requirements that a Windows NT
    server fulfills in your network, and showing how Samba can achieve all these tasks.


    The first task was NetBIOS resolution. Samba supports hosts files as Windows machines,
    and also has the capability of being a Windows client and server. One drawback
    is that Samba cannot replicate Windows data with another WINS server, but you
    will find that capability should not be too far away.


    Drawing from the browsing discussion from the previous chapter, the chapter then
    showed how Samba can fully participate in browser elections, including being a
    domain master for this capability is required. However, if there is an existing
    Windows NT PDC, you have to be careful not to set Samba in this mode, or strange
    things will happen to the network!


    Samba can either process authentication requests itself, or pass those to an existing
    Windows NT server for authentication if you have an existing NT infrastructure
    that you will not be replacing any time. This is handy if you are slowly bringing
    in Samba servers, but don''t want to give the users the hassle of having separate
    passwords to access the Samba resources.'
