    # Samba and Windows


    The WINS service was first provided with Windows NT 3.5. Since then it has pretty
    much become mandatory for any Windows network that spans more than a single subnet.
    Windows NT 3.5, to be able to connect to print or file servers outside your own
    subnet, you had to have a properly configured lmhosts file. In this file were
    the names of all servers containing resources on your network. You can imagine
    how hard it would be to keep such a file up-to-date. With the advent of WINS,
    the lmhosts file became a thing of the past—although in some situations, it is
    still useful. Samba supports both lmhosts and WINS.


    # lmhosts


    To use an lmhosts file for name resolution with Samba does not require any special
    configuration in the Samba configuration file. The only thing you need to do is
    to create the lmhosts file in the appropriate directory. By default, Samba looks
    in the same directory as the smb.conf file. If you have installed Samba from a
    precompiled distribution, there might already be a sample lmhosts file installed
    for you.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Chapter 5 · INTEGRATING SAMBA INTO AN EXISTING WINDOWS NETWORK


    Each entry in this file has the IP address, NetBIOS name, optionally followed
    by a hash (#), and a resource type. The resource type is specified in hex. If
    no resource type is indicated for an entry, that entry will be returned for requests
    for all resources under that particular name. Some sample entries might be


    ```

    192.168.3.4 larry

    192.168.3.20 moe

    192.168.1.1 mydomain1B

    ```


    Replace mydomain with the name of your Windows NT domain. The IP address you should
    put in is the IP address of the PDC. In this particular scenario, larry and moe
    are contacted whenever Samba has to resolve their names for any NetBIOS resource.
    The third one might look strange to you, but in some circumstances can be very
    useful. If whatever reason your network does not use WINS, and you have problems
    browsing to your Samba server from other subsets, you need to add to your hosts
    file the third entry. For this to work correctly, your Samba server must be configured
    to be a local master browser (see the section "Browsing with Samba"). The NetBIOS
    resource for a domain master browser is Bh. When Samba wants to integrate its
    browsing information into the rest of the network, it can find the domain master
    browser.


    More information can be found in the manual page, man lmhosts.


    # WINS


    Because the lmhosts file is a static file and requires changing each time a new
    host is added to the network, you need something that requires a little less maintenance.
    This is where WINS can help. If you do not already use WINS, Samba can be configured
    to be a WINS server on your network.


    The following option must be set in smb.conf:


    ```

    wins support = yes

    ```


    With this option set, and the nmbd service restarted so that the option takes
    effect, you can set all your Windows 95/98 and Windows NT clients to point to
    your Samba server as their WINS server.


    # Don''t Set Up Multiple Samba Servers with WINS Support


    Do not set wins support on more than one Samba server on your network. Things
    could get a little confusing with multiple Samba WINS databases!


    If you already have a WINS server on your network, Samba can be configured to
    use it with the next option:


    ```

    wins server = 192.168.1.1

    ```


    Of course, replace the IP address with the address of your WINS server.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Don''t Set wins support and wins server


    By default, if a Samba server is configured with wins support, it will automatically
    go to its internal WINS database for NetBIOS name resolution. If you have a Samba
    server configured in this way, do not set wins server on the same system. Samba
    can get tied in knot if both servers are set on the same machine!


    There are a couple of smb.conf options that are WINS-related:


    +   - wins proxy (default no). If set with yes, this allows a Samba server configured
    to be a WINS server to respond to NetBIOS broadcasts on behalf of other clients.
    In some circumstances, this may provide better performance for LAN Manager clients.

    - dns proxy (default no). If set, this allows a Samba server currently configured
    as a WINS server (wins support = yes) to fall through to DNS when a name request
    comes in that it cannot resolve WINS itself. Samba will do a DNS lookup for the
    NetBIOS name being requested, and if an affirmative response comes back, the DNS
    IP address is returned to the WINS client.


    # Gathering Information from Samba WINS Servers


    If you encounter a problem with your Samba WINS servers, you can dump the current
    WINS database with the following command:


    ```

    # killall -HUP nmbd

    ```


    If you don''t have the killall command, you will have to do something like the
    following:


    ```

    # killall -HUP `var/lock/samba/nmbd.pid`

    ```


    Your currently running nmbd process will dump its WINS database into /var/lock/samba/namelist.debug.
    If the file is not there, Samba was compiled to put it in a different location,
    and you will need to poke around a bit to find it.


    # Browsing with Samba


    If you have not read the Computer Browsing section of the previous chapter, do
    so as it will help you understand the basics behind computer browsing and you
    will be able to understand this section a little easily. With a small amount of
    configuration, you can control how Samba or more precisely the NetBIOS daemon,
    nmbd, will participate in the browsing functions of Microsoft networks. Samba
    is always in one of two roles, either part of a Windows workgroup, or in a Windows
    domain environment.


    # Samba in a Windows Workgroup


    In this configuration, WINS will probably not be configured: You have a number
    of Windows 95/98/NT clients all around the network, perhaps a couple of Samba
    servers, and maybe an NT server or two—all in the same workgroup. Most likely
    they will be distributed throughout'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Chapter 5 • INTEGRATING SAMBA INTO AN EXISTING WINDOWS NETWORK 79


    your network, which is likely to have multiple segments. This network situation
    is depicted in Figure 5.1.


    FIGURE 5.1

    Browsing in a Windows workgroup.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_94_0.png)


    When you go to browse the network on any one of the Windows clients, you will
    see all the machines in your segment, but cannot see all NetBIOS nodes on the
    network. Why? Because the NetBIOS broadcasts do not get forwarded through the
    routers, and there is no central point where NetBIOS names can be registered for
    later retrieval. Remember that to be able to browse the full network, there must
    be a single master designated as a local master browser (LMB) on each segment,
    and also a domain master browser (DMB) that merges all the LMBs entries into one
    large network resource map. In this model there are LMBs allocated through browser
    elections, not a DMB. In a Windows NT domain, the DMB is automatically the PDC,
    but in this example of a workgroup scenario, there is no PDC, so there is no DMB.


    You can allocate one of the Samba hosts to be the DMB using the following `smb.conf`
    configuration-lines:


    ```

    domain master = yes

    local master = yes

    preferred master = yes

    osos level = 65

    ```'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'The first option, domain master, forces Samba to be the domain master browser
    for the group. Never configure this parameter in an existing Windows NT domain.
    Really evil things can happen when the NT PDC discovers a second DMB on its network!
    local master tells Samba to participate in elections for the LMB on the network
    segment because the DMB is the LMB for its segment as well. The preferred master
    tells Samba to force an LMB election time it starts up. This parameter is essential
    in getting Samba to become DMB. Finally, the level option is used to control what
    of Windows machines it will beat during the election. A value of 65 causes it
    to beat any other host on the network.


    # Watch for Possible Performance Issues when Using preferred master


    If you have the preferred master option set, and there are other Windows hosts
    on the same subnet as the Samba server you are configuring, be careful. If these
    other Windows hosts are configured to be preferred master browsers as well, an
    election war will occur, which will reduce network performance and fill your logs
    with annoying warnings.


    Several other configurations are handy in certain situations. This one will allow
    a Samba to become the preferred LMB in a segment:


    ```

    domain master = no

    local master = yes

    preferred master = yes

    samba level = 65

    ```


    You can also disable Samba from participating in browser elections completely
    (preferred if you already have Windows NT boxes in the same segment as Samba):


    ```

    domain master = no

    local master = no

    preferred master = no

    samba level = 0

    ```


    The default browsing behavior for Samba is


    ```

    domain master = no

    local master = yes

    preferred master = no

    samba level = 0

    ```


    which means it will try to become LMB if there are no Windows machines on the
    segment; otherwise, it will always lose elections to Windows hosts.


    # Samba in a Windows NT Domain


    Configuring Samba''s browsing role in a Windows NT domain is pretty much the same.
    You just need to make sure that you never set domain master = yes. It''s useful
    to set parameters in smb.conf even if they are set to their default settings.
    This makes it easy to see at a glance what is going on. If you want Samba to become
    an LMB, make the following settings:'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# Chapter 5 • INTEGRATING SAMBA INTO AN EXISTING WINDOWS NETWORK


    ```

    domain master = no

    local master = yes

    preferred master = yes

    sos level = 65

    ```


    If you know there will always be a reliable Windows NT machine in each subnet,
    you can disable Samba from participating in completely:


    ```

    domain master = no

    local master = no

    preferred master = yes

    sos level = 0

    ```


    # Configuration of the Browsing Clients


    For the clients in your browsing environment to see the entire network, they need
    to be able to communicate with their LMB, which is the easy part. You can find
    out that is with a NetBIOS broadcast for the resource ID. However, the LMBs themselves
    have to be able to communicate with the DMB. A broadcast will not work for the
    simple reason that the DMB is more than likely located in a different subnet and
    would not receive the broadcast. Each LMB needs to have an hosts file with an
    entry for the DMB in it, or you need to set up a WINS server. If you opt for the
    later method, ensure that all Windows and Samba hosts are configured with the
    WINS server. For a Windows NT machine, see Figure 5.2 for the location to enter
    a WINS server.


    # FIGURE 5.2


    Configuring a Windows WINS client.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_96_0.png)


    It does not matter whether you use Windows NT or Samba as your WINS server, just
    pick one platform and stick with it. Samba WINS configuration as both a client
    and server was described earlier in this chapter.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Choosing a Password Server


    This section explains how to tell Samba to use your existing Windows NT SAM database.
    There is nothing worse than integrating a new Samba server into an existing environment,
    showing the boss how cool it is, and the boss remarks, "That''s great, but I don''t
    like having to enter another password to access this file service! With Samba''s
    default configuration, it is set up to use the regular UNIX password file as the
    method of deciding which access shares. In an existing environment, this provides
    one major problem: Each user on your Windows NT domain must have a new account
    created on the Samba server, complete with a new password. For an environment
    with many hundreds of users, this could create an interesting problem. You need
    to create all the users on the Samba server anyway, which change their own UNIX
    passwords. But a much harder problem is to provide an easy way for the users to
    change their UNIX passwords. If they have Windows desktops, changing their password
    is a simple matter of point and click. An entire site of Windows users would probably
    not be thrilled by the prospect of logging into a UNIX server just to change their
    password!


    Likually, the Samba development team put in a feature that allows a Samba server
    to use Windows NT Domain Controllers (DCs) to authenticate users. See Figure 5.3
    for a diagram showing the process.


    FIGURE 5.3 Allowing an existing NT server to become a Samba password authentication
    server.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_97_0.png)


    To turn this feature on, set these options in your `smb.conf:


    security = server

    password server = NTDC1, NTDC2, NTDC3'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'The parameter security can be set to one of number different values: share,
    user, server, or domain. The share setting is pretty much defunct now, but it
    was used to provide share level security. Setting it to user is the default, and
    it provides user level security. The domain used when you want Samba to be a member
    server in a Windows NT domain (see Chapter 7, "Samba in a Windows NT/2000 Domain
    Environment"). We are concerned with the server setting here. Setting security
    to server tells Samba to send the Username/Password over an encrypted channel
    to a Windows NT DC. The other parameter that was set, password server, specifies
    the NetBIOS names of the servers for Samba to authenticate. Replace the names
    here with the names of a few of your own DCs. These NetBIOS names need to be resolvable,
    either in the DNS, or you must set Samba up as a WINS client if they differ from
    your NetBIOS name and you are not using WINS, you will need to create an hosts
    file with the correct NetBIOS and IP address mapping.


    Each of the password servers are tried in turn until one can be contacted, and
    then this one is used for the life of the currently running smbd process. If example,
    NTD2 is chosen and it happens to go down for some reason, any new authentication
    requests from smbd will fail. This is due to a limitation in the SMB protocol,
    the Samba developers say. However, security = domain overcomes this problem by
    making a new connection to a password server each time a new request comes in.
    Chapter 7 discusses this point.


    # A Problem with Using Password Servers


    There is one problem with using password servers. Windows NT usernames can be
    quite long, up to 20 characters. UNIX passwords, as you are allowed a maximum
    of eight characters. How do you resolve this issue? Samba has an usual answer!
    You can create a username map file that has a mapping from UNIX user to Windows
    NT user. This option is set by adding the following to your smb.conf:


    ```

    username map = /usr/local/samba/lib/username.map

    ```


    Now you need to create the username.map file to have entries similar to this:


    ```

    mattg = "Matthew Gillard"

    ```


    My account name on UNIX is mattg; however, my account name under Windows NT is
    Matthew Gillard. Listing 5.1 is a script that is useful to automatically create
    the username.map file from the entries in /etc/passwd in this format.


    # LISTING 5.1 A Sample Shell Script to Automatically Generate a Username Map File
    for Use with Samba


    ```

    # /bin/sh

    # Author: Matthew Gillard

    # Description: Example script for Samba Primer Plus Which

    # demonstrates how to automatically generate

    # a username map file from an existing /etc/passwd file.

    ```'
