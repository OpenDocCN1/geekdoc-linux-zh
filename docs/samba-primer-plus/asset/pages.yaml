  md: '# What Do the Different File Extensions Mean?


    If you are new in the UNIX world and may have just started using Linux, you are
    probably wondering what the different letters on the end of the filenames. As
    in Windows, a file extension is usually used to give you an idea of what the file
    is in.


    A named file.gz is a compressed file. The "gz" signifies the compressing program
    used was gzip. It can be uncompressed with the following:


    ```

    $ gzip.gz

    ```


    A called file.tar is a UNIX archive of many different files. It was created with
    a program called tar. A tar file can be unarchived with the command:


    ```

    $ tar -xf file.tar

    ```


    A called file.gz was put into a tar archive, then compressed with gzip. Sometimes
    these files are also called file.tgz. If you are running Linux, you can uncompress
    and unarchive in one step:


    ```

    $ tar -xzf file.tar.gz

    ```


    If you are running one of the commercial operating systems you can do it this
    way:


    ```

    $ gzip -c file.tar.gz | tar -xf

    ```


    The -c tells gzip to output to standard output, which is piped into the tar command
    to extract each file.


    After you have the Samba source downloaded, you can unpack it with the following
    command:

    $ gzip -c samba-latest.tar.gz | tar -xvf


    It should create a directory depending on the current version is similar to samba-2.0.55a.


    # Compiling Samba


    Begin by looking at the structure of the Samba directory tree:


    ```

    # ls -lntotal 61

    -rw-r--r-- 1002 1002 17982 May  4 1996 COPYING

    -rw-r--r-- 1002 1002 3311 Nov 22 1998 Manifest

    -rw-r--r-- 1002 1002 6569 Jul 21 1123 README

    -rw-r--r-- 1002 1002 2402 Feb 26 1999 README-smbmount

    -rw-r--r-- 1002 1002 0 Aug 21 1997 Read-Manifest-Now

    -rw-r--r-- 1002 1002 1891 May 15 12:03 Roadmap

    -rw-r--r-- 1002 1002 19944 Jul 22 12:06 WHATNEWS.txt

    drwxr-xr-x 7 1002 1002 1024 Jul 21 11:23 docs

    drwxr-xr-x 12 1002 1002 1024 Jul 22 12:07 examples

    drwxr-xr-x 12 1002 1002 1024 May 20 05:32 packaging

    drwxr-xr-x 25 1002 1002 1024 Jul 22 12:15 source

    drwxr-xr-x 5 1002 1002 1024 May 20 05:33 swat

    ```


    The README files generally give important information regarding the release of
    Samba. Also detail any important changes since the latest release, including mentioning
    things that may be incompatible.'
