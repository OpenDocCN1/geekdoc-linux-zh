  md: '# CHAPTER 6


    # USING SAMBA WITH

    WINDOWS 95/98


    You will learn about the following in this chapter:


    +   * What Samba can do for you in a Windows 95 or Windows 98 net-work

    * How to configure Samba as a domain login server for Windows 95/98 clients

    * How to configure Windows 95/98 roaming user profiles


    +   * An introduction to Windows system policies and how to implement them on
    your Samba domain login server

    * How to go about troubleshooting your Samba domain login server if it fails to
    work for you the first time


    Until recently, Samba supported only domain logins for Windows 95/98 clients.
    Due to the stringent security requirements of a Windows NT authenticating to a
    domain controller, the implementation of this process in Samba required a lot
    of work—and reverse engineering of how Windows NT processes the login request—by
    the development team. To fully implement Windows NT domain controller functionality
    required many hours of coding and testing to get it right. However, this chapter
    focuses on the domain authentication for the less secure Windows clients such
    as Windows For Groups, Windows 95, and Windows 98. This process is relatively
    straightforward and has been implemented in Samba for quite a while now—at least
    the last three years. This chapter discusses the issues involved in getting Samba
    to authenticate with these less secure Windows clients. If you want to get Windows
    NT clients using Samba as their domain login server, skip to the next chapter.'
  merge: -1
