    And you went through using the smbclient interactive interface. If you are familiar
    with command-line ftp, you will be at home with smbclient. You can transfer files
    to and from SMB shares, as well as the usual tasks changing directories, making
    directories, files, and so on.


    The next chapter on discuss two useful tasks that smbclient can perform. The first
    was being able to print to an SMB print share. A script is provided in the Samba
    distribution that makes this easy. It is called smbprint and is used as an input
    filter for the print queue. You learned how to set this up for BSD-based printing
    systems, like that you used in Linux.


    The second task is being able to archive an entire filesize into a tar file. This
    is very useful for backup purposes. Imagine those Windows 95 or 98 machines that
    you would have liked to back up, but there was no easy way to do it. Now you can
