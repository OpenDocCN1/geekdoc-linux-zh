  md: '# Windows NT Global and Local Groups


    You are probably wondering what global and local groups are in Windows NT, especially
    if you are coming from the UNIX world, where there is no concept of such a thing.
    In very brief terms, a global group is a group that is available throughout the
    domain, and therefore in the इन्हे SAM. A local group is a group that is available
    only on a per-machine basis. Microsoft''s recommendation is that Windows NT local
    groups should not be applied to resources. Local groups should be put in as members
    of global groups, and users are put into local groups. These global groups are
    then applied to shared resources throughout the domain. In this fact makes a lot
    of sense.


    Say you have a global group Marketing. You also have local groups north-mrktg,
    south-mrktg, east-mrktg, and west-mrktg. You have four different servers that
    are located in the north, south, east, and west regions. All users in the northern
    region use the local group north-mrktg and so their user accounts are placed in
    this group, and the procedure is used for all the three other regions. The four
    local groups are applied as members of the global (domain-wide) group Marketing.
    Now the global Marketing group is applied to any shared resources that all the
    members of the marketing group have access to. Because all the members of local
    groups are members of the global marketing group, they all have the correct access.
    When a new person arrives in the southern region, for example, he or she just
    needs to be added to the local group south-mrktg. This implies that the new person
    has access to all the resources that the other marketing people have access to.
    See Figure 7.10 for a diagrammatic look at how users, local groups, and global
    groups fit together. In the figure, the emphasis is on users being put in their
    marketing groups which are named depending on whether they are in the north, south,
    east or west regions. These groups are then put into the Marketing group, which
    is applied as a permission on the resource. The obvious advantage is that when
    a new user arrives in the western marketing region, he has to be added to the
    local west-mrktg group once and he automatically has access to all the marketing
    resources.


    # Figure 7.10


    How users, local groups, and global groups fit together:


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_140_0.png)'
