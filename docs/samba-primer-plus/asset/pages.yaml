  md: '# INTRODUCTION


    Presumably, you bought this book to learn more about Samba and how you can make
    it work in your environment. This book is designed to complement the documentation
    that comes with the Samba source—in no way is it meant to replace it! The book
    has been written in a way that will be easy to read with real-life examples where
    appropriate. In my experience as a consultant, I hear the same questions and see
    the same mistakes all the time. I hope that I have brought the results of my experience
    and learning to you in a way that makes Samba an easier and more enjoyable experience
    for you.


    This book was designed to benefit specific groups of individuals:


    +   - Linux system administrators who want to be able to set up their Linux server
    to share files to Windows clients, rather than having to install a Windows NT
    server. Those companies running Linux systems have many Windows PCs for their
    users. Combined, Linux and Samba provide an inexpensive way to store their data
    on a network server without having to introduce the cost and complexity of Windows
    NT servers to do this simple job that can be done for close to nothing.


    +   - Windows NT system administrators who have heard about Linux and want to
    diversify their network with Linux to share the Windows NT load. The Linux systems
    running Samba can be members of an existing Windows NT domain structure, and now
    your Samba server can be used as a Primary Domain Controller.


    +   - Corporate UNIX system administrators who need to provide a method of sharing
    resources to Windows clients. Many Oracle Financial installations require the
    users to export financial data in spreadsheet format and need to be transferred
    to the PC users. Similarly, the users have some data that they need to import
    into Oracle, so they need to transfer to the UNIX server first. Samba provides
    an easy way to achieve this using regular Windows networking to connect drives
    to the server.


    Samba Primer is split into four parts. It begins with three introductory chapters
    (Part I) to get up and running with Samba with a minimum of complexity, moving
    to more advanced chapters that describe various features of Samba in more detail.
    This introductory section is designed to be read first. You will learn enough
    in this section to get Samba compiled and installed on your particular system.
    It covers Samba configuration using the Samba Web Administration Tool (SWAT) including
    how to set up a couple of file-shares to get started. The final part of this configuration
    chapter includes some basic troubleshooting techniques you should run into any
    problems.


    Part II contains chapters with information on integrating Samba into an existing
    Windows NT environment. This section begins with some details on how Windows networking
    works. It covers such topics as Windows NT Domains, and unearths some misconceptions
    about what NetBIOS actually is and why it is used. It also goes into some details
    on computer browsing'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# SAMBA PRIMER PLUS


    and the actual functions that Windows NT provides, comparing it to Samba where
    relevant. This background information helps you understand why Windows networking
    works the way it does and gives you the knowledge to implement Windows and Samba
    systems properly. Samba can coexist quite happily with Windows systems as you
    would expect. the rest of Part II goes through some techniques on integrating
    Samba into an existing NT environment, how to do domain logins from Windows 9x
    and NT clients, and how to set up Samba as a Primary Domain Controller. This part
    ends with a discussion on a tool that allows Samba to connect to SMB servers,
    as Windows NT and Samba, from a UNIX (Linux) platform.


    Part III expands on the previous chapters with slightly more advanced topics.
    The leader chapter in this section is using the Secure Socks Layer (SSL) features
    of Samba. In a nutshell, this provides clients a secure encrypted channel to communicate
    with the Samba server. The first part goes on more advanced options you can use
    when providing your filesize resources. Next is a chapter on performance tuning
    your Samba server. You should note that there is not "one" method of making your
    Samba server improve performance. There are many variables, which include the
    system it is running, what you are using for Samba, what you or your users expect
    out of it speed, and so on. Performance tuning is a trial-error process. The chapter
    tries to convey this to you. Next is a chapter on debugging. It goes into how
    to use sniffing software to see what Samba is doing and find what is wrong when
    there is a problem. Samba security is covered next. It shows some basic security
    guidelines to follow using Samba. The tail end of Part III describes tools that
    are not part of Samba, but are definitely Samba-related. The final chapter describes
    what is planned for Samba''s future.


    Finally, Part IV contains two appendices you will find useful. Appendix A is a
    sample CIFS/SMB session. Appendix B provides the answers to the review questions
    found at the end of each chapter. As one last bonus, this book concludes with
    a glossary of terms found throughout the book.


    The aim of this book is to help you gain a deeper understanding of Samba and the
    underlying SMB protocol. The review questions at the end of each chapter are designed
    to capture the most important points out of each chapter. After reading Samba
    Primer Plus, you should be able to set your own Samba server and troubleshoot
    it if you have problems. You should also be able to integrate your Samba server
    into a Windows NT environment, but most of all, you should gain ideas that maybe
    you had not thought of before that can benefit both you and your organization.'
  merge: -1
