    The default is ssl12or3. You do not normally need to change this parameter.


    # Client Support for SSL-Configured Samba


    It is important to be able to encrypt sessions using a Samba server, but you also
    need SSLcapable clients to be able to do this. Currently these are lacking in
    numbers. The only ones that seem to be around smclient and a package called Sharity
    created by a company called Objective Development. Sharity is a completely SMB/CIFS
    implementation for UNIX systems It functions similarly to Samba, and there is
    also a demo version that is limited to a directory hierarchy of three levels.
    Sharity is for students and educational institutions and can be found at http://www.obdev.at/Products/Sharity.html.
    Objective Development also has an open source product called sslproxy. This allows
    two different functions: being able to tunnel any application over SSL for use
    by non-SSLaware, and allowing access to SSL-aware servers from non-SSL-aware clients.
    Effectively you could install sslproxy in an environment where there is an SSL-enabled
    Samba server, and get access to Samba server from a non-SSL-enabled client, such
    as Windows NT. Alternatively, you could tunnel Windows SMB file servers over SSL
    for access with Sharity or SSL-enabled smclient. You can find sslproxy at http://www.obdev.at/Products/sslproxy.html
    It is simple to compile and it comes with documentation.


    # Summary


    This chapter went through the basics of SSL and how you can utilize this feature
    in Samba. We discussed in some depth what SSL is and how it works. SSL stands
    for Secure Sockets Layer and was developed by Netscape to create a secure environment
    in Web browsers to detect sensitive transactions like banking and shopping.


    You also learned the basics behind the SSL protocol. It uses public key cryptography
    to perform user authentication and regular symmetric ciphers for the application
    data. You learned that SSL relies heavily on certificates during the authentication
    phase of the connection.


    You learned what a certificate is. Remember that it is just a public key with
    an identity attached. This identity is called a distinguished name.


    You learned what a certification authority (CA) is. You now know that it is a
    trusted party who signs certificates. If the general public publishes a particular
    CA, they trust any certificates that CA signs.


    You saw how certificate signing works. You must generate a certificate signing
    request, which goes to the CA, which adds a digital signature to it so that you
    can prove who are you are.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'You learned the procedure to generate a private key and certificate. First,
    create your private key:


    ```

    # openssl genrsa -des3 512 > key.pem

    ```


    Next, generate your certificate signing request:


    ```

    # openssl req -new -key key.pem -out csr.pem

    ```


    Finally, sign your certificate:


    ```

    # openssl ca -policy policy_anything -days 365

    config /etc/openssl.cnf -infiles csr.pem > cert.pem

    ```


    You learned that you to compile Samba yourself to include SSL support.

    You also learned how to configure your Samba server to be SSL-enabled, generate
    a Samba certificate, and then add the certificate information to smb.conf:


    ```

    ssl = yes

    ssl server cert = /etc/ssl/certs/sambacert.pem

    ssl server key = /etc/ssl/certs/sambakey.pem

    ```


    Finally, you saw how to enable client-side certificates. You need to generate
    a certificate for each client that will access your Samba server, and you need
    to add these parameters to smb.conf:


    ```

    ssl require clientcert = yes

    ssl client cert = /etc/ssl/certs/sambaclientcert.pem

    ssl client key = /etc/ssl/certs/sambaclientkey.pem

    ssl CA cert = /etc/ssl/certs

    ```


    You will also need to add your CA certificates to each machine running an SSL
    client.


    # Review Questions


    +   1. Why would you want to use SSL? Name a sample application that SSL could
    be used for.

    2. What are CAs, and what is so important about them?

    3. What is a certificate-signing request?

    4. With Samba, are server-side or client-side certificates important? Why?

    5. What are the general steps you would follow when setting up your Samba server
    to use SSL?


    # Exercises


    +   1. Choose a relevant Linux/UNIX server in your organization to use as a CA
    server. Secure it as much as possible by removing unneeded services. Implement
    this machine as your organization''s CA using the steps outlined in this chapter.'
