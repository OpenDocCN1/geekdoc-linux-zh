  md: '# Chapter 4 • UNDERSTANDING WINDOWS NT NETWORKS


    # Possible Computer Browser Roles


    +   - Not a browser

    - Potential browser

    - Backup Browser

    - Master Browser


    But only Windows NT/2000 systems can fill this final type of role:


    +   - Domain Master Browser


    Again, Samba can fulfill any of these roles, and can also participate in master
    browser elections. This section describes each of the different roles in turn.


    # Non-Browsers


    A non-browser is specially configured to not ever keep a browse list. This role
    works well for servers that do a lot of tasks such as file sharing or database
    work, and you don''t want them to use additional resources to keep a computer
    browse list.


    # Potential Browser


    A potential browser is capable of maintaining a browse list. It can participate
    in elections to be the elected master browser if instructed to do so by the master
    browser. This is the default role of any Windows-based machine.


    # Backup Browser


    The backup browser receives an updated copy of the current browse list from the
    subnet master browser every 15 minutes. Backup browsers also distribute the browse
    list upon request to the other machines in the subnet who are members of the domain
    or workgroup.


    # Master Browser


    There is one master browser per subnet. Each master browser keeps track of new
    machines starting up and machines being turned off and maintains the entries in
    the browse list accordingly. The master browser sends updates every 15 minutes
    to the domain master browser.


    # Domain Master Browser


    The master browser is responsible for providing lists of domain resources to each
    master, and for gathering updates from each network subnet to include in the master
    list. As previously mentioned, the Windows NT PDC is always the master browser.
    Note that if your network already has a domain master browser, that is a Windows
    NT PDC, do not set Samba to be one or all sorts of evils will happen to your network,
    including lack of authentication and lack of browselists.'
  merge: -1
