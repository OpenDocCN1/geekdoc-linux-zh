    # Restricting Home Directory Users


    There may be times when you do not want users to be able to access their home
    directory shares. This can deny everyone by default and have a list of users where
    these people the only ones who can access the service:


    ```

    valid users = matt, mike, djk, @pcusers

    ```


    The "@ specifies a UNIX group follow. This example assumes that a UNIX group called
    pcusers exists with a list of users in it.


    The other way is to allow everyone by default, and only deny some users:


    ```

    invalid users = baduser, fred

    ```


    This also works for regular shares as well.


    # Samba as a Print Server


    Another popular task that Windows NT servers perform print serving, and of course,
    Samba can do that as well! Samba actually does not do any of the printing grunt
    work. It acts as the interface between your Windows machines and the UNIX printing
    subsystem. Samba can print almost any UNIX printing system, be it BSD-based (Linux,
    SunOS, FreeBSD, and others), HP-UX System VR (S4), Solaris SVR4, or AIX.


    # UNIX Side Configuration


    Two requirements must exist before Samba printing will work:


    +   * You must have existing UNIX printer queues.

    * You must have either a valid /etc/printcap (if the printing is BSD-based), or
    you must have a supported lpstat command (for System VR4-based printing).


    The first is pretty self-explanatory. You must have some UNIX printer queues that
    work before Samba will be able to print to them! Test by printing some text from
    the UNIX command line. For BSD systems, try


    ```

    $ echo "This is a test" lpr -Pprinter

    ```


    For SVR4-based systems, try


    ```

    $ echo "This is a test" lp -dmyprinter

    ```'
