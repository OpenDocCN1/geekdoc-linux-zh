  md: 'It is a simple matter of filling in the destination (either a username on the
    network or a computername) and the message, and then clicking Send (or Cancel
    if you change your mind). Remember that the normal rules of NetBIOS name resolution
    apply. Both usernames and computer are classed as NetBIOS names, and if you have
    a multisubnetted network, you should really have some sort of WINS name resolution
    in place. See Chapter 5, "Integrating Samba into an Existing Windows Network,"
    for instructions on how to do this in a Samba environment.


    This utility is an excellent example of the good work that is being done for Linux
    to seriously compete with Windows as a desktop operating system. The more utilities
    that mimic the Windows environment that people are used to, the greater the chance
    that companies will give Linux a chance on the desktop. LinPopUp is quite useful
    if your users want to send messages to each other.


    # The SMB Authentication Module


    You may have heard of the Pluggable Authentication Module (PAM, as it is commonly
    known). PAMs are authentication modules that can be plugged into the login processes
    of a UNIX system. This means rather than the system authenticating users logging
    in with the telnet protocol via the system /etc/passwd or /etc/shadow files, the
    system administrator can define how authentication to occur. For example, a system
    administrator might prefer that all remote login to be done using authentication
    with SKey (a method of implementing one-time passwords) for security reasons.
    However, local logins using the standard login program can use the regular UNIX
    login methods. All UNIX system applications that accept some form of authentication
    are written to the PAM standard, which has a defined set of APIs. When a new PAM
    is written, it just has to be written to a standard; has the required API functions
    should be implemented, and it should be ready to be plugged in when required.
    PAM is now standard with many UNIX platforms including all varieties of Linux,
    HP-UX, and Solaris.


    As the name suggests, the SMB allows authentication of UNIX users via a Windows
    NT domain controller or Samba domain controller. This means that you can set up
    your UNIX system to authenticate to a Windows NT domain controller if your organization
    requires a unified login. Users only need to remember one password, their NT domain,
    which gives them access to UNIX systems as well.


    You can download the PAM for SMB from http://ftp.samba.org/pub/samba/pam_smb/pam_smb-1.1.5.tar.gz.
    When you unpack it, you''ll find installation instructions for the README file.
    A shortened version of the installation process follows:


    +   1. Run the configure program:


    ```

    [root@myhost pam_smb] # ./configure

    ```


    +   2. Run make:


    ```

    [root@myhost pam_smb] # ./make

    ```'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'Copy the resulting pam_smb_auth.so file to /lib/security (or on Solaris to
    /usr/lib/security).


    Configure a pam_smb.conf file with the name of the Windows NT domain, and two
    domain controllers for authentication purposes. Put this into /etc. Here''s an
    example:


    ```

    NTDOMAIN

    NTDC

    NTBDC

    ```


    Now you need to configure PAM to use the SMB PAM. Copy /etc/pam.d/login.old, and
    create a new one with these entries:


    ```

    auth      required      /lib/security/pam_secretary.so

    auth      required      /lib/security/pam_smb_auth.so

    auth      required      /lib/security/pam_nologgin.so

    account required      /lib/security/pam_pwdb.so

    password required      /lib/security/pam_cracklib.so

    password required      /lib/security/pam_pwdb.so shadow nullock user authtok

    session required      /lib/security/pam_pwdb.so

    ```


    If you are using Solaris, you need to make a change to /etc/pam.conf instead:

    other required      /usr/lib/security/pam_smb_auth.so.1


    There are many situations in setting up the SMB PAM module may be useful. Say
    that you have many users using Oracle databases. They may use a dumb terminal
    program such as telnet to access the text-based version of the Oracle application.
    To be able to do this, they need a login name and password for the UNIX server
    where the Oracle database is stored. Instead of having separate usernames and
    passwords for logging in the NT domain (via his workstation) and for logging in
    Oracle, the user would surely appreciate having a single username and password
    to log to everything! Setting up the UNIX server with SMB PAM module allows you
    to configure the UNIX server to redirect all login requests to a Windows NT server
    for authentication, giving users their single username and password combination.


    # Other SMB Utilities


