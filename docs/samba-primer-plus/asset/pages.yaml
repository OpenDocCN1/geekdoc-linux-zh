  md: 'This time, everything under the apps directory will get put into the tarfile.
    There are quite a few additional options to the -T option that you can specify,
    and they are fairly well docu-mented in the smclient manual page.


    # Environment Variables


    smclient knows to check whether certain environment variables are set, and if
    they are, smclient behaves in a particular manner. There are two variables that
    are checked for a default username, LOGNAME and USER. If either of them is set,
    the default username for the smclient session is whatever name was in these variables.
    If neither of these variables is set, the default username will be guest. Similarly,
    the PASSWD environment variable is set, instead of a password prompt, the contents
    of this environment variable are used as the passwd.


    # Using the smclient Interface


    The purpose of this section is to familiarize you with the user interface of smclient.
    You should have noticed by now that smclients interface is not unlike that of
    command-line ftp if you have used before. Most commands, when executed, send an
    SMB over the NetBIOS connection to the resource to achieve a particular task.


    Once you have an smclient session connected, there are a number of different commands
    you can use to navigate around the resource. There are the usual FTP or DOS-like
    commands such as


    +   * dir—To get a directory listing. An alias is ls.

    * del—To delete a file.

    * get—To transfer a file from the shared resource to the local UNIX file system.

    * mget—To transfer multiple files from the shared resource to the local UNIX file
    system.

    * put—To transfer a file to the shared resource from the local UNIX file system.

    * mput—To transfer multiple files to the shared resource from the local UNIX file
    system.

    * help—Get a listing of valid commands. You can also get help on a particular
    command by typing: help dir.

    * rename—Rename a file to a new name.

    * mkdir—Create a directory. An alias is md.


    Some more unusual commands are as follows:


    +   * recurse—Turn directory recursion on. This means that the next time the command
    dir is executed, the entire directory structure of the resource is recursed. This
    command is similar to typing dir /s on a Windows system, or ls -R on a UNIX system.

    * tar—Exactly like the command-line option, -T, but in interactive mode.'
  merge: -1
