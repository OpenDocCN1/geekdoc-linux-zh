  md: '# Chapter 7 • SAMBA IN A WINDOWS NT/2000 DOMAIN ENVIRONMENT


    supported! To be able to use domain controller functionality with any success
    and reliability, you must grab the HEAD branch source code from the read-only
    Samba CVS repository. Instructions on how to do this are detailed in the laer
    section, "Samba as a Login Server for Windows NT Clients (PDC Role)."


    With the development code, Samba can act, for all intents and purposes, as a Primary
    Domain Controller for both Windows 9x clients (the previous chapter) and Windows
    NT clients. This means that for members that joined the domain controlled by a
    Samba PDC, users can be authenticated to the domain to access resources, execute
    login scripts, and roaming profiles.


    There are some Windows capabilities that are not yet implemented in the development
    code at the time of this writing:


    +   * Samba cannot participate in trust relationships with another NT or Samba
    domain. Although this is partially implemented, it should be finished for the
    production release of Samba 2.1.

    * Samba forces printer connections to an NT server to use a lower level of the
    SMB protocol, rather than NTLmv2. Again, code for this should be complete for
    Samba 2.1.

    * Remember that in a pure NT domain environment there are BDCs as well as PDCs.
    The BDCs role is to store up-to-date backup copies of the main SAM for disaster
    recovery as well as for load balancing purposes. This BDC functionality is still
    in developmental phase and should be complete for Samba 2.1.

    * Windows servers allow you to put ACLs on a share level as well as a file-system
    level. When connecting, NT gets the user the most restrictive combination of permissions.
    This share-level ACL manipulation is not yet implemented in Samba.


    # Understanding Trust Relationships


    Trust relationships are an integral part of the Windows NT domain model. Trusts
    come in two forms: one-way trusts and two-way trusts. A one-way trust is useful
    when you have two independent Windows domains and want to provide users in one
    particular domain access to the resources of the other domain. For example, consider
    the retail outlet ACME Inc. Acme has a Windows NT domain called ACME. Acme''s
    goods supplier is called ComputerBits Inc., and has a Windows NT domain called
    BITS that is separate from its corporate network for the use of customers only.
    ComputerBits allows its customers to dial in its Windows NT domain and download
    drivers, look at its warehouse databases, and various other things. Here a one-way
    trust would be useful to allow Acme access to the resources available on the ComputerBits
    domain with its own SAM. A one-way trust is illustrated in Figure 7.2. ComputerBits
    is set up to trust ACME. The Administrator of the ACME domain adds BITS domain
    to its list of trusting domains, and then the Administrator of the BITS domain
    adds ACME to its list of trusted domains. The facility to do this is in User Manager
    for Domains under Policies, Trust Relationships.'
