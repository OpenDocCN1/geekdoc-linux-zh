    # Configuring Roaming User Profiles


    You are probably aware of or have heard about the concept of roaming user profiles.
    It was

    briefly talked about in the beginning of this chapter, but here is some more information
    for

    you. In a nutshell, roaming profiles means that you can theoretically log in to
    one Windows

    machine and set up the way you personally like it. You may like a particular color
    scheme,

    prefer a particular screensaver and want a particular background style. Then when
    you log off

    that machine and go to another else in the same company, you will get all your

    same preferences back again. Enabling roaming profiles is a way of personalizing
    your

    machine. You configure the machine you like the first time, and it will stay like

    that no matter where you log in.


    Configuring roaming user profiles for Windows 9x clients is easy. Just follow
    these steps:


    +   1. Start up Windows, log in, go to Start, Settings, Control Panel, Passwords,
    and click the

    User Profiles tab. Check the box Users can Customize Their Preferences and

    Desktop Settings, and select either of the two check boxes underneath, depending

