- img_proc: true
  md: 'Samba uses a file smbpasswd to store Windows NT-compatible encrypted passwords.
    When you compiled Samba with default options, Samba looks in /usr/local/samba/private
    for this file. If you use a precompiled package, this file could be anywhere!
    An easy way to find out your smbpasswd is located is to run this command:


    ```

    # testpasswd -s | grep smbpasswdnfile = /etc/smbpasswd

    ```


    The command testpasswd is a utility distributed with Samba that processes your
    smb.conf file and gives you a definitive answer as to what Samba variable is set
    to, as well as checking your smb.conf file for errors. smbpasswd will be found
    in /etc.


    Assuming you all your registered UNIX users to be able to log into Samba, log
    in root and create an initial smbpasswd file for this (replacing the destination
    path with the path you found from the testpasswd command):


    ```

    # cat /etc/passwd | mkspasswd.sh >/usr/local/samba/private/smbpasswd

    ```


    Alternatively, if you use site NIS:


    ```

    # ypcat /etc/passwd | mkspasswd.sh >/usr/local/samba/private/smbpasswd

    ```


    The smbpasswd file should be treated carefully as a shadow password file, so check
    that it has the correct restricted permissions. If you are using the path in example,
    make sure the private directory has permissions:


    ```

    # chmod 600 /usr/local/samba/private

    ```


    This changes the permissions to look like this:


    ```

    dr-x------ root root 1024 Oct 4 11:40 /usr/local/samba/private/

    ```


    Then you need to make sure the smbpasswd file has the correct permissions:


    ```

    # chmod 600 /usr/local/samba/private/smbpasswd

    ```


    The permissions on the file should look like this:


    ```

    -rw------- root root 230 Oct 4 10:49 /usr-/local/samba/private/smbpasswd

    ```


    In Red Hat, the smbpasswd file is by default located in /etc. Do not change the
    permissions on the directory /etc to be 500! This will break many things—UNIX
    systems require world access to /etc/ However, do be sure that the actual smbpasswd
    file has permissions 600 as described earlier.


    Each entry in this file will look something like this:


    ```

    matt:500:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX: XXXXXXXXXXXXXXXX

    ->U :LGT-000000000:Matthew Gillard,,,,

    ```


    There are two 32 bytes of Xes. Windows NT uses two methods of storing a user''s
    password hash. One is LAN Manager-compatible, and the other is the much stronger
    Windows NT LAN Manager version. For Samba to be compatible with any LAN Manager
    client, it must also'
