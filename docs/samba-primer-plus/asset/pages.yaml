    provides the flexibility of being backward compatible with NetBEUI for communication
    the older LAN Manager-based networks. Figure 4.3 shows the different layers and
    how Microsoft networking hangs hangs together.


    # FIGURE 4.3 The different Microsoft networking layers.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_80_0.png)


    The lowest level is the Network Interface Card (NIC), which sends the data out
    onto the network. The next level up is the combined Network and Transport layers.
    These can be-routable protocols as NetBEUI, or routable ones like TCP/IP. Then
    there is the Session layer, where NetBIOS sits. Microsoft wrote a mapping layer
    called NetBT, which is the interface NetBIOS uses to talk over TCP/IP.


    NetBIOS performs three different services: a name service, a session service,
    and a datagram service.


    # NetBIOS Name Service


    NetBIOS name service is how NetBIOS names are resolved to a physical network address,
    in this case an IP address. Windows broadcasts quite heavily for name resolution.
    Each Windows machine has a unique NetBIOS name, an example of a NetBIOS name could
    be ALFRED. Every time a computer boots and accesses the network, it sends its
    name in a net-work broadcast UDP packet is sent to every machine in the local
    subnet using a standard Internet port 137, which is the NetBIOS name ports. If
    there is another machine on the same network called ALFRED and it receives the
    ALFRED broadcast, it sends back a response to the machine that is booting up,
    which in turn will display an error message to the user when it boots. Before
    any NetBIOS applications will run correctly, the NetBIOS name of the host must
    be changed to a unique name and the computer rebooted.


    No two machines running on the same network can have duplicate names. NetBIOS
    names are 16 bytes long. The first 15 bytes are for the actual display name, and
    the 16th is to identify a NetBIOS service. This 16th byte can be a number 00h
    and Ffh. NetBIOS service running on a machine will have the machine name as the
    first part of the'
