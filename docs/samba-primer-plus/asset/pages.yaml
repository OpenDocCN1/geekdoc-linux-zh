    \ Samba to actually use it for something useful!\n\n# Review Questions\n\n+  \
    \ 1. How do you decide whether or not to use a precompiled Samba package or download\
    \ and compile the source code yourself?\n2. Where do you go for online documentation\
    \ for Samba?\n3. How do you configure Samba to install in /opt/samba, and install\
    \ the manual pages in /opt/share/man?\n4. If you have an HP-UX 11 system, how\
    \ would you go about installing the Samba startup files?\n   HINT: Some research\
    \ may be required. Try http://docs.hp.com.\n5. What is the difference between\
    \ putting Samba in inetd.conf and putting it in a regular startup file in /etc/rc.d/init.d?"
