- img_proc: true
  md: '# Introduction to Windows NT


    When Windows NT was first released, Microsoft''s vision was for NT to become the
    facto standard for home and office networks around the world. After eight years,
    five major versions, and a huge amount of Windows NT marketing, Microsoft has
    certainly accomplished its original dream. However, it has not been smooth sailing
    for Microsoft. Windows NT, until and including version 4.0, has suffered serious
    stability and security problems and is still trying to prove itself among the
    mature players in the server operating systems market, like NetWare and UNIX-based
    systems. Windows NT is definitely one of the most secure network operating systems
    available today, but it has one major failing, backward compatibility. One of
    Microsoft''s main marketing points for NT is that it is backward compatible with
    a large number of older DOS and Windows 3.1-based applications. This backward
    compatibility brought with it many the insecurities of the earlier operating systems.
    The main insecurity is the problem-plagued and insecure SMB protocol for file
    sharing. Microsoft has improved it with some security enhancements, but the whole
    purpose of NT being backward compatible with all those older DOS and Windows clients
    negates the value of that extra security—unless you use NT-only networks. Samba
    brings with it a more secure implementation of the SMB protocol than NT provides.


    For those of you unsure as to the features that Windows NT provides, here is a
    summary:


    +   - Fully 32-bit, designed from the ground-up, secure operating system, available
    for both Servers and Workstations

    - Backward compatibility with 16-bit Windows applications

    - Available on a choice of two architectures (until Windows 2000)

    - A secure and centralized method of storing and maintaining users and groups

    - Easy integration between separate NT networks using trust relationships

    - Encrypted user authentication

    - File-sharing services


    Windows 2000 added to this list:


    +   - Full directory services

    - Kerberos authentication

    - Much better remote administration capabilities

    - An enhanced version of NTFS


    There are problems too, of course:


    +   - Price. Using Windows NT can be very expensive. And when you have the operating
    system, you also have to pay for every application.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '+   Using the tools provided with the system, it is impossible to fully administer
    remotely. This means either you have to purchase third-party applications to help
    with this, system administrators at each remote site you deploy NT to, or spend
    money on transporting administrators to each remote site when there is a problem.


    +   With many different applications loaded, NT can sometimes be unstable. Because
    many NT application developers come from a DOS/Windows background where there
    is no concept of a secure system, many developers create software under Windows
    without using the security features and guidelines Microsoft recommends.


    Because Linux and other UNIX-based operating systems address these problems, UNIX
    systems running Samba make huge inroads into Microsoft''s Windows market.


    As you are aware from now what you have read so, originally Samba was developed
    to provide file-sharing services, only a fraction of the tasks that a Windows
    NT server provides. Coincidentally, the SMB protocol is mostly documented, which
    made it relatively easy to implement. As we went on, extra Windows features were
    requested from the Samba community to be implemented into the Core Samba project.
    The problem was that many of the extra features being requested were not documented
    anywhere outside Microsoft. The only way to implement such features was for the
    developers to study lines of network traces to find out exactly what was happening
    when tasks were performed. From this enormous amount of effort over the past few
    years by the Samba team, it provides a majority of Windows NT''s features available
    for free. Many companies are either dispensing with NT altogether, or integrating
    it in a heterogeneous environment with Linux and other UNIX servers.


    # Differences Between Workgroups and Domains


    When you start out with Samba, one of the first questions asked by Windows newcomers
    is: "What is the difference between a domain and a workgroup?" administrators
    with many years of experience have problems answering this question. This question
    should help unravel the relationships between workgroups and domains.


    Microsoft first introduced the concept of a workgroup back in the days of LAN
    Manager for MS-DOS and Windows 3.1 Workgroups. A large corporation usually contains
    many functional areas, for example an Accounting department, an Engineering department,
    and a Manufacturing area. The workgroup concept was chosen to categorize computers
    that perform similar functions or are similar in an area. In this example, all
    the computers in the Accounting department may belong to a workgroup called Accounts.
    The Engineering department may have a workgroup called Engineering, and the Manufacturing
    area may be in the workgroup Factory. In these early days, many organizations
    did not have a central-server, and resources were spread out among the different
    departments, especially printers. The way to find these resources, both shares
    and printers, was to browse the network (Computer Browsing is discussed later
    in this chapter), expanding the various workgroups and computers until the required
    resource was found.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# SAMBA PRIMER PLUS


    As you can see, resources in a groupwork environment were spread among the PCs
    in an organization without much thought put into it. It did get better later on,
    with some companies putting file servers throughout the network, but there was
    no central method of authenticating users or keeping track of which users were
    connecting to what resources. The environment was decentralized. This type of
    security on resources was called share-level security. With share-level security,
    an optional password is placed on the shared resource. Share-level security is
    not used by many because many sites use domains where user-level security is installed.


    Then the first version of NT was released, Windows NT 3.1. With it came the concept
    of domains instead of workgroups. On the surface, if you are browsing a large
    network with Network Neighborhood you can see that the domains are mixed with
    the workgroups and you cannot tell the difference. This is illustrated in Figure
    4.1.


    # FIGURE 4.1


    A list of workgroups and domains on a large network.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_77_0.png)


    They may look similar on the browse list, but there is a key functional difference
    between the two. A domain provides a centralized method of security: organizing
    users, groups, and workstations. Where a company may have multiple workgroups,
    it usually replaced them with a single domain. For a workstation to participate
    in a workgroup, all that is needed is simply type the workgroup name in the appropriate
    network settings box, and it will appear in that group. Each workstation that
    requires access to a domain must be added by a Domain Administrator. After a workstation
    is joined to a domain, the only people who can log in it are defined in the domain.
    When a user is granted access to a domain by a Domain Controller (DC), assuming
    he has correct permissions, he can access any resource on the domain. A resource
    is a fileshare or printer. This type of resource sharing uses user-level security.
    In user-level security, a correct username and password combination must be'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'given, it is verified by a special server that authenticates access to a domain
    called a Domain Controller (DC), and then if granted access, the resource is permitted.


    There was no security with workgroups. Workgroups were just a method of providing
    easy access to resources on the network. Domains take that concept and extend
    it to include a form of access control of who actually has access to the resources
    on the network. All access to the domain, whether it is a user or machine, is
    controlled by the Domain Administrators rather than the users. A PC can only be
    added to the domain by, a user account must be created by the administrators of
    the domain. Figure 4.2 illustrates the differences between a workgroup and a domain.


    # FIGURE 4.2

    Workgroup and a domain.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_78_0.png)


    A Windows NT domain consists of these four main components:


    +   - A Primary Domain Controller (PDC). Every domain has only one of these. A
    PDC is the machine that holds the security accounts manager (SAM) database. Every
    user, machine, and group that is allowed to be a part of the domain has an account
    in the SAM data-base. A PDC is the only machine that has writable access to the
    SAM.

    - Backup Domain Controllers (BDC). There is usually one or more of these, but
    if the domain is small, you can get by none. A BDC holds a read-only copy of the
    SAM database from the PDC. All BDCs get regular updates to the SAM, and can authenticate
    users to the domain. Having a number of BDCs spread out among different physical'
