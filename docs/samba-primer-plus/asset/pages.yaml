    # Setting Yourself Up as a CA


    If, as a company, you will be using SSL for internal use by your employees, you
    do not need to go to the expense of paying for a well-known commercial CA. You
    probably better off being your own CA, signing your own certificates. However,
    as you provide publicly accessible Web sites, you will need to use one of the
    many commercial CAs as the Web browser (SSL client) can authenticate your certificate
    with the known CA''s public key


    Setting up a CA is fairly easy to do. First edit the openssl configuration file,

    /etc/openssl.cnf, and find this section:


    ```

