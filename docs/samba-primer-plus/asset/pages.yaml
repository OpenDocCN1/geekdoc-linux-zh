  md: '# Chapter 5 • INTEGRATING SAMBA INTO AN EXISTING WINDOWS NETWORK


    The sambcommand is quite versatile, as you will see later in Chapter 8, "Using
    smclient." The -M option allows smclient to send a PopUp style message to a particular
    computer name. With a bit of UNIX scripting, you can send a message to all users
