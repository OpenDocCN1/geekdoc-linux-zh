    them in the systems /etc/services file now!


    # Starting Samba from a Startup File


    The other method used to start Samba is to create a startup file that is processed
    on bootup. This method is a little more involved, but is perhaps the most popular
    for the reasons mentioned earlier. Most UNIX systems these days are System V-based
    (including Linux), which means that they use a directory structure similar to
    that shown in Figure 2.1.


    # Figure 2.1


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_41_0.png)


    However, some systems, such as Solaris don''t have the separate rc.d directory
    and have the rc*.d and init.d subdirectories directly under /etc.


    There is a startup script for each service that gets installed in the init.d directory.
    Each startup script performs both start and stop functions. Each of the rc directories
    specifies what services are to be started and stopped at a particular runlevel.
    The digit in the directory name specifies the runlevel, for example, rc.1 is runlevel
    1. A link is placed in each of the rc directories that points to an appropriate
    entry in the init.d directory. Then when a runlevel is reached, the scripts are
    executed with a start as the parameter that starts each service needed at that
    runlevel.'
