    to install the manual pages only.

    By now, you have done all the hard work. All that is left is to get Samba installed
    in your system startup files, but don''t worry, it is actually fairly simple as
    you are about to find out.


    # Samba at Startup


    It is all well to get Samba installed on your system, but it is not actually very
    useful until you notify your system startup files to start Samba on bootup. You
    can do this by one of two methods. You can either configure Samba to start in
    inetd, effectively running each time a session is requested, or by using a startup
    script which is running all the time as a dedicated daemon. The main disadvantage
    of starting Samba from inetd is that it takes an extra amount of time for inetd
    to figure out which daemon is process a particular incoming connection. This is
    opposed to running Samba as a dedicated daemon so that an incoming connection
    occurs, all that needs to be done is beginning the connection immediately. If
    you have a low-end server and are only using Samba occasionally, it probably makes
    sense to use inetd it on demand, saving memory that you can use for other things.
    On the other hand, if your Samba server will be constantly getting used and Samba
    is effectively running all the time anyway, you would almost certainly choose
    to run it as a dedicated daemon.


    If you are unsure of which method to use, most people generally run the Samba
    daemon all the time by using a startup file at bootup. The main reason for this
    is that the price of memory is effectively insignificant in the overall price
    of a server, and you can afford to have some unused network daemons running.


    # Running Samba from inetd


    Running Samba from inetd is probably the least common method; however, it is still
    useful in some circumstances. Many network services are configured to run from
    a program called inetd, which listens on particular ports for activity. When activity
    is noticed on one of these ports inetd is listening to, it starts the particular
    network daemon that services that port. An example would be when remotely logging
    into a machine with telnet. inetd notices an incoming connection to port 23 (the
    standard telnet port) and starts the telnet daemon, which then services the telnet
    connection until it is disconnected.


    This involves editing the file /etc/inetd.conf and adding an entry for the main
    Samba server similar to:


    ```

    netbios-ssn stream tcp nowait root /usr/sbin/tcpd

    -/usr/local/samba/bin/smbd

    ```


    And also an entry for the NetBIOS Nameserver daemon, which would look something
    like this:


    ```

    netbios-ns stream tcp nowait root /usr/sbin/tcpd

    -/usr/local/samba/bin/nmbd

    ```'
