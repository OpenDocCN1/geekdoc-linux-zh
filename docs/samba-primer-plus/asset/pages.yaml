  md: '# CHAPTER 2


    # COMPILING AND INSTALLING SAMBA


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_30_0.png)


    You will learn about the following in this chapter:


    +   - The procedure to go about installing Samba on your system

    - The differences between precompiled packages and compiling Samba yourself

    - How to download a precompiled Samba package and install it on your system


    +   - How to download the Samba source

    - How to compile and install Samba from the source code


    In this chapter, you will learn how to actually install Samba on your system.
    There are basically two methods; both will be described, as well as some hints
    on which method might suit your needs best. The first method is to download a
    precompiled package and install and configure it. Alternatively, with most open
    source applications, you can grab the source code and compile it yourself. Due
    to the popularity of Linux, most of my examples will be based on a Red Hat Linux
    6.0 system, which will probably apply equally to other UNIX systems as well. Differences
    will be noted where appropriate. For those of you who are interested in installing
    Linux, go to http://www.redhat.com for information on your nearest Red Hat stocklist.


    # How Do I Install Samba?


    After you have read the first chapter and realized how appropriate Samba is to
    solve your business problems, you probably want to jump right into it! However,
    there is one major question to answer. That is, do you want to install a precompiled
    Samba package, or compile the Samba source code?


    If you are running a PC-based UNIX as Linux or FreeBSD, a precompiled package
    is almost the mandatory method to use. For details regarding this method, see
    the next section, “Downloading Precompiled Packages,”'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'However, if you want to install Samba on a high-powered corporate UNIX server
    including (but not limited to) HP/UX, Solaris, or Digital UNIX (now known as Tru64
    UNIX), in most cases the only option you have is to compile the Samba source code.
    For more information, see the section, "Downloading the Samba Source," later in
    this chapter.


    # # Downloading Precompiled Packages


    Your first question is probably: What is a precompiled package? The way a precompiled
    package works is that you download a single file (or it could be provided on a
    CD-ROM) that contains all the information needed to install the product, in this
    case Samba. To make the definition more confusing for you, almost every UNIX distribution
    out there has a different method of making these precompiled packages. To make
    things easier, Table 2.1 lists the most commonly used UNIX variants and the method
    of precompiled packages that they use.


    TABLE 2.1 UNIX Variant and Package Format Used

    | UNIX Variant | Package Format |

    | Red Hat Linux | Red Hat Package Manager (.rpm) |

    | Debian Linux | Debian Package Management System (.deb) |

    | SUSE Linux | Red Hat Package Manager (.rpm) |

    | Caldera OpenSystems Linux | Red Hat Package Manager (.rpm) |

    | Solaris | pkgadd format |

    | HP/UX | Depot format |

    | AIX | SMIT (idd) |

    | SCO OpenServer 5 | SCO Software Manager (custom) |

    | UnixWare 7 | pkgadd |


    Precompiled packages are generally the preference when installing software today.
    There are a few reasons for this:


    +   - It is easier for beginners to install a piece of software if all they need
    to do is download a package file and run a single command to install it.

    - Both the Samba executable files and configuration files automatically get put
    in a consistent place.

    - When a new version of software gets released, someone else goes to the effort
    of compiling and porting it if needed (see the following sidebar), and then packages
    it.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Chapter 2 • COMPILING AND INSTALLING SAMBA


    +   - When you upgrade your Linux or other UNIX variant operating system to a
    later release, vendor-provided packages automatically get upgraded as part of
    the operating system upgrade process. Even if some of your packages are not vendor
    provided, there is a good chance someone will contribute an updated version with
    the new version of the operating system.


    # If I Am "Porting" Some Software, What Does That Mean?


    If you are wondering what "Software Porting" is all about, let me explain. John
    has access to a Linux box for development purposes. He develops the software on
    that system and it works. John then made his newly developed software available
    for download. Ben comes along and thinks this software looks perfectly neat, and
    he decides to download and compile it on his system. Poor Ben only has IBM AIX
    box and finds out that John''s software does not compile. Luckily, Ben has years
    of experience with AIX and finds out that the call used in software is unavailable
    in AIX, but modifies and compiles it ready to run Before Ben forgets a diff of
    the changes made, and sends them to John to include in the main distribution.
    This means the next person to download the software who runs the AIX operating
    system has to make a change in the Makefile to compile it for their architecture.


    This process is known as "porting." It is safe to say that because of porting,
    Samba is available on many different UNIX platforms today. In fact, it is also
    available on Compaq''s OpenVMS operating system.


    There are also reasons why you might not want to choose a precompiled package:


    +   - There might be times when you want to make a feature unavailable, and the
    only way to do this is to disable this unwanted feature before compilation.


    +   - You might want to optimize certain parts of an application for your particular
    server hardware. For example, a program optimized on an original Pentium system
    may not be totally optimized for the newer Pentium II or Pentium III architectures.


    +   - There might be a need to add a new feature to an application. You cannot
    do this if you all have a compiled application with no source code.


    # Where to Get Samba Packages


    When you have decided that you want to install a Samba package, you need to either
    download or install it from your vendor-provided CD-ROM. The method you use pretty
    much depends on the variant of UNIX you are running. If you use one of the free
    variants of UNIX as Linux, it will almost certainly be on your CD-ROM. However,
    careful! If you have an older version of your operating system CD lying around,
    it most likely does not have the latest version of Samba on it. With Samba, you
    should try to install the latest production quality release, at which the time
    of this writing is 2.0.6. There are several reasons for this:


    +   - The latest version will generally be the most bug-free, which means you
    should get it up and running more quickly than if a bug were working from your
    environment.'
  merge: -1
