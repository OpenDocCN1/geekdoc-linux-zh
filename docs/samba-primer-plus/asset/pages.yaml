- img_proc: true
  md: '# Parameters Related to Shares


    These parameters change certain attributes of the particular share in which they
    are defined. The max parameters covered include max connections, which specifies
    how many users are allowed to connect simultaneously; volume, which allows you
    to have a volume name returned for the share; locking, which controls whether
    or not Samba is grant locks requested by the client; copy, which allows you to
    implement template shares and copy them any number of times; and finally blocking
    locks, which controls whether Samba will grant locks on part of a file rather
    than the entire file.


    # max connections


    The max connections parameter allows you to specify (and hence limit) the maximum
    number of simultaneous connections to a server. It defaults to 0, which means
    unlimited connections to a service are allowed. This may be useful in situations
    where you have a specific number of licenses to a particular software package
    that you make available over the network. When max connections is set, lock files
    are used to count the number of sessions to the share, and the location for these
    lock files is specified in the lock directory parameter. It defaults to /tmp/samba.


    # volume


    The volume parameter allows you to specify the volume label returned for a share.
    This is displayed when you view the properties for a drive under Windows, as in
    Figure 10.1.


    FIGURE 10.1


    The volume label as returned by Windows NT.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_200_0.png)


    Some installation programs from CD-ROM expect a particular volume label or they
    will not run, so this is especially useful in those circumstances.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# locking


    Different connecting clients can specify lock requests for certain files. This
    parameter controls whether or not Samba will actually perform these lock requests.
    By default, locking is set to yes. If it is set to no, lock and unlock requests
    will appear to succeed to the client but will not actually done. You will only
    need to change this parameter if you are having a particular problem that you
    think might be caused by locking.


    # copy


    The copy parameter is very useful. It allows this service to be a copy of another
    service. This parameter is often used when you have different names for one share
    for backward compatibility. It may also be used to create template services to
    simplify creating similar services. An example of this uses:


    ```

    [templ1_mktg]

    comment = ''share used for marketing dept''

    create mask = 0770

    guest ok = no


    [usa_mktg]

    copy = templ1_mktg

    path = /groups/usa/marketing

    ```


    This will copy all the parameters specified in the templ_mktg service to the usa_mktg
    service. You can put any other parameters you like in the new service—they override
    the template''s service parameters. In the previous example, usa_mktg effectively
    looks like this:


    ```

    [usa_mktg]

    comment = ''share used for marketing dept''

    create mask = 0770

    guest ok = no

    copy = templ1_mktg

    path = /groups/usa/marketing

    ```


    Being able to do this helps tremendously with administration, especially if you
    have many shares copied with similar options set.


    # blocking locks


    SMB clients can specify a byte range lock on a region of an open file. This request
    has a time expiry with it, if the lock cannot be granted immediately, it is queued
    and keeps trying until the time expires. In the Samba 2.x series, this setting
    defaults to true. If it is set to false, Samba will fail the lock request immediately,
    ignoring the request''s expiry parameter. You may need to do this if you have
    broken client applications that ask for this lock in an incorrect manner—this
    would cause noticeable delays that you might think are being caused by Samba.\
    It is rare to use this parameter now because most applications behave correctly.'
