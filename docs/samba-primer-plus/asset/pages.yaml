    # NetBIOS Datagram Service


    A NetBIOS datagram has a source and destination NetBIOS name in the header, and
    is sent on UDP port 138. The main purpose of a NetBIOS datagram is to send a message
    from one NetBIOS machine to another. The most common application that uses NetBIOS
    datagrams is the Windows Messenger application, or the Windows 9 WinPopUp program.
    Allows users to send short messages to each other, or a system administrator to
    send broadcast message to all users notifying them to log out due to system maintenance.
    Samba can generate NetBIOS datagrams as well; for more information, see the next
    chapter.


    # Browsing on a Windows Network


    Computer browsing on a Windows network is probably one of the least understood
    aspects of Microsoft networking. Most people, including many Windows NT system
    administrators, do not understand it, even though it is documented on many resources
    including the Microsoft TechNet CDs. It is probably more appropriate for Samba
    administrators to understand how browsing works, so they can make Samba correctly
    in an existing Windows network so Samba shows up on all browselists correctly.


    Browsing a Windows network allows you to click your way through an organization''s
    groups and domains to find a resource you are looking for. The common question
    that gets asked over is: How does a browse list get built when you fire up Network
    Neighborhood? To many people, it is black magic and they don''t understand how
    it magically appears, or, more commonly, they don''t. However, if you are responsible
    for your site''s network, you should know at least the basics of computer browsing.
    Knowing this information helps you diagnose browsing problems when they occur.'
