    # User Authentication


    As mentioned previously, there have been three versions of authentication protocols
    over the years of SMB Evolution: Plaintext, LAN Manager challenge/response, and
    NT LM challenge/response. All these are supported by Samba through the main daemon,
    smbd.


    # Computer Browser


    Something I have not touched on that is related to the NetBIOS name services is
    the Computer Browser service. NetBIOS is a very broadcast-oriented service, which
    originates from its beginnings when it was coupled with NetBEUI. Even though TCP/IP
    is a routable protocol, NetBIOS broadcasts go only to the local LAN. You can browse
    Microsoft networks when looking for a particular resource to connect. Browsing
    the network groups and domains is listed in a listing browser, and you can click
    down each layer until you get to the resource you want. This is how browsers created—especially
    today''s networks are segmented and NetBIOS broadcasts only get sent to a single
    subnet? One option is to allow all NetBIOS broadcast traffic through all your
    routers. This is most probably a bad idea. You do not want any extra traffic on
    your network if you can help it! Microsoft realized there was a problem here,
    so it introduced the concept of a Master Computer Browser. This is a NetBIOS service
    that can run on any Windows machine. (This is usually self-tuning; if a machine
    determines there is no master browser on a subnet, an election is fought that
    determines who will be the master browser.) The master browser keeps track of
    all the'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# SAMBA PRIMER PLUS


    NetBIOS names on a physical LAN segment. There are other computer browsers on
    other physical LAN segments that do the same thing. When all the Computer Browsers
    share information with each other, you can see that the network effectively mapped
    so that no matter what segment you are on, you can talk to pretty much any other
    by name. Samba also provides computer-browsing services via the nmb daemon. More
    information on computer browsing is given in Chapter 4.


    # Domain Logins


    A quite useful function is the capability of Samba to provide domain login services
    for Windows 9x clients, and recently Windows NT clients. The leader is provided
    through Samba''s experimental PDC functionality, at which the time of writing
    is still in Beta test, which quite well. This domain functionality includes such
    as login scripts, roving profiles, and much more. I discuss how to use Samba''s
    domain login functionality in Chapters 6 and 7.


    # What Is CIFS?


    By now you probably heard something about CIFS. In fact, many people use the term
    interchangeably with SMB. Microsoft has devised CIFS to replace the NT LM 0.12
    protocol. CIFS is currently an Internet Draft with the Internet Engineering Task
    Force (IETF), so the standard is open to review by anyone chooses to download
    it. You can read it online at http://ftp.microsoft.com/developer/drv/CIFS/draft-leach-cifs-vi-spec-01.txt.
    One major feature of the draft standard is that NetBIOS will no longer be a requirement
    for the file-sharing aspect of the protocol. Finally, this means that CIFS will
    be able to use Domain Name Server (DNS) to resolve servers, just as the rest of
    the world does! A partial implementation of CIFS is in Windows NT 4.0. In Windows
    NT 4.0, you can map a drive using an IP address or fully qualified name, NetBIOS
    still has to be there. Microsoft has promised that a full version of CIFS that
    does not require NetBIOS will appear in Windows 2000, released in February 2000.


    # Summary


    The aim of this chapter was to give you an introduction to Samba, what it does,
    and why it exists. You have learned that Samba was created to be able to access
    files on a UNIX-based server from a Windows PC. The project grew to a point where
    it emulates Microsoft describes as a LAN Manager server, including many domain
    controller functions.


    You have read that the SMB protocol as we know it today has gone through many
    revisions over the last decade, and the revisions are continuing to the next generation
    of SMB, called CIFS.


    Finally, you learned that Samba performs five functions: It acts as an SMB server,
    performs NetBIOS name resolution, does user authentication, provides computer
    browsing'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'services, and provides domain login functions for Windows 9x and NT clients.
    And the next area that is currently being worked on is total Windows 2000 compatibility.
    The aim is that you will be able to plug a Samba server into your network, and
    your end users should not even know that the server where their files are stored
    has no Windows operating system on it at all.


    In the next two chapters, you will be able to get your hands dirty and get a working
    version of Samba running on your own Linux system, be it at work or at home. If
    you are running another UNIX-based operating system at work, Samba will run on
    it as well. The practical examples in this book should work on whatever UNIX system
    you are using with minimal changes required.


