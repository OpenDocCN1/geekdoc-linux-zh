  md: '# CHAPTER 3


    # BASIC SAMBA CONFIGURATION


    You will learn about the following in this chapter:


    +   * How to install SWAT onto your Samba server

    * How to set up Windows 9x and Windows NT to talk to Samba

    * How to use SWAT to configure your Samba server

    * How to do some simple troubleshooting of Samba

    * How to do simple testing of your newly created Samba configuration


    In this chapter, you will learn how to configure Samba so that you can connect
    to a share from your Windows 9x or Windows NT box. After all, this is what Samba
    is about! SWAT comes with the Samba distribution, and makes it whole lot easier
    to configure if you are not confident with editing text-based configuration files.
    After that, the chapter explains the basics of setting up your Windows clients
    to be able to talk to Samba, so you can begin sharing files from your UNIX system.
    After you get that far, you''ll learn how to edit the Samba configuration directly.
    It is really not as hard as you might think! Finally, you may have bumped into
    some problems along the way, the chapter presents some simple troubleshooting
    to try and help you get out of issues you might have found as you were experimenting.


    # Samba Web Administration Tool


    Until the release of Samba 2.0, when you needed to configure Samba, you pretty
    much had no choice except manually edit configuration files. There were several
    contributed programs that people wrote to make the configuration easier, but nothing
    in the official Samba distribution.

    With Samba 2.0 came SWAT, the Samba Web Administration Tool. SWAT gives you a
    method of changing the text-based Samba configuration file easily, and greatly
    reducing any errors that you might make if you make changes manually.'
  merge: -1
  pgno: 46
- img_proc: true
  md: "# Installing SWAT\n\nIf you manually compiled Samba, as described in the last\
    \ chapter, you need not do anything, SWAT should already be installed on your\
    \ system under `/usr/local/samba` if you used the default directory settings of\
    \ the `configure` program.\n\nIf you installed a Samba package, SWAT may or may\
    \ not be part of the standard Samba package, depending on whether the person who\
    \ created the package required it. If you have installed a Samba package, and\
    \ SWAT is not in the usual places, such as `/usr/local/samba/bin/swat`, `/opt/samba/bin/swat`,\
    \ or `/usr/sbin/swat`, it is probably safe to say that it is not installed. As\
    \ an example, to be totally it is not on your system, if you are using a Linux-based\
    \ Unix system that uses `rpm` for package management, you can execute the following\
    \ command:\n\n```\n# rpm -qal | grep swat\n```\n\nThe first section of the command\
    \ before the pipe lists all files that have been installed on the system using\
    \ rpm. Because you only care whether swat is installed, you will grep for the\
    \ swat command. If you get no results, swat is not installed. If this is the case,\
    \ you will need to do one of two things:\n\n+   1. swat may be in its own separate\
    \ package on your Linux distribution CD. Check for something with swat in the\
    \ beginning of the name. For example, with Caldera OpenLinux2.0.3-0b1386.rpm.\n\
    2. You can go back a chapter and read how to get the Samba source distribution\
    \ and compile Samba. That way, you know swat will get installed correctly, because\
    \ you will be doing the entire compilation/installation yourself.\n\nIf you have\
    \ installed, you need to do a small amount of preparation first.\n\nYou need to\
    \ make sure there is an entry in `/etc/services` that looks like this:\n\n```\n\
    swat\t901/tcp\t# Samba Web Administration Tool\n```\n\nAlso, you need to check\
    \ for an entry in `/etc/inetd.conf` that looks like this:\n\n```\nswat\tstream\t\
    cp nowait.400 root\t/usr/sbin/tcpd swat\nat\tstream\tcp nowait.400 root\t/usr/local/samba/bin/swat\
    \ swat\n```\n\nOf course, if you are not using tcpd, you will need to put something\
    \ like this in instead:\n\nIf you modify `/etc/inetd.conf`, you must restart inetd:\n\
    \n```\n[root@pinkie]# # killall -HUP inetd\n```\n\nOr:\n\n```\n[root@pinkie]#\
    \ # kill -HUP `var/run/inetd.pid`\n```\n\n# Using SWAT\n\nAfter you have SWAT\
    \ installed, you can use it! Open up your Web browser of choice and go to the\
    \ address http://unixserver:901/. You will be prompted as Figure 3.1."
  merge: -1
