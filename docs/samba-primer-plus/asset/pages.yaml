  md: '# Samba

    Primer Plus


    Samba Primer Plus is a conversational-style book aimed at beginning Samba users
    who want to get Samba up and running quickly. Each chapter focuses on the necessities,
    so you will learn only the most important information. The hands-on examples ensure
    that you will know how to implement and administer Samba after reading this book.
    There are chapter ending questions, answers, and exercises to enhance your retention
    of the material.


    With Samba Primer Plus, you''ll first learn the fundamentals and then how to apply
    the knowledge you''ve gained to solve common problems. Find the information you
    need on such topics as:


    +   * Installing and configuring Samba

    * Solving specific problems for different network setups

    * Sharing files and printers

    * Using Samba with all current Windows*-based systems, including Windows* 9x,
    Windows NT*, and Windows* 2000


    As a systems administrator, your greatest needs will be when you learn to use
    Samba to integrate Linux/Unix servers into a Windows-based network, have Samba
    integrate desktops into a Linux/Unix-based network, and effectively administer
    and troubleshoot a heterogeneous network environment. You will learn all you need
    to know about Samba in this book.


    The CD-ROM contains the latest source and binaries of Samba; several Samba administration
    tools including GSMB, KSamba, SMB2WWW, smbcontrol, smbedit, smb-mode.el, and xBrowser;
    and several network utilities including ethereal and LinPopUp.


    For the past five years, Matthew Gillard has been working in the information technology
    field as a UNIX and Windows consultant for Cybersource Pty. Ltd., a Melbourne-based
    firm specializing in UNIX and Windows systems integration (www.cyber.com). He
    has experience with implementing and supporting large Windows NT and UNIX-based
    environments, and has also worked on Internet security and firewall projects.
    Matthew was a contributing to Red Linux 6 Unleashed and Linux Unleashed, Fourth
    Edition.


