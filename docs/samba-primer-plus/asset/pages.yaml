  md: '# Workgroups and Domains Revisited


    Let''s briefly return to the earlier discussion regarding the differences between
    domains and workgroups that was explained to you in Chapter 4. Consider Figure
    6.1.


    FIGURE 6.1


    A Windows 95/98 client participating in a workgroup.


    ![](img/55bb92df8f8bd2a90a13c9a131fa64c0_114_0.png)


    Remember, in a workgroup, there is no such thing as centralized user management.
    In the less secure clients like Windows For Workgroups and Windows 9x systems,
    if a user has not logged in before, he will be asked to verify his password and
    an "account" will be created for him. Unfortunately, this is not a real account.
    The only "user" information stored is the username and password, and optionally
    passwords to other resources that the user uses does not have to type his password
    in all the time. For each user, a file username.pw1 is created in the Windows
    directory that stores these passwords. As you can see, this method is archaic
    in it results in numerous *pw1* files being created on the system for each different
    user that logs in. Not only that, but it is vital to break the simple encryption
    used in these *pw1* files, which means that passwords for users can be recovered
    by using tools that are very easy to find on the Internet. This might seem not
    much of a problem because anyone one can log in to the Windows clients anyway.
    But users generally have one or two passwords that they'
  merge: -1
