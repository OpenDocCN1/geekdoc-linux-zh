  md: '# Chapter 2 • COMPILING AND INSTALLING SAMBA 21


    The docs directory is self-explanatory. It contains a lot of contributed Samba
    documentation, which has grown increasingly since the Samba project began. It
    is always the first place to look if you cannot get something working correctly.


    The directory examples has some examples of Samba configuration files for particular
    environments. It is also worth to look if you are having problems.


    The packaging directory contains scripts to help create operating-system-dependent
    precompiled package files (mentioned in detail in the previous sections on precompiled
    packages). This is useful, after you have compiled Samba, you want to make your
    binaries easily usable by someone without having to compile them themselves.


    The source directory is where all the Samba source lives. It is also the directory
    where you compile Samba.


    Finally, the swat directory is where the Samba Web Administration Tool lives.
    More on this will be in the next chapter, "Basic Samba Configuration."


    To compile Samba, you first need to change the source directory. As with many
    open source projects today, the precompiling configuration required is automatically
    done for you with the supplied configure program.


    # How Samba Was Configured Before the Automatic Method That Is in Now


    Previous versions of Samba (prior to the 2.0 series) required tweaking of a Makefile
    for certain configuration options such as the installation directory, and other
    options dependent on UNIX system you were compiling it. With the advent of the
    2.0 series of Samba, this is taken care of for you by the GNU configure program.
    If you are familiar with the older Samba distributions, you will find the configure
    process a breath of fresh air!


    The configure program provides certain advantages over the former method of directly
    editing a Makefile:


    +   * No knowledge of any details of the UNIX platform is required. When executed,
    configure automatically configures a Makefile streamlined for the UNIX system
    it is running on

    * configure automatically detects what libraries and include files are installed
    on the system, and configures a Makefile accordingly. No more getting to the end
    of a compilation to find you have a needed library file missing.

    * If configure detects that you do not have a needed library or other dependency
    is required for a successful completion, it prompts to tell you what it needs,
    and does not create a Makefile until everything is there.


    In its simplest form, you just need to execute configure like this:


    ```

    [root@pinkie /usr/local/src/samba-2.0.5a/source] # ./configure

    ```'
