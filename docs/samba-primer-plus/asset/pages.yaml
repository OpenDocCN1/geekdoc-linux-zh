    3. When a Windows client uses a login server to authenticate users, a special
    read-only share is also accessed called netlogon. On this share you can put programs
    that are accessed during login or other files you want any host to be able to
    access during the login process. This is where login scripts (see step 5) and
    system policy files are located. You need to create this script for your Samba
    server by adding something like this to your smb.conf file:


