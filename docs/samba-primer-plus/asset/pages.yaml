    +   - At a glance whether or not the main Samba processes are running (*smbd and
    nmbd*).


    +   - Start, stop, or restart either process if necessary.


    +   - See all the Active Connections to the Samba server by IP address, including
    the Process ID of the smbd daemon that was spawned for that process and the time
    and date the connection was made.'
