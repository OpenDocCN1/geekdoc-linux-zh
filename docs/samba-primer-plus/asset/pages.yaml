    If you run Microsoft applications as Internet Information Server (IIS) or SQL
    Server on any servers, they register NetBIOS names as well.


    For two nodes communicate with each other using NetBIOS, the calling machine needs
    an IP address of the machine sharing resources. To achieve this, a NetBIOS query
    broadcast is sent out the machine requesting a NetBIOS session. This is done on
    the NetBT layer mentioned previously. All nodes on the subnet will receive this
    broadcast, but only the machine with the NetBIOS name being called will respond.
    If there is no machine on the network with requested NetBIOS name, there will
    be no response to the broadcast.


    NetBIOS name resolution can be categorized into five different types with each
    node on the network configured to use one method to resolve names, and one with
    four being the most popular:


    +   1. The broadcast mode, or b-node mode. This mode is the computer requesting
    resources broadcasts the NetBIOS name of the computer it wants to talk to the
    entire subnet and waits a specified time for a response. Because most routers
    are not configured to forward broadcasts, this method will work only for machines
    in the subnet.


    +   2. The Point-To-Point mode, or p-node mode. Rather than broadcasting across
    the entire subnet, a requesting computer contacts a central database of known
    NetBIOS names on the network to find the NetBIOS name and IP address mapping.
    This central database is known as a Windows Internet Name Service (WINS). This
    method does not use broadcasts; however, if the WINS server is down, name resolution
    will fail.


    +   3. The m-node mode. In this mode, a computer first uses b-node for name resolution.
    If it fails, it switches to p-node. This method still suffers from the broadcast
    problems discussed in the b-node, but can cross routers by consulting a WINS server
    if the local broadcast fails.'
