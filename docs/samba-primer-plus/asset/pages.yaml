  md: 'Chapter 2 • COMPILING AND INSTALLING SAMBA 19


    # # Installing Precompiled Packages


    Now that you have the Samba binaries downloaded as a package, you need to install
    it. If you are running Red Hat Linux, all you need to do is go to the directory
    to which you downloaded the package, and enter the command:


    ```

    # rpm -iv samba-2.0.5a-1.1386.rpm

    ```


    This command will install all the Samba binaries, documentation, and sample configurations,
    as well as needed directories, as spool and lock directories.


    If you are unsure of what command to use on your system if you downloaded a precompiled
    package as detailed in the previous section, refer to Table 2.3.


    **Table 2.3** How to Install Precompiled Samba Packages


    | UNIX Variant | Install Command |

    |---|---|

    | Red Hat Linux 6.0 | rpm -iv package name |

    | Debian | dpkg --install package name |

    | SUSE Linux 6.1 | rpm -iv package name |

    | Caldera Linux 2.2 | rpm -iv package name |

    | Solaris 7 | pkgadd -d package name |

    | AIX 4.3.2 (or later) | Use the smit interface |

    | SCO (Open Server) & UnixWare | pkgadd -d package name |


    If you all want to install a precompiled Samba package, you can skip ahead to
    Chapter 3, "Basic Samba Configuration." Otherwise, if you are interested in compiling
    Samba yourself, or if that''s the only option you have, keeping reading.


    # # Downloading the Samba Source


    For one reason or another, you may want to compile Samba from source code. This
    is one of the many benefits of open source software projects–if it is not available
    in a precompiled form on your platform, you can compile it yourself! Remember,
    it does not matter which UNIX platform you are running; you just download the
    one source code distribution.


    The first step is to go to http://www.samba.org and select the Samba mirror site
    geographically to you. Then click the download link and there should be another
    link called samba-latest.tar.gz. Click that and wait for it to download.'
