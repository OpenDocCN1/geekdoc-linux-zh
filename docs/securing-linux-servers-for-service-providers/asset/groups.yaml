    互联网安全漏洞利用的快速演变从 CERT/CC 的统计中可以清晰看出，CERT/CC 是报告计算机安全事件和漏洞的权威机构。仅 2001 年的前三个季度，安全事件的数量就达到了
    34,754 起。2000 年的安全事件数量为 21,756 起。1989-1999 年间报告的事件总数为 25,949 起。令人惊讶的是，仅在2001 年的九个月里，CERT
    报告的安全事件就多于 1989 年到1999 年十年间的总和。通过互联网传播的攻击、病毒、蠕虫和木马之灾害令人深感恐惧……³


    服务提供商越来越多地利用 Linux 作为一种安全、可靠、高性能且成本效益的服务器操作系统。对于服务提供商来说，选择 Linux 是非常有意义的——Linux
    操作系统本身就是为了互联网而设计和开发的。Linus Torvalds 将 Linux 的很大成功归功于 Linux 的存在形式，这使得成百甚至数千名专业人士能够在去中心化的开发模式下，协作出一个完整的操作系统⁴。通过互联网开发的操作系统对于通过互联网构建和运营业务的服务提供商来说是理想的匹配。Linux
    操作操作系统的总拥有成本、灵活性和卓越的记录驱动了这种使用，而且服务客户比以往任何时候都需要理解如何确保他们的 Linux 系统安全。


    ## 意图与背景


