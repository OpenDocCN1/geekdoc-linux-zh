    # Buffer overflows in RPC services


    A buffer overflow occurs when an attacker overflows an application buffer with
    data and "infects" the process stack. The process stack holds the address of the
    next instruction to be executed (the return address). To exploit a buffer overflow,
    it is necessary to replace the return address of function with the shell code
    to execute (shell code typically being the location of /bin/sh, or a set-UID root
    code of /bin/sh hidden somewhere on the system). This shell code is inserted into
    the body buffer, followed by its address in memory. This essentially gets a shell
    onto the system. If the application was a set-UID root program, then the attacker
    now has a root shell on the system.


    Buffer overflows in RPC Services, as described on the SANS/FBI list:


    +   "Remote procedure calls (RPCs) allow programs on one computer to execute programs
    on a second computer. They are widely used to access network services as NFS sharing
    and NIS. Multiple vulnerabilities caused by RPC are being actively exploited.
    It is compelling the majority of distributed service attacks launched during 1999
    and early 2000 were executed by systems that had been victimized through the RPC
    vulnerabilities. The broadly successful attack on U.S. military systems during
    the Solar incident also exploited an RPC flaw found on hundreds of Defense systems."


    These are typically RPC services, such as rpc.tdbserver (ToolTalk), rpc.cmsd (Calendar
    Manager), rpc.statd (stat). A good way to protect these types of services from
    being exploited is to block the RPC port (port 111) and the “loopback” ports 32770-32789
    (TCP and UDP).


    Obviously, any buffer overflow in a set-UID root program can be catastrophic.
    Again, for set-UID/GID root programs as described above, and consider using chatter+
    on programs that need to be set-UID/GID root. Additionally applications can be
    compiled against products such as StackGuard (http://www.immunix.org). StackGuard
    detects and defeats buffer overflow attacks by protecting the return address on
    the stack from being altered. StackGuard places a "canary" word next to the return
    address when the function returns, then if the address has been altered an attack
    has been detected, and the program reports by emitting an alert in syslog, and
    then halts. Alternative is to use Libsafe (http://www.avalayabs.com/project/libsafe/index.html),
    which does not need to be compiled with any program, but simply installed as a
    dynamic library and defined as an environment variable (LD_PRELOAD) or specified
    in /etc/ld.so.preload. Libsafe is also under GPL.


    > 10 Each time a function is called, arguments are copied to the function get
    area of memory called the "stack". Virtually all CPU architectures use the notion
    of a stack and have a special register (the stack pointer) and operations for
    pushing and popping things off the stack. There is also an operator that takes
    an address of the stack and copies it into the program counter, the register that
    determines the address of the next instruction to execute. A function calls the
    return address onto the stack.

    11 For a detailed walk-through of buffer overflows, see: http://www.enderunix.org/documents/gid/buffer-overflow.txt'
