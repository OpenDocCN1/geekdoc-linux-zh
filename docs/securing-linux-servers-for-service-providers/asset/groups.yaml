    the .htaccess file is located, including sub-directories. Using .htaccess files
    are very useful in a service provider environment where it is often desirable
    to define per-directory access and privileges to different users and customers.
    Ken Coar has written a useful tutorial on using .htaccess (http://apache-server.com/tutorials/ATusing-htaccess.html).


    It is important to implement .htaccess securely. The directive below, which would
    be included in httpd.conf, illustrates how to ensure the .htaccess file itself
    is never served by Apache – using the Files directive, which ensures that a request
    for any file named .htaccess is denied.


    ```

    <Files .htaccess>

    Order allow,deny

    Deny from all

    </Files>

    ```


    This next directive, which would be included in the .htaccess file, shows how
    to limit a directory to only allowing POST by the group "staff" (other methods,
    such as GET, would still be allowed to unauthenticated users):


    ```

    AuthName "Restrict POSTs"

    AuthType Basic

    AuthUserFile /etc/httpd/users

    ```


    ```

    <Limit POST>

    require group staff

    </Limit>

    ```


    An alternative to using .htaccess for this type of authentication is to include
    a configuration in the httpd.conf, which could be considered easier to manage
    and secure (single point of configuration, and the httpd.conf file is writable
    by a privileged user):


    ```

    <Directory /usr/local/apache/htdocs/customer_a_dir>

    AuthType Basic

    AuthName "Customer A"

    AuthUserFile /usr/local/apache/all_customers/customer_a_dir.htpasswd

    require valid-user

    </Directory>

    ```


    This would cause a request to http://yourdomain.com/customer_a_dir/ to be prompted
    for password authentication. If the user/password did not match against the "customer_a_dir.htpasswd"
    file specified in AuthUserFile, the request would be denied.


    Depending on the requirements and flexibility of your customer, .htaccess and
    htpasswd authentication can provide an early and useful mechanism for a variety
    of HTTP based authentication schemes in a service provider environment.


    - 5. Apache Suexec provides the ability to use CGI and SSI programs under user
    IDs different from the user ID of the calling Apache Web server. This functionality
    can be very useful in multi-user environments found in service provider infrastructures.
    Suexec is based on a set-ID "wrapper" program that is called by the main Apache
    Web server. This wrapper is called when an HTTP request is made for a CGI or SSI
    program that the administrator has configured to execute as a user other than
    that of the main server. When such a request is made, Apache provides the suexec
    wrapper with the program''s name and the user group IDs which the program is to
    execute. For a step-by-step description of the suexec security model, as well
    as detailed installation and configuration instructions, see: http://http.apache.org/docs/suexec.html


    - Keep your server info and status secure. Server-info and server-status are two
    commonly used Apache modules for providing detailed information about Apache''s
    server configuration and process state. It''s important that you secure who is
    able to view this information. The following directives would be used in an httpd.conf
    (if server-info and status are active in your server). The first directive allows
    for server-info from "yourdomain.com" – this could also be a specific IP address.
    The second directive for server-status limits requests to the localhost only.


    ```

    <Location /server-info>

    SetHandler server-info

    Order deny,allow

    Deny from all

    Allow from .yourdomain.com

    </Location>

    ```


    ```

    <Location /server-status>

    SetHandler server-status

    Order deny,allow

    Deny from all

    Allow from localhost

    </Location>

    ```


    - Restrict file system access. Make users cannot "walk" your file system. The
    first directive, which would be included in httpd.conf, blocks access to the root
