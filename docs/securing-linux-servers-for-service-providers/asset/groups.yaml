    ## Application security is critical


    Last, but certainly not, of the General Server security practices is application
    security. Almost any linux server checklist will include a series of security
    measures for networks, operating system, file system, user/group accounts, and
    even physical security issues, such as location and console connectivity. Very
    few, however, spend time and effort on securing applications on Linux. Why? The
    short answer is because it is difficult and analyze behavior better than identifying
    ports with UDP servers versus identifying a few security issues, particularly
    as they relate to SAN/FBI items number four "Vulnerable CGI programs" in Top General
    Vulnerabilities (Web/Application Security Server) and item eight "Buffer overflows
    in RPC services" in Top Linux Vulnerabilities. However, by this document will
    cover all -- or a large portion -- of application security issues on Linux. Analyzing,
    understanding, designing and managing application security is essential for a
    linux server infrastructure, and it is recommended to utilize experts for application
    security and privacy if your customer does not have the available skills. Based
    on my experiences, if you have to draw a pie chart budgeting time and resources
    for security, give at least half of the pie to application security.


    - Global Services offers a wide array of services, including security and privacy
    assessments, planning, architecture, design, implementation, and management. See:
    http://www.ibm.com/services/

    - For a very good tutorial, see "Avoiding security2001 when developing an application"
    at LinuxFocus: http://www.linuxfocus.org/English/January2001article182.shtml.
    Another, more generic Unix programming security FAQ can be found at.


