- md: '

    The rapid evolution of Internet security exploits is clearly seen in the statistics
    at CERT/CC, the canonical organization for reporting computer security incidents
    and vulnerabilities. The number of security incidents for just the first three
    quarters of 2001 was 34,754. The number of security incidents for the year 2000
    was 21,756. The total number on incidents reported from 1989-1999 was 25,949.
    Amazingly, in just nine months in 2001, CERT has reported more security incidents
    than a decade''s worth of incidents between 1989 and 1999. The scourge of attacks,
    viruses, worms, and Trojan horses being used by way of the Internet is woefully
    feared..³


    Increasingly, service providers are utilizing Linux as a secure, reliable, high
    performing, and cost effective server operating system. The choice of Linux makes
    perfect sense to service providers—the Linux operating system itself was designed
    and developed with the Internet in mind. Linus Torvalds credits much of the success
    of Linux to the existence of Linux, which allowed for the creation of a complete
    operating system between hundreds, if not thousands, of professionals in a decentralized
    development model⁴ An operating system developed via the Internet is an ideal
    match for service providers, which build and operate their businesses by means
    of the Internet. The total cost of ownership, flexibility and outstanding track
    record of the Linux operating system is driving this usage, and more than ever,
    service customers need to understand how to ensure their Linux systems are secure.


    ## Intent and Background


    The intent of this document is to clearly explain the steps needed to secure a
    Linux server, as well as specific steps for the most commonly used implementations
    of Linux servers in the service provider environment. It is beyond the scope of
    this document to illustrate every facet of Linux security, the tools or methods
    for protecting against all attacks. The vulnerabilities and recommended security
    solutions are based on professional experiences and are meant to provide examples
    and best practices in many of the common security threats found in Linux servers
    today.


    Many of the examples and practices in this domain are from my own experiences
    designing, developing and operating Web systems. As an architect in the IBM Emerging
    & Competitive Markets organization, I am involved with a variety of service providers
    and emerging businesses. My primary area of expertise is in Linux based infrastructures
    as it applies to these markets. Before joining IBM, I headed the engineering department
    for EToys, a popular e-commerce site for children''s products. Due to the exposure
    of EToys.com site, we were the recipients of daily, and at times hourly, port
    scans, denial of attacks, and intrusion attempts. For better (learning) or worse
    (sleep) my team and I were the folks at 2 a.m. to respond to these threats. Before


    ²http://www.cert.org/stats.html

    ³According to the CSI 2001 Computer Crime and Security Survey, the rise in citing
    their Internet connections as a frequent point of attack from 59% in 2000 to 70%
    in 2001: http://www.gocsi.com/prelu/000321.html.

    http://resources.cisco.com/partner/tree.ta?asset_id=75234


    EToys, I was an engineer at CNET Networks, which is composed of a variety of Web
    sites, such as Cnet.com, News.com, Download.com, Shareware.com, Computers.com,
    and others. Each of these site provided different services (such as content distribution,
    advertising, software archives, Web-based applications, and other managed and
    hosted services), CNET was exposed to a wide array of probes and intrusion attacks.
    Through these experiences, I have "cut teeth" on real world attacks on Linux and
    Unix systems. Hopefully, this document will provide some practical advice that
    can help you or your customers from getting a page or phone call at 2 a.m.


    ## SANS/FBI Top 20


    As a framework, this paper will use a recently published report from the SANS/FBI
    National Infrastructure Protection Center (NIPC) on the top security vulnerabilities.
    This list is used by many businesses as a guide for which vulnerabilities to protect
    against, and the relative importance of each security threat. This list has proven
    value as it is compiled by well respected security organizations, and moreover,
    many of today''s successful attacks on computer systems via the Internet can be
    traced to exploitation of security flaws. This list is composed of three parts:
    General Vulnerabilities, Windows Vulnerabilities, and Unix Vulnerabilities. For
    the purpose of securing Linux servers in a service provider environment, this
    document will utilize issues from the General and Unix Vulnerability list, the
    Top Windows Vulnerabilities will not be included.


    Top General Vulnerabilities:


    - 1. Default installs of operating systems and applications

    - 2. Accounts with no passwords or weak passwords

    - 3. Non-existent or incomplete backups

    - 4. Large number of open ports

    - 5. Not filtering packets for correct incoming and outgoing addresses

    - 6. Non-existent or incomplete logging

    - 7. Vulnerable CGI programs


    Top UNIX Vulnerabilities:


    - 1. Buffer overflows in RPC services

    - 2. Sendmail vulnerabilities

    - 3. BIND weaknesses

    - 4. R commands

    - 5. LPD (remote print protocol daemon)

    - 6. sadmind and mount

    - 7. Default SNMP strings


    I recommend visiting the SANS/FBI Web site, as it provides detailed descriptions
    of each vulnerability and generic security solutions and resources. This document
    will address each of these as it directly relates to securing Linux servers in
    a service provider environment.


    ## Security Philosophy


    Security is, for all intents, a practice of managed risk. The degree and strength
    of your system security is a direct derivative to the strength of your commitment
    to manage it. It is not realistic, nor possible, to unequivocally deem any operating
    system completely secure. The continuum of security slides between ease of use
    and business requirements or methodology that will ensure the security of a system.
    Like all real-world technical designs, it is a practice of setting and meeting
    requirements and the consideration of limitations imposed by those requirements.
    Defending your Linux server is based on understanding these requirements, best
    practices and experience.


    This document will highlight some best practices, experiences, and tools used
    for the management of security risk in Linux server environments. The security
    requirements and limitations your business is willing to accept will not be addressed
    as these obviously vary between businesses. However, this document will attempt
    many best practices and experiences that are commonly found.


    Lastly, and without veering too far into the realm of philosophy, it is useful
    in briefly discussing an important concept or “mind-set”—complexity theory. Computer
    systems are collections of various sub-systems and components—be hardware, software,
    or communication across and between. It is very common to analyze a system in
    a reductionist paradigm in other words, breaking things down into individual components
    in order to understand their nature. Although this is often a critical scientific
    method for diagnosing a security issue, it is important to understand the interactions
    of components in a system. Complexity is about how these components interact—which
    differs from being merely complicated (composed of many intricate parts). In securing
    and designing a Linux server, it is important to understand the interactions of
    a system, as these interactions can shape the patterns that display potential
    security issues.


    ## Securing Linux Servers


    ## General Practices


    There are many security best practices that apply to all types of Linux installations—particularly
    in regards to publicly available systems, such as servers. Below are listed a
    few key best practices to consider as any Linux server security strategy. An important
    disclaimer is needed here—there are no 100% security validations, each of these
    recommendations has the possibility to be exploited. For example, you may receive
    a valid digital signature from an application vendor’s Web site, but there is
    no guarantee that their site has not been cracked and the intruder modified the
    software and signatures to appear valid. Further, if your local system has been
    penetrated, the intruder

