    ## 了解哪些程序是 Set-UID 和 Set-GID


    许多漏洞发生在设置为 Set-UID 或 Set-GID root 的程序中。Set-UID/GID（即 Set UserID 和 Set GroupID）是设置在程序上的位，允许程序作为特权用户执行和运行。对于设置为
    root 的 Set-UID/GID 程序，这可能是一个重大的安全问题，例如缓冲区溢出或软件漏洞可能会导致用户身份和权限的变化——可能将用户提升到导致 root
    被攻破。由于这种潜在的安全漏洞，了解哪些程序设置为 Set-UID/GID root，并确定它们是否为 Linux 服务器分配的任务需要此功能，是非常重要的。


    了解所有具有 set-UID/GID 的程序很重要，并应将其记录在你的安全策略中。然而，你可能想快速扫描 set-UID root 文件和程序。例如，这里有一个简单的命令，用于搜索“root”下的所有文件（“-perm”或权限位，八进制值为
    4000 的位即为 set-UID 位）：


    ```

    find /user root -perm -4000 -ls

    ```


    另一个实用操作是查找所有 UID 或 GID 分别不在 /etc/passwd 或 /etc/group 中的文件。尽管这可能是由于某人提取 tar 归档包而产生的数据，但也可能源于提取
    rootkit 或其他恶意压缩包。Rootkits 将在下方的“你的网络”部分进行讨论。


    ```

    find / -fstype proc '' -nouser -nogroup '' -ls

    ```


    要从程序中移除 set-UID/GID 位，请使用 `chmod ug-s program`。你可能还会考虑让关键系统程序（如 /bin,/sbin,/usr/bin,/lib
    中的程序）变为不可变或不可更改的。通常这些程序不会更改，如果它们需要补丁或删除，`chattr` 命令就是为此目的设计的。使用 `chattr +i program`
    修改的程序无法被删除或重命名，无法为此文件创建链接，也无法从中写入数据。只有 root 用户可以设置或清除此属性。作为一个原则，如果你不明确为什么程序设置了
    set-UID/GID root，你应该立即学习其原因，如果对服务器功能没有必要，则将其禁用。


    > ⁵ MD5 是由 Ronald Rivest 开发用于数字签名的算法（http://theory.cs.umass.edu/~rivest/Rivest-MD5.txt）。MD5
    是一种单向哈希函数；换句话说，该算法的可变长度输入（通常称为“消息”或“预象”）将其转换为 128 位的哈希值（这个固定字符串称为消息摘要）。关于单向哈希函数以及所有密码学内容的优秀资源，请参见
    Bruce Schneier 的《应用密码学》（详情见附录）。


    ## 开发密码策略


    密码仍然是一个主要的安全漏洞，并且经常是导致系统被攻破的直接手段（在 SANS/FBI 顶级通用漏洞列表中排名靠）。为了在 Linux 服务器上维护安全密码，请制定一个包含以下流程的策略：


    - 限制特权账户的使用，特别是超级用户。root 权限应仅限于任务人员。原则是——只给那些需要且知道如何从超级用户可能犯的错误中恢复的人赋予权限。Linux
    上控制权限的有用工具是 `sudo` 工具。sudo（超级用户）允许系统管理员赋予某些用户（或用户组）以 root 或其他身份运行某些（所有）命令的能力，同时记录命令和参数。服务提供商可以通过
    root sudo 启动 Apache 而向客户提供任何 root 权限。更多信息请参见：http://www.courtenas.com/sudo/intro.html

    - 使用 shadow 密码。shadow 密码是 /etc/passwd 的加密版本，位于 /etc/shadow 中。大多数 Linux 发行版默认实现
    shadow 密码，因为这是一种安全措施。然而，你应该检查你维护和安装的每个 Linux 服务器，确保它使用的是 shadow 密码。`pwck` 命令将验证
    /etc/shadow 相对于 /etc/passwd 的完整性。

    - 开发密码创建指南。包括：

    - 永远不要告诉任何人密码或写下你的密码（例如便利贴）

    - 推荐的密码创建提示（长度、标点符号、数字等）。破解者使用多个程序来猜测密码。其中许多程序在多语言字典上运行，尝试猜测单词并进行多种组合，例如：

    - 任何倒过来写的单词

    - 末尾带有标点符号的任何单词

    - 开头带有标点符号的任何单词

    - 第三个字符位置带有标点符号的任何单词

    - 大写的单词

    - 两个单词组合，中间加一个数字


    显而易见的教训是不要使用单词作为密码，而是建议使用喜欢的短语或引言作为助记法，然后添加或更改适当的大小写、标点符号和其他字符处理。例如，“Chance favors
    only the prepared mind”可以改为“Cf0tpPm”。


