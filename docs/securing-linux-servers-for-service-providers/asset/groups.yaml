    # Logging intelligently


    Logging is a regularly over-applied/under-utilized resource. Many applications
    can log

    to various system and log files, but these are often not analyzed or securely

    managed. Linux servers should employ logging only where they will be utilized.

    for example, if you plan on logging all packets from your iptables firewall rules
    (detailed

    below), make sure you know how to use these logs and how to secure and archive
    these

    logs as they grow over time.


    Syslog is a robust logging system that provides a common method for logging

    disparate applications. Syslog is configured in /etc/syslog.conf and follows a
    simple


    - 12 -'
  - '[PAGE 12]


    facility.loglevel/target format. For example, to log all mail messages to /var/log/maillog
    every("*") log levels, specify in /etc/syslog.conf:


    ```

    # Log all the mail messages in one place.

    var/log/maillog

    ```


    Programming application events to syslog is reasonably clear-cut. The following
    is an article describing how to program to syslog from Java:

    http://www.javaaworld.com/javaworld/jw-04-2001/jw-0406-syslog.html


    It is just as important to monitor logs as it is to log in the first place. There
    are several tools and applications available for parsing various types of logs,
    matching for patterns (e.g., unsuccessful login attempts), and acting on these
    patterns (e.g., sending email to admin). A few most common tools for scanning
    log files are mentioned in the Resources section. It is well worth spending the
    time to thoroughly learn how to configure the log scanning/analysis application(s)
    you choose to generate a large number of actions and alerts based on false positives.
    Initial configuration of log monitoring applications can save you in the long
    run.


    Archiving and securing logs are important factors in a Linux server logging plan.
    Logs can grow by orders of magnitude under significant server traffic, or denial
    of service attacks, and will quickly consume physical disk space. Keep logs which
    grow quickly in scheduled `log watchers` in cron. For example, to keep an eye
    on your Apache Access_log, you could periodically run:


    ```

    du -k /usr/local/apache/logs/access_log

    ```


    Which would return the size (in bytes; use “m” to see size in megabytes) of the
    access_log. This number can be compared to a pre-defined limit and alerts when
    the “du” output exceeds the limit.


    Secondly, consider measures to validate log integrity. Log files are typically
    the last intruder will want to modify or destroy, to cover their tracks. If you
    are attempting a potential intrusion, you be able to trust the logs you may need
    to use evidence. One simple measure is to use the “chattr” command to allow the
    logs to be appended to:


    ```

    chattr +a /var/log/maillog

    chattr +a /var/log/messages

    chattr +a /var/log/samba

    ```


    There are other methods for ensuring log integrity, such as using an intrusion
    detection system (IDS), MD5 checksums against the archived log files, or logging
    to a separate server altogether. Logging locally and sending log to a remote server
    provides an additional security layer, as well as redundancy for your log files.
    Additionally, these files can be compared for integrity (possibly generating MD5'
- md: '

    digests on each log file before transport to a remote server), as well as providing
    an easy method for comparing files across servers in one location, presenting
    a global perspective of all log activity. For further security, this "remote server"
    could be a write-only media, such as a CD-R mounted from a protected Linux server.
    Of course, creativity on this continuum increases linearly with your degree of
    paranoia.^7


    ## Use tools where possible


    As security is a complex subject, it is recommended to get a helping wherever
    possible. There are a variety of tools included with each Linux distribution to
    help configure network services, user/group configuration, there are also thousands
    of tools available in the Open Source community which assist as well. One of the
    more well-known tools for assisting in "hardening" a Linux system is Bastille
    Linux.


    Bastille Linux ([http://www.bastille-linux.org/])


    The Bastille Hard’s Hardening Systems to "harden" or "tighten" the Linux operating
    system, and currently supports Red Hat and Mandela distributions. Bastille Linux
    draws from a variety of reputable source on Linux security. The initial development
    integrated author Jay Beal''s securing Solaris and Linux with major points from
    the SAN''S Securing Linux by Step, Kurt Sefried''s Linux Administrator''s Security
    Guide, and many other sources. There is a recent patch to Bastille Linux from
    the IBM Linux Technology Center, which was created by Niki Rahhemi to support
    Suse E72 and Turbolino 7.0 ([http://software.ibm.com/developerworks/opensource/patches/bastille/suse72_tl70-2.patch.gz](http://software.ibm.com/developerworks/opensource/patches/bastille/suse72_tl70-2.patch.gz)).
    Both patches have been submitted to the Bastille Linux team and the Bastille mailing
    list.


    Bastille Linux has been designed to educate the administrator about the security
    issues involved in each of the script''s tasks, securing both the box and the
    administrator. Each step is optional and contains a description of the security
    issues involved. Here are two examples when running InteractiveBastille:


    <step 4>


    Q: Would you like to disable SUID status for the r-tools? [Y]

    The BSD r-tools rely on IP-based authentication, which means that can allow anyone
    with (for instance) root access on 192.168.1.1 have root access on 192.168.1.2.
    Administrators and other users have found this useful, as it lets connect one
    to another without having to retry a password.


    The problem with IP-based authentication, however, is that an intruder can craft
    "spoofed" or faked packets which claim to be from a trusted machine. Since the
    r-tools rely entirely on IP addresses for authentication, a spoofed packet will
    be accepted as real.


    > ^7 For some clever tricks, see Lane Spitzer''s white paper on building honeynets
    at [http://www.rootprompt.org/article.php3?article=210](http://www.rootprompt.org/article.php3?article=210).
