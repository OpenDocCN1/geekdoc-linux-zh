    ## 应用安全至关重要


    最后但绝不重要的通用服务器安全实践之一是应用安全。几乎任何 Linux 服务器清单都会包含一系列针对网络、操作系统、文件系统、用户/组账户，甚至是物理安全问题（如位置和控制台连接性）的安全措施。然而，很少有人花费精力来加固
    Linux 上的应用程序。为什么？简短的回答是，分析行为比识别 UDP 服务器端口相比的识别几个安全问题要困难，特别是当它们涉及“顶级通用漏洞（Web/应用安全服务器）”中的第四项“存在漏洞的
    CGI 程序”以及“顶级 漏洞”中的第八项“RPC 服务中的缓冲区溢出”时。然而，本文档将涵盖 Linux 上所有的——或大部分的应用安全问题。分析、理解、设计和管理应用安全对于
    Linux 服务器基础设施是至关重要的，如果你的客户没有可用技能，建议利用专家处理应用安全和隐私。根据我的经验，如果你必须画一个分配安全时间和资源的饼图，请至少将饼的一半留给应用安全。


    - Global Services 提供广泛的服务，包括安全和隐私评估、规划、架构、设计、实施和管理。见见：http://www.ibm.com/services/

    - 想要一个非常好的教程，请参阅 LinuxFocus 上的《开发应用程序时避免安全2001》（Avoiding security2001 when developing
    an application）：http://www.linuxfocus.org/English/January2001article182.shtml。另一个更通用的
    Unix 编程安全 FAQ 可以在某处找到。


    © IBM. Corp. 2001 保留所有权利。


    ## RPC 服务中的缓冲区溢出


    当攻击者用数据溢缓冲区并“感染”进程时就会发生缓冲区溢出。进程栈持有执行下一条指令的地址。要利用缓冲区，必须将栈上的返回地址替换为 shell 代码。当函数返回时，进程栈获取了插入系统中的
    shell 代码，攻击者现在有了一个 shell。


    RPC 中的缓冲区溢出，如 SANS 列表所述：


    “远程过程调用 (RPCs) 允许某台计算机上的程序执行另一台计算机上的程序。它们被广泛用于访问 NFS 和 NIS 网络服务。RPC 引起的多个漏洞正在被积极利用。在
    Solar 事件期间对系统进行的广泛成功攻击也是由系统执行的。”


    这些通常是 RPC 服务，例如 rpc.tdserver（ToolTalk）、rpc.cmsd（日历管理器）、rpc.statd（stat）。保护这些服务不受利用的良好方法是阻止
    RPC 端口（111端口）以及“环回”端口 32770-32789（TCP 和 UDP）。


    显然，set-UID root 程序中的任何缓冲区溢出都是毁灭性的。再次，对于上述 set-UID root 程序，考虑对需要 set-UID root 的程序使用
    chatter+。此外，可以针对 StackGuard (http://www.immunix.org) 等产品进行编译。StackGuard 通过保护栈上的返回地址来检测并击败缓冲区溢出攻击。StackGuard
    在函数返回时在返回地址旁边放置“哨兵”字，如果地址被更改，则检测到攻击，程序通过在 syslog 中发出警告进行报告并停止。替代方案是使用 Libsafe
    (http://www.avalayabs.com/project/libsafe/index.html)，它不需要与任何程序编译，只需作为动态库安装并定义环境变量
    (LD_PRELOAD) 或在 /etc/ld.preload 中指定。Libsafe 也遵循 GPL 协议。


    > 10 每当调用函数时，参数会被复制到称为“栈”的内存区域。几乎所有的 CPU 架构都使用栈的概念，并有一个特殊的寄存器（栈指针）以及从栈中弹出内容的操作。还有一个运算符获取栈的地址并将其复制到程序计数器（确定执行下一条指令地址的寄存器）。函数将返回地址调用到栈上。

    11 关于缓冲区溢出的详细演示，请参阅：http://www.enderunix.org/documents/gid/buffer-overflow.txt


