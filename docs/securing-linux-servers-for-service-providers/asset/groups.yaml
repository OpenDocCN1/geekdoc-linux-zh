    valid users in an effort to gain internal access. Recently, this latter example
    was exploited by a hacker using an open proxy at MCI WorldCom³⁵. Using an open
    proxy scanner called “Proxy Hunter”, the hacker found an open proxy, and proceeded
    to browse WorldCom''s Intranet, appearing as a valid employee, allegedly perusing
    a variety of sensitive employee data. A similar example occurred at Excite@Home
    which allowed access through a misconfigured proxy into the internal network,
    allegedly exposing Excite@Home''s customer list of 2.95 million mobile subscribers.³⁶


    Configuring your server to properly allow or disallow proxy is critical to a secure
    provider infrastructure. A simple way is to test if your server HTTP is proxied
    to your server, and an HTTP request to a different host:


    ```

    [root@imorder~$] telnet your.server.com 80

    Trying 192.12.17.99...

    Connected to your.server.com (192.12.17.99).

    Escape character is ""

    GET http://othersite.com/HTTP/1.0

    [ hit enter/return twice ]

    ```


    If you get HTML data from http://othersite.com, your server is probably misconfigured,
    as your server is returning data from a foreign host - likely not what you intended
    if you are not running http://your.server.com as a proxy server. If you get HTML
    data from your server, or an error, your server is likely configured to respond
    to proxy requests correctly. If you need to use a proxy, make sure the following
    is correctly defined and in your http.conf (if you are not using this server as
    a proxy, comment out or remove these directives altogether):


    ```

    <Directory proxy/>

    Order deny,allow

    Deny from all

    Allow from your.server.com

    </Directory>

    ```


    Misconfigurations or default installations in Web servers can lead to potential
    security vulnerabilities via open proxies. Web proxy protection is an essential
    aspect of any service provider security policy.


    # Conclusion


    Providing effective security in a service provider infrastructure is a complex
    task, but a task made more flexible, cost effective, and powerful with Linux.
    In today''s highly networked world, service providers are constantly faced with
    balancing between customer access and functionality and the protection of users
    and data. Each day seems to bring new Internet-based threats, ranging from service
    disruption to total system


    > ³⁵ http://www.linuxsecurity.com/articles/hackcracks article-4124.html

    ³⁶ http://www.securityfocus.com/news/209'
