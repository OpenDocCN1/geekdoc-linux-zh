    \ 和 Pentagon。LaB 遵循 GPL 协议，可以作为服务提供商安全基础设施的有效补充，为蠕虫防护提供主动工具。\n\n# Linux 防火墙\n\n\
    Linux 2.4 内核的显著优势之一是通过 iptables（也称为 NetFilter）增加了状态包头部。在 iptables 出现之前，2.2 版本的内核使用\
    \ ipchains 应用程序提供防火墙服务。尽管 ipchains 非常有用，但状态包过滤的使得 Linux 2.4 具有企业级防火墙的功能。iptables\
    \ 和 ipchains 之间的重大差异允许状态包检查——换句话说，基于 iptables 的防火墙可以维护尝试通过系统的的数据包状态。这允许 iptables\
    \ 对网络消息序列模式做出决策，并在数据包触发 iptables 包过滤器时对序列中的点进行操作。\n\n# 什么是包过滤器？\n\n包过滤器是在数据包通过系统时查看包头（包含源和目的\
    \ IP 地址、端口、标志位等数据）并决定如何处理整个数据包的软件。包过滤器可能会拒绝数据包（像从未接收过一样丢弃）、接受数据包（允许通过）或拒绝数据包（类似于拒绝，但通知源包已被拒绝）。在\
    \ Linux 中，包过滤作为内核模块构建在内核中。\n\n以下是数据包遍历 iptables 过滤器“生命周期”的高级图：\n\n- 入站包\n\n![](img/bfe6ea110ea710ed0e76c993ed104f90_23_0.png)\n\
    \n第一步是内核（通过 iptables）根据入站包的目的做出“路由决策”。如果包是给此服务器的，内核将包传递给 INPUT 链。如果包通过了 INPUT\
    \ 链，将由任何监听这些数据的本地进程（应用程序、服务器等）处理。\n\n如果内核启用了 IP 转发且数据包的目的地址指向不同的网络接口，则数据包将传递给\
    \ FORWARD 链。如果通过了 FORWARD 链（通过该链中的 ACCEPT 规则），则将其发送出去。如果内核\n\n"
