    # Security Philosophy


    Security is, for all intents, a practice of managed risk. The degree and strength
    of your system security is a direct derivative to the strength of your commitment
    to manage it. It is not realistic, nor possible, to unequivocally deem any operating
    system completely secure. The continuum of security slides between ease of use
    and business requirements or methodology that will ensure the security of a system.
    Like all real-world technical designs, it is a practice of setting and meeting
    requirements and the consideration of limitations imposed by those requirements.
    Defending your Linux server is based on understanding these security requirements,
    best practices and experience.


    This document will highlight some best practices, experiences, and tools used
    for the management of security risk in Linux server environments. The security
    requirements and limitations your business is willing to accept from those requirements
    will not be addressed as these obviously vary significantly between businesses.
    However, this document will attempt many best practices and experiences that are
    commonly found and used in the service provider environment.


    Lastly, and without veering too far into the realm of philosophy, it is useful
    in briefly discussing an important concept or “mind-set” that is considering in
    a general sense – complexity theory. Computer systems are collections of various
    sub-systems and components – be hardware, software, or communication across and
    between. It is very common to analyze a system in a reductionist paradigm in other
    words, breaking things down into individual components in order to understand
    their nature. Although this is often a critical scientific method for diagnosing
    a security issue, it is important to understand the interactions of components
    in a system. Complexity is about we these components interact – which differs
    from being merely complicated (composed of many intricate parts). In securing
    and designing a Linux server, it is important to understand the interactions of
    a system, as these interactions can shape the patterns that display potential
    security issues (among other things). Successful security experts tend to subscribe
    to complexity theory. In other words, see the forest from the trees.


    # Securing Linux Servers


    # General Practices


    There are many security best practices that apply to all types of Linux installations
    – particularly in regards to publicly available systems, such as servers. Below
    are listed a few key best practices to consider as any of Linux server security
    strategy. An important disclaimer is needed here – there are no 100% security
    validations, each of these recommendations has the possibility to be exploited.
    For example, you may receive a valid digital signature from an application vendor’s
    Web site, but there is no guarantee that their site has not been cracked and the
    intruder modified the software and signatures to appear valid. Further, if your
    local system has been penetrated, the intruder'
