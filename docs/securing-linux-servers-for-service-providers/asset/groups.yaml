    \n# 蜜罐\n\n“蜜罐”（honeypot）是一个连接到外部 DMZ 的服务器，充当诱饵，诱导潜在的攻击者进入，以便研究他们的活动并监控他们如何破解系统。蜜罐的设计目标是模仿入侵者想要破解的系统，但限制了入侵者访问整个网络的能力——换句话说，它是由你控制的特洛伊木马。如果蜜罐成功，入侵者将完全不知道自己正处于一个虚假系统并正被监控。然而，蜜罐安装在可以严格控制的防火墙内部。通过限制从互联网进入服务器的内容，防火墙允许所有来自互联网的流量以诱导他们进入一个他们无法造成伤害的环境，从而使\
