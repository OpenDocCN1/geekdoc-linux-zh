    POP、IMAP、NNTP、LDAP 等），而无需更改守护进程的代码。


    ## OpenSSH / SSH


    OpenSSH 是安全登录/rsh/rcp 的替代品，源自 OpenBSD 版本的 ssh，而该版本又源自 ssh 许可证更改为非免费之前的 ssh 代码。SSH（安全外壳）是一个用于登录远程机器并在远程机器上执行命令的程序。它通过在不安全的网络上为两个不信任的主机之间提供安全的加密通信。X11
    连接和任意 TCP/IP 端口也可以通过安全通道进行转发。它旨在作为 rlogin、rsh 和 rcp 的替代品，并可用于通过通信通道提供 rdist 和
    rys。


    ## GnuPG


    GnuPG 是 PGP 的完整且免费的替代品。由于它不使用专利 IDEA 算法，因此可以在没有任何限制的情况下使用。GnuPG 是一个符合 RFC2440
    (OpenPGP) 标准的应用程序。GnuPG 是一个创建和验证软件包的实用工具。例如，红 Hat 使用 GnuPG 生成的数字签名对其 RPM 包进行签名。


    ## 日志与流量监控


    ### MRTG


    多路由器流量图（MRTG）是一种用于监控网络链路流量负载的工具。MRTG 生成包含 PNG 图像的 HTML 页面，提供这些流量的实时表示。MRTG 可以通过
    RRDtool 图表以及时间序列数据的存储/检索进行扩展。这两个工具对于监控你的网络流量容量非常有用——这通常是攻击的指标。


    ## IBM


    Swatch (http://www.stanford.edu/~atkins/swatch/) Swatch（简单监控守护进程）是一个用于 UNIX 系统日志的程序，最初编写用于主动监控通过
    syslog syslog 实用写入日志文件的消息。Swatch 的设计是为了防止系统管理员被海量数据淹没。它监控日志文件并过滤掉不需要的数据，并根据日志中的模式采取一项或多个用户操作。Swatch
    可以监控正在追加到日志文件中的信息，并在严重系统问题发生时立即通知管理员。


    Timbersee (http://www.fastcoder.net/thumper/sysadmin/timbersee/) Timbersee 是一个与
    Swatch 程序非常的程序。它被用于监控日志文件中的重要消息，但不同之处在于它可以同时监控多个日志文件，且不会派生额外的进程。与其他工具的另一个区别是，配置文件是一个
    XML 文件，并在程序运行时对其进行验证。


    Logsurf (http://www.cert.de/en/logsurf/)

    “logsurfer”程序设计用于实时监控你系统上的文本日志。收集到的海量日志信息（如所有由 syslog-daemon 或 ftp、Web 服务器等处理的信息）使得通过手动检查日志以发现任何异常活动变得非常困难。拥有一个代表你执行监控的程序是很有用的——特别是在大型服务器环境中。如果你不想使用在特定时间（每晚、每周等）检查日志的脚本，那么你可能对
    swatch 或 logsurfer 这样的程序感兴趣。


    TCP Wrappers (http://ftp.porcupine.org/pub/security/index.html)

    Wiestene 的网络记录器，也称为 TCPD 或 LOG_TCP。这些程序记录 TCP、UDP 和 ICMP 流量，并检测域名伪造、登录等请求。安全选项可以将告报发送到
    syslog、独立的告报文件，甚至是 Windows 计算机。


    IPLog (http://ojnk.sourceforge.net/)

    iplog 是一个用于 TCP/IP 流量的记录工具，能够记录 TCP、UDP 和 ICMP。


    IPTraf (http://cebu.com/riker/iptraf/)

    iptraf 是一个基于 ncurses 的 IP 器，显示网络统计信息，包括 TCP、校验和错误。


    Ntop (http://www.ntop.org)

    top 是一个 Unix/Linux 工具，显示网络使用情况，其功能类似于流行的“top” 命令。


    Snort (http://www.snort.org)

    灵活的包嗅探器/记录器，Snort 是一个基于 libcap 的包嗅探器，可以作为轻量级入侵检测系统使用。


    ## IBM


    Snort 具有基于规则的记录功能，并可以执行内容搜索以检测缓冲区溢出、隐蔽扫描、SMB 攻击等多种攻击。Snort 具有实时告警能力，可以通过 Samba
    发送告报。


    ## 嗅探器


    Sniffit (http://reptile.ac.be/-coder/sniffit/sniffit.html) 包嗅探器和监控工具，sniffit 是用于
    TCP/UDP/ICMP 包的嗅探器。它能够提供这些包的详细技术信息（SEC、ACK、TTL、Window 等）。


    Tcpdump (tcp.org) 强大的网络监控和数据采集工具。Tcpdump 程序允许导出网络接口上的流量。可以使用它跟踪网络问题、检测 ping 攻击或监控网络活动。


    Dsniff (http://naughty.monkey.org/-dugsong/dsniff/) dsniff 是网络审计和渗透测试工具集。包含了破解网络交换机“保护”的高级技术。dsniff、
    sniffers、filemap、msnarf、msnarl 和 webspy 被动监控感兴趣的数据（密码、电子邮件、文件等），arspoof、dnspoof
    和 macof 可以拦截攻击者通常无法获取的网络流量（例如二层重定向 ssh）。sshmitt 和 webmitt 通过利用即时 PKI 的弱点对重定向的
    SSH 和 HTTPS 会话实施中间人攻击。


    Ethereal (http://www.ethereal.com/) Ethereal 是适用于 Unix/Linux 和 Windows 的免费网络分析仪。它允许你检查实时网络或磁盘上的捕捉文件。你可以交互式浏览捕捉数据，查看每个包的摘要和细节。Ethereal
    具有许多强大功能，包括丰富的显示过滤语言和查看 TCP 会话重建流的能力。


    Ngrep (http://www.packetfactory.net/Projects/ngrep/) 用于网络流量的 grep 类工具。ngrep 力求提供大多数
    grep 的常用功能，并将其应用于网络层。ngrep 是一个 pcap 工具，允许你指定扩展正则表达式来匹配数据包负载。它目前识别以太网、PPP、SLIP
    和空接口上的 TCP、UDP 和 ICMP，并以与常见的包嗅探工具（如 tcpdump 和 snoop）相同的方式理解 bpf 过滤器逻辑。


    '
