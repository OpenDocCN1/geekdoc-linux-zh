    ## Rootkits

    The primary intent of a rootkit is to maintain access to a compromised system.
    An attacker achieves this secrecy by relying on. Most rootkits are trojaned. An
    attacker''s first goal is to maintain access to a compromised system. One of the
    most commonly used tools are find, telnet, netstat, is killall, and ps. Additionally
    rootkits contain other analysis tools, such as sniffers, spoofing, and keylogger
    programs to capture passwords.


    Malicious Loaded Kernel Modules (LKMs)

    The Linux kernel supports a concept called Loadable Kernel Modules. Normally,
    if one wanted to add or modify code in a Linux kernel, they would modify the relevant
    source files and recompile. Many administrators cannot trust the output of "netstat"
    or "ls".


    The Linux Rootkit (Lrk) is the most common and famous rootkit for exploiting Linux.
    Lrk, and other rootkits and Trojan programs, can be found at: http://ftp.ftp.technotronic.com/unix/trojans/
    Researching rootkits is an excellent way to know your, and what sort of files
    and programs you want to periodically scan or detect. For example, Lrk uses default
    files specified at compile time under the /dev directory (/dev/pty,/dev/ptyq,/dev/ptydev/ptyp)
    to identify itself network connections, files, and processes which it will ignore
    or drop. A decent intrusion detection system (see Appendix) will include services
    that constantly monitor binaries and network interfaces on a system, and alerts
    when it believes they have been compromised. To learn more about rootkits, “Understanding
    the Attackers Toolkit” at http://www.sans.org/infosec/FAQ/toolkit.htm.


    > “trojaned” programs are malvolent replacements for normally benign applications.
    A term derived, from the Trojan horse which the Greek’s “gifted” to their enemies,
    the Trojans in Homer’s Iliad.

