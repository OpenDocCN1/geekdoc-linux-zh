    ```


    对于此类认证，使用 .htaccess 的替代方案是在 httpd.conf 中包含配置，这被认为更容易管理和更安全（单点配置，且 httpd.conf 文件由特权用户可写）：


    ```

    <Directory /usr/local/apache/htdocs/customer_a_dir>

    AuthType Basic

    AuthName "Customer A"

    AuthUserFile /usr/local/apache/all_customers/customer_a_dir.htpasswd

    require valid-user

    </Directory>

    ```


    这会导致对 http://yourdomain.com/customer_a_dir/ 的请求被提示进行密码认证。如果用户/密码与 `AuthUserFile`
    中指定的 "customer_a_dir.htpasswd" 文件不匹配，请求将被拒绝。


    根据您的客户的需求和灵活性，.htaccess 和 htpasswd 认证可以为服务提供商环境中各种基于 HTTP 的认证方案提供一种早期且有效的机制。


    - 5. Apache Suexec 提供了以不同于调用 Apache Web 服务器的用户 ID 的用户 ID 运行 CGI 和 SSI 程序的能力。此功能在服务提供商基础设施中的多用户环境中非常有用。Suexec
    基于一组 set-ID“封装”程序，该程序由主 Apache Web 服务器调用。当对管理员配置为以主服务器以外的用户执行的 CGI 或 SSI 程序发出
    HTTP 请求时，就会调用该封装程序。当发出此类请求时，Apache 会向 suexec 封装程序提供程序名称以及该程序要执行的用户组 ID。欲了解 suexec
    安全模型的分步说明，以及详细的安装和配置说明，请参阅：http://http.apache.org/docs/suexec.html


    - 保持您的服务器信息和状态安全。server-info 和 server-status 是两个常用的 Apache 模块，用于提供有关 Apache 服务器配置和进程状态的详细信息。保护谁能够查看这些信息至关重要。以下指令将用在
    httpd.conf 中（如果您的服务器上 server-info 和 status 是激活状态）。第一个指令允许来自 "yourdomain.com" 的
    server-info——这也可以是一个特定的 IP 地址。第二个用于 server-status 的指令将请求限制为仅 localhost。


    ```

    <Location /server-info>

    SetHandler server-info

    Order deny,allow

    Deny from all

    Allow from .yourdomain.com

    </Location>

    ```


    ```

    <Location /server-status>

    SetHandler server-status

    Order deny,allow

    Deny from all

    Allow from localhost

    </Location>

    ```


    - 限制文件系统访问。使使用户无法“遍历”您的文件系统。第一个包含在 httpd.conf 中的指令阻止对根目录的访问。


    ```

    <Directory />

    Order Deny,Allow

    Deny from all

    </Directory>

    ```


    下一个指令处理上述相同类型的场景，但通过 `UserDir` 指令实现。例如，“UserDir /" 会将对 http://yourdomain.com/~root
    的请求映射到 "/"，即根目录。为了防止这种情况，请在 httpd.conf 中指定以下内容：


    UserDir disabled root


    # IBM 诊断


    # Web 服务器诊断


    尽管我们都拥有复杂的工具，可以在有人尝试对我们的 Web 服务器进行恶意攻击时提醒我们我们的无线设备状况，但当系统资源变得可疑时，您或您的客户可能需要进行实时分析。这里有几个命令行分析工具，用于在您的
    Web 或应用程序日志中查找可疑活动。


    Code Red 病毒没有感染 Linux 服务器，但随着该词汇在互联网上的传播，它向所有服务器发送了大量请求。当然，当 Web 服务器遭受导出 Windows
    文件请求（如 "default.ida"）的轰炸时，这涉及到性能和系统资源（磁盘）问题。


    典型的 Code Red 请求看起来如下：


    ```

    192.168.2.12 - [19/Jul/2001:16:55:47 +0000] "GET /default.ida?NNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN090%u683%

    ```


    要快速检查此类 "default.ida" 并统计行数，可以执行：


    ```

    192.168.2.12 - [19/Jul/2001:16:55:47 +0000] "GET /default.ida?NNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN090%u683%

    ```


    正如最后几行所示，来自 IP 地址 204.476.138.11 的 "default.ida" 请求有 1223 次。这清楚地说明了针对此 Web 服务器的脚本攻击（或者至少是配置不当的
    Web 服务器）。从这里，我们可以密切监控请求此路径的 IP 地址，并联系他们或针对他们的请求采取防御措施（从通过 "SetEnv”示例在边界路由器或防火墙处拦截他们的请求）。


    # Web 服务


    Web 服务可能会增加服务提供商的范围和有效性，并可能创建新的服务市场渠道。随着 Web 服务的快速采用，将这些技术纳入您的 Linux Web 和应用程序安全计划中至关重要。事实上，Web
    服务的核心关键技术之一 SOAP 被设计为利用 HTTP 作为其传输，以克服其他 RPC 协议（如 DCOM 和 CORBA）的一些之前的问题（例如使用隧道转发）。


    然而，SOAP 在当前实现中没有实现任何安全功能，这将其留给了后来的用户。最初反应是将 SOAP 消息封装在 SSL 或 IPSec 实现中，以提供安全通道。这是传输层（SSL）和网络层（IPSec）安全，而不是应用层安全


