  - "[PAGE 25]\n\n```\n/bin/iptables -A INPUT -p tcp -syn 192.168.1.110/32 -destination-port\
    \ ssh -j ACCEPT\n```\n\n...\\or\n/bin/iptables -A INPUT -p tcp -syn 192.168.1.110/32\
    \ -destination-port - -j ACCEPT\n\nA typical firewall configuration is to restrict\
    \ server access to HTTP (for Web and Application services) and SSH (for secure\
    \ administrative access). Here is an example of firewall for setting this up (192.168.1.101\
    \ is the IP address of the server):\n\n```\n/bin/iptables -P INPUT DROP\n/bin/iptables\
    \ -A INPUT -s 0/0 -d 192.168.1.101 -p tcp -destination-port - -j ACCEPT\n/bin/iptables\
    \ -A INPUT -s 0/0 -d 192.168.1.101 -p tcp -destination-port ssh -j ACCEPT\n/bin/iptables\
    \ -P INPUT DROP\n/bin/iptables -P INPUT LOG\n```\n\nThis flexibility of Linux\
    \ allows us to firewall each server so that only necessary ports/services are\
    \ be accessed to the network. The same type of configuration could be applied\
    \ to a Java application service, such as WebSphere, running on a separate server,\
    \ or that the firewall permits only port that are accessed to WebSphere (such\
    \ as 9080, 9443, etc.). By restricting ports and services to the services that\
    \ needs to be accessed on a specific server, the service provider can control\
    \ the potential for numbers one and four on General Vulnerabilities SAN/FS (\"\
    Default OS/Application Installation\" and \"Large Number of Open Ports\", respectively).\
    \ Additionally, a similar approach could be taken to mitigate the risks to the\
    \ number five Vulnerability (LPDP (remote protocol daemon)), by firewalling any\
    \ Linux print servers to allow port 515 (the TCP port listed for print requests)\
    \ only to trusted machines. As print servers are not often involved in the service\
    \ provider server environment, it is recommended to disable iptables any Linux\
    \ server not designed for handling remote print services as described in the General\
    \ Practices above.\n\nAnother common usage in the service provider space is blocking\
    \ individual IP addresses. For numerous reasons, when you publicly available servers,\
    \ your system will be visited, attacked at the worst, by non-customer related\
    \ traffic. With iptables, you can create a rule for each individual IP address,\
    \ but this can become an administrative headache as the number of IP addresses\
    \ you wish to block increases. One simple way to create a \"firewall.banned\"\
    \ file with the list of the IPs you want to block in all outindividual access.\
    \ This file can be modified without having to add/delete/edit your iptables rules\
    \ or rc.firewall scripts. The following loop would be added to your rc.firewall\
    \ script, which would read the firewall.banned list and create rules automatically\
    \ for each IP for the specified $EXTERNAL_INTERFACE variable:\n\n```\nif [ -f\
    \ /etc/firewall/firewall.banned ]; then\n  while read BANNED; do\n    iptables\
    \ -A INPUT -i $EXTERNAL_INTERFACE -s $BANNED -j DROP\n    iptables -A INPUT -i\
    \ $EXTERNAL_INTERFACE -d $BANNED -j DROP\n    iptables -A OUTPUT -o $EXTERNAL_INTERFACE\
    \ -s $BANNED -j DROP\n    iptables -A OUTPUT -o $EXTERNAL_INTERFACE -d $BANNED\
    \ -j DROP\n  done < < /etc/firewall/firewall.banned\n```"
