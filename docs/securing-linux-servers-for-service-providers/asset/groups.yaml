    # Web Services


    It is very likely that Web services will increase the range and effectiveness
    of service providers, and possibly create new service market outlets. By the rapid
    adoption of Web services, it is critical to fasten these technologies into your
    Linux Web and Application security plan. In fact, one of the key technologies
    at the core of Web services, SOAP, is designed to utilize HTTP as its transport
    in an order to overcome some of the previous issues with other RPC protocols such
    as DCOM and CORBA (such using tunneling forwards).


    However, SOAP does not implement any security features in its current implementation,
    which leaves this for later users. The initial reaction is to send SOAP messages
    inside SSL or IPSec implementation, providing a secure channel. This transport
    (SSL) and network (IPSec) security, but not application level security


