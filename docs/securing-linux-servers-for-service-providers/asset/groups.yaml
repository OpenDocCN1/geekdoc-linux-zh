    # Apache Security Configuration Tips


    As we saw above with the Group and directives


    MaxAliveRequests limits the amount of requests can be sent over a single connection.
    This is another method for controlling potential DoS attacks. Setting this parameter
    higher increases performance, but also increases the potential for someone to
    attempt a DoS. The default is 100, which I have found to be a nice median setting,
    increase/decrease per your site requirements.


    KeepAliveTimeout limits the number of seconds that Apache will wait for the next
    request from the same client on the same connection. The default is 15, and can
