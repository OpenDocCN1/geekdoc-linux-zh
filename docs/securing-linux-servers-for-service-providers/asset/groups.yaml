    # Commercial Secure OS Products


    Argus Systems PitBull (http://www.argus-systems.com/product/overview/pitbull/)
    PitBull Foundation is Argus’ core Intrusion Prevention software module. Based
    upon trusted operating system, it moves the fundamental security layer down to
    the operating system, where decisions are made about access to file systems, devices
    and processes. PitBull features include: removal of superuser privileges through
    least privilege mechanism, breaking down supervisor into many privileges; Mandatory
    Access Control; Isolated Compartments; Enhanced Identification and Auditing. PitBull
    is ITSEC certified. For details on the PitBull foundation, see http://www.argus-systems.com/product/white_paper/pitbull/oss/3.shtml.


    HP Secure OS for Linux (http://www.hp.com/security/linux/) HP Secure OS for Linux
    offers intrusion prevention, real-time protection against attacks, and damage
    containment. The Following White Paper discusses the Secure OS for Linux technical
    details, including the security content model, system configuration lockdown,
    secure event auditing, file system integrity, and secure applications: http://www.hp.com/products/linux/papers/techbrief/hp-tlx-brief.pdf.


    # Alternative Linux-based operating systems, and pre-configured Linux distributions


    Owl (http://www.openwall.com/Owl/) “Owl” (or Open GNU/*/Linux) is a security-enhanced
    operating system with Linux and GNU software is its core, compatible with other
    distributions of GNU/*Linux. It is intended as a proactive source code “auditing”
    security methodology, see http://www.openwall.com/Owl/CONCEPTTS.shtml for details


    Immunix (http://www.immunux.org/) Immunix System 7 is an Immunix-enabled RedHat
    Linux 7 distribution and suite of application-level security tools. It has been
    with the latest Immunix StackGuard enhancements to the gcc compiler and Immunix
    FormatGuard enhancements to the glibc libraries. Also included are the Immunix
    SubDomain kernel module and OpenWall kernel patch for audit. Immunix System 7
    is a commercial product.


    EnGuard Linux (http://www.engardlinux.org) EnGuard Secure Linux is a commercial
    product that offers a secure distribution of Linux that implements advanced security
    techniques. It includes a variety of features targeted service providers, such:


    +   - Robust host and network Intrusion Detection using Web-based Tripwire host

    - Detailed network statistics and system detail reporting

    - Web-based tape backup facility'
