    \ IDS）的替代方案。此外，由于其设计用于诱导进入服务器，蜜罐对于所有业务和技能组合来说并不实用。在您的生产基础设施中设计和实现蜜罐应该仔细考虑，并由安全专家进行部署和管理。\n\
    \nHoneynet 项目 (http://project.honeynet.org/project.html) 是一个致力于安全研究的安全专家非营利研究小组。他们的目标是学习黑客社区的工具、技术和动机，并分享这些学训。Honeynet\
    \ 的所有工作都是开源并与安全社区共享。他们研究的主要工具是蜜罐 (http://project.honeynet.org/papers/honeypot/)。关于构建虚拟蜜罐的另一篇文章位于\
    \ http://www.securityfocus.com/cgi-bin/infocus.pl?id=1506。我强烈推荐 Honeypot 项目的内容，因为它提供了来自领域顶级安全专家的实战经验。\n\
    \nLaB (http://www.threenorm.com/LaB) 是一个创建蜜罐或“焦油池”（tarpit）的程序。LaB 获取网络上未使用的 IP\
