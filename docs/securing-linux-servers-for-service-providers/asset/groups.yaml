    由于应用程序的最终结果仍然是 SOAP 消息，由于传输和层服务在此阶段已经完成，这导致应用程序无法控制底层层级的安全策略或操作能力。在 SOAP over
    SSL 或 IPSec 安全模型中，端到端和持久化方面也存在缺点。为了解决其中的一些问题，有一项使用数字签名的 SOAP 扩展，目前正在 W3C 考虑范围中（http://www.w3.org/TR/SOAP-dig/）。³³


    同时，如果您的客户需要在其 Linux 服务器环境中实现 SOAP，请考虑以下某些问题：


    - SOAP 并不局限于 HTTP 80 端口。请为专门用于该目的的服务进行隔离——这有利于于设置防火墙。使用 Apache 配置指令 "Listen"、Port"
    和/或 "VirtualHost" 为 SOAP 服务器配置一个不同的端口。如果可能，请也为 Web 服务配置一个不同的域名和唯一的端口号。

    - 使用 SSL 加密该端口的 Web 服务数据。对于 SOAP 客户端来说，这只需要指定 "https" 而非 "http" 那么简单。当然，您的服务器需要构建
    SSL 支持。

    - 考虑使用 Apache Tomcat facet 来处理 SOAP 请求。示例请参阅 (http://cookbook.soaplite.com/) 上的
    SOAP:Lite 食谱。

    - 注意，SOAP 是 Web 服务的潜在优势之一⁴，因此您的 Web 服务策略和安全策略应该能够适应未来的多种传输协议。

    - 于 Web 服务是新兴技术，关注 Web 服务的发展是值得的。例如，Web Services Toolkit (http://www.alphalorks.ibm/tech/webservicestoolkit)
    中有一个 SOAP 加密的原型实现。您可能还想关注 W3C XML 加密工作组（http://www.w3.org/Encryption/2001/）的进展。


    ## Web 代理


    通常，Web 服务器或代理服务器位于本地网络 DMZ 与外部世界之间的专用服务器，将内部用户或自定义的 Web 请求传输并“代理”到互联网，通常会缓存 Web
    页面结果以加速对相同 URL 的后续请求。然而，代理服务器往往更容易配置错误，这可能允许任何互联网用户通过配置错误的服务器将他们的 HTTP 请求代理到其他目标。此外，许多
    Web 服务在作为代理运行，而其管理员完全没有引入过代理服务器（由于故障或错误配置）。这些被安全社区视为“开放代理”，并经常被列在各种网站上。恶意用户倾向于使用代理服务器来匿名自己的浏览，或模拟合法用户以试图获得内部访问权限。


    > ³³ SOAP-DIG - http://www.ibm.com/developers/webservices/library/ws-soapsec/

    ⁴⁴ WSIF 是一个独立于 SOAP 的 Web 服务框架 -- http://www-106.ibm.com/developers/webservices/library/ws-wsif.html


    © Copyright IBM. Corp. 2001. 版权所有。


    最近，后一个例子被黑客利用 MCI WorldCom 的一个开放代理进行了³⁵。通过使用名为“Proxy Hunter”的代理扫描器，黑客发现了一个开放代理并开始浏览
    WorldCom 的内网，表现像一个有效的员工，据称正在查阅各种敏感的员工数据。类似的例子也发生过 Excite@Home，该事件允许通过配置错误的代理访问内部网络，据称暴露了
    Excite@Home 拥有 295 万移动订阅者的客户名单.³⁶


    配置您的服务器以正确允许或禁止代理对于构建安全的提供商基础设施至关重要。一种简单的方法是测试您的服务器 HTTP 是否代理到了您的服务器，以及一个指向不同主机的
    HTTP 请求：


    ```

    [root@imorder~$] telnet your.server.com 80

    Trying 192.12.17.99...

    Connected to your.server.com (192.12.17.99).

    Escape character is ""

    GET http://othersite.com/HTTP/1.0

    [ hit enter/return twice ]

    ```


    如果您从 http://othersite.com 获取了 HTML 数据，那么您的服务器可能配置错误，因为您的服务器正在返回来自外国主机的数据——如果您没有将
    http://your.server.com 作为代理服务器运行，这可能不是您的意图。如果您从您的服务器获取了 HTML 数据或错误，则您的服务器可能已配置为正确响应代理请求。如果您需要使用代理，请确保
    http.conf 中正确定义了以下（如果您没有将此服务器作为代理，请完全注释或删除这些指令）：


    ```

    <Directory proxy/>

    Order deny,allow

    Deny from all

    Allow from your.server.com

    </Directory>

    ```


    Web 服务器中的配置错误或默认安装可能会通过开放代理导致潜在的安全漏洞。Web 代理保护是任何服务提供商安全策略的基本方面。


    ## 结论


    在服务提供商基础设施中提供有效的安全是一项复杂的任务，但通过 Linux 使任务变得更加灵活、具有成本效益且强大。在当今高度网络化的世界，服务提供商不断面临客户访问、功能与保护用户及数据之间的平衡挑战。每天似乎都会带来新的互联网威胁，范围从服务中断到整个系统崩溃。


    ## IBM


    要保护您的业务免受这种严酷环境的影响，需要设计良好的良好的安全框架。


    正如我们从各种服务器场景所示，开放系统和软件比闭源系统具有安全优势——所有代码部分不仅可以受到审查，还可以以新颖有趣的方式进行扩展和应用。这允许社区以闭源系统世界无法比拟的速度来响应和应对安全事件及漏洞。最近的一个例子来自
    Nimda 蠕虫。尽管它利用了微软产品（如 IIS、Internet Explorer 和 Outlook）的多种漏洞，但它也允许蠕虫通过单个感染点通过网络迅速扩散到整个企业。针对这一威胁，日本的一个
    Samba 用户组发现他们可以在 Samba 配置文件中应用“否决文件”（veto files）来阻止蠕虫在支持 Samba 的网络共享之间传播。此信息通过新闻组和邮件列表迅速传播，现在已包含最新的
    Samba 发行版中，作为一个特定的 README 文件³⁷。此外，这种技术可以防止任何 Win32 蠕虫尝试通过 Samba 网络共享传播。有很多类似的例子。


    > ³⁵ http://www.linuxsecurity.com/articles/hackcracks article-4124.html

    ³⁶ http://www.securityfocus.com/news/209

    ³⁷ http://us.samba.org/README.Win32


