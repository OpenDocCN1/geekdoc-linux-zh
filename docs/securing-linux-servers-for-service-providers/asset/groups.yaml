    # Honeypots


    A "honeypot" is a server connected to outside the DMZ that acts as a decoy, luring
    potential attackers in order to study their activities and monitor how they are
    able to break into a system. Honepots are designed to imitate systems that an
    intruder would like to break into but limit the intruder from having access to
    an entire network – in other words, it is a Trojan horse that you control. If
    a honeypot is successful, the intruder will have no idea that they are on a bogus
    system and being monitored. However, honepots are installed inside firewalls that
    can be tightly controlled. By restricting what comes into a server from the Internet,
    the firewall allows all traffic to come from the Internet to lure your entry into
    an environment where they can do not harm B) you can monitor their activities,
    tools, and intrusion to learn what they are trying to exploit and improve your
    own defenses from this knowledge. Honepots are but one tool for a security infrastructure
    and should not be considered a single form of protection, or a replacement for
    other security measures such as an IDS. Furthermore, as it is designed to lure
    to your servers, honepots are not practical for all businesses and skillsets.
    Design and implementation of a honeypot in your production infrastructure should
    be carefully considered and deployed and managed by security experts.


    The Honeynet Project (http://project.honeynet.org/project.html) is a non-profit
    research group of security professionals dedicated to security research. Their
    goal is to learn the tools, techniques, and motives of the blackhat community
    and to share these learned lessons. All of the Honeynet''s work is OpenSource
    and shared with the security community. The primary tool for their research is
    the Honeypot (http://project.honeynet.org/papers/honeypot/). Another article on
    building Virtual Honeypets is found at http://www.securityfocus.com/cgi-bin/infocus.pl?id=1506.
    I highly recommend the content of the Honeypot Project as it provides real world
    experience from the top of security experts in the field.


    LaB (http://www.threenorm.com/LaB) is a program that creates a honeypot or "tarpit."
    LaB takes unused IP addresses on a network and creates "virtual machines" that
    answer to connection attempts. LaB answers those questions in a way that causes
    the machine to get stuck, sometimes for a very long time. LaB is currently being
    used to trap many of the recent vulnerabilities, such as CodeRed, Nimda, and Pentagon.
    LaB is under the GPL and can be a useful addition to a service provider security
    infrastructure, providing a proactive tool for worm protection.'
  - '[PAGE 23]


    # Linux Firewalls


    One of the significant advantages of the Linux 2.4 kernel is the addition of stateful
    packet headers via iptables also known as NetFilter. Prior to iptables, the 2.2
    version of the kernel used the ipchains application to provide firewall service.
    Although ipchains is very useful, the addition of stateful packet filtering brings
    Linux 2.4 into the functionality of enterprise class firewall products. The significant
    difference between iptables and ipchains allows for stateful packet inspection
    – in other words, an iptables based firewall can maintain a stateful awareness
    of packets as they attempt to communicate through the system. This allows iptables
    to make decisions on network messages in a sequence pattern, and identify and
    act on points in that sequence when a packet triggers the iptables packet filter.


    # What is a packet filter?


    A packet filter is software which looks at packet headers as they pass through
    the system (which contains data such as source and destination IP address, port,
    flags, etc.), and decides what to do with the entire packet. The packet filter
    might decide to deny the packet (discard the packet as if it had never received
    it), accept the packet (let the packet pass through), or reject the packet (like
    deny, but inform the source of the packet that it has rejected). Under Linux,
    packet filtering is built into the kernel as a kernel module.


    Below is a high level diagram of how a packet traverses the iptables filter “lifecycle":


    +   Inbound packets


    ![](img/bfe6ea110ea710ed0e76c993ed104f90_23_0.png)


    The first step is a “routing decision” made by the kernel (with iptables) based
    on the destination of the inbound packet. If the packet is for this server, the
    kernel passes the packet down to the INPUT chain. If the packet passes the INPUT
    chain, it is processed by any local processes listening for this data (applications,
    servers, etc.).


    If the kernel has IP forwarding enabled and the packet has a destination address
    for a different network interface, the packet is passed to the FORWARD chain.
    If it passes the FORWARD chain (passing the ACCEPT rules in that chain) it is
    sent out. If the kernel'
- md: "\n# IBM\n\ndoes not have forwarding enabling; the packet does not have a destination\
    \ address on this server, it is dropped.\n\nIf the \"Local processing\" programs\
    \ can send network packets (which is typically the case), these packets are sent\
    \ through the OUTPUT chain. If the packet is ACCEPTED by the OUTPUT chain, it\
    \ is then sent outbound to its specified interface.\n\nHere is a quick start to\
    \ iptables. Determine if iptables is installed. Try to load the iptables with\
    \ modprobe and then grep it through the ismod (list modules) function:\n\n```bash\n\
    [root@mordor nazgul~$] modprobe ip_iptables\n[root@mordor nazgul~$] ismod | grep\
    \ ip_iptables\niptables          10496 4 [iptable_nat bytes]\n```\n\nThe last\
    \ line shows that \"iptables\" is loaded, the size is \"10496\" bytes, it’s \"\
    use count\" is \"4\"^1 and of the list of referring modules, in this case \"iptable_nat\"\
    \ and \"iptable_filter\". The information displayed by ismod is identical to that\
    \ available from /proc/modules.\n\nTo display command line options for iptables,\
    \ simply type \"iptables -h\". Simply put, the iptables command inserts and deletes\
    \ rules from the kernel's packet filtering table. Note: it is recommended to be\
    \ at the console of your server when making firewall changes, so that in the examples\
    \ below, it is easy to deny yourself remote access with a misconfigured rule or\
    \ type.\n\nThe following example shows a simple rule to disable inbound TCP traffic:\n\
    \n```bash\n/bin/iptables -A INPUT -p tcp -s syn -j DROP\n```\n\nThis will allow\
    \ your Linux server to communicate outbound TCP, drops all inbound TCP packets.\
    \ However, in a typical provider scenario, the Linux server will need to have\
    \ inbound TCP communication from other servers - usually in the service provider’s\
    \ DMZ or from internal network. In this scenario, it is recommended to identify\
    \ the other servers by IP address and the service or port need to access (such\
    \ as SSH, or HTTP) on our Linux server.\n\nTo allow specific rules to communicate\
    \ with SSH to our server:\n\n```bash\n/bin/iptables -A INPUT -p tcp --s 192.168.1.10/32\
    \ --destination-port 22 -j ACCEPT\n/bin/iptables -A INPUT -p tcp -s syn -j DROP\n\
    ```\n\nThis allows only 192.168.1.110 to communicate to our server, and only via\
    \ port 22 (which is a secure shell service typically bound to port 22). You could\
    \ also use syn for your destination port, instead of the actual port number, such\
    \ as:\n\n^1 All downloadable modules have a \"use count\" that is used by the\
    \ system to determine when it is safe to unload module. The convention in client\
    \ drivers is to increment the use count when a device is opened, and decrement\
    \ the count when a device is closed.\n\n```bash\n/bin/iptables -A INPUT -p tcp\
    \ --syn 192.168.1.110/32 --destination-port ssh -j ACCEPT\n/bin/iptables -A INPUT\
    \ -p tcp --syn 192.168.1.110/32 --destination-port - -j ACCEPT\n```\n\nA typical\
    \ firewall configuration is to restrict server access to HTTP (for Web and Application\
    \ services) and SSH (for secure administrative access). Here is an example of\
    \ firewall for setting this up (192.168.1.101 is the IP address of the server):\n\
    \n```bash\n/bin/iptables -P INPUT DROP\n/bin/iptables -A INPUT -s 0/0 -d 192.168.1.101\
    \ -p tcp --destination-port - -j ACCEPT\n/bin/iptables -A INPUT -s 0/0 -d 192.168.1.101\
    \ -p tcp --destination-port ssh -j ACCEPT\n/bin/iptables -P INPUT DROP\n/bin/iptables\
    \ -P INPUT LOG\n```\n\nThis flexibility of Linux allows us to firewall each server\
    \ so that only necessary ports/services can be accessed to the network. The same\
    \ type of configuration could be applied to a Java application service, such as\
    \ WebSphere, running on a separate server, or that the firewall permits only port\
    \ that are accessed to WebSphere (such as 9080, 9443, etc.). By restricting ports\
    \ and services to the services that needs to be accessed on a specific server,\
    \ the service provider can control the potential for numbers one and four on General\
    \ Vulnerabilities SAN/FS (\"Default OS/Application Installation\" and \"Large\
    \ Number of Open Ports\", respectively). Additionally, a similar approach could\
    \ be taken to mitigate the risks to the number five Vulnerability (LPDP (remote\
    \ protocol daemon)), by firewalling any Linux print servers to allow port 515\
    \ (the TCP port listed for print requests) only to trusted machines. As print\
    \ servers are not often involved in the service provider server environment, it\
    \ is recommended to disable iptables any Linux server not designed for handling\
    \ remote print services as described in the General Practices above.\n\nAnother\
    \ common usage in the service provider space is blocking individual IP addresses.\
    \ For numerous reasons, when you publicly available servers, your system will\
    \ be visited, attacked at the worst, by non-customer related traffic. With iptables,\
    \ you can create a rule for each individual IP address, but this can become an\
    \ administrative headache as the number of IP addresses you wish to block increases.\
    \ One simple way to create a \"firewall.banned\" file with the list of the IPs\
    \ you want to block in all individual access. This file can be modified without\
    \ having to add/delete/edit your iptables rules or rc.firewall scripts. The following\
    \ loop would be added to your rc.firewall script, which would read the firewall.banned\
    \ list and create rules automatically for each IP for the specified $EXTERNAL_INTERFACE\
    \ variable:\n\n```bash\nif [ -f /etc/firewall/firewall.banned ]; then\n  while\
    \ read BANNED; do\n    iptables -A INPUT -i $EXTERNAL_INTERFACE -s $BANNED -j\
    \ DROP\n    iptables -A INPUT -i $EXTERNAL_INTERFACE -d $BANNED -j DROP\n    iptables\
    \ -A OUTPUT -o $EXTERNAL_INTERFACE -s $BANNED -j DROP\n    iptables -A OUTPUT\
    \ -o $EXTERNAL_INTERFACE -d $BANNED -j DROP\n  done\nfi\n```\n\n## Identification\
    \ and Testing\n\nThere are multiple tools to verify your firewall is configured.\
    \ Nmap (\"Network Mapper\") is a widely used tool for network exploration and\
    \ security auditing – it uses packets to determine what hosts are available, what\
    \ services (ports) are offering, what operating system is running, and dozens\
    \ of other characteristics. Nmap has both console and graphical versions. Using\
    \ iptables at the command line is good for testing but these parameters are lost\
    \ on reboot. To ensure your firewall is configured on boot, include your rules\
    \ in an initialization script, typically called \"firewall\".\n\n## IBM\n\n(Image\
    \ showing iptables configuration)\n\nInteresting ports on 192.168.1.1:\n(The 154\
    \ ports scanned, not shown below are in state: closed)\n\n| Port | State | Service\
    \ (RPC) |\n| :--- | :--- | :--- |\n| 22/tcp | open | ssh |\n| 23/tcp | open |\
    \ telnet |\n| 80/tcp | open | http |\n| 111/tcp | open | sunprpc |\n| 139/tcp\
    \ | open | netbios-ssn |\n| 445/tcp | open | smux |\n| 993/tcp | open | unknown\
    \ |\n| 1024/tcp | open | icda |\n\nNo exact OS matches for host. (if you know\
    \ what OS is running on it, see: http://www.insecure.org/cgi-bin/nmap-submit.cgi).\n\
    TCP/IP fingerprint:\nInfo(v2.5,BETA30P-1608-linux-gnu;window=12;TTL=19)\n\nNmap\
    \ Print End (nmapfe)\n\nSendip (http://earth.le/projectpurple/sendip) is a handy\
    \ command line utility for sending arbitrary packets (RIP, TCP, UDP, ICMP or raw\
    \ IPv4 and IPv6). It allows you to your iptables rules by, for example, sending\
    \ an ICMP spoofing source. Sendip is also under the GPL.\n\nAnother Source firewall\
    \ utility is Firewall Tester (http://packetstorm.deceptions.org/UNIX/firewall/fester-0.tar.gz).\
    \ This package consists of two simple Perl scripts, a client and a daemon. The\
    \ client injects custom packets, while the daemon listens for them. The comparison\
    \ of the script's log files permit the detection of filtered packets and consequently\
    \ filtering rules if the two scripts are ran on different sides of a firewall.\
    \ Additional security tools which can test and audit the effectiveness of your\
    \ firewall will be listed below in the Appendix section.\n"
