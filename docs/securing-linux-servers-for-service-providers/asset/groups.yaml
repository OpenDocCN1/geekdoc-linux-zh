    Postfix was created with security as a main design goal. Essentially, Postfix
    practices “rings of trust”, with separate processes interacting. Postfix is based
    on “semi-resident, mutually-cooperating, processes” that perform specific tasks
    for each other, without any particular parent-child relationship. Again, work
    in separate processes gives better isolation than one big program (e.g. Sendmail).
    Only one master process has to be run, and that process does not interact with
    the Internet. Additionally, all the processes can be “chroot-ed”. The end result
    of this type of distributed and isolated process architecture is that it creates
    a much more difficult design to crash, as it requires multiple processes to compromise
    a single monolithic program.


    A recommended Postfix practices include:


    +   - Utilize Postfix’s default_process_limit in main.cf to control resource usage.

    - Consider changing the maildrop banner, setgroup (http://www.postfix.org/security.html
    for details under “Set-uid” section)

    - Configure SMTP banner, similar to Sendmail example given above. Use the smtpd_banner
    directive in main.cf.


    # Qmail


    Qmail is a similar alternative to Sendmail, designed for security from the start,
    and thus an Open Source competitor to Postfix. Qmail (http://cr.yp.to/qmail.html)
    usage is growing at a very rapid pace. According to the author’s site, as of October
    2001, more than 700,000 IP addresses are running as SMTP server. Some of the more
    notable addresses using qmail as their SMTP server include: Yahoo!, NetZero, Address.com,
    Onelist, and Critical Path.


    Qmail author, Dan Bernstein, offered “security guarantee” in 1997 to prove qmail
    was secure (http://cr.yp.to/qmail/guarantee.html). Although I don’t subscribe
    to hackers optimism as often do, it illustrates the focus and confidence that
    qmail and its developers have in terms of security design. For what it’s worth,
    the prize for publishing an exploit in qmail unclaimed. The link above also includes
    the author’s reasons for why qmail is secure and is definitely worth the read
    if you are considering qmail as your server.


    Some other qmail resources:


    +   - There is a checklist for managing a large Sendmail site to qmail: http://cr.yp.to/sendmail.html.

    - If you are using qmail for high volume sending, consider using the high concurrency
    patch (http://mail.area.com/big-concurrency-patch), and the qmailqstat patch (http://mail.area.com/big-todo.103.patch).
    You should also consider running multiple qmail server instances, depending on
    your volume requirements and expectations.


    > 21 For a Group at building a chroot-ed ‘cages’ with SSH, “Building a Secure
    User Environment with SSH ChRoots” at: http://www.security.com/infocus/1404

    22 Other sites using qmail can be found at http://mail.area.com/top.html.'
