  - '[PAGE 52]


    # IBM


    A modification to rebec, but instead actually executing anything, it returns a
    benign

    error to the caller, and syslogs the calling host, username, and name of attempted
    service

    access. Also, useful for detecting scanner attacks like those perpetrated by ISS
    and

    SATAN.


    Scanlog


    scanlog is a TCP port scan detection tool, originally designed to illustrate various

    attacks on an IDS server to deal with.


    # Encryption


    Stunnel


    Stunnel is a program that allows you to encrypt arbitrary TCP connections using
    SSL

    (Secure Socket Layer) over both Unix and Windows. Stunnel can allow you to

    secure-non aware demands and protocols (like POP, IMAP, NNTP, LDAP, etc) by

    having Stunnel provide the encryption, requiring no changes to the daemon''s code.


    # OpenSSH / SSH


    Secure login/rsh/rcp replacement, OpenSSH is derived from OpenBSD''s version of
    ssh,

    which was in turn derived from ssh code before the time ssh''s license was

    changed to non-free. S (Secure Shell) is a program for logging into a remote

    machine and for executing commands on a remote machine. It provides secure encrypted

    communications between two untrusted hosts over an insecure network. X11

    connections and arbitrary TCP/IP ports can also be forwarded over the secure channel.
    It

    is intended to be a replacement for rlogin, rsh and rcp, and can be used to provide
    rdist,

    and rys with a secure communication channel.


    # GnuPG


    GnuPG is a complete and free replacement for PGP. Because it does not use the
    patented

    IDEA algorithm, it can be used without any restrictions. GnuPG is a RFC2440

    (OpenPGP) compliant application. GnuPG is a useful utility for creating and validating

    software packages. For example, Red Hat signs their RPM packages with GnuPG

    generated digital signatures.


    # Log and Traffic Monitors


    MRTG


    The Multi Router Traffic Graph (MRTG) is a tool to monitor the traffic load on

    network-links. MRTG generates HTML pages containing PNG images which provide a

    live representation of this traffic. MRTG can be extended with RRDtool

    graphing and storage/retrieval of time-series data. Both of these tools are very
    useful for

    keeping an eye on your network traffic capacity – often an indicator of an attack.'
  - '[PAGE 53]


    # IBM


    Swatch (http://www.stanford.edu/~atkins/swatch/)\Swatch, the Simple Watch Daemon
    is a program for UNIX system logging, originally written to actively monitor messages
    that are written to a log file via the UNIX syslog utility. Swatch was designed
    to keep system administrators from being overwhelmed by large quantities of data.
    It monitors log files and acts to filter out unwanted data and take one or more
    user actions based on patterns in the log. Swatch can monitor information if it
    is being appended to the log file and switch administrators immediately to serious
    system problems as they occur.


    Timbersee (http://www.fastcoder.net/thumper/sysadmin/timbersee/)\Timbersee is
    a program very similar to the Swatch program. It is used to monitor log files
    for important messages, but in that it can monitor more than one log file at a
    time, and does not fork off extra processes. Another difference from other tools
    that the configuration file is an XML file which is validated at program.


    Logsurf (http://www.cert.de/en/logsurf/)

    The program “logsurfer” is designed to monitor text-based logs on your system
    in real time. The large amount of log information collected (like all handled
    by the syslog-daemon or ftp, Web servers, etc.) makes it very difficult to check
    your logs manually to find any unusual activity. It is useful to have a program
    that does monitoring on your behalf – particularly in large server environments.
    If you don''t want to use a script that checks your logs in certain time (nightly,
    weekly, etc.) then you might be interested in the programs like swatch or logsurfer.


    TCP Wrappers (http://ftp.porcupine.org/pub/security/index.html)

    Wiestene''s network logger, also known as TCPD or LOG_TCP. These programs log
    the client host name of innet, ftp, rsh, login, finger etc requests. Security
    options are: access control for host, domain and/or service; detection of host
    name spoofing or host spoofing; booby traps to implement an early-warning system.


    IPLog (http://ojnk.sourceforge.net /)

    iplog is a TCP/IP traffic logger. It is capable of logging TCP, UDP and ICMP traffic.


    IPTraf (http://cebu.mozcom.com/riker/iptraf/)

    ipt is an ncurses-based IP monitor that generates various network statistics including
    TCP info, UDP counts, ICMP and OSPF information, Ethernet load info, node status,
    checksum errors, and others.


    Ntop (http://www.ntop.org)

    top is a Unix/Linux tool that shows the network usage, similar to the popular
    “top” Unix/Linux command.


    Snort (http://www.snort.org)

    Flexible packet sniffer/logger that detects attacks. Snort is a libcap-based packet
    sniffer/logger which can be used as a lightweight network intrusion detection
    system.'
  - '[PAGE 54]


    # IBM


    features rules based logging and can perform content searching/matching in addition
    to being used to detect a variety of other attacks and probes, such as buffer
    overflows, stealth scant, CGI attacks, SMB probes, and much more. Snort has a
    real-time alerting capability, with alerts being sent to syslog, a separate alert
    file, or even to a Windows computer via Samba.


    # Sniffers


    Sniffit (http://reptile.rug.ac.be/-coder/sniffit/sniffit.html) Packet sniffer
    and monitoring tool, sniffit is a packet sniffer for TCP/UDP/ICMP packets. sniffit
    is able to give you very detailed technical info on these packets (SEC, ACK, TTL,
    Window, etc.) also packet contents in different formats.


    Tcpdump (http://tcpdump.org) A powerful tool for network monitoring and data acquisition.
    Tcpdump program allows you to dump the traffic on a network interface interface
    that matches a given expression. You can use this to track network problems, to
    detect ping attacks or to monitor the network activities.


    Dsniff (http://naughty.monkey.org/-dugsong/dsniff/) dsniff is a collection of
    tools for network auditing and penetration testing. Includes sophisticated techniques
    for defeating the "protection" of network switches. dsniff, sniffers, filemap,
    msnarf, msnarl, and webspy passively monitor for interesting data (passwords,
    e-mail, files, etc.), arspoof, dnspoof, and macof facilitate the interception
    of network traffic normally unavailable to an attacker (e.g. on layer-2 redirected
    ssh). sshmitt and webmitt implement active man-in-the-middle attacks against redirected
    SSH and HTTPS sessions by exploiting weak bindings in ad-hoc PKI.


    Ethereal (http://www.ethereal.com/) Ethereal is free network protocol analyzer
    for Unix/Linux and Windows. It allows you to examine data from a live network
    or a capture file on disk. You can interactively browse the capture data, viewing
    summary and detail for each packet. Ethereal has several powerful features, including
    a rich display filter language and the ability to view the reconstructed stream
    of a TCP session.


    Ngrep (http://www.packetfactory.net/Projects/ngrep/) A grep-like tool for network
    traffic. ngrep strives to provide most of grep''s common features, applying them
    to the network layer. ngrep is a pcap-tool that will allow you to specify extended
    regular expressions to match data payloads of packets. It currently recognizes
    TCP, UDP and ICMP across Ethernet, PPP, SLIP and null interfaces, and understands
    bpf filter logic in the same fashion as more common packet sniffing tools, such
    as tcpdump and snoop.'
