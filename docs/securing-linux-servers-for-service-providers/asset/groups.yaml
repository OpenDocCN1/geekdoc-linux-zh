  - "[PAGE 28]\n\n# IBM\n\nIt is recommended to understand Iptables (or Ipchains,\
    \ for that matter) thoroughly before attempting to configure your filter rules.\
    \ Generally speaking, using the command line to modify and tune your firewall\
    \ configuration is one of the best ways to do this. However, it is also worth\
    \ noting there are several applications and freely available tools which allow\
    \ for easier configuration and management of an iptables firewall. For a simple\
    \ configuration, from a Red Hat distribution you can simply type “setup” from\
    \ the command line and select “Firewall Configuration\", which allows you to configure\
    \ some generic parameters, as displayed below:\n\n![](img/bfe6ea110ea710ed0e76c993ed104f90_28_0.png)\n\
    \nOther Ipchains/Iptables firewall configuration and management tools include:\n\
    \n+   - Firewall Builder (http://www.fwbuilder.org)\n  Firewall Builder consists\
    \ of an object-oriented GUI and a set of policy compilers for various firewall\
    \ platforms.\n- Shoreline Firewall (http://www.shoreline.net/\n  Customizable\
    \ configuration files, monitoring, and rasterized sample configurations for common\
    \ firewall implementations.\n- Firewall Design Tool (http://www.linux-firewall-tools.com/linux/firewall/index.html)\n\
    \  A clever application for building a firewall, currently supports ipchains,\
    \ ipfwadm and ipfw, will generate a shell script containing your firewall configuration.\n\
    - MonMath’s Iptables (http://t245.dydns.org/~monmotha/firewall/index.php)\n  Easily\
    \ configured script.\n- PHP Firewall Generator (http://phpfwgen.sourceforge.net/)"
  - '[PAGE 29]


    # IBM


    The PHP Firewall Generator is a simple PHP script that generates a firewall script
    for iptables or iptchains firewalls. The script is created based on configuration
    rules entered by the user.


    Iptables can be a complex subject and building sophisticated rules for an iptables
    firewall is beyond the scope of this document. I have included references in the
    Resources section for diving deeper into iptables.


    # Linux FTP Servers


    FTP servers are commonly used in the service provider market. Although HTTP has
    made large inroads in remote file distribution, FTP is likely the foremost method
    for software distribution. Many of the security risks with FTP are very similar
    to telnet (clear text passwords, potential "man in the middle" attacks, etc.),
    and there are a variety of solutions for securing FTP which can vary significantly
    on how the Linux FTP server is to be used. Below are recommended practices based
    on the type of FTP service your customer needs to provide.


    # Non-Anonymous FTP


    Non-anonymous FTP means that your FTP servers are accessed by a specified list
    of users. There is a straightforward decision in this scenario - use SSH. Since
    early 2000, SSH2 includes sftp (http://www.ssh.com). The official SSH2 implementation
    is a commercially licensed product, and provides a variety of enhancements and
    support. There is also a GPL requirement for SSH, which includes sftp, available
    via OpenSSH (http://www.openssh.com). Sftp performs all operations over an encrypted
    SSH transport. It can also use many features of SSH, such as key authentication
    and compression. However, sftp requires a user account at the ftp server, so it
    is not applicable to server deployments that need to operate anonymously.


    # Anonymous FTP


    Many servers need to be "anonymous" as they need to provide and/or upload file
    to the general public, or at least a group of users they cannot specify with non-anonymous
    FTP accounts. Anonymous FTP is a common requirement in the service provider. If
    your customer needs to run an anonymous FTP server, it is widely suggested to
    use the CERT configuration guidelines (http://www.cert.org/cert_tips/anonymous_ftp_config.html),
    as well as the General Server suggestions below.


    # Recommended FTP Servers


    vsFTPD, "Very Secure FTP" (ftp://ferret.linux.org.uk/pub/linux/vsftpd/) is a ground-up
    FTP implementation, designed for security.. vsFTPD also includes the ability to
    throttle bandwidth by preventing the FTP link from being saturated. vsFTPD is
    used by some well known servers, such as ftp.redhat.com


    ProFTP is another alternative for customers looking for robust anonymous FTP server
    functionality on Linux (http://www.proftpd.org). ProFTP is under GPL and only
    version'
  - '[PAGE 30]


    # IBM


    1.2.0rc3 or greater should be used. ProFTPD is the FTP server used for many volume,
    Linux-based anonymous FTP servers, such as ftp-kernel.org (the definitive FTP
    site for Linux), SourceForge,GNU.org, and Frontier, a Linux-based service provider
    in the UK which hosts, among others, ftp.linux.co.uk and www.linux.co.uk. Read
    the ProFTPD FAQ (http://www.proftpd.net/docs/faq/proftpdfaq.html) to determine
    if ProFTPD is suitable for your requirements.


    Another option to consider is SafeTP (http://www.cs.berkeley.edu/~smpecak/SafeTP/doc.html)
    which provides a transparent FTP proxy. When SafeTP is installed, any Windows
    or Linux Unix automatically becomes a Secure FTP client, without any further intervention.
    SafeTP intercepts outgoing FTP network connections, and encrypts the traffic before
    relating to the network. Details on how SafeTP is configured and any firewalls
    should be investigated before deciding SafeTP as a FTP client/server solution
    (http://www.cs.berkeley.edu/~smpecak/SafeTP/firewall.html).


    # General FTP Server suggestions


    +   - If possible, do not use standard FTP, but rather rsftp as mentioned above,
    or if you need to just provide an anonymous server (without uploading privileges),
    consider using a stand HTTP server, such as publicfile (http://publicfile.org)
    or secured as VSFTPpd (described above), or Afpd (http://web.ranum.com/pubs/index.html).

    - Combine your servers onto a single Linux server which is stripped of all non-FTP
    functionality, services and data. This server should be placed in the DMZ, outside
    of the corporate network. The FTP server(s) should ideally limit access to FTP
    and administrative ports (such as SSH). It may also be beneficial to use TCP Wrappers
    (see Wra at the end of this document) to wrap the FTP daemon with SSH.

    - Create “captive accounts which restrict the users to only FTP access of the
    system and restrict the users to only accessing directories above a root directory
    you specify. One may implement this by creating a “guestgroup” entry in the /etc/ftpasswd
    file.

    - ftpmap and hosts.allow/deny can also be used to control access to FTP and other
    xrelated services on your Linux server, but remember this control access over
    the OSI stack, where the firewall control can operate at layer 2 and above.

    - Secure against FTP bounce attacks. Although most current FTP servers protect
    against this, it is still worth verifying. For an explanation of this exploit,
    read http://www.securityfocus.com/archive/i3488 and the “-b ftp relay host” option
    for nmap (found in the nmap man page, or http://www.insecure.org/nmap/nmap_epage.html).

    - If using WU-FTP (included by many distributions, such as Red Hat), utilize the
    “chroot” function to limit users access. To learn about chroot in wufpd, “man
    ftpaccess” on your Linux system and read the “realizer”, “guest-user” and “guestgroup”
    options.'
  - '[PAGE 31]


    # IBM


    +   - Provide MD5 checksums and/or PGP signatures for the files that are to be
    distributed via the FTP server, allow users a method for verifying the authenticity
    of the files to be downloaded.

    - Never allow FTP as root

    - Modify the FTP information banner. On a client connection, FTP banners provide
    FTP server information, as server type and version. This information can be used
    to plan an attack against your system. Most FTP servers (wu-ftpd, proftpd, etc.)
    allow this banner to be configured to provide different or limited messages to
    the client.

    - If the server is behind a firewall (recommended), test intrusions with Ftp-Ozone
    (http://www.monkey.com/~dugsong/ftp-ozone.c)


    # Linux Mail Servers


    Mail servers are one of the most common components in a service provider architecture.
    They are also one of the most common targets for Internet based attacks. As noted
    in the SANS/FBI Vulnerability list, "Sendmail Vulnerabilities" holds the number
    two slot on the exposure list. Sendmail is a program that sends, receives, and
    forwards electronic mail processed on Unix and Linux computers. Due to Sendmail''s
    longevity and omnipresence it is often targeted by attackers. Sendmail has its
    share of vulnerabilities, in the very first advisory issued by CERT/CC in 1988,
    reference to an exploitable vulnerability in Sendmail. In this section, we will
    examine some practices for hardening Sendmail on Linux servers as well as other
    mail server solutions for Linux, such as Postfix and Qmail. This section will
    also explore using Linux servers as SPAM and Email Virus "filters.


    # Sendmail


    There are numerous resources documenting Sendmail security. Below are the best
    practices to consider for general Sendmail on Linux implementations.


    +   - First, upgrade to the latest version of Sendmail. Many, if not most, known
    Sendmail security vulnerabilities are resolved by upgrading/patching to the latest
    version. The latest version of the Open Source version of Sendmail can be found
    specifically towards Service Providers found at: http://www.sendmail.com/solutions/sp/

    - Run Sendmail as a separate user – don''t give Sendmail any privileges. Implement
    this by making Sendmail UID/GID "mail." Using the RunAsUser directive in sendmail.
    Additionally, by using the SafeFileEnvironment you can create "chroot jails" (which
    prevents files from writing outside of a defined subtree). You will also need
    to modify the permissions on the Sendmail related files to be accessed by user
    "mail"


    > ¹ If you are not familiar with Sendmail configuration ("m4" and "cf" are unfamiliar
    to you), please read this document first: http://www.sendmail.com/m4/readme.html


    © Copyright IBM. Corp. 2001. All rights reserved.'
- md: "\nTurn off SMTP Banner information. Like FTP banners explained above, when\
    \ a “user” telnets to your Sendmail server, they receive a banner of information\
    \ about Sendmail - below is an example:\n\nThis provides information that real\
    \ users don't care about, but could aid a potential attacker in profiling your\
    \ system. In Sendmail, a change to the sendmail.cf can modify the SMTP banner\
    \ information. The default setting in Red Hat distributions is:\n\n```\n# SMTP\
    \ initial login message ($e macro)\nOSmtpGreetingMessage=$ Sendmail $v/$b\n```\n\
    \nThis displays the information from the sample session above. By changing this\
    \ directive in sendmail.cf, you can change the information you present in your\
    \ SMTP banner, such as:\n\n```\n# Modified SMTP login message ($e macro)\nOSmtpGreetingMessage=$\
    \ Microsoft Exchange; $b\n```\n\nAfter restarting Sendmail, when a “user” telnets\
    \ to your Linux server, they'll receive:\n\n> Obviously, this is an example of\
    \ “masking” your server information.¹¹⁸\n\n- Turn off VRFY and EXPN. Most current\
    \ distributions default to the following PrivacyOptions configuration (in sendmail.cf).\n\
    \n- # privacy flags\nPrivacyOptions=+authwarnings,noverfy,noexpn,restrict\n\n\
    Disables VRFY and EXPN commands (among other things). Verify that your Linux mail\
    \ server is doing the same.\n\n- Consider running Sendmail from xinetd to accept\
    \ mail on port 25 as non-root. The following is an example smtp file you could\
    \ include in /etc/sendmail/\n\n¹¹⁸ People often report to this type of “server\
    \ masquerading” the OS by saying that it is easily circumvented by nmap, or simple\
    \ tool to identify the fingerprint. However, if this sort of fingerprinting interests\
    \ you, there are methods using plugins for making your Linux server look like\
    \ another OS (such as Windows). See Bob Beck’s “Passive-Aggressive Resistance:\
    \ OS Fingerprint Event”, Linux Journal, #89, Sept. 2001. Also see http://www.insecure.org/nmap/nmap-fingerprinting-article.html\
    \ http://www.phrack.org/php?p=54-a-9\n\n# IBM\n\n```\nservice smtp\n{\n    socket_type\
    \ = stream\n    protocol = tcp\n    wait = no\n    user = mail\n    group = mail\n\
    \    server = /usr/sbin/tcpd/sendmail\n    server_args = -bs\n    nice = 0\n \
    \   instances = 20\n}\n```\n\nThis example runs Sendmail as user/group \"mail\"\
    \ and is running Sendmail through tcp (TCP Wrappers). It also allows the control\
    \ of number of Sendmail instances to run (20) and the \"nice\" value specifies\
    \ the priority to run Sendmail (5).\n\n- As of Red Hat 7.1, by default, Sendmail\
    \ does not accept network connections from any other than the local computer (this\
    \ is a good thing in regards to default security). If you need to configure Sendmail\
    \ as a server for other clients, edit /etc/sendmail.mc and change DAEMON_OPTIONS\
    \ to also listen on network devices, or connect this other option. You will need\
    \ to regenerate /etc/sendmail.cf by running.\n- Control Sendmail Denial of Service\
    \ (DoS) attacks. An attack is to send so much mail to a server that the mail server's\
    \ disk literally fills up the \"mail\" user/group. An easy way is to set quotas\
    \ or limits which allows both (warm) and hard (stop) constraints on how many emails\
    \ a given user can consume.\n- Disable Sendmail on Linux servers that are not\
    \ mail servers or mail relays (see section above on disabling services for your\
    \ distribution).\n- If you need to keep Sendmail enabled, the Linux server is\
    \ not a mail server or relay, do not run Sendmail in daemon mode (disable the\
    \ \"-bd\" switch).\n- More Sendmail recommendations can be found here: http://www.sendmail.org/net/000705securitygeneral.html\n\
    \n# Postfix\n\nAlthough Sendmail is the MTA today, Postfix is a highly regarded\
    \ alternative. Postfix (http://www.postfix.org) attempts to be fast, easy to administer,\
    \ and secure, while at the same time being Sendmail compatible enough to not upset\
    \ existing users. Thus, the outside has a \"Sendmail-ish\" flavor, but it is completely\
    \ different. Postfix was developed by Wietse Venena at the IBM T. J. Watson Research\
    \ Lab²⁰. It was formerly known as VMailer, and later released by the end of 1998\
    \ as the IBM Mailer. From then it has been served as Postfix.\n\n> ¹⁹ http://www.linuxdoc.org/HOWTO/mini/Quota.html\n\
    ²⁰ Wietse Venena is a security software developer and other of valuable tools\
    \ such as TCP Wrapper and The Coroner's Toolkit. ftp/ftp.porcupine.org/pub/security/index.html\n\
    \nPostfix was created with security as a main design goal. Essentially, Postfix\
    \ practices “rings of trust”, with separate processes interacting. Postfix is\
    \ based on “semi-resident, mutually-cooperating, processes” that perform specific\
    \ tasks for each other, without any particular parent-child relationship. Again,\
    \ work in separate processes gives better isolation than one big program (e.g.\
    \ Sendmail). Only one master process has to be run, and that process does not\
    \ interact with the Internet. Additionally, all the processes can be “chroot-ed”.\
    \ The end result of this type of distributed and isolated process architecture\
    \ is that it creates a much more difficult design to crash, as it requires multiple\
    \ processes to compromise a single monolithic program.\n\nA recommended Postfix\
    \ practices include:\n\n- Utilize Postfix’s default_process_limit in main.cf to\
    \ control resource usage.\n- Consider changing the maildrop banner, setgroup (http://www.postfix.org/security.html\
    \ for details under “Set-uid” section)\n- Configure SMTP banner, similar to Sendmail\
    \ example given above. Use the smtpd_banner directive in main.cf.\n\n# Qmail\n\
    \nQmail is a similar alternative to Sendmail, designed for security from the start,\
    \ and thus an Open Source competitor to Postfix. Qmail (http://cr.yp.to/qmail.html)\
    \ usage is growing at a very rapid pace. According to the author’s site, as of\
    \ October 2001, more than 700,000 IP addresses are running as SMTP server. Some\
    \ of the more notable addresses using qmail as their SMTP server include: Yahoo!,\
    \ NetZero, Address.com, Onelist, and Critical Path.\n\nQmail author, Dan Bernstein,\
    \ offered “security guarantee” in 1997 to prove qmail was secure (http://cr.yp.to/qmail/guarantee.html).\
    \ Although I don’t subscribe to hackers optimism as often do, it illustrates the\
    \ focus and confidence that qmail and its developers have in terms of security\
    \ design. For what it’s worth, the prize for publishing an exploit in qmail unclaimed.\
    \ The link above also includes the author’s reasons for why qmail is secure and\
    \ is definitely worth the read if you are considering qmail as your server.\n\n\
    Some other qmail resources:\n\n- There is a checklist for managing a large Sendmail\
    \ site to qmail: http://cr.yp.to/sendmail.html.\n- If you are using qmail for\
    \ high volume sending, consider using the high concurrency patch (http://mail.area.com/big-concurrency-patch),\
    \ and the qmailqstat patch (http://mail.area.com/big-todo.103.patch). You should\
    \ also consider running multiple qmail server instances, depending on your volume\
    \ requirements and expectations.\n\n> 21 For a Group at building a chroot-ed with\
    \ SSH, “Building a Secure User Environment with SSH” at http://www.security.com/infocus/1404\n\
    22 Other sites using qmail can be found at mail.area.com/\n\nQmailanalog (http://cr.yp.to/qmail.html)\
    \ is a collection of tools to help you analyze qmail's activity (i.e., how many\
    \ messages, recipients, attempts, were 50/75/100% of the)\n\n## Linux Virus and\
    \ Spam Filters\n\nA useful benefit to service provider email is the ability to\
    \ \"pre-screen\" email for viruses, worms, Trojans, or Spam. By placing a Linux\
    \ filter around the inbound SMTP servers, the service provider can add significant\
    \ value to their service agreements. Additionally, a Linux filter can be agnostic\
    \ to the sending and receiving email clients (i.e., Microsoft Outlook, Macintosh,\
    \ Linux, etc.). Listed below the diagram are a few examples of Open Source virus\
    \ and filter applications.\n\nThe following is a high level example of integrating\
    \ a Linux filter into an email infrastructure. This could be implemented as a\
    \ stand-alone Linux mail/filter server (as illustrated), or possibly on the Linux\
    \ firewall system (depending on the virus scanner package).\n\n![diagram](img.png)\n\
    \nAMAVis (http://www.amavis.org/amavis.html) is a GPL application that resides\
    \ on the inbound SMTP server (i.e., Sendmail, Qmail, Postfix). When a mail arrives,\
    \ the message is parsed through a script that extracts all attachments from the\
    \ mail, unpacks (if needed) and scans them using a professional virus scanner\
    \ program (such as Network Associates Virus Scanner, Sophos Weep, CA IncludeIT.)\n\
    \nQmail Scanner (http://qmail-scanner.sourceforge.net/) (also known as scan4virus)\
    \ is an add-on that enables a qmail server to scan all gateway-email for certain\
    \ characteristics. It is typically used for its anti-virus protection functions,\
    \ in which it is used in conjunction with commercial virus scanners. Blackmail\
    \ (http://www.jsm-net.demo.co.uk/blackmail/blackmail.html) is a Spam filter that\
    \ operates on incoming and (optionally) outgoing mail. The filtering consists\
    \ of\n"
