    # Develop a patch and upgrade strategy


    A large amount of Linux security exploits are based on vulnerabilities in commonly
    used Open Source software, as BIND, Sendmail, NFS, “r”-programs (exec, rsh, rpc).
    One of the main advantages of Open Source software is the speed at which vulnerabilities
    are identified and patched. Because of this, it is important to develop a strategy
    for upgrading critical software components. This strategy should include the following
    processes:


    +   - Assignment and subscription to security related lists. This includes a vendor’s
    security update mailing list (Red Hat, SuSE, Caldera, TurboLinux, etc.), as well
    as security advisory mailing lists from your local incident response team. These
    mailing lists are typically low volume and provide invaluable information for
    system and security administrators. Mail list information is provided in the Resources
    section at the end of this month.

    - Retrieval of the latest patch list from your vendor and retrieval of recommended
    security patches not included with your system. Some Linux distributions provide
    tools for automatically checking the packages on a local system with the latest
    recommended patches (such as SuSE YaST and RedHat Up2date). Some patches may re-enable
    configurations so it is important to go this checklist after installing any new
    packages or patches. Patches for software applications not supplied by the operating
    system vendor should be obtained directly from the software vendor’s web site.

    - Ensure that software patches and packages are only downloaded from a reliable
    source (i.e. from the vendor or a trusted mirror).

    - Verify the cryptographic signature of any signed downloaded files to ensure
    integrity. Never use a file whose signature doesn''t match its contents. PGP (http://www.pgp.org)
    and GnuPG (http://www.gnupg.org) can be used for encryption and authentication
    and are commonly used by many Open software developers to develop digital signatures.
    Learn how to use GnuPG to verify digital signatures: http://www.dewinter.com/gnupg_howto/english/

    - Verify the md5 checksum, when possible, of any downloaded patches with a utility
