    AuthType Basic

    AuthUserFile /etc/httpd/users

    ```


    ```

    <Limit POST>

    require group staff

    </Limit>

    ```


    An alternative to using htaccess for this type of authentication is to include
    a configuration in the httpd.conf, which could be considered easier to manage
    and secure (single point of configuration, and the httpd.conf file is writable
    by a privileged user):


    ```

    <Directory /usr/local/apache/htdocs/customer_a_dir>

    AuthType Basic

    AuthName "Customer A"

    AuthUserFile /usr/local/apache/all_customers/customer_a_dir.htpasswd

    require valid-user

    </Directory>

    ```


    This would cause a request to http://yourdomain.com/customer_a_dir/ to be prompted
