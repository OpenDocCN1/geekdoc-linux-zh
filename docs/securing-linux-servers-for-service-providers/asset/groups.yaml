    The Code Red word didn''t infect Linux servers, but it threw large amounts of
    requests against all servers as the word spread across the Internet. This, of
    course, enters into performance and system resource (disk) issues as Web servers
    get bombarded with request for Windows-based files to export, such as "default.ida".


    The typical Code Red looked similar to this:


    ```

    192.168.2.12 - [19/Jul/2001:16:55:47 +0000] "GET /default.ida?NNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN090%u683%uc3%u781%u9090%u683%u658%bd3%u781%u9090%u658%bd3%u781%u9090%u683%u819%u0c3%u553%uu077%%0000%0000=a
    HTTP/1.0 400 252

    ```


    To do a quick run-check of a Web server log, simply grep log for a specific string,
    such as "default.ida" and count the number of lines in which it appears:


    ```

    [root@fangong logs]$# grep ''default.ida'' access_log | wc -l

    309569

    ```


    As you can tell, this request had over 300,000 requests for "default.ida" and
    was getting hit hard by Code Red (but a Linux server, and the attack being Windows-based,
    the system was not infected and therefore we don''t need to lose any data or other
    system corruption). But since we are using Apache, we don''t need to waste cycles
    and disk space for all of these Code Red word requests – or by using the "SetEnv"30
    directive in the Web server''s httpd.conf and restarting the server, Apache can
    simply ignore any requests matching the specified string in the requested URI:


    # Make sure you comment this

    #CustomLog /usr/local/apache/logs/access_log


    SetEnv Request_URI "^.root.exe%cmb.default.ida" bad-req

    CustomLog /usr/local/apache/logs/access_log common env=bad-req


    This will configure Apache to ignore any requests that match the SetEnv Request_URI
    string, in class "root.exe" "cmb.exe", or "default.ida" (all HTTP requests attempting
    to exploit vulnerabilities) and all other "normal" HTTP requests to be logged.
    So for a request http://www.mysite.com/default.ida or


