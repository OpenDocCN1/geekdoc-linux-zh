- md: "\n# IBM\n\nIt is recommended to understand Iptables (or Ipchains, for that\
    \ matter) thoroughly before attempting to configure your filter rules. Generally\
    \ speaking, using the command line to modify and tune your firewall configuration\
    \ is one of the best ways to do this. However, it is also worth noting there are\
    \ several applications and freely available tools which allow for easier configuration\
    \ and management of an iptables firewall. For a simple configuration, from a Red\
    \ Hat distribution you can simply type “setup” from the command line and select\
    \ “Firewall Configuration\", which allows you to configure some generic parameters,\
    \ as displayed below:\n\n![](img/bfe6ea110ea710ed0e76c993ed104f90_28_0.png)\n\n\
    Other Ipchains/Iptables firewall configuration and management tools include:\n\
    \n- Firewall Builder (http://www.fwbuilder.org)\n  Firewall Builder consists of\
    \ an object-oriented GUI and a set of policy compilers for various firewall platforms.\n\
    - Shoreline Firewall (http://www.shoreline.net/)\n  Customizable configuration\
    \ files, monitoring, and rasterized sample configurations for common firewall\
    \ implementations.\n- Firewall Design Tool (http://www.linux-firewall-tools.com/linux/firewall/index.html)\n\
    \  A clever application for building a firewall, currently supports ipchains,\
    \ ipfwadm and ipfw, will generate a shell script containing your firewall configuration.\n\
    - MonMath’s Iptables (http://t245.dydns.org/~monmotha/firewall/index.php)\n  Easily\
    \ configured script.\n- PHP Firewall Generator (http://phpfwgen.sourceforge.net/)\n\
    \n# IBM\n\nThe PHP Firewall Generator is a simple PHP script that generates a\
    \ firewall script for iptables or iptchains firewalls. The script is created based\
    \ on configuration rules entered by the user.\n\nIptables can be a complex subject\
    \ and building sophisticated rules for an iptables firewall is beyond the scope\
    \ of this document. I have included references in the Resources section for diving\
    \ deeper into iptables.\n\n# Linux FTP Servers\n\nFTP servers are commonly used\
    \ in the service provider market. Although HTTP has made large inroads in remote\
    \ file distribution, FTP is likely the foremost method for software distribution.\
    \ Many of the security risks with FTP are very similar to telnet (clear text passwords,\
    \ potential \"man in the middle\" attacks, etc.), and there are a variety of solutions\
    \ for securing FTP which can vary significantly on how the Linux FTP server is\
    \ to be used. Below are recommended practices based on the type of FTP service\
    \ your customer needs to provide.\n\n# Non-Anonymous FTP\n\nNon-anonymous FTP\
    \ means that your FTP servers are accessed by a specified list of users. There\
    \ is a straightforward decision in this scenario - use SSH. Since early 2000,\
    \ SSH2 includes sftp (http://www.ssh.com). The official SSH2 implementation is\
    \ a commercially licensed product, and provides a variety of enhancements and\
    \ support. There is also a GPL requirement for SSH, which includes sftp, available\
    \ via OpenSSH (http://www.openssh.com). Sftp performs all operations over an encrypted\
    \ SSH transport. It can also use many features of SSH, such as key authentication\
    \ and compression. However, sftp requires a user account at the ftp server, so\
    \ it is not applicable to server deployments that need to operate anonymously.\n\
    \n# Anonymous FTP\n\nMany servers need to be \"anonymous\" as they need to provide\
    \ and/or upload file to the general public, or at least a group of users they\
    \ cannot specify with non-anonymous FTP accounts. Anonymous FTP is a common requirement\
    \ in the service provider. If your customer needs to run an anonymous FTP server,\
    \ it is widely suggested to use the CERT configuration guidelines (http://www.cert.org/cert_tips/anonymous_ftp_config.html),\
    \ as well as the General Server suggestions below.\n\n# Recommended FTP Servers\n\
    \nvsFTPD, \"Very Secure FTP\" (ftp://ferret.linux.org.uk/pub/linux/vsftpd/) is\
    \ a ground-up FTP implementation, designed for security. vsFTPD also includes\
    \ the ability to throttle bandwidth by preventing the FTP link from being saturated.\
    \ vsFTPD is used by some well known servers, such as ftp.redhat.com\n\nProFTPD\
    \ is another alternative for customers looking for robust anonymous FTP server\
    \ functionality on Linux (http://www.proftpd.org). ProFTPD is under GPL and only\
    \ version 1.2.0rc3 or greater should be used. ProFTPD is the FTP server used for\
    \ many volume, Linux-based anonymous FTP servers, such as ftp-kernel.org (the\
    \ definitive FTP site for Linux), SourceForge, GNU.org, and Frontier, a Linux-based\
    \ service provider in the UK which hosts, among others, ftp.linux.co.uk and www.linux.co.uk.\
    \ Read the ProFTPD FAQ (http://www.proftpd.net/docs/faq/proftpdfaq.html) to determine\
    \ if ProFTPD is suitable for your requirements.\n\nAnother option to consider\
    \ is SafeTP (http://www.cs.berkeley.edu/~smpecak/SafeTP/doc.html) which provides\
    \ a transparent FTP proxy. When SafeTP is installed, any Windows or Linux Unix\
    \ automatically becomes a Secure FTP client, without any further intervention.\
    \ SafeTP intercepts outgoing FTP network connections, and encrypts the traffic\
    \ before relating to the network. Details on how SafeTP is configured and any\
    \ firewalls should be investigated before deciding SafeTP as a FTP client/server\
    \ solution (http://www.cs.berkeley.edu/~smpecak/SafeTP/firewall.html).\n\n# General\
    \ FTP Server suggestions\n\n- If possible, do not use standard FTP, but rather\
    \ rsftp as mentioned above, or if you need to just provide an anonymous server\
    \ (without uploading privileges), consider using a stand HTTP server, such as\
    \ publicfile (http://publicfile.org) or secured as VSFTPpd (described above),\
    \ or Afpd (http://web.ranum.com/pubs/index.html).\n- Combine your servers onto\
    \ a single Linux server which is stripped of all non-FTP functionality, services\
    \ and data. This server should be placed in the DMZ, outside of the corporate\
    \ network. The FTP server(s) should ideally limit access to FTP and administrative\
    \ ports (such as SSH). It may also be beneficial to use TCP Wrappers (see Wra\
    \ at the end of this document) to wrap the FTP daemon with SSH.\n- Create “captive\
    \ accounts which restrict the users to only FTP access of the system and restrict\
    \ the users to only accessing directories above a root directory you specify.\
    \ One may implement this by creating a “guestgroup” entry in the /etc/ftpasswd\
    \ file.\n- ftpmap and hosts.allow/deny can also be used to control access to FTP\
    \ and other related services on your Linux server, but remember this control access\
    \ over the OSI stack, where the firewall control can operate at layer 2 and above.\n\
    - Secure against FTP bounce attacks. Although most current FTP servers protect\
    \ against this, it is still worth verifying. For an explanation of this exploit,\
    \ read http://www.securityfocus.com/archive/i3488 and the “-b ftp relay host”\
    \ option for nmap (found in the nmap man page, or http://www.insecure.org/nmap/nmap_epage.html).\n\
    - If using WU-FTP (included by many distributions, such as Red Hat), utilize the\
    \ “chroot” function to limit users access. To learn about chroot in wufpd, “man\
    \ ftpaccess” on your Linux system and read the “realizer”, “guest-user” and “guestgroup”\
    \ options.\n- Provide MD5 checksums and/or PGP signatures for the files that are\
    \ to be distributed via the FTP server, allow users a method for verifying the\
    \ authenticity of the files to be downloaded.\n- Never allow FTP as root\n- Modify\
    \ the FTP information banner. On a client connection, FTP banners provide FTP\
    \ server information, as server type and version. This information can be used\
    \ to plan an attack against your system. Most FTP servers (wu-ftpd, proftpd, etc.)\
    \ allow this banner to be configured to provide limited messages to the client.\n\
    - If the server is behind a firewall (recommended), test intrusions with Ftp-Ozone\
    \ (http://www.monkey.com/~dugsong/ozone.c)\n\n# Linux Mail Servers\n\nMail servers\
    \ are one of the most common components in a service provider architecture. They\
    \ are also one of the most common targets for Internet based attacks. As noted\
    \ in the SANS/FBI Vulnerability list, \"Sendmail Vulnerabilities\" holds the number\
    \ two slot on the exposure. Sendmail is a program that sends, receives, and forwards\
    \ electronic mail processed on Unix and Linux computers. Due to Sendmail's longevity\
    \ and omnipresence it is often targeted by attackers. Sendmail has its share of\
    \ vulnerabilities, in the very first advisory issued by CERT/CC in 1988, reference\
    \ to an exploitable vulnerability in Sendmail. In this section, we will examine\
    \ some practices for hardening Sendmail on Linux as well as other mail server\
    \ solutions for Linux, such as Postfix and Qmail. This section will also explore\
    \ using Linux servers as SPAM and Email filters.\n\n# Sendmail\n\nThere are numerous\
    \ resources documenting Sendmail security. Below are the best practices to consider\
    \ for general Sendmail on Linux implementations.\n\n- First, upgrade to the latest\
    \ version of Sendmail. Many, if not most, known Sendmail security vulnerabilities\
    \ are resolved by upgrading/patching to the latest version. The latest version\
    \ of the Open Source version of Sendmail can be found specifically towards Service\
    \ Providers found at: http://www.sendmail.com/solutions/sp/\n- Run Sendmail as\
    \ a separate user – don't give Sendmail any privileges. Implement this by making\
    \ Sendmail UID/GID \"mail.\" Additionally, by using the SafeFileEnvironment you\
    \ can create \"chroot jails\" (which prevents files from writing outside of a\
    \ defined subtree). You will also need to modify the permissions on the Sendmail\
    \ related files to be accessed by user \"mail\"¹ If you are not familiar with\
    \ Sendmail configuration (\"m4\" and \"cf\" are unfamiliar to you), please read\
    \ this document first: http://www.sendmail.com/m4/readme.html\n\n© Copyright IBM.\
    \ Corp. 2001. All rights reserved.\n"
  mdcn: "\n\n# IBM\n\n在尝试配置过滤规则之前，建议彻底了解 Iptables（或者说是 Ipchains）。泛而言之，使用命令行来修改和调优你的防火墙配置是实现这一点的最佳方法之一。然而，值得注意的是，还有几个应用程序和免费提供的工具，它们可以让你更轻方便地配置和管理\
    \ iptables 防火墙。对于简单的配置，在红帽（Red Hat）发行版中，你只需在命令行中输入“setup”并选择“Firewall Configuration”，这将允许你配置一些通用参数，如下所示：\n\
    \n![](img/bfe6ea110ea710ed0e76c993ed104f90_28_0.png)\n\n其他的 Ipchains/Iptables\
    \ 防火墙配置和管理工具还包括：\n\n- Firewall Builder (http://www.fwbuilder.org)\n  Firewall\
    \ Builder 由一个面向对象的 GUI 界面一组针对各种防火墙平台的策略编译器组成。\n- Shoreline Firewall (http://www.shoreline.net/)\n\
    \  提供可自定义的配置文件、监控以及针对常见防火墙实现的栅化示例配置。\n- Firewall Design Tool (http://www.linux-firewall-tools.com/linux/firewall/index.html)\n\
    \  一个用于构建防火墙智能应用程序，目前支持 ipchains、ipfwadm 和 ipfw，它可以生成包含你防火墙配置的 shell 脚本。\n- MonMath’s\
    \ Iptables (http://t245.dydns.org/~monmotha/firewall/index.php)\n  易于配置的脚本。\n\
    - PHP Firewall Generator (http://phpfwgen.sourceforge.net/)\n\n# IBM\n\nPHP Firewall\
    \ Generator 是一个简单的 PHP 脚本，用于为 iptables 或 iptchains 防火墙生成防火墙脚本。该脚本根据用户输入的配置规则进行创建。\n\
    \nIptables 是一个复杂的课题，为 iptables 防火墙构建复杂的规则超出了本文的讨论范围。我在“资源（Resources）”部分中包含了参考资料，以便你深入研究\
    \ iptables。\n\n# Linux FTP 服务器\n\nFTP 服务器广泛用于服务提供商市场。尽管 HTTP 在远程文件分发方面取得了巨大进展，但\
    \ FTP 可能是软件分发的首要方法。FTP 的许多安全风险与 telnet 非常相似（明文密码、潜在的“中间人”攻击等），并且有多种保护 FTP 的解决方案，这些取决于\
    \ Linux FTP 服务器的具体使用方式而有所不同。以下是根据客户需要提供的 FTP 服务类型推荐的实践方法。\n\n# 非匿名 FTP\n\n非匿名\
    \ FTP 意味着你的 FTP 服务器将由指定的用户列表访问。在这种情况下，有一个简单明了的决策——使用 SSH。自 2000 年初以来，SSH2 已经包含了\
    \ sftp (http://www.ssh.com)。SSH2 的官方实现是一个商业许可产品，提供了各种增强功能和支持。SSH 也有一个符合 GPL 要求的版本，其中包含\
    \ sftp，可以通过 OpenSSH (http://www.openssh.com) 获取。Sftp 在加密的 SSH 传输层上执行所有操作。它还可以使用\
    \ SSH 的许多功能，例如密钥认证和压缩。然而，sftp 要求在 FTP 服务器上有一个用户账户，因此它不适用于需要匿名运行的服务器部署。\n\n# 匿名\
    \ FTP\n\n许多服务器需要是“匿名”，因为它们需要向普通公众提供和或上传文件，或者至少向一组无法通过非匿名 FTP 账户指定的用户提供。匿名 FTP\
    \ 是服务提供商的常见需求。如果你的客户需要运行匿名 FTP 服务器，广泛建议使用 CERT 配置指南 (http://www.cert.org/cert_tips/anonymous_ftp_config.html)\
    \ 以及下方的通用服务器建议。\n\n# 推荐的 FTP 服务器\n\nvsFTPD，“非常安全的 FTP” (ftp://ferret.linux.org.uk/pub/linux/vsftpd/)\
    \ 是一个从零开始的 FTP 实现，专为安全设计。vsFTPD 还具有通过防止 FTP 链接被饱和来限制带宽的能力。vsFTPD 被一些著名的服务器使用，例如\
    \ ftp.redhat.com。\n\nProFTPD 是 Linux 上寻找稳健匿名 FTP 服务器功能的客户的另一个替代方案 (http://www.proftpd.org)。ProFTPD\
    \ 采用 GPL 协议，应使用 1.2.0rc3 或更高版本。ProFTPD 是许多大量的基于 Linux 的匿名 FTP 服务器所使用的 FTP 服务器，例如\
    \ ftp-kernel.org（Linux 的权威 FTP 站点）、SourceForge、GNU.org 以及 Frontier（英国一家基于 Linux\
    \ 的服务提供商，托管了 ftp.linux.co.uk 和 www.linux.co.uk 等站点）。阅读 ProFTPD FAQ (http://www.proftpd.net/docs/faq/proftpdfaq.html)\
    \ 以确定 ProFTPD 是否符合你的需求。\n\n另一个值得考虑的选择是 SafeTP (http://www.cs.berkeley.edu/~smpecak/SafeTP/doc.html)，它提供透明的\
    \ FTP 代理。安装 SafeTP 后，任何 Windows 或 Linux Unix 自动变成安全 FTP 客户端，无需任何进一步干预。SafeTP 拦截出的\
    \ FTP 网络连接，并在连接网络之前对流量进行加密。在决定将 SafeTP 作为 FTP 客户端/服务器解决方案之前，应该调查 SafeTP 如何配置以及任何防火墙的细节\
    \ (http://www.cs.berkeley.edu/~smpecak/SafeTP/firewall.html)。\n\n# 通用 FTP 服务器建议\n\
    \n- 如果可能，不要使用标准 FTP，而是使用上述的 rsftp，或者如果你只需要提供匿名服务器（无上传权限），考虑使用加固的 HTTP 服务器，例如 publicfile\
    \ (http://publicfile.org) 或加固为 VSFTPpd 的服务器（如上所述），或 Afpd (http://web.ranum.com/pubs/index.html)。\n\
    - 将你的服务器合并到单个 Linux 服务器上，并剥离所有非 FTP 功能、服务和数据。该服务器应该放置在 DMZ（军事化区）中，位于公司网络之外。FTP\
    \ 服务器最好能限制对 FTP 和管理端口（如 SSH）的访问。使用 TCP Wrappers（参见本文末尾的 Wra）用 SSH 封装 FTP 守护进程也可能有益。\n\
    - 创建“捕获账户”，限制用户仅能进行系统的 FTP 访问，并限制用户仅访问你指定的根目录以上的目录。这可以通过在 /etc/ftpasswd 文件中创建一个“guestgroup”条目来实现。\n\
    - ftpmap 和 hosts.allow/deny 也可以用于控制 Linux 服务器上 FTP 及其他相关服务的访问，但请记住这种访问控制是基于 OSI\
    \ 栈的，而防火墙控制可以在第 2 层及以上运行。\n- 防御 FTP 弹回攻击。尽管目前大多数 FTP 服务器都防止了此类攻击，但仍然值得验证。有关此漏洞的解释，请阅读\
    \ http://www.securityfocus.com/archive/i348。\n- 在许多发行版中（如 Red Hat），利用 chroot 来限制访问，并在\
    \ guestgroup 选项。\n- 绝不要以 root 身份运行 FTP\n- 修改 FTP banner 信息。在 FTP 连接时，banner 提供服务器类型和版本。这些信息可被用于策划攻击。大多数\
    \ FTP 服务器（wuftpd、proftpd 等）允许此 banner 提供有限的信息。\n- 如果服务器位于防火墙后（推荐），使用 Ftp-Ozone\
    \ (http://www.monkey.com/~dugsong/ozone.c) 进行入侵。\n\n"
