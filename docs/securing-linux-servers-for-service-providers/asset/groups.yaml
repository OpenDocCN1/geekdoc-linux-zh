    \    iptables -A INPUT -i $BANNED -j DROP\n    iptables -A INPUT -i $BANNED -j\
    \ DROP\n    iptables -A OUTPUT -o $BANNED -j DROP\n    iptables -A OUTPUT -o $BANNED\
    \ -j DROP\n  done\nfi\n```\n\n## 识别与测试\n\n有多种工具可以验证防火墙配置。Nmap（网络映射）是一个广泛使用的网络探测和安全审计工具——它使用数据包来确定哪些主机可用、哪些服务（端口）正在运行、运行什么操作系统以及许多其他特征。Nmap\
    \ 有命令行和图形版本。在命令行使用 iptables 效果良好，但这些参数在重启后会丢失。为了确保防火墙配置，（显示 iptables 配置的图像）192.168.1.1\
    \ 上的有趣端口：\n（下方未列出的扫描端口状态为：关闭）\n\n| 端口 | 状态 | 服务 (RPC) |\n| :--- | :--- | :---\
    \ |\n| 22/tcp | open | ssh |\n| 23/tcp | open | telnet |\n| 80/tcp | open | http\
    \ |\n| 111/tcp | open | sunprpc |\n| 139/tcp | open | netbios-ssn |\n| 445/tcp\
    \ | open | smux |\n| 993/tcp | open | unknown |\n| 1024/tcp | open | icda |\n\n\
    没有与主机的精确操作系统匹配。（如果你知道它上运行什么操作系统，请参：http://www.insecure.org/cgi-bin/nmap-submit.cgi）。\n\
    TCP/IP 指纹：\nInfo(v2.5,BETA30P-1608-linux-gnu;window=12;TTL=19)\n\nNmap 输出 (nmapfe)\n\
    \nSendip (http://earth.le/projectpurple/sendip) 是一个实用的命令行工具，用于发送任意数据包（RIP、TCP、UDP、ICMP\
    \ 或原始 IPv4 和 IPv6）。它允许您测试 iptables 规则，例如发送 ICMP 伪造源。Sendip 同样遵循 GPL。\n\n另一种源防火墙工具是\
    \ Firewall Tester (http://packetstorm.deceptions.org/UNIX/firewall/fester-0.tar.gz)。该包包含两个简单的\
    \ Perl 脚本：客户端和守护进程。客户端注入自定义数据包，而守护进程监听这些数据包。通过比较脚本的日志文件可以检测被过滤的数据包，如果两个脚本运行在防火墙的两侧，就可以发现过滤规则。用于测试和审计防火墙有效性的其他安全工具将列在下方的附录部分。\n\
    \n"
