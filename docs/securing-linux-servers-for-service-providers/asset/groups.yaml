  - '[PAGE 17]


    # Kernel level security


    If you or your customers have security requirements on the high end of the continuum,
    they may want to consider securing Linux at the kernel. The majority of the solutions
    discussed in this document address Linux security at the user space level, but
    there are known exploits of Linux modules that give it tremendous opportunity
    for damage, as well as creating a deeply insulated blanket of protection. The
    defense against these types of low-level attacks is to patch the kernel itself,
    or to implement specialized Linux modules designed for security.


    # Open Source Kernel Security


    LIDS (http://lids.org)

    IDS (Intrusion Detection System) is a kernel patch and administrative tools to
    enhance Linux security. LIDS implements access controls (ACLs) that will help
    prevent even those with access to the superuser account from wreaking havoc on
    a system. ACLs allow LIDS to protect files as well as processes.


    +   - Protection of files. No one, including root, can modify the LIDS-protected
    files. Files can be hidden.

    - Protection of process. No one, including root, can kill the protected process.
    Processes can be hidden.

    - Fine-grained Access Control with ACLs.

    - Use and extend capability to control the whole system.

    - Security alert from the kernel.

    - Port scanner detector in kernel.


    SecurityFocus has an excellent tutorial on LIDS at:

    http://www.security.com/infocus/1496. The LIDS-FAQ is also a useful resource for
    learning about LIDS: http://www.clubinux.org/lids/


    SELinux (http://www.nsa.gov/selinux & http://opensource.nailabs.com/selinux/)

    National Security Agency (NSA) Security-Enhanced Linux (SELinux) implements powerful,
    effective, and fine-grained mandatory access controls for Linux. These controls
    can be used to confine processes (including superuser) to least privilege, protect
    the integrity and confidentiality of processes and data, and to support protected
    systems. SELinux is available under the GPL.


    The NSA chose SELinux as a platform for this work of its open environment. It
    is important to note that SELinux (nor LIDS) does not correct any flaws in Linux,
    but serves as an example of how mandatory access controls, including superuser
    access, can be added to Linux. Using SELinux, it is possible to configure a system
    that meets a number of security objectives as role-based access.


    The latest public release of the new SELinux prototype uses the Linux Security
    Modules (LSM) kernel patch available from Immunix (http://lsm.immunux.org). The
    SELinux prototype is available on the NSA SELinux Web site. The LSM kernel patch
    provides'
