    # IBM


    For more on creating rc.firewall scripts, and to see a variety of examples, go
    to: http://www.linuxguruz.org/iptables/16


    # Identification and Testing


    There are multiple tools to verify proper firewall configuration and which ports
    and services are open and exposed on your servers. A widely used and well tested
    tool is nmap, available at: http://www.insecure.org/nmap/


    Nmap ("Network Mapper") is an Open Source utility for network exploration or security
    auditing – often referred to as a "port scanner", it actually provides a wealth
    of information. Nmap uses IP packets in innovative ways to determine what hosts
    are available on the network, what services (ports) they are offering, what operating
    system (and OS version) they are running, what type of packet filters/firewalls
    are in use, and dozens of other characteristics. Nmap runs on most types of computers,
    and both console and graphical versions are available (see image below). Nmap
    is free software, available with full source code under the terms of the GNU GPL.
    An example of NMap Front End is shown below.


    > 16 Using iptables at the command line is good for testing and debugging, but
    these configuration parameters are stored in the kernel which it will be lost
    on reboot. To ensure your firewall is configured correctly on each boot, you need
    to include your rules in an initialization script, typically called "rc.firewall"
    and placed in the /etc/rc.initialization script. For more on how to create rc.firewall
    scripts see: http://people.unix-fix.org/andreasson/iptables-tutorial/iptables-tutorial.html'
