    ## Develop a patch and upgrade strategy


    A large amount of Linux security exploits are based on vulnerabilities in commonly
    used Open Source software, as BIND, Sendmail, NFS, “r”-programs (exec, rsh, rpc).
    One of the main advantages of Open Source software is the speed at which vulnerabilities
    are identified and patched. Because of this, it is important to develop a strategy
    for upgrading critical software components. This strategy should include the following
    processes:


    - Assignment and subscription to security related lists. This includes a vendor’s
    security update mailing list (Red Hat, SuSE, Caldera, TurboLinux, etc.), as well
    as security advisory mailing lists from your local incident response team. These
    mailing lists are typically low volume and provide invaluable information for
    system and security administrators. Mail list information is provided in the Resources
    section at the end of this month.

    - Retrieval of the latest patch list from your vendor and retrieval of recommended
    security patches not included with your system. Some Linux distributions provide
    tools for automatically checking the packages on a local system with the latest
    recommended patches (such as SuSE YaST and RedHat Up2date). Some patches may re-enable
    configurations so it is important to go this checklist after installing any new
    packages or patches. Patches for software applications not supplied by the operating
    system vendor should be obtained directly from the software vendor’s web site.

    - Ensure that software patches and packages are only downloaded from a reliable
    source (i.e. from the vendor or a trusted mirror).

    - Verify the cryptographic signature of any signed downloaded files to ensure
    integrity. Never use a file whose signature doesn''t match its contents. PGP (http://www.pgp.org)
    and GnuPG (http://www.gnupg.org) can be used for encryption and authentication
    and are commonly used by many Open software developers to develop digital signatures.
    Learn how to use GnuPG to verify digital signatures: http://www.dewinter.com/gnupg_howto/english/

    - Verify the md5 checksum, when possible, of any downloaded patches with a utility
    like md5 or md5sum. Md5sum is standard utility on all major distributions and
    is very straightforward to use “md5sum -c md5-file” will check the integrity of
    the md5 file. For, Red Hat includes an “MD5” file in the same directory as their
    distribution ISO images. The file contains MD5 entries for each file in that directory
    which can be used to verify authenticity (e.g., ntp://ftp.redhat.com/pub/redhat/redhat-7.2-en/iso/i386).⁵

    - Using RPM as your package management system, the “K-” or “—checksig” options.
    These options to the rpm command verify the cryptographic signature of the package.


    ## Understand which programs are Set-UID and Set-GID


    Many exploits occur in programs which are set-UID or set-GID root. Set-UID/GID,
    or Set UserID and Set GroupID, are bits set on a program that allow that be executed
    and run as the privileged user. This can be a significant security issue for programs
    that are set-UID/GID for root, such as a buffer overflow, or a software bug can
    result in a change in user identification and privileges—potentially escalating
    the user to a root compromise. Because of this potential security vulnerability,
    it is very important to know which programs are set-UID/GID root and to determine
    if they need to have this functionality for the tasks assigned for Linux server.


    Understanding all programs which have set-UID/GID is important and should be documented
    in your security policy. However, you may be interested in quickly scanning for
    set-UID root files and programs. For example, here is a simple command to search
    for all files under "root" ("-perm", or permission bits, with an octal value of
    4000 is the set-UID bit:


    ```

    find /user root -perm -4000 -ls

    ```


    Another useful operation is to look for all files whose UID or GID are not in
    /etc/passwd or /etc/group, respectively. Although, this may produce data created
    from someone extracting a tar archive, it could also be from extracting a rootkit,
    or other malicious archive. Rootkits are discussed in the “Your Network” section
    below.


    ```

    find / -fstype proc '' -nouser -nogroup '' -ls

    ```


    To remove the set-UID/GID bit from a program, use chmod ug-s program. You may
    also want to consider making critical systems programs (such as in /bin,/sbin,/usr/bin,/lib)
    immutable or unchanging. Typically these programs do not change, and if they need
    to be patched or removed, the “chattr” command is designed for this purpose. A
    program modified with “chattr +i program” cannot be deleted or renamed, no link
    can be created to this file and no data can be written to it. Only the root user
    can set or clear this attribute. As a rule of thumb, if you don''t know explicitly
    why program has set-UID/GID root, you should immediately learn why, and if not
    necessary to the server''s functionality, disable it.


