    If the "Local processing" programs can send network packets (which is typically
    thencase), these packets are sent through the OUTPUT chain. If the packet is ACCEPTED

    the OUTPUT chain, it is then sent outbound to its specified interface.


    Here is a quick start to iptables. Determine if iptables is installed. Try to
    load thentip tables with modprobe and then grep it through the ismod (list modules)

    function:


    ```

    [root@mordor nazgul~$15] modprobe ip_iptables

    [root@mordor nazgul~$15] ismod | grep ip_iptables

    iptables          10496 4 [iptable_nat bytes]

    ```


    The last line shows that "iptables" is loaded, the size is "10496" bytes, it’s
    "use count"

    is "4"^15 and of the list of referring modules, in this case "iptable_nat" and
    "iptable_filter".

    The information displayed by ismod is identical to that available from /proc/modules.


    To display command line options for iptables, simply type "iptables -h". Simply
    put,

    t iptables command inserts and deletes rules from the kernel''s packet filtering
    table.

    Note: it is recommended to be at the console of your server when making firewall
    changes, so that in the examples below, it is easy to deny yourself remote access

    with a misconfigured rule or type.


    The following example shows a simple rule to disable inbound TCP traffic:


    ```

    /bin/iptables -A INPUT -p tcp -s syn -j DROP

    ```


    This will allow your Linux server to communicate outbound TCP, drops all inbound

    TCP packets. However, in a typical provider scenario, the Linux server will need

    to have inbound TCP communication from other servers - usually in the service

    provider’s DMZ or from internal network. In this scenario, it is

    recommended to identify the other servers by IP address and the service or port

    need to access (such as SSH, or HTTP) on our Linux server.


    To allow specific rules to communicate with SSH to our server:


    ```

    /bin/iptables -A INPUT -p tcp --s 192.168.1.10/32 --destination-port 22 -j ACCEPT

    /bin/iptables -A INPUT -p tcp -s syn -j DROP

    ```


    This allows only 192.168.1.110 to communicate to our server, and only via port
    22

    (which is a secure shell service typically bound to port 22). You could also use

    syn for your destination port, instead of the actual port number, such as:


    ^15 All downloadable modules have a "use count" that is used by the system to
    determine when it is safe to unload

    module. The convention in client drivers is to increment the use count when a
    device is opened, and

    decrement the count when a device is closed.


