    # Develop a password strategy


    Passwords are still a major security exposure and quite often a direct means to
    a compromised system (number on the Top General Vulnerabilities SANS/FBI list).
    For maintaining secure passwords across Linux servers, develop a strategy which
    includes the following processes:


    +   - Limit the use of privileged accounts, especially superuser. Root privileges
    should be limited to mission staff only. Rule of thumb- give privileges only to
    those who require it and know how to recover from mistakes they may make as the
    superuser. A useful tool for controlling privilege on Linux is the ''sudo'' utility.
    Sudo (superuser) allows a system administrator to give certain users (or groups
    of users) the ability to run some (all) commands as root or another while logging
    the commands and arguments. A service provider could offer the ability to start
    Apache via root sudo, without providing any root privileges to the customer. For
    more information, see: http://www.courtenas.com/sudo/intro.html


    +   - Use shadow passwords. Shadow passwords are an encrypted version of /etc/passwd,
    found in /etc/shadow. Most Linux distributions implement shadow passwords as default
    as this is such a security measure. However, you should verify each Linux server
    that you maintain and install to ensure it is using shadow passwords. The ''pwck''
    command will validate the integrity of /etc/shadow against /etc/passwd.


    +   - Develop a password creation guide. Including:

    - Never tell anyone password or write your password down (i.e., post-it notes)

    - Recommended password creation tips (length, punctuation, numbers, etc.). Crackers
    use multiple programs to guess passwords. Many of these programs operate on multi-language
    dictionaries that attempt to guess words, and in multiple combinations, such:

    - Any word, written backwards

    - Any word, with a punctuation character at the end

    - Any word, with a punctuation character at the beginning

    - Any word, with a punctuation character in the 3rd character place

    - Any word, capitalized

    - Any two words, put together with a number between them


    The obvious lesson is not to use words for passwords, instead recommend a mnemonic
    of a favorite phrase or quote and then add or change appropriate capitalizations,
    punctuation, and other character manipulations. Such as "Chance favors only the
    prepared mind" could be changed to "Cf0tpPm"'
