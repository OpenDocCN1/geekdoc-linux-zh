    Programming application events to syslog is reasonably clear-cut. The following
    is an article describing how to program to syslog from Java:

    http://www.javaaworld.com/javaworld/jw-04-2001/jw-0406-syslog.html


    It is just as important to monitor logs as it is to log in the first place. There
    are several tools and applications available for parsing various types of logs,
    matching for patterns (e.g., unsuccessful login attempts), and acting on these
    patterns (e.g., sending email to admin). A few most common tools for scanning
    log files are mentioned in the Resources section. It is well worth spending the
    time to thoroughly learn how to configure the log scanning/analysis application(s)
    you choose to generate a large number of actions and alerts based on false positives.
    Initial configuration of log monitoring applications can save you in the long
    run.


    Archiving and securing logs are important factors in a Linux server logging plan.
    Logs can grow by orders of magnitude under significant server traffic, or denial
    of service attacks, and will quickly consume physical disk space. Keep logs which
    grow quickly in scheduled `log watchers` in cron. For example, to keep an eye
    on your Apache Access_log, you could periodically run:


    ```

    du -k /usr/local/apache/logs/access_log

    ```


    Which would return the size (in bytes; use “m” to see size in megabytes) of the
    access_log. This number can be compared to a pre-defined limit and alerts when
    the “du” output exceeds the limit.


    Secondly, consider measures to validate log integrity. Log files are typically
    the last intruder will want to modify or destroy, to cover their tracks. If you
    are attempting a potential intrusion, you be able to trust the logs you may need
    to use evidence. One simple measure is to use the “chattr” command to allow the
    logs to be appended to:


    ```

    chattr +a /var/log/maillog

    chattr +a /var/log/messages

    chattr +a /var/log/samba

    ```


    There are other methods for ensuring log integrity, such as using an intrusion
    detection system (IDS), MD5 checksums against the archived log files, or logging
    to a separate server altogether. Logging locally and sending log to a remote server
    provides an additional security layer, as well as redundancy for your log files.
    Additionally, these files can be compared for integrity (possibly generating MD5'
