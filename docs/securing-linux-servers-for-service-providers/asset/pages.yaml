    allows the user to set a limit on the allowed size of an HTTP request message
    body within the context where the directive is given (server, per-directory, per-file
    or per-location). If the client exceeds that limit, the server will return an
    error response instead of servicing the request. The size of a normal request
    message body will vary greatly depending on the nature of the resource and the
    methods allowed on that resource. CGI scripts typically use the message body for
    passing information to the server, so this directive can limit some scenarios
    where an attacker attempts to DoS over overflow cgi data.


    LimitRequestFields directive takes a number parameter as an integer from 0 (meaning
    unlimited) to 32767. The default value is defined by the compile-time DEFAULT_LIMIT_REQUEST_FIELDS
    (100 as distributed). The LimitRequestFields directive allows the server administrator
    to modify the limit on number of request headers allowed in an HTTP request. A
    server needs this to be larger than the number of fields that a normal client
    might include. The number of request header fields used by a client rarely exceeds
    20, but may vary among different client implementations, often depending on the
    extent to which a user has configured their browser to support detailed content
    negotiation. This directive can limit the exposure of headers to a Dos where an
    attacker attempts to overflow a server with an abnormally long list of request
    headers. Other limit directives include: LimitRequestSize which limits the size
    of each request header; LimitRequestLine limits the length of each request line;
    and LimitRequestBody (Apache 2) which limits the maximum byte size of an XML-based
    request.


