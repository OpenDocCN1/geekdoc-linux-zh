- img_proc: true
  md: 'The rapid evolution of Internet security exploits is clearly seen in the statistics
    at CERT/CC, the canonical organization for reporting computer security incidents
    and vulnerabilities. The number of security incidents for just the first three
    quarters of 2001 was 34,754. The number of security incidents for the year 2000
    was 21,756. The total number on incidents reported from 1989-1999 was 25,949.
    Amazingly, in just nine months in 2001, CERT has reported more security incidents
    than a decade''s worth of incidents between 1989 and 1999. The scourge of attacks,
    viruses, worms, and Trojan horses being used by way of the Internet is woefully
    affeared.³


    Increasingly, service providers are utilizing Linux as a secure, reliable, high
    performing, and cost effective server operating system. The choice of Linux makes
    perfect sense to service providers the Linux operating system itself was designed
    and developed with the Internet in mind. Linus Torvalds credits much of the success
    of Linux to the existence of Linux, which allowed for the creation of a complete
    operating system between hundreds, if not thousands, of professionals in a decentralized
    development model⁴ An operating system developed via the Internet is an ideal
    match for service providers, which build and operate their businesses by means
    of the Internet. The total cost of ownership, flexibility and outstanding track
    record of the Linux operating system is driving this usage, and more than ever,
    service customers need to understand how to ensure their Linux systems are secure.


    # Intent and Background


    The intent of this document is to clearly explain the steps needed to secure a
    Linux server. As well as specific steps for the most commonly used implementations
    of Linux servers in the service provider environment. It is beyond the scope of
    this document to illustrate every facet of Linux security, the tools or methods
    for protecting against all attacks. The vulnerabilities and recommended security
    solutions are based on professional experiences and are meant to provide examples
    and best practices in many of the common security threats found in Linux servers
    today.


    Many of the examples and practices in this domain are from my own experiences
    designing, developing and operating Web systems. As an architect in the IBM Emerging
    & Competitive Markets organization, I am involved with a variety of service providers
    and emerging businesses. My primary area of expertise is in Linux based infrastructures
    as it applies to these markets. Before joining IBM, I headed the engineering department
    for Toys a popular e-commerce site for children''s products. Due to the exposure
    of EToys.com site, we were the recipients of daily, and at times hourly, port
    scans, denial of attacks attacks and intrusion attempts. For better (learning)
    or worse (sleep) my team and I were the folks at 2 a.m. to respond to these threats.
