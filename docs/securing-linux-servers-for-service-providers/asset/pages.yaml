    # Linux FTP Servers


    FTP servers are commonly used in the service provider market. Although HTTP has
    made large inroads in remote file distribution, FTP is likely the foremost method
    for software distribution. Many of the security risks with FTP are very similar
    to telnet (clear text passwords, potential "man in the middle" attacks, etc.),
    and there are a variety of solutions for securing FTP which can vary significantly
    on how the Linux FTP server is to be used. Below are recommended practices based
    on the type of FTP service your customer needs to provide.


    # Non-Anonymous FTP


    Non-anonymous FTP means that your FTP servers are accessed by a specified list
    of users. There is a straightforward decision in this scenario - use SSH. Since
    early 2000, SSH2 includes sftp (http://www.ssh.com). The official SSH2 implementation
    is a commercially licensed product, and provides a variety of enhancements and
    support. There is also a GPL requirement for SSH, which includes sftp, available
    via OpenSSH (http://www.openssh.com). Sftp performs all operations over an encrypted
    SSH transport. It can also use many features of SSH, such as key authentication
    and compression. However, sftp requires a user account at the ftp server, so it
    is not applicable to server deployments that need to operate anonymously.


    # Anonymous FTP


    Many servers need to be "anonymous" as they need to provide and/or upload file
    to the general public, or at least a group of users they cannot specify with non-anonymous
    FTP accounts. Anonymous FTP is a common requirement in the service provider. If
    your customer needs to run an anonymous FTP server, it is widely suggested to
    use the CERT configuration guidelines (http://www.cert.org/cert_tips/anonymous_ftp_config.html),
    as well as the General Server suggestions below.


    # Recommended FTP Servers


    vsFTPD, "Very Secure FTP" (ftp://ferret.linux.org.uk/pub/linux/vsftpd/) is a ground-up
    FTP implementation, designed for security.. vsFTPD also includes the ability to
    throttle bandwidth by preventing the FTP link from being saturated. vsFTPD is
    used by some well known servers, such as ftp.redhat.com


    ProFTP is another alternative for customers looking for robust anonymous FTP server
    functionality on Linux (http://www.proftpd.org). ProFTP is under GPL and only
    version'
