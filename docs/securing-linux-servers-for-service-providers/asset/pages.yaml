  md: '# IBM


    # If you are not using a service, turn it off


    Typically, Linux servers are deployed for task specific operations – serving Web
    pages, running a Java application server, providing DNS, authenticating LDAP requests,
    firewalls and gateways. however, most Linux distributions include features and
    services to enable a wide scope of functionality – usually far more than you need
    and want on a typical Linux server deployment. Many of the latest Linux distribution
    release warnings if you attempt to install a service that has the potential for
    security vulnerability, such as telnet. I highly recommend you pay attention to
    these warnings and take considerable effort to validate that the services are
    running critical for the function of the Linux server you are configuring.


    Exploits of this nature are found around the SANS/FBI list, including the number
    one Top General Vulnerability, "Default Install of Operating System and Applications."
    The first step in securing this is to disable what you do not need. On per basis,
    you should validate what specific services are required and disable everything
    not required. Here how to handle services with Red Hat’s chkconfig and SuSE’s
    YaST2.


    With Red Hat, the "chkconfig" utility, which services are enabled and at run level:


    ```

    [root@fangom sambal# chkconfig --list

    altd 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    rrwd 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    keytable 0:off 1:on 2:off 3:on 4:on 5:off 6:off

    nscd 0:off 1:off 2:off 3:on 4:on 5:off 6:off

    syslog 0:off 1:off 2:off 3:on 4:on 5:off 6:off

    gpm 0:off 1:off 2:off 3:on 4:on 5:off 6:off

    kudzu 0:off 1:off 2:off 3:on 4:off 5:off 6:off

    kcdrocrate 0:off 1:off 2:off 3:on 4:off 5:off 6:off

    lpd 0:off 1:off 2:off 3:on 4:on 5:off 6:off

    [...]

    ```


    Let’s operate a Linux Web server at run level 3 (multi-user and networking)⁶ From
    the snippet above we can see that we have a variety of services running at that
    level. Since this server is being used only as a Web server, it is not necessary
    to run the lpd printer daemon on this system, so we should disable this via chkconfig.
    The following line disables the lpd service from run level 3:


    ```

    [root@fangom treebeard# chkconfig --level 3 off

    ```


    chkconfig basically makes symbolic links in the /etc/rc[0-6].d directories. chkconfig
    does not delete the actual program or service, only if the service is enabled
    in the Linux init process on boot-up. There, chkconfig will occur on the boot
    of the server. To add or delete a service from chkconfig usage --add or --del
    (man chkconfig for more detail). Red Hat includes a tool called “service” allows


    > ⁶For an explanation on run-levels, see: http://www.linuxworld.com/linuxworld/lw-2001-01/lw-01-geek_1.html


