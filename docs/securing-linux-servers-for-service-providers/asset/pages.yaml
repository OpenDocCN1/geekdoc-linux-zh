    # Understand which programs are Set-UID and Set-GID


    Many exploits occur in programs which are set-UID or set-GID root. Set-UID/GID,
    or Set UserID and Set GroupID, are bits set on a program that allow that be executed
    and run as the privileged user. This can be a significant security issue for programs
    that are set-UID/GID for root, such as a buffer overflow, or a software bug can
    result in a change in user identification and privileges—potentially escalating
    the user to a root compromise. — Because of this potential security vulnerability,
    it is very important to know which programs are set-UID/GID root and to determine
    if they need to have this functionality for the tasks assigned for Linux server.


    Understanding all programs which have set-UID/GID is important and should be documented
    in your security policy. However, you may be interested in quickly scanning for
    set-UID root files and programs. For example, here is a simple command to search
    for all files under "root" ("-perm", or permission bits, with an octal value of
    4000 is the set-UID bit:


    ```

    find /user root -perm -4000 -ls

    ```


    Another useful operation is to look for all files whose UID or GID are not in
    /etc/passwd or /etc/group, respectively. Although, this may produce data created
    from someone extracting a tar archive, it could also be from extracting a rootkit,
    or other malicious archive. Rootkits are discussed in the ““Your Network” section
    below.


    ```

    find / -fstype proc '' -nouser -nogroup '' -ls

    ```


    To remove the set-UID/GID bit from a program, use chmod ug-s program. You may
    also want to consider making critical systems programs (such as in /bin,/sbin,/usr/bin,/lib)
    immutable or unchanging. Typically these programs do not change, and if they need
    to be patched or removed, the “att” command is designed for this purpose. A program
    modified with “chattr +i program” cannot be deleted or renamed, no link can be
    created to this file and no data can be written to it. Only the root user can
    set or clear this attribute. As a rule of


