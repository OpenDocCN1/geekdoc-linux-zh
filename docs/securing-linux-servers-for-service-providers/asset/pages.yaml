    # Linux Mail Servers


    Mail servers are one of the most common components in a service provider architecture.
    They are also one of the most common targets for Internet based attacks. As noted
    in the SANS/FBI Vulnerability list, "Sendmail Vulnerabilities" holds the number
    two slot on the exposure list. Sendmail is a program that sends, receives, and
    forwards electronic mail processed on Unix and Linux computers. Due to Sendmail''s
    longevity and omnipresence it is often targeted by attackers. Sendmail has its
    share of vulnerabilities, in the very first advisory issued by CERT/CC in 1988,
    reference to an exploitable vulnerability in Sendmail. In this section, we will
    examine some practices for hardening Sendmail on Linux servers as well as other
    mail server solutions for Linux, such as Postfix and Qmail. This section will
    also explore using Linux servers as SPAM and Email Virus "filters.


    # Sendmail


    There are numerous resources documenting Sendmail security. Below are the best
    practices to consider for general Sendmail on Linux implementations.


    +   - First, upgrade to the latest version of Sendmail. Many, if not most, known
    Sendmail security vulnerabilities are resolved by upgrading/patching to the latest
    version. The latest version of the Open Source version of Sendmail can be found
    specifically towards Service Providers found at: http://www.sendmail.com/solutions/sp/

    - Run Sendmail as a separate user – don''t give Sendmail any privileges. Implement
    this by making Sendmail UID/GID "mail." Using the RunAsUser directive in sendmail.
    Additionally, by using the SafeFileEnvironment you can create "chroot jails" (which
    prevents files from writing outside of a defined subtree). You will also need
    to modify the permissions on the Sendmail related files to be accessed by user
    "mail"


    > ¹ If you are not familiar with Sendmail configuration ("m4" and "cf" are unfamiliar
    to you), please read this document first: http://www.sendmail.com/m4/readme.html


