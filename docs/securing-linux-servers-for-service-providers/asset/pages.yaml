  md: '# IBM


    1.2.0rc3 or greater should be used. ProFTPD is the FTP server used for many volume,
    Linux-based anonymous FTP servers, such as ftp-kernel.org (the definitive FTP
    site for Linux), SourceForge,GNU.org, and Frontier, a Linux-based service provider
    in the UK which hosts, among others, ftp.linux.co.uk and www.linux.co.uk. Read
    the ProFTPD FAQ (http://www.proftpd.net/docs/faq/proftpdfaq.html) to determine
    if ProFTPD is suitable for your requirements.


    Another option to consider is SafeTP (http://www.cs.berkeley.edu/~smpecak/SafeTP/doc.html)
    which provides a transparent FTP proxy. When SafeTP is installed, any Windows
    or Linux Unix automatically becomes a Secure FTP client, without any further intervention.
    SafeTP intercepts outgoing FTP network connections, and encrypts the traffic before
    relating to the network. Details on how SafeTP is configured and any firewalls
    should be investigated before deciding SafeTP as a FTP client/server solution
    (http://www.cs.berkeley.edu/~smpecak/SafeTP/firewall.html).


    # General FTP Server suggestions


    +   - If possible, do not use standard FTP, but rather rsftp as mentioned above,
    or if you need to just provide an anonymous server (without uploading privileges),
    consider using a stand HTTP server, such as publicfile (http://publicfile.org)
    or secured as VSFTPpd (described above), or Afpd (http://web.ranum.com/pubs/index.html).

    - Combine your servers onto a single Linux server which is stripped of all non-FTP
    functionality, services and data. This server should be placed in the DMZ, outside
    of the corporate network. The FTP server(s) should ideally limit access to FTP
    and administrative ports (such as SSH). It may also be beneficial to use TCP Wrappers
    (see Wra at the end of this document) to wrap the FTP daemon with SSH.

    - Create “captive accounts which restrict the users to only FTP access of the
    system and restrict the users to only accessing directories above a root directory
    you specify. One may implement this by creating a “guestgroup” entry in the /etc/ftpasswd
    file.

    - ftpmap and hosts.allow/deny can also be used to control access to FTP and other
    xrelated services on your Linux server, but remember this control access over
    the OSI stack, where the firewall control can operate at layer 2 and above.

    - Secure against FTP bounce attacks. Although most current FTP servers protect
    against this, it is still worth verifying. For an explanation of this exploit,
    read http://www.securityfocus.com/archive/i3488 and the “-b ftp relay host” option
    for nmap (found in the nmap man page, or http://www.insecure.org/nmap/nmap_epage.html).

    - If using WU-FTP (included by many distributions, such as Red Hat), utilize the
    “chroot” function to limit users access. To learn about chroot in wufpd, “man
    ftpaccess” on your Linux system and read the “realizer”, “guest-user” and “guestgroup”
    options.'
