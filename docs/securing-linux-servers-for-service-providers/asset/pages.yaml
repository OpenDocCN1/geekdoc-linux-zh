  md: '# IBM


    # Rootkits


    An intruder’s first goal is to maintain a compromised system by covering their
    tracks. One of the most commonly used attackers for doing this is the “rootkit.”
    A rootkit usually contains “trojaned”12 system utilities, such as find, ssh, telnet,
    netstat, is, killall, and ps. Additionally rootkits contain other analysis and
    detection tools, such as sniffers, spoofing and cleaning scripts, as well keylogger
    programs to capture passwords and other confidential information. The primary
    intent of a rootkit is to give the attacker the ability to return to the compromised
    system at a later date without being discovered. An intruder achieves this secrecy
    by relying on a system administrator to trust the output of various programs.
    Most “netstat” to display network connections and “ls” to list all files in a
    directory. The attacker hides and covers their tracks by modifying these programs
    to prevent them from displaying their activities. Therefore, “netstat” is altered
    to display the attacker’s network connections. “ls” is modified to display the
    attacker’s files and programs. Essentially, these programs are trojans of what
    the administrator is expecting. This seemingly simple proves to be effective.
    A system administrator has no clue anything is wrong, and even if they “sense”
    something is erroneous they will have difficulty down the problem since the tools
    they would use to analyze a problem are likely trojaned.


    The Linux Rootkit (Lrk) is the most common and famous rootkit for exploiting Linux
    systems. Lrk, and other rootkits and Trojan programs, can be found at: http://ftp.ftp.technotronic.com/unix/trojans/
    Researching rootkits is an excellent way to know your understanding of them, and
    what sort of files and programs you want to periodically scan or detect on your
    system. For example, Lrk uses default files specified at compile time under the
    /dev directory (/dev/pty,/dev/ptyq,/dev/ptydev/ptyp) to identify itself network
    connections, files, and processes which it will ignore or drop (i.e., which should
    be discarded). Understanding this allows you to customize defenses, as an intrusion
    detection system, to alert the administrator when these files appear, change,
    or “show up” in an abnormal manner (such as in strange on ps or ls). A decent
    intrusion detection system (see Appendix) will include services that constantly
    monitor binaries and network interfaces on a system, and alerts when it believes
    they have been compromised. To learn more about rootkits, “Understanding the Attackers
    Toolkit” at http://www.sans.org/infosec/FAQ/toolkit.htm.


    Malicious Loaded Kernel Modules (LKMs)

    The Linux kernel supports a concept called Loadable Kernel Modules (LKMs). Normally,
    if one wanted to add or modify code in a Linux kernel, they would modify the relevant
    source files to the kernel tree and recompile the kernel. But through loaded kernel
    modules, you could also add to the Linux kernel while it is running. Typically,
    LKMs are one of four things: device drivers, filesystem drivers, network drivers,
    or system functions. LKMs are part of the kernel and can be thought of as “extensions.”
    LKMs allow developers to write programs that dynamically load


    > “trojaned” programs are malvolent replacements for normally benign applications.
    A term derived, from the Trojan horse which the Greek’s “gifted” to their enemies,
    the Trojans in Homer’s Iliad.'
