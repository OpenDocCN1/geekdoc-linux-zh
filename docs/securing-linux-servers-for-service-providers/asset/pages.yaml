  md: '# IBM


    Keeping your business safe from this harsh environment takes a well designed and
    managed security framework.


    As we''ve seen from the various server scenarios, Open systems and software have
    a security advantage over closed systems - the ability for all parts of the code
    to not just be scrutinized, but expanded and applied in new and interesting ways.
    This allows the community to respond and react to security incidents and vulnerabilities
    at a speed unequal to the closed system world. A recent example of this came from
    the Nimda worm. Although this exploits a variety of vulnerabilities in Microsoft
    products, such as IIS, Internet Explorer and Outlook, it also allows the worm
    to quickly spread across an entire enterprise through a network via a single infection
    point. In response to this threat, a Samba users group in Japan discovered they
    could apply the “veto files” in the Samba configuration file to stop the worm
    from spreading across Samba-powered network shares. This information was quickly
    spread through newsgroups and mail lists, and is now included in the latest Samba
    distribution as a specific README file³⁷. Further, this technique can be applied
    to prevent the distribution of any Win32 worm attempts to spread through Samba
    network shares. There are many similar examples, and for all intents, how the
    Open Source community operates – Open systems using creative use and application,
    and then rapid knowledge transfer back into the community. This dynamic system
    is a considerable advantage to security strategy, as it provides the flexibility
    to permit a corporation to take a more effective and functional role in managing
    the overall security of its server infrastructure.


    Hopefully, this paper provided you with practical information to secure your Linux
    systems and to expand your overall Linux security framework. As Linux is proving
    to be the fastest operating system in the market, understanding how to develop
    a security framework for your server environment is, and will continue to be,
    a critical part of a service provider infrastructure.


