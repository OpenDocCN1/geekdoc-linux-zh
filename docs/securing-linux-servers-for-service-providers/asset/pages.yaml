  md: '# Overview of Linux in the Service Provider, or xSP


    The term "xSP" is simply the consolidation of the Service Provider acronyms. Initially
    only ISPs and ASPs were known in this domain, but as the Internet and eBusiness
    matured, new service provider models quickly followed. Infrastructure "SPs" such
    as managed service providers (MSPs) which provide fully managed services (network,
    storage, servers, administration, etc.) and business service providers (BSPs),
    who provide value to their customers through application access or aggregation
    (ASPs), content providers or increasingly through outsourced processes.


    But let''s not get lost in the acronym, but rather focus on the common elements
    among service providers and how these elements need to be secured under Linux.
    One of the clear similarities among service providers is the ability to supply
    network enabled customers. Whether it be in the form of a dial-up service, a Web-enabled
    application, relational databases, storage solutions, or an email account, these
    services all multiple traits.


    Sharing infrastructure and services are primary components in the economies of
    scale for building a service provider business. The degree that these components
    are shared at the hardware, network, server, or application layer – but there
    are few, if any, scenarios where some part the service provider fabric is not
    shared by multiple customers. This is a critical factor to understanding security
    in a service provider environment. Since these services are essentially available
    to the public, they must be considered un-trusted. Although a service provider
    may not consider their customers "public" or un-trustworthy, if the service is
    accessible to users over the Internet (regardless of if they have to pay for that)
    it could potentially be exploited by any machine on the Internet.


    Operating system security in Internet based services is more important than ever.
    Beyond the obvious heightened awareness around security after the tragedies of
    September 11th, there are many financial needs that have elevated security as
    a critical IT issue. Recently, PricewaterhouseCoopers updated its Security Benchmarking
    Service to include new data from InformationWeek''s 2001 Global Information Security
    Survey. The survey, fielded by PricewaterhouseCoopers, reveals that these global
    corporations realized over $1.3 trillion in lost revenue due to security breaches
    over the past year. Globally, the propagation of computer viruses is a significant
    contributor to the trillion dollar losses, with 60% of survey respondents reporting
    they lost productivity due to computer viruses and denial of service attacks.
    The number one security breach was reported against operating systems.


    > PricewaterhouseCoopers'' Security Benchmarking Service evaluates an organization''s
    security program against a global database of approximately 4,500 survey responses
    from technology professionals in 50 countries.'
