  md: '# IBM


    EToys, I was an engineer at CNET Networks, which is composed of a variety of Web
    sites, such as Cnet.com, News.com, Download.com, Shareware.com, Computers.com,
    and others. Each of these site provided different services (such as content distribution,
    advertising, software archives, Web-based applications, and other managed and
    hosted services), CNET was exposed to a wide array of probes and intrusion attacks.
    Through these experiences, I have "cut teeth" on real world attacks on Linux and
    Unix systems. Hopefully, this document will provide some practical advice that
    can help you or your customers from getting a page or phone call at 2 a.m.


    # SANS/FBI Top 20


    As a framework, this paper will use a recently published report from the SANS/FBI
    National Infrastructure Protection Center (NIPC) on the top security vulnerabilities.
    This list is used by many businesses as a guide for which vulnerabilities to protect
    against, and the relative importance of each security threat. This list has proven
    value as it is compiled by well respected security organizations, and moreover,
    many of today''s successful attacks on computer systems via the Internet can be
    traced to exploitation of security flaws. This list is composed of three parts,
    General Vulnerabilities, Windows Vulnerabilities, and Unix Vulnerabilities. For
    the purpose of securing Linux servers in a service provider environment, this
    document will utilize issues from the General and Unix Vulnerability list, the
    Top Windows Vulnerabilities will not be included.


    Top General Vulnerabilities:


    +   1. Default installs of operating systems and applications

    2. Accounts with no passwords or weak passwords

    3. Non-existent or incomplete backups

    4. Large number of open ports

    5. Not filtering packets for correct incoming and outgoing addresses

    6. Non-existent or incomplete logging

    7. Vulnerable CGI programs


    Top UNIX Vulnerabilities:


    +   1. Buffer overflows in RPC services

    2. Sendmail vulnerabilities

    3. BIND weaknesses

    4. R commands

    5. LPD (remote print protocol daemon)

    6. sadmind and mount

    7. Default SNMP strings


    I recommend visiting the SANS/FBI Web site, as it provides detailed descriptions
    of each vulnerability and generic security solutions and resources. This document
    will address each of these as it directly relates to securing Linux servers in
    a service provider environment.'
