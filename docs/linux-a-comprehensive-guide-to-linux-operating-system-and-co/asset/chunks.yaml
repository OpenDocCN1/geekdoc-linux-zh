    The Linux Write permissions are equivalent to the Windows Modify permission. 


    The root user permissions in Linux is equivalent to Full Control permission in
    Windows. 


    ### Using the Command Line to manage File System Permissions


    This section will show you how you can use the Linux command line to manage file
    system permissions and ownerships for a file. 


    The chmod command can be used to change the permissions of files in Linux. chmod
    is short for change mode, since permissions are also referred to as a file or
    directory mode. The syntax of this command is followed by instructions that make
    the changes accordingly. There are two ways of changing permissions in Linux,
    numerically, and symbolically.


