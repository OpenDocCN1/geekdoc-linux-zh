    ## Chapter 5: The Linux Kernel


    An operating system comprises the following modules:


    Bootloader: This is the software module in charge of the boot process of the operating
    system


    Kernel: This is the core module of the operating system that sends instructions
    to the CPU, memory, and other peripheral devices


    Daemons: These are the services that run in the background of the Linux operating
    system


    Networking: These are communication-related services that send and receive information
    between devices


    Shell: This is a module for command-line instructions that are input by the user
    of the Linux system


    Graphical Server: This is the subsystem that displays graphics on your screen


    Desktop Environment: This is the primary point of interaction between a user and
    the system


    Applications: This is software that performs the tasks executed by the user such
    as text editors


    ### Kernel Space and Userspace


    #### Kernel Space


    The kernel is found in an elevated system state and has a protected memory space.
    It also has complete access to the system''s hardware. The system space and memory
    space together is known as the kernel space. The core access to the system services
    and hardware is managed within the kernel space. They are further offered as services
    to the remaining system. 


    #### User Space


    The user space is the region where user applications exist and function. In user
    space, user applications can access a subset of the system''s available resources
    via kernel calls. A user application can be created such as an office software
    or a game by using the kernel''s core services. 


    ### The Linux Kernel


    The Linux kernel was first officially released on September 17, 1991, and since
    then it has defied all odds to become the defining component of the Linux system.


    A kernel can be of three types: monolithic, microkernel, or hybrid. The Linux
    kernel is a monolithic kernel. The Linux line of operating systems, popularly
    known as Linux distributions, have this kernel as their foundation. Unlike the
    microkernel, the monolithic kernel works through the CPU, memory, and IPC and
    comprises device drivers, file management systems, and system server calls. The
    monolithic kernel is the best for communicating with hardware and executing multiple
    threads at the same time. This is why the reaction rate of Linux processes is
    so fast. 


    The Linux kernel has a few drawbacks as well. It requires a huge install and memory
    footprints. It also has security loopholes as it operates in the supervisor mode.
    In comparison, microkernels may be slow to address system calls and the kernel
    and user service operate independently. They are smaller in size as compared to
    the monolithic kernel. A microkernel can be scaled easily but requires more code
    to be written to do so. The Linux kernel is written using C and the Assembly programming
    languages.


    ### Relationship of the Linux Kernel with Hardware


    The kernel makes use of a concept known as interrupts, to control the system''s
    hardware. When hardware wants to use the system resources, it sends an interrupt
    to the CPU, sending an interrupt to the kernel. The kernel is capable of disabling
    interrupts, be it single or multiple, to provide synchronization. The interrupts
    in Linux do not run in context to processes, but in context to interrupts not
    associated with any process.


    What is different in the Linux Kernel as compared to other UNIX kernels?


    There are significant differences between the Linux kernel and other classic UNIX
    kernels. They are as follows:


    Kernel modules can be loaded dynamically in Linux


    The nature of the Linux kernel is preemptive


    Linux supports symmetric multiprocessors


    Linux is open-source and free


    The Linux kernel ignores the standard features of UNIX, as Linux developers feel
    they are poorly developed


    Linux is an object-oriented model with device classes, a userspace device filesystem,
    and events that can be hot-plugged


    The Linux kernel does not differentiate between normal processes and threads


    ### The Linux Kernel Architecture


    #### Components of the Linux Kernel


    A kernel is simply a resource manager. The resources it manages can be a process,
    memory, or hardware device. The kernel manages and distributes resources between
    users and processes competing for the resources. The Linux kernel is located in
    the kernel space, right below the user space where user applications are executed.
    The userspace communicates with the kernel space via a GNI library, enabling the
    system call interface to connect to the kernel space, and allows a transition
    back to the userspace. 


    There are three primary levels of the Linux kernel:


    System Call Interface


    This is the topmost level of the Linux kernel and is responsible for actions like
    read and write.


    Kernel Code


    This level is located below the system call interface. It is common for all server
    architectures supported by Linux and is, therefore, known as architecture-independent
    kernel code.


    Architecture-dependent Code


    This level lies below the architecture-independent code. It forms a level that
    is usually known as the Board Support Package, or BSF in short. This kernel level
    contains the bootloader package responsible for initiating the operating system
    and device drivers into the system memory. 


    The architectural components of the Linux kernel comprise the following:


    System Call Interface


    This thin layer lies between the user space and the kernel, taking input function
    calls from the user and feeding them to the kernel. This interface depends on
    the architecture.


    Process Management


    This mainly exists for process management. A process is referred to as a thread
    in the kernel and represents an individual processor''s virtualization.


    Memory Management


    Memory is managed through pages resulting in efficiency. Linux has functions in
    place to manage memory as well as hardware for virtual and physical mappings.
    Linux also features something known as Swap Space that incorporates hard disk
    space for memory management.


    Virtual File System


    A virtual file system provides interface abstraction for file systems. A user
    can switch between the system call interface and file systems using the kernel''s
    virtual file system.


    Network Stack


    This is a layer that contains all protocols necessary for maintaining a network.


    ––––––––


    Device Drivers


    The Linux kernel has significant source code for device drivers that contain libraries
    for hardware devices attached to the Linux system.


    Architecture-dependent Code


    This code has elements that depend largely on architecture and therefore should
    consider the architecture for proper functioning.


    ### Interfaces


    #### System Calls and Interrupts


    Applications use system calls to pass information to the kernel. Applications
    do this, using libraries that contain specific functions for this task. The libraries
    then instruct the kernel using the system calls to perform the task demanded by
    the application. 


    Interrupts empower the Linux kernel to control the system''s hardware. If hardware
    wants to communicate with the system, it can do so by triggering an interrupt
    on the processor that is ultimately sent as an interrupt to the Linux kernel.


    #### Linux Kernel Interfaces'
