    chmod WhoWhatWhich files|directory


    Who is the user u, group g, other o and a for all


    What is + to add, - to remove, = to set exactly


    Which are r for read, w for write, and x for execute


    The letter is used to specify different groups that you want to change the permission
    for. u is for the user, g is for the group, o is for other, and a is for all.


    It is not necessary to specify a new set of permissions for a file while using
    the symbolic method. You can simply modify the existing permissions by using three
    symbols, +, -, and = to append permissions to an existing set of permissions. 


    The permissions'' actual values are represented using the letters r for read,
    w for write, and x for execute. 


    Let us look at the numerical method next. The syntax for the numeric method looks
    like: 


    chmod ### files|directory


    Every position of the # represents an access level viz. User, group, and other


    # is the sum of read r=4, write w=2, execute x=1


    3 digits are used in this method to set up permissions for files and directories,
    and sometimes 4 when special permissions come into the picture. A single digit''s
    possibilities are between 0-7, showing the combinations we can have to read, write,
    and execute values. 


    If you can understand the relation between the symbolic and numeric mapping, you
    will learn to do the conversions too. The numeric representation uses three digits
    where each digit represents permissions for one of the three groups. If we start
    from left to right, the first bit is for the user, the middle one is for the group,
    and the third one is for others. For each group, a combination of read, write,
    and execute numeric values that can be used are 4, 2, and 1 respectively. 


    The symbolic representation of permissions for a file or directory looks like
    -rwxr-x—-


    If we look at the example, -rwxr-x—-


    The user has read write and execute permissions rwx. Converting this to numeric
    form would give you r4 + w2 +x1 which is a total of 7.


    The group has only read r and execute x permissions. Converting this to numeric
    form would give you r4 + x1 which is a total of 5.


    The permissions for others is -—In numeric terms, the value is 0.


    If we convert this entirely into the numeric form, the value would be 750. 


    ## Chapter 4: Linux Vs. Windows


    MAC and Linux are both Unix type operating systems and therefore, we will not
    be discussing the comparisons between MAC and Linux. Moreover, there are only
    two contenders, Linux and Windows, when it comes to global server architecture.
    Commercially, no business has ever tried using a MAC operating system as a server. 


    Linux is widely regarded as being a better operating system than Windows, and
    we will discuss the advantages of Linux over Windows in this chapter. 


    If you have never used a Linux operating system before, you may already have a
    bias towards Windows. However, in reality, Linux holds a lot of benefits over
    Windows.


    Let us look at the advantages of Linux over Windows one by one:


    ### Open Source Nature


    Purchasing a Windows operating system is like buying a car that you do not have
    complete control over and cannot modify it as per your requirements. In contrast
    to this, Linux is an open-source operating system. This means you have 100% access
    to the source code of the entire operating system. This means that you can make
    any number of tweaks to the operating system and make it work in whatever manner
    you require it to. '
