    Shell 脚本（Shell scripting）是指为 Linux shell 开发的开源计算机编程语言。Shell 脚本无非就是编写一系列将自动执行的
    Linux 命令。Shell 脚本的代码可以短到只有一行，也可以很长，包含重复的命令，这些命令可以存储在单个脚本中，从而减少每次手动输入命令的费力。


    在本章中，我们将尝试教你 Linux 中 shell 脚本的基础知识。我们还将讨论一些 shell 脚本的高级概念。本章旨在讨论 shell 脚本的工作原理，并将作为你进入
    shell 脚本世界的启动器。


    ## 如何在 Linux 中编写 Shell 脚本


    Shell 脚本是用文本编辑器编写的。Linux 系统上有多种文本编辑器可用，如 `vi`、`vim` 和 `nano`。你可以打开任何文本编辑器并开始编写
    shell 脚本或 shell 程序。你需要确保为 shell 脚本创建的文件具有执行权限。然后，你只需要将 shell 脚本文件存放在 Linux shell
    可以访问的位置即可。


    以下是创建 shell 脚本的步骤：


    1. 使用如 `vi` 等文本编辑器创建一个新文件。为脚本文件命名并赋予 `.sh` 扩展名。

    2. 脚本的第一行使用 `#! /bin/sh`。

    3. 编写一些 Linux 命令。

    4. 将文件保存为 `filename.sh`。

    5. 你可以使用命令 `bash filename.sh` 执行该脚本文件。


    `#!` 被称为 shebang 运算符。它将脚本指向解释器所在的位置。因此，当你将 shell 脚本的第一行指定为 `#! /bin/sh` 时，脚本会被指向位于
    `/bin/sh` 的 Bourne shell。


    让我们尝试创建一个小而简单的脚本：


    ```

    #!/bin/sh


    ls

    ```


    你可以将此脚本命名为 `list.sh`。你可以使用以下命令运行此脚本：


    ```

    [student@desktop ~]$ bash list.sh

    Documents Movies Books Pictures

    ```


    如你所见，该脚本仅仅是执行了 `ls` 函数的功能。


    ### 在你的 Shell 脚本中添加注释


    注释在 shell 脚本中的用法与任何编程语言一样。添加注释的语法如下：


    ```bash

    #this is a comment

    ```


    以上面的脚本为例，带有注释的脚本看起来像这样：


    ```bash

    #!/bin/sh


    #this is my first script


    Ls

    ```


    ### Shell 变量


    变量以数字和字符的形式存储数据。同样，shell 变量也存储了 shell 可以访问的信息。


    例如，下面的 shell 脚本创建了一个 shell 变量并打印它：


    ```bash

    variable ="Hello"

    echo $variable

    ```


    让我们来看另一个使用变量的小 shell 脚本：


    ```bash

    #!/bin/sh


    echo "what is your name?"

    read name

    echo "How do you do, $name?"

    read remark

    echo "I am $remark too!"

    ```


    ### 这个脚本是如何运行的？


    当你执行此脚本时，首先会收到问题“what is your name?”。然后你将获得输入名字的选项。如果你输入 `John`，字符串 `John` 将被程序存储在变量
    `name` 中，在下一个问题中，程序将使用它存储的 `John` 为你提供一个新问题“How do you do John”，其中变量 `$name` 被替换为你输入的名字。对这个问题的回答也将被存储在一个新变量
    `remark` 中。因此，如果你回答‘excellent’，程序的下一条语句会将 `$remark` 替换为它，并给你输出输出“I am excellent
    too!”。


    这是一个简单的脚本，你可以开发出更复杂的脚本，包含循环、条件语句和函数。


    ## 第 7 章：Linux 启动过程


    你是否好奇过你的 Windows 或 Linux 系统是如何启动并准备好整个系统供你使用的？在本章中，我们将讨论 Linux 系统的整个启动过程，并解释从你按下电源按钮到出现登录界面和桌面之间发生的一切。


    如果你想精通 Linux 的配置并解决任何有关启动的问题，理解 Linux 的启动过程和启动流程至关重要。本章将带你了解 Linux 的引导和启动过程，主要关注被称为
    `GRUB2` 的引导加载程序以及被称为 `systemd` 的系统初始化 Linux 程序。


    要启动 Linux 系统，你需要一些序列来使其进入就绪状态。这个过程在你按下电源按钮时启动，并在 Linux 内核启动并将控制权移交给 `systemd`
    时结束。在 `systemd` 启动后，启动过程将接管控制权，并在 Linux 系统处于任何用户均可使用的状态时结束。


    Linux 的引导和启动序列易于理解。它包含以下步骤，我们将详细讨论：


    1. BIOS POST

    2. 引导加载程序 (`GRUB2`)

    3. 内核初始化

    4. 初始化 `systemd`


    在本章中，我们将使用 `GRUB2` 和 `systemd` 引导和启动序列，因为大多数 Linux 发行版都使用它们。然而，可能有少数 Linux 发行版仍在使用旧的软件进行引导和启动。


    ### 启动序列


    在 Linux 中启动启动序列有两种方法。第一种方法简单如开启系统，这将触发启动序列。如果系统已经有了普通用户或 root 用户，他们可以使用命令行或 GUI
    重启系统。当你重启系统时，它会首先关闭系统并再次启动引导序列。


    ### BIOS POST


    Linux 启动序列的第一步与 Linux 无关。这一步处理硬件初始化，并适用于各种操作系统。当你按下电脑电源按钮时，通电自检（POST）会被初始化，它是基础输入输出系统（BIOS）的子集。


    `BIOS` 是 IBM 在 1981 年开发第一台计算机时开发的。`POST` 是 `BIOS` 的子集，用于确保所有硬件正常工作。如果通电自检失败，表明系统可能无法使用`BIOS`
    将无法初始化。


    `BIOS` 和 `POST` 检查系统的简单运行，随后调用一个名为 `13H` 的 BIOS 中断。此中断查找任何可启动设备并定位其引导区。当它遇到包含有效引导记录的有效引导区时，将其加载到内存中，并将控制权交给引导区中的代码。


    因此，引导加载程序的第一阶段是引导区。多年来，Linux 发行版使用了三种引导加载程序：`LILO`、`GRUB` 和 `GRUB2`。最新且最流行的引导加载程序是
    `GRUB2`，几乎所有的 Linux 发行版都使用它。


    ### GRUB2


    `GRUB2` 是第二版通用统一引导加载程序。它现在是大多数 Linux 发行版首选的引导加载程序。`GRUB2` 模块让计算机足够智能，能够定位操作系统内核并加载到内存中。


    尽管 Linux 从未正式发布过 `GRUB2` 的任何阶段通知，它包含三个阶段。让我们进一步讨论：


    #### 第一阶段


    正如我们在 `POST` 和 `BIOS` 节中所述，当 POST 结束，`BIOS` 会搜索任何连接的可启动设备，定位其上的主引导记录 (`MBR`)，然后将其加载到
    RAM 中并执行引导记录。


    `GRUB2` 第一阶段的引导代码大小非常小，以至于它可以存放在硬盘上带有分区表的第一个 512 字节扇区。分配给引导代码的最大磁盘空间约为 446 字节。这个
    446 字节的第一阶段文件称为 `boot.img`。分区表不是该文件的一部分。


