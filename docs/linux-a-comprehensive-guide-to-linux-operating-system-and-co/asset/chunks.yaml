- fmt: '

    The root directory is represented as `/` and sits at the top of the Linux file
    system hierarchy. The `/` character represents the root directory and the file
    and directory paths in the Linux system. For example, `var` which is a subdirectory
    of the root directory is denoted as `/var`. Similarly, the `/var` directory has
    another subdirectory called `log` which is denoted as `/var/log`.


    The root directory has standard sub-directories that are responsible for storing
    specific files. For example, the `/boot` subdirectory will have all the required
    files for when the Linux system boots up.


    Let us go through the standard subdirectories under the root directory:


    ### /usr

    The software libraries that are shared among all users are stored in this directory.
    It is further divided into the following important directories:


    - `/usr/bin`: User command files

    - `/usr/sbin`: Commands used in system administration

    - `/usr/local`: Files of software that have been customized locally


    ### /etc

    This directory has all the system configuration files in it.


    ### /var

    Dynamically changing files such as log files, databases, etc. are stored in this
    directory.


    ### /run

    Files that are created during runtime since the last boot are stored in this directory.
    The files will get recreated on the next system boot.


    ### /home

    This is the home directory for all the users on the Linux system. Users can store
    their data and other files inside their respective home directories. One user
    will not have access to another user''s home directory.


    ### /root

    This is the root user''s home directory and no one except the root user may have
    access to it.


    ### /tmp

    Temporary files are stored in this directory. Files in this directory that are
    older than 10 days and have not been accessed, get deleted automatically. There
    is another such directory at `/var/tmp` where files that have not been accessed
    for 30 days, get deleted automatically.


    ### /dev

    This directory has files that reference to hardware devices on the Linux system.


    ### Managing Files and Directories

    When we talk about file management, we refer to the creation, deletion, and modification
    of files on the Linux system. The same set of actions can be performed on directories
    as well.


    Let us go through a set of common commands that you should know to manage files
    and directories in the Linux system:


    | Activity | Single Source | Multiple Source |

    | :--- | :--- | :--- |

    | Copy file | `cp file1 file2` | `cp file1 file2 file3 dir` |

    | Move file | `mv file1 file2` | `mv file1 file2 file3 dir` |

    | Delete file | `rm file1` | `rm -f file1 file2 file3` |

    | Create directory | `mkdir dir` | `mkdir -p par1/par2/dir` |

    | Copy directory | `cp -r dir1 dir2` | `cp -r dir1 dir2 dir3 dir4` |

    | Move directory | `mv dir1 dir2` | `mv dir1 dir2 dir3 dir4` |

    | Delete directory | `rm -r dir1` | `rm -rf dir1 dir2 dir3` |


    Let us now go through these file management commands one by one to see how they
    work:


    #### Directory Creation

    The `mkdir` command can be used to create directories or subdirectories. If the
    directory''s name already exists, or if you have not specified the parent directory
    for your sub-directory properly, you will see errors. If you specify the `mkdir`
    command with the `-p` option, it will create parent directories if they do not
    exist. Therefore, it is important to be careful while using the `-p` command as
    you may create unnecessary directories if you enter incorrect spellings and paths.


    ```

    [student@desktop ~]$ mkdir Drawer

    [student@desktop ~]$ ls

    Drawer

    ```

    As you can see, the command created a new directory called `Drawer` in the student
    user''s home directory.


    ```

    [student@desktop ~]$ mkdir -p Thesis/Chapter1

    [student@desktop ~]$ ls -R

    Thesis thesis_chapter1

    ```


    In the above example with the option `-p`, you will notice that the directory
    `Thesis` and its subdirectory `chapter1` were created at the same time.


    #### Copying Files

    The `cp` command is used to copy files in the Linux system. You can copy one or
    more files, and the syntax also lets you copy one file to another file in the
    same directory, or to a file in a different directory.


    Note: The destination file specified by you should be unique. If you specify an
    existing file, the contents of that file will be overwritten.


    ```

    [student@desktop ~]$ cd Documents

    [student@desktop Documents]$ cp one.txt two.txt

    ```

    The above example demonstrates how the content of `one.txt` is copied to `two.txt`


    ```

    [student@desktop ~]$ cp one.txt Documents/two.txt

    ```

    This example demonstrates how the content of `one.txt` was copied to `two.txt`
    that is located in a different directory.


    ##### Moving Files

    The `mv` command can be used for moving files, along with an additional operation.
    If you are using the `mv` command within the same directory, it will perform a
    rename on the file. However, if you are using the `mv` command for a file and
    specify another directory as the destination, it will move that file to the destination
    directory.


    Note: If the file size is huge, it may take more time to move the file from one
    directory to another.


    ```

    [student@desktop ~]$ ls

    Hello.txt

    [student@desktop ~]$ mv Hello.txt Bye.txt

    [student@desktop ~]$ ls

    Bye.txt

    ```

    In the above example, since the `mv` operation was in the same directory, it just
    renamed the file `Hello.txt` to `Bye.txt`


    ```

    [student@desktop ~]$ ls

    Hello.txt

    [student@desktop ~]$ mv Hello.txt Documents

    [student@desktop ~]$ ls Documents

    Hello.txt

    ```

    In this example, the `mv` command destination was another directory and therefore,
    the file was moved.


    #### Deleting Files

    You can use the `rm` command to delete files and directories. Directories can
    be deleted using `rm -r` which deletes the directory, its subdirectories, and
    all the files in that.


    Note: Unlike Windows, the Linux operating system does not maintain anything like
    a recycle bin where deleted files can be restored. Once deleted using the `rm`
    command, files and directories cannot be restored. They are deleted permanently.


    ```

    [student@desktop ~]$ ls

    File1.txt Directory1

    [student@desktop ~]$ rm file1

    [student@desktop ~]$ ls

    Directory1

    [student@desktop ~]$ rm -r Directory1

    [student@desktop ~]$ ls

    ```

    The above example demonstrates how files and directories can be deleted using
    the `rm` and `rm -r` commands.


    Do note that a command called `rmdir` can be used to delete a directory if there
    are no files or subdirectories in it.


    ## Chapter 3: User/Group Management and File Permissions


    In this chapter, we will learn about the users and groups in Linux. We will discuss
    user management and password policies for the users. By the end of this chapter,
    you will know the role of users and groups in a Linux system, and how the operating
    system interprets them. You will learn to create, modify, lock, and delete users
    and groups that have been created locally.


    ### Users and Groups

    This section will cover users and groups and their association with the operating
    system.


    #### Who is a User?

    Every process or task on the Linux system runs as a user, and every file is under
    the ownership of a specific user. A user can restrict access to a file or directory.
    This means that if a process is running as a user, the files and directories the
    process has access to will also be determined by the user.


    You can use the `id` command to get details about the user that is currently logged
    in to the system. You can also pass another user as an argument to the `id` command
    to get basic details for that specific user.


    You can use the `ls -l` command to get details of the user that is associated
    with a file or directory. The third column for the output of the `ls -l` command
    will give you the user who owns that file or directory.

