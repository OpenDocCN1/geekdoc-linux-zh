    Linux 内核为用户态应用程序提供了许多接口，这些接口具有各种属性并能够执行多项任务。存在两种不同的应用程序编程接口（API），称为内核-用户空间和内核内部。Linux
    API 支持内核-用户空间 API，并允许来自用户空间的应用程序访问内核的系统资源和服务。它由源自 GNU C 库的子程序和系统调用接口组成。


    ## Linux ABI

    ABI 是应用程序二进制接口（Application Binary Interface），指代内核-用户空间 ABI。Linux ABI 可以定义为位于各种程序模块之间的接口。API
    和 ABI 的区别在于，ABI 用于访问外部编译的代码，而 API 是一个管理软件的结构。相对于 Linux 内核，ABI 是由 Linux 发行版定义的。每种架构都需要特定的指令集，例如
    `x86-64`。Linux 产品的用户对 ABI 的使用多于 API。


    ## 系统调用接口

    如前所述，系统调用接口在内核中起着作用。它是所有系统调用的统称和集合。


    ## C 标准库

    内核系统调用是 GNU C 库的一部分。Linux API 是 GNU C 库的一部分，被称为 `Glibc` 的系统调用接口。


    ## 可移植操作系统接口 (POSIX)

    POSIX 是用于维护不同操作系统之间兼容性的标准的统称。它负责声明与命令行 Shell 和实用程序接口绑定的 API。POSIX 为 Linux API
    定义了有用的功能，还为内核定义了额外的功能，例如：


    - Cgroups 子系统

    - 直接渲染管理器（Direct Rendering Manager）的系统调用

    - 一名为 readahead 的功能

    - Getrandom 调用

    - 如 `epoll`、`futex`、`dnotify`、`splice`、`inotify` 和 `fanotify` 等系统调用


    ## 模块化内核

    Linux 内核的早期版本是单体内核，这意味着多个静态部分固定在一个部分中。然而，现代 Linux 内核包含多个模块，根据需要动态地提供给内核。这与单体内核不同，因此被称为模块化内核。模块化内核的优势是代码可以作为模块加载到内核中而无需重启系统。


    ### Linux 可加载内核模块 (LKM)

    可以使用内核源码树以模块的形式向 Linux 内核添加代码。如果可以在内核运行时向内核添加代码将是有益的。模块化代码也被称为可加载内核模块。模块具有特定的任务，分为三类：系统调用、文件系统驱动和设备驱动程序。


    你可以将 Linux 中的可加载内核模块与其他操作系统提供的内核扩展进行比较。可以通过加载可加载内核模块或将其附加到基础内核中来将模块添加到内核。


    与将代码绑定到基础内核相比，可加载内核模块具有以下优势：


    - 你不需要重新构建内核，因此可以节省时间并避免错误

    - 可以使用加载内核模块发现 bug 等系统问题

    - 可加载内核模块节省空间，因为你只需要在需要时加载它们

    - 可加载内核模块的维护和调试速度快


    ### 可加载内核模块的用途

    可加载内核模块有以下用途：


    - **设备驱动程序**：内核使用此模块与系统上的硬件通信。在使用设备之前，需要将设备驱动程序加载到内核。

    - **文件系统驱动程序**：这些驱动程序用于翻译文件系统的内容。

    - **系统调用**：在用户态运行应用程序采用系统调用获取内核的服务。

    - **网络驱动程序**：这些驱动程序翻译网络协议。

    - **可执行解释器**：这些负责加载和管理可执行文件。


    ### 编译 Linux 内核

    与流行观点相反，编译 Linux 内核是一项简单的任务。让我们通过编译 Linux 内核的逐步指南。我们使用 Fedora 13 KDE 发行版作为示例。建议备份你的数据和
    GRUB，以确保在发生意外情况时有备份。


    1. 从 `http://kernel.org/` 下载源码。

    2. 在终端中进入下载目录，并使用以下命令从下载归包中提取源码：

    ```bash

    tar xvjf Linux-2.6.37.tar.bz2

    ```

    3. 使用命令在编译前清除构建区域：

    ```bash

    make mrproper

    ```

    4. 使用类似 `xconfig` 的配置，这将有助于运行任何程序。

    5. 选择你希望内核拥有的功能和模块。

    6. 生成 `.config` 文件，然后进入 `MakeFile`。

    7. 通过运行 `make` 命令执行编译。

    8. 通过运行命令安装模块：

    ```bash

    modules_install

    ```

    9. 将内核和系统映射拷贝到 `/boot` 目录。

    10. 运行 `new-kernel-pkg` 命令为新模块构建依赖列表。


    就是这样。你通过 10 个简单的步骤编译了自定义的 Linux 内核。


    ### 升级内核

    Linux 内核可以轻松地从现有版本升级到新版本，同时保留所有现有版本的配置数据。首先，你需要在内核源码目录中为内核的 `.config` 文件创建备份。这是防止意外情况最坏结果的安全措施。升级
    Linux 内核的步骤如下：


    - 从 `kernel.org` 网站下载 Linux 内核的最新源码。

    - 对旧源码树进行修改以更新到最新版本

    -- 通过添加备份的旧内核文件重新配置新内核

    - 构建新内核

    - 现在你可以安装新构建的内核


    ### 下载内核源码

    Linux 内核开发者理解到并非所有用户都想下载整个源码，因为可能会消耗磁盘空间和带宽。因此，他们还发布了补丁来升级现有的内核。用户只需要知道该补丁是否与现有的内核版本兼容，因为补丁将成功升级特定的内核版本。

