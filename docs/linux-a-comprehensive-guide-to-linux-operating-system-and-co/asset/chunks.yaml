- fmt: "\nThis command will create a group with the specified group name and assign\
    \ default properties to the group. It assigns the next available group ID (GID)\
    \ to the group and stores it in the file at `/etc/login.defs`. You can also use\
    \ the `-g` option with the `groupadd` command to specify a custom GID.\n\n```bash\n\
    student@desktop ~]$ sudo groupadd -g 5001 Bteam\n```\n\nThe `-r` option will create\
    \ a system-specific group and assign it a GID that is reserved for system groups.\n\
    \n```bash\nstudent@desktop ~]$ sudo groupadd -r moderators\n```\n\n### groupmod\n\
    \nThis command is used to modify the properties of an existing group, such as\
    \ changing the groupname. The group name can be changed by using the `-n` option\
    \ with the command and passing a new name as an argument.\n\n```bash\nstudent@desktop\
    \ ~]$ sudo groupmod -n moderators admins\n```\n\nYou can use the `-g` option with\
    \ the command if you want to change the GID of the group.\n\n```bash\nstudent@desktop\
    \ ~]$ sudo groupmod -g 5005 Bteam\n```\n\n### groupdel groupname\n\nThis command\
    \ will delete the group.\n\n```bash\nstudent@desktop ~]$ sudo groupdel Bteam\n\
    ```\n\nUsing the `groupdel` command may not work on a user's primary group.\n\n\
    ### usermod\n\nThis command can be used to modify the group membership of a user.\
    \ This can be achieved as follows by using the syntax `usermod -g groupname username`.\n\
    \n```bash\nstudent@desktop ~]$ sudo usermod -g student\n```\n\nIf you want to\
    \ add a user to a supplementary group, you can use the syntax `usermod -aG groupname\
    \ username`.\n\n```bash\nstudent@desktop ~]$ sudo usermod -aG wheel student\n\
    ```\n\nThe `-aG` option ensures that all modifications are done in append mode.\
    \ Failing to use it will add the user to the specified group and remove them from\
    \ all other groups. \n\n### Linux File System Permissions\n\nFile permissions\
    \ are a Linux system feature through which access to files by a user can be managed\
    \ and controlled. \n\nThere are three types of users to which file permissions\
    \ can be applied. They are as follows:\n\n- user\n- group\n- other\n\nUser permissions\
    \ override group permissions and group permissions override other permissions.\
    \ The types of permissions applied to a file or a directory are as follows:\n\n\
    - read\n- write\n- execute\n\nLet us understand the effects of these permissions\
    \ on files and directories. \n\n| Permission | Effect on Files | Effect on Directories\
    \ |\n| :--- | :--- | :--- |\n| r (read) | Read access to file content | The filenames\
    \ in a directory can be listed. |\n| w (write) | Write access to file content\
    \ | The files in the directory can be created or deleted. |\n| x (execute) | The\
    \ file can be executed as a command | The files in the directory can be accessed\
    \ subject to the permission of the file itself. |\n\nBy default, a user will have\
    \ a read and execute permission to any file so that they can read the file and\
    \ execute it if it is an executable file. If the user only has read access to\
    \ the file, they can only read the file and not modify it. If a user has only\
    \ executed permissions to a file, they will not have access to list the file and\
    \ will need to know the filename beforehand to run and execute an action on it.\n\
    \nSuppose a user has write permissions to a directory. In that case, they can\
    \ delete any file in it, regardless of their permissions over the files in the\
    \ directory. \n\nYou can use the `ls -l` command to list files and directories\
    \ along with the associated ownership and permissions.\n\n```bash\nstudent@desktop\
    \ ~]$ ls -l test\n-rw-rw-r—.  1  student   0  Feb  5  15:45  test\n```\n\nYou\
    \ can use the `ls -l directoryname` command to list a specific directory's contents\
    \ with information about ownership and permission. If you only want to see a listing\
    \ of a directory and its properties without its contents, you can use the `-d`\
    \ option. \n\n```bash\nstudent@desktop ~]$ ls -ld /home\ndrwxr-xr-x.  5  root\
    \    4096  Feb  8  17:45  /home\n```\n\nThe Linux Read permission is equivalent\
    \ to the Windows List Folder Contents permission. \n\nThe Linux Write permissions\
    \ are equivalent to the Windows Modify permission. \n\nThe root user permissions\
    \ in Linux is equivalent to Full Control permission in Windows. \n\n### Using\
    \ the Command Line to manage File System Permissions\n\nThis section will show\
    \ you how you can use the Linux command line to manage file system permissions\
    \ and ownerships for a file. \n\nThe `chmod` command can be used to change the\
    \ permissions of files in Linux. `chmod` is short for change mode, since permissions\
    \ are also referred to as a file or directory mode. The syntax of this command\
    \ is followed by instructions that make the changes accordingly. There are two\
    \ ways of changing permissions in Linux, numerically, and symbolically.\n\nLet\
    \ us look at the symbolic method first. The syntax looks like this: \n\n`chmod\
    \ WhoWhatWhich files|directory`\n\n- Who is the user `u`, group `g`, other `o`\
    \ and `a` for all\n- What is `+` to add, `-` to remove, `=` to set exactly\n-\
    \ Which are `r` for read, `w` for write, and `x` for execute\n\n- The letter is\
    \ used to specify different groups that you want to change the permission for.\
    \ `u` is for the user, `g` is for the group, `o` is for other, and `a` is for\
    \ all.\n\nIt is not necessary to specify a new set of permissions for a file while\
    \ using the symbolic method. You can simply modify the existing permissions by\
    \ using three symbols, `+`, `-`, and `=` to append permissions to an existing\
    \ set of permissions. \n\nThe permissions' actual values are represented using\
    \ the letters `r` for read, `w` for write, and `x` for execute. \n\nLet us look\
    \ at the numerical method next. The syntax for the numeric method looks like:\
    \ \n\n`chmod ### files|directory`\n\n- Every position of the `#` represents an\
    \ access level viz. User, group, and other\n- `#` is the sum of read `r=4`, write\
    \ `w=2`, execute `x=1`\n- 3 digits are used in this method to set up permissions\
    \ for files and directories, and sometimes 4 when special permissions come into\
    \ the picture. A single digit's possibilities are between 0-7, showing the combinations\
    \ we can have to read, write, and execute values. \n\nIf you can understand the\
    \ relation between the symbolic and numeric mapping, you will learn to do the\
    \ conversions too. The numeric representation uses three digits where each digit\
    \ represents permissions for one of the three groups. If we start from left to\
    \ right, the first bit is for the user, the middle one is for the group, and the\
    \ third one is for others. For each group, a combination of read, write, and execute\
    \ numeric values that can be used are 4, 2, and 1 respectively. \n\nThe symbolic\
    \ representation of permissions for a file or directory looks like `-rwxr-x—-`.\n\
    \nIf we look at the example, `-rwxr-x—-`:\n\n- The user has read write and execute\
    \ permissions `rwx`. Converting this to numeric form would give you `r4 + w2 +x1`\
    \ which is a total of 7.\n- The group has only read `r` and execute `x` permissions.\
    \ Converting this to numeric form would give you `r4 + x1` which is a total of\
    \ 5.\n- The permissions for others is `-—`In numeric terms, the value is 0.\n\n\
    If we convert this entirely into the numeric form, the value would be 750. \n\n\
    ## Chapter 4: Linux Vs. Windows\n\nMAC and Linux are both Unix type operating\
    \ systems and therefore, we will not be discussing the comparisons between MAC\
    \ and Linux. Moreover, there are only two contenders, Linux and Windows, when\
    \ it comes to global server architecture. Commercially, no business has ever tried\
    \ using a MAC operating system as a server. \n\nLinux is widely regarded as being\
    \ a better operating system than Windows, and we will discuss the advantages of\
    \ Linux over Windows in this chapter. \n\nIf you have never used a Linux operating\
    \ system before, you may already have a bias towards Windows. However, in reality,\
    \ Linux holds a lot of benefits over Windows.\n\nLet us look at the advantages\
    \ of Linux over Windows one by one:\n\n### Open Source Nature\n\nPurchasing a\
    \ Windows operating system is like buying a car that you do not have complete\
    \ control over and cannot modify it as per your requirements. In contrast to this,\
    \ Linux is an open-source operating system. This means you have 100% access to\
    \ the source code of the entire operating system. This means that you can make\
    \ any number of tweaks to the operating system and make it work in whatever manner\
    \ you require it to.\n"
