    \n命令行提示符的语法最初可能很难理解。一旦习惯了以下约定，理解命令语法将变得更容易：\n\n- 选项在方括号 `[]` 中\n- 如果在命令后跟随 `...`，它表示该类型项的任意长度列表\n\
