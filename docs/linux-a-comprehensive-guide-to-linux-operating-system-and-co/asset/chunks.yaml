    此命令将创建一个指定组名称的组并为该组分配默认属性。它会将下一个可组 ID (GID) 分配给该组，并将其存储在 `/etc/login.defs` 文件中。你也可以在使用
    `groupadd` 命令时使用 `-g` 选项指定自定义 GID。


    ```bash

    student@desktop ~]$ sudo groupadd -g 5001 Bteam

    ```


    `-r` 选项将创建一个系统特定的组，并为其分配一个为系统组保留的 GID。


    ```bash

    student@desktop ~]$ sudo groupadd -r moderators

    ```


    ### groupmod


    此命令用于修改现有组的属性，例如更改组名。可以通过在使用命令中使用 `-n` 选项并传递新名称作为参数来更改组。


    ```bash

    student@desktop ~]$ sudo groupmod -n moderators admins

    ```


    如果你想更改组的 GID，可以使用该命令的 `-g` 选项。


    ```bash

    student@desktop ~]$ sudo groupmod -g 5005 Bteam

    ```


    ### groupdel groupname


    此命令将删除该组。


    ```bash

    student@desktop ~]$ sudo groupdel Bteam

    ```


    使用 `groupdel` 命令可能无法对用户的主组生效。


    ### usermod


    此命令可用于修改用户的组组成部分。可以通过使用 `usermod -g groupname username` 语法来实现此目标。


    ```bash

    student@desktop ~]$ sudo usermod -g student

    ```


    如果你想将用户添加到附加组，可以使用 `usermod -aG groupname username` 语法。


    ```bash

    student@desktop ~]$ sudo usermod -aG wheel student

    ```


    `-aG` 选项确保所有修改都以追加模式进行。如果不使用该选项，将把用户添加到指定的组，并将其从所有其他组中移除。


    ### Linux 文件系统权限


    文件权限是 Linux 系统的一项功能，可以通过它来管理和控制用户对文件的访问。


    文件权限可以应用于三类用户。它们如下：


    - 用户 (user)

    - 组 (group)

    - 其他 (other)


    用户权限优于组权限，而组权限优于其他权限。应用于文件或目录的权限类型如下所示：


    - 读取 (read)

    - 写入 (write)

    - 执行 (execute)


    让我们了解这些权限对文件和目录的影响。


    | 权限 | 对文件的影响 | 对目录的影响 |

    | :--- | :--- | :--- |

    | r (read) | 读取文件内容的权限 | 可以列出目录中的文件名。 |

    | w (write) | 写入文件内容的权限 | 可以在目录中创建或删除文件。 |

    | x (execute) | 文件可以作为命令执行 | 根据文件本身的权限访问目录中的文件。 |


    默认情况下，用户对任何文件都具有读取和执行权限，以便他们可以读取该文件并在它是可执行文件时执行它。如果用户仅对文件具有读取权限，他们只能读取文件而不能修改它。如果用户对某个文件只有执行权限，他们将无法列出文件，并且需要预知道文件名才能对其运行并执行操作。


    假设用户对某个目录具有写入权限。在这种情况下，他们可以删除目录中的任何文件，无论他们对目录中文件的权限如何。


    你可以使用 `ls -l` 命令列出文件和目录以及相关的所有权和权限。


    ```bash

    student@desktop ~]$ ls -l test

    -rw-rw-r—.  1  student   0  Feb  5  15:45  test

    ```


    你可以使用 `ls -l directoryname` 命令列出特定目录的内容，以及关于所有权和权限的信息。如果你只想查看目录及其属性而不查看其内容，可以使用
    `-d` 选项。


    ```bash

    student@desktop ~]$ ls -ld /home

    drwxr-xr-x.  5  root    4096  Feb  8  17:45  /home

    ```


    Linux 的读取权限等于 Windows 的“列出文件夹内容”权限。


    Linux 的写入权限等于 Windows 的“修改”权限。


    Linux 中的 root 用户权限等于 Windows 中的“完全控制”权限。


    ### 使用命令行管理文件系统权限


    本节将向你展示如何使用 Linux 命令行管理文件的文件系统权限和所有权。


    `chmod` 命令用于更改 Linux 中文件的权限。`chmod` 是 change mode（更改模式）的缩写，因为权限也被称为文件或目录模式。该命令的语法后跟着相应相应更改的指令。在
    Linux 中更改权限有两种方法：数字法和符号法。


    让我们先看看符号法。语法看起来如下：


    `chmod WhoWhatWhich files|directory`


    - Who（对象）是用户 `u`、组 `g`、其他 `o` 以及代表所有的 `a`

    - What（操作）是 `+` 添加、`-` 移除、`=`精确设置

    - Which（权限）是 `r` 用于读取、`w` 用于写入、`x` 用于执行


    - 字母用于指定你想要更改权限的不同组。`u` 代表用户，`g` 代表组，`o` 代表其他，`a` 代表所有。


    没有必要为文件指定一组新的权限。在使用符号法时，可以使用 `+`、`-` 和 `=` 来修改现有权限。


    权限值是 `r` 用于读取、`w` 用于写入、`x` 用于执行。


    让我们看看数字法。

