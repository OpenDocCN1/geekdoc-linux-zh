    everything is enabled by default. Microsoft will also still collect data from
    your system even after you opt-out from sending data to them. Microsoft will not
    admit that they collect data in a press release, but they are collecting data.
    You need third-party tools to disable the inbuilt spyware that comes with Windows. 


    If you are concerned about privacy, Linux will be the perfect operating system
    for you yet again. Linux systems do not collect a lot of data and you will not
