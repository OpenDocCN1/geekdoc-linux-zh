    \ as if CRs were not there (MSDOS/Windows)\n\n`'egrep'` means `'grep -E'`. `'fgrep'`\
    \ means `'grep -F'`.\n\nDirect invocation as either `'egrep'` or `'fgrep'` is\
    \ deprecated.\n\nWhen `FILE` is `-`, read standard input. With no `FILE`, read\
