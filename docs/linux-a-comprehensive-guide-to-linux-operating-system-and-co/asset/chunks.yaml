    Linux 能够在给定的时间内处理多一个任务。例如，假设你执行了一个对巨大列表进行排序的任务，同时，你正在记事本中输入内容。这些是两个同时进行的任务，Linux
    会通过实施调度策略来高效地共享 CPU 时间，使得在你打字时，CPU 会分配给你的记事本。当你停止打字时，它将会被分配给你正在执行的排序任务。


    ## 可移植性

    让 Linux 在大众中极受欢迎的特性是可移植性。然而，可移植性并不意味着 Linux 的体积比其他操作系统小并且可以放在光盘或 USB 驱动器上携带。Linux
    的可移植性是指操作系统在各种硬件系统中以类似方式运行的能力。


    ## 安全性

    对于使用系统进行日常工作的用户或组织来说，安全性是任何操作系统至关重要的方面。Linux 提供了若干规定来保护用户免受未经授权的系统和数据访问。


    Linux 安全三个主要概念如下：


    ### 身份验证

    这指的是在 Linux 操作系统上创建用户及其关联密码。除非在 Linux 操作系统上为其创建用户和密码，否则无法访问 Linux 系统。


    ### 授权

    Linux 系统在文件和目录级别为用户设置了授权限制。这些涉及读、写和执行等权限。根据文件或目录的权限，特定用户可以读取它、对其进行更改，或者如果文件是可执行的则执行它。


    ### 加密

    Linux 允许将操作系统上的所有文件编码为一种称为密文的可读格式。这确保了即使有人成功进入你的系统，也无法读取你在 Linux 系统硬盘上的数据。


    ## 通信

    Linux 有非常出通信安排。同一系统中的用户可以相互通信。此外，连接到网络的不同系统的用户也可以相互通信。数据、邮件甚至程序都可以在网络用户之间交换。


    ## 第 2 章：Linux 命令行

    本章将介绍 Linux 命令行以及如何使用它在 Linux 操作系统上执行不同类型的任务。完成本章后，你将了解用于管理 Linux 系统文件和文件夹的 Linux
    命令行基础命令。


    ### Bash Shell

    Bash 是 Bourne-Again Shell（再次 Bourne Shell）的缩写。Linux 操作系统的工具帮助你通过 Linux 命令与系统交互。当我们谈论命令行工具时，我们指的是允许你以文本模式向计算机及其操作系统提供指令的接口。如今各种基于
    Linux 的操作系统中都有多种 shell 接口，但最流行的是 bash shell。它是之前使用的名为 Bourne Shell 的 Linux shell
    的演进版本。


    bash shell 会向你显示一个表示它正在等待用户输入的字符串。显示的字符串被称为 shell 提示符。如果你是 root 用户，shell 提示符将以
    `#` 符号结尾。对于非 root 用户，它以 `$` 结尾。


    ```

    [root@desktop ~]#

    [student@desktop ~]$

    ```


    为了便于理解，Linux 操作系统的 `bash` shell 就像 Windows 操作系统中提供的命令提示符工具一样。但 `bash` shell 中提供的脚本语言与
    Windows 命令提示符中的脚本语言相比要优得多。我们也可以将 `bash` shell 与 Windows 7 中引入并在后续版本中持续使用的 `PowerShell`
    工具进行比较。许多专业人士赞誉 `bash` shell 是一个系统管理的强大工具。`bash` shell 提供的脚本语言可以自动化 Linux 操作系统中的许多任务。此外，`bash`
    shell 还允许你执行某些通过图形用户界面无法实现的复杂任务。


    你可以使用名为 `terminal`（终端）的工具访问 `bash` shell。键盘作为 `terminal` 的输入，显示器显示你的命令的输出。也可以使用
    Linux 系统中的虚拟控制台访问 `bash` shell。这让你可以在基础物理控制台上拥有多个虚拟控制台，每个虚拟控制台都作为一个独立的终端。可以使用许多虚拟控制台创建多个用户的登录会话。


    ### Shell 基础

    你在 shell 提示符上输入的命令由三部分组成：


    1. 你想要运行的命令

    2. 定义命令行为的选项（Options）

    3. 命令的目标的参数（Arguments）


    命令是你想要执行的程序的定义。你可以在命令后跟上选项，也可以完全不加选项。选项控制命令的行为并定义了命令将如何工作。选项使用单横线或双横线指定。添加横线是为了将选项与参数区分开。


    示例：`-a` 或 `--all`


    参数也跟在命令提示符的命令后面，和选项一样，可以是一个或多个。参数是命令执行的目标。


    让我们来看一个基础命令：


    ```

    usermod -L John

    ```


    示例中的命令是 `usermod`。选项是 `-L`。参数是 `John`。此命令将锁定系统上用户 John 的密码。


    你需要知道哪些选项可以与哪些命令结合使用，以便有效使用命令行。你可以在任何命令后运行 `--help` 来获取与特定命令可用的选项列表。因此，你不需要背诵每个给定命令对应的每个选项，列表会告诉你每个选项的作用。


    让我们看看当你查询 `grep` 命令的帮助时会发生什么。`grep` 命令用于在文件中扫描字符串。如果文件包含该字符串，输出将显示所有包含它的的行。


    ```

    [student@desktop ~]$ grep --help


    Usage: grep [OPTION]... PATTERN [FILE]...


    在每个 FILE 或标准输入中搜索 PATTERN。


    默认情况下，PATTERN 是一个基础正则表达式 (BRE)。


    Example: grep -i ''hello world'' menu.h


    Regexp selection and interpretation（正则表达式选择与解释）:

    -E,--extended-regexp PATTERN 是一个扩展正则表达式 (ERE)

    -F,--fixed-strings PATTERN 是一组用换行符分隔的固定字符串

    -G,--basic-regexp PATTERN 是一个基础正则表达式 (BRE)

    -P,--perl-regexp PATTERN 是一个 Perl 正则表达式

    -e,--regexp=PATTERN 使用 PATTERN 进行匹配

    -f,--file=FILE 从 FILE 获取 PATTERN

    -i,--ignore-case 忽略大小写

    -w,--word-regexp 强制 PATTERN 仅匹配整个单词

    -x,--line-regexp 强制 PATTERN 仅匹配整行

    -z,--null-data 数据行以 0 字节而非换行符结束


    Miscellaneous（杂项）:

    -s,--no-messages 抑制错误消息

    -v,--invert-match 选择不匹配的行

    -V,--version 显示版本信息并退出

    --help 显示此帮助文本并退出


    Output control（输出控制）:

    -m,--max-count=NUM 在匹配 NUM 次后停止

    -b,--byte-offset 在输出行中打印字节偏移量

    -n,--line-number 在输出行中打印号

    --line-buffered 每行刷新输出

    -H,--with-filename 为每个匹配打印文件名

    -h,--no-filename 抑制输出上的文件名前缀

    --label=LABEL 使用 LABEL 作为标准输入文件名的前缀

    -o,--only-matching 仅显示行中匹配 PATTERN 的部分

    -q,--quiet,--silent 抑制所有正常输出

    ```

