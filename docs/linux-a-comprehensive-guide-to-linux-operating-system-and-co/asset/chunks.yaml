    \ given, assume `-h`.\n\nExit status is 0 if any line is selected, 1 otherwise;\
    \ if any error occurs and `-q` is not given, the exit status is 2.\n\nReport bugs\
    \ to: `bug-grep@gnu.org`\n\nGNU Grep home page: `<http://www.gnu.org/software/grep/>`\n\
    \nGeneral help using GNU software: `<http://www.gnu.org/gethelp/>`\n\nThe syntax\
    \ of the command prompt can be difficult to understand initially. Once you get\
    \ used to the following conventions, understanding the command syntax will get\
    \ easier:\n\n- Options are wrapped in square brackets `[]`\n- If you follow a\
    \ command with `...` it indicates the arbitrary length list of the items belonging\
    \ to that type\n- If there are multiple items separated by a pipe `|` it means\
    \ that you can specify only one of them\n- Angle brackets `<>` are used to specify\
    \ variables. So, if you see `<filename>`, you should know that you have to replace\
    \ it with the filename of your requirement\n\nLet us look at an example:\n\n```bash\n\
    [student@desktop ~]$ date--help\ndate [OPTION]... [+FORMAT]\n```\n\nThis indicates\
    \ that the command is `date` and it takes the options represented by `[OPTION]`.\
    \ It also takes another option `[FORMAT]` prefixed with a `+` sign. \n\n### Executing\
    \ Commands on the Bash Shell\n\nThe bash shell's main function is to interpret\
    \ commands input by the user on the command prompt, and then to convert them to\
    \ instructions for the Linux system. We have already learned the string's syntax\
    \ that you enter on the command prompt is divided into three parts - command,\
    \ options, and arguments. You have to use a blank space to separate each word\
    \ that you enter on the command prompt. The command that you type already has\
    \ a program defined for it in the Linux system, and then there are options and\
    \ arguments to customize the command.\n\nLet us go through some common commands\
    \ that are used in a Linux operating system daily:\n\nThe `date` command displays\
    \ the current date and time of your Linux system. This command can also be used\
    \ if you want to set a new date and time. You can pass an argument with the `+`\
    \ sign for the date command if you want the command's output to be shown in a\
    \ particular format.\n\n```bash\n[student@desktop ~]$ date\nSat Aug 5 08:15:30\
    \ GMT 2019\n[student@desktop ~]$ date +%R\n08:15\n[student@desktop ~]$ date +%x\n\
    08/05/2019\n```\n\nThe `passwd` command is used to change the password of a system\
    \ user. This command requires you to enter the current password of the user to\
    \ set a new password. The Linux system demands a strong password that will comprise\
    \ letters in uppercase and lowercase, symbols, and numbers. Additionally, the\
    \ password that is being set cannot be a dictionary word. A regular user can use\
    \ the command `passwd` to change their password only. The root user has the power\
    \ to change the password for any user on the Linux system. \n\n```bash\n[student@desktop\
    \ ~]$ passwd\nChanging password for user student.\nChanging password for student.\n\
    (current) UNIX password: type old password here\nNew password: Specify new password\
    \ here\nRetype new password: Type new password again\npasswd: all authentication\
    \ tokens updated successfully.\n```\n\nUnlike Windows, there are no file formats\
    \ or file extensions specified in the Linux file system. However, you can use\
    \ the `file` command to find out the format of any file. You need to pass the\
    \ file as an argument to the `file` command.\n\n```bash\n[student@desktop ~]$\
    \ file /etc/passwd\n/etc/passwd: ASCII text\n```\n\nIf you pass a folder/directory\
    \ as an argument to the `file` command, the output will tell you that it is a\
    \ directory. \n\n```bash\n[student@desktop ~]$ file /home\n/home: directory\n\
    ```\n\nThe commands `head` and `tail` help you print the first ten lines or the\
    \ last ten lines of a file. Both these commands also support the option `-n` that\
    \ can be used to specify the custom number of lines you want to display. \n\n\
    ```bash\n[student@desktop ~]$ head /etc/passwd\nThis will print the first 10 lines\
    \ of the passwd file. \n[student@desktop ~]$ tail -n4 /etc/passwd\nThis will print\
    \ the last 4 lines of the passwd file. \n```\n\nThe `wc` command, when passed\
    \ with a file as an argument, will count the number of words, lines, and characters\
    \ in that file. It supports the options `-l`, `-w`, `-c` which stand for lines,\
    \ words, and characters respectively. \n\n```bash\n[student@desktop ~]$ wc /etc/passwd\n\
    30   75   2009 /etc/passwd\n```\n\nThis indicates that the passwd file has 30\
    \ lines, 75 words, and 2009 characters. \n\nAs seen, if you used the `wc` command\
    \ without any option, it shows the output for all three options. If you want the\
    \ output only for a particular option, you can pass that specific option with\
    \ the `wc` command.\n\nThe `history` command will display all the commands you\
    \ have used previously, and a number for the command. If you used the `!` symbol\
    \ with the command number, you will see the entire command typed along with the\
    \ output printed for it. \n\n```bash\n[student@desktop ~]$ history\n1 clear\n\
    2 who\n3 pwd\n[student@desktop ~]$ !3\n/home/student\n```\n\nAs you can see, the\
    \ `!3` expands to the `pwd` command that was typed by the user that gave the output\
    \ for the user's present working directory as `/home/student`. \n\n### File Management\
    \ Using Command Line\n\nIn this section, we will learn commands in the Linux system\
    \ that you can use to manage files and directories. You will learn commands that\
    \ will let you move, copy, create, delete, and organize files and directories.\
    \ \n\n#### Linux File System Hierarchy\n\nLet us understand the file system hierarchy\
    \ in a Linux operating system. The Linux file system is a tree that starts from\
    \ the root and branches downwards to form the other parts of the file system hierarchy.\
    \ This is an inverted tree as it branches downwards to directories and subdirectories\
    \ that extend from the root directory.\n"
  raw: '—binary-files=TYPE  assume that binary files are TYPE;


    TYPE is ''binary'', ''text'', or ''without-match''


    -a,—text  equivalent to—binary-files=text


    -I  equivalent to—binary-files=without-match


    -d,—directories=ACTION how to handle directories;


    ACTION is ''read'', ''recurse'', or ''skip''


    -D,—devices=ACTION  how to handle devices, FIFOs and sockets;


    ACTION is ''read'' or ''skip''


    -r,—recursive   like—directories=recurse


    -R,—dereference-recursive


    likewise, but follow all symlinks


    —include=FILE_PATTERN


    search only files that match FILE_PATTERN


    —exclude=FILE_PATTERN


    skip files and directories matching FILE_PATTERN


    —exclude-from=FILE  skip files matching any file pattern from FILE


    —exclude-dir=PATTERN directories that match PATTERN will be skipped.


    -L,—files-without-match print only names of FILEs containing no match


    -l,—files-with-matches print only names of FILEs containing matches


    -c,—count   print only a count of matching lines per FILE


    -T,—initial-tab   make tabs line up (if needed)


    -Z,—null  print 0 byte after FILE name


    Context control:


    -B,—before-context=NUM print NUM lines of leading context


    -A,—after-context=NUM  print NUM lines of trailing context


    -C,—context=NUM    print NUM lines of output context


    -NUM    same as—context=NUM


    —group-separator=SEP use SEP as a group separator


    —no-group-separator use empty string as a group separator


    —color[=WHEN],


    —colour[=WHEN]   use markers to highlight the matching strings;


    WHEN is ''always'', ''never'', or ''auto''


    -U,—binary  do not strip CR characters at EOL (MSDOS/Windows)


    -u,—unix-byte-offsets  report offsets as if CRs were not there


    (MSDOS/Windows)


    ''egrep'' means ''grep -E''. ''fgrep'' means ''grep -F''.


    Direct invocation as either ''egrep'' or ''fgrep'' is deprecated.


    When FILE is -, read standard input. With no FILE, read . if a command-line


    -r is given, - otherwise. If fewer than two FILEs are given, assume -h.


    Exit status is 0 if any line is selected, 1 otherwise;


    if any error occurs and -q is not given, the exit status is 2.


    Report bugs to: bug-grep@gnu.org


    GNU Grep home page: <http://www.gnu.org/software/grep/>


    General help using GNU software: <http://www.gnu.org/gethelp/>


    The syntax of the command prompt can be difficult to understand initially. Once
    you get used to the following conventions, understanding the command syntax will
    get easier:


    Options are wrapped in square brackets []


    If you follow a command with ... it indicates the arbitrary length list of the
    items belonging to that type


    If there are multiple items separated by a pipe | it means that you can specify
    only one of them


    Angle brackets <> are used to specify variables. So, if you see <filename>, you
    should know that you have to replace it with the filename of your requirement


    Let us look at an example:


    [student@desktop ~]$ date—help


    date [OPTION]... [+FORMAT]


    This indicates that the command is date and it takes the options represented by
    [OPTION]. It also takes another option [FORMAT] prefixed with a + sign. 


    ### Executing Commands on the Bash Shell


    The bash shell''s main function is to interpret commands input by the user on
    the command prompt, and then to convert them to instructions for the Linux system.
    We have already learned the string''s syntax that you enter on the command prompt
    is divided into three parts - command, options, and arguments. You have to use
    a blank space to separate each word that you enter on the command prompt. The
    command that you type already has a program defined for it in the Linux system,
    and then there are options and arguments to customize the command. 


    Let us go through some common commands that are used in a Linux operating system
    daily:


    The date command displays the current date and time of your Linux system. This
    command can also be used if you want to set a new date and time. You can pass
    an argument with the + sign for the date command if you want the command''s output
    to be shown in a particular format. 


    [student@desktop ~]$ date


    Sat Aug 5 08:15:30 GMT 2019


    [student@desktop ~]$ date +%R


    08:15


    [student@desktop ~]$ date +%x


    08/05/2019


    The passwd command is used to change the password of a system user. This command
    requires you to enter the current password of the user to set a new password.
    The Linux system demands a strong password that will comprise letters in uppercase
    and lowercase, symbols, and numbers. Additionally, the password that is being
    set cannot be a dictionary word. A regular user can use the command to change
    their password only. The root user has the power to change the password for any
    user on the Linux system. 


    [student@desktop ~]$ passwd


    Changing password for user student.


    Changing password for student.


    (current) UNIX password: type old password here


    New password: Specify new password here


    Retype new password: Type new password again


    passwd: all authentication tokens updated successfully.


    Unlike Windows, there are no file formats or file extensions specified in the
    Linux file system. However, you can use the file command to find out the format
    of any file. You need to pass the file as an argument to the file command. 


    [student@desktop ~]$ file /etc/passwd


    /etc/passwd: ASCII text


    If you pass a folder/directory as an argument to the file command, the output
    will tell you that it is a directory. 


    [student@desktop ~]$ file /home


    /home: directory


    The commands head and tail help you print the first ten lines or the last ten
    lines of a file. Both these commands also support the option -n that can be used
    to specify the custom number of lines you want to display. 


    [student@desktop ~]$ head /etc/passwd


    This will print the first 10 lines of the passwd file. 


    [student@desktop ~]$ tail - n4 /etc/passwd


    This will print the last 4 lines of the passwd file. 


    The wc command, when passed with a file as an argument, will count the number
    of words, lines, and characters in that file. It supports the options -l, -w,
    -c which stand for lines, words, and characters respectively. 


    [student@desktop ~]$ wc /etc/passwd


    30   75   2009 /etc/passwd


    This indicates that the passwd file has 30 lines, 75 words, and 2009 characters. 


    As seen, if you used the wc command without any option, it shows the output for
    all three options. If you want the output only for a particular option, you can
    pass that specific option with the wc command. 


    The history command will display all the commands you have used previously, and
    a number for the command. If you used the ! symbol with the command number, you
    will see the entire command typed along with the output printed for it. 


    [student@desktop ~]$ history


    1 clear


    2 who


    3 pwd


    [student@desktop ~]$ !3


    /home/student


    As you can see, the !3 expands to the pwd command that was typed by the user that
    gave the output for the user''s present working directory as /home/student. 


    You can navigate through the output given by the history command using the arrow
    keys on the keyboard. The commands on top can be accessed using the up arrow key,
    and the commands below can be accessed using the down arrow key. The left and
    right arrow keys can be used to edit the command that you are currently on. 


    ### File Management Using Command Line


    In this section, we will learn commands in the Linux system that you can use to
    manage files and directories. You will learn commands that will let you move,
    copy, create, delete, and organize files and directories. 


    #### Linux File System Hierarchy


    Let us understand the file system hierarchy in a Linux operating system. The Linux
    file system is a tree that starts from the root and branches downwards to form
    the other parts of the file system hierarchy. This is an inverted tree as it branches
    downwards to directories and subdirectories that extend from the root directory. '
