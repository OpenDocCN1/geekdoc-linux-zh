    由于引导记录非常微小，它不包含任何关于文件系统结构的信息。因此，在第一阶段，`GRUB2` 引导加载程序仅用于定位下一个阶段的内容。`GRUB2` 引导加载程序的
    `stage 1.5` 位于引导记录和可启动驱动的主分区之间。在将 `GRUB2` 的 `stage 1.5` 加载到内存后，由 `stage 1.5` 接管控制权。


    # Stage 1.5


    如前所述，`stage 1.5` 必须位于引导记录和可启动设备的主分区之间。出于技术原因，磁盘的这部分多年一直处于闲置状态。从扇区 `63` 处开始进行分区。主引导记录（MBR）从扇区
    `0` 开始。这意味着中间有 62 个扇区（每个扇区 512 字节），或者简单说是 31,744 字节，这里可以存储包含 `GRUB2` `stage 1.5`
    的 `core.img` 文件。`core.img` 文件的大小为 25,389 字节，显然在主引导记录扇区之后有足够的空间存储它。


    由于有足够的空间容纳许多关于 `stage 1.5` 的代码，还有空间存放额外的代码以支持 `EXT`、`NTFS` 和 `FAT` 等文件系统驱动程序。这意味着
    `GRUB2 stage 2` 代码也可以保存在标准的 `EXT` 文件系统中。`GRUB2` `stage 2` 的默认位置位于 `/boot/grub2`。


    # Stage 2


    `Grub2` `stage 2` 的所有必要文件都位于 `/boot/grub2` 及其子目录下。`GRUB2` 并没有像 `stage 1` 和 `stage
    2` 那样的镜像文件。相反，它拥有内核，这些内核会在需要时从 `/boot/grub2/i386-pc` 目录中加载。


    `GRUB2` `stage 2` 的目的是检测 Linux 内核并将其加载到内存中，从而赋予内核完全控制权。Linux 内核文件存储在 `/boot` 目录中。这些文件很容易识别，因为它们都以
    `vmlinuz` 开头。`/boot` 目录的内容将为你提供当前 Linux 系统上已安装的所有内核列表。


    你将在 `GRUB2` `stage 2` 中获得系统中安装的内核列表，选择其中一个内核将把引导过程的控制权交给相应的内核。


    ## Kernel


    如今所有的内核都以压缩格式提供，但也会自我解压。如所述，内核可以在 `/boot` 目录中找到。当你选择一个内核时，它会被加载到内存中，开始执行并应该自我解压变为可用的格式。当内核被解压时，它将调用
    `systemd`，控制权从内核传递给 `systemd`。


    这是引导过程结束的地方。在这一时刻，引导加载程序和 `systemd` 都在运行，但由于没有其他应用程序运行，它们对系统用户来说是没用的。


    ## The Startup Sequence


    引导序列结束后，将启动启动序列，最终将 Linux 系统带到终端用户可以执行生产性任务的状态。


    ## Systemd


    Linux 系统的基础进程是 `systemd`，负责启动 Linux 系统并将其带到用户可以使用的状态。在 `systemd` 之前，Linux 系统使用一种名为
    `init` 的服务。与 `init` 相比，`systemd` 的功能非常广泛，因为它们可以处理 Linux 系统的无数领域，例如挂载文件系统、启动和管理与系统进程相关的服务等。


    首先，`systemd` 将挂载 `/etc/fstab` 配置文件中定义的所有文件系统。它还可以访问 `/etc` 下所有的配置文件。


    读取位于 `/etc/systemd/system/default.target` 的配置文件，以确定系统应该启动到哪种目标或状态。对于个人桌面，这通常是
    `graphical.target`。对于作为服务器的 Linux 系统，默认目标通常是 `multi-user.target`。


    服务和目标（targets）是 `systemd` 服务的单元。每个目标都有在其配置文件中定义的依赖项。`systemd` 还会启动目标的依赖项。这些依赖项意味着根据所启动的目标运行
    Linux 系统时所需的的服务。当目标的依赖项被加载且系统启动运行时，我们可以说 Linux 系统正在以该目标模式下运行。


    启动过程的检查点是两个目标：`sysinit.target`，然后是 `basic.target`。尽管已知 `systemd` 会同时启动服务，但某些服务需要在所有其他和服务目标初始化之前启动。在启动特定检查点所需的所有目标和服务启动之前，系统无法通过该检查点。


    `sysinit.target` 将在其所有依赖项初始化后启动。关于 `sysinit.target` 的依赖项有多个任务，这些任务在 `sysinit.target`
    内部并行执行。


    `sysinit.target` 将初始化所有对于进入 `basic.target` 至关的小型服务。`basic` 目标具有一些额外的函数以到达下一个目标。这些包括设置可执行文件的路径、通信套接字等。


    最后，在完成这些之后，就可以初始化 `graphical.target` 或 `multi-user.target`。然而，请注意，在达到图形目标的依赖项之前达到
    `multi-user.target` 是重要的。


    如果你的系统默认目标是 `multi-user.target`，你将看到一个文本输入提示以登录控制台。不运行图形界面的 Linux 服务器通常默认目标为 `multi-user.target`。如果你在系统中安装了
    Linux 并包含了 GNU 桌面图形用户界面，将默认目标设置为 `graphical.target` 将带你进入图形登录。


    这就是启动序列的结束。你现在可以输入用户名和密码登录系统了。


    `GRUB2` 和 `systemd` 是引导过程的核心组件，也是任何现代 Linux 系统的启动过程。这两个关键部分协同工作，加载 Linux 内核并启动使
    Linux 系统用户所需的其他服务。


    ## Conclusion


    Linux 是一个非常安全的系统，因此被全球范围的企业使用。用户数据是当今最昂贵的资产，因此任何数据泄露都可能给组织带来巨大损失。事实证明 Linux 是企业运行应用程序和存储客户数据的一种非常安全的操作系统。Linux
    操作系统的开源特性确保了安全补丁的发布速度比当今世界上任何其他操作系统都快。这使得 Linux 成为任何关注安全的企业的理想平台。


    这本书是对 Linux 世界的介绍，希望它能鼓励你探索 Linux 领域更高级的学习选项！


    '
