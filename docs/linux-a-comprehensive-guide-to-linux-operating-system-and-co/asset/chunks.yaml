- fmt: '

    Since the boot record is minuscule, it does not have any information about the
    file system structure. Therefore, in its first stage, the `GRUB2` bootloader is
    only supposed to locate the next stage. `GRUB2` bootloader’s `stage 1.5` is located
    between the boot record and the bootable drive''s primary partition. After loading
    `stage 1.5` of `GRUB2` into the RAM, `stage 1.5` takes control.


    # Stage 1.5


    As discussed, `stage 1.5` must always lie between the boot record and the bootable
    device''s primary partition. This part of the disk was kept unused for many years
    for technical purposes. The hard disk drive gets first partitioned during sector
    `63`. The master boot record starts at sector `0`. This means that there are 62
    sectors, or 512-byte sectors, or simply 31,744 bytes in between, where the `core.img`
    file can be stored that contains `GRUB2`’s `stage 1.5`. The `core.img` file has
    a size of 25,389 bytes and evidently, there is more than enough space to store
    it after the master boot record sector.


    As there is enough space to accommodate a lot of code concerning `stage 1.5`,
    there is space for additional code to accommodate file system drivers such as
    `EXT`, `NTFS`, and `FAT`. This means the code for `GRUB2`’s `stage 2` can also
    be kept on a standard `EXT` file system. The default location of the `GRUB2` `stage
    2` is located at `/boot/grub2`.


    # Stage 2


    All the necessary files for `stage 2` of `Grub2` are located at `/boot/grub2`
    and its subdirectories. There is no image file for `GRUB2` like in the case of
    `stage 1` and `stage 2`. Instead, it has kernels that get loaded as and when required
    from the directory at `/boot/grub2/i386-pc`.


    The purpose of `stage 2` of `GRUB2` is to detect the Linux kernel and load it
    into RAM, thereby giving the kernel full control. The files for the Linux kernel
    are stored in the directory at `/boot`. It is easy to identify these files as
    they all begin with `vmlinuz`. The contents of the `/boot` directory will give
    you a list of all kernels that are currently installed on your Linux system.


    You will get a list of kernels that are installed on your system in `GRUB2` `stage
    2` and selecting one of the kernels will pass the boot process control to the
    respective kernel.


    ## Kernel


    All the kernels today come in a compressed format but also self-extract themselves.
    The kernel, as discussed, can be found in the directory at `/boot`. When you select
    a kernel, it is loaded into RAM, its execution begins and it should extract itself
    to become a usable format. When the kernel is extracted, it will call `systemd`,
    and control is passed from the kernel to `systemd`.


    This is where the boot process ends. At this instance in time, both the bootloader
    and `systemd` are executing but are useless to the system user as no other application
    is running.


    ## The Startup Sequence


    After the boot sequence concludes, the startup sequence is initiated to ultimately
    bring the Linux system to a state that is usable by an end-user to perform productive
    tasks.


    ## Systemd


    The Linux system''s fundamental process is `systemd` and is responsible for starting
    the Linux system and bring it to a usable state for an end-user. Before `systemd`,
    Linux systems used a service known as `init`. Compared to `init`, the functions
    of `systemd` are vast as they can handle countless areas of a Linux system such
    as mounting file systems, initiating and managing services concerning the system
    processes, and more.


    First, `systemd` will mount all the file systems that are defined in the configuration
    file at `/etc/fstab`. It also has access to all the configuration files at `/etc`.


    The configuration file located at `/etc/systemd/system/default.target` is read
    to figure out which target or state the system should be booted into. For a personal
    desktop, this is usually the `graphical.target`. For a Linux system that is a
    server, the default target is usually a `multi-user.target`.


    Services and targets are units of the `systemd` service. Every target has some
    dependencies for it that are defined in their configuration files. `systemd` also
    starts the dependencies of the target. The dependencies imply services that are
    required to operate the Linux system as per the target that was initiated. When
    the target’s dependencies are loaded and the system is up and running, we can
    say that the Linux system is functioning in that target mode.


    The checkpoints of the startup process are the two targets, `sysinit.target`,
    followed by the `basic.target`. Although `systemd` is known to start services
    simultaneously, some services need to be initiated before all the other services
    and targets are initialized. The system cannot pass a checkpoint until all the
    targets and services required by a particular checkpoint are started.


    The `sysinit.target` will start after all its dependencies have been initialized.
    There are multiple tasks concerning the dependencies of `sysinit.target` and they
    are performed in parallel inside of `sysinit.target`.


    The `sysinit.target` will initialize all the smaller services that are essential
    to move on to `basic.target`. The `basic` target has some extra functions that
    are initialized to reach the next target. These comprise setting up of paths to
    executables, communication sockets, etc.


    After all, this is done, the `graphical.target` or `multi-user.target` can be
    initialized. However, note that it is important that the `multi-user.target` is
    reached before the dependencies for the graphical target are reached.


    If your system''s default target is `multi-user.target`, you will see a text input
    prompt login for you to log in to the console. Linux servers that run without
    a graphical interface usually have their default target as `multi-user.target`.
    If you have installed Linux on your system and included the GNU Desktop graphical
    user interface, setting the default target as `graphical.target` will take you
    to a graphical login.


    This is the end of the startup sequence. You can now enter your username and password
    to log in to the system.


    `GRUB2` and `systemd` are the boot process''s core components and the startup
    process for any modern-day Linux system. These two key parts work hand in hand
    to load the Linux kernel and then start all the other services needed to make
    a Linux system usable for the end-user.


    ## Conclusion


    Linux is a very secure system and is therefore used by businesses all over the
    world today. User data is the most expensive entity today, and therefore, any
    compromise in data can amount to huge losses for an organization. Linux has proved
    to be a very secure operating system for a business to run its applications and
    store customer data. The open-source nature of the Linux operating system ensures
    that security patches are rolled out faster for Linux than any other operating
    system in the world today. This has made Linux the ideal platform for any business
    concerning security. Many other features offered by Linux are unparalleled by
    other operating systems.


    This book is an introduction into the Linux world, and I hope that it encourages
    you to look at advanced learning options in the Linux domain!

