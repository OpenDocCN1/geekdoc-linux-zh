    如果你访问过 Windows 10 的隐私设置，你会发现所有选项默认都是开启的。即使你拒绝了向微软发送数据，微软仍然会继续从你的系统中收集数据。微软不会在新闻稿中承认他们正在收集数据，但他们确实在收集数据。你需要使用第三方工具来禁用
    Windows 自带的间谍软件。


    如果你担心隐私问题，那么 Linux 再次是适合你的完美操作系统。Linux 系统不会收集大量数据，作为 Linux 用户，你不需要任何第三方工具就可以保护自己的隐私。


    # 第 5 章：Linux 内核


    一个操作系统由以下模块组成：


    - **引导加载程序 (Bootloader)**：这是负责操作系统启动过程的软件模块

    - **内核 (Kernel)**：这是操作系统的核心模块，向 `CPU`、内存和其他外围设备发送指令

    - **守护进程 (Daemons)**：这些是运行在 Linux 操作系统后台的服务

    - **网络 (Networking)**：这些是用于在设备之间发送和接收信息的通信相关服务

    - **Shell**：这是一个用于处理 Linux 系统用户输入的命令行指令的模块

    - **图形化服务器 (Graphical Server)**：这是在你的屏幕上显示图形的子系统

    - **桌面环境 (Desktop Environment)**：这是用户与系统之间主要的交互点

    - **应用程序 (Applications)**：这些是执行用户执行的任务的软件，例如文本编辑器


    ## 内核空间与用户空间


    ### 内核空间

    内核处于特权系统状态并拥有受保护的内存空间。它还对系统硬件拥有完全访问权限。系统空间和内存空间合称为内核空间。系统服务硬件的核心访问在内核空间内管理，并作为服务提供给系统的其余部分。


    ### 用户空间

    用户空间是用户应用程序存在并运行的区域。在用户空间中，用户应用程序可以通过内核调用访问可用资源的一部分。可以使用内核的核心服务创建如办公软件或游戏等用户应用程序。


    ## Linux 内核

    Linux 内核首次于 1991 年 9 月 17 日正式发布，从那时起它克服了重重困难，成为了 Linux 系统的定义性组件。


    内核分为三种：单体内核、微内核或混合内核。Linux 内核是单体内核。Linux 系列操作系统（俗称为 Linux 发行版）以该内核为基础。与微内核不同，单体内核通过
    `CPU`、内存和 `IPC` 工作，并包含设备驱动程序、文件管理系统和系统调用。单体内核在硬件通信以及同时执行多个线程方面最佳。这就是为什么 Linux
    进程的响应速度如此快。


    Linux 内核也有一些缺点。它需要巨大的安装程序和内存占用。由于它在监视模式下运行，它也存在安全漏洞。相比之下，微内核处理系统调用可能较慢，且内核和用户服务独立运行。与单体内核相比，它们的体积更小。微内核易于扩展，但需要编写更多代码来实现。Linux
    内核使用 `C` 和 `Assembly` 汇编语言编写。


    ### Linux 内核与硬件的关系

    内核利用名为`中断 (interrupts)` 的概念来控制系统硬件。当硬件想要使用系统资源时，它向 `CPU` 发送`中断`，从而向内核发送`中断`。内核能够禁用中断（无论是单个还是多个）以提供同步。Linux
    中的中断不运行在进程的上下文中，而是运行在与任何进程无关的中断上下文中。


    ### 与其他 UNIX 内核相比，Linux 内核有什么不同？

    Linux 内核与其他经典的 UNIX 内核之间存在显著差异，如下：


    - 内核模块可以在 Linux 中动态加载

    - Linux 内核的本质是抢占式的

    - Linux 支持对称多处理器

    - Linux 是开源且免费的

    - Linux 内核忽略了 UNIX 的标准特性，因为 Linux 开发者认为这些特性开发得不好

    - Linux 是一个面向对象的模型，具有设备类、用户空间设备文件系统和可以热插的事件

    - Linux 内核不区分普通进程和线程


    ## Linux 内核架构


    ### Linux 内核的组件

    内核上一个资源管理器。它管理的资源可以是进程、内存或硬件设备。内核在用户和竞争资源的进程之间管理并分配资源。Linux 内核位于内核空间，位于执行用户应用程序的用户空间下方。用户空间通过
    `GNI` 库与内核空间通信，使得系统调用接口得以连接。


    三个主要层级：

    1. **系统调用接口 (System Call Interface)**：这是内核的最顶层，负责 `read` 和 `write` 等操作。

    2. **内核代码 (Kernel Code)**：这一层位于系统调用接口之下。它对 Linux 支持的所有架构通用的，因此被称为与架构无关的代码。

    3. **架构相关的代码 (Architecture-dependent Code)**：这一层位于与架构无关的代码之下。它形成了一个通常被称为板级支持包（Board
    Support Package，简称 `BSF`）层。该内核层级包含了负责启动操作系统并将设备驱动程序加载到系统内存的引导加载程序包。


    **系统调用接口**：这一薄层位于用户空间和内核之间，接收用户的输入函数调用并将其传递给内核。该接口取决于架构。

    - **进程管理 (Process Management)**：主要用于进程管理。进程在内核中被称为视为线程，代表单个处理器的虚拟化。

    - **内存管理 (Memory Management)**：内存通过页进行管理以提高效率。Linux 具有管理内存的函数以及虚拟和物理映射的硬件。Linux
    还具有名为`交换空间 (Swap Space)` 的功能，它将硬盘空间纳入内存管理。

    - **虚拟文件系统 (Virtual File System)**：虚拟文件系统为文件系统提供了接口抽象。用户可以使用内核的虚拟文件系统在系统调用接口和文件系统之间切换。

    - **网络协议栈 (Network Stack)**：这是一个包含维护网络所需的所有协议的层。

    - **设备驱动程序 (Device Drivers)**：Linux 内核拥有大量的设备驱动程序源代码，包含连接到 Linux 系统的硬件设备的库。

    - **架构相关的代码 (Architecture-dependent Code)**：这些代码包含很大程度上依赖架构的元素，因此应考虑架构以确保正常运行。


    #### 系统调用与中断

    应用程序使用系统调用将信息传递给内核。应用程序使用包含此任务特定任务的库来做到。然后，这些库通过系统调用指示内核执行应用程序请求的任务。


