- fmt: '

    The `ps` command can be used to get information for a process. The `ps` command''s
    default output gives you a list of all processes running in the current shell.
    You can use the `ps a` command to get a list of all processes running in the entire
    system. If you want to know the user who owns an ongoing process, you can use
    the `ps u` command to list the user who owns the process in the first column.


    The outputs will display the users by their names, but the Linux system has a
    UID user ID to track the internal users. The Linux system maintains a database
    where the usernames are mapped to a number. There is a flat-file located at `/etc/passwd`
    which stores the information for all users. This file has seven fields, which
    are as follows:


    `username: password: UID: GID: GECOS: /home/dir: shell`


    Let’s discuss these fields in brief:


    - `username`: This is a text-based name for the user which is mapped to a `UID`.

    - `password`: Passwords for users were stored here in the past but now they are
    stored in a different location at `/etc/shadow`.

    - `UID`: This is a unique numeric ID given to a user so that the operating system
    can identify a user at the fundamental level.

    - `GID`: `GID` stands for Group ID. It is the primary group for a user in the
    system.

    - `GECOS`: This is a text field that has the fill name for a user by default.

    - `/home/dir`: Every user is assigned a home directory in the Linux system. The
    home directory for a user is stored under this field.

    - `shell`: The shell is the program that a user accesses after successfully logging
    in to the Linux system. For a normal user, this is the program that gives the
    user a command prompt.


    ## What is a Group?


    Just like users, a Linux system has groups with a group name and a `GID` mapped
    to the group name. You can find information related to groups in the file at `/etc/group`.


    There are two types of groups: Primary and supplementary. Let us understand the
    features of these groups:


    ### Primary Group


    - Every user belongs to exactly one primary group.

    - The fourth field in the `/etc/passwd` file defines the primary group for a local
    user defined by the group ID `GID`.

    - When a user creates a new file, the group owner for that file is the primary
    group of the user.

    - The primary group for a user has the same name as the user by default. This
    group is also a User Private Group (UPG) and the user is the only member of this
    group.


    ### Supplementary Group


    - A user can be a member of zero or more supplementary groups.

    - The local user''s primary group is listed in the last field in the file at `/etc/group`.
    For local groups, comma-separated values are used to identify the membership of
    the user. It is located in the last field of the file at `/etc/group`.

    - `groupname: password:GID:list, of, users, in, this, group`


    Supplementary groups were introduced so that users could be part of more than
    one group. This allocated resources and services more easily by just allocating
    them to the group rather than to individual users.


    ## The Superuser


    We will cover the Linux superuser known as `root` in this section. You will learn
    how to complete access to the Linux system by being the superuser or the root
    user.


    Every operating system has a superuser that has all the access and rights to the
    system. If you have been a Windows user, you may already know about the Windows
    superuser known as the `administrator`. This superuser is known as `root` in a
    Linux system. The `root` user can override everything on the system and is generally
    used for system administration. Tasks such as installing new software, removing
    existing software, files, and directory management, etc. can be performed by the
    `root` user.


    Even devices on an operating system can only be managed by the `root` user, with
    a few exceptions. A normal user can manage removable devices such as a USB drive.
    A normal user can therefore make changes to files and directories on a removable
    storage device. However, modifications to files and directories on a fixed storage
    device can only be done by the `root` user.


    With all the unlimited powers that a `root` user has, they can also damage the
    system. A `root` user can delete files and directories, modify user accounts or
    delete them, create system backdoors, etc. If the `root` account is compromised,
    an attacker can take full control over the system. Therefore, it is always advisable
    that you create normal users and escalate privileges to the `root` user only when
    needed.


    ## Managing User Accounts


    In this section, you will learn to create and modify user accounts in the local
    system. User accounts can be managed through a list of Linux commands. Let us
    go through these commands one by one.


    ### useradd username


    This command creates a new user with the `username` that is passed as an argument.
    It also applies all the default properties to the new user in the `/etc/passwd`
    file if you run the command without any explicit options. The default command
    will also not set a password for the new user. Therefore, a password needs to
    be set before the user can log in to the system.


    You can type the `useradd--help` command to see all the options that can be used
    with the command. Using these options, you can override the default properties
    set by the `useradd` command.


    ### usermod --help


    | Option | Description |

    | :--- | :--- |

    | `-c,--comment` | This option is used to add a value such as full name to the
    `GECOS` field |

    | `-g,--gid GROUP` | The primary group of the user can be specified using this
    option |

    | `-G,--groups` | Associate one or more supplementary groups with user |

    | `-a,--append` | The option is used with the `-G` option to add the user to all
    specified supplementary groups without removing the user from other groups |

    | `-d,--home HOME_DIR` | The option allows you to modify a new home directory
    for the user |

    | `-m,--move-home` | You can move the location of the user''s home directory to
    a new location by using the `-d` option |

    | `-s,--shell` | The login shell of the user is changed using this option |

    | `-L,--lock` | Lock a user account using this option |

    | `-U,--unlock` | Unlock a user account using this option |


    ### userdel username


    This command is used to delete the user from the `/etc/passwd` file. Do not, however,
    that this command does not delete the user''s home directory.


    ### id


    This command will display the current user''s properties that are set in the `/etc/passwd`
    file including the `UID` and group details.


    `id username` will display the user''s properties that you have passed as an argument
    to the command.


    ### passwd username


    This command can be used to set a new password for a new user, or to modify the
    password for an existing user. The `root` user can set the password of any other
    user to any value. There will be a warning if the password criteria are not met,
    but the `root` user can just type the same password again to set it for the other
    user. In the case of a regular user, the `passwd` command can be used to change
    their password only, but all of the password policies have to be met.


    ### UID Range


    Specific number ranges are reserved for specific users in Linux.


    - `UID 0` is always assigned to the `root` user.

    - The system assigns `UID 1-200` to system processes in a static manner.

    - `UID 201-999` is assigned to the system processes that do not own any file in
    the system. They are dynamically assigned whenever installed software requests
    for a process.

    - `UID 1000+` are assigned to regular users of the system.


    ## Managing Group Accounts


    This section will take you through the creation, modification, and deletion of
    local group accounts.


    If you want to add users to a group, the group must already exist. There are several
    command-line tools to manage local groups in Linux. Here, we will go through these
    commands one by one:


    ### groupadd groupname

    '
