    `ps` 命令可以用于获取进程信息。`ps` 命令的默认输出会为你提供一个在当前 shell 中运行的所有进程的列表。你可以使用 `ps a` 命令来获取整个系统中运行的所有进程列表。如果你想知道某个正在运行的进程的所有者，可以使用
    `ps u` 命令在第一列列出拥有该进程的用户。


    输出将通过名称显示用户，但 Linux 系统有一个 UID 用户 ID（user ID）来跟踪内部用户。Linux 系统维护着一个数据库，其中用户名映射到一个数字。在
    `/etc/passwd` 处有一个平面文件，存储了所有用户的信息。该文件有七个字段，如下：


    `username: password: UID: GID: GECOS: /home/dir: shell`


    让我们简要讨论一下这些字段：


    - `username`: 这是用户的基于文本名称，映射到 `UID`。

    - `password`: 过去用户的密码存储在这里，但现在它们被存储在 `/etc/shadow` 的不同位置。

    - `UID`: 这是给给用户的唯一数字 ID，以便操作系统能够从根本上识别用户。

    - `GID`: `GID` 代表组 ID（Group ID）。它是用户在系统中的主组。

    - `GECOS`: 这是一个文本字段，默认是用户的全名。

    - `/home/dir`: 每个用户在 Linux 系统中都被分配了一个家目录。用户的家目录存储在此字段下。

    - `shell`: shell 是用户在成功登录 Linux 系统后访问的程序。对于普通用户来说，这是提供用户命令提示符的程序。


    ## 什么是组？


    就像用户一样，Linux 系统也有组，它有组名和映射到组名的 `GID`。你可以在 `/etc/group` 文件中找到与组相关的信息。


    组有两种类型：主组（Primary）和补充组（Supplementary）。让我们了解这些组的特征：


    ### 主组


    - 每个用户都恰好属于一个主组。

    - `/etc/passwd` 文件中的第四个字段通过组 ID `GID` 定义了本地用户的主组。

    - 当用户创建一个新文件时，该文件的组所有者是该用户的主组。

    - 默认情况下，用户的主组名称与用户名相同。该组也是用户私有组（UPG），用户是该组的唯一成员。


    ### 补充组


    - 用户可以是零个或多个补充组的成员。

    - 本地用户的主组列在 `/etc/group` 文件的最后一个字段。对于本地组，使用逗号分隔的值来识别用户的成员身份。它位于 `/etc/group` 文件的最后一个字段。

    - `groupname: password:GID:list, of, users, in, this, group`


    引入补充组是为了让用户能够成为多个组的一员。这通过将资源和服务分配给组而不是单个用户，从而更容易进行分配。


    ## 超级用户（Superuser）


    我们将在本节中介绍被称为 `root` 的 Linux 超用户。你将学习如何通过成为超级用户或 root 用户来完成对 Linux 系统的访问。


    每个操作系统都有拥有系统所有访问权限和权利的超级用户。如果你曾是 Windows 用户，可能已经知道过被称为 `administrator` 的 Windows
    超用户。这个超级用户在 Linux 系统中被称为 `root`。`root` 用户可以覆盖系统上的所有内容，通常用于系统管理。诸如安装新软件、删除现有软件、文件以及目录管理等任务，都可以由
    `root` 用户执行。


    即使是操作系统上的设备也只能由 `root` 用户管理，少数除外。普通用户可以管理如 USB 驱动器之类的移动设备。因此，普通用户可以更改移动存储设备上的文件和目录。然而，对固定存储设备上的文件和目录的修改只能由
    `root` 用户完成。


    由于 `root` 用户拥有所有无限权限，他们也可以破坏系统。`root` 用户可以删除文件和目录、修改或删除用户账户、创建系统后门等。如果 `root`
    账户被破解，攻击者可以完全控制系统。因此，始终建议创建普通用户，仅在需要时提升权限到 `root` 用户。


    ## 管理用户账户


    在本节中，你将学习在本地系统中创建和修改用户账户。用户账户可以通过 Linux 命令列表进行管理。让我们逐一通过这些命令。


    ### useradd username


    此命令通过作为参数传递的 `username` 创建新用户。如果你在不带任何显式选项的情况下运行该命令，它还会为 `/etc/passwd` 文件中的新用户应用所有默认属性。默认命令还不会为新用户设置密码。因此，在用户登录系统之前，需要设置密码。


    你可以输入 `useradd--help` 命令来查看该命令可以使用的所有选项。使用这些选项，你可以覆盖由 `useradd` 命令设置的默认属性。


    ### usermod --help


    | 选项 |  |

    | :--- | :--- |

    | `-c,--comment` | 此选项用于在 `GECOS` 字段中添加全名等值 |

    | `-g,--gid GROUP` | 使用此选项指定用户的主组 |

    | `-G,--groups` | 将一个或多个补充组与用户关联 |

    | `-a,--append` | 该选项配合 `-G` 使用，将用户添加到指定的组而不从其他组中移除 |

    | `-d,--home HOME_DIR` | 此选项允许你修改用户的家目录 |

    | `-m,--move-home` | 使用 `-d` 将用户的家目录移动到新位置 |

    | `-s,--shell` | 使用此选项更改登录 shell |

    | `-L,--lock` | 使用此选项锁定账户 |

    | `-U,--unlock` | 使用此选项解锁账户 |


    ### userdel username


    此命令用于从 `/etc/passwd` 中删除用户。但注意，此命令不会删除用户的家目录。


    ### id


    此命令将显示 `/etc/passwd` 中设置的当前用户属性，包括 UID 和组详情。


    `id username` 将显示作为参数传递给命令的用户属性。


    ### passwd username


    此命令可用于为新用户设置密码，或为现有用户修改密码。`root` 用户可以将任何其他用户的密码设置为任何值。如果不符合密码标准，将收到警告，但 `root`
    用户只需再次输入相同的密码即可完成设置。对于普通用户来说，`passwd` 命令只能更改其密码，但必须满足所有的密码策略。


    ### UID 范围


    Linux 为特定的用户留了特定的数字范围。


    - `UID 0` 始终分配给 `root` 用户。

    - 系统静态地将 `UID 1-200` 分配给系统进程。

    - `UID 201-999` 分配给未拥有任何文件的系统进程。每当安装的软件请求进程时，就会动态分配。

    - `UID 1000+` 分配给系统普通用户。


    ## 管理组账户


    本节将带你创建、修改和删除本地组账户。


    如果你想将用户添加到组，该组必须已经存在。有几种命令行工具可以管理本地组。在这里，我们将逐一通过这些命令：


    ### groupadd groupname


