    \ print 0 byte after `FILE` name\n\nContext control:\n\n`-B,--before-context=NUM`\
    \ print `NUM` lines of leading context\n\n`-A,--after-context=NUM` print `NUM`\
    \ lines of trailing context\n\n`-C,--context=NUM` print `NUM` lines of output\
