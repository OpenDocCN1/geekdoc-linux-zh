- fmt: '

    Shell scripting refers to the open-source computer programming language developed
    for the Linux shell. Shell scripting is nothing but writing a series of Linux
    commands to be executed automatically. The code for a shell script can be as short
    as a single line, or it can be lengthy, containing repetitive commands that can
    be stored in a single script such that the effort to type the commands manually
    every time is reduced.


    In this chapter, we will try to teach you the basics of shell scripting in Linux.
    We will also discuss some advanced concepts of shell scripting. This chapter aims
    to discuss how shell scripting works and will serve as a launchpad to the world
    of shell scripting.


    ## How to Write a Shell Script in Linux


    Shell scripts are written using text editors. There are several text editors available
    on a Linux system such as `vi`, `vim`, and `nano`. You can open any text editor
    and begin writing a shell script or a shell program. You need to ensure that the
    file you create for your shell script has execute permissions. And then, you just
    need to keep the shell script file in a location that is accessible to the Linux
    shell.


    The following are the steps that go into creating a shell script:


    1. Create a new file using a text editor like `vi`. Name the script file and give
    it a `.sh` extension.

    2. Start the script with the first line as `#! /bin/sh`.

    3. Write some Linux commands.

    4. Save the file as `filename.sh`.

    5. You can execute the script file using the command `bash filename.sh`.


    `#!` is known as a shebang operator. It directs the script to the location of
    the interpreter. Therefore, when you specify your shell script''s first line as
    `#! /bin/sh`, the script is directed to the Bourne shell located at `/bin/sh`.


    Let us try to create a small and simple script:


    ```

    #!/bin/sh


    ls

    ```


    You can name this script as `list.sh`. You can run this script using the following
    command:


    ```

    [student@desktop ~]$ bash list.sh

    Documents Movies Books Pictures

    ```


    As you can see, the script is simply performing the function of the `ls` function.


    ### Adding Comments to your Shell Script


    Commenting is used in shell scripting as in any programming language. The syntax
    to add a comment is as follows:


    ```bash

    #this is a comment

    ```


    So taking the above script as an example, your script with the comment would look
    like this:


    ```bash

    #!/bin/sh


    #this is my first script


    Ls

    ```


    ### Shell Variables


    Variable store data in the form of numbers and characters. Similarly, shell variables
    also store information that can be accessed by the shell.


    For example, the below shell script creates a shell variable and then prints it:


    ```bash

    variable ="Hello"

    echo $variable

    ```


    Let us look at another small shell script that uses a variable:


    ```bash

    #!/bin/sh


    echo "what is your name?"

    read name

    echo "How do you do, $name?"

    read remark

    echo "I am $remark too!"

    ```


    ### How Does this Script Work?


    When you execute this script, you will first be prompted with the question “what
    is your name?” You will then get an option to input your name. If you type in
    `John`, the string `John` is stored by the program in the variable `name`, and
    in the next question, the program uses your `John` that it has stored to give
    you the new question “How do you do John” where the variable `$name` is replaced
    by the name that you entered. The response to this question is also stored in
    a new variable `remark`. So, if you replied ‘excellent’, the next statement by
    the program will replace `$remark` with it and give you the output “I am excellent
    too!”.


    This is a simple script and you can develop much more complex scripts that will
    have loops, conditional statements, and functions.


    ## Chapter 7: The Linux Boot Process


    Have you ever been curious about how your Windows or Linux system boots up and
    prepares the whole system ready for you? In this chapter, we will discuss the
    entire boot process for a Linux system, and explain what happens from the time
    you press the power button until you are presented with your login screen and
    the desktop.


    It is important to understand the boot process and startup process in Linux if
    you want to get good with its configuration and troubleshoot any issues concerning
    startup. This chapter will take you through the Linux boot and startup process,
    focusing mainly on the bootloader utility known as `GRUB2`, and system initialization
    Linux process known as `systemd`.


    To start a Linux system, you need a couple of sequences that bring it to a state
    that is ready for use. This process is initiated when you press the power button
    and concludes when the Linux kernel is up and the control is passed over to `systemd`.
    After `systemd` is initiated, the startup process takes control and concludes
    when the Linux system is in a usable state for any user.


    The Linux boot and startup sequence are simple to understand. It comprises the
    following steps, which we will be discussing in detail:


    1. BIOS POST

    2. Boot loader (`GRUB2`)

    3. Kernel initialization

    4. Initialize `systemd`


    In this chapter, we will be discussing the boot and startup sequence using `GRUB2`
    and `systemd` since a majority of Linux distributions work with them. However,
    there may be a few Linux distributions that still use older software for boot
    and startup.


    ### The Boot Sequence


    There are a couple of ways to initiate the boot sequence in Linux. The first one
    is as simple as switching your system on, which will trigger the boot sequence.
    If the system already has a regular user or root user, they can use the command
    line or the GUI to reboot the system. When you reboot the system, it will first
    shut down the system and initiate the boot sequence again.


    ### BIOS POST


    The primary step of the boot sequence in Linux is not related to Linux at all.
    This step deals with hardware initiation and is universal across the various operating
    systems. When you press the power button for a computer, the Power On Self Test
    known as `POST` is initialized, which is a subset of the Basic Input Output System,
    known as `BIOS` in short.


    `BIOS` was developed to initialize hardware when IBM developed the first computer
    in 1981. `POST` is a subset of `BIOS` that ensures all the hardware functions
    properly. If the Power On Self Test fails, it is an indication that the system
    may be unusable and `BIOS` will not be initiated.


    `BIOS` and `POST` check the system hardware''s simple operation, following it
    up with a BIOS interrupt called `13H`. This interrupt finds any bootable device
    and locates its boot sectors. When it comes across the first valid boot sector
    containing a valid boot record, it loads it into memory and then the control is
    passed to the code present in the boot sector.


    The boot loader’s first stage, therefore, is the boot sector. Linux distributions
    have used 3 bootloaders over the years, `LILO`, `GRUB`, and `GRUB2`. The latest
    and most popular boot loader is `GRUB2`, which is used by almost all Linux distributions.


    ### GRUB2


    `GRUB2` is short for `GRand Unified Bootloader`, version 2. It is now the first
    choice for bootloader preferred by most Linux distributions. The `GRUB2` module
    makes the computer sufficiently smart to locate the operating system’s kernel
    and load it into memory.


    Although Linux has never officially issued any stage notification for `GRUB2`,
    it consists of three stages. Let us discuss them further:


    #### Stage 1


    As we have discussed in the section for `POST` and `BIOS`, when POST concludes,
    `BIOS` searches for any attached bootable devices, locates the Master Boot Record
    (`MBR`) on it, and then loads it into RAM and the boot record is executed. The
    bootstrap code''s size for stage 1 of `GRUB2` is so small it can accommodate itself
    on the hard disk’s first 512-byte sector with the partition table. The maximum
    disk space allocated to the bootstrap code is about 446 bytes. This stage one
    file of 446 bytes is called `boot.img`. The partition table is not a part of this
    file.

