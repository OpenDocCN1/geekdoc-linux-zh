  raw: 'Linux is capable of processing more than one task in a given instance of time.
    For example, consider that you have executed a task that sorts through a huge
    list, and at the same time, you are also typing something in a notepad. These
    are two simultaneous tasks and Linux will share the CPU time efficiently by implementing
    scheduling policies such that the CPU will be used for your notepad when you are
    typing. When you take a break from typing, it will be assigned to the sorting
    task that you have executed. 


    #### Portability


    The characteristic that made Linux hugely popular among the masses was portability.
    Portability, however, does not mean that Linux is smaller in size compared to
    other operating systems and can be carried around on a CD or USB drive. Portability
    in Linux refers to the operating system''s capability to perform in a similar
    way across various hardware systems.


    #### Security


    Security is a very important aspect of any operating system for a user or an organization
    that is using the system for their daily work. There are several provisions in
    Linux to protect its users from unauthorized access to their system and data. 


    The three main concepts of security in Linux are as follows:


    Authentication


    This refers to the creation of users and their associated passwords on the Linux
    operating system. A person cannot access the Linux system unless they have a user
    and password created for them on the Linux operating system. 


    Authorization


    There are authorization limits set for users on the Linux system at the file and
    directory level. These deal with permissions such as read, write, and execute.
    Based on the permissions on a file or a directory, a certain user can read it,
    make changes to it, or execute the file if it is executable. 


    Encryption


    Linux allows all the files on your operating system to be encoded into an unreadable
    format known as ciphertext. This ensures that even if someone manages to break
    into your system, they will not be able to read the data you have on your Linux
    system''s hard disk. 


    #### Communication


    Linux has an amazing arrangement for communication. Users in the same system can
    communicate with each other. Moreover, users on different systems connected over
    a network can also communicate with each other. Data, mail, and even programs
    can be exchanged between users over a network. 


    ## Chapter 2: The Linux Command Line


    This chapter will introduce you to the Linux command line and how it can be used
    to perform different types of tasks on the Linux operating system. When we conclude
    this chapter, you will know the Linux command line''s basic commands that are
    used to manage files and folders on the Linux system. 


    ### The Bash Shell


    BASH is short for Bourne-Again Shell. The utility of the Linux operating system
    helps you interact with the system through Linux commands. When we talk about
    a command-line utility, we refer to an interface that allows you to give instructions
    to a computer and its operating system in text mode. There are multiple shell
    interfaces available today across various Linux-based operating systems, but the
    most popular one is the bash shell. It is an evolved version of the previously
    used Linux shell known as the Bourne Shell. 


    The bash shell will show you a string that indicates it is waiting for the user''s
    input. The string that is displayed is known as the shell prompt. If you are a
    root user, the shell prompt will end with a # symbol. For a non-root user, it
    ends with a $. 


    [root@desktop ~]#


    [student@desktop ~]$


    To make it easier to understand, the Linux operating system''s bash shell is just
    like the command prompt utility that is available in the Windows operating system.
    But the scripting language available in the bash shell is much superior compared
    to the scripting language in the Windows command prompt. We can also compare bash
    shell to the Power Shell utility that was introduced in Windows 7 and is continued
    in the versions that followed it. Many professionals have praised the bash shell
    as a powerful tool for system administration. The scripting language offered in
    the bash shell can be used to automate numerous tasks in the Linux operating system.
    Additionally, the bash shell also enables you to perform other complicated tasks
    that are sometimes not possible via the graphical user interface. 


    You can access the bash shell using a utility known as the terminal. The keyboard
    serves as the input to the terminal and the monitor shows the output of your commands.
    The bash shell can also be accessed using virtual consoles in the Linux system.
    This lets you have multiple virtual consoles on the base physical console, and
    every virtual console serves as an individual terminal. Login sessions for multiple
    users can be created using numerous virtual consoles. 


    ### Basics of Shell


    The command that you enter on the shell prompt comprises three parts:


    Command that you want to run


    Options that will define the behavior of the command


    Arguments which are the command''s targets


    The command is a definition of the program that you want to execute. You can have
    options following the command, or no options at all. The options govern the behavior
    of the command and they define how the command will function. Options are specified
    using a dash or two dashes. The dashes are appended so that options can be differentiated
    from arguments. 


    Example: -a or –all


    Arguments also follow the command on the command prompt and can be again one or
    more, just like options. Arguments are the targets on which the command will execute. 


    Let''s look at a basic command:


    usermod -L John


    The command in this example is usermod


    The option is -L


    The argument is John


    This command will lock the password on the system for the user John. 


    You need to know what options can be used in combination with which commands to
    effectively use the command line. You can run the —help with any command to get
    a list of options that can be used with a particular command. So, you don''t need
    to know every option that goes with a given command off by heart, and the list
    will tell you what every option does. 


    Let us look at what this does when you look up help for the grep command. The
    grep command is used to scan through a file for a string. If the file contains
    the string specified by you, the output will show all the lines in the file that
    contain the string. 


    [student@desktop ~]$ grep—help


    Usage: grep [OPTION]... PATTERN [FILE]...


    Search for PATTERN in each FILE or standard input.


    PATTERN is, by default, a basic regular expression (BRE).


    Example: grep -i ''hello world'' menu.h main.c


    Regexp selection and interpretation:


    -E,—extended-regexp PATTERN is an extended regular expression (ERE)


    -F,—fixed-strings   PATTERN is a set of newline-separated fixed strings


    -G,—basic-regexp   PATTERN is a basic regular expression (BRE)


    -P,—perl-regexp   PATTERN is a Perl regular expression


    -e,—regexp=PATTERN  use PATTERN for matching


    -f,—file=FILE   obtain PATTERN from FILE


    -i,—ignore-case   ignore case distinctions


    -w,—word-regexp   force PATTERN to match only whole words


    -x,—line-regexp   force PATTERN to match only whole lines


    -z,—null-data   a data line ends in 0 byte, not newline


    Miscellaneous:


    -s,—no-messages   suppress error messages


    -v,—invert-match  select non-matching lines


    -V,—version   display version information and exit


    —help  display this help text and exit


    Output control:


    -m,—max-count=NUM   stop after NUM matches


    -b,—byte-offset   print the byte offset with output lines


    -n,—line-number   print line number with output lines


    —line-buffered   flush output on every line


    -H,—with-filename   print the file name for each match


    -h,—no-filename   suppress the file name prefix on output


    —label=LABEL     use LABEL as the standard input file name prefix


    -o,—only-matching   show only the part of a line matching PATTERN


    -q,—quiet,—silent   suppress all normal output'
