    The Linux kernel brings many interfaces for userspace applications and these interfaces
    have various properties and are capable of performing multiple tasks. There are
    two distinct Application Programming Interfaces (API) known as the kernel-user
    space and the kernel internal. The Linux API supports the kernel-user space API
    and enables applications from the user space to access the kernel''s system resources
    and services. It comprises the subroutines from the GNU C library and the System
    Call Interface.


    ## Linux ABI

    ABI stands for Application Binary Interface and refers to the kernel-user space
    ABI. The Linux ABI can be defined as the interface that lies between various program
    modules. The difference between API and ABI is that ABI is used to access externally
    compiled code, whereas API is a structure that manages software. More than a Linux
    kernel, an ABI is defined by a Linux distribution. Every architecture requires
    a specific instruction set such as `x86-64`. ABI is consumed more than API by
    end-users of Linux products.


    ## System Call Interface

    As discussed previously, the system call interface plays a role in the kernel.
    It is the denomination and collective of all the system calls.


    ## The C Standard Library

    The kernel system calls are a part of the GNU C library. The Linux API is a part
    of the GNU C library and the system call interface known as `Glibc`.


    ## Portable Operating System Interface (POSIX)

    POSIX is a collective term for standards used for maintaining compatibility between
    various operating systems. It is responsible for declaring the API bundled with
    command-line shells and utility interfaces. POSIX defines useful features for
    the Linux API and also additional features for the kernel such as:


    - Cgroups subsystem

    - Systems calls of the Direct Rendering Manager

    - A feature called readahead

    - A Getrandom call

    - System calls such as `epoll`, `futex`, `dnotify`, `splice`, `inotify`, and `fanotify`


    ## The Modular Kernel

    The initial versions of the Linux kernel were monolithic, such that they had multiple
    static parts fixed into a single part. However, modern Linux kernels contain multiple
    modules fed to the kernel dynamically, as and when needed. This is different as
    compared to the monolithic kernels and are therefore referred to as modular kernels.
    The advantage of a modular kernel is that code can be loaded as modules in the
    kernel without rebooting the system.


    ### The Linux Loadable Kernel Module (LKM)

    Code can be added to the Linux kernel in the form of modules using the kernel
    source tree. It is beneficial if code can be added to the kernel while the kernel
    is running. The modular code is also known as a loadable kernel module. The modules
    have specific tasks that are divided into three types: system calls, file system
    drivers, and device drivers.


    You can compare the loadable kernel module in Linux to the kernel extensions offered
    by other operating systems. Modules can be added to the kernel by loading it in
    the loadable kernel module or appending it to the base kernel.


    The loadable kernel module has the following benefits compared to binding code
    to the base kernel:


    - You can save time and avoid errors as you do not need to rebuild the kernel

    - System problems such as bugs can be discovered using the loadable kernel module

    - The loadable kernel modules save space as you need to load them only when needed

    - The maintenance and debugging of loadable kernel modules is fast


    ### Uses of the Loadable Kernel Module

    The loadable kernel module has the following uses:


    - **Device Drivers**: The kernel uses this module to communicate with the hardware
    on the system. The device driver needs to be loaded into the kernel before the
    device can be used.

    - **Filesystem Drivers**: These drivers are used to translate the contents of
    the file system.

    - **System Calls**: The applications running in the user space employ system calls
    to procure services of the kernel.

    - **Network Drivers**: These drivers translate network protocols.

    - **Executable Interpreters**: These are responsible for loading and managing
    executable files.


    ### Compiling the Linux Kernel

    Contrary to popular opinion, compiling the Linux kernel is a simple task. Let
    us go through a step by step guide to compiling the Linux kernel. We have used
    the Fedora 13 KDE distribution for our example. It is advisable to back up your
    data and GRUB just to ensure that you have a backup if something goes wrong.


    1. Download the source code from `http://kernel.org/`.

    2. Navigate to downloads directory on the terminal and extract the source code
    from the download archive using the following command:

    ```bash

    tar xvjf Linux-2.6.37.tar.bz2

    ```

    3. Clear the build area before compilation by using the command:

    ```bash

    make mrproper

    ```

    4. Use a configuration like `xconfig` that will make it easy to run any program.

    5. Select the features and modules that you wish for your kernel to have.

    6. Generate the `.config` file and then go to `MakeFile`.

    7. Execute the compilation by running the `make` command.

    8. Install the modules by running the command:

    ```bash

    modules_install

    ```

    9. Copy the kernel and the system map to the `/boot` directory.

    10. Run the command `new-kernel-pkg` to build the list of dependencies for the
    new modules.


    That’s it. You have compiled your customized Linux kernel in 10 easy steps.


    ### Upgrading the Kernel

    The Linux kernel can be easily upgraded from an existing version to a newer version
    while retaining all the existing version''s configuration data. First, you need
    to create a backup of the kernel’s `.config` file in the kernel’s source directory.
    This is a security measure for the worst-case scenario if something goes wrong.
    The steps to upgrade the Linux kernel are as follows:


    - Download the latest source code for the Linux kernel from the `kernel.org` website.

    - Make the changes to the old source tree to bring it to the latest version

    -- Reconfigure the new kernel by adding the configuration of the old kernel file
    that you have backed up

    - Build the new kernel

    - You can now install the newly built kernel


    ### Downloading the source code of the new kernel

    The Linux kernel source code developers understand that not all users would want
    to download the entire source code as it may consume disk space and bandwidth.
    Therefore, they also roll out patches that just upgrade the existing version of
    a user’s kernel. The only thing a user needs to know is which patch file is compatible
    with their existing kernel version, as a patch file will succeed at upgrading
    only a specific kernel version. You can apply patch files using the following
    methods:


    - Stable kernel patches that can be applied to base kernel versions.

    - Base kernel patches that can be applied only to the previous version of the
    base kernel.

    - An incremental patch upgrade can be used from one release to the next release.
    This saves developers the trouble of downgrading a kernel and then upgrading it.
    Using this method, they can simply switch from the current version to the next
    stable version available for their kernel.


    ## What Can We Conclude About the Linux Kernel?

    The Linux kernel is a resource manager, and acts through an abstract layer for
    the Linux system''s applications. The applications use the kernel to interact
    with the hardware and services of the system. Linux is a multitasking operating
    system and the Linux kernel is apt for processing multiple tasks. The Linux kernel
    is open source and highly customizable. Therefore, it can be used with a wide
    range of devices, unlike other operating systems.


    The modular Linux kernel is the icing on the cake. It allows modifications to
    be made to the kernel without the need to reboot the system.


    The monolithic Linux kernel has better processing abilities than a microkernel.


