  md: '# # Chapter 6: C.I.A. and Its Relation with Cybersecurity


    The C.I.A., also known as the Central Intelligence Agency is an intelligence service
    related to foreign affairs which belongs to the U.S. federal government. It is
    responsible for various tasks related to data gathering, analyzing and processing.
    C.I.A. is responsible for the national security and thus functions for protection
    of the same. It is well-known for gathering of information from all over the world
    with the use of HUMINT or human intelligence. C.I.A. is one of the most important
    members of the U.S. IC or United States Intelligence Community and it reports
    to the National Intelligence Director.


    Unlike the FBI or Federal Bureau of Investigation, which is related to the domestic
    service of security, C.I.A. comes with no forms of function related to law enforcement
    and is targeted for gathering of overseas intelligence. C.I.A. functions as the
    central authorizing unit of the HUMINT.


    # Functions of C.I.A.


    The primary function of C.I.A. is collection and gathering of data for the purpose
    of national security. According to the basic principles of C.I.A., it has five
    basic functions:


    +   * Counterterrorism as the main priority

    * Nonproliferation of weapons regarding mass destruction'
