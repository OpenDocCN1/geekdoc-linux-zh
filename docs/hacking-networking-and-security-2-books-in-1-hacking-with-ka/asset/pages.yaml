- pgno: 55
  md: '# Chapter 9: Network Mode Security


    The algorithms of network security have gone through various changes along with
    upgrades since the year 1990. It has turned out to be more effective and secure
    in nature. Today, various types of protocols have been developed for the protection
    of wireless networks. The most common protocols are WPA, WEP and WPA2. All of
    these serve a similar purpose but differs from one another in some aspects. Wireless
    protocols for security not only helps in preventing unwanted people from connecting
    to the network but it also helps in encrypting the data which is sent via the
    airwaves.


    # WEP


    Also known as wired equivalent privacy, it was developed for the security of wireless
    networks and was accepted as a standard in the year 1999. WEP was expected to
    offer the same kind of security level like wired networks but there are various
    issues in security in this protocol. It is very easy to break the security and
    is also very hard to configure the same. Despite all the upgrades which have been
    applied to WEP, it is still a very vulnerable form of security protocol.


    # WPA'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'It is also known as Wi-Fi protected access. It was adopted one year back just
    before WEP was abandoned. Most of the WPA applications of modern-day use a PSK
    or pre-shared key which is often referred to as WPA personal and TKIP or temporal
    key integrity protocol for the purpose of encryption. It uses a server for the
    purpose of authentication for the generation of certificate and for the keys.


    Just like WEP, WPA was also found out to be vulnerable to external intrusions.
    The attacks which were posed most dangerous for the protocol were not direct in
    nature but the ones which were set up on WPS or Wi-Fi protected setup developed
    for simplifying the linkage between the devices for the modern-day access points.


    # WPA2


    WPA was improved and was made into WPA2. It is also known as Wi-Fi protected access
    version 2. The major upgrade that this protocol received was the usage of AES
    or access encryption standard. AES has been approved by the government in the
    U.S. for the purpose of encrypting data and information.


    The main form of vulnerability to a system with WPA2 is when the attacker has
    complete access to the secured network of Wi-Fi and can also access some of the
    keys which are required for carrying out the attack on the devices in a network.
    In WPA2 systems, the security threats are mainly at enterprise levels and are
    not at all relevant to the home networks.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'However, attacks via WPS are still there in the WPA2 systems just like WPA.


    # Which method of security to opt for?


    When all the security methods are arranged in order of best to worst it goes on
    like:


    +   - WPA2+AES

    - WPA+TKIP/AES

    - WPA+AES

    - WPA+TKIP

    - WEP


    The best method is to deactivate WPS and then set the wireless router for WPA2+AES.
    Both WPA2 and WPA are used for securing networks from any form of unauthorized
    access. In case you leave the system with no form of security, any third party
    can easily steal bandwidth of the network, perform various illegal jobs with the
    help of the network, monitor your activity on the web and can easily install malware
    on the system.


    WPA2 is regarded as the best out of all. The only downside that comes with WPA2
    is determining the power of processing that the protocol needs for protecting
    the network. So, it means that super-powerful hardware is required for avoiding
    lower performance of the network. You should'
  merge: -1
  img_proc: true
- pgno: 58
  md: "always opt for WPA2 or otherwise WPA in case you have no other option.\n WPA\
    \ can help in handling heavy loads when there is heavy load in WPA2 system, it\
    \ might also affect the network speed.\n\nWhen it comes to encryption, it will\
    \ depend on the type of protocol that you are using. WPA2 comes with the fastest\
