- pgno: 227
  md: '# Chapter 10: Inspection of Wireless Networks


    In this era of unique technological innovations, it is of utter importance to
    opt for wireless networks or WLAN testing and inspection. It needs to be done
    for ensuring that the involved system meets all the requirements of performance
    along with security. There are lots of factors that come into play while inspecting
    WLAN. Therefore, all that you need is proper planning along with documentation
    of the test.


    # Considerations along with planning for WLAN inspection


    While you plan for WLAN inspection, it is a crucial part to consider the available
    varieties of the areas of testing. It includes:


    +   * **Testing of signal coverage**: It makes sure that the levels of signal
    are enough for supporting the performance levels that the users require throughout
    the coverage areas of WLAN.

    * **Testing of performance**: This certifies the capabilities of the WLAN for
    meeting the needs of the users while using some applications over the network.

    * **In-motion testing**: This helps in determining that whether the network of
    WLAN allows all the users for successfully using the applications at the time
    of moving across various areas of coverage.

    * **Testing of security vulnerability**: This helps in certifying the network
    security by authenticating the application of the mechanism of security which
    is required along with the proper protection degrees from the access which are
    unauthorized.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '+   * Testing of verification or acceptance: It offers a type of insurance
    to the organizations which hires various contractors for the implementation of
    WLAN after ensuring that the overall system has the required coverage of signal,
    capacity, performance along with security. It is a process which is kind of formalized
    that also takes into account the various practices of installation, documentation
    of system along with the various procedures of maintenance.


    +   * Simulation testing: This helps in providing a proper visualization along
    with the representation of the behavior related to WLAN right before it is being
    deployed. It offers deep insights into the network design''s effectiveness in
    relation to the activity of traffic, software and hardware. It also takes into
    account any form of potential issue in the performance.


    +   * Testing of prototype: It has been designed for specifically assessing the
    parts of the product or the system of WLAN which are not familiar in nature in
    the environment of a lab right before the deployment of the same.


    +   * Pilot testing: This involves the installation of WLAN in its real version
    with some specific facilities just before implementation of the system in the
    whole organization. This testing can provide with various outcomes which can offer
    detailed insights into the potential issues of performance and realistic usage.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Testing of signal coverage


    This method uses up a signal coverage tester which is also known as signal meter
    for properly measuring the signals of WLAN across the overall area of coverage.
    The main purpose of this type of testing is to make sure that the level of signal
    is up to the mark for supporting high level performance which is required by the
    user while using various web applications on WLAN.


    +   - Wireless survey of site coverage: The testing of coverage of signal often
    involves survey of wireless site. It is generally performed right before the installation
    of WLAN. It is carried on proper positioning of access test point across different
    locations. The locations are situated throughout the area of WLAN coverage. It
    uses the signal meter for the purpose of measuring the values of signals within
    the area of the access point of testing. The result of such survey helps in deciding
    the location of the final installation of the points of access.


    # Testing of performance


    This form of WLAN starts with the testing of association. This test ensures that
    the device types of the clients associate properly with one single or more than
    points of access which act as parts of the system which is installed. This is
    regarded as a beginner’s test for ensuring whether the devices of the clients
    are capable of establishing wireless connections. You need to confirm enough association
    prior to moving'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'forward with the other tests. This testing is of utter importance as sometimes
    the devices of the clients turn out to be non-compatible with the WLAN points
    of access.


    # Test of network connection


    For proper communication between the devices of the clients and the web application,
    the systems of wireless network use either UDP or TCP. In both the cases, it is
    ensured that the device of the client has connected successfully with the WLAN
    and also possesses an IP address which is valid in nature. This is typically done
    by observing the table of association which can be found easily in the points
    of access. It is a great mode of testing that will ensure that the device of the
    client is capable of reacting to a generated ping from the subnet which is of
    similar nature in which the application dwells. The result of the ping needs to
    indicate that the device of the client properly reacts to the generated ping sufficient
    delays with no timing out. In case the test of network connection shows a problem,
    make sure that the device of the client comes with a valid IP address and the
    firmware of the client''s device is upgraded along with the points of access.


    # Test of application connection


    It is to be ensured that each type of device of the client connects in a proper
    way with the application. With the help of wireless implementation of IP phone,
    it can be made sure that the phone registers in the proper way with the software
