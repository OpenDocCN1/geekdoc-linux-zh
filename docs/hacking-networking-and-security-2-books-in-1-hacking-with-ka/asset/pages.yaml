- pgno: 244
  md: '# Chapter 13: Security and Hacking of the Web


    # Web Hacking


    With the pace of time, the attacks of the web hackers are also increasing day
    by day. There is not a single day when someone hasn’t been the victim of a hacking
    attack. This becomes more terrifying you act as the owner of your website. It
    might happen that all the work that you have done on your website gets wiped out
    the next day or it has been altered completely. This happens only when your website
    gets attacked by a web hacker. The news of data breaching and hacks are all over
    the new in today’s world. You might also think that why would the hackers attack
    a small website of business? Well, nothing depends on the size of a website. It
    has also been found that 43% of data breaching is done from small business websites.
    So, it is clear that the attackers can victimize anyone they like.


    The hackers are turning out to be more sophisticated in their operation within
    a community of close-knitted web hacking. The hackers try to target the new intrusions
    of web application. This is because when a new intrusion is found, it takes some
    time for the developers to apply the counter measures. The hackers take advantage
    of such situations and attack the business websites. The intrusions which are
    discovered newly are posted on various hacking forums which inform the hackers
    about the intrusions and the sites. The most common form of attack is infecting
    the website with some sort of malicious code. Ultimately, the websites which are
    infected turn out to be the attack launching sites for the hackers and installs
    the malware on those systems of computers who visit that site.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Hacking of websites can be regarded as the result of adoption of technologies
    which are web-based for carrying out e-business. The applications on the web allow
    the organizations to seamlessly connect with the customers and with the suppliers.
    However, the vulnerability of such applications on the web has also opened up
    new doors for the attackers. The hackers opt for the vulnerable websites for various
    reasons such as data breaching, stealing of confidential information and many
    more.


    # Web hacking for stealing sensitive data


    When someone conducts online business, the website is bound to function with a
    wide collection of applications such as submission forms, shopping carts, dynamic
    content, login pages and many others. The web applications are constructed in
    such a way that allows the customers to submit and also retrieve various forms
    of dynamic content that includes different levels of sensitive as well as personal
    data. Such sensitive data is stored in the databases of the websites. As such
    websites need to be accessible 24*7 from any location in the world, the web applications
    which are insecure in nature opens up the doors for the web attacks on the corporate
    databases. In case the attacker gains access to the credit card and bank details
    of the customers, the business might turn out to be in great danger.


    # Web hacking for implementing phishing sites


    It might happen that the database of a business is not online or is secured already.
    However, in spite of such facts, it does not make the web site less'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'susceptible to the attacks. Hackers trace weak and small sites for the purpose
    of injecting malware into the sites. They also look out for vulnerable applications
    for tricking the users and then redirecting them to the phishing sites. Phishing
    sites are used for retrieving the bank details of the users. Such attacks are
    mainly targeted against the services of online payment can turn out to be the
    result of either SQL injection or any other type of hacking that can also be performed
    when the database and the servers contain no susceptibilities.


    # Securing websites from hackers


    There are various ways in which the websites can be protected from the hacking
    attacks. You can start by installing plug-ins of security on your website. The
    website security plug-ins helps in improving the security of a website and also
    prevents any form of attempt of hacking. There are various forms of security plug-ins
    which are meant for websites of different formats such as Sucuri for WordPress,
    Amasty for Magento and RSFirewall for Joomla. Make sure that the website that
    you are constructing comes with HTTPS as SSL certificate is essential for protecting
    the details of the users such as personal data and credit card information.'
  merge: -1
  img_proc: true
- pgno: 247
