- pgno: 35
  md: '# Chapter 6: OSI Model


    OSI model or Open System Interconnection model is a model which has been created
    for enabling diverse systems of communication communicating with the use of various
    standard protocols. In simple words, OSI provides a network standard for the different
    systems of computer for communicating with each other. The OSI model is also regarded
    as the universal language for networking. It is based on a concept in which a
    communication system is split into seven different layers each of the layers are
    stacked upon one another. Each layer of the model performs a specific function
    and also communicates with the layers above it and below that layer.


    # Importance of the OSI model


    The modern internet structure does not follow the structure of OSI model strictly
    but it is still useful for the purpose of network problems troubleshooting. Whether
    it is just one single person who is unable to connect his PC with the internet
    or a huge website which is down that serves thousands of users, OSI model helps
    in breaking down the main problem in layers and also isolates the trouble source.


    # Seven layers of the OSI model


    The seven layers of the OSI model are stacked in inverted order which means that
    the 7th layer at the top and the 1st layer at the bottom.


    # Application Layer'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'This layer is the one which interacts directly with the user data. Various
    software applications like email clients and web browsers depend on this OSI model
    for initiation of communication. However, it needs to be clear that the software
    applications of the clients are not a part of this layer. The application layer
    is liable for manipulation of data and protocols on which the software relies
    on for presenting data which is meaningful for the user. This layer includes both
    HTTP and SMTP.


    # Presentation Layer


    The presentation layer is liable for data preparation which can be used by the
    application layer on top of it. In simple words, this layer transforms data in
    presentable form so that it can be consumed by the applications. This layer is
    liable for encryption, translation and also data compression. The 6th layer is
    responsible for the translation of incoming data into a simpler syntax so that
    it can be understood by the application layer on top of it. In case the devices
    are communicating with each other over a connection which is encrypted in nature,
    this layer applies encryption to the sender''s end and also decodes the data on
    the end of the receiver so that the data can be presented to the application layer
    in a readable and unencrypted format. It also helps in data compression before
    delivering data to the 5th layer.


    # Session Layer


    The session layer is responsible for the closing and opening of the system of
    communication between two devices in a network. Session is the time in between
    the opening and closing of the communication. This layer'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'makes sure that the communication stays in the open state till the time before
    the data exchange has been done.


    # Transport Layer


    This layer is liable for communication between two devices as an end to end communication.
    This whole process involves data collection from the session layer and then breaking
    them into segments just before sending them out to the 3rd layer. This layer on
    the recipient device is liable for segment reassembling into complete data so
    that it can be consumed by the session layer. This layer also takes care of flow
    and error control. Flow control helps in determining a normal speed for transmission
    so that a sender who is having a fast connection does not deluge the receiver
    who is having a slow connection.


    # Network Layer


    This layer is liable for allowing transfer of data between two different forms
    of networks. In case both the devices in the communication are functioning on
    the similar network, this layer becomes unnecessary in such case. This layer breaks
    up the segments from the transport layer above it into various smaller units known
    as packets on the device of the sender and the reassembles the packets on the
    device of the receiver.


    # Data Link Layer


    This layer is very much similar to that of the network layer. The only difference
    is that this layer allows transfer of data between two devices'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'which are on the same network. This layer takes packets from the network layer
    and then breaks them into frames.


    # Physical Layer


    This layer involves all the physical form of equipments which are used in the
    transfer of data like switches and cables. This layer also converts data into
    bit stream in which the string is of 0s and 1s. The physical layer present in
    both the devices needs to agree on the convention of the signal so that it is
    possible to distinguish 1s from 0s in both the devices.'
  merge: -1
  img_proc: true
