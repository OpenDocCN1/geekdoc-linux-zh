- pgno: 233
  md: '# Chapter 11: Testing of Wireless Network Security


    Wireless communication is an invisible form of communication which is invisible
    in nature and is also omnipresent. It allows seamless flow of data in and out
    of homes and from business organizations through various devices and infrastructure
    of wireless connection. Most of the modern form of business organizations have
    set up some form of wireless networking, mainly Wi-Fi within their organization.
    However, proper implementation of such services is not able to see the type of
    attention it actually requires. Various segments of networking such as VLAN routing,
    segmentation of network and SSID controls are required to be defined in clear
    form and also set up. It will allow the users to easily connect with the network
    and use the related services along keeping away the intruders and the third parties,
    much away from the network.


    Regardless of the fact that a lot of or very less consideration has been entitled
    for the setting up of the wireless network, the organizations are required to
    hunt out any form of weakness within the wall of security of the network for the
    purpose of avoiding any form of unethical and unauthorized access to the resources
    of the network and prevention of data leakage.


    # Wireless network penetration testing


    Penetration testing or pentesting of wireless network is nothing but scanning
    a network for any form of discrepancy within the security wall. In case when an
    organization fails to adapt proper pentesting for the'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'wireless networks, it results in data theft as well as unauthorized access
    to all the resources of the network. Proper security measures can help in preventing
    all forms of data leakage along with ensuring the data security of a business.


    # Steps to be taken at the time of wireless network pentest


    The steps that need to be taken will depend completely on the standards which
    are being followed for the penetration testing along with the methods agreed to
    by the company and the areas of testing. In general terms, the process of pentesting
    begins with the gathering of information and intelligence. It will be creating
    a map of heating for the area which is tested. It will track the footprint along
    with the size of the signal which is being broadcasted by the wireless network.
    Various other forms of information such as total number of SSIDs which are being
    broadcasted, configuration of the network, installed hardware and many others
    are also required to be collected. You can also start by creating a proper site
    map of the network.


    The second step is to find out the form of threats which a company can be vulnerable
    to. It will be based on the hardware which is installed on the site, the network
    equipment visibility right behind the infrastructure of Wi-Fi and the distance
    to which the signal of Wi-Fi can be detected outside the property of business.
    Questions such as are there any open file'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'shares which can is accessible over the network of Wi-Fi and many others are
    the basic questions that a pentester needs to begin with.


    The analysis of vulnerability test is carried out using specialized tools which
    are used by the pentester that will easily inform the tester about the form of
    exploitation to which the organization is susceptible to. In case, any form of
    susceptibility is identified, it needs to be exploited right away and then use
    the same to a point that will breach the security. The pentester can easily show
    the client about the susceptibility extent with this step. With proper pentesting,
    it can also be identified that what type of tool was used for attacking the wireless
    network.


    Once the threats have proved to work, the pentester continues scanning the overall
    network and then establish the extent to which the threat will be able to exploit
    the permissions of the users along with data breach. After all, these have been
    done, a report is presented to the client with the details of the threats and
    the security holes within the system. The client is supposed to modify the security
    measures according to the report. The pentester tests the network again with the
    same form of exploits to check whether the modified security forms are able to
    defend the attacks or not.


    In general, the wireless penetration testing is carried on in two phases: active
    and passive. In the passive phase, all sort of information is collected and in
    the active phase, the threats are tested for the network. This whole thing can
    also be done by an attacker who is trying to target an organization for data breaching.'
  merge: -1
  img_proc: true
- pgno: 236
