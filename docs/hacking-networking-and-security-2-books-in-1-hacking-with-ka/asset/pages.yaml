- pgno: 183
  md: '# # Chapter 7: Cybersecurity


    With the advancement in the world of technology, the task of information gathering
    and dissemination of the same has turned out to be a very easy job. With high
    power machines and operating systems like Linux, the task of securing the same
    has been made much easier. However, with the picture of growth of any sector,
    comes along various threats and disadvantages. In the growing world of IT today,
    the security and attacks are increasing its power day by day and that too at a
    massive rate of progress. That is why, having a very powerful background in the
    concept of core security is of utter importance. When you start running a business
    or organization without proper knowledge about cybersecurity it might result in
    exposing various essential and confidential details of your work or even about
    individuals.


    # Cybersecurity in details


    Cybersecurity is nothing but protection of your networks, systems and various
    programs from the attacks digitally. The cyber attacks are generally targeted
    at changing, accessing and destroying of very sensitive data, money extortion
    from the users and also interruption in the processing of businesses. Cybersecurity
    is also known as electronic information or information technology security. Now,
    you might be thinking that what is cyber attack then? It is a deliberate and malicious
    form of attempt by a hacker in general or also maybe by an organization for the
    purpose of breaching organizational data.


    The term cybersecurity in various contexts'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The term cybersecurity can be applied in various contexts, starting from mobile
    computing to businesses. It can also be divided into some common categories as
    well.


    +   - **Network security**: It is the term used for practising cybersecurity for
    securing the network of a computer from the attackers, whether from malware which
    is opportunistic or targeted hackers.


    +   - **Application security**: It is focused on keeping your devices and software
    free from the various forms of threats. Any form of compromised application can
    easily give access to all those data which it is meant to protect.


    +   - **Information security**: This helps in protecting the privacy along with
    the integrity of your data, which are both in transit as well as in storage.


    +   - **Disaster recovery**: This term defines how an organization is supposed
    to respond to any kind of cybersecurity incident or any other type of event that
    might lead to loss of data or operations. The policies of disaster recovery dictate
    the way in which an organization restores all its information regarding operations
    right in the same capacity of operation as it used to function before the event.


    +   - **Operational security**: It includes all those processes along with the
    decisions required for protecting along with handling of all your data assets.
    The user permissions along with the access policies of a network, the procedure
    of data storage and'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'where it is stored all come under the umbrella of operational security.


    +   Education of end-user: This addresses one of the most uncertain factors that
    come with cybersecurity which is people. Any person can unknowingly introduce
    a malicious virus within a system which is super secure by not being able to follow
    the required measures of security practice. Teaching all the users of a system
    to remove all types of suspicious attachments that come with emails, not plugging
    any kind of unidentified hard drive or USB drive along with various other lessons
    is important for the organizational security.


    # Why is cybersecurity so important?


    The world of today is dependent on technology more than it was any before. That
    is why there has been a noticeable surge in the creation of digital data. Today,
    most of the business organizations along with the government stores up maximum
    of their confidential and important data on the computer machines. For the purpose
    of transmitting those across various sections of an organization or between various
    departments of government, they use network. The devices along with their base
    systems are accessible very easily when exploited from outside source. This, in
    turn, undermines the overall health along with the objectives of the organizations.


    Breaching of data can result in a devastating condition for an organization, especially
    at a time when all the organizations use networks for data transmission that includes
    government, corporate, medical, financial and'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'military organizations. It might turn out to be a threat for national security
    as well when confidential data is leaked from the government networks. A large
    portion of such data might turn out to be ultra-sensitive in nature, whether the
    data is financial data, intellectual data, information of individuals or any other
    form of data. Cybersecurity helps in describing the form of discipline which is
    required for the protection of data and data systems which are being used for
    processing and storing of data.


    Data breach can also have a huge impact on the corporate revenues just because
    not following the regulations of data protection properly. According to some recent
    studies, a data breach on an average can cost an organization about $3.8 million.
    As the volume along with the sophistication of cyber attacks are developing day
    by day, the organizations and those bodies which are entitled with the task of
    information safeguarding in relation to national health, security and financial
    records, are required to take necessary steps for protecting all forms of personnel
    as well as business data. According to a recent survey in the year 2016, it has
    been cautioned that the acts of digital spying and cyber attacks are the most
    dangerous threat to the security of a nation, much more even than terrorism. So,
    the organizations are required to implement and adopt strong approaches towards
    cybersecurity.


    # Various types of threats related to cybersecurity


    +   - Ransomware: It is a kind of dangerous malicious software which has been
    designed for the purpose of money extortion by blocking away file access or networking
    system until and unless the amount of ransom is paid. However, there have'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'been various cases where the access to the files or the systems was still blocked
    after payment of the ransom.


    +   **Malware**: Malware is nothing but malicious software. It includes various
    types of software such as ransomware, spyware, worms and viruses as well. The
    functioning of malware is very simple so the user cannot even detect any kind
    of breaching in the network. It is done by taking advantage of the vulnerability
    of a network when any user clicks on any dangerous email attachment or link that
    readily installs the risky software in the system. Once the malware has been installed
    in the system, it can do anything it wants such as:


    +   1. Blocking of access to the network key components


    +   2. Installation of other harmful software


    +   3. Obtains information from the storage drive without even letting the user
    know


    +   4. Disrupt various components of a system and then leave the system fatal.


    +   **Phishing**: It is the practice of cyber attack where fraudulent communication
    is sent and appears as a genuine form of communication from any kind of reputable
    source. It is most commonly done via email. The primary goal of this type of attack
    is to steal confidential personal data such as credit card details, information
    regarding login and many more. This form of cyber threat is increasing day by
    day.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   * MitM: It is also known as man in the middle attack or eavesdropping attack.
    It takes place when the attackers place themselves in between a two-party communication.
    Once the attackers are successful in interrupting the traffic, they can easily
    filter out and steal relevant data. There are two very common points of entry
    for the MitM attackers:


    +        01. By accessing through public Wi-Fi which is not secure at all, the
    attackers can easily place themselves in between the device of a user and the
    network. The user, without even knowing, passes all the relevant information via
    the attacker to the network which results in data breach.


    +        02. When a malware has breached the device of a user, the attacker can
    install any form of software for processing out all the information of the victim
    user.


    +   * Social engineering: This is a tactic used by the attackers for tricking
    the user into exposing various forms of sensitive and personal information. The
    attackers can easily engulf over any form of monetary form of payment or even
    gain all-over access to the confidential data. It is generally done by combining
    with any other form of cyber attack such as malware.


    +   * DoS attack: DoS or denial of service, floods the servers, systems or networks
    with huge amount of traffic for exhausting up the bandwidth along with the resources.
    In return, the system of the network becomes unable to carry out the legitimate
    requests. The attackers can use up several'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'devices for launching this type of attacks which are known as DDoS attacks.


    +   **SQL injection**: Also known as Structured Query Language injection, it occurs
    when the attackers insert various harmful and malicious form of codes into the
    server that functions with SQL. In this, turn, forces the victim server to reveal
    all forms of confidential information. Attackers can perform SQL injection by
    simply inserting malicious codes into any form of search box.


    +   **Zero-day exploit**: This attack hits only after the announcement of vulnerability
    of a network. It is generally done right before a solution or patch is being implemented.
    The attackers try to attack the vulnerability of the network during this time
    frame. The detection of this type of attack requires immediate attention.


    # Challenges regarding cybersecurity


    For an all-round system of cybersecurity, a company or organization is required
    to coordinate all its available efforts within the overall system of business
    operation. The hardest form of challenge that comes in cybersecurity is the everyday
    growing structure of the risks in security within itself. In the past years, the
    government bodies along with the business organizations used to focus only on
    their own resources of cybersecurity for the sole purpose of security of their
    perimeter for protecting only those components of their system which are crucial
    in nature. They used to defend only against the known threats. But, in today’s'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'world of cybersecurity, this form of approach is not at all sufficient. This
    is mainly because of the fact that the threats have evolved in size and advancing
    day by day. The threats of today are on the verge of changing themselves much
    before the organizations can learn to cope up with the older versions of the threats.
    This, in turn, results in the promotion of the advisory organizations for more
    adaptive along with proactive form of approach towards cybersecurity. The NIST
    or National Institute of Standards and Technology also issued various guidelines
    in the framework of assessment of risk that strongly recommends a steep shift
    in the way of regular monitoring along with on-time assessments, which will be
    focusing on an approach which will be focused on data for security directly in
    opposite to the traditional model which was based on perimeter.


    # Management of cybersecurity


    According to NCSA or National Cybersecurity Alliance, the organizations are required
    to be completely ready for responding to the incidents of cyber attacks. It is
    necessary for restoring the normal mode of business operations and also for ensuring
    that the assets of the organization along with its reputation are not in stake
    or danger. The guidelines primarily focus on three different areas: identification
    of the most important data that needs ultimate protection, identification of the
    added risks in relevance to the information and planning out the possible loss
    or damage that the organization might face if the information gets exposed is
    breached. The assessment regarding cyber risk also requires all the types of regulations
    that might impact the procedure of data collection, storing of data and securing
    the same, like HIPAA, FISMA, SOX, PCI-DSS and many others.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'With thorough assessment of cyber risk, you need to develop and also implement
    the plans for mitigating all types of risk related to cyber attack, protection
    of the prized possession of the company as outlined in the assessment and also
    detecting and responding to the security breaching incidents. This whole plan
    of managing your cybersecurity needs to encompass both technology and the processes
    which are required for building up a program of cybersecurity which is also mature
    in nature. The cybersecurity programs are required to cope up with and handle
    the sophisticated style of attacks which are carried out by the attackers. Organizations
    can combine a sound system of cybersecurity along with a powerful base of security
    employee in order to come up with the best security defense in opposite to the
    network attackers who are trying to access the confidential data of the organization.


    # Cybersecurity and the C.I.A. triad


    When it comes to security models for cybersecurity, the C.I.A. triad is regarded
    as the most valid model of security. The security model includes three different
    main principles which are confidentiality, integrity along with availability.
    These three key principles are required for ensuring any type of system related
    to security. The principles which are included within the C.I.A. triad are regarded
    as the heart or prime component of data or information security. This model is
    applicable for all forms of security analysis.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Confidentiality


    Confidentiality is nothing but privacy, only with very little difference in between
    the two. Confidentiality makes sure that no individual can view or access the
    resources which are super sensitive in nature without any form of proper authorization.
    In simple words, only the person who has been authorized as a user is permitted
    for the access or to view the related information in the network. The prime motive
    of the principle of confidentiality is to main all the secrets of an organization
    as secrets. This principle is directed to the safeguarding of all forms of sensitive
    details from going exposed or breached due to the interference of unwanted individuals
    or groups. So, the principle of confidentiality is related to the all-round protection
    of organizational details which is accessible and visible to only those people
    who have been given the required access privileges. Financial transactions, plans
    related to business and medical details are some of the examples of the details
    that need to be kept confidential for the protection of information.


    # How can confidentiality be maintained properly?


    The maintenance of confidentiality along with ensuring the same is of utter importance
    for protection of data that comes with the risk of being leaked to the third parties
    and that might lead to potential loss or damage. The most common ways of maintaining
    confidentiality are:'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   **Steganography:** It is the technique which is used for hiding away any
    piece of secret and important information in the form of a simple image or text.


    +   **Cryptography:** This technique comes with the process of code generation,
    which in turn allows both the parties within a communication to communicate with
    each other by authenticating their identity with the help of secretive keys.


    +   **Access control:** This is the most widely used form of maintaining confidentiality.
    It takes into account proper mechanism of access control for preventing any form
    of unauthenticated along with unauthorized access of information or data.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Integrity


    Integrity is nothing but the assurance of completeness, trustworthiness along
    with accuracy of all kinds of sensitive data and information. It makes sure that
    no person can alter the existing information in the overall lifecycle of the data.
    It involves dissemination of protective steps for preventing all types of unauthenticated
    data alteration which is in transit. When the organizations fail to ensure integrity
    of information, they open up the doors to huge number of malware since it will
    be the prime target of all the attackers. There are various factors that ultimately
    compromise the overall functioning of integrity such as malicious users, computer
    virus, software errors and failure of hardware. With a rapid growth in the rate
    of corruption and sabotaging of data integrity, the integrity of data is turning
    out to be a huge concern for all the organizations and there is has a huge search
    for the ways in order to avoid the attacks.


    How can integrity be ensured?


    There are three primary ways in which the organizations ensure integrity of their
    data. They are:


    +   * Hashing: It comes with data integrity by simply combining the function of
    hash along with a secret key which is shared.


    +   * Validation of input: It makes sure of data integrity by validating or restricting
    those values which are entered by the users.


    +   * Digital signature: It comes with a unique technique of mathematics that
    ensures there is no type of alteration or modification in the sent message.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Availability


    A very common picture in most of the organizations today is that they find out
    that their main resources are not at all responding or is not available for the
    clients. The websites of the organizations are also getting slower or are not
    reachable as well. But, how are the organizations supposed to react to this serious
    issue? That is where the ultimate assurance of 100% availability of service comes
    in the picture.


    When a situation arises when one particular system is not functioning properly
    and the data of that site is available very easily and is not at all secure as
    well, it affects a lot to lot the availability of information with the security
    of the site being affected as well. So, the enforcement of the application being
    available or the users using the available resources as required within a controlled
    environment is of utter importance. Another factor that affects the availability
    of resources is time. This is mainly because, when a system is not capable of
    delivering the services or the required details within time, the availability
    of the resources is also compromised within lot. So, it is required to provide
    the information to the authorized user within a definite period of time.


    The services and products are generally described in accordance with the availability
    of data which in turn guarantees the availability of data for the user within
    a specific performance range in any kind of situation. Dos or Denial of Service
    attack always targets the availability of the systems simply by flooding the server
    with huge amount of traffic. This attack single-handedly can force a system to
    shutdown.


    # Authorization, Authentication and Accountability'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Also, known as A.A.A, it is a term which is used for controlling the overall
    access to the resources of the system, enforcing policies, auditing usage and
    offering the need for details for taking charge of the services.


    # Authorization


    It ensures that the users include all the privilege or permission which is required
    for performing a specific type of action. For instance, when a user is playing
    the role of network access, it should only have the rights of accessing with the
    actions of the network and nothing more than that. The user who has the access
    to the network only, is not allowed with any other access permission such as storage
    or any other type of network component. The actions of authorization and authentication
    are interrelated to each other. Also, it is to be noted that the process of valid
    authorization starts only after a successful process of authentication.


    # Authentication


    It generally deals with all forms of personal identification. It comprises of
    the mechanism required for the process of validation of the incoming requests
    against to some identifying credentials. The verification of identity is done
    in three ways:


    +   - Knowledge: It is based on something the user knows or based on the knowledge
    of the user


    +   - Characteristics: It is based on the characteristics of the user'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   • Ownership: It is based on something you are having or based on the ownership
    of the user


    # Accountability


    This is the third pillar of the framework of A.A.A. This pillar of A.A.A offers
    the administrators with the power to easily track the activities of a user based
    on a specific situation. It is the primary procedure for viewing the utilized
    services and also the quantity of the resources which has been used up by the
    users. In general, the enforcement of accountability is done by performing the
    audits too as establishing the systems for making and keeping the trails of audit.
    This form of management of logs can be very effective in respect to the accountability
    of IT and security of data. It administers that the actions can be determined
    easily and can also be traced back.


    # Access control


    This is an aspect of the entire security of a network that manages how the users
    as well as the systems communicate with each other and also use up the resources.
    For enforcing ultimate security of the system, it is very essential to control
    all the resources with every system access along ensuring that only the authorized
    personnel are allowed the access. This feature is very useful for protecting the
    unauthorized destruction, modification, disclosure along with corruption of the
    system resources. This functions as the first defense line for avoiding unauthorized
    entry along'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'with access. It comes with a variety of controls that prohibits the access
    to all the resources of the system based on the group identity, membership, logical
    & physical location along with clearance. The access can take the form of permission
    for entering, consuming, restricting, controlling and protecting the system resources
    for guaranteeing the A.A.A framework in the system.


    # Non-repudiation


    This deals with making of the evidences for proving various actions. This feature
    is all about justifying that an action or an event has happened that is not possible
    for repudiating at a later time. This can be achieved easily by using:


    +   - Timestamps: It comes with the date and time when the composition of the
    document was done for generating evidences that the composed document was there
    at a certain time.


    +   - Digital signature: Adding up to the integrity of data, the digital signatures
    make sure of the identity of the sender. It generally enforces the identity that
    cannot be denied by the sender later.


    # Non-repudiation levels


    For experiencing complete non-repudiation communication level, it is important
    for ensuring the sam at three different levels:


    +   - Of origin: This can be very easily ensured by sending the data with certificates
    and digital signatures.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '+   * At delivery: This can be ensured with the acknowledgement of the recipient.


    +   * For submission: This can be ensured simply by sending the delivery recipient
    directly to the sender.


    # Evolution of cybersecurity


    The traditional form of cybersecurity is constricted only around the usage of
    defensive measures within a specific boundary. Several initiatives of enablement
    just like BYOD or bring your own device and remote workers policy have helped
    in completely dissolving the boundary and have also expanded the surface of attack.
    Today, the incidents of data breaching are developing rapidly despite of the huge
    amounts of spending on security. Most of the global organizations are turning
    towards a new kind of approach towards cybersecurity which is completely human-centric.
    This new approach focuses on the rapid changes in the behavior of the users in
    place of just tracking the growing number of threats. This form of cybersecurity
    helps in providing deep insights into the interaction of end-user with the data
    and also extends the controls of security of all systems.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '![](img/dfdb59329a06b0e4d53fac932c198967_200_0.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Chapter 8: The Threat of Malware and Cyber Attacks


    # Malware


    Every year, there are various campaigns launched by the medical communities for
    protecting everyone from flu by giving them flu shots. The outbreaks of flu have
    a particular season, a fixed time when it starts to spread and infects people.
    When it comes to the world of technology, they are also infected by flu. However,
    there is no predictable season for the infections of smartphones, PCs, tablets,
    organizational networks, servers etc. It is always a season of flu for the world
    of technology. But, the flu of the technology world is completely different from
    that of the human world. It is known as malware.


    Malware, also known as malicious software is the term which is used for describing
    any type of malicious or harmful code or program which is dangerous for the health
    of a system or network. The malware is intrusive in nature, invades the systems
    and damages the system of computer, network and mobile devices. Some malware is
    so dangerous in nature that they can even take over the functioning of a system.
    Malware cannot damage the hardware of the systems; however, it can steal, delete
    or encrypt confidential data without the permission of the user.


    # Most common ways of getting malware in the system


    When it comes to malware, it can enter the system via various pathways. However,
    two of the most common pathways via which malware access'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'the systems are email and internet. So, it can be said that malware can enter
    a system whenever the user is connected to the internet if proper methods are
    not adhered to for the security of the system. Malware can get into computer systems
    when anyone surfs through websites which have been hacked, click on demos of games,
    install malicious toolbars in the browser, open a dicey form of mail attachment
    and many more. In short, any sort of item which is browsed online that lacks in
    proper security measures in the systems. Malware attacks can never function without
    the most important component which is the user. It depends on the user what they
    browse and they need to take care that the items they are using on the internet
    are actually safe and authenticated.


    A user can make gateway for malware when they install a software from a credible
    source as if proper attention is not paid to the request of permission at the
    time of installing.


    # Common types of Malware


    When it comes to malware and to its types, the list is huge. Here are the most
    common types of malware:


    +   - Adware: This is a form of unwanted software which has been designed for
    throwing up unwanted advertisements on the screen of the user and is most commonly
    found while using a web browser. Generally, this type of malware hides itself
    as being legit and tricks the users in installing the same on their PC or mobile
    device. Such malware might turn out to be really'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'dangerous and the most common form of target of this malware is credit card
    and bank details.


    +   **Spyware**: This malware can easily be understood by its name “spy”ware.
    Just like a spy, such software observes the activities of the users in a secret
    way and reports the recorded activities to the author of the software. Such malware
    function in a secretive way without even letting the user to know that his actions
    are being watched.


    +   **Virus**: This is a form of malware that attaches itself to some other program.
    When such infected programs are executed, generally without any attention of the
    user, the malware replicates by the process of modification of other programs
    and infects the other related programs with its infected series of codes.


    +   **Worms**: Worms are similar to viruses only and are also self-replicating
    nature. It generally spreads via the computer networks and causes harm to the
    same network by destroying the important files and data.


    +   **Trojan**: Also known as Trojan horse, it is regarded as the deadliest type
