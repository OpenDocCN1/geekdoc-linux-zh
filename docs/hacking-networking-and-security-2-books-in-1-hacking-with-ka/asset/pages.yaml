  md: '# Chapter 5: Insights on Kali Linux Concepts


    Linux has been well-known as one of the most powerful operating systems in the
    world of cybersecurity and coding. Among its various components, Kali Linux is
    one of the distributions which can be treated like a boon for the ethical hackers
    and the IT people. However, everything comes with a number of problems. In this
    world of today, people have excessive trust in Kali Linux capabilities by default
    only. As the end result, most of the users are not paying attention to the various
    manual aspects of the Linux security. It is true that Linux, you can automate
    many of your tasks. However, it also requires some manual touch for keeping everything
    with the pace. This fact even becomes more evident when it comes to the concept
    of security.


    # You are required to be more attentive


    Though an operating system might automate all your tasks, it is your task to be
    anxious always. You are required to keep a close eye on the settings of our application
    and various other details. When you have a well-configured system of Kali Linux,
    it might turn out to be the most difficult thing to crack. However, most of the
    users of Kali Linux do not have profound knowledge about what is required for
    keeping their systems locked up. In case you start using a brand-new application,
    try to pay very close attention to the details of its configuration. Running the
    application with the same example settings and then using it is not the ideal
    option. It is not at all recommended. Some of the developers in the past also
    put decoy settings in the applications for making sure that the applications are
    prevented from running. This was a great way for'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'ensuring that all the users have checked out the file of configuration of the
    application.


    # Handling all the permissions in the right way


    When it comes to permissions, it forms an essential part of Linux. It is very
    important for a user to clearly understand how and every permission function along
    with the implications of the various components of the OS. In case you are shifting
    from Windows to Linux, the generalized concept might be a bit different and awkward
    for you. The general rule of Kali Linux is that you are not supposed to use root
    for your daily work. This might sound like a bit of a surprise for all the Windows
    users in which the operating system handles the various permissions which are
    critical in nature in a different way. It is surely an inconvenient function where
    you are required to type password each and every time when you want the machine
    to execute a function. However, it is practical as well as it will surely help
    in preventing some serious security problem of your machine in the future.


    # Kali Linux does have viruses


    Linux comes with a widespread reputation of being virus-free. It is really a surprising
    thing for all the newcomers. However, in actual, the picture is completely different.
    Linux is less popular as an operating system as compared to Windows or Mac. So,
    it is not much targeted by the hackers'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'and so the development of viruses for Linux is not much. But, Kali Linux malwares
    exist. The malwares of Linux are even more destructive than the counterparts of
    Windows. This might turn out to be more dangerous for all those Kali Linux users
    who avoid to pay attention to the application permissions and various other core
    concepts of Linux security.


    # The security tools are available


    When you start using Kali Linux, you will find out that the security tools that
    used earlier are not available for Linux. This is a very common scenario for most
    of the antivirus solutions. The developers of antivirus cannot maintain completely
    two different versions for the same application along with two different underlying
