- pgno: 29
  md: '# # Chapter 5: Basic Components of Computer Networking


    Computer networking functions with various components. All the components work
    together and make data transfer possible from one system to another and help in
    establishing a smooth connection between the sender and the receiver. A computer
    network works with one or more than one servers, network interface cards or NIC,
    passive and active hub, gateways, bridges, modem, routers, software like OS for
    networking and many more.


    # ## Server


    It is regarded as the mother of a network. It is the most powerful system within
    a network. In the case of LAN, a powerful computer is generally used as the server.
    In computer networking, two types of servers are used: dedicated and non-dedicated.
    A dedicated server performs all the services and functions in a network. It helps
    in running the user applications and also helps in improving the overall cost
    of the system. However, in a dedicated server, the users cannot directly run their
    applications. A dedicated server provides the users with sharing of various hard
    disks, service regarding email along with sharing of several other data and resources.
    It comes with a very fast time of response. For all those networks where it is
    required to handle heavy loads, dedicated servers are employed usually.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'In the case of the non-dedicated server, it also functions as a workstation
    besides functioning as the controller of network. It comes equipped with a prodigious
    form of memory. The network in which this server is used uses up only a portion
    of the memory of the server. The rest of the server memory is used for applications
    of the users. It is useful for light traffic load condition.


    # Networking hardware


    Network hardware is those devices which are used for interconnecting the various
    components of a network like the network cards, connection between the servers
    and the workstations that connect the peripherals to the network.


    # Resource sharing


    These are the resources of both hardware and software devices. The most commonly
    found hardware devices are drives, printers, hard disks, CD drives etc. The software
    resources include programs, applications, files etc.


    # File Server


    The main goal of computer networking is to share information and data among various
    users. The users also make their printers, disk drives and other links of communication
    with other client stations as well. The client systems can raise a request to
    access the shared facility from the server. The file server runs on a special
    software and is generally'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'served by a powerful system of computer. It helps in sharing files and other
    resources to all the users within a network. File server provides other facilities
    such as authentication of user, program and data security and many more. It generally
    operates via NOS. All the file server activities are controlled and monitored
    from the console. The prodigious memory of the file server is used for caching
    of files and directories.


    # Workstation


    Workstation is regarded as a critical component of a network system. It is also
    known as the client system. It comes with the capability of connecting and communicating
    with all other machines in a network. However, for a workstation to function properly,
    it is required to comply with the software and hardware of the LAN. A workstation
    is capable of communicating with the server for getting data and other resources.
    The hardware which is required by the workstation depends completely on the size
    and application of the network.


    # NIC


    Also known as network interface card, it serves as an add-on card for the computers
    in a network. It is also called network interface adapter or Ethernet adapter.
    NIC performs the function of moving the signals across the cables of the network
    into a parallel stream of data directly inside the systems of the computers. You
    can use more than one NIC for splitting the load in the network.


    # Hub'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'It is a centralized point of distribution which is required for transmission
    of data in the network. The hub is generally used for receiving the data packets
    and then reproicast them to all the other computer systems which are connected
    with it. It is a passive device in nature. The destination of the received data
    packet is unknown to the hub. Hubs can be easily classified into three categories:


    +   - Stackable and non-stackable: The stackable hubs are those hubs which can
    be interconnected for making a single hub. The non-stackable hubs cannot be connected.

    * Active and passive: Active hubs are those which connect to the backbone of the
    network. The hubs which only connect with the active hubs are the passive hubs.

    * Intelligent and non-intelligent: Intelligent hubs come with a special type of
    firmware which can also be accessed by the workstations which are remote in nature.
    The non-intelligent hubs come without any form of firmware.


    # Bridge


    It is used for interconnecting two different networks by the use of the same technology
    like Ethernet. It reads the address of the destination of the received packet
    and also makes sure that the destination address is also on the similar network
    segment as the origin. In LAN, local bridges are being used for connecting two
    different segments.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Gateway


    Two networks which are different in nature can be connected with the use of a
    gateway. It converts the data format which is sent in between the networks.


    # Modem


    It helps in facilitating two-way communication in between a telephone network
    and a computer network.'
  merge: -1
  img_proc: true
