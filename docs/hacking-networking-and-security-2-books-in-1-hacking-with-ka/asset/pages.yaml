- pgno: 221
  md: '# # Chapter 9: Server and Network Scanning


    Network and server scanning is nothing but using of computer networks for gathering
    information related to the system of computers. This form of scanning is mainly
    done for assessment of security, maintenance of system and also for attacking
    the systems by hackers. The purposes of scanning are:


    +   * Recognizing all the available TCP and UDP networks which are running of
    the hosts which are targeted

    * Recognizing systems of filtering in between the host which is targeted and between
    the user

    * Determining the OS which is in use after assessing the responses of the IP address

    * Evaluating the TCP sequence number of the target host for the purpose of prediction
    sequence attack and for spoofing of TCP


    # Network scanning


    When it comes to network scanning, it includes scanning of network port along
    with scanning for vulnerability. The scanning of network port is the method by
    which the data packets are sent through the network to the system of a computer
    with specified numbers of service ports. This is used for identifying all the
    network services which are available on a specific system. This method is very
    useful for troubleshooting of system related issues and also for gearing up the
    security of a system.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Vulnerability scanning is used for detecting the vulnerabilities which are
    present within a system of computer available right on the network. It helps in
    the detection of particular weak spots in the OS or software which might be used
    against the system for crashing down the system or for any other form of undesired
    attack. Both scanning of network port and scanning for vulnerability are techniques
    of information gathering. But, when such actions are performed by any other third
    party, it might turn out to be the introduction of an undesired attack.


    The processes of network scanning such as ping sweeps and port scans return valuable
    details about the map of IP addresses which hosts live along with the services
    it provides. Another form of network scanning is also used which is called inverse
    mapping. This process gathers all the details about the IP addresses that are
    not capable of mapping to the live hosts and, in turn, helps the attackers in
    focusing on the various advantageous addresses.


    Network scanning is one of those methods which are used by the attackers for gathering
    relevant information about a network or the target system. At the stage of footprint,
    the hacker creates a designated profile of the target system or network. This
    includes all forms of relevant information about an organization such as the DNS
    of the organization, the range of the IP addresses and also the servers of email.
    At the stage of scanning, the attacker tries to find out all the details about
    a particular IP address which is accessible online, the architecture of the system,
    the operating systems which are used along with the services which are running
    on the computers of the organization. At the stage of enumeration, the attacker
    tries to collect all relevant data that also includes the tables of routing, network'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'group and user names, SNMP or simple network management protocol data and many
    others.


    # Why are server and network scanning required?


    Server and network scanning are very much required in this world of today where
    all the systems are vulnerable to the attacks of cyber criminals. With the shifting
    of storage from the physical database to the online version, the rate of cyber
    attack is also increasing day by day. The organizations are required to perform
    server and network scanning for preventing the following scenarios:


    +   - Loss in the trust of the customers

    - Complete disturbance of the online form of collection or generation of revenue

    - Website crashing, loss of time and expenditures for the purpose of damage recovery

    - The cost of securing the application on the web from further cyber attacks

    - Loss of confidential data that might result in the downfall of an organization


    # Natures of server scanning


    Server scanning can be performed in a variety of ways. Let’s have a look at them.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '+   Active scanning: This is the process which is used for identifying the
    services of a network simply by transmitting probe packets directly towards the
    hosts of the network and the devices and then monitoring the same for the responses.
    This form of scanning is used by the attackers to find out the vulnerabilities
    of a network. This process allows the operator to discover the various open services
    which are available within the network in a direct attempt to check all those
    for some of the known vulnerabilities. The probe packets which are sent to the
    network host can either be in generic form which will be targeting only a particular
    protocol in place of an application or can also be targeted which will be focused
    on some accurate application by the host.


    +   Passive scanning: This method is used for identifying the services of a network
    by simply observing the generated traffic by the clients and the servers as it
    keeps on passing a point of observation. For the purpose of establishing passive
    monitoring, specialized form of hardware or software can be inserted at the point
    of monitoring and can also be installed at the point. Many of the routers can
    replicate the ports in which the copies of the probe packets will be sent out
    of some other interface to the host of monitoring. Various hardware taps like
    the optical splitters will be adding no extra hardship on the router. However,
    it requires some detailed interruption for installation. The detection of both
    UDP and TCP with the use of passive scanning is pretty simple and straightforward.'
  merge: -1
  img_proc: true
