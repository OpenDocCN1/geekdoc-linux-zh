- pgno: 142
  md: '# Chapter 17: Networking on PC and MAC


    PC and MAC are completely two different forms of system which uses two different
    operating systems. A PC generally runs of Windows or Linux whereas MAC uses its
    own OS for functioning. There is a very common question that is it possible to
    establish a network between PC and MAC and the answer to this question is yes.
    It is not at all a strenuous job and can be done within a few minutes.


    # Steps to follow


    +   - Right before you start with the process, make sure that you have set up
    the IP in both the PC and MAC systems. Note down both the IP addresses as it will
    be used in setting up the connection.


    +   - Set a password for your PC sharing system which can be found in the network
    and sharing option.


    +   - Put the PC running on Windows or Linux and the MAC system in the same workgroup.


    +   - In the MAC system, open up system preferences and then select the adaptor
    of the network. Select the advanced option which is available on the right pane
    and select wins tab and type in the same name of the workgroup as you are using
    in the system of PC.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '+   - Create a folder named as shared in the PC system.


    +   - Create a folder named as shared in the MAC system.


    +   - The next step is to open system preferences in the MAC system and select
    the option sharing under the option of internet & network. Check out the option
    of file sharing.


    +   - Under the file sharing option, check share folder and file by using SMB.


    +   - Now you will be able to connect both the systems and transfer files and
    folder between your PC running on Windows or Linux and the MAC system.


    Make sure that nothing is in the encrypted format while sharing as with encryption
    turned on, the system of PC will not be able to log in the MAC system and share
    files and folders.'
  merge: -1
  img_proc: true
