- pgno: 47
  md: '# Networking cables and wires


    In spite of so much advancement in wireless technologies, many of the computer
    systems in 21st century still rely on wires and cables as the physical medium
    for transferring information data across the network. There are various standards
    of cables in the world of networking and each of them is designed for some particular
    purpose. The most common types of networking cables and wires that can be found
    today are Ethernet cables and fiber optic cable.


    # Ethernet Cable


    Ethernet cable is the most common form of cable that is used for wired networking.
    It helps in connecting various devices such as computers, switches and routers
    within a network of local nature. However, Ethernet cables are very much limited
    when it comes to durability and length. If the cable is kept too long or is of
    not good quality, the cable won’t be able to carry good signal. This is the reason
    why different types of Ethernet cables are used for different functions.


    # Types of Ethernet Cable


    The Ethernet cables which are used today support many of the industry standards
    that also includes category 5 and 6. The technicians who are experts in computer
    networking refer to these Ethernet cable standards CAT5 and CAT6. Ethernet cables
    are developed in two forms:


    +   - Solid Ethernet cables: This form of Ethernet cable offer a bit better performance
    along with improved security against all forms of electrical interference. Such
    cables are also being'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'used in the business networks, office wall wiring and under-floor wiring.


    +   * Stranded Ethernet cables: This form of Ethernet cable is less vulnerable
    in nature are also less prone to breaks or cracks. This type of Ethernet cable
    is suitable for the home-based network.


    # Ethernet cables and limitation


    Ethernet cables come with distance limitation. It comes with a distance capacity
    where the cable comes with a maximum upper limit for how long it can run before
    there is any form of loss in network signal. This is also known as attenuation.
    This is mainly because long cables come with an electrical form of resistance
    that prohibits signal flow and also at a distance affects the overall performance
    of the network. Both the ends of the Ethernet cable needs to be close enough for
    receiving signals fast and also at a distance from any form of external interference
    for avoiding interruptions in the connection. This practice does not interfere
    with the network size as various hardware components such as routers and hubs
    can be used joining various Ethernet cables on the same wired network. The distance
    between the two devices is known as network diameter.


    The length of CAT5 cable just before attenuation takes place is 324 feet. However,
    CAT6 can extend to a distance of 700 feet. If you want can also keep the Ethernet
    cables longer than the standard lengths but the only problem that you will be
    facing is loss in signal, especially in cases when the cables need to pass across
    large appliances.


    # Alternative option for Ethernet cable'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'There are various alternatives that can be found today for Ethernet cables
    such as Bluetooth and Wi-Fi. It is mainly because the devices and systems of today
    are not having a network port and come with Wi-Fi only. But, still the security
    and performance which is provided by Ethernet cables are really outstanding and
    many of the big organizations and various home networks still use Ethernet cables
    for a wired network.


    ![](img/dfdb59329a06b0e4d53fac932c198967_49_0.png)


    # Fiber Optic Cable


    Fiber optic cable is a form of network cable that comes with glass fiber strands
    inside the insulated casing of the cable. It has been designed for long-distance
    transmission of data, telecommunications and for high performance of the network.
    When compared with Ethernet cables, fiber optic provides larger bandwidth and
    it is capable of transmitting data to long distances without any loss in signal.
    It supports most of the world’s cable television, internet and telephonic systems.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# How fiber optic cable function?


    Fiber optic cable is composed of several strands of glass which are slightly thicker
    when compared with human hair. The center of each of the glass strand is known
    as the core which provides the travelling pathway for light. The core of the glass
    strands is surrounded by a glass layer which is known as cladding which helps
    in reflecting all the light inwards and thus helps in preventing signal loss.
    It also allows the light to travel through cable bands easily. Fiber optic cables
    are of two types: single-mode and multi-mode. The single-mode cable uses super
    thin strands of glass along with a laser for the purpose of generating light.
    The multi-mode cable uses LEDs for generating light.


    The single-mode fiber optic cable uses a technique known as Wave Division Multiplexing
    for the purpose of increasing data traffic which can be carried by the glass strands.
    This technique allows light to travel at various wavelengths for combining and
    then separating later for transmitting various streams of communication via a
    single pulse of light.


    # Fiber optic cable and its advantages


    Fiber optic cables offer various advantages for long distance transmission. Fiber
    optics can easily support higher capacity of transmission. The bandwidth of fiber
    optic cables is 10 Gbps and 40 Gbps and 100 Gbps as standards. Fiber optics do
    not need any form of signal booster is this because light travels for longer distances
    without any form of loss in its strength.


    The cable of fiber optics is less vulnerable to any form of interference. The
    Ethernet cables require shielding for its protection from'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'electromagnetic interference. However, this shielding is not enough for the
    ultimate protection. However, the physical properties of fiber optics cable can
    easily avoid all these problems.


    # Fiber optics to the home


    In most of the cases, fiber optic cables are being used for long distance communication
    in the cities and countries. However, some of the local internet providers are
    also extending their network by installing fiber optics which can be accessed
    directly by the households. One of the prominent fiber to home service which is
    available in the market today is Google fiber. Such fiber optics services can
    easily provide gigabits of internet speeds to the households. There are various
    versions of fiber to the home network such as:


    +   **Fiber to the premises or FTTP**: In this, the fiber optic cables are laid
    to the buildings directly.


    +   **Fiber to the building or FTTB**: It is similar to that of FTTP.


    +   **Fiber to the curb of node or FTTC/N**: In this, fiber optic cables are laid
    till the node and then copper wires are used for completing the overall connection
    inside the household building.


    +   **Direct fiber**: In this, the fiber optic cable is taken from the central
    office and is connected to the system of the customer directly. This form of connection
    provides the best bandwidth but is expensive as well.


    +   **Shared fiber**: It is similar to direct fiber but as the fiber optic cable
    reaches the premises of the users, it is distributed into several fiber optic
    cables for the users.'
  merge: -1
  img_proc: true
