- pgno: 281
  md: '# # Chapter 19: FAQ


    # ## How often should penetration testing be done?


    The organizations perform according to their own set of regulations and mandates.
    The standard that they follow will determine whether they need penetration testing
    or not. The standards of the organizations come with their own methodologies that
    help in describing what will be the best practice for protecting the security
    system. The standard will also determine that whether documentation of the tests
    needs to be done for compliance and purpose of auditing afterwards.


    # ## What is the rogue wireless network?


    Rogue wireless network acts simply as a point of access just like a router or
    Wi-Fi station. It is plugged into the network of the organization; however, it
    does not even adhere to with the organization’s standards for the wireless infrastructure
    which is in existence.


    # ## How a rogue wireless network can be installed?


    This form of security threat occurs when any device has been adapted in an organization
    and is connected with the network, either knowingly or unknowingly. There are
    various types of equipment that come with activated Wi-Fi by default which is
    not configured at all. This means, that when the device gets turned on for the
    first time, it will start broadcasting signal for connection.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Can the employees of a business expose the organization to cyber threats?


    Yes, they can. Any person who carries a device that has a connection to the Wi-Fi
    of the company might turn out to be a potential threat for the business. Malware
    can get into a system unknowingly via a network through laptop, tablet or smartphones.
    It happens when the segments of Wi-Fi are not properly locked. If the business
    servers are not separated on a completely different VLAN and all wireless network
    traffic can access the same, there is a high chance of security breaching and
    data theft.


    # Is it required to have wireless networks for businesses in spite of the associated
    potential risks?


    Modern businesses cannot function without wireless technologies. However, the
    standards of technology and configuration which are applied for the wireless equipment
    will determine the usefulness of the wireless technologies and also the potential
    risks of security breach. There are various forms of businesses where the employees
    are required to work with tablets and scanners, especially in the manufacturing
    and warehousing sector. It will not be possible for such businesses to operate
    without the presence of a wireless network within the organization.


    # What are the most common types of Wi-Fi attacks?


    When it comes to Wi-Fi attacks, the list is never-ending. There are several vulnerabilities,
    exploits and shortfall of security when it is related to'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'wireless attacks. But, the attackers employ certain common methods for the
    purpose of accessing the wireless networks.


    # Is MITM a serious security threat?


    Also known as man in the middle, it is one of the most commonly found forms of
    attack and is the most used tactic as well by the attackers. The attacker tricks
    the victim and transmits data so that the sufferer believes that the communication
    is coming from a legitimate form of contact only. Using MITM, the attackers can
    easily target the system of the victim and control it remotely, gain access to
    several sensitive data such as bank details along with exploits.


    # What are packet analyzers?


    The attackers are capable of analyzing and sniffing the data packets which are
    being transported through a wireless network. The attackers can also intercept
    unencrypted data which is inside the packets of TCP as well. When data is gathered
    using this method, the attackers can easily gain insight into the internal working
    system of an organization which is being targeted and can also fish out valuable
    information that might turn out to be a huge loss for the business.


    # What is malware?


    Malware is a form of cyber attack and is the most common form of attacks. It possesses
    a serious kind of threat to the networks and servers. It also comes with the power
    of self-propagating over various networks. It'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'becomes very difficult to detect and stop it once it has gained access to a
    network segment. It can infect the system when two devices are being connected
    with the same network which makes the spread of infection very fast.


    # Can poorly configured Wi-Fi lead to cyber attack?


    Yes, it is possible when the Wi-Fi is configured poorly. It is the main reason
    behind the infiltration of a wireless network. This becomes more serious when
    there are no available management tools for the IT staffs to gain a perspective
    of the wireless environment.


    # Is it okay to share the result of penetration test outside the organization?


    No, you should never disclose the test report outside the organization. You can
    only share it with the company officials and authorities. Sharing test results
    with the outside world will open up vulnerabilities for the organization and might
    lead to a serious cyber attack.'
  merge: -1
  img_proc: true
