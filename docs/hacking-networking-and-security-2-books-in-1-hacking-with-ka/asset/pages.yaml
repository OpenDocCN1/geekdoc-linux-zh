  md: 'this flow will follow this established path. Virtual circuit ID is given out
    by the routers or switches for unique identification of the virtual connection.
    All of the available data is divided into various smaller units and the units
    are affixed with a sequence number. In this, three phases work together: setting
    up, transferring of data and tear down phase. The information regarding address
    is transferred only during the phase of setup. After the destination route has
