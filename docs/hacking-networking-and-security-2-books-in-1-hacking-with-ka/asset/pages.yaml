- pgno: 269
  md: '# Chapter 17: Protection and VPN


    VPN, also known as Virtual Private Network, is a technique of creating a highly
    secure connection with another network directly over the internet. In this world
    of today, VPNs are widely used now for accessing various websites which are restricted
    in several regions, for protecting the user’s activity of browsing from the attacking
    eyes while using public Wi-Fi and many more. VPNs are very popular today but it
    is not being used for the purpose for which it was created originally. It was
    made for connecting to the networks of business in a secure way over the internet.
    It was also made with the purpose of allowing the user to access the network of
    business right from their home. VPNs help in forwarding all the traffic in the
    network provides users with various benefits such as accessing the resources of
    local network remotely and bypassing of censorship on the internet. Many of the
    OS comes with integrated support of VPN.


    # How does VPN help?


    The concept of a VPN is very simple. It connects the smartphone, PC or tablet
    of the user with another server or computer directly on the internet and also
    allows the users to browse the content on the internet by using the internet connection
    of that computer. So, in case the computer with which the user is connecting to
    for surfing the internet is from a different country, it will show that the user
    is also from the same country as the server computer. So, the users of VPN can
    easily access everything that they couldn’t do normally.


    A VPN can be used for various purposes such as:'
  merge: -1
  img_proc: true
- pgno: 270
  md: '+   - Bypassing the restrictions on websites based on geography for streaming
    of video and audio.


    +   - Watching online media streaming like Hulu and Netflix.


    +   - Protecting the user from connecting to any form of malicious hotspots of
    Wi-Fi.


    +   - Gaining a little bit of privacy online by hiding the original location of
    the user.


    +   - Protecting the user from being scanned while using torrent.


    Most of the people today use VPN for the purpose of bypassing their geographic
    restrictions for watching restricted content by using the network of any other
    country or for torrenting. VPNs are really useful while accessing public Wi-Fi
    such as at coffee shops.


    # How to get a VPN?


    You can get a VPN depending completely on your requirements. You can either create
    a server of VPN all by yourself or host one VPN server out of the house. You can
    also create a VPN from your workplace as well. But, in real-world, most of the
    people are looking out for a VPN server for surfing restricted content which is
    banned in some areas or countries, like torrent. Just for the purpose of surfing
    restricted online content, you can download from the various options available
    online and use it according to your need.


    # Working of a VPN'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'When the user connects a computer or other device like a tablet or smartphone
    to the VPN, the system will start acting like it is from a similar local network
    as of the VPN. All the network traffic will be sent across a secure connection
    to the VPN. As the system behaves like it is also from the same network, it allows
    the users to access the resources of local network securely even when the user
    is at some different corner of the world. The user can also use the internet as
    he/she was present right at the location of the VPN that also comes with some
    added benefits in case the user is using Wi-Fi of public nature or wants to access
    some sort of geo-restricted website.


    When you are browsing the internet while being connected with the VPN, the computer
    will contact the website via the VPN connection which is encrypted in nature.
    The VPN will help in forwarding the user request and then brings back the website
    response through the same secure connection only. For example, if you are using
    a VPN based on the USA accessing content on Netflix, Netflix will be seeing your
    connection coming out from the USA only.


    # Uses of VPN


    The usage of VPN is really simple and it can help the users perform a variety
    of things such as


    +   - Accessing network of business at the time of travelling: The most common
    use of VPN is by the business travelers use it to access the network of their
    business along with all the resources of the local network while travelling only.
    The resources of the local network are not required to be directly exposed to
    the internet and thus it helps in improving the overall security.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   * Access home network at the time of travelling: You can easily set up
    a VPN of your own for the purpose of accessing your network at the time of travelling.
    This will let you access a form of Windows remote access desktop directly over
    the internet. You can use it for local area file sharing, playing games on the
    web by acting as if you are also on the same local area network.


    +   * Hiding the browsing activity from the local network along with ISP: In case
    you are using a Wi-Fi which is of public nature, all your activities of browsing
    on the websites which are non-HTTPS are visible to everyone on the same network
    nearby in case they know how to trace those activities. If you want to hide your
    browsing activity for gaining more privacy, you can use a VPN. The network of
    the local area will only be seeing one single VPN connection. All forms of other
    traffic will be traveling from over the connection of the VPN. This can also be
    used for bypassing monitoring of connection by the ISP.


    +   * Bypassing censorship on the internet: There are various Chinese people who
    use VPN for accessing the Firewall of China for the purpose of accessing the complete
    internet.


    +   * Accessing the websites which are geo-blocked: the use of VPN increased in
    recent years only because of one reason which is accessing websites which are
    blocked according to various locations. You can use a VPN for accessing such websites
    and also for watching online streaming media while you are out of your country
    such as Netflix and many others.'
  merge: -1
  img_proc: true
