- pgno: 251
  md: '# Chapter 14: Exploitation of Computer Systems


    With the increase in the use of computer systems day by day, the percentage of
    attacks by third parties on the systems is also increasing gradually. There were
    days when people used to store all their data and confidential information in
    the form of physical copies. But, today most of the people prefer their confidential
    information in the computer systems and that is what gave birth to the attacks
    on computer systems. Exploitation is nothing but a programmed script or software
    which allows hackers to gain control over the entire system and then exploit the
    same for the benefit of the hackers.


    The exploitation attacks try to take advantage of any form of weakness in an OS
    of the user, in the application or in any other form of software code that also
    includes plug-ins of the applications or of the libraries of software. The owners
    of such codes issue a patch or fix in response. The system users or the users
    of the applications are completely responsible behind obtaining the patch. It
    can be downloaded from the developer of software which is readily available on
    the web or it can also be downloaded by the OS automatically or by the application
    that needs the same. In case the user fails to install the required patch for
    a specific problem, it will expose the user to the exploitation of a computer
    system and might also lead to breaching of security.


    # Computer exploits and its types


    Computer exploits can be categorized into two different types:'
  merge: -1
  img_proc: true
- pgno: 252
  md: '+   - Remote exploits: Remote exploits are those exploits types where it is
    not possible to access a network or remote system. Such exploits are generally
    used for gaining access to the systems which are remote in nature.


    +   - Local exploits: Local exploits are used for those systems which having local
    system access. The attackers use this for over-passing the rights of the users
    of the local systems.


    The security exploits come in all forms of size and shape. However, there are
    certain techniques among the lot which are more often used than the others. The
    most common vulnerabilities which are web-based are XSS or cross-site scripting,
    SQL injection along with cross-site request forgery. It also includes abuse of
    authentication codes which are broken in nature or other misconfigurations of
    system security.


    # Zero-day exploit


    The exploits of computer systems can be differentiated in various ways that will
    depend on the process of working of the exploits along with the attack type that
    it can accomplish. The most common form of exploit is zero-day exploit. This form
    of exploit takes ultimate advantage of the zero-day susceptibility. Zero-day susceptibility
    takes place when a software that might also be an application or an OS, consists
    of some critical form of vulnerability in the security measures that the vendor
    is also unaware of. The system vulnerability can only be detected when any hacker
    is detected with exploiting the susceptibility of the system. That is why it is
    known as zero-day exploit. After such an exploit takes place, the system which
    is running the software is also left vulnerable to all forms of'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'attacks until unless the software vendor releases the required patch for

    t correction of the system vulnerability.


    The computer exploits can also be characterized according to the expected

    form of an attack like the execution of remote code, delivery of malware,

    escalation of privilege, denial of service and various other harmful goals.

    The exploits can be characterized according to the vulnerability type

    which being exploited that also includes code injection, exploits of

    buffer overflow and various other attacks of side channel and

    vulnerabilities of input validation.


    # How does exploit take place?


    It is a fact that exploits can take place in various ways. However, one of

    the most common methods of all is exploits being launched from the

    websites which are malicious in nature. The victim of such exploits

    genally visits the malicious websites by mistake. The victim might also

    be tricked into surfing or clicking on a malicious site link that can come

    attached with a phishing mail or in the form of advertisement of malicious

    nature.


    The malicious websites which are being used for the computer exploits

    come equipped with various toolkits of software and exploit packs which

    can be used easily for unleashing the attacks against the various

    vulnerabilities of the browser right from a harmful website. It might also

    be from a hacked website. Such form of attack generally attacks the

    software which is coded in JAVA, browser plug-ins and the browsers which'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'are unpatched. It is used for planting malware into the computer system of
    the targeted victim.


    The automated form of exploits which are generally launched by various malicious
    websites are designed with two components: exploit code and shell code. Exploit
    code is a software which tries to exploit a known form of vulnerability. The payload
    of the exploiting software is the shell code which has been designed for running
    one single time when the breaching of the system is complete. The name of shell
    code comes from the very fact that many of the payloads open up command shell
    which is used for running the commands in opposition to the system of the target.
    However, all shell codes are not capable of opening a command shell.


    # Shell code


    Shell code acts as a tiny piece of code which is used as the payload in the process
    of software exploitation. The shell codes are written in the form of machine codes.
    Download and execute is a form of shell code that performs by downloading and
    then executing malware directly on the targeted system. This form of shell code
    do not generate shell but instructs the target machine for downloading a form
    of an executable file which will be off the network, then save the same into the
    disk and execute the file. This form of shell code is most often used in drive
    download form of attack in which the victim clicks on a malicious website link
    and the'
  merge: -1
