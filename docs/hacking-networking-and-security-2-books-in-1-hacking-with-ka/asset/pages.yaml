  md: '# Chapter 1: Analyzing and Managing Networks


    Innovations in the digital world have reached unpredictable levels of productivity
    along with efficiency which is also easily available to all the organizations
    and businesses. With the rise of new capabilities in the world of technology,
    have also come brand new challenges. The prime challenge is vulnerability of the
    organizational networks to cyber threats. A simple failure in the system or IT
    breach can easily devastate a whole organization or business within seconds. It
    is directed to specially those organizations that lack a proactive system to deal
    with the various potential threats and problems.


    For effectively resolving all the performances of IT and its relevant issues,
    you just need to have a detailed understanding of the existing network of IT infrastructure
    of your organization. With no detailed idea, you will not be able to tackle the
    potential threats and issues of your IT network. For this, you need to analyze
    your infrastructure first for gaining proper idea about its working and functionality.


    Most of the IT administrators of today just ask their staffs to opt for the powerful
    automated technology for network assessment. It is more or less like a temptation
    of the new technological innovations. Most of the people are of the notion that
    the available tools for network analysis are very effective, useful and instructive
    as well. However, if you really want to analyze your network in the proper way,
    opting for the automated tools might not be the right option.


    # Overlooking the sirens'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'The recent temptation of deploying and relying on the tools of automated analysis
    and monitoring might seem like the siren calls to Ulysses for the network administrators.
    However, the automated system of network analyzing and monitoring might be a little
    dangerous for your business. In case you hand over the complete monitoring of
    your system to the automated tools and rely heavily on them, might turn out to
    be a prey to the syndrome called out of mind and sight with the attacks on your
    network going unobserved. The skills of analysis of the IT might also turn out
    to be eroded with time as the staffs are directed for other tasks, turning them
    away from the task of analysis. The network users within an organization might
    introduce various applications which are of unauthorized nature. Such applications
    might also disrupt the overall applications of your business and it is of utter
    importance to remove such items. That is why monitoring of your network needs
    to be done without the use of any kind of automated tools.


    Most of the ultra-modern network and security products in the market have their
    source of origin within the application''s command line and in the scripts. The
    IT administrators, in turn, have developed several tools for monitoring, analyzing,
    collecting and responding to the various security-related issues. The variants
    of such automated applications are easily available as freeware, open-source or
    shareware software. However, in spite of such automated tools, it is always better
    to prepare a customized toolkit for the purpose of analyzing and monitoring.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Assessments and the various methods


    You, as the owner of a business or organization, can ask your staffs to perform
    certain measures for the ultimate monitoring of your network.


    +   - Verifying the forwarding configuration policy of firewall:

    You can use traffic-generating tools like ping for verifying that the rules of
    firewall blocks or allows the traffic between the trusted or shared networks and
    external networks. It needs to function according to the policy of security which
    you want to enforce in the network.

    - Verifying the configuration policy of egress traffic: For this, you need to
    place a testing system just outside your network firewall. On the system of testing
    which has been placed outside the firewall, try to run applications like Port
    Listener. You need to use port scanner like nmap and then try to connect to the
    system of testing at each and every port of listening that you have configured.
    It needs to be done for confirming that the firewall is allowing access to all
    those services that you generally want to make accessible to the web and restricts
    all those services that all the users tried to connect with your trusted networks.
    The restricted services will only be allowed depending on the AUP or Acceptable
    User Policy.

    - Find out who is trying to probe into your networks and also from where: Open
    up the log of your firewall. Select the source of traffic that is attempting or
    trying to probe into your network. Use a program of route analysis such as tracert
    or'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'traceroute for properly identifying the forwarded attack traffic path along
    with the IP addresses on that path, the service providers which are along the
    same path and the network from which the traffic of attack has originated. You
    can use several other utilities like whois, dig and nslookup for performing lookups
    of reverse DNS along with the whois queries. In the real situations, your website
    is generally the target of DDOS or distributed denial of service attack.


    +   * Try to take stock of the network: An analysis program along with LAN traffic
    capture program like Ethereal helps providing the most important information about
    the networks. By simply observing the application types which are in use, you
    can very easily identify the hosts which are providing the various unauthorized
    services. You can even determine if your employees within the organization are
    adhering to AUPs, whether any other harmful code and rootkits are trying to establish
    any type of back connections to the computer of the attacker and if your network
    is hosting any kind of spam bot.


    # Strategy for improvisation of the assessment skills


    You can nurture the various skills of assessment with your staffs with the help
    of several exercises. You can start introducing to your staffs the various techniques
    of information-gathering which are used by the attackers. Ask your staffs to perform
    scans of ping and then port the ping scans with the use of nmap. As they advance,
    introduce other complex'
  merge: -1
  img_proc: true
- pgno: 154
  md: techniques like service fingerprinting. Let them assess whether the present
    measures of security are enough or not.
  merge: -1
  img_proc: true
