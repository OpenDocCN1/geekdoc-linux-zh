    \ the implementation of a new key exchange protocol. WPA3 also supports the function\
    \ of forwards secrecy in any form of traffic that has crossed the system just\
    \ before an attacker gained access to the network, remains encrypted which is\
    \ not the case with WPA2. WPA3 also"
  merge: -1
  img_proc: true
