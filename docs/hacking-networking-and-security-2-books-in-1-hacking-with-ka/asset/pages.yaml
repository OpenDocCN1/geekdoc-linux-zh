- pgno: 77
  md: '# Static IP Address


    A static IP address is the one which has been manually configured for a place
    of the one which was assigned by DHCP server. The name static IP address means
    that the IP does not change and is static in nature. It can be regarded as the
    complete opposite of a dynamic IP address which changes. Phones, tablets, laptops,
    routers and other forms of network devices which use IP address can be easily
    configured for having a static form of IP address. This can be done by the device
    which gives out the IP addresses such as a router or also manually by typing the
    device IP address into the device only.


    Why does static IP address needs to be used?


    You can think of static IP addresses just like your physical home address or your
    email address. Such addresses do not change and they are static in nature. It
    helps in contacting with people or finding someone. Similarly, IP addresses of
    static nature are very beneficial when you are hosting a website from your home,
    having a file server in the network, forwarding network ports to some particular
    device, using networked printers, using any form of remote access program or running
    a printer server. As static IP addresses never change, all the other devices in
    a network will know how to connect with a device which uses IP address of static
    nature.


    For example, when IP address which is static in nature is set up for a PC within
    a home network, once the device gets a particular IP address for itself, the network
    router can be configured in a particular way for forwarding all the inbound requests
    to that device directly, like requests for FTP in case the device can share files
    over FTP.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'If you are hosting a website and not using a static IP address for the same,
    it might turn out to be a hassle. This is mainly because when the computer gets
    some new IP addresses, you need to change the settings of the router every time
    for the purpose of forwarding the requests to the new IP addresses. When you neglect
    to do so, anyone can get inside your website as the router will be having no idea
    about which device within the network is serving solely for the website.


    Another great example of an IP address of static nature at work is the DNS server.
    The DNS servers always use static addresses for making sure that the devices in
    the network know exactly how to connect with the servers. If they were regularly
    changed, you would also have to reconfigure the DNS servers regularly on the router
    for the internet.


    The static form of IP addresses is also very useful when the domain name of the
    device is not accessible. Those computers that connect with the file server within
    a workplace network could also be set up for instance with the server by using
    the static IP address of the server in place of the name of the host. Even if
    there is malfunctioning of the DNS server, the computers in the network can still
    access and connect with the file server as they communicate with the server by
    using the IP address. With applications that support remote access like the Windows
    Remote Desktop, using an IP address of static nature means that the user can access
    the computer always by using the same address. When you use an IP address which
    changes frequently, you need to know what it has changed to so that the new address
    can be used by you for establishing the remote connection.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Disadvantages of static IP address


    One of the major disadvantages that come with static IP address when compared
    with a dynamic IP address is that all of the devices in a network are required
    to be manually configured. All forms of home-based web servers along with programs
    of remote access requires setting up the devices with a particular IP address
    and also configure the same properly with the router in order to communicate with
    a particular address. This comes with more amount of work than just plugging in
    the router and then allowing it to give the dynamic IP address via the DHCP servers.


    In case a device has been assigned an IP address like 192.168.1.10, and you are
    going to a completely new and different network which gives out the address as
    10.x.x.x, you will not be able to connect with your static IP address. The device
    will require to be configured again for the purpose of using a DHCP server or
    for using an IP address of static nature that will work well with the new network.


    Security can also be regarded as another downfall when a static IP address is
    being used for a device. When an IP address is used which is never changed, it
    will give the attackers much time for finding out various vulnerabilities within
    the network of the device. The only alternative would be to use an IP address
    of dynamic nature which changes and thus it will also make the attackers to change
    the way in which they communicate with that device.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Static IP address vs. Dynamic IP address


    A dynamic IP address is exactly the opposite type of IP address than the IP address
    that never changes. Dynamic form of IP address is like any regular IP address
    just like static IP, but the dynamic IP is not tied with the device permanently.
    Instead of using one IP address for a lifetime, the dynamic IP addresses are used
    only for a particular time frame and then it returned to the pool of IP addresses
    so that the same can be used by the other devices in the network.


    Dynamic IP addresses can outnumber in case of benefits when compared to static
    IP address. In case if an ISP kept using static IP address from all its customers,
    there will be shortly a limited IP supply for all the new customers. Dynamic IP
    addresses provide with the solution in which one IP address can be reused by some
    other device when it is not being used by any other device. Thus, providing access
    to the internet for more number of devices than it would have been possible with
    static IP address.


    The static form of IP addresses come with limited downtime. While the dynamic
    form of addresses obtains a new IP, the user who is connected with the existing
    IP address is removed out of the connection and else has wait for finding any
    new address. This will not be a recommended setup while you are going to a website,
    service of file sharing or online game, all of these will be requiring active
    connections constantly.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'In case of any local network such as in place of business or in home, where
    you generally use an IP address of private nature, most of the devices in such
    network are configured for DHCP. Thus, all the devices use dynamic form of IP
    address. The public form of IP address which is assigned to the routers of the
    business or home-based network is dynamic in nature. Large-sized companies do
    not use the dynamic address for connecting with the internet. Instead of dynamic
    addresses, they use static IP address which is assigned to them.


    # How can you get a static IP address?


    Some of the routers of today already reserves IP address for the devices which
    are connected with the network. This process is generally done with the help of
    DHCP reservation and it performs by linking a specific IP address with the MAC
    address so every time that device requests the router for IP address, the router
    can assign it the one which has been already chosen by the user with that particular
    MAC address. When you want to get a static IP address for your business or home
    network, you can do it by contacting your ISP it varies depending on the company
    that provides you with the internet. Having a static IP address for home-based
    and other local network is quite expensive when compared with getting a dynamic
    IP address.


    # Faking static IP address by using dynamic IP address


    As getting a static IP address for your home or business network might turn out
    to be very expensive than a regular dynamic address, the best option is to opt
    for both forms of IP addresses by using dynamic DNS'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'service or DDNS. The service of DDNS associates a changing form of a dynamic
    IP address with the hostname that does not change as well. It is exactly like
