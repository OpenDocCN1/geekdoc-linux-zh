- pgno: 70
  md: '# IP Address


    The IP address or Internet Protocol Address is the number of identification for
    the network hardware which is connected with the network. When your system has
    an IP address, it can communicate with all the other devices across a network
    based on IP address such as the internet. Most of the IP addresses look like 123.121.52.141.


    # What is the use of an IP address?


    The IP address helps in providing a unique identity to the devices in a networked
    structure like the internet. It is somewhat similar in nature to your home or
    business addresses which helps in the delivery of supplies to a particular location
    that comes with an address which is identifiable. All the devices on a network
    can be differentiated from each other with the help of IP addresses. When you
    want to send a gift or package to one of your friends who live in a foreign country,
    you need to know the exact location of your friend. This same process is sued
    for sending data across the internet. However, in place of using a physical form
    of mailing address, the computer systems use DNS servers for looking up at a hostname
    in order to find out the IP address.


    For example, when you want to browse a website by entering the URL of the respective
    website such as www.google.com, your request for loading the page is sent over
    directly to the DNS servers which find out for the hostname for google.com for
    finding out the related IP address. Without the presence of a proper IP address,
    your computer will be having no clue what are you up to.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# IP address and its versions


    IP address comes in two different versions: IPv4 or internet protocol version
    4 and IPv6 or internet protocol version 6. IPv4 is the older version of IP address
    whereas IPv6 is the latest and the upgraded version.


    +   - **IPv4**: IPv4 addresses are constructed in such a way so that it capable
    of providing about 4 billion IP addresses which are all unique in nature. Although
    it comes with a huge number of addresses, it is still not enough for the modern
    world of today with various types of devices being used on the web or internet.

    - **IPv6**: IPv6 can support 340 trillion, trillion and trillion addresses which
    come out like 340 along with 12 zeros by its side. It means that each and every
    person on the Earth will be able to connect a billion numbers of devices with
    the internet.


    One of the reasons why IPv4 is being replaced by IPv6 is that the latter provides
    more number of IP addresses when compared to the former. When various devices
    are all connected on the similar network, it is very important for each of the
    devices on the network to have a unique address of its own. IPv6 also comes with
    a wide number of added benefits over IPv4:


    +   - There is no collision of IP addresses which is caused by the private addresses

    - It comes with auto-configuration feature.

    - There is no need for NAT or network address translation.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '+   It comes with an efficient feature of routing.


    +   The administration of the IP addresses is very easy.


    +   It comes with in-built privacy for the IP addresses.


    IPv4, the IP address is displayed as a 32-bit number which is written in the format
    of decimal such as 210.251.165.40 or also 192.251.1.1.1. As in IPv6, there can
    be trillions of possible IP addresses, it is written in a hexadecimal format such
    as 3gge:1500:6565:4:100:7ff:fe31:97cf.


    # IP addresses and its types


    There are various types of IP addresses that can be found. While all forms of
    IP addresses are constructed of letters or numbers, not all of them are being
    used for the same function. The types of IP addresses are private address, public
    IP address, static IP address and dynamic IP address.


    +   Private IP address: This form of IP address is generally used inside one network
    such as any form of a home-based network which is used by Wi-Fi cameras, mobile
    devices, desktop PCs and wireless printers. This type of IP address allows the
    devices to communicate with the central router along with other devices which
    are based on the similar home network which is private in nature. This type of
    IP address can be configured manually or it can also be assigned automatically
    by the network router.


    +   Public IP address: This type of IP address is used for the outside area of
    a network and it is assigned by the service provider or ISP. It is the prime address
    which is used by the business or home networks for communicating with the'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'other networked devices all over the the world. It helps by providing a path
    for the home-based devices to reach the ISP and therefore with the world outside
    as well. It allows the devices in a network to access various websites and also
    to communicate with the rest of the computers directly along with other servers
    all over the world.


    Both these types of IP addresses are either static or dynamic in nature which
    means that they change either or not. The IP address which has been assigned by
    the DHCP server is known as a dynamic IP address. In case a device is not having
    DHCP server enabled or if it does not support DHCP, the IP address needs to be
    manually assigned and in such case, the IP address is called static IP address.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Dynamic IP Address


    A dynamic IP address is the one which is assigned automatically to every node
    in the network like desktop PC, smartphone or tablet. This automatic assigning
    of the IP address is done by the DHCP server. An IP address which has been assigned
    by a DHCP server is known as dynamic as it will be changing in the future depending
    on the future connections with the network.


    # Where to find dynamic IP addresses?


    The public IP address which is assigned for the router for most of the business
    and home network users by the internet service providers or ISPs is dynamic in
    nature. Bigger organizations and companies try not to connect with the internet
    with the use of IP addresses which are dynamic in nature and prefer using static
    IP addresses which are assigned specifically for them.


    In any form of a local network like the one in your business place or home, where
    private IP addresses are used, most of the devices are preconfigured for DHCP.
    This means that all devices use a dynamic IP address. In case the devices do not
    have DHCP enabled, each of the devices is required to manually set up the network
    information.


    # Dynamic IP address and its advantages


    One of the prime advantages that come with assigning of IP addresses dynamically
    is that it is more flexible in nature. It is very easy to set up and the administration
    part is also easier when compared to static IP'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'addresses. For instance, when one of your devices connects with the network,
    it is assigned with one specific IP address. Once the device disconnects from
    the network, the same IP address becomes free and it can be used for another device
    that can connect afterwards, even if it is not the same device again.


    Dynamic IP addresses come with little limitation to the total number of devices
    which can connect with the network as the devices which do not require to stay
    connected can easily disconnect from the network and thus freeing up the available
    pool of IP addresses for the other devices. There is an alternative in which the
    DHCP server can pre-configure some specific IP addresses for each of the devices
    in a network in case all of the devices want to get connected with the network
    at the same time. In such case, hundreds of networked devices, whether they were
    being used by the users or not can have their own specific IP address which can
    easily limit network access for all the new devices in a network.


    The implementation process of dynamic IP addresses is easier when compared with
    the static IP addresses. There’s no need to set up anything manually for the new
    devices which want to connect with the network. All that you need to do is be
    sure that the DHCP has been enabled on the network router. As all the networked
    devices are by default configured to have a specific IP address for each from
    the huge pool of available IP addresses, each and every step turns out to be automatic
    in nature.


    # Dynamic IP address and its disadvantages'
  merge: -1
  img_proc: true
