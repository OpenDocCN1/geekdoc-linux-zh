- pgno: 156
  md: '# Chapter 2: Hacking Process


    Kali Linux is well known for the purpose of hacking networks. The term “hacking”
    is not always negative and might also a lot in certain serious events. By having
    a clear idea about the process of hacking which is carried on every day by the
    hackers, you can easily track the process and make yourself aware of such events.
    It can also help you to stay protected when you have a clear understanding of
    the whole process of hacking.


    In general, when a hacker tries to hack the server of a company or organization
    and gain overall access to all confidential data, it is performed in 5 definite
    steps. Let’s have a look at them:


    +   **Reconnaissance:** This is the first step in the process of hacking. In this
    phase, the hacker tries all possible means for collecting information about his
    target. The means might include identification of target, finding the range of
    the target IP address, DNS records, network and many others. In short, the hacker
    collects all the contacts of a server or website. The hacker can do this by using
    various search engines such as maltego, research about the target, for example,
    a website or by using other tools like HTTPTrack for downloading an entire website
    for the purpose of later enumeration. By doing all these, a hacker can easily
    determine the names of the staffs, their designated positions in the organization
    and their email addresses as well.


    +   **Scanning:** After the hacker is done with collecting relevant information
    about the target, he starts with scanning. In this'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'phase, the hackers use various tools such as port scanner, dialers, sweepers,
    vulnerability scanners and network mappers for scanning the server or website
    data. In this step, the hackers seek for the information which can probably help
    them in executing an attack like the user accounts, IP addresses and the names
    of computers. After the hackers are done with collection of basic information,
    they move to the next step and start to test the target network for any other
    attack avenues. The hacker chooses to use various methods for helping them in
    mapping the network like Kali Linux. The hackers look out for automated system
    of email or simply based on the gathered information, they try to email the company
    staff about various queries, for example mailing an HR with a detailed enquiry
    about job vacancy.


    +   **Gaining of access:**aining access is the most important phase when it comes
    to the process of hacking. In this step, the hacker tries to design the target
    network blueprint with relevant information which is collected during the first
    and second phase. After the hackers are done with enumerating and then scanning,
    they might decide to gain access to the network based on the information.


    Suppose, the hacker decides to use Phishing Attack. The hacker might try to play
    safe and so might use a very simple phishing attack for gaining access. The hacker
    might decide to penetrate from the department of IT. The hacker might find out
    that some recent hiring has been done and they are not to speed the procedures.
    The hacker sends a phishing email using the actual email address of the CTO by
    using a specialized program and will'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'send it out to all the techs. The email will have a phishing website that will
    gather the login ids and passwords. The hacker might use a number of choices such
    as website mail, phone app or something else for sending an email to the user
    and asking them to login into a brand-new portal of Google by using their relevant
    credentials. When the hackers use this process, they already have a special program
    running which is known as the Social Engineering Toolkit and uses for sending
    an email along with the server address directly to the users by masking the same
    with tinyurl or bitly.


    They can also use some other options such as creating reverse TCP/IP shell in
    PDF file with the use of Metasploit. They might also use buffer overflows based
    on stack or hijacking of session for gaining access to the server.


    +   * **Maintaining server access:** Once a hacker gains access to a server, they
    try to keep the access safe for exploitation and attacks in the future. As a hacker
    owns an overall system, they can easily use it as their base for launching several
    other additional attacks. When a hacker gains access and owns the system, such
    system is known as zombie system. As the hacker gathers multiple email accounts,
    he can now start to test all the accounts right on the domain. At this point,
    a hacker tries to create a new account as an administrator and tries to blend
    in the system. As a precautionary measure, the hacker starts to search and identify
    all those accounts which have not been used for a very long time. The hacker changes
    the passwords of such accounts and then elevates all the privileges to the administrator
    just like a secondary account'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'for maintaining safe access to the target network. The hacker might also start
    sending out emails to all the other users with a type of exploited file like a
    PDF with reverse shell for extending their overall access. The hackers wait for
    any kind of detection in the system and when they get sure that no one has detected
    any kind of disturbance in the system, the hacker starts to make copies of all
    the user data such as emails, contacts, messages, files and many other for later
    usage.


    +   **Track clearance:** Just before the attacks, the hackers try to plan out
    their whole track of identity so that no one can trace them. They start by changing
    the MAC address of the attacking machine and run the same through a VPN for covering
    up their identity.


    Once the hackers are done with their job, they start clearing their tracks. This
    whole step includes clearing of the sent mails, temp files, server logs and many
    others. He will also lookout for any kinds of alert message by the provider of
    email that might alarm the organization about any kind of unauthorized logins
    in the system.'
  merge: -1
  img_proc: true
