- pgno: 239
  md: '# Chapter 12: Management of Linux Kernel and Loadable Kernel Modules


    All the operating systems that can be found today are composed of the two most
    important components. The first component and the most important one of all is
    the kernel. The kernel functions as a prime constituent of any form of OS. It
    is situated right at the center of your OS. It comes with the power of controlling
    each and every functioning of the operating system that also includes the function
    of CPU control, memory management along with control of the content that a user
    can see on the screen. The second most important element within an operating system
    is the user land and it constitutes everything else.


    The kernel of an operating system has been designed in a way to perform as a privileged
    or protected area which is possible to access by any other form of account which
    is privileged well as by root. This whole protection thing is only for the good.
    This is because, with unlimited access to the kernel can result in providing all
    forms of unauthorized access to the functioning of an operating system. So, in
    the real world, majority of the operating systems which are available in the market
    provide all the users along with the access to the services only at the access
    land. In the access land, the users can easily have access to everything they
    want without the need of taking the operating system under control.


    Kernel access by the users provides them with the ability of changing the looks
    of the operating system, the method of working of the operating system and also
    the way in which the operating system feels to use. The'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'users who get access to the kernel can also crash a whole operating system
    and thus making the whole system dead or unworkable. In spite of risks involved
    with the kernel of an operating system, the administrators of the systems sometimes
    are required to access the operating system kernel for the purpose of security
    as well as operational reasons.


    After knowing the actual power of kernel, you can easily figure out that in case
    a hacker gets access to the kernel of an operating system, he can actually control
    the entire system and that might turn out to be dangerous as well. Also, for some
    advanced form of attack such as MITM or main in the middle attack, the attacker
    might also need to alter the functioning of the kernel also.


    # What is kernel module?


    Just like human beings perform all their functions with the help of the CNS or
    central nervous system, the kernel can be regarded as the central nervous system
    of the operating system. It controls every functioning of the operating system
    and also includes the management of interaction in between the components of hardware
    and the starting of required services. Kernel functions in between the applications
    of the users that you can actually see and between the components of hardware
    that performs everything such as hard disk and memory along with CPU.


    Linux is an imposing type of kernel that allows the adding up of kernel modules.
    In general, the modules can be removed or added right from the kernel according
    to the user need. Occasionally, the kernel of an operating system might also require
    some updates which require the installation of'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'some new form of device drivers such as Bluetooth devices, video cards and
    USB devices and drivers of the file system. While updating the kernel, it might
    also require installation of some system extensions. For being functional in its
    full form, the drivers are required to be embedded within the kernel.


    There are some operating systems, in which, for the purpose of adding one driver
    for the update, the user needs to completely rebuild, assemble and reboot the
    whole kernel of the operating system. However, in Linux, it comes with the capability
    of adding kernel modules to the system kernel without performing this whole process.
    Such modules are known as LKMs or loadable kernel modules. LKMs are powered with
    the access of kernel to the lowest levels and that by necessity. This makes the
    LKMs a very easy target for all the attackers. There is a very particular form
    of malware which is known as rootkit. This malware inserts itself into the operating
    system’s kernel and mostly through the LKMs. In case a malware like rootkit ingrains
    itself into the kernel, the attacker will be able to have complete control over
    the functioning of the OS.


    In case an attacker gets access to the admin of Linux for the purpose of loading
    up new modules into the operating system kernel, the attacker will not only gain
    access to the controlling of the target system but will also control each and
    everything that the system which has been targeted reports in relation to the
    ports, space of hard drive, process, services etc., in short everything that a
    kernel handles. This is mainly because the attackers will be functioning at the
    level of kernel of the OS, so it can be said that when an attacker is able to
    induce an admin of the Linux into the installation of drivers such as video driver
    that comes with rootkit'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'ingrained in it, the attacker will be able to take the complete control of
    the kernel along with the OS.


    # Management of kernel modules


    Linux comes with two varied ways in which kernel modules can be managed. The first
    one is by using a command group which is built in the suite of insmod which stands
    for insert module. It has been made up for dealing with module management. And
    then the modprobe command which is the second method. This command is used for
    management of the LKMs. For adding a kernel module using modprobe, you need to
    use the command with -a switch. For removing a kernel module, you need to use-r
    along with the command. The command of modprobe comes with an added benefit when
    compared to insmod. The command of modprobe can understand all the options and
    procedures of removal or addition just before making any change in the kernel.'
  merge: -1
  img_proc: true
