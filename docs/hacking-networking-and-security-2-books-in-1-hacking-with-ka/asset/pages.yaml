- pgno: 206
  md: '# How to protect the devices and networks from malware?


    In order to protect the devices along with the organizational networks from malware,
    the prime thing that can be done is to update the security of the systems. It
    might not be possible to that extent when it comes to personal devices but it
    is possible in case of organizational database and networks. That where cybersecurity
    comes into play. It helps in protecting all forms of sensitive data from external
    attacks by updating the systems from time to time according to the evolution of
    the attacks. It is true that malware attacks are not going to stop that easily,
    but it is the duty of the organizations to take care of their system with proper
    cybersecurity in place.


    When it comes to personal devices like PCs and mobile devices, it is best not
    to open any kind of suspicious attachment in emails or suspicious advertisements
    on the websites. Stay vigilant always and this way you can easily prevent any
    form of malware attack.


    # Cyber Attacks


    With the advancement in technology, the attacks of third parties on organizational
    networks and servers are increasing day by day. Gone are those days when people
    used to store all their confidential data and information in files as physical
    items in the lockers. With new technological innovations, this storage of data
    has been shifted to online networks and servers. The online storage of data on
    clouds and servers allows the users to store as much data as they want and also
    access the'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'same whenever they are in need of them. But, every form of advancement comes
    with certain side effects that adversely affect the whole functioning of a system.
    The same goes in the case of organizational and personal data stored in online
    servers and networks. The attackers are always ready to find a victim and steal
    everything that they get.


    Cyber attack is nothing but stealing of information which launched from one or
    various computer systems against another system or network. Cyber attacks can
    be easily broken down into two significant parts: attacks where the main motive
    is to disable the functioning of the victim system and the attacks where the main
    goal is accessing the confidential data of the victim system and gaining administrator
    privileges.


    # Examples of cyber attacks


    The news of cyber attacks can be heard every day, some make it to the headlines
    where some does not. Whatever maybe the intensity of the attack, the motive is
    the same in most of the cases. Here are some of the greatest cyber attacks in
    the recent years:


    +   - WannaCry: This was a ransomware attack that broke in the the year 2017.
    Like every other ransomware, it also took over the systems of computers and encrypted
    all the information on the storage. In turn, the attackers demanded for Bitcoin
    for decrypting those data. The game of malware is nothing new but WannaCry left
    its mark as it oppressed the susceptibility in'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Windows by the use of a code that was developed by the US National Security
    Agency.


    +   - GitHub: GitHub is famous for the service attack with about 1.30 TB per second
    of traffic that hit many popular sites.


    # Types of cyber attack


    # Phishing


    Phishing is a very common form of cyber attack. The attackers use this technique
    for fooling the victims. The attackers craft emails in such a way that the victims
    assume the to be legit and fall prey to the harmful actions. The victim might
    get fooled in downloading dangerous malware that might be disguised in the form
    of any important document or any website link. It is most commonly done using
    website links where the victim is asked to enter their bank or credit card details
    and passwords. Such websites are generally fake and are made for such purpose
    only. Most of the emails of phishing are coarse in nature and are sent to victims
    at a time. But, there are also specific phishing emails that are sent only to
    a particular target to get the information that the attacker wants. Phishing can
    be done via email, website, advertisements and even game demos that can be found
    online.


    # SQL injection


    It is means used by the attackers for exploiting susceptibility in order to take
    complete control over the database of the victim. There are many databases which
    have been designed for obeying all the commands which'
