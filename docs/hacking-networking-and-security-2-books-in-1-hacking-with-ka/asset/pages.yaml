  md: '# Chapter 3: BASH and Python Scripting for Hackers


    # BASH Scripting


    Any reputed or self-respecting hacker will be able to script. With the introduction
    of Windows PowerShell, the administrators of Windows are required to script for
    performing the automated tasks and also for being more efficient.


    The hackers might often need to automate the overall usage of various commands
    and sometimes from various tools. For becoming an elite hacker, you are not only
    required to grab some scripting skills but you also need the ability for scripting
    in some of the most widely used languages of scripting like BASH and Python. Let''s
    have a look at the basics of BASH scripting.


    # Shell types


    The interface between the OS and the user is called shell. Shell enables to run
    various programs, commands, manipulate files and many other functions. When it
    comes to Linux, there are various types of shells. Some of them are Z shell, Kom
    shell, Bourne again shell or BASH and C shell. BASH shell is the one which is
    available on all the distributions of UNIX and Linux. So, it is being used exclusively
    for the purpose of hacking.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Basics of BASH


    For creating script of a shell, you will need to start with any kind of text editor.
    You have the freedom of using any kind of text editor available in Linux such
    as vim, vi, geit, emacs, kate and many others.


    For the first scripting, you can start with a very simple script that will return
    one message on the screen which says “Hi, null byte”. You need to start by entering
    #! Which is also known as the shebang. This will tell the OS that anything that
    follows shebang, will act as the interpreter you will be using for your script.
    You need to use the BASH interpreter right after shebang by entering the command,
    /bin/bash right after shebang. So, in this case, it will be like #!/bin/bash.
    Next, all you need to do is just to enter “echo” which will indicate the system
    for echoing back to the screen whatever you enter with it. So, you need to enter
    echo “Hi, null byte!


    # Setting the permissions for execution


    After you have created a new file, it might not be executable, not even by the
    owner. When you create a file, you can see the designated permission right beside
    it, like rw-r-r -. This means the file owner only has the permission to write
    and read with no permission to execute or x. You can modify the permission of
    execution with the help of the command chmod.


    # Running the script'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'For running the script, you need to type /Hinullbyte. The command ./ right

    before the script indicates the system that you want the system to execute

    the script right in the present directory.


    # Use of variables


    In case you want to create a more progressive script, all you need to do is

    to just use some variables. Variables are nothing but area for storage where

    you can easily hold up something in the memory. When it comes to

    “something", it can either be strings, letters or numbers.


    # Python Scripting


    Python comes with some very important features that might turn out to be

    very useful when it comes to hacking. It comes with various libraries

    which are pre-built in nature that also provides the hackers with some

    great functionality. It can be easily said that scripting the languages is

    much easier in Python when compared to other languages of scripting such

    as BASH.


    # Adding the modules of Python


    The standard library of Python along with the modules provide the hackers

    with a wide range of capacity that also includes exception handling, file

    handing, built-in data types, internet handling, numeric and math

    modules, cryptographic services along with interaction with the IPs.

    Despite all the available pre-existing modules and standard libraries, you'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'might also need some third-party modules in addition to the existing ones.
    All the third-party modules which are available for scripting in Python are comprehensive
    in nature and that is the prime reason why a majority of the hackers try to opt
    for Python when it comes to scripting.


    # Formatting


    Formatting is a very important feature when it comes to scripting in Python. The
    interpreter in Python uses the style of formatting for determining how the codes
    are grouped altogether. The formatting particulars are of less importance than
    being logical. So, in case you are working with a group of code that you are going
    to start with indentation which is double in nature, you need to be persistent
    with double indentation for scripting in Python for recognizing that the codes
    exist together. This case of formatting is completely different in the other languages
    of programming where the requirement of formatting is optional.


    # Running files on Python


    The process of running the files in Python is somewhat similar like BASH. You
    need to start with #! Followed by /usr/bin/python. This will indicate the system
    that you want to use the interpreter of Python. Following this,'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'you can enter your required command just like BASH. For running the script,
    you are required to change the permission first by using chmod command.


    # Comments on Python


    Python comes with the capability of easily adding comments just like the other
    languages of scripting. Comments are nothing but simple sentences, words and paragraphs
    that helps in explaining what a particular code is supposed to perform. Though
    it is not necessary to use comments but it can help you when you open a file after
    many years and cannot understand the functions of the codes. The interpreter cannot
    see the comments.


    # Variables


    Variables are capable of storing data in a location of memory. The Python variables
    are capable of storing various types of values like real numbers, integers, lists,
    dictionaries, Booleans and floating numbers. The variable types in Python are
    treated like class.


    # Functions


    Python comes with a wide array of functions which are built-in. The users can
    import them and then use the same immediately. Some of the functions are:'
  merge: -1
  img_proc: true
