- pgno: 16
  md: 'to send out messages at the time of emergency.


    # Tools for internet communication


    Internet communication has provided the human world with a wide range of tools
    for the purpose 0f communication. Let’s have a look at them.


    # Email


    Email is regarded as one of the fundamental tools for internet communication.
    Today, email addresses are required in almost all forms of services today and
    it is also believed that everyone who is active on the internet has at least one
    single email address. Email addresses can be taken from various free services
    such as Google and Microsoft. Email is most widely used for the purpose of sending
    out official or confidential information. However, in this world of today, it
    is also being used for various harmful activities such as spreading malware or
    scams with the use of phishing emails. In the case of phishing, a third party
    tricks the victim into sharing his/her sensitive data such as bank or credit card
    details, account numbers etc. So, it is always better to be a little cautious
    while fetching any form of email from unrecognized sources.


    # Social media'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'One of the tools of today, it is being used for seamlessly connecting millions
    of people from all over the world without any kind of delay in transmitting the
    messages. It is also being used for spreading awareness or alert in case of any
    emergency situation, share important information with anyone you want and many
