- pgno: 102
  md: '# # Chapter 15: Networking In Detail


    Computer networking functions with various components and systematic parts, all
    of which functions together for making the connection to a network successful
    one. Let’s have a look at some of the primary components of networking.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Protocols


    Network protocols help in defining the various conventions and rules for the purpose
    of communication between various devices in a network. The protocols of networking
    include various mechanisms for all the network devices for identifying and making
    connections with one another along with formatting the rules which help in specifying
    how the data is going to be packaged into received send messages. Some of the
    network protocols also support compression of data and acknowledgement of the
    message which is designed for the high performing and reliable form of network
    communications. The network protocols incorporate all the constraints and requirement
    of processes for the initiation and accomplishment of communication between the
    routers, computers, servers and other devices which are network-enabled. The network
    protocols need to be confirmed as well as installed by both the sender and the
    receiver for ensuring data or network communication.


    The modern network protocols use generally the techniques of packet switching
    for sending and also receiving messages in the form of data packets. Data packets
    are nothing but subdivided messages which are broken into pieces. The data packets
    are collected at the destination and then reassembled for getting the complete
    message. There are various types of network protocols which have been developed
    and designed for some specific functions in specific environments.


    # Internet Protocol


    IP or the internet protocol family is composed of a set of related protocols of
    networking. Besides having internet protocol itself, there are also'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'various higher class protocols such as UDP, TCP, FTP and HTTP. All such protocols
    integrate with the internet protocol for the purpose of providing many more added
    capabilities. There are some lower-level internet protocols as well such ICMP
    and ARP which coexists within the family. The higher-level protocols which belong
    to the family of IP have much closer interaction with the applications such as
    web browsers. The lower-level protocols interact with the adapters of a network
    along with some other hardware of the computer.


    # Wireless Network Protocols


    The wireless networking system now has turned out to be commonplace which is mainly
    because of Bluetooth, Wi-Fi and LTE. There are wireless network protocols that
    check the functioning of wireless networks. The network protocols which have been
    designed for the purpose of wireless networking needs to support roaming in mobile
    devices and also deal with various issues like network security and variable rates
    of data.


    # Network Routing Protocols


    The network routing protocols are the specially designed protocols which have
    been designed to be used specifically for the network routers. A network routing
    protocol is capable of identifying several other routers on the network, manage
    the destination of the messages of a network, manage the message pathways which
    are called routes and also makes dynamic decisions on routing. Some of the most
    common protocols of routing include OSFP, EIGRP and BGP.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# TCP or Transmission Control Protocol


    The TCP or Transmission Control Protocol is regarded as the core protocol of the
    IP suite. It originates in the implementation of a network in which has complemented
    the IP. So, the entire suite is also known as TCP/IP. TCP helps by providing a
    reliable system of delivery of octets streams over the network of IP. The main
    characteristics of TCP include checking of errors and ordering. All the major
    forms of internet-based applications like email and the World Wide Web with file
    transfer relies on TCP.


    # How are networking protocols implemented?


    Most of the modern operating system of today comes with in-built software services
    which help in implementing support for some of the network protocols. Various
    applications such as web browsers come with software library which supports high-level
    protocols when needed by the application for functioning. For some of the lower
    level protocols of routing and TCP/IP, the support is being implemented directly
    within the hardware for improving the overall performance.


    Each of the data packets which are transmitted and received by the destination
    over the network consists of binary data, zeros and ones which helps in encoding
    the message contents. Most of the protocols of networking add up small header
    at the starting of every data packet for the purpose of storing information about
    the sender of the message along with the intended destination. Some of the protocols
    also add ip footer at the very end of data packets. Each of the network protocols
    comes with the capability of identifying all the messages of its own form and
    then process'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'the header along with footer as parts of the moving data across the devices.


    A large group of protocols related to networking which functions together at both
    the higher and lower levels is known as protocol family. Some of the most common
    protocols which are used are HTTP with default port 80, FTP with default port
    20/21, SSH with default port 22, Telnet with default port 23 and DNS with default
    port 53.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Layers of the OSI Model and Its Functions


    The OSI model or the Open System Interconnection model is an architecture of 7
    layers in which every layer performs some specific function. All the layers work
    in close collaboration for the purpose of transmitting data from one system to
    the other all around the globe.


    +   * Physical Layer: The layer at the bottom of the OSI model is the physical
    layer. It performs the duty of establishing an actual physical connection between
    the concerned devices in a network. All the information in the physical layer
    is stored in the form of bits. At the time of receiving the data, the physical
    layer receives the signal and then converts the same into 1s and 0s. It is then
    sent to the layer of data link which puts back the frame together. Functions of
    the physical layer are:

    * 1. Bit synchronization: This layer helps in bit synchronization by providing
    a clock. The clock provided by the physical layer is responsible for controlling
    both the sender and the receiver and thus provides synchronization at the level
    of bit.

    * 2. Bit rate control: This layer is also responsible for defining the rate of
    transmission which is the total number of bits sent out every second.

    * 3. Physical topology: This layer determines the way in which all the nodes and
    devices are going to be arranged in the network which are star, bus and mesh topology.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '4. Transmission mode: This layer determines how the data is going to flow in
    between the connected devices. The possible modes of transmission are: simplex,
    full-duplex and half-duplex.


    +   - Data Link Layer: This layer is the second layer right above the physical
    layer. It is responsible for message delivery from node to node. The primary function
    of the data link layer is to make sure that the transfer of data is free from
    errors while travelling from one node to the other, right over the 1st layer i.e.
    the physical layer. After a packet has arrived in a network, it is the duty of
    this layer to transmit the same to the host by using its MAC address. The data
    link layer is being divided into two layers: Logical Link Control and Media Access
    Control.


    The packet which is received from the network layer is then divided into frames
    which depend on the size of the Network Interface Card or NIC. This layer also
    encapsulates the MAC address of the sender and the receiver in the data header.
    The functions of the data link layer are:


    +   1. Framing: The main function of the data link layer is framing. It provides
    the sender with a way for transmitting a set of bits which are meaningful for
    the receiver. This is achieved by the attachment of special patterns of bits right
    at the beginning of the frame and at the end.


    +   2. Physical addressing: After this layer is done with the job of framing,
    it adds physical addresses also known as MAC'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'addresses for the sender or of the receiver in the frame header of each.


    +   3. Error control: This layer comes with the mechanism of controlling errors
    in which errors are detected and the lost or damaged frames are retransmitted.


    +   4. Flow control: The rate of data needs to be constant on both the sides otherwise
    the data might result in getting corrupted. So, with the help of flow control,
    the data amount is coordinated which can be sent before receiving the acknowledgement.


    +   5. Access control: When a single channel of communication is shared by various
    devices, the sub-layer of MAC in the data link layer helps in determining which
    device has the control of the channel at some given time.


    +   Network Layer: This layer functions for transmitting data from one host to
    another which is located in some other network. The network layer also looks after
    packet routing which means it helps in selecting the path which is the shortest
    of all for the purpose of transmitting the packet, from the total number of routes
    which are available. The network layer also places the IP addresses of the sender
    and the receiver in the header. The functions of the network layer are:


    +   1. Routing: The protocol of the network layer determines that route will be
    the best for the packet from the source to the destination. This function performed
    by the network layer is called routing.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '2. Logical addressing: For the purpose of identifying each of the devices on
    the internetwork in a unique way, the network layer helps by defining a scheme
    of addressing. The IP address of the sender and the receiver are placed in the
    header which helps in distinguishing each and every device in a unique and universal
    way.


    +   - Transport layer: The transport layer helps by providing all the required
    service to the application layer and also takes up services from the network layer.
    Segments are those data which are present in the transport layer. It helps in
    end to end message delivery. This layer is also responsible for providing the
    acknowledgement after successful transmission of data and also re-transmits any
    data if any form of error is found.


    At the sender side: The transport layer receives the data which has been formatted
    from the layers above it and performs segmentation. After segmentation is done,
    it also implements error and flow control for ensuring that the data is transmitted
    properly. It adds up port number of the sender and the receiver in the header
    and then forwards the data which has been segmented to the network layer. The
    sender of the data needs to have the port number which is associated with the
    application of the receiver. The destination port number is generally manually
    configured or is configured by default. For example, when any web application
    sends any request to the web server, it uses the port number 80 because it is
    the port number which has been assigned for the web applications by default. Many
    of the applications come with default assigned port number.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'At the receiver side: The transport layer reads up the number of a port from
    the header and then forwards the packet of data which it has received for the
    respective application. This layer also performs reassembling and sequencing of
    the data which is segmented.


    # Functions of the transport layer:


    +   1. Segmentation: The transport layer accepts the sent message from the session
    layer and then breaks it onto several smaller units. The segments which are produced
    after segmentation comes with a header associated with every segment. The segmented
    message is reassembled by the transport layer at the destination.


    +   2. Service point addressing: For the purpose of delivering message to the
    proper process, the header of the transport layer also includes an address type
    which is called the port address or service point address. By determining this
    specific address, the transport layer makes sure that the intended message gets
    delivered to the right process.


    # Services provided by transport layer:


    +   1. Service oriented to connection: This whole process is done in three phases:


    +   -Connection establishment


    +   -Transfer of data'
  merge: -1
  img_proc: true
- pgno: 112
  md: '-Disconnection or termination


    In this form of transmission, the device on the receiver’s sides sends out an
    acknowledgement intended for the source right after a data packet or group of
    packet has been received by the destination. This form of transmission is very
    secure and reliable as well.


    2. Connection less service: This process is one phase in nature and it includes
    transfer of data. In this form of transmission, the receipt of a packet is not
    all acknowledged by the receiver. This form of transmission approach allows a
    faster mode of communication in between the devices. However, the connection oriented
    service is much more reliable than the connection less service.


    +   Session layer: The session layer serves the function of connection establishment,
    session maintenance, authentication and also security of the session. The functions
    of this layer are:


    +   1. Establishment of session, maintenance of session and termination: This
    layer helps in the establishment of the two processes, uses and also terminates
    the connection.


    +   2. Synchronization: The session layer helps in adding up checkpoints which
    are regarded as the points of synchronization by a process into the data. The
    points of synchronization help in identification of the errors in order to ensure
    that the data has been re-synchronized in the'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'proper way. It also ensures that the message ends are not prematurely cut for
    avoiding loss of data.


    3. Dialog controller: This layer allows the two systems to begin the communication
    with one another in full-duplex or half-duplex.


    +   * Presentation layer: The presentation layer is also known as the translation
    layer. The data which is received from the application layer is extracted in this
    layer and is also manipulated as per the requirements of the format for transmitting
    the same over the network. The functions of this layer are:


    +   1. Translation: It helps in the process of translation such as from ASCII
    to EBCDIC.


    +   2. Encryption and decryption: The encryption of data translates the whole
    data into some form or code. The data which is encrypted is known as the cipher
    text. The data which is decrypted is known as the plain text. For the purpose
    of data encryption and data decryption, a key value is used by this layer.


    +   3. Compression: This layer helps in reducing the total number of bits which
    is to be transmitted into the network.


    +   * Application layer: At the top of the stack of layers of the OSI model exists
    the application layer. It is a layer which is implemented by the applications
    in a network. The applications of the network produce the data which is to be
    transferred across the netork. The application layer serves as'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'a window for the services of applications for accessing the network and also
    for the purpose of displaying the information which is received to the user. Some
    examples of network applications are web browsers, messengers etc. The functions
    of this layer are:


    +   1. Mail services


    +   2. Network virtual terminal


    +   3. FTAM or file transfer access and management


    +   4. Directory services


    The OSI model as the reference model and is not at all implemented for the internet
    as it is considered as being outdated. TCP/IP model is used in place of the OSI
    reference model.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# VLAN


    VLAN or virtual LAN is a group composed of devices on one or more than LANs which
    are configured for communicating in a way as if all of them are attached with
    the same wire whereas they are located at several different segments of a LAN.
    VLANs are extremely flexible in nature as it is based on a logical connection
    in place of a physical connection. VLANs help in defining the domains of broadcasting
    in a network of Layer 2 nature. A broadcast domain is nothing but a set of all
    the devices which will be receiving frames of broadcast originating from any devices
    within that set. The broadcast domains are bounded typically by the routers as
    the routers will not be forwarding the frames of the broadcast.


    The switches of Layer 2 create broadcast domains which are completely based on
    the switch configuration. Switches are the multiport bridges which allow in creating
    several broadcast domains. Each of the broadcast domains is similar to a distinct
    form of a virtual bridge which can be found within a switch. You can easily define
    one single or many bridges of virtual nature which are available within a switch.
    Each of the virtual bridge which a user creates within the switch helps in defining
    a new VLAN or broadcasting domain. It is not possible for traffic to directly
    pass to some other VLAN between two switches or within that switch.


    VLAN acts just like a sub-network. VLAN eases the job for the network administrators
    to divide one switched network for matching the security and functional requirements
    of the systems without the need of running new cables or without making any major
    changes in the present infrastructure of the network. VLANs are generally set
    up by the large-'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'sized businesses for the purpose of re-partitioning the devices for the better
    management of traffic.


    VLANs also help in improving the all-round performance of the network simply by
    grouping all the devices together which communicates the most. VLANs also provide
    proper security for the large-sized networks by providing a greater degree of
    control across which the devices have access to each other. One or more than one
    switch can support several independent VLANs by creating Layer 2 subnet implementation.


    # VLANs and its types


    There are various types of VLANs present. Let''s have a look at them.


    +   * Protocol VLAN: This type of VLAN comes with traffic handled base on the
    protocol. The switch on the network will either forward or segregate the traffic
    based on the protocol of the traffic.

    * Static VLAN: It is also known as port-based VLAN. It requires the administrator
    of a network for assigning the ports on the network switch to a network of virtual
    nature.

    * Dynamic VLAN: It allows the network administrator to define the membership of
    the network which is based on the characteristics of the device which is in opposition
    to the switch port location.


    # How does VLAN work?'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Ports or interfaces on the switches can be assigned to one single or more than
    one VLANs which enable the systems to get divided into various logical groups
    which are based completely on the departments with which they are associated with.
    It also establishes the rules about the systems about how the systems in the separate
    groups are going to communicate with one another. These separate groups can range
    from practical and simple to legal and complex. Each of the VLAN provides access
    of data link to all the hosts which are connected to the switch ports configured
    with the similar VLAN ID. The VLAN tag is a field of 12-bit in the header of the
    Ethernet which provides support for 4,096 VLANs per domain switching. The tagging
    of VLAN is standardized in the IEEE 802.1Q and is also called Dot1Q.


    When a frame is received untagged nature from a host which is unattached, the
    VLAN ID which is configured on the interface is added up in the header of the
    data link frame by using the format 802.1Q. The frame of 802.1Q is forwarded towards
    the proper destination. Each of the switches uses the tags for keeping each traffic
    of the VLAN separate from the traffic of the other VLANs, forwarding the same
    only to the place where VLAN is configured.


    The trunk lines in the switches can handle several VLANs by using the tags for
    keeping them all segregated. A trunk line is a line of communication which has
    been designed for carrying several signals for the purpose of providing network
    access in between two different points. When the frame reaches the ultimate switch
    port of the destination, the tag of VLAN is removed just before the frame is transmitted
    to the device of destination.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'It is possible to configure multiple VLANs on one single port with the use
    of trunk configuration in which each of the frames sent through the port is being
    tagged with the VLAN ID. The interface of the neighboring device which might be
    on some other switch or host which supports 802.IQ tagging will require to support
    the configuration of trunk mode for transmitting and receiving the frames which
    have been tagged. Any of the Ethernet frames which are untagged are assigned to
    a VLAN of default nature which can also be designated in the configuration of
    a switch.


    When a switch which is VLAN-enabled receives an Ethernet frame of untagged nature
    from an attached host, it adds the VLAN tag which is assigned to the interface.
    The frame is then sent forward to the host port along with the MAC address of
    the destination. Broadcast multicast and unknown unicast is then forwarded to
    all the ports in the VLAN. When any previously unrecognized or unknown host replies
    to an unknown frame of unicast, the switches get to know about the host location
    and do not flood the host with the subsequent frames which were addressed for
    that host.


    The STP or Spanning Tree Protocol is being used for creating a topology of loop-free
    nature among all the switches in every Layer 2 domain. As per the regulations
    of VLAN, an instance of STP can be used in turn enables the various topologies
    of Layer 2 or a MIST or multi-instance STP can be used for reducing the overhead
    of STP in case the topology is also the same among the multiple VLANs. STP blocks
    away the forwarding on the links which might produce some forwarding loops and
    thus creating a spanning tree from the selected switch of root. The concept of
    blocking means that some of the links will not at all be used for the purpose
    of forwarding unless and until there is a failure in some other part of the network
    which causes the STP to turn the link a part of any active nature.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Advantages and disadvantages of virtual LAN


    VLAN comes with some basic advantages such as reduced traffic of broadcast, proper
    security of network, confinement of broadcast domain and easy administration of
    network.


    When it comes to the disadvantages of VLAN, it comes with the limitation of 4,096
    VLANs only for per switching domain which creates lots of problems for the large-sized
    providers of hosting, which also often comes with the need to allocate hundreds
    of VLANs for the customers. For addressing this limitation, several other protocols
    such as NVGRE, VXLAN and Geneve supports larger sized tags and also comes with
    the ability of tunneling frames of Layer 2 within the packets of Layer 3.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Routing


    Routing is the process by which path is selected along which the requested data
    is to be transferred from the source of origin right to the receiver or destination.
    Routing is done by a special network device which is known as a router. The router
    functions at the networking layer in the OSI reference model and in the internet
    layer in the model of TCP/IP. A router is a device which is used in networking
    which helps in forwarding the data packets based completely on the available information
    within the header of the packet along with the forwarding table. For the purpose
    of routing the data packets, various routing algorithms are used. The routing
    algorithm is a software which helps in deciding the path which will be the optimal
    one for the data packet to be transmitted to the destination.


    The protocols regarding use metric for determining the perfect and fastest path
    for the delivery of the packet. Metric is nothing but the standard which is used
    for measurement such as bandwidth, hop count, current path load, delay etc. which
    being used by the algorithm of routing for determining the optimal delivery path.
    The algorithm of routing maintains and also initializes the table of routing which
    is required for the process regarding the determination of path.


    # Metrics of routing


    Routing metrics along with costs are used by the router for determining the most
    suited route up to the destination. The factors which are used by the routing
    protocols for determining the fastest path are known as metrics. For some of the
    routing protocols, they use static form of metrics'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'whose value cannot be changed and some of the protocols use the dynamic version
    of metrics whose value can be changed and then assigned by the administrator of
    the system. The most common values of metrics are:


    +   - **Hop count:** It is the metric which helps in specifying the total number
    of passes across the devices of internetworking like the router. A data packet
    needs to move in a route for travelling right from the source to the destination.
    If the protocol of routing takes the hop as a primary value of the metric, the
    path which comes with the least hop count is going to be considered as the fastest
    and the best path for moving the data packet from the source to the destination.

    - **Delay:** It is the time which is taken by the network router for processing,
    queuing and transmitting one datagram to the interface. The protocols of routing
    use this form of metric for determining the values of delay for each and every
    link which are in the path from end-to-end. The path which will be having the
    lowest value of delay will be taken as the best path for the data packet.

    - **Bandwidth:** The capacity that a link has is called the bandwidth of that
    link. The link bandwidth is measured as bits per second. The link which has the
    highest rate of transfer such as gigabit will be preferred over any other link
    which comes with a link capacity of like 52 kb. The protocol of routing will be
    determining the capacity of bandwidth for each and every link along the path and
    the link which comes with overall higher bandwidth will be taken as the perfect
    route for moving the packet from source to destination.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '+   - Load: Load is the measurement with which it is measured that the resource
    of a network like network link or router is busy to which extent. The load can
    be measured in various ways such as packets processed every second, utilization
    of CPU etc. In case the traffic increases, the value of load will also increase.
    In simple words, the load value will change in relation to the network traffic.


    +   - Reliability: It is a factor of metrics which may be composed of only one
    fixed value. It depends on the links of the network along with its value which
    is dynamically measured. There are some forms of networks which go down more often
    when compared to others. After a network fails, there are some links of the network
    which gets repaired easily when compared with the other links of the network.
    Any factors of reliability can be considered reliability rating assignment which
    is in numeric values in general and is assigned by the administrator of the system.


    # Routing and its types


    Routing is of various types and it can be easily classified into three broad categories:


    +   - Static routing: It is also known as the nonadaptive form of routing. With
    this routing technique, the administrator of a network manually adds the preferred
    routes within the table of routing. A router sends the data packets towards the
    destination by following the route which is defined by the'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'administrator. In this routing technique, the decisions of routing are not
    at all made based on the topology or conditions of a network.


    # Advantages:


    +   1. No overhead: It has no form of overhead on the usage of the CPU of the
    network router. Therefore, a cheaper variant of the router can easily be used
    for obtaining static routing.


    +   2. Bandwidth: It has no usage of bandwidth between the network routers.


    +   3. Security: It provides proper security as the administrator of the system
    is allowed control only over the process of routing to a specific network.


    # Disadvantages:


    +   1. For a large-sized network, it turns out to be a very difficult task for
    manually adding each of the routes to the table of routing.


    +   2. The administrator of the system is required to have proper knowledge of
    the network topology as he needs to manually add each of the routes.


    +   Default routing: It is a technique in which the network router is configured
    for sending all the data packets to the exact same hop device and it is not necessary
    that whether it belongs to'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'that specific network or not. A data packet is being transported to the device
    for which it has been configured in the default form of routing. Default routing
    is being used when the networks only deal with one single point of exit. It is
    very helpful in situations when the transmission network need to transmit the
    packet of data to a similar hop device. When any particular route has been mentioned
    in the table of routing, the network router will be selecting the route which
    has been specified rather than using the default route. The default path or route
    is selected by the router only when any specific route has not been mentioned
    in the table of routing.


    +   * Dynamic routing: It is also called adaptive routing. In this technique of
    routing, the network router adds up a new route in the table of routing for every
    single data packet in response to all the changes which has been made in the topology
    or condition of the network. The dynamic protocols are being used for the purpose
    of discovering the brand new routes for reaching the destination. In this form
    of routing, OSPF and RIP are the only protocols which are used for the purpose
    of discovering new routes. In case any of the routes go down, the automatic adjustment
    will be done for reaching the destination.


    # Advantages:


    +   1. It is very easy to configure.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '2. It is the most effective of all for selecting the perfect and best route
    in response to all the changes in the topology or condition of the network.


    # Disadvantages:


    +   1. It is very expensive with respect to the bandwidth CPU usage.


    +   2. It is not much secure when compared with static and default routing.


    # The dynamic protocol needs to have these features:


    +   * All the network routers need to have the similar protocol of dynamic protocol
    for the purpose of exchanging the routes.


    +   * In case the network router discovers any form of change in the topology
    or condition of the network, the router needs to broadcast this information among
    all the other routers.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Network Services


    # DHCP


    Also known as Dynamic Host Configuration Protocol, is a protocol for network management
    which is used dynamically for the purpose of assigning IP address for the devices
    or for any node on any network so that is possible to establish communication
    by using the IP. DHCP manages centrally and also automates all of these configurations
    instead of having the administrators of a network to manually assign the IP addresses
    for all the networking devices. It is possible to implement DHCP on small-sized
    local networks and also on large-sized enterprise networks. DHCP helps assigning
    new IP addresses for every location when the networking devices are moved from
    one place to another. This means the administrators of the networks are not required
    to manually configure the devices with new IP addresses when it is moved to a
    completely new location within the network.


    # How does DHCP work?


    DHCP functions at the application layer of TCP/IP model for dynamic assigning
    of the IP addresses to the DHCP clients and for allocating TCP/IP configuration
    to the clients of DHCP. This is composed of subnet mask, IP addresses, default
    gateway and DNS address. DHCP serves as a client-server protocol. In this, the
    servers manage a unique pool of IP addresses along with various information regarding
    the configuration parameters of the clients and also assign address from those
    pools of address only. The clients which are DHCP enabled send out requests to
    the server of DHCP whenever they connect with the network.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'The clients which are configured with DHCP broadcast requests to the server
    of DHCP and requests information regarding network configuration for local network
    with which they are connected or attached. The clients generally broadcast their
    query for information as soon as they boot up. The server of DHCP responds to
    the requests of the clients by providing information regarding IP configuration
    which was specified previously by the administrator of a network. This also includes
    one particular IP address as well as for that time period which also called a
    lease and the allocation is valid for this one. At the time of refreshing any
    client of DHCP requests out for the same parameters but the server of DHCP might
    also assign a new IP address completely based on the policies which are set by
    the administrators of the network.


    The server of DHCP also manages a proper record of all those IP addresses which
    it allocates to the nodes of a network. In case any node is relocated within the
    network, the server of DHCP identifies it quickly by using MAC address which helps
    in preventing the accidental configuration of several devices by using the same
    IP address.


    DHCP is not all at a routable form of protocol nor is it secure. DHCP is limited
    within a LAN which means one server of DHCP every LAN is enough for usage in case
    of any failover. The larger form of networks might also have WAN which contains
    several locations locations. completely on the connections in between the points
    and the total number of clients in every location, several servers of DHCP can
    be set up for the purpose of handling address distribution.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'In case the administrators of a network want a server of DHCP to provide IP
    addresses for multiple subnets on any given network, they are required to configure
    the relay services of DHCP which located on the interconnecting routers across
    which the requests of DHCP needs to cross. These agents help in relaying the messages
    between the clients of DHCP and servers are located on various subnets. DHCP lacks
    the feature of built-in mechanism which would have allowed the clients and the
    servers to authenticate one another. Both the clients and the servers are susceptible
    to deception and to attacks as well.


    # Static DHCP leases VS. Dynamic DHCP leases


    By having a dynamic DHCP, the client does not own an IP address which has been
    assigned but instead of that leases the address for a period. Every time when
    a device with a dynamic form of IP address gets powered up, it needs to communicate
    with the server of DHCP for leasing another IP address. The wireless types of
    devices are the examples of those clients who are assigned with dynamic IP addresses
    whenever they connect to the network. The devices which are assigned with a static
    form of IP address have permanent IP addresses. They are used for various devices
    as switches or web servers.


    Under a setup of dynamic DHCP, the clients need to perform certain tasks that
    result in termination of its address and then reconnect with the network with
    the use of other IP address. The lease times of DHCP varies depending on the period
    of time for which a user needs the internet connection at one specific location.
    The devices with a dynamic IP'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'address, release the IP addresses when the lease of their DHCP expires and
    then the devices request for renewal of IP addresses from the server of DHCP in
    case they want to stay online for a longer time. The server of DHCP might assign
    a completely new IP address instead of just renewing the old IP address.


    # NAT


    For accessing the internet, a user needs one IP address which is public in nature.
    Private IP addresses can be used in those networks which are private in nature.
    The primary goal of NAT is to permit several devices to get access to the internet
    by using one public IP address only. For the purpose of achieving this, it is
    required to translate the IP address to a public IP address. NAT or Network Translation
    is the process by which one or more than one local form of IP address is readily
    translated into one or more than one Global form of IP address and vice versa
    for the purpose of providing internet access to all the local hosts.

    Also, NAT translates the port numbers which means it helps in masking the port
    number of the host with some other port number within the data packet which will
    be moved to the destination. NAT then makes the required entries of port numbers
    and IP addresses in the table of NAT. It operates on the firewall or router generally.


    # Types of NAT


    There are three ways in which NAT can be configured.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '+   - Static NAT: In this form of configuration, one private IP address is
    mapped with one public IP address one-to-one mapping between the local and the
    global address. This form of configuration is generally used for the purpose of
    web hosting. This form of configuration is not at used in the organizations as
    there be various devices which will need access to the internet at the same time.


    +   - Dynamic NAT: In this form of NAT configuration, one private IP address is
    being translated into one public IP address from a huge pool of IP addresses of
    public nature. In case any IP address from a pool is not free, the packet will
    be dropped off as only a specific number of IP addresses can be translated from
    private to public.


    +   - Port address translation or PAT: This configuration is also called NAT overload.
    In this form of configuration, various private IP addresses are translated into
    one single public IP address. For the purpose of distinguishing the traffic, port
    numbers are used.


    # Advantages of NAT


    +   - NAT helps in conserving public IP addresses.


    +   - It helps in maintaining proper privacy as the IP address of the device which
    will be receiving and sending traffic will be in hidden form.


    +   - It helps in the renumbering of address when any network evolves.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Disadvantages of NAT


    +   - The translation of IP addresses might result in delay in path switching.

    - There are various applications which will not be functioning when NAT is enabled.

    - It complicates various protocols of tunneling like IPsec.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Switching


    VLAN Trunking Protocol


    VTP or VLAN trunking protocol is used for maintaining proper continuity and consistency
    throughout a network. VTP allows the users to add up, remove or rename VLANs which
    is propagated to some other switches within the domain of VTP. However, there
    are certain requirements for the VTP to communicate about VLAN information between
    the switches. The version of VTP needs to be on similar on all the switches which
    the user needs to or wants to configure. Also, the domain name of VTP needs to
    be same on all the switches. For VTP communication, one of the switches needs
    to act like the server or be the server.


    # Modes of VTP


    There are three different modes of VTP:


    +   - Server: All the switches are set for this mode by default. This mode allows
    the users to add, delete or create VLANs. Any kind of change that the user wants
    to make needs to be done in this mode. Each and every change which is made in
    this mode will be propagated to every switch which belongs to the same domain
    of VTP.


    +   - Client: In this mode of VTP, the switches receive all the updates and are
    also capable of forwarding all those updates to the other switches.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '+   * Transparent: This mode of VTP forwards only the summary of VTP advertisements
    via the trunk line. The switches of this mode can create their own database of
    local nature which can keep secrets from all the other switches.


    # Spanning Tree Protocol


    STP or spanning tree protocol is being used for creating a loop-free network by
    the process of network monitoring for tracking all of the links and then shutting
    down those which are less redundant of nature.


    # STP and its types


    +   * 802.1D: This type of STP is also called CST or common spanning tree. This
    is a standard of STP which has been developed by the IEEE which selects one single
    root bridge only for every topology. All of the traffic in the network flows in
    the same path but this might not be good always as there might be issues in which
    the path has been optimized for reaching the VLAN is completely different from
    the path which has been obtained after electing root bridge. It is also very slow
    in nature as it takes minimum 32 seconds of time for converging.


    Advantages:


    It requires very less CPU and memory.


    Disadvantages:'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'It comes with a lesser percentage of optimization as the path which is calculated
    as the perfect to root bridge might turn out to be not the best path for reaching
    the network. It also offers no form of load balancing.


    +   * **802.1w or RSTP**: RSTP or rapid spanning tree protocol is the standard
    which has been developed by the IEEE for providing a faster rate of convergences
    that CST. However, it also holds a similar idea of finding a single root bridge
    within the topology.


    +   * **RPVST**: Also known as rapid per VLAN spanning tree, is a standard which
    has been developed by Cisco for providing faster rates of convergence than RSTP
    and also finds separate instances for 802.1w for every VLAN. However, it needs
    more memory along with CPU when compared with the other standards of STP.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Routing Configuration


    OSPF


    Also known as Open Shortest First protocol, is a form of link-state routing protocol
    which helps in finding the best path between the destination and the source router
    by using up its own shortest path. OSPF protocol has been developed by IETF as
    an IGP or interior gateway protocol which is the protocol for moving the packets
    within a very large system of autonomous nature or domain of routing. It acts
    in the network layer and works on the protocol number 89.


    Terms of OSPF


    +   * **Router ID**: It represents IP address on the router which is the most
    active of all. The highest address of loopback is considered at the first place
    and in no form of loopback has been configured, the IP address which is the highest
    active within the interface is considered.

    * **Router priority**: It is a value which is assigned to the router which is
    operating OSPF. It is 8 bit in nature and helps in electing BDR and DR within
    a broadcast network.

    * **DR or designated router**: It is elected for minimizing the total number of
    adjacency which has formed.

    * **BDR or Backup designated router**: BDR acts as the backup of DR within a broadcast
    network. Whenever DR performance goes down, BDR assumes the role of DR and starts
    to perform the functions of DR.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# BDR and DR election


    The election of BDR and DR takes place within a broadcast network or within a
    multi-access network. The criteria for election are:


    +   * The router which has the highest priority of router will be elected as the
    DR.

    * In case there is any form of a tie in choosing the router priority, the router
    ID which is the highest will be considered.


    # EIGRP


    EIGRP or enhanced interior gateway routing protocol is a form of dynamic routing
    protocol which is being used finding the best route between two devices of layer
    3 for delivering the data packet. It functions at the network layer of the OSI
    reference model. It uses up protocol 88 for functioning. EIGRP uses the method
    of metric for finding out the perfect path between the two devices which operates
    EIGRP.


    # Characteristics of EIGRP


    EIGRP functions with the following characteristics:'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   * It works with an advanced form of operational efficiency.

    * It acts as a classless protocol of routing.

    * It comes with the capability of both distance vector and link state.

    * It comes with some unique features like RTP or reliable transport protocol,
    DUAL or diffusing update algorithm and all forms of updated information about
    the neighbors.

    * It offers a faster rate of convergence as it precalculates all the routes and
    also does not broadcast timer packets prior to convergence.


    It uses delay, load, bandwidth and reliability for calculating the metrics for
    the table of routing.'
  merge: -1
  img_proc: true
