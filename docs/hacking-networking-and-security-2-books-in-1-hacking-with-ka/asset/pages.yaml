- pgno: 210
  md: '# MITM


    MITM, also known as man in the middle is another method of cyber attack which
    is used by the attackers. In this method, the attackers impose themselves in a
    secretive way between the pathway of the user and any type of web service that
    the user is trying to or wants to access. This is mainly done across free Wi-Fi
    networks where there is no form of security. The attacker can easily hack such
    networks and wait for the user to establish a connection with any web service.
    Once the user sends in important information to the web service via the attacker
    being in the middle, the attacker gains access to all that information that he
    needs, without even the user knowing anything about it. The user unknowingly sends
    in all the information like bank or credit card details. The attacker can easily
    harvest any form of data that he wants including the passwords of bank accounts.'
  merge: -1
