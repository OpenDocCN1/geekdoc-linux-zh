- pgno: 24
  md: '# # Chapter 4: Peer to Peer Connection


    In the world of networking, there are various types of connection that can be
    found and created easily. Each of the connections comes with a particular purpose
    and structure of its own. A P2P or peer to peer network is created when two or
    more than two computers are connected with each other and share resources and
    data with each other without the presence of any server system. In this form of
    connection, all the computers within the network share an equal amount of responsibility
    for the purpose of data processing. Peer to peer network is completely different
    from client-server networking. In a client-server network, the server acts as
    the master system and processes data which is consumed or used by the other client
    systems within the network. However, this is not the case with peer to peer connection.


    A peer to peer network can act like an ad hoc connection in which several computer
    systems are connected with each other via Universal Serial Bus for the purpose
    of transferring files and data. It can also perform as a permanent infrastructure
    which links up several computers within a small office network with the use of
    copper wires. A P2P connection can also be a larger network of much bigger scale
    which uses special protocols along with applications for the purpose of setting
    up a direct relationship with all the users over the internet. In simple words,
    a peer to peer network can assume various at times and as required.


    # ## Peer to Peer connection and its characteristics'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Peer to peer connection can be found on all forms of small-sized LAN or local
    area network. It is most commonly found in home networks. Both the wired and wireless
    form of home network can be set up as peer to peer network. All the computers
    which are involved in a peer to peer network run the same protocols of networking
    and software. The network devices of peer are often located near another peer
    generally in small businesses, homes, schools and smaller organizations. There
    are also other types of peer to connection that utilizes the internet and are
    dispersed at long distances geographically all over the world.


    The home networks which use routers of broadband are a hybrid form of peer to
    peer and client-server network. The broadband router provides a centralized sharing
    connection of internet but the printer, files and all other sharing of resources
    are directly managed between all the involved local computers.


    # Peer to peer along with Ad Hoc network


    The Wi-Fi or wireless networks support ad hoc connection in between the devices.
    Ad Hoc networks are a form of pure peer to peer connection which can be compared
    with those networks that use wireless routers as the intermediary device. The
    devices that build up ad hoc networks require no form of infrastructure for the
    purpose of communication.


    # Benefits of Peer to Peer connection


    Peer to peer network is robust in nature. In case one of the attached devices
    fails to perform, the network continues to function with the use of'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'other devices. You can easily configure the computers in a peer to peer network
    groups for allowing file sharing, printers along with other resources across all
    the connected devices. Peer to peer connection allows both way sharing of data,
    whether for the purpose of downloading to the computer or for uploading from the
    computer.


    While on the internet, peer to peer networks can easily handle huge volumes of
    traffic of file sharing. It handles huge traffic by distributing the load across
    all the computers in the network. As P2P connections are not dependent on any
    form of central server, this network is better in scalability and is also more
    functional when compared to client-server network at the time of any kind of emergency
    or heavy traffic.


    You can easily expand a peer to peer network. As you keep the total number of
    devices in the network, the power of peer to peer network also keeps on increasing.
    This is because in peer to peer connection, all the devices are responsible for
    data processing and with the increase in the number of devices within the network,
    the processing power and speed of the network also increases.


    # Peer to Peer connection and the security concerns


    In this world of today, none of the network systems is safe from external attacks.
    Just like client-server network, peer to peer connection is also a vulnerable
    network form to security attacks. In peer to peer connection, all the devices
    in the network participate in traffic routing across the network. So, it becomes
    easier for the attackers to launch attacks such as denial of service by the use
    of one such device on the network. The software for'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'peer to peer connection acts both as the client and the server. This makes
    P2P network much more prone to remote attacks when compared with a client-server
    network.


    The corrupted data can still be shared on the peer to peer network simply by modifying
    the files which are on the network for the purpose of introducing malware or malicious
    codes.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/dfdb59329a06b0e4d53fac932c198967_28_0.png)'
