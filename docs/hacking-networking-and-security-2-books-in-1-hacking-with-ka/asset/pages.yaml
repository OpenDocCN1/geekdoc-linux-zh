  md: '# Chapter 4: Installation of Hacker '' s OS Kali Linux


    If you are pursuing your career in cybersecurity, it is very important to have
    an operating system which is security-focused. With a suitable OS, you can easily
    perform several tedious along with time-consuming tasks in no time at all. There
    are various OS based on Linux today but Kali Linux is regarded as the best and
    the most famous of all. It is being widely used for the purpose of penetration
    testing, assessment of network security along with ethical hacking.


    # Kali Linux in detail


    Kali Linux is the leading distribution of Linux which is being widely used for
    ethical hacking, network assessment and penetration testing. Kali Linux comes
    with various built-in command line tools for hacking which is also geared for
    several tasks of information security.


    # Why use Kali Linux?


    Kali Linux is the most preferable Linux distribution for the following logics:


    +   - It comes with approx 600 tools for penetration testing.

    - Kali Linux comes with multilingual support.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '+   * This OS is completely customizable. In case you are not satisfied with
    the current features and settings, you can customize it according to your need.

    * It supports various wireless devices.

    * It is developed in an environment which is highly secure.

    * It comes with custom kernel which is patched for the injections.

    * It is absolutely free and functions as a software which is open source in nature.


    If you want to use Kali Linux for ethical hacking and cybersecurity, you need
    to learn how to install the OS first. Let''s have a look at steps installing Kali
    Linux.


    # How can you install the OS Kali Linux?


    The installation of Kali Linux is a very simple process. You will also get various
    options for installation. The most preferable options for installation are:


    +   * Installing Kali Linux via hard disk

    * Installing Kali Linux by creating a USB drive which is bootable in nature

    * By using software virtualization like VirtualBox or VMware

    * Dual system of booting Kali Linux with the OS'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Installing Kali Linux with the help of virtualization software like VMware
    is the most preferable option for installation.


    # Requirements for installation of the OS


    You need to fulfill the following requirements for installing the OS.


    +   - Free space of minimum 20 GB in the hard disk of your machine

    - USB/ DVD drive support

    - A minimum of 4 GB RAM capacity while using VirtualBox or VMware


    # Getting started with the process of installation


    +   - Start by installing VMware


    For the purpose of running Kali Linux in your machine, you need some kind of virtualization
    software at the first place. Install VMware and then launch the application.


    +   - Downloading the OS Kali Linux and checking for integrity of image


    For download the OS, you can directly visit the official website of Kali Linux
    and select the version that you need. On the page of download, you will come across
    various hexadecimal style numbers. Those'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'numbers are for security tasks and you are required to check the image integrity
    right before downloading the OS.


    +   - Launching an advanced virtual machine


    On the homepage of VMware workstation, select the option of create new virtual
    machine. After that choose the iso file of Kali Linux OS and then configure all
    the required details of virtual machine. You can start with the virtual machine
    by choosing Kali Linux VM and then selecting the green button which indicates
    Power On. After you have completed all the steps, the machine will start.


    # Procedure of installation


    +   - Once the machine powers up, you need to select the preferable mode of installation
    right in GRUB menu. Choose graphical installation and then select continue.


    +   - The next few screens will be asking you for selecting the locale information
    like your preferable language, location of origin and also layout for the keyboard.


    +   - Once you are done with all the additional local information, the installer
    will be automatically installing various additional components. It will then configure
    the settings related to your network. The installer will immediately prompt for
    your hostname along with the domain for completing the process of'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'installation. You need to provide all the appropriate and required information
    and then continue with the process.


    +   Now you are required to set up a password for the Kali Linux machine. You
    need to remember this password as long as you are going to use the machine.


    +   After you have set your password for the Kali Linux machine, the OS installer
    will prompt for setting up the time zone. It will then pause for partitioning
    of disk. The installer of OS will provide you with four different disk partition
    choices. The easiest option out of all is the Guided-Use Entire Disk option. If
    you are an experienced user, you can opt for the manual disk partitioning for
    having granular options of configuration.


    +   You need to select the disk partitioning and then click on continue.


    +   Make sure that you confirm all the changes that you have made on the host
    machine to the disk. In case you continue with the process, it will be erasing
    all the data on the disk.


    +   Once you have confirmed the changes in the partition, the OS installer will
    start the process of file installation. The system will be installing the files
    automatically. The whole process might take up some time.


    +   After completion of file installation, the system will be asking you for setting
    up the network mirror for obtaining future updates. Make sure that you select
    this function is you are going to use Kali Linux in the future.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   - The installer will be configuring the package manager for all the related
    files.


    +   - Then you will be asked for installing boot loader of GRUB. Click on yes
    and select the device for writing up the required information of boot loader directly
    to the hard disk which is necessary for booting Kali Linux.


    +   - Select continue for finishing the process of installation.


    +   - After this the installer will be installing some files in the final stage.


    After this, you can use Kali Linux for all your requirements.'
