- pgno: 275
  md: '# # Chapter 18: Ethical Hacking and Penetration Testing


    There is a misconception among most people which is that they think ethical hacking
    and penetration testing is both the same thing. However, in reality, it is not
    so in actual. Not only normal human beings who are not acquainted with the world
    of cyber security but the cyber security experts also get confused at times between
    the two. Although both of them fall under the same section of offensive security,
    there is a thin line that differentiates both. Offensive security is composed
    of various objects such as penetration testing, reverse engineering of software,
    social engineering, ethical hacking and many more.

    in the world of cyber security, both the items ethical hacking and penetration
    testing are of utter importance. Let’s have a look at some of the aspects of both
    the components.


    # ## Penetration Testing


    Penetration testing, as the name goes by, can be understood that it is a process
    of testing whether penetration is possible or not. It looks out for all sorts
    of vulnerabilities, risks, malicious content and flaws within a system. By system,
    it can either be a computer system or an online server or network. This process
    is done for the purpose of strengthening the system of security in an organization
    for the sole purpose of defending the infrastructure of IT. It is a procedure
    which is official in nature and can be'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'regarded as very helpful and not at all harmful attempt if used wisely. Penetration
    testing is an essential part of ethical hacking where it is focused on the attempt
    of penetrating a system of information.


    As it is very helpful in readily improving the overall strategies of cyber security,
    the process of penetration testing needs to be performed at regular intervals.
    Several forms of malicious content are built up for finding out the weak points
    within an application, program or system. The malware is spread throughout the
    network for testing the vulnerabilities. Pent might not be able to sort out all
    forms of concerns regarding security, but it can actually minimize the chances
    of any attack. Penetration testing helps in determining whether an organization
    or company is vulnerable to any form of cyber attack or not, whether the measures
    of defense are on point and of which of the security measures needs to be changed
    for decreasing system vulnerability.


    Penetration testing can easily show the strengths and weaknesses of the structure
    of an IT system at one point of time. The pentesting process is not at all a casual
    process. It comes with lots of planning, granting of permission for pentesting
    from the management and then starting the process without preventing the normal
    flow of work in an organization.


    # Ethical Hacking'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'The role of an ethical hacker is somewhat similar to that of a penetration
    tester. But, the process of ethical hacking comes with various forms of diversified
    duties. Ethical hacking encompasses all the methodologies of hacking along with
    all forms of methods related to cyber attack. The process of ethical hacking is
    targeted to the identification of vulnerabilities and also fixes all of them just
    before any attacker can exploit the information for the purpose of executing cyber
    attack. Ethical hacking is being called ethical as all the required functions
    are performed only after the granting of required permissions from the authority
    for intruding the system of security. The ethical hackers perform their role on
    the ground of ethics whereas the attackers hack without any prior alarm.


    The role of a professional ethical hacker is very critical as well as complex
    as the person who is intruding the system of security needs to perform everything
    without even affecting the overall functioning of the system and then locate the
    available vulnerabilities as well. The ethical hacker traces out the possible
    vulnerabilities and reports the authority about the required measures. An ethical
    hacker not only works with the methodologies of security but also suggests the
    implementation of the same. The safety of an IT infrastructure is in the hands
    of an ethical hacker.


    # Penetration testing Vs. Ethical hacking


    Although the functioning of both penetration testing and ethical hacking might
    seem similar but both differ from each other in various aspects. The main goal
    of penetration testing is to look out for vulnerabilities within a'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'specific environment. In the case of ethical hacking, it uses various types
    of attacks for finding out the flaws in security. Penetration testing deals with
    the security of a particular area whereas ethical hacking is a comprehensive term
    and pentesting is a function of the ethical hacker. For being a good pentester,
    past experience is required in the field of ethical hacking. Ethical hacking is
    one step towards pentesting. Unless and until someone knows the methodologies
    properly, they will not be able to carry on with a penetration testing.


    Penetration testing does not require very detailed writing of reports. However,
    in the case of an ethical hacker, an ethical hacker needs to be an expert report
    writer. Paper work is comparatively less in penetration testing when compared
    to ethical hacking. In the case of ethical hacking, detailed paper work with legal
    agreements is required. Penetration testing consumes very less time which is not
    the case with ethical hacking. It requires a lot more time and effort. For penetration
    testing, accessibility of the overall system is not required. In the case of ethical
    hacking, a hacker requires complete accessibility of the target system.


    # Bottom line'
  merge: -1
  img_proc: true
- pgno: 279
  md: As penetration testing techniques are being used for protecting the systems
    from all forms of threats, the attackers are also coping up with the same and
    are coming up with new vulnerability points in the target applications. So, it
    can be said that some sort of penetration testing is not at all sufficient for
    protecting the system of security. This is not the case with ethical hacking as
    it effectively finds out the loopholes and reports about the same for further
    improvement. There are many cases where it has been found that when a new vulnerability
    has been found in a system, the attackers hacked the system immediately after
    the testing. However, it does not imply that penetration testing is not useful
    at all. It cannot prevent an attack from taking place but can help in the improvement
    of a system.
  merge: -1
  img_proc: true
- pgno: 280
  md: '![](img/dfdb59329a06b0e4d53fac932c198967_280_0.png)'
  merge: -1
