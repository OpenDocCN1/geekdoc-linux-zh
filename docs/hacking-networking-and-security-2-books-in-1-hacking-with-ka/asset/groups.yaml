    - 它具有高效的路由功能。

    - IP 地址的管理非常简单。

    - 它为 IP 地址提供了内置的隐私保护。


    在 IPv4 中，IP 地址显示为 32 位数字，以十进制格式编写，例如 210.251.165.40 或 192.251.1.1。与 IPv6 类似，可能有数万亿个
    IP 地址，它以十六进制格式编写，例如 20gge:1500:6565:4:0000:7ff:fe31:97cf。


    ## IP 地址及其类型


    有多种 IP 地址。虽然所有形式的 IP 地址由字母或数字组成，但并非所有的都用于相同的功能。IP 地址的类型包括私有地址、公网 IP 地址、静态 IP 地址和动态
    IP 地址。


    - 私有 IP 地址：这种形式的 IP 地址通常用于内部内部，例如任何形式家庭网络，用于 WiFi 摄像头、移动设备、桌面电脑和无线打印机。这种类型的 IP
    地址允许设备与中央路由器以及基于类似私有家庭网络的其他设备进行通信。这种 IP 地址可以手动配置，也可以由网络路由器自动分配。


    - 公网 IP 地址：这种类型的 IP 地址用于网络的外部区域，由服务提供商或 ISP（互联网服务供应商）分配。它是业务或家庭网络用于与全球其他网络设备通信的主要地址。它通过为家庭设备提供通往
    ISP 及其外部世界的路径提供帮助。它允许网络中的设备访问各种网站，并直接与全球各地的计算机和其他服务器进行通信。


    这两种类型的 IP 地址在本质上都是静态或动态的，这意味着它们会变化或保持不变。由 DHCP 服务器分配的 IP 地址被称为动态 IP 地址。如果设备未启用
    DHCP 服务器或不支持 DHCP，则需要手动分配 IP 地址，在这种情况下，该 IP 地址被称为静态 IP 地址。


    ## 动态 IP 地址


    动态 IP 地址是自动分配给网络中每个节点（如桌面电脑、智能手机或平板电脑）的地址。IP 地址的自动分配是由 DHCP 服务器完成的。由 DHCP 服务器分配的
    IP 地址被称为动态的，因为它将根据未来与网络的连接情况而发生变化。


    ## 在哪里找到动态 IP 地址？


    由服务提供商或 ISP 为大多数业务和家庭网络用户分配路由器的公网 IP 地址本质上是动态的。较大的组织和公司尝试不使用动态的 IP 地址连接互联网，而是倾向于使用专门为它们分配的静态
    IP 地址。


    在任何形式的本地网络中（如你办公场所或家中的网络，使用了私有 IP 地址），大多数设备都预配置了 DHCP。这意味着所有设备都使用动态 IP 地址。如果设备未启用
    DHCP，则每个设备都需要手动设置网络信息。


    ## 动态 IP 地址及其优势


    动态分配 IP 地址的一个主要优势是它本质上更具灵活性。与静态 IP 地址相比，它的设置非常简单，管理部分也更容易。例如，当你的一个设备连接到网络时，它会被分配一个特定的
    IP 地址。一旦设备断开网络，该 IP 地址就会释放，并可以供之后连接的另一个设备使用，即使它不再是同一台设备。


    动态 IP 地址对连接到网络的设备总数限制很少，因为不需要保持连接的设备可以轻松从网络断开，从而为其他设备释放可用的 IP 地址池。另一种方案是，如果网络中的所有设备都想同时连接网络，DHCP
    服务器可以网络中的每个设备预配置某些特定的 IP 地址。在这种情况下，数百个网络设备（无论用户是否在使用）都拥有自己的特定 IP 地址，这可能会很容易限制网络中所有新设备的网络访问。


    与静态 IP 地址相比，动态 IP 地址的实现过程更容易。对于想要连接网络的新设备，不需要手动设置任何内容。你只需要确保网络路由器上启用了 DHCP。由于所有网络设备默认都从巨大的可用
    IP 地址池中每个获得一个特定的 IP 地址，因此每一步都是自动的。


    ## 动态 IP 地址及其缺点


    对于任何形式的家庭网络，使用 DHCP 服务器为路由器分配的动态 IP 地址是非常常见的现象，在技术上也是接受的；问题出现在用户尝试从任何其他外部网络访问同一个家庭网络时。


    ## 静态 IP 地址


    静态 IP 地址是手动配置的，而不是由 DHCP 服务器分配的。静态 IP 地址的意味着 IP 不改变，本质上是静态的。它可以被视为变化的动态 IP 地址的完全相反。手机、平板电脑、笔记本电脑、路由器和其他使用
    IP 地址的设备可以通过通过在主机名处手动输入设备的 IP 地址来轻松配置。


    为什么需要使用静态 IP 地址？


    你可以把 IP 地址看作是你的物理地址。这些地址不会改变，本质上是静态的。它有助于与人联系。同样，当你从家里托管网站、使用网络打印机、使用任何形式的远程访问程序或运行打印服务器时，静态性质的
    IP 地址非常有益。由于静态地址永远不变，网络中的所有设备都将知道如何连接。


    例如，当网络内的 PC 设置静态性质的 IP 地址时，一旦设备获得了特定的 IP 地址，就可以按照特定配置路由器来转发所有的入站请求。如果你在托管网站而没有使用静态
    IP 地址，这可能会非常麻烦。这主要是因为当计算机获得某些 IP 地址时，你每次都需要更改路由器设置，将请求转发到新的 IP 地址。如果你忽略这样做，任何人都可以进入你的网站，因为路由器将不知道网络中哪个设备专门为网站提供服务。


    工作环境中静态性质 IP 地址的另一个很好的例子是 DNS 服务器。DNS 服务器始终使用静态地址，以确保网络设备确切知道如何连接到服务器。如果它们经常更改，你还需要定期在路由器上重新配置
    DNS 服务器。


    '
