    # Components of the client-server model


    The client-server model works with three components: servers, network devices
    and workstations. Workstations in a network are those computers which are subordinate
    to the servers. Workstation sends out various requests to the servers for accessing
    the shared files, programs, databases and files. It is governed by the server
    policies. The server in a network serves all the requests that come from the workstations
    and can also perform several other functions like management of the programs,
    files, databases along with the policies of management. Network devices in a network
    help in establishing communication between the servers and the workstations. In
    simple words, the network devices act as the connectors and also routes the data
    in and out from the network.


    # Workstations


    Workstations, also known as client computers, are the ones which send out requests
    to the servers. They are differentiated by the OS which runs their systems. In
    a network of client-server, Windows XP, Windows 7, Windows 10, Linux etc. are
    the OS of the workstations. These OS are cheaper than the OS of servers, the processes
    and functions of such OS are intended for the client computers or workstations
    only. Shared programs, policies of security and management and centralized databases
    are not part of the OS. They come with a localized version of policies programs
    and databases. The workstations come with a lower level of technical specifications
    when compared with the servers in respect to processor speed, memory and space
    of hard drive as the client systems are not required to record any form of data
    or process any request like the server system.


    # Servers


    Servers are differentiated from each other by their individual sets of OS such
    as Windows 2003, Windows 2008 or Windows 2000 server. When it comes to the servers,
    they come with faster speed of processing, higher hard drive space along with
    more memory. It is mainly because the servers stores up various forms of data
    and also services multiple workstation requests simultaneously. A server can perform
    any type of role within a client-server network. It can act as the mail server,
    file server, domain controller and database server at the same time. However,
    for a network which is well-setup always divides all these roles among all the
    available servers for optimizing the network performance. But, no matter what
    role a server performs, it acts as the centralized repository for databases, programs,
    network files and policies.


    Servers are very easy to manage and also take backup as the servers in a network
    are not all dependent on the configuration of the individual user and it can be
    implemented seamlessly across the network.


    # Network devices


    Network devices act as the intermediary between the server and the workstation
    and help in establishing a connection between the two. Network devices make sure
    that the requests going from and to the workstations are properly routed with
    the concerned server. There are various types of network devices available today
    and each performs different functions of connectivity. In a basic client-server
    network, the hub helps in connecting a server with the various workstations. It
    also functions as a repeater and passes on information and data from one device
    in the network to another. Network devices such as bridges help in separating
    the various segments of a network.


