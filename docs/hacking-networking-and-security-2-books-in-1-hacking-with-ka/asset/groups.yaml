    ## 静态 IP 地址的缺点


    与动态 IP 地址相比，静态 IP 地址的一个主要缺点是，网络中的所有设备都必须手动配置。所有形式的家庭 Web 服务器以及远程访问程序都要求为设备设置特定的
    IP 地址，并与路由器进行正确配置，以便与特定地址进行通信。这比只需插入路由器并让通过 DHCP 服务器提供动态 IP 地址要耗费更多的工作量。


    如果一个设备被分配了如 `192.168.1.10` 的 IP 地址，而你又进入一个完全全新的且分配地址为 `10.x.x.x` 的网络，那么你将无法使用你的静态
    IP 地址连接。该设备需要重新配置，以便使用 DHCP 服务器或使用能够与新网络良好兼容的静态性质 IP 地址。


    当设备使用静态 IP 地址时，安全性也可以被认为是另一个缺点。当使用一个从不更改的 IP 地址时，会给攻击者留出足够的时间来发现设备网络中的各种漏洞。唯一的替代方案是使用会变化的动态性质
    IP 地址，这将迫使攻击者改变与该设备通信的方式。


    ## 静态 IP 地址 vs 动态 IP 地址


    动态 IP 地址与从不更改的 IP 地址是完全相反的类型。动态形式的 IP 地址就像静态 IP 一样的普通 IP 地址，但动态 IP 并没有永久绑定到设备上。动态
    IP 地址不是终身使用一个地址，而是仅用于特定的时间段，然后返回到 IP 地址池，以便网络中的其他设备可以使用。


    与静态 IP 地址相比，动态 IP 地址在优势方面可能更多。如果互联网服务提供商（ISP）继续对所有客户使用静态 IP 地址，很快新客户的 IP 供应就会有限。动态
    IP 地址提供了一种解决方案，当一个 IP 地址未被任何其他设备使用时，它可以被其他设备重复使用。因此，比静态 IP 地址能够为更多设备提供互联网访问。


    静态形式的 IP 地址具有有限的停机时间。当动态形式的地址获取新 IP 时，连接到现有 IP 地址的用户会被从连接中移除，否则必须等待寻找新地址。当你准备访问网站、文件共享服务或在线游戏时，这不是一个推荐的设置，因为这些功能都需要持续的活动连接。


    在商业场所或家庭等任何本地网络中，你通常使用私有性质的 IP 地址，此类网络中的大多数设备都配置了 DHCP。因此，所有设备都使用动态形式的 IP 地址。分配给商业或家庭网络路由器的公共形式
    IP 地址是动态的。大型公司不使用动态地址连接互联网。他们使用动态地址，而是使用分配给他们的静态 IP 地址。


    ## 如何获取静态 IP 地址？


    如今的一些路由器已经为连接到网络的设备预留了 IP 地址。这个过程通常通过 DHCP 预留的帮助完成，通过将特定的 IP 地址与 MAC 地址关联来实现，这样每当设备向路由器请求
    IP 地址时，路由器都可以分配用户为该特定 MAC 地址已选择的地址。当你想要为业务或家庭网络获取静态 IP 地址时，可以通过联系你的 ISP 来实现，这取决于提供互联网的公司。与获取动态
    IP 地址相比，为家庭和其他本地网络拥有静态 IP 地址是非常昂贵的。


    ## 使用动态 IP 地址伪造静态 IP 地址


    由于为家庭或业务网络获取静态 IP 地址可能比普通的动态地址贵得多，最好的选择是使用动态 DNS 服务或 DDNS 同时采用这两种形式的 IP 地址。DDNS
    服务将不断变化的动态 IP 地址与同样不更改的主机名关联。这正就像拥有你自己的静态形式 IP 地址，而无需支付动态 IP 之外的任何额外费用。


    No-IP 是免费 DDNS 服务的一个示例。你可以用它来重定向你所需的主机名以关联网络。简单来说，如果你有一个动态地址，当你不想为静态 IP 支付更多时，DDNS
    服务非常有帮助。你还可以通过 DDNS 托管你的网站并随时访问网络。


    ## DHCP 服务器


    DHCP 服务器无非网络服务器，它自动为客户端提供并分配 IP 地址，以及默认网关和其他参数。它依赖于名为动态主机配置协议（Dynamic Host Configuration
    Protocol）的标准协议来响应查询。在 DHCP 服务器的情况下，网络管理员需要设置每一个客户端。这可能是一个繁琐的过程，特别是涉及大型网络时。DHCP
    服务器为每个客户端分配一个动态性质的 IP 地址。


    ## DHCP 服务器的优势


    比在交换机或路由器上使用 DHCP 更好的选择是拥有一个中央 DHCP 服务器。在需要支持两种协议的网络环境中情况确实如此。DHCP6 具有多种优势：


    - 当你拥有集成到 IPv6 的 IPAM 系统中的 DHCP6 服务器时，它将为你提供所有客户端节点的可见性。

    - DHCP 服务器还提供接口的管理和日志记录，这有助于管理员管理 IP 地址范围。

    - DHCP 服务器还提供高可用性和冗余。如果其中一个 DHCP 服务器故障，网络中的客户端将保留其当前的 IP 地址，而不会导致任何形式的节点。


    ## 为什么你应该使用路由器作为 DHCP 服务器？


    大多数交换机和路由器都具有提供以下 DHCP 支持的能力：


    - DHCP 客户端并从上游 DHCP 服务获取 IPv4 地址接口。

    - 一个 DHCP 中继，并直接在局域网内将客户端的 UDP DHCP 消息转发到指定的 DHCP 服务器。

    - 在交换机和路由器上运行 DHCP 服务器会消耗设备网络上的所有资源。此类 DHCP 数据包由软件处理。

    - 不需要动态 DNS 支持。交换机或路由器 DHCP 服务器无法根据租给客户端的 IPv4 地址在客户端的 DNS 中创建条目。


    开始实施 IPv6 的组织需要迁移到 IPv4 的 DHCP。这种 DHCP 的变化也表明该组织也希望拥有用于运行两种协议的 DHCP。


    '
