    \ VLANs help in defining the domains of-\n\n## How does VLAN work?\n\nPorts or\
    \ interfaces on the switches can be assigned to one single or more than VLANs\
    \ which enable the systems to get divided into various logical groups which are\
    \ based completely on the departments with which they are associated. It also\
    \ establishes the rules about the systems about how the systems in the separate\
    \ groups are going to communicate with one another. These separate groups can\
    \ range from practical and simple to legal and complex.\n\n## VLANs and its types\n\
    \nThere are various types of VLANs present. Let's have a look at them.\n\n- *\
    \ Protocol VLAN: This type of VLAN comes with traffic handled base on the protocol.\
    \ The switch on the network will either forward or segregate the traffic.\n- *\
    \ Static VLAN: It is also known as port-based VLAN. It requires the administrator\
    \ of a network for assigning the ports on the switch to a network.\n- * Dynamic\
    \ VLAN: It allows the network administrator to define the membership of the network\
    \ which is based on the characteristics of the device which is in opposition to\
    \ the switch port.\n"
  mdcn: "\n在接收端：传输层从报头读取端口号，然后将收到的数据包转发给相应的应用程序。该层还负责对分段的数据进行重组和排序。\n\n## 传输层的功能：\n\
    \n- 1. 分段：传输层接收来自会话层的收到的的消息，然后将其分成若干较小的单元。分段后产生的段带有与每个段相关的报头。分段后的消息在目的地由传输层进行重组。\n\
    - 2. 服务点地址：为了将消息传递到正确的进程，传输层报头还包含一种地址类型，称为端口地址或服务点地址。通过确定此特定地址，传输层确保预定的消息被传递到正确的进程。\n\
    \n## 传输层提供的服务：\n\n- 1. 面向连接的服务：整个过程分三个阶段完成：\n    - 连接建立\n    - 数据传输\n    - 断开连接或终止\n\
    \n在这种传输形式下，当目的地收到数据包或一组数据包后，接收端的设备会立即向源发送一个确认信号。这种传输形式也非常安全且可靠。\n\n- 2. 无连接服务：该过程本质上是一个阶段，它包含了数据传输。在这种传输形式下，接收者并不确认所有收到的包。这种传输方法允许设备之间进行更快的通信模式。然而，面向连接的服务比无连接服务可靠得多。\n\
    - 会话层：会话层负责连接建立、会话维护、身份验证以及会话安全。该层的功能有：\n    - 1. 会话的建立、维护和终止：该层帮助两个进程之间建立、使用并终止连接。\n\
    \    - 2. 同步：会话层帮助在数据中添加被进程视为同步点的检查点。这些同步点有助于识别错误，以确保数据以正确的方式重新同步。它还确保消息结束不会被提前截断，以避免数据丢失。\n\
    - 3. 对话控制器：该层允许两个系统以全双工或半双工模式开始相互通信。\n- 表示层：表示层也被称为翻译层。从应用层接收的数据在此层中被提取，并根据网络上传输的格式要求对其进行处理。该层的功能有：\n\
    \    - 1. 翻译：它帮助进行翻译过程，例如从 ASCII 到 EBCDIC。\n    - 2. 加密和解密：数据的加密将整个数据转换成某种形式或代码。加密后的数据称为密文。解密后的数据称为明文。为了数据加密和解密，该层使用键值。\n\
    \    - 3. 压缩：该层有助于减少传输到网络中的比特总数。\n- 应用层：在 OSI 模型分层结构的顶端是应用层。它是一个由网络中的应用程序实现的层。网络应用程序产生要跨网络传输的数据。应用层作为应用程序访问网络服务的窗口，并用于向用户显示接收到的信息。网络应用程序的一些示例有\
    \ Web 浏览器、即时通讯软件等。该层的功能有：\n    - 1. 邮件服务\n    - 2. 网络虚拟终端\n    - 3. FTAM 或文件传输访问与管理\n\
    \    - 4. 目录服务\n\nOSI 模型作为参考模型，完全没有在互联网中实现，因为它被认为是过时的。TCP/IP 模型被用来取代 OSI 参考模型。\n\
    \n## VLAN\n\nVLAN 或虚拟局域网是由一组位于一个或多个 LAN 上的设备组成的，这些设备被配置为某种方式通信，就像它们都连接在同一根线线上一样，尽管它们位于\
    \ LAN 的几个不同段上。VLAN 在本质上是非常灵活的，因为它基于逻辑连接而非物理连接。VLAN 有助于定义二层网络中的广播域。（此处省略重复的 VLANs\
    \ help in defining the domains of broadcasting句子...）\n\n## VLAN 如何工作？\n\n交换机上的端口或接口可以分配给单个或多个\
    \ VLAN，这使得系统能够根据其所属的部门被划分为不同的逻辑组。它还规定了不同组的系统之间如何相互通信的规则。这些分离组的范围从实用简单到法律复杂。\n\n\
    ## VLAN 及其类型\n\n存在各种类型的 VLAN。让我们来看一下：\n\n- * 协议 VLAN：这种 VLAN 基于协议处理流量。网络上的交换机将转发或隔离流量。\n\
    - * 静态 VLAN：它也被称为基于端口的 VLAN。它需要网络管理员将交换机上的端口分配给网络。\n- * 动态 VLAN：它允许网络管理员根据设备的特征（而非交换机端口）来定义网络成员。\n"
