    and also services multiple workstation requests simultaneously. A server can perform
    any type of role within a client-server network. It can act as the mail server,
    file server, domain controller and database server at the same time. However,
    for a network which is well-setup always divides all these roles among all the
    available servers for optimizing the network performance. But, no matter what
    role a server performs, it acts as the centralized repository for databases, programs,
    network files and policies.


    Servers are very easy to manage and also take backup as the servers in a network
    are not all dependent on the configuration of the individual user and it can be
    implemented seamlessly across the network.


    # Network devices


    Network devices act as the intermediary between the server and the workstation
    and help in establishing a connection between the two. Network devices make sure
    that the requests going from and to the workstations are properly routed with
    the concerned server. There are various types of network devices available today
    and each performs different functions of connectivity. In a basic client-server
    network, the hub helps in connecting a server with the various workstations. It
    also functions as a repeater and passes on information and data from one device
    in the network to another. Network devices such as bridges help in separating
    the various segments of a network.


    ![](img/dfdb59329a06b0e4d53fac932c198967_23_0.png)


    # Chapter 4: Peer to Peer Connection


    In the world of networking, there are various types of connection that can be
    found and created easily. Each of the connections comes with a particular purpose
    and structure of its own. A P2P or peer to peer network is created when two or
    more than two computers are connected with each other and share resources and
    data with each other without the presence of any server system. In this form of
    connection, all the computers within the network share an equal amount of responsibility
    for the purpose of data processing. Peer to peer network is completely different
    from client-server networking. In a client-server network, the server acts as
    the master system and processes data which is consumed or used by the other client
    systems within the network. However, this is not the case with peer to peer connection.


    A peer to peer network can act like an ad hoc connection in which several computer
    systems are connected with each other via Universal Serial Bus for the purpose
    of transferring files and data. It can also perform as a permanent infrastructure
    which links up several computers within a small office network with the use of
    copper wires. A P2P connection can also be a larger network of much bigger scale
    which uses special protocols along with applications for the purpose of setting
    up a direct relationship with all the users over the internet. In simple words,
    a peer to peer network can assume various at times and as required.


    ## Peer to Peer connection and its characteristics


    Peer to peer connection can be found on all forms of small-sized networks.


    The Wi-Fi or wireless networks support ad hoc connection in between the devices.
    Ad Hoc networks require no form of infrastructure for the purpose of communication.


    # Benefits of Peer to connection


    Peer to peer network is robust in nature. In case one of attached devices fails
    to perform, the network continues to function with the use of other devices. You
    can easily configure the computers in a peer to peer network for allowing file
    sharing, printers along with other resources across all the connected devices.
    Peer to peer connection allows both way sharing of data, whether for the purpose
    of downloading to the computer or for uploading from the computer.


    While on the internet, peer to peer networks can easily handle huge volumes of
    traffic of file sharing. It handles huge traffic by distributing the load across
    all the computers in the network. As P2P connections are not dependent on any
    form of central server, this network is better in scalability and is also more
    functional when compared to client-server network at the time of any kind of emergency
    or heavy traffic.


