  - '[PAGE 120]


    # Routing


    Routing is the process by which path is selected along which the requested data
    is to be transferred from the source of origin right to the receiver or destination.
    Routing is done by a special network device which is known as a router. The router
    functions at the networking layer in the OSI reference model and in the internet
    layer in the model of TCP/IP. A router is a device which is used in networking
    which helps in forwarding the data packets based completely on the available information
    within the header of the packet along with the forwarding table. For the purpose
    of routing the data packets, various routing algorithms are used. The routing
    algorithm is a software which helps in deciding the path which will be the optimal
    one for the data packet to be transmitted to the destination.


    The protocols regarding use metric for determining the perfect and fastest path
    for the delivery of the packet. Metric is nothing but the standard which is used
    for measurement such as bandwidth, hop count, current path load, delay etc. which
    being used by the algorithm of routing for determining the optimal delivery path.
    The algorithm of routing maintains and also initializes the table of routing which
    is required for the process regarding the determination of path.


    # Metrics of routing


    Routing metrics along with costs are used by the router for determining the most
    suited route up to the destination. The factors which are used by the routing
    protocols for determining the fastest path are known as metrics. For some of the
    routing protocols, they use static form of metrics'
  - '[PAGE 121]


    whose value cannot be changed and some of the protocols use the dynamic version
    of metrics whose value can be changed and then assigned by the administrator of
    the system. The most common values of metrics are:


    +   - **Hop count:** It is the metric which helps in specifying the total number
    of passes across the devices of internetworking like the router. A data packet
    needs to move in a route for travelling right from the source to the destination.
    If the protocol of routing takes the hop as a primary value of the metric, the
    path which comes with the least hop count is going to be considered as the fastest
    and the best path for moving the data packet from the source to the destination.

    - **Delay:** It is the time which is taken by the network router for processing,
    queuing and transmitting one datagram to the interface. The protocols of routing
    use this form of metric for determining the values of delay for each and every
    link which are in the path from end-to-end. The path which will be having the
    lowest value of delay will be taken as the best path for the data packet.

    - **Bandwidth:** The capacity that a link has is called the bandwidth of that
    link. The link bandwidth is measured as bits per second. The link which has the
    highest rate of transfer such as gigabit will be preferred over any other link
    which comes with a link capacity of like 52 kb. The protocol of routing will be
    determining the capacity of bandwidth for each and every link along the path and
    the link which comes with overall higher bandwidth will be taken as the perfect
    route for moving the packet from source to destination.'
