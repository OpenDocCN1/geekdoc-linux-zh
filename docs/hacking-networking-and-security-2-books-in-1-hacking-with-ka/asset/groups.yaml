    ## Chapter 12: Background and History of TCP/IP


    TCP/IP is a protocol set which enables the communication between various computers
    in a network. Protocols are nothing but the standards or rules which help in governing
    communications. When two devices in a network want to communicate with each other,
    both need to use the same protocol. This can also be compared to the communication
    of human beings. A person who speaks French will not be able to communicate with
    a person who speaks Chinese as both them speak different languages. You have the
    option of selecting from a large pool of network protocols for using in the network.
    But when it comes to TCP/IP, it is regarded as the industry standard. All forms
    of operating systems support TCP/IP. The whole internet works on TCP/IP. It is
    also called the language of the internet. In case you want a computer to communicate
    with the internet, you are required to use TCP/IP.


    ## History of TCP/IP


    Just before the internet of today, there was ARPANet. It was created by ARPA or
    Advanced Research Projects Agency. It was launched at the time of the Cold War
    in 1969. ARPANet was created as a response to the rising threat of nuclear attack
    from the Soviet Union. ARPA''s main goal was to create a network which would be
    fault-tolerant and would enable the leaders of the U.S. military to stay in touch
    in case of a nuclear war. The protocol which was used for ARPANet was known as
    the NCP or Network Control Protocol. As ARPANet grew in size, another protocol
    was also required as NCP was unable to meeting the growing needs of a large-sized
    network.


    In the year 1974, a paper was published describing the features of TCP or Transmission
    Control Protocol. NCP was eventually replaced by TCP. After further development
    and testing of the new language, it led way to a brand new set of protocols which
    was called TCP/IP or Transmission Control Protocol/Internet Protocol. It was finally
    in the year 1982 when TCP/IP replaced NCP as the standard language for ARPANet.


    ## Features of TCP/IP


    TCP/IP has been in the industry for more than 35 years. It is a proved set of
    protocols that make it possible for the devices to connect with the internet.
    It comes with various features that make communication much easier.


    - **Support of multi-vendor**: TCP/IP is being implemented by several software
    and hardware vendors. It has been now a standard of the industry and is not at
    all limited to a particular vendor.


    - **Interoperability**: Today, people can work in a network which is heterogeneous
    in nature only due to TCP/IP. While you are using a computer which runs on Windows
    OS, you can still download your required files from a machine that runs on Linux.
    This is possible only both the systems support TCP/IP. It helps in eliminating
    the boundaries of cross-platform.


    - **Logical addressing**: Each and every adapter of the network comes with a unique
    physical address which is permanent in nature. This permanent address is known
    as MAC address, also known as the hardware address. This address is being burnt
    into the hardware card at the time of manufacturing. The protocols which are low-lying
    in nature and are hardware conscious on LAN delivers the packets of data with
    the use of the physical address of the adapter. The local adapter present in each
    computer tracks each and every transmission on the LAN for determining whether
    the message has been addressed to its very physical address.


    For a small-sized LAN, this whole thing works very well. But, when a computer
    is connected to a very large network just like the internet, it will need to listen
    to billions of transmissions every second. This might result in the failure of
    the network connection. For avoiding such cases, the administrators of the networks
    divide the big networks into various smaller networks with the use of devices
    like routers for reducing the network traffic. It makes sure that the unwanted
    traffic from any network will not create any kind of problem in some other network.
    The administrators can again subdivide a network into subnets for each travelling
    of the message directly from the sender to the receiver. TCP/IP comes with great
    capacity of subnetting which is achieved with the help of logical addressing.
    The address which is configured by the network software is called the logical
    address. TCP/IP uses a system of logical addressing which is known as the IP address.


    - **Routability**: A router is a device of the network infrastructure which is
    capable of reading the information of logical addressing and then directs the
    data through the network right to the destination. TCP/IP is a routable kind of
    protocol. This means that the data packets can be easily moved from one to another.


    - **Flow and error control**: TCP/IP comes with various features that make sure
    the data is delivered reliably. Transmission Control Protocol also checks many
    of error and flow control.


