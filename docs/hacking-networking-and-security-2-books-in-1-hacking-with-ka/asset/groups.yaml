    在 Python 编写脚本时，格式化是一个非常重要的特性。Python 解释器使用格式化样式来决定如何分组代码。格式的细节不如逻辑性重要。因此，如果你正在处理一组代码并将从双重缩进开始，你需要在
    Python 脚本编写中坚持双重缩进，以识别代码是共同存在的。这种格式情况在其他编程语言中完全不同，其他语言对格式的要求是可选的。


