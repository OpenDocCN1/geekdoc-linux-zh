  mdcn: "\n各种高级别协议，如 UDP、TCP、FTP 和 HTTP。所有此类协议都与互联网协议集成，旨在提供更多的附加功能。该家族中也存在一些低级互联网协议，如\
    \ ICMP 和 ARP，它们在该家族内部共存。属于 IP 家族的高级协议与网络浏览器等应用程序有更紧密的交互。而低级协议则与网络适配器以及计算机的其他一些硬件进行交互。\n\
    \n## 无线网络协议\n\n无线网络系统现在已经普及，这主要归功于蓝牙、Wi-Fi 和 LTE。存在用于检查无线网络运行的无线网络协议。为无线网络设计的网络协议需要支持移动设备的漫游，并处理网络安全和可变数据速率等各种问题。\n\
    \n## 网络路由协议\n\n网络路由协议是专门为网络路由器设计的一种特殊协议。网络路由协议能够识别网络上的其他多个路由器，管理网络消息的终点，管理被称为“路由”（routes）的消息路径，并对路由做出动态决策。最常见的路由协议包括\
    \ OSPF、EIGRP 和 BGP。\n\n## TCP 或传输控制协议\n\nTCP 或传输控制协议被视为 IP 协议族的核心协议。它起源于网络的实现，并补充了\
    \ IP。因此，整个套件也被称为 TCP/IP。TCP 通过在 IP 网络上提供可靠的字节流传输系统来提供帮助。TCP 的主要特性包括错误检查和排序。所有主要的基于互联网的应用程序（如电子邮件和带有文件传输的世界维网）都依赖于\
    \ TCP。\n\n## 网络协议是如何实现的？\n\n如今的大多数现代操作系统都内置了软件服务，帮助实现对某些网络协议的支持。各种应用程序（如网络浏览器）带有软件库，当应用程序运行需要时，这些库会支持高级别协议。对于路由和\
    \ TCP/IP 的某些低级协议，支持正直接在硬件中实现，以提高整体性能。\n\n通过网络发送并由目的地接收的每个数据包都由二进制数据（0 和 1）组成，这有助于编码消息内容。大多数网络协议会在每个数据包的开头添加较小的头部，用于存储有关消息发送者和预期终地的信息。某些协议还会在数据包的末尾添加\
    \ IP 尾部。每个网络协议都具有识别其所有格式消息的能力，并将头部和尾部作为跨设备移动数据的一部分进行处理。\n\n一组在层层和低层共同运行的网络相关协议被称为协议族。最常用的协议包括：默认端口\
    \ 80 的 HTTP、默认端口 20/21 的 FTP、默认端口 22 的 SSH、默认端口 23 的 Telnet 以及默认端口 53 的 DNS。\n\
    \n## OSI 模型层及其功能\n\nOSI 模型或开放系统互连模型是一个七层架构，每层都执行某些特定功能。所有层都紧密协作，旨在将数据从全球范围内一个系统传输到另一个系统。\n\
    \n- **物理层**：OSI 模型底部的层是物理层。它负责在网络中相关设备之间建立实际的物理连接。物理层的所有信息都以位（bits）的形式存储。在接收数据时，物理层接收信号并将其转换为\
    \ 1 和 0。然后，它被发送到数据链路层，由该层重新组装成帧。物理层的功能包括：\n    - 1. 位同步：该层通过提供时钟帮助位同步。物理层提供的时钟负责控制发送端和接收端，从而在位级上提供同步。\n\
    \    - 2. 比特率控制：该层负责定义传输速率，即每秒发送的位总数。\n    - 3. 物理拓扑：该层决定网络中所有节点和设备的排列方式，包括星型、总线型和网状拓扑。\n\
    \    - 4. 传输模式：该层决定数据在连接设备之间如何流动。可能的模式有单工、半双工和全双工。\n\n- **数据链路层**：这是物理层之上的第二层。它负责从节点到节点的消息传递。数据随后被分成帧。链路层充当逻辑链路控制（LLC）和介质访问控制（MAC）。该层还使用\
    \ MAC 地址。链路层的功能包括：\n    - 1. 成帧：数据链路层的主要功能是成帧。它在帧的开头结尾添加特殊模式。\n    - 2. 物理地址：该层在头部添加发送者和接收者的\
    \ MAC 地址。\n    - 3. 错误控制：该层带有错误控制机制；如果发现错误，则重传帧。\n    - 4. 流量控制：通过流量控制，协调双方的数据量，以避免被淹没。\n\
    \    - 5. 访问控制：当多个设备共享单个信道时，该层帮助确定哪个设备拥有控制权。\n\n- **网络层**：该层负责将数据传输到位于另一个网络的主机。网络层还负责数据包路由，这意味着它帮助从所有可用路由中选择路径。它的功能是：\n\
    \    - 1. 路由：网络层协议决定哪条路由是数据包从源到目的地的最佳路径。\n    - 2. 逻辑地址：为了唯一地标识互联中的每个设备，网络层通过定义地址方案来提供帮助。发送者和接收者的\
    \ IP 地址被放置在头部中。\n"
