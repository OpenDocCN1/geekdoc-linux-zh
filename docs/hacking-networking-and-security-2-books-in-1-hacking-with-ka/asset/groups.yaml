    At the receiver side: The transport layer reads up the number of a port from the
    header and then forwards the packet of data which it has received for the respective
    application. This layer also performs reassembling and sequencing of the data
    which is segmented.


    # Functions of the transport layer:


    +   1. Segmentation: The transport layer accepts the sent message from the session
    layer and then breaks it onto several smaller units. The segments which are produced
    after segmentation comes with a header associated with every segment. The segmented
    message is reassembled by the transport layer at the destination.


    +   2. Service point addressing: For the purpose of delivering message to the
    proper process, the header of the transport layer also includes an address type
    which is called the port address or service point address. By determining this
    specific address, the transport layer makes sure that the intended message gets
    delivered to the right process.


    # Services provided by transport layer:


    +   1. Service oriented to connection: This whole process is done in three phases:


    +   -Connection establishment


    +   -Transfer of data'
  - '[PAGE 112]


    -Disconnection or termination


    In this form of transmission, the device on the receiver’s sides sends out an
    acknowledgement intended for the source right after a data packet or group of
    packet has been received by the destination. This form of transmission is very
    secure and reliable as well.


    2. Connection less service: This process is one phase in nature and it includes
    transfer of data. In this form of transmission, the receipt of a packet is not
    all acknowledged by the receiver. This form of transmission approach allows a
    faster mode of communication in between the devices. However, the connection oriented
    service is much more reliable than the connection less service.


    +   Session layer: The session layer serves the function of connection establishment,
    session maintenance, authentication and also security of the session. The functions
    of this layer are:


    +   1. Establishment of session, maintenance of session and termination: This
    layer helps in the establishment of the two processes, uses and also terminates
    the connection.


    +   2. Synchronization: The session layer helps in adding up checkpoints which
    are regarded as the points of synchronization by a process into the data. The
    points of synchronization help in identification of the errors in order to ensure
    that the data has been re-synchronized in the'
  - '[PAGE 113]


    proper way. It also ensures that the message ends are not prematurely cut for
    avoiding loss of data.


    3. Dialog controller: This layer allows the two systems to begin the communication
    with one another in full-duplex or half-duplex.


    +   * Presentation layer: The presentation layer is also known as the translation
    layer. The data which is received from the application layer is extracted in this
    layer and is also manipulated as per the requirements of the format for transmitting
    the same over the network. The functions of this layer are:


    +   1. Translation: It helps in the process of translation such as from ASCII
    to EBCDIC.


    +   2. Encryption and decryption: The encryption of data translates the whole
    data into some form or code. The data which is encrypted is known as the cipher
    text. The data which is decrypted is known as the plain text. For the purpose
    of data encryption and data decryption, a key value is used by this layer.


    +   3. Compression: This layer helps in reducing the total number of bits which
    is to be transmitted into the network.


    +   * Application layer: At the top of the stack of layers of the OSI model exists
    the application layer. It is a layer which is implemented by the applications
    in a network. The applications of the network produce the data which is to be
    transferred across the netork. The application layer serves as'
  - '[PAGE 114]


    a window for the services of applications for accessing the network and also for
    the purpose of displaying the information which is received to the user. Some
    examples of network applications are web browsers, messengers etc. The functions
    of this layer are:


    +   1. Mail services


    +   2. Network virtual terminal


    +   3. FTAM or file transfer access and management


    +   4. Directory services


    The OSI model as the reference model and is not at all implemented for the internet
    as it is considered as being outdated. TCP/IP model is used in place of the OSI
    reference model.'
  - '[PAGE 115]


    # VLAN


    VLAN or virtual LAN is a group composed of devices on one or more than LANs which
    are configured for communicating in a way as if all of them are attached with
    the same wire whereas they are located at several different segments of a LAN.
    VLANs are extremely flexible in nature as it is based on a logical connection
    in place of a physical connection. VLANs help in defining the domains of broadcasting
    in a network of Layer 2 nature. A broadcast domain is nothing but a set of all
    the devices which will be receiving frames of broadcast originating from any devices
    within that set. The broadcast domains are bounded typically by the routers as
    the routers will not be forwarding the frames of the broadcast.


    The switches of Layer 2 create broadcast domains which are completely based on
    the switch configuration. Switches are the multiport bridges which allow in creating
    several broadcast domains. Each of the broadcast domains is similar to a distinct
    form of a virtual bridge which can be found within a switch. You can easily define
    one single or many bridges of virtual nature which are available within a switch.
    Each of the virtual bridge which a user creates within the switch helps in defining
    a new VLAN or broadcasting domain. It is not possible for traffic to directly
    pass to some other VLAN between two switches or within that switch.


    VLAN acts just like a sub-network. VLAN eases the job for the network administrators
    to divide one switched network for matching the security and functional requirements
    of the systems without the need of running new cables or without making any major
    changes in the present infrastructure of the network. VLANs are generally set
    up by the large-'
  - '[PAGE 116]


    sized businesses for the purpose of re-partitioning the devices for the better
    management of traffic.


    VLANs also help in improving the all-round performance of the network simply by
    grouping all the devices together which communicates the most. VLANs also provide
    proper security for the large-sized networks by providing a greater degree of
    control across which the devices have access to each other. One or more than one
    switch can support several independent VLANs by creating Layer 2 subnet implementation.


    # VLANs and its types


    There are various types of VLANs present. Let''s have a look at them.


    +   * Protocol VLAN: This type of VLAN comes with traffic handled base on the
    protocol. The switch on the network will either forward or segregate the traffic
    based on the protocol of the traffic.

    * Static VLAN: It is also known as port-based VLAN. It requires the administrator
    of a network for assigning the ports on the network switch to a network of virtual
    nature.

    * Dynamic VLAN: It allows the network administrator to define the membership of
    the network which is based on the characteristics of the device which is in opposition
    to the switch port location.


    # How does VLAN work?'
  - '[PAGE 117]


    Ports or interfaces on the switches can be assigned to one single or more than
    one VLANs which enable the systems to get divided into various logical groups
    which are based completely on the departments with which they are associated with.
    It also establishes the rules about the systems about how the systems in the separate
    groups are going to communicate with one another. These separate groups can range
    from practical and simple to legal and complex. Each of the VLAN provides access
    of data link to all the hosts which are connected to the switch ports configured
    with the similar VLAN ID. The VLAN tag is a field of 12-bit in the header of the
    Ethernet which provides support for 4,096 VLANs per domain switching. The tagging
    of VLAN is standardized in the IEEE 802.1Q and is also called Dot1Q.


    When a frame is received untagged nature from a host which is unattached, the
    VLAN ID which is configured on the interface is added up in the header of the
    data link frame by using the format 802.1Q. The frame of 802.1Q is forwarded towards
    the proper destination. Each of the switches uses the tags for keeping each traffic
    of the VLAN separate from the traffic of the other VLANs, forwarding the same
    only to the place where VLAN is configured.


    The trunk lines in the switches can handle several VLANs by using the tags for
    keeping them all segregated. A trunk line is a line of communication which has
    been designed for carrying several signals for the purpose of providing network
    access in between two different points. When the frame reaches the ultimate switch
    port of the destination, the tag of VLAN is removed just before the frame is transmitted
    to the device of destination.'
