    # 第19章：常见问题


    ## 应该多久进行一次渗透测试？


    组织根据自己的一套规定和指令来执行。他们遵循的标准将决定他们是否需要渗透测试。组织的标准带有其自己的方法论，这些方法论有助于描述保护安全系统的最佳实践。标准还将决定是否需要为了合规性和随后的审计目的进行测试记录。


    ## 什么是非法无线网络？


    非法无线网络的作用就像路由器或 Wi-Fi 站一样仅仅是一个接入点。它被插入组织的网络中；但它并不符合组织现有的无线基础设施标准。


    ## 如何安装非法无线网络？


    这种形式的安全威胁发生在任何设备被引入组织并连接到网络中时，无论是有意还是无意。许多类型的设备默认激活了 Wi-Fi，但完全没有经过配置。这意味着当设备首次启动时，它将开始广播信号以进行连接。


    ## 企业的员工会使组织面临网络威胁吗？


    是的，他们可以。任何带有与公司 Wi-Fi 连接设备的设备都可能成为业务的潜在威胁。恶意软件可以通过笔记本电脑、平板电脑或智能手机通过网络在不知不情的情况下进入系统。这发生在
    Wi-Fi 分段未被妥善锁定的时候。如果业务服务器没有在完全不同的 VLAN 上隔离，所有无线网络流量都可以访问同一个空间，那么发生安全泄露和数据窃取的概率很高。


    ## 尽管存在相关的潜在风险，企业还需要无线网络吗？


    现代企业如果没有无线技术将无法法运作。然而，应用于无线设备的技术标准和配置将决定无线技术的实用性以及安全泄露的潜在风险。有许多形式的企业，员工需要使用平板电脑和扫描仪工作，特别是在制造和仓储行业。对于此类企业来说，没有无线网络的存在将是不可能的。


    ## 业务员工会暴露组织遭受网络威胁吗？


    是的，他们可以。任何携带与公司 Wi-Fi 连接设备的设备都可能成为业务的潜在威胁。恶意软件可以通过笔记本电脑、平板电脑或智能手机通过网络在不知不情的情况下进入系统。这发生在
    Wi-Fi 分段未被妥善锁定的时候。如果业务服务器没有在完全不同的 VLAN 上隔离，所有无线网络流量都可以访问同一个空间，那么发生安全泄露和数据窃取的概率很高。


    ## 尽管存在相关的潜在风险，企业还需要无线网络吗？


