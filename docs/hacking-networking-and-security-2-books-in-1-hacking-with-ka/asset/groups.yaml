    BASH 等其他脚本语言简单得多。


    ### 添加 Python 模块


    Python 的标准库以及模块为黑客提供了广泛的能力，包括异常处理、文件处理、内置数据类型、网络处理、数值和数学模块、加密服务以及与 IP 的交互。尽管有所有可用的现有模块和标准库，你可能还需要现有模块的第三方模块。所有用于
    Python 脚本的第三方模块本质上都是全面的，这也是大多数黑客在编写脚本时尝试选择 Python 的原因。


