    你可以通过多次练习帮助员工培养各种评估技能。你可以开始向你的员工介绍攻击者使用的各种信息搜集技术。要求员工执行 `ping` 扫描，然后使用 `nmap`
    对 `ping` 扫描进行端口扫描。随着他们能力的提升，引入其他复杂的技术，如服务指纹识别。让他们评估目前的安全措施是否足够。


