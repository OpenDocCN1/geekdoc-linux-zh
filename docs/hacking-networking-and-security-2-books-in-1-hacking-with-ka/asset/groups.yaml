    Python）中编写脚本的能力。让我们来看 BASH 脚本的基础。


    ### Shell 类型


    操作系统与用户之间的接口称为 shell（壳）。shell 允许运行各种程序、命令、操作文件以及许多功能。在 Linux 中，有多种类型的 shell。其中包含
    Z shell、Kom shell、Bourne again shell 或 BASH 以及 C shell。BASH shell 是所有 UNIX 和 Linux
    发行版中都提供的 shell。因此，它被专门用于黑客攻击。


    ### BASH 基础


    要创建一个 shell 脚本，你需要从任何文本编辑器开始。你可以自由使用 Linux 中可用的任何文本编辑器，如 vim、vi、geit、emacs、kate
    等。


    对于第一次脚本，你可以从一个非常简单的脚本开始，它将在屏幕上返回一条显示“Hi, null byte”的消息。你需要从输入 `#!` 开始，这称为 shebang。这会告诉操作系统
    shebang 之后的任何内容都将作为你编写脚本时使用的解释器。你需要在 shebang 之后立即通过输入命令 `/bin/bash` 来使用 BASH 解释器。因此，在这种情况下，它看起来就像是
    `#!/bin/bash`。接下来，你只需要输入“echo”，它将指示系统将你输入的任何内容回显到屏幕上。因此，你需要输入 `echo "Hi, null
    byte!`。


    ### 设置执行权限


    在你创建一个新文件后，它可能是不可执行的，即使对于所有者也是如此。当你创建一个文件时，可以在旁边看到指定的权限，如 `rw-r--r--`。这意味着文件所有者只有读和写权限，没有执行（x）权限。你可以通过
    `chmod` 命令修改执行权限。


    ### 运行脚本


    要运行脚本，你需要输入 `./hinullbyte`。脚本前的 `./` 命令指示系统你希望系统在当前目录下执行该脚本。


    ### 变量的使用


    如果你想创建一个更进阶的脚本，你只需要使用一些变量。变量无非存储区域，你可以在内存中轻松地保存某些东西。当提到“某些东西”时，可以是字符串、字母或数字。


