    +   * It makes it easier for the attackers for MITM or man in the middle attacks.


    +   * The attackers can easily hack any Wi-Fi network by spoofing their MAC address.


    +   * The attackers can directly target those devices which are connected to the
    LAN.


    +   * In case an attacker has been banned on a particular Wi-Fi network, they
    can easily gain access to that network by tricking the network to think that they
    are someone else.


    # Other uses of MAC spoofing


    # Anonymization


    There are various users who prefer to hide their identity and of their device
    right behind a customized MAC address which is not theirs. Such people are not
    hackers but are those who handles large amount of confidential data every day
    over the internet. This is done for protecting the privacy of the users. The main
    reason behind this is because the MAC addresses which are sent over any LAN or
    WLAN network which is public in nature are actually unencrypted. So, any user
    on the same network can track the devices which are registered within that network.
    People on that network can also access the data of the other systems and can also
    use the same for illegal activities. That is why masking the MAC address of those
    devices that functions over public LAN networks is a great option for protecting
    privacy and preventing data loss.'
  - '[PAGE 214]


    # Theft of identity


    For the protection of the IT systems from all kinds of external as well as internal
    dangers, the administrators many times implement various security measures for
    restricting the access of the authorized devices to the LAN. In such cases, linking
    elements like Ethernet switch helps in separating the bigger networks into various
    small segments. Once a connection has been linked from one segment to the other,
    Ethernet switch checks sender device''s MAC address and then matches it with the
    administrator record. In case the address does not match, the connection is blocked.
    However, the users of Windows and Linux OS can easily establish connection with
    the LAN without the use of MAC address.'
  - '[PAGE 215]


    # ARP Spoofing


    ARP spoofing is another type of cyber attack in which the attacker sends false
    Address Resolution Protocol or ARP messages over LAN. As a result, the MAC address
    of the attacker gets linked with the IP address of the target system or server.
    Once a connection has been established between the MAC address of the attacker
    and the IP address of the target system, the attacker will be receiving all data
    which is being sent to the targeted IP address. ARPing leads to interception of
    malicious attackers who can even result in modification or stopping of data transfer.
    ARP spoofing can only be done on LAN networks that work with ARP.


    # Attacks of ARP spoofing


    Like other cyber attacks, ARP spoofing is a very serious one. It can have serious
    effects on the functioning of big enterprises. ARP spoofing is mainly used for
    stealing all forms of confidential and sensitive data from the target system.
    Not only that, but ARP spoofing attack also helps in several other types of attacks
    such as DoS attacks, MITM attacks and hijacking of session as well.


    # Detection and protection from ARP spoofing


    There are various ways in which you can detect ARP spoofing and protect your system
    from the same.


    +   * Packet filtering: The packet filters help in inspecting the data packets
    as they are transferred across any network. Packet'
  - '[PAGE 216]


    filters can help in preventing ARP spoofing as it is capable of easily filtering
    and blocking those packets which comes with any form of suspicious information
    of source address.


    +   * Using ARP spoofing detecting software: Most of the organizations today are
    using detection software for ARP spoofing. Such software functions by properly
    inspecting and then certifying the data before the transmission takes place. It
    also helps in blocking those data that seems like being spoofed.


    +   * Using protocols for cryptographic network: SSH or secure shell, TLS or transport
    layer security and HTTPS or HTTP secure are some of the protocols that can help
    in preventing the attacks of ARP spoofing by encrypting all the data just before
    the process of transmission and then also authenticates the data when received.'
  - '[PAGE 217]


    # Rogue DHCP Server


    DHCP is the main reason behind the assigning of logical addresses of the systems
    which is the IP address. In case of a DHCP attack, the attacker sends out huge
    number of requests of DHCP packets along with MAC address which is spoofed in
    nature which is generally done by the use of tools like DHCP Rogue Server. When
    a lot of requests are sent, the server of DHCP starts responding to all the requests,
    allowing the attacker to consume all those IP addresses which are available to
    the server for some time. This is a form of DHCP DoS attack. In such attacks,
    the available pool of IP addresses is consumed by the hacker and blocks out any
    other request.


    More about DHCP and DHCP server


    DHCP also known as Dynamic Host Configuration Protocol is the protocol which is
    responsible for the management of DHCP server which assigns the available IP addresses
    to all the hosts which are alive along with other information of configuration
    like default gateway and subnet mask. DHCP is responsible for IP address assigning
    for each and every network.


    # How does DHCP work?


    A DHCP server serves the function of issuing IP addresses to the systems and also
    configures all other information of a network. In small networks and in homes,
    DHCP is available in individual PCs as well. DHCP server shares this overall information
    to the DHCP client with the help of exchange of a message series which is also
    known as DHCP transaction.'
