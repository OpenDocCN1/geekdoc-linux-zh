    ## 用于无线网络扫描的工具


    如今有多种工具用于对无线网络进行针对各种形式漏洞的扫描。一些最常用的工具包括：


    - Kali Linux：Kali Linux 可用于测试网络内部渗透。它是一个黑客工具，同时也为系统提供了各种安全工具，例如渗透测试。它被认为是一项非常有用的工具。

    - 无线网卡：如果你想将 Kali Linux 作为虚拟机使用，电脑的无线网卡可以直接在虚拟机内使用。它有助于检测网络中的任何形式的威胁，并返回安全测试的显著结果。


    ## 渗透测试的处


    渗透测试最大的处在于知识的获取。如果你的组织容易通过无线网络受到任何形式的威胁，那么尽早检测到这些威胁总比事后后悔要好。在渗透测试的帮助下，可以很容易确定当前的
    Wi-Fi 状态，并对无线网络配置应用所需的更改。如果渗透测试报告足够详尽，它可以帮助组织确定需要采取哪些安全策略来改进无线网络。渗透测试的理念最终有助于建立和改进各种安全措施，从而帮助防止数据泄露。这对于发现当前的安全措施是否足够保护无线网络也有益。


    ## 第 12 章：Linux 内核与可加载内核模块的管理


    今天找到的所有操作系统都由两个最重要的组件组成。第一个组件也是所有中最重要的部分是内核。内核是任何形式操作系统的主要组成部分。它位于你操作系统的正中心。它具有控制操作系统每一项功能的能力，这包括
    CPU 控制功能、内存管理以及对用户在屏幕上可见内容的控制。操作系统中的第二个重要元素是用户态（user land），它构成了其他所有内容。


    操作系统的内核设计方式是作为一个特权或受保护区域运行，任何其他特权账户或 root 账户都可以访问。这整个保护机制都是为了好。这是因为，对内核的无限访问可能会导致对操作系统功能提供各种形式的未经授权访问。因此，在现实世界中，市场上大多数的操作系统仅向用户在访问态（access
    land）提供访问服务的权限。在访问态中，用户可以轻松访问他们想要的任何内容，而无需控制操作系统。


    用户对内核的访问使他们能够改变操作系统外观、操作系统工作方式以及操作系统使用感受的能力。获取内核权限的用户还可以导致整个操作系统崩溃，从而使整个系统死亡或无法运行。尽管操作系统内核存在风险，但系统管理员有时出于安全和运营考虑需要访问操作系统内核。


    在了解内核的真实力量后，你可以很容易发现，如果黑客获取了操作系统的内核权限，他实际上可以控制整个系统，这可能是非常危险的。此外，对于某些高级形式的攻击（如
    MITM 或中间人攻击），攻击者可能还需要修改内核的功能。


    ## 什么是内核模块？


    就像人类通过 CNS 或中央神经系统的帮助执行所有功能一样，内核可以被视为操作系统的中央神经系统。它控制操作系统的每一项功能，还包括硬件组件之间交互的管理以及所需服务的启动。内核函数运行于用户实际可见的应用程序与执行所有任务的硬件组件（如硬盘、内存和
    CPU）之间。


    Linux 是一种强大的内核类型，允许添加内核模块。通常情况下，可以根据用户需要直接从内核删除或添加模块。有时，操作系统的内核可能需要某些更新，这需要安装某些新形式的设备驱动，例如蓝牙设备、显卡和
    USB 设备以及文件系统驱动程序。更新内核时，可能还需要安装一些系统扩展。为了以完整形式运行，驱动程序需要嵌入到内核中。


    在某些操作系统中，为了为了更新添加一个驱动程序，用户需要完全重建、组装并重启整个操作系统的内核。但在 Linux 中，它具备在不执行这整个过程的情况下向系统内核添加内核模块的能力。此类模块被称为
    LKMs 或可加载内核模块。LKMs 拥有对内核底层的访问权限，且这种权限是必要的。这使得 LKMs 成为所有攻击者的极易目标。有一种非常特殊的恶意软件被称为
    rootkit（根内核）。这种恶意软件将自己插入操作系统的内核中，大部分通过 LKMs 实现。如果像 rootkit 这样的恶意软件根入内核，攻击者将能够对操作系统的功能拥有完全控制。


    如果攻击者获取 Linux 管理员权限向操作系统内核加载新模块，攻击者不仅将获得控制目标系统的权限，还将控制目标系统报告的关于端口、硬盘空间、进程、服务等的每一个细节，简而言之，就是内核处理的所有内容。这主要是因为攻击者将在操作系统的内核层级上运行，因此可以说，当攻击者能够诱导
    Linux 管理员安装诸如带有 rootkit 的显卡驱动程序时，攻击者将能够控制内核以及操作系统。


    ## 内核模块的管理


    Linux 提供了两种方式来管理内核模块。第一种是使用一组名为 insmod（意为插入模块）的命令，它是为了处理模块管理而构建的。然后是 modprobe
    命令，这是第二种方法。该命令用于管理 LKMs。使用 modprobe 添加内核模块时，你需要使用 -a 参数。移除内核模块则需要配合 -r 参数。与 insmod
    相比，modprobe 命令具有额外的优势。在修改内核之前，modprobe 命令可以理解删除或添加的所有选项和程序。


    ![](img/dfdb59329a06b0e4d53fac932c198967_243.png)


    ## 第 13 章：网络安全与黑客


    ### 网络黑客


    随着时间的推移，网络黑客的攻击每天都在增加。没有哪一天是人们没有成为黑客攻击的受害者。当你作为网站所有者时，这会变得更加可怕。


