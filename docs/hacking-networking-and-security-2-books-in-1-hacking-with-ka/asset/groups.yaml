    最近部署和依赖自动化分析与监控工具的诱惑，对于网络管理员来说，可能就像诱惑奥尔西斯的塞壬之歌。然而，自动化的网络分析和监控系统对你的业务可能有一点危险。如果你将系统的完整监控工作交给自动化工具并过度依赖它们，可能会变成“眼不见为净”这种综合症的受害者，导致对你网络中的攻击未被察觉。随着时间的推移，由于员工被分配到其他任务而远离分析工作，IT
    分析技能也可能被侵蚀。组织内的网络用户可能会引入各种未经授权的应用程序。这些应用程序可能会干扰你业务的整体运行，因此清除此类项目至关重要。这就是为什么网络监控需要在不使用任何类型自动化工具的情况下进行。


    市场上大多数超现代的网络和安全产品的源头都在应用程序的命令行和脚本中。IT 管理员也开发了多种工具用于监控、分析、收集和响应各种安全相关问题。这些自动化应用程序的变体可以作为免费软件、开源软件或共享软件轻松获得。然而，尽管有这些自动化工具，为了分析和监控之目的准备一套定制化的工具包总是更好的。


    ## 评估及各种方法


    你作为业务或组织者，可以要求员工执行某些措施来对你的网络进行最终监控。


    - 验证防火墙的转发配置策略：你可以使用 `ping` 等流量生成工具来验证防火墙规则是否阻止或允许信任/共享网络与外部网络之间的流量。它需要根据你想要在网络中实施的安全策略运行。

    - 验证出站流量配置策略：为此，你需要在网络防火墙之外放置一个测试系统。在位于防火墙之外的测试系统上，尝试运行如 `Port Listener` 等应用程序。你需要使用如
    `nmap` 等端口扫描器，然后尝试连接到你配置的测试系统的每个监听端口。这样做是为了确认防火墙允许访问所有你通常希望向 Web开放的服务，并限制所有用户尝试连接到你信任网络的所有服务。受限制的服务将根据
    AUP（可接受用户策略）来决定是否允许访问。

    - 找出谁正在尝试探测你的网络以及从哪里：打开你的防火墙日志。选择尝试或试图探测你网络的流量源。使用 `tracert` 或 `traceroute` 等路由分析程序来正确识别转发的攻击流量路径以及该路径上的
    IP 地址、同一路径上的服务供应商以及攻击流量源自的网络。你可以使用 `whois`、`dig` 和 `nslookup` 等其他实用程序进行反向 DNS
    查询以及 `whois` 查询。在现实情况下，你的网站通常是 DDOS 或分布式拒绝服务攻击的目标。

    - 尝试对网络进行清理：分析程序配合如 `Ethereal` 等局域网流量捕获程序有助于提供有关网络最重要的信息。通过简单观察正在使用的应用程序类型，你可以轻松地识别出提供各种非法服务的主机。你甚至可以确定组织内的员工是否遵守
    AUP，是否有任何其他有害代码和根内核试图与攻击者的计算机建立任何类型的反连接，以及你的网络是否托管了任何种垃圾邮件机器人。


