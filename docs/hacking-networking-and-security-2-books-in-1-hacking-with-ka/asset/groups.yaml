    shell，而是指示目标机器下载一个位于网络上的可执行文件，然后将其保存到磁盘并执行该文件。这种形式的壳代码最用于驱动下载形式的攻击，受害者点击恶意网站链接后，壳代码下载恶意软件并将其安装在目标受害者的系统中。


