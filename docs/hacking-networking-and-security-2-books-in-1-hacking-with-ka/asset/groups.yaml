    P2P 或点对点网络。在这种连接形式下，网络内的所有计算机在数据处理方面共同承担同等的责任。点对点网络与客户端/服务器网络完全不同。在客户端/服务器网络中，服务器充主系统处理网络内其他客户端系统消耗或使用的数据。然而，点对点连接并非如此。


    点对点网络可以像临时连接（ad hoc connection）一样，多个计算机系统通过通用总线（USB）连接，用于传输文件和数据。它也可以作为永久性基础设施，使用铜电缆连接小型办公室网络内的几台计算机。P2P
    连接也可以是规模得得大的网络，使用特殊协议和应用程序，在互联网上的所有用户之间建立直接关系。简单来说，点对点网络可以根据需要随时承担各种角色。


