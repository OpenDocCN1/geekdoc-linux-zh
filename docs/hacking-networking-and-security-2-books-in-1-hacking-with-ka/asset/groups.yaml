    - 攻击者可以直接针对那些连接到局域网（LAN）的设备。

    - 如果攻击者在特定的 Wi-Fi 网络上被封，他们可以通过欺骗网络使其认为是别人来轻松获取该网络的访问。


    # MAC 欺骗的其他用途


    # 匿名化


    有很多用户倾向于在不属于自己的自定义 MAC 地址后面隐藏自己的身份和设备身份。这些人并不是黑客，而是那些每天在互联网上处理大量机数据的人。这样做是为了保护用户隐私。这背后的主要原因是，通过任何具有公共性质的局域网或
    WLAN 网络发送的 MAC 地址实际上是未加密的。因此，同一网络上的任何用户都可以跟踪在该网络内注册的设备。网络上的人员还可以访问其他系统的数据，并将其用于非法活动。这就是为什么对在公共局域网上运行的设备进行
    MAC 地址是保护隐私和防止数据丢失极极选择。


    # 身份盗取


    为了保护 IT 系统免受各种外部及内部危险的侵害，管理员经常实施各种安全措施来限制授权设备对局域网的访问。在这种情况下，连接以太网交换机等元素有助于将较大的网络划分为多个小段。一旦从一个网段连接到另一个网段，以太网交换机会检查发送设备的
    MAC 地址，然后将其与管理员记录进行匹配。如果地址不匹配，连接将被阻塞。然而，Windows 和 Linux 操作系统的用户可以轻松在不使用 MAC 地址的情况下与局域网建立连接。


    # ARP 欺骗


    ARP 欺骗是另一种类型的网络攻击，攻击者在局域网上发送虚假的地址解析协议（ARP）消息。其结果是，攻击者的 MAC 地址将与目标系统或服务器的 IP 地址关联。一旦攻击者的
    MAC 地址与目标系统的 IP 地址之间建立了连接，攻击者将接收到所有发送到目标 IP 地址的数据。ARP 欺骗会导致恶意攻击者的拦截，这甚至可能导致数据传输的修改或停止。ARP
    欺骗只能在运行 ARP 的局域网上进行。


    # ARP 欺骗攻击


    和其他网络攻击一样，ARP 欺骗是一种非常严重的攻击。它可能对大型企业的运行产生严重影响。ARP 欺骗主要用于从目标系统中窃取所有形式的机密和敏感数据。不仅如此，ARP
    欺骗攻击还有助于其他类型的攻击，如 DoS 攻击、MITM 攻击和会话劫持。


    # 检测和防止 ARP 欺骗


    有多种方法可以检测 ARP 欺骗并保护你的系统免受此类攻击。


    - 数据包过滤：数据包过滤器有助于在数据跨网络传输时进行检查。过滤器有助于防止 ARP 欺骗，因为它能够轻松过滤并拦截那些带有任何形式源地址可疑信息的数据包。

    - 使用 ARP 欺骗检测软件：如今大多数组织都使用 ARP 欺骗检测软件。此类软件通过在传输传输前正确地检查并认证数据来工作。它还有助于拦截那些看起来像伪造的数据。

    - 使用加密网络协议：SSH（安全外壳）、TLS（传输层安全）和 HTTPS（HTTP 安全）是某些协议，它们通过在传输过程之前加密所有数据，并在接收时验证数据，可以帮助防止
    ARP 欺骗攻击。


    # 仿造 DHCP 服务器


    DHCP 是分配系统逻辑地址（即 IP 地址）的主要原因。在 DHCP 攻击中，攻击者会发送大量的 DHCP 数据包请求，并带有伪造性质的 MAC 地址，这通常通过如
    DHCP Rogue Server 等工具完成。当发送大量请求时，DHCP 服务器开始响应所有请求，允许攻击者在一段时间内耗尽服务器可用的所有 IP 地址。这是一种
    DHCP DoS 攻击。在此类攻击中，可用的 IP 地址池被黑客耗尽并阻塞了任何其他请求。


    关于 DHCP 和 DHCP 服务器


    DHCP 又称为动态主机配置协议，是负责管理 DHCP 服务器的协议，它为所有存活的主机分配可用的 IP 地址，以及默认网关和子网掩码等其他配置信息。在小型网络和家庭中，个人
    PC 中也提供 DHCP。


    # DHCP 是如何工作的？


    DHCP 服务器为系统发行 IP 地址并配置网络的所有其他信息的功能。DHCP 服务器通过交换系列消息（也称为 DHCP 事务）将这些整体信息共享给 DHCP
    客户端。


