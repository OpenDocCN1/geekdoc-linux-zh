    - 静态 NAT (Static NAT)：在这种配置形式中，本地私有 IP 地址与全局公 IP 地址进行一对一的映射。这种配置通常用于 Web 托管目的。组织内部通常不使用这种配置，因为往往有多种设备需要同时访问互联网。


    - 动态 NAT (Dynamic NAT)：在在这种 NAT 配置中，一个私有 IP 地址将从巨大的公共 IP 地址池中转换为一个公共 IP 地址。如果池中的任何
    IP 地址未空闲，数据包将被丢弃，因为从私有到公转换的 IP 地址数量是有限的。


    - 端口地址翻译 (PAT)：这种配置也称为 NAT 泛载 (NAT overload)。在这种配置形式下，多个私有 IP 地址被转换为单个公共 IP 地址。为了区分流量，使用了端口号。


    ## NAT 的优势


    - NAT 有助于节省公共 IP 地址。

    - 它有助于维护良好的隐私性，因为接收和发送流量的设备 IP 地址将以隐藏形式存在。

    - 它有助于在网络演进时进行地址编号。


    ## NAT 的缺点


    - IP 地址的翻译可能会导致路径切换延迟。

    - 某些应用程序在启用 NAT 后将无法正常工作。

    - 它使像 IPsec 等各种隧道协议变得复杂。


    ## 交换


    ### VLAN 间链路协议 (VTP)


    VTP 或 VLAN 间链路协议用于维护整个网络的适当连续性和一致性。VTP 允许用户添加、删除或重命名 VLAN，这些更改会传播到 VTP 域内的其他交换机。然而，VTP
    在交换机之间通信 VLAN 信息时有某些要求。用户需要或想要配置的所有交换机上的 VTP 版本需要一致。此外，VTP 域名在所有交换机上需要相同。对于 VTP
    通信，需要其中一台交换机充当或作为服务器。


    ## VTP 模式


    三种不同的 VTP 模式：


    - 服务器 (Server)：所有交换机默认设置为此模式。此模式允许用户添加、删除或创建 VLAN。用户想要进行的任何更改都需要在此模式下进行。在此模式下进行的每一个更改将传播到属于相同
    VTP 域的所有交换机。


    - 客户端 (Client)：在这种 VTP 模式下，交换机接收所有更新，并能够将所有更新转发给其他交换机。


    - 透明模式 (Transparent)：这种 VTP 模式仅通过中继链路转发 VTP 告事的摘要。此模式的交换机可以创建自己的本地数据库，并与其他所有交换机保持机密。


    ## 生成树协议 (STP)


    STP 或生成树协议用于通过网络监控过程来跟踪所有链路，然后关闭那些冗余性较低的链路，从而创建一个无环网络。


    ## STP 及其类型


    - 802.1D：这种类型的 STP 也称为 CST 或通用生成树。这是由 IEEE 开发的一种 STP 标准，它为每个拓扑结构只选择一个根桥接。网络中的所有流量都沿同一条路径流过，但这并不总是好事，因为可能会出现这样的问题：即为到达
    VLAN 而优化的路径与选出根桥接后获得的路径完全不同。它在本质上也非常慢，因为收敛至少需要 32 秒的时间。


    优势：

    它需要的 CPU 和内存非常少。


    缺点：

    优化百分比较低，因为计算出的通往根桥接的完美路径可能不是到达网络的最优路径。它也不提供任何形式的负载均衡。


    - 802.1w 或 RSTP：RSTP 或快速生成树协议是 IEEE 开发的一种标准，旨在提供比 CST 更快的收敛速度。然而，它也持有在拓扑结构中寻找单个根桥接的理念。


    - RPVST：也称为每 VLAN 快速生成树，是 Cisco 开发的一种标准，旨在提供比 RSTP 更快的收敛速度，并为每个 VLAN 为 802.1w
    找到独立的实例。然而，与其它 STP 标准相比，它需要更多的内存和 CPU。


    ## 路由配置


    ### OSPF


    也称为开放最短路径优先 (Open Shortest First)，是一种链路状态路由协议，它通过使用自己的最短路径帮助在源目的路由器之间找到最佳路径。OSPF
    协议由 IETF 开发为 IGP 或内部网关协议，它是用于在大型自治系统或路由域内移动数据包的协议。它工作在网络层，并运行在协议号 89 上。


    #### OSPF 术语


    - 路由器 ID (Router ID)：它代表路由器上最活跃的 IP 地址。回环口（loopback）的高地址被视为优先，在没有配置任何回环的情况下，考虑接口内最高活跃的
    IP 地址。

    - 路由器优先级 (Router priority)：这是分配给运行 OSPF 的路由器的值。它本质上是 8 位，有助于在广播网络中选出 BDR 和 DR。

    - DR 或指定路由器 (Designated router)：为了减少形成的相邻关系总数而选出。

    - BDR 或备用指定路由器 (Backup designated router)：它作为 DR 的备用。每当 DR 宕机时，BDR 接替该角色并启动。


    ### BDR 和 DR 的选举


    BDR 和 DR 的选举发生在广播网络中。选举标准为：

    - 优先级最高的路由器被选为 DR。

    - 如果路由器优先级出现任何平局，则选举路由器 ID 最高的。


    ### EIGRP


    EIGRP 或增强型内部网关协议是一种动态路由协议，用于在两个设备之间寻找最佳路由。它工作在网络层并使用协议 88。


    #### EIGRP 特性


    EIGRP 具有以下特性运行：

    - 它以高级的运行效率方式工作。

    - 它作为无类路由协议工作。

    - 它兼具距离矢量和链路状态协议的能力。

    - 它具有一些独特的功能，如 RTP（可靠传输协议）、DUAL（扩散更新算法）以及关于邻居的所有形式的更新信息。

    - 它提供了更快的收敛速度，因为它预计算了所有路由，并且在收敛之前不广播数据包。


    它使用延迟、负载、带宽和可靠性来计算路由表的指标。


