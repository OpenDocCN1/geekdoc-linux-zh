    # 服务器


    服务器之间通过各自的操作系统set进行区分，例如 Windows 2003、Windows 2008 或 Windows 2000 Server。涉及到服务器，它们具有更快的处理速度、更大的硬盘空间和更多的内存。这主要是因为服务器存储了各种形式的数据，并同时为多个工作站提供服务。服务器可以在客户端/服务器网络中承担任何类型的角色。它可以同时担任邮件服务器、文件服务器、域控制器和数据库服务器。然而，对于一个配置良好的网络，总是将这些角色分配给所有可用服务器，以优化网络性能。但是，无论服务器执行何种角色，它都作为数据库、程序、网络文件和策略的中央存储库。


    服务器非常容易管理和进行备份，因为网络中的服务器并不依赖于单个用户的配置，并且可以在整个网络中无缝实施。


