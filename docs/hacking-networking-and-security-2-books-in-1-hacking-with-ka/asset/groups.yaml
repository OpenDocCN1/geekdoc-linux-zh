    # Chapter 14: Exploitation of Computer Systems


    With the increase in the use of computer systems day by day, the percentage of
    attacks by third parties on the systems is also increasing gradually. There were
    days when people used to store all their data and confidential information in
    the form of physical copies. But, today most of the people prefer their confidential
    information in the computer systems and that is what gave birth to the attacks
    on computer systems. Exploitation is nothing but a programmed script or software
    which allows hackers to gain control over the entire system and then exploit the
    same for the benefit of the hackers.


    The exploitation attacks try to take advantage of any form of weakness in an OS
    of the user, in the application or in any other form of software code that also
    includes plug-ins of the applications or of the libraries of software. The owners
    of such codes issue a patch or fix in response. The system users or the users
    of the applications are completely responsible behind obtaining the patch. It
    can be downloaded from the developer of software which is readily available on
    the web or it can also be downloaded by the OS automatically or by the application
    that needs the same. In case the user fails to install the required patch for
    a specific problem, it will expose the user to the exploitation of a computer
    system and might also lead to breaching of security.


    # Computer exploits and its types


    Computer exploits can be categorized into two different types:'
  - '[PAGE 252]


    +   - Remote exploits: Remote exploits are those exploits types where it is not
    possible to access a network or remote system. Such exploits are generally used
    for gaining access to the systems which are remote in nature.


    +   - Local exploits: Local exploits are used for those systems which having local
    system access. The attackers use this for over-passing the rights of the users
    of the local systems.


    The security exploits come in all forms of size and shape. However, there are
    certain techniques among the lot which are more often used than the others. The
    most common vulnerabilities which are web-based are XSS or cross-site scripting,
    SQL injection along with cross-site request forgery. It also includes abuse of
    authentication codes which are broken in nature or other misconfigurations of
    system security.


    # Zero-day exploit


    The exploits of computer systems can be differentiated in various ways that will
