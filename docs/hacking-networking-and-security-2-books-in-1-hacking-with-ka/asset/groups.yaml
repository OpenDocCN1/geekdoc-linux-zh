    # Google Hacking


    Also known as Google Dorking, is a technique which is used by hackers for information
    gathering by taking into consideration some of the prime searching techniques
    of Google. The search queries of Google hacking can be treated by the attackers
    for identifying the various vulnerabilities of security in the web applications,
    discovering messages of errors for disclosure of various confidential data and
    for discovering various files with credentials. The only way to prevent this is
    by checking out for regular website application vulnerabilities.'
  - '[PAGE 248]


    # XSS Attack


    XSS or cross-site scripting attack is a technique which is used by the attackers
    for injecting malicious form of scripts into mild and trustable websites. It occurs
    when a hacker takes help of a web application for sending out harmful codes in
    the form of side script in the browser to the end-user. The end-user will have
    no idea that the code is malicious in nature and will run the script without even
    knowing anything.'
  - '[PAGE 249]


    # SQL Attack


    It is a form of injection attack that allows the attackers to execute various
    harmful SQL statements. The SQL statements perform the function of controlling
    the servers of the database behind the web applications. The hackers can use this
    measure for bypassing the security measures of a web application. The attackers
    can also use this technique for adding, modifying and deleting various records
    from the database. SQL vulnerability can affect any application on the web or
    websites that use database of SQL like MySQL, SQL Server, Oracle and others. The
    cyber attackers use this technique for gathering sensitive data such as personal
    data, intellectual property, customer information, secrets of trade and many more.'
