    # DHCP 攻击


    DHCP 攻击或称 DHCP 饥饿攻击是一种攻击向量形式，攻击者通过发送大量的 DHCP 数据包请求并带有伪造的 MAC 地址来实施攻击。DHCP 攻击被认为是对计算机网络的攻击，其中由
    DHCP 分配给单个客户端的所有可用 IP 地址都可以被注册。这也可以被比作拒绝服务攻击（DoS）攻击，即攻击者用大量请求淹没系统数据库，从而阻塞任何新请求的接收。


    # 关于流氓 DHCP 服务器（Rogue DHCP server）的详情


    流氓 DHCP 服务器是一种位于网络上的 DHCP 服务器，它未获得网络管理员的授权且是不允许的。这种形式的 DHCP 服务器由网络攻击者创建，它们会耗尽所有可用的
    IP 地址，迫使受害者网络连接到相同网络中攻击者的恶意 DHCP 服务器。


    # DHCPig


    这是一种用于启动高级形式 DHCP 饥饿攻击的网络工具，它可以耗尽局域网（LAN）上所有可用的 IP 地址。结果是它将阻止新用户获取 IP 地址，阻止任何正在使用的
    IP 地址形式，然后发送 ARP 请求将所有主机窗口踢离线。这种 DHCP 服务器攻击功能是 Kali Linux 内置的。它不需要任何配置。攻击者只需要将接口作为网络的参数传递即可。


    ![](img/dfdb59329a06b0e4d53fac932c118967_220_0.png)


    ## 第 9 章：服务器与网络扫描


    网络和服务器扫描无非利用计算机网络来收集与计算机系统相关的信息。这种形式的扫描主要用于安全评估、系统维护以及黑客攻击系统。扫描的目的是：


    - 识别在目标主机上运行的所有可用 TCP 和 UDP 网络

    - 识别目标主机与用户之间的过滤系统

    - 在评估 IP 地址的响应后，确定正在使用的操作系统（OS）

    - 评估目标主机的 TCP 序列号，用于预测序列攻击和 TCP 伪造


    # 网络扫描


    谈到网络扫描，它包含了网络端口扫描以及漏洞扫描。端口扫描是一种通过网络发送数据包到具有特定数量服务端口的计算机系统的方法。这用于识别特定系统上所有可网络服务。这种方法对于排排除系统相关问题以及增强系统安全性非常有用。


    漏洞扫描用于检测存在于网络计算机系统中的漏洞。它有助于检测操作系统或软件中的特定弱点，这些弱点可能被用于导致系统崩溃或任何其他形式的意外攻击。端口扫描和漏洞扫描都是信息收集技术。但是，当此类操作由其他第三方执行时，它可能会演变成引入一种非预期攻击。


    网络扫描过程（如 ping 扫描和端口扫描）会返回关于存活主机 IP 地址地图及其提供服务的宝贵细节。另一种形式的网络扫描被称为反向映射（inverse mapping）。该过程收集所有无法映射到存活主机的
    IP 地址详细信息，反过来帮助攻击者关注各种有利的地址。


    网络扫描是攻击者用于收集有关网络或目标系统相关信息的方法之一。在足迹（footprint）阶段，黑客为目标系统或网络创建一个特定的配置方案。这包括关于组织的所有形式的相关信息，例如组织的
    DNS、IP 地址范围以及电子邮件服务器。在扫描阶段，攻击者试图查找可在线访问的特定 IP 地址的所有详细信息、系统架构、使用的操作系统以及组织计算机上运行的服务。在枚举（enumeration）阶段，攻击者试图收集所有相关数据，这包括路由表、网络组和用户名、SNMP（简单网络管理协议）数据等许多项。


    # 为什么需要服务器和网络扫描？


    在当今世界，所有系统都容易受到网络犯罪分子的攻击，服务器和网络扫描是非常必要的。随着存储从物理数据库转向在线版本，网络攻击的频率也日益增加。组织需要执行服务器和网络扫描以防止以下场景的发生：


    - 客户信任丢失

    - 在线收入收集或产生形式的完全中断

    - 网站崩溃、用于损害恢复的时间和支出

    - 保护 Web 应用免受进一步网络攻击的成本

    - 机密数据丢失，可能导致组织倒闭


    # 服务器扫描的性质


    服务器扫描可以通过多种方式进行。让我们来看一下：


    - 主动扫描（Active scanning）：这是通过直接向网络主机和设备发送探测包，然后监控其响应来识别网络服务的过程。这种形式的扫描被攻击者用于发现网络漏洞。此过程允许操作员直接发现网络内的各种可用服务，并尝试检查这些服务是否存在某些已知漏洞。发送到网络主机的探测包可以是。

    - 被动扫描（Passive scanning）：这种方法通过简单观察不断通过的客户端和服务器生成的流量来识别网络服务。为了建立监控，可以在节点插入特殊形式的硬件或软件。许多路由器可以复制端口，而不会给路由器增加额外负担。然而，它需要一些详细的干预来进行安装。使用被动扫描检测
    UDP 和 TCP 都非常简单直接。


    对于 TCP 的检测，监控主机只需要捕获连接的 TCP 设置消息。在三次握手完成后，它将清楚地指示服务是可用的。UDP 服务也可以通过流量观察进行识别。但由于
    UDP 是一种无连接的协议，如果没有应用协议信息，客户端和服务器背后的整体概念是不清晰的。


