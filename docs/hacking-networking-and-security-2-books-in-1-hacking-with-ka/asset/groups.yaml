    # Dynamic IP Address


    A dynamic IP address is the one which is assigned automatically to every node
    in the network like desktop PC, smartphone or tablet. This automatic assigning
    of the IP address is done by the DHCP server. An IP address which has been assigned
    by a DHCP server is known as dynamic as it will be changing in the future depending
    on the future connections with the network.


    # Where to find dynamic IP addresses?


    The public IP address which is assigned for the router for most of the business
    and home network users by the internet service providers or ISPs is dynamic in
    nature. Bigger organizations and companies try not to connect with the internet
    with the use of IP addresses which are dynamic in nature and prefer using static
    IP addresses which are assigned specifically for them.


    In any form of a local network like the one in your business place or home, where
    private IP addresses are used, most of the devices are preconfigured for DHCP.
    This means that all devices use a dynamic IP address. In case the devices do not
    have DHCP enabled, each of the devices is required to manually set up the network
    information.


    # Dynamic IP address and its advantages


    One of the prime advantages that come with assigning of IP addresses dynamically
    is that it is more flexible in nature. It is very easy to set up and the administration
    part is also easier when compared to static IP'
  - '[PAGE 75]


    addresses. For instance, when one of your devices connects with the network, it
    is assigned with one specific IP address. Once the device disconnects from the
    network, the same IP address becomes free and it can be used for another device
    that can connect afterwards, even if it is not the same device again.


    Dynamic IP addresses come with little limitation to the total number of devices
    which can connect with the network as the devices which do not require to stay
    connected can easily disconnect from the network and thus freeing up the available
    pool of IP addresses for the other devices. There is an alternative in which the
    DHCP server can pre-configure some specific IP addresses for each of the devices
    in a network in case all of the devices want to get connected with the network
    at the same time. In such case, hundreds of networked devices, whether they were
    being used by the users or not can have their own specific IP address which can
    easily limit network access for all the new devices in a network.


    The implementation process of dynamic IP addresses is easier when compared with
    the static IP addresses. There’s no need to set up anything manually for the new
    devices which want to connect with the network. All that you need to do is be
    sure that the DHCP has been enabled on the network router. As all the networked
    devices are by default configured to have a specific IP address for each from
    the huge pool of available IP addresses, each and every step turns out to be automatic
    in nature.


    # Dynamic IP address and its disadvantages'
  - '[PAGE 76]


    It is a very common thing which is acceptable technically as well for any form
    of a home network to use a dynamic IP address which has been assigned by the DHCP
    server for the router, problem comes up when the user tries to access the same
    home network from any other outside network.'
  - '[PAGE 77]


    # Static IP Address


    A static IP address is the one which has been manually configured for a place
    of the one which was assigned by DHCP server. The name static IP address means
    that the IP does not change and is static in nature. It can be regarded as the
    complete opposite of a dynamic IP address which changes. Phones, tablets, laptops,
    routers and other forms of network devices which use IP address can be easily
    configured for having a static form of IP address. This can be done by the device
    which gives out the IP addresses such as a router or also manually by typing the
    device IP address into the device only.


    Why does static IP address needs to be used?


    You can think of static IP addresses just like your physical home address or your
    email address. Such addresses do not change and they are static in nature. It
    helps in contacting with people or finding someone. Similarly, IP addresses of
    static nature are very beneficial when you are hosting a website from your home,
    having a file server in the network, forwarding network ports to some particular
    device, using networked printers, using any form of remote access program or running
    a printer server. As static IP addresses never change, all the other devices in
    a network will know how to connect with a device which uses IP address of static
    nature.


    For example, when IP address which is static in nature is set up for a PC within
    a home network, once the device gets a particular IP address for itself, the network
    router can be configured in a particular way for forwarding all the inbound requests
    to that device directly, like requests for FTP in case the device can share files
    over FTP.'
  - '[PAGE 78]


    If you are hosting a website and not using a static IP address for the same, it
    might turn out to be a hassle. This is mainly because when the computer gets some
    new IP addresses, you need to change the settings of the router every time for
    the purpose of forwarding the requests to the new IP addresses. When you neglect
    to do so, anyone can get inside your website as the router will be having no idea
    about which device within the network is serving solely for the website.


    Another great example of an IP address of static nature at work is the DNS server.
    The DNS servers always use static addresses for making sure that the devices in
    the network know exactly how to connect with the servers. If they were regularly
    changed, you would also have to reconfigure the DNS servers regularly on the router
    for the internet.


    The static form of IP addresses is also very useful when the domain name of the
    device is not accessible. Those computers that connect with the file server within
    a workplace network could also be set up for instance with the server by using
    the static IP address of the server in place of the name of the host. Even if
    there is malfunctioning of the DNS server, the computers in the network can still
    access and connect with the file server as they communicate with the server by
    using the IP address. With applications that support remote access like the Windows
    Remote Desktop, using an IP address of static nature means that the user can access
    the computer always by using the same address. When you use an IP address which
    changes frequently, you need to know what it has changed to so that the new address
    can be used by you for establishing the remote connection.'
