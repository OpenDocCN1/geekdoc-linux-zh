    ## What is kernel module?


    Just like human beings perform all their functions with the help of the CNS or
    central nervous system, the kernel can be regarded as the central nervous system
    of the operating system. It controls every functioning of the operating system
    and also includes the management of interaction in between the components of hardware
    and the starting of required services. Kernel functions in between the applications
    of the users that you can actually see and between the components of hardware
    that performs everything such as hard disk and memory along with CPU.


    Linux is an imposing type of kernel that allows the adding up of kernel modules.
    In general, the modules can be removed or added right from the kernel according
    to the user need. Occasionally, the kernel of an operating system might also require
    some updates which require the installation of some new form of device drivers
