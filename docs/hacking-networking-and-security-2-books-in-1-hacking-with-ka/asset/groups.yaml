    有线和无线网络根据网络物理层进行分类。然而，网络也可以根据网络的设计和构建、是否包含 SDN（软件定义网络）或覆盖网络来区分。它还可以根据规模、环境，如校园网、局域网
    LAN、广域网 WAN、存储区域网络、数据中心网络等进行分类。


    ## 网络系统的类型


    网络系统有两种类型：开放式和闭式。在开放式系统中，系统与网络连接并已准备好通信。然而，在闭式系统中，系统未与网络连接，无法与之连接。


    ## 网络组件


    计算机网络对物理网络基础设施有要求。它包含了路由器、交换机、访问点等各种组件，以及帮助运行其他组件的基础固件。至于其他组件，它还包含了用于监控、安全和管理网络的必要软件。所有形式在很大程度上依赖协议标准，以统一执行各种离散任务或与各种类型的数据进行通信。协议无非一组算法或规则，有助于定义两个不同实体跨网络相互通信的各种方式。


    网络中可以找到许多类型的协议，如 IP、ARP、DHCP、TCP、FTP 等。


    VoIP 或 IP 语音用于将 IP 电话流量传输到支持该协议的端点。TCP/IP 被称为互联网协议族，负责基于 IP 在网络上进行数据传输。


    IP 地址是逻辑地址，作为网络中系统的网络地址。它有助于为网络中的所有设备创建唯一标识。IP 地址为 32 位。IANA（互联网分配数字分配机构）为网络中的每个系统或设备分配唯一的
    IPV4 地址。


    MAC 地址被视为网络中每个主机的物理地址。它与网卡（网络接口卡）相关联。MAC 地址为 48 位或 6 字节或 12 个半字节（nibble）。每个 MAC
    地址在制造系统或设备时被分配给系统的 NIC。


    ![](img/dfdb59329a06b0e4d53fac932c198967_13_0.png)


    ## 第 2 章：互联网通信


    当今世界与几年前已完全不同了。它每天都在发生变化。随着数字技术的发展，变化的速度也变得非常快。曾几何时一条简单的信息需要几个月才能送达，而现在只需要几秒钟。互联网通信已经演变得如此强大，现在可以无缝地连接世界每个角落的人。


    ## 互联网通信


    互联网通信是一件非常简单的事。它是通过互联网或万维网共享思想、信息或仅仅是文字。互联网由一组巨大的全球互联网络组成，通过使用 TCP/IP 的分组交换技术帮助交换信息和数据。


    互联网通信带来了许多优势，可以在很多方面我们提供帮助。


    ## 互联网通信及其优势


    互联网上的通信系统的优点多于劣势。对于商务人士来说，他/她可以坐在舒适的家里，喝着茶或咖啡，同时与客户进行电话会议。这有助于节省大量的时间、资金并促进业务增长。


    - **多功能性**：互联网通信本质上是多功能的。它是 24*7 全天提供的。只要你连接到网络，互联网通信就会一直运行。互联网通信也可以被视为企业的福音，特别是在紧急事件期间，例如在社交媒体广告领域，即使是一秒钟的负面宣传也可能导致灾难。在这种情况下，互联网通信有助于弥补一切。


    - **平权化**：事实是，每个人无法同时出现在所有人面前。此外，我们周围还有许多人不喜欢太多说话。这样的人总是喜欢通过写作来表达他们的感受。有些人觉得在键盘后说话时很自在。在这种情况下，互联网通信有助于这类这些人建立通信线索。


    - **文档完备**：面对面交流没有多少记录，而互联网通信有良好的记录。它在各种情况下都有帮助，特别是当人们需要对自己说的话负责时。因此，互联网有助于建立一个非常有责任感的环境。


    - **快速通信**：互联网通信非常快。它以极快的速度传输消息，使得在紧急情况下发送消息成为可能。


    ## 互联网通信工具


    互联网通信为人类世界提供了广泛的通信工具。让我们来看看这些工具。


    ## 电子邮件


    电子邮件被认为是互联网通信的基础工具之一。今天，几乎所有形式的服务都需要电子邮件地址，而且人们认为每个在互联网上活跃的人都至少有一个电子邮件地址。可以从 Google
    和 Microsoft 等各种免费服务获取电子邮件地址。电子邮件最广泛地用于发送官方或机密信息。然而，在当今这个世界中，它也被用于各种有害活动，例如使用网络钓鱼邮件传播恶意软件或诈骗。在网络钓鱼案例中，第三方欺骗受害者共享其敏感数据，如银行或信用卡详情、账户号码等。因此，在从未识别的源获取任何形式的电子邮件时，最好总是谨慎一点。客户端的计算机


    ## 社交媒体


    作为今天的工具之一，它被用于无延迟无缝连接世界各地的人。但今天社交媒体的案例日益增加。


    ## 万维网 (World Wide Web)


    万维网是互联网通信最主导的形式。它被用于一切，从在线购物到查看天气。用户需要 Web 浏览器来访问网页。每个网站都是用 HTML 构建的，HTML 是网页语言；CSS
    定义屏幕上的每个元素；JavaScript 则用于处理数据并提供编程逻辑。其他每种形式的互联网通信（如 VoIP 或语音互联网协议）也依赖于网络。使用 VoIP
    系统被认为比传统的手机便宜得多且更快。它还允许无延迟的国际通话。


    ![](img/dfdb59329a06b0e4d53fac932c198967_18_0.png)


    ## 第 3 章：客户端/服务器方法


    客户端/服务器方法是计算机网络架构，其中各种客户端或远程处理器请求服务并从主机或服务器接收服务。客户端的计算机带有一个接口，允许计算机用户从服务器请求各种服务，然后显示服务器返回的结果。网络中的所有服务器等待客户端请求的到达，然后对每个请求做出响应。通常，网络服务器为客户端提供一个透明的标准接口，以便所有客户端都了解提供服务的软件和硬件系统规范。


    客户端通常位于 PC 或工作站上，而服务器位于网络中，即比客户端更强大的系统上。当服务器和客户端都需要定期执行某些特定任务时，客户端/服务器方法是最有效的。例如，在医院的数据处理中，作为客户端的计算机运行程序输入所有患者信息，而服务器系统帮助管理患者数据库，其中永久存储了所有形式的信息。网络上的所有客户端都可以访问服务器提供的信息，客户端系统也可以执行发送电子邮件等各种工作。


