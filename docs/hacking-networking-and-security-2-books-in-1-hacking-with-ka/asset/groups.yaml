  mdcn: '


    - * 验证或验收测试：它为那些聘用各种承包商实施 WLAN 的组织提供了一种保险，以确保整个系统在信号覆盖、容量、性能以及安全性方面都符合要求。这是一个形式化的过程，同时也考虑了各种安装实践、系统文档编制以及各种维护程序。


    - * 模拟测试：这有助于在 WLAN 部署之前，对其相关的 WLAN 行为提供适当的可视化和表示。它对网络设计在与流量活动、软件和硬件关系方面的有效性提供了深度见解。它还考虑了性能中任何形式的潜在问题。


    - * 原型测试：其设计专门用于在 WLAN 部署之前，在实验室环境中对 WLAN 产品或系统中本质上不熟悉的部分进行专门评估。


    - * 试点测试：这涉及到在整个组织实施系统之前，在某些特定设施中以真实版本部署 WLAN。这种测试可以提供各种测试结果，从而对性能的潜在问题和实际使用提供详细的洞察。


    ## 信号覆盖测试


    该方法使用信号覆盖测试仪（也称为信号功率计）来准确测量整个覆盖区域内的 WLAN 信号。此类测试的主要目的是确保信号水平达到用户在使用 WLAN 上的各种
    Web 应用时所需的高性能标准。


    - * 站点覆盖无线调查：信号覆盖测试通常涉及对无线站点的调查。它通常在 WLAN 安装之前进行。它是通过在不同位置妥当放置测试点进行的。这些位置遍布整个
    WLAN 覆盖区域。它使用信号计来测量测试接入点区域内的信号值。此类调查的结果有助于决定接入点最终安装的位置。


    ## 性能测试


    这种形式的 WLAN 测试从关联测试开始。该测试确保客户端设备类型与已安装系统中的单个或多个接入点正确关联，这些接入点是已安装系统的一部分。这被视为一项确保客户端设备是否能够建立无线连接的初级测试。在进行其他测试之前，您需要确认有足够的关联。这项测试至关重要，因为有时客户端设备可能与
    WLAN 接入点不兼容。


    ## 网络连接测试


    为了使客户端设备与 Web 之间进行良好的通信，无线网络系统使用 UDP 或 TCP。在两种情况下，都要确保客户端设备已成功连接到 WLAN，并且拥有有效的
    IP 地址。这通常通过观察接入点中可以轻松找到关联表来实现。这是一个非常好的测试模式，可以确保客户端设备能够响应来自与应用程序所在相同子网的生成的 ping。ping
    的结果需要表明客户端设备对生成的 ping 出了正确的反应，且延迟足够而没有超时。如果网络连接测试显示问题，请确保客户端设备具有有效的 IP 地址，并且客户端设备的固件已配合接入点升级。


    ## 应用程序连接测试


    必须确保每个类型的客户端设备都以正确的方式与应用程序连接。通过 IP 电话的无线实现可以确保手机以正确的方式向呼叫管理器软件注册，并接收相应的电话号码。如果手机未能正确注册，请尝试检查设备是否实际上具有方便的
    IP 地址、主网关、子网掩码以及 DNS 设置。您需要记住，手机可能会连接到任何接入点而无法获得正确的 IP 地址。设备 IP 地址需要与设备建立网络连接的特定位置地址计划相对应。


    ![](img/dfdb59329a06b0e4d53fac932c198967_232_0.png)


    ## 第11章：无线网络安全测试


    无线通信是一种无形的通信形式，它本质上是不可见的，而且无处不在。它允许数据通过各种无线连接设备和基础设施在家庭和业务组织之间无缝流动。大多数现代业务组织已在其组织内部设置了某种形式的无线网络，主要是
    Wi-Fi。然而，此类服务的正确实施未能获得其实际上所需的关注。网络各个不同部分（如 VLAN 路由、网络分段和 SSID 控制）需要以清晰的形式进行定义和设置。这将使用户能够轻松连接到网络并使用相关服务，同时将入侵者和第三方隔在网络之外。


    无论对无线网络设置的考虑是多是少，组织都被要求在网络安全防护墙内寻找任何形式的弱点，以避免对网络资源的任何形式的不道德和未经授权的访问并防止数据泄露。


    ## 无线网络渗透测试


    无线网络的渗透测试（pentesting）无非是扫描网络以寻找安全墙内任何形式的缺陷。当组织未能对无线网络采取适当的渗透测试时，会导致数据盗窃以及对资源的未经访问。适当的安全措施有助于防止数据泄露。


    ## 渗透测试时需要采取的步骤


    需要采取的步骤完全取决于用于测试所遵循的标准。通常来说，渗透测试过程从收集信息开始。它是创建一个地图。它将跟踪足迹以及广播信号的大小。各种其他形式的信息，如广播的
    SSID 总数、网络配置、安装的硬件等也需要收集。您也可以通过创建正确的站点地图开始。


    第二步是找出公司可能脆弱的威胁形式。这基于安装在站点的硬件、网络可见性以及信号可以被检测到的距离。诸如是否存在可以通过网络访问的开放文件共享等许多其他问题是渗透人员需要开始的基础问题。


    漏洞测试分析是使用渗透人员使用的专业工具进行的，这会充分告知测试人员组织易受攻击的利用形式。一旦识别出任何形式的脆弱性，就需要立即进行利用，然后使用其达到破坏安全的程度。渗透人员可以通过此步骤向客户展示脆弱性范围。通过适当的渗透测试，还可以识别攻击无线网络使用的是什么类型的工具。


    一旦威胁证明有效，渗透人员将继续扫描整个网络，然后确定威胁能够利用用户权限并导致数据泄露的程度。在完成所有工作后，将向客户提交报告，列出威胁细节和系统内部的安全漏洞。客户应该根据报告修改安全措施。渗透人员将使用相同形式的利用再次测试网络，以检查修改后的安全形式是否能够防御攻击。


    '
