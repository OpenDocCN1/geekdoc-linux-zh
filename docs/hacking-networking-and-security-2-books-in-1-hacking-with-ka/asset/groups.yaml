    ## DHCP Server


    A DHCP server is nothing but a server of the network which provides and assigns
    IP addresses automatically along with default gateway and other parameters for
    the clients. It is dependent on the standard protocol which is called Dynamic
    Host Configuration Protocol for responding to the queries. Without the presence
    of a DHCP server, the administrators of network need to set up each and every
    client. This might turn out to be a cumbersome process, especially when large
    networks are involved. The DHCP servers assign each of the clients with one IP
    address of dynamic nature.


    ## Benefits of DHCP server


    A better option than using DHCP on switch or router is to have a centralized server
    of DHCP. This is true in case of network environments which requires support from
    both protocols. DHCP6 comes with various benefits:


    - When you have DHCP6 server which is also integrated into the system of IPAM
    for IPv6, it will provide you with the visibility of all the client nodes.

    - The DHCP servers also provide management and logging of interfaces which aids
    in managing the scopes of IP addresses by the administrators.

    - DHCP servers also provide high availability along with redundancy. In case one
    of the DHCP servers fails to perform, the clients in the network will be preserving
    their present IP addresses and will not lead to any form interruption for the
    nodes.


    ## Why should you use a router as DHCP server?


    Most of the switches and routers have the capability of providing the following
    server support for DHCP:


    - DHCP client and obtaining an IPv4 address interface from an upstream service
    of DHCP.

    - One relay of DHCP along with forward UDP DHCP messages from the clients directly
    on a local area network to and from a server of DHCP.

    - Running DHCP server on switches and routers consumes all the resources which
    are available on the device network. Such packets of DHCP are handled by software.

    - Does not need the support of dynamic DNS. The switch or router DHCP server will
    not be able to create an entry into the DNS on part of the client which is based
    on IPv4 address which was leased for the client.


    The organizations which have started the implementation of IPv6 need to migrate
    to the DHCP for IPv4. This change in DHCP will also point out that the organization
    also wants to have DHCP for operating both the protocols.

