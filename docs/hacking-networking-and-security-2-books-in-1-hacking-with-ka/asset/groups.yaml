    \ This form of transmission, the device on the receiver’s sides sends out an acknowledgement\
    \ intended for the source right after a data packet or group of packet has been\
    \ received by the destination. This form of transmission is very secure and reliable\
    \ as well.\n\n- 2. Connection less service: This process is one phase in nature\
    \ and it includes transfer of data. In this form of transmission, the receipt\
    \ of a packet is not all acknowledged by the receiver. This form of transmission\
    \ approach allows a faster mode of communication in between the devices. However,\
    \ the connection oriented service is much more reliable than the connection less\
    \ service.\n- Session layer: The session layer serves the function of connection\
    \ establishment, session maintenance, authentication and also security of the\
    \ session. The functions of this layer are:\n    - 1. Establishment of session,\
    \ maintenance of session and termination: This layer helps in the establishment\
    \ of the two processes, uses and also terminates the connection.\n    - 2. Synchronization:\
    \ The session layer helps in adding up checkpoints which are regarded as the points\
    \ of synchronization by a process into the data. The points of synchronization\
    \ help in identification of the errors in order to ensure that the data has been\
    \ re-synchronized in the proper way. It also ensures that the message ends are\
    \ not prematurely cut for avoiding loss of data.\n- 3. Dialog controller: This\
    \ layer allows the two systems to begin the communication with one another in\
    \ full-duplex or half-duplex.\n- Presentation layer: The presentation layer is\
    \ also known as the translation layer. The data which is received from the application\
    \ layer is extracted in this layer and is also manipulated as per the requirements\
    \ of the format for transmitting the same over the network. The functions of this\
    \ layer are:\n    - 1. Translation: It helps in the process of translation such\
    \ as from ASCII to EBCDIC.\n    - 2. Encryption and decryption: The encryption\
    \ of data translates the whole data into some form or code. The data which is\
    \ encrypted is known as the cipher text. The data which is decrypted is known\
    \ as the plain text. For the purpose of data encryption and data decryption, a\
    \ key value is used by this layer.\n    - 3. Compression: This layer helps in\
    \ reducing the total number of bits which is to be transmitted into the network.\n\
    - Application layer: At the top of the stack of layers of the OSI model exists\
    \ the application layer. It is a layer which is implemented by the applications\
    \ in a network. The applications of the network produce the data which is to be\
    \ transferred across the netork. The application layer serves as a window for\
    \ the services of applications for accessing the network and also for the purpose\
    \ of displaying the information which is received to the user. Some examples of\
    \ network applications are web browsers, messengers etc. The functions of this\
    \ layer are:\n    - 1. Mail services\n    - 2. Network virtual terminal\n    -\
    \ 3. FTAM or file transfer access and management\n    - 4. Directory services\n\
    \nThe OSI model as the reference model and is not at all implemented for the internet\
    \ as it is considered as being outdated. TCP/IP model is used in place of the\
    \ OSI reference model.\n\n## VLAN\n\nVLAN or virtual LAN is a group composed of\
    \ devices on one or more than LANs which are configured for communicating in a\
    \ way as if all of them are attached with the same wire whereas they are located\
    \ at several different segments of a LAN. VLANs are extremely flexible in nature\
    \ as it is based on a logical connection in place of a physical connection. VLANs\
    \ help in defining the domains of broadcasting in a network of Layer 2 nature.\
