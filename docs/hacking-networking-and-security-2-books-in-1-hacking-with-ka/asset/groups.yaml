  mdcn: "\n所有数据存储的地方都属于操作安全的范畴。\n\n- 终端用户教育：这涉及到网络安全中最大的不确定性因素之一，即“人”。任何人员都可能因为无法遵守要求的安全实践措施，从而在不知无意中向极其安全的系统中引入恶意病毒。对于组织的安全，教会系统的所有用户删除电子邮件中附带的所有类型可疑附件、不插入任何种未识别的硬盘或\
    \ USB 闪存以及其他各种课程，对组织安全至关重要。\n\n## 为什么网络安全如此重要？\n\n当今世界对技术的依赖超过了以往的任何时候。这就是为什么数字数据的产生出现了大幅增长。如今，大多数业务机构以及政府将大部分机密和重要数据存储在计算机设备上。为了在组织的不同部门或政府的各个部门之间传输这些数据，他们使用了网络。当受到外部源的攻击时，这些设备及其基础系统很容易被访问。这反过来又损害了组织的整体健康和目标。\n\
    \n数据泄露可能会给组织带来灾难性的后果，特别是在所有组织都使用网络进行数据传输的时候，包括政府、企业、医疗、金融和军事组织。当机密数据从政府网络泄露时，也可能变成对国家安全的威胁。此类数据的大部分可能在性质上是极敏感的，无论是财务数据、知识产权数据、个人信息或其他任何形式的数据。网络安全有助于描述保护数据以及用于处理和存储数据的数据系统所需的纪律形式。\n\
    \n仅仅因为没有正确遵守数据保护法规，数据泄露还可能对企业收入产生巨大影响。根据最近的一些研究，平均每次数据泄露会导致一个组织损失约 380 万美元。随着网络攻击的规模和复杂性日益增长，组织以及负责与国家健康、安全和财务记录相关的信息保护任务的机构，需要采取必要措施来保护各种形式的人员以及业务数据。根据\
    \ 2016 年的一项近期调查，警告说数字间谍活动和网络攻击是对国家安全最危险的威胁，甚至超过了恐怖主义。因此，要求组织实施并采用强有网络安全的方法。\n\n\
    ## 与网络安全相关的各种类型威胁\n\n- 勒索软件：一种危险的恶意软件，旨在通过阻塞文件访问或网络系统，直到支付赎金为止，以此达到勒索目的。然而，有许多案例在支付赎金后，对文件或系统的访问仍然被锁定。\n\
    \n- 恶意软件：恶意软件无非恶意软件。它包括勒索软件、间谍软件、蠕虫和病毒等多种类型的软件。恶意软件的功能非常简单，用户甚至无法检测到网络中任何形式的入侵。它是通过利用网络漏洞实现的，当用户点击任何危险的电子邮件附件或链接时，该链接会迅速在系统中安装风险软件。一旦恶意软件被安装到系统中，它可以做它想做的任何事，例如：\n\
    \  1. 阻塞对网络关键组件的访问\n  2. 安装其他有害软件\n  3. 在不通知用户的情况下从存储驱动器中获取信息\n  4. 破坏系统的各种组件，并导致系统崩溃。\n\
    \n- 钓鱼：一种网络攻击手段，通过发送欺骗性的通信，使其看起来像是来自任何信誉良好的来源的真实通信。最常见通过电子邮件进行。这种攻击的首要目标是窃取机密个人数据，如信用卡详情、登录信息等更多内容。这种形式的网络威胁正在日益增加。\n\
    \n- 中间攻击（MitM）：也称为中间人攻击或窃听攻击。它发生在攻击者将自己置于两个方通信之间的时候。一旦攻击者成功中断通信，他们就可以：\n  1. 当攻击者成功拦截流量时，他们可以轻易置于用户和网络之间。\n\
    \  2. 当攻击者入侵用户设备时，他们可以在不让用户知道的情况下通过公共 Wi-Fi 获取相关信息。\n"
