    它也被称为 Wi-Fi 安全访问（Wi-Fi protected access）。它在 WEP 被弃用的一年前被采用。现代使用的大多数 WPA 应用都使用
    PSK 或预共享密钥，这通常被称为 WPA 个人版（WPA personal），并使用 TKIP（临时密钥完整性协议）进行加密。它使用服务器进行身份验证、证书生成以及密钥生成。


    与 WEP 一样，WPA 也被发现容易受到外部入侵。对该协议危害最大的攻击并非本质上的直接攻击，而是建立在 WPS（Wi-Fi 保护设置）上的攻击，WPS
    是为了简化现代接入点设备之间的连接而开发的。


    ## WPA2


    WPA 经过改进后演变为 WPA2。它也被称为 Wi-Fi 安全访问版本 2。该协议获得的主要升级是使用了 AES（高级加密标准）。AES 已通过美国政府批准用于加密数据和信息。


    WPA2 系统主要的漏洞形式是攻击者完全获取了受保护的 Wi-Fi 网络的访问权限，并且可以访问执行对网络中设备攻击所需的某些密钥。在 WPA2 系统中，安全威胁主要存在于企业级，与家庭网络完全无关。


    然而，与 WPA 一样，WPA2 系统仍然存在通过 WPS 进行攻击。


    ## 选择哪种安全方法？


    当所有安全方法按优到劣进行排序时，顺序如下：


    - WPA2+AES

    - WPA+TKIP/AES

    - WPA+AES

    - WPA+TKIP

    - WEP


    最好的方法是禁用 WPS，并将无线路由器设置为 WPA2+AES。WPA2 和 WPA 都用于保护网络免受任何形式的未经授权访问。如果你让系统处于没有任何安全的状态，任何第三方都可以轻松窃取网络带宽，利用网络执行各种非法活动，监控你的网络活动，并轻松地在系统上安装恶意软件。


    WPA2 被认为所有方法中最好的。WPA2 唯一的缺点是确定该协议保护网络所需的处理能力。这意味着需要超强大的硬件来避免网络性能降低。你应该始终选择 WPA2，或者在没有其他选择的情况下选择
    WPA。当 WPA2 系统中负载过重时，WPA 可以帮助处理沉重负载，但它也可能影响网络速度。


    涉及到加密，将取决于你使用的协议类型。WPA2 具有最快的加密速度，而 WEP 的加密速度最慢。


    ## 保护 Wi-Fi 网络


    虽然 WPA2 提供了比 WPA 和 WEP 更先进的保护，但路由器的安全性完全取决于用户设置密码。WPA2 和 WPA 允许的最大密码长度为 63 个字符。尝试尽可能增加你的
    Wi-Fi 密码。黑客总是寻找容易的目标。如果他们无法在几分钟内破解密码，就会转向下一个目标。


    ## WPA3


    WPA3 或 Wi-Fi 安全访问版本 3 是 Wi-Fi 的下一代安全协议。它有助于完全保护 Wi-Fi 网络，并让用户免受安全缺陷的影响。WPA3 通过实施新的密钥交换协议保护
    Wi-Fi 密码免受字典攻击。WPA3 还支持在攻击者获取网络访问之前通过系统的任何形式的流量保持加密（前向安全性），这是 WPA2 无法做到的。WPA3
    还为公共网络提供扩展安全，使用户免于他们无法意识到的任何形式的漏洞。


