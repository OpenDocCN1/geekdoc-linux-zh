    ## 第12 章：TCP/IP 的背景与历史


    TCP/IP 是一套使得网络中各种计算机之间能够通信的协议集合。协议无非可说就是帮助用于管理通信的标准或规则。当网络中的两个设备想要彼此通信时，它们都必须使用相同的协议。这也可以类比为人类之间的交流。说法语的人无法与说中文的人交流，因为他们说的语言不同。你可以从庞大的网络协议池中选择一种协议在网络中使用。但每当涉及到
    TCP/IP 时，它被视为行业标准。所有的操作系统都支持 TCP/IP。整个互联网都运行在 TCP/IP 之上。它也被称为互联网语言。如果你想让计算机与互联网通信，你就必须使用
    TCP/IP。


    ## TCP/IP 的历史


    在今天的互联网出现之前，存在 ARPANet（阿帕网）。它是由 ARPA（高级研究计划署）创建的，启动于 1969 年冷战期间。ARPANet 的创建是为了应对苏联日益增长的核攻击威胁。ARPA
    的主要目标是创建一个具有容错能力的网络，以便让美国军事领导人在发生核战争时能够保持联系。用于 ARPANet 的协议被称为 NCP（网络控制协议）。随着 ARPANet
    规模的扩大，还需要另一种协议，因为 NCP 无法满足大型网络日益增长的需求。1974 年，发表了一篇描述 TCP（传输控制协议）特征的论文。NCP 最终被
    TCP 取代。在对这种新语言进行进一步开发和测试后，它催生了一个全新的协议集，被称为 TCP/IP（传输控制协议/网际协议）。直到 1982 年，TCP/IP
    才正式取代 NCP 成为 ARPANet 的标准语言。


    ## TCP/IP 的特性能


    TCP/IP 在行业中已经存在了 35 多年。这是一套经过验证的协议集合，使得设备能够连接到互联网。它具有各种特性，让通信变得更加容易。


    - **对多厂商的支持**：TCP/IP 正由多个软件和硬件供应商实现。它现在已成为行业标准，完全不受限于特定的供应商。


    - **互操作性**：今天，人们之所以能够在异构性的网络中工作，仅仅是因为 TCP/IP。当你使用运行 Windows 系统的系统的电脑时，你仍然可以从运行
    Linux 的机器上下载所需的文件。只有当两个系统都支持 TCP/IP 时，这才是可能的。它有助于消除跨平台的边界。


    - **逻辑寻址**：网络中的每一个适配器都有一个在本质上是永久的物理地址。这种永久地址被称为 MAC 地址，也称为硬件地址。该地址在制造时被刻录在硬件卡上。在局域网（LAN）中，底层且对硬件敏感的协议使用适配器的物理地址来传输数据包。每台计算机中的本地适配器都会跟踪局域网上的每一次传输，以确定消息是否发送到了其特定的物理地址。


    对于小型局域网，这整套机制运行得非常好。但，当一台计算机连接到像互联网这样庞大的网络时，它每秒需要监听数十亿传输。这可能会导致网络连接失败。为了避免此类情况，网络管理员使用路由器等设备将大网络分成多个较小的网络，以减少网络流量。这确保了来自任何网络的非预期流量不会在其他网络中产生任何问题。管理员可以再次将网络划分为子网，以便消息直接从发送者传输到接收者。TCP/IP
    具有很强的子网划分能力，这种能力通过逻辑寻址实现。


    [/content]


    [content]


    ## 第13 章：FTP


    FTP，全称为文件传输协议，是一种用于在线发送文件的技术。它作为应用层协议，有助于在本地文件系统和远程文件系统之间移动文件。为了共享文件，使用了两个 TCP
    连接。FTP 属于仍在使用的最古协议之一。它是非常方便的文件移动方式。


    ### FTP 有什么用途


    FTP 用于将信息从你工作的系统移动到托管网站的服务器。例如，如果你想在服务器上安装 WordPress，你就需要 FTP 来拷贝文件。它也被用作共享文件的工具。你可以将文档或文件上传到
    FTP 服务器，然后将文件链接分享给想要的人。然而，由于人们更倾向于使用云文件传输服务，这种服务今天已不再常见。许多人倾向于在家庭服务器上上传文件，他们需要启用
    FTP 来实现此类服务。


    FTP 使用两种非常基本的通道：命令通道（携带有关任务的所有相关信息）和数据通道（在设备之间传输文件）。


    - **命令通道**：用于共享所有控制信息，如用户识别、密码、更改目录、检索和存储文件等命令。命令通道在 21 端口启动。

    - **数据通道**：为了实际发送数据文件，FTP 使用数据通道。它在 20 端口启动。


