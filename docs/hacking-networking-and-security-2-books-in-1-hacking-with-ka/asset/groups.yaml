  - '[PAGE 104]


    various higher class protocols such as UDP, TCP, FTP and HTTP. All such protocols
    integrate with the internet protocol for the purpose of providing many more added
    capabilities. There are some lower-level internet protocols as well such ICMP
    and ARP which coexists within the family. The higher-level protocols which belong
    to the family of IP have much closer interaction with the applications such as
    web browsers. The lower-level protocols interact with the adapters of a network
    along with some other hardware of the computer.


    # Wireless Network Protocols


    The wireless networking system now has turned out to be commonplace which is mainly
    because of Bluetooth, Wi-Fi and LTE. There are wireless network protocols that
    check the functioning of wireless networks. The network protocols which have been
    designed for the purpose of wireless networking needs to support roaming in mobile
    devices and also deal with various issues like network security and variable rates
    of data.


    # Network Routing Protocols


    The network routing protocols are the specially designed protocols which have
    been designed to be used specifically for the network routers. A network routing
    protocol is capable of identifying several other routers on the network, manage
    the destination of the messages of a network, manage the message pathways which
    are called routes and also makes dynamic decisions on routing. Some of the most
    common protocols of routing include OSFP, EIGRP and BGP.'
  - '[PAGE 105]


    # TCP or Transmission Control Protocol


    The TCP or Transmission Control Protocol is regarded as the core protocol of the
    IP suite. It originates in the implementation of a network in which has complemented
    the IP. So, the entire suite is also known as TCP/IP. TCP helps by providing a
    reliable system of delivery of octets streams over the network of IP. The main
    characteristics of TCP include checking of errors and ordering. All the major
    forms of internet-based applications like email and the World Wide Web with file
    transfer relies on TCP.


    # How are networking protocols implemented?


    Most of the modern operating system of today comes with in-built software services
    which help in implementing support for some of the network protocols. Various
    applications such as web browsers come with software library which supports high-level
    protocols when needed by the application for functioning. For some of the lower
    level protocols of routing and TCP/IP, the support is being implemented directly
    within the hardware for improving the overall performance.


    Each of the data packets which are transmitted and received by the destination
    over the network consists of binary data, zeros and ones which helps in encoding
    the message contents. Most of the protocols of networking add up small header
    at the starting of every data packet for the purpose of storing information about
    the sender of the message along with the intended destination. Some of the protocols
    also add ip footer at the very end of data packets. Each of the network protocols
    comes with the capability of identifying all the messages of its own form and
    then process'
  - '[PAGE 106]


    the header along with footer as parts of the moving data across the devices.


    A large group of protocols related to networking which functions together at both
    the higher and lower levels is known as protocol family. Some of the most common
    protocols which are used are HTTP with default port 80, FTP with default port
    20/21, SSH with default port 22, Telnet with default port 23 and DNS with default
    port 53.'
  - '[PAGE 107]


    # Layers of the OSI Model and Its Functions


    The OSI model or the Open System Interconnection model is an architecture of 7
    layers in which every layer performs some specific function. All the layers work
    in close collaboration for the purpose of transmitting data from one system to
    the other all around the globe.


    +   * Physical Layer: The layer at the bottom of the OSI model is the physical
    layer. It performs the duty of establishing an actual physical connection between
    the concerned devices in a network. All the information in the physical layer
    is stored in the form of bits. At the time of receiving the data, the physical
    layer receives the signal and then converts the same into 1s and 0s. It is then
    sent to the layer of data link which puts back the frame together. Functions of
    the physical layer are:

    * 1. Bit synchronization: This layer helps in bit synchronization by providing
    a clock. The clock provided by the physical layer is responsible for controlling
    both the sender and the receiver and thus provides synchronization at the level
    of bit.

    * 2. Bit rate control: This layer is also responsible for defining the rate of
    transmission which is the total number of bits sent out every second.

    * 3. Physical topology: This layer determines the way in which all the nodes and
    devices are going to be arranged in the network which are star, bus and mesh topology.'
  - '[PAGE 108]


    4. Transmission mode: This layer determines how the data is going to flow in between
    the connected devices. The possible modes of transmission are: simplex, full-duplex
    and half-duplex.


    +   - Data Link Layer: This layer is the second layer right above the physical
    layer. It is responsible for message delivery from node to node. The primary function
    of the data link layer is to make sure that the transfer of data is free from
    errors while travelling from one node to the other, right over the 1st layer i.e.
    the physical layer. After a packet has arrived in a network, it is the duty of
    this layer to transmit the same to the host by using its MAC address. The data
    link layer is being divided into two layers: Logical Link Control and Media Access
    Control.


    The packet which is received from the network layer is then divided into frames
    which depend on the size of the Network Interface Card or NIC. This layer also
    encapsulates the MAC address of the sender and the receiver in the data header.
    The functions of the data link layer are:


    +   1. Framing: The main function of the data link layer is framing. It provides
    the sender with a way for transmitting a set of bits which are meaningful for
    the receiver. This is achieved by the attachment of special patterns of bits right
    at the beginning of the frame and at the end.


    +   2. Physical addressing: After this layer is done with the job of framing,
    it adds physical addresses also known as MAC'
  - '[PAGE 109]


    addresses for the sender or of the receiver in the frame header of each.


    +   3. Error control: This layer comes with the mechanism of controlling errors
    in which errors are detected and the lost or damaged frames are retransmitted.


    +   4. Flow control: The rate of data needs to be constant on both the sides otherwise
    the data might result in getting corrupted. So, with the help of flow control,
    the data amount is coordinated which can be sent before receiving the acknowledgement.


    +   5. Access control: When a single channel of communication is shared by various
    devices, the sub-layer of MAC in the data link layer helps in determining which
    device has the control of the channel at some given time.


    +   Network Layer: This layer functions for transmitting data from one host to
    another which is located in some other network. The network layer also looks after
    packet routing which means it helps in selecting the path which is the shortest
    of all for the purpose of transmitting the packet, from the total number of routes
    which are available. The network layer also places the IP addresses of the sender
    and the receiver in the header. The functions of the network layer are:


    +   1. Routing: The protocol of the network layer determines that route will be
    the best for the packet from the source to the destination. This function performed
    by the network layer is called routing.'
  - '[PAGE 110]


    2. Logical addressing: For the purpose of identifying each of the devices on the
    internetwork in a unique way, the network layer helps by defining a scheme of
    addressing. The IP address of the sender and the receiver are placed in the header
    which helps in distinguishing each and every device in a unique and universal
    way.


    +   - Transport layer: The transport layer helps by providing all the required
    service to the application layer and also takes up services from the network layer.
    Segments are those data which are present in the transport layer. It helps in
    end to end message delivery. This layer is also responsible for providing the
    acknowledgement after successful transmission of data and also re-transmits any
    data if any form of error is found.


    At the sender side: The transport layer receives the data which has been formatted
    from the layers above it and performs segmentation. After segmentation is done,
    it also implements error and flow control for ensuring that the data is transmitted
    properly. It adds up port number of the sender and the receiver in the header
    and then forwards the data which has been segmented to the network layer. The
    sender of the data needs to have the port number which is associated with the
    application of the receiver. The destination port number is generally manually
    configured or is configured by default. For example, when any web application
    sends any request to the web server, it uses the port number 80 because it is
    the port number which has been assigned for the web applications by default. Many
    of the applications come with default assigned port number.'
