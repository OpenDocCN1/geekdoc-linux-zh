    ## Advantages of NAT


    - NAT helps in conserving public IP addresses.

    - It helps in maintaining proper privacy as the IP address of the device which
    will be receiving and sending traffic will be in hidden form.

    - It helps in the renumbering of address when any network evolves.


    ## Disadvantages of NAT


    - The translation of IP addresses might result in delay in path switching.

    - There are various applications which will not be functioning when NAT is enabled.

    - It complicates various protocols of tunneling like IPsec.


    ## Switching


    ### VLAN Trunking Protocol


    VTP or VLAN trunking protocol is used for maintaining proper continuity and consistency
    throughout a network. VTP allows the users to add up, remove or rename VLANs which
    is propagated to some other switches within the domain of VTP. However, there
    are certain requirements for the VTP to communicate about VLAN information between
    the switches. The version of VTP needs to be on similar on all the switches which
    the user needs to or wants to configure. Also, the domain name of VTP needs to
    be same on all the switches. For VTP communication, one of the switches needs
    to act like the server or be the server.


    ## Modes of VTP


    There are three different modes of VTP:


    - Server: All the switches are set for this mode by default. This mode allows
    the users to add, delete or create VLANs. Any kind of change that the user wants
    to make needs to be done in this mode. Each and every change which is made in
    this mode will be propagated to every switch which belongs to the same domain
    of VTP.


    - Client: In this mode of VTP, the switches receive all the updates and are also
    capable of forwarding all those updates to the other switches.


    - Transparent: This mode of VTP forwards only the summary of VTP advertisements
    via the trunk line. The switches of this mode can create their own database of
    local nature which can keep secrets from all the other switches.


    ## Spanning Tree Protocol


    STP or spanning tree protocol is being used for creating a loop-free network by
    the process of network monitoring for tracking all of the links and then shutting
    down those which are less redundant of nature.


    ## STP and its types


    - 802.1D: This type of STP is also called CST or common spanning tree. This is
    a standard of STP which has been developed by the IEEE which selects one single
    root bridge only for every topology. All of the traffic in the network flows in
    the same path but this might not be good always as there might be issues in which
    the path has been optimized for reaching the VLAN is completely different from
    the path which has been obtained after electing root bridge. It is also very slow
    in nature as it takes minimum 32 seconds of time for converging.


    Advantages:

    It requires very less CPU and memory.


    Disadvantages:

    It comes with a lesser percentage of optimization as the path which is calculated
    as the perfect to root bridge might turn out to be not the best path for reaching
    the network. It also offers no form of load balancing.


    - 802.1w or RSTP: RSTP or rapid spanning tree protocol is the standard which has
    been developed by the IEEE for providing a faster rate of convergences that CST.
    However, it also holds a similar idea of finding a single root bridge within the
    topology.


    - RPVST: Also known as rapid per VLAN spanning tree, is a standard which has been
    developed by Cisco for providing faster rates of convergence than RSTP and also
    finds separate instances for 802.1w for every VLAN. However, it needs more memory
    along with CPU when compared with the other standards of STP.


    ## Routing Configuration


    ### OSPF


    Also known as Open Shortest First protocol, is a form of link-state routing protocol
    which helps in finding the best path between the destination and the source router
    by using up its own shortest path. OSPF protocol has been developed by IETF as
    an IGP or interior gateway protocol which is the protocol for moving the packets
    within a very large system of autonomous nature or domain of routing. It acts
    in the network layer and works on the protocol number 89.


    #### Terms of OSPF


