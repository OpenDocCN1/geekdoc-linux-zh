    # Chapter 16: Cryptography and Network Security


    With a rapid increase in the rate of cyber attacks, it is of utter importance
    to protect all forms of confidential data as much as possible. Data leakage can
    lead to serious loss for various businesses and can also turn out to be a threat
    for an individual person where the credit card, as well as bank details, are breached.
    The term cryptography is linked with the technique used for converting plain and
    ordinary text into unintelligible form. With this method, transmission and storage
    of sensitive data become a lot easier. Only to those whom the message is intended
    can process the text and read it. It is not only helpful in protecting data from
    breaching or theft but it is also useful for data authentication.


    In the world of computer science, cryptography is associated with securing all
    forms of information along with the techniques of communication which are derived
    from the concepts of mathematics. It uses a definite set of ruled calculations
    which are known as algorithms. The algorithms are used for transforming the messages
    in such a way that it becomes very hard to decipher the same. Such algorithms
    of deterministic character are used in the generation of cryptographic keys along
    with digital signing for protecting the privacy of data, browsing various websites
    on the internet and for sensitive communications like email and credit card or
    bank transaction details.


    # Techniques of cryptography


    The technique of cryptography is often linked with the characteristics of cryptanalysis
    and cryptology. The technique of cryptography includes the'
