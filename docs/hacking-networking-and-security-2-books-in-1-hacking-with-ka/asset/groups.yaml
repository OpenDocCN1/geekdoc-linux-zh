    # 第 6 章：C.I.A. 及其网络安全的关系


    C.I.A. 也称为中央情报局，是美国联邦政府的与外交事务有关的情报机构。它负责与数据收集、分析和处理相关的各项任务。C.I.A. 负责国家安全，并发挥保护国家安全的功能。它以利用人类情报（HUMINT）从世界各地收集信息而闻名。C.I.A.
    是美国情报社区（US IC）中最重要的成员之一，向国家情报总监汇报。


    与负责国内安全服务的 FBI（联邦调查局）不同，C.I.A. 并不具备任何形式的与执法执法相关的职能，其目标是收集海外情报。C.I.A. 充当人类情报的中央授权单位。


    # C.I.A. 的功能


    C.I.A. 的首要功能是为国家安全目的收集和采集数据。根据 C.I.A. 的基本原则，它有五个基本功能：


    - 以反恐为首要任务

    - 关于大规模杀伤性武器的非扩散

    - 向国家告知重大事件

    - 反间谍

    - 安全与情报


