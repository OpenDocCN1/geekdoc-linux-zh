    确保所有用户都检查了应用程序的配置文件。


    # 正确处理所有权限


    在权限方面，它是 Linux 的至关重要的部分。对于用户来说，清楚地理解每种权限的功能以及操作系统各种组件产生的影响是非常重要的。如果你正从 Windows
    迁移到 Linux，通用的概念可能会让你觉得有些不同且不习惯。Kali Linux 的通用规则是，你不应该在日常工作中使用 root 账户。对于所有 Windows
    用户来说，这可能有些意外，因为操作系统以不同的方式处理这些本质上至关重要的各种权限。这确实是一个不方便的功能，因为每你想让机器执行某个功能时，都需要输入密码。然而，它是非常实用的，因为它无疑能帮助防止你的机器未来出现某些严重的安全问题。


    # Kali Linux 确实有病毒


    Linux 拥有无病毒的广泛声誉。这对所有初学者来说都是件令人惊讶的事。然而，实际上情况完全不同。与 Windows 或 Mac 相比，Linux 作为操作系统并不流行。因此，它受黑客针对较少，针对
    Linux 开发的病毒也不多。但是，Kali Linux 确实存在恶意软件。Linux 的恶意软件比 Windows 的对应软件更具破坏性。对于那些不注意应用程序权限以及
    Linux 安全各种其他核心概念的 Kali Linux 用户来说，这可能更加危险。


    # 安全工具是可用的


    当你开始使用 Kali Linux 时，你会发现以前使用的安全工具在 Linux 上不可用。这是大多数杀毒软件解决方案的常见场景。杀毒软件的开发者无法为同一个应用程序以及两个不同的底层系统维护两个完全不同的版本。尽管有许多例外，但在这些例外中，你会发现某些应用程序在
    Linux 上的运行方式不同。在使用 Kali Linux 时，你可以轻松地访问各种通用用途的安全工具。Kali Linux 是一种以安全为主要目标的 Linux
    发行版。你还可以通过 Kali Linux 以流化的方式管理你的 VPN 连接。Kali Linux 带有各种用于网络工作的内置工具，这些工具本质上是复杂的。


    # 开源并不总是安全的


    Kali Linux 是一款开源软件，这使其成为所有道德黑客和 IT 人员的最爱。许多人认为开源是安全的终极钥匙。Kali Linux 也是如此。然而，现实中并非如此。你可能会认为作为一个暴露在全世界面前的开源软件，任何问题都会立即得到处理。事实完全并非如此。Kali
    Linux 系统已经记录过多次安全破口和后门案例。在许多案例中，安全漏洞是刻意放在系统中的。因此，可以得出结论：开源并不是安全的终极标志。拥有闭源系统并在出现任何问题时由专家进行审查有其优势。你永远不应该因为
    Windows 是闭源的就低估其安全工具的作用。


    Kali Linux 确实是所有道德黑客和练习渗透测试的人来说的一个极佳的操作系统。Kali Linux 显然比其他发行版更安全。然而，只有在长期运行后才能体现出它的完整效能。如果对应用程序设置及其权限没有足够的了解，你可能会在毫无察觉的情况下让整个系统暴露在某些严重的风险中。从新手开始，使用一个配置不当的
    Kali Linux 发行版可能会导致整体性的灾难。因此，请确保检查每个设置，如果你需要，可以根据你的需求进行自定义。


