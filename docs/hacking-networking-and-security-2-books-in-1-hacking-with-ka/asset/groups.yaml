    # Chapter 12: Background and History of TCP/IP


    TCP/IP is a protocol set which enables the communication between various computers
    in a network. Protocols are nothing but the standards or rules which help in governing
    communications. When two devices in a network want to communicate with each other,
    both need to use the same protocol. This can also be compared to the communication
    of human beings. A person who speaks French will not be able to communicate with
    a person who speaks Chinese as both them speak different languages. You have the
    option of selecting from a large pool of network protocols for using in the network.
    But when it comes to TCP/IP, it is regarded as the industry standard. All forms
    of operating systems support TCP/IP. The whole internet works on TCP/IP. It is
    also called the language of the internet. In case you want a computer to communicate
    with the internet, you are required to use TCP/IP.


    # History of TCP/IP


    Just before the internet of today, there was ARPANet. It was created by ARPA or
    Advanced Research Projects Agency. It was launched at the time of the Cold War
    in 1969. ARPANet was created as a response to the rising threat of nuclear attack
    from the Soviet Union. ARPA''s main goal was to create a network which would be
    fault-tolerant and would enable the leaders of the U.S. military to stay in touch
    in case of a nuclear war. The protocol which was used for ARPANet was known as
    the NCP or Network Control Protocol. As ARPANet grew in size, another protocol
    was also required as NCP was unable to meeting the growing needs of a large-sized
    network.'
