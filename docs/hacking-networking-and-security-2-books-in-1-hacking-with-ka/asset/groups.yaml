  - '[PAGE 118]


    It is possible to configure multiple VLANs on one single port with the use of
    trunk configuration in which each of the frames sent through the port is being
    tagged with the VLAN ID. The interface of the neighboring device which might be
    on some other switch or host which supports 802.IQ tagging will require to support
    the configuration of trunk mode for transmitting and receiving the frames which
    have been tagged. Any of the Ethernet frames which are untagged are assigned to
    a VLAN of default nature which can also be designated in the configuration of
    a switch.


    When a switch which is VLAN-enabled receives an Ethernet frame of untagged nature
    from an attached host, it adds the VLAN tag which is assigned to the interface.
    The frame is then sent forward to the host port along with the MAC address of
    the destination. Broadcast multicast and unknown unicast is then forwarded to
    all the ports in the VLAN. When any previously unrecognized or unknown host replies
    to an unknown frame of unicast, the switches get to know about the host location
    and do not flood the host with the subsequent frames which were addressed for
    that host.


    The STP or Spanning Tree Protocol is being used for creating a topology of loop-free
    nature among all the switches in every Layer 2 domain. As per the regulations
    of VLAN, an instance of STP can be used in turn enables the various topologies
    of Layer 2 or a MIST or multi-instance STP can be used for reducing the overhead
    of STP in case the topology is also the same among the multiple VLANs. STP blocks
    away the forwarding on the links which might produce some forwarding loops and
    thus creating a spanning tree from the selected switch of root. The concept of
    blocking means that some of the links will not at all be used for the purpose
    of forwarding unless and until there is a failure in some other part of the network
    which causes the STP to turn the link a part of any active nature.'
