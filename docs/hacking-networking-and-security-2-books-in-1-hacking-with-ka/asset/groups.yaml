  - '[PAGE 83]


    # DHCP Server


    A DHCP server is nothing but a server of the network which provides and assigns
    the IP addresses automatically along with default gateway and various other parameters
    of a network for the devices of the clients. It is dependent on the standard protocol
    which is called DHCP or Dynamic Host Configuration Protocol for responding to
    the queries of the clients regarding broadcasting. The DHCP servers send out necessary
    parameters of the network automatically for the clients for establishing proper
    communication with the network. Without the presence of a DHCP server, the administrators
    of a network need to set up manually each and every client who joins with the
    network. This might turn out to be a cumbersome process, especially when large
    networks are involved. The DHCP servers assign each of the clients with one unique
    IP address of dynamic nature.


    # Benefits of DHCP server


    A better option than using DHCP on the switch or router is to have a centralized
    server of DHCP. This is true in case of network environments which requires support
    from both DHCP for IPv4 and DHCO for IPv6, both at the same time. DHCPv6 comes
    with various benefits.


    +   - When you have DHCPv6 server which is also integrated into the system of
    IPAM for IPv6, it will provide you with the visibility of all the client nodes
    of IPv6.'
  - "[PAGE 84]\n\n+   - The DHCP servers also provide management and logging of interfaces\
    \ which aids in managing the scopes of the IP addresses by the administrators.\n\
    \n+   - DHCP servers also provide high availability along with redundancy. In\
    \ case one of the DHCP servers fails to perform, the clients in the network will\
    \ be preserving their present IP addresses and will not lead to any form interruption\
    \ for the nodes at the end. \n\n# Why should you use a router as DHCP server?\n\
    \nMost of the switches and routers have the capability of providing the following\
    \ server support for DHCP:\n\n+   - DHCP client and obtaining an IPv4 address\
    \ interface from an upstream service of DHCP.\n\n+   - One relay of DHCP along\
    \ with forward UDP DHCP messages from the clients directly on a local area network\
    \ to and from a server of DHCP.\n\n+   - Running DHCP server on switches and routers\
    \ consumes all the resources which are available on the device network. Such packets\
    \ of DHCP are handled by software.\n\n+   - Does not need the support of dynamic\
    \ DNS. The switch or router DHCP server will not be able to create an entry into\
    \ the DNS on part of the client which is based on IPv4 address which was leased\
    \ for the client."
