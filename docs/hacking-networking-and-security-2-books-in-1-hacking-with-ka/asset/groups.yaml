    ## FTP 会话


    当服务器和客户端之间启动 FTP 会话时，客户端会与服务器端启动一个受控的 TCP 连接。客户端使用该连接来发送控制信息。在服务器接收到这些控制信息后，它会启动一个指向客户端的数据连接。需要注意的是，通过单个数据连接只能发送一个文件。然而，控制连接在用户的整个会话期间一直保持激活状态。HTTP
    本质上是无状态的，这意味着它不需要对用户状态进行详细的跟踪。但在 FTP 的情况下，要求在整个会话期间内维护用户状态。


    ## FTP 中的数据结构


    在 FTP 中，允许三种类型的结构化数据：


    - **文件结构**：在这种结构中，没有形式的内部结构。这种结构中的文件被视为数据字节的连续序列。

    - **记录结构**：在这种结构中，数据文件由顺序的记录组成。

    - **页结构**：在这种结构中，数据文件由独立特性的索引页组成。


    ## FTP 本身是安全的吗？


    不，FTP 在其设计上完全是不安全的。FTP 源于网络安全仅仅是一个假设性研究领域的时代。简单来说，使用 FTP 进行的传输不是加密格式的。因此，任何能够嗅探数据包的人都可以轻松地拦截文件。这就是为什么人们转向
    FTPS 而不是 FTP 的原因。FTPS 的工作方式与 FTP 完全相同，但它通过加密每个数据文件来提供帮助，使得窥视者即使拦截了文件也无法读取内容。


    ![](img/dfdb59329a06b0e4d53fac932c198967_96_0.png)


    ## 第 14 章：远程登录


    远程登录，也称为远程访问，是一种用于从远程位置或距离系统物理位置很远的地方访问计算机系统（如办公网络计算机或家庭计算机）的技术。这种技术允许办公室员工在办公外（例如在家里或其他任何地方）继续进行工作，同时仍访问远处的网络或计算机，例如办公网络。远程登录或访问可以使用局域网（LAN）、广域网（WAN），甚至通过
    VPN 或私有网络来轻松设置，以便从远程距离访问所有的系统和资源。


    远程登录可以通过运行在用户计算机与组织或公司局域网之间的线路来创建。也可以通过专用线路在公司局域网和远程局域网之间建立连接。这种形式的线路提供了极快的速度，但缺点是非常贵。另一种建立远程登录连接的方法是通过
    VPN。VPN 是一种使用互联网将远程站点以及用户连接在一起的网络。这种形式的网络使用加密和隧道技术来实现访问公司网络。对于那些规模较小的组织来说，这可能是最佳选择。


    建立远程登录还有其他手段，包括使用无线网络、宽带服务、电缆调制解调器、数字网络或数字用户线路。为了建立远程登录连接，远程计算机或服务器以及本地机器都需要安装远程访问软件。今天可以找到许多服务提供商，他们通过互联网提供远程访问服务。


