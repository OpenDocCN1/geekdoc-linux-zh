    # DoS & DDoS


    DoS 或拒绝服务（denial of service）是一种网络攻击形式，攻击者利用它停止某些在线服务的正常运行。最常见的实现方法是一次性向网站发送海量流量，或一次性向数据库发送大量请求，导致数据库失去处理大量流量的能力并随后停止运行。DDoS
    或分布式拒绝服务（distributed denial of service）是另一种网络攻击形式，它利用在网络犯罪分子指导下的一许多带有恶意软件的计算机，向特定目标发送所有流量。


    # 网络攻击地图


    网络攻击地图（Cyber attack map）本质上是一个可以轻松显示哪些国家正在出现何种攻击的来源。它还提供了网络攻击主要目标的信息，并对当前互联网格局的威胁提供了全局视角。这对大型组织来说非常有用，但也有一个缺点：它显示了极其详细的内容，但呈现的数据不是实时的，全面性也不够。然而，它们可以作为关于安全、网络攻击以及公司可以采用的安全工具等任何对话的开头。


    # MAC 欺骗


    人们使用的每个设备都配有一个 NIC 或网络接口控制器。NIC 是负责允许用户直接连接到网络（如互联网）的设备。每个具有连接网络能力的设备（如笔记本电脑、PC、路由器、智能手机等）都配有
    NIC。每个 NIC 都带有一个特殊的 MAC 地址，该地址是硬编码的且无法更改。然而，尽管 MAC 地址无法更改，但 Windows 或 Linux 等一些主流操作系统允许用户在没有任何任何困难的情况下更改
    MAC 地址。


    根据技术界的说法，虽然用户无法更改 NIC 内置的 MAC 地址，但这并不意味着用户无法让其他设备认为他们的 MAC 地址是完全不同的。离开你设备的每条数据都处于你的控制之下。数据包头带有设备地址、IP
    地址以及 MAC 地址。因此，可以指示 NIC 完全丢弃内置的 MAC 地址，转而使用由用户自定义的内容。它可以是用户以任何方式设置的任何内容。这种对 MAC
    地址的更改被称为 MAC 欺骗（MAC spoofing）。


    # 黑客使用 MAC 欺骗的各种方式有哪些？


    MAC 欺骗为所有黑客开启了广泛的选择，因为他们可以轻松地隐藏在自定义的 MAC 地址之后，而没有被发现或被追踪的风险。MAC 欺骗为黑客提供了多种攻击向量，例如：


    - 它让攻击者更容易进行 MITM 或中间人攻击。

