  mdcn: "\n控制。为此，不需要对资源进行预留或预设。\n\n分组交换的整个过程在数据包交换时使用了存储和转发技术。在数据包转发的过程中，每个数据包首先被存储，然后才转发。这整个技术非常重要，因为数据包可能会由于任何原因在任何跳节点被丢弃。源和目的之间可能存在多条单一路径。每个数据包都带有源地址和目的地址，因此数据包可以在网络中独立地传输。简单来说，同一个文件的数据包可能沿沿相同的路径传输。如果任何路径发生任何形式的拥塞，数据包可以在现有网络上选择某些不同的路径。\n\
    \n为了克服电路交换网络的各种弱点，开发了分组交换网络。这主要是因为电路交换网络对于较较小的消息并不十分有效。\n\n## 分组交换的优点\n\n与电路交换相比，分组交换具有多种优势。\n\
    \n- 在网络带宽方面，它的效率更高。因为在分组交换中没有电路预留的概念。\n- 传输延迟非常低。\n- 可靠性更高，因为目的端能够追溯丢失的数据包。\n\
    - 容错性更强，因为如果路径发生任何拥塞，数据包可以选择任何其他路径。\n- 它非常具有成本效益，实施时成本也更廉。。\n\n## 分组交换的缺点\n\n\
    - 数据包不是按顺序交付的，而在电路交换中，数据包通过相同的电路传输，是有序交付的。\n- 由于数据包是无序传输的，每个数据包都需要提供一个序列号，这是耗时的。\n\
    - 节点处的复杂性增加了，因为数据包可以遵循多路径。\n- 由于数据包的重路由，传输存在延迟。\n- 它完全不适用于重负载，最适合小消息。\n\n## 分组交换及其模式\n\
    \n- **面向连接：** 在传输开始之前，它有助于使用信令协议建立虚拟连接或逻辑路径。在发送者和接收者之间建立路径，所有属于该流的数据包将遵循这条建立好的路径。路由器或交换机会给出虚拟电路\
    \ ID 以唯一标识虚拟连接。所有可用数据被分成若干较小的单元，并在单元上加上序列号。在此过程中，三个阶段共同工作：建立阶段、数据传输阶段和释放阶段。有关地址的信息仅在建立阶段传输。在确定目的路由后，每个中间节点的交换表中都会添加相应的条目。在数据传输期间，本地头部或数据包头部可能包含其他时间戳、长度、序列号等其他信息。它在交换式广网中非常有用。\n\
    - **无连接分组交换：** 在无连接分组交换中，每个数据包都包含所有相关且重要的信息，如目的地址、源地址、端口号等，而面向连接的分组交换并非如此。在这种分组交换形式中，所有数据包都以独立的形式处理。属于同一个流的所有数据包可能采取不同的路径，因为路由决策本质上是完全动态的。因此，到达的数据包可能没有正确的顺序。\n\
    \n## 分组交换中的延迟类型\n\n ** **传输延迟：** 将数据包放入链路中所需的时间。它完全取决于数据包长度以及网络带宽。\n- **传播延迟：**\
    \ 位特从起点到达目的地所需的时间。它取决于传播速度和距离。\n- **队列延迟：** 一个任务在队列中等待执行的时间。它取决于网络拥塞。它是目的端接收数据包的时间与数据包执行时间的时间差。\n\
    - **处理延迟：** 路由器处理数据包头部所需的时间。数据包处理有助于检测数据包传输到目的过程中发生的位级故障。\n\n![](img/dfdb59329a06b0e4d53fac932c198967_68_0.png)\n\
    \n## 第11章：网络设备之间的连接\n\n为了连接到网络，计算机系统需要某些组件来实现无缝接接。如果没有包括 IP 地址、子网掩码、DHCP 等在内的此类组件，系统将无法连接到网络。每个系统都有一套独特的组件，有助于建立新连接。\n\
    \n## IP 地址\n\nIP 地址或互联网协议地址是连接到网络中的网络硬件的标识码。当你的系统拥有 IP 地址时，它就可以基于 IP 地址与互联网等跨网络上的所有其他设备进行通信。大多数\
    \ IP 地址看起来像 123.121.52.141。\n\n## IP 地址有什么用处？\n\nIP 地址有助于为互联网等网络化结构中的设备提供唯一身份。它在性质上与你的家庭或办公地址相似，这些地址有助于将物资运送到带有可识别地址的特定位置。网络上的所有设备都可以通过\
    \ IP 地址彼此区分来。当你想要给住在国外的朋友发送礼物或包裹时，你需要知道你朋友的确切位置。跨互联网发送数据也使用相同的过程。然而，计算机系统并不使用物理形式的邮寄地址，而是使用\
    \ DNS 服务器查找主机对应的 IP 地址。\n\n例如，当你想通过输入相应网站的 URL（如 www.google.com）来浏览网站时，你加载页面的请求将直接发送到\
    \ DNS 服务器，由它们查找主名的 IP 地址。如果没有正确的 IP 地址，你的计算机将不知道你在做什么。\n\n## IP 地址及其版本\n\nIP 地址有两个不同的版本：IPv4（互联网协议版本4）或\
    \ IPv6（互联网协议版本6）。IPv4 是 IP 地址的旧版本，而 IPv6 是最新且升级的版本。\n\n- **IPv4：** IPv4 地址的构建方式使其能够提供约\
    \ 40 亿 IP 地址，这些地址在性质上都是唯一的。尽管它拥有海量的地址，但对于今天在网页或互联网上使用各种设备的现代世界来说，仍然不够。\n- **IPv6：**\
    \ IPv6 可以支持 340 万亿地址，看起来就像是 340 后面跟着 12 个 0。这意味着地球上的每一个人都能与互联网连接数十亿设备。\n\nIPv4\
    \ 被 IPv6 取代的原因之一是，后者与前者相比提供了更多的 IP 地址。当各种设备都连接在相似的网络上时，网络上的每个设备都拥有其唯一的地址是非常重要的。IPv6\
    \ 相比 IPv4 还具有许多许多额外优势：\n\n- 不存在由私有地址导致的 IP 地址冲突。\n- 它具有自动配置功能。\n- 不需要 NAT 或网络地址转换。\n"
