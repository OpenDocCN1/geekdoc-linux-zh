    usage of various techniques like merging of words with various images, microdots
    and several other techniques which are used for hiding that information is in
    transit or in storage. However, in the world of computer today, the technique
    of cryptography is often linked with the process of scrambling ordinary text or
    cleartext. Such form of ordinary text is known as plaintext. The plaintext is
    converted into ciphertext with the process of encryption and then back to the
    original form with the help of decryption. The people who specialize in the field
    of cryptography are called cryptographers.


    # Objectives of cryptography


    The modern-day objectives of cryptography are as follows:


    +   - Confidentiality: Confidentiality is the act of keeping all forms of personal
    and sensitive data protected for the concerned people. The information which is
    being transmitted or stored cannot be analyzed or understood by any third party
    for whom it was not at all intended.

    - Integrity: The data or information which is being transmitted or stored cannot
    be changed or altered by the sender and the receiver who is intended to receive
    the data. In any case form of alteration is made, the sender and receiver will
    both be notified.

    - Non-repudiation: The sender, as well as the creator of the data or information,
    will not be allowed to deny his/her intentions at a later stage during the creation
    or transportation of the data or information.'
  - '[PAGE 265]


    +   Authentication: Both the parties in communication who are the sender and the
    receiver will have the capability of confirming the identity of each other along
    with the origin and final destination of the data.


    The protocols and the procedures that meet all of the mentioned objectives and
    criteria are called cryptosystems. The cryptystems are often taken as only referring
    to the procedure of mathematics and programs of computer only. However, in actual,
    they also comprise of human behavior regulation like logging off from systems
    which are not used, choosing strong and difficult to guess passwords while logging
    in and not discussing any form of sensitive data and procedure with the outside
    world.


    # Algorithms of cryptography


    The cryptosystems work along with a bunch of procedures called ciphers or cryptographic
    algorithms. It is being used for the purpose of encryption as well as for decrypting
    the messages for securing up the communications among smartphones, applications
    and other computer systems. A suite of cipher uses up one single algorithm for
    the purpose of encryption, one more algorithm for authentication of messages and
    another algorithm for exchange of keys. This whole process is embedded within
    the protocols and is written within the programming of software which runs on
    the OS along with the computer systems which are based on the network. It also
    involves generation of public as well as private key for the process of encryption
    as well as decryption of data, verification for the purpose of message authentication,
    digital signing along with the exchange of keys.


    # Cryptography and its types'
  - '[PAGE 266]


    +   * Encryption using single key or symmetric key: The algorithms of this form
    of cryptography create block cipher which are actually particular length of bits.
    The block cipher comes along with one secret key that the sender uses for encrypting
    the information. The same key can be used by the receiver for deciphering the
    information. AES or Advanced Encryption Standard is a type of symmetric key encryption
    which was launched by the NIST as Federal Information Processing Standard or FIPS
    197 in the year 2001. It is being used for the protection of confidential and
    sensitive data. In the year 2003, the U.S. government approved of AES for the
    purpose of classified information. AES is a form of specification which is free
    from royalty and is used in all forms of hardware and software in the whole world.
    AES succeeded DES and DES3. AES uses up longer lengths of keys for preventing
    attacks.


    +   * Encryption using public key or asymmetric key: The algorithms for this form
    of cryptography uses two keys at a time in pair. One public key which is associated
    along with the sender and the receiver for the purpose of encrypting the information.
    Another private key is used for the purpose of decryption of the message. The
    private key is only known to the originator. There are various forms of cryptography
    using public key like RSA which is used all over the internet, ECDSA which is
    being used by Bitcoin and DSA which has been adopted as FIPS for all forms of
    digital signatures by the NIST.'
