    Hacking of websites can be regarded as the result of adoption of technologies
    which are web-based for carrying out e-business. The applications on the web allow
    the organizations to seamlessly connect with the customers and with the suppliers.
    However, the vulnerability of such applications on the web has also opened up
    new doors for the attackers. The hackers opt for the vulnerable websites for various
    reasons such as data breaching, stealing of confidential information and many
    more.


    ## Web hacking for stealing sensitive data


    When someone conducts online business, the website is bound to function with a
    wide collection of applications such as submission forms, shopping carts, dynamic
    content, login pages and many others. The web applications are constructed in
    such a way that allows the customers to submit and also retrieve various forms
    of dynamic content that includes different levels of sensitive as well as personal
    data. Such sensitive data is stored in the databases of the websites. As such
    websites need to be accessible 24*7 from any location in the world, the web applications
    which are insecure in nature opens up the doors for the web attacks on the corporate
    databases. In case the attacker gains access to the credit card and bank details
    of the customers, the business might turn out to be in great danger.


    ## Web hacking for implementing phishing sites


    It might happen that the database of a business is not online or is secured already.
    However, in spite of such facts, it does not make the web site less susceptible
    to the attacks. Hackers trace weak and small sites for the purpose of injecting
    malware into the sites. They also look out for vulnerable applications for tricking
    the users and then redirecting them to the phishing sites. Phishing sites are
    used for retrieving the bank details of the users. Such attacks are mainly targeted
    against the services of online payment can turn out to be the result of either
    SQL injection or any other type of hacking that can also be performed when the
    database and the servers contain no susceptibilities.


    ## Securing websites from hackers


    There are various ways in which the websites can be protected from the hacking
    attacks. You can start by installing plug-ins of security on your website. The
    website security plug-ins helps in improving the security of a website and also
    prevents any form of attempt of hacking. There are various forms of security plug-ins
    which are meant for websites of different formats such as Sucuri for WordPress,
    Amasty for Magento and RSFirewall for Joomla. Make sure that the website that
    you are constructing comes with HTTPS as SSL certificate is essential for protecting
    the details of the users such as personal data and credit card information.


    ## Google Hacking


    Also known as Google Dorking, is a technique which is used by hackers for information
    gathering by taking into consideration some of the prime searching techniques
    of Google. The search queries of Google hacking can be treated by the attackers
    for identifying the various vulnerabilities of security in the web applications,
    discovering messages of errors for disclosure of various confidential data and
    for discovering various files with credentials. The only way to prevent this is
    by checking out for regular website application vulnerabilities.


    ## XSS Attack


    XSS or cross-site scripting attack is a technique which is used by the attackers
    for injecting malicious form of scripts into mild and trustable websites. It occurs
    when a hacker takes help of a web application for sending out harmful codes in
    the form of side script in the browser to the end-user. The end-user will have
    no idea that the code is malicious in nature and will run the script without even
    knowing anything.


    ## SQL Attack


    It is a form of injection attack that allows the attackers to execute various
    harmful SQL statements. The SQL statements perform the function of controlling
    the servers of the database behind the web applications. The hackers can use this
    measure for bypassing the security measures of a web application. The attackers
    can also use this technique for adding, modifying and deleting various records
    from the database. SQL vulnerability can affect any application on the web or
    websites that use database of SQL like MySQL, SQL Server, Oracle and others. The
    cyber attackers use this technique for gathering sensitive data such as personal
    data, intellectual property, customer information, secrets of trade and many more.


    ## Chapter 14: Exploitation of Computer Systems


    With the increase in the use of computer systems day by day, the percentage of
    attacks by third parties on the systems is also increasing gradually. There were
    days when people used to store all their data and confidential information in
    the form of physical copies. But, today most of the people prefer their confidential
    information in the computer systems and that is what gave birth to the attacks
    on computer systems. Exploitation is nothing but a programmed script or software
    which allows hackers to gain control over the entire system and then exploit the
