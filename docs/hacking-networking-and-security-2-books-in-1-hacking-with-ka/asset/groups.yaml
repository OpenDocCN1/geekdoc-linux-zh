    - Static NAT: In this form of configuration, one private IP address is mapped
    with one public IP address one-to-one mapping between the local and the global
    address. This form of configuration is generally used for the purpose of web hosting.
    This form of configuration is not used in the organizations as there be various
    devices which will need access to the internet at the same time.


    - Dynamic NAT: In this form of NAT configuration, one private IP address is being
    translated into one public IP address from a huge pool of IP addresses of public
    nature. In case any IP address from a pool is not free, the the packet will be
    dropped off as only a specific number of IP addresses can be translated from private
    to public.


    - Port address translation or PAT: This configuration is also called NAT overload.
