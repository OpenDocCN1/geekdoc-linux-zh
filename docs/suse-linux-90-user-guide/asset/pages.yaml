  md: '# 13.1.4 Sidebar


    The sidebar is located to the left in a separate subwindow.


    **What''s Related** Under this tab, Mozilla can list a number of sites whose topic
    is related to the current one.


    **Search** This is an interface to several well-known search engines.


    **Bookmarks** This tab is an additional entry point to your bookmarks, which are
    presented here in a tree structure.


    **History** This tab provides a list of the recently visited web pages.


    # 13.2 Working with Tabs


    Mozilla can display several web pages at a time in one window using tabbed browsing.
    This is often more convenient than opening a new browser window for each new document.
    To display a document (a link) under a new tab, right-click the corresponding
    link then select ''Open Link in New Tab'' from the context menu. The different
    documents are now directly available by clicking the different tabs arranged at
    the top of the main window.


