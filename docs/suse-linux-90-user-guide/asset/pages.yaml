    /usr/include header files for the C compiler


    /usr/include/g++ header files for the C++ compiler.


    /usr/share/man various documentation files.


    /usr/share/man system manual pages (man pages).


    /usr/src source code of system software


    /usr/src/linux kernel source code.


    /tmp,/var/tmp temporary files.


    /usr all application programs


    /var configuration files (e.g., those linked from /usr)


    /var/log system log files


    /var/adm system administration files


    /lib shared libraries (for dynamically linked programs)


    /proc process file system.


    /usr/local local, distribution-independent extensions.


    /opt optional software, larger add-on program packages (such as KDE, GNOME, Netscape).


    # 24.2.3 Bash Functions


    There are two important functions of the shell that can make your work a lot easier:


    +   - The history function — To repeat a command that has been entered before,
    press ↑ until the previous command appears at the prompt. Move forward through
    the list of previously entered commands by pressing ↓. To edit the command line,
    just move the cursor to the desired position using the arrow keys and typing.
    Use Ctrl+R to search in the history.


    +   - The expansion function — Expand a file name to its full length after typing
    its first letters until it can be uniquely identified. To do so, type the first
    letters hit Tab. If there are several file names starting with the same letters,
    obtain a list of them by hitting Tab twice.'
