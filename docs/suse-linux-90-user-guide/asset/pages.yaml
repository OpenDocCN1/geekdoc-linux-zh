    root for daily work is rather risky: a single mistake could lead to many system
    files being irretrievably lost.


    Figure 2.13 on the following page shows the relevant dialog. For verification
    purposes, the password for **root** must be entered twice. Do not forget the root
    password. It cannot be retrieved.


