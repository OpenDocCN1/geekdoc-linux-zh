  md: '# Encryption with KGpg


    KGpg is an important component of the encryption infrastructure on your system.
    With the help of this program, generate and manage all needed keys, use its editor
    editor function for the quick creation and encryption of files, or use the applet
    in your panel to encrypt or decrypt by dragging and dropping. The generation and
    management of keys is required for the correct handling of encrypted files or
    e-mail messages by other applications, such as KMall or Konqueror. This chapter
    covers the basic functions needed for daily work with encrypted files.


    +   14.1 Key Management . . . . . . . . . . . . . . . . . . 236

    14.2 The Key Server Dialog . . . . . . . . . . . . . . . . . 239

    14.3 The Applet . . . . . . . . . . . . . . . . . . . . 241

    14.4 For More Information . . . . . . . . . . . . . . . . 243'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# ## 14.1 Key Management


    This section covers operations such as your mail program (KMail or Evolution),
    access the managed key data to process signed or encrypted contents.


    # ### 14.1.1 Generating a New Key Pair


    To be able to exchange encrypted messages with other users, first generate your
    own key pair. One part of it — the “public key” — is distributed to your communication
    partners, who can use it to encrypt the files or e-mail messages they send. The
    other part of the key pair — the “secret key” — is to decrypt the encrypted contents.


    > Note

    The public key is intended for the public and is distributed to all of your communication
    partners. However, only you should have access to the secret key. Do not grant
    other users access to this data.


    Start KGPG from the main menu or with the command kgpg from the command line.
    A padlock icon symbolizing KGPG appears in your panel. Click the icon to open
    the function menu. Select ‘Open key manager’. Refer to Future (14.1). Under the
    ‘Key’ menu, access all options related to the generation or management of keys.
    To generate a new key pair for yourself, click ‘Generate Key Pair’ ((Ctrl+N)).


    ![](img/024a6c3adc868dbb714281f5a6285cf8_255_0.png)


    Figure 14.1: The Key Manager


    In the following dialog, shown in Figure 14.2 on the facing page, you enter your
    user name, your e-mail address, and an optional comment. The default setting'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'for the ‘Expiration’ (Never — key pair is valid for an indefinite period) can
    be accepted unless you want your keys to expire after a certain time. The default
    settings for the ‘Key size’ and the ‘Algorithm’ can be accepted as they are. Now,
    start the key generation with ‘OK’. After this process is completed, the newly
    generated key pairs appears in the overview window of the key manager.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_256_0.png)


    Figure 14.2: Generating Keys


    # 14.1.2 Exporting the Public Key


    After generating your key pair, make the public key available to other users.
    This enables them to use it to encrypt or sign the messages or files they send
    you. To make the public key available for others, select ‘Keys’ → ‘Export Public
    Key’. The dialog opens three options:


    Export Public Key To Email Your public key is sent to a recipient of your choice
    by e-mail. If you activate this option and confirm with ‘OK’, the dialog for creating
    a new e-mail message with KMail appears. Enter the'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'recipient and click ''Send''. The recipient will receive your key and can then
    send you encrypted contents.


    **Export Public Key To Clipboard** You can place your public key here you continue
    to process it.


    **Export Public Key To File** If you prefer to distribute your key as a file on
    a data medium instead of sending it by e-mail, click this option, confirm or change
    the file path and name, and click ''OK''.


    To make your public key available to a wide audience, export it to one of the
    key servers on the Internet. For more information, refer to Section Key Server
    Dialog on the next page.


    # 14.1.3 Importing Keys


    If you receive a key in a file (for example, as an e-mail attachment), integrate
    it in your ring with the feature ''Import Key'' and use it for encrypted communication
    with the sender. The procedure is similar to the procedure for exporting keys
    described above.


    # 14.1.4 Signing Keys


    Like any other files, keys can also be signed for the purpose of guaranteeing
    the authenticity and integrity. If you are absolutely sure the imported key truly
    belongs to the individual specified as the owner, express your trust in the authenticity
    of the key by means of your signature.


    > Note Encrypted communication is only secure to the extent that you positively
    associate public keys in circulation with the specified user. By cross-checking
    and signing these keys, you contribute to the establishment of a web of trust.


    Select the key you use in the key list. Select ''Keys'' → ''Sign Key''. In the
    following dialog, designate the secret key to use for the signature. An alert
    reminds you to check the authenticity of this key before you sign it. If you have
    performed this check, click ''Yes'' and enter the password for selected secret
    key in the next step. Other users can now check the signature by means of your
    public key.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# 14.2 The Key Server Dialog


    Several Internet-based key servers offer the public keys of many users. To engage
    in encrypted communication with a large number of users, use these servers to
    distribute your public key. For this purpose, export your public key to one of
    these server. Similarly, KGPG enables you to search for one of these for the keys
    of certain people and import their public keys from the server.


    # 14.2.1 Importing a Key from a Key Server


