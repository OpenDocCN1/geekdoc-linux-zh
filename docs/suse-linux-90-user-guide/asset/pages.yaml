  md: '# The Web Browser Galeon


    Recently, the widely-used web browser has been transformed into a real jack-of-all-trades.
    The fact that today’s Internet applications feature such depth in integration
    and are heavily integrated into their corresponding desktop environments is almost
    taken for granted. Users of outdated machines soon feel the effects of this development.
    All-around browsers are often memory-eaters, sluggishish in their operation, and
    occupy thirty megabytes on the hard disk.


    That is why the idea behind Galeon is to devote itself just to one assignment:
    the web and only the web. Galeon implements the speedy “Gecko” engine of the Mozilla
    browser and integrates this into an extremely functional user interface. The application
    loads quickly and is one of the fastest browsers available.


    +   12.1 Optimized for the Web . . . . . . . . . . . . . . . . 224

    12.2 Efficient Surfing with Tabs . . . . . . . . . . . . . . . . . 225

    12.3 Smart Bookmarks . . . . . . . . . . . . . . . . . . 225

    12.4 Settings and Controls . . . . . . . . . . . . . . . . 225

    12.5 For More Information . . . . . . . . . . . . . . . . . 225'
  merge: -1
  pgno: 242
- img_proc: true
  md: '![](img/024a6c3adc868dbb714281f5a6285cf8_243_0.png)


    # 12.1 Optimized for the Web


    Galeon is primarily designed to make surfing the Internet as convenient as possible.
    In the default configuration, Galeon presents a second toolbar, enabling quick
    access to the popular Google search engine and its news and image search function.
    It can also offer access to an online dictionary and use the ''bookmarks.'' This
    is made possible by small JavaScript functions built into Galeon, for example,
    find out the current page is or allow the Internet site to slowly scroll down
    the screen.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# ## 12.2 Efficient Surfing with Tabs


    Galeon can display multiple WWW documents in a single application window. To open
    a link in a web site in the form of a new tab, right-click that link. Select ‘Open
    in new tab’ in the pop-up menu. Create a fresh Galeon tab by clicking ‘File’ →
    ‘Open New Tab’. Click the tabs to switch the display.


    # ## 12.3 Smart Bookmarks


    Smart bookmarks give access to a site’s functions along with its address, for
    example, searching the Internet for terms with Google. Enter the word in the input
    field after the Google icon. The result will be displayed after a few seconds.

    to activate or create additional smart bookmarks, select ‘Bookmarks’ → ‘Smart
    Bookmarks Toolbar’ → ‘Folder actions’ → ‘Edit…’. A window opens in to edit the
    bookmarks. To create a new bookmark, mark Smart Bookmarks Toolbar and select ‘File’
    → ‘New item’. Enter a name in ‘Name’ and the web address in ‘URL’. The ‘Smart
    URL’ field is a URL that additionally contains a wild card for the entered string.
    For example, the smart URL for Google is http://www.google.com/search?q=%s. %s
    is the wild card. Save your bookmark settings with ‘File’ → ‘Save’.


    # ## 12.4 Settings and Controls


    Modify the configuration of the browser with ‘Settings’ → ‘Preferences’. This
    dialog provides access to settings controlling both appearance and functionality.
    Galeon features built-in password management and cookie controls. It also has
    options that specify the web sites from which images may be downloaded. All these
    options can be accessed through a single dialog via ‘Tools’ → ‘Cookies’ → ‘View
    Cookies’.


    # ## 12.5 For More Information


    For more information about Galeon, see http://galeon.sourceforge.net. The GNOME
    home page http://www.gnome.org can also be helpful.'
