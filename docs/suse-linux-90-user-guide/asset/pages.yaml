  md: '# 18.1 Basic ALSA PCM Types


    As version 0.9 of the “Advanced Linux Sound Architecture” (ALSA), the concept
    for PCM devices was substantially modified and expanded. The user can now influence
    the way ALSA addresses the sound card by selecting a specific PCM type. The main
    PCM types are hw and ploughw.


    To understand the difference between the two types, consider how PCM device is
    opened. It must be opened with specific settings for at least the following parameters:
    sample format, sample frequency, number of channels, number of periods (previously
    referred to as fragments) and size of period. For example, an application may
    attempt to play a WAV file with a sample frequency of 44.1 kHz although the sound
    card does not support this frequency. In case, ALSA can automatically convert
    the data in the plug-in layer to a format supported by the sound card. The conversion
    affects the following parameters: sample format, sample frequency, and number
    of channels.


    Activate the plug-in layer by selecting the PCM type ploughw. If the PCM type
    hw is selected, ALSA tries to open the PCM devices directly with the parameters
    required by the application. The complete designator for a PCM device consists
    of the PCM type followed by a colon, the card number, and the device number, for
    example, ploughw:0.


    # 18.2 Mixers


    Mixers are a convenient way of controlling the volume and balance of the computer’s
    sound output and input. The main differences for the various mixers are the interfaces.
    Select one that meets your needs.


    > TipnGenerally, it is advisable to open a mixer application prior to opening
    other sound applications. Use the mixer to test and adjust the control settings
    for the input and output of the sound card. Some sound cards may not allow simultaneous
    access from multiple applications. If a sound application freezes, this might
    be the cause.


    # 18.2.1 gamix


    If you have multiple sound cards, gamix provides a set of controllers for each
    card. Slide the control sliders to set the levels as desired.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# 18.2.2 qamix


    QAMix is a mixer with a Qt interface. If necessary, the application interface
    can be configured in a flexible way in an XML file. All parameters can be controlled
    via MIDI. On-up, the application first searches ~/.qamix for an XML file corresponding
    to the name of the ALSA driver of your sound card. If such a file does not exist,
    it continues the search directory for the file default.xml. If this file does
    not exist either, the program continues its search in the directory /usr/share/qamix.


    If you have several sound cards, select the desired card with the parameter -c.
    hw:0 for the first sound card, hw:1 for the second, and so on. The parameter -g
    can be used to specify a file for the XML description of the application interface.
    Detailed information about the XML format is available in the directory /usr/share/doc/packages/qamix.


