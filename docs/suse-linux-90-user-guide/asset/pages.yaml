  md: 'To view the files in the test directory, enter the command ls test | less.
    The contents of the test directory will be displayed with less. This only makes
    sense if the normal output with ls would be too lengthy. For instance, if you
    view the contents of the dev directory with ls /dev, you will only see a small
    portion in the window. View the entire list with ls /dev | less.


    It is also possible to save the output of commands to a file. For example, ls
    test > Content generates a new file Content that contains a list of the files
    and directories in test. View the file with less Content.


    Similarly, you can also use a file as the input for a command. For example, sort
    the text lines in Testfile < Testfile. The output of the command sort is sent
    to the screen. The text is sorted by the first letters of the individual lines.


    If you need a new file containing the sorted list, pipe the output of the command
    sort to sort. To do this, create an unsorted name list in an editor and save it
    under list in the test directory. Change into test and enter the command sort
    < unsorted > sortedlist. Finally, view the sorted list with less.


    Just like the standard output, the standard error output is sent to the console
    as well. However, to redirect the standard error output to a file named errors,
    append 2> to the corresponding command. On the other hand, both standard output
    and standard error are saved to one file named alloutput if you append >& alloutput.
    Finally, to append the output of a command to an already existing file, the command
    must be followed by >> instead of a single >.


    # 24.2.8 Archives and Data Compression


    Now that you have already created a number of files and directories, consider
    the subject of archives and data compression. Suppose you want to have the entire
    directory packed in one file that you can save on a floppy disk as a backup copy
    or send by e-mail. To do so, use the command tar (for "tape archiver") With tar
    --help, view all the options for the tar command. The most important of these
    options are explained here:


    +   - c (for create) Create a new archive.

    - t (for table) Display the contents of an archive.

    - x (for extract) Unpack the archive.

    - v (for verbose) Show all files on screen while creating the archive.'
