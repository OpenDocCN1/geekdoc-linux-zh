  md: 'Many sound cards (like Soundblast AWE and Live!) have an internal WaveTable
    synthesizer that converts MIDI events into audible sounds. These MIDI events can
    be sent to the WaveTable synthesizer by an external MIDI key-board or by a program,
    such as a MIDI player or sequencer. For Soundblast AWE and Live cards, the WaveTable
    synthesizer must be initialized with a sound font before any sound can be heard.


    # 18.9.1 Loading Sound Fonts: SB Live! and AWE


    The package *aesfx* contains the *sfxload* command for loading sound fonts in
    Soundblast AWE and Live cards. Suitable sound font files are available on the
    driver CD of your sound card. The start-up script for ALSA can automatically load
    the sound fonts required for WaveTable synthesis, provided the respective files
    were installed from the Creative CD using YoST. Currently, the script only works
    for one sound card. However, ALSA can easily manage up to eight sound cards.


    Sound fonts can be loaded with a command like sfxload -n <n> /usr/share/sfbank/creative/8BMGSFX.SF2
    where n stands for the number of the sound card (0..). This may not be the number
    under which your card was configured. This is instead determined by the order
    in which the individual sound drivers are loaded.


    You can also load one of the sound fonts installed in /usr/share/sounds/sf2. The
    sound font *Vintage_Dreams_Waves_v2.sf2* by Ian Wilson contains 128 analog synthesizer
    sounds and 8 drum sets. It is suitable for SB AWE as well as for SB Live! cards.
    The ROM sound font *gull-rom.sf2* by Samuel Collins is only suitable for SB AWE
    cards. It provides an extended MIDI bank for these cards. Review the copyleft
    and the documentation in /usr/share/doc/packages/snd_sf2. More sound fonts are
    available at URLs like http://www.hammersound.net.


    # 18.9.2 vkeybd — Virtual MIDI Keyboard


    If you do not have an external MIDI keyboard connected to your sound card, use
    the virtual keyboard vkeybd. For this purpose, the internal port numbers listed
    with *pmidi -l* as described are important. To start the program from the command
    line, enter vkeybd --addr 73:0. The port address must be adapted to your system.
    Specify the first WaveTable port from the list. If an external sound generator
    is connected, alternatively specify the port number of the external MIDI port.'
  merge: -1
