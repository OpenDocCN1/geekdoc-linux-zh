    # 13.1.2 The Navigation Toolbar


    The buttons of the navigation toolbar give quick access to the basic functions
    of the browser. Use ''Forward'' and ''Back'' to jump one step ahead or back in
    the history of pages viewed previously. ''Reload'' updates the contents of a page.
    Usually, web sites are stored in the Cache for a certain time, if they are called
    again. Reload always loads the current page from the Internet. ''Stop'' aborts
    the loading of a page, so no further data is transferred from the corresponding
    site.


    The next element to the right is the location bar in which to enter Internet addresses
    (URLs) or search terms. If you enter a search term then press ''Search'', Mozilla
    searches the web for that term using the search engine set in the preferences.
    After having visited a number of sites, directly select their addresses by clicking
    the down arrow, which opens a drop-down list. Mozilla stores the contents of this
    list so it is available in your next browser session. Start typing an address
    then hit `Tab` to complete it automatically.


    ''Print'' prints the current page. The downward arrow to its right also gives
    access to a page preview of the document. To the very right, the navigation toolbar
    displays the Mozilla logo, which is animated as long as the browser is transferring
    data.


    # 13.1.3 The Personal Toolbar


    The personal toolbar is a customizable toolbar that is preconfigured to include
    the following elements:


    +   Home This points to a web address of your choice which have been configured
    to be displayed as Mozilla''s start page.


    +   Bookmarks This button lets you access the bookmarks collected from intranet
    or Internet sites.


    +   The Mozilla Organization This points to the home page of the Mozilla project.
    SuSE — The Linux Experts points to the home page of SuSE Linux.'
