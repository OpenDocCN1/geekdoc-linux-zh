- img_proc: true
  md: '# 4.1.5 The Panel


    The panel at the lower edge of the screen consists of several areas. By default,
    the icon for the main menu is located to the far left. Other icons are lined up
    alongside. The house icon provides quick access to your home directory with all
    subdirectories. The other icons start applications such as OpenOffice.org, K-Mail,
    and the web browser Konqueror, provided these programs were installed.


    Next to these icons are the numbered buttons with which to switch between the
    individual desktops. These multiple desktops enable you to organize your work
    if you use many programs simultaneously, as if you had several desks for various
    tasks.


    The taskbar is located next to the virtual desktops. All applications are displayed
    in the taskbar. If you click a window title in the taskbar, the application will
    be moved to the foreground in case it is behind other windows. If it is already
    in the foreground, a mouse click will minimize the application. If you click it
    again, it will be opened anew. Next to the taskbar you will notice applets such
    as the clipboard Klipper, SuWatcher, and any other applets you have started. The
    clock helps you keep track of your time.


    If you click an empty space in the taskbar with the right mouse button, providing
    the usual help and configuration options for the panel is displayed. You can use
    the menu to change the size of the panel and add or remove applications. To add
    an application, search for the respective application in the menu and select it.
    You can remove applications or applets by clicking the respective icon with the
    right mouse button and selecting ''Remove'' from the displayed menu.


    # 4.1.6 The Main Menu


    You can access the main menu by means of the icon to the far left of the panel.
    By default, this menu contains entries for logging out from the system, locking
    the screen, executing commands, and starting the quick browser and the bookmark
    manager. You can use the file manager to display your home directory, search for
    files, or start the Control Center for purpose of customizing the desktop. The
    other menu entries allow you to start a variety of programs sorted by subjects.
    The following section provides information on selected functions that you can
    start by means of the main menu. Detailed information on the Control Center is
    available in Section Settings on page 133.


    Logout User You can log out from the system by means of this menu item. However,
    first you will be asked what should happen after the logout.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'If you select the ''Login as different user'', the login screen is displayed,
    allowing you or another user to log in with the system. You can also turn off
    or restart the computer. Confirm your selection with ''OK'' or remain logged in
    by clicking ''Cancel''.


    # Lock Screen If you leave your workstation, you can black your screen or start
    a screensaver. To restore the session view, enter your normal login password.
    In this way, make sure no one reads or manipulates your documents or e-mail messages.


    # Start New Session To start a second session with a graphical user interface
    on your machine, select ''Start New Session'' from the main menu. Your current
    session remains active while you are taken to the login screen. Log in anew. You
    can also start another window manager. You can access the first session by simultaneously
    pressing Ctrl+Alt+F7. If you press F8 instead of F7, you will be taken to the
    new session. Additional sessions can be accessed by pressing Ctrl+Alt+F-12.


    # Run Command A dialog window allows you to enter a command. In this way you can
    easily start applications whose name you know without having to navigate through
    the applications menu.


    # Bookmarks By of this method, start the bookmark editor with ''Edit Bookmarks''
    for the purpose of managing your bookmarks. If you select a bookmark from the
    menu, the browser starts and loads the desired URL.


    # Search ''Search'' starts the program Find. Use ''Help'' to access the program
    manual, which provides information about all details. If you forget where a certain
    file is, enter it in the ''Named'' field and search for it in your home directory.
    This default setting can be changed to a different directory, by clicking ''Browse''.
    If you are not sure what the exact file name is, use wild cards. If you can remember
    the file name contains the character string blub, simply enter *blub*. This tells
    the program that blub can be preceded and followed by any characters.


    Use the tabs at the top left of the window to change to ''Contents'' and ''Properties''.
    In ''Contents'', use ''File type'' to limit the search to files or directories
    or search for the content of the document. If you enter a keyword for the document
    for which you are looking in ''Containing text'', all texts containing this word
    will be displayed. Click the respective file to load it directly.


    ''Save as...'' allows you to save the file under a new name in a different directory.
    The original file is retained.'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'Search criteria can be specified in the ''Properties'' dialog. You can limit
    your search to files that were modified or created recently or to files that belong
    to a specific user or group.


    # 4.1.7 The Windows


    The windows of all KDE applications have the same structure. The title bar features
    four buttons in the right corner. The question mark provides access to text help.
    If you click the question mark and subsequently an icon of the application, a
    short help text is displayed. The button with the black dash minimizes the window.
    A minimized window is placed in the panel. However, the application is not terminated.
    Display it and continue to use it by clicking the icon on the taskbar. The button
    with the square maximizes the window over the entire screen area. The X button
    closes the window and terminates the application.


    Windows can be moved, enlarged, or resized. Click the title bar with the left
    mouse button and keep the mouse button pressed to move the window on your screen.
    If you right-click the top bar, a configuration menu is displayed. To change the
    size of the window, move the mouse pointer along one of the four edges of the
    window until the mouse pointer symbol changes to a double arrow. Keep the left
    mouse button pressed while moving this edge. Another possibility is to move the
    mouse pointer to one of the four corners and resize two edges of the window at
    the same time.


    # 4.2 Settings


    The KDE desktop can be customized according to your preferences and needs. The
    menu item ''Control Center'' in the main menu opens the configuration dialog for
    your KDE desktop. The following section introduces a number of modules.


    # 4.2.1 Peripherals


    This opens the configuration dialogs for the mouse, keyboard, and printer administration.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Keyboard


    **Keyboard repeat** Keeping a key pressed causes the associated character to be
    printed repeatedly as long as the key is pressed. The option is activated by default,
    as it facilitates navigation in documents with the arrow keys.


    **Key click volume** If you want to hear a sound when a key is clicked, activate
    this option and adjust the volume with the slider.


    **Use sticky keys, slow keys, or bounce keys** These options are the same as those
    listed in Section *Accessibility* on page 141, where they are described in detail.


    **NumLock on KDE startup** Here, determine whether the number pad of your keyboard
    should be active or inactive when KDE is started.


    # Mouse


    The mouse configuration comprises three tabs: ''General'', ''Advanced'', and ''Mouse
    Navigation''.


    Configuration options of the ''General'' tab:


    **Button Mapping** Here, specify right-handed or left-handed use of your mouse.


    **Icons** Determine how the system should react to clicks and double-clicks. The
    default setting for the KDE desktop is a single click for opening files and folders
    and a mouse pointer that changes its appearance when it is moved over icons. If
    you want icons to be selected automatically in addition to the single click, activate
    the respective option and set the delay for this selection. To use the Windows-typical
    double-click for opening files and folders, select ''Double-click to open files
    and folders (select icons on first click). Finally, set the size and color of
    the pointer and the visual feedback on activation.


    Configuration options of the ''Advanced'' tab:


    # Pointer Acceleration and Pointer Threshold


    The pointer acceleration defines the relation between the movement speed of the
    input device (mouse) and the speed of the pointer on the screen. The higher the
    selected factor is, the more difficult it is to control the screen pointer. The
    threshold (in pixels) specifies distance the pointer must cover before the indicated
    pointer acceleration is activated. In this way, control the mouse pointer easily
    when covering small distances and cover large distances on the screen with small
    movements.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Double Interval Here, set the maximum interval between two mouse clicks that
    should be interpreted as a double-click.


    # Drag Start Time and Drag Start Distance


    The object selected with a click is moved if you move it by the distance in pixels
    specified in ''Drag start distance'' within the period specified in ''Drag start
    time''.


    # Mouse Wheel Scrolls By If you have a wheel mouse, specify the number of lines
    the image scroll should per wheel "tooth".


    To be able to navigate the mouse pointer with the arrow keys of the number pad,
    activate this function under ''Mouse Navigation'' and customize the parameters
    according to your needs.


    # Printers


    The printer administration module mainly consists of three parts. The top frame
    lists all printers available in the network. The center part features a configuration
    and information zone comprising four tabs. The lower part indicates the current
    print system type. The following description only covers the configuration-part.


    > Note


    The configuration options relevant for your daily work with the system can be
    accessed under ''Jobs'' and ''Instances''. ''Information'' and ''Properties''
    mainly provide information or are used for system administration.


    Depending on which printer is currently selected in the overview, you can view
    and modify status and model information and configuration options in the following
    four tabs at the center of the dialog window:


    Information This tab provides general and unmodifiable information about the printer,
    such as the printer type, its status, location, and designation.


    Jobs The functionality under this tab corresponds to the description of KJobViewer
    in Section Monitoring Print Jobs on page 149.


    Properties All settings in connection with the printer are general information,
    drivers, interfaces, separator pages, quotas, and user accesses.'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'Instances Depending on the document type, you may have diverse requirements
    for the printouts (page format, duplex printing, orientation, print quality, and
    banners). Combine the characteristic settings for each type in ''instances''.
    To create a new profile, select ''New'' and enter a name for the profile. Click
    ''Settings...'' to open a configuration dialog in which to specify these settings.
    To save the settings and exit the dialog, click''OK''. To define one of your custom
    profiles as the default for this printer, click ''Set as Default''. Your default
    profile is used when printing from applications. You can only switch between the
    individual profiles in the printer administration mode.


    # 4.2.2 Desktop


    Unter ''Erscheinungsbild'' bestimmen bestimmte Schriftart und -größe, Farben,
    Hintergrundfarben und Unterstreichungen der Arbeitsfläche. ''Fenstereigchaften''
    meint das Verhalten der Fenster und der Aktivierung. Sie können beispielsweise
    einstellen, damit der Fokus der Maus folgen soll. Dann müssen Sie nicht mehr in
    ein Fenster klicken, um zu aktivieren.


    The taskbar is part of the panel and assists you in finding your way around the
    desktop. It displays the applications currently started on your system. In this
    mode, determine to what extent started programs and virtual desktops should be
    displayed in the taskbar and which actions should be associated with mouse clicks
    in the taskbar.


    Unter ''Kontrolleleisten'' legen Sie die Position und Größe der Leisten fest und
    konfigurieren das Ausblenden derselben. Ebenso können Sie zusätzliche Menüs in
    die Kontrolleleiste legen. Sollte Ihnen die standardmäßige Zahl an virtuellen
    Arbeitsflächen nicht genügen, legen Sie unter ''Virtuelle Arbeitsflächen'' zu
    und weisen ihnen Namen zu.


    # 4.2.3 Sound & Multimedia


    Here you can perform all settings for the playback of audio CDs and for the sound
    system. Under ''System Bell'', you can switch from system notification to a system
    bell and specify the volume, pitch, and duration of the bell.


    By default, system notifications are used. Use this module to determine how the
    system should inform you in the event of a problem, when a task is performed,
    or if an event requiring your immediate attention occurs.


    In the upper part of the dialog, use drop-down menu to select the application
    for which to configure the system notifications. As soon as you select a program,'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'all events the application can send to the user are listed in the lower window.
    You can determine the notification type for each notification in the ‘Actions’
    dialog.

    The standard view of the system notification dialog only offers the activation
    of a ‘Play a sound’ check box for audible notification. Click ‘More Options’ to
    access other action modes. You can log notification to a file, execute a program,
    or show the message in a pop-up window. In the lower part of the dialog under
    ‘Quick Controls’, you can globally activate or deactivate the said actions for
    all programs.


    # 4.2.4 Appearance & Themes


    This item features all fine tuning options for the appearance of your desktop.


    # Screen saver


    The module for selecting and configuring the screensaver consists of three parts.
    Select a suitable screensaver from the list to the left. The preview to the right
    shows how the selected program looks. Use ‘Setup’ and ‘Test’ to test the screensaver
    in the running system and configure it.


    **Start screen saver saver automatically** For the screensaver to be activated
    automatically, select this check box and specify the time (in minutes) after which
    the screensaver should be activated.


    **Require password to stop screen saver**nThe screensaver can block your workstation
    and require a password for the release.


    **Priority** Use the slider to set the priority of the screensaver in relation
    to other processes. Use a graphically complicado screensaver that generates a
    high processor load, set the priority to achieve a smooth display quality. In
    this case, the priority of other processes is reduced accordingly. However, if
    you frequently let your machine work while you do other things, you should refrain
    from running a complex screensaver with a high priority.


    # Colors


    Use this module to manage and edit color schemes for your desktop. The preview
    window displays all desktop elements in the many existing schemes. In the defined
    colors. To change the color of one or several widgets, select'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'the name of the widget from the drop-down menu under ''Widget Color'' and click
    the color bar below to choose a suitable color in the color editor. Finally, adjust
    the contrast settings and save the modified scheme under a name of your choice.
    To apply this scheme globally, activate the check box ''Apply colors to non-KDE
    applications''.


    # Window Decorations


    Select a decoration style for your application windows from the list under the
    ''General'' tab.Click ''Apply'' to test the selected style. To position or move
    individual elements of the title bar, activate the check box ''Use custom titlebars''
    and rearrange the elements under the ''Buttons'' tab. If additional configuration
    options are available for the selected style, access these under the ''Configure''
    tab.


    # Background


    Determine a background for your desktop. By default, your modifications are applied
    to all virtual desktops. To configure the backgrounds separately for the individual
    virtual desktops, deactivate the ''Common Background'' check box. The effect of
    your configuration can be seen in the preview at the top right of the dialog window.


    The background colors can be selected under the ''Background'' tab. To modify
    the color components, click the color bar next to ''Color 1'' or ''Color 2'' to
    open a color editor. Here, you can change the settings as desired or use the pipette
    to adopt a color from any desktop element or a loaded image or web page. Select
    gradient effects under ''Mode''.


    To use an image as a background for one or several backgrounds, activate ''Single
    Wallpaper''. Then select the scaling mode or the position of the wallpaper on
    your desktop and designate a suitable wallpaper with the drop-down menu or the
    ''Browse...'' button. Alternatively, drag and drop images from your file manager
    (see Section Konqueror as a File Manager on page 141) or the desktop to the preview
    image. For wallpaper variety, activate ''Multiple Wallpapers'' and proceed with
    the further configuration using ''Setup Multiple..''.


    The ''Advanced'' tab features some special settings that do not need to be modified.


    # Fonts


    All fonts and font attributes used on the desktop can be configured. Click ''Choose...''
    then specify your settings in the dialog that opens. By default, antialiasing
    is activated for all fonts. To deactivate or customize antialiasing, select the
    respective check boxes.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '> Tip

    Changes to the antialiasing settings are only applied to newly-started programs.
    Programs already open are not affected by the changes.


    The KDE Desktop


    # Style

    Here, select the style for all widgets (elements of the graphical interface) in
    KDE applications. The configuration contains three tabs. Select the style under
    ''Style'', using the preview in the lower part of the window. Use ''Effects''
    to configure various GUI effects and transparency types, if supported by the respective
    style.


    # 4.2.5 Regional & Accessibility


    Country/Region & Language

    The settings in this module only apply to KDE applications. Other applications,
    such as OpenOffice.org, may need to be configured separately. All regional system
    settings can be configured under five tabs.


    +   **Locale** Use the drop-down menu to select the desired country from the list.

