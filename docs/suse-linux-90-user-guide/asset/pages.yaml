  md: '# 18.7 Direct Recording and Playback of WAV Files


    arecord aplay can be used to record and play audio data in the WAV format and
    other formats. The command arecord -d 10 -f cd -t mys.wav records a WAV file of
    ten seconds in CD quality (16 bit, 44.1 kHz). List all options of arecord by running
    them with the --help option.


    goRecord is a simple recording program with a graphical interface and level display.
    This program makes use of an internal buffer of about 1 MB (configurable-with--buffersize),
    it enables uninterrupted recordings on slow hardware, even if it is run with real-time
    priority (see Section 18.4). During the recording, the currently-used buffer size
    is displayed in the status line under ''Buffer'' and the maximum buffer size required
    so far for this recording is displayed under ''Peak''.


    # 18.8 Compressing Audio Data


    Uncompressed audio in CD quality consumes almost ten MB per minute. The MP3 procedure
    was developed by Fraunhofer IIS for the purpose of compressing this data. Unfortunately,
    this procedure is patented. Furthermore, companies that distribute MP3 encoders
    are required to pay license fees. The powerful MP3 encoder Lame was developed
    for Linux. Although the source code of Lame is under the GPL, we are not allowed
    to include this encoder in our distribution. For more information about the legal
    situation, visit the web page at http://lame.sourceforge.net. (including Germany
    and the USA), the use of Lame is permitted for research purposes only.


    Ogg Vorbis (package vorbis-tools) is a free audio compression format that is now
    supported by the majority of audio players. The web page of the project is http://www.xiph.org/ogg/vorbis.
    The vorbis-tools package includes an encoder and a simple player. The encoder
    is started from the command line with oggenc. The only parameter needed is the
    WAV file to compress. The -h displays an overview of the other parameters. The
    latest version of the Ogg encoder even supports encoding with a variable bit rate.
    In this way, an even higher degree of compression can be achieved. Instead of
    the bit rate, specify the desired quality with the parameter -q. The parameter
    -b determines the average bit rate. -m and -M can be used to specify the minimum
    and maximum bit rate.'
