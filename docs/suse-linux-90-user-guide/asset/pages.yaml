    # 18.4 Buffering and Latencies


    This section explains how uninterrupted audio playback can be ensured. This problem
    is by no means limited to Linux, but is inherent in all multitasking operating
    systems. In a multitasking operating, several processes usually run concurrently.
    As the processor can only handle one process at a time, each process is assigned
    a certain amount of time by the operating system''s scheduler. The switching action
    between processes normally happens so quickly that the user does not notice it.
    However, during audio playback, even brief interruptions are noticeable in the


    ![](img/024a6c3adc868dbb714281f5a6285cf8_310_1.png)


    Figure 18.8: The kscd User Interface


    SuSE Linux - User Guide 291'
