  md: '# Dependency Check


    ''Check Dependencies'' and ''Autocheck'' are located in the information window.
    If you click ''Check Dependencies'', the package manager checks if the current
    package selection results in any unresolved package dependencies or conflicts.
    In the event of unresolved dependencies, the required additional packages are
    selected automatically. For package conflicts, the package manager opens a dialog
    that shows the conflict and offers various options for solving the problem. If
    you activate ''Autocheck'', any change of package status triggers an automatic
    check. This is a useful feature, as the consistency of the package selection is
    monitored constantly. However, this process consumes resources and can slow down
    the package manager. For this reason, the autocheck is not activated by default.
    In either case, a consistency check is performed when you confirm your selection
    with ''Accept''.


    In the following example, package sendmail and package postfix may not be installed
    concurrently. Figure 3.5 on the next page shows the conflict message prompting
    you to make a decision. package postfix is already installed. Accordingly, you
    can refrain from installing package sendmail, remove package postfix, or take
    the risk and ignore the conflict.


    > Caution

    Ignoring a conflict is strongly discouraged, as the stability and reliability
    of your system can no longer be guaranteed under these conditions.


    # 3.3.5 System Update


    This module enables an update of the version installed on your system. Operating,
    you can only update application software, not the SuSE Linux base system. To update
    the base system, boot the computer from an installation medium, such as the CD.
    When selecting the installation mode in YaST, select ''Update an existing system''
    instead of ''New installation''.


    The procedure for updating the system is similar to the new installation. Initially,
    YaST examines the system, determine a suitable strategy, and present the results
    in a suggestion dialog (see Figure 3.6 on page 61). Click the individual items
    with the mouse to change any details. Some items, such as ''Language'' and ''Keyboard
    layout'', are covered in the section explaining the installation procedure. Therefore,
    the following paragraphs only cover update-specific settings.'
