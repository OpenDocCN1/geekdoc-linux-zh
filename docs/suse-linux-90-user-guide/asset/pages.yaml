  md: '# 10.1 Overview of KAddressBook


    KAddressBook can be started independently from the main menu, from the appointment
    scheduler KOrganizer, or the mail program KMail. On start-up, the KDE Address
    Book window consists of three frames. The top frame contains the menu and toolbars.
    The two lower frames contain the current list of contacts and the address data
    of the currently selected contact. See Figure 10.1.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_231_0.png)


