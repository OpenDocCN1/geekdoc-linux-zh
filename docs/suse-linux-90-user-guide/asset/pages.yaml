    # 3.8 System


    # 3.8.1 Backup Copy of the System Areas


    The YaST backup module enables you to create a backup of your system. The

    backup created by the module does not comprise the entire system, but only

    saves information about changed packages and copies of critical storage areas

    and configuration files.


    Define the kind of data to save in the backup. By default, the backup includes

    information about any packages changed since the last installation. In addition,

    it may include data that does not belong to packages themselves, such as

    many of the configuration files in /etc or in the directories /home. Apart

    from that, the backup can include important storage areas on your hard disk

    that may be crucial when trying to restore a system, such as the partition table

    nor the master boot record (MBR).'
