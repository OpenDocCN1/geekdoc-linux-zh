  md: '# Creating a Partition


    +   1. Select ‘New’. If several hard disks are connected, a selection dialog appears
    in which to select a hard disk for the new partition. Then, specify the partition
    type (primary or extended). Create up to four partitions or up to three primary
    partitions and one extended partition. Within the extended partition, you can
    create several logical partitions (see Section Partition Types on page 20).


    +   2. Select the file system to use for format the partition and the mount point,
    if necessary. YoST suggests a mount point for each partition created. Details
    of the parameters are provided in the next section.


    +   3. Select ‘OK’ to apply your changes.


    The new partition is then listed in the partition table. If you click ‘Next’,
    the current values are adopted and you are returned to the suggestion screen.


    # Partitioning Parameters


    If you create a new partition or modify an existing partition, various parameters
    can be set in the partitioning tool. For new partitions, suitable parameters are
    set by YoST and usually do not require any modification. To perform manual settings,
    proceed as follows:


    +   1. Select the partition.


    +   2. ‘Edit’ the partition and set the parameters:


    +   - File System ID

    Even if you do not want to format the partition at this stage, specify one of
    the following file system IDs to ensure the partition is registered correctly:
    ‘Linux’, ‘Linux swap’, ‘Linux LVM’, or ‘Linux RAID’. Refer to the Administration
    Guide for details on LVM and RAID.


    +   - File System

    To format the partition immediately within the scope of the installation, specify
    one of the following file systems for the partition: ‘Swap’, ‘Ext2’, ‘Ext3’, ‘ReiserFS’,
    or ‘JFS’.

    Swap is a special format that makes the partition usable as virtual memory. Every
    system should have at least one swap partition of at least 128 MB (see page on
    the next page). ReiserFS is the default for Linux partitions. ReiserFS as well
    as Ext3 are journaling'
  merge: -1
