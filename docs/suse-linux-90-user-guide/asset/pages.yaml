- img_proc: true
  md: '# 16.1 Starting Evolution


    Start Evolution from the main menu or with the command evolution. When started
    for the first time, Evolution offers a configuration assistant. If it is not opened
    automatically, select ''Tools'' → ''Settings'' → ''Mail Accounts'' and click ''Add''.
    Click ''Next'' to access the assistant. Enter your name and your e-mail address
    in the respective fields. If you have several e-mail addresses, specify your preferred
    address. Additional addresses can be configured. Click ''Next''.


    Select the appropriate e-mail format for this address from the ''Server Type''
    drop-down box. ''POP'' is the most common format for downloading mail from a remote
    server. ''IMAP'' works with mail folders on a special server. Obtain this information
    from your ISP or server administrator. When the server type is selected, Click
    ''Next'' when finished.


    The next set of information to enter is about mail delivery. This is used for
    all configured e-mail addresses. For submitting outgoing e-mail on the local system,
    select ''Sendmail''. For a remote server, select ''SMTP''. Get the details from
    the ISP or server administrator. For SMTP, complete the other fields displayed
    after selection. Click ''Next'' when finished.


    By default, the e-mail address is is used as the name to identify the account.
    Enter another name if desired. The field ''Make this your default account'' determines
    whether the account should be used as the default. The default account is the
    e-mail address initially selected for sending e-mail. Another account can be selected
    in the message composition window if desired. Click ''Next''.


    The time zone information from the next window is used for the calendar functions.
    It is important to select the correct time zone for the appointment scheduling
    functions. Click the dot on the map for your city time zone. Selection zooms to
    the area and a change can be made if desired. When the correct time zone is displayed
    under ''Selection'', click ''Next''. In the next window, click ''Finish'' to save
    the data entered. Use ''Back'' to make changes.


    # 16.2 Importing E-Mail from Other Mail Programs


    Evolution can import e-mail from other e-mail programs, such as Netscape or KMail.
    To do so, select ''File'' → ''Import...''. For KMail or mull, select ''Import
    a single file''. For Netscape, select ''Import data and settings from older programs''.
    More information can be obtained through the program''s ''Help'' menu.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# 16.3 Overview of Evolution


    The default view window is shown in Figure 16.1. The available menus, items, and
    the icons in the toolbar vary from window to window. Use the ''Shortcuts'' panel
    to the left to select the information to display in the right panel. Adjust the
    size of any panels by dragging the dividing bars.

    Use ''View'' to remove the ''Shortcuts Bar'' or add a ''Folder Bar'' at any time.
    The different items listed in the ''Shortcuts'' are described in the following:


    ![](img/024a6c3adc868dbb714281f5a6285cf8_278_0.png)


    Figure 16.1: The Evolution Window with Shortcuts and Summary


    # 16.3.1 Summary


    The ''Summary'' provides some basic information about e-mail, appointments, and
    tasks along with personally configurable weather and news sources. This window
    is shown in Figure 16.1. Use ''Tools'' → ''Settings'' → ''Summary Preferences''
    to configure the information displayed.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 16.3.2 Inbox


    In this view, the upper half of the window shows the contents of the folder In-box.
    The lower half is a preview pane used to display the selected mail message. Disable
    the preview pane with ''View'' → ''Preview Pane''.

    To change the folder displayed, click the down arrow next to ''Inbox'' and select
    another folder from the list. Use the search bar to search the messages in a folder.
    If desired, click a header for the message list to sort the messages by that header.
    The sort can be either ascending or descending as shown by the arrow to the right.
    Click the header until the correct direction is displayed.


    # 16.3.3 Calendar


    The initial display shows a day view of the current day with the month and a task
    list shown in an additional pane to the right. Week, work week, and month views
    are also available from the toolbar or the ''View'' menu. Use the search bar to
    find an ended appointment. Add appointments and tasks using the toolbar. Also
    use the toolbar to page through the calendar or jump to a specific date.


    # 16.3.4 Tasks


    ‘Tasks’ provides a list of tasks. Use the toolbar to add tasks. Search the tasks
    with the search bar.


    # 16.3.5 Contacts


    This view shows all the addresses in your address book. To locate a particular
    address, use the search bar or click the button to the right displaying the first
    letter of the contact''s last name. Add contacts or lists with the toolbar.


    # 16.4 E-Mail


    To configure the mail settings in Evolution, go to ''Shortcuts'' → ''Inbox''.
    Then activate ''Tools'' → ''Settings''.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# 16.4.1 Configuring Accounts


    Evolution is capable of fetching e-mail from multiple mail accounts. The account
    from which to send e-mail can be selected when composing a message. To edit a
    current account, select the account in ''Settings'' → ''Mail Accounts'' and click
    ''Edit''. To add a new account, click ''Add''. The configuration assistant described
    in Section Starting Evolution on page 258 opens. To delete an account, select
    it and click ''Delete''.


    To make the default account for sending e-mail, select the desired account then
    press ''Default''. To disable fetching e-mail from an account, select the account
    then click ''Disable''. A disabled account can still be used as the address for
    sending, but that account is not checked for incoming e-mail. If necessary, reactivate
    the account with ''Enable''.


    # 16.4.2 Mail Preferences


    Use ''Mail Preferences'' to select or disable the quote highlight color or how
    long after opening a message it is marked as read. Also make settings regarding
    images in HTML mail messages are handled.


    # 16.4.3 Creating Messages


    To compose a new message, click ''New'' → ''Mail Message''. Replying to or forwarding
    a message opens the same message editor. Next to ''From'', select from which account
    to send the message. In the recipient fields, enter an e-mail address or part
    of a name or address in your address book. If Evolution can match what you enter
    to something in the address book, a selection list is displayed. Click the desired
    contact or correct your input if none match. To select directly from the address
    book, click ''To'' or ''CC''.


    Evolution can send e-mail as plain text or HTML. To format HTML mail, select ''Format''
    in the toolbar. To send attachments, select ''Attach'' or ''Insert'' → ''Attachment...''.


    To send your message, click ''Send''. If not ready to send it immediately, make
    another selection under ''File''. For example, save the message as a draft or
    send it later.


    # 16.4.4 Encrypted E-mail and Signatures


    Evolution supports e-mail encryption with PGP. It can sign e-mail and check signed
    e-mail messages. To use these features, generate and manage keys with an external
    application, such as gpg or GPG.'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'To sign an e-mail message before sending it, select ‘Security’ → ‘PGP sign’.

    When you click ‘Send’, a dialog prompts for the password of your secret key. Enter
    the password and exit the dialog with ‘OK’ to send the signed e-mail.

    To sign other e-mail messages in the course of this session without needing to
    ‘unlock’ the secret key repeatedly, activate ‘Remember this password for the remainder
    of this session’.


    When you receive signed e-mail from other users, a small padlock appears at the
    end of the message. If you click this symbol, Evolution starts an external program
    (gpg) to check the signature. If the signature is valid, a green mark appears
    next to the padlock symbol. If the signature is invalid, a broken padlock appears.


    The encryption and decryption of e-mail is just as easy as. After composing the
    e-mail message, go to ‘Security’ → ‘PGP encrypt’ and send the e-mail message.
    When you receive encrypted messages, a dialog opens to ask for the password of
    your secret key. Enter the passphrase to decrypt the e-message.


    # 16.4.5 Folders


    It is often convenient to sort e-mail messages into a variety of folders. To view
    your folder tree, select ‘View’ → ‘Folder Bar’. If accessing mail over IMAP, the
    IMAP folders are also shown in this folder bar. For under ‘Local Folders’. Your
    ‘Contacts’, ‘Calendar’, and ‘Tasks’ are also treated as folders in this view,
    but should not be used for storing e-mail.


    Several folders are included by default. ‘Inbox’ is where new messages fetched
    from a server are initially placed. ‘Sent’ is used for saving copies of sent e-mail
    messages. ‘Outbox’ is temporary storage for e-mail that has not yet been sent.
    It is useful if working offline or if the outgoing mail server is temporarily
    unreachable. ‘Drafts’ is used for saving unfinished e-mail messages. The ‘Trash’
    folder is intended for temporary storage of deleted items. The folder can be emptied
    automatically by activating the respective option under ‘Tools’ → ‘Settings’ →
    ‘Mail Preferences’.


    New folders can be created under ‘Local Folders’ or as subfolders of existing
    folders. To create a new folder while in the ‘Inbox’ view, select ‘File’ → ‘Folder’
    → ‘New Folder’. In the following-dialog, enter a name for the new folder. Leave
    the ‘Folder Type’ as ‘Mail’ for a new mail storage folder. Use the mouse to determine
    the parent folder which to place the new folder. Exit the dialog with ‘OK’.


    To move a message into a folder, select the message to move. Right-click to open
    the context menu. Select ‘Move to Folder...’ and, in the dialog opens, that'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'destination. Click ''OK'' to move the message. The message header in the original
    folder is shown with a line through it, meaning it is marked for deletion in that
    folder. The message is stored in the new folder. Messages can be copied in a similar
    manner.


    Manually moving a number of messages into different folders can be time-consuming.
    Filters can be used to automate this procedure.


    # 16.4.6 Filters


    Evolution offers a number of options for filtering e-mail. Filters can be used
    to move a message into a specific folder or to delete a message. Messages can
    also be moved directly to the trash with a filter. There are two options for creating
    a new filter: creating a filter from scratch or creating a filter based on a message
    to filter. The latter is extremely useful for filtering messages sent to a mailing
    list.


    # Setting up a Filter


    Select ''Tools'' → ''Filters''. This dialog lists your existing filters, which
    can be edited or deleted. Click ''Add'' to create a new filter.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_282_0.png)


    Select a name for the new filter in ''Rule Name''. Select the criteria to use
    for the filter. Options include sender, recipients, source account, subject, date,
    and status. The drop-box showing ''Contains'' provides a variety of options, such
    as'
  merge: -1
  pgno: 282
- img_proc: true
  md: '"contains," "is," and "is not." Select the appropriate condition. Enter the
    text for to search. Click ‘Add criterion’ to add more filter criteria. Use ‘Execute
    actions’ to determine if all or only some of the criteria must be met to apply
    the filter.


    In the lower part of the window, determine the action to take when the filter
    criteria are met. Messages can, for example, be moved or copied to a folder or
    assigned a special color. When moving or copying, select the destination folder
    by clicking. In the folder list that appears, select the folder. Use ''New'' to
    create a new folder. Click ''OK'' when the correct filter is selected. When finished
    creating the filter, click ''OK''.


    # Creating a Filter from a Message


    Select the message on to base the filter. Right-click and select ‘Create Rule
    From Message.’ Select the desired filter option. This opens the filter dialog
    with the correct criteria already selected. Add additional criteria if desired.
    Select the appropriate filter action. Click ‘OK’ when finished.


    # Applying Filters


    Filters are applied in the order listed in the dialog ‘Tools’ → ‘Filters’. Change
    the order by highlighting a filter and clicking ‘Up’ or ‘Down’. Click ‘OK’ to
    close the filter dialog when finished.


    Filters are applied to all new mail messages. They are not applied to mailready
    in your folders. To apply filters to messages already received, select the desired
    messages then select ‘Actions’ → ‘Apply Filters.


    # 16.4.7 Virtual Folders


    VForders are a unique feature of Evolution. A VFolder is a virtual folder that
    displays messages based on search or filter criteria. Rather than moving the messages
    into a folder, messages shown in a virtual folder remain in their original folder.
    Actions are applied to the message in the original folder.


    VForders are a useful means of reading new mail in once it has been sorted into
    a number of different directories or folders. For example, a VFolder could be
    created to search all your folders for unread email.


    To create a new virtual folder, select ‘Tools’ → ‘Virtual Editor.’ In the dialog,
    click ‘Add.’ Like filters, virtual folders can also be created from e-mail messages.
    Right-click the e-mail message, select ‘Create Rule from Message,’ and define
    the desired criteria.'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'Enter a ‘Rule Name’. For the new mail example mentioned above, set the criteria
    to ‘Status’ is not ‘Read’. Set the sources as desired. Other VFolder searches
    can be set similarly. Click ‘OK’ when finished. This returns to the virtual folder
    list. The order can be changed if desired. Click ‘OK’ to close it.


    The new VFolder is in the folder list under ‘Folders’. You can read, answer, and
    delete e-mail with the VFolder. However, deleting the message deletes it from
    the real folder in which it is stored, not just the VFolder.


    # 16.5 Calendar


    # 16.5.1 Adding Appointments


    To add a new appointment to your calendar, click ‘New Appointment’. Under the
    ‘Appointment’ tab, enter the details for the appointment. Select a category, if
    desired, to searching and sorting list. Optionally set for Evolution to provide
    a reminder before your appointment under the ‘Reminder’. If the appointment occurs
    regularly, set that under ‘Recurrence’. Click ‘Save and Close’ after all settings
    are made. The new appointment is then shown in your calendar.


    # 16.5.2 Scheduling a Meeting


    To schedule a meeting with other people, click ‘New Appointment’ then select ‘Actions’
    → ‘Schedule Meeting’. Enter information for an appointment. Under ‘Meeting’, add
    attendees. For those in ‘Contacts’, click ‘Invite Others..’ and select attendees
    from the dialog. When finished, click ‘Save and Close’. The attendees will be
    sent an e-mail about the scheduled meeting.


    This system can also be used to schedule a time that fits all attendees or to
    reserve resources. For more information about the scheduling functions, refer
    to the internal help.


    # 16.5.3 Adding Tasks


    Evolution helps to keep track of your tasks. To add a new task to your list, click
    ‘New Task’. Enter summary information, due start dates, and a description. Enter
    task status and other information under ‘Details’. Click ‘Save and Close’ to add
    the task to your list. Double-click the task to reopen the dialog and make changes
    or mark it as completed.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 16.6 Contacts


    # 16.6.1 Adding Contacts


    Along with the name and e-mail address, Evolution can store other address and
    contact information about a person. The e-mail address of a sender can quickly
    be added by right-clicking the marked address in the message preview. Select ''Add
    to Contacts'' and confirm the inclusion in the following pop-up. To enter more
    information, click ''Edit Full'' to open the contact editor. Otherwise, click
    ''OK’. If you have selected ''Edit Full’, click ''Save and Close'' to exit the
    contact editor when you are finished.


    To enter a completely new contact, click ''New Contact'' in the ''Contacts'' view.
    Enter all desired contact information. Click ''Save and Close'' when finished.


    # 16.6.2 Making a List


    If you frequently send e-mail messages to a group of people, make this easier
    by creating a list. Click ''New'' → ''Contact List'' in the ''Contacts'' view.
    The contact list editor opens. Enter a name for the list. Add addresses by typing
    the address in the box and clicking ''Add'' or dragging contacts from the ''Contacts''
    view and dropping them in the box. Toggle ''Hide addresses'' to select whether
    the recipients can see who has received the mail. Click ''Save and Close'' when
    finished. The list is now one of your contacts and appears in the composition
    window after the first few letters are typed.


    # 16.6.3 Sharing Contacts


    To send contact information from your address to another Evolution user, right-click
    the contact to forward. Select ''Forward Contact''. This sends the contact ''card''
    as an attachment in an e-mail. Compose and send this message as usual. To add
    a contact you have been sent, go to the contact in the e-mail message and click
    ''Save in addressbook'' to add the complete contact card to your address book.


    # 16.7 Public Address Books in Evolution


    By means of the LDAP protocol, Evolution can access public address books, such
    as those used by SuSE Linux Openexchange Server or Microsoft Exchange.'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'Evolution offers full access to these address books — it can read them and
    add new entries. Accordingly, if you use SuSE Linux in a large network (e.g.,
    in your company), do not hesitate to make use of this possibility.


    > Some specific information about your network is required for configuring LDAP
    access. Obtain this information from the responsible system administrator.


    To configure access to an LDAP server from your workstation, select ''Tools''
    → ''Settings'' → ''Directory Servers''. All previously configured LDAP accesses
    are listed in the however. Click ''Add'' to add a new LDAP access. A configuration
    assistant starts, helping configure the LDAP access in a few steps. Exit the welcome
    screen of the assistant with ''Next'' and specify the following settings in dialogs:


    **Server Information** Enter the server name and the login method for the LDAP
    server. The default method is anonymous access.


    **Connecting to the Server** Enter the port number and the security protocols
    (SSL or TLS) to use.


    **Searching the Directory** Enter the base search, the search range, the search
    duration and, possibly, a limitation of the displayed hits.


    **Display Name** In this last step, enter the name under which the selected server
    appears in the list. Close the assistant with ''Next'' and ''Finish''.


    Upon completion of the configuration, the new LDAP server appears in your contact
    list under ''Other Contacts'' and can be browsed for any entries.


    # 16.8 More Information


    Evolution offers extensive internal help pages. For the ''Help'' menu to access
    this information. For more information about Evolution, refer to Xian''s web site
    at http://www.ximian.com.'
  merge: -1
  pgno: 286
