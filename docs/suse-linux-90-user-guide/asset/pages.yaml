  md: '# Help and Documentation


    SuSE Help Center provides central access to the most important documentation resources
    on your system in searchable form. These resources include all manuals enclosed
    with your product, online help for the installed applications, and databases on
    hardware and software issues in connection with SuSE Linux.


    # A.1 Using the SuSE Help Center


    When you start the SuSE Help Center for the first time from the main menu (''SuSE
    Help''), the standard view of the SuSE Help Center is displayed (Figure A.1 on
    the next page). The dialog window consists of three main areas:


    **Menu Bar and Toolbar** The menu bar provides the main editing, navigation, and
    configuration options. The ''File'' menu contains the option for printing the
    currently displayed content. With the ''Edit'' menu, access the search function.
    ''Go'' contains all navigation possibilities: ''Home'' (home page of the Help
    Center), ''Back'', ''Forward'', and ''Last Search Result''. With ''Settings''
    → ''Configure KDE Help Center'' → ''Search Index'', generate a search index for
    all selected information sources. The toolbar contains three navigation icons
    (forward, back, home) and a printer icon for printing the current contents.


    **Navigation Area with Tabs** The navigation area in the left part of the window
    provides an input field for a quick search in selected information sources. Details
    regarding the search and the configuration of the search function in the ''Search''
    tab are presented in Section The Search Function of the SuSE Help Center on page
    393. The ''Contents'' tab presents a tree view of all available and currently
    installed sources. Click the book icons to open and browse the individual categories.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# View Window

    The view window always displays the currently selected con- tents, such as online
    manuals, search results, or web pages.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_411_0.png)


    Figure A.1: The Main Window of the SuSE Help Center


    # A.2 Contents of the SuSE Help Center


    The SuSE Help Center bundles useful information from various sources. It con-tains
    special documentation for SuSE Linux (User Guide and Administration Guide), all
    available information sources for your workstation environment, online help for
    the installed programs, and help texts for other applications. Furthermore, the
    SuSE Help Center provides access to SuSE''s online databases that cover special
    hardware and software issues in connection with SuSE Linux. All these sources
    can be searched comfortably once a search index has been gener-ated.'
