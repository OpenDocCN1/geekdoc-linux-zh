  md: '# Troubleshooting


    If there is some kind of error in the communication between the computer and the
    printer, the printer may no longer be able to interpret data correctly. This can
    cause the output to be garbled and use up large amounts of paper.


    +   1. To stop the printing, take out all paper or open the paper trays.

    2. As the print job will be removed from the printer queue only after having been
    sent completely to the printer, it will usually still be there. Even a reboot
    will not remove it. To delete the print job, use a tool like kprinter. Instructions
    for managing print jobs from the command line are provided in the Administration
    Guide.

    3. It is possible that some data is still transmitted to the printer even though
    the print job has been deleted from the queue. To stop all processes using the
    printer device, use the fuser command. For a printer connected to the parallel
    port, enter:


    ```

    fuser -k /dev/lp0

    ```


    To achieve the same for a USB printer, enter:


    ```

    fuser -k /dev/usb/0

    ```


    +   4. Do a complete reset of the printer by switching it off. Wait a few seconds
    before putting the paper back into the trays and switching the device back on.
    The printer should now be ready to accept new jobs.


    # For More Information


    Details about the Linux printing systems are provided in the Chapter Printer Operation
    in the Administration Guide, which should already be installed on your system.
    To read the manual, start SuSE Help and click Administration Guide. The PDF file
    is also available in /usr/share/doc/packages/suselinux-reference_en and can be
    opened with a browser.


    The-mentioned chapter in the Administration Guide discusses printing issues and
    solutions in general terms. For more specific problems and troubleshooting hints,
    consult the Support Database.


    If you have problems with your printer, check the Support Database articles Installing
    a Printer and Printer Configuration with SuSE Linux 9.0 and Later, which you can
    find by searching for the keyword "installation" or online at: http://sdb.suse.de/de/sdb/html/jsmeix_print-einrichten.html'
