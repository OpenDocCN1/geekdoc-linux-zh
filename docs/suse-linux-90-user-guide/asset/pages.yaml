    Click ‘Finish’ to exit the mail configuration.


    # 3.6.8 Network Services (inetd)


    This tool allows you to determine which network services (such as telnet, finger,
    talk, and ftp) should start when those Linux boots. These services enable hosts
    to connect to your computer. You can also configure various parameters for each
    service. By default, the master service that manages the individual services (inetd
    or xinetd) is not started.


    When this module starts, choose which of the services to configure. The selected
    daemon can be started with a standard selection of network services.'
