  md: '# 20.1 Creating a Data CD


    Creating a data CD is easy. Go to ''File'' → ''New Project'' → ''New Data Project''.
    The project view will appears in the lower part of the window, as shown in Figure
    20.1. Drag the directories or individual files from your home directory to the
    project folder and drop them there. Save the project under a name of your choice
    with ''File'' → ''Save as''.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_337_0.png)


    > Figure 20.1: K3b: Creating a New Data CD


    Then select ''Burn'' from the toolbar. A dialog with five tabs offering various
    options for writing the CD will be opened (Figure 20.2 on page 320).


    # 20.2 Burning CDs


    The detected writer is displayed under ''Device'' in the burning dialog. Set the
    burning speed in ''Burning Speed''.


    The following options are offered here:


    **''Mode''** This option determines how the laser writes a CD. (disk at once mode),
    the laser is never deactivated as long as the CD is written. This mode is recommended
    for the creation of audio CDs. However, it is'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'not supported by all CD writers. In the TAO mode (track at one), a separate
    write process is applied for every individual track. The RAW mode is not used
    very often, as the writer does not perform any data corrections. The best setting
    is ‘automatic’, as allows K3b to use the most suitable settings.


    Simulate’ This function can be used to check if your system supports the selected
    writing. The writing will be performed with the laser deactivated system.


    On the fly’ Burns the desired data without first creating an image file (do not
    use this feature on low-performance machines). An image file — as ISO image —
    is a file containing the entire CD content that is subsequently written to the
    CD exactly as it is.


    Burnfree’ This option was formally known as burn-proof. It helps to avoid buffer
    underruns. If burnfree is selected, the CD writer will mark the current position
    and return here in the event of a buffer underrun. However, this causes small
    data gaps which are audible in audio CDs. Therefore, select a suitable burning
    speed in order to avoid buffer underruns.


    Create Image Only’ This option creates an image file. You can determine the path
    for this file under ‘Temporary File’. The image file can be written to CD at a
    later time. To use this, ‘Tools’ → ‘Write ISO Image’. If this options are used,
    all other options in this section will be deactivated.


    The ‘Settings’ tab features options needed for the creation of CDs with multiple
    data or audio tracks (multi-session CDs).


    In the ‘Name of Media’ tab, you can specify a name, description, publisher, and
    other details for the CD.


    Under ‘File system’, you can specify settings for the file system on the CD (RockRidge,
    Joliet, UDF) and determine how symbolic links, file permissions and blanks are
    treated.


    Finally, the ‘Advanced’ tab enables advanced users to specify additional settings.


    # 20.3 Creating an Audio CD


    Basically, there are no significant differences between creating an audio CD and
    creating a data CD. Select ‘File’ → ‘New Audio Project’. Drag and drop the individual
    audio tracks to the project folder with the left mouse button. The audio'
  merge: -1
  pgno: 338
- img_proc: true
  md: '![](img/024a6c3adc868dbb714281f5a6285cf8_339_0.png)


    data must be in MP3, WAV, or O Vorbis format. The sequence of the tracks can be
    determined by moving them up or down in the project folder. The dialog for burning
    an audio CD is not very different from the dialog for burning a data CD. However,
    the option ''Disc at once'' and the ''Track at once'' mode bear greater importance.
    The ''Track at once'' mode inserts an intermission of two seconds after each track.


    Figure 20.2: Burning CDs with K3b


    # 20.4 Copying a CD


    Select ''Copy CD'' from the toolbar, specify the settings for the reading and
    writing device as shown in Figure 20.3 on the next page. The options introduced
    above are also available here. An additional function enables the creation of
    several copies of the CD.


    # 20.5 Writing ISO Images


    If you already have an ISO image, go to ''Tools'' → ''Write ISO Image'' A window
    will open, enabling you to enter the location of the ''Image to Write''. K3b will'
  merge: -1
  pgno: 339
- img_proc: true
  md: '![](img/024a6c3adc868dbb714281f5a6285cf8_340_0.png)


    Figure 20.3: K3b: Copying a CD


    calculate a check sum and display it in ''MD5 Sum''. If the ISO file was downloaded
    from the Internet, this sum shows if the download was successful.

    Use the ''Options'' and ''Advanced'' tabs to set your preferences. To burn the
    CD, click ''Write''.


    # 20.6 For More Information


    Apart from the two main functions described above, K3b offers other functions
    such as the creation of DVD copies, reading audio data in WAV format, rewriting
    CDs, or the integrated audio player. A detailed description of all available program
    features is available at http://k3b.sourceforge.net.'
