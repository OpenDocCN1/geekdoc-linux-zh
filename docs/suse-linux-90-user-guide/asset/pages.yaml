  md: '# 4.4.2 The Download Manager KGet


    KGet is the download manager for KDE, similar to GetRight or Golzilla. With KGet,
    you manage your transfers in a window. You can stop, resume, delete, and queue
    transfers and add new transfers.


    # Adding Transfers


    Start KGet by pressing (Alt) + (F2) to enter the command kget. When the program
    is started for the first time, a dialog will be displayed. Confirm this dialog
    to integrate KGet in Konqueror. When you close the dialog, KGet will be integrated
    into the system tray of the panel as an icon with a downward arrow.


    Click on this arrow to open the dialog displaying your transfers. To add transfer
    to the list, select the menu item ''File'' → ''Paste''. A dialog will open. Enter
    a URL in the input field and confirm with ''OK''. Then specify the location for
    saving the downloaded file. After all information has been entered, the entry
    for transfer will be added to the main window of KGet and started.


    Another way to add a transfer is by means of drag and drop. Simply drag a file
    (e.g., from an FTP server) from Konqueror and drop in the main window.


    # Timer-Controlled Transfers


    You can instruct KGet to perform your transfers at a specific time. Activate the
    menu item ''Options'' → ''Offline Mode''. All transfers you insert from this point
    will not be started immediately but queued. To start the timer, doubleclick the
    respective entry. A dialog will open. Select ''Advanced'' for timing the transfer.
    Enter the day, month, and year. Then close the window.


    After you have specified the timer settings for all your transfers, set KGet back
    to the online mode by deactivating the menu item ''Options'' → ''Offline Mode''.
    The transfers should start at the specified times.


    # Settings


    In the menu ''Settings'' → ''Configure KGet ...'', you can set preferences for
    the connection, determine directories for specific file extensions, and specify
    other settings.


