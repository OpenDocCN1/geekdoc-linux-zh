  md: '# Digital Cameras and Linux


    The application gphoto2 is an extremely convenient program for managing digital
    photographs in Linux. gPhoto 2.0 is a command-line program. It is compatible with
    several graphical interfaces (front-ends), including gtKam, Konqueror, Kamera,
    and GnoCam. This chapter covers the use of gtKam, Konqueror, and Digikam.


    +   21.1 Connecting to the Camera . . . . . . . . . . . . . . . . . . 324

    21.2 Installing the Programs . . . . . . . . . . . . . . . . . . 324

    21.3 Using Konqueror . . . . . . . . . . . . . . . . . . . . 324

    21.4 Using gtKam . . . . . . . . . . . . . . . . . . . . . . 325

    21.5 Using Digikam . . . . . . . . . . . . . . . . . . . . . . . 327

    21.6 For More Information . . . . . . . . . . . . . . . . . . 327'
  merge: -1
  pgno: 342
- img_proc: true
  md: '> Tip A comprehensive list of supported cameras is available at http://www.photo.org/cameras.html.
    If gphoto2 is installed, retrieve the list with the command gphoto2 --list-cameras.
    gphoto2 --help provides information about the available commands in the command-line
    interface.


    # 21.1 Connecting to the Camera


    The fastest and most convenient way to connect digital cameras to the computer
    is USB, provided the kernel, the camera, and the computer support USB. The standard
    SuSE kernel provides this support. A suitable cable is also required.


    > Note Using the USB connection can quickly drain your camera''s batteries. Consider
    using a power adapter.


    Simply connect the camera to the USB port and turn on the camera. You may need
    to switch your camera to a special data transfer mode. For this procedure, consult
    the manual of your digital camera.


    # 21.2 Installing the Programs


    Use YaST to install the gtikam package. The other required packages are selected
    automatically. Digikam is included in the default installation. If it is not installed,
    use YaST to install it, if desired. For more information about installing packages
    with YaST, refer to Section Installing and Removing Software on page 51.


    # 21.3 Using Konqueror


    KDE users can easily access digital cameras by means of the familiar Konqueror
    interface. Connect your camera to the USB port. A camera icon should appear on
    the desktop. Click this icon to open the camera in Konqueror. The camera can also
    be accessed by entering the URL camera: / in Konqueror. Navigate'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'through the camera''s directory structure until the files are shown. Use the
    usual Konqueror file management features to copy the files as desired. More information
    about using Konqueror is available in Chapter The Web Browser Konqueror on page
    219.


    # 21.4 Using gtKam


    gtKam is a graphical interface for downloading and deleting pictures from the
    digital camera. To adjust or edit your pictures, use The GIMP as described in
    Chapter Graphics with The GIMP on page 335.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_344_0.png)


    Figure 21.1: The Main Window of gtKam


    Connect your camera to the appropriate port and turn on the camera. Start gtKam
    with the command gt kam &. From the menu, select ''Camera'' → Select Camera...''.
    In the dialog that opens, select the camera model or use ''Detect''. Select the
    appropriate port if the detection fails.


    The main gtKam window is divided into three sections — the menu and toolbars,
    the left pane with index settings and camera directory selection, and the right
    pane for displaying an index listing with or without thumbnails. The icons in
    the toolbar provide the main functions needed. The disk icon saves the selected
    images. The trash icon deletes them. The icon with the arrows loads the image
    index displayed in the right pane. The icon with the paper and pencil opens the
    camera configuration options. The door icon exits the program.


    Your camera should be listed in the left pane. Use the plus sign (+) to the left
    to expand the tree display of the directory structure. Your exact directory structure
    depends on the camera type and model. Continue expanding until'
  merge: -1
