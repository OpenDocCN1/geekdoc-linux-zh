    # Multihead


    If you have installed more than one graphics card in your computer or a graphics
    card with multiple outputs, you can connect more than one screen to your system.
    If you operate two screens, this is referred to as “dualhead”. More than two is
    referred to as “multhead”. SoX2 automatically detects multiple graphics cards
    in the system and prepares the configuration accordingly. Set the multihead mode
    and the arrangement of the screens in the multhead dialog. Three modes are offered:
    ‘Traditional’ (default), ‘One screen (Xinerama), and ‘Clone mode’.


    +   * Traditional multihead — Each monitor represents an individual unit. The
    mouse pointer can switch between the screens.

    * ‘Cloned multihead’ — In this mode, all monitors display the same content. The
    mouse is only visible on the main screen.

    * ‘Xinerama multihead’ — All screens combine to form a single large screen. Program
    windows can be positioned freely on all screens or scaled to a size that fills
    more than one monitor.


    78 3.4. Hardware'
