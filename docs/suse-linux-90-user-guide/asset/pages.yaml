    the JACK mode, PCM modules are automatically converted to JACK modules (and vice
    versa). Separate ports are generated for each JACK module. AlsaModularSynth only
    appears in the lists of QJackConnect if at least one JACK module exists.


    The directory usr/share/doc/packages/alsamodular contains example patches that
    demonstrate the various possibilities. Detailed documentation is available in
    the subdirectory html.


    # 18.11.1 Randomly Playing Patches


    A quick overview of some of the sound possibilities is provided by the patches
