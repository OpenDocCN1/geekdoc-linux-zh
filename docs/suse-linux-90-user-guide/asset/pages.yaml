  md: 'When the package manager is started, it examines the system and displays installed
    packages. If you select additional packages for installation, the package manager
    automatically checks the dependencies and selects any other needed packages (resolution
    of dependencies). If you knowingly select conflicting packages, the package manager
    indicates this and suggests solutions for the problem (resolution of conflicts).
    If a package needed by other installed packages is accidentally marked for deletion,
    the package manager alerts you with detailed information and alternative solutions.


    Apart from these purely technical aspects, the package manager provides a well-structured
    overview of the range of packages in SuSE Linux. The packages are arranged by
    subjects and the density of these groups is restricted by means of suitable filters.
    Thus, the package manager facilitates the management of software packages and
    is a valuable tool for maintaining your system.


