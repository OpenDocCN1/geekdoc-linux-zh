    # 3.4.3 Hard Disk Controller


    Normally YaST configures the hard disk controller of your system during the installation.
    If you add controllers, integrate these into the system with YaST module. You
    can also modify the existing configuration, but this is generally not necessary.


    The dialog presents a list of detected hard disk controllers and enables the assignment
    of the suitable kernel module with specific parameters. Use ''Test Loading of
    Module'' to check if the current settings work before they are saved permanently
    in the system.


    > Caution

    This is an expert tool. Do not modify the settings unless you know what you are
    doing. Your system may no longer boot if you specify incorrect settings. In any
    case, you should make use of the test option.


    # 3.4.4 Graphics Card and Monitor (SaX2)


    The graphical interface, or X server, handles the communication between hardware
    and software. Desktops, like KDE and GNOME, and the wide variety of window managers
    use the X server for interaction with the user.


    The graphical interface is initially configured during installation. To change
    the settings afterwards, run this YaST module. In the configuration dialog, choose
    between ''Test mode only'' and the graphical user interface. The current settings
    are saved and you can reset them at any time. The current values are displayed
