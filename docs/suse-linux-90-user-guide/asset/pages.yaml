    # # Note


    By default, the Windows versions NT, 2000, and XP use the NTFS file system. Unlike
    FAT file systems, NTFS file systems can (currently) only be read from Linux. Therefore,
    you can read your Windows files from Linux, but you cannot edit them. If you want
    to write access to your Windows data and do not need the NTFS file system, you
    can install Windows anew on a FAT32 file system. In this case, you will have full
