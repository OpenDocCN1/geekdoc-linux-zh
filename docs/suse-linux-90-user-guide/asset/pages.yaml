  md: '# 24.2.4 Specifying Paths


    When working with files or directories, it is important specify the correct path.
    However, you do not need to enter the entire (absolute) path from the root directory
    to the respective file. Rather, you can start from the current directory. Address
    your home directory directly with ~. Accordingly, there are two ways to list the
    file Testfile in the test directory: by entering the relative path with ls test/*
    or by specifying the absolute path with ls ~/test/.*


    To list the contents of home directories of other users, enter ls ~username. In
    the above-mentioned directory tree, one of the sample uses ls tux. Thus, the command
    ls ~t would list the contents of the home directory of tux.


    Refer to the current directory with a dot. The next higher level is represented
    by two dots. By entering ls .., see the contents of the parent directory of the
    current directory. The command ls ../ shows the contents of the directory two
    levels higher in the hierarchy.


    # Second Example: Working with Paths


    Here is another example to illustrate how to move around in the directories of
    your SU Linux system.


    +   - Change into your home directory with the command cd. Then create a directory
    in it with the name test2 by entering mkdir test2.

    - Change into the new directory with cd test2 and create a sub उभ in it with the
    name subdirectory. To change into it, use the expansion function: enter cd su
    press Tab. The shell will expand the rest of the directory name.

    - Now try to move the previously created file Testbackup into the current directory
    (subdirectory) without changing the directory again. To achieve this, specify
    the relative path to that file: mv ../test/Testbackup .. The dot at the end of
    this command is required to tell the shell that the current directory is the destination
    to which to move the file .. , in this example, refers to your home directory.


    # 24.2.5 Wild Cards


    Another convenience offered by the shell is wild cards. There are four different
    types of these in Bash:'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# 24


    ? Matches exactly one arbitrary character


    * Matches an arbitrary number of characters


    [set] Matches one of the characters from the group specified inside square brackets,
    which is represented here by the string "set"


    [!!] Matches one other character than those identified by "set"


    Assuming your test directory contains the files Testfile, Testfile, Testfile2,
    and datafile, the ls Testfile? will list the files Testfile1 and Testfile2. With
    ls Test*, the list will also include files.


    The command ls *file. Finally, you can use the set wild to address all sample
    files whose last character is a number: ls Testfile[1-9].


    Among the four types of wild cards, the most inclusive one is the asterisk. It
    could be to copy all files contained in one directory to another one or to delete
    all files with one command. The command rm *fil*, for instance, would delete all
    files in the current directory whose name includes the string "fil".


    # 24.2.6 More Less


    Linux includes two small programs for viewing text directly in the shell. Rather
    than starting an editor to read a file like Readme.txt, simply enter less Readme.txt
    to display the text in the console window. Use Space to scroll down the page.
    Use Page and Page to move forward or backward in the text. To exit less, press
    Q.


    The program less got its name from the precept that "less is more" and can also
    be used to view the output of commands in a convenient way. To see how this works,
    read Section Pipes on this page.


    Instead of less, you can also use the older program more. However, it is less
    convenient because it does not allow you to scroll backwards.


    # 24.2.7 Pipes


    Normally, the standard output in your shell is the console window, and the standard
    input is the keyboard. To forward the output of a command to an application such
    as less, use a "pipeline".


    Working with the Shell'
