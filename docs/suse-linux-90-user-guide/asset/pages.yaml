    In this case, you do not need this module.


    # Connection Type


    If you want to specify your mail settings with YaST, specify the desired type
    of connection to the Internet in the first dialog of the e-mail configuration
    module. Choose one of the following options:


    +   ‘Permanent’ Select this option if you have a dedicated line to the Internet.
