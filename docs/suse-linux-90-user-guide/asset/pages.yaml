    You can share your desktop for other users on their hosts. Desktop sharing makes
    use of the RFB protocol, more commonly referred to as VNC. This feature enables
    a Linux desktop to be made available for clients using other operating systems,
    provided they support VNC.


    To grant trustworthy users access to your desktop, send them a password. This
    can be done by means of an invitation. Start the Control Center from the main
    menu and select the ''Desktop Sharing'' in the ''Internet & Network'' module.

    Click ''Create & manage invitations'' and choose from ''Create Personal Invitation...''
    and ''Invite via Email''. If you click ''Create Personal Invitation...'', an invitation
    indicating the IP address of the host, password, and expiry of the invitation
    will be generated. You have to send this manually to the respective person. If
    you click ''Invite via Email'', all required data is transmitted by e-mail. KMail
    starts automatically and generates an e-mail message with the needed data (host,
    password, and expiry). At the end of the e-mail, a link, which the recipient of
    the message needs to click to view your desktop in a browser, is provided. Simply
    enter the e-mail address of the recipient and modify the standard text, then send
    the message. Refer to Figure 4.8.


    Use ''Delete All...'' to revoke all invitations. To delete an individual invitation,
    select it then click ''Delete...''


    If an invited person requests a connection, KDE informs you about this request.
    Decide to accept or deny the connection. If you accept the connection, also use
    the check box to release the keyboard and mouse control. For security reasons,
    the maximum duration for a connection is one hour.


    To change the default settings, start the ''Control Center'' via ''Settings''
    in the main menu. In the left frame, select ''Internet & Network'' → ''Desktop
    Sharing''. Various configuration options are available in the lower part of the
    window. However, for security reasons you should not modify the default settings.'
  merge: -1
