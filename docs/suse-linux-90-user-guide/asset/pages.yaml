    The restore module, shown in Figure 3.28 on the next page, enables restoration
    of your system from a backup archive. Follow the instructions in YaST. Press ''Next''
    to proceed to the individual dialogs. First, specify where the archives are located
    (removable media, local hard disks, or network file systems). As you continue,
    a description and the contents of the individual archives are displayed, enabling
    you to decide what to restore from the archives.


    Additionally, there are two dialogs for uninstalling packages that were added
    since the last backup and for the renewed installation of packages that were deleted
    since the last backup. These two steps enable you to restore the exact system
    state at the time of the last backup.


    > Caution

    As this module normally installs, replaces, or uninstalls many packages and files,
    use it only if you have experience with backups, otherwise you may lose data.'
