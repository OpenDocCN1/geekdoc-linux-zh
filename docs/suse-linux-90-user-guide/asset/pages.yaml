    22.4 The Menus . . . . . . . . . . . . . . . . . . . . . . . . 331

    22.5 The Gallery . . . . . . . . . . . . . . . . . . . . . . . 332

    22.6 Optical Character Recognition . . . . . . . . . . . 334'
  merge: -1
