    +   - outbox: Messages to send are stored here.


    +   - sent-mail: Copies of all e-mails are stored here.


    +   - trash: Stores deleted e-mails.


    Using ''Folder'' -> ''New Folder'', you can create additional folders for organizing
    your e-mail messages. Enter the name of the new folder in the dialog that opens
    (see Figure 15.3 on the following page). To create a subfolder, select the parent
