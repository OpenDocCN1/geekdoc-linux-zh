- img_proc: true
  md: 'The layout of a multihead environment describes the arrangement of and the
    relationship between the individual screens. By default, SaX2 configures a standard
    layout that follows the sequence of the detected graphics cards, arranging all
    screens in a row from left to right. In the ''Layout'' dialog of the multihead
    tool, determine the way the monitors are arranged by using the mouse to move the
    screens in the grid.


    After you have completed the layout dialog, verify the new configuration by clicking
    ''Test''.


    Linux currently does not offer 3D support for Xinerama multihead environments.
    In this case, SaX2 activates the 3D support.


    # Input Devices


    +   Mouse If the mouse already works, you do not need to do anything. However,
    if the mouse does not work, control it with the number pad of the keyboard as
    described in Section AccessX on the following page.


    +   If the automatic detection fails, use this dialog to configure your mouse
    manually. Refer to the documentation of your mouse for a description of the model.
    Select your model from the list of supported mouse types and confirm by pressing
    on the number pad.


    +   Keyboard Use the selection field at the top of this dialog to identify the
    kind of keyboard to use. Select the language for the keyboard layout (the country-specific
    position of the keys). Use the test field to check if special characters are displayed
    correctly.


    The status of the check box used for activating and deactivating the entry of
    accented letters depends on the respective language and does not need to be changed.
    Click ''Finish'' to apply the new settings to your system.


    Touchscreen Currently, XFree86 only supports Microtouch and Elo TouchSystems.
    SaX2 can only autodetect the monitor, not the touchscreens. The touchscreen is
    treated as an input device.


    +   1. To configure the touch, start SaX2 and select ''Input devices'' -> ''Touchscreens''.

    2. Click ''Add'' and add a touchscreen.

    3. Save the configuration by clicking ''Finish''. You do not need to test the
    configuration.


    Touchscreens feature a variety of options and usually must be calibrated first.
    Unfortunately, there is no general tool for this purpose in Linux. The standard
    configuration contains suitable default values for the dimensions of the touchscreen.
    Normally, no additional configuration is required.'
