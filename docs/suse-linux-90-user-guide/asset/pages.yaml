    # 24.3 Users and Access Permissions


    Since its inception in the early 1990s, Linux has been developed as a multiuser
    system. Any number of users can work on it simultaneously. This resulted in some
    notable distinctions from the Microsoft end-user Windows operating systems.


    The most important distinguishing feature is the necessity for users to log in
    to the system before starting a session at their workstation. Each user has a
    user name with a corresponding password. This differentiation of users guarantees
    that unauthorized users cannot see files for which they do not have permission.
    Larger changes to the system, such as installing new programs, are also impossible
    or restricted for normal users. The root user, or “super user”, has the unrestricted
    capacity to make changes to the system and has unlimited access to all files.
    Those who use this wisely, logging in with full root access when necessary, can
    cut back the risk of unintentional loss of data. Because under normal circumstances
    only the super user can delete system files or format hard disks, the threat from
    “Trojan horse effect” or from accidentally entering destructive commands can be
    significantly reduced.


    # 24.3.1 File System Permissions


    Basically, every file in a Linux file system belongs to a user and a group. Both
    of these proprietary groups and all others can be authorized to write, read, or
    execute these files.'
  merge: -1
  pgno: 381
- img_proc: true
  md: 'A group, in this case, can be defined as a set of connected users with certain
    collective rights. For example, call a group working on a certain project project3.
    Every user in a Linux system is a member of at least one proprietary group, normally
    users. There can be as many groups in a system as needed, but only root is to
    add groups. Every user can find out, with the command groups, of which he is a
    member.


    # File Access The organization of permissions in the file system differs for files
    and directories. File permission information can be displayed with the command
    ls -l. The output could appear as in Output 1.


    ```

    -rw-r----- 1 tux project3 14197 Jun 21 15:03 Roadmap

    Output 1: Sample Output Showing File Permissions

    ```


    As shown in the third column, this file belongs to user tux. It is assigned to
    the group project3. To discover the user permissions of the Roadmap file, the
    first column must be examined more closely.


    +   - rw- r-- -- Type Users Permissions Group Permissions For Others


    This column is comprised of one leading character followed by nine characters.
    The first of the ten letters stands for the type of file system component. The
    dash (-) shows that this is a file. A directory (d), a link (l), a block device
    (b), or a character device could also be indicated.


    The next three blocks follow a standard pattern. The first three characters refer
    to whether the file is readable (r) or not (-). A w in the middle symbolizes that
    the corresponding object can be edited and a dash (-) means it is not possible
    to write to the file. An x in the third position notes that the object can be
    executed. Because the file in this example is a text file and not one that is
    executable, executable access for this particular file is not needed.


    In our example, tux, as owner of the file Roadmap, read (r) and write (w) to it,
    but cannot execute (x). The members of the group project3 can read the file, but
    they cannot modify or execute it. Other users do not have access to this file.
    Other permissions can be assigned by means of ACLs (Access Control Lists). See
    Section Access Control Lists on page 367 for details and refer to the chapter
    Access Control Lists in Linux in the Administration Guide for background information.'
  merge: -1
  pgno: 382
- img_proc: true
  md: '# Directory Permissions Access permissions for directories have the type d.
    For directories, the individual permissions have a slightly different meaning.


    ```

    drwxrwxr-x 1 tux project3 35 Jun 21 15:15 ProjectData

    ```


    Output 2: Sample Output Showing Directory Permissions


    In Output 2, the owner (tux) and the owner group (project3) of the directory ProjectData
    are easy to recognize. In contrast to the file access permissions from File System
    Permissions on the preceding page , the set reading permissions (r) means that
    the contents of the directory can be shown. The write permission (w) means new
    files can be created. The executable permission (x) means the user can change
    to this directory. In the above example, this means the user tux as well as the
    members of the group project3 can change to the ProjectData directory (x), view
    the contents (r), and add new files to it (w). The rest of the users, on the other
    hand, are given less access. They may enter the directory (x) and browse through
    it (r), but not insert any new files (w).


    # 24.3.2 Modifying File Permissions


    Changing Access Permissions The access permissions of a file or directory can
    be changed by the owner and, of course, together with the command chmod, which
    must be entered with the parameters specifying the changes and the names of the
    respective files. Both parameters are comprised of


    +   the categories concerned

    * u (user) — owner of the file

    * g (group) — group that owns the file

    * o (others) — additional users (if no parameter is given, the changes apply to
    all categories)


    +   a character for deletion (-), setting (=), or insertion (+)


    +   the abbreviations

    * r — read

    * w — write

    * x — execute


    +   file name or names separated by spaces'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'If, for example, the user tux in the example File System Permissions on the
    preceding page also wants to grant other users (w) access to the directory ProjectData,
    he can do this using the command: chmod +w ProjectData.


    If, however, he wants to deny all users other than himself write permissions,
    enter chmod -w ProjectData. To prohibit all users from adding a new file to the
    folder ProjectData, enter chmod -w ProjectData. Now, not even the owner can write
    to the file without first reestablishing permissions.


    Changing Ownership Permissions Other important commands to control the ownership
    and permissions of the file system components are chown (change owner) and chgrp
    (change group). The command chown can be used to transfer ownership of a file
    to another user. However, only root is permitted to perform this.


    Suppose the file Roadmap should no longer belong to tux, but to the user geeko.
    The command root should enter chown geeko Roadmap.chgrp chown geeko Roadmap.


    chgrp changes the group ownership of a file. However, the owner of the file will
    be a member of the new group. In this way, the user from Output File System Permissions
    on page 363 can switch the group owning the file ProjectData to project4 with
    the command chgrp "project4 ProjectData, as long as he is a member of this new
    group.


    # 24.3.3 The setuid Bit


    In certain situations, the access permissions may be too restrictive. Therefore,
    Linux has additional settings that enable the temporary change of the current
    user and group identity for a specific action.


    For example, the cdrecord program normally requires root permissions to access
    the CD (or DVDs). Thus, a normal user would not be able to create CDs, as it would
    be too dangerous to grant all users direct access to all devices.


    A possible solution to this problem is the setuid mechanism. setuid (set user
    ID) is a special file attribute that instructs the system to execute programs
    marked accordingly under a specific user ID. Consider the cdrecord command:


    ```

    -rwxr-x-- 1 root 281356 2002-10-08 21:30 /usr/bin/cdrecord

    ```


    Set the setuid with the command chmod +s /usr/bin/cdrecord.'
  merge: -1
  pgno: 384
- img_proc: true
  md: 'Then, assign the cdrecord program to the group users with the command chgrp
    users /usr/bin/cdrecord.

    The following access permissions are granted:

    -rws--x-- 1 root users 281356 2002-10-08 21:30 /usr/bin/cdrecord


    By means of the setuid bit, all users belonging to the group users can use the
    program. In effect, this means that the program is executed as root.


    # Caution


    Setting the setuid bit for a program makes your computer more vulnerable to attacks.
    Do only this in exceptional cases when you know the program well and are aware
    of the potential risks.


    # 24.3.4 The setgid Bit


    The setuid attribute applies to users. However, there is also an equivalent property
    for groups — the setgid attribute. A program for which this attribute was set
    runs under the group ID under which it was saved, no matter which user starts
    it. Therefore, in a directory with the setgid bit, all newly created files and
    subdirectories are assigned to the group to which the directory belongs. Consider
    the following example directory:


    ```

    drwxwxrxr-- 2 root archive 48 Nov 19 17:12 backup

    ```


    Set the setuid bit with the command chmod g+s /test. Subsequently, the access
    permissions appear as follows:


    ```

    drwxwxrxr-- 2 root archive 48 Nov 19 17:12 backup

    ```


    # 24.3.5 The Sticky Bit


    Apart from the setuid and setgid bits, there is the “sticky bit”. It makes a difference
    whether it belongs to an executable program or a directory. If it belongs to a
    program, a file marked in this way will be loaded to the RAM to avoid getting
    it from the hard disk each time it is used. Nowadays, this attribute is used rarely,
    as modern hard disks are fast enough.


    If this attribute is assigned to a directory, it prevents users from deleting
    other''s files. Typical examples include the /tmp and /var/tmp directories:


    ```

    drwxrwxrwt 2 root root 1160 2002-11-19 17:15 /tmp

    ```'
  merge: -1
  pgno: 385
- img_proc: true
  md: '# 24.3.6 Access Control Lists


    The traditional permission concept for Linux file system objects, such as files
    or directories, can be expanded by means of ACLs (Access Control Lists). They
    allow the assignment of permissions to individual users or groups other than the
    original owner or owning group of a file system object.


    Files or directories bearing access permissions reveal themselves after the execution
    of a simple ls -l command:


    ```

    -rw-r-- 1 tux project3 14197 Jun 21 15:03 Roadmap

    ```


    The output of ls does not reveal much of a change compared to ls on a file without
    an ACL. Roadmap is owned by tux who belongs to the group project3. tux holds both
    write and read access to this file and his group as all other users have read
    access. The only difference that distinguishes this file from a file without an
    ACL is the additional + in the first column-holding permissions bits.


    Get details about the ACL by executing getfacl Roadmap:


    ```

    # file: Roadmap

    # owner: tux

    # group: project3

    user:rw-

    user:jane:effective:rw-

    group:r--

    group:django:rw-- effective:r--

    mask:r--nother:---

    ```


    The first three lines of the output do not hold any information available with
    ls -l. These only state file name, owner, and owning group. Lines 4 to 9 hold
    the ACLs. Conventional access permissions represent a subset of those possible
    when using ACLs. Our example ACL grant read and write access to the owner of the
    file as well as a user jane (lines 4 and 5). The conventional concept has been
    expanded allowing access to an extra user. The same applies to the handling of
    group access. The owning group holds read permissions (line 6) and the group django
    holds read and write permissions. The mask entry in line 8 reduces the effective
    permissions for the user jane and the group django to read access. Other users
    and groups do not get any kind of access to the file (line 9).


    Only very basic information has been provided here. Findfurther background information
    in Access Control Lists in Linux in the Administration Guide.'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# 24.4 Important Linux Commands


    This section gives insight into the most important commands of your SuSE Linux
    system. Along with the individual commands, parameters are listed and, where appropriate,
