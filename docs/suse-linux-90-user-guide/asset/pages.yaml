  md: '# Working with the Shell


    Graphical user interfaces are increasingly becoming important for Linux, but using
    the mouse is not always the best way to perform daily tasks. The command line
    readily provides high flexibility and efficiency. The first part of this chapter
    provides an introduction to the Bash shell. It is followed by an explanation of
    the user permissions concept in Linux and a list of the most important commands.
    The chapter closes with a description of the vi text editor.


    +   24.1 Introduction . . . . . . . . . . . . . . . . . . . . . . . . . 354

    24.2 Introduction to Bash . . . . . . . . . . . . . . . . . . . 354

    24.3 Users and Access Permissions . . . . . . . . . . . . 362

    24.4 Important Linux Commands . . . . . . . . . . . . . 368

    24.5 The vi Editor . . . . . . . . . . . . . . . . . . . . . . . . 375'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# 24.1 Introduction


    Text-based applications are especially important for controlling older Linux computers
    that do not have the resources for demanding display systems. Virtual consoles
    are used in this case. Six of them are available in text mode. Press `Alt+F1`
    through `Alt+F6`. The seventh console is reserved for X.


    # 24.2 Introduction to Bash


    In the KDE taskbar, there is an icon depicting a monitor with a seashell. When
    you click this icon with the mouse, a console window opens in which to enter commands.
    The console normally runs Bash (Bourne again shell), a program developed as part
    of the GNU project. It is, by far, the most widely used derivative of the Bourne
    shell (sh). Once you have opened the shell, see the prompt on the first line.
    The prompt usually consists of the user name, host name, and current path, can
    be customized. When the cursor is behind this prompt, you can send commands directly
    to your computer system: `tux $`


    # 24.2.1 Commands


    A command consists of several elements. The first element is always the actual
    command, followed by parameters or options. Commands are executed when you press
    `Enter`. Before doing so, easily edit the command line, add options, or correct
    typing errors. One of the most frequently used commands is `ls`, which can be
    used with or without arguments. Entering the plain `ls` command in the console
    shows the contents of the current directory.


    Options are prefixed with a hyphen. The `ls -l`, for instance, shows the contents
    of the same directory in full detail. Next to each file name, see the date when
    the file was created, the file size in bytes, and further details, which are covered.
    One very important option that exists for many commands is the `--help` option.
    Entering `ls --help`, display all the options for the `ls` command.


    Also use the `ls` command to view the contents of other directories. To do so,
    the directory must be specified as a parameter. For example, to see the contents
    of Desktop, enter `ls -l Desktop`.


    # 24.2.2 Files and Directories


    To use the shell efficiently, it is really useful to have some knowledge about
    the file and directory structures of a Linux system. You can think of directories
    as'
  merge: -1
  pgno: 373
- img_proc: true
  md: 'electronic folders where files, programs, and subdirectories are stored. The
    top level directory in the hierarchy is the root directory, referred to as /.
    This is the place from which all other directories can be accessed.


    The /home directory contains the directories in which the individual users can
    store their personal files. Figure 24.1 shows the standard directory tree in Linux,
    with the home directories of the example users xyz, linux, and tux. The directory
    of a Linux system has a functional structure that follows the “File System Standard”.
    The following list provides a brief description of the standard directories in
    Linux.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_374_0.png)


    Figure 24.1: Excerpt from a Standard Directory Tree


    +   / root directory, starting point of the directory tree.


    +   /home (private) directories of users.


    +   /dev device files that represent hardware components


    +   /etc important files for system configuration.


    +   /etc/init.d boot scripts


    +   /usr/bin generally accessible programs.


    +   /bin programs needed early in the boot process.


    +   /usr/sbin programs reserved for the system administrator.'
