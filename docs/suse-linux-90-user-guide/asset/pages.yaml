  md: '# 3.4.11 TV and Radio Cards


    After starting and initializing the YaST module, the ''TV and Radio Cards'' dialog
    appears. If your card was automatically detected, it is displayed at the top of
    the list. In this case, highlight the line with the mouse and select ''Configure''.


    If your card was not detected, select ''Other (not recognized)''. Press ''Configure''
    to proceed with the manual selection in which to select your card from the list
    of vendors and models.


    If you have already configured TV or radio cards, modify existing configurations
    with ''Change''. In this case, a dialog presents a list of all configured cards.
    Select a card and start the manual configuration with ''Edit''.


    During the automatic detection, YaST attempts to assign the correct tuner to your
    card. If you are not sure, simply keep the setting ''Default (recognized)'' and
    check whether it works. If you are not able to set all channels, this might be
    due to a failure of the automatic detection of the tuner type. In this case, click
    ''Select Tuner'' and highlight the correct tuner type in the list.


    If you are familiar with the technical details, you can use the expert dialog
    to specify settings for a TV or radio card. Select a kernel module and its parameters
    in this dialog. Also check all parameters of your TV card driver. To do this,
    select the respective parameters and enter the new value with ''Apply'' or restore
    the default values with ''Reset''.


    The dialog ''TV and Radio Cards, Audio'' enables you to connect your TV or radio
    card with the installed sound card. You must use a cable to connect the output
    of the TV or radio card with the external audio input of the sound card. This
    only works if the sound card is already configured and the external input is active.
    If you have not configured your sound card, select ''Configure Sound Card'' to
    go to the respective dialog (see Section Sound on page 85).


    If your TV or radio card has loudspeaker jacks, you can also connect the loudspeakers
    directly without configuring the sound card. There are also TV cards without any
    sound function, which do not require an audio configuration (e.g., for CCD cameras).


    # 3.5 Network Devices


    # 3.5.1 Basic Information about Internet Access


    This section explains a number of important terms in connection with Internet
    access, briefly introducing their aim and function.'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'All the machines connected to the Internet forms a large network in which various
    operating systems run with different hardware. The Internet uses a standard communication
    protocol that can be understood regardless of the hardware or software used. This
    is made possible by means of the Internet Protocol (IP) toogether with the Transmission
    Control Protocol (TCP), the User Datagram Protocol (UDP), and the Internet Control
    Message Protocol (ICMP). These protocols comprise the common "language" used by
    all machines on the Internet. The abbreviation for this is TCP/IP.


    Every machine on the Internet has an ID number - the IP address. It can only be
    addressed by TCP/IP or with its name. Normally, a machine also has a text name.
    The Domain Name System (DNS) is responsible for converting the IP address to a
    text name. This particular service is offered by many servers. A machine or application
    offering a service is called a server (for, a DNS server) or a machine or application
    making use of a service is called a client.


    Under TCP/IP, there are various standardized protocols for forwarding appropriate
    TCP/IP data transfers to the given transmission method. For network connections
    via a network card, the ethernet protocol is used. For modern and SDN telephone
    connections, it is the Point-to-Point Protocol (PPP). For ADSL and T-DSL connections,
    the Point-to-Point over Ethernet Protocol (PPPoE)


    To establish an Internet connection, the ethernet, PPP, or PPPoE connection between
    your host and a host of the Internet provider must be established. Then the TCP/IP
    connection must be established.


    On top of TCP/IP, there are various standardized protocols for proper data transfer
    to the application.


    +   - The HyperText Transfer Protocol (HTTP) is used for the transfer of web sites
    in HyperText Markup Language (HTML) format.

    - The Simple Mail Transfer Protocol (SMTP) is responsible for sending emails to
    another machine and the Post Office Protocol (POP3) for downloading e-mails from
    a mail server.

    - The File Transfer Protocol (FTP) is used to transfer files.


    For several application programs, such as a web browser and an e-mail program,
    to use the same Internet connection at the same time, separate TCP/IP connections
    are used for each application. Large amounts of TCP/IP data are also divided into
    small packets, so HTTP packets from the web browser can be sent over its TCP/IP
    connection while alternating with SMTP or POP3 packet transfers from the e-mail
    program via other TCP/IP connections.


    # 3.5. Network Devices'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'The client applications use the same Internet connection, the IP address, which
    only identifies the machine, is not sufficient. A port number is needed to sort
    out which TCP/IP data belongs to which application. These standard services are
    usually provided on servers at the following port numbers:


    +   - DNS on port 53

    - HTTP on port 80

    - SMTP on port 25 and POP3 on port 110

    - FTP on ports 20 and 21


    The client can only use services if it addresses the correct port number on the
    server.


    # 3.5.2 Information about the Internet Dial-up


    If you activate ''Dial on demand'' or ''Automatic dial-up'' in the YaST modules


