  md: '# Required Disk Space


    The amount of hard disk space needed depends on the intended use of the system.
    Available space limits what applications can be installed. The following hints
    give some guidelines for space requirements:


    +   - Minimal system: 180 MB

    No graphical interface (X Window System) is installed, which means only console
    applications can be used. Also, only a very basic selection of software is installed.

    - Minimal system with graphical interface: 500 MB

    This includes some applications.

    - Graphical system with modern applications: between 1 GB and 2 GB

    This includes recent versions of graphical desktops, namely KDE and GNOME, and
    bigger application packages, such as OpenOffice.org and Netscape or Mozilla.

    - For downloading lots of movies and music with Linux: 2 GB

    - Both items: 3 GB

    - Burning CDs and the items listed above: 4 GB


    These guidelines can help develop a partitioning scheme for your system:


    +   - Under 500 MB:

    A swap partition and a root partition (/).

    - Between 500 MB and 4 GB:

    A small boot partition located within the first cylinders of the hard disk (/boot,
    at least 8 MB or 1 cylinder) to hold the kernel and the boot loader. Also create
    a swap partition of approximately 256 MB then use the rest for the root partition
    (/).

    - For more than 4 GB:

    Boot (/boot), swap, root (250 MB), home directories (/home) with about 200 MB
    for each user, and the rest for programs and data (/usr). You may also reserve
    an extra partition for /opt and /var.'
  merge: -1
  pgno: 40
