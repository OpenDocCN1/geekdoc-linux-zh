    example_wind.ams shows that the sound of wind can be generated with AlsaModularSynth.
    There are also other example patches, like example_random_* and sequence*.


    # 18.11.2 AlsaModularSynth as an Effect Processor


    Especially in the JACK mode, AlsaModularSynth can be used as a versatile effect
    processor. One example for this is example_capture.ams If you connect an external
