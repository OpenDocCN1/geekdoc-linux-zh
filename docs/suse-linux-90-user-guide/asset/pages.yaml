  md: '# ISDN Telecommunication


    Even in this age of the Internet and e-mail, traditional communication means like
    phone and fax are still important. The communication package CapiSuite offers
    an ISDN-based solution for a computer-supported answering machine and fax transmission.


    The following chapter explains how CapiSuite works. This is followed by a description
    of its configuration with YaST and a brief introduction to the usage of the system.


    +   17.1 CapiSuite Basics . . . . . . . . . . . . . . . . . . . . . . . 270

    17.2 Configuration . . . . . . . . . . . . . . . . . . . . . . . 270

    17.3 Usage . . . . . . . . . . . . . . . . . . . . . . . 276'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 17.1 CapiSuite Basics


    CapiSuite is a daemon (a program that runs in the background) that provides basic
    telecommunication functions. The current version mainly offers functions for telephone
    and fax connections.


    For example, the system supports the establishment and termination of incoming
    and outgoing voice connections. Fax and audio files can be sent and received over
    these connections. Some special functions, the switching of a phone connection
    to a fax connection and the processing of DTMF (Dual Tone Multi Frequency — common
    telephone tones) are supported.


    However, the system does not constitute a complete application suite for certain
    tasks, the actual application was written in the Python scripting language (a
    language especially suitable for beginners) and can be freely adjusted to the
    respective requirements. CapiSuite merely processes the provided scripts and executes
    the specified commands. This allows the creation of flexible solutions from a
    simple answering machine or fax program to a small cell center (for which the
    system is still lacking basic features).


    The CapiSuite package includes some ready-made scripts that enable a comfortable
    answering machine and a fax solution. The following pages refer to the usage of
    these scripts. Following the installation, details on the system as well as instructions
    for writing custom scripts are available in /usr/share/doc/packages/capisuite/manual/index.html
    and on the project page http://www.capisuite.de.


    # 17.2 Configuration


    CapiSuite makes use of the CAPI programming interface for ISDN hardware. Since
    this interface has only been available for Linux for a short time, suitable drivers
    are not yet available for all ISDN adapters. However, drivers are already available
    for ISDN adapters from AVM and can easily be installed and configured with YaST.
    Refer to the chapter on the ISDN configuration and the help texts of the YaST
    module for more information.


    The functionality of the CAPI driver can easily be tested by executing the command
    capinfo as the user root. If detailed information about the capabilities of the
    ISDN adapter is returned, the driver is installed correctly and CapiSuite can
    be installed and used.


    Here you can also see if the CAPI driver you supports fax option. This is the
    case if the "T.30" protocol is listed in the sections "B1 protocols support"'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'to "B3 protocols support " . If this is not the case, you will merely be able
    to use CapiSuite for receiving voice calls.


    The CapiSuite package must be installed with the YaST software installation module
    to be able to configure CapiSuite. More information on installing software is
    provided in the respective section of the YaST chapter.


    Following the installation, YaST contains two modules for configuring the fax
    and answering machine functionality. These modules are described below.


    # 17.2.1 Configuring Fax Services


    The YaST module ''Fax'' from the ''Network Devices'' group contains a form with
    a user list and buttons for the processing of list entries configured for the
    fax system. The CapiSuite scripts used here are multiuser-capable and allow each
    user to send and receive faxes individually. The target number of an incoming
    call determines which user receives the fax. The list of this module is, of course,
    empty when it is started for the first time.


    The input field under the list can be used to enter any numbers for connecting
    to an external line. If your ISDN adapter is connected to an phone exchange, you
    can enter the prefix (usually 0) for external calls here.


    If users want to receive faxes with CapiSuite, it must be ensured that the associated
    phone numbers are all different and that these numbers are also associated with
    the line to which the ISDN adapter is connected. This is of importance if you
    concurrently use an ISDN PBX.


    > Tip Use only the answering machine module if you intend to receive both fax
    messages and regular calls under one number, this module includes the functionality
    for recognizing and receiving fax messages. See Configuring the Answering Machine
    on page 273 . In order to be able to send fax messages, configure a suitable entry
    in the fax module, but leave the field for incoming phone numbers (see further
    below) void.


    Existing entries can be edited or new entries can be created by means of the buttons
    under the list. To create a new entry or edit an existing entry, use the dialog
    box to enter the following data:


    ''User'' Here you can select the system user for whom you want to activate the
    fax functionality. Incoming fax messages and status reports will be sent to this
    user account.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Fax Machine Configuration


    The fax system for one or more users can be set up in this dialog. Each user must
    have at least one unique phone number. Refer to the telecommunication chapter
    in the manuals for further details.


    **Prefix**: Only for users behind a PBX. Please enter the prefix number for getting
    a public line. This number will be dialed before any destination number.


    When adding or editing a user, a dialog will be shown with the following fields:


    **User**: The system user this account belongs to


    | User Table |

    | User | Fax Numbers | MSN | Action | StationID | Headline |

    | --- | --- | --- | --- | --- | --- |


    ![](img/024a6c3adc868dbb714281f5a6285cf8_291_0.png)


    **Fax Numbers**'' Phone numbers allocated to the user for incoming fax messages
    are entered in this field. Multiple phone numbers can be separated by commas.
    All faxes sent to these numbers will be forwarded to the user by e-mail. Leave
    this field empty if you only want the user to be able to send fax messages.


    **Outgoing MSN**'' Enter the phone number used for sending fax messages. If this
    entry is missing, the first phone number from the fax numbers will automatically
    be used.


    **StationID**'' For identification purposes, the fax protocol uses a special ID
    that should normally contain the external phone number of the fax device in international
    notation. An example for a valid station ID is +49 123456 for the fax number 123456
    in Munich, Germany. The maximum length of this entry is twenty digits. Valid characters
    are numbers, spaces, and the + symbol as prefix to the international country code.


    **Header**'' This field can contain an arbitrary text to use as a header for sent
    faxes. Whether and how this text is featured on the sent document'
  merge: -1
  pgno: 291
- img_proc: true
  md: '![](img/024a6c3adc868dbb714281f5a6285cf8_292_0.png)


    pends on the respective ISDN driver.


    **Action** the default setting MailAndSave causes a received fax message to be
    saved in the system and forwarded to the user by e-mail. The SaveOnly option merely
    causes the fax to be saved to the hard disk. This option is recommended for expert
    users only.


    Click ''OK'' to accept the changes. Click ''Cancel'' to drop the changes and close
    the form.


    # 17.2.2 Configuring the Answering Machine


    The provided standard scripts also offer a comfortable multiuser answering machine.
    This can be configured with YaST ''Answering Machine'' module in the ''Network
    Devices'' group.


    Similar to the fax configuration, there is a list with the already configured
    users (which is empty when the module is started for the first time). The recorded
    incoming call is sent to the user associated with the phone number. This shows
    the importance of assigning unique phone numbers to the users. The individual
    user welcome message cannot be set at this point. The recording will be made later
    on with the remote access function of the configured answering machine.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# YaST


    Answering machine for one or more users can be set up in this device. Each user
    must have at least one unique phone number configured. Please refer to the telecommunication
    chapter in the manuals for further details.

    User: system user who wants to receive calls with the answering machine.

    Numbers: One or more phone numbers (defined by commas) which (only) to this user.

    Delay: Delay before the answering machine responds to the call.

    Duration: Maximum record length for one call.

    Action: By default, recorded


    # Answering machine configuration


    | User table

    | User | Phonenumbers | Delay | Duration | Action |


    ![](img/024a6c3adc868dbb714281f5a6285cf8_293_0.png)


    Figure 1.73: YaST Module for Configuring the Answering Machine


    The answering machine has an automatic silence recognition routine that terminates
    the recording session after five seconds without noises.


    > Tip

    Incoming fax calls are also automatically recognized and received in most cases.
    This automatic routine can, however, fail with older fax machines, which is why
