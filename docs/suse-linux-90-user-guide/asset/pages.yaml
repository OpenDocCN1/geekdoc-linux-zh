  md: '# ### 3.8.5 LVM


    The Logical Volume Manager (LVM) is a tool for individually partitioning hard
    disks by means of logical drives. As this is a genuine expert tool, no additional
    information is provided within the scope of this user guide. For information,
    refer to the *Administration Guide*.


    # ### 3.8.6 Partitioning


    Although it is possible to modify the partitions in the installed system, this
    should be handled by experts who know exactly they are doing, as otherwise the
    risk of losing data is very high. If you decide to use this tool, refer to the
    description in Section *Partitioning* on page 19 (the partitioning tool during
    the installation is the same as in the installed system).


    # ### 3.8.7 Profile Manager ($SCPM)


    The SCPM (System Configuration Profile Management) module offers the possibility
    to create, manage, and switch between entire system configurations. This is especially
    useful for mobile computers that are used in different locations (in different
    networks) and by different users. Nevertheless, this feature is useful even for
    stationary machines, as it enables the use of various hardware components or test
    configurations. Although the module with the helping is easy to use, the configuration
    of profiles is a task that should be performed by experts or system administrators.
    For more information about SCPM basics and handling, refer to the respective sections
    in the *Administration Guide*.


    # ### 3.8.8 Runlevel Editor


    The Runlevels in SuSE Linux


    SuSE Linux can be operated in several runlevels. By default, the system boots
    to runlevel 5, which offers multiuser mode, network access, and the graphical
    user interface (X Window System). The other runlevels offer multiuser mode with
    network without X (runlevel 3), multiuser mode without network (runlevel 2), single-user
    mode (runlevel 1 and S), system halt (runlevel 0), and system reboot (runlevel
    6).


    The various runlevels are useful if problems are encountered in connection with
    a particular service (X or network) in a higher runlevel. In this case, the system
    can be booted to a lower runlevel to repair the service. Many servers operate'
