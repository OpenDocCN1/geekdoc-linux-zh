  md: '# The Mozilla Web Browser


    Mozilla is a web browser developed as an “Open Source” program with the aim of
    providing an Internet application that is fast, compliant with standards, and
    portable across different computing platforms. In addition to the basic browser,
    Mozilla includes a number of extra components, such as a mail component and a
    web page design component. This chapter focuses on the web browser component.


    +   13.1 The Initial Browser Window . . . . . . . . . . . 228

