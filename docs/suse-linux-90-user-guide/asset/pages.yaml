  md: 'To create a new drawing, start Draw from the main menu: ''Applications'' →
    ''OpenOffice.org Draw''; If OpenOffice.org is already running, select ''File''
    → ''New'' → ''Drawing''. The graphical objects available in Draw can be modified
    in various aspects, such as line thickness, type color, and fill.


    Try to draw a rectangle. In the main toolbar, which is displayed on the left-hand
    side, click the filled rectangle button (fifth from top) and keep the mouse button
    pressed for a few seconds until an additional toolbar appears. The latter includes
    a selection of filled and unfilled rectangles and squares, some of them with rounded
    corners. Select one of the filled rectangles. The mouse cursor should turn into
    a cross. Now move the mouse to the canvas and click it, dragging the mouse towards
    the bottom right. Draw will show the outline of a rectangle that is reshaped as
    you move. When you are satisfied with the size of the object, release the mouse
    button.


    The properties of the rectangle, such as its color fill, can be modified with
    the following steps: First, activate the object with a single click. This should
    enable the green handles on the rectangle''s corners and edges, which allow you
    to reshape and size it. Next, open the context menu by pressing the right mouse
    button. After selecting ''Area...'', a dialog opens in which to change various
    properties. When you are done with your modifications, click ''OK''. As an alternative
    method to change the fill color, select one directly in the object in the object
    bar at the top (to the right of the paintbucket).


    There are many useful drawing objects available in the toolbar. Use it to create
    circles, ellipses, lines, and even 3D elements.


    # 6.9 Creating Presentations with OpenOffice.org Impress


    # 6.9.1 Creating Presentations with the Autopilot


    Less experienced users may prefer to use Autopilot to create presentations. Select
    ''File'' → ''Autopilot'' → ''Presentation...''. With the Autopilot, define the
    basic structure of a presentation in three brief steps. In doing so, set backgrounds,
    the output medium, and various effects. You can also import data from an existing
    presentation with the help of assistants.


    After completing the procedure by clicking ''Create'', Impress offers a number
    of templates for the page layout. Select one that suits your purposes and enter
    a name for the first slide. Then click ''OK'' to generate the first slide of the
    new presentation.'
