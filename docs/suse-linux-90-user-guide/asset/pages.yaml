- img_proc: true
  md: 'file systems. These file systems are able to restore your system very quickly
    after a system crash, as write processes are logged during the operation. Furthermore,
    ReiserFS is very fast in handling lots of small files. Ext2 is not a journaling
    file system. It is "rock solid" and good for smaller partitions, as it does not
    require much disk space for management.


    +   - File System Options


    Here, specify various parameters for the selected file system. Depending on the
    file system used, various options are offered. Only make changes if you are absolutely
    sure what you are doing.


    +   - Encrypt File System


    If you activate the encryption, all data is written to the hard disk in encrypted
    form. This increases the security of sensitive data, but reduces the system speed,
    as the encryption takes some time.


    +   - fstab Options


    Here you can specify various parameters for the administration file of the file
    systems (/etc/fstab). Experienced users have the ability to modify a number of
    options. Refer to the respective chapter in the Administration Guide before changing
    anything.


    +   - Mount Point


    This specifies the directory at which the partition should be mounted in the file
    system tree. Various YaST suggestions can be expanded at the respective entry
    field. If you accept these suggestions, the default file system structure is implemented.
    However, you can also specify other names.


    3. Select ''Next'' to activate the partition.


    > Note

    If you partition manually, create a swap partition. The swap partition is used
    to free the main memory from data that is not used at the present moment. This
    keeps the main memory free for the most frequently-used important data.


