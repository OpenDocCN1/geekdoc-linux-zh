    # 3.4.6 IDE DMA Mode


    This module enables you to activate and deactivate the DMA mode for your IDE hard
    disks and your IDE CD/DVD drives in the installed system. This module does not
    have any effect on SCSI devices. DMA modes can substantially increase the performance
    and data transfer speed in your system.


    During the installation, the current SuSE Linux kernel automatically activates
    DMA for hard disks but not for CD drives, as default DMA activation for all drives
    often with CD drives. Use the DMA module if you want to activate DMA for your
    drives. If the drive supports the DMA mode without any problems, the data transfer
    rate of your drive can be increased by activating DMA.


    > Note


    DMA (Direct Memory Access) means that your data can be transferred directly to
    the RAM, bypassing the processor control.


    > Note'
