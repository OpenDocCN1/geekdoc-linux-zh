- img_proc: true
  md: 'form of clicks. Therefore, audio programs use a buffer for the playback, enabling
    the audio data in the buffer to be emitted continuously by the sound card even
    when the audio program is interrupted by the scheduler. Accordingly, the playback
    is click-free if the buffer is large enough to bridge the longest possible interruption.


    However, the buffer size also determines the reaction time (latency) of the program.
    Therefore, the buffer size is kept as small as possible especially for interactive
    applications, as real-time synthesizers and DJ mixer consoles. Basically, the
    length of the interruptions depends on the system load and the priority of the
    process. Consequently, the size of the buffer required for free playback can be
    reduced by increasing the priority of the audio program or by switching to a real-time
    scheduler. For this reason, many audio programs attempt to switch their processes
    to a real-time scheduler, but switching a process to another scheduler is only
    possible with root privileges. The application priority in the package rtools
    package is required for this task.


    For example, proceed as follows to run the application timidity with the FIFO
    scheduler:


    +   1. Start timidity


    +   2. Start a root console


    +   3. Use the following command to find the process ID of timidity:


    ```

    pidof timidity

    ```


    +   4. Change the scheduler with the command


    ```

    setpriority <processID> fifo 10

    ```


    You can use the following command in a root for i in ''pidof timidity''; setpriority
    $i fifo 10; done


    Running a program in root mode is always risky, as the program is permitted to
    do anything. If the computer is connected to the Internet, the security risk would
    be unacceptable. Security bugs in the program could be exploited for the purpose
    of gaining access to the system.


    # Caution


    The commands described in the following paragraphs should be executed on machines
    that can be accessed from the Internet or if a system crash or data loss would
    have serious consequences.


    # Caution'
