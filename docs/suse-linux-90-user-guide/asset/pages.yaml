  md: '# 7.1 General Features


    You can start KWrite from the main menu or using the command kwrite. The command
    can be entered on the command line together with the name of the file you want
    to open.


    Apart from using the menu bar, the toolbar, and a number of shortcuts, you can
    click the opened document with the right mouse button to access a con-text menu
    providing basic editor functions.


    KWrite supports the drag and drop functions of KDE, which means that you can simply
    drag documents with the mouse from one application into another or paste data
    from the clipboard (see Section The Clipboard Kpper on page 148).


    To edit a text file which you have put an icon on the desktop, click the icon
    with the left mouse button and hold the button while dragging into the editor-window.
    You can now edit the file as usual. You can also paste text from the clipboard
    by clicking the middle mouse button. To edit or view the source code of an HTML
    file, drag the URL into the editor of KWrite, keeping the left mouse pressed (see
    Figure 7.1).


    ![](img/024a6c3adc868dbb714281f5a6285cf8_209_0.png)


    > Figure 7.1: The KWrite Text Editor'
