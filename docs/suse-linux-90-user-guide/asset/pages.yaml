    ''Broken Server'', responses from servers on unprivileged ports are also accepted.
    For more information, refer to the man page of ybind.


    # 2.6.7 Creating Local User Accounts


    When user accounts are created locally, any data related to user accounts (name,
    login, password, and so on) are stored and managed on this host.

    Linux is an operating system that allows several users to work on the same system
    at the same time. Each user needs a user account to log in to the system. By having
    user accounts, the system gains a lot in terms of security. Regular users cannot
    change or delete files needed for the system to work properly. Similarly, the
    personal data of a given user can be modified, viewed, or tampered with by other
    users. Each user can set up his own working environment and always find it unchanged
    when logging back in.


    A user account can be created using the dialog shown in Figure 2.18 on page 41.
    After entering the first name and last name, specify the user name (login). If
    you cannot think of a suitable user name, click ''Suggestion'' for the system
    to generate one automatically.'
