    # 3.7 Security and Users


    A basic aspect of Linux is its multiuser capability. Consequently, several users
    can work independently on the same Linux system. Each user has a user account
    identified by a login name and personal password for logging in to the system.
    All users have their home directories where personal files and configurations
    are stored.


    # 3.7.1 User Administration


    Use the check boxes to decide whether to edit users or groups. YaST provides an
    overview of all local users in the system. If you are part of an extensive network,
    click ''Set Filter'' to list all users (e.g., *root*) or NIS users. You can also
    create user-defined filter settings. Instead of switching between individual groups,
    combine them to your needs. To add new users, fill in the required blanks in the
    following screen. Subsequently, the new user can log in to the host with the login
    name and password. The user profile can be fine-tuned with ''Details''. You can
    manually set the user ID, the home directory, and the default login shell. Furthermore,
    the new user can be assigned to specific groups. Configure the validity of the
    password in ''Password settings''. Click ''Edit'' to change these settings whenever
    necessary. To delete a user, select the user from the list and click ''Delete''.


    For advanced network administration, use ''Expert Options'' to define the default
    settings for the creation of new users. Select the authentication method (NIS,
    LDAP, Kerberos, or Samba) as well as the algorithm for the password encryption.
    These settings are relevant for large (corporate) networks.


    # 3.7.2 Group Administration


    Start the group administration module from the YaST Control Center or click ''Groups''
    in the user administration. Both dialog have the same functionality, allowing
    you to create, edit, or delete groups.'
  merge: -1
  pgno: 122
