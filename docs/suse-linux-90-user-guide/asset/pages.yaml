  md: '# 2.5.7 Boot Configuration (Boot Loader Installation)


    During the installation, YaSST proposes a boot configuration for your system.
    Normally, you should leave these settings unchanged. However, if you need a custom
    setup, modify the proposal for your system.


    One possibility is to configure the boot mechanism to rely on a special boot floppy.
    Although this has the disadvantage of requiring the boot floppy in the drive for
    boot, it allows you to leave an existing boot mechanism untouched. This should
    not normally be necessary, however, YaSST can configure the SuSE Linux boot loader
    to boot existing operating systems as well. Another possibility with the configuration
    is to change the location of the boot mechanism on hard disk.


    To change the boot configuration proposed by YaSST, select ‘Booting’ to open a
    dialog in which to change many details of the boot mechanism. For information,
    read Section Boot Loader Configuration with YaSST on page 112.


    > Note The boot method should only be changed by experienced computer users.


    # 2.5.8 Time Zone


    In this dialog, shown in Figure 2.12 on the following page, choose between Local
    Time and UTC under ‘Hardware clock set to’. The selection depends on how the hardware
    (BIOS) clock is set on your machine. If it is set to GMT, which corresponds to
    UTC, your system can rely on Setup Linux to switch from standard time to daylight
    savings time and vice versa.


    # 2.5.9 Language


    The language was already selected at the beginning of the installation (see Section
    Language Selection on page 17). If you want to change this setting, you can do
    this here. Furthermore, advanced users can use the ‘Details’ button to set the
    language for the user root. The drop-down menu offers three options:


    ctype The value of the variable LC_CTYPE in the file /etc/sysconfig/language is
    adopted for the user root. This sets the localization for language-specific function
    calls.'
