  md: '# The File Menu


    **‘New’ (Ctrl+N)** creates a new file and, at the same time, opens a new KWrite
    window in to start typing your text.


    **‘Open...(Ctrl+O)** Use this to open an existing file. It opens a file selection
    dialog that resembles a file manager. The left-hand area provides a number of
    quick buttons to list the files in your home directory or on the floppy with just
    one click. Alternatively, use the entry field in the toolbar at the top or browse
    directories with the arrow buttons. As soon as a directory is selected, the files
    and subdirectories in it are listed in the right-hand part of the dialog. To speed
    things up, narrow down the list according to file type by specifying the file
    extension (e.g., *.txt) under ‘Filter’.


    To mark the current directory for quick return, click the star button in the toolbar
    and create a bookmark for it. Any directory bookmarked in this way can subsequently
    be reached via the menu to avoid going through the entire file system again and
    again. Use the configuration menu accessible with the wrench button to customize
    the way in which the items in the dialog are sorted and viewed.


    **‘Save’ (Ctrl+S)** saves the document in its current form. If you have been editing
    a new document, the program display a dialog with to specify the name of the file
    and its location (directory).


    **‘Save As...’** opens a dialog in which specify the name and the directory under
    which to save the document. The document is essentially the same as the one displayed
    after selecting ‘File’ → ‘Open...’.


    **‘Print...(Ctrl+P)** opens a simple dialog in which define printing options for
    the document and start the print job. If there are changes that have not been
    saved, a dialog opens to ask whether to do.


    **‘Close’ (Ctrl+W)** closes the lately loaded document. If there are unsaved changes
    to a loaded document, KWrite shows a dialog asking whether to save before exiting.


    **‘Quit’ (Ctrl+Q)** exits the editor. If there are unsaved changes to a loaded
    document, KWrite shows a dialog asking whether to save before exiting.


    # The Edit Menu


    This menu provides all the program’s editing functions, such as selecting and
    searching or replacing text according to certain patterns.'
  merge: -1
