    ![](img/024a6c3adc868dbb714281f5a6285cf8_81_0.png)


    # Important Information about Updates


    The system update is a very complex procedure. For each program package, YaST
    must check which version is installed on the computer and what needs to be replace
    the old version with the new version correctly. YaST also tries to adopt any personal
    settings of the installed packages. However, some configurations may cause problems
    after the update if the old configuration is unable to handle the new program
    version as expected or if unexpected inconsistencies arise from various configurations.


    The older the existing version is and the more the configuration of the packages
    to update diverges from the standard, the more problematic the update will be.
    Sometimes, the old configuration cannot be adopted correctly. In this case, an
    entirely new configuration must be made. Before starting the update, the existing
    configuration should be saved.


