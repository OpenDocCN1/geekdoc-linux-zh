  md: '# K3b — The KDE Burning Application


    K3b is a comprehensive program for writing data and audio CDs. Along with the
    usual features, the program offers some additional options that facilitate working,
    especially in the field of multimedia. You can start the program from the main
    menu or by entering the command k3b. The main program features are described in
    the following sections.


    +   20.1 Creating a Data CD . . . . . . . . . . . . . . . . . . . . . 318

    20.2 Burning CDs . . . . . . . . . . . . . . . . . . . . . . . . . . 318

    20.3 Creating an Audio CD . . . . . . . . . . . . . . . . . . . . . 319

    20.4 Copying a CD . . . . . . . . . . . . . . . . . . . . . . . . . . 320

    20.5 Writing ISO Images . . . . . . . . . . . . . . . . . . . . . . 320

    20.6 For More Information . . . . . . . . . . . . . . . . . . . . . 321'
