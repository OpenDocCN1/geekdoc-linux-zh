  md: '# 6.7.1 Changing something Cell Attributes


    To enter something in a cell, simply write in that cell. By default, texts are
    aligned to the left and numbers to the right. To confirm your entry, hit Enter.
    To change the formatting of selected cells, right-click to open a context menu
    and select ''Format Cells...''. This opens a dialog to change the cell attributes.
    The dialog, as shown in Figure 6.7, has the tabs ''Numbers'', ''Font'', ''Font
    Effects'', ''Alignment'', ''Borders'', ''Background'', and ''Cell Protection''.
    By enabling ''Protected'' under ''Cell Protection'', prevent a cell from being
    modified.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_202_0.png)


    Figure 6.7: The Cell Attributes Dialog


    # 6.7.2 A Practical Example: Monthly Expenses


    Calculations can be done using formulas. Any numeric values entered in cells can
    be used in formulas by referring to the unique coordinates of each cell. For example,
    you may want to keep a record of your monthly expenses. This could be done by
    writing a few items into a very basic spreadsheet as in Figure 6.8 on the following
    page. The cell B3 contains the phone bill for January and B4 the fuel expenses.
    To add both amounts together, enter = B3+B4'
