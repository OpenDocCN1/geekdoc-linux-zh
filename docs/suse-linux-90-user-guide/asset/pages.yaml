    # 3.6 Network Services


    This group mostly contains tools for professionals and for the system administrator.
    If you have SuSE Linux Personal Edition, some of the tools covered in this section
    are not available, as they are only installed in the Professional Edition.


    > Note

    The tools ''LDAP Client'', ''NIS Server'', ''NIS Client'', ''NIS+ Client'', and
    ''Proxy'' are not addressed here, as these are genuine expert tools that are usually
    used in company networks. More information about these modules is provided in
    the Administration Guide.


    # 3.6.1 Host Name and DNS


    The host name and the domain name can be changed here. If the provider has been
    configured correctly for DSL, modem, or ISDN access, the list of name servers
    contains entries made automatically, as they were extracted from the provider
    data. If you are located in a local network you might receive your host name via
    DHCP, in which case you should not modify the name.


    # 3.6.2 NFS Client and NFS Server


    You need these tools only if you are located in a network. In this case, you have
    the possibility to operate a file server that can be accessed by members of your
    network. On this file server, you can make programs, files, or storage space available
    for users. Use the ''NFS Server'' module to set up your computer as an NFS server
    and to determine the directories to export for use by the network users. The NFS
    server should be set up by an expert. To configure an NFS server, refer to the
    brief instructions in the Administration Guide under Linux in the Network: NFS.


    Subsequently, any user (with the needed permissions) can mount these directories
    in his own file tree. The easiest way to do this is by means of the ''NFS'
  merge: -1
