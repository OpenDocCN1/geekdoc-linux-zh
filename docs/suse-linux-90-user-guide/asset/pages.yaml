    # Navigating Buttons and Selection Lists


    Tab and Alt and Tab navigate back and forth among the single


    Navigating in Selection Lists Up and Down always navigate among the items within
    active frame containing a selection list. This can, for instance, the single modules
    of a module group in the control center.


    # Checking Radio Buttons and Check Boxes


    Buttons with empty square brackets (check box) or empty parentheses (radio buttons)
    can be selected with Space or Enter. The buttons at the bottom of the individual
    modules are activated with Enter (green background) or with the combination Alt
    + yellow letter. Refer to Figure 3.33 on the next page.


    The Function Keys Various functions are mapped to the F keys F1 to F12. Which
    F keys are actually mapped to functions depends on which YaST module is active,
    because the different modules offer different buttons (such as details, info,
    add, and delete). The buttons ''OK'', ''Next'', and ''Finish'' are mapped to F10.
    The YaST help, which can be accessed with F1, provides information about the functions
    of the individual F keys.


    # 3.10.4  Starting Individual Modules


    To save time, the individual YaST modules can also be started directly. To start
    the modules, enter vast followed by the name of the module.'
