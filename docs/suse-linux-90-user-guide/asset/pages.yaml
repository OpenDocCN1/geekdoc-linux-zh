  md: '# Welcome


    Congratulations for selecting SuSE Linux! A few clicks are all that is needed
    to prepare the installation, which takes about fifteen to twenty minutes. After
    configuring the users and their passwords and selecting the screen resolution,
    your SuSE Linux system is ready for use. If you are familiar with earlier versions
    of SuSE Linux, you will notice how the configuration with the system assistant
    YaST has been expanded and simplified.


    The simple quick installation is explained first. If you have special wishes in
    connection with the programs to install, the partitioning of your hard disk, or
    other features, read the chapter about the custom installation. YaST facilitates
    the configuration and administration of your hardware, Internet access, and system
    — without any irritating reboots!


    Get to know the graphical desktop environments KDE and GNOME and learn how to
    adapt them to your personal preferences. The following sections introduce some
    very useful and interesting programs from the large range of available applications,
    including office programs as OpenOffice, web browsers, file managers, scanning
    tools, and image editing tools.


    Additionally find information on the SuSE help system and the available information
    sources containing further documentation. Also included are a list of frequently
    asked questions about SuSE Linux and a glossary of the most important terms from
    the world of computers and Linux.


    # Changes in the User Guide


    The documentation of the previous version (SuSE Linux 8.2) has been modified as
    follows:


    +   - The instructions for the installation and configuration with YaST have been
    updated.'
  merge: -1
  pgno: 20
- img_proc: true
  md: "+   - Due to new features, the following chapters have undergo substantial\
    \ editing:\n  - The KDE desktop: everything about KDE.\n  - The GNOME desktop:\
    \ everything about GNOME.\n  - OpenOffice.org, the complete office suite for Linux.\n\
    \  - A new version of the comfortable scanning application Kooka is now available.\n\
    \  - K3b for burning CDs and DVDs also contains some new features, which are covered\
    \ in the documentation.\n  - Installation and configuration of telecommunications\
    \ services (see Chapter ISDN *Telecommunication* on page 269).\n  - The chapter\
    \ about digital cameras and Linux now describes the application digikam.\n\n+\
    \   - The following chapters are new in this edition:\n  - A chapter about encryption\
    \ in SuSE Linux explains how KGpg works and how you can use it for managing your\
    \ keys.\n  - kaddressbook is a comfortable application for managing your addresses.\n\
    \  - The chapter about korganizer shows how to manage appointments and tasks.\n\
    \  - Instructions for synchronizing your PalmPilot with your Linux system using\
    \ kpilot.\n  - Mozilla has been included in the list of documented web browsers.\n\
    \n# Typographical Conventions\n\nThe following typographical conventions are used\
