    generates random music with drums.


    # 18.11.6 Writing WAV Files with the WAV Out Module


    Using the WAV Out module, directly record the signals generated or processed by
    AlsaModularSynth as a WAV file in CD quality. In the configuration dialog of the
    module, select ''New File'' to open a file browser. If the file displayed under
    ''File'' is successfully generated, the buttons under ''Record'' are activated
    and can be used.


    # 18.12 NoteEdit and MIDI Sequencers


    NoteEdit is one of the most comprehensive Linux applications for editing scores
