  md: '# The KDE Desktop


    As the graphical interface KDE is very intuitive to use, the following section
    describes the efficient utilization and configuration of the desktop environment,
    the file manager Konqueror, and some small but useful utilities.


    +   4.1 Desktop Components . . . . . . . . . . . . . . . . . . 126

    4.2 Settings . . . . . . . . . . . . . . . . . . . . . . . 133

    4.3 Konqueror as a File Manager . . . . . . . . . . 141

    4.4 Important Utilities . . . . . . . . . . . . . . . . . . 145'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# ## 4.1 Desktop Components


    The graphical desktop environment should not pose any problems for former Windows
    or Macintosh users. The main components are the icons on the-top and the panel
    at the bottom of the screen. The mouse is your most important tool. Click a symbol
    or an icon once with the left mouse button to start the associated program or
    the file manager Konqueror. If you click an icon with the right mouse button,
    different menus appear, depending on the program. As well as the icons, there
    are two desktop menus.


    # ### 4.1.1 The Desktop Menus


    If you click the desktop with the middle mouse button (if your mouse only has
    two buttons, press both buttons at the same time), a window and desktop management
    menu are displayed. If you keep the mouse button pressed, you can select a menu
    item directly. Alternatively, release the mouse button and click the respective
    menu item.


    **Unutter Windows** If you have several windows on your desktop, these are placed
    next to each other and aligned with the top left corner.


    **Cascade Windows** Starting from the top left corner, the windows on the desktop
    are placed on top of each other in such a way that only the top and left borders
    of the lower windows are visible.


    **Desktop 1** Desktop is your default desktop. All open windows are listed under
    this menu item. Click windows to move them to the foreground.


    **additional desktop** Furthermore, you can use additional virtual desktops. You
    can switch to another desktop with the menu or the panel. All functions are available
    on all desktops. This possibility is quite useful to limit the number of programs
    and associated windows on one desktop. These virtual desktops resemble additional
    desks in your office.


    If you click the desktop with the right mouse button, a more complex menu is displayed,
    allowing you to customize your desktop.


    **Create New** Enables creation of new elements, such as directories, files, or
    URLs, on the desktop. A list of possible elements is provided for selection in
    a submenu.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Bookmarks This item opens the bookmark editor KEdBookmarks. With it, create,
    group, change, or delete bookmarks. The browser and file manager Konqueror can
    access these bookmarks.


    Undo This option allows you to undo the last action. For example, if you just
    created a new directory on the desktop, clicking this item reverts the directory
    disappears.


    Paste To be able to open a folder or document by means of a desktop symbol, copy
    the icon from the file manager by clicking it with the right mouse button and
    selecting ''Copy'' then move the mouse to the desired location on the desktop.
    Click the right mouse button again and select ''Paste''. The icon is now available
    on your desktop and can be moved around by dragging it with the left mouse button
    pressed.


    Icons Rearranges the symbols on the desktop. You can also change the order of
    the icons.


    Windows The windows on the desktop are either placed on top of each other at the
    top left corner or next to each other.


    Configure Desktop This menu item starts a configuration dialog with which to configure
    the appearance of the desktop. Details about the configuration of the desktop
    are provided in Section Settings on page 133.


    Help Use this submenu to the KDE manual or write a bug report to the developers
    via the KDE web site. You can also start an information page about KDE.


    Lock Screen If you leave your workstation and do not log out, you should use this
    function to prevent others from gaining access to your files. Depending on the
    setting, the screen turns black or a screensaver starts. Continue using the computer,
    enter your password.


    Logout User Log out from your system if you are not going to use the system for
    some time.


    # 4.1.2 The Trash Bin


    The trash bin is a directory for files marked for deletion. You can drag and drop
    icons from the file manager or the desktop to the trash bin icon by keeping the
    left mouse button pressed. If you click the trash bin with the left mouse button,
    you will see the contents. You can retrieve an item from the trash bin if desired.'
  merge: -1
  pgno: 146
- img_proc: true
  md: "Alternatively, right-click an icon and select 'Move to Trash' from the menu.\n\
    Files removed with the menu 'Delete' are not moved to the trash bin, but\ndeleted\
    \ completely. To delete the files in the trash bin completely, right-click the\n\
    trash bin icon and select 'Empty Trash Bin'.\n\n# 4.1.3 CD-ROM, DVD-ROM, and Floppy\
    \ Disks\n\nIf you click the floppy disk icon when a floppy disk is inserted, the\
    \ file manager\nstarts and displays the content of the floppy disk. A context\
    \ menu with various\noptions can be displayed by right-clicking the individual\
    \ icons on the floppy\ndisk. It is also possible to move the icon to a different\
    \ location, as the desk-\ntop or your home directory, by simply keeping the mouse\
    \ button pressed\ndragging it to the appropriate icon. You will be asked whether\
    \ you want to\nmove or copy the file or create a link. You can also copy or move\
    \ files from\nhome directory to the floppy disk.\n\nRight-click the floppy disk\
    \ icon to access the context menu. 'Unmount' is a very\nimportant option. Be sure\
    \ to unmount the drive before removing a floppy disk\nfrom the drive, as this\
    \ is necessary to trigger the actual writing of the data to the\nfloppy disk.\n\
    \nThe handling of CDs and DVDs is similar, with the only difference that these\n\
    media are not writable. Nevertheless, you must unmount CD/DVD drives, be-\ncause\
    \ you will not be able to eject the CD. You can also select 'Eject',\nwhich will\
    \ cause the medium to be unmounted and ejected. Both methods only\nwork if the\
    \ CD/DVD is no longer accessed and any file manager window dis-\nplaying the content\
    \ of the CD/DVD has been closed.\n\n# 4.1.4 The Printer Icon\n\nClick the printer\
    \ icon on the desktop to start KPrinter. This program en-\nab you to adjust a\
    \ number of settings and send print jobs directly. The upper\npart of the main\
    \ window (see Figure 4.1 on the next page) shows the selected\nprinter and allows\
    \ selection of a different printer. Click the black arrow next to\nthe name to\
    \ display a list of all available printers and select the desired\nprinter.\n\n\
    To configure the selected printer, click 'Properties'. A configuration dialog\
    \ like\n shown in Figure 4.2 on page 130 opens, enabling you to change the paper\n\
    format (e.g., from A4 to A5) or change between multiple paper trays. The latter\n\
    is especially interesting if one of the trays contains letterhead paper and another\n\
    contains plain white paper."
  merge: -1
  pgno: 147
- img_proc: true
  md: '# 4

