  md: '# ### 3.4.7 Joystick


    Use this module to configure your joystick by selecting the manufacturer and the
    model from the displayed list. With ''Test'', check if your joystick responds
    correctly. The test dialog shows three charts for the analog axes of the joystick
    and marks for the four standard buttons. When you move the joystick or press the
    buttons, you should be able to see a reaction in the test dialog. As joysticks
    are usually connected to the sound card, you can also access this module from
    the sound card configuration.


    # ### 3.4.8 Select Mouse Model


    Configure your mouse with YaST module. As the procedure for the selection of the
    mouse was already explained within the scope of the user-defined installation,
    refer to Section Mouse on page 19.


    # ### 3.4.9 Scanner


    If your scanner is connected and switched on, it should be detected automatically
    when your YaST module is started. In this case, the dialog for the installation
    of the scanner appears. If no scanner is detected, the manual configuration dialog
    appears. If you have already installed one or several scanners, a list of existing
    scanners that can be modified or deleted is displayed. Press ''Add'' to configure
    a new device.


    Next, an installation is performed with default settings. If the installation
    is successful, a corresponding message will appear. Now, test your scanner by
    inserting a document and clicking ''Test''.


    # ### Scanner Not Detected


    Only supported scanners can be autodetected. Scanners connected to another network
    host will not be detected. The manual configuration distinguishes three types
    of scanners: USB scanners, SCSI scanners, and network scanners.


    +   - USB scanner: Specify the vendor and model. YaST will attempt to load USB
    modules. If your scanner is very new, the modules may not be loaded automatically.
    In this case, continue automatically to a dialog in which to load the USB module
    manually. Refer to the YaST help for more information.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '+   - SCSI scanner: Specify the device (such as /dev/sg0). SCSI scanners should
    not be connected or disconnected when the hem system is running. Shut the system
    down first.


    +   - Network scanner: Enter the IP address or the host name.


    You can use a scanner that is connected to a host in your network and configured
    as a network scanner. To configure a network scanner, refer to the Support Database
    article ''Scanning in Linux'' (http://sdb.suse.de/en/, keyword ''scanner''). When
    selecting a network scanner, enter the host name or the IP address of the host
    to which the scanner is connected.


    If your scanner was not detected, probably the device is not supported. However,
    sometimes supported scanners are detected. If that is the case, proceed with the
    manual scanner selection. If you identify your scanner in the list of vendors
    and models, select it. If you do not select ''Cancel''. Information about scanners
    that work with Linux is provided at http://cdb.suse.de/index.php?LANG=en, http://sdb.suse.de/en/,
    and http://www.mostang.com/sane.


    # Caution


    > Only assign the scanner manually if you are absolutely sure. A wrong selection
    could damage your hardware.


    # Troubleshooting


    Your scanner may not have been detected for one of the following reasons:


    +   - The scanner is not supported. Check http://sdb.suse.de/en/ for a list of
    Linux-compatible devices.


    +   - Your SCSI controller was not installed correctly.


    +   - There are termination problems with your SCSI port.


    +   - Your SCSI cable is too long.


    +   - Your scanner has a SCSI Light Controller that is not supported by Linux.


    +   - Your scanner is defective.'
