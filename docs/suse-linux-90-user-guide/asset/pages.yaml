  md: '# 15.7 The Address Book


    Save frequently-used addresses and contacts in the address book. Access it from
    the ''Tools'' menu, with the respective icon in the main window, or from the ''Composer''
    window. Create a new entry with ''File'' → ''New Contact''. A window opens which
    to enter the data of the person under the ''General'' tab.


    The ''View'' menu allows creation of custom views of the contacts. The table view
    is the default setting. ''Add view'' opens a dialog in which to name the view.
    ''View type'' has options for whether the contacts should be displayed as icons,
    in a table, or as cards. ''OK'' continues to the next dialog box in which to select
    the fields to include in the custom view. Filters and preferences can be set in
    the corresponding items. ''OK'' activates the newly created view.


    # 15.8 Filters


    Filters enable automatic processing of incoming messages and manual processing
    of selected messages in a folder. To filter selected messages to a specific folder,
    highlight the messages and enter (Ctrl)+J to activate existing filter rules or
    select ''Message'' → ''Create Filter'' to create a new one. In doing so, all existing
    filter rules are applied to this message. There is no way to use only certain
    filters.


    # 15.8.1 Filter Rules


    A filter consists of one or several filter rules and filter actions. A filter
    rule can select messages according to criteria, such as the sender, content, or
    recipient. The respective filter action can perform tasks like moving, deleting,
    marking, or forwarding these messages.


    # 15.8.2 Examples of Filters


    Assume, for instance, you are subscribed to the KDE user list kde-user@kde.org.
    Whenever a message from the mailing list arrives, the mail is moved into another
    folder. The following steps are necessary for creating this filter.


    +   1. Add a new folder as described in Section Message Folders on page 251. Assign
    a name, such as kde-user.'
  merge: -1
  pgno: 272
