  md: '# Other Filters


    Click the filter selection box to view the range of possible filters. The selection
    according to ''Package Groups'' can also be used for the installation. This filter
    sorts the program packages by subjects in a tree structure to the left. The more
    you expand the branches, the more specific the selection of packages is and the
    fewer packages that are displayed in the list of associated packages to the right.

    Use ''Search'' to search for a specific package. This is explained in detail Section
    Installing and Removing Software on page 51.


    # Package Dependencies and Conflicts


    Instead of rewriting the same basic functions in each software package, programmers
    access the functions of other packages. Many packages require that other packages
    are installed for the program to function. In rare cases, programs interfere with
    each other, causing conflicts. When selecting and deselecting software packages
    in this dialog, alerts about unresolved package dependencies or conflicts may
    be displayed. If you install Linux for the first time or if you do not understand
    the alerts, read Section Installing and Removing Software on page 51, which provides
    detailed information about the operation of the package manager and a brief summary
    of the software organization in Linux.


    # Caution


    The software preselected for installation is based on our long-standing experience
    and is usually suited for the needs of most newcomers and advanced home users.
    In general, there is no need to change anything here. However, if you decide to
    select or deselect any packages, you should be aware of the consequences. In particular,
    observe any warnings and avoid deselecting packages of the base system.


    # Caution


    # Exiting the Software Selection


    If you are satisfied with your software selection and there are no more unresolved
    package dependencies or conflicts, click ''Accept'' to apply your changes and
    exit the program. If this module is started in the installed system, the changes
    are applied immediately. During the installation, however, the changes are recorded
    internally and applied later when the actual installation starts.'
