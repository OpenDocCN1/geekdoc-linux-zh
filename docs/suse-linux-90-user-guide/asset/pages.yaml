    the system and delivered to the user as an e-mail with a PDF attachment (PDF is
    a common exchange format for documents and can be read in virtually all operating
    systems with Acrobat Reader from Adobe). You can open open, read, and print the
    document in his mail program.


    For backup purposes, every received document is also stored on the hard disk in
    /var/spool/capisuite/users/<username>/received/. This directory can be accessed
    if anything goes wrong during the e-mail transmission of an e-mail message was
    accidentally deleted. More information can be found in the CapiSuite documentation
    in /usr/share/doc/packages/capisuite/manual/index.html.


    The command line tool capisuitefax is available for the sending of faxes. It accepts
    one or more target faxes one or more documents in the PostScript format. This
    format is generated by virtually all Linux applications when printing to a file.


    capisuitefax supports parameters such as the following:


    ```

    -h or --help Returns a short summary of valid parameters.

    -d <number> or --dialstring=<number>

    ```


    This parameter declares the target number to which the fax should be sent.


    -n or --nprefix Does not permit use of the number for external calls. If your
    ISDN adapter is connected to a phone exchange, you can use this option in order
    to send a fax to an internal number.'
