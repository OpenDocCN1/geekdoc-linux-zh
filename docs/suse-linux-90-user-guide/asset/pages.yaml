    Figure 3.22: Configuration of NFS Clients


    # 3.6.3 Configuration of a Samba Server


    Set up a Samba server to share resources such as files or printers with Windows
    hosts. In the first dialog, define the role of the Samba server. You can deactivate
    it, use it as file and print server, or use it as backup or primary domain controller.
    A file and print server makes directories and printers available. A domain controller
    enables its clients to log in to a Windows domain. The primary domain controller
    manages users and passwords. A backup domain controller uses another domain controller
    for authenticating the users. More information about Samba is available in the
    Administration Guide.


    After determining the use, enter the Windows domain or workgroup. Use ''Server
    Description'', enter a text to display all clients. Use ''Authentication Details''
    to enter an advanced configuration dialog in which set the user authentication
    mode. If you activate ''smbpasswd'', all users and their passwords are saved in
    the file smbpasswd. If you opt for LDAP, the information is stored on an LDAP
    server. Specify the LDAP server by entering the server name, Base DN, and Administration
    DN. Detailed information about LDAP is available in the Administration Guide.
    Test the LDAP connection with the respective button. Enter the LDAP administration
    password when required to do so.


    Complete all settings and click ''Next''. In the following dialog, define the
    resources. If you activate ''Share homes'', the home directories of the users
    appear as Windows shares on the clients. If you activate ''Share printers'', you
    can use ''Select'' to share individual printers.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# 3.6.4 Configuration of Samba Clients


    Configure a Samba client to access resources (files or printers) on the Samba
    server. In the ‘Samba Workgroup’ dialog, enter the domain or workgroup. Use ‘Browse’
    to display all available groups and domains and select one of them with a mouse
    click. If you activate ‘Also Use SMB Information for Linux Authentication’, user
    authentication is conducted via the Samba server. After specifying all settings,
    click ‘Finish’ to complete the configuration.


    # 3.6.5 NTP Client


    NTP (Network Time Protocol) is a protocol for synchronizing the clocks of network
    hosts. In the respective YaST module, select a type with ‘Add’. Several options
    are then displayed. ‘Server’ and ‘Radio clock’ are the most-used options. ‘Radio
    clock’ requires special hardware.


    If you select ‘Server’, enter the address of an NTP server when prompted. Normally,
    your system administrator does this for you. However, you can also enter one of
    the public NTP servers listed at http://www.eicis.udel.edu/~mills/ntp/servers.html.
    Confirm with ‘OK’.


    To start the NTP daemon when the system is booted, select ‘When booting system’.
    Save your settings with ‘Finish’.


    Consult the Administration Guide for more information.


    # 3.6.6 Routing


    This tool is only needed if you are located in a local network or are connected
    to the Internet by way of a network card, as is the case with DSL. As indicated
    in Section DSL on page 93, for DSL the gateway data is only needed to configure
    the network card correctly. The entries are dummies that do not have any function.
    The value is important only if you are located in a local network and use your
    own computer as gateway (the gateway to the Internet).


    # 3.6.7 Mail Transfer Agent


    This configuration module allows you to adapt your mail settings if you send your
    e-mail with sendmail, postfix, or the SMTP server of your provider. You can fetch
    mail via SMTP or the fetch program, which you can also enter the details of the
    POP3 server or IMAP server of your provider.'
  merge: -1
  pgno: 120
