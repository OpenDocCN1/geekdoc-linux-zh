  md: '# Manual Configuration


    If one of the requirements for automatic configuration is not met or you want
    a custom setup, configure the printer manually.


    Depending on how successful the autodetection is found in the database, YoST may
    be able to determine the right settings automatically or at least make a reasonable
    preselection.


    The following parameters must be configured:


    # Hardware Connection (Port) The configuration of the hardware connection depends
    on whether YoST has been able to find the printer during hardware autodetection.


    +   - If YoST is able to detect the printer model automatically, it is assumed
    that the printer connection works on the hardware level and no settings need to
    be changed in this respect.


    +   - If YoST is unable to autodetect the printer model, there may be some problem
    on the hardware level and some manual intervention is required to configure the
    connection. To learn about the steps involved in this, refer to the Administration
    Guide.


    Name of the Queue The queue name is used when issuing printer commands. The name
    should be relatively short and consist of lowercase letters and possibly numbers
    only.


    Ghostscript Driver or Printer Language (Printer Model) The Ghostscript driver
    and the printer language depend on your printer model. YoST lets you select a
    predefined configuration suitable for the model. Selecting a manufacturer and
    a model basically selecting a printer language and a Ghostscript driver suitable
    for this language with some default settings for the driver. These settings may
    then be changed in an additional dialog as needed.


    For non-PostScript models, all-printer specific data is produced by the Ghostscript
    driver. The driver configuration — both choosing the right driver and the correct
    options for it — is the single most important factor determining the output quality.
    The settings made at this point affect the printout on a queue-by-queue basis.


    If your printer was autodetected (using the printer database) or if the model
    has been selected manually, YoST presents a choice of suitable Ghostscript drivers,
    usually with a number of predefined configurations for each of them, for instance:'
