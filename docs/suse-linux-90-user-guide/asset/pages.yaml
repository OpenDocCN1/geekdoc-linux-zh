  md: '# 9.1 Starting KOrganizer


    Start KOrganizer from the main menu or with organizer. The main window has several
    toolbars, a menu bar, the date navigator with a month view of the calendar, the
    main part displaying the currently selected calendar view, and a list containing
    all the current to-do items. All the common program actions, as saving, printing,
    and creating or deleting events, can be performed from the menus. See Figure 9.1.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_223_0.png)


    Figure 9.1: Managing Your Schedule with KOrganizer


    # 9.2 Configuring KOrganizer


    To configure KOrganizer, select ''Settings'' → ''Configure KOrganizer...''. This
    opens a dialog in which to enter your name and e-mail address. When working with
    the program, the name is used to indicate who is the owner of a given-to item
    or event. The e-mail address is used to identify the owner of the calendar. A
    user who is not the owner can read the calendar, but not modify it. ''Send copy
    to owner when mailing events'' should be enabled if you want to receive a copy
    of every e-mail sent out by the program (in your name) to the attendees of an
    event.


    For KOrganizer to save your scheduling items automatically when exiting, check
    ''Enable automatic saving of calendar''. This also saves all changes automatically
    at a user-defined interval. To be prompted before any items are deleted, enable
    ''Confirm deletes''.'
