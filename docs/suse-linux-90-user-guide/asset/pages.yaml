  md: '# Quick Installation


    In the best case, a few clicks are sufficient to install SuSE Linux on your computer.
    If no Linux system was installed on your computer previously, your hard disk is
    automatically partitioned, an installed Windows system (95, 98, or ME) is resized,
    a software selection is installed, and your hardware is configured automatically.
    If you do not like the suggestions of the system assistant YaST (Yet another Setup
    Tool) or have special requirements for your system, change the individual installation
    suggestions manually as described in Chapter User-Defined Installation on page
    13.


    +   1.1 Step One: The Start Screen . . . . . . . . . . . . 8

    1.2 Step Two: Accept Suggestions . . . . . . . . . . . . 8

    1.3 Step Three: Installation . . . . . . . . . . . . . . . . . 9

    1.4 Configuration . . . . . . . . . . . . . . . . . 9'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 1.1 Step One: The Start Screen


    Turn on your computer and all connected hardware components and immediately insert
    CD 1 or the DVD in the respective drive. In the start screen, select an installation
    mode or boot an installed operating system. Following the successful installation,
    the CD only needs to be inserted in the drive occasionally to install additional
    software. As the CD can be forgotten in the drive, the option to boot the installed
    system is preselected. For installation, use the arrow keys to select ''Installation''.


    > Note

    If your computer does not boot from CD 1 or the DVD, read Section The Boot Screen
    on page 15.


    # 1.2 Step Two: Accept Suggestions


    After the system is booted from CD or DVD, the SuSE system assistant YaST will
    be started. First, select the language for your system. The language setting is
    automatically adopted for the keyboard layout. Then YaST checks your system. If
    you already installed a SuSE Linux version previously or if you select ''New installation'',
    the next dialog asks whether to install SuSE Linux from scratch or perform an
    update of your previous system.


    If Linux was not installed on your computer YaST checks all your hardware and
    list the result in the "suggestion dialog", shown in Figure 1.1 on page 10. This
    dialog also displays the partition-suggestion (possibly Windows will be resized)
    and the selected installation type. If installing Linux for the first time, you
    should accept these suggestions, which are usually suitable.


    The following messages and suggestions are displayed after the system check:


    **Mode** ''New installation'' is the default value here.


    **Keyboard** The keyboard layout defaults to the selected language. This can be-changed.


    **Mouse** The detected mouse type is listed here.


    **Partitioning** Suggests a suitable partitioning. If Windows 9x or ME (FAT32
    file system) exists on the hard disk, the resizing rate is indicated.'
  merge: -1
  pgno: 27
- img_proc: true
  md: "A default system with office applications is preset.\n\nBooting Determines\
    \ where SuSE Linux installs the boot manager. The Master Boot Record (MBR) of\
    \ the first hard disk is the default setting.\n\nTime Zone Depending on the selected\
    \ language settings, the time zone of the respective country is selected. Check\
    \ this setting as many languages are used in several countries.\n\nLanguage Shows\
    \ the language setting.\n\nModify the Ya\x19ST suggestions at any time by clicking\
    \ the respective heading. The dialogues displayed enable detailed settings. The\
    \ exact procedure is described in User-Defined Installation on page 13. After\
    \ the changes, you are returned to the overview and can proceed with the installation\
    \ using the modified values by clicking 'Accept'.\n\n> If the hardware was detected\
    \ correctly, you do not need to change anything. Do not change the boot loader,\
    \ partitioning, or hardware settings unless you know what you are doing.\n\n#\
    \ 1.3 Step Three: Installation\n\nStart the installation with the current settings\
    \ by clicking 'Yes' in the green window displayed by Ya\x19ST. Depending on the\
    \ performance of your computer, the complete installation of your system with\
    \ about 350 program packages takes approximately fifteen minutes.\n\n# 1.4 Configuration\n\
    \nFollowing the installation, specify some important settings before starting\
    \ using SuSE Linux. Detailed instructions are available in Finishing the Installation\
    \ on page 34 . First, set a password for the system administrator (user **root).\
    \ This special user is always configured by Ya\x19ST and is needed for system\
    \ maintenance tasks."
  merge: -1
  pgno: 28
- img_proc: true
  md: '![](img/024a6c3adc868dbb714281f5a6285cf8_29_0.png)


    > ### Caution

    Remember the root password as you can only modify the system or in-install programs
    using the root identity.


    If a network card or other communication hardware (such as a modem or ISDN card)
    is found during the installation, these can now be configured and connection be
    established with the Internet or a local network (LAN). This enables use of various
    services during the remaining part of the procedure.


    For example, if you configure an Internet connection, you will be able to perform
    an online update immediately. In this way, you can include the latest updates
    for your system.


    If you establish a connection with a local network, you can configure a name service
    such as NIS. Yeast assumes that you will not manage any local users on your system.
    This is usually the case with commercial workstations, whose users are administered
    centrally (e.g., on a department server). If you do not configure a name service,
    you can set up local users intended for normal operations on the system.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'An additional overview displays the detected screen, graphics card, and other
    hardware components (printer, sound card, etc.). If necessary, change settings,
    such as the suggested screen resolution or the color depth. Refer to Section Hardware
    Configuration on page 41 . Some of the dialogs for the configuration of the additional
    hardware are able to search for connected devices. However, these settings do
    not need to be specified at this stage. You can also skip this step and do it
    later. After the completion of this last step, your newly installed system is
    booted and you can start using it.


    Have a lot of fun with SuSE Linux!'
  merge: -1
