  md: '# KMail — The KDE Mail Application


    KMail is the KDE mail application. In addition to sending and receiving e-mail
    and using multiple mail protocols, it offers the possibility to configure several
    user-defined filters for sorting e-mail messages in individual folders. The encryption,
    decryption, and signing of e-mail messages can also be handled conveniently in
    KMail.


    +   15.1 Mail Formats . . . . . . . . . . . . . . . . . . . 246

    15.2 Access Types KMail . . . . . . . . . . . . . . . . . 246

