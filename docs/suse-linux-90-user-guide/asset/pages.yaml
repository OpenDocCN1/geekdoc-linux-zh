    scale).


    One of the most legendary (and expensive) analog synthesizer modules is the frequency
    shifter invented by H. Bode and built by R. A. Moog. This module was recently
    implemented as a LADSPA plug-in by S. W. Harris and is therefore available for
    AlsaModularSynth. In example_ams_demo_bode_mode.ams, the effect is applied to
