    new drive using the check box at the beginning of the line and complete the integration
    with ''Finish''. The new drive will be integrated in the system.


    # 3.4.2 Printer


    Linux Printing Basics

    A Linux system manages printers through printer queues. Before any data is printed,
    it is sent to a printer queue for temporary storage. From there, it is retrieved
    by a print spooler, which sends it to the printer device in the required order.


    However, for the most part this data is not available in a form that can be processed
    by the printer. A graphical image, for instance, first needs to be converted into
    a format the printer can understand. This conversion into a printer language is
    achieved with a printer filter, a program called by the print spooler to translate
    data as needed, so the printer can handle it.


    # Some Standard Printer Languages


    +   - ASCII text

    Every normal printer should at least be able to print ASCII text directly. However,
    there are devices that cannot print ASCII text directly, but are able to handle
    one of the other standard printer languages mentioned below.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '+   PostScript is the established printer language on Unix and Linux systems.
    Many programs produce PostScript output that can then be directly printed by a
    PostScript printer.


    +   PCL3, PCL4, PCL5e, PCL6, ESC/P, ESC/P2, and ESC/P raster


    If a PostScript printer is not available, the print filter can use the program
    Ghostscript to convert PostScript data into one of these other standard printer
    languages. Ghostscript uses different drivers for different printers to make use
    of specific features, such as color settings, offered by the various models as
    much as possible.


    # Processing a Print Job


    +   1. The user or an application generates a new print job.


    +   2. The print data is temporarily stored in the print queue. The print spooler
    sends it from there to the print filter.


    +   3. Now the printer filter performs the following steps:


    +   (a) It determines the type of print data.


    +   (b) The print data is converted into PostScript, if not in PostScript already-ready.
    ASCII text, for example, is normally converted into PostScript by the filter program
    a2ps.


    +   (c) If necessary, the PostScript data is converted to another printer language.


    +   ■ If the printer is a PostScript model, the PostScript data is sent directly
    to the printer.


    +   ■ If the printer is not a PostScript model, Ghostscript uses a driver suitable
    for the respective printer to generate the printer-specific data that is subsequently
    sent to the printer.


    +   4. After the entire print job has been sent to the printer, the print spooler
    removes the print job from the print queue.


    # Available Printing Systems


    SuSE Linux supports two different printing systems:'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'LPRng and lpdfilter is a traditional printing system that consists of the print
    spool LPRng and the printer filter lpdfilter. The entire configuration of this
    printing system is left to the system administrator. Regular users can only choose
    between the different print queues that have already been set up. To allow users
    to choose between different options for a given printer, a number of print queues
    must be defined, each with a different printer configuration.


    CUPS In the CUPS printing system, users can determine individual printing settings,
    as the entire configuration of a queue is not defined by the system administrator.
    Rather, printer-specific settings are stored in a PPD (PostScript Printer Description)
    file for each queue and can be offered to users in a print dialog.


    Because of conflicts between these two printing systems, you cannot have both
    installed at the same time.


    More information about CUPS is available at http://www.cups.org/ and in the Administration
    Guide.


    # Queues


    In most cases, more than one print queue is required for the following reasons:


    +   - Different printer devices must be addressed through different print queues.


    +   - The printer filter can be configured differently for each print queue. By
    having different queues for one printer, it can be operated with a different set
    of options. However, this is not required when using the CUPS printing system,
    because CUPS allows users to set options individually for each print job.


    One standard printer configuration is sufficient for plain black-and-white printers
    (such as most laser printers). However, color ink jet printers usually require
    at least two configurations (two queues):


    +   - A standard "lp" configuration for quick and inexpensive black-and-white
    printouts.


    +   - A color queue for color printing.'
