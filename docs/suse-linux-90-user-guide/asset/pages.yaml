    # 4.4.9 KSnapshot: Taking Screenshots


    With KSnapshot, you can create snapshots of your screen or special applications.
    Start the program from the main menu or from the command line with the command
    ksnapshot. The dialog window of KSnapshot consists of two parts (see Figure 4.9).
    The upper area (''Current Snapshot'') contains a preview of the current screen
    and two buttons for creating and saving the screenshots. In the lower part of
    the window, determine further options for the actual creation of the screenshot.


    To take a screenshot, use the drop-down menu ''Snapshot delay'' to determine the
    period in seconds to wait until the click on ''New Snapshot'' and the actual creation
    of the screenshot. If ''Only grab the window containing the pointer'' is active,
    only the window containing the pointer is ''photographed''. To save the screenshot,
    click ''Save Snapshot...'' and designate the directory and file name for the image
    in the following dialog. Use ''Print Snapshot...'' to print the screenshot.


    Figure 4.8: Desktop Sharing with Invitation by E-Mail


