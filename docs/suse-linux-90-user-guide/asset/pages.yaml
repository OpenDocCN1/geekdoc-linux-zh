  md: '# The Web Browser Konqueror


    Konqueror is not only a versatile file manager. It is also a modern web browser.
    If you start the browser with the icon in the panel, Konqueror opens with the
    web browser profile.


    +   11.1 Opening Web Pages . . . . . . . . . . . . . . . . . 220

    11.2 Saving Web Pages and Graphics . . . . . . . . . . . . . . . . 220

    11.3 Enhanced Web Browsing (Internet Keywords) . . . . . 221

    11.4 Bookmarks . . . . . . . . . . . . . . . . . . . . . . . . . 221

    11.5 Java and JavaScript . . . . . . . . . . . . . . . . . . . . . . . 222'
  merge: -1
