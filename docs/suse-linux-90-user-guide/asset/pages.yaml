  md: 'you reach the entries that cannot be expanded. These are the index listings
    of the pictures. Click an item to select it. If ''View Thumbnails'' is activated,
    the picture names and thumbnails are displayed in the right window pane. Otherwise,
    the names and an icon are displayed.


    Images in the right pane can be selected or deselected by clicking them. Select
    all images with ''Select'' → ''All'' or (Shift) + A. To save the selected images,
    the images, use the disk icon in the toolbar, select ''File'' → ''Save Selected
    Photos...'', or use the shortcut Ctrl + S. The ''Save'' dialog, shown in Figure
    21.2, has a number of options. Under ''What to Save'', select whether to save
    the thumbnails, images, or both. With ''Open image(s) with:'', you can save the
    image and open it in another program. To open the images in The GIMP immediately,
    enter gimp. Using the file names suggested by the camera is recommended.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_345_0.png)


    Figure 21.2: Saving Images'
