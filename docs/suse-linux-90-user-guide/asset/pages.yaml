    # Configuration for Applications


    Applications rely on the existing printer queues in the same way as any command-line
    tools do. There is usually no need to reconfigure the printer for a particular
    application and you should be able to print from applications using the available
    queues.


    Printing from the Command Line Print from the command line using command lpr -Plp
    filename, where filename is the name of the file to send to the printer. In this
    example, the default printer queue is used, but the -P option allows you to specify
    another queue. For instance, the command lpr -Color filename tells the printing
    system to use the color queue.


    Using the LPR Printing System With this printing system, applications use the
    lpr command for printing. In the application, select the name of an existing queue
    (such as color) or enter the respective print command (such as lpr -Color) in
    the print dialog of the application.


    Using the CUPS Printing System The CUPS printing system provides command-line
    tools, such as the lpr command, so the approach as described above works with
    CUPS, too.


    To enable the above for KDE programs, it is necessary to use the ''Print through
    an external program'' option in the print dialog. There are also several graphical
    tools, such as xpp and the KDE program printer, which provide a graphical interface
    to choose among queues and to change both CUPS standard options and printer-specific
    options as made available through the PPD file.


    If desired, configure applications to use kprinter as the standard printing interface
    by specifying kprinter or kprinter -stdin as the printing command in the respect
    dialogs of these applications. Which of the two commands to use depends on the
    behavior of the application. If this is set up in the correct way, the application
    should call the kprinter dialog whenever a print job is issued from it, so you
    can use kprinter to select the queue and to set other options. This requires that
    the application''s own print setup does not conflict with of kprinter and that
    the setup is left unchanged after kprinter has been enabled.'
