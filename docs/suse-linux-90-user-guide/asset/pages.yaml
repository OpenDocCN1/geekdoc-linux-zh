    Notes can easily be entered with the help of the mouse. First, choose the length
    of the note and any required accidental in the toolbar. Click to insert a note
    or right-click to insert a rest. The ‘Insert’ menu provides objects like clef,
    meter, and key. More information about NoteEdit is available in the directory
    /usr/share/doc/packages/noteedit.


    In Linux, there are several MIDI sequencers, some of which are very mature. For
