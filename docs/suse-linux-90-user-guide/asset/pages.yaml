- img_proc: true
  md: '# 22.1 The Kooka Window


    Start Kooka from the main menu or enter the command kooka. When started, Kooka
    opens a three-frame window with a menu bar to the upper left and a toolbar directly
    below it. All windows can be freely readjusted or rearranged with the mouse. It
    is also possible to completely detach single frames from the Kooka window for
    deliberate placement on the desktop. To move the frames, click and drag the thin
    double line above the frame. Any frame, except the main window, can be placed
    within any other frame aligned to the left, right, top, or centered. Centered
    windows have the same size, are stacked, and can be brought to the foreground
    with tabs.


    The ‘Image Viewer’ and the ‘Scan Preview’ frames share a window by default. Tabs
    allow switching between them. The left frame provides the gallery. This is a small
    browser for accessing the scanned images. The frame to the lower right is shared
    by the OCR (optical character recognition) and the thumbnails, which can be loaded
    into the image viewer with a simple click of the mouse. See Figure 22.1 on the
    next page.


    Selecting ‘Show Scan Parameters’ in the ‘Tool Views’ subentry of the ‘Settings’
    menu creates a third tab labeled ‘Scan Parameter’ next to the already existing
    ‘Image Viewer’ and ‘Scan Preview’ tabs in the main window. This is where the actual
    scanning parameters are set.


    # 22.2 The Preview


    A preview should always be created when the object to scan is smaller than the
    total scanning area. Set few parameters to the left of the preview frame. Select
    the scanning size with ‘Custom’ or one of the standard formats. See Figure 22.2
    on page 332. The ‘Custom’ setting is the most flexible, as it allows selection
    of the desired area with the mouse. Once the settings have been made, request
    the preview of the image to scan by clicking ‘Preview Scan’ on ‘Scan Parameter’.


    # 22.3 The Final Scan


    If you selected ‘Custom’ for the scanning size, use the mouse to select the rectangular
    area to scan. The selected area is confined by a dotted border.


    Click ‘Scan Parameter’ again. Choose between color and black-and-white scanning
    and set the resolution with the slider. See Figure 22.3 on page 333.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '![](img/024a6c3adc868dbb714281f5a6285cf8_350_0.png)


    Figure 22.1: The Kooka Main Window


    higher the resolution, the better the quality of the scanned image is. However,
    this also results in a correspondingly larger file and the scanning process can
    take very long time at high resolutions. Activate ''custom gamma table'' and click
    ''Edit'' to change the settings for brightness, contrast, and gamma. Once all
    settings have been made, click ''Final Scan'' to scan the image. The scanned image
    is then displayed in the image viewer and as a thumbnail. When prompted, select
    the format in which to save the image. To save all the future images in that same
    format, check the corresponding box. Confirm with ''OK''.


    #  22.4 The Menus


    Some of the functions of the toolbar are also available in the ''File'' and ''Image''
    menus. Modify preference settings for Kooka in ''Settings''.


    +   - Use this menu to start the Kprinter printing assistant, to create a new
    folder for your images, and to save, delete, and close files. The OCR results
    of a scanned text document can be saved. Also use this menu to close the Kooka
    application.'
