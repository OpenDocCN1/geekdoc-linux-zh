    # # Working with KPilot

    Synchronizing the data of KDE applications with those of the handheld computer
    is quite easy. Simply start KPilot then press the "HotSync" button on the cradle
    to start the sync operation.


    # ## 8.3.1 Backing up Data from the Handheld


    To a full backup, select ''File'' → ''Backup''. The backup will be performed the
    next sync operation. After that, switch back by selecting ''File'' → ''Hot-Sync''
    from the menu. Otherwise, the time-consuming full backup will be performed again
    during the next sync operation.


    After a full backup, all copies of the handheld''s programs and databases are
    found in ~/.kde/share/apps/kilot/DBBackup/<user>, where (user) is the name of
    the actual user as registered on the handheld.


    The two built-in KPlilot viewers can be used for a quick lookup of addresses or
    memos, but they are not designed to actually manage this data. The KDE applications
    mentioned above are much more suited for these tasks.


