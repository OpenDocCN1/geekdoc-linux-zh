    Figure 6.8: A Spreadsheet Example for Calc


    Calc offers many functions beyond the four fundamental arithmetic operations.
    A comprehensive list arranged in categories is available under ''Insert'' → ''Function...''.
    Any spreadsheet can be easily extended. For instance, to insert another row between
    Fuel and Sum, right-click the 5 button to the left and select ''Insert Row'' from
    the context menu. A new row is inserted before the current one and can immediately
    be used for additional input.


    Entering formulas in the above way is cumbersome when many cells are involved.
    For example, if you have several items in A column and want to add them, try the
    SUM function. In the field B6, enter the formula =SUM(B3:B5). An alternative possibility
    is to click the Sigma (Σ) icon next to the input line and enter the range manually.
    This formula adds all numbers from B3 to B5. You can also specify several ranges
    at once.


    As shown in the above formula, a range is defined by two cell addresses separated
    by a colon. By contrast, ranges are separated by semicolons. Accordingly, the
    formula = SUM(B3:B5;D3:D5) adds everything from B3 to B5 and D3 to D5. Basically,
    the formula is a short form of a longer one, which would read: B3+B4+B5+D3+D4+D5.


