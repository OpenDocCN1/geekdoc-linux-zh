  md: 'Easily create your own styles by formatting a paragraph or a character as desired.
    Use the ‘Character...’ and ‘Paragraph...’ items in the ‘Format’ menu to achieve
    the desired results. In the Stylist, click ‘New Style from Selection’ (to the
    right of the bucket symbol). Enter a name for your style and click ‘OK’. Now,
    you can use the newly created style on other parts of the document. Change details
    of the style easily by selecting it in the list, right-clicking, and selecting
    ‘Modify...’ from the menu. This opens a dialog in which all the possible properties
    are available for modification.


    # 6.6.5 Inserting a Table


    Create a table by clicking the ‘Insert’ icon in the main toolbar and keeping it
    pressed for a few seconds. This opens another toolbar in which to specify the
    object to insert. If you now move the mouse cursor to the third icon, see a grid
    open, as shown in Figure 6.6.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_200_0.png)


    If your table should have two columns and two rows, for instance, just run the
    mouse over that range of columns and rows to select them from the grid. When you
    release the button, the table is inserted into the document at the current cursor
    position.


    > The ‘Insert’ icon changes depending on the last object selected for insertion.
    This also means that you can now insert a table again with just a short click,
    without any need to reopen the pop-up toolbar.'
  merge: -1
