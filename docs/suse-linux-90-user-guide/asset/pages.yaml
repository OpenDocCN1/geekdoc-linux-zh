- img_proc: true
  md: '# The GNOME Desktop


    GNOME (GNU Network Object Model Environment) is a fast Linux desktop. The aim
    of its development was to make the user interface more uniform while streamlining
    the various aspects of the look and feel. The basic components for window management
    and other components enable data sharing among various applications and are based
    on a uniform operating concept and help system.


    +   5.1 The Desktop . . . . . . . . . . . . . . . . . . . . . . 158

    5.2 Settings . . . . . . . . . . . . . . . . . . . . . . . . 160

    5.3 File Management with Nautilus . . . . . . . . . . . 165

    5.4 Important Utilities . . . . . . . . . . . . . . . . . . . . 167'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# 5.1 The Desktop


    The most important elements of the GNOME desktop are the icons on the desktop,
    the panel at the lower border, and the desktop menu. The mouse is changed with
    most important tool.


    # 5.1.1 The Icons


    By default, the desktop features three symbols: your personal folder, the start
    dialog for the configuration of the desktop, and the trash can. If you double-click
    your personal folder, Nautilus starts and displays your home directory. More information
    about the use of Nautilus is available in Section File Management with Nautilus
    on page 65. All files deleted with Nautilus are sent to the trash can.


    Right-clicking an icon displays a menu offering file operations, like copying,
    cutting, or renaming. Selecting ''Properties'' from the menu displays a configuration
    dialog. The title of an icon as well as the icon can be changed with ''Custom
    icon''. The ''Emblems'' tab offers the possibility to add graphical descriptive
    symbols to the icon. The ''Permissions'' tab provides access to the access, read,
    and write permission settings for this file for the user, the group, or others.
    The ''Notes'' tab offers the management of comments. The menu for the trash can
    additionally features the ''Empty Trashcan'' option. This deletes its contents.


    To remove an icon from the desktop, simply move it into the trash. How-ever, be
    careful with this option — if you folder icons or files into the trash can, the
    actual data is deleted. If the icons only represent links to a file or to a directory,
    only the links are deleted.


    To create a link on the desktop to a folder or a file, access the object in question
    with Nautilus. Right-click the object and select ''Make Link''. Drag the link
    from the Nautilus window and drop it on the desktop.


    # 5.1.2 The Desktop Menu


    Right-clicking a free spot on the desktop displays a menu with various options.
    Select ''New Folder'' to create a new folder. Create a launcher icon for an application
    with ''New Launcher''. Provide the name of the application and the command for
    starting it then choose an icon to represent it. It is also possible to change
    the desktop background or reset it to its default setting.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# ### 5.1.3 The Panel


    The panel contains the window icons of all started applications in the taskbar.
    If you click the name of a window in the taskbar, it is moved to the foreground.
    If the program is already in the foreground, a mouse click minimizes it. Clicking
    a minimized application reopens the respective window.


    Beside the taskbar, the ''Workspace Switcher'' provides access to additional work
    areas. These virtual desktops provide extra space in which to arrange open applications
    and windows. For example, put an editor on one workspace, some shells on another,
    and your e-mail application and web browser on third.


    If right-click an empty spot in the panel, the menu opens, offering help information,
    and commands for GNOME and panels. Select ''Properties'' to open a configuration
    dialog in which to change the position and background of the panel. If desired,
    create additional panels or add launchers, tools, and various applets to the existing
    panels with ''Add to Panel''. Use drawers to organize your favorite applications
    or important documents. The contents are only displayed when the drawer is opened
    with a single click. Right-click the drawer and select ''Properties'' to modify
    its size and appearance. Click the icon to change it. Remove panel elements by
    right-clicking the respective icons and selecting ''Remove move''.


    # ### 5.1.4 The Main Menu


    Open the main menu by means of the icon to the far left of the panel. Apart from
    the applications, which are organized in categories, find default functions, such
    as ''Log out'' and ''Lock screen''. Use ''Open Recent'' to gain quick access to
    recent files. Use ''Search for Files'' to find files.


    With ''Run Program...'' enter and run a command, for example, for starting a program
    instead of navigating through the various menus. From the main menu, you can also
    start the ''GNOME Control Center'' for configuring the desktop or Yacht for installing
    additional software.


    # ### 5.1.5 Handling Floppy Disks, CDs, or DVDs


    To access floppy disks, CDs, or DVDs, insert the medium in the appropriate drive.
    Right-click an empty spot of the desktop and select the desired medium from the
    ''Drives'' list. A floppy disk or CD icon appears. Double-clicking the icon launches
    Nautilus, which displays the contents of the medium. Copy files to your personal
    home directory by dragging and dropping. Copy files to a floppy disk in the same
    way.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '> Caution

    Do not simply remove floppy disks from the drive after using them. Floppy disks,
    CDs, and DVDs must always be unmounted from the system first. Close all Nautilus
    sessions still accessing the medium then right-click the icon for the medium and
    select ''eject'' from the menu. Then safely remove the floppy disk or CD (the
    tray opens automatically). The icon disappears from the desktop.


    Floppy disks can also be formatted from the floppy disk menu. In the dialog box,
    choose the format and density of the floppy disk. ''file system type'' offers
    a choice between ''Linux native (ext2)'', the file system for Linux, and ''DOS
    (FAT)'', because Windows cannot access Linux file systems. Help provides some
    instructions for the tool.


    # 5.2 Settings


    The GNOME desktop can be customized according to your preferences and needs. If
    this ''Start Here'' icon on the desktop is not visible, start Nautilus by right-clicking
    the desktop then selecting ''New Window''. Under ''Location'', enter preferences
    : //. Open the various configuration dialogs by double-clicking the respective
    icons.


    > Tip

    In the individual modules, access specific help for the options with ''Help''.
    The system immediately adopts every change made in a configuration module.


    # 5.2.1 Keyboard


    In the ''Keyboard'' module, determine settings such as the repeat rate and sound
    events associated with your keyboard. The module consists of the ''Keyboard''
    and ''Audio'' tabs. Use the ''Audio'' tab to configure an audio signal for your
    keyboard. When a key is pressed, activate the corresponding radio button. Exit
    the ''Keyboard'' module with ''Close'' or go to the accessibility module with
    ''Accessibility''. The functionality of this module is described in Section Accessibility
    on page 163.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# 5.2.2 Mouse Configuration


    The mouse configuration consists of three tabs: ''Buttons'', ''Cursor'', and ''Motion''.
    The configuration options of the ''Buttons'' tab refer to the ''Mouse Orientation''.
    Left-handed users should activate ''Left-handed mouse'' to swap the right and
    left mouse buttons. Use the slider to determine the maximum delay (in seconds)
    between two clicks that the system should interpret as a double-click.


    The appearance and size of the cursor can be changed under the ''Cursor'' tab.
    Four different settings are available. Changes are not activated until the next
    login. Under ''Locate Pointer'', activate an option that causes the cursor to
    be highlighted when you press the Ctrl key, enabling you to find it easily.


    Under ''Movement'', set the ''Acceleration'' and ''Sensitivity'' of the screen
    cursor.


    # 5.2.3 Menu and Toolbars


    The settings in this module affect the menus and toolbars of all GNOME-compatible
    applications. Centrally control all GNOME toolbars from here. Select for toolbar
    icons to be displayed as ''Text Only'', ''Icons Only'', Text Beside Icons, or
    ''Text Below Icons''. The default setting is ''Text Only''.


    Activate Toolbars can be detached and moved around to allow the detachment of
    the toolbar from all other window elements and allow its free positioning on the
    desktop. This makes a grabbing area appear on the left side of the toolbar. Clicking
    and holding this area relocates the toolbar.


    Every menu entry in any application menu can be displayed with the corresponding
    icon. Activating ''Show icons in menus'' tests the settings with the provided
    example menu.


    # 5.2.4 Screensaver


    The module for configuring the screensaver is subdivided into two tabs: ''Display
    Modes'' and ''Advanced''. Select the screensaver in ''Display Modes''. The ''Advanced''
    tab contains a few special options that normally do not need to be modified.


    Select the screen saver mode under the ''Display Modes'' tab. Choose from ''Random
    Screen Saver (random selection of screen savers from a custom-defined list), ''Only
    One Screen Saver'', ''Blank Screen Only'', or ''Disable Screen Saver''.


    Select one or more screensavers from the list for the operating modes ''Only One
    Screen Saver'' or ''Random Screen Saver''. The currently selected ''Preview''
    button launches a'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'fullscreen preview run of that screensaver, which can be aborted by pressing
    any key. Select the previous or following screensaver for preview by clicking
    the corresponding triangles below the selection list.


    In the last step, determine after long the screen should be made completely black
    (''Blank After''), the screen saver module should be changed (''Cycle After''),
    or the screen should be locked (''Lock Screen After''). All time references are
    given in minutes.


    # 5.2.5 Windows


    This module controls the behavior of application windows. Determine how the window
    should react to contact with the mouse pointer or to double-clicks on its title
    and define the key hold for moving an application window.


    When several application windows populate the desktop, the active one, by default,
    is the one last clicked. Change this behavior by activating ''Select windows the
    mouse moves over them''. If desired, activate ''Raise selected window after an
    interval'' and adjust the latency time with the slider. This activates a window
    only when the cursor was placed within the window for a time exceeding the set
    latency.


    Application windows can be shaded by double-clicking the title bar, leaving only
    the title bar visible. This saves space on the desktop and is the default behavior.
    It is alternatively possible to set windows to maximize when the title bar is-clicked.


    With the radio buttons, select the modifier key to press for moving a window.
    The possible choices are `Ctrl`, `Alt`, and the `Windows` key.


    # 5.2.6 Background


    Determine a background for your desktop. By default, the changes made here are
    applied to all virtual desktop. If you do not want any background picture, click
    ''No Picture'' and define a background style. The drop-down menu offers a horizontal
    gradient, a vertical gradient, or no gradient at all. Use ''Color'' to define
    the desired colors in the color editor.


    To use an image as a background picture, drag and drop it from the file manager
    to the ''Select picture'' field in the module dialog. Alternatively, click ''Select
    picture'' to open a dialog in which to select the desired image.


    ''Picture Options'' determines what processing steps should be applied to the
    selected image to adapt it optimally to the current screen resolution. The options
    are ''Wallpaper'', ''Centered'', ''Scaled'', and ''Stretched''.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# 5.2.7 Font


    This module determines the font to use for the desktop. In a second step, enable
    optional effects for the improvement of the font quality. The upper part of the
    dialog window features four buttons holding the fonts selected for ''Application-font'',
    ''Desktop font'', ''Window title font'', and ''Terminal font''. Click one of the
    buttons to open a selection dialog in which to select the font family, style,
    and size. The options for ''Font Rendering'' and the additional configuration
    options accessible through ''Details'' are set to optimal values by default.


    # 5.2.8 Theme


    The style for all control elements on the desktop and of GNOME applications is
    set here. There is a choice of various preinstalled themes. Selecting a style
    in the list view makes GNOME apply automatically. ''Details'' opens another dialog
    in which to customize the style of single desktop elements, like window content,
    window borders and icons. Making changes and leaving the dialog with ''Close''
    switches the theme to ''Custom theme''. Click ''Save theme'' to save your modified
    theme under a custom name. The Internet and other sources provide many additional
    themes for GNOME as .tar.gz files. Install these with ''Install theme''.


    # 5.2.9 Accessibility


    The settings of this module facilitate the use of the keyboard for users with
    motion impairments. The module consists of the three tabs ''Basic'', ''Filters'',
    and ''Mouse''. Before modifying settings, activate ''Enable keyboard accessibility
    features''.


    Features The keyboard accessibility functions can be deactivated automatically
    after a certain time. Set an appropriate time limit measured in seconds with the
    slider. The system can additionally provide audible feedback when the keyboard
    accessibility functions are activated and deactivated.


    Enable Sticky Keys Some keyboard shortcuts require that one is kept constantly
    (this applies to all, Ctrl or Shift keys) while the rest of the shortcut is typed.
    When ''sticky'' keys are used, the system regards those keys as pressed after
    being hit once. For an audible feedback generated each time a modifier (Ctrl or
    Alt) is pressed, activate ''Beep when modifier is pressed''. If ''Disable'' if
    two keys pressed together is selected, the keys do not stick anymore once two
    keys are pressed simultaneously.'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'The system assumes that the keyboard shortcut has been completely entered.


    **Repeat Keys** Activate ''Repeat Keys'' to make settings with sliders for ''Delay''
    and ''Speed''. This determines how long a key must be pressed for the automatic
    keyboard repeat function to be activated and at what speed the characters are
    typed.


    Test the effect of the settings in the field at the bottom of the window. Choose
    parameters that reflect your normal typing habits.


    **Enable Slow Keys** To prevent accidental typing, set a minimum time limit that
    a key must be pressed and held before it is recognized as valid input by the system.
    Determine whether audible feedback should be provided for keypress events, accepted
    keypresses, and the rejection of a keypress.


    **Enable Bounce Keys** To prevent double typing, set a minimum time limit for
    accepting two subsequent keypress events of the same key as the input of two individual
    characters. If desired, activate audible feedback upon rejection of a keypress
    event.


    **Toggle Keys** It is possible to request audible feedback from the system when
    a keycap modifier key is pressed.


    **Mouse** Activates the keyboard mouse — the mouse pointer is controlled with
    the arrow keys of the num pad. Use the sliders to set the maximum speed of the
    mouse pointer, the acceleration time until the maximum speed is reached, and the
    latency between the pressing of a key and the cursor movement.


    # 5.2.10 Keyboard Shortcuts


    This module is used for managing global keyboard combinations. It is possible
    to determine the keyboard combinations to use during text input and for objects
    on the desktop.


    The list overview window displays a list of all currently available actions along
    with their keyboard shortcuts. Deactivate or change a shortcut by clicking the
    corresponding shortcut entry. Enter a new shortcut or delete the current one with
    `Delete`. All changes take effect immediately. Restore the current keyboard shortcut
    by clicking its entry and leaving the dialog with ''Close''.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# 5.2.11 Sound (system alerts)


    This module allows the association of certain system events and application alerts
    with characteristic audio signals. The dialog box consists of two tabs (''General''
    and ''Sound Events''). The two check boxes in the ''General'' tab must be activated
    to use audio signals for certain desktop events.


    In the second tab, determine which events and application alerts should be associated
    with which sounds. All sounds already defined for applications are listed. Test
    a sound by first selecting the corresponding notice in the ''Event'' column then
    clicking ''Play''. Change the sound by clicking ''Event'' then ''Browse''. The
    dialog that appears right below from which to choose. Close it with ''OK''.


    # 5.3 File Management with Nautilus


    Nautilus is the file manager and viewer of GNOME. The following section provides
    an overview of the basic functions of Nautilus as well as a few tips on its configuration.
    More information can be found in the help pages for Nautilus.


    # 5.3.1 Navigating in Nautilus


    Nautilus has a navigation behavior similar to most web browsers. Open a new window
    by right-clicking a free area of the desktop then selecting ''new window''. Alternatively,
    double-click the personal folder.


    The standard window is shown in Figure 5.1 on the following page. Use the icons
    in the toolbar to move forward and backward, to move one level up in the directory
    tree, to stop a loading, to reload the document, or go to the preferred starting
    point. ''Location'' shows the path to the current directory or to the current
    folder. A different path can be directly entered.


    The left sidebar contains the current object and some information about it. A
    drop-down menu is located right above the sidebar and is set by default to ''Information''.
    It is however, possible to switch this to other display modes:


    Tree The Tree view shows the complete directory tree of the system.


    History The ''History'' view lists objects that have been accessed previously.


    Emblems The ''Emblems'' view presents all available emblems. These are used for
    marking files, for instance, as art. To mark a file as art, drag the ''art'' emblem
    to the file and drop the emblem on top of the file. Emblems are removed by dropping
    the Eraser emblem over a file.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '![](img/024a6c3adc868dbb714281f5a6285cf8_185_0.png)


    Notes ‘Notes’ is useful for managing personal information about objects. These
    notes are saved along with the object.


    Nautilus tries to select appropriate icons for objects according to their associated
    file information. Image and text files are shown as a thumbnail. Double-clicking
    shows the file in a viewer. The left sidebar in its ‘Information’ view shows a
    list of applications with which the file can be opened. The file cannot be processed
    directly with Nautilus.


    Nautilus also manages bookmarks. Access the ‘Bookmarks’ menu to edit, access,
    or create your bookmarks.


    # 5.3.2 File Management


    Nautilus supports dragging and dropping for managing files. To move files from
    one directory to another, use ‘New Window’ from the context menu or ‘File’ menu
    for opening two windows. Access the path of the original location of the objects
    in one window and access the destination path for those files in the second window.
    To move the files, drag the files from one window to the other and drop them.
    Copying files is a little more complicated. Right-click the object to copy and
    select ‘Duplicate’. Then move the copy to the new directory. The context menu
    that appears when right-clicking an object provides functions for renaming files
    and other tasks.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# 5.3.3 Configuring Nautilus


    Nautilus retrieves its default font and other preferences from the desktop configuration.
    To set Nautilus-specific preferences, select ''Edit'' → ''Preferences'' in any
    Nautilus window. The configuration dialog offers four tabs: ''Views'', ''Behavior'',
    ''Icon Captions'', and ''Preview''.


    The ''Views'' dialog allows switching the ''Default View'' by ''Icon View'' and
    ''List View''. A sorting order can be set for any of these options.


    The ''Behavior'' dialog allows choosing between single-click and double-click
    response and also sets the handling of executable files. These can either be started
    on activation or the content displayed. The operating mode of the trash is set
    here. Activate a confirmation dialog before deletion, if desired. Include a Delete
    command that bypasses trash'' can also be set. The files are immediately deleted
    if this option is activated.


    The ''Icon Captions'' dialog features three options for determining what information
    should be displayed for icons and how it should be displayed. In the ''Preview''
    dialog, select whether to activate preview thumbnails for certain file types.


    # 5.4 Important Utilities


    GNOME features a wealth of applets and applications. This section merely provides
    an introduction to some of the most useful and interesting, all of which are compatible
    with the GNOME configuration scheme.


    # 5.4.1 Dictionary


    Dictionary is a useful applet for checking the spelling and the meaning of words.
    An Internet connection is required, as this applet accesses an online dictionary.


    Enter the term to look up in the ''Word'' field. The menu under ''Dictionary''
    gives a choice between ''Look Up Word'' and ''Check Spelling''. By default'
  merge: -1
  pgno: 186
- img_proc: true
  md: "![](img/024a6c3adc868dbb714281f5a6285cf8_187_0.png)\n\n# ## 5.4.2 Managing\
    \ Archives with File Roller\n\nIn GNOME, manage file archives with File Roller.\
    \ This application is able to handle archives of the following types: .tar, .tar.gz,\
    \ .tgz, .tar.bz, .tar.bz2, .tar.Z, .zip, .lha, .rar, .l2h, .ear, .jar, and .war.\
    \ Easily view archive contentsfrom File Roller with other applications without\
    \ having to decompress the archives. File Roller supports drag and drop, allowing\
    \ you to drag file icons from the desktop or from the file manager (Nautilus)\
    \ to the File Roller dialog and drop them there.\n\nTo create a new archive, select\
    \ 'Archive' → 'New'. In the next dialog, specify the directory in which to create\
    \ the new archive in the left window. Enter the file name of the new archive in\
    \ the input field below the file extension. Determine the archive type with the\
    \ drop-down menu above the name field. Exit the dialog with 'OK' and return to\
    \ the main view of File Roller. Now, fill the archive by inserting files from\
    \ the desktop or the file manager with drag and by selecting 'Edit' → Add Files.\
    \ In the following dialog, select one or several files (keep Ctrl pressed to select\
    \ multiple files) or directories. If necessary, determine the following advanced\
    \ options for the archive: \n\n**Add only if newer** If the archive already contains\
    \ a file with the same name, the file is only added if it is newer than the one\
    \ existing in the archive."
  merge: -1
