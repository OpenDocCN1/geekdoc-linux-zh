  md: '# 19.1 Watching TV with motv


    motv is an improved successor to xawtv. It incorporates all essential functions
    into the user interface. Start the application with ''SuSE'' → ''Multimedia''
    → ''Video''. Start it at the command line with motv. Initially, only a TV window
    appears after the application starts. Open a menu window by right-clicking.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_331_0.png)


    Figure 19.1: The TV Application motv


    # 19.1.1 Video Source and Network Search


    In ''Settings'' → ''Input'', select the video source. If you select ''Television''
    here set up the broadcasting network before starting the application. This automatically
    takes place with the network search, also found under the ''Settings'' menu. If
    you click ''Save settings'', the network found is entered into the .xawtv file
    in your home directory and will be available the next time you start the application.


    > Tip If you do not want to browse for all available channels, find the next channel
    with (Ctrl) + ↑. If needed, subsequently adjust the broadcast frequency with ←
    or →'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# 19.1.2 From Silent Film to Sound Film


    The audio output of the TV is connected to the line input of your sound card,
    to the speakers, or to an amplifier. Some TV cards can change the volume of the
    audio output. The volume can be set with the sliders that appear after selecting
    ''Settings'' -> ''Slider''. This box also provides the sliders for brightness,
    contrast, and color.


    Use your sound card for audio playback, check the mixer settings using gmixx,
    described in Section Mixers on page 284 . For sound cards meeting the AC97 specifications,
    set ''Input-MUX'' to ''Line''. The volume can then be adjusted with the ''Master''
    and ''Line'' sliders.


    # 19.1.3 Screen Proportions and Full-Screen Mode


    Most television images have a height and width ratio of 4:3. These proportions
    can be set with ''Tools'' -> ''Screen Dimensions''. If ''4:3'' is selected (this
    is the default setting), the screen dimensions are retained automatically, even
    when the display size is changed.


    With F or ''Tools'' -> ''Fullscreen'', switch to full-screen mode. If the TV image
    in full-screen mode is not scaled to the full monitor size, fine-tuning is required.
    Many graphics cards can scale the full-screen mode television image to the full
    monitor size without changing the graphical mode. If your card does not support
    this function, the graphics mode must be switched to 640x480 for the full-screen
    mode. Create the related configuration in ''Settings'' -> ''Configuration''. After
    restarting motiv, the monitor mode is also changed if you have switched to full-screen
    mode.


    > Tip

    The xawtv file is created automatically and updated by clicking ''Settings'' ->
    ''Save settings''. Here, the broadcasters are saved along with the configuration.
    More information pertaining to the configuration file can be found in the man
    page for xawtvrc.


    # 19.1.4 The Launcher Menu


    Use the launcher menu to start other applications to use with motiv. Start the
    audio mixer gmixx and the text application olev, for example, using'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'keyboard shortcut. Applications to launch from motv must be entered in the

    .xawt file. The entries should look like this:


    Gamix = Ctrl+G, gamix AleVT = Ctrl+A, alevt


    The shortcut then the command used to start the application should follow the

    application name itself. Start the applications entered under [launch] via the

    Tool menu.


    # 19.2 Video Text with alevt


    Use alevt to browse video text pages. Start the application line via ‘SuSE’ →
    ‘Multimedia’ → ‘Video’ → ‘alevt’ or at the command line with alevt.


    The application saves all the pages of the selected section just activated with

    motiv. Pages can be browsed by entering the desired page number or by clicking

    page number. Move forward or backward through the pages by clicking ‘<<’

    or ‘>’’, located in the lower window margin.


    # 19.3 Webcams and motiv


    If your webcam is already supported by Linux, access it with motiv. Find a sum-mary
    of the supported USB devices at http://www.linux-usb.org. If you

    already used motiv to access the TV card prior to accessing the webcam,

    btv driver is loaded. The webcam driver is loaded automatically when

    y webcam is connected to the USB. Start motiv at the command line with the

    parameter -c /dev/video1 to access the webcam. Access the TV card with

    motiv -c /dev/video0.


    When connecting the webcam to the USB before the btv driver has

    been automatically loaded (for example by starting a TV application),

    /dev/video0 is reserved for the webcam. In this case, if you start motiv with

    the -c /dev/video1 parameter to access the TV card, you might get an er-ror message,
    because the btv driver was not automatically loaded. Solve this

    problem by loading the driver separately with modprobe btv as the user

    root. Acess an overview of the configurable video devices on your system with

    motiv -hwscan.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# 19.4 nxtvepg — The TV Magazine for Your PC


    From some broadcasters, an EPG signal (Electronic Program Guide) is transmitted
    with the video text signal. Easily view this electronic guide using the program
    nxtvepg. To do this, however, you must have a TV card supported by the btv driver
    and be able to receive one of the channels broadcast with an EPG.


    With nxtvepg, the broadcasters are sorted according to channel and topic, such
    as ''movie'' and ''sport'', and filtered according to criteria, such as ''Live'',
    ''Stereo'', or ''Subtitle''. Start the application via the ''SuSE'' → ''Multimedia''
    → ''Video'' menu or at the command line with nxtvepg.


    # 19.4.1 Importing the EPG Database


    To set up and update the program database via the EPG signal, the tuner of your
    TV card to a station that broadcasts EPG. This can be done using a TV application,
    such as mov or nxtvepg. Only one application at a time can access the tuner.


    If you set an EPG broadcaster in mov, nxtvepg immediately begins importing the
    current list of TV programs. The progress will be displayed.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_334_0.png)


    Figure 19.2: The Electronic TV Magazine nxtvepg'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'If you have not started a TV application, nxtvepg search for EPG broadcast-ers.
    To do this, use ‘Configure’ → ‘Provider scan’. Use .xatv is activated by default.
    This indicates that nxtvepg is accessing the broadcasters saved in this file.


    > Tip

    If there are problems, check to see if the proper video source has been chosen
    under ‘TV card input’.


    Select from the EPG providers found in ‘Configure’ → ‘Select Provider’. ‘Configure’
    → ‘Merge Providers’ even creates flexible associations between the various provider
    databases.


    # 19.4.2 Sorting the Programs


    nxtvepg provides a convenient filter function for managing even the most ex-tensive
    program offerings. Activate a network selection list with ‘Configure’ → ‘Show
    networks’. The ‘Filter’ menu offers plenty of filter functions. Right-click the
    program list to open a special filter menu in which to activate contextual filter-ters.


    Of particular interest is the ‘Navigate’ menu. This is built directly from the
    EPG data. It will appear in the language provided by the network.'
  merge: -1
