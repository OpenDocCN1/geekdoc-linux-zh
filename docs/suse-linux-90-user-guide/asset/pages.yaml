  md: '# 6.6 Word Processing with OpenOffice.org Writer


    # 6.6.1 Creating Texts with the AutoPilot


    To use a standard format and predefined elements for your own documents, try AutoPilot.
    This is a small utility that lets you make some basic decisions then produces
    a ready-made document from a template. For instance, to create a business letter,
    select ''File'' → ''AutoPilot''. In the submenu, select ''Letter...''. This opens
    the dialog as shown in Figure 6.3.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_197_0.png)


    Figure 6.3: The OpenOffice.org AutoPilot


    Click ''Next'' in each page to proceed to the next one. To modify any previous
    entries, use ''Back''. When finished, click ''Create'' to generate the letter
    according to your specifications. Exit the dialog with ''Cancel''. Access a help
    document with ''Help''.


    When finished, click ''Create''. OpenOffice.org produces a letter according to
    your specifications. Now, compose the text (body) of the letter itself. AutoPilot
    is not limited to letters, but can also assist in the creation of faxes, memos,
    and presentations.


    # 6.6.2 Creating Texts without the AutoPilot


    Create a new text document by selecting ''File'' → ''New'' → ''Text Document''.
    When editing a text document, a second toolbar, the object bar, is available just
    below the standard function bar. Move the mouse pointer over an icon to get a
    short help text. Documents can also be formatted with the Stylist, which is described
    in Section Working with the Stylist on the next page.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# ### 6.6.3 Selecting Text


    To select text, click the desired beginning of the selection, and keeping the
    mouse button pressed, move the cursor towards the end of the range (which can
    be characters, lines, or entire paragraphs). Release the button at the end of
    the desired selection. While selected, text is displayed in inverted colors. Open
    a context menu by right-clicking the selection. Use the context menu to change
    the font, the font style, and other text properties.


    The Navigator displays information about the contents of a document. It also enables
    you quickly jump to the different elements included. For example, use the Navigator
    to get a quick overview of all the chapters or to see a list of the images included
    in the document. Figure 6.4 shows the Navigator in action. The elements listed
    in the Navigator vary according to the document loaded in Writer. Open the Navigator
    by selecting ''Edit'' → ''Navigator''.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_198_0.png)


    Figure 6.4: The Navigator in Writer


    # ### 6.6.4 Working with the Stylist


    The Stylist can help you format text in a number of ways. It can be opened or
    closed at any time by toggling ''Format'' → ''Stylist'' or by pressing (F11).
    The dialog window of the Stylist is shown in Figure 6.5 on the next page.


    If you set the drop-down list at the lower edge of the Stylist to ''Automatic'',
    OpenOffice.org tries to offer a selection of styles adapted to the task at hand.
    On the other hand, if you select ''All'' in the drop-down list, the Stylist offers
    all styles from the currently active group. Groups are selected with the buttons
    at the top. Text can be hard-formatted or soft-formatted:'
  merge: -1
  pgno: 198
- img_proc: true
  md: '![](img/024a6c3adc868dbb714281f5a6285cf8_199_0.png)


    **Hard Formatting** Formatting properties are *directly* assigned to a text range
    and each property must be applied to each range by hand. The assign-ment is static
    and can only be changed manually. This is only recommended for short documents.


    **Soft Formatting** With this method, text is not formatted directly. It has a
    style applied to it. The style itself can be modified quite easily. Modifying
    a style automatically results in a formatting change of all the text to which
    it is assigned.


    This approach has many advantages when creating larger documents (theses, books,
    and the like). Although not intuitive, it is very efficient and fast if the formatting
    needs to be changed extensively and consistently. Using this method also makes
    it much easier to try different layouts with the document. Define the format of
    paragraphs, pages, and frames for a style and select fonts and numbering methods.


    To assign a style to a paragraph select the style and click the paintbucket icon
    in the Stylist. Click the paragraphs to assign the style. Pressing or clicking
    the paintbucket icon again turns off the function.'
  merge: -1
  pgno: 199
