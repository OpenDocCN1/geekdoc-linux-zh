    the editor. Go to ''Signature'' →Generate Signature'' and select the file to sign
    from the file dialog. Then designate the secret key to use and enter the associated
    password. KGPG informs you about the successful generation of the signature. Files
    can also be signed from the editor by simply clicking ''Sign/verify''. To check
    a signed file, go to ''Signature'' → ''Verify Signature'' and select the file
    to check in the following dialog. As soon as you confirm the selection, KGPG checks
