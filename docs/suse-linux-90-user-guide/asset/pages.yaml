  md: '# 18.2.6 Mixer Parameters of Soundblaster Livel and Audigy


    Apart from the parameters of the ''AC97'' standard, there are many additional
    options for Soundblaster Livel and Audigy cards. The controls ''AC97'', ''Wave'',
    and ''Music'' are used for playback. ''AC97'' can be used to adjust the level
    of the ''AC97'' mix This mix also receives input from the ''line'', ''mic'', and
    ''CD'' signals. ''Wave'' adjust the level of the PCM channels. ''Music'' controls
    the volume of the internal wavelet synthesis of MIDI data.


    Apart from the ''Capture'' parameter for recordings, the ''AC97 Capture'' control
    is used to control the level of the ''AC97'' recording sources. ''Wave'' and ''Music''
    level can be selected as recording source. This internal loopback capture can
    be activatedthe ''AC97'' standard by selecting the ''Mix'' control as recording
    source.


