  md: '# 3.1 Starting YoST


    System configuration with YoST is conducted by means of various YoST modules serving
    different purposes, such as the configuration of the keyboard or the selection
    of the system language. These modules can be accessed in various ways. An overview
    of all modules is available in YoST Control Center, which can be started from
    ‘SUSE’, the SUSE icon at the bottom left of the KDE panel. Select ‘SUSE’ → ‘System’
    → ‘YoST’. The individual modules can also be accessed from the KDE Control Center.


    If you use KDE, you can also start YoST by pressing `Alt` + `F2`. In the window
    that opens, enter `kdes /sbin/yast2` and confirm with `J`.


    As these start methods are usually used by a normal user, YoST opens a small dialog
    for entering the root password. root privileges are required for all YoST modules,
    as only this user is permitted to modify the Linux system files.


    If, for any reason, YoST cannot be started as described above, it can be started
    from the command line. In the shell, change to the user `root` with `su`. Enter
    the root password and run the command `yast2`.


    > Tip

    To change the language of YoST, select ‘System’ → ‘Select Language’ in the YoST
    Control Center. Choose a language, exit the YoST Control Center, log out of your
    computer, log in and restart YoST.


    # 3.2 The YoST Control Center


    When you start YoST in the graphical mode, the YoST Control Center, as shown in
    Figure 3.1 on the facing page, opens. The left frame features the categories ‘Software’,
    ‘Hardware’, ‘Network Devices’, ‘Network Services’, ‘Security & Users’, ‘System’,
    and ‘Miscellaneous’. If you click one of icons, the respective contents are listed
    on the right-hand side. For example, if you select ‘Hardware’ and click ‘Sound’
    to the right, a configuration dialog opens for the sound card. The configuration
    of the individual items usually comprises several steps. Press ‘Next’ to proceed
    to the following step.


    The left frame displays help text for the respective topic, explaining the entries.
    After making the needed settings, complete the procedure by pressing ‘Finish’
    in the last configuration dialog. The configuration is then saved.'
  merge: -1
  pgno: 67
