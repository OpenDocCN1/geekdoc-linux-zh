  md: '# 2.1 Starting Your System from the CD-ROM


    Insert the first SuSE Linux CD or the DVD into the drive. Then reboot the computer
    to start the installation program from the medium in the drive.


    # 2.1.1 Possible Problems When Starting from the CD/DVD


    If you experience problems booting from CD 1, one of the following items is probably
    the case. Resolve the problem as described.


    +   * The CD-ROM drive is not able to read the boot image on the first CD. In
    this case, use CD 2 to boot the system. CD 2 contains a conventional 2.88 MB boot
    image, which can be read even by older drivers.

    * The boot sequence in the BIOS (Basic Input Output System) is incorrect. The
    BIOS is a software for activating the basic functions of a computer. Motherboard
    vendors provide a BIOS that is adapted to the hardware Information about changing
    the BIOS settings is provided in the documentation of your motherboard and in
    the following paragraphs.

    Normally, the BIOS setup can only be accessed at a specific time — when the machine
    is booting. During this initialization phase, the machine performs a number of
    diagnostic hardware tests. One of them is a memory check, recognizable from the
    memory counter. When the counter appears, look for a line, usually below the counter
    or somewhere at the bottom, mentioning the key to press to access the BIOS setup.
    Usually the key to press is Del(Del), F1, or Esc. Press this key until the BIOS
    setup screen appears.

    To change the boot sequence in an AWARD BIOS, look for the ''BIOS FEATURES'' entry.
    Other manufacturers may have a different name for this, such as ''ADVANCED CMOS
    SETUP''. When you have found the entry, select it and confirm with Enter.

    In the screen that opens, look for a subentry called ''BOOT SEQUENCE''. The boot
    sequence is often set to something like C, A or Å C. In the former case, the machine
    first searches the hard disk (C) then the floppy drive (A) to find a bootable
    medium. Change the settings by pressing Page Up or Page Down, CDROM, C.

    Leave the BIOS setup by pressing Esc. To save the changes, select ''SAVE & EXIT
    SETUP'' or press F10. To confirm that your settings should be saved, press Y.'
  merge: -1
  pgno: 33
