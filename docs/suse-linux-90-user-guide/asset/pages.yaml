  md: '# First Example: Managing Files


    Now that you know what a command looks like, which directories exist in SuSE Linux,
    and how to speed up things when using Bash, put this knowledge into practice with
    a small exercise.


    +   1. Open a console of KDE desktop by clicking the shell icon.

    2. Enter the ls command to see the contents of your home directory.

    3. Use the command mkdir (which stands for "make directory") to create a new subdirectory
    called test by entering mkdir test.

    4. Now launch the KEdit editor by pressing (Alt+F2) and entering "kedit" in the
    input field. Then save the file as Testfile in your home directory. Linux distinguishes
    between uppercase and lowercase. For this example, use an uppercase T.

    5. View the contents of your home directory. Instead of typing ls, just press
    twice and the ls command should reappear at the prompt. To execute the command,
    hit (Enter). The newly created directory test should appear in blue letters and
    Testfile in black. This is how directories and files can be distinguished in a
    console.


    +   6. Move Testfile into the subdirectory test with the command mv. To speed
    this up, use the expansion function: just enter mv and press (Tab). As long as
    there is no other file beginning with this letter in the directory, the shell
    expands the file name and adds the string "estfile". Otherwise, add a letter or
    two yourself and press (Tab) each time to see whether the shell can expand the
    name. Finally, press a space then after the expanded file name and press (Enter)
    to execute the command.


    +   7. At this point, Testfile will no longer be in the directory. Check this
    by entering ls again.


    +   8. To see whether the file has been successfully moved, change into the directory
    with the command cd test. Now enter ls again. You should see Testfile in the listing.
    Change back to your home directory at any point by entering only cd (which stands
    for "change directory").


    +   9. To make a copy of a file, use cp. For instance, enter cp Testfile backup
    to copy Testfile to Testbackup. Once again, the command ls can be used to see
    whether both files are in the directory.'
  merge: -1
