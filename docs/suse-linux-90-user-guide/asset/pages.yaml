  md: '# Changing the Installation Scope


    If you install the default system, there is usually no need to add or remove individual
    packages. This basic system consists of a software selection that meets most requirements
    without any changes. If you have specific needs, modify selection with the package
    manager. It offers various filter criteria for determining a selection from the
    numerous packages in SuSE Linux.


    The filter selection box is located at the top left under the menu bar. At startup,
    the ''Selections'' filter is active. This filter groups the program packages by
    their application, such as multimedia or office applications. The various groups
    of the Selections filter are listed under the filter selection box. The packages
    included in the selected system type are preselected. The respective check boxes
    to select or deselect selections for installation.


    The right part of the window displays a table listing the individual packages
    included in the current selection. The leftmost table column shows the current
    status of each package. Two status flags are especially relevant for the installation:
    ''Install'' (the box in front of the package name is checked) and ''Do Not Install''
    (the box is empty). To select or deselect individual software packages, click
    the box until the desired status is displayed.


    Alternatively, right-click the package to access a pop-up menu listing various
    status options. However, the other status settings are not needed for the installation.
    They are described in detailed in Section Installing and Removing Software on
    page 51.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_50_0.png)'
