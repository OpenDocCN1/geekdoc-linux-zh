- img_proc: true
  md: '# 23.1 Image Processing and Graphics Formats


    # 23.1.1 Pixel Images


    GIMP has been designed for processing pixel graphics. These images consist of
    small blocks of color that together create the entire image. A full-screen image
    on a monitor with an 800×600 resolution has exactly that number of pixels — 480,000
    individual pixels. Considering this, it is not surprising that image files are
    generally quite bulky. In addition to the coordinates of each pixel, the color
    information is stored. With an image of 800×600 pixels, it is easy to get more
    than one MB of data. From the outset, therefore, much time and energy has been
    invested in developing compression procedures that squeeze the amount of information
    together. Some well-known graphics file formats for pixel images include:


    XCF The native GIMP format. It supports the layer technique discussed later and
    other specific GIMP functions. If you have created an image using GIMP-specific
    settings and save it in a different file format, information is lost.


    BMP A format without compression used by Microsoft Windows. An advantage of this
    format is that graphics can be loaded and saved very quickly, but this positive
    aspect is outweighed by the file size.


    GIF The “Graphics Interchange Format” has been specially developed for data transfer
    on the Internet and has special features to support this. For licensing reasons,
    many programs are no longer able to support this format. One special feature of
    GIF is the animated Gif, a GIF file in which several images are stored. In an
    Internet browser, these individual images are displayed quickly one after the
    other that the impression of a moving image is created. GIF, despite its limitations,
    is popularantly because it allows transparency.


    PNG The “Portable Network Graphics” is a popular replacement for the GIF format.
    It can generate the same quality of compressed files without loss of information
    and is freely available. It allows a better form of transparency, but it is not
    fully supported by all Internet browsers.


    PSD This format is used by the professional Adobe Photoshop application and supports
    the multilayer technique.'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'TIFF The “Tagged Image File Format” is another method of saving files in the
    professional arena. It is particularly popular in the printing business.


    JPEG The compression method of the “Joint Photographic Experts Group” allows a
    highly efficient reduction of image files. Depending on the compression factor,
    image information is lost. Nevertheless, it is an ideal format for images on the
    Internet.


    > Tip

    Always save an XCF version of images you create. This makes future modifications
    much easier.


    # 23.1.2 Vector Graphics


    Unlike pixel graphics, vector graphics do not store information for all individual
    pixels. Instead, they store information about how image points, lines, or areas
    are grouped together. A line that runs horizontally across the screen, representing
    a total of 800 pixels, needs only four information units: the coordinates of the
    starting point, the coordinates of the end point, and the information that two
    points are connected by a line, and possibly, the color of the line. With four
    coordinates and four lines connecting them, easily create a rectangle. The fact
    that this rectangle is filled with a specific color requires just one more information
    unit. In this way, even complex images can be represented with relatively little
    basic information. The drawing application of OpenOffice.org, for examples, uses
    this format.


    # 23.2 Using The GIMP


    # 23.2.1 Starting The GIMP


    By default, GIMP is included in the standard installation of SuSE Linux. Start
    GIMP from your main menu or by typing gimp in a command line. Some postinstallation
    procedures are conducted when GIMP is first started for a user. Click ‘Install’
    then, in the following dialog, click ‘Continue’. GIMP is correctly installed and
    set up.


    Because many files need to be loaded when it first starts, GIMP takes some time
    to load. By default, a window is displayed after each start showing the ‘Tip of
    the Day’. If desired, deactivate it by unchecking ‘Show tip next time’'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# 23.2.2 The Toolbox


    Initially, GIMP appears on screen in a rather spectacular way. It opens a relatively
    small window containing the toolbox. The buttons of this window are the main functions
    needed for powerful image manipulation. The following is a description of the
    icons and their functions. GIMP toolbox window is divided into three parts: the
    menu bar with the ''File'', ''Xtns'' (Extensions), and ''Help'' menu; and the
    color, pattern, and brush selection icons.


    # 23.2.3 The Menu Bar


    The menu bar can be seen in Figure 23.1 on page 336. Use ''File'' to create a
    new graphics file, load an existing image create screenshots (screenshots are
    images of sections of your screen), set basic options, and access the recently
    processed files. The items under the ''Xtns'' menu are modules, plug-ins (additional
    programs associated with GIMP that implement a specific graphical functionality),
    scripts, and GIMP web pages. The ''Help'' menu provides access to help info.


    # 23.2.4 The Tool Icons


    Each graphic in the toolbox represents a specific function. The toolbox can be
    resized in width and height. Overall, a distinction can be made between three
    or four function areas.


    **Selection Tools** In image processing, process either the whole image or a specific
    section of it. GIMP needs to know to which area the following actions should be
    applied. Several selection tools define a specific area. Once a selection has
    been made, it can be processed without affecting parts of the image. Selection
    areas can also be increased or decreased with the aid of Shift (additive selection)
    and Ctrl (subtractive selection). The cursor changes to show a plus or minus sign.


    **Transform Tools** These functions are used to modify selections. Many functions
    are available, including crop, flip, and transform.


    **Paint Tools** The paint tools represent pencil, paintbrush, airbrush, pen, and
    finger (smudge) and try to emulate their real-world properties on the PC.


    A fourth area to be classed with these three areas might include the color, fill,
    and brush options, which specify the paint color or the tip of the painting tool.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 23.2.5 The Selection Tools


    Rectangular select is the simplest selection tool. By keeping the left button
    pressed and dragging the mouse at the same time, mark a rectangular area. When
    you release the mouse button, a frame indicates the selected area. If you press
    Shift after you begin drawing the selection, only perfect squares can be selected.


    This tool works like rectangular select, except it selects a circular or elliptical
    area. It is used in the same way, except pressing Shift after you begin limits
    the selection to perfect circles.


    This is the first usable selection tool for photographs. The lasso allows a free-hand
    selection of an irregular shape. Press the left mouse button and follow the shape
    as required. When you release the mouse button, the start point and end point
    are joined with a straight line. An accurate selection is difficult, so working
    with an enlarged image is recommended.


    The magic wand fuzzy selection tool selects an image area with color similarity
    of adjacent pixels. If the default settings are not suitable, change the threshold
    value in the option box or combine several selections using Shift. The magic wand
    is ideal for irregular areas of similar color.


    With a bit of effort, the Bezier Curves tool allows you to capture specific areas
    or objects of an image. With the aid of anchor points set with mouse clicks, draw
    curved lines. One advantage of this technique is that you can change the selection
    with the aid of control points. You have marked the area required, just click
    inside to select it. This tool requires some practice to master, but is invaluable
    for more advanced work. Selections made with this tool can also be saved and manipulated
    with the ''Paths'' tab of the Layers, Channels, and Paths dialog.


    As you click, Intelligent Scissors tries to draw a selection over color or brightness
    edges. Sometimes it works quite well. Modify the settings in the option box.


    # 23.2.6 Transformation Tools


    When Move is activated, grab and move your selection with the mouse.'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'The magnifier is not a true transformation tool because it only zooms the screen
    representation in or out. The image itself is not changed. To use the zoom out
    function, which reduces the image on the screen by a certain percentage, press
    and hold Ctrl while clicking with the mouse.


    For a true enlargement of your image, open the context menu with a right-click
    in your image and select ''Image'' → ''Scale Image''. In the dialog box that opens,
    change the height and width of the image by the percentages or by pixel values.


    Use this tool to crop and resize your image. For an appealing impression for landscape
    photographs, for example, it is recommended to assign the sky-third and the landscape
    two-thirds of the image height. Using the mouse, click and drag to a rectangle.
    A click inside this rectangle crops the surrounding area. You can also undo this
    immediately with Ctrl + Z. You can also change the size of the rectangle. Resize
    the selection by grabbing and moving the top left or bottom right corners. Move
    the entire rectangle by grabbing and moving the bottom left or top right corners.


    This icon hides a multitude of functionalities that might confuse a beginner.
    Process the whole image by clicking the tool icon then the image or a portion
    by first making a selection then clicking the tool icon.


    Four functions are available: rotate the image or the selection around an arbitrary
    rotation point, enlarge or reduce (Scaling), convert a rectangle into a trapezoid
    (Shearing), or distort the perspective of an area. The default setting is Rotation.
    Other functions can be specified in the option box opened by double-clicking the
    tool icon.


    A simple tool that flips (mirrors) the selected area horizontally or vertically.


    Once you have modified your whole image or a selection with the aid of a transformation
    tool, reconnect this floating selection to the image. Prior to this integration,
    you can still modify the result of your transformations. There are several possibilities
    for integrating the changes into the image—use the anchor layer keyboard shortcut
    (Ctrl + H), click in the image somewhere outside the selection, or choose a different
    selection tool and apply it.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# 23.2.7 Paint Tools


    The first few tools in the following list are somewhat different from the other
    paint tools. They are included in this section, however, because they are used
    to add colors or text rather than modify it. The main paint tools provided by
    GIMP have particular properties in the real world that are emulated by the program.
    Set the appropriate options to simulate various pencils or to adjust the paintbrush
    to your personal requirements. In the option boxes of the paint tools, find the
    slider ''Opacity''. This is used to set the opacity of the color employed. With
    the ''Mode'' drop-down box, specify how painted lines or surfaces be integrated
    into the image. Depending on the tool, the different modes have different effects.


    T T stands for text input. In GIMP, text input is in two ways and many options
    are available. Double-click the tool to open the option box. By activating or
    deactivating ''Use Dynamic Text'', select multiline text alignment or single line
    text input. A click in the image with the T tool activates the corresponding dialog
    box in which to enter text and select font, size, and other parameters.


    > Caution If you do not save the text in a separate layer, you will later be able
    to modify it because it is integrated into your image in See Section Layers on
    page 347 for more information.


    GIMP provides a relatively simple text tool. Many text effects, such as shadows
    or gradients, must theoretically be input by hand. In practice, however, ''Script-Fu''
    and the ''Filters'' submenu provide many automatic modification procedures, which
    have, in part, been designed for use with text.


    +   - The color picker allows a controlled selection of a color from your image
    and transfers it to the color selection box. When you click a specific color in
    the image with the color picker tool, color is selected. With it, quickly find,
    for example, a specific skin tone needed to retouch a photograph.


    +   - With the paint bucket, fill a selected area with color. Instead of a color,
    it can also fill with a pattern. Prior to the filling action, activate ''Pattern
    Fill''. Everything in the selection is then painted over the selected settings.'
  merge: -1
  pgno: 361
- img_proc: true
  md: 'The icon represents a color or grayscale gradient. GIMP has several predefined
    gradients to fill the selected area. This tool is relatively complicated and requires
    some practice, especially if you want to overlay an image with transparent color
    gradients.


    With the virtual pencil, as with a real pencil, draw free-hand lines. Select the
    type of line and the width and shape of the pencil point with the brush dialog.
    To access it, double-click the brush in the bottom right corner of the toolbox
    or select ''File'' -> ''Dialogs'' -> ''Brushes''. Pencil points are available
    that do not actually exist in the real world. Make your pencil point extra-fine
    or extra-thick or select one the special shapes.


    The paintbrush draws with a softer, more liquid effect than the pencil. In the
    appropriate option, set a fade out (the color intensity diminishes while painting)
    or a gradient (selection via the gradient setting options). When the fade out
    option is activated, release the paintbrush and begin again to apply more color.


    The eraser can both erase and unerase. The brush selection also sets the shape
    and size of the eraser.


    The airbrush applies color like a real airbrush. Change the ''Pressure'' and use
    the many different brush settings. This tool is ideal for use with pressure-sensitive
    graphics tablets.


    The clone tool (the icon represents a rubber stamp) is the ultimate instrument
    for photo retouching. It can be used to specify parts of images that are cloned.
    In practice, this means that you specify precisely which part of the image to
    copy and in what form. This has relatively little to do with the ''Cut'' and ''Paste''
    functions. It uses the paint functionality, allowing you to set the shape and
    opacity of your virtual rubber stamp.


    Things become interesting, for example, if you have an old photograph with white
    stains. Activate the Clone tool and, if needed, its option box. Keep Shift down
    and click the image area to use for the copy. Release the mouse button and place
    the cursor on the damaged image area. If you press the left mouse button and move
    the cursor, the copy is inserted. When you move the mouse upwards, the area copied
    moves upwards, too. The point is marked by a crosshair. Depending on the brush
    settings, a small or a'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'large radius is copied and, depending on the tool settings, copying is-ried
    out in a translucent or opaque manner.


    The Convolver tool (the icon shows a drop of water) is used for precise manual
    blurring or sharpening of image parts. Which of the two actions is active is set
    in the option box. The brush selection determines size and borders of the manipulation
    area. Blurring a kind of haze over the image, or when using a drop of water on
    a color painting, blurs the “painted” areas. Sharpening is opposite. Here the
    program attempts to increase the contrast and make a negate separation of edges.
    Sharpening works well if you later look at your image from a distance. It also
    means a loss of information, however. Seen from very close up, the images look
    extremely pixellated.


    The pen can be used for drawing and also for calligraphy. Writing well, however,
    can only be achieved with the aid of a graphics tablet. In the tool settings,
    adapt the shape of the pen to your own requirements.


    The tool icon that looks like a pin is, in reality, a thin wooden stick with a
    glued-on opaque cardboard circle. Such an instrument is needed in a photographic
    laboratory for the perfect exposure of a manual paper copy. As only a small part
    of the negatives (or positives) is exposed perfectly, this instrument is moved
    over the areas that would otherwise become too dark while the paper is exposed.
    The opposite is piece of cardboard with a little hole in it for postexposure.
    Both functions are fulfilled by this GIMP tool. Dodge (make lighter) individual
    image areas or burn (make darker) them. To create soft transitional borders, use
    a diffuse brush shape.


    The finger shown in this tool icon moves over the color just applied to the paper
    and smudges it. This can be used to create very interesting effects.


    With the calipers, measure distances and angles. In the associated option box,
    activate ‘Use Info Window’.


    # 23.2.8 Color, Brush, Pattern, and Gradient Selection


    The selected colors, brush, pattern, and gradient are shown in your toolbox. The
    color selection functions are on the left. On the right are the currently active'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'brush shape, the active pattern, and the active gradient. Clicking each of
    these opens a dialog window for individual configuration.


    # 23.3 Working with The GIMP


    # 23.3.1 Opening Images


    To edit an image that is saved on your hard disk GIMP, click ''File'' → ''Open''
    or press Ctrl+O to open the GIMP file manager dialog, shown in Figure 23.2.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_364_0.png)


    Figure 23.2: Load Images


    On the left-hand side, change to a different directory by double-clicking. On
    the right-hand side, the files are listed. The file list is sorted alphabetically.
    Individual sorting by file type or date is not possible. A handy feature is the
    small integrated preview window. If GIMP recognizes the file format, sees a thumbnail
    of the currently selected file. Double-click the file name or click ''OK'' to
    open the image.


    For convenience, GIMP works with each image in a separate image window completely
    independent from the window containing the tool icons. Move the image window around
    on your screen and, if needed, change its size and zoom settings independently.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# 23.3.2 Creating a New Image


    To create a new image, select ''File'' → ''New'' (Ctrl+N). A dialog box opens,
    enabling specification of several image attributes (see Figure 23.3). The most
    important ones are width and height, usually represented in pixels, image type,
    and fill type. In ''Fill Type'', select the type of fill to use in the new image:
    the current foreground or background color, white, or transparent. By default,
    transparent areas are rendered with a gray checkerboard pattern.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_365_0.png)


    Figure 23.3: Creating a New Image


    # 23.3.3 Saving Images


    Save with the mouse, (Ctrl+S). When using the mouse, right-click inside the image
    to open the context menu of the image. To save your image, activate ''File'' →
    ''Save''. If you have already assigned a name to the image, it is saved under
    that name. If not, GIMP file manager opens and lets you specify the required file
    name and path. With ''Determine file type'', specify which image format GIMP'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'should use for saving. A correct file extension. In theory, it is no problem
    to save a GIF file with a .TIF extension. If the file type is set to ''By Extension'',
    GIMP saves in the file type identified by the file extension in the file name.


    # 23.3.4 Configuring The GIMP


    GIMP provides some simple setting options for fast and efficient work. Explore
    ''File'' → ''Preferences'' to see the range of options available. Once you are
    more familiar with GIMP, experiment with the various settings. Refer to the internal
    help system for advice.


    An important setting is the multilevel ''Undo'' function, which allows you to
    undo recent actions. To undo, select ''Edit'' → ''Undo'' in the context menu or
    press Ctrl+Z. Under ''File'' → ''Preferences'' → ''Environment'', set the number
    of steps.


    > Tip

    Many functions or tool settings have their own windows that you can open and close
    as needed. On a larger screen, leave frequently needed dialog windows open without
    any problem.


    Tearoff menus are another feature of GIMP. Whenever a menu shows a dotted line
    on top, click this line, detaching the menu from the larger context menu. The
    menu is then displayed on your desktop in its own window.


    # 23.3.5 Layers


    Layers are crucial to GIMP effectively. They allow you to arrange image contents
    and more easily edit and modify your image. To store image information when saving
    a file, save in GIMP''s native format, XCF. As well as preserving information,
    it also saves GIMP features, such as the location of guides.


    To understand how layers work, imagine an image created from a stack of transparent
    sheets. Different parts of the image are drawn on different sheets. The stack
    can be rearranged, changing which pieces are on top. Individual layers or groups
    of layers can shift position, moving sections of the image to other locations.
    New sheets can be added and others set aside. This is much like how the layers
    work in GIMP.


    By drawing parts of your image on separate layers, manipulate, change, or delete
    those parts without damaging the other parts of the image. Using separate layers
    for text is the most common usage, but the possibilities are much more extensive.'
  merge: -1
  pgno: 366
- img_proc: true
  md: 'GIMP includes a layer manager. Access it via ‘Layers’ → ‘Layers, Channels &
    Paths’ in the context menu then under the ‘Layers’ tab in the dialog that opens
    (see Figure 23.4). Here, create, copy, and delete layers or anchor a layer in
    the background image. Use the eye icon in the layer manager to make layers invisible
    without losing their information. The icon with four arrows indicates linked layers.
    Layers showing this icon are moved as a group.


    Under the ‘Channels’ tab, view the three color channels — red, green, and blue
    individually or in any combination. The ‘Paths’ tab provides information about
    paths that have been drawn with the Bezier selection tool.


    ![](img/024a6c3adc868dbb714281f5a6285cf8_367_0.png)


    Figure 23.4: Layers, Channels, and Paths Dialog


    # 23.3.6 Image Modes


    GIMP has three basic image modes — RGB, grayscale, and indexed. RGB is the main
    color mode usually used in GIMP. Grayscale is for black, white, and gray images.
    Indexed is used almost exclusively for converting images to the GIF file format.
    There are a few things to remember when working with image modes:


    +   - Only RGB mode has all the filters available. Most, however, are available
    in grayscale mode. To run filters on an indexed image, convert to RGB first.


    +   - Convert to indexed only right before saving image formats that require it,
    such as GIF. Never work with an image in indexed mode.'
  merge: -1
  pgno: 367
- img_proc: true
  md: '+   Regardless of any color used on a grayscale image, the color is desaturated
    and applied in a shade of gray.


    +   Study the internal help system for more information about image modes.


    # 23.4 Introduction to Image Manipulation


    The following sections provide tips for working with your own images. This only
    introduces a small part of the things possible in GIMP.


    # 23.4.1 Special Effects


    In the context, many different manipulation tools are available under ''Filter''
    or ''Script-Fu''. These include easy-to-apply effects. Usually, clicking the filter
    in the menu opens an option box with which to control the effects of such filters.
    Refer to the internal help system for descriptions of the filters.


    # 23.4.2 Inserting Text


    You can easily integrate text into your images with GIMP. First determine the
    text color with the aid of the color selection icon in the toolbox. Then activate
    text input with the T icon and click the image. A dialog box opens in which to
    specify your text and the font settings. Depending on which fonts are available
    on your system, specify a font family in the first selection column. The second
    column defines style and weight (medium, bold, or italic) and the third column
    sets the type size. Click ''OK'' to add the text to your image. As long as dotted
    lines surround the text, you can move it. However, once the text is anchored in
    your image, you can remove it with ''Undo'' as long as you have not saved the
    image. Put text on its own layer for easy modification later.


    In the option box of the text tool, select between a single line of text and a
    text window with several lines and text alignment. When activate ''Use Dynamic
    Text'', a click inside the image opens a dialog in which to enter and align multi-line
    text.


    # 23.4.3 Retouching Images


    The most suitable tool for this purpose is the clone tool. It is represented by
    a rubber stamp in the tool window. The use of this tool is described in Section
    Paint Tools on page 343, but here are a few hints:'
  merge: -1
  pgno: 368
- img_proc: true
  md: '+   * Set the brush to a medium size with a diffuse border area.

    * Work on an enlarged representation of your image.

    * Open a second view of the image with ''View'' → ''New View'' and zoom to 1:1
    to see how the changes look.

    * Save your work from time to time under a different file name. If you do not
    like one of your modifications, revert to a previous stage.


    Retouching may take some time because you often need to change brushes and redefine
    the image section to copy. Working with the clone tool requires some experience.


    # 23.5 For More Information


    There is a very good GIMP website at http://www.gimp.org. There, find and download
    documentation, plug-ins, and more. Also, ''Important Links'' offers an impressive
    collection of links for GIMP.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Part VI


