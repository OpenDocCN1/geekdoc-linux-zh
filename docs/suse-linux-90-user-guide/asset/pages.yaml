    Simply open the function overview, select ''Decrypt clipboard'', and enter the
    password associated with your secret key. The decrypted version is now available
    for processing in the clipboard and in the KGPG editor.


    # 14.3.2 Encrypting and Decrypting by Dragging and Dropping


    All you need to do to encrypt or decrypt files is to click the icons on the desktop
    or file manager, drag them to the padlock in the panel, and drop them there. If
    the file is not encrypted, KGPG asks for the key to use. As soon as you have selected
    a key, the file will be encrypted without any further messages. In the file manager,
    encrypted files are characterized by the suffix .asc and the padlock lock icon.
    These files can be decrypted by clicking the file icon, dragging it to the KGPG
    window, and dropping it. Then select whether the file should be decrypted or saved
    or displayed in the editor. If you select ''Decrypt and Save'', KGPG prompts for
    the password of your secret key and saves the decrypted file in the same directory
    as the encrypted file.


    # 14.3.3 The KGPG Editor


    Instead of creating contents for encryption an external editor then encrypting
    the respective file with one of the methods described above, you can use the integrated
    editor of KGPG to create the file. Open the editor (context menu → ''Open Editor''),
    enter the desired text, and click ''Encrypt''. Then select the key to use and
    complete the encryption procedure. To decrypt files, use ''Decrypt'' and enter
    the password associated with the key.


