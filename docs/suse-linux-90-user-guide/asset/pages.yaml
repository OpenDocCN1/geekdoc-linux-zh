    # ### 3.8.3 Creating a Boot, Rescue, or Module Disk


    This YaST module facilitates the creation of boot disks, rescue disks, and module
    disks. These floppy disks are helpful if the boot configuration of your system
    is damaged. The rescue disk is especially necessary if the file system of the
    root partition is damaged. In this case, you might also need the module disk with
    various drivers to be able to access the system (e.g., to access a RAID system).


    **Standard boot disk** Use this option to create a standard boot disk with which
    to boot an an installed system. This disk is also needed for starting the rescue
    system.


    **Rescue disk** This disk contains a special environment that allows you to perform
    maintenance tasks in your installed system, such as checking and repairing file
    system and updating the boot loader.


    To start the rescue system, boot with the standard boot disk and select ''Manual
    Installation'', ''Start Installation/System'', and ''Rescue System''. You will
    be prompted to insert the rescue disk. If your system was configured to use special
    drivers (such as RAID or USB), you might need to load the respective modules from
    a module disk.


    110 3.8. System'
