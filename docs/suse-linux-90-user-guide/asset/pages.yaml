  md: '# 6.6.6 Inserting Graphics


    Graphics can be inserted with the same vertical pop-up toolbar as tables, only
    you need to select its second button. Alternatively, select ''Insert'' → ''Graphics''
    → ''From File...''. This opens a dialog window in which to select the desired
    file. If you check ''Preview'', the selected image is displayed in the right part
    of the dialog. This preview may take some time in larger images. After confirming
    your choice, the inserted image is placed in the document at the cursor.


    In the document itself, select an image by clicking it. When selected, an image
    has little square handles on its edges. Then select ''Graphics...'' from the context
    menu to open a dialog in which to change various image settings, such as the wrap
    type and border style.


    To change the size of an image, first click it to activate it. Now click any of
    its handles, keep the button pressed, and drag the handle until the desired frame
    reaches the desired size. When you release the button, the image is scaled to
    your changes.


    To change the position of an image while leaving its size unchanged, click the
    image and keep the mouse button pressed. Drag the image to the desired position.


    # 6.7 Spreadsheets with OpenOffice.org Calc


    Calc is the spreadsheet module of OpenOffice.org. Use this application, for example,
    to handle your private or business accounting data. If Writer is already running,
    start Calc by selecting ''File'' → ''New'' → ''Spreadsheet''.


    After starting, Calc presents an empty spreadsheet divided into rows and columns.
    Rows are numbered from top to bottom and columns are lettered from left to right.
    The intersection of a row and a column marks the location of a cell, so each cell
    has a unique address coordinate. For instance, the address B3 refers to the cell
    located in the second column (B) and the third row. This address is also shown
    at the top to the left of the entry field.


    A cell may be active or inactive. The currently active cell has a thick black
    frame around it. To activate another cell, move the frame with the cursor keys
    or click another cell with the mouse. You can edit a cell if it is currently active.'
  merge: -1
  pgno: 201
