  md: 'files to unset the beginning of the partition. This will accelerate the resizing
    procedure in Linux.


    > Note

    If you have optimized virtual memory settings for Windows in such a way that a
    contiguous swap file is used with the same initial (minimum) and maximum size
    limit, consider another step. With these Windows settings, resizing might have
    the effect that the swap file is split into many small parts scattered all over
    the FAT partition. Also, the entire swap file would need to be moved during the
    resizing, which makes the process rather slow. It is therefore useful to unset
    these Windows optimizations for the time being and reenable them after the resizing
    has been completed.


    NTFS file system In Windows, run scandisk and defrag in order to move the files
    to the beginning of the hard disk. In contrast to the FAT file system, this must
    be done in NTFS in order to enable resizing.


    > Note

    If you operate a system with a permanent swap file on an NTFS file system, this
    file may be located at the end of the hard disk and remain despite defrag. Therefore,
    it may be impossible to shrink the partition sufficiently. In this case, temporarily
    deactivate the swap file (the virtual memory in Windows). After the partition
    has been resized, you can configure as much virtual memory as you need..


    After this preparation, return to the Linux partitioning setup and select ‘Shrink
    Windows Partition’. After a quick check of the partition, YaST will open a dialog
    with a suggestion for resizing the Windows partition.


