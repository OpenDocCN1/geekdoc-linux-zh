  md: '# The Filter Window


    Selecting all packages of an installation one by one would be vary laborious and
    time-consuming. Therefore, the package manager offers various filter methods for
    arranging packages in categories and limiting the number of displayed packages.
    The filter window is located to the left under the menu bar. It controls and displays
    various filter methods. The filter selection box at the top determines what be
    displayed in the lower part of the filter window. Click the filter selection box
    to select a filter from the list of available filters.


    The Selections Filter At-start, the ''Selections'' filter is active. This filter
    groups the packages according to their application purpose, such as ''Multimedia''
    or ''Office Applications.'' The various groups of the ''Selections'' filter are
    listed under the filter selection box. The packages already installed on the system
    are preselected. Click the status box at the beginning of a line to toggle the
    status of a selection. You can also select a status directly by right-clicking
    the selection and using the context menu. The individual package window to the
    right displays the list of packages included in the current selection, enabling
    selection and deselection of individual packages.


    The Package Groups Filter The ''Package Groups'' filter provides a more technical
    overview of the range of packages and is suitable for users who are familiar with
    the package landscape of SuSE Linux. This filter sorts the packages by subjects,
    such as ''Applications,'' ''Development,'' and ''Hardware,'' in a tree structure
    to the left. The more you expand the branches, the more specific the selection
    is and the fewer packages are displayed in the individual package window to the
    right.


    Moreover, the filter provides the possibility to display all packages in alphabetical
    order. To do this, select ''zzz Alle'' in the top level. As SuSE Linux contains
    a large number of packages, it may take some time until this long list is displayed.


    The Search Function The ''Search'' function is the easiest way to find a specific
    package. By specifying various search criteria, restrict the filter so that often
    only one package is displayed in the individual package window. Enter a search
    string and use the check boxes to determine where to search for this string (in
    the name, in the description, or in the package dependencies). Advanced users
    can even define specific search patterns using wild cards and regular expressions
    and search the package dependencies in the ''Provides'' and ''Requires'' fields.
    For example, softwaredevelopers who download source packages from the Internet
    can use this'
  merge: -1
