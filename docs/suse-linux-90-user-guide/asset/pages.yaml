- img_proc: true
  md: '# 15.1 Mail Formats


    KMail can save messages in the following formats:


    **mbox** This traditional UNIX format (the oldest) saves all messages in a single
    file. Directories are also simulated by means of individual files. The-individual
    mails can only be distinguished by the “From” line.


    **MailDir** In contrast to the mbox format, the MailDir format has a unique file
    name for every message. The messages are stored in the respective directories
    and can easily be identified and further processed. KMail uses the MailDir format
    (the more convenient alternative) by default, MailDir is not supported by many
    other e-mail programs. This can be a disadvantage if you want to switch to a different
    e-mail program later and still access your old e-mails. Processing old mails in
    mbox format is no problem, however, if you select MailDir. Just copy or move the
    files to the MailDir folder.


    # 15.2 Access Types


    KMail allows you to access your electronic mail in various ways. The access largely
    depends on your Internet Service Provider (ISP) or mail server. The main access
    types are POP3 and IMAP.


    **POP3 (Post Office Protocol Version 3)**nPOP3 is a standardized procedure for
    receiving e-mail. A POP3 server stores the messages until the user retrieves them
    with a POP3 client (in this case, KMail). This method is used frequently by Internet
    Service Providers (ISPs).


    **IMAP (Internet Message Access Protocol)**nWith IMAP, e-mail messages can be
    received and administered on the server without downloading them to the hard disk.
    This is often used in internal networks as it allows access to mail from different
    computers.


    # 15.3 Configuring KMail


    When KMail is started for the first time, a Mail folder is added to your home
    directory. This folder contains some basic mail directories (inbox, outbox, drafts,'
