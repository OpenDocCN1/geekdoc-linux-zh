    vkeybd supports a number of additional options. For example, enter vkeybd --addr
    73:0 --octave 5 & to increase the number of displayed octaves to five. An overview
    of the command line options can be accessed with vkeybd --help or in the man page
    for vkeybd (man vkeybd).

    The instrument designation in the preset list can be configured by specifying
