    // Scan the keypad waiting for a new key to be pressed.\n// Return the ASCII value\
    \ of the key.\n char getkeypad() {\n while (1) {\n // Shift values for debounce\
    \ and get current value\n oldkey2 = oldkey1;\n oldkey1 = oldkey0;\n oldkey0 =\
    \ scan2x2(); // get current key status\n\n // new key if CLOSED and all previous\
    \ values are OPEN\n if ((oldkey0 != 0) && (oldkey1 == 0) && (oldkey2 == 0) ) {\n\
    \ return(oldkey0);\n }\n\n mdelay(10); // scan rate is once every 10 milliseconds\n\
