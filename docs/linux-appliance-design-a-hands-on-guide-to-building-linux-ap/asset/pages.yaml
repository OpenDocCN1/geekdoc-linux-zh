- img_proc: true
  md: '# # 6


    # # LOGGING


    ![](img/a28f80056348678270f2ea0cfefd7891_100_0.png)


    A log message is an asynchronous report of an event of interest. This chapter
    discusses logging in general and then looks in some detail at syslog, the default
    logging system on Linux. We also describe how to control logging thresholds while
    a daemon is running.


    We''ve organized this chapter into the following sections:


    +   - Do You Need Logging?

    - Architecture of a Logging System

    - On-Demand Logging


    # ## Do You Need Logging?


    Before getting into the mechanics of logging, let''s discuss why you might want
    logging on your appliance.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Uptime


    The number reason for logging is to increase the system availability of your appliance.
    Proper routing and displaying of log messages like CPU fan speed below 1000 RPM
    can help your users keep their systems up and running. A regression or trend analysis
    of the system''s collected log messages can help identify problems before they
    interrupt service. Trend analysis is particularly useful in spotting problems
    with fans, disks, and power supplies.


    # Security


    If your appliance is on a network, it will almost certainly come under attack
    at some point. You can use log messages to trigger changes in the firewall rules
    or to notify the system operator or the end user that is under attack.


    # Debug


    The first step in fixing a bug is recognizing that a bug exists. Log messages
    report any inconsistency in input or output of a subroutine are invaluable for
    finding bugs. You can use the on-demand logging described later in this chapter
    to trace program execution and record subroutine inputs and outputs when a bug
    is detected.


    # Integral to the application


    Laddie is a good example of an application with integrated logging and event processing.
    It simplified our design of the ladd daemon to have it report all transitions
    using only a log message.


    You may be unable to use logging on some deeply embedded Linux systems with limited
    connectivity and limited disk space. But for most systems, logging will be a real
    asset for your appliance.


    # Architecture of a Logging System


    This section describes the architecture and properties of an “ideal” logging system.
    The next section describes syslog and compares it to the ideal below.


    A logging system can be divided into three major sections: one to collect messages,
    to route them, and one to deliver them (or to start other actions). Figure 6-1
    illustrates the architecture of a logging system.


    Let''s consider each of these three sections in more detail.


    # Message Sources


    The ideal logging system is a clearing house for messages from anywhere on the
    appliance, and it should be able to accept messages from many sources, including
    Unix sockets, UDP and TCP sockets, named pipes, and from following a file (the
    output of tail -).'
  merge: -1
  pgno: 101
- img_proc: true
  md: '![](img/a28f80056348678270f2ea0cfefd7891_102_0.png)


    Figure 6-1: Log message flow in an appliance


    The source code of the logging system should be well documented and modular to
    make it easy to add new types of message sources. The configuration of the system
    should make it easy to add new sources while the system is running.


    Let''s discuss three common message sources in a little more detail.


    # Unix sockets


    Syslog, the most popular logging system on Linux, uses a Unix socket as its message
    collection point. Stream-oriented communication channels, such as a socket, must
    have a delimiter to separate the messages. The most common delimiters are a null
    character, which syslog uses, and a carriage return.


    # Network sockets


    Network messages might arrive in a UDP datagram or over a TCP connection. Some
    applications accept TCP connections and broadcast their log messages to all connected
    sockets. The logging system should be able to accept TCP connections as well as
    initiate them. If the log messages are going to traverse an insecure network link,
    the system should encrypt them in transit using Stunnel or SSH with port forwarding.


    # Following a file


    Many applications write log messages directly to a file. If you want to capture
    the events reported in these log messages, you must watch the file for new messages.
    The tail -f command does this. Most often, you''ll see it as this command:


    ```

    tail -f logger

    ```


    It seems a waste to create two processes just to capture an application''s log
    messages, and a good logging system should handle following a file as part of
    its core functionality.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Message Routing


    The routing section identifies the appropriate destinations for each message.
    The routing criteria vary from one system to another, but most systems include
    the ability to route based on event importance and source programs (such as mail,
    cron, kernel, and authentication). Some systems include filters that recognize
    and route based on the text in the log message.


    In this chapter, we define a filter as a set of routing rules and the destination
    associated with each rule. The routing rules and their associated destinations
    are stored in a configuration file (or, in the case of Laddie, in an RTA table).
    Filters only make sense if the system supports (and you use) multiple message
    destinations.


    # Message Destinations


    A logging system finishes processing a message by sending it to a destination.
    While the following list of message destinations are discussed below, they may
    be quite long, there are in many possible destinations not described.


    # Files


    Files are the most common destination for log messages. Log files are the accepted
    norm, perhaps because they are so easy to access for periodic posting analysis.
    Unfortunately, files pose a problem for many embedded systems that do not have
    hard disks. RAM is volatile, and flash memory is too expensive to archiving log
    messages. Your choices for a diskless appliance are to filter messages heavily
    and only save a few to flash, send them to a server on the network, or to just
    save log messages.


    If you save messages to a file, you can logrotate to periodically remove the old
    file, rotate the new file into a numbered archive, and send a SIGHUP to the process
    that is the source of the messages. A SIGHUP should cause the application to open
    a new log file.


    # Named pipes


    Named pipes are an easy way to pass log messages to another program. A helper
    application opens the named pipe for reading and blocks while waiting for log
    messages to arrive. When the logging system has a message to send, it writes the
    message to the named pipe, unblocking the helper application. Make sure your helper
    application can handle "broken pipe" errors, they can occur if the logging system
    is restarted.


    Named pipes and helper applications are very useful for destinations that are
    too big or too complex for inclusion in the logging daemon itself. A named pipe
    is a great way to tie the logging system to a custom application that is specific
    to your appliance.


    One alternative to a named pipe is a fanout device, a kernel module and associated
    /dev entries that act as a one-to-many multiplexer. Unlike named pipes, fanout
    devices let many readers get the same message'
  merge: -1
  pgno: 103
- img_proc: true
  md: '(hence the name fanout). This book''s website hosts the fanout project, including
    source files and more detailed documentation. Please visit http://www.linuxappliancesdesign.com
    for more information.


    # Remote UDP/syslog host


    If you are an appliance designed for a large data center, be sure to include the
    ability to forward log messages to another host in the network. The syslog daemon
    can receive and/or forward log messages to other hosts using UDP.


    # TCP multiplexer


    If you want to route some to other programs, you can define a listening TCP socket
    that accepts connections. When a message arrives at the multiplexer, it is replicated
    and sent down each open TCP connection on the socket.


    For example, in our Laddie appliance we have a command line (CLI) that can show
    Laddie alarm messages.¹ When a CLI user uses the command set logs on, the CLI
    opens a TCP connection to logmuxud, Laddie''s logging daemon, and messages are
    sent down each accepted TCP connection to the CLI at the other end. (logmuxud
    is described in the next chapter.)


    # Email


    It is nice to have significant events reported to you via email, since email is
    ubiquitous, if not timely. Also, email is often used as a gateway to pag and cell
    phones (so that important details can you find no matter where you hide).


    # Console


    Output to /dev/console or to a serial port is a must for debugging. Some large
    network centers still prefer to collect log messages over a physically secure
    and non-shared channel like an RS-232 cable.


    # Database


    Some messages require an immediate response, but most of the time you are interested
    in changes or trends in the pattern of a system''s events. A relational database
    is an ideal repository for log messages, since it has a wide range of tools to
    sort and count log messages. Since databases use lot of CPU cycles while they
    are sorting and counting, you might want to put the DB somewhere on the network
    instead of your appliance.


    # SNMP traps


    Most networks have one or more dedicated network-management workstations that
    run an SNMP manager. The operators of these networks often insist that all network
    equipment use SNMP for status, configuration, and error reporting.


    > ¹ Log messages give a report of an event. An alarm is a system state of failure
    or reduced availability. Log messages are used to report the transitions in and
    out of an alarm state, and the two terms are sometimes confused.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# system()


    A system() call to run a utility is another common destination. While simple and
    flexible, this approach uses more memory and CPU cycles than the other destinations
    and is not appropriate for processing large numbers of messages.


    The use of system() is always considered a security risk. We mention system()
    for completeness, discourage it. If you must run an external command, try to use
    pop() in place of system(). We solve this problem on Laddie using the RTA-to-file
    utility described in Appendix D.


    We do not have space here to describe all of the possible destinations. For example,
    we did not discuss payers, voice mail, or instant messaging.


    # syslog


    A logging system needs a standard way to report events, a lingua franca for log
    messages. That standard, for most of us, is syslog. There are several advantages
    to syslog. It is the primary event-reporting mechanism used by all Linux applications,
    and it is well known and understood. In conjunction with the kernel daemon, syslog
    captures kernel and system log messages that you may want to make visible to the
    appliance user.


    This section describes how syslog works, how to use it in your applications, and
    how to configure its message filters. We give enough detail that you should have
    no trouble using syslog as the basis for your logging system.


    # syslog Architecture


    Messages from syslog are generated in your program by a call to the glibc C-library
    routine syslog(). Then, it formats the message and tries to write it to /dev/log,
    a Unix socket that is opened when syslog starts. syslogd reads the message from
    /dev/log and handles it according to filters defined in /etc/syslog.conf, the
    syslog configuration file. Figure 6-2 shows the overall architecture and message
    flow of syslog.


    ![](img/a28f80056348678270f2ea0cfefd7891_105_0.png)


    Figure 6-2: Message flow with syslog'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Using syslog


    Almost all Linux programming languages have a routine to send a syslog message.

    The C-library prototype shown below is fairly typical of most languages.


    ```

    void syslog(int priority, const char *format, ...);

    ```


    `Priority` is combination of the log level, the importance or severity of the
    event, and the type of program that generated the message.² Most programmers specify
