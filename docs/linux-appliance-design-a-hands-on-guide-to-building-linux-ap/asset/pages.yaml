    The agent refused again! This time, the reason is a little less obvious.

    The Net-SNMP agent will refuse requests to set new values if the object''s

    value has been configured in the snmpd.conf file. This is not part of the

    SNMP standard, it is just how Net-SNMP works. It pres that since you

    configured these values using the snmpd.conf file, you probably won''t

    want else changing them remotely. If you want to set these values to be

    writable, you need to set their values using local snmpset commands, rather

    than using the configuration file.


    > Apologies for leading you astray here. Our intent was to highlight this non-obvious

    behavior of Net-SNMP and possibly save you some time later.


