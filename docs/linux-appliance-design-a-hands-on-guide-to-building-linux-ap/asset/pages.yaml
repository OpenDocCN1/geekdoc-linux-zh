- img_proc: true
  md: 'At this point in our example, we can test the pattern-matching ability of our
    regex pattern. Use the terminal with the bash prompt to issue the following command.


    ```

    logger "Train from Phoenix arriving on Track number 22"

    ```


    Verify that the count of matches in our filter has gone up by one.


    ```

    SELECT * FROM Filters LIMIT 1;

    ```


    Repeat the two steps a few times using different city names and track numbers.
    Issue a few logger commands where the pattern does not quite match, and verify
    that the count does not increment.


    # rewrite


    You may recall the magic of regex patterns is that you can extract a subpattern
    by placing parenthesis around it. Here, we are extracting the city name and the
    track number and rewriting them as `city_name:track_number`. The regex subpatterns
    are available to rewriting string as `%1s to %9s`. We want the first two patterns,
    and we want to add a newline to the output, so we set the rewrite string with
    the command:


    ```

    UPDATE Filters set = "%1s : %2s %12s" LIMIT 1;

    ```


    We are done with the Filters table and can now finish the configuration by editing
    the NetDest table.


    # NetDest


    We want to set up a TCP socket listening on port 3333. Let''s give everyone on
    the network access to the port by binding to 0.0.0.0. The name of this network
    destination should be `example_2`, and the type of this network destination should
    be an accepted TCP connection, which is type 3:


    ```

    UPDATE NetDest dest = =example_2", dest = "0.0.0.0"

    port = 3333, type = 3 LIMIT 1;

    ```


    If all has gone well, there is a listening socket on port 3333. Usestat -nat to
    verify that the port is open and bound to the right address. Use the following
    SQL to see the file descriptor of the socket.


    ```

    SELECT * FROM NetDest LIMIT 1;

    ```


    We can now verify the whole system. Open a third terminal window and connect to
    port 3333. Your command might look something like this:


    ```

    telnet 192.168.1.99 3333

    ```'
