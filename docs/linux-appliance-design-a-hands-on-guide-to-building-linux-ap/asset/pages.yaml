  md: '# # 2


    # # MANAGING DAEMONS


    ![](img/a28f80056348678270f2ea0cfefd7891_30_0.png)


    At their core, most appliances have an application or daemon that performs the
    defining function of the appliance, with one or more user interfaces managing
    the core application or daemon. Figure 2-1 shows a typical appliance architecture
    that might already be similar to what you have in mind for your appliance.


    In the same way that the defining application is managed by user interfaces (UIs),
    the common services, such as a webserver or system logger, need to be managed
    as well. Because the main application and most common services are implemented
    as daemons, the problem of management comes down to the problem of managing daemons.
    The focus of this chapter is how best to manage daemons.


    In this chapter, we''ll cover the following:


    +   - Common approaches to managing daemons

    - Control and status protocol'
  merge: -1
  pgno: 30
- img_proc: true
  md: '![](img/a28f80056348678270f2ea0cfefd7891_31_0.png)


    # # Common Approaches to Managing Daemons


    By managing a daemon, we mean configuring the daemon, collecting statistics from
    it, and being able to view its current status. Most Linux daemons use ASCII text
    files for such communication, but there are other options for you to consider
    when building your daemon. The next sections will describe various daemon-management
    methods and their pros and cons.


    # ## File-Based Management


    Daemons are commonly managed or monitored through a few configuration files that
    control their run-time parameters, status, and logging. For example, the DHCP
    daemon, dhcpd, is controlled by the /etc/dhcpd.conf configuration; its status
    is displayed in /var/state/dhcp/dhcpd.leases; start-up script is in /etc/rc/init.d/dhcpd;
    and its logs are in /var/log/messages. There is little uniformity, however, in
    how a daemon''s configuration is stored or how its status is available. Status
    and other state changes are often logged using syslog(), but many applications
    use custom routines for logging and store their log files in a non-standard format.
    Figure 2-2 shows the typical flow of a daemon that uses files for configuration
    and management.


    A file-based approach has the following limitations for appliances:


    +   - There is no good way to get status or statistics from most running applications.
    While an application could write status and statistics to files, to do so in real
    time (or anything close to real time) would probably be too heavy on the CPU and
    filesystem.

    - You need to be able to edit the configuration file, which is not always easy
    on an appliance.

    - To apply new settings, you usually have to restart a running daemon, which may
    disrupt service and cause problems for users.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Current Unix Model


    ![](img/a28f80056348678270f2ea0cfefd7891_32_0.png)


    Figure 2-2: The most common way to manage a daemon


    Despite the limitations of file-based interfaces, many applications use them for
    Unix system administration, and they will probably remain popular. If you are
    building a new application and you''ve chosen to use file-based application management,
    consider using libini or an XML parsing library. Also, applications like Webmin
    help by offering a web front end that allows you to display and edit many configuration
    files.


    Keep in mind that very simple applications (including some daemons) may never
    need run-time access to status, statistics, and configuration. There might not
    be any reason to switch from the traditional .conf and .log approach of Unix.
    It is up to you to decide which approach is best for your particular application.


    # A Daemon-Based Web Interface


    Another common approach to daemon management is to offer a web interface directly
    from the daemon. For example, cuspd, the daemon for the print spooler CUPS, provides
    its own web interface over TCP port 631. This approach is viable for simple daemons,
    but it has two problems:


    +   - You will need to maintain code in your daemon to support the HTTP implementations
    in many different browsers.

    - It can be difficult to add additional interfaces when they are required.


    Case in point, we needed run-time access to status and configuration for one of
    our projects, so we added a built-in web interface. A coding nightmare! It seemed
    to forever to get all of the details of HTTP right and'
  merge: -1
