  md: "the term session. Recall the session leader (5331 in this example) is the process\
    \ that gets standard input from the terminal (hence the term Terminal Group ID,\
    \ TPGID).\n\nThe reason for having separate IDs for process group and session\
    \ is that you kill a process group, you want the kernel to send the TERM signal\
    \ to all of the processes in the group. The same is true if you want to kill the\
    \ processes in a session.\n\nWe don't want a daemon to receive signals that were\
    \ not meant for it, and so we want the daemon to be in its own session and its\
    \ own process group. Here is code that shows how to use setsid() to make your\
    \ daemon a session and process group leader:\n\n```\npid_t dpid;      // setsid()\
    \ return our PID or a -1\ndpid = setsid(); // Be session & process group leader\n\
    if (dpid < 0) // Should not happen\n    exit(1);\n```\n\nAs an exercise, you might\
    \ try using the ps command and examining the sessions, process groups, and foreground\
    \ groups for the daemons running on your system. You should be able to tell which\
    \ processes belong to the different session and process groups.\n\n> As a security\
    \ precaution, another fork() after calling setsid() and have the parent exit immediately,\
    \ leaving the child to continue as the daemon. This removes the session leader\
    \ status of the daemon in such a way that it can never regain a controlling terminal.\n\
    \n# Set the Working Directory\n\nDaemons traditionally use the root directory,\
    \ /, as the working directory. This allows the daemon to continue working if most\
    \ filesystems are unmounted. Using the root directory also makes it easier to\
    \ put your daemon into a chroot jail for added security (Chroot jails are described\
    \ in \"Chroot if Possible\" (page 59).\n\nSome daemons let you specify the working\
    \ directory in the configuration file or on the command line. Whether you use\
    \ the root directory, the /tmp directory, or a value from the configuration file,\
    \ you should be deliberate in specifying the working directory of your daemon.\n\
    \nUse chdir() to set the working directory of your daemon.\n\n# Redirect stdin,\
    \ stdout, and stderr\n\nTo remove itself from the controlling terminal, a daemon\
    \ redirects the stdin, stdout, and stderr descriptors by closing and reopening\
    \ them (usually to the /dev/null device). A daemon inherits all of the open file\
    \ descriptors of the parent. For this reason, many daemons loop"
