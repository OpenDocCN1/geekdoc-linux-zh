    \ Keypad\n\n![](img/a28f80056348678270f2ea0cfefd7891_172_0.png)\n\nFigure 10-1:\
    \ A 2-by-2 keypad\n\nHere is some simple code to scan the above keypad.\n\n```\n\
    \ // Scan a 2x2 keypad. Return A-D if closed, and if no closures\n// OUT: low\
    \ two bits of I/O port 0x378, (second parallel port)\n// IN: low two bits of I/o\
    \ port 0x379\nchar scan2x() {\n    // state of a given row switches\n    int state;\n\
    \    // put 0 on row 0\n    outbx(0, 0x378);\n    // switch state in low two bits\n\
    \    state = inb(0x379) & 0x03;\n    if (state & 0x01 == 0x00)\n        // remember:\
    \ closed=0, open=1\n        return('A');\n    if (state & 0x02 == 0x00)\n    \
    \    // look at switch on column 1\n        return('B');\n    outbx(1, 0x378);\n\
    \    state = inb(0x379) & 0x03;\n    if (state & 0x01 == 0x00)\n        // look\
    \ at switch on column 0\n        return('C');\n    if (state & 0x02 == 0x00)\n\
    \        // look at switch on column 1\n        return('D');\n\n    // no keys\
    \ pressed\n    return(0);\n}\n```\n\nThis code illustrates the sequence of events\
    \ fairly well, but you'll probably want to use a loop if you are scanning more\
    \ than a few rows.\n\n# Switch Bounce\n\nIf you drop a ball bearing onto a steel\
    \ plate, it will bounce. Switch closures can also be thought of as two metal pieces\
    \ colliding with each other. Switch contacts bounce when they are closed and when\
    \ they are opened. If you scan the keypad too quickly, you can erroneously detect\
    \ a bounce as a new closure. The duration of switch bounces depends on the physical\
    \ properties"
