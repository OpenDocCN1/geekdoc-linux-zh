    Our advice is to let other programmers write libraries and to avoid yourself by
    minimizing the number of lines of code you write and maintain. Hiding the protocol
    in a library API does not remove the need to code the protocol and library. You
    still need to think about which IPC to use and the actual protocol to over that
    IPC. Perhaps the biggest burden is writing and maintaining the client-side libraries
    for all of the programming languages of interest—are the days when you could write
    a C library library available in Java and PHP for web interfaces, and in Perl
    as a shell command for scripts and testing. Few companies have all the experts
    on staff that are needed to write and document these libraries, and fewer still
    have the time to properly maintain and update the libraries after each revision
    change.


    We''ve gone the route of trying to write libraries for our daemons, and one of
    the things we found was we kept reinventing the wheel. Every library, no matter
    how similar to the previous, was written for the daemon at hand, so we had to
    write a different library for every daemon. While we tried to reuse-code, this
    process fell far from ideal. How nice it would have to have just one library (and
    one underlying protocol) that we could have used for all of our daemons.


    Having one library per daemon is particularly problematic for embedded systems,
    that you may have to give up a lot of system RAM in order to have all the libraries
    needed.


    # Structured Query Language


    In an attempt to have just one control and status protocol for all of our daemons,
    we tried Structured Query Language (SQL) commands over TCP and modeled the data
    in our daemons as tables in a database. The daemon accepted a TCP connection and
    presented an SQL command line interpreter to the client. This protocol allowed
    to represent arrays (and lists) in the control and status protocol, thus solving
    one of the limitations of the AT command protocol. Figure 2-5 illustrates the
    basic idea.


    | User Interface | Control and Status | Daemon |

    |---|---|---|

    | Web / CLI / SNMP | SQL / TCP | SQL Interpreter |

    | | Table A | Table B |


    Figure 2-5: SQL as a control and status protocol'
