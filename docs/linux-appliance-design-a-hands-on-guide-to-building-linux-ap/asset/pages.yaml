    # The SQL_string() Subroutine


    The SQL_string() executes the SQL command placed in the null-terminated input
    string, cmd. The results are encoded into the PostgreSQL protocol and placed in
    the output buffer, out. When the subroutine is called, the input variable, nout,
    has the number of free bytes in the output buffer, out. When the subroutine returns,
    nout has been decremented by the size of the response placed in the output buffer.
    An error message is generated if the number of available bytes in the output buffer
    is too small to hold the response from the SQL command.


    This subroutine may be most useful when updating a table value in order to invoke
    the write callbacks. (The output buffer has the results encoded in the PostgreSQL
    protocol and might not be too useful directly.)'
