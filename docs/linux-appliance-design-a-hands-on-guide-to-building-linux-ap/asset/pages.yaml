  md: '# Drop Root Privileges and Set Capabilities


    If you must have root privileges to open network ports below 1024 or to write
    to root-owned files, to drop as many root privileges as possible. The 2.2 and
    later kernels make this possible with capabilities. Capabilities are separate
    permissions that perform very specific operations. SUID root program may drop
    individual capabilities and keep others.


    The kernel keeps three of sets of capabilities for each program:


    +   **Effective** What is currently allowed


    +   **Permitted** Maximum capabilities the process can use


    +   **Inherited** What to transfer across anve()


    The system call to set capabilities is capset(). You might also be able to use
    cap_set_proc(), which is more portable.

    Capabilities are seeing a list of active development in Linux. Here is a sample
    of the more than 25 capabilities that your daemon should relinquish if possible.
    A list of all of the capabilities is available from the output of man


    | CAP_CHOWN | Allow arbitrary changes to UIDs and GIDs. Drop this capability to
    disable changes to UIDs and GIDs. |

    | CAP_KILL | Bypass permission checks for sending signals. |

    | CAP_MKNOD | Allow creation of special files using mknod(2). Some devices such
    as /dev/mem and /dev/kmem, are particularly attractive to attackers. Your system
    is up and running, you would probably drop this capability. You might want to
    remove both /dev/mem /dev/kmem if you can verify that none of your appliance''s
    programs require them. |

    | CAP_NET_ADMIN | Allow various network-related operations—for example, setting
    socket options, enabling multicasting, interface configuration, and modifying
    routing tables. |

    | CAP_NET_BIND_SERVICE | Allow binding to Internet domain-reserved socket ports
    (port numbers than 1024). |

    | CAP_NET_RAW | Permit use of RAW and PACKET sockets. |

    | CAP_SYS_CHROOT | Permit calls to chroot(2). |

    | CAP_SYS_MODULE | Allow loading and unloading of kernel modules. |

    | CAP_SETCAP | Allow modifications to capabilities sets. If you''ve made your
    system more secure by dropping unwanted capabilities, you may want to drop all
    ability to change the system capabilities. Once system_SETCAP is dropped, full
    root access can''t regain the dropped capabilities. |


    The kernel itself honors a set of capabilities, and as the last step in your boot
    process, you may want to limit what the kernel can do. For example, if your kernel
    uses modules, at the end of system boot, you may want to completely remove the
    kernel''s ability to load or remove modules.


    A full description of capabilities is beyond the scope of what we can present
    here. A good place to start is man capabilities on your Linux system.'
  merge: -1
