- img_proc: true
  md: '# Write Callbacks


    Write callbacks are most applicable when tied to configuration changes. As such,
    a write callback is also a good place to log configuration changes.


    Write callbacks have the same parameters as read callbacks, with the addition
    of a pointer to a copy of the row before it was modified. Access to a copy of
    the unmodified row is useful to detect changes in the row''s data. It is useful
    since some UIs generate an UPDATE even if nothing actually changed.


    The callback returns zero on success and nonzero on failure. On failure, the table''s
    row is restored to its initial values and an SQL error is returned to the client.
    The returned error is TRIGGERED ACTION EXCEPTION.


    Write callbacks have the following calling parameters:


    | Callback | Description |

    | --- | --- |

    | char *tblname: | The name of the table referenced |

    | char *colname: | The name of the column referenced |

    | char *sqlcmd: | The text of the SQL command |

    | void *pr; | Pointer to affected row in table |

    | int rowid: | The zero-indexed row number of the row being read or written |

    | void *poldrow; | Pointer to a copy of the row before any changes were made |'
  merge: -1
