  md: '# Laddie Front Panel UI


    In earlier sections of this chapter we reviewed the requirements, operations,
    and hardware for the Laddie front panel. In this section we''ll look at the software
    that implements the front panel UI. We''ll break our discussion into three areas:
    the software for the front panel, the various front panel emulators, and the software
    architecture common to both. Let''s start with the common architecture.


    # UI Software Architecture


    The front panel software uses an event-driven state machine. Events include button
    presses, the expiration of a timer, and arriving log messages indicate a possible
    change of state in the alarm system. Output from the program includes SQL commands
    sent to the Laddie daemon, a flag to flash (or not) the LED, and the text displayed
    on the LCD.


    ![](img/a28f80056348678270f2ea0cfefd7891_187_0.png)


    Figure 10-10: Laddie front panel architecture


    Several state variables are used. The primary state variable, unimaginatively
    called state, indicates the type of information displayed on the LCD: status,
    log, or menu. There are also states for the brief Command Sent message and for
    an indication that the program could not open an SQL connection to the ladd daemon.
    Another state variable, Curcmd, contains an integer that indicates cycles to show
    when the user is in the menu. The Command button cycles Curcmd through the five
    possible panel commands. The Zone variable holds the number use for the current
    command. The Zone button cycles through the five possible zone numbers.


    | Events | States | Cuzcmd | Zones |

    |---|---|---||

    | Button "Display" | Status | Clear All Alarms | 1 |

    | Button "Command" | Logs | Clear Zone n | 2 |

    | Button "Zone" | Menu | Test Zone n | 3 |

    | Button "Enter" | Command Sent | Enable Zone n | 4 |

    | Log Message Arrival | Unavailable | Disable Zone n | 5 |


    Figure 10-11: Events and states in the front panel menu system


    The code to handle the state and event processing is fairly easy to read once
    you''ve reviewed the operation of the front panel. The state machine


    164 Chapter 10'
