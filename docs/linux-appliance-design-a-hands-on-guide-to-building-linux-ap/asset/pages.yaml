    The SMI description of a MIB is normally defined in a MIB file. This is a text
    containing the unambiguous description of a portion of the universal MIB.

    Sometimes descriptions of individual tables are placed in separate files. Other
    files just contain common objects or definitions, such as textual conventions,
    used by a set of other MIB files. Generally, a private MIB for a particular product
    is described in a single file or a small set of files, which importing types and
    conventions as needed from other files, much like the use of the #include statement
