  md: 'This output is a little awkward to read because it is a depth-first walk; that
    is, it walks down each column before going back to one and starting the next column.
    This is a result of the lexical ordering of the OIDs. For example, if ifDesc is
    ifentry.1 and ifType is ifentry.2, you see all ifDesc fields before any ifType
    fields.


    # KNOWING AN APPLIANCE BY ITS MIBS


    Walking can often identify the type of MIBs the MIB it supports. For example,
    one of the authors was once assigned an IP address for a new workstation and found
    that someone was already using this address. He had been assigned this address
    through proper channels, he assumed someone was invalidly using it. He turned
    off his system and used another system to read system,Contact from the offending
    system; this should have been set to the contact information for the administrator
    for that node, but it was not. He then tried walking all the MIBs supported by
    that system and found that it supported the printer MIB. Hmm ... As it turned
    out, he been incorrectly given the IP address of the department''s!


    # SNMPv1, SNMPv2, and SNMPv3


    There are three variants of SNMP. The original, SNMPv1 (version 1), is the simplest,
    but it has some drawbacks that newer versions seek to remedy. Its shortcomings
    include:


    +   - No support for integers larger than 32 bits.

    - No means to ask for bulk data (each object must be asked for name).

    - No mechanism to ensure that a trap reaches its destination.

    - Security/authentication is accomplished using community names, which are like
    passwords, but are transmitted on the network in the clear (unencrypted).


    SNMPv2 (community-based SNMPv2) addressed the first of three problems, but reaching
    an agreement on a new security mechanism proved more difficult, so SNMPv2 still
    relies on community names for authentication. SNMPv2 contains 64-bit integers,
    the GETBULK command, and introduces informs, which are confirmed traps.


    SNMPv3 replaces the community-name authentication mechanism with more secure authentication
    and encryption, and in-depth discussion of it is the scope of this book.


    SNMPv1 has been moved to "historical" status, but many applications used by IT
    organizations still use it. Your network appliance may need to speak SNMPv1 for
    compatibility with these older applications. Expect, however, that in the not-too-distant
    future, some of your customers will want to disable the older, less secure versions
    of SNMP.'
  merge: -1
  pgno: 341
