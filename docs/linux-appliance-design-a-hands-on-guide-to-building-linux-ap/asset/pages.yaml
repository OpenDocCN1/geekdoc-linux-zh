  md: '# Interfacing with the Daemons


    The Laddie web UI presents information from several running daemons. As you know,
    each of these daemons communicates with the PostgreSQL protocol. In this section,
    we will discuss how the web UI interacts with ladd, the Laddie alarm daemon. Once
    you understand this interaction, you will understand how the web UI interacts
    with the other daemons. Figure 8-8 shows a typical sequence where a user requests
    a web page and the web page is generated dynamically, based on the state of a
    daemon.


    The figure shows the Linux appliance with the webserver and the ladd alarm daemon
    running on it. For simplicity, we''ve shown the PHP interpreter running in the
    same process as the webserver, as is the case of Apache, but it could be a different
    process if you''re using CGI scripts.


    As mentioned, the figure shows a typical request-response sequence for a web page.
    First, the user requests a particular page at ①. The webserver locates the page
    from the filesystem, and because the webserver finds PHP tags in the page, it
    invokes the PHP interpreter, which interprets PHP code. In our case, the particular
    PHP code includes functions pg_connect() and pg_exec(), which are invoked by the
    PHP interpreter at events ② and ③. The PHP code generates the web page at ④, and
    this new page is sent back to the browser at event ⑤.


    ![](img/a28f80056348678270f2ea0cfefd7891_142_0.png)


    Figure 8-8: Interfacing with a daemon


    # Connecting to the Daemon


    As you can see in the illustration, before you can read and write to the ladd
    daemon, you must establish a connection using the pg_connect() function, which
    is built into the PHP interpreter when you configure PHP with the --with-pgsql
    option. The pg_connect() function takes a string argument that specifies the hostname
    (or IP address) of the server and the port. In our'
  merge: -1
  pgno: 142
- img_proc: true
  md: "case, the server is on the same machine as the webserver, and the ladd daemon\
    \ is listening on port 8888. More information on pg_connect() can be found by\
    \ searching for PostgreSQL Functions in the PHP manual at http://us2.php.net/pgsql.\n\
    \nThe following code fragment shows how to open a connection to the daemon:\n\n\
    ```\n$connection = pg_connect(\"host=127.0.0.1 port=8888\");\nif (!$connection)\
    \ {\n  // some error\n} else {\n  // valid connection\n}\n```\n\n# Reading from\
    \ the Daemon\n\nOnce a connection has been established, you can read from and\
    \ write to the ladd daemon. We use the pg_exec() function to do this. This function\
    \ requests that a statement be executed, or in case a SELECT statement-. For more\
    \ details on pg_exec(), see the PostgreSQL Functions at http://us2.php.net/pgsql.\n\
    \nThe following PHP code fragment shows how to read the status:\n\n```\n$result\
    \ = pg_exec($connection, \"SELECT id,name,enabled,alarm FROM zone\");\nif (!$result)\
    \ {\n  // some error\n  return;\n}\nfor ($row = 0; $row < pg_NumRows($result);\
    \ $row++) {\n  $id = pg_result($result, $row, 0);\n  $name = pg_result($result,\
    \ $row, 1);\n  $enabled = pg_result($result, $row, 2);\n  $alarm = pg_result($result,\
    \ $row, 3);\n  // do something with $id, $name, $enabled, $alarm\n}\npg_freeresult($result);\n\
    ```\n\nIn this example, the names id, name, enabled, and alarm in the SELECT command\
    \ are the column names in the Zone RTA in the ladd daemon. Generally, the SELECT\
    \ command will have the same form for different daemons, but the number of columns\
    \ and their names may differ. The value returned by the pg_exec() function is\
    \ an object handle, which is used to extract the number of rows with pg_numrows()\
    \ and each row's contents with pg_result().\n\n> NOTE All functions with names\
    \ that start with pg are part of the PostgreSQL PHP library and are not unique\
    \ to our daemon.\n\nOnce the information has been read from the daemon, you can\
    \ use this information to generate an HTML page. For example, we would use the\
    \ results in $id, $name, $enabled, and $alarm to generate an HTML table."
