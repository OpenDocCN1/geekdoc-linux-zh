  md: '# INSIDE THE MACHINE


    An Illustrated Introduction to Microprocessors and Computer Architecture


    by JON STOKES


    Inside the Machine explains how microprocessors operate—what they do, and how
    they do it. Written by the co-founder of the highly respected Ars Technica site,
    the book begins with the fundamentals of computing, defining what a computer is
    and using analogies, numerous 4-color diagrams, and clear explanations to communicate
    the concepts that form the basis of modern computing. After discussing computers
    in the abstract, the book goes to cover specific microprocessors, discussing in
    detail how they work and how they differ.


    DECEMBER 2006, 320 PP., $49.95 ($61.95 CDN)

    ISBN 978-159327-104-6


    ![](img/a28f80056348678270f2ea0cfefd7891_382_0.png)


    # BUILDING A SERVER WITH FREEBSD


    by BRYAN J. HONG


    The most difficult aspect of building a server (to act as a file server, web server,
    or mail server) is the initial installation and configuration. Getting your hands
    on the software is one thing; getting it all to function is another entirely.
    For many people, the only option is to hire an expensive consultant. Building
    with FreeBSD tackles the problem systematically, so readers can accomplish the
    task efficiently and affordably using the freely licensed FreeBSD operating system.
    Instructions are very clear and straightforward, the reader need only read and
    follow the directions. In addition to explaining how to install FreeBSD for the
    first time, this guide covers configuration of popular third-party software using
    the ports collection. It takes the pain out of assembling the pieces and puts
    them all together so the reader can build a server that just works.


    AUGUST 2007, 256 PP., $29.95 ($37.95 CDN)

    ISBN 978-1-59327-145-9


