  md: '# SNMP Data Types


    SNMP data types are a subset of ASN.1 types. A complete description of the SNMP
    data types and their uses is beyond the scope of this brief introduction, but
    this section is a summary of the major types. SNMP defines three kinds of data
    types: primitive, defined, and constructor. We won''t dwell on the differences
    here, other than to primitives are the basic types, defined types have special
    meanings but underlie primitive types, and constructor types are the tables we
    will discuss below. Although it may look a little strange, we''ll try to stay
    consistent with SNMP''s standard of using capital letters in the names of primitive
    types, but just initial capitals for the defined types.


    # INTEGER


    An INTEGER may be positive or negative. Its values may be enumerated, a range
    of legal values specified in the form of (e.g., LowValue,highValue). In SNMPv2
    INTEGER becomes Integer32, explicitly indicating the size as 32 bits. SNMPv2 also
    adds Unsigned32 type for all positive values.


    # Gauge


    Gauges are integers that take only non-negative values and whose values rise or
    fall within a specified range (e.g., between 0 and 100 percent, or between 0 and
    some maximum capacity). SNMPv2 redefines this as Gauge32.


    # Counter


    Like Gauge, Counter is an integer that takes only non-negative values. Unlike
    Gauge, the value of a counter only increases until it wraps back to zero at its
    maximum limit. SNMPv2 replaced Counter with Counter32 and Counter64.


    # TimeTicks


    TimeTicks are integers describing time in 1/100ths of a second. They are generally
    used to describe the time since some significant event or starting point, such
    as system boot or last configuration change.


    # OCTET STRING


    An OCTET STRING is a string of eight-bit bytes. It is not necessarily a null-terminated
    STRING; each octet can contain any value (0-255) at any position (i.e., there
    may be null in the middle). SNMPv2 added the restriction that an OCTET STRING
    may be no longer than 65,535 (i.e., its length must be expressed in 16 bits).


    # OBJECT IDENTIFIER


    This is used to contain SNMP OID values. SNMPv2 added the restriction that an
    OBJECT IDENTIFIER may contain no more than 128 components, each of which must
    be expressible in a maximum of 32 bits.


    # IpAddress


    The IpAddress string is an octet length of four. (Note that this allows expression
    only of Ipv4 addresses.)'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'Opaque


    This type is much like OCTET STRING in that it is a string of octets with similar
    restrictions. Opaque was defined to allow extensions of the SMI.

    Defining new types based on the Opaque type is strongly discouraged.


    BITS


    BITS was added in SNMPv2 to provide a way to express bit fields of labeled bits
    (i.e., where each bit has a separate meaning).


    **NOTE** Types that have been removed from the later revisions of SNMP are not
    shown in the list.


    # SNMP Tables


    In addition to the simple types described above, tables may be described using
    SEQUENCE and SEQUENCE OF. A table in a MIB is described as a SEQUENCE OF a type
    that describes the entry. The table entry is then described as a SEQUENCE containing
    the individual fields of the entry. The entry type describes the columns that
    constitute each row in the table, while the table itself is described as an array
    of these entry structures.


    For example, here''s the definition of the interfaces table from MIB-2:


    ```

    ifTable OBJECT-TYPE

    SYNTAX SEQUENCE IfEntry

    MAX-ACCESS not-accessible

    STATUS current

    DESCRIPTION

    ```


    > "A list of interface entries. The number of entries is given by the value of
    ifNumber."

    :: { interfaces 2 }


    ```

    ifEntry OBJECT-TYPE

    SYNTAX IfEntry

    MAX-ACCESS not-accessible

    STATUS current

    DESCRIPTION

    ```


    > "An entry containing management information applicable to a particular interface."

    INDEX { ifIndex }

    :: { ifTable 1 }


    ```

    ifEntry :=\nSEQUENCE {

    ifIndex InterfaceIndex,

    ifDesc DisplayString,

    ifType IANAifType,

    ifMtu Integer32,

    ifSpeed Gauge32,

    PhysAddress PhysAddress,

    ifAdminStatus INTEGER,

    ifOperStatus INTEGER,

    lastChange TimeTicks,

    ```'
  merge: -1
