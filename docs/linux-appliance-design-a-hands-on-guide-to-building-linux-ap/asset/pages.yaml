  md: "through possible file descriptors and close each one. You can get the maximum\
    \ number of file descriptors from OPEN_MAX at compile time or from mx = getdtablesize();\
    \ at run time.\n\nOnce you've closed open files, it is good practice to reopen\
    \ stdin, stdout, and stderr; some libraries write to stderr, and therefore stderr\
    \ should be initialized with a valid file descriptor. Instead of using /dev/null,\
    \ some daemons open a log file as.\n\nThe following code redirects these three\
    \ file descriptors by closing them and then reopening them to the /dev/null. The\
    \ code also creates all file descriptors up to the maximum returned from getdtablesize().\n\
    \n```\nint mx;                                // maximum file descriptor\nint\
    \ i;                              // loop index\nint fd0, fd1, fd2;          \
    \         // New FDs for STDIN, OUT and ERR\n\nif (debug_mode) {             \
    \      // Close IN,OUT,ERR if not in debug\n    close(0);\n    close(1);\n   \
    \ close(2);\n}\nfd0 = open(\"/dev/null\", O_RDONLY | O_NOCTTY | O_NOFOLLOW);\n\
    nfd1 = open(\"/dev/null\", O_WRONLY | O_NOCTTY | O_NOFOLLOW);\\nfd2 = open(\"\
    /dev/null\", O_WRONLY | O_NOCTTY | O_NOFOLLOW);\\nif (fd0 != 3 | fd1 != 1 | fd2\
    \ != 2) {\n    LOG(LOG_ERR, ERR, E_STDIO);\n    exit(-1);                    \
    \   // die on errors\n}\n\nmx = getdtablesize();                // get max # open\
    \ files\nfor (i=3; i<mx; i++)                 // Make sure inherited FDs are closed\n\
    \    close(i);\n```\n\n# Set Up Logging\n\nYour daemon should report errors and\
    \ other events of interest. While you are working on the daemon, you will want\
    \ to see debugging information, and you may want to record your daemon's activity\
    \ when it is in operation.\nLogging can fill all of these needs.\n\nThe three\
    \ common destinations for log messages are syslog, stderr, and a log file. It\
    \ is fairly common to see debugging information directed to stderr, errors directed\
    \ to syslog, and activity logs into files.\n\nNOTE If you save log files to a\
    \ local disk, you should probably run cron and have logrotate old log files. Be\
    \ sure to add any custom log files to logrotate configuration.\n\nIf you're building\
    \ a network appliance, you may want to send both errors and use logs to syslog,\
    \ then configure syslog to log messages to a log host on the network instead of\
