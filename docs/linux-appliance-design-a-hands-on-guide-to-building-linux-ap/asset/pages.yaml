  md: 'You should see the following output:


    ```

    /dev/ttySO, UART: unknown, Port: 0x03f8, IRQ: 4

    ```


    The UART type is unknown, which means the port is available.


    # Creating a Device File


    You may recall from the previous chapter that we used a device file /dev/fb0 to
    expose the framebuffer functionality. Similarly, we had to provide a device file
    to expose the dev/lirc_serial functionality. The following code created the character
    device file /dev/lirc with major number 61 and minor number 0, as required for
    the lirc driver.


    ```

    mknod /dev/lirc c 61 0

    ```


    With the Laddie CD, verify that the /dev/lirc device file exists by using the
    command:


    ```

    laddie:~# ls -1 /dev/lirc

    ```


    You should see the output:


    | crw------| 1 root root 61, 2007-01-27 08:03 /dev/lirc |


    This indicates that the file represents a character device that is 1 readable
    and writable by root,  ② with major number 61, and ③ with minor number 0.


    # Loading the lirc_serial Modules into the Kernel


    With the serial port available and the device file in place, we were able to load
    the lirc_serial device driver using the modprobe command:


    ```

    modprobe lirc_serial

    ```


    To verify that the lirc_serial device driver is loaded, execute the following:


    ```

    laddie:~# lsmod grep lirc

    ```


    You should see output like this:


    | lirc_serial 13152 1 |

    | lirc_dev 14804 1 lirc_serial |


    The first column shows the loaded modules; the fourth column shows dependencies.
    Here we see that ① the lirc_serial module depends on ② the lirc_dev module.'
