  md: '# # 9

    DESIGNING A COMMAND LINE INTERFACE


    ![](img/a28f80056348678270f2ea0cfefd7891_158_0.png)


    A command line interface (CLI) gives your customers a secure, low-bandwidth, easily
    scripted way to configure and manage your appliance. As a Linux developer, you
    are already familiar with bash, Linux''s most popular CLI.

    For the same reasons that you would not want to manage a Linux box without a bash
    command line, your customers might not want to manage your appliance without a
    similarly easy-to-manage CLI.

    This chapter covers the following topics:


    +   - Why do you need a CLI

    - Types of CLIs

    - Giving users access to a CLI

    - The Laddie CLI

    - Code review for the test command'
  merge: -1
