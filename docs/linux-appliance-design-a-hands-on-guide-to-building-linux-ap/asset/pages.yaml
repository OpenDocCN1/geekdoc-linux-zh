- img_proc: true
  md: '+   * Linux for Embedded and Real-Time Applications, Second Edition, by Doug
    Abbott (Newnes, 2006)

    * Embedded Linux System Design and Development, by P. Raghavan, Amol Lad, and
    Sriram Neelakandan (Auerbach Publications, 2005)


    # # Who Should Read This Book


    This book is for Linux programmers who want to build a custom Linux appliance
    and support multiple user interfaces, build secure daemons, or provide logging
    and event management. The book may also be of value to any developer who wants
    to minimize the effort to port a daemon’s user interface to different operating
    systems or a different programming language. Our only major assumption is that
    the reader is comfortable programming in C on the Linux platform.


    # # Why Use Linux?


    Before diving into the common architecture found on most Linux appliances, we
    should answer the question, “Why use Linux on an appliance?” While the specific
    arguments vary, we’ve found the following to be true for appliances that we’ve
    built.


    # ## Availability of Source Code


    The availability of source code makes it possible to customize the operating system
    for a particular appliance’s needs. Such customization is not possible when using
    a proprietary, closed source operating system.


    # ## Range of Hardware Supported


    The Linux kernel supports a wide range of processors, from low-end embedded processors
    used in consumer electronics to high-end 64-bit processors used in super-computers.
    For example, Linux runs on Marvell’s ARM-based XScale processors (used in Palm
    handheld computers), Texas ARM-based OMAP processors (used in E28 smartphones),
    IBM’s PowerPC (used in the TiVo and the PlayStation 3), Hitachi’s H8/300 processors,
    as well as Compaq Alpha XP, SUN SPARC, IBM S/390, MIPS, HP PA-RISC, Intel IA-64,
    and AMD x86-64 processors.


    # ## Availability of Linux Developers


    Linux, C, and C++ form the core competency of many computer science graduates
    in the United States, and indeed, worldwide. Exact estimates vary, but the consensus
    is that there are several million Linux-capable developers worldwide.'
