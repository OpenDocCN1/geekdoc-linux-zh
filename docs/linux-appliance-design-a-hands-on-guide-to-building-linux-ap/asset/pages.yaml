- img_proc: true
  md: "single trap will not be a problem. If you can't be sure trap was received,\
    \ you had better keep sending it until someone notices, right? Well, that's one\
    \ approach. Another is just to use informs instead of traps. Informs available\
    \ with SNMPv2 and are essentially traps with built-in reliability. Informs expects\
    \ a confirmation message from the receiver and will retry number of times if they\
    \ don't see the confirm. If this isn't good enough for you, then you might want\
    \ to consider some reduced frequency schedule for resending your trap if your\
    \ device has not received some attention.\n\nEND\n\nLast not least, there's the\
    \ END marker that signals the end of the MIB.\n\n# Validating Your MIB\n\nNow\
