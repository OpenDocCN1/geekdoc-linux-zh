  md: '# PIR motion detectors


    Passive Infrared (PIR) motion detectors detect minute changes in the

    movement of infrared (heat) sources. A person or animal can set off

    PIR motion detector, but, for example, a baseball.


    # Acoustic sensors


    Acoustic sensors detect specific sounds. They are used to detect the

    sound of breaking glass, and are so sensitive that a single acoustic sensor

    protect all of the windows in a room.


    # Floor mat sensors


    Floor mat sensors have switches that can detect the weight of a person.

    They are very thin and are usually placed under carpet at entrances.


    # Vibration sensors


    Vibration sensors can detect very slight physical motion. They are often

    used to protect cars.


    # Smoke and carbon monoxide detectors


    These sensors are used to detect potential fires.


    # Temperature sensors


    Thermostats and other temperature sensors trip at a certain temperature

    or simply report the current temperature in the zone. They are often

    used to protect temperature-sensitive equipment and supplies.


    # Sensor Contact Type


    To the alarm system, most sensors look like switches. The switch contacts can

    be either when not in alarm (called normally open or NO sensors),

    closed when not in alarm (normally closed or NC sensors). When you install a

    sensor, you have to tell the alarm system the contact type of sensor—that is,

    whether the contacts are normally open or normally closed. Most sensors are

    normally closed. A normally closed sensor has the desirable property of

    trigiggering an alarm if the wires to the sensor are cut.


    Another helpful feature of the sensor-and-zone setup is that it is possible

    to cascade sensors within a zone, as long as the cascaded sensors are all of the

    same contact type. Figure 5-2 shows how to cascade normally open sensors

    and Figure 5-3 shows how to cascade normally closed sensors.


    # Cascading NO Sensors


    ![](img/a28f80056348678270f2ea0cfefd7891_86_0.png)


    Figure 5-2: How to cascade normally open sensors'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Cascading NC Sensors


    ![](img/a28f80056348678270f2ea0cfefd7891_87_0.png)


    Figure 5-3: How to cascade normally closed sensors


    Logically, the alarm system sees just one sensor in each zone, even if there are
    actually several cascaded sensors there.


    # Latching a Sensor


    Most sensors return to the non-alarm or normal state when the detected condition
    is removed—for example, when someone closes a door or steps off a floor mat. You
    usually want to configure the alarm system to latch alarms detected by these sensors.
    Latched alarms remain in alarm, even if the detected condition is removed, until
    they are manually cleared by a user.


    However, you might not want to latch every sensor. For example, you might want
    to automatically remove an alarm when the temperature in a thermostat-protected
    room returns to normal.


    Think about the type of sensor you''re using and your specific needs when you
    set alarms in a zone to be latching or non-latching.


    # Enabling a Zone


    Mark zones as enabled if the sensors in the zone are working and you want to monitor
    the zone. Unused inputs can be ignored by disabling the zone. Also, you may find
    it convenient to temporarily disable zones when you want to leave a door or open
    window.


    # A Functional Specification for Laddie


    The Laddie system monitors up to five zones and raises an alarm when a change
    occurs in one of the monitored zones. Alarms are reported to Laddie''s five different
    user interfaces. In addition to being able to view the status of the zones that
    Laddie monitors, the user interfaces allow you to test and clear alarms, view
    logs, and configure zones. Configuration parameters include the following:


    +   - Zone name

    - Contact type

    - Latching or non-latching

    - Enabled or disabled'
