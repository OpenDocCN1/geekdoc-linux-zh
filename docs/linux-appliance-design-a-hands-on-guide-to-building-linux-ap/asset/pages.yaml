    do what we did, which is just at wait least five milliseconds between writes.
    The exact time is dependent on the version of HD44780 that you use. For this book
    we used a display we bought on the surplus market, so we had to experiment with
    it to find the right delay.


    # Design Notes


    While the HD44780-based display can be thought of as a simple ASCII terminal,
    there were a couple of decisions that we needed to make when we designed our API
    and device driver. The first was how to handle the RS pin. Since both commands
    and display characters are eight bits in length, we could not mix display characters
    and commands in the same byte. We saw three ways to get around this problem: We
    could send commands using i2c, we could use an escape sequence to bury the commands
    in the character string, or we could have two different devices for the display,
    for characters and for commands. We chose to use an escape sequence. The HD44780
    used no display characters in the range of 0x10 to 0x1F, so we used 0x10 as the
    escape code for HD44780 commands and 0x11 as the escape code for commands to control
    the front panel LED.


    The other consideration in our design was how to handle the five-millisecond delay
    between writes. We could have put a usleep(500) between writes, but this would
    have been a problem when updating all 32 characters on our display (You may recall
    that the reason for writing a device driver was to have a guaranteed scan rate
    for the keypad.) We handled the five-millisecond delay by writing all output bytes
    into a circular buffer and reading one byte from the buffer each time we scanned
    the keypad. This slowed the maximum rate that we can output characters but was
    simple and effective.


    The Linux device driver that we wrote to draw our display is available on the
    CD. Look in the source files under front_panel.


    # Further Reading


    The HD44780 came out some time ago and is in fact no longer available. Nonetheless,
    it set the standard for alphanumeric LCD displays, and HD44780-compatible parts
    are still available from several vendors. A web search will locate data sheets
    for several HD44780-compatible parts, including the Samsung S0060U we used:


    Our review of the HD44780 is very from complete. If you are considering any alphanumeric
    displays on your appliance, you might want to make use of some of the online resources
    we used:


    +   - http://epemag.wimborne.co.uk/resources.htm A simple introduction to the
    HD44780

    - http://home.ieael/users/pouweha/lcd/lcd.shtml Offers details on HD44780 interfacing

    - http://weio.com/datashet.htm Data sheets on HD44780-compatible parts'
  merge: -1
