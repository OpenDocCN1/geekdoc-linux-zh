    This example implements two button widgets. You can select the buttons by pressing
    the arrow keys on your keyboard, and you can activate them with the ENTER key.
    When you activate the Hello button, it prints Hello, world! to the standard output,
    which you can verify after closing the UI by activating the Exit button.


