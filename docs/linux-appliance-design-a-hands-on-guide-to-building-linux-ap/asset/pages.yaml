  md: '# # The Architecture of the Laddie Appliance


    This book''s sample appliance is an alarm system that uses the input pins on a
    parallel port for input from the alarm sensors. The UIs include web, command line,
    LCD with a keypad, framebuffer with IR remote control, and SNMP.


    The daemons on our appliance include the alarm system daemon and one to respond
    to appliance events. We chose not to implement all of the daemons in Figure 1-2
    so that we could focus on describing how to build and secure daemons in detail.


    Of course, our sample appliance includes ladd (the defining appliance), an event
    handler, and a utility to make common Linux configuration files using a protocol
    common to all the UIs.


    Figure 1-3 shows the architecture of the Laddie appliance and maps the UI, feature,
    or daemon to a chapter number or appendix so you can see how things will come
    together through the book.


    ![](img/a28f80056348678270f2ea0cfefd7891_28_0.png)


    Figure 1-3: A chapter map of the Laddie appliance


    We''ve limited the functionality of our UIs to make them more useful as tutorials.
    Only the web interface is full featured and representative of what a real appliance
    might have.


    # ## Summary


    Most Linux appliances have a common architecture: Linux on the bottom, the defining
    application on top, and common services and UIs in the middle. We discussed some
    of the reasons to include various daemons and UIs and mapped this book''s chapters
    into an architecture diagram.


    The next chapter looks at the API between the UIs and daemons, since the chosen
    API impacts both UIs and daemons.'
