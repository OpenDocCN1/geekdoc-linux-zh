    # Summary


    As illustrated in Figure 11-14, building an appliance’s GUI requires a few layers.


    ![](img/a28f80056348678270f2ea0cfefd7891_219_0.png)


    Figure 11-14: The Laddie framebuffer UI and graphics stack


    The Linux framebuffer device driver provides an abstraction of video hardware
    that facilitates configuring the video mode and manipulating pixel memory. Various
    graphics libraries are available that use this device driver, and these libraries
    provide support for manipulating graphical objects and text. These libraries typically
    provide support for event handling, as well. We chose to use the Simple DirectMedia
    Layer for the Laddie appliance because it is well supported, well documented,
    and lightweight. GUI toolkits supply the next layer; they provide and manage widgets,
    for which the input events and the graphical display are tightly coupled. For
    the appliance, we developed a thin GUI toolkit, STBmenu, which is intended for
    use with simple, handheld remotes, and facilitates adding a GUI layer to an existing
    application with little additional effort. In support of this last point, we also
    showed how we connected the Laddie framebuffer UI to the alarm daemon using the
    RTA/PostgreSQL protocol and the logmux handler. In the next chapter, we will complete
    the Laddie framebuffer UI by adding support for remote control.'
