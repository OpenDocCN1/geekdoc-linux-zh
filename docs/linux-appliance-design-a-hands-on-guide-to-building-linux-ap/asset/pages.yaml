  md: '+   4) Help

    5) Quit


    [1-5] :Selecting one item in the menu may prompt the user with a sub-menu

    or drop him into a wizard to collect configuration information.

    Menu CLIs have fallen from favor but remain the right choice if you

    pect your CLI to be used frequently or by untrained users. There is

    practically no learning curve to using a menu CLI.

    Menu CLIs can be scripted, but the scripts are fragile since they can

    broken by even a small change to the menu layout.


    # Stateful


    Stateful CLIs maintain a sense of what the user is. For example, bash is

    ful that it supports a current working directory with the cd verb to

    mulate its state. Another good example of a stateful CLI is the help

    system in the graphics package includ. However, statefulness may be more

    accurately described as a property of CLIs rather than a separate type of

    them, wizard, menu, and stateful CLIs can all be stateful.


    Stateful CLIs are nice if you expect users to spend a lot of time in

    your CLI. They help the user by presenting context-sensitive help (i.e.,

    base on state or location) and by reducing how much typing the user has

    to.


    Stateful CLIs require more documentation and training to explain the

    states and state manipulation, and they can be a little tricky in scripts since

    is easy to forget the state as part of the script. How many of us have

    forgotten to put a cd at the top of a bash script?


    # Character vs. Line Interfaces


    A term coming into popular usage is character interface, which refers to an

    interface that looks at each character as it is entered. In contrast, a classic

    line interface looks at the command only when the newline is entered. The

    editor vi has a character interface, while its precursor ed, has a CLI in the

    classic sense. Another common example of character interface is bash, with

    tab completion and line-editing capabilities.


    Character interfaces, such as the one in vi, can greatly reduce the amount

    of typing a user needs to do, and tab completion can be a great help to new

    in infrequent users; however, character interfaces require a lot of work on

    the part of the interface designers and coders.


    # Giving Users Access to a CLI


    Once you have a CLI, you need to give your users access to one. One way do

    is to let them log in and have start the CLI from a bash prompt.

    This can make scripting easier, but few appliances allow direct access to a

    Linux login.'
