    This program is meant to be a simple demonstration; to build a useful framebuffer
    interface would require a good deal more work. For example, we haven''t discussed
    displaying text or responding to keyboard input, and we haven''t written code
    to recover the screen after blanking out or get rid of the cursor in the upper-left
    corner. We could write code to address these problems, but in fact, they have
    already been solved by graphics libraries that work on top of the framebuffer
    interface. In the next section, we will consider two choices for graphics libraries
    and work through an example with them, the Simple DirectMedia Library. If you
    would still like to spend more time mastering the framebuffer interface, see the
    header file /usr/src/linux/include/linux/fb.h and the documentation files in the
    directory /usr/src/linux/Documentation/fb.


    # Graphics Libraries


    Using the Linux framebuffer interface, we have reduced the problem of manipulating
    pixels on the display to the problem of writing pixels to memory. But think of
    some of the ways in which we would like to manipulate display pixels: drawing
    lines of a specified thickness, drawing windows with rounded edges and a three-dimensional
    col, transferring images, or drawing text with a given font and size. These are
    nontrivial problems; that''s why we need a graphics library. With an appropriate
    graphics library, we can write programs that manipulate lines, windows, images,
    and text, and let the underlying library decide what to do with pixels.


    The most common library for manipulating graphics objects in Linux is Xlib. Xlib
    is actually more than a graphics library; it is the interface by which clients
    access an X window display server. Because of its popularity, building a Linux
    appliance on top of X system can be a good choice. Xlib is cumbersome to program
    directly, but an UI developer can choose among several competing GUI toolkits
    (for example, Qt, which is used by the KDE desktop, or GT+, which is used by the
    Gnome desktop). Alternatively, UI developers can include an X-based web browser
    on the appliance or as a set of web pages. In any of these cases, UI development
    for the appliance would be little different from UI development on a Linux desktop.


    On the other hand, the X window system is complex and provides features that will
    not be needed on an appliance. Because X is network-oriented, it introduces an
    additional network layer between Xlib and the Xserver. X incorporates support
    for multiscreen displays and multiple clients, and it also provides for window
    management that is not controlled by the client application. These are nice features
    for a distributed networking environment, but their complexity makes X an expensive
    option'
