    # savefile


    The need to save configuration data from one boot of the appliance to the next
    is so common that the authors of it included the ability to automatically save
    table data in a file when the RTA is updated. There is one file per table, and
    the name of the file is specified in the TDEF structure of the savefile. You can
    mark the columns to save by adding the RTA DISSAVE flag to the column definition.


    The save file contains a list of UPDATE statements, one for each row in the table.
    The save file is read from the disk and applied to the table when you initialize
    the table with the rta_add table(). The combination of RTA DISSAVE on a column
    and a savefile for the table eliminates the need to parse XML or INI files to
    get or saved configuration values. Of course, you can use XML or INI if you prefer
    to—just the save pointer to null.


    # iterator


    An iterator is a subroutine in your code that steps through a linked list or other
    arrangement of the rows in your table. The iterator lets you treat a linked list,
    a B-tree, or just about other scheme for organizing data as if the data was in
    a table.


    The iterator function is called with three parameters: a pointer to the current
    row, the void pointer it_info from the TBLDEF, and the zero-indexed row number.
    The function returns a pointer to the next row. When RTA asks for the first row,
    the current pointer is NULL, and the desired row index is zero. The function should
    return a NULL when RTA asks for the row after the last row in the list. If an
    iterator is defined, the address and members in the TBLDEF are ignored. This is
    its function prototype.


    ```

    void iterator(void *cur_row, void *it_info, int rowid);

    ```


    There is one caveat when using iterator functions: Loading a save file may fail
    if you have not already allocated all the links in the linked list. (Remember,
    the save file is a list of UPDATE statements and expects the rows to already exist.).
    Fortunately, there is a simple way around this problem. Always keep one unused
    row available, and when that row is written by an UPDATE statement, have a write
    callback row so that you can stay one step ahead of the UPDATES. The longterm
    program presented in Chapter 7 uses this technique.'
