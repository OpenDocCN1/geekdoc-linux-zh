    Exit Setup Clear All


    E-1: The Laddie framebuffer user interface


    # Accessing the Web Interface


    The Laddie appliance boots up with the static IP address 192.168.1.11. If your
    PC is connected to a local area network with an Ethernet card recognized by Laddie''s
    operating system, the appliance will serve web pages that allow you to monitor
    and control the appliance (see Figure E-2). You can access this web interface
    with a browser on the local network by using the URL://192.168.1.11.


    ![](img/a28f80056348678270f2ea0cfefd7891_362_0.png)


    | Zone Name Status |

    |---|---|---|

    | 1 Garage Door | Safe |

    | 2 Motion Detector | Alarm Clear |

    | 3 Front Door | Safe |

    | 4 Kitchen Window | Safe |

    | 5 Refrigerator | Safe Set |


    E-2: The Laddie web interface


    > NOTE You can also use the text-based web browser Lynx to access the Laddie web
    pages. Type lynx as a command prompt, and then navigate by following the instructions
    at the bottom of the display.


    # Experimenting with the Linux Shell and Other User Interfaces


    In addition to the framebuffer and web interfaces, the Laddie appliance supports
    a command line interface, a front panel interface, and an SNMP interface. When
    experimenting with these other interfaces, you will find it useful to have a Linux
    shell so that you can directly interact with the operating system. If the Laddie
    appliance is on a network, you can access a login shell using telnet (i.e., telnet
    192.168.1.111). To log in, enter the username and an empty password. You can switch
    from the framebuffer user interface to a login prompt by pressing CTRL-ALT-F1.
    (If you want to return to the framebuffer interface later, press CTRL-ALT-F7).'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'Please see the appropriate chapters for instructions on accessing the CLI,
    front panel, and SNMP interfaces.


    # Shutting Down the Laddie Appliance


    The Laddie operating system will not eject the CD while the system is running
    because it relies on the CD for necessary system files. To eject the CD and return
    to your original operating system, reboot your computer by typing reboot in a
    Linux shell. When you see the Laddie boot prompt (as shown in "Booting the CD"
    on page 338), press the spacebar to interrupt the automatic boot, eject the CD,
    then press CTRL-ALT-DEL to reboot your computer with your original operating system.


    # Exploring the CD Contents


    If you boot the Laddie appliance and you''ll find that most of the top-level directories
    exist in the ramdisk, and only the /bin, /lib, /sbin, and /usr are linked back
    to the CD. In particular, all the directories related to the Laddie appliance
    are read-write, so you can use the CD to experiment with, rebuild, and reinstall
    the appliance.


    # Laddie Appliance Source Code


    The Laddie Appliance software is provided in /Code/src and is partitioned into
    packages corresponding to the various user interfaces and services. The binaries
    and related files are installed in /opt/laddie. Table E-1 identifies the source
    and install directories for each of the Laddie appliance components.


    Table E-1: Source and Install Directories for Laddie Appliance Components


    | Component | Source in (/Code/src) | Install Directories |

    |---|---|--|

    | Command line interface | cli | /opt/laddie/{cli,bin} |

    | Empty daemon (used by other components) | empd | n/a |

    | Framebuffer interface | fbmenu | /opt/laddie/{fbmenu,bin} |

    | Front panel | front_panel | /opt/laddie/bin, /opt/laddie/htdocs/front_panel
    |

    | Laddie alarm daemon | ladd | /opt/laddie/(bin) |

    | System logger | logmuxd | /opt/laddie/(logmuxd,bin) |

    | Network daemon | network | /opt/laddie/(network,bin) |

    | SNMP agent and MIB | snappmp | /opt/snmp/sbin, /opt/snmp/share/snmp/mib |

    | STmenu | stbmenu | /usr/local/{include,lib} |

    | DB-to-file utility | tbl2filed | /opt/laddie/{tbl2filed,bin} |

    | Web interface | web | /opt/laddie/htdocs/web |'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'In addition to these components, the /Code/src directory contains the buildappd
    subdirectory, which contains scripts and files that support building the appliance.
    This subdirectory also contains an examples programs we discuss in the text.


    Where appropriate, component subdirectories include Makefiles. There is also a
    top-level Makefile in /Code/src that allows you to build and re-install the entire
    appliance with these commands:


    ```

    laddie::# make

    laddie::# rm -rf /opt/laddie

    laddie::# make install

    ```


    If you''d like to study the source code, a good place to start is the alarm code
    in /Code/src/ladd subdirectory. This is a simple application, but it demonstrates
    both the empty daemon and the RTA library. The entry point for this service is
    in /Code/src/emd/main.c. The function main callsappInit ladd.c, which uses RTA
    to publish a table of alarm zones.


    # Laddie Appliance Libraries


    The Laddie appliance uses several libraries. The RTA library is provided in the
    /usr/src/packages/rta-q0.7.5.tgz, and it is installed in /usr/local/lib and /usr/local/include.


    The PostgreSQL, the lightweight daemon, and the SNMP utilities are well-documented
    open-source projects that we have compiled and installed without patches. The
    source code for we use is provided in /usr/src/packages:


    +   - postgresql-base-8.0.1.tar.bz2

    - lightpd-1.4.10.tar.gz

    - net-snmp-5.1.3.1.tar.gz


    The RTA library and PostgreSQL client do not have configuration files. The lightpd
    daemon uses the configuration file at /etc/lightpd.conf. PHP’s configuration file
    is in /etc/php.ini.


    # Startup Scripts


    In order to launch the appliance at system startup, we add scripts to the /etc/rc.init.d
    directory. We also provide links from /etc/rc.rc3.d so that these scripts will
    be invoked in runlevel 3. The Laddie startup scripts include ladd, logmuxd, networkd,
    snmpd, and tb2field. Each of these scripts also provides for the graceful termination
    of the appliance system shuts down. The framebuffer user interface is launched
    at startup using the fbmenuctl, but because the console must be launched first,
    we invoke it from the /etc/inittab file.'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'For convenience testing, we provide the laddie script in /opt/laddie/bin. This
    script invokes all of the startup scripts specific to the appliance.


    # The Linux From-Scratch Distribution and Additional Packages


    Had this been a real Linux appliance, we might have opted for a simpler Linux
    environment. We might have used a smaller kernel, BusyBox utilities, and uclib
    libraries. But our emphasis is not embedded Linux, and we feel a more generic
    Linux environment keeps the focus on the appliance architecture.


    As a starting point, we used Linux From Scratch (http://www.linuxfromscratch.org),
    a distribution that includes most of the tools we needed to build our appliance,
    and does not include the X Window System (which we didn''t need). All the packages
    required to rebuild the Laddie appliance are included in the /usr/src/packages
    directory. Most of these packages were installed according to instructions from
    the Linux documentation, which is also included in the /usr/src/packages directory
    as LFS-BOOK-6.0.pdf. Additional packages include the following:


    | PostgreSQL | FreeType2 and Bitstream fonts | SNMP |

    |---|---||

    | PHP | utenetld | nettools, libnet, libcap, and arping |

    | SNMP | gdbserver | lynx |

    | dhcpcd | dialog | pcuitils |

    | fbset | setserial | lighthtpd |

    | SDL and SDL_ttf | UIRC | fanout |

    | Pure-FTPd | | |


    > See the file /usr/src/packages/HISTORY for detailed installation notes for these
    additional packages.


    # Rebuilding the Laddie Appliance


    As a quick illustration of the CD’s filesystem structure, let''s modify and reinstall
    a portion of the Laddie appliance. This won''t be permanent; we won''t create
    a new CD. We''ll just add a line to .c in the alarm daemon, recompile it at the
    Linux shell prompt, reinstall it, and run it.


    If you''d like to follow along, boot up an x86 PC using the Laddie CD and bring
    up a shell console. See “Booting the CD” on page 338 for instructions.


    This exercise assumes you can use the vi editor. If you''re not familiar with
    vi, you can get up to speed quickly with vimutor, which is also provided on the
    CD.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '+   1. Since the alarm daemon will already be running, kill it with this command:


    ```

    laddie~# laddie stop

    ```


    +   2. Then use the following commands to enter the alarm daemon directory and
    open the ladd.c file for editing:


    ```

    laddie~# cd /Code/src/ladd

    laddie~# vi laddie.c

    ```


    +   3. In the function user_update() at the end of the file, find the following
    lines:


    ```

    syslog(LOG ALERT, "User set alarm on zone %d, %s",\Zone[rowid].id, Zone[rowid].name);

    ```


    +   4. Immediately after these lines, insert the following:


    ```

    syslog(LOG_ALERT, "Hello, world! I''ve modified the alarm daemon!");

    ```


    +   5. Save the file and quit. Build and reinstall ladd with the commands:


    ```

    laddie~# export DEF_APPDIR=/opt/laddie

    laddie~# make -e

    laddie~# make -e install

    ```


    **NOTE** The Laddie appliance components use the environment variable DEF_APPDIR
    to specify the install location. The default is the more conventional location
    /usr/local, but we use /opt/laddie instead to make it easier for you to identify
    the components that are specific to the appliance. The -e option tells the make
    utility to let environment variables override variables that occur in Makefiles.


    This will create a new executable and install it in /opt/laddie/bin. Then start
    the alarm daemon by entering this command:


    ```

    laddie~# laddie start

    ```


    +   6. Press ESC to exit the framebuffer user interface. Then monitor the system
    logs with this command:


    ```

    laddie~# cat /var/log/messages

    ```


    Log messages are routed to the pipe /var/log/messages by the logmuxd event handler.
    Using cat, we can display these messages in the console. The command will do nothing
    until an event occurs.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '+   7. To create a user update event, use CTRL-ALT-F2 to switch to console
    2, and then run the command line interface:


    ```

    laddie:~# cli

    ```


    +   8. Create an update event with the following commands:


    ```

    clear all

    test 1

    quit

    ```


    +   9. Now use CTRL-ALT-F1 to switch back to the original console. If you reinstall
    worked, the displayed log messages will contain a time-stamped entry with your
    new “Hello, world!” message.


    +   10. Use CTRL-C to terminate the logging display.'
