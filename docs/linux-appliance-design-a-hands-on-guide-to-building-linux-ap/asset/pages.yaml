  md: "# Columns\n\nOne big advantage of RTA is that you don't need to marshal the\
    \ data into and out of the protocol. RTA uses your data as it already exists in\
    \ your program. Of course, you have to describe your data so that RTA can access\
    \ it intelligently. A table is made up of columns, and we need to describe each\
    \ column in the table. This is the purpose of RTA's COLDEF data structure.\n\n\
    You can also have members in your data structure that are not defined by a COLDEF.\
    \ Such hidden columns might include information that you do not want to be visible\
    \ to the UIs, or binary data that have no meaning if it was displayed to the user.\n\
    \nA COLDEF contains nine pieces of information about each of your structure's\
    \ members.\n\n```\ntypedef struct {\n    char *table;          // name of column's\
    \ table\n    char *name;           // name of column for SQL requests\n    int\
    \ type;             // data type of column\n    int length;           // width\
    \ of column in bytes\n    int offset;           // number of bytes from start\
    \ of row\n    int flags;            // flags for read-only and save-to-file\n\
    \    void (*readcb)();      // routine to call before reading column\n    int\
    \ (*writecb)();     // routine to call after writing column\n    char *help; \
    \          // description of the column\n} COLDEF;\n```\n\n# table\n\nThe table\
    \ field specifies the name of the table as seen from the UI programs.\n\n# name\n\
    \nThe name field specifies the name of the column. Use this name when selecting\
    \ or updating this column.\n\n# type\n\nThe type of the column is used for syntax\
    \ checking and for SQL SELECT output formatting. The currently defined types include:\n\
    \n```\nRTA_STR      // string, (char *)\nRTA_PTR      // generic pointer (void\
    \ *)\nRTA_INT      // integer (compiler native int)\nRTA_LONG     // long (actually\
    \ a gcc 'long')\nRTA_FLOAT    // floating point number\nRTA_PSTR     // pointer\
    \ to string\nRTA_PINT     // pointer to integer\nRTA_PLONG    // pointer to long\n\
    RTA_PFLOAT   // pointer to float\n```"
