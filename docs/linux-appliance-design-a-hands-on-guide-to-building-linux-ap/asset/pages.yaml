- img_proc: true
  md: '# Control and Status Protocols


    One way to overcome the limitations of the approaches described above is to use
    a protocol for control and status to separate the daemon from the user interfaces.
    Figure 2-4 illustrates a daemon offering a single application programming interface
    (API) to be used by all of the clients and user interfaces.


    One Protocol for Control and Status


    ![](img/a28f80056348678270f2ea0cfefd7891_34_0.png)


    Figure 2-4: Using one protocol between the daemon and user interfaces


    A control and status protocol has several advantages over the alternatives:


    # Reduced complexity for multiple user interfaces


    A control and status protocol simplifies the user logic in the daemon, since the
    daemon only needs to implement the protocol. The user interfaces can be implemented
    independently using the languages and tools appropriate to the interface. For
    example, a web interface could be built with Apache and PHP, while an SNMP interface
    could be built with Net-SNMP and C.


    # Access to the daemon when it is running


    Users want access to an application while it is running in order to get status,
    statistics, and run-time debugging information. A control status protocol can
    give you competitive advantage over applications that are limited to file access
    only at startup or SIGHUP. You might note that Microsoft users do not configure
    a daemon by editing a file; they configure the daemon through the daemon itself.
    Therefore, designing your daemon to be configured in this way can make it easier
    for Microsoft users to migrate to their software.


    # Remote network access


    Remote access can speed development and testing, since you can work on the appliance
    from almost any networked workstation. Remote access is useful to your customers
    who manage a large number of appliances from a central operations management center.
    Furthermore, remote access will be required by your technical support to help
    diagnose problems in the field.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Parallel development


    Decoupling the management user interfaces from the daemon means that you can have
    two teams working on the project in parallel. Staffing is easier because you can
    hire people with just the skills needed to develop a specific piece of the project.
    Separating user interface developers and daemon developers has another advantage:
    It forces you to think through and define your daemon''s interface early in the
    development, which changes are easiest to manage.


    # Easy scaffolding


    Because the user interface is separate from the daemon, building a scaffold around
    each piece of code is a clean and easy process. Once you build a scaffold, you
    can test even if all the pieces aren''t in place.


    # Improved security


    Using a control and status protocol for your daemon can increase the security
    of your appliance in two ways. First, the user interfaces need not run with the
    special privileges as the daemon, which means less code with special privileges
    is running at any time. Second, using a tightly defined protocol lets you on securing
    the protocol and its API. This is much easier than saying, an all-in-one approach.


    A control and status protocol can use a serial connection, a Unix or TCP socket,
    to file reads and writes, or it might be hidden in a library call. These techniques
    are described later in this chapter. As a preview, consider the following examples,
    which set a single bit cntl_pt.


    ```

    AT commands AT501=1

    XML <rpc><cntl_pt><value></cntl_pt></rpc>

    Library call ret = set_cntl_pt(1);

    /proc echo 1 > /proc/sys/mydev/cntl_pt

    SQL UPDATE my_table SET cntl_pt = 1

    ```


    # Requirements for a Control and Status Protocol


    If you design your own control and status protocol, you should judge your design
    on the following criteria: its data model on client and daemon, re-use of existing
    protocols and software, the constraints it places on clients and daemons, and
    the ease with which can discover their system:


    # The data model


    The control and status protocol should allow the client and daemon to have the
    same data model. That is, if the daemon uses variables, structures, lists, and
    arrays, then the client on the other side of the control and status protocol should
    also support variables, structures, lists, and arrays. Having the same data models
    on both sides of the protocol makes it easier to re-use, and it helps programmers
    maintain a consistent view of the problem they''re trying to solve.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Use existing standards and code


    The control and status protocol should use existing software and standards whenever
    possible. You may be able to find developers who already know the protocols and
    software are likely to have good documentation for the developers who need to
    learn them. Using existing code is almost a good idea, since less new code means
    fewer devs.


    # Few constraints on the daemon and clients


    Ideally, the protocol would place few constraints on how you design your daemon
    and wouldn''t increase the daemon''s size. You should be able to add the control
    and status protocol to your program to the main source files. When retrofitting
    old programs with the control and status protocol, you should be able to put the
    bulk of the new code in separate source files, instead of interweaving the changes
    into the main code base. Client binding for your protocol should be available
    for all major programming languages: at least Java and PHP for web interfaces,
    and C and C++ for compiled code.


    # Discovery mechanism


    We want to discover the information that is available from the appliance without
    relying on documentation. For example, the ls command covers files which are available
    in a Unix filesystem; the get-next operator discovers what is in a SNMP MIB; the
    system tables describe the database itself. In a similar way, we want a mechanism
    whereby a user can discover what can be configured on an appliance and what information
    is available from the appliance.


    # Common Control and Status Protocols


    In our work have developed several control and status protocols, which we will
    describe in this section. As you''re reading, to judge them in terms of the four
    criteria presented in the previous section.


    # AT Commands


    In our first control and status protocol, we used a variation of the Hayes AT
    command set. The appliance we were working with a radio modem, most of our customers
    were already familiar with that command set, making it a logical choice. Our daemon
    listened for incoming TCP connections. Using TCP gave us remote access for diagnostics
    and configuration.


    We stored the system configuration as a list of AT commands. At system startup
    the daemon would read the configuration file and run it through the AT command
    interpreter. This approach meant that we did not need to add code to process a
    different format for the configuration files. While XML and INI are the standards
    in configuration, we did not want to add code and complexity if we could easily
    avoid it.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'The AT command protocol had two limitations. First, we could not

    conveniently access data arrays using the standard AT-register syntax.

    Second, client-side programmers had to write a lot of code to generate the

    AT commands and parse the replies.


    # Extensible Markup Language


    We Used Extended Markup Language (XML) as the control and status

    format to manage Juniper routers. Examples of XML protocols

    include XML-RPC, SOAP, and JUNOScript. JUNOScript manages Juniper

    routers through a telnet or SSH connection. It enables you to encode

    commands in XML, and the router replies with XML responses. For

    example, a result for the running configuration looks like this:


    ```

    <rpc>

    <get-configuration/>

    </rpc>

    ```


    Prior to the availability of JunoScript Juniper routers were configured via

    a command-line interface (CLI). The advantages of XML over CLI became

    apparent when you manage routers with a program rather than by hand

    (especially if you had to write that program). It is easier to write code for

    parsing XML responses than for parsing CLI responses. Other advantages of

    XML include its flexibility in representing rich data and the availability of

    software libraries for processing XML formats.


    Exchanging XML between a client and server requires the

    addition of a transport protocol. You could use telnet or SSH, like

    JUNOScript does, or you could use HTTP, as specified by the SOAP

    XML-RPC standards.


    Typically, you would use a library to parse the XML on the server side,

