  md: '# Summary


    In this chapter you have seen how to apply for an enterprise number, develop an
    MIB, and validate that MIB. The hard part is trying to design the MIB structure
    to accommodate future changes. Our task for Laddie has been fairly simple because
    our whole MIB revolves around a simple RTA table, and the MIB is unlikely to evolve
    much time. A designer working on a MIB for a real appliance doesn''t have it so
    easy. We suggest thinking about the basic types of information you may need to
    have, regardless of what direction your product takes in the future. For example,
    you may have:


    +   * Configuration information

    * Statistics

    * Historical information

    * Miscellaneous run-time states

    * Performance measures

    * Usage levels

    * Service or resource saturation levels


    This may guide you in structuring your MIB to make your life easier as future
