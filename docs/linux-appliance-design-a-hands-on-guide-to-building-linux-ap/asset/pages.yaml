    # The SNMP Protocol


    Although worthy of a chapter all its own, we can understand most of what we need
    to know about the SNMP protocol from the Protocol Data Units (PDUs) it defines
    and their uses.


    # The Basic Commands: GET, SET, GETNEXT


    The SNMP protocol is used to exchange information between managed systems and
    the applications written to manage them. Managed systems host a daemon called
    an agent, usually named snmpd, which provides the ability to read information
    from or write to one or more MIBs. The GET, SET, and GETNEXT PDUs are used to
    read from, write to, and walk a MIB.


    # Walking a MIB with GETNEXT


    GETNEXT allows you to name one object and ask the agent to return the OID and
    value of the next object in the MIB tree. Walking a MIB means starting at some
    point in the OID tree and traversing the entire subtree below it with repeated
    use of the GETNEXT command. The walk is finished when the OID returned is not
    within the subtree defined by the first OID. An application can find out which
    MIBs are supported on a managed system by walking the entire MIB tree in this
    way.


    # Traps and Informs


    Managed systems can also spontaneously send information to a configured target-management
    node, a process called sending an SNMP trap or inform. A trap is sent toward a
    target system, the sender never knows if it got there. An is an improvement over
    a trap because it expects a reply; it can be retrieved if the reply is not received
    in a reasonable amount of time.


    # Command-Line Tools: Examples


    Let''s look at some examples of using command-line tools that use the SNMP PDUs
    we have just discussed to achieve their function. These commands are supplied
    as part of the Net-SNMP package (http://net-snmp.sourceforge.net), which we use
    throughout the SNMP chapters in this book.


    To retrieve the sysbescr field in the previous section, you might issue the command


    ```

    snmpget -c public 10.1.1.21 .1.3.6.1.2.1.1.0

    ```'
