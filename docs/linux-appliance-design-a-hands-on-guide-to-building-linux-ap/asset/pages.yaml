  md: 'latching (Configuration)

    The user sets this field to 1 to have an alarm persist even after the sensor pin
    returns to its normal state. The user must manually clear latched alarms.


    # input (Status)


    This field shows the most recent raw value of the input pin. This is a field,
    and the user is not able to edit it.


    # alarm (Status)


    Each zone is said to be in either an alarm condition or in a safe condition. This
    field is set by the ladd daemon in response to detected edges on the input pin.
    A write callback on this field lets a user test a zone by writing 1 to it. An
    alarm is cleared when the user sets this field to 0.


    # count (Status)


    This field contains the number of input edges that have caused an alarm. This
    field is incremented only when the zone is marked enabled, it is not incremented
    by user-initiated tests of the zone. This is a read-only, statistic field that
    is set to zero when ladd starts.


    You may recall that the advantage of RTA is that it gives all of the user interfaces
    the same API for daemon configuration, status, and statistics. The API defined
    by RTA is that of a PostgreSQL database. The advantages of PostgreSQL are SQL
    is widely used and understood and there are many bindings for PostgreSQL, including
    C, PHP, Java, and Perl. Figure 5-4 illustrates Laddie''s use of RTA to allow five
    different UIs to get status and set configuration using only one daemon-side protocol.


    ![](img/a28f80056348678270f2ea0cfefd7891_89_0.png)


    **Figure 5-4: One daemon with many user interfaces**


    Let''s look at the SQL for some typical Laddie configuration changes and queries.'
