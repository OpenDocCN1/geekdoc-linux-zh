    # # Internal RTA Tables


    When you use the RTA library, your application will include the following four
    RTA tables.


    | Table Name | Description |

    |---|---|

    | rta_tables | A table of all columns |

    | rta_columns | A table of all columns |

    | rta_dbg | A table of logging control variables |

