    # Filters


    Continuing with the example, we are going to use the first row in Filters, we
    are going to update it or two columns at a time so that we can better explain
    just those columns.


    # destype


    You may recall that the destype is an integer that implicitly selects which of
    the destination tables this filter will use as its destination. A destype of 3
    is used for accepted TCP connections.


    # destname


    There may be multiple, independent destinations within a destination table. We
    need some way to distinguish one destination from another, so we give each destination
    a name. The destype in the Filter table selects which destination table to use,
    and the destname selects which row in that table to use. For this example we assign
    a name of example_2.


    ```

    UPDATE Filters SET destype = 3, destname = "example 2" LIMIT 1;

    ```


    # regex


    If we combine the regex pattern we first looked at the train arrival example with
    simple SQL, we get the command to set the regex pattern in our filter.


    ```

    UPDATE Filters SET regex = "Train from [[A-Za-z -]+\] arriving on Track number
    ([0-9]+)" LIMIT 1;

    ```


    # level and facility


    The logmuxd daemon routes based on the level and facility of the incoming message.
    In this example we do not care which level and facility were used to send the
    message, so we set the level to a high value, and we clear the facility mask.


    ```

    UPDATE Filters SET level = 15, facility = 0 LIMIT 1;

    ```'
