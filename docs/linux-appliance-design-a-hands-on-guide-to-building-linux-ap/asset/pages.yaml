    # Sending Commands and Characters to the Laddie Front Panel


    You can read status and configuration information from the HD44780 if you want,
    but many designs, including ours, connect to the ground, making the part write
    only. This saves a pin (since it is not controlling the R/W line), and it is as
    easy to maintain any necessary state information—cursor location, for example—in
    the controlling software.


    The HD44780 has ten pins that tie to the microprocessor: eight data lines, a pin
    to specify each command or character data (RS), and a strobe pin to tell the HD44780
    that new data is available (E). The eight output lines on the parallel port connect
    directly to the eight data pins on the HD44780. If your hardware has fewer pins,
    you can configure the part to use a four-bit bus instead of an eight-bit bus.
    Of course, the number of steps needed to write a byte to part.


    Since both commands and characters are bits in length, we need another way to
    differentiate commands and data. Consider, for example, the byte 0x20. This is
    a space or a configuration command? Since both commands and characters are bits,
    the HD44780 uses another pin, the RS pin, to distinguish between the two. You
    can set the RS pin to zero for commands and to one for character data. One of
    the issues to decide in designing the device driver is to control this pin.


    Data is transferred to the HD44780 on the high-to-low transition of the E pin.
    The data must be valid for at least half a microsecond before the E line goes
    low. The actual setup time is a function of the brand of HD44780 and its oscillator
    frequency. In our device driver we use usleep() to delay microseconds before setting
    E low.


    Relative to the schematic given above, the sequence for writing to the HD44780
    is:


    +   * Output the command or character to the data register.

    * Set the RS line high or low.

    * Set the E line high.

    * Wait two microseconds.

    * Wait at least five milliseconds before writing the next byte.


