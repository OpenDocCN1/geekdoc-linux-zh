    be to the ones here.


    # Download and Install


    Net-SNMP is not included with your Linux distribution, you can download it from
    http://net-snmp.sourceforge.net. You can install either from RPM (assuming you
    are running an RPM-based distribution like Fedora) or source, but for now let''s
    install the binary RPM. By the way, if rpm complains about missing dependencies,
    you may have to take care of them first and then retry the command.


    ```

    $ rpm -Uvh net-snmp-5.2.1.fc4.1686.rpm

    Preparing... ################################# [100%]

    1:net-snmp ################################# [100%]

