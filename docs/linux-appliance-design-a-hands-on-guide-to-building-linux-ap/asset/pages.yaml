    # Be Quick!


    The rule of thumb is that the front panel UI should be functional within two seconds
    of turning on the appliance. This section discusses common techniques that can
    help you meet this goal.


    # Boot Linux Factor


    There is quite a bit that can be done to improve the boot time for Linux. One
    technique avoids a boot entirely by doing a suspend and resume. A suspend copies
    the memory and state of the computer to a file or disk partition. A resume loads
    the previously saved memory. To set up a suspend and resume on your system, build
    your kernel with software suspend enabled, and get your appliance into the state
    that your users use to see after power on. Issue the suspend command (may be hibernate,
    swsus, or a write into /proc, depending on your system) to save the system to
    the swap partition. Properly handled, the suspend image on your appliance can
    actually be configurable scripts that can run on suspend and resume, and you can
    modify these scripts to restart network connections and to reset the clock. See
    http://www.suspend2.net for more details. Be sure to read the HOWTO on Keep image
    mode.


    Software suspend does not improve the load for the kernel itself, but there are
    several techniques that do. For example, you can build your kernel with module
    support and and only the minimum number of device drivers you need. This reduces
    the time needed to load modules and remove the need for an initial RAM disk (initrd).
    You might be able to avoid the kernel entirely if you execute it directly from
    ROM or flash memory. This technique is called execute in place (XIP). Using the
    kernel option quiet to disable print messages during boot can save several hundred
    milliseconds. And many other techniques are explained on the Consumer Electronics
    Linux Forum at http://www.celinforum.org.


    After the kernel starts, the first program to run is usually /sbin/init, which
    executes the script /etc/rc.d/rc.sinit. The rc.sinit file sets up vital services
    and starts the other init scripts. On a console appliance you'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'probably replace the entire set of init scripts with one or two custom scripts.
    This can be a lot of work, but the time savings can be tremendous. A good way
    to start is to boot your system with the kernel option init=/bin/sh and manually
    bring up your appliance one command at a time. Try to get the button and LED UIS
    running as quickly as possible, deferring the non-front panel programs until the
    end of the initialization. Start programs in the background if you can, but be
    careful not to background a program if it completes another program you need start.
    The Init package by Jimmy Wendlunn is a popular init script alternative that is
    optimized for a faster boot.


    If the above techniques are not sufficient to get your front panel working quickly,
    you may want to add a microcontroller to your design.


    # Use a Microcontroller


    You can use a microcontroller to handle the buttons, LEDs, and LCD in your UI.
    Microcontrollers are single-chip computers with on-board RAM, ROM, CPU, and I/O.
    Common microcontrollers include the Microchip PIC and the Atmos AVR¹. These controllers
    are a great way to display messages on an LCD immediately after boot and make
    the buttons and keypad responsive immediately. After power-on, the user will usually
    open the dvd player as an example. To open the drawer, insert a disc, close the
    drawer, and press Play. If the drawer mechanism is tied directly to your Linux
    system, the user must wait for Linux to boot before starting the above. If, on
    the other hand, you have a microcontroller handling the drawer mechanism and Open
    button, you can immediately display Ready on the LCD and make the button usable.
    By the time the user has opened the drawer, loaded the disc, and pressed Play,
    the Linux part of the DVD player will probably be booting. Of course, once Linux
    is running, it will want to control the drawer mechanism directly by controlling
    the microcontroller as one of its peripherals.


    # Use the Main CPU as a Microcontroller


    Adding a microcontroller increases the cost, power requirement, and printed circuit
    board size of an appliance. An alternative is to carve out a piece of the main
    CPU to use as a microcontroller while Linux is starting. You can modify the bootloader
    to use a timer interrupt and use the interrupt handler to handle a front panel
    UL. You will need to modify Linux so that it does not touch the timer or interrupt
    handler while booting. Once Linux is running, it can take over the timer and interrupt,
    making the front panel hardware another device that it manages. This technique
    describes a form of virtual machine (VM); as they become more popular, you may
    find that a VM provides all the hooks necessary to be used as an I/O controller.


    # Don''t Shut Down


    A common technique to make an appliance more responsive is to never shut it down.
    Instead, you can build your appliance to enter a low power state


