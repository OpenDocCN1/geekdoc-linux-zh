    for an agent extension. Later in this chapter, we''ll show you how to flesh this
    skeleton into a complete implementation of your MIB.


    Net-SNMP provides multiple output code for mib2c; we will be using the UCD-SNMP
    code style. The newer, so-called “MIB for Dummies” style is not what this chapter
    describes. We have chosen to use the older style because it''s sufficient for
    our needs (and it''s also where our experience lies).


    Before we run mib2c, you''ll need to install the SNMP Perl module, which is provided
    in the Net-SNMP tarball. When you run make earlier, decompressed this tarball
    and created the directory net-snmp-5.2.1 (or whatever version you used). Drop
    down into this directory and then run perl/SNMP.'
