    User Input


    ![](img/a28f80056348678270f2ea0cfefd7891_209_0.png)


    Figure 11-9: A typical, full-featured widget


    User input events (e.g., mouse movements or keypress) update the widget and control
    the underlying application by initiating callbacks. The application can control
    the widget or exchange data with by calling the widget''s functions.


    In addition to providing widgets, a GUI toolkit provides a framework for managing
    them. The framework is typically built on top of a window manager. It routes events,
    determines which widget has focus, and ensures that overlapping widgets are displayed
    appropriately.


    The most popular GUI toolkits for Linux are GTK+(http://www.gtk.org) and Qt (http://www.trolltech.com);
    if you choose one of these, your decision will probably come down to cost and
    licensing. GTK+ is released under the more liberal LGPL license, allowing you
    to link your proprietary software to GTK+. Libraries may be licensed under the
    GPL, but this requires that your application also be released under the GPL. To
    build a proprietary application on top of Qt, you will need to pay Trolltech for
    the commercial license.


    If your application be licensed under GPL or if money is not an object, there
    are other differences to consider. GTK is written in C, though it has many object-oriented
    features. Qt is written in C++. Both have a broader user base: GTK is the basis
    for the Gnome desktop, and Qt is the basis for the KDE desktop.


    In case you are not using X on your appliance, Qt also has support for the Linux
    framebuffer. Some work has been done on a framebuffer back end for GTK+ DirectFB,
    which is also released under the LGPL. See http://www.directfb.org/wiki/index.php/Projects/GTK_on_DirectFB
    for more information.


    The Light Toolkit (FLTK; http://www.fltk.org) is a promising choice for a free
    GUI toolkit if you would like a smaller footprint than GTK+ but are still willing
    to adopt X. FLTK is designed for tight, statically linked applications, and its
    modified LGPL license allows static linking in proprietary applications. It is
    written in C++ and supports Windows in addition to Linux.'
