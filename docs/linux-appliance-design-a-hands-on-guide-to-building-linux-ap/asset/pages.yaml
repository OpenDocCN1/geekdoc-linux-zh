    # Designing a Front Panel UI


    This section gives some tips on how to build a front panel UI. We''ll discuss
    various approaches to building a menu system for LCD displays, and we''ll offer
    some ideas on how to make your front panel responsive as soon as possible after
    your user powers on the appliance.


    # Be Simple


    The primary goal of an appliance is to do one thing well. To call your product
    an appliance is to promise that you will not overwhelm users with'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'functions and options that they do not need. Your goal is to keep the appliance
    simple enough that a new or non-technical user can install the appliance in a
    few minutes without reading the manual. You can accomplish this by having reasonable
    defaults and by designing the UIs so they are easy to navigate. You can still
    give technical and sophisticated users access to all configuration options, but
    you should hide this complexity from novice users by putting it in an "Advanced
    Options" sub-menu.


    The simplest UI should be the buttons, LEDs, and LCDs on the front panel. When
    you design your front panel, consider assigning one button to one function or
    status. A one-button interface is especially useful for the most common functions.


    # Try, Fail, Try Again


    Don''t expect to get your front panel on the first try. It is very difficult to
    accurately anticipate what menu flow and button labeling will be the most intuitive
    for users. Don''t be afraid to wear out the good of your friends and neighbors
    by giving them a mock-up of your appliance and asking them to navigate the menu
    system. You may need to build and try several panels before choosing the right
    one for your appliance.


    We''ve found several tricks that help in this area. The first is to build a prototype
    using interchangeable paper faceplates. Install the paper faceplate, and ask new
    users to perform specific tasks. How quickly and easily the new users can navigate
    the menu system is the major criteria we used to select the best menu layout for
    Laddie. Figure 10-2 shows the paper faceplates we used for prototyping the Laddie
    front panel.


    ![](img/a28f80056348678270f2ea0cfefd7891_176_0.png)


    Figure 10-2: A front panel with paper faceplates


    Another technique is to recognize that a menu system is a state machine and can
    be stored as a table. Instead of hard coding the states and transitions in a program,
    build a table that contains the state, event, next state, and processing to perform.
    Then store the state transition table in a separate file and load it when the
    LCD UI program initializes.'
