  md: 'We strongly recommend using grsecurity and configuring your system so that
    code is never executed from the stack. This feature uses the hard-ware in the
    memory management unit and will not affect your program''s performance.


    # Limit Damage in Case of a Breach


    Almost every major Linux application has, at one time or another, been found to
    be vulnerable. Since the same may happen to your daemon at some point, you will
    want to limit the amount of risk a compromised daemon might present to the appliance.


    # Prevent Library and Path Attacks


    If an attacker gains access to your appliance, he might be able to run your daemon
    after first set LD_LIBRARY_PATH or PATH to point to compromised libraries and
    commands. If your program is User ID (SUID) root, your attacker has gained complete
    root control over your appliance. Don''t despair. There are a few things you can
    limit disaster in the event that your daemon is compromised.


    First, do not run your application with SUID of root. This is easier on an appliance
    than on a multi-user system where programs like passed and the X server must be
    SUID root. It is better to drop root privileges or to run as a non-privileged
    user. (You''ll learn more details about this in the next section.)


    The second defense is to do a static build of your daemon -static as an option
    to your gcc invocation. A statically linked executable might not increase the
    size of your executable as you''d imagine, and if you are using chroot jails,
    it might actually save disk space. Statically linked executables usually load
    faster, too.


    Another way to prevent a library or path attack is to ignore the environment variables
    that tell your program to look for shared object libraries and system commands.
    If you are really security conscious, use the glibc clearenv() function to undefine
    environment variables. You will need to give the full path to any commands you
    run with system(), but this is probably a good idea anyway.


    # Avoid Root Privileges


    Attackers want root privileges so they can take control of your appliance. If
    you run your daemon as root, you make your daemon a target for their attacks.
    Avoid root privileges if at all possible. Create a new user (with the login shell
    set to /bin/nologin) and useuid() and setgid() to change to that user. This technique
    is used by most web- and database servers.


    Another approach is to modify your rc initialization scripts to launch your daemon
    with sudo to change to the appropriate user. For example, your rc script might
    start your webui as user wuser with the command:


    ```

    sudo -l wuser webui

    ```'
