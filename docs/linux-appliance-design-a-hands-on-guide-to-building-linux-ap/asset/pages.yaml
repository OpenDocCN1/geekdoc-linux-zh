    10 and 40 characters per line. The most common for these displays is the ubiquitous
    HD44780, originally from Hitachi, now available from several vendors. Displays
    based on the HD44780 usually have parallel input, but many have a daughter card
    that offers serial or USB input, keyboard scanning, and LED outputs. Some displays
    with a daughter card give you the ability to program flash memory to when the
    unit is powered up. Programmable power-up is particularly important for an appliance
    since responsiveness is critical to a successful UI. Displays with a daughter
    card and flash memory also have a programmable character, which is useful if you
    want to display a logo or other simple graphic. We''ll have more to say about
    the HD44780 in this chapter when we review Laddie''s front panel hardware.


    There are several web pages and packages that support alphanumeric LCDs under
