- img_proc: true
  md: 'appropriate universe. Unfortunately, this solution does not work for the user
    disables JavaScript and then reloads a particular page. The work-around is for
    the user to turn on JavaScript and then revisit the home page.


    We took another approach, which allows the user to enable or disable JavaScript
    and then reload the particular page. This means each web page must support a JavaScript
    version and a non-JavaScript version. In the past, this problem might have been
    tricky to solve because browsers... But this problem is easily solved today, the
    majority of browsers (even those like Lynx that don''t support JavaScript) understand
    the HTML `<script>` tag. When a modern browser has JavaScript disabled, it ignores
    all HTML code between the tags `<script>` and `</script>`.


    # Hiding JavaScript


    The following pattern for hiding JavaScript from browsers is known to work for
    Internet Explorer (version 5.0 and later), Netscape Navigator (version 4.72 and
    later), Firefox (version 1.0 and later), Safari (version 1.0 and later), Opera
    (version 5.0 and later), and Lynx (version 2.8.2 and later).


    ```

    <SCRIPT TYPE="text/javascript">

    <!-- hide from old browsers


    // javascript code goes here


    <!-- end of script hiding -->

    </script>

    ```


    The HTML comments <!-- -- --> are included as a fail-safe mechanism for old browsers
    that don''t understand the `<SCRIPT>` tags. Similarly, you can use `<NOSCRIPT>`
    and `</NOSCRIPT>` tags to provide alternate content when JavaScript is not enabled.


    Using these patterns, each web page can support both JavaScript and non-JavaScript
    versions, and consequently, the user can change the browser''s JavaScript setting
    and reload the page. Because the user doesn''t have to find and reload some site-wide
    redirection page, the user''s experience is greatly simplified.


