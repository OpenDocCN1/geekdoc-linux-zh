    # Graceful Degradation Without JavaScript


    When designing a web-based appliance, you must decide which browsers you will
    support. Do you support non-graphical browsers like Lynx, or do you only fully
    featured browsers? By reducing the level of required functionality, you can support
    a wide variety of browsers, but it will be the expense of an increased effort
    in development. At the other extreme, you could dictate that a specific browser
    be used, with the advantage of using proprietary features, but with the risk of
    some customers disliking your browser selection. Customer input would be invaluable
    in helping you to make this decision.


    We chose to support a wide variety of browsers, sought to reduce the developmental
    effort by avoiding browser-specific code. that is, we avoided code that didn''t
    work the same way on all major browsers.


    Of particular concern was the ability to support browsers without JavaScript.
    One of the difficulties with JavaScript is that it can be disabled by the user,
    and ever worse, the user may not know that it is disabled.


    One approach for supporting browsers with and without JavaScript is to structure
    the website as two “universes”—one universe where JavaScript is used and another
    in which it isn''t. The home page is written to detect whether JavaScript is enabled
    on the browser and to redirect the browser to the'
  merge: -1
