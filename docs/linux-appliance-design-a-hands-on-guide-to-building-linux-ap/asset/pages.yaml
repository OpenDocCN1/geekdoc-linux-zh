  md: '# # 1

    APPLIANCE ARCHITECTURE


    ![](img/a28f80056348678270f2ea0cfefd7891_24_0.png)


    We''ll begin our adventure with a high-level look at the architecture of a Linux
    appliance. We''ll then drop a little lower in altitude and look at a Linux appliance
    from the perspective of processes. As you''ll see, the view from this lower altitude
    matches the organization and chapters used throughout this book.

    In this chapter, we will cover the following:


    +   * UIs and daemons

    * The architecture of the Laddie appliance


    We have worked on Linux appliances that range from small, handheld devices to
    large, multi-gigabyte, multi-processor network servers. Most of these appliances
    have a strikingly similar software architecture.

    Figure 1-1 shows the stack we typically see in a Linux appliance. At the bottom
    of this stack is an embedded Linux kernel. Above the kernel are the various user
    interfaces and common services such as network management and logging, and at
    the top is the particular function that defines the appliance.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Where appliances are concerned, the term user interface (UI) refers to an interface
    through which the user manages the appliance configuration and views its status
    and statistics. The lack of a screen and keyboard is halfmarks of an appliance,
    but do not let you fool—all appliances have. To be sure, the more visible the
    UI the better the appliance, but the UI is always nonetheless. appliances often
    have web, SNMP, and command line interfaces, while consumer appliances have framebuffers
    and small, alphanumeric interfaces.


    # A Linux Appliance


    | Your Code | Defining Application |

    |---|---|

    | Code from This Book | User Interfaces and Common Services |

    | Embedded Linux | Linux |


    Figure 1-1: Linux appliance software stack


    # Uls and Daemons


    Assuming our Linux appliance will have multiple, simultaneous UIs, when we look
    at the appliance from the point of view of running processes we get an architecture
    something like that shown in Figure 1-2. The UI programs interact with the users
    to accept commands and configuration to display status and statistics. Daemons,
    on the other hand, interact with the hardware, other daemons, and the UIs to provide
    the appliance’s defining service as well as status and statistics.


    ![](img/a28f80056348678270f2ea0cfefd7891_25_0.png)


    Figure 1-2: A common appliance architecture


    # Daemons


    Daemons are background programs that are most started just after booting Linux.
    Daemons distinguish themselves in that they don’t have a controlling terminal
    like programs started from the bash command line. Let’s look at the kinds of daemons
    found on a typical appliance.'
  merge: -1
