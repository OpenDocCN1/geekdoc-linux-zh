    We''ll break the topic of daemon security into three sections:


    +   - Designing a secure daemon

    - Writing a secure daemon

    - Limiting damage in case of a breach


    # Designing a Secure Daemon


    Securing your daemon starts when you begin thinking about its specification, architecture,
    and design. You have the greatest ability to make your application secure when
    you lay out your daemon''s foundation.


    By secure, we mean that the daemon should respond to errors and malicious attacks
    in a predictable way. This implies that we first detect errors (and attacks) and
    then handle them appropriately. One way to think about this is to always have
    a plan for each possible error condition and attack.


    # Always Have an Escape Plan


    Many buildings post escape plans next to elevators and stairwells. The escape
    plan is a map showing the best route to take in case of an emergency. As you design
    your daemon, think about how you will recover or escape from each error condition.
    Laying the foundation for a good escape plan early makes it burdensome for you
    to add the code after your daemon has been developed.


    An exit may mean a core dump and program termination, or may aborting a single
    request, closing a network connection, or performing some other error recovery.
    Program termination may be appropriate if you detect an error during startup or
    a configuration change, or for any reason you think your security has been breached.
    For example, if your daemon is a network server handling client requests, it may
    be appropriate to close a network connection if the daemon receives a badly formed
    request.


    In practice, having an error escape plan means that all of your routines return
    an error code. No matter how deeply your subroutine calls, you should be able
    to pass an error indicator up the chain of subroutine routines. An event-driven
    or state-machine-driven program can use a flag or separate state to indicate an
    error.


    Your escape should always begin with a log message describing the location of
    the error and the inputs that generated it. You can have two log messages, one
    to detect the error, and another, at a higher level, to report what detail you''ve
    decided to handle the error.


    # Be Restrictive


    When designing a daemon from scratch, you can specify its operation in detail.
    Your specification and the resulting code should allow only the'
