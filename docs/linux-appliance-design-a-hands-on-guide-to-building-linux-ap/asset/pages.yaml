  md: 'For example, a program that prints a one-line message to the console can modify
    the position of the visible display relative to the virtual display; the result
    is that a displayed graphic is misplaced by the width of that line. Or, if the
    graphics hardware is configured to use a palette, and if a program modifies the
    colors used to display text in the console, printed messages may become hard to
    read or even invisible.


    For these reasons, it''s best to use a separate virtual terminal for graphical
    displays. We accomplish this in the hazy_moon program with the following lines.


    ```

    #include <fcntl.h>

    #include <linux/vt.h>


    console_fd = open("/dev/tty", O_RDWR);

    ioctl(console_fd, VT_ACTIVATE, 7);

    ioctl(console_fd, VT_WAITACTIVE, 7);

    ```


    Note that we''re using the familiar open and ioctl system calls, though in this
    case, it''s not with the framebuffer. The first call (console_fd = open("/dev/tty",
    O_RDWR)) opens the console device; the second (ioctl(console_fd, VT_ACTIVATE,
    7)) requests a switch to virtual terminal 7; and the third (ioctl(console_fd,
    VT_WAITACTIVE, 7)) waits until the switch is complete. (We chose terminal 7 because
    our system uses terminals 1 through 6 for consoles.)


    # open


    Now we use the open system call on the framebuffer device, specifying the device
    file as read/write.


    ```

    fb_fd = open("/dev/fbo", O_RDWR);

    ```


    The function returns -1 on error; otherwise, it returns an integer descriptor
    that we will use in making subsequent system calls for this device.


    > NOTE The open system call returns an error value that should be handled. We
    won''t discuss error handling here, but you can see how we handled errors by looking
    at the full source of the hazy_moon.c file.


    # ioctl


    Using the framebuffer''s file descriptor, we can make the ioctl calls to retrieve
    the fixed and variable configuration data for a framebuffer.


    ```

    #include <linux/fb.h>


    struct fb_fix_screeninfo fixed_info;

    struct fb_var_screeninfo var_info;


    ioctl(fb_fd, FBIOGET_FSCREENINFO, &fixed_info);

    ioctl(fb_fd, FBIOGET_VSCREENINFO, &var_info);

    ```'
