- img_proc: true
  md: 'RTA uses the native compiler data types in order to match the data types you
    use in your structures. The length member is ignored for integers, longs, floats,
    and their associated pointer types, but it has meaning for strings and pointers
    to both, which should report the number of bytes in the string (including the
    terminating null).


    # offset


    The offset is the number of bytes from the start of the data structure to the
    member being described. For example, a table using a data structure with an int,
    20-character string, and a long would have the offset to the long to 24 (assuming
    it was a 4-byte int).


    Computing the offset of a structure member is painstaking and error prone. The
    gcc compiler suite provides the offset() macro to automatically compute the offset
    of the structure member.


    # flags


    A column has two binary attributes that are specified by the flags member. The
    first attribute specifies whether the column can be overwritten or if it is read-only.
    Statistics are often marked as read-only. An error is generated if a column marked
    as read-only is the subject in an UPDATE statement. The #define for this attribute
    is RTA_READONLY.


    The second attribute specifies whether or not values to this column should be
    saved in a configuration file associated with the table. Values that should persist
    from one invocation of the program to the next should be marked with the #define
    RTA_DISKSAVE attribute.


    The flags field is the bitwise OR of RTA_DISKSAVE and RTA_READONLY.


    # readcb()


    If defined, the readcb callback routine, readcb(), is called every time the column''s
    value is used. This is handy for values that takes of CPU cycles to compute but
    are used frequently. A read callback is invoked every time the column is referenced—if
    your SQL statement uses the column name twice, the read callback is called twice.


    The read callback is passed five parameters: the table name, the column name,
    the text of the SQL request, a pointer to the row affected, and the zero-indexed
    row. A function prototype for the callback is shown below.


    ```

    int readcb(char *tbl, char *col, char *sql, void *pr, int rowid);

    ```


    A read callback returns zero on success and an error code if an error occurred
    in the callback. (See Appendix A for a list of error and more details on callbacks.)
    Check the return value in your clients in order to enhance reliability and security.'
