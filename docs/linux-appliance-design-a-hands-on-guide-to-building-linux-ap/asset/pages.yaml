    # RTA Subroutines


    There are only six subroutines in the RTA API. Table A-1 summarizes them.


    Table A-1: Subroutines for the RTA PostgreSQL API


    | Subroutine | Description |

    |--- | --- |

    | dbcommand() | Provides an interface to PostgreSQL clients |

    | rta_add_table() | Adds a table and columns to the RTA database |

    | SQL_string() | Executes an SQL statement in the RTA database |

    | rta_config_dir() | Sets the default path to the savesfile directory |

    | rta_save() | Saves a table to a file |

    | rta_load() | Loads data from a file |


    The subroutines in the RTA libraries usually return one of the following values.


    ```

    /* successfully executed request or command */

    #define RTA_SUCCESS (0)

    ```


    ```

    /* input did not have a full command */

    #define RTA_NOCMD (1)

    ```


    ```

    /* encountered an internal error */

    #define RTA_ERROR (2)

    ```


    ```

    /* DB client requests a session close */

    #define RTA_CLOSE (3)

    ```


    ```

    /* Insufficient output buffer space */

    #define RTA_NOBUF (4)

    ```'
