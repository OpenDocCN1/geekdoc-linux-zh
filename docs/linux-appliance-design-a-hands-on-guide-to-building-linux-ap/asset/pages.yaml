    # Server Blocks Waiting for Alarm State Change


    On the server side, the script wait_for_status.php is invoked. This script does
    a blocking read on port 4444 at event ⑧. Whenever there is a change in alarm state
    at event ⑨, the logmux daemon writes a message to port 4444 at event ⑿. The contents
    of what is written to the PHP thread are unimportant; what is important is that
    the message unblocks the PHP thread at ⑧.


    Notice in the code above that curr_id is sent with the URL. This variable prevents
    the browser from losing events when the events come too quickly. This variable
    is passed like a token between the server and the browser, and increases in lock-step
    with the number of log events. If the curr_id value from the browser does not
    match the number of log events on the server, the PHP thread skips blocking on
    port 4444. This way, if there are new events during the time interval that the
    PHP thread is not blocking on port 4444, the PHP thread will continue.


    # Server Sends Alarm State as XML


    Once the reading begins, the PHP script reads the alarm status from the ladder
    daemon (at event ⑤), and combines the data into an XML document. The web then
    passes this XML document to the browser (at event ⑿). An example XML document
