  md: '![](img/a28f80056348678270f2ea0cfefd7891_231_0.png)


    Figure 12-12: The LIRC architecture


    In kernel space, a device driver accesses the receiver hardware through an external
    port. For instance, this driver is provided by the LIRC package and uses interrupts
    to perform waveform timing on the input waveform.


    NOTE As you saw in the section “Decoding Remote Control Waveforms” on page 203,
    there are some IR receivers that perform the waveform timing and possibly even
    the waveform interpretation in external hardware. For these receivers, the kernel
    driver may be a generic Linux serial server driver or a USB driver.


    In user space, for systems as ours that do not perform interpretation in external
    hardware, we use the lirc daemon. This daemon accesses a configuration file that
    characterizes the remote control command protocol and analyzes the timing information
    provided by the device driver to generate the corresponding commands. In some
    cases, the user application will access the output of the lirc daemon directly.
    The Laddie appliance takes this approach. For applications that were not built
    with the lirc daemon in mind, LIRC tools are available to process the output of
    the lirc daemon and provide program input, execute appropriate commands, and simulate
    mouse or keyboard events. We will discuss these tools in the section “LIRC Tools
    for Controlling Applications” on page 218.


    In the remainder of this chapter, we will describe the elements of the LIRC architecture
    and show how we configured LIRC for the Laddie appliance.


    # Installing the LIRC Software


    The LIRC package is included in this book’s companion CD, and we recommend you
    use the CD when working through the examples in this chapter. However, if you
    need to set up your system in the future, we will describe the steps we took to
    install the package.'
