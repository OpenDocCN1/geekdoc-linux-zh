  md: '# Summary


    This has been a whirlwind tour of SNMP. We''ve covered the basic parts of SNMP:
    the protocol, the grammar, and the first group of managed objects. You should
    now understand the acronyms SMI, MIB, and OID, and the terms object and trap.
    You should also be familiar with the term MIB-2 and have an idea of what it contains.
    We have discussed the various data types, both scalars and tables. At this point,
    you should be able to take an unfamiliar MIB and read through it, understanding
    its basic structure and what it is trying to describe. We have also touched on
    a couple of the command-line utilities you may find useful to probe an SNMP-enabled
    device: `snmpwalk` and `snmpget`.


    With a little cut and paste and some judicious modifications, you may be able
    to develop a simple MIB.'
