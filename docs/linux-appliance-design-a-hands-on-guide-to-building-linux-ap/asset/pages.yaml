  md: '# # DESIGNING A FRAMEBUFFER INTERFACE


    If you decide to add a graphical user interface (GUI) to your appliance, you will
    be faced with the following challenge.

    On one hand, your appliance’s graphics hardware is controlled by low-level commands
    that manipulate video memory. On the other hand, your users don’t want to manipulate
    video memory; they want to manipulate high-level objects like menus and buttons.
    In order to build the kind of interface your users want, you will use a set of
    software layers known collectively as the *graphics stack*.

    The graphics stack, as used for the Laddie appliance, is illustrated in Figure
    11-1. The Linux framebuffer device driver provides a low-level but uniform interface
    to the graphics hardware''s video memory. The graphics library provides support
    for manipulating points, lines, images, and text. The GUI toolkit provides widgets
    and manages user input for the graphics GUI.

    Here, we will present the graphics stack layers we used to design the Laddie framebuffer
    UI. But first, we will provide a brief review of how video memory works, since
    this will make the remainder of the chapter easier to understand.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '![](img/a28f80056348678270f2ea0cfefd7891_193_0.png)


    Figure 11-1: The graphics stack


    In this chapter, we will cover the following topics:


    +   - How video memory works

    - The Linux framebuffer device driver

    - Graphics libraries

    - “Hello, world!” with Simple DirectMedia Layer

    - Graphics UI toolkits

    - The Laddie framebuffer UI


    # How Video Memory Works


    From a programming point of view, the most important part of the graphics hardware
    is the video memory. Software creates graphical images by manipulating this video
    memory, and hardware interprets this memory to render images on the display. Before
    we can effectively display text or graphics, we need to understand how bytes in
    video memory are interpreted, and in what order they are mapped onto the display.


    # How Bytes in Video Memory are Interpreted


    To understand the different ways in which hardware can interpret video memory,
    it''s useful to remember that memory has historically been an expensive resource.
    Many of the earliest computers didn''t display arbitrary characters; instead,
    they interpreted each byte of video memory as a single character (a character
    might be drawn as a 7-by-9 pixel image, which would be quite efficient—a single
    byte would represent 63 characters each, and 2KB could support a display of 32
    lines with 64 characters each. However, only text could be rendered, and only
    256 different characters could be displayed at a time.


    Incidentally, we can think of character graphics as a form of image compression.
    The number of repeating pixel patterns that occur in a displayable text “image”
    are fewer than 256, so we can use a single byte'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'to encode each one. All pixel patterns occur with frequency zero, and therefore,
    are not encoded at all.


    | Video Memory | | Character Generator | Video Encoder | |

    |---|---|---|---||

    | 0x48 | | 7 x 9 pixels | | 63 mono-chrome pixels |


    Figure 11-2: Character graphics


    With additional memory, graphics cards can dedicate one to every pixel. This creates
    monochrome graphics, which are illustrated in Figure 11-3. Although this approach
    requires roughly an eight-fold increase in memory over using character graphics,
    it removes all limitations on the character set. It supports all types, styles,
    and sizes, and even Kanji can be displayed easily as Roman characters.


    | Video Memory | | Video Encoder | |

    |---|---|---||

    | 1001 1110 | | | 8 black-and-white pixels |


    Figure 11-3: Monochrome graphics


    If we dedicate an entire byte to each pixel, we have a few options. For single-color
    displays, the graphics hardware could be designed to produce 256 intensity (*grayscale*)
    levels. This would be appropriate for rendering text with *anti-aliasing*, in
    shades of gray are used to soften jagged edges.


    Alternatively, we could use each pixel''s bits to signify one of 256 different
    colors. The hardware maintains a 256-entry table of colors, known as a *palette*
    or *colormap*. Each color in the palette is typically represented by three bytes,
    for the red, green, and blue intensity levels. This approach is illustrated in
    Figure 11-4. In this example, the first pixel in the displayed image is represented
    by the value 0xF3F, which includes a 3-byte entry with red, green, and blue intensity
    levels that correspond to a light blue pixel, with a touch of green.


    As in the character graphics case, we can think of pseudocolor as a form of compression,
    driven by the need to conserve memory. To display an image in pseudocolor, we
    choose the 256 most important colors and represent each with one byte, neglecting
    all others.


    Using even more memory, we can dedicate two or three bytes to pixel and directly
    represent the red, green, and blue intensity levels, without the use of a look-up
    table. With two bytes (*highcolor*), we might, for example,'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'use 5 bits for reg, 6 for green, and 5 for blue. This supports 65 thousand
    colors in an image, but it is still limited. For example, it supports 2^5 = 32
    different shades of gray.


    # Palette


    ![](img/a28f80056348678270f2ea0cfefd7891_195_0.png)


    Figure 11-4: Pseudocolor graphics


    The three-byte case, with one byte for red, green, and blue, is illustrated in
    Figure 11-5. This is referred to as truecolor, since it is capable of representing
    images with near-photographic quality.


    ![](img/a28f80056348678270f2ea0cfefd7891_195_1.png)


    Figure 11-5: Truecolor graphics


    # How Video Memory Is Mapped to the Display


    If the video memory provided by a graphics card is the same size (in pixels) as
    the display, the mapping between video memory pixels and display pixels is straightforward:
    the first pixel of video memory corresponds to the pixel at the top left of the
    display, and the following pixels are mapped from left to right and top to bottom,
    the same way we read a page in English. To state this mathematically:


    > address of pixel at (x, y) = address of video memory + (y*x + x)*pix_width


    where x (the x resolution) is the number of pixels in a row, and pix_width is
    the number of bytes in a pixel.


    But memory is no longer the critical resource it once, and it is now common for
    graphics hardware to provide more video memory than necessary to fill the display.
    In one approach to using this extra memory, we can think'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'of the available video memory corresponding to a virtual display. The visible
    display is too small to show us all the virtual pixels at once, but we can pan
    the visible display left and right and up and down in order to expose any portion
    of the virtual display we are interested in. This situation is illustrated in
    Figure 11-6. If we want to find the memory address of a pixel at position (x,
    y) in the visible display, we have to consider where the pixel resides in the
    virtual display. If the visible display is panned xoffset to the right and yoffset
    down, the virtual position of our pixel is (x+xoffset, y+yoffset). If line_length
    is the length of a virtual row, then, applying the formula, we have a memory address
    of:


    ```

    address of video memory + ((y+yoffset)*line_length+x+xoffset)*pix_width

    ```


    ![](img/a28f80056348678270f2ea0cfefd7891_196_0.png)


    Figure 11-6: Virtual and visible displays


    If we have an object that we want to render on the visible display, we can use
    this formula to determine which bytes to manipulate video memory. In the remainder
    of the chapter, we will look at the layers that allow us to effectively manipulate
    video memory in software.


    # The Linux Framebuffer Device Driver


    Linux provides access to video memory (the framebuffer) the same way it provides
    access to other devices—via a device file. The framebuffer device file is /dev/fb0,
    and as with other files, we can access the data in the file using system calls
    open, read, write, and close. You can learn more about these system calls from
    their man pages (e.g., execute man 2). Most system calls that access files do
    using a small integer called a file descriptor. The system call open is an exception;
    it returns a file descriptor using a path to a file.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Manipulating the Framebuffer with open, read, write, and close


    Because of this device file interface, it is easy to exercise the framebuffer
    with some simple Unix commands. At this point, we recommend you boot the Laddie
    CD and try these commands yourself. You could also try these examples on your
    own system. See Appendix C if you need help setting up your framebuffer.)


    Once you reboot the Laddie CD, wait for the framebuffer UI to load, then press
    ESC to get a login prompt. Log in as root with an empty password. Execute the
    following commands:


    ```

    laddie:~# cat /dev/fbo > /tmp/screen

    laddie:~# clear

    laddie:~# cat /tmp/screen > /dev/fbo

    ```


    The cat command, as used in the first line, invokes open, read, and close system
    calls to make a copy of the framebuffer in a separate file. The second line clears
    the console display. In the third line, the redirection invokes the open, write,
    and close system calls to replace the contents of the console display with what
    was originally there. The result may be confusing, since the cursor position will
    no longer match the display (you can clean up the display with another clear command).
    However, this experiment illustrates that, to the cat command, the framebuffer
    is just another file.


    If your graphics adapter has a large amount of video memory, the first cat command
    may take a while (and produce a large file in /tmp). If the first command (cat
    /dev/fbo > /tmp/screen) returns immediately with


    cat:/dev/fbo: No such file or directory


    you need to use mknod to create the /dev/fbo device file. Do so by running:


    ```

    laddie:~# mknod /dev/fbo c 29 0

    ```


    If the command /dev/fbo > /tmp/screen produces the error


    cat: /dev/fbo: No such device


    the framebuffer device driver has not been loaded successfully. Again, see Appendix
    C if you need help setting up the framebuffer device.


    NOTE For the remainder of this chapter, we will assume that you have a working
    framebuffer.


    To experiment with the relationship between pixel data and what is displayed on
    the screen, try any of the following commands:


    ```

    laddie:~# yes | cat > /dev/fbo

    laddie:~# while [ 1 ]; do echo 01234567; | cat > /dev/fbo

    laddie:~# cat /dev/urandom > /dev/fbo

    ```'
  merge: -1
  pgno: 197
- img_proc: true
  md: "On successful completion of each command (which may take a while for large\
    \ framebuffers) you should see the error:\n\ncat: write error: No space left on\
    \ device\n\nYou see this error because you are attempting to cat an infinite supply\
    \ of bits into a finite supply of memory. After each experiment, type the command\
    \ to restore the console.\n\n# Configuring the Framebuffer with the ioctl Command\n\
    \nIn experiments so far, we have manipulated video memory without any regard to\
    \ the pixel data is interpreted. The way that graphics hardware interprets video\
    \ memory data, which also includes the physical address of video memory, the screen\
    \ resolution (virtual and visible), the placement of the visible screen relative\
    \ to the virtual one, as well as timing and other information that is outside\
    \ the scope of this chapter. To access the video mode, we need an additional system\
    \ call, ioctl, which allows us to access or modify parameters for devices.\n\n\
    The ioctl system call takes a file descriptor for a device and an integer representing\
    \ a request (see the ioctl man page for details). In the case of the framebuffer,\
    \ the possible ioctl commands are listed in the /usr/include/linux/fb.h header\
    \ file and include the following:\n\n```\n#define FBOGET_VSREENINFO 0x4600\n#define\
    \ FBIOUT_VSREENINFO 0x4601\n#define FBOGET_FSREENINFO 0x4602\n```\n\nThe two ioctl\
    \ requests allow us to retrieve or update variable framebuffer parameters, and\
    \ the third allows to retrieve fixed framebuffer parameters. The variable parameters\
    \ are summarized in the following data structure (with fields omitted), taken\
    \ from fb.h:\n\n```\nstruct fb_var_screeninfo {\n\tu32 xres;\t/* visible resolution\
    \ */\n\tu32 yres;\n\tu32 x_virtual;\t/* virtual resolution */\n\tu32 y_virtual;\n\
    \tu32 xoffset;\t/* offset from virtual to visible */\n\tu32 yoffset;\t/* resolution\
    \ */\n\n\tu32 bits_per_pixel;\t/* guess what **/\n\tu32 grayscale;\t/* !== 0 Graylevels\
    \ instead of colors **/\n\n\tstruct fb_bitfield red;\t/* bitfield in fb mem if\
    \ true color, */\n\tstruct fb_bitfield green;\t/* else only length is significant\
    \ */\n\tstruct fb_bitfield blue;\n\n};\n```"
  merge: -1
  pgno: 198
- img_proc: true
  md: "For the most part, it should be clear from the identifiers how the fields in\
    \ this data structure correspond to the notions we discussed in the section \"\
    How Video Memory Works\" on page 170. The fb_bitfield structs characterize the\
    \ way pixel bits are interpreted when they are used to specify color intensities\
    \ (in truecolor mode).\n\nFor the Laddie appliance, we had no need to modify the\
    \ variable framebuffer data. In fact, the VESA driver that we used does not easily\
    \ support modification after system startup. If you are using a non-VESA framebuffer\
    \ and you need to modify its configuration at run time, consider the documentation\
    \ for the fbset utility.\n\nThe fixed framebuffer configuration parameters are\
    \ provided by the following data structure (with some omitted), also in fb.h:\n\
    \n```\nstruct fb_fix_screeninfo {\n    char id[16];               /* identification\
    \ string \"TT Builtin\" */\n    unsigned long smem_start; /* Start of frame buffer\
    \ mem */\n                                 /* (physical address) */\n    u32 smem_len;\
    \             /* Length of frame buffer mem */\n    u32 type;                \
    \ /* see FB_TYPE * */\n    u32 visual;               /* see FB_VISUAL * */\n \
    \   u32 line_length;          /* length of a line in bytes */\n    ...\n};\n```\n\
    \nThe main fields we will use are visual, which specifies which pixels are interpreted\
    \ (e.g., monochromatic, pseudocolor, or truecolor), and line_length, which we\
    \ need when computing the mapping to video memory and display.\n\nFinally, ioctl\
    \ requests us to retrieve or update the palette (colormap) for video modes that\
    \ use one.\n\n```\n#define FBIGETMAP 0x4604\n#define FBIOPUTMAP 0x4605\n```\n\n\
    We will show an example of how to update colormaps in the next section.\n\nAt\
    \ this point, we can determine how the pixel data is interpreted, so we could\
    \ use the write system call, just as the cat utility does, but making system calls\
    \ with every update is too expensive. A better approach is provided by a different\
    \ system: mmap. The mmap system call takes the file descriptor for our framebuffer,\
    \ maps the framebuffer into the virtual address space of our process, and returns\
    \ a pointer to the beginning of memory. With this mapping in place, updating the\
    \ framebuffer becomes as simple as writing to memory.\n\nIn summary, to efficiently\
    \ manipulate the framebuffer, we open the appropriate device file, use ioctl commands\
    \ to establish the graphics configuration, use mmap to provide simple access to\
    \ pixel data, and write the appropriate pixel data for our application."
