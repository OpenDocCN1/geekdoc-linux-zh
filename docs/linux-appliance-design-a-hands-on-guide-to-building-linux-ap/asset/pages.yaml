  md: 'Figure 8-7 shows an example of how the Ajax communication mechanism works.
    The exchange in this figure is initiated when the user moves over an active element
    on the web page at event ①. An mouseover action is triggered and JavaScript code
    is executed in the web browser at event ②. The JavaScript creates an XMLHttpRequest
    with the URL of the server-side script and a JavaScript callback function, and
    the web browser sends the XMLHttpRequest request to the server at event ③. On
    the server side, the particular script identified by the URL returns with XML
    data at ④.


    ![](img/a28f80056348678270f2ea0cfefd7891_141_0.png)


    Figure 8-7: Typical Ajax sequence.


    NOTE The format of the XML is known by the client and the server, so that when
    the server sends the XML data, the client understands its format. Typically, the
    XML data will contain the updated information to be displayed on some portion
    of the web page in the browser.


    Back on the client side, the web browser receives the XML data and invokes the
    JavaScript callback function. This callback function extracts the data from the
    XML message and modifies some of the web page using the XML Document Object Model
    (DOM) API at event ⑤.


    Mouse movements are not the only events that are supported by Ajax, but they are
    the most popular, along with mouse button clicks, key presses, text selections,
    and keyboard focus on editable fields—and more events are available with each
    browser upgrade.


    # # Implementation


    In this section, we will discuss the implementation of Laddie''s web UI. We will
    show some screenshots of the web UI and how it works.


    The web UI supports at least the following web browsers: Internet Explorer (version
    5.0 and later), Netscape Navigator (version 4.72 and later), Firefox (version
    1.0 and later), Safari (version 1.0 and later), Opera (version 5.0 and later),
    and Lynx (version 2.8.2 and later). These versions were determined through direct
    testing with archived browsers available from https://browsers.evolt.org.


    NOTE Unlike the other graphical browsers, the Lynx browser is text-based.'
