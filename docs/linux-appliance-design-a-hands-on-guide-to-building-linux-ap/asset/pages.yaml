- img_proc: true
  md: 'After the first command, you will need to wait a few moments for the Laddie
    application to stop. In the second command, the pidof function puts the process
    ID of the lirc process. The $(...) construct provides this output as a parameter
    to the kill command, which terminates the specified process. We can now access
    the /dev/lirc device file for our purposes.


    As we saw in the previous chapter, we can use the cat command to access output
    provided by device files. We don''t want to simply cat the output of /dev/lirc
    to the console, because some of the output might be interpreted as control characters
    and the console could end up in an unusable state. One thing we can do is pipe
    output through the hexdump utility, which translates binary data into printable
    ASCII hexadecimal characters.


    Enter the following command:


    ```

    laddie:\# cat /dev/lirc | hexdump

    ```


    Now, any pulses that arise on the DCD pin of serial port COM1 will be measured
    by the lirc_serial device driver, driven by the cat command which /dev/lirc device
    file, and displayed in ASCII hex by hexdump. To generate such pulses, connect
    your IR receiver to the COM1 port, point your remote control at the IR detector/demodulator,
    and press a button.(At this point, the particular kind of remote doesn''t matter.)
    If everything is working properly, you should see the output like:


    ```

    000000 df67 0091 011b 0000 04f6 0100

    000010 0216 0000 04d4 01f0 0000 026e 0100

    000020 02d3 0000 028a 01f0 0000 04f7 0100

    000030 01f0 0000 02a1 01f0 0000 02a0 0100

    000040 01f0 0000 04fc 01f0 0000 02a0 0100

    000050 01f0 0000 0283 0118 0000 0289 0100

    ```


    This is the output we generated by briefly tapping the Volume–button on the universal
    remote that we programmed for Sony TV.


    If you''re not sure your IR receiver hardware is working (or if you don''t have
    an IR receiver at this point), you can test the lirc_serial device driver by creating
    random pulses on the DCD pin of the serial port. One way to do this is to connect
    pin 1 (DCD) to pin 7 (RTS) of the serial port. If this doesn''t produce a result,
    try intermittently connecting pin 1 to pin 3 (TXD). If your computer''s port is
    built to standard specifications, it won''t be a problem if you connect the wrong
    pins by mistake. Still, if you''ve just purchased a fancy, new laptop, you might
    want to try this experiment on a friend''s Linux box.


    Using the cat /dev/lirc command is a good exercise because it demonstrates that
    the output of /dev/lirc is simply binary data that can be read like a file. Neither
    cat nor hexdump know anything about infrared, they display the data just fine.
    But the output of hexdump isn''t easy to read.'
