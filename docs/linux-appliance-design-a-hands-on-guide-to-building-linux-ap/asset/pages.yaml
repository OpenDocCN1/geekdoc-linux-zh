    * poll_timeout() - The background routine to read the status\n* lines and set\
    \ to (or clear) alarms if needed.\n*\n* Input: None\n* Return: None\n********************************************************************\n\
    void poll_timeout(void handle, void cbd) {\n  int value; /* input value from parallel\
    \ port */\n  int i; /* a loop variable */\n  int new; /* new state of pin */\n\
    \n  /* Read the pins from the parallel port */\n  value = inb(PORT+1);\n\n  for\
    \ (i = 0; i < NUM_INPUTS; i++) {\n    new = (value & (1 << i)) ? 1 : 0;\n    if\
    \ ((new != Zone[i].input) && Zone[i].enabled) {\n      /* We have a change of\
    \ state of an enabled input pin */\n      if ((new == 1 && Zone[i].edge == 1 &&\
    \ Zone[i].alarm != 1) ||\n          (new == 0 && Zone[i].edge == 0 && Zone[i].alarm\
    \ != 1)) {\n        Zone[i].alarm = 1;\n        Zone.count++;\n        syslog(LOG_ALERT,\
    \ \"Alarm set on zone %d, %s\", Zone[i].id, Zone[i].name);\n      }\n      /*\
    \ Look for a cleared alarm */\n      if ((Zone[i].alarm == 1) && (Zone[i].latching\
    \ == 0) &&\n          (new == 0 && Zone[i].edge == 1) ||\n          (new == 1\
    \ && Zone[i].edge == 0))) {\n        /* We can remove an alarm * /\n        Zone[i].alarm\
    \ = 0;\n        syslog(LOG_ALERT, \"Alarm cleared on zone %d, %s\", Zone[i].id,\
    \ Zone[i].name);\n      }\n    }\n    Zone[i].input = new;\n  }\n```\n\n+   *\
