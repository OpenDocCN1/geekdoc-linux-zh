    below, but that would require formatting instructions that are beyond what you
    need. The default format for output from snmptrapd looks like this:


    ```

    2007-02-14 20:43:26 localhost.localdomain [127.0.0.1]:nsUpTimeInstance = Timeticks:
    (469425) 13:02:21:25

    smpTrapOID.0 = OID: coldStartShutdown

    ```


    Keep in mind that you are using SNMPv2. The format for sending SNMPv1 is different
    and a bit more complicated. A cold trap typically triggers the network management
    software restarted with no change in configuration. Typically, this happens when
    the system running the agent has rebooted, by many users use coldStart as a reboot
    indicator; however, it will be sent any time the agent restarts. If you configure
    a trap target in the snmpd.conf file and restart the agent, your snmptrap will
    receive a trap from it. Give it a try—add the following line to your snmpd.conf:


    ```

    trap2sink localhost public

    ```


    Now call it and restart it, or send it another SIGHUP; snmptrapd will indicate
    that it has received a coldStart trap. Now that the agent has the trap configured,
