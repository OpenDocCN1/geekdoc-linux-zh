    \nIn each of the cases, we query some field in the Zone table to get the value\
    \ in our switch statement. If the query fails, we break out of the switch and\
    \ return NULL, which tells the agent this value is not retrievable.\nAnother thing\
    \ to notice is here that we have to return a write_method for each of the objects\
    \ we have defined as having read-write access. Each writable object has its own\
    \ write method—that is, a pointer to the routine called to handle SETs. Whenever\
    \ a write (snmspset) is done, the main agent code first calls the read routine\
    \ to find the appropriate write routine.\n\n# Writing the Alarm Table\n\nEach\
    \ of the write routines for writable objects looks basically the same, so we'll\
    \ just take the AlarmEnable object as an example.\nThe write routines center around\
    \ a switch statement selecting different processing based on the action parameter.\
    \ The cases in the switch will always be as follows:\n\n+   - RESERVE1\n- RESERVE2\n\
    - FREE\n- ACTION\n- UNDO\n- COMMIT\n\nWriting is much more complex than reading.\
    \ When the agent receives an SNMP command for one of your objects, the read code\
    \ we discussed above will be called to return the write_method (a pointer to the\
    \ write routine for the specific object). This write function will then be called\
    \ repeatedly with a different action parameter each time. If everything goes without\
    \ a hit, the write method will be called for RESERVE1, RESERVE2, ACTION, and COMMIT,\
    \ in succession. The second RESERVE is to allow for dependencies between objects\
    \ when a write is received for more than one object. If there is a failure returned\
    \ from RESERVE, you will be called with FREE to allow any allocated resources\
    \ to be released. UNDO is provided for cases that fail further into the process.\n\
    \n280 Chapter 15"
