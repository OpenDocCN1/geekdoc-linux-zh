    of LIMIT and OFFSET.


    ```

    ERROR: String too long for ''%s''

    ```


    This reply indicates that an UPDATE to a column of type string or pointer to string
    would have exceeded the width of the column. The %s is replaced by the column
    name.


    ```

    ERROR: Can not UPDATE read-only column ''%s''

    ```


    This reply indicates an attempt to UPDATE a column marked as read-only. The %s
    is replaced by the column name.


    # Internal Debug Messages


    The RTA logs internal errors using the standard syslog() facility, which is available
    on all Linux systems. The default syslog facility is LOG_USER, but you can change
    the default by setting facility in the rta_dbg table. You can modify syslog in
    order to do post-processing, as generating SNMP traps from these debug messages.
    The RTA program sends all internal debug messages to syslog() in this format:


    ```

    rta[PID]: FILE LINE#: error_message

    ```


    The RTA program will replace PID, FILE, and LINE# with the process ID, the source
    filename, and the line number where the error was detected. Here are the definitions
    to generate debug and error messages. The RTA program will replace %d at the start
    of each error string with the line number where the error was detected.


    # System Errors


    ```

    #define Er_No_Mem "%s d: Cannot allocate memory"

    #define Er_No_Save "%s d: Table ''%s'' save failure. Cannot open %s"

    #define Er_No_Load "%s d: Table ''%s'' load failure. Cannot open %s"

    ```'
