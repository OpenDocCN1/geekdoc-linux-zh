    ```


    # SQL Errors


    ```

    #define Er_Bad_SQL "%s %d: SQL parse error: %s"

    #define Er_Readonly "%s %d: Attempt to UPDATE readonly column: %s"

    ```


    # Trace Messages


    ```

    #define Er_Trace_SQL "%s %d: SQL command: %s (%s)"

    ```


    # Callback Routines


    As mentioned above, read callbacks are executed before a column value is used,
    and write callbacks are called after all columns have been UPDATED. Both read
    and write callbacks return zero on success and nonzero on error.


    # Read Callbacks


    Read callbacks have the following calling parameters:


    | Readback | Description |

    |---|---|

    | char *tblename | The name of the table referenced |

    | char *colname | The name of the column referenced |

    | char *sqlcmd | The text of the SQL command |

    | void *pr; | A pointer to the affected row in the table |

    | int rowid; | The zero-indexed row number of the row read or written |


    Read callbacks are particularly useful for computing values like sums and averages.
    These values are not worth the effort to compute continuously if it''s possible
    to compute them when the values are required.'
