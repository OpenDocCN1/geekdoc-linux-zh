  md: '![](img/a28f80056348678270f2ea0cfefd7891_111_0.png)


    Figure 6-3: Independent control of logging (IM) and program section


    The idea is to have a separate logging threshold for each section of code, and
    to send a log message only if the message''s level is numerically below the log
    threshold for that section. Our implementation of Logit has 12 rows, the first
    five of which are used internally by the Laddie prototype daemon. You can easily
    change LOGIT_ROWNS in logit.c to add more rows if you wish.


    Let''s work through an example. Say you want to add on-demand logging control
    to two different sections of code, image processing (IM) and buffer management
    (BM). During its initialization your program must create entries in the Log table.
    You can do this directly, or use the wrapper function logitSetEntry(). The code
    below shows both methods.


    ```

    #include "empd.h" /* defines for the prototype daemon *

    #define IM 5

    #define BM 6


    /* Initialize on-demand logging for the image-processing section */

    strncpy(Logit[IM].sect, "img proc", LOGIT_NAME_LEN-1);

    Logit[IM].thres = LOG_DEBUG;

    Logit[IM].output = 2; /* output to syslog() */

    strncpy(Logit[IM].comment, "im, image process", LOGIT_COMMENT_LEN-1);


    /* Initialize on-demand logging for buffer management */

    logitSetEntry(BM, "buf_mgmt", "BM", LOG_DEBUG, "buffer management");

    ```


    With the above initialization in place, you can now add log messages by raising
    or lowering the threshold in the Log table.

    The LOG() macro defined in the Laddie daemon header file, empd.h, will send a
    message to syslog() or send a standard error if the threshold set in the LOG call
    is numerically lower than the threshold in Logit for that section of code. For
    example, to selectively trace the operation of the image-processing and buffer-management
    code, you might have a few lines like the following.'
