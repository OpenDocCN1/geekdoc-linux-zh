    # lad216


    The code to generate the proper escape sequences is in lad216 program. The program
    uses standard and in out, so if you build the hardware described above and install
    our /dev/lad_pad driver, you could tie the lad216 program to the hardware with
    the command:


    ```

    lad216 <dev/lad_pad> </dev/lad_pad

    ```


    The code is in three files: main.c which has the select loop, menu.c which has
    the state machine, and lad216.which encodes the output for display on the lad_pad
    hardware. Using standard input and output makes it easy to connect lad216 to the
    various front panel emulators described below.


    # Front Panel Emulators


    A front panel emulator is a great way to test a front panel design without building
    it. Front panel emulators that ship with the finished product are particularly
    nice for end users who do not want to be burdened with learning different UIs.


    We went a little overboard building front panel emulators for Laddie, building
    one that uses C and curses, one that uses Tcl/Tk and the X Window system, and
    one that uses JavaScript and HTML. You can choose which emulator to examine on
    your preferred programming language.


    The curses replaces lad216 with cur216.c, which still uses the main.c and menu.c
    files. You can try the curses front panel emulator by booting the Laddie CD and
    telnetting into the appliance. The cur216 executable is in the default path.


    The Tcl/Tk version, x216.tcl, is based on the lad216 executable, using Tcl/Tk
    to replace the lad_pad hardware with the Laddie CD does not include the X Window
    system so you cannot run x216.tcl on a booted appliance.


    You can try the web-based front panel emulator by booting Laddie and pointing
    your browser to http://192.168.1.11/front_panel. The index file should show a
    window with a photograph of our actual front panel hardware, The buttons are tied
    to an image map and operate the same way as the buttons on the real system. The
    LED is either a static image of the LED in the off state, or an animated GIF image
    of flashing the LED. The HTML of the LCD uses CSS to specify a fairly large monospaced
    font.


    The techniques used in the web emulator are simple, and you may find use of if
    you ever build a emulator of your own front panel. To illustrate these techniques,
    let''s look at how the LED image is controlled. In the HTML we specify the exact
    location of the image and give it a name, led.


    > You may need to set the terminal type, since telnet does not set it for you.
    I use xterm on the desktop, so when I telnet to the Laddie appliance, set the
    terminal type with the command export TERM=xterm.'
