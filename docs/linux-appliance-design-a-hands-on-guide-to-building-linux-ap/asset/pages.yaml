  md: 'Recall that the facility is part of the priority integer passed from syslog()
    to syslogd, and that you can define your facilities. This builds a private logging
    system on top of syslog. You could add the new facility integer and name to syslog.h,
    then rebuild glibc and syslog. However, it is probably easier to use an explicit
    integer for the new facility. There are 24 predefined facilities, so choose a
    number much larger, 1,000. The code that sends an INFO log with this facility
    might look like the following:


    ```

    syslog((1000<<3) | LOG_INFO, "an event occurred");

    ```


    We''ve shown the shift and OR to illustrate what is happening. We suggest that
    you use the equivalent LOG_PRIO(facility, level) macro.

    to continue with this example, you have a program listening for your new log messages
    on the named pipe /usr/local/private_pipe. You could configure syslog to deliver
    all logs with the new facility by adding the following line to syslog.conf and
    restarting syslog.


    | 1000.* | /usr/local/private_pipe |


    Desktop developers might cringe at the thought of using syslog for event processing.
    But then again, Linux desktop systems typically have more RAM and CPU resources
    than an appliance, they afford the (relatively) high disk, memory, and CPU overhead
    of D-Bus. We recommend syslog for its simplicity, availability in almost all programming
    languages, and its small memory and CPU overhead.


    # Limitations, Advantages, and Alternatives to syslog


    There are a few limitations with the default syslog daemon. As mentioned previously,
    it does not save the message level or facility (although you can get them directly
    by routing based on). Syslog is not route based on regular expressions, it only
    accepts messages from Unix sockets, and it has a somewhat limited set of actions.
    Some programmers find the limited numbers of levels a problem when setting up
    debug and trace mechanisms. On the plus side, syslog is universally accepted and
    is thoroughly debugged, tested, and secure.


    The logger utility (which we saw briefly in the beginning of this chapter) lets
    you work around the limited set of message sources for syslog. Logger sends messages
    to syslog, getting the log messages from either its command line or from each
    line of its standard input. If you wish, you can specify level, facility, and
    a prefix string. See the logger page for more details. You can also combine netcat
    (a simple utility to read and write from network connections) and a logger to
    accept log messages from a single accepted TCP connection using a command similar
    to the one shown below.


    ```

    nc -1 -p 2250 | logger

    ```'
