  md: "# 13\n\n# # HANDS-ON INTRODUCTION\n SNMP\n\n![](img/a28f80056348678270f2ea0cfefd7891_246_0.png)\n\
    \nWe like to say that the difference between a hobby and a commercial network\
    \ appliance is SNMP. Any corporation with a large network will use Simple Network\
    \ Management Protocol (SNMP) as part of its network- and system-management solution.\
    \ You simply cannot sell into the large enterprise and telecommunications carrier\
    \ markets without SNMP support on your appliance.\n\nIf your target market includes\
    \ companies with large networks and you are not confident in your knowledge of\
    \ SNMP, this chapter is for you. If, however, you will be targeting the home or\
    \ small business market (or your appliance will not be networked at all), you\
    \ can safely skip this and the SNMP chapters follow.\n\nThis chapter will introduce\
    \ SNMP and provide you with an appreciation of some of the things SNMP can do.\
    \ The topics covered in this chapter are:\n\n+   * A brief introduction to SNMP\
    \ terminology\n\n+   * Finding the software"
  merge: -1
  pgno: 246
