    so we use the rewriting capability of logmuxd to rewrite the message to fit the
    LCD display. The original message is rewritten from this:


    ```

    Aug 12 22:28:31 Ladd[3820]: User set alarm on zone 5, Refrigerator

    ```


    to this:


    ```

    22:28 Usr set 5

    ```


    All of the configuration data to recognize and rewrite a log message is contained
    in the Filters table. This table contains the type and name of the destination,
    the regular expression to match, and an *sprintf()* format string for the rewritten
    message. Let''s look at each of these fields in turn.


