    # A Little SQL


    Structured Query Language is a standard way to manipulate data in

    database. RTA uses only two SQL commands: SELECT, to get data from a

    table, and UPDATE, to write data to a table. The RTA syntax for SELECT

    and UPDATE is a limited subset of the standard SQL syntax, with one minor

    extension.'
