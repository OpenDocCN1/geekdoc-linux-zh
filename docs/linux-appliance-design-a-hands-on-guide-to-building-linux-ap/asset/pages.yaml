    # Summary


    Infrared light is a useful means for controlling an appliance when the appliance
    is in the line of sight. To be effective, infrared light must be modulated by
    the transmitter with a signature frequency, and this modulation devices must be
    removed by the receiver. Fortunately, there are commercial devices that make it
    easy to meet these requirements. For IR receivers, we introduced infrared detector/demodulators
    and showed how to use them in simple IR receiver circuits. For IR transmitters,
    we recommended using universal remotes.


    We also described the Linux Infrared Remote Control (LIRC) package as a useful
    tool for controlling appliances. This package provide device drivers and daemons
    for measuring and interpreting infrared waveforms, as well as utilities for controlling
    appliances. Although we didn''t discuss the entire LIRC package, we did describe
    elements of the package that we used for the Ladd appliance. We hope this overview
    of infrared communications and this example application of the LIRC software package
    will be a useful starting point if you decide to use infrared remote control for
    your own appliance.'
