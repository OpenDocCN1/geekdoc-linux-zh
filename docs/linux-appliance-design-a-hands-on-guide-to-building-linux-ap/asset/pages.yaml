    # # A Quick Note on Terminology


    Here is a quick tour of the most basic concepts and terms you will need in order
    to understand the material in this chapter. For a complete introduction to SNMP
    concepts and terminology, see Appendix B.


    SNMP is a protocol designed to facilitate the reading and writing of small amounts
    of information over a network, like single numbers and character strings. You
    would not use SNMP for large volumes of data, like file transfer.


    A read operation in SNMP is called a GET, while a write is called a SET. The target
    of a SET or GET operation is called an object. An object is like a field in a
    database record.


    SNMP treats objects as if they were organized into a single large database called
    the Management Information Base (MIB). It may be helpful to think of SNMP as an
    API to a device. It hides the details of object retrieval behind an own namespace.
    SNMP agent on each system provides this API. The agent is a background (daemon)
    process listening for SNMP, requests on UDP port 161. Beside the API, the agent
    may interact with the kernel or some process running on the system; it may also
    read several pieces of information from different sources and apply a mathematical
    formula to furnish the value defined in a MIB. An object in the MIB may also represent
    rather than data; for example, setting a MIB object to a particular value might
    trigger a restart or the restarting of a service.


    The MIB hierarchical namespace is much like the Unix filesystem, but it uses numbers
    instead of directory and filenames, and it uses the character instead of the /
    directory separator. So, whereas a file path may look like this:


    ```

    /usr/sbin/ifconfig

    ```


    the name (called an Object Identifier, or OID) for an object in the MIB might
    look like this:


    ```

    .1.3.6.1.2.1.1.1

    ```


    MIB files describe the complete MIB database. Typically, each MIB file describes
    a MIB module, which is a subtree of the overall database. MIB files are both human
    readable and program readable. They document the MIB for humans, and they provide
    a means for programs to translate these string numbers and their human-readable
    names. Although we have talked about the MIB as the SNMP-addressable universe,
    the more common use of the term MIB is for one of these named subtrees.'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'For example, you will hear talk of the Host Resources MIB, or the HP Printer

    MIB, or MIB-2. These are all subtrees, but they are all addressable within

    the overall namespace.


    First and foremost MIBs is the critically named MIB-II. When

    SNMP was first created, the SNMP working group of the IETF defined a

    core of information. This was the first MIB, or MIB-I. A few years later,

    The SNMP revised this core set and we use MIB-2,

    than MIB-II, in this chapter to match the name used in the MIB file

    that defines this MIB.


    Once you have the right MIB files installed (will you see how to do this

    later), you can use the snmpranslate command to give the human-

    readable names for your ID (on this later, too). For example:


    ```

    $snmpranslate -of .1.3.6.1.2.1.1.1

    .iso.org.internet.mgmt.mib-2.system.sysDescr

    $

    ```


    This be enough terminology to get started.


    # The Software


    The Net-SNMP is an excellent free package containing all you''ll need to follow

    along this chapter. Net-SNMP will provide you with commands (snmpget,

    snmpset, snmpwalk, snmtrap), an SNMP agent, and the standard MIB files.

    Normally, the commands and agent would be running on different systems,

    but for simplicity you''ll be running on the same system. If you have

    two systems available, you can perform the full installation on both;

    y can run snmpget, for example, on one system, and talk to the agent

    the other. If you use two systems, remember to change all instances of

    localhost or 127.0.0.1 in this chapter''s code to the name or address of the

    system running the SNMP agent.


    # Installing SNMP


    Before installing, check to see if Net-SNMP is already installed on your

    system—many common Linux distributions provide some version of it.

    If you have a very Linux distribution (like Red Hat 7.x) you may find

    UCD-SNMP instead; this is an older version—or parent—of Net-SNMP.

    Although its behavior is very similar to that of Net-SNMP, there are enough

    differences to confuse trying to follow this tutorial; you should

    remove it, and follow the instructions here to install Net-SNMP. If you find

    some other package installed, definitely remove it before continuing.


    > ¹ The Internet Engineering Task Force (IETF), started in 1986, is the principle
    standards

    organization for the Internet. Participation is voluntary and open to anyone.
    Most of its work is

    performed in working groups (WGs), which are ad hoc groups composed of parties
    interested in

    specific topic.


    Hands-on Introduction to SNMP 225'
