- img_proc: true
  md: 'make the resulting code compatible with all of the major web browsers. If you
    decide to build a web interface directly into your daemon, do yourself a favor
    and use an HTTP library like libhttpd from Hugues Technologies. Because other
    coders, experts in HTTP, keep it up to date regarding the quirks of various browsers,
    your maintenance will be much easier.


    This project also highlights the second problem. Once the web interface was working,
    the customer requested we an SNMP interface. The fastest way to do this was to
    add SNMP directly to the daemon as we did with the web interface. This addition
    put us well on the path to what we call "all-in-one" approach, which is described
    in the next section.


    # An-In-All-One Approach


    If you know that your users need to interact with your daemon while it is running,
    and if your running daemon needs more than one type of interface, you might be
    tempted to add the necessary interfaces directly to the daemon. Figure 2-3 shows
    a daemon that is not only trying to perform its real task but is also trying to
    support multiple, simultaneous user interfaces.


    All-In-One Approach


    | Port 80 | Web Interface | API |

    | UDP Port 1.41 | SNMP Interface | API | Daemon |

    | TCP Port 23 | CLI Interface | API |


    Figure 2-3: Adding all the user interfaces directly to the daemon


    We used a bundling approach like this in our early designs, but we found that
    it created a lot of problems. Because only a few developers could work on the
    appliance at a time, development became serial, so developers had to code both
    the main daemon and all of the user interfaces. The tight coupling between UI
    and daemon made it more difficult to isolate changes to one section of code. We
    were afraid that even simple interface changes might have side effects, so we
    made every change for the full regression testing of a major release. The whole
    development and release cycle became slower.


    Another problem with the all-in-one approach is performance. If all the user interfaces
    run directly from the daemon, the daemon may spend all of its CPU cycles in some
    unimportant interface request while ignoring the real work it needs to do.'
  merge: -1
