    # LCDs


    Small liquid crystal displays (LCDs) are standard interfaces for consumer appliances.
    Your use of an LCD will depend on the nature of your appliance and your customer''s
    expectations, but there are several reasons to include an LCD in your design:


    +   Primary UI A text-based LCD display can be the primary UI for your appliance.
    This is often the case for audio equipment, such as satellite receivers and network-attached
    audio players.


    +   Reliability Network equipment equipment often needs fail-safe access to configuration
    and status information. While using a serial port and a CLI is common, high-end
    network appliances often provide a keypad and LCD on the front panel for configuration.


    +   Perceived value There is nothing like an LCD (or even a vacuum fluorescent
    display) to distinguish one beige box from its competitors and to convince customers
    that they''re buying a high-end piece of equipment.


    There are two common architectures used to interface an LCD to an appliance. The
    first is to have the Linux drive the LCD directly. This architecture is appropriate
    for low-cost, low-power, and high-volume appliances that require a graphic display.
    Common uses of this architecture include PDAs and cell phones. Several members
    of the ARM processor family have on-chip support for LCD displays. Examples include
    the EP9307 from Cirrus Logic and the AT91SAM926 from Atmel. Chapter 11 describes
    how to build a UI for memory-mapped graphics displays.'
