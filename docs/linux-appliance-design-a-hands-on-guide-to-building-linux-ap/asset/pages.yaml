  md: '# Security


    Linux appliance developers use packages such as grsecurity and systrace to tighten
    security to levels undreamed of by Windows developers. Appliances have the additional
    advantage that a multipurpose desktop or server can never be as secure as a well-hardened,
    single-purpose device.


    # Linux Appliance Design


    We''ve tried to write this book and the accompanying CD to be used as a type of
