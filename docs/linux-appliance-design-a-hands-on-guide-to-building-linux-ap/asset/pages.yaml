    $ /usr/sbin/snmpd --version

    NET-SNMP version: 5.2.1

    Web: http://www.net-snmp.org/

    Email: net-snmp-coders@lists.sourceforge.net

    ```


    Now check the tools. Use which to find out where they were installed, then list
    all the commands in that directory with snmp.


    ```

    $ which snmpwalk

    /usr/bin/snmpwalk

    ```


    ```

    $ ls /usr/bin/snmp*

    /usr/bin/snmpbulketwalk /usr/bin/snmppdf /usr/bin/snmpstatus

    /usr/bin/snmpus /usr/bin/snmpbulkw /usr/bin/snmpget

    /usr/bin/snmtable /usr/bin/snmpvacm /usr/bin/snmpcheck

    /usr/bin/snmpgetnext /usr/bin/snmptest /usr/bin/snmpwalk

    /usr/bin/snmpconf /usr/bin/snmpnetstat /usr/bin/snmptranslate

    /usr/bin/snmpdelta /usr/bin/snmpset /usr/bin/snmptrap

    ```


    We''ll only use a handful of these commands, but feel free to explore others once
    you''ve mastered the basics.'
