  md: 'All we need to do now is build and install.


    ```

    make

    make install

    ```


    You''ll also need to copy the files you need from /opt/snmp into your appliance
    build, but that''s beyond the scope of this chapter.


    # # Debugging


    Thanks to the DEBUGSGL macros, we have dropped in a MIB extension as we wrote
    it, and we are all set to trace the flow of control in our agent, should this
    become necessary. Just shut down the agent running in the background


    ```

    /etc/rc.init/snmpd stop


    and run your copy from the command line:


    /opt/snmp/bin/snmpd -D "LAD" -le -f -c /opt/snmp/etc/snmp/snmpd.conf -C

    ```


    The -c path to config file -C is from the normal command string to run the agent.
    We discussed this in Chapter 14. What''s new are the first three options.

    The -D "LAD" activates the DEBUGSGL statements, which specified "LAD". Here''s
    one taken from the code we discussed above:


    ```

    DEBUGSGL(("LAD", "reading ladAlarmState\"));

    ```


    The -le tells the agent to send the output to sidder. Other options are stdout,
    syslog, or a file. See the page for snmp for more information.

    The -f tells the agent not to fork and go into the background. This keeps tied
    to our current terminal window so we can see the output.

    Now query the agent using snmpget, snmset, or snmpwalk from another terminal window
    and watch the output, or capture it to a file.


    # # Traps


    We have defined two traps in a MIB, but we will not be discussing how to send
    these traps in this chapter. In Chapter 14 we discussed the use of the snmrap
    utility to send traps for us, and in Chapter 7 we explained how to use a log event
    to trigger an SNMP trap. Keep that the traps we have defined in our LAD-MIB are
    not generated by the SNMP agent. They are generated through the logging subsystem
    from events recorded by the ladd daemon, itself.'
