  md: '# Companion CD includes a prototype appliance—a home system—that supports the
    book’s lessons.


    # A REAL-WORLD GUIDE TO BUILDING LINUX APPLIANCES


    Modern appliances are complex machines with processors, operating systems, and
    application software. While there are books that will tell you how to run Linux
    on embedded hardware, and books on how to build a Linux application, Linux Appliance
    Design is the first book to demonstrate how to merge the two and create a Linux
    appliance. You''ll see for yourself why Linux is the embedded operating system
    of choice for low-cost development and a fast time to market.


    Learn to:


    +   * Separate your user interfaces from your daemons

    * Give user interfaces run time access to configuration, status, and statistics

    * Add professional network management capabilities to your application

    * Use SNMP and build a MIB

    * Build a web-based appliance interface

    * Build a command line interface (CLI)

    * Build a framebuffer interface with an infrared control input

    * Manage logs and alarms on an appliance


    Linux Appliance Design shows how to build appliances—with more types of interfaces,
    more dynamic interfaces, and better debugged interfaces. You learn how to build
    backend daemons, handle asynchronous events, and connect various user interfaces
    (including web, framebuffers, infrared control, SNMP, and front panels) to these
    processes for remote configuration and control. Linux Appliance Design also introduces
    the Run-Time Access library, which provides a uniform mechanism for user interfaces
    to communicate with daemons.


    # ABOUT THE AUTHORS


    Bob Smith, John Hardin, Graham Phillips, and Bill Pierce have experience in embedded
    systems, commercial Linux and BSD appliances, network management systems, and
    designing software solutions for business problems.


