  md: '# A Simple Graphics Program for the Framebuffer


    In the remainder of this section, we''ll illustrate the Linux framebuffer interface
    by writing a simple graphics program. Our program, hazy_moon, will display a simple
    disk, 240 pixels in diameter, that fades from bright cyan to the top to a hazy
    red at the bottom. The picture we have in mind, rendered in grayscale, is shown
    in Figure 11-7. Our program will illustrate the use of a colormap and will provide
    a quick, visual indication of whether or not we have configured the framebuffer
    correctly.


    ![](img/a28f80056348678270f2ea0cfefd7891_200_0.png)


    Figure 11-7: A hazy moon


    The complete source for this program is on the Laddie CD in the directory /Code/src/examples/hazy_moon.
    Before working through the rest of this section, we recommend building and running
    the program. After booting the CD and logging in, change to the program''s directory,
    type **make**, and then type ./hazy_moon. You should see the disk in the middle
    and a thin cyan border around the visible screen. If you don''t see all of the
    border lines, try adjusting the width and height of the image on your monitor.
    To return to the original virtual terminal, use CTRL-ALT-F1. If the dimensions
    of the graphics terminal are not what you expected, try the command deallocat
    at the bash prompt to deallocate resources for the unused terminals, and then
    run the test program again.


