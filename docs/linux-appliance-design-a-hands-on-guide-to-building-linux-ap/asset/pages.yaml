- img_proc: true
  md: '# Configuring the lirc Daemon


    The cleverest part of the LIRC package is the lirc daemon. This is the part that
    analyzes the noisy timing values from the /dev/lirc device file and produces a
    sequence of commands that are easily parsed by downstream LIRC tools or user applications.


    In order for the lirc daemon to interpret the timing data from /dev/lirc, it has
    to understand the remote control protocol. The configuration file /etc/lirc.conf
    captures this protocol information. The following is the lirc.conf file used by
    the Laddie appliance with comments and a few of the entries removed to save space.


    ```

    begin remote

    name        SONY-TV

    bits        12

    flags       SPACE_ENC

    eps         30

    aeps        100

    header      2457 525

    one         1269 520

    zero        650 520

    gap         26076

    toggle_bit  0

    begin codes

    POWER       0xA90

    ENTER       0xD10

    VOL-        0xC90

    VOL+        0x490

    CH-         0xB90

    CH+         0x090

    end codes

    end remote

    ```


    You don''t need to understand the entries in this file to use LIRC, we''ll make
    a few comments here in case you want to edit the file manually. The name can be
    any string that describes the remote. The bits field is the total number of data
    bits (in our case, command-code bits plus address bits). The eps and aeps fields
    represent relative and absolute error tolerances (in our case, 30 percent and
    100 microseconds). The header, one, and zero fields represent pulse and pulse
    timings (microseconds) and data bits. There is a gap of about 26,000 microseconds
    between repeated commands, and there is no toggle bit that changes for repeated
    commands reflect actual timings measured by the device driver and can vary from
    the protocol standard. The codes are the actual data sequences for the various
    commands. For the additional fields that may apply for other remotes, you can
    see the details at the WinLIRC web page, http://winlirc.sourceforge.net/technicaldetails.html.'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'If you have a remote that uses the protocol as you, you should be able to control
    the Laddie appliance without updating the /etc/lirc.conf file. (Again, we are
    using an RCA RCU410 universal remote, programmed as a Sony TV, code 002). The
    LIRC website also provides configuration files for many remotes, but using the
    LIRC record utility, it''s easy enough to generate these files from scratch. The
    record utility creates configuration files by monitoring the output of /dev/lirc
    while prompting the user for remote control input.


    Now let''s create a configuration file for your remote. As we mentioned when we
    were testing the lirc_serial device driver, we need to kill the lirc daemon before
    we access /dev/lirc. If you didn''t kill lirc earlier, or so now:


    ```

    laddie:~# kill $(pidof lirc)

    ```


    To create a new lirc configuration file, rename or delete the old one, then run
    the irrecord command:


    ```

    laddie:~# mv /etc/lirc.conf /etc/lirc.conf.bak

    laddie:~# irrecord /etc/lirc.conf

    ```


    Read the instructions prompted by the irrecord utility carefully. The utility
    will prompt you to press remote control buttons in a particular sequence, and
    it will also ask you to assign names for the buttons you choose to program. Since
    you will be using the remote to control the Laddie framebuffer UI, you will need
    to provide the button names that the Laddie appliance expects. It doesn''t matter
    how you assign the actual buttons, but you will need to use the following names
    in uppercase letters: POWER, VOL+, VOL-, CH+, and CH-. If you restart the irrecord
    utility, be sure to rename or delete the previous /etc/lirc.conf file first. Once
    you''re satisfied with the configuration file, you are ready to test the lirc
    daemon.


    > If you choose to download a configuration file for your remote from http://www.lirc.org,
    you will need to edit it to make sure the button names are the ones the Laddie
