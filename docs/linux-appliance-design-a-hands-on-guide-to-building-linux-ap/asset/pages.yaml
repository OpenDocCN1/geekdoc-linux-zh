    ![](img/a28f80056348678270f2ea0cfefd7891_122_0.png)


    Figure 7-3: A logmuxd example using telnet


    The basic steps in the configuration are:


    +   - Configure logmuxd to accept syslog messages from /dev/log. Verify the setup.

    - Configure logmuxd to recognize and rewrite "train arriving" messages.

    - Configure logmuxd to accept TCP connections on port 3333.

    - Use logger and telnet to verify that messages are distributed to connections
    via TCP port 3333.


    We start clearing the configuration in all of the tables that we are going to
    use. Using the console or telnet, log in on the PC that is running logmuxd (the
    PC booted from the book''s CD). The RTA interface on logmuxd listens on port 8887;
    when you start the SQL session and clear the tables with these commands:


    ```

    psql -h localhost -p 8887

    UPDATE MuxIn source = "", type =0;

    UPDATE Filters destype = 0, destname = "", regex = ""

    rewrite = "", time_fat = ""

    UPDATE NetDest destname = "", dest = "", port = 0;

    ```


    # Muxln


    We want logmux to replace syslog in this example, so we need to configure it to
    listen at the Unix socket /dev/log and read log messages in the syslog style.
    We specify it as /dev/log, the type as 6 (syslog format), and the log message
    terminator as 0 (null character between messages).


    ```

    UPDATE MuxIn source = "/dev/log", type = 6, term = 0 LIMIT 1;

    ```


    If everything is working at this point, the command opened a Unix socket on /dev/log,
    and a display of the MuxIn table should show a valid file descriptor for our source.
    (A netstat command should also show the /dev/log socket).'
