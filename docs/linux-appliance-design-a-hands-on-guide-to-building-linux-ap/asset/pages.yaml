    REVIEW OF SNMP


    ![](img/a28f80056348678270f2ea0cfefd7891_332_0.png)


    This appendix is supplied for those who would like additional details or background
    information on SNMP.


    In this appendix, we will cover the following topics:


    +   * Why SNMP

    * Agents and managers

    * Namespace, grammar, and protocol

    * The MIB

    * The OID

    * MIB-2

    * The SMI

    * The SNMP protocol

