    # Set the umask


    The umask command sets the default read/write permissions for files created in
    the current shell. It is generally good practice to set the umask of your daemon
    to 0, which forces you to explicitly set the permissions of any files you create.


    Because there is no need to save the old value of the umask, we cast the return
    value to void:


    ```

    (void) umask((mode_t) 000);

    ```


