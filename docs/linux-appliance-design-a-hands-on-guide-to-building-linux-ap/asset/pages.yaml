  md: 'Two fields are used to specify the destination: *destype* and *destname*. There
    is a separate table for each type of destination. This is necessary because, for
    example, an email destination needs different configuration information than an
    SNMP trap destination. The type of the destination and its destination table are
    set by the destype field. There are nine valid destination types. The types for
    1 and 2 are not included in Table 7-3, since they are strictly sources.


    # Table 7-3: The Nine Destination Types


    | destype | Destination Table | Meaning |

    | --- | --- | --- |

    | 0 | None | No destination (useful for collecting statistics) |

    | 3 | NetDest | Accepted TCP connections |

    | 4 | NetDest | Outgoing socket connections |

    | 5 | NetDest | UDP socket destinations |

    | 7 | FileDest | File (includes both FIFOs and regular files) |

    | 8 | PdbDest | PostgresSQL (or an RTA table) |

    | 9 | SmpDest | SNMP trap destinations |

    | 10 | MailDest | Email destinations |

    | 11 | TblDest | logmbox''s internal table for output messages |


    There can be several destinations described in each of the destination tables.
    Each destination has its own unique name (*destname*) in one of the destination
    tables. For example, if you have two different SNMP destinations, you can call
    one of them *allsnmp* and the other *laddies*. By giving them different names,
    you can define different routing and rewriting rules for them. To link a filter
    in the Filters table to a specific destination, you need to specify both the destination
    type and destination name.


    Logmbox routes messages based on the message''s facility, log level, and on text
    pattern match. These three fields in the Filters table are *facility*, *level*,
    and *regex*. The facilities and log levels are the same as defined for syslog.
    The regex pattern is a regular expression used for both pattern matching and subpattern
    matching.


    The regex library is a good choice for pattern matching and extraction, since
    the patterns can be precompiled to improve the speed of the pattern match, and
    regex lets you easily extract subpatterns from the search pattern. In use of Logmbox,
    we''ve found that we don''t need to know how much about regex patterns. The following
    example illustrates what of what you need to.


    Say that you are processing the event of a train''s arrival at a station, and
    the log message is *Train from San Jose arriving on Track number 15*. To rewrite
    this message you extract both the city and the train number. The regex pattern
    to capture the city is *[A-Za-z-]+*. This pattern matches any combination of at
    least one uppercase or lowercase alphabetic character, space, or a dash. The pattern
    for the train number is *[0-9]+*. The trick is: if you put parentheses around
    a pattern, regex makes that pattern available separately in the regex output.
    The following is a regex pattern to match the message and extract the city and
    train number.'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'Train from ([A-Za-z -]+) arriving on Track number ([0-9]+)


    The Filter table''s rewrite field contains the snprintf() format string used to
    rewrite the log message. The format string contains text of your choosing and
    can contain the strings extracted from the regex pattern. The matches to the regex
    patterns are available as explicit parameters to the snprintf(). Table 7-4 lists
    the parameters available to you.


    # Table 7-4: Available Parameters to the snprintf()


    | Parameter | Meaning |

    | --- | --- |

    | %1s to %9s | Up to nine subpatterns |

    | %10s | The entire match and the full regex pattern |

    | %11s | The date and time per the time_fmt field |

    | %12s | A newline character |


    Continuing the example above, you can get the message Jose:15 with a rewrite format
    string of %1s : %2s.

    You can add a date and time to your rewrite message by including %11s in your
    rewrite string. The format of the date and time is set by the time_fmt field,
    which is passed to strftime() for the conversion. Common examples of time_format
    include %F, %T, and %R, which gives a date and time display of YYYY-MM-DD hh:mm:ss,
    and %R, which displays only the time as hh:mm.

    The explicit parameter for newline is tricky, it can be difficult to get a newline
    character into an RTA table. Remember, to PostgreSQL, \n two-character string
    with a backslash and the letter n.


    We''ll show more examples of regex pattern matching and message rewriting in the
    section "Examples Using logmuxd on page 98.


    # logmuxd Destinations


    Each type of destination has a table to hold the parameters unique to that type.
    You can easily figure out most of the tables and their content by browsing them
    with RTA table, but destination tables serve additional comments.

    The MailDest table has a subject field that contains the email of the message
    to send. The to_list field is a space-separated list of recipients of the email.
    For security reasons, the only characters allowed in to_list are alphanumerics,
    periods, underscores, and signs (@). If you are going to use email as a destination,
    you need to run Sendmail, Postfix, or another mail transfer agent on your appliance.

    The SnmpDest table contains the name of the destination, the IP address of the
    SNMP daemon, the community string for the SNMP daemon, the port number, and the
    type of trap to send (version 2 trap or version 2 inform). The values in these
    fields are passed as parameters to the snmtrap command, which actually sends the
    trap.'
