  md: '# # Finding Framebuffer Device Drivers for Your Video Card


    To find available device drivers for your video card, boot your PC with the Laddie
    CD.


    If the Laddie CD succeeds in finding a driver for your video card, it will launch
    the Laddie framebuffer UI, shown in Figure C-1. Otherwise, it will display the
    message *The framebuffer (/dev/fb0) is unavailable before the login prompt.


    ![](img/a28f80056348678270f2ea0cfefd7891_349_0.png)


    Figure C-1: The Laddie framebuffer UI


    For now, we''ll assume that a framebuffer driver loaded successfully. To determine
    which driver was loaded, first exit the framebuffer UI by pressing ESC. Then type
    the following at the command prompt:


    ```

    laddie:~$ dmesg | grep fb

    ```


    The dmesg command displays the buffer of messages produced by the kernel startup,
    and the grep command selects those that might have something to do with framebuffer.


    # ## The vesafb Driver


    The Laddie CD first attempts to load the vesafb driver, since this is the most
    likely candidate for an unknown graphics card. The vesafb driver ports an interface
    developed by the Video Electronics Standards Association (VESA) as VESA BIOS Extensions
    (VBE). The driver relies on the BIOS and must therefore be configured at system
    startup. This means the vesafb driver has to be compiled into the kernel, rather
    than being a separate module. The Laddie appliance configures the driver using
    a boot prompt, which we will describe.


    Here is example output from one of our systems with a vesafb driver installed
    successfully:


    ```

    vesafb: framebuffer=0x88000000, mapped to 0xf8880000, using 600k, total 32768k

    vesafb: mode=640x480, linewidth=640, pages=11

    vesafb: mode=protected interface info at c000:f003

    vesafb: scrolling:redraw

    ```'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'vesafb: Pseudocolor:size=8:8:8, shift=0:0:0

    vesafb: Mode is VGA compatible

    fbo: VESA VGA frame buffer device


    # Hardware-Specific Drivers


    If your system successfully loaded the vesafb driver, you will need to disable
    that driver at boot time in order to check for other drivers. To do this, reboot
    the Laddie CD. When you see the boot prompt, type novesa press ENTER. If the framebuffer
    UI launches, that means the system found an appropriate driver. Exit the framebuffer
    UI, and type the command dmesg fb. When we did this for one of our systems, the
    command produced the following:


    ```

    vesafb: probe vesafb failed with error -6

    rivaf: Nvidia device/chipset 10DE0D0D

    rivaf: Nvidia Corporation NV6 [NVIDIA TNT2 Model 64/Model 64 Pro]

    rivaf: MTRR set to ON

    rivaf: could not retrieve ID from DIC/I2C

    rivaf: setting virtual resolution to 52428

    rivaf: PCI Nvidia framebuffer over 0.95b (32MB @ 0xF8000000)

    [additional lines omitted]

    ```


    Here we saw the vesafb driver failed to load, and a device-specific driver succeeded.
    The rivafb is a video driver for NVIDIA graphics cards.

    You can also check hardware-specific framebuffer driver your system loaded with
    the lsmod command. Execute the following at the console:


    ```

    lsmod | grep fb

    ```


    The lsmod command lists all the modules currently loaded by the kernel; framebuffer
    names typically include the letters fb, for example, radeon, savagefb, or matrx_g450.
    By the way, the lsmod command will work for the vesafb driver, the vesafb driver
    isn''t a module—it''s compiled into the kernel.


    # Not Included in the Laddie CD


    If the Laddie CD did not find a driver for your graphics card, it is possible
    that a newer kernel will support it. In this case, use the lspci command to identify
    your graphics card. If your card is AGP, PCI, or PCI-Express, this command will
    report it. The following is one of several lines when running the lspci on one
    of our development machines.


    ```

    01:00.0 VGA compatible controller: Nvidia Corporation NV15 [GeForce 2 GTS/Pro]
    (rev a4)

    ```


    This shows us that we have an NVIDIA VGA-compatible controller (VGA stands for
    Video Graphics Array). At this point, you may need to spend some time on the Internet
    finding a driver for your graphics card. Also keep in mind that Linux does not
    support all graphics cards, so you may need to install a different card in order
    to use the framebuffer.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Configuring the Framebuffer Device Driver


    Once you''ve found the right video driver for your hardware, you''ll need to configure
    it for your desired video mode.


    # The vesafb Driver


    Since the vesafb driver relies on real-mode BIOS functions for initialization,
    it must be built into the kernel and configured at boot time. This configuration
    is specified at the kernel command line and may be provided at the boot prompt
    or in the bootloader''s configuration file. For the vesafb driver, the kernel
    command line should include the following:


    ```

    video=vesafb v=<Linux video mode>

    ```


    The Linux video mode is a number that specifies a particular resolution and number
    of bits per pixel. This number is formed by adding 0x200 to the video mode numbers
    specified by the VESA BIOS extensions. Linux video modes are summarized in Table
    C-1.


    Table C-1: Linux Mode Numbers


    | Bits per pixel | 320x200 | 640x400 | 640x480 | 800x600 | 1024x768 | 1280x1024
    |

    |---|---|---|---|---|---|--|

    | 4 | | | | 0x302 | 0x304 | 0x306 |

    | 8 | | | 0x300 | 0x301 | 0x303 | 0x305 | 0x307 |

    | 15 (5:5:5) | 0x30d | | 0x310 | 0x313 | 0x316 | 0x319 |

    | 16 (5:6:5) | 0x30e | | 0x311 | 0x314 | 0x317 | 0x31a |

    | 24 (8:8:8) | 0x30f | | 0x312 | 0x315 | 0x318 | 0x31b |


    # Choose an Appropriate Video Mode


    A typical VBE-compliant graphics card will not support all of these modes, so
    you may need to experiment to find one that works. The easiest way is to specify


    ```

    video=vesafb vga=ask

    ```


    at the boot prompt. (If you are experimenting with the Ladd CD, the complete boot
    prompt line would be linux vga=ask.) The kernel initialization code will display
    a list of modes and ask for a mode number. You can ignore the ones, since these
    are for text-only consoles.

    Also, don''t bother to choose the scan option. At best, this will provide a longer
    list of text modes; worst, it will hang the system and you will have to reboot.
    In fact, whenever you enter an unsupported number, the kernel responds immediately
    with Unknown mode ID. Try again, so it doesn''t take long to find one that works.
    When entering a mode, just provide the hex digits without the 0x.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Update the Kernel Command Line


    Once you have found a VBE video mode that works, you can update the kernel command
    line in your bootloader configuration file. In this case, you do need to use the
    leading 0x. For example, the command


    ```

    video=vesafb=0x3311 3

    ```


    would be appropriate for a VBE-compatible video card that supports a resolution
    of 640 by 480 with 16 bits per pixel. The final 3 specifies runlevel 3 to prevent
    the X display manager from loading a video driver.


    > > The vesafb driver accepts optional parameters for features like efficient
    scrolling. /usr/src/linux/Documentation/fb/vesafb.txt for details.


    # Hardware-Specific Drivers


    If you booted the Laddie CD with the novesa option and if the system was able
    to find a hardware-specific video driver, it will come up with default settings
    for the video mode.


    In this section, we will describe how you can experiment with those settings using
    the Laddie CD, and then you can select your preferred settings at boot time for
    your system. These comments also apply to video drivers that the Laddie CD doesn''t
    support, though you will have to use your own system to experiment with them.


    # Experiment with Different Video Modes


    Unlike the vesafb driver, non-VBE drivers can change modes after startup. To change
    video mode, use the fbset utility. It accesses the file /etc/fb.modes to associate
    mode names with geometry and timing parameters. For example, the command


    ```

    fbset 640x480-60

    ```


    will find the geometry and timing parameters associated with the string 640x480-60
    and use these to switch the framebuffer to a resolution of 640 by 480 at 60 Hz.
    If this command is successful, you will probably see the console screen change
    (e.g., to a larger font) as it switches to a different graphics mode.


    If the fbset utility is not available on your distribution, you can download-it
    from /packages.debian.org/stable/admin/fbset. If you install it yourself, be sure
    to install an appropriate fb.modes file in /etc. You can use one of the fb.modes
    files provided with the fbset package (which is what we did), but so with, because
    incorrect timing values can damage some monitors.


    # Select the Desired Video Mode at Startup


    The Laddie CD maintains hardware-specific video drivers as modules, but once you''ve
    found the appropriate framebuffer driver for your system,'
  merge: -1
  pgno: 352
- img_proc: true
  md: 'you may want to build it into the kernel. This is not an option with the Laddie
    CD, of course, but if you rebuild the kernel for your own system, you will need
    to configure the driver at the kernel boot prompt. Many non-VBE framebuffer device
    drivers now support a common syntax for providing the video mode on the kernel
    command line. Following this syntax, the examplefb driver be selected at boot
    time with the following command:


    ```

    video=examplefb:1024x768-24876

    ```


    This specifies a width of 1,024 pixels, a height of 768 pixels, 24 bits per pixel,
    and a refresh rate of 76 Hz.


    NOTE No timing information has been provided except for the refresh rate. The
    kernel includes a database of timing parameters (see the file /usr/src/linux/drivers/video/modeb.c
    for details) and will search for an entry that matches the desired resolution
    and refresh rate. If it fails to find a match, it will use a default video mode,
    and it will attempt all modes in the database.


    In general, the following format is used to specify the video mode:


    ```

    <x>x<yes>[r][<bpp>[@refresh>][i][m]

    ```


    Here, an optional m requests the use of VESA Coordinated Video Timings, a systematic
    method for determining appropriate timings based on resolution, refresh rate,
    the type of monitor (CRT or digital display), and interlacing. The optional r
    specifies blanking for digital displays. The optional i specifies interlaced mode,
    and the optional m requests an additional 1.8 percent margin in the timing calculations.


    Besides the common syntax outlined here, specific drivers may support other options,
    such as disabling acceleration. There is little commonality among drivers; you
    may need to consult your driver''s source code to find these options.


    # Verify the Settings for Your Framebuffer Driver


    If you have successfully loaded a framebuffer driver and let the fbset -i command
    to report more about its configuration, you can view your framebuffer''s geometry,
    timings, and other parameters.


    To see configuration data on a loaded framebuffer driver, try using cat to examine
    the contents of /proc/fb and the files in /sys/class/graphics/fb0. Not all drivers
    use the /sys directory, but when they do, files provide a convenient way to access
    framebuffer parameters such as bits_per_pixel and color_map.


    For more information on the Linux framebuffer, see the (somewhat dated) HOWTO
    at http://ldp.org/HOWTO/Framebuffer-HOWTO.html. The VBE 3.0 specification is available
    at http://www.vesa.org/public/VBE/vbe3.pdf.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# # A DB-TO-FILE UTILITY


    ![](img/a28f80056348678270f2ea0cfefd7891_354_0.png)


    This appendix describes tbl2filed, a daemon that allows you to use SQL to read
    and write values in Linux configuration files as if those values were in a database
    instead of a file. This utility is convenient if you want to use RTA for new daemons
    and want to keep the same database metaphor for reading and writing values into
    traditional, non-RTA configuration files. Topics discussed in this appendix include:


    +   - Overview

    - Table definitions

    - Usage and API

    - Security notes'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Overview


    The goal of the tbl2filed daemon is to allow your UI programs to use a PostgreSQL
    library to read or write (SELECT or UPDATE) an RTA table and have an underlying
    system configuration file scanned or modified as part of the SELECT or UPDATE.
    This utility tries to mimic the common tasks of:


    +   - Viewing values in a configuration file (SELECT value ...)

    - Editing the values in a configuration file (UPDATE value ...)

    - Atomically writing a file to disk (UPDATE tbl2filed SET do_commit...)

    - Restarting a service if necessary (UPDATE tbl2filed SET do_script...)


    The tbl2filed daemon allows you to read and write configuration files using PostgreSQL-commands
    on two RTA tables. The first table, tbl2filed, describes the files managed by
    the daemon, and the second table, tbl2field, describes the managed fields.


    Figure D-1 illustrates how this utility maps two tables into text fields inside
    disk files.


    ![](img/a28f80056348678270f2ea0cfefd7891_355_0.png)


    Figure D-1: Use SQL to access data in files.


    This daemon also lets us put all of the restart scripts for system services in
    a single file and use a single method (a write callback) to invoke them. This
    approach might help security because it allows a non-privileged UI program to
    safely change the system configuration files.


    # Table Definitions


    An example is given later in this appendix, but for example to make sense, you
    need some understanding of the contents of the tbl2filed tables. Laddie uses tbl2filed
    to help with the networking configuration, and you may find the tables easier
    to understand by looking at them in a running Laddie system. Boot the Laddie CD
    and follow the tbl2filed link at http://192.168.1.11/table_editor/rta_apps.html.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# The tbl2file Table


    The table of managed file information, tbl2file, has the following columns:


    ```

    name               // name of the file

    path               // full path to the file

    do_commit          // flush values to the file on 0->1

    timestamp           // time we last read/parsed file

    do_script          // run script on 0->1 transition

    script_parms       // the parameters passed to the script

    ```


    The name of the file is the name as seen by the UI. It is also used as part of
    the index into tbl2field. This can just be shorthand or a mnemonic for the file,
    example, resolv.


    The path is the full path to the file, including the filename. For example, the
    name field might be resolv, while the path might be /etc/resolv.conf.


    Writing 1 to the do_commit flag causes the managed file''s values to be written
    back to the disk file. The file is written to a temporary file first and then
    rename() is called to move the temporary file to the destination file. This mechanism
    helps maintain consistency in the system by trying to make a write of the file
    as atomic as possible. A SELECT on do_commit always returns a zero.


    Reading and parsing the values from a file is expensive in terms of time and CPU
    cycles. Since the files won''t change, we can improve the system''s responsiveness
    by caching the file''s values in the tbl2field table and only rere the file if
    it has been modified since the last time we read. The timestamp marks the time
    we last read and parsed the file; time is measured as the number of seconds since
    the last write. When a UI asks for a value, a daemon compares the mtime (time
    of modification) of the file''s node to our stamp, and either escapes the file
    if necessary or returns the values directly from the fields table, if the cached
    values are still valid.


    Setting do_commit to start the script /usr/local/tbl2filed/tbl2script.sh. The
    script_parms field has a set of space-separated parameters that are passed to
    the script. The parameters are not passed on the command line; rather, they are
    passed in standard input and parsed into parameters using a cut command. This
    script is spawned and forgotten—that is, ignore any return value from it. The
    script is only run by an explicit write of 1 to the do_script column, and the
    column is only used for its write callback. A SELECT on this column will always
    return a zero. Laddie uses this script, for example, to restart networking when
    the user changes the appliance''s IP address.'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# The tblfield Table


    The tblfield table that holds the values for the individual fields and has the
    following columns:


    ```

    name      // name of the file, e.g., "resol"

    field     // field name, e.g., "search_domain"

    pattern   // regex to extract value from line

    regrr // nonzero if any errors in the pattern string

    skip      // skip this patterns to target

    format    // printf format to replace line

    value     // current value of field

    ```


    The name is the name of the file and must match the name column in the tbl2file
    table.


    The field is the name of the field as seen by all of the UI programs. This is
    always used in a WHERE clause to identify the field to read and update.


    The pattern is a regular expression that, in combination with the skip identifies
    the field in the file. The pattern should contain exactly one set of parentheses
    to extract the value from the text of the line. For example, to get the first
    DNS name server from the resolv.conf file, we might use the following regular
    expression:


    ```

    ^nameserver[\t]+([0-9]+\)

    ```


    The regerr field is nonzero if the pattern cannot be parsed as a regular expression.
    It should be necessary to examine regerr during development.


    The skip column tells how many of the above patterns to skip before selecting
    a line as the source of the file. For example, we use a skip value of 1 to read
    the second DNS nameserver from resolv.conf. This would skip over one nameserver
    and read the second one.


    The format field is used to produce the line of configuration data in the target
    file. We could get this from the regular expression, but having a printf string
    is a lot easier. If this column is blank, the field is considered a read-only.
    Any of the read-only values in /proc or /sys should have a blank format field.
    You can see an example of a read-only value by looking the uptime field in tbl2field
    table. For a nameserver in resolv.conf, the format string would be nameserver
    \s. There is no need for a \n in the format string, it is added automatically
    by the print statement.


    The value is the current value of the field as a string. Doing a SELECT on this
    column will cause the file to be read and parsed if necessary (see timestamp in
    tbl2field above). If the cached value is valid, the value is taken directly from
    the table. A write on this column saves the value in the table but does not actually
    write the value to the file; writing a 1 to do_commit that.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# A tbl2filed Example


    Let''s look at a complete example by continuing with the nameserver configuration
    for Laddie. The /etc/resolv.conf file on a running Laddie system looks like this:


    ```

    nameserver 204.117.214.10

    nameserver 199.2.252.10

    nameserver 65.173.40.10

    ```


    Our goal is to be able to read the first DNS nameserver with a SELECT statement
    as follows:


    ```

    psql -h localhost -p 8885

    > SELECT * FROM tbl2field where name = "nameserver_1";n> q

    ```


    Similarly, to modify the second nameserver, Laddie uses the UPDATE statement:


    ```

    psql -h localhost -p 8885

    > UPDATE tbl2field SET value="192.168.1.1"

    > WHERE name=resolv AND field="nameserver_2";n> q

    ```


    You can verify the above by booting the CD, exiting the buffer menu, logging in
    as root, and executing the commands above. Be sure to verify that the file has
    been modified after the UPDATE command.

    Now let''s look at the tbl2filed and tbl2field configuration that gives us the
    ability to read and write nameserver IP addresses as if they were in a PostgreSQL
    database. We''ll start by listing the file we want to manage in the tbl2file table:


    ```

    UPDATE tbl2file SET name="resolv", path=/etc/resolv.conf,

    script_params="*" LIMIT 1 OFFSET 0

    ```


    We don''t need to run a script after editing the resolv.conf file, so we can leave
    script blank. You can use either full or relative path names, as a security precaution,
    it is a good idea to use the full path.

    In this example we manage the three DNS nameservers.

    The SQL for this is taken from tbl2filed.sql (perhaps the full path, i.e., /opt/laddie/tbl2filed/...)
    and is as follows:


    ```

    UPDATE tbl2filed SET name="resolv", field="nameserver_1", skip=0,

    pattern="^nameserver[^[0-9]+" LIMIT 1 OFFSET 1

    UPDATE tbl2filed SET name="resolv", field="nameserver_2", skip=1,

    pattern="^nameserver[ \t][0-9]+" LIMIT 1 OFFSET 2

    UPDATE tbl2filed SET name="resolv", field="nameserver_3", skip=2,

    pattern="^nameserver[ \t][0-9]+" LIMIT 1 OFFSET 3

    ```'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'The pattern recognizes the line with the parameter, and the single set of parentheses
    in the pattern extracts the actual field value. In the above examples, the value
    of a nameserver field must have only the digits zero through nine and/or decimal
    points. The parentheses are not part of the recognition—they are only used to
    extract the field value.


    One nice feature of the tbl2field daemon is that when you write a value to a field,
    the daemon uses the string to build a copy of what the configuration line will
    look like. It then runs the pattern against the new line and rejects the update
    if the pattern doesn''t recognize the new line. In this case, an update for a
    nameserver of 11.22.33.44 would succeed, since it contains the required digits
    and decimal points; however a nameserver update of 8ob''s fun house would fail,
    since it does not contain the required digits and decimals.


    The names example also illustrates the use of the skip column. The primary nameserver
    skip set to zero, meaning that we use the first line with a matching pattern.
    The secondary nameserver is specified with skip set to 1, meaning we skip one
    matching line and use the second matching line.


    # Security Notes


    Depending on how you use it, this daemon can enhance or hurt your system. At first
    glance, having a daemon that runs with root privileges and accepts database connections
    seems a bad idea. On the other hand, this might allow you to improve security
    by running only one daemon as root and running each of the UI programs as a non-root
    user. This way, if an attacker breaks into one of your UI programs, he or she
    only gains the privileges of non-root user. Compare this to most Linux appliances,
    in which a UI needs to run as root in order to make system changes.


    The daemon reads tbl2file.sql when it starts, and then marks all of its configuration
    files as read-only. Not allowing updates to the managed files or script parameters
    helps security, but it also means that you cannot update any part of the configuration
    after the program starts. You must edit the tbl2file.sql and tbl2field.sql files
    directly before starting the tbl2field daemon. If you mark any column as read-write
    to make development easier, be to change it back to read-only before you ship
    your product. Also, be sure to protect the write privileges on the directory and
    files with the daemon''s initial configuration.


    > The resolv.conf file is different from most Linux configuration files in that
    switching to DHCP as the boot configuration protocol can completely destroy any
    values you''ve previously written into it. The simple solution to this problem
    is to keep a template file copy to /etc/resolv.conf when necessary.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# # E


    # # THE LADDIE APPLIANCE

    BOOTABLE CD


    ![](img/a28f80056348678270f2ea0cfefd7891_360_0.png)


    The CD accompanying this book serves two purposes. First, it allows you to demonstrate
    the techniques described in this book by turning your x86 PC into a working appliance.
    Second, it allows you to study, in as much detail as you care to, the source code
    that implements this appliance. In this appendix, we show you how to boot and
    run the Laddie appliance CD, and we provide a tour of the CD’s contents. We also
    provide a simple example of how the CD supports modifying, rebuilding, and reinstalling
    the appliance.


    # ## Running the Laddie Appliance


    The Laddie CD doesn''t require that your machine running a specific operating
    system, you don''t need to install anything, and the CD won''t place anything
    on your hard drive. In fact, you don''t even need a hard drive. The CD creates
    a ramdisk for the root filesystem with links back to the CD, and in'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'this context it runs the Laddie appliance. When you''re finished using the
    CD, simply remove it and reboot your original operating system. You''ll find nothing
    has changed.


    What do you need in order to run the Laddie appliance is an x86-based PC with
    at least 64 megabytes of system memory, a VESA-compliant video card (if you need
    to run the framebuffer interface), and a BIOS that is configured to boot from
    a CD-ROM.


    In this section we''ll explain how to boot the CD, and show you how to verify
    the framebuffer and web interfaces are working, and then''ll explain how to access
    the other user interfaces. We''ll also explain how to shut down the appliance.


    # Booting the CD


    With the Laddie CD in the drive, reboot your computer. If the CD boots successfully,
    you''ll be greeted with a message like the following:


    ```

    SOLINUX 2.08 0x4072248c Copyright (C) 1994-2003 H. Peter Anvin

    Welcome to LAD dist 2007.02.25

    *** To abort, hit <SPACE>, then eject the CD. ***

    Select "linux", "vga", "novesa", or "shell"

    Booting default (linux) in 6 seconds...

    boot:

    ```


    At this point, you should press ENTER or wait six seconds to continue the boot
    sequence.


    A commercial appliance would typically hide boot messages from the user. Since
    this is an educational system, we want to see them. A commercial appliance designed
    for a specific hardware configuration would also boot up more quickly. This CD
    is designed to work with a broad range of hardware configurations and provide
    a flexible environment for users to experiment with and build from, so the process
    takes a little longer. In particular, the startup scripts load drivers for any
    hardware the system recognizes, even hardware is not required for the Laddie appliance.


    # Navigating the Framebuffer User Interface


    Once the CD boots successfully, the system will present you with the main screen
    for the Laddie framebuffer user interface (see Figure E-1). If you see this screen,
    you''ve succeeded in running the appliance and you should now be able to use your
    keyboard''s arrow keys and ENTER key to navigate the Laddie framebuffer user interface.
    (If your keyboard doesn''t have arrow, use i for up, j for left, k for down, and
    l for right.)


    NOTE If the boot process completes and a login prompt appears instead of the screen
    shown in Figure E-1, your video card is probably not VESA-compliant. In that case,
    the Laddie appliance will still run, but you won''t be able to experiment with
    the framebuffer interface.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Laddie Alarm System - Status


    | Zone | State |

    |---|---|

    | 1. Front Door | Safe Test |

