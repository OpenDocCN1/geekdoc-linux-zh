- img_proc: true
  md: 'Now let''s check the version to make sure it is what we installed and

    some older version that''s lurking on your path.


    ```

    $ snmpwalk --version

    NET-SNMP version: 5.2.1\$

    ```


    # Configure the Agent


    So far, good—you have the client-side programs. Now you need to get the

    agent running so these programs have something to query.


    The agent runs as a daemon and listens for incoming SNMP requests

    UDP port 161, by default. It requires some configuration information that it

    ormally picks up from the file snmpd.conf in the directory /etc/snmp.

    (The note d in snmpd.conf, it indicates daemon—our agent). Do not confuse

    this with snmpd.conf, which we will introduce later on.) Snmpd.conf tells the

    agent how to authenticate incoming requests, to send traps (which are

    SNMP notifications), and so forth.


    Net-SNMP provides a program called snmpdconf that generates the

    snmpd.conf file from the answers to a series of questions, but because your

    eeds are pretty simple, you can generate the configuration by hand.

    Your snmpd.conf file should contain:


    +   - community public

    - syslocation "my den"

    - syscontact me@addr.com


    > The community macro sets your read-only community string, which for

    now you can think of something like a packet. Net-SNMP gives you much

    more precise control over this, but that''s beyond our needs right.

    The syslocation and syscontact lines set the values for the syslocation

    and syscontact objects in the MIB-2 system group. When you are managing

    only a small set of systems in one location, this information may not be

    very interesting, but in a large corporate network with multiple sites, it

    be invaluable to know how to locate a system and (A little later in this chapter,
    you will see how to access this information

    cross the network with SNMP queries.)


    Place this snmpd.conf file into the /etc/snmp directory. The three lines

    above are all you''ll need to get started.


    # Start the Agent


    Start the agent, and put it into the background. The agent listens on port

    161, so you''ll need to be logged in as root to use this command:


    ```

    /usr/sbin/snmpd -c /etc/snmp/snmpd.conf -C &

    ```


    In the parlance of the CLI chapter, snmpdconf would be called a wizard.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'The -c /etc/snmpd.conf tells the agent to use the given configuration file,
    and -c tells the agent to use only this configuration file.


    For now, you can just type the above command (as root), but on your appliance
    you''ll want the SNMP agent to start up with the system.


    # Exploring with SNMP


    Now let''s turn our attention to the client side. The commands snmpget, snmpwalk,
    and snmpset are all SNMP commands, or SNMP management applications, in SNMP-speak.
    SNMP uses the term manager or management application for the client agent and
    for the server side. The agent serves up the data on the appliance, and the SNMP
    manager is the client requesting the appliance''s information. You won''t need
    to be logged in root to use these client commands.


    Let''s use snmpget to test your agent.


    ```

    $ snmpget -v2c public localhost syslocation.0

    SNMPv2-MIB:syslocation.o = STRING: "my den"

    ```


    You''ve told snmpget to use SNMPv2c (community-based) SNMP version 2 and the community
    string public to send a query to the local machine asking for the value of the
    variable, the .o appended to the variable name which you configured in your snmp.conf
    file. The .o location name is SNMP''s way of indicating that syslocation as a
    class that has one instance. If this was an array (table) of tables, the .o would
    be replaced by the row number of the variable (1, 2, 3, and so on). Row numbers
    always start with 1, so there is no confusion between a row index and a scalar
    indicator.


    You need to tell the snmpget command to use SNMPv2c, because it defaults to SNMPv3;
    you could use snmpconf to generate the file, this time selecting snmp.conf (no
    d), but you can just create the snmp.conf file by hand with this single command
    (run as root).


    ```

    echo "defversion 2" > /etc/snmp/snmp.conf

    ```


    Now you stop typing the -v2c with each command.


    > ³ If you get the message Timeout: No Response from localhost instead, you may
    have something blocking UDP requests to port 161. Check your firewall settings
    and your /etc/hosts.deny. If you find ALL in your hosts.deny, comment it out and
    try the snmp agent.


    > ⁴ SNMP is called "community-based" because it uses the SNMPv1 community strings
    (think of them as passwords). There is no management about the new security framework
    that was intended for SNMPv2, so SNMPv2c was released without it. When it was
    ready, the new security framework was released in SNMPv3.


    > ⁵ Notice that the MIB object is syslocation, but the command in the snmp.conf
    file is syslocation. There is no significance to this; it was just the implementer''s
    design choice to use all lowercase letters for the keys in the configuration file.'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'If you have access to any other networked devices, you might try querying them.
    For example, here''s the snmpwalk command run against an ApplePort Base Station:


    ```

    $ snmpwalk -c public 10.0.0.1:1

    snmpv2-MIB::sysDesc.0 = STRING: Base Station V3.84 Compatible

    snmpv2-MIB::sysObjectID = OID: Snmpv2-SM::dotZero

    DISMAN-EVENT-MIB::sysTimeInstance = Timeticks:(49711868): 14:31:88

    snmpv2-MIB::sysContact.0 = STRING: me@myaddr.com

    snmpv2-MIB::sysName.0 = STRING: MyAirport

    snmpv2-MIB::sysServices.0 = INTEGER: 79

    snmpv2-MIB::sysServices.0 = No more variables left in the MIB View (It is the
    end of the MIB tree)

    ```


    Clearly, the sysDesc.0 (system description) identifies this as an Apple Base Station.
    You''ll also recognize the syslocation and sysContact information for this device.
    This device doesn''t offer up a lot of information, but there is enough to identify
    what it is, where it is, and who to contact about any issues you have with this
    box, should it''s misbehaving. Of course, the availability of the system location
    and contact relies on the administrator of that system, who is configuring these
    values on the target device. An inattention system administrator may leave you
    to work with.


    Notice that for this query we used snmpwalk instead of snmpget because we wanted
    to see what other information is furnished by this device. The snmpget retrieves
    one object instance using an SNMP GET data unit, while snmpwalk uses multiple
    SNMP GETPDUs to “walk” an entire MIB. You pick a starting point, and snmpwalk
    asks for the next object instance; the agents return that object and its OID,
    and snmpwalk asks for the next object instance after the new OID. Eventually,
    the agent responds that there is nothing to return, and the walk terminates.


    # MIB Files for Readable Names


    The display of nice, readable names for OIDs—like sysDesc and sysLocation—depends
    on having the right MIB files registered on your client system. In the case of
    Net-SNMP, registration simply means putting these files in the right directory
    and setting the SNMP commands (like snmpget and snmpwalk) to use them. You can
    set a few environment variables to do this job for you (e.g., .bashrc):


    ```

    export MIBs-ALL

    export MIBDIRS=/usr/share/snmp/mibs

    ```


    When you installed Net-SNMP, it placed a set of standard MIB files in /usr/share/snmp/mibs,
    as you can see in the list below. These are all plain-text files written using
    a human-readable and machine-parseable format.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'Some of these actually describe MIBs. Others support files that define information
    needed by the files that describe the MIBs, just as header files are used in the
    C language.


    ```

    $ /usr/share/snmp/mibs

    AGENTK-MIB.txt         RFC1155-S.txt

    DISMAN-EVENT-MIB.txt   RFC1213-MIB.txt

    DISMAN-SCHEDULE-MIB.txt  RFC-1215.txt

    DISMAN-SCRIPT-MIB.txt   RMON-MIB.txt

    EtherLike-MIB.txt       SMUX-MIB.txt

    HCNUM-TC.txt             SNMP-COMMUNITY-MIB.txt

    HOST-RESOURCES-MIB.txt   SNMP-FRAMEWORK-MIB.txt

    HOST-RESOURCES-TYPES.txt  SNMP-MPD-MIB.txt

