    # SNMP Traps


    As well as responding to SNMP requests like SET and GET, SNMP-enabled devices
    in the network can send out spontaneous notifications of local events. These notifications
    are sent either as SNMP traps or informs. Traps are datagrams without the expectation
    of a response. Informs are an improvement over traps because they expect a confirmation
    response and are reent when the trap receiver does not confirm them in a timely
    fashion. The time-out and number of retries are set by the trap sender as parameters
    to the snmtrap command.


    # Receiving traps with snmtptrap


    You can use snmtptrap to receive traps. In the 5.2.1 release of Net-SNMP, which
    we have been using in this chapter, all you have to do is open a separate terminal
    window and execute the following command as root:


    ```

    snmtptrap -Os -Le -f

    ```


    As of the 5.3 release, the security of snmtptrap was tightened so it no longer
    allows accepting traps with any community name. In later versions, you need to
    create a snmtptrap.conf file in the /etc/snmp directory and include a line telling
    it which communities to connect to. We will be using public, so our snmtptrap.conf
    file would contain the following:


    ```

    authCommunity log public

    ```


    Now you can issue the snmtptrap command above to view the traps you receive.

    This command normally runs in the background where it can receive traps, format
    them, and write them to a log file. However, you are using the -f parameter here
    to tell snmtptrap to stay in the foreground and the -Le parameter to send its
    output to stderr. You can also use the -Os parameter to tell snmtptrap print only
    the last symbolic part of the OID, which will save space and make the output more
    readable.'
  merge: -1
  pgno: 261
