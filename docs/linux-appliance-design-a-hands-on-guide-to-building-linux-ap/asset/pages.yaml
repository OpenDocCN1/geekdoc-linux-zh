    # Examples Using logmuxd


    Let''s go over a few examples to help clarify how to use logmuxd.


    # Example 1: A logmuxd Demonstration


    In the previous section, you may see one of the nice features of the Laddie Alarm
    System is that when an alarm occurs, all of the UIs are updated to reflect the
    alarm and the new system status. This demonstration shows how to see the log messages
    that are distributed to all of UIs.


    +   1. Boot the Laddie CD. After the system is up, verify that you can see Laddie''s
    web interface on the web browser of another PC.

    2. On Laddie, logmuxd is configured to broadcast alarm system events down all
    TCP connections to port 4444. Open a terminal and window telnet port 4444 on the
    Laddie PC. For example:


    ```

    telnet 192.168.1.11 4444

    ```


    +   3. Use the web interface to test a few zones, and then clear all the alarms.
    Your telnet session should display log messages similar to the ones below.


    2007-10-07 12:03:35 User set alarm on zone 2, Back Door

    2007-10-07 12:03:35 Alarm system status: alarm

    2007-10-07 12:03:37 User set alarm on zone 3, Garage

    2007-10-07 12:03:38 User cleared alarm on zone 2, Back Door

    2007-10-07 12:03:40 User cleared alarm on zone 3, Garage

    2007-10-07 12:03:40 Alarm system status: safe


    As simple as this example is, it shows logmuxd''s ability to multiplex log messages.


    # Example 2: logmuxd and Accepted TCP Connections


    Our rationale for building a new logger is that we wanted the ability to open
    a TCP connection to the logging daemon and have log messages delivered to us over
    that connection. The last example showed us this ability in action, and in this
    example we show how to configure logmuxd to accept TCP connections. We use logmuxd
    to replace syslog, the logger command to generate a "arriving" message, and a
    telnet connection to logmuxd to view the rewritten log messages. In this example
    we are writing log messages of the form "Train arriving from city_name on track
    track_number" to the form "city_name: track_number".'
