    MAX-ACCESS\tread-only\nSTATUS\tcurrent\n```\n\nDESCRIPTION\n\"A user-configured\
    \ name for this zone.\"\n::= { ladAlarmEntry 2 }\n\n```\nladAlarmEnable OBJECT-TYPE\n\
    SYNTAX\tTruthValue\nMAX-ACCESS\tread-write\nSTATUS\tcurrent\n```\n\nDESCRIPTION\n\
