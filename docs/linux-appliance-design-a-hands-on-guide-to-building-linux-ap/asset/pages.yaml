  md: "# The Alarm Table\n\nNow for the core of the MIB: the Alarm Table. This is\
    \ the table displayed at the beginning of this chapter, showing the zones and\
    \ alarm states. Here is how we define this table in our MIB:\n\n+   - LAD Alarm\
    \ Table\n\n```\nladAlarmTable OBJECT-TYPE\nSYNTAX SEQUENCE OF LadAlarmEntry\n\
    MAX-ACCESS not-accessible\nSTATUS current\nDESCRIPTION\n  \"A table of alarms.\n\
    :: { ladSystemTables 1 }\n```\n\n```\nladAlarmEntry OBJECT-TYPE\nSYNTAX LadAlarmEntry\n\
    MAX-ACCESS not-accessible\nSTATUS current\nDESCRIPTION\n  \"An entry in the Alarm\
    \ Table.\"\nINDEX { ladAlarmZoneId }\n:: { ladAlarmTable 1 }\n```\n\n```\nladAlarmEntry\
    \ :=\\nSEQUENCE {\n  ladAlarmZoneId Integer32,\n  ladAlarmName DisplayString,\n\
    \  ladAlarmEnable TruthValue,\n  ladAlarmLatching TruthValue,\n  ladAlarmState\
    \ TruthValue,\n  ladAlarmCount Counter32\n}\n```\n\nNotice that we have three\
    \ blocks of definition above: ladAlarmTable, ladAlarmEntry, and LadAlarmEntry.\
    \ SNMP requires that all object names begin with a lowercase letter (hence, ladAlarmTable,\
    \ ladAlarmEntry). LadAlarmEntry is not an object, but a definition of the syntax\
    \ of the table entry. It is common practice to define the syntax of a table with\
    \ the same name as the table, but starting with an uppercase letter (LadAlarmEntry).\
    \ The syntax of ladAlarmEntry is a sequence (list or array) of other object types\
    \ which are the columns in the table.\n\nAfter the definition of the table entry\
    \ syntax, we'll list the detailed definitions of each columns listed in the SEQUENCE\
    \ clause:\n\n```\nladAlarmZoneId OBJECT-TYPE\nSYNTAX Integer32 (1..128)\nMAX-ACCESS\
    \ not-accessible\n```"
