    \ PostgreSQL provides for this library. Basically, we are attempting a connection\
    \ to port 8888 (the port ladd daemon decided to use) on localhost. If we fail,\
    \ we return resources (PQfinish), log an error message using the DEBUGMSGTL we\
    \ saw earlier, and return an error. Otherwise, we return success. Note that DEBUGMSGTL\
    \ takes a statement and parameters like printf, but it requires an extra set of\
    \ parentheses. We have replaced the defaultProject strings with the shorter LAD,\
    \ to save some horizontal space in our examples. The ungenerated code you will\
