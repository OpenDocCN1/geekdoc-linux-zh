- img_proc: true
  md: '# Why SNMP?


    In the early 1970s, computers and their I/O devices were large enough to need
    air-conditioned rooms of their own. Most large companies performed their computing
    tasks on stand-alone systems. It wasn''t hard to tell when something went wrong—an
    error would print on the system console, and the front panel lights would stop
    blinking.


    Today, even small technology companies have a server room with racks of computers
    and network appliances from multiple vendors, including switches, routers, print
    servers, webservers, RAID servers, and so forth. Network printers are distributed
    at convenient locations around the site, and each has a desktop or laptop computer.
    In fact, high-tech firms typically have more than employees.


    Unlike those of yours, the failure of any single component in this network of
    devices is not so easy to detect. IT managers need more form of automation to
    help them manage all these devices.


    The automation may be as simple as a roll-yourout script that performs periodic
    ping sweeps, but larger networks are likely to link to a Network Management System
    (NMS) that use SNMP, such as Hewlett Packard''s OpenView. Such a system can tell
    much more when a device breaks down. It can record performance statistics, keep
    a restart history, and maintain a log of notifications from the devices themselves
    about impending problems. Devices may report excessive packet drops or retransmissions;
    connectivity failures; a fan running slowly or a CPU running too hot; excessive
    CPU, memory, or disk utilization; as well as system restarts.


    # Agents and Managers


    The managed devices (routers, switches, web hosts, desktop computers, network
    printers, and so on) each run a server process (daemon) called an SNMP agent.
    This agent listens on a particular UDP port (usually, but not always, 161) for
    read (GET) and write (SET) commands. It''s the agent''s responsibility to fetch
    the requested data and return it. This agent, as well as other monitoring software
    on the device, may also send spontaneous notifications called traps or informs
    to more configured systems.


    Management applications (managers) poll the agents for information. They may keep
    historical information, generate reports, or create graphical maps of the devices
    in your network. Some management applications are just simple command-line tools
    (like the snmpwalk, snmpget, and snmp commands supplied with NetSNMP).


    # Namespace, Grammar, and Protocol


    SNMP stands for Simple Network Management Protocol, but it is actually more than
    just a protocol—it''s a way of naming data, a grammar for describing data, and
    a protocol for exchanging data over a network. These components are called the
    MIB (the naming scheme), SMI (the grammar) and the SNMP protocol. The RFCs that
    describe SNMP include a common set of information'
  merge: -1
  pgno: 333
- img_proc: true
  md: "useful in managing networked devices. This is called MIB-2 (it took\ntwo tries\
    \ to get it right). We'll be discussing more about MIB-2 later.\n\n# The MIB\n\
    \nMIB stands for Management Information Base. That's a mouthful, but you can\n\
    just think of it as a hierarchical naming scheme for a virtual database. This\
    \ is\na \"virtual\" database because the data may not exist anywhere in storage\
    \ until\nthe agent receives a request to read the data. When asked for an object\n\
    (think of this as a field in a record in the database) the agent retrieves the\n\
    information and returns it in a process that may involve getting multiple\npieces\
    \ of information from the managed system and computing the value to\nreturned.\
    \ (You might think of this as a just-in-time database.) The very act\nof requesting\
    \ a piece of information may trigger the creation of the value.\n\nAlthough there\
    \ is one universal addressing scheme, we break it down into\ndivisions, which\
    \ we also call MIBs. Normally, when people use the word\nMIB, they are referring\
    \ to the overall namespace, but one of these\nsubdivisions. MIB-2 is one of them,\
    \ and many others are defined by different\ngroups for different purposes. Some\
    \ are produced by standards groups, while\nothers are defined by private companies\
    \ to describe proprietary data furnished\by their networked products. (In Chapter\
    \ 14 we describe how you can define a\nprivate MIB for your own appliance and\
    \ a place for it in the namespace.)\n\n# The OID\n\nEvery object in every MIB\
    \ has an unique object identifier (OID). An OID is a unique\nname consisting of\
    \ a sequence of decimal digits separated by periods, or dots,\nthis so:\n\n.1.3.6.1.2.1.1.2.0\n\
    \nThis name represents the object's location in the namespace. The first\ndot\
    \ represents the root of the tree, and each number represents a node (the\nbase\
    \ of a branch) in the tree. Everything nameable in SNMP is located some-\\where\
    \ in this OID tree, and every (OID) contains the entire path to\nthat object from\
    \ the root of the tree.\n\nThis may look strange at first, but it works in the\
    \ same way as the Unix\nfilesystem, with which you should be familiar. Paths to\
    \ files start at root,\nindicated by an initial slash (/), proceed through a number\
    \ of named nodes\n(directories) separated by slashes, and end with the name of\
    \ the file itself.\n\nLet's take the example of a file on a Unix filesystem:\n\
    \n```\n/usr/local/bin/myprog\n```\n\nIf we use a to separate directories instead\
    \ of a slash, the path to the\nfile would look like this:\n\n```\n.usr.local.bin.myprog\n\
    ```"
