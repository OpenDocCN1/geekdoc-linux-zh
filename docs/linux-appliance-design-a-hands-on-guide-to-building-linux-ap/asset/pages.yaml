  md: "Laddie's functional specification is divided into two parts: one that allows\
    \ users to access alarm configuration and status and another that allows Laddie\
    \ to handle alarms.\n\n**NOTE** As a reminder, Ladd refers to the whole appliance,\
    \ and ladd refers just to the daemon that monitors the five input pins on the\
    \ parallel port. It's easy to confuse the two, since they are pronounced the same.\n\
    \n# ladd's Configuration and Status\n\nladd has one configuration and status table,\
    \ called Zone, that is visible to all of the RTA table. The Zone table has five\
    \ rows, with each defined by the following data structure:\n\n```\n/* The structure\
    \ to hold the definition, configuration, and status\nof each alarm pin on the\
    \ parallel port */\nttypedef struct {\n    int id;                  // ID number\
    \ of alarm [1-5]\n    char name[ZONE_NAME_LEN]; // the zone name\n    int enabled;\
    \             // ==1 if enabled\n    int edge;                // ==1 if alarm\
    \ on low to high transition\n    int latching;            // ==1 if we should\
    \ latch the alarm\n    int input;               // is the latest raw input from\
    \ the alarm\n    int alarm;              // ==1 if in alarm\n    int count;  \
    \            // count of alarms on this pin\n};\n```\n\nLet's consider each of\
    \ these fields in turn.\n\n# id (Configuration)\n\nZones are identified by a number\
    \ between one and five. The id field is initialized when ladd starts, and users\
    \ cannot edit it. You can use the id in user interface to uniquely identify a\
    \ particular zone.\n\n# enabled (Configuration)\n\nOnly zones enabled cause the\
    \ system to enter an alarm state. Zones marked disabled do not generate log messages\
    \ or cause alarm states. This field holds an integer instead of a boolean, RTA\
    \ does not support a boolean data type.\n\n# edge (Configuration)\n\nFor the hardware\
    \ described in the next section, a normally closed sensor triggers an alarm on\
    \ a zero-to-one edge. Normally open sensors on Laddie trigger an alarm on a one-to-zero\
