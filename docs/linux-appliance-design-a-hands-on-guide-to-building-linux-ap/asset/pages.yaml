  md: "Many demons let you set the verbosity of debug logging with a parameter on\
    \ the command line. For example, -d 5 might turn on debugging output with a verbosity\
    \ level of 5.\n\nThere is no standard for the debug levels in Linux. Some demons\
    \ have a simple/off option, while others use a level between 0 and 9. Some demons\
    \ let you turn debugging on while the program is running by sending it SIGUSR1\
    \ and SIGUSR2 signals, and some demons read the debug level from the configuration\
    \ file.\n\nOn a project with several developers, you may want to separate debug\
    \ levels for different parts of the code so that each developer can independently\
