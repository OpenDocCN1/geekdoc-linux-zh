  md: '# A


    # RTA REFERENCE


    ![](img/a28f80056348678270f2ea0cfefd7891_312_0.png)


    Run Time Access (RTA) is a library that displays your program’s RTA’s internal
    structures and arrays as database tables. RTA uses a subset of the PostgreSQL
    protocol and is compatible with the PostgreSQL bindings for C and PHP, as well
    as for the PostgreSQL command-line tool, psql. This appendix contains the definitions,
    data structures, and function prototypes for the RTA package.


    The contents of this appendix that are taken from excerpts from the file rta.h.
    We use the exact text of rta.h wherever possible. A less technical description
    of the material in this appendix is given in Chapters 2 and 3.


    +   - Overview of RTA

    - RTA constants

    - Data structures'
