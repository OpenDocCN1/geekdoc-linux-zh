    \ thought to other ways in which you can tighten your daemon's specification.\n\
    \n# Write a Secure Daemon\n\nSecurity is only as good as the weakest link in its\
    \ chain. Designing a secure daemon is not enough. You must also write a secure\
    \ daemon.\n\n# Validate Input\n\nMany of the recent Linux vulnerabilities stem\
    \ from buffer overflows that allow an intruder to place executable code on the\
    \ stack. The most effective defense against this kind of attack is to validate\
