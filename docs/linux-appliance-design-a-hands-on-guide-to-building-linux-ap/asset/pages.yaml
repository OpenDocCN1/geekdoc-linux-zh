- img_proc: true
  md: 'The MAX-ACCESS clause in each of these objects defines how it may be used.
    We have made ladAlarmId not-accessible because we will only be using it to index
    the table to read or write the other values. Notice that ladAlarmEnable, ladAlarmLatch,
    and ladAlarmState are read-write, ladAlarmZoneName is read-only. We wanted to
    be able to use SNMP commands to enable or disable alarms, whether or not latch,
    and change alarms by setting their state to false. We felt, however, that changing
    the name of a zone is a static configuration that should be done through another
    interface, like the web interface or the CLI. LadAlarmCount is a history of the
    number of times the alarm has triggered, so we have made this read-only.


    There is nothing mandatory about the MAX-ACCESS choices we have made here. You
    might disagree with some of these choices and design your MIB differently. Like
    the SNMP display of the Zone structure in our "Goal" on page 244. Had we defined
    ladAlarmId as readable, you would see the row number at the start of each row
    before the zone name. We could also have defined the count field writable so you
    could reset it to zero periodically; this would allow you to see how many times
    the alarm has triggered over a period without saving the old value and subtract
    it from the new one. These choices belong to the designer.


    # The Traps


    Now let''s leave the Alarm Table and move on to our traps:


    ```

    ---

    LAD traps


    ladAlarm NOTIFICATION-TYPE

    OBJECTS { ladTrapZoneId, ladTrapZoneName }

    STATUS current

    DESCRIPTION

    " Trap issued when an alarm is triggered. "

    :: { ladTraps 1 }


    ladAlarmClear NOTIFICATION-TYPE

    STATUS current

    DESCRIPTION

    " Trap issued when last raised alarm returns to normal state. "

    :: { ladTraps 2 }

    ```


    We have included two traps: one to raise a red flag when an intrusion has been
    detected and the other to let you know when everything has returned to normal.
    These look a like the OBJECT-TYPE definitions above, but we use NOTIFICATION-TYPE
    for traps.'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'The OBJECTS clause in the ladAlarm trap definition tells what other information
    will accompany the trap. This is often called the varbind list, for variable bindings.
    These variables, which explain why the trap was sent, are bound to the trap when
    it is sent.


    +   - LAD Trap Info: varbind sent with traps


    ```

    ladTrapZoneId OBJECT-TYPE

    SYNTAX Integer32

    MAX-ACCESS accessible-for-notify

    STATUS current

    DESCRIPTION

    This is the ID (row number in the ladAlarmTable) of the

    zone generating the alarm.

    ::= ladTrapInfo 1

    ```


    ```

    ladTrapZoneName OBJECT-TYPE

    SYNTAX DisplayString

    MAX-ACCESS accessible-for-notify

    STATUS current

    DESCRIPTION

    This is the name of the zone generating the alarm.

    ::= ladTrapInfo 2

    ```


    These are the definitions of the objects in our varbind list. The MAX-ACCESS of
    these is set to accessible-for-notify, meaning they cannot be polled; they merely
    define the objects for the benefit of the trap receiver. These objects only meaning
    when attached to a trap.


    Early SNMP documents (RFCs) were created with concern for keeping SNMP traffic
    to a minimum to prevent burdening networks with extra traffic. Traps were intended
    to draw attention to a possible problem; we supposed to poll the device for specifics
    about what was wrong. Today, however, some network administrators use trap logs
    as a history of what''s happening on the device. They want pertinent information
    sent with the trap and the trap-receiving software.


    You''ll also need to take care that your device doesn''t become too choppy with
    its traps. Laddie is unlikely to have this problem, but if you are building an
    appliance intended to sit on a large corporate, ISP, or carrier network, you better
    consider this. If you check every minute and generate a trap each time measure
    is over an acceptable threshold, an appliance that notices an error on Friday
    night will be able to send about 3,500 traps by Monday morning, reporting all
    the problem. Any other problem from a different device will be lost in the buffer.
    You may want to just report the problem once it is first noticed, then send another
    trap to indicate when the problem is corrected.


    The argument for sending lots of traps is that SNMP is unreliable by design. We
    use UDP packets to report problems with the assumption that any problem of importance
    will be noticed more than once, so the loss of a'
  merge: -1
