    \ latched) state of\nalarm for this input. The user sets this field\nto false\
    \ to clear a latched alarm.\"\n::= { ladAlarmEntry 5 }\n\n```\nladAlarmCount OBJECT-TYPE\n\
    SYNTAX\tCounter32\nMAX-ACCESS\tread-only\nSTATUS\tcurrent\n```\n\nDESCRIPTION\n\
    \"A count of the number of times the\nalarm has triggered.\"\n::= { ladAlarmEntry\
    \ 6 }"
