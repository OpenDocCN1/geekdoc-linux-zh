    # Become the Process and Session Leader


    The Linux kernel assigns each process to a process group and to a session, both
    of which are used in the distribution of signals. In a session, all processes
    are typically started from an xterm window or from a virtual console login. In
    a process group, all the processes are started in a command-line pipe. Each process
    has only one process group that receives input from the controlling terminal;
    that process group is called the foreground group.

    For example, open an xterm or log in to a virtual console, and enter these commands:


    ```

    cat | sort uniq | tr a &

    cat | sort uniq | tr a d

    ```


    From another xterm, or the output of ps xj may appear as:


    | PPID | PGID | SID | TTY | TPGID | STAT | UID | TIME COMMAND |

    | 2501 | 2504 | 2504 | 2504 | pts/2 | S | 501 | 0:00 |

    | 2504 | 5327 | 5327 | 2504 | pts/2 | S | 501 | 0:00 |

    | 2504 | 5328 | 5328 | 2504 | pts/2 | S | 501 | 0:00 sort |

    | 2504 | 5329 | 5329 | 2504 | pts/2 | S | 501 | 0:00 uniq |

    | 2504 | 5330 | 5330 | 2504 | pts/2 | S | 501 | 0:00 tr a d |

    | 2504 | 5331 | 5331 | 2504 | pts/2 | S | 501 | 0:00 cat |

    | 2504 | 5332 | 5332 | 2504 | pts/2 | S | 501 | 0:00 sort |

    | 2504 | 5333 | 5333 | 2504 | pts/2 | S | 501 | 0:00 uniq |

    | 2504 | 5334 | 5334 | 2504 | pts/2 | S | 501 | 0:00 tr a d |


    All of the processes from the first command line will appear in a process group
    with the cat process (PID 5327 in the above example) as the process leader.

    Now look at the Process Group (PGID) column in the output of ps xj. The PID set
    to the cat command that starts the command line. The commands for the first line
    have a PGID of 5327, and all the commands for the second line have a PGID of 5331.
    The second command (②), the one you not put into the background, is the foreground
    process group for the session, so its PID (5331) is the Session Group ID (TPPGID)
    for all the processes running in'
