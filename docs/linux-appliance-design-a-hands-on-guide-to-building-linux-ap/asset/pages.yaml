  md: 'The code is broken into four files: main.c, syntax.y, token.l, and commands.c.
    The file main.c has the main() routine, which is select()-based, since the CLI
    needs to listen for both user input and log messages. The file syntax.y is a yacc
    input file that has the syntax of the CLI commands. The file token.l is a lex
    file with the definitions of the key words used in the CLI vocabulary. The file
    commands.c has the code that actually implements the commands. Both yacc and lex
    produce C files that are compiled into the binary. Entering using the following
    commands to translate, compile, and link the four source files.


    ```

    gcc -fpic -c -I. -pedantic -std=gnu9 -g -ggdb -Wall main.c -o main.o

    yacc -d -bsyntax syntax.y

    lex -itoken -I. > token.c

    gcc -fpic -c -I. -pedantic -std=gnu9 -g -ggdb -Wall token.c -o token.o

    gcc -fpic -c -I. -pedantic -std=gnu9 -g -ggdb -Wall -o syntax.tab.c syntax.tab.c

    gcc -fpic -c -I. -pedantic -std=gnu9 -g -ggdb -Wall commands.c -o commands.o

    gcc main.o syntax.tab.o commands.o -o cli -lpq

    ```


    # CLI Vocabulary: token.l


    The file token.l has a series of regular expressions which define the words in
    the vocabulary of our CLI. The lex translates the regular expressions in token.l
    into a C program, which implements a finite state machine recognizes words in
    our vocabulary.

    The form of the Laddie test is [zone id], where the zone is a number between one
    and five. Our input file, token.l, contains the following code to define both
    zone ID and the CLI verb test.


    ```

    [1-5] \t* { Zone = (int)(*yytext - ''0'');

    return(ZONE_ID); }

    test[\t]+ { return(TEST); }

    ```


    The [1-5] indicates a number in the range of one to five, inclusive. The [\t]
    indicates either a space or a tab. The * following indicates that there can be
    zero or more spaces or tabs following the zone ID. The yacc variable points to
    the command line at the start of the token, so (int)(*yytext - ''0'') is the zone
    ID as integer. The code sets the global variable Zone before returning to validate
    that valid zone ID was found.

    The lex parser [\t]+ indicates the word test followed by one or more spaces or
    tabs. At one space or tab is required to separate the test token from the zone
    ID.


    # CLI Grammar: syntax.y


    Just as a grammar defines valid sentences in a language, a grammar defined in
    the yacc file syntax.y defines valid commands in our CLI. yacc converts the grammar
    in syntax.y into a C-based state machine to recognize valid commands'
