- img_proc: true
  md: 'This chapter discusses event handling in the context of logging, but bear in
    mind that the goal is event handling, and logging is just the mechanism used to
    reach that goal.


    We''ve organized this chapter into the following sections:


    +   - R for a New Event-Handling System

    - Features and Capabilities of logmuxd

    - Configuring logmuxd

    - Examples Using logmuxd


    # Rationale for a New Event-Handling System


    We''ve found that the only code we''ve ever delivered on time and bug free was
    code we did not write. That is, our most successful projects were the ones in
    which we were most able to writing new code. New code always has bugs, and new
    code is always late. Why, did we decide to write a logging daemon to event handling?
    There are really two parts to the answer: why we chose to use logging as the mechanism,
    and why we chose not to use an existing logging system.


    Chapter 6 explains why logging is the right mechanism for event reporting. All
    events that are of interest to us are already captured, or can be easily captured
    by, syslog messages. There are syslog libraries for almost every programming language,
    and syslog is well understood, fully secure, and is both CPU and memory efficient.


    A second reason to choose for event handling is D-Bus, an open package used to
    distribute desktop events, D-Bus offers libraries and an API that allows processes
    to exchange messages, provided that both processes are D-Bus aware. (Because of
    this, legacy applications that use syslog must be rewritten to add D-Bus support.)
    However, D-Bus does not offer the same breadth of languages that syslog offers,
    and D-Bus usually requires two running daemons, which makes it relatively RAM
    and CPU intensive (compared to syslog).


    > D-Bus comes on standard Linux desktops, but it''s probably inappropriate for
    event handling on most Linux appliances.


    If syslog is the event reporting mechanism, then why not use the syslog daemon
    for event handling? The major feature that we were missing from the currently
    available logging systems was the ability to easily duplicate log messages and
    broadcast them on accepted TCP connections.


    The Ladder Alarm System needs to have Ladd to several running programs and UIs.
    Figure 7-1 illustrates a typical case. When an alarm occurs, ladd sends a log
    message to report the event. We need to send a copy of the resulting log message
    to every CLI that has logging enabled and to every web page that is looking at
    the system status. The problem is that we do not know beforehand how many of these
    interfaces are open.


    Our new logging daemon, logmuxd, solves this problem by allowing us to route messages
    to many destinations, even if those destinations are'
