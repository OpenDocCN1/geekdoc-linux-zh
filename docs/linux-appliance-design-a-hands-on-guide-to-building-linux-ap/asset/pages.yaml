  md: 'The alarm daemon uses the data lines as output and the status lines as input.
    Figure 5-6 shows a schematic for one alarm sensor. The daemon initializes the
    parallel port by setting the output pins to 0xFF, making pin 2 a high level. When
    the sensor S1 is open, no current flows through the 2K resistor R1, and the voltage
    at pin 15 is pulled high. When the sensor is closed, pin 15 is short to ground
    through pin 21.


    In other words, pin 15 is biased high when the alarm sensor is open and pulled
    low when the sensor is closed. By reading the status lines, the daemon can detect
    whether the sensor is open or closed. This description applies to all five of
    the status inputs on the parallel port.


    ![](img/a28f80056348678270f2ea0cfefd7891_92_0.png)


    Figure 5-6: A normally open alarm sensor from laddie


