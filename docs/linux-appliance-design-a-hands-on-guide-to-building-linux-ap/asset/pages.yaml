    # SELECT and UPDATE Syntax


    The next sections give a brief introduction to the two SQL commands implemented
    by the RTA APL. Neither the RTA UPDATE command nor the RTA SELECT command adhere
    strictly to their PostgreSQL equivalents. RTA does not allow JOIN clauses, and
    the WHERE clause supports only the boolean AND operator. There are no locks or
    transactions.


    # The SELECT Command


    The prototype for the RTA SELECT command is shown below.


    ```

    SELECT column_list FROM table [where_clause] [limit_clause]

    ```


    Most NCMCDLS (defined above) columns can be specified in the column_list or in
    the WHERE clause. The reserved word LIMIT restricts the number of rows returned
    to the number specified. The reserved word OFFSET skips the number of rows specified
    and begins output with the next row.

    A column_list can contain a * wild character that represents all columns), a single
    column name, or a comma-separated list of column names.

    A sample of the clause syntax is shown below:


    ```

    col_name = value [AND col_name = value ..]

    ```


    In this example, all the col_name = value pairs must match for a row to match.
    Note that you can use five other comparison operators in addition to equality.
    The list below shows the six available comparison operators.


    | Operator | Description |

    | --- | --- |

    | = | Is equal to |

    | != | Is not equal to |

    | > | Is greater than |

    | < | Is less than |

    | >= | Is greater or equal to |

    | <= | Is less than or to |


    A sample of the limit_clause syntax is shown below:


    ```

    LIMIT 5

    ```


    You will find the LIMIT and OFFSET columns to be very useful because they prevent
    a buffer overflow on the output buffer of dbcommand(). They are'
