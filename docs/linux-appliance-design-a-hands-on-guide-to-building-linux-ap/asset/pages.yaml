- img_proc: true
  md: '# # Targets


    all: clean setup config build


    clean:


    ```

    rm -rf $(BUILD_DIR)

    rm -rf /opt/snmp/*

    ```


    setup:


    ```

    tar zzvf -net-snmp-$(NETSNMP_VERSION).tar.gz; \

    mkdir $(BUILD_DIR)/agent/mibgroup/lad; \

    cp ladProject.ch $(BUILD_DIR)/agent/mibgroup/lad

    ```


    config:


    ```

    cd $(BUILD_DIR);

    export LDFLAGS="-lpq"; \

    ../configure --prefix=/opt/snmp \

    --with-mib-modules=lad/ladProject/../configure.input; \

    ```


    ```

    cd ..

    ```


    build:


    ```

    cd $(BUILD_DIR); \

    make

    ```


    install:


    ```

    cd $(BUILD_DIR); \

    install

    ```


    The changes are fairly minor. We''ve added two lines to the setup case to ① create
    the lad directory under agent/mibgroup and ② copy our ladProject header and C
    file.

    The config case ③ adds "-lpq" to LDFLAGS to the linker to include libpq for the
    PostgreSQL code used by our update and query routines. We ④ configure to include
    our MIB in the build.

    That''s it! If Net-SNMP releases new security improvements, bug fixes, or new
    features, all we have to do is drop a new source tarball into the build directory,
    change the NETSNMP_VERSION line in the Makefile, and rebuild. Each Net-SNMP has
    maintained backward compatibility since we were using it, when Net-SNMP was still
    UCD-SNMP it has been blissful easy to roll a new Net-SNMP version into new releases
    of our appliance software. For this (among other things) we are eternally grateful
    to the maintainers of UCD/NET-SNMP.

    In Chapter 14 we mentioned that our SNMP agent uses the old style, non-RTA configuration
    (that is, a config file under /etc). You may have wondered why we didn''t discuss
    how to RTA-ize the agent so we could change its configuration on the fly, as we
    can with Laddie. Well, this is the reason. We don''t want to customize the basic
    agent because that would complicate rolling in new releases as become available.
    Right now it''s simple—we don''t have changes to port the time we update, and
    all of our customizations are localized in our MIB extension.'
