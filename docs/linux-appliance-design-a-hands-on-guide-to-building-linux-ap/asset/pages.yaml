  md: '# rta_tables


    The rta_tables metadata is a collection of table definition structures. In order
    to add a table into RTA, you had to fill in a data structure with a description
    of your table. The collection of table definition structures is itself a table
    in RTA. This is one of the RTA metastables.


    ```

    # select name, address, rowlen, nrows, ncol from rta_tables;

    name | address | rowlen | nrows | ncol

    rta_tables | 0 | 40 | 5 | 10

    rta_columns | 0 | 36 | 5 | 9

    rta_dbg | 1073986432 | 48 | 1 | 8

    rta_stat | 1073988768 | 48 | 1 | 6

    ztable | 134517280 | 28 | 5 | 3

    (5 rows)

    ```


    The RTA metastables have zero in the address field because they actually an array
    of pointers, so they use an iterator function. All of the columns in the metastables
    are marked read-only, since all of the values are set from the rta_add_table()
    call.


    # rta_columns


    rta_columns metadata is a collection of column definitions. All of the column
    definitions from all of the tables are collected into the rta_columns table. (The
    table actually holds pointers to the COLDEF structures.) We can see what columns
    are in a table using the metastables and a WHERE clause.


    ```

    # SELECT table, name FROM rta_columns WHERE table = ztable;

    ztable | address

    ztable | zalarm

    table | zcount

    (3 rows)

    ```


    What do you suppose we would get if we combined the RTA metastables with PHP?
    Read on.


    # The RTA Table Editor


    The RTA package has a web/PHP-based utility called a table editor that reads the
    RTA metastables and lets you view and edit any table in the system. Figure 3-3
    show the screen that lets choose which table to view or edit. The screenshots
    in Figures 3-3, 3-4, and 3-5 were taken from our development system while we were
    working on themyapp.c application. You can see a similar screen by booting this
    book''s companion CD and using the browser on another PC to view: http://192.168.1.11/rta/rta_tables.php?port=8885.'
