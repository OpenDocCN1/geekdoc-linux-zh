- img_proc: true
  md: 'If we wanted to use a different port COM1 for our IR receiver, we would have
    provided additional arguments to the lirc_serial driver with the modprobe command.
    To specify COM2, we would have used the command modprobe lirc_serial irq=3 io=0xe2f8.
    The default irq and io values for COM3 and COM4 are (4, 0x3e8) and (3, 0xe28),
    respectively.


    # Testing the lirc_serial Driver


    Now that we''ve verified that the lirc_serial driver is loaded properly, we use
    the Laddie CD to test the IR receiver hardware we built earlier. We''ll begin
    by reviewing what we want to test.


    Recall the signal provided by our LIRC receiver looks something like Figure 12-14
    (at least in the case of a Sony TV Volume–command).


    ![](img/a28f80056348678270f2ea0cfefd7891_235_0.png)


    Figure 12-14: Waveform for the Sony TV Volume– command


    The driver of the lirc_serial kernel device driver is to measure the timing of
    spaces and pulses in this signal and provide that information via a device file.
    The particular waveform shown here complies with the Sony TV protocol, but the
    lirc_serial driver is designed to work with any protocol. The driver includes
    an interrupt handler that is invoked every time the DCD pin changes state. The
    handler uses a system timer to measure the pulses and spaces in microseconds,
    and then it emits this information via the /dev/lirc device file as a sequence
    of 32-bit words. In each word, bit 0 through 23 specify the length of the space
    or pulse in microseconds (with a maximum of 0xFFFF). Bit 24 is for a space and
    one for a pulse. Bits 25 through 31 are all zero. To test the lirc_serial device
    driver, we''d like to verify that these values are generated when we press a remote
    control button.


    Before we access the /dev/lirc device file, we need to make sure it''s not in
    use by some other process. When the Laddie CD boots, it launches the lirc daemon
    accesses /dev/lirc, we prepare for our test by killing that process.


    Execute the following commands at the Laddie appliance command prompt:


    ```

    laddie~# laddie stop

    laddie~# kill $(pidof lircd)

    ```'
