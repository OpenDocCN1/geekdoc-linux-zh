  md: '# Decoding Remote Control Waveforms


    In the previous section we introduced off-the-shelf devices that will respond
    to a remote IR signal and produce a demodulated voltage waveform. Before designing
    a circuit to take advantage of these devices, we need to decide how we decode
    that waveform. Decoding can be broken into two steps: measuring the timing of
    the pulses and spaces that comprise a waveform and interpreting this sequence
    of timings to identify the intended message. We have three options for designing
    a decoder, depending on which of these two tasks we assign to external hardware
    and we assign to the appliance''s processor. We''ll briefly discuss these three
    options before describing the approach we took for the Laddie appliance


    # Measuring and Interpreting in External Hardware


    It''s possible to build receiver hardware that performs all of the decoding tasks:
    measuring the waveform, determining the corresponding command, and then transmitting
    that command as one or more serial bytes to the appliance''s processor. 12-7 illustrates
    this approach. Here, the receiver has recognized the waveform for the Volume–
    and has produced the single ASCII character for down.


    ![](img/a28f80056348678270f2ea0cfefd7891_226_0.png)


    12-7: Decoding waveforms in external hardware


    The website http://linxtoys.org/xirc/xirc.html describes an example of this approach
    in which a preprogrammed MicroPIC microcontroller is used to decode Sony remote
    control commands and transmit characters to a serial port.


    A limitation of this approach is that the receiver supports only one remote control
    protocol. On the positive side, this approach makes it incredibly easy to add
    remote control to your appliance. Just plug in the receiver and listen for commands
    on the serial port.


    # Measuring in Hardware and Interpreting on the Appliance


    In order to accommodate any remote control protocol, we can build receiver hardware
    that measures waveforms but passes the timing information to the appliance''s
    processor for interpretation. 12-8 illustrates an approach in which the timing
    of the pulses and spaces is encoded as a series of bytes, each representing in
    50-microsecond increments.


    ![](img/a28f80056348678270f2ea0cfefd7891_226_1.png)


    12-8: Measuring waveform timing in external hardware'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'Since the appliance gives a complete representation of the input waveform,
    it can, in theory, decode waveforms for any protocol. The LIRC website provides
    a link for a protocol called Universal Infrared Remote Transceiver, second version
    (UIRT2), which works out the details of this approach. It is described at ~users.skynet.be/sky50985.


    As a related example, the Irman remote control, available at http://www.evation.com/irman/index.html,
    takes an innovative approach and encodes any remote control command "pseudo-random"
    signatures of six bytes. Irman works on the assumption that different waveforms
    from a remote will invariably have different signatures. Because this technique
    applies to any waveform, this receiver can work with any of the common remote
    control protocols, but the user has to train it to interpret the signatures it
    derives.


    As a third example, the LIRC website refers to the USB-IR-Boy project. This project
    uses the inexpensive Freescale MC68HC908JB8 microcontroller with built-in USB
    support to retrieve waveform timing values. It includes a Linux device driver
    to make these timing values available via the ~dev/usbdev device file. Information
    is available at http://usbboy/sourceforge.net.


    # Measuring and Interpreting on the Appliance


    The third approach to decoding waveforms is appealing because of its simple hardware
    requirements. All the hardware has to do is provide an infrared detector/demodulator
    and provide the signal as an input to the appliance’s processor. On the negative
    side, this method does extra demands on the processor. Specifically, the processor
    must respond to an interrupt every time the input signal transitions high or low
    in order to measure timing information. Nevertheless, because of the simple hardware
    requirements, we have chosen this approach for the Laddie appliance. In the next
    section we will work through the details of building this kind of receiver.


    # Infrared Remote Control Hardware for the Laddie Appliance


    If you''re not comfortable with building hardware, you might seek out a friend
    who is, or—is our recommendation—jump in and build it yourself. It''s a good first
    project and a satisfying one because of the new mode of control gives you for
    your Linux projects. You will certainly find the remainder of this chapter more
    educational if you have hardware to experiment with.


    To integrate our simple IR receiver with an appliance, we need two things: a power
    source for the detector/demodulator and an input that generates interrupts. The
    good news is that a serial port provides adequate power, and the output pins on
    a serial port pin Data Carrier Detect (DCD) pin interrupts. The bad news is that
    the serial port output voltages ranges from 3.7V to 12V on the positive side and
    -3.7V to -12V on the negative side. Moreover, the serial port inputs require a
    swing between these same positive and negative ranges. An IR detector, however,
    expects a clean 5V power supply (for some parts, 3.3V); it outputs a 0V to 5V
    signal (for some parts, 0V to'
