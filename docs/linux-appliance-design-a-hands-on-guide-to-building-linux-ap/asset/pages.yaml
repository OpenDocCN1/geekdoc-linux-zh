  md: "# UDP\n\nThis group includes various User Datagram Protocol (UDP) datagram\
    \ statistics.\n\n# EGP\n\nThis group contains Exterior Gateway Protocol (EGP)\
    \ statistics for those systems supporting the EGP protocol.\n\n# Transmission\n\
    \nThis group contains information related to managing transmission media.\n\n\
    # SNMP\n\nThis group includes various statistics related to the SNMP protocol,\
    \ itself.\n\n# The SMI\n\nMIBs are described using a grammar defined by the Structure\
    \ of Management Information (SMI), which is a subset of Abstract Syntax Notation\
    \ One (ASN.1). ASN.1 was created to allow description of data in a way independent\
    \ of machine architecture (for example, no assumptions about endianness or word\
    \ size). The SNMP SMI adopted a subset of the object types definable under ASN.1\
    \ and thus simplified the notation.\n\nAll you really need to know about this\
    \ is how to read and write the notation to describe a MIB. This is best accomplished\
    \ with minimal notation illustrated by examples. You can create a new MIB by cutting\
    \ and pasting from other MIBs.\n\n> We've attempted to keep our discussion of\
    \ MIBs as simple as possible. For more in-depth coverage, pick up a copy of Understanding\
    \ SNMP MIBs by David Perkins and Evan McGinnis (Prentice Hall, 1996).\n\nHere\
    \ is an example of an object definition using the grammar in the SMI:\n\n```\n\
    system OBJECT IDENTIFIER ::= { mib-2 1 }\nsysDescr OBJECT-TYPE\n    SYNTAX DisplayString\
    \ (SIZE (0..255))\n    ACCESS read-only\n    STATUS mandatory\n    DESCRIPTION\n\
    \        \"A textual description of the entity. This value\n        should include\
    \ the full name and version\n        identification of the system's hardware type,\n\
    \        software operating-system, and networking\n        software. It is mandatory\
    \ that this only contain\n        printable ASCII characters\"\n::= { system 1\
    \ }\n```"
