  md: 'To disable zone 2, type:


    ```

    UPDATE Zone SET enabled = 0 WHERE id = 2

    ```


    To find out how many times zone 4 has gone into alarm, type:


    ```

    SELECT count FROM Zone WHERE id = 4

    ```


    To clear all alarms in the system, type:


    ```

    UPDATE Zone SET alarm = 0

    ```


    Any program that can issue commands like these can function as a user interface
    for Laddie. Watch for commands like these later in the book as we go through the
    five user interfaces currently available for Laddie.


    # Ladd''s Alarm Handling


    ladd responds to an alarm by sending a log message using syslog(). The text of
    the log message depends on whether the alarm was detected by the hardware or a
    test alarm issued by a user. The text also depends on whether the alarm was set
    or cleared. For a zone with ID n and the name zone_name, the four log messages
    are:


    +   - Alarm set on zone n, zone_name

    - Alarm cleared on zone n, zone_name

    - User set alarm on zone n, zone_name

    - User cleared alarm on zone n, zone_name


    Some users do not care which zone is in; they just want to know if any zone is
    in alarm. To address this need, ladd provides two other log messages:


    +   - Alarm system status: alarm

    - Alarm system status: safe


    These messages are sent when the first zone goes into alarm and after the last
    zone is cleared. Laddie also sets all control pins on the parallel port to 1 (see
    Table 5-1) to indicate any alarm in the system. It sets the control pins low when
    all alarms are cleared.


    One nice of our overall architecture for Laddie is that ladd itself does not need
    to send signals to the UI, send email, or send SNMP traps. We leave of this to
    a separate process, greatly simplifying the design and implementation of the ladd
    daemon. The event processor) Syslog-output not only simplifies ladd, it makes
    debug and test easier too since we can easily examine the log files for the messages
    we expect and can use the logger command to generate test events for the event
    processor. The data flow for an alarm response is depicted in Figure 5-5.'
