    \ /var/run/xinet.pid\n```\n\nWhen a daemon starts, it checks to see if a pidfile\
    \ exists. If the file does not exist, the daemon creates it and writes its own\
    \ PID. If the file does exist, the daemon checks to see if the PID specified in\
    \ the file is still running. It reads the PID from the file and calls kill(0)\
    \ to send a signal to the process. If the kill(0) succeeds, it means the process\
    \ specified in the file is running and able to accept the signal, so the new daemon\
    \ can start (optionally logging the event). There is no way to atomically check\
    \ for and create a pidfile, so you have to use a Linux file lock to ensure another\
    \ instance of the daemon does not create a pidfile. The code given later in this\
    \ section illustrates how to use a file lock.\n\nAs a security precaution, you\
    \ might want to configure your appliance so that one process is not allowed to\
    \ kill() another. To do so, check for the"
