    ifInOctets             Counter32,

    ifIncastPkts           Counter32,

    ifInUCastPkts          Counter32, -- deprecated

    ifInDiscards           Counter32,

    ifInErrors             Counter32,

    ifUnknownProtos       Counter32,

    ifOutOctets            Counter32,

    ifOutcastPkts          Counter32,

    ifOutUCastPkts         Counter32, -- deprecated

    ifOutDiscards          Counter32,

    ifErrors               Counter32, -- deprecated

    ifOutQLen              Gauge32,

    ifSpecific             OBJECT IDENTIFIER -- deprecated

    ```


    Note of both ifEntry and ifEntry, initial-capped and the other not. All object
    names are with lowercase; for example, ifTable and ifEntry. Because ifEntry is
    initial-capped, we knows that it is a type, rather than an object.


    The ifType is like a struct in C; it describes the layout of each table row. The
    lowercase ifentry is a node in the OID tree beneath which the column objects will
    be defined. Thus, the description of a particular interface will have an OID like:


    ```

    ifTable.ifEntry.ifDescr.x

    ```


    where x is the row index.


    Following the definition of the entry type will be the definitions of the objects
    that make up the entry sequence. You will see this format again and again in MIB
    definitions; much MIB information is organized into tables.


    # Defining New Types


    Although the data types defined in the SMI are sufficient, it is sometimes convenient
    to be a bit more specific. For example, you may want to restrict the possible
    values in an OCTET STRING or the range covered by an Integer32 if your MIB uses
    these restricted values repeatedly, it will become tedious to describe these restrictions
    repeatedly.


    RFC 1903 describes the textual convention, a macro that allows you to bind your
    clarifications together into a new type. The following textual convention is taken
    from the file SNMPv2-TC.txt distributed with Net-SNMP (version 5.0.8).


    ```

    Displaying ::= TEXTUAL-CONVENTION

    DISPLAY-HINT "25a"

    STATUS current

    DESCRIPTION "Represents textual information taken from the NVT ASCII character
    set, as defined in pages 4, 10-11 of RFC 854.

    ```'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'To summarize RFC 854, the NVT ASCII repertoire specifies:


    +   - the use of character codes 0-127 (decimal)

    - the graphics characters (32-126) are interpreted as US ASCII

    - NUL, LF, CR, BS, HT, VT and FF have the special meanings specified in RFC 854

    - the other 25 codes have no standard interpretation

    - the sequence ''CR LF'' means newline

    - the sequence ''CR NUL'' means carriage-return

    - an ''LF'' not preceded by a ''CR'' means moving to the same column on the next
    line.

    - the sequence ''CR x'' for x other than LF or NUL is illegal. (Note that this
    also means that a string may end with ''CR LF'' or ''CR NUL'', but not with CR.)


    Any object defined using this syntax may not exceed 255 characters in length.

    SYNTAX STRING (o..255))


    This describes a type called DisplayString that can take up to 255 octets are
    restricted to those that correspond to displayable characters. The DISPLAY-hint
    shows how a DisplayString may appear. 255a means it can take the form of up to
    255 ASCII characters. RFC 1903 describes the complete syntax for the display hint.


    # Structure of a MIB File


    When you read a MIB file, you will notice that it is named and defined between
    BEGIN and END statements. It will describe what it includes from other MIB files,
    and it will name the module defined in this MIB file, the contact information
    for the person responsible for the MIB, and the revision history. Next you will
    see the definition of the objects in the MIB.


    If you look at the IF-MIB, again distributed with the Net-SNMP package, you can
    see all of these parts. The MIB is enclosed within these lines


    ```

    IF-MIB DEFINITIONS ::= BEGIN

    ```


    ```

    END

    ```


    The first section states the external dependencies.


    ```

    IMPORTS

    MODULE-IDENTITY, OBJECT-TYPE, Counter32, Gauge32, Counter64,

    Integer32, TimeTicks, mib-2,

    ```'
