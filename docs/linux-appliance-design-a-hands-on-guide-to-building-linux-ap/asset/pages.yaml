    # Example 3: logmuxd and SNMP Traps


    The Simple Network Management Protocol (SNMP) is an Internet standard that is
    used to manage network devices such as routers. The protocol commands to read
    and write values (GET and SET) as well as traps, which are its equivalent to log
    messages. Network appliances are often required to send SNMP traps when specific
    events occur. This example shows how to use logmuxd to translate syslog-log messages
    to SNMP traps. (SNMP and traps are covered in detail in later chapters, and you
    might want to delay going through this example until after reading those chapters.)


    The Lapse Alarm System sends SNMP traps when the system enters or leaves an alarm
    state. To send the SNMP traps, logmuxd uses a helper application, snmtrap. The
    snmtrap command sends SNMP traps in the same manner that logger sends syslog.


    You may recall that laced uses syslog to send log messages similar to the following
    when a zone goes into alarm.


    ```

    Alarm set on zone 2, Back Door

    User alarm on zone 3, Garage

    ```


    The snmtrap commands corresponding to the above two log messages are shown below.


    ```

    snmtrap -v2c -public snmtrap_mgr:162 '''' ladAlarm ladTrapZoneId \nni 2 ladTrapZoneName
    = "Back Door"

    smtrap -v2c -public snmtrap_mgr:162 '''' ladTestAlarm ladTrapZoneId \

    i 3 ladTrapZoneName = "Garage"

    ```'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'In the above lines, public is the community name, and it comes from the SnmpDest
    table since it is specific to the destination. The same is true for snmp_mgr:162,
    which is the destination name (or IP address) and the port number used by snmptrap.
    If the type of SNMPDest is set to 3, a -c is added to the command, making it an
    SNMP version 2 info. The SNMP fields for destination name, port, community string,
    and type of trap should all appear in your UI, since the end user must configure
    with these values that match the end user''s installation.


    You can use the name of the trap if your MIB is installed and accessible to the
    snmptrap command. If the MIB is not installed, you need to pull the full, numeric
    object ID (OID) of the trap on the command line. The two single quotes in the
    command line tell snmptrap to send the current uptime in the trap. Be sure to
    read the main page for snmptrap to learn more about the command and its options.
    The SNMP chapters in this book will answer many of your questions regarding SNMP
    and its event notification system, traps.


    Information about the SNMP server comes from user information entered into the
    SnmpDest table. Some information for the traps must be extracted from the log
    messages. For example, to send our SNMP traps, you need to translate these:


    Alarm set on zone 2, Back Door

    User set on zone 3, Garage


    into these:


    ```

    ladAlarmTrapZoneId 2 1ladTrapZoneName "Back Door"

    TestAlarm ladTrapZoneId 3 3ladTrapZoneName "Garage"

    ```


    This is where regex pattern matching and rewriting come into play. Using the regex
    patterns in the train station example above, you have everything to fill in the
    tables.


    The destination type 9 indicates an SNMP destination, and the name we have given
    this destination is snmp_monitor. We need two rows for the "User set" message
    and another for the "Alarm set" messages generated by real alarms. We use Filters
    1 and 2 so that we don''t overwrite 0, which was used in the previous example.
    We show the configuration using SQL, but the table editor would work just as well.


    ```

    UPDATE Filters set destype = 9 LIMIT 1 OFFSET 1;

    UPDATE Filters destname = "snmp_monitor" LIMIT 1 OFFSET 1;

    UPDATE Filters regex = "User set on alarm zone ([1-5]), (.*)"

    LIMIT 1 OFFSET 1;

    UPDATE Filters rewrite = "ladTestAlarmTrapZoneId 1%%s\nladTrapZoneName ''%%%s''
    LIMIT 1 OFFSET 1;

    ```


    If the SNMP GET and SET commands correspond to the SQL SELECT and UPDATE commands,
    the SNMP Management Information Base (MIB) corresponds to a database table.


    Laddie Event Handling

