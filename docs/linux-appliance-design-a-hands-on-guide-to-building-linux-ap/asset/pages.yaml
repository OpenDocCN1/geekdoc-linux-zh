    As discussed in the previous chapter, Laddie''s framebuffer interface

    is built on the Simple DirectMedia Layer (SDL) library. Since SDL includes

    its own event handler which, in particular, handles keyboard presses, it was

    simple to incorporate remote controls. We created a separate

    Handler() thread to read commands from the /dev/lirc socket, parse

    commands, and then push appropriate keyboard events into the SDL

    event queue. Specifically, we responded to the Channel +/- and Volume+/

    remote control commands by simulating the SDL keypress events for the Up,

    Down, Right, and Left arrow keys, respectively. We responded to the remote

    control Power command with the SDL Enter keypress event. In Laddie''s SDL

