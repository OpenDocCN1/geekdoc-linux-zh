  md: 'The part of the tree that we''re most interested in is under .1.3.6.1(iso.dod.internet).
    Beneath this node are the mgmt-mib-2 (.1.3.6.1.2) subtree and the private.enter
    (.1.3.6.1.4) subtree. MIB-2 is the common set of objects that we mentioned earlier;
    it is supported by all networked devices that are manageable by SNMP. The enterprises
    OID is where organizations register their private MIBs. (For more on this, see
    Chapter 14.)


    # MIB-2


    MIB-2, defined in RFC 1213, describes a core set of information that is helpful
    for managing networked devices. MIB-2 is organized into the ten groups shown below.
    Not all groups are supported on all networked devices, but you can generally expect
    to find most of them.


    # System


    This group contains objects such as sysDesc (a printable description of the operating
    system, hardware, networking software, etc.), sysContact (typically the email
    address of the person administering this system), sysLocation (a printable description
    of where the system is located), and ObjectID (an OID that can be used to determine
    the type of device).


    # Interfaces


    This group is a table describing the network interfaces available on the system.
    The interfaces table contains information on the speed of each interface and the
    activity on the interface (octets in and out). By polling the in and out octets
    periodically, you can tell what percent of the bandwidth in the interface is being
    used. This can help you monitor the capacity of routers in a network.


    # AT


    This is the Address Translation group. MIB-2 deprecates this group and includes
    it only for compatibility with devices implementing MIB-1. You should ignore this
    group unless you have a particular interest in SNMP history.


    # IP


    This group includes information related to the IP (network) layer, including ipAddrTable
    (IP Address Table), which describes the IP address of the interfaces available
    on the system.


    # ICMP


    This group includes various Internet Control Message Protocol (ICMP) statistics.


    # TCP


    This group includes TCP layer statistics, including the tcpConnTable (TCP Connection
    Table) describing the current TCP connections between this and other systems in
    the network. Once you have the address of this system, you can find out the addresses
    of other systems that are in contact with.


    > 1 Network Working Group, Request For Comments: 1213. Management Information
    Base for Network Management of TCP/IP-based networks: MIB-II. K. McClgothie and
    M. Rose, March 1991.


    Review of SNMP 313'
