- img_proc: true
  md: '# SELECT


    The SELECT statement reads values out of a table. The syntax for the RTA SELECT
    statement is:


    SELECT column_list FROM table [where_clause] [limit_clause]


    The column_list is a comma-separated list of column names or a asterisk (*) to
    retrieve all columns. The variable table is the name of the table you wish to
    examine. The where_clause specifies which rows to return, and the limit_clause
    tells how many rows to return. Here are some simple examples.


    ```

    SELECT * FROM ztable

    select * from ztable

    select zcount, zname FROM ztable

    ```


    You can select the columns in any order, and you can ask for the same column more
    than once.


    NOTE The SQL parser recognizes the SQL reserved words in both upper- and lowercase
    letters. We use uppercase in our examples to make the reserved words more visible.


    Also, SQL does not require a semicolon at the end of the line, but the psql command
    line tool does.


    # UPDATE


    The UPDATE statement writes values into a table. The syntax for the RTA UPDATE
    statement is:


    UPDATE table SET update_list [where_clause] [limit_clause]


    The update_list is a comma-separated list of value assignments in the following
    format:


    ```

    column_name = value[], column_name = value...]

    ```


    In the example above, value is a literal value. Let''s look at some more examples.


    ```

    UPDATE ztable zalarm zalarm = 44

    UPDATE ztable zalarm zname = 0, zname = Terminator

    UPDATE ztable zalarm zalarm = 1, zname = "Mr. Terminator"

    ```


    Strings with spaces must be enclosed in single or double quotes. One kind of quote
    can be enclosed in the other kind of quote.


    ```

    UPDATE ztable SET zname = "Baker''s Pride"

    UPDATE ztable SET zname = ''Just say "no"''

    ```'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# WHERE


    A WHERE clause specifies which rows to select or update, based on the data

    in the rows. WHERE might be the single biggest reason to use SQL. The

    form of the WHERE clause is:


    ```

    col_name rel_op_value [AND col_name_rel_op_value ...]

    ```


    The supported comparison operators are equality, inequality, greater

    than, less, greater than or equal to, and less than or equal to. Only

    logical AND is available to link column comparisons, and value must refer

    to a literal. For example:


    ```

    SELECT * ztable zalarm != 0

    UPDATE ztable zalarm = 1 WHERE zname = "Front Door"

    ```


    # LIMIT


    The LIMIT clause can limit the number of rows selected to limit rows, and

    can specify that the first OFFSET rows are ignored. The form of the LIMIT

    clause is:


    ```

    [LIMIT [OFFSET offset]]

    ```


    Normal SQL does not support the idea of "give me only the third row,\nbut this
    functionality is important if you''re trying to manage an enabled

    application. The LIMIT and OFFSET clauses let you specify exactly how

    many rows should be returned and how many candidates to ignore

    before starting to read or the rows. If there is a WHERE clause, the offset

    and limit only to the rows that match the WHERE conditions.

    example:


    ```

    UPDATE ztable zname = "Front Door" LIMIT 2

    UPDATE ztable zname = "Back Door" LIMIT 3 OFFSET 2

    UPDATE ztable zalarm = 1 LIMIT 2 OFFSET 1

    SELECT zname FROM ztable LIMIT 4

    UPDATE ztable zname = "Garage" LIMIT 1 OFFSET 2

    SELECT * FROM WHERE ztable zalarm = 1 LIMIT 1

    ```


    A way to step through a table row at a time is to LIMIT to 1 and incre-

    ment OFFSET from 0 up to one less than the number of rows.


    You remember that we said that we stored RTA_DISKAVES columns in

    save given in the table definition, and that we wanted to store the

    configuration as SQL commands so we could run it through the SQL

    parser. You can see a good example of the LIMIT clause and of save files

    looking at /tmp/zsave.sql.'
