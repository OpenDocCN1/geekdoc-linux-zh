  md: "+   * The poll_alarm() subroutine also maintains a global alarm variable,\n\
    GlobalAlarm, which is set to zero if any zone is in alarm condition\\and is set\
    \ to zero if all zones are safe. The subroutines tracks this when\nGlobalAlarm\
    \ changes states. When the GlobalAlarm variable is set,\nthe control pins of the\
