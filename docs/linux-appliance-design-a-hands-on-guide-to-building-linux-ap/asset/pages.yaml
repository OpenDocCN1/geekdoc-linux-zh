  md: 'This is where we anchor the LAD-MIB we''ll be defining in the next section.


    ```

    -- Products are registered here:

    laddieProducts OBJECT IDENTIFIER ::= { laddieGroup 2 }

    laddieAppliance OBJECT IDENTIFIER ::= { laddieProducts 1 }

    ```


    The LaddieProducts section is where we defined the OIDs that identify our products
    (or entire product lines, if you''re thinking really big). We have defined an
    OID for our Laddie appliance, and we''re setting sysObjectID in MIB-2 with an
    SNMP utility snmpget to determine that this box is a Laddie appliance. Large corporations
    may put the OIDs that identify all their products into a single file. Cisco, for
    example, has a CISCO-PRODUCTS file where it gathers all these OIDs. For now, Laddie
    only has a single product OID, so we won''t have to go through this.


    END


    Here''s that we were looking for. This is the end of the LADDIE-SMI-txt file and
    wraps our discussion of it.


    # Creating the LAD-MIB


    In this section, we will create our appliance MIB. Refer to the illustration of
    the LAD-MIB structure in Figure 14-2 for a better idea of how the MIB components
    interrelate. It may be helpful to refer to this picture as you follow along with
    the development of the MIB file.


    The LAD-MIB is divided into three main sections:


    +   - LaddTraps, containing definitions of traps

    - LaddieInfo, containing definitions of information objects in traps

    - laddSystem, containing definitions of pollable objects


    Let''s start the detailed walk-through. Again, we''ll be showing one or more lines
    by a discussion of what we''ve shown.

    We''ll start with the BEGIN statement and the definition of our MIB name:


    ```

    LAD-MIB DEFINITIONS ::= BEGIN

    ```


    Hopefully this looks familiar. If not, take another look at the beginning of the
    LADDIE-GROUP-SMI.txt file. The BEGIN line says we are starting the definition
    of the LAD-MIB, which is the name we gave the MIB for our appliance.


    > You can find sysObjectID defined in the SNMPv2-MIB.txt file, which is included
    with the SNMP package.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '![](img/a28f80056348678270f2ea0cfefd7891_273_0.png)


    Figure 14-2: LAD-MIB Structure


    Next, we''ll import the externally defined types and macros that we will be using
    from other files:


    ```

    IMPORTS


    NOTIFICATION-TYPE,

    MODULE-IDENTITY,

    OBJECT-TYPE,

    Counter32,

    Integer32,

    Gauge32

    FROM SNMPv2-SMI

    DisplayString,

    TrutValue

    FROM SNMPv2-TC

    laddieMgmt

    FROM LADDIE-GROUP-SMI

    ```


    The first set comes from SNMPv2-SMI just like the LADDIE-GROUP-SMI.txt file we
    covered in the previous section.

    The next set comes fromvv2-TC. The letters TC stand for textual conventions. SNMPv2-TC
    is basically a type that defines, commonly used object types.

    The third laddieMgmt OID from the LADDIE-GROUP-SMI.txt file will be our starting
    point in the overall namespace for our appliance MIB. We''ll use laddieMgmt as
    our link to the overall namespace by defining the module in this group below laddieMgmt
    in the code portion of the "Module Definition" section next.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'The SNMPv2-SMI and SNMPv2-TC MIB definitions are supplied with the Net-SNMP
    package. When you installed Net-SNMP on your system in the Chapter 13, these files
    were probably put into /usr/share/snmp/mibs or /usr/local/share/snmp/mibs. Look
    for the files SNMPv2-TC.txt.


    # Module Definition


    We start by defining a module, ladProject, to contain our appliance MIB. This
    is where we put the copyright, revision history, contact information, and a general
    description of what the module contains.


    ```

    ladProject MODULE-IDENTITY

    LAST-UPDATED "200505280000Z"

    ORGANIZATION "The Laddie Group"

    CONTACT-INFO

    "Here we put contact information."

    ```


    DESCRIPTION


    "The LAD MIB."


    This MIB module specifies the pollable and set-able objects in the Linux Appliance
    Design demonstration application: an alarm system monitor. This MIB also describes
    traps associated with this demo appliance.


    +   REVISION "200505280000Z"

    DESCRIPTION

    " 1.1 - Traps added along trapInfo section.


    +   REVISION "2005052220000Z"

    DESCRIPTION

    " 1.0 - Initial Document."


    ```

    := { laddieMgmt 1 }

    ```


    The MODULE-IDENTITY section is like one sentence long. The first and last lines,
    taken together, say that ladProject is a module defined below in the namespace
    and its OID is laddieMgmt.1. Here’s the OID


    .1.3.6.1.4.1.3382.1


    The rest of the MODULE-IDENTITY section should be fairly clear after our discussion
    of the LADDIE-SMI in the previous section. You may notice that we have two REVISION
    clauses listed at lines 1 and 2. If you make changes to'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'your MIB in the feature, you will need to add revision clauses to explain what
    you did. The convention is to keep revision clauses in reverse-chronological order
    (that is, the most recent change appears at the top). This does not mean you should
    feel free to make any changes you want to your MIB; you will just be creating
    confusion for your customers if you change anything (names, OIDs, and so on) that
    is already defined in your MIB. You may find it necessary to enhance your MIB
    with new information required by customer demand or help manage new features that
    will be adding to your appliance. You may add new structure, but do not change
    existing structure!


    Clearly your LAST-UPDATED time stamp will match that of your most recent revision
    clause, as ours does.


    The next set of lines defines the sections we will be flushed out:


    ```

    -- top level MIB headings of the LAD MIB

    @ladTraps OBJECT IDENTIFIER ::= { ladProject 0 }

    ladSystem OBJECT IDENTIFIER ::= { ladProject 1 }

    @ladTrapInfo OBJECT IDENTIFIER ::= { ladProject 2 }

    ```


    Putting all of the section heading OIDs together at the top, as we have done here,
    is a stylistic choice which we feel can help communicate the structure of the
    rest of the MIB. We''re making it clear that there will be a section for defining
    traps, one for system information (where we will be putting our Alarm Table),
    and another section for the non-pollable information we will only send with traps.


    Numbering in SNMP usually begins with 1, not zero, but you may have noticed that
    we gave ① the traps section above the OID of ladProjecto. Our reason for doing
    this dates back to the early days of SNMP2 (SNMP version 2), when compatibility
    with SNMPv1 (SNMP version 1) was being crafted. For more details, you may want
    to read RFC 1908: Coexistence Version 1 and Version 2 of the Internet-Standard
    Network Management Framework.


    We''ll continue our review of our MIB with the ladSystem section and leave the
    traps for later. That will allow us to immediately follow our discussion of the
    trap with ladTrapInfo section.


    ```

    -- LAD System Information

    ladSystemScalars OBJECT IDENTIFIER ::= { ladSystem 1 }

    ladSystemTables OBJECT IDENTIFIER ::= { ladSystem 2 }

    ```


    We further subdivide the ladSystem section into section for scalars and another
    for tables. Scalars are just objects that are not columns in tables. Experience
    has taught us to keep scalars and tables separate to avoid having scalars sprinkled
    around tables as the MIB evolves over time.


    252 Chapter 14'
  merge: -1
  pgno: 275
- img_proc: true
  md: "# Version and Number of Zones\n\nNext, we'll define some scalars in our ladSystemScalars\
    \ section.\n\n+   - LAD System Scalars\n\n```\nladVersion OBJECT-TYPE\nSYNTAX\
    \      DisplayString\nMAX-ACCESS  read-only\nSTATUS      current\nDESCRIPTION\n\
    \    \"This string represents the version of the LAD Alarm\nappliance software.\"\
    \n:: { ladSystemScalars 1 }\n```\n\n```\nladNumberOfZones OBJECT-TYPE\nSYNTAX\
    \      Integer32 (1..128)\nMAX-ACCESS  read-only\nSTATUS      current\n```\n\n\
    ```\nDESCRIPTION\n    \"The number of alarm zones, therefore the number of rows\n\
    in the ladAlarmTable.\"\n:: { ladSystemScalars 2 }\n```\n\nHere we define two\
    \ objects (note the OBJECT-TYPE keyword): ladVersion and ladNumberOfZones. The\
    \ SYNTAX clause tells us that ladVersion is a DisplayString, meaning it is a string\
    \ of printable) characters, and ladNumberOfZones is a 32-bit integer with values\
    \ ranging from 1 through 128. If you refer back to our IMPORT section at the start\
    \ of this MIB, you will see that both of these syntaxes were imported from SNMPv2-TC,\
    \ the contextual forms.\n\nThe MAX-ACCESS clause tells us that each of these objects\
    \ is read-only. Some objects we will encounter in this MIB will have read-write,\
    \ not-accessible, or accessible-for-notify access. Read-write just means you can\
    \ read as well as write a new value. You can't read or write objects defined as\
    \ not-accessible, but you might use one as an index into table. Accessible-for-notify\
    \ is how we define information sent with a trap that is otherwise not polarizable.\n\
    \nOne point to keep in mind is that the MAX-ACCESS clause defines maximum access,\
    \ not actual access. You will never be able to write an object that has max-access\
    \ read-only, but you may not be able to write to an object whose max-access is\
    \ read-write, either. The ability to write to the object may be restricted by\
    \ other factors. For example, in Net-SNMP, you may not write to any object that\
    \ has a value set in the snmpd.conf file, regardless of what the MAX-ACCESS clause\
    \ indicates in the MIB file.\n\nDesigning on SNMP MIB 253"
