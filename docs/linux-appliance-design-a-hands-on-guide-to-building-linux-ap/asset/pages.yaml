  md: "break in. As a security precaution, some daemons refuse to run if they cannot\
    \ open and load a configuration file.\n\nSince the configuration file is often\
    \ specified on the command line, your program may need to make two passes through\
    \ it: one to get the configuration file and a second time to parse the command\
    \ line after the configuration file has been loaded. Parameters on the command\
    \ line are often used when debugging, so their values override those in the configuration\
    \ file.\n\nMake your program does a sanity check by verifying the consistency\
    \ of the configuration and that it reports errors or exits if any problems are\
    \ found.\n\n# Go into the Background\n\nOnce the configuration is loaded, the\
    \ next step is for the process to (optionally) go into the background, where it\
    \ can detach itself from the controlling terminal. This is achieved by calling\
    \ the fork() function to create a child process. The parent should exit after\
    \ the fork.\n\nIn order to go into the background, the child process closes the\
    \ file descriptors of the controlling terminal. The result is that we have a background\
    \ process that is not attached to a controlling terminal.\n\nYour code might look\
    \ like this example in which the parent forks and exits, leaving the child process\
    \ to continue setting up the daemon:\n\n```\npid_t dpid;                     \
    \           //daemon PID\ndpid = fork();\nif (dpid < 0)                      \
    \       // Error?\n\t\texit(-1);\nif (dpid > 0)                             //\
    \ Parent?\n\t\texit(0);\nwe are the child and continue setting up the daemon\n\
    ```\n\nThere are two times when you should not send your process into the background:\
    \ when debugging (since you want your terminal to remain the controlling terminal\
    \ for the program so that you can see diagnostic messages and can kill the program\
    \ if you need to), and when you want to automatically respawn your program if\
    \ it dies. In the latter case, the daemon should remain in the foreground so that\
    \ the parent process will receive control when the daemon exits (whether gracefully\
    \ or due to some error).\n\nThe following example shell script shows how you can\
    \ automatically respawn a daemon.\n\n```\n#!/bin/sh\nwhile true\nd\n\tmydaemon\n\
    \t\tlogger \"Restarting mydaemon\"\ndone\n```"
