  md: '# 4


    # # BUILDING AND SECURING

    # DAEMONS


    ![](img/a28f80056348678270f2ea0cfefd7891_66_0.png)


    At the heart of almost all Linux appliances is one or more daemons, the background
    programs that provide a network or system service. You can get an idea of the
    daemons available on your Linux system by looking in the /etc/rc.d/init.d directory
    or by using the ps ax command to show the daemons you have running on your system.


    The term daemon refers to a program that runs in the background without a controlling
    terminal. Daemons also run in their own process group in order to avoid inadvertently
    receiving signals meant for other processes. A daemon usually redirects input,
    output, and error to /dev/null or to a log file. Many daemons use a Process ID
    file (or pidfile) to enforce mutual exclusion to to a resource; this prevents
    more than one copy of the daemon from running at the same time.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'This chapter shows you how to build and secure the daemons you''ll be using
    in your appliances. It''s divided into three main sections.


    +   - How to Build a Daemon

    - How to Secure a Daemon

    - A Prototype Daemon


    # # How to Build a Daemon


    This section shows you how to build a daemon and offers a brief explanation of
    why each step is needed. Your application may not require all of the steps listed,
    and you may need to do them in a different order to meet your needs, but this
    will give you a general idea, nonetheless.


    +   1. Load the configuration.

    2. Go into the background.

    3. Become the process and session leader.

    4. Set the working directory.

    5. Redirect stdin, stdout, and stderr.

    6. Set up logging.

    7. Set group IDs and user IDs.

    8. Check for a pidfile.

    9. Set the mask.

    10. Set up signal handlers.


    > > The sample daemon presented later in this chapter includes code for each of
    these steps. Some of the following sections use code taken from the sample daemon.


    # Load the Daemon''s Configuration


    When a daemon starts, it needs to load a set of parameters that govern its operation.
    This usually means parsing options on the command line and reading settings from
    a configuration file.


    The command line used to start the daemon often contains entries such as the location
    of the configuration file, the user and group IDs to use when running, whether
    or not the program should become a daemon or stay as a foreground process. Some
    deemons you let specify the daemon''s working directory as whether or not to do
    a chroot() before starting.


    There is a precedence to the configuration information. Specifically, compiled-in
    values are always loaded first, they are loaded when the program starts. Next,
    the configuration values from the configuration file are loaded, overwriting the
    compiled-in values. Finally, the values from the command line are loaded, overwriting
    the values from the configuration file.


    Compiled-in values should focus more on security than functionality, as an attacker
    might delete or modify the configuration file as part of a'
