  md: '# Chroot if Possible


    One of the oldest and most trusted techniques to limit damage in case of a breach
    is to run a daemon in a chroot jail. The idea is to put all of the files that
    your daemon will need in a directory subtree and to tell your daemon that the
    top of the subtree is the "root" of the filesystem. The system calls chroot(),
    and it is a good way to make the rest of the real filesystem invisible if your
    daemon is breached.


    It is fairly easy for a process owned by root to break out of a chroot jail, so
    be sure to drop root privileges after the chroot() call. A typical sequence of
    calls to build a chroot jail looks like this:


    ```

    chdir("/var/app_jail")

    chroot("/var/app_jail")

    setuid(500);

    ```


    Following the chroot() call, the application will be able to see only the files
    and directories under the directory specified in the chroot() call. You will need
    to close file descriptors to directories outside of the chroot jail, since they
    can provide a mean to break out of the jail.


    The trick in building a successful chroot jail is in limiting the number of files
    and devices in the jail. Of course you will need all of your daemon''s working
    files, but not include the startup directory if it contains, where to locate the
    chroot jail. If your program is dynamically linked, you will need to include a
    /lib directory and whatever shared object libraries your program uses. Considering
    a static build of your application to avoid the necessity of adding the /lib directory.


    The standard logging routine, syslog(), assumes access to a Unix socket at /dev/log.
    Create a /dev directory in your jail and tell the system logging daemon, syslog,
    to listen on an additional socket using the -a command line option. Here is an
    example of how to start syslog so that it listens on an additional socket:


    ```

    syslog -a /var/app_jail/dev/log

    ```


    A common alternative to a chroot jail is a virtual machine. Programs such as VMware,
    VServer, and User-mode Linux provide more isolation than a chroot jail but at
    the cost of higher memory or CPU requirements.


