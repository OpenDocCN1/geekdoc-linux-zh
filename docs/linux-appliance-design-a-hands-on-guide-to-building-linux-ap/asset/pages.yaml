  md: '# Summary


    In this chapter, we have discussed the development of web UIs for Linux-based
    appliances, in particular, the web UI for Laddie. It has not been our goal to
    discuss all of web technology—you will find entire books on that subject.


    This chapter highlighted the pertinent features of Laddie''s web UI:


    +   * The web UI degrades gracefully for browsers that don''t support JavaScript
    so that the web UI functionality is accessible to a wide variety of browsers.

    * The alarm status page updates automatically whenever there is a change in the
    alarm status on the appliance:

    * When an alarm is triggered, each browser viewing the status page is refreshed
    automatically.

    * When any browser is used to clear an alarm, the change is reflected on all other
    browsers.


    After implementing the web UI, we looked back at our design and suggested some
    future improvements. In particular, we suggested that the logic for configuring
    network interfaces should be moved from PHP into the network daemon, networkd.
    This restructuring would have the advantage that other UIs, for example the CLI,
    could configure network interfaces without duplicating the complex logic in PHP.
    Other improvements include restructuring the menu system and adding JavaScript
    error-checking functions.'
