    MIB files reside in /opt/snmp/share/snmp/mibs. They are not strictly necessary
    for the appliance, but there are reasons we may want to include them. First, we
    may want to simplify creation of the files used to send traps (see the example
    on logmuxd and SNMP traps in Chapter 7). Second, we may want to deliver them on
    the appliance for use by the customer''s network management software.


    If we want to use the human-readable names for numeric object identifiers (OIDs)
    in logmuxd filters, we will have to tell the snmtrap command to find these MIB
    files. We can either add these options to the command line used to invoke snmtrap:


    ```

    -M ALL /opt/snmp/share/snmp/mibs

    ```


    or make export environment variables available to it:


    ```

    export MIB-ALL

    export MIBDIRS=/opt/snmp/share/snmp/mibs

    ```


    This tells the SNMP commands (snmpget, snmpset, snmpwalk, snmtrap, and so on)
    to use all the MIB files found in the /opt/snmp/share/snmp/mibs directory.


    Although you may be removing things from this staging area before installing the
    software on your appliance, let''s not do that yet. We''ll need some of what there
    is for creating MIB extension. In fact, you should add /opt/snmp/bin to your environment
    variable, like so:


    ```

    export PATH=/opt/snmp/bin:$PATH

    ```


    Now it''s time to move and create the agent extension and implement the MIB.


    # The MIB Skeleton: mib2c


