- img_proc: true
  md: 'Fortunately, the LIRC package includes a utility, mode2, that does understand
    the output of the lirc_serial driver and can display it as pulse and space timing
    data.


    Press CTRL-C to terminate the previous command, and execute the following one:


    ```

    laddie:# mode2

    ```


    Now point an IR remote control at the receiver while pressing buttons. The command
    mode2 reads the output of /dev/lirc, parses the 23-bit timing data and the one-bit
    pulse or space indicator, and produces a stream of pulse and space timing information.
    As an example, we observed the following train of space and pulse timings from
    we stimulated our IR receiver with a single TV Volume–command.


    ```

    laddie:-# mode2 space 5668 pulse 1265

    space 5794213 pulse 663 space 517

    pulse 2471 space 494 space 663

    space 496 space 1260 space 516

    pulse 1282 space 497 pulse 633

    space 546 pulse 685 space 546

    pulse 1263 space 518 space 639

    space 517 space 661 space 496

    pulse 611 space 515 space 682

    ```


    If you refer to "Protocols for Encoding Remote Commands" on page 198, you will
    notice that these timing values are noisier than the idealized waveform would
    suggest. The first pulse is roughly 2,500 milliseconds and corresponds to the
    header. The other pulses are roughly 1,300 or 650 milliseconds, corresponding
    to ones and zeros. The spaces are roughly 500 milliseconds, but the large initial
    value corresponding to the time between button presses. It is the job of the lired
    daemon to reject the pulses that do not correspond to valid waveforms and to correctly
    interpret the ones that do. When finished experimenting with mode2, press CTRL-C
    to terminate the utility.


    At this point, we have established that the lirc_serial device driver is the lired
    daemon. In the next section we will provide instructions on configuring the lired
    daemon, which will use the output of this device driver.


    If you would like to write a program that uses the output of the lirc_serial device
    driver directly, the source code for the mode2 utility provides an example of
    how to access the /dev/lirc device file. This source is available from http://www.lirc.org
    and is also provided in the lirc-0.8.1.tar.bz tarball in the /usr/src/packages/
    directory of this book''s companion CD.


    Chapter 12'
