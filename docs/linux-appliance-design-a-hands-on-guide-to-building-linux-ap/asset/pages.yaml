  md: 'You may have noticed that we did not include the id, edge, and input columns
    in our SNMP view of this table. This was not an oversight. It is up to the MIB
    designer (or any interface designer, for that matter) to decide what makes sense
    in light of the intended use of the interface. In our case, we decided the edge
    and input information was too hardware specific to be necessary in this interface.
    The id column is not returned by our SNMP agent, but will be used as an index
    the alarm table whenever access to a specific row is necessary.


    # Your Enterprise Number


    Now that your interest is piqued, we''ll build suspense by taking a little detour
    for those of you actually in the process of starting a small company to tell your
    appliance. You may remember the brief discussion about enterprise numbers in the
    last chapter when we were identifying a printer using SNMP. Every MIB needs to
    be anchored to the overall namespace, and if you are designing a private MIB,
    you need an enterprise number of your own. These are assigned by IANA (Internet
    Assigned Numbers Authority). Each company or organization only needs one enterprise
    number IANA grants the authority to manage the tree beneath your number.


    Obtaining an enterprise number from IANA may take a while, so you should get the
    ball rolling. Once you apply, IANA will tell you the process to take about a month.
    You can design and implement your MIB while IANA is processing your request.


    The process is pretty easy. Just use your favorite web browser to navigate to
    the IANA website (http://www.iana.org) and click Application Forms in the menu.
    On the next page, select Private Enterprise Numbers (SNMP). You will be presented
    with an online form to fill out.


    At the bottom of the web page, there''s a link to the current list of registered
    numbers. You might want to check it out to see who''s on the list. You will notice
    some pretty recognizable names near the beginning; companies have been in the
    SNMP game since the beginning; IBM''s is 2. Cisco has 9. Hewlett Packard has 11.
    You can scroll down to the bottom to see what the current high number is. You
    might also recognize entry 23528. It is the start of the subtree where we will
    anchor the Laddie MIB we will develop in this chapter.


    When you start your application, you will be asked to provide the following information:


    +   * Your company and organization name

    * The company''s address

    * The company''s phone number

    * The name of the contact person

    * The contact person''s address

    * The contact person''s phone number

    * The contact person''s email address

    * A fax number'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'As you may have noticed when looking at the current list, only the enterprise
    number, company name, contact person''s name, and contact''s email address are
    listed online. It''s a good idea to use something other than your general email
    address here, since it''s likely that spambots will harvest it. it''s handy to
    use a separate address for this purpose, something generic you can forward to
    whoever is responsible for your SNMP work in the future.


    Just enter your information in the form and click the Submit button.


    # ## MIB Files


    IANA grants you the authority to manage your own subtree, but it''s up to you
    to do a good job of it. Plan for success and don''t think of this appliance as
    the end of the line—leave room for expansion. You might want to define your enterprise
    number in a separate file where you can put information common to all MIBs. (By
    the way, reading other people''s MIBs is a very good idea. You''ll find out what
    is common usage and may pick up styles you find attractive the way.)


    Here are the two files we''ll be creating in this chapter:


    LADDIE-GROUP- SMI.txt


    This is the file where we''ll define the Laddie enterprise number and our product
    identification OIDs.¹


    LADDIE-MIB.txt


    This file will hold the Laddie MIB. This MIB will be anchored over an OID defined
    in the LADDIE-GROUP-SMI.txt file.


    We''ll run these files through a utility supplied by Net-SNMP to produce skeleton
    code for our MIB implementation. You also want these files on any system that
    is running the management applications (snmpget, snmpset, snmpwalk, and so on)
    or interpreting traps and informs.


    The network management system you are using define where to place these files.
    The Net-SNMP management applications intend to want them in the directory /usr/local/share/snmp/mibs,
    though you can modify this, and it''s subject to the preferences of the OS distribution
    you are using. For our appliance we will place them in /opt/snmp/share/snmp.


    # ## LADDIE-GROUP-SMI


    This is the file that describes the top-level structure we will be using to organize
    our Laddie enterprise subtree. It holds our enterprise number and product identification
    OID. This file is small, so let''s look at the whole thing and then discuss its
    structure. (The address, phone number, and fax number are bogus to protect Bob''s
    privacy, but you''ll get the general idea.)


    > ¹OIDs used to identify products are returned as the value of sysObjectId in
    MIB-2.'
