  mdcn: "\n## 安装 Linux 在虚拟环境中\n\n## 步骤 5\n\n点击“创建”后弹出的窗口询问您想要创建何种类型的虚拟硬盘。我们在此使用默认的\
    \ VDI（VirtualBox 磁盘映像）格式，因为其他格式通常用于在不同虚拟机软件之间迁移虚拟机。请确保选择 VDI 并点击“下一步”。\n\n![](img/f80199d101da92d953f18eaa6205b48e_26_0.png)\n\
    \n## 步骤 8\n\n点击“创建”后，虚拟机的初始设置即完成；您现在应能在 VirtualBox 应用程序中看到新建的虚拟机。在此之前，请点击“设置”按钮，在“常规”部分点击“高级”选项卡。使用下拉菜单，分别为“共享剪贴板”和“拖放”选择“双向”。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_26_1.png)\n\n## 步骤 6\n\n是否选择“动态”或“固定”大小的虚拟硬盘可能对新手来说有些令人困惑。动态分配的虚拟硬盘是一种更灵活的存储管理方式，初始时不会占用您的物理硬盘太多空间。请确保选择“动态分配”，然后点击“下一步”。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_26_2.png)\n\n## 步骤 9\n\n接着点击“系统”部分，然后选择“处理器”标签页。根据您的\
    \ CPU，尽可能多开启 CPU 核心数，但不要影响宿主系统性能；我们选择了两个 CPU。现在点击“显示”部分，将“视频内存”滑动至最大值，并勾选“启用 3D\
    \ 加速”。点击“确定”保存新设置。\n\n![](img/f80199d101da92d953f18eaa6205b48e_26_3.png)\n\n##\
    \ 步骤 7\n\n虚拟硬盘是一个单一文件夹，大小上限由本节所指定。请确保虚拟硬盘所在的位置在您的计算机上有足余的可用空间。例如，我们在 D: 驱动器上使用了更大的存储空间，命名为“Linux\
    \ Mint”，并为虚拟硬盘分配了 25.50GB 的空间。\n\n![](img/f80199d101da92d953f18eaa6205b48e_26_4.png)\n\
    \n## 步骤 10\n\n点击“开始”按钮，在“选择启动磁盘”窗口中使用文件夹图标（绿色箭头）定位已下载的 Mint ISO 文件，然后点击“开始”启动虚拟机进入\
    \ Linux Mint Live 环境。您现在可以按照标准 PC 安装要求安装 Linux。\n\n![](img/f80199d101da92d953f18eaa6205b48e_26_5.png)\n\
    \n## 了解 Linux\n\n> “任何人都能构建一个高速处理器。真正的技巧在于构建一个高速系统。”  \n> — Seymour Cray（电气工程师，Cray\
    \ Supercomputers 设计师/创始人）\n\n我们以 Linux Mint 为参考，因为它易用，适合前 Windows 用户，也是最成熟、文档最丰富且拥有出色配置选项的发行版之一。\n\
    \n本节介绍 Linux Mint Cinnamon 菜单和桌面环境的工作方式以及自定义方法。想要创建另一个用户或了解如何在线保持匿名？请继续阅读。\n\n\
    - 30 介绍 Cinnamon 菜单  \n- 32 浏览 Cinnamon 桌面  \n- 34 安装 Linux Mint 后十件事  \n- 36\
    \ 小知识：阿波罗 11  \n- 38 创建用户  \n- 40 自定义桌面  \n- 42 在线保持匿名  \n\n![](img/f80199d101da92d953f18eaa6205b48e_28_0.png)\n\
    \n## 介绍 Cinnamon 菜单\n\n现在 Linux 已安装，是时候好好探索一下。不过，如果您使用的是 VirtualBox，可能会收到关于“软件渲染”的通知；下面说明如何解决。\n\
    \n### CINNAMON VIRTUALBOX FIX\n\n您已经了解了一些列表函数，如插入、删除和弹出，但字符串也可以应用相应的函数。\n\n####\
    \ STEP 1\n我们假设您在 VirtualBox 中遇到此问题。顶部右侧会出现“软件渲染”消息。解决方法是：在 VirtualBox 窗口中点击“设备”，随后选择“插入\
    \ Guest Additions 磁盘镜像”。\n\n#### STEP 3\n几秒钟后，您会自动进入命令行界面（Linux 中称为终端）。该界面会显示新\
    \ VirtualBox 驱动的安装过程，移除已检测到的旧驱动，并安装最新版本。安装过程不会很长，完成后会提示您按回车键退出终端。\n\n![](img/f80199d101da92d953f18eaa6205b48e_29_0.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_29_1.png)\n\n#### STEP 2\nGuest Additions\
    \ 磁盘包含 VirtualBox 的驱动，包括虚拟视频硬件。加载后，会弹出“需要运行的软件”通知框，提供“取消”和“运行”两个选项。点击“运行”，并输入您的\
    \ Linux 用户密码。\n\n![](img/f80199d101da92d953f18eaa6205b48e_29_2.png)\n\n#### STEP\
    \ 4\nGuest Additions 磁盘图标位于桌面，右键单击它并向下滚动菜单，选择“弹出”。随后，您可以通过点击菜单（左下角条状区域的最下方图标），选择“重新启动”来重启\
    \ Linux Mint，问题即告解决。\n\n![](img/f80199d101da92d953f18eaa6205b48e_29_3.png)\n\n\
    ### CINNAMON ON THE MENU\n\n软件渲染问题已解决，现在我们来看看 Mint 菜单的工作方式以及它的功能。请注意，这仅适用于 Mint\
    \ Cinnamon，其他发行版的外观和行为会有所不同。\n\n#### STEP 1\n\n登录后，您可能会看到欢迎屏幕。请花点时间浏览选项，阅读“初步步骤”等内容。浏览完毕后，点击窗口右上角的“X”关闭它。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_30_0.png)\n\n#### STEP 4\n\n再次打开菜单，将鼠标悬停在“图形”项上，然后点击“GNU\
    \ 图像处理程序”。GIMP 是功能强大的图像处理软件，效果可与 Adobe Photoshop 媲美，但要获得满意结果需要更多操作。值得一提的是，它值得您投入时间去掌握。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_30_1.png)\n\n#### STEP 2\n\n使用菜单时，点击菜单按钮并悬停在中间列的“办公”项上，右侧列的图标将会变化，显示该类别下已安装的应用程序。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_30_2.png)\n\n#### STEP 5\n\n如果您想查找特定功能或应用（例如设置打印机），请在菜单顶部的搜索框中输入关键词，如“打印机”，即可看到相关选项。此搜索功能在大多数现代\
    \ Linux 菜单中均适用，无论发行版如何。\n\n![](img/f80199d101da92d953f18eaa6205b48e_30_3.png)\n\
    \n#### STEP 6\n\n从菜单中启动应用非常简单：找到目标应用并点击即可。例如，在“办公”类别下点击“LibreOffice Writer”。Writer\
    \ 是 Linux Mint 预装的文字处理程序，文件格式兼容 Microsoft Word，功能与其几乎相同。\n\n![](img/f80199d101da92d953f18eaa6205b48e_30_4.png)\n\
    \n#### STEP 7\n\n在右侧列的应用上右键单击，会出现选项列表：添加到面板、添加到桌面、添加到收藏夹、卸载。大多数选项显而易见。选择“添加到收藏夹”可将应用放入左侧的快速访问栏中。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_30_5.png)\n\n## 浏览 Cinnamon 桌面\n\n\
    每个桌面环境的行为各不相同。有些提供可自定义的桌面小部件，有些则追求简洁、高效的外观。下面我们来看看 Cinnamon 桌面提供了哪些功能。\n\n###\
    \ A TOUCH OF SPICE\n\nCinnamon 桌面环境是风格与性能的完美融合，深受用户喜爱，因而成为最受欢迎的桌面环境之一。\n\n####\
    \ STEP 1\n\n通过双击“计算机”图标开始探索 Cinnamon 桌面。这将打开 Nemo，Cinnamon 使用的文件管理器。双击“计算机”图标会显示根文件系统，并提供对光驱（如有安装）、硬盘以及核心\
    \ Linux 文件系统的访问和视图。\n\n![](img/f80199d101da92d953f18eaa6205b48e_31_0.png)\n\n\
    #### STEP 2\n\n对前来自 Windows 的用户而言，Linux 文件系统可能显得有些复杂，因此在尚未完全了解其工作原理前，我们建议您关注桌面上的“主页”图标。这里存放了与您的用户账户相关的所有内容：图片、视频、音乐、文档、下载项等。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_31_1.png)\n\n#### STEP 3\n\nNemo 提供多种查看和管理文件夹的方式。例如，如果您在“图片”文件夹中有图片，可以使用\
    \ Nemo 右下角的滑块（标记为“调整缩放级别”）来调节图片的缩放级别。\n\n![](img/f80199d101da92d953f18eaa6205b48e_31_2.png)\n\
    \n#### STEP 4\n\n正如任何优秀的文件管理器，右键单击文件或文件夹即可获得大量操作选项。在 Cinnamon 中，默认选项允许您根据文件类型播放或查看文件，以及复制、剪切、删除、压缩、重命名、通过电子邮件发送、查看属性等。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_31_3.png)\n"
