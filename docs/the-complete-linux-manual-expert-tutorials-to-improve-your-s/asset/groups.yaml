    # The Hobbit


    DID YOU KNOW...


    released in 1982 for various platforms, Melbourne House’s The Hobbit was a coding
    work of genius. Developed by Philip Mitchell and Dr. Veronika Megler, The Hobbit
    was uniquely coded using a parser called ‘Inglish’ which allowed the player to
    enter full sentences, such as “Take sword from Gandalf, and kill goblin with it.”


    Furthermore, each object in the game had a specific size, weight and solidity;
    so if you sat on a stool, and someone picked up the stool or threw it, then your
    character would be taken along with it.


    character would be taken along with it. Also, in early versions of the game, the
    non-playing characters would often move around the map and capture and kill each
    other before the player had even reached that stage in the game. There was even
    a randomiser event in place with each start of the game, where any character could
    pick up a random object from any location. This meant that, potentially, it was
    possible for Thorin to pick you up and carry you for the entire adventure. Remarkable
    for a game that took up less than 38KB of memory.


