    # Variables


    Variables differ slightly when using C++ as opposed to Python. In Python, you
    can simply state that ‘a’ equals 10 and a variable is assigned. However, in C++
    a variable has to be declared with its type before it can be used.


    # THE DECLARATION OF VARIABLES


    You can declare a C++ variable by using statements within the code. There are
    several distinct types of variable you can declare. Here’s how it works.


    # STEP 1


    Open up a new, blank C++ file and enter the usual code headers:


    ```

    #include <iostream>

    using namespace std;


    int main()

    {

    }

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_131_0.png)


    # STEP 2


    Start simple by creating two variables, a and b, with one having a value of 10
    and the other 5. You can use the data type int to declare these variables. Within
    the curly brackets enter:


    ```

    int a;

    int b;


    a = 10;

    b = 5;

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_131_1.png)


    # STEP 3


    You can build and run the code but it won’t do much, other than store the values
    10 and 5 to the integers a and b. Ignore the warnings about variables set but
    not used, the code still works. To output the contents of the variables, add:


    ```

    cout << a;

    cout << "\n";

    cout << b;

    ```


    The cout << "\n"; part simply places a new line between the output of 10 and 5.


    ![](img/f80199d101da92d953f18eaa6205b48e_131_2.png)


    # STEP 4


    Naturally you can declare a new variable, call it result and output some simple
    arithmetic:


    ```

    int result;


    result = a + b;

    cout << result;

    ```


    Insert the above into the code as per the screenshot.


    ![](img/f80199d101da92d953f18eaa6205b48e_131_3.png)'
  - "[PAGE 132]\n\n# STEP 5\n\nYou can assign a value to a variable as soon as you\
    \ declare it. The code you’ve typed in could look like this, instead:\n\n```\n\
    int a = 10;\nint b = 5;\nint result = a + b;\n\ncout << result;\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_0.png)\n\
    \n# STEP 6\n\nSpecific to C++, you can also use the following to assign values\
    \ to a variable as soon as you declare them:\n\n```\nint a (10);\nint b (5);\n\
    ```\n\nThen, from the C++2011 standard, using curly brackets:\n\n```\nint result\
    \ {a+b};\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_1.png)\n\n# STEP\
    \ 7\n\nYou can create global variables, which are variables that are declared\
    \ outside any function and used in any function within the entire code. What you’ve\
    \ used so far are local variables: variables used inside the function. For example:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint StartLives = 3;\n\nint main\
    \ ()\n{\n    StartLives = StartLives - 1;\n    cout << StartLives;\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_2.png)\n\
    \n# STEP 8\n\nThe previous step creates the variable StartLives, which is a global\
    \ variable. In a game, for example, a player’s lives go up or down depending on\
    \ how well or how bad they’re doing. When the player restarts the game, the StartLives\
    \ returns to its default state. 3. Here we’ve assigned 3 lives, then subtracted\
    \ 1, leaving 2 lives left.\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_3.png)\n\
    \n# STEP 9\n\nThe modern C++ compiler is far more intelligent than most programmers\
