  md: "\n## Working with Variables\n\nWe’ve seen some examples of variables in our\
    \ Python code already but it’s always worth going through the way they operate\
    \ and how Python creates and assigns certain values to a variable.\n\n### VARIOUS\
    \ VARIABLES\n\nYou’ll be working with the Python 3 IDLE Shell in this tutorial.\
    \ If you haven’t already, open Python 3 or close down the previous IDLE Shell\
    \ to clear up any old code.\n\n### STEP 1\n\nIn some programming languages you’re\
    \ required to use a dollar sign to denote a string, which is a variable made up\
    \ of multiple characters, such as a name of a person. In Python this isn’t necessary.\
    \ For example, in the Shell enter: name=\"David Hayward\" (or use your own name,\
    \ unless you’re also called David Hayward).\n\n![](img/f80199d101da92d953f18eaa6205b48e_105_0.png)\n\
    \n### STEP 2\n\nYou can check the type of variable in use by issuing the type()\
    \ command, placing the name of the variable inside the brackets. In our example,\
    \ this would be: type(name). Add a new string variable: title=\"Descended from\
    \ Vikings\".\n\n![](img/f80199d101da92d953f18eaa6205b48e_105_1.png)\n\n### STEP\
    \ 3\n\nYou’ve seen previously that variables can be concatenated using the plus\
    \ symbol between the variable names. In our example we can use: print(name + \"\
    :\" + title). The middle part between the quotations allows us to add a colon\
    \ and a space, as variables are connected without spaces, so we need to add them\
    \ manually.\n\n![](img/f80199d101da92d953f18eaa6205b48e_105_2.png)\n\n### STEP\
    \ 4\n\nYou can also combine variables within another variable. For example, to\
    \ combine both name and title variables into a new variable we use: character=name\
    \ + \": \" + title\nThen output the content of the new variable as: print(character)\n\
    Numbers are stored as different variables:\nage=44\nType(age)\nWhich, as we know,\
    \ are integers.\n\n![](img/f80199d101da92d953f18eaa6205b48e_105_3.png)\n\n## Working\
    \ with Variables\n\n### STEP 5\n\nHowever, you can’t combine both strings and\
    \ integer type variables in the same command, as you would a set of similar variables.\
    \ You need to either turn one into the other or vice versa. When you do try to\
    \ combine both, you get an error message:\n\n```\nprint (name + age)\n```\n\n\
    ![](img/f80199d101da92d953f18eaa6205b48e_106_0.png)\n\n### STEP 6\n\nThis is a\
    \ process known as TypeCasting. The Python code is:\n\n```\nprint (character +\
    \ \" is \" + str(age) + \" years old.\")\n```\n\nor you can use:\n\n```\nprint\
    \ (character, \"is\", age, \"years old.\")\n```\n\nNotice again that in the last\
    \ example, you don’t need the spaces between the words in quotes as the commas\
    \ treat each argument to print separately\n\n![](img/f80199d101da92d953f18eaa6205b48e_106_1.png)\n\
    \n### STEP 7\n\nAnother example of TypeCasting is when you ask for input from\
    \ the user, such as a name. For example, enter:\n\n```\nage= input (\"How old\
    \ are you? \")\n```\n\nAll data stored from the Input command is stored as a string\
    \ variable.\n\n![](img/f80199d101da92d953f18eaa6205b48e_106_2.png)\n\n### STEP\
    \ 8\n\nThis presents a bit of a problem when you want to work with a number that’s\
    \ been inputted by the user, as age + 10 won’t work due to being a string variable\
    \ and an integer. Instead, you need to enter:\n\n```\nint(age) + 10\n```\n\nThis\
