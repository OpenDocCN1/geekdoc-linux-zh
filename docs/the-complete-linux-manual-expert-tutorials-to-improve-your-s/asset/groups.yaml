    \ the variable as the second:\n\n```\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n    string myst r;\n    cout << \"Enter a sentence: \\n\";\n\
    \    getline(cin, myst r);\n    cout << \"Your sentence is: \" << myst r.size()\
