    # Creating Users


    # STEP 5


    You can now enter a password for the new user or click the curled arrow at the
    end of the New Password text box to generate a password for you, as well as displaying
    it. Naturally, it’s a good idea to come up with as strong a password as possible.
    When you’re done, click the Change button.


    ![](img/f80199d101da92d953f18eaa6205b48e_38_0.png)


    # STEP 6


    You can close the Users and Groups console window now, as the new user has been
    created. If you click the Mint Login Menu, followed by Logout, you are presented
    with the Mint Login Manager. The new user is now present in the list of currently
    available users. Click on him/her to log them in.


    ![](img/f80199d101da92d953f18eaa6205b48e_38_1.png)


    # STEP 7


    Once logged in the new user is required to set up their own desktop wallpaper,
    icons, Panel, Menu and so on. Depending on what Account Type you set up for them,
    Standard or Administrator, they won’t be able to install any new apps. This screenshot
    is from a Standard user account type.


    ![](img/f80199d101da92d953f18eaa6205b48e_38_2.png)


    # STEP 8


    You can create as many new accounts as you need and you’re able to switch between
    them when required. It’s best to have just one account that’s capable of installing
    new software, that way you can keep track of what’s on your system.


    ![](img/f80199d101da92d953f18eaa6205b48e_38_3.png)


    # COMMAND LINE ACCOUNTS


    Just as you’d expect, you can also create a new user within the command Line.
    Open up a Terminal session under the main (yours) Administrator account.


    # STEP 1


    The process for adding a new user from the command line is relatively simple.
    To begin with, type: sudo adduser <username> where <username> is the new user’s
    login name. You’re then asked to create a new password for the user, along with
    their full name and other details. Click y to confirm the details and create the
    user account.


    ![](img/f80199d101da92d953f18eaa6205b48e_38_4.png)


    # STEP 2


    You can check the details and account type for the new user from within the Users
    and Groups console. If you want to delete a user from Mint, you can either enter:
    sudo deluser <username> in the Terminal or click the Delete button in Users and
    Groups.


    ![](img/f80199d101da92d953f18eaa6205b48e_38_5.png)'
  - '[PAGE 39]


    # Customising the Desktop


    Customising the operating system desktop is one way to make it your own: a personalised
    workspace that is there to help you work, inspire you or feature the company logo.
    Whatever your reasons for having your own desktop, here’s how it’s done.


    # YOUR DESKTOP


    Linux is probably one of the customisable operating systems there is. With just
    a few tweaks, one or two extras installed and some imagination, you can create
    something incredible.


    # STEP 1


    The first aspect of desktop customisation is to change the wallpaper. Right-click
    the desktop and choose Change Desktop Background. This opens the Backgrounds app
    in Linux Mint; remember, other distros may present their background, wallpaper
    selection tools differently.


    ![](img/f80199d101da92d953f18eaa6205b48e_39_0.png)


    # STEP 3


    You just need to click the available images, from any of the locations provided
    to have them install as the desktop wallpaper. Incidentally, if you have images
    stored in another location on your system or network, you can add them by clicking
    on the Plus symbol at the bottom of the Backgrounds console, using the file manager
    to locate them.


    ![](img/f80199d101da92d953f18eaa6205b48e_39_1.png)


    # STEP 2


    More recent versions of Linux Mint display available backgrounds depending on
    the version the user is running. You normally get three categories followed by
    a fourth, Pictures, which is separated from the others. The Pictures option is
    different because it reads the image content from the Pictures folder in your
    Home area.


    ![](img/f80199d101da92d953f18eaa6205b48e_39_2.png)


    # STEP 4


    By clicking on the Settings tab you can, instead, play numerous images as a slideshow
    or change the aspect of the wallpapers to a variety of choices.


    ![](img/f80199d101da92d953f18eaa6205b48e_39_3.png)'
