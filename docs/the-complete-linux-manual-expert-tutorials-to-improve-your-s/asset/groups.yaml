    \ an elevated status due it installing components at different locations. Windows\
    \ users can search for CMD via the Start button and right-click the result then\
    \ click Run as Administrator. Linux and Mac users can use the Sudo command, with\
    \ sudo pip install package.\n\n![](img/f80199d101da92d953f18eaa6205b48e_113_2.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_113_3.png)\n"
  mdcn: "\n\n## STEP 5\n\n可以通过模块为 Python 添加额外的功能。Python 有大量可用的模块，可以涵盖众多编程任务。它们添加了函数，并且可以根据需要随时导入。例如，要使用高级数学函数请输入：\n\
    \n```\nimport math\n```\n\n输入后，你就可以访问 Math 模块的所有函数。\n\n### STEP 6\n\n要从模块中使用函数，输入模块名称后跟一个句点，然后是函数名称。例如，使用\
    \ Math 模块，既然你刚刚将其导入到 Python 中，你就可以使用平方根函数。为此，输入：\n\n```\nmath.sqrt(16)\n```\n\n\
    你可以看到代码以 module.function(data) 的形式呈现。\n\n![](img/f80199d101da92d953f18eaa6205b48e_110_0.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_110_1.png)\n\n## FORGING FUNCTIONS\n\
    \n你可以导入许多由其他 Python 程序员创建的不同函数，将来你肯定会遇到一些优秀的例子；你也可以使用 def 命令创建自己的函数。\n\n### STEP\
    \ 1\n\n选择 File > New File 进入编辑器，我们来创建一个名为 Hello 的函数，向用户问候。输入：\n\n```\ndef Hello():\n\
    print(\"Hello\")\n\nHello()\n```\n\n按 F5 保存并运行脚本。你可以在 Shell 中看到 Hello，输入 Hello()\
    \ 它会返回新的函数。\n\n### STEP 3\n\n要进一步修改它，删除 Hello(\"David\") 行，即脚本中的最后一行，然后按 Ctrl+S\
    \ 保存新脚本。关闭编辑器并创建一个新文件（File > New File）。输入以下内容：\n\n```\nfrom Hello import Hello\n\
    \nHello(\"David\")\n```\n\n按 F5 保存并执行代码。\n\n![](img/f80199d101da92d953f18eaa6205b48e_110_2.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_110_3.png)\n\n### STEP 2\n\n我们现在扩展函数以接受一个变量，例如用户的姓名。编辑你的脚本使其读取：\n\
    \n```\ndef Hello(name):\nprint(\"Hello\", name)\n\nHello(\"David\")\n```\n\n这将现在接受变量\
    \ name，否则它会打印 Hello David。在 Shell 中，输入：name=(\"Bob\")，然后：Hello(name)。你的函数现在可以通过它传递变量。\n\
    \n### STEP 4\n\n你刚才所做的就是从保存的 Hello.py 程序中导入 Hello 函数，然后使用它向 David 问好。这就是模块和函数的工作方式：你导入模块然后使用函数。试试这个，并为额外加分进行修改：\n\
    \n```\ndef add(a, b):\nresult = a + b\nreturn result\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_110_4.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_110_5.png)\n\n## Conditions and Loops\n\
    \n条件和循环让程序变得有趣；它们可以很简单也可以相当复杂。你如何使用它们在很大程度上取决于程序试图实现的目标；它们可能是游戏中剩余的生命数，或只是显示倒计时。\n\
    \n## TRUE CONDITIONS\n\n一开始保持条件简单会让学习编程变得更有趣。那么让我们开始检查某物是否为 TRUE，然后如果不是就做其他事情。\n\
    \n### STEP 1\n\n让我们创建一个新的 Python 程序，它会要求用户输入一个单词，然后检查它是否为四字母词。开始时选择 File > New\
    \ File，并从输入变量开始：\n\n```\nword=input(\"Please enter a four-letter word: \")\n```\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_111_0.png)\n\n### STEP 3\n\n现在你可以使用\
    \ if 语句检查 word_length 变量是否等于四，如果符合规则则打印友好的确认信息：\n\n```\nword=input(\"Please enter\
    \ a four-letter word: \")\nword_length=len(word)\nif word_length == 4:\n    print\
    \ (word, \"is a four-letter word. Well done.\")\n```\n\n双等号（==）表示检查某物是否等于另一物。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_111_1.png)\n\n### STEP 2\n\n现在我们可以创建一个新变量，然后使用\
    \ len 函数并将 word 变量传递给它，以获取用户刚刚输入的字母总数。\n\n```\nword=input(\"Please enter a four-letter\
    \ word: \")\nword_length=len(word)\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_111_2.png)\n\
    \n### STEP 4\n\nIF 末尾的冒号告诉 Python 如果此语句为真，则执行冒号后缩进的所有内容。接下来，将光标移回编辑器的开头：\n\n```\n\
    word=input(\"Please enter a four-letter word: \")\nword_length=len(word)\nif word_length\
    \ == 4:\n    print (word, \"is a four-letter word. Well done.\")\nelse:\n    print\
    \ (word, \"is not a four-letter word.\")\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_111_3.png)\n\
    \n### STEP 5\n\n按 F5 保存代码以执行它。先在 Shell 中输入一个四字母词，你应该会得到返回消息，说明该词是四个字母。现在再次按 F5\
    \ 重新运行程序，但这次输入一个五字母词。Shell 将显示它不是一个四字母词。\n\n![](img/f80199d101da92d953f18eaa6205b48e_112_0.png)\n\
    \n### STEP 6\n\n现在扩展代码以包含另一个条件。最终，它可能会变得相当复杂。我们添加了三字母词的条件：\n\n```\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print (word, \"is a four-letter word. Well done.\")\nelif word_length\
    \ == 3:\n    print (word, \"is a three-letter word. Try again.\")\nelse:\n   \
    \ print (word, \"is not a four-letter word.\")\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_112_1.png)\n\
    \n## LOOPS\n\n循环看起来与条件非常相似，但在操作上却有所不同。循环会多次运行同一块代码，通常在条件的支持下。\n\n### STEP 1\n\n\
    让我们从一个简单的 While 语句开始。像 IF 一样，它会检查某物是否为 TRUE，然后运行缩进的代码：\n\n```\nx = 1\nwhile x\
    \ < 10:\n    print (x)\n    x = x + 1\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_112_2.png)\n\
    \n### STEP 3\n\nFor 循环是另一个例子。For 用于遍历一系列数据，通常是存储在方括号内的列表变量。例如。\n\n```\nwords=[\"\
    Cat\", \"Dog\", \"Unicorn\"]\nfor word in words:\n    print (word)\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_112_3.png)\n\
    \n### STEP 2\n\nif 和 while 之间的区别在于 while 到达缩进代码的末尾时，会返回并检查语句是否仍然为真。在我们的示例中 x 小于\
    \ 10。每次循环它都会打印 x 的当前值，然后给该值加一。当 x 最终等于 10 时它会停止。\n\n![](img/f80199d101da92d953f18eaa6205b48e_112_4.png)\n\
    \n### STEP 4\n\nFor 循环也可以通过使用 range 函数在倒计时示例中使用：\n\n```\nfor x in range (1, 10):\n\
    \    print (x)\n```\n\n这里不需要 x=x+1 部分，因为 range 函数会在第一个和最后一个数字之间创建一个列表。\n\n![](img/f80199d101da92d953f18eaa6205b48e_112_5.png)\n\
    \n## Python Modules\n\n我们之前提到过模块，（Math 模块），但由于模块是充分利用 Python 的重要组成部分，值得花更多时间来研究它们。在此实例中我们使用的是\
    \ Windows 版本的 Python 3。\n\n## MASTERING MODULES\n\n把模块想象成导入到你的 Python 代码中以增强和扩展其能力的扩展。有无数个模块可用，正如我们所见，你甚至可以自己制作。\n\
    \n### STEP 1\n\n虽然内置函数不错，但 Python 中的内置函数是有限的。然而，使用模块允许我们制作更复杂的程序。正如你所知，模块是导入的\
    \ Python 脚本，例如 import math。\n\n### STEP 3\n\n结果是 IDLE Shell 中出现错误，因为 Pygame 模块未被识别或未安装在\
    \ Python 中。要安装模块，我们可以使用 PIP（Pip Installs Packages）。关闭 IDLE Shell 并进入命令提示符或终端会话。在具有提升管理员权限的命令提示符下，输入：\n\
    \n```\npip install pygame\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_113_0.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_113_1.png)\n\n### STEP 2\n\n一些模块，尤其是在\
    \ Raspberry Pi 上，默认包含，Math 模块就是一个主要例子。可惜，其他模块并不总是可用。非 PI 平台上的一个很好的例子是 Pygame 模块，它包含许多帮助创建游戏的函数。尝试：import\
    \ pygame。\n\n### STEP 4\n\nPIP 安装需要提升的权限，因为它会在不同位置安装组件。Windows 用户可以通过开始按钮搜索 CMD，右键单击结果然后点击以管理员身份运行。Linux\
    \ 和 Mac 用户可以使用 Sudo 命令，使用 sudo pip install package。\n\n![](img/f80199d101da92d953f18eaa6205b48e_113_2.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_113_3.png)\n\n"
