  - '[PAGE 59]


    # Fun Things to do in the Terminal


    Despite the seriousness of an operating system, the Linux community are certainly
    no strangers to a bit of fun. The developers over the years have created and inserted
    all manner of fun and odd elements into the Terminal.


    # TERMINAL FUN


    You''ll be working exclusively in the Terminal for these next two sections, so
    start warming up your fingers. After all, all work and no play... as the saying
    goes.


    STEP 1 The first command we''re going to use is sl, it''s not installed by default
    so enter: sudo apt-get install sl. The command can be run with sl and when executed
    will display a Steam Locomotive travelling across the screen (hence ''sl''). Entering
    LS, note the upper case, also works.


    ![](img/f80199d101da92d953f18eaa6205b48e_59_0.png)


    STEP 3 If you''ve ever fancied having the computer read a random fortune out to
    you, then you''re in luck. Most distros require you to install the fortune app,
    however Linux Mint differs somewhat by having it already pre-loaded. All you need
    to do is enter the command fortune into the Terminal, and enjoy.


    ![](img/f80199d101da92d953f18eaa6205b48e_59_1.png)


    STEP 2 Fans of Star Wars even get a fix when it comes to the Terminal. By linking
    to a remote server via the telnet command, you can watch Episode IV: A New Hope
    being played out, albeit in ASCII. To view this spectacle, enter: telnet towel.blinkenlights.nl.


    ![](img/f80199d101da92d953f18eaa6205b48e_59_2.png)


    STEP 4 The rev command is certainly interesting, and at first what seems a quite
    useless addition to the OS. However, it can be used to create some seemingly unbreakable
    passwords. Enter: rev, now type some text, when you press Enter next, everything
    you typed in will be reversed. Press Ctrl+C to exit.


    ![](img/f80199d101da92d953f18eaa6205b48e_59_3.png)'
  - '[PAGE 60]


    # Fun Things to do in the Terminal


    # STEP 5


    If you''re stuck trying to work out all the possible factors for any particular
    number, simply enter factor followed by the number. For example, factor 7 doesn''t
    offer much output, whereas factor 60 displays more.


    ![](img/f80199d101da92d953f18eaa6205b48e_60_0.png)


    # STEP 6


    There''s a fine line between the rather cool and really-quite-weird. Having an
    ASCII cow repeat text to you could potentially fall in the latter. Enter cowsay
    followed by any text you want, such as: cowsay Linux Mint is ace!. In fact, you
    can even output the ls command through the cow, by entering: ls | cowsay.


    ![](img/f80199d101da92d953f18eaa6205b48e_60_1.png)


    # STEP 7


    To further the cow element, there''s even a graphical, i.e. non-Terminal, cow
    available. Install it with: sudo apt-get install xcowsay, then when it''s installed
    enter something similar to cowsay, such as: xcowsay BDM Publications.


    ![](img/f80199d101da92d953f18eaa6205b48e_60_2.png)


    # STEP 8


    If you really want to expand the whole cow thing, for whatever reason, then pipe
    the fortune command through it, with: fortune | cowsay; and for the graphical
    cow equivalent: fortune | xcowsay. Plus, there''s always cowthink. Try: cowthink
    ...This book is awesome.


    ![](img/f80199d101da92d953f18eaa6205b48e_60_3.png)


    # STEP 9


    The command toilet doesn''t inspire much confidence, we''ll admit. However, it''s
    not as bad as it first sounds. Start by installing it with: sudo apt-get install
    toilet. Then when installed, type something along the lines of: toilet David.
    Or perhaps list the contents of the current folder through it, with: ls | toilet.


    ![](img/f80199d101da92d953f18eaa6205b48e_60_4.png)


    # STEP 10


    Expanding the toilet command, you can actually generate some decent looking graphics
    through it. For example, try this: toilet -f mono12 -F metal David. You can enter
    toilet --help, for a list of the command line arguments to expand further.


    ![](img/f80199d101da92d953f18eaa6205b48e_60_5.png)'
  - '[PAGE 61]


    # More Fun Things to do in the Terminal


    If the previous list of fun, and quite bizarre, things to do in the Terminal has
    you wanting more, you’re in luck. We’ve put together another batch of some useful,
    and some not so useful, commands for you to try out.


    # MORE FUN, YAY


    Since the Terminal session is already open, and your keyboard digits are nicely
    warmed up, here are another two pages of Terminal nonsense.


    STEP 1

    Remember the old ZX Spectrum days of computing, when you could type in 10 print
    "Hello", 20 goto 10 and Hello would list down the screen? Well, in Linux Mint
    you can do the same. Simply enter yes followed by some text, i.e. yes Linux is
    ace. It’ll keep going until you press Ctrl+C.


    ![](img/f80199d101da92d953f18eaa6205b48e_61_0.png)


    STEP 3

    Having a little white cat chase your mouse pointer around the desktop may sound
    like a terrible waste of time. Oddly though, it isn’t. Enter: sudo apt-get install
    oneko, then type oneko to have the cat appear. Move your ‘mouse’ cursor around
    the screen and the cat will chase it. Use Ctrl+C to exit the action.


    ![](img/f80199d101da92d953f18eaa6205b48e_61_1.png)


    STEP 2

    The Matrix was one of the most graphically copied films ever released; there’s
    even a version of the Matrix code available for Linux Mint. Install it with: sudo
    apt-get install cmatrix. When it’s done enter: cmatrix and follow the white rabbit.
    Neo. Unlike the real Matrix though, you can press Ctrl+C to exit.


    ![](img/f80199d101da92d953f18eaa6205b48e_61_2.png)


    STEP 4

    This entry is a little more serious than the previous. It’s called the Fork Bomb
    and what it does, basically, is continually replicate itself until it has used
    up all the available system resources, thus causing your computer to crash. You
    don’t have to try it but it’s interesting nonetheless. Simply enter :(){ :|:&
    }; and be prepared to reboot.


    ![](img/f80199d101da92d953f18eaa6205b48e_61_3.png)'
  - '[PAGE 62]


    # STEP 5


    Stringing several commands and piping them through other commands is what makes
    scripting such a powerful element to an OS. Using the while command, for example,
    together with toilet, can yield some impressive results.


    ```

    Enter: while true; do echo "$[date ''+%D %T'']" | toilet -f term -F border --metal";
    sleep 1; done.

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_62_0.png)


    # STEP 6


    Talking computers were the craze of the 80s, enter: espeak "Hello, this is Linux
    Mint!" to have the computer repeat the text inside the quotes to you. Make sure
    your volume is turned up, and try the following: ls > folders.txt && espeak -f
    folders.txt. This will have Mint read back the contents of the ls command.


    ```

    espeak "Hello, this is Linux Mint!"

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_62_1.png)


    # STEP 7


    A roaring ASCII fire isn''t the most useful command to have at your disposal,
    but it''s fun. Install it with: sudo apt-get install libaa-bin, then when installed
    use: aafire. It''s not exactly warming but you get the idea. To expand the above,
    enter: sudo apt-get install bb caca-utils, then, cacafire.


    ```

    sudo apt-get install libaa-bin

    ```


    ```

    sudo apt-get install bb caca-utils

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_62_2.png)


    # STEP 8


    Used as a music demo from the old Amiga and DOS days, the bb command reminds us
    of getting hold of three and a half inch floppies crammed with all manner of demoscene
    goodies. We''ve already installed bb from the previous step, so just enter bb.
    Follow the on-screen instructions, and turn up your volume.


    ![](img/f80199d101da92d953f18eaa6205b48e_62_3.png)


    # STEP 9


    This entry is in two parts. First you need to get hold of the necessary packages:
    sudo apt-get install libcurses-perl. When that''s done enter: cd Downloads/ &&
    wget http://search.cpan.org/CPAN/authors/id/K/KB/KBAUCOM/Term-Animation-2.4.tar.gz
    && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/. Then: perl Makefile.PL
    && make && make test && sudo make install.


    ```

    sudo apt-get install libcurses-perl

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_62_4.png)


    # STEP 10


    With that little lot done, onto the next. Enter: cd .. && wget http://www.robobunny.com/projects/asciiquarium/asciiquarium.tar.gz
    && tar -xf asciiquarium.tar.gz && cd asciiquarium_1.1/ && chmod +x asciiquarium.
    Providing all went well, enter ./asciiquarium and enjoy your very own ASCII-based
    aquarium.


    ```

    cd .. && wget http://www.robobunny.com/projects/asciiquarium/asciiquarium.tar.gz
    && tar -xf asciiquarium.tar.gz && cd asciiquarium_1.1/ && chmod +x asciiquarium

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_62_5.png)'
