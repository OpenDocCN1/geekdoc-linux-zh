    ![](img/f80199d101da92d953f18eaa6205b48e_32_1.png)


    ## STEP 6


    例如，如果你点击修改面板选项，你可以移除、移动、移除面板、添加新面板并清除当前存在的任何小程序。顺便说一下，小程序是一个设计用于在 Cinnamon 面板中工作并适配其中的应用。


    ![](img/f80199d101da92d953f18eaa6205b48e_32_2.png)


    ## STEP 9


    点击菜单并输入系统设置并打开 resulting 图标。这会带你进入系统设置选项。从这里你可以控制和编辑 Linux Mint Cinnamon 的外观和工作方式，以及添加新用户、管理防火墙和启用辅助功能选项。


    ![](img/f80199d101da92d953f18eaa6205b48e_32_3.png)


