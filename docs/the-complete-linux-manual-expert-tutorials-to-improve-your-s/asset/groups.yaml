    ## Linux 技巧与窍门


    正如你所见，Linux 终端是一个相当非凡的环境。安装几个额外的应用程序，再加上一点点命令知识，就能完成令人难以置信的、而且往往相当奇怪的事情。


    ## 掌控命令


    网上有无数 Linux 技巧、秘诀、黑客方法和窍门。有些非常古老，源自 Linux 的 Unix 传承，而另一些则是 Linux 传说的最新增添。这里是我们最喜欢的十个技巧和窍门。


    ## 复活节彩蛋


    Emacs 文本编辑器是一款很棒的软件，不过，你知道它还包含一个隐藏的复活节彩蛋吗？安装 Emacs 后（sudo apt-get install emacs25），切换到终端会话并输入：


    ```

    emacs -batch -l dunnet

    ```


    Dunnet 是一款由 Ron Schnell 于 1982 年编写的文字冒险游戏，自 1994 年起就隐藏在 Emacs 中。


    ![](img/f80199d101da92d953f18eaa6205b48e_63_0.png)


    ## 终端浏览


    你是否想过能够从终端浏览互联网？虽然不是特别实用，但看到它确实相当引人入胜。要做到这一点，请输入：


    ```

    sudo apt-get install elinks

    elinks

    ```


    输入你想要访问的网站。


    ![](img/f80199d101da92d953f18eaa6205b48e_63_1.png)


    ## 月球载具


    基于经典的 1982 年街机游戏 Moon Patrol，Moon Buggy 于 1985 年在众多赞誉中出现在家用电脑上。这是一款出色的 Atari 游戏，你可以在
    Linux 终端中通过输入以下命令来使用它：


    ```

    sudo apt-get install moon-buggy

    ```


    然后：


    moon-buggy


    尽情享受。


    ![](img/f80199d101da92d953f18eaa6205b48e_63_2.png)


    ## 下雪吧


    在终端控制台下雪并不是每天都能遇到的事情。如果你感兴趣的话，请输入：


    ```

    wget https://gist.githubusercontent.com/sontek/1505483/raw/7d024716ea57e6f9fb52632fee09f42
    753361c4a02/snowjob.sh

    chmod +x snowjob.sh

    ./snowjob.sh

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_63_3.png)


    ## 内存占用大户


    如果你需要查看 Linux 上哪些应用程序消耗了最多的内存，只需输入：


    ```

    ps aux | sort -rnk 4

    ```


    这会按系统内存使用情况对输出进行排序。


    ![](img/f80199d101da92d953f18eaa6205b48e_64_0.png)


    ## BBS


    在拨号连接的时代，网络世界由公告板系统组成。这些远程服务器为用户提供聊天、交换代码、玩游戏等活动的场所。使用 Linux 中的 telnet，我们仍然可以连接到一些活跃的
    BBS：


    ```

    telnet battlestar.bbs.dyndns.org

    ```


    有无数个正在运行的 BBS 可用，查看 https://www.telnetbbsguide.com/bbs/list/detail/，了解更多信息。


    ![](img/f80199d101da92d953f18eaa6205b48e_64_1.png)


    ## 碎纸机


    当你删除一个文件时，有可能拥有合适软件的人能够将其恢复。然而，要安全且永久地删除文件，请使用 Shred：


    ```

    shred -zvu NAMEOFFILE.txt

    ```


    将 NAMEOFFILE 替换为要删除的文件名。


    ![](img/f80199d101da92d953f18eaa6205b48e_64_2.png)


    ## 目录树


    如果你想用一条命令创建整个目录（或文件夹）树，可以使用：


    ```

    mkdir -p New-Dir/{subfolder1,subfolder2,subfolder3,subfolder4}

    ```


    这将在 New-Dir 中创建四个子文件夹。


    ![](img/f80199d101da92d953f18eaa6205b48e_64_3.png)


    ## ASCII 艺术


    ASCII 艺术在应用于某些图像时效果相当惊人。然而，通常很难做到完美。你可以使用 img2txt 从你拥有的图像中创建出色的 ASCII 艺术：


    ```

    img2txt NAMEOFIMAGEFILE.png

    ```


    将 NAMEOFIMAGEFILE 替换为系统上图像文件的实际名称。如果未安装 img2txt，请使用：sudo apt-get install caca-utils。


    ![](img/f80199d101da92d953f18eaa6205b48e_64_4.png)


    ## 遗忘的命令


    很难记住所有可用的 Linux 命令。幸运的是，我们可以使用 apropos 来帮助我们。只需使用它，并加上命令的描述：


    ```

    apropos "copy files"

    apropos "rename files"

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_64_5.png)


    ## Linux 与大爆炸


    Linux 正在碰撞粒子，因此我们可以了解宇宙是如何运作的。


    ## 你知道吗...


    Linux 是大型强子对撞机科学核心的一部分吗？使用 Red Hat Linux 和 CentOS（基于 Red Hat 核心构建的超稳定发行版）作为首选基础发行版，科学家、开发者和工程师们创建了
    SL – Scientific Linux。


    以 SL 为基础，CERN 的聪明人们开发了几种他们自己的定制 Linux 发行版，以帮助 LHC 的各个方面。最著名的是 SLC，或 Scientific
    Linux CERN，也称为 CERN6。据报道，运行 SL 的系统超过 36,000 台，运行 SLC 的系统超过 15,000 台。


    ## 创建 Bash 脚本 – 第 1 部分


    随着你在 Linux Mint 上的进步，你最终会想要开始创建自己的自动化任务和程序。这些本质上是脚本，更准确地说是 Bash Shell 脚本，它们的工作方式与
    DOS 批处理文件或任何其他编程语言相同。


    ## 开始脚本编写


    Bash 脚本只是一系列 Mint 将运行以完成特定任务的命令。它们可以很简单，也可以相当复杂，这完全取决于情况。


    步骤 1 在接下来的几页中，你将在终端和文本编辑器中工作。文本编辑器有替代方案，我们稍后会介绍，但为了方便起见，我们的示例将在 Xed 中进行。在开始之前，请先进行常规的更新检查：sudo
    apt-get update && sudo apt-get upgrade。


    步骤 3 首先，在开始编写任何脚本之前，你需要创建一个文件夹来存放我们的所有脚本。从 mkdir scripts 开始，然后进入文件夹 cd scripts/。这将是我们的工作文件夹，从这里你可以为你创建的每个脚本创建子文件夹。


    ![](img/f80199d101da92d953f18eaa6205b48e_67_0.png)


    ![](img/f80199d101da92d953f18eaa6205b48e_67_1.png)


    步骤 2 我们可以使用多种文本编辑器来创建 Bash 脚本：Xed、Vi、Nano、Vim、GNU Emacs 等等。最终一切都取决于个人喜好。我们使用 Xed
    纯粹是为了让你在下面截图中看到的脚本更容易阅读。


    步骤 4 Windows 用户会知道，为了使批处理文件能够工作，即执行并遵循其中的编程，它需要有 .BAT 文件扩展名。Linux 是无扩展名的操作系统，但惯例是给脚本
    .sh 扩展名。


    ![](img/f80199d101da92d953f18eaa6205b48e_67_2.png)


    ![](img/f80199d101da92d953f18eaa6205b48e_67_3.png)


    ## 创建 Bash 脚本 – 第 1 部分


    ## 步骤 5


    让我们从一个简单的脚本开始，向终端输出内容。输入 xed helloworld.sh。这将启动 Xed 并创建一个名为 helloworld.sh 的文件。在
    Xed 中，输入以下内容：#!/bin/bash，然后在新的一行输入：echo Hello World!


    ![](img/f80199d101da92d953f18eaa6205b48e_68_0.png)


    ## 步骤 6


    #!/bin/bash 行告诉系统你将使用什么 Shell，在本例中是 Bash。井号（#）表示注释行，系统会忽略它，感叹号（!）表示注释被绕过，并将强制脚本将该行作为命令执行。这也被称为
    Hash-Bang。


    ![](img/f80199d101da92d953f18eaa6205b48e_68_1.png)


    ## 步骤 7


    你可以保存此文件，点击 File > Save，然后返回终端。输入 ls，将显示文件夹中的脚本。要使任何脚本可执行并能够运行，你需要修改其权限。用 chmod
    +x helloworld.sh 来完成。你需要对创建的每个脚本都这样做。


    ![](img/f80199d101da92d953f18eaa6205b48e_68_2.png)


    ## 步骤 8


    再次输入 ls 时，你可以看到 helloworld.sh 脚本现在已从白色变为绿色，这意味着它现在是一个可执行文件。要运行脚本，即让它执行你输入的内容，请输入：./helloworld.sh。


    ![](img/f80199d101da92d953f18eaa6205b48e_68_3.png)


    ## 步骤 9


    虽然不是特别令人兴奋，但“Hello World!” 的字样现在应该显示在终端中。echo 命令负责在终端中输出它后面的文字，随着我们继续，你可以让 echo
    命令输出到其他来源。


    ![](img/f80199d101da92d953f18eaa6205b48e_68_4.png)


    ## 步骤 10


    把 echo 想象成旧的 BASIC Print 命令。它会显示文本、数字或系统存储的任何变量，例如当前系统日期。试试这个例子：echo Hello World!
    Today is $(date +%A)。$(date +%A) 是调用存储当前星期几的系统变量。


    ![](img/f80199d101da92d953f18eaa6205b48e_68_5.png)


