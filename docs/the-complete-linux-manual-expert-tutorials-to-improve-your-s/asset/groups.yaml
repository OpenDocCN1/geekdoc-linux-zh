    # 向 Linux 问好


    > “你怎么知道这么多关于电脑的事？”

    > “我不知道，这是第一台。”

    > —— 格蕾丝·霍珀上将（先驱程序员）

    > 在大卫·莱特曼采访时


    为什么选择 Linux？它是什么？我在哪里可以获得它？为什么它有这么多不同的版本？大多数初学者在入门时会问这些以及更多问题。Linux 确实是一个功能强大且用途广泛的操作系统，但你从哪里开始呢？幸运的是，你可以在本节中找到答案。


    你可以用 Linux 做很多事情，但你需要知道从哪里开始；我们在这里帮助你。在本节中，你可以了解 Linux 是什么，发行版是什么，桌面环境是什么。你还可以开始探索
