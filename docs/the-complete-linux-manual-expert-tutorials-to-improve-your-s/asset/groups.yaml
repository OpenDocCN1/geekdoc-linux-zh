    Elk Cloner 于 ''82 年作为恶作剧开发，是野外最早被记录的病毒之一。


    ## 使用注释


    虽然注释似乎是构成游戏、应用程序甚至整个操作系统的众多代码行中的一个次要元素，但实际上它们可能是最重要的因素之一。


    ## 注释的重要性


    代码中的注释基本上是人类可读的描述，详细说明代码在该特定点正在做什么。它们听起来可能并不特别重要，但没有注释的代码是编程中令人沮丧的众多领域之一，无论你是专业人士还是刚刚入门。


    简而言之，所有代码都应以有效描述行、部分或单个元素目的的方式进行注释。你应该养成尽可能多地注释的习惯，通过想象一个对编程一无所知的人可以拿起你的代码并仅通过阅读你的注释就理解它将做什么。


    在专业环境中，注释对代码的成功以及最终公司或项目的成功至关重要。在一个组织中，许多程序员与工程师、其他开发人员、硬件分析师等一起在团队中工作。如果你是为公司编写定制软件的团队的一员，那么你的注释在出现问题时可以节省大量时间，因为另一名团队成员必须接手并追踪以找出问题所在。


    把自己置于一个人的鞋子里，他的任务是找出程序出了什么问题。该程序有超过 800,000 行代码，分布在多个不同的模块中。你很快就能体会到从原始程序员那里获得一点帮助的需求，即良好的注释。


    ![](img/f80199d101da92d953f18eaa6205b48e_129_0.png)


    最好的注释总是简洁的，并逻辑地链接代码，详细说明程序到达某行或某部分时会发生什么。你不需要注释每一行。诸如：if x==0 之类的内容不需要你注释如果 x
    等于零则执行某事；这对读者来说是显而易见的。然而，如果 x 等于零会极大地改变用户对程序的体验，例如，他们用完了生命值，那么它肯定需要被注释。


    即使代码是你的，你也应该像要与他人公开分享一样编写注释。这样你就可以返回到那段代码并始终理解你做了什么或你做错了什么，或者什么效果非常好。


    注释是良好的实践，一旦你理解了在需要时添加注释的方法，你很快就会像第二天性一样做到这一点。


