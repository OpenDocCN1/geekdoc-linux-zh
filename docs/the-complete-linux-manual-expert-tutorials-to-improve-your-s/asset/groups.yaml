    ## MATHS


    如果你的代码进行多次计算，那么你需要确保其背后的数学是正确的。有成千上万的实例，程序因糟糕的数学编码而提供不正确的数据，这可能产生灾难性的后果，具体取决于代码的用途。总之，请仔细检查你的代码方程。


    ```

    set function v2

    set output

    max = 5

    min = 0


    comp = (x, y) = (x, y) + (0, 1)

    ... [code snippet]

    ```


