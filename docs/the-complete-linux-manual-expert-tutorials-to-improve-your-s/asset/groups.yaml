    ### B

    - bc  一种任意精度计算器语言


    ### C

    - cat  连接文件并打印到标准输出

    - chdir  更改工作目录

    - chgrp  更改文件的所有组

    - chroot  更改根目录

    - cksum  打印 CRC 校验和和字节计数

    - cmp  比较两个文件

    - comm  按行比较两个已排序文件

    - cp  将一个或多个文件复制到另一个位置

    - crontab  安排命令在稍后时间运行

    - csplit  将文件拆分为上下文确定的片段

    - cut  将文件分成几个部分


    ### D

    - date  显示或更改日期和时间

    - dc  桌面计算器

    - dd  数据转储，转换和复制文件

    - diff  显示两个文件之间的差异

