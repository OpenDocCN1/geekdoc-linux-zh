    {\n    float num1, num2;\n\n    cout << \"Enter two numbers: \\n\";\n    cin >>\
    \ num1 >> num2;\n\n    cout << num1 << \" + \" << num2 << \" is: \" << num1 +\
    \ num2 << \"\\n\";\n}\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_140_2.png)\n\
    \n# STEP 8\n\nWhile cin works well for most input tasks, it does have a limitation.\
