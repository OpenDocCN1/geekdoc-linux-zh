    ![](img/f80199d101da92d953f18eaa6205b48e_122_5.png)


    ## C++ 程序的结构


    C++ 有非常明确的结构和做法。遗漏任何东西，即使是小到分号，你的整个程序也无法编译和执行。许多专业程序员都因结构松散而吃过亏。


    ### #INCLUDE <C++ STRUCTURE>


    学习编程的基础时，你开始理解程序的结构。命令可能因语言而异，但你可以开始了解代码的工作原理。


    C++


    C++ 由丹麦学生 Bjarne Stroustrup 于 1979 年在其博士论文的一部分中发明。最初 C++ 被称为 C with Classes，它在已经流行的
    C 编程语言的基础上添加了功能，同时通过新的结构使其成为更用户友好的环境。


    Bjarne Stroustrup，C++ 的发明者。


    ![](img/f80199d101da92d953f18eaa6205b48e_123_0.png)


    ### INT MAIN()


    int main() 启动了一个名为 ''main'' 的函数声明，该函数是一组代码语句。所有 C++ 代码都从 main 函数开始，无论它在代码中的实际位置如何。


    ```

    helloworld.cpp

    1 #include <iostream>

    2

    3 int main()

    4

    5

    ```


    ### #INCLUDE


    C++ 程序的结构相当精确。每个 C++ 代码都以指令开始：#include <>. 该指令指示预处理器包含标准 C++ 代码的一个部分。例如：#include
    <iostream> 包含 iostream 头文件以支持输入/输出操作。


    ```

    helloworld.cpp

    1 #include <iostream>

    2

    3

    4

    ```


    ### BRACES


    大括号（花括号）是你可能以前没有遇到过的东西，尤其是如果你习惯了 Python。打开的大括号表示 main 函数的开始，并包含属于该函数的所有代码。


    ```

    helloworld.cpp

    1 #include <iostream>

    2

    3 int main()

    4 {

    5

    6

    7 }

    8

    ```


    ## C++ 程序的结构


    ### COMMENTS


    以双斜杠开头的行是注释。这意味着它们不会在代码中执行，并且会被编译器忽略。注释旨在帮助你或查看你代码的另一位程序员解释正在发生的事情。有两种类型的注释：/*
    涵盖多行注释和 // 单行注释。


    ```

    helloworld.cpp

    1 #include <iostream>

    2

    3 int main()

    4 {

    5     //My first C++ program

    6

    7 }

    8

    ```


    ### <<


    这里使用的两个尖括号是插入运算符。这意味着尖括号之后的内容将被插入到 std::cout 语句中。在这种情况下，它们是‘Hello, world’这些词，当你编译和执行代码时它们将被显示在屏幕上。


    ```

    helloworld.cpp

    1 #include <iostream>

    2 using namespace std;

    3

    4 int main()

    5 {

    6     //My first C++ program

    7     cout << |

    8 }

    9

    ```


    ### STD


    虽然 std 代表完全不同的东西，但在 C++ 中它表示 Standard。它是 C++ 中的标准命名空间的一部分，涵盖了许多不同的语句和命令。你可以从代码中省略
    std:: 部分，但必须在开头声明：using namespace std; 不能同时使用两者。例如：


    ```

    #include <iostream>

    using namespace std;

    ```


    ```

    helloworld.cpp

    1 #include <iostream>

    2

    3 int main()

    4 {

    5     //My first C++ program

    6     std::cout << "Hello, world!\n";

    7 }

    8

    ```


    ### OUTPUTS


    接下来，“Hello, world!” 部分是你希望在代码执行时出现在屏幕上的内容。你可以输入任何你喜欢的内容，只要它在引号内即可。有时根据编译器的不同需要括号。\n
    部分表示要插入新行。


    ```

    //My first C++ program

    cout << "Hello, world!\n"|

    ```


    ### COUT


    在这个例子中我们使用 cout，它是标准命名空间的一部分，因此它在那里，因为你要求 C++ 从该特定命名空间使用它。Cout 表示 Character OUTput，它将内容显示或打印到屏幕上。如果你省略
    std::，你必须在代码开头声明它，如前所述。


    ```

    helloworld.cpp

    1 #include <iostream>

    2 using namespace std;

    3

    4 int main()

    5 {

    6     //My first C++ program

    7     cout |

    8 }

    9

    ```


    ### ; AND }


    最后你可以看到函数代码块内的行（注释除外）以分号结尾。这标志着语句的结束；C++ 中的所有语句都必须在末尾有一个，否则编译器无法构建代码。最后一行有闭合大括号，表示
    main 函数的结束。


    ```

    helloworld.cpp

    1 #include <iostream>

    2 using namespace std;

    3

    4 int main()

    5 {

    6     //My first C++ program

    7     cout << "Hello, world!\n";

    8 }

    9

    ```

