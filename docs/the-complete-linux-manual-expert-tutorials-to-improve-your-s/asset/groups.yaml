    # 为什么选择 Linux？


    对于许多用户来说，Linux 意味着自由。摆脱其他操作系统的围墙花园做法的自由，自由地更改和使用操作系统的方式，以及免于任何形式的许可或付费的自由。Linux
    远不止你想象的那么简单。


    ## 免费且开源


    Linux 对于想要有所不同的人来说是一个绝佳的选择。系统的效率、应用程序的可用性和稳定性只是几个很好的理由。


    首先你需要知道的是，并没有一种叫做 Linux 的操作系统。Linux 实际上是操作系统内核，是操作系统的核心组件。当我们和其他人谈论 Linux 时，我们指的是使用
    Linux 内核的众多发行版，或称发行版之一。毫无疑问，你至少听说过当前流行的其中一个发行版：Ubuntu、Linux Mint、Fedora、openSUSE、Debian、Raspbian，等等。这些发行版中的每一个都为用户提供一些不同的东西。虽然每个发行版的核心都是
    Linux 内核，但它们为用户提供不同的桌面环境外观、不同的预装应用程序、不同的系统更新方式和安装更多应用的方式，以及整个系统略有不同的外观和感觉。然而，核心是
    Linux，这就是我们说 Linux 的原因。


    Linux 的工作方式与 Windows 或 macOS 截然不同。首先它是免费的：免费下载，免费安装在任意多台计算机上，免费无限期使用，免费升级和扩展，并可使用同样免费的程序和应用程序进行扩展。这种免费使用的特性是开发人员最大的吸引力之一。虽然
    Windows 许可证可能要花费高达 100 英镑，而 Mac 则要贵得多，但用户，无论是开发人员、游戏玩家还是想要利用旧电脑的人，都可以迅速下载一个发行版并在几分钟内开始工作。


    除了免费使用之外，还提供了一定程度的自由来定制和塑造系统以满足自己的需求。互联网上提供的每个发行版都有其特定的“风格”


    Linux 是一个开始编码的绝佳操作系统。


