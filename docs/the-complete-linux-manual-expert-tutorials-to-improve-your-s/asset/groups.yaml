    - which  在用户路径中定位程序文件

    - who  打印当前登录的所有用户名

    - whoami  打印当前用户 ID 和名称


    ### X

    - xargs  执行实用程序，传递构造的参数列表


    ### Y

    - yes  打印字符串直到中断


