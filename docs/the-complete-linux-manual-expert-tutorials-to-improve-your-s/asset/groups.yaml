    第二受欢迎的发行版是 Ubuntu，它是一个古老的非洲词汇，意为“对他人的仁爱”。Ubuntu 在其十四年生命周期中受欢迎程度有所波动。曾经它是世界上使用最广泛的基于
    Linux 的操作系统，但由于在呈现方面的一些错误选择，以及涉及隐私的一些不利且有争议的元素，不幸地使其跌落第一的位置。


    话虽如此，Ubuntu 此后已做出弥补，并正缓慢地在 Linux 排行榜上回升。操作系统的最新版本使用 GNOME 3 桌面环境，这是一个令人印象深刻的环境，尽管对前
    Windows 用户来说可能有点令人困惑，并且在系统资源方面有点重，尤其如果你计划在老电脑上安装它。


    Ubuntu 尽管有缺点，仍是一个很好的 Linux 发行版供你开始尝试。它界面简洁、易于使用和安装，并为用户提供完整的 Linux 体验。


    www.ubuntu.com


    ## ARCH


    Arch 是运行时间最长的 Linux 发行版之一，也是许多其他 Linux 版本的基础。为什么要安装 Mint 或 Ubuntu，而不安装 Arch？许多用户确实就是这样做的，但这对初学者来说并不理想。Ubuntu
    和 Mint 都提供更简单的安装路径，并附带软件包帮助你入门。


    Arch 另一方面则更“精简”。Arch 致力于自由软件，其软件仓库包含超过 50,000 个可安装的应用，包括多种不同的桌面环境，可像使用任何其他发行版一样使用。


    Arch 适合你对 Linux 更有经验时使用。你从只有命令行开始，从那里必须手动分区硬盘、设置安装文件位置、创建用户、设置操作系统区域设置，最后安装桌面环境以及你想要的应用。


    优势在于，经过所有这些努力后，你得到的是一个由你创建的发行版。这意味着你的 Arch 发行版不会包含其他发行版预装的所有不必要文件和应用；它是为你、由你定制的。


    www.archlinux.org


    ![](img/f80199d101da92d953f18eaa6205b48e_10_0.png)


    ## RASPBERRY PI DESKTOP


    毫无疑问你听说过 Raspberry Pi。很难没听说过，因为这款出色的迷你电脑自推出以来六年里席卷了科技界。


    Raspberry Pi 有几个方面使其成为计算世界中备受追捧的产品。首先它很便宜，价格约为 25 英镑，本质上是一个完全可用的电脑。它很小，大小不超过信用卡。你可以用它构建电子设备，使用完全可编程的接口；并且它附带
    Raspbian，这是一个专为其定制的、基于 Debian 的操作系统，包含办公套件以及多种编程语言和教育资源。


    Raspbian 专用于 Pi 硬件，因为 Raspberry Pi 使用 ARM 处理器驱动。然而，Raspberry Pi 基金会随后发布了 Raspbian
    的 PC 版本：Raspberry Pi Desktop。


    就像 Pi 版本一样，Raspberry Pi Desktop 附带你所需的所有编程、教育和其他应用。它快速、稳定且运行出色。如果你有兴趣拓展你的 Linux
    体验，那么这绝对是值得考虑的顶级发行版之一。


    www.raspberrypi.org/downloads/raspberry-pi-desktop


    ![](img/f80199d101da92d953f18eaa6205b48e_10_1.png)


    ## OPENSUSE


    ![](img/f80199d101da92d953f18eaa6205b48e_10_2.png)


    大多数 Linux 发行版可分为两类。一类是像 Ubuntu 和 Mint 这样拥有最新功能和技术的发行版，另一类是像 Debian 这样功能较少但可靠性极强的发行版。


    与此同时，openSUSE 试图兼顾两者。open Leap 是坚如磐石的系统。它由社区与 SUSE 员工共同开发，后者开发企业级操作系统 SUSE；该系统为伦敦证券交易所等提供动力。它专为任务关键型环境设计，容不得不稳定。如果你觉得这太稳重，openSUSE
    Tumbleweed 是一个滚动发布版本，拥有所有最新功能，并偶尔崩溃。


    openSUSE 是一个备受尊敬的 Linux 发行版，其许多核心贡献者参与了 Linux 内核、LibreOffice、Gnome 等关键 Linux 领域的工作。简而言之，openSUSE
    是专业人士聚集的地方。


    www.openSUSE.org


    '
