    ![](img/f80199d101da92d953f18eaa6205b48e_11_1.png)


    ## DVD INSTALLATION


    Linux Mint 的 DVD 安装只需一张空白 DVD-R 光盘。当然，你还需要一个光驱（DVD 刻录机），才能将 ISO 镜像传输或刻录到光盘上。


    ![](img/f80199d101da92d953f18eaa6205b48e_11_2.png)


    ## VIRTUAL ENVIRONMENT


    安装到虚拟环境是测试和使用 Linux 发行版的常用方法。Linux Mint 在虚拟环境中使用效果极佳，但稍后再详细介绍。有许多不同的虚拟环境应用可用；不过，来自
    Oracle 的 VirtualBox 是其中最易于使用的一种。你可以在 www.virtualbox.org 找到最新版本。


    ![](img/f80199d101da92d953f18eaa6205b48e_12_0.png)


    ## INTERNET CONNECTION


    毋庸置疑，互联网连接对于确保 Linux Mint 保持最新更新和补丁，以及安装更多软件至关重要。虽然你不需要互联网连接也能使用 Linux Mint，但你会错过该发行版可用的大量免费软件。


    ![](img/f80199d101da92d953f18eaa6205b48e_12_1.png)


    ## MAC HARDWARE


    虽然 Linux Mint 可以安装到 Mac 上，但有一种观点建议 Mac 用户使用虚拟环境，例如 Virtualbox 或 Parallels；而且为什么不呢，macOS
    本身已是一个出色的操作系统。如果你想为旧 Mac 注入新活力，请确保它是 Intel CPU 型号，而不是 Power PC 型号。要注意的是，安装到 Mac
    上并没有安装到 PC 上那么无痛。


    ![](img/f80199d101da92d953f18eaa6205b48e_12_2.png)


    ## Desktop Environments


    Linux Mint 有多个不同的版本，或称“风格”：Cinnamon、MATE 和 Xfce；这些还有 32 位和 64 位版本。这到底意味着什么，又该为你的安装选择哪个版本呢？


    ## WHICH MINT?


    桌面环境是你用来与核心 Linux 系统交互的图形界面。就像 Windows 10 的图形桌面也被称为 Fluent Design 一样。


    Linux Mint 为用户提供多种发行版版本选择：Cinnamon、MATE 和 Xfce。虽然这对新手来说可能有点令人困惑，但本质上，每个可用版本都包含相同的核心
    Linux 结构和内核，内核是操作系统的核心，负责处理软件和硬件之间的所有指令。


    那么为什么要使用不同的桌面环境呢？简单来说，这取决于个人喜好。有些用户更喜欢 MATE，因为 MATE 是经典 GNOME 2 环境的一个分支，界面更偏向菜单中心，并在旧电脑上运行良好。其他人更喜欢
    Cinnamon，它是一个更现代的环境，在较新的硬件上运行更好，并具有一些前沿的桌面代码。Xfce 另一方面则是一个轻量级桌面环境，由于其对可用系统资源的极低占用，在旧硬件上运行良好。


    每个版本本质上只是不同的桌面环境，即你用来与操作系统交互的图形用户界面（GUI）。每个桌面环境使用不同的应用来访问或使用系统，例如文件管理器用于浏览操作系统文件结构，或启动其他应用的方式。同样，核心可用的生产力、视频和图形套件是相同的，并且功能方式也相同。


    简而言之，Cinnamon 是 Linux Mint 的旗舰桌面环境。MATE 与更广泛的硬件兼容。举例来说，Windows 只提供一个桌面环境供使用，而
    Linux 则提供许多。Linux Mint 因此选择为用户提供丰富的选择。


    ![](img/f80199d101da92d953f18eaa6205b48e_13_0.png)


    ## A DASH OF CINNAMON


    Cinnamon 的优点远不止外观和手感，尽管这些也是重要因素。在这里，我们概述了一些功能，帮助你判断它是否适合你。


    ## FAB FEATURE 1


    它在较现代的系统上表现出色，但比以前稳定得多，也不再像过去那样占用资源。因此，即使你使用的是旧电脑来安装和测试 Linux Mint，也不要被 Cinnamon
    吓退。


    ## FAB FEATURE 2


    Cinnamon 具有可配置的热角功能，桌面每个角落都可以点击以执行特定任务，例如显示工作区、显示所有窗口或运行命令。热角是切换不同视图的绝佳方式，有助于使桌面环境更高效。


    ![](img/f80199d101da92d953f18eaa6205b48e_14_0.png)


    ## BEST MATE


    MATE 是一个简单易用且直观的 DE，速度快且稳定。与 Cinnamon 相比，它看起来有点过时，但这只是表面现象。MATE 有很多值得喜欢的地方。


    ## FAB FEATURE 1


    MATE 是旧电脑的绝佳桌面环境。它与 Cinnamon 通常支持的硬件组件相比，能更好地兼容更多硬件，同时也能提供同样出色的桌面外观以及高级自定义功能。


    ## FAB FEATURE 2


    由于其高度可配置的特性，MATE 可以精细地进行自定义。对于要求桌面环境提供更多功能的用户来说，有大量选项可用，包括 Compiz 设置，在其中你可以配置各种桌面特效，甚至
    3D 桌面立方体。


    ![](img/f80199d101da92d953f18eaa6205b48e_14_1.png)


    ## CHOLESTEROL FREE DESKTOP


    Xfce 起源于 1996 年的 Common Desktop Environment（CDE）。此后它改过几次名字，现在简单称为 Xfce，外号为“无胆固醇桌面环境”。


    ## FAB FEATURE 1


    Xfce 确实是一个快速的桌面，能发挥 Linux 作为快速操作系统的最佳性能。事实上，它带我们从页面顶部一路来到这里，在新电脑上安装它；写了几百个字，我们就使用了一个全新的操作系统。不错。


    ## FAB FEATURE 2


    快速和轻量并不意味着 Linux Mint Xfce 不是一个完整的桌面操作系统。就像提供的其他环境一样，你可以获得最新的 Firefox、Libreoffice、VLC、Gimp、聊天应用甚至
    BitTorrent 客户端。


    ![](img/f80199d101da92d953f18eaa6205b48e_14_2.png)


    ## Which Distro?


    到目前为止，我们主要讨论了 Linux Mint，但还有其他 Linux 发行版可供尝试。说实话，有数千个 Linux 发行版可供下载和安装，那么你应该选择哪一个使用呢？


    ## DISTRO HOPPING


    Distro hopping 是社区用来形容那些从不坚持使用单一发行版的人的术语。他们在不同的发行版之间跳来跳去，测试、使用，然后转向另一个或新发布的发行版。


    例如，Linux Mint 是一个理想的起点。它易于安装和使用，日常使用的所有软件都已开箱即用，并温和地引导你进入 Linux 的独特世界，了解其工作原理和性能。


    Distro hopping 并无不妥，因为它是一种了解外面有哪些东西的好方法，并发现一个发行版相对于另一个发行版的某些元素是否吸引你。当然，问题在于你最终会使用哪一个？


    Ubuntu 提供大致相同的体验，但方式略有不同。与 Linux Mint 相比，Ubuntu 预装的软件较少，因此你需要手动自行安装。另一个值得考虑的点是，针对
    Ubuntu 用户的海量内容和帮助页面。当你遇到问题时，你永远不会离解决方案太远。


    ![](img/f80199d101da92d953f18eaa6205b48e_15_0.png)


    继续前进，随着你对 Linux 越来越自信，你可能会尝试 openSUSE、Fedora 或 Debian 等。这些都是优秀的发行版，每个都为用户提供了系统运行方式的略微不同视角。有些在
    Linux 技能要求上更苛刻，但本质上它们各自都有宝贵的经验可供用户学习。


    虽然 distro hopping 是好事，但它并不是享受 Linux 并充分利用它的稳定方式。我们并不是说你应该坚持使用一个发行版永不涉足他处，因为那样你会错过大量精彩内容，但我们建议你挑选几个，然后根据你不断增长的
    Linux 技能逐步探索。


    你可能会发现自己转向某个特定发行版，因为它提供了与常态截然不同的东西。例如，Tails Linux 就是一个专为在线匿名而设计的发行版。它包含复杂的军用级加密工具，以及帮助你在不被检测、追踪或监控的情况下浏览网页的工具和浏览器。Kali
    Linux 专为安全专业人员设计，包含多种不同类型的道德黑客工具


    ![](img/f80199d101da92d953f18eaa6205b48e_15_1.png)


