    ### STEP 10

    作为最后的补充，让我们包含上一节中使用的 date 变量。将脚本的最后一行修改为：echo Hello $firstname $surname, how are
    you on this fine $(date +%A)? 输出应显示当前星期几，从系统变量中调用。


    ![](img/f80199d101da92d953f18eaa6205b48e_70_5.png)


    # 创建 Bash 脚本

    – 第 3 部分


    在之前的页面中，我们看了一些非常基础的 Bash 脚本编写，涉及向屏幕输出文本、获取用户输入、存储它并将其输出到屏幕；以及使用 Date 命令包含系统变量。现在让我们结合你迄今为止取得的成果并引入循环。


    ## IF, THEN, ELSE


    在大多数编程结构中，总会有一个需要遍历你输入的命令以创建更好功能，最终创建更好的程序的时候。


    ### STEP 1

    让我们现在来看 If、Then 和 Else 语句，当正确执行时，它们构成一组指令，简单地判断 IF 存在某物，THEN 做某事，ELSE 做不同的事情。创建一个名为
    greeting2.sh 的新脚本并输入下方屏幕截图中的文本


    ![](img/f80199d101da92d953f18eaa6205b48e_71_0.png)


    ### STEP 2

    Greeting2.sh 是 greeting.sh 的副本，但略有不同。这里我们在 if 语句处添加了一个循环。这意味着，如果输入的变量等于 David，则下一行，THEN，是对发生的事情的反应，在本例中它将向屏幕输出‘Awesome
    name,’ 后跟变量（即 David）。


    ![](img/f80199d101da92d953f18eaa6205b48e_71_2.png)


    ### STEP 3

    下一行，ELSE，是如果变量不等于‘David’时会发生什么。在本例中它只是输出现在熟悉的‘Hello...’。最后一行，Fi 语句，是将结束循环的命令。如果你有
    If 命令而没有 Fi 命令，则会出错。


    ![](img/f80199d101da92d953f18eaa6205b48e_71_1.png)


    ### STEP 4

    你显然可以稍微玩一下脚本，更改触发响应的名字变量；或者甚至在名字和姓氏变量匹配特定变量时发出响应。


    ![](img/f80199d101da92d953f18eaa6205b48e_71_3.png)


    # 更多循环


    你可以使用 FOR、WHILE 和 UNTIL 语句对数据进行循环。如果需要计数器进行批量命名、复制或运行脚本时，这些会很有用。


    ### STEP 1

    创建一个名为 count.sh 的新脚本。输入下方屏幕截图中的文本，保存并使其可执行。这会创建变量 ''count''，脚本开始时等于零。然后开始 WHILE
    循环，只要 WHILE count 小于（LT 部分）100，就会打印 echo 命令中 count 的当前值。


    ```

    #!/bin/bash


    count=0


    while [ $count -lt 100 ]; do

    echo $count

    let count=count+1

    ```


    ### STEP 2

    执行 count.sh 脚本将导致数字 0 到 99 列出在终端屏幕上；当达到 100 时脚本将结束。使用 FOR 语句修改脚本，其工作方式大致相同。要在我们的脚本中使用它，请将屏幕截图中的文本输入到
    count.sh 脚本中。


    ```

    #!/bin/bash


    for count in {0..100}; do

    echo $count

    let count=count+1

    done

    ```


    ### STEP 3

    我们在这里添加的是：for count in {0..100}; do。意思是：FOR 变量 ''count'' IN 从零到一百的数字，然后开始循环。脚本的其余部分相同。运行此脚本，终端中应出现相同的输出。


    ```

    #!/bin/bash


    for count in {0..100}; do

    echo $count

    let count=count+1

    done

    ```


    ### STEP 4

    UNTIL 循环的工作方式与 WHILE 循环非常相似，只是更经常地是反向的。因此，我们使用 UNTIL 计数到一百，将是：until [ $count -gt
    100 ]; do。不同之处在于，UNTIL count 大于（gt 部分）一百，继续循环。


    ```

    #!/bin/bash


    until [ $count -gt 100 ]; do

    echo $count

    let count=count+1

    done

    ```


    ### STEP 5

    你不仅限于数字零到一百。你可以在循环中拥有任何你喜欢的命令集，并根据你希望循环运行的次数执行它们多次。例如，重命名一百万个文件，创建五十个文件夹等。例如，此脚本将使用
    FOR 循环创建十个名为 folder1 到 folder10 的文件夹。


    ```

    #!/bin/bash


    for count in {0..10}; do

    mkdir Folder$count

    let count=count+1

    done

    ```


    ### STEP 6

    再次使用 FOR 语句，我们可以通过操作 {0..100} 部分来执行计数序列。代码的这一部分实际上意味着 {START..END..INCREMENT}。如果没有增量，则只是从开始到
    END 的单个数字。例如，我们可以让循环以 2 为步长计数到 1000：for count in {0..1000..2}; do。


    ```

    #!/bin/bash


    for count in {0..1000..2}; do

    echo $count

    let count=count+1

    done

    ```


