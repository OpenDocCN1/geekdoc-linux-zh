    ## Installing Linux in a Virtual Environment


    ## STEP 5


    The pop-up window that appears after clicking Create is asking you what type of
    virtual hard disk you want to create. We’re going to use the default VDI (VirtualBox
    Disk Image) in this case, as the others are often used to move VMs from one VM
    application to the next. Make sure VDI is selected and click Next.


    ![](img/f80199d101da92d953f18eaa6205b48e_26_0.png)


    ## STEP 8


    After clicking Create the initial setup of the VM is complete; you should now
    be looking at the newly created VM within the VirtualBox application. Before you
    begin though, click the Settings button and within the General section click the
    Advanced tab. Using the pull-down menus, choose ‘Bidirectional’ for both Shared
    Clipboard and Drag’n’Drop.


    ![](img/f80199d101da92d953f18eaa6205b48e_26_1.png)


    ## STEP 6


    The question of whether to opt for Dynamically or Fixed sized virtual hard disks
    may come across as being somewhat confusing to the newcomer. A Dynamically Allocated
    virtual hard disk is a more flexible storage management option and won’t take
    up much space within your physical hard disk to begin with. Ensure Dynamically
    Allocated is selected and click Next.


    ![](img/f80199d101da92d953f18eaa6205b48e_26_2.png)


    ## STEP 9


    Follow that by clicking on the System section, then the Processor tab. Depending
    on your CPU, as many cores as you can without detriment to your host system; we’ve
    opted for two CPUs. Now click on the Display section, slide the Video Memory up
    to the maximum and tick ‘Enable 3D Acceleration’. Click OK to commit the new settings.


    ![](img/f80199d101da92d953f18eaa6205b48e_26_3.png)


    ## STEP 7


    The virtual hard disk is a single folder, up to the size you state in this section.
    Ensure the location of the virtual hard disk, on your computer, has enough free
    space available. For example, we’ve used a bigger storage option on our D:\ drive,
    named it Linux Mint and allocated 25.50GB of space to the virtual hard disk.


    ![](img/f80199d101da92d953f18eaa6205b48e_26_4.png)


    ## STEP 10


    Click on the Start button and use the explorer button (a folder with a green arrow)
    in the ‘Select Start-up Disk’ window to locate the downloaded ISO of Mint; then
    click Start to boot the VM with the Linux Mint Live Environment. You can now install
    Linux as per the standard PC installation requirements.


    ![](img/f80199d101da92d953f18eaa6205b48e_26_5.png)


    ## Getting to Know Linux


    > "Anyone can build a fast processor. The trick is to build a fast system."

    > — Seymour Cray (Electrical Engineer, and designer/founder of Cray Supercomputers)


    We''ve used Linux Mint as a guideline here, as it''s an easy to use distro and
    perfect for former Windows users. It''s also one of the most developed and well
    documented Linux distros as well as having some fantastic configuration options.


    In this section, we introduce the Linux Mint Cinnamon Menu and Desktop Environment,
    how it works and what you can do to customise it. Want to create another user
    or even discover how to become anonymous online? Then read on.


    - 30 Introduction to the Cinnamon Menu

    - 32 Navigating the Cinnamon Desktop

    - 34 10 Things to do After Installing Linux Mint

    - 36 Did You Know...Apollo 11

    - 38 Creating Users

    - 40 Customising the Desktop

    - 42 Becoming Anonymous Online


    ![](img/f80199d101da92d953f18eaa6205b48e_28_0.png)


    ## Introduction to the Cinnamon Menu


    Now that you have Linux installed it’s time to have a good look around. First
    though, if you’re using Virtualbox you’ll have a notification regarding Software
    Rendering; here’s how to fix it.


    ### CINNAMON VIRTUALBOX FIX


    You’ve already looked at some list functions, using insert, remove, and pop but
    there are also functions that can be applied to strings.


    ### STEP 1

    Before we begin, we’re assuming you’re having this issue within Virtualbox. The
    Software Rendering message appears in the top right of the desktop. To fix this,
    click on Devices in the Virtualbox window, followed by Insert Guest Additions
    CD image.


    ### STEP 3

    After a moment or two you’re automatically dropped into a command line view, called
    the Terminal in Linux. This details the installation of the new VirtualBox drivers,
    removing any old drivers it has detected, and installing the latest versions.
    It won’t take long and when it’s done you will be asked to hit Return to exit
    the Terminal.


    ![](img/f80199d101da92d953f18eaa6205b48e_29_0.png)


    ![](img/f80199d101da92d953f18eaa6205b48e_29_1.png)


    ### STEP 2

    The Guest Additions CD contains drivers for Virtualbox, including the virtual
    video hardware. When it’s loaded in, you get a ‘software needs running’ notification
    box with two options, Cancel and Run. Click the Run button and enter your Linux
    user password.


    ### STEP 4

    The Virtualbox Additions CD icon is on the desktop, so right-click it and then
    scroll down the menu to click Eject. You can now restart Linux Mint by clicking
    the Menu, the bottom icon in the strip to the left, then the Restart button. This
    reboots Mint and the problem is fixed.


    ![](img/f80199d101da92d953f18eaa6205b48e_29_2.png)


    ![](img/f80199d101da92d953f18eaa6205b48e_29_3.png)


    ## CINNAMON ON THE MENU


    Now the Software Rendering issue for Virtualbox users is out of the way, let’s
    take a look at the Mint Menu and how it all works. Remember, this is just for
    Mint Cinnamon, other distros look and behave differently.


    ### STEP 1


    First off, you may have already noticed the Welcome Screen that pops up when you
    login to Linux Mint. Take a moment to browse through the options, read the First
    Steps option and so on. When you’re done, click the X in the top right corner
    of the window to close it.


    ![](img/f80199d101da92d953f18eaa6205b48e_30_0.png)


    ### STEP 4


    Open up the Menu again but this time hover the mouse pointer over Graphics, then
    click on GNU Image Manipulation Program. GIMP is a powerful image manipulation
    app that’s probably as effective as Adobe’s Photoshop but requires a little more
    work to get the results you want. It’s certainly worth taking the time to master,
    though.


    ![](img/f80199d101da92d953f18eaa6205b48e_30_1.png)


    ### STEP 2


    You’ve already used the Mint Menu to reboot the system and when you first used
    the Live Environment. This time, click the Menu button and hover over the Office
    entry in the middle column. This changes the icons represented in the right-hand
    column, detailing what apps are installed under that section.


    ![](img/f80199d101da92d953f18eaa6205b48e_30_2.png)


    ### STEP 5


    If you’re looking for a particular function or app, such as setting up a printer,
    click on the Search box at the top of the Menu box. Start typing the app or function
    you want, such as printers, and the Mint Menu displays the relevant options below.
    This works with most modern Linux menus, regardless of the distro.


    ![](img/f80199d101da92d953f18eaa6205b48e_30_3.png)


    ### STEP 3


    Launching any of the apps from the Menu is as simple as finding one and clicking
    it. For example, under the Office section, click on LibreOffice Writer. Writer
    is the preinstalled word processor for Linux Mint. It opens and saves as Microsoft
    Word and functions in almost the same way.


    ![](img/f80199d101da92d953f18eaa6205b48e_30_4.png)


    ### STEP 6


    Hover over any of the apps listed on the right-hand column and right-click, to
    be presented with a list of options: Add to Panel, Add to Desktop, Add to Favourites
    and Uninstall. Most of these options are obvious in their use. Add to Favourites
    though places the app in the left-hand, quick-access column.


    ![](img/f80199d101da92d953f18eaa6205b48e_30_5.png)


    ## Navigating the Cinnamon Desktop


    Each desktop environment behaves differently to that of the next. Some DEs offer
    widgets that can be customised and placed on the desktop, others instead opt for
    a clean, sharp look to keep everything running as fast as possible. Let’s see
    what the Cinnamon desktop has to offer.


    ### A TOUCH OF SPICE


    The Cinnamon desktop environment is a great blend of style and performance. There’s
