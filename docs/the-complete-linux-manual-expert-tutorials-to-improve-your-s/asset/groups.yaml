    # STEP 5


    Additional functions can be added to Python through modules. Python has a vast
    range of modules available that can cover numerous programming duties. They add
    functions and can be imported as and when required. For example, to use advanced
    Mathematics functions enter:


    ```

    import math

    ```


    Once entered, you have access to all the Math module functions.


    # STEP 6


    To use a function from a module enter the name of the module followed by a full
    stop, then the name of the function. For instance, using the Math module, since
    you’ve just imported it into Python, you can utilise the square root function.
    To do so, enter:


    ```

    math.sqrt(16)

    ```


    You can see that the code is presented as module.function(data).


    ![](img/f80199d101da92d953f18eaa6205b48e_110_0.png)


    ![](img/f80199d101da92d953f18eaa6205b48e_110_1.png)


    # FORGING FUNCTIONS


    There are many different functions you can import created by other Python programmers
    and you will undoubtedly come across some excellent examples in the future; you
    can also create your own with the def command.


    # STEP 1


    Choose File > New File to enter the editor, let’s create a function called Hello,
    that greets a user. Enter:


    ```

    def Hello():

    print("Hello")


    Hello()

    ```


    Press F5 to save and run the script. You can see Hello in the Shell, type in Hello()
    and it returns the new function.


    # STEP 3


    To modify it further, delete the Hello("David") line, the last line in the script
    and press Ctrl+S to save the new script. Close the Editor and create a new file
    (File > New File). Enter the following:


    ```

    from Hello import Hello


    Hello("David")

    ```


    Press F5 to save and execute the code.


    ![](img/f80199d101da92d953f18eaa6205b48e_110_2.png)


    ![](img/f80199d101da92d953f18eaa6205b48e_110_3.png)


    # STEP 2


    Let’s now expand the function to accept a variable, the user’s name for example.
    Edit your script to read:


    ```

    def Hello(name):

    print("Hello", name)


    Hello("David")

    ```


    This will now accept the variable name, otherwise it prints Hello David. In the
    Shell, enter: name=("Bob"), then: Hello(name). Your function can now pass variables
    through it.


    # STEP 4


    What you’ve just done is import the Hello function from the saved Hello.py program
    and then used it to say hello to David. This is how modules and functions work:
    you import the module then use the function. Try this one, and modify it for extra
    credit:


    ```

    def add(a, b):

    result = a + b

    return result

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_110_4.png)


