  - "[PAGE 54]\n\n# Linux Kernel 0.01\n\n# Did You Know...\n\n```\nconsole.c\n\n/*\n\
    \ * This module implements the console I/O functions\n * Linux console driver\n\
    \ *\n * Hopefully this will be a rather complete VT102 implementation.\n */\n\n\
    /* NOTE: We sometimes disable and enable interrupts for a short while\n * to put\
    \ a word in video RAM, but this will work even for keyboard\n * interrupts. We\
    \ know interrupts aren't enabled when getting a keyboard\n * interrupt, as we\
    \ use trap-gates. Hopefully all is well.\n */\n\n#include <linux/sched.h>\n#include\
    \ <linux/tty.h>\n#include <asm/io.h>\n#include <asm/system.h>\n\n#define SCREEN_START\
    \ 0xb8000\n#define SCREEN_END   0xbffff\n#define LINES 25\n#define COLUMNS 80\n\
    #define SPAR 16\n\nextern void keyboard_interrupt(void);\n\nstatic unsigned long\
    \ origin=SCREEN_START;\nstatic unsigned long scr_end=SCREEN_START+LINES*COLUMNS*2;\n\
    static unsigned long pos;\nstatic unsigned long top;\nstatic unsigned long bottom=LINES;\n\
    static unsigned long lines=LINES*COLUMNS;\nstatic unsigned long state;\nstatic\
    \ unsigned long spar_pos=SPAR;\nstatic unsigned long spar_char;\nstatic unsigned\
    \ long spar_attr=0x07;\n```\n\nDID YOU KNOW... that the first Linux kernel, as\
    \ programmed by Linus Torvalds, only occupied 65KB of memory? And that since version\
    \ 0.01, the Linux kernel now boasts over 18 million lines of code. Not bad for\
    \ a university project that now runs the New York Stock Exchange, and powers the\
    \ US Department of Defence’s fleet of nuclear submarines."
  - '[PAGE 55]


    # Creating a File Using the Terminal


    Using the Terminal, you’re able to create folders, files and even execute Linux
    Mint apps. In truth, if you didn’t have the GUI at hand, you could still accomplish
    the same from the Terminal.


    # MORE TERMINAL WORK


    Creating content using the Terminal isn’t quite as strenuous as it may first appear.
    Yes, the Terminal can look a daunting place for the newcomer, but once mastered
    it’s really quite intuitive.


    STEP 1 Open up the Terminal, and make sure you’re in the Home folder. If not use
    the cd ~ command to return you to the Home folder from wherever you’re currently
    located.


    ![](img/f80199d101da92d953f18eaa6205b48e_55_0.png)


    STEP 3 Your command line should change to the Test folder and if you enter ls
    (List folder contents) there’ll be nothing within the folder, as you’ve just created
    it. The mkdir command is fairly self explanatory: Make Directory followed by the
    name of your choosing.


    ![](img/f80199d101da92d953f18eaa6205b48e_55_1.png)


    STEP 2 Let’s start by creating a new folder within Home, and call it Test. The
    command you’ll need is mkdir Test. Press Enter to create the folder when you’ve
    typed in the command, then cd Test and press Enter. This will Change Directory
    (hence CD) to the newly created Test folder.


    ![](img/f80199d101da92d953f18eaa6205b48e_55_2.png)


    STEP 4 To create an empty text file, called Test.txt, enter in the Terminal: touch
    Test.txt. You can then use ls to view the new file in the folder. Touch is a standard
    Linux command that allows the creation of files without the need to open a text
    editor, save the file, then close the editor.


    ![](img/f80199d101da92d953f18eaa6205b48e_55_3.png)'
  - '[PAGE 56]


    # Creating a File Using the Terminal


    # STEP 5


    Let’s say you now wanted to create a text file, we’ll call it Test2.txt, complete
    with some content. To do so, enter: cat > Test2.txt. This will create the file
    Test2.txt and put the Terminal into an editing mode.


    ![](img/f80199d101da92d953f18eaa6205b48e_56_0.png)


    # STEP 6


    You’ll notice that the cursor is flashing below the cat > Test2.txt command, without
    the usual prompt. This editing mode will allow you enter the text that the file
    will contain. Enter some text, then press Ctrl+D to exit and write the contents
    to the file.


    ![](img/f80199d101da92d953f18eaa6205b48e_56_1.png)


    # STEP 7


    Of course you don’t always have to use the Terminal to enter text into a file.
    Mint comes with a text editor called Xed, which is similar to Windows’ Notepad.
    To view the previously created file in Xed, type into the Terminal: xed Test2.txt,
    and press Enter.


    ![](img/f80199d101da92d953f18eaa6205b48e_56_2.png)


    # STEP 8


    Xed is a GUI app, and you can enter text and save the file, or any file, accordingly
    by using the app’s main window, and the File > Save, or File > Save As functions
    from its top menu bar options.


    ![](img/f80199d101da92d953f18eaa6205b48e_56_3.png)


    # STEP 9


    If, however, you prefer to remain working in the Terminal to edit/save/create
    files, you can use Nano. Nano is a simple Terminal-based text editor. To try it
    with the example, enter: nano Test2.txt. There’s a menu along the bottom of the
    screen. To edit and save any content in Nano, press Ctrl+X and follow the on-screen
    instructions.


    ![](img/f80199d101da92d953f18eaa6205b48e_56_4.png)


    # STEP 10


    We’ve used the Terminal to launch a Mint app, Xed, but any app can be launched
    from within the Terminal. For example, try: firefox, and press Enter. Close Firefox
    to return to the Terminal. Providing you know the name of the app, it can run
    from the Terminal. Additionally, entering firefox& opens Firefox, AND lets you
    still use the Terminal.


    ![](img/f80199d101da92d953f18eaa6205b48e_56_5.png)'
  - '[PAGE 57]


    # Creating and Removing Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you prefer. Directories form the structure of your file system,
    without logical directories the filing system would be in utter chaos.


    # MANAGING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here''s the basics for you to try out.


    STEP 1

    With the Terminal open enter cd ~ to make sure you''re in your own Home directory.
    Now enter ls to view the current folders you have housed in the Home directory.
    You''ll notice that folders are labelled in Mint in cyan (light blue). Let''s
    start by creating a new directory. Enter: mkdir testdir.


    ![](img/f80199d101da92d953f18eaa6205b48e_57_0.png)


    STEP 3

    If you were to enter the command again, mkdir testdir, you''ll receive a message
    stating: mkdir: cannot create directory ''testdir'': File exists. It goes without
    saying then, that you''re only able to have one uniquely named directory within
    the current directory. However, as Linux is case-sensitive, you can have Testdir,
    TestDir, testDir and so on.


    ![](img/f80199d101da92d953f18eaa6205b48e_57_1.png)


    STEP 2

    If you now enter ls again, you''ll see that the new directory, testdir, has been
    created alongside the other directories in the Home area. Obviously the command
    mkdir is what creates the directory, and no doubt you''ve already guessed it stands
    for Make Directory.


    ![](img/f80199d101da92d953f18eaa6205b48e_57_2.png)


    STEP 4

    You can create directories within directories you''ve already created. For example,
    enter the testdir directory with cd testdir/ followed by ls to list the folder
    structure. Naturally there''s nothing present, as you''ve just created the directory.
    Now drop back to Home with cd -, and enter mkdir testdir/reports. Go back to the
    testdir, cd testdir/, and ls again.


    ![](img/f80199d101da92d953f18eaa6205b48e_57_3.png)'
  - '[PAGE 58]


    # Creating and Removing Directories


    # STEP 5


    The command to create directories is quite logical, therefore. You’ll create the
    directory, and any sub-directories within. However, what if you want to create
    a directory and a sub-directory in a single command? Make sure you’re at Home
    (cd ~) and enter: mkdir -p Temp/finances. Now, cd Temp/, and ls to list the new
    directory.


    ![](img/f80199d101da92d953f18eaa6205b48e_58_0.png)


    # STEP 6


    The -p option is what enables the mkdir command to create the sub-directory as
    well as the parent directory. In Linux, commands always follow the same structure:
    Command, Option, and Argument. In the previous step example, command (mkdir),
    option (-p), and argument (Temp/finances).


    ![](img/f80199d101da92d953f18eaa6205b48e_58_1.png)


    # STEP 7


    If you want to drill down into the various options available for the mkdir command,
    you can enter mkdir --help into the Terminal. This will provide a quick help guide
    detailing the options and how the command structure works.


    ![](img/f80199d101da92d953f18eaa6205b48e_58_2.png)


    # STEP 8


    Now that we’ve created some directories, let’s see about removing them. Start
    by entering the testdir directory and listing its contents: cd testdir/, then
    ls. The previously created reports sub-directory is present. One way to remove
    it is to enter: rmdir reports, then ls again to confirm it’s not there.


    ![](img/f80199d101da92d953f18eaa6205b48e_58_3.png)


    # STEP 9


    A quick warning: removing a directory in the Terminal doesn’t place it in the
    Mint Rubbish Bin, via Nemo file manager. The same goes for any files, too. If
    you remove a directory from the Terminal command then it’s gone for good.


    ![](img/f80199d101da92d953f18eaa6205b48e_58_4.png)


    # STEP 10


    Rmdir will only remove empty directories, to remove directories containing sub-directories,
    or even files, you’ll need to use the rm command with the -R option. For example,
    on the Temp/finance directories, use rm -R Temp. A quick ls reveals that the parent
    folder and all of its contents are removed. Careful when using this command.


    ![](img/f80199d101da92d953f18eaa6205b48e_58_5.png)'
