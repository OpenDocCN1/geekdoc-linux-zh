    ## Creating Users


    创建用户


    你第一次安装 Linux Mint 时，它是为单用户使用而配置的。虽然与全家人共享一个用户账户是可以的，但可能有一天你需要创建具有各自唯一主文件夹的独立用户。


    ## NEW USERS


    拥有不同用户意味着每个用户都可以访问系统上的自己的区域。文档、图片、视频等都是分开的，就像其他操作系统中的多用户一样。


    ## STEP 1


    点击 Linux Mint 菜单并输入“users”开始搜索相关控制台。从搜索结果中选择用户和组并输入你的密码。用户和组控制台看起来很基础，但使用起来很简单。起初，你只能看到安装
    Linux Mint 时自己的用户名。


    ![](img/f80199d101da92d953f18eaa6205b48e_37_0.png)


    ## STEP 3


    输入新用户的全名，然后输入他们在登录 Linux Mint 时需要的用户名。确保用户名全部为小写，仅包含 a-z 和 0-9 字符。你也可以使用句点、下划线或连字符。当准备继续时点击添加按钮。


    ![](img/f80199d101da92d953f18eaa6205b48e_37_1.png)


    ## STEP 2


    要添加新用户，点击控制台底部的添加按钮。你可以创建两种类型的用户，标准用户和管理员。除非新用户需要安装新应用或访问其主文件夹之外的文件系统部分，否则选择标准账户类型。否则，使用管理员账户类型。


    ![](img/f80199d101da92d953f18eaa6205b48e_37_2.png)


    ## STEP 4


    新用户会按字母顺序出现在当前 Linux Mint 用户列表中。目前尚未设置密码，因此点击当前用户列表中的用户，然后点击用户名字符串下方的未设置密码选项。


    ![](img/f80199d101da92d953f18eaa6205b48e_37_3.png)


