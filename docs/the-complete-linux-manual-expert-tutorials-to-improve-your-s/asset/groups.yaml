    \ this example.\n\nYou can alter the code including the aforementioned cout.precision\
    \ function, for greater accuracy. Take precision all the way up to 22 decimal\
    \ places, with the following code:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\ndouble PI = 3.141592653589793238463;\n```\n\n```\nint main()\n{\n    cout.precision(22);\n\
    \    cout << PI;\n}\n```\n"
  mdcn: "\n\n## C++ 注释\n\n在 C++ 中注释使用双斜杠 '//' 或斜杠加星号 '/*'。你已经见过一些简短的示例，但它们的工作方式如下。\n\
    \n### STEP 1\n\n以 Hello World 代码为例，你可以使用双斜杠轻松地对代码的不同部分进行注释：\n\n```\n//My first\
    \ C++ program cout << \"Hello, world!\\n\";\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_130_0.png)\n\
    \n### STEP 4\n\n在注释时要小心，特别是块注释。很容易忘记添加闭合的星号和斜杠，从而使注释块内的任何代码失效。\n\n![](img/f80199d101da92d953f18eaa6205b48e_130_1.png)\n\
    \n### STEP 2\n\n不过，你也可以在代码行的末尾添加注释，以更好地描述正在发生的事情：\n\n```\ncout << \"Hello, world!\\\
    n\"; //This line outputs the words 'Hello, world!'. The \\n denotes a new line.\n\
    ```\n\n注意，注释末尾不需要加分号。因为编译器会忽略它这一行代码。\n\n![](img/f80199d101da92d953f18eaa6205b48e_130_2.png)\n\
    \n### STEP 5\n\n显然，如果你尝试构建和执行代码，它会报错，抱怨缺少大括号 '}' 来结束代码块。如果你多次犯此错误，则可能需要花费大量时间返回并纠正。幸运的是，Geany\
    \ 中的颜色编码有助于区分注释和代码。\n\n![](img/f80199d101da92d953f18eaa6205b48e_130_3.png)\n\n\
    ### STEP 3\n\n你可以使用斜杠和星号注释多行：\n\n```\n/* This comment can\n cover several lines\n\
    \ without the need to add more slashes */\n```\n\n只需记住用相反的星号和斜杠结束块注释。\n\n![](img/f80199d101da92d953f18eaa6205b48e_130_4.png)\n\
    \n### STEP 6\n\n对于块注释，在 C++ 中在注释块的每一行添加星号是一种良好的做法。这也有助于你记住在继续编写代码之前关闭注释块：\n\n\
    ```\n/* This comment can\n * Cover several lines\n * Without the need to add more\
    \ slashes */\n```\n\n幸运的是，Geany 会自动执行此操作，但在其他 IDE 中使用时请注意这一点。\n\n```\n/* This\
    \ comment can\n * cover several lines\n * without the need to add more slashes\
    \ */\n```\n\n## 变量\n\n使用 C++ 时变量与使用 Python 时略有不同。在 Python 中，你只需说明 ‘a’ 等于 10，变量就会被分配。然而，在\
    \ C++ 中，变量在使用前必须先声明其类型。\n\n### THE DECLARATION OF VARIABLES\n\n你可以通过代码中的语句声明 C++\
    \ 变量。你可以声明几种不同的变量类型。它的工作原理如下。\n\n### STEP 1\n\n打开一个新空白 C++ 文件并输入通常的代码头：\n\n```\n\
    #include <iostream>\nusing namespace std;\n\nint main()\n{\n}\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_131_0.png)\n\
    \n### STEP 2\n\n先从简单开始，创建两个变量 a 和 b，一个值为 10，另一个为 5。你可以使用数据类型 int 声明这些变量。在大括号内输入：\n\
    \n```\nint a;\nint b;\n\na = 10;\nb = 5;\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_131_1.png)\n\
    \n### STEP 3\n\n你可以构建并运行代码，但它不会做太多事情，只是将值 10 和 5 存储到整数 a 和 b 中。忽略关于变量设置但未使用的警告，代码仍然有效。要输出变量的内容，请添加：\n\
    \n```\ncout << a;\ncout << \"\\n\";\ncout << b;\n```\n\ncout << \"\\n\"; 部分只是在输出\
    \ 10 和 5 之间放置一个新行。\n\n![](img/f80199d101da92d953f18eaa6205b48e_131_2.png)\n\n\
    ### STEP 4\n\n自然地，你可以声明一个新变量，称为 result 并输出一些简单的算术运算：\n\n```\nint result;\n\nresult\
    \ = a + b;\ncout << result;\n```\n\n按照屏幕截图将以上内容插入代码中。\n\n![](img/f80199d101da92d953f18eaa6205b48e_131_3.png)\n\
    \n### STEP 5\n\n你可以在声明变量时立即为其赋值。你输入的代码可以如下所示：\n\n```\nint a = 10;\nint b = 5;\n\
    int result = a + b;\n\ncout << result;\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_0.png)\n\
    \n### STEP 6\n\n特定于 C++，你也可以使用以下方法在声明变量时立即为其赋值：\n\n```\nint a (10);\nint b (5);\n\
    ```\n\n然后，从 C++2011 标准开始，使用大括号：\n\n```\nint result {a+b};\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_1.png)\n\
    \n### STEP 7\n\n你可以创建全局变量，即在任何函数之外声明并在整个代码中的任何函数中使用的变量。到目前为止你使用的是局部变量：在函数内部使用的变量。例如：\n\
    \n```\n#include <iostream>\nusing namespace std;\nint StartLives = 3;\n\nint main\
    \ ()\n{\n    StartLives = StartLives - 1;\n    cout << StartLives;\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_2.png)\n\
    \n### STEP 8\n\n上一步创建了变量 StartLives，它是一个全局变量。例如在游戏中，玩家的生活取决于他们表现的好坏。当玩家重新开始游戏时，StartLives\
    \ 会返回到其默认状态 3。在这里我们分配了 3 条生命，然后减去 1，剩下 2 条生命。\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_3.png)\n\
    \n### STEP 9\n\n现代 C++ 编译器比大多数程序员给予它的信用更智能。虽然你可以为变量声明许多数据类型，但实际上你可以使用 auto 功能：\n\
    \n```\n#include <iostream>\nusing namespace std;\nauto pi = 3.141593;\n\nint main()\n\
    {\n    double area, radius = 1.5;\n    area = pi * radius * radius;\n    cout\
    \ << area;\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_4.png)\n\n###\
    \ STEP 10\n\n虽然我们说在第 3 步中忽略警告，但警告和错误之间存在区别。在这种情况下，它只是一个简单的警告。新的数据类型 double 表示双精度浮点值，这使得代码更准确。结果应为\
    \ 7.06858。从本质上讲，你通常可以处理警告，但不能处理错误。\n\n![](img/f80199d101da92d953f18eaa6205b48e_132_5.png)\n\
    \n## 数据类型\n\n变量，如你所见，存储程序员稍后可以调用并根据需要操作的信息。变量只是保留的内存位置，存储程序员根据使用的数据类型分配的值。\n\n\
    ### THE VALUE OF DATA\n\n在 C++ 中，程序员可用的数据类型有很多，例如整数、浮点数、布尔值、字符等等。人们普遍认为有七种基本数据类型，通常称为原始内置类型；然而，如果代码中需要，你也可以创建自己的数据类型。\n\
    \n| Type | Command |\n|---|---|\n| Integer | int |\n| Floating Point | float |\n\
    | Character | char |\n| Boolean | bool |\n| Double Floating Point | double |\n\
    | Wide Character | wchar_t |\n| No Value | void |\n\n通过添加 cout.precision() 函数并在括号内添加值，但即使这样你仍然受限于\
    \ double 数据类型的精度。例如，尝试以下代码：\n\n```\n#include <iostream>\nusing namespace std;\n\
    double PI = 3.141592653589793238463;\n```\n\n```\nint main()\n{\n    cout << PI;\n\
    }\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_133_0.png)\n\n这些基本类型还可以使用以下修饰符进行扩展：Long、Short、Signed\
    \ 和 Unsigned。基本上，这意味着修饰符可以扩展每种数据类型的最小和最大范围值。例如，int 数据类型的默认值范围为 -2147483648 到 2147483647，你会同意这是一个相当大的值。\n\
    \n现在，如果你使用其中一个修饰符，范围就会改变：\nUnsigned int = 0 to 4294967295\nSigned int = -2147483648\
    \ to 2147483647\nShort int = -32768 to 32767\nUnsigned Short int = 0 to 65,535\n\
    Signed Short int = -32768 to 32767\nLong int = -2147483647 to 2147483647\nSigned\
    \ Long int = -2147483647 to 2147483647\nUnsigned Long int = 0 to 4294967295\n\n\
    自然地，你可以使用没有修饰符的基本类型，因为每种数据类型都提供了足够的范围。然而，使用修饰符被认为是良好的 C++ 编程实践。\n\n使用修饰符时也有问题。Double\
    \ 表示双精度浮点值，你可以用它表示非常精确的数字，但这些数字仅精确到小数点后第十五位。还有一个问题是使用 cout 函数在 C++ 中显示此类数字时，cout\
    \ 默认只输出前五位小数。你可以通过\n\n构建并运行代码，你可以看到输出仅为 3.14159，这代表了此示例中 cout 的限制。\n\n你可以更改代码，包括前面提到的\
    \ cout.precision 函数，以获得更高的精度。将精度提高到小数点后 22 位，使用以下代码：\n\n```\n#include <iostream>\n\
    using namespace std;\ndouble PI = 3.141592653589793238463;\n```\n\n```\nint main()\n\
    {\n    cout.precision(22);\n    cout << PI;\n}\n```\n\n"
