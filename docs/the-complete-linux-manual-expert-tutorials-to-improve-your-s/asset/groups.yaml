    ## USEFUL HELP/INFO COMMANDS


    The following commands are useful for when you are trying to learn more about
    the system or program you are working with in Linux. You might not need them every
    day, but when you do, they will be invaluable.


    free

    The free command displays the total amount of free and used physical and swap
    memory in the system. For example, free -m gives the information using megabytes.


    sed

    The sed command opens a stream editor. A stream editor is used to perform text
    transformations on an input stream: a file or input from a pipeline.


    df

    The df command displays filesystem disk space usage for all partitions. The command
    df -h is probably the most useful (the -h means human-readable).


    adduser

    The adduser command adds a new user to the system. Similarly, the addgroup command
    adds a new group to the system.


    top

    The top program provides a dynamic real-time view of a running system. It can
    display system summary information, as well as a list of processes.


    deluser

    The deluser command removes a user from the system. To remove the user''s files
    and home directory, you need to add the -remove-home option.


    uname -a

    The uname command with the -a option prints all system information, including
    machine name, kernel name, version and a few other details.


    delgroup

    The delgroup command removes a group from the system. You cannot remove a group
    that is the primary group of any users.


    ps

    The ps command allows you to view all the processes running on the machine. Every
    operating system''s version of ps is slightly different but all do the same thing.


    man man

    The man man command brings up the manual entry for the man command, which is a
    great place to start when using it.


    grep

    The grep command allows you to search inside a number of files for a particular
    search pattern and then print matching lines. An example would be: grep blah file.


    man intro

    The man intro command is especially useful. It displays the Introduction to User
    Commands, which is a well written, fairly brief introduction to the Linux command
    line.


    ## A-Z of Linux Commands


    There are literally thousands of Linux commands, so while this is not a complete
    A-Z, it does contain many of the commands you will most likely need. You will
    probably find that you end up using a smaller set of commands over and over again
    but having an overall knowledge is still very useful.


