    \ can be launched from within the Terminal. For example, try: firefox, and press\
    \ Enter. Close Firefox to return to the Terminal. Providing you know the name\
    \ of the app, it can run from the Terminal. Additionally, entering firefox& opens\
    \ Firefox, AND lets you still use the Terminal.\n\n![](img/f80199d101da92d953f18eaa6205b48e_56_5.png)\n\
    \n## Creating and Removing Directories\n\nAs with creating files in the Terminal,\
    \ you can also create and delete directories, or folders if you prefer. Directories\
    \ form the structure of your file system, without logical directories the filing\
    \ system would be in utter chaos.\n\n### MANAGING FOLDERS\n\nLearning how to create\
    \ and delete folders in the Terminal is an important Mint, and indeed Linux overall,\
    \ skill to master. Here's the basics for you to try out.\n\nSTEP 1\nWith the Terminal\
    \ open enter cd ~ to make sure you're in your own Home directory. Now enter ls\
    \ to view the current folders you have housed in the Home directory. You'll notice\
    \ that folders are labelled in Mint in cyan (light blue). Let's start by creating\
    \ a new directory. Enter: mkdir testdir.\n\n![](img/f80199d101da92d953f18eaa6205b48e_57_0.png)\n\
    \nSTEP 3\nIf you were to enter the command again, mkdir testdir, you'll receive\
    \ a message stating: mkdir: cannot create directory 'testdir': File exists. It\
    \ goes without saying then, that you're only able to have one uniquely named directory\
    \ within the current directory. However, as Linux is case-sensitive, you can have\
    \ Testdir, TestDir, testDir and so on.\n\n![](img/f80199d101da92d953f18eaa6205b48e_57_1.png)\n\
    \nSTEP 2\nIf you now enter ls again, you'll see that the new directory, testdir,\
    \ has been created alongside the other directories in the Home area. Obviously\
    \ the command mkdir is what creates the directory, and no doubt you've already\
    \ guessed it stands for Make Directory.\n\n![](img/f80199d101da92d953f18eaa6205b48e_57_2.png)\n\
    \nSTEP 4\nYou can create directories within directories you've already created.\
    \ For example, enter the testdir directory with cd testdir/ followed by ls to\
    \ list the folder structure. Naturally there's nothing present, as you've just\
    \ created the directory. Now drop back to Home with cd -, and enter mkdir testdir/reports.\
    \ Go back to the testdir, cd testdir/, and ls again.\n\n![](img/f80199d101da92d953f18eaa6205b48e_57_3.png)\n\
    \n### STEP 5\n\nThe command to create directories is quite logical, therefore.\
    \ You’ll create the directory, and any sub-directories within. However, what if\
    \ you want to create a directory and a sub-directory in a single command? Make\
    \ sure you’re at Home (cd ~) and enter: mkdir -p Temp/finances. Now, cd Temp/,\
    \ and ls to list the new directory.\n\n![](img/f80199d101da92d953f18eaa6205b48e_58_0.png)\n\
    \n### STEP 6\n\nThe -p option is what enables the mkdir command to create the\
    \ sub-directory as well as the parent directory. In Linux, commands always follow\
    \ the same structure: Command, Option, and Argument. In the previous step example,\
    \ command (mkdir), option (-p), and argument (Temp/finances).\n\n![](img/f80199d101da92d953f18eaa6205b48e_58_1.png)\n\
    \n### STEP 7\n\nIf you want to drill down into the various options available for\
    \ the mkdir command, you can enter mkdir --help into the Terminal. This will provide\
    \ a quick help guide detailing the options and how the command structure works.\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_58_2.png)\n\n### STEP 8\n\nNow that\
    \ we’ve created some directories, let’s see about removing them. Start by entering\
    \ the testdir directory and listing its contents: cd testdir/, then ls. The previously\
    \ created reports sub-directory is present. One way to remove it is to enter:\
    \ rmdir reports, then ls again to confirm it’s not there.\n\n![](img/f80199d101da92d953f18eaa6205b48e_58_3.png)\n\
    \n### STEP 9\n\nA quick warning: removing a directory in the Terminal doesn’t\
    \ place it in the Mint Rubbish Bin, via Nemo file manager. The same goes for any\
    \ files, too. If you remove a directory from the Terminal command then it’s gone\
    \ for good.\n\n![](img/f80199d101da92d953f18eaa6205b48e_58_4.png)\n\n### STEP\
    \ 10\n\nRmdir will only remove empty directories, to remove directories containing\
    \ sub-directories, or even files, you’ll need to use the rm command with the -R\
    \ option. For example, on the Temp/finance directories, use rm -R Temp. A quick\
    \ ls reveals that the parent folder and all of its contents are removed. Careful\
    \ when using this command.\n\n![](img/f80199d101da92d953f18eaa6205b48e_58_5.png)\n\
    \n"
