    > It was pure accident that the Invaders got faster the less of them there were.


    ## Numbers and Expressions


    We''ve seen some basic mathematical expressions with Python, simple addition and
    the like. Let''s expand on that now and see just how powerful Python is as a calculator.
    You can work within the IDLE Shell or in the Editor, whichever you like.


    ## IT''S ALL MATHS, MAN


    You can get some really impressive results with the mathematical powers of Python;
    as with most, if not all, programming languages, maths is the driving force behind
    the code.


    ## STEP 1


    Open up the GUI version of Python 3, as mentioned you can use either the Shell
    or the Editor. For the time being, you''re going to use the Shell just to warm
    our maths muscle, which we believe is a small gland located at the back of the
    brain (or not).


    ![](img/f80199d101da92d953f18eaa6205b48e_101_0.png)


    ## STEP 3


    You can use all the usual mathematical operations: divide, multiply, brackets
    and so on. Practise with a few, for example:


    1/2

    6/2

    2+2*3

    (1+2)*(3*4)


    ![](img/f80199d101da92d953f18eaa6205b48e_101_1.png)


    ## STEP 2


    In the Shell enter the following:

    2+2

    54356+34553245

    99867344*27344484221

    You can see that Python can handle some quite large numbers.


    ![](img/f80199d101da92d953f18eaa6205b48e_101_2.png)


    ## STEP 4


    You''ve no doubt noticed, division produces a decimal number. In Python these
    are called floats, or floating point arithmetic. However, if you need an integer
    as opposed to a decimal answer, then you can use a double slash:

    1//2

    6//2

    And so on.


    ![](img/f80199d101da92d953f18eaa6205b48e_101_3.png)


    ## STEP 5


    You can also use an operation to see the remainder left over from division. For
    example:


    ```

    10/3

    ```


    Will display 3.333333333, which is of course 3.3-recurring. If you now enter:


    ```

    10%3

    ```


    This will display 1, which is the remainder left over from dividing 10 into 3.


    ![](img/f80199d101da92d953f18eaa6205b48e_102_0.png)


    ## STEP 6


    Next up we have the power operator, or exponentiation if you want to be technical.
    To work out the power of something you can use a double multiplication symbol
    or double-star on the keyboard:


    ```

    2**3

    10**10

    ```


    Essentially, it''s 2x2x2 but we''re sure you already know the basics behind maths
    operators. This is how you would work it out in Python.


    ![](img/f80199d101da92d953f18eaa6205b48e_102_1.png)


    ## STEP 7


    Numbers and expressions don''t stop there. Python has numerous built-in functions
    to work out sets of numbers, absolute values, complex numbers and a host of mathematical
    expressions and Pythagorean tongue-twisters. For example, to convert a number
    to binary, use:


    ```

    bin(3)

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_102_2.png)


    ## STEP 8


    This will be displayed as ''0b11'', converting the integer into binary and adding
    the prefix 0b to the front. If you want to remove the 0b prefix, then you can
    use:


    ```

    format(3, ''b'')

    ```


    The Format command converts a value, the number 3, to a formatted representation
    as controlled by the format specification, the ''b'' part.


    ![](img/f80199d101da92d953f18eaa6205b48e_102_3.png)


    ## STEP 9


    A Boolean Expression is a logical statement that will either be true or false.
    We can use these to compare data and test to see if it''s equal to, less than
    or greater than. Try this in a New File:


    ```

    a = 6

    b = 7

    print(1, a == 6)

    print(2, a == 7)

    print(3, a == 6 and b == 7)

    print(4, a == 7 and b == 7)

    print(5, not a == 7 and b == 7)

    print(6, a == 7 or b == 7)

    print(7, a == 7 or b == 6)

    print(8, not (a == 7 and b == 6))

    print(9, not a == 7 and b == 6)

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_102_4.png)


    ## STEP 10


    Execute the code from Step 9, and you can see a series of True and False statements,
    depending on the result of the two defining values: 6 and 7. It''s an extension
    of what you''ve looked at, and an important part of programming.


    ![](img/f80199d101da92d953f18eaa6205b48e_102_5.png)


    ## Using Comments


    When writing your code, the flow, what each variable does, how the overall program
    will operate and so on is all inside your head. Another programmer could follow
    the code line by line but over time, it can become difficult to read.


    ## #COMMENTS!


    Programmers use a method of keeping their code readable by commenting on certain
    sections. If a variable is used, the programmer comments on what it''s supposed
    to do, for example. It''s just good practise.


    ## STEP 1


    Start by creating a new instance of the IDLE Editor (File > New File) and create
    a simple variable and print command:

    a=10

    print("The value of A is,", a)

    Save the file and execute the code.


    ![](img/f80199d101da92d953f18eaa6205b48e_103_0.png)


    ## STEP 3


    Resave the code and execute it. You can see that the output in the IDLE Shell
    is still the same as before despite the extra lines being added. Simply put, the
    hash symbol (#) denotes a line of text the programmer can insert to inform them,
    and others, of what''s going on without the user being aware.


    ![](img/f80199d101da92d953f18eaa6205b48e_103_1.png)


    ## STEP 2


    Running the code will return the line: The value of A is, 10 into the IDLE Shell
    window, which is what we expected. Now, add some of the types of comments you''d
    normally see within code:

    # Set the start value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is,", a)


    ![](img/f80199d101da92d953f18eaa6205b48e_103_2.png)


    ## STEP 4


    Let''s assume that the variable A that we''ve created is the number of lives in
    a game. Every time the player dies, the value is decreased by 1. The programmer
    could insert a routine along the lines of:

    a-=1

    print("You''ve just lost a life!")

    print("You now have", a, "lives left!")


    ![](img/f80199d101da92d953f18eaa6205b48e_103_3.png)


    ## STEP 5


    Whilst we know that the variable A is lives, and that the player has just lost
    one, a casual viewer or someone checking the code may not know. Imagine for a
    moment that the code is twenty thousand lines long, instead of just our seven.
    You can see how handy comments are.


    ![](img/f80199d101da92d953f18eaa6205b48e_104_0.png)


    ## STEP 6


    Essentially, the new code together with comments could look like:


    ```

    # Set the start value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is,", a)

    # Player lost a life!

    a=a-1

    # Inform player, and display current value of A (lives)

    print("You''ve just lost a life!")

    print("You now have", a, "lives left!")

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_104_1.png)


    ## STEP 7


    You can use comments in different ways. For example, Block Comments are a large
    section of text that details what''s going on in the code, such as telling the
    code reader what variables you''re planning on using:


    ```

    # This is the best game ever, and has been developed by a crack squad of Python
    experts

    # who haven''t slept or washed in weeks. Despite being very smelly, the code at
    least

    # works really well.

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_104_2.png)


    ## STEP 8


    Inline comments are comments that follow a section of code. Take our examples
    from above, instead of inserting the code on a separate line, we could use:


    ```

    a=10 # Set the start value of A to 10

    print("The value of A is,", a) # Print the current value of A

    a=a-1 # Player lost a life!

    print("You''ve just lost a life!")

    print("You now have", a, "lives left!") # Inform player, and display current value
    of A (lives)

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_104_3.png)


    ## STEP 9


    The comment, the hash symbol, can also be used to comment out sections of code
    you don''t want to be executed in your program. For instance, if you wanted to
    remove the first print statement, you would use:


    ```

    # print("The value of A is,", a)

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_104_4.png)


    ## STEP 10


    You also use three single quotes to comment out a Block Comment or multi-line
    section of comments. Place them before and after the areas you want to comment
    for them to work:


    ```

    ''''''

    This is the best game ever, and has been developed by a crack squad of Python
    experts who haven''t slept or washed in weeks. Despite being very smelly, the
    code at least works really well.

    ''''''

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_104_5.png)

