  mdcn: "\n\nNASA 的 Linux 驱动超級計算機 Pleiades。目前在世界上排名第 11 位最強大的超級計算機。\n\n## 足夠好用於 NASA\n\
    \n## Python\n在 Linux 上\n\n> “Python 是一項關於程式設計師需要多少自由的實驗。自由太多，沒人能讀懂別人的代碼；自由太少，表現力就會受損。”\n\
