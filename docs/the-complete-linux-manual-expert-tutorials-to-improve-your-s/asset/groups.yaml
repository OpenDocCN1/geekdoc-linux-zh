    桌面底部是面板。我们已经看过面板的一个部分，即菜单。如果你右键单击面板上的任意位置（面板应用除外），会看到一个菜单，允许你以不同的方式编辑、添加和设置面板。


    ![](img/f80199d101da92d953f18eaa6205b48e_32_0.png)


