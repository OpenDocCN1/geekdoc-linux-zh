    # Your First C++ Program


    The Raspberry Pi makes for a great coding base on which to learn C++. You won’t
    need any complicated, third-party IDEs or to install any extra components. Everything
    you need to get started is already built into the Pi.


    # HELLO, WORLD!


    It’s traditional in programming for the first code to be entered to output the
    words ‘Hello, World!’ to the screen. Interestingly, this dates back to 1968 using
    a language called BCPL.


    STEP 1


    You can use the included Geany Programmer Editor to write, compile and execute
    your C++ code on the Raspberry Pi. You can find Geany as the first entry in the
    Programming section from the main Raspberry Pi menu. Click the Geany icon to open
    and start coding.


    ![](img/f80199d101da92d953f18eaa6205b48e_121_0.png)


    STEP 3


    It doesn’t look like much at the moment but you can get into what the C++ header
    commands mean in due course. Geany uses syntax highlighting, meaning it colour-codes
    the code depending on the language. To activate this, save the code by clicking
    on File > Save As. Now name the code helloworld.cpp and click the Save button.


    ![](img/f80199d101da92d953f18eaa6205b48e_121_1.png)


    STEP 2


    The Geany editor is quite powerful while still being easy to use. All the code
    you enter shows in the main window and is numbered to help you keep track of your
    code. For now, in line 1, enter:


    ```

    #include <iostream>

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_121_2.png)


    STEP 4


    The colour coding helps a lot when your coding. Now press Enter and start a new
    command on line 3. Enter the following:


    ```

    int main()

    ```


    Note: there’s no space between the brackets.


    ![](img/f80199d101da92d953f18eaa6205b48e_121_3.png)'
  - '[PAGE 122]


    # Your First C++ Program


    # STEP 5


    On the next line, below int main(), enter a curly bracket: {


    This can be done by pressing Shift and the key to the right of P on an English
    UK keyboard layout.


    ![](img/f80199d101da92d953f18eaa6205b48e_122_0.png)


    # STEP 8


    Now you need to close off the code, by inserting the opposite, closing, curly
    bracket. On line 7 enter: }


    Note that you won’t need to backspace to the start of the line, removing the indent,
    just by entering the curly bracket Geany auto-jumps to the correct part of the
    line, thus ending the code block.


    ![](img/f80199d101da92d953f18eaa6205b48e_122_1.png)


    # STEP 6


    Notice that Geany has automatically created a slight indent. This is due to the
    structure of C++ and it’s where the meat of the code is entered. Now enter:


    ```

    //My first C++ program

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_122_2.png)


    # STEP 9


    Essentially, these are your first steps into the world of coding in C++. We will
    look at the structure of the code in more detail on the next couple of pages;
    for now though, click on the Save button as represented by a filing cabinet with
    a green downward pointing arrow.


    ![](img/f80199d101da92d953f18eaa6205b48e_122_3.png)


    # STEP 7


    Note again the colour coding change. Press Return at the end of the previous step’s
    line and then enter:


    ```

    std::cout << "Hello, world!\n";

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_122_4.png)


    # STEP 10


    If you haven’t done so already, it’s always advisable to create a blank folder
    where you can save all your code. You can have one each for Python and C++ or
    simply a single folder called Code, whichever you prefer. It’s not a necessity,
    just good housekeeping.


    ![](img/f80199d101da92d953f18eaa6205b48e_122_5.png)'
