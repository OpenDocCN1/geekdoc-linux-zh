    \ with your scripts, asking what the user’s name is and so on. You’ve also looked\
    \ at creating loops within the script to either count or simply do something several\
    \ times. Let’s combine and expand some more.\n\n## CHOICES AND LOOPS\n\nLet’s\
    \ bring in another command, CHOICE, along with some nested IF and ELSE statements.\
    \ Start by creating a new script called mychoice.sh.\n\n### STEP 1\n\nThe mychoice.sh\
    \ script is beginning to look a lot more complex. What we have here is a list\
    \ of four choices, with three possible options. The options: Mint, Is, and Awesome\
    \ will be displayed if the user presses the correct option key. If not, then the\
    \ menu will reappear, the fourth choice.\n\n![](img/f80199d101da92d953f18eaa6205b48e_73_0.png)\n\
    \n### STEP 3\n\nYou can, of course, increase the number of choices but you need\
    \ to make sure that you match the number of choices to the number of IF statements.\
    \ The script can quickly become a very busy screen to look at. This lengthy script\
    \ is another way of displaying a menu, this time with a fancy colour scheme too.\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_73_1.png)\n\n### STEP 2\n\nIf you follow\
    \ the script through you soon get the hang of what’s going on, based on what we’ve\
    \ already covered. WHILE, IF, and ELSE, with the FI closing loop statement will\
    \ run through the options and bring you back to the start if you pick the wrong\
    \ option.\n\n![](img/f80199d101da92d953f18eaa6205b48e_73_2.png)\n\n### STEP 4\n\
    \nYou can use the arrow keys and Enter in the menu setup in the script. Each choice\
    \ is an external command that feeds back various information. Play around with\
    \ the commands and choices, and see what you can come up with. It’s a bit beyond\
    \ what we’ve looked at but it gives a good idea of what can be achieved.\n\n![](img/f80199d101da92d953f18eaa6205b48e_73_3.png)\n\
    \n## CREATING A BACKUP TASK SCRIPT\n\nOne of the most well used examples of Bash\
    \ scripting is the creation of a backup routine, one that automates the task as\
    \ well as adding some customisations along the way.\n\n### STEP 1\n\nA very basic\
    \ backup script would look something along the lines of: #!/bin/bash, then, tar\
    \ cvfz ~/backups/my-backup.tgz ~/Documents/. This will create a compressed file\
    \ backup of the ~/Documents folder with everything in it, and put it in a folder\
    \ called /backups with the name my-backup.tgz.\n\n### STEP 2\n\nWhile perfectly\
    \ fine, we can make the simple script a lot more interactive. Let’s begin with\
    \ defining some variables. Enter the text in the screenshot into a new backup.sh\
    \ script. Notice that we’ve misspelt ‘source’ as ‘sauce’, this is because there’s\
    \ already a built-in command called ‘source’ hence the different spelling on our\
    \ part.\n\n### STEP 3\n\nThe previous script entries allowed you to create a Time\
    \ Stamp, so you know when the backup was taken. You also created a ‘dest’ variable,\
    \ which is the folder where the backup file will be created (/backups). You can\
    \ now add a section of code to first check if the ~/backups folder exits, if not,\
    \ then it creates one.\n\n### STEP 4\n\nOnce the ~/backups folder is created,\
    \ we can now create a new subfolder within it based on the Time Stamp variables\
    \ you set up at the beginning. Add mkdir -p $dest/\"$day $month $year\". It’s\
    \ in here that you put the backup file relevant to that day/month/year.\n\n###\
    \ STEP 5\n\nWith everything in place, you can now enter the actual backup routine,\
    \ based on the Tar command from Step 5. Combined with the variables, you have:\
    \ tar cvfz $dest/\"$day $month $year\"/DocumentsBackup.tgz $sauce. In the screenshot,\
    \ we added a handy “Now backing up…” echo command.\n\n### STEP 6\n\nFinally, you\
    \ can add a friendly message: echo “Backup complete. All done…”. The completed\
    \ script isn’t too over-complex and it can be easily customised to include any\
    \ folder within your Home area, as well as the entire Home area itself.\n\n##\
    \ Creating Bash Scripts\n– Part 5\n\nThe backup script we looked at previously\
    \ can be further amended to incorporate choices, user-interaction with regards\
    \ to where the backup file will be copied to and so on. Automating tasks is one\
    \ of the main benefits of Bash scripting, a simple script can help you out in\
    \ many ways.\n\n## EASY AUTOMATION AND HANDY SCRIPTS\n\nEntering line after line\
    \ of commands to retrieve system information, find a file or rename a batch of\
    \ files? A script is a better answer.\n\n### STEP 1\nLet’s start by creating a\
    \ script to help display the Mint system information; always a handy thing to\
    \ have. Create a new script called sysinfo.sh and enter the following into Xed,\
    \ or the text editor of your choice.\n\n![](img/f80199d101da92d953f18eaa6205b48e_75_0.png)\n\
    \n### STEP 2\nWe’ve included a couple of extra commands in this script. The first\
    \ is the -e extension for echo, this means it’ll enable echo interpretation of\
    \ additional instances of a new line, as well as other special characters. The\
    \ proceeding 31;43m element enables colour for foreground and background.\n\n\
    ![](img/f80199d101da92d953f18eaa6205b48e_75_1.png)\n\n### STEP 3\nEach of the\
    \ sections runs a different Terminal command, outputting the results under the\
    \ appropriate heading. You can include a lot more, such as the current aliases\
    \ being used in the system, the current time and date and so on. Plus, you could\
    \ also pipe all that information into a handy HTML file, ready to be viewed in\
    \ a browser.\n\n![](img/f80199d101da92d953f18eaa6205b48e_75_2.png)\n\n### STEP\
    \ 4\nAlthough there are simple Terminal commands to help you look for a particular\
    \ file or folder, it’s often more fun to create a script to help you. Plus, you\
    \ can use that script for other non-technical users. Create a new script called\
    \ look4.sh, entering the content from the screenshot below.\n\n![](img/f80199d101da92d953f18eaa6205b48e_75_3.png)\n\
    \n### STEP 5\n\nWhen executed the script waits for input from the user, in this\
    \ case the file extension, such as jpg, mp4 and so on. It’s not very friendly\
    \ though. Let’s make it a little friendlier. Add an echo, with echo -n \"Please\
    \ enter the extension of the file you’re looking for: \", just before the read\
    \ command.\n\n```\n#!/bin/bash\ntarget=~\nread name\noutput=$( find \"$target\"\
    \ -iname \"*$name*\" 2> /dev/null )\nif [[ \"$output\" ]]; then\n  echo \"$output\"\
    \nelse\n  echo \"No match found\"\nfi\n```\n\n### STEP 6\n\nHere’s an interesting,\
    \ fun kind of script using the app espeak. Install espeak with sudo apt-get install\
    \ espeak, then enter the text below into a new script called speak.sh. As you\
    \ can see it’s a rehash of the first greeting script we ran. Only this time, it\
    \ uses the variables in the espeak output.\n\n```\n#!/bin/bash\necho \"Hello,\
    \ what is your first name?\"\nread firstname\necho \"Hello $firstname, and what\
    \ is your surname?\"\nread surname\nespeak \"Hello $firstname $surname, how are\
    \ you on this fine $(date +%A)?\"\n```\n\n### STEP 7\n\nWe briefly looked at putting\
    \ some colours in the output for our scripts. Whilst it’s too long to dig a little\
    \ deeper into the colour options, here’s a script that outputs what’s available.\
    \ Create a new script called colours.sh and enter the text (see below) into it.\n\
    \n```\n#!/bin/bash\nclear\necho \"\\e[0m Normal\\t\\e[1m Bold\\t\\e[4m Underlined\"\
    \necho \"\\e[0m Normal\\t\\e[1m Bold\\t\\e[4m Underlined\"\n... [colour output\
    \ script]\n```\n\n### STEP 8\n\nThe output from colours.sh can, of course, be\
    \ mixed together, bringing different effects depending on what you want to the\
    \ output to say. For example, white text in a red background flashing (or blinking).\
    \ Sadly the blinking effect doesn’t work on all Terminals, so you may need to\
    \ change to a different Terminal.\n\n![](img/f80199d101da92d953f18eaa6205b48e_76_0.png)\n\
    \n### STEP 9\n\nWhilst we’re on making fancy scripts, how about using Zenity to\
    \ output a graphical interface? Enter what you see below into a new script, menu.sh.\
    \ Make it executable and then run it. You should have a couple of dialogue boxes\
    \ appear, followed by a final message.\n\n```\n#!/bin/bash\nfirstname=$(zenity\
    \ --entry --title \"Your Name\" --text \"What is your first name?\")\nsurname=$(zenity\
    \ --entry --title \"Your Name\" --text \"What is your surname?\")\nzenity --info\
    \ --title \"Greetings\" --text \"Hello $firstname $surname, ...\"\n```\n\n###\
    \ STEP 10\n\nWhile gaming in a Bash script isn’t something that’s often touched\
    \ upon, it is entirely possible, albeit, a little basic. If you fancy playing\
    \ a game, enter wget http://bruxy.regnet.cz/linux/housenka/housenka.sh, make the\
    \ script executable and run it. It’s in Polish, written by Martin Bruchanov but\
    \ we’re sure you can modify it. Hint: the title screen is in Base64.\n\n![](img/f80199d101da92d953f18eaa6205b48e_76_1.png)\n"
  mdcn: "\n\n## 创建 Bash 脚本\n— 第 4 部分\n\n你已经接触过脚本与用户的交互，例如询问用户的姓名等等。你也已经了解如何在脚本中创建循环来计数或重复执行某项操作。让我们在此基础上进行组合和扩展。\n\
    \n## 选择与循环\n\n让我们引入另一个命令 CHOICE，并配合一些嵌套的 IF 和 ELSE 语句。首先创建一个名为 mychoice.sh 的新脚本。\n\
    \n### 第 1 步\n\nmychoice.sh 脚本开始变得更加复杂。我们这里有一个包含四个选项的列表，其中有三个可能的选项。选项：Mint、Is 和\
    \ Awesome 将在用户按下正确的选项键时显示。如果不是，则菜单会重新出现，这是第四个选项。\n\n![](img/f80199d101da92d953f18eaa6205b48e_73_0.png)\n\
    \n### 第 3 步\n\n当然，你可以增加选项的数量，但你需要确保选项数量与 IF 语句的数量相匹配。脚本很快就会变得非常拥挤。这段冗长的脚本是另一种显示菜单的方式，这次还带有精美的配色方案。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_73_1.png)\n\n### 第 2 步\n\n如果你逐步跟随脚本，很快就会明白其中的原理，这基于我们已经学过的内容。WHILE、IF\
    \ 和 ELSE，以及用于关闭循环的 FI 语句会遍历选项，如果你选择了错误的选项，就会带你回到起点。\n\n![](img/f80199d101da92d953f18eaa6205b48e_73_2.png)\n\
    \n### 第 4 步\n\n你可以在脚本中设置的菜单中使用方向键和 Enter。每个选项都是一个外部命令，会反馈各种信息。尝试使用命令和选项，看看你能想出什么。这有点超出我们所涉及的内容，但它很好地说明了可以实现什么。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_73_3.png)\n\n## 创建备份任务脚本\n\nBash 脚本最常用的示例之一就是创建备份例程，它可以自动化任务，并在过程中添加一些自定义设置。\n\
    \n### 第 1 步\n\n一个非常基本的备份脚本看起来大致如下：#!/bin/bash，然后是 tar cvfz ~/backups/my-backup.tgz\
    \ ~/Documents/。这将创建 ~/Documents 文件夹及其全部内容的压缩文件备份，并将其放在名为 /backups 的文件夹中，名称为 my-backup.tgz。\n\
    \n### 第 2 步\n\n虽然完全可行，但我们可以让简单的脚本变得更加交互。让我们从定义一些变量开始。将屏幕截图中的文本输入到新的 backup.sh\
    \ 脚本中。请注意，我们将 ‘source’ 拼写为 ‘sauce’，这是因为已经存在一个内置命令叫做 ‘source’，因此我们做了不同的拼写。\n\n\
    ### 第 3 步\n\n之前的脚本条目允许你创建时间戳，以便你知道备份是在何时进行的。你还创建了一个 ‘dest’ 变量，即备份文件将被创建的文件夹（/backups）。现在你可以添加一段代码，首先检查\
    \ ~/backups 文件夹是否存在，如果不存在，则创建它。\n\n### 第 4 步\n\n一旦 ~/backups 文件夹创建完成，我们就可以在其内部基于你在开始时设置的时间戳变量创建一个新的子文件夹。添加\
    \ mkdir -p $dest/\"$day $month $year\"。备份文件与该天/月/年相关，将放在这里。\n\n### 第 5 步\n\n在一切就绪后，你现在可以输入实际的备份例程，基于第\
    \ 5 步的 Tar 命令。结合变量，你有：tar cvfz $dest/\"$day $month $year\"/DocumentsBackup.tgz\
    \ $sauce。在屏幕截图中，我们添加了一个方便的 “Now backing up…” echo 命令。\n\n### 第 6 步\n\n最后，你可以添加一条友好的信息：echo\
    \ “Backup complete. All done…”。完成的脚本并不过于复杂，可以轻松自定义以包含 Home 区域内的任何文件夹，甚至整个 Home\
    \ 区域本身。\n\n## 创建 Bash 脚本\n– 第 5 部分\n\n我们之前查看的备份脚本可以进一步修改，以加入选择、用户交互，关于备份文件将被复制到何处等等。自动化任务是\
    \ Bash 脚本的主要好处之一，一个简单的脚本可以在很多方面帮助你。\n\n## 简单自动化和实用脚本\n\n一行一行输入命令来检索系统信息、查找文件或重命名一批文件？脚本是更好的答案。\n\
    \n### 第 1 步\n让我们开始创建一个脚本来帮助显示 Mint 系统信息；这总是很有用的。创建一个名为 sysinfo.sh 的新脚本，并将以下内容输入到\
    \ Xed 或你选择的文本编辑器中。\n\n![](img/f80199d101da92d953f18eaa6205b48e_75_0.png)\n\n###\
    \ 第 2 步\n我们在这个脚本中加入了几个额外的命令。第一个是 echo 的 -e 扩展，这意味着它将启用 echo 对换行符的其他实例以及其他特殊字符的解释。随后的\
    \ 31;43m 元素为前景和背景启用颜色。\n\n![](img/f80199d101da92d953f18eaa6205b48e_75_1.png)\n\
    \n### 第 3 步\n每个部分都运行不同的终端命令，并在适当的标题下输出结果。你可以加入更多内容，例如系统中当前使用的别名、当前时间和日期等等。此外，你还可以将所有这些信息通过管道传输到一个方便的\
    \ HTML 文件中，以便在浏览器中查看。\n\n![](img/f80199d101da92d953f18eaa6205b48e_75_2.png)\n\n\
    ### 第 4 步\n虽然有简单的终端命令可以帮助你查找特定文件或文件夹，但创建脚本来帮助你通常更有趣。此外，你可以将该脚本用于其他非技术用户。创建一个名为\
    \ look4.sh 的新脚本，输入下面的屏幕截图中的内容。\n\n![](img/f80199d101da92d953f18eaa6205b48e_75_3.png)\n\
    \n### 第 5 步\n\n执行时脚本会等待用户输入，在本例中是文件扩展名，例如 jpg、mp4 等等。它并不是很友好。让我们让它更友好一些。在 read\
    \ 命令之前添加一个 echo，使用 echo -n \"Please enter the extension of the file you’re looking\
    \ for: \"。\n\n```\n#!/bin/bash\ntarget=~\nread name\noutput=$( find \"$target\"\
    \ -iname \"*$name*\" 2> /dev/null )\nif [[ \"$output\" ]]; then\n  echo \"$output\"\
    \nelse\n  echo \"No match found\"\nfi\n```\n\n### 第 6 步\n\n这是一个有趣的脚本，使用了 app espeak。用\
    \ sudo apt-get install espeak 安装 espeak，然后将下面的文本输入到名为 speak.sh 的新脚本中。如你所见，它是对我们第一次运行的问候脚本的重制。不同之处在于，这次它使用了\
    \ espeak 输出中的变量。\n\n```\n#!/bin/bash\necho \"Hello, what is your first name?\"\
    \nread firstname\necho \"Hello $firstname, and what is your surname?\"\nread surname\n\
    espeak \"Hello $firstname $surname, how are you on this fine $(date +%A)?\"\n\
    ```\n\n### 第 7 步\n\n我们简要地查看了在脚本输出中加入一些颜色。虽然深入研究颜色选项太长了，这里有一个输出可用选项的脚本。创建一个名为 colours.sh\
    \ 的新脚本并将文本（见下文）输入其中。\n\n```\n#!/bin/bash\nclear\necho \"\\e[0m Normal\\t\\e[1m\
    \ Bold\\t\\e[4m Underlined\"\necho \"\\e[0m Normal\\t\\e[1m Bold\\t\\e[4m Underlined\"\
    \n... [colour output script]\n```\n\n### 第 8 步\n\ncolours.sh 的输出当然可以混合在一起，根据你想要输出的内容带来不同的效果。例如，红色背景上的白色闪烁（或闪烁）文本。可惜闪烁效果并非在所有终端上都有效，因此你可能需要切换到不同的终端。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_76_0.png)\n\n### 第 9 步\n\n既然我们在制作花哨的脚本，不如使用\
    \ Zenity 来输出图形界面？将下面看到的内容输入到名为 menu.sh 的新脚本中。使其可执行然后运行它。你应该会看到几个对话框出现，然后是一条最终消息。\n\
    \n```\n#!/bin/bash\nfirstname=$(zenity --entry --title \"Your Name\" --text \"\
    What is your first name?\")\nsurname=$(zenity --entry --title \"Your Name\" --text\
    \ \"What is your surname?\")\nzenity --info --title \"Greetings\" --text \"Hello\
    \ $firstname $surname, ...\"\n```\n\n### 第 10 步\n\n虽然在 Bash 脚本中进行游戏并不是经常涉及的内容，但完全可以实现，尽管有点基础。如果你想玩游戏，输入\
    \ wget http://bruxy.regnet.cz/linux/housenka/housenka.sh，使脚本可执行并运行它。它是用波兰语编写的，由\
    \ Martin Bruchanov 编写，但我们相信你可以修改它。提示：标题屏幕是 Base64 编码的。\n\n![](img/f80199d101da92d953f18eaa6205b48e_76_1.png)\n\
    \n"
