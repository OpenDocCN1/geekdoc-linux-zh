  - "[PAGE 114]\n\n# STEP 5\n\nClose the command prompt or Terminal and relaunch the\
    \ IDLE Shell. When you now enter: import pygame, the module will be imported into\
    \ the code without any problems. You’ll find that most code downloaded or copied\
    \ from the Internet will contain a module, mainstream of unique, these are usually\
    \ the source of errors in execution due to them being missing.\n\n```\nimport\
    \ pygame\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_114_0.png)\n\n# STEP\
    \ 6\n\nThe modules contain the extra code needed to achieve a certain result within\
    \ your own code, as we’ve previously experimented with. For example:\n\n```\n\
    import random\n```\n\nBrings in the code from the Random Number Generator module.\
    \ You can then use this module to create something like:\n\n```\nfor i in range(10):\n\
    \    print(random.randint(1, 25))\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_114_1.png)\n\
    \n# STEP 7\n\nThis code, when saved and executed, will display ten random numbers\
    \ from 1 to 25. You can play around with the code to display more or less, and\
    \ from a great or lesser range. For example:\n\n```\nimport random\nfor i in range(25):\n\
    \    print(random.randint(1, 100))\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_114_2.png)\n\
    \n# STEP 8\n\nMultiple modules can be imported within your code. To extend our\
    \ example, use:\n\n```\nimport random\nimport math\nfor i in range(5):\n    print(random.randint(1,\
    \ 25))\nprint(math.pi)\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_114_3.png)\n\
    \n# STEP 9\n\nThe result is a string of random numbers followed by the value of\
    \ Pi as pulled from the Math module using the print(math.pi) function. You can\
    \ also pull in certain functions from a module by using the from and import commands,\
    \ such as:\n\n```\nfrom random import randint\nfor i in range(5):\n    print(randint(1,\
    \ 25))\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_114_4.png)\n\n# STEP 10\n\
    \nThis helps create a more streamlined approach to programming. You can also use\
    \ Import module*, which will import everything defined within the named module.\
    \ However, it’s often regarded as a waste of resources but it works nonetheless.\
    \ Finally, modules can be imported as aliases:\n\n```\nimport math as m\nprint(m.pi)\n\
    ```\n\nOf course, adding comments helps to tell others what’s going on.\n\n![](img/f80199d101da92d953f18eaa6205b48e_114_5.png)"
