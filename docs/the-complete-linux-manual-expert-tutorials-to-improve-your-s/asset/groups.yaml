    ## 如何在 Linux 上设置 Python


    虽然树莓派的操作系统包含最新、稳定的 Python 版本，但其他 Linux 发行版并不预装 Python 3。如果你不走树莓派路线，那么这里是如何检查和安装
    Linux 的 Python。


    ## PYTHON PENGUIN


    Linux 是一种如此多功能的系统，以至于很难确定做某件事的唯一方法。不同的发行版以不同的方式安装软件，因此本教程我们坚持使用 Linux Mint。


    ### STEP 1


    首先你需要确定当前在 Linux 系统中安装了哪个版本的 Python。开始时，从发行版的菜单中进入终端会话，或按 Ctrl+Alt+T 键。


    ![](img/f80199d101da92d953f18eaa6205b48e_89_0.png)


    ### STEP 3


    在我们的例子中我们同时安装了 Python 2 和 3；只要安装了 Python 3.x，那么我们的教程中的代码就会工作。最好检查一下发行版是否已更新到最新版本，因此输入：sudo
    apt-get update && sudo apt-get upgrade 来更新系统。


    ![](img/f80199d101da92d953f18eaa6205b48e_89_1.png)


    ### STEP 2


    接下来在终端屏幕中输入 python --version。你应该在显示中看到与 Python 2.x 版本相关的输出。默认情况下，大多数 Linux 发行版都同时提供
    Python 2 和 3，因为仍有大量代码可用于 Python 2。现在输入：python3 --version。


    ![](img/f80199d101da92d953f18eaa6205b48e_89_2.png)


    ### STEP 4


    更新和升级完成后，再次输入：python3 --version 来查看 Python 3.x 是否已更新或甚至已安装；只要你有 Python 3.x，你就运行的是最新主要版本。3
    之后的数字表示补丁和进一步的更新。它们通常是不必要的，但可能包含至关重要新元素。


    ![](img/f80199d101da92d953f18eaa6205b48e_89_3.png)


    ### STEP 5


    然而，如果你想要最新、最前沿的版本，你需要从源代码构建 Python。开始时在终端中输入以下命令：


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-gplv2-dev

    libncursesw5-dev libssl-dev libsqlite3-dev tk-dev

    libgdbm-dev libc6-dev libbz2-dev

    ```


    ![](img/f80199d101da92d953f18eaa6205b48e_90_0.png)


    ### STEP 6


    打开你的 Linux 网络浏览器并前往 Python 下载页面：www.python.org/downloads。点击 Downloads 然后点击 Python
    Source 窗口下的按钮。这会打开一个下载对话框；选择一个位置并开始下载过程。


    ![](img/f80199d101da92d953f18eaa6205b48e_90_1.png)


    ### STEP 7


    在终端中，通过输入 cd Downloads/ 进入 Downloads 文件夹。然后使用以下命令解压下载的 Python 源代码的内容：tar -xvf
    Python-3.Y.Y.tar.xz 用你下载的版本号替换 Y。现在使用 cd Python-3.Y.Y/ 进入新解压的文件夹。


