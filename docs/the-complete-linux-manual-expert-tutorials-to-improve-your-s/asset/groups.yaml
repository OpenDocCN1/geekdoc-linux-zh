  md: "\n## Install Apps via the Terminal – Part 1\n\nThere are different ways to\
    \ install apps and programs on Linux. You can opt for the graphical route, using\
    \ a Software Manager, or you can use the Terminal. Often, the Terminal provides\
    \ better control over the software being installed and sometimes, you have no\
    \ choice in the matter.\n\n## COMMAND LINE INSTALLS\n\nInstalling an app with\
    \ the Terminal may require some nifty keyboard work but you get a better sense\
    \ of what’s being installed and where.\n\nSTEP 1 Installing apps from the Terminal\
    \ is often relatively simple. First though, you need to make sure that the system\
    \ is up to date. To do this open up the Terminal and enter: sudo apt-get update\
    \ && sudo apt-get upgrade. Enter your password and accept any necessary updates.\n\
    \nSTEP 3 You need to enter y to confirm the installation, which takes up around\
    \ 5.5MB of storage in the system. Once Stella is installed, you can see again\
    \ that Mint has automatically created the Games category in the Menu as well as\
    \ the app shortcut.\n\n![](img/f80199d101da92d953f18eaa6205b48e_49_0.png)\n\n\
    ![](img/f80199d101da92d953f18eaa6205b48e_49_1.png)\n\nSTEP 2 Just as you’ve seen,\
    \ sudo apt-get update/upgrade and so on are designed to upgrade the software that’s\
    \ already installed on the system. How do you install more apps though? It just\
    \ so happens that it’s extraordinarily simple. First you need an app to install,\
    \ so let’s use Stella again. Enter: sudo apt-get install stella.\n\nSTEP 4 Sometimes,\
    \ when installing software, you need to add the app’s Repository. The repository,\
    \ or repo, is simply the remote server location where the software is held, along\
    \ with all its dependencies (the vital libraries and such it needs to function).\
    \ Start by typing in this: sudo add-apt-repository ppa:peterlevi/ppa. Press Enter\
    \ when asked to and add the PPA (Personal Package Archive).\n\n![](img/f80199d101da92d953f18eaa6205b48e_49_2.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_49_3.png)\n\n## STEP 5\n\nThis adds\
    \ the repo for the app Variety Wallpaper Changer, an Ubuntu-based app that works\
    \ in Mint and changes the wallpaper automatically. Now that the repo is added,\
    \ enter: sudo apt-get update, to update the new information and add the contents\
    \ of the repo to the package database.\n\n![](img/f80199d101da92d953f18eaa6205b48e_50_0.png)\n\
    \n## STEP 6\n\nNow to install Variety, enter: sudo apt-get install variety. Press\
    \ y to confirm and accept the installation, and to continue with the install.\
    \ Once installed, you can type variety into the Terminal to run the app.\n\n![](img/f80199d101da92d953f18eaa6205b48e_50_1.png)\n\
    \n## REMOVING APPS\n\nIn addition to installing apps, the apt command can also\
    \ be used to remove any apps and helps keep the system tidy and free up resources.\n\
    \n## STEP 1\n\nTo uninstall, or remove, the Variety app enter the following: sudo\
    \ apt-get remove variety. Enter y to continue with the uninstall of the app, notice\
    \ also that you’re informed of how much space you’re freeing up on the hard drive\
    \ as a result of removing the app.\n\n![](img/f80199d101da92d953f18eaa6205b48e_50_2.png)\n\
    \n## STEP 3\n\nWhen you remove apps from the system you’re automatically installed\
    \ are no longer required. You already saw in the previous tutorial, that you can\
    \ tidy things up with the following command: sudo apt-get autoremove, followed\
    \ by pressing y to accept the process.\n\n![](img/f80199d101da92d953f18eaa6205b48e_50_3.png)\n\
    \n## STEP 2\n\nWhile the ‘apt-get remove’ command uninstalls an app, it doesn’t\
    \ get rid of the extra clutter that comes with an app, such as configuration and\
    \ library files. To completely remove the clutter, enter: sudo apt-get purge variety.\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_50_4.png)\n\n## STEP 4\n\nFinally,\
    \ to tidy up all the non-used packages in the system, and to remove elements that\
    \ the autoremove command didn’t, you can enter: sudo apt-get autoclean. These\
    \ last few steps are vital for keeping your Linux Mint setup in good working order\
    \ and to trim off the unnecessary excess caused by installations and upgrades.\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_50_5.png)\n\n## Install Apps via the\
    \ Terminal – Part 2\n\nMost of the time you'll get to install apps from the Terminal\
    \ using the standard apt-get command. However, sometimes an app demands a little\
    \ more work. This means installing an app from its source code, which isn't as\
    \ scary as it first sounds.\n\n## FROM THE SOURCE\n\nThe commands you'll need\
    \ to become familiar with here are Configure, Make and Install. You'll find a\
    \ lot of apps use installing from source, so it's certainly a skill worth investing\
    \ time in.\n\nSTEP 1\nSource code files for Linux usually come in the form of\
    \ .TAR.GZ or .TAR.BZ2. Both are compressed files holding all the core files needed\
    \ to 'make' the app. Start off this tutorial by creating a new folder in Home:\
    \ mkdir Vim\n\n![](img/f80199d101da92d953f18eaa6205b48e_51_0.png)\n\nSTEP 3\n\
    The wget command retrieves content from the internet, in this case the .BZ2 file\
    \ for Vim. To check the file was downloaded successfully, enter: ls. According\
    \ to Mint's file system colour key, the compressed file should be displayed in\
    \ red.\n\n![](img/f80199d101da92d953f18eaa6205b48e_51_1.png)\n\nSTEP 2\nVim, by\
    \ the way, is an advanced text editor which we'll use as an example to install.\
    \ Enter the new folder, cd Vim, then from within the new Vim folder, enter the\
    \ following command into the Terminal: wget ftp://ftp.vim.org/pub/vim/unix/vim-7.4.tar.bz2.\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_51_2.png)\n\nSTEP 4\nWe need to uncompress\
    \ the contents of the file now, so enter: tar -xf vim-7.4.tar.bz2 into the Terminal.\
    \ Note: you can type in tar -xf v and press the Tab key to auto-fill the remaining\
    \ file name.\n\n![](img/f80199d101da92d953f18eaa6205b48e_51_3.png)\n\n## STEP\
    \ 5\n\nIf you enter ls again, you'll notice that a new folder has been created:\
    \ vim74; in light blue text representing a folder in Mint. It's always handy to\
    \ create root folders for the main app, then as you upgrade apps through this\
    \ method the individual versions will each have their own folder.\n\n![](img/f80199d101da92d953f18eaa6205b48e_52_0.png)\n\
    \n## STEP 6\n\nType in cd vim74 to enter the folder, and ls again to view its\
    \ contents. There will likely be a fair number of files present, most are the\
    \ app's core files, while others will be labelled README or INSTALL. It's always\
    \ wise to read these files first as they provide valuable information regarding\
    \ the installation.\n\n![](img/f80199d101da92d953f18eaa6205b48e_52_1.png)\n\n\
    ## STEP 7\n\nThe first part of the installation requires you to enter ./configure.\
    \ The ./configure command will check your system for any missing dependencies\
    \ associated with the app. If you received an error regarding a C Compiler, then\
    \ enter: sudo apt-get install build-essential. The third-party app Ncurses was\
    \ recorded as missing. We need to install that with: sudo apt-get install libncurses5-dev\
    \ libncursesw5-dev.\n\n![](img/f80199d101da92d953f18eaa6205b48e_52_2.png)\n\n\
    ## STEP 8\n\nYou may need to keep installing new dependencies, depending on the\
    \ app. After each new dependency is installed, re-run ./configure and when it\
    \ doesn't report back with an error you can continue to the next stage of the\
    \ installation. Note: you may need to search online for some error messages.\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_52_3.png)\n\n## STEP 9\n\nWith a successful\
    \ ./configure, the system will create a Makefile. This needs to be 'made' by entering:\
    \ make into the Terminal. This may take a while, depending on the size of the\
    \ app.\n\n![](img/f80199d101da92d953f18eaa6205b48e_52_4.png)\n\n## STEP 10\n\n\
    Finally, you need to enter: sudo make install into the Terminal. This will install\
    \ the app, and make it ready for use in the system. When complete you can execute\
    \ the app, in this case by entering vim into the Terminal or searching for it\
    \ via the Dash.\n\n![](img/f80199d101da92d953f18eaa6205b48e_52_5.png)\n\n## Using\
    \ the Terminal\n\n```\nKernel command line: block2mtd.block2mtd=/dev/hda2,131072.rootfs\
    \ root=/dev/mtdblock0 rootfstype=jffs2 init=/etc/preinit  noinintrd console=tty0\
    \ console=ttyS0,38400n8 reboot=bios\nFound and enabled local APIC!\nEnabling fast\
    \ FPU save and restore... done.\nEnabling unmasked SIMD FPU exception support...\
    \ done.\nInitializing CPU#0\nPID hash table entries: 32 (order: 5, 128 bytes)\n\
    Detected 1991.657 MHz processor.\nConsole: colour VGA+ 80x25\nconsole [tty0] enabled\n\
    console [ttyS0] enabled\nDentry cache hash table entries: 1024 (order: 0, 4096\
    \ bytes)\nInode-cache hash table entries: 1024 (order: 0, 4096 bytes)\nMemory:\
    \ 5112k/8128k available (1497k kernel code, 2624k reserved, 597k data, 196k init,\
    \ 0k highmem)\nvirtual kernel memory layout:\n    fixmap  : 0xffffb000 - 0xfffff000\
    \   ( 280 kB)\n    vmalloc : 0xc1000000 - 0xffff7000   (1007 MB)\n    lowmem \
    \ : 0xc0000000 - 0xc07f0000   ( 7 MB)\n      .init : 0xc0313000 - 0xc0344000 \
    \  ( 196 kB)\n      .data : 0xc027653c - 0xc030bcfc   ( 597 kB)\n      .text :\
    \ 0xc0100000 - 0xc02753c   (1497 kB)\nChecking if this processor honours the WP\
    \ bit even in supervisor mode...Ok.\nCalibrating delay using timer specific routine..\
    \ 4047.64 BogoMIPS (lpj=20238210)\n```\n"
  mdcn: "\n\n## 通过终端安装应用 – 第 1 部分\n\n在 Linux 上安装应用和程序有不同的方法。你可以选择图形化路线，使用软件管理器，或者使用终端。通常，终端能更好地控制正在安装的软件，有时你别无选择。\n\
    \n## 命令行安装\n\n使用终端安装应用可能需要一些熟练的键盘操作，但你能更好地了解安装了什么以及安装在哪里。\n\nSTEP 1 从终端安装应用通常相对简单。首先，你需要确保系统是最新的。为此打开终端并输入：sudo\
    \ apt-get update && sudo apt-get upgrade。输入你的密码并接受必要的更新。\n\nSTEP 3 你需要输入 y 来确认安装，该安装在系统中占用约\
    \ 5.5MB 的存储空间。安装 Stella 后，你可以看到 Mint 已自动在菜单中创建了游戏类别以及应用快捷方式。\n\n![](img/f80199d101da92d953f18eaa6205b48e_49_0.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_49_1.png)\n\nSTEP 2 就像你看到的那样，sudo apt-get\
    \ update/upgrade 等命令旨在升级系统已安装的软件。那如何安装更多应用呢？它其实非常简单。首先你需要一个要安装的应用，所以我们再次使用 Stella。输入：sudo\
    \ apt-get install stella。\n\nSTEP 4 有时，安装软件时需要添加应用的存储库。存储库，或 repo，仅仅是软件及其所有依赖项（使其正常运行所需的重要库等）存放的远程服务器位置。先输入以下命令：sudo\
    \ add-apt-repository ppa:peterlevi/ppa。当被询问时按 Enter 并添加 PPA（个人软件包档案）。\n\n![](img/f80199d101da92d953f18eaa6205b48e_49_2.png)\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_49_3.png)\n\n## STEP 5\n\n这会添加壁纸更换器\
    \ Variety Wallpaper Changer 的 repo，这是一款基于 Ubuntu 的应用，可在 Mint 中运行并自动更改壁纸。现在 repo\
    \ 已添加，输入：sudo apt-get update，以更新新信息并将 repo 的内容添加到软件包数据库中。\n\n![](img/f80199d101da92d953f18eaa6205b48e_50_0.png)\n\
    \n## STEP 6\n\n现在要安装 Variety，输入：sudo apt-get install variety。按 y 确认并接受安装，然后继续安装。安装完成后，你可以输入\
    \ variety 到终端来运行该应用。\n\n![](img/f80199d101da92d953f18eaa6205b48e_50_1.png)\n\n\
    ## 移除应用\n\n除了安装应用之外，apt 命令也可以用来移除任何应用，有助于保持系统整洁并释放资源。\n\n## STEP 1\n\n要卸载或移除 Variety\
    \ 应用，输入以下命令：sudo apt-get remove variety。输入 y 继续卸载应用，注意你也会被告知由于移除应用而释放了多少硬盘空间。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_50_2.png)\n\n## STEP 3\n\n当你从系统中移除应用时，自动安装的且不再需要的应用也会被移除。你在之前的教程中已经看到，可以使用以下命令整理：sudo\
    \ apt-get autoremove，然后按 y 接受该过程。\n\n![](img/f80199d101da92d953f18eaa6205b48e_50_3.png)\n\
    \n## STEP 2\n\n虽然 ‘apt-get remove’ 命令会卸载应用，但它不会清除随应用而来的额外杂物，例如配置和库文件。要彻底清除杂物，输入：sudo\
    \ apt-get purge variety。\n\n![](img/f80199d101da92d953f18eaa6205b48e_50_4.png)\n\
    \n## STEP 4\n\n最后，要清理系统中所有未使用的软件包，并移除 autoremove 命令未移除的元素，你可以输入：sudo apt-get autoclean。这些最后几步对于保持你的\
    \ Linux Mint 设置良好运行并修剪安装和升级造成的多余部分至关重要。\n\n![](img/f80199d101da92d953f18eaa6205b48e_50_5.png)\n\
    \n## 通过终端安装应用 – 第 2 部分\n\n大多数时候你会使用标准的 apt-get 命令从终端安装应用。然而，有时一个应用需要更多的工作。这意味着从源代码安装应用，这听起来并不像最初那么可怕。\n\
    \n## 来自源代码\n\n你需要熟悉的命令是 Configure、Make 和 Install。你会发现很多应用使用从源代码安装，所以这绝对是值得投入时间的技能。\n\
    \nSTEP 1\nLinux 的源代码文件通常以 .TAR.GZ 或 .TAR.BZ2 的形式出现。两者都是压缩文件，包含创建应用所需的所有核心文件。开始本教程时，在\
    \ Home 中创建一个新文件夹：mkdir Vim\n\n![](img/f80199d101da92d953f18eaa6205b48e_51_0.png)\n\
    \nSTEP 3\nwget 命令从互联网检索内容，在此例中是 Vim 的 .BZ2 文件。为检查文件是否成功下载，输入：ls。根据 Mint 的文件系统颜色键，压缩文件应以红色显示。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_51_1.png)\n\nSTEP 2\n顺便说一下，Vim 是一个高级文本编辑器，我们将以它为例进行安装。进入新文件夹，cd\
    \ Vim，然后在新的 Vim 文件夹内，将以下命令输入到终端：wget ftp://ftp.vim.org/pub/vim/unix/vim-7.4.tar.bz2。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_51_2.png)\n\nSTEP 4\n我们现在需要解压缩文件的内容，因此输入：tar\
    \ -xf vim-7.4.tar.bz2 到终端。注意：你可以输入 tar -xf v 并按 Tab 键自动补全剩余的文件名。\n\n![](img/f80199d101da92d953f18eaa6205b48e_51_3.png)\n\
    \n## STEP 5\n\n如果你再次输入 ls，你会注意到已创建一个新文件夹：vim74；在 Mint 中以浅蓝色文本表示文件夹。创建主应用的根文件夹总是很有帮助的，然后当你通过此方法升级应用时，每个单独的版本都会有自己的文件夹。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_52_0.png)\n\n## STEP 6\n\n输入 cd vim74\
    \ 进入文件夹，再次 ls 查看其内容。很可能存在相当数量的文件，其中大部分是应用的核心文件，而其他文件将被标记为 README 或 INSTALL。明智的做法是先阅读这些文件，因为它们提供了有关安装的重要信息。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_52_1.png)\n\n## STEP 7\n\n安装的第一部分需要你输入\
    \ ./configure。./configure 命令会检查你的系统是否存在与应用相关的任何缺失依赖项。如果收到关于 C 编译器的错误，则输入：sudo\
    \ apt-get install build-essential。第三方应用 Ncurses 被记录为缺失。我们需要使用以下命令安装它：sudo apt-get\
    \ install libncurses5-dev libncursesw5-dev。\n\n![](img/f80199d101da92d953f18eaa6205b48e_52_2.png)\n\
    \n## STEP 8\n\n你可能需要继续安装新的依赖项，具体取决于应用。每次安装新的依赖项后，重新运行 ./configure，当它不再报告错误时，你可以继续安装的下一阶段。注意：你可能需要在线搜索某些错误信息。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_52_3.png)\n\n## STEP 9\n\n成功运行 ./configure\
    \ 后，系统会创建一个 Makefile。这需要通过输入：make 到终端来“制作”。这可能需要一段时间，具体取决于应用的大小。\n\n![](img/f80199d101da92d953f18eaa6205b48e_52_4.png)\n\
    \n## STEP 10\n\n最后，你需要在终端输入：sudo make install。这将安装应用，并使其在系统中可供使用。完成后，你可以执行该应用，在此例中通过在终端输入\
    \ vim 或通过 Dash 搜索它。\n\n![](img/f80199d101da92d953f18eaa6205b48e_52_5.png)\n\n\
    ## 使用终端\n\n```\nKernel command line: block2mtd.block2mtd=/dev/hda2,131072.rootfs\
    \ root=/dev/mtdblock0 rootfstype=jffs2 init=/etc/preinit  noinintrd console=tty0\
    \ console=ttyS0,38400n8 reboot=bios\nFound and enabled local APIC!\nEnabling fast\
    \ FPU save and restore... done.\nEnabling unmasked SIMD FPU exception support...\
    \ done.\nInitializing CPU#0\nPID hash table entries: 32 (order: 5, 128 bytes)\n\
    Detected 1991.657 MHz processor.\nConsole: colour VGA+ 80x25\nconsole [tty0] enabled\n\
    console [ttyS0] enabled\nDentry cache hash table entries: 1024 (order: 0, 4096\
    \ bytes)\nInode-cache hash table entries: 1024 (order: 0, 4096 bytes)\nMemory:\
    \ 5112k/8128k available (1497k kernel code, 2624k reserved, 597k data, 196k init,\
    \ 0k highmem)\nvirtual kernel memory layout:\n    fixmap  : 0xffffb000 - 0xfffff000\
    \   ( 280 kB)\n    vmalloc : 0xc1000000 - 0xffff7000   (1007 MB)\n    lowmem \
    \ : 0xc0000000 - 0xc07f0000   ( 7 MB)\n      .init : 0xc0313000 - 0xc0344000 \
