    - 104 使用註釋\n- 106 使用變量\n- 108 用戶輸入\n- 110 創建函數\n- 112 條件和循環\n- 114 Python 模塊\n\
    - 116 你知道嗎...調試\n\n## 為什麼選擇 Python？\n\n現代計算機可用的程式語言有很多，一些甚至仍可用于較舊的 8 位和 16 位計算機。這些語言中的一些是為科學工作設計的，其他則是為移動平台等設計的。那麼為什麼在眾多語言中選擇\
    \ Python 呢？\n\n### PYTHON POWER\n\n自從最早的家用電腦問世以來，愛好者、用戶和專業人士就一直廢寢忘食，奴役於一堆過熱的電路之上，創造出類似魔法的東西。\n\
    \n這些編程先驅開闢了新的前沿，打造了小型例程，使字母 'A' 能在屏幕上滾動。對於習慣了超高清圖形和開放世界多人線上遊戲的世代來說，這可能聽起來並不令人興奮。然而，四十多年前，這是令人驚豔的。\n\
    \n無論你使用的是 Android 裝置、iOS 裝置、PC、Mac、Linux、智能電視、遊戲主機、MP3 播放器、內建於汽車的 GPS 裝置、機上盒或成千上萬其他連接的“智能”家電，它們背後都有編程。\n\
    \n自然地，這些臥室編碼者幫助奠定了我們今天使用的每件數位科技的基礎。有些人後來成為頂級軟體公司的首席開發者，而另一些人則將可用硬體推向極限，創立了不斷讓我們驚嘆的十億英鎊遊戲帝國。\n\
    \n所有上述數位裝置都需要指令來告訴它們該做什麼，並允許與之互動。這些指令構成了裝置的編程核心，而該核心可以使用多種程式語言來構建。\n\n目前使用的語言取決於情況、平台、裝置用途以及裝置將如何與其\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_87_0.png)\n\n環境或用戶互動。作業系統，例如 Windows、macOS\
    \ 等，通常是 C++、C#、組合語言和某種視覺化語言的組合。遊戲通常使用 C++，而網頁可以使用眾多可用的語言，例如 HTML、Java、Python 等。\n\
    \n更通用的程式設計用於創建程式、應用、軟體或你想稱之為任何東西。它們廣泛應用於所有硬體平台，幾乎適用於任何可想像的應用。有些運行速度更快，有些則更容易學習和使用。Python\
    \ 就是這樣一種通用語言。\n\nPython 被稱為高階語言，因為它使用各種數組、變量、對象、算術、子例程、循環以及無數其他交互來“對話”硬體和作業系統。雖然它不如可以直接處理記憶體位址、呼叫堆疊和暫存器的低階語言那麼精簡，但其優勢在於它具有通用可訪問性且易於學習。\n\
    \nPython 在二十六年前創建，並不斷演進，成為學習電腦編程的理想入門語言。它非常適合業餘愛好者、愛好者、學生、教師以及那些只需創建自己與電腦本身或外部硬體之間獨特互動的人。\n\
    \nPython 可免費下載、安裝和使用，可用於 Linux、Windows、macOS、MS-DOS、OS/2、BeOS、IBM i 系列機器，甚至 RISC\
    \ OS。它曾被評為全球前五大程式語言之一，並不斷在硬體和網際網路發展曲線之前演進。\n\n那麼要回答這個問題：為什麼選擇 python？簡單來說，它是免費的、易於學習、功能異常強大、被普遍接受、有效且是出色的學習和教育工具。\n\
