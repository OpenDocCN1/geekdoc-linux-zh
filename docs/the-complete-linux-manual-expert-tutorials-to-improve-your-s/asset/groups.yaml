    ## 编译和执行


    你已经创建了第一个 C++ 程序，并且现在理解了其结构背后的基本原理。让我们开始编译并执行，或运行如果你更喜欢这样，程序并看看它是什么样子的。


    ## 来自 C++ 的问候


    在 Geany 中编译和执行代码非常简单，只需点击几个图标即可看到结果。方法如下。


    ### 第 1 步


