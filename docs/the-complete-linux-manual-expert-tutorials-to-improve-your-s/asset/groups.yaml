    this case Bash. The hash (#) denotes a comment line, one that is ignored by the
    system, the exclamation mark (!) means that the comment is bypassed and will force
    the script to execute the line as a command. This is also known as a Hash-Bang.


    ![](img/f80199d101da92d953f18eaa6205b48e_68_1.png)


    ## STEP 7


    You can save this file, clicking File > Save, and exit back to the Terminal. Entering
    ls, will reveal the script in the folder. To make any script executable, and able
    to run, you need to modify its permissions. Do this with chmod +x helloworld.sh.
    You need to do this with every script you create.


    ![](img/f80199d101da92d953f18eaa6205b48e_68_2.png)


    ## STEP 8


    When you enter ls again, you can see that the helloworld.sh script has now turned
    from being white to green, meaning that it''s now an executable file. To run the
    script, in other words make it do the things you''ve typed into it, enter: ./helloworld.sh.


    ![](img/f80199d101da92d953f18eaa6205b48e_68_3.png)


    ## STEP 9


    Although it''s not terribly exciting, the words ''Hello World!'' should now be
    displayed in the Terminal. The echo command is responsible for outputting the
    words after it in the Terminal, as we move on you can make the echo command output
    to other sources.


    ![](img/f80199d101da92d953f18eaa6205b48e_68_4.png)


    ## STEP 10


    Think of echo as the old BASIC Print command. It displays either text, numbers
    or any variables that are stored in the system, such as the current system date.
    Try this example: echo Hello World! Today is $(date +%A). The $(date +%A) is calling
    the system variable that stores the current day of the week.


    ![](img/f80199d101da92d953f18eaa6205b48e_68_5.png)

