    We’ve added a -n to the echo command here which will leave the cursor on the same
    line as the question, instead of a new line. The read command stores the users’
    input as the variables firstname and surname, to then read back later in the last
    echo line. And the clear command clears the screen.


    ![](img/f80199d101da92d953f18eaa6205b48e_70_4.png)


    ### STEP 10

    As a final addition, let’s include the date variable we used in the last section.
    Amend the last line of the script to read: echo Hello $firstname $surname, how
    are you on this fine $(date +%A)? The output should display the current day of
    the week, calling it from a system variable.


    ![](img/f80199d101da92d953f18eaa6205b48e_70_5.png)


    # Creating Bash Scripts

    – Part 3


    In the previous pages we looked at some very basic Bash scripting, which involved
    outputting text to the screen, getting a user’s input, storing it and outputting
    that to the screen; as well as including a system variable using the Date command.
    Now let’s combine what you’ve achieved so far and introduce Loops.


    ## IF, THEN, ELSE


    With most programming structures there will come a time where you need to loop
    through the commands you’ve entered to create better functionality, and ultimately
    a better program.


    ### STEP 1

    Let’s look at the If, Then and Else statements now, which when executed correctly,
    comprise a set of instructions and simply work out that IF something is present,
    THEN do something, ELSE do something different. Create a new script called greeting2.sh
    and enter the text in the screenshot below


    ![](img/f80199d101da92d953f18eaa6205b48e_71_0.png)


    ### STEP 2

    Greeting2.sh is a copy of greeting.sh but with a slight difference. Here we’ve
    added a loop starting at the if statement. This means, IF the variable entered
    is equal to David the next line, THEN, is the reaction to what happens, in this
    case it will output to the screen ‘Awesome name,’ followed by the variable (which
    is David).


    ![](img/f80199d101da92d953f18eaa6205b48e_71_2.png)


    ### STEP 3

    The next line, ELSE, is what happens if the variable doesn’t equal ‘David’. In
    this case it simply outputs to the screen the now familiar ‘Hello...’. The last
    line, the Fi statement, is the command that will end the loop. If you have an
    If command without a Fi command, then you get an error.


    ![](img/f80199d101da92d953f18eaa6205b48e_71_1.png)


    ### STEP 4

    You can obviously play around with the script a little, changing the name variable
    that triggers a response; or maybe even issuing a response where the first name
    and surname variables match a specific variable.


    ![](img/f80199d101da92d953f18eaa6205b48e_71_3.png)


    # MORE LOOPING


    You can loop over data using the FOR, WHILE and UNTIL statements. These can be
    handy if you''re batch naming, copying or running a script where a counter is
    needed.


    ### STEP 1

    Create a new script called count.sh. Enter the text in the screenshot below, save
    it and make it executable. This creates the variable ''count'' which at the beginning
    of the script equals zero. Then start the WHILE loop, which WHILE count is less
    than (the LT part) 100 will print the current value of count in the echo command.


    ```

    #!/bin/bash


    count=0


    while [ $count -lt 100 ]; do

    echo $count

    let count=count+1

    ```


    ### STEP 2

    Executing the count.sh script will result in the numbers 0 to 99 listing down
    the Terminal screen; when it reaches 100 the script will end. Modifying the script
    with the FOR statement, makes it work in much the same way. To use it in our script,
    enter the text from the screenshot into the count.sh script.


    ```

    #!/bin/bash


    for count in {0..100}; do

    echo $count

    let count=count+1

    done

    ```


    ### STEP 3

    The addition we have here is: for count in {0..100}; do. Which means: FOR the
    variable ''count'' IN the numbers from zero to one hundred, then start the loop.
    The rest of the script is the same. Run this script, and the same output should
    appear in the Terminal.


    ```

    #!/bin/bash


    for count in {0..100}; do

    echo $count

    let count=count+1

    done

    ```


    ### STEP 4

    The UNTIL loop works much the same way as the WHILE loop only, more often than
    not, in reverse. So our counting to a hundred, using UNTIL, would be: until [
    $count -gt 100 ]; do. The difference being, UNTIL count is greater than (the gt
    part) one hundred, keep on looping.


    ```

    #!/bin/bash


    until [ $count -gt 100 ]; do

    echo $count

    let count=count+1

    done

    ```


    ### STEP 5

    You''re not limited to numbers zero to one hundred. You can, within the loop,
    have whatever set of commands you like and execute them as many times as you want
    the loop to run for. Renaming a million files, creating fifty folders etc. For
    example, this script will create ten folders named folder1 through to folder10
    using the FOR loop.


    ```

    #!/bin/bash


    for count in {0..10}; do

    mkdir Folder$count

    let count=count+1

    done

    ```


    ### STEP 6

    Using the FOR statement once more, we can execute the counting sequence by manipulating
    the {0..100} part. This section of the code actually means {START..END..INCREMENT}.
    If there''s no increment then it''s just a single digit up to the END. For example,
    we could get the loops to count up to 1000 in two''s with: for count in {0..1000..2};
    do.


    ```

    #!/bin/bash


    for count in {0..1000..2}; do

    echo $count

    let count=count+1

    done

    ```

