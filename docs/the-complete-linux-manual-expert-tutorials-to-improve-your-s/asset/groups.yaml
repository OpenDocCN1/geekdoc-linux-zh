    # The Complete

    Linux

    Manual


    > “That’s what makes Linux so good: you put in something and that effort multiplies.
    It’s a positive feedback cycle.”

    > — Linus Torvalds (developer of the Linux kernel)


    Linux is everywhere. It powers the Internet as the main operating system behind
    the Web’s servers, it powers spacecraft, it’s the operating system for the fastest
    supercomputers in the world and it’s used in smart TVs and mobile devices. Why?
    Because it’s ultra stable, lightning fast and completely free of charge.


    However, there’s more to Linux than simply being a free to use operating system.
    Its unique configuration allows the user to customise and personalise the OS into
    any form they wish. A Linux user can change their OS look and feel from one day
    to the next, install thousands of freely available apps and programs and take
    back control of their computer.


    Linux is about freedom. Freedom from the walled-garden approach of other restrictive
    operating systems, freedom to choose what you want on your computer, freedom to
    alter it and use it how you please. It’s a worldwide community of like-minded
    users, all striving to get the best development from this incredible OS.


    With this book, you too can become a part of the open community of Linux users.
    The tutorials within these pages will help you get to grips with Linux, show you
    how it works, what you can do with it and how you can code with it to take your
    Linux experience to even greater heights.


    Discover Linux. Discover freedom.


