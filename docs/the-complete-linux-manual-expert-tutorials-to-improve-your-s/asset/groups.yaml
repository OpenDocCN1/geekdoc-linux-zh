  mdcn: "\n\n## 使用变量\n\n我们已经在 Python 代码中看到了一些变量的例子，但了解它们的工作方式以及 Python 如何为变量创建和分配特定值总是很有价值的。\n\
    \n### 各类变量\n\n在本教程中，你将使用 Python 3 IDLE Shell。如果尚未打开，请打开 Python 3 或关闭之前的 IDLE Shell\
    \ 以清除旧代码。\n\n### STEP 1\n\n在某些编程语言中，你需要使用美元符号来表示字符串，即由多个字符组成的变量，例如一个人的名字。在 Python\
    \ 中这不是必需的。例如，在 Shell 中输入：name=\"David Hayward\"（或使用你自己的名字，除非你也叫 David Hayward）。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_105_0.png)\n\n### STEP 2\n\n你可以通过发出\
    \ type() 命令来检查正在使用的变量类型，将变量名放在括号内。在我们的示例中，这将是：type(name)。添加一个新的字符串变量：title=\"\
    Descended from Vikings\"。\n\n![](img/f80199d101da92d953f18eaa6205b48e_105_1.png)\n\
    \n### STEP 3\n\n你之前看到过，变量可以使用变量名之间的加号进行连接。在我们的示例中，我们可以使用：print(name + \":\" +\
    \ title)。引号之间的中间部分允许我们在添加冒号和空格，因为变量连接时没有空格，所以我们需要手动添加它们。\n\n![](img/f80199d101da92d953f18eaa6205b48e_105_2.png)\n\
    \n### STEP 4\n\n你也可以在另一个变量中组合变量。例如，要将 name 和 title 变量组合成一个新变量，我们使用：character=name\
    \ + \": \" + title\n然后输出新变量的内容为：print(character)\n数字存储为不同的变量：\nage=44\nType(age)\n\
    正如我们所知，它们是整数。\n\n![](img/f80199d101da92d953f18eaa6205b48e_105_3.png)\n\n## 使用变量\n\
    \n### STEP 5\n\n然而，你不能在同一命令中同时组合字符串和整数类型变量，就像一组相似的变量一样。你需要将其中一个转换为另一个或反之亦然。当你尝试组合两者时，你会收到错误消息：\n\
    \n```\nprint (name + age)\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_106_0.png)\n\
    \n### STEP 6\n\n这是一个称为 TypeCasting 的过程。Python 代码为：\n\n```\nprint (character +\
    \ \" is \" + str(age) + \" years old.\")\n```\n\n或者你也可以使用：\n\n```\nprint (character,\
    \ \"is\", age, \"years old.\")\n```\n\n再次注意，在最后一个示例中，你不需要在引号中的单词之间加空格，因为逗号将每个\
    \ print 的参数单独处理\n\n![](img/f80199d101da92d953f18eaa6205b48e_106_1.png)\n\n###\
    \ STEP 7\n\nTypeCasting 的另一个例子是当你要求用户输入时，例如名字。例如，输入：\n\n```\nage= input (\"How\
    \ old are you? \")\n```\n\n从 Input 命令存储的所有数据都存储为字符串变量。\n\n![](img/f80199d101da92d953f18eaa6205b48e_106_2.png)\n\
    \n### STEP 8\n\n当你想处理用户输入的数字时，这会带来一些问题，因为 age + 10 不会工作，因为它是一个字符串变量和一个整数。相反，你需要输入：\n\
    \n```\nint(age) + 10\n```\n\n这将把 age 字符串 TypeCast 为可以操作的整数。\n\n![](img/f80199d101da92d953f18eaa6205b48e_106_3.png)\n\
    \n### STEP 9\n\n使用 TypeCasting 在处理浮点运算时也很重要；记住：带小数点的数字。例如，输入：\n\n```\nshirt=19.99\n\
    ```\n\n现在输入 type(shirt) 你会看到 Python 已将该数字分配为 ‘float’，因为该值包含小数点。\n\n![](img/f80199d101da92d953f18eaa6205b48e_106_4.png)\n\
    \n### STEP 10\n\n当组合整数和浮点数时，Python 通常会将整数转换为浮点数，但如果反过来应用，值得记住的是 Python 不会返回精确的值。转换浮点数到整数时，Python\
    \ 总是向下舍入到最接近的整数，称为截断；在我们的例子中，19.99 变成了 19。\n\n![](img/f80199d101da92d953f18eaa6205b48e_106_5.png)\n\
    \n## 用户输入\n\n我们已经从之前的一些示例中看到了代码与用户的一些基本交互，所以现在是时候专门关注如何从用户获取信息然后存储和展示它了。\n\n###\
    \ 用户友好\n\n你希望从用户获得的输入类型将极大地取决于你正在编码的程序类型。例如，游戏可能会询问角色的名字，而数据库可以询问个人详细信息。\n\n###\
    \ STEP 1\n如果尚未打开，请打开 Python 3 IDLE Shell，并在编辑器中开始一个新文件。让我们从非常简单的事情开始，输入：\n```\n\
    print(\"Hello\")\nfirstname=input(\"What is your first name? \")\nprint(\"Thanks.\"\
    )\nsurname=input(\"And what is your surname? \")\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_107_0.png)\n\
    \n### STEP 3\n现在我们将用户的名字存储在几个变量中，我们可以随时调用它们：\n```\nprint(\"Welcome\", firstname,\
    \ surname, \". I hope you're well today.\")\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_107_1.png)\n\
    \n### STEP 2\n保存并执行代码，正如你可能已经怀疑的那样，在 IDLE Shell 中，程序会要求你输入名字，将其存储为变量 firstname，然后是你的姓氏；也存储在其自己的变量中（surname）。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_107_2.png)\n\n### STEP 4\n运行代码，你可以看到一个小问题，姓氏后的句号后面跟着一个空格。为了消除它，我们可以在代码中用加号代替逗号：\n\
    ```\nprint(\"Welcome\", firstname, surname+\". I hope you're well today.\")\n\
    ```\n\n![](img/f80199d101da92d953f18eaa6205b48e_107_3.png)\n\n### STEP 5\n\n你并不总是需要在\
    \ input 命令中包含引号文本。例如，你可以询问用户的名字，并在下一行输入：\n\n```\nprint(\"Hello. What's your name?\"\
    )\nname=input()\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_108_0.png)\n\n\
    ### STEP 8\n\n你在这里创建的是一个条件，我们很快会介绍。在简短地说，我们使用用户的输入并将其与条件进行衡量。因此，如果用户输入 David 作为他们的名字，守卫会让他们不受阻碍地通过。否则，如果他们输入的名字不是\
    \ David，守卫会挑战他们进行战斗。\n\n![](img/f80199d101da92d953f18eaa6205b48e_108_1.png)\n\n\
    ### STEP 6\n\n上一步的代码通常被认为比在 input 命令中包含大量文本更简洁，但这并不是一成不变的规则，所以在这些情况下请随意。扩展代码，试试这个：\n\
    \n```\nprint(\"Halt! Who goes there?\")\nname=input()\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_108_2.png)\n\
    \n### STEP 9\n\n正如你之前学到的，任何来自用户的输入自动都是字符串，所以你需要应用 TypeCast 将其转换为其他东西。这为 input\
    \ 命令增加了一些有趣的补充。例如：\n\n```\n# Code to calculate rate and distance\nprint(\"Input\
    \ a rate and a distance\")\nrate = float(input(\"Rate: \"))\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_108_3.png)\n\
    \n### STEP 7\n\n这是一个不错的文本冒险游戏的开始，也许？现在你可以扩展它并使用用户的原始输入来丰富游戏：\n\n```\nif name==\"\
    David\":\n    print(\"Welcome, good sir. You may pass.\")\nelse:\n    print(\"\
    I know you not. Prepare for battle!\")\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_108_4.png)\n\
    \n### STEP 10\n\n为了完成速率和距离代码，我们可以添加：\n\ndistance = float(input(\"Distance: \"\
    ))\nprint(\"Time:\", (distance / rate))\n\n保存并执行代码并输入一些数字。使用 float(input 元素，我们告诉\
    \ Python 任何输入的内容都是浮点数而不是字符串。\n\n![](img/f80199d101da92d953f18eaa6205b48e_108_5.png)\n\
    \n## 创建函数\n\n现在你已经掌握了变量和用户输入的使用，下一步是处理函数。你已经使用了几个函数，例如 print 命令，但 Python 允许你定义自己的函数。\n\
    \n### FUNKY FUNCTIONS\n\n函数是你输入到 Python 中以执行某项操作的命令。它是一小段自包含的代码，接收数据，对其进行处理然后返回结果。\n\
    \n### STEP 1\n函数处理的不仅仅是数据。它们可以在 Python 中执行各种有用的操作，例如排序数据、将项目从一种格式更改为另一种格式以及检查项目的长度或类型。基本上，函数是一个简短的词，后面跟着括号。例如，len()、list()\
    \ 或 type()。\n\n![](img/f80199d101da92d953f18eaa6205b48e_109_0.png)\n\n### STEP\
    \ 3\n你可以用几乎相同的方式通过函数传递变量。假设你想要一个人的姓氏中的字母数，你可以使用以下代码（为此示例进入文本编辑器）：\nname=input(\"\
    Enter your surname: \")\ncount=len(name)\nprint(\"Your surname has\", count, \"\
    letters in it.\")\n按 F5 并保存代码以执行它。\n\n![](img/f80199d101da92d953f18eaa6205b48e_109_1.png)\n\
    \n### STEP 2\n函数接收数据，通常是变量，根据函数被编程要执行的操作对其进行处理并返回最终值。被处理的数据进入括号内，因此如果你想知道单词 antidisestablishmentarianism\
    \ 中有多少个字母，那么你会输入：len(\"antidisestablishmentarianism\") 并返回数字 28。\n\n![](img/f80199d101da92d953f18eaa6205b48e_109_2.png)\n\
    \n### STEP 4\nPython 内置了数十个函数，数量太多，无法在此有限的空间中全部介绍。然而，要查看 Python 3 可用的内置函数列表，请导航到\
    \ www.docs.python.org/3/library/functions.html。这些是预定义的函数，但由于用户创建了更多函数，它们并不是唯一可用的函数。\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_109_3.png)\n\n"
