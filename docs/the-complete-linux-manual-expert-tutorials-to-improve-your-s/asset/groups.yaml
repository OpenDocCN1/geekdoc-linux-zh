  - "[PAGE 135]\n\n# Strings\n\nStrings are objects that represent and hold sequences\
    \ of characters. For example, you could have a universal greeting in your code\
    \ ‘Welcome’ and assign that as a string to be called up wherever you like in the\
    \ program.\n\n# STRING THEORY\n\nThere are different ways in which you can create\
    \ a string of characters, which historically are all carried over from the original\
    \ C language and still supported by C++.\n\n# STEP 1\n\nTo create a string, you\
    \ use the char function. Open a new C++ file and begin with the usual header:\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n}\n```\n\n\
    ![](img/f80199d101da92d953f18eaa6205b48e_135_0.png)\n\n# STEP 2\n\nIt’s easy to\
    \ confuse a string with an array. Here’s an array, which can be terminated with\
    \ a null character:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main()\n\
    {\n    char greet[8] = {'W', 'e', 'l', 'c', 'o', 'm', 'e', '\\0'};\n    cout <<\
    \ greet << \"\\n\";\n}\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_135_1.png)\n\
    \n# STEP 3\n\nBuild and run the code and ‘Welcome’ appears on the screen. While\
    \ this is perfectly fine, it’s not a string. A string is a class, which defines\
    \ objects that can be represented as a stream of characters and doesn’t need to\
    \ be terminated like an array. The code can therefore be represented as:\n\n```\n\
    #include <iostream>\nusing namespace std;\n\nint main()\n{\n    char greet[] =\
    \ \"Welcome\";\n    cout << greet << \"\\n\";\n}\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_135_2.png)\n\
    \n# STEP 4\n\nIn C++ there’s also a string function, which works in much the same\
    \ way. Using the greeting code again, you can enter:\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n    string greet = \"Welcome\";\n    cout\
    \ << greet << \"\\n\";\n}\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_135_3.png)"
  - "[PAGE 136]\n\n# STEP 5\n\nThere are also many different operations that you can\
    \ apply with the string function. For instance, to get the length of a string\
    \ you can use:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main ()\n\
    {\n    string greet = \"Welcome\";\n    cout << \"The length of the string is:\
    \ \";\n    cout << greet.size() << \"\\n\";\n}\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_136_0.png)\n\
    \n# STEP 6\n\nYou can see that we used greet.size() to output the length, the\
    \ number of characters there are, of the contents of the string. Naturally, if\
    \ you call your string something other than greet, then you need to change the\
    \ command to reflect this. It's always stringname.operation. Build and run the\
    \ code to see the results.\n\n![](img/f80199d101da92d953f18eaa6205b48e_136_1.png)\n\
    \n# STEP 7\n\nYou can of course add strings together, or rather combine them to\
    \ form longer strings:\n\n```\n#include <iostream>\nusing namespace std;\n\nint\
    \ main ()\n{\n    string greet1 = \"Hello\";\n    string greet2 = \" , world!\"\
    ;\n    string greet3 = greet1 + greet2;\n\n    cout << greet3 << \"\\n\";\n}\n\
    ```\n\n![](img/f80199d101da92d953f18eaa6205b48e_136_2.png)\n\n# STEP 8\n\nJust\
    \ as you might expect, you can mix in an integer and store something to do with\
    \ the string. In this example, we created int length, which stores the result\
    \ of string.size() and outputs it to the user:\n\n```\n#include <iostream>\nusing\
    \ namespace std;\n\nint main ()\n{\n    int length;\n    string greet1 = \"Hello\"\
    ;\n    string greet2 = \" , world!\";\n    string greet3 = greet1 + greet2;\n\n\
    \    length = greet3.size();\n    cout << \"The length of the combined strings\
    \ is: \" << length << \"\\n\";\n}\n```\n\n# STEP 9\n\nUsing the available operations\
    \ that come with the string function, you can manipulate the contents of a string.\
    \ For example, to remove characters from a string you could use:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n    string strg (\"Here\
    \ is a long sentence in a string.\");\n    cout << strg << '\\n';\n\n    strg.erase\
    \ (10,5);\n    cout << strg << '\\n';\n\n    strg.erase (strg.begin()+8);\n  \
    \  cout << strg << '\\n';\n\n    strg.erase (strg.begin()+9, strg.end()-9);\n\
    \    cout << strg << '\\n';\n}\n```\n\n# STEP 10\n\nIt's worth spending some time\
    \ playing around with the numbers, which are the character positions in the string.\
    \ Occasionally, it can be hit and miss whether you get it right, so practice makes\
    \ perfect. Take a look at the screenshot to see the result of the code.\n\n![](img/f80199d101da92d953f18eaa6205b48e_136_3.png)"
  - "[PAGE 137]\n\n# C++ Maths\n\nProgramming is mathematical in nature and as you\
    \ might expect, there’s plenty of built-in scope for some quite intense maths.\
    \ C++ has a lot to offer someone who’s implementing mathematical models into their\
    \ code. It can be extremely complex or relatively simple.\n\n# C++ = MC2\n\nThe\
    \ basic mathematical symbols apply in C++ as they do in most other programming\
    \ languages. However, by using the C++ Math Library, you can also calculate square\
    \ roots, powers, trig and more.\n\n# STEP 1\n\nC++’s mathematical operations follow\
    \ the same patterns as those taught in school, in that multiplication and division\
    \ take precedence over addition and subtraction. You can alter that though. For\
    \ now, create a new file and enter:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    float numbers = 100;\n\n    numbers = numbers +\
    \ 10; // This adds 10 to the initial 100\n\n    cout << numbers << \"\\n\";\n\n\
    \    numbers = numbers - 10; // This subtracts 10 from the new 110\n\n    cout\
    \ << numbers << \"\\n\";\n}\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_137_0.png)\n\
    \n# STEP 2\n\nWhile simple, it does get the old maths muscle warmed up. Note that\
    \ we used a float for the numbers variable. While you can happily use an integer,\
    \ if you suddenly started to use decimals, you would need to change to a float\
    \ or a double, depending on the accuracy needed. Run the code and see the results.\n\
    \n![](img/f80199d101da92d953f18eaa6205b48e_137_1.png)\n\n# STEP 3\n\nMultiplication\
    \ and division can be applied as such:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    float numbers = 100;\n\n    numbers = numbers *\
    \ 10; // This multiplies 100 by 10\n\n    cout << numbers << \"\\n\";\n\n    numbers\
    \ = numbers / 10; // And this divides 1000 by 10\n\n    cout << numbers << \"\\\
    n\";\n}\n```\n\n![](img/f80199d101da92d953f18eaa6205b48e_137_2.png)\n\n# STEP\
    \ 4\n\nAgain, execute the simple code and see the results. While not particularly\
    \ interesting, it’s an introduction to C++ maths. We used a float here, so you\
    \ can play around with the code and multiply by decimal places, as well as divide,\
    \ add and subtract.\n\n![](img/f80199d101da92d953f18eaa6205b48e_137_3.png)"
