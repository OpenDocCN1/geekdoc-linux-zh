    ## 安装 Linux


    一旦 Live 环境启动完成，你会看到将发行版安装到计算机的选项。先随意浏览一下，准备好后在桌面上查找安装选项。


    ### 第 1 步


    如果已连接到互联网（如果没有，现在请连接），并且处于 Live 环境中，请双击桌面上的 Install Linux Mint 图标开始安装过程。其他发行版会显示其自己的名称，当然，但过程是相同的。准备好后点击
    Continue。


    ![](img/f80199d101da92d953f18eaa6205b48e_22_0.png)


    ### 第 2 步


    虽然安装过程在大多数 Linux 发行版中非常相似，但有些发行版在安装期间会提出不同的问题。通常这些问题并不太困难，没有什么很技术性的内容，但有些例如“安装第三方软件...”可能会让人困惑。在这种情况下你可以点击
    Continue，但如果不确定，请确保手边有一台联网设备以便提问。


    ![](img/f80199d101da92d953f18eaa6205b48e_22_1.png)


    ### 第 3 步


    安装新操作系统时，建议擦除旧操作系统并用新系统替换。当安装过程进行到此阶段时，请确保已选择“Erase disk and install Linux...”选项。注意：这会完全从你的计算机中擦除
    Windows 10，因此请确保已备份所有个人文件和数据。


    ![](img/f80199d101da92d953f18eaa6205b48e_22_2.png)


    ### 第 4 步


    在安装过程开始之前，会询问你有关硬盘擦除选择的决定是否正确。这是你最后一次退出安装的机会。如果你确定不介意擦除所有内容并重新开始使用 Linux Mint，请点击
    Continue。如果需要备份文件，请取出 Linux 光盘/USB，重新启动，备份后再重新开始。


    ![](img/f80199d101da92d953f18eaa6205b48e_22_3.png)


    ### 第 5 步


    最终会要求你设置 Linux 用户名和密码。首先输入你的姓名，然后输入计算机名称，即在网络上识别它的名称。接下来选择一个用户名，然后设置一个良好的密码。你可以勾选
    Login Automatically 选项，但暂时保留 Encrypt Home Folder 选项。


    ![](img/f80199d101da92d953f18eaa6205b48e_22_4.png)


    ### 第 6 步


    安装过程可能很快，并且可能还有更多问题需要回答，或者它可能根据你之前的回答直接开始安装 Linux。无论如何，最后会要求你 Continue Testing
    the Live Environment 或 Restarting to use the newly installed OS。如果准备好使用 Linux，请点击
    Restart Now。


    ![](img/f80199d101da92d953f18eaa6205b48e_22_5.png)


    ## 安装虚拟环境


    虚拟环境是一个模拟的计算机系统。使用虚拟机，你可以模拟一台标准 PC 并在其上安装整个操作系统，而不会影响计算机上已安装的操作系统。这是一个在仍以 Windows
    10 为主要操作系统的同时测试和使用 Linux 的好方法。


    ## 虚拟化


    使用虚拟机（VM）会占用计算机的资源：内存、硬盘空间、处理器使用等。在开始之前请确保每项资源都足够。


    ### 第 1 步

    我们在此使用 VirtualBox，因为它是上手最简单的虚拟环境之一。

    进入 www.virtualbox.org 并点击“Download VirtualBox”。这会带你到主下载页面。找到适合你系统的正确主机：Windows
    或 Mac，主机即当前已安装的操作系统，然后点击链接开始下载。


    ![](img/f80199d101da92d953f18eaa6205b48e_23_0.png)


    ### 第 3 步

    下载了正确的软件包后，在安装任何内容之前，你需要确保正在使用的计算机能够承载 VM。为此，请重新启动计算机并进入 BIOS。计算机启动时，按 Del、F2
    或其他必要的键以 Enter Setup。


    ![](img/f80199d101da92d953f18eaa6205b48e_23_1.png)


    ### 第 2 步

    接下来，仍在 VirtualBox 下载页面上，找到 VirtualBox Extension Pack 链接。扩展包支持 USB 设备以及众多其他附加功能，可帮助使
    VM 环境更准确地模拟“真实”计算机。


    ![](img/f80199d101da92d953f18eaa6205b48e_23_2.png)


    ### 第 4 步

    每个 BIOS 的布局都不同，很难评估在每个个人示例中应查找的位置。然而作为一般经验法则，你正在寻找 Intel Virtualisation Technology，或简单地
    Virtualisation，通常位于 BIOS 的 Advanced 部分。当你找到它时，启用它，保存设置，退出 BIOS 并重新启动计算机。


    ![](img/f80199d101da92d953f18eaa6205b48e_23_3.png)


    ### 第 5 步


    计算机重新启动后，找到已下载的主 VirtualBox 应用程序并双击以开始安装过程。准备好后点击 Next 继续。


    ![](img/f80199d101da92d953f18eaa6205b48e_24_0.png)


    ### 第 6 步


    VirtualBox 的默认安装位置应能满足大多数用户需求，但如果你有特殊位置要求，请点击“Browse”按钮并更改安装文件夹。然后，确保 VirtualBox
    功能树中的所有图标都被选中，即它们旁边没有红色 X。点击 Next 继续。


    ![](img/f80199d101da92d953f18eaa6205b48e_24_1.png)


    ### 第 7 步


    如果愿意，本节可以保留默认设置。它只是让处理 VM 时变得更轻松一些，尤其是在处理未来可能遇到的已下载 VM 时。再次点击 Next 即可进入下一阶段。


    ![](img/f80199d101da92d953f18eaa6205b48e_24_2.png)


    ### 第 8 步


    安装 VirtualBox 时，你的网络连接会短暂中断一段时间。这是因为 VirtualBox 正在创建一个链接的虚拟网络连接，以便任何已安装的 VM 都能通过计算机已建立的网络连接访问互联网和家庭网络资源。点击
    Yes，然后点击 Install 开始安装。


    ![](img/f80199d101da92d953f18eaa6205b48e_24_3.png)


    ### 第 9 步


    Windows 很可能会要求你接受安全通知。对此点击 Yes，你可能会遇到一个对话框要求你信任来自 Oracle 的安装；再次点击 yes 并接受 VirtualBox
    应用程序的安装。完成后，点击 finish 启动 VirtualBox。


    ![](img/f80199d101da92d953f18eaa6205b48e_24_4.png)


    ### 第 10 步


    VirtualBox 运行后，你现在可以安装 VirtualBox Extension Pack。找到已下载的插件并双击。VirtualBox 分析插件时可能会有短暂暂停，但最终会收到安装提示；显然点击
    Install 开始该过程，滚动下一屏幕以接受协议并点击 I Agree。


    ![](img/f80199d101da92d953f18eaa6205b48e_24_5.png)


    ## 在虚拟环境中安装 Linux


    Oracle 的 VirtualBox 现在已运行，接下来任务是创建将安装 Linux 的虚拟机（VM）环境。此过程不会影响你当前已安装的操作系统，这就是
    VM 是一个绝佳选择的原因。


    ## 创建 VM


    创建 VM 时有许多选项可供选择。现在，让我们设置一个足以运行 Mint Cinnamon 并良好运行的 VM。


    ### 第 1 步


    打开 VirtualBox 后，点击应用右上角的 New 图标。这将打开新 VM 向导。


    ![](img/f80199d101da92d953f18eaa6205b48e_25_0.png)


    ### 第 3 步


    下一部分定义 VM 分配的系统内存或 RAM 的数量。请记住该数量是从计算机上已安装的可用内存中扣除的，因此不要给 VM 分配太多。例如，我们安装了 8GB
    内存，并给 VM 分配了 2GB。准备好后，点击 Next 继续。


    ![](img/f80199d101da92d953f18eaa6205b48e_25_1.png)


    ### 第 2 步


    在 Name 旁边的框中，输入 Linux Mint，VirtualBox 应该会自动选择 Linux 作为 Type 和 Ubuntu (64-bit)
    作为 Version；如果没有，请使用下拉框选择正确的设置（请记住 Mint 主流版本基于 Ubuntu）。准备好继续时点击 Next。


    ![](img/f80199d101da92d953f18eaa6205b48e_25_2.png)


    ### 第 4 步


    本节是你开始创建 VM 用于安装 Mint 的虚拟硬盘的位置。默认选项“Create a virtual hard disk now”是我们使用的选项。点击
    Create 继续。


    ![](img/f80199d101da92d953f18eaa6205b48e_25_3.png)


