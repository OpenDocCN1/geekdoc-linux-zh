    # 完整的

    Linux

    手册


    > “这就是 Linux 如此出色的原因：你投入一些东西，这种努力就会成倍增长。这是一个正反馈循环。”

    > —— 林纳斯·托瓦兹（Linux 内核的开发者）


    Linux 无处不在。它作为网络服务器背后的主要操作系统推动着互联网，它为航天器提供动力，它是世界上最快超级计算机的操作系统，也用于智能电视和移动设备。为什么？因为它超稳定、速度极快且完全免费。


    然而，Linux 的意义远不止于免费使用的操作系统。其独特的配置允许用户将操作系统定制和个性化为他们想要的任何形式。Linux 用户可以从一天到下一天改变操作系统的外观和感觉，安装数千个免费的应用程序和程序，并重新掌控自己的计算机。


    Linux 代表自由。摆脱其他限制性操作系统的围墙花园做法的自由，选择自己想要在计算机上使用的东西的自由，自由地更改它并按自己的意愿使用它。这是一个志同道合的用户组成的全球社区，都致力于为这个令人难以置信的操作系统获得最佳发展。


    有了这本书，你也可以成为 Linux 用户开放社区的一员。这些页面中的教程将帮助你掌握 Linux，展示它是如何工作的，你可以用它做什么，以及如何用它来编码，将你的
    Linux 体验提升到更高的高度。


    发现 Linux。发现自由。


