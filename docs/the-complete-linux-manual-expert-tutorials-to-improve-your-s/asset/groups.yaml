    # 创建 Bash 脚本

    — 第 2 部分


    之前我们看了如何创建你的第一个 Bash 脚本 Hello World，以及添加系统变量。现在你可以扩展这些内容，并在开始使用自己独特的变量进行尝试时看看能做什么。


    ## 变量


    正如其他所有编程语言一样，Bash 脚本可以从系统中存储和调用某些变量，无论是通用变量还是用户创建的变量。


    ### STEP 1

    让我们开始创建一个名为 hello.sh 的新脚本；x ed hello.sh 在其中输入：#!/bin/bash，然后，echo Hello $1 保存文件并退出
    Xed。回到终端中，使用以下命令使脚本可执行：chmod +x hello.sh


    ![](img/f80199d101da92d953f18eaa6205b48e_69_0.png)


    ### STEP 2

    由于脚本现在可执行，使用 ./hello.sh 运行它。现在，正如你可能预期的那样，终端中会显示简单的‘Hello’。然而，如果你随后带上变量发出命令，就会变得有趣起来。例如，尝试
    ./hello.sh David。


    ![](img/f80199d101da92d953f18eaa6205b48e_69_2.png)


    ### STEP 3

    输出现在将是 Hello David。这是因为 Bash 会自动为用户分配变量，然后将它们保存并传递给脚本。因此变量‘$1’现在保存‘David’。你可以通过输入不同的内容来更改变量：./hello.sh
    Mint。


    ![](img/f80199d101da92d953f18eaa6205b48e_69_1.png)


    ### STEP 4

    你甚至可以重命名变量。用以下内容修改 hello.sh 脚本：firstname=$1, surname=$2, echo Hello $firstname
    $surname。将每个语句放在新的一行。保存脚本并退出回到终端。


    ![](img/f80199d101da92d953f18eaa6205b48e_69_3.png)


    # 创建 Bash 脚本 – 第 2 部分


    ### STEP 5

    当你现在运行脚本时，可以使用两个自定义变量：./hello.sh David Hayward。自然地用你自己的名字更改这两个变量；除非你也叫 David Hayward。目前我们只是打印内容，所以让我们稍微扩展一下这两个变量的使用。


    ![](img/f80199d101da92d953f18eaa6205b48e_70_0.png)


    ### STEP 6

    使用与 hello.sh 脚本相同的格式创建一个名为 addition.sh 的新脚本，但更改变量名。这里我们添加了 firstname 和 secondnumber，并使用
    echo 命令通过放置整数表达式来输出一些简单的算术，echo The sum is $(($firstnumber+$secondnumber))。保存脚本，并使其可执行（chmod
    +x addition.sh）。


