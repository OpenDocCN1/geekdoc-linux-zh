    \n![](img/f80199d101da92d953f18eaa6205b48e_86_0.png)\n\nPython 是一種出色的程式語言，結合了易用性和充足的強大功能，讓使用者既能創建小型實用工具，也能處理性能要求高的計算任務。\n\
    \n然而，Python 的價值不僅僅在於它只是一種程式語言。它背後擁有一個充滿活力且生機勃勃的社群，分享知識、代碼和項目想法，以及未來版本的錯誤修復。\n\n\
    我們在本書的這一節中使用了 Raspberry Pi，因為它基於 Linux，並且是目前最好的編程平台之一。Pi 的特性和功能使其成為完美的 Python\
    \ 編程夥伴，讓我們開始吧。\n\n- 88 為什麼選擇 Python？\n- 90 如何在 Linux 中設置 Python\n- 92 首次啟動 Python\n\
