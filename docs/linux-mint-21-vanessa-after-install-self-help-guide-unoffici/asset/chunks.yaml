  trans: "\n\n# 使用 flatpak 命令行安装 Ardour\n\n![](img/image00474.jpeg)\n\n打开终端。\n\n输入，\n\
    \n```bash\nflatpak install flathub org.ardour.Ardour\n```\n\n按下回车键。\n\n# LMMS\n\
    \n## 使用软件管理器安装 LMMS\n\n![](img/image00475.jpeg)\n\n打开软件管理器。\n\n输入，\n\nLMMS。\n\n\
    点击 LMMS。\n\n点击 安装。\n\n## 使用 apt 命令行安装 LMMS\n\n![](img/image00476.jpeg)\n\n打开终端。\n\
    \n输入，\n\n```bash\nsudo apt install lmms\n```\n\n按下回车键。\n\n## 使用 flatpak 命令行安装\
    \ LMMS\n\n![](img/image00477.jpeg)\n\n打开终端。\n\n输入，\n\n```bash\nflatpak install\
    \ flathub io.lmms.LMMS\n```\n\n按下回车键。\n\n# CD/DVD 刻录机\n\nCD/DVD 刻录机允许将个人数据和信息备份到\
    \ CD 或 DVD，并具有以下功能：\n\n*   将家庭录像传输到 CD 和 DVD\n*   随身收听无版权音乐\n*   将文档从旧电脑备份到新电脑\n\
    \n本章涵盖了：\n\n### Brasero\n*   使用软件管理器安装 Brasero\n*   使用 apt 命令行安装 Brasero\n\n###\
    \ K3b\n*   使用软件管理器安装 K3b\n*   使用 apt 命令行安装 K3b\n\n### XFBurn\n*   使用软件管理器安装 XFBurn\n\
    *   使用 apt 命令行安装 XFBurn\n\n# Brasero\n\n## 使用软件管理器安装 Brasero\n\n![](img/image00478.jpeg)\n\
    \n打开软件管理器。\n\n输入，\n\nbrasero。\n\n点击 Brasero。\n\n点击 安装。\n\n## 使用 apt 命令行安装 Brasero\n\
    \n![](img/image00479.jpeg)\n\n打开终端。\n\n输入，\n\n```bash\nsudo apt install brasero\n\
    ```\n\n按下回车键。\n\n# K3b\n\n## 使用软件管理器安装 K3b\n\n![](img/image00480.jpeg)\n\n打开软件管理器。\n\
    \n输入，\n\nk3b。\n\n点击 K3b。\n\n点击 安装。\n\n## 使用 apt 命令行安装 K3b\n\n![](img/image00481.jpeg)\n\
    \n打开终端。\n\n输入，\n\n```bash\nsudo apt install k3b\n```\n\n按下回车键。\n\n# XFBurn\n\n\
    ## 使用软件管理器安装 XFBurn\n\n![](img/image00482.jpeg)\n\n打开软件管理器。\n\n输入，\n\nxfburn。\n\
    \n点击 XFBurn。\n\n点击 安装。\n\n## 使用 apt 命令行安装 XFBurn\n\n![](img/image00483.jpeg)\n\
    \n打开终端。\n\n输入，\n\n```bash\nsudo apt install xfburn\n```\n\n按下回车键。\n\n# 云备份\n\n\
    云备份软件允许在服务器上远程存储文件，并在：\n\n*   在文件或文件夹被创建或编辑时自动进行备份\n*   使用 `WebDAV` 协议将云存储映射为本地驱动器\n\
    *   设置文件夹同步到远程服务器\n\n本章涵盖了：\n\n### Insync\n*   使用 .deb 安装 Insync\n*   使用 apt 命令行安装\
    \ Insync\n\n### overGrive\n*   使用 .deb 安装 overGrive\n\n# Insync\n\n## 使用 .deb\
    \ 安装 Insync\n\n![](img/image00484.jpeg)\n\n访问，\n\n`https://www.insynchq.com/downloads`\n\
    \n点击 Linux 企鹅图标。\n\n点击 下载 Linux 版。\n\n点击 安装程序。\n\n点击 第一个框。\n\n点击 Linux Mint。\n\
    \n点击 第二个框。\n\n点击 20.x。\n\n点击 下载下载 `insync_3.7.9.50368-focal_amd64.deb`。\n\n前往\
    \ `insync_3.7.9.50368-focal_amd64.deb` 下载的位置。\n\n双击 `insync_3.7.9.50368-focal_amd64.deb`。\n\
    \n点击 安装。\n\n## 使用 apt 命令行安装 Insync\n\n![](img/image00485.jpeg)\n\n打开终端。\n\n输入，\n\
    \n```bash\nsudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys ACCAF35C\n\
    ```\n\n按下回车键。\n\n![](img/image00486.jpeg)\n\n输入，\n\n```bash\nsudo xed /etc/apt/sources.list.d/insync.list\n\
    ```\n\n![](img/image00487.jpeg)\n\n输入，\n\n```text\ndeb http://apt.insync.io/mint\
    \ vanessa non-free contrib\n```\n\n点击 保存。\n\n按下 `CTRL + S`。\n\n![](img/image00488.jpeg)\n\
    \n输入，\n\n```bash\nsudo apt update && sudo apt install insync\n```\n\n按下回车键。\n\n\
    # overGrive\n\n## 使用 .deb 安装 overGrive\n\n![](img/image00489.jpeg)\n\n访问，\n\n\
    [`www.thefanclub.co.za/overgrive`](https://www.thefanclub.co.za/overgrive)\n\n\
    点击 `overGrive 3.4.5 - Debian | Ubuntu | Mint` 下载 `overgrive_3.4.5_all.deb`。\n\n\
    前往 `overgrive_3.4.5_all.deb` 下载的位置。\n\n双击 `overgrive_3.4.5_all.deb`。\n\n点击 安装。\n\
    \n# 云办公件\n\n云办公套件是桌面办公软件的 Web 版本，提供：\n\n*   在创建或编辑文档时自动保存\n*   可以添加新功能或增强现有功能的扩展\n\
    *   全功能或精简版的替代方案，通常有付费层\n\n本章涵盖了：\n\n### Google Docs\n*   Google Docs \n\n###\
    \ Microsoft Office\n*   Microsoft Office\n\n### Cloud Office Suites\n*   云办公套件\n\
    \n"
- fmt: "\n# Pidgin\n\n```bash\nsudo apt install pidgin\n```\nPress, Enter.\n\n## Pidgin\
    \ Install Using flatpak Command Line\n![](Images/image00505.jpeg)\n\nOpen, Terminal.\n\
    \nType In,\n```bash\nflatpak install flathub im.pidgin.Pidgin\n```\nPress, Enter.\n\
    \n# Signal\n\n## Signal Install Using Software Manager\n![](Images/image00506.jpeg)\n\
    \nOpen, Software Manager.\n\nType In,\n`signal`\n\nClick, Signal Desktop.\nClick,\
    \ Install.\n\n## Signal Install Using flatpak Command Line\n![](Images/image00507.jpeg)\n\
    \nOpen, Terminal.\n\nType In,\n```bash\nflatpak install flathub org.signal.Signal\n\
    ```\nPress, Enter.\n\n## Signal Install Using Snap Store\n![](Images/image00508.jpeg)\n\
    \nOpen, Snap Store.\n\nType In,\n`signal`\n\nClick, `signal-desktop`.\nClick,\
    \ Install.\n\n## Signal Install Using snap Command Line\n![](Images/image00509.jpeg)\n\
    \nOpen, Terminal.\n\nType In,\n```bash\nsudo snap install signal-desktop\n```\n\
    Press, Enter.\n\n# Telegram\n\n## Telegram Install Using Software Manager\n![](Images/image00510.jpeg)\n\
    \nOpen, Software Manager.\n\nType In,\n`telegram`\n\nClick, Telegram.\nClick,\
    \ Install.\n\n## Telegram Install Using flatpak Command Line\n![](Images/image00511.jpeg)\n\
    \nOpen, Terminal.\n\nType In,\n```bash\nflatpak install flathub org.telegram.desktop\n\
    ```\nPress, Enter.\n\n## Telegram Install Using Snap Store\n![](Images/image00512.jpeg)\n\
    \nOpen, Snap Store.\n\nType In,\n`telegram`\n\nClick, `telegram-desktop`.\nClick,\
    \ Install.\n\n## Telegram Install Using snap Command Line\n![](Images/image00513.jpeg)\n\
    \nOpen, Terminal.\n\nType In,\n```bash\nsudo snap install telegram-desktop\n```\n\
    Press, Enter.\n\n# Cryptocurrency Wallets\n\nCryptocurrency Wallets enable storage\
    \ of crypto on Linux Operating Systems and offer:\n\n*   Add-ons that raise features,\
    \ e.g. trackers, email and virtual keyboard\n*   Decentralized and redundant servers\
    \ to lower downtime\n*   Encryption and local storage of private keys which can\
    \ be exported\n\nThis chapter covers:\n\n*   Coin\n    *   Coin Install Using\
    \ Snap Store\n    *   Coin Install Using snap Command Line\n*   Exodus\n    *\
    \   Exodus Install Using Software Manager\n    *   Exodus Install Using flatpak\
    \ Command Line\n    *   Exodus Install Using .deb\n*   Guarda Wallet\n    *  \
    \ Guarda Install Using .deb\n*   Wasabi Wallet\n    *   Wasabi Wallet Install\
    \ Using Software Manager\n    *   Wasabi Wallet Install Using flatpak Command\
    \ Line\n    *   Wasabi Wallet Install Using .deb\n\n## Coin\n\n## Coin Install\
    \ Using Snap Store\n![](Images/image00514.jpeg)\n\nOpen, Snap Store.\n\nType In,\n\
    `coin`\n\nClick, Coin.\nClick, Install.\n\n## Coin Install Using snap Command\
    \ Line\n![](Images/image00515.jpeg)\n\nOpen, Terminal.\n\nType In,\n```bash\n\
    sudo snap install coin\n```\nPress, Enter.\n\n# Exodus\n\n## Exodus Install Using\
    \ Software Manager\n![](Images/image00516.jpeg)\n\nOpen, Software Manager.\n\n\
    Type In,\n`exodus`\n\nClick, Exodus.\nClick, Install.\n\n## Exodus Install Using\
    \ flatpak Command Line\n![](Images/image00517.jpeg)\n\nOpen, Terminal.\n\nType\
    \ In,\n```bash\nflatpak install flathub io.exodus.Exodus\n```\nPress, Enter.\n\
    \n## Exodus Install Using .deb\n![](Images/image00518.jpeg)\n\nGo to, `https://www.exodus.com/download/`\n\
    \nClick, Download Exodus.\nClick, Download Linux app (.deb) to Download `exodus-linux-x64-22.7.29.deb`.\n\
    \nGo to, Where `exodus-linux-x64-22.7.29.deb` is Downloaded.\n\nDouble Click,\
    \ `exodus-linux-x64-22.7.29.deb`.\nClick, Install.\n\n# Guarda Wallet\n\n## Guarda\
    \ Install Using .deb\n![](Images/image00519.jpeg)\n\nGo to, `https://guarda.com/desktop/`\n\
    \nClick, Download Guarda.\nClick, Download Linux (.deb) to Download `Guarda_1.0.20_amd64.deb`.\n\
    \nGo to, Where `Guarda_1.0.20_amd64.deb` is Downloaded.\n\nDouble Click, `Guarda_1.0.20_amd64.deb`.\n\
    Click, Install.\n\n# Wasabi Wallet\n\n## Wasabi Wallet Install Using Software\
    \ Manager\n![](Images/image00520.jpeg)\n\nOpen, Software Manager.\n\nType In,\n\
    `wasabi`\n\nClick, Wasabi Wallet.\nClick, Install.\n\n## Wasabi Wallet Install\
    \ Using flatpak Command Line\n![](Images/image00521.jpeg)\n\nOpen, Terminal.\n\
    \nType In,\n```bash\nflatpak install flathub io.wasabiwallet.WasabiWallet\n```\n\
    Press, Enter.\n\n## Wasabi Wallet Install Using .deb\n![](Images/image00522.jpeg)\n\
    \nGo to, `https://wasabiwallet.io/index.html#download`\n\nClick, Download under\
    \ UBUNTU / DEBIAN to Download `Wasabi-2.0.1.3.deb`.\n\nGo to, Where `Wasabi-2.0.1.3.deb`\
    \ is Downloaded.\n\nDouble Click, `Wasabi-2.0.1.3.deb`.\nClick, Install.\n\n#\
    \ Custom Kernels\n\nCustom kernels (for these purposes) are drop in replacements\
    \ for the Linux Mint 21 5.15 Kernel, that offer additional features such as:\n\
    \n*   The latest kernel from 5.18.15 and above or later\n*   Improvements to CPUFreq\
    \ Governor, cache\n\nThis chapter covers:\n\n*   Liquorix\n    *   Liquorix Install\
    \ Using apt Command Line\n*   Xanmod\n    *   Xanmod Install Using apt Command\
    \ Line\n\n## Liquorix Install Using apt Command Line\n![](Images/image00523.jpeg)\n\
    \nOpen, Terminal.\n\nType In,\n```bash\nsudo add-apt-repository ppa:liquorix/liquor\n\
    sudo apt update\nsudo apt install linux-liquorix-amd\n```\nPress, Enter.\n\n##\
    \ Xanmod Install Using apt Command Line\n![](Images/image00524.jpeg)\n\nOpen,\
    \ Terminal.\n\nType In,\n```bash\nsudo add-apt-repository ppa:xanmod/stable\n\
    sudo apt update\nsudo apt install linux-xanmod-amd64\n```\nPress, Enter.\n\n##\
    \ Xanmod Stable (Alternative Repository Method)\n![](Images/image00525.jpeg)\n\
