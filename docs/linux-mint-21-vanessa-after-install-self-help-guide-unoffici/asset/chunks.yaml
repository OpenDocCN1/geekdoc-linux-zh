    ![](Images/image00591.jpeg)

    1. Open, `Firewall Configuration`

    2. Click, `Rules`

    3. Click, `+`

    4. Click, `Simple`

    5. Click, Box in the same row as Name

    6. Type In, `HTTP`

    7. Click, Box in the same row as Direction

    8. Click, `In`

    9. Click, Box In the same row as Protocol

    10. Click, `TCP, UDP or Both`

    11. Click, Box in the same row as Port

    12. Type In, `80`

    13. Click, `Add`


    ## Firewall Configuration Add Multi Port Rule

    ![](Images/image00592.jpeg)

    1. Open, `Firewall Configuration`

    2. Click, `Rules`

    3. Click, `+`

    4. Click, `Simple`

    5. Click, Box in the same row as Name

    6. Type In, `Multi Port Rule 1`

    7. Click, Box in the same row as Direction

    8. Click, `In`

    9. Click, Box in the same row as Protocol

    10. Click, `TCP, UDP or Both`

    11. Click, Box in the same row as Port

    12. Type In, `80,443`

    13. Click, `Add`


    ## Firewall Configuration Add Range Port Rule

    ![](Images/image00593.jpeg)

    1. Open, `Firewall Configuration`

    2. Click, `Rules`

    3. Click, `+`

    4. Click, `Simple`

    5. Click, Box in the same row as Name

    6. Type In, `Range Port Rule 1`

    7. Click, Box in the same row as Direction

    8. Click, `In`

    9. Click, Box in the same row as Protocol

    10. Click, `TCP, UDP or Both`

    11. Click, Box in the same row as Port

    12. Type In, `1119:1120`

    13. Click, `Add`


    ## Firewall Configuration Add Rule From Report

    ![](Images/image00594.jpeg)

    1. Open, `Firewall Configuration`

    2. Click, `Report`

    3. Select, Row from report

    4. Click, `+`

    5. Click, `Add`


