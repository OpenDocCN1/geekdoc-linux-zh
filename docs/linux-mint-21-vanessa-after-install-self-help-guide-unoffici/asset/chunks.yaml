    \ apt install linux-image-amd64\n```\nPress, Enter.\n\n## Configuring Kernel Parameters\n\
    ![](Images/image00528.jpeg)\n\nOpen, Terminal.\n\nType In,\n```bash\necho 'net.core.default_qdisc\
    \ = fq' | sudo tee /etc/sysctl.d/90-override.conf\n```\nPress, Enter.\n\n# Data\
    \ Recovery\n\nData Recovery programs regain lost or damaged data from storage\
    \ device with:\n\n*   SMART (Self-Monitoring, Analysis and Reporting Technology)\
