    # Curseforge AppImage Usage


    - Select `Curseforge AppImage`

    - Extract to `~/Downloads`

    - Go to where `Curseforge AppImage` is extracted

    - Double click `Curseforge AppImage`

    - Click `Integrate and Run`


    ## Curseforge Manually Add Game


    ![](Images/image00901.jpeg)


    1. Open `Curseforge`

    2. Click the `3 Vertical dots Icon`

    3. Click `Manually add a game`

    4. Select `World of Warcraft/_retail_` or `_classic_` for `WOTLK Classic` or `_classic_era_`
    for `World of Warcraft Vanilla Classic`


    ## Curseforge Install Addon


    ![](Images/image00902.jpeg)


    1. Open `Curseforge`

    2. Click `Get More Addons`

    3. Click `Search Bar`

    4. Type in `comix`

    5. Click `Install`, in the same row as `Comix Reborn`


    ## Curseforge Update Addon


    ![](Images/image00903.jpeg)


    1. Open `Curseforge`

    2. Click `My Addons`

    3. Click `Update All`


    ## Curseforge Remove Addon


    ![](Images/image00904.jpeg)


    1. Open `Curseforge`

    2. Right Click `Comix`

    3. Click `Delete Addon`


