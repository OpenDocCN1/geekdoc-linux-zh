    \ | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/xanmod.gpg\nsudo apt update\n\
    sudo apt install linux-xanmod-amd64\n```\nPress, Enter.\n\n# Kernel Updates\n\n\
    ## Using Intel CPU\n![](Images/image00526.jpeg)\n\nOpen, Terminal.\n\nType In,\n\
    ```bash\nsudo apt install linux-image-intel\n```\nPress, Enter.\n\n## Using AMD\
