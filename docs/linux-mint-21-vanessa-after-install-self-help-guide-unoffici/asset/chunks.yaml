    \nType In,\n```bash\nsudo tasksel\n```\nPress, Enter.\n\nSelect, GNOME with UP\
    \ and DOWN arrows.\nPress, Space.\nSelect, OK with Tab.\nPress, Enter.\n\n# Download\
    \ Managers\n"
