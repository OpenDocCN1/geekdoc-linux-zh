    \ various operating systems\n*   Recover deleted files using many parameters\n\
    \nThis chapter covers:\n\n*   R-Linux\n    *   R-Linux Install Using .deb\n\n\
    ## R-Linux Install Using .deb\n![](Images/image00529.jpeg)\n\nGo to, `https://www.r-studio.com/free-linux/Download.shtml`\n\
    \nClick, Download Now, In the same row as R-Linux for Debian/Ubuntu platform (64-bit),\
    \ to Download, `R-Linux-x64-free.deb`.\n\nGo to, Where `R-Linux-x64-free.deb`\
    \ is Downloaded.\n\nDouble Click, `R-Linux-x64-free.deb`.\nClick, Install.\n\n\
    # Desktop Environments\n\nDesktop Environments are graphical user interfaces to\
    \ access program and offer:\n\n*   Drag and drop and additional features that\
    \ make DE’s familiar\n*   Folders, icons, windows, wallpapers, toolbars and widgets\n\
    *   Gnome, KDE Plasma, Cinnamon and LXDE rank among the most popular DE’\n\nThis\
