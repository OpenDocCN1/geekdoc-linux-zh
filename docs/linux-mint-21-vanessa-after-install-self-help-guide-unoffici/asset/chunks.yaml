    ![](img/image00803.jpeg)


    # 打开，磁盘

    - 选择 `Disk`（磁盘）

    - 选择 `Volume`（卷）

    - 点击 `Cog`（齿轮）或额外的分区选项图标

    - 点击 `Edit Mount Options`（编辑挂载选项）

    - 将 `User Session Defaults`（用户会话默认）同一行的 `Button`（按钮）向左移动

    - 点击 `OK`


    # 图形驱动


    ## 使用 apt 命令安装 AMD 显卡驱动

    AMD 显卡驱动预装于 Linux Mint 21 和 Linux 内核，并且经过了 Linux Mint 团队、Linux Mint 社区以及 Linux
    Mark 研究所满意的测试。


    然而，这些 AMD 驱动虽然最稳定，并不是最新的；下面的是最新的，但不一定是最稳定的。


    ![](img/image00804.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    sudo add-apt-repository ppa:oibaf/graphics-drivers

    ```

    3. 按 `Enter`


    ![](img/image00805.jpeg)


    1. 输入：

    ```bash

    sudo apt update && sudo apt upgrade

    ```

    2. 按 `Enter`


    ## 使用 ppa-purge 命令恢复默认 AMD 显卡驱动

    ![](img/image00806.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    sudo apt install ppa-purge

    ```

    3. 按 `Enter`


    ![](img/image00807.jpeg)


    1. 输入：

    ```bash

    sudo ppa-purge ppa:oibaf/graphics-drivers && sudo apt update && sudo apt upgrade

    ```

    3. 按 `Enter`


    ## 使用软件管理器安装 Nvidia 显卡驱动

    ![](img/image00808.jpeg)


    1. 打开 `Driver Manager`（驱动管理器）

    2. 点击 `Nvidia-515` 同行的 `Circle`（圆圈）

    3. 点击 `Apply Changes`（应用更改）


    ## 使用 apt 命令安装 Nvidia 显卡驱动

    ![](img/image00809.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    sudo apt install nvidia-driver-515

    ```

    3. 按 `Enter`


    # Mousepad


    ## 使用软件管理器安装 Mousepad

    ![](img/image00810.jpeg)


    1. 打开 `Software Manager`（软件管理器）

    2. 输入 `mousepad`

    3. 点击 `Mousepad`

    4. 点击 `Install`（安装）


    ## 使用 apt 命令安装 Mousepad

    ![](img/image00811.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    sudo apt install mousepad

    ```

    3. 按 `Enter`


    # 鼠标速度


    ## 将鼠标速度调最大

    ![](img/image00812.jpeg)


    1. 打开 `Mouse and Touchpad`（鼠标和触摸板）

    2. 将 `Custom Acceleration`（自定义加速）同一行的 `Switch`（开关）向右移动

    3. 将 `Speed`（速度）下的 `Button`（按钮）向右移动


    # 夜光

    ## 设置夜间模式（蓝光保护）

    1. 打开 `Redshift`

    2. 右键点击任务栏上的 `Redshift Icon`（Redshift 图标）

    3. 勾选 `Autostart`（自动启动）同一行的 `Box`（框）


    # 可能的 Intel 音频杂声修复

    ## 使用 echo 命令修复可能的 Intel 音频杂声

    ![](img/image00813.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    echo "options snd_hda_intel power_save=0" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf

    ```

    3. 按 `Enter`


    # 清除 PPA

    ## 使用软件源清除 PPA

    ![](img/image00814.jpeg)


    1. 打开 `Software Sources`（软件源）

    2. 点击 `PPA’s`

    3. 选择 `Oibaf`

    4. 点击 `Remove`（移除）

    5. 点击 `OK`


    ## PPA 清除安装

    ![](img/image00806.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    sudo apt install ppa-purge

    ```

    3. 按 `Enter`


    ## 使用 ppa-purge 命令清除 PPA

    ![](img/image00807.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    sudo ppa-purge ppa:oibaf/graphics-drivers && sudo apt update && sudo apt upgrade

    ```

    3. 按 `Enter`


    # 设置默认应用

    ## 为分类设置默认应用

    ![](img/image00815.jpeg)


    1. 打开 `Preferred Applications`（首选应用程序）

    2. 点击 `Video`（视频）同一行的 `Box`（框）

    3. 点击 `VLC`


    ## 按文件扩展名设置默认应用

    ![](img/image00816.jpeg)


    1. 右键 `Winter Veil Christmas Music - World of Warcraft Music.webm`

    2. 点击 `Properties`（属性）

    3. 点击 `Open With`（打开方式）

    4. 选择 `VLC`

    5. 点击 `Set as Default`（设为默认）


    # 启动应用程序


    ## 使用已安装的应用设置启动项

    ![](img/image00817.jpeg)


    1. 打开 `Startup Applications`（启动应用程序）

    2. 点击 `+`

    3. 点击 `Choose application`（选择应用）

    4. 输入 `discord`

    5. 选择 `Discord`

    6. 点击 `Add Application`（添加应用）


    ## 使用自定义命令设置启动项

    ![](img/image00818.jpeg)


    1. 打开 `Startup Applications`（启动应用程序）

    2. 点击 `+`

    3. 点击 `Custom command`（自定义命令）

    4. 点击 `Name`（名称）同一行的 `Box`（框）

    5. 输入 `Discord`

    6. 点击 `Command`（命令）同一行的 `Box`（框）

    7. 输入 `discord`

    8. 点击 `Add`（添加）


    # 卸载应用程序


    ## 使用软件管理器卸载应用

    ![](img/image00819.jpeg)


    1. 打开 `Software Manager`（软件管理器）

    2. 输入 `gimp`

    3. 选择 `Gimp` 或 `Gnu Image Manipulation Program`

    4. 点击 `Remove`（移除）


    ## 使用 apt 命令卸载应用

    ![](img/image00820.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    sudo apt remove parole

    ```

    3. 按 `Enter`


    ## 使用 Snap Store 卸载已安装应用

    ![](img/image00821.jpeg)


    1. 打开 `Snap Store`

    2. 点击 `Installed`（已安装）

    3. 点击 `litteris` 同行的 `Uninstall`（卸载）


    ## 使用 snap 命令卸载应用

    ![](img/image00822.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    sudo snap remove coin

    ```

    3. 按 `Enter`


    ## 使用 deb-get 命令卸载应用

    ![](img/image00823.jpeg)


    1. 打开 `Terminal`（终端）

    2. 输入：

    ```bash

    sudo deb-get remove obs-studio

    ```

    3. 按 `Enter`


