    ![](Images/image00803.jpeg)


    # Open, Disks

    - Select `Disk`

    - Select `Volume`

    - Click `Cog` or Additional partition options icon

    - Click `Edit Mount Options`

    - Move `Button` in the same row as `User Session Defaults`, to the left

    - Click `OK`


    # Graphics Drivers


    ## AMD Graphics Drivers Install Using apt Command Line

    AMD Graphics Drivers are pre-installed with Linux Mint 21 and the Linux Kernel,
    in addition to being tested to reasonable satisfaction by the Linux Mint Team
    , The Linux Mint Community and the Linux Mark Institute.


    However these AMD Drivers, while being the most stable, are not the most up to
    date, and the ones below are the most up to date, but not, neccesarily, the most
    stable.


    ![](Images/image00804.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo add-apt-repository ppa:oibaf/graphics-drivers

    ```

    3. Press `Enter`


    ![](Images/image00805.jpeg)


    1. Type In:

    ```bash

    sudo apt update && sudo apt upgrade

    ```

    2. Press `Enter`


    ## AMD Graphics Driver Default Using ppa-purge Command Line

    ![](Images/image00806.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo apt install ppa-purge

    ```

    3. Press `Enter`


    ![](Images/image00807.jpeg)


    1. Type In:

    ```bash

    sudo ppa-purge ppa:oibaf/graphics-drivers && sudo apt update && sudo apt upgrade

    ```

    2. Press `Enter`


    ## Nvidia Graphics Driver Install Using Software Manager

    ![](Images/image00808.jpeg)


    1. Open `Driver Manager`

    2. Click `Circle` in the same row as `Nvidia-515`

    3. Click `Apply Changes`


    ## Nvidia Graphics Driver Install Using apt Command Line

    ![](Images/image00809.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo apt install nvidia-driver-515

    ```

    3. Press `Enter`


    # Mousepad


    ## Mousepad Install Using Software Manager

    ![](Images/image00810.jpeg)


    1. Open `Software Manager`

    2. Type In: `mousepad`

    3. Click `Mousepad`

    4. Click `Install`


    ## Mousepad Install Using apt Command Line

    ![](Images/image00811.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo apt install mousepad

    ```

    3. Press `Enter`


    # Mouse Speed


    ## Setting Mouse Speed to Max

    ![](Images/image00812.jpeg)


    1. Open `Mouse and Touchpad`

    2. Move `Switch` in the same row as `Custom Acceleration` to the Right

    3. Move `Button` under `Speed` to the Right


    # Night Light

    ## Setting Up Night Light (Blue Light Protection)

    1. Open `Redshift`

    2. Right Click `Redshift Icon` on the taskbar

    3. Tick `Box` in the same row as `Autostart`


    # Possible Intel Sound Crackle Fix

    ## Possible Intel Sound Crackle Fix Using echo Command Line

    ![](Images/image00813.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    echo "options snd_hda_intel power_save=0" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf

    ```

    3. Press `Enter`


    # Purge PPA’s

    ## Purge PPA’s Using Software Sources

    ![](Images/image00814.jpeg)


    1. Open `Software Sources`

    2. Click `PPA’s`

    3. Select `Oibaf`

    4. Click `Remove`

    5. Click `OK`


    ## PPA Purge Install

    ![](Images/image00806.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo apt install ppa-purge

    ```

    3. Press `Enter`


    ## Purge PPA’s Using ppa-purge Command Line

    ![](Images/image00807.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo ppa-purge ppa:oibaf/graphics-drivers && sudo apt update && sudo apt upgrade

    ```

    3. Press `Enter`


    # Set Default Application

    ## Set Default Application for Category

    ![](Images/image00815.jpeg)


    1. Open `Preferred Applications`

    2. Click `Box` In the same row as `Video`

    3. Click `VLC`


    ## Set Default Application Per File Extension

    ![](Images/image00816.jpeg)


    1. Right Click `Winter Veil Christmas Music - World of Warcraft Music.webm`

    2. Click `Properties`

    3. Click `Open With`

    4. Select `VLC`

    5. Click `Set as Default`


    # Startup Applications


    ## Startup Applications Using Installed Applications

    ![](Images/image00817.jpeg)


    1. Open `Startup Applications`

    2. Click `+`

    3. Click `Choose application`

    4. Type In: `discord`

    5. Select `Discord`

    6. Click `Add Application`


    ## Startup Applications Using Custom Commands

    ![](Images/image00818.jpeg)


    1. Open `Startup Applications`

    2. Click `+`

    3. Click `Custom command`

    4. Click `Box` in the same row as `Name`

    5. Type In: `Discord`

    6. Click `Box` in in the same row as `Command`

    7. Type In: `discord`

    8. Click `Add`


    # Uninstalling Applications


    ## Uninstall Software Manager Applications

    ![](Images/image00819.jpeg)


    1. Open `Software Manager`

    2. Type In: `gimp`

    3. Select `Gimp` or `Gnu Image Manipulation Program`

    4. Click `Remove`


    ## Uninstall apt Command Line Applications

    ![](Images/image00820.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo apt remove parole

    ```

    3. Press `Enter`


    ## Uninstall Snap Store Installed Applications

    ![](Images/image00821.jpeg)


    1. Open `Snap Store`

    2. Click `Installed`

    3. Click `Uninstall` in the same row as `litteris`


    ## Uninstall snap Command Line Applications

    ![](Images/image00822.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo snap remove coin

    ```

    3. Press `Enter`


    ## Uninstalling deb-get Command Line Applications

    ![](Images/image00823.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo deb-get remove obs-studio

    ```

    3. Press `Enter`


    # Updating Linux Mint 21

    ## Updating Linux Mint 21

    ![](Images/image00824.jpeg)


    1. Open `Terminal`

    2. Type In:

    ```bash

    sudo apt update && sudo apt upgrade

    ```

    3. Press `Enter`

