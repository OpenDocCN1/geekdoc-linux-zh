    ![](img/image00780.jpeg)


    # OBS Studio 安装方法


    1. 打开 `Terminal`（终端）。

    2. 输入：

    ```bash

    flatpak install flathub com.obsproject.Studio

    ```

    3. 按 `Enter`（回车）。


    ## 使用 Snap Store 安装 OBS Studio


    ![](img/image00781.jpeg)


    1. 打开 `Snap Store`（商店）。

    2. 输入：`obs studio`。

    3. 点击 `OBS Studio`。

    4. 点击 `Install`（安装）。


    ## 使用 snap 命令行安装 OBS Studio


    ![](img/image00782.jpeg)


    1. 打开 `Terminal`（终端）。

    2. 输入：

    ```bash

    sudo snap install obs-studio

    ```

    3. 按 `Enter`（回车）。


    ## 使用 deb-get 命令行安装 OBS Studio


    ![](img/image00783.jpeg)


    1. 打开 `Terminal`（终端）。

    2. 输入：

    ```bash

    sudo deb-get install obs-studio

    ```

    3. 按 `Enter`（回车）。


    # Owncast


    ## 使用 curl 命令行安装 Owncast


    ![](img/image00784.jpeg)


    1. 打开 `Terminal`（终端）。

    2. 输入：

    ```bash

    curl -s https://owncast.online/install.sh | bash

    ```

    3. 按 `Enter`（回车）。


    # 系统清理工具


