    # UFW


    ## 使用 apt 命令行安装 UFW

    ![](img/image00582.jpeg)


    1. 打开，`Terminal`（终端）

    2. 输入，`sudo apt install ufw`

    3. 按，`Enter`（回车）


    ## 启用 UFW

    ![](img/image00583.jpeg)


    1. 打开，`Terminal`（终端）

    2. 输入，`sudo ufw enable`

    3. 按，`Enter`（回车）


    ## UFW 添加单端口规则

    ![](img/image00584.jpeg)


    1. 打开，`Terminal`（终端）

    2. 输入，`sudo ufw allow 80/tcp` 或 `sudo ufw allow 80/udp`

    3. 按，`Enter`（回车）


    ## UFW 添加多端口规则

    ![](img/image00585.jpeg)


    1. 打开，`Terminal`（终端）

    2. 输入，`sudo ufw allow 80,443/tcp` 或 `sudo ufw allow 80,443/udp`

    3. 按，`Enter`（回车）


    ## UFW 添加范围端口规则

    ![](img/image00586.jpeg)


    1. 打开，`Terminal`（终端）

    2. 输入，`sudo ufw allow 1119:1120/tcp` 或 `sudo ufw allow 1119:1120/udp`

    3. 按，`Enter`（回车）


    ## UFW 删除端口规则

    ![](img/image00587.jpeg)


    1. 打开，`Terminal`（终端）

    2. 输入，`sudo ufw status numbered`

    3. 按，`Enter`（回车）

    ![](img/image00588.jpeg)

    4. 选择要删除的规则并记住规则编号

    5. 输入，`sudo ufw delete 224`

    6. 按，`Enter`（回车）


    # 防火墙配置


    ## 使用软件管理器安装防火墙配置

    ![](img/image00589.jpeg)


    1. 打开，`Software Manager`（软件管理器）

    2. 输入，`gufw`

    3. 点击，`Firewall Configuration`（防火墙配置）

    4. 点击，`Install`（安装）


    ## 使用 apt 命令行安装防火墙配置

    ![](img/image00590.jpeg)


    1. 打开，`Terminal`（终端）

    2. 输入，`sudo apt install gufw`

    3. 按，`Enter`（回车）


    ## 防火墙配置添加单端口规则

    ![](img/image00591.jpeg)


    1. 打开，`Firewall Configuration`（防火墙配置）

    2. 点击，`Rules`（规则）

    3. 点击，`+`

    4. 点击，`Simple`（简单）

    5. 在名称行中点击

    6. 输入，`HTTP`

    7. 在方向行中点击

    8. 点击，`In`（入站）

    9. 在协议行中点击

    10. 点击，`TCP/ UDP`

    11. 在端口行中点击

    12. 输入，`80`

    13. 点击，`Add`（添加）


    ## 防火墙配置添加多端口规则

    ![](img/image00592.jpeg)


    1. 打开，`Firewall Configuration`（防火墙配置）

    2. 点击，`Rules`（规则）

    3. 点击，`+`

    4. 点击，`Simple`（简单）

    5. 在名称行中点击

    6. 输入，`Multi Port Rule 1`

    7. 在方向行中点击

    8. 点击，`In`（入站）

    9. 在协议行中点击

    10. 点击，`TCP/ UDP`

    11. 在端口行中点击

    12. 输入，`80,443`

    13. 点击，`Add`（添加）


    ## 防火墙配置添加范围端口规则

    ![](img/image00593.jpeg)


    1. 打开，`Firewall Configuration`（防火墙配置）

    2. 点击，`Rules`（规则）

    3. 点击，`+`

    4. 点击，`Simple`（简单）

    5. 在名称行中点击

    6. 输入，`Range Port Rule 1`

    7. 在方向行中点击

    8. 点击，`In`（入站）

    9. 在协议行中点击

    10. 点击，`TCP/ UDP`

    11. 在端口行中点击

    12. 输入，`1119:1120`

    13. 点击，`Add`（添加）


    ## 防火墙配置从报告添加规则

    ![](img/image00594.jpeg)


    1. 打开，`Firewall Configuration`（防火墙配置）

    2. 点击，`Report`（报告）

    3. 选择报告行

    4. 点击，`+`

    5. 点击，`Add`（添加）


    ## 防火墙配置删除端口规则

    ![](img/image00595.jpeg)


    1. 打开，`Firewall Configuration`（防火墙配置）

    2. 点击，`Rules`（规则）

    3. 选择，`224`

    4. 点击，`-`


