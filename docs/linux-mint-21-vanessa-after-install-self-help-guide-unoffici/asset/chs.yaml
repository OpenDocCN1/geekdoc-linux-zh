  \ `Button`（按钮）向左移动\n- 点击 `OK`\n\n# 图形驱动\n\n## 使用 apt 命令安装 AMD 显卡驱动\nAMD 显卡驱动预装于\
  \ Linux Mint 21 和 Linux 内核，并且经过了 Linux Mint 团队、Linux Mint 社区以及 Linux Mark 研究所满意的测试。\n\
  \n然而，这些 AMD 驱动虽然最稳定，并不是最新的；下面的是最新的，但不一定是最稳定的。\n\n![](img/image00804.jpeg)\n\n1.\
  \ 打开 `Terminal`（终端）\n2. 输入：\n```bash\nsudo add-apt-repository ppa:oibaf/graphics-drivers\n\
  ```\n3. 按 `Enter`\n\n![](img/image00805.jpeg)\n\n1. 输入：\n```bash\nsudo apt update\
  \ && sudo apt upgrade\n```\n2. 按 `Enter`\n\n## 使用 ppa-purge 命令恢复默认 AMD 显卡驱动\n![](img/image00806.jpeg)\n\
  \n1. 打开 `Terminal`（终端）\n2. 输入：\n```bash\nsudo apt install ppa-purge\n```\n3. 按 `Enter`\n\
  \n![](img/image00807.jpeg)\n\n1. 输入：\n```bash\nsudo ppa-purge ppa:oibaf/graphics-drivers\
  \ && sudo apt update && sudo apt upgrade\n```\n3. 按 `Enter`\n\n## 使用软件管理器安装 Nvidia\
  \ 显卡驱动\n![](img/image00808.jpeg)\n\n1. 打开 `Driver Manager`（驱动管理器）\n2. 点击 `Nvidia-515`\
  \ 同行的 `Circle`（圆圈）\n3. 点击 `Apply Changes`（应用更改）\n\n## 使用 apt 命令安装 Nvidia 显卡驱动\n\
  ![](img/image00809.jpeg)\n\n1. 打开 `Terminal`（终端）\n2. 输入：\n```bash\nsudo apt install\
  \ nvidia-driver-515\n```\n3. 按 `Enter`\n\n# Mousepad\n\n## 使用软件管理器安装 Mousepad\n\
  ![](img/image00810.jpeg)\n\n1. 打开 `Software Manager`（软件管理器）\n2. 输入 `mousepad`\n\
  3. 点击 `Mousepad`\n4. 点击 `Install`（安装）\n\n## 使用 apt 命令安装 Mousepad\n![](img/image00811.jpeg)\n\
  \n1. 打开 `Terminal`（终端）\n2. 输入：\n```bash\nsudo apt install mousepad\n```\n3. 按 `Enter`\n\
  \n# 鼠标速度\n\n## 将鼠标速度调最大\n![](img/image00812.jpeg)\n\n1. 打开 `Mouse and Touchpad`（鼠标和触摸板）\n\
  2. 将 `Custom Acceleration`（自定义加速）同一行的 `Switch`（开关）向右移动\n3. 将 `Speed`（速度）下的 `Button`（按钮）向右移动\n\
  \n# 夜光\n## 设置夜间模式（蓝光保护）\n1. 打开 `Redshift`\n2. 右键点击任务栏上的 `Redshift Icon`（Redshift\
  \ 图标）\n3. 勾选 `Autostart`（自动启动）同一行的 `Box`（框）\n\n# 可能的 Intel 音频杂声修复\n## 使用 echo 命令修复可能的\
