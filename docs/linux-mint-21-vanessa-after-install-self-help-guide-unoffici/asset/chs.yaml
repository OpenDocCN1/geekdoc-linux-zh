- "# Linux Mint 21 Vanessa 安装后自助指南：非官方且兼容 Linux Mint 21 版本\n\n\n\n![](img/cover00905.jpeg)\n\
  \n![](img/image00459.jpeg)\n\n\n# 致谢\n\n感谢我的家人，没有他们，这一切都不可能。\n\nLinus Torvalds 是\
  \ `Linux` 的创建者和 `Linux` 商标的持有者，特此感谢，且他并不支持或赞助本自我帮助学习读书。\n\n`Linux®` 是 Linus Torvalds\
  \ 在美国及其他国家的注册商标。\n\n感谢 Linux Mark Institute 和社区，开发并维护了 Linux Mint 21 ‘Vanessa’。\n\
  \n感谢 Blizzard 开发并发布了我真正热爱并享受的《世界兽兽》。\n\n感谢 `WINE` 或 `Wine Is Not An Emulator` 提供的兼容层。\n\
  \n感谢 Lutris 让安装和运行游戏及软件变得更加方便。\n\n感谢 Gabe Newell 和 Valve 开发并发布了 Steam Store。\n\n\
  # 安装机器详情\n\n本自我帮助学习指南的所有细节均在裸机或直接在硬件上完成，而非在虚拟机上。\n\nLinux Mint 21 ‘Vanessa’ 的安装在一个手动分区的驱动器上完成，配置如下：\n\
  \n- 1 GB EFI 分区\n- 92 GB `/` 或根分区\n- 35 GB 交换分区\n\n用于安装 Linux Mint 21 ‘Vanessa’\
  \ 的电脑规格如下：\n\n- CPU: Intel(R)Core(TM) i3-9100F CPU\n- RAM 或内存: 16GB DDR4\n- 主板:\
  \ MSI B365M PRO-VH REV 1.0\n- GPU 或显卡: 技嘉 Nvidia 3060 GTX 12GB\n- 显示器: 21 英寸 Acer\
  \ 显示器\n- SSD: 1618 GB 跨三星（Samsung）、PNY 和 SPCC 硬盘\n- HDD 内部: 9TB 跨两块西部数据（Western\
  \ Digital）硬盘\n- HDD 外部: 1TB JMicron\n- 声卡: USB 3.0 外部 Phoinkas 声卡\n- 扬器: Amazon\
  \ Basics 2.0 扬器\n- 耳机: 通用 2.0 耳机\n- 耳机: Kingston HyperX Cloud Alpha 3.5 MM\n- 键盘\
  \ 1 & 2: USB 2.0 通用小型游戏键盘，USB 2.0 基础全尺寸键盘\n- 鼠标: USB 2.0 Trust 无线鼠标 X200，USB 2.0\
  \ 基础有线鼠标\n- 网络: Realtek 主板千兆 PCI 端口，USB 3.0 Realtek 千兆适配器\n- 手机: 三星智能手机\n- USB 集线器:\
  \ USB 3.0 外部 Phoinkas 声卡\n- 打印机: Epson 网络打印机\n\n# 引言\n\n本指南旨在 Linux Mint 21 ‘Vanessa’\
  \ 的安装后自我帮助指南。\n\n为了提高您的安全性，您需要 `ENTER` 密码以完成此列表中的大多数步骤，因此请确保手头有密码。\n\n在输入所有 `sudo`\
  \ 命令和您的密码后，您可能需要按 `ENTER` 继续确认或按 `ESC` 取消。\n\n请确保每天、隔几天或根据您的需要更新并升级 Linux Mint 21\
  \ ‘Vanessa’，以确保安全稳定。\n\n切勿使用 `sudo apt auto remove`，因为它可能会导致 Linux Mint 21 ‘Vanessa’\
  \ 不稳定或损坏。\n\n你应该输入所示内容以帮助记忆，但如果您愿意，也可以复制粘贴。\n\n在下载 `.deb`、`.jar`、`.tar.gz`、`.tar.xz`、`.AppImage`\
  \ 等文件时，请确保点击 `Keep` 或 `Save File`。\n\n![](img/image00619.jpeg)\n\n打开，终端\n\n输入，\n\
  \n```bash\nsudo snap install sweet-home-3d\n```\n\n按下，回车。\n\n## 图片编辑器\n\n图像编辑器允许对图片进行创建和编辑，例如：\n\
