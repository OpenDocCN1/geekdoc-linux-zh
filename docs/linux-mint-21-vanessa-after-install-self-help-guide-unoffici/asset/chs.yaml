  \ 命令行安装 Pale Moon\n\n# Firefox\n### 使用软件管理器安装 Firefox\nImages/image00862.jpeg)\n\
  \n打开，软件管理器\n\n输入，\n\n`firefox`\n\n点击，`Firefox`\n\n点击，`Install`\n\n### 使用 apt 命令行安装\
  \ Firefox\nImages/image00863.jpeg)\n\n打开，终端\n\n输入，\n\n`sudo apt install firefox`\n\
  \n按下，`Enter`\n\n### 使用 flatpak 命令行安装 Firefox\nImages/image00864.jpeg)\n\n打开，终端\n\
  \n输入，\n\n`flatpak install flathub org.mozilla.firefox`\n\n\n\n\n\n# 按回 Enter 键\n\
  \n## Firefox\n\n### 使用 Snap Store 安装 Firefox\n![](img/image00865.jpeg)\n\n打开 `Snap\
  \ Store`。\n\n输入，\n```bash\nfirefox\n```\n\n点击 `Firefox`。\n\n点击，`Install`。\n\n###\
  \ 使用 snap 命令行安装 Firefox\n![](img/image00866.jpeg)\n\n打开 `Terminal`。\n\n输入，\n```bash\n\
  sudo snap install firefox\n```\n\n按下 `Enter`。\n\n## Firefox ESR\n\n### 使用 .tar.gz\
  \ 安装 Firefox ESR\n![](img/image00867.jpeg)\n\n访问，`https://www.mozilla.org/en-GB/firefox/all/#product-desktop-esr`。\n\
  \n选择，`Firefox Extended Support Release`、`91.12.0esr`、`Linux 64-bit`、`English`。\n\
  \n点击 `Download now` 下载 `firefox-91.12.0esr.tar.bz2`。\n\n前往 `firefox-91.12.0esr.tar.bz2`\
  \ 的下载路径。\n\n双击 `firefox-91.12.0esr.tar.bz2`。\n\n解压到 `~/Applications`。\n\n前往 `firefox`\
  \ 的解压目录。\n\n双击 `Firefox`。\n\n双击 `Firefox`。\n\n## Chromium\n\n### 使用 Snap Store 安装\
  \ Chromium\n![](img/image00868.jpeg)\n\n打开 `Snap Store`。\n\n输入，\n```bash\nchromium\n\
  ```\n\n点击 `chromium`。\n\n点击 `Install`。\n\n### 使用 snap 命令行安装 Chromium\n![](img/image00869.jpeg)\n\
  \n打开 `Terminal`。\n\n输入，\n```bash\nsudo snap install chromium\n```\n\n按下 `Enter`。\n\
  \n## Google Chrome\n\n### 使用 apt 命令行安装 Google Chrome\n![](img/image00870.jpeg)\n\
  \n打开 `Terminal`。\n\n输入，\n```bash\nwget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub\
  \ | sudo apt-key add -\n```\n\n按下 `Enter`。\n\n![](img/image00871.jpeg)\n\n输入，\n\
  ```bash\nsudo sh -c 'echo \"deb [arch=amd64] http://dl.google.com/linux/chrome/deb/\
  \ stable main\" >> /etc/apt/sources.list.d/google.list'\n```\n\n按下 `Enter`。\n\n\
  ![](img/image00872.jpeg)\n\n输入，\n```bash\nsudo apt update && sudo apt install google-chrome-stable\n\
  ```\n\n按下 `Enter`。\n\n### 使用 .deb 安装 Google Chrome\n![](img/image00873.jpeg)\n\n\
  访问，`https://www.google.com/intl/en_uk/chrome/`\n\n点击 `Download Chrome`。\n\n点击与 `64\
  \ bit .deb` 同一行的圆点（适用于 Debian/Ubuntu）。\n\n点击 `Accept and install` 下载 `google-chrome-stable_current_amd64.deb`。\n\
  \n前往 `google-chrome-stable_current_amd64.deb` 的下载路径。\n\n双击 `google-chrome-stable_current_amd64.deb`。\n\
  \n点击 `Install`。\n\n## Microsoft Edge\n\n### 使用 apt 命令行安装 Microsoft Edge\n![](img/image00874.jpeg)\n\
