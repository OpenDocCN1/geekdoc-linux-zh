  \n* 更改主机资源\n* 允许访问虚拟机\n* 增加功能的扩展包\n\n本章涵盖：\n\n## Virt-manager\n* 使用 apt 命令行安装 Virt-manager\n\
  \n## Virtualbox\n* 使用软件管理器安装 Virtualbox\n* 使用 apt 命令行安装 Virtualbox\n\n### 使用 apt\
  \ 命令行安装 Virt-manager\nImages/image00858.jpeg)\n\n打开，终端\n\n输入，\n\n`sudo apt install\
  \ qemu-kvm libvirt-clients libvirt-daemon bridge-utils`\n\nImages/image00859.jpeg)\n\
  \n输入，\n\n`systemctl enable --now libvirtd`\n\n按下，`Enter`\n\n### 使用软件管理器安装 Virtualbox\n\
  Images/image00860.jpeg)\n\n打开，软件管理器\n\n输入，\n\n`virtualbox`\n\n点击，`Virtualbox`\n\n\
  点击，`Install`\n\n### 使用 apt 命令行安装 Virtualbox\nImages/image00861.jpeg)\n\n打开，终端\n\n\
  输入，\n\n`sudo apt install virtualbox && sudo apt install virtualbox-guest-additions-iso\
  \ && sudo apt install virtualbox-ext-pack`\n\n按下，`Enter`\n\n# 浏览器\n\n网络浏览器允许用户冲浪或浏览互联网，并带有各种功能：\n\
  \n* 用于增加功能的扩展\n* 让用户管理文件的内置下载器 much* 跨设备同步扩展和设置\n\n本章涵盖：\n\n## Firefox\n* 使用软件管理器安装\
