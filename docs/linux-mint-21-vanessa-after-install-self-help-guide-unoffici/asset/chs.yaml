  \n前往 `microsoft-edge-stable_103.0.1264.77-1_amd64.deb` 的下载路径。\n\n双击 `microsoft-edge-stable_103.0.1264.77-1_amd64.deb`。\n\
  \n点击 `Install`。\n\n## Opera\n\n### 使用 Snap Store 安装 Opera\n![](img/image00877.jpeg)\n\
