    # Description


    Returns a ptr to the cache on success, NULL on failure. Cannot be called within
    an int, but can be interrupted. The ctor is run when new pages are allocated by
    the cache and the dtor is run before the pages are handed back. The flags are


    +   SLAB_POISON - Poison the slab with a known test pattern (a5a5a5a5) to catch
    references to uninitialised memory.


    +   SLAB_RED_ZONE - Insert ''Red'' zones around the allocated memory to check
    for buffer overruns.


    +   SLAB_NO_REAP - Don''t reap this cache when we''re under memory pressure.


    +   SLAB_HWCACHE_ALIGN - Align the objects in this cache to a hardware cacheline.
