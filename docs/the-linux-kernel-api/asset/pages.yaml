- img_proc: true
  md: '# # Chapter 1. Driver Basics


    # ## 1.1. Driver Entry and Exit points


    # ### module_init


    Name


    module_init — driver initialization entry point


    # ### Synopsis


    ```

    module_init ( x );

    ```


    # ### Arguments


    x


    function to be run at kernel boot time or module insertion


    # ### Description


    module_init will add the driver initialization routine in the “__initcall.int”
    segment if the driver is checked as “y” or static, or else it will wrap the driver
    initialization routine with init_module which is used by insmod and modprobe when
    the driver is used as a module.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# module_exit


    # Name


    module_exit — driver exit entry point


    # Synopsis


    ```

    module_exit ( x );

    ```


    # Arguments


    x

    function to be run when driver is removed


    # Description


    module_exit will wrap the driver clean-up code with cleanup_module when used with
    rmod when the driver is a module. If the driver is statically compiled into the
    kernel, module_exit has no effect.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Chapter 1. Driver Basics


    # # 1.2. Atomic and pointer manipulation


    # ## atomic_read


    # ### Name


    atomic_read — read atomic variable


    # ### Synopsis


    ```

    atomic_read ( v );

    ```


    # ### Arguments


    v


    pointer of type atomic_t


    # ### Description


    Atomically reads the value of v. Note that the guaranteed useful range of an atomic_t
    is only 24 bits.


    3'
  merge: -1
  pgno: 16
- img_proc: true
  md: "# atomic_set\n\n# Name\n\natomic_set — set atomic variable\n\n# Synopsis\n\n\
    ```\natomic_set ( v, i);\n```\n\n# Arguments\n\n+   * v\n  pointer of type atomic_t\n\
    \n+   * i\n  required value\n\n# Description\n\nAtomically sets the value of v\
    \ to i. Note that the guaranteed useful range of atomic_t is only 24 bits."
  merge: -1
  pgno: 17
- img_proc: true
  md: "# atomic_add\n\n# Name\n\natomic_add — add integer to atomic variable\n\n#\
    \ Synopsis\n\n```\nvoid atomic_add (int i, atomic_t * v);\n```\n\n# Arguments\n\
    \n+   * i\n  integer value to add\n* v\n  pointer of type atomic_t\n\n# Description\n\
    \nAtomically adds i to v. Note that the guaranteed useful range of an atomic_t\
    \ is only 24 bits."
  merge: -1
  pgno: 18
- img_proc: true
  md: "# atomic_sub\n\n# Name\n\natomic_sub — subtract the atomic variable\n\n# Synopsis\n\
