- md: "\n# Description\n\nSearch the MCA configuration for adapters matching the 16bit\
    \ ID given. The first time it should be called with start as zero and then further\
    \ calls made passing the return value of the previous call until MCA_NOTFOUND\
    \ is returned.\n\nDisabled adapters are not reported.\n\n## mca_find_unused_adapter\n\
    \n# Name\n\nmca_find_unused_adapter — scan for unused adapters\n\n# Synopsis\n\
    \n```\nint mca_find_unused_adapter(int id, int start);\n```\n\n# Arguments\n\n\
    - id\n  MCA identification to search for\n\n- start\n  starting slot\n\n# Description\n\
    \nSearch the MCA configuration for adapters matching the 16bit ID given. The first\
    \ time it should be called with start as zero and then further calls made passing\
    \ the return value of the previous call until MCA_NOTFOUND is returned.\n\nAdapters\
    \ that have been claimed by drivers and those that are disabled are not reported.\
    \ This function thus allows a driver to scan for further cards when some may already\
    \ be driven.\n\n## mca_read_stored_pos\n\n# Name\n\nmca_read_stored_pos — read\
    \ POS register from boot data\n\n# Synopsis\n\n```\nunsigned char mca_read_stored_pos\
    \ (int slot, int reg);\n```\n\n# Arguments\n\n- slot\n  slot number to read from\n\
    \n- reg\n  register to read from\n\n# Description\n\nFetch a POS value that was\
    \ stored at boot time by the kernel when it scanned the MCA space. The register\
    \ value is returned. Missing or invalid registers report 0.\n\n## mca_read_pos\n\
    \n# Name\n\nmca_read_pos — read POS register from card\n\n# Synopsis\n\n```\n\
    unsigned char mca_read_pos (int slot, int reg);\n```\n\n# Arguments\n\n- slot\n\
    \  slot number to read from\n\n- reg\n  register to read from\n\n# Description\n\
    \nFetch a POS value directly from the hardware to obtain the current value. This\
    \ is much slower than mca_read_stored_pos and may not be invoked from interrupt\
    \ context. It handles the deep magic required for onboard devices transparently.\n\
    \n## mca_write_pos\n\n# Name\n\nmca_write_pos — read POS register from card\n\n\
    # Synopsis\n\n```\nvoid mca_write_pos (int slot, int reg, unsigned char byte);\n\
    ```\n\n# Arguments\n\n- slot\n  slot number to read from\n\n- reg\n  register\
    \ to read from\n\n- byte\n  byte to write to the POS registers\n\n# Description\n\
    \nStore a POS value directly from the hardware. You should not normally to use\
    \ this function and should have a very good knowledge of MCA bus before you do\
    \ so. Doing this wrongly can damage the hardware.\n\nThis function may not be\
    \ used from interrupt context.\n\nNote that this is technically a Bad Thing, IBM\
    \ tech stuff says you should only set POS values through their utilities. However,\
    \ some devices as the 3c523 recommend that you write back some data to make sure\
    \ the configuration is consistent.\nI'd say that IBM is right, but I like my drivers\
    \ to work.\n\nThis function can't do checks to see if multiple devices end up\
    \ with the same resources, so you might see magic smoke if someone screws up.\n\
    \n## mca_set_adapter_name\n\n# Name\n\nmca_set_adapter_name — Set the description\
    \ of the card\n\n# Synopsis\n\n```\nvoid mca_set_adapter_name (int slot, char*\
    \ name);\n```\n\n# Arguments\n\n- slot\n  slot to name\n\n- name\n  text string\
    \ for the name\n\n# Description\n\nThis function sets the name reported via /proc\
    \ for this adapter slot. This is for user information only. Setting a name deletes\
    \ any previous name.\n\n## mca_set_adapter_procfn\n\n# Name\n\nmca_set_adapter_procfn\
    \ — Set the /proc callback\n\n# Synopsis\n\n```\nvoid mca_set_adapter_procfn (int\
    \ slot, MCA_ProcFn procfn, void* dev);\n```\n\n# Arguments\n\n- slot\n  slot to\
    \ configure\n\n- procfn\n  callback function to call for /proc\n\n- dev\n  device\
    \ information passed to the callback\n\n# Description\n\nThis sets up an callback\
    \ for /proc/mca/slot?. The function is called with the buffer, slot, and device\
    \ pointer (or some equally informative context information, or nothing, if you\
    \ prefer), and is expected to put useful information into the buffer. The adapter\
    \ name, ID, and POS registers get printed before this is called though, so don’t\
    \ do it again.\n\nThis should be called with a NULL procfn when a module unregisters,\
    \ thus preventing kernel crashes and other such nastiness.\n\n## mca_is_adapter_used\n\
    \n# Name\n\nmca_is_adapter_used — check if claimed by driver\n\n# Synopsis\n\n\
    ```\nint mca_is_adapter_used (int slot);\n```\n\n# Arguments\n\n- slot\n  slot\
    \ to check\n\n# Description\n\nReturns 1 if the slot has been claimed by a driver\n\
    \n## mca_mark_as_used\n\n# Name\n\nmca_mark_as_used — claim an MCA device\n\n\
    # Synopsis\n\n```\nint mca_mark_as_used (int slot);\n```\n\n# Arguments\n\n- slot\n\
    \  slot to claim\n\n# FIXME\n\nshould we make this threadsafe\nClaim an MCA slot\
    \ for a device driver. If the slot is already taken the function returns 1, if\
    \ it is not taken it is claimed and 0 is returned.\n\n## mca_mark_as_unused\n\n\
    # Name\n\nmca_mark_as_unused — release an MCA device\n\n# Synopsis\n\n```\nvoid\
    \ mca_mark_as_unused (int slot);\n```\n\n# Arguments\n\n- slot\n  slot\n\n# Description\n\
    \nRelease the slot.\n\n## mca_get_adapter_name\n\n# Name\n\nmca_get_adapter_name\
    \ — get the description\n\n# Synopsis\n\n```\nchar * mca_get_adapter_name (int\
    \ slot);\n```\n\n# Arguments\n\n- slot\n  slot\n\n# Description\n\nReturn the\
    \ name of the adapter.\n\n## mca_isadapter\n\n# Name\n\nmca_isadapter — check\
    \ if adapter is present\n\n# Synopsis\n\n```\nint mca_isadapter (int slot);\n\
    ```\n\n# Arguments\n\n- slot\n  slot\n\n# Description\n\nReturns 1 if the adapter\
    \ is present.\n\n## mca_isenabled\n\n# Name\n\nmca_isenabled — check if the slot\
    \ is enabled\n\n# Synopsis\n\n```\nint mca_isenabled (int slot);\n```\n\n# Arguments\n\
    \n- slot\n  slot\n\n# Description\n\nReturns 1 if the slot is enabled.\n\n## mca_enable_dma\n\
    \n# Name\n\nmca_enable_dma — channel to enable\n\n# Synopsis\n\n```\nvoid mca_enable_dma\
    \ (unsigned int dmanr);\n```\n\n# Arguments\n\n- dmanr\n  DMA channel\n\n# Description\n\
    \nEnable the DMA controller.\n\n## mca_disable_dma\n\n# Name\n\nmca_disable_dma\
    \ — channel to disable\n\n# Synopsis\n\n```\nvoid mca_disable_dma (unsigned int\
    \ dmanr);\n```\n\n# Arguments\n\n- dmanr\n  DMA channel\n\n# Description\n\nDisable\
    \ the DMA controller.\n\n## mca_set_dma_addr\n\n# Name\n\nmca_set_dma_addr — load\
    \ 24bit DMA address\n\n# Synopsis\n\n```\nvoid mca_set_dma_addr (unsigned int\
    \ dmanr, unsigned int a);\n```\n\n# Arguments\n\n- dmanr\n  DMA channel\n\n- a\n\
    \  24bit bus address\n\n# Description\n\nLoad the register in the DMA controller.\
    \ This has a 24bit limitation (16Mb).\n\n## mca_get_dma_addr\n\n# Name\n\nmca_get_dma_addr\
    \ — load 24bit DMA address\n\n# Synopsis\n\n```\nunsigned int mca_get_dma_addr\
    \ (unsigned int dmanr);\n```\n\n# Arguments\n\n- dmanr\n  DMA channel\n\n# Description\n\
    \nRead the address register in the DMA controller. This has a 24bit limitation\
    \ (16Mb).\n\n## mca_set_dma_count\n\n# Name\n\nmca_set_dma_count — load 16bit\
    \ transfer count\n\n# Synopsis\n\n```\nvoid mca_set_dma_count (unsigned int dmanr,\
    \ unsigned int count);\n```\n\n# Arguments\n\n- dmanr\n  DMA channel\n\n- count\n\
    \  count\n\n# Description\n\nSet the DMA count for this channel. This can be up\
    \ to 64Kbytes. Setting a count of zero will not do what you expect.\n\n## mca_get_dma_residue\n\
    \n# Name\n\nmca_get_dma_residue — get the remaining bytes to transfer\n\n# Synopsis\n\
    \n```\nunsigned int mca_get_dma_residue (unsigned int dmanr);\n```\n\n# Arguments\n\
    \n- dmanr\n  DMA channel\n\n# Description\n\nThis function returns the number\
    \ of bytes left to transfer on this DMA channel.\n\n## mca_set_dma_io\n\n# Name\n\
    \nmca_set_dma_io — set the port for an I/O transfer\n\n# Synopsis\n\n```\nvoid\
    \ mca_set_dma_io (unsigned int dmanr, unsigned int io_addr);\n```\n\n# Arguments\n\
    \n- dmanr\n  DMA channel\n\n- io_addr\n  an I/O port number\n\n# Description\n\
    \nUnlike the ISA bus DMA controllers the DMA on MCA can transfer with an I/O port\
    \ target.\n\n## mca_set_dma_mode\n\n# Name\n\nmca_set_dma_mode — set the DMA mode\n\
    \n# Synopsis\n\n```\nvoid mca_set_dma_mode (unsigned int dmanr, unsigned int mode);\n\
    ```\n"
  mdcn: "\n\n# Description\n\n在 MCA 配置中搜索与给定 16bit ID 匹配的适配器。第一次调用时 `start` 应设为零，随后的调用应传递上一次调用的返回值，直到返回\
    \ `MCA_NOTFOUND` 为止。\n\n已禁用的适配器不会被报告。\n\n## mca_find_unused_adapter\n\n# 名称\n\n\
    mca_find_unused_adapter — 扫描未使用的适配器\n\n# 概要\n\n```\nint mca_find_unused_adapter(int\
    \ id, int start);\n```\n\n# 参数\n\n- id\n  要搜索的 MCA 标识符\n\n- start\n  起始槽位\n\n\
    # Description\n\n在 MCA 配置中搜索与给定 16bit ID 匹配的适配器。第一次调用时 `start` 应设为零，随后的调用应传递上一次调用的回价值，直到返回\
    \ `MCA_NOTFOUND` 为止。\n\n被驱动程序占用的适配器和禁用的适配器不会被报告。因此，此函数允许驱动程序在某些卡可能已被驱动的情况下扫描更多的显卡。\n\
    \n## mca_read_stored_pos\n\n# 名称\n\nmca_read_stored_pos — 从启动数据读取 POS 寄存器\n\n\
    # 概要\n\n```\nunsigned char mca_read_stored_pos (int slot, int reg);\n```\n\n#\
    \ 参数\n\n- slot\n  要读取的槽位\n\n- reg\n  要读取的寄存器\n\n# Description\n\n获取内核在扫描 MCA 空间时启动时存储的\
    \ POS 值。返回寄存器值。缺失或无效的寄存器报告 0。\n\n## mca_read_pos\n\n# 名称\n\nmca_read_pos — 从显卡读取\
    \ POS 寄存器\n\n# 概要\n\n```\nunsigned char mca_read_pos (int slot, int reg);\n```\n\
    \n# 参数\n\n- slot\n  要读取的槽位\n\n- reg\n  要读取的寄存器\n\n# Description\n\n直接从硬件获取 POS\
    \ 值以获得当前值。这比 `mca_read_stored_pos` 慢得多，并且可能不在中断文中调用。它透明地处理了板载设备所需的底层魔法。\n\n##\
    \ mca_write_pos\n\n# 名称\n\nmca_write_pos — 从显卡写入 POS 寄存器（注：此处原文为read，应为write）\n\
    \n# 概要\n\n```\nvoid mca_write_pos (int slot, int reg, unsigned char byte);\n```\n\
    \n# 参数\n\n- slot\n  要写入的槽位\n\n- reg\n  要写入的寄存器\n\n- byte\n  要写入 POS 寄存器的字节\n\n\
    # Description\n\n直接从硬件存储一个 POS 值。通常情况下你不应该使用此函数，并且在此之前你应该对 MCA 总线有非常深入的了解。操作不当可能会损坏硬件。\n\
    \n此函数可能在中断文中未使用。\n\n请注意，这在技术上是一件“坏事”（Bad Thing），IBM 的技术人员表示你应该只通过他们的工具来设置 POS\
    \ 值。然而，像 3c523 等某些设备建议你写回一些数据以确保配置的一致性。\n我是说 IBM 是的，但我希望我的驱动程序能正常工作。\n\n此函数无法检查多个设备是否最终导致了相同的资源，所以如果有人搞砸了，你可能会看到“魔法烟雾”。\n\
    \n## mca_set_adapter_name\n\n# 名称\n\nmca_set_adapter_name — 设置卡的描述\n\n# 概要\n\n\
    ```\nvoid mca_set_adapter_name (int slot, char* name);\n```\n\n# 参数\n\n- slot\n\
    \  要命名的槽位\n\n- name\n  名称的文本字符串\n\n# Description\n\n此函数设置通过 `/proc` 报告的此适配器槽位的名称。这仅供用户参考。设置名称将删除任何之前的名称。\n\
    \n## mca_set_adapter_procfn\n\n# 名称\n\nmca_set_adapter_procfn — 设置 /proc 回调函数\n\
    \n# 概要\n\n```\nvoid mca_set_adapter_procfn (int slot, MCA_ProcFn procfn, void*\
    \ dev);\n```\n\n# 参数\n\n- slot\n  要配置的槽位\n\n- procfn\n  /proc 调用的回调函数\n\n- dev\n\
    \  传递给回调的设备信息\n\n# Description\n\n这为 `/proc/mca/slot?` 设置了一个回调。调用该函数时会带有缓冲区、槽位和设备指针（或某些等量信息的上下文信息，如果你愿意，也可以不传任何），并预期在缓冲区中放入有用信息。尽管如此在调用此函数之前，适配器的名称、ID\
    \ 和 POS 寄存器已经打印了，所以不要重复操作。\n\n当模块注销时，应该带有 `NULL` procfn 调用此函数，以防止内核崩溃或其他类似的糟糕情况。\n\
    \n## mca_is_adapter_used\n\n# 名称\n\nmca_is_adapter_used — 检查是否被驱动程序占用\n\n# 概要\n\
    \n```\nint mca_is_adapter_used (int slot);\n```\n\n# 参数\n\n- slot\n  要检查的槽位\n\n\
    # Description\n\n如果槽位已被驱动程序占用，则返回 1\n\n## mca_mark_as_used\n\n# 名称\n\nmca_mark_as_used\
    \ — 占用一个 MCA 设备\n\n# 概要\n\n```\nint mca_mark_as_used (int slot);\n```\n\n# 参数\n\
    \n- slot\n  要占用的槽位\n\n# FIXME\n\n我们是否应该让它是线程安全的\n为设备驱动程序占用一个 MCA 槽位。如果槽位已被占用，函数返回\
    \ 1；如果未被占用，则占用并返回 0。\n\n## mca_mark_as_unused\n\n# 名称\n\nmca_mark_as_unused —\
    \ 释放 MCA 设备\n\n# 概要\n\n```\nvoid mca_mark_as_unused (int slot);\n```\n\n# 参数\n\
    \n- slot\n  槽位\n\n# Description\n\n释放槽位。\n\n## mca_get_adapter_name\n\n# 名称\n\n\
    mca_get_adapter_name — 获取适配器名称\n\n# 概要\n\n```\nchar * mca_get_adapter_name (int\
    \ slot);\n```\n\n# 参数\n\n- slot\n  槽位\n\n# Description\n\n适配器的名称。\n\n## mca_isadapter\n\
    \n# 名称\n\nmca_isadapter — 检查适配器是否存在\n\n# 概要\n\n```\nint mca_isadapter (int slot);\n\
    ```\n\n# 参数\n\n- slot\n  槽位\n\n# Description\n\n如果适配器存在，返回 1\n\n## mca_isenabled\n\
    \n# 名称\n\nmca_isenabled — 检查槽位是否启用\n\n# 概要\n\n```\nint mca_isenabled (int slot);\n\
    ```\n\n# 参数\n\n- slot\n  槽位\n\n# Description\n\n如果槽位已启用，返回 1\n\n## mca_enable_dma\n\
    \n# 名称\n\nmca_enable_dma — 启用 DMA\n\n# 概要\n\n```\nvoid mca_enable_dma (unsigned\
    \ int dmanr);\n```\n\n# 参数\n\n- dmanr\n  DMA 通道\n\n# Description\n\nDMA 控制器。\n\
    \n## mca_disable_dma\n\n# 名称\n\nmca_disable_dma — 禁用 DMA\n\n# 概要\n\n```\nvoid\
    \ mca_disable_dma (unsigned int dmanr);\n```\n\n# 参数\n\n- dmanr\n  DMA 通道\n\n\
    # Description\n\nDMA 控制器。\n\n## mca_set_dma_addr\n\n# 名称\n\nmca_set_dma_addr —\
    \ 设置 24bit DMA 地址\n\n# 概要\n\n```\nvoid mca_set_dma_addr (unsigned int dmanr, unsigned\
    \ int a);\n```\n\n# 参数\n\n- dmanr\n  DMA 通道\n\n- a\n  24bit 地址\n\n# Description\n\
    \n设置 DMA 控制器中的寄存器。\n\n## mca_get_dma_addr\n\n# 名称\n\nmca_get_dma_addr — 获取 24bit\
    \ DMA 地址\n\n# 概要\n\n```\nunsigned int mca_get_dma_addr (unsigned int dmanr);\n\
    ```\n\n# 参数\n\n- dmanr\n  DMA 通道\n\n# Description\n\n读取 DMA 控制器中的寄存器。\n\n## mca_set_dma_count\n\
    \n# 名称\n\nmca_set_dma_count — 设置 16bit 传输计数\n\n# 概要\n\n```\nvoid mca_set_dma_count\
    \ (unsigned int dmanr, unsigned int count);\n```\n\n# 参数\n\n- dmanr\n  DMA 通道\n\
    \n- count\n  计数\n\n# Description\n\n设置该通道的 DMA 计数。最大为 64KB。将计数设置为 0 不符合你的预期。\n\
    \n## mca_get_dma_residue\n\n# 名称\n\nmca_get_dma_residue — 获取剩余传输字节\n\n# 概要\n\n\
    ```\nunsigned int mca_get_dma_residue (unsigned int dmanr);\n```\n\n# 参数\n\n-\
    \ dmanr\n  DMA 通道\n\n# Description\n\n该 DMA 通道剩余传输的字节数。\n\n## mca_set_dma_io\n\
    \n# 名称\n\nmca_set_dma_io — 设置 I/O 传输端口\n\n# 概要\n\n```\nvoid mca_set_dma_io (unsigned\
    \ int dmanr, unsigned int io_addr);\n```\n\n# 参数\n\n- dmanr\n  DMA 通道\n\n- io_addr\n\
    \  I/O 端口号\n\n# Description 与 ISA 总线 DMA 控制器不同，MCA 的 DMA 可以与 I/O 端口进行传输。\n\n##\
    \ mca_set_dma_mode\n\n# 名称\n\nmca_set_dma_mode — 设置 DMA 模式\n\n# 概要\n\n```\nvoid\
    \ mca_set_dma_mode (unsigned int dmanr, unsigned int mode);\n```\n\n"
