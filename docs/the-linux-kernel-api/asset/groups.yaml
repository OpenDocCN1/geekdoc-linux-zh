    # pci_find_slot


    # 名称


    pci_find_slot — 从给定的 PCI 插槽定位 PCI 设备


    # 签 /


    ```

    struct pci_dev * pci_find_slot (unsigned int bus, unsigned int devfn);

    ```


    # 参数


    - bus: 目标 PCI 设备所在的 PCI 总线编号

    - devfn: 编码了目标 PCI 设备所在的 PCI 插槽号，以及在多功能设备情况下该插槽内的逻辑设备号。


    # 描述


    给定的 PCI 总线和插槽/功能号，在系统全局 PCI 设备列表中定位目标 PCI 设备。如果找到设备，则返回其数据结构体的指针。如果没有找到设备，则返回
    NULL。


    # pci_find_subsys


    # 名称


    pci_find_subsys — 通过厂商/子厂商/设备/子设备 ID 开始或继续搜索 PCI 设备


    # 签 /


    ```

    struct pci_dev * pci_find_subsys (unsigned int vendor, unsigned int device, unsigned
    int ss_vendor, unsigned int ss_device, const struct pci_dev * from);

    ```


    # 参数


    - vendor: 要匹配的 PCI 厂商 ID，或使用 PCI_ANY_ID 匹配所有厂商 ID

    - device: 要匹配的 PCI 设备 ID，或使用 PCI_ANY_ID 匹配所有设备 ID

    - ss_vendor: 要匹配的 PCI 子系统厂商 ID，或使用 PCI_ANY_ID 匹配所有厂商 ID

    - ss_device: 要匹配的 PCI 子系统设备 ID，或使用 PCI_ANY_ID 匹配所有设备 ID

    - from: 搜索中找到的上一个 PCI 设备，或为 NULL 表示新搜索。


    # 描述


    遍历已知 PCI 设备列表。如果找到匹配 vendor、device、ss_vendor 和 ss_device 的 PCI 设备，则返回其设备结构体的指针。否则，返回
    NULL。通过向 from 参数传递 NULL 开始新搜索。否则，如果 from 不为 NULL，则从全局列表中的下一个设备继续搜索。


    # pci_find_device


    # 名称


    pci_find_device — 通过厂商/设备 ID 开始或继续搜索 PCI 设备


    # 签 /


    ```

    struct pci_dev * pci_find_device (unsigned int vendor, unsigned int device, const
    struct pci_dev * from);

    ```


    # 参数


    - vendor: 要匹配的 PCI 厂商 ID，或使用 PCI_ANY_ID 匹配所有厂商 ID

    - device: 要匹配的 PCI 设备 ID，或使用 PCI_ANY_ID 匹配所有设备 ID

    - from: 搜索中找到的上一个 PCI 设备，或为 NULL 表示新搜索。


    # 描述


    遍历已知 PCI 设备列表。如果找到匹配 vendor 和 device 的 PCI 设备，则返回其设备结构体的指针。否则，返回 NULL。通过向 from
    参数传递 NULL 开始新搜索。否则，如果 from 不为 NULL，则从全局列表中的下一个设备继续搜索。


    # pci_find_class


    # 名称


    pci_find_class — 通过类开始或继续搜索 PCI 设备


    # 签 /


    ```

    struct pci_dev * pci_find_class (unsigned int class, const struct pci_dev * from);

    ```


    # 参数


    - class: 搜索具有类指定的 PCI 设备

    - from: 搜索中找到的上一个 PCI 设备，或为 NULL 表示新搜索。


    # 描述


    遍历已知 PCI 设备列表。如果找到匹配 `class` 的 PCI 设备，则返回其设备结构体的指针。否则，返回 NULL。通过向 `from` 参数传递
    NULL 开始新搜索。否则，如果 *from* 不为 NULL，则从全局列表中的下一个设备继续搜索。


    # pci_find_capability


    # 名称


    pci_find_capability — 查询设备的容量


    # 签 /


    ```

    int pci_find_capability (struct pci_dev * dev, int cap);

    ```


    # 参数


    - dev: 查询的设备

    - cap: 容量代码


    # 描述


    告知设备是否支持指定的容量。返回设备配置空间内请求容量的地址，如果不支持则返回 0。可能的 cap 值：


    - PCI_CAP_PM 电源管理

    - PCI_CAP_AGP 加速图形

    - PCI_CAP_VPD 关键数据

    - PCI_CAP_SLOT 插槽标识

    - PCI_CAP_MSI 消息信号中断

    - PCI_CAP_CHSWP PCI 热插拔


    # pci_find_parent_resource


    # 名称


    pci_find_parent_resource — 返回区域所属的父总线区域


    # 签 /


    ```

    struct resource * pci_find_parent_resource (const struct pci_dev dev, struct resource
    * res);

    ```


    # 参数


    - dev: 资源的设备结构

    - res: 需要查找的子资源记录


    # 描述


    对于给定的区域，返回其所属的父总线区域，或其应从何处分配。


    # pci_set_power_state


    # 名称


    pci_set_power_state — 设置 PCI 设备的电源状态


    # 签 /


    ```

    int pci_set_power_state (struct pci_dev * dev, int state);

    ```


    # 参数


    - dev: 要挂起的设备

    - state: 进入的状态


    # 描述


    使用设备配置空间中的电源管理功能转换到新的电源状态。


    # 返回值


    尝试进入比当前低的状态返回 -EINVAL。如果已经是请求的状态返回 0。如果设备不支持 PCI PM 返回 -EIO。如果成功更改电源状态返回 0。


    # pci_save_state


    # 名称


    pci_save_state — 在挂起前保存设备的 PCI 配置空间


    # 签 /


    ```

    int pci_save_state (struct pci_dev * dev, u32 * buffer);

    ```


    # 参数


    - dev: 我们正在处理的设备

    - buffer: 用于存储配置空间的缓冲区


    # 描述


    buffer 必须足够容整个 PCI 2.2 配置空间（>= 64 字节）。


    # pci_restore_state


    # 名称


    pci_restore_state — 恢复保存的设备状态


    # 签 /


    ```

    int pci_restore_state (struct pci_dev * dev, u32 * buffer);

    ```


    # 参数


    - dev: 我们正在处理的设备


    # pci_enable_device


    # 名称


    pci_enable_device — 在驱动程序使用前初始化设备


    # 签 /


    ```

    int pci_enable_device (struct pci_dev * dev);

    ```


    # 参数


    - dev: 要初始化的设备


    # 描述


    在驱动程序使用前初始化设备。请求低层代码启用 I/O 和内存。如果设备处于挂起状态，则唤醒它。注意，此函数可能会失败。


