    int is_subdir (struct dentry * new_dentry, struct dentry * old_dentry);

    ```


    ### Arguments


    - new_dentry

    new_dentry


    - old_dentry

    old_dentry


    ### Description

    Returns 1 if new_dentry is a subdirectory of the parent (at any depth). Returns
    0 otherwise.


    ## find_inode_number


    ### Name

    find_inode_number — check for dentry name


    ### Synopsis

    ```

    ino_t find_inode_number (struct dentry * dir, struct qstr * name);

    ```


    ### Arguments


    dir

    directory to check


    name

    Name to find.


    ### Description

    Check whether a dentry already exists for the given name, and return the inode
    number if it has an inode. Otherwise 0 is returned.


    This routine is used to post-process directory listings for filesystems using
    synthetic inode numbers, and is necessary to keep getcwd working.


    ## d_drop


    ### Name

    d_drop — drop a dentry


    ### Synopsis

    ```

    void d_drop (struct dentry * dentry);

    ```


    ### Arguments


    dentry

    dentry to drop


    ### Description

    d_drop unhashes the entry from the parent dentry hashes, so that it won’t be found
    through a VFS lookup any more. Note that this is different from deleting the dentry
    - d_delete will try to mark the dentry negative if possible, giving a successful
    _negative_lookup, while d_drop will just make the cache lookup fail.


    d_drop is used mainly for stuff that wants to invalidate a dentry for some reason
    (NFS timeouts or autofs deletes).


