    ```

    mode_option

    string video mode to find

    db

    video mode database

    dbsize

    size of db

    default_mode

    ideo mode to fall back to

    default_bpp

    def color depth in bits per pixel

    ```


    # Description


    Finds a suitable video mode, starting with the specified mode in mode_option with
    fallback to default_mode. If default_mode fails, all modes in the video database
    will be tried.


    Valid specifiers for mode_option:


    <xres>x<yres>-<bpp>[@[refresh> or <name>-<bpp>][@refresh>

    with <xres>, <yres>, <bpp> and <refresh> decimal numbers and <name> a string.


    # NOTE


    The passed struct var is not_cleared! This allows you to supply values for e.g.
    the grayscale and accel_flags fields.


    Returns zero for failure, 1 if using specified mode_option, 2 if using specified
    mode_option with an ignored refresh rate, 3 if default mode is used, 4 if fall
    back to any valid mode.'
