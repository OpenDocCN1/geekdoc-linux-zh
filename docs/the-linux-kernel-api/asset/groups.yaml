    ## 第 2 章数据类型


    ## 2.1. 双向链表


    ### list_add


    #### 名称

    list_add — 添加新条目


    #### 概要

    ```

    void list_add (struct list_head * new, struct list_head * head);

    ```


    #### 参数

    - * new: 要添加的新条目

    - head: 在之后添加的链表头部


    #### 描述

    在指定的 head 之后插入新条目。这有助于实现栈。


    ### list_add_tail


    #### 名称

    list_add_tail — 添加新条目


    #### 概要

    ```

    void list_add_tail (struct list_head * new, struct list_head * head);

    ```


    #### 参数

    - new: 要添加的新条目

    - head: 在其之前添加的链表头部


    #### 描述

    在指定的 head 之前插入新条目。这有助于实现队列。


    ### list_del


    #### 名称

    list_del — 从链表中删除条目。


    #### 概要

    ```

    void list_del (struct list_head * entry);

    ```


    #### 参数

    - entry: 要从链表中删除的元素。


    #### 注意

    在此之后对 entry 执行 `list_empty` 不返回 true，该条目处于未定义状态。


    ### list_del_init


    #### 名称

    list_del_init — 从链表中删除条目并重新初始化。


    #### 概要

    ```

    void list_del_init (struct list_head * entry);

    ```


    #### 参数

    - entry: 要从链表中删除的元素。


    ### list_empty


    #### 名称

    list_empty — 测试链表是否为空


    #### 概要

    ```

    int list_empty (struct list_head * head);

    ```


    #### 参数

    - head: 要测试的链表。


    ### list_splice


    #### 名称

    list_splice — 合并两个链表


    #### 概要

    ```

    void list_splice (struct list_head * list, struct list_head * head);

    ```


    #### 参数

    - list: 要添加的新链表。

    - head: 在第一个链表中添加它的位置。


    ### list_entry


    #### 名称

    list_entry — 获取该条目的结构体


    #### 概要

    ```

    list_entry ( ptr, type, member);

    ```


    #### 参数

    - * ptr: &struct list_head 指针。

    - type: 嵌入其中的结构体类型。

    - member: 结构体内链表结构体的成员名称。


    ### list_for_each


    #### 名称

    list_for_each — 遍历链表


    #### 概要

    ```

    list_for_each ( pos, head);

    ```


    #### 参数

    - pos: 用作循环计数器的 &struct list_head。

    - head: 链表的头部。


    ### list_for_each_safe


    #### 名称

    list_for_each_safe — 遍历链表，防止删除链表条目安全


    #### 概要

    ```

    list_for_each_safe ( pos, n, head);

    ```


    #### 参数

    - pos: 用作循环计数器的 &struct list_head。

    - n: 另一个用于临时存储的 &struct list_head

    - head: 链表的头部。


