- md: "\n## 20.6. Frame Buffer Macintosh Video Mode Database\n\n### console_getmode\n\
    \n# Name\nconsole_getmode — get current mode\n\n# Synopsis\n```\nint console_getmode\
    \ (struct vc_mode * mode);\n```\n\n# Arguments\n- mode\n  virtual console mode\
    \ structure\n\n# Description\nPopulates mode with the current mode held in the\
    \ global display_info structure.\n\nNote, this function is only for XPMAC compatibility.\n\
    \nReturns zero.\n\n### console_setmode\n\n# Name\nconsole_setmode — sets current\
    \ console mode\n\n# Synopsis\n```\nint console_setmode (struct vc_mode * mode,\
    \ int doit);\n```\n\n# Arguments\n- mode\n  virtual console mode structure\n-\
    \ doit\n  boolean, 0 test mode, 1 test and activate mode\n\n# Description\nSets\
    \ mode for all virtual consoles if doit is non-zero, otherwise, test a mode for\
    \ validity.\n\nNote, this function is only for XPMAC compatibility.\n\nReturns\
    \ negative errno on error, or zero for success.\n\n### console_setmap\n\n# Name\n\
    console_setmap — sets palette color map for console\n\n# Synopsis\n```\nint console_setmap\
    \ (int n_entries, unsigned char * red, unsigned char * green, unsigned char *\
    \ blue);\n```\n\n# Arguments\n- n_entries\n  number of entries in the palette\
    \ (max 16)\n- red\n  value for red component of palette\n- green\n  value for\
    \ green component of palette\n- blue\n  value for blue component of palette\n\n\
    # Description\nSets global palette_cmap structure and activates the palette on\
    \ the current console.\n\nNote, this function is only for XPMAC compatibility.\n\
    \nReturns negative errno on error, or zero for success.\n\n### console_powermode\n\
    \n# Name\nconsole_powermode — sets monitor power mode\n\n# Synopsis\n```\nint\
    \ console_powermode (int mode);\n```\n\n# Arguments\n- mode\n  power state to\
    \ set\n\n# Description\nSets power state as dictated by mode.\nNote that this\
    \ function is only for XPMAC compatibility and doesn't do much.\nReturns 0 for\
    \ VC_POWERMODE_INQUIRY, -EINVAL for VESA power settings, or -ENIXIO on failure.\n\
    \n### mac_vmode_to_var\n\n# Name\nmac_vmode_to_var — converts vmode/cmode pair\
    \ to var structure\n\n# Synopsis\n```\nint mac_vmode_to_var (int vmode, int cmode,\
    \ struct fb_var_screeninfo * var);\n```\n\n# Arguments\n- vmode\n  MacOS video\
    \ mode\n- cmode\n  MacOS color mode\n- var\n  frame buffer video mode structure\n\
    \n# Description\nConverts a MacOS vmode/cmode pair to a frame buffer video mode\
    \ structure.\n\nReturns negative errno on error, or zero for success.\n\n### mac_var_to_vmode\n\
    \n# Name\nmac_var_to_vmode — convert var structure to MacOS vmode/cmode pair\n\
    \n# Synopsis\n```\nint mac_var_to_vmode (const struct fb_var_screeninfo * var,\
    \ int * vmode, int * cmode);\n```\n\n# Arguments\n- var\n  frame buffer video\
    \ mode structure\n- vmode\n  MacOS video mode\n- cmode\n  MacOS color mode\n\n\
    # Description\nConverts a frame buffer video mode structure to a MacOS vmode/cmode\
    \ pair.\n\nReturns negative errno on error, or zero for success.\n\n### mac_map_monitor_sense\n\
    \n# Name\nmac_map_monitor_sense — Convert monitor sense to vmode\n\n# Synopsis\n\
    ```\nint mac_map_monitor_sense (int sense);\n```\n\n# Arguments\n- sense\n  Macintosh\
    \ monitor sense number\n\n# Description\nConverts a Macintosh monitor sense number\
    \ to a MacOS vmode number.\n\nReturns MacOS vmode video mode number.\n\n### mac_find_mode\n\
    \n# Name\nmac_find_mode — find a video mode\n\n# Synopsis\n```\nint __init mac_find_mode\
    \ (struct fb_var_screeninfo * var, struct fb_info * info, const char * mode_option,\
    \ unsigned int default_bpp);\n```\n\n# Arguments\n- var\n  frame buffer user defined\
    \ part of display\n- info\n  frame buffer info structure\n- mode_option\n  video\
    \ mode name (see mac_modedb[])\n- default_bpp\n  default color depth in bits per\
    \ pixel\n\n# Description\nFinds a suitable mode. Tries to set mode specified by\
    \ mode_option. If the name of the wanted mode begins with 'mac', the Mac video\
    \ mode database will be used, otherwise it will fall back to the standard video\
    \ mode database.\n\n# Note\nFunction marked as __init and can only be used during\
    \ system boot.\nReturns error code from fb_find_mode (see fb_find_mode function).\n\
    \n## 20.7. Frame Buffer Fonts\n\n### fbcon_find_font\n\n# Name\nfbcon_find_font\
    \ — find a font\n\n# Synopsis\n```\nstruct fbcon_font_desc * fbcon_find_font (char\
    \ * name);\n```\n\n# Arguments\n- name\n  string name of a font\n\n# Description\n\
    Find a specified font with string name name.\n\nReturns NULL if no font found,\
    \ or a pointer to the specified font.\n\n### fbcon_get_default_font\n\n# Name\n\
    fbcon_get_default_font — get default font\n\n# Synopsis\n```\nstruct fbcon_get_font_desc\
    \ * fbcon_get_default_font (int xres, int yres);\n```\n\n# Arguments\n- xres\n\
    \  screen size of X\n- yres\n  screen size of Y\n\n# Description\nGet the default\
    \ font for a specified screen size. Dimensions are in pixels.\n\nReturns NULL\
    \ if no font is found, or a pointer to the chosen font.\n"
  mdcn: "\n\n## 20.6. 缓冲区 Macintosh 视频模式数据库\n\n### console_getmode\n\n# 名称\nconsole_getmode\
    \ — 获取当前模式\n\n# 概要\n```\nint console_getmode (struct vc_mode * mode);\n```\n\n\
    # 参数\n- mode\n  虚拟控制台模式结构\n\n# 描述\n用全局 display_info 结构体中的当前模式填充 mode。\n\n注意，此函数仅用于\
    \ XPMAC 兼容性。\n\n返回 0。\n\n### console_setmode\n\n# 名称\nconsole_setmode — 设置当前控制台模式\n\
    \n# 概要\n```\nint console_setmode (struct vc_mode * mode, int doit);\n```\n\n#\
    \ 参数\n- mode\n  虚拟控制台模式结构\n- doit\n  布尔值，0 为测试模式，1 为测试并激活模式\n\n# 描述\n如果 doit 不为零，则为所有虚拟控制台设置模式；否则，测试模式的有效性。\n\
    \n注意，此函数仅用于 XPMAC 兼容性。\n\n错误时返回负数 errno，成功时返回 0。\n\n### console_setmap\n\n# 名称\n\
    console_setmap — 设置控制台的调色板映射\n\n# 概要\n```\nint console_setmap (int n_entries,\
    \ unsigned char * red, unsigned char * green, unsigned char * blue);\n```\n\n\
    # 参数\n- n_entries\n  调色板条目数（最大 16）\n- red\n  调色板红色组件的值\n- green\n  调色板绿色组件的值\n\
    - blue\n  调色板蓝色组件的值\n\n# 描述\n设置全局 palette_cmap 结构并在当前控制台上激活调色板。\n\n注意，此函数仅用于 XPMAC\
    \ 兼容性。\n\n错误时返回负数 errno，成功时返回 0。\n\n### console_powermode\n\n# 名称\nconsole_powermode\
    \ — 设置显示器电源模式\n\n# 概要\n```\nint console_powermode (int mode);\n```\n\n# 参数\n-\
    \ mode\n  要设置的电源状态\n\n# 描述\n根据 mode 设置电源状态。注意此函数仅用于 XPMAC 兼容性且作用不大。\n对于 VC_POWERMODE_INQUIRY\
    \ 返回 0，对于 VESA 设置返回 -EINVAL，失败时返回 -ENIXIO。\n\n### mac_vmode_to_var\n\n# 名称\nmac_vmode_to_var\
    \ — 将 vmode/cmode 对转换为 var 结构体\n\n# 概要\n```\nint mac_vmode_to_var (int vmode,\
    \ int cmode, struct fb_var_screeninfo * var);\n```\n\n# 参数\n- vmode\n  MacOS 视频模式\n\
    - cmode\n  MacOS 颜色模式\n- var\n  缓冲区视频模式结构体\n\n# 描述\n将 MacOS 的 vmode/cmode 对转换为缓冲区视频模式结构体。\n\
    \n错误时返回负数 errno，成功时返回 0。\n\n### mac_var_to_vmode\n\n# 名称\nmac_var_to_vmode — 将\
    \ var 结构体转换为 MacOS vmode/cmode 对\n\n# 概要\n```\nint mac_var_to_vmode (const struct\
    \ fb_var_screeninfo * var, int * vmode, int * cmode);\n```\n\n# 参数\n- var\n  缓冲区视频模式结构体\n\
    - vmode\n  MacOS 视频模式\n- cmode\n  MacOS 颜色模式\n\n# 描述\n将缓冲区视频模式结构体转换为 MacOS 的 vmode/cmode\
    \ 对。\n\n错误时返回负数 errno，成功时返回 0。\n\n### mac_map_monitor_sense\n\n# 名称\nmac_map_monitor_sense\
    \ — 将显示器感应转换为 vmode\n\n# 概要\n```\nint mac_map_monitor_sense (int sense);\n```\n\
    \n# 参数\n- sense\n  Macintosh 显示器感应数字\n\n# 描述\n将 Macintosh 显示器感应数字转换为 MacOS vmode\
    \ 数字。\n\n返回 MacOS vmode 视频模式数字。\n\n### mac_find_mode\n\n# 名称\nmac_find_mode —\
    \ 查找视频模式\n\n# 概要\n```\nint __init mac_find_mode (struct fb_var_screeninfo * var,\
    \ struct fb_info * info, const char * mode_option, unsigned int default_bpp);\n\
    ```\n\n# 参数\n- var\n  显示自定义部分\n- info\n  缓冲区信息结构体\n- mode_option\n  视频模式名称（参见\
    \ mac_modedb[]）\n- default_bpp\n  默认每像素颜色深度（位）\n\n# 描述\n查找合适的模式。尝试设置由 mode_option\
    \ 指定模式。如果所需模式的名称以 'mac' 开头，将使用 Mac 视频模式数据库，否则将退回到标准视频模式数据库。\n\n# 注意\n函数被标记为 __init，只能在系统启动期间使用。\n\
    返回来自 fb_find_mode 的错误代码（参见 fb_find_mode 函数）。\n\n## 20.7. 缓冲区字体\n\n### fbcon_find_font\n\
    \n# 名称\nfbcon_find_font — 查找字体\n\n# 概要\n```\nstruct fbcon_font_desc * fbcon_find_font\
    \ (char * name);\n```\n\n# 参数\n- name\n  字体字符串名称\n\n# 描述\n根据字符串名称 name 查找指定的字体。\n\
    \n未找到字体返回 NULL，否则返回指定字体的指针。\n\n### fbcon_get_default_font\n\n# 名称\nfbcon_get_default_font\
    \ — 获取默认字体\n\n# 概要\n```\nstruct fbcon_font_desc * fbcon_get_default_font (int\
    \ xres, int yres);\n```\n\n# 参数\n- xres\n  屏幕 X 轴\n- yres\n  屏幕 Y 轴\n\n# 描述\n\
    获取指定屏幕尺寸的默认字体。单位为像素。\n\n未找到字体返回 NULL，否则返回所选字体的指针。\n\n"
