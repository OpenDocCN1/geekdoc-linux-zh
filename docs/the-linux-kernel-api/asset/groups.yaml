    ## devfs_register


    # Name

    devfs_register — Register a device entry.


    # Synopsis


    ```

    devfs_handle_t devfs_register (devfs_handle_t dir, const char * name, unsigned
    int flags, unsigned int major, unsigned int minor, umode_t mode, * ops, void *
    info);

    ```


    # Arguments


    dir

    The handle to the parent devfs directory entry. If this is NULL the new name is
    relative to the root of the devfs.


    name


    The name of the entry.


    flags


    A set of bitwise-ORed flags (DEVFS_FL_*).


    major


    The major number. Not needed for regular files.


    minor


    The minor number. Not needed for regular files.


    mode


    The default file mode.


    ops


    The &file_operations or &block_device_operations structure. This must not be externally
    deallocated.


    info


    An arbitrary pointer which will be written to the private_data field of the file
    structure passed to the device driver. You can set this to whatever you like,
    and change it once the file is opened (the next file opened will not see this
    change).


    # Description

    Returns a handle which may later be used in a call to devfs_register. On failure
    NULL is returned.


    ## devfs_unregister


    # Name

    devfs_unregister — Unregister a device entry.


    # Synopsis


    ```

    void devfs_unregister (devfs_handle_t de);

    ```


    # Arguments


    de

    A handle previously created by devfs_register or returned from devfs_find_handle.
    If this is NULL the routine does nothing.


    ## devfs_mk_symlink


    # Name

    devfs_mk_symlink —


    # Synopsis


    ```

    int devfs_mk_symlink (devfs_handle_t dir, const char * name, unsigned int flags,
    const char * link, devfs_handle_t * handle, void * info);

    ```


    # Arguments


    dir

    The handle to the parent devfs directory entry. If this is NULL the new name is
    relative to the root of the devfs.


    name


    The name of the entry.


    flags


    A set of bitwise-ORed flags (DEVFS_FL_*).


    link


    The destination name.


    handle


    The handle to the symlink entry is written here. This may be NULL.


