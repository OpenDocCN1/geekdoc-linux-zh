    # Description


    Returns true if more than one person has a reference to this buffer.


    # skb_share_check


    # Name


    skb_share_check — check if buffer is shared and if so clone it


    # Synopsis


    ```

    struct sk_buff * skb_share_check (struct sk_buff *skb, int pri);

    ```


    # Arguments


    - skb: buffer to check

    - pri: priority for memory allocation


    # Description


    If the buffer is shared the cloned and the old copy drops a reference. A new clone
    with a single reference is returned. If the buffer is not shared the original
    buffer is returned. When being called from interrupt status or with spinlocks
    held pri must be GFP_ATOMIC.


    # skb_unshare


    # Name


    skb_unshare — make a copy of a shared buffer


    # Synopsis


    ```

    struct sk_buff * skb_unshare (struct sk_buff * skb, int pri);

    ```


    # Arguments


    - skb: buffer to check

    - pri: priority for memory allocation


    # Description


    If the socket buffer is a clone this function creates a new copy of the data,
    drops a reference count on the old copy and returns the new copy with the reference
    count at 1. If the buffer is not a clone the original buffer is returned. When
    called with a spinlock held or from interrupt state pri must be GFP_ATOMIC.


    NULL is returned on a memory allocation failure.


    # skb_peek


    # Name


    skb_peek —


    # Synopsis


    ```

    struct sk_buff * skb_peek (struct sk_buff_head * list_);

    ```


    # Arguments


    - list_: list to peek at


    # Description


    Peek an &sk_buff. Unlike most other operations you _MUST_ be careful with this
    one. A peek leaves the buffer on the list and someone else may run off with it.
    You must hold the appropriate locks or have a private queue to this.


    Returns NULL for an empty list or a pointer to the head element. The reference
    count is not incremented and the reference is therefore volatile. Use with caution.


    # skb_peek_tail


    # Name


    skb_peek_tail —


    # Synopsis


    ```

    struct sk_buff * skb_peek_tail (struct sk_buff_head * list_);

    ```


    # Arguments


    - list_: list to peek at


    # Description


    Peek an &sk_buff. Unlike other operations you _MUST_ to be careful with this.
    A peek leaves the buffer on the list and someone else may run off with it. You
    must hold the appropriate locks or have a private queue to this.


    Returns NULL for an empty list or a pointer to the tail element. The reference
    count is not incremented and the reference is therefore volatile. Use with caution.


    # skb_queue_len


    # Name


    skb_queue_len — get queue length


    # Synopsis


    ```

    __u32 skb_queue_len (struct sk_buff_head * list_);

    ```


    # Arguments


    - list_: list to measure


    # Description


    Return the length of an &sk_buff queue.


    # __skb_queue_head


    # Name


    __skb_queue_head — queue a buffer at the list head


    # Synopsis


    ```

    void __skb_queue_head (struct sk_buff_head * list, struct sk_buff *newsk);

    ```


    # Arguments


    - list: list to use

    - newsk: buffer to queue


    # Description


    Queue a buffer at the start of a list. This function takes no locks and you therefore
    hold required locks before calling it.


    A buffer cannot be placed on two lists at the same time.


    # skb_queue_head


    # Name


    skb_queue_head — queue a buffer at the list head


    # Synopsis


    ```

    void skb_queue_head (struct sk_buff_head * list, struct sk_buff * newsk);

    ```


    # Arguments


    - list: list to use

    - newsk: buffer to queue


    # Description


    Queue a buffer at the start of the list. This function takes the lock and can
    be used safely with other locking &sk_buff functions safely.


    A buffer cannot be placed on two lists at the same time.


    # __skb_queue_tail


    # Name


    __skb_queue_tail — queue a buffer at the list tail


    # Synopsis


    ```

    void __skb_queue_tail (struct sk_buff_head * list, struct sk_buff * newsk);

    ```


    # Arguments


    - list: to use

    - newsk: buffer to queue


    # Description


    Queue a buffer at the end of a list. This function takes no locks and you must
    therefore held required locks before calling it.


    A buffer cannot be placed on two lists at the same time.


    # skb_queue_tail


    # Name


    skb_queue_tail — queue a buffer at the list tail


    # Synopsis


    ```

    void skb_queue_tail (struct sk_buff_head * list, struct sk_buff * newsk);

    ```


    # Arguments


    - list: list to use

    - newsk: buffer to queue


    # Description


    Queue a buffer at the tail of the list. This function takes the list lock and
    can be used safely with other locking &sk_buff functions safely.


    A buffer cannot be placed on two lists at the same time.


    # __skb_dequeue


    # Name


    __skb_dequeue — remove from the head of the queue


    # Synopsis


    ```

    struct sk_buff * __skb_dequeue (struct sk_buff_head * list);

    ```


    # Arguments


    - list: to dequeue


    # Description


    Remove the head of the list. This function does not take locks so must be used
    with appropriate locks held. The head item is returned or NULL if the list is
    empty.


    # skb_dequeue


