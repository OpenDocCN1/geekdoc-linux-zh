- md: "\n## Arguments\n\nmaster\n\nThe master devfs entry.\n\n## Description\n\nReturns\
    \ the slave which will be unregistered when master is unregistered.\n\n## devfs_get_name\n\
    \n### Name\n\ndevfs_get_name — Get the name for a device entry in its parent directory.\n\
    \n### Synopsis\n\n```\nconst char * devfs_get_name (devfs_handle_t de, unsigned\
    \ int * namelen);\n```\n\n### Arguments\n\nde\n\nThe handle to the device entry.\n\
    \nnamelen\n\nThe length of the name is written here. This may be NULL.\n\n## Description\n\
    \nReturns the name on success, else NULL.\n\n## devfs_register_chrdev\n\n### Name\n\
    \ndevfs_register_chrdev — Optionally register a conventional character driver.\n\
    \n### Synopsis\n\n```\nint devfs_register_chrdev (unsigned int major, const char\
    \ * name, struct file_operations * fops);\n```\n\n### Arguments\n\nmajor\n\nThe\
    \ major number for the driver.\n\nname\n\nThe name of the driver (as seen in /proc/devices).\n\
    \nfops\n\nThe &file_operations structure pointer.\n\n## Description\n\nThis function\
    \ will register a character driver provided the “devfs=only” option was not provided\
    \ at boot time. Returns 0 on success, else a negative error code on failure.\n\
    \n## devfs_register_blkdev\n\n### Name\n\ndevfs_register_blkdev — Optionally register\
    \ a conventional block driver.\n\n### Synopsis\n\n```\nint devfs_register_blkdev\
    \ (unsigned int major, const char * name, struct block_device_operations * bdops);\n\
    ```\n\n### Arguments\n\nmajor\n\nThe major number for the driver.\n\nname\n\n\
    The name of the driver (as seen in /proc/devices).\n\nbdops\n\nThe &block_device_operations\
    \ structure pointer.\n\n## Description\n\nThis function will register a block\
    \ driver provided the \"devfs=only\" option was not provided at boot time. Returns\
    \ 0 on success, else a negative error code on failure.\n\n## devfs_unregister_chrdev\n\
    \n### Name\n\ndevfs_unregister_chrdev — Optionally unregister a conventional character\
    \ driver.\n\n### Synopsis\n\n```\nint devfs_unregister_chrdev (unsigned int major,\
    \ const char * name);\n```\n\n### Arguments\n\nmajor\n\nThe major number for the\
    \ driver.\n\nname\n\nThe name of the driver (as seen in /proc/devices).\n\n##\
    \ Description\n\nThis function will unregister a character driver provided the\
    \ \"devfs=only\" option was not provided at boot time. Returns 0 on success, else\
    \ a negative error code on failure.\n\n## devfs_unregister_blkdev\n\n### Name\n\
    \ndevfs_unregister_blkdev — Optionally unregister a conventional block driver.\n\
    \n### Synopsis\n\n```\nint devfs_unregister_blkdev (unsigned int major, const\
    \ char *\nname);\n```\n\n### Arguments\n\nmajor\n\nThe major number for the driver.\n\
    \nname\n\nThe name of the driver (as seen in /proc/devices).\n\n## Description\n\
    \nThis function will unregister a block driver provided the \"devfs=only\" option\
    \ was not\n at boot time. Returns 0 on success, else a negative error code on\
    \ failure.\n\n## Chapter 12. Power Management\n\n## pm_register\n\n### Name\n\n\
    pm_register — register a device with power management\n\n### Synopsis\n\n```\n\
    struct pm_dev * pm_register (pm_dev_t type, unsigned long id,\n      pm_callback\
    \ callback);\n```\n\n### Arguments\n\n- type: device type\n- id: device ID\n-\
    \ callback: callback function\n\n## Description\n\nAdd a device to the list of\
    \ devices that wish to be notified about power management events. A &pm_dev structure\
    \ is returned on success, on failure the return is NULL.\n\nThe callback function\
    \ will be called in process context and it may sleep.\n\n## pm_unregister\n\n\
    ### Name\n\npm_unregister — unregister a device with power management\n\n### Synopsis\n\
    \n```\nvoid pm_unregister (struct pm_dev * dev);\n```\n\n### Arguments\n\ndev\n\
    device to unregister\n\n## Description\n\nRemove a device from the power management\
    \ notification lists. The dev passed must be a handle previously returned by pm_register.\n\
    \n## pm_unregister_all\n\n### Name\n\npm_unregister_all — unregister all devices\
    \ with matching callback\n\n### Synopsis\n\n```\nvoid pm_unregister_all (pm_callback\
    \ callback);\n```\n\n### Arguments\n\n- callback: callback function pointer\n\n\
    ## Description\n\nUnregister every device that would call the callback passed.\
    \ This is primarily meant a helper function for loadable modules. It enables a\
    \ module to give up all its managed devices without keeping its own private list.\n\
    \n## pm_send\n\n### Name\n\npm_send — send request to a single device\n\n### Synopsis\n\
    \n```\nint pm_send (struct pm_dev * dev, pm_request_t rqst, void * data);\n```\n\
    \n### Arguments\n\n- dev: device to send to\n- rqst: power management request\n\
    - data: data for the callback\n\n## Description\n\nIssue a power management request\
    \ to a given device. The PM_SUSPEND and PM_RESUME events are handled specially.\
    \ The data field must hold the intended next state. No call is made if the state\
    \ matches.\n\n## BUGS\n\nwhat stops two power management requests occuring in\
    \ parallel and conflicting.\n\n## WARNING\n\nCalling pm_send directly is not generally\
    \ recommended, in particular there is no locking against the pm_dev going away.\
    \ The caller must maintain all needed locking or have 'inside lustre' on the safety.\
    \ Also remember that this function is not locked against pm_unregister. This means\
    \ that you must handle SMP races on callback execution and unload yourself.\n\n\
    ## pm_send_all\n\n### Name\n\npm_send_all — send request to all managed devices\n\
    \n### Synopsis\n\n```\nint pm_send_all (pm_request_t rqst, void * data);\n```\n\
    \n### Arguments\n\nrqst\n\npower management request\n\ndata\n\ndata for the callback\n\
    \n## Description\n\nIssue a power management request to a all devices. The PM_SUSPEND\
    \ events are handled specially. Any device is permitted to fail a suspend by returning\
    \ a non zero (error) value from its callback function. If any device vetoes a\
    \ suspend request then all other devices that have suspended during the processing\
    \ of this request are restored to their previous state.\n\n## WARNING\n\nThis\
    \ function takes the pm_dev_lock. The lock is not dropped until the callbacks\
    \ have completed. This prevents races against pm locking functions, races against\
    \ module unload pm_unregister code. It does not mean however that you must not\
    \ issue pm_functions with the callback or you will deadlock and users will hate.\n\
    \nZero is returned on success. If a suspend fails then the status from the device\
    \ is returned.\n\n## pm_find\n\n### Name\n\npm_find — find a device\n\n### Synopsis\n\
    \n```\nstruct pm_dev * pm_find (pm_dev_t type, struct pm_dev * from);\n```\n\n\
    ### Arguments\n\ntype\n\ntype of device\n\nfrom\n\nwhere to start\n\n## Description\n\
    \nScan the power management list for devices of a specific type. The return value\
    \ for a device may be passed to further calls to this function. A NULL indicates\
    \ the end of the list.\n\nTo search from the beginning pass NULL as the from value.\n\
    \nThe caller MUST hold the pm_devs_lock when calling this function. The instant\
    \ that the lock is dropped all pointers returned may become invalid.\n\n## Chapter\
    \ 13. Block Devices\n\n## blk_cleanup_queue\n\n### Name\n\nblk_cleanup_queue —\
    \ release a request_queue_t when it is no longer needed\n\n### Synopsis\n\n```\n\
    void blk_cleanup_queue (request_queue_t * q);\n```\n\n### Arguments\n\nq\nthe\
    \ request queue to be released\n\n## Description\n\nblk_cleanup_queue is the pair\
    \ to blk_init_queue. It should be called when a request queue is being released;\
    \ typically when a block device is de-registered. Currently, its primary task\
    \ is to free all struct request structures that were allocated to the queue.\n\
    \n### Caveat\n\nHopefully the low level driver will have finished any requests\
    \ first...\n\n## blk_queue_headactive\n\n### Name\n\nblk_queue_headactive — indicate\
    \ whether head of request queue may be active\n\n### Synopsis\n\n```\nvoid blk_queue_headactive\
    \ (request_queue_t * q, int active);\n```\n\n### Arguments\n\nq\n\nThe queue which\
    \ applies this to.\n\nactive\n\nA flag indication where the head of the queue\
    \ is active.\n\n## Description\n\nThe driver for a block device may choose to\
    \ leave the currently active request on the request queue, removing it only when\
    \ it has completed. The queue handling routines assume this by default for safety\
    \ reasons and will not include the head of the request queue in any merging or\
    \ reordering of requests when the queue is unplugged (and thus may be working\
    \ on this particular request).\n\nIf a driver removes requests from the queue\
    \ before processing them, then it may indicate that the head of the queue is to\
    \ be involved in merging and reordering. This is done by calling blk_queue_headactive\
    \ with an active flag of 0.\n\nIf a driver processes several requests at once,\
    \ it must remove them (or at least all of them) from the request queue.\n"
  mdcn: "\n\n## 参数\n\nmaster\n\nmaster devfs 条目。\n\n## 描述\n\n返回在 master 被注销时将取消注销的从设备（slave）。\n\
    \n## devfs_get_name\n\n### 名字\n\ndevfs_get_name — 获取设备条目在其父目录中的名称。\n\n### 概要\n\
    \n```\nconst char * devfs_get_name (devfs_handle_t de, unsigned int * namelen);\n\
    ```\n\n### 参数\n\nde\n\n设备条目的句柄。\n\nnamelen\n\n名称长度将写入此处。此值可能为 NULL。\n\n## 描述\n\
    \n成功时返回名称，否则返回 NULL。\n\n## devfs_register_chrdev\n\n### 名字\n\ndevfs_register_chrdev\
