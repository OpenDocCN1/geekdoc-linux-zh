    ## Chapter 2. Data Types


    ## 2.1. Doubly Linked Lists


    ### list_add


    #### Name

    list_add — add a new entry


    #### Synopsis

    ```

    void list_add (struct list_head * new, struct list_head * head);

    ```


    #### Arguments

    - * new: new entry to be added

    - head: list head to add it after


    #### Description

    Insert a new entry after the specified head. This is good for implementing stacks.


    ### list_add_tail


    #### Name

    list_add_tail — add a new entry


    #### Synopsis

    ```

    void list_add_tail (struct list_head * new, struct list_head * head);

    ```


    #### Arguments

    - new: new entry to be added

    - head: list head to add it before


    #### Description

    Insert a new entry before the specified head. This is useful for implementing
    queues.


    ### list_del


    #### Name

    list_del — deletes entry from list.


    #### Synopsis

    ```

    void list_del (struct list_head * entry);

    ```


    #### Arguments

    - entry: the element to delete from the list.


    #### Note

    list_empty on entry does not return true after this, the entry is in an undefined
    state.


    ### list_del_init


    #### Name

    list_del_init — deletes entry from list and reinitialize it.


    #### Synopsis

    ```

    void list_del_init (struct list_head * entry);

    ```


    #### Arguments

    - entry: the element to delete from the list.


    ### list_empty


    #### Name

    list_empty — tests whether a list is empty


    #### Synopsis

    ```

    int list_empty (struct list_head * head);

    ```


    #### Arguments

    - head: the list to test.


    ### list_splice


    #### Name

    list_splice — join two lists


    #### Synopsis

    ```

    void list_splice (struct list_head * list, struct list_head * head);

    ```


    #### Arguments

    - list: the new list to add.

    - head: the place to add it in the first list.


    ### list_entry


    #### Name

    list_entry — get the struct for this entry


    #### Synopsis

    ```

    list_entry ( ptr, type, member);

    ```


    #### Arguments

    - * ptr: the &struct list_head pointer.

    - type: the type of the struct this is embedded in.

    - member: the name of the list_struct within the struct.


    ### list_for_each


    #### Name

    list_for_each — iterate over a list


    #### Synopsis

    ```

    list_for_each ( pos, head);

    ```


    #### Arguments

    - pos: the &struct list_head to use as a loop counter.

    - head: the head for your list.


    ### list_for_each_safe


    #### Name

    list_for_each_safe — iterate over a list safe against removal of list entry


    #### Synopsis

    ```

    list_for_each_safe ( pos, n, head);

    ```


    #### Arguments

    - pos: the &struct list_head to use as a loop counter.

    - n: another &struct list_head to use as temporary storage

    - head: the head for your list.


    ## Chapter 3. Basic C Library Functions


    When writing drivers, you cannot in general use routines which are from the C
    Library. Some of the functions have been found generally useful and they are listed
    below. The behaviour of these functions may vary slightly from those defined by
    ANSI, and these deviations are noted in the text.


    ### 3.1. String Conversions


    ### simple_strtol


    #### Name

    simple_strtol — convert a string to a signed long


    #### Synopsis

    ```

    long simple_strtol (const char * cp, char ** endp, unsigned int base);

    ```


    #### Arguments

    - cp: The start of the string

    - endp: A pointer to the end of the parsed string will be placed here

    - base: The number base to use


    ### simple_strtoll


    #### Name

    simple_strtoll — convert a string to a signed long


    #### Synopsis

    ```

    long long simple_strtoll (const char * cp, char ** endp, unsigned int base);

    ```


    #### Arguments

    - cp: The start of the string

    - endp: A pointer to the end of the parsed string will be placed here

    - base: The number base to use


    ### simple_strtoul


    #### Name

    simple_strtoul — convert a string to an unsigned long


    #### Synopsis

    ```

    unsigned long simple_strtoul (const char * cp, char ** endp, unsigned int base);

    ```


    #### Arguments

    - cp: The start of the string

    - endp: A pointer to the end of the parsed string will be placed here

    - base: The number base to use


    ### simple_strtoull


    #### Name

    simple_strtoull — convert a string to an unsigned long


    #### Synopsis

    ```

    unsigned long long simple_strtoull(const char * cp, char ** endp, unsigned int
    base);

    ```


    #### Arguments

    - cp: The start of the string

    - endp: A pointer to the end of the parsed string will be placed here

    - base: The number base to use


    ### vsprintf


    #### Name

    vsnprintf — Format a string and place it in a buffer


    #### Synopsis

    ```

    int vsnprintf(char * buf, size_t size, const char * fmt, va_list args);

    ```


    #### Arguments

    - buf: The buffer to place the result into

    - size: The size of the buffer, including the trailing space

    - fmt: The format string to use

    - args: Arguments for the format string


    #### Description

    Call this function if you are already dealing with va_list. You probably want
    snprintf instead.


    ### snprintf


    #### Name

    snprintf — Format a string and place it in a buffer


    #### Synopsis

    ```

    int snprintf (char * buf, size_t size, const char * fmt, ...);

    ```


    #### Arguments

    - buf: The buffer to place the result into

    - size: The size of the buffer, including the trailing space

    - fmt: The format string to use

    - ...: variable arguments


    ### vsprintf


    #### Name

    vsprintf — Format a string and place it in a buffer


    #### Synopsis

    ```

    int vsprintf (char * buf, const char * fmt, va_list args);

    ```


    #### Arguments

    - buf: The buffer to place the result into

    - fmt: The format string to use

    - args: Arguments for the format string


    #### Description

    Call this function if you are already dealing with va_list. You probably want
    sprintf instead.


    ### sprintf


    #### Name

    sprintf — Format a string and place it in a buffer


    #### Synopsis

    ```

    int sprintf(char * buf, const char * fmt, ...);

    ```


    #### Arguments

    - buf: The buffer to place the result into

    - fmt: The format string to use

    - ...: variable arguments


    ### 3.2. String Manipulation


    ### strcpy


    #### Name

    strcpy — Copy a NUL terminated string


    #### Synopsis

    ```

    char * strcpy (char * dest, const char * src);

    ```


    #### Arguments

    - dest: Where to copy the string to

    - src: Where to copy the string from


    ### strncpy


    #### Name

    strncpy — Copy a length-limited, NUL-terminated string


    #### Synopsis

    ```

    char * strncpy(char * dest, char * src, size_t count);

    ```


    #### Arguments

    - dest: Where to copy the string to

    - src: Where to copy the string from

    - count: The maximum number of bytes to copy


    #### Description

    Note that unlike userspace strncpy, this does not NUL-pad the buffer. However,
    the result is not NUL-terminated if the source exceeds count bytes.


    ### strcat


    #### Name

    strcat — Append one NUL-terminated string to another


    #### Synopsis

    ```

    char * strcat (char * dest, const char * src);

    ```


    #### Arguments

    - dest: The string to be appended to

    - src: The string to append to it


    ### strncat


    #### Name

    strncat — Append a length-limited, NUL-terminated string to another


    #### Synopsis

    ```

    char * strncat (char * dest, char * src, size_t count);

    ```


    #### Arguments

    - dest: The string to be appended to

    - src: The string to append to it

    - count: The maximum number of bytes to copy


    #### Description

    Note that in contrast to strncpy, strcat ensures the result is terminated.


    ### strcmp


    #### Name

    strcmp — Compare two strings


    #### Synopsis

    ```

    int strcmp (const char * cs, const char * ct);

    ```


    #### Arguments

    - cs: One string

    - ct: Another string


    ### strncmp


    #### Name

    strncmp — Compare two length-limited strings


    #### Synopsis

    ```

    int strncmp (const char * cs, const char * ct, size_t count);

