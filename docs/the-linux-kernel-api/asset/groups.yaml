    ## skb_copy_expand


    # Name


    skb_copy_expand — copy and expand sk_buff


    # Synopsis


    ```

    struct sk_buff * skb_copy_expand (const struct sk_buff * skb, int newheadroom,
    int newtailroom, int gfp_mask);

    ```


    # Arguments


    - skb: buffer to copy

    - newheadroom: new free bytes at head

    - newtailroom: new free bytes at tail

    - gfp_mask: allocation priority


    # Description


    Make a copy of both an &sk_buff and its data and while doing so allocate additional
    space.


    This is used when the caller wishes to modify the data and needs a private copy
    of the data to allocate as much space for new fields. Returns NULL on failure
    or the pointer to the buffer on success. The returned buffer has a reference count
    of 1.


    You must pass GFP_ATOMIC as the allocation priority if this function is called
    from an interrupt.


    ## __pskb_pull_tail


    # Name


    __pskb_pull_tail — advance tail of skb header


    # Synopsis


    ```

    unsigned char * __pskb_pull_tail (struct sk_buff * skb, int delta);

    ```


    # Arguments


    - skb: buffer to reallocate

    - delta: number of bytes to advance tail


    # Description


    The function makes a sense only on a fragmented &sk_buff, it expands header moving
    its tail forward and copying necessary data from fragmented part.

    &sk_buff MUST have reference count of 1.


    Returns NULL (and &sk_buff does not change) if pull failed or value of new tail
    of skb in the case of success.


    All the pointers pointing into skb header may change and must be reloaded after
    call to this function.


    ## 7.2. Socket Filter


    ## sk_run_filter


    # Name


    sk_run_filter — run a filter on a socket


    # Synopsis


    ```

    int sk_run_filter (struct sk_buff *skb, struct sock_filter *filter, int flen);

    ```


    # Arguments


    - * skb: buffer to run the filter on

    - * filter: filter to apply

    - * flen: length of filter


    # Description


    Decode and apply filter instructions to the skb->data. Return length to keep,
    0 for none. skb is the data we are filtering, filter is the array of filter instructions,
    and len is the number of filter blocks in the array.


    ## sk_chk_filter


    # Name


    sk_chk_filter — verify socket filter code


    # Synopsis


    ```

    int sk_chk_filter (struct sock_filter * filter, int flen);

    ```


    # Arguments


    - filter: filter to verify

    - flen: length of filter


    # Description


    Check the user''s filter code. If we let some ugly filter code slip through kaboom!
    The filter must contain no references or jumps that are out of range, no illegal
    instructions and no backward jumps. It must end with a RET instruction


    Returns 0 if the rule set is legal or a negative errno code if not.


