    \n一个缓冲区不能同时放在两个列表中。\n\n# __skb_dequeue\n\n# 名称\n\n__skb_dequeue — 从队列头部移除\n\n\
    # 概要\n\n```\nstruct sk_buff * __skb_dequeue (struct sk_buff_head * list);\n```\n\
    \n# 参数\n\n- list: 要出队列的列表\n\n# 描述 \n\n移除列表头部。此函数不获取锁，因此必须在持有相应锁的情况下使用。对于空列表返回\
