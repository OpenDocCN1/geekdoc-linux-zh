    \ 要出队列的列表\n\n# 描述 \n\n移除列表头部。此函数会获取锁，因此可以安全地与其他加锁的列表函数使用。对于空列表返回 NULL。\n\n# skb_insert\n\
    \n# 名称\n\nskb_insert — 插入缓冲区\n\n# 概要\n\n```\nvoid skb_insert (struct sk_buff_head\
    \ * list, struct sk_buff * old, struct sk_buff * newsk);\n```\n\n# 参数\n\n- list:\
    \ 要使用的列表\n- old: 要插入的缓冲区\n- newsk: 要队列的缓冲区\n\n# 描述 \n\n在列表开始处队列缓冲区。此函数不获取锁……等等。\n\
    \n# skb_append\n\n# 名称\n\nskb_append — 追加缓冲区\n\n# 概要\n\n```\nvoid skb_append (struct\
    \ sk_buff_head * list, struct sk_buff * old, struct sk_buff * newsk);\n```\n\n\
    # 参数\n\n- list: 要使用的列表\n- old: 要插入的缓冲区\n- newsk: 要队列的缓冲区\n\n# 描述 \n\n在列表末尾队列缓冲区。此函数会获取列表锁，可以安全地与其他加锁的\
    \ &sk_buff 函数一起使用。\n\n# skb_unlink\n\n# 名称\n\nskb_unlink — 从列表中移除缓冲区\n\n# 概要\n\
    \n```\nvoid skb_unlink (struct sk_buff * skb);\n```\n\n# 参数\n\n- skb: 要移除的缓冲区\n\
    \n# 描述 \n\n在列表开始处队列缓冲区。等等……即使不知道它在哪个列表中也能工作，这在某些时候非常方便。这也意味着当你移除它时，*列表必须存在*。因此，在销毁列表之前，必须移除其内容。\n\
    \n"
