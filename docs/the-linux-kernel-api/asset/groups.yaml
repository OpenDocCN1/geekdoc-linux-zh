    \ struct request 结构。\n\n### 注意\n\n希望底层驱动程序已完成任何请求...\n\n## blk_queue_headactive\n\
    \n### 名字\n\nblk_queue_headactive — 指示请求队列头部可以是活跃的\n\n### 概要\n\n```\nvoid blk_queue_headactive\
    \ (request_queue_t * q, int active);\n```\n\n### 参数\n\nq\n\n应用于此的队列。\n\nactive\n\
    \n队列头部活跃的标志指示。\n\n## 描述\n\n块设备的驱动程序可能选择将当前活跃的请求留在请求队列中，直到它完成后才移除。队列处理程序出于安全考虑默认假设这一点，并在队列拔出（因此可能正在处理此特定请求）时，将请求队列头部包含在任何请求的合并或重排序中。\n\
    \n如果驱动程序在处理之前从请求队列中移除请求，那么它可能指示队列头部参与合并和重排序。这是通过调用 blk_queue_headactive 且活跃标志为\
    \ 0 实现的。\n\n"
