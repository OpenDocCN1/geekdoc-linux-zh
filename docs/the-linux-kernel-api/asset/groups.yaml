    ## 第 1 章 驱动基础


    ## 1.1. 驱动入口与退出点


    ### module_init


    ### 名称

    module_init — 驱动初始化入口点


    ### 概要

    ```

    module_init ( x );

    ```


    ### 参数

    x

    在内核启动时或插入模块时运行的函数


    ### 描述

    如果驱动被检查为“y”或静态，module_init 将将驱动初始化例程序添加到“__initcall.int”段中；否则，它将驱动初始化例程序封装在 init_module
    中，当驱动作为模块使用时，insmod 和 modprobe 会使用该函数。


    ### module_exit


    ### 名称

    module_exit — 驱动退出入口点


    ### 概要

    ```

    module_exit ( x );

    ```


    ### 参数

    x

    在驱动被移除时运行的函数


    ### 描述

    当驱动作为模块且配合 rmod 使用时，module_exit 将驱动清理代码封装在 cleanup_module 中。如果驱动被静态编译到内核中，module_exit
    则不起任何作用。


    ## 1.2. 原子操作与指针操作


    ### atomic_read


    ### 名称

    atomic_read — 读取原子变量


    ### 概要

    ```

    atomic_read ( v );

    ```


    ### 参数

    v

    类型为 atomic_t 的指针


    ### 描述

    原子化地读取 v 的值。请注意，atomic_t 能够保证的有效范围仅为 24 位。


    ### atomic_set


    ### 名称

    atomic_set — 设置原子变量


    ### 概要

    ```

    atomic_set ( v, i);

    ```


    ### 参数

    - * v

    类型为 atomic_t 的指针

    - i

    所需的值


    ### 描述

    原子化地将 v 的设置为 i。请注意，atomic_t 能够保证的有效范围仅为 24 位。


    ### atomic_add


    ### 名称

    atomic_add — 向原子变量相加整数


    ### 概要

    ```

    void atomic_add (int i, atomic_t * v);

    ```


    ### 参数

    - * i

    要加的整数值

    - * v

    类型为 atomic_t 的指针


    ### 描述

    原子化地将 i 加到 v。请注意，atomic_t 能够保证的有效范围仅为 24 位。


    ### atomic_sub


    ### 名称

    atomic_sub — 减去原子变量


    ### 概要

    ```

    void atomic_sub (int i, atomic_t * v);

    ```


    ### 参数

    - * i

    要减的整数值

    - * v

    类型为 atomic_t 的指针


    ### 描述

    原子化地从 v 中减去 i。请注意，atomic_t 能够保证的有效范围仅为 24 位。


    ### atomic_sub_and_test


    ### 名称

    atomic_sub_and_test — 从变量中减去值并测试结果


    ### 概要

    ```

    int atomic_sub_and_test (int i, atomic_t * v);

    ```


    ### 参数

    - * i

    要减的整数值

    - * v

    类型为 atomic_t 的指针


    ### 描述

    原子化地从 v 中减去 i，如果结果为零则返回真，其他所有情况均返回假。请注意，atomic_t 能够保证的有效范围仅为 24 位。


    ### atomic_inc


    ### 名称

    atomic_inc — 原子变量自增


    ### 概要

    ```

    void atomic_inc (atomic_t * v);

    ```


    ### 参数

    v

    类型为 atomic_t 的指针


    ### 描述

    原子化地将 v 增 1。请注意，atomic_t 能够保证的有效范围仅为 24 位。


    ### atomic_dec


    ### 名称

    atomic_dec — 原子变量自减


    ### 概要

    ```

    void atomic_dec (atomic_t * v);

    ```


    ### 参数

    - v

    类型为 atomic_t 的指针


    ### 描述

    原子化地将 v 减 1。请注意，atomic_t 能够保证的有效范围仅为 24 位。


    ### atomic_dec_and_test


    ### 名称

    atomic_dec_and_test — 从变量中减去值并测试结果


    ### 概要

    ```

    int atomic_dec_and_test (atomic_t * v);

    ```


    ### 参数

    v

    类型为 atomic_t 的指针


    ### 描述

    原子化地将 v 减 1，如果结果为零则返回真（此处应为：如果结果为零则返回真，其他所有情况均返回假）。请注意，atomic_t 能够保证的有效范围仅为 24
    位。


    ### atomic_inc_and_test


    ### 名称

    atomic_inc_and_test — 原子变量自增并测试


    ### 概要

    ```

    int atomic_inc_and_test (atomic_t * v);

    ```


    ### 参数

    v

    类型为 atomic_t 的指针


    ### 描述

    原子化地将 v 增 1，如果结果为零则返回真，其他所有情况均返回假。


    ### atomic_add_negative


    ### 名称

    atomic_add_negative — 相加并测试为负


    ### 概要

    ```

    int atomic_add_negative (int i, atomic_t * v);

    ```


    ### 参数

    - * i

    要加的整数值

    - * v

    类型为 atomic_t 的指针


    ### 描述

    原子化地将 i 加到 v，如果结果为负则返回真，结果大于等于零时返回假。请注意，atomic_t 能够保证的有效范围仅为 24 位。


    ### get_unaligned


    ### 名称

    get_unaligned — 从未对齐位置获取值


    ### 概要

    ```

    get_unaligned ( ptr );

    ```


    ### 参数

    ptr

    值指针


    ### 描述

    该宏应用于访问比字节大的未对齐值，例如从未按 u16 对齐的位置获取 u16 值。在某些架构上，未对齐访问的开销很大。


    ### put_unaligned


    ### 名称

    put_unaligned — 将值放入可能未对齐的位置


    ### 概要

    ```

    put_unaligned ( val, ptr);

    ```


    ### 参数

    val

    要存放的值

    ptr

    位置指针


    ### 描述

    该宏应用于将比字节大的值存放在预期的未对齐位置，例如向未按 u16 对齐的位置写入 u16 值。在某些架构上，未对齐访问的开销很大。


    ## 1.3. 延迟、调度和定时器例程


    ### schedule_timeout


    ### 名称

    schedule_timeout — 等待超时


    ### 概要

    ```

    signed long schedule_timeout (signed long timeout);

    ```


    ### 参数

    超时以 jiffies 为单位的超时时间


    ### 描述

    让当前任务睡眠直到通过指定的 jiffies 时间。除非设置了当前任务状态（见 set_current_state），否则该函数将立即返回。


    你可以如下设置任务状态：


    - TASK_UNINTERRUPTIBLE 保证在函数返回之前至少经过了 timeout jiffies。函数返回 0。

    - TASK_INTERRUPTIBLE 如果向当前任务递送信号，函数可能会提前返回。在这种情况下，返回剩余的 jiffies 时间，如果定时器到期则返回
    0。


    当该函数返回时，保证当前任务状态为 TASK_RUNNING。


