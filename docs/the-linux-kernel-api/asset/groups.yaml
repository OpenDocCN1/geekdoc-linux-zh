    struct pci_dev * pci_find_slot (unsigned int bus, unsigned int devfn);

    ```


    # Arguments


    - bus: number of PCI bus on which desired PCI device resides

    - devfn: encodes number of PCI slot in which the desired PCI device resides and
    the logical device number within that slot in case of multi-function devices.


    # Description


    Given a PCI bus and slot/function number, the desired PCI device is located in
    system global list of PCI devices. If the device is found, a pointer to its data
    structure is returned. If no device is found, NULL is returned.


    # pci_find_subsys


    # Name


    pci_find_subsys — begin or continue searching for a PCI device by vendor/subvendor/device/subdevice
    id


    # Synopsis


    ```

    struct pci_dev * pci_find_subsys (unsigned int vendor, unsigned int device, unsigned
    int ss_vendor, unsigned int ss_device, const struct pci_dev * from);

    ```


    # Arguments


    - vendor: PCI vendor id to match, or PCI_ANY_ID to match all vendor ids

    - device: PCI device id to match, or PCI_ANY_ID to match all device ids

    - ss_vendor: PCI subsystem vendor id to match, or PCI_ANY_ID to match all vendor
    ids

    - ss_device: PCI subsystem device id to match, or PCI_ANY_ID to match all device
    ids

    - from: Previous PCI device found in search, or NULL for new search.


    # Description


    Iterates through the list of known PCI devices. If a PCI device is found with
    a matching vendor, device, ss_vendor and ss_device, a pointer to its device structure
    is returned. Otherwise, NULL is returned. A new search is initiated by passing
    NULL to the from argument. Otherwise if from is not NULL, searches continue from
    next device on the global list.


    # pci_find_device


    # Name


    pci_find_device — begin or continue searching for a PCI device by vendor/device
    id


    # Synopsis


    ```

    struct pci_dev * pci_find_device (unsigned int vendor, unsigned int device, const
    struct pci_dev * from);

    ```


    # Arguments


    - vendor: PCI vendor id to match, PCI_ANY_ID to match all vendor ids

    - device: PCI device id to match, PCI_ANY_ID to match all device ids

    - from: Previous PCI device found in search, or NULL for new search.


    # Description


    Iterates through the list of known PCI devices. If a PCI device is found with
    a matching vendor and device, a pointer to its device structure is returned. Otherwise,
    NULL is returned. A new search is initiated by passing NULL to the from argument.
    Otherwise if from is not NULL, searches continue from next device on the global
    list.


    # pci_find_class


    # Name


    pci_find_class — begin or continue searching for a PCI device by class


    # Synopsis


    ```

    struct pci_dev * pci_find_class (unsigned int class, const struct pci_dev * from);

    ```


    # Arguments


    - class: search for a PCI device with class designation

    - from: Previous PCI device found in search, or NULL for new search.


    # Description


    Iterates through the list of known PCI devices. If a PCI device is found with
    a matching `class`, a pointer to its device structure is returned. Otherwise,
    NULL is returned. A new search is initiated by passing NULL to the `from` argument.
    Otherwise if *from* is not NULL, searches continue from next device on the global
    list.


    # pci_find_capability


    # Name


    pci_find_capability — query for devices'' capabilities


    # Synopsis


    ```

    int pci_find_capability (struct pci_dev * dev, int cap);

    ```


    # Arguments


    - dev: PCI device to query

    - cap: capability code


    # Description


    Tell if a device supports a given PCI capability. Returns the address of the requested
    capability structure within the device''s PCI configuration space or 0 in case
    the device does not support it. Possible values for cap:


    - PCI_CAP_ID_PM Power Management

    - PCI_CAP_ID_AGP Accelerated Graphics Port

    - PCI_CAP_ID_VPD Vital Product Data

    - PCI_CAP_ID_SLOTID Slot Identification

    - PCI_CAP_ID_MSI Message Signalled Interrupts

    - PCI_CAP_ID_CHSWP CompactPCI HotSwap


    # pci_find_parent_resource


    # Name


    pci_find_parent_resource — return resource region of parent bus of given region


    # Synopsis


    ```

    struct resource * pci_find_parent_resource (const struct pci_dev dev, struct resource
    * res);

    ```


    # Arguments


    - dev: PCI device structure contains resources to be searched

    - res: child resource record for which parent is sought


    # Description


    For given resource region of given device, return the resource region of parent
    bus the given region is contained in or where it should be allocated from.


    # pci_set_power_state


    # Name


    pci_set_power_state — Set the power state of a PCI device


    # Synopsis


    ```

    int pci_set_power_state (struct pci_dev * dev, int state);

    ```


    # Arguments


    - dev: PCI device to be suspended

    - state: Power state we''re entering


    # Description


    Transition a device to a new power state, using the Power Management Capabilities
    in the device''s config space.


    # RETURN VALUE


    -EINVAL if trying to enter a lower state than we''re already in. 0 if we''re already
    in the requested state. -EIO if device does not support PCI PM. 0 if we can successfully
    change the power state.


