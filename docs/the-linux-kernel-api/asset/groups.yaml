    PCI device whose resources were previously reserved by pci_request_regions


    # Description

    Releases all PCI I/O and memory resources previously reserved by a successful
    call to pci_request_regions. Call this function only after all use of the PCI
    regions has ceased.


    ## pci_request_regions


    # Name

    pci_request_regions — Reserved PCI I/O and memory resources


    # Synopsis

