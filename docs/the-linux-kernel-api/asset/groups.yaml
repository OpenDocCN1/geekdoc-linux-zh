  mdcn: "\n\n# 参数\n\ndev\n\n要激活的网络设备\n\n# 描述\n\n关闭任何同步会话并从头开始。在 PPP 情况下，这意味着与 LCP/IPCP\
    \ 等等协议进行协商，而对于 Cisco HDLC，我们只需要开始发送心跳包（keepalives）。\n\n# sppp_reopen\n\n# 名称\n\
    \nsppp_reopen — 物理链路链路丢失的通知\n\n# 概要\n\n```\nint sppp_reopen (struct net_device\
    \ *dev);\n```\n\n# 参数\n\ndev\n\n丢失链路的设备\n\n# 描述\n\n此函数通知同步协议代码底层链路已失效（例如 X.21\
    \ 上的载波信号丢失）。\n\n我们增加了魔术数字（magic numbers），以确保如果对方没有注意到我们的变化，我们将能够正确地启动新会话。由于电信电路的特性，你会在某一端不断地丢失载波信号。\n\
    \n执行此操作后，我们回到协商阶段。此函数可以在中断上下文中调用。\n\n# sppp_change_mtu\n\n# 名称\n\nsppp_change_mtu\
    \ — 修改链路 MTU\n\n# 概要\n\n```\nint sppp_change_mtu (struct net_device *dev, int\
    \ new_mtu);\n```\n\n# 参数\n\n- dev\n要修改 MTU 的设备\n- new_mtu\n新的 MTU\n\n# 描述\n\n\
    修改链路的 MTU。这只能在链路处于关闭（down）状态时调用。如果链路已开启或 MTU 超出范围，将返回错误。\n\n# sppp_do_ioctl\n\n\
    # 名称\n\nsppp_do_ioctl — ppp/hdlc 的 ioctl 处理器\n\n# 概要\n\n```\nint sppp_do_ioctl\
    \ (struct net_device *dev, struct ifreq *ifr, int cmd);\n```\n\n# 参数\n\ndev\n\n\
    执行 ioctl 的设备\n\nifr\n\n来自用户的接口请求块\n\ncmd\n\n正在执行的命令\n\n# 描述\n\n此函数处理用户可能为了控制 PPP/HDLC\
    \ 链路设置而发出的 ioctl。它同时进行忙碌检查和安全检查。此函数旨在供想要添加自定义 ioctl 的调用者进行封装。\n\n# sppp_attach\n\
    \n# 名称\n\nsppp_attach — 将同步 PPP/HDLC 附加到设备\n\n# 概要\n\n```\nvoid sppp_attach (struct\
    \ ppp_device *pd);\n```\n\n# 参数\n\npd\n\n要初始化的 PPP 设备\n\n# 描述 \n\n这在接口上初始化 PPP/HDLC\
    \ 支持。在调用时，设备元素必须指向该接口所附加的网络设备。该接口尚未尚未注册。\n\n# sppp_detach\n\n# 名称\n\nsppp_detach\
    \ — 从设备中释放 PPP 资源\n\n# 概要\n\n```\nvoid sppp_detach (struct net_device *dev);\n\
    ```\n\n# 参数\n\ndev\n\n要释放的网络设备\n\n# 描述 \n\n停止并释放此接口使用的任何 PPP/HDLC 资源。必须在设备释放之前调用此函数。\n\
    \n## 第 9 章 模块支持\n\n## 9.1. 模块加载\n\n### request_module\n\n### 名称\n\nrequest_module\
    \ — 尝试加载内核模块\n\n### 概要\n\n```\nint request_module (const char *module_name);\n\
    ```\n\n### 参数\n\nmodule_name\n\n模块名称\n\n### 描述\n\n使用用户态模块加载器加载模块。该函数成功时返回零，失败时返回负\
    \ errno 码。注意，模块加载成功并不意味着模块没有因为自身的错误而卸载并退出。调用者必须检查其请求的服务现在是否可用，而不是盲目调用。\n\n如果禁用了模块自动加载支持，则此函数将变为无操作。\n\
    \n# call_usermodehelper\n\n# 名称\n\ncall_usermodehelper — 启动用户态应用程序\n\n# 概要\n\n\
    ```\nint call_usermodehelper (char *path, char **argv, char **envp);\n```\n\n\
    # 参数\n\npath\n\n应用程序的路径\n\nargv\n\nnull 终止的参数列表\n\nenvp\n\nnull 终止的环境列表\n\n# 描述\n\
    \n运行用户空间应用程序。该应用程序异步启动。它作为 keventd 的子进程运行。以全 root 权限运行。keventd 在子进程退出时静默回收它。\n\
    \n必须在进程上下文中调用。成功时返回零，否则返回负错误码。\n\n## 9.2. 模块间支持\n\n# inter_module_register\n\n\
    # 名称\n\ninter_module_register — 注册一组新的模块间数据。\n\n# 概要\n\n```\nvoid inter_module_register\
    \ (const char *im_name, struct module *owner, const void *userdata);\n```\n\n\
    # 参数\n\n- im_name\n用于标识数据的任意字符串，必须唯一\n- owner\n注册数据的模块，始终使用 THIS_MODULE\n- userdata\n\
    指向要注册的任意用户数据的指针\n\n# 描述 \n\n检查 im_name 是否已经注册，如果是，则报错。对于新数据，将其添加到 inter_module_entry\
    \ 列表中。\n\n# inter_module_unregister\n\n# 名称\n\ninter_module_unregister — 取消注册一组模块间数据。\n\
    \n# 概要\n\n```\nvoid inter_module_unregister (const char *im_name);\n```\n\n# 参数\n\
    \nim_name\n用于标识数据的任意字符串，必须唯一\n\n# 描述 \n\n检查 im_name 是否已经注册，如果是，则报错。对于新数据（此处误），将其添加到\
    \ inter_module_entry 列表中。\n\n# inter_module_get\n\n# 名称\n\ninter_module_get —\
    \ 从另一个模块获取数据\n\n# 概要\n\n```\nvoid *inter_module_get (const char *im_name);\n```\n\
    \n# 参数\n\nim_name\n用于标识数据的任意字符串，必须唯一\n\n# 描述 \n\n检查 im_name 是否已经注册，如果是，则报错。对于新数据（此处误），将其添加到\
    \ inter_module_entry 列表中。\n\n# inter_module_get_request\n\n# 名称\n\ninter_module_get_request\
    \ — 请求并获取数据\n\n# 概要\n\n```\nvoid *inter_module_get_request (const char *im_name,\
    \ const void *userdata);\n```\n\n# 参数\n\nim_name\n用于标识数据的任意字符串，必须唯一\nuserdata\n\
    要注册的用户数据的指针\n\n# 描述 \n\n将数据添加到 inter_module_entry 列表中。如果成功，返回 userdata。\n\n# inter_module_put\n\
    \n# 名称\n\ninter_module_put — 从另一个模块释放数据\n\n# 概要\n\n```\nvoid inter_module_put\
    \ (const char *im_name);\n```\n\n# 参数\n\nim_name\n用于标识数据的任意字符串，必须唯一\n\n# 描述 \n\
    \n检查 im_name 是否已经注册，如果是，则报错。对于新数据，将其添加到 inter_module_entry 列表中。\n\n## 第 10 章 硬件接口\n\
    \n## 10.1. 中断处理\n\n### disable_irq_nosync\n\n### 名称\n\ndisable_irq_nosync — 无同步地禁用中断\n\
    \n### 概要\n\n```\nvoid disable_irq_nosync (unsigned int irq);\n```\n\n### 参数\n\n\
    irq\n要禁用的中断\n\n### 描述\n\n禁用选定的中断线。操作是嵌套的。与 disable_irq 不同，此函数不确保现有的中断处理程序实例在返回前完成。\n\
    \n此函数可以在中断上下文中调用。\n\n### disable_irq\n\n# 名称\n\ndisable_irq — 禁用中断并等待完成\n\n# 概要\n\
    \n```\nvoid disable_irq (unsigned int irq);\n```\n\n# 参数\n\nirq\n要禁用的中断\n\n# 描述\n\
    \n禁用选定的中断线。操作是嵌套的。此函数会等待任何挂起的中断处理程序执行完成。如果你在持有资源时调用此函数，而中断处理程序需要该资源，会导致死锁。\n\n\
    此函数可以小心地从中断上下文中调用。\n\n### enable_irq\n\n# 名称\n\nenable_irq — 启用中断的处理\n\n# 概要\n\
    \n```\nvoid enable_irq (unsigned int irq);\n```\n\n# 参数\n\nirq\n要启用的中断\n\n# 描述\n\
    \n撤销调用 disable_irq 的影响。如果这匹配最后一次禁用操作，则重新启用该中断线的处理。\n\n此函数可以在中断上下文中调用。\n\n### probe_irq_mask\n\
    \n# 名称\n\nprobe_irq_mask — 扫描位图的中断线\n\n# 概要\n\n```\nunsigned int probe_irq_mask\
    \ (unsigned long val);\n```\n\n# 参数\n\n```\nval\n要考虑的中断掩码\n```\n\n# 描述\n\n扫描 ISA\
    \ 总线中断线并返回活动中断的位图。然后中断探测逻辑状态恢复到之前的值。\n\n## 10.2. MTRR 处理\n\n# mtrr_add\n\n# 名称\n\
