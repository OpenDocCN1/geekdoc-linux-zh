    ## Chapter 4. Memory Management in Linux


    ## 4.1. The Slab Cache


    ### kmem_cache_create


    Name


    kmem_cache_create — Create a cache.


    Synopsis


    Arguments


    name

    A string which is used in /proc/slabinfo to identify this cache.


    size

    The size of objects to be created in this cache.


    offset

    The offset to use within the page.


    flags

    SLAB flags


    ctor

    A constructor for the objects.


    dtor

    A destructor for the objects.


    # Description


    Returns a ptr to the cache on success, NULL on failure. Cannot be called within
    an int, but can be interrupted. The ctor is run when new pages are allocated by
    the cache and the dtor is run before the pages are handed back. The flags are:


    - SLAB_POISON - Poison the slab with a known known test pattern (a5a5a5a5) to
    catch references to uninitialised memory.

    - SLAB_RED_ZONE - Insert ''Red'' zones around the allocated memory to check for
    buffer overruns.

    - SLAB_NO_REAP - Don''t reap this cache when we''re under memory pressure.

    - SLAB_HWCACHE_ALIGN - Align the objects in this cache to a hardware cacheline.
    This can be beneficial if you''re counting cycles as closely as dave.


    # kmem_cache_shrink


    # Name


    kmem_cache_shrink — Shrink a cache.


    # Synopsis


    ```c

    int kmem_cache_shrink (kmem_cache_t * cachep);

    ```


    # Arguments


    cachep

    The cache to shrink.


    # Description


    Releases many slabs as possible for a cache. To help debugging, a zero exit status
    indicates all slabs were released.


    # kmem_cache_destroy


    # Name


    kmem_cache_destroy — delete a cache


    # Synopsis


    ```c

    int kmem_cache_destroy (kmem_cache_t * cachep);

    ```


    # Arguments


    cachep

    the cache to destroy


    # Description


    Remove a kmem_cache_t object from the slab cache. Returns 0 on success.


    It is expected this function will be called by a module when it is unloaded. This
    will remove the cache completely, and avoid a duplicate cache being allocated
    each time a module is loaded and unloaded, if the module doesn''t have persistent
    in-kernel storage across loads and unloads.


    The caller must guarantee that none will allocate memory from the cache during
    the kmem_cache_destroy.


    # kmem_cache_alloc


    # Name


    kmem_cache_alloc — Allocate an object


    # Synopsis


    ```c

    void * kmem_cache_alloc (kmem_cache_t * cachep, int flags);

    ```


    # Arguments


    cachep

    The cache to allocate from.


    flags

    See kmalloc.


    # Description


    Allocate an object from this cache. The flags are only relevant if the cache has
    available objects.


    # kmalloc


    # Name


    kmalloc — allocate memory


    # Synopsis


    ```c

    void * kmalloc (size_t size, int flags);

    ```


    # Arguments


    size

    how many bytes of memory are required.


    Chapter 4. Memory Management in Linux


    flags

    the type of memory to allocate.


    # Description


    kmalloc is the normal method of allocating memory in the kernel.


    The flags argument may be one of:


    - GFP_USER - Allocate memory on behalf of user. May sleep.

    - GFP_KERNEL - Allocate normal kernel ram. May sleep.

    - GFP_ATOMIC - Allocation will not sleep. Use inside interrupt handlers.


    Additionally, the GFP_DMA flag may be set to indicate the memory must be suitable
    for DMA. This can mean different things on different platforms. For example, on
    i386, it means that the memory must come from the first 16MB.


    # kmem_cache_free


    # Name


    kmem_cache_free — Deallocate an object


    # Synopsis


