    this ethernet device


    # Description


    Fill in the fields of the device structure with ethernet-generic values. Basically
    does everything except registering the device.


    Constructs a new net device, complete with a private data area of size sizeof_priv.
    A 32-byte (not bit) alignment is enforced for this private data area.


