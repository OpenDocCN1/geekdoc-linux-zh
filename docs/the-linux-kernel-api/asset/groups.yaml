    ## dev_add_pack


    # Name


    dev_add_pack — add packet handler


    # Synopsis


    ```

    void dev_add_pack (struct packet_type * pt);

    ```


    ## Arguments


    pt

    packet type declaration


    ## Description


    Add a protocol handler to the networking stack. The passed &packet_type is linked
    to kernel lists and may not be freed until it has been removed from the kernel
    lists.


    ## dev_remove_pack


    # Name


    dev_remove_pack — remove packet handler


    # Synopsis


    ```

    void dev_remove_pack (struct packet_type * pt);

    ```


    ## Arguments


    - pt

    packet type declaration


    ## Description


    Remove a protocol handler that was previously added to the kernel protocol handlers
    by dev_add_pack. The passed &packet_type is removed from the kernel lists and
    can be freed or reused once this function returns.


    ## __dev_get_by_name


    # Name


    __dev_get_by_name — find a device by its name


    # Synopsis


    ```

    struct net_device * __dev_get_by_name (const char * name);

    ```


    ## Arguments


    name

    to find


    ## Description


    Find an interface by name. Must be called under RTNL semaphore or dev_base_lock.
    If the name is found a pointer to the device is returned. If the name is not found
    then NULL is returned. The reference counters are not incremented so the caller
    must be careful with locks.


    ## dev_get_by_name


    # Name


    dev_get_by_name — find a device by its name


    # Synopsis


    ```

    struct net_device * dev_get_by_name (const char * name);

    ```


    ## Arguments


    name

    name to find


    ## Description


    Find an interface by name. This can be called from any context and does its own
    locking. The returned handle has the usage count incremented and the caller must
    use dev_put to release it when it is no longer needed. NULL is returned if no
    matching device is found.


    ## dev_get


    # Name


    dev_get — test if a device exists


    # Synopsis


    ```

    int dev_get (const char * name);

    ```


    ## Arguments


    name

    name to test for


    ## Description


    Test if a name exists. Returns true if the name is found. In order to be sure
    the name is not allocated or removed during the test caller must hold the rtnl
    semaphore.

    This function primarily exists for back compatibility with older drivers.


    ## __dev_get_by_index


    # Name


    __dev_get_by_index — find a device by its ifindex


    # Synopsis


    ```

    struct net_device * __dev_get_by_index(int ifindex);

    ```


    ## Arguments


    ifindex

    index of device


    ## Description


    Search for an interface by index. Returns NULL if the device is not found or a
    pointer to the device. The device has not had its reference counter increased
    so the caller must be careful about locking. The caller must hold the RTNL semaphore
    or `dev_base_lock`.


    ## dev_get_by_index


    # Name


    `dev_get_by_index` — find a device by its ifindex


    # Synopsis


    ```

    struct net_device * dev_get_by_index (int ifindex);

    ```


    ## Arguments


    ifindex

    index of device


    ## Description


    Search for an interface by index. Returns NULL if the device is not found or a
    pointer to the device. The device returned has had a reference added and the pointer
    is safe until the user calls dev_put to indicate they have finished with it.


    ## dev_alloc_name


    # Name


    dev_alloc_name — allocate a name for a device


    # Synopsis


    ```

    int dev_alloc_name (struct net_device * dev, const char * name);

    ```


    ## Arguments


    - dev

    device

    - name

    name format string


    ## Description


    Passed a format string - eg "%s" it will try and find a suitable id. Not efficient
    for many devices, not called a lot. The caller must hold the dev_base or rtl lock
    while allocating the name and adding the device in order to avoid duplicates.
    Returns the number of the unit assigned or a negative errno code.


    ## dev_alloc


    # Name


    dev_alloc — allocate a network device and name


    # Synopsis


    ```

    struct net_device * dev_alloc (const char * name, int * err);

    ```


    ## Arguments


    name

    name format string


    err

    error return pointer


    ## Description


    Passed format string, eg. "ltd", it will allocate a network device and space for
    the name. NULL returned if no memory is available. If the allocation succeeds
    the name is assigned and the device pointer returned. NULL is returned if the
    name allocation failed. The cause of an error is returned as a negative errno
    code in the variable err points to.


    The caller must hold the dev_base or RTNL locks when doing this in order to avoid
    duplicate name allocations.


    ## netdev_state_change


    # Name


    netdev_state_change — device changes state


    # Synopsis


    ```

    void netdev_state_change (struct net_device * dev);

    ```


    ## Arguments


    dev

    device to cause notification


    ## Description


    Called to indicate a device has changed state. This function calls the notifier
    chains for netdev_chain and sends a NEWLINK message to the routing socket.


    ## dev_load


    # Name


    dev_load — load a network module


    # Synopsis


    ```

    void dev_load (const char * name);

    ```


    ## Arguments


    name

    name of interface


    ## Description


    If a network interface is not present and the process has suitable privileges
    this function loads the module. If module loading is not available in this kernel
    then it becomes a nop.


    ## dev_open


    # Name


    dev_open — prepare an interface for use.


    # Synopsis


    ```

    int dev_open (struct net_device * dev);

    ```


    ## Arguments


    dev

    device to open


    ## Description


    Takes a device from down to up state. The device''s private open function is invoked
    and then the multicast lists are loaded. Finally the device is moved into the
    up state and a NETDEV_UP message is sent to the netdev notifier chain.


    Calling this function on an active interface is a nop. On a failure a negative
    errno is returned.


    ## dev_close


    # Name


    dev_close — shutdown an interface.


    # Synopsis


    ```

    int dev_close (struct net_device * dev);

    ```


    ## Arguments


    dev

    device to shutdown


    ## Description


    This function moves an active device into down state. A NETDEV_GOING_DOWN is sent
    to the netdev notifier chain. The device is then deactivated and finally a NETDEV_DOWN
    is sent to the notifier chain.


