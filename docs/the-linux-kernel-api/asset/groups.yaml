    ## Chapter 1. Driver Basics


    ## 1.1. Driver Entry and Exit points


    ### module_init


    ### Name

    module_init — driver initialization entry point


    ### Synopsis

    ```

    module_init ( x );

    ```


    ### Arguments

    x

    function to be run at kernel boot time or module insertion


    ### Description

    module_init will add the driver initialization routine in the “__initcall.int”
    segment if the driver is checked as “y” or static, or else it will wrap the driver
    initialization routine with init_module which is used by insmod and modprobe when
    the driver is used as a module.


    ### module_exit


    ### Name

    module_exit — driver exit entry point


    ### Synopsis

    ```

    module_exit ( x );

    ```


    ### Arguments

    x

    function to be run when driver is removed


    ### Description

    module_exit will wrap the driver clean-up code with cleanup_module when used with
    rmod when the driver is a module. If the driver is statically compiled into the
    kernel, module_exit has no effect.


    ## 1.2. Atomic and pointer manipulation


    ### atomic_read


    ### Name

    atomic_read — read atomic variable


    ### Synopsis

    ```

    atomic_read ( v );

    ```


    ### Arguments

    v

    pointer of type atomic_t


    ### Description

    Atomically reads the value of v. Note that the guaranteed useful range of an atomic_t
    is only 24 bits.


    ### atomic_set


    ### Name

    atomic_set — set atomic variable


    ### Synopsis

    ```

    atomic_set ( v, i);

    ```


    ### Arguments

    - * v

    pointer of type atomic_t

    - i

    required value


    ### Description

    Atomically sets the value of v to i. Note that the guaranteed useful range of
    atomic_t is only 24 bits.


    ### atomic_add


    ### Name

    atomic_add — add integer to atomic variable


    ### Synopsis

    ```

    void atomic_add (int i, atomic_t * v);

    ```


    ### Arguments

    - * i

    integer value to add

    - * v

    pointer of type atomic_t


    ### Description

    Atomically adds i to v. Note that the guaranteed useful range of an atomic_t is
    only 24 bits.


    ### atomic_sub


    ### Name

    atomic_sub — subtract the atomic variable


    ### Synopsis

    ```

    void atomic_sub (int i, atomic_t * v);

    ```


    ### Arguments

    - * i

    integer value to subtract

    - * v

    pointer of type atomic_t


    ### Description

    Atomically subtracts i from v. Note that the guaranteed useful range of an atomic_t
    is only 24 bits.


    ### atomic_sub_and_test


    ### Name

    atomic_sub_and_test — subtract value from variable and test result


    ### Synopsis

    ```

    int atomic_sub_and_test (int i, atomic_t * v);

    ```


    ### Arguments

    - * i

    integer value to subtract

    - * v

    pointer of type atomic_t


    ### Description

    Atomically subtracts i from v and returns true if the result is zero, or false
    for all other cases. Note that the guaranteed useful range of atomic_t is only
    24 bits.


    ### atomic_inc


    ### Name

    atomic_inc — increment atomic variable


    ### Synopsis

    ```

    void atomic_inc (atomic_t * v);

    ```


    ### Arguments

    v

    pointer of type atomic_t


    ### Description

    Atomically increments v by 1. Note that the guaranteed useful range of atomic_t
    is only 24 bits.


    ### atomic_dec


    ### Name

    atomic_dec — decrement atomic variable


    ### Synopsis

    ```

    void atomic_dec (atomic_t * v);

    ```


    ### Arguments

    - - v

    pointer of type atomic_t


    ### Description

    Atomically decrements v by 1. Note that the guaranteed useful range of atomic_t
    is only 24 bits.


    ### atomic_dec_and_test


    ### Name

    atomic_dec_and_test — decrement and test


    ### Synopsis

    ```

    int atomic_dec_and_test (atomic_t * v);

    ```


    ### Arguments

    v

    pointer of type atomic_t


    ### Description

    Atomically decrements v by 1 and returns true if the result is 0, or false for
    all other cases. Note that the guaranteed useful range of atomic_t is only 24
    bits.


    ### atomic_inc_inc_and_test


    ### Name

    atomic_inc_inc_and_test — increment and test


    ### Synopsis

    ```

    int atomic_inc_inc_and_test (atomic_t * v);

    ```


    ### Arguments

    v

    pointer of type atomic_t


    ### Description

    Atomically increments v by 1 and returns true if the result is zero, or false
    for all other cases. Note that the guaranteed useful range of atomic_t is only
    24 bits.


    ### atomic_add_negative


    ### Name

    atomic_add_negative — add and test if negative


    ### Synopsis

    ```

    int atomic_add_negative (int i, atomic_t * v);

    ```


    ### Arguments

    - * i

    integer value to add

    - * v

    pointer of type atomic_t


    ### Description

    Atomically adds i to v and returns true if the result is negative, or false when
    result is greater than or equal to zero. Note that the guaranteed useful range
    of atomic_t is only 24 bits.


    ### get_unaligned


    ### Name

    get_unaligned — get value from mis-aligned location


    ### Synopsis

    ```

    get_unaligned ( ptr );

    ```


    ### Arguments

    ptr

    pointer to value


    ### Description

    This macro should be used for accessing values larger in size than single bytes
    by locations that should be expected to be improperly aligned, e.g. retrieving
    a u16 value from a location not u16-aligned. Note that unaligned accesses can
    be very expensive on some architectures.


    ### put_unaligned


    ### Name

    put_unaligned — put value to a possibly-aligned location


    ### Synopsis

    ```

    put_unaligned ( val, ptr);

    ```


    ### Arguments

    val

    value to place

    ptr

    pointer to location


    ### Description

    This macro should be used for placing values larger in size than single bytes
    at locations that are expected to be improperly aligned, e.g. writing a u16 value
    to a location not u16-aligned. Note that unaligned accesses can be very expensive
    on some architectures.


    ## 1.3. Delaying, scheduling, and timer routines


    ### schedule_timeout


    ### Name

    schedule_timeout — sleep until timeout


    ### Synopsis

    ```

    signed long schedule_timeout (signed long timeout);

    ```


    ### Arguments

    timeout

    timeout value in jiffies


    ### Description

    Make the current task sleep until timeout jiffies have elapsed. The routine will
    return immediately unless the current task state has been set (see set_current_state).


    You can set the task state as follows -


    - TASK_UNINTERRUPTIBLE - at least timeout jiffies are guaranteed to pass before
    the routine returns. The routine will return 0

    - TASK_INTERRUPTIBLE - the routine may return early if a signal is delivered to
    the current task. In this case the remaining time in jiffies will be returned,
    or 0 if the timer expired in time


    The current task state is guaranteed to be TASK_RUNNING when this routine returns.

