    ## Chapter 13. Block Devices


    When a queue is plugged the head will be assumed to be inactive.


    ### blk_queue_make_request


    # Name

    blk_queue_make_request — define an alternate make_request function for a device


    # Synopsis

    ```

    void blk_queue_make_request (request_queue_t * q, make_request_fn * mfn);

    ```


    # Arguments

    - q: the request queue for the device to be affected

    - mfn: the alternate make_request function


    # Description

    The normal way for &buffer_heads to be passed to a device driver is for them to
    be collected into requests request queue, and to allow the device driver to select
    requests off that queue when it is ready. This works for many block devices. However
    some block devices (typically virtual devices such as md or lvm) do not benefit
    from the processing on the request queue, and are served best by having the requests
    passed directly to them. This can be achieved by providing a function to blk_queue_make_request.


    # Caveat

    The driver that does this *must* be able to deal appropriately with buffers in
    "highmemory", either by calling bh_kmap to get a kernel mapping, or by calling
    create_bounce to create a buffer in normal memory.


    ### blk_init_queue


    # Name

    blk_init_queue — prepare a request queue for use with a block device


    # Synopsis

    ```

    void blk_init_queue (request_queue_t * q, request_fn_proc * rfn);

    ```


    # Arguments

    - q: The &request_queue_t to be initialised

    - rfn: The function to be called to process requests that have been placed on
    the queue.


    # Description

    If a block device wishes to use the standard request handling procedures, which
    sorts requests and coalesces adjacent requests, then it must call `blk_init_queue`.
    The function `rfn` will be called when there are requests on the queue that need
    to be processed. If the device supports plugging, then `rfn` may not be called
    immediately when requests are available on the queue, but may be called at some
    time later instead. Plugged devices are generally unplugged when a buffer belonging
    to one of the requests on the queue is needed, or due to memory pressure.


    `rfn` is not required, or even expected, to remove all requests off the queue,
    but only as many as it can handle at a time. If it does leave requests on the
    queue, it is responsible for arranging that the requests get dealt with eventually.


    A global spin lock `io_request_lock` must be held while manipulating the requests
    on the queue.


    The request on the head of the queue is by default assumed to be potentially active,
    and it is not considered for re-ordering or merging whenever the generic queue
    is unplugged. This behaviour can be changed with `blk_queue_headactive`.


    # Note

    `blk_init_queue` must be paired with a `blk_cleanup_queue` call when the block
    device is deactivated (such as at module unload).


    ### generic_make_request


    # Name

    generic_make_request —


    # Synopsis

    ```

    void generic_make_request (int rw, struct buffer_head * bh);

    ```


    # Arguments

    - rw: READ, WRITE, or READA - what sort of I/O is desired.

    - bh: The buffer head describing the location in memory and on the device.


    # Description

    generic_make_request is used to make I/O requests of block devices. It is passed
    a &struct buffer_head and a &rw value. The READ and WRITE options are (hopefully)
    obvious in meaning. The READ value means a read is required, but the driver is
    free to fail the request if, for example, it cannot get resources immediately.
    generic_make_request does not return any status. The success/failure status of
    the request, along with notification of completion, is delivered asynchronously
    through the bh->b_end_io function described (one day) elsewhere.


    The caller of generic_make_request must make sure that b_page, b_addr, b_size
    are set to describe the memory buffer, that b_dev and b_rsector are set to describe
    the device address, and the b_end_io and optionally b_private are set to describe
    how completion notification should be signaled. BH_Mapped should also be set (to
    confirm that b_dev and b_blocknr request).


    generic_make_request and the drivers it calls use b_reqnext, and may change b_dev
    and b_rsector. The values of these fields should NOT be depended after the call
    to generic_make_request. Because of this, the caller should record the device
    address information in b_dev and b_blocknr above, no other fields, and in particular,
    no other flags, are changed by generic_make_request or any lower level drivers.


    Apart from those fields mentioned above, no other fields, and in particular, no
    other flags, are changed by generic_make_request or any lower level drivers.


    ### submit_bh


    # Name

    submit_bh —


    # Synopsis

    ```

    void submit_bh (int rw, struct buffer_head * bh);

    ```


    # Arguments

    - rw: whether to READ or WRITE, or maybe to READA (read ahead)

    - bh: The &struct buffer_head which describes the I/O


    # Description

    submit_bh is very similar in purpose to generic_make_request, and uses that function
    to do most of the work.


    The extra functionality provided by submit_bh is to determine b_rsector from b_blocknr
    and b_size, and to set b_rdev from b_dev. This is appropriate for IO requests
    that come from the buffer cache and page cache which (currently) always use aligned
    blocks.


    ### ll_rw_block


    # Name

    ll_rw_block — level access to block devices


    # Synopsis

    ```

    void ll_rw_block (int rw, int nr, struct buffer_head * * bhs);

    ```


    # Arguments

    - rw: whether to READ or WRITE or maybe READA (readahead)

    - nr: number of &struct buffer_heads in the array

    - bhs: array of pointers to &struct buffer_head


    # Description

    ll_rw_block takes an array of pointers to a WRITE or requests an I/O operation
    on, either a READ or a WRITE. The third READA option is described in the documentation
    for generic_make_request which ll_rw_block calls.


    This function provides extra functionality that is not in generic_make_request
    that is relevant to buffers in the buffer cache or page cache. In particular it
    drops any buffer that it cannot get a lock (with the BH_Lock state bit)


    ll_rw_block sets b_end_io to simple completion handler that marks the buffer up-to-date
    (if appropriate), unlocks the buffer and wakes waiters. As client that needs a
    more interesting routine should call submit_bh (or generic_make_request) directly.


    ### end_request_first


    # Name

    end_request_first — end I/O on one buffer


    # Synopsis

    ```

    int end_request_first (struct request * req, int uptate, char * name);

    ```


    # Arguments

    - req: the request being processed

    - uptate: 0 for I/O error


    # Description

    Ends I/O on the first buffer attached to `req`, and sets it up for the next buffer
    (if any) in the cluster.


    # Return

    0 - we are done with this request, call `end_request_last`

    1 - still buffers pending for this request


    # Caveat

    the name printed for I/O error


    ## Chapter 14. Miscellaneous Devices


    ### misc_register


    # Name

    misc_register — register a miscellaneous device


    # Synopsis

    ```

    int misc_register (struct miscdevice * misc);

    ```


    # Arguments

    misc: device structure


    # Description

    Register a miscellaneous device with the kernel. If the minor number is set to
    MISC_DYNAMIC_MINOR a minor number is assigned and placed in the minor field of
    the structure. For other cases the minor number requested is used.


    The structure passed is linked into the kernel and may not be destroyed until
    it has been unregistered.


    A zero is returned on success and a negative errno code for failure.


    ### misc_deregister


    # Name

    misc_deregister — unregister a miscellaneous device


    # Synopsis

    ```

    int misc_deregister (struct miscdevice * misc);

    ```


    # Arguments

    misc: device to unregister


    # Description

    Unregister a miscellaneous device that was previously registered with misc_register.
    Success is indicated by a zero return, a negative errno code indicates an error.


    ## Chapter 15. Video4Linux


    ### video_unregister_device


    # Name

    video_unregister_device — unregister a video4linux device


    # Synopsis

    ```

    void video_unregister_device (struct video_device * vfd);

    ```


    # Arguments

    vfd: the device to unregister


    # Description

    This unregisters the passed device and deassigns the minor number. Future open
    calls will be met with errors.

