    An arbitrary pointer which will be associated with the entry.


    # Description

    Returns 0 on success, else a negative error code is returned.


    ## devfs_mk_dir


    # Name

    devfs_mk_dir — Create a directory in the devfs namespace.


    # Synopsis


    ```

    devfs_handle_t devfs_mk_dir (devfs_handle_t dir, const char * name, void * info);

    ```


    # Arguments


    dir

    The handle to the parent devfs directory entry. If this is NULL the new name is
    relative to the root of the devfs.


    name

    The name of the entry.


    info

    An arbitrary pointer which will be associated with the entry.


    # Description

    Use of this function is optional. The devfs_register function will automatically
    create intermediate directories as needed. This function is provided for efficiency
    reasons, as it provides a handle to a directory. Returns a handle which may later
    be used in a call to devfs_unregister. On failure NULL is returned.


    ## devfs_find_handle


    # Name

    devfs_find_handle — Find the handle of a devfs entry.


    # Synopsis


    ```

    devfs_handle_t devfs_find_handle (devfs_handle_t dir, const char * name, unsigned
    int major, unsigned int minor, char type, int traverse_symlinks);

    ```


    # Arguments


    dir

    The handle to the parent devfs directory entry. If this is NULL the name is relative
    to the root of the devfs.


    name

    The name of the entry.


    major

    The major number. This is used if name is NULL.


    minor

    The minor number. This is used if name is NULL.


    type

    The type of special file to search for. This may be DEVFS_SPECIAL_CHR or DEVFS_SPECIAL_BLK.


    traverse_symlinks

    If TRUE then symlink entries in the devfs namespace are traversed. Symlinks pointing
    out of the devfs namespace will cause a failure. Symlink traversal consumes stack
    space.


    # Description

    Returns a handle which may later be used in a call to devfs_unregister, devfs_get_flags,
    or devfs_set_flags. On failure NULL is returned.


