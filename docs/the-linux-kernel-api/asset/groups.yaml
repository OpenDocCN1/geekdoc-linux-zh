    void kmem_cache_free (kmem_cache_t * cache, void * objp);

    ```


    # Arguments


    cachep

    the cache the allocation was from.


    objp

    the previously allocated object.


    # Description


    Free an object from this cache.


    # kfree


    # Name


    kfree — free an object


