    ```


    #### 参数

    - dest: 复制的目标位置

    - src: 源字符串


    ### strncpy


    #### 名称

    strncpy — 复制长度限制的终止字符串


    #### 概要

    ```

    char * strncpy(char * dest, char * src, size_t count);

    ```


    #### 参数

    - dest: 复制的目标位置

    - src: 源字符串

    - count: 最大复制字节数


    #### 描述

    注意，与用户态的 strncpy 不同，这不会对缓冲区进行空填充。然而，如果源超过 count 字节，则结果是不终止的。


