    ## Chapter 9. Module Support


    ## 9.1. Module Loading


    ### request_module


    ### Name


    request_module — try to load a kernel module


    ### Synopsis


    ```

    int request_module (const char *module_name);

    ```


    ### Arguments


    module_name


    Name of module


    ### Description


    Load a module using the user mode module loader. The function returns zero on
    success or a negative errno code on failure. Note that a successful module load
    does not mean the module did not unload and exit on an error of its own. Callers
    must check that the service they requested is now available and not blindly invoke
    it.


    If module auto-loading support is disabled then this function becomes a no-operation.


    # call_usermodehelper


    # Name


    call_usermodehelper — start a usermode application


    # Synopsis


    ```

    int call_usermodehelper (char *path, char **argv, char **envp);

    ```


    # Arguments


    path


    pathname for the application


    argv


    null-terminated argument list


    envp


    null-terminated environment list


    # Description


    Runs a user-space application. The application is started asynchronously. It runs
    as a child of keventd. It runs with full root capabilities. keventd silently reaps
    the child when it exits.


    Must be called from process context. Returns zero on success, else a negative
    error code.


