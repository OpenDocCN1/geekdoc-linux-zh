    ## pci_disable_device


    # Name

    pci_disable_device — Disable PCI device after use


    # Synopsis

    ```

    void pci_disable_device (struct pci_dev * dev);

    ```


    # Arguments

    dev

    PCI device to be disabled


    # Description

    Signal to the system that the PCI device is not in use by the system anymore.
    This only involves disabling PCI bus-mastering, if active.


    ## pci_enable_wake


    # Name

    pci_enable_wake — enable device to generate PME# when suspended


    # Synopsis

    ```

    int pci_enable_wake (struct pci_dev * dev, u32 state, int enable);

    ```


    # Arguments

    - dev: PCI device to operate on

    - state: Current state of device.

    - enable: Flag to enable or disable generation


    # Description

    Set the bits in the device''s PM Capabilities to generate PME# when the system
    is suspended.


    -EIO is returned if device doesn''t have PM Capabilities. -EINVAL is returned
    if device supports it, but can''t generate wake events. 0 if operation is successful.


