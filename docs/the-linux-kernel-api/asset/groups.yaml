    ## register_filesystem


    register_filesystem


    ### Name


    register_filesystem — register a new filesystem


    ### Synopsis


    ```

    int register_filesystem (struct file_system_type * fs);

    ```


    ### Arguments


    fs


    the file system structure


    ### Description


    Adds the file system passed to the list of file systems the kernel is aware of
    for mount and Returns 0 on success, or a negative errno code on an error.


    The `struct file_system_type` that is passed is linked into the kernel structures
    and must not be freed until the file system has been unregistered.


    ## unregister_filesystem


    ### Name


    unregister_filesystem — unregister a file system


    ### Synopsis


    ```

    int unregister_filesystem (struct file_system_type * fs);

    ```


    ### Arguments


    fs


    filesystem to unregister


    ### Description


    Remove a file system that was previously successfully registered with the kernel.
    An error is returned if the file system is not found. Zero is returned on a success.


    Once this function has returned the `struct file_system_type` structure may be
    freed or reused.


