    ## init_etherdev


    # Name


    init_etherdev — Register ethernet device


    # Synopsis


    ```

    struct net_device * init_etherdev (struct net_device * dev, int sizeof_priv);

    ```


    # Arguments


    - dev: An ethernet device structure to be filled in, or NULL if a new struct should
    be allocated.

    - sizeof_priv: Size of additional driver-private structure to be allocated for
    this ethernet device


    # Description


    Fill in the fields of the device structure with ethernet-generic values.


    If no device structure is passed, a new one is constructed, complete with a private
    data area of size sizeof_priv. A 32-byte (not bit) alignment is enforced for this
    private data area.


    If an empty string is passed as dev->name, or a new structure is made, a new name
    string is constructed.


