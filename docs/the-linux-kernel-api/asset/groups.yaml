    ### blk_queue_make_request


    # 名称

    blk_queue_make_request — 为设备定义备选的 make_request 函数


    # 概要

    ```

    void blk_queue_make_request (request_queue_t * q, make_request_fn * mfn);

    ```


    # 参数

    - q: 受影响的设备请求队列

    - mfn: 备选的 make_request 函数


    # 描述

    将 &buffer_heads 传递给设备驱动程序的常规方法是将它们收集到请求队列中，并允许设备驱动程序在准备就绪时从该队列中选择请求。这对于许多块设备都是有效的。然而，某些块设备（通常是如
    md 或 lvm 等虚拟设备）并不能从请求队列的处理中获益，通过直接将请求传递给它们来提供服务效果更好。这可以通过向 blk_queue_make_request
    提供一个函数来实现。


    # 注意事项

    执行此操作的驱动程序*必须*能够适当地处理“高内存”（highmemory）中的缓冲区，方法可以是调用 bh_kmap 获取内核映射，或者通过调用 create_bounce
    在普通内存中创建缓冲区。


    ### blk_init_queue


    # 名称

    blk_init_queue — 为块设备准备使用的请求队列


    # 概要

    ```

    void blk_init_queue (request_queue_t * q, request_fn_proc * rfn);

    ```


    # 参数

    - q: 需要初始化的 &request_queue_t

    - rfn: 调用以处理已放入队列的请求的函数。


    # 描述

    如果块设备希望使用标准的请求处理程序（该程序会对请求排序并合并相邻请求），则它必须调用 `blk_init_queue`。当队列上有需要处理的请求时，将调用函数
    `rfn`。如果设备支持插入（plugging），当队列中有可用请求时，`rfn` 可能不会立即调用，而可能在稍后的某个时间被调用。当需要队列中某个请求的缓冲区，或由于内存压力时，已插入的设备通常会被拔出（unplugged）。


    `rfn` 并不要求也不被期望移除队列上的所有请求，而只需移除它一次能处理的请求。如果它在队列中留下了请求，则它负责安排这些请求最终被处理。


    在操作队列上的请求时，必须持有全局自旋锁 `io_request_lock`。


    队列头部请求默认被假设为可能活跃，每当通用队列被拔出时，它都不会被考虑重新排序或合并。这种行为可以通过 `blk_queue_headactive` 进行更改。


    # 注意

    当块设备被禁用时（例如在模块卸载时），`blk_init_queue` 必须与 `blk_cleanup_queue` 调用配对。


    ### generic_make_request


    # 名称

    generic_make_request —


    # 概要

    ```

    void generic_make_request (int rw, struct buffer_head * bh);

    ```


    # 参数

    - rw: READ, WRITE 或 READA - 所需的 I/O 类型。

    - bh: 描述内存和设备上位置的缓冲区头（buffer head）。


    # 描述

    generic_make_request 用于向块设备发出 I/O 请求。它接收一个 &struct buffer_head 和一个 &rw 值。READ
    和 WRITE 选项的含义（很显然）是易懂的。READ 值意味着需要读取，但如果驱动程序无法立即获取资源，可以自由地让请求失败。generic_make_request
    不返回任何状态。请求的成功/失败状态以及完成通知将通过在（别处）描述的 bh->b_end_io 函数异步交付。


    调用 generic_make_request 的调用者必须确保 b_page、b_addr、b_size 已设置以描述内存缓冲区，b_dev 和 b_rsector
    已设置以描述设备地址，并且 b_end_io 和可选的 b_private 已描述如何发出完成通知。还应该设置 BH_Mapped（以确认 b_dev 和
    b_blocknr 请求）。


    generic_make_request 及其调用的驱动程序使用 b_reqnext，并可能会更改 b_dev 和 b_rsector。在调用 generic_make_request
    之后，**不应**依赖这些字段的值。由于此原因，调用者应该在调用 generic_make_request 之前在 b_dev 和 b_blocknr 中记录设备地址信息，而不应记录其他字段，特别是
    generic_make_request 或任何低层驱动程序都不会更改其他标志位。


    除了上述字段外，generic_make_request 或任何低层驱动程序都不会更改其他字段，特别是其他其他标志位。


    ### submit_bh


    # 名称

    submit_bh —


    # 概要

    ```

    void submit_bh (int rw, struct buffer_head * bh);

    ```


    # 参数

    - rw: 是否 READ 还是 WRITE，或者可能是 READA（预读）

    - bh: 描述 I/O 的 &struct buffer_head


    # 描述

    submit_bh 的目的与 generic_make_request 非常相似，并使用该函数来完成大部分工作。


    submit_bh 提供的额外功能是根据 b_blocknr 和 b_size 确定 b_rsector，并从 b_dev 设置 b_rdev。这对于来自缓冲区缓存和页缓存的
    I/O 请求是合适的，因为这些请求（目前）始终使用对齐的块。


    ### ll_rw_block


    # 名称

    ll_rw_block — 块设备的访问


    # 概要

    ```

    void ll_rw_block (int rw, int nr, struct buffer_head * bhs);

    ```


    # 参数

    - rw: 是否 READ 还是 WRITE，或者可能是 READA（预读）

    - nr: &struct buffer_head 的数量

    - bhs: &struct buffer_head 指针数组


    # 描述

    ll_rw_block 接收 &struct buffer_head 指针数组并执行 I/O 操作。这对于来自缓冲区缓存和页缓存的 I/O 请求是合适的，因为这些请求（目前）始终使用对齐的块。


    该函数提供了 generic_make_request 不具备的额外功能。它标记 b_end_io 为有效（如果适用），解锁缓冲区并唤醒等待者。需要更感兴趣例的客户端应直接调用
    submit_bh（或 generic_make_request）。


    ### end_request_first


    # 名称

    end_request_first — 完成缓冲区的 I/O


    # 概要

    ```

    int end_request_first (struct request * req, int uptate, char * name);

    ```


    # 参数

    - req: 正在处理的请求

    - uptate: 0 表示 I/O 错误


    # 描述

    完成 `req` 上的第一个缓冲区的 I/O，并为簇中的下一个缓冲区做好准备。


    # 返回

    0 - 我们已完成此请求，调用 `end_request_last`

    1 - 此请求仍有挂起的缓冲区


    # 注意事项

    用于 I/O 错误的名称


    ## 第14章 杂项设备


    ### misc_register


    # 名称

    misc_register — 注册杂项设备


    # 概要

    ```

    int misc_register (struct miscdevice * misc);

    ```


    # 参数

    - misc: 设备结构


    # 描述

    向内核注册杂项设备。如果设备号设置为 MISC_DYNAMIC_MINOR，将分配一个设备号并放入结构的 minor 字段中。其他情况下使用请求的设备号。


    传递的结构被链接到内核，在注销之前不会销毁。


    成功返回零，失败时返回负错误码。


    ### misc_deregister


    # 名称

    misc_deregister — 取消注册杂项设备


    # 概要

    ```

    int misc_deregister (struct miscdevice * misc);

    ```


    # 参数

    - misc: 要注销的设备


    # 描述

    注销之前通过 misc_register 注册的杂项设备。成功由零表示，负错误码表示错误。


    ## 第15章 Video4Linux


    ### video_unregister_device


    # 名称

    video_unregister_device — 取销 video4linux 设备


    # 概要

    ```

    void video_unregister_device (struct video_device * vfd);

    ```


    # 参数

    - vfd: 要注销的设备


    # 描述

    此函数注销传递的设备并取消分配的设备号。未来的打开调用将遇到错误。


