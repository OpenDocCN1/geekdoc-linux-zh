    err

    错误返回指针


    ## Description


    传递格式字符串，例如 "ltd"，它将分配一个网络设备和名称空间。如果没有可用内存，则返回 NULL。如果分配成功，则会分配名称并返回设备指针。如果名称分配失败，则返回
    NULL。错误原因将作为负 errno 错误码通过 `err` 指向的变量返回。


    调用者在执行此操作时必须持有 `dev_base` 或 RTNL 锁，以避免重复分配名称。


    ## netdev_state_change


    # Name


    netdev_state_change — 设备状态变更


    # Synopsis


    ```

    void netdev_state_change (struct net_device * dev);

    ```


    ## Arguments


    dev

    触发通知的设备


    ## Description


    表示设备状态已更改。此函数调用 `netdev_chain` 通知链并向路由套字发送 NEWLINK 消息。


    ## dev_load


    # Name


    dev_load — 加载网络模块


    # Synopsis


    ```

    void dev_load (const char * name);

    ```


    ## Arguments


    name

    接口名称


    ## Description


    如果不存在网络接口且进程具有相应权限，此函数将加载模块。如果内核中不支持模块加载，则它成为一个无操作操作（nop）。


    ## dev_open


    # Name


    dev_open — 准备接口使用


    # Synopsis


    ```

    int dev_open (struct net_device * dev);

    ```


    ## Arguments


    dev

    要打开的设备


    ## Description


    将设备从关闭状态切换到开启状态。调用设备的私有打开函数，然后加载组播列表。最后将设备移动到开启状态并向 netdev 通知链发送 NETDEV_UP 消息。


    在激活接口上调用此函数为无操作。失败时返回负 errno。


    ## dev_close


    # Name


    dev_close — 关闭接口


    # Synopsis


    ```

    int dev_close (struct net_device * dev);

    ```


    ## Arguments


    dev

    要关闭的设备


    ## Description


    此函数将激活设备移动到关闭状态。向 netdev 通知链发送 NETDEV_GOING_DOWN。随后停用设备，最后向通知链发送 NETDEV_DOWN。


    ## register_netdevice_notifier


    # Name


    register_netdevice_notifier — 注册网络通知器


    # Synopsis


    ```

    int register_netdevice_notifier (struct notifier_block * nb);

    ```


    ## Arguments


    nb

    通知器


    ## Description


    注册一个网络设备事件发生时调用的通知器。传递的通知器被链接到内核结构中，在注销之前不能重用。失败时返回负 errno 错误码。


    ## unregister_netdevice_notifier


    # Name


    unregister_netdevice_notifier — 注销网络通知器


    # Synopsis


    ```

    int unregister_netdevice_notifier (struct notifier_block * nb);

    ```


    ## Arguments


    nb

    通知器


    注销之前通过 `register_netdevice_notifier` 注册的通知器。该通知器从内核结构中解除链接，之后可以重用。失败时返回负 errno
    错误码。


