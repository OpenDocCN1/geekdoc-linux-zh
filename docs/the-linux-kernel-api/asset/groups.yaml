- md: '

    an id with only a nonzero “driver_info” field. If you do this, the USB device
    driver’s probe routine should use additional intelligence to decide whether to
    bind to the specified interface.


    ## What Makes Good usb_device_id Tables


    The match algorithm is very simple, so that intelligence in driver selection must
    come from smart driver id records. Unless you have good reasons to use another
    selection policy, provide match elements only in related groups, and order match
    specifiers from specific to general. Use the macros provided for that purpose
    if you can.


    The most specific specifiers use device descriptor data. These are commonly used
    with product-specific matches; the USB_DEVICE macro lets you provide vendor and
    IDs, and you can also match against ranges of product revisions. These are widely
    used for devices with application or vendor specific bDeviceClass values.


    Matches based on device class/subclass/protocol specifications are slightly more
    general; use the USB_DEVICE_INFO macro, or its siblings. These are used with single-function
    devices where bDeviceClass doesn’t specify each interface has its own class.


    Matches based on interface class/subclass/protocol are the most general; they
    let drivers bind to any interface on a multiple-function device. Use the USB_INTERFACE_INFO
    macro, or its siblings, to match class-per-interface style devices (as recorded
    in bDeviceClass).


    Within those groups, remember that not all combinations are meaningful. For example,
    don’t give a product version range without vendor and product IDs; or specify
    a protocol without its associated class and subclass.


    ## usb_alloc_urb


    ### Name

    usb_alloc_urb — creates a new urb for a USB driver to use


    ### Synopsis

    ```

    urb_t * usb_alloc_urb (int iso_packets);

    ```


    ### Arguments

    iso_packets

    number of iso packets for this urb


    ### Description

    Creates an urb for the USB driver to use and returns a pointer to it. If no memory
    is available, NULL is returned.

    If the driver want to use this urb for interrupt, control, or bulk endpoints,
    pass ''0'' as the number of iso packets.

    The driver should call usb_free_urb when it is finished with the urb.


    ## usb_free_urb


    ### Name

    usb_free_urb — frees the memory used by a urb


    ### Synopsis

    ```

    void usb_free_urb (urb_t* urb);

    ```


    ### Arguments

    urb

    pointer to the urb to free


    ### Description

    If an urb is created with a call to usb_create_urb it should be cleaned up with
    a call to usb_free_urb when the driver is finished with it.


    ## usb_control_msg


    ### Name

    usb_control_msg — Builds a control urb, sends it off and waits for completion


    ### Synopsis

    ```

    int usb_control_msg (struct usb_device * dev, unsigned int pipe, __u8 request,
    __u8 requesttype, __u16 value, __u16 index, void * data, __u16 size, int timeout);

    ```


    ### Arguments

    dev

    pointer to the usb device to send the message to

    endpoint "pipe" to send the message to

    request

    USB message request value

    requesttype

    USB message request type value

    value

    USB message value

    index

    USB message index value

    data

    pointer to the data to send

    size

    length in bytes of the data to send

    timeout

    time to wait for the message to complete before timing out (if 0 the wait is forever)


    ### Description

    This function sends a simple control message to a specified endpoint and waits
    for the message to complete, or timeout.

    If successful, it returns 0, otherwise a negative error number.

    Don''t use this function from within an interrupt context, like a bottom half
    handler. If you need an asynchronous message, or need to send a message from within
    interrupt context, use usb_submit_urb


    ## usb_bulk_msg


    ### Name

    usb_bulk_msg — Builds a bulk urb, sends it off and waits for completion


    ### Synopsis

    ```

    int usb_bulk_msg (struct usb_device * usb_dev, unsigned int pipe, void * data,
    int len, int * actual_length, int timeout);

    ```


    ### Arguments

    - usb_dev

    pointer to the usb device to send the message to

    - pipe

    endpoint "pipe" to send the message to

    - data

    pointer to the data to send

    - len

    length in bytes of the data to send

    - actual_length

    pointer to a location to put the actual length transferred in bytes

    - timeout

    time to wait for the message to complete before timing out (if 0 the wait is forever)


    ### Description

    This function sends a simple bulk message to a specified endpoint and waits for
    the message to complete, timeout.

    If successful, it returns 0, otherwise a negative error number. The number of
    actual bytes transferred will be plaed in the actual_timeout paramater.

    Don''t use this function from within an interrupt context, like a bottom half
    handler. If you need an asynchronous message, or need to send a message from within
    interrupt context, use `usb_submit_urb`


    ## Chapter 18. 16x50 UART Driver


    ### register_serial


    ### Name

    register_serial — configure a 16x50 serial port at runtime


    ### Synopsis

    ```

    int register_serial (struct serial_struct * req);

    ```


    ### Arguments

    req

    request structure


    ### Description

    Configure the port specified by the request. If the port exists and is in use
    an error is returned. If the port is not currently in the table it is added.

    The port is then probed and if necessary the IRQ is autodetected If this fails
    an error is returned.

    On success the port is ready to use and the line number is returned.


    ## unregister_serial


    ### Name

    unregister_serial — deconfigure a 16x50 serial port


    ### Synopsis

    ```

    void unregister_serial (int line);

    ```


    ### Arguments

    line

    line to deconfigure


    ### Description

    The port specified is configured and its resources are freed. Any user of the
    port is disconnected as if carrier was dropped. Line is the port number returned
    by unregister_serial.


    ## Chapter 19. Z85230 Support Library


    ### z8530_interrupt


    ### Name

    z8530_interrupt — Handle an interrupt from a Z8530


    ### Synopsis

    ```

    void z8530_interrupt (int irq, void * dev_id, struct pt_regs * regs);

    ```


    ### Arguments

    - irq

    Interrupt number

    - dev_id

    The Z8530 device that is interrupting.

    - regs

    unused


    ### Description

    A Z85230 device has stuck its in the air for attention. We can scan the channels
    on the chip for events and then call the channel specific call backs for each
    channel that has events. We have to use callback functions because the two channels
    can be in different modes.


    ### z8530_sync_open


    ### Name

    z8530_sync_open — Open a Z8530 channel for PIO


    ### Synopsis

    ```

    int z8530_sync_open (struct net_device * dev, struct z8530_channel * c);

    ```


    ### Arguments

    dev

    The network interface we are using

    c

    The Z8530 channel to open in synchronous PIO mode


    ### Description

    Switch a Z8530 into synchronous mode without DMA assist. We raise the RTS/DTR
    and commence network operation.


    ### z8530_sync_close


    ### Name

    z8530_sync_close — Close a PIO Z8530 channel


    ### Synopsis

    ```

    int z8530_sync_close (struct net_device * dev, struct z8530_channel * c);

    ```


    ### Arguments

    - dev

    Network device to close

    - c

    Z8530 channel to disassociate and move to idle


    ### Description

    Close down a Z8530 interface and switch its interrupt handlers to discard future
    events.


    ### z8530_sync_dma_open


    ### Name

    z8530_sync_dma_open — Open a Z8530 for DMA I/O


    ### Synopsis

    ```

    int z8530_sync_dma_open(struct net_device * dev, struct z8530_channel * c);

    ```


    ### Arguments

    dev

    The network device to attach

    c

    The Z8530 channel to configure in sync DMA mode.


    ### Description

    Set up a Z853x device for synchronous DMA in both directions. Two DMA channels
    must be available for this to work. We assume ISA DMA driven I/O and PC limits
    on access.


    ### z8530_sync_dma_close


    ### Name

    z8530_sync_dma_close — Close down DMA I/O


    ### Synopsis

    ```

    int z8530_sync_dma_close(struct net_device * dev, struct z8530_channel * c);

    ```


    ### Arguments

    dev

    Network device to detach

    c

    ZZ5330 channel to move into discard mode


    ### Description

    Shut down a DMA mode synchronous interface. Halt the DMA, and free the buffers.


    ### z8530_sync_txdma_open


    ### Name

    z8530_sync_txdma_open — Open a Z8530 for TX driven DMA


    ### Synopsis

    ```

    int z8530_sync_txdma_open (struct net_device * dev, struct z8530_channel * c);

    ```

