  mdcn: "\n\n# 描述\n\n如果多于一个人引用此缓冲区，则返回 true。\n\n# skb_share_check\n\n# 名称\n\nskb_share_check\
    \ — 检查缓冲区是否被共享，如果是，则进行克隆\n\n# 概要\n\n```\nstruct sk_buff * skb_share_check (struct\
    \ sk_buff *skb, int pri);\n```\n\n# 参数\n\n- skb: 要检查的缓冲区\n- pri: 内存分配的优先级\n\n\
    # 描述\n\n如果缓冲区被共享，则会进行克隆，旧副本会释放一个引用。返回一个具有单一引用的新克隆。如果缓冲区未被共享，则返回原始缓冲区。当在中断状态下或持有自旋锁的情况下调用时，pri\
    \ 必须为 GFP_ATOMIC。\n\n# skb_unshare\n\n# 名称\n\nskb_unshare — 为共享缓冲区创建副本\n\n# 概要\n\
    \n```\nstruct sk_buff * skb_unshare (struct sk_buff *skb, int pri);\n```\n\n#\
    \ 参数\n\n- skb: 要检查的缓冲区\n- pri: 内存分配的优先级\n\n# 描述\n\n如果套接缓冲区是一个克隆体，此函数会创建数据的新副本，释放旧副本的引用计数，并返回引用计数为\
    \ 1 的新副本。如果缓冲区不是克隆，则返回原始缓冲区。当在持有自旋锁或从中断状态调用时，pri 必须为 GFP_ATOMIC。\n\n在内存分配失败时返回\
    \ NULL。\n\n# skb_peek\n\n# 名称\n\nskb_peek —\n\n# 概要\n\n```\nstruct sk_buff * skb_peek\
    \ (struct sk_buff_head * list_);\n```\n\n# 参数\n\n- list_: 要查看的列表\n\n# 描述\n\n查看（Peek）一个\
    \ &sk_buff。与大多数其他操作不同，你*必须*小心使用这一个。查看操作（peek）会将缓冲区保留在列表中，其他人可能会将其取走。你必须持有相应的锁或拥有该列表的私有队列。\n\
    \n对于空列表返回 NULL，或返回指向头元素的指针。引用计数不会增加，因此该引用是易变的。请谨慎使用。\n\n# skb_peek_tail\n\n# 名称\n\
    \nskb_peek_tail —\n\n# 概要\n\n```\nstruct sk_buff * skb_peek_tail (struct sk_buff_head\
    \ * list_);\n```\n\n# 参数\n\n- list_: 要查看的列表\n\n# 描述\n\n查看（Peek）一个 &sk_buff。与其它操作不同，你*必须*小心使用这一个。查看操作（peek）会将缓冲区保留在列表中，其他人可能会将其取走。你必须持有相应的锁或拥有该列表的私有队列。\n\
    \n对于空列表返回 NULL，或返回指向尾元素的指针。引用计数不会增加，因此该引用是易变的。请谨慎使用。\n\n# skb_queue_len\n\n# 名称\n\
    \nskb_queue_len — 获取队列长度\n\n# 概要\n\n```\n__u32 skb_queue_len (struct sk_buff_head\
    \ * list_);\n```\n\n# 参数\n\n- list_: 要测量的列表\n\n# 描述\n\n返回 &sk_buff 队列的长度。\n\n\
    # __skb_queue_head\n\n# 名称\n\n__skb_queue_head — 在列表头部队列缓冲区\n\n# 概要\n\n```\nvoid\
    \ __skb_queue_head (struct sk_buff_head * list, struct sk_buff *newsk);\n```\n\
    \n# 参数\n\n- list: 要使用的列表\n- newsk: 要队列的缓冲区\n\n# 描述\n\n在列表开始处队列缓冲区。此函数不获取锁，因此在调用它之前必须持有所需的锁。\n\
