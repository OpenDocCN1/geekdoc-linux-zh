    an id with only a nonzero “driver_info” field. If you do this, the USB device
    driver’s

    probe routine should use additional intelligence to decide whether to bind to
    the

    specified interface.


    # What Makes Good usb_device_id Tables


    The match algorithm is very simple, so that intelligence in driver selection must
    come

    from smart driver id records. Unless you have good reasons to use another selection

    policy, provide match elements only in related groups, and order match specifiers
    from

    specific to general. Use the macros provided for that purpose if you can.


    The most specific specifiers use device descriptor data. These are commonly

    used with product-specific matches; the USB_DEVICE macro lets you provide vendor

    and IDs, and you can also match against ranges of product revisions. These are

    widely used for devices with application or vendor specific bDeviceClass values.


    Matches based on device class/subclass/protocol specifications are slightly more

    general; use the USB_DEVICE_INFO macro, or its siblings. These are used with

    single-function devices where bDeviceClass doesn’t specify each interface has
    its

    own class.


    Matches based on interface class/subclass/protocol are the most general; they
    let

    drivers bind to any interface on a multiple-function device. Use the

    USB_INTERFACE_INFO macro, or its siblings, to match class-per-interface style

    devices (as recorded in bDeviceClass).


    Within those groups, remember that not all combinations are meaningful. For example,

    don’t give a product version range without vendor and product IDs; or specify
    a

    protocol without its associated class and subclass.


