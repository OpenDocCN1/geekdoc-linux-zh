    ## z8530_sync_txdma_close


    # Name


    z8530_sync_txdma_close — Close down a TX driven DMA channel


    # Synopsis


    ```

    int z8530_sync_txdma_close (struct net_device * dev, struct z8530_channel * c);

    ```


    ## Arguments


    - dev

    Network device to detach


    - c

    Z8530 channel to move into discard mode


    # Description


    Shut down a DMA/PIO split mode synchronous interface. Halt the DMA, and free the
    buffers.


    ## z8530_describe


    # Name


    z8530_describe — Uniformly describe a Z8530 port


    # Synopsis


    ```

    void z8530_describe (struct z8530_dev * dev, char * mapping, unsigned long io);

    ```


    ## Arguments


    - dev

    Z8530 device to describe


    - mapping

    string holding mapping type (eg "I/O" or "Mem")


    - io

    the port value in question


    ## Description


    Describe a Z8530 in a standard format. We must pass the I/O as the port offset
    isn''t predictable. The main reason for this function is to try and get a common
    format of report.


    ## z8530_init


    # Name


    z8530_init — Initialise a Z8530 device


    # Synopsis


    ```

    int z8530_init (struct z8530_dev * dev);

    ```


    ## Arguments


    - dev

    Z8530 device to initialise.


    ## Description


    Configure up a Z8530/Z85C30 or Z85230 chip. We check the device is present, identify
    the type and program it to hopefully keep quiet and behave. This matters a lot,
    a Z8530 in the wrong state will sometimes get into stupid modes generating 10Khz
    interrupt streams and the like.


    We set the interrupt handler up to discard any events, in case we get them during
    reset or setup.


    Return 0 for success, or a negative value indicating the problem in errno form.


    ## z8530_shutdown


    # Name


    z8530_shutdown — Shutdown a Z8530 device


    # Synopsis


    ```

    int z8530_shutdown (struct z8530_dev * dev);

    ```


    ## Arguments


    - dev

    The Z8530 chip to shutdown


    # Description


    We set the interrupt handlers to silence any interrupts. We then reset the chip
    and wait 100uS to be sure the reset completed. Just in case the caller then tries
    to do stuff.


