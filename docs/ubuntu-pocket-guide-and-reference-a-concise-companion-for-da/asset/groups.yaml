    \ what folder, so we supply this as an argument. The following will switch into\
    \ the Documents folder:\n\n- cd Documents\n\nSome commands need more than one\
    \ argument. Say that we wanted to copy the file report.doc from the Documents\
    \ folder to the Desktop folder. The cp command is used to copy files and folders.\
    \ We tell it the location and name of the file to be copied as the first argument,\
    \ and specify the destination as the second argument:\n\n- cp ~/Documents/report.doc\
    \ ~/\n\nIn this example, we've used the tilde symbol again as shortcut for the\
    \ /home folder. From left to right, on my test system the command would translate\
    \ as (cp) the file report.doc found at /home/keir/Documents/ to the destination\
    \ folder /home/keir/Desktop.\n\nOnce a command is entered, all that's usually\
    \ seen in the prompt. There's no confirmation. bash doesn't say \"OK\" or \"Command\
    \ completed!. bash is the silent type. It'll only speak if it has to, usually\
    \ to tell you of an error.\n\n## Command options\n\nMost commands also have command\
    \ options. These alter how the command works. Going back to the file listing command\
    \ (ls), one problem is that it lists files without any additional information.\
    \ What if we want to know who owns the files, or what permissions are set? For\
    \ this we use the -1 command option. Most commands are preceded by one or two\
    \ hyphens, so bash knows they're not arguments.\n\nHere's the 1 command used on\
    \ its own, and then with the -1 command option:\n\n- ls\nDesktop Documents Examples\
    \ Music Pictures Public Templates Videos\n- ls -1\n\n```\ntotal 28\ndrwxr-xr-x\
    \ 2 keir 2008-10-24 10:07 Desktop\ndrwxr-xr-x 2 keir 2008-10-24 10:07 Documents\n\
    lrwxrwx-x 1 keir 26 2008-10-24 09:51 Examples -> \n/usr/share/example-content\n\
    etc.\n```\n\nAnother useful command option for ls is -a, which causes all files\
    \ to be listed—even hidden ones.\n\nCommand options can be combined. To do so,\
    \ simply list them one after the other. To see all details about files, and any\
    \ hidden files, you would type ls -la.\n\nls -la is a common command used by many\
    \ Linux users daily.\n\nCommand options are usually letters, but sometimes words\
    \ are used too. In fact, to view a quick list of options, you can use the --help\
    \ command option (that’s two hyphens, rather than one). For example, ls --help,\
    \ or cp --help. This option works with virtually all commands.\n\n## Complex filenames\n\
    \nFilenames with spaces in them present problems because a space between items\
    \ on a command-line is taken as an indication that command arguments or options\
    \ follow.\n\nFor example, the rm command is wanted to delete files. If you wanted\
    \ to delete a file called third quarter_report.doc, and typed rm third quarter_report.doc,\
    \ you would see the following series of error messages:\n\n- rm: cannot remove\
    \ 'third': No file or directory\n- rm: cannot remove 'quarter': No file or directory\n\
    - rm: cannot remove 'report.doc': No file or directory\n\nIn other words, the\
    \ rm command interprets each as a separate argument—it thinks you want to delete\
    \ a file called third, a file called quarter, and a file called report.doc.\n\n\
    The solution is simple—just wrap any file or folder name containing spaces in\
    \ quotation marks:\n\n- rm \"third quarter report.doc\"\n\nThis should be done\
    \ for file/folder names that include symbols too.\n\n> TIP Another method of dealing\
    \ with spaces or symbols is to escape them. This involves typing a backslash (\\\
    ) before each space or symbol. To delete the above file, you could type rm third\\\
    quarter\\report.doc. Most times quotation marks work fine.\n\n## Relative and\
    \ absolute paths\n\nA path is simply the part of a file or folder describing where\
    \ it is located in the filesystem~/home/keir/Documents/report.doc, for example.\
    \ Paths can be expressed in two ways: relative and absolute.\n\nImagine that a\
    \ user called Frank is using the command-line and browsing his Pictures folder,\
    \ whose location is /home/frank/Pictures.\n\n> NOTE Remember that the root of\
    \ the filesystem, indicated by C:\\ under Windows, is indicated in Linux by a\
    \ single forward slash (/).\n\nWhat Frank wants to view photos from his vacation,\
    \ and so wants to switch to the Disneyland folder, that is in the Pictures folder?\n\
    \nFrank’s been paying close attention to this book, because he knows he can type\
    \ the cd command, as mentioned above. But what should he type next?\n\nHe could\
    \ type the full path to the folder, like this:\n\n- cd /home/frank/Pictures/Disneyland\n\
    \nThis works fine, but it's a lot of typing.\n\nIn the above command, Frank has\
    \ specified the absolute path to the file—the full location, from the root of\
    \ the filesystem up. Course, it would make more sense if Frank simply typed:\n\
    \n- cd Disneyland\n\nAfter all, he's already browsing the Pictures folder.\n\n\
    Frank doesn't realize, but here he has specified a relative path. Rather than\
    \ provide the path from the bottom-up, he specified a filesystem location relative\
    \ to where he's currently browsing.\n\n> NOTE The folder a is currently browsing\
    \ is sometimes referred to as the working directory.\n\n(Note: The provided OCR\
