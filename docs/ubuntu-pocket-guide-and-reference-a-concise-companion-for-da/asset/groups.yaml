    ## Personalizing


    Just about any element of the Ubuntu user interface can be customized, from the
    desktop wallpaper to the program titlebars and buttons.


    To view the personalization options, click System ⇨ Preferences ⇨ Appearance.
    This will open the Appearance dialog box, and you can select between the tabs
    in the program window to make your choices.


    ## Themes


    The look and feel of program windows and dialog boxes is known as a theme, and
    several are available within Ubuntu, and beyond the orange default appearance.
    You can switch between them by selecting the Theme tab in the Appearance Preferences
    dialog box. Changes take effect immediately.


    By clicking the CUSTOMIZE button, you can fine-tune personalization of program
    windows and dialog boxes, including changing the colors used. See Figure 3-2 for
    an example. As above, changes are applied the instant you make.


    - **TIP** New themes and wallpaper can be downloaded from websites such as http://gnome-look.org.
    Once the new theme downloaded, just drag and drop the archive anywhere on the
    Appearance Preferences dialog box to install it. There''s no need to unpack the
    archive first. Additionally, several community-generated themes can be added to
    Ubuntu 8.10 by installing the package-backends added by installing the gnome-background
    package (on both 8.10 and 8.04). Software installation is described in Chapter
    6.


    ## Fonts


    Under Ubuntu it''s not possible to customize what fonts are used for various elements
    of the desktop display, but also fine-tune how they appear on screen (Known as
    font rendering). To tweak font settings, click System ⇨ Preferences ⇨ Appearance
    and select the Fonts tab.


    To change the font used for Applications, for the Desktop, and so on, click the
    dropdown list alongside each heading.


    To change how fonts appear, choose an entry under the Rendering heading, or click
    the DETAILS button to get an even greater degree of control. If you''re using
    an LCD panel or laptop computer, you will almost certainly want to select the
    Subpixel (LCD) option, although this is a matter of personal taste. Just play
    around until you''re happy with the results.


    38 : Getting to Grips with the Desktop


    ![](img/acd1f85da6741773b2c9559b2eb5033d_56_0.png)


    Figure **3-2**. Customizing the desktop theme.


    > **TIP** You can import your own fonts into Ubuntu by creating a folder in /home/.fonts
    (note the period at the start of fonts), and placing TrueType (.ttf) font files
    in it. Note that this is a hidden folder, and won''t show up in normal file listings;
    to view it, click View ↩ Show Hidden Files in a file-browsing applications. Once
    added, the new fonts will be instantly available in applications. A common trick
    is to copy fonts from Windows.


    ## Login screen


    To personalize the login screen that appears when you boot into Ubuntu, click
    System ↩ Administration ↩ Login Window and, in the dialog box that appears, click
    the Local tab. Then select from the list of themes.


    > **TIP** As with the desktop theme, new login screen themes can be downloaded
    from sites like http://gnome-look.org. New themes can also be found in Ubuntu’s
    software repositories; they usually have the words gdm-theme somewhere in their
    package names. Software installation is described in Chapter 6.


    ## Configuring menus


    The contents of the Applications and System main menus can be customized by selecting
    System ↩ Preferences ↩ Main Menu. Click and drag to rearrange the order of menu
    items, or uncheck an item to remove it from the menu.


    ## Customizing desktop icons


    Icons are usually customized as part of the broader desktop theme, but you can
    use your own picture for a desktop icon by right-clicking it, selecting Properties,
    and clicking the top-left icon preview in the dialog box that appears. Following
    this, navigate to a picture file.


    Any icon on the desktop can be resized by right-clicking it and selecting Stretch
    Icon. Drag the handles at the corners of the icon to resize.


    ## Useful applications


    There isn''t space in a pocket guide such as this to run through commonly-used
    applications in detail. Is there any need because the applications are extremely
    intuitive and will present no problems to anyone who has used similar programs
    under Windows.


    Table 3-1 overleaf shows a list of the most applications Ubuntu users use day-to-day,
    and provides an overview of their functionality, along with hints about how to
    initially configure them, if necessary.


    ## Cutting, copying, and pasting


    Ubuntu offers two separate methods of copying and pasting text.


    The first is the standard way that you may be aware of, wherein text is first
    highlighted and either copied or by selecting the relevant entries on the program''s
    Edit menu (or by tapping Ctrl+C or Ctrl+X). The text is pasted into its new location
    by clicking Edit ⭘ Paste (or by hitting Ctrl+V).


    The second is independent of all, and unique to Linux/Unix. It uses the selection
    buffer. How it works is: As any text is highlighted, it is automatically copied
    into the selection buffer. It can be pasted at the cursor''s position by clicking
    the middle mouse button. You might not think your mouse has one of these, but
    it does—on most mice, the scroll wheel acts as a mouse button.


    > **TIP** Mouse without a scroll wheel, you can click the left and right mouse
    buttons exactly at the same time, and this will emulate clicking the middle mouse
    button.


    To give this a try, open the text editor (Applications ⭘ Accessories ⭘ Text Editor).
    Type something, highlight it using the mouse (or by holding down Shift and using
    the cursor keys), and click the middle mouse button.


    ## Desktop search


    Ubuntu offers a powerful search tool in the form of Tracker. Unlike standard search
    tools, Tracker indexes the contents of files. To activate Tracker, click System
    ⇨ Preferences ⇨ Search and Indexing. If you''re using a laptop computer, check
    the box.


    > **NOTE** Tracker isn''t activated by default because of concerns over performance.
    Once activated, a new icon will be added to the notification area at the top-right
    of the screen.


    > **TIP** To have Tracker index Microsoft documents, install the package. Software
    installation is explained in Chapter 6. Once installed, force Tracker to reindex
    by right-clicking the search icon and selecting the option from the menu. Tracker
    indexes the contents of PDFs, as well as office documents.


    ## Deskbar


    Although it might be considered an adjunct to Tracker, Ubuntu’s Deskbar applet
    is a separate tool with its own feature set. It can be added to a panel by right-clicking
    a blank spot on the panel, selecting Add to Panel from the menu that appears,
    selecting Deskbar from the applet list, and clicking the ADD TO PANEL button.


    ## Table 3-1 Useful day-to-day Ubuntu applications.


    | Type | Application | Details |

    | :--- | :--- | :--- |

    | Web browser | Firefox Applications ⇄ Firefox Web Browser | Fully capable alternative
    to Internet Explorer for general browsing and accessing interactive “Web 2.0”
    applications, such as Google Docs. Several adds-ons can be installed to provide
    additional functionality, and the interface can be personalized—click Tools ⇄
    Add-ons to do. |

    | Instant Messaging | Pidgin Applications ⇄ Internet Pidgin Messenger | Highly
    capable chat program that “speaks” AIM, Yahoo!, MSN, ICQ, and many other protocols.
    Upon starting it for the first time you''ll be prompted to add an initial account.
    More accounts can be added subsequently (click Accounts ⇄ Manage Accounts), so
    you can chat to all your contacts through the same program. |

    | Email/PIM | Evolution Applications ⇄ Internet Evolution Mail | All-inone mail
    client, calendar application, contacts book, and organizer. It unashamedly borrows
    from Microsoft Outlook, and is perhaps one of the most powerful and businesslike
    tools in Ubuntu’s armory. Upon starting you''ll be walked-through configuring
    initial email account. |

    | Image editing & cataloging | GIMP Applications ⇄ Graphics GIMP Image Editor
    | GIMP is a pro-level image editor offering much of the functionality found in
    commercial applications like Adobe Photoshop. F-Spot F-Spot Photo Manager. This
    catalogs photos and allows image tweaking. F-Spot will automatically start when
    you attach a digital camera, and stores photos in the Pictures folder within your
    /home folder. |

    | | F-Spot Applications ⇄ Graphics F-Spot Photo Manager | |

