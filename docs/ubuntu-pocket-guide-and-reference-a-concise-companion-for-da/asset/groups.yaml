    `xf1` 选项。然后选择 `resume`（恢复）以正常启动。


    ## 更改屏幕背光


    如果您在笔记本电脑上使用 Ubuntu，应该能够使用笔记本的标准组合键来更改屏幕亮度，就像在 Windows 中一样。如果这不起作用，请右键点击屏幕顶部栏上的空白处，并在出现的菜单中选择“Add
    to Panel”（添加到面板）。在出现的列表中，选择“Brightness المقبل”（亮度调节）并点击“ADD”（添加）按钮。这将添加一个新图标，点击它会显示一个滑块，让您更改背光程度。


    ## 屏幕保护程序


    您可以点击 System -> Preferences -> Screensaver（系统 -> 偏好 -> 屏幕保护程序）来选择屏幕保护程序并调整其激活所需的时间。


    ## Sound


    您可以通过点击桌面右上角的声器图标来更改音量。双击此图标将打开主调音器窗口，您可以在其中控制音频系统中各个组件的音量，例如 CD 播放器，或 PCM（媒体播放器和网页浏览器的音频输出）。


    注意：PCM 在 Windows 下有时被称为“wave”或“wav”。


    为了充分利用声卡的功能集，请点击主调音器窗口中的 PREFERENCES（偏好）按钮，并在您想要添加到主调音器窗口的任何控件旁勾选标记（在 Ubuntu 8.04
    中，点击 Edit -> Preferences）。新的滑块或控件将立即添加。


    提供的精确功能取决于您电脑声学硬件的能力。例如，要为环绕声添加滑块控制，请在列表中相应的复选框旁加上标记。


    24 : 配置 Ubuntu


    ## 上网


    根据所使用的硬件，有多种方法上网和/或连接到网络。我将在下面分别介绍它们。


    ### 无线


    网络连接由 Ubuntu 的 NetworkManager 插件处理，它可以在桌面右上角找到。它的图标是两个相互嵌入的显示器，如图 2-2 所示。连接到网络只需选择它并在提示时输入无线密码。完成后，点击
    CONNECT（连接）。


    > 确保 Ubuntu 检测到了正确的无线保护类型（如 WEP/WPA）。Ubuntu 在我的某次测试中犯了错。您可以通过点击 Wireless Security（无线安全）下拉列表进行选择。


    要连接到不广播名称（ESSID）的无线网络，点击 NetworkManager 图标并从菜单中选择 Connect to Hidden Wireless Network（连接到隐藏的无线网络）（在
    Ubuntu 8.04 下为 Connect to Other Wireless Network）。在 Network Name 字段中输入 ESSID，从
    Wireless Security 下拉列表中选择正确的无线保护类型，并在下方填写相应的密钥/密码短语详情。完成后，点击 CONNECT 按钮。


    Ubuntu 8.10 版本比之前的版本包含了得更好的无线硬件支持。如果您发现您的无线硬件不受 Ubuntu 支持，且您正在使用 Ubuntu 8.04 或更早版本，请考虑升级。如果无线卡不受支持，您将知道的，因为检测不到任何无线网络，尽管您也应该确保电脑的无线功能已激活——对于某些笔记本电脑，必须按下特殊的组合键，或者在电脑的
    BIOS 设置中专门启用无线网络。


    - **提示**：如果遇到无线无法工作的情况，您可以尝试安装 `linux-backports-modules-intrepid` 包（如果使用 Ubuntu
    8.10）或 `linux-backports-modules-hardy`（如果使用 Ubuntu 8.04）（安装后重启）。如果不能解决问题，您可能考虑使用
    Ndiswrapper。这是一个让您可以在 Linux 下使用 Windows 无线驱动程序的硬件驱动。我在《Ubuntu Kung Fu》书中写过 Ndiswrapper。访问
    Ubuntu Kung Fu 网站阅读相关摘要：www.ubuntungfu.org/ndiswrapper_html。


    ### 有线（以太网）


    一旦将以太网线连接到电脑，电脑将立即上线。不需要任何配置。


    例外是您的网络没有自动分配 IP 地址（缺少 DHCP 服务器）。这种情况很罕见，但在某些工作场所可能会发生。在这种情况下，您需要手动输入 IP、子网掩码、网关和
    DNS 地址，如下。


    ### 配置静态 IP 地址（Ubuntu 8.10及以上）


    在 Ubuntu 8.10 下配置静态 IP 地址（无 DHCP），右键点击屏幕右上角的 NetworkManager 图标并选择 Edit Connections（编辑连接）。点击
    Auto-etho 条目。点击 EDIT（编辑）按钮。在出现的新窗口中，确保选择了 Wired（有线）选项卡并点击 Auto settings（自动设置）。点击
    IPv4 Settings 选项卡，从下拉列表中选择 Manual（手动）。点击 ADD（添加）按钮并通过点击相关标题下的条目输入您的 IP 地址、子网掩码和网关（路由器）详情。在
    DNS Servers 文本字段中添加 DNS 地址（用逗号分隔）。您可以了解 Search Domains 字段。完成后，重启电脑。


    ### 配置静态 IP 地址（Ubuntu 8.04）


    在 Ubuntu 8.04 下配置静态 IP 地址，点击 System -> Administration -> Network。在出现的窗口中，点击 UNLOCK（解锁）并在提示时输入密码。选择
    Wired Connection（有线连接）并点击 PROPERTIES（属性）按钮。在出现的对话框中，取消勾选 Enable Roaming（启用漫游），并在
    Configuration 下拉列表中选择 Static IP Address。在相关字段中输入 IP 地址、子网掩码和网关（路由器）详情。点击 OK，并在
    DNS 标签中点击 ADD（添加）。


    26 : 配置 Ubuntu


    ## 打印机


    打印机由 Ubuntu 自动检测并配置。可以通过点击 System -> Administration -> Printing 来检查打印机是否已检测。如果您使用的是
    Ubuntu 8.10，打印机将以图标形式出现在窗口中。Ubuntu 8.04 的打印机将列在对话框左侧的 Local Printers（本地打印机）标题下方。


    > 提示：确保打印机已开启——否则 Ubuntu 无法检测到它！在打印机刚连接或首次开启后，Ubuntu 需要几秒钟进行安装和配置。配置完成后，屏幕右上角会有气泡通知您。


    ## 打印测试页


    要在 Ubuntu 8.10 中打印测试页，打开打印机配置窗口（System -> Administration -> Printing），双击打印机图标并点击
    PRINT TEST PAGE 按钮。在 Ubuntu 8.04 中，按照之前的方法打开打印配置对话框，点击左侧列表中的打印机，并点击 PRINT TEST
    PAGE 按钮（先在程序窗口中选择 Settings 标签）。


    ## 设置默认打印选项


    要设置默认打印选项（如纸张类型或打印质量），打开打印机配置窗口（System -> Administration -> Printing），如果您使用的是
    Ubuntu 8.10，双击窗口中的打印机图标。随后，点击程序窗口左侧列表中的 Printer Options 条目。


