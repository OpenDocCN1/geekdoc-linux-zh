    ## data。要使用它，只需输入 `shred -u filename`，将 filename 替换为相应的文件名。


    ## 解密文件

    要解密 .pgp 文件，只需双击它。系统会提示你输入在生成时创建的密码，现在你应该能在 .pgp 文件旁边看到原始文件（或归包）。请记住，除非如后文节所示导出了密钥，否则只有在安装了相关密钥的计算机上才可以解密文件。


    ## 为另一台电脑导出密钥对

    备份你的加密密钥是一个明智的主意，因为没有它们，没有简单的方法可以解密你加密的文件。或者，你可能选择在两或多台计算机上安装相同的密钥以便共享加密文件。要做到这一点，你需要将密钥对导出为文件。导出时，首先确保计算机的时间日期是正确的。然后启动“密码和密钥”程序（可以在应用程序菜单中找到）。选中“密钥”选项卡，并在列表中右键点击密钥。在出现的对话框中点击“属性”，最后点击右角的“导出”并选择保存密钥的位置。


    要在不同的安装中导入密钥，首先确保计算机的时间日期是正确的。然后按照上述方法启动“密码和密钥”程序，点击菜单上的“导入”。最后导航到保存的密钥。


    ## 增强浏览器安全

    Ubuntu 8.04 使用 Firefox 3 浏览器具有重要的功能，例如防止钓鱼攻击（即用户被重定向到虚假网站以窃取登录详情），以及防止恶意软件或危险文件被暗中提供。请参见图
    7 关于这种攻击的示例（注意这是在 www.mozilla.com 处的演示；www.mozilla.com 是安全的访问）。


    利用这些功能不需要配置。


    **提示** 下文讨论的功能并非 Ubuntu 特有。提供的指令在 Windows 或 Mac OS 上的 Firefox 安装同样适用。


    ## 启用主密码

    与许多浏览器一样，Firefox 3 可以记住各种网站的用户名和密码，这样你就不需要每次访问都输入。然而，任何访问你计算机的人都可以访问你离开时的这些站点。设置主密码允许锁定存储用户名和密码的密码文件。每当你启动
    Firefox 并访问需要密码的站点时，都会提示输入主密码。当 Firefox 退出时，密码存储会被锁定。每次使用 Firefox 时解锁密码文件是必要的。


    **提示** 由于你每次使用 Firefox 都会被提示解锁密码文件，养成在完成后退出 Firefox 而不是让它留在后台的习惯是有意义的。


    启用主密码，点击 Firefox 窗口中的“首选项”，点击出现对话框顶部的“安全”，并在提示勾选“使用主密码”。完成后，退出并重启 Firefox。


    ## 避免“执行内容”

    许多网站使用 JavaScript、Java 和或 Flash 来提供有用功能。此类网站功能被称为*执行内容*。


    遗憾的是，在少数情况下，执行内容可用于攻击你的计算机并窃取数据。由于如此，注重安全的 Ubuntu 用户选择安装 NoScript，这是一个 Firefox
    插件，允许你按站点授权或限制 JavaScript、Java 和其他技术。


    ## 安装 NoScript

    要安装 NoScript，启动 Firefox 并点击“插件”。确保在出现的对话框中选中“获取插件”，并在“搜索插件”字段中输入 `noscript`。在结果列表中，点击
    NoScript 项目旁边的“添加到 Firefox”按钮。在出现的对话框中，点击“立即安装”，安装完成后点击“重启 Firefox”。


    ## 阻止/允许执行内容

    当 Firefox 重启时，你会在程序窗口右下角看到一个新的“S”图标。点击此图标可以允许或拒绝你正在浏览的站点执行内容。默认策略是 NoScript 禁用所有内容，包括
    Java、JavaScript、Adobe Flash 和 Microsoft Silverlight 组件。然而，中央白名单上的某些站点被完全或部分排除在此之外。


    ## 附录 A

    ### 术语表

    以下是你可能在本书或 Ubuntu 中遇到的部分术语表。描述是针对 Ubuntu 语境的。


    - **绝对路径（absolute path）**：从文件系统根目录开始的文件位置的完整描述。参见相对路径。

    - **小部件（applet）**：在 Ubuntu 桌面背景下，小部件是一个功能定义很窄的小程序（例如，显示时间）。

    - **Apache**：Web 服务器软件。参见 LAMP。

    - **APT**：高级软件包工具（Advanced Packaging Tool）；Ubuntu 中的高层软件管理子系统。参见 dpkg。

    - **bash**：布恩复用 Shell（Bourne-Again Shell）；Ubuntu 和大多数 Linux 版本使用的默认命令行 shell。基于较旧的
    sh。

    - **二进制文件（binary）**：经过编译成可在计算机上原生运行的程序的源代码。一种可执行文件。

    - **BSD**：伯克利软件发行版（Berkeley Software Distribution）；20 世纪70年代源于伯克利大学的 Unix 版本。现在有多个变体，包括
    NetBSD、OpenBSD 和 FreeBSD。

    - **C / C++**：用于创建大部分 Linux 操作系统的的语言。

    - **客户端（client）**：连接到服务器的计算机（或程序）。

    - **命令行（commandline）**：在终端窗口或虚拟控制台中输入命令的行。更多时候，该术语指的是与使用图形界面（GUI）相比的输入命令的界面和实践。

    - **编译（compilation）**：将源代码转换为二进制文件的过程，通常使用 GNU 编译器集合 (gcc)。

    - **配置文件（config file）**：配置文件的缩写；包含软件设置的文件。

    - **cron**：允许任务在计划时间执行的服务，通常在后台运行。

    - **CUPS**：通用 Unix 打印系统（Common Unix Printing System）；提供 Ubuntu 打印功能的软件（包括打印机驱动程序）。参见
    www.cups.org。

    - **Debian**：悠久的社区生成的 Linux 发行版，Ubuntu 基于此发行版，以及其他几个 Linux 发行版。了解更多信息请参阅 www.debian.org。


