    有时系统上安装软件可能会损坏，在这种情况下它可能无法运行或运行不正常。在这种情况下，重新安装软件可能是很有用的，Synaptic 提供了这种方法。搜索程序包并点击其旁边的复选框。在出现的菜单中，点击“标记为重新安装”选项，并点击主工具栏上的“应用”按钮。


    在摘要对话框确认即将执行的操作后（就像安装/删除软件时一样），Synaptic 将运行软件的安装程序，例如解压包和配置软件，但实际上不会重新下载它，除非包文件未存储在包缓存中，在这种情况下它将必须从存储库下载。


    ## 手动安装软件包


    手动下载并安装软件包是不可取的。这个过程充满了问题，最显著的问题是手动寻找依赖项可能存在困难。


    注意：由于依赖问题，如果你打算在开发者网站上安装软件，你可能会发现开发者有自己的软件包存储库，你可以订阅它。这将让你能够使用 Synaptic 安装程序，并自动处理依赖项。添加新存储库在下文的“使用存储库”节中描述。


    然而，在少数情况下可能需要“手动”安装软件包。


    GDebi 安装程序会自动与包文件（它们具有 .deb 扩展名）关联，就像 OpenOffice.org 的 Writer 与 Microsoft Word
    的 .doc 文件一样。因此，可以手动安装软件包并双击它，或者更简单地下载包文件并/或在网络浏览器的对话框中选择“用 GDebi 软件包安装器打开”选项。


    GDebi 尝试通过从主存储库下载必要的依赖包来缓解任何依赖问题。然而，你不应该假设依赖包总是可用的，特别是当你安装一个并非专门为你正在使用的 Ubuntu
    版本专门构建的软件包时。


    一旦 GDebi 程序窗口出现，点击“安装软件包”（INSTALL PACKAGES）按钮。随后，任何依赖项都将被下载（如果可能的话）并安装软件。


    如果在存储库中无法找到任何所需的依赖项，“安装包”（INSTALL PACKAGE）按钮将变灰色，并会出现警告提示你缺失的依赖项名称。你必须在继续之前手动获取并安装依赖包。


    106 : 软件管理


    ## 表 6 软件管理命令（apt, dpkg）


    | 命令 | 详情 |

    | --- | --- |

    | `apt-get update` | 更新来自存储库的可用软件包列表（等同于 Synaptic 的按钮，在任何软件安装前使用）。 |

    | `apt-get update` | 更新来自存储库的可用软件包列表（等同于 Synaptic 的按钮，在任何软件安装前使用）。 |

    | `apt-cache search` | 在存储库中搜索 `term`。 |

    | `apt-cache show` | 显示有关 `软件包` 的详细信息。 |

    | `apt-get install` | 安装 `软件包`，可以使用依赖项。 |

    | `apt-get autoremove` | 卸载不再需要的依赖项。如果磁盘空间紧张，则不这样做。 |

    | `apt-get upgrade` | 将已安装软件升级到最新版本。 |

    | `apt-get dist-upgrade` | 实际上是将整个系统升级到最新版本。 |

    | `apt-get clean` | 清理包缓存；除非空间紧张，否则不需要。 |

    | `dpkg -i` | 手动安装 `文件`，假设你已经手动下载了它。 |

    | `dpkg -r` | 卸载 `软件包`，保留其配置文件。 |

    | `dpkg -P` | 卸载 `软件包`并删除其配置文件。 |

    | `dpkg -I` | 显示关于 `文件` 的信息。 |

    | `dpkg -l` | 列出已安装的 `软件包`，包括版本号。 |


    注意：依赖项通常有自己的依赖项！换句话说，你可能会找到程序所需的所有依赖项，结果却面对一个全新的列表！这种情况被称为“依赖地狱”，是发明 APT 的主要原因。


    手动安装的软件包可以使用 Synaptic 卸载，就像其他软件一样。


    ## 命令行软件管理


    尽管 Synaptic 很有用，但它只是管理 APT 子系统的系列命令图形界面。


    两个最重要的命令是 apt-get 和 apt-cache。除了这些命令之外，还可以使用 dpkg 命令安装手动下载的包。


    在命令行安装软件可能比 Synaptic 更快捷、高效，因此这是一项值得学习的技能。


    > 注意：当然，如果 GUI 不工作，也可以进行命令行软件安装。因此在尝试修复损坏的系统时非常有用。


    > 提示：有些人倾向于使用 aptitude 命令而不是 APT 命令。aptitude 在处理依赖关系方面略好，并具有易于使用的半图形界面。更多信息请参见
    http://algebrithithunk.net/~burrows/projects/aptitude/doc/en/。


    # 安装软件


    这里是之前讨论过的安装 Frozen-Bubble 游戏所需的步骤。


    +   1. 在安装任何软件之前输入的第一个命令是 `sudo apt-get update`。这将从存储库获取最新的软件列表。


