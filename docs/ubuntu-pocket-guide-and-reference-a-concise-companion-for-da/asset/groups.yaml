    ## 第二章

    ## 配置 Ubuntu


    在本章中，你将学习如何配置你的 Ubuntu 系统。我们将处理硬件的所有主要领域，包括：


    - 键盘和鼠标；

    - 图形和显示器；

    - 音频；

    - 网络（包括无线网络）；

    - 打印；

    - 数码相机/USB 平板扫描仪；

    - 蓝牙设备。


    ### 入


    简单来说，Ubuntu 开箱即用。与 Windows 不同，你不需要在安装后费腾驱动程序——对所有类型硬件的支持已内置在内核中。


    注意：内核更新频繁，每次更新都会带来更好的硬件支持。这就是你应该保持系统更新的原因之一。我将在第 7 章中解释如何操作。


    然而，你仍然需要根据自己的需求配置系统——例如，配置 Ubuntu 以访问你的无线网络，或者设置打印机以获得最佳输出。


    ### 键盘和鼠标/触控板


    配置键盘和鼠标（或笔记本触控板）的选项可以在“系统 -> 选项”（System -> Preferences）菜单中找到——点击“键盘”即可配置键盘。对于任何配置过鼠标或键盘的人来说，这里显示的选项都不应带来任何挑战。


    ### 切换语言


    你可以动态切换两个或多个键盘布局。如果你发现自己经常输入不同语言，这会非常有用。要配置此功能，请遵循以下步骤：


    - 打开“键盘偏好”（System -> Preferences -> Keyboard），确保选中了“布局”（Layouts）选项卡，如果使用的是 Ubuntu
    8.04，请点击“添加”（ADD）按钮。

    - 从下拉列表中选择键盘布局。做出选择后，点击“添加”（ADD）按钮。

    - 在对话框中“布局”标题下的列表中，点击你想要设置为默认的条目旁边的单选按钮。这将在 Ubuntu 启动时激活。完成后，点击“关闭”（CLOSE）按钮。

    - 右键点击屏幕顶部的栏，选择“添加到面板”（Add to Panel）。在出现的对话框中，点击并拖动“键盘指示器”（Keyboard Indicator）到面板。然后点击关闭。


    从现在起，你可以通过点击在键盘偏好对话框中选择的应用程序，在布局之间进行切换。


    ### 鼠标


    如果你觉得指针移动得对你来说太快，打开“鼠标偏好”（System -> Preferences -> Mouse），点击并拖动“加速”（Acceleration）滑块稍微向左移动。更改会立即生效，请测试鼠标移动并反复调整，直到你对设置完全满意。要禁用触控板点击，选择“触控板”（Touchpad）选项卡并取消相关框的勾选。


    ### 图形


    在几乎所有情况下，Ubuntu 的图形系统都可以正常工作。然而，仍有一些常见但容易修复的问题。


    ### 更改屏幕分辨率


    Ubuntu 在安装后可能会猜测错误的屏幕分辨率。你会发现这种情况，因为一切看起来都是块状或模糊的。要调整分辨率，点击屏幕顶部的“系统”菜单，然后选择“偏好
    -> 分分辨率”（Preferences -> Resolution）。


    注意：如果你使用的是 CRT 显示器（即玻璃管显示器而非 TFT 面板），你可能需要调整“刷新率”。舒适的标准刷新率是 75Hz。平直显示器应设置为 60Hz。


    如果你在下拉列表中找不到你需要的分辨率，或者在选择后不起作用，你可能需要激活专有图形驱动程序，如下所示。


    ### 安装专有驱动程序


    安装专有图形驱动程序意味着 Ubuntu 将不再使用自由软件版本。这应该只在绝对必要的情况下进行（例如，内置驱动程序无法产生最佳结果，因为专有驱动程序的更新频率不如自由软件版本，且可能有很多错误）。要安装专有驱动程序，首先确保你已在线——参见后文的“在线网络”部分。这是必要的，因为将下载新的驱动程序。然后点击“系统
    -> 偏好 -> 硬件驱动”（System -> Preferences -> Hardware Drivers）。


    如果你使用的是 Ubuntu 8.10，选择列表中的图形驱动程序条目并点击“安装”按钮（见图 2-1）。


    提示：如果提供多个驱动程序，请选择标记为“推荐”（Recommended）的那个。如果证明这不够理想，请重复此步骤并选择不同的版本。


    如果你使用的是 Ubuntu 8.04，只需在显卡条目旁边的“启用”（Enabled）列中打钩即可。无论使用哪种版本的 Ubuntu，一旦做出选择，就会下载新驱动程序。完成后，你可能需要重启计算机——只需遵循屏幕上的提示即可。


    ### 硬件驱动程序


    此系统未使用任何专有驱动程序。专有驱动程序没有 Ubuntu 开发人员可以自由修改的源代码。它们对你构成了风险，因为它们仅适用于制造商选择的计算机类型，且对它们的安全更新完全取决于制造商的响应速度。Ubuntu
    无法修复或改进这些驱动程序。


    | 驱动程序 | 说明 |

    | :--- | :--- |

    | 支持 Atheros 802.11 网卡 | |

    | NVIDIA 加速图形驱动程序（版本 177）[推荐] | 由 Ubuntu 开发人员测试。许可证：专有。用于 NVIDIA 显卡的 3D 加速专有图形驱动程序。为了充分利用
    NVIDIA 显卡的 3D 潜力以及为新卡提供 2D 加速，需要此驱动程序。如果你想启用桌面效果，则需要此驱动程序。 |


    利用专有驱动程序。


    ### 激活桌面视觉效果


    与所有现代操作系统一样，Ubuntu 包含许多桌面视觉效果，这意味着程序窗口在首次激活时会淡入视图，或在最小化时在视觉上缩小。这可以让 Ubuntu 的体验变得更加愉悦。


    视觉效果的实现通过使用高级图形驱动。在利用 Intel 或 AMD/ATI 图形芯片的系统中，提供了此类驱动的开源版本并将默认安装，但对于使用某些图形芯片组的计算机，必须安装专有驱动程序才能使用桌面效果。


    你可以通过按住 Ctrl+Alt 并松开左或右箭头键来判断电脑是否已激活桌面效果。这将激活虚拟桌面切换（我将在第 3 章中详细介绍）。如果桌面“滑”出视图，说明视觉效果已激活，无需进一步操作。如果你在屏幕中间看到一个显示虚拟桌面的小面板，说明视觉效果未激活，你可能需要使用专有图形驱动程序。


    注意：桌面效果并非绝对必要——Ubuntu 没有它们也可以完全功能运行。


    要控制使用的视觉效果类型或禁用它们，点击“系统 -> 偏好 -> 外观”（System -> Preferences -> Appearance）。在出现的程序窗口中，选择“无”（None）、“普通”（Normal）或“额外”（Extra）。普通设置是默认设置。


    ### 配置第二个显示器


    如果你连接了多个显示设备，Ubuntu 将镜像桌面内容，并选择两个输出设备中较高的作为桌面分辨率。这对于连接了 LCD 投影仪进行演示的情况非常方便，但对于连接了两个显示器的计算机来说没有用。


    要切换到跨越两个显示设备的扩展桌面，使每个显示器都有独立的桌面区域，请点击“系统 -> 偏好 -> 屏幕分辨率”（System -> Preferences
    -> Screen Resolution），并在出现的对话框中确保“镜像屏幕/复制屏幕”（Mirror Screens/Clone Screens）标题旁没有勾选。然后点击并拖动第二个显示器的图标到你希望相对于主显示器“放置”的位置（即左侧、右侧，甚至上方或下方）。这将影响光标离开一个桌面进入第二个显示器另一个桌面的位置。


    '
