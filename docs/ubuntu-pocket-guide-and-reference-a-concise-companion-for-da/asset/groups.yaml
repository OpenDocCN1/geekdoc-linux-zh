    Before attempting to compile software yourself, use Synaptic to install the build-essential
    package. This installs the necessary program compilation software.


    Three commands are commonly used in succession to compile software, once you''ve
    unpacked the source code and switched into the folder containing it:


    - ./configure

    - make

    - sudo make install


    The first command runs a script that checks the system has the required software
    needed to compile the software, and also any dependency software required to eventually
    run the program.


    The second command actually compiles the software, and as such can take quite
    a while to complete. The screen may seem to fill with garbage during this stage.
    This is *debug output*, and is nothing to be worried about, although if you run
    into problems when compiling software and ask for help online, others may ask
    to see it.


    The third command copies the newly-made program files to the relevant locations
    in the filesystem, so they''re ready for everyday use.


    It''s beyond the scope of this pocket guide to explain software compilation in
    more depth than this but, bearing in mind this is the most fundamental (and oldest)
    of Unix tasks, you''ll find excellent instructions online—just hit your favorite
    search engine.


    # CHAPTER SEVEN


    ## Securing the system


    This chapter looks at five aspects of system configuration that increase Ubuntu’s
    security. They are:


    - Updating the system;

    - Configuring the firewall to protect your computer from network/Internet threats;

    - Installing an antivirus program;

    - Encrypting data, so that if your data is stolen or misplaced it will be inaccessible;

    - Enhancing security within your web browser.


    ## System updates


    As with any operating system, you should regularly update Ubuntu. This will ensure
    you have the latest software that free of bugs and security holes that make your
    system insecure by providing a backdoor for hackers or viruses.


    ## Update Manager


    Ubuntu automates updating the system using a program called Update Manager. This
    runs periodically and automatically in the background to check for updated versions
    of installed software that have been made available in the repositories.


    You may already have noticed this program’s icon appearing in the notification
    area—depending on the GUI theme in use, it looks like a star, or red down-pointing
    arrow, and the first time it appears a callout will appear informing you that
    updates are available.


    Clicking the icon will show a list of packages that can be updated.


    - Any software installation application is closed first, such as Synaptic. Only
    one software administration tool can run at any time. This includes command-line
    tools.


    It''s not absolutely essential to read through the list of updates, doing so will
    only take a minute or two, and it''s a good idea to keep track of what''s being
    updated. Assuming you''re happy with the list of updates, click the INSTALL UPDATES
    button to automatically download and install the software.


    If desired, you can force Update Manager to run by clicking its entry on the System
    ⇼ Administration menu and clicking the CHECK button when the program window appears.


    Depending on what system components are updated, you may have to restart your
    computer to complete installation. You''ll know if this is the case because the
    update manager icon will change to two circular arrows that, when clicked, will
    prompt you to reboot the computer.


    When a new release of Ubuntu becomes available, Update Manager informs you via
    a pop-up window. You can then choose to upgrade (or, if you do not wish to).


    ## Updating at the command-line


    To update at the command-line, two sets of commands can be issued:


    - sudo apt-get update

    - sudo apt-get upgrade


    or


    - sudo apt-get update

    - sudo apt-get dist-upgrade


    sudo apt-get update grabs the latest list of packages, so should always be used
    before updating.


    sudo apt-get-dist-upgrade updates all software packages to the latest available
    versions. If you wish to update the system manually at the command-line, this
    command should be issued weekly. In contrast, sudo apt-get-dist-upgrade updates
    the entire system, including several vital system files, thereby bringing Ubuntu
    to the latest release. If run on an 8.04 system, for example, it will update Ubuntu
    to 8.10. It should be run only when you know a new release to be available.


    116 : Securing the System


    ## Configuring the firewall


    Ubuntu contains a very powerful firewall called netfilter that is part of the
    central kernel program. However, it isn''t active by default, and must be manually
    configured. The reason for this is that Ubuntu has no outward-facing services.
    If you imagine Ubuntu as a house, you could say that it has no windows or doors
    through which intruders can gain access. All incoming connections hit a brick
    wall.


    However, despite this fundamental protection, hackers are ingenious and there
    can be no room for complacency. Configuring the firewall using a GUI application
    like Firestarter, as described below, is so easy that there''s little reason not
    to do so.


    - TIP: The ufw command can be used to configure the firewall at the command-line.
    This is relatively simple to use, but is still not straightforward for a GUI application
    like Firestarter. For details, see http://ubuntuforums.org/showthread.php?t=823741.


    ## Installing and Configuring Firestarter


    Firestarter is a simple yet powerful tool. To install it, start Synaptic and search
    for firestarter. Put a check in the box alongside firestarter entry and select
    Installation from the menu. Click the APPLY button on the dialog box.


    There''s no need to restart because firewall component can be started, start the
    program by clicking System ⇼ Firestarter.


    - NOTE: On a technical level, Firestarter works by letting you allow and deny
    individual TCP/UDP ports. There''s not really any need to understand this to configure
    Firestarter, but it will certainly help if you want to create more elaborate arrangements.
    Many websites offer explanations of how TCP and ports work—just hit Google.


    In its default state, Firestarter turns away all incoming data, while all out-going
    data is permitted through the firewall. As such, it is little different from the
    default Ubuntu state of affairs.


    - NOTE: There are no viruses or spyware affecting Linux. However, this is almost
    certain to change as versions of Linux like Ubuntu become more popular.


    ## Creating inbound rules


    Inbound rules allow you to filter all incoming connections. By default, all uninvited
    incoming connections are turned away. Creating an inbound rule effectively allows
    you to create a "hole" in the firewall for certain types of connection to get
    through, as needed by particular programs. This can be useful if you run file
    sharing software on your computer, for example, such as Transmission (Applications),
    that uses BitTorrent to share files.


    Additionally, you can choose to let some inbound connections through, but only
