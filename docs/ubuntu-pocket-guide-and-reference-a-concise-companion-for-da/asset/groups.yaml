    ## 个性化


    Ubuntu 用户界面的几乎任何元素都可以进行自定义，从桌面壁纸到程序标题栏和按钮。


    要查看个性化选项，请点击系统（System）⇨ 偏好（Preferences）⇨ 外观（Appearance）。这将打开外观对话框，你可以在程序窗口的各个选项卡之间切换以做出选择。


    ## 主题


    程序窗口和对话框的外观和感受被称为主题。Ubuntu 提供了多种主题，除了默认的橙色外观之外。你可以通过选择外观偏好对话框中的“主题”选项卡在它们之间切换。更改将立即生效。


    点击“自定义”（CUSTOMIZE）按钮，你可以对程序窗口和对话框的个性化进行精细调整，包括更改使用的颜色。示例参见图 3-2。如上述，更改在你完成后会立即应用。


    - **提示** 可以从如 http://gnome-look.org 等网站下载新的主题和壁纸。一旦下载新主题，只需将压缩包拖放到到外观偏好对话框的任何位置即可安装。无需先解压压缩包。此外，通过安装
    gnome-background 软件包（在 8.10 和 8.04 上均如此）后添加的包后端，可以将多个社区生成的主题添加到 Ubuntu 8.10 中。软件安装见第
    6 章。


    ## 字体


    在 Ubuntu 中，无法自定义桌面显示各种元素使用的字体，但可以微调它们在屏幕上的显示方式（称为字体渲染）。要调整字体设置，请点击系统（System）⇨
    偏好（Preferences）⇨ 外观（Appearance）并选择“字体”（Fonts）选项卡。


    要更改应用程序、桌面等使用的字体，请点击每个标题旁边的下拉列表。


    要更改字体显示方式，选择“渲染”（Rendering）标题下的项，或点击“详细”（DETAILS）按钮以获得更高程度的控制。如果你使用的是 LCD 屏幕或笔记本电脑，几乎肯定想要选择“子像素
    (LCD)”选项，尽管这取决于个人喜好。尽管尝试，直到你对结果满意为止。


    38 : 熟悉桌面


    ![](img/acd1f85da6741773b2c9559b2eb5033d_56_0.png)


    图 **3-2**。自定义桌面主题。


    > **提示** 你可以通过在 /home/.fonts 中创建一个文件夹（注意 fonts 开头有一个点），并将 TrueType (.ttf) 字体文件放在其中，将你自己的字体导入
    Ubuntu。注意这是一个隐藏文件夹，不会显示在正常的文件列表中；若要查看它，请在文件浏览应用程序中点击查看（View） ↩ 显示隐藏文件（Show Hidden
    Files）。一旦添加，新字体将立即在应用程序中可用。一个常用技巧是从 Windows 复制字体。


    ## 登录界面


    要对启动 Ubuntu 时出现的登录界面进行个性化，请点击系统（System） ↩ 管理（Administration） ↩ 登录窗口（Login Window），在出现的对话框中，点击“本地”（Local）选项卡。然后从主题列表中进行选择。


    > **提示** 与桌面主题一样，新的登录界面主题可以从 http://gnome-look.org 等网站下载。也可以在 Ubuntu 的软件存储库中找到新主题；它们在包名中通常会带有
    gdm-theme 字样。软件安装见第 6 章。


    ## 配置菜单


    可以通过选择系统（System） ↩ 偏好（Preferences） ↩ 主菜单（Main Menu）来自定义应用程序和系统主菜单的内容。点击并拖动以重新菜单项目的顺序，或取消勾选某项将其从菜单中移除。


    ## 自定义桌面图标


    图标通常作为更广泛的桌面主题的一部分进行自定义，但你可以通过右键点击桌面图标，使用自己的图片，选择“属性”（Properties），并点击出现对话框中左上角的图标预览。随后，导航到一个图片文件。


    桌面上的任何图标都可以通过右键点击它并选择“拉伸图标”（Stretch Icon）来调整大小。拖动图标角落的句柄来调整尺寸。


    ## 常用应用程序


    像这样的口袋指南中没有空间来详细介绍常用应用程序。这是否有必要呢？因为这些应用程序非常直观，对于任何在 Windows 下使用过类似程序的人来说，都不会遇到任何问题。


    表 3.1  {列出了 Ubuntu 用户日常最常用的应用程序列表，并提供了它们功能的概述，以及在必要时关于如何初始配置它们的提示。


    ## 剪切、复制和粘贴


    Ubuntu 提供两种不同的复制和粘贴文本的方法。


    第一种是你可能已经知道的标准方法，即先高亮文本，然后复制或通过选择程序“编辑”（Edit）菜单中的相关条目（或按下 Ctrl+C 或 Ctrl+X）来操作。点击“编辑”（Edit）
    ⭘ 粘贴（Paste）（或按下 Ctrl+V）将文本粘贴到新位置。


    第二种独立于所有方法，且是 Linux/Unix 特有的。它使用选择缓冲区。其工作原理是：当任何文本被高亮时，它会自动复制到选择缓冲区中。点击鼠标中间键即可将其粘贴到光标位置。你可能认为你的鼠标没有这种按钮，但它确实有——在大多数鼠标上，滚轮充当鼠标按钮。


    > **提示** 对于没有滚轮的鼠标，你可以同时点击鼠标左键和右键，这将模拟点击鼠标中间键。


    要尝试一下，打开文本编辑器（应用程序 Applications ⭘ 辅助工具 Accessories ⭘ 文本编辑器 Text Editor）。输入一些内容，使用鼠标将其高亮（或通过按住
    Shift 并使用光标键），然后点击鼠标中间键。


    ## 桌面搜索


    Ubuntu 以 Tracker 的形式提供强大的搜索工具。与标准搜索工具不同，Tracker 会索引文件。要激活 Tracker，请点击系统（System）⇨
    偏好（Preferences）⇨ 搜索和索引（Search and Indexing）。


    > **注意** Tracker 默认未激活，是出于性能考虑。如果你使用的是笔记本电脑，勾选该框。一旦激活，新图标将添加到屏幕右上角的通知区域。


    > **提示** 要让 Tracker 索引 Microsoft 文档，安装该包。安装后，右键点击搜索图标并从菜单中选择该选项来重新索引。


    ## Deskbar


    尽管它被认为是 Tracker 的辅助，但 Ubuntu 的 Deskbar 插件是一个具有自己功能集的独立工具。可以通过右键点击面板上的空白处，从弹出的菜单中选择“添加到面板”（Add
    to Panel），在插件列表中选择 Deskbar，然后点击“添加到面板”（ADD TO PANEL）按钮将其添加。


    ## 表 3.1 日常使用的 Ubuntu 应用程序。


    | 类型 | 应用程序 | 详情 |

    | :--- | :--- | :--- |

    | Web 浏览器 | Firefox 应用程序 ⇄ Firefox Web Browser | 功能强大的 Internet Explorer 替代品，用于通用浏览和访问交互式
    Web 2.0 应用（如 Google Docs）。可以安装多个插件以提供更多功能，并对界面进行个性化——点击工具（Tools） ⇄ 插件（Add-ons）进行操作。
    |

    | 即时消息 | Pidgin 应用程序 ⇄ Internet Pidgin Messenger | 功能强大的聊天程序，“支持”AIM、Yahoo!、MSN、ICQ
    以及许多其他协议。首次启动时，会提示你添加初始账户。随后可以添加更多账户（点击账户 Accounts ⇄ 管理账户 Manage Accounts），以便你通过同一个程序与所有联系人聊天。
    |

    | 电子邮件/PIM | Evolution 应用程序 ⇄ Internet Evolution Mail | 全功能邮件客户端、日历程序、联系人簿和组织工具。它毫不直言地借鉴了
    Microsoft Outlook，可能是 Ubuntu 工具库中最强大、最业务化的工具之一。启动时将将引导你配置初始电子邮件账户。 |

    | 图像编辑与分类 | GIMP 应用程序 ⇄ 图形 GIMP Image Editor | GIMP 是一款专业的图像编辑器，提供了类似于 Adobe Photoshop
    等商业软件的大部分功能。F-Spot F-Spot Photo Manager。对照片进行分类并允许进行图像调整。当你连接数码相机时，F-Spot 会自动启动并将照片存储在
    /home 文件夹下的 Pictures 文件夹中。 | |


