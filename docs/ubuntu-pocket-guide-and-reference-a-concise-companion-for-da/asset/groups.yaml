    the master password. Only when this is done will the website''s username/password
    field be filled-in. When Firefox is quit, the password store is locked. It''s
    only necessary to unlock the password file each time you use Firefox.


    **TIP** Because you''re prompted to unlock the password file once each time you
    use Firefox, it makes sense to get in the habit of quitting Firefox when you''ve
    finished with it, rather than leaving it in the background.


    To enable the master password, click Edit ⊘ Preferences in the Firefox program
    window, click the Security heading at the top of the dialog box that appears,
    and put a check alongside Use a Master Password as prompted. When done, quit and
    restart Firefox. The changes will take effect immediately—when you visit a site
    requiring a username/password that Firefox knows, you''ll be prompted for the
    master password.


    # Avoiding “executable content"


    Many websites make use of JavaScript, Java, and/or Flash to provide useful functionality.
    Such website features are known as *executable content*.


    Unfortunately, in a minority of cases, executable content can be used to attack
    your computer and steal data. Because of this, security-minded Ubuntu users opt
    to install NoScript, a Firefox add-on program that lets you authorize or restrict
    JavaScript, Java, Flash, and other technologies on a site-by-site basis.


    # Installing NoScript


    To install NoScript, start Firefox and click Tools ⊘ Add-ons. Ensure the Get Add-ons
    icon is selected in the dialog box that appears, and in the Search All Add-ons
    field, type `noscript`. In the list of results, click the ADD TO FIREFOX button
    alongside the NoScript entry. In the dialog box that appears, click the INSTALL
    NOW button and, when installation has finished, click RESTART FIREFOX.


    # Blocking/allowing executable content


    When Firefox restarts, you''ll notice a new “S” icon at the bottom-right of the
    program window. Clicking this lets you enable or deny executable content for the
    site you''re browsing. The default policy is for NoScript to deactivate everything,
    including Java, JavaScript, Adobe Flash, and Microsoft Silverlight components.
    However, some sites on a central


    Securing the System : 129'
  - '[PAGE 147]


    whitelist are excluded from this protection, either completely or partially. These
    are sites considered trusted and reputable, and use executable content for vital
    site functionality. You can view and edit the whitelist by clicking Tools ⇔ Add-ons,
    clicking PREFERENCES alongside the NoScript entry in the list, and selecting the
    Whitelist tab when the NoScript dialog box appears.


    Whenever you visit a new site that''s not in the whitelist, and that contains
    executable content, a yellow bar will appear at the bottom of the browser window
    explaining what the objectionable content is. By clicking the OPTIONS button,
    you can choose to allow various elements. Provided you trust the website (i.e.
    it is reputable and you visit it often), you can usually select Allow This Page
    [sic] from the menu. For example, I choose to allow all content on the www.bbc.co.uk
    sites, including BBC News (http://news.bbc.co.uk).


    Alternatively, if you believe the site might have questionable or even malicious
    intentions, you can click Untrusted ⇔ Mark as Untrusted. This will mean the prompt
    about whether to allow content on the site will not appear you should visit the
    site in the future.


    Bear in mind that some sites look radically different without JavaScript or Flash.
    In particular, you may find some menu navigation systems fail to work correctly.'
