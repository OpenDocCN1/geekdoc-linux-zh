    ## Ubuntu 提供的功能


    Ubuntu 是一个非常现代的操作系统，提供了你在 Windows 或 Macintosh OS X 中可能找到的所有功能，但没有那些缺点。它保持了简单性，同时提供了丰富的功能。


    想浏览网页吗？Firefox 可以胜任这项工作。你可能在 Windows 下使用的同一个 Firefox，而且相同的插件同样适用。想使用 AIM、MSN 或
    ICQ 与朋友发送即时消息吗？Pidgin 提供了解决方案。需要进行文字处理、电子表格或演示吗？OpenOffice.org 可以帮你解决问题。GIMP 将处理图像编辑，而
    RhythmBox 将负责音乐播放（独立视频播放由 Totem 处理）。


    所有这些程序都是默认安装的。它们不是额外程序，而且都是免费的。


    硬件支持非常出色，几乎每一项日常硬件都得到了支持，包括显卡/声卡、打印机、无线设备、USB 优存盘、摄像头、iPod 等。不需要费力寻找驱动程序光盘——几乎所有设备在安装后都会直接开始运行，尽管与任何操作系统一样，你可能需要根据自己的喜好和需求对系统进行配置。


    > Ubuntu 在旧硬件上运行良好。Ubuntu 8.04 的最低实际要求是 700MHz 处理器、384MB 内存和 8GB 磁盘空间。你可能考虑先在旧
    PC 上安装 Ubuntu 以进行评估。


    ## 如何阅读本书


    《Ubuntu 口袋指南与参考》非常简洁。它的目标是以一种无烦恼的方式解释 Ubuntu 管理的核心要点。由于口袋书格式的限制，有时它可以作为 Ubuntu
    功能的快速导览。然而，主题都得到了充分解释，并经常提供持久的参考。


    关于 Ubuntu 还有更全面的书籍。我推荐《入门 Linux》第三版，由 Jaime Sicam 编写，Apress 出版（2008年6月；ISBN 978-159059914），提供了完整的
    Ubuntu 指南。


    ## 复选框


    图 1。复选框和单选按钮。


    ## 输入命令


    有时可能会要求你在命令行输入某些内容。这通常会出现在行中，如下：


    - `mv /home/keir/Desktop/report.doc /home/keir`


    有些命令很长，页面上无法显示完全。如果是这种情况，我在行尾使用符号：


    ## 菜单选项


    在某些章节中，要求你选择某个菜单选项。你可能会看到如下内容：点击 System ↩ Preferences ↩ Appearance。我的意思是点击屏幕顶部的
    System 菜单，然后是 Preferences 子菜单，最后点击 Appearance 栏目。你要做什么将一目了然。


    ## 点击什么


    关于单选按钮和复选框的简单介绍，书中反复提到这两者。它们都是对话框的元素，用于激活某些功能。单选按钮通常是圆形的，而复选框通常是正方形的。参见示例图 1。


    ## Ubuntu 版本


    本书以 Ubuntu 8.10 为基础编写并在 8.04 长期支持版进行了进一步测试。截图使用的是 Ubuntu 8.10，因此与你看到的 8.04 可能略不同。


    ## 第一章


    ## 安装 Ubuntu


    本章介绍了在电脑上安装 Ubuntu 的方法。此外，你将学习：


    - 选择适合你的 Ubuntu 版本（发行版）；

    - 进行准备工作以确保安装顺利运行；

    - 创建自己的 Ubuntu 安装光盘；

    - 在有问题的电脑上安装 Ubuntu；

    - 在基于 Intel 的 Apple Macintosh 电脑上安装 Ubuntu。


    ## 安装类型


    安装 Ubuntu 比你想象的要简单得多，基本上有三种方法，如下：


    ### #1：双启动


    如果你打算长期使用 Ubuntu，通过重新划分硬盘分区来安装 Ubuntu 是最好的。这涉及缩小现有的 Windows 分区并在 Ubuntu 旁边创建新分区。完成后，将安装
    Ubuntu 并添加一个菜单，让你可以在启动时选择 Ubuntu 或 Windows。这听起来很复杂，但备份数据是明智的。


    ### #2：在 Windows 内安装


    Wubi 是一种在 Windows 内安装 Ubuntu 的方法。它允许你在不重新划分磁盘的情况下运行两个操作系统。这对于测试 Ubuntu 功能非常用。


    ### #3：虚拟机


    通过虚拟化软件，你可以在 Windows 中像程序一样运行 Ubuntu。这是尝试 Ubuntu 最安全的方法，因为它不会影响你的现有文件。

