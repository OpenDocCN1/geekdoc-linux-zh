    ```bash

    chown frank report.doc

    ```


    这会将文件的所有者更改为 `frank`。同时更改组和所有者。


    `chmod` 命令用于修改文件的模式。有多种使用方法，但最简单的是使用符号表示。它使用 `u` 表示用户，`g` 表示组，`a` 表示所有，并结合 `+`
