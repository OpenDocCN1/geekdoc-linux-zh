    找到相关说明。


    # 14：安装 Ubuntu


    ## 虚拟机


    虚拟机本质上是在软件中重构的整台 PC。虚拟机启动（此处）


    免费的 VMware Player 应用程序允许轻松的虚拟计算，且仅用于尝试 Ubuntu。以下是所需的步骤：


    - 1. 访问 www.vmware.com/products/player 并下载 VMware Player。下载后进行安装。然后访问 www.ubuntupcgetguide.com/vmware.html
    并下载空的虚拟机 zip 压缩包。

    - 2. 将虚拟机 zip 压缩的内容解压到新文件夹中，并将之前下载的 Ubuntu ISO 镜像拷贝到同一文件夹。将 OS 镜像重命名为 `ubuntu.iso`。

    - 3. 双击新文件夹中的 `startubuntu` 文件启动虚拟机（你可能会看到 `startubuntu.vmx`，它们是同一个文件）。

    - 4. 从现在开始，遵循上方“标准（重新分区）”标题下的说明操作。当你进入分区阶段时，你只会看到一个选项：引导式——使用整个磁盘。这是可以的。


    > 注意：请记住，你正在将 Ubuntu 安装到虚拟硬盘上，它实际上是 Windows 文件系统中的一个文件。你并不会抹掉电脑的真实硬盘！


    安装完成后，虚拟机就可以运行了——你不需要重启电脑！当你用完 Ubuntu 时，只需像退出其他程序一样退出 VMware——虚拟 Ubuntu 安装将挂起，直到你再次双击
    `startubuntu` 文件启动 VMware 为止。


    注意，你需要在 VMware 窗口内点击鼠标，以将键盘和鼠标输入切换到虚拟操作系统。一旦如此，鼠标光标将被“锁定”在窗口内。要释放它，请同时按下 `Ctrl+Alt`
    键。


    ## 异常安装（备用安装）


    有时 Ubuntu 的安装程序会出现故障。最常见的结果是图形问题，意味着安装程序没有正常工作。


    在这种情况情况下，你可以使用备用安装 CD。你可以从 www.ubuntu.com 以 ISO 镜像的形式下载，就像主安装光盘一样（点击标记为“Text-based
    alternate installer installation disk”的链接），在选择你附近的下载位置后，选择文件名以 `-alternate-i386.iso`
    结尾的文件。


    备用 CD 提供与主安装光盘相同版本的 Ubuntu，但使用一个没有图形界面的“文本模式”安装程序。由于这种安装程序兼容几乎所有的电脑，但是有代价的，因为它不像主
    Ubuntu 安装程序那样友好。对于初学者来说，术语可能晦涩，而且缺乏图形界面意味着没有鼠标——你必须使用键盘遍历界面。


    使用备用 CD 需要的步骤如下：


    - 1. 假设你已如之前所述下载了 CD-R/RW 光盘并将其刻空白空白 CD，使用光盘启动电脑。执行“标准（重新分区）”标题下的步骤 1，确保你的电脑从
    CD-R/RW 光盘启动。

    - 2. 在启动菜单中，选择你的语言并选择 Install Ubuntu 菜单。

    - 3. 当安装程序启动时，通过高亮屏幕光标方向键并按下回车键来遵循初始安装步骤。在大多数情况下，默认选择都是好的。在某个阶段，安装程序会尝试连接网络并报告错误。不要担心这个。如果提示你输入无线网络详情，只需选择不在线（“此时不配置网络”）。

    - 4. 最终，你将会被提示输入主机名。这是电脑在网络上的称呼。使用默认值即可。

    - 5. 与主安装程序一样，备用安装程序将尝试调整 Windows 分区大小。当提供 Guided–Resize SCSI1选项（或 Guided–Resize
    IDE1）时，按下回车键。


    > 注意：在此阶段我看到一个警告，说“之前的更改必须写入磁盘”，尽管我还没有做过任何更改。高亮 YES 并按下回车键允许安装继续。


    - 6. 此之后，你将被要求输入 Windows 分区的新尺寸。（注：此处原文存在大量重复错误，已清理）。


    > 注意：Ubuntu 8.10 存在一个 bug，选择引导式——使用最大连续空间（Use the Largest Continuous Free Space）选项会在图形预览中显示
    Ubuntu 占据整个磁盘。这是错误的，可以忽略。


    - 6. 此之后，你将被要求输入 Windows 分区的新尺寸。（注：此处已清理 OCR 重复）。


