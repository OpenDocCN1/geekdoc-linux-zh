    # Piping


    Piping is similar to redirection except that it''s used to pass the output of
    one command to another—rather like connecting a pipe between the two commands,
    in fact!


    The pipe symbol () is used for this purpose. On most keyboards this symbol can
    be found by hitting Shift and backslash.


    Taking the previous example, if we wanted to pipe the output of the ls command
    into sort, to alphabetize it, we would type the following:


    +   - ls sort


    A common use of piping is to pass the output of a command to the grep command,
    which searches for a word or phrase. For example, if you have a huge file listing
    containing hundreds of files/folders, and want to find if report.doc, you would
    type the following:


    +   - ls grep report.doc


    Incidentally, if you see no output, the search phrase wasn''t deigned.


    # Brace expansion


    Brace expansion is a labor-saving trick. It''s best explained by example.


    Let''s say you''ve come back from a European tour with a digital camera full of
    photos, and want to create four folders on your PC, named photos_germany, photos_france,
    photos_england, and photos_span. You could create each manually using the mkdir
    command, but brace expansion lets you to create all four in one swoop, as follows:


    +   - mkdir photos_{germany,france,england,span}


    If we view a file listing, we''ll find we have four new folders:


    +   - 1s


    photos_england photos_france photos_germany photos_span

    In other words, anything within the braces ({}) is individually added to photos_
    and a new folder is created using that name. Each item within the braces should
    be separated by a comma.


    If you subsequently wanted to delete the photos_span and photos_france folders,
    rather than type two separate rm commands, you could use brace expansion again:


    +   - rm -r photos_{france,span}


    Brace expansion works with all commands, not just mkdir and rm, and'
