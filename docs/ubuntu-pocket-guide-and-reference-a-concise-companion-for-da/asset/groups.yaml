    # CHAPTER SIX


    # Software management


    This chapter looks at how to install and remove software, and manage the software
    subsystem. You will explore the package management system that lies at the heart
    of Ubuntu. Topics covered include:


    +   - An explanation of the package management subsystems;

    - Installing and removing software using Synaptic;

    - Manually installing a software package;

    - Installing and removing software at the command-line;

    - Adding new software repositories;

    - Compiling a program from source code.


    # All about package management


    Many versions of Linux, Ubuntu relies on a system called package management for
    all its software installation and removal needs.


    # What’s in a package?


    Nearly all Ubuntu programs are distributed as software package files. Package
    files are similar to installation setup.exe files under Windows, in that they
    are single archives containing a program’s components. When the program is installed,
    the components are unpacked onto the hard disk, and the system configured so the
    software will work.


    However, a key difference with Ubuntu is that packages only contain the program
    itself. Typical setup.exe files for Windows include the program and also various
    system files that allow the program to run'
  - '[PAGE 115]


    correctly. If an Ubuntu program requires any additional system files, they will
    need to be installed separately, and will probably be available in packages of
    their own.


    It''s important to understand that everything in a typical Ubuntu installation
    originally came out of a package—from the Linux kernel, to the Nautilus file manager,
    the system fonts. When you installed Ubuntu, the installation program did little
    more than unpack hundreds of packages in order.


    # APT and dpkg


    Packages are installed and removed using Ubuntu''s two software subsystems: the
    Advanced Packaging Tool (APT), and the Debian Package system (dpkg).


    APT and dpkg are two sides of the same coin. dpkg works at a basic level doing
    the work of installing and removing packages, while APT works at a higher level
    keeping track of what packages are installed.


    APT is very clever. Because it tracks everything, it will tell you if you try
    to install a software package that will cause trouble for an existing program.
    In most cases, it will offer a solution.


    Additionally, APT allows intelligent and efficient software updates—for both system
    software and applications.


    Updating is possible because not only does the APT know what''s already installed,
    but it also knows what''s available to be installed, including newer versions
    of already-installed software. This is made possible through the use of software
    repositories.


    # Software repositories


    It''s with the use of software repositories that Ubuntu departs most radically
    from how Windows handles software management.


    Repositories are large stores of packages. You might call them software libraries.
    Usually repositories are located online, but they can also be on CD/DVDs, or even
    a USB memory stick. The Ubuntu install CD is effectively a small repository, for
    example, containing only the software necessary for Ubuntu to be installed.


    A typical Windows user will source software by downloading from a website or buying
    a CD/DVD-ROM disc. Virtually any software you might want to install on Ubuntu
    will probably be found in the software'
  - '[PAGE 116]


    repositories. Therefore, installing new software is simply a matter of downloading
    and installing from the repositories.


    APT handles both of these tasks automatically. As a user, you will not have to
    handle any package files directly.


    The creation of such huge repositories of software is possible practically all
    the software used under Ubuntu is open source. The source code—the original listing
    created by programmers—is available for everybody to use and appropriate however
    they wish. The Ubuntu developers take the source code for 1,000s of applications
    and create their own versions, tweaking the software if necessary so it works
    well under Ubuntu. Then they file it away in the repositories, ready for download
    and installation by end users.


    NOTE Because Linux software uses an open source approach, there often isn''t "official
    version" of some programs. For example, if you visit the Gnome website (www.gnome.org)
    and try to download binaries of the desktop software, you will be told that you
    search the repositories of your Linux distribution instead.


    With Ubuntu it''s unusual that a user will visit a website and manually download
    new software, although there is a notable exception: software that it''s not yet
    included in the official repositories. Many Ubuntu power-users often download
    such software.


    NOTE In many cases, developer''s own personal repository. sign-up to the software
    repository is sometimes known as a Personal Package Archive, or PPA.


    Out of the box, Ubuntu is signed up to several official repositories. You can
    add-more repositories if you wish. This is useful when adding-in software that
    isn''t officially supported. How to add repositories is explained in the Working
    with Repositories section later in this chapter.


    # Dependency management


    Aside from the convenience (and luxury!) of having nearly all the world''s Linux
    software just a download away, the use of repositories has another benefit: dependency
    management.


    As mentioned earlier, a software package only contains the program itself. It
    does not contain any support software that might be needed, such as system libraries,
    or vital header applications. They must be downloaded and installed separately,
    and are nearly always available in a package of their own.'
