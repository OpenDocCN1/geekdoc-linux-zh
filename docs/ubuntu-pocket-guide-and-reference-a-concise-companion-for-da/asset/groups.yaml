    # A brief introduction


    The purpose of this chapter is to introduce you to the Ubuntu operating system,
    and the philosophy that underpins it.


    The fact you''re reading this book might mean you already know about Ubuntu, but
    one or two readers might have bought the Print Edition of this book (or downloaded
    the PDF) on a whim to see what the fuss is all about. These people might lack
    specifics, and remain unconvinced of the benefits of Ubuntu. So, I''m going to
    burn through some precious pages of this slim volume to evangelize and explain
    just a little.


    # What is Ubuntu?


    Ubuntu is a version of the Linux operating system. An operating system is the
    software that "runs your computer". Microsoft Windows is the world''s most popular
    operating system, at least for desktop computers, but Linux is a completely separate
    endeavor.


    # GNU


    The ball started rolling back in the 1980s, a hugely talented computer scientist
    Richard Stallman decided to create a clone of a venerable operating system called
    Unix. At the time, Unix ran many of the world''s industrial and academic computer
    systems.


    Stallman did this because Unix was becoming increasingly proprietary—it was no
    longer permitted to share its source code (the'
  - '[PAGE 11]


    listings created by programmers), as had happened since the inception of Unix
    in 1969.


    This was anathema to Stallman, who believed sharing software was natural and healthy.
    He decided his version of Unix would always be freely available, and invented
    the legal and ethical concept of Free Software says users should always have the
    freedom to share software, without restrictions. On a technical level, Free Software
    guarantees the right to view and also modify code, or even use it as a basis to
    make a new program. However, any additions or changes must be released as Free
    Software too, so others can continue to benefit.


    The Free Software ideal is enshrined in a software license applied to all Free
    Software projects. It''s the GNU Public License, or even use GPL. This is Microsoft''s
    End User Agreement that comes with Windows (or even whenever you install Windows
    (from scratch), except whereas the Microsoft EULA prohibits Windows under any
    circumstances, the GNU says exactly the opposite—that you can always share the
    software!


    Stallman called his version of Unix "GNU" (pronounced G-noo). This is a recursive
    acronym, for GNU''s Not Unix. In other words, the acronym refers to itself—a joke
    of type favored by programmers.


    # The Linux kernel


    GNU grew into a major project with many contributors. However, good as it was,
    it lacked a kernel. A kernel is the program at the heart of any operating system
    that takes care of fundamental stuff, like letting hardware communicate with software.


    Almost coincident, a chap Linus Torvalds provided a solution. In 1991 he started
    a personal project to create a kernel. Due to a naming error when his kernel was
    uploaded to the Internet, it got named after him and became known as Linux—a hybrid
    of "Linux" and "Unix".


    Crucially, Torvalds chose to release his kernel as Free Software, and invited
    any interested party to give him a hand. They did. Thousands of people around
    the world got involved. As the years went by, the project became more and important,
    and greater in its design and outlook. Today, the Linux kernel receives sponsorship
    from many major corporations, including IBM.


    > NOTE Torvalds continues to oversee and contribute to the Linux kernel project
    to this day. He humorously describes his role as a "benign dictator".'
- md: '

    Because the kernel is such an important aspect of an operating system, people
    began to refer to the combination of GNU and Linux simply as Linux. This upset
    Stallman, who asked that the name GNU/Linux be used instead. But it was too late.
    The name stuck.


    **NOTE** Whether to refer to the operating system as GNU/Linux or simply Linux
    is a debate that continues today.


    Software from other sources is typically included in the Linux operating system
    too, alongside GNU and the Linux kernel. Virtually all the software in Linux is
    Free Software, even though much of it has no direct ties with GNU or Richard Stallman.
    Arguably, Stallman''s greatest gift to the world was not the GNU software, but
    the concept of Free Software. Much of Stallman''s activity nowadays involves engaging
    around the world about Free Software.


    **NOTE** Often the open source is used instead of Free Software. It has a similar
    meaning—see www.opensource.org.


    ## Linux distros


    There isn''t just one version of Linux. There are hundreds. Versions are known
    as distributions of Linux, or distros for short. Examples of other distributions
    include Red Hat (www.redhat.com) and SUSE (www.suse.com), but there are many others,
    and new ones appear all the time.


    This variety is possible because of the freedom allowed by Free Software—anybody
    can take the source code and make their own version.


    Some distros are commercially sponsored, while others arose from the massive community
    of users around the world. Ubuntu is a little of both: it is sponsored by Canonical,
    a company founded by the entrepreneur Shuttleworth in 2004, but it also benefits
    from community support and is based on Debian (www.debian.org), a community-generated
    distro.


    ## What makes Ubuntu special


    Three things make Ubuntu stand out from the crowd:


    1. Focus on desktop users;

    2. The Ubuntu philosophy and community;

    3. Ease of use.


    Let''s take a closer look at each.


    ### Focus on desktop users


    Although it comes in versions for all kinds of computers, at its core Ubuntu is
    a distribution of Linux aimed primarily at desktop users. Most Linux distros are
    equally at home on desktop or server computers but lack polish when it comes to
    the desktop experience. Indeed, in many cases the needs of desktop users are an
    afterthought.


    In contrast, the desktop experience is something to which Ubuntu developers pay
    close attention. When Ubuntu was created back in 2004, Shuttleworth recorded the
    first bug in the online database. However, it wasn''t about software. Instead,
    it was a revolutionary call to arms to fix this bug in the PC marketplace.


    ### Philosophy and community


    As you have realized, Linux is as much a philosophy as it is an operating system.
    Ubuntu is no different.


    ### African values


    Ubuntu gets its title from an African concept that translates roughly as “humanity
    to others”. The term gained popularity in post-apartheid South Africa, where it
    stressed the importance of individuals recognizing their role within communities
    and being generous of spirit.


    When Shuttleworth founded the Ubuntu project in 2004, he drew up a philosophical
    statement based on this concept and on the principles of Free Software. In a nutshell,
    the Ubuntu project is driven by the idea that it should be possible for anybody,
    anywhere to use, share, or modify. This means the software should be accessible
    to them if they have a disability too. Ubuntu is free of charge like nearly all
    versions of Linux, also free for a set period after release (usually 18 months,
    but see the table on page 7 for more details).


    **NOTE** You can read more about the Ubuntu philosophy at www.ubuntu.com/community/ubistory/philosophy,
    and read more about the Free Software Foundation''s principles at www.gnu.org/philosophy/free-sw.html.
    Ubuntu represents freedom—freedom to use and share the software, to do what you
    want with it, and to learn.


    ### The community


    The Ubuntu community arose directly out of the Ubuntu philosophy. Put simply,
    people respect the principled stand Ubuntu takes. They also like the fact that
    Ubuntu focuses on the desktop experience. There have been many versions of Linux
    that, like Ubuntu, were aimed specifically at desktop users. Virtually all failed.
    This was because they compromised on components of Free Software principles. Maybe
    their version of Linux included proprietary installation programs that couldn''t
    be freely shared or modified. Sometimes they attempted to limit redistribution
    of their version of Linux.


    Ubuntu doesn''t do any of this. Its reward is a truly massive community of users
    around the world—arguably the biggest user-base of any version of Linux. It''s
    certainly one of the friendliest Linux communities. Shuttleworth takes a back
    seat, and apart from occasionally issuing releases, the community runs the show.
    Decisions about new features are made democratically, and many of its users help
    develop Ubuntu (provided they have the skills, of course).


    For a humble end-user of Ubuntu, the benefit of the Ubuntu community is found
    in the community sites like www.ubuntuforums.org where users hang out and help
    each other.


    **NOTE** It isn''t 100% accurate that Ubuntu doesn''t include proprietary software.
    A small amount of proprietary hardware firmware is provided to support wireless
    and graphics devices presently not fully supported by Free Software. This is seen
    a stopgap measure, however, until more acceptable alternatives become available.


    ### Ease of use


    Alongside strong principles and financial sponsorship, Shuttleworth brought something
    else to the Linux party: he wanted to make "Linux for human beings". Indeed, this
    is Ubuntu''s tagline.


    ### How it used to be


    To understand why this is important, let me recount an experience I had with Linux
    in 2002, before Ubuntu hit the scene. I wanted the wireless card in my notebook
    to connect to my network, but I couldn''t get it working under Linux. So, I asked
    for help on a popular forum. I received something similar to the following in
    my reply:


    > Getting the code to work is simple! Just grab the source code for the module
    and compile it against the kernel. insmod it then use iwconfig to configure a
    WEP password—


    Are you still reading? As you can tell, that''s a complex answer. It involves
    working the command-line, and requires knowledge of how Linux works on a very
    technical level. I knew the poster was talking about, although inwardly sighed
    at the amount of work involved. However, a newcomer was baffled.


    That''s how it was back then. Linux was “for techies only”. It was considered
    an industrial-strength operating system, and was brought with it nearly all standard
    hardware a steep learning curve that drove many away.


    ### How it is now


    Ubuntu changed everything. It focuses on the desktop user experience and, to this
    end, features graphical configuration software. It includes a wide variety of
    hardware drivers so nearly all standard hardware “just works”. Ubuntu comes with
    an installer program that doesn''t feature mind-boggling terminology, and updating
    the system takes just a few clicks of the mouse.


    To be fair, it can be argued Ubuntu was part of a broader revolution in desktop
    Linux, and several other versions of Linux were heading in the same direction.
    Ubuntu was the first to get there, and continues to lead the charge with each
    new release.


    While the command-line is still around, there''s no longer an obligatory requirement
    to use it. It''s often quicker and more efficient to use it, as you''ll find out
    later in this book, but you don''t have to. Ubuntu makes Linux truly accessible
    to all.

    '
