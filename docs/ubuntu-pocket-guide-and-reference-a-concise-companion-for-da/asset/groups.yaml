    # dependency


    程序运行所需的额外软件。


    # 依赖地狱 (dependency hell)


    一种用户手动尝试解决*安装或卸载软件时的*依赖问题*，结果却遇到了更多依赖需求的情况。


    # 桌面环境


    提供图形用户界面的软件，例如桌面、垃圾箱、文件管理器等。*Linux* 可用的示例包括 *Gnome*、*KDE 和 *Xfce*，但还有许多其他。


    # 设备文件


    通常包含在 /dev 文件夹中的特殊文件，用于访问硬件或内核提供的特定功能。


    # 目录


    文件系统文件夹的另一种术语。


    # 发行版 (distribution)


    *Linux 操作系统*的一个版本。简写为“distro”。


    # dpkg


    Debian 软件包系统；用于系统内和系统外软件的基础软件子系统。另见 *APT*。


    # 双启动


    如果 Windows 和 Ubuntu 安装在同一台电脑上，则称为双启动。如果安装了三个操作系统，电脑也可能是三启动。


    # E


    # ext3


    在 Ubuntu 以及许多其他 *Linux 发行版* 中使用的文件系统的底层技术。


    # F


    # 自由软件 (Free Software)


    *GNU 项目的 *Richard Stallman* 创造的术语，用于标识其*源代码*供所有人利用、检查、修改和重新分发的软件。另见 *GPL*。


    # 分叉 (splintering)


    将一个软件项目分裂为两个或多个单独（通常是独立的）项目。这是由于*开源软件*的性质导致的，其源代码是免费公开的。


    # Gnome


    *一种关注易用性和非技术用户的*桌面环境*。详见 www.gnome.org。该词曾是 GNU Network Object Model Environment
    的缩写，但已被弃用。另见 *KDE 和 *Xfce*。


    # GNU


    GNU''s Not Unix：一个所谓的递归缩写，指尝试重新创建 *Unix* 的 GNU 操作系统。另见 *GNU 项目*。


    # GNU/Linux


    任何利用 *GNU 软件并以 *Linux 内核为核心的操作系统的另一个术语。*Richard Stallman* 偏于使用这个术语，因为它承认了 *GNU
    项目*的贡献。


    # GNU 项目


    一种开创性的操作系统，完全使用*自由软件*重新创建古老的 *Unix 操作系统*。见 www.gnu.org。


    # GPL


    GNU 公共许可证；大多数*自由软件*项目在法律合同中使用的软件许可，授予用户查看、研究、修改和重新分发软件*源代码*及其未来迭代版本的权利。*较小 GPL
    (LGPL)* 放弃了 GPL 的部分要求，通常用于启用库文件的重新分发。


    # grep


    全局正则表达式打印；*一种提供强大搜索功能的*shell 命令*。在 *Linux/*Unix 圈中，“grep”一词与搜索同义；“grep 一个文件”意思是对该文件进行搜索。


    # 黑客技巧 (hack)


    解决问题的方法，通常是巧妙或临时的方法。另见 *hacker*。


    # 黑客 (hacker)


    *Unix（以及延伸的 Linux）的*程序员或用户*。这个词在 20 世纪 80 年被媒体劫持，特指计算机犯罪分子。许多真正的黑客对这种重新分类表示反对，并使用*破解者
    (cracker)* 来描述这类人。


    # KDE


    K 桌面环境；*Kubuntu 使用的*桌面环境*，优于 *Gnome*。另见 *Gnome 和 *Xfce*。


    # 内核恐 (kernel panic)


    涉及*Linux 内核*的崩溃。通常发生时，屏幕上会出现“kernel panic”字样。


    # Kubuntu


    Ubuntu 的版本，使用 *KDE 而不是 *Gnome 作为其*桌面环境*。少数图形工具与 Ubuntu 主版本不同，但这些项目在技术上是完全相同的，并按照相同的进度发布。


    # LAMP


    *Linux、*Apache、MySQL 和 PHP*；用于 web*服务器*电脑的软件组合。


    # 链接 (link)


    为文件提供文件系统快捷方式的方法。链接可以是符号链接，也可以硬链接。


    # Linux


    技术上讲，Linux 是一个内核程序。当用于描述操作系统时，“Linux”指的是对 *Unix 操作系统*的创建，通常使用*自由软件*。


    # 日志 (log)


    包含各种情况详情的文件，以及发生的时间。通常用于诊断目的。


    # md5sum


    为文件创建唯一校验和的软件，以区分文件是否完整或被损坏。


    # 模块 (module)


    可以从 *Linux 内核中插入或移除的软件。


    # 挂载 (mounting)


    使文件系统可访问的过程。


    # NFS


    网络文件系统；一种允许跨网络共享的软件。


    # 开源 (open source)


    在软件语境下，开源指的是。


    # 软件包 (package)


    一个包含可安装软件的存档文件。


    # 分区 (partition)


    磁盘的一部分。


    # 程序员


    创建软件的个人（或组织）。


    # PPA


    个人包存档；sompository。


    # 正则表达式 (regular expression)


    一种使用各种符号精确描述字符串的方法。也称为 *regex*。


    # 相对路径 (relative path)


    相对于当前浏览目录的文件位置描述。


    # 仓库 (repository)


    通常在线的*软件包*集合。


    # 根 (root)


    在文件系统的上下文中，根是文件系统的底部，用斜杠 (/) 表示。相当于 Windows 下的 C:\根分区是启动操作系统所需的磁盘。


    # root 用户


    管理员账户。


    # 运行级别 (run level)


    *Linux 的运行模式——哪些*服务*正在运行，因此哪些功能可用。


    # Samba


    允许 Ubuntu 访问 Windows 电脑上的共享文件/打印机的后台软件，并使其本身也能共享文件/打印机。


    # 脚本 (script)


    本质上是形成基础程序的命令链。脚本在 *Linux 启动时被广泛使用，以便为用户配置系统。


    # 服务器


    与*客户端共享数据或资源的电脑（或程序）。


    # 服务


    任何在后台运行以向用户或操作系统提供基本功能的软件。


    # shell


    任何允许用户与计算机交互的软件，但该术语通常指*命令行*。另见 *bash*。


    # 源代码


    有时简称为“源码”；*程序员创建的原始列表。


    # Shuttleworth, Mark


    创建 Ubuntu 的南非企业家，并建立了 Ubuntu 基金会作为该基金会的官方之家。此外，他还拥有并运营 Canonical Ltd，该公司商业赞助 Ubuntu
    及多个相关项目。Canonical 还提供付费支持服务。


    # ssh


    安全外（Secure Shell）；一种提供对计算机加密远程访问的软件。


    # Stallman, Richard


    传奇*黑客*，创立了 *GNU 项目以及自由软件基金会 (FSF)，该组织致力于推动他发明的*自由软件*事业。


    # 标准输入、输出和错误


    简单来说，标准输入是在*命令行*处提供输入的设备。通常等同于键盘。标准输出是指在命令行显示输出的设备。


    '
