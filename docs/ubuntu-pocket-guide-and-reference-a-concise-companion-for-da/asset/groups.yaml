    # CHAPTER ONE


    # Installing Ubuntu


    This chapter explains the methods used to install Ubuntu on a computer. Additionally,
    you''ll learn how to:


    +   - Choose a version (and release) of Ubuntu that''s right for you;

    - Undertake preparatory work to ensure that installation runs smoothly;

    - Create your own Ubuntu installation CD-ROM;

    - Install Ubuntu on problematic computers;

    - Install Ubuntu on Intel-based Apple Macintosh computers.


    # Types of installation


    Installing Ubuntu is much easier than you might think and there are essentially
    three ways of doing so, as follows:


    # #1: Dual-booting


    If you intend to switch to Ubuntu full-time, installing Ubuntu by repartitioning
    your computer''s hard disk is best. This involves shrinking the existing Windows
    partition and creating new partitions alongside Ubuntu. Following this, Ubuntu
    is installed and a menu added so you can choose between Ubuntu and Windows at
    boot-time. Having Ubuntu and Windows side-by-side on a PC is called dual-booting.


    This sounds complex, but it''s automated via the Ubuntu installation software.
    However, there''s a slight risk involved when repartitioning, so it''s very wise
    to backup essential data first.'
  - '[PAGE 19]


    NOTE Instead of repartitioning, some users choose to wipe Windows from the hard
    disk and install Ubuntu in its place. This can also be done using the above installation
    method.


    # #2: Installing within Windows


    Wubi is Windows software that installs Ubuntu within a series of virtual hard
    disk files contained in the Windows filesystem. It then configures a boot-time
    menu so you can choose to boot into Ubuntu or Windows. If you choose to boot into
    Ubuntu, a clever trick makes the virtual hard disk files appear to be disks. As
    a result, the user will be entirely unaware they''re not using a traditional partition-based
    installation, as described previously.


    Using Wubi to install Ubuntu is just like installing some Windows software, and
    is quite risk-free. There is an uninstall option added to Add/Remove Programs.
    The only drawback is a slight reduction in performance compared to a traditional
    installation, and you''ll also find the Ubuntu suspend-to-disk (hibernate) power-saving
    mode doesn''t work.


    > TIP You can still use the "sleep" power saving mode that suspends most of your
    computer''s components except RAM.


    # #3: Virtual computer


    By downloading a virtual application, such as the free-of-charge VMware Player
    (www.vmware.com/products/player), you can install Ubuntu so it runs within a program
    window on the Windows desktop.


    A virtual computer is effectively a complete computer recreated in software. It
    offers an excellent way to trial booting into Ubuntu, although the limitations
    of the virtual computer software mean you won''t experience Ubuntu to its full
    advantage (desktop visual effects won''t work, for example). Additionally, you''ll
    need a powerful PC with over 1GB of memory for optimal results.


    # Preparing your PC for Ubuntu


    Before installing Ubuntu, some preparatory work within Windows is advisable.


    # Ensuring disk space is free


    Regardless of what installation method you choose, you''ll need at least 5GB of
    free disk space for Ubuntu. For an installation you intend to use full-time, you''ll
    probably need much more.


    2 : Installing Ubuntu'
  - '[PAGE 20]


    If your computer''s hard disk is low on free disk space, you''ll need to either
    uninstall some software using Add/Remove Programs in the Control Panel, or delete
    data. Multimedia files take-up most space.


    Alternatively, if using a desktop PC, you can add an additional hard disk to your
    computer, onto which you can install Ubuntu. Unlike some versions of Windows,
    Ubuntu can be installed on disks that aren''t the primary hard disk in the system.


    +   * TIP Ubuntu 8.10 lets you install Ubuntu onto a USB memory stick, but performance
    is very poor and far from ideal for day-to-day use.


    # # Defragmenting the hard disk


    Once you''re sure there''s enough free space, you should defragment the hard disk.
    It is necessary because, if you use Wubi, you''ll create multi-gigabyte files
    while installing Ubuntu. For reasons of performance, it''s best if these are contiguous,
    rather than fragmented around the disk.


    If you choose the repartitioning option to install Ubuntu, you may find that the
    Windows partition won''t resize successfully if it is too fragmented. There''s
    even a risk of data loss.


    To defrag under Vista, open Computer on the Start menu, and right-click the hard
    disk icon. Select Properties and then the Tools in the dialog appears. Click the
    DEFRAGMENT NOW button, and click the button with the same label in the dialog
    box that appears.


    Under XP, open My Computer, right-click the hard disk icon, click Properties,
    then the Tools tab, and click the DEFRAGMENT NOW button. Click the DEFRAGMENT
    button in the program window that appears.


    # # Checking the Windows filesystem for errors


    It''s a good idea to periodically check the Windows filesystem for errors under
    any circumstances, but it''s vital if you opt to install Ubuntu by repartitioning
    the hard disk. If there are errors, repartitioning will fail. There''s even a
    chance of data corruption.


    To force a disk check in Windows, click Ctrl-> cmd, and in the DOS window that
    appears, type chkdsk /f. Type Y when prompted, reboot. Under Windows Vista, click
    the Start button, then type cmd into the Start search field. However, *don''t*
    hit Enter! Instead type Ctrl+Shift+Enter. This will run the DOS window in'
