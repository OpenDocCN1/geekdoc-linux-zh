    appear informing you that updates are available.


    Clicking the icon will show a list of packages that can be updated.


    +   Any software installation application is closed first, such as Synaptic. Only
    one software administration tool can run at any time. This includes command-line
    tools.


    It''s not absolutely essential to read through the list of updates, doing so will
    only take a minute or two, and it''s a good idea to keep track of what''s being
    updated. Assuming you''re happy with the list of updates, click the INSTALL UPDATES
    button to automatically download and install the software.


    If desired, you can force Update Manager to run by clicking its entry on the System
    ⇼ Administration menu and clicking the CHECK button when the program window appears.


    Depending on what system components are updated, you may have to restart your
    computer to complete installation. You''ll know if this is the case because the
    update manager icon will change to two circular arrows that, when clicked, will
    prompt you to reboot the computer.


    When a new release of Ubuntu becomes available, Update Manager informs you via
    a pop-up window. You can then choose to upgrade (or, if you do not wish to).


    # Updating at the command-line


    To update at the command-line, two sets of commands can be issued:


    +   - sudo apt-get update

    - sudo apt-get upgrade


    or


    +   - sudo apt-get update

    - sudo apt-get dist-upgrade


    sudo apt-get update grabs the latest list of packages, so should always be used
    before updating.


    sudo apt-get-dist-upgrade updates all software packages to the latest available
    versions. If you wish to update the system manually at the command-line, this
    command should be issued weekly. In contrast, sudo apt-get-dist-upgrade updates
    the entire system, including several vital system files, thereby Ubuntu to the
    latest release. If run on an 8.04 system, for example, it will update Ubuntu to
    8.10. It should be run only when you know a new release to be available.


    116 : Securing the System'
  - '[PAGE 134]


    # Configuring the firewall


    Ubuntu contains a very powerful firewall called netfilter that is part of the
    central kernel program. However, it isn''t active by default, and must be manually
    configured. The reason for this is that Ubuntu has no outward-facing services.
    If you imagine Ubuntu as a house, you could say that it has no windows or doors
    through intruders can gain access. All incoming connections hit a brick wall.


    However, despite this fundamental protection, hackers are ingenious and there
    can be no room for complacency. Configuring the firewall using a GUI application
    like Firestarter, as described below, is so easy that there''s little reason not
    to do so.


    +   TIP The ufw command can be used to configure the firewall at the command-line.
    This is relatively simple to use, but is still not straightforward for a GUI application
    like Firestarter. For details, see http://ubuntuforums.org/showthread.php?t=823741.


    # Installing and Configuring Firestarter


    Firestarter is a simple yet powerful firewall configuration tool. To install it,
    start Synaptic and search for firestarter. Put a check in the box alongside the
    firestarter entry in the results list and select Mark for Installation from the
    menu that appears. Click the APPLY button on the toolbar, and the APPLY button
    in the dialog box appears.


    There''s no need to restart because Ubuntu''s firewall component can be started,
    stopped and reconfigured when the system is up and running. However, it is necessary
    to complete an initial wizard to configure Firestarter itself, so start the program
    by clicking System ⇨ Firestarter to run through this.


    > NOTE Bear in mind that there''s no reason to have the Firestarter configuration
    program running to enjoy the protection of Ubuntu''s firewall. All Firestarter
    does configure Ubuntu''s built-in firewall. It isn''t a firewall application in
    itself.


    Click the FORWARD button to work through the wizard. When asked to select the
    device you wish to protect, select the connection type from the Detected Device(s)
    dropdown list. If you''re using a wireless connection, ensure the list reads Wireless
    Device, or similar (see Figure 7-1). Bear in mind that "Ethernet" refers to a
    wired connection, wherein the computer is connected by cable to a router, switch,
    or hub.


    Leave the other options as they are and click FORWARD to work through the wizard
    to completion. At the end, click the SAVE button.


    ![](img/acd1f85da6741773b2c9559b2eb5033d_134_0.png)'
  - '[PAGE 135]


    ![](img/acd1f85da6741773b2c9559b2eb5033d_135_0.png)


    In its default state, Firestarter turns-away all incoming data, while all out-going
    data is permitted through the firewall. As such, it is little different from the
    default Ubuntu state of affairs.


    > NOTE On a technical level, Firestarter works by letting you allow and deny individual
    TCP/UDP ports. There''s not really any need to understand this to configure Firestarter,
    but it will certainly help if you want to create more elaborate arrangements.
    Many websites offer explanations of how TCP and ports work—just hit Google.


    Two types of rules can be created: inbound rules, that allow connections from
    the network or Internet, and outbound rules, that can block unauthorized data
    emissions from your computer, such as those from potential virus infections, or
    spyware.


    > NOTE There are no viruses or spyware infestations affecting Linux. However,
    this is almost certain to change as versions of Linux like Ubuntu become more
    popular.


    # Creating inbound rules


    Inbound rules allow you to filter all incoming connections. By default, all uninvited
    incoming connections are turned away. Creating an inbound rule effectively allows
    you to create a "hole" in the firewall for certain types of connection to get
    through, as needed by particular programs. This can be useful if you run file
    sharing software on your computer, for example, such as Transmission (Applications),
    that uses BitTorrent to share files.


    Additionally, you can choose to let some inbound connections through, but only
    if they originate on the local network (i.e. within a particular IP'
- md: '

    address range). This can be useful in the case of shared folders, for example,
    where other computers in your workplace or home may wish to access files on your
    computer.


    Here are the steps required to create an in-bound rule:


    +   1. Start the Firestarter configuration program, if it isn''t already running,
    clicking System ⇨ Administration ⇨ Firestarter. You''ll need to type your password
    when prompted.


    +   2. Click the Policy tab in the program window, and ensure Inbound Traffic
    Policy is selected in the Editing dropdown list.


    +   3. Under the Allow Service in the lower-half of the program window, right-click
    and select Add Rule from the menu that appears.


    +   4. In the dialog box that appears, select from the Name dropdown list the
    program that you''d like to allow through the firewall. For example, to allow
    BitTorrent, select in that list. To let others access shared folders on your computer,
    select Samba (SMB). Note that the Port field will be automatically filled in once
    you make your selection. You can edit this if you wish, but there should be no
    need.


    +   5. If the rule relates to inbound connections from the Internet, ensure the
    Anyone radio button is selected under the When Source heading.


    +   6. To limit the type of incoming connection to the local network, and not
    the entire Internet, you''ll need to find out the IP, Host or Network radio range
    that your computer is part of. To do so, right-click the NetworkManager icon on
    the top-right of the screen, and select Connection Information. Look in the IP
    Address line within the dialog box that appears, and make a note of the first
    three numbers. On my test PC, this line read 192.168.1.5, so I made a note of
    192.168.1.


    +   7. Back in Firestarter''s rule creation dialog box, type the numbers, followed
    by a period, then a zero. So, in my case I typed 192.168.1.0. Then add a forward
    slash, and type 24. On my PC the entire line read 192.168.1.0/24.


    +   8. Once done, click the ADD button, and then the APPLY POLICY button on the
    toolbar. Then close Firestarter.


    9. However, if you''re adding a rule to allow access to Samba shared folders on
    the computer, another step is necessary to let other computers “see” the shared
    resources across the network. Click Edit ↩ Preferences within Firestarter, and
    on the left of the dialog box that appears, click the Advanced Options entry in
    the list. Remove the check from Block Broadcast From External Network. Click ACCEPT
    when done.


    The new rule will take effect immediately. To delete it at a later stage, start
    Firestarter, right-click the rule, and click Remove Rule. Then click the APPLY
    POLICY button.


    ## Creating outbound rules


    When it comes to blocking data emanating from your computer, Firestarter can enact
    two different modes: whitelist, and blacklist.


    -   **Whitelist:** In this mode, network traffic is not allowed out of the computer
    unless a rule allows it. This is also known as a restrictive policy.


    -   **Blacklist:** In this mode, which is default, all traffic is allowed out
    of the computer unless a rule specifically forbids it. This is also known as a
    permissive policy.


    Whitelist mode undoubtedly offers the most secure protection, but at the expense
    of having to create a rule for each type of outbound connection you''re likely
    to make. You will need to make individual rules for connections emanating from
    all the software on your system: web, instant messaging, and so on.


    > NOTE You will need to create two rules for connections: one for standard HTTP,
    and another for HTTPS secure connections, such as those used by online shops,
    banks and email services. Additionally, some websites insist on using non-standard
    port numbers, in which case they will be blocked to you unless you create a custom
    rule allowing that particular port.


    You can switch between the modes by clicking the Policy tab in the Firestarter
    window, selecting Outbound Traffic Policy from the Editing dropdown list, and
    clicking the radio button alongside entry.


    Here''s how to create an outbound rule regardless of what policy you decide upon:


    +   1. Ensure the Policy tab is selected within Firestarter and right-click beneath
    the Deny Service (or Allow Service) heading near the bottom of the program window.
    In the menu that appears, select Add Rule.


    +   2. As creating rules, select the type of connection you''d like to allow/deny
    From the Name dropdown list. Ignore the sections beneath the When Source Is heading—they
    are only for use if Firestarter is managing Internet connection sharing on your
    computer.


    +   3. To create a custom rule for a particular port number, manually type a name
    of your own when choosing into the Name field (although this is a dropdown list
    you can still type within it), and type the port number into the Port box.


    > TIP If you opted for a whitelist (restrictive) policy, at the very least you
    should create individual rules for HTTP, HTTPS, POP3, and SMTP. For a complete
    list of popular TCP/IP ports, that you can use to create additional rules, see
    http://en.wikipedia.org/wiki/Port_number.


    +   4. When, click the ADD button, and the APPLY POLICY button on the main toolbar.
    Then close Firestarter.


    The new rules take effect immediately. To delete a rule at a later stage, right-click
    it and select Remove Rule. Then click APPLY POLICY.


    ## Turning off diagnostic tool responses


    There''s an additional step you can take to protect your computer from potential
    Internet threats: turning off responses to diagnostic tools. However, turning
    off responses to diagnostic tools. This can be useful when designing network problems.


    To turn off diagnostic responses, click Edit ↩ Preferences within Firestarter,
    and on the left of the dialog box that appears, click the Advanced Options entry
    in the list. Remove the check from Block Broadcast From External Network. Click
    ACCEPT when done.


    The new rule will take effect immediately. To delete it at a later stage, start
    Firestarter, right-click the rule, and click Remove Rule. Then click the APPLY
    POLICY button.


    ## Installing antivirus


    Many people say using an antivirus program with Ubuntu is not necessary. It''s
    hard to argue. There are practically no viruses or malware for Linux at the present
    time. There''s some debate about whether this will change in future, but right
    now an Ubuntu user is quite simply safe.


    However, aside from guarding against future threats, installing an antivirus program
    allows you to watch out for Windows or even Mac viruses in files sent to you.
    Therefore, you can avoid passing virus-infected files that might affect those
    running non-Linux systems.


    > TIP Why not convert your friends or colleagues using Ubuntu? The fact Ubuntu
    is immune to viruses is a very persuasive argument in its favor. If you convert
    them, be sure to suggest they get a copy of Ubuntu Pocket Guide and Reference
    to help them get started!


    There is a variety of commercially sold antivirus programs for Linux, but perhaps
    the best choice from an open source perspective is ClamAV. This is industrial-strength
    antivirus designed for server computers, but you can also install ClamTK, a small
    program that provides a graphical front end, and thereby makes ClamAV suitable
    for humble users.


    ### Installing ClamTK


    Start Synaptic and search for clamtk. Put a check alongside the clamtk entry in
    the results, and click Mark for Installation in the menu that appears. Agree to
    install the list of dependencies, that includes ClamAV itself, and then click
    the APPLY button on the toolbar.


    When ClamTK runs for the first time it is necessary to update the virus database.
    In future this will be done automatically and periodically in the background,
    without any need for user intervention.


    To manually update the database, ClamTK needs to run as root user, so open a terminal
    window (Applications ↔ Accessories ↔ Terminal), and type the following:


    +   gksu clamtk


    Click Help ↔ Update Signatures. Once ClamTK reports the signatures are up to date,
    close the program window.


    > TIP You can update your virus database at the command-line by typing freshclam.
    Don''t worry, while doing this, you see a warning that ClamAV is out-of-date—this
    simply means that the version offered in the Ubuntu repositories is lagging little
    behind the main releases. This is not an issue.


    ### Scanning for viruses


    To start ClamTK, click Applications ↔ System Tools ↔ Virus Scanner.


