    ## Changing ownership


    The `chown` command is used to change the owner of a file. To change the owner
    of report.doc to frank, you would type:


    ```bash

    chown frank report.doc

    ```


    This changes the owner of the file to frank. To change both the owner and the
    group at the same time, use a colon:


    ```bash

    chown frank:accounts report.doc

    ```


    This changes the owner to frank and the group to accounts.


    ## Changing group


    The `chgrp` command is used to change the group of a file. To change the group
    of report.doc to accounts, you would type:


    ```bash

    chgrp accounts report.doc

    ```


    This changes the group of the file to accounts. To change both the owner and the
    group at the same time, use a colon:


    ```bash

    chown frank:accounts report.doc

    ```


    This changes the owner to frank and the group to accounts.


    ## Changing permissions


    The `chmod` command is used to alter the mode of a file. There are various ways
    to use it, but the easiest is to use the symbolic notation. This uses u for user,
    g for group, and a for all, combined with + to add permission, - to remove it,
    and = to set it.


    For example, to add execute permission for the owner, you would type:


    ```bash

    chmod u+x report.doc

    ```


    This adds (+) execute (x) permissions for the user (u).


    To remove write permission from the group, you would type:


    ```bash

    chmod g-w report.doc

    ```


    This removes (-) write permission (w) from the group (g).


    To set permissions for all to read-only, you would type:


    ```bash

    chmod a=r report.doc

    ```


    This sets the permissions for all to read-only (r).


    > TIP: You can also use the numerical notation with chmod. Each digit represents
    the permissions for owner, group, and others. The digits are 4 for read, 2 for
    write, and 1 for execute. For example, `chmod 754 report.doc` sets read, write,
    and execute for the owner, read and execute for the group, and read for others.


    ## Changing folder permissions


    Folders are handled in the same way, although allow/deny access to the folder,
    the execute (x) permission is unset/unset.


    The following will stop everybody apart from the folder''s owner reading a file
    listing of the Documents folder, reading/writing files, and switching into it:


    ```bash

    chmod go-rwx Documents

    ```


    In other words, this makes the folder entirely private.


    > NOTE: Under Ubuntu each user is assigned to their own personal group, this policy
    effectively means that group permissions are irrelevant for personal files unless
    you were specifically to add another user to your personal group. However, it''s
    still important you understand the concept of groups and how it applies to file/folder
    permissions.


    Subfolders within a folder inherit the execute permissions of the parent folder.
    In other words, if it''s not possible to access the Music folder because the execute
    permission isn''t set, you won''t be able to access a folder within it even if
    permissions are set correctly for that subfolder.

