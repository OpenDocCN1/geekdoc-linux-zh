    ### 入门 Ubuntu Linux，第三版 / Apress


    ISBN 978-1590599914


    全面的、获奖的指南。在 700 多页中实现从零到英雄的跨越！


    # 简介


    本章的目的是向你介绍 Ubuntu 操作系统以及支撑它的哲学思想。


    你正在阅读这本书可能意味着你已经了解了 Ubuntu，但可能有一一两个读者是出于冲动购买了这本书的纸质版（或下载了 PDF），想看看到底在忙什么。这些人可能缺乏具体的了解，并且对
    Ubuntu 的优点仍不信服。因此，我将利用这本薄书中的一些宝贵篇幅来传道并解释一下。


    # 什么是 Ubuntu？


    Ubuntu 是 Linux 操作系统的一个版本。操作系统是“运行你的计算机”的软件。Microsoft Windows 是世界上最流行的操作系统，至少对于台式电脑而言是，但
    Linux 是一个完全不同的尝试。


    # GNU


    这一切始于 20 世纪 80 年代，一位非常有才华的计算机科学家 Richard Stallman 决定创建一个名为 Unix 的老牌操作系统的克隆。当时，Unix
    运行着世界上许多工业和学术计算机系统。


    Stallman 这样做是因为 Unix 变得变得越发私有化——它不再允许共享其源代码（程序员创建的列表），而这自 1969 年 Unix 诞生以来一直都在发生。


    这对于 Stallman 来说是不可理喻的，他认为共享软件是自然且健康的。他决定他版本的 Unix 将始终免费可用，并发明了法律和伦理层面的概念——即**自由软件**（Free
    Software），认为用户应该始终拥有共享软件的自由，而不受任何限制。在技术层，自由软件保证了查看和修改代码的权利，甚至可以将其作为创建新程序的依据。然而，任何添加或更改都必须作为自由软件发布，以便他人能够继续受益。


    自由软件的理想被载于所有自由软件项目的软件许可中。它是 GNU 公共许可证（GNU Public License），或者简称为 GPL。这是 Windows
    附带的微软用户许可协议（或者每当你从头开始安装 Windows 时），但不同的是，微软的 EULA 在任何情况下都禁止 Windows，而 GNU 的说法恰恰相反——你永远可以共享软件！


    # Stallman 将他的 Unix 版本称为“GNU”（读音为 G-noo）。这是一个递归缩写，代表“GNU''s Not Unix”（GNU 不是 Unix）。换句话说，这个缩写指的是它自己——这是一种程序员喜欢的笑话。


    # Linux 内核


    GNU 发展成了一个拥有许多贡献者的重大项目。然而，尽管它很好，但它缺乏一个内核。内核是任何操作系统核心的程序，负责处理基础事务，例如让硬件与软件进行通信。


    巧合的是，一位名叫 Linus Torvalds 的家伙提供了一个解决方案。1991 年，他启动了一个个人项目来创建一个内核。由于他的内核上传到互联网时出现命名错误，它以他的名字命名并被称为
    Linux——“Linux”和“Unix”的混合体。


    至关重要的是，Torvalds 选择将他的内核作为自由软件发布，并邀请任何感兴趣的人为他提供帮助。他们做到了。全球数千万的人参与了进来。随着时间的推移，该项目变得更加重要，在设计和前景上变得更加宏大。今天，Linux
    内核获得了包括 IBM 在内的许多大型企业的赞助。


    > 注意 Torvalds 至今仍在监督并贡献 Linux 内核项目。他幽默地将自己的角色描述为“仁慈的独裁者”。


