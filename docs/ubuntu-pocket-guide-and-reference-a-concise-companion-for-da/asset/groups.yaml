    +   2. 点击程序窗口中的策略（Policy）**选项卡，并确保在编辑（Editing）下拉列表中选择了“入站流量策略（Inbound Traffic
    Policy）”。


    +   3. 在程序窗口下半部分的允许服务（Allow Service）下，右键点击并从出现的菜单中选择“添加规则（Add Rule）”。


    +   4. 在弹出的对话框中，从名称（Name）下拉列表中选择你想要通过防火墙的程序。例如，要允许 BitTorrent，请在该列表中选择。要让其他人访问你计算机上的共享文件夹，请选择
    Samba (SMB)。注意，一旦你做出选择，端口（Port）字段将自动填充。如果你需要，可以进行编辑，但通常没有必要。


    +   5. 如果规则涉及来自互联网的入站连接，请确保在“源（When Source）”标题下选择了“任意（Anyone）”单选按钮。


    +   6. 要将传入连接类型限制在本地网络而非整个互联网，你需要找到计算机所处的 IP、主机或网络范围。要这样做，右键点击屏幕右上角的 NetworkManager
    图标，并选择“连接信息（Connection Information）”。查看出现对话框中的“IP 地址”行，并记下前三个数字。在我的测试 PC 上，此行显示为
    192.168.1.5，所以我记下了 192.168.1。


    +   7. 回到 Firestarter 的规则创建对话框，输入数字，后跟一个点，然后是一个零。例如，在我的情况下，我输入了 192.168.1.0。然后添加一个斜杠，并输入
    24。在我的 PC 上，整行显示为 192.168.1.0/24。


    +   8. 完成后，点击添加（ADD）按钮，然后点击工具栏上的应用策略（APPLY POLICY）按钮。最后关闭 Firestarter。


    9. 然而，如果你正在添加规则以允许访问计算机上的 Samba 共享文件夹，则需要另一个步骤让其他计算机跨网络“看到”共享资源。在 Firestarter
    中点击编辑（Edit） ↩ 选项（Preferences），在出现的对话框左侧，点击列表中的“高级选项（Advanced Options）”项。取消勾选“阻止外部网络广播（Block
    Broadcast From External Network）”。完成后点击接受（ACCEPT）。


    新规则将立即生效。要在稍后删除它，启动 Firestarter，右键点击该规则并点击“删除规则（Remove Rule）”。然后点击应用策略（APPLY POLICY）按钮。


    ## 创建出站规则


    涉及到阻止从计算机发出的数据，Firestarter 可以执行两种不同的模式：白名单（whitelist）和黑名单（blacklist）。


    -   **白名单：** 在此模式下，除非规则允许，否则网络流量将不允许离开计算机。这也被称为限制性策略。


    -   **黑名单：** 在此模式下（默认模式），除非规则明确禁止，否则允许所有流量离开计算机。这也被称为许可策略。


    白名单模式无疑提供了最安全的保护，但代价是必须为你可能进行的每种类型的出站连接创建一个规则。你需要为来自系统中所有软件发出的连接创建单独的规则：网络、即时消息等。


    > 注意：你需要为连接创建两个规则：一个用于标准 HTTP，另一个用于 HTTPS 安全连接（例如在线商店、银行和电子邮件服务所使用的连接）。此外，某些网站坚持使用非标准端口号，在这种情况下，除非你创建一个允许该特定端口的自定义规则，否则它们将对你屏蔽。


    你可以通过点击 Firestarter 窗口中的策略（Policy）选项卡，在编辑（Editing）下拉列表中选择“出站流量策略（Outbound Traffic
    Policy）”，并点击条目旁边的单选按钮来切换模式。


    以下是无论你决定采用什么策略如何创建出站规则的方法：


    +   1. 确保在 Firestarter 中选择了策略（Policy）选项卡，并在程序窗口底部附近的“拒绝服务（Deny Service）”（或“允许服务（Allow
    Service））标题下方右键点击。在出现的菜单中，选择“添加规则（Add Rule）”。


    +   2. 在创建规则时，从名称（Name）下拉列表中选择你想要允许/拒绝的连接类型。忽略“源为（When Source Is）”标题下的部分——它们仅用于
    Firestarter 管理你计算机上的互联网连接共享时。


    +   3. 要为特定端口号创建自定义规则，在选择名称（Name）字段时手动输入你自己的名称（尽管这是一个下拉列表，你仍然可以在其中输入内容），并将端口号输入到端口（Port）框中。


    > 提示：如果你选择了白名单（限制性）策略，你至少应该为 HTTP、HTTPS、POP3 和 SMTP 创建单独的规则。有关你可以用于创建额外规则的常用 TCP/IP
    端口完整列表，请参阅 http://en.wikipedia.org/wiki/Port_number。


    +   4. 完成后，点击添加（ADD）按钮，并点击主工具栏上的应用策略（APPLY POLICY）按钮。然后关闭 Firestarter。


    新规则立即生效。要在稍后阶段删除规则，右键点击它并选择“删除规则（Remove Rule）”。然后点击应用策略（APPLY POLICY）。


    ## 关闭诊断工具响应


    你还可以采取额外的步骤来保护你的计算机免受潜在的互联网威胁：关闭对诊断工具的响应。然而，关闭对诊断工具的响应在设计网络问题时可能有用。


    要关闭诊断响应，在 Firestarter 中点击编辑（Edit） ↩ 选项（Preferences），在出现的对话框左侧，点击列表中的“高级选项（Advanced
    Options）”项。取消勾选“阻止外部网络广播（Block Broadcast From External Network）”。完成后点击接受（ACCEPT）。


    新规则将立即生效。要在稍后删除它，启动 Firestarter，右键点击规则并点击“删除规则（Remove Rule）”。然后点击应用策略（APPLY POLICY）。


    ## 安装杀病毒软件


    许多人说在 Ubuntu 上使用杀病毒软件是没有必要的。这很难反驳。目前 Linux 几乎没有病毒或恶意软件。关于未来是否会发生存在争议，但目前 Ubuntu
    用户是非常安全的。


    然而，除了防御未来的威胁，安装杀病毒软件可以让你检查发送给你的病毒。因此，你可以避免影响非 Linux 系统的文件。


    > 提示：为什么不转换你的使用 Ubuntu 的同事？Ubuntu 免疫病毒是一个非常有说服力的论据。如果你转换他们，请确保他们买一本《UbuntuPocket指南与参考》来开始！


    市上有多种 Linux 杀病毒软件，但从开源的角度来看，最好的选择可能是 ClamAV。这是一种为服务器计算机设计的工业级杀病毒软件，但你也可以安装 ClamTK，它提供了一个图形化界面，从而使
    ClamAV 适用于普通用户。


    ### 安装 ClamTK


    启动 Synaptic 并搜索 clamtk。在结果中勾选 clamtk 条目，并在出现的菜单中点击“标记为安装（Mark for Installation）”。同意安装依赖列表（包括
    ClamAV 本身），然后点击工具栏上的应用（APPLY）按钮。


    当 ClamTK 首次运行时需要更新病毒数据库。以后这将在后台自动定期完成，无需用户干预。


    要手动更新数据库，ClamTK 需要以 root 用户身份运行，因此打开终端窗口（应用程序 ↔ 附件 ↔ 终端），并输入以下：


    +   gksu clamtk


    点击帮助（Help） ↔ 更新签名（Update Signatures）。一旦 ClamTK 签名是最新的，关闭程序窗口。


    ### 扫描病毒


    要启动 ClamTK，点击应用程序 ↔ 系统工具 ↔ 病毒扫描器。


