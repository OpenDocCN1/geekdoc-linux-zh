    # Adding a new repository key


    Sometimes a repository contains digitally signed packages. Signing is a method
    of ensuring packages haven''t been tampered with, or forged. The programmer stamps
    each package with an ID that only she can create. This is done using a cryptographic
    key, the public component of which is offered for download and must be installed
    by end users.


    You can add the public key to your system in the following way:


    +   1. The key is usually offered for download at the same place you''ll find
    the package—it will have an .asc or .pgp file extension. Right-click it and select
    Save As, save it to disk. Be sure to download the key only from the package creator''s
    website, and not a mirror site. After all, it''s possible the key may have been
    tampered with.


    +   2. In the Software Sources program, click the Authentication tab and click
    the IMPORT KEY FILE button. Navigate to the file you saved. Click OK when done.


    To import the key at the command-line, type the following, replacing keyfile.gpg
    with the name of the downloaded file:


    ```

    sudo apt-key add keyfile.gpg

    ```


