    # Piping


    Piping is similar to redirection except that it''s used to pass the output of
    one command to another—rather like connecting a pipe between the two commands,
    in fact!


    The pipe symbol `|` is used for this purpose. On most keyboards this symbol can
    be found by hitting Shift and backslash.


    Taking the previous example, if we wanted to pipe the output of the `ls` command
    into `sort`, to alphabetize it, we would type the following:


    - `ls | sort`


    A common use of piping is to pass the output of a command to the `grep` command,
    which searches for a word or phrase. For example, if you have a huge file listing
    containing hundreds of files/folders, and want to find report.doc, you would type
    the following:


    - `ls | grep report.doc`


    Incidentally, if you see no output, the search phrase wasn''t designed.


    # Brace expansion


    Brace expansion is a labor-saving trick. It''s best explained by example.


    Let''s say you''ve come back from a European tour with a digital camera full of
    photos, and want to create four folders on your PC, named photos_germany, photos_france,
    photos_england, and photos_span. You could create each manually using the `mkdir`
    command, but brace expansion lets you to create all four in one swoop, as follows:


    - `mkdir photos_{germany,france,england,span}`


    If we view a file listing, we''ll find we have four new folders:


    - `photos_germany`

    - `photos_france`

    - `photos_england`

    - `photos_span`


    In other words, anything within the braces `{}` is individually added to the name
    and a new folder is created. Each item within the braces should be separated by
    a comma. If you subsequently wanted to delete photos_span and photos_france, rather
    than type two separate commands, you could use brace expansion:


    - `rm -r photos_{france,span}`


    Brace expansion works with all commands, not just `mkdir` and `rm`. For example,
    rather than specifying individual folders by commas, a range of numbers can be
    specified. If you wanted to create folders named photos_1, photos_2, etc., the
    following will do the trick:


    - `mkdir photos_{1..10}`


    Letters can be specified instead of numbers. The following will create photos_A,
    photos_B etc., all the way:


    - `mkdir photos_{A..Z}`


    # Wildcards


    Worth mentioning alongside brace expansion is the concept of wildcards. The term
    is taken from Poker where "wild" can represent anything. The most commonly used
    wildcard is the asterisk (`*`), used to indicate any combination of characters.
    If you wanted to delete all files in a folder, you could type the following:


    - `rm *`


    In this example, the asterisk represents any filename that contains any number
    of characters. To return to the example above, photos_germany, photos_france etc.
    could be deleted like this:


    - `rm -r photos_*`


    This will delete any file whose name begins with photos_, but has nothing after
    it. A `?` can be used to indicate any single character. The following will delete
    photos_1, photos_3 and photos_4, but leave other folder named photos and followed
    by two characters:


    - `rm -r photos?`


    In other words, each character within square brackets `[]` is substituted in the
    filename, in a similar way to brace expansion. However, wildcards are designed
    to match patterns of characters in existing files (data), so they won''t work
    when creating files.


    # CHAPTER SIX: Software management


    This chapter looks at how to install and remove software, and manage the software
    subsystem. You will explore the package management system that lies at the heart
    of Ubuntu. Topics covered include:


    - An explanation of the package management subsystems

    - Installing and removing software using Synaptic;

    - Manually installing a software package;

    - Installing and removing software at the command-line;

    - Adding new software repositories;

    - Compiling a program from source code.


    ## All about package management


    Many versions of Linux, Ubuntu relies on a system called package management for
    all its installation and removal needs.


    ### What’s in a package?


    Nearly all Ubuntu programs are distributed as package files. Package files are
    similar to installation `.exe` files under Windows, in that they are single archives
    containing a program’s components. When the program is installed, the components
    are unpacked onto the hard disk, and the system configured so the software will
    work.


    However, a key difference with Ubuntu is that packages only contain the program
    itself. Typical `.exe` files for Windows include the program and also various
    system files that allow the program to run correctly. If an Ubuntu program requires
    additional system files, they will need to be installed separately, and will probably
    be available in packages of their own.


    It''s important to understand that everything in a typical Ubuntu installation
    originally came out of a package—from the Linux kernel to the Nautilus file manager,
    the system fonts. When you installed Ubuntu, the installation program did little
    more than unpack hundreds of packages in order.


    ### APT and dpkg


    Packages are installed and removed using Ubuntu''s two software subsystems: the
    Advanced Package Tool (APT), and the Debian Package system (dpkg). APT and dpkg
    are two sides of the same coin. dpkg works at a basic level doing the work of
    installing and removing packages, while APT works at a higher level keeping track
    of what packages are installed.


    APT is very clever. Because it tracks everything, it will tell you if you try
    to install a software package that will cause trouble for an existing program.
    In most cases, it will offer a solution.


    Additionally, APT allows intelligent and efficient software updates—for both system
    software and applications.


    Updating is possible because not only does the APT know what''s already installed,
    but it also knows what''s available to be installed, including newer versions
    of already-installed software. This is made possible through the use of software
    repositories.


    ## Software repositories


    It''s with the use of software repositories that Ubuntu departs most radically
    from how Windows handles software management.


    Repositories are large stores of packages. You might call them software libraries.
    Usually repositories are located online, but they can also be on CD/DVDs, or even
    a USB memory stick. The Ubuntu install CD is effectively a small repository, for
    example, containing only the software necessary for Ubuntu to be installed.


    A typical Windows user will source software by downloading from a website or buying
    a CD/DVD-ROM disc. Virtually any software you might want to install on Ubuntu
    will probably be found in the software repositories. Therefore, installing new
    software is simply a matter of downloading and installing from the repositories.
    APT handles both of these tasks automatically. As a user, you will not have to
    handle package files directly.


    ## Dependency management


    Aside from the convenience (and luxury!) of having nearly all the world''s Linux
    software just a download away, the use of repositories has another benefit: dependency
    management.

