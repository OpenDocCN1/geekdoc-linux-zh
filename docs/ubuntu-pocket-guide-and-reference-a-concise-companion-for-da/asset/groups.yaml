    ## data. To use it, just type shred -u filename, replacing filename with the name
    of the file.


    ## Decrypting a file

    To decrypt a .pgp file, simply double-click it. You''ll be prompted to type the
    passphrase you created during production so you should now find the original file
    (or archive) visible alongside .pgp file. Remember that it is only possible to
    decrypt a file on a computer which the relevant keys are installed unless the
    keys have been exported, as described in the following section.


    ## Exporting a key pair for another PC

    It''s a wise idea to backup your encryption keys because without them there is
    no simple way of decrypting files you''ve encrypted. Alternatively, you might
    choose to install the same keys on two or more computers so each is able to share
    encrypted files. To do this, you need to export the key pair as a file. To export
    it, first ensure the computer''s time and date is correct (to learn how, see page
    47). Then start the Password and Keys program, which can be found on the Applications
    menu. Ensure My Keys tab is selected and right-click your key in the list. Click
    Properties in the menu that appears, and click the Details tab in the dialog box.
    Finally, click the EXPORT button at the bottom right and choose a location to
    save the key.


    To import a key in a different installation, first ensure the time and date is
    correct on the computer. Then start the Password and Keys program as described
    above, and click Import on the menu. Finally, navigate to your saved key.


    ## Enhancing browser security

    Ubuntu 8.04 and 8.10 use version 3 of the Firefox browser. This has significant
    features, such as protection against phishing, wherein users are redirected to
    fake websites in order to steal login details, and protection against malware
    sites where viruses or other dangerous files are offered surreptiously. See Figure
    7-2 for an example of what you will see victim to a phishing attack (note that
    this is a staged demonstration at www.mozilla.com and is not an actual attack;
    www.mozilla.com is safe to visit).


    No configuration is necessary to utilize these features they are enabled by default.
    In addition, you might opt to activate the master password function and install
    add-on software to block script-based attacks, as discussed in the next sections.


    **TIP** None of the features discussed below are unique to Ubuntu. The instructions
    provided will work equally well with Firefox installations on Windows or Mac OS
    X.


    ## Enabling a master password

    Like many browsers, Firefox 3 can remember usernames and passwords for various
    sites so you do not have to type them on each visit. However, anybody with access
    to your computer will therefore be able to access these sites you leave your computer
    unattended. Setting a master password allows you to lock and unlock the password
    file in which usernames and passwords are stored. Whenever you start Firefox and
    visit a site requiring a password, you''ll be invited to enter the master password.
    Only when this is done will the website''s username/password field be filled in.
    When Firefox is quit, the password store is locked. It''s only necessary to unlock
    the password file each time you use Firefox.


    **TIP** Because you''re prompted to unlock the password file each time you use
    Firefox, it makes sense to get in the habit of quitting Firefox when you''ve finished
    with it rather than leaving it in the background.


    To enable the master password, click Preferences in the Firefox program window,
    click the Security heading at the top of the dialog box that appears, and put
    a check alongside Use a Master Password as prompted. When done, quit and restart
    Firefox. The changes will take effect immediately—when you visit a site requiring
    a username/password that Firefox knows, you''ll be prompted for the master password.


    ## Avoiding “executable content"

    Many websites make use of JavaScript, Java, and/or Flash to provide useful functionality.
    Such website features are known as *executable content*.


    Unfortunately, in a minority of cases, executable content can be used to attack
    your computer and steal data. Because of this, security-minded Ubuntu users opt
    to install NoScript, a Firefox add-on program that lets you authorize or restrict
    JavaScript, Java, Flash, and other technologies on a site-by-site basis.


    ## Installing NoScript

    To install NoScript, start Firefox and click Add-ons. Ensure the Get Add-ons icon
    is selected in the dialog box that appears and in the Search All Add-ons field,
    type `noscript`. In the list of results, click the ADD TO FIREFOX button alongside
    the NoScript entry. In the dialog box that appears, click the INSTALL NOW button
    and, when installation has finished, click RESTART FIREFOX.


    ## Blocking/allowing executable content

    When Firefox restarts, you''ll notice a new “S” icon at the bottom-right of the
    program window. Clicking this lets you enable or deny executable content for the
    site you''re browsing. The default policy is for NoScript to deactivate everything,
    including Java, JavaScript, Adobe Flash, and Microsoft Silverlight components.
    However, some sites on a central whitelist are excluded from this protection,
    either completely or partially.


    ## APPENDIX A

    ### Glossary of terms

    The following is a partial glossary of terms you''re likely to encounter in this
    book, or in Ubuntu. The descriptions are contextualized for Ubuntu.


    - **absolute path**: A full description of the location of a file, from the root
    of the filesystem. See also relative path.

    - **applet**: In the context of the Ubuntu desktop, an applet is a small program
    with narrowly defined function (for example, displaying the time).

    - **Apache**: Web server software. See LAMP.

    - **APT**: Advanced Packaging Tool; the higher-level software management subsystem
    in Ubuntu. See also dpkg.

    - **bash**: Bourne-Again Shell; the default command-line shell used in Ubuntu
    and most versions of Linux. Based on the older sh.

    - **binary**: Source code that has undergone compilation into a program that can
    run natively on a computer. An executable.

    - **BSD**: Berkeley Software Distribution; a version of Unix originating at the
    University of Berkeley in the 1970s. Nowadays, it is available in several variations,
    including NetBSD, OpenBSD and FreeBSD.

    - **C / C++**: Programming languages used to create much of the Linux operating
    system source code.

    - **client**: A computer (or program) that connects to a server.

    - **commandline**: The line at which commands are typed in a terminal window or
    a virtual console. More often, the term refers to the overall interface and practice
    of entering commands, in contrast to using a GUI.

    - **compilation**: The process of turning source code into a binary file, normally
    using the GNU Compiler Collection (gcc).

    - **config file**: Short for configuration file; a file containing software settings.

    - **cron**: Service that allows tasks to occur at scheduled times, usually in
    the background.

    - **CUPS**: Common Unix Printing System; software that provides Ubuntu’s printing
    functionality (including printer drivers). See www.cups.org.

    - **Debian**: Venerable community-generated distribution of Linux upon which Ubuntu
    is based, along with several other distributions of Linux. For more information,
    see www.debian.org.

