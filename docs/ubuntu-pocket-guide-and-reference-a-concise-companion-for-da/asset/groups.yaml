  mdcn: "\n如前所述，`cd`（切换目录）命令用于切换到另一个文件夹。需要告诉它切换到哪个文件夹，因此我们将其作为参数提供。以下命令将切换到 `Documents`\
    \ 文件夹：\n\n- cd Documents\n\n有些命令需要多一个参数。假设我们想将 `Documents` 文件夹中的 `report.doc`\
    \ 文件复制到 `Desktop` 文件夹。`cp` 命令用于复制文件和文件夹。我们告诉它要复制的文件的位置和名称作为第一个参数，并将目标位置指定第二个参数：\n\
    \n- cp ~/Documents/report.doc ~/\n\n在这个示例中，我们再次使用波浪号 `~` 作为 `/home` 文件夹的快捷方式。从左到右，在我的测试系统中，该命令将翻译为：(cp)\
    \ 将位于 `/home/keir/Documents/` 的文件 `report.doc` 到目标文件夹 `/home/keir/Desktop`。\n\n\
    一旦输入命令，提示符中通常只会看到这些。没有确认信息。`bash` 不会说“OK”或“Command completed!”。`bash` 是一个沉默的类型。它只在必要时才会说话，通常是为了通知你错误。\n\
    \n## 命令选项\n\n大多数命令都有命令选项。这些选项会改变命令的工作方式。回到文件列表命令（`ls`），问题之一是它列出文件时不包含任何额外信息。如果我们想知道文件归谁所有，或者设置了什么权限怎么办？我们使用\
    \ `-1` 命令选项。大多数命令前面都有一个或两个连字符，这样 `bash` 就知道它们不是参数。\n\n这里是单独使用的 `ls` 命令，以及带有 `-1`\
    \ 选项的：\n\n- ls\nDesktop Documents Examples Music Pictures Public Templates Videos\n\
    - ls -1\n\n```\ntotal 28\ndrwxr-xr-x 2 keir 2008-10-24 10:07 Desktop\ndrwxr-xr-x\
    \ 2 keir 2008-10-24 10:07 Documents\nlrwxrwx-x 1 keir 26 2008-10-24 09:51 Examples\
    \ -> \n/usr/share/example-content\netc.\n```\n\n`ls` 的另一个实用命令选项是 `-a`，它会列出所有文件——即使是隐藏文件。\n\
    \n命令选项可以组合。只需将它们一个一个列出即可。要查看文件的所有细节以及任何隐藏文件，你可以输入 `ls -la`。\n\n`ls -la` 是许多 Linux\
    \ 用户每天使用的常用命令。\n\n命令选项通常是字母，但有时也会使用单词。事实上，要查看选项快速列表，你可以使用 `--help` 命令选项（两个连字符，而不是一个）。例如，`ls\
    \ --help` 或 `cp --help`。此选项适用于几乎所有命令。\n\n##er文件名\n\n带有空格的文件名会产生问题，因为命令行上项目之间的空格被视为后续参数或选项的指示。\n\
    \n例如，`rm` 命令用于删除文件。如果你想删除一个名为 `third quarter_report.doc` 的文件，并输入 `rm third quarter_report.doc`，你会看到以下系列错误信息：\n\
    \n- rm: cannot remove 'third': No file or directory\n- rm: cannot remove 'quarter':\
    \ No file or directory\n- rm: cannot remove 'report.doc': No file or directory\n\
    \n换句话说，`rm` 命令将每个项解释为独立的参数——它认为你想删除一个名为 `third` 的文件、一个名为 `quarter` 的文件以及一个名为 `report.doc`\
    \ 的文件。\n\n解决方法很简单——只需将任何包含空格的文件或文件夹名称括在引号中：\n\n- rm \"third quarter report.doc\"\
    \n\n对于包含符号的文件/文件夹名称也应该这样做。\n\n> 提示 处理空格或符号的另一种方法是对其进行转义。这涉及到在每个空格或符号之前输入反斜杠 `(\\\
    )`。要删除上面的文件，你可以输入 `rm third\\quarter\\report.doc`。大多数情况下引号运行良好。\n\n## 相对路径和绝对路径\n\
    \n路径只是描述文件或文件夹在文件系统中所在位置的部分，例如 `/home/keir/Documents/report.doc`。路径可以用两种方式表示：相对和绝对路径。\n\
    \n假设一个名叫 Frank 的用户正在使用命令行浏览他的 `Pictures` 文件夹，其位置是 `/home/frank/Pictures`。\n\n\
    > 注意 记住文件系统的根目录在 Windows 下由 `C:\\` 表示，在 Linux 中由单个正斜杠 `/` 表示。\n\nFrank 想看休假的照片，因此想切换到\
    \ `Pictures` 文件夹中的 `Disneyland` 文件夹？\n\nFrank 一直关注这本书，因为他知道可以像上面提到的那样输入 `cd` 命令。但他接下来应该输入什么？\n\
    \n他可以输入文件夹的完整路径，如下：\n\n- cd /home/frank/Pictures/Disneyland\n\n这运行得良好，但输入量太多了。\n\
    \n在上面的命令中，Frank 指定了文件的绝对路径——从文件系统根目录开始的完整位置。当然，如果 Frank 只输入会更有意义：\n\n- cd Disneyland\n\
    \n毕竟他已经在浏览 `Pictures` 文件夹了。\n\nFrank 没有意识到，但在这里指定了一个相对路径。他没有提供从底向上的路径，而是指定了一个相对于他当前浏览位置的文件系统位置。\n\
    \n> 注意 当前正在浏览的文件夹 `a` 有时被称为工作目录。\n"
