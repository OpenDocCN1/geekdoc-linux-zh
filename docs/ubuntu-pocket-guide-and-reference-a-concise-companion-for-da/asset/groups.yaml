    ## Uninstalling software


    Removing a software package is just as easy as installing it. Use Synaptic''s
    search function to find the relevant package (search by the program name, when
    installing software), and click the checkbox alongside the program''s package
    in the list.


    A menu will pop-up offering a variety of options, as follows:


    - **Mark for Reinstallation:** This will refresh the software, as described in
    the section below.

    - **Mark for Removal:** This will remove the software, but leave behind its configuration
    files so that the software will function in the same way you decide to install
    it again at a future date. This is the best choice.

    - **Mark for Complete Removal:** This will remove the software and also delete
    its configuration files.


    Assuming you make a selection to remove the software, a cross will appear in the
    checkbox. When you click the APPLY button on the main toolbar, you will once again
    see a summary of the actions that are to be performed. Click APPLY in the dialog
    box to continue.


    Removing a software package doesn''t remove any dependencies that were installed
    along with it. That presently isn''t possible using Synaptic, although it is possible
    at the command-line, as described in the Command-Line Software Management section.


    > NOTE Sometimes you might see a heading in the Summary dialog that reads software
    packages for which updates are Unchanged. I explain more about updating in Chapter
    7, but if you wish to install updates using Synaptic you can click the MARK UPGRADES
    button on the toolbar.


    ## Reinstalling software


    Sometimes software installed on the system might become corrupted, in which case
    it might not run, or might function incorrectly. In such a case it could be useful
    to reinstall the software, and Synaptic offers a method of doing so. Search for
    the program''s package and click the checkbox alongside it. In the menu that appears,
    click the Mark for Reinstallation option, and click the APPLY button on the main
    toolbar.


    After confirming what it''s about to do the Summary dialog box (just like when
    installing/removing software), Synaptic will run through the procedures of installing
    the software, such as unpacking the package and configuring the software, but
    without actually downloading it afresh unless the package file isn''t stored in
    the package cache, in which case it will have to be downloaded from the repositories.


    ## Manually installing a package


    It is inadviable attempt to manually download a package and install it. The process
    is fraught with problems, the most significant being the potential difficulty
    in manually sourcing dependencies.


    NOTE Because of dependency issues, if you intend to install software on a developer''s
    website, you''ll probably find that the developer has her own package repository
    that you can subscribe to. This will let you use Synaptic to install the program,
    taking care of dependencies automatically. Adding a new repository is described
    in the Working with Repositories section below.


    However, there are a handful of situations where installing a package "by hand"
    might be required.


    The GDebi Installer program automatically associates with package files (they
    have a .deb extension), in the same way that OpenOffice.org''s Writer associates
    with Microsoft Word .doc files. Therefore, manually installing a package and double-clicking
    it, or more simply, downloading the package file and, or more, selecting the Open
    with GDebi Package Installer option in the web browser''s dialog box.


    GDebi attempts to mitigate any dependency issues by downloading the necessary
    dependency packages from the main repositories. However, you shouldn''t assume
    the dependency packages will always be available, particularly if you are installing
    a package that isn''t built specifically for the release of Ubuntu you''re using.


    Once the GDebi program window appears, click the INSTALL PACKAGES button. Following
    this, any dependencies will be downloaded (if possible) and the software installed.


    If any required dependencies can''t be found in the repositories, the INSTALL
    PACKAGE button will be grayed out, and a warning will appear telling you names
    of the missing dependencies. You will have to manually source and install the
    dependency packages before continuing.


    106 : Software Management


    ## Table 6-2. Typical software administration commands (apt top, dpkg bottom).


    | Command | Details |

    | --- | --- |

    | `apt-get update` | Update the list of available software from the repositories
    (equivalent to Synaptic''s RELOAD button, and, as such, should be used before
    any software installation). |

    | `wait apt-get update` | Update the list of available software from the repositories
    (equivalent to Synaptic''s RELOAD button, and, as such, should be used before
    any software installation). |

    | `apt-cache-search searchterm` | Search the repositories for `searchterm`. The
    specific name of matching packages along with summary descriptions will be returned.
    |

    | `apt-cache-show packagename` | Show details of `packagename`, including what
    dependencies it has, and its full description. |

    | `apt-get install packagename` | Install `packagename`. Any dependencies will
    be automatically added to the list, and you will be asked to confirm the total
    install. Multiple packages can be specified. |

    | `apt-get autoremove packagename` | Uninstall `packagename`, along with any unused
    dependencies. To uninstall all and leave dependencies in place, use `apt-get remove
    packagename`. If issued without specifying a package, `apt-get autoremove` will
    attempt to remove all redundant dependencies on the system. |

    | `apt-get upgrade` | Update to the latest versions of installed software. |

    | `apt-get dist-upgrade` | Effectively, this command upgrades the entire system
    to the newest release of Ubuntu. |

    | `apt-get clean` | Clears the package cache; if disk space is tight, but otherwise
    not necessary. |

    | `dpkg -i packagename.deb` | Manually install the file `packagename.deb`, assuming
    you have manually downloaded it. |

    | `dpkg -r packagename` | Uninstall `packagename`; it is necessary to specify
    the package name as it''s known on the system (i.e. within Synaptic), rather than
    the package filename, as required for installation. |

    | `dpkg -P packagename` | Uninstall `packagename`, also removing its configuration
    files. |

    | `dpkg -I packagename.deb` | Show information about `packagename.deb`, including
    full description and dependencies. |

    | `dpkg -l packagename` | List details of installed package called `packagename`,
    including version number. |


    NOTE Bear in mind that dependencies typically have their own dependencies! In
    other words, it''s likely that you''ll source all the dependencies needed by the
    program, only to be presented with an entirely new list! This situation is known
    as "dependency hell", and is the main reason why APT was invented.


    Packages that have been manually installed can be removed using Synaptic, just
    like any other software.


    ## Command-line software management


    As useful as it is, Synaptic is little more than a graphical front-end for a series
    of commands that administer the APT software subsystem.


    The two most useful commands are apt-get and apt-cache. In addition to these commands,
    it is possible to install packages you''ve manually downloaded using the dpkg
    command.


    Installing software at the command-line can be quicker and more efficient than
    Synaptic, so is is a skill worth learning.


    > NOTE Of course, command-line software installation is also possible if the GUI''s
    not working. It can therefore be very useful when trying to repair a broken system.


    In the sections below, I look at the same software installation tasks mentioned
    previously, but this time at the command-line.


    For those who want a quick start, the most useful subset of software administration
    commands are outlined in Table 6-2. Remember that software installation requires
    root powers, so each software install or remove command should be preceded with
    sudo (commands that search or display information do not usually use root powers).


    > TIP Some people prefer to use the aptitude command instead of the APT commands.
    aptitude is slightly better in how it handles dependencies, and features a semi-GUI
    interface that makes it easy to use. For more details, see http://algebrithithunk.net/~burrows/projects/aptitude/doc/en/.


    # Installing software


    Here are the steps required to install the Frozen-Bubble game, as discussed previously.


    +   1. The first command to type before installing any software is sudo apt-get
    update. This will grab the latest list of software from the repositories.

