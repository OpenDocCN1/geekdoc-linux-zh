    # CHAPTER THREE


    # Getting to grips with the desktop


    This chapter describes the highways and byways of the Ubuntu desktop—the component
    of Ubuntu that you''ll be spending most time with it. It also describes a handful
    of common administrative tasks you might want to undertake. Topics covered include:


    - Logging into the system for the first time;

    - Understanding what''s what on the desktop;

    - Working with virtual desktops;

    - Customizing Ubuntu''s look and feel;

    - The most useful day-to-day applications;

    - Using the clipboard (cutting, copying and pasting);

    - Searching for files (including the desktop search feature);

    - Adding new users to the system;

    - Rebooting, suspending, and switching off the computer.


    ## Logging in


    Let''s start from the very beginning—turning-on your computer (or rebooting) for
    the first time after installation.


    The first thing you''ll see, after the computer has finished its self-testing,
    is a boot menu. This lets you choose between Ubuntu and Windows.


    ### Wubi (Windows install)


    If you used Wubi to install Ubuntu, you''ll see just two choices—Windows, and
    Ubuntu. Use the up/down cursor keys to make your selection and hit Enter once
    you''ve done so.


    This boot menu is actually provided by Windows. If you choose the Ubuntu boot
    process, you''ll start it and if you hit a key during the on-screen countdown,
    you can access Ubuntu''s *own* boot menu. Day-to-day there''s no reason to do
    this, although it offers a useful recovery option for fixing problems.


    ### Dual-boot


    If you installed Ubuntu in the traditional repartitioning route, after your PC''s
    power-on self-tests you''ll move straight to the Ubuntu boot menu. This has a
    more involved list of options.


    At the top of the menu there are always two options relating to Ubuntu. The first
    boots Ubuntu in normal mode, while the second starts recovery—Ubuntu''s equivalent
    of Windows'' ''safe mode'', where system repairs can be carried out.


    The third menu option starts a memory testing program that is separate from Ubuntu,
    and can be useful for diagnosing hardware faults.


    > **TIP** For more information on this program, see www.memtest.org.


    Windows occupies the bottom position in the list and you can move the selection
    highlight between options using the up/down cursor keys. Hit Enter to confirm
    your choice and start the boot procedure.


    > **NOTE** if you wiped Windows during installation, the boot menu won''t appear
    unless you hit a key during the on-screen countdown.


    If you didn''t select the automatic login option during installation, the next
    thing you will see, after Ubuntu has finished the first stage of booting, the
    login screen. See Figure 3-1 for an example.


    Simply type your username, hit Enter, and your password. Assuming both details
    are correct, booting will finish, and the desktop will appear.


    > **TIP** If you want Ubuntu to login automatically at future boot-ups, as with
    some versions of Windows, click System ➜ Administration Login. Type your password
    when prompted. In the dialog box that appears, click the Security tab. Put a check
    in the Enable Automatic Login box, and select your username from the User dropdown
    list. Click the CLOSE button when done.


    3 : Getting to Grips with the Desktop


    ![](img/acd1f85da6741773b2c9559b2eb5033d_52_0.png)


    **Figure 3-1.** The Ubuntu 8.10 login screen.


    ## The layout of the desktop


    The Ubuntu desktop might seem a little strange at first, but don''t worry. You''ll
    soon get used to it.


    ## Panels


    The Ubuntu desktop differs from Windows in that it has two taskbars (known within
    Ubuntu as *panels*)—one at the top of the screen, and one at the bottom.


    The one at the top is concerned with presenting information, starting programs,
    and configuring the system. The panel at the bottom is where programs minimize
    to, and this panel also includes the Show Desktop button (left), a trash icon
    (right), and a virtual desktop selector (right; of which more later). Files can
    be dragged and dropped onto the trash icon, and clicking it lets you view and
    empty the trash contents.


    ## Main menus


    The three menus at the top of the screen (Applications, Places, System) are known
    as the *main menus*. They stay on-screen all the time. When an application starts,
    its own menus appear within its window beneath.


    The Applications user at the top left provides access to GUI software installed
    on the system.


    The Places menu, alongside, offers quick access to locations within the filesystem,
    or attached storage as USB memory sticks. Digital cameras and MP3 players are
    also listed here when plugged-in.


    > NOTE I go into more detail about the Ubuntu filesystem in Chapter 4, and also
    explain the file manager in detail.


    The System menu, alongside the Places menu, offers control over your computer''s
    settings. It has two submenus, as follows:


    **Preferences:** This menu mostly lets tweak settings relating to your particular
    user account and the operation of the desktop. You can alter some hardware settings,
    such as the screen resolution, but only those that relate to your personal desktop
    configuration.


    **Administration:** This menu offers system-wide hardware configuration options,
    such as altering the time/date, and options for configuring the underlying Ubuntu
    system, as as adding/removing software.


    ## Icons and applets


    Alongside the menus are quick icons for the web browser, email client, and help
    system, respectively.


    > TIP You can add your own icons here by clicking and dragging them from the menus,
    or even from the desktop.


    At the right of the top panel is a time/date display, along with a system tray
    area.


    Each panel can house any number of *applets*—small programs with a specific function.
    To add an applet, just right-click a spot on each panel, select Add to Panel from
    the list. To subsequently remove an applet (or existing item on a panel), right-click
    it and select Remove from Panel.


    > CAUTION Just about everything on either panel can be removed this way, including
    the main menus! In fact, technically speaking, every you see on the panels—including
    the main menus—are applets.


    ## Virtual desktops


    Like all Linux, Ubuntu makes use of virtual desktops. This handy function is missing
    from Windows although it can be found in Macintosh OS X 10.5 under the name of
    Spaces.


    Using virtual desktops is like having a second (or third, or etc.) monitor. Program
    windows can be placed on any of the desktops and you can switch between them using
    the applet at the bottom-right of the screen.


    > TIP You can quickly switch desktops by holding down Ctrl+Alt and holding the
    left/right cursor keys. You can also switch by turning the mouse wheel when the
    cursor is hovered out the virtual desktop applet.


    Virtual desktops are best explained by example, so start a program of your choice
    (maybe the Firefox web browser) and switch to the second desktop by clicking the
    second of the screen icons in the virtual desktop applet at the bottom right of
    the screen. The program will seem to disappear. Now open a file browsing window
    (click Places ⇔ Home Folder), and return to the first desktop by clicking the
    first of the screen icons. The first desktop''s contents will now reappear.


    See how it works? You could set aside one virtual tasks solely for email, and
    another for day-to-day tasks such as web browsing, and switch between the desktops
    when necessary.


    You can have up to 36 virtual desktops—just right-click the icon, select Preferences,
    and increase the number in the Number of Workspaces counter. You can also give
    each descriptive name in the Workspace Names section—double-click an entry in
    the list and overtype.


    > TIP You can move a window from one desktop to another by right-clicking the
    window''s title bar and selecting Move toWorkspace Right (or Left) from the menu
    that appears. If you have more than two virtual desktops, you can choose from
    a list of them on the submenu.


    Getting to Grips with the Desktop : 37

