    组的用户拥有读取 (`r`) 和执行 (`x`) 权限。这意味着他们可以查看文件夹的文件列表并进入文件夹（通过 Nautilus 浏览它）。但是，他们无法在那里写入文件或删除文件，因为那里有一个连字符
    `-`，意味着“没有权限”。最后，系统上的其他用户拥有读取和执行权限，但没有写入权限。


