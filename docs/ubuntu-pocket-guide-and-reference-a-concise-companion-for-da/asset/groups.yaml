    Some of these shortcuts are similar to those found under Windows, while some are
    unique. See Table 3-2 for more information. Some of these shortcuts only work
    if desktop effects are enabled—see the Graphics section in Chapter 2.


    ## Adding new users


    It''s easy to add new users to your Ubuntu setup. You might want to give your
    children or spouse their own account.


    As with Windows, you can create limited user accounts that stop the individual
    administering the system. Several entries are removed from the System ⇨ Administration
    menu, and if the user somehow bypasses this and runs some configuration software,
    their password simply won''t be accepted as authorization.


    ## Table 3-2. Useful keyboard shortcuts.


    | Key combination | Details |

    |---|---|

    | Alt+F4 | Quit application |

    | F1 | Context-sensitive help |

    | F10 | Open a program’s File menu; use left/right cursor keys to move between
    other menus |

