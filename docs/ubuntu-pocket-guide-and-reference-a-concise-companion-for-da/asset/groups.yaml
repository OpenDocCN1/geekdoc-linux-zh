    Xubuntu: This version of Ubuntu is based on the Xfece desktop environment (www.xfce.org).
    This is a stripped-down desktop designed to run optimally on all types of hardware,
    particularly older, less-powerful computers, it features much of the same software
    as the main Ubuntu release, and is just as feature-packed. With Ubuntu, it is
    still Ubuntu under the hood.


    Others: Other projects make Ubuntu-derived releases. See Table 1-1 for a list
    of foremost examples. For more details, see https://wiki.ubuntu.com/DerivativeTeam/Derivatives.


    NOTE Several third-party uses Ubuntu as a basis for their own versions of Linux.
    Examples include Linux Mint (www.linuxmint.com), that focuses on usability, and
    gNewSense (http://gnewsense.org), that strips out all software that isn''t 100%
    Free Software (see the Ubuntu entry in Table 1-1).


    # Choosing a release


    New releases of the main Ubuntu projects are made every six months. Every two
    years a long-term support (LTS) release is made.


    # Support


    The chief difference between the LTS and ordinary releases is found in the length
    of time for which updates are provided. With a standard version of Ubuntu, software
    updates are provided for 18 months after release; upon expiry of this period,
    users are expected to upgrade to a newer release of Ubuntu. With an LTS version,
    three years of updates are provided before it becomes necessary to upgrade.


    > NOTE On server hardware that uses the specialized Ubuntu Server release, five
    years of updates are provided.


    # Naming


    Each Ubuntu release is named in two ways. The official name is the year and month
    combined, separated by a period. The release made in April 2008 was named 8.04,
    for example.


    Releases also have nicknames, decided upon Mark Shuttleworth, and humorously derived
    from types of animals. 8.04 has the nickname Hardy Heron. 8.10 is called Intrepid
    Ibex. Sometimes the animal component is dropped in formal conversation—8.04 might
    be referred to simply as “Ubuntu Hardy”, or just “Hardy”.


    Table 1-2 shows Ubuntu version numbers and nicknames.'
