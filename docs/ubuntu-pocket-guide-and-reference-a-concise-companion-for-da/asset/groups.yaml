    - 7. 在用户名文本字段中，输入你想要在 Ubuntu 中使用的用户名。Wubi 会根据 Windows 登录详情建议一个用户名，但你可以输入不同的内容。

    - 8. 在密码字段中，输入你想要用于 Ubuntu 登录账户的密码。良好的密码应包含字母、数字、符号甚至空格，并且越长越好。

    - 9. 完成后，点击 INSTALL（安装）按钮。安装分为两个阶段。首先，在 Windows 文件系统中创建容器文件（如果你使用的是独立的 Wubi 安装程序，Ubuntu
    文件也会被下载；这可能需要一些时间）。然后电脑将重启以进行完整安装。重启后，你应该在启动菜单中选择 Ubuntu——使用上/下方向键，并在 Ubuntu 高亮时按下回车键。


