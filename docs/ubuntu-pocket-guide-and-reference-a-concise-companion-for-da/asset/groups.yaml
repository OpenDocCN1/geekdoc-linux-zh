    # Redirection


    Sometimes it''s useful to send the output of a command into a file, rather than
    displaying it on screen. This is the principle of output redirection.


    Let''s say you wanted to make a permanent record of a file listing. To do this
    using redirection, type the following:


    +   - ls > listing.txt


    The right angle symbol (>) tells redirect output of the ls command into the file
    listing.txt, rather send it to the screen. Think of the angle-bracket as a funnel—the
    output of the ls command is “poured” into the listing.txt file.


    If listing.txt doesn''t exist, it will be created. If a file of name already exists,
    its contents will be overwritten. Using two angle brackets (>>) instead of one
    will cause the output to be added to the bottom of an existing file.


