    由于内核是操作系统中极其重要的部分，人们开始将 GNU 和 Linux 的组合简称为 Linux。这让斯托尔曼（Stallman）很不高兴，他要求使用 GNU/Linux
    这个名称。但为太晚了，这个名字已经传开了。


    **注意** 将操作系统称为 GNU/Linux 还是简单的 Linux 是一个持续至今的争论。


    Linux 操作系统通常也包含了来自 GNU 和 Linux 内核或其他来源的软件。Linux 中几乎所有的软件都是自由软件，尽管其中很大一部分与 GNU
    或理查德·斯托尔曼没有直接联系。可以说，斯托尔曼给世界最大的礼物不是 GNU 软件，而是自由软件的概念。如今斯托尔曼的大部分活动涉及与全球范围内自由软件的交流。


    **注意** 经常用开源（open source）来代替自由软件。它们的含义相似——参见 www.opensource.org。


    ## Linux 发行版


    Linux 并不是只有一个版本，而是有数百个。这些版本被称为 Linux 发行版（distributions），简称 distros。其他发行版的示例包括红帽（www.redhat.com）和
    SUSE（www.suse.com），但还有许多其他发行版，且新的版本不断出现。


    这种多样性的存在是因为自由软件所允许的自由——任何人都可以获取源代码并制作他们自己的版本。


    某些发行版是由商业赞助的，而另一些则源于全球庞大的用户社区。Ubuntu 兼具两者：它由企业家斯托尔沃（Shuttleworth）于 2004 年创立的公司
    Canonical 赞助，但也受益于社区的支持，并基于 Debian（www.debian.org），这是一个由社区生成的发行版。


    ## 什么让 Ubuntu 特殊


    有三点让 Ubuntu 脱颖而出：


    1. 关注桌面用户；

    2. Ubuntu 的哲学和社区；

    3. 易用性。


    让我们仔细看看每一项。


    ### 关注桌面用户


    尽管它提供了适用于各种电脑的版本，但从核心上说，Ubuntu 是一个面向桌面用户的 Linux 发行版。大多数 Linux 发行版在桌面或服务器计算机上同样适用，但在桌面体验方面缺乏精细化。事实上，在很多情况下，桌面用户的需求是事后才考虑的。


    相比之下，Ubuntu 开发者非常关注桌面体验。当 Ubuntu 在 2004 年创建时，斯托尔沃在在线数据库中记录了第一个 bug。然而，这并不是关于软件的。相反，这是一个修复
    PC 市场中这一 bug 的革命性号召。


    ### 哲学与社区


    正如你所察觉到的，Linux 既是一种操作系统，也是一种哲学。Ubuntu 也一样。


    ### 非洲价值观


    Ubuntu 的名称源于一个非洲概念，大致翻译为“对他人的仁爱”（humanity to others）。这个术语在种族隔离后的南非流行起来，它强调了个人意识到自己在社区中的作用以及保持慷慨精神的重要性。


    当斯托尔沃在 2004 年创立 Ubuntu 项目时，他根据这一概念和自由软件原则起草了一份哲学声明。简而言之，Ubuntu 项目由这样一个理念驱动：任何人、在任何地方都应该能够使用、共享或修改软件。这意味着即使他们有残疾，也应该能够获取这些软件。Ubuntu
    像几乎所有的 Linux 版本一样免费，在发布后的特定时间内也是免费的（通常为 18 个月，更多细节请参见第 7 页表格）。


    **注意** 你可以在 www.ubuntu.com/community/ubistory/philosophy 了解更多关于 Ubuntu 哲学的信息，并在
    www.gnu.org/philosophy/free-sw.html 了解更多关于自由软件基金会的原则。Ubuntu 代表了自由——使用和共享软件的自由，随心使用软件的自由以及学习的自由。


    ### 社区


    Ubuntu 社区直接产生于 Ubuntu 哲学。简单来说，人们尊重 Ubuntu 采取的有原则的立场。他们也喜欢 Ubuntu 关注桌面体验这一事实。曾有许多
    Linux 版本像 Ubuntu 一样专门针对桌面用户，但它们几乎都失败了。这是因为它们在自由软件原则的组件上做了妥协。也许他们的 Linux 版本包含了不能自由共享或修改的专有安装程序。有时他们还尝试限制其
    Linux 版本的重新发行。


    Ubuntu 没有做这些事情。它的回报是全球范围内真正庞大的用户社区——可以说是是任何 Linux 版本中用户基数最大的。它无疑是最友好的 Linux 社区之一。斯托尔沃处于次要位置，偶尔发布版本外，由社区主导。关于新功能的决策是以民主方式做出的，许多用户帮助开发
    Ubuntu（当然，前提他们拥有技能）。


    对于 Ubuntu 的普通终端用户来说，Ubuntu 社区的收益体现在 www.ubuntuforums.org 等社区网站上，用户在那里聚集并互相帮助。


    **注意** 说 Ubuntu 不包含专有软件并非 100% 准确。目前提供极少量的专有硬件固件，以支持尚未被自由软件完全支持的无线和图形设备。但这被权宜之计，直到更多可接受的替代方案出现。


    ### 易用性


    除了强大的原则和资金赞助，斯托尔沃还为 Linux 世界带来了其他东西：他想做出“为人类设计的 Linux”（Linux for human beings）。事实上，这就是
    Ubuntu 的口号。


    ### 过去是怎样的


    为了理解为什么这很重要，让我讲述我在 2002 年（Ubuntu 出现之前）使用 Linux 的一次经历。我想让笔记本电脑的无线卡连接到我的网络，但在 Linux
    下无法让它工作。于是，我在热门论坛上寻求帮助。我在回复中收到了类似以下的内容：


    > 要让代码运行起来很简单！只需获取模块的源代码并针对内核进行编译。使用 insmod 加载它，然后使用 iwconfig 配置 WEP 密码——


    你还在读吗？如你所见，这是一个复杂的答案。它涉及到命令行操作，并且要求在非常技术层面上了解 Linux 是如何工作的。我知道发帖者在说什么，尽管内心对所涉及的工作量叹了口气。然而，一个新手却困惑了。


    当时就是这样。Linux 是“仅供技术人员准备的”。它被认为一种工业级操作系统，并随之带来了几乎所有的标准硬件，其陡峭的学习曲线赶走了许多人。


    ### 现在是怎样的


    Ubuntu 改变了一切。它专注于桌面用户体验，为此，它提供了图形化配置软件。它包含了各种硬件驱动程序，使得几乎所有标准硬件都能“即插即用”。Ubuntu
    自带一个安装程序，该程序没有包含令人费解的术语，更新系统只需鼠标点击几次即可。


    公平地说，可以认为 Ubuntu 是桌面 Linux 这一更广泛革命的一部分，其他几个 Linux 版本也朝着同样的方向迈进。Ubuntu 是第一个实现这一点的，并在每一个新版本的发布中继续保持领先。


    虽然命令行仍然存在，但不再强制要求使用它。使用命令行通常更快、更高效（正如你将在本书的后面部分发现的那样），但你不必这样做。Ubuntu 让 Linux 对所有人都触手可及。

    '
