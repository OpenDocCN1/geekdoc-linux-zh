    ## Table 4-1. Key locations in the Ubuntu filesystem.


    | Location | Details |

    | --- | --- |

    | /bin | Essential software, typically needed to get the system running |

    | /boot | Files related to the boot menu/loader |

    | /dev | Virtual files representing hardware devices |

    | /etc | System (global) configuration files |

    | /home | Users'' personal folders |

    | /lib | Support (library) files required by software |

    | /media | Contains subfolders where storage devices can be mounted |

    | /proc | Virtual folder containing files representing stats and settings |

    | /root | Personal folder of the root user |

    | /sbin | Essential software for system maintenance, usually used by the root
    user |

    | /tmp | Temporary files/folders |

    | /usr | Essentially, subdirectories containing most software used on the system,
    including system libraries and documentation |

    | /var | Data that is vital to the running of the system and that is constantly
    updated |


    ## File extensions


    Generally speaking, the trend with Linux is not to use file extensions for system
    files. Executable programs under Ubuntu don''t have a file extension, such as
    .exe, as with Windows. Instead, the fact they are programs and not ordinary data
    files is indicated by the use of the executable file attribute. This is discussed
    in more in Chapter 5.


    Configuration files sometimes have a .conf file extension, but often have no file
    extension at all. Many files that are plain text have no file extension, in fact;
    the use of the .txt file extension is rare in the world of Linux. Program documentation
    files in the /usr/share/doc folder, for example, are plain text and have no file
    extensions.


    > NOTE It''s not quite true that in the /usr/share/doc folder have no file extensions
    because some program documentation files are compressed, so a .gz file extension,
    but this is a minor point.


    However, when it comes to the personal files of users, such as documents or images,
    file extensions are as important as they are under Windows. Files with a .doc
    extension are recognized as Microsoft Word files, for example, and .jpg files
    are recognized as images.


    ## Understanding users


    When you installed Ubuntu, a personal user account was created for you. As part
    of this process, a folder named after your username was created in /home, as mentioned
    previously.


    ## Root user


    In fact, on most Linux systems two login accounts are created during installation—a
    standard user, and the root user. The root user is a special user account gifted
    the ability to do anything, such as delete system files, or install software.
    Its username is always root.


    Normally when Linux is used on a PC, a standard user logs into the root account
    whenever she has to administer the system, and then logs out when she''s finished.
    She will spend most of her time in her ordinary user account, day-to-day stuff
    while browsing the web.


    Ubuntu differs slightly from most Linux. Although the root account is there in
    the background, it is discouraged from directly logging in as root. Use the user
    "borrows" root powers to administer the system when necessary. Usually, this is
    done by entering your login password when prompted. See Figure 4-2 for an example
    that appears when attempting to run Synaptic, a program that administers software.
    Synaptic links on the System Administration menu, and, if you run any program
    on this menu a password prompt box will pop up. You will not be able to get any
    further until the password is typed but, after this, this application will run
    with root powers.


    Alternatively, some applications start, but will have restricted functionality
    until the UNLOCK button is clicked, at which point the same password request will
    appear. With these applications, typing your password does not give the entire
    application root powers, but it is more secure and, eventually, all of Ubuntu''s
    administrative applications will work this way.


    > NOTE When working at the command-line, any command needing administrative powers
    must be preceded by sudo (sudo should be used for GUI apps). I explain more about
    this in Chapter 5.


    ## File permissions


    Although the root user account has a back seat in Ubuntu, its influence is felt
    everywhere. Most operating system files are "owned" by the root user, and has
    permissions so that only root can edit them. In other words, only the root user—or
    a user borrowing root powers—can delete or modify vital files. In some cases,
    even viewing operating system files by ordinary users is prohibited.


    ![](img/acd1f85da6741773b2c9559b2eb5033d_72_0.png)


    **Figure 4-2.** Typing a password to borrow root powers and administer the system.


    This simple mechanism of protecting operating system files through root user ownership
    is how Linux enforces security and system protection. It is simple but highly
    effective, and has stood the test of time for many years.


    > NOTE The fact that Windows fails to make this distinction, and effectively merges
    the standard and administrator types of user account, is one reason it''s insecure.
    If a virus infects the system, it operates with administrator powers, so it can
    really cause trouble. Vista fixes this situation somewhat by pestering the user
    every time they do something remotely dangerous to the system.


    File permissions lie at the heart of understanding and working with the Linux
    filesystem, so let''s take a look at them in more depth.


    As mentioned previously, every file is owned by a particular user—even system
    files, which are owned by the root user.


    The owner of a file can set three separate sets of permissions: firstly for himself,
    secondly for the group, and lastly for others.


    In setting file permissions for himself, the file''s owner could mark a file as
    read-only, for example, to avoid accidentally changing it. All users are members
    of a group, and each file is assigned to a group. The third and final set of permissions
    can be configured for *others*, which is to say, users on the computer who aren''t
    in the group.


    > TIP When trying to comprehend how Linux handles files, it helps if you remember
    it''s clone of Unix, an operating system designed to have hundreds or thousands
    of different users. You can view and edit file permissions for any file or folder
    by right-clicking and selecting Properties from the menu. In the dialog box that
    appears, click the Permissions tab. You can only change permissions for a file
    or folder that you.


    Let''s take a look at permissions in action. The user called frank creates a spreadsheet.
    He the user called jane, her colleague in the Accounts department. frank wants
    jane to be able to edit the spreadsheet, so he sets the group permissions for
    the file so that anybody in the accounts group can read and write the spreadsheet.
    frank wants other people in the company to be able to view the spreadsheet, including
    users in other departments who aren''t in the accounts group. Yet he doesn''t
    want them to be able to edit it. So, sets read-only permission for others.


    In the case of operating system files, owned by the root user, permissions are
    normally set so that other users on the system can view (read) files, but not
    modify them (write). Important system folders are also protected in this way,
    so that new files can''t be created. The root user also owns the root of the filesystem
    (known as C:\ in Windows). This particular permission is "hard-wired", so that
    only the root user can create new files or folders there.


    NOTE Under Ubuntu, group file permissions are unimportant when it comes to files
    owned by root, because the root user is in a private group of its own, also called
    root.


    We''ll come back to file permissions in Chapter 5, which looks at the Linux command-line.
    It''s at the command-line that file permissions become more important, particularly
