  - '[PAGE 16]


    # What Ubuntu offers


    Ubuntu is a thoroughly modern operating system that provides everything you might
    find in Windows or Macintosh OS X, but without the drawbacks. It keeps things
    simple, yet offers sophisticated features.


    Want to browse the web? Firefox will do the job. This is the same Firefox you
    might have been using under Windows and, the same add-ons will work. Want to instant-message
    friends using AIM, MSN, or ICQ? Pidgin provides the solution. Need to do some
    word-processing, or spreadsheets, or presenting? OpenOffice.org will do the trick.
    GIMP will handle image-editing, while RhythmBox will take care of music playback
    (stand-alone video playback is handled by Totem).


    All of these programs are installed by default. They''re not extras and they''re
    all free of charge.


    Hardware support is excellent, with virtually every item of day-to-day hardware
    supported, including graphics/sound cards, printers, wireless, USB memory sticks,
    cameras, iPods, and so-on. There''s no need to fumble around driver CDs—practically
    everything will be up and running straight after installation, although as with
    any operating system you may have to configure your system to your tastes and
    needs.


    > Ubuntu works well on older hardware. The minimum realistic requirements for
    Ubuntu 8.04 are a 700MHz processor, 384MB of memory, and 8GB of disk space. You
    might consider installing Ubuntu on an older PC to evaluate it, before installing
    it on your day-to-day computer.


    # How to read this book


    Ubuntu Pocket Guide and Reference are concise. Its goal is to explain the essentials
    of day-to-day Ubuntu administration in a fuss-free manner. Due to the limited
    size of the pocket book format, at times it can be a whistle-stop tour of Ubuntu
    features. However, topics are always fully explained, and often I linger over
    details to provide a lasting reference.


    There are certainly more comprehensive Ubuntu books around. I recommend Beginning
    Ubuntu Linux, Third Edition, written by Jaime Sicam and myself. It''s published
    by Apress (June 2008; ISBN 978-1590599914) and provides a complete guide to Ubuntu.'
  - '[PAGE 17]


    # Checkbox


    ![](img/acd1f85da6741773b2c9559b2eb5033d_17_0.png)


    Figure i-1. Checkboxes and radio buttons.


    # # Typing commands


    Sometimes I might ask you type something at the command-line. Usually this will
    appear on a line of its own, like this:


    +   - mv /home/keir/Desktop/report.doc /home/keir


    Some commands are long and won''t fit on a single line of the page. If this is
    the case, I use the symbol at the end of the line: 🔗


    # # Menu options


    In some sections, I ask that you select a certain menu option. You might see something
    like the following: click System ↩ Preferences ↩ Appearance. What I mean is that
    you should click the System menu at the top of the screen, and then the Preferences
    submenu, and click the entry on that menu headed Appearance. It will be obvious
    what you to do.


    # # What to click


    A quick word about radio buttons and checkboxes, both of which I reference throughout
    the book. Both are elements of dialog boxes, and activate certain functions. Radio
    buttons are usually round, while checkboxes are usually square. See Figure i-1
    for an annotated example.


    # # Ubuntu versions


    This book was written using Ubuntu 8.10 as a base, and was further tested using
    the 8.04 long-term support release. Screenshots were taken using Ubuntu 8.10 and
    as such might differ slightly from what you see using 8.04.'
