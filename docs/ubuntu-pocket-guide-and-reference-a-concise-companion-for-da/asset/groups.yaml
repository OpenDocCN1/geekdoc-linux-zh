    # 第三章


    # 掌握桌面


    本章将介绍 Ubuntu 桌面的大路和小径——这是你与 Ubuntu 共处时间最长的部分。它还描述了你可能想要执行的一些常见管理任务。涵盖的主包括：


    - 首次登录系统；

    -了解桌面上的各项功能；

    - 使用虚拟桌面；

    - 自定义 Ubuntu 的外观和感觉；

    - 最实用的日常应用程序；

    - 使用剪贴板（剪切、复制和粘贴）；

    - 搜索文件（包括桌面搜索功能）；

    -向系统添加新用户；

    - 重启、挂起和关闭电脑。


    ## 登录


    让我们从最开始开始——在安装后首次开启电脑（或重启）。


    在电脑完成自检后，你看到的第一个程序是启动菜单。它允许你在 Ubuntu 和 Windows 之间进行选择。


    ### Wubi (Windows 安装)


    如果你使用 Wubi 安装 Ubuntu，你只会看到两个选项：Windows 和 Ubuntu。使用上/下方向键进行选择，完成后按一次 Enter 回车键。


    此启动菜单实际上是由 Windows 提供的。如果你选择 Ubuntu 启动过程，将启动它；如果你在屏幕倒计时期间按下任意键，就可以访问 Ubuntu *自己的*
    启动菜单。日常生活中没有理由这样做，尽管它为修复问题提供了一个实用的恢复选项。


    ### 双引导


    如果你通过传统的重新分区路径安装了 Ubuntu，在 PC 开机自检后，你将直接进入 Ubuntu 启动菜单。这个菜单的选项列表更为复杂。


    菜单顶部始终有两个与 Ubuntu 相关的选项。第一个以普通模式启动 Ubuntu，第二个启动恢复模式——这是 Ubuntu 相当于 Windows 的“安全模式”，可以在其中进行系统修复。


    第三个菜单选项会启动一个独立于 Ubuntu 的内存测试程序，这对于诊断硬件故障很有用。


    > **提示** 有关此程序的更多信息，请参阅 www.memtest.org。


    Windows 占据列表的底部，你可以使用上/下方向键在选项之间移动高亮。按下 Enter 确认你的选择并开始启动程序。


    > **注意** 如果你在安装期间删除了 Windows，除非在屏幕倒计时期间按下任意键，否则启动菜单将不会出现。


    如果你在安装期间没有选择自动登录选项，在 Ubuntu 完成第一阶段启动后，你看到的下一个内容是登录界面。示例见图 3-1。


    只需输入用户名，按 Enter，然后输入密码。假设这两个信息都正确，启动将完成，桌面将会出现。


    > **提示** 如果你希望 Ubuntu 在未来的启动中自动登录（类似于某些 Windows 版本），请点击 系统（System）➜ 管理登录（Administration
    Login）。在提示时输入密码。在出现的对话框中，点击安全（Security）选项卡。勾选启用自动登录（Enable Automatic Login）框，并在用户列表中选择你的用户名。完成后点击关闭（CLOSE）按钮。


    3 : 掌握桌面


    ![](img/acd1f85da6741773b2c9559b2eb5033d_52_0.png)


    **图 3-1.** Ubuntu 8.10 登录界面。


    ## 桌面布局


    Ubuntu 桌面最初看起来可能有点奇怪，但别担心。你很快就会习惯的。


    ## 面板


    Ubuntu 桌面与 Windows 的不同之处在于它有两个任务栏（在 Ubuntu 中称为*面板*）——一个在屏幕顶部，一个在底部。


    顶部的面板用于显示信息、启动程序和配置系统。底部的面板是程序最小化的位置，该面板还包含显示桌面按钮（左侧）、垃圾桶图标（右侧）以及虚拟桌面选择器（右侧；稍后会介绍）。文件可以拖动到垃圾桶图标上，点击它可以查看和清空垃圾桶内容。


    ## 主菜单


    屏幕顶部的三个菜单（应用程序、位置、系统）被称为*主菜单*。它们会一直显示在屏幕上。当一个应用程序启动时，它自己的菜单会出现在其窗口下方。


    左上角的应用程序（Applications）菜单提供了对系统上安装的 GUI 软件的访问。


    位置（Places）菜单提供了快速访问文件系统内部或连接的存储设备（如 USB 闪盘）。数字相机和 MP3 播放器在插入时也会列在这里。


    > 注意 我将在第四章中详细详细介绍 Ubuntu 文件系统，并详细解释文件管理器。


    系统（System）菜单与位置菜单一起提供了对电脑设置的控制。它有两个子菜单，如下：


    **偏好 (Preferences):** 此菜单主要允许调整与特定用户帐户和桌面操作相关的设置。你可以更改某些硬件设置，例如屏幕分辨率，但仅限于与个人桌面配置相关的设置。


    **管理 (Administration):** 此菜单提供系统级的硬件配置选项，例如更改时间/日期，以及配置底层 Ubuntu 系统的选项，如添加/删除软件。


    ## 图标和小组件


    菜单旁边分别是网络浏览器、电子邮件客户端和帮助系统的快捷图标。


    > 提示 你可以通过从菜单中甚至从桌面上点击并拖动图标，在此添加你自己的图标。


    顶部面板右侧是时间/日期显示，以及系统托盘区域。


    每个面板可以容纳任意数量的*小组件*——具有特定功能的微型程序。要添加小组件，只需右键点击面板上的任意位置，从列表中选择“添加到面板”。移除小组件（或面板上的现有项目），右键点击它并选择“从面板移除”。


    > 注意 面板上的几乎一切都可以这样移除，包括主菜单！事实上，从技术上讲，你在面板上看到的都是小组件。


    ## 虚拟桌面


    像所有 Linux 一，Ubuntu 使用虚拟桌面。这个方便的功能在 Windows 中是缺失的，但在 macOS X 10.5 中被称为 Space。


    使用虚拟桌面就像拥有第二个（或第三个等）显示器。程序可以放在任何桌面上，你可以通过底部的选择器在它们之间切换。


    > 提示 你可以通过按住 Ctrl+Alt 和左/右方向键来快速切换桌面。当鼠标悬停在虚拟桌面图标上时，也可以通过滚轮进行切换。


    虚拟桌面通过示例解释最为清晰，所以启动一个你喜欢的程序（可能是 Firefox 浏览器），然后点击屏幕右下虚拟桌面图标中的第二个图标切换到第二个桌面。程序似乎消失了。现在打开一个文件浏览窗口（点击位置
    ⇔ 主文件夹），然后点击第一个图标返回第一个桌面。第一个桌面的内容现在重新出现。


    看到它是如何工作的了吗？你可以留出一个虚拟桌面专门用于电子邮件，另一个用于网页浏览等日常任务，并在时在桌面之间切换。


    你可以拥有多达 36 个虚拟桌面——只需右键点击图标，选择偏好，并在工作区计数器中增加数量。你还可以为每个工作区命名一个描述性名称——双击列表中的条目并进行覆盖。


    > 提示 你可以通过右键点击窗口标题栏并将窗口移动到另一个桌面，从菜单中选择“移动到工作区右侧（或左侧）”。如果你有多个虚拟桌面，可以从子列表中选择。


