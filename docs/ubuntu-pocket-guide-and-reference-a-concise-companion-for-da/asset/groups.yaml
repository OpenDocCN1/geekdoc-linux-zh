    - `mkdir photos_{germany,france,england,span}`


    如果我们查看文件列表，会发现有了四个新文件夹：


    - `photos_germany`

    - `photos_france`

    - `photos_england`

    - `photos_span`


    换句话说，大括号 `{}` 内的任何内容都会单独添加到名称中，并创建一个新文件夹。括号内的每个项目之间应该用逗号分隔。如果你之后想删除 `photos_span`
    和 `photos_france`，与其输入两个独立的命令，不如使用括号扩展：


    - `rm -r photos_{france,span}`


    括号扩展适用于所有命令，而不仅仅是 `mkdir` 和 `rm`。例如，与其用逗号指定单个文件夹，不如指定一个数字范围。如果你想创建名为 `photos_1`、`photos_2`
    等文件夹，使用以下命令即可解决：


    - `mkdir photos_{1..10}`


    也可以指定字母而不是数字。以下命令将创建 `photos_A`、`photos_B` 等，一直到 Z：


    - `mkdir photos_{A..Z}`


    # 通配符 (Wildcards)


    在提到括号扩展的同时，还有提到通配符的概念。这个术语源于扑克，其中“wild”（百搭）可以代表任何东西。常用的通配符是星号 (`*`)，用于表示字符的任意组合。如果你想删除文件夹中的所有文件，可以输入：


    - `rm *`


    在这个例子中，星号代表包含任意数量字符的任何文件名。回到上面的例子，可以这样删除 `photos_germany`、`photos_france` 等：


    - `rm -r photos_*`


    这将删除任何以 `photos_` 开头但后面没有跟任何内容的文件。`?` 可以表示任意的单个字符。以下命令将删除 `photos_1`、`photos_3`
    和 `photos_4`，但留下其他名为 `photos` 且跟两个字符的文件夹：


    - `rm -r photos?`


    换句话说，方括号 `[]` 内的每个字符都会替换文件名中的内容，方式与括号扩展类似。然而，通配符设计用于匹配现有文件（数据）中的字符模式，因此它们在创建文件时不起作用。


    # 第六章：软件管理 (Software management)


    本章介绍如何安装和删除软件，以及管理软件子系统。你将探索 Ubuntu 核心的软件包管理系统。涵盖主题包括：


    - 软件包管理子系统的解释

    - 使用 Synaptic 安装和删除软件；

    - 手动安装软件包；

    - 在命令行安装和删除软件；

    - 添加新的软件存储库；

    - 从源代码编译程序。


    ## 软件包管理一切 (All about package management)


    许多 Linux 版本 Ubuntu 都依赖一种名为“软件包管理”（package management）的系统来处理所有的安装和删除需求。


    ### 软件包里包含什么？


    几乎所有的 Ubuntu 程序都以软件包文件的形式发布。软件包文件与 Windows 下的安装 `.exe` 文件类似，它们是包含程序组件的单一存档文件。当程序安装时，组件会被解压到硬盘上，并配置系统使软件能够运行。


    然而，与 Ubuntu 的一个关键区别是软件包只包含程序本身。Windows 典型的 `.exe` 文件包含程序，还包含允许程序正确运行的各种系统文件。如果一个
    Ubuntu 程序需要额外的系统文件，它们需要单独安装，并且可能存在于它们自己的软件包中。


    理解这一点很重要：在典型的 Ubuntu 安装中，所有内容最初都源自软件包——从 Linux 内核到 Nautilus 文件管理器，再到系统字体。当你安装
    Ubuntu 时，安装程序所做的只是按顺序解压数百个软件包。


    ### APT 和 dpkg


    使用 Ubuntu 的两个软件子系统来安装和删除软件包：高级软件包工具 (APT) 和 Debian 软件包系统 (dpkg)。APT 和 dpkg 是同一枚硬币的两面。dpkg
    在基础层面工作，负责安装和删除软件包的工作，而 APT 则在更高层级工作，负责跟踪已安装了哪些软件包。


    APT 非常聪明。因为它跟踪一切，所以当你尝试安装一个会给现有程序带来麻烦的软件包时，它会提醒你。在大多数情况下，它会提供一个解决方案。


    此外，APT 还允许进行智能且高效的软件更新——涵盖系统软件和应用程序。


    之所以能够进行更新，是因为 APT 不仅知道已安装了哪些，还知道哪些是可安装的，包括已安装软件的新版本。这通过使用“软件存储库”（software repositories）得以。


    ## 软件存储库 (Software repositories)


    Ubuntu 使用软件存储库的方式与 Windows 处理软件管理的方式有最大的不同。


    存储库是软件包的大仓库。你可以称它们为软件库。通常存储库位于在线，也可以位于 CD/DVD 上，甚至在 USB 内存棒上。Ubuntu 安装光盘实际上就是一个小型存储库，例如，只包含安装
    Ubuntu 所软件。


    典型的 Windows 用户通过从网站下载或购买 CD/DVD-ROM 光盘来获取软件。几乎你可能想在 Ubuntu 上安装的软件都能在软件存储库中找到。因此，安装新软件只需从存储库下载并安装即可。APT
    会自动处理这两个任务。作为用户，你不需要直接处理软件包文件。


    '
