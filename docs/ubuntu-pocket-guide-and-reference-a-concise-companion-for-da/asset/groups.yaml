    In either version, you can select from the dropdown lists alongside each heading
    in the list. Once done, click the APPLY button and, if using Ubuntu 8.10, subsequently
    click OK to close the window.


    ## Managing print jobs


    To view or cancel print jobs, click Applications ⇨ Accessories ⇨ Manage Print
    Jobs. This will display the current print queue. To delete a job, right-click
    its entry in the list and select Cancel.


    If a print job stalls for whatever reason, an icon will appear at the topright
    of the screen. Double-clicking this will bring-up the printer queue window automatically.


    ## Installing a network printer


    To install a shared network printer in Ubuntu 8.10, such as one connected to another
    computer in your home or office, click System ⇨ Administration ⇨ Printing and
    click the NEW button on the toolbar (click NEW PRINTER if using Ubuntu 8.04).
    Then select the type of network printer you''d like to connect across the network.


    For printers utilizing a network server device—normally found only in corporate
    environments—select AppSocket/HP JetDirect. Enter the address details on the right
    of the printer window. This will probably take the form of an IP address and a
    queue name—see your administrator for these, or the printer server''s documentation.


    If connecting to a shared printer on a Windows PC, select Windows via SAMBA, and
    click the BROWSE button to have Ubuntu automatically detect shared printers on
    the local network, as shown in Figure 2-3. Click the chevrons alongside each heading
    to “unfold” them and when you find the printer you’re looking for, select it and
    click the OK button.


    Back in the parent window, click the radio button alongside Authentication Details
    Now (under Ubuntu 8.04 click the Authentication Required checkbox) and enter the
    Windows (not Ubuntu!) login username/password required to access the Windows account''s
    sharing the printer. Click VERIFY to check that the details works.


    Click Forward when done to install the printer driver. It is unlikely it will
    be detected, and you will have to select it manually by working through the list
    of printer manufacturers and models.


    - TIP You may have to adjust the firewall and/or sharing preferences on the Windows
    computer to be able to access the printer.


    ![](img/acd1f85da6741773b2c9559b2eb5033d_46_0.png)


    ## Removable storage


    Removable storage is an umbrella term describing any plug-in hardware that stores
    data. Examples include:


    - USB memory sticks;

    - External hard disks or CD/DVD-ROM drives;

    - Digital cameras;

    - Memory card readers (including those built-into a computer as well as those
    that attach to USB);

    - Media players, such as iPods and other MP3 players.


    All are accessed in a similar way under Ubuntu. Whenever you attach a file, a
    file browsing window will appear automatically showing the contents of the device,
    and an icon will appear on the desktop; you can double-click this to reopen the
    file browsing window should you close it. Additionally, an entry will be added
    to the Places menu at the top of the screen, and selecting it will also let you
    browse the device.


    > NOTE If you attach a memory card reader, it won''t appear to be connected until
    a memory card is actually inserted into it.


    With some removable storage devices that have specific uses, such as digital cameras
    or MP3 players, the relevant Ubuntu application might also start; plug-in a digital
    camera and F-Spot Photo Manager will appear, for example, if you do not wish to
    use the application at that time, just click its button.


    - TIP To change what applications start when certain types of removable storage
    devices are attached, or to stop them starting, open a file browsing (click Places
    -> Home Folder) and click Edit -> Preferences on the file browser menu. Select
    the Media tab in the window that appears, and choose from the dropdown lists that
    appear.


    There''s an important difference when using removable storage devices in Ubuntu,
    compared to Windows. Before physically removing the device from the USB socket,
    you must unmount it. This can be done by right-clicking the desktop icon and selecting
    the Eject, Unmount, or Unmount Volume option (the terminology varies depending
    on context). Alternatively, in Ubuntu 8.10, you can click the eject icon next
    to the removable device''s icon on the left of a file browsing window.


    Once the device has been unmounted, and the LED light on it has ceased flashing,
    it can be physically removed from the computer.


    > Other USB devices, such as printers or Bluetooth dongles, can simply be pulled
    out at will—no unmounting necessary—although watch out for printers that have
    built-in card readers. If any cards are inserted, they will have to be unmounted
    first.


    ## Scanners


    Scanners are installed and configured for use automatically. Ubuntu includes some
    excellent scanning software in the form of XSane Scanner that can be found on
    the Applications -> Graphics menu. It operates in a very similar way to Windows
    scanner drivers.


    - TIP If you want to utilize optical character recognition (OCR), in-install the
    gocr software package. Software installation is explained in Chapter 6. Once gocr
    is installed, you can start it by clicking File -> OCR-Save as Text in the Xsane
    viewer window after scanning.


    ## Bluetooth


    If your computer has Bluetooth capabilities, a Bluetooth icon will appear at the
    top-right of the screen. This can be used to configure aspects of Bluetooth connectivity.


    30 : Configuring Ubuntu


    ## Pairing (Ubuntu 8.10)


    If you''re using Ubuntu 8.10, and wish to pair your Ubuntu PC with a device, ensure
    what you want to connect is set to "discoverable" and click the Bluetooth icon
    on Ubuntu. Setup New Device from the menu that appears and click the FORWARD button.
    The device you want to pair will instantly appear in the list of detected devices,
    although it might not immediately identified by its make/model. Wait a second
    or two for the information to appear. Select the device in the list and click
    the FORWARD button. You will be given a PIN to enter on the device, so do so.
    Once this is done, the devices will be paired.


    > NOTE On some Bluetooth devices you may have to authorize the pairing. How is
    this varies to device.


    ## Pairing (Ubuntu 8.04)


    Bluetooth functionality under Ubuntu 8.04 is less than perfect. If you intend
    to use Bluetooth devices with Ubuntu frequently, I recommend upgrading to Ubuntu
    8.10. However, if you have no other choice, the following instructions should
    follow.


    First, right-click the Bluetooth icon and select Preferences from the menu that
    appears. In the dialog box that appears, ensure the first tab is selected (the
    tab''s title will relate to the name of your Ubuntu system), and click Visible
    and Connectable for Other Devices.


    Initiate pairing on the Bluetooth device. How is this varies from device but once
    it''s done a rollout will appear at the top-right of the Ubuntu desktop prompting
    you to type the PIN you entered on the device. Once this is done, the devices
    will be paired.


    > TIP Be quick when you''re pairing devices—the time period during the PIN can
    be entered on the other device is a matter of seconds before pairing will be automatically
    cancelled.


    ## Transferring files


    Once a device has been paired to Ubuntu, you can send files between the two (assuming
    the file is capable of file transfer; examples include mobile phones or even other
    computers).


    ## Sending a file from Ubuntu


    To send a file from an Ubuntu computer, right-click the file and select Send To
    in the menu that appears. Ensure Bluetooth (OBEX) Push is selected in the Send
    As dropdown list, and the paired device is selected in the Send To dropdown list.
    Finally, click the SEND button.


    ## Sending a file to Ubuntu


    Right-click the Bluetooth icon and select Preferences in the menu that appears.
    In the dialog box, ensure the first tab is selected and click the Temporary Visible
    (this is referred to as Limited Discoverable and Connectable under Ubuntu 8.04).
    Initiate file transfer on the Bluetooth device, and respond to the prompts that
    appear on the Ubuntu desktop.

