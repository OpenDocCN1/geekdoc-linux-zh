    ## Dealing with crashed programs


    If a program you''ve started crashes and won''t quit, you can use System Monitor
    to terminate it. This program is found on the System Administration menu. Ensure
    the Processes tab is selected, then locate the crashed program in the list. Right-click
    it and select Kill Process. Note that you won''t be able to kill some programs
    because they are "owned" by the root user. This is discussed in more detail in
    Chapter 5, when we look at managing processes at the command-line.


    ## Changing the time & date


    To alter the time and/or date, right-click the time display at the right of the
    screen and click Adjust Date & Time.


    If using Ubuntu 8.10, make your changes in the dialog box that appears and click
    the SET SYSTEM time button. Type your password when prompted.


    In Ubuntu 8.04, click the UNLOCK button in the dialog box that appears, type your
    password when prompted, then make your changes.


    > You can make Ubuntu automatically synchronize with Internet servers, and therefore
    always have the correct time, by installing the ntp package. Software installation
    is explained in Chapter 6. Once ntp is installed, restart the computer.


    ## Rebooting and shutting down


    To shutdown or reboot the computer, click the Shut Down entry on the System menu
    (under Ubuntu 8.04, select the Quit entry). Then select the relevant option from
    the dialog box that appears.


    > You can also end your Ubuntu session by selecting the relevant entry the Fast
    User Switch applet; see Figure 3-3 above.


    Depending on your PC''s hardware capabilities, you might also see options to suspend,
    or to hibernate. These are power saving modes, and the differences are as follows:


    - **Suspend:** This reduces power to all hardware devices with the exception of
    RAM. To "wake" the computer, you must hit a key, or press the computer''s power
    button. The computer will come back to life within a second or two, and you can
    continue working in applications that were open prior to suspending.


    - **Hibernate:** This saves the contents of the RAM to hard disk and entirely
    powers-down the computer, as if it has been switched off. When the computer is
    next powered on, the contents of the RAM are loaded from disk, and you should
    find yourself back at the instant you chose to hibernate.


    You should test either mode before relying on them. The hibernate mode in particular
    may or not work correctly, depending on your hardware configuration. Always save
    data in open applications before hibernating or suspending your computer.


    > To configure a laptop to automatically enter hibernate/suspend mode when the
    lid is closed, click System ⇞ Preferences -> Power Management, click the AC Power/Battery
    Power tabs, and choose the relevant option from the When Laptop Lid Closed dropdown
    list.


    ## CHAPTER FOUR


    ## Users and the filesystem


    The purpose of this chapter is to get you to speed with the Ubuntu filesystem.
    You''ll learn about:


    - How Ubuntu compares to Windows when it comes to files;

    - Where things can be found in the Ubuntu filesystem;

    - The basics of the users and permissions system that lies at the heart of Ubuntu;

    - The Nautilus file manager;

    - Useful filesystem tricks and tips;

    - File compression.


    ## How Ubuntu handles files


    Some comparison between Windows and Ubuntu is inevitable when discussing the filesystem.
    Although fundamentally similar, as a variant of Linux, Ubuntu differs from Windows
    in the following ways.


    ## Paths


    There are no drive letters under Ubuntu. Instead, the root of the filesystem,
    known as C:\ under Windows, is identified simply by a forward slash (/).


    Additionally, whereas Windows uses a backslash (\) to indicate the root of the
    filesystem, and to separate folders in a path listing, Ubuntu uses a forward slash.


    So, whereas a path like C:\Documents and Settings\Owner\My Documents is common
    under Windows, you will see something like /home/frank/Documents in Ubuntu. This
    difference can be jarring at first, but you will be surprised at how quickly you
    get used to it.


    ## Mounting


    If there are no drive letters then how are other storage devices accessed, such
    as CD/DVD drives, or USB memory sticks?


    The answer is that they''re mounted—effectively, the filesystem of the storage
    device is magically plumbed to a particular folder within the Ubuntu filesystem.
    Insert a CD/DVD, for example, and its contents will be visible when you browse
    to the /media/cdrom folder.


    It''s important to note that the files aren''t literally copied to the folder.
    They''re made available in a virtual way. You can manipulate the files and folders
    like any other files and folders, and although it might appear as if they are
    contained in that particular folder, they aren''t.


    Anything that might have already been in the folder as the mount point will temporarily
    disappear. However, the contents are still there, and if the device is unmounted,
    the contents will reappear.


    Mounting might sound complicated, but don''t worry—it''s always done automatically,
    either at boot-up for devices permanently attached to your PC, or when the device
    is plugged in.


    ## File and folder names


    Windows lets hide files and folders by setting a file attribute.


    Linux takes a simpler approach. Any file or folder that has a period (.) at the
    beginning doesn''t appear in file listings, unless the user requests all files/folders
    to be listed.


    In other words, if you rename report.doc to .report.doc, it will instantly become
    invisible and will seem to disappear from the file browser window (you might have
    to hit the Refresh button in the file browser window to update the list before
    it actually vanishes).


    A user''s personal configuration files are stored in their /home folder and are
    hidden by default. To view them, and other hidden files, click View <= Show Hidden
    Files in a file browsing window.


    NOTE Any file or folder that has a tilde (-) at the end of its filename (i.e.
    report.doc-) will be hidden in file listings provided by the Nautilus file manager,
    and on the desktop. They will be visible everywhere, including at the command-line.


    ## Important filesystem locations


    Each user on the system is given their own folder within the /home folder to save
    data. For example, the user jane is given the folder /home/jane. The /home folder
    is akin to C:\Users under Windows.


    Users aren''t permitted to save their personal files outside of their /home folder.
    This is rigidly enforced using ownership and file permissions, as I explain in
    the Users section below.


    Outside of the /home folder, the Ubuntu filesystem is a little more complicated
    than Windows, and it isn''t quite a case of program files being in one location,
    and system files in another.


    A cursory rundown of the Ubuntu filesystem can be found in Table 4-1, although
    this is not essential knowledge and is provided largely for reference purposes.


    Perhaps the most important locations for the majority of users:

    - /home, as described above;

    - /usr/bin, where practically all software is located;

    - /etc, where system configuration files are found.


    NOTE many versions of Linux, Ubuntu broadly follows the Filesystem Hierarchy Standard
    (FHS) to decide where things should go in the filesystem. For more details, including
    in-depth descriptions of each location, see www.kernel.org/fhs/.

