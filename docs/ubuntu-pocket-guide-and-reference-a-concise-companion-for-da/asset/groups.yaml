    TEST PAGE button. In Ubuntu 8.04, open the Printer Configuration dialog as described
    previously, click the printer''s entry in the list on the left, and click the
    PRINT TEST PAGE button (ensure the Settings tab is selected in the program window
    first).


    # Setting default print options


    To set the default print options, such as paper type or print quality, open the
    Printer Configuration window (System ⇔ Administration ⇔ Printing) and, if you''re
    using Ubuntu 8.10, double-click the printer''s icon in the window that appears.
    Following this, click the Printer Options entry in the list on the left of the
    program window. In Ubuntu 8.04, open the Printer Configuration dialog as described
    previously and ensure the printer is selected on the left of the program window.
    Then click the Printer Options tab.'
