    **Read only:** To limit a user to viewing a listing of files in a folder, ensure
    the read and execute permissions are set, but not the write permission:


    **Write permission:** To let a user create or delete files in a folder, ensure
    the read, write and execute permissions are set (note: it’s possible for a folder
