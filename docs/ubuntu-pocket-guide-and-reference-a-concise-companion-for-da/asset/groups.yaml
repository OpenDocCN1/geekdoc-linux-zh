    It''s not a good idea to scan the entire filesystem using ClamTK, because ClamAV
    simply isn''t built for that task. In fact, in my tests, any attempt to do a full
    filesystem scan caused ClamAV/TK to crash.


    Therefore, you should limit scans to your /home folder. This is where virus-infected
    files are most likely to be found because it''s where most files you download
    end-up.


    NOTE If you''re worried about getting a virus when installing software, don''t
    be. All software in the Ubuntu repositories is digitally signed. This is a method
    of ensuring the files can''t be tampered with. It''s true that any software packages
    you manually download and install contain viruses, but it''s very unlikely.


    Before starting a scan, ensure that ClamAV scans hidden files by clicking Options
    ⭞ Hidden Files.


    To start a scan of your /home folder, click File ⭞ Home (Torough). If using Ubuntu
    8.04, click File ⭞ Full Scan.


    Any virus-infected files will be listed under the File heading in the ClamTK program
    window, along with their location (path). The type of virus infection will be
    listed under the Status heading.


    You may see other files listed in the results area after a scan. If a file was
    too big to scan, it will be listed. If you wish to have ClamAV scan all files,
    regardless of size, click Options ⭞ No Maximum Size. Bear in mind this can dramatically
    increase the time taken to scan.


    ClamAV is unable to remove any virus infections in a file. Instead, the user must
    decide the course of action to take. Usually, deleting the file is best.


    All antivirus programs are prone to false positives—identifying files as containing
    viruses when they don''t. To guard against this, ClamAV report what it thinks
    is an infected file, search Google, specifying the name of the file and the name
    of the virus. If one or more people have encountered a similar result, that can
    identify a false alarm.


    # Encrypting files and folders


    Encryption is a method of encoding files so that they can''t be accessed without
    first being decoded. This usually requires a passphrase.


    The goal of encryption is usually to stop unauthorized individuals accessing private
    data. You might choose to encrypt personal files, example, such as bank statements.
    Or you might choose to encrypt a file'
  - '[PAGE 141]


    while transferring across the Internet, so anybody intercepts it in transit it
    will be unable to read it.


    Ubuntu allows the encryption and decryption of files and folders, those using
    Ubuntu 8.10 or later can also create an encrypted file store, in which files are
    automatically and invisibly encrypted.


    # Creating an encrypted /private folder


    Ubuntu 8.10 Intrepid Ibex introduces technology that allows on-the-fly encryption
    of files.


    How it works is that an encrypted filestyle is created. This is effectively a
    large archive file, like a tar file.


    When the user logs in, the filestyle is “unlocked” and mounted in the /private
    folder within a user''s /home folder.


    Any files saved to /private are automatically encrypted, although the user is
    entirely unaware of it. They can browse the filestyle just like any other, and
    read/write files within it without any additional work. If a file is removed from
    the folder, it is automatically decrypted but, again, this is invisible to the
    user.


    Apart from the owner is able to access the files within the /private—other users
    are locked out, although the root user can access the files when the user is logged
    in.


    When the user logs out, or shuts down the computer, the filestyle is “locked”—the
    filestyle is unmounted, making its contents inaccessible until the next login.
    This stops anybody accessing the files by booting the computer into rescue mode—a
    common way of bypassing security measures, in which the user is given root powers
    without having to enter a password.


    Setting-up the encrypted folder is simple. First, if you haven''t already, update
    your user software as described at the beginning of this chapter. Open a terminal
    window (Applications ↔ Accessories ↔ Terminal) and type the following commands:


    +   - sudo apt-get install encryptfs-utils

    - encryptfs-setup-private


    You''ll need to type your login password when prompted after typing the second
    of the commands. You''ll also be invited to create a mount passphrase. This can
    be anything from a few words to a sentence, and can include numbers and symbols
    such as punctuation marks. Ensure you remember what you type because you might
    need it at a future date'
