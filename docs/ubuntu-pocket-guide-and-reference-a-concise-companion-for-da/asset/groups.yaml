    Windows. If this doesn''t work, right-click a blank spot on the bar across the
    top of the screen and select Add to Panel from the menu that appears. In the list
    that appears, select Brightness المقبل and click the ADD button. This will add
    a new icon that, when clicked, presents a slider that will let you alter degree
    of backlighting.


    ## Screensaver


    You can choose a screensaver and adjust the amount of time after which it activates
    by clicking System -> Preferences -> Screensaver.


    ## Sound


    You can change the audio volume by clicking the speaker icon at the top-right
    of the desktop. Double-clicking this icon will bring up the main mixer window
    where you can control the volume of individual components of the sound system,
    such as the CD player, or PCM is the audio output from applications, including
    media players and the web browser.


    NOTE: PCM is sometimes referred to as "wave" or "wav" under Windows.


    To fully exploit the feature set of your sound card, click the PREFERENCES button
    in the main mixer window and put a check alongside any controls you''d add to
    the main mixer window (in Ubuntu 8.04, click Edit -> Preferences). The new slider
    or control will be added immediately.


    The precise features offered will depend on the capabilities of your computer''s
    sound hardware. For example, to add a slider control for surround sound, put a
    check alongside the relevant checkbox in the list.


    24 : Configuring Ubuntu


    ## Getting online


    Depending on the hardware used, there are a variety of ways of getting online
    and/or connecting to a network. I deal with each separately below.


    ### Wireless


    Network connections are handled by Ubuntu''s NetworkManager applet that can be
    found at the top right of the desktop. Its icon is two monitors inset against
    each other, as shown in Figure 2-2. Connecting to a network is simply a matter
    of selecting it and typing the wireless password when prompted. When done, click
    CONNECT.


    > Ensure the right kind of wireless protection (i.e. WEP/WPA) has been detected
    by Ubuntu. Ubuntu got this wrong in one of my tests. You can select by clicking
    the Wireless Security dropdown.


    To connect to a wireless network that doesn''t broadcast its name (ESSID), click
    the NetworkManager icon and select Connect to Hidden Wireless Network from the
    menu (or Connect to Other Wireless Network under Ubuntu 8.04). Type the ESSID
    into the Network Name field, and select the correct type of wireless protection
    from the Wireless Security dropdown list, filling-in the appropriate key/passphrase
    details beneath this. Click the CONNECT button when done.


    The Ubuntu 8.10 release includes much better wireless hardware support than earlier
    releases. If you find your wireless hardware isn''t supported by Ubuntu, and you''re
    using Ubuntu 8.04 or earlier, consider upgrading. You''ll know if the wireless
    card isn''t supported by because no wireless networks will be detected, although
    you should also ensure your computer’s wireless function is activated—with some
    notebooks, a special key combination must be hit, or wireless networking specifically
    enabled in the computer’s BIOS setup.


    - **TIP**: If you''re faced with non-working wireless, you might try installing
    the linux-backports-modules-intrepid package, if using Ubuntu 8.10, or linux-backports-modules-hardy,
    if using Ubuntu 8.04 (reboot after installing). If that doesn''t fix it, you might
    consider using Ndiswrapper. This is a hardware driver that lets you use Windows
    wireless drivers under Linux. I wrote about Ndiswrapper in my book Ubuntu Kung
    Fu. You can read the relevant extract by visiting the Ubuntu Kung Fu website:
    www.ubuntungfu.org/ndiswrapper_html.


    ### Wired (Ethernet)


    As soon you attach an Ethernet cable to your computer, your computer will be online
    straight away. No configuration is necessary.


    The exception is if your network doesn''t automatically assign IP addresses (it
    lacks a DHCP server). This is rare, but is sometimes the case in certain workplaces.
    In this case you''ll need to enter the IP, subnet mask, gateway, and DNS addresses
    manually, as follows.


    ### Configuring a static IP address (Ubuntu 8.10 and above)


    To configure a static IP address (no-DHCP) under Ubuntu 8.10, right-click the
    NetworkManager icon at the top-right of the screen and select Edit Connections.
    Click the Auto-etho entry. Click the EDIT button. In the new window that appears,
    ensure the Wired tab is selected and click the Auto settings. Click the IPv4 Settings
    tab, and select Manual from the dropdown list. Click the ADD button and enter
    your IP address, subnet mask, and gateway (router) details by clicking the entries
    under relevant headings. Add the DNS addresses in the DNS Servers text field (separate
    each by a comma). You can learn the Search Domains field. Once done, reboot the
    computer.


    ### Configuring a static IP address (Ubuntu 8.04)


    To configure a static IP address under Ubuntu 8.04, click System -> Administration
    -> Network. In the window that appears, click the UNLOCK button and enter your
    password when prompted. Select the Wired Connection and click the PROPERTIES button.
    In the dialog box that appears, uncheck Enable Roaming and in the Configuration
    dropdown list, select Static IP Address. Enter the IP address, subnet mask, and
    gateway (router) details into the relevant fields. Click OK and, in the DNS tab,
    click ADD.


    26 : Configuring Ubuntu


    ## Printers


    Your printer will be automatically detected and configured by Ubuntu. You can
    check to see if your printer has been detected by clicking System -> Administration
    -> Printing. If you''re using Ubuntu 8.10, the printer will be shown as an icon
    in the window that appears. With Ubuntu 8.04, the printer will be listed beneath
    the Local Printers heading on the left of the dialog box that appears.


    > TIP: Ensure your printer is turned on—it can''t be detected by Ubuntu otherwise!
    It takes Ubuntu a few seconds to install and configure a printer after it''s just
    attached or first switched on. You''ll be told when configuration has finished
    a call-out balloon at the top right of the screen.


    ## Printing a test page


    To print a test page in Ubuntu 8.10, open the Printer Configuration window (System
    -> Administration -> Printing), double-click the printer''s icon and click the
    PRINT TEST PAGE button. In Ubuntu 8.04, open the Printer Configuration dialog
    as described previously, click the printer''s entry in the list on the left, and
    click the PRINT TEST PAGE button (ensure the Settings tab is selected in the program
    window first).


    ## Setting default print options


    To set the default print options, such as paper type or print quality, open the
    Printer Configuration window (System -> Administration -> Printing) and, if you''re
    using Ubuntu 8.10, double-click the printer''s icon in the window that appears.
    Following this, click the Printer Options entry in the list on the left of the
    program window.

