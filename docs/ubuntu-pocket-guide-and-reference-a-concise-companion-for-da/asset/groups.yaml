    Might be described as specialist permissions system administration uses, and it''s
    unlikely you''ll need to make use of them day-to-day. They operate as follows:


    **Set User ID:** In its most typical use, the SUID permission allows a program
    to run as if the program''s owner was running it (in other words, it runs with
    the permissions of the file owner, rather than the user who''s running). It''s
    most commonly used to allow ordinary users to run programs with root powers, without
    the need to use sudo or switch to root user. Such a program would be owned by
    root, will set as executable, and have the SUID permission set. The s permission
    must be specified with chmod setuid (i.e. `sudo chmod u+s`). The SUID permission
    shows up in file listings as an s in the place of the usual x marks an executable
    file (i.e. `-rwsr-xr-x`).


    **NOTE** Under Ubuntu the SUID permission has no relevance when applied to folders,
    and is ignored if set.


    **Set Group ID:** As with SUID, the Set Group ID causes a program to run with
    the permissions of its group. However, SETGID is mostly used with folders, where
    it forces all files or subfolders created within the folder to inherit the group
    permission of the folder, rather than the user who created it. As above, the s
    permission is specified (i.e. `chmod g+s myfolder`), and the permission shows
    up as s in file listings.


    **Sticky bit:** When set on a folder, the sticky bit means that only the owner
    of a file or subfolder within that folder can delete it (although the owner of
    the folder itself will be able to delete the file, as root). The sticky bit is
    useful for folders where the administrator doesn''t want users to be able to delete
    any other user''s files. The sticky bit is indicated in file listings by t at
    the end of the permission listing (i.e. `drwxrwxrwt`), and is by setting `chmod
    +t folder`. When applied to a file within Ubuntu, the sticky bit is meaningless
    and is ignored.


    **NOTE** You should see a capital S or capital T in file listings, instead of
    lower case letters, the execute permission hasn''t been set for the relevant file
    or folder. Although SUID and sticky bits normally rely upon the file/folder being
    executable, they don''t automatically set it.


    ## Table 5-2. bash keyboard shortcuts.


    | Key combination | Details |

    |---|---|

    | Up/down cursor key | Scroll through command history |

    | Ctrl+left/right cursor key | Move cursor from word to word |

    | Tab | Autocomplete command or filename/path |

    | Ctrl+A | Move to beginning of line |

    | Ctrl+E | Move to end of line |

    | Ctrl+W/Alt+Backspace | Delete word behind cursor |

    | Alt+D | Delete word in front of cursor |

    | Ctrl+U | Delete to beginning of line |

    | Ctrl+K | Delete to end of line |

    | Ctrl+Y | Restore text you''ve deleted |

    | Ctrl+L | Clear screen (actually, this simply moves the prompt to the top of
    the screen; existing commands are still visible if the terminal window is scrolled)
    |

    | Ctrl+C | Quit current program |

    | Ctrl+Z | Switch current program to background (see Job Management section) |

    | Ctrl+R | Search through command history |

    | Ctrl+D | Logout (technically, terminate input) |

    | Ctrl+T | Swap the two characters behind cursor |


    ## bash productivity tricks


    bash is the result of many years of computing research, and has evolved into an
    ultra-efficient piece of software.


    The key to being a bash master is to make use of keyboard shortcuts, and the command
    history—essentially, a list of commands you''ve already loaded. Additionally,
    bash has built-in job management. This means you can start a program, switch it
    to the background, and get on with something else while it completes.


    ## Keyboard shortcuts


    Table 5-2 lists keyboard shortcuts with reference to a modern PC keyboard. Some
    of the shortcuts refer to the command history, and explained in the next section.


    Perhaps the most useful keyboard shortcut is to hit the Tab key. This autocompletes
    commands and/or filenames. Most commands are short enough to be typed manually,
    but some filenames and paths can be long and therefore irritating to type.


    Say you want to delete (rm) the verylongfilename.doc. You could type rm very quickly
    and hit Tab to autocomplete the filename.


    Give Tab autocomplete a try. It''s more intuitive than it might sound.


    - **TIP** Tab autocomplete also works when installing programs using apt-get or
    dpkg commands, as described in Chapter 7. It will autocomplete package names based
    on what''s in the repositories.


    ## Command history


    Every time you type a command at a prompt, it''s remembered. A rolling list of
    500 commands are recorded, in fact, and you can see a list of them by typing history
    at the command prompt.


    - **TIP** If you only want to look at the last 10 commands, you could type history
    10. For the last 20, type history 20, and so on.


    Commands are remembered so you can reuse them. You can cycle through the history
    list, from the most-recently-typed command up, using the up/down cursor keys (Ctrl+P
    and Ctrl+N do the same thing).


    Alternatively, you can reuse any command in the history list by typing its number
    (as by the history command), preceded by an exclamation mark. If you want a view
    a file listing of the Documents folder, and ls Documents #48, you type `!48`.


    There''s another great trick: say you''ve just typed a command and want to use
    it. Typing two bangs (!!) will cause the last command you typed to run. For example,
    if you just typed `cp file.txt /tmp/`, typing `!!` will run that same command.


    You can also search through history interactively by hitting Ctrl+R. This lets
    you search through history, and bash will fill in the match. If it''s not correct,
    hit Ctrl+R again to see the next match.


    There''s a lot more to the command history function provided by bash. You''re
    advised to read the man page by typing man history.


    - **TIP** If you want to clear your history, just type history -c. Incidentally,
    the history data is kept in a simple file called .bash_history.


    ## Job management


    Thanks to the astonishing power of modern computers, very few commands take a
    long time to complete.


    - **NOTE** Bear in mind that modern computers are like gods compared to the room-sized
    computers that Unix was first developed in the 190s and 80s. Because of this,
    some of bash''s features can seem a little redundant in our modern day and age,
    but it''s surprising how often they come in useful.


    However, even though most commands complete in the blink of an eye, it''s useful
    to be able to run a particular command in the background, in order to get on with
    something else.


    For example, the updatedb command updates the database of files used by the location
    search command. You can run it from the commandline by typing sudo updatedb. If
    you do so, the prompt will be tied up for a minutes, during which you won''t be
    able to work unless you open a new terminal window.


    To avoid this, you can run the command in the background starting by adding an
    ampersand (&) character to the end:


    sudo updatedb &


    You''ll be told the job number (in square brackets), and can switch to the new
    job by typing fg.


    Alternatively, you can start the command as usual and hit Ctrl+Z. This will then
    put it in the background, returning control of the prompt to you. Again, you can
    switch back by typing fg.


    An example of how this might be useful if you''re editing a file using a text
    editor. By hitting Ctrl+Z, you can temporarily abandon the text editor to do something
    else, and type fg to switch back to it when you need.


    Many jobs can be started as background tasks, and you can list them using the
    jobs command. You can switch to individual jobs by typing a percentage symbol
    and the job number—for example %2 will switch to job #2 in the list.

