  - '[PAGE 150]


    # dependency


    Additional software needed for a program to work.


    # dependency hell


    A situation where a user manually attempts to solve *dependency issues while installing
    or removing software, only to be presented with more dependency requirements.


    # desktop environment


    Software that provides the graphical user interface, such as the desktop, trash
    facility, file manager, and so on. Examples available for *Linux include *Gnome,
    *KDE and *Xfece, but there are many others.


    # device file


    Special files, usually contained in the /dev folder, that provide access to hardware,
    or a particular function provided by the kernel.


    # directory


    Another word for a filesystem folder.


    # distribution


    A version of the *Linux operating system. Shortened to “distro”.


    # dpkg


    Debian Packaging system; the basic software subsystem that software on and off
    the system. See also *APT.


    # dual-boot


    If Windows and Ubuntu are installed on the same computer, it is said to dual-boot.
    A computer might also triple-boot if three operating systems are installed.


    # E


    # ext3


    Underlying technology that provides the filesystem used within Ubuntu and many
    other *distributions of *Linux.


    # F


    # Free Software


    Term devised by *Richard Stallman of the *GNU Project to identify software whose
    *source code is freely available for all to utilize, inspect, modify, and redistribute.
    See also *GPL.'
  - '[PAGE 151]


    The splintering of a software project into two or more separate (often independent)
    projects. This is possible because of the nature of *open source software, where
    the source code is freely available.


    # Gnome


    *Desktop environment focusing on user-friendliness and non-technical users. See
    www.gnome.org. The term was once an acronym for GNU Network Object Model Environment,
    but this has been dropped. See also *KDE and *Xfce.


    # GNU


    GNU''s Not Unix: a so-called recursive acronym referring to the GNU operating
    system that attempts to recreate *Unix. See *GNU Project.


    # GNU/Linux


    Another term for any operating system utilizing *GNU software and with the *Linux
    kernel at its heart. The term is preferred by *Richard Stallman because it acknowledges
    the input of the *GNU Project.


    # GNU Project


    Seminal operating system that recreates the venerable *Unix operating system using
    entirely *Free Software. See www.gnu.org.


    # GPL


    GNU Public License; software license used by most *Free Software projects in a
    legal contract that grants the right of users to view, study, modify, and redistribute
    the *source code of software, along with future iterations. The *Lesser GPL (LGPL)*
    cedes some of the requirements of the GPL, and is usually used to enable the redistribution
    of library files.


    # grep


    Global Regular Expression Print; *shell command that offers power-search features.
    In *Linux/*Unix circles, the word "grep" is synonymous with searching; to "grep
    a file" is to search through it.


    # hack


    A method of solving a problem, usually in an ingenious or makeshift way. See *hacker.'
  - '[PAGE 152]


    # hacker


    A *programmer or user of Unix (and by extension Linux). The term was hijacked
    by the media in the 1980s to refer specifically to computer criminals. Many true
    hackers object to this reclassification, and use the word *cracker* to describe
    such people.


    # KDE


    K Desktop Environment; *desktop environment utilized by *Kubuntu, in preference
    to *Gnome. See also *Gnome and *Xfce.


    # kernel panic


    A crash involving the *Linux kernel. Usually the words “kernel panic” appear on-screen
    when it occurs.


    # Kubuntu


    Version of Ubuntu that uses *KDE rather than *Gnome for its *desktop environment.
    A handful of graphical tools differ from the main Ubuntu release, but the projects
    are otherwise technically identical and are released to identical schedules.


    # LAMP


    *Linux, *Apache, MySQL, and PHP; combination of software used on web *server computers.


    # link


    A method of providing a filesystem shortcut to a file. Links are either symbolic,
    or hard. The difference is technical but symbolic links are most widely used.


    # Linux


    Technically speaking, Linux is the name of a kernel program. When used to describe
    an operating system, “Linux” describes a recreation of the *Unix operating system,
    usually using *Free Software.


    # log


    A file containing details of various occurrences alongside the time/date they
    occurred. Used for diagnostic purposes.'
  - '[PAGE 153]


    # md5sum


    Software that creates a unique checksum figure for a file by which it can be discerned
    if the file is complete and not corrupted or altered.


    # module


    Software that can be inserted or removed from the *Linux kernel to provide certain
    functions, usually although not always related to hardware. Similar to drivers
    under Windows.


    # mounting


    The process of making accessible the filesystem of a storage device. For example,
    if you insert a USB stick, it will be mounted so that the user can access the
    files on it. All filesystems have to be mounted, including the root filesystem
    containing the *Linux operating system. This is done very early in the computer''s
    boot process.


    # NFS


    Network File System; software that allows the sharing of files across a network.
    Although still used in larger institutions, the *Samba method of sharing files
    is more popular for smaller setups.


    # open source


    In the context of computer software, open source is similar to *Free Software
    although the focus is often on allowing others to view and share *source code;
    crucially, some open source licenses don''t place a requirement to share modifications
    made to code.


    # package


    An archive file containing installable software, along with configuration information
    for the software.


    # partition


    Portion of a disk, usually dedicated to a particular filesystem. Ordinarily, all
    operating systems exist within their own partitions.'
  - '[PAGE 154]


    How the system refers to currently running programs, or components of programs.


    # programmer


    Individual (or organization) that creates software. Also known as a developer.


    # proprietary


    In the context of *Free Software, refers to software whose source code breaks
    one or more of the requirements of the *Free Software definition.


    # PPA


    Personal Package Archive; some refer to a small software *repository that contains
    the work of a particular developer.


    # regular expression


    A way of precisely describing a search string using various symbols and/or protocols.
    Also known as a *regex*. Understanding regular expressions is a useful Linux skill.


    # relative path


    A description of the location of a file or folder specified in relative terms
    to the folder currently being browsed. See also *absolute path.


    # repository


    Large collection of software *packages, usually online. See *APT.


    # root


    In the context of the filesystem, the root is the bottom of the filesystem, indicated
    by a forward slash (/). The same as C:\ under Windows. The *root partition is
    the hard disk *partition that contains the Linux operating system files needed
    to boot.


    # root user


    The administrator user account.


    # run level


    The operational mode of *Linux—what *services are running, and therefore what
    functions are available to the user.'
  - '[PAGE 155]


    # Samba


    Background software that allows Ubuntu to access shared files/printers on Windows
    computers, and share files/printers itself.


    # script


    Essentially, a chain of commands that form a basic program. Scripts are used extensively
    when *Linux boots, in order to configure the system for the user.


    # server


    A computer (or program) that shares data or resources with *clients. Typical examples
    are web servers and file servers.


    # service


    Any software that runs in the background to provide essential functionality for
    the user or operating system.


    # shell


    Any software that allows a user to interact with a computer, although the term
    usually refers specifically to the *command-line. See *bash.


    # source code


    Sometimes referred to as simply “the source”; the original listing created by
    a *programmer. See also *compilation and *binary.


    # Shuttleworth, Mark


    South African entrepreneur responsible for creating Ubuntu, as well as setting
    up the Ubuntu Foundation, which provides its official home. Additionally, he owns
    and runs Canonical Ltd, which commercially sponsors Ubuntu and several related
    projects. Canonical also provides paid support services.


    # ssh


    Secure SHell; software that provides encrypted remote access to a computer.


    # Stallman, Richard


    Almost legendary *hacker who founded the *GNU Project, along with the Free Software
    Foundation (FSF), an organization that furthers the cause of *Free Software, a
    concept he originated.


    # standard input, output, and error


    In simple terms, standard input is the device that provides input at the *command-line.
    Usually this equates to the keyboard. Standard output refers to the device that
    shows output at the command-line.'
- md: '

    Usually this equates to the display. Standard error is like standard output, except
    it contains only error messages or warnings.


    ## swap


    Also known as virtual memory (or paging file under Windows); a file on the hard
    disk where the contents of memory can be temporarily cached to free-up physical
    memory for other software. Unlike Windows, the Ubuntu installer creates an entire
    *partition for swap use.


    ## T


    ## tar


    Archiving software popular with *Linux/*Unix users. tar files aren''t compressed
    by default, although the bzip or gzip software is often used to do so.


    ## tarball


    A tar file (informal).


    ## TCP/IP


    Transmission Control Protocol/Internet Protocol; networking technology used at
    the heart of *Linux, and the Internet.


    ## terminal program


    Program usually running in a *desktop environment that allows access to the *command-line.
    A terminal emulator.


    ## Torvalds, Linux


    Finnish national and *programmer (now resident in the US) who started the *Linux
    kernel project in 1991, and continues to both manage and contribute to it.


    ## tty


    Teletypewriter; *Linux (and *Unix) refers to the *command-line prompt on a technical
    level.


    ## U


    ## Ubuntu


    African personal philosophy emphasizing community and personal responsibility,
    popularized by Nelson Mandela in post-apartheid South Africa. It is from this
    philosophy that Ubuntu Linux is both inspired and takes its name.


    ## Unix


    Seminal operating system project created in 1969 by AT&T, initially as a research
    project, but then released as a commercial product. Successive iterations of Unix
    defined the ground rules for operating systems to the present day, and inspired
    clones such as *Linux and *GNU.


    ## vi


    Text editor that runs at the *command-line. Nowadays a clone of vi vim is commonly
    used, but this is still referred to as vi.


    ## virtual console


    Non-GUI method of accessing the Ubuntu *command-line, accessed by hitting Ctrl+Alt
    and F1-F6. A virtual terminal.


    ## Wine


    Wine Is Not an Emulator; software that creates much of the Windows infrastructure,
    allowing some Windows programs to run on Linux.


    ## X


    See *X.org.


    ## X.org


    Organization that provides the X11 software that Ubuntu uses for its graphical
    subsystem. Often, X11 is referred to simply as X, or as the X server. This refers
    to the client-server model X utilizes.


    ## Xfce


    - *Desktop environment used by the Xubuntu version of Ubuntu. The goal of the
    Xfce project is to produce software that uses minimal computer resources but still
    provides features modern users expect. Xfce was once an acronym for XForms Common
    Environment, but this has been dropped. See also *Gnome and *KDE.


    ## APPENDIX B


    Learning more and getting help


    An important aspect of being an efficient Ubuntu user is knowing where and how
    to get help and, generally speaking, help can be found in three places: in print,
    online, and within Ubuntu itself.


    ## Books and magazines


    Linux is well-served by magazine publications. Amongst those considered authoritative
    are Linux Journal (www.linuxjournal.com) and Linux Magazine (www.linux-mag.com).
    Outside of the US, English-language titles of note are Linux Format (www.linuxformat.co.uk),
    Linux User & Developer (www.linuxuser.co.uk), and Linux Pro Magazine (www.linux-magazine.com;
    known simply as Linux Magazine outside the US).


    Several PDF-based magazines are available too. Full Circle Magazine covers Ubuntu
    exclusively and issues affecting the Ubuntu community. It is community-generated
    and available free-of-charge. For more information, see http://fullcirclemagmagazine.org.


    Also worth reading is Free Software Magazine, published in a free PDF edition
    roughly every two months and covering matters relating to the world of Free Software,
    including but not limited to Linux. For more information, visit www.freesoftwaremagazine.com.


    In terms of books, for a complete guide to Ubuntu I recommend my own book, Beginning
    Ubuntu Linux (www.apress.com/book/view/1590599918. Now in its third edition, Beginning
    Ubuntu Linux was the first English-language book to cover Ubuntu. It went on to
    win a Linux award for End-User/Non-Technical Book of the Year, and regularly tops
    the list of best-selling books of its publisher.


    Also of interest may be my other book, Ubuntu Kung Fu (www.prag.com/titles/ktuk/ubuntu-kung-fu).
    Frequently topping the Linux best-seller list at Amazon.com, Ubuntu Kung Fu contains
    over 300 tips, tricks, hints, and hacks for Ubuntu users of all levels. It''s
    a superb partner to Ubuntu Pocket Guide and Reference, and will push your Ubuntu
    skills further while productively improving your Ubuntu experience.


    ## Online help


    Linux grow-up alongside the Internet, so it should come as no surprise the best
    source of help for Linux newcomers is found online.


    ## Forums


    The hub around which the Ubuntu community gathers is undoubtedly http://ubuntuforums.org,
    a series of message-board forums dedicated to all aspects of Ubuntu use.


    In addition to a fleet of expert moderators, many Ubuntu old-hands frequent the
    boards and are eager to share their wisdom and experience with those having problems.
    In addition, many create How To guides, relating particularly to the use of cutting-edge
    software, and these form an important part of Ubuntu''s community documentation.


    The key to getting the most from Ubuntuforums.org is to “do your research first.”
    So says Matthew Helmke “Only ask one question at a time,” continues Matthew. If
    you have more than one problem, create multiple.

    '
  mdcn: '


    通常这相当于显示。标准错误（Standard error）与标准输出类似，但它只包含错误消息或警告。


    ## swap


    也称为虚拟内存（在 Windows 下称为分页文件）；它是硬盘上的一个文件，可以临时缓存内存内容，以为其他软件腾出物理内存。与 Windows 不同，Ubuntu
    安装程序会创建一个整个*交换空间分区 (partition for swap use)*。


    ## T


    ## tar


    受 *Linux/*Unix* 用户欢迎的归档软件。tar 文件默认是不压缩的，尽管经常使用 bzip 或 gzip 软件进行压缩。


    ## tarball


    tar 文件（非正式说法）。


    ## TCP/IP


    传输控制协议/互联网协议；用于 *Linux* 核心和互联网的网络技术。


    ## terminal program


    通常运行在*桌面环境*中的程序，允许访问*命令行 (command-line)*。这是一种终端模拟器。


    ## Torvalds, Linux


    芬兰籍，兼*程序员*（现居于美国），他在 1991 年启动了 *Linux 内核*项目，并继续对其进行管理和做出贡献。


    ## tty


    电字机（Teletypewriter）；在技术层面上，*Linux（以及 *Unix*）指的是*命令行*提示符。


    ## U


    ## Ubuntu


    一种强调社区和个人责任的非洲个人哲学，由尼尔逊·曼德拉在种族隔离结束后的南非推广。Ubuntu Linux 的灵感源于这种哲学，并以此此命名。


    ## Unix


    由 AT&T 于 1969 年创建的具有里程意义的操作系统项目，最初作为一个研究项目，后作为商业产品发布。Unix 的连续迭代定义了直到今天操作系统的准则，并启发了如
    *Linux* 和 *GNU* 等克隆版本。


    ## vi


    运行在*命令行*中的文本编辑器。如今通常使用 vi 的克隆版本 vim，但仍然被称为 vi。


    ## virtual console


    访问 Ubuntu*命令行*的非 GUI 方法，通过按下 Ctrl+Alt 和 F1-F6 访问。一种虚拟终端。


    ## Wine


    Wine 不是模拟器（Wine Is Not an Emulator）；一种创建许多 Windows 基础设施的软件，允许某些 Windows 程序在 Linux
    上运行。


    ## X


    参见 *X.org*。


    ## X.org


    提供 Ubuntu 用于图形子系统的 X11 软件的组织。X11 通常被简称为 X，或 X 服务器。这指的是 X 所采用的客户端-服务器模型。


    ## Xfce


    - Ubuntu Xubuntu 版本使用的*桌面环境*。Xfce 项目的目标是产生使用极少计算机资源但仍提供现代用户预期功能的软件。Xfce 曾是 XForms
    Common Environment 的缩写，但现已弃用。参见 *Gnome* 和 *KDE*。


    ## APPENDIX B


    学习更多并获取帮助


    成为高效 Ubuntu 用户的一个重要方面是知道在何处以及如何获取帮助，通常情况下帮助可以在三个地方找到：纸质书籍、在线以及 Ubuntu 内部。


    ## 书籍和杂志


    Linux 得到了杂志物的良好支持。被认为具有权威性的刊物包括 Linux Journal (www.linuxjournal.com) 和 Linux Magazine
    (www.linux-mag.com)。在美国境外，值得关注的英文标题有 Linux Format (www.linuxformat.co.uk)、Linux
    User & Developer (www.linuxuser.co.uk) 以及 Linux Pro Magazine (www.linux-magazine.com；在美国境外简称为
    Linux Magazine)。


    还有几种基于 PDF 的杂志可用。Full Circle Magazine 专门涵盖 Ubuntu 以及影响 Ubuntu 社区的问题。它是社区生成的，并免费提供。更多信息请参阅
    http://fullcirclemagmagazine.org。


    值得读的还有 Free Software Magazine，它大约每两个月出版一次免费 PDF 版，涵盖与自由软件世界相关的事题，包括但不限于 Linux。更多信息请访问
    www.freesoftwaremagazine.com。


    在书籍方面，为了获得 Ubuntu 的完整指南，我推荐自己的书籍《Beginning Ubuntu Linux》(www.apress.com/book/view/1590599918)。该书目前已出版第三版，《Beginning
    Ubuntu Linux》是第一本涵盖 Ubuntu 的英文书籍。它获得了“年度终端用户/非技术类书籍”Linux 奖，并经常位列其出版社畅销书榜首。


    我的另一本书也可能感兴趣，《Ubuntu Kung Fu》(www.prag.com/titles/ktuk/ubuntu-kung-fu)。《Ubuntu
    Kung Fu》经常登上 Amazon.com 的 Linux 畅销书榜，包含了针对各水平 Ubuntu 用户的 300 多种技巧、窍门、提示和黑科技。它是《Ubuntu
    Pocket Guide and Reference》的完美伙伴，可以在有效提高你的 Ubuntu 体验的同时进一步提升你的 Ubuntu 技能。


    ## 在线帮助


    Linux 是随着互联网成长的，因此 Linux 初学者的最佳帮助来源在网上，这并不令人意外。


    ## 论坛


    Ubuntu 社区聚集的枢纽无疑是 http://ubuntuforums.org，这是一系列专门针对 Ubuntu 使用各个方面的留言板论坛。


    除了有一支专家版主团队外，许多 Ubuntu 老手也经常活跃在论坛上，并乐于与遇到问题的人士分享他们的智慧和经验。此外，许多人还创建了“如何做 (How To)”指南，特别是关于尖端软件的使用，这些构成了
    Ubuntu 社区文档的重要部分。


    从 Ubuntuforums.org 获取最大价值的关键在于“先进行自己的研究”。Matthew Helmke 是这样说的的。Matthew 补充道：“一次只问一个问题”。如果你有多个问题，请创建多个帖子。

    '
