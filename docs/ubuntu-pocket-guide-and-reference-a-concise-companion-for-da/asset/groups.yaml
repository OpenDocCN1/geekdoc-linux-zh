    middle of the screen showing the virtual desktops, then visual effects are not
    activated, and you might choose to utilize proprietary graphics drivers by following
    the steps mentioned under the Installing Proprietary Drivers handling above.


    **NOTE** Desktop visual effects aren''t an absolute necessity—Ubuntu is fully
    functional without them, even if it''s less pretty.


    To control the type of visual effects in use, or to deactivate them, click System
    ⇔ Preferences  Appearance. In the program window that appears, select the Visual
    Effects tab and select either None, Normal or Extra. The Normal setting is default.


    **TIP** For even more control over visual effects, install the compiz-config-settings-manager
    software package. I explain more about software installation in Chapter 6.


    #  Configuring a second monitor


    If you have more than one display device attached, Ubuntu will mirror the contents
    of the desktop across, and choose the higher of the two output devices as the
    desktop resolution. This can be handy if you have an LCD projector attached for
    presentations, but not useful if you have two monitors attached to your computer.


    To switch to an expanded desktop across the two display devices, so that each
    monitor has its own separate desktop area, click System ⇔ Preferences Screen Resolution,
    and, in the dialog box that appears, ensure there''s not a check alongside the
    Mirror Screens/Clone Screens heading. Then click and drag the icon for the second
    display to where you''d like it to be "placed" in relation to the main monitor
    (i.e. to the left, right, or even above or below). This will affect where the
    cursor is moved to leave one desktop and enter the other on the second monitor.


    **TIP** On one of my test systems, the icon for the second screen appeared to
    be "hidden behind" the first screen. Clicking the first screen''s icon revealed
    it!


    By selecting the icon for each display device in the preview, you can also set
    the resolution you''d like to display in the Resolution dropdown-list.


    Once done, click the APPLY button. If the two monitors have different resolutions,
    you''ll be asked if you want the virtual resolution to be set to match the screen
    resolution. This is fine, so click the YES button.'
