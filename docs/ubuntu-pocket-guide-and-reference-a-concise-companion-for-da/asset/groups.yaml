  mdcn: '

    在任一版本中，你都可以从列表每个标题旁边的下拉列表中进行选择。完成后，点击 APPLY（应用）按钮，如果你使用的是 Ubuntu 8.10，随后点击 OK（确定）关闭窗口。


    ## 管理打印作业


    要查看或取消打印作业，点击 Applications（应用程序）⇨ Accessories（附件）⇨ Manage Print Jobs（管理打印作业）。这将显示当前的打印队列。要删除作业，右键点击列表中的该条目并选择
    Cancel（取消）。


    如果打印作业由于某种原因停滞，屏幕右上角会出现一个图标。双击此图标将自动弹出打印机队列窗口。


    ## 安装网络打印机


    要在 Ubuntu 8.10 中安装共享网络打印机（例如连接到家中或办公室另一台电脑的打印机），点击 System（系统）⇨ Administration（管理）⇨
    Printing（打印），并点击工具栏上的 NEW 按钮（如果使用的是 Ubuntu 8.04，请点击 NEW PRINTER）。然后选择你想通过网络连接的网络打印机类型。


    对于使用网络服务器设备的打印机（通常仅出现在企业环境中），请选择 AppSocket/HP JetDirect。在打印机窗口的右侧输入地址地址。这通常是以
    IP 地址和队列名称的形式出现——请咨询你的管理员或打印机服务器文档获取这些信息。


    如果连接到 Windows PC 上的共享打印机，选择 Windows via SAMBA，并点击 BROWSE（浏览）按钮，让 Ubuntu 自动检测本地网络上的共享打印机，如图
    2-3 所示。点击标题旁边的箭头以“展开”它们，当你找到寻找的打印机时，选择它并点击 OK（确定）按钮。


    回到主窗口，点击 Authentication Details Now（立即验证详情）旁边的单选按钮（Ubuntu 8.04 下点击 Authentication
    Required（需要验证）复选框），并输入访问 Windows 账户共享打印机所需的 Windows（不是 Ubuntu！）登录用户名/密码。点击 VERIFY（验证）检查详情是否有效。


    完成后点击 Forward（下一步）以安装打印机驱动程序。它可能无法被检测到，你必须通过浏览打印机制造商和型号列表手动选择。


    - 提示 你可能需要调整 Windows 计算机上的防火墙和/或共享偏好以便访问打印机。


    ![](img/acd1f85da6741773b2c9559b2eb5033d_46_0.png)


    ## 可移动存储设备


    可移动存储是一个统术语，描述任何存储数据的插拔硬件。示例包括：


    - USB 优盘；

    - 外部硬盘或 CD/DVD-ROM 驱动器；

    - 数字照机；

    - 内存卡读卡器（包括电脑内置的以及连接 USB 的读卡器）；

    - 媒体播放器，如 iPod 和其他 MP3 播放器。


    所有设备在 Ubuntu 下都以类似的方式访问。每当你插入文件时，会自动弹出一个文件浏览窗口显示设备内容，桌面上会出现一个图标；如果你关闭了该窗口，可以双击它重新打开文件浏览窗口。此外，屏幕顶部的
    Places（位置）菜单将添加一个条目，选择它也可以浏览该设备。


    > 注意 如果你插入了内存卡读卡器，在实际插入内存卡之前，它不会显示已连接。


    对于某些具有特定用途的可移动存储设备（如数字照机或 MP3 播放器），相关的 Ubuntu 应用程序也会启动；例如，插入数字照机后会出现 F-Spot 照片管理器，如果你此时不想使用该程序，只需点击它的按钮。


    - 提示 要更改在插入特定类型的可移动存储设备时启动的应用程序或停止它们启动，请打开文件浏览器（点击 Places -> Home Folder），并在文件浏览器菜单上点击
    Edit -> Preferences（偏好）。在出现的窗口中选择 Media（媒体）选项卡，并在出现的下拉列表中进行选择。


    在 Ubuntu 中使用可移动存储设备与 Windows 有一个重要的区别。在从 USB 插槽物理移除设备之前，你必须卸载它。这可以通过右键点击桌面图标并选择
    Eject（弹出）、Unmount（卸载）或 Unmount Volume（卸载卷）选项来实现（术语因上下文而异）。或者，在 Ubuntu 8.10 中，你可以点击文件浏览窗口左侧可移动设备图标旁边的弹出图标。


    一旦设备已卸载且其上的 LED 灯停止闪烁，即可从计算机上物理移除了。


    > 其他 USB 设备（如打印机或蓝牙适配器）可以随时随意拔出——不需要卸载——但要注意带有内置读卡器的打印机。如果插入了任何卡，则必须先卸载它们。


    ## 扫描仪


    扫描仪会自动安装并配置以便使用。Ubuntu 包含了一些优秀的扫描软件，形式为 XSane Scanner，可以在 Applications（应用程序)->Graphics（图形）菜单中找到。它的运行方式与
    Windows 扫描仪驱动非常相似。


    - 提示 如果你想利用光学字符识别 (OCR)，请安装 gocr 软件包。软件安装说明见第 6 章。一旦安装了 gocr，你可以在扫描后在 Xsane 查看窗口中点击
    File -> OCR-Save as Text（保存为文本）来启动它。


    ## 蓝牙


    如果你的计算机具有蓝牙功能，屏幕右上角会出现一个蓝牙图标。可以用它可以配置蓝牙连接的各个方面。


    30 : 配置 Ubuntu


    ## 配对 (Ubuntu 8.10)


    如果你正在使用 Ubuntu 8.10 并希望将你的 Ubuntu PC 与设备配对，请确保要连接的设备设置为“可发现”，并点击 Ubuntu 上的蓝牙图标。从出现的菜单选择
    Setup New Device（设置新设备）并点击 FORWARD（下一步）按钮。你想配对的设备将立即出现在检测到的设备列表中，尽管它可能不会立即通过品牌/型号识别。等一两秒让信息出现。在列表中选择设备并点击
    FORWARD（下一步）按钮。你将获得一个需要在设备上输入的 PIN 码，输入即可。完成后，设备将完成配对。


    > 注意 在某些蓝牙设备上，你可能需要授权配对。这因设备而异。


    ## 配对 (Ubuntu 8.04)


    Ubuntu 8.04 下蓝牙功能并不完美。如果你打算经常在 Ubuntu 上使用蓝牙设备，我建议升级到 Ubuntu 8.10。但是，如果没有其他选择，应遵循以下说明。


    首先，右键点击蓝牙图标从出现的菜单中选择 Preferences（偏好）。在出现的对话框中，确保选择了第一个选项卡（标题将与你的 Ubuntu 系统名称相关），并点击
    Visible and Connectable for Other Devices（对其他设备可见且可连接）。


    在蓝牙设备上启动配对。这种方法因设备而异，但一旦完成，Ubuntu 桌面右上角将弹出提示，要求你输入在设备上输入的 PIN 码。完成后，设备将完成配对。


    > 提示 配对设备时要快——在另一个设备上输入 PIN 码的时间只有几秒钟，否则配对将自动取消。


    ## 文件传输


    一旦设备与 Ubuntu 配对，你就可以在之间传输文件（假设文件支持文件传输；示例包括手机或其他计算机）。


    ## 从 Ubuntu 发送文件


    要从 Ubuntu 计算机发送文件，右键点击该文件并在出现的菜单中选择 Send To（发送到）。确保在 Send As（发送方式）下拉列表中选择了 Bluetooth
    (OBEX) Push，并在 Send To（发送到）下拉列表中选择了配对的设备。最后，点击 SEND（发送）按钮。


    ## 向 Ubuntu 发送文件


    右键点击蓝牙图标从出现的菜单中选择 Preferences（偏好）。在对话框中，确保选择了第一个选项卡，并点击 Temporary Visible（临时可见，在
    Ubuntu 8.04 下被称为 Limited Discoverable and Connectable）。在蓝牙设备上启动文件传输，并响应 Ubuntu
    桌面上出现的提示。


