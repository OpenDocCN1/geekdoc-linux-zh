    - 在命令行下使用 root 权限；

    - 处理崩溃或挂起的程序；

    - 理解并操作文件权限；

    - 高级技巧（重定向、管道和大括号扩展）。


    # 关于 shell 的一切切


    当我们谈论“命令行”时，我们说的是直接向 Linux 输入类型命令。大多数命令与操作文件有关，而某些命令用于管理系统。命令行提供了力量和灵活性，代价是略显陡峭的学习曲线以及——可以说——缺乏直观性。


    # bash 详解


    Ubuntu 中使用的命令行被称为 bash——Bourne Again SHell。它是 Bourne sh 程序的演进版本，是 Unix 最老的命令行程序之一。大多数人认同
    bash 在功能和易用性之间提供了最好的平衡。


    命令行程序有时被称为 shell（外壳），这个词源于——就像软体动物和甲壳类动物一样——shell 包裹在操作系统脆弱的内部结构周围，保护它们免受意外损坏！


    > 注意：根据上述定义，图形用户界面有时也被称为 shell，它与命令行提示符具有相同的功能。


    在 Linux 下，有时会使用 bash 以外的其它 shell 程序。可能最流行的过于 Korn Shell (ksh) 和 C Shell (csh)。两者都面向编程，而且你很可能会接触到它们。bash
    是大多数流行 Linux 发行版的默认 shell。


    # 是 DOS 而不是 DOS


    你可能好奇 Linux 命令行是否与 Microsoft DOS 相似。它们是远亲而非兄弟。DOS 是 CP/M 的克隆，而 CP/M 本身借鉴了许多 Unix
    命令行知识。一些 DOS 知识会让你领先，但你需要在学习过程中不断忘记旧的知识！


    # 理解提示符


    让我们直接进入主题。


