    ## Step-by-step: Installing Ubuntu


    Three methods of installing Ubuntu are detailed below.


    ## Standard (repartitioning)


    This method of installing Ubuntu involves booting your computer using the Ubuntu
    CD and shrinking the Windows partition during installation to make space for Ubuntu.


    > NOTE: On a technical level, what happens is that the Windows partition is shrunken,
    and an extended partition created for Ubuntu. Following this, two new partitions
    are created inside the extended partition: root, that will contain the Ubuntu
    installation, and swap. The latter is Windows'' paging file, except it is contained
    in its own partition. Some Linux distros create separate partitions for operating
    system files and user data, but Ubuntu uses just one partition for all data.


    The steps are as follows:


    - 1. Insert the Ubuntu CD and reboot your computer. At the BIOS startup screen,
    look for the keypress option that brings up the boot device menu. Exactly what
    this varies from computer to computer. On many computers you''ll need to hit the
    Esc key, or F12. Select the CD/DVD-ROM drive from the menu when it appears. If
    there''s no option for bringing up the boot device menu, enter BIOS setup by hitting
    the relevant key then configure the CD/DVD-ROM drive as the first boot device.
    Again, when boots this is how done varies from PC to PC.


    - 2. When the computer boots from the CD, the Ubuntu CD-ROM boot menu will appear.
    Using the up/down cursor keys, select your preferred language from the list and
    hit Enter. Then highlight the Install Ubuntu option on the main menu using the
    cursor keys and hit Enter.


    - 3. Eventually the Ubuntu installation program window will appear, as shown in
    Figure 1-1. Work through the choices, as entering your location and language choices,
    clicking the FORWARD button to move on each time.


    - 4. After some time, the disk partitioning choices will appear. Three options
    are listed: Guided–Resize SCSI (0,0,0) Partition–Use Entire Disk; and Manual (you
    may see Guided–Resize IDE inside the first option, but it''s the same thing).
    Guided–Resize Partition is the default choice, and the installer will attempt
    to choose the optimal resizing option for the Windows partition. A preview of
    the changes will be displayed in graphical form. By clicking and dragging the
    handle in the preview display alongside the New Partition Size heading, you can
    alter the size of the free space created (see Figure 1-2 overleaf, where the handle
    is indicated via an annotation; note that Figure 1-2 shows the Ubuntu 8.10 installer).


    No changes made until you click the FORWARD button. Usually the installer''s default
    resizing choice is fine, but it can be a little aggressive for Ubuntu, so you
    might opt to drag the slider to preserve a little more free space in the Windows
    partition. If after clicking the FORWARD button you see the error message “Too
    small size”, you will have to drag the slider to the right to give Windows more
    space.


    If you want to dedicate your computer''s hard disk entirely to Ubuntu, and erase
    Windows, click the Guided–Use


    ![](img/acd1f85da6741773b2c9559b2eb5033d_28_0.png)


    ## Figure 1-1. The Ubuntu installer.


    Entire Disk. You will need to select this option for installing Ubuntu on a second
    hard disk in your computer, in which case you should select the second entry in
    the list under the Guided—Use Entire Disk heading (probably identified as SCSI1
    (θ, 0,1) sdb, but you can also use the size of the hard disk as a means of identifying
    it).


    **CAUTION**: If you opt to remove the Windows partition, be aware that there''s
    no way of bringing it back. Be absolutely sure it''s what you want to do.


    The Manual option is for experts and lets you prefer appropriate existing partitions
    (useful if you''re upgrading from an older Ubuntu installation), or create new
    ones manually.


    - 5. After making your partitioning choices, click FORWARD. You''ll be asked to
    confirm your choices. Once partitioning has finished, you''ll be invited to create
    a user account. As directed, you''ll need to type your chosen password twice to
    confirm correct typing.


    **TIP**: The password can contain numbers, letters, symbols, and even spaces.
    The longer and more complex a password, the stronger it is.


    You''ll also be invited to type a name for the computer. This is how your Ubuntu
    computer will be identified on a network. It''s also the name that you''ll see
    at the command prompt (as explained in Chapter 5).


