    # About the author


    Keir Thomas is one of the world''s most prolific authors writing about Ubuntu
    Linux.


    Ubuntu Pocket Guide and Reference is his third Ubuntu book, and his award-winning
    comprehensive guide to Ubuntu—Beginning Ubuntu Linux (ISBN 978-1590599914)—recently
    reached a third edition.


    Thomas is also the author of Ubuntu Kung Fu (ISBN 978-19343356227), a unique book
    containing over 300 tips, tricks, hints, and hacks for Ubuntu. It regularly tops
    the Amazon.com best-seller list in the Linux category.


    He has written books on the subjects of SUSE and Fedora Linux, and edited books
    on subjects ranging from enterprise e-commerce to Ruby programming. In a previous
    life he edited several top-selling computer magazines, including PC Utilities
    and Linux User & Developer, and has written for many more.


    He lives in the United Kingdom and his pastimes include hiking, cycling, and gardening.


    He wishes to thank the technical reviewers of this book: John Southern, Matthew
    Helmke, and Ryan Troy.


    If you like Ubuntu Pocket Guide and Reference,

    why not get the PRINT EDITION?


    ## # Only $9.94 from Amazon.com


    Add it to your Amazon order now!


    Other books by Keir Thomas...


    ### Ubuntu Kung Fu


    The Pragmatic Programmers

    ISBN 978-1934356227


    Over 300 tips, tricks,

    hints, and hacks for

    the world''s favorite Linux.


    ### Beginning Ubuntu Linux, Third Edition / Apress


    ISBN 978-1590599914


    Comprehensive, award-winning guide. From zero to hero in over 700 pages!


    # A brief introduction


    The purpose of this chapter is to introduce you to the Ubuntu operating system,
    and the philosophy that underpins it.


    The fact you''re reading this book might mean you already know about Ubuntu, but
    one or two readers might have bought the Print Edition of this book (or downloaded
    the PDF) on a whim to see what the fuss is all about. These people might lack
    specifics, and remain unconvinced of the benefits of Ubuntu. So, I''m going to
    burn through some precious pages of this slim volume to evangelize and explain
    just a little.


    # What is Ubuntu?


    Ubuntu is a version of the Linux operating system. An operating system is the
    software that "runs your computer". Microsoft Windows is the world''s most popular
    operating system, at least for desktop computers, but Linux is a completely separate
    endeavor.


    # GNU


    The ball started rolling back in the 1980s, a hugely talented computer scientist
    Richard Stallman decided to create a clone of a venerable operating system called
    Unix. At the time, Unix ran many of the world''s industrial and academic computer
    systems.


    Stallman did this because Unix was becoming increasingly proprietary—it was no
    longer permitted to share its source code (the listings created by programmers),
    as had happened since the inception of Unix in 1969.


    This was anathema to Stallman, who believed sharing software was natural and healthy.
    He decided his version of Unix would always be freely available, and invented
    the legal and ethical concept of Free Software says users should always have the
    freedom to share software, without restrictions. On a technical level, Free Software
    guarantees the right to view and modify code, or even use it as a basis to make
    a new program. However, any additions or changes must be released as Free Software,
    so others can continue to benefit.


    The Free Software ideal is enshrined in a software license applied to all Free
    Software projects. It''s the GNU Public License, or even use GPL. This is Microsoft''s
    End User Agreement that comes with Windows (or even whenever you install Windows
    (from scratch), except whereas the Microsoft EULA prohibits Windows under any
    circumstances, the GNU says exactly the opposite—that you can always share the
    software!


    # Stallman called his version of Unix "GNU" (pronounced G-noo). This is a recursive
    acronym, for GNU''s Not Unix. In other words, the acronym refers to itself—a joke
    of type favored by programmers.


    # The Linux kernel


    GNU grew into a major project with many contributors. However, good as it was,
    it lacked a kernel. A kernel is the program at the heart of any operating system
    that takes care of fundamental stuff, like letting hardware communicate with software.


    Almost coincident, a chap Linus Torvalds provided a solution. In 1991 he started
    a personal project to create a kernel. Due to a naming error when his kernel was
    uploaded to the Internet, it got named after him and became known as Linux—a hybrid
    of "Linux" and "Unix".


    Crucially, Torvalds chose to release his kernel as Free Software, and invited
    any interested party to give him a hand. They did. Thousands of people around
    the world got involved. As the years went by, the project became more and important,
    and greater in its design and outlook. Today, the Linux kernel receives sponsorship
    from many major corporations, including IBM.


    > NOTE Torvalds continues to oversee and contribute to the Linux kernel project
    to this day. He humorously describes his role as a "benign dictator".

