    **图标标记（Emblems）：** 文件和文件夹上附有了小图标以供信息参考。其中某些图标具有特定的文件系统含义（将在下文的“图标标记”部分进行讨论），而另一些仅供用户辅助记忆。通过选择此侧边栏，将显示图标标记列表，可以将这些图标拖放到任何文件或文件夹上。要删除图标标记，只需对文件/文件夹重新应用相同的图标标记即可。


    -   **文件系统位置：** 如果选择了侧边栏的“位置”（默认如此），你将找到列出的位置或连接的存储设备。此列表与“位置”主菜单中的条目相同。在所示示例中，此列表如下：

    keir：这是指向用户 /home 文件夹的快捷方式——在创建截图的测试 PC 上，用户名为 keir。

    桌面（Desktop）：与 Windows一样，桌面上的文件包含在你个人 /home 文件夹中名为 Desktop 的特殊文件夹内。在这里你可以切换到那里。

