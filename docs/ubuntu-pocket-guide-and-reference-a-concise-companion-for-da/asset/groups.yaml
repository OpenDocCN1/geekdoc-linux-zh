    is used (<). Not all commands are designed to take redirected input, but the sort
    command is one of them. It can be used to alphabetically sort a list. If we had
    a file called shoppinglist.txt, that contained a list of products we wanted to
    buy from the store, and wanted to sort the list alphabetically, we could redirect
    the contents of the file into the command, like so:


    +   - sort < shoppinglist.txt'
