    文件可以在标签页之间拖放。要进行此操作，请将文件或文件夹拖到另一个标签页，Nautilus 将自动切换到那里。然后松开鼠标按钮。或者，你也可以像往常一样使用“编辑”菜单复制、剪切和粘贴文件。


    ## 搜索文件


    Ubuntu 提供了两种搜索文件的方法：使用系统范围的 Tracker 工具（详见第 3 章的“桌面搜索”部分），或使用 Nautilus 自身的简单文件搜索功能。这两种方法是独立的，你不需要启用
    Tracker 即可使用 Nautilus 的搜索功能。


    要使用 Nautilus 的搜索功能，点击工具栏上的“搜索”按钮，或按 Ctrl+F。输入你正在查找的文件名的部分并按回车。通过点击结果列表中的加号，你可以通过类型过滤来进一步缩小搜索结果。


    > 提示：Nautilus 还为当前文件夹中的文件提供快速粗略的搜索功能——确保 Nautilus 窗口是活动窗口，只需开始输入。窗口右下角会出现一个小小的文本字段，随着你的输入，文件/文件夹将自动匹配并选中。


    ## 特殊浏览位置


    Nautilus 不局限于你计算机的文件系统。它还能浏览 FTP 站点和 Windows 共享（称为 SMB/Samba 共享）。转到 ⇞ 位置，并在前面加上你想要连接的计算机地址，Windows
    共享使用 smb://，FTP 站点使用 ftp://。


    例如，要连接到网络上共享文件的计算机，我输入 smb://office_pc。要连接到地址为 example.com 的 FTP 站点，我输入 ftp://。一旦建立连接，将提示输入用户名和密码信息。


    或者，对于网络共享，你可以转 ⇞ 网络，Nautilus 将尝试检测任何共享资源。


    > 注意：Nautilus 还可以连接到 SFTP 站点。只需将 ftp:// 替换为 sftp://


    ## 文件关联


    双击某些文件将导致它们在相应的应用程序中打开。例如，双击电影文件将在 Totem 播放器中打开。使用你喜欢的另一种应用程序打开文件，右键点击它并选择“打开方式”。


    永久更改特定类型文件的默认应用程序，右键点击该类型的任意文件并选择“属性”。然后，在弹出的对话框中点击“打开方式”选项卡，选择列表中正确的单选框。如果列表中没有，点击“添加”按钮添加应用程序。完成后，点击“关闭”按钮。


    ## 文件压缩


    对于大多数普通用户来说，文件压缩是将许多文件合并成单个占用磁盘空间更小的存档的过程。这文件更容易传输到计算机。


    大多数 Windows 用户经常使用 Zip 文件格式，Ubuntu 也完全支持该格式。


    双击几乎任何格式的压缩文件都会用 FileRoller 程序打开，它就像 Windows 下的 WinZip。要提取存档内的任何文件或文件夹，只需将其拖动到新位置。


    要从文件或文件夹创建压缩文件，只需右键点击它并选择“创建压缩归”选项。从文件名旁边的下拉列表中选择你想使用的压缩类型。


    > 提示：Ubuntu 缺少一种流行的压缩格式：为 Ubuntu 添加 rar 压缩支持，安装 rar 和 unrar 软件包。软件安装将在第 6 章中讨论。请注意，这两个软件包都不是自由软件，且
    rar 软件是 40 天的共享软件演示版——安装时查看软件包描述以了解如何注册。


