    NOTE Standard input, output, and error are sometimes referred to as stdin, stdout,
    and stderr.


    All you need to know is this: In simple terms, standard input usually equates
    to the keyboard, and standard output equates to the display.


    With this in mind, let''s re-examine the extract from grep''s man page. It says
    that if no filename is supplied, grep will search standard input. In other words,
    if no filename is specified, grep will search what you type.


    This ability to search what you type might seem of questionable usefulness. However,
    as mentioned in Chapter 5, it is possible to redirect or pipe input into a command.
    In actual fact, redirection and piping replace standard input (hence the terms
    redirect or pipe—input to a command is redirected, or piped in).


    With this in mind, it becomes clear we can redirect or pipe input into grep, or
    any command like it can take standard input.


    NOTE Additionally, we can redirect or pipe the output of a command provided it
    uses standard output, which is to say, usually displays its results on screen.


    The author of the grep command''s man page knew all about streams, of course,
    and he wrote the description why he did because he expected you to know it. If
    he''d had to explain from scratch, it wouldn''t have taken four lines to describe
    grep''s function—it would have taken four pages.


    ## Structure


    man pages are split into headings, one inset against the main text and bolded.
    Commonly-encountered headings are as follows, although a typical man page may
    include more or fewer than this selection:


    - **Name:** Name of the command and a brief summary of its function.

    - **Synopsis:** A hypothetical example of the command. Arguments and options are
    underlined and listed where they should appear. Anything in square brackets ([
    ]) is optional. Pipes (|) separate choices where a variety of options can be specified.
    Ellipses indicate where more than one argument or option can be supplied.

    - **Description:** A concise and technical description of the command.

    - **Options:** Possible command options, and what they do.

    - **Files:** List of additional files the command uses, or requires (typically,
    configuration files).

    - **Notes:** Optional section that attempts to illuminate further the software
    or technology being discussed.

    - **Bugs:** Any limitations or bugs the user should watch out for; usually related
    to usage in highly untypical circumstances.

    - **Example:** Real-world programs (and/or man pages) you might like to

    - **See Also:** Other programs (and/or man pages) you might like to investigate
    that are related to the software in question.


    ## READMEs and other documentation


    Inside the `/usr/share/doc` folder, you''ll find subfolders for practically every
    piece of software installed on the system. Inside each folder is documentation
    created by the person (or people) behind the software.


    The files are usually plain text, although are sometimes compressed using gzip,
    in which case they''ll have a .gz file extension. The less command can be used
    to view both compressed and ordinary text files.


    Usually the list of files includes any or all of the following, and sometimes
    other files in addition:


    - README: These files provide informal notes about the software and its function.
    Sadly, they''re not always present. Bear in mind that READMEs aren''t written
    specifically for Ubuntu. Instead, they''re written for any potential user of the
    software, whatever operating system they''re using, which might not even be Linux.

    - changelog: List of feature additions or other changes made in successive versions
    of the software.

    - TODO: Work to be done on the software.

    - AUTHORS: Who wrote the software, plus contact details.

    - copyright: Details of the copyright agreement for the software.

    - NEWS: Similar to changelog, although inclusive of general developments in the
    software, or the project as a whole.


    Often there are separate versions of these files with a .Debian file extension.
    These are written by the package maintainer—the person who compiled the software
    for inclusion with Debian/Ubuntu. README.Debian files point out to know if using
    the software with Debian/Ubuntu, or sometimes provide a concise stand-in for a
    non-existent official README file.


