  - '[PAGE 91]


    point he''s back in the /home/frank folder, the final component of the command
    specifies the Music folder.


    It''s possible to navigate from any point in the filesystem to any other using
    a relative path. Of course, it''s not always the most efficient way of working,
    and sometimes specifying an absolute path is quickest. It''s down to the user
    to choose the best method each time.


    # Running programs


    What happens when the scenes when a command is typed?


    First, bash checks to make sure the command isn''t a builtin—a command that''s
    part of bash itself.


    If the command isn''t a builtin, bash checks to see if the command is one of the
    folders mentioned in the $PATH variable. This is a list of folders on the system
    that contains programs. You can view the $PATH on your system by typing echo $PATH
    at the command-line:


    +   - echo $PATH

