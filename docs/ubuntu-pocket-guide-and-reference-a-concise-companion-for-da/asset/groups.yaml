    # Enabling a master password


    Like many browsers, Firefox 3 can remember login usernames and passwords for various
    sites, so you do not have to type them on each visit. However, anybody with access
    to your computer will therefore be able to access these sites using your details
    you leave your computer unattended.


    Setting a master password allows you to lock and unlock the password file in which
    usernames and passwords are stored. Whenever you start Firefox and visit a site
    requiring a password, you''ll be invited to enter


