    able to save files there, not view a file listing);


    **Deny access:** To deny complete access to a folder for a user, unset all permissions–read,
    write, and execute.


    Any combination of folder permissions can lead to confusion.


    ## What permissions look like


    Within a command-line file listing, permissions are indicated by r, for read,
    w, for write, and x, for execute. For all files and folders, the permissions are
    listed in a line: first followed by group, and then others. See Figure 5-1 for
    an annotated example.


    Permissions, ownerships and group assignments can be viewed using the `ls -l`
    command. Give it a try by listing the permissions of files and folders in your
    /home folder:


    ```bash

    ls -l ~

    ```


    Here’s what I see on my system:


    ```

    total 28

    dr-xr-x 2 keir 4096 2008-10-24 10:07 Desktop

    dr-xr-x 2 keir 4096 2008-10-24 10:07 Documents

    lrwxrwxrwx 1 keir 26 2008-10-24 09:51 Examples -> 🔗

    /usr/share/

    dr-xr-x 2 keir 4096 2008-10-24 10:07 Music

    dr-xr-x 2 keir 4096 2008-10-24 10:07 Pictures

    dr-xr-x 2 keir 4096 2008-10-24 10:07 Public

    dr-xr-x 2 keir 4096 2008-10-24 10:07 Templates

    dr-xr-x 2 keir 4096 2008-10-24 10:07 Videos

    ```


    Let’s take a closer look at the first in the list–Desktop folder. The permissions,
    ownership and group assignment are listed at the beginning of the line and as
    follows:


    ```

    drwx-xr-x 2 keir

    ```


    The d at the beginning simply indicates this is a directory–another word for a
    folder. If a hyphen appears instead then we’re dealing with a file. There are
    a handle of other letters that can appear here, the main one you''ll encounter
    is l, which indicates a link.


    Following this are the three sets of permissions, listed one after the other:
    rwx-xr-x. After that is a link number, which isn''t relevant to this discussion
    and can be ignored. The owner''s username is listed (in this case, keir), and
    then the group file is assigned to (the group is also called keir).


    > NOTE: Under Ubuntu each user is assigned to their own personal group, this policy
    effectively means that group permissions are irrelevant for personal files unless
    you were specifically to add another user to your personal group. However, it''s
    still important you understand the concept of groups and how it applies to file/folder
    permissions.


    Here are the permissions separated out into sets of three relating to owner, group
    and others:


    - Owner: rwx

    - Group: r-x

    - Others: r-x


    The owner has read (r), write (w), and execute (x) permissions. In other words,
    he can do anything—he has full permissions. He can view a file listing of the
    Desktop folder, and write new files. He can switch to the folder by typing `cd
    Desktop`, or by browsing to it with Nautilus.


    Members of the group keir have read and execute permissions, so they can view
    a file listing of the folder, and also switch into it. However, they can''t write
    any files there, or delete them, because there''s a hyphen where the w would normally
    appear. Quite simply, a hyphen in place of a permission means “no permission".


    Finally, other users on the system also have read and execute permissions, but
    not write permissions—just like with the group permissions.


    ## 82: Hands-on at the Command-Line


    Let''s take a look at another example of permissions, this time from a word processing
