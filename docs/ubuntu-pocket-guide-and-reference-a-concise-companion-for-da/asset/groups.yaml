    a superb partner to Ubuntu Pocket Guide and Reference, and will push your Ubuntu
    skills further while productively improving your Ubuntu experience.


    # Online help


    Linux grow-up alongside the Internet, so it should come as no surprise the best
    source of help for Linux newcomers is found online.


    # Forums


    The hub around which the Ubuntu community gathers is undoubtedly dedicated http://ubuntuforums.org,
    a series of message-board forums dedicated to all aspects of Ubuntu use.


    In addition to a fleet of expert moderators, many Ubuntu old-hands frequent the
    boards and are eager to share their wisdom and experience with those having problems.
    In addition, many create How To guides, relating particularly to the use of cutting-edge
    software, and these form an important part of Ubuntu''s community documentation.


    The key to getting the most from Ubuntuforums.org is to “do your research first.”
    So says Matthew Helmke


    “Only ask one question at a time,” continues Matthew. If you have more than one
    problem, create multiple postings, but don''t post too much at once. Nobody likes
    seeing five messages in a row from the same individual.'
  - '[PAGE 160]


    Above all, when the problem is solved, add a message to that effect. “If the solution
    was posted by someone in the thread,” says Matthew, “Please thank them.” You can
    thank a user by posting a message saying so, but you can also click the *Thanks!*
    icon at the bottom right of the helpful posting. This increases the user’s “Thanks”
    count, and helps trustworthy and valued community members.


    If you find the answer elsewhere, post a link, and explain how the information
    you found helped you. Contextualize it if necessary.


    Above all, remember that Ubuntuforums acts as a massive store of wisdom relating
    to Ubuntu. Your posting boosts this effort.


    Ubuntuforums.org isn’t the only forum website, of course. I also recommend www.linuxquestions.org,
    a general Linux forums site with a strong Ubuntu section, but there are many others.


    # Mailing lists


    In addition to websites, you might consider joining one of the many Ubuntu email
    lists. Once you’ve subscribed, any messages sent to the list are sent out to all
    members, which can number in the hundreds of thousands. Other members of the mailing
    list can then answer your question, either directly via email, or by creating
    another posting to the mailing list.


    For a list of all the officially-supported mailing lists for Ubuntu, see https://lists.ubuntu.com.


    # Built-in documentation


    As mentioned in Chapter 5, all versions of Linux include man pages. These are
    effectively technical documentation about how the software in question works.


    Additionally, the creators of many programs sometimes create separate documentation
    that is often more informal, and this can be found in the /usr/share/doc folder.


    Finally, many GUI programs have their own help files, just like for Windows. They
    can be accessed by clicking the Help menu.


    # Understanding man pages


    Man pages are concise technical documentation, usually although not always written
    by the creator of the software in question, and designed to serve as a quick guide
    to using the software.'
  - '[PAGE 161]


    Most man pages describe command-line tools, but the authors of some GUI applications
    also create them.


    > TIP The man pages for many basic commands, such as cd, can be viewed by typing
    man builts.


    Unfortunately for newbies, man pages take no prisoners. Not only are they written
    in technical and thorough language, but they also assume in-depth foreknowledge
    of how Linux works.


    As mentioned in Chapter 5, the grep command searches for text in a file. However,
    a newcomer would have trouble discerning this from the description in grep''s
    man page:


    ```

    grep [OPTIONS] PATTERN [FILE...]

    ```


    grep searches the name input FILES (or standard input if no files are named, or
    if a single hyphen (-) is given as name) for lines containing a match to the given
    PATTERN. By default, grep prints the matching lines.


    However, as complex as man pages might seem at first, they can be easily navigated
    a few simple rules are understood.


    # Terminology


    You already know terms that appear frequently in man pages—argument and option—because
    they were introduced in Chapter 5. To recap, an argument (sometimes referred to
    as an arg in man pages) is usually what you tell a command to work on (or with).
    This is usually a file or folder. Command option alters how a command works, and
    is usually a word (or often) a letter, preceded by a hyphen (or two).


    > NOTE Depending on what a command option does and its complexity, you may find
    an option has its own set of arguments that alter how particular option works!


    Three phases occur frequently in man pages: standard input, standard output, and
    standard error. Known technically as standard streams, they have a specific and
    important meaning relating to how Linux operates.


    Standard input is where a program takes input from, if a file isn''t specified.
    Standard output is where the output of a program is sent. Standard error is similar
    to standard output, as you might have guessed, contains only error output.'
