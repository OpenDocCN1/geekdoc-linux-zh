    ## CHAPTER TWO

    ## Configuring Ubuntu


    In this chapter, you''ll learn how to configure your Ubuntu system. Every major
    area of hardware is tackled, including:


    - Keyboard and mouse;

    - Graphics and display(s);

    - Sound;

    - Networking (including wireless);

    - Printing;

    - Digital cameras/USB Flatbed scanners;

    - Bluetooth devices.


    ### Getting started


    Put simply, Ubuntu just works. Unlike with Windows, you don''t have to fiddle
    with drivers after installation—support for all types of hardware is built into
    the kernel.


    NOTE: The kernel is frequently updated, and each update brings better hardware
    support. This is one reason why you should keep your system updated. I explain
    how in Chapter 7.


    However, you will still have to configure the system to your requirements—configuring
    Ubuntu to access your wireless network, for example, setting up the printer for
    optimal output.


    ### Keyboard and mouse/trackpad


    Entries for configuring the keyboard and mouse (or laptop trackpad) can be found
    on the System -> Preferences menu—click the Keyboard entry to configure the keyboard.
    The options presented shouldn''t present any challenges to anybody who has configured
    a mouse or keyboard.


    ### Switching languages


    It''s possible to switch between two or more keyboard layouts on the fly. This
    can be useful if you find yourself regularly typing in different languages. To
    configure this feature, follow these steps:


    - Open the Keyboard Preferences (System -> Preferences -> Keyboard), and ensuring
    the Layouts tab is selected, click the ADD button if using Ubuntu 8.04.

    - Select the keyboard layout from the dropdown list. When you''ve made a selection,
    click the ADD button.

    - In the dialog, and in the list under Layouts heading, click the radio button
    alongside the entry you''d like to be default. This will be activated when Ubuntu
    boots. When done, click the CLOSE button.

    - Right-click the bar across the top of the screen, and select Add to Panel. In
    the dialog that appears, click and drag the Keyboard Indicator to panel. Then
    click CLOSE.


    From now on you can switch between layouts by clicking the applet you selected
    in the Keyboard Preferences dialog.


    ### Mouse


    If the pointer seems to move too quickly for you, open the Mouse Preferences (System
    -> Preferences -> Mouse), and click and drag the Acceleration slider little to
    the left. Changes take effect immediately, so test the mouse movement and adjust
    again until you''re entirely happy with the settings. To deactivate touchpad clicking,
    select the Touchpad tab and remove the check from the relevant box.


    ### Graphics


    In nearly all cases, Ubuntu''s graphical subsystem will work fine straight away.
    However, there are a handful of common but easily fixed issues.


    ### Changing screen resolution


    Ubuntu might guess the wrong screen resolution after installation. You''ll know
    this is the case because everything will appear blocky or blurred. To adjust the
    resolution, click the System menu at the top of the screen, and then Preferences
    -> Resolution.


    NOTE: You may have to adjust the Refresh Rate if you''re using a CRT monitor (i.e.
    glass tube display rather than TFT panel). The standard refresh rate comfortable
    is 75Hz. Flat panels should be set to 60Hz.


    If the screen resolution you want isn''t available in the dropdown, or just doesn''t
    work when selected, you might have to activate proprietary graphics drivers, as
    described below.


    ### Installing proprietary drivers


    Installing proprietary graphics drivers means Ubuntu will no longer use Free Software
    versions. This should only be done if absolutely necessary (for example, built-in
    drivers don''t produce optimal results because proprietary drivers are not updated
    as frequently as Free Software versions and can be very buggy). To install proprietary
    drivers, first ensure you''re online—see the Getting Online section later. This
    is necessary because the new drivers will be downloaded. Then click System ->
    Preferences -> Hardware Drivers.


    If you''re using Ubuntu 8.10, select the entry in your list for graphics driver
    and click the INSTALL button (see Figure 2-1 for an example).


    TIP: If several drivers are offered, select the one that''s marked "Recommended".
    If this proves less optimal, repeat this step and choose a different version.


    If you''re using Ubuntu 8.04, simply put a check in the Enabled column alongside
    the entry for your graphics card. With either version of Ubuntu, the new driver
    will be downloaded once you''ve made the selection. You may have to reboot the
    computer once it''s finished—just follow the on-screen prompts.


    ### Hardware Drivers


    No proprietary drivers are in use on this system. Proprietary drivers do not have
    public source code that Ubuntu developers are free to modify. They represent a
    risk to you because they are only available on types of computer chosen by the
    manufacturer, and security updates to them depend solely on the responsiveness
    of the manufacturer. Ubuntu cannot fix or improve these drivers.


    | Driver | Description |

    | :--- | :--- |

    | Support for Atheros 802.11 LAN cards | |

    | NVIDIA accelerated graphics driver (version 177) [Recommended] | Tested by the
    Ubuntu developers. License: Proprietary. 3D-accelerated proprietary graphics driver
    for NVIDIA cards. Required to fully utilize the 3D potential of NVIDIA graphics
    cards, as well as provide 2D acceleration of newer cards. If you wish to enable
    desktop effects, this driver is required. |


    *Figure 2-1. Utilizing proprietary drivers.*


    ### Activating desktop visual effects


    As with all modern operating systems, Ubuntu includes a number of desktop visual
    effects that mean program windows fade into view when first activated, or visually
    shrink when minimized. This can make Ubuntu a much more pleasant experience.


    Visual effects are made possible through the use of advanced graphics drivers.
    On systems utilizing Intel or AMD/ATI graphics chips, open source versions of
    such drivers are available and will be installed by default, but for computers
    utilizing certain graphics chipsets, proprietary drivers must be installed for
    desktop effects to work.


    You can tell if your computer has desktop effects already activated by holding
    down Ctrl+Alt and lifting the left or right arrow keys. This will activate virtual
    desktop switching (I explain more about this in Chapter 3). If the desktop “slides”
    out of view, visual effects are already activated and no further work is needed.
    If you see a small panel in the middle of the screen showing the virtual desktops,
    then visual effects are not activated, and you might choose to utilize proprietary
    graphics drivers.


    NOTE: Desktop effects aren''t an absolute necessity—Ubuntu is fully functional
    without them.


    To control the type of visual effects in use, or deactivate them, click System
    -> Preferences -> Appearance. In the program window that appears, select None,
    Normal or Extra. The Normal setting is default.


    ### Configuring a second monitor


    If you have more than one display device attached, Ubuntu will mirror the contents
    of the desktop across, and choose the higher of the two output devices as the
    desktop resolution. This can be handy if you have an LCD projector attached for
    presentations, but not useful if you have two monitors attached to your computer.


    To switch to an expanded desktop across the two display devices, so that each
    monitor has its own separate desktop area, click System -> Preferences -> Screen
    Resolution, and, in the dialog box that appears, ensure there''s not a check alongside
    the Mirror Screens/Clone Screens heading. Then click and drag the icon for the
    second display to where you''d like it to be "placed" in relation to the main
    monitor (i.e to the left, right, or even above or below). This will affect where
    the cursor is moved to leave one desktop and enter the other on the second monitor.

    '
