    ## Managing processes


    One of the commonest command-line tasks is clearing-up programs that have crashed,
    something known as managing processes.


    On a technical level, Linux refers to currently running programs as processes.


    NOTE Some processes start more than one process, so perhaps a better definition
    of a process is that it is all or part of a program, and not necessarily an entire
    program.


    You can see a constantly updating list of processes by typing the top command
    in a terminal (hitting Q will quit when you''re done).


    As with files and folders, all processes are “owned” by a user. Only the individual
    who owns a process can terminate it, although the root user has the power to terminate
    any process.


    The majority of processes listed in top are started at boot-up. These provide
    essential background services, so as the GUI. Such processes are usually owned
    by the root user. This protects them from interference by ordinary users.


    All processes are numbered. The number is known as the Process ID, or PID, and
    this is listed on the left of each entry in the top process list. To force a process
    to quit—known as killing the process—hit K and type the PID. You''ll be asked
    what signal you wish to send. Hitting Enter selects the default (15). This is
    fine in most cases.


    You can also use the ps command to list processes at the command-line, and find-out
    process IDs. Normally the a, u and x command options are used with ps, and cause
    the command to return a full list of all processes with their names.


    Additionally, the output is usually “piped” to the grep command to search for
    the process. In discuss the Advanced Bash Techniques section later, but for now
    it''s enough to know that piping “sends” the output of one command into another.


    Let''s look at an example. Although Firefox very rarely crashes, let''s say you''ve
    visited a website that''s caused it to lock-up. All attempts to quit the program
    in the usual way no longer work.


    The following command will search the list of running processes and return the
    PID of Firefox:


    - ps aux | grep firefox


    The PID is the first number listed on each line in the results, and on my test
    PC the PID for Firefox was 15994. Knowing this, I was able to use the kill command,
    as follows:


    - kill 15994


    This caused Firefox to instantly quit. Bear in mind that, if you kill a program
    in you are editing data, you won''t be prompted to save it first. The kill command
    shows no mercy!


    Another method of killing a program is to use the killall command. This lets you
    specify a command name, rather than the PID. So, to terminate Firefox, you could
    type the following:


    - killall firefox


    The downside of killall is that you need to know the program’s name.. ps aux can
    be used to discover this. killall also, as its name suggests, kills all examples
    of the process with the specified name.


    If you need to kill a root-owned process, simply precede kill or killall with
    sudo. Be very careful killing root-owned processes, however, because they tend
    to be related to the running of background services. Additionally, background
    service processes frequently spawn their own set of processes, and killing the
    parent process will in most cases also kill its child processes—often with disastrous
    results.


    ## Working with compressed files


    As mentioned on page 65, a variety of file compression and archive types might
    be encountered by the typical Ubuntu user. However, the two main types are zip
    files, as used in the world of Windows, and compressed tar archives.


    ### Zip files


    The following will create a new zip file called report.zip, and add report.doc
    to it:


    - zip report.zip report.doc


    To zip a folder full of files, add the -r command option. The following will create
    reports.zip, containing the contents of the reports folder:


    - zip -r reports.zip


    NOTE if any files or folders have spaces or unusual characters in them, enclose
    them in quotation marks.


    To unzip files, the unzip command is used. The following will extract the files
    from archive.zip:


    - unzip archive.zip


    To list files in an archive prior to unzipping, use the -l command option:


    - unzip -l archive.zip


    You can subsequently unzip a single file from the archive by specifying its filename
    (and path, if it''s contained within a subfolder within the zip!) after specifying
    the archive name. The following will extract only report.doc from archive.zip:


    - unzip archive.zip report.doc


    ## tar archives


    The tar command is both powerful and multifaceted. It was originally designed
    for backup purposes, but works equally well for individual files.


    ### Creating a tar archive


    The following will create a tar archive called archive.tar, containing the contents
    of the reports folder:


    - tar cvf archive.tar


    The c command tells tar to create, and the -f option tells the filename. The -v
    option provides verbose feedback. The j option is for bzip2, and the z option
    is for gzip.


    If you''re concerned that these options will be hard to learn, don''t worry.


    - tar -czf archive.gz


    ### Extracting from an archive


    The x command is used to extract files from an archive. The following will extract
    the contents of archive.tar:


    - tar xvf archive.tar


    The -v option provides verbose feedback of what being extracted, and the -f option
    tells the filename.


    The following will extract the contents of archive.tar:


    - tar xvf archive.tar


    To list files in an archive prior to unzipping, use the -t option:


    - tar tjf archive.tar


    To extract a single file from the archive, specify its filename (and path, if
    it''s contained within a subfolder within the zip!) after specifying the archive
    name. The following will extract only report.doc from archive.tar:


    - tar xvf archive.tar report.doc


    ## Advanced bash techniques


    Although they might be classed as advanced command-line skills, redirection, piping
    and brace expansion are not hard to understand. However, the fact they will only
    find by advanced users puts them outside the scope of this book, and they''re
    explained here in a concise manner.


    ### Redirection


    Sometimes it''s useful to send the output of a command into a file, rather than
    displaying it on screen. This is the principle of output redirection.


    Let''s say you wanted to make a permanent record of a file listing. To do this
    using redirection, type the following:


    - ls > listing.txt


    The right angle symbol (>) tells redirect output of the ls command into the file
    listing.txt, rather send it to the screen. Think of the angle-bracket as a funnel—the
    output of the ls command is “poured” into the listing file.


    If listing.txt doesn''t exist, it will be created. If a file of name already exists,
    its contents will be overwritten. Using two angle brackets (>>) instead of one
    will cause the output to be added to the bottom of an existing file.


