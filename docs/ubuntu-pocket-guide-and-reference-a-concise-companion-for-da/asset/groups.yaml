    按下 Alt+F2 可打开“运行应用程序”对话框。然后开始输入小写输入程序名称。在你输入几个字符后，名称将会自动补全。记下该名称并按回车键运行程序以确保其无误。


    你可以通过取消启动程序旁边的复选框来禁用现有的条目，但请注意，大多数条目的存在都有其原因，其中某些条目控制着关重要的后台服务的运行。只有在你完全确定可以在没有它的情况下运行时，才禁用某个条目。


    ## 处理崩溃的程序


    如果你启动的程序崩溃且无法退出，可以使用“系统监视器”（System Monitor）来终止它。该程序可以在“系统管理”菜单中找到。确保选中了“进程”（Processes）选项卡，然后在列表中找到崩溃的程序。右键点击它并选择“强制结束进程”（Kill
    Process）。请注意，你将无法杀死某些程序，因为它们由 `root` 用户“所有”。这将在第 5 章中详细讨论，届时我们将查看如何在命令行管理进程。


    ## 修改时间和和日期


    要更改时间和和/或日期，右键点击屏幕右侧的时间显示，并点击“调整日期和时间”（Adjust Date & Time）。


    如果使用 Ubuntu 8.10，在弹出的对话框中进行更改并点击“设置系统时间”（SET SYSTEM time）按钮。在提示时输入密码。


    在 Ubuntu 8.04 中，点击弹出的对话框中的“解锁”（UNLOCK）按钮，在提示时输入密码，然后进行更改。


    > 你可以通过安装 `ntp` 软件包让 Ubuntu 自动与互联网服务器同步，从而始终保持正确的时间。软件安装将在第 6 章中说明。安装 `ntp` 后，重启电脑。


    ## 重启和关机


    要关闭或重启计算机，点击系统菜单上的“关机”（Shut Down）项（在 Ubuntu 8.04 下，选择“退出”Quit 项）。然后从弹出的对话框中选择相关选项。


    > 你也可以通过选择快速用户切换小组件中的相关项来结束你的 Ubuntu 会话；参见上图 3-3。


    根据你 PC 的硬件能力，你可能还会看到挂起（suspend）或休眠（hibernate）选项。这些是省电模式，区别如下：


    - **挂起（Suspend）：** 这会降低 RAM 以外所有硬件设备的功率。要“唤醒”计算机，你必须按下任意键或按下电脑的电源按钮。计算机将在一两秒内恢复运行，你可以继续在挂起前打开的应用程序中工作。


    - **休眠（Hibernate）：** 这会将 RAM 的内容保存到硬盘并完全关闭计算机电源，就像关机了一样。当下次打开计算机时，RAM 的内容将从磁盘加载，你会发现自己回到了选择休眠的瞬间。


    在依赖这些模式之前，你应该测试其中一种模式。特别是休眠模式，取决于你的硬件配置，可能无法正常工作。在休眠或挂起计算机之前，请务必保存打开程序中的数据。


    > 要配置笔记本电脑在合盖时自动进入休眠/挂起模式，点击系统 ⇞ 偏好 -> 电源管理，点击 AC 电源/电池电源选项卡，并在“笔记本盖子合上时”（When
    Laptop Lid Closed）下拉列表中选择相关选项。


    ## 第四章


    ## 用户与文件系统


    本章的目的是让你快速熟悉 Ubuntu 文件系统。你将学习到：


    - Ubuntu 在文件方面与 Windows 有何对比；

    - Ubuntu 文件系统中可以找到哪些内容；

    - Ubuntu 核心的用户和权限系统的基础；

    - Nautilus 文件管理器；

    - 有用的文件系统技巧和提示；

    - 文件压缩。


    ## Ubuntu 如何处理文件


    在讨论文件系统时，Windows 和 Ubuntu 之间的比较是不可避免的。尽管在根本上是类似的，但作为 Linux 的变体，Ubuntu 在以下方面与 Windows
    有不同。


    ## 路径


    Ubuntu 下没有驱动器号。相反，文件系统的根目录（在 Windows 下被称为 `C:\`）仅由一个正斜杠 `/` 标识。


    此外， Windows 使用反斜杠 `\` 来分隔路径，而 Ubuntu 使用正斜杠 `/`。在 Windows 中路径如 `C:\Documents\Owner\My
    Documents`，而在 Ubuntu 中你会看到 `/home/Documents`。这种差异起初可能会感到很奇怪，但你很快就会习惯。


    ## 挂载


    在 Ubuntu 下没有驱动器号。那么如何访问像 CD/DVD 或 USB 内存棒之类的存储设备？答案是它们被挂载到了某个目录下的。例如，在 Ubuntu
    中你会看到 `/media/cdrom`。


    重要的是，存储设备在 Ubuntu 中通常被挂载到 `/media` 目录下。挂载听起来很复杂，但不用担心——它通常在启动时自动完成，或者当设备插入时完成。如果设备被卸载，内容就会消失，但会重新出现。


    ## 文件和文件夹名称


    Windows 通过设置文件属性来隐藏文件和文件夹。


    Linux 采取了更简单的方法。任何以点 `.` 开头的文件或文件夹都不会显示，除非用户请求显示所有文件/文件夹。


    换句话说，如果你将 `report.doc` 重命名为 `.report.doc`，它将立即变得不可见（你可能需要在文件窗口中点击刷新按钮来更新列表）。


    用户的个人配置文件存储在他们的 `/home` 目录下，并且默认是隐藏的。要查看它们以及其他隐藏文件，点击文件窗口中的“显示隐藏文件”。


    注意：任何以波浪号 `~` 结尾的文件或文件夹（例如 `report.doc~`）在 Nautilus 文件管理器提供的列表以及桌面上都是隐藏的。它们在任何地方都可见，包括命令行。


    ## 重要文件系统位置


    系统上的每个用户在 `/home` 目录下都有一个属于自己的文件夹来保存数据。例如，用户 jane 被赋予了 `/home/jane` 文件夹。`/home`
    目录类似于 Windows 下的 `C:\Users`。


    用户不允许在 `/home` 目录之外保存个人文件。这通过所有权文件权限被严格执行，正如我在下文的用户部分所解释的那样。


    在 `/home` 目录之外，Ubuntu 文件系统比 Windows 复杂一点，它并不是程序文件在一个位置、系统文件在另一个位置的情况。


    对于大多数用户来说，最重要的位置是：

    - `/home`，如上；

    - `/usr/bin`，几乎所有软件位于此处；

    - `/etc`，系统配置文件所在处。


