    ## 表 4-1. Ubuntu 文件系统中的关键位置。


    | 位置 | 详情 |

    | --- | --- |

    | /bin | 基础软件，通常是运行系统所需要的 |

    | /boot | 与启动菜单/加载程序相关的文件 |

    | /dev | 代表硬件设备的虚拟文件 |

    | /etc | 系统（全局）配置文件 |

    | /home | 用户的个人文件夹 |

    | /lib | 软件所需的支持（库））文件 |

    | /media | 包含可以挂载存储设备的子文件夹 |

    | /proc | 包含表示统计和设置的文件的虚拟文件夹 |

    | /root | root 用户的个人文件夹 |

    | /sbin | 系统维护所需的基础软件，通常由 root 用户使用 |

    | /tmp | 临时文件/文件夹 |

    | /usr | 本质上是包含系统使用的大部分软件的子目录，包括系统库和文档 |

    | /var | 对系统运行至关重要且不断更新的数据 |


    ## 文件扩展名


    总体来说，Linux 的趋势是不为系统文件使用扩展名。Ubuntu 下的可执行程序没有像 Windows 那样的 .exe 等扩展名。相反，它们是程序而非普通数据文件的这一事实是通过使用可执行文件属性来指示的。这将在第5
    章进行详细讨论。


    配置文件有时有 .conf 文件扩展名，但通常没有扩展名。事实上，许多纯文本文件没有扩展名；在 Linux 世界中，使用 .txt 文件扩展名非常罕见。例如，/usr/share/doc
    文件夹中的程序文档文件是纯文本且没有文件扩展名的。


    > 注意：/usr/share/doc 文件夹中没有扩展名并不完全正确，因为某些程序文档文件是压缩的，所以具有 .gz 扩展，但这是一个次要问题。


    然而，当涉及到用户的个人文件（如文档或图像）时，文件扩展名像在 Windows 下一样重要。例如，.doc 扩展的文件被识别为 Microsoft Word
    文件，.jpg 文件被识别为图像。


    ## 理解用户


    当你安装 Ubuntu 时，系统会为你创建一个个人用户账户。作为该过程的一部分，如前所述，在 /home 中创建了一个以你的用户名命名的文件夹。


    ## Root 用户


    事实上，在大多数 Linux 系统在安装期间会创建两个登录账户——标准用户和 root 用户。root 用户是一个特殊的用户账户，被赋予执行任何操作的能力，例如删除系统文件或安装软件。它的用户名始终是
    root。


    通常当在 PC 上使用 Linux 时，标准用户在需要管理系统时会登录 root 账户，完成后注销。她大部分时间都会在自己的普通用户账户中，在浏览网页时处理日常事务。


    Ubuntu 与大多数 Linux 略有不同。虽然 root 账户在后台存在，但不鼓励直接以 root 身份登录。必要时，使用用户“借用” root 权限来管理系统。通常，这是在提示时输入登录密码完成的。参见图
    4-2，这是尝试运行 Synaptic（一个管理软件的程序）时出现的示例。Synaptic 链接位于“系统管理”菜单上，如果你运行此菜单上的任何程序，就会弹出一个密码提示框。在输入密码之前，你无法进行任何后续操作；但在之后，该应用程序将以
    root 权限运行。


    或者，某些应用程序启动后，在点击解锁（UNLOCK）按钮之前，其功能将受到限制，此时会 way相同的密码请求。对于这些应用程序，输入密码并不会赋予整个应用程序
    root 权限，但这样更安全，最终，Ubuntu 的所有管理应用程序都将以这种方式工作。


    > 注意：在命令行工作时，任何需要管理权限的命令必须在前面加上 sudo（sudo 应该用于 GUI 应用）。我将在第 5 章中详细解释这一点。


    ## 文件权限


    尽管 root 用户账户在 Ubuntu 中处于次要位置，但它的影响无处不在。大多数操作系统文件都“所有”于 root 用户，并设置了只有 root 才能编辑它们的权限。换句话说，只有
    root 用户——或借用 root 权限的用户——才能删除或修改关键文件。在某些情况下，甚至禁止普通用户查看操作系统文件。


    ![](img/acd1f85da6741773b2c9559b2eb5033d_72_0.png)


    **图 4-2。** 输入密码以借用 root 权限并管理系统。


    这种通过 root 用户所有权来保护操作系统的简单机制，是 Linux 实施安全和系统保护的方式。它简单但高效，并且多年来经受了时间的考验。


    > 注意：Windows 未能区分这种区别，并有效地合并了标准和管理员类型的用户账户，这是它不安全的原因之一。如果病毒感染了系统，它将以管理员权限运行，因此确实会引起麻烦。Vista
    通过在用户每次对系统进行某些远程危险的操作时骚扰用户，某种程度上缓解了这种情况。


    文件权限是理解和操作 Linux 文件系统的核心，所以让我们深入了解它们。


    如之前所述，每个文件都属于一个特定的用户——即使是系统文件，也由 root 用户所有。


    文件的所有者可以设置三组不同的权限：首先针对他自己，其次针对组，最后针对其他人。


    在为自己设置文件权限时，文件所有者可以将文件标记为只读，例如，以避免意外更改。所有用户都是一个组的成员，每个文件都分配给一个组。第三组最后的权限可以针对*其他人*配置，即不在该组的用户。


    > 提示 在尝试理解 Linux 如何处理文件时，记住它是 Unix 的克隆（一种设计用于成百上千个不同用户的操作系统）会有帮助。你可以通过右键点击并选择菜单中的“属性”来查看任何文件或文件夹的权限。你只能更改你拥有的文件或文件夹的权限。


    让我们来看看权限的运作。用户 frank 创建了一个表格。他有用户 jane，他在会计部门的同事。frank 想要 jane 能够编辑该表格，因此为文件设置了组权限，以便会计组中的任何人都可以读取和写入表格。frank
    希望公司里的其他人能够查看该表格，包括不在会计组的用户。但他并不希望他们编辑它。因此，为其他人设置了只读权限。


    对于操作系统文件（由 root 用户所有），权限通常设置为系统上的其他用户可以查看（读取）文件，但不能修改（写入）。root 用户还拥有文件系统的根目录（在
    Windows 中称为 C:\）。这种特定的权限是“硬编码”的，因此只有 root 用户可以在那里创建新文件或文件夹。


    56 : 用户与文件系统


