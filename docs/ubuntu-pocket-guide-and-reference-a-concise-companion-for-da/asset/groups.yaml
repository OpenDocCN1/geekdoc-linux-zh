    ## Command Description


    ### ln

    Create a link to a file (similar to a shortcut under Windows); first specify the
    file (including path if necessary), and then the where the link should be created.
    A different filename may be specified for the new link.


    Typical example: `ln -s myfile.doc ~/Desktop/`

    - -s : Create symbolic link, rather than hard link. In nearly all situations,
    a symbolic link is preferable, making this practically a prerequisite.


    ### less

    Open specified plain text file in a viewer (use cursor keys to scroll; hit Q to
    quit). Useful for configuration files.


    Typical example: `less myfile.txt`


    ### df

    Show amount of free disk space on all filesystems.


    Typical example: `df -h`

    - -h : Show KB, MB, GB etc. rather than bytes


    ### free

    Show amount of free memory.


    Typical example: `free -mt`

    - -m : Show output in megabytes, rather than kilobytes

    - -G : Show output in gigabytes

    - -t : Show totals column


    ### grep

    Search through specified file for a word or phrase. First, specify the phrase,
    and then the file to be searched.


    Typical example: `grep -i myfile.txt`

    - -i : Ignore upper/lowercase when searching


    ### man

    View the manual (man) page for specified command. A built-in technical documentation—see
    Appendix B.


    Typical example: `man 1`


    ### nano

    Simple text editor that''s ideal for creating, editing or viewing files (particularly
    configuration files); hit Ctrl+J to justify current line during editing.


    Typical example: `sudo /etc/fstab`


    ### umount

    Unmount attached storage device. Not a typo! The command is umount. Needs root
    power. Specify the mount point.


    Typical example: `sudo umount /media/cdrom`


    ### locate

    Find specified file, relies on a background database that is periodically and
    automatically updated by typing the `updatedb` command.


    Typical example: `locate filename.doc`

    - -i : Ignore upper/lowercase when searching


    ## Working with root

    It''s generally discouraged to log in as the root user. Therefore, administrative
    tasks are carried out by ordinary users “borrowing” the root’s powers.


    At the command-line, you can force a command to run with root powers by preceding
    it with `sudo`. For example, to install software using the `dpkg` command (discussed
    in Chapter 6), root powers are needed, so to use `dpkg` you would type something
    like: `sudo dpkg -i package.deb`


    You''ll be prompted for password. Once this is entered, the command will complete.
    If you run a graphical application from the command-line, it''s necessary to precede
    it with `gsudo` instead of `sudo`. For most intents and purposes, `gsudo` is identical
    to `sudo`. For example, to start Synaptic installation, you would type `gsudo
    synaptic`. If you''re using Kubuntu, `kdeexec` is used instead, as with Ubuntu
    release.


    ## Temporarily switching to root

    Despite the desire to stop logging in as root, it’s possible to temporarily switch
    to the root account. If you have a lot of administrative work to do, typing `sudo`
    before each command can become annoying. To switch to the root user temporarily,
    type the following:


    After typing your password, you’ll see the prompt changes to a hash symbol (#),
    to indicate that you have root powers. When you’ve finished your work and want
    to return to your ordinary account, just type `exit`, or hit Ctrl+D.


    ## Enabling root login

    It''s also possible to enable the root account. This will make Ubuntu just like
    other versions of Linux and Unix. The benefit of this is that it will let you
    login as root at a virtual console—just type root as the username. To enable the
    root login, type the following;


    After typing your own password to authorize, you''ll be prompted to create a new
    password for root, so do: `sudo passwd root`


    Following this, in addition to logging in root at a virtual console, you can switch
    to the root user in a terminal window by typing `su`. Once the admin work is done,
    exit to logout (or hit Ctrl+D).


    NOTE Enabling the root account is considered reckless. For some major administrative
    operations, a root-enabled GUI can be useful. To allow login as root, click System
    ⇔ Administration ⇔ Login Window. Select the Security tab and check the box marked
    "Allow Local Administrator Login". Then logout and back in.


    ## File permissions in depth

    It''s at the command-line where permissions become important.


    ### The basics

    In Chapter 4, I mentioned that every single file is owned by a particular user
    on the system, and that the owner can set permissions for who can read the file
    and who can write to it (i.e. to modify the file).


    Firstly, he can set permissions for himself. He can deny himself complete access
    if he wants, but more usually he might choose to deny himself the ability to write
    to the file so he can''t accidentally damage it—effectively, making it read only.


    Additionally, each user is part of a group, and each file is assigned to a group.
    Further read/write permissions can be set to allow or deny access by members of
    the group file is assigned to.


    A third set of read/write permissions can be set for all other users on the system,
    regardless of what group they''re in.


    ### Execute permission

    In addition to reading and writing, another permission can be set for files: execute.
    This is what marks out a file as a program and not another data file.


    The idea of an execute permission can be confusing to Windows users. Under Windows,
    the .exe file extension is usually used to identify files that are programs. However,
    if the execute permission isn''t set on a Linux file, the program is effectively
    just another data file, regardless of its extension.


    All this means that, if Frank was to manually download some software, he can set
    permissions for who can run the program. Again, three sets of permissions are
    available—for himself, the group file is assigned to, and others. He could make
    it that he only can run the program.


    ### Folder permissions

    Folders are a little different from files when it comes to permissions. In order
    to understand how permissions apply to folders, it helps if you realize that,
    on a technical level, the execute permission controls access to the folder. Unless
    the execute permission is set for a folder, the user will not be able to do any
    of the following: (text continues)


    TIP: When logged in as an ordinary user you can start Nautilus file browsing with
    root powers by opening a terminal window and typing `gsudo nautilus`. However,
    close the window straight after you''ve finished with it, because that Nautilus
    window will be able to delete any file, anywhere on the system!

