    # # Lapse Code Editor HACK 64


    Lazygit starts off easy. You clone changes, post commits, and push changes to
    your shared code without troubling the documentation. It works like you might
    a version control system, and most projects can be like this, with a scattering
    of rebase and cherry picking. But with Git, it''s only a matter of time before
    your weary muscle memory comes into increasingly intricate knots that become almost
    impossible to untangle. It is then that you''ve used some kind of smart client
    to make better sense of it. This is when lazygit truly begins and takes over your
    terminal, filling the area with five or six different panes. When launched, lazygit
    asks you to watch a YouTube video explaining its features before the latest release
    notes.


    We always joke that the reason why so many programming text editors are creating
    such a text editor is an ideal project for programmers, especially when they''re
    switching to a new language. Because Rust seems to be a popular language, there
    are lots of new editors written in Rust. Rust also seems to be one of those languages
    people often mention, like Arch users never fail to mention their favorite Linux
    distribution. All of this is due to Lapse [1], a new programmer''s editor that
    makes its Rust editing capabilities sleek. But Lapse comes in a way that makes
    the installation easy. It''s practical, fast, simple, and uses edit and command
    modes like Vim.


    Despite these panes, lazygit is easy to understand if you use Git for some time.
    On the left five panes show the current file and git status, a modified list of
    commits, recent changes and whether there are any staged files (from other branches
    or not). Navigate between panes with the key and each entry with the cursor or
    Vim navigation. Selecting a file will update the state of the code with both unstaged
    and staged changes for a file, which is a diff showing what''s actually changed.
    This is one of the best features of lazygit, seeing for the current state of a
    git repository, what''s being worked on and giving you an immediate feel for what''s
    worked on and what has been recently completed. If you''ve never worked on a repository,
    or if you''ve worked on a repository for some time, this overview helps you get
    back up to speed.


    Lapse is in its early development stage, but it is growing as a daily driver for
    the reader. The main window is spacious, but it is also fast and functional. There
    are four panes: the main editor, an embedded terminal, for vert commit messages,
    and for changed files. This shows what you''re working within a git repository,
    or code while stopping to do other things. It is modal, which means an edit mode
    and command mode. Like Vim, the command palette is opened with the key; with Lapse,
    you see the commands you can use, including those for finding files, changing
    the theme (light and dark), and changing the configuration. It''s early enough
    to make it a good choice for desktop editing, and it''s likely to get better in
    the future.


    The Ubuntu 22.04 Snap package is shown: the binary archive we installed [2].


    By Graham Morrison


    https://github.com/jesseduff/lazygit


