    # # Run a Simple HTTP Server: weorf


    The whole tool mentioned in Hack 46 is perfect for one-offs, but it''s not all
    great if you want to share more than a single file or leave the tunnel open that
    you don''t have to keep renegotiating keywords. There are other ways to do this,
    but weorf is as simple to use as weorf.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_23_0.png)


    weorf (see figure) sets up a simple HTTP server, just like running Apache in the
    old days to share the contents of /srv/www. This makes it incredibly flexible,
    just from a web browser, or from almost anything with access to network WebDAV,
    or from virtual roots and custom CGI scripts. Using the command with a port to
    use (-port) and a folder to share (-d dir), all the client has to do access your
    IP with the correct port. It can be run in the background as a daemon, use certificates,
    handle authentication and listen only for specific IP addresses. If the command
    offers you more options (available in a separate package), a convenient GUI can
    run this all semiautotonously, adding the ability to do NAT traverse files outside
    of the local network and sending directories as: .tar.gz


    By Graham Morrison


    ```

    https://github.com/itlf/weorf

    ```


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_23_1.png)


    # Use SSH sessions with SSH


    Imagine that you work on a remote machine using SSH and launch a command that
    will take some time to complete (such as a build process). If the computer is
    going to sleep or loses terribly in the network, the SSH connection will drop.
    The remote machine will notice and terminate all processes in that login session
    built.


    There are several ways to avoid such a scenario. An old trick is to prepare for
    network outages and connection loss by running processes using the nohup command
    in the background and they will ignore hang signals that are sent when connection
    loss. For the build process, that might be


    ```

    nohup

    ```


    instead of a simple command. A side effect is that all output will be written
    to an out file, out of the connection session.


    My preferred solution is not use nohup or similar tricks. I use screen sessions.
    (If your machines don''t have it, the package is specifically called `screen`).


    When screen starts, it displays a long message about copyright and licenses; Press
    return to get through it. You can then continue to use the shell as usual. If
    you lose your connection, reconnect to the remote machine and run screen -r to
    reattach to the existing session.


    Maybe you''re not sure whether there is a screen session running - screen -ls
    is a good option for searching:


    There is a screen on:


    ```

    16712.pts-0-hp-2428 (05/06/2019 11:24:49 AM) (Detached) 1 Socket in /run/screen/0-esser.

    ```


    You can automate the process of logging into the remote machine and checking for
    screen sessions. Create a file - .bash_login (if you don''t have one already),
    and really add the following line to:


    ```

    screen -XS /dev/null -S -ls

    ```


    And when you log in to a screen session, you will be notified about it (See figure).
    (Bash only executes .bash_login in login session).


    If you want to detach from a running session, press Ctrl-A, D. There are many
    more things you can do with screen - check a few of them.


    ```

    $ssh -hp-2428 user@server

    Last login: Mon Jun 6 11:34:58 2019 from 2001:66b8:0750:db22:8b2:9332:5374a

    1 Socket in /run/screen/0-esser. (05/06/2019 11:33:22 AM) (Detached)

    ```


    By Hans-Görg Eger


