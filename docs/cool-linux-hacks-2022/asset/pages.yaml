    # Access


    To access the NAS system''s resources, the final step is to specify which protocols
    you want to use. EasyNAS offers a total of eight access methods, ranging from
    Apple''s protocol to CIFS/SMB, which is common in the Windows world. The SSH,
    NFS, and FTP protocols commonly used on Linux are also available. You can enable
    for individuals under Admin Settings, where you will find the individual options
    listed in the File Sharing area. To integrate an option into the system, press
    the installation button on the right in the Actions column. EasyNAS downloads
    the corresponding package from the Internet, it integrates it, and then displays
    a confirmation message.


    # Conclusions


    EasyNAS gives you a network solution that does exactly what it expects to without
    any fries — store and manage your data on a NAS system. EasyNAS''s visually and
    ergonomically consistent interface eliminates time-consuming interfaces. Thanks
    to the openSUSE and Btrfs filesystems, EasyNAS''s basic functionality can be expected
    to grow further.


    EasyNAS stands out because of its frugal hardware requirements. Every old PC can
    be converted into a NAS storage system, making EasyNAS suitable for home users
    without special knowledge to quickly set up and use network storage.


