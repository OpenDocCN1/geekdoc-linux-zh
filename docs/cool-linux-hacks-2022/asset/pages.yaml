  md: "# Parse the systemd journal with Journalctl\n\nAfter more than 10 years of\
    \ development, systemd has undeniably remained. The systemd service and manager\
    \ still does not find undivided approval in the open source community, but the\
    \ discussions centered on what was once a controversial topic have calmed down.\
    \ No matter what you think of systemd, it has its merits.\n\nOne of the benefits\
    \ of systemd is its ability to log information, warnings, and errors. In system,\
    \ systemdjournal provides more data than conventional logs. For example, `journalctl`\
    \ replaces `/var/log/syslog` and the journal includes metadata that you can use\
    \ to refine your searches.\n\nSystemd's journaling results in high volume of data\
    \ that would be difficult to handle with conventional text files. Because of this\
    \ high volume, systemd stores data in binary files that can be read with the journalctl\
    \ command. Various programs, services, and the kernel write their entries to the\
    \ journal. The systemd journal combines these logs and offers various ways of\
    \ finding the information you need in a search.\n\nJournalctl is a view interface\
    \ you can use to navigate and view the systemd journal. Versions of journalctl\
    \ are available for Linux, macOS, and Windows. Journalctl does not support all\
    \ the capabilities that are available through the journalctl command, but it does\
    \ offer some important options that will save you and time\n\nhelp you track down\
    \ real-world problems on Linux system.\n\n# Installing\n\nIn distributions based\
    \ on Arch Linux, you can install Journalctl version 0.6.3 by typing:\n\n```\n\
    sudo pacman -S journalctl\n```\n\nGentoo provides an enable file. For Debian and\
    \ RPM-based distros, you might need to build the application source. The developer\
    \ provide a Debian package [2], but at this writing, the Debian package includes\
    \ a dependency - libssh 0.8.7 that is neither Debian nor Ubuntu. So you might\
    \ need to build it yourself (Listing 1) before you can install journalctl. Because\
    \ you are at the command line anyway, it makes sense to compile journalctl from\
    \ the source code out of the (Listing 2).\n\nFedora and openSU come with the latest\
    \ version of journalctl, in which case, you only need to install the package\n\
    \n# Getting Started\n\nAfter opening journalctl, you will see a large amount of\
    \ free space and no journal. The menu at the top is also quite sparse. Between\
    \ the first three tabs, the first of which is the most commonly used by journalctl,\
    \ it opens the log for the current session.\n\nClicking on this tab opens a new\
    \ window with the log from the boot. At first, you will find and, ideally, nothing.\
    \ If you let your eyes wander to the bar Priority, Priority is set to critical\
    \ (2), so you will only see the messages that are considered by the system. Drag\
    \ the slider\n\nListing 1: libssh for Debian / Ubuntu\n\n```\n$ sudo apt install\
    \ (base-dev cmake libssh-dev pkg-config git) \n$ git clone https://github.com/systemd/journald\n\
    ```\n\nListing 2: Compiling from Source Code\n\n```\n$ git clone https://github.com/pentix/Journalctl\
    \ \n$ cd journalctl \n$ autogen \n$ make -$(nproc) \n$ sudo make install\n```\n\
    \nListing 3: On Fedora or openSUSE\n\n```\n$ dnf install libssh-devel qt5-qtbase-devel\
    \ \n$ git clone https://github.com/pentix/Journalctl \n$ cd journalctl \n$ autogen\
    \ \n$ /usr/bin/qmake-qt5 \n$ make -$(nproc) \n$ sudo make install\n```"
