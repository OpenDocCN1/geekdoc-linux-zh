  md: '# HDM Download Manager


    # HACK 11


    Back in the days when the Internet was a lot slower for most of us, and a less
    consistent, download managers used to be a thing. These were separate applications
    you could launch to finish your download such as grabbing a distribution ISO,
    or one of links from a web page. There were many to choose from, all with features
    such as bandwidth limiting, or server load, suspend and resume, and destination
    folder based on download type. The combination of broadband internet and modern
    browsers has mostly replaced these requirements with browser functions. Because
    we typically run a browser, it''s now acceptable to leave the browser running
    while things down.


    The browser plugin will selectively monitor your video playback state and offer
    to download matching streaming videos.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_18_0.png)


    But there are still many reasons for running a download manager, Xtreme Download
    Manager (XDM) rolls them into a single application. XDM is a modern download manager
