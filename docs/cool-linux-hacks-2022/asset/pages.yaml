    Tools for navigating git repositories, their history and branches are as complex
    as CPU managers. Like many others, they also appear to be visual. Having more
    options to choose from means you''re more likely to find a tool to fix your requirements.
    One fully expanded option is feature-rich; another is GRV (she has 70). At the
    other end is an application in which you spend your time; instead, it works as
    a wrapper around the git commands you use. With branches, check the status of
    a repository, and view the history is all you might need because you don''t want
    to do it all manually.


    It is easily doable. The shell does not work out of the box on Ubuntu 22.04: you
    need to set LD_PRELOAD to find libssl.so, and libcrypto.so. Type git log for instance,
    and see the most recent commits. Using the cursor scrolls to show these updates
    on each commit, and returning returns into views which has files changed. Select
    a file, and you get the graphical diff view of what changed in that file (see
    figure). It is minimal and effective, and most importantly, don''t distract from
    the work you''re likely trying to do in the same terminal. It just lets you see
    the


    details in a process are convenient and interactive and that''s also quicker than
    trying to work out the git commands using line. The color is also very effective
    and helps especially in the diff view where we see a red line of remove and the
    green line of a new line is far away then -


    > By Graham Mission6


