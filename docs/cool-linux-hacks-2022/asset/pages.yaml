    # Launch Programs Inside a VirtualBox VM


    If the Guest Additions are installed in a VirtualBox guest, you can start programs
    directly on the guest with VManage. The following command logs into the virtual
    machine (VM) named "Fedora 36" as the user tim and password of 123456


    ```

    VBoxManage guestctl "Fedora 36" --exe "/usr/bin/gedit --username tim --password
    123456 --putenv "DISPLAY=:9"

    ```


    When it starts, it leaves the edit text editor. The --exe option is for the full
    path to the program you wish to edit. In the case of a Windows VM, you need to
    enter the basename in the path, such as C:\windows\calc.exe. For a graphical X11
    application, you may need to set the environment variable using the --putenv parameter.
    You can also add parameters to the parameter:


    ```

    VBoxManage guestctl "Fedora 36" --exe "/usr/bin/gedit --username tim --password
    123456 --putenv "DISPLAY=:0 edit/arg=/home/tim/brief.txt"

    ```


    The parameters are always at the end following the two minus signs. In the example,
    edit/arg indicates that the parameters for the edit program follow. Here, just
    is the path to the file that you want to edit.


    The guestcontrol command gives an insight into the state of the guest if required:


    +   - VBoxManage guestcontrol "Windows 11" list all


    Among other things, guestcontrol also lists the processes you can kill with closeprocess:


    ```

    VBoxManage guestctl "Fedora 36" --session-id 4022

    ```


    Via --session-id, you provide the ID of the session in which the process is running.
    The number at the end represents the troublesmaker''s ID.


