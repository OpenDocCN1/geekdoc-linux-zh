    I did not find this full-screen mode very helpful because it will truly fill the
    screen, and the screen of modern monitors does not match the 4:3 aspect ratio
    of the old DOS machines.


    If you do like the full-screen option (or connect a 4:3 monitor to your computer),
    you can also run the emulator in full-screen mode from the very start using the
    option:


    ```

    dosbox -fullscreen

    ```


    This will still let you switch to window mode via Alt + Return.


    # DOSBOX-X


    You can get better scaling by using DOSBox-X, which is a successor to DOSBOX.
    Currently the project offers Flatpak and RPM packages for Linux (as well as Windows
    and macOS). Install it on Ubuntu


    ```

    sudo apt install flatpak

    flatpak install flathub com.dosbox_x.dosBox-X

    ```


    and then run it by binary


    ```

    flatpak run com.dosbox_x.dosBox-X -X

    ```


    Alternatively, you can compile DOSBox-X from the source. You need to provide development
    tools (c compiler, from the build-essential packages), and after running the build
    script in the archive and typing sudo make install, you can install the DOSBox
    clone using dosbox-x. (The project has detailed instructions for building and
    compilation takes a few minutes. It''s okay to have both installed at the same
    time)


    You freely resize the DOSBox-X window, but you''re likely to get the aspect ratio
    wrong when you do. Luckily there is a helpful entry: enter the Menu and click
    on Fit to aspect ratio (Figure 4). That will make sure the screen appears in 4:3
    aspect ratio.


    The DOSBox-X menu contains some other entries. I found the drive entry particularly
    useful because it lets mount a floppy disk image or a Zip archive on a DOS drive.
    When you want to install software that was distributed on servers, you can find
    the 720KB file as a bundle of image files. This DOSBox-X option lets you choose
    disks while the installer is running (Figure 5).


    # More than Games


    While DOSBox-X focuses on playing DOS games, many other DOS software will work,
    too. You have been a user of Microsoft Word for DOS, WordPerfect, or Lotus 1-3?
    Or do you develop your applications with Borland''s Turbo Pascal compiler? Those
