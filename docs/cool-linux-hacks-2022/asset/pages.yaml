  md: '# # Where Did You Mount Disk?


    If you like to extend your computer''s life by adding hard disks instead of replacing
    the old ones), you can quickly lose track of what kind of data you have. Some
    elementary tools will help you get an overview.


    The `lsblk` ("list block devices") tool shows all devices and partitions in use.
    The default view in `lsblk` includes only the devices and will find the mount
    point (the position at which the device is mounted in the directory-tree).


    The output of `lsblk` has six columns. Table 1 gives an overview of the information
    you can get from it.


    Using a switch `lsblk` reveals more devices than those that are currently in use.
    For example, it will show a series of loop devices (virtual block devices that
