    Searching for that back issue you really wished you''d picked up at the newsstand?


    # DIGITAL & PRINT SUBSCRIPTIONS


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_12_1.png)


    # Creating Long Documents with Styles


    Some documents that I create in LibreOffice Writer are "throw-away" documents:
    I type a few lines, add some quick formatting, print the document, and then save
    the file or just close the program and discard it. That''s the one case where
    it doesn''t make sense to work with styles.


    But other documents you create one day, and then months, months, or years later
    you edit them again or create a copy to which you add new text. The longer those
    documents become and the more they are structured (into chapters, sections, etc.),
    the more it becomes vital to format them with proper styles. A table of contents
    is only possible when you''ve assigned a style to every heading.


    Using styles guarantees that you can maintain a uniform look throughout the document:
    Headlines on page two will look the same as those on page 102—same font, same
    size, same color (if something you do to your headings), exporting the document
    into a format that can be used for publishing is much easier when you can stick
    to styles.


    The figure shows two headlines in a document - but only the second one is a real
    headline. When you modify the headline style throughout, only the real one will
    show the changes, the firstly headline will remain unchanged.


    By-Georg Eiber


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_12_2.png)


