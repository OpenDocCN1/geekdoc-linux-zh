    # KnobCraft Orm MIDI Librarian


    Over the past 40 years, the MIDI specification has enabled physical controllers,
    hardware synthesizers, software synthesizers, audio applications, and numerous
    other hardware to talk to one another. It is an incredible achievement for a protocol
    before TCP/IP has never been more popular. Yet it''s particularly missing that
    there isn''t a decent way to organize them. Libraries are essential if you want
    to save a set of MIDI devices for values and for computer-driven archive and patch
    management. MIDI devices are usually limited in their storage capacity and user-interface
    design, which makes a computer-driven archive a bit complex. A system-exclusive
    data dump via your hardware is a transfer of the raw internal device data as opposed
    to midi data for each device, which needs to be sent back to the device to reactivate
    the configuration, but you need a library if you want to save these dumps individually
    and manage, categorize them.


    and the user interface works the same for each. Data dumps, or patches, are shown
    in a grid, with color to differentiate patch categories. These can be filtered
    quickly, excluded, or searched for, as much as you would with a tag cloud. This
    means you cannot accomplish everything on hardware, and it makes it really easy
    to manage thousands of patches. Selecting one will send it to the device for immediate
    preview, avoiding the need to save data on the external device. If you can''t
    edit patches within those, KnobCraft Orm frees you from using a device''s limited
    storage and management.


    KnobCraft Orm''s best feature is to add your support for your favorite hardware,
    even when it''s not a part of the application. This is done via adaptation, and
    we have ready many. An adaptation is written in Python and exists as a script
    outside the (C++ written and compiled) main application. This is a much more powerful
    solution than using a static syntax to JSON to handle the system-exclusive data,
    because KnobCraft lets you easily process it without needing to know the MIDI
    specification, thanks to the excellent programming guide, turning the adaptation
    into is actually fun if you already have good knowledge of the MIDI device. An
    adaptation becomes just like native device support, helping you manage every device
    in your studio - that hasn''t been possible since development of the Ever Sound
    Driver was abandoned in 2005. Note that


    One of the strengths is its cross-platform, which offers many different kinds
    of editors and libraries as well as plugin configuration and scripting. It''s
    also a victim of its own success: Data management and library functions are often
    left wanting, and the editors provide a simple, high-quality MIDI library that
    focuses on a finite number of devices and supports those well. This is exactly
    what the oddly named KnobCraft Orm does KnobCraft Orm can natively talk to and
    save from many devices, including Varia, Virus, Roland and Sequential synthesizers,
    and RH-808 drum machine and BCR2000 unit. All of which can have their internal
