    # KeenWrite Technical Text Editor


    There are now (probably) more people writing better than ever before. It''s an
    amazing, feature-rich social media post, blog post, article, tutorial, or ever-written
    book. Technology has made it easy for us to edit small documents, but as we all
    know, when you need to organize your writing, edit, reference your research, or
    search for a part to reuse, you typically need to find a more obvious approach.


    KeenWrite is a text IDE with a unique proposition. It offers a writing experience
    with a great emphasis on the ''development'' in the IDE. What makes it unique,
    and more like a programmer''s environment, is that it''s a Markdown editor that
    uses string interpolation to separate and modularize the


    KeenWrite can constrain their values within a body of text to keep edits and mistakes
    to a minimum.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_7_1.png)


    content you write from the presentation and layout. The main view is split into
    three panes, with the middle pane holding the reference, the right pane holding
    a live-preview of the content, and the left pane holding variables. These variables
    are the key to interpolation because they also allow you to assign key and values
    within a YAML-formatted document that can be referenced and interpolated in the
    Markdown document. A simple example would set a book''s title as a variable in
    the Markdown rather than the name itself. The book''s title can then be easily
    changed as it takes to change the string name, which is always reflected in the
    live text preview. The addition of all of this being offered for the key and value
    pairs pays off deject.


    For a test, download the keenwrite.bin file, make it executable, and run it.


    By Graham Morrison


    https://github.com/DaveJavascript/keenwrite


