  md: '# Maestral Dropbox Client


    Dropbox was revolutionary when it first appeared in 2007. The cloud storage it
    offered was something new, and the convenience of having a directory shared with
    others that would synchronize with other machines was alluring. The gamification
    of inviting new users to your personal storage capacity, and many people were
    hooked. Early adopters were rewarded.


    Maestral integrates into the Linux desktop environment far better than we imagined
    any official Dropbox cloud client.


    The whole platform was crowded and relatively open API and one of many third-party
    clients would eventually provide Dropbox as a Linux-tier tool. The fast rate of
    progress and adoption was widely welcomed in 2019-the year over 68 million users
    passed our enthusiasm, as in mass adoption is what we now master.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_17_0.png)


    But Maestral could just enough to rethink our enthusiasm for Dropbox. It''s an
    unofficial unofficial client that has a sleek UI and allows us to access the public
    API for your account. The most impressive thing about the project is that there''s
    a command-line tool and a GUI, with the command line to perform all the actions.
    There are options to pause and resume, sync or start the backup, as well as to
    add files which should be included or excluded, and desktop notifications. The
    GUI is beautifully designed and easy to use. Its task icon has a right-click menu
    that runs


    many of the same functions you know, and it''s the best client you''ve ever used
    for Dropbox. But the thing is that it requires very few resources and doesn''t
    easily eat CPUs, which can''t be said of other clients for even some of Dropbox''s
    competitors. On Ubuntu, install the clients via `pip install maestral[gui]`, and
    run the binary from `/.local/bin/maestral`.


    By Graham Morrison


    # LANDrop Ad Hot File Sharing


    There are many ways to share files, but the ad hoc local file-sharing functionality
    on Android and Apple devices has become very popular. This hasn''t been easy to
    replicate on Linux—because Linux enough it''s missing features such as. LANDrop
    is a refreshing change from the norm. It''s an open source, ad hoc local file-sharing
    tool that supports all platforms equally, including iOS, macOS, Windows, and Linux.
    It promises to seamlessly share your files without giving up privacy, providing
    over an offline connection or even using cellular data. You don''t have to worry
    about third-party people who may intercept the transfer, and it does all this
    while being open source. All data required for a transfer is shared directly between
    devices, and the only data visible to whomever you are sharing with is the file
    name, date, and IP address. These can be turned off.


    > Local transfer is century widely adopted solution.


    There are official apps for (OS and Android-the latter via a non-store APK), which
    makes transfers to friends much easier, or if you can, build the package yourself.
    On Ubuntu, after installing the package and running the LANDrop application, the
    file will help notify you that it''s now running and can be managed by its small
    panel icon from this icon, you can change your device name and whether your device
    is discoverable, along with where you want it to go. If your device discoverable
    doesn''t have to work, or if you want to resort to sharing addresses, which adds
    an extra touch. This option is available when you want to send one or more files,
    which can be listed in the window before you simply click Transfer. The files
    are then quickly efficiently copied to the remote device.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_17_1.png)


    By Graham Morrison


    https://landrop.app/


    18


