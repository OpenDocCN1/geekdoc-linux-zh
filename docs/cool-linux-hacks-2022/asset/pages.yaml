    \ editor written with the Lazarus IDE in the Pascal language, a language that\
    \ might be familiar to anyone computer students back in the 90s. This might also\
    \ help to explain why it's cross-platform. CudaText is now on Windows, Linux,\
    \ and macOS. We mention FreeBSD, NetBSD, OpenBSD, Solaris, and Haku. CudaText\
    \ is, for these, the platform's best GUI-driven text editor. We now mention there\
    \ was also an additional Amiga version. If you want to install it on Ubuntu, simply\
    \ run snap install cudatext root to get the Snap package.\n\nCudaText is full\
    \ of modern features. There is a tabbed (UI) powered by Qt Linux, regular editor\
    \ experience, syntax highlighting, code folding, multiple splits, and a JSON configuration\
    \ file. There is code completion and preview if you're editing HTML or CSS files.\
    \ But the real power comes from its plugin system which allows you to add extra\
    \ options with your specific tasks. There's a snippet library for code snippets,\
    \ classifier, code linter, diff viewer, merge manager, plus tools for managing\
    \ an entire project tree and decisions. CudaText also has a few features that\
    \ make it feel even more like a text editor, and that's what makes it powerful.\
    \ It's a good, functional editor without any further modification, but if your\
    \ needs grow the editor can also grow with your project. And it works on almost\
