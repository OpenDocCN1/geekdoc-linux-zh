    # HACK 47 Lock Your Screen, Always


    There are obvious situations when you should lock your screen, like when you work
    in an open-plan office, when you have opened four terminal windows with remote
    shell on various machines, and you''re just about to leave for lunch break—you
    don''t want your computer to be exposed.


    During my time as a postgrad, it was a running job that co-workers disputed each
    other''s,


    search for unlocked computers, and open a website like lockyourscreen.com (see
    figure). Of course, that''s better than quickly installing a backdoor SSH server.
    In less dangerous situations, it makes sense to lock the machine: if you''re at
    home and have a cat who walks across the keyboard, it may provide just the right
    input for the vi editor to do bad things to your configuration file.


    (However, it is unlikely that the cat will enter and save her changes).


    Every desktop has some menu for locking the screen, but it''s faster to press
    some keys. In addition to Linux, I''ve also looked the hotkeys for non-Linux operating
    systems, because this is important over computer:


    +   - Gnome: Win+L

    - KDE, Cinnamon, and Xfce: Ctrl+Alt+L

    - macOS: Ctrl+Command+Q

    - Windows: Win+L


    Of course, the Linux desktops will let you change those hotkeys to something else.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_65_0.png)


    By Hans-Geörg Eßer


    > https://lockyourscreen.com/


    # Use crypt for Quick Encryption


    There are many ways you could encrypt a file before sending it as an email attachment
    or uploading it to some cloud storage service, and most of them will need some
    amount of protection or contain needless steps. For example, sending a GPG-encrypted
    email requires you and the recipient to have the other''s party''s public key.
    Putting the file in a password-protected ZIP archive is an option, but why create
    an archive when you want to just send one file?


    The command-line tool crypt provides a quick solution. It is available from most
    repositories: apt install, zipper or yum install on your machine.


    For encrypting a single file, crypt filename will ask for an encryption key (it
    does not echo the characters you type), and that is. Look into the directory,
    and you find that filename is now filename.crypt. The program has automatically
    overwritten the content of the original file.


    If you''ve found a good password (something that works in a dictionary), you can
    now transfer the file over insecure channels. The recipient runs the decrypt crypt
    command on the file and enters the password—after that the file is restored (see
    figure). For better security, the .crypt extension before sending the file making
    it harder to guess what kind of encryption algorithm was used.


    By Hans-Geörg Eßer


    ```

    $crypt test.txt

    $decrypt test.txt.crypt

    ```


    http://crypt.sourceforge.net/


