  md: '# # EasyNAS is a NAS for the Masses


    Do you have one computer gathering dust? Thanks to Linux''s flexibility and the
    innovative spirit of gamers, computers that are more than 10 years old can be
    used as network storage in current IT environments.


    Systems frequently used by users in the past often offer plenty of space for mass
    storage. In addition, these systems have sufficient power supplies to run multiple
    hard drives as network attached. EasyNAS, an openSOURCE derivative, takes advantage
    of configuring network storage with multiple media and integrating it into an
    existing NAS [1].


    wizard. In the wizard, first select the disk on which you want to install the
    operating system. The installer then deletes all data on the disk, after giving
    you a fair warning, and does a disk check. Finally, the actual system installation
    takes place. The wizard then branches to a menu where you can access various administrative
    tasks by typing the commands.


    # HACK 12


    EasyNAS enables a web server during the installation, which means you can configure
    it using any web browser. To do this, call up the system''s IP address in the
    browser, followed by a colon and the port number 1443 (e.g., 192.168.1.10). This
    will take you to a login screen where you need to enter the admin username and
    password.


    EasyNAS opens a visually appealing and clearly arranged dashboard that visualizes
    the NAS system''s technical configuration (Figure 1).


    # Requirements


    EasyNAS comes as a hybrid image with a size of about 380MB. The minimum system
    requirements, the developer recommends a processor with at least 500MHz clock
    speed—as you may recall, this was the system of matter more than 15 years old.


    A word of caution: unlike the original, not-yet-updated the current version, EasyNAS
    1.0.0 requires a 64-bit processor. However, the older 0.72 media can be used with
    32-bit CPUs [2].


    In addition, the hardware should have at least 1GB RAM, 2GB or more is preferable
    for the system to run smoothly. The hard disk needs a capacity of at least 20GB.


    The NAS project does not satisfy any system requirements, but you will require
    a network connection for various reasons. EasyNAS lacks the ability to integrate
    network with WiFi. On a positive note, the system supports various protocols.
    Network File System (NFS) can be used in Linux-only environments, where SMB or
    Samba is recommended for file sharing.


    Note that EasyNAS requires a dedicated storage area for itself. This is the first
    internal hard disk which can be used for storage purposes as part of a network
    drive. Either, therefore, you need at least one physical mass storage devices
    to the NAS system—perhaps more depending on the desired RAID level.


