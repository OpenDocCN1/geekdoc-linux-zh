  md: '# OFFICE


    # Search Office Files with uvgrep


    If you like to work on the command line, you may be aware of the grep tool, which
    lets you search for content in files. You can use simple search patterns (such
    as words or numbers), or even make the tool ignore case and use regular expressions,
    which are powerful that whole books have been written about them. For example,
    the regular expression


    ```

    `^[0-9]{1,3}-[a-z]*--\$`

    ```


    will match obey this pattern:


    ```

    12-abc-12

    9-zzzz-9

    123-aaa-12

    ```


    That is, a line that starts with a number that has between one and three digits,
    followed by a hyphen, then a string of lowercase letters (at least one), another
    hyphen, and then the number from the beginning. The regular expression handles
    the backwards by declaring a group with the round brackets and referencing it
    with \1. If there were more groups, they could be referenced with \1, \2, \3,
    and so on.


    If you are unfamiliar with regular expressions, O''Reilly has a good interactive
    tutorial on their website!


    # Problems with Binaries


    While grep lets you search in files, many applications created binary files that
    cannot be "grepped". LibreOffice stores your documents in ZIP archives. They often
    have extensions such as .odt (text), .ods (spread-


    Figure 1: You can extract LibreOffice documents and inspect the XML code.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_13_0.png)


    sheet), .odp (presentation), all these files are regular ZIP archives. You can
    rename this file type to document.zip and open it with the default program - you
    will find that some archive managers start and display a folder structure.


    Figure 1 shows what you can find inside a LibreOffice Writer (.odt) file: The
    first file in the ZIP archive is content.xml. The heading 1 paragraph in Writer
    is internally stored (without the line like:


    ```

    <text:text:name="Heading_20_1"

    text:outline-level="1">

    Example 1

    </text>

    ```


    and the following paragraph stored in a similar way:


    ```

    <text:text:name="P1">

    This is a sample document to show the structure of LibreOffice document files.
    This is a sample document to show the structure of LibreOffice files.

    </text>

    ```


    Because XML files are also files, they can be searched with grep. It saves a lot
    of effort to rename your files, extract and access the content files every time
    you search for.


    # Universal grep


    I''ve written a tool that automates the process: uvgrep ("universal grep"). It
    can search LibreOffice and Microsoft Office files, PDFs, and more. You can download
    it from GitHub (2), but you will also need a few helper programs:


    +   -llint to parse and format XML, which is necessary for LibreOffice files they
    tend to contain extremely long lines--when you expect to see a little bit of context
    instead almost all of the document''s contents

    pdfgrep is a separate tool to inspect PDF files. It uses it for searching inside
    PDF, Office, and text files with one invocation.

    xllint and pdfgrep tools are not installed by default; on Ubuntu


