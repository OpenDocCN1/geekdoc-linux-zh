    # ## Use bat, not cat 53


    The Unix philosophy of using one simple tool to do one task is still alive and
    well on the command line, and cat is one of its best tools ( so venerable that
    it was included in the original edition of "Research Unix", developed by Ken Thompson
    and Dennis Ritchie in 1971 when the term "Research Unix" was first used in 1978).
    As everyone knows, cat will print the contents of a file to the standard output.
    If you want to see each line individually use less. If you have more than one
    file, cat concatenate the output of each in turn (the task that gives it the list)
    and show you the contents as a file, or pipe them back into a new file. It can
    also display line numbers, or highlights at the end of a line, but it''s limited.
    It''s a simple tool for a file job, and it works brilliantly.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_71_1.png)


    But there are times when you need a little more from the humble cat, especially
    when ranging through source code or files with a specific format where color zones
    can help. bat extends cat''s simple premise with a few extra extras, such as syntax
    highlighting, built-in paging, and git integration that can show only the modifications
    in a file after compiling it. All of this happens when you replace your cat invocation
    with bat, but there are further options to customize the output tou,


    including options to when to disable the pager, when to display only the lines,
    and how one file type maps to. It''s also fast, looks beautiful and can be themed,
    while still remaining compatible with cat''s original basic output: you can concatenate
    multiple files by bat part1 part2 part3 > full - bat recognizes output redirection
    and acts like cat.


