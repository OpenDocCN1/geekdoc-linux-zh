  md: '# ChowTapeModel Emulation


    ChowTapeModel is one of several excellent audio effect plugins developed by Chowury
    DSP and released for a free open source license. ChowTapeModel, Chowury DSP offers
    a delay effect (ChowMatrix) and virtual guitar pedals (Chow-Centaur). ChowTapeModel
    does something that has been inconceivable not so long ago when many of


    us were desperately trying to leave the noise and distortion of tape recordings
    behind for the crystalline perfection of digital reproduction. During this transition,
    it became apparent that digital audio was much more accurate, with more dynamic
    range, less noise, and no something was lost in translation: a certain kind of
    analog warmth and imperfection. ChowTapeModel tries to add this analog warmth
    and imperfection to your digital recordings.


    This tape emulation works well for rock and pop, but it can also improve some
    recordings for you podcast.


    The tape emulation effect has been carefully engineered to model the characteristics
    of a real machine, the Sony TC-260 from the 1970s. The plugin features many controls
    that reflect the various configuration options of the original machine, such as
    tape alignment and the speed of tape. There are also controls for the amount of
    saturation and distortion which you want. Add these changes to tone anding distortion,
    as well as wow and flutter to simulate slight variations in the tape type playback.
    Very subtle adjustments to these values can genuinely turn your digital recording
    into something that has originally been recorded on tape, with often smoother,
    more rounded, and less separated. Differentiated configurations sound better for
    different types of music, and you can save presets to quickly switch between them.
    It works well on music but it can also improve your recordings by acting as a
    master effect to glue a mix together. Ubuntu users can download a .deb package
    and install it with dpkg -i ChowTapeModel-l-linux-amd64_2.1.0.deb.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_51_0.png)


    https://chowddsp.com/


    By Graham Morrison'
