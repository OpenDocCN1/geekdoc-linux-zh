  md: "# WORKING CODE\n\n# Count Lines of Code in Your Project\n\nAre you interested\
    \ in statistics about your coding projects? You could process your source files\
    \ with wc to get a line count, but simple tools do not know the difference between\
    \ comments and code. We suggest using something like cloc - which counts for lines\
    \ of code and gives you an overview of your projects. The practical helper counts\
    \ blank lines and comments, as well as lines of code (see figure).\n\nwrites the\
    \ statistical analysis to the standard output. cloc parses Perl 5.6 or later.\
    \ On Ubuntu you can install the package;; on other distros use git clone. cloc\
    \ understands more than 250 programming languages. You can obtain a full list\
    \ using cloc --show-lang.\n\n# HACK 73\n\nYou can specify files or directories\
    \ to be counted. cloc also understands compressed tar or ZIP files; the tool can\
    \ help you when unpacking via extract. The program also tracks changes between\
    \ files, directories, and archives. Its map lists various different parameters\
    \ with examples.\n\nYou can save the results from cloc's evaluation in CSV, XML,\
    \ or YAML format, which sql-insert will generate INSERT statements for an SQL\
    \ database.\n\n```\n$esser@ps13:linux ~/local/src/utils\n$esser@ps13:linux$ cloc\n\
    \  8 files\n  8 unique files\n  00 ignored.\n```\n\n| language | files | blank\
    \ | comment |\n| --- | --- | --- | --- |\n| C | 1 | 6836 | 21548 |\n| C/C++ |\
    \ 4 | 752 | 2123 |\n| Java | 1 | 452 | 7460 |\n| SUM | 8 | 19 | 210 |\n\ngithub.com/AlDnial/cloc\
    \ v1.86 Tw0.11 (75.5 files/s, 42787.7 lines/s)\n\n> By Uwe Wahlhardt\n\n# Fix\
    \ Distentation and More\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_85_0.png)\n\
    \nA classic tool is the \"indentor,\" a program that takes a source code and creates\
    \ a new version where indentation and brace placement follow fixed rules. One\
    \ example from this family is indent. The Unix original is from the late seventies,\
    \ and on Linux the version was last updated in 1998.\n\nFor a more flexible approach,\
    \ have a look at uncrify; it can do more than indent, and you configure it by\
    \ writing a complex config file. The program supports C, C++, Object, D, Java,\
    \ Python, and many. To get started, there's a sample file for uncrify in the package\
    \ contents or on the web page.\n\nI found an openUSE package and use it for all\
    \ my code repositories. It's easy to check out the changes from your current version:\n\
    \nOnce it's installed, grab a source file and run\n\n```\nuncrify -linux cfg testfile.c\n\
    ```\n\nThis will create a new testfile,uncrify tried to it (automatically and\
    \ perfectly formatted) with some success, as you can see in the figure.\n\n> By\
    \ Hans-Georg Eißer\n\ngit clone https://github.com/uncrify/uncrify.git\n\nIn my\
    \ test, I will build the project with:\n\n```\ncd uncrify; make; cd build\nmake\
    \ .. sudo make install\n```\n\nrun in the uncrify folder. (On Ubuntu, apt apt\n\
    install cmake to get that particular tool.)\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_85_1.png)\n\
    \nhttps://en.wikipedia.org/wiki/Uncrify (Unix)\nhttps://uncrify.sourceforge.org/\n\
    https://uncrify.sourceforge.org/uncrify.cfg\n\n86\n\nCOOL LINUX HACKS - 2022 EDITION\n\
    \n* Wikipedia"
