    \ Morrison\n\nhttps://cudatext.github.io/\n\nCudaText brings new meaning to \"\
    cross-platform,\" but we do not wish there an Amiga version.\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_81_0.png)\n\
