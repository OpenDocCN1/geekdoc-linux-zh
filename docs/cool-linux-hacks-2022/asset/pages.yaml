  md: '# OFFICE


    # HACK


    # # Install the draw.io Diagram Editor Locally


    Draw.io has been around for years as a website. If you ever need to draw a diagram
    or flow-chart, or even a circuit, it''s indispensable. Many users now rely on
    it for their latest presentations, their documentation projects, and project planning,
    draw.io''s great strength in many different categories makes it capable of drawing
    many kinds of charts. You don''t have to create your own icons, steal images from
    the Internet, or rely on templates; simply drag and draw symbols, join them together,
    and use draw.io with wonderful styling, and note options to create free files
    that you can save locally or online.


    But draw.io is an open source project, and you can run it on your local computer,
    which is perfect for last-minute coloring on train with absent connectivity. There''s
    an executable app for Windows 10.3, a .deb for Linux, and an .msi for Ubuntu 22.04
    without any problems. With the application, you can create diagrams without the
    online.


    There''s a huge number of symbols to choose from, with additional custom symbols
    embedded within any diagram you draw. The Google Cloud Platform (GCP) templates,
    for example, include many GCP-centric symbols and layers within your charts. Other
    features include various diagrams, maps, Unified Modeling Language (UML) diagrams
    flow charts, and isometric network diagrams with AWS infrastructure.


    Although not as powerful as Inkscape for drawing, text, or arrangement options,
    you have more than enough tools to create the perfect diagram, as well as group,
    layer, and align, for instance. If you need more control, you can save as an SVG
    file and edit it within Inkscape. I tested this, and it worked perfectly.


    There''s even better support for VSDX if you need to import your file into Microsoft
    Visio. The UI still feels web-based, and native desktop widgets would be preferable,
    but this is an important application with free desktop


    rivals - I can''t think of any Linux tools that are able to generate diagrams
    of this quality so, and none with the same powerful design and symbol library
    that can output in many different formats.


    Diagrams are the most exciting thing to spend your time creating, which is precisely
    why draw.io is so good. It handles the tedious parts, so you can spend less time
    drawing and more time moving to the implementation (or least arguing about the
    implementation).


    The figure shows how draw.io offers:


    +   1. Symbol library: Drag and drop from a variety of diagram icons.

    2. Connections: Components can be dragged, and their connections remain intact.

    3. Style: Scale, rotate, and group elements on your canvas.

    4. Style: Use a color palette for styles, and select labels.

    5. Properties: If the mouse is not good enough, type in value.

    6. Transparency: We can mix your colors with opacity values.

    7. Shape categories: Symbols cover a huge range of diagram types.

    8. Custom libraries: Include your own symbols, as GCP or AWS shapes, to accompany
    your diagrams.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_11_0.png)


    By Graham Morrison


    https://diagram.net/


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_11_1.png)


