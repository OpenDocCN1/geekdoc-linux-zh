  md: '# Run Code from the Command Line


    Sometimes you want to use functionality that is familiar from C programming, but
    you cannot find a code that you could call from a script. For example, the getcid()
    and getpid() (functions) which require running the task''s script and process
    have no shell equivalent.


    Of course, you could write a simple C program that calls the function you are
    interested in, but then you would have to pass every parameter. A better way is
    to use a simple wrapper script that takes a string of code, puts it into a c file,
    and then compiles and runs it. The following five lines do just:


    ```

    #!/bin/bash

    args=$1

    name="tmp_$RANDOM"

    print "int main () { %s; } printf(\%s\n)" "$args"

    cc -o "$name" "$name.c" 2>/dev/null && ./"$name; rm -f "$name"

    ```


    Save this as `run.sh` and make it executable. (Use a different name if you use
    the org tool for starting containers.) Now the c compiler will include it.

    You can now run commands via run. In order to identify the session ID of process
    1292,


    ```

    run "getdn,getid(1292)"

    ```


    This shows that a getpid() call in the sc process with PID 2615. If I could have
    asked the question to show me -o sess -s sess


    2615 (-h no header, -o sess equals only the session ID, and -p only the process
    with this PID) and via ps -h -o pgid -p 2615, but I knew that the -h option shows
    the session ID column by name.


    # More Examples


    You can use more code blocks including loops. For example:


    ```

    run "for (int i=0; i<8; i++) printf(\"%d\n", i); printf(\"%s\n\");")"

    ```


    It will also print a sequence of numbers (like just that stretches several lines;
    when you start the script with the -char line option, you can produce the output
    as you like - until you use another string with ".


    As an example, in order to generate a segmentation fault, try an instruction that
    directly interrupts: run "asm(''cli'')" cannot run because it is a privileged
    instruction that can only run in kernel mode.


    > By Hans-Georg Euler


