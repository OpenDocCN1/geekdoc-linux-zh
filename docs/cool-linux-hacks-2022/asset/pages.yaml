  md: '# # AltSearch Extension:

    Replace the Internal Search Tool in LibreOffice Writer


    Few features in a word processor are less glamorous than a search tool. That is,
    until you do some intensive editing, especially if your revisions includeformatting.
    Then you will be thankful for a fully-featured tool. In the case of LibreOffice
    Writer, the available tools are barely adequate, which I would recommend the Alt
    Find & Replace for Writer extension, also known as AltSearch 11.


    Like LibreOffice extensions, AltSearch is easily installed. Just download it from
    the LibreOffice extension store, and open Tools | Extension Manager. The next
    time you need it, as well as an icon with green bicunners in the sidebar, AltSearch
    allows searching any object in the document, most useful by search style headings,
    and even lets you replace text below without cutting and pasting (2) but that
    is all. Its demerits are focused on having and limited order.


    You can understand the need for AltSearch by enhancing the default search tool
    in Writer. Edit | Find is simple similar to those found in web browsers. It is
    suitable for finding words and phrases, but its options are limited. You can search
    forward or backward from your present location in a document, find all, match
    case—and that''s all that (1).


    Edit | Find & Replace is more versatile, but it, too, relatively limited. It can
    match case or search for which


    Figure 1: Find''s basic search tool. For many purposes, it is too simple.


    Figure 2: Find & Replace is an improvement over Find but still fairly basic.


    | Find: | Match case | Whole words only |

