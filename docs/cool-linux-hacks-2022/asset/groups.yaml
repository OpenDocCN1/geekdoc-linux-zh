    ## 黑客技巧 76: 运行 Gamebuntu 设置脚本\n\n对于 Linux 玩家来说，这是一个兴奋的时刻，因为有很多工作正在为让 Linux 支持游戏而努力。这无疑主要归功于\
    \ Valve，他们在发布 Steam Deck 方面的表现令人惊叹，以及他们的游戏兼容层。还有许多其他调整，这些都是 Raj Saraswat 的心血，他是一位来自印度的\
    \ 12 岁开发者，同时也负责了《波斯之王》——史上最优秀的 2D 平台和冒险游戏之一。该游戏最初于 1989 年在 Apple II 上发布，由 Jordan\
    \ Mechner 开发，因几个原因而非常出色。当时的第一个角色动画在那个时代都是领先的。游戏具有超越时代的真实感，这正是游戏成功的原因。你身处一个地下城，有\
    \ 60 分钟的时间逃生并救援。在数小时的游戏测试中，难度和流行程度经过微调，完美地让任务变得易于上手但不至于简单。寻找出口路过程中的敌人和挑战提供了足够的变性和挑战，让你痴迷其中，正如许多人一样。\n\
    \nGuntu 是一个全面的 Bash 脚本，汇总了与 Linux 游戏相关的所有内容。它是为可能安装某些东西的新用户设计的。虽然原作已经发布，但该系列在现代硬件上继续，硬组版本现在已使用\
    \ SDL 进行解构和重建，创建了 POP。它是游戏的完美复制，包括图形、声音、音乐和沉浸感。它对于 30 多年前的一代人和同时玩家来说也是全新的，而且非常好玩。这个版本包含了作弊（跳过关卡、房间导航）和控制器支持，并且尽可能现代化，在游戏进行时增加了视频回放功能，这让年轻一代或也许我们这些拥有相同机智和敏捷操作能力的人更容易上手。\n\
    \n喜欢 Ubuntu 但还不了解，或者想知道应该添加什么来创建一个完美的游戏系统？图形界面首先在窗口顶部显示一个/或引导查找器。点击此按钮将自动安装大量的游戏相关软件。这可能需要一些时间，因为要安装的内容正在增长。它包括诸如\
    \ Proton 内核（提供最新的显卡驱动程序）、带有 PulseAudio 效果的 OBS 以及用于麦克风录制的 NoisTorch。对于游戏，Guntu\
    \ 增加了 Steam 和 Heroic Launcher 来访问你的游戏，以及用于 Windows 游戏的 Wine。前端创建了一个启动器来访问所有已安装内容的面向用户部分。这可能需要一些设置，例如登录\
    \ Epic Games Store 或 YouTube Studio，这会迅速成为你访问所有游戏内容的入口，并有力地提醒你 Linux 上可用的游戏软件有多么，而且未来会有更多。\n\
    \n作者：Graham Morrison\n\nhttps://gitlab.com/rswat09\n\n## 黑客技巧 77: Sonic Blast\
    \ 2\n\n小刺猬经常出现在开源游戏重制版中。这可能是因为 Sonic 是 1990 年代主机游戏的奇迹，那个十年见证了 Linux 的第二个维度，而且时间还不长到让当年的青少年成为如今的高级开发人员。Sonic\
    \ Blast 2 是这一理论的证明，它不仅将开源与 Sonic 结合，还结合了那个时代的机制。游戏本身完全由粉丝制作，其根源可以追溯到 90 年代后期。它包含超过\
    \ 25 个完全由社区创建的关卡，具有与原作相同的糖分驱动的平台跳跃风格，但不同的玩法被转换到了三维。而且不仅仅是《超级马里奥 64》那种整洁的多边形三维。\n\
    \n这篇惊人的粉丝同人（游戏类）开发时间几乎和它的灵感来源一样长，但它仍在进行更新。\n\n| 分数 | 0 |\n| 时间 | 0-22 |\n| 环 |\
    \ 2 |\n\n如果你玩过 2D 版本，这个游戏会让你感到很熟悉。你可以扮演任何主要角色，他们都有自己的能力，并在这些关卡中穿梭的同时射击其他玩家。你不需要简单地指向移动方向的左或右，而是可以在所有方向移动。这是一种不寻常的机制，感觉像是在玩经典的双玩家坦克游戏，但增加了额外的技巧水平，包括重力、特效和类型。另一个独特元素是漫画风格的抓钩或用手臂荡秋，它可以让你像充满咖啡因的蜘蛛一样穿过关卡，导致了非常独特的玩法。\n\
    \n"
