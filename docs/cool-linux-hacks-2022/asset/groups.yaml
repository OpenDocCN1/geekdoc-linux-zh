    # 酷炫的 Linux 技巧


    **本 Linux 杂志**特刊向你承诺带来“酷炫的 Linux 技巧”，我们一定会兑现——查看下一页的目录即可看到我们在书中呈现的所有精华。但究竟什么是“技巧（hack）”呢？


    在当今 Windows 主导桌面操作系统的世界里，决定使用 Linux 是第一个也是最重要的技巧。此外：


    - 如果我可以用它来解决问题或比以前更快地完成某些工作，那么它就是一个技巧。

    - 如果它的运行方式出乎意料，那么它肯定是一个技巧。

    - 如果它教了我一种使用 Linux 机器的新颖有趣的方法，那么它就是一个技巧。

    - 当它让我会心一笑，因为这种做法是显而易见地只有极客 Unix 人才会想到这样处理问题时，我会把它加入我的轶事列表（而且，它确实是一个技巧）。


    技巧的定义取决于个人口味，我们为本合集选择的技巧也是如此：许多作者都做了贡献，我们共同汇编了一系列新工具、经典工具的实用插件以及你以前以不同方式使用的软件的有趣案例。我们将技巧组织成九个类别，以便你在回溯搜索时能快速找到它们。


    最后一类是“游戏”，因为 Linux 不仅仅关于工作；你有许多方法可以让你的 Linux 机器玩起来。玩游戏就是其中之一。我们当然希望你会喜欢这一期杂志。


    Hans-Georg Eßer

