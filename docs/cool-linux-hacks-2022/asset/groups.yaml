    ```\n\n74\n\n酷炫 LINUX 技巧 – 2022版\n\n# Shell 技巧\n\n# 技巧 55\n\n## 配置你的 Shell\n\n\
    大多数任务都是重复的：你进入目录，用你喜欢的编辑器打开文件，并一次又一次查询你的动态 IP 地址。反复输入所需的命令可能很令人烦恼，但你通常不需要这样做：Shell\
    \ 会记住你的命令并将它们存储在历史记录中——这是内置的，并且当你在家目录退出 Shell 时。\n\n访问历史记录就像按下箭头键一样简单：每次按键都会回溯时间并显示上一个命令、倒数第二个命令，以此此类推。按回车键运行它，或者如果你喜欢可以进行编辑，然后自由输入命令。\n\
    \n如果你请求的命令很远，使用箭头键漫游可能太久了。如果你知道命令或其参数的一部分，请使用手动搜索：只需按下 `Ctrl-R` 并输入你记得字母。如果你无法进行搜索或当前匹配项不是你要找的，再次按下\
    \ `Ctrl-R` 让旧匹配项出现——重复直到你找到想要的正确命令。\n\n搜索或运行命令的另一种方法是运行 `history`：这个 Bash 内置命令显示历史记录以及每个带有数字的条目（图）。你制通过输入\
    \ `!` 后跟数字来运行命令。你还可以在 `!-数字` 命令的前后添加文本，允许你修改命令。在图 1 的示例中，我们从历史记录条目（sed 输入）和自由头部中构建了一个流水线。\n\
