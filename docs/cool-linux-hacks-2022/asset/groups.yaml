    \n[/content] 重新对齐并按照要求提供翻译后的完整译文如下：\n\n[content]\n# 运行代码\n\n# 骇客 67\n\n## Textdept\
    \ 支持图形模式和文本模式\n\n没有其他软件类别能像文本编辑器那样提供如此广泛的选择。Textdept 是一个极具前景的种子化且无干扰的设计，且在没有牺牲核心功能的情况下。它支持\
    \ Linux、macOS 和 Windows。\n\nTextdept 确实非常成熟：它的开发始于十年前，在过去的十年里，开发者们每两个月就会进行一次工作。\n\
    \nTextdept 可以作为二进制文件在命令行中运行，也可以作为 GUI 应用程序运行。可执行文件大小约为 3MB，可以通过 USB 闪盘运行。这非常小，但它能够塞入极速高亮（支持约\
    \ 100 种语言）以及更多功能。它的补全非常完整。对于我们这些没有摄影式记忆的人来说，它的功能至关重要。通过 Ctrl + Enter 进行自动补全可以处理你正在编辑的文件中的符号。你正在使用的语言符号可以配合\
    \ API 文档完美补全。\n\n编辑器也是直观驱动的、轻量级且文档完备。一个在许多编辑器中找不到的有趣功能是为每个文件单独更改字体大小（参见文件属性）。如果你从远程更改，还可以运行名为\
    \ textdept-curses 的 Textdept 终端版本。\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_82_0.png)\n\
    \n```c\nvoid line(int id, int addr = MAX_ADDR, size) {\n    if ((address, size)\
    \ != _AS_FREE) {\n        list_address(id, address);\n    }\n    int page = addr\
    \ / 1024;\n    int offset = addr % 1024;\n    if (page_table[page] == NULL) {\n\
    \        page_table[page] = malloc(size);\n    }\n    page_table[page][offset]\
    \ = id;\n    if ((tap % 12) == (PAGE % size)) {\n        return;\n    }\n    return\
    \ time(id);\n}\n```\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_82_1.png)\n\n\
    作者：Graham Morrison\n\nhttps://orbital.github.io/textdept/\n\n# 使用 SystemTap 进行动态分析\n\
    \n# 骇客 68\n\n在多线程程序中，源码中语句的顺序并不等于执行顺序，仅仅查看代码无法揭示程序操作的序列。你需要一些工具进行实时检查，也称为动态分析。\n\
    \nSystemTap 是其中一个工具，它的映射是主可执行文件。在 Ubuntu 和 openSE 上，你可以在默认仓库中找到 systemtap。你需要一个应该构建在发行版中的内核模块。在\
    \ Ubuntu 22.04 上，你应该安装 systemtap-doc；最新版本包含示例文件，将帮助你学习该工具。在损坏的 SystemTap 环境中通过\
    \ apt 安装。\n\nSystemTap 允许你编写脚本并附加到内核中发生的所有事件。它的设计旨在安全地用于生产系统，例如野外环境中的死锁。\n\nSystemTap\
    \ 能做之一是帮助确定内存泄漏。你可以在 /usr/share/systemtap/examples 中找到许多示例。它跟踪函数调用，并计算头部等待锁的时间。运行几秒后停止它；它将在\
    \ VirtualBox (43297) 中运行，调用 85557a2b8c216 次，89519 us - 数值越小越好。\n\n如果你有相同的问题，尝试添加\
    \ Ubuntu wiki 页面 Debug Symbols 中描述的新探针，sudo apt install g++* get libdev-dbv-linux-\
    \ 并编译 SystemTap 源码。\n\n作者：Violet Sinitaysn 和 Hans-Geörg Eisser\n\nhttps://opensource.ubuntu.org/systemtap/\n\
    \nhttps://wiki.ubuntu.com/Debug/20Symbol%20Packages\n\n酷酷 LINUX 版 - 2023\n\n#\
    \ 运行代码\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_83_0.png)\n\n# 使用彩色工具替换 hexump\n\
    \n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_83_1.png)\n\n# 使用 GRV 管理你的 git 仓库\n\
    \n当以十六进制形式查看二进制文件时，你能够更深入地解码任何位置的字面值。你实际上能够看到模式甚至数据度量，因为我们可以查看数据为何通过内存。这使得十六进制值成为拥有所有字符的实用工具，特别是当文件被存储或可执行文件可能如何工作时。\n\
    \n我们许多人都在命令行使用 git，以至于很难想象使用 GUI 来让访问仓库变得简单。从命令行到桌面的上下文切换往往足以中断你的思路或注意力。但有一个非常有用的工具。\n\
