    # 在 VirtualBox 虚拟机内部启动程序


    如果 VirtualBox 虚拟机中安装了增强功能（Guest Additions），你可以使用 VManage 直接在虚拟机上启动程序。以下命令登录名为“Fedora
    36”的虚拟机（VM），用户为 tim，密码为 123456。


    ```

    VBoxManage guestctl "Fedora 36" --exe "/usr/bin/gedit --username tim --password
    123456 --putenv "DISPLAY=:9"

    ```


    当它启动时，会留下 gedit 文本编辑器。--exe 选项用于你想要编辑的程序的完整路径。对于 Windows 虚拟机，你需要输入路径中的文件名，例如 C:\windows\calc.exe。对于图形化
    X11 应用程序，你可能需要使用 --putenv 参数设置环境变量。你也可以在参数中添加参数：


    ```

    VBoxManage guestctl "Fedora 36" --exe "/usr/bin/gedit --username tim --password
    123456 --putenv "DISPLAY=:0 edit/arg=/home/tim/brief.txt"

    ```


    参数始终位于两个双横线之后。在示例中，`edit/arg` 表示后面跟着 edit 程序的参数。这里，`just` 就是你想要编辑的文件路径。


    guestcontrol 命令在需要时可以提供客机状态的洞：


    - VBoxManage guestcontrol "Windows 11" list all


    除此之外，guestcontrol 还列出了你可以通过 closeprocess 杀掉的进程：


    ```

    VBoxManage guestctl "Fedora 36" --session-id 4022

    ```


    通过 --session-id，你提供了会话 ID。guestcontrol 代表正在运行的会话。


    作者：Tim Schmann


    # 美好的时光：1990 年代的 Linux


