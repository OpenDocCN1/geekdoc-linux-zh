    innovative spirit of gamers, computers that are more than 10 years old can be
    used as network storage in current IT environments.


    Systems frequently used by users in the past often offer plenty of space for mass
    storage. In addition, these systems have sufficient power supplies to run multiple
    hard drives as network attached. EasyNAS, an openSOURCE derivative, takes advantage
    of configuring network storage with multiple media and integrating it into an
    existing NAS [1].


