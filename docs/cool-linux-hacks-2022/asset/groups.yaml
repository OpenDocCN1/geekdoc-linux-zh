    # Obsidian: Note Taking App


    Linux is the worst of operating system for people who like to procrastinate because
    there''s too many choices. There''s also so much to learn when you make a choice
    that makes decisions even easier to postpone while another option. It is particularly
    true when it comes to note-taking applications because procrastinators are also
    prolific. There are many ways to take notes it is easier to spend time refining
    them than it is to make a decision and start using ones. There are command-line
    tools, Markdown editors, editors like Vim and Emacs org, and even to a simple
    file. These all have advantages, but none can easily link notes between notes
    and create dates. This is a problem that Obsidian has developed to solve, and
    it might become hugely helpful in the world of productivity hacking, to it supporting
    other primary applications and being particularly good.


    Obsidian is a desktop-based application built on Electron. It takes more resources
    than others, but it does so with beautiful feeling, smooth checking, syntax highlighting,
    and cross-platform compatibility, with apps for Windows, macOS, and others. To
    start taking notes you first need to create one. A vault is like a folder or directory,
    and Obsidian is its brilliant example. With a vault started, Ctrl+N will create
    a new note and start typing. The notes are written in Markdown so they can be
    read as raw text without any editor, and a preview button lets you see how they
    looked outside.


    there''s very little to learn about syntax, except in the way it''s built around
    links.


    The real genius of Obsidian is around, connections. These are created by adding
    double squares to Markdown links within the vault. If a page doesn''t exist, it
    can be created at the same time with a simple link. In this way you can quickly
    write your notes but also build a complex model of your knowledge without any
    extra effort. Another benefit of this feature is in the Graph View. This is how
    to visualize your notes, showing a node for each note and lines between nodes
    to illustrate the links. Move over a single node to see its connections and relations
    filling the screen with your notes over time. It''s all interactive and how they
    are organized, and it''s a genuine reason to use Obsidian over other note-taking
    tool you might be tempted by.


    > By Graham Morrison


    + 1. Markdown: your notes are saved as Markdown and the command line to enlace
    them comes from an SQL database.

    2. Vaults: Sets of notes are arranged in vaults, which are analogous to directories.
    Each vault is a folder on your computer, making it easy to see the relationship
    between your notes.

    4. Graph view: Highlight how to move over a note to see which connections it has
    and vice versa.\5. Editor: The Markdown editor is simple, clean, and efficient
    with an optional output preview.

    6. Export: Notes can be published directly or compiled into a PDF.

    7. Help: The help documentation is both substantial and well with content.


    https://obsidian.md/


