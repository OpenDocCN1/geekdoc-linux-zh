    \ 设备的数值，并用于计算机驱动的存档和补丁管理，库是必不可少的。MIDI 设备的存储容量和用户界面设计通常非常有限，这使得计算机驱动的存档变得有些复杂。通过硬件进行系统专用数据转储（System-exclusive\
    \ data dump）是设备内部原始数据的传输，而不是每个设备的 MIDI 数据（后者需要发送回设备以重新激活配置），但如果你想单独保存这些转储数据并进行管理和分类，你就需要一个库。\n\
    \n用户界面对每个设备来说都是相同的。数据转储或补丁（Patches）以网格形式显示，并用颜色区分补丁类别。你可以像使用标签云一样快速地进行过滤、排除或搜索。这意味着你无法在硬件上完成所有工作，但它让管理数千个补丁变得非常简单。选择其中一个将发送到设备进行即时预览，避免了在外部设备上保存数据的需要。如果你无法在补丁内部进行编辑，KnobCraft\
    \ Orm 可以让你从设备有限的存储和管理解放出来。\n\nKnobCraft Orm 最强大的功能是添加对你喜爱的硬件的支持，即使它不是该应用程序的一部分。这是通过适配器（adaptation）实现的，我们已经准备了许多。适配器是用\
    \ Python 编写的，存在于（C++ 编写并编译）的主程序之外。与使用静态语法转换为 JSON 来处理系统专用数据，这种解决方案要强大得多，因为得益于优秀的编程指南，KnobCraft\
    \ 让你在无需了解 MIDI 规范的情况下轻松处理数据，如果你已经对 MIDI 设备有良好的了解，编写适配器实际上很有趣。适配器变得就像原生设备支持一样，帮助你管理工作室中的每一个设备——这自\
    \ 2005 年 Ever Sound 驱动程序被放弃以来一直是不可能的。请注意，它的优势之一是跨平台性，这提供了许多不同的编辑器和库，以及插件配置和脚本。它也是自身成功的受害者：数据管理和库功能往往不尽人意，而编辑器提供了一个简单、高质量的\
    \ MIDI 库，专注于有限数量的设备并很好地支持它们。这正是名字奇奇的 KnobCraft Orm 所做的：KnobCraft Orm 可以原生与许多设备通信并从中保存，包括\
    \ Varia、Virus、Roland 和 Sequential 合成器，以及 RH-808 鼓机和 BCR2000 设备。所有设备的内部数据都可以被捕获、保存并重新发送。\n\
    \n作者：Graham Morrison\n\nhttps://github.com/christofmuc/KnobCraft-orm\n\n即使你不被支持，只要你知道位（bit）和字节（byte）的区别，创建你自己的也是简单的。\n\
    \n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_49_0.png)\n\n无论平台或许可证如何，KnobCraft Orm\
    \ 都是极佳且解耦的 Sound Driver 最现代的 MIDI 库。\n\n| 名称 | 颜色 | 数值 |\n|---|---|---|\n| Pad\
    \ (打击垫) | 红色 | 0000 |\n| Lead (领奏) | 蓝色 | 0001 |\n| Organ (风琴) | 橙色 | 0002 |\n\
    | Pad (打击垫) | 绿色 | 0003 |\n| Bass (低音) | 黄色 | 0004 |\n| Brass (铜管) | 粉红色 | 0005\
    \ |\n| Lead (领奏) | 紫色 | 0006 |\n| Drum (鼓组) | 青色 | 0007 |\n| Flute (长笛) | 棕色 |\
    \ 0008 |\n| Synth (合成器) | 白色 | 0009 |\n| Lead (领奏) | 灰色 | 000A |\n| Ambient (氛围)\
    \ | 金色 | 000B |\n| Vesta (维斯塔) | 蓝绿色 | 000C |\n\n酷 Linux 黑客技巧 — 2022 年版\n\n##\
    \ Mixxx DJ 软件\n\nMixxx 起于 20 多年前，最初是一个帮助 DJ 组织和播放播放列表的应用程序，它已演变成了一个不可思议的、全现场表演界面，用于缓冲以及专业\
    \ DJ 和电台节目主持。你可以通过 `mixxx` 安装它。\n\n它是 Traktor（以及不兼容的）Native Trackors Pro 的有力竞争对手，这两个应用程序都使用相同的用户界面范式。可以在主窗口水平排列一个或多个台（decks），中间有一组虚拟台和控制器。你在这里看到的控制数量取决于台的数量。\n\
    \n“台”（deck）类似于旧黑胶唱机或转盘机，你可以在调音器中并排两个或多个，这样你就可以在它们之间无缝切换。这种配置 Mixxx 至少在 21 世纪是可行的。虚拟台加载一个音频文件进行播放，可以自由地使用几十个台。\n\
    \n音频文件可以根据需要单独加载、拖入或排队。这种配置允许你无缝混合来自各种源的轨道，无论是节拍对齐的还是即兴创作的短曲，并将输出编辑为单个音频文件或将其作为混音或广播的源。\n\
