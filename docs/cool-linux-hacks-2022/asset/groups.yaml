    # Run VMs on Proxmox Server


    You may be used to creating virtual machines (VMs) in VirtualBox or VMware Player.
    These are desktop clients, which means that you run virtualization on the computer
    that you also use for your normal tasks. This approach works quite well, and it
    is easy to set up the software, but there are disadvantages. If you want to use
    the guest OS on more than one computer, you will have to install everything on
    each machine. Once you''ve become accustomed to the luxuries of VMs you may find
    that you have a lot of them, and copying gets there. If you need to reboot the
    host, all VMs must be stopped (or at least suspended to disk).


    Luckily the Linux ecosystem provides alternatives. If you have a spare computer
    (or a used one such as an HP Z240, which is offered by various dealers for about
    $150), you can turn it into a VM server. One open source project is Proxmox Virtual
    Environment (VE). Version 7 was released in May 2022; it is based on Debian/Linux
    11.3 and uses the Linux kernel''s KVM technology (and Qemu). Proxmox VE supports
    LXC containers (similar to Docker). Depending on what you need you can run a VM
    or container.


    You can get the 984MB ISO file from the project website, write it to a USB stick
    or a DVD, and boot from it. The installation process will wipe your disks. Once
    you''ve finished the basic setup, you can write the IP address that the installation
    displays and then move the container to any location that can access your local
    network. Further configuration will be done remotely, in a web browser.


    The Proxmox machine is a pure server; it will not need a monitor or a keyboard.


    For the next steps, you''ll need to dig into the terminology so that you understand
    what you''re reading. An introductory article or


    NetworkChuck''s three-part series about VMs on You-Tube [2]. He published these
    videos in 2021, but they are still good to get you started. It is not necessary
    to read the 500-page admin guide. Note that with every login the web GUI will
    display a screen ("You do not have a valid subscription for this server") which
    you can ignore.


    Your-to-day workflow will be like this: you''ll use one of the VMs or containers
    that you''ve already set up. You can start and stop them when you need them, or
    keep them active all the time. If you find that any of your existing installations
    solve your problem (or you just want to try something new), create a new Proxmox
    VM in a few clicks, make it boot from the image, and go through the usual steps—just
    like in VirtualBox or VMware Player. The screenshot shows the Proxmox GUI and
    an Ubuntu 22.04 desktop, both displayed by Firefox on a Mac. Alternatively you
    can create and stop much faster, they''re limited compared to a full VM.


    > By Hans-Georg Eger


