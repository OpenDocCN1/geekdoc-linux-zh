    \nBy Hans-Georg Eser\n\n- [1] (TOR) project: https://www.torproject.org/\n- [2]\
    \ Bug report for Ubuntu 22.04: https://bugs.launchpad.net/ubuntu+torbrowser-launcher/+1967272\n\
    \n## Permanently Wipe Files from Your Hard Disk\n\nWhen you delete a file in the\
    \ file manager, it does not easily disappear. In most cases, it falls into the\
    \ recycle bin, from which it can be quickly restored. If you empty the trash,\
    \ the deleted data can still be reconstructed.\n\nAfter installing the package,\
    \ restart the file manager by running `nautilus .`. Two new options are available\
    \ in the context menu of files and folders. The first one (wipe) overwrites the\
    \ deleted object in the file with random data. The application lets you choose\
    \ the number of deletion passes (file secure). Two passes are usually sufficient.\n\
    \nAfter you also use the second option, available disk wipe, which writes the\
    \ space map as free on the partition and ensures that backup copies and edited\
    \ documents are permanently deleted.\n\nIf you use an SSD instead of a classical\
    \ hard disk, disks are more complicated and wipe will not protect you against\
    \ an attack by a forensic expert.\n\nBy Christopher Lang\n\n> http://wipetools.taxify.com/\n\
    \n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_63_2.png)\n\nAre you sure you want\
    \ to wipe \"testfile.txt\"? If you wipe the item, it will not be recoverable.\n\
    \n- Options\n  Number of passes: 2 (advised for modern hard disks)\n\nCOOL LINUX\
    \ HACKS - 2022 EDITION\n\n## Disable Webcam and Microphone\n\nThe webcam: Apart\
    \ from a small light in the bezel, there is nothing to indicate that the device\
    \ is recording. With some devices, the program can even turn off the webcam LED.\n\
    \nThings are a little different with a microphone built into the device. Theoretically,\
    \ as with webcam, you need to enable the necessary kernel module, which you can\
    \ determine quite easily by looking at files in `/proc/`:\n\n```bash\n$ cat /proc/modules\n\
    0 snd_hda_int\n1 snd_usb_audio\n2 snd_usb_audio\n3 snd_usb_audio\n```\n\nWith\
    \ a classic desktop PC, you can simply plug in the camera and microphone to stop\
    \ the video streaming. This solution is not available for portable systems with\
    \ integrated hardware. Laptops and smartphones often offer slots for the webcam\
    \ and internal microphones.\n\nHowever, switching off `snd_hda_int` not only takes\
    \ the microphone, but also the internal sound. In this case, you will need to\
    \ connect a USB headset (even with a built-in microphone) - which use the `snd_usb_audio`\
    \ kernel module.\n\nAlternatively, you can disable the webcam if you no longer\
    \ need it. In Linux, to disable the `uvcvideo` kernel module, which is usually\
    \ loaded automatically at boot time. In principle, you can do this manually via:\n\
    \n```bash\nsudo modprobe -r uvcvideo\n```\n\nbut very often, some program will\
    \ have claimed the module so modprobe fails with a \"module in use\" error message\
    \ that forces you to go for the heavy restart and try to disable the uvcvideo.\n\
    \nYou can also disable the BIOS or UEFI settings to disable the devices. Working\
    \ at the BIOS or UEFI level gives you even more security: theoretically, a blacklisted\
    \ device can never be reversed by software running with administrative privileges.\n\
    \nTo prevent the Linux system from loading the webcam, add a blacklist entry to\
    \ a configuration file in `/etc/modprobe.d/`. You are free to choose any name,\
    \ such as `disable-webcam.conf`, and add the following:\n\n- blacklist uvcvideo\n"
