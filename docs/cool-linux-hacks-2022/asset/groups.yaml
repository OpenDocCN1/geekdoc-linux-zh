    ## Google on the Command Line


    If you need to google from command line but only have access to phone, but if
    you want to copy and paste something from the search results, then it is not really
    a good solution.


    A text-based browser like Lynx is much better.


    But there is another option more powerful and fits seamlessly into the workflow
    of: google [1]. Many distributions have the tool in their package repositories,
    but it can be installed with a few commands (version in June 2022 is googler 4.3.2).


    In the simplest case, you can start a search by googling the keyword "Linux" is
    shown in Figure 1. You can see that number of search results. If you search google,
    google determines the address to the browser to open. If this does not work for
    you, or if you want google to determine the appropriate browser, you then need
    to pass the name of the program with the `--link-handler` parameter, as example,
    with `--link-handler lynx` if you use it.


    By default, google always returns 100 results; the number can be increased or
    reduced with the `--NUMBER` parameter. If I use it, however, with `-n 12`, this
    will show only at most 12 months - which is quite handy, because if you''re looking
    for a particular error example, for you are naturally more interested in recent
    results than ancient ones.


    It is also useful to search for a website. For example, if you want to search
    within Wikipedia, you can do it with the `--option example`. In Figure 2 shows
    the terms for the "Linux" that come from the Wikipedia website.


    If you do not want to leave any traces when searching the web, take a look at
    ddgr!. It comes from the same author as googler, (almost) the same parameters,
    but uses DuckDuckGo is therefore more useful in current of data handling.


    ### Listing 1: installing googler


    ```

    $ cd Downloads/

    $ wget -c https://github.com/junur/googler/archive/refs/tags/v4.3.2.tar.gz

    $ tar -xf v4.3.2.tar.gz

    $ cd googler-4.3.2/

    $ sudo make install

    $ cp auto-completion.bash /etc/bash_completion.d/

    ```


