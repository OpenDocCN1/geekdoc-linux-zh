    从第一天起就几乎完全可用的充分理由是因为它已经以 Terminus 的名称建立。Tabby 希望像 Terminus 一样成为一个现代的终端模拟器。它提供了你
    1970 年代默认终端所缺失的便利和功能。这些差异在 Linux 上不会产生巨大影响，但如果你想跨平台使用相同的终端，可能会产生影响。Tabby 可以轻松安装在带有
