    # Kaboxer Auto-Loads Docker Images


    The way distributions deliver software is changing. New package formats such as
    Flatpak and Snap are becoming more widespread, and containers are becoming increasingly
    important for desktop users. There are many reasons for this. Developers want
    to see their software quickly reaches users without having to create accounts.
    Some approaches also allow multiple software versions to be installed simultaneously.
    Sandbox as a security feature also plays a role.


    In addition, not all software is easily installed and kept up-to-date using traditional
    package formats. This is especially true for distributions like Kali Linux which
    ship hundreds of highly specialized applications. Many of these specialized applications
    are unavailable in the Debian repository. Others are difficult to package because
    they rely on outdated libraries or would require root access to install apps so
    that they do not interfere with other programs.


    Kaboxer (1), a Docker and DEB-based application developed for Kali Linux, transparency
    deploys difficult-to-package applications in containers within the Debian packaging
    system.


    developers create Docker images of the applications, which they link in classic
    Debian packages. During installation, these packages download the images. To create
    the DEBs, Kaboxer extended Debian''s packaging tool helper to include a deb_kaboxer
    option and adapted the built system to match. As a user, you install the packages
    in the normal way with sudo apt install. Afterward, you will find the applications
    in the main menu.


    # Docker Makes It Possible


    The Kali developers'' decision to use Docker does not exclude other formats in
    the future. Docker was initially chosen because its containers come with a large
    number of parameters for configuration, which means that the images can be easily
    integrated, both with the host system and across multiple containers.


    To verify this integration, Kaboxer uses existing mount points and port redirects.
    Menu items are based on .desktop files created for the kaboxer group.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_28_0.png)


    # Kaboxer


    Kali Linux specializes in penetration testing and digital forensics. Based on
    Debian, Kali uses the Debian package manager.


    Kaboxer (an abbreviation of Kali Applications) uses the Debian system via containers
    but integrates them into the existing system and controls them transparently via
    Kaboxer.


    The Kaboxer developers emphasize the compatibility of this approach with other
    Debian variants in the documentation.'
