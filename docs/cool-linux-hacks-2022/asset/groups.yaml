    # SECURITY & PRIVACY


    # Securely Split Your Files with horcux


    Back in the days before the World Wide Web, back BBSs were common, and if you
    were lucky, the Internet was accessible via dial-up, downloading large files was
    difficult. There were several reasons for this, but the most important was that
    it was hard to maintain a stable connection for a long period of time. Coming
    off the popularity of Usenet, it became common to split large files into smaller
    files that could later be reconstructed or stored across several floppy disks.
    The brilliantly named horcux is a modern version of that functionality,


    this time designed specifically to help keep your files secure encryption.

    Horcux is a command-line tool that''s been designed to offer a form of secure
    encryption without the need for a private key or passphrase. It does by splitting
    a file into a selectable number of pieces with a certain redundancy. The redundancy
    lets you reconstruct the original file from a small file less than the total.
    You might choose to split your personal diary into ten pieces, for example, to
    make the data reconstructible from just few. The idea is that pieces of pieces
    you can presumably remember better than a passphrase, bringing at least the redundancy
    number if you ever need to access it. Locations could be physical, such as a USB
    stick or disc, or cloud storage or a remote server. One commands needed to do
    all this, horcux splits and horcux binds, and you''re prompted for the number
    of pieces and redundancy when necessary. It''s a great idea, and hopefully without
    the same consequences if they are destroyed.

    On the project website you can find an archive that contains a static binary for
    all Linux distributions.


    Horcux uses Shamir''s Secret Sharing (SSS) to encrypt a split into pieces.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_57_0.png)


    https://github.com/jesseduffield/horcux


    By Graham Morrison


    # HACK 42 OpenShift Application Firewall


    An application opening a connection to the In-


    net is a normal process and typically completely legitimate, but there are programs—open
    source applications—that like phone home or track the user. On Linux, this is
    usually an opt-in so you have to activate the data collection. With collected
    data to telemetry functions and gives the developer information about users and
    tracking in your program. However, even ones do not always ask for permission.
    In Firefox, you have to opt out of sending telemetry data if you don''t want this
    to happen.


    FirePort[2] for Linux and GlassWire[3] for Windows. I''ll take a look at an open
    source application firewall: OpenShift[4], a python of for the Little Snitch [5]
    personal firewall for macOS. OpenShift development began in 2017.


    An application firewall can reveal what''s going on behind the scenes. While conventional
    firewalls examine the data packets to and from the CPU, an application firewall
    takes an application-specific view when monitoring the እንደሚ data. (Do not confuse
    an application firewall with a web application firewall [1,]) Examples of application
    firewalls include


    +   Listing 1: Manually Activating OpenShift


    ```

    # systemctl --enable openshifted

    ```


