    # SECURITY & PRIVACY


    you can define whether the rules should apply to the running process, only to
    the targeted URL, or to the domain to be contacted.


    OpenSnitch saves the rules you create in JSON format /etc/openswitch/rules file,
    which you can also edit. If necessary, you can save them as a CSV file list of
    applications to contact external hosts, for process the list with external applications
    (Figure 2).


    If you do not configure any settings, the window closes after 15 seconds and OpenSnitch
    blocks the connection. You find the time bar bit short, so you might want to extend
    the grace period in the preferences, which you can access via the middle icon
    at the top of the application (Figure 3).


    With the Pop-up tab, you can change the default from deny to allow, set a shorter
    period instead of the default duration, or extend the always always, depending
    on your needs. If you need window (e.g., because it closed faster than you could
    react), you can edit the settings in the main window (Figure 4).


    # Firewall On Off


    In the main window''s header bar, on the far right, you will find the play button
    where you can turn the firewall on and off. This button is especially important
    initially you need some time to define rules for the world. You can use this button
    to break up convenient chunks of time.


    In the menus bar, you will find eight tabs. Every applications that connect to
    the outside world (Figure 5). Nodes typically have one socket per device, from
    which the OpenSnitch GUI gives the data for visualization. For this it is /tmp/osni.sock.


    The Rules tab, also lists the applications that have been created (Figure 6).
    The pages list the rules applications have attempted and how often occurred per
    host. The Events tab lists the applications that tried to contact and the frequency
    of those attempts.


    The Addresses tab keeps track of the URLs and the frequency of contacts. For same
    in terms of the contacted hosts, which the Users list the users involved and records
    number of contact attempts initiated by the users. Any of these, you can edit
    entries by clicking on them to increase the default timeout for pop-up, also as
    adjust other settings.


    To avoid losing your rules when faced with many individuals, you can also filter
    the entries in the individual tabs. At the bottom of the window, you can see number
    of connections during the current time and how many of them were rejected (dropped).


    # FAQS


    OpenSnitch can manage anything that connect to a host from a Linux system. For
    multi-user systems, the rules can be defined for each user. According to the developers,
    OpenSnitch occasionally misses a connection; the project (7) on GitHub explains
    the possible reasons for this not experience any such queries in my test. An FAQ
    [8] answers frequently relating to the application framework.


    Once you have created all your rules, OpenSnitch runs unobtrusive in the background.
    A notification will only appear if you install a new app that makes connection
    attempts to the outside. If you make a conspicuous number of connections, you
    will need to harden the rule for that app by checking each process for an outgoing
    request or the domain in each case, and then confirm or deny access.


    # Conclusions


    While OpenSnitch is annoying at first, this means it is doing its job properly.
    You can temporarily avoid the requests for rules by disabling the firewall and
    then defining rules when it suits you. Getting started with OpenSnitch is quite
    easy compared to the installation [9].


    OpenSnitch is particularly interesting for browser, web apps, or third-party applications.
    It helps to keep a close eye on these connections and adjustments to rules as
    necessary. You will learn what some tries to do.


    In conclusion, OpenSnitch improves the security of your system with taking out
    worry beyond the initial setup.


