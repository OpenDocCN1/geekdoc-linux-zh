    ## Configure Your Shell


    Most tasks are repetitive: You enter the directory, open the file in your favorite
    editor, and query your dynamic IP address again and again. Typing the required
    commands again and again can be annoying, but you often won''t have to do: The
    shell remembers your commands and stores them in its history—built in and when
    you exit the shell in your home directory.


    Accessing the history is as simple as pressing the Arrow key: Each keystroke will
    travel back in time and show the last command, the second to last, and so on.
    Press Enter to run it or edit it if you like, then freely entered with a command.


    Walking with the Arrow key might take too long if the command you want is far.
    Use the manual search if you know part of the command or its argument(s): just
    press Ctrl-R and type the letters you remember. If you cannot make your search
    or the current match is not what you''re searching for, press Ctrl-R again to
    let the old match—repeat until you''ve found the right command you want.


    Another way to search or run a command is running the history: This Bash builtin
    shows the history and every entry with a number (Figure). You can run a command
    by typing ! followed by the number. You can also add text before and after the
    !-number command that lets you modify the command. In the example in Figure 1,
    we built a pipeline out of history entries (sed input) and a free-head.


    The shell also provides a shortcut (for the last command—what you need when the
    Arrow key will bring back the last command!). One example is using the command
    with sudo so that it runs with privileges. In the following, you can see a failed
    attempt to show the kernel ring buffer until a successful one uses !!.


    *Figure 1: Combine history entries with commands*


    ```

    $ dmesg -t tail -2

    dmesg: kernel buffer failed: Operation not permitted

    $ sudo

