    # HACK 28


    # Run dmesg with the Right Options


    The dmesg tool shows messages that appear in the kernel ring buffer, and it can
    do in as many ways as the impressive list of options in its man page shows. But
    most those options aren''t interesting, you just need a few.


    Run `dmesg -luxw` to see both user-kernel messages with a human-readable absolute
    time format (-t), as well as priority prefixes (-p) in continuous follow (-w).
    That leads to the situation shown in the figure. The color highlighting appears
    automatically unless you''re remotely logged in a terminal with strange settings;
    in that case, you can try to force colored output --color


    While we looks to the screen and wait for future messages, you cannot scroll back.
    If you want to see the past, use the -u option: you will see the ring buffer''s
    entire contents (starting with the first lines), and you can scroll down to later
    entries. Note that the buffer is in a fixed ring and it will lose the messages
    after a while. If you want to restrict dmesg output to user-mode or kernel-mode
    messages, add a -v option.


    Note that some of information never make it into this buffer: Check files in /var/log
    as well; your syslog service might log some information to /messages, syslog,
    or other files in that folder.


    By Hans-Coge Eiber


