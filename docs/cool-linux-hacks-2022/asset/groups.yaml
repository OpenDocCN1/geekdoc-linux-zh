- md: "\n## OFFICE\n\n## Search Office Files with uvgrep\n\nIf you like to work on\
    \ the command line, you may be aware of the grep tool, which lets you search for\
    \ content in files. You can use simple search patterns (such as words or numbers),\
    \ or even make the tool ignore case and use regular expressions, which are powerful\
    \ that whole books have been written about them. For example, the regular expression\n\
    \n```\n`^[0-9]{1,3}-[a-z]*--\\$`\n```\n\nwill match obey this pattern:\n\n```\n\
    12-abc-12\n9-zzzz-9\n123-aaa-12\n```\n\nThat is, a line that starts with a number\
    \ that has between one and three digits, followed by a hyphen, then a string of\
    \ lowercase letters (at least one), another hyphen, and then the number from the\
    \ beginning. The regular expression handles the backwards by declaring a group\
    \ with the round brackets and referencing it with \\1. If there were more groups,\
    \ they could be referenced with \\1, \\2, \\3, and so on.\n\nIf you are unfamiliar\
    \ with regular expressions, O'Reilly has a good interactive tutorial on their\
    \ website!\n\n## Problems with Binaries\n\nWhile grep lets you search in files,\
    \ many applications created binary files that cannot be \"grepped\". LibreOffice\
    \ stores your documents in ZIP archives. They often have extensions such as .odt\
    \ (text), .ods (spreadsheet), .odp (presentation), all these files are regular\
    \ ZIP archives. \n\nFigure 1: You can extract LibreOffice documents and inspect\
    \ the XML code.\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_13_0.png)\n\nYou can\
    \ rename this file type to document.zip and open it with the default program -\
    \ you will find that some archive managers start and display a folder structure.\n\
    \nFigure 1 shows what you can find inside a LibreOffice Writer (.odt) file: The\
    \ first file in the ZIP archive is content.xml. The heading 1 paragraph in Writer\
    \ is internally stored (without the line like:\n\n```\n<text:text:name=\"Heading_20_1\"\
    \ntext:outline-level=\"1\">\nExample 1\n</text>\n```\n\nand the following paragraph\
    \ stored in a similar way:\n\n```\n<text:text:name=\"P1\">\nThis is a sample document\
    \ to show the structure of LibreOffice document files. This is a sample document\
    \ to show the structure of LibreOffice files.\n</text>\n```\n\nBecause XML files\
    \ are also files, they can be searched with grep. It saves a lot of effort to\
    \ rename your files, extract and access the content files every time you search\
    \ for.\n\n## Universal grep\n\nI've written a tool that automates the process:\
    \ uvgrep (\"universal grep\"). It can search LibreOffice and Microsoft Office\
    \ files, PDFs, and more. You can download it from GitHub (2), but you will also\
    \ need a few helper programs:\n\n- llint to parse and format XML, which is necessary\
    \ for LibreOffice files; they tend to contain extremely long lines--when you expect\
    \ to see a little bit of context instead almost all of the document's contents.\n\
    - pdfgrep is a separate tool to inspect PDF files. It uses it for searching inside\
    \ PDF, Office, and text files with one invocation.\n- llint and pdfgrep tools\
    \ are not installed by default; on Ubuntu you can well search in the libxml2-util\
    \ package and pdfgrep in the pdf package. If you have not got it grep, you may\
    \ have to install the git package, too.\n\n```bash\nsudo apt install libxml2-utils\
    \ git grep\ngit clone //github.com/hgesser/ugrep\nmake +x ugrep\nsudo cp ugrep\
    \ /usr/local/bin/\n```\n\n## Figure 2: ugrep shows you the compressed XML documents.\n\
    \nAgain, these are regular expressions, they remove everything between < and >\
    \ characters and leading blanks. ugrep will just do that if you add the -x option.\n\
    \n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_14_0.png)\n\n## Other Formats\n\nWhen\
    \ you try to search a file that ugrep cannot handle, it will print an error message\
    \ for that file (but it will work on the file anyway, so using a comment like\
    \ --phrase is okay, even when there are unknown file types in the folder). However,\
    \ you can modify the script so it will handle more file types. Find the lines\
    \ in the script where ugrep checks these lines: The block starts with\n\n```\n\
    case $1 in\n  txt | sh | conf | pl | py)\n    grep -H --options \"$PATTERN\" \"\
    $file\";\n```\n\nIf you use an x-regex expression for some files that contain\
    \ plain text, then add it to the list of text extensions, for example, by changing\
    \ the second line\n\nWhen you run ugrep on regular files, the tool behaves just\
    \ like grep (even though it will let you use any options except -i for case sensitivity\
    \ and -n for showing line numbers), but it can also read Office and pdf files.\
    \ Figure 2 shows what it finds when searching the example Writer document.\n\n\
    Also, when working with other binary files and how to extract text from them,\
    \ you can add support for a new file type by copying and modifying the code for\
    \ LibreOffice or Microsoft Office files. Figure 3 shows most of the current functionality\
    \ of ugrep, searching various file types and supporting XML tags.\n\n## Improvements\n\
    \nThe output contains only text and XML tags like\n\n```xml\n<text:style-name=\"\
    P\">\n</text>\n```\n\nwhich can be helpful to find out which text was found within\
    \ a paragraph or a heading. If you just want to find out any XML syntax, you can\
    \ get rid of it by asking ugrep to filter the output through the text editor.\
    \ It just takes an additional invocation of\n\n```bash\n-se 's/<text:style-name=\"\
    \"> -e '$1 //'\n```\n\nso that the command works on Libre Office (.odt, .docx,\
    \ .xlsx, .pptx) removes the XML code.\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_14_1.png)\n\
    \n## Figure 3: Search, LibreOffice and text files.\n\n[1] Regular expressions:\
    \ https://www.oreilly.com/content/introduction-to-regular-expressions/\n[2] ugrep:\
    \ https://github.com/hgesser/ugrep\n\n## Networking\n\nHopefully, your network\
    \ is doing fine, both Ethernet and WLAN. If not, look at our hacks that help with\
    \ network configuration. We also talk about clever tools like LANDrop, sshuttle,\
