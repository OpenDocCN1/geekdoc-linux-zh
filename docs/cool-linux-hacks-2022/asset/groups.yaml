    a list of monitors and which one to use with `--name (-n)`. However, the output
    displays in the terminal in which the command is running, generally gives little
    with the monitor.


    Without any options, `swatch` only records the files that have changed, but other
    options can add information, such as the event detected, and optionally, the time
    the event detected. Each event has more than one event type. `swatch` event types
