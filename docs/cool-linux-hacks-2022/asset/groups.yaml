    ## 23 使用 Docker 测试替代 CMS


    Docker 是专家们所说的“虚拟化”的工具。虽然技术细节非常有趣，但最重要的是你可以在几秒钟内下载并运行复杂软件包的实例。


    阅读这些替代方案，但没有什么比实际运行这些系统更能帮助你做出决策了。现在设置一个 CMS 加上所有数据库、新主机，以及大多数操作都需要时间。一旦你决定删除它，很可能会留存一些碎片并浪费你服务器上的空间。


    这使得 Docker 对各种应用程序都变得有趣，对于那些考虑切换到不同内容管理系统（CMS）的网站所有来说特别有用。如果你是其中之一，你可能会——


