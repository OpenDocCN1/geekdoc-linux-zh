    \nCOOL LINUX HACKS – 2022 EDITION\n\n# Run Code from the Command Line\n\nSometimes\
    \ you want to use functionality that is familiar from C programming, but you cannot\
    \ find a code that you could call from a script. For example, the getcid() and\
    \ getpid() (functions) which require running the task and process have no shell\
    \ equivalent.\n\nOf course, you could write a simple C program that calls the\
    \ function you are interested in, but then you would have to pass every parameter.\
    \ A better way is to use a simple wrapper script that takes a string of code,\
    \ puts it into a c file, and then compiles and runs it. The following five lines\
    \ do just:\n\n```bash\n#!/bin/bash\nargs=$1\nname=\"tmp_$RANDOM\"\nprint \"int\
    \ main () { %s; } printf(%s\\n)\" \"$args\"\ncc -o \"$name\" \"$name.c\" 2>/dev/null\
    \ && .\"$name\"; rm -f \"$name\"\n```\n\nSave this as `run.sh` and make it executable.\
    \ (Use a different name if you use the tool for starting containers.) Now the\
    \ c compiler will include it. You can now run commands via run. In order to identify\
    \ the session ID of process 1292,\n\n```bash\nrun \"getdn,getid(1292)\"\n```\n\
    \nThis shows that a getpid() call in the process with PID 2615. If I could have\
    \ asked the question to show me -o sess -s sess 2615 (-h no header, -o sess equals\
    \ only the session ID, and -p only the process with this PID) and via ps -h -o\
    \ pgid -p 2615, but I knew that the -h option shows the session ID column by name.\n\
    \n# More Examples\n\nYou can use more code blocks including loops. For example:\n\
    \n```bash\nrun \"for (int i=0; i<8; i++) printf(\"%d\\n\", i); printf(\"%s\\n\"\
    );\"\n```\n\nIt will also print a sequence of numbers (like just that stretches\
    \ several lines; when you start the script with the -char line option, you can\
