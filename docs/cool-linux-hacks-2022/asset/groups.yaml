    # VCV Rack 2 Modular Synthesizer


    There are free source projects that not only broaden the possibilities for their
    users but also kickstart an entire ecosystem. Mutable is one of those projects,
    as Kit says, but too is the amazing VCV Rack (often abbreviated as Rack). VCV
    Rack is a virtual synthesizer where different modules can be connected to one
    another to create an infinite variety of sounds, melodies, sequences, control
    responses, and physical devices. What was most remarkable about this is that it
    spawned a library of first- and third-party modules that could be added to your
    rack, many of which might cost hundreds or thousands of dollars but are obtained
    all for free. There was a real synergy between certain hardware vendors, as Mutable
    Instruments, who purposed built open source hardware and firmware, and the developers
    who created modules based on their originals or modules that were improved by
    their functionality.


    This plug-in enabled anyone to create their own modules with ease. With VCV Rack,
    these can be dragged into your virtual rack and wired with virtual cables, in
    gravity with the sound produced to your headphones. Their prevalence allowed to
    spawn a separate party ecosystem, with module creators creating for their own
    creations and others requiring complex licenses to use them. An associated VCV
    online store and framework provided access to these modules and those you could
    purchase. This success also brought a little drama. When it came the original
    project was rewritten to support modules and eventually a Pro version, which finally
