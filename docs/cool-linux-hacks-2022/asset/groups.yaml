    ## VIRTUALIZATION


    ## HACK 19


    ### Use Docker Tools as Filters


    The Unix philosophy - that Linux allows us to – use a set of simple tools and
    combine them in clever and creative ways to solve problems. Traditionally, such
    a problem is a task in which one or more input files need to be analyzed and transformed
    into a set of outputs.


    In many cases, you will literally assemble a solution by picking a set of command
    lines and arranging them in a way that the first tool''s output will be used as
    input for the second tool, the second tool''s output for the third, and so on.
    That "building a pipeline", and here''s an example:


    ```bash

    cat /passwd | column -t -s: | txt2html --make_tools > passwd.html

    ```


    (will fail when txt2html is missing), run the slightly longer command which use
    with a fresh container:


    ```bash

    grep /var/log/syslog | tail -n 100 | sed -e ''\s/sub224#hostname=/g'' -e ''\s/username=/g''
    | less

    ```


    ```bash

    cat /passwd | column -t -s: | docker run -i --rm txt2html --make_tools > passwd.html

    ```


    This command line combines four tools (grep, tail, sed, and less) and all of them
    at once, connecting each tool''s output with the following tool''s input. This
    assumes you have created a Docker image with the command `docker build --tools`
    in a folder that contains the Dockerfile. Docker starts a fresh instance of the
    image and runs the txt2html command inside – the important part is the -i option
    which forwards your local standard input to the Docker container and lets the
    converter read the output of the command in the pipeline.


    - 1. The grep search for all lines in the log file /var/log/syslog that contains
    the system name. It outputs those lines while it skips the others.

    - 2. Output gets piped into a tail process which removes all but the last 100
    lines.

    - 3. Next, sed performs two search-and-replace operations on the output of tail.
    In an attempt to modify the log entries: the real hostname and the username are
    replaced with generic names. This does not filter any lines from the process stream;
    it looks at every line and potentially alters them.

    - 4. Finally, the output is piped into less, which is a pager program that lets
    you look at the information. In less, you can scroll up and down lines, and pages
    you can search.


    If you need the tool often, it won''t make sense to start a fresh container and
    remove it for each invocation of the tool. Instead, start it in detached mode
    (in the background):


    ```bash

    docker run --itd --name r_tools tools

    ```


    and then use Docker''s exec command in the pipeline:


    ```bash

    cat /passwd | column -t -s: | docker exec -i r_tools txt2html --make_tools > passwd.html

    ```


    The name with the --name option must match the name you use with the exec command.


    ## Enter Docker


    So how are containers relevant in this? In order to run a command pipeline, all
    components of the pipeline have to be installed. While this is obvious, you will
    quickly find a required tool to run them


    For example, the simple filter txt2html might not be available as an installable
    package for your desktop, but you can find it in the repositories of Debian and
    Ubuntu systems.


    By Hans-Geer Eser

    https://metacan.org/dist/txt2html/scripts/txt2html


    ### Listing 1: Dockerfile


    | FROM debian |

    | :--- |

    | RUN apt-get update -q |

    | RUN apt-get -y --force-install txt2html |

    | CMD /bin/bash |


    | root | 0 | root | root |

    | :--- | :--- | :--- | :--- |

    | daemon | 1 | daemon | bin |

    | alice | 2 | alice | bin |

    | bob | 3 | bob | bin |

    | charlie | 4 | charlie | bin |

    | root | 5 | root | bin |

    | games | 6 | games | bin |

    | mail | 7 | mail | bin |

    | null | 8 | null | bin |

    | new | 9 | new | bin |

    | proxy | 15 | proxy | bin |


    ## Boxer Auto-Loads Docker Images


    The way distributions deliver software is changing. New package formats such as
    Flatpak and Snap are becoming more widespread, and containers are becoming increasingly
    important for desktop users. There are many reasons for this. Developers want
    to see their software quickly reaches users without having to create accounts.
    Some approaches also allow multiple software versions to be installed simultaneously.
    Sandbox as a security feature also plays a role.


    In addition, not all software is easily installed and kept up-to-date using traditional
    package formats. This is especially true for distributions like Kali Linux which
    ship hundreds of highly specialized applications. Many of these specialized applications
    are unavailable in the Debian repository. Others are difficult to package because
    they rely on outdated libraries or would require root access to install apps so
    that they do not interfere with other programs.


    Boxer (1), a Docker and DEB-based application developed for Kali Linux, transparency
    deploys difficult-to-package applications in containers within the Debian packaging
    system. developers create Docker images of the applications, which they link in
    classic Debian packages. During installation, [the text continues...]

