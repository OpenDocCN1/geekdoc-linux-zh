  mdcn: "\n\n## 终端 技巧 58\nSHELL 技巧\n\n### 高亮 grep 输出\n\n`grep` 命令可以高亮输出中匹配你搜索表达式的部分。要实现这一点，你只需要使用\
    \ `--color` 选项。事实上，某些 Linux 发行版已经为你设置了它：\n\n```bash\nalias grep='--color=auto'\n\
    ```\n\n（以及其他设置）为了升级 grep 并使其输出彩色内容。在输出中看到搜索词非常有用，以至于简单的 `cat` 无法高亮表达式这让我感到困扰。我搜索了它，发现\
    \ `grep --color` 会输出所有行但高亮指定的关键词。图 1 显示了一个运行 `dmesg` 的终端，高亮了不忽略大小写的 `eth0` 或 `eth`\
    \ 的出现情况。\n\n> 图 1：高亮系统日志中的行。\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_76_0.png)\n\
    \n你可以将这个新工具作为过滤器，它也接受文件名参数。将：\n\n```bash\nsomtool | grep keyword\n```\n\n替换为：\n\
    \n```bash\nsomtool | hl keyword\n```\n\n是可以的，但如果你想输出高亮的关键词，可以作为一种“多余使用 cat”的形式，例如：`cat\
    \ file | hl keyword` 或者通过操作符使用标准输入（`hl |`）。\n\n由于 `hl` 遵循所有选项，你可以使用增强功能，例如搜索正则表达式或使用该工具获取帮助。高亮\
    \ USB 和网络连接是执行这项任务的问题：它会高亮每一行，尝试在其中 `grep` 搜索词（带颜色）——并在失败的情况下，回显它。你可以在 bash 脚本中使用以下代码：\n\
    \n```bash\n#!/bin/bash\nwhile read -r line; do\n  line=\"$line\"\n  echo \"$line\"\
    \ | grep --color=$1 | echo \"$line\"\ndone\n```\n\n> 图 2：bash 脚本的简单高亮。\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_76_1.png)\n\
    \n`dmesg | hl -u \"usb\".`\n\n这可以用于高亮大小写差异，它匹配所有（以便我们将匹配完整）匹配，但除非——启用正则表达式，并且我们正在寻找\
    \ `eth0` 或 `eth` 或 `us`（后面跟着一个字符）。\n\n如果你想构建一个高亮特定语言的脚本，请为其提供一个正则表达式列表。在图 2 中，你可以使用这种方法，但在每个搜索词必须是正则表达式的限制下，它不像一个高亮所有内容的脚本。事实上，`grep`\
    \ 自身就可以轻松完成这项工作。只需在 `dmesg -w grep --color -lw \"^usb$\"` 之前添加 `|`。\n\n每一行都被匹配，因此\
    \ `grep` 不显示任何内容，但只对带有“正确搜索结果”的行进行着色。\n\n> 作者：Hans-Georg Erdt\n\n酷炫 LINUX 技巧 -\
    \ 2022 版\n\n77 \n\n## Cool Retro Term 带你回到 80 年代\n\nLinux 发行版带有许多终端模拟器供选择：如果你运行\
