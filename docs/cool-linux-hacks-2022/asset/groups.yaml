    dir`）的命令，客户端只需通过正确的端口访问你的 IP 即可。它可以作为守护进程在后台运行，使用证书，处理身份验证，并仅监听特定的 IP 地址。如果该命令为你提供了更多选项（在单独的包中可用），一个方便的
    GUI 可以半自动地运行所有这些，增加在本地网络之外进行 NAT 穿透的能力，并将目录以 .tar.gz 格式发送。


    作者 Graham Morrison


    ```

    https://github.com/itlf/weorf

    ```


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_23_1.png)


    ## 使用 SSH 使用 SSH 会话


    想象你正在使用 SSH 在远程机器上工作，并启动了一个需要一些才能完成的命令（例如构建过程）。如果电脑进入睡眠或网络极其不稳定，SSH 连接将会中断。远程机器会检测并终止该登录会话中的所有进程。


    有几种方法可以避免这种情况。一种老技巧是使用 `nohup` 命令在后台运行进程，以应对网络中断和连接丢失做好准备，它们将忽略连接丢失时发送的挂起信号。对于构建过程，那可能可能是：


    ```

    nohup

    ```


    而不是简单的命令。副作用是所有输出将写入一个 `out` 文件，且脱离连接会话。


    我更倾向的解决方案是不使用 `nohup` 或类似的技巧。我使用 `screen` 会话。（如果你的机器没有它，该包专门称为 `screen`）。


    当 `screen` 启动时，它会显示一条关于版权和许可的长消息；按回车键通过。然后你就可以像往一样继续使用 shell。如果你丢失了连接，重新连接到远程机器并运行
    `screen -r` 来重新附加到现有会话。


    也许你不确定是否有正在运行的 `screen` 会话——`screen -ls` 是一个好用的搜索选项：


    有一个 `screen` 在运行中：


    ```

    16712.pts-0-hp-2428 (05/06/2019 11:24:49 AM) (Detached) 1 Socket in /run/screen/0-esser.

    ```


    你可以将登录远程机器并检查 `screen` 会话的过程自动化。创建一个文件——`.bash_login`（如果你还没有的话），并向其中添加以下行：


    ```

    screen -XS /dev/null -S -ls

    ```


    当你登录到一个 `screen` 会话时，你将收到通知（见图）。（Bash 仅在登录会话中执行 `.bash_login`）。


    如果你想从运行中的会话中分离，按下 Ctrl-A，D。你可以用 `screen` 做更多事情——去检查一下其中几个。


    ```

    $ssh -p-2428 user@server

    Last login: Mon 6 11:34:58 2019 from 2001:db68:0750:db22:93

    1 Socket in /run/screen/0-esser. (05/06/2019 11:33:22 AM) (Detached)

    ```


    作者 Hans-Görg COOL LINUX HACKS - 2022


    ## 使用 shuttle 挖掘隧道


    在不可信的网络中，我选择使用 `shuttle`。有无数种替代方案，我怀疑这个名字暗示了隧道至少不是根目录。OpenVPN 非常丰实。我需要具有用户权限的
    SSH。此外，在建立连接的服务器上必须安装 Python。使用带有指定端口参数（`-port`）和要共享文件夹参数（`-d dir`）的命令，客户端只需通过正确的端口访问你的
    IP 即可。


    ```

    sudo shuttle -r <user>:<server>:80

    ```


    然而这意味着如果端口号是 22，应该到达局域网中的其他设备。为了保持局域网可见，我将其定义为


    ```

    sudo shuttle -r -d <user>:<server> -x 192.168.2/24

    ```


    包含在这里。这意味着连接也会通过隧道运行，这并不是自动发生的。除了 DNS 之外，是 `shuttle` 在传输 TCP。


    ## 拥塞告警


    其他协议在网络层和 TUN/TAP 上工作，而 `shuttle` 在应用层工作。它组装 TCP 流，保持状态，并再次放入目标端。这避免了困扰 OpenVPN
    等其他工具的 TCP 之上的 TCP 问题（拥塞控制）。该协议定义了丢包限制。如果你通过 TCP 建立隧道，你就会丢失拥塞控制，这可能导致模式。`shuttle`
    对此问题是免疫。各种参数可以帮助你排查故障。


