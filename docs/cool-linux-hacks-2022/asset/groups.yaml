    ## HACK 47 锁定你的屏幕，时刻如此


    在某些明显的情况下，你应该锁定屏幕，例如当你在开放式办公室工作时，或者你已经在各种机器上打开了四个带有远程 shell 的终端窗口，而你正准备去午饭时——你不希望你的电脑暴露在外面。


    在我读研究生期间，同事之间经常玩一项“例行工作”：互相盯着对方的电脑，寻找未锁定的电脑，并打开像 lockyourscreen.com 这样的网站（见图）。当然，这总比快速安装一个后门
    SSH 服务器要好。在危险程度较小的情况下，锁定机器是有意义的：如果你在家里，有一只猫在键盘上走来去，它可能会为 `vi` 编辑器提供恰好的输入，从而对你的配置文件造成破坏。


    （然而，猫不太可能进入并保存她的修改）。


    每个桌面都有用于锁定屏幕的菜单，但按下某些键要快得多。除了 Linux 之外，我还查看了非 Linux 操作系统的热键，因为这在电脑上非常重要：


    - Gnome: Win+L

    - KDE, Cinnamon 和 Xfce: Ctrl+Alt+L

    - macOS: Ctrl+Command+Q

    - Windows: Win+L


    当然，Linux 桌面允许你将这些热键更改为其他。


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_65_0.png)


    作者：Hans-Geörg Eßer

    > https://lockyourscreen.com/


    ## 使用 crypt 进行快速加密


    在将文件作为邮件附件发送或上传到某些云存储服务之前，有许多方法可以对其加密，但大多数方法都需要某种程度的保护，或者包含不必要的步骤。例如，发送 GPG 加密的邮件需要你和接收者都拥有对方的公钥。将文件放在密码保护的
    ZIP 压缩中是一个选项，但当你只想发送一个文件时，为什么要创建一个压缩包呢？


    命令行工具 `crypt` 提供了一个快速解决方案。它在大多数仓库中可用：在你的机器上运行 `apt install`、`zipper install` 或
    `yum install`。


    要加密单个文件，运行 `crypt filename` 会要求输入加密密钥（它不会回显你输入的字符），然后就完成了。查看目录，你会发现 `filename`
    现在变成了 `filename.crypt`。该程序已覆盖了原始文件的内容。


    如果你找到了一个好的密码（在字典中可以生效的），你现在就可以通过不安全的通道传输文件了。接收者在文件上运行 `decrypt crypt` 命令并输入密码——之后文件就恢复了（见图）。为了提高安全性，在发送文件之前去掉
    `.crypt` 扩展名使其更难猜测使用了哪种加密算法。


    作者：Hans-Geörg Eßer

    ```bash

    $crypt test.txt

    $decrypt test.txt

    ```

    http://crypt.sourceforge.net


