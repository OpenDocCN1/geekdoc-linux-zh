    \ – HACKED 2022\n\n63\n\n## SECURITY & PRIVACY\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_63_0.png)\n\
    \n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_63_1.png)\n\n## Install and Run Browser\n\
    \nDo you like how searching for a TV online fills web pages with ads that persist\
    \ over the next few months? If not, you may want to stop Google and other ads\
    \ from tracking you. It's not that simple: you need to switch to a free IP address\
    \ for every website you visit, block cookies, and more. Tor and Tor Browser combine\
    \ all the tricks available for secure and private browsing. The actual browser\
    \ is a free version of the Tor-enabled Firefox configured to use the Tor network.\n\
    \nInstall the tor-package via `apt install` on Debian/Ubuntu/Mint, install on\
    \ fedora, and linger in order to run the tor-command from a terminal. For the\
    \ first time, you will download the latest version of Tor-enabled Firefox for\
