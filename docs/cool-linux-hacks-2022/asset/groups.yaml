    # Obsidian：笔记记录应用


    对于喜欢拖延的人来说，Linux 是糟糕的操作系统，因为选择太多。当你做一个选择时，有太多需要学习的东西，这使得推迟到另一个选项变得更容易。在笔记记录应用方面尤其如此，因为拖延者通常也是多产者。记录笔记有很多方法，花时间精炼它们比做决定并开始使用要容易。有命令行工具、Markdown
    编辑器、像 Vim 和 Emacs org 这样的编辑器，甚至是简单的文件。这些都有优点，但没有一个可以方便地建立笔记之间的链接并创建日期。这是 Obsidian
    开发用以解决的问题，在生产力技巧的世界中它可能会非常有帮助，因为它支持其他主应用程序并且表现特别出色。


    Obsidian 是一个基于 Electron 构建的桌面应用程序。它比其他软件消耗更多资源，但它提供了良好的体验、流畅的检查、语法高亮和跨平台兼容性，拥有
    Windows、macOS 等其他平台的应用程序。要开始记录笔记，你首先需要创建一个“库（vault）”。库就像文件夹或目录，而 Obsidian 是它的绝佳示例。启动库后，Ctrl+N
    会创建一个新笔记并开始打字。笔记以 Markdown 格式编写，因此可以在没有任何编辑器的情况下作为原始文本读取，预览按钮可以让你看到它们在外部显示的样子。


    关于语法几乎不需要学习什么，除了它是围绕链接构建的。


    Obsidian 真正的天才之处在于连接。这些连接通过在库的 Markdown 链接中添加双方框来创建。如果一个页面不存在，可以通过简单的链接同时创建。通过这种方式，你可以快速记录笔记，同时在无需额外努力建立复杂的知识模型。该功能的另一个优点是图谱视图（Graph
    View）。这是可视化你的笔记的方法，每个笔记显示为一个节点，节点之间的线条说明链接。悬停在单个节点上，可以看到它的连接和关系，随着时间的推移填满屏幕。这一切都是交互式的，也是它们组织的方式，这也是使用
    Obsidian 而不是你可能感兴趣的其他笔记工具的真正理由。


    > Graham Morrison


    + 1. Markdown：你的笔记保存为 Markdown，链接它们的命令来自 SQL 数据库。

    2. 库：笔记集组织在库中，库类似于目录。每个库都是你电脑上的文件夹，方便查看笔记之间的关系。

    4. 图谱视图：突出如何悬停在笔记上查看它有哪些连接，反之亦然。\5. 编辑器：Markdown 编辑器简单、干净且高效，带有可选的输出预览。

    6. 导出：笔记可以直接发布或编译为 PDF。

    7. 帮助：帮助文档内容充实。


