    # 安全与隐私


    你可以定义规则应该应用于运行中的进程、仅应用于目标 URL，还是应用于要与之连接的域名。


    OpenSnitch 将你创建的规则以 JSON 格式保存在 `/etc/openswitch/rules` 文件中，你也可以对其进行编辑。如有必要，你可以将它们保存为
    CSV 文件，列出要连接外部主机的应用程序列表，以便使用外部应用程序处理该列表（图 2）。


    如果你不配置任何设置，窗口将在 15 秒后关闭，并且 OpenSnitch 将阻止连接。如果你觉得时间条有点短，可能想在偏好设置中延长宽限期，你可以通过应用程序顶部中间的图标访问该设置（图
    3）。


    通过通过“弹出窗口”（Pop-up）选项卡，你可以根据需求将默认设置从“拒绝”改为“允许”，设置一个更短的时间而不是默认持续时间，或者延长“始终”选项。如果你需要窗口（例如，因为窗口关闭得比你反应得要快），你可以在主窗口中编辑设置（图
    4）。


    # 防火墙开启与关闭


    在主窗口的标题栏最右侧，你会找到播放按钮，可以通过它可以开启或关闭防火墙。当你最初需要时间为全球定义规则时，这个按钮变得尤为重要。你可以使用此按钮来利用碎片方便的时间段。


    在菜单栏中，你会发现八个选项卡。每一个连接到世界的应用程序（图 5）。节点通常每个设备有一个 socket，OpenSnitch GUI 从从中获取数据进行可视化处理。该
    socket 的路径为 `/tmp/osni.sock`。


    “规则”（Rules）选项卡也列出了已创建的应用程序（图 6）。页面列出了应用程序尝试过的规则以及它们在每个主机上发生的频率。“事件”（Events）选项卡列出了尝试连接的应用程序以及这些尝试的频率。


    “地址”（Addresses）选项卡跟踪 URL 和连接频率。就已连接的主机而言同样，“用户”（Users）列表列出了涉及的用户，并记录了用户发起的连接尝试。对于其中任何一项，你都可以通过点击条目来编辑，增加弹出窗口的默认超时时间或调整其他设置。


    为了避免在面对许多个体时丢失规则，你也可以在选项卡中过滤条目。在窗口底部，你可以看到当前时间的连接数以及其中有多少个被拒绝（丢弃）。


    # 常见问题 (FAQS)


    OpenSnitch 可以管理从 Linux 系统连接到主机的任何内容。对于多用户系统，可以为每个用户定义规则。根据开发者的说法，OpenSnitch 偶尔会错过连接；GitHub
    上的项目 (7) 解释了这种现象可能的原因，在我的测试中没有遇到此类查询。FAQ [8] 回答了与应用程序框架相关的常见问题。


    一旦你创建了所有规则，OpenSnitch 就会在后台静默运行。只有当你安装了会尝试连接外部的新版程序时，才会出现通知。如果你进行了大量的连接，你可能需要需要通过检查每个进程的出站请求或每个情况下的域名来加固该应用程序的规则，然后确认或拒绝访问。


    # 结论


    虽然 OpenSnitch 起初可能很烦人，但这意味着它正在正常工作。你可以通过禁用防火墙来临时避免规则请求，然后在你方便的时候定义规则。与安装过程 [9]
    相比，开始使用 OpenSnitch 实际上非常简单。


    OpenSnitch 对于浏览器、Web 应用或第三方应用程序特别有趣。它有助于严密监控这些连接并在必要时调整规则。你将了解到某些尝试的目的是什么。


    总之，OpenSnitch 通过消除初始设置之外的担忧提升了你系统的安全性。


    图 5：“事件”选项卡实时列出所有连接。你可以在这里看到 OpenSnitch 到 IP 地址的连接尝试。


    (img/7d1dae30ead0209ad7d49c3a55d2ad_60_0.png)


