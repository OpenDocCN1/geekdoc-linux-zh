    \ to organize them. Libraries are essential if you want to save a set of MIDI\
    \ devices for values and for computer-driven archive and patch management. MIDI\
    \ devices are usually limited in their storage capacity and user-interface design,\
    \ which makes a computer-driven archive a bit complex. A system-exclusive data\
    \ dump via your hardware is a transfer of the raw internal device data as opposed\
    \ to midi data for each device, which needs to be sent back to the device to reactivate\
    \ the configuration, but you need a library if you want to save these dumps individually\
    \ and manage, categorize them.\n\nAnd the user interface works the same for each.\
    \ Data dumps, or patches, are shown in a grid, with color to differentiate patch\
