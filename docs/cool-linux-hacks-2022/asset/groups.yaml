    ## 办公室


    ## 使用 uvgrep 搜索 Office 文件


    如果你喜欢在命令行中工作，可能知道过 `grep` 工具，它允许你搜索文件中的内容。你可以使用简单的搜索模式（如单词或数字），甚至可以让工具忽略大小写并使用正则表达式，正则表达式非常强大，以至于有整本书都在讨论它们。例如，正则表达式：


    ```

    `^[0-9]{1,3}-[a-z]*--\$`

    ```


    将匹配此模式：


    ```

    12-abc-12

    9-zzzz-9

    123-aaa-12

    ```


    也就是说，该行以一个一到三位数的数字开头，后面跟着一个连字符，然后是一串小写字母（至少一个），另一个连字符，最后是开头的那个数字。正则表达式通过圆括号声明一个组并使用
    `\1` 引用它来实现反向引用。如果有更多组，可以使用 `\1`、`\2`、`\3` 等引用。


    如果你不熟悉正则表达式，O''Reilly 在他们的网站上有一个很好的交互式教程！


    ## 二进制文件的问题


    虽然 `grep` 允许搜索文件，但许多应用程序创建的二进制文件是无法“grep”的。LibreOffice 将文档存储在 ZIP 归文件中。它们通常具有
    `.odt`（文本）、`.ods`（电子表格）、`.odp`（演示文）等扩展名，这些文件都是标准的 ZIP 存档。


    图 1：你可以提取 LibreOffice 文档并检查 XML 代码。


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_13_0.png)


    你可以将此文件类型重命名为 `document.zip` 并用默认程序打开——你会发现某些压缩管理器会启动并显示文件夹结构。


    图 1 显示了你在 LibreOffice Writer (.odt) 文件内部的内容：ZIP 存档中的第一个文件是 `content.xml`。Writer
    中的标题 1 段落在内部存储时（不包含如下行）：


    ```

    <text:text:name="Heading_20_1"

    text:outline-level="1">

    Example 1

    </text>

    ```


    接下来的段落以类似的方式存储：


    ```

    <text:text:name="P1">

    这是一份显示 LibreOffice 文档文件结构的示例文档。这是一份显示 LibreOffice 文件结构的示例文档。

    </text>

    ```


    由于 XML 文件也是文件，因此可以使用 `grep` 进行搜索。这比每次搜索时都重命名文件、提取并访问内容文件要节省大量精力。


    ## 通用 grep


    我写了一个工具来自动化这一过程：`uvgrep`（意为“通用 grep”）。它可以搜索 LibreOffice 和 Microsoft Office 文件、PDF
    等。你可以从 GitHub (2) 下载它，但你还需要几个辅助程序：


    -   `llint`：用于解析和格式化 XML，这对于 LibreOffice 文件是必要的；它们倾向于包含极长的行——当你期望看到一点点上下文时，看到的却几乎是整个文档的内容。

    -   `pdfgrep`：一个用于检查 PDF 文件的独立工具。它通过一次调用即可搜索 PDF、Office 和文本文件。

    -   `llint` 和 `pdfgrep` 工具默认不安装；在 Ubuntu 上，你可以在 `libxml2-util` 包中找到 `llint`，在
    `pdf` 包中找到 `pdfgrep`。如果你还没有它们，可能也需要安装 `git` 包。


    ```bash

    sudo apt install libxml2-utils git grep

    git clone //github.com/hgesser/ugrep

    make +x ugrep

    sudo cp ugrep /usr/local/bin/

    ```


    ## 图 2：ugrep 向你展示压缩的 XML 文档。


    再次，这些是正则表达式，它们会移除 `<` 和 `>` 之间的所有字符以及前面的空格。如果你添加 `-x` 选项，`ugrep` 就会这样做。


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_14_0.png)


    '
