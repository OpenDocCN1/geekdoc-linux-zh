    ## Try the All-In-One "Tabby" Terminal Emulator


    We''re used to seeing new terminal emulators appear but not terminal emulators
    appear fully formed and ready to use. This is yet the case with the brilliantly
    named Tabby, but for the key you frequently use on the command line and because
    we presume, it''s a name not dissimilar to other established project. A good reason
    why Tabby has appeared almost fully usable from day one is because it was already
    established under the name of Terminus. Tabby hopes, as Terminus, to be a terminal
    emulator for the modern age. It offers convenience and features that your default
    terminal from the 1970s without lacking. These differences don''t make a huge
    difference on Linux, but might if you want to use the same terminal across platforms.
    Tabby can be easily installed on WSL with PowerShell, Cygwin, and Git Bash, as
    well as binary clients for Windows, macOS, and Linux. (Ubuntu users can find it
    in Repositories: Debian/Ubuntu section: add the repo, then install `tabby-terminal`).


    The next reason to use Tabby is convenience. From the first launch, there are
    very little setup required to create a functional environment. Tabby includes
    its own SSH and terminal connection managers, with SFTP and forwarding as a serial
    terminal for more conveniently hacking on devices. The main window can split and
    hold multiple sessions on tabs each side, which is great for both left- and right-handed
    people, and the tabs themselves can be nested and configured to show progress
    and notifications. There''s also a "quote mode" like, without the configuration
    and KDE. The same is also true of setting global hotkeys. You can add functionality
    with plugins and hide secrets in Tabby''s own SSH vault. Tabby might not be as
    good as a fully configured Konsole, but it''s better out of the box, especially
    on non-Linux systems.


    By Graham Morrison


    In addition to providing dozens of small functions, Tabby is easily to fit whatever
    operating environment and system you''re using.


