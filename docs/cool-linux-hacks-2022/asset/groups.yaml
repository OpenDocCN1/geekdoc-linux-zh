    # Mixxx DJ Software


    Mixxx started more than 20 years ago as an application to help DJs organize and
    play their playlists, and which has evolved into an incredible, fully fledged,
    live-performance interface for buffering and professional DJs, and radio hosts.
    You can install it at `mixxx`.


    It''s a worthy competitor to Traktor (and incompatible) Native Trackors Pro, with
    both applications using the same user-interface paradigm. Arrange or more decks
    horizontally across the main window with a bank of virtual decks and controllers
    in between. The number of controls you see here depends on the number of decks.


    A deck is akin to an old vinyl deck or turntable, you can place two or more side-by-side
    in the mixer, so you can switch between them with no delay. This configuration
    allows Mixxx, at least for the 21st century. Instead of records, the virtual decks
    load one audio file for playback, with the freedom to use dozens of decks.


    Audio files can be loaded individually, dragged, or queued as you please. This
    configuration allows you to seamlessly blend tracks from various sources, whether
    they are beat-matched or ad-libbed jingles, and edit the output as a single audio
    file or use it as the source of a mix or broadcast.


    To make transitions as seamless as possible, Mixxx is able to analyze audio files
    to detect their tempo, frequency range, and key. All of this is shown on the waveform
    as highlighted bars, frequency range as color, and all as annotation. Pitch can
    change either the key, playback speed, or both, making it incredibly easy to match
    different audio files for a more integrated mix. If you still want to exercise
    those old DJ skills, you can drag your mouse across the waveforms to scratch the
    record, producing beautifully authentic sounds. This can be done by using a real
    turntable spinning a timecode vinyl record, which can be tracked by Mixxx to accurately
    map your mapping to changes in playback speed. Everything can also be


    automated, by the many keyboard shortcuts or via MIDI automation, where every
    knob and slider can be assigned a MIDI control value for enhanced control. This
    can be scripted for even more control.


    Modern effects can be chained, together, and even isolated to certain audio busses
    or a headphone mix. You can also connect a mixer channel clear of effects so you
    can run Mixxx on horizontally across Linux. Any of this can be configured with
    Jack and your controllers. The mixer supports effects with color options for tracks,
    and outro multipread analysis and more accurate key detection, and support for
    physical deck controllers. Twenty years of development have made Mixxx to be a
    one-stop solution for playing, tracking, and DJing. It''s remarkable that this
    kind of software is made and produced under an open source license.


    > By Graham Morrison


    https://mixxx.org/


    +   1. Waveform: With two files loaded, their waveforms appear here; 2. Spectral
    analysis: Waveform colors indicate the audio''s frequency range, helping you to
    match any energy. 3. Fader: A fader may be broadcast live or recorded for quality.
    4. Fader: crossfade (by default); 5. Deck: Drag and drop audio cues; them for
    playback; and play, and rewind your audio. 6. Effects: Each deck can have its
    own effects, such as filters and delays. 7. More decks: Audio deck can be easily
    placed here or dragged into the central decks. 8. Playlist: Mixxx can scan and
    analyze all of your audio files for each project.


