    # Dig a Tunnel with shuttle


    In untrustworthy networks, I let OpenVPN tunnel my laptop. There are countless
    alternatives, and I doubt the name suggests, the tools reload on SSH. The tunnel
    is least a root access without simple software. OpenVPN is very fruitful. I need
    SSH with user privileges over the root server. Additionally, Python must be installed
    on the server- that is


    This shuttle loads and executes the required code on the server after the SSH
    connection is established. It also avoids version conflicts between server and
    client as it takes to set up the tunnel


    ```

    sudo shuttle -r <user>:<server>:port 80

    ```


    You can leave the port number if it is the SSH port 22. The 0/8 means Linux should
    direct all connections to the tunnel. However, this means cannot reach other devices
    in the local network. To keep the LAN stay visible, I define it as using the parameter
    -x


    ```

    sudo shuttle -r -d <user>:<server> 0 -x 192.168.2/24

    ```


    --is included here. This means that connections also run through the tunnel, which
    does not happen


    automatically. it is shuttle''s Achilles heel: it transports TCP, ICMP and UDP
    often do not pass through the tunnel, the apart from DNS.


    # Congestion Alert


    Whereas other VPN protocols work at packet level and on TUN/TAP, shuttle works
    at stream level. It assembles the TCP stream, multiplies over the SSH connection,
    keeping the status, and puts packets again the destination side.


    This avoids the TCP-over-TCP problem that plagues other tools such as OpenVPN:
    VPN has an overload control (congestion control). The protocol defines a limit
    based of dropped packets. If you tunnel over TCP, you lose congestion control
    for the inner connection, which can lead to bezier or patterns. Shuttle is immune
    to the problem.


    Various parameters can help you identify the troubleshoot. With the verbose option,
    shuttle is very long-wind, so I recommend redirecting the output to a file that
    can be evaluated in place. My conclusions: Shuttle is perfect for people who can
    do that without UDP and ICMP.


