    ## 运行一个简单的 HTTP 服务器：weorf


    在 Hack 46 中提到的整个工具非常适合一次性任务，但如果你想分享一个文件以上的文件，或者想保持隧道开启而无需反复重新协商关键词，那么它就不够完美了。虽然还有其他方法可以实现这一目标，但
