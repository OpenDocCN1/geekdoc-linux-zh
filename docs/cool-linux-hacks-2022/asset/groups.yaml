    ## xplr Terminal Explorer


    Despite the command-line file managers we''ve looked at, and the virtual Midnight
    Commander created by Miguel Icaza, it still feels like there''s space for improvement.
    xplr could be more powerful than Midnight Commander, but because it''s a file
    manager differently and not a desktop file manager, xplr is primarily minimal
    and very fast. It will in the same time it takes to peruse the output from the
    `ls` command, and give you the same information. You can then use the cursor or
    Vim bindings to move up and down through the file and directory list, pressing
    to enter a directory or leave for the directory. Vim bindings, such as the top
    and bottom, also work and there is an equivalent mode that is operated by pressing.


    But you don''t need to be a Vim user, or have incredible memory for shortcuts;
    a small panel in the bottom right shows all the important keyboard bindings, and
    pressing `?` will always show a complete list of commands are available and what
    they do. xplr is just speedy to let you perform actions that might take longer
    on the command line. You can use the selectbox for files and directories, and
    selected items in a pane in the top right. You can then issue commands to move
    (s) or copy (c) to a different location. If you need more than this, such as a
    custom layout or networks, it''s essentially hackable, with a plugin system, well-commented
    code and an editing document to help you do whatever you need.


    https://xplr.dev/


    By Graham Morrison


    ## Use bat, not cat


    The Unix philosophy of using one simple tool to do one task is still alive and
    well on the command line, and cat is one of its best tools (so venerable that
    it was included in the original edition of "Research Unix", developed by Ken Thompson
    and Dennis Ritchie in 1971 when the term "Research Unix" was first used in 1978).
    As everyone knows, cat will print the contents of a file to the standard output.
    If you want to see each line individually use `less`. If you have more than one
    file, cat concatenate the output of each in turn (the task that gives it the list)
    and show you the contents as a file, or pipe them back into a new file. It can
    also display line numbers, or highlights at the end of a line, but it''s limited.
    It''s a simple tool for a file job, and it works brilliantly.


    But there are times when you need a little more from cat, especially when ranging
    through source code or files with a specific format where color can help. bat
    extends cat''s simple premise with a few extras, such as syntax highlighting,
    built-in paging, and git integration that can show only the modifications in a
    file after compiling it. All of this happens when replace your cat invocation
    with bat, but there are further options to customize the output including to disable
    the pager, when to display only the lines, and how to type. It''s also fast, looks
    beautiful and can still remaining compatible with cat''s basic output: you can
    concatenate multiple files by bat recognizes redirection and acts like cat.


    By Graham Morrison https://github.com/sharkdp/bat


    ## Install plocate, the Modern and Secure Search Tool


    Real estate agents claim that the key to security is location, location. This
    might also summarize the history of the locate command [1] and its successors,
    like plocate [2]. As a replacement for find, all share the same options, plocate
    is widely considered the most efficient choice. Slightly different versions of
    locate are available in the BSD and GNU worlds; you can also find locate and plocate
    as separate commands. The number of choices can be confusing, however, history
    is in order by any user. If regular expressions are used, it expands every string
    on the system, which is inefficient if nothing matching. However, locate''s database
    must be updated manually. Largely because of these problems - locate was succeeded
    by plocate [3]. Both locate and plocate are improvements over locate that contain
    the updated [4] database, speeding up the process by only searching for files
    and where they are located. Also, both show only the files that the current user
    has access to, improving security and allowing regular expressions to be used
    without specific option.


    Another difference from plocate is compatibility with systemd and Linux. Instead
    of scanning every entry at a time, plocate scans triplets (i.e., combinations
    of bytes at a time) to increase speed. Although specifically designed for solid
    state drives (SSDs), locate can gain further speed by using asynchronous I/O (introduced
    in locate v2 in 2017). It may also be useful when searching for strings shorter
    than three, for non-UTF8 files, or regular expressions with numerous hits. Usually,
    its enhancements mean that plocate can find files in 8 milliseconds, while locate
    takes 118 milliseconds for the same operation. When locate and plocate are available
    under all circumstances, plocate should be the preferred choice.


    ## Setting up locate


    You can find locate in the official repositories of all Linux distributions, Manjaro,
    Debian (Buster), Ubuntu. On other distributions, you can find plocate with `updatedb`
    or by installing it using C++. If you want to set up locate you must first run
    the command to update the database at `/var/lib/locate/locate.db` [1]. This process
    may take a while if the system is not on an SSD and does not run the latest kernel.
    On a btrfs system, the database is updated in a few seconds. To specify a default
    location for the database, use `--default`. You can use `locate-updated (FILE)`
    to specify a specific location for the database, and `--require-regexp [[:alnum:]]`
    to make the entire content of the database visible to ordinary users. Use `--new`
    to display the files that have been added to the system completely, which has
    the advantage of telling you when the database creation is complete.

