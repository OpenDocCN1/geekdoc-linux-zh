    # # Advanced Tracing with traceroute and LFT


    Practically every admin uses the classic traceroute tool at more or less regular
    intervals. This gets me all when I found myself one day with a WiFi network where
    the admin has completely disabled ICMP. The fact that this causes more trouble
    than benefits is by definition a problem. The first version of traceroute was
    written in 1988 by Jacobson-Sen — V is his first name, not another. To be able
    to trace the path of packets through the web, Jacobson came up with a defined
    test. His method sent packets through the internet and increased the time to live
    TTL of each packet.


    The first packet assigned a TTL of one. Each router that receives the packet further
    reduces the TTL by one. When the TTL reaches a value of zero, the router sends
    back an ICMP timeout message. Successively increasing the TTL, Jacobson''s routers
    that were further and further away were able to follow the path of the packet
    until it reached destination.


    This does not work if the router suppresses ICMP messages. However, traceroute
    has evolved over the years. It has been possible using an alternative TCP-based
    method that relies on TCP packets for time. Figure one shows two ways to reach
    the destination, the same web server (bbc.co.uk). One gets stuck at some point,
    probably due to an ICMP filter. The other uses TCP packets — it gets to its destination.
    Alternate traceroute, as MTR which repeats the trace and uses it to detect packet
    loss, loses one step further. Another interesting tool is LFT (Layer Four Tracer).


    methods and makes it through firewalls. In addition, it can count the number of
    network blocks the packet is passing through, including the number of autonomous
    responsible system for it (Figure 2). On Ubuntu you can install the lft package.


    It is therefore worth taking a closer look at the different traceroutes — if only
    to keep your blood pressure down during your next hotel stay.


    > By Charles Khush


    http://https.sourceforge.net/projects/lft/


