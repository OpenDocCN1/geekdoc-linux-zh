    # Online and Offline


    As you create an account on the Lutris server, you will see details of the more
    than 13,000 games integrated in Lutris on the project''s website without detouring
    via the client. They appear in a tabular view after clicking on the Games tab,
    and this can be narrowed down using a number of different selection criteria.


    This opens a window where you can configure the game. In the Game info tab between
    Runners, the runner to be loaded, if the game was not developed for Linux. The
    selection field shows the runners activated in Lutris.


    The Settings tab in the dialog displays various configuration options as a function
    of the selected runner, and the Runners and System Settings tabs modify the parameters
    for the selected runner. You can also adjust the runner of the game in this window.


    To make all changes, close the dialog by pressing Save in the window. Any game
    integrated in this way may be used conveniently.


    Games menu of the desktop environment, if necessary. To do this, select the Create
    application shortcut or Create desktop shortcut option. In this way, the games
    can be started without having to open Lutris first.


    To remove existing starters, use the Delete shortcut and delete shortcut option
    in the context menu. The Install other version also lets you integrate one of
    the other supported variants into the system for games with more versions available.


    The Look at Lutris entry opens a web browser and the web page pointing to the
    selected game. The page provides further information about the game (see the "Online
    and Offline" box). If you want to change technical settings for the respective
    game, you can access the detailed configuration entry.


    To remove a game icon from the list after deleting it, click the hamburger menu
    top right in the window and check the box next to the list of games.


    ### Only installed games appear


    A game that previously appeared in the library may disappear, making the library
    view clearer. If, contrary to expectations, an installation fails to launch correctly,
    in many cases you will find more details in the Show logs entry in the context
    menu (Figure 4). In case of missing libraries, installing prevents the game from
    running.


    You can then install the libraries in convenience by using your distribution''s
    package manager.


    # Conclusions


    Lutris turns out to be a powerful manager for games that are not tied to any operating
    system. By integrating runners—which are emulators and run—the Lutris client enables
    access to more than 13,000 games. The selection is easy to use and configure in
    the window.


    Some functions, like creating launchers for the desktop and into environment,
    are still buggy, but this is unlikely to diminish the use of the Lutris client.
    For gamers who want to use old games or games they want to play on consoles, or
    Windows games on Linux, Lutris is a serious alternative to PlayOnLinux.


    > By Erik Bärwald


