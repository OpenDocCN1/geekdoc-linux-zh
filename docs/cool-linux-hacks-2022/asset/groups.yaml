    - 6. Effects: Surge includes some amazing effects with an unprecedented amount
    of control over how they''re applied.

    - 7. Presets: Let you save an entire sound or even for specific chains of effects.

    - 8. Modulation: Dynamically change the value of anything you can see in this.


