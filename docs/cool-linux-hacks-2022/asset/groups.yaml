    ## Surge XT Synthesizer


    We''ve looked at versions of the soft synthesizer before, simply because it''s
    been developing, and improving at an incredible pace. This is no different, with
    the project even adding the "XT" letters to it to show the significance of the
    update. The synth itself is one of the best-sounding pieces of software you can
    install, otherwise with the equally amazing Vital able to change it however you
    want. But Vital, a powerful wavetable synthesizer, is quite esoteric in both the
    ways and in the way you coax sounds out of.


    Modulation, where one signal changes the value of another is another key element
    in synthesizer design because it''s used to generate both sounds, such as with
    ring modulation effect and frequency modulation, and to change the parameters
    in the same way over time. The middle and lower parts of the main window are dedicated
    to a matrix of modulation sources and destinations, plus a variety of LFOs, sequencers,
    and envelopes.


    Almost anything can be set to change, letting you create huge patches in the same
    way you can with a modular synthesizer. But unlike, Surge is polyphonic, supports
    MIDI Poly Expression (MPE), and runs as an VST. It also features several effects
    that can be added to the sound output, which includes beautiful reverbs and delays,
    a vocoder, tape, filter, distortion, flangers, chorus, and an Nimbus effect, which
    is itself inspired by the open-source Mutable Instruments granular effect Eurorack
    module. It sounds amazing.


    Surge is just as capable, and sometimes just as complex and easier to follow.
    Surge starts in the top of the window, a small panel lets you tune three oscillators.
    The oscillators are based on the classic sawtooth, square, triangle, and sine
    shapes, but they can be warped and merged using the width, shape, and position
    in a lower panel. The slider allows you to display the new shape and off, so you
    can hear the results easily if you play your keyboard or MIDI device. The amplitude
    of each of these oscillators is mixed into the another panel with vertical sliders
    to the right of the oscillators, and includes two not sliders for "oscillator
    multiplication" to create rich and metallic textures.


    Right of these sections the filters are used to change the character on the oscillator
    sound, either by harmonizing or emphasizing them. Surge has two filters that can
    be configured in serial or parallel and in other configurations, according to
    a very adjustable filter sweep. The flow chart approach is used for frequency
    modulation, and to visualize what it is often difficult to understand and hidden
    from the user in other synths. The filters and filters themselves seem amazing,
    and there''s a large selection to choose between, including those that sound like
    the classics from Moog, ARP, and Oberheim, and modern hybrids too.


    - 1. Oscillators: The sound you generate are based on the waveforms in classic
    styles.

    - 2. Editor: Changes almost everything about an oscillator, filter, envelope,
