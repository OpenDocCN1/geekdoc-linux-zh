    # SECURITY & PRIVACY


    # HACK 43


    # Parrot OS Desktop Security


    The Parrot OS home page lists four major concerns: security, software freedom,
    a lightweight system, and cross-platform portability. These concerns, it also
    adds a few development tasks and the goal “to put newbies into good habits”. Of
    all these concerns, Parrot is well known for being security-conscious. However,
    it succeeds in all of these concerns to a degree. By making privacy and security
    parts of the standard install, Parrot is probably most successful in pushing all
    users - not just newbies - into better security habits.


    On Debian Testing, Parrot OS is a rolling release, with packages updated as soon
    as they have been tested, although official releases are periodically released
    as well. It also offers a choice of MATE or KDE Plasma as a desktop environment.
    Parrot requires 256MB of RAM, making it lightweight by modern standards and suitable
    for older systems as well as new ones. Its goal of cross-platform portability
    is seen in number of downloads available. The Home Edition is for general use
    and the Security Edition is for penetration testing and security work programming.
    Both the Home and Security Editions run in Boxes and include images for VMware
    and VirtualBox. The Security Edition includes variants for various appliances.
    It also offers a Freebox version that runs in a web browser and an ARMv7 architecture
    version. In addition, the installation images for the Home and Security Editions
    include a Live version. Installation is via the Calamares installer (Figure 3),
    one of the simplest installation methods available.


    Figure 1: The Parrot''s MATE-based desktop.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_61_0.png)


    Figure 2: The Security Edition contains dozens of scripts and apps, as shown by
    the extensive menu for penetration testing.


    # Available Applications


    Parrot OS, most notable feature is its software selection. Only a fraction of
    productivity applications are available, such as LibreOffice and Gimp, in keeping
    with the basic principle of installing the minimum software required to reduce
    the opportunities for possible attacks. Beyond these, users should install only
    the software they require. The even game menu includes a chess-game - many other
    apps, at the intellectual users that Parrot expects to attract.


    Both editions have the MATE system tools, such as BleachBit for cleaning installed
    software and GParted for disk management, but only the Security Edition includes
    a menu for starting over services. Both editions include Vim and Neovim. The Home
    Edition includes only three dedicated programming editors: Geany, the programming
    text editor; VSCode, for coding; and Z for tools for development.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_61_1.png)


