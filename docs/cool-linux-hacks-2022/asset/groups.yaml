    ## Virtualization


    Running software in a virtual machine or a container is often easier and safer
    than installing it directly on your Linux box. Here are some ideas on when and
    how to use virtualization.


    | Task | Page |

    | :--- | :--- |

    | HACK 18 Run VMs on Proxmox Server | 27 |

    | HACK 19 Use Docker Tools as Filters | 28 |

    | HACK 20 Kaboxer Auto-Loads Docker Images | 29 |

    | HACK 21 Launch Programs Inside a VirtualBox VM | 32 |

    | HACK 22 The Good Old Days: Linux from the 1990s | 32 |

    | HACK 23 Test Alternative CMs with Docker | 34 |

    | HACK 24 Run Binaries from a Different Linux Installation | 35 |


    Image © Viktoriya Sukhanova, 123RF.com


    ## Run VMs on Proxmox Server


    You may be used to creating virtual machines (VMs) in VirtualBox or VMware Player.
    These are desktop clients, which means that you run virtualization on the computer
    that you also use for your normal tasks. This approach works quite well, and it
    is easy to set the software, but there are disadvantages. If you want to use the
    guest OS on more than one computer, you will have to install everything on each
    machine. Once you''ve become accustomed to the luxuries of VMs you may find that
    you have a lot of them, and copying gets there. If you need to reboot the host,
    all VMs must be stopped (or at least suspended to disk).


    Luckily the Linux ecosystem provides alternatives. If you have a spare computer
    (or a used one such as an HP Z240, which is offered by various dealers for $150),
    you can turn it into a VM. One open source project is Proxmox Environment (VE).
    Version 7 was released in May 2022; it is based on Debian/Linux 11 and uses the
    kernel''s KVM technology (and Qemu). Proxmox supports LXC containers (similar
    to Docker). You can get the 984MB ISO file from the project website, write it
    to a USB stick or a DVD, and boot from it. The installation process will wipe
    your disks. Once you''ve finished the basic setup note that with every login the
