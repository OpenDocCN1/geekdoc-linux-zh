    虽然在绘制、文本或排列选项方面没有 Inkscape 强大，但你有足够的工具来创建完美的图表，例如分组、分层和对齐。如果你需要更多控制，可以将其保存为 SVG
    文件并在 Inkscape 中编辑。我测试过了，它运行得非常完美。


    如果你需要将文件导入 Microsoft Visio，它对 VSDX 有更好的支持。UI 仍然感觉是基于 Web 的，原生桌面小组件会更好，但这是一个重要的应用程序，并且有免费的桌面竞争对手——我想不出有任何
    Linux 工具能够生成这种质量的图表，而且没有一个具有同样强大的设计和符号库并能输出许多格式的工具。


    创建图表是花费时间的最令人兴奋的事情，这正是 draw.io 如此优秀的原因。它处理了枯燥的部分，这样你就可以花更少的时间绘图，花更多的时间转向实现（或者至少在实现上进行争论）。


    该图显示了 draw.io 如何提供：


    - 1. 符号库：从各种图表图标中拖放。

    - 2. 连接：组件可以被拖动，它们的连接保持完整。

    - 3. 样式：在画布上缩放、旋转和分组元素。

    - 4. 样式：使用颜色。

    - 5. 属性：选择你的标题样式。

    - 6. 透明度：我们可以混合你的颜色。

    - 7. 形状类别：涵盖广泛范围的形状。

    - 8. 自定义库：包含你的形状，如 GCP 或 AWS。


