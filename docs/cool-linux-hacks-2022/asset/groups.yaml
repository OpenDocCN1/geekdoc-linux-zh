    ## 安全与隐私


    ### 使用 horcux 安全拆分你的文件


    在万维网之前的时代，早期的 BBS（电子公告系统）很常见，如果你足够幸运，可以通过拨号上网访问互联网，但下载大文件是非常困难的。这有几个原因，但最重要的一点很难维持长时间连接。随着
    Usenet 的流行，将大文件拆分成较小文件（稍后可以重新重组或存储在几张软磁盘上）已成为常态。命名精妙的 horcux 是该功能的现代版本，这次专门设计用于帮助你保持文件的安全加密状态。


    horcux 是一个命令行工具，旨在提供一种不需要私钥或密码句的安全加密形式。它是通过将文件拆分为可选数量的碎片并带有一定的冗余来实现的。这种冗余允许你从一个小于总数的小文件重构原始文件。例如，你可能会将个人日记分成十份，以便只需其中几份就能重构数据。这种想法是，你可能比记住密码句更容易记住碎片，这样如果你需要访问它，至少可以找回冗余数量。位置可以是物理的，如
    USB 盘或光盘，或者是云存储或远程服务器。一个命令即可完成所有这一切，horcux 拆分，horcux 绑定，并在需要时会提示你碎片数量和冗余度。这是一个很棒的主意，希望即使这些碎片被销毁也不会产生同样的后果。


    在项目网站上，你可以找到一个包含所有 Linux 发行版静态二进制文件的存档。


    Horcux 使用 Shamir 秘密共享（SSS）对拆分的碎片进行加密。


