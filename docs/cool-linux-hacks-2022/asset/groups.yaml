    # HACK 30


    # Where Did You Mount Disk?


    If you like to extend your computer''s life by adding hard disks instead of replacing
    the old ones, you can quickly lose track of what kind of data you have. Some elementary
    tools will help you get an overview.


    The `lsblk` ("list block devices") tool shows all devices and partitions in use.
    The default view in `lsblk` includes only the devices and will find the mount
    point (the position at which the device is mounted in the directory-tree).


    The output of `lsblk` has six columns. Table 1 gives an overview of the information
    you can get from it.


    Using a switch `lsblk` reveals more devices than those that are currently in use.
    For example, it will show a series of loop devices (virtual block devices that
    are not mapped to a file for storage) like `/dev/loop0` to `/dev/loop-`.


    # Filesystems


    The `-t` switch shows which partitions exist and where mount points they are mounted
    in the filesystem.


    # Table 1: lsblk


    | NAME | Device name |

    | :--- | :--- |

    | MAJ/MIN | Main and extension of the device |

    | RM | 0 fixed and 1 removable devices (like CD/DVD drives) |

    | SIZE | Storage capacity of the device in readable format |

    | TYPE | Type of device (see Table 2) |

    | MOUNTPOINT | Directory in which the device is mounted |


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_40_0.png)


    sem, however, you do not know which options were set when mounting the partition.
    The count shows these kinds of details. Its output is quite extensive and includes
    numerous devices managed by the kernel and system programs.


    In many cases, however, the physical storage devices and partitions are of different:


    Since Linux partitions use one of "extended" filesystems (today, typically ext4
    or btrfs), the output of `lsblk` with grep, however, offers a `-t` (for --type)
    switch that you can see partitions of kernel or server filesystems.


    If you need NTFS drivers, the filesystem type will be NTFS (universal file system).
    Because NTFS provides so much information, the type of filesystem and the software
    package offers a better choice. Without other options, you can find from how the
    individual filesystems are mounted. The `find` command identifies the type of
    filesystem and the options with which it was mounted. It supports the `-t` option,
    which you can use for ext4 filesystems, see Figure 2). Unlike mount, find isn''t
    limited to a single partition but lets you search you want.


    By Frank Hoffman


    # Table 2: lsblk Device Types


    | Type | Description |

