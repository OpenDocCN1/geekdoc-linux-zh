    # Cool Linux Hacks


    **This Linux Magazine** special edition promises you “Cool Linux Hacks,” and we’ll
    certainly deliver – check the table of contents on the following page for a list
    of all the gems we present inside. But what exactly is a “hack”?


    In today''s world where Windows is the dominant desktop operating system, the
    decision to use Linux is the first and most important hack. In addition to that:


    +   - If I can use it to solve a problem or get some work done faster before,
    then it''s a hack.


    +   - If the way it works is unexpected, it''s very certainly a hack.


    +   - If it teaches me a new and interesting way to use my Linux machine, it''s
    a hack.


    +   - When it makes me grin, because it''s so obvious that only a geek Unix person
    would ever think of doing things this way, I would add it to my list of anecdotes
    and (it''s, a hack).


    The definition of a hack is a matter of taste and so is our choice of hacks for
    this collection: Many authors have contributed, and together we have assembled
    a mix of new tools, useful add-ons for classic tools, and interesting cases for
    software that you''ve used differently before. We''ve organized our hacks into
    nine categories that you''ll find them quickly when you go back to search for
    them.


    The last category is “Gaming,” because Linux is not exclusively about work; there
    are many ways in which you can have fun with your Linux machine. Playing games
    is one of them. We do, of course, hope that you will enjoy reading this issue.


    Hans-Georg Eßer

