    ## 从不同的 Linux 安装中运行二进制文件


    随着仓库以及如 Apt、Zypper、YUM/DNF 等管理工具的出现，软件安装已变得简单；现在只需选择你想要的软件包，让包管理器找出它需要的其他软件包（依赖项）并一次性安装。


    遗憾的是，并不是每个应用出现在 Linux 发行版中。例如，图片查看器是我最喜欢的工具之一，它非常简单！但它也很老了，自 1994 年以来就未出现过。它的源代码可用，但有大量的编译工作。对于某些发行版（如
    openSUSE），你可以在它们的领域内制作并提供包。对于其他（如 Ubuntu），你做不到。那么直接从 openSUSE 拷贝二进制文件到 Ubuntu
    怎么样？


    嗯，这可能会导致问题；在许多情况下，尝试运行二进制文件将产生提示缺少库的错误消息。如果你不在目标系统上搜索它们，它们可能缺失，或者安装了错误的版本。


    相反，回到源头并在那里搜索库。你可以尝试通过运行 `ldd /usr/bin/xv` 来获取列表（示例：图 1）；现在通过将该文件和 `ldd` 的整个输出作为
    zip 的参数列表来构建 zip 压缩包：


    ```

    zip xv.zip /usr/bin/xv $(ldd /usr/bin/xv)`

    ```


    这将产生许多错误信息，因为输出中有更多的名称，但这没关系：它会将它识别的所有内容打包到新的 zip 文件中。将该文件拷贝到目标机器。


    在目标机器上，为你的项目创建一个新文件夹，将二进制文件本身解包到该文件夹，并使用以下命令解压：


    ```

    unzip -j xv.zip

    ```


    unzip 中的 -j 选项将忽略路径信息，因此它会将所有文件释放到当前目录。


    图 1

    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_34_0.png)


    现在你快完成了：启动一个增量过程，将库添加到 LD_LIBRARY_PATH 变量中。要启动程序，复制当前目录中的文件并检查错误消息。如果它说缺少 lib.so，那么就是这样：你从错误的源拷贝了它。所以（以此为路径）通过设置
    LD_LIBRARY_PATH 可能会导致另一个（新的）关于某些其他文件的错误消息。例如，下一个可能是：


    ```

    LD_LIBRARY_PATH=./lib ./xv

    ```


    最后启动了。请注意文件名之间必须用逗号分隔，且值在双引号内。对于其他程序，构建命令行可能需要更长时间，如果你想用这种方法在 64 位系统上制作 32 位二进制文件，将会出现问题。至少这可以通过安装
    32 位兼容层正常解决。或者另一种方法（移动 64 位二进制文件）在技术上是不可能的。


    ## 或者使用 LD_LIBRARY_PATH？


    如果你了解 LD_LIBRARY_PATH 变量，你可以添加加载器将设置为默认文件夹的目录，然后：


    ```

    LD_LIBRARY_PATH=./lib ./xv

    ```


    > 作者 Hans-Geörg


    图 2

    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_34_1.png)


    # 保持运行


    Linux 不再说“保持运行”，由于它可以显示 CPU、内存、存储和网络统计，这对于网站所有者来说特别有用。


