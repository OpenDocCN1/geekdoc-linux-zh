    ## Read News on the news Site


    When I want to keep up with what''s happening in the world, I can check my favorite
    newspapers, or if I''m in a hurry, use news ticker. But if I don''t want to learn
    the command line to do that? I use news.tech to fill that. If you want to host
    it yourself, you can find the code and installation instructions on GitHub (1).
    You also need an API key from News API (2), which is free for developers, to register
    news.tech. News API serves as the actual data source, while news.tech acts as
    a CLI wrapper to operate and sort human-readable output.


    Figure 1: news.tech delivers up-to-date news in all languages and systems.


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_69.png)


    - NDTV Refuses permission for New Srinagar-Sharjah Flight

    - Pakistan denied use of its airspace to Srinagar-Sharjah flight operated by low-cost
    airline during Modi visit to Jammu and Kashmir last month.


    ## Listing 1: Parameterized Call


    ```bash

    $ curl en.news.tech/news?category=science

    ```


    If I run

    ```bash

    curl news.tech

    ```

    without parameters, I get the latest news from all the world without further sorting.
    This means that I have to put receiving news in languages I don''t understand
    and in writing that mean nothing to me - Hebrew, for Japanese kan (Figure 1),
    I only know the kanji characters for man and woman, which meant to avoid using
    the wrong bathroom.


    Fortunately, news.tech offers various approaches to organize this chaos. For example,
    I can filter to get only news in English or exclusively in dozens of languages.
    In addition, I can select types of news. If I want to sort by sports, I use the
    parameter category=sports. Besides sports, news.tech accepts the best entertainment,
    game, health, science, and technology categories.


    Lastly, I can limit the number of messages that I want to show me at any given
    time. This is done by the #number parameter. To see the last two messages of the
    science category from the English news stream (Figure 2), I would use the call
    from Listing 1.


