    # # Run Binaries from a Different Linux Installation


    Software installation has become simple with the advent of repositories and management
    tools like Apt, Zypper, YUM/DNF; now just pick a package you want and let the
    package manager figure out other packages (dependencies) it needs and install
    all in one go.


    Sadly, not every application appears in Linux distributions. For example, the
    image viewer is one of my favorite tools, it is easy! but it is also old and has
    not been seen since 1994. Its source code is available, but it has a lot of compiling.
    For some distributions (like openSUSE), you can make and provide packages in their
    territories. For others, like Ubuntu, you cannot. So how about just copying the
    binary file from openSUSE to an Ubuntu?


    Well, that is likely to cause problems; in many cases, attempting to run the binary
    will produce an error message saying missing libraries. If you don''t search for
    them on the target system, they might be missing, or have installed with the wrong
    version.


    Instead, go back to the source and search for the libraries there. You can try
    to get a list by running `ldd /usr/bin/xv` (for the example: Figure 1); Now build
    a zip archive by packing the same and the whole output of ldd as the argument
    list for zip:


    ```

    zip xv.zip /usr/bin/xv $(ldd /usr/bin/xv)`

    ```


    It will cause many error messages, because there are more names in the output,
    but it does not matter: it will pack everything it recognizes in the new zip file.
    Copy that one to the target machine.


    On the target machine, create a new folder for your project, unpack the binary
    itself into that folder, and unzip the file with


    ```

    unzip -j xv.zip

    ```


    The -j option in unzip will ignore the path information, so it drops all files
    in the current directory.


    Figure 1


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_34_0.png)


    Now you''re almost there: Start an incremental process with which you add libraries
    to the LD_LIBRARY_PATH variable. To launch the program copy in the current directory
    and check the error message. If it says missing libld-so.6.16, then it''s right:
    you copied it from the wrong source. So (with that as adds to path) LD_LIBRARY_PATH
    by setting


    ```

    LD_LIBRARY_PATH=./lib libld-so.6.16 ./xv

    ```


    This might lead to another (new) error message complaining about some other file.
    For the example, the next one might be


    ```

    LD_LIBRARY_PATH=./lib libld-so.6.16 ./xv

    ```


    and finally started the tool (Figure 2). Note the file names have to be separated
    by a comma, and the value is inside double quotes. For other programs, constructing
    the command line might take longer, and there are going to be problems if you
    want to use this method to make a 32-bit binary on a 64-bit system. At least that
    can be normally solved by installing the 32-bit compatibility layer. Or another
    way (moving a 64-bit binary to a 32-bit compatibility) is technically impossible.


    # ## Or LD_LIBRARY_PATH?


    If you''re aware of the LD_LIBRARY_PATH variable you can add directories with
    libraries that the loader will set to the default folders


    ```

    LD_LIBRARY_PATH=./lib ./xv

    ```


    and then


