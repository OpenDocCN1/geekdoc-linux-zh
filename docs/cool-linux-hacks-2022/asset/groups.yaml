    [Jun 08 08:28:53 2021] r8152-2.1.4:1.0-enx0e844c2de58: Promiscuous mode enabled

    [Jun 08 08:28:39 2021] dex0e0844c2de50 left to: promiscucuous mode

    ```


    How can a command be still show up in your history? Depends on how often you use
    the shell—and on the HISTORY variable that is typically set to 1000:


    ```

    $ export HISTORY=2000

    ```


    By default, the shell will remember the last 1000 command lines. If you want to
    improve your shell—just add


