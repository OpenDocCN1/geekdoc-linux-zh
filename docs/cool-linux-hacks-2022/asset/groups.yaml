    # # Plasma System Monitor


    Linux has lots of CPU, memory, storage, network, and process monitors: popular
    as "first project" for developers with a new programming language or framework;
    there''s a lot to gain from trying something new rather than relying on us or
    top.


    When first launched, this category was a well-established system monitor that
    has improved over the last years; we''re talking about KDE''s Plasma Monitor which
    uses the Umi framework. those''s effects and the team''s excellent work are the
    first things you notice: Plasma Monitor looks wonderful. Everything is drawn with
    vectors and is highly responsive, regardless of how size the window or proportion
    of the screen applications takes. It will work well on any system. On Ubuntu,
    this


    ```

    sudo apt install plasma-systemmonitor kde-plasma-desktop to install the command.

    ```


    When first launched, the default page shows three charts for memory, storage,
    and CPU usage; the window size adjusts automatically in real time with their sizes
    change. Each graphical element contains much detail within the available space
    as it can without being overwhelmed. The Applications are listed for informative:
    For example, every application running, with its CPU and RAM usage, and shows
    its coming into and out of network use read and write storage throughput.


    Other pages in the default configuration also show typical task manager information,
    including a page that lists all running processes, with the same details as the
    application view, alongside to show parent and child processes, those owned by
    users, and the ability to send any signal to listed process. There also a beautifully
    rendered histograms page for CPU, memory, and network use. Beyond the default
    settings, Plasma System Monitor is


    fully editable, allowing you to add and remove pages, create horizontal and vertical
    containers, and add any number of monitors to sense your own desktop. Here''s
    a huge list of sensors ranging from individual CPU and GPU cores to operating
    statistics, memory, and network details. All of this can be rendered with a variety
    of styles, including pie charts and histograms, with tables, lists, icons, sortable
    columns, and a desktop widget you can add to your desktop or panel.


    This is different of other KDE monitor, KsysGuard which is similar and can monitor
    everything but also harder to look at. Plasma System Monitor is more agile compared
    to it. It often can feel more like an IDE for a modern web and phone framework
    (like Home Assistant''s dashboard) or a task manager, which is precisely why System
    Monitor is good.


    +   1. **Multiple pages:** You can''t change the first few pages, but you can
    add new pages as needed. **2. Task manager:** Merge and view sensors meaning to
    monitor in different ways. **3. Edit mode:** Group sensors together and align
    them vertically or horizontally. **4. Display styles:** View sensor data in a
    histogram, a pie chart, as lines, etc. **5. Aggregate data:** Join and merge various
    sensors. **6. Widget:** A desktop and panel application lists includes CPU, memory,
    network speeds, and usage.


    > By Graham Morrison


