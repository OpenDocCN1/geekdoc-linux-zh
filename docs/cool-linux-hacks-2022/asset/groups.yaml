    # SHELL HACKS


    # HACK 56


    # Replace top with htop


    # Progress Bars for Standard Tools


    Almost since the beginning of Unix time, Unix command-lines have very little to
    show their output. The bearded wisdom is that if you can''t see any output from
    a command then nothing has gone wrong, unless the process has not started successfully.
    If you need access to status, and it is still running, this principle actually
    works well, and it would be lovely if it were adopted by modern technology. But
    it does leave you with some ambiguity over something is still running, how long
    until you can go to and turn off your PC.


    There are few commands as effective as the venerable top command This is because
    it can be run from almost anywhere that has a Linux console and gives you an immediate
    real-time overview of what processes are running; how much memory, swap, and CPU
    are consuming; and the ability to kill a process by selecting it and issuing a
    command. Except that top is as venerable as its minimalist and austere user interface
    written for 1984-era Unix that htop is a drop-replacement for this famous command.


    This is where progress helps. With many of the GNU tools that we use for everyday
    tasks—such as dd, tar, gzip/bzip, cat, and more—you simply run them alongside
    the command, either to watch the command present a general overview of core utility
    commands or after the execution of one.


    htop has features lacking in the original, and its developers optionally release
    new versions to make it adapt to features of the various kinds it supports: Besides,
    htop on macOS, FreeBSD, OpenBSD, and Solaris. Launched like top, but with shortcuts
    and arguments, the same kind of tool, most new users can continue to use this
    tool just as they would with the old one. They''ll get more reactive curses-based
    interface and overview of what''s running (see figure). Unlike top, it has driven
    menus that can be used to sort the sort mode, kill processes, and get help. There
    are other sorts, too—as shifting H+ to see threads or S for traced (which requires
    running htop as root). It''s quick, powerful and takes very few resources. If
    you haven''t switched from top to htop, now is the perfect time to do so.


    For example, you can monitor the progress of a task with archive:


    ```

    gzip /usr/tar.gz --progress $

    ```


    and let progress display the gzip percentages as the compressor completes its
    task (see figure). If you''re working with large storage devices then monitor
    the command line. The tool monitor (rsync) shows the current read/write speed.
    It''s a simple tool, but it works well and can be used in a variety of tasks,
    from monitoring a file or web server to the download status of something you''ve
    collected in Firefox.


    On Ubuntu, you will need apt to install.


    > By Graham Morrison


    https://htop.dev/


    https://github.com/xfernec/progress


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_75_0.png)


