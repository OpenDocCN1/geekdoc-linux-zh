    # # The fish shell HACK


    The default shell on Linux is Bash, but there are many.


    classical alternatives like Zsh or Fish. The fish is yet another shell, it''s
    different from all the others.


    Fish offers many powerful command-line features. For example, when you start typing
    a command, it gives suggestions for what you mean. The shell shows the letters
    you type in faded light gray, so you know what''s already there and what a suggestion
    means.


    Press the Up arrow to go back to earlier history. Or search to see which commands
    are in history with the letters you entered. If there are many entries, fish will
    only show a few of them — get all


    Ask the fish for information about an internal command via help, and it will open
    the documentation


    ```

    esser@4220 > fish -version

    fish, 2.7.1

    *pgrep (Peek at list of running processes)

    (The Perl 5 language interpreter)

    *15.26.0-64-linux

    (The Perl 5 language interpreter)

    *15.26.1

    (How to help build scripts)

    *perl (Executable, 1258)

    *perldoc

    (Perl Installation Verification Tool)

    (How to build reports on Perl)

    ```


    In a browser, looking at the list of item commands reveals interesting adventures;
    for example, the cb (command history) command shows all commands you''ve typed
    in the past and lets you move with the cursor.


    There''s a lot left to discover, and if you want to write scripts, fish has its
    own scripting language. Many distributions have fish packages in their repositories—for
    example, sudo apt install fish for Ubuntu and Mint or sudo zipper for fish in
    openUSE.


    By Hans-Corg Eer


