    # VIRTUALIZATION


    ## 23 Test Alternative CMs with Docker


    Docker is the tool for what experts call virtualization. While the technical details
    are interesting, what''s most important is that you can download and run instances
    of complex software packages in seconds.


    Read about the alternatives, but nothing helps you more with the decision than
    actually running the systems. Now setting up a CMS plus all the databases, new
    host, and most takes time. Once you decide to remove it, it is likely that pieces
    will remain and waste space on your server.


    This makes Docker interesting for all sorts of applications, and it is especially
    helpful for website owners who think about switching to a different content management
    system (CMS). If that''s you, you''re likely to—


    Instead, use Docker to test your system on the computer at home: Visit the Docker
    Hub and search for management. They give you official Docker images of WordPress,
    Maven, Joomla, Drupal, Plone, and Nuxeo. For example, if you write two lines into
    a docker-compose file stack, as described in Docker''s WordPress page and run:


    ```

    docker-compose -f stack.yml up

    ```


    get two images (one with Apache and WordPress, the other with a MySQL database)
    and a working system – just login via http://localhost:8080, choose a username/password
    combination, and you''re ready to use the WordPress post (see figure).


    By Hans-Geörg Eiß


    > https://www.docker.com/


    > https://hub.docker.com/_wordpress


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_33_0.png)


    # Shop the Shop


    # shop.linuxnewmedia.com


    # Missed an issue?


    You''re in luck.


    Most back issues are still available. Order now before they''re gone!


    shop.linuxnewmedia.com


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_33_1.png)


    # GET IT NOW!


    SAVE TIME ON DELIVERY WITH OUR ALTERNATIVE PDF EDITIONS


    ## Run Binaries from a Different Linux Installation


    Software installation has become simple with the advent of repositories and management
    tools like Apt, Zypper, YUM/DNF; now just pick a package you want and let the
    package manager figure out other packages (dependencies) it needs and install
    all in one go.


    Sadly, not every application appears in Linux distributions. For example, the
    image viewer is one of my favorite tools, it is easy! but it is also old and has
    not been seen since 1994. Its source code is available, but it has a lot of compiling.
    For some distributions (like openSUSE), you can make and provide packages in their
    territories. For others, like Ubuntu, you cannot. So how about just copying the
    binary file from openSUSE to an Ubuntu?


    Well, that is likely to cause problems; in many cases, attempting to run the binary
    will produce an error message saying missing libraries. If you don''t search for
    them on the target system, they might be missing, or have installed with the wrong
    version.


    Instead, go back to the source and search for the libraries there. You can try
    to get a list by running `ldd /usr/bin/xv` (for the example: Figure 1); Now build
    a zip archive by packing the same and the whole output of ldd as the argument
    list for zip:


    ```

    zip xv.zip /usr/bin/xv $(ldd /usr/bin/xv)`

    ```


    It will cause many error messages, because there are more names in the output,
    but it does not matter: it will pack everything it recognizes in the new zip file.
    Copy that one to the target machine.


    On the target machine, create a new folder for your project, unpack the binary
    itself into that folder, and unzip the file with:


    ```

    unzip -j xv.zip

    ```


    The -j option in unzip will ignore path information, so it drops all files in
    the current directory.


    Figure 1

    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_34_0.png)


    Now you''re almost there: Start an incremental process which you add libraries
    to the LD_LIBRARY_PATH variable. To launch the program copy in the current directory
    and check the error message. If it says missing lib.so, then it''s right: you
    copied it from the wrong source. So (with that as path) by setting LD_LIBRARY_PATH
    might lead to another (new) error message complaining about some other file. For
    the example, the next one might be:


    ```

    LD_LIBRARY_PATH=./lib ./xv

    ```


    and finally started Note the file names have to be separated by commas, and the
    value is inside double quotes. For other programs, constructing the command line
    might take longer, and there are going to be problems if you want to use this
    method to make 32-bit binary on 64-bit system. At least that can be normally solved
    by installing a 32-bit compatibility layer. Or another way (moving 64-bit binary)
    is technically impossible.


    ## Or LD_LIBRARY_PATH?


    If you''re aware of LD_LIBRARY_PATH variable you can add directories with the
    loader will set to the default folders and then:


    ```

    LD_LIBRARY_PATH=./lib ./xv

    ```


    > By Hans-Geörg


    Figure 2

    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_34_1.png)


    # Keep It Running


    Linux admins no longer say “Never change a running system,” but they definitely
    keep it running! We’ll show you hacks that help with everyday system administration.
    Repair stuff that’s broken, keep an eye on it and be prepared.


    | HACK | |

    |---|---|

    | HACK 25 | Plasma System Monitor | 37 |

    | HACK 26 | Guider Profiler and Monitor | 38 |

    | HACK 27 | Visualize dd''s Progress | 38 |

    | HACK 28 | Run dmesg with the Right Options | 39 |

    | HACK 29 | Get a Quick Machine Overview with inxi | 40 |

    | HACK 30 | Where Did You Mount That Disk? | 41 |

    | HACK 31 | System Monitoring with watch and fswatch | 42 |

    | HACK 32 | Parse the systemd journal with journalctl! | 44 |


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_35_0.png)


    ## Plasma System Monitor


    Linux has lots of CPU, memory, storage, network, and process monitors: popular
    as "first project" for developers with a new programming language or framework;
    there''s a lot to gain from trying something new than relying on us or top.


    When first launched, this category was a well-established system monitor that
    has improved over the last years; we''re talking about KDE''s Plasma Monitor which
    uses the Qt framework. Those effects and the team''s excellent work are the first
    things you notice: Plasma Monitor looks wonderful. Everything is drawn with vectors
    and is highly responsive, regardless of size the window or proportion of the screen
    applications takes. It will work well on any system. On Ubuntu, this:


    ```

    sudo apt install plasma-systemmonitor kde-plasma-desktop

    ```


    When first launched, the default page shows three charts for memory, storage,
    and CPU usage; the window size adjusts automatically in real time with their sizes
    change. Each graphical element contains much detail within the available space
    as it can without being overwhelmed. The Applications are listed for informative:
    For example, every application running, with its CPU and RAM usage, and shows
    its into and out of network use and write storage throughput.


    Other pages in the default configuration also show typical task manager information,
    including a page that lists all running processes, with the same details as the
    application view, alongside to show parent and child processes, those owned by
    users, and the ability to send any signal to listed process. There also a beautifully
    rendered histograms page for CPU, memory, and network use. Beyond the default
    settings, Plasma System Monitor is fully editable, allowing you to add and remove
    pages, create horizontal and vertical containers, and add any number of monitors
    to sense your own desktop. Here''s a huge list of sensors ranging from individual
    CPU and GPU cores to operating statistics, memory, and network details. All of
    this can be rendered with a variety of styles, including pie charts and histograms,
    with tables, lists, icons, sortable columns, and a desktop widget you can add
    to your desktop or panel.


    This is different of other KDE monitor, KsysGuard which is similar and can monitor
    everything but also harder to look at. Plasma System Monitor is more agile compared
    to it. It often can feel more like an IDE for a modern web and phone framework
    (like Home Assistant''s dashboard) or a task manager, which is precisely why System
    Monitor is good.


    - 1. **Multiple pages:** You can''t change the first few pages, but you can add
    new pages as needed.

    - 2. **Task manager:** Merge and view sensors meaning to monitor in different
    ways.

    - 3. **Edit mode:** Group sensors together and align them vertically or horizontally.

    - 4. **Display styles:** View sensor data in a histogram, a pie chart, as lines,
    etc.

    - 5. **Aggregate data:** Join and merge various sensors.

    - 6. **Widget:** A desktop and panel application lists includes CPU, memory, network
    speeds, and usage.


    > By Graham Morrison


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_36_0.png)

