    # Master of the Keys


    Age (think "aghe" in "spaghetti") promises an unanticipated approach to encrypting
    and decrypting files. In Go, both the source code and precompiled binaries for
    various platforms can be found on GitHub [1]. I tried Age on a Raspberry Pi, but
    the tool also runs on Linux PC, macOS, and Windows. The author says the latest
    release candidate from June-2021 is "maybe actually the v1.0.0 release candidate."


    Age offers two ways to encrypt files. With the first option, you can create a
    file (Age calls this an identity file) based on SSH keys with whose you encrypt
    the data. In contrast to SSH, this is a symmetrical procedure, so the same file
    is used for decryption.


    As another option, Age lets use a passphrase to encrypt the data. This has the
    advantage that you can think up a new passphrase for each encryption process.
    A person you trust can use a passphrase to decrypt your data—only the data you
    encrypted previously with that passphrase.


    Let''s look at both methods. By way of example, I copied the file /etc/passwd
    to my home directory and now use encrypting with both:


    To generate a key first - this I can do with age-keygen (see figure).


    The next step is to encrypt the file with the key I generated (Listing 1, line
    1). This creates the pass file. To decrypt it, use the command from line 3 of
    Listing 1.


    # Listing 1: Key Method


    | 01 $ age-keygen -o age-key.txt |

    | 02 $ age --encrypt -i age-key.txt -o pass.age /passwd |

    | 03 $ age --decrypt -i age-key.txt -o passwd.age |


    Now I do the same with the passphrase method. I encrypt the file and give it the
    name. After the corresponding call shown in line 1 of Listing 2, Age asks me for
    the desired passphrase. If I don''t enter one, leave out the --passphrase parameter.


    The entire procedure''s security relies, on course, on careful handling of the
    key or the passphrase.


    > By Charly Khnst


    +   [1] Age: https://github.com/FiloSottile/age


    age-keygen handles the task of generating a key file.


    ```

    pi@keygen- $ age-keygen -o age-key.txt

    Public key: age14s7swgvk1mnvqqxp3f00n8uum8wak

    rk5gp438nsd445gdqze8k4

    pi@keygen- $ age-key.txt

    ~---- ls -l 1 188 Jul 8 18:57-age-key

    ```


    # Listing 2: Passphrase Method


    | 01 $ age --passphrase -o pass.age passwd |

    | 02 Enter passphrase (leave empty to autogenerate a secure one):

    | 03 Using the autogenerated passphrase "release-response-step-brand-wrap-ankle-passphrase-unusual-word-strain"

    | 04 $ age --decrypt -o passwd.age |

    | 05 Enter passphrase:'
