    \ Manager | 19 |\n| HACK 12 | EasyNAS Is a NAS for the Masses | 20 |\n| HACK 13\
    \ | DIY Network Configuration | 23 |\n| HACK 14 | Use Network Manager's CLI |\
    \ 23 |\n| HACK 15 | Run a Simple HTTP Server: weberf | 24 |\n| HACK 16 | Use screen\
    \ in SSH Sessions | 24 |\n| HACK 17 | Dig a Tunnel with sshuttle | 25 |\n\n![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_15_0.png)\n\
    \n## Advanced Tracing with traceroute and LFT\n\nWhen you run ugrep on regular\
    \ files, the tool behaves just like grep (even though it will let you use any\
    \ options except -i for case sensitivity and -n for showing line numbers), but\
    \ it can also read Office and pdf files. Figure 2 shows what it finds when searching\
    \ the example Writer document.\n\nAlso, when working with other binary files and\
    \ how to extract text from them, you can add support for a new file type by copying\
    \ and modifying the code for LibreOffice or Microsoft Office files. Figure 3 shows\
    \ most of the current functionality of ugrep, searching various file types and\
    \ supporting XML tags.\n\n## Advanced Tracing with traceroute and LFT\n\nWhen\
    \ you run ugrep on regular files, the tool behaves just like grep (even though\
    \ it will let you use any options except -i for case sensitivity and -n for showing\
    \ line numbers), but it can also read Office and pdf files. Figure 2 shows what\
    \ it finds when searching the example Writer document.\n"
