    ## System Monitoring with fswatch


    Most users with Linux have probably used cron to schedule the running of commands.
    Both can be useful in their ways: cron for repeated events and for scheduling
    an event once. However, what both lack is the ability to gather system information
    and respond you with a simple script. It is much easier to use `watch` (1) and
    `fswatch` (2) to do these things wisely.


    Between each command is run – an interval obviously chosen for immediate troubleshooting.
    However, on a computer that is always running, setting the interval to 86,400
    would make `watch` run once a day, and to 604,800 would serve the same function
    as cron. Either a comma or a period can be used to write large intervals; the
    minimal interval is 1 second. The difference between `watch` and cron is that
    you would need to restart `watch` if the computer was shut down, which is a problem
    that either or cron do not have. For reasons that are not, the interval can be
    supplemented with `--precise (p)` to make sure that the interval is something
    that might require caution.


    ## watch


    The purpose of `watch` is to follow how a command''s output changes over time
    (Figure 1). This can be used for troubleshooting, as well as for keeping track
    of regular system items as new packages are installed or updated. In limited circumstances,
    it could also be used as a simpler replacement for grep. Several other options
    are shown in Table 1. By default, `watch` makes every five seconds unless closed
    or interrupted. The basic structure is:


    `watch` also supports options to customize output and behavior. With `--color
    (c)`, output is color-coded. With `--line (l)`, lines are truncated, with `--diff`
    highlights the latest output that differs. You can also change the header text,
    the current command, and time with `--title (t)`. Exit options are varied. With
    `--change (g)` `watch` exits when output changes, which can be an obvious and
    handy indicator. With `--error (e)`, which stops on a noise to indicate that just
    has exited with an error after an error occurs or waits until any exit key is
    pressed.


    Depending on the command''s contents, `watch` may need to be inside marks. For
    example, a command would quote itself if it is in a pipe to run or use `--exec
    (x)`. Alternatively, instead of quotes, you can run a process that is not the
    command contains multiple commands.


    Two options set to change `watch`''s behavior. The most important is `--interval
    SECONDS`. The `--interval` allows you to change the default - 2 seconds.


    ### Table 1: Everyday Uses for Watch


    | Command | Description |

    | :--- | :--- |

    | `watch -n 5` | Display the output every five seconds |

    | `watch -n 60` | Watch for every 60 seconds |

    | `watch -d -1` | Watch changes in a directory |

    | `watch -d ''1 | grep job''` | Watch files owned by the job command |

    | `watch uname -r` | Watch for installation of a new kernel |

    | `watch -d free -8` | Watch changes in spaces |


    ## fswatch


    `fswatch` monitors changes to directories or files. Ubuntu users can install it
    use the `fswatch` package. The simplest way is to use `fswatch` in time and edit
    files. As you want to use `fswatch`, you need to know how the command is structured
    and operates. `fswatch` is capable of using several different monitors. On macOS,
    it uses FSEvents, the kqueue monitor. On BSD, it uses a kernel sub-system with
    the option `-fswatch monitor`, which saves the time at which files were modified.
    All these monitors give similar information, `fswatch`''s man and into:


    ```

    echo 60.0:ls -l /watch

    total 4

    -rw--r--r-- 1 bb 136 Jan 22 13:04:22 distros.txt

    -rw--r--r-- 1 bb 0 Jan 22 13:01:53 test.txt

    ```


    Figure 1: Using watch to track changes in a directory every 60 seconds.


    ### Table 2: swatch xargs


    | Action | Command | Comments |

    | :--- | :--- | :--- |

    | Run a Bash command | `fswatch FILE-PATH` | `xargs -n 1 COMMAND` | Usually for
    creating, updating, or deleting files |

    | Watch one or more files and directories | `fswatch PATH --/*.js` | `xargs -n
    1 bash_command` | |

    | Print the absolute paths of the changed files | `fswatch PATH` | `xargs -n 1
    -I {} echo` | |

    | Filter by event | `fswatch --event DIRECTORY-PATH` | `xargs -n 1 bash_command`
    | Usually for updating, or deleting directories |


    pages that has its own strengths and weaknesses, as well as all its bugs, of which
