    # SHELL HACKS


    using plocate-build, even creating a plain text database if you choose. Either
    way, you can check that plocate is ready to use by doing a simple search (Figure
    2).


    Note, plocate includes a few options that plocate lacks. For example, plocate
    includes --statistics as well --stat (-c), a function for interacting with different
    devices, for compatibility with the BSD and GNU versions of locate. What remains
    in plocate are alone basic functions, which are more than enough for almost any
    task.


    On networks, plocate can be modified by adding multiple databases --database PATH
    (-p PATH). Multiple databases can be specified per one or in a single option with
    the names of databases separated by a colon (:). If you do not have multiple databases
    to search, these options may not be mentioned in their main pages.


    Two other options should be treated as containing regular expressions: --regexp
    (-r) which senses the performance of standard regular expressions and --regext
    (-c) because extended regular expressions are slow and return a large number of
    results, these options can also behave slowly. With one of these options, some
    special symbols in regular expressions such as, ''*'' or ''?'' are treated as
    text.


    Another option modifies a search''s results. --ignore (-i), where case sensitivity
    is overwritten, so that lowercase and uppercase letters are treated the same,
    as in the case of Unicode rules, such as German ß being the same as ss. This option
    can help in a search by returning a larger number of results, but search can also
    be extended. For instance, one option --limit NUMBER (-N) stops after the designated
    number of hints, and which moves the number of instances. On the other hand, --wildcard
    allows searches without their extensions, increases search only minimally by at
    emitting directly from directories.


    # A Command for Modern Times


    With the recent release of plocate, the locate family of commands seems set for
    the next few years. While plocate has limitations, it uses the latest technology
    and is adopted to modern computing. For example, with the current hardware, it
    no longer makes sense to settle without symbolic links--following by default can
    be done without notice-able effects.


    Even more, the rise of Linux on the desktop has increased the demand for simplicity.
    In the past, the find command became archaic because users were assumed to have
    the expertise and the patience to learn its page. Today, with lavish users, simplicity
    and efficiency are expected as the norms. In the case of searches, these expectations
    have been met by plocate, one of the increasing number of rewrites of classic
    commands that users have used for long.


    > By Bruce Byfield


