    ## 密钥大师


    Age（读作 "spaghetti" 中的 "aghe"）了一种了一种意料之外的文件加密和解密方法。在 Go 语言中，可以在 GitHub 上找到适用于各种平台的源代码和预编译的二进制文件
    [1]。我曾在树莓派上尝试过 Age，但该工具也可以运行在 Linux PC、macOS 和 Windows 上。作者表示，2021 年 6 月的最新发布候选版本“可能实际上就是
    v1.0.0 候选版本”。


    Age 提供了两种加密文件的方法。使用第一种方案，你可以根据 SSH 密钥创建一个文件（Age 将其称为身份文件），并使用该密钥来加密数据。与 SSH 不同，这是一个对称过程，因此解密时也使用同一个文件。


    作为另一种选择，Age 允许使用密码句来加密数据。这种方法的优势是，你可以为每个加密过程想出一个新密码。你信任的人可以使用该密码来解密你的数据——但仅限于你之前使用该密码加密的数据。


    让我们来看这两种方法。例如，我将 `/etc/passwd` 文件复制到我的家目录，现在分别用这两种方法进行加密：


    首先生成密钥 - 我可以通过 `age-keygen` 完成（见图）。


    下一步是使用我生成的密钥加密文件（列表 1，第 1 行）。这会创建一个密码文件。要解密它，请使用列表 1 第 3 行的命令。


    ### 列表 1：密钥方法


    | | 命令 |

    |---|---|

    | 01 | $ age-keygen -o age-key.txt |

    | 02 | $ age --encrypt -i age-key.txt -o pass.age /passwd |

    | 03 | $ age --decrypt -i age-key.txt -o passwd.age |


    现在我用密码句方法执行相同的操作。我加密文件并给它命名。在执行列表 2 第 1 行所示对应的调用后，Age 会要求我输入所需的密码。如果我不输入，请漏掉 `--passphrase`
    参数。


    当然，整个过程的安全性取决于对密钥或密码句的谨慎处理。


