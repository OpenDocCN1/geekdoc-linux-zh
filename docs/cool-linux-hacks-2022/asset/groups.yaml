    # Run Old DOS Games with DOSBox


    Many classic games have been released for MS-DOS – think of first-person shooter
    pioneers like Quark and Doom and adventure games such as the Monkey Island. Many
    of these games are available from the Internet Archive''s software library (Figure
    1), but how can you play them today?


    Of course, it''s perfectly possible to install MS-DOS or its free clone FreeDOS,
    either on a real computer or in a virtual machine. But there is a tool that can
    simplify things: DOSBox is a combined PC and DOS emulator that can map any folder
    on your Linux box to the internal :c: drive.


    As an example, let''s run Doom 2, released in 1994. First, download the Zip archive
    (Doom2.zip) from the Internet Archive. Create a Doom2 folder and extract the Zip
    file into:


    ```

    cd ~/Downloads

    mkdir Doom2; cd Doom2

    unzip doom2.zip

    ```


    Now run the DOSBox binary with the current folder (– a single dot) as an argument:
    This will make the folder accessible via the c: drive in the emulated DOS.


    ```

    dosbox

    ```


    A new window opens and boots: the familiar :> command prompt appears immediately.
    You can now explore the environment a little: ver that this DOS aims at MS-DOS
    5.0 compatibility, and will give you the DOS view of your shared folder (Figure
    2). In order to run Doom 2, enter doom2. The game (Figure 3) is playable (but
    of course only the demo levels which were available (free). If you have a copy
    of the full Doom 2 game, you can copy the WAD files to this folder. If you exit
    the emulation by closing the window (which will work even while Doom 2 or whatever
    game you are playing is active). Alternatively, leave the prompt and type the
    exit command that will save your game state, that''s the better option. If you
    want to skip entering a DOS command, you can make the game auto-start by the -c
    option and the command it will start. For the Doom 2 example:


    ```

    dosbox -c doom2

    ```


