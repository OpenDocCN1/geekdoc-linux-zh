    # HACK 13


    # NETWORKING


    Just because you can have your IP address assigned-automatically doesn''t mean
    it''s required. Good old static network configuration still works in 2021.


    Linux provides several approaches to manual network configuration. The traditional
    one is via ifconfig and route, but modern distributions don''t automatically install
    these tools anymore. Today''s alternative is using the simple tool, ip.


    The roadmap is to bring the device online, assign it an IP, then add some routes
    (at least, the default one), and configure DNS. Imagine you want to configure
    the network on the eth0 device. then use the following (as root):


    ```bash

    ip link set dev eth0

    ```


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_22_0.png)


    This brings the device "up," to the active state. Now, assign it the IPv4 address
    with:


    ```bash

    ip addr add 192.168.1.5/24 dev eth0

    ```


    It is up to you to ensure that the IP you''ve chosen conflicts with anything else
    on your network. You may also notice that you used a CIDR notation, /mask: allows
    you to assign both the IP address and the network mask in a single command. mask
    is the number of bits in the subnet mask which is equivalent to 255.255.255.224
    in ifconfig''s notation.


    The next step is adding the default route:


    ```bash

    ip route add 192.168.1.1

    ```


    You need to substitute with your gateway address, which needs to be on the same
    subnet as yours. Your final step is to tell the DNS server which to use:


    ```bash

    echo "8.8.8.8" > /etc/resolv.conf

    ```


    This will set up a DNS resolver. Replace that with your local DNS server if you
    know one. Things are tricky if you use resolvconf or a similar management framework.
    In that case, refer to the main pages.


    If you don''t want to configure your network but look up the current settings,
    use the options to show the output (see figure).


    By Valentine Sintiny


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_22_1.png)


    # Use Network Manager''s CLI


    Network Manager, the configuration tool used by a command-line tool nmcli (which
    is short for Network Manager command-line interface). It lets you query some information
    data, including available WLAN access points (see figure).


    If you''re in a new place like you''ve received a paper slip with an SSID and
    password, you can use nmcli to connect without a graphical interface. Through


    ```bash

    nmcli dev connect ssid password

    ```


    (with SSID and password, of course). You don''t need to use sudo, because the
    tool connects to a daemon that says logged in to the network when you use nmcli
    or any other program that talks to Network Manager – for some tasks it will request
    root privileges or fail when run as a regular user.


    There is a long list of subcommands (and as dev and connection) that you can use
    with nmcli. Check the main and the page nmcli-examples for many useful examples.


    https://www.projects.org/NetworkManager/


