- md: "## WORKING CODE\n\n## Count Lines of Code in Your Project\n\nAre you interested\
    \ in statistics about your coding projects? You could process your source files\
    \ with wc to get a line count, but simple tools do not know the difference between\
    \ comments and code. We suggest using something like cloc - which counts lines\
    \ of code and gives you an overview of your projects. The practical helper counts\
    \ blank lines and comments, as well as lines of code (see figure).\n\ncloc writes\
    \ the statistical analysis to the standard output. cloc parses Perl 5.6 or later.\
    \ On Ubuntu you can install the package;; on other distros use git clone. cloc\
    \ understands more than 250 programming languages. You can obtain a full list\
    \ using `cloc --show-lang`.\n\n## HACK 73\n\nYou can specify files or directories\
    \ to be counted. cloc also understands compressed tar or ZIP files; the tool can\
    \ help you when unpacking via extract. The program also tracks changes between\
    \ files, directories, and archives. Its map lists various different parameters\
    \ with examples. \n\nYou can save the results from cloc's evaluation in CSV, XML,\
    \ or YAML format, which sql-insert will generate INSERT statements for an SQL\
    \ database.\n\n```\n$esser@ps13:linux ~/local/src/utils\n$esser@ps13:linux$ cloc\n\
    \  8 files\n  8 unique files\n  00 ignored.\n```\n\n| language | files | blank\
    \ | comment |\n| --- | --- | --- | --- |\n| C | 1 | 6836 | 21548 |\n| C/C++ |\
    \ 4 | 752 | 2123 |\n| Java | 1 | 452 | 7460 |\n| SUM | 8 | 19 | 210 |\n\ngithub.com/AlDnial/cloc\
    \ v1.86 Tw0.11 (75.5 files/s, 42787.7 lines/s)\n\n> By Uwe Wahlhardt\n\n## Fix\
    \ Indentation and More\n\nA classic tool is the \"indentor,\" a program that takes\
    \ a source code and creates a new version where indentation and brace placement\
    \ follow fixed rules. One example from this family is indent. The Unix original\
    \ is from the late seventies, and on Linux the version was last updated in 1998.\n\
    \nFor a more flexible approach, have a look at uncrify; it can do more than indent,\
    \ and you configure it by writing a complex config file. The program supports\
    \ C, C++, Object, D, Java, Python, and many. To get started, there's a sample\
    \ file for uncrify in the package contents or on the web page.\n\nI found an openUSE\
    \ package and use it for all my code repositories. It's easy to check out the\
    \ changes from your current version:\n\nOnce it's installed, grab a source file\
    \ and run\n\n```\nuncrify -linux cfg testfile.c\n```\n\nThis will create a new\
    \ testfile,uncrify tried to it (automatically and perfectly formatted) with some\
    \ success, as you can see in the figure.\n\n> By Hans-Georg Eißer\n\ngit clone\
    \ https://github.com/uncrify/uncrify.git\n\nIn my test, I will build the project\
    \ with:\n\n```\ncd uncrify; make; cd build\nmake .. sudo make install\n```\n\n\
    run in the uncrify folder. (On Ubuntu, apt apt install cmake to get that particular\
    \ tool.)\n\nhttps://en.wikipedia.org/wiki/Uncrify (Unix)\nhttps://uncrify.sourceforge.org/\n\
    https://uncrify.sourceforge.org/uncrify.cfg\n\nCOOL LINUX HACKS - 2022 EDITION\n\
    \n## Hone your skills with special editions!\n\nGet to know Shell, LibreOffice,\
    \ Linux, and more from our Special Edition library.\n\nThe Linux Magazine team\
    \ has created a series of single volumes that give you a deep-dive into the topics\
    \ you want.\nAvailable in print or digital format\n\n## Check out the full library!\n\
    shop.linuxnewmedia.com\n\n## Gaming\n\nYou’ve worked for hours, configuring the\
    \ system, working on the new program, finishing that presentation? Now it's playtime.\n\
    \n| | | |\n|---|---|---|\n| HACK 75 | Run the Gamebuntu Setup Script | 89 |\n\
    | HACK 76 | SDLPoP: Prince of Persia Clone | 89 |\n| HACK 77 | Sonic Robo Blast\
    \ 2 | 90 |\n| HACK 78 | Teeworlds Multiplayer Platformer | 90 |\n| HACK 79 | Run\
    \ Old DOS Games with DOSBox | 91 |\n| HACK 80 | Crispy Doom Clone | 93 |\n| HACK\
    \ 81 | UnCiv Strategy Game | 93 |\n| HACK 82 | Space Station 14 | 94 |\n| HACK\
    \ 83 | Explore, Expand, Exterminate: Play Ruler 2 | 94 |\n| HACK 84 | Lutrs Gaming\
    \ | 95 |\n\n## GAMING\n\n## HACK 76: Run the Gamebuntu Setup Script\n\nThis is\
    \ an exciting time for Linux gamers because much is happening to make gaming on\
    \ Linux. This is of course mostly thanks to Valve, which for the release of its\
    \ Steam Deck has been astonishing, and its compatibility layer for gaming. There\
    \ are plenty of other adjustments too, and the brainchild of Raj Saraswat, 12\
    \ year old developer based in India who is also responsible for Prince of Persia\
    \ one of the best 2D platform and adventure games of all. Originally released\
    \ in 1989 on Apple II, developed by Jordan Mechner, the game was remarkable for\
    \ several reasons. The first character animations for then were all ahead of their\
    \ time. The game has an uncanny reality that was ahead of its time and became\
    \ the reason the game was success. You take place in a dungeon with 60 minutes\
    \ to escape and save. Throughout hours of play testing, the difficulty and popularity\
    \ was fine-tuned, perfectly making the quest accessible but not too easy. The\
    \ enemies and challenges in finding your way out was just enough variety and challenge\
    \ to keep you hooked, as many did.\n\nGuntu is a comprehensive Bash script that\
    \ aggregates everything related to Linux gaming. It is designed for new users\
    \ who might install something. While the original game has been released as such,\
    \ the franchise continues on modern hardware, the hard-assembled version has now\
    \ been deconstructed and reconstructed using SDL, creating POP. It is a perfect\
    \ recreation of the original game, including the graphics, sound, music and immersion.\
    \ It is also new to a generation more than 30 years old and simultaneous players\
    \ a lot of fun to play. This version includes cheats (skip level, room navigation)\
    \ and controller support, and is as modern as possible, adds to the video replay\
    \ while games, which makes it all more accessible to a younger generation or perhaps\
    \ to those of us with the same wits and agility of play.\n\nlike Ubuntu but not\
    \ know, or want to know, what else should be added to create the perfect gaming\
    \ system? The graphical front starts by showing an/or boot finder in the top of\
    \ the window. Clicking this button will automatically install a huge pile of gaming-related\
    \ software. This can take some time because what's installed and what is growing.\
    \ It includes things as much as the Proton kernel which provides the latest graphics\
    \ drivers, OBS with PulseAudio effects, and NoisTorch for microphone recording.\
    \ For gaming, Guntu adds Steam, and Heroic Launcher to access your games, and\
    \ Wine for Windows games. The front creates a launcher to access all the user-facing\
    \ parts of everything that has been installed. This may require some setup, such\
    \ as logging in to the Epic Games Store or YouTube Studio, which quickly becomes\
    \ an access to all your gaming content and is a strong reminder of just how high-quality\
    \ gaming software is available for Linux, with much more to come.\n\nBy Graham\
    \ Morrison\n\nhttps://gitlab.com/rswat09\n\n## HACK 77: Sonic Blast 2\n\nThe Hedgehog\
    \ appears often in open source game remakes. This must be because Sonic was a\
    \ marvel of 1990s console gaming, a decade that saw the second dimensions of Linux,\
    \ and is not long enough to make teenagers of that time senior developers operate\
    \ today. Sonic Blast 2 is a proof of this theory, combining not only open source\
    \ with Sonic, but also the mechanics of the era. The game itself is entirely fan-made\
    \ and has its own roots back in the late 1990s. It features over 25 levels that\
    \ are entirely created by the community and feature the same mechanic, sugar-fueled\
    \ platforming style of the originals, but with different gameplay been transported\
    \ into three dimensions. And not just the tidy polygon three dimensions of Super\
    \ Mario 64 either.\n\nThis piece of amazing fan fiction (of the gaming variety)\
    \ has been in development for almost as long as its inspiration, but it's still\
    \ getting updates.\n\n| SCORE | 0 |\n| TIME | 0-22 |\n| RINGS | 2 |\n\nIf you've\
    \ ever played the 2D version, the game will feel familiar. You get to play as\
