    ## Maestral Dropbox Client


    Dropbox 在 2007 年首次出现时是革命性的。它提供的云存储是一个新事物，而拥有一个与他人共享并与其他机器同步的目录这种便利性极具吸引力。邀请新用户增加个人存储容量的趣味化机制让许多人深陷其中。早期采用者获得了回报。


    Maestral 与 Linux 桌面环境的集成程度比我们想象的任何官方 Dropbox 云客户端都要好得多。


    整个平台充斥着相对开放的 API，众多第三方客户端之一最终提供了 Dropbox 作为 Linux 级别的工具。这种快速的进展和采纳在 2019 年受到了广泛欢迎——那一年有超过
    6800 万用户接受了我们的热情，因为大规模采用正是我们现在所精通的。


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_17_0.png)


    但 Maestral 恰好让我们重新审视对 Dropbox 的热情。它是一个非官方客户端，拥有简洁的 UI，并允许我们访问账户的公共 API。该项目最令人印象深刻的是它既有命令行工具也有
    GUI，且可以通过命令行执行所有操作。它提供了暂停和恢复、同步或启动备份的选项，还可以添加应包含或排除的文件，以及桌面通知。GUI 设计精美且易于使用。它的任务图标带有一个右键菜单，可以运行许多你熟悉的相同功能，它是你用过的最好的
    Dropbox 客户端。但关键点在于，它需要的资源非常少，且不会轻易占用 CPU，这对于即使 Dropbox 的某些竞争对手的客户端来说也做不到。在 Ubuntu
    上，通过 `pip install maestral[gui]` 安装客户端，并从 `~/.local/bin/maestral` 运行二进制文件。


    作者：Graham Morrison


    ## LANDrop 即时文件共享


    分享文件有很多方法，但 Android 和 Apple 设备上的即时（ad hoc）本地文件共享功能已非常流行。在 Linux 上实现这一功能并不容易——因为
    Linux 缺少此类功能。LANDrop 是对常规的一种耳目一新的改变。它是一个开源的即时本地文件共享工具，平等支持所有平台，包括 iOS、macOS、Windows
    和 Linux。它承诺在不放弃隐私的情况下无缝共享你的文件，通过离线连接甚至使用蜂窝数据提供服务。你不需要担心可能拦截传输的第三方，而且它在保持开源的同时完成了这一切。传输所需的所有数据直接在设备间共享，你的共享对象可见的唯一数据是文件名、日期和
    IP 地址。这些都可以关闭。


