    # Disable Webcam and Microphone


    A computer''s webcam and microphone are often abused for attacks and privacy violations.
    Thanks to modern web technology, such as HTML5 WebRTC, a browser is all it takes
    to transfer the image and sound from your living room to the web. For example,
    WebRTC can be used directly in browser (free); you can also record the webcam
    for other purposes.


    Although a browser allows the user to confirm that the website is allowed to enable
    the webcam and microphone, errors (on the part of developers, as well as users)
    occur time and again. With a locally installed application - installed voluntarily
    via


    Applications such as Cheese will no longer find a webcam on the system. If you
    need, you can reload the module (with sudo modprobe uvcvideo). You will need administrative
    privileges on the system for all of these changes.


    To prevent the Linux system from loading the kernel module responsible for the
    webcam, add a blacklist entry to a configuration file in /etc/modprobe.d/. In
    some distributions, you will find a blank file in that folder with a name (for
    example, 58-blacklist.conf on openSU). If no such file exists, simply create it.
    You are free to choose any name, such as disable-webcam.conf, and add the following
    lines to:


    +   * Webcam Disabled

    blacklist uvcvideo


    ![](img/7d1dae30e3ad0209ad7d498c3a55d2ad_64_0.png)


    After a restart, the webcam should not work, which you can test with Chrome or
    Skype. If you want to use it part, load the kernel module manually (sudo modprobe).


    # Cams with Microphone


    you might not be prompted to confirm. Apart from a small light in the bezel, there
    is nothing to indicate that the device is recording. With some devices, the program
    can even turn off the webcam LED.


    Things are a little different with a microphone built into the device. Theoretically,
    as with webcam, you need to enable the necessary kernel module, which you can
    determine quite easily by looking at a file in /proc/ hierarchy:


    ```

    $ cat /proc/modules

    0 snd_hda_intel

    1 snd_usb_audio

    2 snd_usb_audio

    3 snd_usb_audio

    ```


    With a classic desktop PC, you can simply plug in the camera and microphone to
    stop the video streaming. This solution is not available for portable systems
    with integrated hardware. Laptops and smartphones often offer slots for the webcam
    and internal microphones.


    However, switching off snd_hda_intel not only takes the microphone, but also the
    internal sound. In this case, you will need to compromise between privacy and
    perfect. If yours, you will need to connect a USB headset (even with a built-in
    microphone) - those which use the snd_usb_audio kernel module.


    Alternatively, you can disable the webcam if you no longer need it. In Linux,
    to disable the uvcvideo kernel module, which is usually loaded automatically at
    boot time. In principle, you can do this manually via


    ```

    sudo modprobe -r uvcvideo

    ```


    but very often, some program will have claimed the module so modprobe fails with
    a "module in use" error message that forces you to go for the heavy restart and
    try:


    ```

    sudo rmmod -f uvcvideo

    ```


    You can also disable the BIOS or UEFI settings to disable the devices. Working
    at the BIOS or UEFI level gives you even more security: theoretically, a blacklisted
    device can never be reversed by software running with administrative privileges.


    > By Christopher Langner


    https://webrtc.org/

    https://github.com/webrtc/apprtc


