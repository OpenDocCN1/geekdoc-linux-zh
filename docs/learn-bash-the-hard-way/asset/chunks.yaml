    到结束时，你将对变量在 `bash` 中如何工作以及一些陷阱有一个良好的概述。


    ### 这一节有多重要？


    变量是理解 `bash` 命令的基础，就像在任何编程语言中一样。


    ### 基础变量


    从创建一个变量并打印它开始。


    ```

    1 $ MYSTRING=astring

    2 $ echo $MYSTRING

    ```


    非常简单：你通过声明名称、紧接着添加等号、然后紧接着声明值创建一个变量。


    变量不需要大写，但按照惯例，它们通常是大写的。


    要获取变量中的值，你必须使用美元符号告诉 `bash` 你想要对变量进行解引用（dereference）。


    ### 变量与引号


    当你开始使用引号时，事情变得更有趣。


    引号可以将不同的“单词”分组到单个变量值中：


    ```

    3 $ MYSENTENCE=A sentence

    4 $ MYSENTENCE="A sentence"

    5 $ echo $MYSENTENCE

    ```


    由于（默认情况下）shell 通过空格分隔读取每个单词，它认为 `‘sentence’` 单词与变量赋值无关，并将其视为一个程序。为了将带有空格的句子放入变量中，你可以像上面那样将它包含在双引号中。


    当我们在引号的字符串中嵌入其他变量时，事情变得更有趣了：


    ```

    6 $ MYSENTENCE="A sentence with $MYSTRING in it"

    7 $ echo $MYSENTENCE

    8 $ MYSENTENCE=''A sentence with $MYSTRING in it''

    9 $ echo $MYSENTENCE

    ```


    如果你期望看到与上一节相似的行为，你可能会大吃一惊！这说明了阅读 shell 脚本时的一个重要点：如果变量位于双引号中，`bash` shell 会将其翻译为值，但如果位于单引号中，则不会。


    记住上一节提到的，这在通配符时不是不成立的！


    输入这些内容看看。像既往一样，在看到输出之前确保你考虑了预期的输出：


    ```

    10 $ MYGLOB=*

    11 $ echo $MYGLOB

    12 $ MYGLOB="*"

    13 $ echo "$MYGLOB"

    14 $ MYGLOB=''*''

    15 $ echo "$MYGLOB"

    16 $ echo ''$MYGLOB''

    17 $ echo $MYGLOB

    ```


    通配符在单引号或双引号中都不会展开。这不很困惑吗？


    ### Shell 变量


    某些变量是特殊的，并在 `bash` 启动时设置：


    ```

    18 $ echo $PPID

    19 $ PPID=nonsense

    20 $ echo $PPID

    ```


    *   第 18 行 - `PPID` 是由 `bash` shell 设置的特殊变量。它包含了 `bash` 父进程 ID。

    *   第 19 行 - 尝试将 `PPID` 变量设置为其他内容。

    *   第 20 行 - 再次输出 `PPID`。


    发生了什么？


    如果你想创建一个只读变量，在它前面加上 `readonly`，如下所示：


    ```

    21 $ readonly MYVAR=astring

    22 $ MYVAR=anotherstring

    ```


    ### export


    输入这些命令，并预测会发生什么：


    ```

    23 $ MYSTRING=astring

    24 $ bash

    25 $ echo $MYSTRING

    26 $ exit

    27 $ echo $MYSTRING

    28 $ unset MYSTRING

    29 $ echo $MYSTRING

    30 $ export MYSTRING=anotherstring

    31 $ bash

    32 $ echo $MYSTRING

    33 $ exit

    ```


    基于此，你认为 `export` 的作用是什么？


    你已经看到在 `bash` 终端中设置的变量以后可以使用美元符号进行引用。


    但当你设置一个变量并启动另一个进程时会发生什么？


    在这种情况下，你设置了一个变量（`‘MYSTRING’），然后启动了另一个进程。在该 `bash` shell 中，`MYSTRING` 不存在，因此报错。


