- fmt: "\nThis illustrates a subtle point about signals. They act on the *currently\
    \ running* process, and not on their children.\n\nRepeat the above section, but\
    \ rather than having:\n\n```\nsleep 999 &\nwait\n```\n\ntype:\n\n```\nsleep 999\n\
    ```\n\nWhat do you notice about the behaviour of the `EXIT` and `INT` signals?\n\
    \nHow do you explain the fact that running this:\n\n```\n37 $ ./trap_exit.sh #\
    \ HIT CTRL-c\n```\n\nworks to kill the sleep process and output ‘trapped’, where\
    \ sending the signal `-2` before did not?\n\nThe answer is that foregrounded processes\
    \ are treated differently - they form part of a ‘process group’ that gets any\
    \ signals received on the terminal.\n\nIf this seems complicated, just remember:\
    \ `CTRL-c` kills all the processes ’going on’ in the foreground of the terminal\
    \ with the `2` (or `INT`) signal, while `kill` sends a message to a specific process,\
    \ which may or may not be running at the time.\n\nIf this seems complicated, just\
    \ remember: signals can get complicated!\n\n## Cleanup\n\n```bash\n38 $ cd ..\
    \ && rm -rf lbthw_traps\n```\n\n## What You Learned\n\nIn this section you have\
    \ learned:\n\n* What a signal is\n* What a trap is\n* What the `kill` program\
    \ does, and that it doesn’t send `KILL` by default\n* What an `INT` and `TERM`\
    \ signal is\n* How to trap exiting bash processes\n* What a process group is,\
    \ and its significance for signals\n\n## What Next?\n\nNext we look at various\
    \ methods used to debug bash scripts.\n\n## Exercises\n\n1) Write a shell script\
    \ that you can’t escape from (the machine it runs on must not be overloaded as\
    \ a result!) in the terminal\n2) Try and escape from the shell script you created\
    \ in 1)\n3) Ask everyone you know if they can escape the shell script\n4) If no-one\
    \ can escape it, send it to the author :)\n5) Research the other ‘special’ signal\
    \ traps. Use `man bash` for this.\n\n## Advanced Variables\n\nYou covered simple\
    \ variables off early in this course, but there’s more to bash variables than\
    \ you learned there. In this section you will cover:\n\n* Parameter Expansion\n\
    * Associative Arrays\n\n### How Important is this Section?\n\nVariables are fundamental\
    \ to understanding bash commands, much as they are in any programming language.\
    \ This advanced section takes you through more rarely-used or known aspects of\
    \ variables. The parameter expansion section is particularly useful to know about.\n\
    \n### Parameter Expansion\n\nYou’ve alread seen that you can specify where the\
    \ variable name starts and ends using curly braces (`${}`).\n\nBash allows you\
    \ to do other things with the variable within these curly braces that affect the\
    \ variable’s interpretation by the shell.\n\nThese are called ‘parameter expansions’.\
    \ Try this sequence, and figure out what is going on.\n\n```bash\n1 $ unset A\n\
    2 $ echo ${A:=123}\n3 $ echo $A\n```\n\nYou can set the variable inline if it’s\
    \ not already set by adding a `:=` after the variable name.\n\n```bash\n4 $ unset\
    \ A\n5 $ echo ${A:-123}\n6 $ echo $A\n```\n\nWhen using the `:-` expansion, the\
    \ `A` variable is *not* set this time. All that happened is that if `A` is unset,\
    \ then `123` is substituted in its place.\n\nThis is very handy if you want to\
    \ set defaults, or ensure that a variable is set before continuing with your script.\n\
    \nSee what happens when `A` is set by experimenting on the command line. Make\
    \ sure you understand\n\n### Associative Arrays\n\nBash also supports ‘associative\
    \ arrays’.\n\nWith associative arrays, you use a string instead of a number to\
    \ reference the value:\n\n```bash\n 7 $ declare -A MYAA=([one]=1 [two]=2 [three]=3)\n\
    \ 8 $ MYAA[one]=\"1\"\n 9 $ MYAA[two]=\"2\"\n10 $ echo $MYAA\n11 $ echo ${MYAA[one]}\n\
    12 $ MYAA[one]=\"1\"\n13 $ WANT=two\n14 $ echo ${MYAA[$WANT]}\n```\n\nAs well\
    \ as not being compatible with versions less than 4.0, associative arrays are\
    \ quite fiddly to create and use, so I don’t see them very often in the wild.\n\
    \n## What You Learned\n\nIn this section you learned about slightly more advanced\
    \ aspects of bash variables.\n\nYou looked at associative arrays, which are common\
    \ in other scripting languages, but a relatively recent addition to bash (version\
    \ 4.0+), and also looked at parameter expansion, which is a useful\n\n## What\
    \ Next?\n\nNext you will look at a subject closely related to parameter expansion:\
    \ string manipulation in bash. You may be surprised at what bash is capable of.\n\
    \n## Exercises\n\n1) Search in the `man` page for ‘Parameter Expansion’ and experiment\
    \ with all the different types available.\n2) Create an associative array to map\
    \ color names to terminal escape codes for text colors. Write a script to use\
    \ the array to output text in a given color based on a command line argument.\n\
    \n## String Manipulation\n\nSince so much of working in bash is related to files\
    \ and strings of text, the ability to manipulate strings is valuable.\n\nWhile\
    \ tools such as `sed`, `awk`, `perl` (and many many others) are well worth learning,\
    \ in this section I want to show you what is possible in bash - and it may be\
    \ more than you think!\n\nIn this section you’ll cover:\n\n* How to edit strings\
    \ in bash\n* What extglobs are and how you can use them\n\n### How Important is\
    \ this Section?\n\nVariables are fundamental to understanding bash commands, much\
    \ as they are in any programming language. This advanced section takes you through\
    \ more rarely-used or known aspects of variables. The parameter expansion section\
    \ is particularly useful to know about.\n\n### String Editing\n\nThis section\
    \ is essential. String manipulation in bash is occasionally useful to do jobs.\
    \ Since so much of working in bash is related to files and strings of text, the\
    \ ability to manipulate strings is valuable.\n\nWhile tools such as `sed`, `awk`,\
    \ `perl` (and many many others) are well worth learning, in this section I want\
    \ to show you what is possible in bash - and it may be more than you think!\n\n\
    ### String Length\n\nOne of the most common requirements when working with strings\
    \ is to determine length:\n\n```bash\n1 $ A='12345678901234567890'\n2 $ echo \"\
    ${#A}\"\n3 $ echo \"$A\"\n```\n\nWhy did the second one not ‘work’?\n\nBash provides\
    \ a way to extract a substring. \n\nThis outputs everything from the third character\
    \ in the string:\n\n```bash\n4 $ echo ${A:2}\n```\n\nand this outputs two numbers\
    \ from the fourth character in the string:\n\n```bash\n5 $ echo ${A:3:2}\n```\n\
    \nso you can tell from this that the strings are 0-indexed, that is the first\
    \ character is zero, the second is one, and so on.\n\n### Search and Replace\n\
    \nYou can also search and replace within strings:\n\n```bash\n10 $ B=0000000000\n\
    11 $ echo ${B/0/1}\n```\n\nThe simple pattern replaces only the first zero with\
    \ a 1. If you want the pattern to go across all the matches in the string, then\
    \ add another slash:\n\n```bash\n12 $ echo ${B//0/1}\n```\n\nWhat’s going in the\
    \ second command? How does it differ from the first?\n\nYou can also convert lower\
    \ case to upper case and vice versa. Using a single comma will turn the starting\
    \ title case character into a lower case character:\n\n```bash\n13 $ C=AbCd\n\
    14 $ echo ${C,}\n```\n\nwhereas using two will lower-case the entire string:\n\
    \n```bash\n15 $ echo ${C,,}\n16 $ C=aAbCd\n```\n\nSimilarly, the caret character\
    \ will upper-case a string also:\n\n```bash\n17 $ echo ${C^}\n18 $ echo ${C^^}\n\
    ```\n\n### And More…\n\nThere are many more string manipulation tricks you can\
    \ use, but it is not worth trying to learn them all in one go.\n\nIf you want\
    \ to study them in more detail and find out what’s available (or ever find yourself\
    \ wondering what can be done in bash with strings) then have a look at the man\
    \ page under ‘Parameter Expansion’.\n\n### Extglobs and Removing Text\n\nA more\
    \ advanced means of working with strings is possible by using bash’s extglobs\
    \ functionality.\n[/content] (Wait, I repeated a section by accident, fixing below)\n\
    \nA more advanced means of working with strings is possible by using bash’s extglobs\
    \ functionality.\n"
  raw: "This illustrates a subtle point about signals. They act on the *currently\
    \ running* process, and not on their children.\n\nRepeat the above section, but\
    \ rather than having:\n\n```\nsleep 999 &\nwait\n```\n\ntype:\n\n```\nsleep 999\n\
    ```\n\nWhat do you notice about the behaviour of the `EXIT` and `INT` signals?\n\
    \nHow do you explain the fact that running this:\n\n```\n37 $ ./trap_exit.sh #\
    \ HIT CTRL-c\n```\n\nworks to kill the sleep process and output ‘trapped’, where\
    \ sending the signal -2 before did not?\n\nThe answer is that foregrounded processes\
    \ are treated differently - they form part of a ‘process group’ that gets any\
    \ signals received on the terminal.\n\nIf this seems complicated, just remember:\
    \ `CTRL-c` kills all the processes ’going on’ in the foreground of the terminal\
    \ with the `2` (or `INT`) signal, while `kill` sends a message to a specific process,\
    \ which may or may not be running at the time.\n\nIf this seems complicated, just\
    \ remember: signals can get complicated!\n\n#### Cleanup\n\n```\n38 $ cd .. &&\
    \ rm -rf lbthw_traps\n```\n\n#### What You Learned\n\nIn this section you have\
    \ learned:\n\n*   What a signal is\n\n*   What a trap is\n\n*   What the `kill`\
    \ program does, and that it doesn’t send `KILL` by default\n\n*   What an `INT`\
    \ and `TERM` signal is\n\n*   How to trap exiting bash processes\n\n*   What a\
    \ process group is, and its significance for signals\n\n#### What Next?\n\nNext\
    \ we look at various methods used to debug bash scripts.\n\n#### Exercises\n\n\
    1) Write a shell script that you can’t escape from (the machine it runs on must\
    \ not be overloaded as a result!) in the terminal\n\n2) Try and escape from the\
    \ shell script you created in 1)\n\n3) Ask everyone you know if they can escape\
    \ the shell script\n\n4) If no-one can escape it, send it to the author :)\n\n\
    5) Research the other ‘special’ signal traps. Use `man bash` for this.\n\n###\
    \ Advanced Variables\n\nYou covered simple variables off early in this course,\
    \ but there’s more to bash variables than you learned there. In this section you\
    \ will cover:\n\n*   Parameter Expansion\n\n*   Associative Arrays\n\n#### How\
    \ Important is this Section?\n\nVariables are fundamental to understanding bash\
    \ commands, much as they are in any programming language. This advanced section\
    \ takes you through more rarely-used or known aspects of variables. The parameter\
    \ expansion section is particularly useful to know about.\n\n#### Parameter Expansion\n\
    \nYou’ve alread seen that you can specify where the variable name starts and ends\
    \ using curly braces (`${}`).\n\nBash allows you to do other things with the variable\
    \ within these curly braces that affect the variable’s interpretation by the shell.\n\
    \nThese are called ‘parameter expansions’. Try this sequence, and figure out what\
    \ is going on.\n\n```\n1 $ unset A\n2 $ echo ${A:=123}\n3 $ echo $A\n```\n\nYou\
    \ can set the variable inline if it’s not already set by adding a `:=` after the\
    \ variable name.\n\n```\n4 $ unset A\n5 $ echo ${A:-123}\n6 $ echo $A\n```\n\n\
    When using the `:-` expansion, the ‘A’ variable is *not* set this time. All that\
    \ happened is that if `A` is unset, then `123` is substituted in its place.\n\n\
    This is very handy if you want to set defaults, or ensure that a variable is set\
    \ before continuing with your script.\n\nSee what happens when `A` is set by experimenting\
    \ on the command line. Make sure you understand\n\n#### Associative Arrays\n\n\
    Bash also supports ‘associative arrays’.\n\nWith associative arrays, you use a\
    \ string instead of a number to reference the value:\n\n```\n 7 $ declare -A MYAA=([one]=1\
    \ [two]=2 [three]=3)\n 8 $ MYAA[one]=\"1\"\n 9 $ MYAA[two]=\"2\"\n10 $ echo $MYAA\n\
    11 $ echo ${MYAA[one]}\n12 $ MYAA[one]=\"1\"\n13 $ WANT=two\n14 $ echo ${MYAA[$WANT]}\n\
    ```\n\nAs well as not being compatible with versions less than 4.0, associative\
    \ arrays are quite fiddly to create and use, so I don’t see them very often in\
    \ the wild.\n\n#### What You Learned\n\nIn this section you learned about slightly\
    \ more advanced aspects of bash variables.\n\nYou looked at associative arrays,\
    \ which are common in other scripting languages, but a relatively recent addition\
    \ to bash (version 4.0+), and also looked at parameter expansion, which is a useful\n\
    \n#### What Next?\n\nNext you will look at a subject closely related to parameter\
    \ expansion: string manipulation in bash. You may be surprised at what bash is\
    \ capable of.\n\n#### Exercises\n\n1) Search in the `man` page for ‘Parameter\
    \ Expansion’ and experiment with all the different types available.\n\n2) Create\
    \ an associative array to map color names to terminal escape codes for text colors.\
    \ Write a script to use the array to output text in a given color based on a command\
    \ line argument.\n\n### String Manipulation\n\nSince so much of working in bash\
    \ is related to files and strings of text, the ability to manipulate strings is\
    \ valuable.\n\nWhile tools such as `sed`, `awk`, `perl` (and many many others)\
    \ are well worth learning, in this section I want to show you what is possible\
    \ in bash - and it may be more than you think!\n\nIn this section you’ll cover:\n\
    \n*   How to edit strings in bash\n\n*   What extglobs are and how you can use\
    \ them\n\n*   How to avoid common quoting problems\n\n#### How Important is this\
    \ Section?\n\nThis section is not essential. String manipulation in bash is occasionally\
    \ useful to know about, but Linux offers many more well-known to do these jobs\
    \ as well.\n\nThe quoting tricks in this section are occasionally very useful,\
    \ however.\n\n#### String Length\n\nOne of the most common requirements when working\
    \ with strings is to determine length:\n\n```\n1 $ A='12345678901234567890'\n\
    2 $ echo \"${#A}\"\n3 $ echo \"$#A\"\n```\n\nWhy did the second one not ‘work’?\n\
    \n#### String Editing\n\nBash provides a way to extract a substring from a string.\
    \ The following example explains how to parse *n* characters starting from a particular\
    \ position.\n\nWork out what’s going on here. You may need to consult the manual:\n\
    \n```\n4 $ echo ${A:2}\n5 $ echo ${A:2:3}\n```\n\nYou can replace sections of\
    \ scripts using search and replace. The first part enclosed in ‘/’ signs represents\
    \ what’s searched for, and the second what is replaced:\n\n```\n6 $ echo \"${A/234/432}\"\
    \n7 $ echo \"${A//234/432}\"\n```\n\nWhat’s going on in the second command above?\
    \ How does it differ from the first?\n\n#### String Editing\n\nAnother commonly-required\
    \ string operation is getting a substring.\n\nThis outputs everything from the\
    \ third character in the string:\n\n```\n8 $ echo ${A:2}\n```\n\nand this outputs\
    \ two numbers from the fourth character in the string:\n\n```\n9 $ echo ${A:3:2}\n\
    ```\n\nso you can tell from this that the strings are 0-indexed, that is the first\
    \ character is numbered zero, the second is numbered one, and so on.\n\nYou can\
    \ also search and replace within strings:\n\n```\n10 $ B=0000000000\n11 $ echo\
    \ ${B/0/1}\n```\n\nThe simple pattern replaces only the first zero with a 1\\\
    . If you want the pattern to go across all the matches in the string, then add\
    \ another slash:\n\n```\n12 $ echo ${B//0/1}\n```\n\nYou can also convert lower\
    \ case to upper case and vice versa. Using a single comma will turn the starting\
    \ title case character into a lower case character:\n\n```\n13 $ C=AbCd\n14 $\
    \ echo ${C,}\n```\n\nwhereas using two will lower-case the entire string:\n\n\
    ```\n15 $ echo ${C,,}\n16 $ C=aAbCd\n```\n\nSimilarly, the caret character will\
    \ upper-case a string also:\n\n```\n17 $ echo ${C^}\n18 $ echo ${C^^}\n```\n\n\
    #### And More…\n\nThere are many more string manipulation tricks you can use,\
    \ but it is not worth trying to learn them all in one go.\n\nIf you want to study\
    \ them in more detail and find out what’s available (or ever find yourself wondering\
    \ what can be done in bash with strings) then have a look at the man page under\
    \ ‘Parameter Expansion’.\n\n#### Extglobs and Removing Text\n\nA more advanced\
    \ means of working with strings is possible by using bash’s extglobs functionality."
