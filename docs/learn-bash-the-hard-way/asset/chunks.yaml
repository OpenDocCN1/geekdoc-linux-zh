    ## Unpicking the Shell: Globbing and Quoting


    You may have wondered what the `*` in `bash` commands really means, and how it
    is different from regular expressions. This section will explain all, and introduce
    you to the joy of quoting in `bash`.


    In this section you will learn:


    * What globbing is

    * The special globbing characters

    * The difference between single and double quotes

    * The difference between globbing and regular expressions


    ### How Important is this Section?


    Globbing and quoting are essential topics when using `bash`. It’s rare to come
    across a set of commands or a script that doesn’t depend on knowledge of them.


    ### Globbing


    Type these commands into your terminal:


    ```

    1 $ mkdir lbthw_glob

    2 $ cd lbthw_glob

    3 $ touch file1 file2 file3

    4 $ ls *

    5 $ echo *

    ```


    * Line 1 above makes a new folder that should not exist already.

    * Line 2 moves into that folder.

    * Line 3 creates three files (`file1`, `file2`, `file3`).

    * Line 4 runs the `ls` command, which lists files, asking to list the files matching
    `*`.

    * Line 5 runs the `echo` command using `*` as the argument to `echo`.


    What you should have seen was the three files listed in both cases.


    The shell has taken your `*` character and converted it to match all the files
    in the current working directory. In other words, it’s converted the `*` character
    into the string `file1 file2 file3` and then processed the resulting command.


    ### Quoting


    What do you think will be output happen if we run these commands? Think about
    it first, make a prediction, and then type it out!


    ```

    6 $ ls ''*''

    7 $ ls "*"

    8 $ echo ''*''

    9 $ echo "*"

    ```


    * Line 6 lists files matching the `*` character in single quotes.

    * Line 7 lists files matching the `*` character in double quotes.

    * Line 8 echoes the `*` character in single quotes.

    * Line 9 echoes the `*` character in double quotes.


    This is difficult even if you are an expert in `bash`!


    Was the output what you expected? Can you explain it? Ironically it may be harder
    to explain if you have experience of quoting variables in `bash`!


    Quoting in `bash` is a very tricky topic. You may want to take from this that
    quoting globs removes their effect. But in other contexts single and double quotes
    have different meanings.


    Quoting changes the way `bash` can read the line, making it decide whether to
    take these characters and transform them into something else, or just leave them
    be.


    What you should take from this is that “quoting in bash is tricky” and be prepared
    for some head-scratching later!


    ### Other Glob Characters


    `*` is not the only globbing primitive. Other globbing primitives are:


    * `?` - matches any single character

    * `[abd]` - matches any character from `a`, `b` or `d`

    * `[a-d]` - matches any character from `a`, `b`, `c` or `d`


    Try running these commands and see if the output is what you expect:


    ```

    10 $ ls *1

    11 $ ls file[a-z]

    12 $ ls file[0-9]

    ```


    * Line 10 list all the files that end in ‘1’.

    * Line 11 list all files that start with ‘file’ and end with `a-z`.

    * Line 12 list all files that start with ‘file’ and end with `0-9`.


    ### Dotfiles


    Dotfiles are like normal files, except their name begins with a dot. Create some
    with `touch`:


    ```

    13 $ touch .file1

    14 $ mkdir .dotfolder

    15 $ touch .dotfolder/file2

    ```


    You’ve now created some dotfiles. If you run `ls`:


    ```

    16 $ ls

    ```


    those files are hidden. To see them, you can use a glob.


    The single dot folder (`.`) is a special file that represents the folder that
    you are in. For example, if you type:


    ```

    17 $ cd .

    ```


    You will go nowhere! You’ve changed directory to the same folder that you are
    in.


    The double dot folder (`..`) is another special folder that represents the parent
    folder of the one you are in. What do you think happens at the root folder (`/`)
    if you `cd ..`? Have a look and find out.


    If you re-run the last echo command with `ls`:


    ```

    18 $ ls .*

    ```


    you get a slightly more complicated output, as `ls` returns richer output depending
    on whether the item is a file or a folder.

