    ### Exit Codes and if Statements


    So far so simple, but unfortunately (and because they are useful) exit codes can
    be used for many different reasons, not just to tell you whether the command completed
    successfully or not. Just as with exit codes in HTTP, the application can use
    exit codes to indicate something went wrong, or it can return a ‘200 OK’ and give
    you a message directly.


    Try to predict the output of this:


    ```bash

    16 $ echo ''grepme'' > afile.txt

    17 $ grep not_there afile.txt

    18 $ echo $?

    ```


    Did you expect that? `grep` finished successfully (there was no segmentation or
    memory fault, it was not killed etc..) but no lines were matched, and it returned
    `1` as an exit code. So `grep` uses the exit code `0` to mean ‘matched’, and the
    exit code `1` to mean ‘not matched’.


    In one way this is great, because you can write `if` statements like this:


    ```bash

    19 $ if grep grepme afile.txt

    20 then

    21         echo ''matched!''

    22 fi

    ```


    On the other hand, it means that you cannot be sure about what an exit code might
    mean about a particular program’s termination. I have to look up the `grep` exit
    code nearly every time, and if I use a program’s exit code I make sure to do a
    few tests first to be sure I know what is going to happen!


    ### Setting Your Own Exit Code


    If you are writing a script, you can set the exit code of the function by using
    the `exit` builtin. You can simulate this simply by entering a new `bash` process
    and then exiting from it.


    ```bash

    23 $ bash

    24 $ exit 67

    25 $ echo $?

    ```


    If you are writing a function, you can set the exit code of the function by using
    the `return` builtin.


    Type this:


    ```bash

    26 $ bash

    27 $ function trycmd {

    28         $1

    29         if [[ $? -eq 127 ]]

    30         then

    31                 echo ''What are you doing?''

    32                 return 1

    33         fi

    34 }

    35 $ trycmd ls

    36 $ trycmd doesnotexit

    37 $ exit

    ```


    ### Other Special Parameters


    The variable `$?` is an example of a `special parameter`. I’m not sure why they
    are called ‘special parameters’ and not ‘special variables’, but it is perhaps
    to do with the fact that they are considered alongside the normal parameters of
    functions and scripts (`$1`, `$2` etc) as automatically assigned variables within
    these contexts.


    Two of the most important are used in the below listing. Try and figure out what
    they are from context:


    ```bash

    38 $ ps -ef | grep bash | grep $$

    39 $ sleep 999 &

    40 $ echo $!

    ```


    If you’re still stuck, have a look at the `bash` man page by running `man bash`.


