    ```

    10 $ ls *1

    11 $ ls file[a-z]

    12 $ ls file[0-9]

    ```


    * 第 10 行列出所有以“1”结尾的文件。

    * 第 11 行列出所有以“file”开头并以`a-z`结尾的文件。

    * 第 12 行列出所有以“file”开头并以`0-9`结尾的文件。


    ### 点文件 (Dotfiles)


