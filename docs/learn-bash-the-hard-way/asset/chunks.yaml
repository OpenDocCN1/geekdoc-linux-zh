  trans: "\n\n1) 在像 `GitHub` 这样的社交编程网站上找到一个大型 `bash` 脚本，并对其运行 `shellcheck`。将你发现的任何改进提交回去。\n\
    \n## 自动补全\n\n如果你已经使用 `bash` 有了一段时间，那么你可能已经熟悉了它的自动补全功能。\n\n如果不熟悉，你可能想要开始使用它！\n\n\
    在本节中，你将涵盖到：\n\n* `bash` 中自动补全是如何工作的\n* `bash` `shift` 命令\n* 使用字符串处理进行大小写转换\n\n\
    ### 这一节有多重要？\n\n在本节中，你将基于之前学过的内容进行构建：\n\n* `Bash` 数组\n* 终端转义码（escape codes）\n\
    * 内置命令（Built-ins）\n* `Bash` 函数\n* `Bash` 启动脚本\n\n以便更深入地理解一个你几乎每次使用 `bash` 时都会用到的功能。\n\
    \n## 自动补全\n\n### 补全命令\n\n如果你在默认提示符下按两次键盘上的‘Tab’键，你应该会看到类似下面的内容：\n\n```\nDisplay\
    \ all 2266 possibilities (y or n)?\n```\n\n如果你足够勇敢并按下‘y’，你将看到你的 `path` 中所有可用命令的列表。\n\
    \n要退出该列表，按‘q’。\n\n现在，如果你在一个新的 shell 命令行中输入‘z’，然后按两次‘Tab’，你可能就会立即看到以‘z’开头的可用命令。\n\
    \n这就是 `bash` 中的自动补全——默认情况下，你将获得与你目前为止输入的字母匹配的可用命令。如果你只记得命令的一部分，或者你只想看看哪些命令是以‘q’开头的（试一试！），这非常有用。\n\
    \n### 补全参数\n\n除了查找命令外，`bash` 的自动补全还可以被设置为具有上下文感知能力。一个简单的例子是，看看在新的 shell 行上输入 `ls`，然后按一个空格，再按两次‘Tab’会发生什么。你会发现，这次没有列出命令，而是其他什么内容……\n\
    \n列出本地文件是 `bash` 的一种默认行为——它假设参数很可能是文件。我接下要向你展示的是，如何让 `bash` 的自动补全更加依赖上下文，以至于你可以就你的特定程序向用户提供可用信息的建议。\n\
    \n## 一个简单程序\n\n首先，你将创建一个名为 `myecho` 的程序。在你输入它的过程中，尝试理解它在做什么。\n\n如果你不理解其中的某一行或某个命令，尝试通过在测试脚本中运行它来找出它的作用，或者尝试通过\
    \ `man bash` 查找。\n\n```\n 1 $ mkdir -p lbthw_autocomplete && cd lbthw_autocomplete\n\
    \ 2 $ cat > myecho << END\n 3 > #!/usr/bin/env bash\n 4 > function usage() {\n\
    \ 5 > \techo \"Usage: $0 [red|green|blue] [message]\"\n 6 > \texit $1\n 7 > }\n\
    \ 8 > if [ -z \"$1\" ]\n 9 > then\n10 \tusage 1\n11 > fi\n12 > typeset -l COLOR=\"\
    $1\"\n13 > shift\n14 > RED='\\033[0;31m'\n15 > GREEN='\\033[0;32m'\n16 > BLUE='\\\
    033[0;34m'\n17 > MSG=\"$@\"\n18 > COLOR=${COLOR,,}\n19 > if [[ \"${COLOR}\" =\
    \ 'red' ]]\n20 > then\n21 > \tMSG=\"${RED}${@}${RED}\"\n22 > elif [[ \"${COLOR}\"\
    \ = 'green' ]]\n23 > then\n24 > \tMSG=\"${GREEN}${@}${GREEN}\"\n25 > elif [[ \"\
    ${COLOR}\" = 'blue' ]]\n26 > then\n27 > \tMSG=\"${BLUE}${@}${BLUE}\"\n28 > else\n\
    29 > \tusage 1\n30 > fi\n31 > echo -e \"${MSG}\"\n32 > END\n```\n\n如果你仍在感到苦恼，这本书的其他章节将为你提供启示。这里唯一的新命令是\
    \ `shift`。你可能根据上下文推断出 `shift` 的作用，但以防并不显而易见，它会从你的命令行中获取第一个参数，并从传递的参数列表中删除它。这对于处理命令行参数非常有用，因为你可以不断调用\
    \ `shift` 直到所有参数处理完毕。这种循环结构在许多 `bash` 脚本中都会用到。\n\n你之前可能还没有见过变量 `$@`。尝试从 `man bash`\
    \ 页面查找它包含什么内容。\n\n如果你找不到，不要担心，它在里面并不容易找。寻找“特殊参数”（Special Parameters）部分即可。\n\n\
    如果你仍然无法弄明白，请尝试添加 `echo` 语句来弄清楚发生了什么。坚持下去。\n\n最后，你能弄出 `${COLOR,,}` 中两个逗号的作用吗？如果不能，就在命令行上玩玩它。这种“玩玩”正是你随着水平的提高而学习并内化\
    \ `bash` 知识的方式。\n\n现在你已经创建了 `myecho` 脚本，赋予它可执行权限并将其放入你的 `path` 中，然后运行它：\n\n```\n\
    33 $ chmod +x myecho\n34 $ PATH=.:${PATH}\n35 $ myecho red WARNING this is dangerous\n\
    36 $ myecho green OK good to go\n```\n\n尝试更改颜色的大小写（例如 GreeN）看看会发生什么。\n\n## 添加自动补全\n\
    \n如果你想让 `bash` 更加智能，那么你就有其他的 `COMPREPLY` 可可用。对于这个简单程序，你将为已经输入颜色的用户提供提示。\n\n```\n\
    47 $ cat > myecho << END\n48 > myecho_completion()\n49 > {\n50 >   if [ ${#COMP_WORDS[@]}\
    \ -ge 2\n51 >   then\n52 >     COMPREPLY+=(\"Input\")\n53 >     COMPREPLY+=(\"\
    message!\")\n54 >   else\n55 >     COMPREPLY+=(\"red\")\n56 >     COMPREPLY+=(\"\
    blue\")\n57 >     COMPREPLY+=(\"green\")\n58 >   fi\n59 > }\n60 > complete -F\
    \ myecho_completion myecho\n61 > END\n62 $ source myecho\n```\n\n现在如果你输入 `myecho\
    \ red`，空格后按两次‘Tab’，你应该看到行内提示。\n\n这并不是获取这种信息的优雅方式。遗憾的是，完成输出功能并不灵活。你可能想尝试通过 `echo`\
    \ 或更长的 `COMPREPLY` 条目来实现更好的方案。\n\n### 高级自动补全功能\n\n如果你想让 `bash` 更加智能，那么你就有其他的 `COMPREPLY`\
    \ 可用。\n\n```\n37 $ cat > myecho << END\n38 > myecho_completion()\n39 > {\n40 >\
    \   COMPREPLY+=(\"red\")\n41 >   COMPREPLY+=(\"blue\")\n42 >   COMPREPLY+=(\"\
    green\")\n43 > }\n44 > complete -F myecho_completion myecho\n45 > END\n46 $ source\
    \ myecho\n```\n\n现在如果你输入 `myecho`，空格后按两次‘Tab’，你应该能看到颜色。\n\n## 自动化\n\n虽然很有用，但每次想使用有自动补全脚本的特定命令时都\
    \ source 这些脚本是不现实的。\n\n因此，你可以将这些函数添加到你的 `bash` 启动脚本中（参见第一部分的“脚本与启动”），这样每当你在该机器上使用\
    \ `bash` 时它们都是可用的。\n\n## 清理\n\n清理清理，运行：\n\n```\n63 $ cd .. && rm -rf lbthw_autocomplete\n\
    ```\n\n## 你学到了什么\n\n* `bash` 中自动补全是如何工作的\n* 如何创建自己的自动补全函数\n* 如何使用 `shift` 处理 bash\
    \ 脚本和函数的参数\n* 如何更改字符串变量的大小写\n\n## 接下来做什么？\n\n为了完成这本书，你将看一个更完整的 `bash` 程序，它可以作为一个持续集成工具。\n\
    \n## 练习\n\n1) 为你经常使用的程序编写自动补全脚本。\n2) 在 `GitHub` 上寻找自动补全脚本，并在本地安装和使用它们。\n\n"
