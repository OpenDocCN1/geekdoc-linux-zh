    \n*   Binary and unary operators\n\n*   `if` statements\n\n#### How Important\
    \ is this Section?\n\nThis section is very important, as it covers material essential\
    \ to if or while statements in bash as well as writing more complex chains of\
    \ commands.\n\n#### What Are Bash Tests?\n\nTests in bash are constructs that\
    \ allow you to do *conditional expressions*. They use square brackets (ie `[`\
    \ and `]`) to enclose what is being tested.\n\nFor example, the simplest tests\
    \ might be:\n\n```\n1 $ [ 1 = 0 ]\n2 $ echo $?\n3 $ [ 1 = 1 ]\n4 $ echo $?\n```\n\
    \nThings get more interesting if you try and compare values in your tests. Think\
    \ about what this will output before typing it in:\n\n```\n 5 $ A=1\n 6 $ [ $A\
    \ = 1 ]\n 7 $ echo $?\n 8 $ [ $A = 2 ]\n 9 $ echo $?\n10 $ [ $A == 1 ]\n11 $ echo\
    \ $?\n```\n\nA single equals sign works just the same as a double equals sign.\
    \ Generally I prefer the double one so it does not get confused with variable\
    \ assignment.\n\n#### What is ‘`[`’, Really?\n\nIt is worth noting that `[` is\
    \ in fact a builtin, as well as (very often) a program. Try running:\n\n```\n\
    12 $ which [\n13 $ builtin [\n```\n\nand that `test` and `[ ... ]` are more or\
    \ less synonymous:\n\n```\n14 $ which test\n15 $ man test # Hit q to get out of\
    \ the manual page.\n16 $ man [ # Takes you to the same page.\n```\n\nThis is why\
    \ a space is required after the `[`. The `[` is a *separate command* and spacing\
    \ is how bash determines where one command ends and another begins.\n\n#### Logical\
    \ Operators\n\nWhat do you expect the output of this to be?\n\n```\n17 $ ( [ 1\
    \ = 1 ] || [ ! '0' = '0' ] ) && [ '2' = '2' ]\n18 $ echo $?\n```\n\nSimilar to\
    \ other languages, `!`; means `not`;, `||` means `or`, `&&` means `and` and items\
    \ within `()` are evaluated first.\n\nNote that to combine the binary operators\
    \ `||` and `&&` you need to have separate `[` and `]` pairs.\n\nFrom here on in\
    \ in this book I will use logical operators (particularly `&&`) where it’s appropriate\
    \ to. This should get you used to the idiom.\n\nIf you want to do everything in\
    \ *one* set of braces, you can run:\n\n```\n19 $ [  1 = 1 -o  ! '0' = '0'  -a\
    \  '2' = '2' ]\n20 $ echo $?\n```\n\nYou can use `-o` as an `or` operator within\
    \ the square brackets, `-a` for `and` and so on. But you can’t use `(` and `)`\
    \ to group within them. I have not seen these used often in the field. You can\
    \ mostly ignore them.\n\nIf you’re not confused yet, you might be soon! If you\
    \ are, try and re-read the above until you get it.\n\n#### The `[[` Operator\n\
    \nThe `[[` operator is very similar to the `test` operator with *two* square brackets\
    \ instead of one:\n\n```\n21 $ [[ 1 = 1 ]]\n22 $ echo $?\n```\n\nThis confused\
    \ me a lot for some time! What is the difference between `[` and `[[` if they\
    \ produce such similar output?\n\nThe differences between `[[` and `[` are relatively\
    \ subtle. Type these lines to see examples:\n\n```\n23 $ unset DOESNOTEXIST\n\
    24 $ [ ${DOESNOTEXIST} = '' ]\n25 $ echo $?\n26 $ [[ ${DOESNOTEXIST} = '' ]]\n\
    27 $ echo $?\n28 $ [ x${DOESNOTEXIST} = x ]\n29 $ echo $?\n```\n\nThe first command\
    \ above should error because the variable `DOESNOTEXIST`… does not exist. So bash\
    \ processes that variable in the next line, and ends up running:\n\n```\n[ = ''\
    \ ]\n```\n\nwhich makes no sense to it, so it complains! It’s expecting something\
    \ on the left hand side of the empty quotes.\n\nThe fourth command above (which\
    \ uses the double brackets `[[`) tolerates the fact that the variable does not\
    \ exist, and treats it as the empty string. It therefore resolves to:\n\n```\n\
    [ '' = '' ]\n```\n\nThe sixth command acts as a workaround. By placing an `x`\
    \ on both sides of the equation, the code ensures that *something* gets placed\
    \ on the left hand side:"
