    The first `*` character is treated as regular expressions, because it is not interpreted
    by the shell, but rather by the `rename` command. The reason it is not interpreted
    by the shell is because it is enclosed in single quotes. The last `*` is treated
    as a glob by the shell, and expands to all the files in the local directory.


    Again, the key takeaway here is that context is key.


    Note that `‘.’` has no meaning as a glob, and that some shells offer more powerful
    extended globbing capabilities. `Bash` is one of the shells that offers extended
    globbing, which we do not cover here, as it would potentially confuse the reader
    further. Just be aware that more sophisticated globbing is possible.


