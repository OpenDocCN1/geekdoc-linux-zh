    ### 3) 阅读 bash 手册章节，弄清楚在自动补全时所有的 `COMP_` 变量存储了什么。编写示例程序来使用这些变量。


    #### 示例 Bash 脚本


    为了结束本课程，我们将查看一个稍大的 bash 项目，以便在更具实践性的语文中演示在本课程中学到的技术。


