    \ state if input was wrongly made.\n\nIf this happens, kill or exit your terminal\
    \ and restart bash.\n\n#### Exercises\n\n1) Research and echo all of echo’s escape\
    \ sequences. Play with them and figure out what they do.\n\n2) Research and echo\
    \ 10 terminal escape sequences.\n\n3) Look up all the `CTRL-v` escape sequences\
    \ and experiment with them.\n\n4) Research the command `tput`, figure out what\
    \ it does and rewrite some of the above commands using it.\n\n5) Re-map your keyboard\
    \ so it outputs the wrong characters using escape codes.\n\n### The Prompt\n\n\
    Now that you’ve learned about escapes and special characters you are in a position\
    \ to understand how the prompt can be set up and controlled.\n\nYou will learn:\n\
    \n*   How to set up your prompt\n\n*   Other types of prompts and related shell\
    \ variables\n\n*   How to put more useful info in your prompt\n\n#### How Important\
    \ is this Section?\n\nThis section is not essential, but most people find it interesting\
    \ and maybe fun to learn about.\n\n#### The PS1 Variable\n\nType this:\n\n```\n\
    1 $ bash\n2 $ PS1='My super prompt>>>>   '\n3 $ ls\n4 $ exit\n```\n\nAs you’ll\
    \ remember, there are some ‘shell variables’ that are set within bash that are\
    \ used for various purposes. One of these is `PS1`, which is the prompt you see\
    \ after each command is completed.\n\n#### The PS2 Variable\n\nNow try this:\n\
    \n```\n 5 $ bash\n 6 $ PS2='I am in the middle of something!>>>  '\n 7 $ cat >\
    \ /dev/null << END\n 8 some text\n 9 END\n10 $ exit\n```\n\nThe PS2 variable is\
    \ the ‘other’ prompt that the shell uses to indicate that you are being prompted\
    \ for input to a program that is running. By default, this is set to `>` , which\
    \ is why you see that as the prompt when you normally type the `cat` command above\
    \ in.\n\n#### `PS3` and `PS4`\n\n`PS3` is used by the `select` looping structure.\
    \ We don’t cover that in this book as I’ve barely ever seen it used.\n\n`PS4`\
    \ is the last one:\n\n```\n11 $ bash\n12 $ PS4='> Value of PWD is: $PWD'\n13 $\
    \ set -x\n14 $ pwd\n15 $ cd /tmp\n16 $ ls $(pwd)\n17 $ cd -\n18 $ exit\n```\n\n\
    In ‘trace’ mode PS4 is echoed before each line of trace output. Do you remember\
    \ what trace mode is?\n\nBut why is the `>` in the output repeated? This indicates\
    \ the *level* of indirection (ie subshells) in the trace. Every time the script\
    \ goes one level ‘down’ a shell, the first character in the PS4 value is repeated.\
    \ Look at the output after the `ls $(pwd)` command.\n\n#### Pimp Your Prompt\n\
    \nFor all the PS variables mentioned above, there are special escape values that\
    \ can be used to make your prompt display interesting information.\n\nSee if you\
    \ can figure out what is going on here:\n\n```\n19 $ bash\n20 $ PS1='\\u@\\H:\\\
    w \\# \\$ '\n21 $ ls\n22 $ exit\n```\n\nThe table below may help you understand:\n\
    \n| Escape value | Meaning | Notes |\n\n| --- | --- | --- |\n\n| \\# | Command\
    \ number | The number (starting |\n\n|   |   | from 1 and incrementing |\n\n|\
    \   |   | by one) of the command |"
