  trans: "\n\n```\n[ x = 'x' ]\n```\n\n你经常会遇到这样的代码：\n\n```\n30 $ [[ \"x$DOESNOTEXIST\"\
    \ = \"x\" ]]\n```\n\n在这里，用户在两侧都加上了引号，*而且*加了一个 `x`，并使用了双括号。其实只需要其中一种保护措施，但人们习惯了像出于迷信一样在他们的\
    \ `bash` 脚本中加上这些东西。而且这似乎也没有任何害。\n\n再次强调，理解引号的工作原理对于精通 bash 至关重要！\n\n噢，`[[` 不喜欢\
