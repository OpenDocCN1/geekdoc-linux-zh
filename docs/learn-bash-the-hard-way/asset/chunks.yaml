    最后，`\C-w` 会删除光标之前的单词。


    这些是最常用的快捷键，它们在到达 `readline` 库之前就会被终端捕获。


    ## 你学到了什么


    * 什么是 `readline` 库

    * 它为你提供了哪些功能

    * 如何获取更多关于这些功能的信息

    * 终端选项和 `readline` 被考虑的顺序

    * 一些终端原生快捷键

    * 组合键在标准文档中是如何表示的


    ## 接下来做什么？


    既然你增加了对 `readline` 库工作原理以及终端程序设置的了解，你现在已经准备好应对终端代码这一棘手课题了。


    ## 清理


    你可能想要关闭当前的 bash shell（也许可以使用 `\C-d`！）并打开一个新的，因为你可能可能已经修改了上面的默认设置。


    ## 练习题


    1) 研究 `stty -e` 表格中的终端选项快捷键及其含义。

    2) 研究 `inputrc` 文件并编辑它以配置 `backward-kill-word` 的调用方式。


    ## 终端代码与非标准字符


    虽然与 bash 无直接关系，但如果你在终端上花费任何时间，那么理解终端如何处理非标准字符将是非常有益的。


    你已经学习了 `readline` 库、终端选项，以及某些按键在到达终端之前如何被“捕获”并以其他方式处理。在这里，我们来看 bash shell 是如何处理其他非标准字符的。


    非标准字符是指如制表符（tab）”、“换行符（newline）”、“回车（carriage return）”甚至是文件结束符。它们不是单词的一部分，也不一定会在屏幕上打印内容，但如果它们到达那里，就是
    shell 和终端解释的字节。


    在本节中，你将：


    * 理解如何使用 `echo` 输出任何字节

    * 理解如何在跳过终端选项和 `readline` 库的情况下输入字符

    * 学习回车和换行符及其用途

    * 学习如何使用 `hexdump`

    * 学习标准终端转义码


    ### 这一节有多重要？


    这一节的内容稍微高级，对于刚开始使用 bash 可能并非必不可。它可能难以理解，所以如果你是 bash 新手，如果第一次读时觉得很难，我建议以后再回来。


    然而，这一领域的知识将让你跃升为能够理解如何操控终端的精英，并让你能够理解你的提示符（prompt）是如何被操控的。


    ### 不打印字符


    你使用的终端可以输出所谓的“可打印”字符和“不可打印”字符。


    例如，输入像“a”这样的字符（通常）会导致终端在屏幕上添加一个“a”。但还有其他字符告诉终端执行不同的操作，这些操作并不一定涉及写入你所识别的字符。


    这一点很容易忘记，但并不是发送到计算机的内容都会直接打印到屏幕上。终端“驱动程序”获取它得到的内容（一个或多个字节）并决定如何处理它。它可能会决定打印它（如果它是“正常”字符），也可能会告诉电脑发出蜂鸣声，或者改变终端的颜色，或者删除并后退一个空格，又可能向正在运行的程序发送退出消息。


    在查看不可打印字符时，意识到几个可以帮助你理解内容的工具是有用的。其中第一个就是我们熟悉的：`echo`。


    ### 使用 echo


    你已经对 `echo` 很熟悉了，但它包含一些你尚未用过的标志：


    ```

    1 $ echo -n ''JUST THESE CHARERS''

    ```


    `-n` 标志告诉 `echo` 不要打印换行符。


    ```

    2 $ echo -n $''JUST THESE CHARERS AND A NEWLINE''

    ```


    字符串之前的 `$` 确保 bash 会将 `\n` 解释为屏幕上的换行符，而不是仅仅打印出字符。如果你不确定，尝试一下不加 `$`。在这里，反斜杠 `\`
    让 `echo` 意识到一个“特殊”字符即将到来。能够以这种方式添加换行符意味着你可以通过 `echo` 命令向终端发送换行符，而不会通过按回车键打乱行序列。


    其他特殊字符包括 `\b`（用于退格）、`\t`（用于制表符）和 `\\`（输出反斜杠）：在按下回车键之前，猜猜这会输出什么？


    ```

    3 $ echo -n $''a\bb\de\bf\b''

    ```


    如果你猜对了，那太棒了！如果你正费力理解发生了什么，请注意退格并不会删除上一个字符，它只是让光标向后移动一个空格。你还可以通过指定其十六进制值向终端发送特定的字节：


    ```

    4 $ echo -n $''x20\n''

    ```


    思考一下，你可以配合这些标志使用 `echo` 来精确控制发送到屏幕的内容。这对于调试或控制发送到终端的内容非常有价值。它还跳过了你在上一节中看到的对某些字符的“捕获”。


    ### CTRL-v 转义


    能够向屏幕输出我们所选择的任何二进制值是有用的，但如果我们只想输出一个“特殊”字符，并跳过终端通过终端选项或 `readline` 库的解释呢？例如，如果我在终端中按下“tab”，它通常会显示一个制表符（或让光标向前移动几个空格），因为
    `readline` 库使用制表键（如果连续按两次）来自动补全我们未完成的任何文本。


    但如果我正在输入这样的内容：


    ```

    5 $ echo ''I want a tab here:>Xa tab''

    ```


    我如何在“X”所在的位置得到一个“真正的”制表符？这是一种方法：不要输入“X”，而是输入 `\C-v` 然后输入 `\C-i`。如果你在 bash 提示符的终端输入这些内容，光标将按照你预期的方式跨越屏幕进行制表。


    如果你再次查看 `stty -e` 的输出（就像你在上一节做的那样），你会发现 `^V` 被绑定到了 `lnext` 操作。我相信（但不能确定）这代表“字面字符”。


    ```

    discard dsusp eol eol2 erase kill lnext

    ^O ^Y ^D <undef> <undef> ^C ^U ^V

    ```

    有很多字符是以这种方式表示的。你刚刚看到制表符（实际上垂直 TAB）表示为 `^I`，退格表示为 `^H`。你可能在下表中识别这些和其他字符：


    | 名称 | 十六进制 | C 转义 | CTRL 键 | 描述 |

    | --- | --- | --- | --- | --- |

    | BEL | 0x07 | \a | ^G | 终端 |

    | | | | | 蜂鸣 |

    | BS | 0x08 | \b | ^H | 退格 |

    | HT | 0x09 | \t | ^I | 水平 |

    | | | | | TAB |

    | LF | 0x0A | \n | ^J | 换行 |

    | VT | 0x0B | \v | ^K | 垂直 TAB |

    | FF | 0x0C | \f | ^L | 换页 |

    | CR | 0x0D | \r | ^M | 回车 |

    | | | | |  |

    | ESC | 0x1B | N/A | ^[ | 转义 |

    | | | | | 字符 |


    那么，你会如何输入这个内容，它会输出什么？


    ```

    6 $ echo abcc^Hdefg

    ```


    ## 回车符与换行符


    最常见的不可打印字符是回车。


    回车和换行符引起了许多困惑，但并不难就能理解它们的区别以及（更重要的是）为什么它们是不同的。


    如果你想象一个在纸上移动并冲出字符的老式打字机或打印机，在某些时刻它必须被告诉：“回到行的开头”。然后，在行开头时，它必须被告诉：“将纸张向上移动一行，以便我开始新的一行”。

