  trans: "\n通常在启动 `bash` 时避免所有这些启动脚本是有用的，这可以让 `bash` 保持尽可能原始的状态。在调试或测试 bash 核心功能时，这可能是无价的。\n\
    \n要实现这一点，请运行以下命令：\n\n```\n22 $ env -i bash --noprofile --norc\n```\n\n`env` 是一个处理环境的程序。`-i`\
    \ 标志的作用是从你运行的命令中移除环境变量。这意味着导出的变量将不会被我们正在运行的 `bash` 程序继承。我们带有两个标志运行 `bash` 程序本身。`--noprofile`\
    \ 标志告诉 `bash` 不要加载系统级的 bash 启动文件，而 `--norc` 告诉 `bash` 不要加载你主目录下的个人启动文件。\n\n最终的效果是你的\
    \ shell 仅有一组非常少的变量可用：\n\n```\n23 $ env\n24 $ exit\n```\n\n## 清理\n\n现在清理一下你刚才的操作：\n\
    \n```\n25 $ cd ..\n26 $ unset MYVAR\n27 $ rm -rf lbthw_scripts_and_startups\n\
    ```\n\n## 你学到了什么\n\n* 什么是 ‘shebang’\n* 如何创建和运行 shell 脚本\n* `PATH` 环境变量的意义\n* `bash`\
    \ 启动时发生了什么\n* 内置命令 `source` 的作用\n\n## 下一步是什么？\n\n干得好！你现在已经完成了课程的第一部分。\n\n你现在已经有了良好的基础来学习稍微高级的\
    \ bash 脚本编写，你将在第二部分涵盖这些内容。\n\n## 练习题\n\n1) 回顾你的 `bash` 会话所经历的所有脚本。阅读它们并尝试理解它们在做什么。如果你不理解某些部分，尝试通过阅读\
    \ `man bash` 来弄清楚发生了什么。\n\n2) 回顾图中存在于你机器上的其他文件。按照第 1 步的操作执行。\n\n# 第二部分 - 脚本化 Bash\n\
    \n在本节中，我将介绍构成 bash 脚本基础的概念和技术。这些是编写和理解实用 bash 脚本所需的底层构建模块，也是后续更高级章节的基础。\n\n我们将涵盖：\n\
    \n* 命令替换（Command substitution）\n* bash 中测试（test）的概念\n* bash 中的循环\n* 退出状态与 bash\n\
    * `set` 命令\n* 文件替换\n* 内部字段分隔符\n\n## 命令替换与评估\n\n在编写 bash 脚本时，你通常想要获取一个命令的标准输出并将其“放入”脚本中，就像你直接把它写在脚本里一样。\n\
    \n可以通过命令替换来实现。\n\n你将学习：\n\n* 什么是命令替换\n* 替换命令的不同方式\n\n### 这一节有多重要？\n\n如果你打算编写或处理\
    \ shell 脚本，这一节的内容是至关重要的。\n\n### 命令替换示例\n\n示例可以帮助说明。输入这些命令：\n\n```\n1 $ hostname\n\
    2 $ echo 'My hostname is: $(hostname)'\n3 $ echo \"My hostname is: $(hostname)\"\
    \n```\n\n如果将这些行放在脚本中，它将输出运行该脚本的主机宿机名。这可以让你的脚本变得更加动态。你可以根据命令的输出设置变量、添加调试等，就像使用任何其他编程语言一样。\n\
    \n你会注意到，如果包裹在单引号中，`$` 符号的特殊含义会被再次忽略！\n\n### 两种命令替换方法\n\n有两种方法执行命令替换：\n\n```\n\
    4 $ echo \"My hostname is: `hostname`\"\n5 $ echo \"My hostname is: $(hostname)\"\
    \n```\n\n这些方法的输出相同，反引号（backticks）的功能也相同。那么你应该用哪一个呢？\n\n#### “美元括号”法：$()`\n\n输入这些：\n\
    \n```\n 6 $ mkdir lbthw_cmdsub\n 7 $ cd lbthw_cmdsub\n 8 $ echo $(touch $(ls ..))\n\
    9 $ cd ..\n10 $ rm -rf lbthw_cmdsub\n```\n\n发生了什么？\n\n你创建了一个文件夹（第 6 行）并进入其中（第\
    \ 7 行）。\n\n下一行从最内层的括号向外读最容易。\n\n`ls ..` 命令在最内层的括号中运行。它输出了父目录的内容。\n\n该输出被替换到 `$(ls\
    \ ..)` 中。返回的“单词”被作为参数传递给 `touch` 命令。`touch` 命令根据父目录内容的列表创建一组空文件。\n\n`echo` 命令接收上述替换的输出（在这种情况下为空空，因为\
    \ `touch` 不产生任何输出）。\n\n所以，总结一下：\n\n* 该行输出了父目录的文件列表\n* 这些文件名在本地也被创建为空文件\n\n这是一个子命令如何嵌套的示例。你可以看到，嵌套非常简单——只需将一个包裹在\
    \ `$()` 中的的命令放在另一个包裹在 `$()` 内的命令内部，bash 就会按照适当的顺序从内向外为你替换每个命令的输出。\n\n#### “反引号”法\n\
    \n输入出这些内容：\n\n```\n11 $ mkdir lbthw_cmdsub\n12 $ cd lbthw_cmdsub\n13 $ echo `touch\
    \ \\`ls ..\\``\n14 $ cd ..\n```\n\n要嵌套反引号版本，你必须用反斜线对内部的反引号进行“转义”（escape），这样 bash\
    \ 才知道应该在哪个层级上解释反引号。\n\n为了说明这里的复杂性，一个简单的例子就足够：\n\n```\n15 $ echo $(echo hello1\
    \ $(echo hello2))\n16 $ echo `echo hello1 `echo hello2``\n17 $ echo `echo hello1\
    \ \\`echo hello2``\n```\n\n出于历史原因，反引号形式仍然非常流行，但我更倾向于 ‘$()' 形式，因为管理嵌套更简单。不过，如果你在查看别人的代码，你需要熟悉这两种！\n\
    \n如果你想看看事情会变得多么混乱，对比一下这两行：\n\n```\n18 $ echo `echo \\`echo \\\\\\`echo inside\\\
    \\\\\\``\n19 $ echo $(echo $(echo $(echo inside)))\n```\n\n并考虑一下哪一个更容易读（以及写）！\n\
    \n## 清理\n\n删除残留的目录：\n\n```\n20 $ rm -rf lbthw_cmdsub\n```\n\n## 你学到了什么\n\n* 什么是命令替换\n\
    * 它如何与引号相关\n* 两种命令替换方法\n* 为什么一种方法通常优于另一种\n\n## 下一步是什么？\n\n接下来你将学习退出状态（exit codes），这将增强你编写更整洁的\
    \ bash 代码和更好脚本的能力。\n\n## 练习题\n\n1) 尝试各种命令替换命令，并输入变量和引号看看发生了什么。\n\n2) 解释为什么最后一个示例需要三个反斜线。\n\
    \n## 退出状态\n\n在学习测试和特殊参数之前，一个关键且相关的概念是退出状态。\n\n我们将涵盖：\n\n* 什么是退出状态\n* 如何在脚本和函数设置它\n\
    * 退出状态规范\n* bash 中的其他“特殊”参数\n\n### 这一节有多重要？\n\n如果不理解退出状态，大多数 bash 脚本将无法完全理解或安全编写。\n\
    \n### 什么是退出状态？\n\n在你运行命令、函数或内置命令后，会设置一个特殊变量告知你该命令的结果。如果你熟悉 HTTP 状态码（如 200 或 404），这是一个类似的概念。以一个简单的示例为例，输入：\n\
    \n```\n1 $ ls\n2 $ echo $?\n3 $ doesnotexist\n4 $ echo $?\n```\n\n当该特殊设置为 ‘0’\
    \ 时，意味着命令执行成功。\n\n现在你已经学习了函数、命令以及退出状态的知识，你应该能够理解这里发生了什么：\n\n```\n 5 $ bash\n 6\
    \ $ function trycmd {\n 7         $1\n 8         if [[ $? -eq 127 ]]\n 9     \
    \    then\n10                 echo 'What are you doing?'\n11         fi\n12 }\n\
    13 $ trycmd ls\n14 $ trycmd doesnotexist\n15 $ exit\n```\n\n你可以轻松地编写测试来这样使用退出状态。\n\
    \n### 标准退出状态\n\n对于想要遵循标准，退出状态有指南。请注意并非所有程序都遵循这些标准（`grep` 是非标准程序最常见的例子，正如你将学到的样！）。\n\
    \n关键的包括：\n\n| 数字 | 含义 | 备注 |\n| --- | --- | --- |\n| 0 | OK | 命令成功运行 |\n| 1 |\
    \ 通用错误 | 当发生... |\n\n"
