    \ have also likely come across: the `kill` command.\n\nThe `kill` command is misnamed,\
    \ because it needn’t be used to terminate a process. By default, it sends the\
    \ signal 15 (`TERM`), which (similar to 2) usually has the effect of terminating\
    \ the program, but as the name suggests, is a stronger signal to terminate than\
