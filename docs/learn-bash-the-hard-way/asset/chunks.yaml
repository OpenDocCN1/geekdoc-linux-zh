    \n# 使用 `RANDOM` 变量创建一个可能在此次运行中唯一的日志文件。\nLOG_FILE=\"${BUILD_DIR}/${NAME}_build_${RANDOM}.log.txt\"\
    \nBUILD_LOG_FILE=\"${BUILD_DIR}/${NAME}_build.txt\"\n# 根据名称创建锁文件\nLOCK_FILE=\"\
    ${BUILD_DIR}/${NAME}_ci.lck\"\n\n# 创建一个通用的清理函数，以备以后需要\nfunction cleanup() {\n\
    \    rm -rf \"${BUILD_DIR}\"\n    rm -f \"${LOCK_FILE}\"\n    # 移除 /tmp 垃圾，保留\
    \ 2 天前访问过的任何内容\n    find \"${BUILD_DIR_BASE}\"/* -type d -atime +1 | rm -rf\n\
    \    echo \"cleanup done\"\n}\n\n# 捕获特定信号并运行清理\ntrap cleanup TERM INT QUIT\n\n\
    # 发送邮件函数。注意在邮件命令中使用数组 `log_file_arg`。\nfunction send_mail() {\n    msg=${1}\n\
    \    if [[ ${LOG_FILE} != \"\" ]] && [[ ${MAIL_CMD_ATTACH_FLAG} != \"\" ]]; then\n\
    \        log_file_arg=(${MAIL_CMD_ATTACH_FLAG} ${LOG_FILE})\n    fi\n    if [[\
    \ ${EMAIL} != \"\" ]] && [[ ${MAIL_CMD} != \"\" ]]; then\n        echo \"${msg}\"\
    \ | ${MAIL_CMD} \"${MAIL_CMD_SUBJECT_FLAG}\" \"${msg}\" \"${log_file_arg[@]}\"\
    \ \"${MAIL_CMD_RECIPIENTS_FLAG}\" \"${EMAIL}\"\n    else\n        echo \"${msg}\"\
    \n    fi\n}\n\n# 将日期输出到日志文件。\ndate 2>&1 | tee -a \"${BUILD_LOG_FILE}\"\n\n使用 `-a`\
    \ 测试判断此 ci 是否正在运行。\nif [[ -a ${LOCK_FILE} ]]; then\n    echo \"Already running\"\
    \ | tee -a \"${BUILD_LOG_FILE}\"\n    exit\nelse\n    touch \"${LOCK_FILE}\"\n\
    \    # 从远程服务器获取更改。\n    pushd \"${LOCAL_CHECKOUT}\"\n    git fetch origin master\
    \ 2>&1 | tee -a \"${BUILD_LOG_FILE}\"\n    # 检查是否有传入的更改\n    updates=$(git log\
    \ HEAD..origin/master --oneline | wc -l)\n    echo \"Updates: ${updates}\" | tee\
    \ -a \"${BUILD_LOG_FILE}\"\n    if [[ ${updates} -gt 0 ]] || [[ ${FORCE} -gt 0\
    \ ]]; then\n        touch \"${LOG_FILE}\"\n        pushd \"${LOCAL_CHECKOUT}\"\
    \n        git pull origin master 2>&1 | tee -a \"${BUILD_LOG_FILE}\"\n       \
    \ popd\n        # 这个很快就不存在了，所以没必要 pushd\n        pushd \"${BUILD_DIR}\"\n    \
    \    # 克隆到 NAME\n        git clone \"${REPO}\" \"${NAME}\"\n        popd\n   \
    \     ${PRE_SCRIPT} 2>&1 | tee -a \"${BUILD_LOG_FILE}\"\n        EXIT_CODE=\"\
    ${?}\"\n        if [[ ${EXIT_CODE} -ne 0 ]]; then\n            if [[ ${EXIT_CODE}\
    \ -eq 124 ]]; then\n                msg=\"ANGRY (TIMEOUT) ${NAME} on $(hostname)\"\
    \n            else\n                msg=\"ANGRY ${NAME} on $(hostname)\"\n   \
    \         fi\n        else\n            msg=\"HAPPY ${NAME} on $(hostname)\"\n\
    \        fi\n        ${POST_SCRIPT} 2>&1 | tee -a \"${BUILD_LOG_FILE}\"\n    \
    \    EXIT_CODE=$?\n        if [[ ${EXIT_CODE} -ne 0 ]]; then\n            msg=\"\
    ANGRY ${NAME} on $(hostname)\"\n        fi\n        send_mail \"${msg}\"\n   \
    \ fi\n    cleanup\nfi\n```\n\n"
