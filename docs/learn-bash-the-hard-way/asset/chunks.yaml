    25 $ bash

    26 $ HISTTIMEFORMAT="%d/%m/%y %T "

    27 $ history | tail

    28 $ HISTTIMEFORMAT="%d/%m/%y "

    29 $ history | tail

    30 $ HISTSIZE=2

    31 $ ls

    32 $pwd

    33 $ history | tail

    34 $ tail ~/.bash_history

    35 $ exit

