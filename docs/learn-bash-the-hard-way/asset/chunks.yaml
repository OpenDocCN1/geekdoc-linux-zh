    \ -l /space/git/shutit -d test -c ./test.sh -m ian@mail.meirionconsulting.com\n\
    \n- \"在 crontab 中持续运行此脚本。\"\n\n  Crontab 行：\n\n  * * * * * cd /path/to/cheapci\
    \ && ./cheapci -r https://github.com/ianmiell/shutit.git -l /space/git/shutit\
    \ -d test -c ./test.sh -m ian@mail.meirionconsulting.com\nEND\n}\n\n# 现在我们收集从命令行传递的选项。你知道下面的\
