    11 > do

    12 >   echo $f

    13 > done

    ```


    然而，我们希望忽略空格。我们可以通过设置 `IFS` shell 变量来实现这一点。


    #### IFS shell 变量


    ```

    14 $ echo $IFS

    ```


    如果你保留了默认值，那么你将在输出中什么都没看到，这没什么帮助。要查看它是如何设置的，我们可以使用 `set`：


    ```

    15 $ set | grep IFS

    ```


    ```

    IFS=$'' \t\n''

    ```


    记得单引号前的 `$` 意味着变量向你显示带有反斜杠转义法的特殊字符。上面，`IFS` 变量被设置为：空格、制表符和换行符。


    `bash` 获取该变量中的字符并将其中任何一个视为字段分隔符，这意味着你上面写的原始 for 循环将从这些文件中创建：


    ```

    Spaces in filename1.txt

    Spaces in filename2.txt

    ```


    以下项列表：


    ```

    Spaces

    in

    filename1.txt

    Spaces

    in

    filename2.txt

    ```


    我们想做的是像处理其他字符一样处理空格。我们可以通过设置 `IFS` shell 变量来实现。


    ```

    16 $ IFS=$'' \t\n''

    17 $ for f in $(ls)

    18 > do

    19 >   ls $f

    20 > done

    ```


    这样整洁得多，也更容易管理。


    #### 作为分隔符的空字节


    既然说到这个上，值得提到 `NUL` 字节本质上是一个零字节。它不会显示在屏幕上，但可以被 `xargs` 读取为分隔符。通过添加 `-print0` 标志，`find`
    不再使用换行符作为字段分隔符。


    ```

    find -type f -print0 | xargs

    ```


    这听起来可能很抽象，但在包含空格的情况下经常会出现。


    #### 你学到了什么


    *   `IFS` 变量的作用

    *   如何处理包含特殊字符的文件

    *   `find` 和 `xargs` 程序的作用

    *   什么是 `NUL` 字节


    #### 接下来做什么？


    做得好！你已经到了脚本部分的最后。现在你完全具备编写和阅读脚本的能力。


    下一部分介绍了最常用的技巧。


    ### 练习题


    1) 将 `IFS` 变量设置为各种字符并演示分离如何工作

    2) 将 `find -type f` 的输出通过 `hexdump` 处理并提取 `NUL` 字节


    ## 第三部分 - Bash 功能


    在这一节中，我涵盖了日常使用 `bash` 的概念和技术。它们可以被视为 bash 使用技巧，是可选的，但出现的频率高到我认为有必要涵盖。


    我们在其中涵盖：


    *   readline 与 `bash`

    *   终端代码和非标准字符

    *   设置你的提示符

    *   ‘这里’文档

    *   `bash` 命令历史


    ### Readline


    `readline` 是那些被频繁使用以至于人们没有意识到它的技术之一。在这一节中，我想让你意识到它的存在，并介绍一些概念和示例，以便你能够处理因使用或误用产生的任何问题。


    在这一节你将学习：


    *   `readline` 是什么

    *   没有 `readline` 的 `bash` 看起来什么样

    *   `readline` 如何被使用

    *   快捷键如何被系统解释


    #### 这一节有多重要？


    编写 `bash` 不需要了解 `readline`。理解 `readline` 有助于理解终端和命令行发生了什么。


    #### 没有 readline 的 bash


    首先，我们将看看没有 `readline` 的 `bash` 看起来什么样。


    在你的“正常” `bash` shell 中，连续按两次 tab 键。你应该看到类似下面的内容：


    ```

    Display all 2335 possibilities? (y or n)

    ```

    '
- fmt: "\nThat’s because `bash` normally has an ‘autocomplete’ function that allows\
    \ you to see what commands are available to you if you tap tab twice.\n\nHit ‘n’\
    \ to get out of that autocomplete.\n\nSimilarly, if you hit the up arrow key a\
    \ few times, then the previously-run commands should be brought back to the command\
    \ line.\n\nNow type:\n\n```\n1 $ bash --noediting\n```\n\nThe `--noediting` flag\
    \ starts up `bash` without the `readline` library enabled. If you hit tab twice\
    \ now you will see something different: the shell no longer ‘sees’ your tab and\
    \ just sends a tab direct to the screen. Autocomplete has gone.\n\nAutocomplete\
    \ is just one of the things the `readline` library give you in the terminal. You\
    \ might want to try hitting the up or down arrows as you did above to see that\
    \ that no longer works as well.\n\nHit return to get a fresh command line, and\
    \ exit your non-readline-enabled `bash` shell:\n\n```\n2 $ exit\n```\n\n## Other\
    \ Shortcuts\n\nThere are a great many shortcuts like autocomplete available to\
    \ you if `readline` is enabled. I’ll quickly outline four of the most commonly-used\
    \ of these before explaining how you can find out more.\n\n```\n3 $ echo 'some\
    \ command'\n```\n\nThere should not be many surprises there. Now if you hit the\
    \ ‘up’ arrow, you will see you can get the last command back on your line. If\
    \ you like, you can re-run the command, but there are other things you can do\
    \ with `readline` before you hit return.\n\nIf you hold down the `ctrl` key and\
    \ then hit ‘a’ at the same time your cursor will return to the start of the line.\
    \ Another way of representing this ‘multi-key’ way of inputing is to write it\
    \ like this: ‘`\\C-a`’. This is one conventional way to represent this kind of\
    \ input. The ‘`\\C`’ represents the control key, and the ‘`-a`’ represents that\
    \ the ‘a’ key is depressed at the same time.\n\nNow if you hit ‘`\\C-e`’ (`ctrl`\
    \ and ‘e’) then your cursor has moved to the end of the line. I use these two\
    \ dozens of times a day.\n\nAnother frequently useful one is ‘`\\C-l`’, which\
    \ clears the screen, but leaves your command line intact.\n\nThe last one I’ll\
    \ show you allows you to search your history to find matching commands while you\
    \ type. Hit ‘`\\C-r`’, and then type ‘`ec`’. You should see the `echo` command\
    \ you just ran like this:\n\n```\n(reverse-i-search)`ec': echo echo\n```\n\nThen\
    \ do it again, but keep hitting ‘`\\C-r`’ over and over. You should see all the\
    \ commands that have `ec` in them that you’ve input before (if you’ve only got\
    \ one echo command in your history then you will only see one). As you see them\
    \ you are placed at that point in your history and you can move up and down from\
    \ there or just hit return to re-run if you want.\n\nThere are many more shortcuts\
    \ that you can use that `readline` gives you. Next I’ll show you how to view these.\n\
    \n## Using `bind` to Show Readline Shortcuts\n\nIf you type:\n\n```\n4 $ bind\
    \ -p\n```\n\nYou will see a list of bindings that `readline` is capable of. There’s\
    \ a lot of them! Have a read through if you’re interested, but don’t worry about\
    \ understanding them all yet.\n\nIf you type:\n\n```\n5 $ bind -p | grep C-a\n\
    ```\n\nyou’ll pick out the ‘beginning-of-line’ binding you used before, and see\
    \ the ‘`\\C-a`’ notation I showed you before.\n\nAs an exercise at this point,\
    \ you might want to look for the ‘`\\C-e`’ and ‘`\\C-r`’ bindings we used previously.\n\
    \nIf you want to look through the entirety of the `bind -p` output, then you will\
    \ want to know that `\\M` refers to the `Meta` key (which you might also know\
    \ as the `Alt` key), and `\\e` refers to the `Esc` key on your keyboard. The ‘escape’\
    \ key bindings are different in that you don’t hit it and another key at the same\
    \ time, rather you hit it, and then hit another key afterwards. So, for example,\
    \ typing the `Esc` key, and then the ‘`?`’ key also tries to auto-complete the\
    \ command you are typing. This is documented as:\n\n```\n\"\\e?\": possible-completions\n\
    ```\n\nin the `bind -p` output.\n\n## Readline and Terminal Options\n\nIf you’ve\
    \ looked over the possibilities that `readline` offers you, you might have seen\
    \ the ‘`\\C-r`’ binding we looked at earlier:\n\n```\n\"\\C-r\": reverse-search-history\n\
    ```\n\nYou might also have seen that there is another binding that allows you\
    \ to search forward through your history too:\n\n```\n\"\\C-s\": forward-search-history\n\
    ```\n\nWhat often happens to me is that I hit ‘`\\C-r`’ over and over again, and\
    \ then go too fast through the history and fly past the command I was looking\
    \ for. In these cases I might try to hit ‘`\\C-s`’ to search forward and get to\
    \ the one I missed.\n\nWatch out though! Hitting ‘`\\C-s`’ to search forward through\
    \ the history might well not work for you.\n\nWhy is this, if the binding is there\
    \ and `readline` is switched on?\n\nIt’s because something picked up the ‘`\\\
    C-s`’ before it got to the `readline` library: the terminal settings.\n\nThe terminal\
    \ program you are running in may have standard settings that do other things on\
    \ hitting some of these shortcuts before `readline` gets to see it.\n\nIf you\
    \ type:\n\n```\n5 $ stty -e\n```\n\nyou should get output similar to this:\n\n\
    ```\nspeed 9600 baud; 47 rows; 202 columns;\nlflags: icanon isig iexten echo echoe\
    \ -echok echoke -echonl echoctl\n\t-echoprt -altwerase -noflsh -tostop -flusho\
    \ pendin -nokerninfo\n\t-extproc\niflags: -istrip icrnl -inlcr -igncr ixon -ixoff\
    \ ixany imaxbel -iutf8\n\t-ignbrk brkint -inpck -ignpar -parmrk\noflags: opost\
    \ onlcr -oxtabs -onocr -onlret\ncflags: cread cs8 -parenb -parodd hupcl -clocal\
    \ -cstopb -crtscts -dsrflow\n\t-dtrflow -mdmbuf\ndiscard dsusp   eof     eol \
    \    eol2    erase   intr    kill    lnext\n^O      ^Y      ^D      <undef> <undef>\
    \ ^?      ^C      ^U      ^V\nmin     quit    reprint start   status  stop   \
    \ susp    time    werase\n1       ^\\      ^R      ^Q      ^T      ^S      ^Z\
    \      0       ^W\n```\n\nYou can see on the last four lines there is a table\
    \ of key bindings that your terminal will pick up before `readline` sees them.\
    \ The ‘`^`’ character (known as the ‘caret’) here represents the `ctrl` key that\
    \ we previously represented with a ‘`\\C`’.\n\nIf you think this is confusing\
    \ I won’t agree. Unfortunately in the history of Unix and Linux documenters did\
    \ not stick to one way of describing these keys.\n\nIf you encounter a problem\
    \ where the terminal options seem to catch a shortcut key binding before it gets\
    \ to `readline`, then you can use the `stty` program to unset that binding. In\
    \ this case, we want to unset the ‘stop’ binding.\n\nIf you are in the same situation,\
    \ type:\n\n```\n6 $ stty stop undef\n```\n\nNow, if you re-run `stty -e`, the\
    \ last two lines might look like this:\n\n```\n[...]\nmin     quit    reprint\
    \ start   status  stop    susp    time    werase\n1       ^\\      ^R      ^Q\
    \      ^T      <undef> ^Z      0       ^W\n```\n\nwhere the `stop` entry now has\
    \ ‘`<undef>` underneath it.\n\nStrangely, for me ‘`C-r`’ is also bound to ‘reprint’\
    \ above (`^R`). But (on my terminals at least) that gets to `readline` without\
    \ issue as I search up the history. Why this is the case I haven’t been able to\
    \ figure out. I suspect that reprint is ignored by modern terminals that don’t\
    \ need to ‘reprint’ the current line.\n\nWhile we are looking at this table:\n\
    \n```\ndiscard dsusp   eof     eol     eol2    erase   intr    kill    lnext\n\
    ^O      ^Y      ^D      <undef> <undef> ^?      ^C      ^U      ^V\nmin     quit\
    \    reprint start   status  stop    susp    time    werase\n1       ^\\     \
    \ ^R      ^Q      ^T      <undef> ^Z      0       ^W\n```\n\nit’s worth noting\
    \ a few other key bindings that are used regularly.\n\nFirst, one you may well\
    \ be familiar with is ‘`\\C-c`’, which interrupts a program, terminating it:\n\
    \n```\n 7 $ sleep 99\n 8 [[Hit \\C-c]]\n 9 ^C\n10 $\n```\n\nSimilarly, ‘`\\C-z`’\
    \ suspends a program, allowing you to ‘foreground’ it again and continue with\
    \ the `fg` builtin.\n\n```\n10 $ sleep 10\n11 [[ Hit \\C-z]]\n12 ^Z\n13 [1]+ \
    \ Stopped                 sleep 10\n14 $ fg\n15 sleep 10\n```\n\nThe ‘`\\C-d`’\
    \ sends an ‘end of file’ character. It’s often used to indicate to a program that\
    \ input is over. If you type it on a `bash` shell, the `bash` shell you are in\
    \ will close.\n"
