  trans: "\n这是因为 `bash` 通常带有一个“自动补全”功能，允许你通过双击 Tab 键来查看可用的命令。\n\n按 ‘n’ 键退出自动补全。\n\n\
    同样，如果你连续按几次向上方向键，之前运行过的命令就会被带回命令行中。\n\n现在输入：\n\n```\n1 $ bash --noediting\n```\n\
    \n`--noediting` 标志会在不启用 `readline` 库的情况下启动 `bash`。如果你现在双击 Tab 键，你将看到与不同的结果：shell\
    \ 不再能“看”到你的 Tab 键，而是直接将 Tab 键发送到屏幕上。自动补全消失了。\n\n自动补全只是 `readline` 库在终端中为你提供的功能之一。你可能还想尝试像上面那样按向上或向下方向键，你会发现这些功能也不再像以前那样工作了。\n\
    \n按回车键获取一个新的命令行，并退出你未启用 `readline` 的 `bash` 壳：\n\n```\n2 $ exit\n```\n\n## 其他快捷键\n\
    \n如果启用了 `readline`，你会有许多像自动补全这样的快捷键可用。在解释如何查找更多信息之前，我会快速简述其中最常用的四种。\n\n```\n3\
    \ $ echo 'some command'\n```\n\n这里应该不会有什么大惊喜。现在，如果你按下“向上”方向键，你会发现可以把上一条命令取回到行中。如果你愿意，可以重新运行该命令，但在按下回车键之前，你还可以使用\
    \ `readline` 执行其他操作。\n\n如果你按住 `ctrl` 键并同时按下 ‘a’，光标将返回行首。表示这种“多键”输入方式的另一种方法是写成这样：“`\\\
    C-a`’”。这是表示此类输入的惯用方法之一。“`\\C`”代表控制键，而“`-a`”代表同时按下了 ‘a’ 键。\n\n现在，如果你按下‘`\\C-e`’（`ctrl`\
    \ 和 ‘e’），你的光标就会移动到行尾。我每天都会使用这两个组合几十次。\n\n另一个经常实用的快捷键是‘`\\C-l`’，它可以清除屏幕，但保持你的命令行完整。\n\
    \n我最后一个向你展示的功能允许你在输入时搜索历史记录以找到匹配的命令。按下‘`\\C-r`’，然后输入‘`ec`’。你应该能看到你刚刚运行的 `echo`\
    \ 命令，如下：\n\n```\n(reverse-i-search)`ec': echo echo\n```\n\n然后再次执行，但不断地重复‘`\\C-r`’。你应该能看到之前输入过的所有包含\
    \ `ec` 的命令（如果你的历史记录中只有一个 `echo` 命令，那么你只会看到一个）。当你看到这些命令时，光标会置于历史记录中的该位置，你可以从那里向上或向下移动，或者直接按回车键重新运行。\n\
    \n`readline` 提供的提供了许多更多你可以使用的快捷键。接下来我将向你展示如何查看这些内容。\n\n## 使用 `bind` 显示 Readline\
    \ 快捷键\n\n如果你输入：\n\n```\n4 $ bind -p\n```\n\n你将看到 `readline` 能够的所有绑定列表。非常多！如果你感兴趣，可以读一下，但先不用担心理解所有的它们。\n\
    \n如果你输入：\n\n```\n5 $ bind -p | grep C-a\n```\n\n你将筛选出你之前使用的“行首”绑定，并看到我之前向你展示的‘`\\\
    C-a`’表示。\n\n作为此时的练习，你可能想寻找我们之前用过的‘`\\C-e`’和‘`\\C-r`’绑定。\n\n如果你想查看 `bind -p` 输出的全部，你将需要知道\
    \ `\\M` 指的是 `Meta` 键（你可能也知道它是 `Alt` 键），而 `\\e` 指的是键盘上的 `Esc` 键。“转义”键绑定不同之处在于，你不需要同时按下它和另一个键，而是先按下它，然后再按下另一个键。例如，输入\
    \ `Esc` 键，然后按‘`?`’键也会尝试自动补全你正在输入的命令。这在输出记录为：\n\n```\n\"\\e?\": possible-completions\n\
    ```\n\n在 `bind -p` 的输出中。\n\n## Readline 和终端选项\n\n如果你已经查看了 `readline` 为你提供的可能性，你可能看到了我们之前看过的‘`\\\
    C-r`’绑定：\n\n```\n\"\\C-r\": reverse-search-history\n```\n\n你可能还看到有另一个绑定允许你正向搜索历史记录：\n\
    \n```\n\"\\C-s\": forward-search-history\n```\n\n我经常发生的情况是，我反复按‘`\\C-r`’，然后穿过历史记录的速度太快，过了我要找的命令。在这些情况下，我可能会尝试按‘`\\\
    C-s`’来正向搜索并找回我错过的那个。\n\n不过要注意！按‘`\\C-s`’正向搜索历史可能对你不起作用。\n\n既然绑定存在且 `readline`\
    \ 已开启，为什么会这样呢？\n\n这是因为某些东西在‘`\\C-s`’到达 `readline` 库之前就被拦截了：终端设置。\n\n你正在运行的终端程序可能有标准设置，在\
    \ `readline` 看到它之前对按下某些快捷键执行其他操作。\n\n如果你输入：\n\n```\n5 $ stty -e\n```\n\n你应该得到类似下方的输出：\n\
    \n```\nspeed 9600 baud; 47 rows; 20 columns;\nlflags: icanon isig iexten echo\
    \ echoe -echok echoke -echonl echoctl\n\t-echoprt -altwerase -noflsh -tostop -flusho\
    \ pendin -nokerninfo\n\t-extproc\niflags: -istrip icrnl -inlcr -igncr ixon -ixoff\
    \ ixany imaxbel -iutf8\n\t-ignbrk brkint -inpck -ignpar -parmrk\noflags: opost\
    \ onlcr -oxtabs -onocr -onlret\ncflags: cread cs8 -parenb -parodd hupcl -clocal\
    \ -cstopb -crtscts -dsrflow\n\t-dtrflow -mdmbuf\ndiscard dsusp   eof     eol2\
    \    erase   intr    kill    lnext\n^O      ^Y      ^D      <undef> <undef> ^?\
    \      ^C      ^U      ^V\nmin     quit    reprint start   status  susp    time\
    \    werase\n1       ^\\      ^R      ^Q      ^T      <undef> ^Z      0      \
    \ ^W\n```\n\n如果你已经查看了 `readline` 为你提供的可能性，你可能看到了我们之前看过的‘`\\C-r`’绑定：\n\n```\n\"\
    \\C-r\": reverse-search-history\n```\n\n你可能还看到有另一个绑定允许你正向搜索历史记录：\n\n```\n\"\\\
