  trans: "\n上述前两行使用了 `>` 运算符，而第三行使用了 `>>` 运算符。`>` 运算符无论文件是否存在，都会有效地创建一个新文件。相比之下，`>>`\
    \ 运算符会将内容**追加**到文件的末尾。因此，只有 `line2` 和 `line3` 被添加到了 `file3` 中。\n\n## 清理\n\n现在清理一下你刚才的操作：\n\
    \n```\n19 $ cd ..\n20 $ rm -rf lbthw_pipes_redirects\n```\n\n## 你学到了什么\n\n- 什么是文件重定向\n\
    - 管道的作用\n- 标准输出和标准错误之间的区别\n- 如何将标准输出重定向到与标准错误相同的位置（反之亦然）\n- 如何将标准输出或标准错误（或两者）重定向到文件\n\
    \n## 接下来要做什么？\n\n你快要到达第一节的结尾了。接下来你将学习创建 shell 脚本，以及 `bash` 启动时会发生什么。\n\n## 练习\n\
    \n1) 尝试几个不同的命令，弄清楚哪些输出到标准输出，哪些输出到标准错误。尝试通过误用程序来触发错误。\n\n2) 编写将标准输出重定向到文件描述符‘3’的命令。\n\
    \n3) 研究 `|&` 管道运算符的作用。如果你找不到，尝试运行命令 `cat file2 |& grep -c file`，看看与你之前运行相比有什么变化。\n\
    \n## 脚本与启动\n\n本节考虑了两个相关主题：\n\n- Shell 脚本\n- shell 启动时会发生什么\n\n你可能遇到过 shell 脚本，这部分很快就能涵盖，但\
    \ shell 启动是一个有用但棘手的话题，大多数人都会某个地方被它难住，值得深入理解。\n\n### 这一节有多重要？\n\n这一节是必读内容。\n\n\
    ## Shell 脚本\n\n```\n1 $ mkdir -p lbthw_scripts_and_startups\n2 $ cd lbthw_scripts_and_startups\n\
    ```\n\nshell 脚本仅仅是一组可以非交互式运行的 shell 命令集合。这些可以是你手动运行的快速一次性脚本，也可以是非常复杂的程序。\n\n###\
    \ Shebang 解释器路径\n\n运行以下命令：\n\n```\n3 $ echo '#!/bin/bash' > simple_script\n4 $\
    \ echo 'echo I am a script' >> simple_script\n```\n\n你刚刚创建了一个名为 `simple_script`\
    \ 的文件，里面有两行。第一行由两个特殊字符组成：井（#）和感叹号（!）。这通常被称为‘shebang’，为了方便也称为‘hashbang’。当操作系统接收到一个作为程序运行的文件时，如果从开头看到这两个字符，就知道该文件将在另一个程序（通常称为“解释器”）的控制下运行。\n\
    \n现在尝试运行它：\n\n```\n5 $ ./simple_script\n```\n\n这应该失败了。在我们解释原因之前，让我们先理解这个命令。\n\n\
    命令开头的 `./` 字符告诉 shell 你想在当前工作目录的范围内运行此文件。后面跟着要运行的文件名。\n\n同样，`../` 字符表示你想从当前工作目录的上一级目录运行。\n\
    \n如下：\n\n```\n 6 $ mkdir tmp\n 7 $ cd tmp\n 8 $ ../simple_script\n 9 $ cd ..\n\
    10 $ rm -rf tmp\n```\n\n这将给你相同的输出。\n\n### 执行权限\n\n该脚本失败是因为文件没有被标记为可执行，所以你会收到一个“权限被拒绝”的错误。\n\
    \n要纠正这一点，运行：\n\n```\n11 $ chmod +x simple_script\n12 $ ./simple_script\n```\n\n\
    `chmod` 程序更改文件的权限（或“模式”），使得只有特定的用户或用户组可以读、写或执行（即作为程序运行）文件。\n\n### PATH 变量\n\n\
    如果你不指定 `./` 而直接运行会发生什么：\n\n```\n13 $ simple_script\n```\n\n我不知道会发生什么。你会收到一个找不到它的错误，或者它会像以前一样工作。\n\
    \n我之所以不知道是因为这取决于你环境中 `PATH` 变量是如何设置的。\n\n如果你运行这个命令你会看到你的 `PATH` 变量：\n\n```\n14\
    \ $ echo $PATH\n```\n\n你的输出可能有所不同。例如，我的是：\n\n```\n/home/imiell/perl5/bin:/opt/local/bin:/opt/local/sbin:/Users/imiell/google-cloud-sdk\\\
    \n/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/X11/bin:/space/git/shutit:/sp\\\
    \nace/git/work/bin:/space/git/home/bin:~/.dotfiles/bin:/space/go/bin\n```\n\n\
    `PATH` 变量是一组由冒号分隔的目录。它可能非常简单：\n\n```\n/usr/sbin:/usr/bin\n```\n\n例如。\n\n这些是 `bash`\
    \ 按顺序查找命令的目录。\n\n那么如果你没有设置，是谁设置了 `PATH` 变量？答案是：bash 启动脚本。\n\n但在讨论它们之前，我们如何确保 `simple_script`\
    \ 可以在不带 `./` 的情况下运行？\n\n```\n15 $ PATH=${PATH}:.\n16 $ simple_script\n```\n\n\
    就是这样！在第一行中，你将 `PATH` 设置为自身加上当前工作目录。它会查找你之前在 `PATH` 变量中设置的所有目录，最后尝试正如我们之前看到的 `.’`，即本地文件夹。\n\
    \n### 启动脚本\n\n理解启动脚本和环境变量是解决许多可能花费你大量时间调试问题的关键！如果某事在一个环境中有效而在另一个环境中无效，答案通常是启动脚本以及它们设置环境的方式存在差异。\n\
    \n### 启动详解\n\n当 `bash` 启动时，它会调用并运行一系列文件来设置你到达终端时的环境。如果你曾经注意到 `bash` 在给你提供提示符之前可以“暂停”，可能是因为启动脚本正在前台执行某个命令。\n\
    \n看这张图：\n\n![](img/shell-startup-actual.png)\n\n是的，这可能会让人困惑。\n\n该图显示了不同上下文中不同\
    \ shell 的启动脚本顺序。每个上下文都通过遵循图中不同的颜色来显示。\n\n我们将遵循（从上到下）从‘bash’气泡开始路径，忽略‘zsh’ 状态。\n\
    \n（注：原文中存在多处重复的描述，译文已按逻辑精简并翻译）\n"
- fmt: "\nIt’s often useful to start up `bash` while avoiding all these startup scripts,\
    \ to get `bash` in as raw a state as possible. When debugging, or testing core\
    \ bash functionality, this can be invaluable.\n\nTo acheive that, run this:\n\n\
    ```\n22 $ env -i bash --noprofile --norc\n```\n\n`env` is a program that works\
    \ on the environment. The effect of the `-i` flag is to remove the environment\
    \ variables from the command you run. This means that exported variables will\
    \ not get inherited by the `bash` program we are running. We’re running the `bash`\
    \ program itself with two flags. The `--noprofile` flag tells `bash` not to source\
    \ the system-wide bash startup files, and the `--norc` tells `bash` not to source\
    \ the personal ones in your home folder either.\n\nThe end effect of this is that\
    \ your shell has a very minimal set of variables available:\n\n```\n23 $ env\n\
    24 $ exit\n```\n\n## Cleanup\n\nNow clean up what you just did:\n\n```\n25 $ cd\
    \ ..\n26 $ unset MYVAR\n27 $ rm -rf lbthw_scripts_and_startups\n```\n\n## What\
    \ You Learned\n\n* What the ‘shebang’ is\n* How to create and run a shell script\n\
    * The significance of the `PATH` environment variable\n* What happens when `bash`\
    \ starts up\n* What the builtin `source` does\n\n## What Next?\n\nWell done! You’ve\
    \ now finished the first part of the course.\n\nYou now have a good grounding\
    \ to learn slightly more advanced bash scripting, which you will cover in part\
    \ two.\n\n## Exercises\n\n1) Go through all the scripts that your `bash` session\
    \ went through. Read through them and try and understand what they’re doing. If\
    \ you don’t understand parts of them, try and figure out what’s going on by reading\
    \ `man bash`.\n\n2) Go through the other files in that diagram that exist on your\
    \ machine. Do as per 1).\n\n# Part II - Scripting Bash \n\nIn this section I cover\
    \ concepts and techniques that form the basis of bash scripting. These are the\
    \ fundamental building blocks required to write and comprehend useful bash scripts,\
    \ and forms the basis of the more advanced sections that follow.\n\nIn it we cover:\n\
    \n* Command substitution\n* The concept of the ‘test’ in bash\n* Looping in bash\n\
    * Exit codes and bash\n* The `set` command\n* File substitution\n* The internal\
    \ field separator\n\n## Command Substitution and Evaluation\n\nWhen writing bash\
    \ scripts you often want to take the standard output of one command and ‘drop’\
    \ it into the script as though you had written that into it.\n\nThis can be achieved\
    \ with command substitution.\n\nYou will learn:\n\n* What command substitution\
    \ is\n* The different ways of substituting commands\n\n### How Important is this\
    \ Section?\n\nThe contents of this section are vital if you intend to write or\
    \ work on shell scripts.\n\n### Command Substitution Example\n\nAn example may\
    \ help illustrate. Type these commands:\n\n```\n1 $ hostname\n2 $ echo 'My hostname\
    \ is: $(hostname)'\n3 $ echo \"My hostname is: $(hostname)\"\n```\n\nIf those\
    \ lines are placed in a script, it will output the hostname of the host the script\
    \ is running on. This can make your script much more dynamic. You can set variables\
    \ based on the output of commands, add debug, and so on, just as with any other\
    \ programming language.\n\nYou will have noticed that if wrapped in single quotes,\
    \ the special meaning of the `$` sign is ignored again!\n\n### The Two Command\
    \ Substitution Methods\n\nThere are two ways to do command substitution:\n\n```\n\
    4 $ echo \"My hostname is: `hostname`\"\n5 $ echo \"My hostname is: $(hostname)\"\
    \n```\n\nThese give the same output and the backticks perform the same function.\
    \ So which should you use?\n\n#### The ‘Dollar-Bracket’ Method: `$()`\n\nType\
    \ this:\n\n```\n 6 $ mkdir lbthw_cmdsub\n 7 $ cd lbthw_cmdsub\n 8 $ echo $(touch\
    \ $(ls ..))\n9 $ cd ..\n10 $ rm -rf lbthw_cmdsub\n```\n\nWhat happened there?\n\
    \nYou created a folder (line 6) and moved into it (line 7).\n\nThe next line is\
    \ easiest to read from the innermost parentheses outwards.\n\nThe `ls ..` command\
    \ is run in the innermost parentheses. This outputs the contents of the parent\
    \ directory.\n\nThis output is substituted in over the `$(ls ..)`. The ‘words’\
    \ returned are placed as the arguments to the `touch` command. The `touch` command\
    \ creates a set of empty files, based on the list of the parent directory’s contents.\n\
    \nThe `echo` command takes the output of the above substitution, in this case\
    \ nothing, as touch does not produce any output.\n\nSo, in summary:\n\n* the line\
    \ outputs the list of files of the parent directory\n* those filenames are also\
    \ created locally as empty files\n\nThis is an example of how subcommands can\
    \ be nested. As you can see, the nesting is simple - just place a command wrapped\
    \ inside a `$()` inside another command wrapped inside a `$()` and bash substitute\
    \ in the output of each command from the inside out for you in the appropriate\
    \ order.\n\n#### The ‘Backtick’ Method\n\nType this out:\n\n```\n11 $ mkdir lbthw_cmdsub\n\
    12 $ cd lbthw_cmdsub\n13 $ echo `touch \\`ls ..\\``\n14 $ cd ..\n```\n\nTo nest\
    \ the backtick version, you have to ‘escape’ the inner backtick with a backslash,\
    \ so bash knows which level the backtick should be interpreted at. \n\nTo demonstrate\
    \ the difficulty here, a simple example suffices:\n\n```\n15 $ echo $(echo hello1\
    \ $(echo hello2))\n16 $ echo `echo hello1 `echo hello2``\n17 $ echo `echo hello1\
    \ \\`echo hello2``\n```\n\nFor historical reasons, the backtick form is still\
    \ very popular, but I prefer the ‘$()’ form because of the simplicity of managing\
    \ nesting. You need to be aware of both, though, if you are looking at others’\
    \ code!\n\nIf you want to see how messy things can get, compare these two lines:\n\
    \n```\n18 $ echo `echo \\`echo \\\\\\`echo inside\\\\\\\\``\n19 $ echo $(echo\
    \ $(echo $(echo inside)))\n```\n\nand consider which one is easier to read (and\
    \ write)!\n\n## Cleanup\n\nRemove the left-over directory:\n\n```\n20 $ rm -rf\
    \ lbthw_cmdsub\n```\n\n## What You Learned\n\n* What command substitution is\n\
    * How it relates to quoting\n* The two command substitution methods\n* Why one\
    \ method is generally preferred over the other\n\n## What Next?\n\nNext you will\
    \ learn about exit codes, which will power up your ability to write neater bash\
    \ code and better scripts.\n\n## Exercises\n\n1) Try various command substitution\
    \ commands, and plug in variables and quotes to see what happens.\n\n2) Explain\
    \ why three backslashes are required in the last example.\n\n## Exit Codes\n\n\
    Before you cover tests and special parameters in bash, a crucial and related concept\
    \ to grasp is exit codes.\n\nYou will cover:\n\n* What an exit code is\n* How\
    \ to set one in a script and a function\n* Exit code conventions\n* Some other\
    \ ‘special’ parameters in bash\n\n### How Important is this Section?\n\nMost bash\
    \ scripts won’t be completely comprehensible or safely written unless exit codes\
    \ are understood.\n\n### What Is An Exit Code?\n\nAfter you run a command, function\
    \ or builtin, a special variable is set that tells you what the result of that\
    \ command was. If you’re familiar with HTTP codes like 200 or 404, this is a similar\
    \ concept to that.\n\nTo take a simple example, type this in:\n\n```\n1 $ ls\n\
    2 $ echo $?\n3 $ doesnotexist\n4 $ echo $?\n```\n\nWhen that special variable\
    \ is set to ‘0’ it means that the command completed successfully.\n\nNow that\
    \ you’ve learned about functions, commands and a little about exit codes, you\
    \ should be able to follow what is going on here:\n\n```\n 5 $ bash\n 6 $ function\
    \ trycmd {\n 7         $1\n 8         if [[ $? -eq 127 ]]\n 9         then\n10\
    \                 echo 'What are you doing?'\n11         fi\n12 }\n13 $ trycmd\
    \ ls\n14 $ trycmd doesnotexist\n15 $ exit\n```\n\nYou can easily write tests to\
    \ use exit codes for various purposes like this.\n\n### Standard Exit Codes\n\n\
    There are guidelines for exit codes for those that want to follow standards. Be\
    \ aware that not all programs follow these standards (`grep` is the most common\
    \ example of a non-standard program, as you will learn)!\n\nSome key ones are:\n\
    \n| Number | Meaning | Notes |\n| --- | --- | --- |\n| 0 | OK | Command successfully\
    \ run |\n| 1 | General error | Used when there is an |\n"
  raw: "It’s often useful to start up bash while avoiding all these startup scripts,\
    \ to get bash in as raw a state as possible. When debugging, or testing core bash\
    \ functionality, this can be invaluable.\n\nTo acheive that, run this:\n\n```\n\
    22 $ env -i bash --noprofile --norc\n```\n\n`env` is a program that works on the\
    \ environment. The effect of the `-i` flag is to remove the environment variables\
    \ from the command you run. This means that exported variables will not get inherited\
    \ by the bash program we are running. We’re running the bash program itself with\
    \ two flags. The `--noprofile` flag tells bash not to source the system-wide bash\
    \ startup files, and the `--norc` tells bash not to source the personal ones in\
    \ your home folder either.\n\nThe end effect of this is that your shell has a\
    \ very minimal set of variables available:\n\n```\n23 $ env\n24 $ exit\n```\n\n\
    #### Cleanup\n\nNow clean up what you just did:\n\n```\n25 $ cd ..\n26 $ unset\
    \ MYVAR\n27 $ rm -rf lbthw_scripts_and_startups\n```\n\n#### What You Learned\n\
    \n*   What the ‘shebang’ is\n\n*   How to create and run a shell script\n\n* \
    \  The significance of the `PATH` environment variable\n\n*   What happens when\
    \ bash starts up\n\n*   What the builtin `source` does\n\n#### What Next?\n\n\
    Well done! You’ve now finished the first part of the course.\n\nYou now have a\
    \ good grounding to learn slightly more advanced bash scripting, which you will\
    \ cover in part two.\n\n#### Exercises\n\n1) Go through all the scripts that your\
    \ bash session went through. Read through them and try and understand what they’re\
    \ doing. If you don’t understand parts of them, try and figure out what’s going\
    \ on by reading `man bash`.\n\n2) Go through the other files in that diagram that\
    \ exist on your machine. Do as per 1).\n\n## Part II - Scripting Bash\n\nIn this\
    \ section I cover concepts and techniques that form the basis of bash scripting.\
    \ These are the fundamental building blocks required to write and comprehend useful\
    \ bash scripts, and forms the basis of the more advanced sections that follow.\n\
    \nIn it we cover:\n\n*   Command substitution\n\n*   The concept of the ‘test’\
    \ in bash\n\n*   Looping in bash\n\n*   Exit codes and bash\n\n*   The `set` command\n\
    \n*   File substitution\n\n*   The internal field separator\n\n### Command Substitution\
    \ and Evaluation\n\nWhen writing bash scripts you often want to take the standard\
    \ output of one command and ‘drop’ it into the script as though you had written\
    \ that into it.\n\nThis can be achieved with command substitution.\n\nYou will\
    \ learn:\n\n*   What command substitution is\n\n*   The different ways of substituting\
    \ commands\n\n#### How Important is this Section?\n\nThe contents of this section\
    \ are vital if you intend to write or work on shell scripts.\n\n#### Command Substitution\
    \ Example\n\nAn example may help illustrate. Type these commands:\n\n```\n1 $\
    \ hostname\n2 $ echo 'My hostname is: $(hostname)'\n3 $ echo \"My hostname is:\
    \ $(hostname)\"\n```\n\nIf those lines are placed in a script, it will output\
    \ the hostname of the host the script is running on. This can make your script\
    \ much more dynamic. You can set variables based on the output of commands, add\
    \ debug, and so on, just as with any other programming language.\n\nYou will have\
    \ noticed that if wrapped in single quotes, the special meaning of the `$` sign\
    \ is ignored again!\n\n#### The Two Command Substitution Methods\n\nThere are\
    \ two ways to do command substitution:\n\n```\n4 $ echo \"My hostname is: `hostname`\"\
    \n5 $ echo \"My hostname is: $(hostname)\"\n```\n\nThese give the same output\
    \ and the backticks perform the same function. So which should you use?\n\n#####\
    \ The ‘Dollar-Bracket’ Method: `$()`\n\nType this:\n\n```\n 6 $ mkdir lbthw_cmdsub\n\
    \ 7 $ cd lbthw_cmdsub\n 8 $ echo $(touch $(ls ..))\n 9 $ cd ..\n10 $ rm -rf lbthw_cmdsub\n\
    ```\n\nWhat happened there?\n\nYou created a folder (line 6) and moved into it\
    \ (line 7).\n\nThe next line is easiest to read from the innermost parentheses\
    \ outwards.\n\nThe `ls ..` command is run in the innermost parentheses. This outputs\
    \ the contents of the parent directory.\n\nThis output is substituted in over\
    \ the `$(ls ..)`. The ‘words’ returned are placed as the arguments to the `touch`\
    \ command. The `touch` command creates a set of empty files, based on the list\
    \ of the parent directory’s contents.\n\nThe `echo` command takes the output of\
    \ the above substitution, in this case nothing, as touch does not produce any\
    \ output.\n\nSo, in summary:\n\n*   the line outputs the list of files of the\
    \ parent directory\n\n*   those filenames are also created locally as empty files\n\
    \nThis is an example of how subcommands can be nested. As you can see, the nesting\
    \ is simple - just place a command wrapped inside a `$()` inside another command\
    \ wrapped inside a `$()` and bash substitute in the output of each command from\
    \ the inside out for you in the appropriate order.\n\nNow let’s look at the equivalent\
    \ code with backticks.\n\n##### The ‘Backtick’ Method\n\nType this out:\n\n```\n\
    11 $ mkdir lbthw_cmdsub\n12 $ cd lbthw_cmdsub\n13 $ echo `touch \\`ls ..\\``\n\
    14 $ cd ..\n```\n\nTo nest the backtick version, you have to ‘escape’ the inner\
    \ backtick with a backslash, so bash knows which level the backtick should be\
    \ interpreted at.\n\nTo demonstrate the difficulty here, a simple example suffices:\n\
    \n```\n15 $ echo $(echo hello1 $(echo hello2))\n16 $ echo `echo hello1 `echo hello2``\n\
    17 $ echo `echo hello1 \\`echo hello2\\``\n```\n\nFor historical reasons, the\
    \ backtick form is still very popular, but I prefer the ‘$()’ form because of\
    \ the simplicity of managing nesting. You need to be aware of both, though, if\
    \ you are looking at others’ code!\n\nIf you want to see how messy things can\
    \ get, compare these two lines:\n\n```\n18 $ echo `echo \\`echo \\\\\\`echo inside\\\
    \\\\`\\``\n19 $ echo $(echo $(echo $(echo inside)))\n```\n\nand consider which\
    \ one is easier to read (and write)!\n\n#### Cleanup\n\nRemove the left-over directory:\n\
    \n```\n20 $ rm -rf lbthw_cmdsub\n```\n\n#### What You Learned\n\n*   What command\
    \ substitution is\n\n*   How it relates to quoting\n\n*   The two command substitution\
    \ methods\n\n*   Why one method is generally preferred over the other\n\n####\
    \ What Next?\n\nNext you will learn about exit codes, which will power up your\
    \ ability to write neater bash code and better scripts.\n\n#### Exercises\n\n\
    1) Try various command substitution commands, and plug in variables and quotes\
    \ to see what happens.\n\n2) Explain why three backslashes are required in the\
    \ last example.\n\n### Exit Codes\n\nBefore you cover tests and special parameters\
    \ in bash, a crucial and related concept to grasp is exit codes.\n\nYou will cover:\n\
    \n*   What an exit code is\n\n*   How to set one in a script and a function\n\n\
    *   Exit code conventions\n\n*   Some other ‘special’ parameters in bash\n\n####\
    \ How Important is this Section?\n\nMost bash scripts won’t be completely comprehensible\
    \ or safely written unless exit codes are understood.\n\n#### What Is An Exit\
    \ Code?\n\nAfter you run a command, function or builtin, a special variable is\
    \ set that tells you what the result of that command was. If you’re familiar with\
    \ HTTP codes like 200 or 404, this is a similar concept to that.\n\nTo take a\
    \ simple example, type this in:\n\n```\n1 $ ls\n2 $ echo $?\n3 $ doesnotexist\n\
    4 $ echo $?\n```\n\nWhen that special variable is set to ‘0’ it means that the\
    \ command completed successfully.\n\nNow that you’ve learned about functions,\
    \ commands and a little about exit codes, you should be able to follow what is\
    \ going on here:\n\n```\n 5 $ bash\n 6 $ function trycmd {\n 7         $1\n 8\
    \         if [[ $? -eq 127 ]]\n 9         then\n10                 echo 'What\
    \ are you doing?'\n11         fi\n12 }\n13 $ trycmd ls\n14 $ trycmd doesnotexist\n\
    15 $ exit\n```\n\nYou can easily write tests to use exit codes for various purposes\
    \ like this.\n\n#### Standard Exit Codes\n\nThere are guidelines for exit codes\
    \ for those that want to follow standards. Be aware that not all programs follow\
    \ these standards (`grep` is the most common example of a non-standard program,\
    \ as you will learn)!\n\nSome key ones are:\n\n| Number | Meaning | Notes |\n\n\
    | --- | --- | --- |\n\n| 0 | OK | Command successfully run |\n\n| 1 | General\
    \ error | Used when there is an |"
