    used to indicate that the bash history is being referred to.


    The simplest, and most frequently seen is the double bang `!!`, which just means:
    re-run the previous command.


    The one I use most often, though, is the second one you come across in the listing
    above: `!$`, or ‘bang dollar’. This one I must use dozens of times every day.
    It tells bash to re-use the last argument of the previous command.


    Finally, a ‘bang’ followed by ‘normal’ characters re-runs the last command that
    matches those starting letters. The `!e` looks up the last command that ran starting
    with an ‘e’ and runs that. Similarly, the `!gr` runs the last command that started
    with a `gr`, ie the `grep`.


    Notice that the command that’s rerun is the *evaluated* command. For that grep,
    what is re-run is as though you typed: `grep Another file2`, and not: `grep Another
    !$`.


    #### How to Learn History Shortcuts


    The history items above are enough to be going on with if you’ve not seen them
    before. There‘s little point listing them all as you‘ll likely forget them before
    you finish this book.


    So before you go on, a quick note about learning these things: it’s far more important
    to learn to *use* these tricks than *understand* them. To understand them is pretty
    easy - I’m sure you understood the passage above without much difficulty.


    The way to learn these is to ‘get them under your fingers’ to the point where
    you don’t even think about it. The way I recommend to do that is to concentrate
    on one of them at a time, and as you’re working, remember to use that one where
    appropriate. Gradually you’ll add more and more to your repertoire, and you will
    soon look like a whizz at the terminal.


    #### More Advanced History Usage


    You might want to stop there, as trying to memorize/learn much more in one go
    can be overwhelming.


    But there are many more tricks to learn like this in bash, so I’m going to lay
    them out now so you might return to them later when you’re ready.


    Carrying on from where you left off above:


    ```

    13 $ grep Abnother file1

    14 $ ^Ab^a^

    ```


    The carets (`^`) are used to replace a string from the previous command. In this
    case, `Ab` is replaced with: `a`. This is often handy if you made a spelling mistake.


    Next up are the position command shortcuts, or ‘word designators’:


    ```

    15 $ grep another file1 | wc -l

    16 $ # Is that output correct? I want to check the file by eye:

    17 $ cat !:2

    ```


    Starting with the ‘bang’ sign to indicate we’re referring to the history, there
    follows a colon. Then, you specify the word with a number. The numbers are zero-based,
    so the arguments start with ‘1’.


    ```

    18 $ grep another file1

    19 $ fgrep !:1-$

    ```


    In the above example, you want to run the same command as before, but use the
    `fgrep` command instead of `grep` (`fgrep` is a ‘faster’ grep, which doesn’t really
    help us here, but is just an example). To achieve this you use the so-called ‘word
    designators’.


    Here you add a dash indicating you want a ‘range’ of words, and the `$` sign indicates
    we want all the arguments up to the end of the previous command. Recall that `!$`
    means give me the last argument from the previous command, and so is itself a
    shortcut for `!:$`


    You can even reference an argument on the line while you are typing it. Try this:


    ```

    20 $ echo a b !#:1

    ```


    and figure out what’s going on. The ‘#’ indicates that you are referring to the
    current line, not the previous one, and the ‘:1’ refers to the second argument
    (remember, the arguments are numbered from zero, so ‘echo’ is argument zero.


    Finally, another trick I use all the time:


    ```

    21 $ LGTHWDIR=$(PWD)

    22 $ cd /tmp

    23 $ cat ${LGTHWDIR}/file1

    24 $ cd !$:h

    ```


    The trick is the `:h` modifier. This is one of several modifiers available, but
    the only one I regularly use. When using a history shortcut, you can place a modifier
    at the end that starts with a colon. Here, the `!$` takes the last word from the
    previous command, (which you set to full directory path to the freshly-created
    file1 file). Then, the modifier `:h` strips off the file at the end, leaving just
    the directory name. I use this all the time to quickly hop into a folder of a
    file I just looked at.


    #### History Env Vars


    A quick note on environment variables that affect the history kept.


    Type this in and try and figure out what’s going on:


    ```

    25 $ bash

    26 $ HISTTIMEFORMAT="%d/%m/%y %T "

    27 $ history | tail

    28 $ HISTTIMEFORMAT="%d/%m/%y "

    29 $ history | tail

    30 $ HISTSIZE=2

    31 $ ls

    32 $ pwd

    33 $ history | tail

    34 $ tail ~/.bash_history

    35 $ exit

    36 $ history

    37 $ tail ~/.bash_history

    ```


    By default 500 commands are retained in your shell’s history. To change this setting,
    the `HISTSIZE` variable must be set to the number you want.


    There is also a `HISTFILESIZE` variable which determines the size of the history
    file itself. I did not get you to reduce the size of this to `1’, as it would
    have wiped your history file and you might have got cross with me! But you can
    play with it if you want.


    Finally, the `HISTTIMEFORMAT` determines what time format should be shown with
    the bash history item. By default it’s unset, so I usually set mine everywhere
    to be `%d/%m/%y %T` .


    You should have noticed that the `~/.bash_history` file did not get updated with
    the `ls` and `pwd` commands until bash exited. It’s a common source of confusion
    that the bash history is not written out until you exit. If your terminal connection
    freezes, your history from that session may never be written out. This frequently
    annoys me!


    #### History Control


    There’s another history-controlling environment variable worth understanding:


    ```

    38 $ HISTCONTROL=ignoredups:ignorespace

    39 $ ls

    40 $ ls

    41 $  pwd    # <- note the space before the ''pwd''

    42 $ pwd

    43 $ ls

    44 $ history | tail

    ```


    Was the output of history what you expected? `HISTCONTROL` can determine what
    gets stored in your history. The directives are separated by colons. Here we use
    `ignoredups` to tell history to ignore commands that are repeats of the last-recorded
    command. In the above input, the two consecutive `ls` commands are combined into
    one in the history. If you want to be really severe about your history, you can
    also use `erasedups`, which adds your latest command to the history, but then
    wipes all previous examples of the same command out of the history. What would
    this have done to the history output above?


    `ignorespace` tells bash to not record commands that begin with a space, like
    the `pwd` in the listing above.


    #### `CTRL-r`


    Bash offers you another means to use your history.


    Hit `CTRL` and hold it down. Then hit the ‘r’ key. You should see this on your
    terminal:


    ```

    (reverse-i-search)`'':

    ```


    Let go. Now type `grep`. You should see a previous grep command. If you keep hitting
    `CTRL+r` you will cycle through all commands that had grep in them, most recent
    first.


    If you want to cycle forward (if you hit `CTRL+r` too many times and go past the
    one you want (I do this a lot)), hit `CTRL+s`.


    #### Cleanup


    To clean up what you just did:


    ```

    45 $ cd .. && rm -rf lbthw_history

    ```


    #### What You Learned


    *   Where bash keeps a history of commands


    *   How to refer to previous commands


    *   How to re-run a previous command with simple adjustments


    *   How to pick out specific arguments from the previous command


    *   How to control the history output


    *   How to control the commands that are added to the history


    *   How to search through your history dynamically


