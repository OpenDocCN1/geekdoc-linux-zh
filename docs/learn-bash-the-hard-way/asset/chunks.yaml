  trans: "\n“回车符”（carriage return）正如其名称“return”所暗示的，是将光标“返回”到行首。它用字符‘r’表示。“换行符”（line\
    \ feed）同样如其名所示，是将行向上移动。在现代终端中，这仅仅意味着“将光标向下移动”。\n\n到目前为止，这些都非常清晰易懂。但是，Linux 的做法不同！在\
    \ Linux 中，`\\n` 就能同时完成这两个操作。而在 Windows 中，你需要同时使用 `\\r` 和 `\\n` 字符来表示新行。\n\n这意味着在\
    \ Linux 终端中文件中可能看起来很奇怪，每行末尾都会出现这些 `^M` 字符。为了让情况更复杂，某些程序会自动为你处理这种差异并向你隐藏它。\n\n\
    那么输出会是什么什么呢？\n\n```bash\n7 $ echo $'Bad magazine\\rMad'\n```\n\n这就是为什么能够查看文件中实际字节的方法很重要。这里有一个非常有用的工具派上了用场：`hexdump`\n\
    \n### Hexdump\n\n运行这个命令：\n\n```bash\n8 $ echo $'Bad magazine\\rMad' | hexdump\n\
    9 $ echo $'Bad magazine\\rMad' | hexdump -c\n```\n\nHexdump 将标准输入接收到的字符以十六进制数字打印出来。每行打印\
    \ 16 个字符，左侧显示到该行为止处理的字节数（同样以十六进制显示）。\n\n`-c` 标志以字符形式打印内容（包括控制字符，其前面会带有相应的反斜杠，例如\
    \ `\\n`），而省略该标志则只显示十六进制值。\n\n这是查看文本或任何字节输出流中*真实*发生了什么的的极佳方法。\n\n如果你回到本节的第一个示例：\n\
    \n```bash\n10 $ echo 'JUST THESE CHARACTERS' | hexdump -c\n11 $ echo -n 'JUST\
    \ THESE CHARACTERS' | hexdump -c\n```\n\n你可以自己发现发现 `echo` 中使用 `-n` 标志和不使用它的区别。\n\
    \n### 终端转义码 (Terminal Escape Codes)\n\n终端转义码是一个定义的字节序列，如果发送到终端，它将执行特定的操作。\n\n\
    运行这个：\n\n```bash\n12 $ echo $'\\033[?47h'\n13 $ echo $'\\033[?47l'\n```\n\n第一行“保存”了屏幕，第二行恢复它。\n\
    \nANSI 码始终以 `ESC` 字符（八进制为 `033`）和左括号字符开头：十六进制为 `1B`，然后是 `5b`。因此你可以将上述重写为：\n\n\
    ```bash\n14 $ echo $'\\x1b\\x5b?47h'\n15 $ echo $'\\x1b\\x5b?47l'\n```\n\n这些 ESC\
    \ 和左括号字符后面跟着特定的序列，它们可以改变屏幕颜色、背景文本、文本本身、设置屏幕宽度，甚至重新映射键盘键。\n\n输入这些内容，并在过程中尝试弄清楚它在做什么：\n\
    \n```bash\n16 $ ansi-test() {\n17 for a in 0 1 4 5 7\n18     do\n19     echo \"\
    a=$a \"\n20     for (( f=0; f<=9; f++ ))\n21     do\n22         for (( b=0; b<=9;\
    \ b++ ))\n23         do\n24             echo -ne \"\\\\033[${a};3${f};4${b}m\"\
    \n25             echo -ne \"\\\\\\\\\\\\\\\\033[${a};3${f};4${b}m\"\n26      \
    \       echo -ne \"\\\\033[0m \"\n27         done\n28         echo\n29     done\n\
    30     echo\n31 done\n32 echo\n33 }\n```\n\n这向你展示了所有的 ansi 终端转义码，你可以在终端中看到它们的作用。\n\
    \n有时当你 `cat` 一个二进制文件时（或者 `/dev/random`，它会输出随机字节）时，输出到终端的内容可能会导致终端看起来像“疯了”。这是因为这些转义码被这些文件中恰好存在的字节序列意外触发了。\n\
    \n### 玩转终端\n\n最后，是一些（可选的）趣味内容，它整合了你一路上学到的几项不同内容。它包含了一些（如 `trap`）内容，这些内容我们将在下一节中介绍，所以不用太担心理解它。\n\
    \n将此列表创建一个名为‘shiner’的文件，并运行它：\n\n```bash\n34 sh shiner\n```\n\n如果你喜欢，在之后将其删除即可。\n\
    \n```bash\n35 #!/bin/bash\n36 \n37 DATA[0]=\" _/ _/ _/ _/ \"\n38 DATA[1]=\" _/_/_/_/_/\
    \ _/_/_/ _/_/_/ _/_/_/ _/_/_/ \"\n39 DATA[2]=\" _/ _/ _/ _/ _/ _/ _/_/ _/ _/\"\
    \n40 DATA[3]=\"_/_/_/_/_/ _/ _/ _/ _/ _/_/ _/ _/ \"\n41 DATA[4]=\" _/ _/ _/_/_/\
    \ _/_/_/ _/_/_/ _/ _/ \"\n42 \n43 REAL_OFFSET_X=0\n44 REAL_OFFSET_Y=0\n45 \n46\
    \ draw_char() {\n47    V_COORD_X=$1\n48    V_COORD_Y=$2\n49 \n50    tput cup $((REAL_OFFSET_Y\
    \ + V_COORD_Y)) $((REAL_OFFSET_X + V_COORD_X))\n52 \n53    printf %c ${DATA[V_COORD_Y]:V_COORD_X:1}\n\
    54 }\n55 \n56 trap 'exit 1' INT TERM\n57 trap 'tput setaf 9; tput cvvis; clear'\
    \ EXIT\n58 \n59 tput civis\n60 clear\n61 \n62 while :; do\n63     for ((c=1; c\
    \ <= 7; c++)); do\n64         tput setaf $c\n65         for ((x=0; x<${#DATA[0]};\
    \ x++)); do\n66         for ((y=0; y<=4; y++)); do\n67         draw_char $x $y\n\
    68         done\n... \n```\n\n### 你学到了什么\n\n* 什么是终端代码\n* 什么是可打印字符和不可打印字符\n* 如何输出任何任意字节\n\
    * 如何使用 `CTRL-v` 输入字面字符\n* `\\n` 和 `\\r\\n` 的区别\n* 什么是终端转义码\n\n### 接下来做什么？\n\n\
    基于这些知识，接下来你将学习如何设置你的提示符（prompt），让它为你展示（甚至执行）有用的功能。\n\n### 清理\n\n你并不需要在在本节结束时进行清理，但如果输入错误，你的终端状态可能会无意中改变。\n\
    \n如果发生这种情况，请杀死或退出你的终端并重启 bash。\n\n### 练习题\n\n1) 研究并打印 `echo` 的所有转义序列。玩玩它们，并弄清楚它们的作用。\n\
    2) 研究并打印 10 个终端转义码。\n3) 查找所有的 `CTRL-v` 转义序列并对它们进行实验。\n4) 研究命令 `tput`，弄清楚它是做什么的，并使用它重写上面的一些命令。\n\
    5) 重新映射你的键盘，使用转义码输出错误的字符。\n\n### 提示符 (The Prompt)\n\n现在你已经学习了转义字符和特殊字符，你完全可以理解提示符是如何设置的。\n\
    \n你将学习：\n\n* 如何设置你的提示符\n* 其他类型的提示符以及相关的 shell 变量\n\n#### 这一节有多重要？\n\n这一节不是必不可少的，但大多数人发现学习它很有趣，也许很有玩。\n\
    \n#### PS1\n\n输入这个：\n\n```bash\n19 $ bash\n20 $ PS1='\\u@\\H:\\w \\# \\$ '\n21\
    \ $ ls\n22 $ exit\n```\n\n正如你记得的，bash 内部设置了一些 shell 变量，用于各种用途。其中之一就是 `PS1`，即你在每个命令完成后看到的提示符。\n\
    \n#### PS2\n\n现在尝试这个：\n\n```bash\n5 $ bash\n6 $ PS2='I am in the middle of something!>>>\
    \  \n7 $ cat > /dev/null << END\n8 some text\n9 END\n10 $ exit\n```\n\n`PS2` 变量是\
    \ shell 使用的“另一个”提示符，用于指示你正在为正在运行的程序提供输入。默认情况下，它被设置为 `>`，这就是为什么你在上面输入 `cat` 命令时看到那个提示。\n\
    \n#### PS3 和 PS4\n\n`PS3` 用于 `select` 循环结构。我们没有在书中介绍它，因为我很少见到它。\n\n`PS4` 是最后一个：\n\
    \n```bash\n11 $ bash\n12 $ PS4='> Value of PWD is: $PWD'\n13 $ set -x\n14 $ pwd\n\
    15 $ cd /tmp\n16 $ ls $(pwd)\n17 $ cd -\n18 $ exit\n```\n\n在跟踪模式下，PS4 会在每行跟踪输出之前打印。你记得跟踪模式是什么吗？\n\
    \n但为什么输出中的 `>` 是重复的？这指示了跟踪中的间接层（即子 shell）深度。每当脚本“进入”一层 shell，PS4 值的第一个字符就会重复。查看\
    \ `ls $(pwd)` 命令后的输出。\n\n#### 装饰你的提示符\n\n对于上面提到的所有 PS 变量，都有特殊的转义值可以用来让你的提示符显示有趣的信息。\n\
    \n尝试弄清楚这里发生了什么：\n\n```bash\n19 $ bash\n20 $ PS1='\\u@\\H:\\w \\# \\$ '\n21 $ ls\n\
    22 $ exit\n```\n\n下表可能帮助你理解：\n\n| 转义值 | 含义 | 备注 |\n| --- | --- | --- |\n| \\#\
    \ | 命令编号 | 命令的编号（从 1 开始 |\n|   |   | 递增 1） |\n|   |   | |\n\n"
- fmt: "\n| | | in this bash session. |\n| `\\$` | Root status | If you have root,\
    \ show a |\n| | | `#` sign, otherwise show |\n| | | `$` |\n| `\\t` | Current time\
    \ | In HH:MM:SS format - |\n| | | there are other formats |\n| | | possible with\
    \ eg `\\T`. |\n| `\\H` | Hostname | The hostname |\n| | | (fully-qualified) |\n\
    | `\\w` | Current working | |\n| | directory | |\n| `\\[` | Start control sequence\
    \ | Begin a sequence of |\n| | | non-printing characters, |\n| | | eg put a terminal\
    \ |\n| | | control sequence in a |\n| | | prompt. |\n\nUse your knowledge gained\
    \ so far to figure out what is going on here:\n\n```\n23 $ bash\n24 $ PS1='\\\
    [\\033[01;31m\\]PRODUCTION\\$ '\n25 $ PS1='\\[\\033[01;32m\\]DEV\\$ '\n26 $ exit\n\
    ```\n\nHow would you make this automatically happen on a given server when you\
    \ log in?\n\n### `PROMPT_COMMAND`\n\nAnother way the prompt can be affected is\
    \ with the bash variable `PROMPT_COMMAND`:\n\n```\n27 $ bash\n28 $ PROMPT_COMMAND='echo\
    \ \"Hello prompt $(date)\"'\n29 $ ls\n30 $ exit\n```\n\nEvery time the prompt\
    \ is displayed the `PROMPT_COMMAND` is treated as a command, and run.\n\nYou can\
    \ use this for all sorts of neat tricks!\n\n#### What You Learned\n\n- What the\
    \ `PS` variables are\n- Where each `PS` variable is used\n- How to augment your\
    \ prompts to give you useful information\n- How to automatically run commands\
    \ before each prompt is shown\n\n#### What Next?\n\nNext you will learn a very\
    \ useful technique for quickly creating files: the so-called ‘here doc’.\n\n####\
    \ Cleanup\n\nNo cleanup is required here, though you may want to set up a fresh\
    \ bash session in case your prompt has been changed.\n\n#### Exercises\n\n1) Look\
    \ up the other prompt escape characters and use them.\n2) Update your bash startup\
    \ files so that the prompt tells you useful information when you log in\n3) Create\
    \ your own version of the `history` command by using the `PROMPT_COMMAND` variable.\n\
    \n### Here Documents\n\nHere documents are one of the handiest tricks you will\
    \ have at your disposal. They allow you to embed the content of files directly\
    \ in your scripts without too much overhead.\n\nYou will cover:\n\n- What ‘here\
    \ documents’ are\n- What ‘here strings’ are\n- How they are used in shell scripts\n\
    \n#### How Important is this Section?\n\nHere documents, once learned, are used\
    \ frequently in bash scripts or on the command line. It’s a piece of knowledge\
    \ that separates the experienced user from the junior.\n\n#### Basic Here Docs\n\
    \nType this in to see the basic form of the here doc:\n\n```\n1 $ mkdir -p lbthw_heredocs\
    \ && cd lbthw_heredocs\n```\n\nThe first line starts with `cat` followed by a\
    \ redirection to a file.\n\nThen you use two left chevrons and follow that with\
    \ a string that represents a marker for the end of the file’s contents. In this\
    \ case, the word is `END`.\n\n```\n2 $ cat > afile.txt << END\n```\n\nThen you\
    \ type in whatever you want the file to contain.\n\n```\n3 A file can contain\n\
    4         whatever you like\n```\n\n(The whitespace in the second line above are\
    \ spaces.)\n\nWhen you’re done, you can finish the file by typing the string you\
    \ used as a marker on the first line alone on its own line:\n\n```\n5 END\n```\n\
    \nYou can check the contents of the file by just `cat`ing it:\n\n```\n6 $ cat\
    \ afile.txt\n```\n\nThe marker word does not need to be `END`! It could be anything\
    \ you choose. `END` is generally used as a convention. Sometimes you see `EOF`,\
    \ or `STOP`, or something similar. If you have a document with `END` in it, for\
    \ example, you might want to avoid problems with the document ending early by\
    \ choosing a different word.\n\n#### More Advanced Here Docs\n\nNow you‘re going\
    \ to put a ‘here’ document in a function. The function takes one argument. This\
    \ argument is used as a filename, and the function creates a simple script with\
    \ that filename that echoes the first argument given to that script.\n\nWill this\
    \ work? Read it carefully, predict the outcome, and then run it:\n\n```\n 7 $\
    \ function write_echoer_file {\n8         cat > $1 << END\n9 #!/bin/bash\n10 echo\
    \ $1\n11 END\n12         chmod +x $1\n13 }\n14 $ write_echoer_file echoer\n15\
    \ $ ./echoer 'Hello world'\n```\n\nHmmm. That didn’t work, because the `$1` got\
    \ interpreted in the `write_echoer_file` function as being the filename we passed\
    \ in. In the ‘here doc’, we wanted the `$1` characters to be put into the script\
    \ without being interpreted.\n\nTry this instead:\n\n```\n16 $ function write_echoer_file\
    \ {\n17         cat > $1 << 'END'\n18 #!/bin/bash\n19 echo $1\n20 END\n21    \
    \     chmod +x $1\n22 }\n23 $ write_echoer_file echoer\n24 $ ./echoer 'Hello world'\n\
    ```\n\nWait, I see a logic error in the provided text's line numbers or flow.\
    \ Let me re-format based on the provided text strictly.\n\n```\n16 $ function\
