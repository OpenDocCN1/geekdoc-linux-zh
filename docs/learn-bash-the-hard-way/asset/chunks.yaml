- fmt: "\nA ‘carriage return’ is, as the word ‘return’ suggests, ‘returns’ the cursor\
    \ to the start of the line. It’s represented by the character ‘r’ for return.\
    \ The ‘line feed’, again as the name suggests, feeds the line up. In a modern\
    \ terminal, this just means ‘move the cursor down’.\n\nSo far, so clear and simple\
    \ to learn. But, Linux does things differently! In Linux, `\\n` is sufficient\
    \ to do both. In Windows, you need both the `\\r` and `\\n` characters to represent\
    \ a new line.\n\nThis means that files can look strange in Linux terminals with\
    \ these weird `^M` characters showing at the end of each line. To confuse things\
    \ even more, some programs automatically handle the difference for you and hide\
    \ it from you.\n\nSo what will this output?\n\n```bash\n7 $ echo $'Bad magazine\\\
    rMad'\n```\n\nThis is why it’s important to have a way to see what the actual\
    \ bytes in a file are. Here a very useful tool comes in: `hexdump`\n\n### Hexdump\n\
    \nRun this:\n\n```bash\n8 $ echo $'Bad magazine\\rMad' | hexdump\n9 $ echo $'Bad\
    \ magazine\\rMad' | hexdump -c\n```\n\nHexdump prints out the characters received\
    \ in standard input as hex digits. 16 characters are printed per line, and on\
    \ the left is displayed the count (also in hex) of the number of bytes processed\
    \ up to that line.\n\nThe `-c` flag prints out the contents as characters (including\
    \ the control ones with appropriate backslashes in front, eg `\\n`, whereas leaving\
    \ it out just displays the hex values.\n\nIt’s a great way to see what is *really*\
    \ going on with text or any stream of output of bytes.\n\nIf you go back to the\
    \ first example in this section:\n\n```bash\n10 $ echo 'JUST THESE CHARACTERS'\
    \ | hexdump -c\n11 $ echo -n 'JUST THESE CHARACTERS' | hexdump -c\n```\n\nYou\
    \ can figure out for yourself the difference between using the `-n` flag in `echo`\
    \ and not using it.\n\n### Terminal Escape Codes\n\nA terminal escape code is\
    \ a defined sequence of bytes that, if sent to the terminal, will perform a specific\
    \ action.\n\nRun this:\n\n```bash\n12 $ echo $'\\033[?47h'\n13 $ echo $'\\033[?47l'\n\
    ```\n\nThe first line ‘saves’ the screen and the second restores it.\n\nThe ANSI\
    \ codes always start with the `ESC` character (`033` in octal) and left bracket\
    \ character: in hex `1B`, then `5b`. So you could rewrite the above as:\n\n```bash\n\
    14 $ echo $'\\x1b\\x5b?47h'\n15 $ echo $'\\x1b\\x5b?47l'\n```\n\nThese ESC and\
    \ left bracket characters are then followed by specific sequences which can change\
    \ the color of the screen, the background text, the text itself, set the screen\
    \ width, or even re-map keyboard keys.\n\nType this out and see if you can figure\
    \ out what it’s doing as you go:\n\n```bash\n16 $ ansi-test() {\n17 for a in 0\
    \ 1 4 5 7\n18     do\n19     echo \"a=$a \"\n20     for (( f=0; f<=9; f++ ))\n\
    21     do\n22         for (( b=0; b<=9; b++ ))\n23         do\n24            \
    \ echo -ne \"\\\\033[${a};3${f};4${b}m\"\n25             echo -ne \"\\\\\\\\\\\
    \\\\\\033[${a};3${f};4${b}m\"\n26             echo -ne \"\\\\033[0m \"\n27   \
    \      done\n28         echo\n29     done\n30     echo\n31 done\n32 echo\n33 }\n\
    ```\n\nThat shows you what all the ansi terminal escape codes are and you can\
    \ see what they do in the terminal.\n\nSometimes when you `cat` a binary file,\
    \ (or `/dev/random`, which outputs random bytes) the contents when output to a\
    \ terminal can cause the terminal to appear to ‘go haywire’. This is because these\
    \ escape codes are accidentally triggered by the sequences of bytes that happen\
    \ to exist in these files.\n\n### Fun With Terminals\n\nFinally, some (optional)\
    \ fun which pulls together a few different things you’ve learned along the way.\
    \ It includes a couple of things (like `trap`) which we cover in the next section,\
    \ so don’t stress too much about understanding it.\n\nCreate this listing as a\
    \ file called ‘shiner’, and run it with:\n\n```bash\n34 sh shiner\n```\n\nand\
    \ remove it afterwards if you like.\n\n```bash\n35 #!/bin/bash\n36 \n37 DATA[0]=\"\
    \ _/ _/ _/ _/ \"\n38 DATA[1]=\" _/_/_/_/_/ _/_/_/ _/_/_/ _/_/_/ _/_/_/ \"\n39\
    \ DATA[2]=\" _/ _/ _/ _/ _/ _/ _/_/ _/ _/\"\n40 DATA[3]=\"_/_/_/_/_/ _/ _/ _/\
    \ _/ _/_/ _/ _/ \"\n41 DATA[4]=\" _/ _/ _/_/_/ _/_/_/ _/_/_/ _/ _/ \"\n42 \n43\
    \ REAL_OFFSET_X=0\n44 REAL_OFFSET_Y=0\n45 \n46 draw_char() {\n47    V_COORD_X=$1\n\
    48    V_COORD_Y=$2\n49 \n50    tput cup $((REAL_OFFSET_Y + V_COORD_Y)) $((REAL_OFFSET_X\
    \ + V_COORD_X))\n52 \n53    printf %c ${DATA[V_COORD_Y]:V_COORD_X:1}\n54 }\n55\
    \ \n56 trap 'exit 1' INT TERM\n57 trap 'tput setaf 9; tput cvvis; clear' EXIT\n\
    58 \n59 tput civis\n60 clear\n61 \n62 while :; do\n63     for ((c=1; c <= 7; c++));\
    \ do\n64         tput setaf $c\n65         for ((x=0; x<${#DATA[0]}; x++)); do\n\
    66         for ((y=0; y<=4; y++)); do\n67         draw_char $x $y\n68        \
    \ done\n69         done\n70     done\n71 done\n```\n\n### What You Learned\n\n\
    * What terminal codes are\n* What printable and non-printable characters are\n\
    * How to output any arbitrary bytes\n* How to input a literal character using\
    \ `CTRL-v`\n* The difference between `\\n` and `\\r\\n`\n* What terminal escape\
    \ codes are\n\n### What Next?\n\nBuilding on this knowledge, next you will learn\
    \ how to set up your prompt so that it can show you (and even do) useful things.\n\
    \n### Cleanup\n\nYou don’t necessarily need to clean up at the end of this section,\
    \ but your terminal may have inadvertently changed state if input was wrongly\
    \ made.\n\nIf this happens, kill or exit your terminal and restart bash.\n\n###\
    \ Exercises\n\n1) Research and echo all of `echo’s escape sequences. Play with\
    \ them and figure out what they do.\n2) Research and echo 10 terminal escape sequences.\n\
    3) Look up all the `CTRL-v` escape sequences and experiment with them.\n4) Research\
    \ the command `tput`, figure out what it does and rewrite some of the above commands\
    \ using it.\n5) Re-map your keyboard so it outputs the wrong characters using\
    \ escape codes.\n\n### The Prompt\n\nNow that you’ve learned about escapes and\
    \ special characters you are in a position to understand how the prompt can be\
    \ set.\n\nYou will learn:\n\n* How to set up your prompt\n* Other types of prompts\
    \ and related shell variables\n\n#### How Important is this Section?\n\nThis section\
    \ is not essential, but most people find it interesting and maybe fun to learn\
    \ about.\n\n#### The PS1\n\nType this:\n\n```bash\n19 $ bash\n20 $ PS1='\\u@\\\
    H:\\w \\# \\$ '\n21 $ ls\n22 $ exit\n```\n\nAs you’ll remember, there are some\
    \ shell variables that are set within bash that are used for various purposes.\
    \ One of these is `PS1`, which is the prompt you see after each command completed.\n\
    \n#### The PS2\n\nNow try this:\n\n```bash\n5 $ bash\n6 $ PS2='I am in the middle\
    \ of something!>>>  \n7 $ cat > /dev/null << END\n8 some text\n9 END\n10 $ exit\n\
    ```\n\nThe PS2 variable is the ‘other’ prompt that the shell uses to indicate\
    \ that you are prompted for input to a program that is running. By default this\
    \ is set to `>`, which is why you see that as the prompt when you normally type\
    \ the `cat` command above.\n\n#### PS3 and PS4\n\n`PS3` is used by the `select`\
    \ looping structure. We don’t cover that in this book as I’ve barely ever seen\
    \ it.\n\n`PS4` is the last one:\n\n```bash\n11 $ bash\n12 $ PS4='> Value of PWD\
    \ is: $PWD'\n13 $ set -x\n14 $ pwd\n15 $ cd /tmp\n16 $ ls $(pwd)\n17 $ cd -\n\
    18 $ exit\n```\n\nIn trace mode PS4 is echoed before each line of trace output.\
    \ Do you remember what trace mode is?\n\nBut why is the `>` in the output repeated?\
    \ This indicates the level of indirection (ie subshells) in the trace. Every time\
    \ the script goes one level ‘down’ a shell, the first character in the PS4 value\
    \ is repeated. Look at the output after the `ls $(pwd)` command.\n\n#### Pimp\
    \ Your Prompt\n\nFor all the PS variables mentioned above, there are special escape\
    \ values that can be used to make your prompt display interesting information.\n\
    \nSee if you can figure out what is going on here:\n\n```bash\n19 $ bash\n20 $\
    \ PS1='\\u@\\H:\\w \\# \\$ '\n21 $ ls\n22 $ exit\n```\n\nThe table below may help\
    \ you understand:\n\n| Escape value | Meaning | Notes |\n| --- | --- | --- |\n\
    | \\# | Command number | The number (starting |\n|   |   | from 1 and incrementing\
    \ |\n|   |   | by one) of the command |\n"
