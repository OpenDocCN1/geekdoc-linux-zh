    \ already exists or not. The `>>` operator, by contrast, *appends* to the end\
    \ of the file. As a result, only `line2` and `line3` are added to `file3`.\n\n\
    #### Cleanup\n\nNow clean up what you just did:\n\n```\n19 $ cd ..\n20 $ rm -rf\
    \ lbthw_pipes_redirects\n```\n\n#### What You Learned\n\n*   What file redirection\
    \ is\n\n*   What pipes do\n\n*   The differences between standard output and standard\
    \ error\n\n*   How to redirect standard output to the same location as standard\
    \ error (and vice versa)\n\n*   How to redirect standard output or standard error\
    \ (or both) to a file\n\n#### What Next?\n\nYou’re nearly at the end of the first\
    \ section. Next you will learn about creating shell scripts, and what happens\
    \ when bash starts up.\n\n#### Exercises\n\n1) Try a few different commands and\
    \ work out what output goes to standard output and what output goes to standard\
    \ error. Try triggering errors by misusing programs.\n\n2) Write commands to redirect\
    \ standard output to file descriptor ‘3’.\n\n3) Research what the `|&` pipe operator\
    \ does. If you can’t find out, try the command `cat file2 |& grep -c file` and\
    \ see what changes compared to when you ran it above.\n\n### Scripts and Startups\n\
    \nThis section considers two related subjects:\n\n*   Shell scripts\n\n*   What\
    \ happens when the shell is started up\n\nYou’ve probably come across shell scripts,\
    \ which won’t take long to cover, but shell startup is a useful but tricky topic\
    \ that catches most people out at some point, and is worth understanding well.\n\
    \n#### How Important is this Section?\n\nThis section is essential reading.\n\n\
    #### Shell Scripts\n\n```\n1 $ mkdir -p lbthw_scripts_and_startups\n2 $ cd lbthw_scripts_and_startups\n\
    ```\n\nA shell script is simply a collection of shell commands that can be run\
    \ non-interactively. These can be quick one-off scripts that you run, or very\
    \ complex programs.\n\n#### The Shebang\n\nRun this:\n\n```\n3 $ echo '#!/bin/bash'\
    \ > simple_script\n4 $ echo 'echo I am a script' >> simple_script\n```\n\nYou\
    \ have just created a file called ‘simple_script’ that has two lines in it. The\
    \ first consists of two special characters: the hash and the exclamation mark.\
    \ This is often called ‘shebang’, or ‘hashbang’ to make it easier to say. When\
    \ the operating system is given a file to run as a program, if it sees those two\
    \ characters at the start, it knows that the file is to be run under the control\
    \ of another program (or ‘interpreter’ as it is often called).\n\nNow try running\
    \ it:\n\n```\n5 $ ./simple_script\n```\n\nThat should have failed. Before we explain\
    \ why, let’s understand the command.\n\nThe `./` characters at the start of the\
    \ above command tells the shell that you want to run this file from within the\
    \ context of the current working directory. It’s followed by the filename to run.\n\
    \nSimilarly, the `../` characters indicate that you want to run from the directory\
    \ above the current working directory.\n\nThis:\n\n```\n 6 $ mkdir tmp\n 7 $ cd\
    \ tmp\n 8 $ ../simple_script\n 9 $ cd ..\n10 $ rm -rf tmp\n```\n\nwill give you\
    \ the same output as before.\n\n#### The Executable Flag\n\nThat script will have\
    \ failed because the file was not marked as executable, so you will have got an\
    \ error saying permission was denied.\n\nTo correct this, run:\n\n```\n11 $ chmod\
    \ +x simple_script\n12 $ ./simple_script\n```\n\nThe chmod program changes the\
    \ permissions (or ‘modes’ on a file), so that only certain users, or groups of\
    \ users can read, write or execute (ie run as a program) a file.\n\n#### The `PATH`\
    \ Variable\n\nWhat happens if you don’t specify the `./` and just run:\n\n```\n\
    13 $ simple_script\n```\n\nThe truth I won’t know what happens. Either you’ll\
    \ get an error saying it can’t find it, or it will work as before.\n\nThe reason\
    \ I don’t know is that it depends on how your `PATH` variable is set up in your\
    \ environment.\n\nIf you run this you will see your `PATH` variable:\n\n```\n\
    14 $ echo $PATH\n```\n\nYour output may vary. For example, mine is:\n\n```\n/home/imiell/perl5/bin:/opt/local/bin:/opt/local/sbin:/Users/imiell/google-cloud-sdk\\\
    \n/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/X11/bin:/space/git/shutit:/sp\\\
    \nace/git/work/bin:/space/git/home/bin:~/.dotfiles/bin:/space/go/bin\n```\n\n\
    The `PATH` variable is a set of directories, separated by colons. It could be\
    \ as simple as:\n\n```\n/usr/sbin:/usr/bin\n```\n\nfor example.\n\nThese are the\
    \ directories bash looks through to find commands, in order.\n\nSo what sets up\
    \ the `PATH` variable if you did not? The answer is: bash startup scripts.\n\n\
    But before we discuss them, how can we make sure that simple_script can be run\
    \ without using `./` at the front?\n\n```\n15 $ PATH=${PATH}:.\n16 $ simple_script\n\
    ```\n\nThat’s how! In the first line you set the `PATH` to itself, plus the current\
    \ working directory. It then looks through all the directories that were previously\
    \ set in your `PATH` variable, and then finally tries the `.’, or local folder,\
    \ as we saw before.\n\n#### Startup Scripts\n\nUnderstanding startup scripts and\
    \ environment variables are key to a lot of issues that you can end up spending\
    \ a lot of time debugging! If something works in one environment and not in another,\
    \ the answer is often a difference in startup scripts and how they set up an environment.\n\
    \n#### Startup Explained\n\nWhen bash starts up, it calls and runs a series of\
    \ files to set up the environment you arrive at the terminal. If you’ve ever noticed\
    \ that bash can ‘pause’ before giving you a prompt, it may be because the startup\
    \ script is performing a command in the foreground.\n\nHave a look at this diagram:\n\
    \n![](images/shell-startup-actual.png)\n\nYes, this can be confusing.\n\nThe diagram\
    \ shows the startup script order for different shells in different contexts. Each\
    \ context is shown by following a separate color through the diagram.\n\nWe are\
    \ going to follow (from the top) the path from the ‘bash’ bubble, and ignore the\
    \ ‘zsh’ and ‘sh’ paths, but it’s interesting to note they have their own separate\
    \ paths (in the case of zsh) and join up at points (in the case of ‘sh’ and ‘bash’).\n\
    \nAt each point in this graph the shell you choose either makes a decision about\
    \ which path to follow (eg whether the shell is ‘interactive’ or not), or runs\
    \ a script if the color has already been determined from these decisions.\n\n\
    We’ll walk through this below, which should make things clearer.\n\n#### When\
    \ You Run Bash\n\nSo which path does it take when you run `bash` on the command\
    \ line? You’re going to follow the graph through here.\n\nThe first decision you\
    \ need to make is whether bash is running ‘normally’ or as a ‘remote’ shell. Obviously,\
    \ you ran bash on a terminal, so it’s ‘normal’.\n\nFrom there, you decide if this\
    \ is a ‘login’ or a ‘non-login’ shell. You did not login when you ran bash, so\
    \ follow ‘non-login’.\n\nThe final decision is whether bash is running interactively\
    \ (ie can you type things in, or is bash running a script?). You are on an interactive\
    \ shell, so follow ‘interactive’.\n\nNow, whichever color line you have followed\
    \ up to this point, continue with: those files are the ones that get run when\
    \ bash is started up.\n\nIf the file does not exist, it is simply ignored.\n\n\
    #### Beware\n\nTo *further* complicate things, these scripts can be made to call\
    \ each other in ways that confuse things if you simply believe that diagram. So\
    \ be careful!\n\n#### The `source` Builtin\n\nNow that you understand builtins,\
    \ shell scripts, and environments, it’s a good time to introduce another builtin:\
    \ `source`.\n\n```\n17 $ MYVAR=Hello\n18 $ echo 'echo $MYVAR' > simple_echo\n\
    19 $ chmod +x simple_echo\n20 $ ./simple_echo\n21 $ source simple_echo\n```\n\n\
    I’m sure you can figure out from that that `source` runs the script from within\
    \ the same shell context. If you didn’t see that, do it again, and think carefully\
    \ about what each command is doing.\n\n#### Avoiding Startup Scripts"
