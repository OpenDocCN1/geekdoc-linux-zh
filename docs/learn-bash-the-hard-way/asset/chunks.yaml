    \ echo $?\n```\n\n你预料到此吗？`grep` 成功结束了（没有段错误或内存故障，没有被杀死等），但没有匹配到任何行，它返回 `1` 作为退出码。因此，`grep`\
    \ 使用退出码 `0` 表示“匹配”，使用退出码 `1` 表示“未匹配”。\n\n从某方面来说这是很棒的，因为你可以这样写 `if` 语句：\n\n```bash\n\
    19 $ if grep grepme afile.txt\n20 then\n21         echo 'matched!'\n22 fi\n```\n\
    \n另一方面，这意味着你无法确定某个退出码对于特定程序的终止意味着什么。我几乎每次都必须查询 `grep` 的退出码，如果我使用一个程序的退出码，我会确保先做几次测试，以确保我知道将发生什么！\n\
    \n### 设置你自己的退出码\n\n如果你在编写脚本，可以通过使用 `exit` 内置命令来设置函数的退出码。你可以简单地通过进入一个新的 `bash`\
    \ 进程并退出它来模拟这一点。\n\n```bash\n23 $ bash\n24 $ exit 67\n25 $ echo $?\n```\n\n如果你在编写一个函数，可以使用\
    \ `return` 内置命令来设置函数的退出码。\n\n输入这些：\n\n```bash\n26 $ bash\n27 $ function trycmd\
    \ {\n28         $1\n29         if [[ $? -eq 127 ]]\n30         then\n31      \
    \           echo 'What are you doing?'\n32                 return 1\n33      \
    \   fi\n34 }\n35 $ trycmd ls\n36 $ trycmd doesnotexit\n37 $ exit\n```\n\n### 其他特殊参数\n\
    \n变量 `$?` 是 `special parameter`（特殊参数）的一个例子。我不确定为什么它们被称为“特殊参数”而不是“特殊变量”，但也许是因为它们与函数和脚本的普通参数（`$1`、`2`\
    \ 等）一起，被视为这些上下文中自动分配的变量。\n\n下面的列表中使用了两个最重要的参数。尝试根据语境弄清楚它们是什么：\n\n```bash\n38 $\
    \ ps -ef | grep bash | grep $$\n39 $ sleep 999 &\n40 $ echo $!\n```\n\n如果你仍然卡住了，请运行\
    \ `man bash` 查看 `bash` 帮助页。\n\n### 清理\n\n现在清理你刚才的操作：\n\n```bash\n41 $ rm afile.txt\n\
    ```\n\n### 你学到了什么\n\n*   什么是退出码\n*   一些标准退出码及其意义\n*   并非所有应用程序都相同的方式使用退出码\n* \
    \  测试和退出码是如何协同工作的\n*   一些特殊参数\n\n### 接下来做什么？\n\n接下来你将学习测试，它允许你以灵活且动态的方式将目前所学到的知识应用到你的\
    \ `bash` 代码条件判断中。\n\n### 练习\n\n1.  查询 `git` 在什么情况下会返回非零退出码。\n2.  查询所有的“特殊参数”并查看它们的作用。玩玩它们。研究一下在什么情况下你可能想要使用它们。\n\
    \n### 测试\n\n测试是 `bash` 脚本的基础部分，无论是命令行中的单行命令，还是大得多的脚本中。\n\n主题可能会变得非常复杂且混乱。在本节中，我将向你展示一些陷阱，并为实际的\
    \ `bash` 使用提供法则。\n\n`bash` 中的测试不像测试你的程序是否运行良好的测试。它是一种编写可以为真或为假的表达式的方法。\n\n在本节中，你将学习：\n\
    \n*   什么是 `bash` 测试\n*   编写 `bash` 测试的不同方式\n*   逻辑运算符\n*   二元运算符和一元运算符\n*   `if`\
    \ 语句\n\n#### 这一节有多重要？\n\n这一节非常重要，因为它涵盖了 `[` 和 `]`。\n\n#### 什么是测试？\n\n`bash` 中的测试是一种编写可以为真或为假的表达式的方法。\n\
    \n#### 逻辑运算符\n\n你预料以下代码的输出：\n\n```bash\n19 $ [ 1 -eq 1 ] && echo \"true\" || echo\
    \ \"false\"\n20 $ [ 1 -eq 2 ] && echo \"true\" || echo \"false\"\n```\n\n####\
    \ `[[` 运算符\n\n`[[` 运算符与 `test` 运算符非常相似，只是使用了两个方括号而不是一个。\n\n"
- fmt: "\n```\n[ x = 'x' ]\n```\n\nYou can frequently come across code like this:\n\
    \n```\n30 $ [[ \"x$DOESNOTEXIST\" = \"x\" ]]\n```\n\nwhere users have put quotes\
    \ on both sides *as well as* an `x` and put in double brackets. Only one of these\
    \ protections is needed, but people get used to adding them on as superstitions\
    \ to their `bash` scripts. And it doesn’t seem to do any harm.\n\nOnce again,\
    \ you can see understanding how quotes work is critical to bash mastery!\n\nOh,\
    \ and `[[` doesn’t like the `-a` (and) and `-o` (or) operators.\n\nSo `[[` can\
    \ handle some edge cases when using `[`. There are some other differences, but\
    \ I won’t cover them here.\n\n### Confused?\n\nYou’re not alone. In practice,\
    \ I follow most style guides and always use `[[` until there is a good reason\
    \ not to.\n\nIf I come across some tricky logic in code I need to understand,\
    \ I just look it up there and then, usually in the `bash` man page.\n\n### Unary\
    \ and Binary Operators\n\nThere are other shortcuts relating to `test` (and its\
    \ variants) that it’s worth knowing about. The first set take a single argument\
    \ and are called ‘unary’ operators:\n\n```\n31 $ echo $PWD\n32 $ [ -z \"$PWD\"\
    \ ]\n33 $ echo $?\n34 $ unset DOESNOTEXIST\n35 $ [ -z \"$DOESNOTEXIST\" ]\n36\
    \ $ echo $?\n37 $ [ -z ]\n38 $ echo $?\n```\n\nIf your `$PWD` environment variable\
    \ is set (it usually is), then the `-z` will return `false`. This is because `-z`\
    \ returns true only if the argument is an empty string. Interestingly, this test\
    \ is OK with no argument! Just another confusing point about tests…\n\nThere are\
    \ quite a few unary operators so I won’t cover them all here. The ones I use most\
    \ often are `-a` and `-d`:\n\n```\n39 $ mkdir lbthw_tests_dir\n40 $ touch lbthw_tests_file\n\
    41 $ [ -a lbthw_tests_file ]\n42 $ echo $?\n43 $ [ -d lbthw_tests_file ]\n44 $\
    \ echo $?\n45 $ [ -a lbthw_tests_dir ]\n46 $ echo $?\n47 $ [ -d lbthw_tests_dir\
    \ ]\n48 $ echo $?\n49 $ rmdir lbthw_tests_dir\n50 $ rmdir lbthw_tests_file\n```\n\
    \nThese are called ‘unary operators’ because they take one argument.\n\nThere\
    \ are many of these unary operators, but the differences between them are useful\
    \ only in the rare cases when you need them. Generally I just use `-d`, `-a`,\
    \ and `-z` and look up the others when I need something else.\n\nWe’ll cover ‘binary\
    \ operators’, which work on two arguments, while covering types in bash.\n\n###\
    \ Types\n\nType-safety (if you’re familiar with that concept from other languages)\
    \ does not come up often in bash as an issue. But it is still significant. Try\
    \ and work out what’s going on here:\n\n```\n51 $ [ 10 < 2 ]\n52 $ echo $?\n53\
    \ $ [ '10' < '2' ]\n54 $ echo $?\n55 $ [[ 10 < 2 ]]\n56 $ echo $?\n57 $ [[ '10'\
    \ < '2' ]]\n58 $ echo $?\n```\n\nFrom this you should be able to work out that\
    \ the `<` operator expects strings, and that this is another way `[[` protects\
    \ you from the dangers of using `[`.\n\nIf you can’t work it out, then re-run\
    \ the above and play with it until it makes sense to you!\n\nThen run this:\n\n\
    ```\n59 $ [ 10 -lt 2 ]\n60 $ echo $?\n61 $ [ 1 -lt 2 ]\n62 $ echo $?\n63 $ [ 10\
    \ -gt 1 ]\n64 $ echo $?\n65 $ [ 1 -eq 1 ]\n66 $ echo $?\n67 $ [ 1 -ne 1 ]\n68\
    \ $ echo $?\n```\n\nThe binary operators used above are: `-lt` (less than), `-gt`\
    \ (greater than), `-eq` (equals), and `-ne` (not equals). They deal happily with\
    \ integers in single bracket tests.\n\n### `if` Statements\n\nNow you understand\
    \ tests, if statements will be easy!\n\nType this:\n\n```\n69 $ if [[ 10 -lt 2\
    \ ]]\n70 then\n71   echo 'does not compute'\n72 elif [[ 10 -gt 2 ]]\n73 then\n\
    74   echo 'computes'\n75 else\n76   echo 'does not compute'\n77 fi\n```\n\n`if`\
    \ statements consist of a test, followed by the word `then`, the commands to run\
    \ if that `if` returned ’true’. If it returned false, it will drop to the next\
    \ `elif` statement if there is another test, or `else` if there are no more tests.\
    \ Finally, the if block is closed with the `fi` string.\n\nThe `else` or `elif`\
    \ blocks are not required. For example, this will also work:\n\n```\n78 $ if [[\
    \ 10 -lt 2 ]]; then echo 'does not compute'; fi\n```\n\nas the newline can be\
    \ replaced by a semi-colon, which indicates the end of the expression.\n\n###\
    \ Bare `if` Statements\n\nIt’s easy to forget that the `if` statement in bash\
    \ does not need angle brackets at all. If the code between the `then` and the\
    \ `if` is a bash command, then it will trigger if the exit code of the command\
    \ was ‘true’.\n\nWhat will this output? No cheating!\n\n```\n79 $ if grep not_there\
    \ /dev/null\n80 then\n81     echo there\n82 else\n83     echo not there\n84 fi\n\
    ```\n\n### What You Learned\n\nWe covered quite a lot in this section!\n\n* What\
    \ a ‘test’ is in bash\n* How to compare values within a test\n* What the program\
    \ `[` is\n* How to perform logic operations with tests\n* Some differences between\
    \ `[` and `[[`\n* The difference between unary and binary operators\n* How types\
    \ can matter in bash, and how to compare them\n* `if` statements and tests\n\n\
    ### What Next?\n\nNext you will cover another fundamental aspect of bash programming:\
    \ loops.\n\n### Exercises\n\n1. Research unary operators, see `man`.\n2. Create\
    \ a `while` loop and `until` loop.\n3. Write a script using `wc` to count files.\n\
    \n### Loops\n\nLike almost any language, bash has loops.\n\n### `for` Loops\n\n\
    We’ll cover `for` loops, `case` statements, and `while` loops.\n\n### How Important\
    \ is this?\n\nIn this section, we will explore various forms of `for` loops.\n\
    \n### `for` Loops\n\nCreate a new folder:\n\n```bash\n1 mkdir lbthw_tests_dir\n\
    cd lbthw_tests_dir\n```\n\nFirst `for` loops:\n\n```bash\n2 $ for i=0; i<20; i++\n\
    3 do\n   echo $i\n4 done\n```\n\nThere’s no `$` sign variable:\n\n```bash\n7 $\
    \ for f in $(ls)\n8 do\n   echo \"File $f contains: $(cat $f)\"\n9 done\n```\n\
    \nWe could have written something:\n\n```bash\n11 $ for f in file1.txt file2.txt\
    \ file3.txt\n12 do\n   echo \"File $f contains: $(cat $f)\"\n14 done\n```\n\n\
    with a similar effect.\n\n### `while` and `until`\n\nWhile loops also exist in\
    \ bash. Try and work out what’s going on in this example:\n\n```bash\n15 $ n=0\n\
    16 $ while [[ ! -a newfile ]]\n17 do\n18         ((n++))\n19         echo \"In\
    \ iteration $n\"\n20         if [[ $(cat file${n}.txt) == \"15\" ]]\n21      \
    \   then\n22                 touch newfile\n23         fi\n24 done\n```\n\nI often\
    \ use while loops in this ‘infinite loop’ form when running quick scripts on the\
    \ command line:\n\n```bash\n25 $ n=0\n26 $ while true\n27 do\n28         ((n++))\n\
    29         echo $n seconds have passed\n30         sleep 1\n31         if [[ $n\
    \ -eq 60 ]]\n32         then\n33                 break\n34         fi\n35 done\n\
    ```\n\n### `case` Statements\n\nCase statements may also be familiar from other\
    \ languages. In bash, they’re most frequently used when processing command-line\
    \ arguments within a script.\n\nBefore you look at a realistic case statement,\
    \ type in this trivial one:\n\n```bash\n36 $ a=1\n37 $ case \"$a\" in\n38 1) echo\
    \ 'a is 1'; echo 'ok';;\n39 2) echo 'a is 2'; echo 'ok';;\n40 *) echo 'a is unmatched';\
    \ echo 'failure';;\n41 esac\n```\n\nTry triggering the ‘a is 2’ case, and the\
    \ ‘a is unmatched’ case.\n\nThere are a few of new bits of syntax you may not\
    \ have seen before.\n"
