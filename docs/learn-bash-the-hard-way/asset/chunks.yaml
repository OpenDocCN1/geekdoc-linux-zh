    ## `()` vs `{}`


    One source of confusion is the difference between these two ways of grouping commands.


    First, try replacing the `(` and `)` in the above listing with curlies (`{` and
    `}`) and see what happens.


    Then, try these:


    ```

    30 $ ( echo output ) >> logfile

    31 $ { echo output } >> logfile

    ```


    Hmmm. Hit `CTRL+c` to get out.


    The curlies need a semicolon to indicate the end.


    ```

    32 $ { echo output ; } >> logfile

    ```


    This is because the curlies are a `grouping command` and need an indication of
    when the command has been completed. No subshell is created. The environment,
    `variables`, current working directory, indeed the entire context are the same
    as the surrounding code.


    ### Subshells and Working Directory


    Another useful feature of subshells is that if you change folder, then that folder
    change only applies within the `sub-shell`. When you return, you go back to where
    you were.


    Let’s see this in action. First show where you are:


    ```

    33 $ pwd

    ```


    Then, in a subshell, create a folder, move into it, and show you have moved with
    another call to `pwd`.


    ```

    34 $ ( mkdir lbthw_subshells_2

    35 > cd lbthw_subshells_2

    36 > pwd )

    ```


    Now the subshell has run, and without doing anything other than `cd`ing to a new
    folder, we are returned to the folder we were in before the subshell started:


    ```

    35 $ pwd

    ```


    This is a very useful feature of subshells when you’re scripting, to save repeated
    `cd` and `cd -` commands.


