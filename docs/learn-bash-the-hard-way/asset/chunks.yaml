    如果你一直在仔细学习这门课程，你会发现一些可以改进的地方。如果是这种情况，请参阅练习部分了解如何操作！


    ## 你学到了什么


    在本节中，你并没有学到任何特定的新知识，但我希望你已经明确了 `bash` 的用途不仅仅是“单行命令”。


    ## 清理


    你现在应该已经熟悉流程了。


    ## 练习


    1) 为 `cheapci` 寻找改进方案并以 pull request（拉请求）的形式提交。如果你不熟悉 pull request 的流程，请在 `GitHub`
    上创建一个账户，通过添加 issue 并填写表单来提出你的更改。


    ## 完成！


    干得好！你已经完成了这门课程。


    课程的目标是让你理解 `bash` 的核心概念，以便你能够：


    * 清楚 `bash` 的功能

    * 能够深化对 `bash` 核心概念的理解


    如果非要用一句话来总结，我认为这门课程应该让你在面对遇到的任何 `bash` 问题时，永远不会感到惊讶或无所措。


    希望这就是你从课程中获得的收获！


    欢迎通过邮件 `ian@mail.meirionconsulting.com` 或 Twitter `@ianmiell` 向我反馈和评论。


    请注意，我也为任何感兴趣的人提供 `Git`、`Bash` 和 `Docker` 的培训。如果你想了解更多信息，请随时联系我。

