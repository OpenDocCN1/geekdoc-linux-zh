    \        a) MAIL_CMD=$OPTARG ;;\n        q) PRE_SCRIPT=$OPTARG ;;\n        w)\
    \ POST_SCRIPT=$OPTARG ;;\n        t) MAIL_CMD_ATTACH_FLAG=$OPTARG ;;\n       \
