    20 END\n21 $ chmod +x trap_exit.sh\n22 $ ./trap_exit.sh # NOW HIT CTRL-c\n```\n\
    \nWhat’s going on? In the second listing you used the `trap` builtin to inhibit\
    \ the default response of the trap_exit process in the bash process and replace\
    \ it with another response. In this case, the first argument to the `trap` builtin\
    \ is evaluated and run as a command (`echo trapped`).\n\nSo how to get out of\
    \ it and kill off the process?\n\n```\n22 $ # HIT CTRL-z\n23 $ kill %1\n```\n\n\
    #### Trap Exit\n\nIn addition to the normal signal name traps, there are some\
    \ special ones.\n\nType this out:\n\n```\n24 $ cat > trap_exit.sh << END\n25 #!/bin/bash\n\
    26 trap \"echo trapped\" EXIT\n27 sleep 999 &\n28 wait\n29 END\n30 $ chmod +x\
    \ trap_exit.sh\n31 $ ./trap_exit.sh &\n32 $ TRAP_EXIT_PID=$(echo ${!})\n33 $ kill\
    \ -15 ${TRAP_EXIT_PID}\n```\n\nWhich signal did we use there?\n\nThe `EXIT` trap\
    \ catches the termination of the script and runs. Try it with `-2` as well.\n\n\
    Now run this:\n\n```\n34 $ ./trap_exit.sh &\n35 $ TRAP_EXIT_PID=$(echo ${!})\n\
    36 $ kill -9 ${TRAP_EXIT_PID}\n```\n\nSome of the signals are not trap-able! Why\
    \ do you think this is?\n\nExperiment with some other signals to determine how\
    \ `EXIT` handles them.\n\nWhat is the name of the `-9` signal? Is this the default\
    \ that the `kill` command uses?\n\n#### A Note About Process Groups\n\nYou may\
    \ have noticed that in the above script you used the `wait` command after putting\
    \ the process in the background.\n\nThe wait command is a bash builtin that returns\
    \ when the child processes of the bash process completes."
