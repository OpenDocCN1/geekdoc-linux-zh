    #### Output With Time


    Frequently, I want to get the output of a command along with the time. Let’s say
    I’m running vmstat while a server is having problems, and I want to ensure that
    I’ve logged the time that vmstat relates to. Type this in:


    ```

    1 $ function dateit() {

    2    while read line

    3    do

    4      echo "$line $(date ''+ %m-%d-%Y %H:%M:%S'')"

    5    done

    6 }

    7 $ vmstat 1 | dateit

    ```


    You should be able to follow what’s happening there based on what you’ve learned
    so far, with the exception of the `while read line` line. `read` is a shell builtin
    that takes input from standard input until a newline is seen (or an ‘end of file’
    byte on its own line).


    ```

    8 $ read

    9 some input

    ```


    It returns a true exit code if input was seen:


    ```

    9 $ echo $?

    ```


    and false if an end of file character is seen (with control-d):


    ```

    10 $ read

    11 ^D

    12 $ echo $?

    ```


    If an argument is given to read, then a variable is populated with the input:


    ```

    13 $ read myinput

    14 some input

    15 $ echo $myinput

    ```


    So in the `dateit` function we input above, the while loop keeps taking input
    from standard input and acts on each line as it’s read in, echoing each line to
    standard output until is gets an end-of-file character, at which point the while
    loop terminates as read returned a false exit code.


    You will see the date appended to each line in the output. Experiment with the
    function to place the date before the line, or even on a separate line. See also
    the exercises below.


    #### Where Am I?


    You may be familiar with the `pwd` builtin, which gives you your current working
    directory (cwd). Similarly, there is an environment variable (`PWD`) that bash
    normally sets that stores the cwd.


    ```

    16 $ pwd

    17 $ echo $PWD

    ```


    Very often in scripts, you will want to know where the cwd of the process is.


    But also (very often) you will want to know where *the script you are running*
    is located *from within the script*.


    For example, if you are running a script that is found in your `PATH` (ie not
    in your local folder), and you want to refer to another file relative to that
    script from within that script, then you will need to know where that script is
    located.


    ```

    18 $ cat > /tmp/lbthwscript.sh << ''EOF''

    19 echo My pwd is: $PWD

    20 echo I am running in: $(dirname ${BASH_SOURCE[0]})

    21 EOF

    22 $ chmod +x /tmp/lbthwscript.sh

    23 $ /tmp/lbthwscript.sh

    ```


    Have a play with this function to see what it does.


    What happens if you `cd` to `/tmp` and run it from there? Do you get an absolute
    path in the second line? What can you do about this?


    #### Generic Extract Function


    There are a bewildering number of archiving tools. To name a few of the most popular:


    *   tar


    *   zip


    *   bzip


    *   gzip


    *   compress


    If you spend any time dealing with these files, then this is a candidate for a
    time-saving function to put into your startup files.


    ```

    24 $ function extract() {

    25   if [ -z "$1" ]

    26   then

    27     echo "Usage: extract <file_name>.<zip|rar|bz2|gz|tar|tbz2|tgz|Z|7z|xz|ex|tar.bz2\

    28 |tar.gz|tar.xz>"

    29   else

    30     if [ -f $1 ] ; then

    31        case $1 in

    32          *.7z)        7z x $1        ;;

    33          *.bz2)       bunzip2 $1     ;;

    34          *.exe)       cabextract $1  ;;

    35          *.gz)        gunzip $1      ;;

    36          *.tar.bz2)   tar xvjf $1    ;;

    37          *.tar.gz)    tar xvzf $1    ;;

    38          *.tar.xz)    tar xvJf $1    ;;

    39          *.tar)       tar xvf $1     ;;

    40          *.tbz2)      tar xvjf $1    ;;

    41          *.tgz)       tar xvzf $1    ;;

    42          *.Z)         uncompress $1  ;;

    43          *.xz)        unxz $1        ;;

    44          *.lzma)      unlzma $1      ;;

    45          *.rar)       unrar x -ad $1 ;;

    46          *.zip)       unzip $1       ;;

    47          *)           echo "extract: ''$1'' - unknown archive method" ;;

    48        esac

    49     else

    50         echo "$1 - file does not exist"

    51     fi

    52   fi

    53 }

    54 $ mkdir lbthw_misc

    55 $ cd lbthw_misc

    56 $ touch a b c

    57 $ tar cvfz test.tgz a b c

    58 $ rm a b c

    59 $ extract test.tgz

    ```


    Explain what each line does.


    #### Output Absolute File Path


    Quite often I want to give co-workers an absolute reference on a server to a file
    that I am looking at. One way to do this is to cut and paste the output of `pwd`,
    add a `/` to it, and then add the filename I want to share.


    This takes a few seconds to achieve, and since it happens regularly, it’s a great
    candidate for a time-saving function:


    ```

    60 $ function sharefiles() {

    61       for file in $(ls "$@"); do

    62               echo -n $(pwd)

    63               [[ $(pwd) != "/" ]] && echo -n /

    64               echo $file

    65       done

    66 }

    67 $ sharefiles

    ```


    Saving time by writing a function is often a great idea, but deciding what is
    worth automating is a non-trivial task.


    Here are some things you want to think about when deciding what to automate:


    *   How often do you perform the task?


    *   How much effort is it to automate (it’s easy to under-estimate this!)


    *   Will the automation require effort to maintain?


    *   Do you always perform the task on the same machine?


    *   Do you control that machine?


    My experience is that the effects of automation can be very powerful, but the
    above factors can also limit the return on investment.


    Think about what you could automate today (see exercises)!


