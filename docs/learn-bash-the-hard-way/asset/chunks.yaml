    ## Variables in Bash


    As in any programming environment, variables are critical to an understanding
    of `bash`. In this section you’ll learn about variables in `bash` and some of
    their subtleties.


    You will cover:


    *   Basic variables

    *   Quoting variables

    *   Quoting and globs

    *   The `env` and `export` commands

    *   Simple arrays


    By the end you will have a good overview of how variables work in `bash` and some
    of their pitfalls.


    ### How Important is this Section?


    Variables are fundamental to understanding `bash` commands, much as they are in
    any programming language.


    ### Basic Variables


    Start by creating a variable and echoing it.


    ```

    1 $ MYSTRING=astring

    2 $ echo $MYSTRING

    ```


    Simple enough: you create a variable by stating its name, immediately adding an
    equals sign, and then immediately stating the value.


    Variables don’t need to be capitalised, but they generally are by convention.


    To get the value out of the variable, you have to use the dollar sign to tell
    `bash` that you want the variable dereferenced.


    ### Variables and Quoting


    Things get more interesting when you start quoting.


    Quoting can be used to group different ‘words’ into a single variable value:


    ```

    3 $ MYSENTENCE=A sentence

    4 $ MYSENTENCE="A sentence"

    5 $ echo $MYSENTENCE

    ```


    Since (by default) the shell reads each word in separated by a space, it thinks
    the word `‘sentence’` is not related to the variable assigment, and treats it
    as a program. To get the sentence into the variable with the space in it, you
    can enclose it in the double quotes, as above.


    Things get even more interesting when we embed other variables in the quoted string:


    ```

    6 $ MYSENTENCE="A sentence with $MYSTRING in it"

    7 $ echo $MYSENTENCE

    8 $ MYSENTENCE=''A sentence with $MYSTRING in it''

    9 $ echo $MYSENTENCE

    ```


    If you were expecting similar behaviour to the previous section you may have got
    a surprise!


    This illustrated an important point if you’re reading shell scripts: the `bash`
    shell translates the variable into its value if it’s in double quotes, but does
    not if it’s in single quotes.


    Remember from the previous section that this is not true when globbing!


    Type this out and see. As ever, make sure you think about the output you expect
    before you see it:


    ```

    10 $ MYGLOB=*

    11 $ echo $MYGLOB

    12 $ MYGLOB="*"

    13 $ echo "$MYGLOB"

    14 $ MYGLOB=''*''

    15 $ echo "$MYGLOB"

    16 $ echo ''$MYGLOB''

    17 $ echo $MYGLOB

    ```


    Globs are not expanded when in either single or double quotes. Confusing isn’t
    it?


    ### Shell Variables


    Some variables are special, and set up when `bash` starts:


    ```

    18 $ echo $PPID

    19 $ PPID=nonsense

    20 $ echo $PPID

    ```


    *   Line 18 - `PPID` is a special variable set by the `bash` shell. It contains
    the `bash`’s parent process id.

    *   Line 19 - Try and set the `PPID` variable to something else.

    *   Line 20 - Output `PPID` again.


    What happened there?


    If you want to make a readonly variable, put `readonly` in front of it, like this:


    ```

    21 $ readonly MYVAR=astring

    22 $ MYVAR=anotherstring

    ```


    ### export


    Type in these commands, and try to predict what will happen:


    ```

    23 $ MYSTRING=astring

    24 $ bash

    25 $ echo $MYSTRING

    26 $ exit

    27 $ echo $MYSTRING

    28 $ unset MYSTRING

    29 $ echo $MYSTRING

    30 $ export MYSTRING=anotherstring

    31 $ bash

    32 $ echo $MYSTRING

    33 $ exit

