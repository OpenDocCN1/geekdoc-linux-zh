    # 硬核学习 Bash (Learn Bash the Hard Way)


    ### 使用这种唯一有效的方法掌握 Bash


    #### Ian Miell


    本书可在 [`leanpub.com/learnbashthehardway`](http://leanpub.com/learnbashthehardway)
    购买。


    此版本发布于 2019-09-25。


    ![出版者标志](img/leanpub-logo.png)


    这是一本 [Leanpub](http://leanpub.com) 书籍。Leanpub 通过精益出版流程为作者和出版者赋能。[精益出版](http://leanpub.com/manifesto)
    是使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在成功后建立影响力。


    © 2017 - 2019 Ian Miell


    ## 目录


    ## 指南


    1. 开始阅读


    ## 前言


    在我 20 年的软件职业中，几乎每天我都要以某种方式与 bash 打交道。Bash 无处不在，以至于我们理所当然地认为人们知道它，并且因为用它就能“应付”，导致这项技能被低估了。


    我的观点是，软件社区在学习 bash 方面的服务极度匮乏，而掌握它会带来巨大的回报，而不仅仅是在使用 bash 的时候。


    你通常会被：


    * 充斥着术语的晦涩手册页（man pages），假设你理解的比实际的要得多

    * 解决你特定问题的单行命令（one-liners），让你在下次想做某事时没有获得任何提升

    * 像扩展版手册页一样的 Bash “指南”——理论性强、充满术语，且非常难以跟上


    以上所有内容都是本书试图解决的。


    如果你曾对像这些事情感到困惑：


    * `[` 和 `[[` 之间的区别

    * 通配符（globbing）和正则表达式（regexes）之间的区别

    * bash 中单引号或双引号的区别

    * `` ` `` 代表什么

    * 什么是子壳（subshell）

    * 你的终端“发疯”了


    那么这本书就是为你准备的。


    它采用“硬核（Hard Way）”方法，确保你必须理解阅读那些晦涩手册页所需要的知识，并在需要时加深你的理解。


    祝阅读愉快！


    ## 硬核学习 Bash


    这门 bash 课程旨在帮助 bash 用户对 bash 获得更深入的理解和精通。它的目标不是让你立即成为专家，但你会对使用 bash 执行更多而不仅仅是单次命令的任务更有信心。


    ### 简介


    #### 为什么要学习 Bash？


    有几个理由要以结构化的学习 bash：


    * Bash 无处不在

    * Bash 功能非常强大


    你经常在没有意识的情况下使用 bash，而且人们经常会困惑为什么它有时不会按照你预期的那样工作，甚至不明白为什么在给他们单行命令运行后 bash 竟然能工作。


    深入理解 bash 并不需要长时间，一旦你掌握了基础，它的强大和无处不在意味着你可以在各种场景下大显身手。


    #### 为什么要“硬核”地学习 Bash？


    “硬核”是一种强调学习任何知识**所需过程的方法。你不会通过阅读关于自行车的内容来学骑，也不会通过读食谱来学做饭。书可以提供帮助（希望这本可以），但取决于你自己付出的努力。


    本书根据我几十年的经验，通过小而易于消化的片段为你展示路径，并要求你*实际输入代码*。这就像学自行车时去骑车一样重要。如果没有大脑和身体的协作，知识就无法进入大脑。


    如果你遵循这门课程，你将获得对 bash 的理解，这种理解可以作为你未来使用它的基础。


    #### 你将获得什么


    这门课程旨在为学生提供：


    * 对 bash 的实操、快速且实用的理解

    * 足够的信息，以便让他们在深入研究 bash 时理解正在发生什么

    * 对高级 bash 用法的熟悉


    它**没有**：


    * 让你精通所有你在命令行上可能用到的工具，例如 `sed`、`awk`、`perl`

    * 对 bash 的所有细微之处和底层技术提供完整的理论理解

    * 解释一切。如果以后需要，有充足的时间去深入获取所有的细微差别


    你有时必须通过思考来理解正在发生什么。这就是硬核方法，也是真正学习的唯一途径。这门课程将节省你的时间，避免你以后在挠头苦恼某事是什么意思，或者为什么那个 StackOverflow
    的答案起作用了。


    有时课程会涉及与 bash 密切相关的其他领域，但不是直接相关的 bash，例如特定的工具、终端知识。同样，这始终围绕着我使用 bash 和其他 shell
    的几十年经验。


    ### 假设


    它假设你对*非常*基础的 shell 使用和命令有些熟悉。对于那些想要达到那个程度的人，我建议遵循这套微型教程：


    [`learnpythonthehardway.org/book/appendixa.html`](https://learnpythonthehardway.org/book/appendixa.html)


    它还假设你配备了 bash shell 和一个终端。如果你不确定自己是否在 bash 中，请在终端输入：


    ```

    echo $BASH_VERSION

    ```


    如果你在终端输出了如下这样的 bash 版本字符串，说明你处于 bash 中：


    ```

    3.2.57(1)-release

    ```


    #### 课程是如何运作的


    本课程*要求*你输入所有的练习内容。


    经常，文中不会显示输出。任何解释性文本都会假设你已经输入了。再次，这是硬核方法，而且它是唯一的方法。


    为了显示你所在的位置，命令行被标记为 1-n，数字后面跟着一个 `$` 符号，例如：


    ```

    1 $ 第一条命令

    2 $ 第二条命令

    ```


    在每个章节的结尾有一组清理命令（如果需要），如果你不想留下工作的痕迹。


    ### 结构


    本书分为四个部分：


    #### 第一部分：核心 Bash


    理解命令行 bash 必需的基础性概念。


    #### 第二部分：Bash 脚本


    让你的 bash 脚本技能达到精通水平。


    #### 第三部分：技巧


    常用技巧和特征的入门。


    #### 第四部分：高级 Bash


    在前三章的基础上，引入了一些更高级的功能，本章将你的 bash 技能带出常规。


    ## 第一部分：核心 Bash


    这部分将带你了解进一步深化 bash 知识的基础概念。


    在其中我们涵盖：


    * 什么是 bash

    * 通配符（Globbing）

    * 变量

    * 函数

    * 管道和重定向

    * 基础 bash 脚本


    ### 什么是 Bash？


    Bash 是一个 shell 程序。


    shell 程序通常是一个可执行的二进制文件，它接收你输入的命令并（一旦你按下回车键）将这些命令翻译为（最终）操作系统 API 的系统调用。


    如果你不确定这意味着什么，不要担心。你只需要知道 shell 程序是一个让你告诉计算机要做什么的程序。


    让 bash 与许多其他编程语言不同在于，它是一种设计用来“粘合”其他程序的语言。


    在这一部分中，你将了解 bash 以及其他相关 shell 的历史。


    #### 这一部分重要吗？


    这一部分是背景和设定材料。它对于书中其他内容并非至关重要，但在你阅读该主题时，了解这些信息是有用的。


    #### 其他 shell


    '
- fmt: '

    Other shells include:


    * `sh`

    * `ash`

    * `dash`

    * `ksh`

    * `csh`

    * `tcsh`

    * `tclsh`


    These other shells have different rules, conventions, logic, and histories that
    means they can look similar.


    Because other shells are also programs, they can be run from within one another!


    Here you run `tcsh` from within your `bash` terminal. Note that you get a different
    prompt (by default):


    ```

    1 $ tcsh

    2 % echo $dirstack

    3 % exit

    4 $

    ```


    Typically, a `tcsh` will give you a prompt with a percent sign, while `bash` will
    give you a prompt with a dollar sign. This is configurable, though, so your setup
    may be different.


    The `dirstack` variable is set by `tcsh` and will output something meaningful.
    It’s not there by default in `bash` (try typing the `echo` command in when you
    are back in the `bash` shell at the end!)


    ## History of bash


    This diagram helps give a picture of the history of bash:


    ![](images/shell_history.png)


    Bash is called the ‘Bourne Again SHell’. It is a descendant of the ‘Thompson Shell’
    and then the Bourne `sh` shell. `Bash` has other ‘siblings’ (eg `ksh`), ‘cousins’
    (eg `tcsh`), and ‘children’, eg ‘zsh’.


    The details aren’t important, but it’s important to know that different shells
    exist and they can be related and somewhat compatible.


    `Bash` is the most widely seen and used shell as of 2017. However, it is still
    not unheard of to end up on servers that do not have `bash`!


    ## What You Learned


    * What a shell is

    * How to start up a different shell

    * The family tree of shells


    ## What Next?


    Next you look at two thorny but ever-present subjects in `bash`: globbing and
