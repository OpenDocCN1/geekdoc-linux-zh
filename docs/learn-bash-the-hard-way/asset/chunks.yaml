- fmt: '

    1) Read the `man` page to see what all the options are. Don’t worry if you don’t
    understand it all yet, just get a feel for what’s there.


    2) Set up a shell with unique variables and functions and use `set` to create
    a script to recreate those items in another shell.


    ## Process Substitution


    Process substitution is a really handy way of saving time at the command line.


    In this section you will cover:


    * The `<()` operator

    * The more rarely-used `>()` operator


    ### How Important is this Section?


    I spent years reading and writing bash before I understood this concept, so it’s
    possible to skip this section. However, once I learned it, I use it on the command
    line almost every day, so I recommend you learn it at some point.


    ### Simple Process Substitution


    Type this in to set files up for this section:


    ```

    1 $ mkdir lbthw_process_subst && cd lbthw_process_subst

    2 $ mkdir a

    3 $ mkdir b

    4 $ touch a/1 a/2

    5 $ touch b/2 b/3

    6 $ ls a

    7 $ ls b

    ```


    You’ve created two folders with slightly different contents.


    Now let’s say that you want to diff the output of `ls a` and `ls b` (a trivial
    but usefully simple example here). How would you do it?


    You might do it like this:


    ```

    8 $ ls a > aout

    9 $ ls b > bout

    10 $ diff aout bout

    11 $ rm aout bout

    ```


    That works, and there’s nothing wrong with it, but typing all that out and cleaning
    up the files is a bit cumbersome. There’s a much neater way that exposes a very
    useful technique.


    Type this in:


    ```

    12 $ diff <(ls a) <(ls b)

    ```


    That’s neater, isn’t it?


    So what’s going on?


    ### The `<()` Operator


    The `<()` operator is conceptually similar to the `$()` we saw ealier. In the
    same way that `$()` substitutes the *output* of the process contained within it
    into the command, eg:


    ```

    13 $ echo $(ls a)

    ```


    the `<()` operator substitutes a *file containing the output* of the process contained
    within it. You might need to stop and think about this for a second.


    That means that this line:


    `diff <(ls a) <(ls b)`


    effectively becomes the command to diff two files, equivalent to the files `aout`
    and `bout` in the lines you typed in above.


    So *wherever you would normally put a filename*, you can use the `<()` operator
    to save some time by dropping these in rather than creating files.


    ### The `>() Operator


    Can you guess what this does? It’s similar to the `<()` but for me it was a lot
    trickier to grasp, and much more rarely seen (so feel free to skip).


    See if you can work out from this line what it does:


    ```

    14 $ tar cvf >(cat > out.tar) /tmp

    ```


    As with the `<()` operator, this replaces a file in a command. This time, rather
    than sending the output to the file, it takes *input* from the command that would
    normally go to that file reference, and feeds that input to the command in the
    operator.


    Let’s take a step back and think about that, because it can be hard to follow.


    Normally you’d write something like this:


    ```

    15 $ rm -f out.tar

    16 $ tar cvf out.tar /tmp

    ```


    The command is read into bash, expanded out, and the `tar` command accepts two
    arguments: a file and a folder (`out.tar` and `/tmp`). It tars up the contents
    of the `/tmp` folder and places it in the `out.tar` file.


    The difference in the previous command is that the contents that would normally
    be inputted into the file is instead fed into the command `cat > out.tar`.


    Obviously, in this case that command is pointless - in both cases you end up with
    a file called `out.tar` that is a tar file.


    Let’s say, however, that you wanted to use a different compression scheme for
    your tar file. You could type this:


    ```

    17 $ tar cvf >(gzip > out.tar.gz) /tmp

    ```


    which would gzip the tarfile and place it into the `out.tar.gz` file.


    It can reasonably be pointed out that most versions of `tar` offer a gzip flag
    (`-z`). that does this for you. However, some versions don’t (especially on minimal
    Linux distributions like busybox), so this can be a neat way of getting round
    that.


    I have never had a need to use this mechanism in real life, but I’ve written things
    like this before, which are less neat (but good enough):


    ```

    18 $ tar cvf out.tar /tmp

    19 $ gzip out.tar

    20 $ rm out.tar

    ```


    ### Cleanup


    To clean up:


    ```

    21 $ cd .. && rm -rf lbthw_process_subst

    ```


    ### What You Learned


    * What the `<()` operator is

    * What the `>()` operator is

    * How to use these operators

    * How `<()` differs from the `$()` operator

    * How `>()` works


    ### What Next?


    Next you will cover subshells, and grouping commands more generally.


    ### Exercises


    1) Look for examples of where these operators are used on the web, and figure
    out what they’re doing.


    2) Look through your bash history (by typing `history`) and see where you could
    have used these operators.


    3) Construct a command that uses `$()`, `<()`, and `>()`.


    ## Subshells


    The concept of subshells is not a complicated one, but can lead to a little confusion
    at times, and occasionally is very useful.


    You will cover:


    * How to create a subshell

    * Why they are useful

    * Comparison to curly-braced blocks


    ### How Important is this Section?


    As with process substitution, this is another concept I came to later in my bash
    career. It comes in handy fairly often, and an understanding of it helps deepen
    your bash wisdom.


    ### Create a Subshell


    Type this in to see a subshell in action:


    ```

    1 $ mkdir lbthw_subshells && cd lbthw_subshells

    ```


    Create a variable in your ‘main’ shell:


    ```

    2 $ VAR1=''the original variable''

    ```


    Now create a ‘subshell’:


    ```

    3 $ (

    ```


    You’ll notice the prompt has changed. Now try and echo something:


    ```

    4 > echo Inside the subshell

    ```


    It’s not been run. This is because the subshell’s instructions aren’t run until
    the parenthesis has been closed. Next we’ll try and echo the variable we created
    outside.


    ```

    5 > echo ${VAR1}

    ```


    Then update that variable to another value, and echo it again:


    ```

    6 > VAR1=''the updated variable''

    7 > echo ${VAR1}

    ```


    And finally create another variable, before closing the subshell out:


    ```

    8 > VAR2=''the second variable''

    9 > )

    ```


    So a subshell is a shell that inherits variables from the parent shell, and whose
    running is deferred until the parentheses are closed.


    It will pay to think about the output and review the subshell commands to grasp
    what you just saw. Play with the commands and experiment until you’re comfortable
    with what a subshell can and can’t do.


    ### Subshells and Scope


    What happened to the variable you updated inside the subshell?


    ```

    10 $ echo ${VAR1}

    ```


    Now you now know that variables can mask their parent shell’s value within the
    subshell. This is very handy to know if you want to do something in a modified
    environment, but not have to manage variables’ previous values.


    What happens if we try `export`ing the variable? Will that `export` it to the
    parent shell?


    ```

    11 $ (

    12 > export VAR1=''the first variable''

    13 > )

    14 $ echo ${VAR1}

    ```


    ### The `export` Builtin


    The `export` command can cause a lot of confusion here. Let’s experiment with
    it here to show how it works.


    ```

    15 $ cat > echoes.sh << ''END''

    16 > #!/bin/bash

    17 > echo $EXPORTED

    18 > echo $NOTEXPORTED

    19 > ''END''

    ```


    Then run this. What do you think will happen?


    ```

    20 $ chmod +x echoes.sh

    21 $ export EXPORTED=''exported''

    22 $ NOTEXPORTED=''exported''

    23 $ ./echoes.sh

    ```


    If this doesn’t make sense to you, you might want to revisit Part I, where `export`
    was covered in ‘Variables’.


    ### Subshells and Redirection


    One often useful property of subshells is the fact that the code is treated as
    a single unit. You can therefore redirect output from a set of commands wholesale.


    You might write code that looks like this


    ```

    24 $ echo Some output, ls to follow >> logfile

    25 $ ls >> logfile

    ```


    which is fine for a couple of lines, but what if you have hundreds of lines like
    this? It leads to quite inelegant code. Instead, you can write:


    ```

    26 $ (

    27 > echo Some output, ls to follow

    28 > ls

    29 > ) >> logfile

    ```

