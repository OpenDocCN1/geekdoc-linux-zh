  trans: "\n\n这说明了关于信号的一个微妙点。它们作用于*当前正在运行的*进程，而不是作用于它们的子进程。\n\n重复上面的部分，但不是使用：\n\n\
    ```\nsleep 999 &\nwait\n```\n\n而是输入：\n\n```\nsleep 999\n```\n\n你对 `EXIT` 和 `INT`\
    \ 信号的行为观察到了什么？\n\n你如何解释运行以下命令：\n\n```\n37 $ ./trap_exit.sh # 按 CTRL-c\n```\n\n\
    为什么可以杀死 sleep 进程并输出‘trapped’，而之前发送信号 `-2` 却没有这样做？\n\n答案是前台进程的对待方式不同——它们形成“进程组”的一部分，该组会接收终端上的任何信号。\n\
    \n如果这看起来很复杂，请记住：`CTRL-c` 会使用 `2`（或 `INT`）信号杀死终端前台所有“正在运行”的进程，而 `kill` 向特定进程发送消息，该进程在此时可能正在运行，也可能没有运行。\n\
    \n如果这看起来很复杂，请记住：信号是可以复杂的！\n\n## 清理\n\n```bash\n38 $ cd .. && rm -rf lbthw_traps\n\
    ```\n\n## 你学到了什么\n\n在本节中，你学习了：\n\n* 什么是信号 (signal)\n* 什么是陷阱 (trap)\n* `kill` 程序的作用，以及它默认并不发送\
    \ `KILL` 信号\n* 什么是 `INT` 和 `TERM` 信号\n* 如何捕获退出的 bash 进程\n* 什么是进程组以及它对信号的意义\n\n\
    ## 接下来？\n\n接下来我们将查看用于调试 bash 脚本的各种方法。\n\n## 练习\n\n1) 在终端中编写一个你无法逃出的 shell 脚本（运行它的机器因此不会导致过载！）\n\
    2) 尝试逃离你在 1) 中创建的 shell 脚本\n3) 问问你认识的人是否都能逃离该 shell 脚本\n4) 如果没有人能逃离，请发送给作者 :)\n\
    5) 研究其他的“特殊”信号陷阱。使用 `man bash` 进行此操作。\n\n## 高级变量\n\n你在课程早期已经涵盖了简单变量，但 bash 变量比你学到的要多。在本节中，你将涵盖：\n\
    \n* 参数扩展 (Parameter Expansion)\n* 关联数组 (Associative Arrays)\n\n### 本节有多重要？\n\n\
    变量是理解 bash 命令的基础，就像在任何编程语言中一样。这一高级部分将带你了解变量的更少使用或更为人知的方面。参数扩展部分特别值得了解。\n\n###\
    \ 参数扩展\n\n你已经看到可以使用大括号（`${}`）来指定变量名的起始和结束位置。\n\nBash 允许你在这些大括号内对变量进行其他操作，这些操作会影响\
    \ shell 对变量的解释。\n\n这些被称为“参数扩展”。尝试以下序列，并弄清楚发生了什么。\n\n```bash\n1 $ unset A\n2 $\
    \ echo ${A:=123}\n3 $ echo $A\n```\n\n如果变量尚未设置，你可以在变量名后添加 `:=` 来内联设置该变量。\n\n```bash\n\
    4 $ unset A\n5 $ echo ${A:-123}\n6 $ echo $A\n```\n\n使用 `:-` 扩展时，变量 `A` 这一次*没有*被设置。发生的一切只是：如果\
    \ `A` 未设置，则用 `123` 替换它的位置。\n\n如果你想设置默认值，或者确保在继续执行脚本之前变量已设置，这非常有用。\n\n通过在命令行上实验看看\
    \ `A` 被设置时会发生什么。确保你理解了。\n\n### 关联数组\n\nBash 还支持“关联数组”。\n\n使用关联数组，你使用字符串而不是数字来引用值：\n\
    \n```bash\n 7 $ declare -A MYAA=([one]=1 [two]=2 [three]=3)\n 8 $ MYAA[one]=\"\
    1\"\n 9 $ MYAA[two]=\"2\"\n10 $ echo $MYAA\n11 $ echo ${MYAA[one]}\n12 $ MYAA[one]=\"\
    1\"\n13 $ WANT=two\n14 $ echo ${MYAA[$WANT]}\n```\n\n除了与低于 4.0 版本不兼容外，关联数组的创建和使用相当麻烦，因此我在现实并不经常看到它们。\n\
    \n## 你学到了什么\n\n在本节中，你学习了 bash 变量稍微高级的方面。\n\n你查看了关联数组（这在其他脚本语言中很常见，但是 bash 较新添加的功能，版本\
    \ 4.0+），还查看了参数扩展，这是一个非常有用的\n\n## 接下来？\n\n接下来我们将查看一个与参数扩展密切相关的主题：bash 中的字符串操作。你可能会对\
    \ bash 的能力感到惊讶。\n\n## 练习\n\n1) 在 `man` 页面中搜索“Parameter Expansion”，并尝试所有可用的类型。\n\
    2) 创建一个关联数组，将颜色名称映射到文本颜色的终端转义码。编写脚本使用该数组根据命令行参数输出指定颜色的文本。\n\n## 字符串操作\n\n由于 bash\
    \ 的大量工作与文件和文本字符串有关，因此操作字符串的能力是有价值的。\n\n虽然像 `sed`、`awk`、`perl`（以及许多其他工具）非常值得学习，在本节中，我想向你展示\
    \ bash 中可以实现的功能——这可能比你想的要多！\n\n在本节中将涵盖：\n\n* 如何在 bash 中编辑字符串\n* 什么是 extglobs 以及你如何使用它们\n\
    \n### 本节有多重要？\n\n变量是理解 bash 命令的基础，就像在任何编程语言中一样。这一高级部分将带你了解变量的更少使用或更为人知的方面。参数扩展部分特别值得了解。\n\
    \n###### 字符串编辑\n\n这一节至关重要。bash 中的字符串操作有时在执行任务时非常有用。由于 bash 的大量工作与文件和文本字符串有关，因此操作字符串的能力是有价值的。\n\
    \n虽然像 `sed`、`awk`、`perl`（以及许多其他工具）非常值得学习，在本节中，我想向你展示 bash 中可以实现的功能——这可能比你想的要多！\n\
    \n### 字符串长度\n\n处理字符串时最常见的需求之一是确定长度：\n\n```bash\n1 $ A='12345678901234567890'\n\
    2 $ echo \"${#A}\"\n3 $ echo \"$A\"\n```\n\n为什么第二个没有“起作用”？\n\nBash 提供了一种提取子字符串的方法。\n\
    \n这输出字符串从第三个字符开始的所有内容：\n\n```bash\n4 $ echo ${A:2}\n```\n\n而这个输出字符串从第四个字符开始的两个数字：\n\
    \n```bash\n5 $ echo ${A:3:2}\n```\n\n所以你可以看出字符串是 0 索引的，也就是说第一个字符是零，第二个是 1，以此类推。\n\
    \n### 搜索和替换\n\n你还可以在字符串内进行搜索和替换：\n\n```bash\n10 $ B=0000000000\n11 $ echo ${B/0/1}\n\
    ```\n\n简单的模式只替换第一个 0 为 1。如果你想让模式跨越字符串所有的匹配项，请添加另一个斜杠：\n\n```bash\n12 $ echo ${B//0/1}\n\
    ```\n\n第二个命令中是什么？它和第一条有什么不同？\n\n你还可以将小写转换为大写，反之亦然。使用单个逗号会将起始的首写字母转换为小写：\n\n```bash\n\
    13 $ C=AbCd\n14 $ echo ${C,}\n```\n\n而使用两个逗号会将整个字符串转换为小写：\n\n```bash\n15 $ echo\
    \ ${C,,}\n16 $ C=aAbCd\n```\n\n同样，脱字符字符也会将字符串转换为大写：\n\n```bash\n17 $ echo ${C^}\n\
    18 $ echo ${C^^}\n```\n\n### 更多……\n\n还有许多你可以使用的字符串操作技巧，但不值得一次性学习。\n\n如果你想更详细地研究它们并发现哪些可用（或者当你自己怀疑\
    \ bash 用字符串可以做什么时），请查看“Parameter Expansion”下的 man 页面。\n\n### Extglobs 和删除文本\n\n\
    一种更高级的字符串字符串的方法是通过使用 bash 的 extglobs 功能实现的。\n\n"
- fmt: "\nA word of warning here: although this functionality is useful to know, it\
    \ is arguably less useful than learning the programs `sed` and `perl` for this\
    \ purpose. It’s also quite confusing to have this extra type of glob syntax to\
    \ learn in addition to regular expressions (and there’s even flavours of those\
    \ too!). Feel free to skip this section if you feel it’s too obscure.\n\n```\n\
    19 $ shopt -s extglob\n20 $ A=\"12345678901234567890\"\n21 $ B=\"  ${A}  \"\n\
    ```\n\nYou’ve ensured that the `extglob` option is on, and created a new variable\
    \ `B`, which is `A` with two spaces in front and behind. The pipe `|` character\
    \ is used in the `echo` output to show where the spaces are.\n\n```\n25 $ echo\
    \ \"B      |${B}|\"\n26 $ echo \"B#+( ) |${B#+( )}|\"\n27 $ echo \"B#?( ) |${B#?(\
    \ )}|\"\n28 $ echo \"B#*( ) |${B#\\*( )}|\"\n29 $ echo \"B##+( )|${B##+( )}|\"\
    \n30 $ echo \"B##*( )|${B##*( )}|\"\n31 $ echo \"B##?( )|${B##?( )}|\"\n```\n\n\
    Using the `bash` man page, and experimenting, can you figure out the differences\
    \ between the above extglobs? They are:\n\n* `?( )`\n* `+( )`\n* `*( )`\n\nNow\
    \ try `%` instead of `#` above. What happens?\n\nOne potentially handy application\
    \ of this is when having to remove leading zeroes from dates:\n\n```\n32 $ TODAY=$(date\
    \ +%j)\n33 $ TODAY=${TODAY##+(0)}\n```\n\nRemember: `#` is to the left, and `%`\
    \ is to the right on a (US) keyboard. Or ‘hash’ is before ‘per cent’ in the alphabet.\n\
    \n### Quoting Hell\n\nQuoting - as I’m sure you’ve seen - can get very complicated\
    \ in bash very quickly.\n\nTry this:\n\n```\n34 $ echo 'I really want to echo\
    \ $HOME and I can't avoid it'\n```\n\nUh-oh. You’re now stuck.\n\nCan you see\
    \ why?\n\nHit `CTRL-c` to get out of it.\n\nSo you might think to try this:\n\n\
    ```\n35 $ echo \"I really want to echo $HOME and I can't avoid it\"\n```\n\nbut\
    \ this time the `$HOME` variable is evaluated and the output is not what is wanted.\n\
    \nTry this:\n\n```\n36 $ echo 'I really want to echo $HOME and I'\"'\"'t avoid\
    \ it'\n```\n\nThat works. Remember this trick as it can save you a lot of time!\n\
    \n### Cleanup\n\nNo cleanup required in this section, though you may want to quit\
    \ your bash shell and start a fresh one, as you set a shell option (extglob) above.\n\
    \n### What You Learned\n\nThis section taught you about string management using\
    \ pure bash. This is a relatively rare field to cover, but worth having seen in\
    \ case you come across it. You learned:\n\n* How to edit strings using pure bash\n\
    * How to determine string length\n* What extglobs are and how you can use them\n\
    * How to avoid common quoting problems\n\n### What Next\n\nIn the next section\
    \ you will look at bash’s debugging capabilities.\n\n### Exercises\n\n1) Learn\
    \ how to do all of the above things in sed too. This will take some research and\
    \ time.\n2) Learn how to do all of the above in perl. This will also take some\
    \ research and time!\n3) Construct a useful echo that has a double-quoted string\
    \ with a single-quoted string inside, eg one that outputs:\n\nHe said ‘I thought\
    \ she’d said “bash was easy when $s are involved” but that can’t be true!’\n\n\
    ### Debugging Bash Scripts\n\nThere are a few useful techniques worth knowing\
    \ to help debug your bash scripts. While covering some of these here, you will\
    \ also learn how to make your bash scripts more robust and less prone to failure.\n\
    \nIn this section you will learn about:\n\n* Various bash flags useful for debugging\n\
    * How to trace bash code to determine what it’s doing\n* Linting scripts in bash\n\
    \n#### How Important is this Section?\n\nIf you write, use or maintain bash of\
    \ any complexity you’ll want to know how to debug it!\n\n#### Syntax Checking\
    \ Options\n\nStart by creating this simple script:\n\n```\n1 $ mkdir -p lbthw_debugging\
    \ && cd lbthw_debugging\n2 $ cat > debug_script.sh << 'END'\n3 #!/bin/bash\n4\
    \ A=some value\n5 echo \"${A}\n6 echo \"${B}\"\n7 END\n```\n\nNow run it with\
    \ the `-n` flag. This flag only parses the script, rather than running it. It’s\
    \ useful for detecting basic syntax errors.\n\n```\n8 $ bash -n debug_script.sh\n\
    ```\n\nYou can see it’s broken. Fix it. Then run it:\n\n```\n9 $ bash debug_script.sh\n\
    ```\n\nNow run with `-v` to see the verbose output.\n\n```\n10 $ bash -v debug_script.sh\n\
    ```\n\nTry tracing to see more details about what’s going on. Each statement gets\
    \ a new line.\n\n```\n11 $ bash -x debug_script.sh\n```\n\nUsing these flags together\
    \ can help debug scripts where there is an elementary error, or even just working\
    \ out what.\n\n#### Managing Variables\n\nVariables are core part of bash, so\
    \ managing them is another important.\n\n```\n23 #!/bin/bash\n24 set -o nounset\n\
    25 set -x \n26 A=\"some value\"\n27 echo \"${A}\"\n28 B=\"another value\"\n29\
    \ echo \"${B}\"\n30 unset -u nounset\n```\n\n#### Profiling Bash Scripts\n\nReturning\
    \ to `set` flag, we can exploit its use of what.\n\n```\n33 #!/bin/bash\n34 set\
    \ -o nounset\n35 set -x \n36 A=\"some value\"\n37 echo \"${A}\"\n38 B=\"another\
    \ value\"\n39 echo \"${B}\"\n40 unset -u nounset\n```\n\n#### Shellcheck\n\nFinally,\
    \ here is some useful tip for what.\n\n"
  raw: "A word of warning here: although this functionality is useful to know, it\
    \ is arguably less useful than learning the programs `sed` and `perl` for this\
    \ purpose. It’s also quite confusing to have this extra type of glob syntax to\
    \ learn in addition to regular expressions (and there’s even flavours of those\
    \ too!). Feel free to skip this section if you feel it’s too obscure.\n\n```\n\
    19 $ shopt -s extglob\n20 $ A=\"12345678901234567890\"\n21 $ B=\"  ${A}  \"\n\
    ```\n\nYou’ve ensured that the `extglob` option is on, and created a new variable\
    \ `B`, which is `A` with two spaces in front and behind. The pipe (*|*) character\
    \ is used in the echo output to show where the spaces are.\n\n```\n25 $ echo \"\
    B      |${B}|\"\n26 $ echo \"B#+( ) |${B#+( )}|\"\n27 $ echo \"B#?( ) |${B#?(\
    \ )}|\"\n28 $ echo \"B#*( ) |${B#\\*( )}|\"\n29 $ echo \"B##+( )|${B##+( )}|\"\
    \n30 $ echo \"B##*( )|${B##*( )}|\"\n31 $ echo \"B##?( )|${B##?( )}|\"\n```\n\n\
    Using the bash man page, and experimenting, can you figure out the differences\
    \ between the above extglobs? They are:\n\n*   `?( )`\n\n*   `+( )`\n\n*   `*(\
    \ )`\n\nNow try `%` instead of `#` above. What happens?\n\nOne potentially handy\
    \ application of this is when having to remove leading zeroes from dates:\n\n\
    ```\n32 $ TODAY=$(date +%j)\n33 $ TODAY=${TODAY##+(0)}\n```\n\nRemember: `#` is\
    \ to the left, and `%` is to the right on a (US) keyboard. Or ‘hash’ is before\
    \ ‘per cent’ in the alphabet.\n\n#### Quoting Hell\n\nQuoting - as I’m sure you’ve\
    \ seen - can get very complicated in bash very quickly.\n\nTry this:\n\n```\n\
    34 $ echo 'I really want to echo $HOME and I can't avoid it'\n```\n\nUh-oh. You’re\
    \ now stuck.\n\nCan you see why?\n\nHit `CTRL-c` to get out of it.\n\nSo you might\
    \ think to try this:\n\n```\n35 $ echo \"I really want to echo $HOME and I can't\
    \ avoid it\"\n```\n\nbut this time the `$HOME` variable is evaluated and the output\
    \ is not what is wanted.\n\nTry this:\n\n```\n36 $ echo 'I really want to echo\
    \ $HOME and I can'\"'\"'t avoid it'\n```\n\nThat works. Remember this trick as\
    \ it can save you a lot of time!\n\n#### Cleanup\n\nNo cleanup required in this\
    \ section, though you may want to quit your bash shell and start a fresh one,\
    \ as you set a shell option (extglob) above.\n\n#### What You Learned\n\nThis\
    \ section taught you about string management using pure bash. This is a relatively\
    \ rare field to cover, but worth having seen in case you come across it. You learned:\n\
    \n*   How to edit strings using pure bash\n\n*   How to determine string length\n\
    \n*   What extglobs are and how you can use them\n\n*   How to avoid common quoting\
    \ problems\n\n#### What Next\n\nIn the next section you will look at bash’s debugging\
    \ capabilities.\n\n#### Exercises\n\n1) Learn how to do all of the above things\
    \ in sed too. This will take some research and time.\n\n2) Learn how to do all\
    \ of the above in perl. This will also take some research and time!\n\n3) Construct\
    \ a useful echo that has a double-quoted string with a single-quoted string inside,\
    \ eg one that outputs:\n\nHe said ‘I thought she’d said “bash was easy when $s\
    \ are involved” but that can’t be true!’\n\n### Debugging Bash Scripts\n\nThere\
    \ are a few useful techniques worth knowing to help debug your bash scripts. While\
    \ covering some of these here, you will also learn how to make your bash scripts\
    \ more robust and less prone to failure.\n\nIn this section you will learn about:\n\
    \n*   Various bash flags useful for debugging\n\n*   How to trace bash code to\
    \ determine what it’s doing\n\n*   Linting scripts in bash\n\n#### How Important\
    \ is this Section?\n\nIf you write, use or maintain bash of any complexity you’ll\
    \ want to know how to debug it!\n\n#### Syntax Checking Options\n\nStart by creating\
    \ this simple script:\n\n```\n1 $ mkdir -p lbthw_debugging && cd lbthw_debugging\n\
    2 $ cat > debug_script.sh << 'END'\n3 #!/bin/bash\n4 A=some value\n5 echo \"${A}\n\
    6 echo \"${B}\"\n7 END\n```\n\nNow run it with the -n flag. This flag only parses\
    \ the script, rather than running it. It’s useful for detecting basic syntax errors.\n\
    \n```\n8 $ bash -n debug_script.sh\n```\n\nYou can see it’s broken. Fix it. Then\
    \ run it:\n\n```\n9 $ bash debug_script.sh\n```\n\nNow run with `-v` to see the\
    \ verbose output.\n\n```\n10 $ bash -v debug_script.sh\n```\n\nTry tracing to\
    \ see more details about what’s going on. Each statement gets a new line.\n\n\
    ```\n11 $ bash -x debug_script.sh\n```\n\nUsing these flags together can help\
    \ debug scripts where there is an elementary error, or even just working out what’s\
    \ going on when a script runs. I used it only yesterday to figure out why a systemctl\
    \ service wasn’t running or logging.\n\nFix the error you see before continuing.\n\
    \n#### Managing Variables\n\nVariables are a core part of most serious bash scripts\
    \ (and even one-liners!), so managing them is another important way to reduce\
    \ the possibility of your script breaking.\n\nChange your script to add the ‘set’\
    \ line immediately after the first line and see what happens.\n\n```\n12 #!/bin/bash\n\
    13 set -o nounset\n14 A=\"some value\"\n15 echo \"${A}\"\n16 echo \"${B}\"\n```\n\
    \nNow research what the `nounset` option does. Which `set` flag does this correspond\
    \ to?\n\nWithout running this, try and figure out what this script will do. Will\
    \ it run?\n\n```\n17 #!/bin/bash\n18 set -o nounset\n19 A=\"some value\"\n20 B=\n\
    21 echo \"${A}\"\n22 echo \"${B}\"\n```\n\nI always set `nounset` on my scripts\
    \ as a habit. It can catch many problems before they become serious.\n\n#### Profiling\
    \ Bash Scripts\n\nReturning to the `xtrace` (or `set -x`) flag, we can exploit\
    \ its use of a PS variable to implement the profiling of a script:\n\n```\n23\
    \ #!/bin/bash\n24 set -o nounset\n25 set -o xtrace\n26 declare A=\"some value\"\
    \n27 PS4='$(date \"+%s%N => \")'\n28 B=\n29 echo \"${A}\"\n30 A=\"another value\"\
    \n31 echo \"${A}\"\n32 echo \"${B}\"\n33 ls\n34 pwd\n35 curl -q bbc.co.uk\n```\n\
    \n#### Shellcheck\n\nFinally, here is a very useful tip for understanding bash\
    \ more deeply and improving any bash scripts you come across. Shellcheck is a\
    \ website ([http://www.shellcheck.net/](http://www.shellcheck.net/)) and a package\
    \ that gives you advice to help fix and improve your shell scripts. Very often,\
    \ its advice has prompted me to research more deeply and understand bash better.\n\
    \nHere is some example output from a script I found on my laptop:\n\n```\n$ shellcheck\
    \ shrinkpdf.sh\nIn shrinkpdf.sh line 44:\n          -dColorImageResolution=$3\
    \             \\\n                                 ^-- SC2086: Double quote to\
    \ prevent globbing and wo\\\nrd splitting.\n\nIn shrinkpdf.sh line 46:\n     \
    \     -dGrayImageResolution=$3              \\\n                             \
    \   ^-- SC2086: Double quote to prevent globbing and wor\\\nd splitting.\n\nIn\
    \ shrinkpdf.sh line 48:\n          -dMonoImageResolution=$3              \\\n\
    \                                ^-- SC2086: Double quote to prevent globbing\
    \ and wor\\\nd splitting.\n\nIn shrinkpdf.sh line 57:\n        if [ ! -f \"$1\"\
    \ -o ! -f \"$2\" ]; then\n                       ^-- SC2166: Prefer [ p ] || [\
    \ q ] as [ p -o q ] is not well d\\\nefined.\n\nIn shrinkpdf.sh line 60:\n   \
    \     ISIZE=\"$(echo $(wc -c \"$1\") | cut -f1 -d\\ )\"\n                    \
    \  ^-- SC2046: Quote this to prevent word splitting.\n                      ^--\
    \ SC2005: Useless echo? Instead of 'echo $(cmd)', just use '\\\ncmd'.\n\nIn shrinkpdf.sh\
    \ line 61:\n        OSIZE=\"$(echo $(wc -c \"$2\") | cut -f1 -d\\ )\"\n      \
    \                ^-- SC2046: Quote this to prevent word splitting.\n         \
    \             ^-- SC2005: Useless echo? Instead of 'echo $(cmd)', just use '\\\
    \ncmd'.\n```\n\nThe most common reminders are regarding potential quoting issues,\
    \ but you can see other useful tips in the above output, such as preferred arguments\
    \ to the `test` construct, and advice on ‘useless’ `echo`s.\n\n#### Cleanup\n\n\
    To clean up the above work:\n\n```\n36 $ cd .. && rm -rf lbthw_debugging\n```\n\
    \n#### What You Learned\n\nIn this section, you learned:\n\n*   bash flags useful\
    \ for debugging\n\n*   How to use traps and declare to trace the use of variables\n\
    \n*   How to make your scripts more robust with nounset\n\n*   How to use shellcheck\
    \ to help you reduce the risk of your scripts failing\n\n#### What Next\n\nNext\
    \ you will look at autocomplete functionality in bash.\n\n#### Exercises"
