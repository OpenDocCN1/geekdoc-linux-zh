    *   Bash 数组\n\n#### 接下来是什么？\n\n接下来，你将学习 bash 中实现的另一个核心语言特性：函数。\n\n#### 练习题\n\n\
    1) 获取你 shell 中获取 `env` 的输出，并弄清楚每个项为什么在那里，以及它们可能被什么使用。你可能需要使用 `man bash`，或者使用 google\
    \ 来查明。或者你可以尝试重新设置它并看看会发生什么。\n\n2) 找出 `BASH_VERSINFO` 中各项内容的含义。\n\n### Bash 中的函数\n\
    \n从一个角度来看，bash 可以被视为一种编程语言，尽管它是非常缓慢且原始的。\n\n它拥有的语言特性之一是创建和调用函数的能力。\n\n这引导我们进入\
    \ bash 中“命令”可以是什么的话题：\n\n*   函数\n*   别名 (alias)\n*   程序\n*   内置命令 (builtin)\n\n\
    本节涵盖这些项目以及它们之间的关系。结束时，你将对 bash 中的命令有更细致的理解。\n\n#### 这一部分有多重要？\n\n在不了解 bash 函数的情况下也可以应付，但任何严肃的\
    \ bash 用户都会知道它们的作用以及工作原理。\n\n#### 基础函数\n\n从创建一个简单的函数开始\n\n```\n1 $ function myfunc\
    \ {\n2         echo Hello World\n3 }\n4 $ myfunc\n```\n\n通过声明函数并将需要运行的代码块放在大括号内，你就可以在命令行上调用该函数，就像调用它是一个程序一样。\n\
    \n#### 参数\n\n与其他语言不同，这里对函数的参数没有检查。\n\n预测此代码的输出，然后运行它：\n\n```\n 5 $ function myfunc\
    \ {\n 6         echo $1\n 7         echo $2\n 8 }\n 9 $ myfunc \"Hello World\"\
    \n10 $ myfunc Hello World\n```\n\n你能解释输出吗？如果不能，你可能需要读读之前的页面！\n\n函数的参数从 1 到 n 编号。管理这些参数由函数本身决定。\n\
    \n#### 变量作用域\n\n变量在 bash 中有作用域。这在函数中特别有用，因为你不希望你的变量从函数外部被访问。\n\n这些命令说明了这一点：\n\n\
    ```\n11 $ function myfunc {\n12         echo $myvar\n13 }\n14 $ myfunc\n15 $ myvar=\"\
    Hi from outside the function\"\n16 $ myfunc\n```\n\nBash 函数没有特殊的作用域。外部的变量对它是可见的。\n\
    \n然而，bash 具有将变量声明为局部 (local) 的能力：\n\n```\n17 $ function myfunc {\n18         local\
    \ myvar=\"Hi from inside the function\"\n19         echo $myvar\n20 }\n21 $ myfunc\n\
    22 $ echo $myvar\n23 $ local myvar=\"Will this work?\"\n```\n\n用 `local` 声明的变量仅在函数内部可见和访问，且不会干扰外部。它不能在函数外部声明。\n\
    \n上面的 `local` 是 bash “内置命令 (builtin)” 的一个例子。现在是讨论不同类型命令的好时机。\n\n#### 函数、内置命令、别名和程序\n\
    \n在 bash 中调用命令至少有四种方法：\n\n*   内置命令\n*   函数\n*   程序\n*   别名\n\n让我们逐一来看。\n\n####\
    \ 内置命令\n\n内置命令是“内置”在 bash shell 程序中的命令。通常情况下，你无法轻易区分内置命令、函数、程序或别名。\n"
- fmt: '

    This section is essential reading.


    ## Basic Redirects


    Start off by creating a file:


    ```

    1 $ mkdir lbthw_pipes_redirects

    2 $ cd lbthw_pipes_redirects

    3 $ echo "contents of file1" > file1

    ```


    The `>` character is the ‘redirect’ operator. This takes the output from the preceding
    command that you’d normally see in the terminal and sends it to a file that you
    give it. Here it creates a file called `file1` and puts the echoed string into
    it. Try `cat`ing the file if you want to check with: `cat file1`.


    There’s a subtlety here which we’ll get to: sometimes not all the output you see
    in the terminal would get redirected by this, but don’t worry about this yet.


    ## Basic Pipes


    Type this in:


    ```

    4 $ cat file1 | grep -c file

    ```


    Normally you’d run a `grep` with the filename as the last argument, but instead
    here we ‘pipe’ the contents of `file1` into the `grep` command by using the ‘pipe’
    operator: `|`.


    A pipe takes the standard output of one command and passes it as the input to
    another. What, then is standard output, really? You will find out soon!


    ```

    5 $ cat file2

    ```


    What was the output of that?


    Now run this, and try and guess the result before you run it:


    ```

    6 $ cat file2 | grep -c file

    ```


    If the output wasn’t what you expected, then the answer is related to what’s called
    standard output, and other kinds of output. We will explain this further below.


    ## Standard Output vs Standard Error


    Before we get to ‘standard output’ and ‘standard error’, we need to take a step
    back.


    In Linux (and UNIX), it’s a fundamental design principle that ‘everything is a
    file’. This means that when pushing data into things, or pulling data out of things,
    everything is treated as though it is a file.


    For example, if you want to write to a terminal (or a ‘simple’ file, or a network
    interface), then you ‘open’ the file that corresponds to the terminal (or simple
    file, or network interface) and get back a ‘file descriptor’.


    The ‘file descriptor’ is a number associated with the process that represents
    that ‘file’. You can then write to that ‘file descriptor’ and the operating system
    will take care of ensuring the data goes to the right place in the appropriate
    way.


    Why did they design UNIX (and, later, the POSIX standard) this way? Because interacting
    with different types of data ‘sinks’ with a common interface means that you can
    stop worrying about how the data is managed behind the scenes, and just focus
    on what data goes in and comes out. For example, you don’t care whether a simple
    file is a file


    In the same way, you don’t care if you are writing to a terminal or a file. Both
    have the same interface, so you just write your data to whichever file descriptor
    represents the thing you want to write to.


    Why is this important for our use case here? In the case you saw above, the error
    when running `cat file2` was sent to a different file descriptor than the output
    when you ran `cat file1`. Remember, `file2` does not exist (so `cat`ing it throws
    an error), while `file1` does exist.


    In UNIX/Linux each process gets three file descriptors by default. They are numbered
    zero to two:


    * 0 is ‘standard input’

    * 1 is ‘standard output’

    * 2 is ‘standard error’


    When you ran `cat file1`, it took the filename you gave it and wrote the contents
    of that file out to the ‘standard output’ file descriptor `1`. By default, this
    is linked to the terminal, so you see this output on the terminal.


    When you ran `cat file2`, it took the filename you gave it, and worked out that
    that filename did not exist. So it wrote the error message containing `No such
    file or directory` to the ‘standard error’ file descriptor `2`. By default, this
    is also linked to the terminal, so normally you would see no difference in the
    output compared to the ‘standard output’ of a ‘normal’ `cat` command.


    So here is the key point: the `|` operator is a sink only for data passed into
    the ‘standard output’ file descriptor of the command on the left. Everything else
    it ignores. So when the command on the left (`cat` in this case) pushes data to
    the ‘standard error’ file descriptor, this still goes to the terminal.


    Similarly, when you redirect output to a file, the `>` operator sends only the
    standard output to the file. Anything sent to standard error is not captured in
    the file.


    What if you want to redirect standard error to a file? Try this:


    ```

    7 $ command_does_not_exist

    8 $ command_does_not_exist 2> /dev/null

    ```


    In the second line above, the file descriptor `2` (standard error) is directed
    to a file called `/dev/null`.


    When you use the standard redirection operator, you are implicitly using the file
    descriptor `1`. Therefore these two commands are equivalent:


    ```

    9 $ echo "contents of file1" 1> file1

    10 $ echo "contents of file1" > file1

    ```


    The number before the `>` symbol indicates the file descriptor to redirect.


    The file `/dev/null` is a special kind of sink file created by Linux (and UNIX)
    kernels. It is effectively a black hole into which data can be pumped: anything
    written to it will be read in and ignored.


    Another commonly seen redirection operator is `2>&1`.


    ```

    11 $ command_does_not_exist 2>&1

    ```


    What this does is tell the shell to send standard error (`2`) to whatever standard
    output (`1`) is pointed at.


    ```

    12 $ command_does_not_exist > outfile 2>&1

    13 $ command_does_not_exist 2>&1 >

    ```


    This pattern of sending all the output to a single file is seen very often, and
    few understand why it has to be in that order. Once you understand, you will never
    pause to think about which way round the operators should go!


    ## Differences Between Pipes and Redirects


    To recap:


    * A pipe passes ‘standard output’ as the ‘standard input’ to another command

    * A redirect sends output from a file descriptor to a file


    A couple of other commonly used operators are worth mentioning here:


    ```

    14 $ grep -c file < file1

    ```


    The `<` operator redirects standard *input* (file descriptor `0`) *to* the command
    from a file, in this case having the same effect as `cat file1 | grep -c file`
    did.


    ```

    15 $ echo line1 > file3

    16 $ echo line2 > file3

    17 $ echo line3 >> file3

    18 $ cat file3

    ```

