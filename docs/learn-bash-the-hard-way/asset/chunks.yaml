    达到类似的效果。\n\n### `while` 和 `until`\n\nbash 中也存在 while 循环。尝试推导出这个例子发生了什么：\n\n```bash\n\
    15 $ n=0\n16 $ while [[ ! -a newfile ]]\n17 do\n18         ((n++))\n19       \
    \  echo \"In iteration $n\"\n20         if $(cat file${n}.txt) == \"15\" ]]\n\
