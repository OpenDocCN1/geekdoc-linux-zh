    ```

    19 $ ls .*

    ```


    you get a slightly more complicated output, as `ls` returns richer output depending
    on whether the item is a file or a folder. If it’s a folder, it shows every (non-hidden)
    file within that folder under a separate heading.


    #### Differences to Regular Expressions


    While globs look similar to regular expressions (regexes), they are used in different
    contexts and are separate things.


    The `*` characters in this command have a different significance depending on
    whether it is being treated as a glob or a regular expression.


    ```

    21 $ rename -n ''s/(.*)/new$1/'' *

    22 ''file1'' would be renamed to ''newfile1''

    23 ''file2'' would be renamed to ''newfile2''

    24 ''file3'' would be renamed to ''newfile3''

    ```


    *   Line 21 contains the command that renames all filenames to prepend ‘new’ in
    front. The `-n` flag tells rename to just print out the files that would be changed,
    and not actually carry out the renaming


    *   Lines 22-24 show the files that would be renamed'
