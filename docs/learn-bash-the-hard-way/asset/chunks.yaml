    #### How Important is this Section?


    Learning this concept will save you a great deal of time trying to figure out
    why your for loop is not working as expected, and will help you write more correct
    bash scripts that won’t fail.


    ### Files With Spaces


    Create a folder to work in:


    ```

    1 $ mkdir lbthw_ifs && cd lbthw_ifs

    ```


    Now create a couple of files with spaces in:


    ```

    2 $ echo file1 created > "Spaces in filename1.txt"

    3 $ cat "Spaces in filename1.txt"

    4 $ echo file2 created > "Spaces in filename2.txt"

    5 $ cat "Spaces in filename2.txt"

    ```


    Note that you have to quote the filename to get the spaces in. Without the quotes,
    `bash` treats the space as a token separator. This means that it would treat the
    redirection as going to the file ‘Spaces’ and not know what to do with the ‘in’
    and ‘filenameN.txt’ tokens.


    Now if you write a for loop over these files that just runs `ls` on each file
    in turn, you might not get what you expect. Type this in and see what happens:


    ```

    6 $ for f in $(ls)

    7 > do

    8 >   ls $f

    9 > done

    ```


    Hmmm. The for loop has treated every word in the filenames as a separate token
    to look for with `ls`.


    In other words, `bash` has treated each space as a `field separator`. Normally
    this is fine, as our for loops have items separated by spaces, like this:


    ```

    10 $ for f in 1 2 3 4

    11 > do

    12 >   echo $f

    13 > done

    ```


    However, we want the spaces to be ignored. And we can control this by setting
    the `IFS` shell variable.


    #### The IFS Shell Variable


    ```

    14 $ echo $IFS

    ```


    If you retained the default, then you will have seen nothing in the output, which
    isn’t very helpful. To see how it’s really set up, we can use `set`:


    ```

    15 $ set | grep IFS

    ```


    ```

    IFS=$'' \t\n''

    ```


    Recall that the `$` before the single quotes means that the variable is showing
    you special characters with thebackslash escape notation. Above, the `IFS` variable
    is set to: space, tab, and newline.


    `bash` takes the characters in that variable and will treat any of them as a field
    separator, which means that the original for loop you wrote above will create
    from these files:


    ```

    Spaces in filename1.txt

    Spaces in filename2.txt

    ```


    these list of items:


    ```

    Spaces

    in

    filename1.txt

    Spaces

    in

    filename2.txt

    ```


    What we want to do is treat the spaces like any other character. We can do this
    by setting the `IFS` shell variable.


    ```

    16 $ IFS=$'' \t\n''

    17 $ for f in $(ls)

    18 > do

    19 >   ls $f

    20 > done

    ```


    which is much neater and easier to manage.


    #### The Null Byte as Separator


    While we’re on the subject, it’s worth mentioning a `NUL` byte is literally a
    byte of zero. It doesn’t get displayed on the screen, but can be read by `xargs`
    as the separator. By adding the `-print0` flag, `find` no longer uses a new line
    as field separator.


    ```

    find . -type f -print0 | xargs -0

    ```


    This might sound obscure but come up often in these cases you filenames containing
    spaces.


