  trans: "\n\n在这里提个警告：虽然了解此功能很有用，但为了这个目的，学习 `sed` 和 `perl` 程序被认为更有用。此外，除了正则表达式之外，还要学习这种额外类型的通配符（glob）语法，也相当令人困惑（而且正则表达式也有不同的版本！）。如果你觉得这一部分太晦涩，请随意跳过。\n\
    \n```\n19 $ shopt -s extglob\n20 $ A=\"12345678901234567890\"\n21 $ B=\"  ${A}\
    \  \"\n```\n\n你已经确保了 `extglob` 选项已开启，并创建了一个新变量 `B`，它是 `A` 前后各有两个空格。在 `echo` 输出中使用了管道符\
    \ `|` 来显示空格所在的位置。\n\n```\n25 $ echo \"B      |${B}|\"\n26 $ echo \"B#+( ) |${B#+(\
    \ )}|\"\n27 $ echo \"B#?( ) |${B#?( )}|\"\n28 $ echo \"B#*( ) |${B#\\*( )}|\"\n\
    29 $ echo \"B##+( )|${B##+( )}|\"\n30 $ echo \"B##*( )|${B##*( )}|\"\n31 $ echo\
    \ \"B##?( )|${B##?( )}|\"\n```\n\n通过 `bash` 帮助页并进行实验，你能找出上述 extglobs 之间的差异吗？它们是：\n\
    \n* `?( )`\n* `+( )`\n* `*( )`\n\n现在尝试在上面用 `%` 代替 `#`。发生了什么？\n\n这是一个潜在方便的应用是在需要移除日期中的前导零时：\n\
    \n```\n32 $ TODAY=$(date +%j)\n33 $ TODAY=${TODAY##+(0)}\n```\n\n记住：在美式键盘上，`#`\
    \ 在左侧，`%` 在右侧。或者在字母表中，“hash”在“per cent”之前。\n\n### 引用地狱\n\n引用——正如你可能已经看到的——在 bash\
    \ 中很快就会变得非常复杂。\n\n尝试这个：\n\n```\n34 $ echo 'I really want to echo $HOME and I can't\
    \ avoid it'\n```\n\n哦不。你现在卡住了。\n\n你能看出为什么吗？\n\n按下 `CTRL-c` 退出。\n\n所以你可能想尝试这个：\n\
    \n```\n35 $ echo \"I really want to echo $HOME and I can't avoid it\"\n```\n\n\
    但这次 `$HOME` 变量被求值了，输出不是你想要的。\n\n尝试这个：\n\n```\n36 $ echo 'I really want to echo\
    \ $HOME and I'\"'\"'t avoid it'\n```\n\n这行得通了。记住这个技巧，因为它可以节省你大量时间！\n\n### 清理\n\
    \n这一部分不需要清理，尽管你可能想退出当前的 bash shell 并启动一个新的，因为你刚才上面设置了一个 shell 选项（extglob）。\n\n\
    ### 你学到的内容\n\n这一节教了你如何使用纯 bash 进行字符串管理。这是一个相对较少涉及的领域，但值得了解一下，以防你以后遇到它。你学习了：\n\n\
    * 如何使用纯 bash 编辑字符串\n* 如何确定字符串长度\n* 什么是 extglobs 以及你如何使用它们\n* 如何避免常见的引用问题\n\n###\
    \ 下一步做什么\n\n在下一节中，你将查看 bash 的调试能力。\n\n### 练习题\n\n1) 学习如何在 sed 中完成上述所有操作。这需要一些研究和时间。\n\
    2) 学习如何在 perl 中完成上述所有操作。这同样需要一些研究和时间！\n3) 构建一个实用的 echo，其内部双引号字符串内包含一个单引号字符串，例如输出以下内容的内容：\n\
    \nHe said ‘I thought she’d said “bash was easy when $s are involved” but that\
    \ can’t be true!’\n\n### 调试 Bash 脚本\n\n有一些用的技巧值得知道，可以帮助调试你的 bash 脚本。在在这里介绍一些技巧的同时，你也将学习如何让你的\
    \ bash 脚本更健壮，更不容易出错。\n\n在这一节中你将学习到：\n\n* 用于调试的各种 bash 标记\n* 如何追踪 bash 代码以确定它正在做什么\n\
    * 在 bash 进行脚本检查（Linting）\n\n#### 这一节有多重要？\n\n如果你编写、使用或维护任何复杂性的 bash，你都会想知道如何调试它！\n\
    \n#### 语法检查选项\n\n从创建这个简单的脚本开始：\n\n```\n1 $ mkdir -p lbthw_debugging && cd lbthw_debugging\n\
    2 $ cat > debug_script.sh << 'END'\n3 #!/bin/bash\n4 A=some value\n5 echo \"${A}\n\
    6 echo \"${B}\"\n7 END\n```\n\n现在使用 `-n` 标记运行它。该标记只解析脚本而不运行它。它对于检测基本的语法错误非常有用。\n\
    \n```\n8 $ bash -n debug_script.sh\n```\n\n你可以看到它是坏的。修复它。然后运行它：\n\n```\n9 $ bash\
    \ debug_script.sh\n```\n\n现在使用 `-v` 运行以详细输出。\n\n```\n10 $ bash -v debug_script.sh\n\
    ```\n\n尝试追踪以查看发生情况的更多细节。每个语句都会占一行。\n\n```\n11 $ bash -x debug_script.sh\n```\n\
    \n结合使用这些标记可以帮助存在基础错误的脚本，甚至只是弄清楚发生了什么。\n\n#### 管理变量\n\n变量是 bash 的核心部分，所以管理它们是另一个重点。\n\
    \n```\n23 #!/bin/bash\n24 set -o nounset\n25 set -x \n26 A=\"some value\"\n27\
    \ echo \"${A}\"\n28 B=\"another value\"\n29 echo \"${B}\"\n30 unset -u nounset\n\
    ```\n\n#### 析 Bash 脚本\n\n回到 `set` 标记，我们可以利用它的用法。\n\n```\n33 #!/bin/bash\n34 set\
    \ -o nounset\n35 set -x \n36 A=\"some value\"\n37 echo \"${A}\"\n38 B=\"another\
    \ value\"\n39 echo \"${B}\"\n40 unset -u nounset\n```\n\n#### Shellcheck\n\n最后，这里有一个实用的技巧。\n\
    \n"
- fmt: "\n1) Find a large `bash` script on a social coding site such as `GitHub`,\
    \ and run `shellcheck` over it. Contribute back any improvements you find.\n\n\
    ## Autocomplete\n\nIf you’ve used `bash` for any length of time, then you will\
    \ likely already be familiar with its autocomplete capabilities.\n\nIf not, then\
    \ you might want to start using it!\n\nIn this section you will cover:\n\n* How\
    \ autocomplete works in `bash`\n* The `bash` `shift` command\n* Changing case\
    \ using string manipulation\n\n### How Important is this Section?\n\nIn this section\
    \ you will build on what you learned previously about:\n\n* `Bash` arrays\n* Terminal\
    \ escape codes\n* Built-ins\n* `Bash` functions\n* `Bash` startup scripts\n\n\
    to comprehend more deeply a feature you will probably use almost every time you\
    \ use `bash`.\n\n## Autocompleting\n\n### Autocompleting Commands\n\nIf you hit\
    \ the ‘Tab’ key on your keyboard twice at the default prompt, then you should\
    \ see something like this:\n\n```\nDisplay all 2266 possibilities (y or n)?\n\
    ```\n\nIf you’re brave enough to hit ‘y’ then you will see a list of all the commands\
    \ available in your `path`.\n\nTo escape that list, hit ‘q’.\n\nNow if you try\
    \ typing ‘z’ on a fresh shell command line, and then hit ‘Tab’ twice, you will\
    \ likely immediately see the commands available that begin with ‘z’.\n\nThat’s\
    \ autocomplete in `bash` - by default, you get the commands available that match\
    \ the letters you’ve typed in so far. This is handy if you can only remember part\
    \ of a command, or you just want to see what commands start with ‘q’ (try it!).\n\
    \n### Autocompleting Arguments\n\nIn addition to looking for commands, `bash`’s\
    \ autocomplete can be made to be context-aware. A simple example of this is to\
    \ see what happens when you type `ls`, and then a space, and then ‘Tab’ twice\
    \ on a fresh shell line. What happens? You should see that this time commands\
    \ are not listed, but something else…\n\nListing local files is something of a\
    \ default in `bash` - it assumes that arguments are likely to be files. What I’m\
    \ going to show you next is how you can get `bash` to be even more context dependent\
    \ with auto-complete to the point where you can advise the user of your specific\
    \ program about what is available to them.\n\n## A Simple Program\n\nFirst you’re\
    \ going to create a program called `myecho`. As you type it in, try and work out\
    \ what it’s doing.\n\nIf you don’t understand a line or command in there, then\
    \ try and find out what it does by playing with it in a toy script, or try to\
    \ find out from `man bash`.\n\n```\n 1 $ mkdir -p lbthw_autocomplete && cd lbthw_autocomplete\n\
    \ 2 $ cat > myecho << END\n 3 > #!/usr/bin/env bash\n 4 > function usage() {\n\
    \ 5 > \techo \"Usage: $0 [red|green|blue] [message]\"\n 6 > \texit $1\n 7 > }\n\
    \ 8 > if [ -z \"$1\" ]\n 9 > then\n10 > \tusage 1\n11 > fi\n12 > typeset -l COLOR=\"\
    $1\"\n13 > shift\n14 > RED='\\033[0;31m'\n15 > GREEN='\\033[0;32m'\n16 > BLUE='\\\
    033[0;34m'\n17 > MSG=\"$@\"\n18 > COLOR=${COLOR,,}\n19 > if [[ \"${COLOR}\" =\
    \ 'red' ]]\n20 > then\n21 > \tMSG=\"${RED}${@}${RED}\"\n22 > elif [[ \"${COLOR}\"\
    \ = 'green' ]]\n23 > then\n24 > \tMSG=\"${GREEN}${@}${GREEN}\"\n25 > elif [[ \"\
    ${COLOR}\" = 'blue' ]]\n26 > then\n27 > \tMSG=\"${BLUE}${@}${BLUE}\"\n28 > else\n\
    29 > \tusage 1\n30 > fi\n31 > echo -e \"${MSG}\"\n32 > END\n```\n\nIf you’re still\
    \ struggling, then other sections of this book will help enlighten you. The only\
    \ new command here is `shift`. You may be able to work out what `shift` does from\
    \ context, but just in case it’s not obvious, it takes the first argument from\
    \ your command line and removes it from the list of arguments passed in. This\
    \ is handy for processing command line arguments, as you can keep calling `shift`\
    \ until all the arguments are processed. Such a looping construct is used in many\
    \ `bash` scripts.\n\nYou may also have not come across the variable `$@` before.\
    \ Try finding out from the `man bash` page what it holds.\n\nIf you can’t find\
    \ it, don’t worry, it’s not easy to find in there. Look for the section on ‘Special\
    \ Parameters’.\n\nIf you still can’t figure it out, then try adding `echo` statements\
    \ to figure out what’s going on. Keep at it.\n\nFinally, can you figure out what\
    \ the two commas in `${COLOR,,}` do? If not, play with it on the command line.\
    \ This playing is how you learn and embed the `bash` knowledge as you get more\
    \ advanced.\n\nNow you’ve created the `myecho` script, make it executable and\
    \ available on your `path`, and run it:\n\n```\n33 $ chmod +x myecho\n34 $ PATH=.:${PATH}\n\
    35 $ myecho red WARNING this is dangerous\n36 $ myecho green OK good to go\n```\n\
    \nTry changing the case of the color argument (eg ‘GreeN’ and see what happens).\n\
    \n## Adding Autocomplete\n\nIf you want to get a bit more sophisticated with `bash`,\
    \ then you have other variables than `COMPREPLY` available. For this simple program\
    \ you’re going to provide a hint to if the user has already input a color.\n\n\
    ```\n47 $ cat > myecho << END\n48 > myecho_completion()\n49 > {\n50 >   if [ ${COMP_CWORDS\
    \ -ge 2 ]\n51 >   then\n52 >     COMPREPLY+=(\"Input\")\n53 >     COMPREPLY+=(\"\
    message!\")\n54 >   else\n55 >     COMPREPLY+=(\"red\")\n56 >     COMPREPLY+=(\"\
    blue\")\n57 >     COMPREPLY+=(\"green\")\n58 >   fi\n59 > }\n60 > complete -F\
    \ myecho_completion myecho\n61 > END\n62 $ source myecho\n```\n\nNow if you type\
    \ `myecho red`, followed by a space and then two ‘Tab’s, you should see the instruction\
    \ on the line.\n\nThis is not exactly a neat way to get this information across.\
    \ Unfortunately, the completion output functionality is not very flexible. You\
    \ might want to try implementing a better solution with `echo`s or longer `COMPREPLY`\
    \ entries to see its limitations.\n\n### Advanced Autocomplete Functionality\n\
    \nIf you want to get a bit more sophisticated with `bash`, then you have other\
    \ variables than `COMPREPLY`.\n\n```\n37 $ cat > myecho << END\n38 > myecho_completion()\n\
    39 > {\n40 >   COMPREPLY+=(\"red\")\n41 >   COMPREPLY+=(\"blue\")\n42 >   COMPREPLY+=(\"\
    green\")\n43 > }\n44 > complete -F myecho_completion myecho\n45 > END\n46 $ source\
    \ myecho\n```\n\nNow if you type `myecho`, followed by a space and then two ‘Tab’s,\
    \ you should see the colors.\n\n## Automate It\n\nAlthough this is useful, it\
    \ is not realistic to `source` the completion scripts every time you might want\
    \ to use the particular command you have an autocomplete script for.\n\nFor this\
    \ reason, you can add these functions to your `bash` startup scripts (see the\
    \ section on ‘Scripts and Startups’ in Part I) so that they are available whenever\
    \ you use `bash` on that machine.\n\n## Cleanup\n\nTo clean up, run:\n\n```\n\
    63 $ cd .. && rm -rf lbthw_autocomplete\n```\n\n## What You Learned\n\n* How autocomplete\
    \ works in `bash`\n* How to create your own autocomplete function\n* How to handle\
    \ arguments to `bash` scripts and functions using `shift`\n* How to change the\
    \ case of string variables\n\n## What Next?\n\nTo finish this book, you will look\
    \ at a more complete `bash` program that can function as a continuous integration\
    \ tool.\n\n## Exercises\n\n1) Write autocomplete scripts for already-existing\
    \ programs you use often.\n2) Look for autocomplete scripts on `GitHub`, and install\
    \ and use them locally.\n"
  raw: "1) Find a large bash script on a social coding site such as GitHub, and run\
    \ shellcheck over it. Contribute back any improvements you find.\n\n### Autocomplete\n\
    \nIf you’ve used bash for any length of time, then you will likely already be\
    \ familiar with its autocomplete capabilities.\n\nIf not, then you might want\
    \ to start using it!\n\nIn this section you will cover:\n\n*   How autocomplete\
    \ works in bash\n\n*   The bash `shift` command\n\n*   Changing case using string\
    \ manipulation\n\n#### How Important is this Section?\n\nIn this section you will\
    \ build on what you learned previously about:\n\n*   Bash arrays\n\n*   Terminal\
    \ escape codes\n\n*   Built-ins\n\n*   Bash functions\n\n*   Bash startup scripts\n\
    \nto comprehend more deeply a feature you will probably use almost every time\
    \ you use bash.\n\n#### Autocompleting Commands\n\nIf you hit the ‘Tab’ key on\
    \ your keyboard twice at the default prompt, then you should see something like\
    \ this:\n\n```\nDisplay all 2266 possibilities (y or n)?\n```\n\nIf you’re brave\
    \ enough to hit ‘y’ then you will see a list of all the commands available in\
    \ your path.\n\nTo escape that list, hit ‘q’.\n\nNow if you try typing ‘z’ on\
    \ a fresh shell command line, and then hit ‘Tab’ twice, you will likely immediately\
    \ see the commands available that begin with ‘z’.\n\nThat’s autocomplete in bash\
    \ - by default, you get the commands available that match the letters you’ve typed\
    \ in so far. This is handy if you can only remember part of a command, or you\
    \ just want to see what commands start with ‘q’ (try it!).\n\n#### Autocompleting\
    \ Arguments\n\nIn addition to looking for commands, bash’s autocomplete can be\
    \ made to be context-aware. A simple example of this is to see what happens when\
    \ you type `ls`, and then a space, and then ‘Tab’ twice on a fresh shell line.\
    \ What happens? You should see that this time commands are not listed, but something\
    \ else…\n\nListing local files is something of a default in bash - it assumes\
    \ that arguments are likely to be files. What I’m going to show you next is how\
    \ you can get bash to be even more context dependent with auto-complete to the\
    \ point where you can advise the user of your specific program about what is available\
    \ to them.\n\n#### A Simple Program\n\nFirst you’re going to create a program\
    \ called `myecho`. As you type it in, try and work out what it’s doing.\n\nIf\
    \ you don’t understand a line or command in there, then try and find out what\
    \ it does by playing with it in a toy script, or try and find out from `man bash`.\n\
    \n```\n 1 $ mkdir -p lbthw_autocomplete && cd lbthw_autocomplete\n 2 $ cat > myecho\
    \ << END\n 3 > #!/usr/bin/env bash\n 4 > function usage() {\n 5 > \techo \"Usage:\
    \ $0 [red|green|blue] [message]\"\n 6 > \texit $1\n 7 > }\n 8 > if [ -z \"$1\"\
    \ ]\n 9 > then\n10 > \tusage 1\n11 > fi\n12 > typeset -l COLOR=\"$1\"\n13 > shift\n\
    14 > RED='\\033[0;31m'\n15 > GREEN='\\033[0;32m'\n16 > BLUE='\\033[0;34m'\n17\
    \ > MSG=\"$@\"\n18 > COLOR=${COLOR,,}\n19 > if [[ \"${COLOR}\" = 'red' ]]\n20\
    \ > then\n21 > \tMSG=\"${RED}${@}${RED}\"\n22 > elif [[ \"${COLOR}\" = 'green'\
    \ ]]\n23 > then\n24 > \tMSG=\"${GREEN}${@}${GREEN}\"\n25 > elif [[ \"${COLOR}\"\
    \ = 'blue' ]]\n26 > then\n27 > \tMSG=\"${BLUE}${@}${BLUE}\"\n28 > else\n29 > \t\
    usage 1\n30 > fi\n31 > echo -e \"${MSG}\"\n32 > END\n```\n\nIf you’re still struggling,\
    \ then other sections of this book will help enlighten you. The only new command\
    \ here is `shift`. You may be able to work out what `shift` does from context,\
    \ but just in case it’s not obvious, it takes the first argument from your command\
    \ line and removes it from the list of arguments passed in. This is handy for\
    \ processing command line arguments, as you can keep calling `shift` until all\
    \ the arguments are processed. Such a looping construct is used in many bash scripts.\n\
    \nYou may also have not come across the variable `$@` before. Try finding out\
    \ from the `man bash` page what it holds.\n\nIf you can’t find it, don’t worry,\
    \ it’s not easy to find in there. Look for the section on ‘Special Parameters’.\n\
    \nIf you still can’t figure it out, then try adding echo statements to figure\
    \ out what’s going on. Keep at it.\n\nFinally, can you figure out what the two\
    \ commas in `${COLOR,,}` do? If not, play with it on the command line. This playing\
    \ is how you learn and embed the bash knowledge as you get more advanced.\n\n\
    Now you’ve created the `myecho` script, make it executable and available on your\
    \ path, and run it:\n\n```\n33 $ chmod +x myecho\n34 $ PATH=.:${PATH}\n35 $ myecho\
    \ red WARNING this is dangerous\n36 $ myecho green OK good to go\n```\n\nTry changing\
    \ the case of the color argument (eg ‘GreeN’ and see what happens. Was that what\
    \ you expected?). What part of the code is responsible for this?\n\n#### Adding\
    \ Autocomplete Functionality\n\nNow let’s say that it is some time later, and\
    \ you’ve forgotten about your brilliant `myecho` script.\n\nYou type `myecho`\
    \ on the command line, followed by a space and then hit ‘Tab’ twice.\n\nWouldn’t\
    \ it be good if autocomplete could present the three color options to you when\
    \ auto-completing?\n\nYou can do that. Type out this script:\n\n```\n37 $ cat\
    \ > myechocomplete << END\n38 > myecho_completion()\n39 > {\n40 >   COMPREPLY+=(\"\
    red\")\n41 >   COMPREPLY+=(\"blue\")\n42 >   COMPREPLY+=(\"green\")\n43 > }\n\
    44 > complete -F myecho_completion myecho\n45 > END\n```\n\nTo make your shell\
    \ aware of it, type:\n\n```\n46 $ source myechocomplete\n```\n\nNow if you type\
    \ `myecho`, followed by a space and then two ‘Tab’s, you should see the three\
    \ options.\n\nThe `complete` command is a builtin, and the `-F` flag expects a\
    \ function to be given to it, and will run it when the last argument to complete\
    \ is typed on the command line and autocomplete is triggered.\n\nWhen the function\
    \ is run bash expects you to add to an array called `COMPREPLY` to give the options\
    \ that should be made available to the user when they try to autocomplete. The\
    \ three colors added above are the displayed to the user from the array.\n\n####\
    \ Advanced Autocomplete Functionality\n\nIf you want to get a bit more sophisticated\
    \ with bash’s autocomplete, then you have other variables than `COMPREPLY` available\
    \ to you. For this simple program you’re going to provide a hint to input a message\
    \ if the user has already input a color argument to `myecho`.\n\n```\n47 $ cat\
    \ > myechocomplete << END\n48 > myecho_completion()\n49 > {\n50 >   if [ ${COMP_CWORDS\
    \ -ge 2 ]\n51 >   then\n52 >     COMPREPLY+=(\"Input\")\n53 >     COMPREPLY+=(\"\
    message!\")\n54 >   else\n55 >     COMPREPLY+=(\"red\")\n56 >     COMPREPLY+=(\"\
    blue\")\n57 >     COMPREPLY+=(\"green\")\n58 >   fi\n59 > }\n60 > complete -F\
    \ myecho_completion myecho\n61 > END\n62 $ source myechocomplete\n```\n\nNow if\
    \ you type `myecho red`, followed by a space and then two ‘Tab’s, you should see\
    \ the instruction on the line.\n\nThis is not exactly a neat way to get this information\
    \ across. Unfortunately, the completion output functionality is not very flexible.\
    \ You might want to try implementing a better solution with `echo`s or longer\
    \ `COMPREPLY` entries to see its limitations.\n\n#### Automate It\n\nAlthough\
    \ this is useful, it is not realistic to `source` the completion scripts every\
    \ time you might want to use the particular command you have an autocomplete script\
    \ for.\n\nFor this reason, you can add these functions to your bash startup scripts\
    \ (see the section on ‘Scripts and Startups’ in Part I) so that they are available\
    \ whenever you use bash on that machine.\n\n#### Cleanup\n\nTo clean up, run:\n\
    \n```\n63 $ cd .. && rm -rf lbthw_autocomplete\n```\n\n#### What You Learned\n\
    \n*   How autocomplete works in bash\n\n*   How to create your own autocomplete\
    \ function\n\n*   How to handle arguments to bash scripts and functions using\
    \ `shift`\n\n*   How to change the case of string variables\n\n#### What Next?\n\
    \nTo finish this book, you will look at a more complete bash program that can\
    \ function as a continuous integration tool.\n\n#### Exercises\n\n1) Write autocomplete\
    \ scripts for already-existing programs you use often.\n\n2) Look for autocomplete\
    \ scripts on GitHub, and install and use them locally."
