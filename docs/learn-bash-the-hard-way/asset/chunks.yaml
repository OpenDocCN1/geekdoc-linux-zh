- fmt: "\n```bash\n#!/bin/bash\n\n# Options are placed right at the top.\nset -o pipefail\n\
    set -o errunset\n\n# Set up defaults to sensible values.\nFORCE=0\nVERBOSE=0\n\
    REPO=\"\"\nEMAIL=\"\"\nNAME=\"ci\"\nTEST_DIR=\".\"\nTEST_COMMAND=\"./test.sh\"\
    \nMAIL_CMD=\"mail\"\nMAIL_CMD_ATTACH_FLAG=\"-A\"\nMAIL_CMD_RECIPIENTS_FLAG=\"\
    -t\"\nMAIL_CMD_SUBJECT_FLAG=\"-s\"\nPRE_SCRIPT=\"/bin/true\"\nPOST_SCRIPT=\"/bin/true\"\
    \nTIMEOUT_S=86400\n\n# Set up the 'PAGER' variable, defaulting to 'more' in case\
    \ it is unset in the\n# environment.\nPAGER=${PAGER:more}\n\n# 'show_help' is\
    \ a function that sends useful help to the standard output.\n# I put it in a function\
    \ in case it might be called from more than one place\n# in the script.\nfunction\
    \ show_help() {\n    cat > /dev/stdout << END\n${0} -r <repo> -l <local_checkout>\
    \ [-q <pre-script>] [-w <post-script>]\n   [-m <email>] [-a <mail command>] [-t\
    \ <mail command attach flag>]\n   [-s <mail command subject flag] [-e <recipients\
    \ flag>] [-n name] [-d <dir>]\n   [-c <command>] [-f] [-v] [-h]\n\nREQUIRED ARGS:\n\
    -r - git repository, eg https://github.com/myname/myproj (required)\n-l - local\
    \ checkout of code (that gets updated to determine whether a run is needed)\n\
    (required)\n\nOPTIONAL ARGS:\n-q - script to run just before actually performing\
    \ test (default ${PRE_SCRIPT})\n-w - script to run just after actually performing\
    \ test (default ${POST_SCRIPT})\n-m - email address to send to using \"mail\"\
