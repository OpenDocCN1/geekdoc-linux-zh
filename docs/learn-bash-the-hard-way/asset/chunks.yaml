    Finally, `\C-w` deletes the word before the cursor.


    These are the most commonly-used shortcuts that are picked up by the terminal
    before they get to the `readline` library.


    ## What You Learned


    * What the `readline` library is

    * What features it gives you

    * How to find out more about those features

    * The order in which terminal options and `readline` are considered

    * Some terminal-native shortcuts

    * How key combinations are represented in standard documentation


    ## What Next?


    Armed with your increased knowledge of how the `readline` library works, and terminal
    program settings, you are ready to tackle the tricky subject of terminal codes.


    ## Cleanup


    You may want to close your bash shell (perhaps with `\C-d`!) and open up a fresh
    one as you might have tinkered with your default settings above.


    ## Exercises


    1) Research the terminal options’ shortcuts in the `stty -e` table and what they
    mean.

    2) Research the `inputrc` file and edit it to configure how `backward-kill-word`
    is invoked.


    ## Terminal Codes and Non-Standard Characters


    Although not directly related to bash, if you spend any time at a terminal, then
    it will pay off to understand how the terminal works with non-standard characters.


    You’ve already learned about the `readline` library and terminal options and how
    certain keystrokes can be ‘caught’ and handled in other ways before they get to
    the terminal. Here we look at how other non-standard can be handled in the bash
    shell.


    Non-standard characters are characters like ‘tab’, ‘newline’, ‘carriage return’,
    and even the ‘end of file’ characters. They don’t form part of words, or necessarily
    print anything to the screen, but they are bytes interpreted by the shell and
    the terminal if they get that far.


    In this section you’ll:


    * Understand how to output any byte with `echo`

    * Understand how to input a character while by-passing terminal options and the
    `readline` library

    * Learn about carriage returns and newlines and how they are used

    * Learn how to use `hexdump`

    * Learn about standard terminal escape codes


    ### How Important is this Section?


    This section is somewhat more advanced, and probably not essential to using bash
    at the start. It can also be hard to grasp, so if you’re new to bash I recommend
    returning to it later if it’s hard to understand the first time you read it.


    However, knowledge of this area will catapult you to an elite that understand
    how terminals can be manipulated, and also enable you to understand how your prompt
    can be manipulated.


    ### Non-Printable Characters


    The terminal you use has what are described can output ‘printable’ characters
    and ’non-printable’ characters.


    For example, typing a character like ‘a’ (normally) results in the terminal adding
    an ‘a’ to the screen. But there are other characters that tell the terminal to
    do different things that don’t necessarily involve writing a character you’d recognise.


    It’s easy to forget this, but not everything is sent to the computer is directly
    printed to the screen. The terminal ‘driver’ takes what it is given (which is
    one or more bytes) and decides what to do with it. It might decide to print it
    (if it’s a ‘normal’ character), or it might tell the computer to emit a beep,
    or it might change the color of the terminal, or delete and go back a space, or
    it might send a message to the running program to exit.


    When looking at non-printable characters, it’s useful to be aware of couple of
    utilities that help you understand what’s on. The first of these is a familiar:
    `echo`.


    ### Using echo


    You’re already familiar with `echo`, but it has some flags you’ve not already
    used:


    ```

    1 $ echo -n ''JUST THESE CHARERS''

    ```


    The `-n` flag tells `echo` not to print a newline.


    ```

    2 $ echo -n $''JUST THESE CHARERS AND A NEWLINE''

    ```


    The `$` before the string makes us sure that bash will interpret `\n` as a newline
    on the screen, and won’t just print out the characters. Try it without `$` if
    you’re unsure. Here, the backslash `\` makes `echo` aware that a ‘special’ character
    is coming. Being able to add a newline in this way means you can send a newline
    to the terminal via `echo` command, without confusing the line by hitting the
    return key.


    Other special characters include `\b` (for backspace), `\t` (for tab) and `\\`
    (to output backslash): Before hit return, have a guess as what this will output?


    ```

    3 $ echo -n $''a\bb\de\bf\b''

    ```


    If you guessed correctly, then well done! If you’re struggling to understand what
    happened, note that backspace does not delete the previous character, it just
    moves the cursor back a space. You can also send a specific byte to the terminal
    by specifying its hex value:


    ```

    4 $ echo -n $''x20\n''

    ```


    Think about that you can use `echo` with these flags to control exactly what gets
    sent to the screen. This is extremely valuable for debugging, or controlling gets
    sent to the terminal. It also bypasses the ‘catching’ of some characters you’ve
    seen from the previous section.


    ### CTRL-v Escaping


    Being able to output any binary value to the screen that we choose is useful,
    but what if we want to just output a ‘special’ character and bypass the terminal’s
    interpretation via terminal options or the `readline` library? For example, if
    I hit ‘tab’ in my terminal it would normally show a tab (or move my cursor along
    a few spaces), as the `readline` library uses the tab key (if hit twice in a row)
    to auto-complete any text we have not finished.


    But if I’m typing something like:


    ```

    5 $ echo ''I want a tab here:>Xa tab''

    ```


    How I get a ‘real’ tab where ‘X’ is? This is one way: instead of ‘X’, you type
    `\C-v` and then `\C-i`. If you type this in a terminal at the bash prompt, the
    cursor will tab across the screen in the way you might have expected.


    If you look at the output of `stty -e` again (as you did in the previous section)
    then you will that `^V` is bound to the `lnext` action. I believe (but can’t confirm)
    that this stands for ‘next character literal’.


    ```

    discard dsusp eol eol2 erase kill lnext

    ^O ^Y ^D <undef> <undef> ^? ^C ^U ^V

    min quit reprint status stop time werase

    1 ^

    ```

    There are multiple characters represented in this way. You’ve just seen tab (technically
    a ‘vertical tab’) represented as `^I`, and backspace represented as `^H`. You
    may recognise these and others in this table:


    | Name | Hex | C-escape | CTRL-key | Description |

    | --- | --- | --- | --- | --- |

    | BEL | 0x07 | \a | ^G | Terminal |

    | | | | | bell |

    | BS | 0x08 | \b | ^H | Backspace |

    | HT | 0x09 | \t | ^I | Horizontal |

    | | | | | TAB |

    | LF | 0x0A | \n | ^J | Linefeed |

    | VT | 0x0B | \v | ^K | Vertical TAB |

    | FF | 0x0C | \f | ^L | Formfeed |

    | CR | 0x0D | \r | ^M | Carriage |

    | | | | | return |

    | ESC | 0x1B | N/A | ^[ | Escape |

    | | | | | character |


    How would you input this, therefore, and what will it output?


    ```

    6 $ echo abcc^Hdefg

    ```


    ## Carriage Returns vs Line Feeds


    The most commonly-seen non-printable character is the carriage return.


    Carriage returns and line feeds cause much confusion, but it doesn’t take long
    to understand the difference and (more importantly) why they are different.


    If you think about an old-fashioned typewrite or printer that moves along punching
    out characters to a page, at some point it has to be told: ‘go back to the beginning
    of the line’. Then, once at the beginning of the line, it has to be told: ‘feed
    the paper up one line so I can start my new line’.

