    ### Job Control


    In bash, you don’t have to wait for the command to complete to start the next
    one. You can use job control to run processes in the background and manage them.


    In this section you’ll learn about:


    * What job control is

    * How to run multiple processes at once in your shell

    * How to manage those jobs


    #### How Important is this Section?


    Job control is a core feature of bash, and considered a central concept to understand
    if you are using bash every day.


    #### Starting Jobs


    You’re going to look at running a simple job using the `sleep` command.


    Type this in:


    ```

    1 $ sleep 60 &

    ```


    You typed a ‘normal’ command (`sleep 60`) and then added in another character,
    the ampersand (`&`). The ampersand will run the command ‘in the background’, which
    becomes a ‘job’ in this bash session.


    The job has two identifiers, which are immediately reported to you in the terminal.


    ```

    [1] 39165

    ```

