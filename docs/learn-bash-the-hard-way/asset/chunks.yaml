    #### Dotfiles


    Dotfiles are like normal files, except their name begins with a dot. Create some
    with `touch` and `mkdir`:


    ```

    13 $ touch .adotfile

    14 $ mkdir .adotfolder

    15 $ touch .adotfolder/file1 .adotfolder/.adotfile

    ```


    You’ve now created some dotfiles. If you run `ls`:


    ```

    16 $ ls

    ```


    those files don’t show up. So these files are hidden from us in normal view. What
    if we try to use a `*` as a glob?


    ```

    17 $ ls *

    ```


    Same result. Those files are hidden. While this may seem (and sometimes is) annoying,
    having files that don’t match even a `*` glob is very useful. Frequently you want
    to have a file that sits alongside other files but that is generally ignored.
    For example, you might write some code that reformats a set of text files in a
    folder, but you don’t want to reformat a dotfile that contains information about
    what’s in those text files.


    Unfortunately, it can be annoying when you really do want to see *all* the files
    in a folder. To achieve this, type:


    ```

    18 $ echo .*

    ```


    This tells bash that you want to see all filenames in the current folder that
    begin with a `.` character. `ls .*` will give you a different output, but we will
    get to that in a moment.


    You’ll also get a couple of extra ‘special’ files shown that you may not have
    been aware of before. These are the single dot folder: `.`, and the double dot
    folder: `..`


    The single dot folder (`.`) is a special file that represents the folder that
    you are in. For example, if you type:


    ```

