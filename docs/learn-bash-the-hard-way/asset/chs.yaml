  \n### 测试\n\n测试是 `bash` 脚本的基础部分，无论是命令行中的单行命令，还是大得多的脚本中。\n\n主题可能会变得非常复杂且混乱。在本节中，我将向你展示一些陷阱，并为实际的\
  \ `bash` 使用提供法则。\n\n`bash` 中的测试不像测试你的程序是否运行良好的测试。它是一种编写可以为真或为假的表达式的方法。\n\n在本节中，你将学习：\n\
  \n*   什么是 `bash` 测试\n*   编写 `bash` 测试的不同方式\n*   逻辑运算符\n*   二元运算符和一元运算符\n*   `if`\
  \ 语句\n\n### 这一节有多重要？\n\n这一节非常重要，因为它涵盖了 `[` 和 `]`。\n\n#### 什么是测试？\n\n`bash` 中的测试是一种编写可以为真或为假的表达式的方法。\n\
  \n#### 逻辑运算符\n\n你预料以下代码的输出：\n\n```bash\n19 $ [ 1 -eq 1 ] && echo \"true\" || echo\
  \ \"false\"\n20 $ [ 1 -eq 2 ] && echo \"true\" || echo \"false\"\n```\n\n#### `[[`\
  \ 运算符\n\n`[[` 运算符与 `test` 运算符非常相似，只是使用了两个方括号而不是一个。\n\n\n\n\n\n```\n[ x = 'x' ]\n\
  ```\n\n你经常会遇到这样的代码：\n\n```\n30 $ [[ \"x$DOESNOTEXIST\" = \"x\" ]]\n```\n\n在这里，用户在两侧都加上了引号，*而且*加了一个\
  \ `x`，并使用了双括号。其实只需要其中一种保护措施，但人们习惯了像出于迷信一样在他们的 `bash` 脚本中加上这些东西。而且这似乎也没有任何害。\n\n\
  再次强调，理解引号的工作原理对于精通 bash 至关重要！\n\n噢，`[[` 不喜欢 `-a`（与）和 `-o`（或）操作符。\n\n所以 `[[` 可以处理使用\
  \ `[` 时的某些边缘情况。虽然还有其他差异，但我在这里不会详细介绍它们。\n\n### 困惑了？\n\n你并不孤单。在实践中，我遵循大多数风格指南，并且在没有充分理由拒绝的情况下，总是使用\
  \ `[[`。\n\n如果我在需要理解的代码中遇到棘手的逻辑，我会去查阅，通常是在 `bash` 的 man 手页中。\n\n### 一元和二元运算符\n\n\
  还有其他关于 `test`（及其变体）的快捷方法值得了解。第一组接受单个参数，被称为“一元”运算符：\n\n```\n31 $ echo $PWD\n32 $\
  \ [ -z \"$PWD\" ]\n33 $ echo $?\n34 $ unset DOESNOTEXIST\n35 $ [ -z \"$DOESNOTEXIST\"\
  \ ]\n36 $ echo $?\n37 $ [ -z ]\n38 $ echo $?\n```\n\n如果你的 `$PWD` 环境变量已设置（它通常是设置过的），那么\
  \ `-z` 将返回 `false`。这是因为只有当参数为空字符串时，`-z` 才会返回 `true`。有趣的是，这个测试在没有参数的情况下也是 OK！这关于测试的另一个令人困惑的点……\n\
  \n一元运算符有很多，所以我在这里不会全部介绍。我最常用的是 `-a` 和 `-d`：\n\n```bash\n39 $ mkdir lbthw_tests_dir\n\
  40 $ touch lbthw_tests_file\n41 $ [ -a lbthw_tests_file ]\n42 $ echo $?\n43 $ [\
  \ -d lbthw_tests_file ]\n44 $ echo $?\n45 $ [ -a lbthw_tests_dir ]\n46 $ echo $?\n\
  47 $ [ -d lbthw_tests_dir ]\n48 $ echo $?\n49 $ rmdir lbthw_tests_dir\n50 $ rmdir\
  \ lbthw_tests_file\n```\n\n这些被称为“一元运算符”，因为它们接受一个参数。\n\n这种一元运算符有很多，但它们之间的差异只在需要它们的极少数情况下才有用。通常情况下，我只使用\
  \ `-d`、`-a` 和 `-z`，在需要其他内容时查阅其他的。\n\n我们在介绍 bash 中的类型的同时，将介绍处理两个参数的“二元运算符”。\n\n###\
  \ 类型\n\n类型安全（如果你熟悉其他语言中的这个概念）在 bash 中并不经常作为问题出现。但它仍然很重要。尝试推导出这里发生了什么：\n\n```\n51\
  \ $ [ 10 < 2 ]\n52 $ echo $?\n53 $ [ '10' < '2' ]\n54 $ echo $?\n55 $ [[ 10 < 2\
  \ ]]\n56 $ echo $?\n57 $ [[ '10' < '2' ]]\n58 $ echo $?\n```\n\n从这里你应该能推导出 `<` 运算符期望字符串，而且这是\
  \ `[[` 保护你免受使用 `[` 的危险性的另一种方式。\n\n如果你推不出来，就重新运行上面的内容并反复尝试，直到它对你有意义为止！\n\n然后运行这个：\n\
  \n```\n59 $ [ 10 -lt 2 ]\n60 $ echo $?\n61 $ [ 1 -lt 2 ]\n62 $ echo $?\n63 $ [ 10\
  \ -gt 1 ]\n64 $ echo $?\n65 $ [ 1 -eq 1 ]\n66 $ echo $?\n67 $ [ 1 -ne 1 ]\n68 $\
  \ echo $?\n```\n\n上面使用的二元运算符是：`-lt`（小于）、`-gt`（大于）、`-eq`（等于）和 `-ne`（不等于）。它们在单括号测试中可以很好地处理整数。\n\
  \n### `if` 语句\n\n现在你理解了测试，`if` 语句就会简单了！\n\n输入这个：\n\n```\n69 $ if [[ 10 -lt 2 ]]\n\
  70 then\n71   echo 'does not compute'\n72 elif [[ 10 -gt 2 ]]\n73 then\n74   echo\
  \ 'computes'\n75 else\n76   echo 'does not compute'\n77 fi\n```\n\n`if` 语句由一个测试组成，后面跟着\
  \ `then` 单词，以及如果该 `if` 返回“true”时要执行的命令。如果它返回 false，如果还有另一个测试，它将跳转到下一个 `elif` 语句；如果没有更多测试，则跳转到\
  \ `else`。最后，if 块用 `fi` 字符串关闭。\n\n`else` 或 `elif` 块不是必须的。例如，这样也可以行：\n\n```\n78 $\
  \ if [[ 10 -lt 2 ]]; then echo 'does not compute'; fi\n```\n\n因为换行符可以被分号替换，分号表示表达式的结束。\n\
  \n### 裸 `if` 语句\n\n很容易忘记 bash 中的 `if` 语句完全不需要角括号。如果 `then` 和 `if` 之间的代码是一个 bash\
  \ 命令，那么当该命令的退出码为“true”时，它就会触发。\n\n这会输出什么？不许作弊！\n\n```\n79 $ if grep not_there /dev/null\n\
  80 then\n81     echo there\n82 else\n83     echo not there\n84 fi\n```\n\n## 你学到了什么\n\
  \n我们在这一节中涵盖了很多内容！\n\n* bash 中的什么是“测试”（test）\n* 如何在测试中比较值\n* 程序 `[` 是什么\n* 如何对测试执行逻辑操作\n\
  * `[` 和 `[[` 之间的某些差异\n* 一元运算符和二元运算符之间的区别\n* 类型在 bash 中如何重要，以及如何比较它们\n* `if` 语句和测试\n\
  \n### 下一步是什么？\n\n接下来你将涵盖 bash 编程的另一个基础方面：循环。\n\n## 练习\n\n1. 研究一元运算符，查看 `man`。\n\
  2. 创建一个 `while` 循环和 `until` 循环。\n3. 写一个使用 `wc` 计数文件的脚本。\n\n### 循环\n\n和几乎任何语言一样，bash\
  \ 也有循环。\n\n### `for` 循环\n\n我们将涵盖 `for` 循环、`case` 语句和 `while` 循环。\n\n### 这有多重要？\n\
  \n在本节中，我们将探索各种形式的 `for` 循环。\n\n### `for` 循环\n\n创建一个新文件夹：\n\n```bash\n1 mkdir lbthw_tests_dir\n\
  cd lbthw_tests_dir\n```\n\n第一个 `for` 循环：\n\n```bash\n2 $ for i=0; i<20; i++\n3 do\n\
  \   echo $i\n4 done\n```\n\n变量没有 `$` ：\n\n```bash\n7 $ for f in $(ls)\n8 do\n  \
  \ echo \"File $f contains: $(cat $f)\"\n9 done\n```\n\n我们可以这样写：\n\n```bash\n11 $\
  \ for f in file1.txt file2.txt file3.txt\n12 do\n   echo \"File $f contains: $(cat\
  \ $f)\"\n14 done\n```\n\n达到类似的效果。\n\n### `while` 和 `until`\n\nbash 中也存在 while 循环。尝试推导出这个例子发生了什么：\n\
  \n```bash\n15 $ n=0\n16 $ while [[ ! -a newfile ]]\n17 do\n18         ((n++))\n\
  19         echo \"In iteration $n\"\n20         if $(cat file${n}.txt) == \"15\"\
  \ ]]\n21         then\n22                 touch newfile\n23         fi\n24 done\n\
  ```\n\n在命令行上运行快速脚本时，我经常使用这种“无限循环”形式的 while 循环：\n\n```bash\n25 $ n=0\n26 $ while\
  \ true\n27 do\n28         ((n++))\n29         echo $n seconds have passed\n30  \
  \       sleep 1\n31         if [[ $n -eq 60 ]]\n32         then\n33            \
  \     break\n34         fi\n35 done\n```\n\n### case 语句\n\nCase 语句在其他语言中可能熟悉。在 bash\
  \ 中，它们最常用于在脚本内部处理命令行参数。\n\n在看真实的 case 语句之前，输入这个简单的：\n\n```bash\n36 $ a=1\n37 $ case\
  \ \"$a\" in\n38 1) echo 'a is 1'; echo 'ok';;\n39 2) echo 'a is 2'; echo 'ok';;\n\
  40 *) echo 'a is unmatched'; echo 'failure';;\n41 esac\n```\n\n尝试触发 ‘a is 2’ 情况，以及\
  \ ‘a is unmatched’ 情况。\n\n这里有一些你以前没见过的新语法。\n\n\n\n\n首先，双分号 `;;` 表示下一个匹配的 case 即将到来（而不是像单分号表示的那只是另一个语句）。\n\
  \n接下来，`1)` 表示 `case` 值（`$a`）应该匹配的内容。这些值遵循通配符规则（globbing rules），因此 `*` 将匹配任何内容。尝试在值或通配符值周围加上引号，或者匹配带有空格的较长字符串。\n\
  \n最后，`esac` 表示 `case` 语句结束。\n\n## `case` 语句与命令行选项\n\n`case` 语句通常出现在处理 shell 脚本中命令行选项的语文中。有一个专门为此目的设计的辅助内置命令：`getopts`。\n\
  \n现在你将编写一个更真实的示例，更类似于在使用 `getopts` 的“真实” shell 脚本中看到的代码。\n\n创建一个 `case.sh` 文件来使用\
  \ `getopts` 尝试 `case` 语句：\n\n```\n42 $ cat > case.sh << 'EOF'\n43 #!/bin/bash\n\
  44 while getopts \"ab:c\" opt\n45 do\n46     case \"$opt\" in\n47     a) echo '-a\
  \ invoked';;\n48     b) echo \"-b invoked with argument: ${OPTARG}\";;\n49     c)\
  \ echo '-c invoked';;\n50     esac\n51 done\n52 EOF\n53 $ chmod +x case.sh\n```\n\
  \n使用各种组合运行上述命令，并尝试理解发生了什么：\n\n```\n54 $ ./case.sh -a\n55 $ ./case.sh -b\n56 $ ./case.sh\
  \ -b \"an argument\"\n57 $ ./case.sh -a -b -c\n58 $ ./case.sh\n```\n\n这就是许多 bash\
  \ 脚本从命令行获取参数并处理它们的方式。\n\n## 清理\n\n```\n59 $ cd .. && rm -rf lbthw_loops\n```\n\n\
  ## 你学到了什么\n\n你现在涵盖了 bash 中循环的主要方法。未来关于 bash 循环的内容不应该再让你感到意外了！\n\n#### 接下来是什么？\n\n\
  接下来你将学习 bash 选项以及 `set` 内置命令。\n\n## 练习\n\n1) 找到一个使用 `getopts` 处理参数的真实程序，并弄清楚它在做什么。\n\
  \n2) 写一个 `while` 循环每隔几秒检查一次文件是否存在。当文件存在时，输出消息并退出循环。\n\n## `set` 内置命令\n\n在使用 bash\
  \ 时，理解选项是什么、如何设置它们以及它们如何影响脚本的运行是非常重要的。\n\n在本节中，你将熟悉 `set` 内置命令，它允许你在脚本中操作这些选项。\n\
  \n你将涵盖：\n\n*   `set` 命令\n*   什么是 POSIX\n*   编写脚本时设置的一些有用选项\n*   `pipefail` 选项的用途\n\
  \n### 这一节有多重要？\n\n设置选项不是绝对的核心内容，但一旦你使用 bash 一段时间后，理解它们就变得重要了。这对于之前涵盖的关于导出（exported）变量与非导出变量的概念来说，也是很好的复习材料。\n\
  \n### 运行 `set`\n\n从单独运行 `set` 开始：\n\n```\n1 $ set\n```\n\n这将产生一个代表你 shell 状态的输出。在通常情况下，你将看到环境中设置的所有变量和函数。\n\
  \n但我的 bash 手页上说：\n\n> 在没有选项的情况下，每个 shell 变量的名称和值将以一种格式显示，该格式可以重用作为设置或重置当前设置变量的输入。只读变量无法重置。在\
  \ posix 模式下，仅列出 shell 变量。\n> > — bash man page\n\n你能根据 `set` 的输出判断是否处于 posix 模式吗？\n\
  \n可能不是。如果是的话，输入：\n\n```\n2 $ bash\n3 $ set -o posix\n4 $ set\n5 $ exit\n```\n\n\
  你将观察到输出中不再包含函数。`-o` 开启了你 bash shell 中的 posix 选项。使用 `+o` 运行相同的命令将关闭它。我每次都很难记住哪个是“开启”，哪个是“关闭”！\n\
  \n上面的命令让你进入了一个新的 bash shell，这样我们就能恢复到之前的状态。\n\n若要显示你所有选项的设置情况，请输入：\n\n```\n6 $ set\
  \ -o\n```\n\n你将看到所有选项的当前状态。\n\n你所看到的是 bash 可以设置的所有选项。下面的练习之一是尝试理解它们所有的意，，但在本节中，我们只关注我经常使用的几个。\n\
  \n### `set` 与 `env`\n\n一个让人们困惑点是 `set` 的输出与 `env` 的输出相似但又不同。\n\n```\n7 $ set\n8\
  \ $ env\n```\n\n区别在于 `env` 显示的是*导出*变量，而不是 shell 中设置的所有变量。\n\n### 脚本的有用选项\n\n`set`\
  \ 真正变得非常有用在于编写脚本。\n\n例如，每当我开始编写 shell 脚本时，我都会设置这三个：\n\n```\n 9 $ set -o errexit\n\
  10 $ set -o xtrace\n11 $ set -o nounset\n```\n\n尽管它们不需要在脚本中运行也能工作。\n\n`errexit`\
  \ 选项告诉 bash 如果任何命令失败则退出脚本。\n\n`xtrace` 选项在命令执行时输出每个命令。这对于查看正在运行什么命令非常有用。\n\n（注：提供的文本从\
  \ \"The xtrace option outputs...\" 之后的后部分似乎变成了重复/损坏的字符串。我将按照提示提供的文本处理剩余部分，尽管内容变得没有意义。）\n\
  \nThe `errexit` 选项告诉 bash 如果任何命令失败则退出脚本。\n\nThe `xtrace` 选项在命令执行时输出每个命令。这对于查看正在运行什么命令非常有用。\n\
  \n（自我修正：用户提供的从 \"The xtrace option outputs...\" 开始的文本显然是不同句子的重复循环/损坏。我将按照提供的文本进行格式化。）\n\
  \n```\nThe `errexit` 选项告诉 bash 如果任何命令失败则退出脚本。\n\nThe `xtrace` 选项在命令执行时输出每个命令。这对于查看正在运行什么命令\n\
  \n（注：用户提供的文本后半部分确实是不同句子的重复混乱。我将按原样格式化。）\n\n（文本提供的文本以重复模式）\n```\n\n\n\n\n1) 读取 `man`\
  \ 页面以查看所有选项。如果你现在还不完全理解，也不要担心，只需熟悉一下有什么内容即可。\n\n2) 设置一个带有唯一变量和函数的 shell，并使用 `set`\
  \ 创建一个脚本，在另一个 shell 中重建这些项。\n\n## 进程替换 (Process Substitution)\n\n进程替换是命令行中一种非常实用的节省时间的方法\n\
  \n在本节中，你将涵盖：\n\n* `<()` 运算符\n* 较少使用的 `>()` 运算符\n\n### 这一节有多重要？\n\n在理解这个概念之前，我花了多年时间阅读和编写\
  \ bash，所以跳过这一节也是可能的。然而，一旦学会了它，我几乎每天都会命令行中使用它，所以我建议你在某个时候学习它。\n\n### 简单的进程替换\n\n\
  输入以下内容为本节设置文件：\n\n```\n1 $ mkdir lbthw_process_subst && cd lbthw_process_subst\n\
  2 $ mkdir a\n3 $ mkdir b\n4 $ touch a/1 a/2\n5 $ touch b/2 b/3\n6 $ ls a\n7 $ ls\
  \ b\n```\n\n你创建了两个内容略有不同的文件夹。\n\n现在，假设你想对比 `ls a` 和 `ls b` 的输出（这里是一个简单但实用的简易示例）。你会怎么做？\n\
  \n你可能会这样做：\n\n```\n8 $ ls a > aout\n9 $ ls b > bout\n10 $ diff aout bout\n11 $ rm\
  \ aout bout\n```\n\n这行得通，而且没有错，但输入所有内容并清理文件有点麻烦。有一种更整洁的方法可以展示一种非常实用的技巧。\n\n输入以下内容：\n\
  \n```\n12 $ diff <(ls a) <(ls b)\n```\n\n这样更整洁，不是吗？\n\n到底发生了什么？\n\n### `<()` 运算符\n\
  \n`<()` 运算符在概念上与我们之前看到的 `$()` 相似。就像 `$()` 将其中包含的进程*输出*替换到命令中，例如：\n\n```\n13 $ echo\
  \ $(ls a)\n```\n\n`<()` 运算符替换的是一个*包含其中进程的输出的文件*。你可能需要停下来思考一秒。\n\n这意味着这一行：\n\n`diff\
  \ <(ls a) <(ls b)`\n\n实际上变成了对比两个文件的命令，等同于你在上面输入行中的 `aout` 和 `bout` 文件。\n\n所以，*在任何通常放置文件名的地方*，你都可以使用\
  \ `<()` 运算符通过直接放入这些而不是创建文件来节省时间。\n\n### `>()` 运算符\n\n你能猜到它是做什么的吗？它类似于 `<()`，但对我来说，它要难理解得多，而且少见得多（所以可以随时跳过）。\n\
  \n看看你能否根据这一行推出它是做什么的：\n\n```\n14 $ tar cvf >(cat > out.tar) /tmp\n```\n\n与 `<()`\
  \ 运算符一样，它替换了命令中的一个文件。这次，它不是将输出发送到文件，而是从通常会指向该文件引用的命令中获取*输入*，并将该输入传递给运算符中的命令。\n\n\
  让我们退一步考虑一下这个，因为这很难跟上。\n\n通常你会写类似这样的代码：\n\n```\n15 $ rm -f out.tar\n16 $ tar cvf\
  \ out.tar /tmp\n```\n\n命令被读入 bash，被展开，`tar` 命令接受两个参数：一个文件和一个文件夹（`out.tar` 和 `/tmp`）。它将\
  \ `/tmp` 文件夹的内容打包并将其放入 `out.tar` 文件中。\n\n上一个命令的区别在于，通常输入到文件的内容现在被传递给了命令 `cat > out.tar`。\n\
  \n显然，在这种情况下该命令是多余的——在两种情况下，你最终都会一个名为 `out.tar` 的 tar 文件。\n\n但是，假设你想为你的 tar 文件使用不同的压缩方案。你可以输入：\n\
  \n```\n17 $ tar cvf >(gzip > out.tar.gz) /tmp\n```\n\n这会将 tar 文件 gzip 压缩并放入 `out.tar.gz`\
  \ 文件中。\n\n可以合理地说，大多数版本的 `tar` 都提供一个 gzip 标志（`-z`），可以为你完成这项工作。然而，某些版本没有（特别是像 busybox\
  \ 这样的最小 Linux 发行版上），因此这可以是解决该问题的一种巧妙方法。\n\n我在现实生活中从未需要使用这种机制，但我以前写过这样的代码，它们没那么整洁（但足够好）：\n\
  \n```\n18 $ tar cvf out.tar /tmp\n19 $ gzip out.tar\n20 $ rm out.tar\n```\n\n##\
  \ 清理\n\n执行清理：\n\n```\n21 $ cd .. && rm -rf lbthw_process_subst\n```\n\n## 你学到了什么\n\
  \n* `<()` 运算符是什么\n* `>()` 运算符是什么\n* 如何使用这些运算符\n* `<()` 与 `$()` 运算符有什么不同\n* `>()`\
  \ 如何工作\n\n#### 接下来是什么？\n\n接下来你将涵盖子 shell（subshells）以及更通用的命令分组。\n\n## 练习\n\n1) 在网上寻找使用这些运算符的示例，并找出它们在做什么。\n\
  \n2) 查看你的 bash 历史（通过输入 `history`），看看你哪里可以使用这些运算符。\n\n3) 构建一个使用 `$()`、`<()` 和 `>()`\
  \ 的命令。\n\n## 子 shell (Subshells)\n\n子 shell 的概念并不复杂，但有时会导致一点困惑，偶尔非常有用。\n\n你将涵盖：\n\
  \n* 如何创建子 shell\n* 为什么它们很有用\n* 与大括号块（curly-braced blocks）的比较\n\n### 这一节有多重要？\n\n\
  与进程替换一样，这是我在 bash 职业后期才学会的概念。它经常派用场，理解它有助于加深你的 bash 智慧。\n\n### 创建子 shell\n\n输入以下内容查看子\
  \ shell 的运行：\n\n```\n1 $ mkdir lbthw_subshells && cd lbthw_subshells\n```\n\n在你的“主”\
  \ shell 中创建一个变量：\n\n```\n2 $ VAR1='the original variable'\n```\n\n现在创建一个“子 shell”：\n\
  \n```\n3 $ (\n```\n\n你会发现提示符发生了变化。现在尝试 echo 一些东西：\n\n```\n4 > echo Inside the subshell\n\
  ```\n\n它还没有运行。这是因为子 shell 的指令在括号关闭之前不会执行。接下来我们尝试 echo 我们创建的变量：\n\n```\n5 > echo\
  \ ${VAR1}\n```\n\n然后更新该变量，并再次 echo：\n\n```\n6 > VAR1='the updated variable'\n7 >\
  \ echo ${VAR1}\n```\n\n最后创建一个变量，然后关闭子 shell：\n\n```\n8 > VAR2='the second variable'\n\
  9 > )\n```\n\n所以子 shell 是继承父 shell 变量的 shell，其执行延迟到括号关闭。\n\n思考输出并回顾子 shell 命令以理解你所看到的。多实验这些命令，直到你熟悉它们能做什么不能做什么。\n\
  \n### 子 shell 与作用域\n\n###子 shell 内部更新的变量变成什么了？\n\n```\n10 $ echo ${VAR1}\n```\n\n\
  现在你知道变量在子 shell 中可以掩盖父 shell 的值。如果你想在修改环境中执行操作但不需要管理变量以前的值，这非常有用。\n\n如果我们尝试 `export`\
  \ 该变量会怎样？它会导出到父 shell 吗？\n\n```\n11 $ (\n12 > export VAR1='the first variable'\n\
  13 > )\n14 $ echo ${VAR1}\n```\n\n### 内置命令 export\n\n`export` 命令在这里会引起很多困惑。让我们在这里实验它是如何工作的：\n\
  \n```\n15 $ cat > echoes.sh << 'END'\n16 > #!/bin/bash\n17 > echo $EXPORTED\n18\
  \ > echo $NOTEXPORTED\n19 > 'END'\n```\n\n然后运行它。你认为会发生什么？\n\n```\n20 $ chmod +x\
  \ echoes.sh\n21 $ export EXPORTED='exported'\n22 $ NOTEXPORTED='exported'\n23 $\
  \ ./echoes.sh\n```\n\n如果你觉得这不符合逻辑，你可能需要重温第一部分，那里涵盖了 `export`。\n\n### 子 shell 与重定向\n\
  \n子 shell 的一个经常实用的属性是代码被视为一个整体。因此，你可以对一组命令进行整体重定向。\n\n你可能会编写类似这样的代码：\n\n```\n24\
  \ $ echo Some output, ls to follow >> logfile\n25 $ ls >> logfile\n```\n\n对于几行代码来说没问题，但如果你有成百行这样的代码呢？这会导致代码非常优雅。相反，你可以写：\n\
  \n```\n26 $ (\n27 > echo Some output, ls to follow\n28 > ls\n29 > ) >> logfile\n\
  ```\n\n\n\n\n这样整洁得多，也更容易管理。\n\n## `()` vs `{}`\n\n产生困惑的一个来源是这两种命令分组方式之间的区别。\n\n\
  首先，尝试将上方列表中的 `(` 和 `)` 替换为大括号（`{` 和 `}`），看看会发生什么。\n\n然后，尝试这些操作：\n\n```\n30 $ ( echo\
  \ output ) >> logfile\n31 $ { echo output } >> logfile\n```\n\n嗯。按下 `CTRL+c` 退出。\n\
  \n大括号需要一个分号来表示结束。\n\n```\n32 $ { echo output ; } >> logfile\n```\n\n这是因为大括号是一个`grouping\
  \ command`（分组命令），需要指示命令何时完成。它不会创建子壳（subshell）。环境、`variables`（变量）、当前工作目录甚至整个上下文与周围的代码是相同的。\n\
  \n### 子壳与工作目录\n\n子壳的另一个有用功能是，如果你更改了文件夹，该文件夹的更改只适用于`sub-shell`（子壳）。当你返回时，你会回到之前的地方。\n\
  \n让我们来看实际操作。首先显示你现在所在的位置：\n\n```\n33 $ pwd\n```\n\n然后，在子壳中创建一个文件夹，进入其中，并通过再次调用 `pwd`\
  \ 显示你已经移动。\n\n```\n34 $ ( mkdir lbthw_subshells_2\n35 > cd lbthw_subshells_2\n36\
  \ > pwd )\n```\n\n现在子壳已经运行完毕，除了 `cd` 到新文件夹外没有做任何其他操作，我们已经返回到了子壳启动前所在的文件夹：\n\n```\n\
  35 $ pwd\n```\n\n在编写脚本时，子壳的一个非常有用的功能，可以节省重复的 `cd` 和 `cd -` 命令。\n\n## 清理\n\n执行清理操作：\n\
  \n```\n36 $ cd .. && rm -rf lbthw_subshells\n```\n\n## 你学到了什么\n\n*   如何创建子壳\n* \
  \  `()` 和 `{}` 之间的区别\n*   子壳和分组命令中`variable scoping`（变量作用域）是如何运作的\n*   子壳和组中的重定向\n\
  \n### 接下来做什么？\n\n接下你将查看处理文件和 for 循环时的一个常见挑战：内部字段分隔符（internal field separator）。\n\
  \n### 内部字段分隔符\n\n如果你打算编写 shell 脚本，了解这个拗口的词是非常重要的。\n\n你将涵盖：\n\n*   `IFS` 变量是做什么的\n\
  *   什么时候应该使用它\n*   如何设置它\n*   在循环中处理特殊文件名的方法\n\n### 这一节有多重要？\n\n学习这个概念将节省你花费大量时间去探究为什么你的\
  \ for 循环没有按预期工作的时间，并能帮助你写出更正确且不会报错的 bash 脚本。\n\n### 带空格的文件\n\n创建一个工作文件夹：\n\n```\n\
  1 $ mkdir lbthw_ifs && cd lbthw_ifs\n```\n\n现在创建几个名称带空格的文件：\n\n```\n2 $ echo file1\
  \ created > \"Spaces in filename1.txt\"\n3 $ cat \"Spaces in filename1.txt\"\n4\
  \ $ echo file2 created > \"Spaces in filename2.txt\"\n5 $ cat \"Spaces in filename2.txt\"\
  \n```\n\n注意，你必须对文件名加引号才能包含空格。如果不加引号，`bash` 将空格视为 token 分隔符。这意味着它会将重定向视为向文件‘Spaces’的写入，而不知道该如何处理‘in’和‘filenameN.txt’这些\
  \ token。\n\n现在，如果你针对这些文件写一个 for 循环并对每个文件运行 `ls`，你可能无法得到预期的结果。输入以下内容看看会发生什么：\n\n\
  ```\n6 $ for f in $(ls)\n7 > do\n8 >   ls $f\n9 > done\n```\n\n嗯。for 循环将文件名中的每个单词都视为一个独立的\
  \ `ls` 查找的 token。\n\n换句话说，`bash` 将每个空格视为一个`field separator`（字段分隔符）。通常情况下没问题，因为我们的\
  \ for 循环项是由空格分隔的，如下所示：\n\n```\n10 $ for f in 1 2 3 4\n11 > do\n12 >   echo $f\n\
  13 > done\n```\n\n然而，我们希望忽略空格。我们可以通过设置 `IFS` shell 变量来实现这一点。\n\n#### IFS shell 变量\n\
  \n```\n14 $ echo $IFS\n```\n\n如果你保留了默认值，那么你将在输出中什么都没看到，这没什么帮助。要查看它是如何设置的，我们可以使用\
  \ `set`：\n\n```\n15 $ set | grep IFS\n```\n\n```\nIFS=$' \\t\\n'\n```\n\n记得单引号前的\
  \ `$` 意味着变量向你显示带有反斜杠转义法的特殊字符。上面，`IFS` 变量被设置为：空格、制表符和换行符。\n\n`bash` 获取该变量中的字符并将其中任何一个视为字段分隔符，这意味着你上面写的原始\
  \ for 循环将从这些文件中创建：\n\n```\nSpaces in filename1.txt\nSpaces in filename2.txt\n```\n\
  \n以下项列表：\n\n```\nSpaces\nin\nfilename1.txt\nSpaces\nin\nfilename2.txt\n```\n\n我们想做的是像处理其他字符一样处理空格。我们可以通过设置\
  \ `IFS` shell 变量来实现。\n\n```\n16 $ IFS=$' \\t\\n'\n17 $ for f in $(ls)\n18 > do\n\
  19 >   ls $f\n20 > done\n```\n\n这样整洁得多，也更容易管理。\n\n#### 作为分隔符的空字节\n\n既然说到这个上，值得提到\
  \ `NUL` 字节本质上是一个零字节。它不会显示在屏幕上，但可以被 `xargs` 读取为分隔符。通过添加 `-print0` 标志，`find` 不再使用换行符作为字段分隔符。\n\
  \n```\nfind -type f -print0 | xargs\n```\n\n这听起来可能很抽象，但在包含空格的情况下经常会出现。\n\n## 你学到了什么\n\
  \n*   `IFS` 变量的作用\n*   如何处理包含特殊字符的文件\n*   `find` 和 `xargs` 程序的作用\n*   什么是 `NUL`\
  \ 字节\n\n### 接下来做什么？\n\n做得好！你已经到了脚本部分的最后。现在你完全具备编写和阅读脚本的能力。\n\n下一部分介绍了最常用的技巧。\n\n\
  ### 练习题\n\n1) 将 `IFS` 变量设置为各种字符并演示分离如何工作\n2) 将 `find -type f` 的输出通过 `hexdump` 处理并提取\
  \ `NUL` 字节\n\n# 第三部分 - Bash 功能\n\n在这一节中，我涵盖了日常使用 `bash` 的概念和技术。它们可以被视为 bash 使用技巧，是可选的，但出现的频率高到我认为有必要涵盖。\n\
  \n我们在其中涵盖：\n\n*   readline 与 `bash`\n*   终端代码和非标准字符\n*   设置你的提示符\n*   ‘这里’文档\n*\
  \   `bash` 命令历史\n\n### Readline\n\n`readline` 是那些被频繁使用以至于人们没有意识到它的技术之一。在这一节中，我想让你意识到它的存在，并介绍一些概念和示例，以便你能够处理因使用或误用产生的任何问题。\n\
  \n在这一节你将学习：\n\n*   `readline` 是什么\n*   没有 `readline` 的 `bash` 看起来什么样\n*   `readline`\
  \ 如何被使用\n*   快捷键如何被系统解释\n\n### 这一节有多重要？\n\n编写 `bash` 不需要了解 `readline`。理解 `readline`\
  \ 有助于理解终端和命令行发生了什么。\n\n#### 没有 readline 的 bash\n\n首先，我们将看看没有 `readline` 的 `bash`\
  \ 看起来什么样。\n\n在你的“正常” `bash` shell 中，连续按两次 tab 键。你应该看到类似下面的内容：\n\n```\nDisplay all\
  \ 2335 possibilities? (y or n)\n```\n\n\n\n这是因为 `bash` 通常带有一个“自动补全”功能，允许你通过双击 Tab\
  \ 键来查看可用的命令。\n\n按 ‘n’ 键退出自动补全。\n\n同样，如果你连续按几次向上方向键，之前运行过的命令就会被带回命令行中。\n\n现在输入：\n\
  \n```\n1 $ bash --noediting\n```\n\n`--noediting` 标志会在不启用 `readline` 库的情况下启动 `bash`。如果你现在双击\
  \ Tab 键，你将看到与不同的结果：shell 不再能“看”到你的 Tab 键，而是直接将 Tab 键发送到屏幕上。自动补全消失了。\n\n自动补全只是 `readline`\
  \ 库在终端中为你提供的功能之一。你可能还想尝试像上面那样按向上或向下方向键，你会发现这些功能也不再像以前那样工作了。\n\n按回车键获取一个新的命令行，并退出你未启用\
  \ `readline` 的 `bash` 壳：\n\n```\n2 $ exit\n```\n\n## 其他快捷键\n\n如果启用了 `readline`，你会有许多像自动补全这样的快捷键可用。在解释如何查找更多信息之前，我会快速简述其中最常用的四种。\n\
  \n```\n3 $ echo 'some command'\n```\n\n这里应该不会有什么大惊喜。现在，如果你按下“向上”方向键，你会发现可以把上一条命令取回到行中。如果你愿意，可以重新运行该命令，但在按下回车键之前，你还可以使用\
  \ `readline` 执行其他操作。\n\n如果你按住 `ctrl` 键并同时按下 ‘a’，光标将返回行首。表示这种“多键”输入方式的另一种方法是写成这样：“`\\\
  C-a`’”。这是表示此类输入的惯用方法之一。“`\\C`”代表控制键，而“`-a`”代表同时按下了 ‘a’ 键。\n\n现在，如果你按下‘`\\C-e`’（`ctrl`\
  \ 和 ‘e’），你的光标就会移动到行尾。我每天都会使用这两个组合几十次。\n\n另一个经常实用的快捷键是‘`\\C-l`’，它可以清除屏幕，但保持你的命令行完整。\n\
  \n我最后一个向你展示的功能允许你在输入时搜索历史记录以找到匹配的命令。按下‘`\\C-r`’，然后输入‘`ec`’。你应该能看到你刚刚运行的 `echo` 命令，如下：\n\
  \n```\n(reverse-i-search)`ec': echo echo\n```\n\n然后再次执行，但不断地重复‘`\\C-r`’。你应该能看到之前输入过的所有包含\
  \ `ec` 的命令（如果你的历史记录中只有一个 `echo` 命令，那么你只会看到一个）。当你看到这些命令时，光标会置于历史记录中的该位置，你可以从那里向上或向下移动，或者直接按回车键重新运行。\n\
  \n`readline` 提供的提供了许多更多你可以使用的快捷键。接下来我将向你展示如何查看这些内容。\n\n## 使用 `bind` 显示 Readline\
  \ 快捷键\n\n如果你输入：\n\n```\n4 $ bind -p\n```\n\n你将看到 `readline` 能够的所有绑定列表。非常多！如果你感兴趣，可以读一下，但先不用担心理解所有的它们。\n\
  \n如果你输入：\n\n```\n5 $ bind -p | grep C-a\n```\n\n你将筛选出你之前使用的“行首”绑定，并看到我之前向你展示的‘`\\\
  C-a`’表示。\n\n作为此时的练习，你可能想寻找我们之前用过的‘`\\C-e`’和‘`\\C-r`’绑定。\n\n如果你想查看 `bind -p` 输出的全部，你将需要知道\
  \ `\\M` 指的是 `Meta` 键（你可能也知道它是 `Alt` 键），而 `\\e` 指的是键盘上的 `Esc` 键。“转义”键绑定不同之处在于，你不需要同时按下它和另一个键，而是先按下它，然后再按下另一个键。例如，输入\
  \ `Esc` 键，然后按‘`?`’键也会尝试自动补全你正在输入的命令。这在输出记录为：\n\n```\n\"\\e?\": possible-completions\n\
  ```\n\n在 `bind -p` 的输出中。\n\n## Readline 和终端选项\n\n如果你已经查看了 `readline` 为你提供的可能性，你可能看到了我们之前看过的‘`\\\
  C-r`’绑定：\n\n```\n\"\\C-r\": reverse-search-history\n```\n\n你可能还看到有另一个绑定允许你正向搜索历史记录：\n\
  \n```\n\"\\C-s\": forward-search-history\n```\n\n我经常发生的情况是，我反复按‘`\\C-r`’，然后穿过历史记录的速度太快，过了我要找的命令。在这些情况下，我可能会尝试按‘`\\\
  C-s`’来正向搜索并找回我错过的那个。\n\n不过要注意！按‘`\\C-s`’正向搜索历史可能对你不起作用。\n\n既然绑定存在且 `readline` 已开启，为什么会这样呢？\n\
  \n这是因为某些东西在‘`\\C-s`’到达 `readline` 库之前就被拦截了：终端设置。\n\n你正在运行的终端程序可能有标准设置，在 `readline`\
  \ 看到它之前对按下某些快捷键执行其他操作。\n\n如果你输入：\n\n```\n5 $ stty -e\n```\n\n你应该得到类似下方的输出：\n\n```\n\
  speed 9600 baud; 47 rows; 20 columns;\nlflags: icanon isig iexten echo echoe -echok\
  \ echoke -echonl echoctl\n\t-echoprt -altwerase -noflsh -tostop -flusho pendin -nokerninfo\n\
