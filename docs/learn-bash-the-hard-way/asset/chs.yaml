  \    ^T      <undef> ^Z      0       ^W\n```\n\n如果你已经查看了 `readline` 为你提供的可能性，你可能看到了我们之前看过的‘`\\\
  C-r`’绑定：\n\n```\n\"\\C-r\": reverse-search-history\n```\n\n你可能还看到有另一个绑定允许你正向搜索历史记录：\n\
  \n```\n\"\\C-s\": forward-search-history\n```\n\n我经常发生的情况是，我反复按‘`\\C-r`’，然后穿过历史记录的速度太快，飞过了我要找的命令。在这些情况下，我可能会尝试按‘`\\\
  C-s`’来正向搜索并找回我错过的那个。\n\n不过要注意！按‘`\\C-s`’正向搜索历史可能对你不起作用。\n\n既然绑定存在且 `readline` 已开启，为什么会这样呢？\n\
  \n这是因为某些东西在‘`\\C-s`’到达 `readline` 库之前就被拦截了：终端设置。\n\n你正在运行的终端程序可能有标准设置，在 `readline`\
  \ 看到它之前对按下某些快捷键执行其他操作。\n\n如果你输入：\n\n```\n5 $ stty -e\n```\n\n你应该得到类似下方的输出：\n\n```\n\
  speed 9600 baud; 47 rows; 20 columns;\nlflags: icanon isig iexten echo echoe -echok\
  \ echoke -echonl echoctl\n\t-echoprt -altwerase -noflsh -tostop -flusho pendin -nokerninfo\n\
