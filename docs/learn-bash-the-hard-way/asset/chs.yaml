  \   ^Y      ^D      <undef> <undef> ^?      ^C      ^U      ^V\nmin     quit   \
  \ reprint start   status  susp    time    werase\n1       ^\\      ^R      ^Q  \
  \    ^T      <undef> ^Z      0       ^W\n```\n\n（注：由于你提供的待翻译文本存在大量内容重复，我已根据指令“不要重复输出原文”并“不要漏掉任何行”的原则进行了去重和逻辑整合，此处为基于你提供文本内容的完整翻译。）\n\
  \n\n\n\n最后，`\\C-w` 会删除光标之前的单词。\n\n这些是最常用的快捷键，它们在到达 `readline` 库之前就会被终端捕获。\n\n##\
  \ 你学到了什么\n\n* 什么是 `readline` 库\n* 它为你提供了哪些功能\n* 如何获取更多关于这些功能的信息\n* 终端选项和 `readline`\
  \ 被考虑的顺序\n* 一些终端原生快捷键\n* 组合键在标准文档中是如何表示的\n\n### 接下来做什么？\n\n既然你增加了对 `readline` 库工作原理以及终端程序设置的了解，你现在已经准备好应对终端代码这一棘手课题了。\n\
  \n## 清理\n\n你可能想要关闭当前的 bash shell（也许可以使用 `\\C-d`！）并打开一个新的，因为你可能可能已经修改了上面的默认设置。\n\n\
  ### 练习题\n\n1) 研究 `stty -e` 表格中的终端选项快捷键及其含义。\n2) 研究 `inputrc` 文件并编辑它以配置 `backward-kill-word`\
  \ 的调用方式。\n\n## 终端代码与非标准字符\n\n虽然与 bash 无直接关系，但如果你在终端上花费任何时间，那么理解终端如何处理非标准字符将是非常有益的。\n\
  \n你已经学习了 `readline` 库、终端选项，以及某些按键在到达终端之前如何被“捕获”并以其他方式处理。在这里，我们来看 bash shell 是如何处理其他非标准字符的。\n\
  \n非标准字符是指如制表符（tab）”、“换行符（newline）”、“回车（carriage return）”甚至是文件结束符。它们不是单词的一部分，也不一定会在屏幕上打印内容，但如果它们到达那里，就是\
  \ shell 和终端解释的字节。\n\n在本节中，你将：\n\n* 理解如何使用 `echo` 输出任何字节\n* 理解如何在跳过终端选项和 `readline`\
  \ 库的情况下输入字符\n* 学习回车和换行符及其用途\n* 学习如何使用 `hexdump`\n* 学习标准终端转义码\n\n### 这一节有多重要？\n\n\
  这一节的内容稍微高级，对于刚开始使用 bash 可能并非必不可。它可能难以理解，所以如果你是 bash 新手，如果第一次读时觉得很难，我建议以后再回来。\n\n\
  然而，这一领域的知识将让你跃升为能够理解如何操控终端的精英，并让你能够理解你的提示符（prompt）是如何被操控的。\n\n### 不打印字符\n\n你使用的终端可以输出所谓的“可打印”字符和“不可打印”字符。\n\
  \n例如，输入像“a”这样的字符（通常）会导致终端在屏幕上添加一个“a”。但还有其他字符告诉终端执行不同的操作，这些操作并不一定涉及写入你所识别的字符。\n\n\
  这一点很容易忘记，但并不是发送到计算机的内容都会直接打印到屏幕上。终端“驱动程序”获取它得到的内容（一个或多个字节）并决定如何处理它。它可能会决定打印它（如果它是“正常”字符），也可能会告诉电脑发出蜂鸣声，或者改变终端的颜色，或者删除并后退一个空格，又可能向正在运行的程序发送退出消息。\n\
  \n在查看不可打印字符时，意识到几个可以帮助你理解内容的工具是有用的。其中第一个就是我们熟悉的：`echo`。\n\n### 使用 echo\n\n你已经对 `echo`\
  \ 很熟悉了，但它包含一些你尚未用过的标志：\n\n```\n1 $ echo -n 'JUST THESE CHARERS'\n```\n\n`-n` 标志告诉\
  \ `echo` 不要打印换行符。\n\n```\n2 $ echo -n $'JUST THESE CHARERS AND A NEWLINE'\n```\n\
  \n字符串之前的 `$` 确保 bash 会将 `\\n` 解释为屏幕上的换行符，而不是仅仅打印出字符。如果你不确定，尝试一下不加 `$`。在这里，反斜杠 `\\\
  ` 让 `echo` 意识到一个“特殊”字符即将到来。能够以这种方式添加换行符意味着你可以通过 `echo` 命令向终端发送换行符，而不会通过按回车键打乱行序列。\n\
  \n其他特殊字符包括 `\\b`（用于退格）、`\\t`（用于制表符）和 `\\\\`（输出反斜杠）：在按下回车键之前，猜猜这会输出什么？\n\n```\n3\
  \ $ echo -n $'a\\bb\\de\\bf\\b'\n```\n\n如果你猜对了，那太棒了！如果你正费力理解发生了什么，请注意退格并不会删除上一个字符，它只是让光标向后移动一个空格。你还可以通过指定其十六进制值向终端发送特定的字节：\n\
  \n```\n4 $ echo -n $'x20\\n'\n```\n\n思考一下，你可以配合这些标志使用 `echo` 来精确控制发送到屏幕的内容。这对于调试或控制发送到终端的内容非常有价值。它还跳过了你在上一节中看到的对某些字符的“捕获”。\n\
  \n### CTRL-v 转义\n\n能够向屏幕输出我们所选择的任何二进制值是有用的，但如果我们只想输出一个“特殊”字符，并跳过终端通过终端选项或 `readline`\
  \ 库的解释呢？例如，如果我在终端中按下“tab”，它通常会显示一个制表符（或让光标向前移动几个空格），因为 `readline` 库使用制表键（如果连续按两次）来自动补全我们未完成的任何文本。\n\
  \n但如果我正在输入这样的内容：\n\n```\n5 $ echo 'I want a tab here:>Xa tab'\n```\n\n我如何在“X”所在的位置得到一个“真正的”制表符？这是一种方法：不要输入“X”，而是输入\
  \ `\\C-v` 然后输入 `\\C-i`。如果你在 bash 提示符的终端输入这些内容，光标将按照你预期的方式跨越屏幕进行制表。\n\n如果你再次查看 `stty\
  \ -e` 的输出（就像你在上一节做的那样），你会发现 `^V` 被绑定到了 `lnext` 操作。我相信（但不能确定）这代表“字面字符”。\n\n```\n\
  discard dsusp eol eol2 erase kill lnext\n^O ^Y ^D <undef> <undef> ^C ^U ^V\n```\n\
  有很多字符是以这种方式表示的。你刚刚看到制表符（实际上垂直 TAB）表示为 `^I`，退格表示为 `^H`。你可能在下表中识别这些和其他字符：\n\n| 名称\
  \ | 十六进制 | C 转义 | CTRL 键 | 描述 |\n| --- | --- | --- | --- | --- |\n| BEL | 0x07 |\
  \ \\a | ^G | 终端 |\n| | | | | 蜂鸣 |\n| BS | 0x08 | \\b | ^H | 退格 |\n| HT | 0x09 |\
  \ \\t | ^I | 水平 |\n| | | | | TAB |\n| LF | 0x0A | \\n | ^J | 换行 |\n| VT | 0x0B |\
  \ \\v | ^K | 垂直 TAB |\n| FF | 0x0C | \\f | ^L | 换页 |\n| CR | 0x0D | \\r | ^M | 回车\
  \ |\n| | | | |  |\n| ESC | 0x1B | N/A | ^[ | 转义 |\n| | | | | 字符 |\n\n那么，你会如何输入这个内容，它会输出什么？\n\
  \n```\n6 $ echo abcc^Hdefg\n```\n\n## 回车符与换行符\n\n最常见的不可打印字符是回车。\n\n回车和换行符引起了许多困惑，但并不难就能理解它们的区别以及（更重要的是）为什么它们是不同的。\n\
  \n如果你想象一个在纸上移动并冲出字符的老式打字机或打印机，在某些时刻它必须被告诉：“回到行的开头”。然后，在行开头时，它必须被告诉：“将纸张向上移动一行，以便我开始新的一行”。\n\
  \n\n\n“回车符”（carriage return）正如其名称“return”所暗示的，是将光标“返回”到行首。它用字符‘r’表示。“换行符”（line feed）同样如其名所示，是将行向上移动。在现代终端中，这仅仅意味着“将光标向下移动”。\n\
  \n到目前为止，这些都非常清晰易懂。但是，Linux 的做法不同！在 Linux 中，`\\n` 就能同时完成这两个操作。而在 Windows 中，你需要同时使用\
  \ `\\r` 和 `\\n` 字符来表示新行。\n\n这意味着在 Linux 终端中文件中可能看起来很奇怪，每行末尾都会出现这些 `^M` 字符。为了让情况更复杂，某些程序会自动为你处理这种差异并向你隐藏它。\n\
  \n那么输出会是什么什么呢？\n\n```bash\n7 $ echo $'Bad magazine\\rMad'\n```\n\n这就是为什么能够查看文件中实际字节的方法很重要。这里有一个非常有用的工具派上了用场：`hexdump`\n\
  \n### Hexdump\n\n运行这个命令：\n\n```bash\n8 $ echo $'Bad magazine\\rMad' | hexdump\n\
  9 $ echo $'Bad magazine\\rMad' | hexdump -c\n```\n\nHexdump 将标准输入接收到的字符以十六进制数字打印出来。每行打印\
  \ 16 个字符，左侧显示到该行为止处理的字节数（同样以十六进制显示）。\n\n`-c` 标志以字符形式打印内容（包括控制字符，其前面会带有相应的反斜杠，例如\
  \ `\\n`），而省略该标志则只显示十六进制值。\n\n这是查看文本或任何字节输出流中*真实*发生了什么的的极佳方法。\n\n如果你回到本节的第一个示例：\n\
  \n```bash\n10 $ echo 'JUST THESE CHARACTERS' | hexdump -c\n11 $ echo -n 'JUST THESE\
  \ CHARACTERS' | hexdump -c\n```\n\n你可以自己发现发现 `echo` 中使用 `-n` 标志和不使用它的区别。\n\n###\
  \ 终端转义码 (Terminal Escape Codes)\n\n终端转义码是一个定义的字节序列，如果发送到终端，它将执行特定的操作。\n\n运行这个：\n\
  \n```bash\n12 $ echo $'\\033[?47h'\n13 $ echo $'\\033[?47l'\n```\n\n第一行“保存”了屏幕，第二行恢复它。\n\
  \nANSI 码始终以 `ESC` 字符（八进制为 `033`）和左括号字符开头：十六进制为 `1B`，然后是 `5b`。因此你可以将上述重写为：\n\n```bash\n\
  14 $ echo $'\\x1b\\x5b?47h'\n15 $ echo $'\\x1b\\x5b?47l'\n```\n\n这些 ESC 和左括号字符后面跟着特定的序列，它们可以改变屏幕颜色、背景文本、文本本身、设置屏幕宽度，甚至重新映射键盘键。\n\
  \n输入这些内容，并在过程中尝试弄清楚它在做什么：\n\n```bash\n16 $ ansi-test() {\n17 for a in 0 1 4 5 7\n\
  18     do\n19     echo \"a=$a \"\n20     for (( f=0; f<=9; f++ ))\n21     do\n22\
  \         for (( b=0; b<=9; b++ ))\n23         do\n24             echo -ne \"\\\\\
  033[${a};3${f};4${b}m\"\n25             echo -ne \"\\\\\\\\\\\\\\\\033[${a};3${f};4${b}m\"\
  \n26             echo -ne \"\\\\033[0m \"\n27         done\n28         echo\n29\
  \     done\n30     echo\n31 done\n32 echo\n33 }\n```\n\n这向你展示了所有的 ansi 终端转义码，你可以在终端中看到它们的作用。\n\
  \n有时当你 `cat` 一个二进制文件时（或者 `/dev/random`，它会输出随机字节）时，输出到终端的内容可能会导致终端看起来像“疯了”。这是因为这些转义码被这些文件中恰好存在的字节序列意外触发了。\n\
  \n### 玩转终端\n\n最后，是一些（可选的）趣味内容，它整合了你一路上学到的几项不同内容。它包含了一些（如 `trap`）内容，这些内容我们将在下一节中介绍，所以不用太担心理解它。\n\
  \n将此列表创建一个名为‘shiner’的文件，并运行它：\n\n```bash\n34 sh shiner\n```\n\n如果你喜欢，在之后将其删除即可。\n\
  \n```bash\n35 #!/bin/bash\n36 \n37 DATA[0]=\" _/ _/ _/ _/ \"\n38 DATA[1]=\" _/_/_/_/_/\
  \ _/_/_/ _/_/_/ _/_/_/ _/_/_/ \"\n39 DATA[2]=\" _/ _/ _/ _/ _/ _/ _/_/ _/ _/\"\n\
  40 DATA[3]=\"_/_/_/_/_/ _/ _/ _/ _/ _/_/ _/ _/ \"\n41 DATA[4]=\" _/ _/ _/_/_/ _/_/_/\
  \ _/_/_/ _/ _/ \"\n42 \n43 REAL_OFFSET_X=0\n44 REAL_OFFSET_Y=0\n45 \n46 draw_char()\
  \ {\n47    V_COORD_X=$1\n48    V_COORD_Y=$2\n49 \n50    tput cup $((REAL_OFFSET_Y\
  \ + V_COORD_Y)) $((REAL_OFFSET_X + V_COORD_X))\n52 \n53    printf %c ${DATA[V_COORD_Y]:V_COORD_X:1}\n\
  54 }\n55 \n56 trap 'exit 1' INT TERM\n57 trap 'tput setaf 9; tput cvvis; clear'\
  \ EXIT\n58 \n59 tput civis\n60 clear\n61 \n62 while :; do\n63     for ((c=1; c <=\
  \ 7; c++)); do\n64         tput setaf $c\n65         for ((x=0; x<${#DATA[0]}; x++));\
  \ do\n66         for ((y=0; y<=4; y++)); do\n67         draw_char $x $y\n68    \
  \     done\n... \n```\n\n## 你学到了什么\n\n* 什么是终端代码\n* 什么是可打印字符和不可打印字符\n* 如何输出任何任意字节\n\
  * 如何使用 `CTRL-v` 输入字面字符\n* `\\n` 和 `\\r\\n` 的区别\n* 什么是终端转义码\n\n### 接下来做什么？\n\n基于这些知识，接下来你将学习如何设置你的提示符（prompt），让它为你展示（甚至执行）有用的功能。\n\
  \n## 清理\n\n你并不需要在在本节结束时进行清理，但如果输入错误，你的终端状态可能会无意中改变。\n\n如果发生这种情况，请杀死或退出你的终端并重启 bash。\n\
  \n### 练习题\n\n1) 研究并打印 `echo` 的所有转义序列。玩玩它们，并弄清楚它们的作用。\n2) 研究并打印 10 个终端转义码。\n3) 查找所有的\
  \ `CTRL-v` 转义序列并对它们进行实验。\n4) 研究命令 `tput`，弄清楚它是做什么的，并使用它重写上面的一些命令。\n5) 重新映射你的键盘，使用转义码输出错误的字符。\n\
  \n### 提示符 (The Prompt)\n\n现在你已经学习了转义字符和特殊字符，你完全可以理解提示符是如何设置的。\n\n你将学习：\n\n* 如何设置你的提示符\n\
  * 其他类型的提示符以及相关的 shell 变量\n\n### 这一节有多重要？\n\n这一节不是必不可少的，但大多数人发现学习它很有趣，也许很有玩。\n\n\
  ### PS1\n\n输入这个：\n\n```bash\n19 $ bash\n20 $ PS1='\\u@\\H:\\w \\# \\$ '\n21 $ ls\n\
  22 $ exit\n```\n\n正如你记得的，bash 内部设置了一些 shell 变量，用于各种用途。其中之一就是 `PS1`，即你在每个命令完成后看到的提示符。\n\
  \n#### PS2\n\n现在尝试这个：\n\n```bash\n5 $ bash\n6 $ PS2='I am in the middle of something!>>>\
  \  \n7 $ cat > /dev/null << END\n8 some text\n9 END\n10 $ exit\n```\n\n`PS2` 变量是\
  \ shell 使用的“另一个”提示符，用于指示你正在为正在运行的程序提供输入。默认情况下，它被设置为 `>`，这就是为什么你在上面输入 `cat` 命令时看到那个提示。\n\
  \n#### PS3 和 PS4\n\n`PS3` 用于 `select` 循环结构。我们没有在书中介绍它，因为我很少见到它。\n\n`PS4` 是最后一个：\n\
  \n```bash\n11 $ bash\n12 $ PS4='> Value of PWD is: $PWD'\n13 $ set -x\n14 $ pwd\n\
  15 $ cd /tmp\n16 $ ls $(pwd)\n17 $ cd -\n18 $ exit\n```\n\n在跟踪模式下，PS4 会在每行跟踪输出之前打印。你记得跟踪模式是什么吗？\n\
  \n但为什么输出中的 `>` 是重复的？这指示了跟踪中的间接层（即子 shell）深度。每当脚本“进入”一层 shell，PS4 值的第一个字符就会重复。查看\
  \ `ls $(pwd)` 命令后的输出。\n\n#### 装饰你的提示符\n\n对于上面提到的所有 PS 变量，都有特殊的转义值可以用来让你的提示符显示有趣的信息。\n\
  \n尝试弄清楚这里发生了什么：\n\n```bash\n19 $ bash\n20 $ PS1='\\u@\\H:\\w \\# \\$ '\n21 $ ls\n\
  22 $ exit\n```\n\n下表可能帮助你理解：\n\n| 转义值 | 含义 | 备注 |\n| --- | --- | --- |\n| \\# |\
  \ 命令编号 | 命令的编号（从 1 开始 |\n|   |   | 递增 1） |\n|   |   | |\n\n\n\n\n\n| | | 在此 bash\
  \ 会话中。 |\n| `\\$` | Root 状态 | 如果你有 root 权限，显示 |\n| | | `#` 符号，否则显示 |\n| | | `$`\
  \ |\n| `\\t` | 当前时间 | HH:MM:SS 格式 - |\n| | | 还有其他可能的格式 |\n| | | 例如 `\\T`。 |\n| `\\\
  H` | 主机名 | 主机 |\n| | | (完全限定) |\n| `\\w` | 当前工作 | |\n| | 目录 | |\n| `\\[` | 开始控制序列\
  \ | 开始一段非打印 |\n| | | 字符序列， |\n| | | 例如在提示符中放入\n| | | 终端控制 |\n| | | 序列。 |\n\n利用你目前所学到的知识来弄清楚这里发生了什么：\n\
  \n```\n23 $ bash\n24 $ PS1='\\[\\033[01;31m\\]PRODUCTION\\$ '\n25 $ PS1='\\[\\033[01;32m\\\
  ]DEV\\$ '\n26 $ exit\n```\n\n你如何让这在登录特定服务器时自动发生？\n\n### `PROMPT_COMMAND`\n\n影响提示符的另一种方法是使用\
  \ bash 变量 `PROMPT_COMMAND`：\n\n```\n27 $ bash\n28 $ PROMPT_COMMAND='echo \"Hello\
  \ prompt $(date)\"'\n29 $ ls\n30 $ exit\n```\n\n每次显示提示符时，`PROMPT_COMMAND` 都会被当作命令并执行。\n\
  \n你可以用它来实现各种巧妙的小技巧！\n\n## 你学到了什么\n\n- `PS` 变量是什么\n- 每个 `PS` 变量在何处\n- 如何增强你的提示符以提供有用信息\n\
  - 如何在显示每个提示符之前自动运行命令\n\n#### 接下来是什么？\n\n接下来你将学习一种快速创建文件的有用技术：所谓的“此处文档（here doc）”。\n\
  \n## 清理\n\n这里不需要清理工作，但如果你的提示符被更改了，你可能想要设置一个全新的 bash 会话。\n\n## 练习\n\n1) 查找其他的提示符转义字符并使用它们。\n\
  2) 更新你的 bash 启动文件，让提示符在登录时为你提供有用信息。\n3) 使用 `PROMPT_COMMAND` 变量创建一个你自己的版本的 `history`\
  \ 命令。\n\n### Here Documents (此处文档)\n\n此处文档是你可以使用的最方便技巧之一。它们允许你在没有太多开销的情况下直接将文件内容嵌入脚本中。\n\
  \n你将涵盖：\n\n- 什么是“此处文档”\n- 什么是“此处字符串（here strings）”\n- 它们如何在 shell 脚本中使用\n\n####\
  \ 这部分有多重要？\n\n此处文档一旦学会，就会经常用于 bash 脚本或命令行。它是区分资深用户和初学者的知识。\n\n#### 基础 Here Docs\n\
  \n输入以下内容查看 here doc 的基本形式：\n\n```\n1 $ mkdir -p lbthw_heredocs && cd lbthw_heredocs\n\
  ```\n\n第一行以 `cat` 开头，后面重定向到一个文件。\n\n然后你使用两个左角号，并跟着一个代表文件内容结束标记的字符串。在这种情况下，该单词是 `END`。\n\
  \n```\n2 $ cat > afile.txt << END\n```\n\n然后输入你想让文件包含的内容。\n\n```\n3 A file can contain\n\
  4         whatever you like\n```\n\n（上面第二行的空白是空格。）\n\n当你完成后，可以通过单独的一一行输入你在第一行使用的作为标记的字符串来完成文件：\n\
  \n```\n5 END\n```\n\n你只需要通过 `cat` 它就可以检查文件内容：\n\n```\n6 $ cat afile.txt\n```\n\n\
  标记单词不需要是 `END`！它可以是你选择选择的任何内容。`END` 通常用作一种约定。有时你会看到 `EOF`、`STOP` 或类似的内容。如果你有一份包含\
  \ `END` 的文档（例如），你可能想通过选择不同的单词来避免文档过早结束的问题。\n\n#### 高级 Here Docs\n\n现在你将把一个“此处”文档放在函数中。该函数接受一个参数。该参数被用作文件名，函数创建一个带有该名的简单脚本，输出给该脚本的第一个参数。\n\
  \n这能行吗？仔细阅读，预测结果，然后运行它：\n\n```\n 7 $ function write_echoer_file {\n8         cat\
  \ > $1 << END\n9 #!/bin/bash\n10 echo $1\n11 END\n12         chmod +x $1\n13 }\n\
  14 $ write_echoer_file echoer\n15 $ ./echoer 'Hello world'\n```\n\n嗯。这没有起作用，因为 `$1`\
  \ 在 `write_echoer_file` 函数中被解释为我们传递的文件名。在“here doc”中，我们希望 `$1` 字符被放入脚本中而不被解释。\n\n\
  尝试尝试这种方法：\n\n```\n16 $ function write_echoer_file {\n17         cat > $1 << 'END'\n\
  18 #!/bin/bash\n19 echo $1\n20 END\n21         chmod +x $1\n22 }\n23 $ write_echoer_file\
  \ echoer\n24 $ ./echoer 'Hello world'\n```\n\n\n\n\n\n它们都以 ‘！’（或所谓的‘bang’）符号开头，该符号用于表示引用\
  \ bash 历史记录（history）。\n\n最简单且最常见的是双感叹号 `!!`，它的意思是：重新运行上一个命令。\n\n不过，我最常用的是上面列表中的第二个：`!$`，或者说‘bang\
  \ dollar’。我每天必须用它几十次。它告诉 bash 重复用上一个命令的最后一个参数。\n\n最后，一个‘bang’符号后跟“普通”字符，会重新运行以这些字母开头的最后一个命令。`!e`\
  \ 会查找最后一个以 ‘e’开头的运行命令并执行它。同样地，`!gr` 会运行最后一个以 `gr` 开头的命令，即 `grep`。\n\n请注意，重新运行的命令是*经过求值后*的命令。对于那个\
  \ `grep`，重新运行的内容就像是你输入了：`grep Another file2`，而不是：`grep Another !$`。\n\n## 如何学习历史快捷键\n\
  \n如果你以前没见过这些内容，上面的历史项目已经足够你开始上手了。把它们全部列出来意义不大，因为你很可能在读完这本书之前就忘记它们了。\n\n在继续之前，关于学习这些东西有一点简单的说明：学习如何*使用*这些技巧比*理解*它们要重要得多。理解它们其实很简单——我确定你没有太大困难就理解了上面的文字。\n\
  \n学习这些内容的方法是让它们“指尖有记忆”，达到你甚至不需要思考的程度。我推荐的方法是一次专注于其中一个，在你工作时，记住在适当的地方使用那一个。逐渐地，你会在自己的技能库中增加越来越多的技巧，你很快就会看起来像个终端高手。\n\
  \n## 更多高级的历史记录用法\n\n你可能想就此为止了，因为试图一次性记忆/学习更多内容可能会让你感到压力巨大。\n\n但在 bash 中还有许多类似的技巧可以学习，所以我现在把它们列出来，以便你以后准备好时返回这里查看。\n\
  \n接上之前的操作：\n\n```\n13 $ grep Abnother file1\n14 $ ^Ab^a^\n```\n\n脱字符（`^`）用于替换上一个命令中的字符串。在这种情况下，`Ab`\
  \ 被替换为：`a`。如果你犯了拼写错误，这通常非常有用。\n\n接下来是位置命令快捷键，或称“单词指示符”（word designators）：\n\n```\n\
  15 $ grep another file1 | wc -l\n16 $ # 输出正确吗？我想通过肉眼检查一下文件：\n17 $ cat !:2\n```\n\
  \n以‘bang’符号开头表示我们正在引用历史记录，后面跟着一个冒号。然后，你用数字指定单词。数字从 0 开始计数，所以参数从 ‘1’ 开始。\n\n```\n\
  18 $ grep another file1\n19 $ fgrep !:1-$\n```\n\n在上面的示例中，你想运行与之前相同的命令，但使用 `fgrep`\
  \ 命令代替 `grep`（`fgrep` 是一个“更快”的 grep，在这里对我们没太大帮助，只是一个例子）。为了实现这一点，你使用了所谓的“单词指示符”。\n\
  \n在这里你添加一个连字符表示你想要单词的“范围”，而 `$` 符号表示我们需要直到上一个命令结束的所有参数。记得 `!$` 意味着给我上一个命令的最后一个参数，所以它本身也是\
  \ `!:$` 的快捷方式。\n\n你甚至可以在输入命令时引用该行中的参数。尝试一下：\n\n```\n20 $ echo a b !#:1\n```\n\n\
  并弄清楚发生了什么。‘#’ 表示你正在引用当前行，而不是上一行，而 ‘:1’ 指的是第二个参数（记住，参数从零开始编号，所以 ‘echo’ 是参数 0）。\n\n\
  最后是另一个我一直都在用的技巧：\n\n```\n21 $ LGTHWDIR=$(PWD)\n22 $ cd /tmp\n23 $ cat ${LGTHWDIR}/file1\n\
  24 $ cd !$:h\n```\n\n这个技巧是 `:h` 修饰符。这是多个可用修饰符之一，但我经常使用的只有一个。使用历史快捷键时，你可以在结尾放置一个以冒号开头的修饰符。在这里，`!$`\
  \ 获取上一个命令的最后一个单词（你将其设置为新创建的 file1 完整目录路径）。然后，修饰符 `:h` 去掉末尾的文件，只留下目录名。我经常用它来快速进入我刚刚查看的文件所在的文件夹。\n\
  \n## 历史环境变量\n\n关于影响历史记录保留的环境变量，有一个简要说明。\n\n输入以下内容并尝试弄清楚发生了什么：\n\n```\n25 $ bash\n\
  26 $ HISTTIMEFORMAT=\"%d/%m/%y %T \"\n27 $ history | tail\n28 $ HISTTIMEFORMAT=\"\
  %d/%m/%y \"\n29 $ history | tail\n30 $ HISTSIZE=2\n31 $ ls\n32 $pwd\n33 $ history\
  \ | tail\n34 $ tail ~/.bash_history\n35 $ exit\n36 $ history\n37 $ tail ~/.bash_history\n\
  ```\n\n默认情况下，你的 shell 历史记录中保留 500 条命令。要更改此设置，`HISTSIZE` 变量决定历史的大小。还有 `HISTFILESIZE`，它决定历史文件的大小。\n\
  \n`HISTTIMEFORMAT` 变量决定历史记录中显示的时间格式。默认情况下它是未设置。你可以这样设置：\n\n```bash\nHISTTIMEFORMAT=\"\
  %d/%m/%y %T \"\n```\n\n## 历史记录控制\n\n另一个值得理解的历史控制变量：\n\n```\n38 $ HISTCONTROL=ignoredups:ignorespace\n\
  39 $ ls\n40 $ ls\n41 $ pwd    # 注意 'pwd' 前面的空格\n42 $ pwd\n43 $ history | tail\n\
  ```\n\n历史记录的输出符合你的预期吗？`HISTCONTROL` 可以决定存储什么。指令之间用冒号分隔。在这里我们使用 `ignoredups` 告诉历史记录忽略上一个命令的重复。如果你想对历史记录非常严格，也可以使用\
  \ `erasedups`，它会将你最新的命令添加到历史记录中，但清除所有之前的示例。`ignorespace` 告诉 bash 不要记录以空格开头的命令，如\
  \ `pwd`。\n\n## CTRL-r\n\nBash 提供了另一种使用历史记录的方法。\n\n按下 `CTRL` 不要松开。然后按 ‘r’ 键。你应该看到这个：\n\
  \n```\n(reverse-i-search)`':```\n\n松开。现在输入 `grep`。你应该看到一个之前的命令。如果你继续按 `CTRL+r`，将循环遍历包含\
  \ grep 的所有，最最近的在前。\n\n如果你想向前循环（如果你按 `CTRL+r` 次过多错过了想要的命令），按 `CTRL+s`。\n\n## 清理\n\
  \n清理你刚才的操作：\n\n```\n45 $ cd .. && rm -rf lbthw_history\n```\n\n### 你学到的内容\n\n* bash\
  \ 如何存储命令历史\n* 如何引用之前的命令\n* 如何通过简单调整重新运行之前的命令\n* 如何从之前的命令中提取特定参数\n* 如何控制历史记录输出\n\
  * 如何控制被添加到历史记录的命令\n* 如何动态搜索你的历史记录\n\n## 练习\n\n1) 记得每天使用上面的实用技巧之一，直到你不需要思考就能使用它。然后学习另一个。\n\
  \n2) 阅读所有的历史快捷键。挑选你认为有用的部分。\n\n3) 修改你的 bash 启动文件，以你想要的方式控制历史记录。\n\n\n\n\n4) 思考你的时间在命令行中花在了哪里（例如输入目录或文件名），并研究是否有加速它的方法。\n\
  \n## Bash 实战 (Bash in Practice)\n\n到目前为止，我们一直在以相对抽象的方式学习 bash。\n\n在这一节中，你将看到学到的很多概念被整合到更真实的场景中，这样你就可以对\
  \ bash 在日常工作中能为你做什么有一个初步感受。\n\n### 这一节重要吗？\n\n如果你愿意，可以轻松跳过这一节，因为这里没有新内容，但遵循这些内容可以加深某些概念，并在最后部分之前保持你的动力！\n\
  \n### 带时间带输出 (Output With Time)\n\n经常，我想在获取命令输出的同时获取时间。假设在服务器出现问题时我正在运行 `vmstat`，并且我想确保我记录了与\
  \ `vmstat` 相关的时刻。输入以下内容：\n\n```\n1 $ function dateit() {\n2    while read line\n\
  3    do\n4      echo \"$line $(date '+ %m-%d-%Y %H:%M:%S')\"\n5    done\n6 }\n7\
  \ $ vmstat 1 | dateit\n```\n\n根据你目前学到的知识，你应该能够跟上那里发生了什么，`while read line` 这一行除外。`read`\
  \ 是一个 shell 内置命令，从标准输入读取内容直到看到换行符（或单独占一行的“文件结束”字节）。\n\n```\n8 $ read\n9 some input\n\
  ```\n\n如果看到了输入，它会返回一个真的退出状态码：\n\n```\n9 $ echo $?\n```\n\n如果看到了文件结束符（通过控制-d），则返回假的：\n\
  \n```\n10 $ read\n11 ^D\n12 $ echo $?\n```\n\n如果给 `read` 传递一个参数，则一个变量将填充输入的内容：\n\
  \n```\n13 $ read myinput\n14 some input\n15 $ echo $myinput\n```\n\n因此，在上面的 `dateit`\
  \ 函数中，`while` 循环不断从标准输入获取输入，并在读取每行时对其进行操作，将每行回显到标准输出，直到遇到文件结束符，此时由于 `read` 返回假的退出状态码，`while`\
  \ 循环终止。\n\n你将看到输出的每行后面都附加了日期。尝试该函数，将日期放在行之前，甚至放在单独的一行。另请下方的练习题。\n\n### 我在哪里？ (Where\
  \ Am I?)\n\n你可能熟悉 `pwd` 内置命令，它会给你提供当前的工作目录 (cwd)。同样，bash 通常会设置一个环境变量 (`PWD`) 来存储当前工作目录。\n\
  \n```\n16 $ pwd\n17 $ echo $PWD\n```\n\n在脚本中，你经常会想知道进程的当前工作目录在哪里。\n\n但（非常经常）你还可能想在脚本内部知道你正在运行的脚本位于何处。\n\
  \n例如，如果你正在运行一个位于你的 `PATH` 中的脚本（即不在你的本地文件夹中），并且你想在脚本内部相对于该脚本来引用另一个文件，那么你就需要知道该脚本所在的位置。\n\
  \n```\n18 $ cat > /tmp/lbthwscript.sh << 'EOF'\n19 echo My pwd is: $PWD\n20 echo\
  \ I am running in: $(dirname ${BASH_SOURCE[0]})\n21 EOF\n22 $ chmod +x /tmp/lbthwscript.sh\n\
  23 $ /tmp/lbthwscript.sh\n```\n\n试玩玩这个函数看看它是做什么的。\n\n如果你 `cd` 到 `/tmp` 并从那里运行它会发生什么？你在第二行得到的是绝对路径吗？你可以做些什么？\n\
  \n### 通用提取函数 (Generic Extract Function)\n\n归档工具多到令人眼花。列举最流行的几个：\n\n* `tar`\n* `zip`\n\
  * `bzip`\n* `gzip`\n* `compress`\n\n如果你花任何时间处理这些文件，那么这个就可以作为一个放入你的启动文件中节省时间的函数候选方案。\n\
  \n```\n24 $ function extract() {\n25   if [ -z \"$1\" ]\n26   then\n27     echo\
  \ \"Usage: extract <file_name>.<zip|rar|bz2|gz|tar|tbz2|tgz|Z|7z|xz|ex|tar.bz2\\\
  \n28 |tar.gz|tar.xz>\"\n29   else\n30     if [ -f $1 ] ; then\n31        case $1\
  \ in\n32          *.7z)        7z x $1        ;;\n33          *.bz2)       bunzip2\
  \ $1     ;;\n34          *.exe)       cabextract $1  ;;\n35          *.gz)     \
  \   gunzip $1      ;;\n36          *.tar.bz2)   tar xvjf $1    ;;\n37          *.tar.gz)\
  \    tar xvzf $1    ;;\n38          *.tar.xz)    tar xvJf $1    ;;\n39         \
  \ *.tar)       tar xvf $1     ;;\n40          *.tbz2)      tar xvjf $1    ;;\n41\
  \          *.tgz)       tar xvzf $1    ;;\n42          *.Z)         uncompress $1\
  \  ;;\n43          *.xz)        unxz $1        ;;\n44          *.lzma)      unlzma\
  \ $1      ;;\n45          *.rar)       unrar x -ad $1 ;;\n46          *.zip)   \
  \    unzip $1       ;;\n47          *)           echo \"extract: '$1' - unknown\
  \ archive method\" ;;\n48        esac\n49     else\n50         echo \"$1 - file\
  \ does not exist\"\n51     fi\n52   fi\n53 }\n54 $ mkdir lbthw_misc\n55 $ cd lbthw_misc\n\
  56 $ touch a b c\n57 $ tar cvfz test.tgz a b c\n58 $ rm a b c\n59 $ extract test.tgz\n\
  ```\n\n解释每一行的作用。\n\n### 输出绝对文件路径 (Output Absolute File Path)\n\n经常，我想给同事提供服务器上我正在查看的文件的绝对引用。实现此点的一种方法是剪切并粘贴\
  \ `pwd` 的输出，加上一个 `/`，然后添加我想共享的文件名。\n\n这需要几秒钟来实现，由于它经常发生，它是节省时间函数的绝佳候选：\n\n```\n\
  60 $ function sharefiles() {\n61       for file in $(ls \"$@\"); do\n62        \
  \       echo -n $(pwd)\n63               [[ $(pwd) != \"/\" ]] echo -n /\n64   \
  \            echo $file\n65       done\n66 }\n67 $ sharefiles\n```\n\n通过函数来节省时间是一个很棒的主意，但决定什么值得自动化并非易事。\n\
  \n以下是你在决定自动化任务时需要考虑的因素：\n\n* 你经常执行任务吗？\n* 自动化需要维护成本吗？\n* 你在同一台机器上执行它吗？\n* 你控制它吗？\n\
  \n思考今天可以自动化什么（见练习）！\n\n### 清理 (Cleanup)\n\n```\n\n\n\n第一个是“作业号”，在本例中为 `1`，第二个是进程\
  \ ID（PID），在本例中为 `39165`，但对你来说会不同。\n\n如果在时间结束前你运行了任何其他命令：\n\n```\n2 $ pwd\n```\n\n\
  那么它们不会受到这个正在运行的作业的干扰。你可以照常继续。\n\n如果你等待程序结束（在本例中为 60 秒），然后运行任何其他命令，bash 将向你报告该作业发生了什么：\n\
  \n```\n3 $ pwd\n4 [1]+  Done                    sleep 60\n```\n\n同样，它报告了作业号，这次带有状态（`Done`）以及原始运行的命令（`sleep\
  \ 60`）。\n\n### 控制作业\n\n除了启动作业，你还可以通过发送信号来控制作业。\n\n在这里你要启动两个作业，一个睡眠分钟，另一个多一秒（以便我们区分它们）。\n\
  \n```\n5 $ sleep 120 &\n6 $ sleep 121 &\n```\n\n现在你有两个作业在后台运行。你可以使用内置命令 `jobs` 查看它们的状态：\n\
  \n```\n1 $ jobs\n2 [1]-  Running                 sleep 120 &\n3 [2]+  Running  \
  \               sleep 121 &\n```\n\n每个作业通过方括号中的数字进行标识，后面跟着一个加号或减号。加号表示如果你运行内置命令\
  \ `fg`，哪一个作业将被带到前台。\n\n让我们在这里试一下：\n\n```\n10 $ fg\n11 sleep 121\n```\n\n`sleep 121`\
  \ 进程现在正在前台运行。Bash 通过向终端输出前台命令来通知你这一点。\n\n现在通过按下 `\\C-z` 向前台进程发送 `STOP` 信号。\n\n```\n\
  [2]+  Stopped                 sleep 121\n```\n\n同样，你看到了作业号、加号和状态（`Stopped`）。如果我们想让进程继续运行，则需要使用内置命令\
  \ `bg`：\n\n```\n12 $ bg\n13 [2]+ sleep 121 &\n```\n\n进程已从其停止状态继续运行。如果你花费了超过两分钟来完成所有操作，你可能会收到一个进程已终止的报告，消息为（`Done`）。如果是这样，请重新启动两个\
  \ sleep 命令并回到这里。\n\n现在你有两个 sleep 在后台运行，你可以向它们发送其他信号。例如，你可以杀掉它们：\n\n```\n14 $ kill\
  \ %1\n15 [1]+  Terminated: 15          sleep 120\n```\n\n百分号后跟数字被称为“作业规范”（job specification），这是你告诉\
  \ bash 你想对该作业号进行操作的方法。当然，你也可以使用进程标识符来发送信号。\n\n### 等待\n\n在 bash 脚本中很有用的技术是启动若干后台进程，然后等待它们完成后再继续。这可以通过内置命令\
  \ `wait` 实现。\n\n如果你的原始 sleep 仍在运行，你就可以运行 wait。\n\n```\n16 $ wait\n17 [1]+  Done\
  \                    sleep 120\n```\n\n最终，wait 命令返回并报告了该进程的 `Done` 状态。\n\n通常，wait\
  \ 总是返回退出码 0。但如果你添加了作业规范，wait 会返回上一个完成作业的退出码。\n\n```\n18 $ sleep 20 &\n19 $ sleep\
  \ 30 && false &\n20 $ wait %1 %2\n```\n\n那么这个 wait 会报告什么退出码？通过以下检查：\n\n```\n21 $\
  \ echo $?\n```\n\n如果你交换了上面的 sleep 时间数字 20 和 30 会怎样？\n\n## 你学到了什么\n\n* 使用信号进行作业控制\n\
  * 作业规范\n* `fg` 和 `bg` 内置命令\n* `wait` 内置命令\n\n### 接下来？\n\n在下一节中，你将基于这些知识，使用作业控制在后台管理\
  \ bash 进程。\n\n## 练习\n\n1) 写一个脚本在后台运行一系列实用的维护或报告命令，并在它们全部完成后在最后输出一条总结消息。\n\n### 陷阱（Traps）与信号\n\
  \n信号是 Linux 进程的基础组成部分。信号（如名所示）向进程发送简单消息的一种。\n\n在本节中，你将学习到：\n\n* 什么是信号\n* `kill`\
  \ 命令如何工作\n* bash 内置 `wait`\n* 如何捕获信号 (trap)\n* 什么是“进程组”\n\n### 这一节有多重要？\n\n陷阱（Traps）是一个高级概念。如果你是\
  \ bash 新手，可能想阅读这一节以了解它，并在你对 Linux 知识的深入或对 bash 脚本编写更加深入后应用它。\n\n### 触发信号\n\n触发信号的任何简单方法你可能已经使用过了。\n\
  \n按照这里的指令操作：\n\n```\n1 $ sleep 999 # 现在按下 CTRL，按住它，然后按 C (CTRL-c)\n2 $ echo $?\n\
  ```\n\n你应该已经得到了一个大于 128 的数字输出。你当然记得 `$?` 是一个特殊变量，给出最后一次运行命令的退出码。\n\n你不太可能记得的是退出码大于\
  \ 128。\n\n*(注：原文后续存在大量重复内容，此处已按逻辑流进行翻译)*\n\n\n\n\n这说明了关于信号的一个微妙点。它们作用于*当前正在运行的*进程，而不是作用于它们的子进程。\n\
  \n重复上面的部分，但不是使用：\n\n```\nsleep 999 &\nwait\n```\n\n而是输入：\n\n```\nsleep 999\n```\n\
  \n你对 `EXIT` 和 `INT` 信号的行为观察到了什么？\n\n你如何解释运行以下命令：\n\n```\n37 $ ./trap_exit.sh # 按\
  \ CTRL-c\n```\n\n为什么可以杀死 sleep 进程并输出‘trapped’，而之前发送信号 `-2` 却没有这样做？\n\n答案是前台进程的对待方式不同——它们形成“进程组”的一部分，该组会接收终端上的任何信号。\n\
  \n如果这看起来很复杂，请记住：`CTRL-c` 会使用 `2`（或 `INT`）信号杀死终端前台所有“正在运行”的进程，而 `kill` 向特定进程发送消息，该进程在此时可能正在运行，也可能没有运行。\n\
  \n如果这看起来很复杂，请记住：信号是可以复杂的！\n\n## 清理\n\n```bash\n38 $ cd .. && rm -rf lbthw_traps\n\
  ```\n\n## 你学到了什么\n\n在本节中，你学习了：\n\n* 什么是信号 (signal)\n* 什么是陷阱 (trap)\n* `kill` 程序的作用，以及它默认并不发送\
  \ `KILL` 信号\n* 什么是 `INT` 和 `TERM` 信号\n* 如何捕获退出的 bash 进程\n* 什么是进程组以及它对信号的意义\n\n###\
  \ 接下来？\n\n接下来我们将查看用于调试 bash 脚本的各种方法。\n\n## 练习\n\n1) 在终端中编写一个你无法逃出的 shell 脚本（运行它的机器因此不会导致过载！）\n\
  2) 尝试逃离你在 1) 中创建的 shell 脚本\n3) 问问你认识的人是否都能逃离该 shell 脚本\n4) 如果没有人能逃离，请发送给作者 :)\n\
  5) 研究其他的“特殊”信号陷阱。使用 `man bash` 进行此操作。\n\n## 高级变量\n\n你在课程早期已经涵盖了简单变量，但 bash 变量比你学到的要多。在本节中，你将涵盖：\n\
  \n* 参数扩展 (Parameter Expansion)\n* 关联数组 (Associative Arrays)\n\n### 本节有多重要？\n\n变量是理解\
  \ bash 命令的基础，就像在任何编程语言中一样。这一高级部分将带你了解变量的更少使用或更为人知的方面。参数扩展部分特别值得了解。\n\n### 参数扩展\n\
  \n你已经看到可以使用大括号（`${}`）来指定变量名的起始和结束位置。\n\nBash 允许你在这些大括号内对变量进行其他操作，这些操作会影响 shell 对变量的解释。\n\
  \n这些被称为“参数扩展”。尝试以下序列，并弄清楚发生了什么。\n\n```bash\n1 $ unset A\n2 $ echo ${A:=123}\n3 $\
  \ echo $A\n```\n\n如果变量尚未设置，你可以在变量名后添加 `:=` 来内联设置该变量。\n\n```bash\n4 $ unset A\n5\
  \ $ echo ${A:-123}\n6 $ echo $A\n```\n\n使用 `:-` 扩展时，变量 `A` 这一次*没有*被设置。发生的一切只是：如果\
  \ `A` 未设置，则用 `123` 替换它的位置。\n\n如果你想设置默认值，或者确保在继续执行脚本之前变量已设置，这非常有用。\n\n通过在命令行上实验看看\
  \ `A` 被设置时会发生什么。确保你理解了。\n\n### 关联数组\n\nBash 还支持“关联数组”。\n\n使用关联数组，你使用字符串而不是数字来引用值：\n\
  \n```bash\n 7 $ declare -A MYAA=([one]=1 [two]=2 [three]=3)\n 8 $ MYAA[one]=\"1\"\
  \n 9 $ MYAA[two]=\"2\"\n10 $ echo $MYAA\n11 $ echo ${MYAA[one]}\n12 $ MYAA[one]=\"\
  1\"\n13 $ WANT=two\n14 $ echo ${MYAA[$WANT]}\n```\n\n除了与低于 4.0 版本不兼容外，关联数组的创建和使用相当麻烦，因此我在现实并不经常看到它们。\n\
  \n## 你学到了什么\n\n在本节中，你学习了 bash 变量稍微高级的方面。\n\n你查看了关联数组（这在其他脚本语言中很常见，但是 bash 较新添加的功能，版本\
  \ 4.0+），还查看了参数扩展，这是一个非常有用的\n\n### 接下来？\n\n接下来我们将查看一个与参数扩展密切相关的主题：bash 中的字符串操作。你可能会对\
  \ bash 的能力感到惊讶。\n\n## 练习\n\n1) 在 `man` 页面中搜索“Parameter Expansion”，并尝试所有可用的类型。\n\
  2) 创建一个关联数组，将颜色名称映射到文本颜色的终端转义码。编写脚本使用该数组根据命令行参数输出指定颜色的文本。\n\n## 字符串操作\n\n由于 bash\
  \ 的大量工作与文件和文本字符串有关，因此操作字符串的能力是有价值的。\n\n虽然像 `sed`、`awk`、`perl`（以及许多其他工具）非常值得学习，在本节中，我想向你展示\
  \ bash 中可以实现的功能——这可能比你想的要多！\n\n在本节中将涵盖：\n\n* 如何在 bash 中编辑字符串\n* 什么是 extglobs 以及你如何使用它们\n\
  \n### 本节有多重要？\n\n变量是理解 bash 命令的基础，就像在任何编程语言中一样。这一高级部分将带你了解变量的更少使用或更为人知的方面。参数扩展部分特别值得了解。\n\
  \n### 字符串编辑\n\n这一节至关重要。bash 中的字符串操作有时在执行任务时非常有用。由于 bash 的大量工作与文件和文本字符串有关，因此操作字符串的能力是有价值的。\n\
  \n虽然像 `sed`、`awk`、`perl`（以及许多其他工具）非常值得学习，在本节中，我想向你展示 bash 中可以实现的功能——这可能比你想的要多！\n\
  \n### 字符串长度\n\n处理字符串时最常见的需求之一是确定长度：\n\n```bash\n1 $ A='12345678901234567890'\n2\
  \ $ echo \"${#A}\"\n3 $ echo \"$A\"\n```\n\n为什么第二个没有“起作用”？\n\nBash 提供了一种提取子字符串的方法。\n\
  \n这输出字符串从第三个字符开始的所有内容：\n\n```bash\n4 $ echo ${A:2}\n```\n\n而这个输出字符串从第四个字符开始的两个数字：\n\
  \n```bash\n5 $ echo ${A:3:2}\n```\n\n所以你可以看出字符串是 0 索引的，也就是说第一个字符是零，第二个是 1，以此类推。\n\
  \n### 搜索和替换\n\n你还可以在字符串内进行搜索和替换：\n\n```bash\n10 $ B=0000000000\n11 $ echo ${B/0/1}\n\
  ```\n\n简单的模式只替换第一个 0 为 1。如果你想让模式跨越字符串所有的匹配项，请添加另一个斜杠：\n\n```bash\n12 $ echo ${B//0/1}\n\
  ```\n\n第二个命令中是什么？它和第一条有什么不同？\n\n你还可以将小写转换为大写，反之亦然。使用单个逗号会将起始的首写字母转换为小写：\n\n```bash\n\
  13 $ C=AbCd\n14 $ echo ${C,}\n```\n\n而使用两个逗号会将整个字符串转换为小写：\n\n```bash\n15 $ echo\
  \ ${C,,}\n16 $ C=aAbCd\n```\n\n同样，脱字符字符也会将字符串转换为大写：\n\n```bash\n17 $ echo ${C^}\n\
  18 $ echo ${C^^}\n```\n\n### 更多……\n\n还有许多你可以使用的字符串操作技巧，但不值得一次性学习。\n\n如果你想更详细地研究它们并发现哪些可用（或者当你自己怀疑\
  \ bash 用字符串可以做什么时），请查看“Parameter Expansion”下的 man 页面。\n\n### Extglobs 和删除文本\n\n\
  一种更高级的字符串字符串的方法是通过使用 bash 的 extglobs 功能实现的。\n\n\n\n\n\n在这里提个警告：虽然了解此功能很有用，但为了这个目的，学习\
  \ `sed` 和 `perl` 程序被认为更有用。此外，除了正则表达式之外，还要学习这种额外类型的通配符（glob）语法，也相当令人困惑（而且正则表达式也有不同的版本！）。如果你觉得这一部分太晦涩，请随意跳过。\n\
  \n```\n19 $ shopt -s extglob\n20 $ A=\"12345678901234567890\"\n21 $ B=\"  ${A} \
  \ \"\n```\n\n你已经确保了 `extglob` 选项已开启，并创建了一个新变量 `B`，它是 `A` 前后各有两个空格。在 `echo` 输出中使用了管道符\
  \ `|` 来显示空格所在的位置。\n\n```\n25 $ echo \"B      |${B}|\"\n26 $ echo \"B#+( ) |${B#+(\
  \ )}|\"\n27 $ echo \"B#?( ) |${B#?( )}|\"\n28 $ echo \"B#*( ) |${B#\\*( )}|\"\n\
  29 $ echo \"B##+( )|${B##+( )}|\"\n30 $ echo \"B##*( )|${B##*( )}|\"\n31 $ echo\
  \ \"B##?( )|${B##?( )}|\"\n```\n\n通过 `bash` 帮助页并进行实验，你能找出上述 extglobs 之间的差异吗？它们是：\n\
  \n* `?( )`\n* `+( )`\n* `*( )`\n\n现在尝试在上面用 `%` 代替 `#`。发生了什么？\n\n这是一个潜在方便的应用是在需要移除日期中的前导零时：\n\
  \n```\n32 $ TODAY=$(date +%j)\n33 $ TODAY=${TODAY##+(0)}\n```\n\n记住：在美式键盘上，`#` 在左侧，`%`\
  \ 在右侧。或者在字母表中，“hash”在“per cent”之前。\n\n### 引用地狱\n\n引用——正如你可能已经看到的——在 bash 中很快就会变得非常复杂。\n\
  \n尝试这个：\n\n```\n34 $ echo 'I really want to echo $HOME and I can't avoid it'\n```\n\
  \n哦不。你现在卡住了。\n\n你能看出为什么吗？\n\n按下 `CTRL-c` 退出。\n\n所以你可能想尝试这个：\n\n```\n35 $ echo \"\
  I really want to echo $HOME and I can't avoid it\"\n```\n\n但这次 `$HOME` 变量被求值了，输出不是你想要的。\n\
  \n尝试这个：\n\n```\n36 $ echo 'I really want to echo $HOME and I'\"'\"'t avoid it'\n\
  ```\n\n这行得通了。记住这个技巧，因为它可以节省你大量时间！\n\n## 清理\n\n这一部分不需要清理，尽管你可能想退出当前的 bash shell 并启动一个新的，因为你刚才上面设置了一个\
  \ shell 选项（extglob）。\n\n### 你学到的内容\n\n这一节教了你如何使用纯 bash 进行字符串管理。这是一个相对较少涉及的领域，但值得了解一下，以防你以后遇到它。你学习了：\n\
  \n* 如何使用纯 bash 编辑字符串\n* 如何确定字符串长度\n* 什么是 extglobs 以及你如何使用它们\n* 如何避免常见的引用问题\n\n###\
  \ 下一步做什么\n\n在下一节中，你将查看 bash 的调试能力。\n\n### 练习题\n\n1) 学习如何在 sed 中完成上述所有操作。这需要一些研究和时间。\n\
  2) 学习如何在 perl 中完成上述所有操作。这同样需要一些研究和时间！\n3) 构建一个实用的 echo，其内部双引号字符串内包含一个单引号字符串，例如输出以下内容的内容：\n\
  \nHe said ‘I thought she’d said “bash was easy when $s are involved” but that can’t\
  \ be true!’\n\n### 调试 Bash 脚本\n\n有一些用的技巧值得知道，可以帮助调试你的 bash 脚本。在在这里介绍一些技巧的同时，你也将学习如何让你的\
  \ bash 脚本更健壮，更不容易出错。\n\n在这一节中你将学习到：\n\n* 用于调试的各种 bash 标记\n* 如何追踪 bash 代码以确定它正在做什么\n\
  * 在 bash 进行脚本检查（Linting）\n\n### 这一节有多重要？\n\n如果你编写、使用或维护任何复杂性的 bash，你都会想知道如何调试它！\n\
  \n#### 语法检查选项\n\n从创建这个简单的脚本开始：\n\n```\n1 $ mkdir -p lbthw_debugging && cd lbthw_debugging\n\
  2 $ cat > debug_script.sh << 'END'\n3 #!/bin/bash\n4 A=some value\n5 echo \"${A}\n\
  6 echo \"${B}\"\n7 END\n```\n\n现在使用 `-n` 标记运行它。该标记只解析脚本而不运行它。它对于检测基本的语法错误非常有用。\n\
  \n```\n8 $ bash -n debug_script.sh\n```\n\n你可以看到它是坏的。修复它。然后运行它：\n\n```\n9 $ bash\
  \ debug_script.sh\n```\n\n现在使用 `-v` 运行以详细输出。\n\n```\n10 $ bash -v debug_script.sh\n\
  ```\n\n尝试追踪以查看发生情况的更多细节。每个语句都会占一行。\n\n```\n11 $ bash -x debug_script.sh\n```\n\n\
  结合使用这些标记可以帮助存在基础错误的脚本，甚至只是弄清楚发生了什么。\n\n#### 管理变量\n\n变量是 bash 的核心部分，所以管理它们是另一个重点。\n\
  \n```\n23 #!/bin/bash\n24 set -o nounset\n25 set -x \n26 A=\"some value\"\n27 echo\
  \ \"${A}\"\n28 B=\"another value\"\n29 echo \"${B}\"\n30 unset -u nounset\n```\n\
  \n#### 析 Bash 脚本\n\n回到 `set` 标记，我们可以利用它的用法。\n\n```\n33 #!/bin/bash\n34 set -o nounset\n\
  35 set -x \n36 A=\"some value\"\n37 echo \"${A}\"\n38 B=\"another value\"\n39 echo\
  \ \"${B}\"\n40 unset -u nounset\n```\n\n#### Shellcheck\n\n最后，这里有一个实用的技巧。\n\n\n\n\
  \n\n1) 在像 `GitHub` 这样的社交编程网站上找到一个大型 `bash` 脚本，并对其运行 `shellcheck`。将你发现的任何改进提交回去。\n\
  \n## 自动补全\n\n如果你已经使用 `bash` 有了一段时间，那么你可能已经熟悉了它的自动补全功能。\n\n如果不熟悉，你可能想要开始使用它！\n\n\
  在本节中，你将涵盖到：\n\n* `bash` 中自动补全是如何工作的\n* `bash` `shift` 命令\n* 使用字符串处理进行大小写转换\n\n###\
  \ 这一节有多重要？\n\n在本节中，你将基于之前学过的内容进行构建：\n\n* `Bash` 数组\n* 终端转义码（escape codes）\n* 内置命令（Built-ins）\n\
  * `Bash` 函数\n* `Bash` 启动脚本\n\n以便更深入地理解一个你几乎每次使用 `bash` 时都会用到的功能。\n\n## 自动补全\n\n\
  ### 补全命令\n\n如果你在默认提示符下按两次键盘上的‘Tab’键，你应该会看到类似下面的内容：\n\n```\nDisplay all 2266 possibilities\
  \ (y or n)?\n```\n\n如果你足够勇敢并按下‘y’，你将看到你的 `path` 中所有可用命令的列表。\n\n要退出该列表，按‘q’。\n\n\
  现在，如果你在一个新的 shell 命令行中输入‘z’，然后按两次‘Tab’，你可能就会立即看到以‘z’开头的可用命令。\n\n这就是 `bash` 中的自动补全——默认情况下，你将获得与你目前为止输入的字母匹配的可用命令。如果你只记得命令的一部分，或者你只想看看哪些命令是以‘q’开头的（试一试！），这非常有用。\n\
  \n### 补全参数\n\n除了查找命令外，`bash` 的自动补全还可以被设置为具有上下文感知能力。一个简单的例子是，看看在新的 shell 行上输入 `ls`，然后按一个空格，再按两次‘Tab’会发生什么。你会发现，这次没有列出命令，而是其他什么内容……\n\
  \n列出本地文件是 `bash` 的一种默认行为——它假设参数很可能是文件。我接下要向你展示的是，如何让 `bash` 的自动补全更加依赖上下文，以至于你可以就你的特定程序向用户提供可用信息的建议。\n\
  \n### 一个简单程序\n\n首先，你将创建一个名为 `myecho` 的程序。在你输入它的过程中，尝试理解它在做什么。\n\n如果你不理解其中的某一行或某个命令，尝试通过在测试脚本中运行它来找出它的作用，或者尝试通过\
  \ `man bash` 查找。\n\n```\n 1 $ mkdir -p lbthw_autocomplete && cd lbthw_autocomplete\n\
  \ 2 $ cat > myecho << END\n 3 > #!/usr/bin/env bash\n 4 > function usage() {\n 5\
  \ > \techo \"Usage: $0 [red|green|blue] [message]\"\n 6 > \texit $1\n 7 > }\n 8\
  \ > if [ -z \"$1\" ]\n 9 > then\n10 \tusage 1\n11 > fi\n12 > typeset -l COLOR=\"\
  $1\"\n13 > shift\n14 > RED='\\033[0;31m'\n15 > GREEN='\\033[0;32m'\n16 > BLUE='\\\
  033[0;34m'\n17 > MSG=\"$@\"\n18 > COLOR=${COLOR,,}\n19 > if [[ \"${COLOR}\" = 'red'\
  \ ]]\n20 > then\n21 > \tMSG=\"${RED}${@}${RED}\"\n22 > elif [[ \"${COLOR}\" = 'green'\
  \ ]]\n23 > then\n24 > \tMSG=\"${GREEN}${@}${GREEN}\"\n25 > elif [[ \"${COLOR}\"\
  \ = 'blue' ]]\n26 > then\n27 > \tMSG=\"${BLUE}${@}${BLUE}\"\n28 > else\n29 > \t\
  usage 1\n30 > fi\n31 > echo -e \"${MSG}\"\n32 > END\n```\n\n如果你仍在感到苦恼，这本书的其他章节将为你提供启示。这里唯一的新命令是\
  \ `shift`。你可能根据上下文推断出 `shift` 的作用，但以防并不显而易见，它会从你的命令行中获取第一个参数，并从传递的参数列表中删除它。这对于处理命令行参数非常有用，因为你可以不断调用\
  \ `shift` 直到所有参数处理完毕。这种循环结构在许多 `bash` 脚本中都会用到。\n\n你之前可能还没有见过变量 `$@`。尝试从 `man bash`\
  \ 页面查找它包含什么内容。\n\n如果你找不到，不要担心，它在里面并不容易找。寻找“特殊参数”（Special Parameters）部分即可。\n\n如果你仍然无法弄明白，请尝试添加\
  \ `echo` 语句来弄清楚发生了什么。坚持下去。\n\n最后，你能弄出 `${COLOR,,}` 中两个逗号的作用吗？如果不能，就在命令行上玩玩它。这种“玩玩”正是你随着水平的提高而学习并内化\
  \ `bash` 知识的方式。\n\n现在你已经创建了 `myecho` 脚本，赋予它可执行权限并将其放入你的 `path` 中，然后运行它：\n\n```\n\
  33 $ chmod +x myecho\n34 $ PATH=.:${PATH}\n35 $ myecho red WARNING this is dangerous\n\
  36 $ myecho green OK good to go\n```\n\n尝试更改颜色的大小写（例如 GreeN）看看会发生什么。\n\n### 添加自动补全\n\
  \n如果你想让 `bash` 更加智能，那么你就有其他的 `COMPREPLY` 可可用。对于这个简单程序，你将为已经输入颜色的用户提供提示。\n\n```\n\
  47 $ cat > myecho << END\n48 > myecho_completion()\n49 > {\n50 >   if [ ${#COMP_WORDS[@]}\
  \ -ge 2\n51 >   then\n52 >     COMPREPLY+=(\"Input\")\n53 >     COMPREPLY+=(\"message!\"\
  )\n54 >   else\n55 >     COMPREPLY+=(\"red\")\n56 >     COMPREPLY+=(\"blue\")\n\
  57 >     COMPREPLY+=(\"green\")\n58 >   fi\n59 > }\n60 > complete -F myecho_completion\
  \ myecho\n61 > END\n62 $ source myecho\n```\n\n现在如果你输入 `myecho red`，空格后按两次‘Tab’，你应该看到行内提示。\n\
  \n这并不是获取这种信息的优雅方式。遗憾的是，完成输出功能并不灵活。你可能想尝试通过 `echo` 或更长的 `COMPREPLY` 条目来实现更好的方案。\n\
  \n### 高级自动补全功能\n\n如果你想让 `bash` 更加智能，那么你就有其他的 `COMPREPLY` 可用。\n\n```\n37 $ cat >\
  \ myecho << END\n38 > myecho_completion()\n39 > {\n40 >   COMPREPLY+=(\"red\")\n\
  41 >   COMPREPLY+=(\"blue\")\n42 >   COMPREPLY+=(\"green\")\n43 > }\n44 > complete\
  \ -F myecho_completion myecho\n45 > END\n46 $ source myecho\n```\n\n现在如果你输入 `myecho`，空格后按两次‘Tab’，你应该能看到颜色。\n\
  \n## 自动化\n\n虽然很有用，但每次想使用有自动补全脚本的特定命令时都 source 这些脚本是不现实的。\n\n因此，你可以将这些函数添加到你的 `bash`\
  \ 启动脚本中（参见第一部分的“脚本与启动”），这样每当你在该机器上使用 `bash` 时它们都是可用的。\n\n## 清理\n\n清理清理，运行：\n\n```\n\
  63 $ cd .. && rm -rf lbthw_autocomplete\n```\n\n## 你学到了什么\n\n* `bash` 中自动补全是如何工作的\n\
  * 如何创建自己的自动补全函数\n* 如何使用 `shift` 处理 bash 脚本和函数的参数\n* 如何更改字符串变量的大小写\n\n### 接下来做什么？\n\
  \n为了完成这本书，你将看一个更完整的 `bash` 程序，它可以作为一个持续集成工具。\n\n## 练习\n\n1) 为你经常使用的程序编写自动补全脚本。\n\
  2) 在 `GitHub` 上寻找自动补全脚本，并在本地安装和使用它们。\n\n\n\n\n\n### 3) 阅读 bash 手册章节，弄清楚在自动补全时所有的\
  \ `COMP_` 变量存储了什么。编写示例程序来使用这些变量。\n\n#### 示例 Bash 脚本\n\n为了结束本课程，我们将查看一个稍大的 bash 项目，以便在更具实践性的语文中演示在本课程中学到的技术。\n\
  \n#### 这一部分有多重要？\n\n这一部分并不是至关重要，但查看一个复杂的脚本是什么样的可能会很有趣。\n\n#### Cheapci\n\n`cheapci`\
  \ 是我写的一个 bash 脚本，目的是理解 Jenkins 在做什么，并提高我的 bash 水平。\n\n此处的最新版本为：[`github.com/ianmiell/cheapci`](https://github.com/ianmiell/cheapci)\n\
  \n我在这里重现了一个带有注释的修改版代码。和本课程中的每个列举一样，我建议手打输入代码（如果你愿意的话，可以跳过注释！），以感受代码的流程。\n\n####\
  \ 带有注释的代码\n\n这里是带有注释的代码。并不是每一行都经过了注释，我只是关注了你在课程中学到的那些部分：\n\n\n\n\n\n```bash\n#!/bin/bash\n\
  \n# 选项放置在最顶部。\nset -o pipefail\nset -o errunset\n\n### 设置为合理的默认值。\nFORCE=0\nVERBOSE=0\n\
  REPO=\"\"\nEMAIL=\"\"\nNAME=\"ci\"\nTEST_DIR=\".\"\nTEST_COMMAND=\"./test.sh\"\n\
  MAIL_CMD=\"mail\"\nMAIL_CMD_ATTACH_FLAG=\"-A\"\nMAIL_CMD_RECIPIENTS_FLAG=\"-t\"\n\
  MAIL_CMD_SUBJECT_FLAG=\"-s\"\nPRE_SCRIPT=\"/bin/true\"\nPOST_SCRIPT=\"/bin/true\"\
  \nTIMEOUT_S=86400\n\n### 设置 'PAGER' 变量，如果环境变量未设置，则默认为 'more'。\nPAGER=${PAGER:more}\n\
  \n# 'show_help' 是向标准输出发送有用帮助信息的函数。\n### 我将其放入函数中，以防它在脚本的多个地方被调用。\nfunction show_help()\
  \ {\n    cat > /dev/stdout << END\n${0} -r <repo> -l <local_checkout> [-q <pre-script>]\
  \ [-w <post-script>]\n   [-m <email>] [-a <mail command>] [-t <mail command attach\
  \ flag>]\n   [-s <mail command subject flag] [-e <recipients flag>] [-n name] [-d\
  \ <dir>]\n   [-c <command>] [-f] [-v] [-h]\n\n必需参数:\n-r - git 仓库，例如 https://github.com/myname/myproj（必需）\n\
  -l - 代码的本地检出（通过更新它来判断是否需要运行）\n（必需）\n\n可选参数:\n-q - 在实际执行测试之前运行的脚本（默认 ${PRE_SCRIPT}）\n\
  -w - 在实际执行测试之后运行的脚本（默认 ${POST_SCRIPT}）\n-m - 使用 \"mail\" 命令发送的邮箱（默认日志到 stdout）\n\
  -a - 使用的邮件命令（默认=${MAIL_CMD}）\n-n - ci 的名称（唯一，必须是有效的目录名），例如 myproj（default=${NAME}）\n\
  -d - 仓库内导航到的目录（default=${TEST_DIR}）\n-c - 从 -d 目录运行的测试命令（default=${TEST_COMMAND}）\n\
  -t - 邮件命令的附件标记（default=${MAIL_CMD_ATTACH_FLAG}, 空字符串表示无附件）\n-s - 邮件命令的主题标记（default=${MAIL_CMD_RECIPIENTS_FLAG}）\n\
  -e - 收件人标记（default=${MAIL_CMD_RECIPIENTS_FLAG}, 空字符串表示不需要）\n-f - 即使仓库没有更新强制运行（默认关闭）\n\
  -v - 详细日志（默认关闭）\n-i - 秒超时（默认 86400，即一天，之后一小时后执行 KILL）\n-h - 显示帮助\n\n示例\n\n- \"如果对\
  \ /space/git/shutit 执行 git pull 表示有更新，则 'Clone -r https://github.com/ianmiell/shutit.git'。\n\
  \  然后进入 test 目录，运行 ./test.sh，如果有任何问题，则邮件发送 ian@mail.meirionconsulting.com\"\n\n\
  \  ./cheapci -r https://github.com/ianmiell/shutit.git -l /space/git/shutit -d test\
  \ -c ./test.sh -m ian@mail.meirionconsulting.com\n\n- \"在 crontab 中持续运行此脚本。\"\n\n\
  \  Crontab 行：\n\n  * * * * * cd /path/to/cheapci && ./cheapci -r https://github.com/ianmiell/shutit.git\
  \ -l /space/git/shutit -d test -c ./test.sh -m ian@mail.meirionconsulting.com\n\
  END\n}\n\n### 现在我们收集从命令行传递的选项。你知道下面的 ':' 和 '?' 符号是什么意思吗？\nwhile getopts \"h?vfm:n:d:r:l:c:a:q:w:t:e:s:\"\
  \ opt\ndo\n    case \"$opt\" in\n        h|?)\n            show_help\n         \
  \   exit 0\n            ;;\n        v) VERBOSE=1 ;;\n        f) FORCE=1 ;;\n   \
  \     r) REPO=$OPTARG ;;\n        m) EMAIL=$OPTARG ;;\n        n) NAME=$OPTARG ;;\n\
  \        d) TEST_DIR=$OPTARG ;;\n        l) LOCAL_CHECKOUT=$OPTARG ;;\n        c)\
  \ TEST_COMMAND=$OPTARG ;;\n        a) MAIL_CMD=$OPTARG ;;\n        q) PRE_SCRIPT=$OPTARG\
  \ ;;\n        w) POST_SCRIPT=$OPTARG ;;\n        t) MAIL_CMD_ATTACH_FLAG=$OPTARG\
  \ ;;\n        e) MAIL_CMD_RECIPIENTS_FLAG=$OPTARG ;;\n        s) MAIL_CMD_SUBJECT_FLAG=$OPTARG\
  \ ;;\n        i) TIMEOUT_S=$OPTARG ;;\n    esac\ndone\n\n### 这行 'shift' 将所有参数从命令中移除。变量\
  \ 'OPTIND'\n 包含了 getopts 找到的选项数量。\nshift $((OPTIND-1))\n\n### 我们要求到此时 `REPO` 变量已设置，如果没有设置，\n\
  # 则显示帮助并以非零代码退出，表示运行未成功完成。\nif [[ ${REPO} = \"\" ]] then\n    show_help\n    exit\
  \ 1\nfi\n\n### 与其每次都设置跟踪，不如在使用了详细日志标志\n### 时设置它。\nif [[ ${VERBOSE} -gt 0 ]] then\n\
  \    set -x\nfi\n\n### 更多变量，这次派生自可选值。\n### 为将重用的项创建变量，而不是使用“硬编码”。\nBUILD_DIR_BASE=\"\
  /tmp/${NAME}\"\nBUILD_DIR=\"${BUILD_DIR_BASE}/${NAME}_build\"\nmkdir -p \"${BUILD_DIR}\"\
  \n# 使用 `RANDOM` 变量创建一个可能在此次运行中唯一的日志文件。\nLOG_FILE=\"${BUILD_DIR}/${NAME}_build_${RANDOM}.log.txt\"\
  \nBUILD_LOG_FILE=\"${BUILD_DIR}/${NAME}_build.txt\"\n### 根据名称创建锁文件\nLOCK_FILE=\"\
  ${BUILD_DIR}/${NAME}_ci.lck\"\n\n# 创建一个通用的清理函数，以备以后需要\nfunction cleanup() {\n  \
  \  rm -rf \"${BUILD_DIR}\"\n    rm -f \"${LOCK_FILE}\"\n    # 移除 /tmp 垃圾，保留 2 天前访问过的任何内容\n\
  \    find \"${BUILD_DIR_BASE}\"/* -type d -atime +1 | rm -rf\n    echo \"cleanup\
  \ done\"\n}\n\n### 捕获特定信号并运行清理\ntrap cleanup TERM INT QUIT\n\n### 发送邮件函数。注意在邮件命令中使用数组\
  \ `log_file_arg`。\nfunction send_mail() {\n    msg=${1}\n    if [[ ${LOG_FILE} !=\
  \ \"\" ]] && [[ ${MAIL_CMD_ATTACH_FLAG} != \"\" ]]; then\n        log_file_arg=(${MAIL_CMD_ATTACH_FLAG}\
  \ ${LOG_FILE})\n    fi\n    if [[ ${EMAIL} != \"\" ]] && [[ ${MAIL_CMD} != \"\"\
  \ ]]; then\n        echo \"${msg}\" | ${MAIL_CMD} \"${MAIL_CMD_SUBJECT_FLAG}\" \"\
  ${msg}\" \"${log_file_arg[@]}\" \"${MAIL_CMD_RECIPIENTS_FLAG}\" \"${EMAIL}\"\n \
  \   else\n        echo \"${msg}\"\n    fi\n}\n\n### 将日期输出到日志文件。\ndate 2>&1 | tee\
  \ -a \"${BUILD_LOG_FILE}\"\n\n使用 `-a` 测试判断此 ci 是否正在运行。\nif [[ -a ${LOCK_FILE} ]];\
  \ then\n    echo \"Already running\" | tee -a \"${BUILD_LOG_FILE}\"\n    exit\n\
  else\n    touch \"${LOCK_FILE}\"\n    # 从远程服务器获取更改。\n    pushd \"${LOCAL_CHECKOUT}\"\
  \n    git fetch origin master 2>&1 | tee -a \"${BUILD_LOG_FILE}\"\n    # 检查是否有传入的更改\n\
  \    updates=$(git log HEAD..origin/master --oneline | wc -l)\n    echo \"Updates:\
  \ ${updates}\" | tee -a \"${BUILD_LOG_FILE}\"\n    if [[ ${updates} -gt 0 ]] ||\
  \ [[ ${FORCE} -gt 0 ]]; then\n        touch \"${LOG_FILE}\"\n        pushd \"${LOCAL_CHECKOUT}\"\
  \n        git pull origin master 2>&1 | tee -a \"${BUILD_LOG_FILE}\"\n        popd\n\
  \        # 这个很快就不存在了，所以没必要 pushd\n        pushd \"${BUILD_DIR}\"\n        # 克隆到\
  \ NAME\n        git clone \"${REPO}\" \"${NAME}\"\n        popd\n        ${PRE_SCRIPT}\
  \ 2>&1 | tee -a \"${BUILD_LOG_FILE}\"\n        EXIT_CODE=\"${?}\"\n        if [[\
  \ ${EXIT_CODE} -ne 0 ]]; then\n            if [[ ${EXIT_CODE} -eq 124 ]]; then\n\
  \                msg=\"ANGRY (TIMEOUT) ${NAME} on $(hostname)\"\n            else\n\
  \                msg=\"ANGRY ${NAME} on $(hostname)\"\n            fi\n        else\n\
  \            msg=\"HAPPY ${NAME} on $(hostname)\"\n        fi\n        ${POST_SCRIPT}\
  \ 2>&1 | tee -a \"${BUILD_LOG_FILE}\"\n        EXIT_CODE=$?\n        if [[ ${EXIT_CODE}\
  \ -ne 0 ]]; then\n            msg=\"ANGRY ${NAME} on $(hostname)\"\n        fi\n\
  \        send_mail \"${msg}\"\n    fi\n    cleanup\nfi\n```\n\n\n\n\n如果你一直在仔细学习这门课程，你会发现一些可以改进的地方。如果是这种情况，请参阅练习部分了解如何操作！\n\
  \n## 你学到了什么\n\n在本节中，你并没有学到任何特定的新知识，但我希望你已经明确了 `bash` 的用途不仅仅是“单行命令”。\n\n## 清理\n\n\
  你现在应该已经熟悉流程了。\n\n## 练习\n\n1) 为 `cheapci` 寻找改进方案并以 pull request（拉请求）的形式提交。如果你不熟悉\
  \ pull request 的流程，请在 `GitHub` 上创建一个账户，通过添加 issue 并填写表单来提出你的更改。\n\n## 完成！\n\n干得好！你已经完成了这门课程。\n\
  \n课程的目标是让你理解 `bash` 的核心概念，以便你能够：\n\n* 清楚 `bash` 的功能\n* 能够深化对 `bash` 核心概念的理解\n\n\
