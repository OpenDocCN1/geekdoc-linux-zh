- "## 硬核学习 Bash\n\n\n\n![](img/title_page.png)\n\n![硬核学习 Bash](img/title_page.png)\n\
  \n\n\n\n本书可在 [`leanpub.com/learnbashthehardway`](http://leanpub.com/learnbashthehardway)\
  \ 购买。\n\n此版本发布于 2019-09-25。\n\n![出版者标志](img/leanpub-logo.png)\n\n这是一本 [Leanpub](http://leanpub.com)\
  \ 书籍。Leanpub 通过精益出版流程为作者和出版者赋能。[精益出版](http://leanpub.com/manifesto) 是使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在成功后建立影响力。\n\
  \n© 2017 - 2019 Ian Miell\n\n\n## 前言\n\n在我 20 年的软件职业中，几乎每天我都要以某种方式与 bash 打交道。Bash\
  \ 无处不在，以至于我们理所当然地认为人们知道它，并且因为用它就能“应付”，导致这项技能被低估了。\n\n我的观点是，软件社区在学习 bash 方面的服务极度匮乏，而掌握它会带来巨大的回报，而不仅仅是在使用\
  \ bash 的时候。\n\n你通常会被：\n\n* 充斥着术语的晦涩手册页（man pages），假设你理解的比实际的要得多\n* 解决你特定问题的单行命令（one-liners），让你在下次想做某事时没有获得任何提升\n\
  * 像扩展版手册页一样的 Bash “指南”——理论性强、充满术语，且非常难以跟上\n\n以上所有内容都是本书试图解决的。\n\n如果你曾对像这些事情感到困惑：\n\
  \n* `[` 和 `[[` 之间的区别\n* 通配符（globbing）和正则表达式（regexes）之间的区别\n* bash 中单引号或双引号的区别\n\
  * `` ` `` 代表什么\n* 什么是子壳（subshell）\n* 你的终端“发疯”了\n\n那么这本书就是为你准备的。\n\n它采用“硬核（Hard Way）”方法，确保你必须理解阅读那些晦涩手册页所需要的知识，并在需要时加深你的理解。\n\
  \n祝阅读愉快！\n\n## 硬核学习 Bash\n\n这门 bash 课程旨在帮助 bash 用户对 bash 获得更深入的理解和精通。它的目标不是让你立即成为专家，但你会对使用\
  \ bash 执行更多而不仅仅是单次命令的任务更有信心。\n\n### 简介\n\n#### 为什么要学习 Bash？\n\n有几个理由要以结构化的学习 bash：\n\
  \n* Bash 无处不在\n* Bash 功能非常强大\n\n你经常在没有意识的情况下使用 bash，而且人们经常会困惑为什么它有时不会按照你预期的那样工作，甚至不明白为什么在给他们单行命令运行后\
  \ bash 竟然能工作。\n\n深入理解 bash 并不需要长时间，一旦你掌握了基础，它的强大和无处不在意味着你可以在各种场景下大显身手。\n\n#### 为什么要“硬核”地学习\
  \ Bash？\n\n“硬核”是一种强调学习任何知识**所需过程的方法。你不会通过阅读关于自行车的内容来学骑，也不会通过读食谱来学做饭。书可以提供帮助（希望这本可以），但取决于你自己付出的努力。\n\
  \n本书根据我几十年的经验，通过小而易于消化的片段为你展示路径，并要求你*实际输入代码*。这就像学自行车时去骑车一样重要。如果没有大脑和身体的协作，知识就无法进入大脑。\n\
  \n如果你遵循这门课程，你将获得对 bash 的理解，这种理解可以作为你未来使用它的基础。\n\n#### 你将获得什么\n\n这门课程旨在为学生提供：\n\n\
  * 对 bash 的实操、快速且实用的理解\n* 足够的信息，以便让他们在深入研究 bash 时理解正在发生什么\n* 对高级 bash 用法的熟悉\n\n它**没有**：\n\
  \n* 让你精通所有你在命令行上可能用到的工具，例如 `sed`、`awk`、`perl`\n* 对 bash 的所有细微之处和底层技术提供完整的理论理解\n\
  * 解释一切。如果以后需要，有充足的时间去深入获取所有的细微差别\n\n你有时必须通过思考来理解正在发生什么。这就是硬核方法，也是真正学习的唯一途径。这门课程将节省你的时间，避免你以后在挠头苦恼某事是什么意思，或者为什么那个\
  \ StackOverflow 的答案起作用了。\n\n有时课程会涉及与 bash 密切相关的其他领域，但不是直接相关的 bash，例如特定的工具、终端知识。同样，这始终围绕着我使用\
  \ bash 和其他 shell 的几十年经验。\n\n### 假设\n\n它假设你对*非常*基础的 shell 使用和命令有些熟悉。对于那些想要达到那个程度的人，我建议遵循这套微型教程：\n\
  \n[`learnpythonthehardway.org/book/appendixa.html`](https://learnpythonthehardway.org/book/appendixa.html)\n\
  \n它还假设你配备了 bash shell 和一个终端。如果你不确定自己是否在 bash 中，请在终端输入：\n\n```\necho $BASH_VERSION\n\
  ```\n\n如果你在终端输出了如下这样的 bash 版本字符串，说明你处于 bash 中：\n\n```\n3.2.57(1)-release\n```\n\n\
  #### 课程是如何运作的\n\n本课程*要求*你输入所有的练习内容。\n\n经常，文中不会显示输出。任何解释性文本都会假设你已经输入了。再次，这是硬核方法，而且它是唯一的方法。\n\
  \n为了显示你所在的位置，命令行被标记为 1-n，数字后面跟着一个 `$` 符号，例如：\n\n```\n1 $ 第一条命令\n2 $ 第二条命令\n```\n\
  \n在每个章节的结尾有一组清理命令（如果需要），如果你不想留下工作的痕迹。\n\n### 结构\n\n本书分为四个部分：\n\n## 第一部分：核心 Bash\n\
  \n理解命令行 bash 必需的基础性概念。\n\n#### 第二部分：Bash 脚本\n\n让你的 bash 脚本技能达到精通水平。\n\n#### 第三部分：技巧\n\
  \n常用技巧和特征的入门。\n\n#### 第四部分：高级 Bash\n\n在前三章的基础上，引入了一些更高级的功能，本章将你的 bash 技能带出常规。\n\n\
  ## 第一部分：核心 Bash\n\n这部分将带你了解进一步深化 bash 知识的基础概念。\n\n在其中我们涵盖：\n\n* 什么是 bash\n* 通配符（Globbing）\n\
  * 变量\n* 函数\n* 管道和重定向\n* 基础 bash 脚本\n\n### 什么是 Bash？\n\nBash 是一个 shell 程序。\n\nshell\
  \ 程序通常是一个可执行的二进制文件，它接收你输入的命令并（一旦你按下回车键）将这些命令翻译为（最终）操作系统 API 的系统调用。\n\n如果你不确定这意味着什么，不要担心。你只需要知道\
  \ shell 程序是一个让你告诉计算机要做什么的程序。\n\n让 bash 与许多其他编程语言不同在于，它是一种设计用来“粘合”其他程序的语言。\n\n在这一部分中，你将了解\
  \ bash 以及其他相关 shell 的历史。\n\n#### 这一部分重要吗？\n\n这一部分是背景和设定材料。它对于书中其他内容并非至关重要，但在你阅读该主题时，了解这些信息是有用的。\n\
  \n#### 其他 shell\n\n\n\n\n其他的 shell 还包括：\n\n* `sh`\n* `ash`\n* `dash`\n* `ksh`\n\
  * `csh`\n* `tcsh`\n* `tclsh`\n\n这些其他的 shell 有不同的规则、约定、逻辑和历史，这意味着它们看起来可能相似。\n\n由于其他\
  \ shell 也是程序，因此你可以在彼此之间运行它们！\n\n在这里，你在 `bash` 终端内部运行了 `tcsh`。注意，你得到了一个不同的提示符（默认情况下）：\n\
  \n```\n1 $ tcsh\n2 % echo $dirstack\n3 % exit\n4 $\n```\n\n通常，`tcsh` 会给你提供一个带有百分号\
  \ `%` 的提示符，而 `bash` 会给你一个带有美元符号 `$` 的提示符。不过，这是可以配置的，所以你的设置可能有所不同。\n\n`dirstack`\
  \ 变量由 `tcsh` 设置并会输出有意义的内容。在 `bash` 中默认没有这个变量（当你最后回到 `bash` shell 时，尝试输入 `echo` 命令看看吧！）\n\
  \n## bash 的历史\n\n这张图帮助直观地了解 bash 的历史：\n\n![](img/shell_history.png)\n\nBash 被称为“Bourne\
  \ Again SHell”（再次出生的 Bourne Shell）。它是“Thompson Shell”以及 Bourne `sh` shell 的后代。`Bash`\
  \ 还有其他“兄弟姐妹”（例如 `ksh`）、“表兄弟”（例如 `tcsh`）以及“孩子”（例如 `zsh`）。\n\n细节并不重要，但重要的是知道存在不同的\
  \ shell，而且它们之间可以存在联系并具有某种程度兼容性。\n\n截至 2017 年，`Bash` 是最广泛可见和使用的 shell。然而，在没有安装 `bash`\
  \ 的服务器上发现它也并不罕见！\n\n## 你学到了什么\n\n* 什么是 shell\n* 如何启动不同的 shell\n* shell 的家族树\n\n\
  ### 接下来做什么？\n\n接下来你将学习 `bash` 中两个棘手但无处不在的主题：通配符（globbing）和引号（quoting）。\n\n## 练习\n\
  \n1) 从 `bash` 命令行运行 `sh`。发生了什么？\n2) 你能找到哪些命令，这些命令在 `bash` 中有效但在 `sh` 中不起作用？\n\n\
  ## 拆解 shell：通配符与引号\n\n你可能想过 `bash` 命令中的 `*` 到底意味着什么，以及它与正则表达式有什么区别。本节将解释这一切，并向你介绍\
  \ `bash` 中使用引号的乐趣。\n\n在本节中，你将学习：\n\n* 什么是通配符\n* 特殊通配符字符\n* 单引号和双引号的区别\n* 通配符与正则表达式的区别\n\
  \n### 这一节有多重要？\n\n通配符和引号引用是使用 `bash` 时必经的话题。很难遇到一组不依赖这些知识的命令或脚本。\n\n### 通配符 (Globbing)\n\
  \n在你的终端中输入这些命令：\n\n```\n1 $ mkdir lbthw_glob\n2 $ cd lbthw_glob\n3 $ touch file1\
  \ file2 file3\n4 $ ls *\n5 $ echo *\n```\n\n* 上面的第 1 行创建一个不应该已经存在的文件夹。\n* 第 2 行进入该文件夹。\n\
  * 第 3 行创建三个文件（`file1`、`file2`、`file3`）。\n* 第 4 行运行 `ls` 命令，它会列出匹配 `*` 的文件。\n* 第\
  \ 5 行运行 `echo` 命令，并将 `*` 作为 `echo` 的参数。\n\n你应该看到的在这两种情况下都列出了三个文件。\n\nshell 获取了你的\
  \ `*` 字符并将其转换为匹配当前工作目录下的所有文件。换句话说，它将字符 `*` 转换为字符串 `file1 file2 file3`，然后处理生成的命令。\n\
  \n### 引号引用 (Quoting)\n\n你认为运行这些命令会输出什么？先思考一下，做一个预测，然后输入出来！\n\n```\n6 $ ls '*'\n\
  7 $ ls \"*\"\n8 $ echo '*'\n9 $ echo \"*\"\n```\n\n* 第 6 行以单引号的形式列出匹配 `*` 字符的文件。\n\
  * 第 7 行以双引号的形式列出匹配 `*` 字符的文件。\n* 第 8 行回显带单引号的 `*` 字符。\n* 第 9 行回显带双引号的 `*` 字符。\n\n\
  即使你是 `bash` 专家，这也很困难！\n\n输出是你预想的吗？你能解释它吗？讽刺的是，如果你有在 `bash` 中引用变量的经验，解释起来可能会更难！\n\
  \n`bash` 中的引号引用是一个非常棘手的话题。你可能从中得知，对通配符加引号会消除它们的作用。但在其他语境下，单引号和双引号有不同的含义。\n\n引号引用改变了\
  \ `bash` 读取行的方式，使其决定是取这些字符并将它们转换为其他内容，还是让保持原样。\n\n你应该从中得到的结论是“bash 中的引号引用很复杂”，并为以后可能的一些令人抓头的问题做好准备！\n\
  \n### 其他通配符字符\n\n`*` 并不是唯一的通配符原子。其他的通配符原子是：\n\n* `?` - 匹配任意单个字符\n* `[abd]` - 匹配\
  \ `a`、`b` 或 `d` 中的任意字符\n* `[a-d]` - 匹配 `a`、`b`、`c` 或 `d` 中的任意字符\n\n尝试运行这些命令，看看输出是否符合预期：\n\
  \n```\n10 $ ls *1\n11 $ ls file[a-z]\n12 $ ls file[0-9]\n```\n\n* 第 10 行列出所有以“1”结尾的文件。\n\
  * 第 11 行列出所有以“file”开头并以`a-z`结尾的文件。\n* 第 12 行列出所有以“file”开头并以`0-9`结尾的文件。\n\n### 点文件\
  \ (Dotfiles)\n\n点文件就像普通文件，区别在于文件名以点开头。用 `touch` 创建一些：\n\n```\n13 $ touch .file1\n\
  14 $ mkdir .dotfolder\n15 $ touch .dotfolder/file2\n```\n\n你现在创建了一些点文件。如果你运行 `ls`：\n\
  \n```\n16 $ ls\n```\n\n这些文件是隐藏的。要看到它们，可以使用通配符。\n\n单点文件夹（`.`）是一个特殊的文件，代表你当前所在的文件夹。例如，如果你输入：\n\
  \n```\n17 $ cd .\n```\n\n你哪里也去不了！你切换到了当前所在的文件夹。\n\n双点文件夹（`..`）是另一个特殊文件夹，代表你当前所在文件夹的父目录。你认为在根目录（`/`）执行\
  \ `cd ..` 会发生什么？去看看发现吧。\n\n如果你用 `ls` 重新运行上一个 echo 命令：\n\n```\n18 $ ls .*\n```\n\n\
  你得到了一个稍微复杂的输出，因为 `ls` 会根据项目是文件还是文件夹返回更丰富的内容。\n\n\n\n第一个 `*` 字符被视为正则表达式，因为它没有被 shell\
  \ 解释，而是由 `rename` 命令解释的。它没有被 shell 解释是因为它被包含在单引号中。最后一个 `*` 被 shell 视为通配符（glob），并展开为本地目录下的所有文件。\n\
  \n再次，这里的关键点在于：上下文（context）决定一切。\n\n请注意，`‘.’` 作为通配符没有意义，某些 shell 提供更强大的扩展通配符功能。`Bash`\
  \ 是提供扩展通配符的 shell 之一，我们在这里不涵盖，因为这可能会让读者更加困惑。只需意识到更复杂的通配是可能的即可。\n\n## 清理\n\n现在清理你刚才的操作：\n\
  \n```\n25 $ cd ..\n26 $ rm -rf lbthw_glob\n```\n\n## 你学到了什么\n\n*   什么是通配符 (glob)\n\
  *   什么是隐藏文件 (dotfile)\n*   通配符和正则表达式是不同的\n*   通配符周围的单双引号非常重要！\n\n#### 接下来是什么？\n\n\
  接下来是另一个基础主题：变量。\n\n### 练习题\n\n1) 创建一个包含名称非常相似的文件文件夹，并使用通配符列出其中一个而不列另一个。\n2) 在网上研究正则表达式。\n\
  3) 研究 `grep` 程序。如果你已经认识它，请阅读 `grep` 的 man 手（输入 `man grep`）。\n\n## Bash 中的变量\n\n\
  在任何编程环境中，变量对于理解 `bash` 都关重要。在本节中，你将学习 `bash` 中的变量及其的一些微妙之处。\n\n你将涵盖：\n\n*   基础变量\n\
  *   变量引号\n*   引号与通配符\n*   `env` 和 `export` 命令\n*   简单数组\n\n到结束时，你将对变量在 `bash` 中如何工作以及一些陷阱有一个良好的概述。\n\
  \n### 这一节有多重要？\n\n变量是理解 `bash` 命令的基础，就像在任何编程语言中一样。\n\n### 基础变量\n\n从创建一个变量并打印它开始。\n\
  \n```\n1 $ MYSTRING=astring\n2 $ echo $MYSTRING\n```\n\n非常简单：你通过声明名称、紧接着添加等号、然后紧接着声明值创建一个变量。\n\
  \n变量不需要大写，但按照惯例，它们通常是大写的。\n\n要获取变量中的值，你必须使用美元符号告诉 `bash` 你想要对变量进行解引用（dereference）。\n\
  \n### 变量与引号\n\n当你开始使用引号时，事情变得更有趣。\n\n引号可以将不同的“单词”分组到单个变量值中：\n\n```\n3 $ MYSENTENCE=A\
  \ sentence\n4 $ MYSENTENCE=\"A sentence\"\n5 $ echo $MYSENTENCE\n```\n\n由于（默认情况下）shell\
  \ 通过空格分隔读取每个单词，它认为 `‘sentence’` 单词与变量赋值无关，并将其视为一个程序。为了将带有空格的句子放入变量中，你可以像上面那样将它包含在双引号中。\n\
  \n当我们在引号的字符串中嵌入其他变量时，事情变得更有趣了：\n\n```\n6 $ MYSENTENCE=\"A sentence with $MYSTRING\
  \ in it\"\n7 $ echo $MYSENTENCE\n8 $ MYSENTENCE='A sentence with $MYSTRING in it'\n\
  9 $ echo $MYSENTENCE\n```\n\n如果你期望看到与上一节相似的行为，你可能会大吃一惊！这说明了阅读 shell 脚本时的一个重要点：如果变量位于双引号中，`bash`\
  \ shell 会将其翻译为值，但如果位于单引号中，则不会。\n\n记住上一节提到的，这在通配符时不是不成立的！\n\n输入这些内容看看。像既往一样，在看到输出之前确保你考虑了预期的输出：\n\
  \n```\n10 $ MYGLOB=*\n11 $ echo $MYGLOB\n12 $ MYGLOB=\"*\"\n13 $ echo \"$MYGLOB\"\
  \n14 $ MYGLOB='*'\n15 $ echo \"$MYGLOB\"\n16 $ echo '$MYGLOB'\n17 $ echo $MYGLOB\n\
  ```\n\n通配符在单引号或双引号中都不会展开。这不很困惑吗？\n\n### Shell 变量\n\n某些变量是特殊的，并在 `bash` 启动时设置：\n\n\
  ```\n18 $ echo $PPID\n19 $ PPID=nonsense\n20 $ echo $PPID\n```\n\n*   第 18 行 - `PPID`\
  \ 是由 `bash` shell 设置的特殊变量。它包含了 `bash` 父进程 ID。\n*   第 19 行 - 尝试将 `PPID` 变量设置为其他内容。\n\
  *   第 20 行 - 再次输出 `PPID`。\n\n发生了什么？\n\n如果你想创建一个只读变量，在它前面加上 `readonly`，如下所示：\n\n\
  ```\n21 $ readonly MYVAR=astring\n22 $ MYVAR=anotherstring\n```\n\n### export\n\n\
  输入这些命令，并预测会发生什么：\n\n```\n23 $ MYSTRING=astring\n24 $ bash\n25 $ echo $MYSTRING\n\
  26 $ exit\n27 $ echo $MYSTRING\n28 $ unset MYSTRING\n29 $ echo $MYSTRING\n30 $ export\
  \ MYSTRING=anotherstring\n31 $ bash\n32 $ echo $MYSTRING\n33 $ exit\n```\n\n基于此，你认为\
  \ `export` 的作用是什么？\n\n你已经看到在 `bash` 终端中设置的变量以后可以使用美元符号进行引用。\n\n但当你设置一个变量并启动另一个进程时会发生什么？\n\
  \n在这种情况下，你设置了一个变量（`‘MYSTRING’），然后启动了另一个进程。在该 `bash` shell 中，`MYSTRING` 不存在，因此报错。\n\
  \n### 导出的变量和 Shell 变量\n\n无论你在何处，都可以通过运行 `env` 来查看导出的变量：\n\n```\n34 $ env\n```\n\n\
  `env` 的输出在不同的运行环境下可能会不同。\n\n但并不是你 shell 中设置的所有变量。它只是导出到 shell 中启动的进程的环境变量。如果你想查看\
  \ shell 中可用的所有变量，输入：\n\n```\n69 $ compgen -v\n```\n\n### 数组\n\n这里值得提还有数组。这样一个内置只读数组是\
  \ `BASH_VERSINFO`。就像在其他语言中，bash 中的数组是从 0 开始索引的。\n\n输入以下命令，这说明了如何引用版本信息的主版本：\n\n\n\
  \n\n```\n70 $ bash --version\n71 $ echo $BASH_VERSINFO\n72 $ echo $BASH_VERSINFO[0]\n\
  73 $ echo ${BASH_VERSINFO[0]}\n74 $ echo ${BASH_VERSINFO}\n```\n\n数组的处理可能很棘手，而且\
  \ bash 并没有给你什么帮助！\n\n第一个需要注意的是，如果没有给出索引，数组将输出第一个元素（0）处的项。\n\n第二个需要注意的是，简单地在普通数组引用后添加\
  \ `[0]` 是不起作用的。Bash 将方括号视为与变量不关联的字符，并将其附加到数组的末尾。\n\n你必须告诉 bash 将整个字符串 `BASH_VERSION[0]`\
  \ 视为需要解引的变量。你通过使用大括号来实现这一点。\n\n这些大括号也可以用于简单变量：\n\n```\n76 $ echo $BASH_VERSION_and_some_string\n\
  77 $ echo ${BASH_VERSION}_and_some_string\n```\n\n事实上，“简单变量”可以被视为只有一个元素的数组！\n\n\
  ```\n78 $ echo ${BASH_VERSION[0]}\n```\n\n所以所有的 bash 变量都是“真正的”数组！\n\nBash 的 `BASH_VERSINFO`\
  \ 数组中有 6 个项目（0-5）：\n\n```\n79 $ echo ${BASH_VERSINFO[0]}\n80 $ echo ${BASH_VERSINFO[1]}\n\
  81 $ echo ${BASH_VERSINFO[2]}\n82 $ echo ${BASH_VERSINFO[3]}\n83 $ echo ${BASH_VERSINFO[4]}\n\
  84 $ echo ${BASH_VERSINFO[5]}\n85 $ echo ${BASH_VERSINFO[6]}\n```\n\n一像变量一样，如果该项不存在，则输出将是一个空行。\n\
  \n#### 你学到的知识\n\n*   bash 中的基础变量用法\n*   变量与引号\n*   bash 设置的变量\n*   `env` 和 `export`\n\
  *   Bash 数组\n\n#### 接下来是什么？\n\n接下来，你将学习 bash 中实现的另一个核心语言特性：函数。\n\n### 练习题\n\n1)\
  \ 获取你 shell 中获取 `env` 的输出，并弄清楚每个项为什么在那里，以及它们可能被什么使用。你可能需要使用 `man bash`，或者使用 google\
  \ 来查明。或者你可以尝试重新设置它并看看会发生什么。\n\n2) 找出 `BASH_VERSINFO` 中各项内容的含义。\n\n### Bash 中的函数\n\
  \n从一个角度来看，bash 可以被视为一种编程语言，尽管它是非常缓慢且原始的。\n\n它拥有的语言特性之一是创建和调用函数的能力。\n\n这引导我们进入 bash\
  \ 中“命令”可以是什么的话题：\n\n*   函数\n*   别名 (alias)\n*   程序\n*   内置命令 (builtin)\n\n本节涵盖这些项目以及它们之间的关系。结束时，你将对\
  \ bash 中的命令有更细致的理解。\n\n#### 这一部分有多重要？\n\n在不了解 bash 函数的情况下也可以应付，但任何严肃的 bash 用户都会知道它们的作用以及工作原理。\n\
  \n#### 基础函数\n\n从创建一个简单的函数开始\n\n```\n1 $ function myfunc {\n2         echo Hello\
  \ World\n3 }\n4 $ myfunc\n```\n\n通过声明函数并将需要运行的代码块放在大括号内，你就可以在命令行上调用该函数，就像调用它是一个程序一样。\n\
  \n#### 参数\n\n与其他语言不同，这里对函数的参数没有检查。\n\n预测此代码的输出，然后运行它：\n\n```\n 5 $ function myfunc\
  \ {\n 6         echo $1\n 7         echo $2\n 8 }\n 9 $ myfunc \"Hello World\"\n\
  10 $ myfunc Hello World\n```\n\n你能解释输出吗？如果不能，你可能需要读读之前的页面！\n\n函数的参数从 1 到 n 编号。管理这些参数由函数本身决定。\n\
  \n#### 变量作用域\n\n变量在 bash 中有作用域。这在函数中特别有用，因为你不希望你的变量从函数外部被访问。\n\n这些命令说明了这一点：\n\n\
  ```\n11 $ function myfunc {\n12         echo $myvar\n13 }\n14 $ myfunc\n15 $ myvar=\"\
  Hi from outside the function\"\n16 $ myfunc\n```\n\nBash 函数没有特殊的作用域。外部的变量对它是可见的。\n\
  \n然而，bash 具有将变量声明为局部 (local) 的能力：\n\n```\n17 $ function myfunc {\n18         local\
  \ myvar=\"Hi from inside the function\"\n19         echo $myvar\n20 }\n21 $ myfunc\n\
  22 $ echo $myvar\n23 $ local myvar=\"Will this work?\"\n```\n\n用 `local` 声明的变量仅在函数内部可见和访问，且不会干扰外部。它不能在函数外部声明。\n\
  \n上面的 `local` 是 bash “内置命令 (builtin)” 的一个例子。现在是讨论不同类型命令的好时机。\n\n#### 函数、内置命令、别名和程序\n\
  \n在 bash 中调用命令至少有四种方法：\n\n*   内置命令\n*   函数\n*   程序\n*   别名\n\n让我们逐一来看。\n\n#### 内置命令\n\
  \n内置命令是“内置”在 bash shell 程序中的命令。通常情况下，你无法轻易区分内置命令、函数、程序或别名。\n\n\n\n\n这一章节是必读内容。\n\
  \n## 基础重定向\n\n从创建一个文件开始：\n\n```\n1 $ mkdir lbthw_pipes_redirects\n2 $ cd lbthw_pipes_redirects\n\
  3 $ echo \"contents of file1\" > file1\n```\n\n`>` 字符是“重定向”操作符。它将通常在终端中看到的上一个命令的输出重并发送到你指定的。。在这里，它创建了一个名为\
  \ `file1` 的文件，并将回显的字符串放入其中。如果你想检查文件，可以尝试使用 `cat`：`cat file1`。\n\n这里有一个微妙之处，我们稍后会提到：有时你在终端中看到的所有输出并不都能被此操作重定向，但现在不用担心这个。\n\
  \n## 基础管道\n\n输入以下内容：\n\n```\n4 $ cat file1 | grep -c file\n```\n\n通常情况下，你会将文件名作为最后一个参数运行\
  \ `grep`，但在这里我们通过“管道”操作符 `|` 将 `file1` 的内容“管道”到 `grep` 命令。\n\n管道接收一个命令的标准输出，并将其作为另一个命令的输入。那么，到底什么是标准输出呢？你很快就会发现！\n\
  \n```\n5 $ cat file2\n```\n\n那个命令的输出是什么？\n\n现在运行这个，并在运行之前猜猜结果：\n\n```\n6 $ cat file2\
  \ | grep -c file\n```\n\n如果输出不是你预期的，那么答案与所谓的“标准输出”以及其他类型的输出有关。我们将在下文中进一步解释。\n\n\
  ## 标准输出与标准错误\n\n在讨论“标准输出”和“标准错误”之前，我们需要退后一步考虑。\n\n在 Linux（以及 UNIX）中，“万物皆文件”是一项基本的设计原则。这意味着当向事物中推送数据或从事物中提取数据时，一切都被视为一个文件。\n\
  \n例如，如果你想向终端（或“简单”文件，或网络接口）写入内容，你需要“打开”对应于终端（简单文件或网络接口）的文件并获取一个“文件描述符”。\n\n“文件描述符”是一个与代表该“文件”的进程关联的数字。然后你可以向该“文件描述符”写入内容，操作系统将确保数据以适当的方式到达正确的地方。\n\
  \n为什么要把 UNIX（以及后来的 POSIX 标准）这样设计？因为通过通用接口与不同类型的数据“汇点”进行交互，意味着你可以无需担心数据在后台是如何被管理的，只需要关注输入和输出的数据即可。例如，你不需要关心一个简单文件是否真的是文件。\n\
  \n同样，你不需要关心你是在向终端还是文件写入。两者具有相同的接口，所以你只需要将数据写入代表你想写入的对象的文件描述符即可。\n\n为什么这对于我们这里的用例非常重要？在你上面看到的例子中，运行\
  \ `cat file2` 时的错误被发送到了与运行 `cat file1` 时输出不同的文件描述符。请记住，`file2` 不存在（所以 `cat` 运行会报错），而\
  \ `file1` 确实存在。\n\n在 UNIX/Linux 中，每个进程默认获得三个文件描述符。它们的编号从 0 到 2：\n\n* 0 是“标准输入”（stdin）\n\
  * 1 是“标准输出”（stdout）\n* 2 是“标准错误”（stderr）\n\n当你运行 `cat file1` 时，它获取你提供的文件名并将该文件的内容写入“标准输出”文件描述符\
  \ `1`。默认情况下，它链接到终端，因此你在终端上看到了此输出。\n\n当你运行 `cat file2` 时，它获取你提供的文件名，并发现该文件名不存在。因此，它将包含\
  \ `No such file or directory` 的错误信息写入“标准错误”文件描述符 `2`。默认情况下，它也链接到终端，因此通常你看到的输出与“正常”\
  \ `cat` 命令的“标准输出”相比没有区别。\n\n所以关键在于：`|` 操作符仅作为传递到左侧命令“标准输出”文件描述符的数据汇点。它忽略所有其他内容。所以当左侧命令（在此例中为\
  \ `cat`）将数据推送到“标准错误”文件描述符时，数据仍然会进入终端。\n\n同样，当你将输出重定向到文件时，`>` 操作符只将标准输出发送到文件。发送到标准错误的任何内容都不会被文件中。\n\
  \n如果你想将标准错误重定向到文件怎么办？尝试一下：\n\n```\n7 $ command_does_not_exist\n8 $ command_does_not_exist\
  \ 2> /dev/null\n```\n\n在上面的第二行中，文件描述符 `2`（标准错误）被指向一个名为 `/dev/null` 的文件。\n\n当你使用标准重定向操作符时，你隐式地使用了文件描述符\
  \ `1`。因此，这两个命令是等效的：\n\n```\n9 $ echo \"contents of file1\" 1> file1\n10 $ echo \"\
  contents of file1\" > file1\n```\n\n`>` 符号之前的数字表示要重定向的文件描述符。\n\n文件 `/dev/null` 是由\
  \ Linux（以及 UNIX）内核创建的一种特殊类型的汇点文件。它实际上是一个黑洞，数据可以向其中注入：写入它的任何内容都会被读取并忽略。\n\n另一个常见的重定向操作符是\
  \ `2>&1`。\n\n```\n11 $ command_does_not_exist 2>&1\n```\n\n此操作的作用是告诉 shell 将标准错误（2）重定向到标准输出（1）所指向的地方。\n\
  \n```\n12 $ command_does_not_exist > outfile 2>&1\n13 $ command_does_not_exist 2>&1\
  \ >\n```\n\n这种将所有输出发送到文件的模式非常常见，很少有人理解为什么必须是这种顺序。一旦你理解了，你就永远不会思考操作符的顺序应该是怎样的了！\n\
  \n## 管道与重定向的区别\n\n总结一下：\n\n* 管道将“标准输出”作为另一个命令的“标准输入”\n* 重定向将输出从文件描述符发送到文件\n\n这里还有两个值得这里的常用操作符：\n\
  \n```\n14 $ grep -c file < file1\n```\n\n`<` 操作符从文件将标准输入（文件描述符 `0`）重定向到命令，在这种情况下，效果与\
  \ `cat file1 | grep -c file` 相同。\n\n```\n15 $ echo line1 > file3\n16 $ echo line2\
  \ > file3\n17 $ echo line3 >> file3\n18 $ cat file3\n```\n\n\n\n\n上述前两行使用了 `>` 运算符，而第三行使用了\
  \ `>>` 运算符。`>` 运算符无论文件是否存在，都会有效地创建一个新文件。相比之下，`>>` 运算符会将内容**追加**到文件的末尾。因此，只有 `line2`\
  \ 和 `line3` 被添加到了 `file3` 中。\n\n## 清理\n\n现在清理一下你刚才的操作：\n\n```\n19 $ cd ..\n20 $\
  \ rm -rf lbthw_pipes_redirects\n```\n\n## 你学到了什么\n\n- 什么是文件重定向\n- 管道的作用\n- 标准输出和标准错误之间的区别\n\
  - 如何将标准输出重定向到与标准错误相同的位置（反之亦然）\n- 如何将标准输出或标准错误（或两者）重定向到文件\n\n### 接下来要做什么？\n\n你快要到达第一节的结尾了。接下来你将学习创建\
  \ shell 脚本，以及 `bash` 启动时会发生什么。\n\n## 练习\n\n1) 尝试几个不同的命令，弄清楚哪些输出到标准输出，哪些输出到标准错误。尝试通过误用程序来触发错误。\n\
  \n2) 编写将标准输出重定向到文件描述符‘3’的命令。\n\n3) 研究 `|&` 管道运算符的作用。如果你找不到，尝试运行命令 `cat file2 |&\
  \ grep -c file`，看看与你之前运行相比有什么变化。\n\n## 脚本与启动\n\n本节考虑了两个相关主题：\n\n- Shell 脚本\n- shell\
  \ 启动时会发生什么\n\n你可能遇到过 shell 脚本，这部分很快就能涵盖，但 shell 启动是一个有用但棘手的话题，大多数人都会某个地方被它难住，值得深入理解。\n\
  \n### 这一节有多重要？\n\n这一节是必读内容。\n\n## Shell 脚本\n\n```\n1 $ mkdir -p lbthw_scripts_and_startups\n\
  2 $ cd lbthw_scripts_and_startups\n```\n\nshell 脚本仅仅是一组可以非交互式运行的 shell 命令集合。这些可以是你手动运行的快速一次性脚本，也可以是非常复杂的程序。\n\
  \n### Shebang 解释器路径\n\n运行以下命令：\n\n```\n3 $ echo '#!/bin/bash' > simple_script\n\
  4 $ echo 'echo I am a script' >> simple_script\n```\n\n你刚刚创建了一个名为 `simple_script`\
  \ 的文件，里面有两行。第一行由两个特殊字符组成：井（#）和感叹号（!）。这通常被称为‘shebang’，为了方便也称为‘hashbang’。当操作系统接收到一个作为程序运行的文件时，如果从开头看到这两个字符，就知道该文件将在另一个程序（通常称为“解释器”）的控制下运行。\n\
  \n现在尝试运行它：\n\n```\n5 $ ./simple_script\n```\n\n这应该失败了。在我们解释原因之前，让我们先理解这个命令。\n\n\
  命令开头的 `./` 字符告诉 shell 你想在当前工作目录的范围内运行此文件。后面跟着要运行的文件名。\n\n同样，`../` 字符表示你想从当前工作目录的上一级目录运行。\n\
  \n如下：\n\n```\n 6 $ mkdir tmp\n 7 $ cd tmp\n 8 $ ../simple_script\n 9 $ cd ..\n10\
  \ $ rm -rf tmp\n```\n\n这将给你相同的输出。\n\n### 执行权限\n\n该脚本失败是因为文件没有被标记为可执行，所以你会收到一个“权限被拒绝”的错误。\n\
  \n要纠正这一点，运行：\n\n```\n11 $ chmod +x simple_script\n12 $ ./simple_script\n```\n\n\
  `chmod` 程序更改文件的权限（或“模式”），使得只有特定的用户或用户组可以读、写或执行（即作为程序运行）文件。\n\n### PATH 变量\n\n如果你不指定\
  \ `./` 而直接运行会发生什么：\n\n```\n13 $ simple_script\n```\n\n我不知道会发生什么。你会收到一个找不到它的错误，或者它会像以前一样工作。\n\
  \n我之所以不知道是因为这取决于你环境中 `PATH` 变量是如何设置的。\n\n如果你运行这个命令你会看到你的 `PATH` 变量：\n\n```\n14 $\
  \ echo $PATH\n```\n\n你的输出可能有所不同。例如，我的是：\n\n```\n/home/imiell/perl5/bin:/opt/local/bin:/opt/local/sbin:/Users/imiell/google-cloud-sdk\\\
  \n/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/X11/bin:/space/git/shutit:/sp\\\
  \nace/git/work/bin:/space/git/home/bin:~/.dotfiles/bin:/space/go/bin\n```\n\n`PATH`\
  \ 变量是一组由冒号分隔的目录。它可能非常简单：\n\n```\n/usr/sbin:/usr/bin\n```\n\n例如。\n\n这些是 `bash` 按顺序查找命令的目录。\n\
  \n那么如果你没有设置，是谁设置了 `PATH` 变量？答案是：bash 启动脚本。\n\n但在讨论它们之前，我们如何确保 `simple_script` 可以在不带\
  \ `./` 的情况下运行？\n\n```\n15 $ PATH=${PATH}:.\n16 $ simple_script\n```\n\n就是这样！在第一行中，你将\
  \ `PATH` 设置为自身加上当前工作目录。它会查找你之前在 `PATH` 变量中设置的所有目录，最后尝试正如我们之前看到的 `.’`，即本地文件夹。\n\n\
  ### 启动脚本\n\n理解启动脚本和环境变量是解决许多可能花费你大量时间调试问题的关键！如果某事在一个环境中有效而在另一个环境中无效，答案通常是启动脚本以及它们设置环境的方式存在差异。\n\
  \n### 启动详解\n\n当 `bash` 启动时，它会调用并运行一系列文件来设置你到达终端时的环境。如果你曾经注意到 `bash` 在给你提供提示符之前可以“暂停”，可能是因为启动脚本正在前台执行某个命令。\n\
  \n看这张图：\n\n![](img/shell-startup-actual.png)\n\n是的，这可能会让人困惑。\n\n该图显示了不同上下文中不同 shell\
  \ 的启动脚本顺序。每个上下文都通过遵循图中不同的颜色来显示。\n\n我们将遵循（从上到下）从‘bash’气泡开始路径，忽略‘zsh’ 状态。\n\n（注：原文中存在多处重复的描述，译文已按逻辑精简并翻译）\n\
  \n\n\n通常在启动 `bash` 时避免所有这些启动脚本是有用的，这可以让 `bash` 保持尽可能原始的状态。在调试或测试 bash 核心功能时，这可能是无价的。\n\
  \n要实现这一点，请运行以下命令：\n\n```\n22 $ env -i bash --noprofile --norc\n```\n\n`env` 是一个处理环境的程序。`-i`\
  \ 标志的作用是从你运行的命令中移除环境变量。这意味着导出的变量将不会被我们正在运行的 `bash` 程序继承。我们带有两个标志运行 `bash` 程序本身。`--noprofile`\
  \ 标志告诉 `bash` 不要加载系统级的 bash 启动文件，而 `--norc` 告诉 `bash` 不要加载你主目录下的个人启动文件。\n\n最终的效果是你的\
  \ shell 仅有一组非常少的变量可用：\n\n```\n23 $ env\n24 $ exit\n```\n\n## 清理\n\n现在清理一下你刚才的操作：\n\
  \n```\n25 $ cd ..\n26 $ unset MYVAR\n27 $ rm -rf lbthw_scripts_and_startups\n```\n\
  \n## 你学到了什么\n\n* 什么是 ‘shebang’\n* 如何创建和运行 shell 脚本\n* `PATH` 环境变量的意义\n* `bash` 启动时发生了什么\n\
  * 内置命令 `source` 的作用\n\n### 下一步是什么？\n\n干得好！你现在已经完成了课程的第一部分。\n\n你现在已经有了良好的基础来学习稍微高级的\
  \ bash 脚本编写，你将在第二部分涵盖这些内容。\n\n### 练习题\n\n1) 回顾你的 `bash` 会话所经历的所有脚本。阅读它们并尝试理解它们在做什么。如果你不理解某些部分，尝试通过阅读\
  \ `man bash` 来弄清楚发生了什么。\n\n2) 回顾图中存在于你机器上的其他文件。按照第 1 步的操作执行。\n\n# 第二部分 - 脚本化 Bash\n\
  \n在本节中，我将介绍构成 bash 脚本基础的概念和技术。这些是编写和理解实用 bash 脚本所需的底层构建模块，也是后续更高级章节的基础。\n\n我们将涵盖：\n\
  \n* 命令替换（Command substitution）\n* bash 中测试（test）的概念\n* bash 中的循环\n* 退出状态与 bash\n\
  * `set` 命令\n* 文件替换\n* 内部字段分隔符\n\n## 命令替换与评估\n\n在编写 bash 脚本时，你通常想要获取一个命令的标准输出并将其“放入”脚本中，就像你直接把它写在脚本里一样。\n\
  \n可以通过命令替换来实现。\n\n你将学习：\n\n* 什么是命令替换\n* 替换命令的不同方式\n\n### 这一节有多重要？\n\n如果你打算编写或处理\
  \ shell 脚本，这一节的内容是至关重要的。\n\n### 命令替换示例\n\n示例可以帮助说明。输入这些命令：\n\n```\n1 $ hostname\n\
  2 $ echo 'My hostname is: $(hostname)'\n3 $ echo \"My hostname is: $(hostname)\"\
  \n```\n\n如果将这些行放在脚本中，它将输出运行该脚本的主机宿机名。这可以让你的脚本变得更加动态。你可以根据命令的输出设置变量、添加调试等，就像使用任何其他编程语言一样。\n\
  \n你会注意到，如果包裹在单引号中，`$` 符号的特殊含义会被再次忽略！\n\n### 两种命令替换方法\n\n有两种方法执行命令替换：\n\n```\n4 $\
  \ echo \"My hostname is: `hostname`\"\n5 $ echo \"My hostname is: $(hostname)\"\n\
  ```\n\n这些方法的输出相同，反引号（backticks）的功能也相同。那么你应该用哪一个呢？\n\n#### “美元括号”法：$()`\n\n输入这些：\n\
  \n```\n 6 $ mkdir lbthw_cmdsub\n 7 $ cd lbthw_cmdsub\n 8 $ echo $(touch $(ls ..))\n\
  9 $ cd ..\n10 $ rm -rf lbthw_cmdsub\n```\n\n发生了什么？\n\n你创建了一个文件夹（第 6 行）并进入其中（第 7\
  \ 行）。\n\n下一行从最内层的括号向外读最容易。\n\n`ls ..` 命令在最内层的括号中运行。它输出了父目录的内容。\n\n该输出被替换到 `$(ls\
  \ ..)` 中。返回的“单词”被作为参数传递给 `touch` 命令。`touch` 命令根据父目录内容的列表创建一组空文件。\n\n`echo` 命令接收上述替换的输出（在这种情况下为空空，因为\
  \ `touch` 不产生任何输出）。\n\n所以，总结一下：\n\n* 该行输出了父目录的文件列表\n* 这些文件名在本地也被创建为空文件\n\n这是一个子命令如何嵌套的示例。你可以看到，嵌套非常简单——只需将一个包裹在\
  \ `$()` 中的的命令放在另一个包裹在 `$()` 内的命令内部，bash 就会按照适当的顺序从内向外为你替换每个命令的输出。\n\n#### “反引号”法\n\
  \n输入出这些内容：\n\n```\n11 $ mkdir lbthw_cmdsub\n12 $ cd lbthw_cmdsub\n13 $ echo `touch\
  \ \\`ls ..\\``\n14 $ cd ..\n```\n\n要嵌套反引号版本，你必须用反斜线对内部的反引号进行“转义”（escape），这样 bash\
  \ 才知道应该在哪个层级上解释反引号。\n\n为了说明这里的复杂性，一个简单的例子就足够：\n\n```\n15 $ echo $(echo hello1 $(echo\
  \ hello2))\n16 $ echo `echo hello1 `echo hello2``\n17 $ echo `echo hello1 \\`echo\
  \ hello2``\n```\n\n出于历史原因，反引号形式仍然非常流行，但我更倾向于 ‘$()' 形式，因为管理嵌套更简单。不过，如果你在查看别人的代码，你需要熟悉这两种！\n\
  \n如果你想看看事情会变得多么混乱，对比一下这两行：\n\n```\n18 $ echo `echo \\`echo \\\\\\`echo inside\\\\\
  \\\\``\n19 $ echo $(echo $(echo $(echo inside)))\n```\n\n并考虑一下哪一个更容易读（以及写）！\n\n\
  ## 清理\n\n删除残留的目录：\n\n```\n20 $ rm -rf lbthw_cmdsub\n```\n\n## 你学到了什么\n\n* 什么是命令替换\n\
  * 它如何与引号相关\n* 两种命令替换方法\n* 为什么一种方法通常优于另一种\n\n### 下一步是什么？\n\n接下来你将学习退出状态（exit codes），这将增强你编写更整洁的\
  \ bash 代码和更好脚本的能力。\n\n### 练习题\n\n1) 尝试各种命令替换命令，并输入变量和引号看看发生了什么。\n\n2) 解释为什么最后一个示例需要三个反斜线。\n\
  \n## 退出状态\n\n在学习测试和特殊参数之前，一个关键且相关的概念是退出状态。\n\n我们将涵盖：\n\n* 什么是退出状态\n* 如何在脚本和函数设置它\n\
  * 退出状态规范\n* bash 中的其他“特殊”参数\n\n### 这一节有多重要？\n\n如果不理解退出状态，大多数 bash 脚本将无法完全理解或安全编写。\n\
  \n### 什么是退出状态？\n\n在你运行命令、函数或内置命令后，会设置一个特殊变量告知你该命令的结果。如果你熟悉 HTTP 状态码（如 200 或 404），这是一个类似的概念。以一个简单的示例为例，输入：\n\
  \n```\n1 $ ls\n2 $ echo $?\n3 $ doesnotexist\n4 $ echo $?\n```\n\n当该特殊设置为 ‘0’ 时，意味着命令执行成功。\n\
  \n现在你已经学习了函数、命令以及退出状态的知识，你应该能够理解这里发生了什么：\n\n```\n 5 $ bash\n 6 $ function trycmd\
  \ {\n 7         $1\n 8         if [[ $? -eq 127 ]]\n 9         then\n10        \
  \         echo 'What are you doing?'\n11         fi\n12 }\n13 $ trycmd ls\n14 $\
  \ trycmd doesnotexist\n15 $ exit\n```\n\n你可以轻松地编写测试来这样使用退出状态。\n\n### 标准退出状态\n\n\
  对于想要遵循标准，退出状态有指南。请注意并非所有程序都遵循这些标准（`grep` 是非标准程序最常见的例子，正如你将学到的样！）。\n\n关键的包括：\n\n\
  | 数字 | 含义 | 备注 |\n| --- | --- | --- |\n| 0 | OK | 命令成功运行 |\n| 1 | 通用错误 | 当发生...\
  \ |\n\n\n\n\n\n| | | error but no specific |\n| | | number reserved to |\n| | |\
  \ indicate what it was |\n| 2 | Misuse of shell builtin | Problem when running |\n\
  | | | builtin command |\n| 126 | Cannot execute | Permission problem or |\n| | |\
  \ command is not |\n| | | executable |\n| 127 | Command not found | No file found\
  \ matching |\n| | | the command |\n| 128 | Invalid exit value | Exit argument given\
  \ (eg |\n| | | `exit 1.76` |\n| 128+n | Signal ‘n’ | Process killed with |\n| |\
  \ | signal ‘n’, eg 130 = |\n| | | terminated with CTRL-c |\n| | | (signal 2) |\n\
  \n由于代码 `3-125` 通常并不被预留，你可以在应用程序中将其用于自己的用途。\n\n### 退出码与 if 语句\n\n到为止都很简单，但遗憾的是（因为它们很有用），退出码可以用于许多原因，而不仅仅是告诉你命令是否成功完成。就像\
  \ HTTP 中的退出码一样，应用程序可以使用退出码来表示发生了错误，或者它可以返回“200 OK”并直接给你一条消息。\n\n尝试预测以下代码的输出：\n\n\
  ```bash\n16 $ echo 'grepme' > afile.txt\n17 $ grep not_there afile.txt\n18 $ echo\
  \ $?\n```\n\n你预料到此吗？`grep` 成功结束了（没有段错误或内存故障，没有被杀死等），但没有匹配到任何行，它返回 `1` 作为退出码。因此，`grep`\
  \ 使用退出码 `0` 表示“匹配”，使用退出码 `1` 表示“未匹配”。\n\n从某方面来说这是很棒的，因为你可以这样写 `if` 语句：\n\n```bash\n\
  19 $ if grep grepme afile.txt\n20 then\n21         echo 'matched!'\n22 fi\n```\n\
  \n另一方面，这意味着你无法确定某个退出码对于特定程序的终止意味着什么。我几乎每次都必须查询 `grep` 的退出码，如果我使用一个程序的退出码，我会确保先做几次测试，以确保我知道将发生什么！\n\
  \n### 设置你自己的退出码\n\n如果你在编写脚本，可以通过使用 `exit` 内置命令来设置函数的退出码。你可以简单地通过进入一个新的 `bash` 进程并退出它来模拟这一点。\n\
  \n```bash\n23 $ bash\n24 $ exit 67\n25 $ echo $?\n```\n\n如果你在编写一个函数，可以使用 `return`\
  \ 内置命令来设置函数的退出码。\n\n输入这些：\n\n```bash\n26 $ bash\n27 $ function trycmd {\n28    \
  \     $1\n29         if [[ $? -eq 127 ]]\n30         then\n31                 echo\
  \ 'What are you doing?'\n32                 return 1\n33         fi\n34 }\n35 $\
  \ trycmd ls\n36 $ trycmd doesnotexit\n37 $ exit\n```\n\n### 其他特殊参数\n\n变量 `$?` 是\
  \ `special parameter`（特殊参数）的一个例子。我不确定为什么它们被称为“特殊参数”而不是“特殊变量”，但也许是因为它们与函数和脚本的普通参数（`$1`、`2`\
  \ 等）一起，被视为这些上下文中自动分配的变量。\n\n下面的列表中使用了两个最重要的参数。尝试根据语境弄清楚它们是什么：\n\n```bash\n38 $ ps\
  \ -ef | grep bash | grep $$\n39 $ sleep 999 &\n40 $ echo $!\n```\n\n如果你仍然卡住了，请运行\
  \ `man bash` 查看 `bash` 帮助页。\n\n## 清理\n\n现在清理你刚才的操作：\n\n```bash\n41 $ rm afile.txt\n\
  ```\n\n## 你学到了什么\n\n*   什么是退出码\n*   一些标准退出码及其意义\n*   并非所有应用程序都相同的方式使用退出码\n*   测试和退出码是如何协同工作的\n\
