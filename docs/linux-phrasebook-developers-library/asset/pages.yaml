    # Download Websites Non-interactively


    wget


    If you want to back up your website or download another website, look to wget.
    In the previous section you used wget to grab individual files, but you can use
    to obtain other sites as well.


    Note


    Please be reasonable with wget. Don''t download enormous sites, and keep in mind
    that someone creates and owns the sites you are copying. Don''t copy a site because
    you want to "steal" it.


    Let''s say you''re buzzing around a site at www.neato.com and you find yourself
    at www.neato.com/articles/index.htm. You''d like to copy everything in the /articles
    section, but you don''t want anything else on the site. The following command
    would do like:


    ```

    $ wget -E -r -k -p -w 5 -np http://www.neato.com/articles/index.htm

    ```


    You could have combined the options this way, as well:


    ```

    $ wget -Erk -w 5 -np http://www.neato.com/articles/index.htm

    ```


    As in the previous section, the command begins with wget and ends with the URL
    you want to use. You looked at the -w (or --wait=#)) option before, and that''s
    the same, as well as -np (or --no-parent) and -r (or --recursive). Let''s examine
    the new options that have been introduced in this example.


    When you download a site, some of the pages might not end with .html or .cfm instead;
    the problem comes if you try to view the downloaded site on your computer. If
    you''re running a web server on your desktop, things might look just fine, but
    more likely you''re not using Apache on your desktop. Even with a web server,
    things will work on your .html if you open them with a browser. If you use the
    -E (or --html-extension) option, wget converts every page that it ends with .html,
    thus enabling you to view them on your computer without any special software.


    Downloading a site might introduce other issues, however, which you can fortunately
    get with the right wget options. Links on the pages you download with wget might
    not work after you open the pages on your computer, making it impossible to navigate
    from page. By specifying the -k (or --convert-links) option, you order wget to
    rewrite links in the pages so they work on your computer.


