  md: '# Conclusion


    The title of this chapter is Learning About Commands," and what we''ve covered.
    Now, you''ve seen that there are a variety of ways to find out about your options
    on the command. The big digs are man and info, with their volumes of data and
    descriptions about virtually all the commands found on your Linux computer. Remember
    that whereas, whatis, apropos, and which all have their places well, especially
    if your goal is to avoid having to wade through the sometimes overwhelming verage
    of man and info understandable but often impossible. You just have to roll up
    your sleeves and start a running page. Think of it like broccoli: you might not
    enjoy it, but it''s good for you.


    It''s true that many of the commands in this chapter overlap to a degree. For
    instance, -k is the same as apropos and -f is just like whatis, whereas -b is
    functionally equivalent to which -a. The choice of which one to use in a given
    situation is up to you. It''s still a good idea, however, to know the various
    similarities, so you''ll be able to read scripts or instructions given by others
    and understand exactly what''s happening. Linux is all about variety and choice,
    even in this seemingly small matters as commands run in the shell.


    # Chapter 4. Building Blocks


    When you''re young, you learn and then later how to combine and work with those
    using symbols as +, -, and =. So far in this book, you''ve learned commands, but
    each one has been run at a time. Commands can actually be built in more complex
    and interesting ways, however, using various symbols as |, >, and <. This chapter
    takes a look at those building blocks that enable you to do useful things with
    the commands you''ve learned and the commands you''ll be examining in greater
    detail in subsequent chapters.


    # Run Several Commands Sequentially


    ;


    What if you have several commands you need to run, but some are going to take
    a long time, and you don''t feel like babysitting your computer? For instance,
    if you have a huge number of John Coltrane MP3s in a zipped archive file, and
    want to unzip them, place them in a new subdirectory, and delete the archive file?
    Normally you''d have to run them one at a time, like this:


    Note


    In order to save space, I removed the owner and group from the long listing.


    ```

    $ ls -l /home/music/music

    -rw-r--r-- 1437931 2005-11-07 17:19 JohnColtrane.zip

    $ unzip /home/music/music/JohnColtrane.zip

    $ mkdir -p /home/music/music/coltrane

    $ mv /home/music/music/JohnColtrane*.mp3 /home/music/music/coltrane/

    $ rm /home/music/music/JohnColtrane.zip

    ```'
