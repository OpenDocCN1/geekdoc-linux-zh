    # Run a Command Only If the Previous One Fails


    ||


    The && runs each command in sequence only if the previous one completes successfully.
    The || does the opposite: if the first command (technically, it returns an exit
    status that is not 0), then does the second one run. Think of it like the either/either
    run the first command or the second one.


    The || is often used to alert an administrator when a process stops. For instance,
    to ensure that a particular command is running, and administrator might constantly
    query it with the ping command (you''ll find out about ping in Chapter 14, "Connectivity")
    if ping fails, an email is sent to the administrator to let him know.


    ```

    ping -c 1 -w 15 -n 72.14.203.104 ||

    necho "Server down" | mail -s ''Server down'' admin@google.com

    ```


