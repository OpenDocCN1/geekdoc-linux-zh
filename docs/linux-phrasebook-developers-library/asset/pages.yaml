    | Name | Common Abbreviation | Typical Default |

    | File Descriptor (Identifier) | | |

    | 0 | Standard stdin | Keyboard |

    | 1 | Standard output | Terminal |

    | 2 | Standard stderr | Terminal |


    In this chapter, we''re going to learn how to redirect input and output. Instead
    of having output appear on the terminal, or instead of acquiring pipes from your
    typing, a program can get it from a file. After you understand the tricks you
    can play with stdin and stdout, there are many powerful things you can do.


    # Use the Output of One Command As Input for Another


    |


    It''s a maxim that Unix is made up of small pieces, loosely joined. Nothing embodies
    that principle more than the concept of pipes. A pipe is the | symbol on your
    keyboard, and when placed between two commands, takes the output from the first
    and uses it as input for the second. In other words, | redirects stdout so it
    is sent to be stdin for the next command.


    Here''s a simple example that helps to make this concept clear. You already know
    about ls, and you''re going to find out how the less command in Chapter 5, "Viewing
    Files." For now, know that less allows you to page through text files one screen
    at a time. If you run ls in a directory that has many files, such as /usr/bin,
    things just go too fast to read. If you pipe the output of ls to less, however,
    you can through the output one screen at a time.


    ```

    $ pwd

    /usr/bin

    $ ls -1

    ```


    ```

    zipinfo

    zipnote

    zipsplit

    zsoelim

    zipdf

    [Listing truncated due length - 2318 lines!]

    $ ls -1 | less

    4ll1ftop

    7z

    7za

    822-date

    a2p

    ```


