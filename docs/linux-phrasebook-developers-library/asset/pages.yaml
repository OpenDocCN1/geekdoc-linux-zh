  md: '# 2


    # Part I: Getting Started


    In fact, it''s a good idea to keep filenames below 80 characters because that''s
    the width of your average terminal and your filenames will appear on one line
    without wrapping. But that''s just advice, not a requirement. The freedom to describe
    a file in 200+ characters is yours; just use it wisely.


    # Names Are Case-Sensitive


    Unlike Windows and Mac OS are case-sensitive when it comes to filenames. You could
    find the three files in the same directory on a computer running Linux:


    +   - bookstoby.txt

    - BooksToBuy.txt

    - BooksStobuy.txt


    To the Linux filesystem, there are three completely different files. If you were
    on Windows or Mac OS, however, you would be to rename or cancel your attempt to
    add BooksToBuy.txt to a directory that already contained bookstoby.txt.


    Case-sensitivity also means that commands and filenames must be entered exactly
    to match their command names or filenames. If you want to delete files by running
    rm, you can''t type in RM or rm. it is. And if you want to delete bookstoby.txt
    and instead enter rm BooksToBuy.txt, you just removed the wrong file or not at
    all.


    The lesson is twofold: Linux forces you to be precise, but precision is a good
    thing. At the same time, you gain a degree of flexibility that you don''t find
    in other operating systems. The combination of required precision and flexibility
    is one of the things makes Linux fun to use, yet understandably a bit confusing
    for new users.


    # Special Characters to Avoid in Names


    Every operating system has certain no-nos when you can use naming files and directories.
    If you use Mac OS, the colon (:) isn''t allowed; Windows users, on the other,
    can''t use the backslash (\). Linux has its forbidden characters as well. Before
    looking at those, here are the characters that are always safe: numbers, letters
    (either uppercase or lowercase), dots (.), and underscores (_). Other items on
    your keyboard work perfectly, others might work but present complications due
    to the fact that your will try to interpret them in various ways, and some won''t
    work at all.


    / never an option that particular character is used to separate directories and
    files. Let''s say you want to keep a list files you want to buy. You somehow manage
    to name the file/to_buy.txt (with a forward slash) to distinguish it from books/on_loan.txt
    and books/lost.txt. Now when you try to refer to your file at /home/scott/documents/books/to_buy.txt
    your command isn''t going to work because your shell thinks a books directory
    is inside the directory, but it doesn''t exist.


    Instead of a forward slash, use an underscore (as I did for the to_buy part of
    the filename), or cram the words together (as in booksToBuy.txt or BooksToBuy.txt).


    # 2


