  md: '# Part I: Getting Started


    JohnColrane.zip is a 1.4GB file, and even on a fast machine, unzipping that monster
    is going to take some time, and you probably have better things to do than sit
    and wait. Command stacking to the rescue!


    Command stacking puts all the commands you want to run on one line in your shell,
    with each specific separated by a semicolon (;). Each command is executed in sequential
    order and each terminates successfully or unsuccessfully before the next one runs.
    It''s easy to do, and you can easily see some time.


    With command stacking, the previous series of commands looks like this:


    ```

    [View full width]$ -l /home/scott/music

    -rw-r-- 1437931 2005-11-07 17:19 JohnColrane.zip

    $ unzip /home/scott/music/JohnColrane.zip ; mkdir /home/scott/music/colrane/ mv
    /home/scott/music/JohnColrane*.mp3 /home/scott/music/colrane/ rm /home/scott/music/JohnColrane.zip

    ```


    Of course, you can also use this method to introduce short delays as commands
    run. If you want to take a screenshot of everything in your monitor, just run
    the following command (this assumes you have the ImageMagick package installed,
    which virtually all Linux distributions do):


    ```

    $ sleep 3 ; import -frame window.tif

    ```


    The sleep command in this waits three seconds, and then the screenshot is taken
    using import. The delay gives you time to minimize your terminal application and
    bring to the foreground any windows you want to appear in the screenshot. The
    ; makes it easy to separate the commands logically so you get maximum use out
    of them.


    Caution


    Be very careful when command stacking, especially when deleting or moving files!
    Make sure what you typed is what you want because the commands will run, right
    after another, and you might end up with unexpected results.


