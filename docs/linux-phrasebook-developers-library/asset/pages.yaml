  md: '# Understand the Basics of Permissions


    Before moving on to the chmod command, which allows you to change the permissions
    associated with a file or directory, let''s review how Linux understands those
    permissions.


    Note


    Linux systems are beginning to use a more granular and powerful system known as
    Access Control Lists (ACLs). At this time, ACLs are still not widely used, so
    they''re not covered here. For more info about ACLs, see "www.linux-mag.com/2004-11/guru_01.html"
    and "An ACL GUI for Linux" in Linux Magazine The Open Source Weblog (http://opensource.weblogs.com/2005/12/06/an-acl-gui-for-linux/).


    Linux understands that three sets of users can work with a file or directory:
    the actual owner (also known as the user), a group, and everyone else on the system.
    Each of these sets is represented by a different letter, as shown in Table 7.1.


    # Table 7.1. Users and Their Abbreviations


    | User Group | Abbreviation |

    |---|---|

    | User (owner) | u |

    | Group | g |

    | Others | o |


    In the "List Permissions, Ownership, and More" section in Chapter 2, "The Basics,"
    you learned about permissions, which indicates what users can do with files and
    directories. In that section, you looked at three attributes: read, write, execute,
    represented by r, w, and x, respectively. Additional possibilities are suid, sgid,
    and the sticky bit, represented by s (or S on some systems), s (or S), and t (or
    T). Keep in mind, however, all of these have different meanings depending on whether
    the item with the attribute is a file or directory. Table 7.2 summarizes each
    attribute, its abbreviation, and what it means.


    # Table 7.2. Permission Layers and Their Meanings


