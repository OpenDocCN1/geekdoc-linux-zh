  md: '# Part I: Getting Started


    You see one screen of a time when you pipe the results of ls -1 to less, which
    makes it much easier to work with.


    Here''s a more advanced example that uses two commands discussed later: ps and
    grep. You''ll learn in Chapter 9, "Finding Stuff: Easy," that ps lists running
    processes and in Chapter 12, "Monitoring Resources," that grep finds lines in
    files that match a pattern. Let say Firefox is acting strange, and you expect
    that multiple copies are running in the background. The ps command lists every
    process running on your computer, but the output tends to be lengthy and flashes
    in an instant. If you pipe the output of ps to grep and search for firefox, you
    will be able to tell immediately if Firefox in fact is still running.


    Note


    In order to save space in this listing, I removed the owner, which in every instance
    was the person.


    ```

    [View full width]$ ps ux

    1504 0.8 4.4 75164 46124 ? S Nov20 1:19 kontakt

    19003 0.0 0.1 3376 1812 pts/4 S 00:02 ssh admin@david.hartley.com

    21176 0.0 0.0 0 ? Z 00:14 [wine-preloader] <defunct>

    24953 0.4 3.3 51856 34140 ? S 00:33 08 kdeinit: kword /home/scott/documents/clientele/

    /core/

    [Listing truncated for length]

    $ ps ux | grep firefox

    scott 8272 4.7 10.9 184072 112704 ? S Nov19 76:45 /opt/firefox/firefox-bin

    ```


    From 58 lines of output to oneno''s much easier to read!


    Note


    Keep in mind that many programs can work with pipes, but not all. The text editor
    vim (or pico, nano, or emacs), for instance takes the entire shell so that all
    input from the keyboard is assumed to be directed at him, while all output is
    displayed in the program. Because vim has total control of the shell, you can''t
    pipe output using the program. You''ll learn to recognize non-pipable programs
    as you use the shell over time.


    # Redirect a Command''s Output to a File


    >


    Normally, output goes to your screen, otherwise known as stdout. If you don''t
    want output to go to the screen and want it to be placed into a file, use the
    > (greater than) character.


    # Part I: Getting Started'
