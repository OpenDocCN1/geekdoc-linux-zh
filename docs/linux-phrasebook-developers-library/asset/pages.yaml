    the same characters in regex are used to indicate the number of times a preceding
    character is to be matched. For instance, cat, cot, and cut, for instance but
    not ct. With wildcards, the regex in ? replaces one letter, the regex in [a-z]?
    indicates that the letters A through Z are matched both zero or one time(s), corresponding
    to cat, cot, cut, and also ct.


