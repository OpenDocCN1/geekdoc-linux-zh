  md: '# Search for Whole Words Only in Files


    -w


    Think back to the earlier section "The Basics of Searching Inside Text Files for
    Patterns," in which you first learned about grep. You searched for the word, and
    grep obediently returned a list showing where pain had been used.


    ```

    $ grep pain *

    fiery in space.txt:watch the paint peel,

    three_no_more_forever.txt:all alone and in pain

    the speed of morning.txt:of a Chinese painting.

    8 day.txt:nice paint job too

    ghost pain.txt:Subject: ghost pain

    ```


    By default, grep searches for all occurrences of the string pain, showing you
    lines that contain pain, but also painting and faint. If painless, Spain, or painstaking
    had been in one of the files that searched, lines would have shown them as well.
    But if you only wanted lines in which the exact word appeared? For that, use the
    -w (or --word-regexp) option.


    ```

    $ grep -w pain *

    three_no_more_forever.txt:all alone and in

    ghost pain.txt:Subject: ghost pain

    ```


    This option can really help narrow your search results when you receive too many
    to easily sort through.


    # Show Line Numbers Where Words Appear in Files


    -n


    The grep command shows you line containing the term for which you''re searching,
    but it doesn''t really tell you where in the file you can find it. To find out
    the line number, utilize the -n (or --line-number) option.


    ```

    $ grep -n pain *

    fiery in space.txt:56:watch the paint peel,

    three_no_more_forever.txt:19:all alone and in pain

    the speed of morning.txt:66:of a Chinese painting.

    8 day.txt:78:nice paint job too

    ghost pain.txt:32:Subject: ghost pain

    ```


    Now that you know the line numbers for each instance of the string pain, it is
    a simple matter to go directly to those lines in virtually any text editor. Nice!'
