    $ ls -l

    -rw-r--r-- scott scott 508925 paradise_lost.txt

    ```


    In the same way that gzip removes the original file, leaving you solely with the
    gzipped result, gzip removes the .gz file, leaving you with the final gzipped
    result. If you want to ensure that you have both, you need to use the -c option
    (or --stdout or --to-stdout) and pipe the results to the file you want to create.


