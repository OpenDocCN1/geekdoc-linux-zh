  md: '# Run a Previous Command Using a String


    ! [string]


    The capability to run a command by referencing its number is nice, but it requires
    that you know the command''s number in history, which can be tedious to discover
    (piping the output of history to grep would help, but it''s still not optimal).
    Often a better way to reference a previously entered command is by the actual
    command''s number. If you follow the exclamation point by the first few letters
    of that command, your shell runs the first command when looking backward in .bash_history.


    ```

    $ cat /home/scott/todo

    Buy milk

    Buy dog food

    Renew Linux Magazine subscription

    $ cd /home/scott/pictures

    $ cat

    cat /home/scott/todo

    Buy milk

    Buy dog food

    Renew Linux Magazine subscription

    ```


    If the cat command is found three times in your history 35 (cat /home/scott/todo),
    412 (cat /etc/apt/sources.list), and 496 (cat /home/scott/todo)and you enter !cat,
    the one found at 496 is not the one that runs. If you run the cat at 412, you
    need to either !42 or follow the exclamation mark with enough information so it
    can tell you''re referencing the command as 412.


    ```

    $ !cat /etc

