    # Bring a Network Connection Down


    ifdown


    The ifup command makes network connections active, and the ifdown command brings
    them down. Why would you need to bring down your network connection? Most often,
    you''re trying to bring it up, and ifconfig reports that it''s already up, but
    erroneously configured. So you first bring it down, and then bring it up.


    ```

    # ifup eth0

    ifup: interface eth0 already configured

    # ifdown eth0

    # ifup eth0

    ```


    Notice that ifdown, like ifup, is silent upon success. If you don''t see anything
    after entering ifdown, the command was successful, and that network interface
    is no longer going to work.


    Note


    You can also use ifconfig eth0 down or iwconfig ath0 down to make wired or wireless
    connections down.'
