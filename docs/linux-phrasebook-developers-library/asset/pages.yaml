  md: '# Remove an Alias


    unalias


    All good things come to an end, and sometimes an alias outlives its usefulness.
    To remove an alias, use the unalias command.


    ```

    $ ls -d *

    by_pool/ libby_pix/ on_floor/

    $ alias lsd=''ls -d *''

    $ lsd

    by_pool/ libby_pix/ on_floor/

    $ unalias lsd

    $ $

    ```


    Note, though this command only works permanently for temporary shell aliases,
    discussed previously in "Create New Temporary Alias." The lsd alias in the previous
    example is gone for good. If you use the unalias command on an alias found in
    .bash_aliases, it will be fine, but only as long as you''re logged in. When you
    log out and back in, or reload .bash_aliases, the alias is back.


    To remove aliases from .bash_aliases, you need to edit the file and manually remove
    the line containing the alias. If you there''s a chance you want to reuse the
    alias again sometime, just put a pound sign (which comments it out) in front of
    the file, like this:


    ```

    # alias lsd=''ls -d *''

    ```


    Save .bash_aliases, reload it with the .bash_aliases command, and the alias won''t
    work anymore. But if you ever need it again, open .bash_aliases, remove the pound
    sign, save and reload the file, and it''s good to go again.


