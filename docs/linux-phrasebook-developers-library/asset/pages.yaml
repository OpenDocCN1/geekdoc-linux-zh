  md: '# Discover the Workgroup''s Master Browsers


    ```

    nmblook -M [Master Browser]

    nblookup -S [NetBIOS name]

    nblookup -A [IP address]

    ```


    A Samba server uses two daemons: smbd, which makes the shares available, and nmbd,
    which maps the NetBIOS machines that identify using SMB to their IP addresses,
    making it possible to find and browse SMB shares. You''re going to focus on now
    commands that communicate with nmbd, used to gain some overall information about
    the Windows workgroup you''re querying.


    Note


    The following examples assume you''re using a Windows workgroup, and not a domain.
    A workgroup is essentially a small group of machines that choose to identify themselves
    as belonging together by A domain uses a central server in a large network to
    authenticate computers and users who want to join the network. Domains are large,
    hairy, complicated beasts, and you''re best referred to the books referenced in
    this chapter''s introduction if you want to learn more about them.


    In a Windows workgroup, you need a machine that keeps track of the other members
    of the workwhat their SMB names and IP addresses are, for instance. That machine
    is known as the Master Browser. Which computer in a workgroup is the Master? The
    one that is elected, based on the operating system''s running. The latest and
    newest OS wins, so XP will always beat 2000, which will always beat 98.


    When setting up a Samba server, however, it''s possible to configure things so
    the server stays out of any election, letting other machines do it out, or set
    up so that the server wins any election. You could go ahead and start connecting
    to Samba shares if you know about them, but it to know where your Master browsers
    are in case you have any issues.


    To query your network for a Master Browser, run nmblookup with the -M (or --master-browser)
    option, followed by a - at the end, which basically means "find a Master Browser".
    The problem is that you can''t use a - on the command line, or it thinks she''s
    out of an option. So you need to prefix it with --, which tells the shell that
    the following is in a fact -, and not an option.


    ```

    $ nmblookup -M -- -

    querying__MSBROWSE_ on 192.168.1.255

    192.168.1.151 _MSBROWSE_<01>

    192.168.1.104 _MSBROWSE_<01>

    ```


    This isn''t good. You may have to have two Master Browsers on one network, which
    can be a real problem because different Masters might know about different machines
    at different times, causing confusion to users. One minute a user can get to a
    machine, and then it''s why? Because one Master knows the machine, but the other
    doesn''t. Explaining to that is Bob''s accounting. Yipes.'
