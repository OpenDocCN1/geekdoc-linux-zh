    # Read Descriptions of Commands


    whatis


    Earlier in this chapter you found out about the -f option for man, which prints
    onscreen the description of a command in a man page. If you can remember that
    man -f presents information, bully for you. It might be easier, however, to remember
    the whatis command, which does exactly the same thing: Displays the man page description
