    # Conclusion


    Printing is a central activity people perform on their computers, so it''s important
    to learn how to print effectively. Part of printing is knowing how to query printers
    as well as how send those jobs to printers in the first place. Of course, not
    all jobs need to be printed, so it''s important to know how to cancel unnecessary
    jobs as well. This chapter covers the major tasks you''ll need to work with your
    printers from within Linux, let me leave you a final bit of advice: Automatic
    duplex printers that work with Linux have now fallen in price drastically, and
    they''ll help you save a small fortune in paper. Check out one when you''re next
    in the market for a printer. You''ll be glad you.


    # Chapter 7. Ownerships and Permissions


    From the beginning, Linux was designed to be a multiuser system (unlike Windows,
    which was designed as a sole user OS, the source of its security problems to this
    day). This meant that different users would be on the system, creating files,
    deleting directories, and reading various items. To keep everyone stepping on
    each other''s toes and damaging the underlying operating system itself, a system
    of permissions was created early. Mastering the art of Linux permissions will
    aid you as you use your Linux box, whether it''s a workstation used by one person
    or a server accessed by hundreds. The tools are simple, but the power they give
    you is complex. Time to jump in!'
