    -rw-r--r- 1 scott family ... libby_on_floor_02.jpg

    ```


    Caution


    If you used chgrp -R *, you wouldn''t change any of the dot files in the /home/scott/pictures/libby
    directory. However, chgrp -R . should not be used. It changes all the files in
    the current directory, but . also matches ..., so all the files in the parent
