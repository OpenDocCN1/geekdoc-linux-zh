    That''s the problem with using && commands in sequence, regardless of their successful
    completion. A better method is to separate the commands with && which also runs
    each command one after the other, but only if the previous one completes successfully
    (technically, each command must return an exit status of 0 for the next one to
    run). If a command fails, the entire chain of commands stops.


