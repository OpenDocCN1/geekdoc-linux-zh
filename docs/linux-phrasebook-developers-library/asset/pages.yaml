    593985 /Class

    145962 /Hank_Mobley/1958_Peckin _Time

    128200 /Hank_Mobley/1963_No_Room_For_Squares

    108445 /Hank_Mobley/1961_Workout

    ```


    As with df, for du are given in kilobytes, but also like df, you can view them
    in a comprehensible fashion with the -h (or --human-readable) option.


