  md: '# Chapter 6. Printing and Managing Print Jobs


    Over the years, Linux has had several printing systems, including the venerable
    Line Printer Daemon (LPD) and LPR Next Generation (LPRng) that are still in vestigial
    form on modern Linux distributions. In the past few years, most distributions
    have settled on the Common Unix Printing System (CUPS) as their backend of choice.
    CUPS is well supported, easy to use, modern, and a perfect drop-replacement for
    LPD and LPRng. The same commands used with LPD and LPRng still work, but now they
    call functions in CUPS.


    This chapter focuses on CUPS because it is the printing system with most Linux
    users work. This chapter does not cover how to set up and configure a printer.
    Most distributions now provide easy-to-use GUI configuration tools to do just
    that, so you''re going to focus on actually querying and using the printer via
    the command line.


    Linux Journal''s "Overview of Linux Printing Systems," available at http://www.linuxjournal.com/article/6729,
    provides an excellent look at the various options Linux users have today, with
    special focus on the favorite. For more on CUPS, see Linux Journal''s "The CUPS
    Printing System" at http://www.linuxjournal.com/article/8618, a very good look
    at this essential technology. The best place to go for information about CUPS
    is unsurprisingly, the CUPS Software Users Manual which you can find at http://www.cups.org/doc-1/sum.html.
    It''s long and sometimes out, but full of valuable advice and help, and it''s
    an essential resource.


    # List All Available Printers


    ```

    lpstat -p

    ```


    Before you begin working with your printers, you need to know what makes up "your
    printers." To find the printers configured on your system, use the lpstat command
    (short for line printer status) along with the -p option.


    ```

    $ lpstat -p

    printer bro is idle. enabled since Jan 01 00:00

    printer bro_wk is idle. enabled since Jan 01 00:00

    printer wu is idle. enabled since Jan 01 00:00

    ```


    As you can see, this system has three printersbro,bro_websanity, and wu_eads1&none
    of them are printing anything at the moment.


