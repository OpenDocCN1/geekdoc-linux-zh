    # Conclusion


    Virtually every command you looked at in this chapter has GUIs. But if your system
    is non-responsive, if you''re connecting to machine via SSH (covered in Chapter
    15) and can''t use a GUI, or if you just want to use the speediest tool, you''ll
    need to use the command line. The commands in this chapter are easy to remember,
    thanks to well-chosen names:


    +   * ps (running processes)

    * kill (kill processes)

    * top (top listing of running processes)

    * lsof (list [Is] open files)

    * free (free, available, memory)

    * df (disk free space)

    * du (disk usage)


    Practice with your computer, and don''t forget to read the man pages for each
    one this chapter could only cover a fraction of their capabilities. There are
    many options to select them particular, ps top, and allow you to do truly amazing
    detecting work on the computers under your watch.


    # Chapter 13. Installing Software


    Linux distributions by default contain thousands of great software packages. Immediately
    after completing a basic install, you can surf the Net, write reports, create
    spreadsheets, view and manipulate images, and listen to music. Even with plethora
    of software, you''re still going to want to add new tools that you run across.
    Fortunately, Linux makes it easy to install software onto your computer.


    Conventional wisdom about Linux said you had to compile any software you wanted.
    You can still do if you like (like many people), but that''s rarely necessary
    in this day and age. Instead, you can install any of those packages easily and
    using some simple tools.


    You need to understand one thing before proceeding, however. In the Linux world,
    software packages come in a variety of formats, with two particular dominating:
    RPM and DEB (not surprisingly, those are the two we''re going to cover in this
    chapter). RPM is used by distributions such as Red Hat (in fact, RPM stands for
    Red Hat Package Manager), Fedora Core, SUSE, and other RPM-based distributions.
    DEB is'
