  md: '# Use a File As Input for a Command


    Normally your keyboard provides input to commands, so it is termed stdin. In the
    same way that you can redirect stdout to a file, you redirect stdin so it comes
    from a file instead of a keyboard. Why is this handy? Some commands cannot open
    files directly, and in those cases, the < (less than) is just what you need.


    For instance, normally the echo command repeats what you type on stdin, as shown
    here:


    ```

    $ echo "This will be repeated"

    This will be repeated.

    ```


    However, you can use the < to redirect input, and the echo command uses the contents
    of a file instead of stdin. In this case, let''s use the hank_mobley.txt file
    created in the previous section.


    ```

    $ echo < hank_mobley.txt

    Mon Nov 21 21:33:58 CST 2005

    1958_Peckin_Time/

    1960_Roi1_Cal/

    1960_Son1_Station/

    1961_Workat/

    1963_No_Room_For_Squares/

    ```


    You''re not going to use the < all the time, but it will be exactly what you need
    in a number of situations, keep it in mind.


    # Conclusion


    This book started with some simple commands, but now you''ve learned the building
    blocks that allow you to combine those commands in new and interesting ways. Going
    forward, it''s going to get more complicated, it''s going to get more powerful
    as well. The things covered in this chapter are a key factor in gaining power.
    Now, onward!'
