  md: '# Securely Log In Another Machine Without a Password


    ssh


    The name of this section might appear to be a misnomer, but it''s entirely possible
    to log in to a machine via ssh, without providing a password. If you log in every
    day to a particular computer (and there are some boxes I might log in several
    times a day), the techniques in this section will make you very happy.


    Let''s say you want to log in to eliot (username: tom) from pound (username: ezra)
    without requiring you type a password. To start with, create an ssh authentication
    key on pound using the following command:


    ```

    $ ssh-keygen -t dsa

    Generating public/private dsa key pair.

    Enter file in which to save the key (/home/ezra/.ssh/id_dsa):

    Enter passphrase (empty for no passphrase):

    Enterter passphrase again:

    Your identification has been saved in /home/ezra/.ssh/id_dsa.

    Your public key has been saved in /home/ezra/.ssh/id_dsa.pub

    The key fingerprint is:

    30:a4:a7:31:27:d61:821e:76:e:ed:6b:96:3c:24:ezrapound

    ```


    Accept the default location to save the key by pressing Enter, and leave the passphrase
    blank as by pressing Enter twice. You just created a key at ~/.ssh/id_rsa and
    a public key at ~/.ssh/id_rsa.pub.


    Now you need to transfer the public key from pound to eliot. The developers behind
    ssh are away with you, and have created a program that makes this as easy as falling
    off a log. To automatically copy your public key from pound to eliot, use the
    following on:


    ```

    $ ssh-copy-id -i ~/.ssh/id_dsa.pub tom192.168.0.25

    ```


    Now try logging into the machine with ssh@192.168.0.25, and check in .ssh/authorized_keys
    to make sure you haven''t added extra keys that you weren''t expecting.


    You''re done (although if you want to follow the advice given by ssh-copy-id,
    go right ahead). Watch what happens when you use the ssh command from pound to
    eliot now:


    ```

    $ ssh tom192.168.0.25

    Linux eliot 2.6.2-10-386 #1 Mon Jan 16 17:18:08 UTC 2006 i686 Linux

    Last login: Mon Feb 22:40:31 2006 from 192.168.0.15

    ```


    Now you weren''t asked to enter a password, which is exactly what you wanted.


    Some of you are wondering about the security of this trick. No passwords? Freely
    exchanging keys? It''s true, but think about it a moment. If someone gets on pound,
    he can now connect to eliot without a password. That simply means that you need
    to practice good security on pound. If pound is'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Part V: Networking


    compromised, you have enormous problems whether or not the attacker realizes that
    he can also get to eliot. On top of that, you shoot passwords around the Internet
    all the time. If an attacker acquires your password, he can do major damage well.
    Isn''t your private key as important as a password? And aren''t you going back
    up and safeguard it? When you think about it in those terms, exchanging keys via
    ssh is at least as secure as passwords, and in many ways more secure.


    Nonetheless, if you prefer keeping passwords, that''s certainly your prerogative.
    That''s what open source and Linux is all about: choice.


    # Securely Transfer Files Between Machines


    ```

    sftp

    ```


    In the way that ssh is a far better than telnet, SFTP is far better than FTP.
    Like telnet, FTP sends your name and password, as well as all the data being transferred,
    in the clear that anyone sniffing packets can listen. SFTP, on the other hand,
    uses ssh to encrypt everything: username, passwords, and traffic. Other than the
    fact it''s about a million times more secure, it''s remarkably similar to FTP
    in its commands, which make it easy to learn and use.


    If you access a machine via ssh, you can also SFTP to it. Use the sftp command
    from pound (192.168.0.15; username ezra) for eliot (192.168.0.25; username tom),
    just use this command:


    ```

    $ tom@192.168.0.25

    Connecting to 192.168.0.25...

    tom@192.168.0.25''s password:

