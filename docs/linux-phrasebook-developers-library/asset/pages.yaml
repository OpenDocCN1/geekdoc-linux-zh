    --rws-xr-x 1 scott root ... /usr/bin/passwd

    ```


    You can see that password is set as suid because it has an s where the user''s
    x should be. The root user owns password, but it''s necessary that ordinary users
    be able to run the command, and they wouldn''t be able to change their passwords
    on their own. To make the password command executable, for x is set for the user,
    group, and all users on the system. Not enough, however. The answer is to set
    password as suid root, so anyone can run it with root''s permissions for the command.


    # Note


    You might see both an and an S to indicate that suid is set. You see an if the
    owner had already executed permissions (x) before you set suid, and an S if the
    owner didn''t have execute set before suid was put in place. The end result is
    the same, but the capitalization tells you what was in originally.


    You can set and unset suid in two ways: using the alphabet or using numbers. The
    alphabet method would like this:


    ```

    $pwd

    /home/scott/bin

