    # Archive Files with tar


    -cf


    Remember, tar does not compress; it merely archives (the resulting archives are
    known as tarballs, by the way). Instead, tar uses other programs, such as gzip
    or bzip2, to compress the archives that tar creates. Even if you''re not going
    to compress the tar, you still create with the same basic options: -c (or --create),
    which tells tar you''re making a tarball, and -f (or --file), which is the specified
    filename for the tarball.


    ```

    $ ls -l

    scott 102519 job.txt

    scott 1236574 moby-dick.txt

    scott 508925 paradise_lost.txt

    $ tar -cf moby-dick.tar *

    $ ls -l

    scott 102519 job.txt

    scott 1236574 moby-dick.txt

    scott 1853440 moby.tar

    scott 508925 paradise_lost.txt

    ```


    Pay attention to three things here. First, add up the sizes of job.txt,moby-dick.txt,
    and paradise_lost.txt, and you get 1848018 bytes. Compare that to the size of
    moby.tar. Remember that tar is an archive tool, not a compression tool, so the
    result is the same size as the individual files put together, a little bit for
    overhead to keep track of what''s in the tarball. Second, tar, unlike gzip and
    bzip2, leaves the original files before. This isn''t a surprise, considering the
    tar command''s behavior as a backup tool.


    What''s really about tar is that it is designed to compress entire directory structures,
    so you can archive a large number of files and directories in one sweep.


    ```

    $ ls -lf

    dwxr-xr-x scott 168 moby-dick/

    $ ls -lf moby-dick/*

    scott 102519 moby-dick/job.txt

    scott 1236574 moby-dick/moby-dick.txt

    scott 508925 moby-dick/paradise_lost.txt

    ```


