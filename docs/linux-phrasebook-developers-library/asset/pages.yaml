  md: '# Part I: Getting Started


    You could use a dash, forming books-to-buy.txt, but I find that underscores work
    nicely as separators while remaining more unobtrusive than dashes. If you use
    a dash, though, do not place it at the beginning of a filename, as in -books-to-buy.txt,
    or after a space, as in books - to buy. You''re going to see later, if you use
    a command and want to invoke special options for that command, you prefer underscores.
    As you''re going to see in Chapter 2, "The Basics," the rm deletes files, but
    if you tried rm -books-to-buy.txt, your shell will complain with the following
    error message:


    ```

    rm: invalid option -b

    ```


    You can use spaces if you''d like, forming books to buy.txt, but you have to let
    your shell know that those spaces are part of the filename. Your shell usually
    sees a space as a separator between arguments. Arguments to delete books to buy.txt
    confuses the shell, as it will try to delete a file named books, then one named
    to, and finally one named buy.txt. Ultimately, you won''t delete books to buy.txt,
    and you might accidentally delete files you didn''t want remove.


    So how do you work with spaces in filenames? Or the * and ? characters, which
    you''ll learn more about in the next section? Or the " and '' characters, which
    have special meanings in your shell? You have several choices. Avoiding them,
    if at all possible. Or escape them in front of the characters, which tells the
    shell to ignore their special usage and treat them as simple characters. It can
    grow tiresome, however, making sure that \ is in its proper place all the time:


    ```

    $ rm Why\ ''\t\ I name\ files\ \*?.txt

    ```


    Yuck. A simpler method that''s a bit more onerous is to surround the filename
    with quotation marks, which function similarly to the


    ```

    $ rm "Why don''t I name files with *.txt"

    ```


    This will work, but it''s still a pain to have to use quotation marks all the
    time. A better solution is just not to use these characters in the first place.
    Table 1.1 has some characters and what to do about them.


    # Table 1.1. How to Use Special Characters in Filenames


    | Character | Advice |

    | --- | --- |

    | / | Never use. Cannot be escaped. Must be escaped. Avoid. Never use at beginning
    of file or directory name. |


