  md: '# Part IV: Environment


    # apt-get upgrade


    A Linux system has several software packages on it, and it''s a sure bet that
    at least one of those is upgraded by its maintainer every day. With apt, it''s
    quite simple to keep your system up-to-date. The process looks like this (remember,
    this command must be run as root):


    ```

    # apt-get update

    Get:1 http://archive.ubuntu.com breezy Release.gpg [189B]

    Get:2 http://archive.ubuntu.com breezy Release.gpg [189B]

    \NHit http://ftp.ubuntu.com/breezy Sources\NHit http://ftp.ubuntu.com/breezy/non-free
    Sources

    Fetched 14KB in 1ms (217KB/s)

    Reading package lists... Done

    [Results truncated for length]

    # apt-get upgrade

    Reading package lists... Done

    Building dependency tree... Done

    The following packages have been kept back:

    koffee

    The following packages will be upgraded:

    kalzium kamangar karbon kbruch kmart kcoloridit kgraphics

    degraphics-kfile-plugins

    ```


    53 upgraded, 0 newly installed, 0 to remove and 1 not upgraded.

    Need to get 58.3MB of archives.

    After unpacking 28.7KB of additional disk space will be used.

    Do you want to continue [Y/n]?


    Let''s look at what was going on here. Once again, you want to run apt-get update
    first so your computer is in sync with your repositories. apt-get upgrade looks
    for any differences between what you have installed and what''s available on the
    repositories. If difference exists, apt shows you a list of all the packages it
    would like to download and install on your computer. Of course, the actual list
    of packages varies depending on how up-to-date your system is. In this case, enough
    time had passed that there were 53 packages to upgrade.


    If you type y, apt downloads the 53 packages to /var/apt/cache/archives and then
    installs them after they''re all on your machine. If you don''t want to go through
    the upgrade, just type n instead.


    That''s enough, the most efficient way to use apt to update your Linux box is
    to just join the commands together:


    ```

    # apt-get update && apt-get upgrade

    ```


    The & makes sure that apt-get upgrade doesn''t run unless apt-get update finishes
    without errors. Better yet, make an alias for that command in your .bash_aliases
    file, as discussed in the "Create a New Alias" section of Chapter 11, "Your Shell".


    ```

    alias upgrade=''apt-get update && apt-get upgrade''

    ```


    Reload your .bash_aliases file, and now you just need to type in upgrade, press
    Enter, press Y to accept any new packages, and you''re done. Windows Update, eat
    your heart out!


    # Part IV: Environment'
