    # Chapter 14. Connectivity


    Networking has been part of Linux since the OS''s beginning as a humble kernel
    hacked on by a small group of programmers, and it''s completely central to what
    makes Linux great. Linux networking most of the time just works, providing you
    with a rock-solid connection that can be endlessly tweaked and tuned to meet your
    exact needs.


    This chapter is all about testing, measuring, and managing your networking devices
    and connections. When things are working correctlyand for the vast majority of
    the time you use the tools to monitor your system''s network connections; should
    you experience problems, this chapter will help you resolve some of the most irresome.


    Tip


    The information in this chapter assumes that you are using IPv4 addressing, in
    the format of xxx.xxx.xxx.xxx. IPv6 will eventually replace IPv4, but that''s
    still a while in the future. At that time, route and the other commands you''ll
    examining will change. For now, the information in this chapter is what you need.
    For more on IPv6, see Wikipedia''s "IPv6" (http://en.wikipedia.org/wiki/IPv6).


    # View the Status of Your Network Interfaces


    ```

    ifconfig

    ```


    Everything in this chapter depends on your network connection. At the end of this
    chapter, in "Troubleshooting Network Problems," you''re going to learn ways to
    fix problems with your network connection. Here, let''s find out what network
    connections you have in place and their status.


    To get a quick look at all of your network devices, whether they''re running or
    not, use ifconfig (which stands for interface configuration) with the -a (for
    all option). Here''s what you might see on a laptop (note that some distributions
    return to log on as to use ifconfig:


    ```

    $ ifconfig -a

    eth0 Link:Ethernet HWaddr:00:14:6C:06:6B:8FD

    inet addr:192.168.0.101 Bcast:192.168.0.255 Mask:255.255.255.250

    inet6: fe80::214:6ff:fe06:6bd/64 Scope:Link

    UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1

    ```


