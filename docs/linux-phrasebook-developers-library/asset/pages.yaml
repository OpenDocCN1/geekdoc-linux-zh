    ```

    $ man -f ls

    ls (1) - list directory contents

    $ whatis ls

    ls (1) - list directory contents

    ```


    The whatis command also supports regular expressions and wildcards. To search
    the man database using wildcards, we use the -w (or --wildcard).


    ```

    $ whatis -w *

    ls (1) - list directory contents

    lsb (8) - Linux Standard Base support for Debian

    lshal (1) - list devices and their properties

    ishw (1) - list hardware

    iskat (6) - Lieutenant Skat game for KDE

    (Listing condensed due to length)

    ```


    Using wildcards might result in a slightly slower search than whatis without options,
    but it''s pretty negligible on today''s fast machines, you probably won''t have
    to worry about it.


    Regular expressions can be used with the -r (or --regex) option.


    ```

    $ whatis -r ^*

    rm (1) - remove files or directories

    mail (8) - handle remote mail received via uucp

    rmdir (1) - remove empty directories

    rmt (8) - remote magtape protocol module

    ```


    Tip


    There''s not enough room in this book to cover regular expressions, but you can
