    # View Text Files a Screen at a Time


    less file


    The cat command is useful, but if you''re trying to read a long file, it''s not
    useful at all because text just flows past in an unending, unreadable stream.
    If you''re interested in viewing a long file on the command line (and by "long,"
    think more than a page or two), you don''t want cat; you want less.


    The less command is an example of a page, a program that displays files one page
    at a time. Others are more, pg, and most; in fact, less was released in 1985 as
    an improved more, proving once again that less is more!


    Opening a file with less an enormous one like Milton''s Paradise Lost couldn''t
    be easier:


    ```

    $ less Paradise_Lost.txt

    ```


    The less command takes over your entire screen, so you have to navigate within
    less using your keyboard, and you have to quit less to get back to the command
    line. To navigate inside less, use the keys in Table 5.1:


    | Table 5.1. Key Commands for less |

    | Key Command | Action |

    | PageDn, e, or spacebar | Forward one page |

    | PageUp or b | Back one page |

    | Return, e, j, or down arrow | Forward one line |

    | y, k, or up arrow | Back one line |

    | G or p | Forward to end of file |

    | IG | Back to beginning of file |


