  md: '# Part II: Working with Files


    Let''s say you have three Alice, Bob, and Carolwho are all members of the admins
    group. Alice''s username is alice, and her primary group is also alice, an extremely
    common occurrence on Linux systems. Bob and Carol follow the same pattern, with
    their usernames and primary groups being, respectively, bob and carol. If Alice
    creates a file in a directory shared by the admins group, the owner and group
    for that file is alice, which means the other members of the admins group are
    unable to write to it. Sure, Alice can run chord (chown admins document) after
    she creates a new file, which grows incredibly tediously.


    If the shared directory is set to sgid, however, any new file created in that
    directory is still owned by the who created it, but in this case, admins. The
    result is, Bob and Carol can also read and edit any files in that shared directory,
    with a minimum of tedium.


    Surprisingly, you can set sgid with either letters or numbers. Using letters,
    sgid is just like suid, except that a is used. Let''s look at sgid applied to
    a directory, but keep in mind that the same process is used on file.


    ```

    $ ls -lf

    drwxr-xr-x 11 admins ... /bin/

    $ chmod g+s bin

    $ ls -lf

    drwxr-xr-x 11 admins ... /bin/

    ```


    # Note


    You might see both s and an S to indicate that sgid is set. You see an s if the
    group already had execute permissions (x) before you set sgid, and an S if the
    group didn''t have execute set before sgid was put in place. The end result is
    the same, but the capitalization tells you what was in place originally.


    Removing sgid is pretty much the opposite of adding it.


    ```

    $ ls -lf

    drwxr-xr-x 11 admins ... /bin/

    $ chmod g-s bin

