    # Chapter 9. Finding Stuff: Easy


    Every year, hard drives get bigger and cheaper, with all the technical toys we
    have in our lives nowadays video, cameras, MP3 players, as well as movies and
    music we find on the Netwe certainly have plenty of stuff to fill those hard drives.
    Every digital pack rat has to pay the price, however, and that too often tends
    to be an inability to find the stuff you want. It can be hard to find that photo
    of your brother in the midst of 10,000 other pictures, or that paper you wrote
    when you have to dig through 600 other documents. Fortunately, Linux has powerful
    tools at your disposal that can help make retrieving a necessary file a quick
    and efficient activity.


    # Search a Database of Filenames


    locate


    Know the name of a file, or even part of the name, but don''t know where it resides
    on your system? That''s what `locate` is for. The `locate` command looks for files,
    programs, and directories matching your search term. Any matching results are
    printed to your terminal, one after the other.


    Note


    In order to save space, I''ve replaced the first part of the path - /home/scott
    - with ellipses.


    ```

    $ locate haggard\.../txt/rider_haggard

