  md: '# Part V: Networking


    To get more information about the Master, use nmblookup with the -S (or --status)
    option, which returns the SMB master hosts uses.


    ```

    $ nmblookup -SA 192.168.1.151

    querying 192.168.1.151 on 192.168.1.255

    name_query failed to find name 192.168.1.151

    ```


    That didn''t work because -S expects a NetBIOS name instead of an IP address.
    Unfortunately, you don''t know the machine''s NetBIOS name, only its IP address.
    That''s not a problem. You simply add the -A (or --lookup-by-ip) option, which
    tells nmblookup that you''re giving it an IP address instead of NetBIOS name.


    ```

    $ nmblookup -SA 192.168.1.151

    Looking up status of 192.168.1.151

    JANSMAC <00> B <ACTIVE>

    JANSMAC <03> B <ACTIVE>

    JANSMAC <20> B <ACTIVE>

    ..MSBROWSE_ <01> <GROUP> B <ACTIVE>

    MILTON <00> <GROUP> B <ACTIVE>

    MILTON <1d> B <ACTIVE>

    MILTON <1e> <GROUP> B <ACTIVE>

    ```


    MAC Address = 00-00-00-00-00-00


    Now you know that the 192.168.1.151 identifies itself as JANSMAC (it must be a
    Mac OS box) and is the Master for the MILTON workgroup. What about the other IP
    address?


    ```

    $ nmblookup -SA 192.168.1.104

    Looking up status of 192.168.1.104

    ELIOT <00> B <ACTIVE>

    ELIOT <03> B <ACTIVE>

    ELIOT <20> B <ACTIVE>

    ..MSBROWSE_ <01> <GROUP> B <ACTIVE>

    TURING <00> <GROUP> B <ACTIVE>

    TURING <1d> B <ACTIVE>

    TURING <1e> <GROUP> B <ACTIVE>

    ```


    MAC Address = 00-00-00-00-00-00


    The computer found at 192.168.1.104 has a NetBIOS name of ELIOT, and is the Master
    for the TURING workgroup. You actually have nothing to worry about, as the two
    machines are a Master for a separate Workgroup. Machines that self-identify as
    MILTON look to JANSMAC for information, while those that consider themselves part
    of TURING use ELIOT for the same purpose.


    Note


    For more information about what the output in these examples means, http://support.microsoft.com/kb/q163409/
    in Microsoft''s Knowledge Base.


