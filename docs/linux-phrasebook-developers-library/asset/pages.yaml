    and some have close to 20. If you click on the link to a directory, you get a
    web page that lists the files in that directory like:


    ```

    [BACK] Parent Directory      19-May-2002 01:03    -

    [SND]1944-12-24_532.mp3   06-Jul-2002 13:54    6.0M

    [SND]1944-12-31_533.mp3   06-Jul-2002 14:28    6.5M

    [SND]1945-01-07_534.mp3   06-Jul-2002 20:05    6.8M

    ```


    [SND] is a GIF image of musical notes that shows in front of every file listing.


    So the question is, how you download all of these MP3s that have different filenames
    and exist in different directories? The answer is wget!


    Start by creating a directory on your computer which you will download the MP3
    files.


    ```

    $ mkdir radio_mp3

    ```


    Now use the cd to get into that directory, and then run wget:


    ```

    $ cd radio_mp3

    $ wget -r -12 -w 5 -A.mp3 -temp0281.html. http://www.oldtimeradioarchives.com/mp3/

    ```


    Let''s walk this command and its options.


    wget is the command you''re running, of course, and at the far end is the URL
    that you want to use: http://www.oldtimeradioarchives.com/mp3. The important stuff,
    though, lies in between the command and the URL.


    The -r (or --recursive) option for wget follows and goes down directories of search
    by telling wget that it is to act recursively, you ensure that wget goes through
    every season''s directory, grabbing all the MP3s it finds.


    The -12 (or --level=#) option is important tricky. It tells wget how deep to go
    in retrieving files recursively. The level stands for level and the depth to which
    wget should descend. If you specified one level wget would look in the /mp3 directory
    only. That would result in a download of nothing. Remember, the /mp3 directory
    contains that the MP3 you want. By specifying -2, you''re asking wget to fetch
    first /mp3 (which would be one level), and then go into season_# directory in
    turn and grab anything in it. You need to be very careful with the level you specify.
    If you aren''t careful, you can easily pull your hard drive in very little time.


