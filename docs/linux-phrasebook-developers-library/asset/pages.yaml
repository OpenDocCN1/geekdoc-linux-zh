    Part IV: Environment


    Now you understand why you need to be careful typing passwords and other sensitive
    information on the command line: Anyone who can view your .bash_history file is
    able to see those passwords. Be careful and think about what you enter directly
    on the command line!


    # Run the Last Command Again


    !!


    If you want to run the last command you a second time, enter two exclamation points.
    That looks in the history file and runs the last command in the list.


    ```

    $ pwd

    /home/scott

    $ !!

    pwd

    /home/scott

    ```


    Notice that you first see the actual command that''s going to run, and then the
    results of that command. This is a truly useful way to have your computer do tedious
    work for you.


    # Run a Previous Command Using Numbers


    ! [##]


    When you run history, it automatically places a number in front of every previous
    command. If you''d to run a previous command you know the number that history
    has assigned to it, just enter an exclamation point immediately followed by that
    command''s history number, and it will run again.


    ```

    $ pwd

    /home/scott

    $ whoami

    scott

    $ !499

    pwd

    /home/scott

    ```


    If you''re unsure about the number, run history again to find out. Be aware that
    the pwd command in this example was number 499 the first time, but after I ran
    it using !499, it became 498 because it was pushed down on the list by my new
    command.


