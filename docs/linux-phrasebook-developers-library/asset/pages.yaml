  md: '# Part II: Working with Files


    You know all your printers, thanks to running lpstat -p, but which one is the
    default? As you''re going to see soon, you can send a print job to a specific
    printer, or you can quickly send it to your default printer. To find out which
    printer is the default, use the lpstat command with the -d (for default) option.


    ```

    $ lpstat -d

    system default destination: bro

    ```


    Of course, if you only have one printer connected to your computer, you probably
    don''t need to run this command. But for laptop users who move around different
    locations and who print to different printers, this command is essential.


    # Find Out How Your Printers Are Connected


    ```

    lpstat -s

    ```


    Laptop users find this next command particularly helpful, as it tells them how
    they access the printers available to them. When you first set up a printer, you
    must specify how to connect to it. You have several choices:


    +   * Local (parallel, serial, or USB)

    * Remote LPD queue

    * SMB shared printer (Windows)

    * Network printer (TCP)

    * Remote CUPS server (IPP/HTTP)

    * Network printer with IPP (IPP/HTTP)


    To find out what printers are configured for your computer and how you connect
    to them, use lpstat with the -s option.


    ```

    $ lpstat -s

    system default destination: bro

    device for bro: socket://192.168.0.160:9100

    device for bro_wk: socket://192.168.1.110:9100

    device for wu: socket://128.252.93.10:9100

    ```


    In this case, every printer is a network printer, so it uses socket:, followed
    by the printer''s IP address and its port (9100 is standard for most networked
    printers, although you might see port 35 used as well). That''s pretty easy, but
    it can quickly get more complicated.


    Although CUPS is user-friendly in many areas, it''s famously obtuse when it comes
    to the Uniform Resource Indicators


