    .../txt/rider_haggard/Allan_and_the_Ice-Gods.txt

    .../txt/rider_haggard/Neu-Heur_Or_the_Monster.txt

    ```


    Your searches show up quite quickly `locate` is not searching your system in real
    time. Imagine automatically updated daily (more about that in "Update the Database
    Used by locate" later in this chapter). Because `locate` searches a precreated
    database, its results almost instantaneously.


    On your computer, you''re probably using `locate` instead of `locate` you''re
    not aware of it. The `locate` command (which stands for secure locate) is a more
    recent version that won''t search directories that the running `locate` doesn''t
    have permission to view (for instance, if you''re not root,


