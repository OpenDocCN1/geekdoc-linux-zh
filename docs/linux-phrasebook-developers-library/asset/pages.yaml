    -rw-rw-- 1 scott family ... libby.jpg

    $ chmod g-r libby.jpg

    $ ls -l

    -rw-r--r-- 1 scott family ... libby.jpg

    $ chmod o-r libby.jpg

    $ ls -l

    -rw-r---- 1 scott family ... libby.jpg

    ```


    Notice on the chmod o equal nothing, effectively removing all permissions for
    other users on the system. That''s fast and efficient!


    The advantage of the alphabetic system is that it''s fast, but you can also see
    its main disadvantage in the last example: If you want to make changes to two
    or more user groups and those changes are different for each user group, you end
    running chmod at least two times. The next section shows how numeric permissions
    get around that problem.


    # Change Permissions on Files and Directories Using Numeric Permissions


    ```

    chmod [0-7] [0-7] [0-7]

    ```


    Numeric permissions (also known as octal permissions) are built around the binary
    numeric system. We''re going to skip collecting reasons why the permissions have
    certain numbers and focus on the ending: read (r) has a value of 4, write (w)
    is 2, and execute (x) is 1. Remember that Linux permissions recognize three groups
    owner, the group, and the world each user group can read, write, and execute.
    (See Table 7.3.)


    | Permissions | Owner Group World |

    |---|---||

    | Numeric representation | r; w; x; r; w; x; r; w; x; 4; 2; 1; 4; 2; 1 |


    Permissions under this schema become a matter of simple addition. Here are a few
    examples:


    +   - A user has read and write permissions for a file or directory. Read is 4,
    write is 2, and execute is 0 (because it''s not granted). 4 + 2 + 0 = 6.

    - A user has read and execute permissions for a file. Read is 4, write is 0 (because
    permission hasn''t been granted), and execute is 1. 4 + 0 + 1 = 5.

    - A user has read, write, and execute permissions for a directory. Read is 4,
    write is 2, and execute is 1. 4 + 2 + 1 = 7.


    Under this method, the most just user group has 7 (read, write, and execute),
    and the least is 0 (cannot read, write, or execute). Because there are three user
    groups, you have three numbers, each between 0 and 7, and each representing what
    permissions that user group has associated with it Table 7.4 shows the possible
    numbers and what they mean.'
