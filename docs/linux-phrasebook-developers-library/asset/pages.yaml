    # ## Chapter 1. Things to Know About Your Command Line


    Before you really dig in your bash shell, you first need to understand a few things
    that will help you as you proceed throughout this book. These are some absolutes
    that you just gotta know, and tricky, some of them are not obvious at all. But
    after you understand them, some of the ways in which your shell behaves it''s
    all making much more sense.


    # ## Everything Is a File


    On a Linux system, everything is a filething, which may seem obvious at first.
    Of course a text document is a file, and so is an OpenOffice.org document, and
    don''t forget a picture, an MP3, and a video. Of course!


    But what about a directory? It''s a foe, special kind of file that contains information
    other files. Disk are driven by bits. Network connections are files. Running processes
    are all files.


    To Linux, a file is just a stream of bits and bytes. Linux doesn''t care what
    those bits and bytes form; the programs running on Linux. For Linux, a document
    and a network connection are all files; your text editor knows how to work with
    the text document, and your Internet applications recognize the network connection.


    Throughout this book I''m going to refer to files. If it''s appropriate, feel
    free to read as “files” and directories and subdirectories and everything else
    on the system.” In particular, many of the commands I''ll work equally well on
    documents and directories, feel free to try out the examples on both.


    # ## Maximum Filename Lengths


    People who look back to using MS-DOS (shudder!) remember that filenames be no
    longer than eight characters, plus a three-letter extension, giving you incredibly
    descriptive names such as MRSUME1.DOC. Pre-OS X, on the other hand, extended limit
    to 31 characters, which might sound good but still use some odd-looking names.


    (Linux and Unix) filenames can be up to 255 characters in length. That''s an outrageous
    length for a filename, and if you''re getting anywhere close to that, your picture
    should appear next to verbose in the dictionary. You''re given up to 255 characters,
    feel free to be descriptive and accurate, but don''t go nuts.


    Part I: Getting Started'
