    # Caution


    The -U option is always better, except when installing a kernel. Then you want
    to use -i instead. If you upgrade with -U and the new kernel doesn''t work, you''re
    in a world of hurt. On the other hand, if you install a new kernel with -i, the
    old one is still on your machine as a backup if the new one blows up.


    # Remove Software Packages for RPM-Based Distributions


    ```

    rpm -e [package]

    ```


    Getting rid of installed RPMs is even easier than installing them. Instead of
    -Uhv to place RPMs on your computer, use -e (for erase) to remove them.


    ```

    # rpm -e nmap

    ```


    And that''s it. The -e option is silent, so there''s no output. Notice, however,
    that you install software using rpm -Uhv, you to specify the filename, rpm has
    no way to know what you want to install. When you remove software with rpm -e,
    otherwise, you specify the package name because the files used for installation
    are now long gone, and rpm knows software by the package name.


    # Install Software Packages and Dependencies for RPM-Based Distributions


    ```

    yum install [package]

    ```


    The rpm command is powerful, but after you use it for a while you''ll quickly
    run into a problem when you want to install a package that has dependencies (otherwise
    known as "dependency hell"). In order to install package A, you also need to download
    and install packages B and C, but in order to install C you also need to download
    and install packages D and, in order to install E...aaaagh!


    Debian-based distributions (that''ll read about later in this chapter) solved
    this problem years ago with the powerful and useful apt; RPM-based distributions
    can use apt, but more commonly they use the relatively new and still immature
    yum. Originally developed for the RPM-based Yellow Dog Linux distribution (hence
    the name, which stands for Yellow Dog Updater, Modified) yum is now widely used
    but still lags behind apt in features and usability. Still, that''s what''s available,
    so that''s what we''re going to cover.


