    # Change to a Different Directory


    cd


    It''s possible to list the contents of any directory simply by specifying its
    path, but often you actually want to move into a new directory. That''s where
    the `cd` command comes in, another one that is almost constantly used by shell
    aficionados.


    The `cd` command is simple to use: Just enter `cd`


    # Change to Your Home Directory


    cd ~


