    Now, what if you just wanted to see a list of the albums that Coltrane released
    in 1960? Pipe the output of ls -1 to grep, and you''ll get your answer in seconds.


    ```

    $ ls -1 | grep 1960

    1960_Coltrane_Plays_The_Blues

    1960_Coltrane''s_Sound

    1960_Giant_Steps

    1960_My_Favorite_Things

    ```


    After starting to think about it, you''d find hundreds of uses for grep in this
    way. Here is another powerful one. The ps command lists running processes, while
    the -f option tells ps to give the full listing, with lots of information about
    each process, and the -U option followed by a username, restricts the output to
    processes owned by that user. Normally ps -U scott would result in a long list,
    too if you''re looking for information about a specific process. With grep, you
    can easily restrict the output.


    Note


    To save space, some of the information you''d normally see with ps has been removed.


    ```

    $ ps -U scott | grep firefox

    scott 17623 /bin/sh /opt/firefox/firefox

    scott 17634 /opt/firefox/firefox-bin

    scott 1601 grep firefox

    ```


    The ps command lists all commands that are owned by the scott user (64, in fact),
    but pipes that output to grep, which lists only those lines that contain the word
    firefox in them. Unfortunately, the last line of output is erroneous: You only
    want to see the Actual Firefox, not the search for firefox using grep. To hide
    the search for firefox in the grep results, try this:


    ```

    $ ps -U scott | grep firefox

    scott 17623 /bin/sh /opt/firefox/firefox

    scott 17634 /opt/firefox/firefox-bin

