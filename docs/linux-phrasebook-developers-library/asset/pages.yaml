    Looking at addext and its permissions of rwxr-xr--, it suddenly clears that the
    owner (scott) can read, write, execute the file; the members of the group (root)
    can read and execute the file, but not write to it; and everyone on the machine
    (often called the “world”) can read the file but cannot write to or run it as
    a program.


    Now that you understand what permissions mean, you’ll start to notice that combinations
    seem to appear constantly. For instance, it’s common to see rw-r-- for many files,
    which means that the owner can read and write the file, but the group and world
    can only read it. For programs, you’ll see rwxr-xr-x, which allows everyone on
    the computer to run the program, but restricts changing the file to it.


    Directories, however, are a bit different. The permissions of r, w, and x are
    pretty for a file: You can read the file (or change it), execute it. But how do
