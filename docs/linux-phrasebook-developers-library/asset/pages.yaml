    You''re walking a tightrope, baby, and if you fall you go splat!


    Okay, that''s a little extreme. It''s true that the shell lacks an undo command,
    but you''re not completely hosed if you delete a file. If you stop working on
    your machine the second you realize your mistake, the operating system has overwritten
    the erased file sectors, and you can successfully use some complicated file recovery
    software, yes, it''s possible to recover files. But it''s no, you''ll be cursing
    the whole time. Better to be careful in the first place.


