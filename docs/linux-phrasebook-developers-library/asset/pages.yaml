    # Become Another User


    su command (which stands for switch user, not, as is popularly imagined, super
    user) can allow one user to temporarily act as another, but it is most often used
    when you want to quickly become root in your shell, run a command or, and then
    go back to your normal, non-root user. Think of it as Clark Kent changing into
    his Superman duties, fighting a few wrongs, and going back to his non-super self.


    Invoking su is difficult. Just enter su, followed by the user identity you want
    to assume.


    ```

