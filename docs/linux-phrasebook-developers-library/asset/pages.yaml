    --rwxr-xr-- 1 scott admins ... backup_data

    $ chmod u+s backup_data

    $ ls -l

    --rwxr-xr-- 1 scott admins ... backup_data

    ```


    Now anyone in the admins group can run the backup_data script as though they were
    the owner scott. But note that not anyone in the admins group is shut out because
    it only read permission for the program. If it was necessary for everyone on the
    system to be able to run backup_data as scott, the permissions would be --rwxr-xr-x.


    Removing suid is a matter of using u- instead of u+.


