    One of the ways to avoid downloading more than is expected to use the -np (or
    --parent) option, which prevents wget from recursing into the parent directory.
    If you look back at the listing of files, you will note that the first line is
    the parent directory. In other words, in /season_10, the parent is /mp3. It is
    same true for /season_11,/season_12, and so on. You don''t want wget to go up,
    however, you don''t want to waste time going into the same directory/mp3 whatever
    you''re in a season''s.


    This next option is required, but it would be polite of you to use it. The -w
    (or --wait=[]) option introduces a short wait between each file download. This
    helps prevent overloading the server as you continuously for files. By default,
    number is interpreted by wget as seconds; if you want, you can also specify minutes
    by adding m after the number, or with h, even with days.


    Now it gets interesting. The -A (or --accept) option specifies that you only want
    to download files of a certain type and nothing else. The A stands for, and it''s
    followed by the file suffixes that you want, with commas. Unless you only want
    one kind of file: MP3, that''s all you specify: -A.mp3.


    On the other side, the -R (or --reject) option tells wget what you want not get:
    HTML and GIF files. By refusing those, you will get little music notes represented
    by [SND] shown. Separate your list of suffixes with commas, ~temp081.html,.gif.


