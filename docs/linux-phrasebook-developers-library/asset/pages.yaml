    # Report File Space Used by a Directory


    du


    The df command tells you about your hard drive, but what if you just want to know
    how much space a directory and its contents are using? The du command (short for
    disk usage) answers that question. First you use the cd command to change directories
    to the directory in question, and then run du.


    ```

    $ cd music

    $ du

