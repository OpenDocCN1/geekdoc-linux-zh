    in the "List All Available Printers" section.


    Note


    You''ll notice that the filename has underscores instead of spaces, which makes
    it much easier to deal with the command line. If the filename has spaces in it,
    you have to use one of the following methods for referencing it:


    ```

    $ lpr -P bro_wk Lovecraft - Call of Cthulhu.txt

    ```


    or


    ```

    $ lpr -P bro_wk Lovecraft\ - \ Call\ of Cthulhu.txt

    ```


    If the filename has spaces, it''s probably easiest to use tab completion so you
    don''t have to type out the name yourself. For instance, you enter lpr -P bro_wk
    Love and then press the Tab key, allowing bash to finish the filename. For more
    on tab completion, www.slackbook.org/html/shell-bash.html#SHELL-BASH-TAB.


    # Print More Than One Copy of a File


