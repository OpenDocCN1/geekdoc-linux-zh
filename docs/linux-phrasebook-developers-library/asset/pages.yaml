    # Chapter 11. Your Shell


    So far in this book you''ve been running commands in your bash shellout which
    you haven''t focused on the shell itself. In this chapter, you look at two commands
    that affect your use of the shell: history, which lists everything you''ve entered
    on the command line, alias, which allows you to create shortcuts for commands.
    Both are useful, and can save you lots of time when you''re using the command
    line. Laziness is a good thing when it comes to computer users, and these are
    definitely two commands that will help you be as lazy as possible when using your
    Linux box.


    # View Your Command-Line History


    history


    Every time you type a command in your shell, that command is saved in a file named
    .bash_history in your home directory (the dot in front of the filename means that
    it''s hidden unless you use ls -a). By default, that file holds the last 500 lines
    entered on the command line. If you want to view that list of commands, just enter
    the history command.


    ```

    $ history

    496 ls

    497 cd rsync-ssh

    498 ls

    499 cat linux

    500 exit

    ```


    Because you''re looking at 500 results, they''re going to stream by so fast that
    you can''t see any until you get the end. Wait to step through the results one
    screen at a time? Turn to your old friend less:


    ```

    $ history | less

    ```


    Now you can jump through your results much more easily.


    Caution'
