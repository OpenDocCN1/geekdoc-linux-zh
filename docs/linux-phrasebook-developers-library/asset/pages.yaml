    # Change the Owner of Files and Directories


    chown


    Changing a file''s group is important, but it''s far more likely that you''ll
    change owners. To change groups, use chgrp; to change owners, use chown.


    ```

    $ ls -l

    -rw-r-- 1 scott libby_arrowrock.jpg

    -rw-r-- 1 scott family ... libby.jpg

    -rw-r-- 1 scott scott ... libby_on_couch.jpg

    $ chown denise libby.jpg

    $ ls -l

    -rw-r-- 1 scott libby_arrowrock.jpg

    -rw-r-- 1 denise family ... libby.jpg

    -rw-r-- 1 scott scott ... libby_on_couch.jpg

    ```


    Some of the points previously made about chgrp "Change the Group Owning Files
    and Directories" apply to chown. The chgrp command uses either user name or numeric
    ID. The numeric ID for users can be seen by running cat /etc/passwd, which gives
    you something like this:


    ```

    bind:x:110:118:/var/cache/bind:/bin/false

    scott:x:1001:101:scott,,,:/home/scott:/bin/bash

    top:x:120:120::/var/lib/ntop:/bin/false

    ```


    The first number you see is the numeric ID for that user (the second number is
    the numeric ID for the main group associated with the user).


    Also, you can change the owner of a file if you are the current owner (or root,
    of course). That shouldn''t surprise you, but is good to remember nonetheless.


    Caution


    If you use chown -R scott *, you do not change any of the dot files in the directory.
    However, chown -R scott .* should not be used. It changes all the dot files in
    the current directory, but . also matches .., so all the files in the parent directory
    are also changed, which is probably not what you want.


