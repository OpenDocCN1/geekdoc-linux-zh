    or replacing the rm to a command trash (www.comwt.com/open_source/projects/trashcan/);
    to adding a trash can onto the shell (http://pages.stern.nyu.edu/~marriaga/software/libtrash/);
    to creating a new command, trash, trash, to replace rm (www.unimelb.edu.au/~jltooker/shell.html#trash).


    If, on the other hand, you want to make sure that no one can recover your deleted
    files, even in black working for shady U.S. government agencies, use the shred
    command instead of rm. The shred command overwrites the file 25 times so it is
    impossible to re-create it. Before using shred, however, read its man page, as
    its success rate is highly dependent on the type of filesystem you''re using.


