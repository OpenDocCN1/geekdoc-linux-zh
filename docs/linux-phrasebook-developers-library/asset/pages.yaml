  md: '# Chapter 10. The find Command


    In the last chapter, we covered commands that you search for files (locate) and
    data within files (grep). The third command in the powerful triumvirate is find.
    While locate searches a database for files, which makes it fast but dependent
    on a constantly updated database, find searches for files on the fly using criteria
    that you specify. Since find has to parse your file structure, it''s much slower
    than locate, but you can find things that aren''t possible with locate.


    Throughout this chapter, we look for files on an external hard drive that contains
    music mounted /media/music. You can see that find allows us to slice and dice
    the files in a variety of ways.


    # Find Files by Name


    ```

    find -name

    ```


    find is basically used to look for files by name, or part of a name (hence the
    -name option). By default, find is automatically recursive and searches down a
    directory structure. Let''s look for all MP3 files sung by the unique band of
    the Shaggs on their music drive:


    ```

    $ cd /media/music

    $ find .name Shaggs

    ./Outs/Shaggs

    ```


    What can''t be correct! The find command found the folder, not the songs. Why?
    Because we didn''t use wildcards, find looked for files specifically named "Shaggs".
    There is only one item with that precise name: the folder that contains the songs.
    (Since a folder is a special kind of file, it''s counted!)


    We need to use wildcards, but in order to prevent the shell from interpreting
    the wildcards in ways we don''t, we intend to surround what we''re searching for
    with quotation marks. Let''s try the search again with our improvements:


    ```

    $ find -name **Shaggs**"

