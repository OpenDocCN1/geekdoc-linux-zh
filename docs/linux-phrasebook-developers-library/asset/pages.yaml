    # Install Software Packages for RPM-Based Distributions


    ```

    rpm -ivh [package]

    rpm -Uhv [package]

    ```


    The RPM command installs software installers that end in .rpm, which seems logical.
    To install an RPM package, you need to download it. Let''s use the industry-standard
    open-source network scanner nmap as our example. You can download the RPM package
    for nmap from www.insecurity.com/nmap/download.html; if it''s on your system,
    you simply run rpm along three options: -i (for install), -h (to show marks so
    you can watch the progress of the install), and -v (be verbose and tell what you''re
    doing). The command, which must be run, so would it look like this:


    ```

    # rpm -ihv nmap-4.01-1.i386.rpm

    ```


    This is actually the command you should run, however. A better choice is -Uhv,
    where -U stands for upgrade. Why is -U better than -i? Because i only installs,
    -U upgrades and installs. If a package already exists on your system and you''re
    trying to put a newer one on the system, -U performs an upgrade; if a package
    doesn''t already exist on your system, -U notices and installs it instead. Therefore,
    use -U all the time, and it won''t matter whether you''re upgrading or installing--U
    does what needs to be done, and you don''t need to worry about it.


    ```

    # rpm -Uhv nmap-4.01-1.i386.rpm

    Preparing... ########################### [100%]

    1:nmap ################################# [100%]

    ```


    If you want to install more than one RPM, just list them separated by spaces,
    one after the other:


    ```

    # rpm -Uhv nmap-4.01-1.i386.rpm nmap-frontend-4.01-1.386.rpm

    ```


    You can use wildcards if you have many RPMs to install. For instance, if you have
    20 .rpm files in a subdirectory named software, run this command to install them
    all:


    # Part IV: Environment'
