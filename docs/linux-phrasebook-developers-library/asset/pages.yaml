    # Troubleshooting Network Problems


    Linux nowadays usually "just work" when it comes to networking, but you might
    still experience an issue. Here are some basic tips for troubleshooting network


    If your network interface fails to run and binding, can you get on the Internet,
    first try ping your localhost device, at 127.0.0.1. If that doesn''t work, stop
    and go no further, because you have a seriously damaged system. If it works, ping
    your machine''s external IP address. If that doesn''t work, make sure networking
    is enabled on your machine. If it works, try ping other machines on your network,
    assuming you have any. If you''re not sure, it''s interface (assuming your router
    is okay). Make sure that your cables are plugged in (seriously). Use ifconfig
    (or ifconfig if''s) to verify the status of your interface and ifup to turn the
    interface on, if necessary. Then ping again.


    If you attempt to ping another computer local was successful, try pinging your
    router. If you can get to other machines on your network, but you can''t get to
    router, time to check your routing tables with route as detailed in "Display Your
    IP Routing Table". If you''re missing items from your routing table, add them,
    as in "Change Your IP Routing Table."


    It''s much easier to diagnose and fix problems if you have a baseline from what
    to work. After you know a machine''s networking is correct, run route and save
    the results, if you have a stored blueprint of the routing table goes bonkers
    and you need to restore something later.


    If you get to your router, pinging a machine you will be up and running on the
    Internet, like www.google.com or www.apple.com. If that doesn''t work, try ping
    that machine''s IP address. That means that you need to have some IP addresses
    on a sticky note or in a text file for your computer for just such an occasion
    as this. Here are a few that good right now; of course, change, so you really
