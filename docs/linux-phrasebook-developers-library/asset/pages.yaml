    seconds. After that, if you provide a five-digit year again. in 9212310000 is
    within the range of 6999, so touch assumes you mean 19 as the base century, while
    in 340501720324 lies between 0 and 68, so 20 is used as the base. The last time
    touch used, a year isn''t specified at all, just a month (10), a day (19), an
