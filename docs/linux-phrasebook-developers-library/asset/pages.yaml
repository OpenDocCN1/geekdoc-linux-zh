    $ ls -l

    -rw-r--r-- scott scott 224425 paradise_lost.txt.gz

    $ gunzip -c paradise_lost.txt.gz > paradise_lost.txt

    $ ls -l

    -rw-r--r-- scott scott 508925 paradise_lost.txt

