    # Troubleshoot Problems with apt


    Of course, as great apt is, you might run into problems. Here are some problems
    and their workarounds.


    One simple problem that will result in a mistake to your own overhead the "Could
    not open lock file" error. You''ll try to run apt-get, instead of working, you
    get this error message:


    ```

    E: Could not open lock file /var/lib/dpkg/lock - open (13 Permission denied)

    E: Unable to lock the administration directory (/var/lib/dpkg/), are you root?

    ```


    The solution to this issue is right there in the second line: You''re not logged
    in root! Simply log in root and try again, and everything should work.


    Note


    If you''re running K/Ubuntu, or any other distribution that uses sudo instead
    of root, the error means that you didn''t preface the command with sudo. In other
    words, you ran this:


    ```

    $ apt-get upgrade

    ```


    You''re seeing the error message because you should run this instead:


    ```

    $ sudo apt-get upgrade

    ```


    The next common issue occurs when apt complains about broken dependencies. You''ll
    know this one''s happening when apt encourages you to run apt-get -f install.
    This suggestion is the program''s way of telling you that your system has broken
    dependencies that prevent apt finishing its job.


    There are a couple of possible solutions. You can follow apt''s advice, and run
    apt-get -f install, which tries to fix the problem by downloading and installing
    the necessary packages. Normally, this solves the problem, and you can move on.


    If you don''t want to do that, you can try running apt-get -f remove, which tries
    to fix the problem by removing packages that apt deems troublesome. These might
    sound like potentially dangerous


