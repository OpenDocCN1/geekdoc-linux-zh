    # Move and Rename Files


    mv


    So cp files. That seems simple enough, but what about moving files? In the similar
    vein of removing unnecessary vowels in commands, we have the mv command, short
    for move.


    You''re going to quickly notice that most of the options you learned for cp are
    quite similar to those used by mv. This shouldn''t surprise you; after all, mv
    performs a cp -a, and then moves the file it''s successfully copied.


    At simplest, mv moves a file from one location to another on your file


    ```

    $ pwd

    ~/home/scott/libby

    $ ls

    libby_arrowrock.jpg libby_bak.jpg libby.jpg libby_on_couch.jpg on_floor

    $ ls ~/pictures/dogs

    libby_on_floor_01.jpg libby_on_floor_03.jpg

    libby_on_floor_02.jpg libby_on_floor_04.jpg

    $ mv ~/pictures/dogs/libby_on_floor_04.jpg libby_on_floor_04.jpg

    $ ls

    libby_arrowrock.jpg libby.jpg libby_on_floor_04.jpg

    libby_bak.jpg libby_on_couch.jpg on_floor

    $ ls ~/pictures/dogs

    libby_on_floor_01.jpg libby_on_floor_02.jpg libby_on_floor_03.jpg

    ```


    Just as you did with cp, you can use a dot to represent the current directory
    if you don''t feel like typing out the filename.


    ```

    $ pwd

    ~/home/scott/libby

    $ ls

    arrowrock.jpg libby.jpg on_couch.jpg on_floor

    $ ls ~/pictures/dogs

    on_floor_01.jpg on_floor_03.jpg

    on_floor_02.jpg on_floor_04.jpg

    $ mv ~/pictures/dogs/on_floor_04.jpg .

    $ ls

    arrowrock.jpg on_couch.jpg on_floor_04.jpg

    libby.jpg on_floor

    $ ls ~/pictures/dogs

    on_floor_01.jpg on_floor_02.jpg on_floor_03.jpg

    ```


    If you''re moving a file into a directory and you want to keep the same filename,
    you just need to specify the directory. The filename stays same.


    ```

    $ pwd

    ```


