    # Securely Transfer and Back Up Files


    ```

    rsync -v

    ```


    rsync is one of the coolest, useful programs ever invented, and many people rely
    on it every day (like me!). What does it do? Its uses are myriad (we go again
    again into "you could write a book about this!"), but let''s focus on one powerful
    feature: its capability to back up files effectively and securely, with a minimum
    of network traffic.


    Let''s say you intend to back up 2GB of files every night from a machine named
    colidge(user: will). Without rsync, you''re looking at a transfer of 2GB every
    single night, substantial amount of traffic, even a fast network connection. With
    rsync, you might be looking at a transfer that will take a few moments at most.
    Why? Because rsync backs those 2GB, it transfers the differences between all the
    files that make up 2GB of data. If only a few hundred megabytes changed in the
    past 24 hours, that''s what rsync transfers. If it was 100MB, that''s what rsync
    copies over. Either way, it is much less than 2GB.


