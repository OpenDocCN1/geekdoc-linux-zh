    [list truncated for length]


    The other point to make about chgrp involves security: You can change permissions
    for a group if you are a member of that group. In other words, Scott, Alice, and
    Bob can use chgrp to make admins a group for a file or directory, but Carol cannot
    because she''s not a member of admins.


    # Recursively Change the Group Owning a Directory


    chgrp -R


    Of course, you might not want to change the group of just one file or directory.
    If you want to change the group of several files in a directory, you can use a
    wildcard. To change the contents of a directory and everything in it, use the
    -R (or --recursive) option.


    ```

    $ pwd

    /home/scott/pictures/libby

    $ ls -F

    by_pool/ libby_arrowrock.jpg libby.jpg on_floor/

    $ ls -l *

    -rw-r--r- 1 scott ... libby_arrowrock.jpg

    -rw-r--r- 1 scott ... libby.jpg

