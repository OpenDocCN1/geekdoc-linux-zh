  md: 'Part II: Working with Files


    # List Print Jobs


    lpq


    If you have several jobs queued up to print, you might want to see that list.
    Perhaps you want to cancel or more of the jobs (more on how to do that, in the
    next few sections), you want to find out why a job is taking so long to print,
    or maybe you want to know how many print jobs are in line. The lpq command (as
    "lp queue") lists all jobs currently printing on the default printer.


    ```

    $ lpq

    bro is ready and printing

    Rank Owner Job File(s) Total Size

    active scott 489 Lovecraft__-_Call_of_C 108544 bytes

    ```


    If you want to list the status of print queues for all printers, not your default,
    simply append -a (as in all) after lpq:


    ```

    $ lpq -a

    Rank Owner Job File(s) Total Size

    active scott 489 Lovecraft__-_Call_of_C 108544 bytes

    lst scott 490 ERB__-_A Princess_of_M 52488 bytes

    ```


    Keep in mind two things. First, the listing provided by lpq -a is cut off, so
    the filenames are actually Lovecraft__-_Call_of_Cthulhu.txt and ERB__-_A Princess_of_Mars.txt,
    you don''t see the entire name because lpq shows a certain number of characters.


    Second, and this is very important, lpq is not showing all the print jobs the
    printer knows about, only those that your machine knows. From the printer''s perspective,
    the print queue might look like this:


    +   * Lovecraft__-_Call_of_Cthulhu.txt

    * Doyle__-_The_Lost_World.txt

    * ERB__-_A Princess_of_Mars.txt


    To find out the actual queue on the printer, you have to use whatever management
    utilities come with that device, which is far beyond the scope of this book.


