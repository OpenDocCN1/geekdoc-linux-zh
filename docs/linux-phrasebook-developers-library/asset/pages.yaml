    # Conclusion


    Permissions are vitally important for the security and sanity of a Linux system,
    and they can seem overwhelming at first. With a bit of thought and learning, it''s
    possible to get a good handle on Linux permissions and use them to your advantage.
    The combination of chgrp change group ownership, chown change user ownership (and
    group ownership as), and the powerful chmod gives a Linux user a wealth of tools
    at their disposal that enable her to set permissions in a powerful, effective
    way.


    # Chapter 8. Archiving and Compression


    Although the differences are sometimes made opaque in casual conversation, there
    is in a complete difference between archiving files and compressing them. Archiving
    means that you take 10 files and combine them into one file. If you start with
    100 KB files and archive them, the resulting single file is 1000KB. On the other
    hand, if you compress 10 files, you might find that the resulting files from only
    a few kilobytes to close the original size of 100KB, depending upon the original
    file type.


    Note


    In fact, you might end up with a bigger file during compression! If the file is
    already compressed, compressing it adds extra overhead, resulting in a slightly
    bigger file.


