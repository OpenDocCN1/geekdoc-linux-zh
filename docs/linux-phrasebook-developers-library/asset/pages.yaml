    be extremely careful about what you type. Let''s say you have a soft link named
    dogs in your home directory that points to /home/scott/pictures/dogs, and you
    just want to move the link into the /home/scott/libby subdirectory. This command
    moves just the soft link:


    ```

    $ mv dogs ~/libby

    ```


    This command, however, moves the directory to which the soft link points:


    ```

    $ mv dogs/ ~/libby

    ```


    What was the difference? A simple forward slash at the end of the soft link. No
    forward slash and you''re moving the soft link itself, and just the link; include
    a forward slash and you''re moving the directory to which the soft link is designed
    to, not the soft link. Be careful!


