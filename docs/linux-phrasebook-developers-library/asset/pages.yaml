    The -v option does a nice job of keeping you aware of the cp command''s progress.
    It does such a good job that you really don''t need to run that last ls command
    because the -v option assures you that the files you wanted were copied in fact.


    # Stop Yourself from Copying Important Files


    ```

    cp -i

    ```


    The previous example demonstrates something important about cp that you need to
    know. In the "Copy Files Using Wildcards" example, you copied three libby_on_floor
    pictures into the libby directory; in the previous example, you copied the same
    libby_on_floor images into the libby directory again. You have copied files that
    already exist, but cp didn''t warn you, how Linux works: It does not know what
    you''re doing, so it won''t warn you you are overwriting your files unless you
    ask it to do so. You should be warned before overwriting a file using the cp command,
    use the -i option (or --interactive). If you tried once to copy the same files
    using the -i option this time, you''d get a different result.


    ```

    $pwd

    /home/scott/libby

