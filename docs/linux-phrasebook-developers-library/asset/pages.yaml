  md: '# 4


    # Part III: Finding Stuff


    This is far more manageable, and might be all you need. Don''t let locate just
    pew a flood of results at; instead, take control of the locate command''s output
    and use it to your favor.


    # Update the Database Used by locate


    updateddb


    The first section of this chapter that introduced locate, "Search a Database of
    Filenames," mentioned that the reason the command is so fast is because it is
    actually searching a database containing your machine''s file and directory names.
    When locate is installed, it automatically sets itself up to scan your hard drive
    and update that database, in the middle of the day. That''s for convenience, but
    not great if you need to find a file you just placed on your computer.


    For instance, if you install Rootkit Hunter, a program that looks for rootkits
    (by bad guys to take control of your Linux) and then you want to look at the files
    program has installed? The locate command won''t be able to help you because it
    doesn''t know about these files and won''t know them until its database is updated
    by updateddb. Because command indexes every file and folder on your computer,
    you''ll need to run it (or use sudo on distributions like K/Ubuntu) that discourage
    root use).


    ```

    # apt-get install rkhunter

    # exit

    $ locate rkhunter

    $ su

    $ updateddb

    # exit

    $ locate rkhunter

    /usr/local/rkhunter

    /usr/local/rkhunter/bin

    /usr/local/rkhunter/etc

    ```


    In the preceding commands, you first install rkhunter, the package name for Rootkit
    Hunter, and then exit root. Search for rkhunter, but it''s nowhere to be found.
    You become root again, run updateddb to scan your hard drive and let the locate
    know about any changes, and then exit root. Finally, for rkhunter with locate
    again, and this you''re successful.


    One thing you should be aware of: the speed with which updateddb works is directly
    proportional to the amount of stuff on your hard drive and the speed of your computer.
    Get a fast processor, a fast drive, and few files? Then updateddb will work quickly.
    Do you have a slow CPU, 5,400RPM drive, and a million files? Expect updateddb
