    # Chapter 16. Windows Networking


    Samba is one of the most important open-source projects in the world that it makes
    possible for Linux

    (and other Unix machines, which means Mac OS) to use Server Message Block (SMB),
    the networking protocol

    under Microsoft Windows machines. With Samba, Unit machines can connect to and
    mount shares on

    Windows machines, and print to shared printers to Windows machines. Unix machines
    can also set

    u Samba-based printer and file shares that Windows machines can connect to and
    use. In fact, Samba is so

    useful that you don''t even need Windows machines in the equation. You might choose
    to implement Samba

    for file and printer sharing over a network of Linux because it works so.


    Many good books cover how to set up Samba on a server, so we''re not going to
    cover administrative

    commands such as samba, smbd, or smpasswd (which, it is true, can be run by normal
    users to

    change their own passwords, but in practice is almost always run by the server
    admin), or how to

    configure samba.conf. Instead, this chapter assumes you have Samba servers on
    Windows,

    Linux, or Mac OS. You''re going going on the client end of things: how to find
    out

    these shares are, how to connect to those shares, and how to mount shares on your
    hard drive


    # Tip


    Some good books on setting up and administering Samba include


    +   * Samba Unleashed, ISBN: 0672318628; by Steve Litt

    * Teach Yourself Samba in 24 Hours, 2nd Edition, ISBN: 0672322692; by Gerald Carter

    * The Official Samba-3 HOWTO and Reference Guide at

    http://samba.org/samba/docs/man/Samba-HOWTO-Collection/ is excellent.


