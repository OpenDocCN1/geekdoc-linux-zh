    ```


    If you have read the previous section, "Securely Log In to Another Machine Without
    a Password," you might be wondering why you were prompted for a password. You''re
    correct: The preceding example was taken before a connection that didn''t require
    a password was set. After you''ve done that, you would instead see a login that
    looks like this:


    ```

