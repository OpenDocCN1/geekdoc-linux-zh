  md: '# End a Running Process


    kill


    Sometimes a program goes rogue, and it won''t react to normal attempts to close
    it. In the GUI, you click repeatedly on the Close button, but nothing happens,
    or in the shell, you press Ctrl+C but it fails to stop a running command. When
    this happens, it''s time for the kill command.


    You can use several signals with the kill command, ranging from "Please shut yourself
    down, cleaning up your mess as you do so" to "Shut yourself down as soon as you
    can" to "Die now!" You''re going to focus on the three most important. When you
    use kill, you can specify the intensity of the process''s death with a number
    or a word, as Table 12.1 shows.


    Table 12.1. Common Signals Associated with kill

    | Signal Number Word Meaning |

    | -1 | HUP (hang up) | Controlling process has died. Shut down (if applied to
    a system service, reload configuration files and restart). |

    | -15 | TERM | Terminate gracefully, cleaning up processes and files. |

    | -9 | KILL | Stop whatever you''re doing and done! |


    Normally, you should first try -15 (in fact, it''s default if you run kill without
    any option). That way, you give the program a chance to shut down any other programs
    depending upon it, files opened by it, and so on. If you''ve been patient and
    waited a "while"completely subjective, of course), and the process is still running
    out of control or still failing, you can bring out the big guns and use -9. The
    -9 option is equivalent to yanking the rug out from under a running program, and
    while it does the job, leave stray files and processes littering your system,
    that''s never a good idea.


    As for -1, or -HUP, that''s primarily for services like Samba or wireless connectivity.
    You won''t use it much, but you would know what it means.


    Here''s what you would do if grim (which normally behaves just fine; this is just
    for demonstration purposes) freeze on your system.


    ```

    $ ps U scott

    PID TID STAT TIME COMMAND

    14928 ? S 0:00 /opt/oo2/program/soffice -writer

    ```'
