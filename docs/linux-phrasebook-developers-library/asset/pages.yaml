    is running on your computer at full, and it''s using the processor. Or perhaps
    you start a running command, to find that it''s far more of your CPU cycles than
    you thought it. To find out what''s causing the problem, or if you just want to
    find out''s running on your system, you could use ps, except that ps doesn''t
    update itself. Instead, it provides a snapshot of your system''s processes, and
    that''s it.


