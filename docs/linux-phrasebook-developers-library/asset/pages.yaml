    for the existence of a pattern in a group of files. Your first use of grep was
    extremely basic, but now you need to get a bit more complex, and to do that you
    need to understand the patterns for which grep searches. Those patterns are built
    using one of the most powerful tools in the Linux toolbox: regular expressions,
    or regex. To take full advantage of grep, you really need to grok regex; however,
    regex is a book in itself, so we''re only going to cover the basics here.


    # Tip


    Want to learn more about regular expressions? If you search the Internet, and
    you''ll find quite bit of great stuff there, Sams Teach Yourself Regular Expressions
    in 10 Minutes (by Ben Orta; ISBN: 0672325667) is a great book that will really
    help you as you explore and learn regex.


    One that confuses new users when they start playing with grep is that the command
    has several versions, as shown in Table 9.1.


    # Table 9.1. Different Versions of grep Interpret Pattern As


    | | Command Option | Separate Command |

    |---|---|---|

    | Basic regular expression | grep -G (or --basic-regexp) | |

    | Extended regular expression | grep -E (or --extended-regexp) egrep |

    | List of fixed strings, any of which can be matched | grep -F (or --fixed-strings)
    fgrep |

    | Perl regular expression | grep -P (or --perl-regexp) Not applicable |


    To summarize this, grep all works with basic regex. If you use the -E (--extended-regexp)
    option or the grep command, you can use extended regex. Much of the time, this
    is probably what you''ll want to do, unless you''re performing a very simple search.
    Two complicated choices are grep with the -F (or --fixed-strings) option or the
    grep command, which allows you to use multiple strings that could be matched,
    and grep with the -P (or --perl-regexp) option, which allows Perl programming
    mavens to use that language''s sometimes unique approach to regex.


    # Note


    In this book, unless otherwise stated, we''re using plain grep for basic regex.


