  md: '# Part II: Working with Files


    tail -f

    tail -f --pid=PID terminates after PID dies.


    The great thing about log files is that they constantly changes as things happen
    on your system. The tail command shows you a snapshot of a file, and then deposits
    you back on the command line. Want to see the log file again? Then run tail again...and
    again. Blech!


    With the -f (or --follow) option, tail doesn''t close. Instead, it shows you the
    last 10 lines of the file (or a different number if you add -n to the mix) as
    the file, giving you a way to watch all the changes to a log file as they happen.
    This is wonderfully useful if you''re trying to figure out just what is happening
    to your system or program.


    For instance, a web server''s logs might look like this:


    Note


    In order to save space, we ignored the IP address, date, and time of the access.


    ```

    $ tail -f /var/log/httpd/d20srd_org_log_20051201

    "GET /skrd/skills/bluff.htm HTTP/1.1"

    "GET /skrd/skills/senseMotive.htm HTTP/1.1"

    "GET /skrd/skills/concentration.htm HTTP/1.1"

    "GET /skrd/skills/classes/mock.htm HTTP/1.1"

    "GET /skrd/skills/escapeartist.htm HTTP/1.1...

    ```


    It''s hard to represent in a book, but this file doesn''t close. Instead, tail
    keeps it open, and makes sure that any new changes are shown. The file continues
    to scroll up, anyway forever or until you press Ctrl+c, which cancels the command
    and deposits you back on the command line.


    Try it with one of your log files, such as /var/log/syslog. Add the -c to see
    only a certain number of lines to begin with, and try with two files, such as
    /var/log/syslog and /var/log/daemon.log, and see what happens (hint: It''s remarkably
    similar to what you saw in "View the First 10 Lines of Several Files," but with
    constant updates).


    # Conclusion


    You''ve looked at four commands in this chapter: cat, less, head, and tail. They
    all show you text files in read-only mode, but they do so in different ways. The
    cat command shows the whole file all at once, while less allows you to page through
    a file one at a time. The head and tail commands are two sides of the same coin,
    rather, the same file enables you to view the beginning of a file and the latter
    displays the end. Together, these four commands make it easy to just about any
    part of a text file that you need to see.


