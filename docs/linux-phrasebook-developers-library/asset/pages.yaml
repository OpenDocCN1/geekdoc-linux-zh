  md: '# Read a Command''s Specific Man Page


    man [1-8]


    You might notice in the previous listing that the first line of man''s page references
    ls (1), while earlier, when you used the -k option, all the names of commands
    were also followed by numbers in parentheses. Most of them are 1, but one, lsof,
    is 8. So what''s with all of these numbers?


    The answer is that man pages are categorized into sections, numbered from 1 to
    8, which break down as follows (and don''t worry if you don''t recognize the example,
    as many of them are pretty arcane and specialized):


    +   1. General commands. Examples are cd, chmod, mkdir, and passwd.

    2. Low-level system calls called by the kernel. Examples are intro and chmod.

    3. C library functions. Examples are beep, HTML::Parser, and Mail::Internet.

    4. Special files, such as devices found in /dev. Examples are console, lp, and
    mouse.

    5. File formats and conventions. Examples are apt.conf, dpkg.cfg, hosts, and passwd.

    6. Games. Examples are atlantic_bouncingcow, kmahjongg, and rubik.

    7. Miscellaneous, including macro packages. Examples are ascii, base, and utf-8.

    8. System administration commands called by root. and shutdown.


    Almost every command we''ve looked for in this book falls into section 1, which
    isn''t surprising because we focus on general use of your Linux system. But notice
    how commands fall into more than one section: chmod, for instance, is in both
    1 and 2, passwd can be found in 1 and 5. By default, if you enter passwd in your
    shell, man defaults to the lower number, so you''ll see the section 1 man page
    for passwd, which isn''t very helpful if you want to learn about the file passwd.
    To see the man page for file passwd, follow man with the section number for the
    data you want to examine.


    ```

    $ man passwd

    PASSWD (1)

    NAME

    passwd change user password

    SYNOPSIS

    passwd [-f] [-r] name

    passwd [-q] [-R] group

    passwd [-max] [-n min] [-w warn] [-i inact]

    login [-l|u|-d|-S|-e] login

    DESCRIPTION

    passwd changes passwords for user and group accounts. A normal user...

    [Listing condensed to length]

    $ man passwd (5)

    NAME

    passwd - The password file

    DESCRIPTION

    passwd contains various pieces of information for each user account.

    [Listing condensed to length]

    ```'
