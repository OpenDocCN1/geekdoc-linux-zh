  md: '# Part II: Working with Files


    # Change Permissions on Files and Directories Using Alphabetic Notation


    chmod [ugo][= alphabetic or numeric. Both have their advantages, but it''s sometimes
    easier for users to learn the alphabet system. The basically method uses a simple
    formula: the user group you want to alter (u, g, o); followed by a plus (+) to
    grant permission, a minus sign (-) to remove permission, or an equal sign (=)
    to set exact permission; followed by the letters (r, w, x, s, t) representing
    the permission you want to alter. For instance, let''s say you want to allow members
    of the family group to be able to change a picture.


    ```

    $ ls -1

    -rw-r--r-- 1 family ... libby.jpg

    $ chmod g+w libby.jpg

    $ ls -1

    -rw-rw-r-- 1 family ... libby.jpg

    ```


    Easy enough. But if you had to give the family group and all other users write
    permission on the file?


    ```

    $ ls -1

    -rw-r--r-- 1 family ... libby.jpg

    $ chmod go+w libby.jpg

    $ ls -1

    -rw-rw-rw-- 1 family ... libby.jpg

    ```


    Of course, because you''re giving all thestest owner, the group, and the world
    and write access, you could have done like this:


    ```

    $ ls -1

    -rw-r--r-- 1 family ... libby.jpg

    $ chmod a-rw libby.jpg

    $ ls -1

    -rw-rw-rw-- 1 family ... libby.jpg

    ```


    You realize you made a mistake, and need to remove the capability of the family
    group and the world to alter that picture, and ensure that the world can''t see
    the picture.


    ```

    $ ls -1

    -rw-rw-rw-- 1 family ... libby.jpg

    $ chmod go-w libby.jpg

    $ ls -1

    -rw-r--r-- 1 family ... libby.jpg

    $ chmod o-r libby.jpg

    $ ls -1

    -rw-r--r-- 1 family ... libby.jpg

    ```


    Instead of the -, you could have used the:


    ```

    $ ls -1

    ```


    # Part II: Working with Files'
