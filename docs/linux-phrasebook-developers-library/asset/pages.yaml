  md: '# Show Results If Either Expression Is True (OR)


    find -o


    Earlier, in the section "Find Files by File Size", we saw that we could use find
    to list every Clash on London Calling that was exactly 10MB, and we could use
    find to list songs on London Calling that were more than 10MB, but we couldn''t
    do both at the same time with -size. In the previous section, we saw that -a options
    combines AND; however, we could also utilize -o (or -or) to combine options OR.


    So, in order to find songs from London Calling that are 10MB or larger, we use
    the following command:


    ```

    $ cd London_Calling

    $ find -size +10M -o -size 10M

    03__Jimmy_Jazz.ogg

    07__The_Right_Profile.ogg

    08__Last_In_The_Supermarket.ogg

    09__Clampdown.ogg

    12__Death_Or_Glory.ogg

    15__Lover''s_Rock.ogg

    18__Revolution_Rock.ogg

    (25th_Anniversary)__18__Revolution_Rock.mp3

    (25th_Anniversary)__37__-Heart_And_Mind.mp3

    (25th_Anniversary)__39__-London_Calling_(Demo).mp3

    ```


    Oops... we also got results from the 25th Anniversary release of London Calling
    as well, which we didn''t want. We need to do two things: exclude results from
    the 25th Anniversary edition and make sure that our OR statement works correctly.


    To exclude the 25th Anniversary songs, we add ! -name "*25*" at the end of our
    command. To make sure that OR works, we need to surround it with parentheses,
    which combines the statements. However, you need to escape the parentheses with
    backslashes so the shell doesn''t interpret them, and you also need to put spaces
    before and after your statement. The combination gives us this command:


    ```

    $ cd London_Calling

    $ find \(-size +10M -o -size 10M\\) ! -name "**25*"

    03__Jimmy_Jazz.ogg

    07__The_Right_Profile.ogg

    08__Last_In_The_Supermarket.ogg

    09__Clampdown.ogg

    12__Death_Or_Glory.ogg

    15__Lover''s_Rock.ogg

    18__Revolution_Rock.ogg

    ```


    Perfect. Seven songs are 10MB or greater in size.


    Note'
