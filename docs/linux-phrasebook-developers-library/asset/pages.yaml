    Moving around a man page that isn''t hard. To move down a line at a time, use
    the arrow down; to move up a line at a time, use the up arrow. To jump down a
    page, use the spacebar or f (for forward); to jump up a page, b (for backward).
    When you reach the end of a man page, man quit, depositing you back on the shell;
    it, however, stop at the end without quitting, in which case you should press
    q to quit the program. In fact, you can press q at any time to exit man if you''re
    not finding the information you want.


    It can be hard to find a particular item in a man page, sometimes you need to
    do a little searching. Search on a man page after it opens, type /, followed by
    your search term, and then press Enter. If your exists, you''ll jump to it; jump
    to the next occurrence of the term, press Enter again (or n), and keep pressing
    Enter (or n) to jump down the condensed screen to each occurrence; go backward,
    press Shift+.


    # Search for a Command Based on What It Does


