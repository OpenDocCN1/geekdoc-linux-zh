    # Verify That a Computer Is Running and Accepting Requests


    ```

    ping

    ping -c

    ```


    The ping command sends a special kind of packetan ICMP ECHO_REQUEST messaget to
    the specified address. If a machine that is listening for ICMP messages, it responds
    with an ICMP REPLY. (It''s true that firewalls block ICMP messages, rendering
    ping useless, but most of the time it''s not a problem.) A successful ping means
    that network connectivity is occurring between the two machines.


    ```

    $ ping www.google.com

    ping www.google.com

    PING www.google.com (72.14.203.99) 56(84) bytes of data.

    64 bytes from 72.14.203.99: icmp_seq=1 ttl=245 time=17.1 ms

    64 bytes from 72.14.203.99: icmp_seq=2 ttl=245 time=18.1 ms

    ```


    ```

    [Results truncated for length]--- www.google.com

    ping statistics ---

    6 packets transmitted, 5 received, 16% packet loss, time 501ms

    tr min/avg/max/mdev = 16.939/17.560/18.136/0.460 ms

    ```


    The ping command won''t stop until you press Ctrl+C. This can cause problems if
    you''re using ping because it will continue until it is stopped or your machine''s
    network connections drop. If one forgot and left a ping session running for 18
    days, sending nearly 1.4 million pings to one of your servers.


    If you want to ping a limit, you can set the number of packets that ping is to
    send with the -c option, followed by a number. After ping sends out number of
    packets, it stops, reporting its results.


    ```

    $ ping -c 3 www.granneman.com

    PING granneman.com (216.23.180.5) 56(84) bytes of data.

    ```'
