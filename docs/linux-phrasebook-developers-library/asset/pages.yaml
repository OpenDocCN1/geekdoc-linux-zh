  md: '# Copy Files


    cp


    Making copies of files is one of those things that computer users, no matter the
    OS, find doing all the time. One of the most venerable commands used by the Linux
    shell is `cp`, which copies files and directories. The easiest way to use `cp`
    is simply to type in the command, followed by the file you''re wanting to copy,
    and the copied file''s new name; think of the command''s structure as `cp file-you''re-copying-from-file-you''re-copying-to`.
    Another common way to express that relationship is `cp source target.


    ```

    $ pwd

    /home/scott/libby

    $ ls

    libby.jpg

    $ cp libby.jpg libby_bak.jpg

    $ ls

    libby_bak.jpg libby.jpg

    ```


    This example is pretty simple: The picture is copied into the same directory as
    the original file. You can also copy files to another directory, or even copy
    files from a directory in which you''re not currently located to another directory
    located elsewhere on your system file.


    ```

    $pwd

    /home/scott

    $ ls ~/libby

    libby_bak.jpg libby.jpg

    $ cp pix/libby_arrowrock.jpg libby/arrowrock.jpg

    $ ls ~/libby

    arrowrock.jpg libby_bak.jpg libby.jpg

    ```


    The same filename, `libby_closeup.jpg`, is used in this example, which is okay
    because the file is copied into another directory. In the first example for `cp`,
    however, you had to use a new name, `libby_bak.jpg` instead of `libby.jpg`, because
    you were copying the file into the same directory.


    If you want to copy a file from another directory into your working directory
    (the one in which you currently find yourself), simply use `..` (Remember how
    you learned earlier in this chapter that means "the current directory" when you
    see how that information can be handy.). Of course, you can change the name when
    you use `..` because it''s a shortcut for the original filename.


    ```

    $pwd

    /home/scott/libby

    $ ls

    libby_bak.jpg libby.jpg

    $ cp pix/libby_arrowrock.jpg .

    $ ls

    arrowrock.jpg libby_bak.jpg libby.jpg

    ```


    You don''t need to specify a filename for the target if that file is going to
    reside in a specific directory, instead, you can just provide the directory''s
    name.'
