    Nowadays most computers come with hundreds of megabytes or even gigabytes of RAM,
    but it''s still possible to find your machine slowing down due to a lot of memory
    usage or virtual memory swapping. To see the current state of your system''s memory,
    use the free command.


    ```

    $ free total used free buffers cached

    Mem: 103616 995852 0 80816 332264

    -/+ buffers/cache: 582772 453364

    Swap: 1012084 49584 516500

    ```


    By default, free shows the results in kilobytes, the same as you''ve used. You
    can change that, however. The -b option shows your memory usage in bytes, and
    -m (which you should probably use most of the time) uses megabytes.


    ```

