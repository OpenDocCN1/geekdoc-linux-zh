    megabytes or G for gigabytes. Some of you might be wondering how 40122 bytes for
    .nessurc became 40K when you use -h. This is because 1024 bytes make a kilobyte,
    so you divide 40122 by 1024, you get 39.181406 kilobytes, which ls -h rounds up
    to 40K. A megabyte is actually 1,048,576 bytes, and a gigabyte is 1,073,741,824
    bytes, so a similar of rounding takes places with those us.


