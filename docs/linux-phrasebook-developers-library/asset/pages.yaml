    If you want to print more than one copy document, use the - (the pound sign) option,
    followed by the number of copies you want:


    ```

    $ lpr -# 2 -P bro Lovecraft-_Call_of_Cthulhu.txt

    ```


    The number can range from 1 to 100. Want more than 100? Repeat the command. Or
