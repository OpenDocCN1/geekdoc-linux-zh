  md: '# Query and Map NetBIOS Names and IP Addresses


    nmlookup -T


    You can use nmlookup as a quick way to find any machines that are sharing files
    and printers via Samba. Append the -T option to the command, followed by " * "
    (and yes, you must include the quotation marks) to tell that you are not using
    the * as a wildcard representing the files in your current working directory.


    ```

    $ nmlookup -T * *

    querying * on 192.168.1 * <00

    192.168.1.151 *<00

    192.168.1.104 *<00

    192.168.1.110 *<00

    ```


    Three machines are on this LAN with Samba shares. To find out which of those are
    Master Browsers, see the previous section; to produce a list of the shares offered
    by each computer, proceed to the next section.


    # List a Machine''s Samba Shares


    smclient


    So you can know that a machine has Samba shares on it, thanks to the commands
    outlined in the previous section, but you don''t know what those shares are. The
    smclient command is a versatile tool that can be used to connect and work with
    them; at a more simple level, it can also list the shares available on a computer.
    Just use the -L (or --list) option, followed by the NetBIOS name or IP address.
    When prompted for a password, simply press Enter.


    ```

    $ smclient -L ELIOT

    Password:

    Anonymous login successful

    Domain=[TURING] OS=[Server]=[Samba 3.0.14a-Ubuntu]

    Sharename Type Comment

    ```


    ```

    print$ Disk Printer Drivers

    docs Disk Shared presentations and other files

    IPC IPC IPC Service (Samba, Ubuntu)

    ADMINS IPC IPC Service (eliest server (Samba, Ubuntu))

    Anonymous login successful

    Domain=[TURING] OS=[Server=Samba 3.0.14a- Ubuntu]

    ```


    In this case, you can see all of the shares that are in the smb.conf file. To
    see the shares available to you if you were to log on, add the -U (or --user)
    option, followed by your Samba username as found on the Samba server.'
