    With just a little training, you will find that you can zoom around man pages
    and find exactly what you need...assuming you know which man to read. If you know
    a little about what a command does, but you don''t know the actual name of the
    command? Try using the -k option (or --apropos) and search for a word or phrase
    that describes the kind of command you want to discover. You''ll get back a list
    of all commands whose name or synopsis matches your search term.


