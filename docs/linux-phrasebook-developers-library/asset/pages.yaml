  md: '# Part I: Getting Started


    ```

    $ pwd

    /home/scott/music

    $ ls -lF

    H_Mobley/

    Horace_Silver/

    John_Coltrane/

    $ ls -IF Hank_Mobley/* > hank_mobley.txt

    $ cat hank_mobley.txt

    1958_Pekin_Time/

    1960_Pol_Call/

    1960_Soul_Station/

    1961_Workout/

    1961_No_Room_Squares/

    ```


    ```

    $ ls -lF

    Hank_Mobley/

    hank_mobley.txt

    Horace_Silver/

    John_Coltrane/

    ```


    Notice that before you used the >, the file hank_mobley.txt didn''t exist. When
    you use > and redirect to a file that does not exist, the file is created. Here''s
    the warning: if hank_mobley.txt had already existed, it would have been completely
    overwritten.


    Caution


    Once again: Be careful when using redirection, as you could potentially destroy
    the contents of a file that contains important stuff!


    # Prevent Overwriting Files When Using Redirection


    There''s a way to prevent overwriting files when redirecting, however the noclobber
    option. If you set noclobber to on, bash won''t allow redirection to overwrite
    existing files without your explicit permission. To turn on noclobber, use this
    command:


    ```

    $ set -o noclobber

    ```


    At that point, if you want to redirect and overwrite a file, use >| instead of
    just >, like this:


    ```

    $ pwd

    /home/scott/music

    $ ls -lF

    Hank_Mobley/

    hank_mobley.txt

    Horace_Silver/

    John_Coltrane/

    $ ls -IF Hank_Mobley/* > hank_mobley.txt

    ERROR

    $ ls -IF Hank_Mobley/* >| hank_mobley.txt

    $ cat hank_mobley.txt

    ```


