    # Note


    You know what creating a new file in a sgid directory will do, but be aware that
    other file system processes can also be affected by sgid. If you copy a file with
    cp into the sgid directory, it acquires the group of that directory. If you move
    a file with mv into the sgid directory, however, it keeps its current group ownership
    and does not acquire that of the directory''s group. Finally, if you create a
    new directory inside the sgid directory using mkdir, it not inherits the group
    that owns the sgid directory, but also becomes sgid itself.


    # Set and Then Clear the Sticky Bit


    ```

    chmod [+]-t

    ```


    Besides a fun phrase that rolls off the tongue, what''s the sticky bit? In the
    old days of Unix, if the sticky bit was set for an executable file, the OS knew
    that the file was going to run constantly, so it was kept in swap space so it
    could be quickly and efficiently accessed. Linux is a more modern system, so it
    ignores the sticky bit when it''s set on files.


    That means the sticky bit is used on directories. After it is set in a folder,
    users cannot delete or rename files in that folder unless they are the file owner
    or the owner of the directory that has the sticky bit on it. If the sticky bit
    is not set and the folder is writable for others, that means those users can delete
    and rename any file in it. The sticky bit prevents from happening. Most common
    place you''ll see it in your /tmp directory, which is world-writable by design,
    but the individual files and folders within /tmp are protected from other users
    by the sticky bit.


    ```

    $ ls -t /

    drwxrwt 12 root root ... tmp

    [Results truncated for length]

    ```


    # Note


    You may see both a and a T to indicate that the sticky bit is set. You see a t
    if the world already had execute permissions (x) before setting the sticky bit,
    and a T if the world didn''t have execute set before the bit was put in place.
    The result is the same, but the capitalization tells you what was in place originally.'
