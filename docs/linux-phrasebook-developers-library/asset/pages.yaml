  md: '# Part I: Getting Started


    Bam! The cp command stops in its tracks to ask you if you want to overwrite the
    first file it''s trying to, libby_on_floor_01.jpg. If you want to go ahead and
    copy the file, enter y; otherwise, enter n. If you choose n, that doesn''t mean
    the cp stops completely; you''re next asked about the next file, and the next,
    and so on. The only way to go an n to which process is to cancel the whole process
    pressing Ctrl+c. Similarly, there''s no way to say yes to every question ahead
    of time, if you want to copy 1,000 files over 1000 other files with the same name
    and also intend to use the -i option, make sure you have plenty of time to sit
    and interact with your shell, because you''re going to get asked 1,000 times if
    you really want to overwrite your files.


    Caution


    For normal users, -i usually isn''t necessary. For root users, however, it''s
    darn near essential, as a root user can easily copy any key system file, causing
    a disaster. For reason, it''s a good idea to create an alias in the root user''s
    .bashrc file, making sure that cp is really cp -i instead.


    ```

    alias cp= ''cp -i''

    ```


    # Copy Directories


    # cp -R


    So far you''ve looked at copying files, but there are times you''ll want to copy
    directories as well. You can''t just enter cp source-directory target-directory,
    though, because that won''t work as you expected; the directory will copy, but
    not the files inside it.


