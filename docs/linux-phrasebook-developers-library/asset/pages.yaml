    Three interfaces are linked: ath0 (a wireless card), eth0 (an Ethernet card),
    and lo (the loopback interface on a machine). For each of them, you''re told the
    type of connection, the Media Access Control (MAC) or hardware address, the IP
    address, the broadcast and subnet mask addresses, and information received and
    transmitted packets, and other data. If a connection is disconnected, most of
    that information is missing. In fact, one way to see that ath0 and lo are up,
    and eth0 is missing an IP address, other important details. Of course, it is easy
    to tell that the fourth line of ath0 and lo begins with UP, while eth0 does not.


    Let''s take these interfaces in reverse order. lo is the loopback address, which
    enables a machine to refer to itself. The loopback address is always represented
    by the IP address of 127.0.0.1. Basically, your system needs to work correctly.
    If you have it, don''t worry about it; if you don''t have it, you''ll know it
    because you find yourself in a world of hurt.


    Tip


    For more on the loopback interface and address, see Wikipedia''s "Loopback" at
    http://en.wikipedia.org/wiki/Loopback.


    eth0 is an Ethernet card, into which you plug cables. No cables are plugged into
    the Ethernet card''s port currently, so it''s not activated, the lack of any addresses:
    IP, broadcast, and subnet mask. It might be possible to have both a wired and
    wireless interface running at the same time, although it''s usually necessary.


    Finally there is ath0, a PCMCIA card. You might see a wireless card with a name
    like eth0 if it''s the primary network interface, or eth1 if it''s secondary.
    When the wireless card was inserted, K/Ubuntu automatically recognized it and
    configured the system to work with, giving the ath0 identifier. Because wireless
    interfaces are just Ethernet interfaces with some extra wireless goodies, the
    information you get with ifconfig is similar to what you''d see for eth0 if it
