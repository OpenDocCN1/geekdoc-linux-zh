    It''s cool that you can use smclient to access Samba shares, it''s also a pain
    if you want to use a GUI, or if you want to do a lot of work on the share. In
    those cases, you should use smbmount, which mounts a Samba share to your local
    filesystem as though it was part of your hard drive. If it is mounted, you can
    use your own file manager and access files on the share easily, and you can even
    open programs such as word processors and open the files directly with fuss.


    To mount a Samba share on your filesystem, you must create a mount point which
    will grant you access. If you were going to mount the documents from ELIOT, you
    might create a directory like this:


    ```

    $ mkdir /home/scott/eliot_documents

    ```


    Now you run the smbmount command, with a whole host of options.


    ```

    [View full width]$ smbmount //eliot/documents/home/scott/eliot_documents -o credentials=/home/scott/bin/credentials_eliot,fmask=644,mask=755,uid=1001,gid=1001,workgroup=TURING

    sbmount must be installed sudo root for direct user mounts (1000,1000)

    sbmount failed: 1

    ```


    Before looking at it, let''s talk about smbmount failed. The second line tells
    you: smbmount calls, can only be run by root. This can be a problem if your non-root
    users are able to mount a Samba shares. The way around is to set smbmount as suid
    root (you learned about suid in Chapter 7''s "Set and Then Clear suid").


    Note


    Yes, you''re giving others the ability to use smbmount as though they were root,
    but it''s not really a big problem. it''s certainly better than giving them the
    root password, or requiring your participation every time they want to mount a
    Samba share.


    Here''s how to set smbmount as suid root.


    Note


    In order to save space, some of the details you''d normally see with ls -l have
    been removed.


    ```

    $ ls /usr/bin/smbmount

    -rwxr-xr-x 1 root /usr/bin/smbmount

    # chmod u+s /usr/bin/smbmount

    # ls -l /usr/bin/smbmount

    -rwxr-xr-x 1 root /usr/bin/smbmount

    ```


    Now let''s try smbmount again.


    ```

    [View full width]$ smbmount //eliot/documents/home/scott/eliot_documents -o redentials=/home/scott/credentials_eliot,fmask=644,mask=755,uid=1001,gid=1001,workgroup=TURING

    ```


