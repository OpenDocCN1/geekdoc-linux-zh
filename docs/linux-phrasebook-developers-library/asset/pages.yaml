  md: '# Archive and Compress Files with tar and gzip


    -zcvf


    If you look back at "Archive and Compress Files Using gzip" and "Archive and Compress
    Files bzip2" and think about what was discussed, you''ll probably start to figure
    out a problem. What if you want to compress a directory that contains 100 files,
    contained in various subdirectories? If you use gzip or bzip2 with the -r (for
    recursive) option, you''ll end up with 100 individually compressed files, each
    stored neatly in its own subdirectory. This is undoubtedly not what you want.
    How would you like to attach 100 gz or .bzip2 files to an email? Vibes!


    That''s where tar comes in. First you''d use tar to archive the directory and
    its contents (those 100 files inside various subdirectories) and then you'' use
    gzip or bzip2 to compress the resulting tar. Because gzip is the most common compression
    program used in concert with tar, we''ll focus on that.


    You could do this with:


    ```

    $ ls -l moby-dick/\nscott scott 102519 moby-dick/job.txt

    scott scott 1236574 moby-dick/moby-dick.txt

    scott scott 508925 moby-dick/paradise_lost.txt


    moby-dick/bible:

    scott scott 207254 genesis.txt

    scott scott 102519 job.txt

    $ tar -cf moby.tar moby-dick/ | gzip -c >

    moby.tar.gz

    $ ls -l

    scott scott 168 moby-dick/

    scott scott 20 moby.tar.gz

    ```


    That method work, but it''s just too much typing! There''s an easier way that
    should be your default. It involves two options for tar: -z (or --gzip), which
    invokes gzip within tar so you don''t have to do it manually, and -v (or --verbose),
    which isn''t required here but is always useful, as it keeps you notified of what
    tar is doing as it runs.


    ```

    $ ls -l moby-dick/\nscott scott 102519 moby-dick/job.txt

    scott scott 1236574 moby-dick/moby-dick.txt

    scott scott 508925 moby-dick/paradise_lost.txt


    moby-dick/bible:

    scott scott 207254 genesis.txt

    scott scott 102519 job.txt

    $ tar -zcf moby.tar.gz moby-dick/

    moby-dick/

    moby-dick/job.txt

    moby-dick/bible/

    moby-dick/bible/genesis.txt

    moby-dick/bible/job.txt

    moby-dick/moby-dick.txt

    moby-dick/paradise_lost.txt

    $ ls -l

    scott scott 168 moby-dick

    ```'
