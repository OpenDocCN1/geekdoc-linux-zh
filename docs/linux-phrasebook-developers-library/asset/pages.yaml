    # Chapter 5. Viewing Files Boxes


    One of the great things about Linux boxes is that virtually all important system
    configurations, logs, and information files are in ASCII text format. Because
    ASCII is a well-supported, ancient (in computer terms) standard, there is a wealth
    of software commands you can use to view the contents of these text files. This
    chapter looks at four commands you will use constantly when reading ASCII text
    files.


    # Viewing Files on stdout


    ```

    cat

    ```


    DOS users have the type command that displays the contents of text files on a
    screen. Linux users can use cat, which does the same thing. Want to view a file
    in the shell? Try cat.


    ```

    $ cat Hopkins,--The_Windhover.txt

    I caught this morning morning''s minion, kingdom

    of daylight''s dauphin, dappled-drawn Falcon, in his riding

    of the rolling level beneath him steady air, and striding

    high there, he reung upon the rein of a wimping wing

    in his ecstasy! then off, off on swerving.

    As a skater''s feel sweeps smooth on a bow-bend; the hurt and gliding

    Rebound in the wild wind; my heart in hiding

    Stirred for a bird,-- the achieve of, the mastery of the thing!

    ```


    Brute beauty and valour and act, Oh, pride, plume, here

    Buckle! AND the fire that breaks from thee, a billion


    Times told lovely, more dangerous, o my chevalier!

    No wonder of it: sheer plod makes plough down

    sillion


    Shine, and blue-bleak emmers, ah my dear,

    Fall, gall themselves, and gash gold-vermilion.


    The cat command prints the file to the screen, and then deposits you back at the
    command prompt. If the file

    is longer than your screen, you need to scroll up to see what flashed by.'
