    non_floor/

    -rw-r--r- 1 scott family ... libby_on_floor_01.jpg

    -rw-r--r- 1 scott family ... libby_on_floor_02.jpg

    $ chgrp -R */

    $ ls -l

    -rw-r--r- 1 scott family ... libby_arrowrock.jpg

