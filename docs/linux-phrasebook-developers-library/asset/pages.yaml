    the fruit that Adam and Eve ate? While in less, press / and then type in the pattern
    for which you''d to search you can use regular expressions you like. If your pattern
    is in place, press Enter and less jumps to the first instance of your search,
    if it exists. If your pattern isn''t in the file, less tells you that:


    Pattern not found (press RETURN)


    Repeating your search is also easy and can be either forward or backward in your
    file.

