    # Password-Protect Compressed Zip Archives


    -P -e


    The Zip program allows you to password-protect your Zip archives using the –P
    option. You shouldn''t use this option. It''s completely insecure, as you can
    see in the following example (the actual password is 12345678):


    ```

    $ zip -P 12345678 moby.zip *.txt

    ```


    Because you had to specify the password on the command line, anyone viewing your
    shell''s history (and you might be surprised how easy it is for other users to
    do so) can see your password in all its glory. Don''t use the –P option!


    Instead, just use the -e option, which encrypts the contents of your Zip file
    and also uses a password. The difference, however, is that you''re prompted to
    type the password in, so it won''t be saved in the history of your shell.


    ```

    $ zip -e moby.zip *.txt

    Enterter password:

    Verify password:

    adding: job.txt (deflated 65%)

    adding: moby-dick.txt (deflated 61%)

    adding: paradise_lost.txt (deflated 56%)

    ```


    The only part of that''s saved in the shell is zip -e moby.zip *.txt. The actual
    password type disappears into the ether, unavailable to anyone viewing your shell.


    Cation


    The security offered by the Zip program''s password protection isn''t that. In
    fact, it''s pretty easy to find a multitude of tools floating around the internet
    that can quickly catch a message or password-protected Zip archive. Think of password-protecting
    a Zip file as the difference between writing a message on a postcard and sealing
    it in an envelope: It''s good enough for ordinary folks, but it won''t stop a
    determined attacker.


    Also, the version of zip included with some Linux distros may not support encryption,
    in which case you''ll see a zip error: "encryption not supported." The only solution:
    recompile zip from source. Ugh.


