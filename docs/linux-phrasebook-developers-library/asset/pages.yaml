  md: '# Learn About Commands with info


    info


    The man command, and the resulting pages, are simple to work with, even if the
    content isn''t always as friendly as you might like. In response to that and other
    perceived shortcomings with man pages, the GNU Project, is responsible in many
    ways for many of the commands you''re reading about in this book, created with
    its own format: Info pages use the info command for viewing.


    Info pages tend to be better written, more comprehensive, and more user friendly
    in terms of content than man pages, but man pages are easier to use. A man page
    is just one page, while Info pages organize their content into multiple sections,
    nodes which also contain subsections, andnodes. The trick is how to navigate not
    just an individual page, but between nodes and subnodes. It is a bit of overwhelming
    to just move around and find what you''re seeking in Info pages, which are rather
    ironic: Something that was supposed to be nicer for newbies than man is actually
    harder for you to learn and use.


    There are many facets to info, and one of the best commands to use info against
    is, in fact, info. To learn to use info, as well as read about info, enter the
    following command:


    ```

    $ info info

    ```


    This opens the Info page for the info command. Now you need to learn how to get
    around in this new Info world.


    # Navigate Within info


    Within a particular section''s screen, to move down, or forward, one line at a
    time, use the down arrow; to move up, or back, one line at a time, use the up
    arrow. When you reach the bottom, or end, of a particular section, your cursor
    stops and you are not able to proceed.


    If you want to jump down a section at a time, use your keyboard''s PageDown button;
    to jump up a screen at a time, use the PageUp key instead. You are not able to
    leave the particular section you''re, however.


    If you reach the end of the section and want to jump back to the top, press b,
    which stands for beginning. Likewise, e takes you to the "end.".


    If at any time, as you''re jumping around place to place, you notice things look
    a little strange, such as the letters or words be distorted, press Ctrl+1 to redraw
    the screen, and all should be fine.


    Now that you know how to navigate within a particular section or node, let''s
    move on to navigating between nodes. If you don''t want to use PageDown and PageUp
    to move forward and backward within a section, you can use the spacebar and Delete
    keys to move up. These keys offer one big advantage over PageDown and PageUp,
    being easier to reach: When you hit the end of a node, you automatically proceeds
    to the next node, through subnodes. Likewise, going up moves you to the previous
    node, through any subnodes. Using the spacebar, or the Spacebar or Delete buttons,
    you can quickly run through an entire set of Info pages about a particular command.'
