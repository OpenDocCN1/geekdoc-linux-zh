  md: '# Part IV: Environment


    The yum command installs, upgrades, and uninstalls software packages by acting
    as a wrapper around rpm. In addition, yum automatically handles dependencies.
    For example, if you are trying to install package A from the introductory paragraph,
    yum downloads and installs A, B, and C for you. Later, if you decide that no longer
    want A on your system, yum can uninstall it for you, along with B and C, as long
    as other software packages don''t require them.


