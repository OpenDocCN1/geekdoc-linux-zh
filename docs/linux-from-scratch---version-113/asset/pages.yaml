  md: "# 8.69. Vim-9.0.1273\n\nThe Vim package contains a powerful text editor.\n\n\
    Approximate build time: 2.4 SBU\nRequired disk space: 235 MB\n\n# Alternatives\
    \ to Vim\n\nIf you prefer other editor—such as Emacs, Joe, or Nano—please refer\
    \ to https://www.linuxfromscratch.org/blfs/view/11.3/postlfs/editors.html for\
    \ suggested installation instructions.\n\n# 8.69.1. Installation of Vim\n\nFirst,\
    \ change the default location of the vimrc configuration file to /etc:\n\n```\n\
    #define SYS_VIMRC_FILE \"/etc/vimrc\" >> src/feature.h\n```\n\nPrepare Vim for\
    \ compilation:\n\n```\n/configure --prefix=/usr\n```\n\nCompile the package:\n\
    \n```\nmake\n```\n\nTo prepare the tests, ensure that tester can write to the\
    \ source tree:\n\n```\nchown -Rv tester .\n```\n\nNow run the tests as user tester:\n\
    \n```\nsu tester -c \"LANG=en_US.UTF-8 make -j1 test\" > vim-test.log\n```\n\n\
    The test suite outputs log of binary data to the source. This can cause issues\
    \ with the settings of the current terminal. The problem can be avoided by redirecting\
    \ the output to a log file as shown above. A successful test will result in the\
    \ words \"ALL DONE\" in the log file at completion.\n\nInstall the package:\n\n\
    ```\nmake install\n```\n\nMany users reflexively type vi instead of vim. To allow\
    \ execution of vim when users habitually enter vi, create a symlink for both the\
    \ binary and the man page in the path:\n\n```\nln -sv vim /usr/bin/vi\nfor L in\
    \ /usr/share/man/*)man1/vim; do\n  ln -sv $L $(basename $L) /vi.1\ndone\n```\n\
    \nBy default, Vim's documentation is installed in /usr/share/doc/vim-9.0.1273.\
    \ The following symlink allows the documentation to be accessed via /usr/share/doc/\n\
    \n```\nln -sv .../vim90/doc /usr/share/doc/vim-9.0.1273\n```\n\nIf an Windows\
    \ system is being installed on the LFS system, it may be necessary to recompile\
    \ Vim after installing X. Vim with a GUI of the editor requires X additional libraries\
    \ to be installed. For information on this process, refer to the Vim documentation\
    \ and the Vim installation page in the BLFS book at https://www.linuxfromscratch.org/blfs/view/11.3/postlfs/vim.html."
