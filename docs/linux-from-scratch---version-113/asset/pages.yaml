  md: '# Linux From Scratch - Version 11.3


    At this point, it is imperative to stop and ensure that the basic functions (compiling
    and linking) of the new toolchain are working as expected. To perform a sanity
    check, run the following commands:


    ```

    echo ''int main()'' | $LFS_TGT-gcc -xc

    readelf -l a.out | grep ld-linux

    ```


    If everything is working correctly, there should be no errors, and the output
    of the last command will be of the form:


    ```

    [Requesting interpreter: /lib64/ld-linux-x86-64.so.2]

    ```


    Note for 32-bit machines, the interpreter name will be /lib/ld-linux.so.2.


    If the output is not as shown above, or if there is no output at all, then something
    is wrong. Investigate and retrace the steps to find out where the problem is and
    correct it. This issue must be resolved before continuing.


    Once all is well, clean up the test file:


    Building the packages in the chapter will serve as an an check that the toolchain
    has been built properly. If some package, especially Binutils-pass2 or GCC-pass2,
    fails to build, it is an indication that something has gone wrong with the preceding
    Binutils, GCC, or Glibc installations.


    Now that our cross-toolchain is complete, finalize the installation of the limits.h
    header. To do this, run a utility provided by the GCC developers:


    ```

    $LFS/tools/libexec/gcc/$LFS_TGT/12.2.0/install-tools/mkheaders

    ```


    Details on this package are located in Section 8.5.3, “Contents of Glibc."


