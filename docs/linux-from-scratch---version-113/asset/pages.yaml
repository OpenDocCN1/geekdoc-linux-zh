  md: 'the example above, only cl1 and cc2 are cross-compilers, that they produce
    code for a different machine from the one they are on. The other compilers ccA
    and ccC produce code for the machine they are run on. Such compilers are called
    native compilers.


    # Implementation of Cross-Compilation for LFS


    # Note


    All the cross-compiled packages in this book use an autoconf-based building system
    types in the form cpu-vendor-kernel-os, referred to as the system triplet. Since
    the vendor field is often irrelevant, unknown leaves you out.


    An astute reader may wonder why a "triplet" refers to a four component name. The
    kernel field and the os field being a "system" field. A three-field form is still
    valid today for some systems, for example, x86_64-unknown-freebsd. Two systems
    can share the same kernel but they are too different to use the same triplet to
    describe them. Android running on a mobile phone is completely different from
    Ubuntu running on an ARM64 server, even though they are both running on the same
    CPU (ARM64) and using the same kernel.


    Without an emulation layer, you cannot run an executable for a server on a mobile
    phone or vice versa. So the "system" field has been divided into kernel and os
    fields, to designate these unambiguously. In our example, the Android system is
    designated a64-unknown-linux-android, and the Ubuntu system is designated a64-unknown-linux-gnu.


    The "triplet" remains embedded in the lexicon. A simple way to determine your
    triplet is to run the config script that contains the source for many packages.
    Unpack the bountils source, run ./config, and note the output. For a 32-bit Intel
    processor the output will be i686-pc-linux-gnu. On a 64-bit system it will be
    x86_64-pc-linux-gnu. On most Linux systems the even simpler gcc-dumpmachine command
    will give you some information.


    You should also be aware of the name of the platform''s dynamic linker, often
    referred to as the dynamic loader (not to be confused with the standard linker
    ld that is part of binary). The dynamic linker provided by package glibc finds
    and loads the shared libraries used by a program, to run and then it. The name
    of the dynamic linker for a 32-bit Intel machine is ld-linux.so.2; it is ld-linux-x86-64.so.2
    on 64-bit systems. A sure-fire way to determine the name of the dynamic linker
    is to inspect a random binary from the host system by running: readelf -l <name
    of binary> | grep interpreter and noting the output. The authoritative covering
    all platforms is in the shlib-versions file in the root of the glibc source tree.


    In order to fake a cross-compilation in LFS, the name of the host triplet is slightly
    adjusted by changing the "vendor" field in the LFS_TGT variable so it says "If".
    We also use the --sysroot option when building the cross- and cross-compiler,
    to tell where we found the host files. This ensures that none of the other programs
    built in Chapter 6 can link to libraries on the build machine. Only two stages
    are mandatory, plus one more for tests.


    | Stage | Build | Host | Target | Action |

    |---|---|---|---|---|n| 1 | pc | pc | Lfs | Build cross-compiler cc1 cc-pc on
    pc. |'
