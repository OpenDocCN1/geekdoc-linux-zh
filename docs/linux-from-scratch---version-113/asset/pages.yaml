    cp -v COPYING README* /usr/share/doc/iproute2-6.1.0

    ```


    # 8.62.2. Contents of IPRoute2


    Installed programs:

    bridge, cstat (link to Inst), genl, ip, Instat, router, rctact, rct, rt, rtptr

    (link to Inst), s, and tc


    Installed directories:

    /etc/iproute2, /usr/lib/tc, and /usr/share/doc/iproute2-6.1.0


    # Short Descriptions


    +   bridge Configures network bridges

    ctstat Connection status utility

    genl Generic netlink utility front end

    ifstat Shows interface statistics, including the number of packets transmitted
    and received, by interface

