  md: '# Important Preliminary Material


    # Introduction


    This part is divided into three stages: first, building a cross compiler and its
    associated libraries; second, using this cross toolchain to build several utilities
    in a way that isolates them from the host distribution; and third, entering the
    chroot environment (which further improves host isolation) and constructing the
    remaining tools needed to build the final system.


    > Important

    This is where the real work of building a new system begins. Be very careful to
    follow the instructions exactly as the book shows them. You should try to understand
    what each command does, and no matter eager you are to finish your work, you should
    refrain from blindly typing the commands as shown. Read the documentation when
    there is something you do not understand. Also, keep track of your typing and
    of the output of commands, using the tee utility to send the terminal output to
    a file. This makes debugging easier if something goes wrong.


    The next section is a technical introduction to the build process, while the following
    are very important general instructions.


    # Toolchain Technical Notes


    This section explains some the rationale and technical details behind the overall
    build method. Don''t try to immediately understand everything in this section.
    Most of this information will be clearer after performing an actual build. Come
    back and re-read this at any time during the build process.


    The overall goal of Chapter 5 and Chapter 6 is to produce a temporary area containing
    a set of tools that are known to be good, and are isolated from the host system.
    By using the chroot, the compilations in the remaining chapters will be isolated
    within that environment, ensuring a clean, trouble-free build of the target LFS
    system. The build process has been designed to minimize the risks for new readers,
    and to provide the most educational value at the same time.


    This build process is based on cross-compilation. Cross-compilation is normally
    used to build a compiler and its associated machine different from the one that
    is used for the build. This is not strictly necessary for LFS, since the machine
    where the new system will run is the same as the one used for the build. But cross-compilation
    has one advantage: anything that is cross-compiled cannot depend on the host environment.


    # About Cross-Compilation


    > Note

    The LFS book is not (and does not contain) a general tutorial to build a cross-
    (or native) toolchain. Don''t use the commands in the book for a cross-toolchain
    for some other purpose than building LFS, unless you really understand what you
    are doing.


    Cross-compilation involves some concepts that deserve a section of their own.
    Although this section may be omitted on a first reading, coming back to it later
    will help you gain a full understanding of the process.


    Let us first define some terms used in this context.'
  merge: -1
