    \ a regular user by running pip3 as this user. A multi-line warning is triggered\
    \ whenever pip3 is issued by the root user.\nLFS does not have a system-wide package\
    \ manager (dpkg, for example). This is not a problem, as pip3 will check for a\
    \ new version of itself whenever it's run. Since domain name resolution is not\
    \ configured in the LFS checkout environment, pip3 cannot check for a new version\
    \ of itself, and will produce a warning\n\nAfter we boot the LFS system and set\
    \ up a network connection, a different warning will be issued, telling us to update\
