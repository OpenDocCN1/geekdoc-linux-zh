  md: '# 8.75. Syslogd-1.5.1


    The Syslogd package contains programs for logging system messages, such as those
    emitted by the kernel when unusual things happen.


    **Approximate build time:** less than 0.1 SBU

    **Required disk space:** 0.7 MB


    # 8.75.1. Installation of Syslogd


    First, fix a problem that causes a segmentation fault in klog under some conditions,
    and fix an obsolete program construct:


    ```

    sed -i ''/Error loading kernel symbols/(n;n;d)'' ksym_mod.c

    sed -i ''/s/union wait/int/'' syslog.c

    ```


    Compile the package:


    ```

    make

    ```


    This package does not come with a test suite.


    Install the package:


    ```

    make BINDIR=/sbin install

    ```


    # 8.75.2. Configuring Syslogd


    Create a new /etc/syslog.conf file by running the following:


    ```

    cat > /etc/syslog.conf << "EOF"

    # Begin /etc/syslog.conf


    auth,authpriv.* - /var/log/auth.log

    t.*,authpriv.none - /var/log/sys.log

    ndaemon.* - /var/log/daemon.log

    kern.* - /var/log/kern.log

    mail.* - /var/log/mail.log

    user.* - /var/log/user.log

    *.emerg *


    # End /etc/syslog.conf

    EOF

    ```


