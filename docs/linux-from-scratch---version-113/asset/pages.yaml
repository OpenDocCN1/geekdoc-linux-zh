  md: 'Create the /etc/group file by running the following command:


    ```

    cat > /etc/group << "EOF"

    root:x:0:

    bin:x:1

    sys:x:2

    kmem:x:3

    tape:x:4

    tty:x:5

    daemon:x:6

    floppy:x:7

    disk:x:8\lp:x:9

    dialout:x:10

    audio:x:11

    video:x:12

    utmp:x:13

    usb:x:14

    cdrom:x:15

    adm:x:16

    messagebus:x:18

    input:x:24

    kvm:x:61

    uuid:x:80

    wheel:x:97

    users:x:999

    group:x:65534

    EOF

    ```


    The created groups are not part of any standard—they are decided upon by a number
    of existing Udev configuration in Chapter 9, and in part by common conventions
    employed by Linux distributions. In addition, some tests rely only on specific
    users or groups. The Linux Standard Base (LSB, available at https://refspecs.linuxfoundation.org/lsb.html)
    only recommends that, besides the group root with a Group ID (GID) of 0, a group
    bin with a GID of 1 be present. The GID of 5 is widely used for the tty group,
    and the number 5 is also used in /etc/stab for the devpts filesystem. All other
    group names and GIDs can be chosen freely by the system administrator as well
    programs do not depend on GID numbers, but use the group''s name.


    The ID 65534 is used by the kernel for NFS and user namespaces for unmapped users
    and groups (those exist on the NFS server or the user namespace, but "do not exist"
    on the local machine or in the separate namespace). We assign nobody to avoid
    an unnamed ID. But others might treat this ID differently, so any portable program
    should not depend on this assignment.


    Some in Chapter 8 need a regular user. We add this user here and delete this account
    at the end of this chapter.


    ```

    echo tester:x:101:101:/home/tester:/bin/bash >> /etc/passwd

    echo tester:x:101: >> /etc/group

    install -d /home/tester

    ```


    To remove the "I have no name", start a new shell. Since the /etc/passwd and /etc/group
    files have been created, user name and group name resolution will now work:


    ```

    exec /usr/bin/bash --login

    ```'
