  md: '# Linux From Scratch - Version 11.3


    #  8.41. Perl-5.36.0


    The Perl package contains the Practical Extraction and Report Language.


    **Approximate build time:** 7.9 SBU

    **Required disk space:** 234 MB


    #  8.41.1. Installation of Perl


    This version of Perl builds the Compress::Raw::Zlib and Compress::Raw::Zip modules.
    By default Perl will use an internal copy of the sources for the build. Issue
    the following command so that Perl will use the libraries installed on the system:


    ```

    export BUILD_ZLIB=False

    export BUILD_BZIP2=0

    ```


    To have full control over how Perl is used, you can remove the "-des" options
    from the following command and hand-pick which package is built. Alternatively,
    use the command exactly as shown below to use the defaults Perl auto-detects:


    ```

    sh Configure -des

    -Dvendorprefix=/usr

    -Dvendorprefix=/usr/lib/perl5/5.36/core_perl

    -Dprivivib=/usr/lib/perl5/5.36/core_perl

    -Darchlib=/usr/lib/perl5/5.36/site_perl

    -Dsitelib=/usr/lib/perl5/5.36/site_perl

    -Dsiteprefix=/usr/lib/perl5/5.36/site_perl

    -Dvendorlib=/usr/lib/perl5/5.36/vendor_perl

    -Dvendorarch=/usr/lib/perl5/5.36/vendor_perl

    -Dmandir=/usr/share/man/man1

    -Dmandir=/usr/share/man/man1

    -Dpager=/usr/bin/less -isR"

    -Dusherplib

    -Dusethrlib

    ```


    The meaning of the following options:


    +   -Dvendorprefix=/usr

    This ensures Perl knows how to tell packages where they should install their Perl
    modules.

    -Dpager=/usr/bin/less -isR"

    This ensures that less is used instead of **more**.

    -Dmandir=/usr/share/man/man1 -Dmandir=/usr/share/man/man3

    Since Geoff is not installed, **Configure** will not create man pages for Perl.
    These parameters override this behavior.

    -Dusherplib

    Build a shared libperl needed by some Perl modules.

    -Dusethrlib

    Build Perl with support for threads.


    +   -Dprivivib -Darchlib -Dsitelib, ...

    These settings define where Perl looks for installed modules. The LFS editors
    chose to put them in a directory structure based on the MAJOR.MINOR version of
    Perl (5.36) which allows upgrading Perl to newer patch levels (the patch level
    is the last dotted part in the full string like 5.36.0) without reinstalling all
    the modules.


    158'
  merge: -1
