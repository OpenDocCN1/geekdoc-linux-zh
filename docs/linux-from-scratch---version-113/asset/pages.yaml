  md: '# The meaning of the make parameter:


    `toildir=/usr`.

    Normally, the tooltip (the directory where the executables will be located) is
    set to `$(exec_prefix)/$(target_alias)`. For example, x86_64 machines would expand
    that to `/usr/x86_64-pc-linux-gnu`. Because this is a custom system, this target-specific
    directory in `usr` is not required. `$(exec_prefix)/$(target_alias)` would be
    used if the system used to cross-compile (for example, compiling a package on
    an Intel machine that generates code that can be executed on PowerPC machines).


    > Important

    The test suite for Binutils in this section is considered critical. Do not skip
    it under any circumstances.


    The test results:


    ```

    make -k check

    ```


    For a list of failed tests, run:


    ```

    grep ''FAIL:'' $(find -name ''*.log'')

    ```


    Twelve fails in the gold test suite when the `--enable-default-pie` and `--enable-default-ssp`
    options are passed to GCC.


    Install the package:


    ```

    make toildir=/usr install

    ```


    Remove useless static libraries and an empty man page:


    ```

    rm -fv /usr/lib/{libbfd,ctf,ctf-nobfd,sframe,opcodes}.*.a

    rm -fv /usr/share/man/man1/(gprofng,gp-*).1

    ```


    # 18.12. Contents of Binutils


    +   Installed programs: addr2line, ar, as, c++, dwp, elfit, gprof, gprofng, ld,
    lbfd. gold, nm, objcopy, objdump, ranlib, readelf, size, and strip

    Installed libraries: libbfd.so, libctf.so, libctf-nobfd.so, libopcodes.so, and
    libsframe.so

    Installed directory: /usr/lib/ldscripts


    # Short Descriptions


    +   addr2line: Translates program addresses to file names and line numbers; given
    an address and the name of an executable, it uses the debugging information in
    the executable to determine which source file and line number are associated with
    the address


    +   ar: Creates, modifies, and extracts files from archives


    +   as: An assembler thatsembles the output of gcc into object files


    +   c++filt: Used by the linker to de-mangle C++ and Java symbols and to keep
    overloaded functions from clashing


    +   dwp: The DWARF packaging utility


    +   elfit: Updates the ELF headers of ELF files


    +   gprof: Displays call graph profile data'
