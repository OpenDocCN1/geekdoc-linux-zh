    # 9.4.2. CD-ROM Symlinks


    Some that you may want to install (e.g., various media players) expects the /dev/cdrom
    and /dev/dvd symlinks, and to point to a CD-ROM or DVD-ROM device. Also, it may
    be convenient to put references to these into /etc/stab. Udev uses a script that
    will generate rules to create these symlinks for you, depending on the capabilities
    of each device, but you need to decide which of two modes of operation you wish
    to


    First, one can create in "by-path" mode (used default for USB and FireWire devices),
    where the rules it depends on the physical path to the CD or DVD device. Second,
    it can create in "by-id" mode (default for IDE and SCSI devices), where the rules
    depends on identification strings stored on the CD or DVD device itself. The path
    is determined by udev''s path_id, and the identification strings are generated
    by the hardware by its ata_id or scsi_id, depending on what type of device you
    use.


    There are advantages to each approach; the correct approach depends on what kinds
    of devices may change. If you expect the physical path to the device (it is, the
    ports/slots it plugs into) to change, for example because you plan on moving your
    drive to a different IDE port or a USB connector, then you should use the "by-id"
    mode. On the other hand, if you expect the device''s identification to change,
    for example because it may die, and you intend to replace it with a different
    device that plugs into the same connectors, then you should use the "by-path"
    mode.


    If either type of change is possible with your drive, then choose a mode based
    on the type of device you expect to have more.


    > Important External devices (for example, a USB-connected CD drive) should not
    use by-path persistence, because each time the device is plugged into a new external
    port, its physical path will change. All externally-connected devices will have
    this problem if you write udev rules to recognize them by their physical path;
    the problem is not limited to CD and DVD drives.


    If you wish to see the values that the udev rules will use, for the appropriate
    CD-ROM device, the corresponding directory under /sys (e.g., this is /sys/block/hdd)
    and run a command like the following:


    ```

    udev test /sys/block/hdd

    ```


    Look at the lines output of various *_id parameters. The "by-id" mode will use
    the SERIAL value if it exists and is not empty, otherwise it will use a combination
    of ID_MODEL and ID_REVISION. The "by-path" mode will use the ID_PATH value.


    If the default mode is not suitable for your situation, then the following modification
    can be made to the /etc/udev/rules.d/83-cdrom-symlinks.rules file, as follows
    (where mode is one of "by-id" or "by-path"):


    ```

    sed -e ''s/write_cd_rules/write_cd_rules/'' \

    -i /etc/udev/rules.83-cdrom-symlinks.rules

    ```


    234'
