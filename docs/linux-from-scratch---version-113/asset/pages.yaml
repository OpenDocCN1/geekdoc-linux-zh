- img_proc: true
  md: '# Linux From Scratch - Version 11.3


    # 8.2. Package Management


    Package Management is an often requested addition to the LFS Book. A Package Manager
    tracks the installation of files, making it easier to remove and upgrade packages.
    A good package manager will also handle the configuration files specifically to
    keep the user configuration when the package is reinstalled or upgraded. Before
    you begin to wonder, NO—this section will not talk about any particular package
    manager. What it does provide is a roundup of the more popular techniques and
    how they work. The perfect package manager for you may be among these techniques,
    or it may be a combination of two or more of these techniques. This section briefly
    mentions issues that may arise when upgrading packages.


    Some reasons why no package management is mentioned in LFS or BLFS include:


    +   - Dealing with package management takes the focus away from the goals of these
    books—teaching how a Linux system is built.

    - There are multiple solutions for package management, each having its strengths
    and drawbacks. Finding one satisfies all audiences is difficult.


    There are some hints written on the topic of package management. Visit the Hints
    Project and if one of them fits your needs.


    # 8.2.1. Upgrade Issues


    A Package Manager makes it easy to upgrade to newer versions when they are released.
    Generally the instructions in the LFS and BLFS books be used to upgrade to the
    newer versions. Here are some points that you should be aware of when upgrading
    packages, especially on a running system.


    +   - If the kernel needs to be upgraded (for example, from 5.10.17 to 5.10.18
    or 5.11.1), nothing else needs to be rebuilt. The system will keep working fine
    until the well-defined interface between the kernel and userspace. Specifically,
    Linux API headers need not (and should not be, the next item) upgraded along with
    the kernel. You will merely to reboot your system to use the upgraded kernel.


    +   - If the Linux API headers or Glibc need to be upgraded to a newer version,
    (e.g., from Glibc-2.31 to Glibc-2.32), it is safer to rebuild LFS. You may be
    to rebuild all the packages in their dependency order, we do not recommend it.


    +   - If a package containing a shared library is updated, and the name of the
    library changes, then any packages dynamically linked to the library must be rebuilt,
    to link against the newer library. (Note that there is no correlation between
    the package version and the name of the library). For example, consider a package
    libfoo-1.2.3 that installs a shared library with name libfoo.so.1. Suppose you
    upgrade the package to a newer version libfoo-1.2.4 that installs a shared library
    with name libfoo.so.2. In this case, any packages that are dynamically linked
    to libfoo.so.1 need to be recompiled to link against libfoo.so.2 in order to use
    the newer library. You should not remove the old libraries until all the dependencies
    have been recompiled.


    +   - If a package containing a shared library is updated, and the name of the
    library doesn''t change, but the number of the library file is changed from libfoo.so.1.23
    to libfoo.so.1.24), you should remove the library file from the previously installed
    version (libfoo.so.1.25 in this case). Otherwise, ldconfig (invoked by yourself
    the command line, or by installation of some package) will reset the symlink libfoo.so.1
    to point to the old library file because it seems to a “newer” version; version
    number is larger. This situation may arise if you have to downgrade a package,
    or if the authors change the versioning scheme for library files.


    91'
