  md: '# ## 8.39. Inetutils-2.4


    The Inetutils package contains programs for basic networking.


    Approximate build time: 0.2 SBU

    Required disk space: 31 MB


    # ## 8.39.1. Installation of Inetutils


    Prepare Inetutils for compilation:


    ```

    ./configure --prefix=/usr

    --bindir=/usr/bin

    --localestatedir=/var

    --disable-logger

    --disable-whois

    --disable-rcp

    --disable-reexec

    --disable-rlogin

    --disable-rash

    --disable-servers

    ```


    The meaning of the configure options:


    --disable-logger

    This option prevents Inetutils from installing the **logger** program, which is
    used by scripts to pass messages to the System Log Daemon. Do not install if Util-linux
    has a more recent version.


    --disable-whois

    This option disables the building of the Inetutils **whois** client, which is
    out of date. Instructions for a better **whois** client are in the BLFS book.


    --disable-r*

    These parameters disable obsolete programs that should not be used due to security
    issues. The functions provided by these programs can be provided by the openssh
    package in the BLFS book.


    --disable-servers

    This disables the installation of the various network servers included as part
    of the Inetutils package. These servers are deemed inappropriate in a basic LFS
    system. They are insecure by nature and are only considered safe on trusted networks.
    Note that better replacements are available for many of these servers.


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```


    Move a program to the proper location:


    ```

    mv -v /usr/$(s)bin/ifconfig

    ```


    # ## 8.39.2. Contents of Inetutils


    **Installed programs:** dnsdomain, ftp, ifconfig, hostname, ping, ping6, talk,
    telnet, tftp, and traceroute'
