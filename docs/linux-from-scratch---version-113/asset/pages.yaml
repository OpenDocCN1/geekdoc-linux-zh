  md: '# Linux From Scratch - Version 11.3


    CONFIG_SITE=$LFS/share/config.site


    In Chapter 5 and Chapter 6, if this variable is not set, configure scripts may
    attempt to load configuration items specific to some distributions /usr/share/config.site
    on the host system. Override it to prevent potential contamination from the host.


    export ...


    While the preceding commands have set some variables, in order to make them visible
    within any sub-shells, export them.


    ![](img/c16cbac469aa0406bb9ef00108f8651d_52_0.png)


    # Important


    Several commercial distributions add an undocumented instantiation of /etc/bash.bashrc
    to the initialization of bash. This file has the potential to modify the user''s
    environment in ways that can affect the building of critical LFS packages. To
    make sure the lfs user''s environment is clean, check for the presence of /etc/bash.bashrc
    and, if present, move out of the way. As root user:


    ```

    [ -e /etc/bash.bashrc ] || mv -v /etc/bash.bashrc /etc/bash.bashrc.NOUSE

    ```


    When the lfs user is no longer needed (at the beginning of Chapter 7), you may
    safely restore /etc/bash.bashrc (if desired).


    Note that the LFS package we will build in Section 8.34, "Bash-2.15" is not configured
    to load or execute /etc/bash.bashrc, so this file is useless on a completed LFS
    system.


    Finally, to ensure the environment is fully prepared for building the temporary
    tools, the bash will read the new user profile:


    ```

    source ~/.bash_SBUs

    ```


    # 4.5. About SBUs


    Many people would like to know beforehand how long it takes to compile and install
    each package. Because Linux From Scratch can be built on many different systems,
    it is impossible to provide absolute time estimates. The biggest package (gcc)
    will take approximately 5 minutes on the fastest systems, but can take days on
    slower systems! Instead of providing actual times, the Standard Build Unit (SBU)
    will be used instead.


    The SBU measure works as follows. The first package to be compiled is binutils
    in Chapter 5. The time it takes to compile using one core is what we refer to
    as the Standard Build Unit or SBU. All other times will be expressed in terms
    of this unit.


    For example, a package whose compilation time is 4.5 SBUs. This means that if
    your system takes 10 minutes to compile and install the first pass of binutils,
    it will take approximately 45 minutes to build the example package. Fortunately,
    most builds will be shorter than one SBU.


    SBUs are not entirely accurate because they depend on many factors, including
    the host system''s version of GCC. They are provided here to give an estimate
    of how long it might take to install a package, but the numbers can vary by much
    as dozens of minutes in some cases.


    34'
