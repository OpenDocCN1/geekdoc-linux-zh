  md: 'If a package containing a shared library is updated, and the name of the library
    doesn''t change, but a severe issue (especially, a security vulnerability) is,
    all running programs linked to the shared library should be restarted. The following
    command, run as root after the update is complete, will list which processes are
    using the old versions of those libraries (replace lib with the name of the library):


    ```

    grep -e ''lib.*deleted'' /proc/*/maps |

    t tr -cd 0-9\n | xargs -r ps u

    ```


    If OpenSSH is being used to access the system and it is linked to the updated
    library, you must restart the sshd service, logout, login again, and rerunning
    the ps command to ensure that nothing is still using the deleted libraries.


    If an executable program or a shared library is overwritten, the processes using
    the code or data in that program or library may crash. The correct way to update
    a program or a shared library without causing the process to crash is to it first,
    then install the new version. The install command provided by calculi has already
    implemented this, and most packages use that command to install binary files and
    libraries. This means that you won''t be troubled by this most of the time. However,
    the process of some packages (notably Mozilla JS in BLFS) overwrites the file
    if it exists; this causes a crash. It''s safer to save your work and close unwanted
    processes before updating a package.


    # ## 8.2.2. Package Management Techniques


    The following are some common package management techniques. Before making a decision
    on a package manager, do some research on the various techniques, particularly
    the drawbacks of each particular scheme.


    # ### 8.2.2.1. It is All in My Head!


    Yes, this is a package management technique. Some folks do not need a package
    manager because they know the packages intimately and know which files are installed
    by each package. Some users also do not need any package management because they
    plan on rebuilding the entire system whenever a package is changed.


    # ### 8.2.2.2. Install in Separate Directories


    This is a simplistic management technique that does not need a special program
    to manage the packages. Each package is installed in a separate directory. For
    example, package foo-1.1 is installed in /usr/pkg/foo-1.1 and a symlink is made
    from /usr/pkg/foo to /usr/pkg/foo-1.2. When a new version foo-1.2 comes along,
    it is installed in /usr/pkg/foo-1.2 and the previous symlink is replaced by a
    symlink to the new version.


    Environment variables such as PATH, LD_LIBRARY_PATH, MANPATH, INFOPATH and CPPFLAGS
    need to be expanded to include /usr/pkg/foo. If you have more than a packages,
    this scheme becomes unmanageable.


    # ### 8.2.2.3. Symlink Style Package Management


    This is a variation of the previous package management technique. Each package
    is installed as in the previous scheme. But instead of making the symlink via
    a generic package name, each file is symlinked into the /usr hierarchy. This removes
    the need to expand the environment variables. The symlinks can be created by the
    user, many package managers use this approach, and automate the creation of the
    symlinks. A few of the popular ones include Stow, Epkg, Graft, and Depot.'
