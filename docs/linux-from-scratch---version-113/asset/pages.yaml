  md: '# Linux From Scratch - Version 11.3


    > > Warning

    The FHS does not mandate the existence of the directory /usr/lib64, and the LFS
    editors have decided not to use it. For the instructions in LFS and BLFS to work
    correctly, it is imperative that this directory be non-. From time to time you
    should verify that it does not exist, because it is easy to create it inadvertently,
    and this will probably break your system.


    # # 7.6. Creating Essential Files and Symlinks


    Historically, Linux maintained a list of the mounted files systems in the file
    /etc/mtab. Modern kernels maintain this list internally and expose it to the user
    via the /proc filesystem. To satisfy utilities that find /etc/mtab, create the
    following symbolic link:


    ```

    ln -sv /proc/self/mounts /etc/mtab

    ```


    Create a basic /etc/hosts file to be referenced in some test suites, and in one
    of Perl''s configuration files as well:


    ```

    cat > /etc/hosts << EOF

    127.0.0.1 localhost $(hostname)

    ::1 localhost

    EOF

    ```


    In order for root to be able to login and for the name "root" to be recognized,
    there must be relevant entries in the /etc/passwd and /etc/group files.


    Create the /etc/passwd file by running the following command:


    ```

    cat > /etc/passwd << "EOF"

    root:x:0:0:root:/root:/bin/bash

    bin:x:1:1:bin:/dev/null:/usr/bin/false

    demon:x:6:6:Daemon User:/dev/null:/usr/bin/false

    messagebus:x:18:18:D-Bus Message Daemon:/run/dbus:/usr/bin/false

    uuid:x:80:80:UUID Generation Daemon User:/dev/null:/usr/bin/false

    body:x:65534:65534:Unprivileged User:/dev/null:/usr/bin/falsenEOF

    ```


    The actual password for root will be set later.


    78'
