  md: '# Preface


    # Foreword


    My journey to learn and better understand Linux began back in 1998. I had just
    installed my first Linux distribution and had quickly become intrigued with the
    whole concept and philosophy behind Linux.


    There are always many ways to accomplish a single task. The same can be said about
    Linux distributions. A great many have existed over the years. Some still exist,
    have morphed into something else, yet others have been relegated to our memories.
    I do many things differently to suit the needs of their target audience. Because
    many different ways to accomplish the same end goal exist, I began to realize
    no longer had to be limited by any one implementation. Before discovering Linux,
    we simply put up with other Operating Systems as we had no choice. It was what
    it was, whether you liked it or not. With Linux, the concept of choice became
    emerge. If you were free, encouraged to change it.


    I tried a number of distributions and did not decide on any one. They were great
    systems in their own right. It was a matter of right and wrong anyone. It became
    a matter of personal taste. With all choice available, it became apparent that
    there would not be a single system that would be perfect for me. So I set out
    to create my own Linux system that would fully conform to my personal preferences.


    To truly make my own, I resolved to compile everything from source code instead
    of using pre-compiled binary packages. This "perfect" Linux system would have
    the strengths of various systems without their perceived weaknesses. In all, the
    idea was rather daring. I remained committed to the idea that a system could be
    built.


    After sorting through issues such as circular dependencies and compile-time errors,
    I finally built a custom-built Linux system. It was fully operational and perfectly
    usable like any of the Linux systems out there at the time. But it was my own
    creation. It was very satisfying to have put such a system myself. The only thing
    better would have been to create each piece of software myself. This was the next
    best thing.


    As I shared my goals and experiences with other members of the Linux community,
    it became apparent that there was a sustained interest in these ideas. It quickly
    became plain that such custom-built Linux systems serve not only to meet specific
    user requirements, but also serve as an ideal learning opportunity for programmers
    and system administrators to enhance their (existing) Linux skills. Out of this
    broadened interest, the Linux From Scratch Project was born.


    This Linux From Scratch book is the core around that project. It provides the
    guidance and instructions necessary for you to design and build your own system.
    This book provides a template that will be in correctly working system, or you
    are free to alter the instructions to suit yourself, which is, in, an important
    part of this project. You remain in control; we lend a helping hand to get you
    started on your own journey.


    I sincerely hope you will have a great time working on your own Linux Scratch
    system and enjoy the numerous benefits of having a system that is truly yours.


    ```

    --

    Gerard Beekmans

    gerard@linuxfromscratch.org

    ```


    # Audience


    There are many reasons why you would want to read this book. One of the questions
    many people raise, "why go through all the hassle of manually building a Linux
    system from scratch when you can just download and install an existing one?"'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Linux From Scratch - Version 11.3


    One important reason for this project''s existence is to help you learn how a
    Linux system works from the inside out. Building an LFS system demonstrates what
    Linux tick, and how things work together and depend on each other. One of the
    best things this learning experience can provide is the ability to customize a
    Linux system to suit your unique needs.


    Another benefit of LFS is that you get control of the system without relying on
    anyone else''s implementation. With LFS, you are in the driver''s seat. You dictate
    every aspect of your system.


    LFS allows you to create compact Linux systems. With other distributions you are
    often forced to install a great programs that neither use nor understand. These
    programs waste resources. You may argue that today''s hard drives and CPUs, wasted
    resources are no longer a consideration. Sometimes, you are still constrained
    by the system''s size, if nothing else. Unlike booting CDs, USB sticks, and embedded
    systems. Those are areas where LFS can be beneficial.


    Another advantage of a custom built Linux system is security. By compiling the
    entire system from source code, you are empowered to audit everything and all
    the security patches you want. You don''t have to wait for somebody to compile
    binary packages that fix a security hole. Unless you examine the patch and implement
    it yourself, you have no guarantee that the new binary package was built correctly
    and adequately fixes the problem.


    The goal of Linux Scratch is to build a complete and usable foundation-level system.
    If you do not wish build your own Linux system from scratch, you may nevertheless
    benefit from the information in this book.


    There are many good reasons to build your LFS system to list them all. In the
    end, education is by far the most important reason. As you continue your LFS experience,
    you will discover the power that information and knowledge can bring.


    # LFS Target Architectures


    The primary target architectures of LFS are the AMD/Intel x86 (32-bit) and x86_64
    (64-bit) CPUs. On the other hand, the instructions in this book are also known
    to work, with some modifications, with the Power PC and ARM CPUs. To build a system
    that utilizes one of the alternative CPUs, the main prerequisite, in to those
    on the next page, is an existing Linux system such as an earlier LFS installation,
    Ubuntu, Red Hat/Fedora, SuSE, or some other distribution that targets architecture.(Note
    that a 32-bit distribution can be installed and used as a host system on a 64-bit
    Intel/computer.


    The gain from building on a 64-bit system, compared to a 32-bit system, is minimal.
    In a test of LFS-9.1 on an i-7490 CPU built, using 4 cores, the following statistics
    were measured:


    | Architecture | Build Time | Build Size |

    |---|---|---|

    | 32-bit | 239.9 min | 3.4 GB |

    | 64-bit | 232.2 min | 4.4 GB |


    As you can see, on the same hardware, the 64-bit build is only 3% faster (and
    22% larger) than the 32-bit build. If you plan to use LFS as a LAMP server, or
    a firewall, a 32-bit CPU may be good enough. On the other hand, several packages
    in BLOCKS need more than 4 GB of RAM to be built and/or if you plan to use LFS
    as a desktop, the LFS authors recommend building a 64-bit system.


    The default 64-bit build that results from LFS is a “pure 64-bit system. Building
    a “multi-lib” system requires compiling applications twice, once for a 32-bit
    system and once for a 64-bit system. This is not directly supported in LFS because
    it would interfere with the educational objective of providing the minimal instructions
    needed for a basic Linux system. Some of the LFS/BLFS editors maintain a multilib
    fork of LFS, accessible at https://www.linuxfromscratch.org/~thomas/multilib/index.html.
    But that’s an advanced topic.'
