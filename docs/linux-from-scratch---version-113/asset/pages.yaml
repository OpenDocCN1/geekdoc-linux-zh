  md: 'The build


    is the machine where we build programs. Note that this machine is also referred
    to as the “host”.


    The host


    is the machine/system where the built programs will run. Note that this use of
    “host” is not the same as in other sections.


    The target


    is only used for compilers. It is the machine the compiler produces code for.
    It may be different from both the build and the host.


    As an example, let us imagine the following scenario (sometimes referred to as
    “Canadian Cross”). We have a compiler on a slow machine only, let’s call machine
    A, and the compiler ccA. We also have a fast machine (B), but no compiler for
    (B), and we want to produce code for a third, slow machine (C). We will build
    a compiler for C in three stages.


    | Stage | Build | Host | Target | Action |

    | 1 | A | A | B | Build cross-compiler cc1 using ccA on machine A. |

    | 2 | A | B | C | Build cross-compiler cc2 using cc1 on machine A. |

    | 3 | B | C | C | Build compiler ccC using cc2 on machine B. |


    Then, all the programs needed by machine C can be compiled using cc2 on the fast
    machine B. Note that unless B can run programs produced for C, there is no way
    to test the newly built programs until machine C itself is running. For example,
    to run a test suite on ccC, we may want to add a fourth stage:


    | Stage | Build | Host | Target | Action |

    | 4 | C | C | C | Rebuild and test ccC using ccC on machine C. |'
