  md: 'During the boot script udev, there is a call to udev settle requires some time.
    This may not be required depending on the devices in the system. If you only have
    simple partitions and a single ethernet card, the boot process will probably not
    wait for this command. To skip it, set the variable OMIT_UDEV_SETTLE=.


    The boot script udev_retry also runs udev settle by default. This command is only
    needed if the /var directory is separately mounted, because the clock /var/lib/hwclock/adjtime
    file. Other customizations may need to wait for udev to complete, but in many
    cases it is not necessary. Skip the command by setting the variable OMIT_UDEV_RETRY_SETTLE=.


    By default, the file system checks are enabled. This can appear to be a delay
    during the booting process. To turn off fsck, set the variable VERBOSE_FSCK.


    When rebooting, you may want to check the file system with fsck. To do this, create
    the file /fastboot or reboot/shutdown -f now. On the other hand, you can force
    all file systems to be checked by creating /forcefsck or running shutdown with
    the -F parameter instead of -f. Setting the variable FASTBOOT= will disable fsck
    during the boot process until it is removed. This is not recommended on a permanent
    basis.


    Normally, all the files in the /tmp directory are deleted at boot time. Depending
    on the number of files or directories, this can cause a delay in the boot process.
    To removing these files set the variable SKIPTMPCLEAN=.


    During startup, the init program sends a TERM signal to each program it starts
    (e.g.), waits for a set time (3 seconds), then sends each KILL signal and waits
    again. This process is repeated in the signals script for any processes that are
    not shut down by their own owners. The delay in init can be set by passing a parameter.
    For example to remove the delay in init, when shutting down or rebooting (e.g
    /bin/shutdown -t0 now). The delay for the signals script can be skipped by setting
    the parameter KILLDELAY=0.


    # 9.7. The Bash Shell Startup Files


    The shell program /bin/bash referred to as the "shell" uses a collection of startup
    files to create the environment to run in. Each file has a specific use and may
    affect login interactive environments differently. The files in /etc provide global
    settings. If equivalent files exist in the home directory, they may override the
    global settings.


    An interactive login is started after a successful login, using /bin/login, by
    reading the /etc/passwd file. An interactive non-login shell is started at the
    command-line (e.g., [prompt]$ /bin/bash). A non-interactive shell is started when
    a shell script is running. It is non-interactive and not waiting for user input
    commands.


    For more information, check the Bash Startup Files and Interactive sections in
    the Bash Features chapter of the Bash pages (info bash).


    The files /etc/profile and ~/.bash_profile are read when the shell is invoked
    as an interactive login shell. The base /etc/profile below sets some environment
    variables necessary for native language support. Setting them properly results
    in:


    +   The output of programs translated into the native language


    +   Correct classification of characters into letters, digits and other classes.
    This is necessary for bash to properly accept non-ASCII characters in command
    lines in non-English locales'
