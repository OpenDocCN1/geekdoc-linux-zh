  md: '# Linux From Scratch - Version 11.3


    the instance of the shell is a non-login shell, which does not read, execute,
    and the contents of the /etc/profile or .bash_profile files, but rather reads,
    executes, the .bashrc file. Create the .profile, but rather reads, executes, the
    .bashrc file. Create the .bashrc file now:


    ```

    cat ~/.bashrc << "EOF"

    set +h

    umask 022

    LFS=$/mnt/lfs

    LC_ALL=POSIX

    LFS_TGT=$(uname -m) -lfs-linux-gnu

    PATH=/usr/bin

    if [ -L /usr/tools/bin:$PATH ]; then PATH=$LFS/usr/share/config.site

    export LFS LC_ALL LFS_TGT CONFIG_SITE

    EOF

    ```


    # The meaning of the settings in .bashrc


    set +h


    The set +h command turns off bash''s hash function. Hashing is ordinarily a useful
    feature—bash uses a table to remember the full path to executable files avoid
    searching the PATH time and to find the same executable. The new tools should
    be used as soon as they are. Switching off the hash function forces the shell
    to search the PATH whenever a program is to run. As such, the shell find the newly
    compiled tools in $LFS/tools/bin as soon as they are available without remembering
    a previous version of the program provided by the distro, in /usr/bin or /bin.


    umask 022


    Setting the user file-creation mask (umask) 022 ensures that newly created files
    and directories are only writable by their owner, but are readable and executable
    by anyone (assuming default modes are used by the open (2) system call, new files
    will end up with permission mode 644 and directories with mode 755).


    LFS=/mnt/lfs


    The LFS variable should be set to the chosen mount point.


    LC_ALL=POSIX


    The LC_ALL variable controls the localization of certain places, making messages
    follow the conventions of a specified country. Setting LC_ALL to "POSIX" or "C"
    (the two are equivalent) ensures that everything works as expected in the cross-ilation
    environment.


    LFS_TGT=$(uname -m)-lfs-linux-gnu


    The LFS_TGT variable sets a non-default, but compatible machine description for
    use when building our cross-compiler and when cross-compiling our temporary toolchain.
    More information is provided by Toolchain Technical Notes.


    PATH=/usr/bin


    Modern Linux distributions have merged /bin and /usr/bin. When this is the case,
    if this is not the case, the standard PATH variable should be set to /usr/bin/
    for the Chapter 6 environment. When adding the lines / and to the path.


    ```

    if [ ! -L /bin ]; then PATH=$/bin:$PATH; fi

    If /bin is not a symbolic link, it must be added to the PATH variable.

    ```


    PATH=$LFS/tools/bin:$PATH


    By putting $LFS/tools/bin ahead of the standard PATH, the cross-compiler installed
    at the beginning of Chapter 5 is picked up by the immediately after its installation,
    combined with turning off hashing, limits the risk that the compiler from the
    host is used instead of the cross-compiler.


    33'
