  md: "# 8.69.2. Configuring Vim\n\nBy default, vim runs in vi-incompatible mode.\
    \ This may be new to users who have used other editors in the past. The \"ncompatible\"\
    \ setting is included below to highlight the fact that a new behavior is being\
    \ used. It also reminds who would change to \"compatible\" mode that it should\
    \ be the first setting in the configuration file. This is necessary because it\
    \ changes other settings, and overrites must come after this setting. Create a\
    \ default vim configuration file by running the following:\n\n```\ncat > /etc/vimrc\
    \ <<\"EOF\"\n  Begin /etc/vimrc\n\n  Ensure defaults are set before customizing\
    \ settings, not after\n  source $VIMRUNTIME/defaults.vim\n  let skip_defaults_vim=1\n\
    \n  set ncompatible\n  set backspace=2\n  set mouse=\n  syntax on\n  if ($term\
    \ == \"xterm\") || ($term == \"putty\")\n    set background=dark\n  endif\nEOF\n\
    ```\n\nThe set compatible setting makes vim behave in a more useful way (the default)\
    \ than the vi-incompatible manager. Remove the to keep the old behavior. The backspace=2\
    \ allows backups over line breaks, autocominds, and the start of an insert. The\
    \ syntax on enables vim's syntax highlighting. The set mouse= enables proper pasting\
    \ of text when you are working in chroma or over a remote connection. Finally,\
    \ the if statement with the set background=dark corrects vim's guess about the\
    \ background color of some terminal emulators. This gives the highlighting a better\
    \ color scheme for the black background of these programs.\n\nDocumentation for\
    \ other available options can be obtained by running the following command:\n\n\
    ```\nvim -c ':options'\n```\n\n> Note\nBy default, vim only installs spell-checking\
    \ files for the English language. To install spell-checking files for your preferred\
    \ language, copy the .spl and optionally, the .sug files for your language and\
    \ character encoding from runtime/spell to /usr/share/vim/vim/90/spell/\n\nTo\
    \ use these spell-checking, in /etc/vimrc is needed, e.g.:\nset spelllang=en,ru\n\
    set spell\n\nFor more information, runtime/spell/README.txt.\n\n# 8.69.3. Contents\
    \ of Vim\n\n+   - Installed programs: ex (link to vim), rview (link to vim), vim\
    \ (link to vim), vi (link to vim), view (link to vim), vim, vimdiff (link to vim),\
    \ vimtutor, and xxd\n- Installed directory: /usr/share/vim"
