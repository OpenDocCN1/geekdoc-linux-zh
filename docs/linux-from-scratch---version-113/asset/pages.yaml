  md: "# 5.5. Glibc-2.37\n\nThe Glibc package contains the C library. This library\
    \ provides the basic routines for allocating memory, searching directories, opening\
    \ and closing files, reading and writing files, string handling, pattern matching,\
    \ arithmetic, and so on.\n\n**Approximate build time:** 1.5 SBU\n**Required disk\
    \ space:** 822 MB\n\n# 5.5.1. Installation of Glibc\n\nFirst, create a symbolic\
    \ link for LSB compliance. Additionally, for x86_64, create a compatibility symbolic\
    \ link required for proper operation of the dynamic library loader:\n\n```\ncase\
    \ $(uname -m) in\n  i386) ln -sf ld-linux.so.2 $LFS/lib/ld-lsb.so.3\n  ;;\n  x86_64)\
    \ ln -sf ../lib/ld-linux-x86-64.so $LFS/lib\n  ;;\n  *) ln -sf ../lib/ld-linux-x86-64.so.2\
    \ $LFS/lib64/ld-lsb-x86-64.so.3\nesac\n```\n\n> The above command is correct.\
    \ The **ln** command has several syntactic versions, so be sure to check **info\
    \ coreutils** and **ln(1)** before reporting what may appear to be an error.\n\
    \nSome of the Glibc programs use the non-FHS-compliant `/var/db` directory to\
    \ store their runtime data. Apply the following patch to make proper programs\
    \ store their runtime data in the FHS-compliant locations:\n\n```\npatch -Npl\
    \ -i .. ../glibc-2.37-fhs-1.patch\n```\n\nThe Glibc documentation recommends building\
    \ Glibc in a dedicated build directory:\n\n```\nmkdir build\ncd build\n```\n\n\
    Ensure that the **ldconfig** and **sln** utilities are installed into `/usr/sbin`:\n\
    \n```\necho \"rootsbindir=/usr/sbin\" > configparms\n```\n\nNext, prepare Glibc\
    \ for compilation:\n\n```\n./configure \\\n  --prefix=$LFS \\\n  --host=$LFS_TGT\
