    # 2.3. Building LFS in Stages


    LFS is designed to be built in one session. That is, the instructions assume the
    system will not be shut down during the process. The issue is that certain procedures
    must be repeated after a reboot when resuming LFS at different points.


    # 2.3.1. Chapters 1–4


    These chapters run commands on the host system. When restarting, certain of one
    thing:


    +   - Procedures performed as the root user after Section 2.4 must have the LFS
    environment variable set FOR THE ROOT USER.


    # 2.3.2. Chapters 5–6


    +   - The /mnt/lfs partition must be mounted.

    - These chapters must be done as user lfs. A su - lfs command must be issued before
    performing any task in these chapters. If you do not, you are at risk of installing
    packages to the host, and potentially rendering it unusable.

    - The procedures in General Compilation Instructions are critical. If there is
    any doubt a package has been installed correctly, ensure the previously expanded
    tarball has been removed, then re-extract the package, and complete all instructions
    in that section.


    # 2.3.3. Chapters 7–10


    +   - The /mnt/lfs partition must be mounted.

    - A few operations, from “Changing Ownership” to “Entering the Chroot Environment”,
    must be done as the root user, with the LFS environment variable set for the root
    user.'
