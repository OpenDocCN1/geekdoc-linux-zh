  md: '# Prerequisites


    Building an LFS is not a simple task. It requires a certain level of existing
    knowledge of Unix administration in order to resolve problems and correctly execute
    the commands listed. In particular, as an absolute minimum, you should already
    know how to use the command line (shell) to copy or move files and directories,
    list directory and file contents, and change the current directory. It is also
    expected that you know how to install Linux software.


    Because the LFS book asks at least this basic level of skill, the LFS support
    forums are unlikely to provide you with much assistance in these areas. You will
    find that your questions regarding such basic knowledge will likely go unanswered
    (or you will be referred to the LFS assistance pre-reading list).


    Before building LFS, we urge you to read these articles:


    +   - Software-Building-HOWTO https://tldp.org/HOWTO/Software-Building-HOWTO.html


    This is a comprehensive guide to building and installing "generic" software packages
    under Linux. Although it was written some time ago, it still provides a good summary
    of the basic techniques used to build and install software.


    +   - Beginner''s Guide to Installing from Source https://moi.vonos.net/linux/beginners-installing-from-source/


    This guide provides a good summary of the basic skills and techniques needed to
    build software from source code.


    # LFS and Standards


    The structure of LFS follows Linux standards as closely as possible. The primary
    standards are:


    +   - POSIX-1-2008.

    - Filesystem Hierarchy Standard (FHS) Version 3.0

    - Linux Base Standard (LSB) Version 5.0 (2015)


    The LSB has four separate specifications: Core, Desktop, Runtime Languages, and
    Imaging. Some parts of Core and Desktop specifications are architecture specific.
    There are also two trial specifications: Gtk3 and Graphics. LFS attempts to conform
    to the LSB specifications for the IA32 (32-bit x86) or AMD64 (x86_64) architectures
    discussed in the previous section.


    > Note Many people do not agree with these requirements. The main purpose of the
    LSB is to ensure that proprietary software can be installed and run on a compliant
    system. Since LFS is source based, the user has complete control over what packages
    are installed; you may choose not to install some packages that are specified
    by the LSB.


    While it is possible to create a complete system that will pass the LSB certification
    tests "from scratch", this cannot be done without many additional packages that
    are beyond the scope of the LFS book. Installation instructions for these additional
    packages can be found in BLFS.


    # Packages supplied by LFS to satisfy the LSB Requirements


    LSB Core: Bash, Bc, Coreutils, Diffutils, File, Findutils, G, Grep, Gzip, M4,
    Man-DB, Ncurses, Propcs, Psmisc, Sed, Shadow, Tar, Util-linux, Zlib'
