  md: '# Note


    For modern systems with multiple processors (or cores) the compilation time for
    a package can be reduced by performing a "parallel make" by either setting an
    environment variable or telling the make program how many processors are available.
    For instance, an Intel i5-6500 CPU can support four simultaneous processes:


    ```

    export MAKEFLAGS=''j4''

    ```


    or by building with:


    ```

    make -j4

    ```


    When multiple processors are used in this way, the SBU units in the book will
    vary even more than they normally would. In some cases, the make step will simply
    fail. Analyzing the output of the build process will be more difficult because
    the lines from different processors will be interleaved. If you run into a problem
    with a build step, revert to a single processor to properly analyze the error
    messages.


    The times presented here are based using four cores (-j4). The times in Chapter
    8 also include the time to run the regression tests for the package unless specified
    otherwise.


    # 4.6. About the Test Suites


    Most packages provide a test suite. Running the test suite for a newly built package
    is a good idea because it can provide a "sanity check" indicating that everything
    compiled correctly. A test suite that passes its checks usually means that the
    package is functioning as the developer intended. It does not, however, guarantee
    its package is totally bug free.


    Some test suites are more important than others. For example, the test suites
    for the core toolchain packages—GCC, binutils, and glibc—are of the utmost importance
    due to their central role in a properly functioning system. The test suites for
    GCC and glibc can take a very long time to complete, especially on slower hardware,
    but are strongly recommended.


    # Note


    Running the test suites in Chapter 5 and Chapter 6 is pointless; since the test
    programs are compiled with a cross-compiler, they probably can''t run on the build
    host.


    A common issue when running the test suites for binutils and GCC is running out
    of pseudo terminals (PTYs). This may happen for several reasons, but the most
    likely cause is that the host system does not have the devpts file system set
    up correctly. This issue is discussed in greater detail at https://www.linuxfromscratch.org/lfs/faq.html#no-ptys.


    Sometimes test suites will fail for reasons which the developers are aware of
    and have deemed non-critical. Consult the logs located at https://www.linuxfromscratch.org/lfs/build-logs/11.3/
    to verify whether or not these failures are expected. This site is valid for all
    test suites throughout this book.'
