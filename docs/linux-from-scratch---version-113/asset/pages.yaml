  md: 'When entering chroot, the LFS environment variable must be set for root. The
    LFS variable is not used after the chroot environment has been entered.


    The virtual file systems must be mounted. This can be done before or after entering
    chroot by changing to a host terminal virtual, and as root, running the commands
    in Section 7.3.1, "Mounting and Populating /dev" and Section 7.3.2, "Mounting
    Virtual File Systems".


    # 2.4. Creating a New Partition


    Like other operating systems, LFS is usually installed on a dedicated partition.
    The recommended approach to building an LFS system is to use an available empty
    partition, or if you have enough unpartitioned space, to create one.


    A minimal system requires a partition of around 10 gigabytes (GB). This is enough
    to store all the sources and compile the packages. However, if the LFS is intended
    to be the primary Linux system, additional software will probably be installed
    with additional space. A 30 GB partition is a reasonable size to provide for it.
    The LFS system itself will not take up much room. A large portion of this requirement
    is to provide sufficient temporary storage as well as for additional capabilities
    after LFS is complete. Additionally, compiling packages require quite a lot of
    disk space which will be reclaimed after the package is installed.


    Because there is not enough Random Access Memory (RAM) available for compilation
    processes, it is a good idea to use a small disk partition to store seldom used
    data and leave memory available for active processes. The swap partition for an
    LFS system can be the same as the one used by the host system, in which case it
    is not necessary to create another.


    Start a partition using such as cfdisk or fdisk with a command line option naming
    the new partition created—example /dev/sda for the primary drive. Create a Linux
    native partition and a swap partition, if needed. Please refer to cfdisk(8) or
    fdisk(8) if you do not know how to use the programs.


    > Note

    For experienced users, other partitioning schemes are possible. The new LFS system
    can be on a software RAID array or LVM logical volume. However, some of these
    require an initramfs, which is an advanced topic. These partitioning methodologies
    are not recommended for first time LFS users.


    Remember the designation of the new partition (e.g., sda5). This book will refer
    to this the LFS partition. Remember the designation of the swap partition. These
    names will be needed later for the /etc/fstab table.


    # 2.4.1. Other Partition Issues


    Requests for advice on system partitioning are often posted on the LFS mailing
    lists. This is a highly subjective topic. The default for most distributions is
    to use the entire drive with the exception of one swap partition. This is not
    optimal for LFS for several reasons. It reduces flexibility, makes sharing of
    data across multiple distributions or LFS builds more difficult, makes backups
    more consuming, and can waste disk space through inefficient allocation of file
    systems.


    # 2.4.1.1. The Root Partition


    A root partition (not to be confused with the /root directory) of twenty gigabytes
    is a good compromise for most systems. It provides enough space to build LFS and
    most of BLFS, but is small enough so that multiple partitions can be easily created
    for experimentation.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# 2.4.1.2. The Swap Partition


    Distributions automatically create a swap partition. Generally the recommended
    size of the swap partition is about twice the size of physical RAM, however this
    is rarely needed. If disk space is limited, hold the swap partition to two gigabytes
    and monitor the amount of disk swapping.


    If you want the hibernation feature (suspend-to-disk) of Linux, it writes out
    the contents of RAM to the partition before turning off the machine. In this case
    the size of the swap partition should be at least as large as the system''s installed
    RAM.


    Swapping is never good. For mechanical hard drives you can generally tell if a
    system is swapping by listening to disk activity and observing how the system
    reacts to commands. With an SSD you will not hear swapping, but you can tell how
    much space is being used by running the top or free programs. Use of an SSD for
    a swap partition should be avoided if possible. The first reaction to swapping
    should be checked for an unreasonable command as trying to delete a five gigabyte
    file. If swapping becomes a normal occurrence, the best solution is to purchase
    more RAM for your system.


    # 2.4.1.3. The Grub Bios Partition


    If the boot disk has been partitioned with a GUID Partition Table (GPT), then
    a small, typically 1 MB, partition must be created if it does not already exist.
    This partition is not formatted, but must be available for GRUB to use during
    installation of the boot loader. This partition will normally be labeled ''BIOS''
    if fdisk or have type EF02 if gdisk command.


    > The Bios partition must be on the drive that the BIOS uses to boot the system.
    This is not necessarily the drive that holds the LFS root partition. The disks
    on a system may use different partition types. The necessity of the Grub Bios
    partition depends only on the partition type of the boot disk.


    # 2.4.1.4. Convenience Partitions


    There are other partitions that are not required, but should be considered when
    designing a disk layout. The following list is not comprehensive, but is meant
    as a guide


    +   * Highly recommended. Use this partition to store kernels and other booting
    information. To minimize potential problems with larger disks, make this the first
    partition on your first disk drive. A partition size of 200 megabytes is adequate.

    * The EFI System Partition, which is needed for booting the system with UEFI.
    Read the BLFS page for details.

    * Highly recommended. Share your home directory and user customization across
    multiple distributions or LFS builds. This is generally largely find and depends
    on available disk space.

    * — In LFS, /bin, /lib, and /sbin are symlinks to their counterparts in /usr.
    So /usr contains all the binaries needed for the system to run. For LFS a separate
    partition for /usr is not needed. If you create any, you should make a partition
    to fit all the programs and libraries in the system. The root partition can be
    very small (maybe just one gigabyte) in this configuration, it''s suitable for
    a client or diskless workstation (where /usr is mounted from a remote server).
    However, you should be aware that an initramfs (not covered by LFS) will be needed
    to boot a system with a separate /usr partition.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Linux From Scratch - Version 11.3


    +   - /opt – This directory is most useful for BLFS, where multiple packages KDE
    or Texline can be installed without embedding the files in the /usr hierarchy.
    If used, 5 to 10 gigabytes is generally adequate.


    +   - /tmp – A separate tmp directory is rare, unless if configuring a thin client.
    This partition, if used, will not need to exceed a couple of gigabytes. If you
    have enough RAM, you can mount a tmpfs on /tmp to make temporary files faster.


    +   - /usr/src – This partition is very useful for providing a location to store
    BLFS source files and share them across LFS builds. It can also be used as a location
    for building BLFS packages. A reasonably large partition of 30-50 gigabytes provides
    plenty of space.


    Any separate partition that you want automatically mounted when the system starts
    must be specified in the /etc/fstab file. Details about how to specify partitions
    will be discussed in Section 10.2, "Creating the /etc/fstab File".


    # 2.5. Creating a File System on the Partition


    A partition is a range of sectors on a disk drive, delimited by boundaries in
    a partition table. Before the operating system can use a partition to store any
    files, the partition must be formatted to contain a file system, typically consisting
    of a label, directory blocks, data blocks, and an indexing scheme to locate a
    particular file on demand. The file system also helps the OS keep track of free
    space on the partition, recover the needed sectors when a new file is created
    or an existing file is extended, and recycle the free data segments created when
    files are deleted. It may also provide support for redundancy, and for error recovery.


    LFS can use any file system recognized by the Linux kernel, but the most common
    types are ext3 and ext4. The choice of the right file system can be complex; it
    depends on the characteristics of the files and the size of the partition.


    +   ext2

    is suitable for small partitions that are updated frequently such as /boot.


    +   ext3

    is an upgrade to ext2 that includes a journal to help recover the partition''s
    status in the case of an unclean shutdown. It is commonly used as a general purpose
    file system.


    +   ext4

    is the latest version of the ext family of file system. It provides several new
    capabilities nano-second timestamps, creation and use of very large files (up
    to 10 TB), and speed improvements.


    Other file systems, including FAT32, NTFS, ReiserFS, and XFS are used for specialized
    purposes. More information about these file systems, and many others, can be found
    at https://en.wikipedia.org/wiki/Comparison_of_file_systems.


    LFS assumes the root file system (/) is of ext4. To create an ext4 file system
    on the LFS partition, issue the


    ```

    mkfs -v -t ext4 /dev/<xxx>

    ```


    Replace <xxx> with the name of the LFS partition.


    If you are using an existing swap partition, there is no need to format it. If
    a new swap partition was created, it will need to be initialized with this command:


    ```

    mkswap /dev/<yyy>

    ```


    Replace <yyy> with the name of the swap partition.'
  merge: -1
