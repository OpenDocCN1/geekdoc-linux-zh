    # 9.4.3 Dealing with Duplicate Devices


    As explained in Section 9.3, "Overview of Device and Module Handling,” order in
    devices with the same function appear is essentially random. E.g., if you have
    a USB camera and a TV tuner, sometimes /dev/video0 refers to the camera and /dev/video1
    refers to the tuner, and sometimes after a reboot the order changes. The case
    of all hardware except network cards and yoktur, so forth, is fixable by creating
    udev rules to create persistent symlinks. The case of network cards is covered
    separately in Section 9.5, "General Network Configuration," and sound card configuration
    can be found in BLFS.


    For each of your devices that is likely to have this problem (even if the problem
    does not exist in your current Linux distribution), find the corresponding directory
    under /sys/class or /sys/block. For video devices, this may be /sys/class/video4linux/videoX.
    Figure out the attributes that identify the device (usually, vendor and product
    IDs and serial numbers):


    ```

    udev info -a -p /sys/class/video4linux/video0

    ```


    Then write rules that create the symlinks, e.g.:


    ```

    cat > /etc/udev/rules.d/83-duplicate_dev.rules << "EOF"

    # Persistent symlinks for webcam and tuner

    KERNEL="video", ATTRS(idProduct)="1910", ATTRS(idVendor)="0d81", SYMLINK="webcam"

    KERNEL="video", ATTRS(device)="0x063f", ATTRS(vendor)="0109e", SYMLINK+="tuner"

    EOF

    ```


    The result is that /dev/video0 and /dev/video1 still refer to the tuner and the
    camera (and that should never be desired), but there are symlinks /dev/twtuner
    and /dev/webcam that always point to the correct device.


    # 9.5. General Network Configuration


    # 9.5.1. Creating Interface Configuration Files


    The files in /etc/sysconfig/ determines which interfaces are brought up and down
    by the network script. This directory should contain a file for each interface
    to be configured, as "xyz" describes the network card. The interface name (e.g.
    eth0) is usually appropriate. Each file contains the attributes of one interface,
    such as its IP address(es), subnet mask, and so forth. The format of the file
    is ifconfig.


