  md: '# 5.2. Binutils-2.40 - Pass 1


    The Binutils package contains a linker, an assembler, and other tools for handling
    object files.


    Approximate build time: 1 SBU

    Required disk space: 639 MB


    # 5.2.1. Installation of Binutils


    > Note

    Go back and re-read the notes in the section titled General Compilation Instructions.
    Understanding the labeled important can save you from some problems later.


    It is important that Binutils is the first package compiled because both Glibc
    and GCC perform various tests on the available linker and assembler to determine
    which of their own features to enable.


    The Binutils documentation recommends building Binutils in a dedicated build directory:


    ```

    mkdir -v build

    cd build

    ```


    > Note

    For the SBU values listed in the rest of the book to be of any use, measure the
    time it takes to build this package from the configuration, up to and including
    the first. To achieve this easily, wrap the commands in a time like this: time
    ($/configure ... $$ make $$j6 $$ make install);


    Now prepare Binutils for compilation:


    ```

    ./configure --prefix=$LFS/tools \

    --with-sysroot=$LFS \

    --target=$LFS_TGT \

    --disable-nls \

    --enable-goprof=no \

    --disable-werror

    ```


    The meaning of the configure options:


    --prefix=$LFS/tools

    This tells the configure script to install the Binutils programs in the $LFS/tools
    directory.


    --with-sysroot=$LFS

    For cross compilation, this tells the build system to look in $LFS for the target
    system libraries.


    --target=$LFS_TGT

    Because the machine in the $LFS_TGT variable is slightly different than the value
    returned by the config-guess script, this switch will tell the configure script
    to adjust binutils'' build system for building a cross linker.


    --disable-nls

    This disables internationalization as i18n is not needed for the temporary tools.


    --enable-goprof=no

    This disables building goprof which is not needed for the temporary tools.'
