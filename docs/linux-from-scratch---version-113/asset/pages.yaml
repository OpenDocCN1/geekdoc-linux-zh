    # 8.72.1. Installation of Propcs-ng\n\nPrepare Propcs-ng for compilation:\n\n\
    ```\n./configure --prefix=/usr \\\n    --docdir=/usr/share/doc/propcs-ng-4.0.2\
    \ \\\n    --disable-static \\\n    --disable-kill\n```\n\nThe meaning of the configure\
    \ option:\n\n--disable-kill\nThis switch disables building the kill command; it\
    \ will be installed from the Util-linux package.\n\nCompile the package:\n\n```\n\
    make\n```\n\nTo run the test suite, run:\n\n```\nmake check\n```\n\nOne test named\
    \ free with commit may fail if some applications with a custom memory allocator\
    \ (for example, JVM and Web browsers) are running on the host driver.\n\nInstall\
    \ the package:\n\n```\nmake install\n```\n\n# 8.72.2. Contents of Propcs-ng\n\n\
    +   Installed programs:\nfree, fgrep, pidof, pkill, pmap, ps, pwdx, slabtop, sysctl,\
    \ toad, top, uptime, wstat, w\n watch\nInstalled library:\nlibproc-2.so\nInstalled\
    \ directories:\n/usr/include/propcs and /usr/share/doc/propcs-ng-4.0.2\n\n# Short\
    \ Descriptions\n\n+   free Reports the amount of free and used memory (both physical\
    \ and swap memory) in the system\npgrep Looks up processes based on their name\
    \ and other attributes\npidof Reports the PIDs of the given programs\npkill Signals\
    \ processes based on their name and other attributes\npmap Reports the memory\
    \ map of the given process\nps Lists the current running processes\npwdx Reports\
