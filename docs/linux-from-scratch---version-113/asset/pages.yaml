    # 8.76.2. Contents of Sysvisit


    Installed programs: bootlog, fstab-decode, halt, init, killall5, poweroff (link
    to halt), reboot (link to halt), runlevel, shutdown, and telinit (link to init)


    # Short Descriptions


    +   **bootlog** Logs boot messages to a log file


    +   **fstab-decode** Runs a command with fstab-encoded arguments


    +   **halt** Normally invokes **shutdown** with the -h option, but when already
    in run-level 0, it tells the kernel to halt the system; it notes in the file `/var/log/tmp`
    that the system is going down


    +   **init** The first process to be started when the kernel has initialized the
    hardware; it takes over the boot process and starts all the processes in its configuration
    file


    +   **killall5** Sends a signal to all processes, except the processes in its
    session; it will not kill its parent shell


    +   **poweroff** Tells the kernel to halt the system and switch off the computer
    (**halt**)


    +   **reboot** Tells the kernel to reboot the system (see **halt**)


    +   **runlevel** Reports the previous and the current run-level, as noted in the
    last run-level record in `/run/utmp`


    +   **shutdown** Brings the system down in a secure way, signaling all processes
    and notifying all logged-in users


    +   **telinit** Tells **init** which run-level to change to'
