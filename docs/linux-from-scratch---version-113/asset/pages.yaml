  md: '# # Chapter 2. Preparing the Host System


    # ## 2.1. Introduction


    In this chapter, the host tools needed for building LFS are checked and, if necessary,
    installed. Then a partition which will host the LFS system is prepared. We will
    create the partition itself, create a file system on it, and mount it.


    # ## 2.2. Host System Requirements


    # ### 2.2.1. Hardware


    The LFS editors recommend that the system CPU have at least four cores and that
    the system have at least 8 GB of memory. Older systems that do not meet these
    requirements will still work, but the time to build packages will be significantly
    longer than documented.


    # ### 2.2.2. Software


    Your host system should have the following software with the minimum versions
    indicated. This should not be an issue for most modern Linux distributions. Note
    also that many distributions will place software headers into packages, often
    in the form of "<package-name>-devel" or "<package-name>-dev". Be sure to install
    those if your distribution provides them.


    Earlier versions of the listed software packages may work, but have not been tested.


    +   - Bash-3.2 (/bin/sh should be a symbolic or hard link to bash)

    - Binutils-21.13.1 (Versions greater than 2.40 are not recommended as they have
    not been tested)

    - Bison-2.7 (/usr/bin/yacc should be a link to bison or a simple script that executes
    bison)

    - Coreutils-6.9

    - Diffutils-2.8.1

    - Findutils-4.2.31

    - Gawk-4.0.1 (/usr/bin/awk should be a link to gawk)

    - GCC-5.1 including the C++ compiler, g++ (Versions greater than 12.2.0 are not
    recommended as they have not been tested). C and C++ standard libraries (with
    headers) must also be present so the C++ compiler can build hosted programs

    - Grep-2.5.1a

    - Gzip-1.3.12

    - Linux Kernel-3.2


    The reason for this kernel version requirement is that when building glibc in
    Chapter 5 and Chapter 8, you will need to replace the kernel with a more up-to-date
    version. There are two ways to go about this. First, see if your Linux vendor
    provides a 3.2 or later kernel package, and install it. If your vendor doesn''t
    offer an acceptable kernel package, or you would prefer not to install it, can
    compile a kernel yourself. Instructions for compiling the kernel and configuring
    the boot loader (assuming the host uses GRUB) are located in Chapter 10.


    +   - M4-1.4.10'
