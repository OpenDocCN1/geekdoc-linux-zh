  md: '# Linux From Scratch - Version 11.3


    - g lfs

    This option adds user lfs to group lfs.


    -m

    This creates a home directory for lfs.


    -k /dev/null

    This parameter prevents possible copying of files from a skeleton directory (the
    default is /etc/skl) by changing the input location to the special device.


    lfs

    This is the name of the new user.


    If you want to log as lfs or switch to lfs from a non-root user (as opposed to
    switching to user lfs when logged as root, which does not require the lfs user
    to have a password), you need to set a password for lfs. Issue the following command
    at the root user to set the password:


    ```

    passwd lfs

    ```


    Grant lfs access to all the directories under $LFS by making lfs the owner:


    ```

    chown -v lfs $LFS/(user/*),lib,var,etc,bin,sbin,tools)

    case $(uname -m) in

    x86_64) chown -v lfs $LFS/lib64 ;;

    esac

    ```


    > Note

    in some host systems, the following su Lfs-$ does not complete properly and suspends
    the login for the lfs user to the background. If the prompt "lfs:-$" does not
    appear immediately, entering the fg command will fix the issue.


    Next, start a shell running as user lfs. This can be done by logging in as lfs
    on a virtual console, or with the following substitute/user command:


    ```

    su - lfs

    ```


    " instructs su to start a login shell as opposed to a non-login shell. The difference
    between these two types of shells is described in detail in bash(1) and info bash.


    # 4.4. Setting Up the Environment


    Set up a good environment by creating new profiles for the bash shell. While logged
    in as user lfs, issue the following to create a new .bash_profile:


    ```

    cat > ~/.bash_profile << "EOF"

    exec env -i HOME=$HOME TERM=$TERM TERM=w\$ /bin/bash

    EOF

    ```


    When logged on as lfs, or switched to the lfs user using an "-", the initial shell
    is a login shell which reads the /etc/profile of the host (probably containing
    settings and environment variables) and then .bash_profile. The exec env -i;/bin/bash
    command replaces the running shell with a new one with completely empty environment,
    except for the HOME, TERM, and PS1 variables. This ensures that no unwanted and
    potentially hazardous environment variables from the host system leak into the
    build environment.'
