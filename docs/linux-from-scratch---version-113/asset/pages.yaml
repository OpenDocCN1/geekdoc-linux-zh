  md: '# Linux From Scratch - Version 11.3


    --enable-kernel=3.2

    This tells Glibc to compile the library with support for 3.2 and later Linux kernels.
    Workarounds for older kernels

    are not enabled.


    --with-headers=$LFS/usr/include

    This tells Glibc to compile itself after the headers installed to the $LFS/usr/include
    directory, so that it

    nows exactly what features the kernel has and can optimize itself accordingly.


    libc_cv_slibdir=/usr/lib

    This ensures that the library is installed in /usr/lib instead of the default
    /lib64 on 64-bit machines.


    During this stage following warning might appear:


    ```

    configure: WARNING:

    *** auxiliary programs are missing or

    *** incompatible versions: msgfmt

    *** some features will be disabled.

    *** Check the INSTALL file for required versions.

    ```


    The missing or incompatible msgfmt program is generally harmless. This msgfmt
    program is part of the Ggetext package, which the host distribution should provide.


    > Note

    There have been reports that this package may fail when building as a "parallel
    make". If that occurs, rerun the command with the "-j1" option.


    Compile the package:


    ```

    make

    ```


    Install the package:


    > Warning

    If LFS is not properly set, and despite the recommendations, you are building
    as root, the next command will install the newly built Glibc to your system, which
    will almost certainly render it unusable. Double-check that the environment is
    correct, and that you are not root, before running the following command.


    ```

    DESTDIR=$LFS install

    ```


    The meaning of the install option:


    DESTDIR=$LFS

    The DESTDIR variable is used by almost all packages to define the location where
    the package should be installed. If it is not set, it defaults to the (/) directory.
    Here we specify that the package is installed in $LFS , which will become the
    root directory in Section 7.4, "Entering the Chroot Environment".


    Fix a hard coded path to the executable loader in the ldd script:


    ```

    sed ''/RTDLIST=/s@/usr@$g'' -i $LFS/usr/bin/ldd

    ```'
