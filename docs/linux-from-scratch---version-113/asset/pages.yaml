  md: '# Note


    A good starting place for setting up the kernel configuration is to make defconfig.
    This will set the base configuration to a state that takes your current system
    architecture into account.


    Be sure to enable/disable/set the features or the system might not work correctly
    or at all:


    +   Processor type and features --->

    [*] Build a relocatable kernel [CONFIG_RELOCATABLE]

    [*] Randomize the address of the kernel image (ASLR) [CONFIG_RANDOMIZE_BASE]

    Generic setup --->

    [*] Compile the kernel with warnings as errors [CONFIG_ERROR]

    <> Enable kernel headers /sys/kernel/headers.tar.xz [CONFIG_IKHEADERS]

    General architecture-dependent options --->

    [*] Stack buffer overflow detection [CONFIG_STACKPROTECTOR]

    [*] Robust Stack Protector [CONFIG_STACKPROTECTOR_STRONG]

    Device Drivers --->

    Graphics support --->

    Frame buffer device --->

    <> Support for frame buffer device support

    Console display driver --->

    [*] Framebuffer console support [CONFIG_FRAMEBUFFER_CONSOLE]

    Generic Driver Options

    [*] Support for uevent helper [CONFIG_UEVENT_HELPER]

    [*] Maintain a devmtps filesystem at /dev [CONFIG_DEVTYMFPS]

    [*] Autount devmtps at /dev, after the kernel mounts the rootfs [CONFIG_DEVTYMFPS]


    Enable some additional features if you are building a 64-bit system. If you are
    using menconfig, enable them in the order of CONFIG_PCI_MSI; first CONFIG_IRQ_REMAP,
    then CONFIG_X86_2APIC because an option shows up after its dependencies are selected.


    +   Processor type and features --->

    [*] Support xaptic [CONFIG_X86_2APIC]

    Device Drivers --->

    [*] PCI Support ---> [CONFIG_PCI]

    [*] Message Signaled Interrupts (MSI and MSI-X) [CONFIG_PCI_MSI]

    [*] IOMMU Hardware Support ---> [CONFIG_IOMMU_SUPPORT]

    [*] Support for Interrupt Remapping [CONFIG_IRQ_REMAP]


    There are several other options that may be desired depending on the requirements
    for the system. For a list of options needed for BLFS packages, check the BLFS
    Index of Kernel Settings (https://www.linuxfromscratch.org/blfs/view/11.3/index.html#kernel-config-index).


    # Note


    If your hardware uses UEFI and you wish to boot the L system with it, you should
    adjust some kernel configuration following the BLFS page.


    The rationale for the above configuration items:


    Randomize the ASLR address of the kernel image (ASLR)

    Enable ASLR for kernel image, to mitigate some attacks based on fixed addresses
    of sensitive data or code in the kernel.


    Compile the kernel with warnings as errors

    This may cause building failure if the compiler and/or configuration are different
    from those of the kernel developers.'
