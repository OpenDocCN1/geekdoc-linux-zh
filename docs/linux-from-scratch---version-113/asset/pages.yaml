  md: '# 8.18. Binutils-2.40


    The Binutils package contains a linker, an assembler, and other tools for handling
    object files.


    Approximate build time: 2.2 SBU

    Required disk space: 2.6 GB


    # 8.18.1. Installation of Binutils


    Verify the PTYs are working properly inside the chroot environment by performing
    a simple test:


    ```

    expect -c "spawn ls"

    ```


    This command should output the following:


    ```

    spawn ls

    ```


    If, the output includes the message below, then the environment is not set up
    for proper PTY operation. This issue needs to be resolved before running the test
    suites for Binutils and GCC:


    > The system has no more ptys.

    Ask your system administrator to create more.


    The Binutils documentation recommends building Binutils in a dedicated build directory:


    ```

    mkdir -v build

    cd build

    ```


    Prepare Binutils for compilation:


    ```

    ./configure --prefix=/usr \

    --sysconfdir=/etc \

    --enable-gold \

    --enable-ld-default \

    --enable-plugins \

    --enable-shared \

    --disable-error \

    --enable-64-bit-bfd \

    --with-system-zlib

    ```


    The meaning of the configure parameters:


    +   --enable-gold

    Build the gold linker and install it as ld.gold (alongside the default linker).


    +   --enable-ld-default

    Build the original bfd linker and install it as both ld (the default linker) and
    ld.bfd.


    +   --enable-plugins

    Enables plugin support for the linker.


    +   --enable-64-bit-bfd

    Enables 64-bit support (on hosts with narrower word sizes). May not be needed
    on 64-bit systems, but does no harm.


    +   --with-system-zlib

    Use the installed zlib library instead of building the included version.


    Compile the package:


    ```

    make tooldir=/usr

    ```'
