  md: '# Note


    The GRUB designator for partition may change if you added or removed some disks
    (removable disks like USB thumb devices). The change may cause boot failure grub.cfg
    refers to "old" designators. If you wish to avoid such a problem, you may use
    the UUID of partition and the UUID of a filesystem instead of a GRUB designator
    to specify a device. Use lsblk -o UUID,PARTUID,PATH,MOPOINT to show the UUIDs
    of your filesystems (in the UUID column) and partitions (in the PARTUID column).
    Then replace root=[hdx,y] with search --root=uuid <UUID of the filesystem where
    the kernel is installed>, and replace root=/dev/sda2 with root=PARTUID=<UUID of
    the partition where LFS is built>.


    Note that the UUID of a partition is completely different from the UUID of the
    filesystem in this partition. Some online resources may instruct you to use root=UUID<filesystem>
    instead of root=PARTUID UUID, but doing so will require an initramfs, which is
    beyond the scope of LFS.


    The name of the device node for a partition in /dev may also change (this is less
    likely than a GRUB designator change). You can also replace paths to device nodes
    like /dev/sda with PARTUID=UUID, in /etc/fstab, to avoid a potential boot failure
    in case the device node name has changed.


    GRUB is an extremely powerful program and it provides a tremendous number of options
    for booting from a wide variety of devices, operating systems, and partition types.
    There are also many options for customization such as graphical splash screens,
    playing sounds, mouse input, etc. The details of these options are beyond the
    scope of this introduction.


    # Caution


    There is a command, grub-mkconfig, that can write a configuration file automatically.
    It uses a set of scripts in /etc/grub.d/ and will destroy any customizations that
    you make. These scripts are designed primarily for non-source distributions and
    are not recommended for LFS. If you install a commercial Linux distribution, there
    is a good chance that this program will run. Be sure to back up your grub.cfg
    file.'
