    +   - **split**: Splits a given file into several new files, separating them according
    to given patterns or line numbers, and outputting the byte count of each new file

    - **cut**: Prints sections of lines, selecting the parts according to given fields
    or positions

    - **date**: Displays the current date and time in the given format, or sets the
    system date and time

    - **dd**: Copies a file using the given block size and count, while optionally
    performing conversions on it

    - **df**: Reports the amount of disk space available (used) on all mounted file
    systems, or only on the file holding the selected files

    - **dir**: Lists the contents of a given directory (same as the *ls* command)

    - **dircolors**: Outputs commands to set the LS_COLOR environment variable to
    change the color scheme used by *ls*

    - **dirname**: Extracts the directory portion(s) of the given name(s)

