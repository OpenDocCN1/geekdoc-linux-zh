  md: '# The meaning of the build-root configure options:


    --with-build-sysroot=$LFS


    Normally, using --host ensures that a cross-compiler is used for building GCC,
    and that compiler knows it to look for headers and libraries in $LFS. But the
    build system for GCC uses other tools, which are not aware of its location. This
    switch is needed so those tools find the needed files in $LFS, and not on the
    host.


    --target=$LFS_TGT


    We are cross compiling GCC, so it''s impossible to build target libraries (libgcc
    and libstdc++) with the previously compiled GCC binaries—those which won''t run
    on the host. The GCC build system will attempt to use the host''s C and C++ compilers
    as a workaround by default. Building the GCC target libraries with a different
    version of GCC pass is not supported, so using the host''s compilers may cause
    the build to fail. This parameter ensures the versions of GCC pass 1. This is
    necessary to support C++ exception handling.


    LFLAGS_FOR_TARGET=...


    Allow libstdc++ to use the shared libgcc being built in this pass, instead of
    the static version that was built in GCC pass 1. This is necessary to support
    C++ exception handling.


    Compile the package:


    ```

    make

    ```


    Install the package:


    ```

    make DESTDIR=$LFS install

    ```


    As a finishing touch, create a utility symlink. Many programs run ce gcc instead
    of gcc, which is used to keep programs generic and therefore usable on all kinds
    of UNIX systems where the GNU compiler is not always installed. Running cc leaves
    the system administrator free to decide which C compiler to install:


    ```

    ln -sv gcc $LFS/usr/bin/cc

    ```


    Details on this package are located in Section 8.26.2, "Contents of GCC."'
