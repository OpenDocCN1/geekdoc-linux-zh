  md: '# # Chapter 10. Making the LFS System Bootable


    # ## 10.1. Introduction


    It is time to make the LFS system bootable. This chapter discusses creating the
    /etc/fstab file, building a kernel for the new LFS system, and installing the
    GRUB boot loader so that the LFS system can be selected for booting at startup.


    # ## 10.2. Creating the /etc/fstab File


    The /etc/fstab file is used by some programs to determine where file systems are
    mounted by default, in order, and which must be checked (for errors) prior to
    mounting. Create a new file system table like this:


    ```

    cat > /etc/fstab << "EOF"

    # Begin /etc/fstab

    # file system mount-point type options dump fsck order

    /dev/<xxx>      <root>   defaults        1    0

    /dev/<yyy>      swap     prime=1               0

    proc            proc     nousid,noecdev,dev 0    0

    sysfs           /sys     sysfs   nousid,noecdev,dev 0    0

    devpts          /dev/pts devpts   gid=5,mode=620 0    0

    tmpfs           /run     tmpfs   defaults        0    0

    devtmpfs        /dev     devtmpfs mode=0755,nousid 0    0

    tmpfs           /dev/shm tmpfs    nousid               0    0

    # End /etc/fstab

    EOF

    ```


    Replace <xxx>, <yyy>, and <fff> with the values appropriate for the system, for
    example, da2, da5, and ext4. For details on the fields in this file, see **man
    fstab**.


    Filesystems with MS-DOS or Windows origin (i.e. vat, ntfs, smbfs, cifs, iso9660,
    udf) need a special option, utf8, for non-ASCII characters in file names to be
    properly. For non-UTF-8 locales, the value of charset should be the same as the
    character set of the locale, in such a way that the kernel understands it. This
    works if the relevant character set definition (found under Files -> Native Language
    Support when the kernel) is compiled into the kernel or as module. However, if
    the character set of the locale is UTF-8, the corresponding option charset would
    make the file system case sensitive. To fix this, use the special option utf8
    to install charset-utf8 for UTF-8 locales. The `codec` option is also needed to
    set the code number used by MS-DOS in your country. For example, in order to mount
    USB drives, ru_KO018-RU would need the following in the options portion of its
    mount line in /etc/fstab:


    ```

    noauto,user,quiet,showexec, codec=866,iocharset=koi8r

    ```


    The corresponding options fragment for ru_UTF-8 users is:


    ```

    noauto,user,quiet,showexec,codec=866,utf8

    ```


    Note that using iocharset is the default for iso8859-1 (which keeps the file system
    case insensitive), and the utf8 option tells the kernel to convert the file names
    using UTF-8 so they can be interpreted in the UTF-8 locale.'
  merge: -1
  pgno: 269
