  md: '# 9.5.2. Creating the /etc/resolv.conf File


    The system will need some means of obtaining Domain Name Service (DNS) name resolution
    to resolve Internet domain names to addresses, vice versa. This is achieved by
    placing the IP address of the DNS server, available from the ISP or network administrator,
    into `/etc/resolv.conf`. Create the file by running the following:


    ```

    cat > /etc/resolv.conf << "EOF"

    # Begin <Your Domain Name>

    nameserver <IP address of your primary nameserver>

    nameserver <IP address of your secondary nameserver>

    # End /etc/resolv.conf

    EOF

    ```


    The domain statement can be omitted or replaced with a search statement. See the
    man page for resolv.conf for more details.


    Replace `<IP address of the nameserver>` with the IP address of the DNS most appropriate
    for the setup. There will be more than one entry (requirements secondary servers
    for fallback capability). If you only need or want one DNS server, remove the
    second *nameserver* line from the file. The IP address may also be a router on
    the local network.


    > The Google IPv4 DNS addresses are 8.8.8.8 and 8.8.4.4.


    # 9.5.3. Configuring the System Hostname


    During the boot process, the file `/etc/hostname` is used for establishing the
    system''s hostname.


    Create the `/etc/hostname` file and enter a hostname by running:


    ```

    echo "<hostname>" /etc/hostname

    ```


    `<hostname>` needs to be replaced with the name given to the computer. Do not
    enter the Fully Qualified Domain Name (FQDN). That information goes in the `/etc/hosts`
    file.


    # 9.5.4. Customizing the /etc/hosts File


    Decide on the IP address, fully-qualified domain name (FQDN), and possible aliases
    for use in the `/etc/hosts` file. The syntax is:


    ```

    IP_address myhost.example.org aliases

    ```


    Unless the computer is to be visible to the Internet (i.e., there is a registered
    domain and block of assigned IP addresses—most users do not have), make sure that
    IP address is in the private network IP address range. Valid ranges:


    | Private Network Address Range | Normal Prefix |

    | 10.0.0.1 - 10.255.255.254 | 8 |

    | 172.x.0.1 - 172.x.255.254 | 16 |

    | 192.168.y.1 - 192.168.y.254 | 24 |


    x can be any number in the range 16-31. y can be any number in the range 0-255.


    A valid private IP address could be 192.168.1.1. For this IP could be Lfs.example.com.'
