- img_proc: true
  md: '# 2.6. Setting The LFS Variable


    Throughout this book, the environment variable LFS will be used several times.
    You should ensure that this variable is always defined throughout the LFS build
    process. It should be set to the directory where you will be building your LFS
    system - we will use /mnt/lfs as an example, but you may choose any directory
    name you want. If you are building LFS on a separate partition, this directory
    will be the mount point for the partition. Choose a directory location and set
    the variable with the following command:


    ```

    export LFS=/mnt/lfs

    ```


    Having this variable is beneficial in commands such as mkdir -v $LFS/tools can
    be typed literally. The shell will automatically replace "$LFS" (or /mnt/lfs or
    whatever the variable was set to) when it processes the command line.


    # Caution


    > Do not forget to check that LFS is set whenever you leave and reenter the working
    environment (such as when doing a su to root or another user). Check the LFS variable
    is set properly with:


    ```

    echo $LFS

    ```


    > Make sure the output shows the path to LFS system''s build location, which is
    /mnt/lfs if the provided example was followed. If the output is incorrect, use
    the command given earlier on this page to set $LFS to the correct name.


    # Note


    One way to ensure the LFS variable is always set is to edit the /root/.bash_profile
    file in your personal home directory and enter the export command above. In addition,
    the specified in the /etc/passwd file for all users need the LFS variable must
    be bash that the /root/.bash_profile file is incorporated as part of the login
    process.


    Another consideration is that this is used to log into the system. If logging
    in a graphical display manager, the user''s .bash_profile is not normally used
    when a virtual terminal is started. In this case, some distributions use an "if"
    test, do not run the remaining .bashrc instructions for a non-interactive bash
    invocation. Be sure to place the export command at the end for non-interactive
    use.


    # 2.7. Mounting the New Partition


    Now that a file system has been created, the partition must be mounted so the
    system host can access it. This book assumes that the file system is mounted at
    the directory specified by the LFS environment variable described in the previous
    section.


    Strictly speaking, one cannot "mount a partition". One mounts the file system
    embedded in partition. But since a single partition cannot connect more than one
    file system, people often speak of the partition and the associated file system
    as if they were one and the same.


    Create the mount point and mount the LFS file system with these commands:


    ```

    mkdir -pv $LFS

    mount -v -t ext4 /dev/<xxx> $LFS

    ```'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'Replace <xxx> with the name of the LFS partition.


    If you are using multiple partitions for LFS (e.g., one for / and another for
    /home), mount them like this:


    ```

    mkdir -pv $LFS

    mount -v t ext4 /dev/<xxx> $LFS

    mkdir -v $LFS/home

    mount -v t ext4 /dev/<yyy> $LFS/home

    ```


    Replace <xxx> with the appropriate partition names.


    Ensure that this new partition is not mounted with permissions that are too restrictive
    (such as the nosuid or nodedev options). Run the mount command without any parameters
    to see what options are set for the mounted LFS partition. If nosuid or nodedev
    are set, the partition must be remounted.


    # Warning


    The above instructions assume that you will not restart your computer throughout
    the LFS process. If you shut down your system, you will either need to remount
    the LFS partition each time you build the process, or modify the host system''s
    /etc/fstab file to automatically remount it when you reboot. For example, you
    might add this to your line in /etc/fstab file:


    | /dev/<xxx> | /mnt/lfs ext4 | defaults | 1 | 1 |

    |---|---|---|---|---|


    If you use additional optional partitions, be sure to add them also.


    If you are using a swap partition, ensure that it is enabled using the swapon
    command:


    ```

    /sbin/swapon -v /dev/<zzz>

    ```


    Replace <zzz> with the name of the swap partition.


    Now that the LFS partition is open for business, it''s time to download the packages.'
  merge: -1
