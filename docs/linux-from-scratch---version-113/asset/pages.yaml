  md: '# Caution


    If you decide to use a separate /boot partition for the LFS system (maybe sharing
    a /boot partition with the host distro), the files copied below would go there.
    The easiest way to do that is to create the entry for /boot in /etc/fstab first
    (read the previous section for details), then issue the following command as the
    root user in the chroot environment:


    ```

    Mount /boot

    ```


    The path to the device node is omitted in the command because mount can read it
    from /etc/fstab.


    The path to the kernel image may vary depending on the platform you are using.
    The filename below can be changed to suit your taste, the boot file should be
    named vmlinuz to be compatible with the automatic setup of the boot process described
    in the next section. The following command assumes an x86 architecture:


    ```

    cp -iv arch/x86/boot/bzImage /boot/vmlinuz-6.1.11-lfs-11.3

    ```


    System.map is a symbol file for the kernel. It maps the entry points of every
    function in the kernel API, and as the addresses of the kernel data structures
    for the running kernel. It is used as a resource when investigating kernel problems.
    Use the following command to install the map:


    ```

    cp iv System.map /boot/System.map-6.1.11

    ```


    The kernel configuration file .config produced by the make menoconfig step contains
    all the configurations for the kernel that you compiled. It is a good idea to
    keep this file for future reference:


    ```

    cp -iv .config /boot/config-6.1.11

    ```


    Install the kernel for the kernel:


    ```

    install -d /usr/share/doc/linux-6.1.11

    cp -r Documentation/* /usr/share/doc/linux-6.1.11

    ```


    It is important to note that the files in the kernel source directory are owned
    by root. Whenever a package is unpacked as root (like we did inside chroot), the
    files have the user and group IDs of whatever they were on the packer''s computer.
    This is not a problem for any other package to be installed because the source
    is removed after the installation. However, the Linux source tree is often retained
    for a long time. Because of this, there is a chance that whatever user ID the
    package used will be assigned to some person on the machine. That person would
    then have write access to the kernel source.


    # Note


    In many cases, the configuration of the kernel will need to be updated for packages
    that will be installed later in BLFS. Unlike other packages, it is not necessary
    to remove the kernel source after the newly built kernel is installed.


    If the kernel source tree is going to be retained, chown -R 0:0 on the linux-6.1.11
    directory to ensure all files are owned by user root.


    # Warning


    Some kernel documentation recommends creating a symlink from /usr/src/linux pointing
    to the kernel source directory. This is specific to kernels prior to the 2.6 and
    must not be created on an LFS system as it can cause problems for packages you
    wish to build once your base LFS system is complete.'
