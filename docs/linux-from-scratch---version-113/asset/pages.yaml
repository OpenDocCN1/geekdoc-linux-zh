  md: '# Enable kernel headers through /sys/kheaders.tar.xz


    This will require cpio building the kernel. cpio is not installed by LFS.


    # Strong Stack Protector


    Enable SSP for the kernel. We''ve enabled it for the entire userspace with `--enable-default-ssp`
    configuring GCC, but the kernel does not use GCC default for SSP. We enable it
    explicitly here.


    # Support uevent helper


    Having this option may interfere with device management when using Udev/Eudev.


    # Maintain devmtmps


    This will create automated device nodes populated by the kernel, even without
    Udev running. It then runs on top of this, managing permissions and adding symlinks.
    This configuration item is required for all users of Udev/Eudev.


    # Autount devmtmps /dev


    This will mount the kernel view of devices on /dev upon switching to root filesystem
    just before starting init.


    # Framebuffer console


    This is needed to display the Linux console on a frame buffer. To allow the kernel
    to print debug messages at an early boot, it shouldn''t be built as a kernel unless
    an intramfs is used. And, if `CONFIG_DRM (Direct Rendering Manager)` is enabled,
    it''s likely `CONFIG_DRM_FBDEV_EMULATION (Enable legacy fbdev support for your
    modeset driver)` should be built as enabled.


    # Support x2apic


    Support running the interrupt controller of 64-bit x86 processors in x2APIC mode.
    x2APIC may be enabled by firmware on 64-bit x86 systems, and a kernel without
    this option enabled will panic on boot if x2APIC is disabled by firmware. This
    option has no effect, but also does not harm if x2APIC is disabled by the firmware.


    Alternatively, `make oldconfig` may be more appropriate in some situations. See
    the `README` file for more information.


    If desired, skip kernel configuration by copying the kernel config file, `.config`,
    from the host system (assuming it is available) to the unpacked `linux-6.1.11`
    directory. However, we do not recommend this option. It is often better to explore
    all the kernel menus and create the kernel configuration from scratch.


    Compile the kernel image and modules:


    ```

    make

    ```


    If using kernel modules, module configuration in `/etc/modprobe.d` may be required.
    Information pertaining to modules and kernel location is located in Section 9.3,
    “Overview of Device and Module Handling” and in the kernel documentation in the
    `linux-6.1.11/Documentation` directory. Also, `modprobe.d(5)` may be of interest.


    Unless module has been disabled in the kernel configuration, install the modules
    with:


    ```

    make modules_install

    ```


    After kernel compilation is complete, additional steps are required to complete
    the installation. Some files need to be copied to the `/boot` directory.'
