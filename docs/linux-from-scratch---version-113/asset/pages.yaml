  md: '# Linux From Scratch - Version 11


    The creation of package files that include dependency information is complex,
    and beyond the scope of LFS.

    Slackware uses a tar-based system for package archives. This system purposely
    does not handle package dependencies as more complex package managers. For details
    of Slack package management, see https://www.slack.com/org/html/package-management.html.


    # 8.2.7. User Based Management


    This scheme, unlike to LFS, was devised by Matthias Benmann, and is available
    from the Hints Project. In this scheme, each package is installed as a separate
    unit in the standard locations. Files belonging to a package are easily identified
    by checking the user ID. The features and shortcomings of this approach are too
    complex to describe in this section. For the details please see the hint at https://www.linuxfromscratch.org/hints/downloads/files/more_control_and_pkg_man.txt.


    # 8.2.3. Deploying LFS on Multiple Systems


    One of the advantages of an LFS system is that there are no files that depend
    on the position of files on a disk system. Cloning an LFS to build another computer
    with the same architecture as the base system is as simple using tar on the LFS
    partition that contains the root directory (about 900MB uncompressed for a basic
    LFS build), copying that file via network transfer or CD-ROM / USB stick to the
    new system, and expanding it. After that, a few configuration files will have
    to be changed. Configuration files that may need to be updated include: /etc/hosts,
    /etc/fstab, /etc/passwd, /etc/group, /etc/shadow, /etc/ld.conf, /etc/sysconfig/rc.site,
    /etc/sysconfig/network, and /etc/sysconfig/config.eth0.


    A custom kernel may be needed for the new system, depending on differences in
    system hardware and the original kernel configuration.


    > Note There have been some reports of issues when copying between similar but
    not identical architectures. For instance, the instruction set for an Intel system
    is not identical with the AMD processor''s instructions, and later versions of
    some processors may provide instructions that are unavailable with earlier versions.


    Finally, the new system has been made bootable Section 10.4, “Using GRUB to Set
    Up the Boot Process”.'
