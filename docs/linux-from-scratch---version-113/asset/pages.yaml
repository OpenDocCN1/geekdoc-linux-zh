    # 8.60.1. Installation of GRUB


    > Note

    If your system has UEFI support and you wish to boot LFS with UEFI, you can skip
    this package in LFS, and install GRUB with UEFI support (and its dependencies)
    by following the instructions on the BLFS page.


    > Warning

    Unset environment variables that may affect the:

    ```bash\unset (C, CPP, CXX, LD)FLAGS

    ```nDon''t try "tuning" with custom compilation flags. This package is a bootloader.
    The low-level operations in the source code may be broken by aggressive optimization.


