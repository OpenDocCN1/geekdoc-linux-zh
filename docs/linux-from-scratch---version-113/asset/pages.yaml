  md: 'The login, agetty, and init programs (and others) use a number of log files
    to record information such as was logged into the system and when. However, these
    programs will not write to the log files if they do not already exist. Initialize
    the log files and give them proper permissions:


    ```

    touch /var/log/{btmp,lastlog,faillog,wtmp}

    chgrp -v utmp /var/log/lastlog

    chmod -v 664 /var/log/lastlog

    chmod -v 600 /var/log/var/log/btmp

    ```


    The /var/log/utmp file records all logins and logouts. The /var/log/lastlog file
    records when each user last logged in. The /var/log/faillog file records failed
    login attempts. The /var/log/btmp file records the bad login attempts.


    # Note


    The /run/utmp file records the users that are currently logged in. This file is
    created dynamically in the boot scripts.'
