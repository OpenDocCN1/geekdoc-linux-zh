    partition if /boot is not a separate partition) is created by e2progs-1.4.70 or
    later:


    ```

    patch -p1 -i ..//grub-2.06-upstream-fixes-1.patch

    ```


    Prepare GRUB for compilation:


    ```

    ./configure --prefix=/usr

    --sysconfdir=/etc

    --disable-efisym

    --disable-werrorror

    ```


    The meaning of the new configure options:


    --disable-werror

    This allows the build to complete with warnings introduced by more recent versions
    of Flex.


    --disable-efisym

    This option minimizes what is built by disabling a feature and eliminating some
    test programs not needed for LFS.


    Compile the package:


    ```

    make

    ```


    The test suite for this packages is not recommended. Most of the tests depend
    on packages that are not available in the limited LFS environment. To run the
    tests anyway, run make check.


    Install the package:


    ```

    make install

    mv -v /etc/bash_completion.d/grub /usr/share/bash_completion/completions

    ```


    Making your LFS system bootable with GRUB will be discussed in Section 10.4, "Using
    GRUB to Set Up the Boot Process".'
