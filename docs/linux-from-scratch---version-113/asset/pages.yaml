  md: "# Chapter 4. Final Preparations\n\n# 4.1. Introduction\n\nIn this chapter,\
    \ we will perform a few additional tasks to prepare for building the temporary\
    \ system. We will create a set of directories in SLFS (in which we will install\
    \ the tools), add an unprivileged user, and create an appropriate build environment\
    \ for that user. We will also explain the units of time (\"SBUs\" we use to measure\
    \ how long it takes to build LFS packages, and provide some information about\
    \ package test suites.\n\n# 4.2. Creating a Limited Directory Layout in the LFS\
    \ Filesystem\n\nIn this section, we begin populating the LFS filesystem with the\
    \ pieces that will constitute the Linux system. The first step is to create a\
    \ limited directory layout, so that the programs compiled in Chapter 6 (as well\
    \ as libstdc++ in Chapter 5) can be installed in their final location. We do so\
    \ so these temporary programs will be overwritten when the final versions are\
    \ built in Chapter 8.\n\nCreate the required directory layout by issuing the following\
    \ commands as `root`:\n\n```\nmkdir -pv /etc,var /usr/bin /bin,lib,sbin\n\nfor\
    \ i in bin lib usr; do\n  ln -sv /usr/$i $LFS/$i\ndone\n\ncase $(uname) in\nx86_64)\
    \ mkdir -pv $LFS/lib64\nnesac\n```\n\nPrograms in Chapter 6 will be compiled with\
    \ a cross-compiler (more details can be found in section Toolchain Technical Notes).\
    \ This cross-compiler will be installed in a special directory, to separate it\
    \ from the other programs. Still acting as `root`, create that directory with\
    \ this command:\n\n```\nmkdir -pv $LFS/tools\n```\n\n> Note\nThe LFS editors have\
    \ deliberately decided not to use a /usr/lib64 directory. Several steps are taken\
    \ to ensure the toolchain will not use it. If for any reason this directory appears\
    \ (either you made an error in the following instructions, or you installed a\
    \ binary package that created it after finishing LFS), it may break your system.\
    \ You should always be sure this directory does not exist.\n\n# 4.3. Adding the\
    \ LFS User\n\nWhen logged in as `root`, making a single mistake can damage or\
    \ destroy a system. Therefore, the packages in the next two chapters are built\
    \ as an unprivileged user. You could use your own name, but to make it easier\
    \ to set up a clean working environment, we create a new user `lfs` as a member\
    \ of a group (also named `lfs`) and run commands as `lfs` during the installation\
    \ process. As `root`, issue the following commands to add the new user:\n\n```\n\
    groupadd lfs\nuseradd -s /bin/bash -g lfs -m -k /dev/null lfs\n```\n\nThis is\
    \ what the command line options mean:\n\n+   -s /bin/bash\nThis makes bash the\
    \ default shell for user lfs."
