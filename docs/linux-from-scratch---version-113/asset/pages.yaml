  md: "# 8.71. Man-DB-2.11.12\n\nThe Man-DB package contains programs for finding\
    \ and viewing man pages.\n\nApproximate build time: 0.2 SBU\nRequired disk space:\
    \ 40 MB\n\n# 8.71.1. Installation of Man-DB\n\nPrepare Man-DB for compilation:\n\
    \n```\n./configure --prefix=/usr\n  --docdir=/usr/share/doc/man-db-2.11.12\n \
    \ --withyscdir=/etc\n  --disable-setuid\n  --enable-cache-owner=bin\n  --with-browser=/usr/bin/lynx\n\
    \  --with-vgrind=/usr/bin/vgrind\n  --with-grep=/usr/bin/grep\n  --with-systemdunitdir=\n\
    \  --with-systemdemsunitdir=\n```\n\nThe meaning of the configure options:\n\n\
    +   --disable-setuid\n\nThis disables making the man program setuid to user man.\n\
    \n+   --enable-cache-owner=bin\n\nThis changes ownership of the system-wide cache\
    \ files to user bin.\n\n+   --with...\n\nThese three parameters are used to set\
    \ some default programs. lynx is a text-based web browser (see BLFS for installation\
    \ instructions), vgrind converts source programs to Groff input, and grep is useful\
    \ for typesetting graphs in Groff documents. The vgrind and grep are not normally\
    \ needed for viewing manual pages. They are not part of LFS or BLFS, but you should\
    \ be able to install them yourself after finishing LFS if you wish to do.\n\n\
    +   --with-systemd...\n\nThese parameters prevent installing unused systemd directories\
    \ and files.\n\nCompile the package:\n\n```\nmake\n```\n\nTo test the results,\
    \ issue:\n\n```\nmake check\n```\n\nInstall the package:\n\n```\nmake install\n\
    ```\n\n# 8.71.2. Non-English Manual Pages in LFS\n\nThe following table shows\
    \ the character set that Man-DB assumes manual pages installed under /usr/share/man/<11>\
    \ will be encoded. In addition to this, Man-DB correctly determines if manual\
    \ pages installed in that directory are UTF-8 encoded."
