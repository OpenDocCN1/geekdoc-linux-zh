  md: "# 8.70. Eudev-3.2.11\n\nThe Eudev package contains programs for dynamic creation\
    \ of dedev nodes.\n\nApproximate build time: 0.1 SBU\nRequired disk space: 83\
    \ MB\n\n# 8.70.1. Installation of Eudev\n\nFirst location of udev rules in the\
    \ .pc file:\n\n```\nsed -i '/^udevdir/a udev_dir=${udevdir}/' src/udev/udevudev.pc.in\n\
    ```\n\nPrepare Eudev for compilation:\n\n```\n./configure --prefix=/usr\n  --bindir=/usr/sbin\n\
    \  --sysconfdir=/etc\n  --enable-manpages\n  --disable-static\n```\n\nCompile\
    \ the package:\n\n```\nmake\n```\n\nCreate some directories that are now needed\
    \ for tests, but will also be used as a part of installation:\n\n```\nmkdir -pv\
    \ /usr/lib/udev/rules.d\nmkdir -pv /etc/udev/rules.d\n```\n\nTo test the results,\
    \ issue:\n\n```\nmake check\n```\n\nInstall the package:\n\n```\nmake install\n\
    ```\n\nInstall some custom rules and support files useful in an DFS environment:\n\
    \n```\ntar -xvf ...udev-lfs-20171102.tar.xz\nmake -f udev-lfs-20171102/Makefile.lfs\
    \ install\n```\n\n# 8.70.2. Configuring Eudev\n\nInformation about hardware devices\
    \ is maintained in the /etc/udev/hwdb.d and /usr/lib/udev/hwdb.d directories.\
    \ Eudev needs information to be compiled into a binary database /etc/udev/hwdb.bin.\
    \ Create the initial database:\n\n```\nudevadm hwdb --update\n```\n\nThis command\
    \ needs to be run each time the hardware information is updated.\n\n# 8.70.3.\
    \ Contents of Eudev\n\n+   * Installed programs: udevadm andudev\n* Installed\
    \ libraries: libudev.so\n* Installed directories: /etc/udev, /usr/lib/udev, and\
    \ /usr/share/doc/udev-lfs-20171102"
