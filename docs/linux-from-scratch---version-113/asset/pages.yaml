  md: '# Linux From Scratch - Version 11.3


    +   - ATTR(address) - The value of this keyword is the NIC''s MAC address.

    - ATTR(type="1") - This ensures the rule only matches the primary interface in
    the case of wireless drivers which create multiple virtual interfaces. The secondary
