    # Short Descriptions


    +   - chvt Changes the foreground virtual terminal


    +   - dealloc Deallocates unused virtual terminals


    +   - dumpkeys Dumps the keyboard translation tables


    +   - fgconsole Prints the number of the active virtual terminal


    +   - getkeys Prints the kernel scancode-to-keycode mapping table


    +   - kbdinfo Obtains information about the status of a console


    +   - kbd_mode Reports or sets the keyboard mode


    +   - kbdrate Sets the keyboard repeat and delay rates


    +   - loadkeys Loads the keyboard translation tables


    +   - loadunimap Loads the kernel unicode-to-font mapping table


    +   - mapscr An obsolete program used to load a user-defined output character
    mapping table into the console driver; this is now by **setfont**


    +   - openvt Starts a program on a new virtual terminal (VT)


    +   - psaddtable Adds a Unicode character to a console font


    +   - psgettable Extracts the embedded Unicode character table from a console
    font


    +   - psftriptable Removes the embedded Unicode character table from a console
    font


    +   - psxtable Handles Unicode characters for console fonts


    +   - setfont Changes the Enhanced Graphic Adapter (EGA) and Video Graphics Array
    (VGA) fonts on the console


    +   - keycodes Loads kernel scancode-to-keycode mapping table entries; this is
    useful if there are unusual keys on the keyboard


    +   - setled Sets the keyboard flags and Light Emitting Diodes (LEDs)


    +   - metamamode Defines the keyboard meta-key handling


    +   - setvrbg Sets the console color map in all virtual terminals


    +   - showconsolefont Shows the current EGA/VGA screen font


    +   - showkey Reports the scancodes, keycodes, and ASCII codes of the keys pressed
    on the keyboard


    +   - unicode_start Puts the keyboard and console in UNICODE mode [Don not use
    this program unless your keymap file is in the ISO-8859-1 encoding. For other
    encodings, this utility produces incorrect results.]


    +   - unicode_stop Reverts keyboard and console from UNICODE mode'
