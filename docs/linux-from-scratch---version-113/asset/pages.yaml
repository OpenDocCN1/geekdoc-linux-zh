    \ \\\n    --libdir=/usr/lib \\\n    --bindir=/usr/sbin \\\n    --disable-chroot\
    \ \\\n    --disable-login \\\n    --disable-nologin \\\n    --disable-en \\\n\
    \    --disable-setpriv \\\n    --disable-runuser \\\n    --disable-pylibmount\
    \ \\\n    --disable-static-static \\\n    --without-python \\\n    --without-systemdunitdir\
    \ \\\n    --docdir=/usr/share/doc/util-linux-2.38.1\n```\n\nThe --disable- and\
    \ --without options prevent warnings about building components that either require\
    \ packages not in LFS, or are inconsistent with packages installed by other packages.\n\
    \nCompile the package:\n\n```\nmake\n```\n\nIf desired, run the test suite as\
    \ a non-root user:\n\n> **Warning**\nRunning the test suite as the root user can\
