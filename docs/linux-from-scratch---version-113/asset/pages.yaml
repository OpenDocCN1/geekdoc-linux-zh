- img_proc: true
  md: '# # Chapter 3. Packages and Patches


    # ## 3.1 Introduction


    This chapter includes a list of packages that need to be downloaded in order to
    build a basic Linux system. The listed version numbers correspond to versions
    of the software that are known to work, and this book is based on their use. We
    highly recommend against using different versions, because the build commands
    for one version may not work with a different version, unless the version is specified
    by an LFS erratum or security advisory. The newest package may also have problems
    that require work-arounds. These work-arounds will be developed and stabilized
    in the development version of the book.


    For some packages, the release tarball (the Git or SVN) repository snapshot tarball
    for release may be published with similar file names. A release contains contains
    generated files (for example, a configure script generated by autoconf), in addition
    to the contents of the corresponding repository snapshot. The book uses releases
    whenever possible. Using a repository snapshot instead of a release tarball will
    cause issues with problems.


    Download locations may not be accessible. If a download location has changed since
    this book was published, Google (https://www.google.com/) provides a useful search
    engine for packages. If this search is unsuccessful, try one of the alternatives
    of downloading at https://www.linuxscratch.org/mirrors.html#files.


    Downloaded packages and patches will need to be stored somewhere that is conveniently
    available throughout the entire build. A working directory is also required to
    unpack the sources and build them. $LFS/sources can be used as the place to store
    the tarballs and patches as a working directory. By using this, the required elements
    will be located on the LFS partition and will be available during all stages of
    the building process.


    To create directory, execute the following command, as user root, before starting
    the download session:


    ```

    mkdir -v $LFS/sources

    ```


    Make this directory sticky, “Sticky” even that if multiple users write permission
    on a directory, only the owner of a file can delete the file within a sticky directory.
    The following command will enable the write and sticky modes:


    ```

    chmod -v +t $LFS/sources

    ```


    There are several ways to obtain all the necessary packages and patches to build
    LFS:


    +   - For stable versions of the book, a tarball of all the needed files can be
    downloaded from one of the mirror sites listed at https://www.linuxscratch.org/mirrors.html#files

    - The files can be downloaded using wget and a wget-list as described below.


    To download all of the packages and patches using wget-list-sys as an input to
    the wget command,:


    ```

    wget --input-file=wget-list-sys --directory-prefix=$LFS/sources

    ```


    Additionally, with LFS-7.0, there is a separate file, mdsums, which can be used
    to verify that all the correct packages are available before proceeding. Place
    that file in $LFS/sources and run:


    ```

    pushd $LFS/sources

    md5sum -c mdsums

    popd

    ```


    This check will be after retrieving the needed files with any of the methods listed
    above.'
  merge: -1
