    # # 11.5. Getting Started After LFS


    # ## 11.5.1. Deciding what to do


    Now that LFS is complete and you have a bootable system, what do you do? The next
    step is to decide how to use it. Generally, there are two broad categories to
    consider: workstation or server. Indeed, these categories are not mutually exclusive.
    The applications needed for each category can be combined onto a single system,
    but let''s look at them separately now.


    A server is a simpler category. Generally this consists of a web server such as
    the Apache HTTP Server and a database server as MariaDB. Other services are possible.
    The operating system embedded in a single device falls into this category.


    On the other hand, a workstation is much more complex. It generally requires a
    graphical environment such as LXDE, XFCE, KDE, or Gnome based on a basic graphical
    environment and several based applications such as the Firefox web browser, Thunderbird
    email client, or LibreOffice suite. These applications require many (several hundred
    depending on capabilities) packages of support applications and libraries.


    In addition to the above, there is a set of applications for system management
    for all kinds of systems. These applications are all in the BLFS book. Not all
    packages are needed in every environment. Example dhcpcd, is not normal for a
    server and wireless_tools, are normally only for a laptop system.


    # ## 11.5.2. Working in a basic LFS environment


    When you initially boot into LFS, you have all the internal tools to build additional
    packages. Unfortunately, the environment is quite sparse. There are a couple of
    ways to improve this:'
  merge: -1
