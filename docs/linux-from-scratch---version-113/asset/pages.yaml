  md: '# # Appendix C. Dependencies


    Every package built in LFS relies on one or more other packages to build and install
    properly. Some packages participate in circular dependencies, cases, the first
    package depends on the second which in turn depends on the first. Because of these
    dependencies, the order in which packages are built in LFS is very important.
    The purpose of this page is to document the dependencies of each package built
    in LFS.


    For each package that is built, there are three, and sometimes up to five types
    of dependencies listed below. The first lists what other packages need to be available
    in order to compile and install the package in question. The second lists what
    packages that must be available when any programs or libraries from the package
    are used at runtime. The third lists packages, in addition to those on the first
    list, need be available in order to run the test suites. The final list of dependencies
    are packages that require this package to be built and installed in its final
    location before they are built and installed. In some cases, this is because these
    packages will hard code paths to binaries within their scripts. If not built in
    a certain order, this could result in paths of /tools/bin/[binary] being placed
    inside scripts installed to the final system. This is obviously not desirable.


    The last list of dependencies are optional packages that are not addressed in
    LFS, but could be useful to the user. These packages may have additional mandatory
    or optional dependencies of their own. For these dependencies, the recommended
    practice is to install them after completion of the LFS book and then go back
    and rebuild the LFS package. In several cases, re-installation is addressed in
    BLFS.


    # Acl


    +   **Installation depends on:** Attr, Bash, Binutils, Coreutils, GCC, Getext,
    Grep, M4, Make, Perl, Sed, and Texinfo

    **Required at runtime:** Attr and Glibc

    **Test suite depends on:** Automake, Diffutils, Findutils, and Libtool

    **Must be installed before:** Coreutils, Sed, Tar, and Vim

    **Optional dependencies:** None


    # Attr


    +   **Installation depends on:** Bash, Binutils, Coreutils, GCC, Glibc, Grep,
    M4, Make, Perl, Sed, and Texinfo

    **Required at runtime:** Glibc

    **Test suite depends on:** Automake, Diffutils, Findutils, and Libtool

    **Must be installed before:** Acl and Libcap

    **Optional dependencies:** None


    # Autoconf


    +   **Installation depends on:** Bash, Coreutils, Grep, M4, Make, Perl, Sed, and
    Texinfo

    **Required at runtime:** Bash, Coreutils, Grep, M4, Make, Sed, and Texinfo

    **Test suite depends on:** Automake, Diffutils, Findutils, GCC, and Libtool

    **Must be installed before:** Automake

    **Optional dependencies:** Emacs'
