  md: '# Note


    If the procedure in the previous section was not used, udev will assign network
    card interface names based on system physical characteristics as en2s1. If you
    are not sure what interface name is, you can always run link or /sys/class/net
    after you have booted your system.


    The interface names depend on the implementation and configuration of the udev
    daemon running on your system. The udev daemon for LFS (installed in Section 8.70,
    "Eudev-3.2.11") will not run until the LFS system is booted. The interface names
    in the LFS system cannot always be determined by running those commands on the
    host, even in the chroot environment.


    The following command creates a sample file for the eth0 device with a static
    IP address:


    ```

    cd /etc/sysconfig/

    cat << ifconfig.eth0 << "EOF"

    ONBOOT=yes

    IFACE=eth0

    SERVICE=ipv4-static

    IP=192.168.1.2

    GATEWAY=192.168.1.1

    PREFIX=24

    BROADCAST=192.168.1.255

    EOF

    ```


    The values in italics must be changed in each file, to set the interfaces you
    correct.


    If the ONBOOT variable is set to "yes", the System V network script will bring
    up the Network Interface Card (NIC) during the boot process. If to set anything
    besides "yes", the NIC will be ignored by the network script and will not be started
    automatically. Interfaces can be manually started or stopped with the ifup and
    ifdown commands.


    The IFACE variable defines the interface name, for example, eth0. It is required
    for all network device configuration files. The filename extension must match
    this value.


    The SERVICE variable defines the method used for obtaining the IP address. The
    LFS-Scripts package has a modular IP assignment format, and creating additional
    files in /lib/services/ directory allows other IP assignment methods. This is
    commonly used for Dynamic Host Configuration Protocol (DHCP), which is addressed
    in the BLFS book.


    The GATEWAY variable should contain the default gateway IP address, if you are
    not, then comment out the variable entirely.


    The PREFIX variable specifies the number of bits in the subnet. Each segment of
    an IP address is 8 bits. If the subnet''s netmask is 255.255.255.0, then it is
    using the first three segments (24 bits) to specify the network number. If the
    netmask is 255.255.255.240, the subnet is using the first 28 bits. Prefixes longer
    than 24 are commonly used by DSL and cable-based Internet Service Providers (ISPs).
    In this example (PREFIX=24), the netmask is 255.255.255.0. Adjust the PREFIX variable
    according to your subnet. If PREFIX defaults to 24.


    For more information see the ifup man page.'
