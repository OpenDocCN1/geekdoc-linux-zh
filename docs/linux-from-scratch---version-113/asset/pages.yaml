  md: '# 8.5. Glibc-2.37


    The Glibc package contains the main C library. This library provides the basic
    routines for allocating memory, searching directories, opening and closing files,
    reading and writing files, string handling, pattern matching, arithmetic, and
    so on.


    **Approximate build time:** 11 SBU

    Required disk space: 2.9 GB


    # 8.5.1. Installation of Glibc


    Some of the Glibc programs use the non-FHS compliant `/var/db` directory to store
    their runtime data. Apply the following patch to make programs store their runtime
    data in the FHS-compliant locations:


    ```

    patch -Np1 -i ../glibc-2.37-fhs-1.patch

    ```


    Fix a security issue upstream:


    ```

    sed ''/width/-s/workend -string/number_length/\n-i stdio-common/vprintf-process-arg.c/

    ```


    The Glibc documentation recommends building Glibc in a dedicated directory:


    ```

    mkdir -v build

    cd build

    ```


    Ensure that the `ldconfig` and `sln` utilities will be installed into `/usr/sbin/`


    ```

    echo "rootsbind=/usr/sbin" >> configparams

    ```


    Prepare Glibc for compilation:


    ```

    ./configure --prefix=/usr

    --disable-error

    --enable-kernel=3.2

    --enable-stack-protector

    --with-headers=/usr/include

    libc_cv_slibdir=/usr/lib

    ```


    **The meaning of the configure options:**


    --disable-error

    This option disables the -W option passed to GCC. This is necessary for running
    the test suite.


    --enable-kernel=3.2

    This option tells the build system that Glibc may be used with kernels as old
    as 3.2. This means generating workarounds in a system call introduced in a later
    version cannot be used.


    --enable-stack-protector

    This option increases system security by adding extra code to check for buffer
    overflows, as stack smashing attacks.


    --with-headers=/usr/include

    This option tells the build system where to find the kernel API headers.


    libc_cv_slibdir=/usr/lib

    This variable sets the correct library for all systems. We do not want lib64 to
    be used.'
