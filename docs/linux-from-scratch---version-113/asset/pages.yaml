    # Rationale for Packages in the Book


    The goal of LFS is to build a complete and usable foundation-level system—including
    all the packages needed to replicate itself—and providing a relatively minimal
    base to customize a more complete system based on the user''s choices. This does
    not mean that LFS is the smallest system possible. Several important packages
    are included that are not, strictly speaking, required. The list below documents
    the reasons each package in the book has been included.


    +   - Acl


    This package contains utilities to administer Access Control Lists, which are
