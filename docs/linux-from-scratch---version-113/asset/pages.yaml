  md: "# 5.6. Libstdc++ from GCC-12.2.0\n\nLibstdc++ is the standard C++ library.\
    \ It is needed to compile C++ code (part of GCC is written in C++), but we had\
    \ to defer its installation when we gcc-pass1 because Libstdc++ depends on Glibce,\
    \ which was not yet available in the target directory.\n\n**Approximate build\
    \ time:** 0.2 SBU\n**Required disk space:** 1.1 GB\n\n# 5.6.1. Installation of\
    \ Target Libstdc++\n\n> Note\nLibstdc++ is part of the GCC sources. You should\
    \ first unpack the GCC tarball and change to the `gcc-12.2.0` directory.\n\nCreate\
    \ a separate build directory for Libstdc++ and enter it:\n\n```\nmkdir -v build\n\
    cd build\n```\n\nPrepare Libstdc++ for compilation:\n\n```\n../libstdc++-v3/configure\
    \ \\\n  --host=$LFS_TGT \\\n  --build=$(config.guess) \\\n  --prefix=/usr \\\n\
    \  --disable-multilib \\\n  --disable-nls \\\n  --disable-libstdc++-include-dir=$tools/LFS_TGT/include/c++/12.2.0\
    \ \\\n  --with-gxx-include-dir=$tools/LFS_TGT/include/c++/12.2.0\n```\n\nThe meaning\
    \ of the configure options:\n\n+   --host=-\nSpecifies that the cross-compiler\
    \ we have just built used instead of the one in `/usr/bin`.\n\n+   --disable-libstdc++-pch\n\
    This switch prevents the installation of precompiled files, which are not needed\
    \ at this stage.\n\n+   --with-gxx-include-dir=$tools/LFS_TGT/include/c++/12.2.0\n\
    This specifies the installation directory for include files. Because Libstdc++\
    \ is the standard C++ library for LFS, this directory should match the location\
    \ where the C++ compiler `$LFS_TGT-g++` would search for the C++ include files.\
    \ In a normal build, this information is automatically passed to the Libstdc++\
    \ `configure` options but it will prepend the sysroot `$LFS` (specified when building\
    \ GCC-pass1) to the include search path, so it will search in `$tools/$LFS_TGT/include/c++/12.2.0`.\
    \ The combination of the `DESTDIR` variable (in the `make install` command below)\
    \ and this switch causes the headers to be installed there.\n\nCompile Libstdc++\
    \ by running:\n\n```\nmake\n```\n\nInstall the library:\n\n```\nmake DESTDIR=$LFS\
    \ install\n```"
