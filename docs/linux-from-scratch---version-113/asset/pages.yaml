  md: '# Linux From Scratch - Version 11.3


    Prepare GCC for compilation:


    ```

    ../configure \\

    --target=$LFS_TGT \

    --prefix=$LFS/tools \

    --with-libc-version=2.37 \

    --with-sysroot=$LFS \

    --without-newlib \

    --without-headers \

    --enable-default-pie \

    --enable-default-ssp \

    --disable-shared \

    --disable-multilib \

    --disable-threads \

    --disable-latomic \

    --disable-libgcc \

    --disable-libquadmath \

    --disable-libss \

    --disable-libvtv \

    --disable-libstdcxx \

    --enable-languages=c,c++

    ```


    The meaning of the configure options: --with-glibc-version=2.37


    This option specifies the version of Glibc which will be used on the target. It
    is not relevant to the host distro because everything compiled by pass1 GCC will
    run in the root environment, which is isolated from libc of the host.


    --without-newlib

    Since working a C library is not yet available, this ensures that the inhibit_libc
    constant is defined when building libgcc. This prevents the compiling of any code
    that requires libc support.


    --without-headers

    When creating a cross-compiler, GCC requires standard headers compatible with
    the target system. For these purposes headers will not be needed. This switches
    GCC from looking for them.


    --enable-default-pie and --enable-default-ssp

    Those switches allow GCC to compile programs with some hardening security features
    (more information on these in the note on PIE and SSP in chapter 8) by default.
    They are not strictly needed at this stage, the compiler will only produce temporary
    executables. But it is cleaner to have the temporary packages as close as possible
    to the final ones.


    --disable-shared

    This switch forces GCC to link its internal libraries statically. We need this
    because the shared libraries require Glibc, which is not yet installed on the
    target system.


    --disable-multilib

    On x86_64, LFS does not support a multilib configuration. This switch is harmless
    for x86.


    --disable-threads, --disable-latomic, --disable-libgcc, --disable-libquadmath,
    --disable-libss, --disable-libvtv, --disable-libstdcxx

    These switches disable support for threading, latomic, libgcc, libquadmath, libss,
    libvtv, and the C++ standard library respectively. These features may failat to
    compile when building a cross-compiler and are not necessary for the task of recompiling
    the temporary library.


    --enable-languages=c,c++

    This option ensures that only the C and C++ compilers are built. These are the
    only languages needed now.


    47'
