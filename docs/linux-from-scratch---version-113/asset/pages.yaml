  md: '# 87.4. Configuring E2fsprogs


    /etc/mke2fs.conf contains the default value of command line options of mke2fs.
    You may edit the file to make the default values suitable for your need. For example,
    some utilities (in LFS or BLFS) cannot recognize a ext4 file system with metadata_csum_seed
    enabled. If you need such an utility, you may remove the feature from the default
    ext4 feature list with the:


    ```

    sed ''s/metadata_csum_seed,/// -i /etc/mke2fs.conf

    ```


    Read the man page mke2fs.conf(5) for details.


