    Some keymaps have dead keys (i.e., that don''t produce a character by themselves,
    but put an accent on the character produced by the next key) or define composition
    rules (such as: “press Ctrl+. A E to get æ” in the default keymap). Linux-6.1.11
    interprets dead keys and composition rules in the keymap correctly only when the
    source characters composed together are not multibyte. This deficiency doesn''t
    affect keymaps for European languages, because there are accents added to accented
    ASCII characters, or two ASCII characters are composed together. In UTF-8 this
    is a problem; e.g., for Greek language, where one sometimes needs to put an accent
    on the letter ‘alpha’. The solution is to avoid the use of UTF-8, or to install
    the X window, which does not have this limitation, in its input handler


    For Chinese, Japanese, Korean, and other languages, the Linux console cannot be
    configured to display the needed character ranges. Users who need such languages
    should install the X Window System, fonts that cover the necessary character ranges,
    and the proper input method (e.g., SCIM programs support a variety of languages).


    > Note The /etc/sysconfig/console file only controls the Linux text console localization.
    It has nothing to do with setting the proper keyboard layout and terminal fonts
    in the X Window System, with ssh sessions, or with a serial console. In such situations,
    limitations in the last list items do not apply.


