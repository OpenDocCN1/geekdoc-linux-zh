    # # 9.6. System V Bootstrap Usage and Configuration


    # ## 9.6.1. How Do the System V Bootscripts Work?


    This version of LFS uses a special booting named SysVinit, based on a series of
    run levels. The boot procedure can be different from one system to another; the
    fact that things worked one way in a particular Linux distribution does not guarantee
    they will work in LFS. LFS has its own ways of doing things, but are generally
    accepted standards.


    There is an alternative boot procedure called systemd. We will not discuss boot
    process any further. For a detailed description visit https://www.linux.com/training-tutorials/understanding-and-using-systemd/.


    SysVinit (which will be referred to as "init" from now) uses a run levels scheme.
    There are seven run levels, numbered 0 to 6. (Actually, there are more run levels,
    but others are special cases and are generally not used. See init for more details.)
    Each of the seven corresponds to actions the computer is supposed to perform when
    it starts up or shuts down. The default run level is 3. Here are the descriptions
    of the different run levels as they are implemented in LFS:


    +   0: halt the computer

    1: single-user mode

    2: reserved for customization, otherwise the same as 3

    3: multi-user mode with networking

    4: reserved for customization, otherwise the same as 3

    5: same as 4, it is usually used for GUI login (like GNOME''s gdm or LXDE''s lxdm)

    6: reboot the computer


    > Classically, run level 2 above was defined as "multi-user mode without networking",
    but this was only the case years ago when multiple users could connect to a system
    via serial ports. In today''s environment it makes no sense, and we now say it
    "reserved".'
