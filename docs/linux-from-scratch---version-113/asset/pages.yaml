- img_proc: true
  md: 'If the packages and patches are downloaded as a non-root user, these files
    will be owned by the owner. The file system records the owner by their UID, and
    the UID of a normal user in the host distro is not assigned in LFS. So the files
    will be left owned by an unnamed UID in the final FS system. If you won''t assign
    the same UID for your user in the LFS system, root now to avoid this issue:


    ```

    chown root:root $LFS/sources/*

    ```


