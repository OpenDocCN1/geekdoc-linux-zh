  md: '# ## 6.3. Ncurses-6.4


    The Ncurses package contains libraries for terminal-independent handling of character
    screens.


    Approximate build time: 0.3 SBU

    Required disk space: 51 MB


    # ### 6.3.1. Installation of Ncurses


    First, ensure that `awk` is found first during configuration:


    ```

    sed -i s/gawk// configure

    ```


    Then, run the following commands to build the “tic” program on the build host:


    ```

    mkdir build

    push build

    ./configure

    make -C include

    make -C progs tic

    popd

    ```


    Prepare Ncurses for compilation:


    ```

    ./configure --prefix=$usr \

    --host=$LFS_TARGET \

    --build=$(./config.guess) \

    --mandir=/usr/share/man \

    --with-manpage-format=normal \

    --with-shared \

    --without-normal \

    --with-cxx-shared \

    --without-debug \

    --without-ada \

    --disable-stripping \

    --enable-wide

    ```


    The meaning of the new configure options:


    --with-manpage-format=normal

    This prevents Ncurses installing compressed manual pages, which may happen if
    the host distribution itself has compressed manual pages.


    --with-shared

    This makes Ncurses build and install C libraries.


    --without-normal

    This prevents Ncurses building and installing static C libraries.


    --without-debug

    This prevents Ncurses building and installing debug libraries.


    --with-cxx-shared

    This makes Ncurses build and install shared C++ bindings. It also prevents it
    building and installing static C+ + bindings.


    --without-ada

    This ensures that Ncurses does not build support for the Ada compiler, which may
    be present on the host but will not be available once we enter the chroot environment.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '--disable-stripping


    This switch prevents the building system from using the strip program from the
    host. Using host tools on cross-compiled programs can cause failure.


    --enable-wide


    This switch causes wide-character libraries (e.g., libncursesw.so.6.4) to be built
    instead of normal ones (e.g., libncurses.so.6.4). These wide-character libraries
    are usable in both multibyte and traditional 8-bit locales, where normal libraries
    work properly only in 8-bit locales. Wide-character and normal libraries are source-compatible,
    but not binary-compatible.


    Compile the package:


    ```

    make

    ```


    Install the package:


    ```

    make DESTDIR=$LFS TIC_PATH=$(pwd) /build/progs/tic install

    echo "INPUT(-incursesw)" > $LFS/usr/lib/libcurses.so

    ```


    # The meaning of the install options:


    TIC_PATH=$(pwd) /build/progs/tic


    We need to pass the path of the newly built tic program that runs on the building
    machine, so the terminal database can be created without errors.


    echo "INPUT(-Incursesw)" > $LFS/usr/lib/libcurses.so


    The libcurses.so library is needed by a few packages we will build soon. We create
    this small linker script, as this is done in Chapter 8.


    Details on this package are located in Section 8.28.2, “Contents of Ncurses.”'
