  md: '# Chapter 7. Entering Chroot and Building Additional Temporary Tools


    # 7.1. Introduction


    This chapter shows how to build the last bits of the temporary system: the tools
    needed to build the various packages. Now that all circular dependencies have
    been resolved, a "chroot" environment, completely isolated from the operating
    system (except for the running kernel), can be used for build.


    For proper operation of the isolated environment, some communication with the
    running kernel must be established. This is done via the so-called *Virtual Kernel
    File Systems*, which will be mounted before the chroot environment. You may want
    to verify that these are mounted using the **findmnt** command.


    Until Section 7.4, "Entering The Chroot", the commands must be run as `root`.
    After entering chroot, all commands are run as `root`, fortunately without access
    to the OS of the computer you built LFS on. By being careful, it is easy to destroy
    the LFS system with bad commands.


    # 7.2. Changing Ownership


    > Note

    The commands in the reorder of this book must be performed while logged in as
    user root and no longer as user lfs. Also, double check that $IFS is set in root''s
    environment.


    Currently, the home directory $LFS is owned by the user lfs, a user that exists
    only on the host system. If the directories and files under `$LFS` are kept as
    they are, they will be owned by a user ID without a corresponding account. This
    is dangerous because a user account created later could get this same user ID
    and own all the files under `$LFS`, exposing these files to potentially malicious
    neighbour.


    To address this issue, change the ownership of the `$IFS/` directories to use
    root by running the following command:


    ```

    chown -R root:root $LFS/{usr,lib,etc,bin,sbin,tools}

    case $(uname -m) in

    x86_64) chown -R root:root $LFS/lib64 ;;

    esac

    ```


    # 7.3. Preparing Virtual Kernel File Systems


    Applications in userspace utilize various file systems created by the kernel to
    communicate with the kernel itself. These file systems are virtual: no disk space
    is used for them. The of these file systems must be mounted in the `$LFS` directory
    tree so the applications can find them in the chroot environment.


    By creating the directories on which these virtual file systems will be mounted:


    ```

    mkdir -pv $LFS/{dev,proc,sys,run}

    ```


    # 7.3.1. Mounting and Populating /dev


    During a normal boot of an LFS system, the kernel automatically mounts the `devtmpfs`
    file system on the /dev directory; the kernel creates device nodes on that file
    system during the boot process, or when a device is first accessed or accessed.
    The udev daemon may change the ownership or permissions of the device nodes created
    by the kernel,'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Linux From Scratch - Version 11.3


    and create new devices or symlinks, to ease the work of device maintainers and
    system administrators. Section 9.3.2.2, "Device Creation" for details.). If the
    kernel supports devtmpfs, we can simply mount a devtmpfs at $LFS/dev and rely
    on the kernel to populate it.


    But some kernels lack devtmpfs support; these hosts use different methods to create
    the content of /dev. The only-agnostic way to populate the $LFS/dev directory
    is by binding the host system''s /dev directory. A bind mount is a type of mount
    that makes a subdirectory or a file visible at some other location. Use the following
    command to do this.


    # 7.3.2. Mounting Virtual Kernel File Systems


    Now mount the remaining virtual file systems:


    ```

    mount -v --bind /dev/pts $LFS/dev/pts

    mount -vt proc proc $LFS/proc

    mount -vt sysfs sysfs $LFS/sys

    mount -vt tmpfs tmpfs $LFS/run

    ```


    In some systems, /dev/shm is a symbolic link to /run/shm. The run tmpfs was mounted
    so in this case unless a directory needs to be created.


    In other systems, /dev/shm is a mount point for tmpfs. In this case the mount
    of /dev will create /dev/shm as a directory in the root environment. We must explicitly
    mount a tmpfs:


    ```

    if [ -h $LFS/dev/shm ]; then

    mkdir -pv $LFS/readlink $LFS/dev/shm

    else

    mount -t tmpfs -o nouid, nodev tmpfs $LFS/dev/shm

    fi

    ```


    # 7.4. Entering the Chroot Environment


    Now that all the packages required to build the rest of the tools are on, it is
    time to enter the chroot environment and installing the temporary tools. This
    environment will also be used to install the final system. As user root, the following
    command to enter the environment is that we, populated with nothing but tools:


    ```

    chroot "$LFS" /usr/bin/env -i         \

    HOME=/root                               \

    TERM="$TERM"                           \

    PS1="(lfs root) \u:\$ " \

    PATH=/usr/bin:/usr                       \

    /bin/bash --login

    ```


    The -i option to the env command will clear all the variables in the chroot environment.
    After that, the HOME, TERM, and PATH variables are set. The TERM=$TERM construct
    sets the TERM variable inside the chroot as outside it. This variable is needed
    so programs like vim and less can operate properly. If other variables are defined,
    such as CFLAGS or XXFLAGS, this is a good place to set them.


    From this point on, there is no need to use the LFS variable because all work
    will be restricted to the LFS system; the chroot runs the Bash shell with the
    root/) directory set to $LFS.


    Notice that /tools is not in the PATH. This means the toolchain will no longer
    be used.


    Note that the bash prompt will say I have no name! This is normal because /etc/passwd
    file has not been created.


    76'
