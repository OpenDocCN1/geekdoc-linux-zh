  md: '# # Chapter 9. System Configuration


    # ## 9.1. Introduction


    Booting a Linux system involves several tasks. The process must mount both virtual
    and real file systems, initialize devices, check file systems for integrity, mount
    and activate swap partitions or files, set the system clock, bring up networking,
    start any daemons required by the system, and accomplish any other custom tasks
    specified by the user. This process must be organized to ensure the tasks are
    performed in the correct order and executed as quickly as possible.


    # ### 9.1.1. System V


    System V is the classic boot process that has been used in Unix and Unix-like
    systems such as Linux since about 1983. It consists of a small program, **init**,
    that sets up basic processes such as **login** (get getty) and runs scripts. This
    script, usually named **rc**, controls the execution of a set of additional scripts
    that performs the tasks required to initialize the system.


    The **init** program is controlled by the `/etc/inittab` file and is organized
    into run levels that can be changed by the user. In LFS, these are used as follows:


    +   - 0 — halt

    - 1 — Single user mode

    - 2 — User definable

    - 3 — Full multiuser mode

    - 4 — User definable

    - 5 — Full multiuser mode with display manager

    - 6 — reboot


    The usual default run level is 3 or 5.


    # ## Advantages


    +   - Established, well understood system.

    - Easy to customize.


    # ## Disadvantages


    +   - May slower to boot. A medium speed base LFS system takes 8-12 seconds when
    the boot time is measured from the first kernel message to the login prompt. Network
    connectivity is typically established about 2 seconds after the login prompt.

    - Serial processing of boot tasks. This is related to the previous point. A delay
    in any process, such as a file system check, will delay the entire boot process.

    - Does not directly support advanced features like control groups (cgroups) and
    per-user fair share scheduling.

    - Adding scripts requires manual, static sequencing decisions.'
