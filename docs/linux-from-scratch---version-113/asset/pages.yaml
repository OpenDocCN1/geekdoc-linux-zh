    # 9.6.5. Configuring the Linux Console


    This section discusses how to configure the console bootstrap that sets up the
    keyboard map, console font, and console kernel log. If non-ASCII characters (e.g.,
    the copyright sign, the British pound sign, and the Euro symbol) are not used
    and the keyboard is a U.S. one, much of this can be skipped. Without the configuration
    file (or equivalent settings in rc.site), the console bootstrap will do nothing.


    The console reads the /etc/sysconfig/console file for configuration information.
    Decide which keymap and screen font will be used. Various-language HOWTOs can
    also help with this; see https://ldp.org/HOWTO/HOWTO-INDEX/other-lang.html. If
    still, look in the /usr/share/keymaps and /usr/share/consolefonts directories
    for details. Read the loadkeys(1) and setfont(8) manual to determine the correct
    arguments for these programs.


    The /etc/sysconfig/console file should contain lines of the form: VARIABLE="value".
    The following variables are recognized:


    LOGLEVEL


    This variable specifies the log level for kernel messages sent to the console
    set by dmesg -n. Valid levels are from "1" (no messages) to "8". The default level
    is "7".


    KEYMAP


    This variable specifies the arguments for the loadkeys program, typical of the
    keymap to load, e.g., “it”. If variable is not set, the bootstrap will run without
    the loadkeys program, and the default keymap will be used. Note that some keymaps
    have multiple versions with the same name (cz and their variants in qwerty/ and
    in opcl/ and qwerty/, in fgGld/ and qw/). In these cases the parent directory
    should also be specified (e.g. qw/es) to ensure the proper keymap is loaded.


