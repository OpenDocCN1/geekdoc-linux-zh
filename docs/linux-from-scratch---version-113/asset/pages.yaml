  md: 'The package or section the problem was encountered in


    The exact error message, or a clear description of the problem


    Note whether you have deviated from the book at all


    > Note

    Deviating from this book does not mean that we will not help you. After all, LFS
    is about personal preference. Being up-front about any changes to the established
    procedure helps us evaluate and determine possible causes of your problem.


    # 1.5.2. Configure Script Problems


    If something goes wrong while running the configure script, review the config.log
    file. This file may contain errors encountered during configure which were not
    printed to the screen. Include the relevant lines if you need to ask for help.


    # 1.5.3. Compilation Problems


    Both the screen output and the contents of various files are useful in determining
    the cause of compilation problems. The screen output from the configure script
    and the make run can be helpful. It is not necessary to include the entire output,
    but do all of the relevant information. Here is an example of the type of information
    to include from the make screen output.


    ```

    gcc -DASPATH=/mnt/lfs/usr/share/locale/:\n-DLOCALDIR=/mnt/lfs/usr/share/locale/"

    -DLIB_ADDDIR=/mnt/lfs/usr/include/" -DHAVE_CONFIG_H - -I.

    -G02 -c getoptli.c

    gcc -O2 -static make arc o.arscan commands.do o.dir

    expand.file.o function.getopt.o implicit.o job.main.o

    disc.o rename make.o signame.o variable.o vpath.o

    default.o remote-stub.o version.o optl.o

    lljut.o. In function load_to_high;

    /lfs/tmp-3.79.1/job:c1565: undefined reference

    to glob

    collect[2]: ld returned 1 exit status

    make[2]: *** [make] Error 1

    make[2]: Leaving directory /lfs/tmp-3.79.1/

    make[1]: [all-recursive] Error 1

    make[1]: Leaving directory /lfs/tmp-3.79.1/

    make: [all-recursive-am] Error 2

    ```


    In this case, many people would just include the bottom section:


    ```

    make [2]: *** [make] Error 1

    ```


    This is not enough information to diagnose the problem, because it only notes
    that something went wrong, not what went wrong. The entire section, in the example
    above, is what should be saved because it includes the command that was executed
    and all the associated error messages.


    An article about asking for help for the Internet is online at http://catb.org/-esr/faqs/smart-questions.html.
    Right doing, and so will increase the likelihood of getting the help you need.'
