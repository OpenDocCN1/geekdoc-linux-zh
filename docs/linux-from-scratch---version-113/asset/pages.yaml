  md: '# Linux From Scratch - Version 11.3


    Binutils is installed first because the configure of both gcc and glibc perform
    various features on the assembler and linker to determine which software features
    to enable or disable. It is more important than one realize at first. An incorrectly
    configured gcc or glibc can result in a subtly broken toolchain, where the impact
    of such breakage might not show up until the end of an entire distribution. A
    test suite will easily highlight this error before too much additional work is
    performed.


    Binutils installs its assembler and linker in two locations, $LFS/tools/bin and
    $LFS/tools/$LFS_TGT/. The tools in one location are linked to the other. An important
    facet of the linker is its library search depth. Detailed information can be obtained
    by passing the --verbose flag. For example, $LFS_TGT-ld --verbose grep search
    will illustrate the current paths and order. (Note that this example can be seen
    only while logged in as root user). If you come back to this page later, replace
    $LFS-TGT-ld with id.


    The next package is installed. An example of what can be seen during its run of
    configure:


    ```

    checking what assembler to use... /mnt/lfs/tools/i686-linux-gnu/bin/as

    checking what linker to use... /mnt/lfs/tools/i686-linux-gnu/bin/ld

    ```


    This is for the reasons mentioned above. It also demonstrates that gcc''s configure
    does not search the PATH directories to find tools to use. However, during the
    actual operation of gcc, the same search paths are not necessarily used. To find
    out which linker will use, run: $LFS_TGT-gcc --print-name=ld. (Again, remove the
    $LFS_TGT-gcc prefix if coming back after this).


    Detailed information can be obtained from gcc by passing the -v command line option
    while compiling a program. For example, $LFS_TGT-gcc -v example.c (or without
    $LFS_TGT-) will show detailed information about the preprocessor, compiler, and
    assembly stages, gcc search paths for included headers and the header order.


    Next up: Linux API headers. The standard C library (glibc) to interface with features
    that the Linux kernel will provide.


    Next comes glibc. The most important considerations for building glibc are the
    compiler, binary tools and kernel headers. The headers is generally not an issue
    since glibc will always use the compiler matching the --host parameter passed
    to its configure script; e.g., in our case, the compiler is $LFS_TGT-gcc. The
    binary tools and kernel headers can be a bit more complex. Therefore, we take
    no risks and use the available configure switches to enforce the correct selections.
    After the run of configure, check the contents of the make file in the build directory
    for all important details. Note the use of cc=$LFS_TGT-gcc (with $LFS_TGT expanded)
    to control which binary tools are used and the use of --nostandlib and --system
    flags to control the compiler''s search path. These items highlight an important
    aspect of the glibc package—it is very sufficient in terms of its build machinery,
    and generally does not rely on toolchains.


    As mentioned above, the standard C++ library is installed next, followed by 6
    packages that do not be cross-compiled to circular dependencies at build time.
    The initial step of all those packages uses the DESTDIR to variable installation
    in the LFS filesystem


    At the End of Chapter 6 native Linux gcc is installed. First binutils-pass2 is
    built, in the same DESTDIR directory as the other programs, omitting some non-critical
    libraries. Due to some weird logic in gcc''s configure script, CC_FOR_TARGET ends
    up as cc when host is the same as target, but different from the build system.
    This is when CC_FOR_TARGET=$LFS_TGT-gcc is declared explicitly as one of the configuration
    options.


    Upon entering Chapter 7, the temporary installations of programs needed for the
    operation of the toolchain are performed. From this point onwards, the toolchain
    is self-contained and self-hosted. In Chapter 8, final versions of all the packages
    needed for a fully functional system are built, tested, and installed.'
