  md: 'It is important that all commands throughout the remainder of this chapter
    and the following chapters are run within the chroot environment. If you leave
    this environment for any reason (rebooting for example), ensure that the virtual
    kernel filesystems are mounted as explained in Section 7.3.1, "Mounting and /dev"
    and Section 7.3.2, "Mounting Virtual Kernel File Systems" and enter chroot again
    before continuing with the installation.


    # # 7.5. Creating Directories


    It is time to create the full directory structure in the LFS file system.


    Some of the directories mentioned in this section may have already been created
    earlier with explicit instructions, or when installing some packages. They are
    repeated below for completeness.


    Create root-level directories that are not limited in the previous chapters by
    issuing the following command:


    ```

    mkdir -pv /boot,home,mnt,opt,srv

    ```


    Create the required subdirectories below the root-level by issuing the following
    commands:


    ```

    mkdir -pv /etc/(opt,sysconfig)

    mkdir -pv /lib/firmware

    mkdir -pv /media/(floppy,cdrom)

    mkdir -pv /usr/(local)/(include,src)

    mkdir -pv /usr/(local)/bin,lib,sbin

    mkdir -pv /usr/(local)/share/(color,dict,info,local,man)

    mkdir -pv /usr/(local)/share/man/(misc,term,zoneinfo)

    mkdir -pv /usr/(local)/share/man/man(1..8)

    mkdir -pv /var/(cache,local,log,mail,opt,spool)

    mkdir -pv /var/lib/(color,misc,locate)

    mkdir -pv /var/run

    ln -sf /run /var/run

    ln -sf /lock /var/lock

    ```


    ```

    install -dv -m 0750 /root

    install -dv -m 1777 /tmp /var/tmp

    ```


    Directories are, by default, created with permission 775, but this is not desirable
    everywhere. In the commands above, two changes make—one to the home directory
    of user root, and another to the directories for families.


    The first mode ensures that anyone can just enter the /root directory—just like
    a normal user do with his her own home directory. The second mode makes sure that
    any user can write to the /tmp and var/tmp directories, but cannot remove another
    user''s files from them. The latter is prohibited by the so-called "sticky" bit,
    the highest bit in the 1777 bit.


    # # 7.5.1. FHS Compliance Note


    This directory tree is based on the Filesystem Hierarchy Standard (FHS) (available
    at https://refspecs.linuxfoundation.org/filesystem.html). The FHS also specifies
    the optional existence of additional directories such as /usr/local/games and
    /usr/share/games. In LFS, we create only the directories that are really necessary.
    However,'
