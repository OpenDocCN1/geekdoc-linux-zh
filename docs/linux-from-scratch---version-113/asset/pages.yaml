    \   --with-xz\n    --with-zstd\n    --with-zlib\n```\n\nThe meaning of the following\
    \ options:\n\n```\n--with-openssl\n```\n\nThis option enables Kmod to handle PKCS7\
    \ signatures for kernel modules.\n\n```\n--with-xz, --with-zlib, and --with-zstd\n\
    ```\n\nThese options enable Kmod to handle compressed kernel modules.\n\nCompile\
    \ the package:\n\n```\nmake\n```\n\nThe test suite of this package requires raw\
    \ kernel headers (not the \"sanitized\" kernel headers installed earlier), which\
    \ are beyond the scope of LFS.\n\nInstall the package and create symlinks for\
    \ compatibility with Module-Init-Tools (the package that previously handled Linux\
    \ kernel modules):\n\n```\nmake install\n\nfor target in depmod insmod modinfo\
    \ modprobe rmod; do\n  ln -sfv ../bin/kmod /usr/sbin/$target\ndone\nln -sfv kmod\
