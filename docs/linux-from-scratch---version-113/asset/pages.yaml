  md: '# 9.3. Overview of Device and Module Handling


    In Chapter 8, we installed the udev daemon when eudev built. Before we go into
    the details regarding how udev works, a brief history of previous methods of handling
    devices is in order.


    Linux systems in general traditionally used a static device creation method, where
    great many device nodes were created under /dev (literally thousands of them),
    regardless of whether the hardware devices actually existed. This was typically
    done via a MAKDEV script, which created a number of calls to the mknod program
    with the relevant major and minor device numbers for every possible device that
    might exist in the world.


    Using the udev method, device nodes are only created for those devices that are
    detected by the kernel. These device nodes are created in a devtmpfs file (a virtual
    file system that resides entirely in system memory). Device nodes do not require
    much space, so the memory that is used is negligible.


    # 9.3.1. History


    In February 2000, a new filesystem devfs was merged into the 2.3.46 kernel and
    was made available during the 2.4 series of stable kernels. Although it was present
    in the kernel source, this method of creating devices never received overwhelming
    support from the kernel developers.


    The main problem with the approach adopted by devfs was the lacked device detection,
    creation, and naming. The latter issue, was generally accepted that if device
    names are configurable, the device naming policy should be chosen by system administrators,
    and not imposed on them by the developer(s). The devfs filesystem also suffered
    from race conditions that were inherent in its design; these could be fixed without
    a substantial rebuild of the kernel. devfs was marked as deprecated for a long
    time, and was finally removed from the kernel in June, 2006.


    With the development of the unstable 2.5 kernel, later released as the 2.6 series
    of stable kernels, a new virtual filesystem sysfs came to be. The job of sysfs
    is to provide information about the system''s hardware configuration to users
    processes. With this userspace-visible representation, it became possible to develop
    a userspace replacement for devfs.


    # 9.3.2. Sysfs


    # 9.3.2.1. Sysfs


    The sysfs filesystem was mentioned briefly. One might wonder how sysfs knows about
    the devices present on a system and what device numbers should be used for them.
    Drivers that have compiled into the kernel register their objects in sysfs (devtmpfs
    internally) as they are detected by the kernel. For drivers compiled as modules,
    registration happens when the module is loaded. Once the sysfs filesystem is mounted
    on (/sys), data which the drivers registered with sysfs are available to userspace
    processes and to udev for processing (including modifications to device nodes).


    # 9.3.2.2. Device Node Creation


    Device files are created in the kernel devtmpfs file. Any driver that wishes to
    register a device node uses devtmpfs (via the kernel core) to do it. When a devtmpfs
    instance is mounted on /dev, the device node will be exposed to userspace with
    a fixed name, permissions, and owner.


    A short time later, the kernel will send a uevent to udev. Based on the rules
    specified in the files within the /etc/udev.rules, /usr/lib/udev/rules.d, and
    /run/udev/rules.d directories, udev will create additional symlinks to the device
    node, or change its permissions, owner, group, or modify the internal udev database
    entry (name) for that object.'
  merge: -1
