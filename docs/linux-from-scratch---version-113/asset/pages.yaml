    \ SBU\nRequired disk space: 156 MB\n\n# ## 8.54.1. Installation of Coreutils\n\
    \nPOSIX requires that programs from Coreutils recognize boundaries correctly even\
    \ in multibyte locales. The following patch fixes this non-compliance and other\
    \ internationalization-related bugs.\n\n```\npatch -Np1 -i ../coreutils-9.1-i18n-1.patch\n\
    ```\n\n> > **Note\nMany bugs have been found in this patch. When reporting new\
    \ bugs to the Coreutils maintainers, please check first to see if those bugs are\
    \ reproducible without this patch.\n\nPrepare autoreconf for compilation:\n\n\
    ```\nautoreconf --f\nFORCE_UNSAFE_CONFIGURE=1 ./../configure \\\n  --prefix=/usr\
    \ \\\n  --enable-no-install-program=kill,uptime\n```\n\n**The meaning of the configure\
    \ options:**\n\n`autoreconf`\n\nnThe patch for internationalization has modified\
    \ the build system, so the configuration files must be regenerated.\n\nFORCE_UNSAFE_CONFIGURE=1\n\
    This environment variable allows the package to be built by the `root` user.\n\
    \n`enable-no-install-program=kill,uptime`\nThe purpose of this switch is to prevent\
    \ Coreutils from installing programs that will be installed by other packages.\n\
    \nCompile the package:\n\n```\nmake\n```\n\nSkip down \"Install the package\"\
    \ if not running the test suite.\n\nNow the test suite is ready to run. First,\
    \ run the tests that are meant to be run as user `root`:\n\n```\nmake NON_ROOT_USERNAME=tester\
    \ check-root\n```\n\nWe're going to run the remainder of the tests as the `tester`\
    \ user. Certain tests require that the user be a member of more than one group.\
    \ These tests are not skipped, add a temporary group and make the `tester` part\
    \ of it:\n\n```\necho \"dummy:x:102:tester\" >> /etc/group\n```\n\nFix some the\
    \ permissions so that the non-root user can compile and run the tests:\n\n```\n\
    chown -Rv tester\n```\n\nNow the tests:\n\n```\nsu tester -c \"PATH=\\$PATH RUN_EXPENSIVE_TESTS=yes\
    \ check\",\n```"
