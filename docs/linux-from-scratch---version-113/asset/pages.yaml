  md: '# Linux From Scratch - Version 11.3


    Note that the "softdev" command also allows pre: dependencies, or a mixture of
    pre and post: dependencies. The modprobe.d(5) manual page for more information
    on "softdev" syntax and capabilities.


    If the module in question is not a wrapper and is used itself, the modules bootscript
    to load this module on system boot. To do this, add the module name to the /etc/sysconfig/modules
    file on a separate line. This works for wrapper modules too, but is suboptimal
    in that.


    # 9.3.3.3. Udev Loads Unwanted Modules


    Either don''t build the module, or blacklist it in a /etc/modprobe.d/blacklist.conf
    file as done with the forte module in the example:


    ```

    blacklist forte

    ```


    Blacklisted modules can still be loaded manually with the explicit modprobe command.


    # 9.3.3.4. Udev Creates a Device Incorrect, or Makes the Wrong Symlink


    This usually happens if a rule unexpectedly matches a device. For example, a poorly-written
    rule can match both a SCSI device (as desired) and the corresponding SCSI device
    (incorrectly) by vendor. Finding the offending rule and making it more specific,
    with the help of the udev info command.


    # 9.3.3.5. Udev Rule Works Unreliably


    This may be another manifestation of the previous problem. If not, and your rule
    uses sysfs attributes, it may be a kernel timing issue, so you can work around
    it by creating a rule that waits for the sysfs attributes and points to the /etc/udev/rules/10-wait_for_sysfs.rules
    file (create this if it does not exist). Please notify the LFS Development if
    you do so and let us


    # 9.3.3.6. Udev Does Not Create a Device


    First, be certain that the device is built into the kernel or already loaded as
    a module, and udev is not creating a mismatched device.


    If a kernel does not export its data to sysfs, udev lacks the information needed
    to create a device node. A static device node in /usr/lib/udev/devices with the
    appropriate major/minor numbers (see the devices.txt inside the kernel documentation
    or the documentation provided by the third party driver). The static device node
    will be copied to /dev by udev.


    # 9.3.3.7. Udev Naming Order Changes Randomly After Rebooting


    This is due to the fact that udev, by design, handles events and modules in parallel,
    and thus in an unpredictable order. One will not rely upon kernel device names
    being stable. Instead, create your rules that make symlinks with stable names
    based on some stable attributes of the device, such as a serial number or the
    output of various *_id utilities installed by udev. See Section 9.4, "Managing
    Devices" and Section 9.5, "General Configuration" for examples.


