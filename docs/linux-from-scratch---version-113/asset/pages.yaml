  md: '# Linux From Scratch - Version 11.3


    Compile GCC by running:


    ```

    make

    ```


    Install the package:


    ```

    make install

    ```


    This build of GCC has installed a couple of internal system headers. Normally
    one of them, limits.h, would turn include the corresponding system limits.h header,
    in this case, $LFS/usr/include/limits.h. However, at the time of this build of
    GCC $LFS/usr/include/limits.h does not exist, so the internal header that has
    just been installed is a partial, self-contained file and does not include the
    extended features of the system header. This is adequate for building Glibc, but
    the full internal header will be needed later. Create a full version of the internal
    header using a command that is identical to what the GCC build system does in
    normal circumstances.


    > Note

    The command below shows an example of nested command substitution using two methods:
    backquotes and a $() construct. It could be rewritten using the same method for
    both substitutions, but is shown this way to demonstrate how they can be mixed.
    Generally the $() method is preferred.


    ```

    cd ..

    cat gcc/limitx.h gcc/limits.h gcc/limity.h > `dirname $(($LFS_TGT-gcc -print-libgcc-file-name)`/install-tools/include/limits.h`

    ```


    Details on this package are located in Section 8.26.2, "Contents of GCC."'
