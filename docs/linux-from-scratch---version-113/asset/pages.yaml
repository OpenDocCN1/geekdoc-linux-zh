  md: '# Linux From Scratch - Version 11.3


    # 1.4.2. Mailing Lists


    The linuxfromscratch.org server hosts a number of mailing lists used for the development
    of the LFS project. These lists include the main development support lists, among
    others. If you cannot find an answer to your problem on the FAQ page, the next
    step is to search the mailing lists at https://www.linuxfromscratch.org/search.html.


    For information the different lists, how to subscribe, archive locations, and
    additional information, visit https://www.linuxfromscratch.org/mail.html.


    # 1.4.3. IRC


    Members of the LFS community offer assistance via Internet Relay Chat (IRC). Before
    using this, please make sure your question is not already answered in the LFS
    FAQ or the mailing list archives. You can find the IRC network at irc.libera.chat.
    The support channel is named #lfs-support.


    # 1.4.4. Mirror Sites


    The LFS project has a number of world-wide mirrors to make accessing the website
    and downloading the required packages more convenient. Please visit the LFS website
    at https://www.linuxfromscratch.org/mirrors.html for a list of current mirrors.


    # 1.4.5. Contact Information


    Please direct all your questions and comments to one of the LFS mailing lists
    (see above).


    # 1.5. Help


    If an issue or a question is encountered while working through this book, please
    check the FAQ page at https://www.linuxfromscratch.org/faq/#generalfaq. Questions
    are often already answered there. If your question is not answered on that page,
    try to find the source of the problem. The following hint will give you some guidance
    for troubleshooting: https://www.linuxfromscratch.org/hints/downloads/files/errors.txt.


    If you cannot find your problem listed in the FAQ, search the mailing lists at
    https://www.linuxfromscratch.org/search. We have a wonderful LFS community that
    is willing to offer assistance through the mailing lists and IRC (see the Section
    1.4, “Resources” section of this book). However, we get support questions every
    day, and many of them could have been easily answered by going to the FAQ or by
    searching the mailing lists first. So, for us to offer the best assistance possible,
    you should first do some research on your own. That allows us to focus on the
    more unusual support needs. If your searches do not provide a solution, please
    include all the relevant information (mentioned below) in your request for help.


    # 1.5.1. Things to Mention


    Apart from a brief explanation of the problem being experienced, any request for
    help should include these essential things:


    +   - The version of the book being used (in this case 11.3)

    - The host distribution and version being used to create LFS

    - The output from the Host System Requirements script'
