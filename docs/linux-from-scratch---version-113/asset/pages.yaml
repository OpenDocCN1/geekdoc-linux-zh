  md: '# Linux From Scratch - Version 11.3


    The installation script needs to be fooled, the package thinks it is installed
    in /usr though in reality it is installed in the /usr/pkg hierarchy. In this manner
    it is not usually a trivial task. For example, suppose you are installing a package
    libfoo-1.1. The following instructions may not install the package:


    ```

    /configure --prefix=/usr/pkg/libfoo/1.1

    make

    make install

    ```


    The installation will work, but the dependent packages may link to libfoo as you
    would expect. If you compile a package that links libfoo, you may notice that
    it is linked to /usr/pkg/libfoo/1.1/lib/libfoo.so.1 instead of /usr/lib/libfoo.so.1
    as you would expect. The correct approach is to direct the installation using
    DESTDIR. This approach works as follows:


    ```

    /configure --prefix=/usr

    make

    DESTDIR=/usr/pkg/libfoo/1.1 install

    ```


    Most packages support this approach, but there are some which do not. For the
    non-compliant packages, you may either install the package manually, or you may
    find that it is easier to install some packages into /opt.


    # 8.2.2.4. Timestamp Base


    In this technique, a file is timestamped before the installation of the package.
    After the installation, a simple use of the find command with the appropriate
    options can generate a log of all the files after the timestamp file was created.
    A package manager that uses this approach is install-log.


    Though this scheme has the advantage of being simple, it has two drawbacks. During
    installation, the files are installed with any timestamp other than the current
    time, files will not be tracked by the package manager. Also, this scheme can
    only be used when packages are installed one at a time. The logs are not reliable
    if two packages are installed simultaneously from two different consoles.


    # 8.2.2.5. Creating Installation Scripts


    In this approach, the installation scripts perform are recorded. There are two
    techniques that one can use:


    The LD_PRELOAD environment variable can be set to point to a library to be preloaded
    before installation. During installation, this library tracks the packages that
    are installing by attaching itself to executables such as cp, install, and tracking
    the system calls that modify the file. For this approach, all the executables
    need to be dynamically linked without the sudo or gid bit. Preloading the library
    may cause unwanted side-effects during installation. Therefore, it''s a good idea
    to perform some tests to ensure that the package manager does not break anything,
    and it logs all the appropriate files.


    Another technique is to use strace, which logs all the system calls made during
    the execution of the installation scripts.


    # 8.2.2.6. Creating Package Archives


    In this scheme, the package installation is faked into a separate directory as
    previously described in the symlink style package management section. After the
    installation, a package archive is created using the installed files. This is
    used to install the package on the local machine or even on other machines.


    This approach is used by most of the package managers found in the commercial
    distributions. Examples of package managers that follow this approach are RPM
    (which is required by the Linux Standard Base Specification), Debian''s and Gentoo''s
    Portage system. A hint describing how to adopt this type of package management
    for LFS is located at https://www.linuxfromscratch.org/hints/downloads/files/fakeroot.txt.


    93'
