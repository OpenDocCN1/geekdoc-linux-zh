    > **Important**

    In this section, the test suite for Glibc is considered critical. Do not skip
    it under any circumstance.


    Generally few tests do not pass. The test failures listed below are usually safe
    to ignore.


    ```

    make check

    ```


    You may see some test failures. The Glibc test suite is somewhat dependent on
    the host system. A few failures out over 5000 tests can generally be ignored.
    This is a list of the most common issues seen for recent versions of LFS:


    +   - io/tst-lchmod is known to fail in the LFS growth environment.

    - misc/tst-ttyname is known to fail in the LFS growth environment.

    - The stdlib/tst-arc4random-thread test is known to fail if the host kernel is
    relatively old.

    - Some tests, for example nss/tst-nss-hosts-multi, are known to fail on relatively
    slow systems due to an internal timeout.


    Though it is harsh message, the install stage of Glibc will complain about the
    absence of /etc/ld.so.conf. Prevent this warning with:


    ```

    touch /etc/ld.so.conf

    ```


    Fix the Makefile to skip an unneeded sanity check that fails in the LFS partial
    environment:


    ```

    sed ''/test-installation/s@$(PERL)@echo not running@'' -i ..Makefile

    ```


    Install the package:


    ```

    make install

    ```


    Fix a hardcoded path to the executable loader in the ldd command:


    ```

    sed ''/RTLDLIST*/s@/usr@@'' -i /usr/bin/ldd

    ```


    Install the configuration file and runtime directory for nscd:


    ```

    cp -v ..nscd/nscd.conf /etc/nscd.conf

    mkdir -p /var/cache/nscd

