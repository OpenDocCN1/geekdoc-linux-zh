  md: '# # Configuring Sysvinit


    During kernel initialization, the first program that is run (if not overridden
    on the command line) is **init**. This program reads the initialization file `/etc/initab`.
    Create this file with:


    ```

    cat > /etc/initab << "EOF"

    # Begin /etc/initab


    id:3:sysvinit:

    s1:wait:/etc/rc.d/init.d/rc 0

    10:wait:/etc/rc.d/init.d/rc 0

    11:wait:/etc/rc.d/init.d/rc 1

    12:wait:/etc/rc.d/init.d/rc 2

    13:wait:/etc/rc.d/init.d/rc 3

    14:wait:/etc/rc.d/init.d/rc 4

    15:wait:/etc/rc.d/init.d/rc 5

    16:wait:/etc/rc.d/init.d/rc 6


    ca:12345:ctrlalt:sbin/shutdown -t1 -a -r now


    s0:once:/sbin/sologin

    s1:respawn:/sbin/sologin

    1:2345:respawn:/sbin/agetty tty 9600

    2:2345:respawn:/sbin/agetty tty 9600

    3:2345:respawn:/sbin/agetty tty 9600

    4:2345:respawn:/sbin/agetty tty 9600

    5:2345:respawn:/sbin/agetty tty 9600

    6:2345:respawn:/sbin/agetty tty 9600


    EOF

    ```


    An explanation of this initialization file is in the man page for `initab`. In
    LFS, the initialization file invokes `rc` to run all scripts starting with an
    S in the `/etc/rc.d/rc.S` directory followed by all scripts starting with an S
    in the `/etc/rc.d/rc?` directory where the question mark is replaced by the itdefault
    value.


    As a consequence, the `rc` script reads a library of functions in `/lib/lsb/init-functions`.
    This library also reads an configuration file, `/etc/sysconfig/rc.site`. Any of
    the system configuration parameters described in subsequent sections can be placed
    in this file, allowing consolidation of all system parameters in one file.


    As a debugging convenience, the functions script also logs all output to `/run/var/bootlog`.
    The run directory is a tmpfs, which is not persistent across reboots; it is appended
    to the more permanent `/var/log/` at the end of the boot process.


    # ## 9.6.2. Changing Run Levels


    Changing run levels is done with `init <runlevel>`, where `<runlevel>` is the
    target run level. For example, to reboot the computer, you could use **init 6**
    which is an alias for the reboot command. **init 0** is an alias for the halt
    command.


    There are a number of directories under `/etc/rc.d` that look like `rc?` (where
    ? is the run level) and `rc.S`, all containing a symbolic link. Some begin with
    a K; the others begin with an S, and all of them have two numbers following the
    initial letter. The K means to stop (kill) a service and the S means to start
    a service. The numbers determine the order in which the scripts are run, from
    00 to 99—the smaller the number, the sooner the that script runs. When **init**
    switches to another run level, the appropriate services are either started or
    stopped, depending on the run level.'
  merge: -1
