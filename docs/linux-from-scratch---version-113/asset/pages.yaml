  md: '# 8.77. About Debugging Symbols


    Most programs and libraries are, by default, compiled with debugging symbols included
    (with `gcc -g` option). This means that when debugging a program or library that
    was compiled with debugging information, the debugger can provide not only memory
    addresses, but also the names of the routines and variables.


    The inclusion of these debugging symbols enlarges a program or library significantly.
    Here are two examples of the amount of space they occupy:


    +   * bash binary with debugging symbols: 1200 KB

    * bash binary without debugging symbols: 480 KB (60% smaller)

    * Glibc and GCC files (`/lib` and `/usr/lib`) with debugging symbols: 87 MB

    * Glibc and GCC files without debugging symbols: 16 MB (82% smaller)


    Sizes vary wildly depending on which compiler and C library were used, a program
    that has been stripped of debugging symbols is usually smaller by 50% to 80% than
    its unstripped counterpart. Because most users will never use a debugger on their
    system software, a lot of disk space can be regained by removing these symbols.
    The next section shows how to strip all debugging symbols from the programs and
    libraries.


    # 8.78. Stripping


    This section is optional. If the intended user is not a programmer and does not
    plan to do any debugging of the system, the system''s size can be decreased by
    some 2 GB by removing the debugging symbols, and some symbol table entries, from
    binaries and libraries. This causes no real inconvenience for a typical Linux
    user.


    Most people who use the commands mentioned below do not experience any difficulties.
    However, it is easy to make a mistake and render the system unusable. Before running
    the `strip` commands, it is a good idea to make a backup of a LFS system in its
    current state.


    A `strip` command with the `--strip-needed` option removes all debugging symbols
    from a binary or library. It also removes symbol table entries not needed by the
    linker (for static libraries) or dynamic linker (for dynamically linked binaries
    and shared libraries).


    The debugging symbols from selected libraries are preserved in separate files.
    Debugging information is needed for regression tests with `valgrind` or `gdb`,
    in BLFS.


    Note that `strip` will overwrite the binary or library file it is processing.
    This can crash the processes using code or data from the file. If the process
    running `strip` is active, the binary or library being stripped can be destroyed;
    to avoid this problem we copy some libraries and binaries into `/tmp`, we strip
    there, then reinstall them with the `install` command here. (The related entry
    in Section 8.2.1, "Upgrade Issues" gives the rationale for using the `install`
    command here.)


    > ELF loader''s name is ld-linux-x86-64.so on 64-bit systems and ld-linux.so on
    32-bit systems. The construct selects the correct name for the current architecture,
    excluding anything ending with "g", in case the commands have already been run.'
  merge: -1
