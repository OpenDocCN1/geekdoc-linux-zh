    # FONT


    This variable specifies the arguments for the setfont program. Typically, this
    includes the font name, "m", and the name of the application character map to
    load. E.g., in order to load the "lat1-16" font with the "8859-1" application
    character map (appropriate in the USA), set this to "lat1-16 -m 8859-1". In UTF-8
    mode, the kernel uses the application character map to convert 8-bit keys to UTF-8.
    The argument of the "m" parameter should be to the encoding of the composed keys
    in the keymap.


    # UNICODE


    Set variable to "1", "yes", or "true" in order to put the console into UTF-8 mode.
    This is useful for UTF-8 based locales and harmful otherwise.


    # LEGACY_CHARSET


    For many keyboard layouts, there is no stock Unicode keymap in the Kbd package.
    The console bootstrap will convert an available keymap to UTF-8 on the fly if
    this variable is set to the encoding of the available non-UTF


