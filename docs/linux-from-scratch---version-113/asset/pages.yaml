  md: '# 8.63. Kbd-2.5.1


    The Kbd package contains key-table files, console fonts, and keyboard utilities.


    Approximate build time: 0.1 SBU

    Required disk space: 35 MB


    # 8.63.1. Installation of Kbd


    The behavior of the backspace and delete keys is not consistent across the keymaps
    in the Kbd package. The following patch fixes this for i386 keymaps:


    ```

    patch -Npl -i ../kbd-2.5.1-backspace-1.patch

    ```


    After patching, the backspace key generates the character with code 127, and the
    delete key generates a well-known escape sequence.


    Remove the redundant resizecons program (it requires the defunct sgvalid to provide
    the video mode files - for normal using setfont appropriately) together with its
    manpage.


    ```

    sed -i ''/RESIZONS_PROGS=/yes/no/'' configure

    sed -i ''/s/resizecons.8 //'' docs/man/8/Makefile

    ```


    Prepare Kbd for compilation:


    ```

    ./configure --prefix=/usr --disable-vlock

    ```


    The meaning of the configure option:


    ```

    --disable-vlock

    ```


    This option prevents the vlock utility from being built because it requires the
    PAM library, which isn''t available in the chroot environment.


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```


    > Note: For some languages (e.g., Belarusian) the Kbd package doesn''t provide
    a useful keymap where the "by" keymap assumes the ISO-8859-5 encoding, and the
    CP1251 keymap is normally used. Users of such languages have to do working keymaps
    separately.


    If desired, install the documentation:


    ```

    mkdir -pv /usr/share/doc/kbd-2.5.1

    cp -R -v docs/doc/* /usr/share/doc/kbd-2.5.1

    ```'
  merge: -1
