  md: '# ## 9.4. Managing Devices


    # ### 9.4.1. Network Devices


    Udev, by default, names network devices according to Firmware/BIOS data or physical
    characteristics like the bus, slot, or MAC address. The purpose of this naming
    convention is to ensure that network devices are named consistently, not based
    on when the network card was discovered. In older versions of Linux—on a computer
    with two network cards made by Intel and Realtek, for instance—the network card
    manufactured by Intel might have been eth0 while the Realtek card had been eth1.
    After a reboot, the cards would sometimes get renamed by the other around.


    In the new naming scheme, typical network device names are something like enp5s0
    or wlp3s0. If this naming convention is not desired, the traditional naming scheme,
    or a custom scheme, can be implemented.


    # #### 9.4.1.1. Disabling Persistent Naming on the Kernel Command Line


    The traditional naming scheme using eth0, eth1, etc. can be restored by adding
    `net.ifnames=0` on the kernel command line. This is most appropriate for systems
    that have just one device of a particular type. Laptops have two ethernet connections
    named eth0 and wlan0; so laptops can also use this method. The command line is
    in the GRUB configuration section 10.4.4, "Creating the GRUB Configuration File".


    # #### 9.4.1.2. Creating Udev Rules


    The naming scheme can be customized by creating custom udev rules. A script has
    been included that generates the initial rules. By running:


    ```

    bash /usr/lib/udev/init-net-rules.sh

    ```


    Now, inspect `/etc/udev/rules.d/70-persistent-net.rules`, to find out which name
    was assigned to your network device:


    ```

    cat /etc/udev/rules.d/70-persistent-net.rules

    ```


    > In some cases, as when MAC addresses have been assigned to a network card manually,
    or in a virtual environment like Qemu or Xen, the network rules file may not be
    generated because addresses are not consistently assigned. In these cases, this
    method cannot be used.


    The file begins with a comment block, followed by two lines for NIC. The first
    line for NIC is a commented description showing its hardware IDs (e.g. its vendor
    and device IDs, if it''s a PCI card), also with its driver (in parentheses, if
    the driver can be found). Neither the hardware ID nor the driver is used to determine
    which name to give an interface; this information is only for reference. The second
    line is the udev rule that matches this NIC and actually assigns a name.


    All udev rules are made up of several keywords, separated by commas and optional
    whitespace. Here are the keys, and an explanation of each:


    +   * SUBSYSTEM=net - This tells udev to ignore devices that are not network cards.


    +   * ACTION="add" - This tells udev to ignore this rule for a event that isn''t
    an "remove" or "change" uevent also happens, but not need to rename network interfaces.


    +   * DRIVERS="?" - This exists so udev will ignore VLAN or sub-interfaces (because
    these sub-interfaces do not have drivers). These sub-interfaces are skipped because
    the name that would be assigned would collide with the parent devices.'
