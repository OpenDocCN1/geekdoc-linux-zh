  md: 'A review of the following configuration files is also appropriate at this point.


    +   * /etc/bashrc

    * /etc/dircolors

    * /etc/fstab

    * /etc/hosts

    * /etc/inputrc

    * /etc/profile

    * /etc/resolv.conf

    * /etc/vimrc

    * /root/.bash_profile

    * /root/.bashrc

    * /etc/sysconfig/ifconfig.eth0


    Now that we have said that, let''s move on booting our shiny new LFS installation
    for the first time! First exit from the chroot environment:


    Then unmount the virtual file systems:


    ```

    mount -v $LFS/dev/pts

    mountpoint -q $LFS/dev/shm && mount $LFS/dev/shm

    mount -v $LFS/dev

    mount -v $LFS/run

    mount -v $LFS/proc

    mount -v $LFS/sys

    ```


    If multiple partitions were created, unmount the other partitions before unmounting
    the main one, like this:


    ```

    mount -v $LFS/home

    mount -v $LFS

    ```


    Unmount the LFS file system itself:


    ```

    mount -v $LFS

    ```


    Now, reboot the system.

    Assuming the GRUB boot loader was as outlined earlier, the menu is set to boot
    LFS 11.3 automatically.

    When the reboot is complete, the LFS system is ready for use and more software
    may be added to suit your needs.


