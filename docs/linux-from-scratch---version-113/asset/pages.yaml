    Compile the package:


    ```

    make

    ```


    > Important

    In this section, the test suite for GCC is considered important, but it takes
    a long time. First-time builders are encouraged to run the test suite. The time
    to run the tests can be reduced significantly by adding -jx to the make -k check
    command below, where x is the number of CPU cores on your system.


    One of tests in the GCC test suite is known to exhaust the default stack, so increase
    the stack size prior to running the tests:


    ```

    ulimit -s 32768

    ```


    Test the results as a non-privileged user, but do not stop at errors:


    ```

    chown -R tester

    su tester -c "PATH=$PATH make -k check"

    ```


    To extract a summary of the test suite results, run:


    ```

    ./contrib/test_summary

    ```


    To filter out only the summaries, pipe the output through grep -A7 Summ.

    Results can be compared with those located at https://www.linuxfromscratch.org/lfs/build-logs/11.3/
    and https://gnu.org/ml/gcc-testresults.


    Eleven tests in the i386 suite for the gcc compiler are FAIL. It''s because the
    test files do not account for the --enable-default-pie option.


    Four tests related to PR10400 may be reported as both XPASS and FAIL when testing
    the g++ compiler; the test file is not written.


    A unexpected failures cannot always be avoided. The GCC developers are usually
    aware of these issues, but have not resolved them yet. The test results are vastly
    different from those at the above URL, it is safe to continue.


    Install the package:


    ```

    make install

    ```


    The GCC directory is owned by tester user, and the ownership of the installed
    header directory (and its content) is incorrect. Change the ownership to the root
    user and group:


    ```

    chown -R root:root \

    /usr/lib/gcc/(gcc-dumpmachine)/12.2.0/include(,,-fixed)

    ```


    Create a symbolic link for the FHS for "historical" reasons.


    ```

    ln -svr /usr/bin/gpp /usr/lib

    ```


    Add a compatibility link to enable building programs with Link Time Optimization
    (LTO):


    ```

    ln -sfv ../.libexec/gcc/(gcc-dumpmachine)/12.2.0/liblibto-plugin.so \

    /usr/lib/bfd-plugins/

    ```


