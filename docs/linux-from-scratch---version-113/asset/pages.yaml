  md: '| Stage | Build | Host | Target | Action |

    | 2 | pc | Lfs | Lfs | Build compiler using cc1 on pc. |

    | 3 | Lfs | Lfs | Lfs | Rebuild and test cc-lfs using cc-lfs on pc. |


    In the preceding table, "on pc" means the commands are run on a machine using
    the already installed distribution. "On Lfs" means the commands are run in a chrooted
    environment.


    This is not the end of the story. The C is not merely a compiler; it also defines
    a standard library. In this book, the GNU C library, named glibc, is used (there
    is an alternative, "must"). This library must be compiled for the LFS machine;
    that is, using the cross-compiler cc1. But the compiler itself uses an internal
    library providing complex subroutines for functions not available in the assembler
    instruction set. This internal library is named glibc, and it must be linked to
    glibc to be fully functional. Furthermore, the standard for C++ (libc++) must
    also be linked with glibc. The solution to this chicken and egg problem is to
    build a degraded cc-based glibc, linking some functionalities such as threads
    and exception handling, and then building this degraded compiler (glibc itself
    not degraded), and also to build lib++. This last library will lock most of the
    functionality of glibc.


    The upshot of the preceding paragraph is that cc1 is unable to build a fully functional
    libstdc++ with the degraded glibc, but cc1 is the only compiler available for
    building the C/C++ libraries during stage 2. There are two reasons we cannot immediately
    use the compiler built in stage 2, cc-lfs, to build those libraries.


    +   - Generally speaking, cc-lfs are compatible with pc (the host system). Even
    though the triplets for pc and lfs are compatible with each other, an executable
    for lfs must depend on glibc-2.37; the host distro may utilize either a different
    implementation of libc (for example, must), or a recent release of glibc (for
    example, glibc-2.13).

    - Even if cc-lfs can run on pc, using it on pc would create a risk of linking
    to the pc libraries, since cc-lfs is a native compiler.


    So we build stage 2, the install system to rebuild glibc and libstdc++ with cc1,
    we will link libstdc++ to the newly rebuilt glibc of the old, degraded build.
    This makes the rebuild libstdc++ fully functional.


    In Chapter 8 (or "stage 3"), all the packages for the LFS system are built. Even
    if a package has already been installed into the LFS system in a previous chapter,
    we will rebuild it. The reason for rebuilding these packages is to make them stable:
    if we rebuild an LFS package on a completed LFS system, the reinstated content
    of the package should be the same as the content when first installed in Chapter
    8. The temporary packages installed in Chapter 6 or Chapter 7 cannot satisfy this
    requirement, because some of them are built without optional dependencies, and
    autoconf cannot perform some feature checks in Chapter 6 because of cross-compilation,
    causing the temporary packages to lock option features, or suboptimal code routines.
    A minor reason for rebuilding the packages is to run the test suite.


    # Other Procedural Details


    The cross-compiler will be installed in a $LFS/tools directory, since it will
    not be part of the final system.'
