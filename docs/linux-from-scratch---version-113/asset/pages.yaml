  md: '# # Chapter 11. The End


    # ## 11.1. The End


    Well done! The new L system is installed! We wish you much success with your shiny
    new custom-built Linux system.


    It may be a good idea to create an `/etc/lfs-release` file. By having this file,
    it is very easy for you (and for us if you need to ask for some point) to find
    which LFS version is installed on the system. Create this file by running:


    ```

    echo 11.3 > /etc/lfs-release

    ```


    Two files describing the installed system may be built by packages that can be
    installed on the system later, either in binary form or by building them.


    The first one shows the status of your new system with respect to the Linux Standards
    Base (LSB). To create this


    ```

    cat > /etc/ls-release << "EOF"

    DISTRIB_ID="Linux From Scratch"

    DISTRIB_RELEASE="11.3"

    DISTRIB_CODENAME="your name"

    DISTRIB_DESCRIPTION="Linux From Scratch"

    EOF

    ```


    The second contains roughly the same information, which is used by system and
    many general desktop environments. To create this, run:


    ```

    cat > /etc/os-release << "EOF"

    NAME="Linux From Scratch"

    VERSION="11.3"

    ID=lfs

    PRETTY_NAME="Linux From Scratch 11.3"

    VERSION_CODENAME="your name"

    EOF

    ```


    Be sure to customize the fields ''DISTRIB_CODENAME'' and ''VERSION_CODENAME''
    to make your system uniquely yours.


    # ## 11.2. Get Counted


    Now that you have finished the book, do you want to be counted as an LFS user?
    Head over to https://linuxfromscratch.org/cgi-bin/lfscounter.php and register
    as an LFS user by entering your name and the first LFS version you have used.


    Let''s reboot into LFS now.


    # ## 11.3. Rebooting the System


    Now that all of the software has been installed, it is time to reboot your computer.
    However, there are still a few things


    +   * Install any firmware needed if the kernel driver for your hardware requires
    some firmware files to function properly.'
  merge: -1
