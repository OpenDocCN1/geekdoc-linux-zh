  md: '# 8.15. Tcl-8.6.13


    The Tcl package contains the Tool Command Language, a robust general-purpose scripting
    language. The Expect package is written in Tcl (pronounced "tickle").


    **Approximate build time:** 2.7 SBU

    Required disk space:** 89 MB


    # 8.15.1. Installation of Tcl


    This package and the two (Expect and DejaGNU) are installed to support running
    the test suites for Binutils, GCC and other packages. Installing three packages
    for testing purposes may seem excessive, but it is very reassuring, not essential,
    to know that the most important tools are working properly.


    Prepare Tcl for compilation:


    ```

    SRCDIR=$pwd

    cd unix

    ./configure --prefix=/usr \

    --mandir=/usr/share/man

    ```


    Build the package:


    ```

    make

    ```


    ```

    sed -e "$SRCDIR/unix/pkgs/tdcl.1.5/usr/lib/tdbcl1.5|usr/include=|| \

    -e "$SRCDIR/pkgs/tdcl.1.5/generic|usr/include=|| \

    -e "$SRCDIR/pkgs/tdcl.1.5/library/usr/lib/tcl8.6|| \

    -e "$SRCDIR/pkgs/tdcl.1.5/usr/include=|| \

    -i t pkgs/tdcl.1.5/tdbclConfig.sh

    ```


    ```

    sed -e "$SRCDIR/unix/pkgs/itcl4.2.3/usr/lib/itcl4.2.3|| \\ \

    -e "$SRCDIR/pkgs/itcl4.2.3/generic|usr/include=|| \

    -e "$SRCDIR/pkgs/itcl4.2.3/usr/include=|| \

    -i t pkgs/itcl4.2.3/itcl4Config.sh

    ```


    ```

    unset SRCDIR

    ```


    The "sed" instructions after the "make" command remove the build directory from
    the configuration files and replace with the install directory. This is not mandatory
    for the remainder of LFS, but may be needed if a package built later uses Tcl.


    To test the results:


    ```

    make test

    ```


    Install the package:


    ```

    make install

    ```


    Make the installed library writable so debugging symbols can be removed later:


    ```

    chmod -v u+w /usr/lib/libcl8.so

    ```


    Install Tcl''s headers. The next package, Expect, requires them.


    ```

    make install-private-headers

    ```'
