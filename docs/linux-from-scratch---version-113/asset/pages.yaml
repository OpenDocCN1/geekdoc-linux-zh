- img_proc: true
  md: "# 11.5.2.1. Work from the LFS host in chroot\n\nThis method provides a complete\
    \ graphical environment where a full featured browser and copy/paste capabilities\
    \ are available. This method allows using applications like the host's version\
    \ of wget to download package sources to a location available when working in\
    \ the chroot environment.\n\nIn order to properly build in chroot, you will also\
    \ need to remember to mount the virtual file systems if they are not already mounted.\
    \ One way to do this is to create a script on the HOST system:\n\n```\ncat > /mount-virt.sh\
    \ << \"EOF\"\n!/bin/bash\n\nfunction mountbind\n{\n  if mountpoint $LFS/$1 >/dev/null;\
    \ then\n    $SUDO mount --bind $1 $LFS/$1\n    echo $LFS/$1 mounted\n  else\n\
    \    echo $LFS/$1 already mounted\n  fi\n}\n\nfunction mounttype\n{\n  if ! mountpoint\
    \ $LFS/$1 >/dev/null; then\n    $SUDO mount -t $2 $3 $4 $5 $LFS/$1\n    echo $LFS/$1\
    \ mounted\n  else\n    echo $LFS/$1 already mounted\n  fi\n}\n\nif [ $EUID -ne\
    \ 0 ]; then\n  SUDO=sudo\nelse\n  SUDO=\"\"\nfi\n\nif [ $x$LFS == x ]; then\n\
    \  echo \"LFS is not set\"\n  exit 1\nfi\n\nmountbind dev\nmountype dev/pts devpts\
    \ devpts -o gid=5,mode=620\nmountype proc proc proc\nmountype sys sysfs sysfs\n\
    mountype run run\nif [ -d $LFS/dev/shm ]; then\n  mkdir -pv $LFS/dev/shm (readlink\
    \ $LFS/dev/shm)\nnmountype dev/shm tmpfs tmpfs -o nosuid,nodev\nfi\n\n#mountbind\
    \ usr/src\n#mountbind boot\n#mountbind home\nEOF\n```\n\nNote that the last three\
    \ commands in the script are commented out. These are useful if these directories\
    \ are mounted as separate partitions on the host system and when booting the completed\
    \ LFS/BLFS system."
  merge: -1
