  md: "# 8.58. Findutils-4.9.0\n\nThe Findutils package contains programs to find\
    \ files. Programs are provided to search through all the files in a directory\
    \ tree and to create, maintain, and search a database (often faster than the recursive\
    \ find, but unreliable unless the database has been updated). Findutils also supplies\
    \ the xargs program, which can be used to run a specified command on each file\
    \ selected by a search.\n\nApproximate build time: 0.4 SBU\nRequired disk space:\
    \ 51 MB\n\n# 8.58.1. Installation of Findutils\n\nPrepare Findutils for compilation:\n\
    \n```\ncase ($uname -m) in\n  i686) TIME_32_BIT_OK=yes /configure --prefix=/usr\
    \ --localstatedir=/var/lib/locate;\n  x86_64) /configure --prefix=/usr --localstatedir=/var/lib/locate;\n\
    nesac\n```\n\nThe meaning of the configure options:\n\nTIME_32_BIT_OK=yes\n\n\
    This setting is needed for building on a 32 bit system.\n\n--localstatedir\n\n\
    This option moves the locate database to /var/lib/locate, which is the FHS-compliant\
    \ location.\n\nCompile the package:\n\n```\nmake\n```\n\nTo test the results,\
    \ issue:\n\n```\nchown -R tester\nsu tester -c \"PATH=$PATH make check\"\n```\n\
    \nInstall the package:\n\n```\nmake install\n```\n\n# 8.58.2. Contents of Findutils\n\
    \n+   Installed programs:\nfind, locate, updatedb, and xargs\nInstalled directory:\n\
    /var/lib/locate\n\n# Short Descriptions\n\n+   find\nSearches directory trees\
    \ for files matching the specified criteria\n\n+   locate\nSearches through a\
    \ database of file names and reports the names that contain a given string or\
    \ match\na given pattern\n\n+   updatedb\nUpdates the locate database; it scans\
    \ the entire file system (including other file systems that are currently\nmounted,\
    \ unless told not to) and puts every file name it into the database\n\n+   xargs\n\
    Can be used to apply a given command to a list of files"
