  md: "# Important\n\nIf any package of which the version is different from the version\
    \ specified by the book (either following a security advisory or satisfying personal\
    \ preference), it may be necessary to update the library file name in save_usrlib\
    \ or online_usrlib. Failing to do so may render the system completely unusable.\n\
    \n```\nsave_usrlib=$(cd /usr/lib; ls ld-linux*[*])nlibc.so.6\nlibthread-db.so\n\
    libquadmath.so.0.0.0\nlibstdc++.so.6.0.30\nlibmrt.so.1.0.0\nlibdatomic.so.1.2.0\n\
    ```\n\n```\ncd /usr/lib\nfor LIB in $save_usrlib; do\nobjcopy --only-keep-debug\
    \ $LIB $LIB.dbg\ncp $LIB /tmp/$LIB\nstrip --strip-unneeded /tmp/$LIB\nobjcopy\
    \ --add-gnu-debuglinks $LIB.DBG /tmp/$LIB\ninstall -vm755 /tmp/$LIB /usr/lib\n\
    rm /tmp/$LIB\ndone\n```\n\n```\nonline_usrbin=libbfd-2.40.so\nlibsframe.so.0.0.0\n\
    libhistory.so.8.2\nlibncurses.so.6.4\nlibm.so.6\nlibreadline.so.8.2\nlibz.so.1.2.13\n\
    $(cd /usr/lib; find libnss*.so -type f\")\n```\n\n```\nfor BIN in $online_usrbin;\
    \ do\ncp /usr/bin/$BIN /tmp/$BIN\nstrip --strip-unneeded /tmp/$BIN\ninstall -vm755\
    \ /tmp/$BIN /usr/bin\nrm /tmp/$BIN\ndone\n```\n\n```\nfor LIB in $online_usrlib;\
    \ do\ncp /usr/lib/$LIB /tmp/$LIB\nstrip --strip-unneeded /tmp/$LIB\ninstall -vm755\
    \ /tmp/$LIB /usr/lib\nrm /tmp/$LIB\ndone\n```\n\n```\nfor i in $(find /usr/lib\
    \ -type f -name \"*.so* ! -name \"*.name\") \\\n$(find /usr/lib -type f -name\
    \ \"*.a\") \\\n$(find /usr/bin/bin,libexecec) -type f); do\n  case $online_usrbin\
    \ $online_usrlib $save_usrlib in\n    *$(basename $i)*)\n    *) strip --strip-unneeded\
    \ $i\n    ;;\nesac\n```\n\ndone\n\nunset BIN LIB save_usrlib online_usrbin online_usrlib"
