    Second, on a modern Linux system, the libtool .la files are only useful for libtdl.
    No libraries in LFS are loaded by libtdl, and it''s known that some .la files
    can cause BLFS package failures. Remove those files now:


    ```

    find /usr/(libexec) -name *.la -delete

    ```


    The current system is now over 3 GB, however the /tools directory is no longer
    needed. It uses about 1 GB of disk space. Delete it now:


    ```

    rm -rf /tools

    ```


    # ### 7.13.2. Backup


    At this point the essential programs and libraries have been created and your
    current LFS system is in a good state. Your system can now be backed up for later
    use. In case of fatal failures in the subsequent chapters, it turns out that removing
    everything and starting over (more carefully) is the best way to recover. Unfortunately,
    all the temporary files will be removed, too. To avoid spending extra time to
    redo something has been done successfully, creating a backup of the current LFS
    system may prove useful.


    The following steps are performed outside the chroot environment. That means you
    need to leave the chroot environment before continuing. The reason for that is
    to get access to system locations outside the chroot environment to store/read
    the backup archive, which ought not be placed within the $LFS hierarchy.


    If you need to make a backup, leave the chroot environment:


    ```

    exit

    ```


    > **Important**nAll of the following instructions are executed by root on your
    system. Take extra care about the commands you are going to run make here can
    modify your host system. Be aware that the environment variable LFS is set for
    user lfs by default but may not be set for root.

    Whenever commands to be executed by root, make sure you have LFS.

    This has been discussed in Section 2.6, "Setting The $LFS Variable".


    Before making a backup, unmount the virtual file systems:


    ```

    mountpoint -q $LFS/dev/shm && umount $LFS/dev/shm

    umount $LFS/dev/pts

    umount $LFS/(sys,proc,run,dev)

    ```'
