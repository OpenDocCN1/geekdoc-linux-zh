  md: "# # 8.49. Libffi-3.4.4\n\nThe Libffi library provides a portable, high level\
    \ programming interface to various calling conventions. This allows a program\
    \ to call any function specified by a call description at run time.\n\nFFI stands\
    \ for Foreign Function Interface. An FFI allows a program written in one language\
    \ to call a program written in another language. Specifically, Libffi can provide\
    \ a bridge between an interpreter like Perl, or Python, and shared library subroutines\
    \ in C, or C++.\n\nApproximate build time: 1.8 SBU\nRequired disk space: 11 MB\n\
    \n# ## 8.49.1. Installation of Libffi\n\n> > Note: With GMP, Libffi builds with\
    \ optimizations specific to the processor in use. If building for another system,\
    \ change the value of the --with-gcc-arch=parameter in the following command to\
    \ an architecture not implemented by the CPU on that system. If this is not done,\
    \ all applications that link to libffi will trigger Illegal Operation Errors.\n\
    \nPrepare Libffi for compilation:\n\n```\nbash\n./configure --prefix=/usr \\\n\
    \    --disable-static \\\n    --with-gcc-arch=native\n\n```\n\nThe meaning of\
    \ the configure option:\n\n```\nbash\n--with-gcc-arch=native\n\n```\n\nEnsure\
    \ GCC optimizes for the current system. If this is not specified, the system is\
    \ guessed and the code generated may not be correct. If the generated code will\
    \ be copied from the native system to a less capable system, use the less capable\
    \ system as a generator. For details about alternative system types, see the x86\
    \ options in the GCC manual.\n\nCompile the package:\n\n```\nbash\nmake\n\n```\n\
    \nTo test the results, issue:\n\n```\nbash\nmake check\n\n```\n\nInstall the package:\n\
    \n```\nbash\nmake install\n\n```\n\n# ## 8.49.2. Contents of Libffi\n\n**Installed\
    \ library:** libffi.so\n\n# ### Short Descriptions\n\nlibffi Contains the foreign\
    \ function interface API functions"
