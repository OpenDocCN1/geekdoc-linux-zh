  md: '# 10.3. Linux-6.1.11


    The Linux package contains the Linux kernel.


    Approximate build time: 1.5 - 130.0 SBU (typically about 12 SBU)

    Required disk space: 1200 - 8800 MB (typically about 1700 MB)


    # 10.3.1. Installation of the kernel


    Building the kernel involves a few steps—configuration, compilation, and installation.
    Read the README in the kernel source tree for alternative methods to what this
    book config the kernel.


    Prepare for compilation by running the following command:


    ```

    make mrproper

    ```


    This ensures that the kernel tree is absolutely clean. The kernel team recommends
    that this command be used prior to each compilation. Do not rely on the source
    tree being clean after un-tarring.


    There are several ways to configure the kernel options. Usually, this is done
    through a menu-driven interface, for example:


    ```

    make menuconfig

    ```


    The meaning of optional make environment variables:


    ```

    LANG=<host_LANG_value> LC_ALL=

    ```


    This establishes the locale setting to the one used on the host. This may be needed
    for a proper menuconfig nurcurses interface drawing on a UTF-8 linux text console.


    If used, be sure to replace <host_LANG_value> by the value of the $LANG variable
    from your host. You can alternatively use instead the host''s value of $LC_ALL
    or $LC_CTYPE.


    # make menuconfig


    This launches a menu-driven interface. For other (graphical) interfaces, type
    make help.


