  md: "# # 10.4. Using GRUB to Set Up the Boot Process\n\n> > Note\n If your system\
    \ has UEFI support and you wish to boot LFS with UEFI, you should skip this page,\
    \ and configure GRUB with UEFI support using the instructions provided in the\
    \ BLFS page.\n\n# ## 10.4.1. Introduction\n\n> > Warning\n Configuring GRUB incorrectly\
    \ can render your system inoperable without an alternate boot device such as the\
    \ CD-ROM or bootable USB drive. This section is not required to boot your LFS\
    \ system. You may just want to modify your current boot, e.g. GRUB-Legacy, GRUB2,\
    \ or LILO.\n\nEnsure that an emergency boot disk is ready to \"rescue\" if the\
    \ computer becomes unusable (unbootable). If you do not have a boot device, you\
    \ can create one. In order for the procedure below you need to jump ahead to BLFS\
    \ and install korriso from the liboosurn package.\n\n```\ncd /tmp\ngrub-mkisiso\
    \ --output=grub-img.iso xorriso -as cdrecord -v dev=/dev/cdrw blank=as_needed\
    \ grub-img.iso\n```\n\n# ## 10.4.2. GRUB Naming Conventions\n\nGRUB uses its own\
    \ naming structure for drives and partitions in the form of (hdn,m), where n is\
    \ the hard drive number and m is the partition number. The hard drives start from\
    \ zero, but partitions start from one for normal partitions (from five extended).\
    \ For example, partition sda is (hd0,1) to GRUB and sd3 is (hd1,3). In contrast\
    \ to Linux, GRUB does not consider CD-ROM drives to be hard drives. For example,\
    \ if using a CD on hdb and a second drive on hdc, that second hard drive would\
    \ still be (hd1).\n\n# ## 10.4.3. Setting Up the Configuration\n\nGRUB works writing\
    \ to the first partition of the hard disk. This area is not part of any system.\
    \ The programs access GRUB modules in the boot partition. The default location\
    \ is /boot/grub.\n\nThe location of the boot partition is a choice of the user\
    \ that affects the configuration. One recommendation is to have a separate small\
    \ (suggested size is 20 MB) partition for boot information. That way each build,\
    \ LFS or some commercial distribution, can access the same boot files and be made\
    \ from any booted system. If you choose to do this, you will need to mount the\
    \ partition and move all files in the current /boot directory (e.g. Linux kernel\
    \ you placed in the previous section) to the new partition. If you do, be sure\
    \ to update /etc/fstab.\n\nLeaving /boot on the current LFS partition will also\
    \ work, but configuration for multiple systems is more difficult.\n\nUsing the\
    \ above information, determine the appropriate designator for the root partition\
    \ (or boot partition, or a separate partition is used). For the example, it is\
    \ assumed that the root (or separate) boot partition is sda2.\n\nInstall the GRUB\
    \ files into /boot/grub and set up the boot track:"
