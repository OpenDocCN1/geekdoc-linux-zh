  md: '# Linux From Scratch - Version 11.3


    Make sure you have at least 1 GB free space (the source tarballs will be included
    in the backup archive) on the file system containing the directory where you create
    the backup archive.


    Note that the instructions below specify the home directory of the host system''s
    `root` user, which is typically found on the root file system. Replace `$HOME`
    with a directory of your choice if you do not want to have the backup stored in
    `root`''s home directory.


    Create the backup archive by running the following command:


    > Note

    Because the backup archive is compressed, it takes a relatively long time (over
    10 minutes) even on a reasonably fast system.


    ```

    cd $LFS

    tar -cJpf $HOME/lfs-temp-tools-11.3.tar.xz

    ```


    > Note

    If continuing to chapter 8, don''t forget to reenter the chroot environment as
    explained in the "Important" box.


    # 71.13. Restore


    In some cases mistakes have been made and you need to start over, you can use
    this backup to restore the system and save some recovery time. Since the sources
    are located under `$LFS`, they are included in the backup archive as well, so
    they do not need to be downloaded again. After checking that $LFS is set properly,
    you can restore the backup by executing the following commands:


    > Warning

    The following commands are extremely dangerous. If you run `rm -rf /*` as the
    root user and you do not change to the $LFS directory or the LFS environment variable
    is not set for the `root` user, it will destroy your entire system. YOU ARE WARNED.


    ```

    cd $LFS

    rm -rf /*

    tar -xpf $HOME/lfs-temp-tools-11.3.tar.xz

    ```


    Again, double check that the environment has been set properly and continue building
    the rest of the system.


    > Important

    If you left the environment to create a backup or restart building using a restore,
    remember to check that the virtual file systems are all mounted (`findmnt | grep
    $LFS`). If they are not mounted, remove them now as described in Section 7.3,
    "Preparing Virtual Kernel File Systems" and re-enter the chroot environment (see
    Section 7.4, "Entering the Chroot Environment") before continuing.'
