- pgno: 324
  md: '2. Which two commands tell you who is logged into the computer? What kinds
    of information do they display.


    The `who` and the `finger` commands display the users who are logged into the
    system, at which terminals they are working, and the amount of time they have
    been logged in. The `finger` command can also be used to display information about
    an individual user. The `finger` command not only identifies the user but also
    displays additional information such as an office and phone number. The `finger`
    command can also display information supplied by the user (through the .plan file).


    3. Which commands can you use to send messages to other users on the system?


    The `write` command sends a short message to another user. The recipient of the
    message will also need to use the `write` command in order to respond. The `wall`
    command will send a single message to every user. The `talk` command is used when
    a real-time conversation is needed. The `talk` command displays information on
    the recipient''s terminal while the sender is typing at the keyboard.


    4. If you don''t want to receive messages from other users, how do you notify
    them?


    Use the `mesg` command. By typing `mesg n`, whenever another user tries to send
    you a message (using either the `write` or `talk` command), he or she is notified
    that you are not currently accepting messages. When you are ready to receive messages,
    type `mesg y`.


    # Exercises


    1. If your Linux system is attached to a network, use the `who` and `finger` commands
    to see who is logged into other computers on the network. For example, to see
    who is logged into the computer named "darkstar," type `finger @darkstar`. If
    your Linux system is attached to the Internet, you can also use these commands
    to find people. To see who is logged in at the domain macmillanusa.com, try `finger
    @macmillanusa.com`. If you want to know about the user named "laura" at macmillanusa.com,
    try `finger.laura@macmillanusa.com`.


    ![](img/782ecfdc0b083a767896cc983e10427f_324_0.png)


    > The finger command is blocked in many places so don''t be too surprised if it
    doesn''t always work.


    2. Set up a bulletin board for your family members or employees. Modify the message
    of the day file to inform everyone of important events (such as birthdays and
    anniversaries) or special happenings during the day (such as meetings, dinner
    invitations, and weekend camping trips).'
  merge: -1
  img_proc: true
