- pgno: 432
  md: '# What’s on the Disc


    The companion CD-ROM contains Linux-Mandrake 7.1 GPL Edition.


    # Installing Linux-Mandrake from the CD-ROM


    +   1. Insert the disc in the CD drive.

    +   2. Restart your computer.

    +   3. You may need to change your BIOS settings to boot from the CD-ROM. Typically,
    you enter your BIOS setup program with the F2 or DEL keys during the boot sequence.

    +   4. Make your changes (if any) and exit the BIOS setup utility.

    +   5. If your CD drive is capable of booting from CD-ROMs, you will boot into
    the Linux-Mandrake setup program.

    +   6. Follow the onscreen prompts to complete the installation.


    # Creating the Linux-Mandrake Boot Floppy from Within Windows


    +   1. Format one 1.44MB floppy.

    +   2. Double-click on My computer, then double-click on the icon representing
    your CD-ROM drive.

    +   3. Double-click on the DOSUTILS folder.

    +   4. Now, double-click on rawritewin.

    +   5. Enter CDROM.IMG in the Image File prompt and make sure your boot floppy
    drive is chosen, typically A:

    +   6. You may now click on the Write button.

    +   7. Leave the boot floppy in your floppy drive and restart your computer.

    +   8. You may need to change your BIOS settings to boot from the floppy drive.
    Typically, you enter your BIOS setup program with the F2 or DEL keys during the
    boot sequence.

    +   9. Make your changes (if any) and exit the BIOS setup utility.

    +   10. If your computer is set up properly, you will boot into the Linux-Mandrake
    setup program.

    +   11. Follow the onscreen prompts to complete the installation.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# Creating the Linux-Mandrake Boot Floppy from Within DOS or a DOS Prompt


    +   1. Format one 1.44MB floppy.

    +   2. Type

    +      D:

    +      and press the ENTER key. If your CD-ROM drive is not D:, substitute the
    drive letter in our example with the drive letter that corresponds to your system.

    +   3. Type

    +      cd \dosutils

    +      and press the ENTER key.

    +   4. Type

    +      rawrite

    +      and press the ENTER key.

    +   5. When prompted to do so, type

    +      cdrom.img

    +      and press the ENTER key.

    +   6. When prompted to do so, type in the drive letter of the disk you are going
    to prepare and press <ENTER>. Since you are going to be booting from this disk,
    it''s typically A:

    +   7. Leave the boot floppy in your floppy drive and restart your computer.

    +   8. You may need to change your BIOS settings to boot from the floppy drive.
    Typically, you enter your BIOS setup program with the F2 or DEL keys during the
    boot sequence.

    +   9. Make your changes (if any) and exit the BIOS setup utility.

    +   10. If your computer is set up properly, you will boot into the Linux-Mandrake
    setup program.

    +   11. Follow the onscreen prompts to complete the installation.'
  merge: -1
  img_proc: true
