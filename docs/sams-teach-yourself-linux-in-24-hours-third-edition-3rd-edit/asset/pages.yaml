- pgno: 106
  md: '# TABLE 5.1 continued


    | To Do This | Press These Keys |

    |---|---|

    | Delete word to the left | Esc+Del |

    | Delete word to the right | Esc+d |

    | Delete from cursor to end of line | Ctrl+K |

    | Delete the entire line | Ctrl+U |


    One way to reduce the number of keystrokes that you type at the shell prompt is
    by using command line completion. Command line completion means that you type
    part of the command or program name and then you ask bash to finish your typing.
    If you type part of a command or application name on the command line and press
    Tab, bash attempts to finish the command for you. The bash shell searches through
    the system for all the commands and application names that match what you have
    typed in so far and completes the command as far as it is able. If the shell received
    insufficient data to make a choice, you will be presented with a list of possible
    completions. This makes it a simple matter to finish the command entry. To see
    this feature in action on the command line, type bas and press Tab.


    After you press Tab to complete the command, command line completion will also
    attempt to finish filenames for you. If you begin typing the filename and then
    press Tab again the shell looks for possible matches in the files listed for the
    current working directory.


    Another way to reduce keystrokes is by using wildcards. Wildcards take the place
    of other characters in the command line. The bash shell uses three different wildcards:


    +   - The asterisk (*) character matches any number of characters.

    +   - The question mark (?) matches a single character.

    +   - Brackets ({ and }) are used to match specific characters contained inside
    the brackets.


    The bash shell and some of the other shells have a command history option that
    enables you to resubmit commands without having to type them in again. The way
    to access the command history is to use the up and down arrow keys to move up
    and down the list. Each of the previously typed-in commands will appear on the
    command line. You can press the Enter key to use any of the commands again. This
    feature can be a lifesaver if you are doing something that requires tiring repetitious
    typing of the same complex commands. The default number for the number of commands
    to be kept in the history is user configurable.


