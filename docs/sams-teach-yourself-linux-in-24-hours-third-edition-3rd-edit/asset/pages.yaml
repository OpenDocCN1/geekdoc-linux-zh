- pgno: 101
  md: 'Another of the UNIX shells, the Korn shell (ksh) originally created by Dave
    Korn, is also available in an open source form. The public domain free version
    of the shell, created by Eric Gisin, is called the public domain Korn shell (pdksh).
    However, in March of 2000, AT&T released a freely downloadable version of the
    original Korn shell, updated by Dave Korn in 1993, called ksh93. It is not exactly
    "open source," but it is available for download for private and noncommercial
    use.


    The C shell (csh) was developed at University of California at Berkeley to be
    more compatible with the C programming language. The open source version of the
    C shell is tcsh. There is a pointer (symbolic link) in the /bin directory for
    the csh shell that points to the tcsh shell.


    The bash shell works like the Bourne shell (sh). There is a symbolic link, in
    the /bin directory of sh, that points to the bash shell. The bash shell is perhaps
    the most widely used shell in Linux, and it is used as the example in this hour.


    # Task: Running the bash Shell


    You''re probably anxiously waiting at the shell prompt and wondering what to do
    next. The first thing you need to do is check to see which shell you are using.
    During the rest of the hour, you will be working with the bash shell. So, if another
    shell is running on your system, you need to start bash to follow along. Learn
    about the shell:


    +   1. Display the shell you are using. This information is found in the SHELL
    environment variable. Type `echo $SHELL` and press Enter. If you are using bash,
    the system will display the following:

    +   ```

    +   [rusty@localhost /rusty]$ echo $SHELL

