    # Getting Ready for the Installation


    Since the beginning of Linux, each distribution and each version of each distribution
    has strived to simplify the installation process. In the early years, the long
    and tedious installation process kept many people from getting a look at this
    operating system. Even though the installation process has become more automated
    and intuitive, you still need to determine your computer''s configuration, decide
    which is the best way to load Linux on the system, and understand the installation
    process for the Linux distribution you selected.


    Before you start the Linux installation, make sure that you are prepared. You''ll
    need to have the following items ready:


    +   - The first thing you''ll need is the installation CD-ROM for the Linux distribution
    you chose. Look at the contents of the CD-ROM for any README files. These files
    will give you hints as to where you''ll find more information on the CD-ROM.

    +   - Collect all the necessary hardware information and read the Linux Hardware
    Compatibility HOWTO.

    +   - If the computer does not boot from the CD-ROM drive, you will need to create
    an installation boot disk. It''s also a good idea to create this boot disk even
    if the CD-ROM boots. You might need this disk in an emergency.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   - Before you do anything to your computer, back up all your data. There''s
    nothing more upsetting than deleting the Web site you just created and haven''t
    yet uploaded to the Web server.

    +   - If you intend to partition the hard drive, run a disk defragmenter program.
    The disk needs to be cleaned up before a partition utility can split the drive
    into two or more pieces.


    # Task: Creating an Installation Boot Disk


    One of the advantages of purchasing Linux in a boxed set is that the boxed set
    usually includes a boot disk and any other floppy disks you might need. If you
    have only the installation CD for your Linux distribution and your computer boots
    from the floppy drive, you will need to create an installation boot disk.


    **New Term**

    Computers boot from different places, depending on the BIOS settings. Some computers
    attempt to start the system by locating startup instructions from the floppy drive
    before looking to the hard drive. Other computers look to the CD-ROM first. If
    your computer boots from the CD-ROM, you''re in great shape—just put the CD-ROM
    into the CD drive when you are ready to start installing Linux. If your computer
    boots from the floppy drive, you will need a boot disk that starts the installation
    program on the CD-ROM.


    ![](img/782ecfdc0b083a767896cc983e10427f_41_0.png)


    > Some Linux distributions require that you create other floppy disks. TurboLinux
    needs an Extra Hardware disk, which it uses during the installation to help configure
    the computer hardware. Slackware and Red Hat also use a rescue disk, which comes
    in handy when the system isn''t working properly. Debian can be converted to use
    floppies to install the system.


    To create an installation boot disk, you will need the distribution CD-ROM, a
    blank 3.5-inch disk, the rawrite program, and the user documentation for rawrite.
    To use the rawrite program in MS-DOS, follow these steps:


    +   1. Display the MS-DOS prompt in Microsoft Windows. Select Start, Programs,
    MS-DOS Prompt.

    +   2. Change to the CD-ROM drive. Type D: and press Enter (where D: is the drive
    letter for your CD-ROM drive).

    +   3. Change to the directory where the rawrite program is located on the CD-ROM.
    Linux-Mandrake, Red Hat, and TurboLinux store rawrite in the \dosutils directory
    (type cd dosutils and press Enter). In Slackware, rawrite is in the \install directory.
    An example is shown in Figure 1.5.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# FIGURE 1.5

    Use rawrite to create an installation boot disk.


    ![](img/782ecfdc0b083a767896cc983e10427f_42_0.png)


    Change to CD-ROM drive


    Execute program


    Locate rawrite


    > If you cannot find the rawrite program, open Windows Explorer and use the Find
    command (Tools, Find, Files or Folder) to search the CD-ROM for the file.


    +   4. Type rawrite.exe and press Enter. The rawrite program interface appears
    and needs input.

    +   5. Specify the disk image source filename. For Linux-Mandrake, and TurboLinux
    type D:\images\cdrom.img and press Enter. For Red Hat, type D:\images\boot.img
    and press Enter. In Slackware, type D:\BOOTDSKS.144\bare.i and press Enter.

    +   6. Specify the target disk drive (this is the floppy disk drive). Type A:
    and press Enter. You are then asked to place the disk into the drive. After this
    is done, the files will be copied to the disk.

    +   7. Remove the disk when the copy process is finished. Be sure to label the
    disk appropriately. For example, if you chose to install the Linux-Mandrake distribution
    found on the CD in the back of this book, label the disk "Linux-Mandrake 7.1.
    Installation Boot Disk."


    As you''ve seen, each distribution handles the creation of installation boot disks
    differently. If you had problems creating a boot disk using these instructions,
    you should browse the distribution CD-ROM to see whether there are any special
    instructions for using rawrite and creating the boot disk.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/782ecfdc0b083a767896cc983e10427f_43_0.png)


    Some distributions also suggest that you create a rescue disk before you begin
    the installation. Remember to read the installation guide before you actually
    begin installing the Linux operating system.


    # Summary


    You now have everything you need so that you can sit down at the computer and
    begin the slow, step-by-step process of installing the Linux operating system.
    During the past hour, you made a number of important decisions. You selected a
    distribution and a Linux-compatible computer on which to install the Linux distribution.
    You know where the operating system will live and which of the GNU programs will
    be installed along with the operating system. And you read the installation manual
    for your selected Linux distribution. Good luck!


    # Q&A


    Q What are some of the different ways people are using their Linux systems to
    help them manage their affairs and conduct their business?


    A Right now, the most popular use of the Linux operating system is to run corporate
    networks and Internet servers. However, individuals are beginning to find new
    ways to put Linux to work for them. Many graphic artists are enjoying the availability
    of reasonably priced software tools. Find out what the artist community is doing
    with Linux at www.linuxartist.org. Musicians will find some interesting things
    going on with MIDI music at www.bright.net/~dlphip/linuxsound. Parents beware...your
    child might want to download the drumming software at this site. Scientists and
    engineers will find some tools of the trade at sai.kachinatech.com/index.shtml.
    If you often gaze at the stars, try some of the astronomy tools at linux.about.com/compute/linux/library/metalab/blmeta_science_astronomy.htm.


    For those who need help keeping organized, there are many different personal information
    programs (such as calendars, diaries, and address books) from which to choose.
    Manage your finances with the Checkbook Balancer (CBB) available at cbb.surgeforge.net
    or GNUCash at www.gnucash.org.


    Q What computer equipment definitely does not work with the Linux operating system?


    A To put it briefly, Winmodems and Winprinters. These devices depend on operating
    system-specific drivers, which are developed for the Microsoft Windows operating
    system only.'
  merge: -1
  img_proc: true
