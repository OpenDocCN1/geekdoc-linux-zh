- pgno: 139
  md: '# Task: Displaying the ls Command Options


    It''s hard to remember all the command options associated with every command.
    Here''s a quick way to list the command options for the ls command:


    +   1. Type ls --help | less and press Enter. The list of options that can be
    used with the ls command will display in the less pager.

    +   2. Use the arrow keys to read through the options section of the ls manual
    page.

    +   3. Make a note of any file list command options that might be helpful to you.

    +   4. Press Q to exit the less pager and return to the shell prompt.


    # Expanding the Directory Tree


    As you work with applications, you''ll need a place to store your work. The best
    place for you to store these files is in your user account. Now, you could just
    save all your files in your home directory, but things would become confused after
    a while. To help organize your filing system, create directories in which to store
    related information. To keep track of correspondence, spreadsheets, and scanned
    photographs, create directories for each type of file. If you run a small business,
    you might want to create directories for each client or project.


    # Creating Directories


    When you want to create a subdirectory within the working directory, use the mkdir
    command. The easiest way to create a new directory is to make the directory in
    which you want the new directory to appear the working directory.


    For example, user rusty wants to create a subdirectory named letters in which
    to store correspondence with family and friends. If the working directory is /home/rusty,
    a subdirectory named /home/rusty/letters is created by using the following command:


    ```

    mkdir letters

    ```


    To make sure that the subdirectory exists, use the ls command. Then, to change
    from the home directory to the new directory, use the cd command. The cd command
    makes the specified directory the new working directory. In the previous example,
    user rusty would change to the letters directory by typing cd letters. The shell
    prompt changes to show the new working directory, as shown here


    ```

    [rusty@localhost letters]$

    ```


    Then, to confirm that you are indeed in the directory in which you intended, use
    the pwd command to verify the working directory.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '> To get back to your user home directory, type cd by itself on the command
    line and press Enter.


    # The Syntax for the mkdir Command


    If you remember DOS commands, you''ll find a number of similarities when it comes
    to creating, deleting, and copying directories (and files, too). It is easiest
    to create a new directory with the mkdir command if the working directory is the
    directory that will contain the new directory. The following shows the syntax
    for the mkdir command:


    ```

    mkdir [options] directoryname

    ```


    The directoryname parameter is the name of the new directory to be created. This
    directory will be the child directory of the working directory.


    There are two command options that you can use with the mkdir command that you''ll
    find helpful:


    +   - To create a parent directory with a series of subdirectories, use the parents
    (-p) command option. For example, you might want to store your correspondence
    files in a separate directory within your home directory. Within this directory,
    you plan to have a directory for each client, and within each client directory,
    there will be a separate directory for each year''s correspondence. Using this
    example, type mkdir -p corresp/client/2000 and press Enter to create all three
    directories. This is much easier than creating the corresp directory, changing
    to the corresp directory (with the cd command), creating the client directory,
    and....

    +   - You can also assign access permissions to the newly created directory with
    the mode (-m) command option. You''ll learn how to assign file permissions to
    directories in Hour 12.


    # Task: Creating a Directory Structure for a User Account


    It''s time to use some of your command-line knowledge and create a few directories
    in your user account. Storing your data files in directories makes it easier to
    locate files and keep them organized. Here are some ideas to help make creating
    directories from the command line a little easier:'
