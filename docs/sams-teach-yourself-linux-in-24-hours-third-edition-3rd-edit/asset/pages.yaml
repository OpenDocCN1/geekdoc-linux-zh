- pgno: 127
  md: '> Always find out what a program or command does and how the command options
    modify the behavior of a program before you type the name of the program''s binary
    file or execute a command on the command line.


    # Task: Searching the whatis Database


    The whatis command is a valuable tool that gives a brief description of a command
    and also shows the man page directory (refer to Table 6.5) in which you''ll find
    the manual page for the command. Here''s how to search the whatis database to
