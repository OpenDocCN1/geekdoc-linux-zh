- pgno: 216
  md: '![](img/782ecfdc0b083a767896cc983e10427f_216_0.png)


    If you want to delete a group account, delete the entry for the group in the /etc/group
    file.


    # Granting Access to Files


    After you have created accounts for each user and group that will be using the
    system, users and groups can then start storing files on the system. When a file
    (or directory, for that matter) is created by a group member, that member is the
    owner of the file. It is this user who can grant ownership and permissions to
    other group members and to other system users. This system of file ownership and
    permissions forms the basis for restricting and allowing access to files. There
    are three types of file ownership:


    +   - The owner is the user who created the file.

    +   - The group is the default group to which the owner belongs. By default, this
    is the primary group specified in the /etc/passwd file for the file owner.

    +   - Other ownership can be assigned to system users that are not members of
    the group.


    New Term File permissions determine which users on the system have access to a
    file and the type of access they are allowed. File permissions help maintain security
    for files by restricting access to files.


    The file owner can also determine the type of access (or permissions) that other
    users may have to the file. There are three different levels of file permissions
    that can be assigned to a file or directory, and these permissions can be set
    differently for the different types of owners:


    +   - Read access on a file allows the user, and groups that have permission,
    to view the contents of a file. Read access on a directory means that the user
    and groups can list the contents of the directory.

    +   - Write access on a file gives selected users and groups the ability to make
    changes to the file or to delete the file. Write access for a directory allows
    the user and groups to create files in the directory and to delete those files.

    +   - Execute access for a file means that the file can be run as a command or
    program. Execute access for a directory allows the user and groups to access the
    directory and list information about the files contained in the directory.


    As you learned in Chapter 7, “Moving Around the Filesystem,” the ls -l command
    lists the user and group ownership of a file and the permissions assigned to each.
    Figure 12.3'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'shows an example. In this example, the owner has full access to the file (read,
    write, and execute). The group, owner, and other users have read and execute permissions
    on the file.


    FIGURE 12.3

    The owner has read, write, and execute permissions on the file.


    ![](img/782ecfdc0b083a767896cc983e10427f_217_0.png)


    # Changing File Ownership


    To change the ownership of a file (that is, the user owner and the group owner),
    use the chown and chgrp commands. Let''s look at two files that user rusty has
    created and placed in the sales group directory:


    ```

    -rw-r--r-- 1 rusty rusty 747293 Jul 4 04:04 packages

    -rw-r--r-- 1 rusty rusty 155 Jul 7 01:01 tealist

    ```


    For both files, the group ownership needs to be changed to the sales group. To
    do this, rusty would cd to the sales directory and use the chgrp command as follows:


    ```

    [rusty@localhost sales]$ chgrp sales packages

    [rusty@localhost sales]$ chgrp sales tealist

    ```


    If rusty wants to transfer the tealist file into the hands of user mona, rusty
    would change the owner with the following command:


    ```

    [rusty@localhost sales]$ chown mona tealist

    ```


    The listing would then appear as follows:


    ```

    -rw-r--r-- 1 rusty sales 747293 Jul 4 04:04 packages

    -rw-r--r-- 1 mona sales 155 Jul 7 01:01 tealist

    ```'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Protecting Files


    Now that the owners of the file have been set, you can change the type of access
    that each type of owner is permitted. The process for changing file permissions
    is a bit more complex. The chmod command changes the file permissions. The syntax
    of chmod is


    ```

    chmod access_string filename

    ```


    The syntax of the access_string is


    ```

    owner+operator+file permission

    ```


    Where owner is one or more of the following file owners:


    +   - The u character sets permissions for the user owner

    +   - The g character sets permissions for the group owner

    +   - The o character sets permissions for all others

    +   - The a character sets the permissions for all three types of owners


    Where operator is one of the following:


    +   - To add a file permission for the specified owner, use the + character

    +   - To remove a file permission, use the - character

    +   - To use the exact file permission, use the = character


    Where file permission is one or more of the following:


    +   - Read access is applied with the r character

    +   - Write access is applied with the w character

    +   - Execute access is applied with the x character


    Use the following file as an example:


    ```

    -rw-r--r-- 1 rusty sales 747293 Jul 4 04:04 packages

    ```


    If user rusty wants to allow write access to the sales group, rusty would use
    the chmod command as follows:


    ```

    [rusty@localhost sales]$ chmod g+w packages

    ```


    To see the changes, use the ls -l command to display the new file permissions:


    ```

    -rw-rw-r-- 1 rusty sales 747293 Jul 4 04:04 packages

    ```


    You''ll notice the w (for write access) in the group permissions.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Task: Making a File Read-Only


    You might want to make a file read-only so that the contents cannot be changed.
    only viewed. Here''s how:


    +   1. You must be the owner of the file.

    +   2. Change to the directory in which the file is contained.

    +   3. Display the file for which you want to change permissions. For example:

    +   ```

    +   -rw xr w- 1 mona sales 155 Jul 7 01:01 tasklist

    +   ```

    +   4. Use the chmod command to change the file permission to read-only for all
    users. Type `chmod a-r filename` and press Enter. For this example, type `chmod
    a=r tasklist` and press Enter. The file permissions will change to show the following:

    +   ```

    +   -r--r--r-- 1 mona sales 155 Jul 7 01:01 tasklist

    +   ```

    +   5. Prevent the other users from reading the file. Type `chmod o-r filename`
    and press Enter. The file permissions for the example would be changed by typing
    `chmod o-r tasklist`. The listing would then show as

    +   ```

    +   -r--r----- 1 mona sales 155 Jul 7 01:01 tasklist

    +   ```

    +   Notice that the other users have no permissions set for the file and, therefore,
    are prevented from having any access to the file.


    # Summary


    The ability to limit access to files is important if several people use the computer
    and want to share files. Before users can share files, they must be assigned to
    groups and directories must be set up in which to store the group''s files. After
    groups are established, group members can begin storing files in these directories
    and specifying the type of access they want to give to other system users who
    want to use the files.


    # Q&A


    Q I don''t like the username I assigned myself when I first set up the system,
    but I have files stored in my home directory that I don''t want to lose. Is there
    any way I can just change the username?


    A Log in to the superuser account and use the usermod command. You can change
    not only your username, but you can also change the name of your home directory
    to match your new username without messing up any of the files you have stored
    there. To use this command, type

    ```

    usermod -l new_username -d /home/new_username -m username

    ```'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'The -l command option identifies the new username, the -d command option specifies
    the new directory, and the -m command option moves all the user''s files to the
    new directory. For example, if a user named marilyn (you met her earlier)


    ```

    usermod -l jane -d /home/jane -m marilyn

    ```


    Q I read the manual page for the chmod command and it talked about using numbers
    to change file permissions. Can you tell me more?


    A The chmod command gives you two different options for dealing with file permissions.
    This hour showed you how to use letters to change the read, write, and execute
    permissions for user owners, group owners, and all other users. You might want
    to use a numerical approach in which 4 stands for read access, 2 for write access,
    and 1 for execute access. So, if you want read and write access to a file, add
    4 and 2 to get 6. Then, this access needs to be determined for each type of owner.
    So, if you want read and write access for the user and group owners and read access
    for all other users, the command would be `chmod 664 filename`.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    # Quiz


    +   1. When you use the adduser command to add a new user to the system, where
    is this information stored?


    The adduser command places user information in the /etc/passwd file. The adduser
    command uses default information to assign a user identification number, a home
    directory, and a shell program. The password field in the /etc/passwd file is
    encrypted so that anyone who happens to view this file will not learn the passwords
    of the other users.


    +   2. What are the three types of users who can have access to a file?


    The person who created the file is known as the owner and is in charge of the
    file. This person can change the file permissions to transfer ownership of the
    file to other users. The group owner is the group to which the user owner belongs
    that has access to the file. You can also assign ownership to other users who
    are not the owner or a member of the group.


    ![](img/782ecfdc0b083a767896cc983e10427f_220_0.png)'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 3. What are the three types of access that can be granted to each of the
    three types of users?


    Read access on a file allows users to view the contents of a file. Read access
    on a directory allows users to list the contents of the directory. Write access
    gives users the ability to make changes to a file or to delete a file. Write access
    for a directory allows users to add files to a directory and to delete files in
    a directory. Execute access for a file means that the file can be run as a command
    or program. Execute access for a directory allows the user and groups to access
    the directory and list information about the files contained in the directory.


    # 4. How do you change the password for your user account and when should you
    change the password?


    Use the passwd command while logged in to your user account. You will be asked
    for your current password and then you will need to supply the new password. You
    should change your password on a regular basis to make it harder for others to
    figure out your password. You''ll also want to change the password if someone
    learns your password. This is especially important for the superuser (or root)
    account because that account has access to every file and directory on the system.


    # 5. Why would you want to organize users into groups and how do you create group
    accounts?


    If several users have a need to share certain files, organize those users into
    a group. You can have as many group accounts on the system as you like and users
    can belong to more than one group. The easiest way to create a group account is
    to edit the /etc/group file with your favorite text editor. You''ll need to give
    the group a name and identification number, and list the users who will be part
    of that group.


    # 6. How can you quickly find out the groups to which you belong?


    You can use either the groups command or the id command. Both will list your assigned
    groups, and the id command also lists the identification numbers for your user
    account and the group accounts to which you belong.


    # Activities


    +   1. Set up a directory structure in which the users on your system can store
    files for workgroup purposes. Then create groups depending on who needs to share
    files with whom and place the proper access rights to the individual directories.
    You''ll then need to educate your users on the proper way to store files and how
    to set permissions so that only those people with a need to know or a need to
    use have access to the files.'
  merge: -1
  img_proc: true
