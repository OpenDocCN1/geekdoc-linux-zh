- pgno: 77
  md: "# 3. How do you restrict access to the system and to the data on the system?\n\
    \nAccess to the system is controlled by user accounts and passwords. Each user\
    \ who is authorized to work on the system should be assigned a separate account\
    \ and asked to select an appropriate password. After user access has been set,\
    \ access to files needs to be set. Each user may have different permissions to\
    \ use files, depending on his needs.\n\n# Exercises\n\n+   1. To help maintain\
