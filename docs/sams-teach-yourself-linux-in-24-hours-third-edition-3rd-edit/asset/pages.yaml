    # Summary


    The Internet is the world''s largest library and it''s just crammed full of floors
    and floors and shelves and shelves of valuable information, stories from history,
    fun and games, biographies, and tales of fantasy and fiction. During this hour,
    you learned some easy ways to get on the Internet and start exploring. You learned
    how to use Netscape Communicator to browse Web pages, send email messages, and
    lurk the Usenet newsgroups. You also learned how to use Gftp to transfer files
    between your computer and an FTP site. You''ve only touched the tip of the iceberg
    of Internet tools for Linux.'
