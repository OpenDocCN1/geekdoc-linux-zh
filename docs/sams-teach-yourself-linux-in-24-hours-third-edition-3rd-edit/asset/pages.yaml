    The games you use in this task are a few of the education games that Linux has
    to offer. Look around the computer and the Internet to find more games that will
    make your brain smarter.


    # Playing Games in xemacs


    An unusual source of games can be found in the xemacs text editor. To find these
    games, you''ll need to start xemacs from a desktop environment so that you get
    the complete graphical version with menus and toolbar buttons. The games are found
    in the Apps menu (look in the Games submenu).


    The Tetris arcade game has been around for a long time and there are so many Linux
    versions that it boggles the mind. So, not to be left out, xemacs contains a version
    of Tetris (shown in Figure 23.8) that you can play when you are bored with the
    text you are editing.


    Use the arrow keys to position the falling blocks


    FIGURE 23.8

