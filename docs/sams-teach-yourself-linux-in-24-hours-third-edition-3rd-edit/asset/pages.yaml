  md: '![](img/782ecfdc0b083a767896cc983e10427f_28_0.png)


    # Hour 1


    # Gearing Up for the Installation


    This is just too cool; you''ve decided to try the Linux operating system! We''re
    glad you decided to join us as we learn how to use this new up-and-comer in the
    operating system scene. With the arrival of the Linux operating system providing
    the open source platform needed to run all the GNU Project''s application software,
    you now have new opportunities to better manage your computer and use it to explore
    new software applications.


    It''s time to begin your adventure with the Linux operating system. During the
