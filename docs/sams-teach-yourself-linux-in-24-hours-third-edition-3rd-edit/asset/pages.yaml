- pgno: 303
  md: '# FIGURE 19.3


    Type the script for the window manager that you want to use.


    ![](img/782ecfdc0b083a767896cc983e10427f_303_0.png)


    The AfterStep script


    Click on the desktop to display the menu system


    # FIGURE 19.4


    Try different window managers to find a desktop that appeals to you.


    ![](img/782ecfdc0b083a767896cc983e10427f_303_1.png)


    Of course, if you are not happy with your new choice, all you have to do is edit
    the file again and comment out (or delete) the exec commands you added, and then
    type in new exec commands to try another window manager in the same way. When
    you want to go back to the way it was in the beginning, just remove the # signs
    that you placed in front of the original exec commands and comment out all the
    others you added.'
