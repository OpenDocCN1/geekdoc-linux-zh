- pgno: 146
  md: '# Renaming Files


    There might be many reasons why you want to rename a file. Maybe you don''t like
    the original filename; it might not be descriptive enough. The mv command is used
    for renaming files.


    # The Syntax for the mv Command


    When you rename a file, the original filename is erased and then replaced with
    the new filename. All the information stays the same, only the name is changed.
    The following shows the syntax for the mv command:


    ```

    mv [options] sourcefile targetfile

    ```


    The sourcefile parameter is the name of the file to be copied and the targetfile
    parameter is the new name of the file. For example, if a file is named sample1
    and you want to change the filename to sample2, type mv sample1 sample2 and press
    Enter. You can also rename directories in this same way. When used without any
    command options, the mv command deletes the original file when the renamed file
    is created. In the example, the file named sample1 is renamed to sample2, and
    the file sample1 is deleted from the system.


    Two command options are used frequently:


    +   - To ensure that you don''t overwrite an existing file (by renaming a file
    using the same filename as another file in the same directory), use the backup
    (-b) command option. To use this option, type mv -b sample1 sample2 and press
    Enter. This creates a new file named sample1~, deletes the file named sample1,
    and if there were an existing file named sample2, it would now be called sample2~.

    +   - Another way to ensure that you don''t copy over an existing file is to use
    the interactive (-i) command option. The interactive option lets you know if you
    are about to overwrite an existing file. To use the interactive command option,
    type mv -i sample1 sample2 and press Enter.


    # Duplicating Files


    When you need to make a copy of a file, use the cp command. The cp command works
    much the same way as the mv command, except that the cp command does not delete
    the original file. To copy the file named copy1 to create a new file named copy2,
    type cp copy1 copy2 and press Enter.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '![](img/782ecfdc0b083a767896cc983e10427f_147_0.png)


    Use the interactive command option ( i ) with the cp command so that you don''t
    overwrite any existing files.


    # Task: Sharing Files with Microsoft Windows


    If you create files on a computer using the GNU/Linux operating system, you might
    find that you want to use these files on another computer that is running Microsoft
    Windows. Maybe you scanned a few photographs of your pet and enhanced it in The
    Gimp, and now you want to share it with a friend. What do you do when your friend
    has an old Windows machine, and hasn''t heard about the Internet? Maybe you should
    introduce him to the 21st century and GNU. Until then, format a floppy that will
    work on your friend''s computer and copy that fabulous photo. Here''s how to format
    an MS-DOS floppy disk:


    +   1. Place the floppy disk in the floppy disk drive.

    +   2. Log in as the superuser from your user account. Type su and press Enter.
    You will be asked for the root password. Type the root password and press Enter.

    +   3. Perform a low-level format on the floppy disk. Type fdformat /dev/fd0H1440
    and press Enter. (/dev/fd0 is the name of the device file that controls the floppy
    disk drive, and H1440 is the size of the disk.) You''ll see a message such as
    the one in Listing 7.4.


    # LISTING 7.4 The Output of the fdformat /dev/fd0H1440 Command


    ```

    double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kB.

    Formatting ... done

    Verifying ... done

    ```


    If there are any bad blocks on the disk, a message similar to Listing 7.5 displays.


    # LISTING 7.5 Sample Error Message from the fdformat Command


    ```

    double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kB.

    Formatting ... done

    Verifying ... floppy0: data CRC error: track 54, head 1, sector 5, size 2

    Floppy0: data CRC error: track 54, head 1, sector 5, size 2

    Problem reading cylinder 64, expected 18432, read 11264

    ```


    4. Create a DOS-FAT filesystem on the floppy so that you can share the floppy
    between a GNU/Linux system and a Microsoft Windows system. Type mformat a: and
    press Enter.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '5. To copy a file from your user account to the floppy disk, change to the
    directory that contains the file, and type cp filename /mnt/floppy and press Enter.


    6. To get back to your user account, type su username and press Enter.


    ![](img/782ecfdc0b083a767896cc983e10427f_148_0.png)


    > If you are using the Debian GNU/Linux distribution, use the superformat command
    instead of the fdformat command.


    # Summary


    After a little practice on the command line, you should begin to feel more comfortable
    working on your GNU/Linux system. During the past hour, you saw how easy it is
    to navigate the filesystem and create a directory structure in which to store
    your files. And you accomplished all this straight off the command line. If you
    still feel a little unsteady when working with files and directories, read the
    manual pages. You might also want to experiment in your home directory. Remember,
    you can always delete your experiments later.


    # Q&A


    Q Are there some good Web sites where I can learn more about file management and
    maintaining my GNU/Linux system?


    A Here''s a couple of sites that we''ve come across that might be of interest
    to you:


    The Kansas City Area Linux Special Interest Group put together a guide especially
    for new GNU/Linux users that explains the concepts of user and file management.
    You''ll find it at www.sabakisoftware.com/linux/topics/admin.


    The Linux Newbie Administrator Guide at sunsite.auc.dk/linux-newbie/ contains
    information useful to the new user and system administrator. You''ll find information
    on installing the operating system, configuring the system startup, upgrading
    the operating system, working with files and directories, available applications,
    and the X Window System.


    You can also search through the stacks at the Linux Documentation Project (www.linuxdoc.org).
    You''ll find a number of guides, the Linux HOWTOs and FAQs, and you can search
    the manual pages.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Q Are there other easy ways to read files in addition to the cat command?


    A You can also read files in the more and less pagers. Pagers enable you to look
    at the contents of a file line-by-line, or screen-by-screen. The less pager is
    more flexible than the more pager. The advantages of less over more are that you
    can scroll backward and forward through a file, search the file for specific text,
    and that the less pager does not close automatically when you come to the end
    of the file.

    To read a file with the less pager, type less filename and press Enter.

    If you need to see only the first few lines of a file or the last few lines, use
    the head and tail commands. The head command displays a specified number of lines
    from the beginning of the file. To use head, type head -n lines filename and press
    Enter, where the lines parameter is the number of lines to display on the screen.

    The tail command displays lines from the end of the file. To use tail, type tail
    -n lines filename and press Enter. Again, the lines parameter is the number of
    lines you want to view.


    Q Oops! I deleted a file and I want it back. What can I do?


    A Try the mc command. When you type mc at the command line, you call the Midnight
    Commander graphical file manager. To learn more about Midnight Commander, look
    up the manual page (type man mc and press Enter). You can use Midnight Commander
    either from a text screen or from a terminal emulator. Either way, Midnight Commander
    provides mouse support. There is also help to be found from within Midnight Commander
    by pressing the F1 key. Pressing the F2 key displays a list of help topics. Highlight
    the topic and press Enter to read the help file for the topic.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    # Quiz


    +   1. What three commands will keep you from getting lost in the filesystem,
    let you know where in the system you are working, and tell you which files are
    currently stored in the directory in which you are working?


    The ls command, the cd command, and the pwd command are the basic commands needed
    to keep track of where you are working in the filesystem. The pwd command prints
    the directory path for the directory in which you are working (also known as the
    current directory). The cd command moves you from directory to directory, and
    can take you back to your home directory in the wink of an eye. The ls command
    lists the contents of a directory.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '2. Is it possible to use more than one command option at a time on the command
    line?


    Yes, two or more command options can be placed after the dash (-) character and
    the order of the command options does not matter (for example, ls -1a and ls -a1
    display the same output). Multiple command options can be used only when the command
    options are represented by a single letter.


    3. What is the difference between the mv command and the cp command?


    The mv command is normally used to rename a file. When a file is renamed, the
    original filename is deleted. The cp command makes a copy of a file and both the
    original file and the copy of the file can be found on the system.


    4. Which command option helps make sure you don''t accidentally delete a file
    when moving, renaming, and copying files?


    The interactive command option (-i) prompts you for a confirmation if you are
    about to overwrite a file. The interactive command option should always be used
    with the rm, mv, and cp commands.


    # Exercises


    1. Create a directory structure in your home directory. Think about the types
    of files with which you will work (word processing, spreadsheet, graphics, and
    programming code) and how to logically organize your files. You might want to
    organize your files by file type. If you run a small business, you might want
    files for each project, for each client, or for each product or service that you
    sell. If you are a serious gardener, you might want separate directories for fruits,
    vegetables, herbs, and ornamental plants. Then, each directory can contain a subdirectory
    for a particular plant. For example, the herb directory can contain subdirectories
    for parsley, sage, rosemary, and thyme.


    2. If you''re old-fashioned, you might still carry files around on a floppy disk,
    and you might even transfer files between computer systems by copying to and from
    a floppy. An easy way to work with floppies no matter which operating system you
    are running is with the mtools utility. The mtools utility mformat was introduced
    earlier in this hour. To learn more about mtools, read the manual page (type `man
    mtools` and press Enter). You''ll also find more information about mtools at `mtools.Linux.lu/index.html`.'
  merge: -1
  img_proc: true
