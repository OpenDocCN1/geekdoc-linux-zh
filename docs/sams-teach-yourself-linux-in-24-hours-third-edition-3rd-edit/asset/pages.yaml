- pgno: 125
  md: 'Within each of these sections is an introduction page that describes the manual
    pages found in that directory. If you type man intro, the intro page for the /usr/man/man1
    directory displays. If you want to read the intro page for commands relating to
    the Linux filesystem (found in the /usr/man/man7 directory), type man 7 intro.


    The manual page directory structure is not searched in strict numerical order.
    Instead, the first directory (/usr/man/man1) is searched, followed by the eighth
    (/usr/man/man8) directory, and then back to /usr/man/man2, /usr/man/man3, /usr/man/man4,
    through to /usr/man/man9. The man command searches through the manual page directories
    until it finds a match to your search request.


    # Task: Reading the GNU Documentation


    Another important source of information comes from the Free Software Foundation''s
    GNU project. You''ll find documentation for GNU software in the info files. The
    info program is the hypertext help system for many of the programs and software
    development tools from the GNU project. Here''s how to read the info files:


    +   1. Type info and press Enter. The Directory node of the info file appears
    in a pager (see Figure 6.4). All the subjects covered in the info files are listed
    on this first page.


    FIGURE 6.4 The list of topics contained in the info program.


    ![](img/782ecfdc0b083a767896cc983e10427f_125_0.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   2. Press the H key and read the "Getting Started" section of the info file.
    Use the down-arrow key and the Page Down key to scroll through the file.

    +   3. Press the D key to return to the Directory node.

    +   4. Use the down-arrow key to find a subject you want to learn more about.
    When the subject is highlighted, press Enter. The info page for the selected subject
    will be displayed.

    +   5. Press Q when you are finished reading the info pages.


    # Some Helpful Search Commands


    As you might be beginning to see, the job of learning about the Linux operating
    system is a big job. There are so many commands that it''s a pretty big job just
    to find out about them (let alone learn how to use them). There''s also the vast
    quantity of software that installs with each Linux distribution. There are several
    commands that search your system and return different types of information about
    the files located in the filesystem.


    # Locating Files on the System


    The search command that you''ll find yourself using most often to look for files
    on the system is the find command. The most common use of find is to locate files.
    If you know the name of the file (or you can use wildcard characters if you only
    know part of the filename), find will search from the current directory and through
    all the subdirectories for the file you need. Using find to search for files is
    covered in Hour 7. Another task where find can prove very helpful is doing system
    backups (covered in Hour 10, "Backing Up and Restoring the Filesystem"). The find
    command can list those files that have been modified since the last backup. If
    several users share the system, the find command will tell you which files belong
    to a particular user or group of users (as you''ll see in Hour 12).


    # Displaying a Summary of a Program


    When you come across a new command and you''d like to quickly find out what the
    command does, try the whatis command. Unlike the man command, which displays the
    full manual page, the whatis command displays only the summary line from the manual
    page. Then, if you think this command is one that you might use, you can then
    display the manual page and explore the options for customizing the command output.'
