  md: '![](img/782ecfdc0b083a767896cc983e10427f_286_0.png)


    # Hour 18


    # Installing the X Window System


    Linux uses an external application to provide multimedia services. This is much
    different than the systems that control the video and audio through a part of
    the operating system software. The X Window System could be called Windows for
    UNIX. It does all the same things that Windows does, such as controlling the launching
    and management of graphical applications in separate windows on your computer
    screen. But the X Window System actually does much more than that, as you will
    see. The X Window System provides the means to control the video display and multimedia
    devices on your Linux box through an application called an X server.


    In this hour, you will


    +   - Learn how the X Window System works

    +   - Prepare before configuring the display

    +   - Configure the video display so that X works on your system

    +   - Change the video resolution and color depth on-the-fly'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# What Is the X Window System?


    When you installed the Linux operating system, you were given the opportunity
    to configure the X Window System so that you can take advantage of one of the
    full-blown graphical interfaces available for Linux, such as KDE and GNOME. After
    you select and configure the right X Window server for your system, it supplies
    the video, the audio, and the controls for peripheral devices such as the keyboard
    and the mouse. The X Window System even has tools for configuring the Linux kernel.
    It can also do all the things listed here on someone else''s screen.


    Having the X Window System installed on your computer makes it possible for you
    to take advantage of the world of free software that''s available for use with
    X. The X Window server can operate your CD writer, connect to your video camera
    and VCR, play movies and music CDs, provide a single interface across multi-platform
    networks, and a single X server can manage the display on many machines at the
    same time. X can also run MS Windows in an X window.


    # How It Works


    The X Window System is an application that is run by your computer. X Window is
    a server that provides multimedia capabilities for your Linux box. If you elected
    to install the X Window System when you installed Linux, you''ll find all the
    tools and utilities that you''ll need for selecting, configuring, and tuning an
    X server to fit on about any graphics card, monitor, and operating system combination
    in existence.


    # What You''ll Need Before You Begin


    Hopefully, when you installed Linux, the X server was installed properly so that
    you can use a graphical user interface. It''s easy to start the graphical interface
    from the text console. After you log in, type startx and press Enter. The default
    desktop environment (usually KDE or GNOME) will start. If you aren''t completely
    satisfied with the results, you can make changes to get a better display. But
    before you can fine-tune your display, you''ll need some of the information that
    you collected in Hour 1, "Gearing Up for the Installation." Here''s the information
    that you''ll need to get started:


    +   - The keyboard language and number of keys

    +   - The type of mouse (PS/2 or serial, number of buttons)

    +   - The manufacturer and model for the monitor along with the maximum resolution,
    vertical refresh rate, and horizontal refresh rate

    +   - The manufacturer and model of the video card, type of graphics card and
    chipset, amount of video memory, and color depth (8-bit, 16-bit, 24-bit, 32-bit)'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Fine-Tuning the X Window System


    If you cannot get the X Window System to work on your computer, or if you are
    not satisfied with the results, you can fine-tune the X Window System by making
    changes to the configuration file that controls how the X server acts to service
    your particular combination of video hardware and peripherals. The configuration
    file that controls the X server for the XFree86 version of the X Window System
    for Linux is the /etc/X11/XF86Config file.


    The X Window System consists of a collection of servers that can be tailored to
    fit any unique combination of graphics card and monitor hardware that you might
    have. After the configuration of the X server is done, the server configuration
    is stored in the /etc/X11/XF86Config file. When the X server is started, it reads
    the /etc/X11/XF86Config file and then sets up the multimedia and video display
    on your computer. To make changes to the X Window System installation on your
    computer, you edit the XF86Config file. This can be done by editing the file in
    a text editor or by using a configuration utility.


    ![](img/782ecfdc0b083a767896cc983e10427f_288_0.png)


    > Because it is possible to damage your equipment by making the wrong choices
    in the /etc/X11/XF86Config file, and because the configuration of video devices
    is a complex and technical process that''s outside the experience of most users,
    you should not try editing the /etc/X11/XF86Config file by hand.


    The /etc/X11/XF86Config file tells the X server where to find the databases for
    color palettes, where the font libraries are stored, what peripheral devices to
    operate, what the video card and monitor parameters are, what the keyboard layout
    is, which special features to run for your mouse, and much more. You can find
    out a lot more about the information contained in the /etc/X11/XF86Config file
    by looking at the sample file that was loaded along with the default X installation
    when you installed Linux. The sample file is called /usr/X11R6/lib/X11/XF86Config.eg
    and is shown in Figure 18.1.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'FIGURE 18.1

    The mouse section of the /etc/X11/

    XF86Config file.


    ![](img/782ecfdc0b083a767896cc983e10427f_289_0.png)


    # Task: Reading the XFree86 Documentation


    If you had problems with the video setup during the installation, you might want
    to read some of the specific documentation for your video card and monitor. Because
    every system is different, it is difficult to tell you exactly how to set up your
    system. Your best bet is to be prepared before you begin. Here’s where you’ll
    find more information to help you through the X Window System configuration process:


    +   1. Learn more about the XFree86 Project; get on the Internet and navigate
    to www.xfree86.org.

    +   2. Find helpful information in the Linux filesystem. Change to the /usr/X11R6/lib/X11
    directory (shown in Figure 18.2).

    +   3. See whether your monitor is supported. Read the /usr/X11R6/lib/X11/MonitorsDB
    file.

    +   4. Make sure your video card is supported. Read the /usr/X11R6/lib/X11/CardsNames
    file.

    +   5. Read the Quick Start guide to give you a little more background information
    (and confidence) before you begin. This file is located at /usr/X11R6/lib/X11/doc/QuickStart.doc.
    You might also want to read the README.Linux file.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# FIGURE 18.2


    Look in the filesystem to find information to help you configure the video settings.


    ![](img/782ecfdc0b083a767896cc983e10427f_290_0.png)


    6. Read the documentation for your particular video card. You''ll find this information
    in the /usr/X11R6/lib/X11/doc directory. There are several README files for each
    of the supported video cards. For example, if you have an NVidia card, read the
    README.NVIDIA file.


    7. Read about mouse support and support for other input devices, such as joysticks
    and graphics tablets. These files are named README.mouse and xinput.


    8. Back up the /etc/X11/XF86Config file before you begin. To back up the /etc/X11/XF86Config
    file, you must be logged in as root. At the command line, type the following:


    ```

    cp /etc/X11/XF86Config /etc/X11/XF86Config.old

    ```


    This command copies the original /etc/X11/XF86Config file to a file with a different
    name that won''t be overwritten. That way, in the instance that your tinkering
    around renders something inoperable, you can always copy the file back.


    # Using Configuration Tools to Tune X


    Wizards are available to make the editing of /etc/X11/XF86Config file manageable.
    These programs guide you through the configuration by helping you select from
    lists of options to edit the file. When the editing is finished, the wizard saves
    the new configuration in the same place where the old one is saved. In fact, it
    will overwrite any /etc/X11/XF86Config that you have in the /etc/X11 directory.
    This is the reason that you made a copy of this file in the previous task.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '![](img/782ecfdc0b083a767896cc983e10427f_291_0.png)


    > Many Linux distribution vendors have created their own configuration utilities
    for the /etc/X11/XF86Config file: Red Hat has XConfiguror, SUSE has SAX, Mandrake
    has XFDrake, and TurboLinux has turbocfg, to name a few. All these vendor-supplied
    programs should work to varying degrees to get you through the configuration of
    your X server. However, since the arrival of X11R6 release 4.0, many of these
    distribution specific utilities don''t function as well anymore and need updating.
    But, as luck would have it, the X.org people already have an updated utility,
    xf86config, that is present in all Linux distributions so that''s the one we will
    concentrate on in this hour.


    # Task: Configuring X11 with the xf86config Command


    To begin configuring the X Window System to fine-tune your video display, you
    will need to be logged in to the root account. As you step through each process,
    you might want to keep your Linux diary next to you and write down the steps you
    performed during the configuration. To begin working with xf86config, perform
    these steps at the command line:


    +   1. Start the configuration process. Type xf86config and press Enter. The opening
    screen appears. Read the information and press Enter to move to the next screen.

    +   2. Select your mouse. Several mouse types (as shown in Figure 18.3) are listed.
    Type the number that applies to the mouse that is attached to your computer and
    press Enter. If you use a two-button mouse, you will be asked whether you want
    the mouse to act like a three-button mouse. Type y and press Enter.

    +   3. Select a mouse device. Press Enter to select the default device of /dev/mouse.

    +   4. Elect to use Xkeyboard extension. Type y and press Enter.

    +   5. Select a keymap (the type of keyboard that is attached to the computer).
    Press Enter to display the list of keyboards. Type the number that corresponds
    to your keyboard and press Enter.

    +   6. Set monitor specifications. Press Enter to display the list of available
    monitor types (shown in Figure 18.4). Type the number that most closely matches
    the specifications for your monitor and press Enter.'
  merge: -1
  img_proc: true
