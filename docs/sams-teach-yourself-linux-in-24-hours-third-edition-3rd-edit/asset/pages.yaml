    Line numbers


    # Summary


    It''s been a long hour spent behind a text editor, and you''ve just barely scratched
    the surface. You might want to go back and commit to memory some of the editing
    commands you learned about. These commands make it easier to create files, move
    around within a file, and edit text. Then, you might want to explore some of the
    reasons for using a text editor. Go back and look at the list of configuration
    files that can be easily changed with just a few keystrokes. You might want to
    learn a little more about these files, and then try a few configuration changes.
    And, always remember to make a backup copy of a file first.


    # Q&A


    Q Where can I find information about Linux text editors on the Internet?


    A The most complete source of text editors is available from the Metalab Linux
    Archive at metalab.unc.edu/pub/Linux/apps/editors. Another good source is the
    Dave Central Linux Software Archive at linux.davecentral.com/officed.edit.html.
    Dave offers downloads of many Linux text editors in several formats (RPM, source
    code, and binary files) and provides a link to the home page for the editor.'
  merge: -1
  img_proc: true
