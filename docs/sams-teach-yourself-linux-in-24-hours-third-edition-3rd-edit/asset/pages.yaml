- pgno: 368
  md: '![](img/782ecfdc0b083a767896cc983e10427f_368_0.png)


    # Hour 24


    # The Home Entertainment System


    You''ve made it to the final hour and now it''s time to sit back, relax, and enjoy
    some entertainment. Besides some cool games, Linux also has quite a multimedia
    lineup. You''ll find everything from music players to video players to graphics
    programs.


    In this hour, you will


    +   - Play music CDs on your computer

    +   - Watch a video

    +   - Find some fun drawing and graphics programs


    # Playing Music CDs


    One way to drown out the background noise while you are trying to work is to pop
    a music CD into the CD-ROM drive of your Linux system and play some of your favorite
    albums. You''ll find several CD players in each Linux distribution. Table 24.1
    lists a number of CD players that may be installed on your system and the command
    to execute the player.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# TABLE 24.1 Select a CD Player


    | CD Player | Execution Command |

    |---|---|

    | GNOME CD player | gtcd |

    | Grip CD player and ripper | grip |

    | KDE CD player | kscd |

    | X window CD player | xplaycd |

    | Text mode CD player | cdp |


    Probably the easiest CD players to use and the ones installed with most every
    distribution are the GNOME CD player and the KDE CD player. The GNOME CD player
    (shown in Figure 24.1) is the electronic version of the CD player on your home
    stereo system, with a few added attractions.


    # FIGURE 24.1

    Use the GNOME CD player to play your favorite music CDs.


    ![](img/782ecfdc0b083a767896cc983e10427f_369_0.png)


    The KDE CD player (shown in Figure 24.2) works in much the same way as the GNOME
    CD player with a few added bells and whistles. To play a CD in either of these
    players, start the CD player, pop a music CD into the CD-ROM drive, and press
    the Play button. You''ll hear the first song on the CD and the track number will
    appear in the LED display.


    # FIGURE 24.2

    The KDE CD player is another easy-to-use CD player.


    ![](img/782ecfdc0b083a767896cc983e10427f_369_1.png)'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# Task: Downloading CD Album Information


    An easy way to keep track of the songs on a music CD is to download the information
    from one of the CD databases. Here''s how to keep track of your CD playlist with
    the GNOME CD player:


    +   1. Start the GNOME CD player and pop your favorite music CD into the CD-ROM
    drive.

    +   2. Change the player preferences. Click the Preferences button to display
    the preferences dialog box and the CDDB tab shown in Figure 24.3. Make sure that
    there is an address for one of the CDDB servers listed in the Address text box.
    If you do not want to use the default CDDB server, type in your favorite CDDB
    server address.

    +   3. Connect to the Internet.

    +   4. Download the CD database information. Click the Open Track Editor button
    to display the Disk Information panel. Then click the CDDB Status button to open
    the Status panel. In the Status panel, click the Get CDDB Now button. The information
    downloads and appears in the Disc Information panel and in the LED display of
    the CD player.

    +   5. Start playing songs. You can double-click a song in the track editor or
    you can press the Play button on the CD player.


    FIGURE 24.3

    Select a CD database from which to download CD information.


    ![](img/782ecfdc0b083a767896cc983e10427f_370_0.png)'
  merge: -1
  img_proc: true
