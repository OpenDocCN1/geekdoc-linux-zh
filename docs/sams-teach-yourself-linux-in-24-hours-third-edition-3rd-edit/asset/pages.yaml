    ![](img/782ecfdc0b083a767896cc983e10427f_128_0.png)


    The `whatis` database needs to be updated periodically so that any new programs
    that have been installed on the system are included in the `whatis` database.
    To learn how to automate this task, go to Hour 17, "Automating System Administration
    Tasks."


    # Finding a Program’s Execution File


    After you have used the `whatis` command to determine what a command or program
    does, and then read the manual page to learn how to operate the command, you can
    use the `whereis` command to search through the directories that are coded into
    the program and to list a variety of information about the file. By using the
    `whereis` command, you''ll learn where the binary (or execution) file, the source
    files, and manual pages for the command are located.


    To use the `whereis` command, type `whereis` followed by the command name (remember
    to put a space between the two). If you want to know the location of the execution
    file and manual page for the `ls` command, type `whereis ls` and press Enter.


    ![](img/782ecfdc0b083a767896cc983e10427f_128_1.png)


    When you only want to know where the execution file for a command is located,
    use the `which` command.


    # Finding a Program to Do the Job


    When you need to perform a certain task and you don''t know what program or command
    can do the job for you, ask the `apropos` command for help. For example, you might
    have a document that you want to spell check, but the text editor you are using
    doesn''t provide a spell checker. At the shell prompt, type `apropos spelling`
    and press Enter. You''ll see several programs that might be of use. After you
    have a list of potential programs, use the `whatis` command to see whether the
    program suits your needs.'
  merge: -1
