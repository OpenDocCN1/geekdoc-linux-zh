    KPackage (shown in Figure 15.1) to manage applications. Linux-Mandrake has a similar
    version, called RpmDrake, which you''ll learn how to use later in the hour. TurboLinux
    uses a proprietary configuration tool called TurboPkg (which uses a menu system)
    to update packages.


