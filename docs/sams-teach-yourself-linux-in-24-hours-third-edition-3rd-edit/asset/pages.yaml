    # Summary


    In this hour, you were introduced to the Linux operating system. You saw how Linux
    uses the filesystem to control how your computer operates. You learned what is
    contained in each of the directories and how the files in each directory work.


    # Q&A


    Q I''d like to learn more about the Linux filesystem. Do you have any good references?


    A The standard for the Linux filesystem structure can be found at www.pathname.com/fhs/1.2/fsstnd-toc.html.
    This standard details the types of files you''ll find within each directory.


    Q What is the easiest way to read the help files in the /usr/doc directory?


    A Because much of the help information is written as HTML files, you may want
    to start the X Window System and your favorite desktop environment. Select a graphical
    file manager and navigate to the /usr/doc directory. If you double-click any of
    the HTML files, these files will most likely open in Netscape Navigator. If the
    file manager does not know which application in which to open the file, you''ll
    be asked to choose one. You can try one of the many text editors installed on
    the system.


    Q How can I display the processes that are running on my system?


    A Try the top command. From the shell prompt, type top and press Enter. The top
    command shows you which users are logged in and in which commands, applications,
    and services they are using. You''ll learn more about processes in Hour 13, "Working
    with Processes."'
  merge: -1
  img_proc: true
