- pgno: 108
  md: 'To create an alias for the following command


    ```

    cd /usr/doc/HOWTO/HTML/en/mini

    ```


    use the alias command. First, you will need to think of an alias name for the
    command. Because this command changes to the directory in which the text versions
    of the Linux HOWTOs are stored, a sample alias name might be gotoHOWTO. To create
    this alias, at the shell prompt, type


    ```

    alias gotoHOWTO=''cd /usr/doc/HOWTO/HTML/en/mini ''

    ```


    The alias command is followed by the alias name. The equal sign (=) precedes the
    command that will be executed when the alias name is typed at the shell prompt.
    Do not use spaces on either side of the equal sign. If the command contains spaces
    or wildcard characters, surround the command with quotation marks.


    Now to change to the HOWTO directory, just type gotoHOWTO at the shell prompt
    and press Enter. Keystrokes have been reduced from 31 down to nine.


    Are you security conscious? You can prevent yourself from accidentally deleting,
    copying, or moving files while you are working in the filesystem. In Hour 7, you''ll
    learn how to use the rm (delete the file), cp (make a copy of the file), and mv
    (move the file to a new location in the filesystem) commands to work with files.
    One danger when working with these commands is that Linux doesn''t tell you what
    it is going to do when you execute the command. You can easily protect your hard-earned
    data files by creating aliases for these commands that force the command to ask
    you whether you really want to perform the specified action on the file.


    To change the rm, cp, and mv commands so that they work in interactive mode, use
    the following alias commands:


    ```

    alias rm=''rm -i''

    alias cp=''cp -i''

    alias mv=''mv -i''

    ```


    Whenever you use these commands, you will be asked to confirm the action before
    the operating system will begin moving and deleting files. (cp and mv will prompt
    only if the destination file exists.)


    # Executing Commands with Shell Scripts


    Earlier in the hour, we discussed using command redirection and piping the output
    of one command to another to tie commands together in a string enabling them to
    perform a complete job. It is a simple trick to make these command strings into
    reusable tools by making them into scripts that the shell can execute when you
    type in a short command.'
