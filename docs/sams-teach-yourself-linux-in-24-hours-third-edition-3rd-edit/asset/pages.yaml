- pgno: 114
  md: '![](img/782ecfdc0b083a767896cc983e10427f_114_0.png)


    # Hour 6


    # Looking at the Command Line


    You might ask why you need to learn to type text commands at the shell prompt
    when there are so many nifty tools and utilities with graphical front ends that
    perform the same tasks. There are several good reasons, but the best reason is
    that it doesn''t matter which Linux distribution you are using or how the system
    is set up, you can always rely on commands to get the work done. One task that
    you''ll perform regularly is file maintenance. In a graphical world, you would
    open up a file manager and click a few icons to create directories and move files
    around. With a little practice, you''ll find it just as easy to use a few keystrokes
    to move those same files.


    At the end of Hour 2, "Installing Linux-Mandrake," you learned how to access the
    system from the Linux login prompt. Then you were left standing at the shell prompt
    and told to execute your first command by shutting down the system.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'In this hour, you will:


    +   - Identify the basic commands needed to properly operate as a user on the
    Linux operating system

    +   - Use proper command-line grammar when typing at the shell prompt

    +   - Become an efficient command-line typist by using wildcards and command-line
    completion

    +   - Read manual pages to find out what task a command performs and how to use
    the command

    +   - Search the filesystem for files and look up file information


    # Learning About Commands


    There are many good reasons to become familiar with commands and their usage.
    If the X Window System did not install correctly on your system, you will need
    to work with the command line to properly configure your video display. After
    you work with Linux for a while, you''ll find that it isn''t possible to perform
    every task from a graphical desktop environment; you need to type a command or
    create a script. Those with repetitive strain injuries will find the command line
    a more comfortable place to work. Files can be moved and copied without the strain
    that dragging and dropping places on the mouse finger. These are just a few of
    the reasons it is important to learn about Linux commands and how to operate from
    the shell prompt.


    You can use commands to manage your Linux system and these commands can be modified
    to behave the way you want. There''s quite a bit of flexibility in how a command
    processes a given request. Commands can be modified to perform tasks in addition
    to the default actions of the command. These modifications can take the form of
    a command option, a parameter, an input/output redirection, or a pipe. After you
    discover how all these elements work together on the command line, you can use
    any Linux command.


    All commands follow the same syntax, or command-line grammar. After you understand
    this structure, the job of typing commands will become a simple task. Two examples
    of the command syntax in its basic form can be seen in Figure 6.1.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'FIGURE 6.1

    Two examples of the ls command: each uses a slightly different syntax.


    ![](img/782ecfdc0b083a767896cc983e10427f_116_0.png)


    # The Basic Syntax for a Command


    In the hours that follow, you''ll see many places where the syntax for a particular
    command is given. For each command, there will be an example of the command usage,
    similar to the following example:


    ```

    commandname -options [parameter]

    ```


    This single-line command is what is referred to as the command line, and it is
    typed after the shell prompt. To execute the command, press Enter. The minimum
    usage for most commands is the command and one or more command options.


    **New Term** Command options are typed after the command and are used to modify
    the results of the command. Before typing an option into the command line, there
    must first be a space between the command and the command option. Then, a dash
    (-) character must precede the command option. The dash tells Linux to treat each
    letter that follows the dash as a command option. There is no space between the
    dash and the command option. There can be more than one command option, but do
    not put any spaces between the dash and the options.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'In Chapter 7, "Moving Around the Filesystem," you''ll learn how to create a
    simple command to view the files contained in a directory. Here''s an example
    of this type of simple command:


    ```

    ls -l /usr/doc

    ```


    The command used in this example is ls, which displays a file list for the contents
    of the current working directory. The command option is -l, which modifies the
    information displayed about each file in the listing. The parameter tells the
    command to list the contents of the /usr/doc directory instead of the current
    working directory.


    **NEW TERM**

    A command parameter is some other type of information that the command can use
    to modify its output. A parameter can be a file, a directory, or a period of time.
    Parameters are not preceded by a dash. Parameters specify which file or directory
    a command is to be acted upon, or they can set a time limit in which the command
    is to be executed.


    When reading the command syntax, keep the following in mind:


    +   - Any text that appears in bold type must be typed exactly as it appears.

    +   - Text that appears in italics is a placeholder for a name or value. The italicized
    text needs to be replaced with an actual filename or directory, or some other
    user-supplied data.

    +   - Text that appears inside the square brackets ([]) is an optional part of
    the command. This part of the command syntax is not necessary to execute the command.
    Do not type the square brackets.


    # Typing on the Command Line


    There are two different ways you can approach the command line. If you followed
    the directions in Hour 2, you will be in a text screen after you log in to your
    user account. If you feel brave, you can work from this text screen. If you log
    in to your user account and are taken directly to a desktop environment (such
    as KDE or GNOME), you can still work on the command line from a terminal emulator
    program. You might find a variety of terminal emulators on your system. The most
    popular is xterm. Search around your system, you might find a terminal emulator
    that is fun to use. One such terminal emulator is eterm (shown in Figure 6.2).
    Whether you type from a text screen or from a terminal emulator, the commands
    will perform the same actions.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'FIGURE 6.2

    The xterm terminal emulator can be configured to display a background and large
    text.


    Shell prompt


    ![](img/782ecfdc0b083a767896cc983e10427f_118_0.png)


    # Correcting Command-Line Mistakes


    As you''re typing along on the command line, you''re bound to press a wrong key.
    What''s a typist to do? You have several choices:


    +   - For serious typing mistakes, you might want to consider clearing everything
    that appears on the command line. Just press Ctrl+U. After you have an empty command
    line, you can try typing the command again.

    +   - If you caught the error quickly, press Backspace to clear the character
    to the left of the cursor. Backspace deletes only one character at a time. Press
    Backspace until the error is deleted, and then continue typing the command correctly.

    +   - When the typo is in the middle of the command line, press the left-arrow
    key until the cursor is to the right of the error. Press the Backspace key to
    delete the error. You can then either insert new text (it will be inserted to
    the left of the cursor) or use the arrow key to move to the end of the command.


    # Using Command Shortcuts


    There are a few typing shortcuts that will help make your job at the command line
    a little easier. Here''s how you can cut down on your number of keystrokes per
    hour:


    +   - Maybe your memory is fading and you can''t remember a command you used in
    recent history. Press the up-arrow key and watch time travel backward as the previous
    command that you typed appears after the shell prompt. Press the up-arrow key
    to continue looking at each previously typed command. When the command you need
    appears after the shell prompt, press Enter to execute the command.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '+   - The bash shell includes a trait that allows you to type a portion of
    a command or filename and the shell will guess at the complete command or filename.
    You need to type enough of the command or filename so that it can be uniquely
    identified. After you type a few characters, press Tab and the shell completes
    the rest of the command. If the shell cannot make a guess, you will hear a beep
    and a list of potential commands appears. Enter more characters and try to complete
    the command again.

    +   - One way to get more mileage out of a command is with the use of wildcard
    characters. Wildcards are used to select files or directories that meet certain
    requirements. The * wildcard replaces one or more characters in the file or directory
    name. The ? wildcard replaces a single character in the file or directory name.
    You''ll work with wildcards in Hour 7, when you learn how to view the list of
    files in a directory.


    ![](img/782ecfdc0b083a767896cc983e10427f_119_0.png)


    > Wildcards are used only for filenames and directory names. Do not use wildcards
    for command names or command options; Linux will not recognize the command.


    # Changing the Standard Output


    When you execute a command, the command is read from the keyboard (the standard
    input) and the results (or the output) of the command appear on the screen (the
    standard output). If you want the command output to appear in a different place,
    or if you want to send the output to another command for processing, you will
    need to change the output with a process called input/output redirection. Command
    redirection is done by separating two or more commands with the > or | character.


    One way to redirect the output is to save the results of the command to a file
    instead of displaying it on the screen. This enables you to save a picture of
    the output for later use. The > character is used when you want to send the output
    of a command to a file or to a printer.


    Most Linux commands are simple tools that perform a single task. There might be
    times when you need to combine two or more commands to do a job. For example,
    if the list of files that displays as the result of the ls command is too long
    to read, combine the ls command with the less pager. This gives you the ability
    to scroll through the file list.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Combining commands is accomplished with a pipe (specified with the | character).
    The pipe acts as a go-between for two commands in which the output of the first
    command is ''piped'' over to become the input of the second command.


    ![](img/782ecfdc0b083a767896cc983e10427f_120_0.png)


    > After you become a command-line pro, you''ll start combining commands and pretty
    soon your commands will be longer than the screen. When a command is too long
    to fit on one line, type the Backslash (\ ) character and press Enter to continue
    the command on the next line.


    # Task: Viewing the Command History List


    The shell keeps track of the last 500 commands that you''ve typed. If you''ve
    used the command line frequently, using the arrow keys to scroll through the command
    history list might take some time. An easier way to see the commands you''ve used
    is with the history command. Here''s how to easily list those commands you''ve
    used and select a command from the list to execute.


    1. To see the command history list, type history and press Enter. The previously
    executed commands appear in a list. You''ll see a number to the left of the command.
    An example of a history list is shown in Listing 6.1. This list contains two columns.
    The first column indicates the order in which the commands were typed. This is
    also the number you use to execute a command from the list. The second column
    is the command as it was executed.


    # LISTING 6.1 Sample Output of the history Command


    ```

    1 startx

    2 man adduser

    3 man passwd

    4 shutdown

    5 vi practice.txt

    ```


    2. Search through the list until you find the command that you want to execute.
    To execute the command, type !number and press Enter, where number is the number
    in the first column of the history list that corresponds to the command you want
    to use. Using Listing 6.1, to start the X Window System (shown as 1 startx in
    the example), type !1.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '3. If the command history list is longer than your screen, type history | less.
    This sends the command to the less pager and you can use the up- and down-arrow
    keys to scroll through the list. To exit the pager and return to the shell prompt,
    type q.


    4. You might only want to see the last few commands that you''ve typed. To see
    the last 10 commands, type history 10 and press Enter.


    # Understanding the Manual Pages


    So far, you''ve been introduced to a few of the commands that you''ll be using
    on your Linux system and you''ve seen how commands are structured. Now it''s time
    to find out where you can locate more information about those commands and how
    to use them.


    When you want information about a command, whether it''s a description of a command
    or a list of command options, head to the Linux manual pages (also known as the
    man pages). A manual page is displayed on your screen (through a utility called
    a pager) when you use the man command to request information on a topic. The pager
    is used to read the contents of a manual page.


    # The Syntax for the man Command


    The manual pages are the system reference pages for the commands installed on
    the system. When the man command is executed, it searches through the manual page
    titles for the topic that you request. The following code shows the syntax for
    the man command:


    ```

    man [options] [section] topic

    ```


    Where:


    +   - The topic parameter is normally the name of a command (also the title of
    the manual page). At a minimum, you need to use the man command with a topic.
    For example, typing man man displays the manual page about the man command. This
    manual page describes how manual pages work. Typing man ls displays the manual
    page that describes the different ways in which the contents of a directory can
    be listed. Table 6.4 shows the contents of each of the sections.

    +   - There are several options that you can use with the man command to change
    the default output. Sometimes more than one manual page for a command exists,
    but the man command displays only the first manual page that it comes across.
    To display other related manual pages, one after another, use the man command
    with the -a option (type man -a and press Enter).'
  merge: -1
  img_proc: true
- pgno: 122
  md: '+   - The section parameter is used if you want to change the order in which
    the man command searches the through the manual page directories for the topic
    you request. This is useful if there is more than one manual page for a command.
    Table 6.5 shows the different directories contained in the manual page system.


    # Task: Reading the Manual Page for the man Command


    When a manual page is requested, it is displayed in one of two pagers—more or
    less. By default, the manual pages on your system should display in the less pager.
    Because most manual pages take up more space than is available on your screen,
    you''ll need to learn a few commands to read the entire manual page in the pager.
    The best way to become familiar with the man command and reading the manual pages
    in a pager is to read the manual page for the man command. Here''s how to display
    the man manual page to:


    +   1. At the shell prompt, type man man and press Enter. The manual page for
    the man command appears on the screen. You will see only a portion of the manual
    page, depending on the size of the screen (see Figure 6.3).


    FIGURE 6.3

    The manual page for the man command.


    ![](img/782ecfdc0b083a767896cc983e10427f_122_0.png)


    +   2. Read the first screen of information and press the spacebar when you want
    to move to the next screen in the manual page.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '+   3. Press the B key to move back one screen through the manual page.

    +   4. To move one line at a time through a manual page, press Enter.

    +   5. If you want to search the manual page for a specific word, type a slash
    character (the / appears at the bottom of the screen), followed by the search
    term, and press Enter. Every occurrence of the word searched for will be highlighted
    in the manual page.

    +   6. When you are finished reading the manual page, press the Q key. The pager
    will close and you will be returned to the shell prompt.


    # Deciphering the Manual Page


    There’s a lot of information in the manual pages, but it might be hard for a new
    Linux user to understand. Each manual page describes a command and how it works.
    Table 6.4 gives you a brief rundown of the main parts of a manual page.


    TABLE 6.4 What You’ll Find in a Manual Page


    | Section Name | Contents |

    |---|---|

    | Name | The name and a short description of the command |

    | Synopsis | How the command is used and a list of the associated command-line
    options |

    | Description | An explanation of the program and options |

    | Options | A list of all the command-line options, along with a brief description
    of how to use each option |

    | See Also | Other manual pages that reference similar information |

    | Diagnostics | Descriptions of any error messages you might encounter |

    | Bugs | Known problems associated with use of the command or program |

    | History | A record of the development of the program |

    | Author | A list naming the author of the program and other contributors |


    The two sections of the manual page that tell you how to use the command are the
    Synopsis and Options section. The Synopsis section shows the syntax for the command.
    The command options fit into the syntax and modify the actions of the command.
    Options allow you to fine-tune a command so that it gives you the output in a
    form that is useful to you.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Task: Modifying the Output of the man Command


    All commands use command options to customize the actions of the command. Here''s
    some practice using command options with the man command:


    +   1. Type man -a man and press Enter. This command tells the less pager to display
    all the manual-pages that are named "man."

    +   2. When the first manual page appears, use the spacebar to scroll through
    the document.

    +   3. When you are finished reading the first manual page, press Q. The pager
    formats the second manual page for the man command that explains macros that format
    manual pages.

    +   4. Read the manual page. Press Q when you''re done and you will be returned
    to the shell prompt. Remember, for our example user rusty, it looks like this:


    ```

    [rusty@localhost rusty]$

    ```


    # Changing the Search Order


    The manual pages are organized into several directories and manual pages are categorized
    into these directories. If you want to search in a specific directory for a manual
    page, just specify the directory number in the sections parameter of the man command
    syntax. You can also search the directory structure of the manual pages in a specific
    order. Table 6.5 shows the directory structure used by the manual pages and what
    can be found in each directory.


    # TABLE 6.5 Directory Structure of the Manual Pages


    | Directory | Contents |

    |---|---|

    | /usr/man/man1 | Commands that run from within a shell |

    | /usr/man/man2 | Documentation on system calls |

    | /usr/man/man3 | Manual pages for the libc functions |

    | /usr/man/man4 | Information about files in the /dev directory |

    | /usr/man/man5 | Details of formats for special files such as /etc/passwd |

    | /usr/man/man6 | Games |

    | /usr/man/man7 | Descriptions of the Linux filesystem and man pages |

    | /usr/man/man8 | Pages for root operator utilities |

    | /usr/man/man9 | Documentation on Linux kernel source routines |'
  merge: -1
