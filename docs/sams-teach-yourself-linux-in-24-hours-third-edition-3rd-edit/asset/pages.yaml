- pgno: 354
  md: '![](img/782ecfdc0b083a767896cc983e10427f_354_0.png)


    # Hour 23


    # Playing Games


    Time for recess! Way cool! You can finally have some fun and excitement. Linux
    has a vast assortment of games that offer great opportunities to lose yourself
    in pleasant distraction while wasting time and computing resources. In fact, this
    is one area where energy has been well spent in the Open Source movement. There
    are games that are designed to run on any computer using the X Window System.
    You''ll find plenty of games installed with the GNOME and KDE desktop environments.
    There are also different game collections for different Linux distributions, even
    for different UNIX distributions. You''ll find that quite a number of these wonderful
    little distractions are installed on your own Linux system. When you find yourself
    bored with the games already on your system, you can hunt for games on the Internet.


    In this hour, you will:


    +   - Find games in GNOME and KDE

    +   - Explore the X Window System and BSD collections of games

    +   - Play educational and strategy games

    +   - Learn how to run DOS and Windows-compatible games on Linux'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Looking for Games in Too Many Places


    Long ago and far away, somewhere in the deep dark past, you made a number of decisions
    about how to install Linux on your computer and what application packages to install
    along with the operating system. Somewhere in every installation is at least one
    collection of games. Games come from everywhere. You''ll find a collection of
    games that perform entirely in the display of a text screen. Other games display
    pictures, motion, sound, and even provide an opponent, and are part of the X Window
    System and the various desktop environments.


    # Accessing the KDE Games


    Click the KDE Application Starter button and you''ll find a whole menu of amusements
    right at the top of the list. The KDE games collection includes some of the same
    games that are in the GNOME and X Window System collections. Both GNOME and KDE
    have several versions of a mahjongg game (one version is shown in Figure 23.1),
    but the KDE version gives you the opportunity to select more than one option for
    the way that the game pieces are laid out. If you enjoy the Tetris arcade game,
    you''ll find several versions from which to choose.


    FIGURE 23.1

    Match the mahjongg tiles until all the tiles have been cleared from the board.


    ![](img/782ecfdc0b083a767896cc983e10427f_355_0.png)'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'Most of the figures used in this book show images of the various desktop environments
    and application packages running on Linux. These images were acquired with a screen
    capture utility. If you need a picture of your desktop, use the Screen Shot utility
    in The GIMP, or you can use a standalone program such as Ksnapshot. You''ll also
    find Pick X Window Image (which uses the codename of xwpick) in the Amusement
    menu (look under the Toys submenu).


    # Exploring the GNOME Games


    If you are using the GNOME user interface, you can find the collection of games
    that GNOME provides in the GNOME main menu. Look for the Amusement submenu found
    in the Programs menu. Here you''ll find such interesting classics as mahjongg,
    a 32-game collection of solitaire games called Patience, and a Linux version of
    the Windows Minesweeper game (shown in Figure 23.2).


    FIGURE 23.2

    Step carefully through the minefield so that you aren''t blown to smithereens.


    ![](img/782ecfdc0b083a767896cc983e10427f_356_0.png)


    Not all the amusements are for fun and enjoyment; some can be very useful. One
    of the hazards of the computer age is repetitive strain injury cause by excessive
    mouse usage. If your mouse finger feels a bit sore, open up the Mousepedometer
    (shown in Figure 23.3) and see how far the mouse travels on the screen. To learn
    more about Mousepedometer, right-click inside the window and select Help from
    the menu that appears. Another tool that you might find useful is MoonPhase. This
    small program lets you know when the full moon is expected to rise.'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'FIGURE 23.3

    Measure screen mileage with the Mouspedometer.


    ![](img/782ecfdc0b083a767896cc983e10427f_357_0.png)


    Odometer

    Tripometer


    > If you are using one of the other window managers (such as FVWM or AfterStep),
    you''ll also find a Games or Amusements menu from the window manager''s main menu
    button (usually found at the lower-left corner of the screen).


    # Games for the X Window System


    No computer game collection would be complete without a couple of good action
    adventure games that enable you to laser, phaser, or photon torpedo your enemies
    to cosmic dust with the mere flick of a mouse finger. If you enjoy video arcade
    games, you''ll definitely want to check out the games for the X Window System.
    These games make use of a graphical display and enable you to use a mouse or a
    joystick to navigate your way around a planet (see XLander in Figure 23.4), steal
    necessary supplies and provisions, and conquer the populace.


    FIGURE 23.4

    See whether you can land the lunar lander on the moon''s surface.


    ![](img/782ecfdc0b083a767896cc983e10427f_357_1.png)


    Lunar lander


    Moon surface


    Because the X Window System controls the video, mouse, and sound for your Linux
    installation, X Window System games abound in the Linux world. Both strategy and
    video games are included with your Linux distribution. How do you know whether
    a'
  merge: -1
  img_proc: true
- pgno: 358
  md: "game is compatible with the X Window System? Well, usually the name of the\
    \ game starts with the letter X. You can find more games for the X Window System\
    \ at ftp.x.org/contrib/games.\n\n![](img/782ecfdc0b083a767896cc983e10427f_358_0.png)\n\
    \n> Many of the X games require at least 16-bit color (high color) and need a\
    \ resolution of at least 1024x768.\n\n# Task: Searching the Manual Pages for Games\n\
    \nOne way to learn how to use a game is to read the help manual, which can be\
    \ found by opening the Help menu. Another way to learn the rules of a game is\
    \ to read the manual pages. Many of the programs installed on your system have\
    \ manual pages. Here's how to read the manual pages for many of the games installed\
    \ on your system:\n\n+   1. Type `man -K game` and press Enter. The manual page\
    \ system will be searched and the first instance of the word game that is found\
    \ in a manual page will appear. Here's one of the things that displays first on\
    \ a system running Linux-Mandrake:\n+   \n+   `/usr/man/mann/guru.n.bz?? [yng]`\n\
    +   \n+   In this example, you are asked whether you want to read the manual page\
    \ for a program called guru. The three characters inside the brackets are the\
    \ commands for the responses that the system can process\n+   2. Decide whether\
    \ you want to read the manual page. Type y and press Enter to read the manual\
    \ page; type n and press Enter to show the next manual page listing in the search;\
    \ or type q if you want to quit and return to the shell prompt.\n+   3. While\
    \ browsing the manual pages, keep track of the games that sound like fun.\n+ \
    \  4. When you come to the end of the list, the shell prompt will appear. Try\
    \ another search. For example, you might want to try `man -K solitaire`.\n\n![](img/782ecfdc0b083a767896cc983e10427f_358_1.png)\n\
    \n> The -K option searches every single manual page for the specified search string.\
    \ This might be a slow process, depending on such factors as the speed of the\
    \ computer."
  merge: -1
  img_proc: true
- pgno: 359
  md: '# The BSD Games Collections


    Now that you''ve seen a few games with a graphical front end, it''s time to look
    at a few console games. Console games are intended to run on a text-only screen—without
    the fancy graphics and video. The majority of these console games are found in
    the BSD games collection.


    ![](img/782ecfdc0b083a767896cc983e10427f_359_0.png)


    > You won''t find the BSD games in every Linux distribution. Most likely, you''ll
    find the BSD games in the Slackware and Debian distributions. The BSD games are
    stored in the /usr/games directory. If you can''t find these games on your system,
    you can get them from MetaLab Linux Archive at metalab.unc.edu/pub/Linux/games.
    If you would like an RPM file to download, search the pages at www.rpmfind.net.


    Life is a crapshoot and you''re rolling the dice. There are some very good dice
    and board games available in the BSD games for your sporting pleasure. You can
    play them with a friend or you can match wits with the computer. Some of the popular
    board games that you can try include cribbage, monopoly (shown in Figure 23.5),
    and backgammon. You''ll even find a tutorial to help you learn backgammon: it''s
    called teachgammon.


    FIGURE 23.5

    You''ll have to use a little imagination to see the monopoly board.


    ![](img/782ecfdc0b083a767896cc983e10427f_359_1.png)


    Five-card stud, hold two and roll your own, jacks or better to open! Poker, solitaire,
    Mile Bourne (shown in Figure 23.6), and other games that you can play with others
    on the network or, if not, the computer can fix it so that you can play with imaginary
    friends. Because many of the BSD games don''t look like their board-bending, card-carrying
    cousins, you might need to read the manual pages for each game to help you figure
    out the rules.'
  merge: -1
  img_proc: true
- pgno: 360
  md: "FIGURE 23.6\nMake sure that you have a spare tire in the trunk before you begin\
    \ your travels.\n\nPlay against the computer\n\n![](img/782ecfdc0b083a767896cc983e10427f_360_0.png)\n\
    \n> When installing games on Linux, you should place them in the `/usr/local/games`\
    \ directory.\n\n# Task: Educational Games for Kids\n\nComputers can make dreary\
    \ old homework a fun thing to do. There are games that you can play to learn things\
    \ such as math, science, and the other school subjects. These entertaining games\
    \ make it easy and fun to learn about boring subjects. Linux has some great games\
    \ for kids, and it is a great platform for lots of good software to help them\
    \ excel at their studies. Here’s a few of the BSD games that can help with the\
    \ after school studies:\n\n> Before you try this task, you might want to read\
    \ the manual pages for each of the games.\n\n+   1. Test your math skills. Type\
    \ `arithmetic` and press Enter. A math equation such as the following appears:\n\
    +   \n+   12 - 2 =\n\n> If you cannot get the BSD games to load by just typing\
    \ the name of the execution file, you will need to use the full pathname. For\
    \ example, if the `arithmetic` command does not work, type `/usr/games/arithmetic`\
    \ instead."
  merge: -1
  img_proc: true
- pgno: 361
  md: '2. Type your answer and press Enter. If you get the answer correct, the game
    tells you that you are Right! and displays another math equation.

    If you are wrong, the computer says What? and the cursor waits on the next line
    for the correct answer.


    3. To quit the math game, press Ctrl+D.


    4. Test your word skills with a game of hangman. Type hangman and press Enter.

    You''ll see the hangman game shown in Figure 23.7. The computer thinks of a word
    and you need to type letters to fill in the blanks before the computer hangs you!


    FIGURE 23.7

    Test your word-building skills with a game of hangman.


    ![](img/782ecfdc0b083a767896cc983e10427f_361_0.png)


    5. Type a letter. The computer either fills in a blank in the Word area or hangs
    a body part on the noose. When the game is over, the computer asks whether you
    want to play another game. Type y to play another round, or n to quit.


    6. Take a short break with a game of Go Fish. Type fish and press Enter. The computer
    displays the cards in your hand and it is your turn to ask the computer for a
    card. The display will be similar to the following:

    Your hand is: A 4 4 4 7 8 9

    You ask me for:


    7. Type the letter or number for the card that you want. The computer will either
    give you the card or tell you to "GO FISH!". When you are done with the game,
    press Ctrl+D.


    8. Test your IQ. Type quiz and press Enter to see a list of topics. Make a note
    of any topics that interest you. Type q when you have noted your topics.'
