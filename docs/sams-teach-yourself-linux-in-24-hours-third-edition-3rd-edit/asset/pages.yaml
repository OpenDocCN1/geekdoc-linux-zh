    # Understanding Dependencies


    You might have noticed that the file size for many of the installed packages is
    quite small. (You’ll find quite a number of packages that are less than one megabyte.)
    How can these programs be so small, yet so powerful? The secret lies in the shared
    libraries that are installed on the system already. These libraries are used by
    most every application, utility, and command installed on the system. Instead
    of each program containing all the necessary functions needed to run the program,
    the common functions are stored in libraries, where every program can read them
    and use the needed functions. You can see how this would save space on your hard
    drive, and make it somewhat easier for programmers to develop new programs.


    The downside to using a set of libraries to run another program is that the libraries
    must first be installed before the other program will run. And, considering this
    concept in reverse, if you uninstall a library that other programs need in order
    to run, you’ll cause'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'quite a few problems and your favorite programs might not work if they are
    dependent on the library you uninstalled.


    When you use rpm to install and uninstall programs, the rpm command checks for
    dependencies. If you uninstall a package upon which other packages depend, you''ll
    see a message such as the following:


    ```

    [root@localhost /root]# rpm -e libc-5.3.12

    error: removing these packages would break dependencies:

    libc.so.5 is needed by mswordview-0.5.14b6w-2mdk

    ```


    The system will return only the error message: it will not uninstall the package.
    The error message does tell you which application or applications (in this case,
    mswordview) depend on the package that you just tried to remove.


    ![](img/782ecfdc0b083a767896cc983e10427f_257_0.png)


    > A good rule of thumb about removing packages is that if other programs are dependent
    on a package, don''t remove it!


    You might also find that when you are installing packages, another package (or
    library) is needed before you can install the desired program. If you try to install
    a package that needs a certain library so that it can operate, and that library
    is not located on the system, you''ll receive a failed dependencies warning along
    with the name of the missing library. You''ll need to find the library and install
    it first. After the needed library is installed, you can install the package,
    this time with success.


