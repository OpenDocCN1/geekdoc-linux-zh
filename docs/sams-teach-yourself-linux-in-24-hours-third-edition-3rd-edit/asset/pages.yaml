- pgno: 262
  md: '# Hour 16


    # Updating the Linux Kernel


    The ability to upgrade your Linux kernel for free is a really nice thing. Now
    that you have installed Linux, you certainly should want the latest release, right?
    Actually, the answer to this question is probably no. If this were Microsoft Windows
    or a Macintosh operating system, you might be left behind if you didn’t upgrade,
    particularly at cocktail parties. But when you installed Linux, you got a better
    deal. To put it succinctly, if you don’t need new drivers and you don’t have any
    bugs, you don’t need to upgrade. Of course, you might still want to know something
    about upgrading your Linux kernel in case you need to do so in the future.


    In this hour, you will


    +   - Get everything ready before you start the kernel upgrade

    +   - Download the kernel source code

    +   - Learn how to compile the kernel and install it on your system


    ![](img/782ecfdc0b083a767896cc983e10427f_262_0.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Preparing to Upgrade the Kernel


    Before we get further into this business of upgrading the kernel, we need to make
    some serious preparations. First, let''s take a look at what is required to do
    the job:


    +   1. Read the kernel HOWTO very carefully. It has been written and maintained
    by Brian Ward since 1994. Thanks to his efforts and those of other contributors
    (listed in the HOWTO), this has long been a source of the best information about
    kernel updates. It is found at www.kernel.org.

    +   2. For those who might be upgrading to Kernel version 2.2 from an earlier
    distribution, you can find information about changes in the kernel for the 2.2
    kernel distribution at www.crynwr.com/kchanges. Unfortunately, as is the case
    with all technical things that change rapidly, this site has yet to be updated
    to the current exact version of 2.2.x, but it does have changes for the 2.3.x
    development kernel, so you can see where things might be headed.

    +   3. In addition to these sources, here is a short list of others you should
    investigate before you begin:

    +      * The Linux newbie guide at linux.umbc.edu/mirrors/newbie-admin-faq

    +      * Another beginner''s guide is Josh''s GNU/Linux Guide at jgo.local.net/LinuxGuide

    +      * Of course, you''ll want to look at The Linux System Administrator''s
    Guide at www.linuxdoc.org/LDP/sag/index.html

    +      * Linux Administration Made Easy at www.linuxdoc.org/LDP/lame/LAME/linux-admin-made-easy/book1.html

    +   4. Look at this group of HOWTOs gleaned from the kernel HOWTO:

    +      * The Sound-HOWTO if you need to know about sound cards and utilities

    +      * The SCSI-HOWTO for the scoop about SCSI controllers and devices

    +      * The NET-2-HOWTO is the networking HOWTO

    +      * The PPP-HOWTO for dial-up PPP networking in particular

    +      * The PCMCIA-HOWTO to find driver information if you have a notebook computer

    +      * The ELF-HOWTO explains what ELF is because the 2.2.x kernel is compiled
    in ELF

    +      * The Hardware-HOWTO gives an overview of Linux-supported hardware

    +      * The Module mini-HOWTO contains still more info about kernel modules

    +      * The Kerneld mini-HOWTO talks about kerneld (the kernel daemon)'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'This list doesn''t even scratch the surface of all of the information that
    is out there. But it gives you a basic grounding and some understanding of what
    goes on in a kernel upgrade.


    5. Make sure that you have the current minimal requirements. The kernel upgrade
    will actually be done by Linux, using the resources available on your present
    Linux installation in the form of commands, libraries, and utilities. These resources
    are used to interactively tailor the installation of the new kernel and attach
    modules for the things that you might want. These utilities must be updated to
    the ones required for the new kernel, or you won''t be able to tell which of the
    things you encounter are actually bugs, should you encounter any. Linus Torvalds
    puts the information regarding which versions of these libraries and utilities
    will be required in the readme file included in the kernel distribution. But you''ll
    have to download the kernel distribution to get the readme file, so to get an
    idea of the things you need to consider, Table 16.1 is a summary of the present
    minimal requirements for software to run the 2.3 kernel. If you want to see what
    you''re currently running, the suggested command should tell you.


    # TABLE 16.1 The Minimal Required Versions of the Libraries and Utilities Necessary
    to Upgrade to the 2.3 Kernel


    | Requirement | Version | Command to Determine Version |

    |---|---|---|

    | Kernel modulits | 2.3.10 | insmod -V |

    | GNU C | 2.7.2.3 | gcc --version |

    | Binutils | 2.9.1.0.7 | ld -v |

    | Linux libc5<br>C Library | 5.4.46 | ls -l /lib/libc* |

    | Linux libc6<br>C Library | 2.0.7pre6 | ls -l /lib/libc* |

    | Dynamic Linker<br>(ld.so) | 1.9.9 | ldd --version or ldd -v |

    | Linux C++<br>Library | 2.7.2.8 | ls -l /usr/lib/libg++.so.*<br>or ls -l /usr/i486-linux
    libc5/lib/libg++.so.* |

    | Procps | 1.2. | ps -version |

    | Procinfo | 16 | procinfo -v |

    | Psmisc | 17 | pstree -V |'
