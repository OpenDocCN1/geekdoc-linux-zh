    ![](img/782ecfdc0b083a767896cc983e10427f_194_0.png)


    > If you email files, you can use gzip to create a compressed file. You can then
    attach this file to an email message. Your recipient should be able to uncompress
    the file no matter which operating system he or she is using.


    # Taking Extra Precautions


    One of the most important accessories you can buy for your computer is an uninterruptible
    power supply (UPS). A power failure or brownout can occur at any time, and when
    these occur, it is very possible that you could lose important data. Many of the
    available UPS systems provide surge protection and power buffering as well. Another
    key consideration for attaching a UPS to the computer is that the Linux operating
    system can be severely damaged if it is not shut down properly. For this reason,
    it is very important that you always use the shutdown command to turn off the
    Linux system.


    A UPS gives you anywhere from 5 to 15 minutes to shut down the system when the
    power goes out. This is great if you''re sitting behind the computer screen when
    the lights go out. In these instances, when you hear the UPS start beeping, log
    out of any user accounts and turn off the computer.


    What do you do when you''re away from the computer and you''ve left the computer
    running when the power goes down? Most UPSs are packaged with a serial cable and
    software that can be used to shut down the system when the UPS detects a reduction
    in power. If you use a UPS with the Windows operating system, you may already
    be using this setup. You can do the same thing with the Linux system. If the UPS
    did not come with software for Linux, read the "UPS" HOWTO for more information
    and then head over to metalab.unc.edu/pub/Linux/system/ups to find software that
    will run your UPS.


    ![](img/782ecfdc0b083a767896cc983e10427f_194_1.png)'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Task: Archiving Your Home Directory


    One directory that should be backed up frequently is your home directory. The
    files in your home directory are used most often and changed frequently. The easiest
    way to back up your home directory is with the tar command. The tar command combines
    several files into one file and saves the original directory structure. Here''s
    how to create an archive of your entire home directory:


    ![](img/782ecfdc0b083a767896cc983e10427f_195_0.png)


    > You may want to compress all the files in the directory before you create the
    archive. Use the gzip command to compress the files.


    +   1. Change to the directory that you want to archive. Use the cd command to
    move between directories.

    +   2. Place a floppy disk in the floppy disk drive.

    +   3. Use the tar command to create an archive on a set of floppies. Use the
    following command syntax:

    +   4. Remove the first disk, place the second floppy disk in the drive, and press
    Enter. The rest of the files in your home directory will be copied to the floppy
    disk. Depending on the number of files you have to back up, you may be prompted
    to replace the disk in the drive. When the archive is finished, you''ll be returned
    to the shell prompt.

    +   5. Label the backup disks with the disk number and the date.


    ```

    tar cvf /dev/fd0 /home/username

    ```


    This command tells tar to create a new archive, list the files on the screen as
    they are placed in the archive, and create the archive on the floppy disk drive.
    To make this example shorter, rusty is only going to archive a subdirectory within
    the home directory by typing this:


    ```

    tar cvf /dev/fd0 /home/rusty/letters

    ```


    As the files are copied to the floppy disk, each file is listed on the screen,
    as shown in Figure 10.3. When the first disk is full, you''ll be prompted to remove
    the floppy disk and place a second floppy disk in the drive.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# FIGURE 10.3


