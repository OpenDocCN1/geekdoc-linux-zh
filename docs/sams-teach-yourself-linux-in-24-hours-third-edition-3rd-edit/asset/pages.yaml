    # Going to the Movies


    Another fun evening''s entertainment is to go to the movies. Some popular movie
    formats include AVI, animated GIFs, and QuickTime animations. You''ll find a couple
    of players that will handle these formats bundled in your favorite Linux distribution.
    The most popular movie player is Kaction, shown in Figure 24.5.


    FIGURE 24.5

    The Kaction player plays movies on your home computer.


    ![](img/782ecfdc0b083a767896cc983e10427f_371_1.png)


