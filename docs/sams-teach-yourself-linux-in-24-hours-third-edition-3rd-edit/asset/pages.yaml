- pgno: 86
  md: '# Looking at File Types


    Within each directory, you''ll find a collection of files. A Linux file is a unique
    collection of data with a unique filename. The filename of a Linux file is a combination
    of its location in the filesystem relative to the root (base) directory, followed
    by the name assigned to it.


    ![](img/782ecfdc0b083a767896cc983e10427f_86_0.png)


    > it is possible to have more than one file in the filesystem with the same assigned
    name, but they cannot be stored in the same directory.


    Linux contains many files, each filled with different information. They serve
    different purposes, and as you learn more about Linux, you''ll learn more about
    the types of files and their use. To begin, we''re going to concentrate on three
    types of files with which you need to become familiar:


    +   - User data files are created by you and usually contain simple data made
    up of text and numbers. Files such as .txt files can be read with a text editor,
    but the more complex ones, such as those you create with graphics or spreadsheet
    programs, will require a viewer or interpreter program to display them.

    +   - System data files are used by the operating system to keep track of user
    passwords, logins, file permissions, and other things pertaining to keeping the
    system running smoothly. You will not be involved in these as a regular user,
    but if you are the system administrator charged with the responsibility of maintaining
    the system, you may need to edit these files from time to time.

    +   - Executable files contain the instructions that tell the computer what to
    do. These files are usually called programs. Whenever you give the computer a
    command to do something, you are telling it to follow the instructions in an executable
    file.


    # Task: Naming Files and Directories


    Any system configuration files that you may edit and any application programs
    that you may install are assigned names and a place where they live in the system.
    As you work with these applications, you''ll add new files to the filesystem for
    the letters,'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'reports, spreadsheets, Web pages, and pictures that you create. The first time
    you save a document, you need to select a directory in the filesystem in which
    to store the file and give the file a name. Here are a few steps to follow to
    help you store documents in the right place and name the files you create:


    ![](img/782ecfdc0b083a767896cc983e10427f_87_0.png)


    > The following rules apply to the naming of directories, because a directory
    is just seen as a file by the Linux filesystem.


    +   1. Determine the length of the filename. A filename can contain as many as
    256 characters. The filename is not just the name of the individual file; it includes
    the directory path that leads to the file. For example, the individual file named
    picture.gif that is located in the /home/rusty/images directory is 30 characters
    long. The actual filename is /home/rusty/images/picture.gif.

    +   2. Use appropriate characters when creating a filename. You can use any character
    in the alphabet (from A to Z, in both lowercase and uppercase letters) or any
    number from 0 to 9. You can also use dashes (-), underscores (_), and periods
    (.).


    ![](img/782ecfdc0b083a767896cc983e10427f_87_1.png)


    > Linux filenames are case sensitive. An uppercase A is not the same character
    as a lowercase a. A file named report99.txt is seen as a completely different
    file from a file named REPORT99.txt.


    +   3. Avoid keyboard characters that can cause problems in filenames. Do not
    put a space in the filename and do not use the following characters: < > ? * "
    { } [ ] ( ) ` ! | & $ ? -

    +   4. To create hidden files, begin the filename with a period (.). If you want
    to keep your diary file hidden, give the file a name similar to .diary.txt.

    +   5. Find the command line and change to your home directory. Type cd and press
    Enter to make sure you''re in your home directory.

    +   6. Create a file named practice. Type cat > practice and press Enter. The
    cursor will move to the next line on the screen. Type a few words and press Enter
    to move to the next line. Type a few words and press Ctrl+D to save and close
    the file. See Figure 4.5 for an example.

    +   7. Read the file you just created. Type cat practice and press Enter.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'FIGURE 4.5

    Use the cat command to create a simple text file.


    ![](img/782ecfdc0b083a767896cc983e10427f_88_0.png)


    # Spawning Processes


    Linux defines running programs, applications, utilities, and daemons (servers)
    as processes. As mentioned earlier, Linux maintains a virtual filesystem in the
    /proc directory, where it maintains pointers to all the ongoing processes in the
    system. Linux is a true multitasking operating system, meaning it can do more
    than one thing at a time. To accomplish all this, the Linux kernel just calls
    up a few daemons, and the daemons take over and perform the job, doing whatever
    is necessary.


    It isn''t quite that simple, but here is a real-world example of the kernel calling
    up the oldest daemon to get a job done. Suppose you have a document that you want
    to print, so you send a print command to the kernel. The kernel doesn''t know
    enough about printing to do the printing itself, so it calls lpd, the line printer
    daemon.


    > The line printer daemon (lpd) is the oldest daemon. In the very beginning of
    the computer age, the only output from computers was to a loud, obnoxious device
    called a line printer. The modern line printer daemon is much more sophisticated,
    but it still has the same name.


    The lpd takes the print job from the kernel and spawns (forks is another term
    often used). This just means that it makes a copy of itself. Then the lpd gives
    the job to it''s clone, along with all the details about which printer and where
    and when, and sends it'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'off to do the printing. The original lp daemon goes back to hanging out close
    to the kernel in case it gets called again. This allows the kernel to use the
    lp daemon to run many print jobs at once on many different kinds of printers—a
    real example of true multitasking.


    # Task: Reading the Kernel Boot Messages File


    Several system log files will help you find out what the operating system is doing.
    These files are usually found in the /var/log directory. One file that you should
    look at is the dmesg file. This file contains all the messages from the kernel
    during the boot process. Here''s how to view system log files:


    +   1. Log in as the superuser. Type su and press Enter. You will be prompted
    for the password for the root account.

    +   2. Read the messages that scroll by on the screen when you first boot the
    Linux operating system. Find the command line and type less /var/log/dmesg and
    press Enter. Your screen will look similar to the one shown in Figure 4.6.


    FIGURE 4.6

    Various messages appear on the screen while the operating system performs the
    boot process.


    ![](img/782ecfdc0b083a767896cc983e10427f_89_0.png)


    3. Scroll through the kernel messages. Press the spacebar to move down one screen
    at a time. Press the J key to move down one line at a time. Press Ctrl+B to move
    up one screen at a time.'
  merge: -1
  img_proc: true
