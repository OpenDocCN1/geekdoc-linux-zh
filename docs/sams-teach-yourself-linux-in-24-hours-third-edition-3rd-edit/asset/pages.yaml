- pgno: 64
  md: '![](img/782ecfdc0b083a767896cc983e10427f_64_0.png)


    # Hour 3


    # Security Is Job 1


    Security is so much an integral part of Linux and all UNIX operating systems that
    its built-in system of file access and permissions forms the basis for controlling
    every file in the system. The UNIX operating systems see everything as a file,
    and so security has a material part in every function and every action taken within
    the system.


    The inner workings of the security system are covered throughout the book. Security
    is an all-pervading issue and you will be visiting it quite often. As you work
    with Linux, keep in mind that prevention is the name of the game where security
    is concerned.


    In this hour, you will


    +   - Maintain the physical security of your computer equipment, software programs,
    and data

    +   - Restrict access to the system by assigning passwords, and perform system
    administration tasks from the superuser account

    +   - Create user and group accounts to share files, and assign permissions to
    shared files

    +   - Keep track of system usage, and schedule regular system and file maintenance'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Locking Up the System


    Certainly one of the more obvious means of securing your equipment and data is
    just to lock them up in a location to which only you have the key. This might
    seem like an oversimplification of the problem, but in reality, maintaining the
    physical security of your equipment is very important. The investment in computers
    and peripherals can be quite significant for a home office or small business.
    Furthermore, this doesn''t take into account the cost of the software or the value
    of your data.


    Where and how the computer will be used are the determining factors in deciding
    how it should be protected. This might vary so much that it runs the gamut from
    doing nothing for a game computer you have at home, to permanently super-gluing
    the computer you make available for customer use right to the desk it''s sitting
    on. You will have to decide where you fit. After you do that, you can determine
    what you need to do to physically secure your equipment in a way that meets the
    needs of your particular situation.


    # Creating Backup and Disaster Plans


    No one wants to turn on the computer in the morning only to find corrupted programs
    and missing data. It could be an uncomfortable situation if you find the big report
    for the big boss (you know, the report that you were so happy about because you
    had just gotten it finished on time) all scrambled into gibberish or just plain
    missing. And, it could get worse.


    Since the advent of the computer age, computer users have searched for some protection
    from “The Case of the Missing File.” No one appreciates this kind of surprise.
    What you could do to recover from a disastrous loss like this would depend entirely
    on what assets you had put safely aside that could be brought back to restore
    (to whatever extent) what was lost.


    # Backing Up the Filesystem


    You might have experienced, or at least seen someone else experience, some major
    loss of computing capability and important data. These accidents have myriad causes—everything
    from unexpected hardware failures to inadvertent mistaken deletes. Looking back
    at any experience with good hindsight can make a good teaching tool, but you need
    foresight to keep yourself prepared for most disasters. No one can predict the
    future, but you can devise a plan, a strategy for dealing with it in sensible
    ways.


    Planning and implementing good backup practices can take a lot of the worry out
    of managing a multi-user system. It can also provide a near-foolproof method for
    seeing'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'that at least some of your data (everything up to the last scheduled backup)
    is not lost. Obviously, the sooner you develop such a plan and get it in motion
    the safer your situation becomes.


    ![](img/782ecfdc0b083a767896cc983e10427f_66_0.png)


    > You''ll learn how to create and implement a backup plan in Hour 10, "Backing
    Up and Restoring the Filesystem."


    # Keeping Files Secure


    Anyone at all familiar with computers and their use knows that occasionally files
    just simply get lost. There is a long list of reasons why this might happen: accidental
    deletes, hardware failures, pilot error, software bugs, termites, cockroaches,
    and mysterious malicious alien hackers to name a few. But there is some relief.
    Tools are built into the security system that can help you deal with trouble.
    These tools can be used to protect your files from all the threats we just listed
    and many more.


    # Planning for Fire and Flood


    The first consideration for any disaster management and recovery plan is to decide
    what you can do to prevent every possible realistic threat to your system. Obviously,
    there are some broad differences between systems and situations that require special
    consideration. It is a truism that the more secure you make something, the more
    inconvenient it becomes to use. With that in mind, you can see that a very important
    part of this planning exercise is determining just how far you, and your users,
    will go in tolerating the inconveniences imposed by security measures taken to
    ensure what you want.


    Plan for the worst: it might happen anyway. When you are deciding what to do about
    backups, you might try imagining what you would do if the building burned down
    overnight. Picture yourself having to get the business back up and running without
    anything but the data you backed up and stuck in the fireproof safe the night
    before. Think about it that way and see whether that doesn''t stimulate some good
    ideas for you.


    # Task: Creating a Security Checklist


    Because so many people depend on a computer to run their business and personal
    affairs, it is important to think about the computer''s security and safety. Here
    are a few questions you need to answer to help you start thinking about a good
    sound security plan:'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   1. Get out your Linux diary and start a section called "Security Plan."
    You''ll use this section to answer a few basic questions that will get you started
    toward keeping your computer and data safe.

    +   2. Is the computer located in a safe place? Make sure that the computer is
    safe from environmental hazards such as dust, heat, and humidity.

    +   3. Is the computer available to anyone who walks by? You might not want everyone
    to use the computer. If this is the case, put the computer where only authorized
    users have access to it.

    +   4. Does your homeowner/renter/business insurance policy cover the replacement
    of your computer? You should also find out whether the insurance policy would
    reimburse you for any lost time due to the disappearance of the machine.

    +   5. Who will be using the computer? Each person who will be using the Linux
    system needs to be assigned a user account. Make a list of those people who need
    access to the machine.

    +   6. Will any of the system users need to share files? If so, decide who needs
    to share files with whom and how each person will need to use the files.

    +   7. Do you have a system for backing up important files? This is a definite
    "must do" item. Many work hours, dollars, and clients have been lost because files
    have been accidentally erased or a system crashed.


    Remember that this checklist is just a beginning. As you progress through this
    hour and the hours that follow, think about your security plan and add new ideas
    along the way.


    # Keeping the Superuser Safe


    The root account belongs to the system superuser, which is also the system administrator.
    The person logged in to the root account has access to the entire system, including
    the accounts of other users on the system. A hacker breaking into your system
    really wants root access to be able to do whatever he wants. The necessity of
    keeping the root account sacrosanct from unauthorized persons and users who perhaps
    blunder in by accident cannot be overstated. If the root account is compromised,
    the whole system can be lost.


    One rule of thumb that you should always follow is to use the superuser account
    only when performing system administration tasks. System administration tasks
    include making system configuration changes, such as adding new hardware or adding
    users to the system.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '> The key to maintaining a secure root account is good password management.
    You''ll also want to create an unprivileged user account in which to work. To
    learn more about these in detail, look in Hour 12, "Sharing Files with Other Users
    on the System."


    # Performing Administrative Tasks as Superuser


    One of the joys of Linux is the great opportunity you have to learn to be your
    own system administrator. In fact, if it is your Linux system, you will have to
    be your own system administrator. This is perhaps more technical involvement with
    your operating system than you might have experienced in the past. This might
    be especially true for those of you with previous experience only with the Apple
    Macintosh and Microsoft Windows operating systems. However, Linux is a multitasking,
    multi-user operating system capable of serving the needs of multiple jobs and
    multiple users simultaneously. Because of this broad world of flexibility and
    power, there exists a profound need for control and security of operations. The
    person who has the root or superuser account password may change anything in the
    system. The key is to be able to change things that need to be changed without
    compromising the integrity of the operating system or the autonomy of the users
    in their own accounts.


    Linux is completely configurable. That means you can modify the operating system
    to accommodate different hardware or special tasks, and that you may tune it to
    perform better with particular applications. You can also change the operating
    system to suit a particular user''s needs or to serve the needs of a group or
    special project. As the superuser, you have the job of maintaining the system
    and keeping up on everything that must be done to maintain and upgrade equipment
    and software. You are also the one who installs the software, adds new users,
    backs up the system, and manages the workload. You will perform many different
    jobs while working with Linux and you will wear several hats. Last but not least
    (and on top of all the things we just hinted at), you are the person who provides
    what the users want or need.


    > Linux has built-in tools to help you manage the system. Hour 9, "Hooking Up
    Hardware Devices," shows you what is involved when you want to add a new hard
    drive. To make sure that the system is operating properly and that there is enough
    storage space, turn to Hour 14, "System Maintenance." When you want to try a new
    software program, look in Hour 15, "Installing Software."'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Working Day to Day as a Regular User


    So far, you''ve seen the many jobs of the systems administrator and the needs
    of a system with multiple users. Your Linux system might well be just yours and
    have no other users. You might want to tailor the machine completely to your needs
    and desires. Even if you are the only user, you should set up a user account just
    for yourself. Log in as the superuser only to perform system administration tasks.
    The security and welfare of the system will be best served if the superuser''s
    extraordinary power and accesses are simply reserved until they are called for
    by need.


    # Restricting Access to the System


    There are many reasons for restricting access to your system. Unauthorized users
    can wreck a lot of hard work and destroy valuable data even if they have no evil
    intent. Then, of course, there are the ones who do have bad intent that must be
    defended against. The method for restricting user access to the computer in Linux
    is a system of user-assigned passwords. These passwords allow user access to the
    home directory of the individual user. This password security is coupled with
    a system of file access permissions describing who may access the file, how they
    may access it, and what they may do with it. These passwords and file permissions
    form the foundation for security management in Linux.


    ![](img/782ecfdc0b083a767896cc983e10427f_69_0.png)


    > In Hour 12, you''ll learn about file permissions and how to use them to protect
    your files from unauthorized access.


    # Using Shadow Password Files


    Nearly all UNIX systems support what are called shadow password files. These files
    are not accessible by anyone except the superuser and they contain the passwords
    of all the users on the system in encrypted form. Linux uses the freely available
    Shadow package to provide this service. The Shadow package also accommodates password
    aging and some user account utilities.


    ![](img/782ecfdc0b083a767896cc983e10427f_69_1.png)


    > You''ll learn how to use shadow passwords in Hour 12.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Task: Creating a Strategy for Choosing Passwords


    If they are properly selected and frequently changed, passwords can be a major
    deterrent to someone trying to obtain unauthorized access to your account. Here
    are the guidelines that you should follow when choosing passwords for the superuser
    and unprivileged user account:


    +   1. Use a mix of uppercase and lowercase letters, numbers, and symbols.

    +   2. Do not use dictionary words and, in particular, do not use English words.
    If you can find the word in a dictionary, don''t use it as a password.


    ![](img/782ecfdc0b083a767896cc983e10427f_70_0.png)


    > Passwords should not be someone''s name, either. Don''t use the names of favorite
    pets, old lovers (or new ones), friends, enemies, birthdays, or phone numbers.
    It has been mentioned that it is really a simple matter to determine your great-grandmother''s
    maiden name on either your father or mother''s side of the family.


    +   3. Passwords must be easy to remember and quick to type. They must also be
    hard to figure out.

    +   4. Passwords should be at least eight characters in length.

    +   5. Passwords can be made to appear to be words, if that makes them easier
    to remember—the password 2hfArEe (tooth fairy) is a good example, but it isn''t
    a very good password anymore, now that it''s been put in this book.

    +   6. Test your passwords before you use them. Type the following on the command
    line:

    +      echo password | ispell -l

    +      Replace the word password with the password you chose. Figure 3.1 shows
    a few attempts at selecting good passwords.

    +   7. Educate those people who will be using the system on how to select a sound
    and secure password.


    ```

    echo password | ispell -l

    ```'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'FIGURE 3.1

    Run the spell checker to see whether words are in the Linux online dictionary.


    Bad password, proper name


    Bad password, too few letters


    ![](img/782ecfdc0b083a767896cc983e10427f_71_0.png)


    Bad password, dictionary word


    Good password, not found in dictionary


    # Designing Workgroups for File Sharing


    Users working on a Linux system retain privacy, autonomy, and separate accounts
    for their files without other users having access to them. A special consideration
    must be made to allow users to share files with other users. The method for doing
    this is to place the users who need access to the files in a special group, and
    then place the files that you want to share in a directory to which only the group
    members are permitted access. Setting the file read, write, and execute permissions
    will control access to the files by the group members when they access the directory.
    The file permissions can be set to allow the group members full read, write, and
    execute privileges, or perhaps to allow some lesser access to the files, such
    as read only.


    # Assigning Users to Appropriate Groups


    The assignment of users to groups and the subsequent assignment of file access
    permissions form an important part of the way security operates in Linux. The
    assignment of members to groups needs to be carefully thought out. Workgroup computing
    projects are a function of a group process. The members of that group have special
    communication and computing needs that might endure through the life of the project.
    That''s pretty straightforward, but what complicates matters is that any one individual
    might be working on several projects at once.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'All the employees in a small business might be organized into a single workgroup.
    Even if there are only a few employees, there might be more than one project going
    on with different project members. This can make assignment confusing. One way
    to deal with this is to organize all your workgroups around projects. If done
    this way, you can facilitate the sharing of files, reports, and messages. All
    this needs to be done in a way that addresses the needs and enhances the productivity
    of project members.


    # Using File Permissions to Limit File Access


    Each file in the system can be configured to discriminately permit or refuse access
    or actions. You might have a list of things that you want only members of a certain
    group to see and read, but you don''t want them to be able to change the things
    on the list or to add new things. You can accomplish this by controlling the user''s
    file access privileges that are configured for the file.


    # Controlling Access to User Accounts


    Controlling access to user accounts is done through password authentication. Because
    this permits entry to the system and the user''s private files, it is very important
    to maintain the integrity of the user''s passwords for system security. Selecting
    good passwords (as described earlier) and changing them on a regular basis is
    always a good idea.


    In your system administrator capacity, you might have to replace lost or forgotten
    passwords (or compromised ones). There might be times when you want to restrict
    access to a user''s account. Maybe the user will be on a leave of absence and
    you want to temporarily deny access to the computer and user account, but retain
    the user''s account and files. These and other actions can be easily managed through
    the password system.


    # Limiting Access to System Devices


    Linux treats everything as a file and that includes the hardware. To make this
    a little easier to understand, think of gaining access to a printer as gaining
    access to the printer''s driver file. Now the way that you can apply the same
    access and privilege controls to system devices as you can to data files becomes
    much more apparent.


    > You''ll learn how to install a printer in Hour 11, "Printing Files." To configure
    a modem so that you can connect to the Internet, see Hour 21, "Connecting to the
    Internet."


    ![](img/782ecfdc0b083a767896cc983e10427f_72_0.png)


    ![](img/782ecfdc0b083a767896cc983e10427f_72_1.png)'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Monitoring the System on a Regular Basis


    There is no substitute for paying attention. The security of your system is entirely
    dependent on how well you monitor the system and how diligent you are when adding
    new users, installing new software, and upgrading old equipment. The allocation
    of system resources should be the best for managing the system. In a multi-user
    system, this means disk space allocations for each user, backup requirements for
    user''s files, printer priorities, and many other considerations. In a workgroup,
    resource allocations must be monitored to fit the needs of the group and best
    benefit the project.


    There are built-in monitors that will help you keep track of the operating system''s
    activities. You can monitor the way that users make use of resources, and you
    can use that information to help you schedule maintenance and necessary system
    downtimes.


    ![](img/782ecfdc0b083a767896cc983e10427f_73_0.png)


    > You''ll learn how to manage files sent to the printer in Hour 11. You''ll learn
    how to write small programs that run system maintenance tasks at a time you specify
    in Hour 17, "Automating System Administration Tasks."


    # Checking CPU Activity


    Through the aid of one or more small monitoring applets available with most GUIs,
    or by working with commands on the command-line, it is possible to obtain information
    about the system''s resources. The information about CPU usage is helpful in deciding
    whether you can run additional processes on the system at peak times. It enables
    you to see when peak times occur, and how much of a load is placed on the CPU
    by adding more applications. Some of the more CPU-intensive applications can be
    saved and run when the CPU load is not at its peak.


    ![](img/782ecfdc0b083a767896cc983e10427f_73_1.png)


    > Running processes can be displayed with the top command. The top command is
    covered in Hour 13, "Working with Processes."


    # Tracking User Activity on the System


    By looking at the login statistics for users on the system, information can be
    compiled about user requirements for system resources at peak or off-peak times.
    With this information, management decisions can be made about allocations and
    scheduling. Something can finally be done about user Marilyn''s perpetual hogging
    of the printer at'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'peak times to print her email messages. Marilyn collects obscure recipes that
    she greps from the responses to her AOL ad and pipes through her Hotmail account.
    After these gems in the raw are printed, she takes them home as drafts to edit
    them into her forthcoming cookbook. User Marilyn''s offhand use of Internet and
    network access might present other security problems that are not as apparent
    or irritating as her use of the printer, but are potentially much more damaging
    to the system. It is necessary, if you are to maintain the best utilization of
    the system, to frequently look in on how it is being used and who is doing the
    using.


    ![](img/782ecfdc0b083a767896cc983e10427f_74_0.png)


    > Displaying a list of users who are logged into the system and communicating
    with those users is covered in Hour 20, "Talking to Users over a Network." Configuring
    electronic mail and reading newsgroup messages is found in Hour 22, "Merging onto
    the Information Superhighway."


    # Schedule Maintenance Tasks


    An important part of your responsibilities as system administrator is to maintain
    a secure and uncluttered system. To do this effectively, actions must regularly
    take place regarding file system backups and purges and other operating system
    maintenance tasks. Regular updates must be made to software and hardware assets
    to preserve their currency and value. The security of your system is dependent
    on how well your users follow the security guidelines you establish, and how well
    you schedule the maintenance that you need to perform to keep the system and hardware
    working at peak levels.


    # Watching Network and Internet Access


    User Marilyn, who was introduced earlier, might have been a little exaggerated.
    People sometimes do things without enough forethought, and sometimes they fall
    into systems of behavior that are not proper uses of the system assets or the
    boss''s time.


    In this world of instant communication, a chat room might seem to be a better
    method than an email message when closing the deal of the century. However, that
    is not often true. "Live" network time consumes resources on the computer and
    on the corporate network or the Internet. This method does not always give the
    respondents time enough to carefully consider their actions.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Summary


    During the past hour, you learned how important it is to be security conscious
    when working with the Linux operating system. Remember, security plays a major
    role in keeping your system and data safe. It means that the chances of your hardware
    being stolen or data being lost in a system crash are minimized. You also learned
    that many users could share the same system, yet each user has space on the system
    in which to store files that other users cannot reach. Once again, security—this
    time in the form of passwords—keeps outsiders from accessing users'' accounts.
    File sharing also involves security. Users may be given complete access to a file,
    restricted to read-only access, or prohibited from any type of access. As you
    progress through the hours to come, always try to think of ways to keep your investment—in
    computer equipment, data, and time—safe and secure.


    # Q&A


    Q Besides protecting the operating system with regular backups, passwords, and
    file permissions, is there anything else that can be done to keep the computer
    system safe?


    A It is always a good idea to keep the computer in a clean environment and away
    from static electricity. Dirt and dust can be a computer''s worst enemy. These
    particles build up on the electronic parts and can cause your computer to overheat
    or short out.


    If someone who is unfamiliar with the system uses the computer, take time to properly
    train him so that he knows how to access his user account and where to save his
    files.


    Another good idea is to plug your computer into an uninterruptible power supply
    (UPS). A UPS protects your computer during power surges and electrical storms,
    and protects your data by giving you time after a power outage to save your work
    and safely shut off the system.


    Q Several times during the hour, it was mentioned that a system administrator
    is needed to do the job of maintaining the computer system. Please explain the
    job of the system administrator a bit more.


    A The system administrator is responsible for keeping a computer system up and
    running. The job of the system administrator begins with planning the system and
    includes everything from setting up the computer and installing the operating
    system and application software, to keeping the system running, planning for upgrades,
    and restoring the system in case of a loss of equipment or data.'
  merge: -1
  img_proc: true
- pgno: 76
  md: "The system administrator performs several jobs on a regular basis. A routine\
    \ should be established for these tasks. There are always new users to add to\
    \ the system, old data to remove from hard drives, software programs to upgrade,\
    \ new games to install, and backups to store in a safe place.\n\nThe system administrator\
    \ also needs to make sure that the system is running at optimal performance. If\
    \ several users share the system at the same time, traffic flow must be monitored.\
    \ The system administrator also needs to make sure that there is plenty of hard\
    \ drive space for user files, system files, and program files.\n\nAnd, most important,\
    \ the system administrator is the security force for the system. The system administrator\
    \ is responsible for educating users on the proper use of the system, informing\
    \ them about how to devise a proper password, and reminding them to change their\
    \ password on a regular schedule.\n\n# Workshop\n\nKeeping your computer system\
    \ and your data safe is not an easy task. There's a lot to consider before you\
    \ allow too many people access to the computer, and let just anyone install any\
    \ old program on the system. Before you begin to map out your system security\
    \ plan, review the information covered in this hour, and then decide whether you\
    \ need to keep your computer under lock and key. You are encouraged to work through\
    \ the following exercises to help you retain what you have learned in this lesson.\
    \ You should complete these exercises before proceeding to the next lesson.\n\n\
    # Quiz\n\n+   1. Why is it so important to develop a plan for backing up important\
    \ files on a regular basis?\n+   \n+   You never know when disaster will strike.\
    \ It might come in the form of a hard drive failure, or it might be something\
    \ beyond your control, such as a power failure or flood. By backing up your files,\
    \ you have a second copy of a file that has been stored away from the danger zone.\
    \ Planning and implementing a good backup schedule takes the worry out of managing\
    \ a number of users and all their data files.\n+   \n+   2. Who is the superuser?\n\
    +   \n+   The superuser is also known as the root account. The person logged in\
    \ as superuser has access to the entire system. This means that person can access\
    \ any file or device on the system. The superuser account should be used only\
