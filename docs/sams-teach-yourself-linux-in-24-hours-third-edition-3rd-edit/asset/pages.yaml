    There are a number of shells available for Linux and most Linux distributions
    provide a collection of the most commonly used ones. Some of these shells evolved
    out of the UNIX operating system, and have both a commercial and Open Source version.
    The Bourne shell (sh) is the oldest UNIX shell program. The default shell on all
    Linux distributions is the GNU Bourne again shell (bash). Shells available include
    the open source versions of the C shell (tcsh), the K shell (pdksh), and a number
    of others.


    ![](img/782ecfdc0b083a767896cc983e10427f_100_1.png)


    > The shells from which you can choose during the installation depend on which
    Linux distribution you chose and how it was installed. In addition to the standard
    shells, you''ll find the public domain version of Dave Korn''s Korn shell (pdksh)
    in the Red Hat distribution. The Z shell (zsh), the A shell (ash), and some others
    that are specific to particular Linux distributions are also available.


    The most widely distributed UNIX shell is the Bourne shell (sh). It is probably
    installed on every existing UNIX system. Many of the newer shells are backward
    compatible with the Bourne shell. The GNU Bourne again shell (bash), written by
    Brian Fox and Chet Ramey, is the GNU/Linux version of the sh shell. It is a feature-enriched
    version with many of the features found in the C shell (csh) and the Korn shell
    (ksh). It is completely backward compatible with sh.'
