    # Summary


    During the past hour, you learned how to use the rpm command, along with the RpmDrake
    front end, to manage applications. With these tools, you can find out what programs
    are installed on the system, delete any of these programs that you don''t use
    or need, and add any new applications that you find useful. The majority of the
    software that you''ll find on the different Linux distributions, and packages
    that you can download from the Internet, is in the RPM format. This means that
    no matter where you get the software, you can install it on your system.


    # Q&A


    Q Where can I learn more about using RPM?


    A The first place to look is in the manual pages. Type `man rpm` and press Enter.
    You''ll find that the rpm command has many more options than we discussed during
    this hour. You might also want to read a few of the Linux HOWTOs. The RPM HOWTO
    tells you how to install the RPM system on your computer (if it is not already
    installed), how to use RPM, how to fix problems caused by corrupt or'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'missing program files, and how to build an RPM file (that is, if you''re the
    programming type and want to write programs for Linux).


    Another source of information is the RPM Web site at www.rpm.org.


    Q Is all the software available for the Linux operating system in the RPM format?


    A No, you''ll find other formats that can be installed on your system. Sometimes
    you will see binary distributions, which use the gzip or compressed tar file format.
    Binary distributions are ready to use. All you need to do is unpack the archive
    and the files will be placed in the proper location in your system.


    Another format that you''ll see is a source distribution. With a source distribution,
    you''ll need to issue commands to compile the software and then install it on
    the system. To use a source distribution, unpack the source code files (with the
    tar command) and place them in a subdirectory of the /var/src directory. Next,
    browse through the files and look for a README file or any other installation
    notes. The README file will give you further instructions on how to compile the
    specific source code and how to install the program after it is compiled.


    The other format that you''ll run across is the DEB distribution. These files
    are intended for the Debian Linux operating system. Quite a number of good applications
    are available as DEB packages. If you use KPackage to install software, you''ll
    find that KPackage can handle DEB files.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    # Quiz


    +   1. What is a package manager and which ones will you find on your system?


    A package manager enables you to view the applications installed on your system,
    display a description of an application, remove applications from the system,
    and add new applications to the system. The base of the package manager system
    is the rpm command. There are several different front ends to the rpm command
    that enable you to manage applications from a graphical user interface. Linux-Mandrake
    uses RPMDrake to add and delete packages from the system. The KDE desktop contains
    a utility called KPackage that makes it easy to install software. Other Linux
    distributions might have developed their own front ends to the rpm command.'
  merge: -1
  img_proc: true
