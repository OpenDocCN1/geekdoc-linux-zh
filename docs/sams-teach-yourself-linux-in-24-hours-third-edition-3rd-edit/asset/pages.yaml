    # Task: Setting the System Clock


    When you installed Linux, you told the installation program in which time zone
    you live. This is the information that the Linux kernel uses to display the time
    using the Hardware Clock. If you set the computer''s clock correctly during the
    installation, chances are that you''re staying on time. What do you do if your
    time is wrong? Here are a few easy tricks you can use to reset the time:


    +   1. Log into the root account. Only the superuser can change the system time.

    +   2. Check the time. Type hwclock and press Enter. The time displays in the
    following format:

    +      Sat Jul 1 19:58:28 2000 -0.281406 seconds

    +      This example shows the current date as July 1, 2000 and the current time
    of 7:58 p.m. The date is correct, but the time displayed by the hardware clock
    is incorrect. Oops!

    +   3. Set the clock so that it matches the time stored in the BIOS clock. Type
    hwclock -w and press Enter. The clock is now set so that it matches the BIOS clock.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '4. Check the time again. Type hwclock and press Enter. The time kept by the
    hardware clock is now set to the time stored in the BIOS clock:

    Sat Jul 1 10:00:37 2000 -0.693272 seconds

    The time that displays in this example is almost the correct time, at 10 a.m.
    on Saturday, July 1, 2000. The clock is just a few minutes off.


    5. If the time is still wrong, set the time manually. Use the following command
    syntax

    hwclock --set --date="MM/DD/YY HH:MM:SS"

    For example, to set the time to 10:15 a.m. on July 1, 2000, type hwclock --set
    --date="07/01/00 10:15:00" and press Enter.


    6. Check the time again. Type hwclock and press Enter.


    # Summary


    You now have a few tools under your belt to help you manage your hard drive space.
    In the past hour, you learned how to determine which files and users were using
    more than their fair share of disk space. You also learned a few tricks for keeping
    free space at a desirable level.


    # Q&A


    Q How do I scan my hard drive for errors?

    A Every time you boot the Linux operating system, the startup process automatically
    checks the hard drive for errors with the fsck command. If you want to use the
    fsck command, you need to unmount the filesystem that you want to check before
    running this command. To learn more about the fsck command, read the manual page
    (type man fsck at the shell prompt).


    Q If I limit the amount of disk space that is available to an individual user,
    is there any way I can notify him or her?

    A You can always tell users that you are limiting the amount of space available
    to them to store files and let them know what limits you set. The users can then
    use the du command to see how close they are coming to their limit. Another way
    is to use the edquota -t command. This allows you to automatically notify users
    that they have used up their disk space quota. The edquota -t command opens a
    file in the vi text editor, and you will need to specify the number of days the
    users can go over their limit. After the grace period, users will not be able
    to add any new files to their home directories.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '**Q** In addition to the hwclock command, are there any other tools or utilities
    that I can use to change the time displayed by the Linux clock?


    **A** Several graphical tools are available that can reset the time. If you want
    to go through the same time-setting process used during the initial Linux installation,
    use the `timeconfig` command. This command allows you to change your time zone.
    You may also find the Time Machine, which provides an easy way to change the time
    and date. To find the Time Machine, type `timetool` at the shell prompt.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    # Quiz


    1. Which commands can you use to keep track of disk space usage?


    The `df` and `du` commands display filesystem statistics. The `df` command lists
    the amount of free disk space for each filesystem along with the size of the partition,
    the amount and percentage of used space, and the mount point. The `du` command
    displays the amount of room individual files and directories take up within the
    filesystem.


    2. What are some of the strategies you can implement to create more room on the
    hard drive?


    Compress files that are not being used. Delete or archive files that you no longer
    need. Delete the contents of temporary directories. Learn how to manage system
    log files. Delete backup files that are no longer needed and uninstall applications
    that are not being used.


    3. What command can you use to find files that have not been accessed during a
    specified time period?


    Use the `find` command with the `-atime` command option to list files that have
    been sitting idle for a specific number of days. You can also use the `find` command
    to locate backup files created by the different applications used.


    4. What is the best way to keep system users from taking up too much disk space?


    You could just have a short talk with your users about keeping their home directories
    as small as possible by compressing files and archiving unneeded files. However,
    a better way is to set disk quotas on their home directories. By setting quotas,
    you can give the users a range within which they can work, and when they surpass
    this range, Linux will not allow them to store any more files in their home directories.'
  merge: -1
  img_proc: true
