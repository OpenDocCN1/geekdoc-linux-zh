  md: '# Dedication


    *To Marc and Dawn*


    # Acknowledgments


    It is always a pleasure working with everyone at Macmillan USA. Their support
    and assistance made this book possible. We especially want to thank Neil Rowe
    for introducing us to Shelley Johnston. Our thanks go to Shelley for providing
    us with the opportunity to write this book. We also want to thank Laura Williams
    for her insight and help with the book''s development, Jason Byars for checking
    our technical accuracy, Mike Henry for doing such a great job of cleaning up our
    words, and Paul Schneider for managing the project to its completion.


    Of course, this book would not have been possible without the support of our friends.
    Many, many thanks to Henry and Maisie for keeping a roof over our heads and fresh
    fish on the table, to Mike for providing a television and meals so that we could
    chill out, and to Chase and the gang for the morning wake up calls.


    Thank you everyone.'
