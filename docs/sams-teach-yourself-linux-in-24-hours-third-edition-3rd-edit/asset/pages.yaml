- pgno: 134
  md: '# Hour 7


    # Moving Around the Filesystem


    All operating systems share a common characteristic: They use a directory structure
    to organize files. The directories are structured like a tree. The primary directory,
    which is the base directory and the one from which all other directories branch,
    is the root directory. All other directories, which grow out of the root directory,
    are called subdirectories. Within these directories and subdirectories, you''ll
    find applications and utilities, device and system files, and data files.


    The most basic task that you''ll perform is file management. File management includes
    moving from directory to directory, creating files, organizing files into directories,
    moving files from one location to another, and deleting unnecessary files.


    ![](img/782ecfdc0b083a767896cc983e10427f_134_0.png)'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'In this hour, you will


    +   - Work with files by changing between directories and displaying the list
    of files contained in a directory

    +   - Add and delete directories and files in your user account

    +   - Create files and view the file properties

    +   - Copy and rename files


    # Exploring the Home Directory


    In Hour 4, “Understanding the Linux Operating System,” you were introduced to
    the basic structure of the filesystem. You saw how files fit into directories,
    and how directories fit within other directories. When users are assigned accounts
    on the system, they are also allocated space within the /home directory in which
    to store their personal files. If a user has the login name of rusty, that user’s
    personal files are stored in /home/rusty. This is known as the home directory
    and is the directory in which the user is working after logging in to his account.
    From this directory, the user can create subdirectories in which to organize files,
    create new files, modify these files, and delete unneeded files. Only the user,
    those authorized by the user, and the root account, may access files in the user’s
    home directory.


    When you first log in to your user account, the shell prompt looks something like
    this (that is, if your username is rusty):


    ```

    [rusty@localhost rusty]$

    ```


    Cool, but where does that leave you in the filesystem? Type pwd and press Enter.
    The response appears on the following line on the screen and looks like this for
    the user named rusty:


    ```

    /home/rusty

    ```


    Notice that the shell prompt appears on the next line. It’s waiting for you to
    give it another command. That’s good, because this is a good time to explore your
    home directory.'
  merge: -1
  img_proc: true
