- pgno: 129
  md: '# Task: Clearing the Terminal Screen Before Leaving Your Desk


    You’ll notice that if you do a lot of work on the terminal screen, there’s plenty
    of text at the top of the screen and the shell prompt is all the way at the bottom.
    What do you do when you don’t want to look at the clutter? How do you start with
    a fresh screen if you want to perform a different task and you don’t want remnants
    of the last task lurking around? Where can you hide your work when someone stops
    by your desk for a chat? Whenever you need a blank screen, use the clear command.


    When you are finished working at your computer, it is a good idea to clear the
    screen of all text. You might also want to log out of your user account. By clearing
    the screen, no one can see what you were working on. By logging out of your account,
    your personal files are locked safely away and other users on the system cannot
    read or modify your files unless they have permission.


    Here’s how to clear the screen and make your user account and files safe:


    +   1. Whenever you want to erase the screen, type clear and press Enter. The
    text that appeared on the screen will be wiped out and all that will remain is
    a shell prompt (which is now at the top of the screen).

    +   2. Type logout and press Enter. Your user account will be shut down so that
    no one will be able to access your account or files.

    +   3. If you have an open user account on a second virtual terminal, switch to
    that terminal (by pressing the Alt key and the function key for the terminal)
    and log out.


    # Summary


    In this hour, you learned a lot about commands and working on the command line,
    but you didn’t get much practice. Before you embark on your command-line journey,
    it is important that you understand what commands are available to you and how
    to use those commands efficiently. You’ll get more practice working with commands
    as you progress through the rest of this book. You’ll see how commands, command
    options, and redirection work to construct a command that performs a job just
    the way you want it done. Hopefully, by the end of this hour, some of the mystery
    that surrounds command line use has been cleared away and you can approach the
    command line with confidence.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Q&A


    Q When I''m working with several user accounts on a number of different terminals,
    how can I quickly find out which of my user accounts are logged in?


    A Try the who command. If you want to know which user account you are currently
    in, type who am i.


    Q In addition to the manual and info pages, are there any other types of documentation
    that I might find hidden away in the Linux filesystem?


    A The HOWTOs (found in the /usr/doc/HOWTO directory) and the FAQS (stored in /usr/doc/FAQ)
    are two sources that you should definitely know about.


    Q Early in the hour, there''s a list of frequently used commands. Is there a list
    of seldom-used commands that I can try out for a little fun and enjoyment time?


    A Are you interested in how long you''ve been logged into your user account? Type
    finger username and press Enter (where username is the login name for your user
    account). In addition to displaying the amount of time that you''ve been logged
    in, you can also find out the name of the shell you are using, and whether you
    have any mail.


    If you''d like to find out how much disk space each directory and subdirectory
    takes up, use the du command. To see the amount of free and used disk space on
    the entire system, use the df command.


    When you need to know the current time or the date, try the date command.


    To display a calendar of the current month, use the cal command. If you want to
    see other months, you''ll need to add command options to the cal command.


    Q I''m working in the X Window System and I want to read the manual pages. What''s
    the best way for me to get started?


    A You might want to try a program called xman. To start xman, open an X terminal
    window and type xman at the shell prompt. You can quickly select from a list of
    manual pages.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Quiz


    1. What basic skills will you need to become an efficient user of the Linux operating
    system?


    The most important basic skill to acquire is the ability to work efficiently with
    directories and files on the filesystem. Working with directories involves viewing
    the contents of a directory and changing between directories. Files are kept in
    order by editing the file contents, moving them to appropriate directories, and
    deleting unneeded files.


    The ability to locate files and search for information is also important. This
    prevents files from becoming lost in the system, and also helps you to learn about
    the commands and programs installed on the system. To help you use search information
    better, the command results can be directed to either a file or a printer.


    When many users work on the system, the ability to give other users access to
    files makes file sharing an easy task.


    2. What are the three basic parts of a command?


    The three parts of a command are the command, the command options, and any parameters.
    Command options modify the results of the command, and parameters are another
    type of input that is used to modify the output of the command. Parameters are
    usually filenames or directory paths.


    3. How do you delete typing errors when working on the command line?


    To erase the entire line, press Ctrl+U. Pressing Backspace deletes the last character
    that was typed. The arrow keys can move the cursor along a line of command so
    that text can be inserted somewhere in the middle of the command line.


    4. What is the syntax for the man command?


    The man command displays requested reference pages for commands installed on a
    Linux system. The syntax for the man command is


    ```

    man [options] [section] topic

    ```


    Where the topic parameter is the name of the command, the section parameter is
    used to search a specific section in a man page, and the options change the default
    output (such as displaying several related manual pages, one after another).


    # Exercises


    1. Use the man command to read the manual pages for the commands discussed in
    this hour. This is a good time to do a little exploring and become familiar with
    the commands you''ll need to operate the system. As you read through the manual'
  merge: -1
  img_proc: true
