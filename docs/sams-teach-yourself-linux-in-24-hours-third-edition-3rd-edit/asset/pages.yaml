- pgno: 110
  md: '# Summary


    During the past hour, you saw how to use the Linux shell as your own personal
    gopher. You learned how to send commands to the shell and have the shell communicate
    with the Linux kernel. You also learned that the appearance of the shell (that
    is, the shell prompt) could be changed to display information suited to your needs.
    You were also introduced to many of the shortcuts contained within the shell that
    make it easier to work with your computer.


    # Q&A


    Q Where can I learn more about each of the shells discussed in this hour?


    A Look for the GNU bash shell at the Free software Foundation Web site (www.gnu.org/software/bash/bash.html).
    The ksh shell can be found at www.kornshell.com. The tcsh shell is available from
    ftp.astron.com/pub/tcsh. The zsh shell Web site is located at www.zsh.org.


    Q Where can I find more information about the bash shell?


    A You can find additional information and details about bash in the bash manual
    page by typing man bash and pressing Enter from the shell prompt. The /usr/doc/bash
    directory for the version of bash you have installed on your system contains documentation
    for bash functions, scripts, and startup files. You can also use the info command
    to browse the info pages for bash. To do this, type info bash and press Enter.


    Q All the configuration changes to the shell that were discussed in this hour
    are in effect only for the current session. If I log out, the shell goes back
    to the default settings. How do I make configuration changes permanent?


    A Many things about the bash shell can be configured to work the way you want.
    There are three important files that bash uses to predefine values or definitions
    and share them across the system:


    +   - The /etc/profile initialization file is used for all users (system wide)
    to set options such as the environment variables (discussed later) or to send
    messages (such as "Hello," and "Good morning, Mr. Phelps") to the screen at login.

    +   - The .bashrc configuration file in your home directory can be edited to personalize
    the way that bash starts and to customize how the bash shell handles key bindings
    for certain keys (such as the Backspace key, for instance).

    +   - The .profile resource file, which is also found in your home directory,
    points to the resource file that bash is to use after you log in to Linux.'
  merge: -1
  img_proc: true
