- pgno: 50
  md: '+   - At the bottom-left corner (under the list of installation steps) is a
    row of colorful buttons. These buttons change the look of the installation screens.
    If you want a different color scheme, click any of these buttons at any time during
    the installation process.

    +   - The upper-left side of the screen contains the input area. For each step
    in the installation process, you will be asked a number of questions. You can
    use the mouse to scroll through lists, to select options, and to click the OK
    button when you have finished answering the questions in each screen.

    +   - The bottom left of the screen contains information to help you answer the
    questions posed in the upper-left section of the screen. Before you answer any
    questions or select any options, you should read this help information. Use the
    scrollbar at the right edge to see all the text.

    +   - As you walk through each screen, you might find that options are already
    selected for you. These defaults are based on information the installation process
    found while scanning your system. For most of the screens, you''ll find that the
    default choices are correct for your system. If so, accept the defaults and go
    on to the next step. If the default choices are not correct, select the right
    choice before proceeding. You will want to verify the selected choices with the
    system information you collected in Hour 1.


    # Supplying Setup Information


    The first step is to supply some needed information so that the installation process
    knows how to proceed. You will first be asked to choose a language. By default,
    the English (US) option will be selected. If English isn''t your language, scroll
    through the list and select the language you want to use. When you have made your
    choice, click OK to move to the next step.


    ![](img/782ecfdc0b083a767896cc983e10427f_50_0.png)


    > You don''t have to use the mouse to select options. Use the Tab key to move
    from one field to another, or to move from one field to the OK button. The arrow
    keys will move you through a list of options. Use the spacebar to select an option.


    You will next be asked to select an installation class. There are three choices:
    recommended, customized, and expert. If you want an easy installation (Linux-Mandrake
    will make the choices for you), select the recommended installation class. For
    more control over the installation, choose the custom installation class. The
    custom class enables you'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'to select the packages (or applications) that you want installed on the system.
    Only those people who really know what they are doing should use the expert installation
    class. This section explains the installation process using the custom installation
    class.


    The custom installation class needs to know how you will be using the system.
    You have three choices: normal, development, and server. If you will be using
    the system to assist with your homework, to manage your checkbook, to help increase
    the productivity of your small business, cruise the Internet, or find some entertainment,
    select the normal class.


    Next, you will be asked if any SCSI devices are attached to the system. If SCSI
    devices are attached, select Yes to display a list of SCSI devices. Select your
    device from the list.


    After SCSI devices are dealt with, you will be asked about your keyboard. Once
    again, the correct keyboard should be highlighted by default.


    ![](img/782ecfdc0b083a767896cc983e10427f_51_0.png)


    Linux-Mandrake has an extra step that asks you a few miscellaneous questions:


    +   - Hard drive optimization. It is best to answer No to this question. If you
    answer Yes, and your hard drive does not support optimization, you''ll have problems
    later on down the road.

    +   - Security level. The security level determines how the superuser (or system
    administrator) can log in to the system. If you want the superuser to log in directly
    to the root account, select low or medium security. If you want the superuser
    to log in from a user account (using the su command), select high security.

    +   - Amount of RAM memory. The installation process will automatically detect
    the amount of RAM that is installed on the system. If this number is not correct,
    type the correct amount of RAM in the text box.

    +   - Removable media automounting. This is a very nice feature to have. Automounting
    of devices means that whenever you place a floppy disk, Zip disk, or CD-ROM into
    the appropriate drive, the system will automatically know that you have done so.
    If you elect not to auto-mount devices, you will need to tell the operating system
    that you want to use the drive after you''ve inserted the disk. You''ll learn
    how to manually mount devices in Hour 9, "Hooking Up Hardware Devices."

    +   - Enable num lock at startup. If you use the number keypad at the right side
    of the keyboard, you might want to select this option.'
