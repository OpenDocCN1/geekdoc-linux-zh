- pgno: 304
  md: '# Additional Resources


    There are far too many things about X Window System configuration and window managers
    for us to make much of a dent in it in an hour. There are new things going on
    with the newest releases of XFree86 that change things to make the system more
    sophisticated. For information about the changes made in the latest releases of
    XFree86 to accommodate new hardware and upgraded operating systems, you''ll have
    to look around some of these places:


    +   - The best resources for finding out about window managers can be found at
    these two sites: www.PLIG.org/xwinman and www.PLIG.org/xwinman/others.html.

    +   - FVWM and FVWM2''s official site is http://www.fvwm.org/. For the latest
    version, check ftp.hpc.uh.edu/pub/fvwm.

    +   - LessTif (a motif clone) is at The Hungry Programmers site www.lesstif.org.

    +   - KDE''s Web site is www.kde.org.

    +   - The official GNOME Web site is www.gnome.org.

    +   - The CORBA homepage is at www.corba.org.

    +   - The homepage for the Gtk+ toolkit is www.gtk.org.

    +   - The Window Maker Web site is www.windowmaker.org.

    +   - The AfterStep Web site is at www.afterstep.org.

    +   - Enlightenment is at www.enlightenment.org.

    +   - The XFree86 official site is at www.xfree86.org.

    +   - Kenton Lee''s site lists more than 700 X Window resource sites www.rahul.net/kenton/xsites.framed.html.


    # Summary


    In this hour, you learned about window managers, what they do, and which ones
    are installed and available. You learned how to change your window manager by
    editing files in your home directory. You also found out about some places where
    you can look for information about each of a selected group of window managers.
    You now know some places where detailed information about configuring your window
    manager can be found.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Q&A


    Q In Hour 2, “Installing Linux-Mandrake,” you suggested that I elect to NOT start
    the X Window System when Mandrake boots. My friend has this really cool graphical
    login screen with a cute picture for each user. Where can I get one of these?


    A Your friend is probably using the KDE Display Manager. This graphical tool enables
    you to create a graphical login screen with a welcoming message and a list of
    all the users who can log in from this screen. You’ll find the KDE Display Manager
    in the GNOME and KDE menus. You can also type kdmconfig at the command line.


    Q Is there any way that I can start applications automatically when I start an
    X Window session?


    A In your home directory, you might find a file called .xinitrc. If you don’t
    have a copy of this file, you’ll find one in /usr/lib/X11/xinit/xinitrc. You can
    copy this file to your home directory. You’ll need to edit this file to add the
    execution commands for those files that you want to load automatically.


    Q How do I find out which fonts are installed on the system?


    A Try the xfontsel utility. Type xfontsel at the command-line to start the utility.
    Read the manual page (type man xfontsel) to read more about the utility. In Linux-Mandrake,
    you can try the DrakFont program. If you are running a dual-boot system and have
    Microsoft Windows installed, you can transfer your favorite Windows fonts to your
    Linux system. In KDE, you can try the KDE Font Manager.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    # Quiz


    +   1. What is the easiest way to switch from one desktop environment to another?

    +   The easiest way is with the desktop switching tool, switchdesk. You’ll find
    this tool in the KDE and GNOME menus, or you can type switchdesk on the command
    line. The desktop switching tool is limited, however. It only enables you to switch
    between three desktop environments—KDE, GNOME, and fvwm. But it’s easy!'
  merge: -1
  img_proc: true
- pgno: 306
  md: '2. Where do you find the list of window managers that are installed on your
    system?


    Look in the /etc/X11/window-managers file. This file lists the name of the window
    manager, a brief description, the execution file, and the script needed to be
    able to access the window manager.


    3. What is the easiest way to make changes to a file without losing the original
    information?


    Use the comment-out character, the pound (#) sign. By using the comment-out character,
    if you need to return to the original values, you can delete the comment-out character.
    Another way to make changes without losing the original is to make a backup copy
    of the file before you begin editing. Then, if you make a mistake, you can always
    go back to the original by copying the copy back to the original filename.


    4. Where is a good place to find more information about each of the window managers
    and desktop environments discussed during this chapter?


    Visit the Web site. You might also find some useful documentation if you look
    around the Linux filesystem (try the /usr/doc directory).


    # Exercises


    1. You can use themes to dress up the desktop. Visit Themes.org (www.themes.org)
    and download a desktop theme for the window manager that you are using.


    2. Experiment with some of the window managers discussed during the hour. If your
    system doesn’t have much RAM memory, you might want to try out one of the lightweight
    window managers, such as fvwm. Remember, it’s your desktop, so make it work for
    you.'
  merge: -1
  img_proc: true
