- pgno: 174
  md: '# Hour 9


    # Hooking Up Hardware Devices


    Hooking up new hardware devices to your GNU/Linux system has certainly become
    easier than it used to be. Each new kernel supplies driver modules for the growing
    list of hardware devices that can be attached to the system. When you first boot
    the system, a long list of messages zips across the screen. You’ll notice information
    about individual pieces of hardware that you have, the manufacturer, model number,
    and even whether or not it’s going to work. The process doesn’t always work that
    smoothly, however, so you should know what to do to take care of it yourself.


    In this hour, you will


    +   - Learn how to work with floppy and CD-ROM drives

    +   - Format a DOS floppy disk and copy files to it with the mtools package

    +   - Locate sources of system information

    +   - Back up configuration files before adding new hardware and making other
    configuration changes to the system


    ![](img/782ecfdc0b083a767896cc983e10427f_174_0.png)'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# # Working with Floppy and CD-ROM Drives


    One of the newest features of GNU/Linux is the capability to automatically mount
    CD-ROM drives and floppy disk drives. If your system supports automatic mounting,
    you''re in luck. With the automatic mounting feature, called supermount, you can
    use a floppy and CD-ROM drive on your system just as easily as you can use these
    drives on a Microsoft Windows system.


    Well, there are a few differences. In Microsoft Windows, the floppy drive is called
    A:; in GNU/Linux, the floppy drive is called /mnt/floppy. GNU/Linux also assigns
    a device file to the drive. Most likely, you''ll find the device file that controls
    the floppy drive in /dev/fd0. Here''s a cool trick: You can read both DOS disks
    and disks formatted with the extended filesystem (ext2). The CD-ROM drive isn''t
    called D:, E:, or F:, either; it is called /mnt/cdrom. Depending on how your system
    is set up, the device file is /dev/hdb.


    > > The /mnt directories should already be created on your system. If they do
    not exist, use the mkdir command to add these to the system.


    If you selected the supermount feature during installation, you can just put the
    floppy disk or CD-ROM in the drive, go to the appropriate /mnt directory, and
    view the contents of the disk. If your system doesn''t use the supermount feature,
    you will first need to mount the drive by hand before you can use it this way.


    **New Term** Some distributions give you the opportunity to supermount floppy
    and CD-ROM drives when the system is booted. By supermounting a drive, you have
    automatic access to the drive. Distributions that do not provide a supermount
    option require you to mount the drive each time before you use it and unmount
    it when you are finished.


    How do you know whether your system supports the supermount feature? Here''s a
    number of different places where you can look for an answer. Look at the /proc/mounts
    file. You can view this file by typing cat /proc/mounts at the command line. Listing
    9.1 shows a system that was set up to use supermount. If your system does not
    support the supermount feature, you won''t see an entry for the CD-ROM drive or
    the floppy disk drive. On floppy drives that use supermount, when you move a file
    to the /mnt/floppy directory, the file will be automatically saved on the floppy
    disk. After the drive light goes out, you can remove the disk.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# LISTING 9.1 The Contents of the /proc/mounts File When the System Supports
    Automatic Mounting


    ```

    /dev/root / ext2 rw 0 0

    /proc /proc proc rw 0 0

    /dev/hda1 /boot ext2 rw 0 0

    none /dev/pts devpts rw 0 0

    /dev/hda7 /home ext2 rw 0 0

    /mnt/cdrom /mnt/cdrom supermount rw 0 0

    /mnt/floppy /mnt/floppy supermount rw 0 0

    ```


    ![](img/782ecfdc0b083a767896cc983e10427f_176_0.png)


    > If you are working in one of the graphical environments (the X Window System,
    GNOME, or KDE), you might want to dedicate a small corner of the desktop in which
    to keep a small terminal window open all the time. You''ll find that typing commands
    in a terminal is a quick way to perform tasks and gather information. Look around
    the menu system, and you might find a half dozen different terminals.


    You can also use the mount command to see which filesystems are mounted on the
    system and available for use. To display the mounted filesystems, type mount at
    the command line, and press Enter. Listing 9.2 shows the mounted filesystems for
    a system that does not use the supermount feature. On this system, the floppy
    drive and the CD-ROM drive must be mounted before they can be used.


    # LISTING 9.2 The Output of the mount Command


    ```

    /dev/hda1 on / type ext2 (rw)

    proc on /proc type proc (rw)

    /dev/hda3 on /home type ext2 (rw,usrquota)

    none on /dev/pts type devpts (rw,mode+0622)

    ```


    # Task: Mounting a Floppy Drive


    If your system does not use the supermount feature, you will need to mount the
    floppy drive after you place the disk in the drive. When it''s in the drive, you
    can use the disk in any way you need. Then, before you can remove the disk, you
    must unmount the drive. Here''s how to work with a floppy drive that does not
    use the supermount feature:


    +   1. Determine the block device address for the floppy drive. Type `dmesg |
    less` and press Enter. Look for a line that is similar to the following:

    +      `Floppy drive(s): fd0 is 1.44M`'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'This means that the floppy drive is located at /dev/fd0. Also, look for the
    lines that describe your CD-ROM drive. Here''s an example:


    ```

    hdb: ATAPI 24X CD_ROM drive, 128KB Cache

    Uniform CDROM driver Revision 2.56

    ```


    +   2. Place the floppy disk in the floppy disk drive.

    +   3. Mount the drive. At the command line, type `mount /dev/fd0 /mnt/floppy`
    (where `/dev/fd0` is the device listed in the `dmesg` command from step 1) and
    press Enter. You''ll see the drive light appear for a few seconds.

    +   4. Copy a file to the floppy disk. Type `cp filename /mnt/floppy` and press
    Enter. You''ll see the drive light go on for a few seconds while the file is copied
    to the floppy disk.

    +   5. Unmount the floppy drive. Type `umount /dev/fd0` and press Enter.

    +   6. Take the floppy out of the drive. It is important that you unmount the
    drive before you remove the floppy disk.


    ![](img/782ecfdc0b083a767896cc983e10427f_177_0.png)


    > If unprivileged users cannot access the floppy drive, you''ll need to change
    the permissions. As superuser, type `chmod o+rw /dev/fd0` at the command line
    and press Enter.


    Mounting and unmounting a CD-ROM works the same way. To mount the CD-ROM, type
    `mount /dev/hdb /mnt/cdrom` and press Enter. You should see the following message:


    ```

    Mount: block device /dev/hdb is write-protected, mounting in read-only

    ```


    After the CD-ROM is mounted, you can read directory lists and view files using
    the commands you learned about in Hour 7, "Moving Around the Filesystem."


    # Working with DOS Floppies


    If all this mounting and unmounting stuff has you confused, there''s another way
    you can work with floppy disks. In the distribution, you''ll find a package called
    mtools. The mtools package contains a collection of commands that enable you to
    work with directories and files on a floppy disk in the same way that you work
    with floppies on a DOS (or Microsoft Windows) system. Also, you don''t have to
    use the Linux filesystem (at /mnt/floppy or /dev/fd0) to access the floppy disk.
    You can use the old, familiar A:'
  merge: -1
  img_proc: true
- pgno: 178
  md: "designation for the floppy disk drive. When using mtools, you don't need to\
    \ mount a floppy before you can use it. The following list contains some of the\
    \ mtools commands that you'll find useful.\n\n+   - To list the contents of the\
    \ floppy disk, use the mdir command.\n+   - To copy a file from a floppy to the\
    \ GNU/Linux system or from the GNU/Linux system to the floppy, use the mcopy command.\n\
    +   - To delete files on the floppy disk, use the mdel command.\n+   - To rename\
    \ a file located on the floppy disk, use the mren command.\n+   - To change the\
    \ file attributes for a file, use the mattrib command. Using this command, you\
    \ can make a file read-only.\n+   - To format a floppy disk, use the mformat command.\n\
    +   - To check for bad blocks (errors) on a floppy disk, use the mbadblocks command.\n\
    +   - To create a label on a floppy disk that describes the contents of the floppy,\
    \ use the mlabel command.\n\n# Formatting a Floppy Disk\n\nWhen you buy floppy\
    \ disks, they usually come preformatted. These disks can be used right out of\
    \ the box on your GNU/Linux system. When you want to completely erase a floppy,\
    \ you might want to reformat the floppy so that all the information stored on\
    \ the floppy is destroyed and the floppy appears to be brand new. Here's how to\
    \ format and work with a floppy by using the mtools commands:\n\n+   1. Place\
    \ the floppy disk in the floppy disk drive.\n+   2. Format the floppy. Type `mformat\
    \ a:` and press Enter. If you see the following error message\n+   \n+   `mformat:\
    \ Non-removable media is not supported`\n+   `(You must tell the complete geometry\
    \ of the disk, either in /etc/mtools or on the command line)`\n+   \n+   you will\
    \ need to type\n+   \n+   `mformat -s 18 -h 2 -t 80 a:`\n+   \n+   and press Enter.\
    \ This command (used to format a 1.44MB floppy disk) tells the mformat command\
    \ that there are 18 sectors, 2 heads, and 80 tracks on the disk. You can find\
    \ this information in the `/etc/fdprm` file. You can read this file using the\
    \ cat command or in the less pager."
  merge: -1
  img_proc: true
