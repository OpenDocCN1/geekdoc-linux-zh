- pgno: 331
  md: '> Many distributions create symbolic links from whatever port the modem is
    on to /dev/modem. This makes it a lot more intuitive.


    When you first use the kppp dialer, you''ll see a blank connection window. Gather
    up the information you collected from your ISP, the data you have collected about
    your modem, and click the Setup button to start the configuration process. Your
    first task is to click the Device tab and set up the modem. Using the information
    you collected from the dmesg command, select the modem device from the drop-down
    list. When selecting a connection speed, use a speed of 57600 if you have a 28.8
    or 33.6 modem and a speed of 115200 if you have a 56K or V.90 modem. To test your
    setup and make sure that kppp can find the modem, click the Modem tab and query
    the modem.


    After you have configured the modem and determined that it is recognized by kppp,
    tell the dialer how to make the connection to your ISP. Click the Accounts tab
    and click the New button. The New Account window (shown in Figure 21.3) is where
    you will enter the information needed to dial your ISP and perform the necessary
    handshaking.


    # FIGURE 21.3

    Enter the username, password, and DNS addresses supplied by your ISP.


    ![](img/782ecfdc0b083a767896cc983e10427f_331_0.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'First things first: name the connection. You might want to use the name of
    your ISP, or if you have several accounts, use a descriptive name that tells the
    purpose of the account (whether for personal use or business use). Next, type
    the phone number used to access the ISP''s servers and the authentication protocol
    (PAP, CHAP, etc). Then, click the DNS tab and enter the primary and secondary
    DNS addresses needed by the ISP. When all this is entered, click OK. You''ll be
    returned to the kppp Configuration window and you''ll see the connection name
    in the list of accounts.


    The dialup connection is almost ready. Click OK one more time to get back to the
    main kppp window (shown in Figure 21.4) where you''ll see the connection name
    one more time. All you need to do is type your username and password and click
    the Connect button. After the modem makes the connection, you''re ready to surf
    to your heart''s content.


    # FIGURE 21.4


    Enter your username and password and get online!


    ![](img/782ecfdc0b083a767896cc983e10427f_332_0.png)


    Figure 21.5 shows the connection window that appears. Use this window to control
    your online time. While you''re surfing, you can view the amount of data that
    you have passed back and forth across the telephone lines by clicking the Details
    button.


    # FIGURE 21.5


    The kppp connection window displays the amount of time you''ve been online.


    ![](img/782ecfdc0b083a767896cc983e10427f_332_1.png)'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Task: Using Scripts to Connect to Your ISP


    Rather than using a graphical tool to create a connection to your ISP, you can
    create three different shell scripts that will make the connection for you. The
    first step is to write a script that does the handshaking required to make the
    PPP connection between your computer and the ISP''s servers. Then you''ll write
    a script that dials up the ISP and starts the pppd daemon. Finally, you''ll edit
    one more file and add the name of your ISP''s domain name server.


    ![](img/782ecfdc0b083a767896cc983e10427f_333_0.png)


    > This task assumes that you are using the vi text editor. You may use another
    text editor if you choose.


    +   1. Log in to the superuser account.

    +   2. Use the ls command to see whether the ppp-on and ppp-on-dialer files are
    located in the /etc/ppp directory. Make a backup copy of these files.


    ![](img/782ecfdc0b083a767896cc983e10427f_333_1.png)


    > If these files are not there, you can find sample scripts in the /usr/doc/ppp-2.3.11/scripts
    directory. (In TurboLinux, you''ll find them in the /usr/share/doc/packages/ppp-2.3.1/scripts
    directory.) Copy these two files to the /etc/ppp directory.


    3. Edit the /etc/ppp/ppp-on file. Type vi /etc/ppp/ppp-on and press Enter. A sample
    script is shown in Listing 21.1. Replace the information in bold italics with
    the information supplied by your ISP. Don''t forget to save your work and close
    the file when you are done.


    # LISTING 21.1 The Script for the /etc/ppp-on File


    ```

    #!/bin/bash

    #

    # Script to initiate a ppp connection.

    # Change these parameters as needed.

    TELEPHONE=555-1212      # The telephone number for the connection

    ACCOUNT=username        # The account name for logon

    PASSWORD=password       # The password for this account

    LOCAL_IP=0.0.0.0        # Local IP address (Dynamic = 0.0.0.0)

    REMOTE_IP=0.0.0.0       # Remote IP address if desired. Normally 0.0.0.0

    NETMASK=255.255.255.0   # The proper netmask if needed

    ```'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# LISTING 21.1 continued


    ```

    #

    # Export them so that they will be available at ''ppp-on-dialer'' time.

    export TELEPHONE ACCOUNT PASSWORD

    #

    # This is the location of the script which dials the phone and logs.

    DIALER_SCRIPT=/etc/ppp/ppp-on-dialer

    #

    # Initiate the connection

    exec /usr/sbin/pppd debug lock modem crtscts /dev/ttyS0 115200 \

    asyncmap 20A0000 escape FF kdebug 0 $LOCAL_IP:$REMOTE_IP \

    noipdefault netmask $NETMASK defaultroute connect $DIALER_SCRIPT &

    ```


    Change the TELEPHONE field to the number used to dial up your ISP. The ACCOUNT
    field is your username and the PASSWORD is, obviously, the password needed to
    access your account with the ISP.


    > You might want to put quotation marks around your password if the password contains
    any of the shell metacharacters (such as the asterisk or ampersand).


    In the middle of the script is a field for DIALER SCRIPT. You will edit this file
    next. Make sure that this is the correct directory path.


    Type the device name for the modem and the maximum speed at which the modem will
    connect in the last section of the script.


    +   4. Make the file executable. Type chmod 755 /etc/ppp/ppp-on and press Enter.

    +   5. The /etc/ppp/ppp-on-dialer file that you copied does not need any changes.
    If you do not have a copy of this script, a sample script is shown in Listing
    21.2.


    # LISTING 21.2 The Script for the /etc/ppp-on-dialer File


    ```

    #!/bin/bash

    #

    # This script performs the connection protocol.

    #

    exec chat -v \

    TIMEOUT 3 \

    ABORT ''\nBUSY\r'' \

    ABORT ''\nNO ANSWER\r'' \

    ABORT ''\nRINGING\r\n\r\nRINGING\r'' \

    '''' ''\rAT'' \

    ''OK-+++\c:OK'' ''ATH0''

    ```'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# LISTING 21.2 continued


    ```

    TIMEOUT 30 \

    OK ATDTSTELEPHONE \

    CONNECT \

    ogin:--ogin: $ACCOUNT \

    assword: $PASSWORD

    ```


    6. Make the file executable. Type chmod 755 /etc/ppp/ppp-on-dialer and press Enter.


    7. Configure the DNS address numbers used by your ISP. Type vi /etc/resolv.conf
    and press Enter. A sample of this file appears in Listing 21.3.


    # LISTING 21.3 Edit Search and Nameserver Information in the /etc/resolv.conf
    File


    ```

    search myisp.net

    nameserver 255.255.255.244

    nameserver 255.255.255.245

    ```


    On the first line, enter the domain name for your ISP. On the second line, enter
    the primary DNS number. On the third line, enter the secondary DNS number. When
    you are done, save and close the file.


    8. Dial up your ISP. Type /etc/ppp/ppp-on and press Enter. You should hear the
    modem dial.


    9. When you are ready to disconnect from the Internet, type /etc/ppp/ppp-off.
    You''ll see a message that says


    ```

    PPP link to ppp0 terminated.

    ```


    # Summary


    You''re connected to the Internet and ready to go. During the past hour, you learned
    several ways in which you could create a dialup connection to your Internet service
    provider. If a single user account will be cruising the Internet, you might want
    to use either the GNOME or KDE dialup utility. You also saw how easy it is to
    create a shell script to tell the modem when to connect to the Internet and when
    to disconnect. If you want to make one Internet connection available to all users,
    you might want to create the shell script. That way, you only have to set up the
    account one time.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Q&A


    Q I connect to my ISP through a cable modem. Is Linux able to use my cable modem?


    A Yes, for more information, read the Cable Modem HOWTO and the Linux Modem HOWTO.


    Q I have a voice/data/fax modem. What programs can I use to send a fax from my
    computer?


    A KSendFax is an easy to use digital fax machine. You''ll find KSendFax with the
    KDE desktop environment. If you don''t see it in the menu system, type ksendfax
    at the command line. To learn more about KSendFax, open the application''s Help
    menu and read the KSendFax Handbook. There are other fax applications at metalab.unc.edu/pub/Linux/apps/serialcomm/fax/INDEX.html.


    Q Are there any sources of ready-made shell scripts that I can tailor to fit my
    needs?


    A If you go to the MetaLab Linux Archive at metalab.unc.edu/pub/Linux/utils/scripts/INDEX.html,
    you''ll find a few useful script templates. You''ll find a script that will check
    the hyperlinks in an HTML file for consistency, a script that helps you keep a
    notepad, a script that lists every file on your system, and a number of other
    scripts to help automate system administration tasks.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    # Quiz


    +   1. What information do you need to collect from your ISP so that you can create
    a dialup PPP connection to get on the Internet?


    You''ll need the phone number that the modem needs to dial to access the ISP''s
    servers, your username and password to identify you as an authorized user, the
    authentication protocol your ISP uses (PAP, CHAP, etc.) and the DNS addresses
    needed so that your computer knows which computer to use as its gateway to the
    Internet. You should also know whether your ISP uses dynamic IP addressing or
    static IP addresses (chances are, it is dynamic IP addressing). If you want to
    access an email account or read the Internet newsgroups, you''ll need an email
    address, the name of the email server, and the name of the news server.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# 2. How can you find out which serial port the kernel found the modem on?


    Read the kernel boot message log file with the dmesg command. In Linux, modem
    devices are usually called ttyS0, ttyS1, ttyS2, and ttyS3. These devices correlate
    to the COM1 and COM2 names in the MS-DOS world. Some Linux distributions name
    these serial ports cua0 and cua1.


    # 3. When configuring your modem, which connection speed should you select?


    You want to select the highest connection speed possible. For a 56K or V.90 modem,
    you can select a connection speed as high as 115200. Those with a 28.8 or 33.6
    modem should select a speed of 57600.


    # 4. What files do you need to configure a PPP dialup connection using a shell
    script?


    There are three shell scripts that belong in the /etc/ppp directory: ppp-on, ppp-dialup,
    and ppp-off. The only file in this group that you need to edit is ppp-on. You
    also need a program called chat to execute the interaction between the modem and
    the ISP. The chat program is usually found in /usr/sbin/chat. Another file that
    you will need to edit is /etc/resolv.conf. This file contains the DNS addresses
    used by your ISP.


    # Exercises


    1. Look for other ways to create a dialup connection to your ISP. You might also
    want to look for some tools to help you monitor the connection and control the
    connection while you are on a search. You may want to start at metalab.unc.edu/pub/Linux/system/serial//INDEX.html.


    2. After you have created the ppp-on script to connect to your ISP and you are
    satisfied that it works, you can move a copy of the file (or create a symbolic
    link to the file) to either the /usr/bin or the /usr/sbin directory. By doing
    this, every user on the system (not just the superuser) can connect to the Internet
    by just typing ppp-on at the command line. You''ll also want to move a copy of
    the ppp-off script so that users can turn off the Internet connection.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Hour 22


    # Merging onto the Information Superhighway


    Your Internet connection is up and running and you''re ready to explore the Internet
    and all that it has to offer. Linux offers a vast assortment of tools to cover
    about every surfing need you might come across. There are so many Web browsers,
    electronic mail readers, newsreaders, file transfer programs, and chat tools that
    you might not know where to start.


    In this hour, you will:


    +   - Get up and surfing quickly with Netscape Communicator

    +   - Learn how the Linux electronic mail system operates

    +   - Find Linux help in the Usenet newsgroups

    +   - Use gFTP to download the GNUCash financial management program from an FTP
    site


    ![](img/782ecfdc0b083a767896cc983e10427f_338_0.png)'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Getting a Quick Start


    As you''ve browsed through your Linux system, you might have seen long lists of
    Internet tools that are ready for you to use. One familiar face in the Linux Internet
    lineup is Netscape Communicator. Communicator is a complete suite of applications
    that includes Navigator (shown in Figure 22.1) to browse Web pages, Messenger
    that uses a single interface for email and newsgroup messages, Composer for building
    great-looking Web pages, an address book to store email addresses, and a built-in
    radio for listening to tunes while you work.


    FIGURE 22.1

    Type a URL address in the Location text box and experience historical places and
    events.


    Change communicator preferences


    Find other communicator programs


    ![](img/782ecfdc0b083a767896cc983e10427f_339_0.png)


    Open the web browser


    Look for Internet applications in the menus


    Email


    Address book


    # Task: Setting Up Netscape Communicator


    Most Linux distributions install the Netscape Communicator suite of Internet tools
    if you elected to install the Internet and WWW packages. If you want to get on
    the Internet fast and start reading your email, this task shows you how to configure
    Netscape Messenger to work with your ISP.'
