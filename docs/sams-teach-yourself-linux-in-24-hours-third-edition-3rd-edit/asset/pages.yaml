- pgno: 208
  md: '# Q Where can I learn more about the Linux print system?


    A Start with the HOWTOs. The Linux Printing HOWTO for Linux shows how to set up
    a printer, configure printing software, find fax software, and preview files before
    they are sent to the printer. The Linux Printing Usage HOWTO tells how to print
    different file formats. If you have a Hewlett Packard printer, you should read
    the HP HOWTO


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    # Quiz


    1. What happens when you tell Linux that you want to print a document?


    Pressing the print button in an application executes the lpr command. You can
    also execute the lpr command from the shell prompt. The lpr command takes the
    specified file and places it in the print spool directory for the printer that
    will print the file. The file waits in the spool for the line printer daemon,
    which spawns itself so that it can process the file and send it to the printer
    as soon as the printer is available.


    2. Which command do you use to find out the device name of the port to which the
    printer is attached?


    Use the dmesg command. You''ll probably want to view the output of the command
    in a pager, such as less, so that you can read the entire contents. The printer
    device information lists the manufacturer and model of the printer attached to
    the port and the port name (either lp0, lp1, or lp2).


    3. What can you do to make sure there''s a connection between the operating system,
    the device file, and the printer?


    Send a small text file to the printer or direct the output of a command (such
    as the ls command) to the printer device with a command like


    ```

    Ls > /dev/lp0

    ```


    4. Where is the printer configuration information stored?


    All the printer configuration utilities store printer information in the /etc/printcap
    file. It is not recommended that you manually edit the /etc/printcap file because
    the structure is complex and you don''t want to make an incorrect change.'
  merge: -1
  img_proc: true
