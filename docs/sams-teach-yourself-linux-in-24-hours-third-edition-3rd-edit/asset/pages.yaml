  md: '**New Term** The shell program runs in an environment that depends on having
    certain preset values or pathnames in various resource text files found in each
    user''s home directory and in the /etc directory. These are called *environment
    variables*. The default systemwide variables for the bash shell are found in the
    */etc/profile* file. The personal variable settings are in the *.bashrc* file
    in your home directory.


    # Bashing Ahead


    Everyone has his or her own way of working and a desire to make things work better
    in the way that a job is accomplished. The shell programs offer a way to customize
    the way your computer works to suit your preferences. You can make use of the
    built-in shell commands to accomplish tasks, and create shell scripts to schedule
    jobs to run at a specific time and day. The shell can also set up your Linux work
    area and load the software (on startup) that you need to work most efficiently.
    Now it''s time to find out what the shell does for you to make it easier to communicate
    with the operating system.


    # Talking to the Shell


    Linux uses the GNU readline command line editor to read and write to the command
    line. The readline editor is what you see at work when you type text after the
    shell prompt or read responses there. The editor can also edit whatever is on
    the command line. To use the command line, just begin typing after the shell prompt.
    You''ll see the cursor is just one character ahead of you. If you make a mistake,
    just press the Backspace key to erase the text. Use the left and right arrow keys
    to move back and forth across the command. There are also several commands for
    moving around the command line and editing text, as shown in Table 5.1.


    TABLE 5.1 Text Editing Commands for the Command Line


    | To Do This | Press These Keys |

    |---|---|

    | Move one character to the left | Ctrl+B |

    | Move one character to the right | Ctrl+F |

    | Move left by one word | Esc+b |

    | Move right by one word | Esc+f |

    | Move to beginning of the line | Ctrl+A |

    | Move to end of the line | Ctrl+E |

    | Delete character to the left | Del |

    | Delete character to the right | Ctrl+D |'
