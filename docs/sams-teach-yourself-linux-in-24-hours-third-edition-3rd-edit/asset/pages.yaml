- pgno: 152
  md: '# Hour 8


    ![](img/782ecfdc0b083a767896cc983e10427f_152_0.png)


    # Text Editing with vi


    The most basic computer task is text processing. Text processing involves creating
    an electronic file in which to store words and characters, and making changes
    to the file to keep information up-to-date. The process of creating and updating
    files is basic to the Linux operating system. Linux stores system configuration
    information in plain-text files. To make changes to these files, you can click
    options and select from lists in many of the Linux configuration tools that use
    a graphical front end. Because these configuration files are plain-text files,
    you can just as easily make the same configuration changes in a text editor.


    Every Linux distribution offers an assortment of text editors. You''ll also find
    text editors bundled with most desktop environments (such as KDE and GNOME). This
    hour introduces you to the vi text editor, but we will use the vim text editor
    to show you the basics of working with any of the vi clones. The vi text editor
    is the default Linux text editor. The vim text editor is an improved version of
    vi and is the default text editor used by Linux-Mandrake. There are other versions
    of vi, such as elvis, and you''ll find that all versions of vi work in much the
    same way.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'It is important that you learn to work a text editor from the command line.
    If you ever have system problems, cannot get to a GUI, and need to make configuration
    changes to get the system up and running, you''ll be glad you spent an hour with
    vi.


    In this hour, you will:


    +   - Learn about the different types of configuration files that can be updated
    in a text editor

    +   - Open and read files in the vi text editor

    +   - Edit files and save the changes


    # Working with Text Editors


    All text editors perform the same basic, common tasks—opening files, editing text,
    and saving the changes. Because all text editors read and write ASCII text files,
    a file created in one text editor can be edited in another text editor. One way
    to make changes to a file is to insert and delete text. All text editors provide
    a way to move around in the text file, use the Backspace key to erase mistakes,
    and insert text in any location. Another way to change the file is to move information
    around a file, or to copy a piece of information and use it in another location.
    To help make the editing job a little easier, text editors can search a file for
    a single word or a string of text. You might want to search a file to find a particular
    word in the file, or to replace the text with some other text. After you''ve made
    your changes, remember to save the file.


    # Editing Configuration Files


    The main job of a text editor is to edit system configuration files. Yes, we know
    these configuration tasks can be performed using a graphical front end to change
    screen resolution, create Internet connections, and change passwords. And there
    are some excellent front ends. One well-known configuration utility is linuxconf
    (found in Appendix C, “Introducing GNOME and Linuxconf”). linuxconf does the job
    of editing configuration files, creating user and group accounts, setting up file
    sharing, establishing Internet connections, displaying system logs, and changing
    the date and time.


    Even though you can use a cool tool to edit configuration files, you might find
    that you have more control over how your system operates if you edit these configuration
    files yourself. After you are comfortable editing configuration files, you can
    quickly back up a file, type a few changes, test those changes, fix any problems,
    and implement your new configuration. There are two types of files that you might
    find a need to edit. These files control the configuration of your user account
    and the configuration of the entire system.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# New Term


    User startup files on the Linux system enable you to configure the behavior of
    the shell and other programs when you access your user account. Some programs
    do not need a startup file to save configuration changes. These programs use their
    built-in default configuration.


    Startup files are located in your home directory as hidden files (indicated by
    the period at the beginning of the filename). Here are some of the startup files
    that you might want to explore:


    +   - The .bashrc shell script is a startup file that controls a number of occurrences
    when you log in to your user account. You''ll need to edit this file if you want
    to change the format of the shell prompt, the number of commands saved in the
    command history list, the directories in which the shell looks for commands, and
    special keyboard shortcuts, just to name a few. If you are using the C shell or
    tcsh, edit the .cshrc file.

    +   - When working in the X Window System, you can start programs automatically
    when you start the graphical desktop environment. The commands to start the programs
    are added to the .xinitrc file. If you want to change the default window size,
    background color, and font type and size, make those changes in the .Xdefaults
    file.

    +   - Desktop environments, such as KDE, place icons on the desktop that are shortcuts
    to applications and files. KDE uses the .kdelink file to create links between
    the execution file for the program and the desktop.

    +   - If you''re a regular newsgroup lurker, keep track of your newsgroup list
    in the .newsrc file.


    # New Term


    Linux contains a number of files, called system configuration files, that control
    how the system operates. These files specify how the system boots, what filesystems
    and peripherals are available for use, the screen resolution and color depth,
    and connections to the Internet or a network.


    If you want to attempt system configuration changes by hand-editing files, here
    are a few of the files with which you''ll need to become familiar:


    +   - Systems that run both Linux and another operating system need a way to switch
    between operating systems. This can be done with a tool called lilo. If you need
    to set up lilo or if there are problems booting operating systems, edit the LILO
    configuration file. This file is usually found in the /etc/lilo.conf file. If
    you can''t find this file, look for /boot/lilo.conf or /etc/lilo/config.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   - Before you can access any filesystem on the computer, the filesystem
    must be mounted; that is, the filesystem must be associated with a particular
    directory. The file that controls the mounting of filesystems at boot time is
    the `/etc/fstab` file. You might need to edit this file if you add a new hard
    drive, Zip drive, or CD-ROM drive to the computer.

    +   - To start a process when the operating system boots, edit the `/etc/inittab`
    file. A process can be a program, a command, or a scheduled job.

    +   - Printers are added to the system with the `/etc/printcap` file. This file
    contains the make and model of the printer, the port to which it is connected,
    and where the print spool is located.

    +   - To work with the X Window System, you will need to configure the monitor.
    The settings for the monitor model and type, refresh rates, screen resolution,
    and color depth are configured in the `/etc/X11/XF86Config` file.

    +   - As the system administrator, you are responsible for adding and deleting
    accounts for each user and group that will be working on the system. One way to
    add new users is to edit the `/etc/passwd` file. To add group accounts to the
    system, edit the `/etc/group` file.


    ![](img/782ecfdc0b083a767896cc983e10427f_155_0.png)


    > > It is very dangerous to tinker with the password and group files and you must
    be careful to make backups of all configuration files before you edit anything
    in them. The methods for doing this can be found in Chapter 12, "Sharing Files
    with Other Users on the System."


    +   - Creating an Internet connection involves creating two scripts and editing
    one file. You will need a script that uses the modem to make the dial-up connection,
    and another script to exchange data such as your username and password. Then,
    so that the system can find a domain name server, edit the `/etc/resolv.conf`
    file.

    +   - You might want to set up a TCP/IP network to run a network for your home
    or small business. To set up a network, information such as IP addresses, gateway
    addresses, and hostnames for each computer attached to the network needs to be
    added to (depending on your particular distribution) the `rc.inet1`, `rc.inet2`,
    `/etc/hosts`, `/etc/networks`, `/etc/hosts.conf`, and `/etc/resolv.conf` files.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Choosing a Text Editor


    There might be a dozen text editors on the CD-ROM for your favorite Linux distribution,
    and there are many more available for download off the Internet. At some time
    during your Linux career, you will require the services of a text editor. Knowing
    how to work a text editor from the command line might seem like a waste of time,
    but you might have an emergency (such as a system crash!), and you''ll need the
    aid of a text editor to recover. Table 8.1 lists several text editors that you''ll
    find bundled with most Linux distributions.


    Table 8.1 Linux Text Editors


    | Editor | Description |

    |---|---|

    | Code Commander | Used by programmers to edit source code |

    | Cooled it | Another text editor (with a graphical interface) for programmers
    that supports the Python programming language |

    | emacs | The most powerful of the GNU text editors which supports text editing,
    programming, time management, and games |

    | xemacs | emacs with a graphical user interface |

    | gedit | A text editor for the GNOME desktop environment |

    | GXedit | A text editor with a graphical interface that contains a spell checking
    utility and can send text as an email message |

    | jed | A small text editor that can emulate emacs and WordStar |

    | xjed | A version of jed that works with the X Window System |

    | joe | An easy to use text editor that uses WordStar keybindings |

    | nedit | Uses a graphical interface and supports different languages and text
    processors |

    | vim | An improved version of vi that allows several windows to be displayed
    at one time and multiple undo levels |

    | yudit | Another text editor for the X Window System that supports text editing
    in different languages |'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/782ecfdc0b083a767896cc983e10427f_157_0.png)


    The most popular text editor is vi because it is one of the oldest text editors
    and because it migrated to Linux from the UNIX world. There are many flavors of
    vi and you will most likely find one of the vi clones installed on your system.
    The list of clones includes vim, elvis, and nvi. If you use the vi command to
    start vi, one of these clones will appear if vi is not installed on your system.
    Depending on the Linux distribution, one of the vi clones is installed and a symbolic
    link is created from the vi command to the command that starts the default text
    editor. Linux-Mandrake uses vim. Slackware defaults to elvis. The vim text editor
    is used as the example during this hour.


    The quest for a command-line-driven text editor does not end with vi. Several
    other text editors are worth mentioning. A portable and lightweight text editor
    that is good to have around for emergencies is the ed text editor. The executable
    file for ed can be installed on a floppy disk, giving you access to a text editor
    in the case of a system crash. The ed text editor can be used if the X Window
    System is not working, or if you cannot get terminal emulation. A text editor
    that works similar to ed is sed, a stream editor.


    Another text editor that is installed with most distributions is emacs. The emacs
    editor is probably the most powerful application installed with any Linux distribution.
    Not only is emacs available for Linux, but it is available for most any other
    operating system imaginable. There is even a graphical version of emacs called
    xemacs that runs under the X Window System. In addition to being a text editor,
    emacs is also a programming tool, an appointment book, and a collection of Internet
    utilities.


    # Task: Reading the vi Manual Page


    Before you try any command or program, it is a good idea to learn a little about
    the program before you embark. One place to look for information is the manual
    pages (which were discussed in Hour 6, “Looking at the Command Line”). In addition
    to covering all the commands you’ll use on your Linux system, the manual pages
    also include information on many programs. Follow these steps to learn how to
    search the manual pages for information on text editors:


    +   1. Display the vi manual page. Type man vi and press Enter. The manual page
    for the vi-compatible text editor installed on your system displays in a pager.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   2. Read the manual page. Pay particular attention to how to use the online
    help system. If you need assistance while working in the vi text editor, use the
    `:help` command.

    +   3. Read the manual pages for any of the editors discussed earlier in this
    hour. For example, if you are interested in emacs, type `man emacs` and press
    Enter.

    +   4. Search for other text editors that might be installed on the system. Type
    `man -k text editor` and press Enter. Browse the list and look for entries that
    are similar to the following:

    +       - `gEdit (1)` - GTK+ based text editor

    +       - `mcedit (1)` - Full featured terminal text editor for Unix-like systems.

    +       - `vim (1)` - Vi Improved, a programmers text editor

    +       - `xedit (1x)` - simple text editor for X

    +   5. Read the manual pages for any other text editors that might be installed
    on the system.


    # Getting Started with the vim Text Editor


    The vi text editor (and its clones vim, elvis, and nvi) will edit any file in
    ASCII text format. You''ll find vi most helpful when editing system configuration
    files and editing programs. While working in vi, you can always call on the online
    help system to keep you moving forward (press Escape, type :help, and press Enter).
    The vim text editor contains a few enhancements over vi, such as the ability to
    undo edits, view multiple files, and search for text.


    ![](img/782ecfdc0b083a767896cc983e10427f_158_0.png)


    > If you''re not sure about testing out vi from the command line, there are a
    couple of vi alternatives. If you are working in a GUI such as KDE or GNOME, try
    out the graphical version of vim. Open a terminal emulator and type gvim. The
    vim text editor opens in a window, lists all available commands in the menus,
    and uses a toolbar for frequently used commands.


    When you first start vi, it might seem complex and unmanageable. With a little
    patience, and some memorization practice, you''ll be moving around a file and
    executing keyboard commands in no time. If you started a new file by typing vi
    practice.txt, your screen would be similar to the one shown in Figure 8.1.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# FIGURE 8.1


    The vi text editor as it should appear on your screen.


    ![](img/782ecfdc0b083a767896cc983e10427f_159_0.png)


    Notice the cursor at the upper-left corner. Press the i key and you can begin
    typing. The text will appear before the cursor as you type. Like most word processing
    programs, vi has text-wrapping capabilities. You don''t need to press the Enter
    key at the end of each line. The default line width is 80 characters and vi automatically
    moves the cursor to the next line when this width is reached. While you are typing,
    you can use the Backspace key to correct any mistakes that you might make. When
    you reach the end of a paragraph, press the Enter key to start on a new line.


    New Term

    The vi text editor works under two different modes: the Command mode and the Insert
    mode. To begin working in a file by adding text, you''ll need to change to Insert
    mode. To move the cursor around the file or to delete text, you''ll work in Command
    mode. You also need to be in Command mode to access Insert mode. Press the Escape
    key when you want to change to Command mode. To access a mode, you type a single
    letter command. After you are in a mode, several mode commands make it easy to
    edit text.


    When you first open a new file with vi, you are in Command mode. Command mode
    enables you to type commands to perform tasks. The first command you''ll encounter
    is i, which switches to Insert mode. To execute this command, just press i on
    the keyboard (do not use the uppercase letter I). Notice that the "— INSERT —"
    message appears at the bottom-left corner of the screen. After you are in Insert
    mode, you can begin adding text to a file. Correct your mistakes with the Backspace
    key. When you want to switch back to Command mode, press the Escape key.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Command mode also enables you to move the cursor around in a file. You can
    use the arrow keys to move the cursor up, down, to the right, and to the left.
    The k, j, l, and h keys perform the same movement.


    ![](img/782ecfdc0b083a767896cc983e10427f_160_0.png)


    > While you are practicing in the insert mode in vi, do not use the arrow keys,
    the Page Up and Page Down keys, or the Home and End keys to move the cursor around
    in a file. If you use these keys and find strange characters in your file, press
    the Escape key (at least once to ensure that you get to Command mode), and type
    :q!. This closes the file without saving the changes. By doing this while you
    are practicing you can ensure that you don''t inadvertently save bad data to the
    file.


    You should also save the file on a regular basis. You never know when there might
    be a sudden power outage. Commands that open and save files can only be used in
    Command mode. To access these commands, first type the colon (:) character. While
    you are working on a file, you can quickly save your changes (also known as writing
    a file) by typing :w and pressing Enter. At the bottom of the screen, you''ll
    see a message similar to the following:


    ```

    ''practice.txt'' 778L, 25518C written

    ```


    If you decide you want to work with another file, type :e filename and press Enter.
    You must save changes to the file in the buffer area before you can open a new
    file. If you do not save your changes first, you will see an error message.


    When you are finished working in vi, type :q and press Enter. The text editor
    will close and you will be returned to the shell prompt. To make things a little
    simpler, you can save the changes and quit vi at the same time; type :wq and press
    Enter. You will get an error if you try to quit without saving the file unless
    you use the :q! command discussed in the caution above.


    # The Syntax for vi


    When you open a file in vi, the cursor is located at the beginning of the file.
    If you want to start working at some other location, you can specify that spot
    and vi will open to it.


    The following code shows the syntax for vi:


    ```

    vi [+linenumber] [+/pattern] filename

    ```


    The filename parameter is the name of the file you want vi to open when the program
    starts. For example, if you want to work with a file named practice.txt, type
    the command vi practice.txt.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'The `linenumber` parameter (see Table 8.5) is the line where the cursor should
    be placed when the file opens in the buffer. In `vi`, you can display the line
    numbers along the left margin. Line numbers are useful if you are writing programming
    code or a legal document. For example, to start working at line 31 in the file
    named `practice.txt`, use the command `vi +31 practice.txt`.


    The `pattern` parameter is used when you want `vi` to search for a string of text.
    When `vi` finds this text string, the cursor is placed at the first instance where
    the text string is found. For example, if a section of the text file where you
    want to start working contains the text string "introduction," use the command
    `vi +/introduction practice.txt`.


    # Task: Creating a Text File


    Before you can practice with the `vi` text editor, you''ll need a file in which
    you can practice cursor movement and text editing commands. One way to follow
    along during the rest of the hour, and to have a second source of help, is to
    copy the tutorial that was installed with `vim`. The following steps guide you
    through the process of creating a new file and adding some text to the file:


    +   1. Look for the `vim` tutorial file. Look in the `/usr/doc/` directory for
    a `vim-common-??` subdirectory. On a Linux-Mandrake system, this file is located
    at `/usr/doc/vim-common-5.6/tutor/tutor`.

    +   2. Change to the directory that you want to use as your working directory
    (use the `cd` command). You might want to use your home directory or a subdirectory
    within your home directory.

    +   3. Open `vi` and create a practice file at the same time. Type `vi practice.txt`
    and press Enter. This file will be stored in the working directory.

    +   4. Add the contents of the tutorial file (which you located in step 1) to
    the practice file. Type `:r /usr/doc/vim-common-5.6/tutor/tutor` and press Enter.
    If the tutorial is located in another directory, make sure to use the correct
    directory path. Your file should look like the one shown in Figure 8.2.


    ![](img/782ecfdc0b083a767896cc983e10427f_161_0.png)


    > > In Hour 7, "Moving Around the Filesystem," you learned how to use the `cat`
    command to append (or insert) the contents of one file to the end of another file.
    In `vi`, the `:r filename` command performs the same job.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'FIGURE 8.2

    The VIM Tutor provides a quick start to learning your way around the text editor.


    ![](img/782ecfdc0b083a767896cc983e10427f_162_0.png)


    Read tutorial


    Inserted file


    Line number


    Column number


    +   5. Save the file. Type :w and press Enter.

    +   6. Make a copy of the file. Type :w practice2.txt and press Enter. This is
    similar to the cp command discussed in Hour 7.


    You now have two copies of the tutorial file stored in your working directory.
    You can use these files to practice the text editing commands covered during the
    rest of this hour. We also recommend that you read the tutorial and follow the
    lessons. The extra practice with vi will help you memorize keyboard commands and
    cursor movements.


    # Text Editing Basics


    The first time you use vi, you might feel overwhelmed by the vast assortment of
    keyboard commands needed to operate the text editor. Just remember, even though
    vi is a complex text editor that requires you to memorize a bunch of commands,
    it becomes easier to execute commands and edit text the more often you work with
    the editor.'
