    +   [rusty@localhost /rusty]$

    +   ```

    +   2. If you are not using bash, change to the bash shell. Type `bash` and press
    Enter. You will see the same shell prompt on the screen.

    +   3. If you want bash to be the default shell, type `chsh -s /bin/bash` and
    press Enter. Double-check that you are using bash. Type `echo $SHELL` and press
    Enter (just as you did in step 1).

    +   4. Display the bash help function. Type `help` and press Enter. The help command
    lists all the commands that are built into the shell.'
