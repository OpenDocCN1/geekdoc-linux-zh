- pgno: 233
  md: 'The X Window System also contains a few tools to help you track system usage.
    The xsysinfo utility shows the load on the CPU; the amount of physical memory
    being used, and the amount of swap memory being used. Another utility that displays
    more information is xosview (shown in Figure 13.6).


    FIGURE 13.6 The xosview utility displays a graphical representation of system
    usage.


    ![](img/782ecfdc0b083a767896cc983e10427f_233_0.png)


    # Summary


    During this hour, you learned how programs start on the system to spawn processes,
    and how to determine the amount of system resources used by each of these processes.
    There are several tools you can use to monitor your system that tell you how much
    of the CPU resources are being used, and the amount of used and available memory.


    # Q&A


    Q What is the difference between a program and a process?


    A The word program is usually associated with some sort of application with which
    the user interacts. One or more processes are started when the program executes.
    Processes are the activities started in memory by the shell to execute commands.
    These commands may be sent to the computer by the user or the application.


    Q How much swap space should I have on my Linux system?


    A Ideally, you should have twice the amount of swap space as you have physical
    RAM. The minimum size swap space should be 16MB.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.'
