- pgno: 29
  md: '# Comparing Linux Distributions


    There might be many reasons why you decided to try the Linux operating system.
    You might have heard that the Linux operating system is a stable and productive
    work environment. That it is not prone to the dreaded general protection faults
    and the blue screens of death. And, another very strong point is the operating
    system''s immunity to computer viruses. However, the hype isn''t just about an
    operating system.


    You''ll find an application, command, or utility that performs just about any
    task or job you need to do. The list of available software from the Open Source
    movement boggles the mind. You''ll find more than a gigabyte of software included
    on the CD-ROM for each Linux distribution. For the artists in the crowd, there
    are graphics programs that are comparable to some of the commercial applications
    that might have been beyond your budget. Programmers will find enough programming
    languages and tools to stay busy for a lifetime. And there''s so much more that
    you might never have a use for all the commands, utilities, and applications that
    are installed with the operating system.


    So, you''re ready to try out the Linux operating system, but where do you begin?
    The first place to start is to select a Linux distribution. There are dozens from
    which to choose and more appear on the scene every day.


    ![](img/782ecfdc0b083a767896cc983e10427f_29_0.png)


    > Throughout this book, you''ll see Tux, the Linux penguin, pointing to places
    where Linux distributions have their differences. Even though you''ll see Linux-Mandrake
    as the example used in this book (most of the time), we''ve tried our very best
    to show you how to work with the Linux operating system no matter which distribution
    you are running.


    ![](img/782ecfdc0b083a767896cc983e10427f_29_1.png)


    > The CD-ROM found at the back of this book contains the latest release of Linux-Mandrake.
    Linux-Mandrake exhibits those qualities that we feel make a good choice for the
    person who is just becoming acquainted with the Linux operating system. Linux-Mandrake
    provides technical support, good user documentation, a complete list of GNU/Linux
    applications, and an easy-to-follow installation process.


    What should you look for when choosing a Linux distribution? You should be aware
    that no matter which distribution you choose, the Linux operating system is the
    same on every distribution. The differences appear during the installation of
    the operating system, the applications that are installed, technical support,
    and extra programs and utilities that are created by the distribution and designed
    to work with that particular distribution.'
  merge: -1
  img_proc: true
- pgno: 30
  md: "Here are a few things to look for when choosing a Linux distribution:\n\n+\
    \   - What's packaged with the distribution CD-ROM? If you buy the boxed set,\
    \ you'll most likely find the distribution CD-ROM, a CD-ROM with the source code\
    \ for all the applications, a CD-ROM with extra programs (such as StarOffice or\
    \ WordPerfect), boot disks, and an installation guide. If you buy the distribution\
    \ CD-ROM without all the fancy extra, you'll find electronic versions of the distribution's\
    \ documentation on the CD-ROM.\n+   - Do you need technical support? Many distributions\
    \ offer support for a certain number of days. This support is usually limited\
    \ to helping you install the distribution on your computer system. But, be aware,\
    \ there isn't much that technical support can do for you if you are running incompatible\
    \ hardware. We discuss hardware later in this chapter.\n+   - How easy is it to\
    \ install the distribution? The biggest hurdle to any new Linux user is installing\
    \ the operating system. When first starting out, you'll want a distribution that\
    \ contains plenty of help information for the installation, can automatically\
    \ detect computer hardware, and contains other tools to guide you through the\
    \ installation.\n+   - How will you be using the Linux system? Each distribution\
    \ allows you to select from a set of installation types, or to selectively pick\
    \ those applications that you want installed. We recommend that you select one\
    \ of the installation types; there's bound to be a profile that fits you. Each\
    \ distribution contains different installation types, but you will find configurations\
    \ for basic workstations, systems that run mainly graphics programs and utilities,\
    \ workstations that connect to a network, an Internet connection and Web browsing,\
    \ network servers, and Web hosts.\n\n![](img/782ecfdc0b083a767896cc983e10427f_30_0.png)\n\
    \n![](img/782ecfdc0b083a767896cc983e10427f_30_1.png)\n\n> There are so many different\
    \ Linux distributions, that we can't cover each one individually. All we can do\
    \ is tell you about our experiences. The first Linux we installed was Slackware\
    \ Linux (back in the early 1990s). After many attempts, and some serious trial\
    \ and error, we finally got an operating system, but no graphical user interface.\
    \ Configuring the X Window System to adequately handle the video display is still\
    \ a difficult job. After hundreds of Linux installations, we feel that Slackware\
    \ Linux is best suited for someone who feels comfortable working with Linux or\
    \ who has a background in the UNIX operating system.\n> \n> We next moved to Red\
    \ Hat Linux. We had much better luck installing this distribution. It might have\
    \ been the prior experience under our belts; and then again, it might have been\
    \ the graphical installation. The advantage to Red Hat Linux is the Red Hat Package\
    \ Management (RPM) technology,"
  merge: -1
  img_proc: true
- pgno: 31
  md: 'which makes it easy to install applications, remove applications, and keep
    the system updated. Many Linux distributions use the RPM technology. Another feature
    that we liked about Red Hat Linux was Linuxconf. Linuxconf makes it easy to make
    a variety of system configuration changes. You can create user and group accounts
    for file sharing, create a dialup connection to the Internet, and change how the
    computer boots.


    Many distributions are based on Red Hat, and we''ve tried several of them. Our
    favorite is Linux-Mandrake with TurboLinux following in a close second. Both distributions
    are very strong when it comes to system configuration tools. Linux-Mandrake uses
    DrakConf to change the settings for the video display, system users, and other
    system configuration settings. DrakConf also makes it easy to connect a computer
    to a network and to attach a printer.


    The TurboLinux installation process is not as detailed as Linux-Mandrake, but
    it is still easier than other distributions for the new user. TurboLinux contains
    a number of graphical configuration tools to help you set up the system just the
    way you want. TurboLinux also sports a line of distributions. If you will be using
    Linux for home use, you''ll want to try TurboLinux Workstation. There''s also
    TurboLinux Server if you want to connect several computers together.


    Another distribution which we''ve had success with installing the operating system
    and configuring the X Window System is Caldera OpenLinux. Caldera OpenLinux is
    another good choice for the new Linux user. The downside we saw in the distribution
    was a heavy reliance on the KDE desktop programs and utilities as the only way
    to do things, and frequent difficulty upgrading applications.


    If you are looking for a slick, quick, and easy installation, you should try Corel
    Linux OpenLinux. The folks at Corel really are telling the truth when they say
    the installation is over in only four steps. We are so accustomed to sitting in
    front of the computer for hours, making installation decisions, and watching the
    software install. This installation left us breathless—we even had a little time
    to spare. The only downside: It comes preconfigured and doesn''t give you much
    flexibility during the installation.


    We''ve talked long enough and our coffee is almost gone. We would like to mention
    our last three experiments with Linux distributions. Although we like all three
    of these distributions, we do not recommend these distributions to someone just
    starting out with Linux. SuSE OpenLinux is the most up-to-date Linux distribution.
    If you need the latest application, or a new device driver, or help configuring
    the X Window System, go to the SuSE Web site. Debian Linux is for the advanced
    user. On the plus side, when installed, Debian Linux OpenLinux is the easiest
    distribution to maintain. It is also the only noncommercial distribution being
    developed as a cooperative effort over the Internet. And, we don''t want to forget
    GNU/Hurd, the role model for operating systems everywhere.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Before you choose a distribution, look at the resources available on the Internet
    to find more information. The Linux Headquarters Distributions Links (at www.linuxhq.com/dist.html)
    links to a number of Web sites that offer Linux downloads. You''ll also find links
    to the Web sites for a number of Linux distributions. The Linux downloads portal
    site, Linux Links, has an impressive list of links (at www.linuxlinks.com/Distributions)
    to the popular distributions. You''ll even find most of the lesser-known distributions.


    The most extensive amount of information about a distribution can be found at
    the distribution''s Web site. The addresses for many of the popular Linux distributions
    are found in Table 1.1. When you''ve waded through all this material, you''ll
    have a better understanding of what Linux distribution will work best for you.
    After all this research, if you still have questions, you can post them to the
    comp.os.linux.answers newsgroup.


    TABLE 1.1 URL Addresses for the Linux Distributions


    | Distribution | Web Site Address |

    |---|---|

    | Caldera OpenLinux | www.caldera.com |

    | Corel Linux | linux.corel.com |

    | Debian Linux | www.debian.org |

    | Linux-Mandrake | www.linux-mandrake.com |

    | Linux Pro | www.wgs.com |

    | Red Hat Linux | www.redhat.com |

    | Slackware Linux | www.slackware.com |

    | SuSE | www.suse.com |

    | Trans-Ameritech Linuxware | www.trans.am.com |

    | TurboLinux | www.turbolinux.com |


    # Task: Putting Together a Linux Reading List


    All throughout this book, you''ll be directed to various places where you''ll
    find more help on a subject. The sources for Linux help are vast. Here''s some
    Linux help and information sources that every new user should know about:


    +   1. The Linux Documentation Project (www.linuxdocs.org) maintains the core
    of the Linux online help documents. You''ll most often find yourself looking to
    this site for the latest versions of the Linux FAQ and HOWTOs. The FAQ answers
    frequently asked questions about Linux, and the HOWTOs give you instructions to
    use Linux in different ways. In addition to reading the FAQ, you might want to
    read these HOWTOs before you install Linux:'
  merge: -1
  img_proc: true
- pgno: 33
  md: '+   - The Linux Distribution HOWTO highlights the major Linux distributions
    and provides some overview information about each one.

    +   - The Linux Hardware Compatibility HOWTO lists the hardware that Linux supports
    and where you can find needed drivers when you are having problems configuring
    a device.

    +   - You might need an installation boot disk to start the installation process.
    Read the Linux Bootdisk HOWTO to find out how to create this boot disk.

    +   - If you want to install Linux on a laptop computer, read the Linux Laptop
    HOWTO and the Saving Space Mini-HOWTO. Laptop installations have different needs
    than regular workstations. You will need to deal with PCMCIA devices and a smaller
    hard drive.

    +   - Read the Linux-Windows95 Mini-HOWTO if you plan to partition a Windows hard
    drive and install Linux on a separate partition.


    +   2. The GNU project and the Free Software Foundation Web site at www.gnu.org
    contains downloads and help documentation for many open source programs.

    +   3. Because this book is aimed at beginners, you may feel right at home at
    Linux Newbies (www.linuxnewbies.org). The information at this Web site is for
    those who are installing Linux for the first time (and maybe even the second)
    time. You might find it worth your while to spend some time at this site.

    +   4. Another good starting point for beginners is the Linux meta-Web site at
    www.firstlinux.com. This site provides good advice for those who are getting ready
    to install Linux for the first time.

    +   5. When you need the advice of the experts, cruise over to The Linux Gurus
    (at thelinuxgurus.org). You''ll find reviews of different Linux distributions,
    applications, and published books. The guru also provides a good list of links
    to other Linux Web sites.

    +   6. The most complete collection of Linux resources on the Internet is the
    Linux Portal Site (www.linuxlinks.com). There is a section just for beginners.


    # Selecting a Linux Computer


    After you''ve selected a Linux distribution, it''s time to select the computer
    on which you want the Linux operating system and all the cool GNU software and
    utilities that are included with the distribution. There are many decisions to
    make about the Linux installation:


    +   - What computer will be used to run the Linux operating system? If you are
    just getting started with Linux, find a computer that can be dedicated to learning
    Linux.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'You don''t want to tie up the machine you use to run your business, or your
    Internet connection, while you experiment with a new operating system. You might
    also consider installing Linux on older equipment because it is more likely that
    the hardware will be compatible with the operating system. Some of the newer,
    state-of-the-art equipment might be difficult to get to work with Linux.


    +   - Are the computer hardware and attached peripherals compatible with Linux?
    Successful installations occur when the hardware is compatible with the operating
    system. You''ll need to gather information about the hardware and check your findings
    against the Linux hardware compatibility list. If everything is compatible, you
    can start using your new operating system and included applications. If the hardware
    isn''t listed, you might have problems configuring and using those devices.

    +   - How much hard drive space will you be able to devote to Linux and the associated
    utilities? Many distributions can install well over a gigabyte of applications.
    You''ll then need additional space to store data files and install more applications.


    The first-time Linux user might want to consider installing Linux as the sole
    operating system on a computer. This is the easiest method. No need to install
    a second hard drive or to partition an existing hard drive that contains gigabytes
    of data. Just let the Linux operating system take over the entire computer. Not
    only does this make the installation much easier, it gives you a separate machine
    that you can learn on, make mistakes, fix those mistakes, and not have to worry
    jeopardizing your production machines that you use to run your small business.


    If you want to run Linux and another operating system (such as Microsoft Windows)
    on the same computer, you have two options. The easiest of these options is to
    install a second hard drive on the computer and install Linux on the second hard
    drive. Your Windows drive stays secure and there''s no fancy partitioning to do.
    You do need to know how to open up the computer and attach the drive and cables.


    The other option is to run Linux and another operating system on the same hard
    drive. This requires partitioning the drive so that the original operating system
    lives on one part of the drive and Linux is installed on the other partition.


    > If you are unfamiliar with partitioning a hard drive, we recommend that you
    install Linux on its own separate computer, or at least on a separate hard drive.
    One wrong move while you are partitioning a drive and you could lose all your
    valuable data.


    ![](img/782ecfdc0b083a767896cc983e10427f_34_0.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Minimum Recommended Hardware Requirements


    One of the advantages of Linux is its efficient use of hardware resources. A bare
    minimum configuration for a Linux system needs to consist of


    +   - A Pentium processor or compatible

    +   - CD-ROM drive

    +   - 32MB RAM, minimum

    +   - Minimum of 500MB hard disk drive space, 1.6GB is recommended

    +   - VESA 2.0-compliant graphics card


    ![](img/782ecfdc0b083a767896cc983e10427f_35_0.png)


    > > It is possible to run some versions of Linux on a machine as old as a 386
    with as little as 4 megabytes of RAM. This won''t be an installation with an X
    Window graphical environment and so everything will have to be done with only
    a text screen and without a mouse.


    These minimum requirements will depend on the type of applications that you want
    to run. If you plan to install any commercial applications (such as WordPerfect
    or Star Office), you will need more hard drive space and more RAM. You''ll also
    want to increase RAM if you will be running graphics applications or multimedia
    on the computer.


    # Deciding What Software to Install


    During the installation, you will be asked to make selections from more than 1GB
    of applications and utilities that you want loaded with the operating system.
    For those with a large hard drive, this isn''t a problem. You can easily install
    every program and then gradually uninstall applications that you don''t use later.


    > **New Term** A package is compiled code that becomes an application or a utility
    when installed on the system.


    When hard drive space is limited, you are faced with the task of selecting packages.
    To make this task easier, each distribution allows you to select from a number
    of predefined installation classes. These installation classes are set up so that
    you can choose an installation based on the amount of free space you want to dedicate
    to Linux, or based on how you want to use the computer.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Working with the X Window System


    Configuring the video display is probably the most difficult part of a Linux installation.
    There are so many variables to consider—the monitor, the video card, screen resolution,
    color depth, and refresh rates. If you run into problems adjusting the video,
    consider setting up a simple SVGA monitor at 800x600 resolution with 256 colors.
    When you have this minimal display, you can begin adjusting one video setting
    at a time until your screen looks just the way you want.


    # Adding Networking and Internet Access


    One downside you might find in the Linux world is the lack of plug-and-play support.
    Although there are efforts underway to increase plug-and-play capabilities in
    Linux, compatibility might become a problem when it comes time to connect to the
    Internet. Most internal modems, and all Winmodems, are not compatible with Linux.
    If you are having problems getting Linux to recognize the modem, you might want
    to consider hooking up an external modem to the computer.


    # Playing Games


    There is growing interest in Linux games. You''ll find the old standard, low resource
    usage games such as Solitaire, but you won''t find fun and excitement there. Many
    games for the Microsoft Windows operating system are being developed for Linux.
    There is a growing list of games that have already been ported to Linux. Also,
    there are DOS and Windows emulators that will permit you to run games written
    for those operating systems. Many Linux enthusiasts have taken to the Internet
    and the multiplayer games. Just remember, games require heavy-duty video and sound
    capabilities. Make sure that Linux supports drivers for your 3D-accelerated video
    card, stereo sound system, and joystick.


    # Determining Hardware Compatibility


    The best way to configure Linux properly and to avoid surprises during the installation
    is to collect as much information as you can about the hardware installed on your
    computer. This is when the manuals packaged with the hardware come in handy. To
    set up the video display properly, it''s always a good idea to get out the manual
    for the monitor. If you don''t have the hardware manuals, call the vendor (or
    check their Web site) to see whether you can get replacements. Hardware information
    can also be found by searching through the computer itself—by asking the already
    installed operating system to display the system properties.


    Each Linux distributor posts on its Web site a list of hardware that is compatible
    with its Linux distribution. Another resource that lists the computer hardware
    that is compatible'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'with Linux in general is the Linux Hardware Compatibility HOWTO (also referred
    to as the Hardware-HOWTO).


    To determine whether your computer hardware is compatible with the Linux operating
    system, take an inventory of the devices attached to the computer and collect
    system information about each device. Table 1.2 lists the devices that you''ll
    need to inventory and the type of information you''ll need for each device. After
    you have collected this information, you can compare your list with the Linux
    Hardware Compatibility HOWTO.


    # Table 1.2 Collect System Information for Each Device Attached to the Computer


    | Device Type | Required System Information |

    |---|---|

    | Hard drives | Number of drives attached to the computer, whether they are IDE
    or SCSI drives, the size of each drive (in MB), partitions, space allocated for
    Linux |

    | CD-ROM drives | Interface type (either IDE or SCSI), manufacturer, and model
    number |

    | RAM memory | Amount of RAM installed on the system |

    | Serial ports | Number of serial ports, port assignments (COM1, COM2), IRQ addresses
    |

    | Parallel ports | Number, port assignments (lp1, lp2), IRQ |

    | SCSI adapters | Manufacturer and model number |

    | Network cards | Manufacturer, model, number and chip set |

    | Modem | Manufacturer and model number, speed, communications port (COM port),
    fax support |

    | Mouse | Type of mouse (bus, PS/2, or serial), number of mouse buttons, port
    attached to, the mouse protocol |

    | Keyboard | Type, keyboard language, and number of keys |

    | Monitor | Manufacturer and model, maximum resolution, vertical and horizontal
    refresh rates |

    | Video card | Manufacturer and model number, type of graphics card, the video
    chipset, amount of video RAM, color depth |

    | Sound card | Manufacturer and model, type (Sound Blaster, ESS), IRQ address,
    I/O port, DMA |

    | Printer | Manufacturer and model, type of printer (PostScript, HPCL) |'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Task: Printing System Information Using Microsoft Windows


    Many computer systems are sold with Microsoft Windows installed. If this is the
    case for you, you can make the task of collecting system information easier with
    the aid of the System Properties list. You can view the list of system devices
    and make a note of them one by one, or you can print the list. To use the Windows
    operating system to collect system information, follow these steps:


    +   1. Open the System Properties dialog box. There are several ways to access
    this dialog box. Right-click the My Computer icon and select Properties from the
    menu that appears. Or, click Start, Settings, Control Panel, and then double-click
    the System icon.

    +   2. Click the Device Manager tab (shown in Figure 1.1) to display the types
    of devices installed on the computer.


    FIGURE 1.1

    View device information and system resource conflicts from the Windows System
    Properties dialog box.


    ![](img/782ecfdc0b083a767896cc983e10427f_38_0.png)


    Select a device


    Click to view device information


    +   3. Click the plus sign next to a device type to expand the list. For each
    device type, all the devices of that type will appear.

    +   4. Click the Print button to display the Print dialog box shown in Figure
    1.2.'
  merge: -1
