    To see whether the file has been copied to the floppy, type `mdir a:` and press
    Enter.


    6. Copy a file from the floppy to the GNU/Linux system. Change to the directory
    in which you want to store the file. Type `mcopy a:filename` and press Enter.


    # Locating Hardware Information


    A big job for the person acting as the system administrator for your GNU/Linux
    system (probably you) is to maintain configuration of the system to take full
    advantage of the flexibility and power of the operating system. By being aware
    of what things are being configured for your system by the various configuration
    files, you can track system performance and reconfigure your system to operate
    at its optimum. You will accomplish this performance fine-tuning by editing the
    configuration files that control the way that the system acts. Before you can
    really get a handle on this, however, you''ll need to get together all the information
    about the system that you can.


    # Task: Gathering Important System Information


    Do you remember those messages that scrolled by on the screen before the login
    prompt appeared? They are the kernel boot messages and they are stored in the
    /var/log/messages file. The messages that display depend on the drivers that are'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'configured on the system. Other files, located in the /proc filesystem, contain
    information about the system architecture; that is, all the busses, boards, controllers,
    and peripherals attached to the system. This is important information to have
    before you make any configuration changes to the system. Here''s how to view these
    files as read-only files in the vi text editor:


    +   1. Log in as superuser. Type su and press Enter. You will be prompted for
    the root password. Type the password and press Enter.

    +   2. Open the kernel boot message file as read-only. Type vi -R /var/log/messages
    and press Enter. The kernel boot messages are different, from system to system,
    depending on the drivers that are compiled as modules or loaded into the kernel.
    As you browse through the file, you''ll notice messages for each device as it
    is initialized during the boot process.

    +   3. Look for system configuration information. You''ll need to know the screen
    font and color when the screen is used as a text terminal, PCI bus and PCI cards,
    CPU type and processor speed, system memory usage, type of mouse, serial and USB
    ports, mounted filesystems, and the version number of the Linux kernel.

    +   4. Move around the file. Press Ctrl+F to move forward in the file one screen.
    Press Ctrl+B to move backward one screen.

    +   5. When you are finished reading the file, exit (or quit) the text editor.
    Type :q and press Enter. The vi text editor will close and you will be returned
    to the shell prompt.

    +   6. Return to your user account. Type su username and press Enter.

    +   7. View information about the CPU type and speed. Type vi -R /proc/cpuinfo
    and press Enter. The -R command option tells vi to open the file as read-only.
    An example of the /proc/cpuinfo file is shown in Listing 9.3. When you are finished
    reading the file, type :q and press Enter to close the file and exit vi.


    # LISTING 9.3 The Contents of the /proc/cpuinfo File


    ```

    processor : 0

    vendor_id : GenuineIntel

    cpu family : 5

    model : 2

    model name : Pentium 75 - 200

    stepping : 12

    cpu MHz : 132.770406

    fdiv_bug : no

    hlt_bug : no

    sep_bug : no

    f00f_bug : yes

    ```'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# LISTING 9.3 continued


    ```

    coma_bug : no

    fpu : yes

    fpu_exception : yes

    cpuid level : 1

    wp : yes

    flags : fpu vme de pse tsc msr mce cx8

    bogomips : 264.60

    ```


    +   8. Display total system RAM, used memory, free memory, and swap space. Type
    vi -R /proc/meminfo and press Enter. Type :q and press Enter when you are done.

    +   9. List the filesystems that are mounted at startup. Type vi -R /proc/mounts
    and press Enter. Do not close vi.

    +   10. View the information about the PCI devices installed on the system. Type
    :e /proc/pci and press Enter. The :e command tells vi that you want to work with
    another file. Type :q and press Enter when you are done.

    +   11. List occupied I/O addresses, IRQs, and DMA channels. Type vi -R /proc/ioports
    /proc/interrupts /proc/dma and press Enter. You can open several files in vi at
    one time by listing the filename, separated by a space. Only one file can be displayed
    at a time.

    +   12. Read the /proc/ioports file and when you are finished, display the /proc/interrupts
    file. Type :next and press Enter. Use the :next command to move forward through
    the list of files; use the :prev command to move backward through the list of
    files.

    +   13. Read the last file and exit vi when you are finished.


    # Adding New Hardware


    During the installation, you created different filesystems and corresponding mount
    points for the partitions on the hard drive. If you think you''re running out
    of storage room, you might want to consider adding a second hard drive to the
    system. Here are the steps required to add a disk to the system:


    +   - Make sure that the piece of hardware is compatible with the operating system.
    You''ll find this information in the Linux Hardware Compatibility HOWTO. There
    are some other HOWTOs that you might want to read: The Hard Disk Upgrade mini-HOWTO,
    the Filesystems HOWTO, the CD-ROM HOWTO, the Zip Drive mini-HOWTO, the Jaz Drive
    HOWTO, the Plug-and-Play HOWTO, and the CD Writing HOWTO.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '+   - Turn off the system and install the hard drive according to the manufacturer''s
    directions. The manufacturer usually does a low-level format, but if not, you
    will need to take care of this. Remember to keep notes in your Linux diary so
    that you can refer to them on that slight chance that something goes wrong.

    +   - When you turn on the computer on and the system reboots, watch the boot
    message. You''ll see the new device file for the hard drive listed.

    +   - Your next big job is to create one or more partitions on the hard drive.
    Use the Linux fdisk utility to make the Linux partitions. After the partitions
    are created, use the fsck command to check the filesystem for errors.

    +   - Configure the device in the /etc/fstab file. You can change parameters in
    the file so that filesystems are mounted automatically at boot time and to tell
    the kernel where in the filesystem the device stores files.

    +   - When the /etc/fstab configuration file is set up, filesystems can be mounted
    automatically at boot time or mounted with the mount command.


    Throughout this hour, you''ve listed filesystem information by viewing the /proc/mounts
    file, executing the mount command, and reading the kernel boot messages. All this
    information is stored in the /etc/fstab file. A sample /etc/fstab is shown in
    Listing 9.4. You can easily view this file with the cat command (type cat /etc/fstab
    and press Enter). The /etc/fstab configuration file contains the information required
    to mount filesystems when the system is booted.


    # LISTING 9.4 The Contents of the /etc/fstab File


    | Device | Mount | Type | Options | Dump | Pass |

    |---|---|---|---|---|---|

    | /dev/hda5 | / | ext2 | defaults | 1 | 1 |

    | /dev/hda1 | /boot | ext2 | defaults | 1 | 2 |

    | none | /dev/pts | devpts | mode=0620 | 0 | 0 |

    | /dev/hda7 | /home | ext2 | defaults,usrquota | 1 | 2 |

    | /mnt/cdrom | /mnt/cdrom | supermount | fs=is09660,dev=/dev/cdrom | 0 | 0 |

    | /mnt/floppy | /mnt/floppy | supermount | fs=vfats,dev=/dev/fd0 | 0 | 0 |

    | none | /proc | proc | defaults | 0 | 0 |

    | /dev/hda6 | swap | swap | defaults | 0 | 0 |


    Your listing might not show the contents of the file in neat and orderly rows.
    Listing 9.4 has been modified to illustrate the six fields required for each device
    that is attached to the filesystem and listed in the /etc/fstab file. The entries
    in the file use the following format:


    +   - The first column is the device file. This file is the go-between for the
    user and the kernel. Various applications and commands use this file to access
    the piece of hardware, such as a hard drive or Zip drive.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '+   - The mount point is the directory where the filesystem for the device
    is located. If you are adding a hard drive so that you have more storage space
    for user files, you could create a mount point as a subdirectory of the /home
    or /usr/local directories.

    +   - GNU/Linux supports a variety of filesystem types. As you''ve seen earlier
    in the hour, you can use DOS floppies and CD-ROM drives. The Linux native filesystem
    type is ext2.

    +   - Options are used to set the parameters under which the device operates.
    The device can be set to be read-write or read-only; it can be mounted automatically
    at boot time or not; and user storage space on the filesystem can be limited.

    +   - The filesystem can be backed up (using the dump utility) on a regular frequency.
    This might not be used by all systems.

    +   - The fsck utility checks each filesystem at boot time. The order in which
    the filesystem is checked is indicated in the last column.


    ![](img/782ecfdc0b083a767896cc983e10427f_183_0.png)


    > When making configuration changes, make only one change at a time and then test
    the change. If the change is successful, make the next change. This is the easiest
    way to recover from an error. If you make several changes at one time, it is hard
    to determine what might have gone wrong. Also, testing configuration changes is
    easier if you make one change at a time.


    # Task: Backing Up Configuration Files


    Here''s how to make a duplicate of the /etc/fstab file so that you can always
    retain the original configuration for reference or to recover from a failed configuration
    attempt:


    ![](img/782ecfdc0b083a767896cc983e10427f_183_1.png)


    > The solemn and unbreakable rule of thumb here is NEVER tinker with any configuration
    file without backing it up first.


    +   1. Log into the root account.

    +   2. Change to the /etc directory. Type cd /etc and press Enter.

    +   3. Copy the fstab file. Type cp fstab fstab.orig and press Enter. This identifies
    the file as being the original configuration. If you use the -p command option,
    you can change the modification date and time to the time that the copy was made.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '4. Write-protect the file. Type `chmod a-w fstab.orig` and press Enter.


    Now you will always have a copy of the original configuration file, which is located
    in the same directory. You can refer to this file if you make changes that don’t
    work properly. When you make a configuration change that you don’t like, undo
    the change by restoring the original file.


    > Whenever you plan to make a configuration change, back up the current configuration
    file. You can use a file extension such as .old or .bkup to identify the copy.
    If you will be making several configuration changes, you might want to keep multiple
    copies (using file extensions such as .old1, .old2, .old3, and so on.)


    # Summary


    During the past hour, you learned that the floppy disk drive and the CD-ROM drive
    that are attached to your system are not handled by the GNU/Linux operating system
    in the same way that they are handled by the Microsoft Windows operating system.
    You learned how to mount a floppy, CD-ROM, or other filesystem so that you can
    access the files that are contained on the device. You also followed the basic
    steps for adding a new hard drive to the system. And, during this time, you saw
    the first example of one of the configuration files that you might have an opportunity
    to edit. Remember to keep backup copies of all configuration files, and keep copies
    of each revision you make. This makes it much easier to step back from your mistakes
    and make corrections.


    # Q&A


    Q Is there another way to format a floppy disk rather than by using the command
    line?


    A You might want to try the KDE Floppy Formatter. This format utility for floppy
    disks looks just like the format program used by Microsoft Windows. To start the
    KDE Floppy Formatter, type `kfloppy` at the command line. You’ll also find this
    utility in the KDE menu system. You can use this utility to create DOS or Linux
    floppies, you can do a quick erase or a full format, and you can add a label to
    a disk.'
  merge: -1
  img_proc: true
