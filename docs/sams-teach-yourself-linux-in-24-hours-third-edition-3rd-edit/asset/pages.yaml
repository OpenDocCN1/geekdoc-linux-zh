- pgno: 109
  md: "This makes it possible to reduce complex jobs that require many command steps\
    \ into a simple matter of typing one command (and maybe adding little information)\
    \ to have the shell take care of the whole thing for you.\n\n# New TERM\n\nSimply\
    \ put, a shell script is a list of actions that you want the shell to perform\
    \ that includes the order in which you want the actions performed and where you\
    \ want the expected results sent.\n\nThe basic command philosophy of UNIX, and\
    \ therefore Linux, is to provide the user with myriad small and specialized commands\
    \ that can be “plumbed” together with conditional statements, command redirection,\
    \ and pipes to produce a desired outcome. Your first step in writing a script\
    \ is to open a text editor (which you’ll learn more about in Hour 8, “Text Editing\
    \ with vi”) and start stringing commands together. The combination of commands\
    \ and conditional statements might produce a script such as\n\n```\nif cp \"filename1\"\
    \ \"filename2\"\nthen\n  vi \"filename2\"\nelse\n  echo \"failed to make copy\"\
    \nfi\n```\n\nThis command string tells bash to copy filename1 to filename2, and\
    \ then call the vi text editor with filename2 displayed. If bash cannot copy the\
    \ file, the then statement cannot be met and bash cannot open vi with the file.\
    \ The else statement then directs bash to print the message ‘failed to make copy’\
    \ (without the quotes). The final fi is the finish statement and must be present\
    \ for if...then...else statements to work. Omitting this is a common error and\
    \ is the cause of many script failures.\n\nAfter you have written your script,\
    \ save the file and make it an executable script by using the chmod command as\
    \ shown here:\n\n```\nchmod +x [filename]\n```\n\nAny short name you choose to\
    \ call the script will become the command that you type to run the shell script.\n\
