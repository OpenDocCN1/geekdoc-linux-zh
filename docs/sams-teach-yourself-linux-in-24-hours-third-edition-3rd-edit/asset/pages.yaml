- pgno: 374
  md: '# FIGURE 24.8


    Select a file in GQview and find an image editor in the Edit menu.


    ![](img/782ecfdc0b083a767896cc983e10427f_374_0.png)


    After you''ve selected the directory that contains the files you want to preview,
    click a file to display a preview. If you want to scroll through the entire list
    of files, select View, Toggle Slideshow.


    # Task: Capturing Screen Images


    You might be wondering how all the screen images that you''ve seen throughout
    this book came into being. Several applications can be used to take a snapshot
    of your desktop or of just a single window on the desktop. Here''s how to use
    KSnapshot to take a picture of your desktop:


    +   1. Open KSnapshot. You might find the program in the menu system of your favorite
    desktop environment, or you can type `ksnapshot` at the command line. The KSnapshot
    program appears in Figure 24.9. When KSnapshot opens, it captures the screen and
    displays it in the Preview pane.

    +   2. Name the screen capture file. Type a filename in the Filename text box.
    You can change the directory in which the file is stored by clicking the Browse
    button.

    +   3. Select an image format. Click the down arrow under the Filename text box
    and select a file format for the captured image.

    +   4. Set the capture delay. You might want KSnapshot to wait a few seconds before
    it captures the screen: for example, perhaps you need to open a menu so that it
    can also be captured. Type the number of seconds you want KSnapshot to wait before
    it takes a picture of the desktop.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'FIGURE 24.9

    Capture the entire desktop or just a single window.


    ![](img/782ecfdc0b083a767896cc983e10427f_375_0.png)


    +   5. Start the screen capture. Click the Grab button and make any required changes
    to the desktop. KSnapshot goes away for a few seconds, and when it reappears,
    the captured desktop appears in the Preview pane.

    +   6. Save the file. If you are satisfied with the way the screen capture appears
    in the Preview pane, click the Save button. You now have a picture of your desktop,
    which you can use in any of the graphics programs that you learned about in the
    last half of this hour.


    # Summary


    This hour was filled with some entertaining and creative uses for your Linux system.
    You learned how to use your computer as a stereo system and how to keep track
    of your music CDs by using one of the online CD database servers. You also saw
    how to watch movies on the monitor screen. The end of the hour introduced you
    to just a few of the graphics applications that may be installed on your system.
    There''s more fun and entertainment stashed away in the computer—look around and
    see what you can find.


    # Q&A


    Q Some of the applications that were previewed in this hour aren''t installed
    on my computer. What should I do?


    A Chances are good that these applications are on the CD-ROM for the Linux distribution
    that you installed. Turn to Hour 15, "Installing Software," to learn how to install
    the needed files from the distribution CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 376
  md: "# Q I have a collection of MP3 music files. Are there any MP3 players for Linux?\n\
    \nA You'll find several MP3 players for Linux. The most popular is the X Multimedia\
    \ System (also known as xmms). The xmms player contains a graphical equalizer,\
    \ a playlist, and a wide selection of skins that change the look of the player.\
    \ You may also want to try the KMP3 player and eMusic.\n\n# Q Can I use image\
    \ files that I created using a program for the Windows operating system in a Linux\
    \ program?\n\nA You most certainly can. The graphics programs found in Linux support\
    \ all the popular image file formats (and even most of the unpopular formats).\
    \ The most versatile program is The Gimp, which will do almost anything you need\
    \ from a graphics program.\n\n# Q What if I don't have any image files? Where\
    \ can I find some?\n\nA There are many places to find images. If you're connected\
    \ to the Internet, do a search for free Web graphics. There's also quite a collection\
    \ of images stored in the system. Navigate to the /usr/share directory and look\
    \ for icons, pixmaps (the Linux version of a bitmap image), backgrounds, and other\
    \ images.\n\n# Workshop\n\nTest your knowledge of the material covered in this\
    \ hour by answering the following questions and working through the exercises.\n\
    \n# Quiz\n\n+   1. How can you use a CD player to list the artist and the songs\
    \ on your favorite music CDs?\n+   \n+   Many of the Linux CD players have the\
    \ capability to download album information from a CD database. You need to be\
    \ connected to the Internet to access these databases. When you are connected,\
    \ place a CD in the CD-ROM drive and tell the player that you want to download\
    \ the album information. After the information is downloaded, it is stored on\
    \ your computer. Each time that you pop that CD into the computer, the player\
    \ automatically lists the artist and the song that is playing.\n+   \n+   2. What\
    \ movie file formats are supported by programs such as Kaction?\n+   \n+   Many\
    \ of the popular movie formats—including AVIs, animated GIFs, and QuickTime animations—can\
    \ be viewed from Kaction.\n+   \n+   3. What are some of the graphics programs\
    \ that you might find in your Linux system?"
  merge: -1
  img_proc: true
