  md: '# Hour 5


    # Getting Acquainted with the Shell


    As you follow along in the hours to come, you''ll learn how to type a few words
    on the infamous Linux command line and have the Linux operating system do what
    you want done. This magical rapport is accomplished with the help of a small Linux
    program called a shell. The shell program is the interpreter through which you
    communicate with the operating system. As you type in a command at the shell prompt,
    it is interpreted and passed to the Linux kernel. The kernel, in turn, tells the
    computer what to do.


    In this hour, you will


    +   - Learn how shells interact between you, the user, and the Linux kernel

    +   - Use environment variables to customize the look and behavior of the shell

    +   - Edit text on the command line, and recall previously used commands

