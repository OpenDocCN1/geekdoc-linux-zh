- pgno: 224
  md: '![](img/782ecfdc0b083a767896cc983e10427f_224_0.png)


    # Hour 13


    # Working with Processes


    One of the advantages of Linux is its smooth management of CPU and memory resources.
    Every time you issue a command, or start a program, Linux goes to the filesystem
    to make a copy of the program. Linux then places the copy in the computer’s memory.
    After the copy is in memory, the shell executes the program, thereby starting
    a process. Each process is maintained and managed through the shell program. During
    this hour, you will use the bash shell to learn how Linux starts and manages processes.


    In this hour, you will:


    +   - Learn how to start and stop a process

    +   - Determine how your system is using memory resources

    +   - Find utilities that will help you monitor system resources'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# What Is a Process?


    As you’ve wandered through the hours, testing out different commands, maybe writing
    a few shell scripts, you’ve been spawning processes and not even knowing it. In
    Hour 5, "Getting Acquainted with the Shell," you learned how the bash shell acts
    as the interface between the user and the Linux kernel and interprets the instructions
    from the user. For each command that the user issues, the shell spawns a clone
    of itself to execute the command. The clone is called a child process. The relationship
    between the shell and its clone (or subshell) is described as a parent/child relationship.
    After the command has been handed off to the child process (the subshell) for
    execution, the parent process (the shell) goes back and waits for another job.
    When it receives another command, it spawns another child process.


    New Term A process is an activity running in memory to perform the actions called
    for by the execution of a command. Commands can be input on the command line by
    the user, contained in a shell script, or input by another process running in
    memory like the desktop GUIs. When the process has finished its job, it is removed
    from memory, thereby making CPU time available for other processes. A typical
    system runs about 50 processes at one time and each process is assigned a unique
    identification number.


    ![](img/782ecfdc0b083a767896cc983e10427f_225_0.png)


    > There are some commands for which the shell doesn’t spawn subshells. These are
    the shell commands that are called built-ins. The shell itself carries out the
    actions called for by the built-in commands.


    # Types of Processes


    Processes can be divided into three basic categories as far as the user and interaction
    are concerned:


    +   - Interactive processes require input from the user. An interactive process
    may be a program that you run, such as a text editor or a graphics program.

    +   - Batch processes execute automatically requiring no user interaction. A batch
    process may be a script that you write to back up your home directory at a specific
    time.

    +   - Daemon processes provide services to the user and applications while running
    in background. You start some daemon processes at startup, such as the one that
    takes over when a file is sent to the printer (lpd the line printer daemon) or
    the PPP daemon that jumps in when you ask the system to dial your ISP and start
    a PPP connection to the Internet.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# The Syntax for the ps Command


    The ps command can be used along with several options to provide tailored information
    about the processes that are running on your system. The syntax of the ps command
    is


    ```

    ps [options]

    ```


    When the ps command is used by itself, it displays only those processes that are
    currently active, the process identification number, and the command as it was
    typed at the shell prompt. The ps command can display more information about each
    process by adding command options. Here are a few command options you might find
    useful:


    +   - When you want to display running and stalled processes, type ps ax and press
    Enter. This might be a long list. If so, you can pipe the output to the less viewer
    (with the ps ax | less command).

    +   - By default, the ps command shows only the command as it was typed on the
    command line. To see the actual command that was executed (including the full
    directory path to the command), type ps e and press Enter.

    +   - To view just background processes, type ps x and press Enter.

    +   - When you want to know which users have executed the various running processes,
    type ps u and press Enter. This listing also shows the amount of CPU and memory
    usage used by the process. (This command may require root access.)


    # Task: Creating a Process


    It''s time to see what this techno-speak about processes is all about and watch
    a few processes in action. Because you''ll probably spend most of your computer
    time behind a graphical user environment (such as KDE or GNOME), open a terminal
    emulator program and learn the simple ins and outs of executing and killing a
    process.


    +   1. Log in to your user account and start the X Window System to display your
    favorite desktop environment.

    +   2. Open a terminal emulator program. You''ll find icons on the GNOME and KDE
    panels, or open the menus and begin looking. Figure 13.1 shows the KDE desktop
    using the Konsole terminal emulator.

    +   3. At the command line, type ps and press Enter. The processes that are currently
    running display in the terminal emulator. Your output might be similar to the
    following:


    ```

    [dezi@localhost dezi]$ ps

    PID TTY TIME CMD

    2666 pts/0 00:00:00 bash

    2679 pts/0 00:00:00 ps

    [dezi@localhost dezi]$

    ```'
  merge: -1
  img_proc: true
