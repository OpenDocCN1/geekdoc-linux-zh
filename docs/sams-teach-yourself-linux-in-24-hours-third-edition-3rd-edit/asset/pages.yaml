  md: '# Task: Tracking System Resource Usage


    The top utility offers another way of viewing the processes on your machine. This
    utility can be used to determine which resources each process is using. It also
    provides an interactive interface in which you can manage processes such as changing
    the priority of a process or interactively killing a process. The top utility
    is somewhat of a resource hog itself so don''t be surprised if it shows up at
    the top of the list. This task shows you how to use the top utility:


    > top has many interactive commands that you might want to try. To get the whole
    rundown on top, look at the manual page (type `man top` at the shell prompt).


    +   1. Start the top utility. Open a terminal emulator window if you are using
    the X Window System. Type `top` and press Enter. An example is shown in Figure
    13.3.


    FIGURE 13.3

    Use the top utility to see which processes are using valuable system resources.


