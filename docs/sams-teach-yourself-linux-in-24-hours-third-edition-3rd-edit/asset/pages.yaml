- pgno: 25
  md: '# Practice Your Skills


    Tasks lead you on a step-by-step tour of the information covered in each hour.
    By following along with the tasks, you can practice real-world implementations
    of concepts, commands, programs, and scripts.


    # Special Fonts


    Many elements are presented in a font that is different from the rest of the text.
    Here’s what they mean and how to treat them:


    +   - Words that appear in *italics* are technical terms that are explained the
    first time they are used in the book.

    +   - The commands, utility programs, lines of code, statements, and script names
    are displayed in a plain `monospace` font. In other words, any terms used as code
    or are used in the process of creating or using code uses this special font. You’ll
    also find that any featured Web sites appear in the plain monospace font.

    +   - Any input that you need to type to perform the tasks described or to follow
    along with the lessons appears in a **bold monospace** font.

    +   - The *italic monospace* font designates variables. Variables are placeholders
    in a command that need to be replaced by an actual filename or command option.


    # Chapter Wrap Up


    After reading a chapter, you might have a few questions, need help clarifying
    tasks, or want to learn more about a topic. A Q&A section provides a list of frequently
    asked questions about the topics covered during the hour. It answers specific
    questions and helps you review the material presented in the chapter. The “Workshop”
    section contains a quiz that tests your knowledge of the subject matter and exercises
    that help you practice what you’ve learned. You might even find that you learn
    new things by working the exercises.


    We hope that you enjoy yourself as you explore the Linux operating system while
    working through these 24 hours, and that you find the information covered in each
    hour to be valuable.'
  merge: -1
  img_proc: true
