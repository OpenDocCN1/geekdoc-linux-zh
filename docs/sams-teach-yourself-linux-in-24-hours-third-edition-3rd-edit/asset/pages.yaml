    # Summary


    In this hour, you learned how important it is to plan a backup schedule and to
    maintain backups of important files. You learned how you could simply use the
    cp command to make a copy of a file on a floppy disk. You also learned how to
    compress files with the gzip command and how to create file archives with the
    tar command. Now that you have a few tools, it''s time to create your own backup
    plan that will help you keep your business running even when your computer stops.


    # Q&A


    Q Are there any other backup commands or utilities I can use to back up my files?


    A The cpio command works much the same way as the tar command, but with different
    command options. There''s also the zip command for compressing files. A popular
    utility is the BRU2000 backup system (available at www.estinc.com), which will
    work with a Zip drive.


    Q How long should I keep copies of backed up files?


    A That''s a hard question to answer. You need to consider how important the data
    is and how frequently you access the data. This will give you some idea how long
    you need to keep the backed up files on the storage media. If there are certain
    files you only use every month, you may want to keep backups of these files for
    eight weeks. After the eight weeks are over, you can recycle the backup media
    by erasing the data on the media and using it for your next backup. You may have
    files you created for a client or a project that you need to archive. You may
    want to store these files for several years on a long-lasting storage medium (such
    as a CD-R/W).'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Q What if I don''t know what is contained in a compressed file? Is there any
    way I can see what is in the file?


    A You can read the contents of a compressed file (that is, any file with the .gz
    or .Z extension) with the zcat command. To use the zcat command, type `zcat filename`
    and press Enter. The text will appear on the screen. The zcat command does not
    uncompress the file; it''s only a viewer.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    # Quiz


    1. What are the most important files on the Linux system that need to be backed
    up on a regular basis?


    Configuration files should be backed up before a configuration change is made
    and after a configuration is made. Most configuration files are found in the `/etc`
    directory; other configuration files are found in the `/usr/lib` directory. X
    Window System configuration files are usually found in `/usr/X11R6/lib/X11`, and
    kernel sources are located in `/usr/src/linux`. In addition, user files in the
    `/home` directory as well as files for the superuser in the `/root` directory
    need to be backed up.


    2. What is the easiest way to back up a small number of files?


    The easiest way to back up a small number of files is to copy them onto floppy
    disks by using the `cp` command.


    3. What types of storage media can you use to back up important data?


    You can use several types of media, depending on your needs and budget. The least
    expensive media is the floppy disk, which works great for storing just a few files
    or for archiving small directories. Zip and Jaz drives are probably the most useful
    storage media for most users. Most people could back up their home directories
    and important configuration files on one or two Zip or Jaz disks. When you want
    to back up the entire system, you might want to consider backing up to a second
    hard drive. This way, if a hard drive crashes, you can easily replace the crashed
    drive with the backup drive. Of course, this can be done with tape drives as well.
    Another storage medium that is gaining popularity is the recordable CD-ROM drive.
    Recordable CDs can contain as much as 650MB of data.'
  merge: -1
  img_proc: true
