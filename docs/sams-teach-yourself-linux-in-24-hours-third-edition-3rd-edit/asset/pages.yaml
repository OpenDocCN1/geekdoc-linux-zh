- pgno: 272
  md: '# Hour 17


    # Automating System Administration Tasks


    The odds are very good that you''re the system administrator for your Linux system.
    This means that to you fall all the chores of maintaining and operating the system
    for the benefit of your users. This is true even if you have only one user on
    the system. The job isn''t so big if you are the only user, but it becomes cumbersome
    quickly, and there are many things to be done. During this hour, you''ll begin
    to get a handle on system maintenance tasks by having Linux take over the repetitive
    and boring parts. This will free you to pursue the lighter side of exercising
    system administrator powers while sipping your morning coffee.


    In this hour, you will


    +   - Learn about error files

    +   - Edit some files to automate tasks

    +   - Schedule routine tasks with cron


    ![](img/782ecfdc0b083a767896cc983e10427f_272_0.png)'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Dealing with Program Crashes


    It''s not an everyday occurrence in Linux, but every now and then, a program crashes.
    You know the routine... everything is working fine, then all of a sudden, the
    program hoses and either locks up on you or disappears into thin air. When this
    happens, the system creates a core dump file that contains all kinds of information.
    As you can tell from the core dump in Figure 17.1, much of this information looks
    like gibberish. But, to the trained eye, it contains important debugging information.


    **New Term** A core dump is a file that is written to your home directory whenever
    there is a failure (also known as a crash) somewhere in the system. A core dump
    contains the process information that is stored in memory at the time of the failure.


    FIGURE 17.1

    The contents of a core dump file.


    ![](img/782ecfdc0b083a767896cc983e10427f_273_0.png)


    Looking at Figure 17.1, you''ll notice that the core dump file can be quite large.
    In this example, the core dump file is 8,738 lines long (and almost 2MB in size).
    That''s a lot of used space on your hard drive and a ton of reading material.
    If a core dump appears in your home directory, you can read the contents in the
    less pager. To do this from the command line, change to the directory in which
    the core dump file is stored and type less core.


    One way to find the cause of a core dump is to use a debugging program such as
    gdb (as shown in Listing 17.1). Toward the end of the listing, you''ll see that
    the program that caused the error was kshow, and it failed because of a segmentation
    fault. There''s quite a bit more that you can do with the gdb debugging program,
    but unfortunately,'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'programming is beyond the scope of this book. If you''d like to know more about
    the debugger, read the manual page (type man gdb at the command line).


    # LISTING 17.1 Determining the Cause of a Core Dump


    ```

    [root@localhost root]# gdb -c core

    GNU gdb 1999116

    Copyright 1998 Free Software Foundation, Inc.

    GDB is free software, covered by the GNU General Public License, and you are welcome
    to change it and/or distribute copies of it under certain conditions.

    Type "show copying" to see the conditions.

    There is absolutely no warranty for GDB. Type "show warranty" for details.

    This GDB was configured as "i586-mandrake-linux".

    Core was generated by `kshow''.

    Program terminated with signal 11, Segmentation fault.

    #0 0x8063fec in ?? ()

    (gdb) q

    [root@localhost root]#

    ```


    # Task: Limiting the Size of Core Dumps


    Because most Linux newbies might not be interested in having core dump files take
    up valuable hard drive space, it is possible to limit the size of a core dump.
    You can set a specific size for a core dump, or you can choose to not have it
    appear on your system at all. Here''s how to limit the size of a core dump:


    +   1. Display the core dump size. To see the limit that is set for the size of
    core dumps on your system, type ulimit -c at the shell prompt and press Enter.
    Here''s an example of the output you might see:

    +   2. Prevent core dumps from appearing on your system. Type ulimit -c 0 and
    press Enter.

    +   3. Display the core dump size. Type ulimit -c and press Enter. Your output
    should look like the following:


    ```

    [root@localhost root]# ulimit -c

    100000

    [root@localhost root]#

    ```


    ```

    [root@localhost root]# ulimit -c

    0

    [root@localhost root]#

    ```'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Looking at System Log Files


    Linux keeps track of all kinds of system information in log files. These files
    are stored in different places and are maintained by the syslogd daemon. The syslogd
    daemon is started when the system boots and knows what type of information to
    store based on the contents of the /etc/syslog.conf file (shown in Figure 17.2).
    After the syslogd daemon knows where it should log system information, it goes
    merrily about its business once a minute, collecting messages from everywhere
    and entering them in log files.


    FIGURE 17.2

    Type less /etc/syslog.conf and press Enter to see where system log files are stored.


    ![](img/782ecfdc0b083a767896cc983e10427f_275_0.png)


    You can also look in the /var/log directory to find the logs maintained by the
    syslogd daemon. Here are a few of the system logs that you''ll find:


    +   - The /var/log/messages file is the main system log and contains the information
    gathered by the kernel when the system was last booted.

    +   - The /var/log/wtmp file contains the login time and duration for each user.

    +   - The /var/log/utmp file is where information about currently logged-in users
    is kept.

    +   - The /var/log/lastlog file is where user login times are stored.


    As you can see, with all these system log files and new information added every
    minute, log files can get out of hand quickly. To keep from being buried under
    the information overload, you''ll need to monitor the status of system log files
    and periodically clean them out. Because the logs are a valuable source of information
    about your system, and some are used by commands that the system runs, you shouldn''t
    just delete them. You probably will want to keep them for a specified time in
    an archive before you'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'purge them. Keep in mind that they do take up a lot of space and need to be
    moved to another storage area (perhaps to a removable media filesystem), or compressed
    and retained for a specified time and then removed.


    # Task: Managing System Logs


    The logrotate command gives you the tools you need to control the disposition
    of all your system log files. The logrotate command offers a means for emptying
    out all the data in a logfile and then compressing, rotating, or mailing it. But,
    before you can use the logrotate command, you must edit the configuration file
    so that logrotate knows how to rotate system log files.


    +   1. Open the `/etc/logrotate.d/syslog` file in your favorite text editor. An
    example (using the Gedit text editor) is shown in Figure 17.3.


    FIGURE 17.3

    The default configuration file for the logrotate command.


    ![](img/782ecfdc0b083a767896cc983e10427f_276_0.png)


    +   2. Tell the system to compress all log files with the gzip command after they
    are rotated. Create a new line at the top of the file and type `compress` on the
    blank line. Any commands that appear at the top of the file are applied globally;
    that is, these commands are applied to every system log file that is listed.


    +   3. Tell the system to rotate the `/var/log/messages` log file three times
    before the oldest copy is deleted. Create a blank line after the line that reads
    `"/var/log/messages {"` and then type `rotate 3` and press Enter. This is a local
    command because it only applies to the `/var/log/messages` file.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '4. Tell the system to rotate the /var/log/messages file monthly. On the blank
    line you created in step 3, type monthly and press Enter. The /var/log/messages
    file will be rotated the first time that the logrotate command is executed during
    a month.


    5. Tell the system to move the /var/log/messages file to the home directory for
    the superuser. In the blank you created in step 4, type olddir /root. Your file
    should now look like the one in Figure 17.4.


    # FIGURE 17.4 Proof your configuration changes before you close the file.


    ![](img/782ecfdc0b083a767896cc983e10427f_277_0.png)


    6. Make changes to the other system log files. Table 17.1 shows other commands
    that you can use to change how these system log files are handled.


    # TABLE 17.1 Commands to Tell logrotate How to Rotate Log Files


    | Command | Description |

    |---|---|

    | compress | Compresses old logs with gzip |

    | daily | Rotates logs daily |

    | delaycompress | Compresses logs on next rotation |

    | errors mailto | Mails errors to specified address |

    | ifempty | Rotates empty log |

    | mail mailto | Mails logs to specified address when deleting |

    | monthly | Rotates logs monthly |'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Table 17.1 continued


    | Command | Description |

    |---|---|

    | nocompress | Doesn''t compress |

    | noolddir | Doesn''t move to another directory |

    | notifempty | Doesn''t compress empty log |

    | olddir directory | Moves old logs to specified directory |

    | postrotate | Runs script after log is rotated |

    | prerotate | Runs script before log is rotated |

    | rotate n | Specifies the number of old logs to retain |

    | size n | Rotates when log reaches a specified number of bytes (k for kilobytes,
    m for megabytes) |


    +   7. Save the file and close the text editor.

    +   8. Run the logrotate command to try out your new configuration changes. At
    the shell prompt, type `logrotate /etc/logrotate.d/syslog` and press Enter.


    Now when you go back to the /var/log directory, you''ll see several files for
    the messages system log file. All the files will be compressed. As the messages
    logs are rotated, the new log becomes messages, the current log is saved as messages.1,
    old messages.1 becomes messages.2, and so on.


    ![](img/782ecfdc0b083a767896cc983e10427f_278_0.png)


    # Creating a Comfortable Work Environment


    Not only are safe work environments regulated by the Occupational Safety & Health
    Administration (OSHA), but they are essential in maintaining a productive and
    happy workforce. Even if you run a small business out of your garage, you must
    still ensure the health and safety of your most valuable employee—you! It might
    be a good idea to insure yourself also, so be sure and get a good policy.


    According to the Bureau of Labor Statistics, musculoskeletal disorders (MSDs)
    represent one-third of the work-related injuries and illnesses in the United States.
    MSDs are caused by repetition, poor posture, lack of movement, force, vibration,
    and cold temperatures. OSHA encourages all employers to implement ergonomic programs;
    learn how at www.osha-slc.gov/SLTC/ergonomics. If you are curious about the standards
    being developed by OSHA, read the FAQ at www.osha-slc.gov/ergonomics-standard/faq-overview.html.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'A large number of MSDs are caused by long periods spent at the computer. If
    you''d like to prevent some of the repetitive strain injuries suffered by old-time
    computer users, experiment with a few ergonomic techniques. You might want to
    look up Ergoworld (at www.interface-analysis.com/ergoworld). Ergoworld contains
    links to about every ergonomic, repetitive strain injury, and injury prevention
    Web site in cyberspace.


    The easiest ways to prevent computer-related injuries are to sit up straight to
    avoid fatigue and back problems, learn keyboard commands and short-cuts to reduce
    repetitive strain injuries caused by the mouse, and walk away from the computer
    regularly to delay burnout.


    # Task: Using cron to Rotate System Logs Automatically


    Now that you''ve set up a system for rotating system logs, you might want to have
    the computer do this automatically. In this task, you will use cron to run the
    log rotation command at 6:50 p.m. on the 1st and 15th of every month.


    +   1. Decide when you want cron to run the log rotation. Figure 17.5 shows how
    the information should be arranged in the file.


    FIGURE 17.5

    Use acceptable values to fill in each field.


    ![](img/782ecfdc0b083a767896cc983e10427f_279_0.png)


    +   2. Open a new file called rotatelogs in your favorite text editor and store
    it in your home directory.


    +   3. In the text editor, type the following:


    ```

    50 18 1,15 * logrotate /etc/logrotate.d/syslog

    ```'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'The third field (1,15) shows the command running on the 1st and 15th day of
    the month. You can use a comma to separate several values within a single field.


    The fourth field (*) tells the command to run this command every month. When you
    want the field to contain all possible values, use the asterisk (*) character.


    The fifth field is empty (indicated by a blank space) showing that the command
    is not dependent on running on a certain day of the week.


    The sixth field is the command that is to be executed based on the time set in
    the first five fields.


    +   4. Save and close the file.

    +   5. Set up the file so that it is recognized by the cron daemon. Type `crontab
    rotatelogs` and press Enter.

    +   6. View your crontab file. Type `crontab -l` and press Enter. The crontab
    listing appears in Listing 17.2.


    # LISTING 17.2 The crontab Entry


    ```

    [root@localhost root]# crontab -l

    # DO NOT EDIT THIS FILE - edit the master and reinstall.

    # (rotatelogs installed on Mon Jul 10 22:44:12 2000)

    # (Cron version — $Id: crontab.c,v 2.13 1994/01/17 03:20:37 vixie Exp $)

    50 18 1,15 * * logrotate /etc/logrotate.d/syslog

    [root@localhost root]#

    ```


    7. View the crontab listing. There should be a file in the /var/spool/cron directory
    that uses your username as the filename. For example, because the superuser created
    this crontab entry, the file would be located at /var/spool/cron/root.


    After this file is set up, you don’t have to do anything else to make sure that
    the logs are rotate according to your needs. You can create other crontab entries
    using this same procedure. Any other crontab entries that you make will be added
    to your file in the /var/spool/cron directory.


    # Summary


    During this past hour, you learned how to perform some basic system administration
    tasks to help reduce the storage load on your hard drive. You then learned how
    to automate this task using the cron daemon. This hour explored just a few of
    the ways that you can increase hard drive space and automate routine system tasks.
    As you learn more about your Linux system, you’ll find many more ways to automate
    routine tasks.'
  merge: -1
  img_proc: true
- pgno: 281
  md: "# Q&A\n\nQ I understand that cron will run a command many times depending on\
    \ the parameters set in the crontab entry. But what do I do if I want to schedule\
    \ a command to run only one time?\n\nA When you want to run a command or a process\
    \ only once, you can use the at command. The at command can be used to queue a\
    \ job for execution at a specified time and to examine or delete the jobs queued\
    \ for later execution. To use the at command, type at followed by the time at\
    \ which you want the command to run and press Enter. On the next line you'll see\
    \ at>. Type the command and press Enter. When you are finished entering command,\
    \ press Ctrl+D.\n\nQ Is it possible to add my own manual pages to the system so\
    \ that I can access them with the man command?\n\nA Yes. You can create a plain\
    \ text file and then store it in the appropriate directory under /usr/man. For\
    \ more instructions, read the Linux Man Page mini-HOWTO.\n\n# Workshop\n\nTest\
    \ your knowledge of the material covered in this hour by answering the following\
    \ questions and working through the exercises.\n\n# Quiz\n\n+   1. What is a core\
    \ dump and what will you find inside the core dump file?\n+   \n+   When a program\
    \ crashes or when there is some other error while you are working in Linux, a\
    \ core dump is written to a file. This file is written to your home directory.\
    \ The core dump file contains the process information that is stored in memory\
    \ at the time of the failure. There is a lot of information in this file, but\
    \ it takes someone with programming skills to really understand what is going\
    \ on. You might be able to find out what caused the core dump by running the gdb\
    \ program.\n+   \n+   2. What can you do if you do not want core dump files stored\
    \ on your computer?\n+   \n+   You can set a limit on the size of a core dump\
    \ file with the ulimit command. To set the core dump size to zero (which means\
    \ that no core dump file can be written), use the ulimit -c 0 command.\n+   \n\
    +   3. What are a few of the system log files that you'll find in the Linux filesystem?\n\
    +   \n+   The main system log is called /var/log/messages and contains information\
    \ gathered by the kernel during the boot process. The login time and the duration\
    \ of a user's session are stored in the /var/log/wtmp file. When you want to know\
    \ which"
  merge: -1
  img_proc: true
- pgno: 282
  md: 'users are currently logged in to the system. look at the /var/log/wtmp file.
    If you only want to see user login times, look in the var/log/lastlog file.


    4. Which command makes it easy to rotate system logs so that they don’t pile up
    on the system and use up a lot of space?


    The logrotate command controls how system log files are handled. The logrotate
    command can be set up to empty the data in a logfile by saving it to another file
    that can be compressed, deleted, or mailed to a user on the system. The logrotate
    command operates based on information found in a configuration file.


    5. What are the six fields that are contained in a crontab entry?


    The first field is the number of minutes after the hour that you want the command
    to run. It can use a value between 0 and 59. The second field is the hour at which
    you want the command to run. This field uses a 24-hour clock and the acceptable
    values that can be used are between 0 and 23. The third field is the date during
    the month on which you want the command to run. Acceptable values are 1 to 31.
    The fourth field is the month and can use two different types of values: You can
    either use a number to indicate the month (from 1 to 12), or you can use the three-letter
    abbreviation for the month (such as Jan for January). The fifth field is the day
    of the week on which you want the command to run. The value can be from 0 to 6,
    or you can use the three-letter abbreviation for the day (such as Sun for Sunday).
    The sixth field is the command that you want to run automatically at the time
    specified in the first five fields.


    # Exercises


    +   1. Experiment with the crontab command and see whether you can schedule a
    few jobs of your own to run at specific times on specific days. You might want
    to read the cron and crontab manual pages to learn more about these commands.
    For example, after you have an Internet connection set up, you may want the cron
    daemon to dial up your ISP and download your email every morning before you start
    work.

    +   2. Are you interested in becoming certified on the Linux operating system?
    The Linux Professional Institute offers three levels of professional certification.
    To get ready for the tests, visit the Linux Professional Institute Web site (www.lpi.org)
    and read the certification objectives. You’ll find books that are specially written
    to help you study for these tests. You’ll also find much of the information needed
    by a junior-level system administrator to pass the LPI level I certification tests
    in books such as this one. When you think you are ready, register at one of the
    testing centers, get a good night’s rest before the test, and good luck!'
