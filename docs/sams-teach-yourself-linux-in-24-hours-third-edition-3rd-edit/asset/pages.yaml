    # APPENDIX A


    # Getting Started with the KDE Desktop Environment


    Although the majority of this book covers working with the Linux operating system
    from the command line, you might still feel more comfortable using a graphical
    interface when working with word processors, graphics programs, Internet tools,
    and other applications. To use a graphical interface with Linux, you must first
    install and configure the X Window System (which is covered in Hour 18, "Installing
    the X Window System"). After the X Window System is set up, you have a variety
    of desktop environments from which to choose.


    Two of the most popular desktop environments are the K Desktop Environment (KDE)
    and GNOME. Both are included with most Linux distributions. You''ll find that
    both KDE and GNOME have a familiar look and feel, similar to that of the Microsoft
    Windows and Apple Macintosh graphical user interfaces. This appendix covers KDE,
    which you might find used as the default user interface by many Linux distributions.
    In this appendix, you will explore KDE and learn how to'
  merge: -1
  img_proc: true
- pgno: 381
  md: '+   - Identify and work with different elements on the KDE desktop

    +   - Manipulate windows on the desktop and change how windows behave

    +   - Work with more than one desktop area at a time

    +   - Customize the appearance of the desktop


    # Understanding Desktop Elements


    When you first start KDE, you''ll see a number of familiar elements and some brand-new
    ones on the desktop. Here''s an introduction to what you''ll find on the KDE desktop.
    You''ll learn how to customize a few of these elements to suit your needs and
    tastes later in this appendix.


    ![](img/782ecfdc0b083a767896cc983e10427f_381_0.png)


    > The desktop shown in Figure A.1 is the default KDE desktop for the Linux-Mandrake
    distribution. Depending on the distribution installed on your system, your desktop
    might look different and contain different desktop icons. Some Linux distributions
    place icons on the desktop that link to their Web sites. If you''re connected
    to the Internet, you can easily look up information and contact technical support
    for your particular distribution simply by clicking the desktop icon.


    NEW TERM The desktop (or root display) is the background for all the elements
    that appear on the screen. On the desktop, you''ll find desktop icons, which are
    shortcuts to applications, files, and folders. Desktop icons make it quick and
    easy for you to access files and programs used most often. The desktop background
    color can be changed to a different color, a combination of colors, or can be
    replaced by an image file (any file in the JPEG format will work).


    The taskbar runs along the top of the screen and contains icons for all the applications
    that are running on your system. The taskbar displays icons for any window that
    is open, and icons for windows that are minimized. To display a window on your
    screen (whether the window is hidden behind other windows, or is minimized), click
    the icon on the taskbar.


    Along the bottom of the screen, you''ll see the panel. The panel contains a number
    of items that make it easy for you to work within the desktop environment. The
    Application Starter appears at the far left and lists many of the programs and
    utilities that are installed on the system. Icons on the panel are another quick
    way to open applications. There''s also access to the virtual desktop, which enables
    you to open and work with applications on different desktop areas.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# FIGURE A.1


    KDE contains several ways to start programs and manage your desktop.


    ![](img/782ecfdc0b083a767896cc983e10427f_382_0.png)


    > To change the location of the panel or the taskbar on the desktop, right-click
    in empty space on the panel and select Configure. Make your changes from the Panel
    tab in the Configuration dialog box. To hide the taskbar or the panel when it
    is not needed, click the Options tab and place a check in the Auto Hide checkbox.


    # Task: Finding and Opening Applications and Utilities


    Before you begin learning how windows can be manipulated on the screen, you''ll
    need to open a few programs. This is a good time to explore some of the many applications
    and utilities that are installed with the Linux distribution.'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'KDE creates shortcuts in the Application Starter, which makes it easy to find
    and start some of the more popular programs. Here''s a quick tour of the Application
    Starter and some suggestions for programs that you might like to try:


    +   1. Hold the mouse pointer over an icon on the panel. You''ll notice that a
    screen tip appears and describes the program or utility that is launched when
    you click the icon.

    +   2. Find the KDE file manager icon. When you open the KDE file manager, your
    user home directory is displayed. The file commands found in Hour 7, "Moving Around
    the Filesystem," can be performed from the KDE file manager. Other Linux distributions
    and desktop environments use other graphical file managers. You''ll find that
    many of these file managers perform the same basic tasks (such as moving and copying
    files, and creating directories) and some have additional features (such as FTP).

    +   3. Click the Application Starter button to see a list of program categories.
    As you move the mouse pointer along the menu, items in the list are highlighted.
    If an arrow appears to the right of a menu item, a second menu appears when the
    mouse pointer rests on the menu item.

    +   4. Move the mouse pointer to Games. Here''s where you''ll find a number of
    fun and time-wasting games.

    +   5. Move the mouse pointer to Utilities. One utility in this list that you
    might find useful is KPackage. KPackage keeps track of packages that are installed
    on your system and can install more packages.

    +   6. Click the application with which you want to work. The application window
    for the application appears on the desktop and an icon for the application appears
    on the taskbar.

    +   7. Click Help, Contents to learn what a program does and how it operates.


    # Working with Windows


    When working in a graphical desktop environment, all programs and utilities appear
    inside a window (see Figure A.2). This window is a boxed area on the screen that
    contains the controls for the window, and the program with elements for user input.


    The Window menu lists all the actions available to change the size, state, or
    position of a window. Click the Window menu button to see the list of choices.
    Some of these choices also have an associated button on the title bar.'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'FIGURE A.2

    The anatomy of a window.


    ![](img/782ecfdc0b083a767896cc983e10427f_384_0.png)


    The title bar displays the name of the application that appears inside the window.
    To quickly move a window to a different place on the desktop, click and drag the
    title bar.


    When you want to change the size of a window, try the Minimize and Maximize buttons.
    You can also drag any side or corner of the window border to resize a window.


    # Task: Working with the KDE Control Center


    All the tools that you''ll need to change the way the desktop looks and operates
    are found in the KDE Control Center. The KDE Control Center contains a number
    of configuration modules that change the look of the desktop, display system information,
    set shortcut keys, and control the appearance of windows. You''ll work with the
    KDE Control Center to change the appearance of your desktop later in this appendix.
    Here''s how to open the KDE Control Center and find out how it works:


    +   1. Open the KDE Control Center (shown in Figure A.3) by using one of the methods
    listed in Table A.1.


    # TABLE A.1 Starting the KDE Control Center


    | From This Starting Point | Open the KDE Control Center By |

    |---|---|

    | KDE panel | Clicking the KDE Control Center icon |

    | Application Starter menu | Selecting KDE Control Center |

    | X terminal window | Typing kcontrol |'
  merge: -1
  img_proc: true
- pgno: 385
  md: '2. Click the plus sign next to a category to display the list of configuration
    modules found in that category.


    3. Click a list item to display a configuration module.


    # FIGURE A.3


    The KDE Control Center can help you manage the entire desktop.


    ![](img/782ecfdc0b083a767896cc983e10427f_385_0.png)


    4. Click Help to learn more about the configuration module. If you want to read
    the entire Help manual, click Help, Contents.


    5. Select options in the configuration module.


    6. Click Apply to make your changes.


    7. Click Default to undo any changes you have made and return the configuration
    to the original settings.


    8. Select another configuration module and make more changes.


    9. Click File, Exit to close the KDE Control Center.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# Using Windows on the Desktop


    If you''ve opened several applications, you''ll find windows of different sizes
    scattered around the desktop. With so many open windows, you need some way to
    organize them on the desktop to make it easier to do your work. The best way to
    find out how many different ways a window can be manipulated is to click the Window
    Menu button. It''s usually found on the left side of the title bar. Many of these
    menu items—those that are used most often—have an associated icon on the title
    bar.


    ![](img/782ecfdc0b083a767896cc983e10427f_386_0.png)


    > The buttons that appear on the right side of title bar can be moved to the left
    side of the title bar, and vice versa. Buttons can also be removed. This is done
    from the KDE Control Center (expand the Windows category to find the Buttons configuration
    module).


    New Term Here''s a trick for hiding a window when you aren''t working with it—double-click
    the title bar. You''ll see the bottom portion of the window "roll up" so that
    only the title bar remains on the desktop. When you want to work with the window,
    double-click on the title bar to see the window "unroll." This cool technique
    is called shading.


    The safest method to close a window is to first save any information that you
    have entered, close the file in which you are working, and then select the Exit
    or Close command from the program''s File menu. You can also use the Close button
    on the title bar, or use the Close command from the Window menu.


    New Term When working with several windows at one time, you need to make a window
    active before it can accept any input. This process of switching from one window
    to another usually involves an extra mouse click, and can be cumbersome at times.
    The process that controls how a window is made active is called focus policy.


    # Juggling Multiple Windows


    If you want to change the method used to make a window active, open the KDE Control
    Center, expand the Windows category, and select the Properties configuration module.
    At the bottom of the module box, you''ll find the focus policy options. Here are
    a few ways you can change the way a window becomes active:


    +   - To click inside a window to make it the active window, select the Click
    to focus option.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '+   - The Focus follows mouse option activates a window when the mouse is placed
    over the window. If the mouse is moved off a window and placed over the desktop,
    the window remains active until the mouse is placed over another window.

    +   - When you only want a window to stay active while the mouse is placed over
    it, choose the Classic focus follows mouse option. When the mouse is placed over
    the desktop, no windows are active.

    +   - If you want to combine the Focus follows mouse policy with a quick keyboard
    shortcut, try the Classic sloppy focus option. When using the Classic sloppy focus
    policy, press Alt+Tab to move between windows.


    > You can control how windows are positioned on the desktop when opened. Several
    options are available from the Placement policy list. The Cascade option gives
    the desktop a neat and tidy appearance. With this option, a new window covers
    up a previously opened window except for the title bar. This gives the windows
    a stair-step appearance.


    A quick way to keep your life simple when dealing with a number of open windows
    on your desktop is to let KDE clean up your desktop. When you''re not sure whether
    windows are hidden under other windows, right-click the desktop and select Cascade
    Windows. All the open windows will be arranged in a stacked formation so that
    the title bar for each window is visible.


    # Task: Looking to KDE for Help


    In Hour 6, "Looking at the Command Line," you learned how to use commands such
    as man, apropos, whatis, and find to search through the Linux operating system
    for information to help you use the operating system better. You''ll also find
    quite a bit of help within KDE. Here''s where to find the KDE help files and what
    they can do for you:


    +   1. Hold the mouse pointer over any element on the screen or in a window if
    you want a quick answer to the function that the element performs. A screen tip
    describes the function of the element.

    +   2. Open the KDE Help browser (shown in Figure A.4) by clicking the KDE Help
    icon on the panel or by selecting it from the Application Starter.'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# FIGURE A.4


    Click Goto, Contents to display the Welcome to KDE page.


    ![](img/782ecfdc0b083a767896cc983e10427f_388_0.png)


    Look up applications and utilities


    Browse the manual pages in HTML format


    Read the info pages


    Learn about KDE


    Search for information using keywords


    To learn more about the workings of the KDE desktop environment, click any of
    the links under the heading Getting the most out of KDE.


    Remember how to access the Linux manual pages and the GNU info pages from the
    command line? Another way to read these pages is to click System man page contents
    or System GNU info contents under the heading KDE Help Contents.


    To access a search similar to the keyword search provided by the apropos command,
    click Search for Keyword. In the page that appears, type the topic in the Enter
    Keywords text box.


    To explore the programs installed on the system, click KDE application help index.
    Browse through the list and click an application that interests you.


    3. When you find help files that you think you might need to refer to later, set
    a bookmark. Display the page in the KDE Help browser and click Bookmarks, Add
    Bookmark. To access a bookmarked help file, click Bookmarks to display the list
    of files you have bookmarked.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '4. Find help on the Internet.


    The first stop is the K Desktop Environment home page at www.kde.org/index.html.
    In addition to finding documentation about KDE, you''ll also find applications
    (such as Koffice) that run with KDE, mailing lists to answer KDE-related questions,
    and links to other sources of information.


    You can use themes to decorate the desktop and window borders. Several themes
    are available in the Themes configuration module found in the KDE Control Center.
    To find more KDE themes, start at kde.themes.org. This site contains themes that
    you can download and install on your system, and information on how to design
    your own theme.


    When you run into problems, you can post a question on the comp.windows.x.kde
    newsgroup.


    Now it''s time for you to explore on your own. As you visit the Web sites listed,
    you might find other sites of interest listed in these pages. Try out a few of
    these. You can also use any of the search engines to look for other sites (try
    KDE and K Desktop Environment as search terms).


    # Cruising Around the Desktop


    After you have a feel for moving around the desktop, you might want to make some
    changes so that the desktop is more useful and attractive. If you work with several
    applications at one time, Linux is a good choice because of its multitasking capabilities.
    You can compose letters, design a company newsletter, keep scheduled appointments,
    and surf the Internet all at the same time. If you use this many applications,
    you''ll need a method to keep your desktop organized.


    **NEW TERM** In the middle of the panel, you''ll find four buttons labeled One,
    Two, Three, and Four. These buttons move you among the virtual desktops. The virtual
    desktops are similar to having four monitors sitting on your desk. By clicking
    a virtual desktop button, a completely different desktop appears on your screen.


    To add some spice to an otherwise bland computer experience, change the appearance
    of the desktop and other screen elements. The desktop background can be filled
    by any image of your choosing. When you are away from your desk, give others a
    chance to view some moving art by setting a screensaver.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Navigating a Virtual Desktop


    If you work with several applications at one time, you may want to organize your
    work by using different desktops for each task. Different applications can be
    displayed on a different virtual desktop and each desktop can use a different
    background to help distinguish between desktops. For example, you might want to
    open an HTML editor and a graphics program on one virtual desktop where you are
    creating a Web site. On another virtual desktop, you can run an email program
    and a calendar to keep track of your daily business. And, on another virtual desktop,
    you can keep a chess game running that can hide easily when it''s time to get
    back to work.


    > it''s easy to get lost when working with more than one desktop. Don''t use more
    virtual desktops than you actually need, and give each desktop a descriptive name.
    To customize the virtual desktop settings, right-click on the panel and select
    Configure to display the KPanel Configuration dialog box. Click the Desktops tab
    and use the Visible slider to change the number of desktops. Then type a descriptive
    title for each desktop.


    But what do you do when you want a window to appear on all virtual desktops? Here''s
    where the Sticky button, found on the title bar, comes into play. If you need
    to keep your calendar in front of you to remind you of what needs to be done,
    make the window in which the calendar program resides sticky. This is done either
    by clicking on the Sticky button or by selecting Sticky from the Window menu.


    # Changing the Desktop Appearance


    Now it''s time to have a little fun and decorate the desktop. One way to spruce
    up the desktop is to use a color, a combination of colors, a pattern, or an image
    as the background for the desktop. When you want to hide the desktop while you
    are away from your desk, try a screensaver.


    # Changing the Desktop Background


    You''ll find a wide assortment of colors and wallpaper images that can be used
    to decorate the desktop background. To find these colorful images, start at the
    KDE Control Center, expand the Desktop category, and select the Background configuration
    module (shown in Figure A.5). If you are working with the virtual desktops, you
    can give each desktop a different background or make all the backgrounds the same
    (by placing a check in the Common Background checkbox).'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# FIGURE A.5


    The selection of background color and wallpaper combinations is virtually endless.


    ![](img/782ecfdc0b083a767896cc983e10427f_391_0.png)


    Work with virtual desktops


    Preview


    Select colors


    Let KDE shuffle through backgrounds


    > The background image does not need to be a static image. There are some animated
    backgrounds that are a lot of fun. One animated background that might be installed
    is a tropical fish tank. If you want to try this background, open an X terminal
    window and type xfish tank. But be warned: You might get lost waiting for the
    sharks to swim by.


    # The Screensavers They Are A-Changin’


    Screensavers are a great way to hide what’s on your desktop when you are aren’t
    working or are away from your desk. You’ll find all the available screensavers
    in the Screensaver configuration module. There are a number of settings (see the
    Screensaver configuration module in Figure A.6) that you can apply to any screensaver
    you select.


    Even though you can specify an amount of time your system must be idle before
    the screensaver starts, you can make the screensaver appear at your command. Right-click
    on any corner in the sample display and select Save Screen. Now, when you leave
    the computer and want to start the screensaver, move the mouse pointer to the
    same corner on your screen. The screensaver starts immediately, without a delay.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# FIGURE A.6


    Screensavers activate after a period of no computer activity.


    ![](img/782ecfdc0b083a767896cc983e10427f_392_0.png)


    > If you are away from your computer, it might be possible for others to work
    in your user account if you don''t log out of the account. To protect yourself,
    set a password for the screensaver by placing a check in the Require password
    checkbox. When the screensaver is active, the password for your user account is
    needed to disable the screensaver and return to the desktop.


    # Task: Deciding on a Desktop Environment


    You''ll find that a number of Linux distributions use KDE as the default desktop
    environment when you install the X Window System. But, depending on the packages
    you selected during the installation, there might be other desktop environments
    (such as GNOME, AfterStep, FVWM, and AnotherLevel) installed on your system and
    available to you.


    If you would like to explore some of these other desktop environments, you can
    use a tool called the Desktop Switcher to quickly alternate between desktop environments.
    Here''s how to use the Desktop Switcher to exchange KDE for GNOME as your default
    desktop environment:'
  merge: -1
  img_proc: true
- pgno: 393
  md: '+   1. Open the Desktop Switcher tool (shown in Figure A.7). Click Application
    Starter, System, Desktop Switching Tool. Or, open an X terminal window, type `switchdesk`,
    and press Enter.

    +   2. Click the GNOME option button if you want to explore the GNOME desktop
    environment.

    +   3. Place a check in the Change only applies to current display checkbox. This
    changes the interface for only the user account in which you are working.

    +   4. Click OK. A dialog box notifies you that you must restart the X Window
    System to switch to a different desktop environment. Click OK to close the dialog
    box.

    +   5. Exit KDE. Click the Logout button on the panel or select logout from the
    Application Starter to display the Session prepared for logout dialog box. Click
    Logout to return to the shell.

    +   6. Restart the X Window System. Type `startx` and press Enter. The X Window
    System will start (showing a black-and-white background and a large X-shaped cursor),
    followed by Enlightenment, and then, after a minute, GNOME appears on the screen.


    FIGURE A.7

    Change desktop environments on-the-fly.


    ![](img/782ecfdc0b083a767896cc983e10427f_393_0.png)


    # Summary


    This appendix provided you with a very brief introduction to the K Desktop Environment.
    You learned where to find some fun and useful applications, what makes windows
    tick, and how to use the KDE Control Center to change the appearance of the desktop.
    Even though this appendix didn’t get into much detail about the workings of KDE,
    it did provide a number of good resources for you to explore on your own. You
    can also check your local bookstore for books specifically about KDE. You’ll also
    find KDE information in many of the Linux books on the shelves. If you decide
    to stick with KDE, use these resources to help you use KDE efficiently. If you’re
    not sure about KDE, use the Desktop Switcher, turn the page to Appendix B, “Introducing
    GNOME and Linuxconf,” and give GNOME a test drive.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# APPENDIX B


    # Introducing GNOME and Linuxconf


    Next in the desktop environment lineup is GNOME. GNOME is another popular and
    powerful desktop environment. You''ll find enough information in this appendix
    to get up to speed with GNOME. After you''ve looked at KDE and GNOME, you can
    decide which desktop environment is right for you. Or, you might decide to keep
    looking at some of the other desktop environments that are compatible with the
    X Window System.


    Because we''re on the subject of graphical user interfaces, one way to make the
    file management task a little easier is with the aid of a file manager. Although
    GNOME uses the GNU Midnight Commander as its default file manager, other file
    managers, such as KDE Explorer and X WinCommander, are also available. When you''d
    like to take a rest from the command line, try a graphical file manager for a
    while.


    Over the past 24 hours, you''ve seen how to use commands to set up the system
    and how to edit files to make system configuration changes. Most distributions
    include a variety of configuration utilities that automate these tasks for you.
    One tool that you''ll find in many distributions is Linuxconf.


    ![](img/782ecfdc0b083a767896cc983e10427f_394_0.png)'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'Linuxconf can take care of many system administration and configuration jobs.
    To help you learn about GNOME, GNU Midnight Commander, and Linuxconf, you''ll
    spend this appendix learning how to


    +   - Identify and customize objects on the GNOME desktop

    +   - Work with the filesystem from the GNU Midnight Commander file manager

    +   - Make system configuration changes with Linuxconf


    # Exploring GNOME


    At the end of Appendix A, "Getting Started with the KDE Desktop Environment,"
    you used the Desktop Switcher to change desktop environments. As you look at the
    GNOME desktop (an example is shown in Figure B.1), you''ll see many familiar elements
    from the Microsoft Windows and Apple Macintosh operating systems, but some things
    might look a bit different.


    FIGURE B.1

    The GNOME desktop provides easy access to applications and can be customized to
    fit your style.


    ![](img/782ecfdc0b083a767896cc983e10427f_395_0.png)'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Looking at the Desktop


    The desktop is the background for all the elements found on the screen. The desktop
    can be customized with a different background color or wallpaper. window decorations
    can be changed, and a screensaver can be set to keep others from using the computer
    while you are away from your desk. Also found on the desktop are icons that open
    applications, files, and directories quickly. Programs and files that are used
    frequently can be placed on the desktop.


    ![](img/782ecfdc0b083a767896cc983e10427f_396_0.png)


    > Open the GNOME Help Browser to find help with the desktop, read the manual pages,
    and browse other sources of documentation. Click the Main Menu button and select
    Programs, Gnome, Help System.


    The panel lives at the bottom of the screen and contains the Main menu, various
    panel icons, a Desktop Guide, and a Tasklist. The panel can be customized to fit
    your needs. The panel can be moved to a different location on the screen, icons
    can be added to the panel to make it easy to start your most frequently used applications,
    and objects can be removed from the panel. To learn more about the panel and how
    it works, right-click on the panel and select Panel, Panel Manual to display the
    Gnome Help Browser.


    The Main menu contains a list of the applications, utilities, and other tools
    that are installed on the system. The panel icons are another way to quickly access
    programs and files that you use often. If there is a program listed in the Main
    menu that you use often, add this program to the panel. Right-click on the program
    name in the Main menu to display a menu, and then select Add this launcher to
    panel. Next time you want to use the program, just click the icon on the panel.


    The GNOME Desktop Guide and the GNOME Tasklist make it easy to manage windows
    on the desktop. The Desktop Guide controls the virtual desktops available on the
    system and, if you click the arrow at the left of the Desktop Guide, it displays
    a list of all open applications. The Tasklist shows all the applications that
    are open on a selected virtual desktop. When an application window is minimized,
    click the Tasklist icon to maximize the application.


    ![](img/782ecfdc0b083a767896cc983e10427f_396_1.png)


    > To customize the panel, right-click in an empty area of the panel and select
    Panel, Properties, All properties. To customize the Desktop Guide or the Tasklist,
    right-click on the object and select Properties.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Customizing the Desktop


    A little cosmetic surgery can go a long way in making the desktop more attractive.
    For a little spice, change the background image and add a screensaver. You can
    change the desktop background to a different color, a combination of colors, a
    pattern, or a picture. Then, to hide your work when the computer is not in use,
    select from one of the many screensavers for the X Window System. The appearance
    of the window borders can also be changed by selecting one of the many themes.
    These themes can also be customized to fit your taste.


    When you''re ready for a face lift, open the Gnome Control Center and check into
    one of the configuration modules. To find the Gnome Control Center, open the Main
    menu and select Programs, Gnome, Settings, Gnome Control Center. The Control Center
    shown in Figure B.2 illustrates how to use an image as the desktop background.


    FIGURE B.2

    Use the preview screen to see how the background will look on the desktop.


    ![](img/782ecfdc0b083a767896cc983e10427f_397_0.png)'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'Changing the desktop configuration is done from the Control Center, which groups
    the different options by configuration modules. To see the list of configuration
    modules, click the plus sign next to each of the different categories. Here are
    some changes that you might want to make to your desktop:


    +   - Have some fun with the desktop background and select the Background configuration
    module. Select from a variety of single colors to make a background that makes
    it easy to see other screen elements, such as windows and desktop icons. A two-color
    gradient blends one color into another on the desktop, which makes for a psychedelic
    look that''s also easy on the eyes. If you''d like a little more scenery, select
    a pattern or image file (you''ll find several in the /usr/share/pixmaps directory).
    You can even scan one of your own photographs and use it as your wallpaper.

    +   - Hide the panel when you don''t need it. The Panel configuration module not
    only turns off tooltips, it also sets the auto-hide delay for the panel, sets
    the default icons for launcher and menu icons, and sets the spacing between panel
    icons.

    +   - It''s a good idea to set the Screensaver configuration module to take charge
    of the system when it is not in use. The original idea for screensavers was so
    that a single static image did not display on the screen for a long period of
    time, thereby causing the image to become "burned" into the monitor. Screensavers
    also enable you to password-protect the screen so that others cannot use the computer
    while you are away.

    +   - The window manager controls the look of the window border; that is, the
    color of the title bar and the placement of the title and window buttons. If you
    want to change the look of the window dressings, click the Appearance configuration
    module for the default window manager.


    # Using the GNU Midnight Commander File Manager


    In Hour 7, "Moving Around the Filesystem," you learned how to navigate within
    the directory structure and sort files into directories by using commands. If
    your past experience is with the Windows and Macintosh operating systems, you
    might have felt as though you were flying blind while you worked without a graphical
    file manager. If you want to work with a graphical file manager, there are plenty
    of file managers to be found in the GNU/Linux world.'
  merge: -1
  img_proc: true
- pgno: 399
  md: '> There are many graphical file managers from which to choose, and the ones
    installed on your system will depend on which desktop environment you are using.
    KDE uses the K File Manager, whereas GNOME uses the GNOME edition of the GNU Midnight
    Commander. There are other file managers, such as Xfilemanager, that will run
    under any desktop environment controlled by the X Window System. In some desktop
    environments, the default file manager opens automatically when you log in to
    your account and displays the contents of your home directory.


    Although the number of graphical file managers might be overwhelming, they all
    work basically the same way—click the plus sign to expand the directory tree,
    and click and drag files from one directory to another. All the commands that
    you can perform with the file manager are contained in the menus. The most commonly
    used commands can be found on the toolbar. If you hold the mouse pointer over
    a toolbar button, a tooltip appears that tells you the command that the button
    executes. And, when you need more help, open the Help menu and look for any assistance
    that the program''s authors might have added to the file manager.


    Because most graphical file managers work in much the same manner, most of the
    tasks discussed in this section will work with the file manager of your choice.
    To illustrate how to use these file managers, the GNU Midnight Commander (shown
    in Figure B.3) is used as the example.


    # FIGURE B.3


    The file manager displays the contents of your home directory.


    ![](img/782ecfdc0b083a767896cc983e10427f_399_0.png)


    Expand to show subdirectories


    Return to your home directory


    Display list of files


    Collapse directory


    Select a directory


    Double-click to open file'
  merge: -1
  img_proc: true
- pgno: 400
  md: '![](img/782ecfdc0b083a767896cc983e10427f_400_0.png)


    > If the file manager you are using does not show a directory tree, you might
    be able to change the settings. In the K File Manager, select View, Show Tree.


    # Exploring the File Manager


    When the file manager opens, the list of files and subdirectories found in a selected
    directory appear as icons with only the filename as a description. The four buttons
    on the right side of the toolbar change the appearance of the icons and the file
    information that displays. Here is a brief description of each of the display
    options:


    +   - The Icons view gives a quick way to look at a file listing. The icons represent
    different file types, and the name of the file appears below the icon.

    +   - The Brief view is a simple listing of the directory contents. There are
    icons for directories only; files are shown as a filename only. This displays
    the same listing as the ls command.

    +   - The Detailed view lists the filename, the file size, and the date and time
    that the file was last modified.

    +   - The Custom view lists the filename, file size, and file permissions (which
    you learned about in Hour 12, “Sharing Files with Other Users on the System”).


    ![](img/782ecfdc0b083a767896cc983e10427f_400_1.png)


    > The information displayed in the Custom view can be customized. Select Settings,
    Preferences to display the Preferences dialog box. Click on the Custom View tab
    to add and delete columns from the file list.


    Before you can work on any files, change any filenames, or make copies of a file,
    the file must first be selected. The conventions for selecting files are pretty
    much the same from file manager to file manager (and even across operating systems).
    You can even have the file manager select files for you based on certain parameters
    that you specify.


    Selecting files using the mouse is relatively straightforward. Here’s a hint:
    Use the Brief or Detailed view to make it easier to select files. Try these tricks
    to select files with the mouse:


    +   - Click on a filename to select a single file.

    +   - Select contiguous files by clicking the first filename, holding the Shift
    key, and clicking the last filename in the block of files with which you want
    to work.

    +   - Select random files in the list by clicking on the first filename, holding
    the Ctrl key, and clicking on any other files that you want to select.


    ![](img/782ecfdc0b083a767896cc983e10427f_400_2.png)'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'If the files that you want to select all share a common element (such as a
    file extension or a combination of letters in the filename), use the file manager
    to select files for you. Click Edit, Select Files to display the dialog box shown
    in Figure B.4. Type the search criteria. Remember to use wildcards (discussed
    in Chapter 6, “Looking at the Command Line”) to help make a match. For example,
    if you want to select all the PCX files in a directory, type *.pcx as the search
    criteria.


    FIGURE B.4

    Use wildcards to filter the list of files.


    ![](img/782ecfdc0b083a767896cc983e10427f_401_0.png)


    > To make it easier to move and copy files from one directory to another, open
    multiple file manager windows. To open a second instance of the file manager,
    select File, Create New Window.


    # Handling Files and Directories


    As you work with the various applications installed on the system, the files that
    you create are stored in the home directory for your user account. You could save
    all these files in the home directory, but over time, your personal filing system
    would become cluttered and it would be hard to find files. To keep your files
    organized, create subdirectories within your home directory and move files to
    the appropriate subdirectories.


    To create a subdirectory, select the directory (from the directory tree) under
    which you want to create the new subdirectory. Then click File, New, Directory.
    Type the name of the new subdirectory in the dialog box that appears. Use the
    relative filename for the directory. (The relative filename does not begin with
    the slash (/) character.)


    After you have created a few subdirectories, you can begin to move files and tidy
    things up. To move a file, first display the file in the file list and the directory
    in the directory tree. Then click and hold the file while dragging it to the new
    directory in which it will be stored.'
  merge: -1
  img_proc: true
- pgno: 402
  md: 'FIGURE B.5

    Rename files and directories, and change file permissions, from the Properties
    dialog box.


    ![](img/782ecfdc0b083a767896cc983e10427f_402_0.png)


    > Before you can delete a directory, you must first delete all the files contained
    in the directory. Right-click a file and select Delete to remove files. Files
    removed from the system permanently; you might not be able to get them back.


    # Task: Moving Around the Filesystem


    Using a graphical interface to work with the filesystem makes it easy to move
    from directory to directory, view the contents of a directory, and create and
    move files. A safe place to play in the filesystem is in the /usr directory. This
    directory contains a number of programs that you might find useful. You''ll also
    find a wealth of information about the operating system and all the applications
    installed on the system. Here''s how to move around the filesystem and view a
    few files:


    +   1. Display the contents of the /usr directory. Scroll to the bottom of the
    directory tree and click the plus sign next to usr. The subdirectories found in
    the /usr directory will appear in the directory tree.

    +   2. Display the contents of the /usr/doc directory. Click the plus sign next
    to doc. A subdirectory for each program, command, utility, and application documentation
    displays in the directory tree.

    +   3. Look for the /usr/doc/linuxconf subdirectory. (You''ll work with Linuxconf
    later in this hour.) Click on the subdirectory to display the contents in the
    file list.

    +   4. Look for a README file. Double-click the file to open it. The file will
    open in the default text editor. Other file types will open in their associated
    viewers. For example, an HTML file might open in Netscape Navigator.'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'If a file cannot be opened automatically, the dialog box shown in Figure B.6
    appears. Click on the appropriate application from the list.


    # FIGURE B.6


    Browse the list of applications and select an appropriate program in which to
    view the file.


    ![](img/782ecfdc0b083a767896cc983e10427f_403_0.png)


    Do some exploring on your own. You might want to check out The Gimp (gimp) if
    you want to digitally enhance your photographs. The Check Book Balancer (cbb)
    is an easy-to-use personal finance tool. To read Adobe Acrobat files, try xpdf.
    If you share files with friends who use the Windows operating system, compress
    files with zip before you send them over the Internet.


    # System Configuration with Linuxconf


    Throughout the past 24 hours, you learned how to edit system configuration files
    by using a text editor or with commands. You learned how to configure hardware
    in Hour 9, "Hooking Up Hardware Devices"; how to create user and group accounts
    in Hour 12, "Sharing Files with Other Users on the System"; how to adjust your
    video display in Hour 18, "Installing the X Window System"; and how to set up
    an Internet connection in Hour 21, "Connecting to the Internet." Even though these
    tasks can be accomplished quickly and efficiently with a few changes to a text
    file, you can make these changes from software utilities that write the changes
    to these same files.


    ![](img/782ecfdc0b083a767896cc983e10427f_403_1.png)


    A number of GNU/Linux distributions contain configuration tools and other utilities
    that have been designed for that particular distribution. Linux-Mandrake contains
    a utility called DrakConf that provides a graphical interface from which you can
    change the screen resolution, add user accounts, set up a printer, and other system
    tasks. TurboLinux contains a whole set of configuration tools—configure the X
    Window System using TurboXcfg, create user accounts with TurboUserCfg, and set
    up an Internet connection with Turbonetcfg. Linuxconf was developed by Red Hat
    Linux and is included with most distributions.'
  merge: -1
  img_proc: true
- pgno: 404
  md: 'Linuxconf is an easy-to-use, graphical utility that can configure almost everything
    about your system. Linuxconf assembles all the system configuration tasks under
    one interface. With Linuxconf, you can set up a computer network for your organization
    or connect to an Internet service provider, create user and group accounts to
    facilitate file sharing, and perform other system administration tasks such as
    keeping the computer clock current.


    > Before you can work with Linuxconf, you must either log in to the root user
    account, or have superuser access from your user account.


    If Linuxconf is installed on the system, you can easily open the utility by typing
    linuxconf in a terminal emulator. The first time you use Linuxconf, you might
    see a Help window that contains some basic information about working with Linuxconf.
    To exit this window and display Linuxconf, click Quit. When Linuxconf opens, the
    Config tab should appear as shown in Figure B.7. To access one of the configuration
    modules, click the icon on the Config tab. For example, when you click the Users
    Accounts icon, the User Account Configurator opens. From the User Account Configurator,
    you can add or update user and group accounts and change the root password.


    # FIGURE B.7


    The Linuxconf main menu system accesses all the configuration modules.


    ![](img/782ecfdc0b083a767896cc983e10427f_404_0.png)


    Connect to the Internet

    Create user and group accounts

    Access floppies, hard drives, and CD-ROMs

    Change LILO configuration


    When you are finished working in a configuration module, click the Quit button
    at the bottom of each open window. After you''ve pressed all the Quit buttons,
    the Status of the System dialog lets you know that the configuration changes have
    not been made in the appropriate configuration files. All you need to do is tell
    Linuxconf to make the changes to the appropriate configuration files by clicking
    the Activate the changes button.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Task: Creating a Connection to an ISP


    One of the configuration tasks that Linuxconf can help with is creating a connection
    to your ISP so that you can surf around the Web. Setting up a PPP connection using
    the Network Configurator is a two-step process. First, Linuxconf needs to know
    how to connect to the Internet. Then, the name server information supplied by
    the ISP needs to be added. Just follow the instructions to create a connection
    to the Internet:


    > Before you begin this task, make sure that you have the information supplied
    by the ISP, and that the modem is connected to the computer and turned on.


    +   1. Open the Network Configurator. Click the Networking button on the main
    Linuxconf configuration window.

    +   2. Create the PPP connection. Click on the PPP or SLIP dialout button shown
    in Figure B.8 to display the PPP/SLIP configuration window.


    FIGURE B.8

    Creating an Internet connection is a two-step process.


    ![](img/782ecfdc0b083a767896cc983e10427f_405_0.png)


    3. Click the Add button in the PPP/SLIP configuration dialog box to display the
    New PPP/SLIP configuration window shown in Figure B.9.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# FIGURE B.9


    Enter the access information supplied by the ISP.


    ![](img/782ecfdc0b083a767896cc983e10427f_406_0.png)


    +   4. Type the name of the ISP (or some other descriptive name) in the Configuration
    name text box.

    +   5. Select the Connection type option that describes the protocol used to connect
    to the ISP. If you are connecting to the Internet from a home computer, you will
    probably select the PPP using serial port/modem option.

    +   6. Select the PAP option as the PPP authentication type. You might want to
    check with your ISP to make sure it uses PAP authentication.

    +   7. Type the login name (usually your email address) in the login text box
    and the password needed to log in to your account in the Password text box.

    +   8. Click the Modem tab. Select the modem port from the Serial device drop-down
    list and type the telephone number that you use to connect to the ISP in the Phone
    text box.

    +   9. Click the Accept button. The connection that you configured appears in
    the PPP/SLIP configuration window. Click the Quit button to return to the Network
    Configurator.

    +   10. Configure the server connection. Click the Name server specification (DNS)
    icon to display the Resolver Configuration window shown in Figure B.10.

    +   11. Review your input and exit the Network Configurator. Click the Accept
    button in the Resolver Configuration window. Click the Quit button in the Network
    Configurator window. And, finally, click the Quit button in the main Linuxconf
    window. The Status of the System window displays.

    +   12. Save the configuration changes. Click the Activate the changes button.
    Your changes are saved and you''re ready to try out your connection with your
    favorite PPP dialer. An easy to use dialer is usernet.'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# FIGURE B.10


    Enter the IP addresses assigned by the ISP


    ![](img/782ecfdc0b083a767896cc983e10427f_407_0.png)


    Primary DNS number


    URL address of the ISP


    Secondary DNS number


    # Summary


    You''ve just been through another whirlwind tour of yet another desktop environment.
    After switching back and forth between KDE and GNOME, you''ve probably found many
    similarities and also a few differences. Now it''s up to you to decide which environment
    best fits your working style. If you want to learn more about these two desktop
    environments, start with the help files included in the system. The Web is another
    good source of information. You can be absolutely overwhelmed by the links provided
    by a search engine. A visit to your favorite bookstore (whether it''s just around
    the block or in cyberspace) can lead you to a number of good books for your reading
    enjoyment.'
  merge: -1
