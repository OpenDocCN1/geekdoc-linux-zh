- pgno: 372
  md: 'Before you can use the player, you''ll need a supported movie format stored
    on the computer. To start a movie, click the Open File button and select a movie.
    Then, click the Play button and watch the film footage roll.


    ![](img/782ecfdc0b083a767896cc983e10427f_372_0.png)


    > If you want to capture a frame from the movie, press the c key (make sure that
    you enter a lowercase c).


    # Viewing Graphics Files


    You''ll find several graphics programs that can create a variety of images in
    almost any file format that you can imagine. The Gimp is the most well-known graphics
    program in the Linux world. The Gimp can be used to create images and enhance
    scanned photographs. There are also other vector drawing programs, such as KIllustrator
    and Sketch, which are easy to use and can create some great-looking graphics.
    If you have a digital camera, you can download your photographs using Gphoto.
    Now, after you have all those pictures stored on your computer, how can you keep
    track of them? Let''s take a look at some graphics viewers.


    ![](img/782ecfdc0b083a767896cc983e10427f_372_1.png)


    # Editing Images with Electric Eyes


    Electric Eyes is an image viewer and editing utility bundled in one neat little
    package. Using Electric Eyes, you can quickly sneak a peak at a picture, resize
    the image, and make color corrections. To start Electric Eyes, look for it in
    the menu system of your chosen desktop environment, or type ee at the command
    line. The opening screen for Electric Eyes is shown in Figure 24.6.


    When Electric Eyes appears, you''ll see the splash (or opening) screen. Right-click
    the splash screen to display the menu system and open a file. Electric Eyes can
    handle many file formats. The selected file appears in the same window in which
    the splash screen appeared. Then, you''ll need to display the controls. Right-click
    on the image to display the menu and select View, Show/Hide Edit Window. You might
    also want to display the List Window. All these windows are shown in Figure 24.7.'
