- pgno: 342
  md: '5. Close the preferences dialog boxes when you are finished. Click OK to return
    to the Mail Servers panel where you''ll see the name of the incoming mail server
    listed. Click OK again to close the panel and apply the new settings.


    Setting up a mail server is just one way that you can customize Communicator.
    If you lurk the newsgroups, select Newsgroups Servers from the Category list and
    supply the NNTP names for each news server you''d like to browse. If you have
    a hard time reading the text in the browser window, open the Appearance category
    and change the size of the font and even the font style. To change the page that
    appears when you first open the browser, select the Navigator category.


    # The Ins and Outs of the Linux Electronic Mail System


    There are two ways to deal with electronic mail on a Linux system. The first way
    is to use a mailer to send and receive email. You can use this method if you retrieve
    mail from the ISP by using the POP3 or IMAP protocol and send outgoing mail by
    using the SMTP protocol. The mailer can take care of all the necessary protocols
    and knows the name of the mail server that stores your mail. Several mailers are
    available on your Linux system, and Netscape Messenger is just one of them.


    Another mailer that you might want to look into is Kmail (shown in Figure 22.5).
    You''ll find many of the same features in Kmail that you saw in Netscape Messenger.
    In both mailers, you have the ability to filter and sort messages as they are
    downloaded from the server. You can also create new folders in which to store
    messages. If you are using the GNOME desktop environment, you might want to try
    Balsa.


    > You can use several mail notification utilities with Kmail. You might want to
    try KNewMail or the Biff utility. The commands for these are their names all in
    lower case.


    The second way to deal with electronic mail is the network method. The network
    method uses the mailer to display incoming mail, compose new messages, and store
    message files. The difference is that the mailer uses a mail transport agent to
    route mail from the sender to the recipient. By using a mail transport agent,
    you can send mail to someone who works at the same company with you or someone
    logged into the Internet a million miles away. The mail transport agent then relies
    on a transport protocol to transfer the mail messages across the wires.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'FIGURE 22.5

    Kmail is another good tool to help manage email messages.


    ![](img/782ecfdc0b083a767896cc983e10427f_343_0.png)


    The two most popular mail transport agents are sendmail and smail. Both programs
    require some knowledge of networking and need to be configured to meet your networking
    needs. After the mail transport agent is set up, another program is needed to
    retrieve the mail from the ISP and route it to the appropriate system user. Many
    system administrators choose fetchmail to perform this task.


    > If you are considering setting up a network with your Linux machines, read the
    Linux Network Administrator''s Guide at www.linuxdoc.org/LDP/nag.


    # Task: Finding Linux Newsgroups


    You''ll find a wealth of Linux help on the Internet and good sources are the Usenet
    newsgroups. The newsgroups are great places to just lurk around and read about
    other people''s problems. After you get the feel for a newsgroup, you might get
    brave and venture to ask a few questions of your own. Here''s how to use Netscape
    Messenger to read the Linux-related newsgroups:


    +   1. Set up an NNTP news server. From the Navigator browser, select Edit, Preferences.
    Expand the Mail & Newsgroups category and select Newsgroups Servers. Enter the
    information supplied by your ISP and the information for any other news server
    (there are some free ones) that you may use.

    +   2. Open Netscape Messenger. Select Communicator, Messenger.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '3. Download the list of newsgroups from the news server. Select the news server
    with which you want to work. Click the Subscribe button to display the dialog
    box shown in Figure 22.6. Click the Refresh List button to display the list of
    newsgroups available on the server.


    # FIGURE 22.6


    You''ll need to download the list of newsgroups before you can select groups to
    read.


    ![](img/782ecfdc0b083a767896cc983e10427f_344_0.png)


    4. Search for Linux-related newsgroups. Click the Search tab. Type linux in the
    Search For text box and click the Search Now button (as shown in Figure 22.7).
    All the newsgroups that contain the word linux will appear in the list.


    5. Subscribe to newsgroups. Scroll through the list and when you see a Linux newsgroup
    that covers a topic that interests you, click the newsgroup name and then click
    the Subscribe button. When you return to the Messenger window, the newsgroup will
    be available for viewing.


    Here are just a few of the newsgroups that you might want to browse:


    +   - Many Linux distributions have a newsgroup dedicated to just that particular
    distribution. (For example, you might want to check out alt.os.linux.mandrake.)
    You might also find that many distributions have their own news server where users
    of that distribution can get together to discuss what they are doing and any problem
    they might encounter. Visit the distribution''s Web site to find out more.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'FIGURE 22.7

    *Search for newsgroups that pertain to a specific topic.*


    ![](img/782ecfdc0b083a767896cc983e10427f_345_0.png)


    +   - To ask general questions about Linux, visit the comp.os.linux.answers newsgroup.
    This newsgroup will keep you up-to-date with the latest versions of the Linux
    HOWTOs.

    +   - If you are having a hardware problem, lurk around comp.os.linux.hardware.
    You might learn a few tricks about how to configure that tricky piece of hardware.


    # Sharing Data Over the Wire


    The Internet has made it possible for you to share information, communicate your
    ideas, conduct business, and stay in touch with anyone around the world. And your
    Linux distribution contains just about every tool you might need. There are some
    fun things you can do from the command line and some great utilities that run
    on the X Window System. If you want to know whether someone is online, use the
    finger command to see whether they are at home. Then, you can send them a short
    message and ask whether they''d like to talk for a while. If they do, fire up
    X-Chat, meet them in one of the public rooms, and mingle for a while.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Another way to share ideas is with a Web site. You''ll need an HTML editor
    in which to create the Web pages and possibly a graphics program to create Web
    images or enhance photographs. If you want to host your own site, you''ll find
    Web server software to fit your needs. To help you get started on your Web site,
    here are a few tools you might find useful:


    +   - Netscape Communicator contains an HTML editor called Composer. You can also
    use any of the text editors to create your own HTML code. Another easy-to-use
    HTML editor is Screem (found at www.screem.org). Not only can you create Web pages,
    but it also helps you manage your site after it is published.

    +   - If you want good-looking Web pages, head on over to the Linuxartist.org
    Web design resources at www.linuxartist.org/webdesign. You''ll find links to a
    number of HTML editing and graphics tools.

    +   - Not everyone is an artist and it does help if every Web page has at least
    one small graphic or a simple, yet colorful, background. If you search the filesystem,
    you''ll find a variety of images and backgrounds. You can also download free art
    from a number of Internet sites. Just ask any search engine for free art or free
    Web graphics.


    # Downloading Files from an FTP Site


    One of the oldest and most reliable methods of transferring files across the Internet
    is with FTP (or file transfer protocol). An FTP utility that is easy to use is
    gFTP. You might find gFTP in the GNOME or KDE menus, or you can type gftp at the
    command line to start the program. Here''s how to download a GNU program that
    you can use to manage your finances:


    +   1. Connect to an FTP site. For this task, you will connect to the MetaLab
    FTP archive (shown in Figure 22.8). Click Bookmarks, General Sites, Metalab. The
    program is already set up to use anonymous logins. You can also get to an FTP
    site by typing the FTP address in the Host text box.

    +   2. Find an INDEX or README file. To make it easier to navigate through an
    FTP site, you''ll find files that describe the contents of the directory. Double-click
    the filename to display the file in a text viewer window (as shown in Figure 22.9).

    +   3. Navigate to the directory that contains the file you want to download.
    Double-click a directory name to change to that directory. For this task, you
    want to go to the /pub/Linux/apps/financial/accounting directory (shown in Figure
    22.10).


    ![](img/782ecfdc0b083a767896cc983e10427f_346_0.png)'
  merge: -1
  img_proc: true
