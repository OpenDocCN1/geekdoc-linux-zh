    # Hour 4


    # Understanding the Linux Operating System


    Understanding any computer operating system may sound like a task with a steep
    learning curve. If you''re not familiar with the UNIX operating system, Linux
    may be confusing at first. If that''s the case, then it''s time we cleared things
    up a little. A computer operating system can be described as a filing cabinet
    with a resident file clerk wizard. The Linux wizard is called the kernel. This
    kernel/wizard is a file clerk that operates a filing service—filing things away
    in order and retrieving them when they are required. For those jobs that require
    services that the kernel cannot perform on its own, it summons servers called
    daemons. But, enough with the metaphors…


    In this hour, you will:


    +   - Learn how the different parts of the Linux operating system work together

    +   - Understand how files are arranged in the filesystem and how files are used
    in the operating system'
  merge: -1
  img_proc: true
- pgno: 79
  md: '+   - Discover a few good programs and get help along the way

    +   - Learn how processes fit into the operating system picture

    +   - Get acquainted with the system log files


    # The Anatomy of the Linux Operating System


    The center of the Linux operating system is the kernel. The kernel is a piece
    of software that provides an interface between you, the computer hardware, and
    attached peripherals. The kernel is responsible for maintaining the filesystem,
    executing commands, starting programs, timing system activities, and managing
    system memory and other resources. Figure 4.1 shows how the different parts of
    the kernel work together.


    FIGURE 4.1

    The kernel uses several tools to help it run the operating system.


    ![](img/782ecfdc0b083a767896cc983e10427f_79_0.png)


    The kernel gives instructions to the system using system calls. These system calls
    coordinate the activities of the kernel to produce the output for a command that
    has been executed by the system user.


    New Term System calls are communications between the kernel and the devices it
    manages, which direct the performance of actions requested by commands it receives
    from internal system processes or running applications, or are passed from the
    shell. These are the vehicles used by the kernel to execute shell commands. You''ll
    learn how the shell acts as the interface between the user and the operating system
    in Hour 5, "Getting Acquainted with the Shell."'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'The most important job of the kernel is to manage the computer’s memory resources.
    The memory resources are required to start processes that activate devices and
    services and cause the computer system to perform its job. All these goings on
    are managed through the filesystem.


    # Exploring the Directory Structure


    Because earlier we told you that the Linux operating system is in reality a filing
    system, let’s take a quick look at how the filing system is organized. Linux sees
    everything as files; therefore, it’s important to understand exactly what a Linux
    file is and how Linux organizes files within the system. Every kind of file you
    might need is stored in the Linux filesystem: system files, data files, application
    files, utility files, driver files, configuration files, and more. Each of these
    files has a name and a directory in which it is stored in the filesystem.


    The Linux filesystem is based on a tree structure, as are the DOS, Microsoft Windows,
    and UNIX filesystems. There is a root directory (identified by the / character)
    out of which all other directories and subdirectories grow. The files are contained
    within these directories and subdirectories. Figure 4.2 shows the basic structure
    of the Linux filesystem, as shown from the GNU Midnight Commander file manager.


    FIGURE 4.2

    The basic structure of the Linux filesystem.


    ![](img/782ecfdc0b083a767896cc983e10427f_80_0.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Directory names can be made up of a combination of numbers, symbols, and characters.
    The name of the directory includes the location of the directory in the filesystem
    relative to the root (/) directory. In other words, the directory name includes
    the path to follow through the filesystem to get to the directory.


    ![](img/782ecfdc0b083a767896cc983e10427f_81_0.png)


    > > The forward slash character (/) is also used to separate directories, subdirectories,
    and files. The slash character (/) by itself denotes the root directory.


    Directories that are nested (contained) within other directories are called subdirectories.
    A parent/child relationship exists between the two directories. The home directory
    for your user account is one of these subdirectory branches. It''s name begins
    with the / character, which signifies the root directory. Off the root directory
    is a subdirectory that contains all the home directories for the system users—the
    /home directory. Each user has a subdirectory of his or her own in the /home subdirectory.


    For example, a user named "rusty" would have a home directory located in the /home/rusty
    directory path. Notice that there''s nothing in front of the / in front of home.
    This signifies that /home is a subdirectory of the root directory. Because there''s
    no / after /rusty, it could be confusing whether /rusty is a subdirectory of /home
    or a file stored there. Of course, to end the confusion, you can go ahead and
    place a / after /rusty to indicate that it is a directory.


    The /home directory is not the only directory in the Linux filesystem. The following
    is a list of directories you''ll find when looking around the Linux filesystem:


    +   - The base of the operating system is the root (/) directory. It contains
    all the subdirectories and files in the Linux system. One important item that
    you''ll usually find in the /boot directory is the Linux kernel. If you don''t
    find it here, you''ll find it in the / directory.


    ![](img/782ecfdc0b083a767896cc983e10427f_81_1.png)


    > > Do not store any files in the / directory. Only system-specific configuration
    files (such as boot information files) are to be located at the root of the system.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - Executable files are stored in the /bin (for binary) directory. This
    is where Linux keeps its basic commands and programs. You''ll learn about many
    of these commands as you progress through the book. There are commands that start
    the various shells, commands for working with files (such as copying and moving),
    commands to change file permissions, and configuration utilities such as linuxconf.

    +   - The /boot directory is where the boot configuration files and commands are
    stored. This directory contains everything needed to boot (or start) the system.

    +   - The /dev directory is where all the device files (or drivers) are kept for
    your computer''s hardware components. When you configure Linux to use a particular
    device, you edit one of the configuration files in this directory. One device
    that is attached to most computers is a floppy drive. The floppy drive is controlled
    by the /dev/fd0 device file. The IDE hard drive device file is /dev/hda, or /dev/hdb
    for a second hard drive. For those who like SCSI these would be sda, sdb, sdc,
    etc.

    +   - The /etc directory is where Linux keeps the system configuration files and
    initialization scripts. In later hours, you''ll learn how to edit the files in
    this directory with a text editor to make configuration changes. You can edit
    these files to add users to the system and change their passwords (the /etc/passwd
    file), create group accounts for file sharing (the /etc/group file), and set up
    a dial-up Internet connection (the /etc/resolv.conf file).

    +   - Each user on the system has a personal directory in which to store the files
    he or she creates. This directory is contained in the /home directory. Within
    the /home directory, each user has a separate subdirectory (except for the superuser).
    User home directories are for storing personal files and are not accessible by
    other users on the system.

    +   - The /lib directory contains the libraries for C and other programming languages.
    It also contains the shared library images that are needed to boot the system
    and to run commands.

    +   - The /lost+found directory is where to look for a file if you think that
    Linux has lost it. If there are several partitions on the system, there''s a /lost+found
    directory on each partition.

    +   - The /mnt directory is where other filesystems can be attached or mounted
    to the Linux filesystem. To view the contents of a CD-ROM, you would usually look
    in the /mnt/cdrom directory. To see the contents of a floppy disk, look in /mnt/floppy.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '+   - The /proc directory contains virtual files that Linux uses to keep track
    of ongoing processes. You might think that some of these files are huge, but they
    are *virtual* files and are not actually there. They have other funny attributes,
    too. Although they take up no space at all on your disk, you can''t delete them.
    You''ll learn to use the /proc files to collect information about the computer
    in Hour 9, "Hooking Up Hardware Devices."

    +   - The /root directory is the home directory for the superuser or system administrator.

    +   - The /sbin directory is where files (or tools) for use by the superuser (system
    administrator) are kept. The /sbin directory contains commands that shut down
    the system, set the system clock, check the filesystem for errors, and set up
    networking.

    +   - Temporary files are located in the /tmp directory. This is a place where
    all users can temporarily store files for access by other users or for temporary
    storage. All the data stored in the /tmp directory will be lost when the system
    is rebooted.

    +   - The /usr directory contains files that are not a part of the Linux filesystem.
    Applications for the X Window System and the Linux game collections are examples
    of what you''ll find in this directory. There''s also quite a long list of help
    files in the /usr directory.

    +   - The log files are found in the /var directory. In here, you''ll find the
    boot logs, the dmesg log, and others. Information in these logs indicates what
    software was loaded at boot and how the system hardware is configured.


    # Task: Exploring the /usr Directory


    You have two different ways to explore the contents of the filesystem. One is
    to use some basic Linux commands from the command line. The other is to use one
    of the graphical file managers included with the desktop environment (whether
    its KDE, GNOME, or FVWM) that you are using.


    This task takes you on an adventure through the /usr directory. This is probably
    the safest directory for you to explore because the files in this directory are
    available to all users, and they''re read-only files. Follow these steps for an
    example of the useful information and programs you can find in the /usr directory:


    +   1. Start with some fun and find the /usr/games directory. From the command
    line, use the ls command to list the directory contents. Type the following:


    ```

    ls /usr/games

    ```'
