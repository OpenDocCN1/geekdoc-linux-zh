- pgno: 349
  md: "# Q&A\n\nQ How do I use the finger command to find people on the Internet?\n\
    \nA Fire up your Internet connection and get online, open a terminal emulator,\
    \ and type finger followed by the email address of the person you seek.\n\nQ Where\
    \ can I find more information on setting up an email system on my Linux system?\n\
    \nA There are a few HOWTOs that you may want to start with. The Linux Mail User\
    \ HOWTO provides a good introduction to electronic mail. You'll find information\
    \ on many of the Linux mailers and how to get rid of spam. The Linux Electronic\
    \ Mail Administrator HOWTO explains how electronic mail works on a network and\
    \ the Internet, how to install and configure a mail transport agent, and how to\
    \ manage the mail system. If you want to distribute mail to different users on\
    \ the system, read the Linux Off-line Mailing Method mini-HOWTO.\n\n# Workshop\n\
    \nTest your knowledge of the material covered in this hour by answering the following\
    \ questions and working through the exercises.\n\n# Quiz\n\n+   1. What is the\
    \ easiest way for new Linux users to start browsing the Web and sending email\
    \ messages?\n+   \n+   The Netscape Communicator suite is found on most Linux\
    \ distribution CD-ROMs. For those who are moving to Linux from the Windows and\
    \ Macintosh operating systems, Communicator for Linux has the same look and operates\
    \ the same way. Communicator contains a full range of Web tools. You can browse\
    \ the Web with Navigator, and keep track of your travels using bookmarks and the\
    \ history list. Messenger manages mail and newsgroup messages. The address book\
    \ helps you maintain email addresses for friends, relatives, and clients. Communicator\
    \ also sports an HTML editor, Composer, to get your Web site up and running.\n\
    +   \n+   2. What information do you need to gather from your ISP before you can\
    \ set up the mailer software?\n+   \n+   You need to know your email address,\
    \ the names of the ISP's incoming and outgoing mail servers, the mail protocol\
    \ (either POP3 or IMAP), and the username and password you need to gain access\
    \ to the mail server."
  merge: -1
  img_proc: true
- pgno: 350
  md: '3. What are the two different methods that you can use to send and receive
    email? Which method should new Linux users choose to ensure a quick and successful
    email setup?


    The new Linux user should try for the least complex method before diving into
    new territory. The quickest way to set up an email account in Linux is to use
    a mailer program that supports the POP3, IMAP, and SMTP protocols. These mailers
    can take care of the necessary communication with the ISP. The disadvantage to
    this method is that it is not very flexible.


    The other method involves configuring a mailer, a mail transport agent, and a
    transport protocol. If you are running a network, you will need to use this method
    to deliver mail from the Internet, and from within your network, to each of the
    users on your network.


    4. Which Internet tool should you use to download new application packages for
    your Linux system?


    The most reliable file download method is FTP, or file transfer protocol. You''ll
    find quite a number of FTP sites that contain gigabytes of Linux applications,
    tools, utilities, source code, and sample scripts. An FTP program such as gFTP
    enables you to select the files to download, the location to which you want to
    download the files, and then keeps the transfer going between your machine and
    the FTP server.


    # Exercises


    +   1. Now that you''re on the Web, look up a few good sites where you can download
    more Linux software. There are just tons of places to start. You can always start
    at the Web site for your favorite distribution. There are also sites that specialize
    in software downloads. You might want to start with www.linuxsoftware.org or the
    RPM Repository at www.rpmfind.net/Linux/RPM. You can also explore the FTP sites
    that are bookmarked in gFTP.


    +   2. Install the GNUcash program you downloaded with gFTP. If you need some
    help, go back to Hour 15, "Installing Software," for a refresher course. After
    you''ve installed GNUcash, you can start using your Linux system to keep track
    of your finances. There are several other personal management programs that work
    with Linux. You can find programs to manage your investments, and programs that
    can manage your time.'
  merge: -1
  img_proc: true
