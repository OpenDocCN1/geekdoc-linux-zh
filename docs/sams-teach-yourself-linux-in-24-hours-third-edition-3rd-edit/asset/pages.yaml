    +   \n+   2. Give the other popular GNU/Linux text editor, emacs, a try. After\
    \ you have worked with both vi and emacs for a little while, you can decide which\
    \ one is better suited for the kind of text-editing work you do. To take the emacs\
    \ tutorial, use the command Ctrl+H T. You'll find that some of the skills you\
    \ learned in this hour will be helpful during your exploration of emacs. To find\
