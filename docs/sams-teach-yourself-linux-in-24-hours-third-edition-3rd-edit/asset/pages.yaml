  md: "# Task: Saving Disk Storage Space\n\nOne way to reduce the size of a file is\
    \ to use a compression utility. You may have a file that is too large to fit on\
    \ a floppy disk. If so, use the gzip command to compress the file enough so that\
    \ it fits. You may have files in your home directory that you use infrequently.\
    \ If so, save some space and compress the files. Try these compression tricks:\n\
    \n+   1. Compress the file by using the gzip command as follows:\n+   \n+   ```\n\
    +   gzip -v filename\n+   ```\n+   \n+   This command tells gzip to compress the\
    \ file and to display the compression percentage for the file. The original file\
    \ is replaced with the compressed file, and the extension .gz is added to the\
    \ end of the filename. For example, user rusty has three files that are not used\
    \ often and that take up space (the file listing appears in Figure 10.1). When\
    \ rusty executes the command\n+   \n+   ```\n+   gzip -v 23FIG??.pcx\n+   ```\n\
    +   \n+   the following appears on the screen:\n+   \n+   ```\n+   23FIG01.pcx:\
    \ 76.1% -- replaced with 23FIG01.pcx.gz\n+   23FIG02.pcx: 76.1% -- replaced with\
    \ 23FIG02.pcx.gz\n+   23FIG03.pcx: 76.1% -- replaced with 23FIG03.pcx.gz\n+  \
    \ ```\n+   \n+   This listing shows the original filename, the percentage of compression,\
    \ and the new filename of the compressed file.\n+   \n+   2. Uncompress the file\
    \ by using the gunzip command as follows:\n+   \n+   ```\n+   gunzip filename\n\
    +   ```\n+   \n+   For example, if rusty wanted to decompress the file named 23FIG01.pcx.gz,\
    \ he would type this:\n+   \n+   ```\n+   gunzip 23FIG01.pcx.gz\n+   ```\n+  \
    \ \n+   The file is restored to its original, uncompressed state and can be used\
    \ by an application that can read files of that type.\n+   \n+   3. Compress every\
    \ file in a directory by using the gzip command as follows:\n+   \n+   ```\n+\
    \   gzip -rv directorypath\n+   ```\n+   \n+   If rusty wants to compress the\
    \ contents of the corresp subdirectory located in the user home directory, the\
    \ following command would be used:\n+   \n+   ```\n+   gzip -rv /home/rusty/corresp\n\
    +   ```"
