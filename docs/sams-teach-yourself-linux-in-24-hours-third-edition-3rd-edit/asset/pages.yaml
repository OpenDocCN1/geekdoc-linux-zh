- pgno: 1
  md: '# SAMS

    Teach Yourself Linux in 24 Hours, Third Edition


    # What You Should Already Have to Get the Most out of This Book...


    +   - Familiarity with computer basics, including turning on and off the computer,
    using the keyboard, and printing documents on a printer

    +   - Introductory knowledge of the purpose for computers and a desire to understand
    more about the Linux operating system


    Some books that may help...


    ![](img/782ecfdc0b083a767896cc983e10427f_1_0.png)


    # Sams Teach Yourself Computer Basics in 24 Hours


    A great introduction to computing


    ![](img/782ecfdc0b083a767896cc983e10427f_1_1.png)


    # Sams Teach Yourself Upgrading and Fixing PCs


    A step-by-step approach to upgrading and repairing PCs


    # What This Book Will Help You Learn...


    +   - How the Linux operating system works and how to make it do what you want

    +   - How to write or modify your own configuration files by hand, and organize
    things in your system so that they are optimized to serve you

    +   - How to be your own Linux system administrator


    Related titles...


    ![](img/782ecfdc0b083a767896cc983e10427f_1_2.png)


    # Sams Teach Yourself Linux-Mandrake in 24 Hours


    For readers who want a more in-depth look at Linux-Mandrake


    ![](img/782ecfdc0b083a767896cc983e10427f_1_3.png)


    # Linux Hardware Handbook


    For readers who want to learn how to select, install, and configure hardware for
    the best possible performance from their Linux operating system


    # Where You Might Want to Go from Here...


    +   - Master the advanced Linux system tools

    +   - Add networking capabilities, if you currently do not use them, to your home
    or office computers to ensure that all your computing power is at your fingertips
    from any PC

    +   - Learn how to select, install, and configure your computer''s hardware for
    optimal performance with the Linux operating system


    Titles to look for...


    ![](img/782ecfdc0b083a767896cc983e10427f_1_4.png)


    # Sams Teach Yourself GNOME in 24 Hours


    For readers who want to explore Linux through the GNOME graphical desktop environment


    ![](img/782ecfdc0b083a767896cc983e10427f_1_5.png)


    # Sams Teach Yourself Networking in 24 Hours, Second Edition


    Teaches beginners how to add networking capabilities to their computer systems'
