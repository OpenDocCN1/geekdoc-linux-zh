- pgno: 20
  md: '# Introduction


    Hello. Welcome to Sams Teach Yourself Linux in 24 Hours. We''re sure that you
    have heard a lot of Linux hype, and we''ll even bet that you''ve heard both success
    and failure stories from people who have already tried Linux. Don''t you already
    have a computer running the Microsoft Windows or Apple Macintosh operating system?
    So, why should you subject yourself to all the hassle and effort to learn about
    an alternative computer operating system?


    Well, every now and then a new idea comes along that offers an unbeatable opportunity
    to grab hold of a good thing and make it your own. Linux is a complete UNIX-like
    operating system. It''s a whole laboratory where you can learn system administration,
    programming, application creation, and almost anything else there is to know about
    in the world of computers. GNU/Linux creates an environment that provides all
    the tools, documentation, and built-in help that you need to teach yourself some
    valuable skills and build on your existing knowledge of computers and networking.


    # What Is GNU/Linux?


    Linux is a multiuser and multitasking computer operating system that is a free
    UNIX clone. What makes it GNU/Linux is the addition of the wealth of free utilities
    and software from Richard Stallman''s Free Software Foundation and the GNU Project.
    These applications include text editors, utilities, tools, operating system upgrades,
    and much more. The valuable contributions of programmers from around the world
    are combined to produce quality applications for everything from a moon phase
    clock to professional audio/video creation and editing software. New multimedia
    players for everything are available to you for a free download. Office production
    tools such as word processors, graphics applications, and office suites are included
    in many Linux distributions or available for the download time.


    # Why Teach Yourself Linux?


    The Linux operating system and the associated bank of free software represent
    a truly inexpensive and effective alternative for the small business and home
    office. GNU/Linux offers an inexpensive networking solution to keep your enterprise
    together, strong applications to maintain the best work flow levels, and an easy
    configuration and adaptation to fit your needs exactly.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'What gives Linux an advantage over other operating systems? Let''s look at
    a few examples:


    +   - Linux can bring your old equipment back up to par to work with your new
    equipment, and extend its useful life. You will quickly recognize the potential
    for using Linux to revitalize and restore usefulness to obsolete or outdated equipment.

    +   - Linux can do much more with the equipment you have. By allowing you full
    access to the power of your computer, Linux enables you to manage the operating
    system and run applications better and faster using just the equipment that you
    already have.

    +   - When you install and configure Linux on your computer, you might never have
    to buy another piece of application software. Most people from the Macintosh Windows
    worlds are unaware of the mountain of free software that exists for the GNU/Linux
    user. There are myriad professional and scientific applications contained with
    the Linux distribution, including many that surpass their commercial equivalents
    in power and performance.

    +   - Linux provides you with a readily adaptable TCP/IP server package, so establishing
    and administering your network—one especially tailored to serve your needs—is
    made simple.


    # Why Use Linux-Mandrake to Learn About Linux


    Remember the old days of DOS? How about the original IBM PC (back before hard
    drives) and when a Commodore 64 was hot stuff? Is there a CP/M machine stuck in
    a back closet that you keep ''for old times sake''? Perhaps your grandma told
    you stories about computers that didn''t even have colored pictures on the screen?
    Yes folks, at one time you had to type in things on a black or green screen in
    cryptic little half words and initials to get your computer to do anything; no
    mouse, no GUI, no apple, nothing but a command line with a flashing cursor.


    Things have changed since then of course, even for Linux.


    Even though there are similarities between the different GNU/Linux distributions,
    it might become confusing when dealing with the individual distributions. We want
    to show you how to operate Linux, no matter which distribution you might choose.
    We chose Linux-Mandrake because it is less cumbersome and more user-friendly than
    most distributions. Linux-Mandrake offers several installation methods. You might
    elect to take one of the simple installation routes if you want to install a basic
    system and get up and running quickly. Or, you might want to dig in and get involved
    in the installation by selecting packages and preconfiguring your system during
    the installation process.


    Linux-Mandrake also contains some powerful tools and utilities that make it easier
    to work with Linux.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Even though we use Linux-Mandrake as the sample distribution, there''s no fluff
    here to cover up the inner workings of the operating system. We show you what
    the operating system is all about. This book shows you how working with Linux-Mandrake
    from the command line eliminates the "middle man" posed by user interfaces and
    someone else''s preconceived notions. It also provides you the greatest opportunity
    to design a computer system that is efficient and acts like an employee more than
    a toy.


    You''ll find hundreds of free software programs included in the Linux-Mandrake
    distribution found on the CD in the back of this book. And you aren''t limited
    to using just the programs on your computer and the CD. Many more great applications
    and tools are available just for the download time.


    # Should You Read this Book?


    Are you interested in the UNIX operating system but find it daunting and complex?
    Linux is a smaller, friendlier member of the UNIX family. Are you looking for
    a different, better operating system? Linux is an alternative to the Windows and
    Macintosh computing environments. Are you looking for an introduction to this
    new operating system? Do you need help overcoming the Linux learning curve while
    obtaining a good solid working knowledge of the Linux operating system?


    This book is a results-oriented tutorial—a step-by-step guide to installing, configuring,
    and using Linux productively. It is designed to help you learn about the Linux
    operating system in a secure, nonthreatening environment. You''ll find a friendly
    introduction to the Linux operating system in plain language that builds understanding
    by guiding you through the performance of familiar tasks and exercises in Linux.
    The material in the book is organized and presented in ways to complement and
    expand your existing knowledge.


    After reading this book and working through the exercises, you will be able to
    install and configure the Linux-Mandrake distribution on a variety of machines,
    and you will possess a good basic knowledge of GNU/Linux in general. When you
    are familiar with Linux, you can begin to make intelligent choices about using
    it and tailoring it to meet your needs.


    # What You''ll Learn in 24 Hours


    To help you understand the Linux ropes, we start with a step-by-step approach
    in which you learn how the Linux operating system works and how to make it do
    what you want. You learn how to install, configure, manage, and modify your system
    and its behavior. You won''t be doing this just through the offices of wizards
    and preconfigured files.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'You''ll learn to write or modify your own configuration files by hand and organize
    things in your system so that they are optimized to serve you. You will learn
    these things and others while you interact with your computer by typing on the
    command line.


    This book takes you deep into the workings of the Linux operating system. As you
    go through the lessons and activities in the book you''ll learn how to be your
    own system administrator. You''ll learn the secrets about how to really drive
    the Linux operating system, no matter which distribution of Linux you choose.


    # How This Book Is Organized


    This book contains the basic information needed by anyone who wants to be a proficient
    user or system administrator of the Linux operating system. As you work through
    the book, you''ll learn the concepts you need to understand a computer operating
    system, from both the user''s and the administrator''s point of view. You will
    find step-by-step directions for implementing these concepts to tailor your Linux
    operating system to serve you best. Here''s an overview of what you''ll find tucked
    between the pages:


    +   - Part I. "Take the Linux Plunge," helps you through the Linux installation
    process and introduces you to the operating system. You''ll learn how the operating
    system is structured and why you should always be security conscious.

    +   - Part II, "Learn the Ropes," shows you all the things needed by a user on
    the system. You''ll learn how to navigate the filesystem, perform searches, copy
    information in one file to another file, and edit files. You''ll also learn how
    commands and shells work.

    +   - Part III, "System Administration," is the beginning system administrator''s
    guide. Before you can become proficient at making the right decisions about the
    system''s care and maintenance, you''ll need to master the concepts covered in
    these hours.

    +   - Part IV, "Get a GUI," covers fine-tuning the X Window System. You''ll also
    learn about the window managers and desktop systems available and how to get started
    with the X Window System.

    +   - Part V. "Network Administration," gets you connected to the Internet and
    shows you how configure the system to distribute mail and new messages. You''ll
    also find out how to leave messages for other users on the system.

    +   - Part VI, "Entertainment," gives you a chance to have a little fun with your
    computer. You''ll explore some of the more interesting games that run on the system.
    You''ll also find out how to get even more entertainment value from your computer
    by hooking up the sound system and playing some good old rock and roll.

    +   - Part VII, "Appendixes," contain introductions to the KDE and GNOME desktop
    environments.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Helpful Learning Tools


    Included in the discussions for each hour are additional elements that provide
    you with more information on how to work with the Linux operating system. These
    elements are designed to offer extra knowledge without encumbering your progress.


    # Understand New Terminology


    ![](img/782ecfdc0b083a767896cc983e10427f_24_0.png)


    New Terms appear throughout the book to help you identify new concepts being discussed.
    Each new term is accompanied by a brief definition to help you understand the
    concepts being discussed during the hour.


    # Find Additional Information


    ![](img/782ecfdc0b083a767896cc983e10427f_24_1.png)


    > Notes are used to clarify a topic or to provide additional information that
    might be of use to you. Notes aren''t necessary to the discussion; they''re just
    tidbits of information that you might find interesting.


    # Work More Efficiently


    ![](img/782ecfdc0b083a767896cc983e10427f_24_2.png)


    > Tips tell you about shorter, more efficient methods you can use to accomplish
    a task. Tips are designed to help you make your job easier and give hints to solutions
    that might work for you.


    # Avoid Potential Problems


    ![](img/782ecfdc0b083a767896cc983e10427f_24_3.png)


    > Cautions point out potential problem areas with the Linux operating system.
    You''ll want to step carefully when you see the Caution icon to avoid performing
