- pgno: 188
  md: '![](img/782ecfdc0b083a767896cc983e10427f_188_0.png)


    # Hour 10


    # Backing Up and Restoring the Filesystem


    Keeping a duplicate copy of important system files and user data files is the
    most important part of maintaining your computer system. Developing a backup system
    helps ensure that data is protected from loss and destruction. You never know
    when a hardware problem may arise or a file is accidentally deleted. For this
    reason, you should create a backup plan and back up files on a regular schedule.
    You’ll need to test the backup files also to ensure a safe recovery should you
    need to use them.


    Your backup plan should include a list of those files that need to be backed up,
    how often the backups should occur, the media used to store the backups, and what
    tools will be used to perform the backups.


    In this hour you will:


    +   - Develop a backup plan so that you don’t lose valuable files

    +   - Back up files to floppy disks

    +   - Compress files to save space on the hard drive or on the backup media

    +   - Create a file archive and restore the archive after a system failure or
    after files are lost'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Developing a Backup Plan


    The importance of backing up the system can never be stressed enough. You never
    know when the power may go out or a hard drive may crash. Even though you can
    restore the operating system from the distribution CD-ROM, there are other files
    that you need to consider. What about the configuration changes that you worked
    on for hours and hours before your system was set up just perfectly?


    > Always make a copy of configuration files before you make any configuration
    changes. Then, once you''ve made the changes, you will also want to keep a copy
    of the new configuration file.


    Then there are the files created by users. These files change on a daily basis
    (okay, some of us change files by the minute). Save yourself the pain, agony,
    and frustration by creating a sound plan for backing up important files and restoring
    the system after a disaster.


    **New Term** Backing up files is almost the same as copying files, except that
    backed up files can be easily restored to the system in case files are lost. Backing
    up makes a special set of files that, when restored, places the files in their
    original position in the directory structure.


    Follow these steps to create a backup plan:


    +   1. **Make a list of the files and directories that need to be backed up.**
    You''ll always want to back up system configuration files in the /etc directory,
    other configuration files that may be found in /usr/lib, X Window System configuration
    files usually found in /usr/X11R6/lib/X11, and kernel sources in /usr/src/linux.
    In addition, you''ll want to back up user files in the /home directory as well
    as files for the superuser in the /root directory.


    > Read the "Upgrading Your Linux Distribution" mini-HOWTO for more ideas on how
    to design a solid plan for backing up your Linux system.


    +   2. **Find a few tools to use when backing up and archiving files and directories.**
    Several Linux tools are available that will archive a group of files, and there
    are tools that will compress files and archives. When looking at the Linux archive
    and compression utilities, you''ll need to decide whether you want to use the
    archive on just a Linux machine or if a compressed file will be used on a computer
    running the Microsoft Windows or Apple Macintosh operating system.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '3. Decide how often the system and individual files need to be backed up. You''ll
    need to look at how often files change. If files change frequently, you may need
    to perform a backup every day. If you only make one or two configuration changes
    on occasion, you can easily backup the configuration files only when the change
    is made.


    4. Select a storage media that will be used to store the file. If you have a few
    files to back up, you could just store them on a floppy disk. If you have more
    files, consider using a Zip drive or a recording CD-R/W drive. Linux has always
    worked well with tape drives. Even though tape backups might be on the way out,
    there is still a lot of use for older equipment.


    5. Find a safe place to store the files. The safest place to store the backup
    media is at a location different from where the computer is located. This location
    also needs to be protected from fire and other hazards. A favorite storage place
    for many people is the safe deposit vault at their bank. Others may use a fireproof
    safe that is located at a secured storage facility. You may also want to keep
    a copy of the backups close by so that you can quickly restore lost files.


    # Task: Performing a Simple Backup


    The easiest way to back up a small number of files is to copy them onto floppy
    disks. The simplest method is to use the cp command. If the file is too large
    for a floppy, it can be compressed with the gzip command. When several files need
    to be backed up, create an archive with the tar command and compress the archive
    with the gzip command. Try this simple backup routine to copy a single file onto
    a floppy disk:


    1. Place the floppy disk in the floppy disk drive. If you need help formatting
    the disk, go to Hour 7, "Moving Around the Filesystem." If you buy formatted disks
    in bulk from your favorite warehouse club, there''s no need to format these disks
    to use them on your Linux system. Just put them in the drive and you''re ready
    to go.


    Before you can copy the file to the floppy, you need to mount the drive. To do
    so, use the mount command in the following format:


    ```

    mount /dev/fd0 /mnt/floppy

    ```


    2. Change the directory that contains the files you want to back up. Use the pwd
    command to see where you are, the cd command to move from directory to directory,
    and the ls command to view the list of files in a directory.


    3. Copy a file to the floppy disk. Use the cp command in the following format:


    ```

    cp filename /mnt/floppy

    ```


    In Figure 10.1, our imaginary user, rusty, has copied a file to a floppy and then
    verified the contents of the floppy disk.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'FIGURE 10.1

    Floppy disks are an inexpensive backup media and easy to maintain for a small
    number of files.


    ![](img/782ecfdc0b083a767896cc983e10427f_191_0.png)


    > Another compression program that you may want to try is Bzip2. You can learn
    more about Bzip2 by reading the Bzip2 mini-HOWTO.


    # Working with Storage Devices


    You have several ways to store your backups. The choice you make depends on how
    much information needs to be stored, your computer budget, and how much time you
    want to take to configure devices on the Linux system.


    Floppy disks have been used as a backup medium since the early days of computing.
    Floppy disks are inexpensive (and they come already formatted), easy to store,
    and every computer comes with a floppy drive, with the exception of some Macintosh
    setups that only have zip drives. Floppy disks are reasonably reliable, and you
    can lengthen the life of a floppy by storing it correctly. Floppy disks work well
    if you only have a few configuration files to back up, or if you only want to
    backup certain files in your home directory.


    When storage space is a consideration, you may want to consider using removable
    disks on a Zip or Jaz drive. These devices allow you to store over 100MB of files
    and are more reliable than floppy disks. There is also a utility called GtkZip,
    shown in Figure 10.2, that can make managing Zip disks easier. GtkZip can also
    set a security level on Zip disks.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# FIGURE 10.2


    Use your Zip drive to store backups with the GtkZip tool.


    ![](img/782ecfdc0b083a767896cc983e10427f_192_0.png)


    Another backup alternative is a second hard drive. You can easily copy files (or
    the entire system) from the Linux drive to the spare hard drive. Because hard
    drives are not prone to failure until after considerable use, a hard drive that
    is only used to store backups may be a very reliable storage medium. Then when
    it’s time to restore the system, the hard drive can do it much faster than other
    media.


    At about the same price as a hard drive is a read/write CD-R drive. This device
    allows you to make a one-time backup that cannot be overwritten. You should use
    a CD-R drive if you need a permanent record of your backup files. You can also
    archive as much as 650MB of files on a single CD.


    Your choice of storage devices for your important backup files depends on how
    much room you’ll need to store files, what storage devices are already attached
    to the computer system, and how much your budget can afford a new storage device.
    Before you consider a storage device, you may want to read the following HOWTOs:


    +   - If you need help setting up and using a Zip drive, read the "Zip Drive"
    mini-HOWTO. Most Linux distributions will automatically detect any parallel port
    versions of the Zip100 and will install the necessary drivers and create a mount
    point. The SCSI and IDE internal drives are common now and they are treated like
    hard drives. If you have a Jaz drive, read the "Jaz Drive" HOWTO.

    +   - CD writers have recently become affordable to the average home computer
    user. The "CD-Writing" HOWTO explains the CD writers that are compatible with
    Linux, how to set them up, and what software you can use to write data files to
    a CD as well as how to record music onto a CD.

    +   - If you want to back up your entire hard disk onto a second hard drive, read
    the "Hard Disk Upgrade" mini-HOWTO. This procedure allows you to just swap hard
    disks if the primary hard disk fails.'
  merge: -1
  img_proc: true
