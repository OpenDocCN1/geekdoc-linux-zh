- pgno: 137
  md: 'FIGURE 7.1

    The file list displayed by the ls -l command.


    ![](img/782ecfdc0b083a767896cc983e10427f_137_0.png)


    Is it a file or is it a directory? The first column in the file listing tells
    you two things. The first character in the listing indicates whether the item
    is a directory (the d character) or a file (the - character).


    The second item answers an important question: Can I use it? The next nine characters
    (the collection of r, w, and x characters) reflect the access permissions for
    the file. The first group of three characters is the file owner''s permissions,
    the second group of three is the group permissions, and the last group is the
    permissions for all other users. The permissions are read (r), write (w), and
    execute (x). The dash means that access is denied. The third and fourth columns
    display the group and user that own the file.


    > You''ll learn more about setting file permissions, changing file ownership,
    and assigning a file to a group in Hour 12, “Sharing Files with Other Users on
    the System.”


    The last three columns of the file listing display the size of the file (in bytes),
    when it was last updated, and the filename.


    # The Syntax for the ls Command


    The ls command lists the contents of a directory in a variety of formats and the
    files are listed vertically. If no options are used, the names of files and directories
    (but not hidden files) appear in columns across the screen. The following code
    shows the syntax for the ls command:


    ```

    ls [options] [filenames]

    ```'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'that directory will be listed. Wildcards can be used to display certain files,
    such as using *.txt to display only the text files in a directory.


    Try these useful command options:


    +   - To list the files horizontally instead of vertically, type ls -x and press
    Enter.

    +   - File information such as permissions and owners, file size, and modification
    date for each file can be displayed in the long listing. Type ls -l and press
    Enter.

    +   - To display all files including any hidden files, type ls -a and press Enter.
    If you want to include the hidden files in the long listing, type ls -la and press
    Enter.

    +   - Different characters can be added to the end of a filename to make it easier
    to recognize different file types. Type ls -F and press Enter. A slash (/) appears
    after directories, an asterisk (*) after executable files, and an at (@) character
    after symbolic links.


    ![](img/782ecfdc0b083a767896cc983e10427f_138_0.png)


    > You can use multiple command options after the dash (-) character (for example,
    the ls -la command). It does not matter in which order the command options appear,
    so ls -la and ls -al provide the same output. You can only use multiple command
    options with commands that use single letters to specify command options.


    # Redirecting the Command Output


    Displaying a file list in the long list fashion is fine if the file list isn''t
    too long and fits on the screen. If you have a long list of files, the list will
    just scroll on past and you''ll miss most of the information. You have choices—you
    can display the file list in a pager (such as less) or you can send the output
    to a file or to the printer. This looks like a good time to practice those pipe
    and redirection skills.


    If you send the output to the less pager, you can scroll through the list at your
    leisure. To send the file list to the pager, type ls -l | less and press Enter.
    By sending the output to a file, you''ll need to display the file in a text editor.
    To create the text file, type ls -l > filename.txt and press Enter.


    ![](img/782ecfdc0b083a767896cc983e10427f_138_1.png)


    > You''ll learn about the vi text editor in Hour 8, "Text Editing with vi." You
    might also find other text editors installed on your system, such as emacs, gedit
    (for GNOME), or kedit (for the K Desktop Environment).'
