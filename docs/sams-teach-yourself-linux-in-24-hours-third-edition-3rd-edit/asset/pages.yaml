- pgno: 269
  md: 'This will copy your new kernel and system.map to the boot directory, /boot,
    with the version and all the correct names, and it will change the respective
    links. It will also back up your old files with a .old extension and run lilo
    to fix it for your new kernel. If you want to, you can use linuxconf later to
    set up lilo to boot either the new or the old kernel when you choose, if that
    is desired.


    That''s it! You''re finished! Well, almost... Pour yourself a stiff drink, assume
    a praying-like posture in front of your computer, and reboot. You will be enjoying
    the fruits of your labors, with the new kernel working just as you envisioned
    and everything running perfectly, in minutes. Anyway, if it doesn''t work, you
    still have the old kernel that you can boot back into and try it again.


    # Summary


    During the past hour, you followed the long and involved process of upgrading
    the Linux kernel. Remember that it isn''t always necessary to upgrade every piece
    of software, utility, command, kernel, library, and programming language every
    time a new version comes out. Think before you upgrade. Will the upgrade be beneficial
    to you and your system? If you don''t see the added value, don''t do it. But,
    if you need the new kernel to support the fancy new piece of hardware that you
    just purchased, carefully read this chapter again and read the other sources of
    information listed in this hour so that you are well prepared.


    # Q&A


    Q Is there an easier way to upgrade my system? This kernel stuff is more than
    I can deal with and I''m afraid of wrecking my system.

    A You might want to wait until the next version of your favorite Linux distribution
    comes out. When you install the new version, you can select the Upgrade option
    when the installation starts. Not only will the kernel be updated, but all your
    favorite applications will be upgraded as well.


    Q How do I find out which version of the Linux kernel is installed on my system?

    A That''s an easy one! Just type `uname -a` and press Enter at the command line.
    Not only will you see the kernel version, but you''ll also see the hostname of
    the computer, the number of times the kernel has been compiled, the date on which
    the kernel was compiled, and the model of the computer''s processor.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'Q You mentioned the GNU Hurd. What is the GNU Hurd and where can I find out
    more information?


    A The GNU Hurd is a UNIX kernel developed by the Free Software Foundation. You
    can learn more about GNU Hurd at www.gnu.org/software/hurd.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    # Quiz


    1. What is the first thing that you should do before you consider upgrading the
    kernel?


    Before you begin, you should familiarize yourself with the kernel upgrade process
    as much as possible. There''s lots of information for you to read that will give
    you some good advice on why and when you should upgrade the kernel and how the
    upgrade process works. You should feel comfortable with this process before you
    make your first attempt.


    2. How do you tell the difference between a production kernel and a development
    kernel?


    Kernels that use an even minor number, such as 2.2.x, are production or stable
    kernels with the bugs removed. Those kernels numbered with an odd minor number,
    such as 2.3.x, are development kernels. Development kernels are for testing purposes
    and might contain lots of bugs. You can think of a development kernel as beta
    software.


    3. What should you do to prepare yourself before you install a new kernel?


    You will need to make sure that the required libraries and utilities installed
    on your system are updated to a certain minimum version number. If your system
    is not up-to-date with the needed libraries and utilities, the kernel will not
    install properly.


    # Exercises


    1. In Table 16.1, the minimal required versions of the libraries and utilities
    necessary to upgrade to the 2.3 kernel were listed along with the command that
    tells you the version number of each of the libraries and utilities. Check your
    system to see what versions are installed. While you are at it, you might want
    to check on the version numbers for some of the other programs that you use, such
    as The Gimp and Netscape Navigator. If you are using an older version, you might
    want to see whether upgrading the program will be of benefit to you.'
  merge: -1
