- pgno: 201
  md: '# Understanding the Linux Print Services


    Before you can print any documents from the cool GNU applications that you''ve
    been learning about, you need to configure a printer. Linux doesn''t provide any
    comfortable plug-and-play, auto-detecting hardware and easy installation methods
    for printers.


    In fact, Linux has a complex printing system that allows many users to print to
    several computers at one time. Linux doesn''t care if all the printers are busy;
    it can patiently hold onto a print job until the printer is ready.


    When you press the print button in an application or execute the lpr command,
    as shown in Figure 11.1, the command takes the file and temporarily stores it
    in a holding area called a spool directory. The file waits in the spool directory
    until the line printer daemon (the lpd) realizes that there is a file waiting
    to be printed. At this point, the lpd makes a copy of itself, grabs the file in
    the spool, and waits with the file until the printer is available. Then, when
    the printer is free, lpd and the file head off to the printer where the file is
    printed.


    FIGURE 11.1

    The line printer daemon watches the spool directory for any files that may come
    its way.


    ![](img/782ecfdc0b083a767896cc983e10427f_201_0.png)


    **New Term** The print spool is a directory in the filesystem in which files are
    temporarily stored until they can be sent to the printer.


    If there are several printers attached to the system, each printer has it''s own
    spool directory. You would tell the lpr command which printer you want the file
    to print to by specifying the spool directory associated with that printer. The
    line printer daemon spawns an lpd for each spool directory on the system.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Task: Attaching the Printer to the Computer


    Before you can configure printing services in Linux, you must attach the printer
    to the computer and make sure that the operating system can connect to the printer
    port and communicate with the printer. Before you set up printing services, follow
    these steps to make sure the printer is operating correctly:


    +   1. Check the printer compatibility with the Linux operating system. One source
    of information is the Linux Hardware Compatibility HOWTO. You may also want to
    read the Linux Printing HOWTO.

    +   2. Attach the printer to the computer. Shut down the computer and turn off
    the power. Attach the printer''s serial or parallel port cable, plug in the printer''s
    power supply, and turn on the printer. Turn on the computer and start the operating
    system.

    +   3. Determine the port to which the printer is attached and the printer device
    being used. Type `dmesg | less` and press Enter. You may need to scroll to the
    bottom of the file (use the spacebar to scroll down one screen at a time) to find
    the printer information. Here''s an example of printer information found by the
    kernel during the system boot:

    +   4. Make sure that the connection between the device file and the printer works.
    Type `ls > /dev/lp0` and press Enter. Alternatively, if the printer is connected
    to lp1, type `ls > /dev/lp1` and press Enter. The printer should print the current
    directory listing.


    ```

    parport0: PC-style at 0x378 [SPP,PS2]

    parport0: Printer, Hewlett-Packard HP LaserJet 1100

    lp0: using parport0 (polling).

    ```


    Printers usually use the lp0 or lp1 printer device. The last line in the preceding
    listing shows that the lp0 printer device is being used by the printer. This means
    that the device file for the printer is named /dev/lp0. If your listing shows
    lp1, the printer device file is named /dev/lp1.


    # Configuring the Print System


    Once the printer is attached and can communicate with the operating system, you''ll
    need to set up the print system. This involves giving the printer a name, assigning
    a directory to the print spool, specifying the printer device file, and telling
    the line printer daemon a few specifics about the printer hardware.


    ![](img/782ecfdc0b083a767896cc983e10427f_202_0.png)'
  merge: -1
  img_proc: true
