- pgno: 298
  md: '# Hour 19


    # Installing a Window Manager


    A window manager is not absolutely necessary. It is quite possible to run X Window
    applications without a window manager, but it’s a pretty limited show. Window
    managers are software applications that manage the appearance and placement of
    windows on your screen. Window managers draw the window borders and decorations,
    and they provide the scrollbars and bells and whistles. The X server is actually
    responsible for drawing everything on the screen, but window managers give the
    desktop a particular look and feel and many provide a method for launching applications.


    In this hour, you will


    +   - Learn about the different window managers that are available on your system

    +   - Change the window manager for your graphical desktop

    +   - Find more information about what you can do with the X Window System


    ![](img/782ecfdc0b083a767896cc983e10427f_298_0.png)'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Choosing a Window Manager


    At this time, there are two main graphical interface desktops for Linux—GNOME
    and KDE. These are not window managers but are GUI desktop system applications
    that can be run with varied success on different window managers. KDE has its
    own window manager, a very good one, called kwm. The GNOME desktop runs best on
    the Enlightenment window manager. These desktop systems are both very feature
    rich, with drag and drop, automatic window focus, and a very large collection
    of their own applets, tools, utilities, and toys. Unfortunately, both of them
    are also big resource users. The Linux distributions from Red Hat, SuSE, TurboLinux,
    Linux-Mandrake, and some others provide both GNOME and KDE. The Debian distribution
    supplies only GNOME.


    ![](img/782ecfdc0b083a767896cc983e10427f_299_0.png)


    > For more information about the KDE and GNOME desktop environments and how to
    use them, see Appendix A, “Getting Started with the KDE Desktop Environment,”
    and Appendix B, “Introducing GNOME and LinuxConf.”


    Your personal choice of a window manager will be governed by your needs and preferences.
    There are window managers that are better suited for particular tasks, or even
    for particular tastes. Some are better choices for different setups, whereas others
    are more compatible with one desktop environment (such as GNOME or KDE) or another.
    Here is a short list that includes brief descriptions of a few of the dozens of
    choices:


    +   - The fvwm window manager is a basic window manager that enables you to launch
    programs from a menu that pops up when you click a blank spot on the desktop.
    It also has a customizable button bar called GoodStuff. It’s a good choice for
    systems lacking much CPU power or memory because it is small and fast.

    +   - The fvwm2 window manager is an improved version of fvwm that has been popular
    with Linux users for a long time. It has all the features of fvwm, plus some nice
    new additions. It is a good choice if you don’t want to run GNOME or KDE.

    +   - The fvwm95 window manager is an updated version of fvwm that is configured
    to look like Microsoft Windows 95. The fvwm95 window manager provides a familiar
    look and feel for people switching over from the Microsoft Windows operating system.
    It also has the GoodStuff button bar.

    +   - AfterStep is based on the NeXT operating system’s NeXTStep desktop. AfterStep
    is a good window manager for those who want flashy graphics or sound. AfterStep
    is also easier to configure than some of the other window managers.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '+   - Enlightenment’s goal is to be the most configurable window manager. Not
    only can you select between different border and window styles, but you can also
    design your own. In fact, you can configure every detail about Enlightenment.
    A graphical configuration utility gives you control over the look and feel and
    enables you to select between themes. Enlightenment is the window manager that
    is most compatible with the GNOME desktop.

    +   - The kwm window manager supports the KDE desktop and its large array of tools,
    utilities, and applications.

    +   - The xwm window manager is the native X Window System window manager. It
    runs applications in separate windows called xterms. It has a small memory footprint
    and is particularly suited to running X Window System applications over a network.

    +   - Sawfish (which might still be called Sawmill in your distribution) is a
    lightweight and fast new entrant that many GNOME users are finding very nice to
    use. It is the default for GNOME in the Linux-Mandrake distribution.


    In addition to these window managers, there are probably an additional three-dozen
    other window managers that do the same job to varying degrees. You can download
    many of them from the Internet; some are free, and some are not. You might even
    have several of them that were included with your Linux installation.


    If you installed the Linux-Mandrake distribution, during the installation you
    were asked whether you wanted to install additional window managers. If you elected
    to do so, changing to another of these window managers can be a simple exercise
    in script writing. Even simpler, if you are using the GNOME and KDE desktops,
    you can use a graphical tool for changing your window manager and desktop. It
    is called switchdesk. To use switchdesk from inside either desktop, you can select
    it from the menu, or type switchdesk in a terminal emulator. To learn more about
    using switchdesk see Appendix A.


    ![](img/782ecfdc0b083a767896cc983e10427f_300_0.png)


    > Each window manager has a configuration file. Some desktop environments, such
    as GNOME and KDE, provide graphical interfaces for changing and configuring their
    window managers. If you are not familiar with configuring window managers, it''s
    a good idea to begin with the default version. You''ll then want to look at the
    documentation for your selected window manager to learn more about customizing.


    # Task: Changing the Window Manager


    For the new Linux user, changing your desktop environment is not an easy task,
    unless you just want to use the desktop switching tool, switchdesk, to change
    between KDE.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'GNOME, and fvwm. Without switchdesk, changing your desktop environment means
    editing configuration files. The problem is that many Linux distributions do not
    always use the same files. So, we''re going to cheat, and have the system create
    some files to get you started. Then all that needs to be done is one simple edit
    to one file. So, let''s get started:


    +   1. Log in to your user account and start the default desktop environment.
    Type startx and press Enter.

    +   2. List the window managers that are installed on the system. Look at the
    file that lists the window managers that are loaded on your system. To do this
    at the command line, type less /etc/X11/window-managers and press Enter. Your
    output might look similar to the example in Figure 19.1.


    # FIGURE 19.1


    Scroll through the list to see which window managers are installed on the system.


    ![](img/782ecfdc0b083a767896cc983e10427f_301_0.png)


    As you can see, this file is organized into snippets of information and code for
    each window manager (each entry is separated with the ... line). These contain
    the name of the window manager, the name of its icon file, a short snazzy description,
    the location of its startup file, and the command entry that you need to put in
    the .Xclients file in your home directory to make it the default window manager.


    For this task, we''ll change to the AfterStep desktop environment, which uses
    the following script:


    ```

    exec /usr/X11R6/bin/afterstep

    ```'
  merge: -1
