- pgno: 293
  md: '8. Select a video card. Type y and press Enter to look at the card database.
    Scroll through the list (by pressing Enter to move from page to page) until you
    find the video card installed in the computer. When you find the card, type the
    corresponding number (it appears to the left) and press Enter. The information
    that appears is important. It might look something like this:


    Your selected card definition:

    Identifier: SIS 620

    Chipset: SiS620

    Server: XF86_SVGA

    Do NOT probe clock or use any Clock line.


    You will need to remember the information in the last line for use later in the
    configuration process. Press Enter to keep going.


    9. Select a server. Type 5 and press Enter to use the server for the card that
    you selected in step 8. You will be asked whether you want to create a symbolic
    link. Type y and press Enter.


    10. Select the amount of video RAM installed on the video card. Type the corresponding
    number and press Enter. You will then be asked to provide information about the
    video card. You can just press Enter to move through these fields.


    11. Provide a Clockchip setting. Select a number from the list and press Enter.
    Or, if the card definition said to NOT probe clocks or use any Clock line, just
    press Enter.


    12. Probe the clock. Type y and press Enter if you want to use X -probeonly unless
    the card definition said not to. In that case, type n and press Enter.


    13. Change the color depths. The list shows the order in which you can cycle through
    color depths. If you want to change the order, select the number that corresponds
    to the color depth you want to change. Read the directions to help you through
    each color depth that you change.


    ![](img/782ecfdc0b083a767896cc983e10427f_293_0.png)


    > > When you change color depths, you will be asked whether you want a virtual
    screen that is larger than the physical screen. Type n and press Enter if you
    don''t want a display that is larger than the monitor screen. This option is useful
    only if you are working on a laptop.


    14. You''re now at the end. Write the configuration to the /etc/X11/XF86Config
    file. Type y and press Enter.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Cycling Through Display Modes


    After you have a working X server and the picture on your monitor looks good,
    you can easily change the screen resolution and color depth. Just press Ctrl+Alt
    and the plus (+) key on the number keypad at the far-right side of the keyboard.


    Different distributions might also have a utility that performs this same function.
    In Linux-Mandrake, you can use the Xdrakres utility (see Figure 18.5) to change
    resolution and color depth. To find Xdrakres, open the DrakConf tool and click
    the Change X Resolution button.


    FIGURE 18.5

    Use Xdrakres to select a video display mode.


    ![](img/782ecfdc0b083a767896cc983e10427f_294_0.png)


    Choose a screen resolution


    Select a color depth


    # Summary


    If you had problems installing and configuring the X Window System during the
    installation of the Linux operating system, this hour helped you prepare to fix
    your display problems. You learned where to find more resources about your video
    card and monitor. You also saw how to use the xf86config command to make adjustments
    and fine-tune the display. If you still have problems, make sure that you have
    compatible video hardware and that you made the right choices during the configuration
    process.


    # Q&A


    Q The display isn''t centered on the monitor correctly. A black line runs along
    one edge of the screen and part of the desktop is hidden on the other side. How
    can I adjust this?


    A The first thing that you should do is adjust the position controls on the monitor.
    Most monitors have buttons on the front that enable you to change the size of
    the picture or to move the picture right, left, up, and down. If that doesn''t
    work, try xvidtune. This program can move the display around on the screen. To
    use xvidtune, open a terminal emulator, type xvidtune, and press Enter. Read the
    warning message and click OK. Click the Auto button. You can then move the display
    up, down, left, or right. You can also make it wider, narrower, shorter, or taller.'
  merge: -1
  img_proc: true
