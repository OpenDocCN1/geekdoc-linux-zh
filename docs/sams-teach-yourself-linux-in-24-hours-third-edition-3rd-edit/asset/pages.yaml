- pgno: 310
  md: '![](img/782ecfdc0b083a767896cc983e10427f_310_0.png)


    # Hour 20


    # Talking to Users over a Network


    Whether your Linux system is attached to a network or is used as a standalone
    machine, you can easily communicate with those people with whom you share computer
    resources. These methods don’t require an Internet connection or an Ethernet card;
    all you need to do is learn a few simple commands and edit a few files.


    If your computer is attached to a network, you can easily find out which users
    are logged into the system and send them a message. The message appears on their
    terminal screens, and they can issue a single command to send a response back
    to you. This back-and-forth communication may sound similar to electronic mail.
    When you don’t have time to wait for a response, you can talk to other users using
    an interactive communication utility similar to Internet Relay Chat (IRC).


    However, what do you do when your computer is not connected to a network but is
    shared by several people? Well, it’s time to call in a text editor and set up
    a bulletin board system. You can edit two files so that messages can be displayed
    on a login screen or after a user logs into his or her account.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'In this hour, you will:


    +   - List users who are logged in and how long their account has been active
    or idle

    +   - Use the write and talk commands to communicate with other users on the system

    +   - Change the login message and display a message of the day when users access
    their accounts


    # Networking with Linux


    The purpose of a computer network is to store and distribute data so that a group
    of people can share information easily and efficiently. When several people need
    to work together on a project, a network allows each person to work at his or
    her own computer and share files between members of the group. The group members
    can view the same file simultaneously, and even simultaneously add or delete data
    from a file, all without disturbing the work of the other users. Computer networking
    offers some real advantages. It reduces the amount of time and effort required
    to share a single file between several users and enhances communication between
    group members.


    **New Term** A computer network is an interconnected assortment of computers,
    printers, hubs, cables, and other peripherals that store and manipulate data.
    A client/server network provides a connection to the server(s) that provide central
    repositories where users can store and retrieve files, and where users can share
    their data with other users. Microsoft Windows users might be familiar with the
    peer-to-peer networking concept in which machines may be connected by a cable
    and share messages and files without a server. Linux can be networked that way,
    but it already has facilities for a true client/server network that runs TCP/IP
    just like the Internet, and can be utilized through a browser in identical fashion.


    Linux can be used in several ways to set up a computer network. The most common
    network configuration is the client/server network, shown in Figure 20.1. Most
    Linux networks use the client/server configuration, where a server controls the
    entire network and workstations are connected to the server through a network
    hub.


    A client/server network is a good solution for the small business that needs to
    share information and computer hardware among several employees. Also, if you
    have more than one computer in your home and want to share files, printers, and
    Internet access, it may be time to take the network plunge. If you want to learn
    more about using Linux to set up a network, start with these Linux HOWTOs:'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# FIGURE 20.1


    This simple network accommodates four workstations (the clients) with one server.


    ![](img/782ecfdc0b083a767896cc983e10427f_312_0.png)


    +   - The “Linux Networking Overview” HOWTO is the first place to start. This
    HOWTO provides an introduction to the networking capabilities of Linux, describes
    networking protocols (such as TCP/IP and PPP), and explains file and printer sharing.

    +   - The “Linux Networking” HOWTO, which has until recently been known as the
    “Net-3” HOWTO, explains what you’ll need before you start building a network.
    In it you’ll find information about how you’ll configure network interface cards
    and what you need to know to set up the server.

    +   - The “Ethernet” HOWTO lists the various Ethernet cards that are compatible
    with Linux and explains how you should configure them to work with the operating
    system. This HOWTO also discusses the different types of cable you can use to
    hook the network together.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'A less common way to network your computer is by attaching one or more terminals
    to a computer, as shown in Figure 20.2. Using this configuration, a single computer
    controls more than one computer monitor through a serial port connection. A variety
    of terminals can be connected to a standalone computer this way—dumb terminals,
    text terminals, and graphics terminals. This is a very cost effective way of setting
    up a small network. For more information on how to connect terminals to a computer,
    check out the “Text Terminal” and “Serial” HOWTOs.


    > A serial connection is not the only way to do this. You can also use a network
    card and category five Unshielded Twisted Pair (UTP) wiring.


    ![](img/782ecfdc0b083a767896cc983e10427f_313_0.png)


    FIGURE 20.2

    Attach several terminals to a computer through the serial port.


    ![](img/782ecfdc0b083a767896cc983e10427f_313_1.png)


    # Locating Users on a Network


    Because Linux is a multi-user, multitasking operating system, many people can
    share the resources of one computer. If the computer is attached to a network,
    there will be many users sharing the same network resources. If the computer is
    a standalone computer, several users can share the computer simultaneously using
    connected dumb terminals.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'When all these people are logged into the system, how do you keep track of
    them all? An easy way to find out which users are logged into the system is with
    the who command. At a minimum, the who command will tell you which users are logged
    in. the terminals at which they''re working, and how long each user has been logged
    in.


    # Listing Users on the Network


    When you only need to know which users are logged in, the terminals at which they
    are working, and the times that they logged in, simply type who at the shell prompt.
    Listing 20.1 shows the output of the who command when there are five users using
    the system.


    # LISTING 20.1 Sample Output from the who Command


    ```

    [rusty@localhost rusty]$ who

    root      tty1   Jun 12 03:00

    rusty     tty2   Jun 11 11:35

    mona      tty3   Jun 11 12:09

    dezi      tty4   Jun 11 11:36

    lucy      tty5   Jun 11 11:36

    ```


    Another way to find out who is using the network is with the finger command. The
    finger command displays the same information as the who command and adds the user''s
    real name, how long the account has been idle, an office number, and a phone number.
    Listing 20.2 shows the logged-in users displayed by the finger command.


    # LISTING 20.2 Sample Output from the finger Command


    ```

    [rusty@localhost rusty]$ finger

    Login Name    Tty Idle Login Time Office Office Phone

    root  C Withers 1 05:53 Jun 12 03:00

    rusty R Spoon   2     Jun 11 11:35

    mona  M Rossman 3     Jun 11 12:09

    dezi  D Forearm 4 22:57 Jun 11 11:36

    lucy  L Amber   5 22:53 Jun 11 11:36

    ```


    You may wonder where finger finds this extra information. The user''s real name
    is displayed if the name is contained in the user''s password file. The idle time
    is the amount of time that has passed since the user did anything with the account
    (such as type something at the keyboard or click the mouse).'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# The Syntax for the who Command


    When you want to know which users are logged into the system and how long their
    accounts have been active, use the who command. The following code shows the syntax
    for the who command:


    ```

    who [options]

    ```


    The who command can be used without any additional parameters, or you can add
    one or more of the following command options to display additional information
    about the logged-in users:


    +   - When you need a quick reminder of the options available for the who command,
    use the shell''s `-help` command option.

    +   - When you''re not sure which user account you are logged into, use the am
    i command option to display the username, the hostname, the terminal logged into,
    and the amount of time you have been logged in.

    +   - To add column headings to the output of the who command, use the `-H` command
    option.

    +   - A list of logged-in users and the total number of users logged in can be
    displayed with the `-q` command option.

    +   - Sometimes a user may be logged in but not actively working in his or her
    account. To see how long accounts have been in use or idle, use the `-i` command
    option.

    +   - To see whether a user is accepting messages (which you''ll learn about later
    in this chapter), use the `-w` command option.


    # Displaying User Information


    The finger command can also be used to display specific information about an individual
    user. Listing 20.3 shows the information displayed for the user "dezi."


    # LISTING 20.3 The Results of the finger dezi Command


    ```

    [rusty@localhost rusty]$ finger dezi

    Login: dezi                 Name: D Foresarm

    Directory: /home/dezi       Shell: /bin/bash

    On since Sun Jun 11 11:36 (EST) on tty4   22 hours 57 minutes idle

    No mail.

    Plan:

    I''ll be out of the office next week. I''m taking a vacation.

    Time to pull weeds and plant seeds.

    ```'
  merge: -1
  img_proc: true
- pgno: 316
  md: '![](img/782ecfdc0b083a767896cc983e10427f_316_0.png)


    > If you want others to know a little more about you, create a Plan file using
    your favorite text editor. This file needs to be located in your home directory
    (dezi would store this file in /home/dezi), and the file is named .plan. LISTING
    20.3 The Results of the finger dezi Command


    # Sending Messages to Other Users


    One way to send a quickie message to another user on the system is with the write
    command. The write command allows you to leave a message for another user who
    is logged into the system. When the other user is ready to respond to your message,
    he or she will also use the write command to send the reply.


    ![](img/782ecfdc0b083a767896cc983e10427f_316_1.png)


    > If you are not able to use the write command, the superuser will need to enable
    messages. From the root shell prompt, type mesg y and press Enter.


    # The Syntax for the write Command


    One way to send messages across a network without having to set up an email system
    is to use the write command. The following code shows the syntax for the write
    command:


    ```

    write username [ttyname]

    Your message here

    Ctrl+D

    ```


    Here, username is the name of the user to whom you want to send a message and
    the ttyname parameter indicates the terminal at which the user logged in. Use
    the ttyname parameter when a user is logged into more than one terminal to specify
    which terminal to send the message.


    # Sending Messages


    The write command allows two users to communicate across the network without using
    email or voice mail. Before you use the write command to send a message to another
    user, you''ll need to make sure that the other user is logged into the system.
    For example, users rusty and mona are working together on a project and rusty
    needs to ask mona a question. To see if mona is logged in, rusty would use the
    who command (by typing who and pressing Enter at the shell prompt) to check and
    see whether mona is working at the computer.


    ![](img/782ecfdc0b083a767896cc983e10427f_316_2.png)'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'Once rusty has determined that mona is logged in, rusty would send the message
    by typing write mona and pressing Enter. The cursor appears on the next line and
    rusty can type the message. When rusty has finished composing the message, pressing
    Ctrl+D sends the message to mona. Here''s what displays on the terminal at which
    rusty is working:


    ```

    [rusty@localhost rusty]$ write mona

    Do you have the schedule for the next two weeks?

    [rusty@localhost rusty]$

    ```


    Now rusty just sits back and relaxes until mona sends a reply.


    # Replying to Messages


    When a message arrives from another user, you''ll again use the write command
    to respond to the user. In the previous message that rusty sent to mona, the message
    appears as follows on the terminal at which mona is working:


    ```

    Message from rusty@localhost.localdomain on pts/1 at 02:16

    Do you have the schedule for the next two weeks?

    EOF

    ```


    Before mona can respond, the Enter key must be pressed in order to display the
    shell prompt. Then, mona can reply by executing a command similar to the following:


    ```

    [mona@localhost mona]$ write rusty

    You''ll need to ask Dezi for the updated schedule.

    ```


    After mona has finished composing the message, pressing Ctrl+D (the Linux end-of-file
    character) sends the message back to rusty.


    ![](img/782ecfdc0b083a767896cc983e10427f_317_0.png)


    > You may want to use communication commands (such as write and talk, discussed
    later) sparingly when communicating with other users. Some people do not like
    to be interrupted while they are working. You may also want to keep your messages
    short; a line or two is usually enough to give short instructions, leave requested
    information, or request a meeting.


    # Sending a Message to All Users


    There may be times when you need to send an important message to each and every
    user who is logged into the system. A system administrator may want to let everyone
    know when the system will be going down for repair, or the boss may want to let
    everyone know about an emergency staff meeting. The wall (write all) command sends
    a message to every user on the system. To send a message to every user, use the
    following command :'
  merge: -1
  img_proc: true
- pgno: 318
  md: '```

    [rusty@localhost rusty]$ wall

    Staff meeting at 3pm today.

    Ctrl+D

    ```


    As you might have noticed, the wall command works the same way as the write command.
    You execute the command, type a message, and press Ctrl+D to send the message.
    The message that is sent displays on each user''s terminal, as follows:


    ```

    Broadcast message from rusty (tty2) Mon Jun 12 02:38:37 2000...


    Staff meeting at 3pm today.

    ```


    If a user wants to reply to the broadcast message, he or she can use the write
    command to send a message to the sender.


    # Turning Off Messages


    There may be times when you don''t want to receive messages from other users.
    You may be talking on the telephone and don''t want any distractions, or you may
    be processing a large file and you don''t want to add a heavier load to the system
    resources.


    When you don''t want to receive messages from other users, type mesg n and press
    Enter. Whenever someone tries to contact you using the write or talk command,
    a message similar to the following appears on their screen:


    ```

    write: rusty has messages disabled

    ```


    When you are ready to accept messages again, type mesg y and press Enter.


    # Having a Two-way Conversation with Another User


    Sometimes it may be more efficient to have a direct conversation with another
    user on the network. By using the talk command, you can call up another user and
    have a one-on-one conversation. If you visit the Internet chat rooms, you''ll
    find the talk command works in somewhat the same way.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# FIGURE 20.3


    You will have to wait until your invited guest joins the conversation.


    ![](img/782ecfdc0b083a767896cc983e10427f_319_0.png)


    When rusty receives the request from mona for a little talk, a message like the
    following will appear on the screen:


    ```

    Message from Talk_Daemon@localhost at 17:37 ...

    talk: connection requested by mona@localhost.

    talk: respond with: talk mona@localhost

    ```


    The last line of the message tells rusty what command to use to connect with mona.
    In order for rusty to chat with mona, rusty would type talk mona@localhost at
    the shell prompt. When rusty has responded, both terminals display a message saying
    that the connection was established. Now that the two users are connected, they
    can begin their conversation. The user who is sending the message will type the
    message in the top half of the screen (don''t worry about placing the cursor;
    the talk command does that for you). Responses from the recipient user appear
    in the bottom half of the screen. An example of a talk conversation is shown in
    Figure 20.4.


    The talk command sends everything you type to the recipient as you type it. There
    are no special characters to type to display the message on the recipient''s terminal.
    When the talk conversation is concluded, press Ctrl+D to end the session.'
  merge: -1
  img_proc: true
- pgno: 320
  md: "FIGURE 20.4\nLooking at the terminals for mona and rusty after their conversation\
    \ has started.\n\n![](img/782ecfdc0b083a767896cc983e10427f_320_0.png)\n\n# Using\
    \ an Office Message Board\n\nIn addition to the write and talk commands, you can\
    \ communicate with users over the network in other ways. The first way is to change\
    \ the message that appears before the login prompt. Another way to leave messages\
    \ for all users is to change the message that appears after a user logs into his\
    \ or her account.\n\n# Changing the Login Message\n\nThere may be times when you\
    \ want to relay information to users before they log into the system. Linux uses\
    \ the /etc/issue file to change the information that displays on an unused terminal.\
    \ You can use this file to add your company name to the login screen, to notify\
    \ users of company policy regarding logins, or to post the hours that the system\
    \ is available for use.\n\n![](img/782ecfdc0b083a767896cc983e10427f_320_1.png)\n\
    \n> The login screen for each distribution is different. The login screen for\
    \ Linux-Mandrake contains the following information:\n> \n> LinuxMandrake release\
    \ 7.1B (hydrogen)\n> Kernel 2.2.15-0.25mdk on an 8586 / tty1\n> localhost login:\n\
    > \n> On the Slackware distribution, the login screen may look like:\n> \n> Welcome\
    \ to Linux 2.2.13\n> darkstar login:\n> \n> Even though these login screens are\
    \ different, each distribution uses the /etc/issue file to control the login message,\
    \ and only the superuser can make changes to the file."
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Task: Customizing the Login Screen


    When you want to display a message on an unused terminal that anyone can read,
    you''ll need to edit the /etc/issue file. Here''s how to open the vi text editor
    and make a few changes:


    +   1. Log in as superuser.

    +   2. Open the /etc/issue file in the vi text editor. Type vi /etc/issue and
    press Enter. The file appears in the text editor and may look something like the
    /etc/issue file shown in Figure 20.5.


    FIGURE 20.5

    The original /etc/issue file from the Linux-Mandrake distribution with an added
    login message.


    ![](img/782ecfdc0b083a767896cc983e10427f_321_0.png)


    Tux, the penguin


    Original login message


    Message added by the superuser


    +   3. Place the cursor at the end of the file. Press the J key to move the cursor
    down a row.

    +   4. Type the message that you want to appear on the login screen.

    +   5. Save the file and exit vi. Press Esc, type :wq, and press Enter.

    +   6. Your message won''t update until you log out and back in again. Change
    to an unused terminal (press Alt plus a Function key) and take a look at your
    changes.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Creating a Message of the Day


    Another way to leave messages for users is to create a message of the day that
    users will see as soon as they log into their accounts. This message appears after
    a user logs in and just before the shell prompt. In order to create a "message
    of the day" file, open the file named /etc/motd in a text editor and add any text
    you want. If this file does not exist, you''ll need to create it. Figure 20.6
    shows a sample /etc/motd file.


    FIGURE 20.6

    Create a message of the day file to inform employees or family members of important
    events.


    ![](img/782ecfdc0b083a767896cc983e10427f_322_0.png)


    When creating a message of the day file, keep the message short so that it will
    fit on a terminal screen. Also, remember that this message appears after the user
    has logged in.


    # Summary


    During the past hour, you learned how to be nosy and find out who''s using the
    same computer/network as you are. Once you know who''s on the system, you can
    use a couple of easy commands to get in touch with those users or leave them a
    message. You also learned how to edit the /etc/issue and /etc/motd files to leave
    messages for other users.'
  merge: -1
  img_proc: true
- pgno: 323
  md: "# Q&A\n\nQ I've set up several user accounts in which to work. I use one account\
    \ for my everyday work, and I use the other account to test out the new things\
    \ I learn about Linux. I sometimes get confused as to which account I am using.\
    \ Do you have any help?\n\nA When you want to know who you are, at the shell prompt\
    \ type who am i and press Enter. This command will tell you the name of the computer\
    \ at which you are working, the domain (if the computer is attached to a network),\
    \ the username, the terminal at which you are working, and when you logged in.\n\
    \nQ I know I can use the finger command to find people on the Internet. Can I\
    \ use the who command to search for people on the Internet?\n\nA If you want to\
    \ find someone on the Internet, you'll need to use the finger command. The who\
    \ command only lists those users who are logged into the same system you are logged\
    \ into.\n\nQ How do I spell check the login message file and the message of the\
    \ day file?\n\nA Use the ispell command. After you have created a message of the\
    \ day file or a login file, save the file and close it. To check the spelling\
    \ of the message of the day file, type ispell /etc/motd and press Enter. Although\
    \ any user can use the ispell command, only the superuser can spell check restricted\
    \ files (such as /etc/motd and /etc/issue). To learn more about ispell, read the\
    \ manual page by typing man ispell at the shell prompt.\n\n# Workshop\n\nTest\
    \ your knowledge of the material covered in this hour by answering the following\
    \ questions and working through the exercises.\n\n# Quiz\n\n+   1. What are the\
    \ two different ways you can network computers using Linux?\n+   \n+   The first\
    \ is the client/server network, where one computer acts as a server and workstations\
    \ are attached to the server through a network hub. A client/server network makes\
    \ it easy to share computer resources, files, printers and other peripherals,\
    \ and an Internet connection.\n+   \n+   Another way to build a network is to\
    \ attach a series of terminals to a host computer using serial interface cables.\
    \ You can attach dumb terminals, text terminals, graphics terminals, and network\
    \ computers using this method."
