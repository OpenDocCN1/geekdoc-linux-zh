- pgno: 52
  md: '# Setting Up the Filesystems


    Now it''s time to setup the hard drive (or the partition on the hard drive) in
    which you want the Linux operating system to live. It is recommended that you
    set up four partitions for the Linux filesystem: a boot partition, a root partition,
    a swap partition, and a home partition.


    > You can have Linux-Mandrake automatically create the different partitions you
    need by clicking the Autoallocate button.


    Linux may be set up as the sole operating system installed on the machine or it
    may be installed and share the drive with others. A lot of older equipment can
    suffer under the load of trying to run modern versions of Windows with all the
    bells and whistles.


    > **Selecting a Test System**

    > We have an antique computer that we have been using for a number of years to
    practice riding the exciting, rocky GNU road. It''s a Pentium 133, and as a Microsoft
    Windows machine, its usefulness had all but disappeared. It crashed constantly
    and the drive sounded like a washing machine. Two years ago, we installed GNU/Linux
    as its sole operating system and have only had to perform routine system maintenance
    to keep it running; it has purred like a kitten since. We use it daily as a test
    machine and as a workstation.


    Listing 2.1 shows a sample filesystem set up using GNU/Linux as the sole operating
    system. The information displayed is for a computer that will be running only
    the Linux operating system, has a 16-gigabyte hard drive, and 192 megabytes of
    RAM.


    # LISTING 2.1 Creating Partitions with GNU/Linux as the Sole Operating System


    | DEVICE | FILESYSTEM TYPE | SIZE | MOUNT POINT |

    |---|---|---|---|

    | hda1 | Linux native | 118MB | /boot |

    | hda2 | Linux native | 9996MB | / |

    | hda3 | Linux native | 5500MB | /home |

    | hda4 | Linux swap | 509MB |  |


    Listing 2.2 shows an example filesystem set up for a dual-boot computer. This
    example is for a computer that was originally set up to run Microsoft Windows.
    It was partitioned before the installation to make room for GNU/Linux, it has
    a 6.5-gigabyte hard drive, and 64 megabytes of RAM.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# LISTING 2.2 Creating Partitions on a Dual-Boot Computer


    | DEVICE | FILESYSTEM TYPE | SIZE | MOUNT POINT |

    |---|---|---|---|

    | hda1 | Win98 FAT32 | 3000MB |  |

    | hda2 | Linux native | 7MB | /boot |

    | hda3 | Linux native | 2865MB | / |

    | hda4 | Linux native | 500MB | /home |

    | hda5 | Linux swap | 128MB |  |


    After you have set up the different partitions for the filesystem, the partitions
    need to be formatted. If this is your first GNU/Linux installation, you will want
    to format all the filesystem space as Linux native and the swap space as Linux
    swap. You are also given the opportunity to check for bad blocks (or errors) on
    the hard drive before the drive is formatted. You should check for bad blocks
    as a precautionary measure.


    # Deciding Which Software to Install


    If you selected the custom installation class, you will be asked to select from
    a list of package groups. To install all the software, you will need at least
    1.3 gigabytes of hard drive space in the root partition. Listing 2.1 shows the
    root partition on the device named hda2 (which has 9996 megabytes of space). Listing
    2.2 shows the root partition on device hda3, which has 2865 megabytes of space.


    ![](img/782ecfdc0b083a767896cc983e10427f_53_0.png)


    > > If you purchased the boxed Linux-Mandrake distribution, you may have more
    than one CD-ROM. You will be asked if you have the second CD-ROM. You will also
    be prompted as to when to change CD-ROMs.


    If the root partition on your system does not contain enough space, you will need
    to deselect package groups from the list. If you aren''t sure which packages to
    deselect, just leave them all selected and the installation process will decide
    how much room is available and make its own decision about how much software to
    install. The installation program will install the most popular and commonly used
    applications first, and then will continue to add applications (using its own
    priority scheme) until most of the partition is filled.


    ![](img/782ecfdc0b083a767896cc983e10427f_53_1.png)


    > > As you progress through this book, you might find that you do not have an
    application on your system. You can easily install more software from the CD-ROM.
    Just turn to Hour 15, "Installing Software."'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'After you''ve selected packages, it''s time to take a break and let the computer
    do some work. Depending on the packages you selected and the speed of your computer,
    it might take anywhere from 15 to 45 minutes to install all the software. As the
    software is installed, you can watch the progress. As each package is installed,
    you''ll see the name of the package and a brief description.


    # Configuring the System


    Now is the time to tell the installation process how you want to use the computer.
    Some of these steps can be skipped if you don''t want to deal with them right
    now. You can always go back later to set up your Internet connection or attach
    a printer to the computer.


    You will be asked whether you want to configure networking. If the computer is
    attached to a local area network, you will need some information from the system
    administrator (such as a name for the computer and the IP address). If the computer
    will be used to connect to the Internet, you can create a dialup connection now,
    or you can wait until Hour 21, "Connecting to the Internet," to learn how to set
    up a modem and connect to your ISP.


    To set the clock correctly, the operating system needs to know the time zone in
    which you live. Scroll through the list and find the city closest to you.


    If a printer is attached to the computer, you can configure printing services
    at this time, or you can wait until Hour 11, "Printing Files," to set up the printer.


    You are next asked to assign a password to the root account. The root account,
    or superuser, is the system administrator for the operating system. This account
    has no restrictions; this enables the superuser to do anything she wants to the
    system. This account should be used only for system maintenance and should not
    be used for regular use (such as typing letters or drawing pictures) or for surfing
    on the Internet.


    So that you don''t have to start your first experience with GNU/Linux using the
    superuser account, some distributions ask you to set up an unprivileged user account.
    You will need to know the real name of the user, select a username, and then provide
    a password.


    Next, you will need to create a boot disk. You''ll need to get out a blank floppy
    disk for this step. Follow the instructions to create the boot disk and then label
    the disk something like "Linux-Mandrake 7.1 Boot Disk." It is very important that
    you create this disk. If the boot loader is not installed correctly, this disk
    will enable you to boot the operating system so that you can begin enjoying all
    that GNU/Linux has to offer.


    The last step in this part of the installation process asks where you want to
    install the Linux boot loader, LILO. Linux-Mandrake makes a suggestion as to the
    location where LILO will be installed.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '**New Term** A boot loader is a program that steps in just after the BIOS loads
    and offers you the opportunity to start one of a number of operating systems that
    might be installed on the computer. The boot loader that installs with Linux is
    LILO.


    # Working with the X Window System


    The end of the installation process is the most difficult, and the most important.
    It''s time to set up your video card and monitor so that you can use the X Window
    System. You''ll need it to use any of the graphical desktop environments, such
    as GNOME. If the video card and monitor are listed as compatible hardware for
    the GNU/Linux operating system, this process will be much easier.


    You''ll first be presented with a list of monitors. Search through the list to
    see whether your monitor is listed. If it isn''t, you''ll need to select one of
    the generic monitors. Pick the monitor that does what yours does. As in


    ```

    A monitor that can do 1024 X 1280 at 60hz

    ```


    Next, you''ll select a resolution and color depth for the display. It is very
    important that you do not exceed the capabilities for your monitor and video card.


    After you enter the correct information, the installation process will ask whether
    you want to test the X configuration. Answer yes. You should see a message that
    says, Can you see this? If you can, select Yes. Don''t worry: If you can''t see
    the message, a few seconds will pass and it will be assumed that the test failed
    and you''ll be sent back to the beginning to try again.


    The last step in the X configuration process is to tell the system whether you
    want the system to start the X Window System automatically when the system boots.
    Click the No button. Should you have a problem, you would rather be at the shell
    prompt when the system starts. From the shell prompt, you need only type `startx`
    to display the graphical user interface.


    Congratulations! You''ve made it to the end of the long installation process.
    Remove the floppy disk and the CD-ROM from the drives and let the system restart
    itself.


    # Logging In and Logging Out


    You can quit holding your breath. Take a look at your monitor; you should see
    a login prompt. What''s a login prompt? To put it simply, the login prompt is
    where you type in a unique name that identifies you as an authorized user on the
    system. Depending on the distribution you installed and how you set up the X Window
    System, the login prompt might take various shapes and forms. If you installed
    Linux-Mandrake and elected not to start the X Window System when the system boots,
    the login prompt and associated bits of information might look as shown in Listing
    2.3.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# LISTING 2.3 A Sample of the Linux-Mandrake Login Screen


    ```

    Linux Version 2.2.15-0.25mdk

    Compiled #1 Mon Apr 24 03:00:34 PDT 2000

    One 133MHz Intel Pentium Processor, 80M RAM

    264.60 Bogomips Total

    localhost.localdomain


    Linux Mandrake release 7.1b (hydrogen)

    Kernel 2.2.15-0.25mdk on an i586 / tty1

    localhost login:

    ```


    That''s a lot of information. And, yes folks, this is not the computer you saw
    in Listings 2.1 and 2.2. It is one of the other computers in our computer lab
    and the one you''ll see most often as you flip through these pages. Listing 2.3
    shows an old, beat-up computer with a 133MHz Pentium processor and 80MB of RAM.
    But, back to the important part. the login prompt, which is followed by the cursor.
    What does it mean to log in? Logging in involves supplying a username and a password,
    which Linux verifies to determine whether the user has the authority to access
    the computer system.


    # New Term


    When you installed and configured the Linux system, you set up at least one user
    account—the superuser account whose username is root. The superuser has unrestricted
    access to the entire operating system—every file and every command. Only the superuser
    can change the system setup and configuration. You might have also set up an unprivileged
    user account. This account is assigned to a regular user. Such a user can access
    files in his home directory and files used by general users (such as help files
    and program execution files).


    At this point, you need to give the system your username before you can do anything
    with the system. The username that you supply is up to you. Every distribution
    requires that an account be created for a user named root. This account is assigned
    to the superuser (or the person in charge of maintaining and updating the computer
    system), and should be used only when performing system administration tasks.


    # New Term


    The system administrator is responsible for the care, maintenance, upgrade, repair,
    configuration, and security of a computer, the computer operating system, attached
    peripherals, installed applications, and data files. The system administrator
    grants access to the computer, peripherals, and files to the various users on
    the system. The system administrator also makes sure that the users do not have
    problems operating the system and that the system is configured to efficiently
    help them perform their jobs.


    Your other option is to log in as an unprivileged user. You might or might not
    have been given the opportunity to set up this type of user account during the
    installation. If you did not set one up, turn to Hour 12, "Sharing Files with
    Other Users on the System," to'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'learn how to create an unprivileged user account. This is the account in which
    you will be working the most. The unprivileged user account is where you will
    perform your day-to-day work, such as composing correspondence, searching the
    Internet, creating graphics for your Web pages, and keeping your checkbook balanced.


    Listing 2.4 shows an example of a login session for a regular user account. It''s
    quite easy to get into the system. First, type the username assigned to you and
    then press Enter. You will be asked for a password. Notice that you do not see
    the password as you type. After you have typed the password, press Enter. If the
    login was successful (that is, the system found your username and password in
    the database), you''re ready to start exploring.


    # LISTING 2.4 The Login Session for a User Named rusty


    ```

    ```

    localhost login: rusty

    Password:

    [rusty@localhost rusty]$

    ```

    ```


    # Logging In as the Superuser


    There are two ways to work as the superuser. The first is to log in to the root
    account directly. This means that you type the username of root and then give
    the password for the root account.


    ![](img/782ecfdc0b083a767896cc983e10427f_57_0.png)


    > Because the superuser has access to every file, command, and program on the
    system, it is possible for the superuser to crash the system, delete files, or
    make other destructive changes. Be careful to give the superuser password to only
    those people with a need to know, and use the superuser account only for system
    administration. Use an unprivileged user account to perform other work.


    The other way to get to be the superuser is to temporarily switch to the superuser
    account while working in your user account. This involves executing the su command.


    # Switching Between Consoles


    You can run six different user sessions at one time. Use the function keys along
    the top of the keyboard. F1 through F6 are the available consoles. Press Alt plus
    the appropriate function key to move from console to console.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/782ecfdc0b083a767896cc983e10427f_58_0.png)


    > Be security conscious when working with multiple consoles. It is easy to forget
    that multiple consoles and user accounts are open. Before you leave the computer,
    check each console to make sure that no users are logged in. This helps to prevent
    unauthorized entry into the system.


    # Task: Exploring the Login Process


    Before you can drive your new operating system around the block, you''ll need
    to turn the key to start the engine. Your key is your username and password. Follow
    these steps to learn how to log in to the superuser account and your unprivileged
    user account:


    +   1. Access the superuser account. At the login prompt, type root and press
    Enter. The password prompt will appear.

    +   2. Type the root password and press Enter. The shell prompt for the root user
    account displays and might look something like the following:

    +      `[root@localhost /root]#`

    +   3. Change to a different console. Press Alt+F2.

    +   4. Access your user account. At the login prompt, type the username for the
    unprivileged user account that you set up during the installation and press Enter.
    You will be asked for the account''s password. Type the password and press Enter.

    +   5. Temporarily change to the superuser account from the unprivileged user
    account. Type su and press Enter. You''ll be asked for the password for the root
    user account. Type the password and press Enter. The shell prompt will look something
    like the following:

    +      `[root@localhost rusty]#`

    +   6. Exit the superuser account. Type exit and press Enter. You''ll be returned
    to your user account and once again the shell prompt might look like the following:

    +      `[rusty@localhost rusty]$`


    You''ll want to do your daily work from this user account. To get back to the
    console at which the root user is logged in, press Alt+F1.


    # Troubleshooting the Installation


    You might need some extra help during the installation. There are a number of
    places where you can find some good information. One good source is the Linux
    HOWTOs. You might find these in the filesystem, but if not there, they are on
    the Web at www.linuxdocs.org. Here''s a list of Linux HOWTOs that you might find
    useful:'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   - Installation HOWTO

    +   - Config HOWTO

    +   - Online Troubleshooting HOWTO

    +   - Tips HOWTO

    +   - Partition mini-HOWTO

    +   - Multi-Disk HOWTO

    +   - LILO mini-HOWTO

    +   - Multiboot with LILO mini-HOWTO

    +   - Bootdisk HOWTO

    +   - From Power Up to Bash Prompt HOWTO


    # Task: Shutting Down the System


    When it''s time to shut down the computer for the evening, the designated system
    administrator must be called in. Shutting down the system is a job for the system
    administrator because the shutdown command can be executed only by the superuser
    account. Here''s your first task as the system administrator of your system. Follow
    these steps to log in to the superuser account and turn off the computer:


    +   1. Log out of your user account. Type `logout` and press Enter.

    +   2. Return to the console where the root user is logged in. Press Alt+F1.

    +   3. Terminate the session. Type `shutdown -h now` and press Enter. The system
    will go through the shutdown process and will turn off services and unmount devices.
    You''ll see a long list of items scroll by on the screen. When the operating system
    has shut itself down, a message appears at the bottom of the screen telling you
    to power down.


    ![](img/782ecfdc0b083a767896cc983e10427f_59_0.png)


    > > If you just want to restart the computer, type `shutdown -r now` and press
    Enter.


    # Summary


    It''s been a long hour but, hopefully, you are up and running with your brand-new
    GNU/Linux operating system. During this hour, you installed the operating system,
    selected the types of applications with which you''d like to experiment, and configured
    the X Window System so that you could display cool graphics on your screen. After
    the'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'system was set up, you learned how to log in to the superuser and unprivileged
    user accounts and how to shut down the operating system and turn off the computer.
    Now you''re ready to start exploring a completely GNU world of free software.
    Have a good time!


    # Q&A


    Q I really do want to use the GNU/Linux operating system, but I don''t want to
    install it. Do I have any other options?


    A You could invite a GNU/Linux guru to dinner and then ask him to install the
    operating system and applications for you. You might need to bribe him with some
    homemade raisin oatmeal cookies for dessert. You could also check out a GNU/Linux
    user group near your home. Many GNU/Linux user groups hold installation meetings
    where you can take your computer and have someone help you with the installation.
    You''ll find a list of user groups at www.linux.org/users. You can also purchase
    a computer with Linux pre-installed. To find a list of vendors, cruise over to
    www.linux.org/hardware.


    Q Is there another program that I can use instead of LILO to boot between Microsoft
    Windows and GNU/Linux?


    A There are two commercial programs that we know of. If you want to boot between
    multiple operating system, try System Commander (www.systemcommander.com) or BootMagic.
    BootMagic is included with the PowerQuest PartitionMagic program (www.powerquest.com).
    Some distributions use grub to select which operating system to load when the
    system starts.


    Q When I set up the X Window System, I told the installation process that I wanted
    to start the X Window System automatically when the system boots. How can I get
    past the graphical login display and display the login prompt on a text-only display?


    A You will need to change to a different virtual terminal. Press Ctrl+Alt+F1 to
    see a text-only login prompt. If you want to get back to the graphical login,
    press Alt+F7.


    # Workshop


    Test your knowledge of the material covered in this hour by answering the following
    questions and working through the exercises.


    ![](img/782ecfdc0b083a767896cc983e10427f_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Quiz


    1. What programs can you use to create a separate partition in which to install
    GNU/Linux on the hard drive?


    The easiest way to partition a hard drive is with a commercial program such as
    PowerQuest''s PartitionMagic. PartitionMagic leaves a Windows system intact while
    it creates another partition on the drive in which you can install GNU/Linux.
    Another reliable method is to use fips. The fips utility also enables you to create
    a second partition without destroying your Microsoft Windows installation. There
    is also the DOS fdisk program. This program erases all the data on the disk. Remember
    to use Windows ScanDisk and Disk Defragmenter, and to back up the system before
    you use fdisk. You will need to reinstall Microsoft Windows after the partition
    is created and then you can install GNU/Linux.


    2. What are the basic steps involved in installing the GNU/Linux operating system?


    Step one is to create a separate partition for GNU/Linux if you plan to run GNU/Linux
    along with another operating system on the same hard drive. Step two is to start
    the installation process by placing the installation boot floppy and the distribution
    CD-ROM in the appropriate drives. You will then need to supply information about
    the language, keyboard, and installation class that you plan to use. Step three
    is to set up the filesystem. In this step, you create partitions for the swap
    space, system files, and user home directories. Some of step four is optional.
    You are given the opportunity to attach the computer to a network or to the Internet,
    set the time, configure a printer, and create user accounts. The last step is
    to configure the X Window System so that you don''t have to work at a boring text-only
    screen.


    3. Do you need to install all the packages found on the distribution CD-ROM?


    Nope. If you want, you can start with a minimal setup and then add programs as
    you go along. As long as you have the distribution CD-ROM close by, you can quickly
    install another application. Also, if you did install everything and later you
    are running short on hard drive space, you can just as easily remove those applications
    that you don''t use.


    4. What is the difference between the superuser account and an unprivileged user
    account?


    The superuser account (which uses the username of root) has unrestricted access
    to the operating system. This means every file, every command, and every application.
    The superuser is responsible for system administration duties such as changing
    the system setup and altering configurations. An unprivileged user account is
    for all other users. These users can access files in their home directory and
    common files used by all users (such as help files and program execution files).
    The superuser should also set up an unprivileged user account in which to work.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Exercises


    +   1. Experiment with different ways to access the superuser account. You''ll
    want to find ways to use this account only when necessary and to make it quick
    and easy to log in and log out. Learn how to use separate consoles to perform
    administrative and configuration tasks. If you are working in a desktop environment,
    learn how to use a terminal emulator and switch to superuser from your user account.
    You''ll also want to decide which members of your family or company need superuser
    access to the system. Train these people so that they understand how and when
    to work in the superuser account.

    +   2. If your GNU/Linux installation was successful, celebrate. Go out to dinner,
    go to the beach, wear sandals! If your GNU/Linux installation wasn''t successful,
    try a few of the troubleshooting ideas. And, if that doesn''t work, you might
    need to start the installation all over again. But, you can still celebrate because
    of all the hard work you''ve done over the past hour.'
  merge: -1
  img_proc: true
