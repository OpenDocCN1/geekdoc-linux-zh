    So what do edge-colorings have to do with 1-factorizations? A reflection shows
    that a graph G has a 1-factorization if and only if G is k-regular and has a proper
    k-edge-coloring. In each graph of Example 10.3.10, the edges i form a 1-factor
    Fi, and [F1, F2, F3] is a 1-factorization. We will also use a famous result of
    Vizing [32].


    Theorem 10.3.11 (Vizing) A simple graph G with k being the maximum degree among
    all vertices in G, has a proper (k+1)-edge-coloring.'
