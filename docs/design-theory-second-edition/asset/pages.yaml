    # 1.4 $v = 5$ (mod 6): The $6n + 5$ Construction


    We have managed to construct Steiner triple systems of all orders $\equiv 1$ or
    $3$ (mod 6). No however STS($6n+5$) exists. But we can get very close!


    At this point it becomes necessary to generalize Steiner triple systems. A pairwise
    balanced design (or simply, PBD) $(S, B)$, where $S$ is a finite set of symbols,
    and $B$ is a collection of subsets of $S$ called blocks, such that each pair of
    distinct elements of $S$ occurs together in exactly one block of $B$. With triple
    systems $|S|$ is called the order of the PBD. So an STS is a pairwise balanced
    design in which each block has size 3.


    Our immediate (to be used in Section 1.5) is to produce a PBD $(S, B)$ with exactly
    one block of size 5 and the rest having size 3, for all $v \equiv 5$ (mod 6).
    So the only one block of size 5 stops this PBD from being an STS!


