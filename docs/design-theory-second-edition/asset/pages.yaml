    # 1.5 Quasigroups with holes and Steiner triple systems


    # 1.5.1 Constructing quasigroups with holes


    Let $Q = [1, 2, \dots, 2n]$ and let $H = \{[1, 2], [3, 4], \dots, [2n-1, 2n]\}$.
    In what follows, the two element subsets $[2i-1, 2i] \in H$ are called *holes*.
    A quasigroup with holes $H$ is a quasigroup $(Q, \circ)$ of order $2n$ in which
    each $h \in H$, $(h, \circ)$ is a subquasigroup of $(Q, \circ)$. The following
    example makes this clear.'
