    Figure 2.2: The $3n$ Construction of 2-fold triple systems.


    **The $3n + 1$ Construction** Let $(Q, \circ)$ be an idempotent (not necessarily
    commutative) quasigroup of order $n$ and set $S = \{\infty\} \cup (Q \times \{1,
    2, 3\})$. Define a collection of triples $T$ as follows:


    +   * Type 1: The four triples $\{\infty, (x, 1), (x, 2)\}$, $\{\infty, (x, 2),
    (x, 3)\}$, $\{(x, x)\}$, $\{\infty, (x, 3)\}$, $\{(x, 1), (x, 2), (x, 3)\}$ belong
    to $T$ for every $x \in Q$ (note: these 4 triples form a 2-fold triple system
    of order 4);

    * Type 2: if $x \neq y$, the six triples $\{(x, 1), (y, 1), (x \circ y), \{(y,
    1), (x, 1), (y \circ x)\}, \{(x, 2), (y, 2), (x \circ y)\}, \{(y, 2), (x, 2),
    (y \circ x)\}, \{(x, 3), (y, 3), (x \circ y)\}, \{(y, 3), (x, 3), (y \circ x)\}\}$
    belong to $T$.


    $(S, T)$ is a 2-fold triple system of order $3n + 1$.

    Figure 2.3 represents this construction graphically.


    We now present an example of both the $3n$ Construction of 2-fold triple systems
    and the $3n + 1$ Construction of 2-fold triple systems. The same quasigroup is
    used in both cases so that the similarity in the constructions can be observed.'
