  md: '# Preface


    The aim of this book is to teach students some of the most important techniques
    used for constructing combinatorial designs. To achieve this goal, we focus on
    several of the most basic designs: Steiner triple systems, latin squares, and
    finite projective and affine planes. In this setting, we produce these designs
    of all known sizes, and then start to add additional interesting properties that
    may be required, such as resolvability, embeddings and orthogonality. More complicated
    structures, as Steiner quadruple systems, are also constructed.


    However, we stress that it is the construction techniques that are our main focus.
    The results are carefully ordered so that the constructions are simple at first,
    but increase in complexity. Chapter 5 is a good example of this approach: several
    designs are produced which together eventually produce Kirkman triple systems.
    More importantly, not only is the result obtained, but also each design introduced
    has a construction that contains new ideas or reinforces similar designs earlier
    in a simpler setting. These ideas are then stretched even when constructing pairs
    of orthogonal latin squares in Chapter 6. We recommend that every course using
    this text thoroughly Chapters 1, 5, and 6 (including all the designs in Section
    5.2).


    In this second edition, extensive new material has been included that introduces
    embeddings (Section 1.8 and Chapter 9), directed designs (Section 2.4), universal
    algebraic representations of designs (Chapter 3), and intersection properties
    of designs (Chapter 8).


    It is not the intention of this book to give a categorical survey of important
    results in combinatorial design theory. There are several good books listed in
    the Bibliography available for this purpose. On completing a course based on this
    text, students will have seen some fundamental results in the area. Even better,
    along with this knowledge, they will have at their fingertips a mixture of construction
    techniques, both classic and hot-off-the-press, and it is this knowledge that
    will enable them to produce other types of designs not mentioned here.


    Finally, the best feature of this book is its pictures. A precise mathematical
    description of a construction is not only dry for the students, but is largely
    incomprehensible! The figures describing the constructions in this text go a long
    way to helping students understand and enjoy this branch of mathematics, and should
    be used at ALL opportunities.'
