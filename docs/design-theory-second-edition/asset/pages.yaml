  md: '# 10. Introduction


    Example **10.1.3** We can find the Boolean Steiner quadruple system $(V, B)$ of
    order 8 as follows. Since $8=2^3$, $V$ consists of all binary words of length
    3; so


    $V = [000, 010, 011, 100, 101, 110, 111]$


    We find $|B| = 8 \cdot 7 / 24 = 14$ quadruples by making sure that if $a, b, c$
    and $d$ are all different, and if $a+b+c+d=0$, then $[a, b, c, d]$ is a block.
    For example, if $a=100, b=101, c=110$ and $d=111$, then they are all different,
    and $a+b+c+d=100+111=0$; so $\{100, 101, 110, 111\} \in B$. Thus we obtain the
    following blocks:


    ```

    {000, 010, 011} {100, 101, 110, 111}

    {000, 101, 101} {010, 011, 110, 111}

    {001, 100, 111} {010, 011, 100, 101}

    {000, 010, 110} {001, 011, 101, 111}

    {000, 101, 111} {001, 010, 101, 110}

    {001, 110, 111} {001, 011, 010, 100}

    {001, 111, 110} {001, 010, 101, 111}

    ```


