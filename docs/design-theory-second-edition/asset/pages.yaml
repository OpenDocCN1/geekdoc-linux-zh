    The 2v Construction (to produce an SQS(2v) from an SQS(v)) Let (V, B) be an SQS(v).
    Let $\{F_1, \dots, F_{v-1}\}$ be a 1-factorization of $K_v$ defined on the vertex
    set $V$. Define an SQS(2v) ($V \times \{1, 2\}, B''$) as follows:


    Type 1: for each $b \in B$ and each $i \in \{1, 2\}$, let $b \times \{i\}$ be
    in $B''$, and


    Type 2: for $1 \leq j \leq v-1$, for each edge $\{a, b\} \in F_j$ and for each
    edge $\{c, d\} \in F_j$ (including $\{a, b\} = \{c, d\}$), let $\{(a, 1), (b,
    1), (c, 2), (d, 2)\}$ be in $B''$.


    For a pictorial representation of this construction, see Figure 10.2.


    **Theorem 10.2.1** *The 2v Construction produces an SQS(2v). Moreover, if $v \geq
    4$ then $\{F_1, \dots, F_{v-1}\}$ can be chosen so that the SQS(2v) contains an
    SQS(8).*


    *Proof.* To see that $(V \times \{1, 2\}, B'')$ as defined in the 2v Construction
    defines a 3-design, and show that each 3-element subset of $V \times \{1, 2\}$
    is in at least one quadruple in $B''$, and then show that $B''$ contains $2(2v-1)(2v-2)/24$
    quadruples (see Exercise 10.9).


    Suppose all three of the symbols in the 3-element subset have the same coordinate;
    the symbols are $\{x, i\}, \{y, i\}$ and $\{z, i\}$. Then since $(V, B)$ is an
    SQS, $\{x, y, z\}$ is in a quadruple $\{w, x, y, z\} \in B$, so from this we have
    $\{(w, i), (x, i), (y, i), (z, i)\} \in B''$.


    Otherwise, two of second coordinates of the 3 symbols must be the same, so we
    may assume that the 3-element subset under consideration is $\{(x, 1), (y, 1),
    (z, 2)\}$ or $\{(x, 2), (y, 2), (z, 1)\}$. The edge $\{x, y\}$ occurs in exactly
    one 1-factor, say $F_j$ in the 1-factorization of $K_v$. Since $F_j$ is a 1-factor,
    it also contains one edge with vertex $z$, say $\{w, z\}$. Then from this $\{(x,
    1), (y, 1), (z, 2), (w, 2)\} \in B''$ and $\{(x, 2), (y, 2), (z, 1), (w, 1)\}
    \in B''$.


    Therefore each 3-element subset of $V \times \{1, 2\}$ occurs in at least one
    quadruple in $B''$. By Exercise 10.3, $B''$ contains $2(2v-1)(2v-2)/24$ quadruples.
    By Exercise 10.9, $(V \times \{1, 2\}, B'')$ is an SQS(2v).


    We can rename the symbols in $V$ so that $V = \{1, 2, \dots, v\}$ and so that
    $\{1, 2, 3, 4\} \subseteq B$. If we construct $\{F_1, \dots, F_{v-1}\}$ using
    Lemma 10.1.6 then since $\{\{1, 2\}, \{3, 4\}\} \subseteq F_1 \{1, 3\}, \{2, 4\}\}
    \subseteq F_2$ and $\{\{1, 4\}, \{2, 3\}\} \subseteq F_3$, and since $\{1, 2,
    3, 4\} \subseteq B$, it is clear that the 2v Construction contains an SQS(8) on
    the symbols $\{1, 2, 3, 4\}$ $\\square$'
