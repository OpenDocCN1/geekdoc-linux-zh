  md: '# 10.1. Introduction


    Let $x$ and $y$ be two symbols in $V\{p\}$. Since $(V, B)$ is an SQS, $\{p, x,
    y\}$ occurs in exactly one block $b'' \in B$, and so $\{x, y\}$ occurs in exactly
    one of $B(p)$. Therefore $(V\{p\}, B(p))$ is an STS$(v-1)$, which exists only
    if $v-1 \equiv 1$ or $3 \pmod 6$ (see Theorem 1.1.3). Therefore $v \equiv 2$ or
    $4 \pmod 6$.


    > Remark The Steiner triple system used in the proof of Lemma 10.1.14 is called
    a derived STS of the SQS. A unsolved conjecture is to show that every Steiner
    triple system is derived$(v)$ of some SQS$(v+1)$. This has been shown to be true
    whenever $v \le 15$ [7].


    The first proof for all $v \equiv 2$ or $4 \pmod 6$ exists an SQS$(v)$ was given
    by Hanani [1960]. The proof we use has some of his constructions, but it is the
    proof of Lenz [18]. A bit of graph theory is used in these constructions we introduce
    it when necessary. We end this section with some graph theory.


    A 1-factor of a graph $G$ is a set of edges $F$ in $G$ with the property that
    every vertex is incident with exactly one edge $F$. A 1-factorization of a graph
    $G$ is a partition of the edge set of $G$ into 1-factors.


    # Lemma 10.1.15 $K_{2x}$ has a 1-factorization.


    Proof. $K_{2x}$ is defined on the vertex set $\{\infty\} \cup \{1, 2, 3, \dots,
    2x-1\}$. For $1 \le i \le 2x-1$ we define


    ```

    $F_i = \{\infty\}, \{-1+i, i+1\}, \{-2+i, 2+i\}, \dots, \{-(x-1)+i, (x-1)+i\}$

    ```


    reducing modulo $2x-1$. Then $\{F_1, F_2, \dots, F_{2x-1}\}$ is a 1-factorization
    of $K_{2x}$.


    For later, a different 1-factorization will be useful. The following 1-factorization
    can be constructed using Steiner triple systems.


    # Lemma 10.1.16 For all $v \equiv 2$ or $4 \pmod 6$ with $v \ge 4$, there exists
    a 1-factorization $\{F_2, \dots, F_v\}$ of $K_v$ in $\{\{1, 4\}, \{3, 4\} \subseteq
    F_2$, $\{\{1, 3\}, \{2, 4\} \subseteq F_3$ and $\{\{1, 4\}, \{2, 3\} \subseteq
    F_4$, where $K_v$ is defined on the vertex set $\{\{1, 2, \dots, v\}$.


    > Remark 1-factorizations of $K_v$ exist for all $v \ge 8$, but this result will
    suffice for our purposes.


    Proof. Let $\{\{2, 3, \dots, v\}$, $T$ be an STS$(v-1)$. By renaming the symbols
    if necessary, we can assume that $\{\{2, 3, 4\} \in T$. For $2j \le v$ we define


    ```

    $F_j = \{\{1, j\} \cup \{\{a, b\} | \{j, a\} \in T\}$.

    ```


    Then obviously the edge $\{\{1, j\}$ occurs in $F_j$. Each pair $\{\{a, b\} \subseteq
    \{2, 3, \dots, v\}$ occurs in a triple, $\{\{a, b, j\}$ in the STS$(v-1)$, so
    the edge $\{\{a, b\}$ occurs in $F_j$. Each edge of $K_v$ occurs in exactly one
    of $F_2, F_3, \dots, F_v$, so these sets partition the edges of $K_v$.


    It remains to see that $F_j$ is a 1-factor of $K_v$ for $2 \le j \le v$, so let
    $a$ be any vertex of $K_v$. If $a = 1$ or $j$ then $F_j$ contains the edge $\{\{1,
    j\}$. Otherwise $a \in \{2, 3, \dots, v\}$.'
