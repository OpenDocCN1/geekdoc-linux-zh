    latin square of order $t$, what does the Ryser Condition say about the size of
    $t$?


    # 9.2 Edge-coloring bipartite graphs


    Ryser went to show that these conditions in Lemma 9.1.7 are also sufficient! Once
    you check that each symbol occurs at least $r+s-t$ times in $R$, you are assured
    that $R$ can be embedded in a latin square of order $t$. To do this, we use powerful
    theorems on Systems of Distinct Representatives. We will use a graph theoretic
    approach, so we need one result on edge-colorings of graphs before this method
    can be described.


    A graph is bipartite if its vertices can be partitioned into two sets $L$ and
    $R$ (Left and Right!) that each edge joins a vertex in $L$ to a vertex in $R$.
    The number of edges incident with a vertex $i$ in $B$ is called the degree of
    $i$, and it is denoted by $d_B(i)$. $\Delta(B)$ denote the biggest degree among
    the vertices in $B$.


    **Example 9.2.1** The graph $B_1$ in Figure 9.2 is bipartite because every edge
    joins a vertex in $L = \{1, 2, 3, 4, 5\}$ to a vertex in $R = \{6, 7, 8\}$. Each
    of the vertices in $L$ has degree 2 except for the vertex 5 which has degree 1,
    and each vertex in $R$ has degree 3; so $\Delta(B_1) = 3$, the biggest degree.'
