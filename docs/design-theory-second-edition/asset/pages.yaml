  md: '# 6. Mutually Orthogonal Latin Squares


    The first inkling of the Euler Conjecture might not be true in 1957 when E. T.
    Parker constructed 3 MOLS(21), killing the MacNeish Conjecture. Since the Euler
    Conjecture is a special case of the MacNeish Conjecture it was not particularly
    surprising, in 1958, R. C. Bose and S. S. Shrikhand [2] constructed a pair of
    orthogonal latin squares of order 22, and in so doing the long standing Euler
    Conjecture. Shortly after this "event," E. T. Parker [22] constructed a pair of
    orthogonal latin squares of order 10. Finally, in 1960 R. C. Bose, S. S. Shrikhand,
    and E. T. Parker [3] proved that a pair of orthogonal latin squares of order n
    exists for all n other than 2 or 6 (for no such pair exists).


    In follows, we will give a systematic verification of all the above existence
    results. It will be convenient to use quasigroup notation to define orthogonal
    latin squares in what follows.


    Everything that follows is predicated on a reasonable knowledge of finite fields.
    Among other things, how to construct them, as well as the fact that the spectrum
    (= the set of all orders for which a finite field exists) is precisely the set
    of all pr where p is a prime and r is a positive integer.


    The Finite Field Construction Let (F, +,) be a finite field of order n. Since
    there is nothing sacred about the symbols representing the elements in F, it is
    convenient to assume that F = {1, 2, 3, ...,n} with the proviso that n represents
    the zero element field. For each n ≠ in F, define a binary operation o(k) on F
    by x o(k) = x · k + y (arithmetic computed in the finite field (F, +, .)). Then
    (F, o(k)) is a quasigroup (latin square).


    It is easy to see that (F, o(k)) is in fact a quasigroup. Suppose o(k)x = x o(k).
    Then x · k + y = x · k + z and so y = z. On the other hand if o(k)x = z o(k)x,
    then y · k + x = z · k + x, so y · k = z, and since k ≠ zero we get y = z.


    **Example 6.2.1** A quasigroup of order 4 constructed using the Finite Field Construction.
    We first construct the field of order 4 using the irreducible polynomial 1 + x².


    | + | 0 | 1 | x | 1+x | | 0 | 1 | x | 1+x |

    |---|---|---|---|---|---|---|---|---||

    | 0 | 0 | 1 | x | 1+x | | 0 | 0 | 0 | 0 |

    | 1 | 1 | 0 | 1+x | x | | 1 | 0 | x | 1+x |

    | x | x | 1+x | 0 | 1 | | x | 0 | 1+x | 1 |

    | 1+x | 1+x | x | 1 | 0 | | 1+x | 0 | 1+x | x |


    Renaming the field elements 0, 1, x, and 1 + x with 4, 1, 2, and respectively
    gives the tables'
