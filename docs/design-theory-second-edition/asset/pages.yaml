    # 7.5 Coordinatizing the affine plane


    Let $(P, B)$ be an affine plane of order $n$. Then, of course, $|P| = n^2, |B|
    = n$, and $|B| = n^2 + n$. Label the parallel classes $V, H, \pi_1, \pi_2, \dots,
    \pi_{n-1}$ and label the lines in $V$ and $H$:


    ```

    $V : x = 0, x = 1, x = 2, \dots, x = n - 1$

    $H : y = 0, y = 1, y = 2, \dots, y = n - 1$.

    ```


    We say the point $p \in P$ has coordinates $(i, j)$ if and only if $p$ belongs
    to the line $x = i$ and the line $y = j$.'
