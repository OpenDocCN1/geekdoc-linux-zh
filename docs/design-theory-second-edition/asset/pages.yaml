    (2) Use Cruse''s Theorem 9.4.7 to embed (X, o) in an idempotent commutative quasigroup
    (Q, o) of order $2n+1$.


    (3) Let $S = Q \times \{1, 2, 3\}$ and let $(S, T)$ be the Steiner triple system
    of order $6n+3$ constructed from $(Q, o)$ using the Bose Construction (Section
    1.2).


    (4) For each $\{x, y, z\} \in P$, $T$ contains the 9 triples


