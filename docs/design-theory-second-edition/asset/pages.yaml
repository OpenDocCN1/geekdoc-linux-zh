    We now begin with some necessary conditions for the existence of an SQS(v), and
    then proceed to show that these conditions are sufficient by producing recursive
    constructions.


    > **Lemma 10.1.4** *If there exists an SQS(v), then either v=1 or v \equiv$ 4
    \pmod 6$.*


    **Remark** What we prove here actually that if $(V, B)$ is an SQS(n) with $n >
    1$ for any $v \in V$, the blocks in $B$ contain form an STS$(n-1)$ when $v$ is
    deleted from them.


    *Proof.* Let $(V, B)$ be an SQS(v). If $B = \emptyset$ then $v \le 2$. So we can
