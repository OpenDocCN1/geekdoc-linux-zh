    # 1.8 The $2n + 1$ and $2n + 7$ Constructions


    The two constructions we give in this section are quite useful for at least two
    reasons: first they give a recursive construction for Steiner triple systems (see
    Exercises 1.8.15 and 1.8.16), and secondly they can be used to give a solution
    for the intersection problem for Steiner triple systems. (This problem will be
    explained in Chapter 8.) The $2n+1$ Construction is quite easy compared to the
    $2n+7$ Construction. So we will begin with the $2n+1$ Construction.


    Let $n$ be **odd**. A 1-factorization of $K_{n+1}$ (the complete undirected graph
    on $n+1$ vertices) is a pair $(X, F)$ where $F$ is partition of $K_{n+1}$ into
    1-factors with vertex $X$. An easy way to find a 1-factorization is by using idempotent
    commutative quasigroup of order $n$. (See Section 1.2.) To this let $(Q, \circ)$
    be an idempotent commutative quasigroup of order $n$ where $Q = \{1, 2, 3, \dots,
    n\}$ ($n$ is necessarily odd). For each $i \in Q$ let $F_i = \{i, n+1\} \cup \{\{a,
    b\} \mid a \circ b = b \circ a = i\}$. Then $F = \{F_1, F_2, \dots, F_n\}$ is
    a 1-factorization of $K_{n+1}$ with vertex $X = \{1, 2, \dots, n+1\}$.'
