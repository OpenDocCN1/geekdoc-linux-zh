    Assuming that half-idempotent commutative quasigroups of order 2n exist for all
    n ≥ 1 (see Exercise 1.3.2), we are now ready to present the Skolem Construction
    [26].


    The Skolem Construction (Steiner triple systems of order v ≡ 1 (mod 6)) Let v
    = 6n + 1 and let (Q, ○) be a half-idempotent commutative quasigroup of order 2n,
    where Q = {1, 2, 3, ..., 2n}. Let S = {∞} ∪ (Q × {1, 2, 3}) and define T as follows:


    +   Type 1: for 1 ≤ i ≤ n, {(i, i), (i, 2), (i, 3)} ∈ T,

    Type 2: for 1 ≤ i ≤ n, (∞, (n + i, 1), (i, 2)),

    {∞, (n + i, 2), (n + i, 3), (i, 1)} ∈ T and

    Type 3: for 1 ≤ i ≤ j ≤ 2n, {(i, j), (i o j, 2)},

    {(i, j), (j, i o j)}, {(i, 3), (j, 3), (i o j, 1)} ∈ T.


    Then (S, T) is a Steiner triple system of order 6n + 1.'
