    \ is to have a $k$-edge-coloring then all $\\Delta(G)$ edges incident a vertex\
    \ of large degree receive different colors, so it must be the case that $k \\\
    geq \\Delta(G)$ more colors are needed, but not $G$ is bipartite! Every bipartite\
    \ graph $B$ has a $\\Delta(B)$-edge-coloring.\n\n![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_207_0.png)\n\
