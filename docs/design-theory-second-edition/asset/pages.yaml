  md: '# $\lambda$-Fold Triple Systems


    # 2.1 Triple systems of index $\lambda > 1$


    A $\lambda$-fold triple system (or a triple system of index $\lambda$) is a pair
    $(S, T)$, where $S$ is a finite set and $T$ is a collection of 3-element subsets
    of $S$ called *triples* such that each pair of distinct elements of $S$ belongs
    to exactly $\lambda$ triples of $T$. So, a Steiner system is a 1-fold triple system
    (or a triple system of index $\lambda = 1$). As with Steiner triple systems, the
    *order* of a $\lambda$-fold triple system $(S, T)$ is the number $|S|$. Just as
    with Steiner triple systems we can think of a $\lambda$-fold triple system as
    a decomposition of $\lambda K_v$, the graph with $v$ vertices in which each vertex
    is joined by $\lambda$ edges, into disjoint triangles.


    It is important to note that nothing in the definition of a $\lambda$-fold triple
    system requires that the triples be *distinct*. That is, in a given example, a
    triple may be repeated as many as $\lambda$ times.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_63_0.png)


    Figure 2.1: 2-fold triple system.


    **Example 2.1.1** The following is an example of a 3-fold triple system of order
    5.'
