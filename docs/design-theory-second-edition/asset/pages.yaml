    # Exercises


    **1.80** Use the Even-Odd Algorithm to find a 1-factorization of the edges of
    $K_{20}$ with lengths (i) 2 and 3 and (ii) 4 and 5.


    **The $K_{n+7}$ Factorization, $n$ odd** The edges of $K_{n+7}$ can be partitioned
    into $n+7$ triples and 1-factors.

    $K_{n+7}$ have vertex $Z_{n+7}$ and let $T = \{i, i+1, i+3 \ \mid i \in Z_{n+7}\}$.
    Then the triples belonging to $T$ cover all edges of $K_{n+7}$ of lengths 1, 2,
    and 3. Will now favor the remaining edges into $n+1$ factors. There are two cases
    to consider: (1) $(n+7)/2$ is even and (2) $(n+7)/2$ is odd.


    +   (1) If $(n+7)/2$ is even we can partition $[4, 5, \dots, (n+7)/2]$ into the
    subsets $[4, 5], [6, 7], [8, 9], \dots, [x-2, x-1],$ where $x = (n+7)/2$. The
    Even-Odd Algorithm produces 1-factors of $K_{n+7}$ for each 2-element subset and,
    of course, the edges of length $(n+7)/2$ are a 1-factor of $K_{n+7}$. Since there
    are $(n-1)/4$ 2-element subsets we have a total of $(n-1)/4 + 1$ $n$-factors of
    $K_{n+7}$.

    (2) If $(n+7)/2$ is odd we can partition $[4, 5, \dots, (n+7)/2]$ into the subsets
    $[4, 5], [6, 7], [8, 9], \dots, [x-1, x]$ where $x = (n+7)/2$. The Even-Odd Algorithm
    produces 1-factors of $K_{n+7}$ for each 2-element subset except $\{x, 1\}$. In
    this case the Even-Odd Corollar produces three 1-factors of $K_{n+7}$. This gives
    a total of $(n-1)/4 + 3 = n$ 1-factors of $K_{n+7}$.


    # **The $2n+7$ Construction** Let $(S, T)$ be a Steiner triple system of order
    $n$ and $(X, F)$ be a factorization of $K_{n+7}$ into a set $K$ of $n+7$ triples
    and a set $F = \{F_1, F_2, \dots, F_n\}$ of $n$-factors with vertex set $X$, where
    $X \cap S = \varnothing$. $S^* = S \cup X$ and define a collection of triples
    $T^*$ as follows:


    +   (1) $T \subseteq T^*$,


    +   (2) $K \subseteq T^*$.


    +   (3) Let $\alpha$ be any $1-1$ mapping from $S$ onto $\{1, 2, 3, \dots, n\}$.
    For each $x \in S$ and each $[a, b] \in F_{xa}$, place the triple $\{x, a, b\}$
    in $T^*$.


    Then $(S^*, T^*)$ is a Steiner triple system of order $2n+7$.'
