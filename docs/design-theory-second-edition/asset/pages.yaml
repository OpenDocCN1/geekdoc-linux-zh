    2\}, \{1, 3\}, \{1, 4\}, \{5, 6\}, \{7, 8\}\}$


    Just as the case for maximum packings, the padding of a minimum covering is determined
    by its order. In particular, if $(S, T, P)$ is a MCT of order $v$, then the padding
    is


    +   (i) a 1-factor if $v \equiv 0 \pmod 6$


    +   (ii) a triple if $v \equiv 2 \pmod 6$


    +   (iii) a double edge, $edge = \{a, b\}, \{a, b\}$ if $v \equiv 5 \pmod 6$,
    and of course,


    +   (iv) the empty set if $v \equiv 1$ or $3 \pmod 6$


    As with maximum packings we will prove (i), (ii), (iii), and (iv) in Section 3.3.
    The examples in Example 4.1.2 illustrate the three possibilities for $v \equiv
    0, 2, 4$, or $5 \pmod 6$: the padding in (a) is a double edge, in (b) is a 1-factor,
    and in (c) is a triple.


    # Exercises


    **4.1.3** Verify that the leaf of a packing of order $v \equiv 0$ or $2 \pmod
    6$ is a 1-factor, then the packing is a MPT. (Hint: Each vertex belongs to an
    *odd number* ($= v - 1$) of edges, and the edges are used 2 at a time at each
    vertex $w$ by the triangles in $T$ containing $w$.)


    **4.1.4** Verify that the leaf of a packing of order $v \equiv 4 \pmod 6$ is a
    triple, then the packing is a MPT.


    **4.1.5** Verify that the leaf of a packing of order $v \equiv 5 \pmod 6$ is a
    4-cycle, then the packing is a MPT. (Hint: Each vertex belongs to an *even number*
    of edges, and the edges are used 2 at a time at each vertex $w$ by the triangles
    in $T$ containing $w$.)


    **4.1.6** Verify that the padding of a covering of order $v \equiv 0 \pmod 6$
    is a 1-factor, then the covering is a MCT.'
