    # 10.4 The $(3v - 2u)$-Construction


    In this section we present a recursive construction that starts with an SQS$(v)$
    $(V = [1, 2, \dots, v], B)$ that contains an SQS$(u)$ $(V'' = \{v-u+1, \dots,
    v\}, B'')$ and produces an SQS$(3v - 2u)$ $(V'''', B'''')$, where $V'''' = \{\infty,
    \dots, \infty\} \cup \{1, 2, \dots, v-u\ \cup \{1, 2, 3\}$. This result was originally
    obtained by Hartman, but here we present a simplified proof by Lenz, who also
    used the Stern-Lenz Lemma.


    It will simplify notation to define $g = v-u$ for the rest of this chapter. Notice
    that if $1 \leq a \leq g$ then $a$ connects to 3 symbols in $V''''$, namely $(a,
    1), (a, 2)$ and $(a, 3)$; and if $g+1 \leq a \leq v$ then $v$ symbol in the SQS$(v)$
    naturally connects to one symbol in $V''$, namely $\infty_{a-g}$. This correspondence
    is formalized by defining


    ```

    \phi_i(a) = \begin{cases} (a, i) & 1 \leq a \leq g \ \infty_{a-g} & g+1 \leq a
    \leq v, \end{cases}$

    ```


    for $1 \leq i \leq 3$, and is depicted in Figure 10.5. For example, $\phi_2(1)
    = (1, 2)$, and $\phi_2(v-1) = \infty_{u-1}$. Notice that if $a > g$ then $\phi_1(a)
    = \phi_2(a) = \phi_3(a) = \infty_{a-g}$, reflecting the fact that in this case
    $a \in V$ corresponds to just one symbol $\infty_{a-g} \in V''''$.


    In the following discussion, as usual we refer to $(a, i)$ as occurring on level
    $i$. Also, if we say a symbol occurs on level $i$ then clearly we mean that the
    symbol is of the form $(a, i)$ and is not one of $\infty_1, \dots, \infty_u$.
    Symbols $\infty_1, \dots, \infty_u$ are referred to as infinite vertices.'
