    **Theorem 1.5.5** *For all $n \geq 3$ there exists a commutative quasigroup of
    order $2n$ with holes $H=\{\{1, 2\}, \{3, 4\}, \dots, \{2n-1, 2n\}$.*


    Proof. Let $S=\{1, 2, \dots, 2n+1\}$. If $2n+1 \equiv 1$ or $3 \pmod 6$ let $(S,
    B)$ be a Steiner triple system of order $2n+1$ (see Sections 1.2 and 1.3), and
    if $2n+1 \equiv 5 \pmod 6$ let $(S, B)$ be a PBD of order $2n+1$ with exactly
    one block $b$ of size 5, and the rest of size 3 (see Section 1.4). By renaming
    the symbols in the triples (blocks) if necessary, we can ensure that the only
    triples contain symbol $2n+1$ are:


    $\{1, 2, 2n+1\}, \{3, 4, 2n+1\}, \dots, \{2n-1, 2n, 2n+1\}$


    (In forming the quasigroup, these triples are ignored).

    Define a quasigroup $(Q, o) = (\{1, 2, \dots, 2n\}, o)$ as follows:


    +   (a) for each $h \in H=\{\{1, 2\}, \{3, 4\}, \dots, \{2n-1, 2n\}$ let $(h,
    o)$ be a subquigroup of $(Q, o)$;

    (b) for $1 \leq i \neq j \leq 2n$, $\{i, j\} \notin H$ and $i$, let $\{i, j, k\}$
    be the triple in $B$ containing symbols $i$ and $j$ and define $i \circ j = k;
    j \circ i = j$;'
