    in $H[B]$.


    By Vizing''s Theorem, since $H$ is $2k$, the edges in $H[A]$ can be edge-colored
    using $2k+1$ colors, $1, 2, \dots, 2k+1$. We can use this edge-coloring of $H[A]$
    to obtain a proper $(2k+1)$-edge-coloring of $H[B]$; if $\{u, v\}$ is an edge
    in $H[A]$ colored $c$, then color the edge $\{u+d'', v+d''\}$ in $H[B]$ with $c$.
    This is a proper-coloring of edges of $H[B]$.


    Finally, it remains to add the edges of difference $d''$ to $H$ and so that we
    obtain a proper edge-coloring of $G(D'', g'')$. For each vertex $u \in A$, since
    $u$ has $2k+1$ colors to color the edges of $H$, there exists a color that does
    not occur on any edge of $H$ that is incident with $u$; use this $c(u)$. By the
    method used to edge-color $H[B]$, the colors on the edges in $H[B]$ incident with
    $u$ $c(u)$ do not occur on any edge incident with $u+d''$; we can color the edge
    $\{u, u+d''\}$ in $G(D'', g'')$ with $c(u)$ for each $u \in A$.


