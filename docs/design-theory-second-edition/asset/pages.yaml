    | 1 4 6 | 2 3 5 |

    | 2 3 6 | 1 3 6 |

    | 2 4 5 | 1 4 5 |


    The examples illustrate the fact that $\lambda$-fold triple systems may or may
    not have repeated triples. However, in what follows we will not be concerned with
    or not $\lambda$-fold triple systems have repeated triples. We will be concerned
    with the existence problem only.


    We will solve the problem for $\lambda = 1, 2, 3$, and $6$ only. All other values
    of $\lambda$ can be obtained by “pasting” smaller values of $\lambda$ (see Exercise
    2.6,7).


    Naturally, the place to begin is with $\lambda = 2$. However, in order to construct
    2-fold triple systems we must first construct idempotent quasigroups of every
    order $n \neq 2$. We already know how construct idempotent commutative quasigroups
    of every odd order. So half of the problem is solved. However, the construction
    of idempotent quasigroups of even order is not completely obvious.'
