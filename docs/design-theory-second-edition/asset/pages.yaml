    → V(C2) defined by xa = y if and only if {x, y} ∈ F is an isomorphism of C1 onto
    C2. Just as the case for wheels, wheels can be 1-factored into 3 1-factors. However,
    the algorithm for doing this is just a bit trickier than the algorithm for wheels
    (but not much). To begin with, if C1 has even length, we can take the alternate
