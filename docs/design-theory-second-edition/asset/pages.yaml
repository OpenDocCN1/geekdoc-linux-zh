    # 1.2 $v = 3$ (mod 6): The Bose Construction


    Before presenting the Bose construction [1], we need to develop some “building
    blocks”.

    A latin square of order $n$ is an $n \times n$ array, each cell of which contains
    exactly one of the symbols in $[1, 2, \dots, n]$, such that each row and column
    of the array contains each of the symbols in $[1, 2, \dots, n]$ exactly once.
    A quasigroup of order $n$ is a pair $(Q, \circ)$, where $Q$ is a set of size $n$
    and “$\circ$” is a binary operation on $Q$ such that for every pair of elements
    $a, b \in Q$, the equations $a \circ x = b$ and $y \circ a = b$ have unique solutions.
    As far we are concerned quasigroup is a latin square with a headline and skyline.


