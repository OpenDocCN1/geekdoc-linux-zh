  md: "# Mutually Orthogonal Latin Squares\n\n# 6.1 Introduction\n\nTwo latin squares\
    \ $L_1$ and $L_2$ of order $n$ are said to be *orthogonal* if for each $(x, y)\
    \ \\in \\{1, 2, \\dots, n\\} \times \\{1, 2, \\dots, n\\}$ there is exactly one\
    \ ordered pair $(i, j)$ such that cell $(i, j)$ of $L_1$ contains the symbol $x$\
    \ and cell $(i, j)$ of $L_2$ contains the symbol $y$. In other words, if $L_1$\
    \ and $L_2$ are superimposed, the resulting set of $n^2$ ordered pairs are *distinct*.\
    \ The latin squares $L_1, L_2, \\dots, L_n$ are said to be mutually orthogonal\
    \ if $1 \\leq a \neq b \\leq t$, $L_a$ and $L_b$ are orthogonal.\n\nThe easiest\
    \ way to show that a pair of latin squares is orthogonal is to use the \"famous\"\
    \ *two-finger rule*.\n\n**The Two-Finger Rule** Let $L$ and $M$ be latin squares\
    \ of order $n$. Then $L$ and $M$ are orthogonal if and only when a pair of cells\
    \ are occupied by the *same symbol* in $L$, they are occupied by *different symbols*\
    \ in $M$.\n\n**Example 6.1.1** $L_1$ and $L_2$ are orthogonal latin squares of\
    \ order 3,\n\n| | 1 | 3 | 2 |\n|---|---|---||}{\n| $L_1 =$ | 3 | 2 | 1 |\n| |\
    \ 2 | 1 | 3 |\n\n| | 1 | 2 | 3 |\n|---|---|---||}{\n| $L_2 =$ | 3 | 1 | 2 |\n\
    | | 2 | 3 | 1 |\n\n![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_137_0.png)\n\n![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_137_1.png)\n\
    \nFigure 6.1: The Two-Finger Rule."
