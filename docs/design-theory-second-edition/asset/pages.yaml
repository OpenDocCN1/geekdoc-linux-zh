    *Proof.* We prove that $(S, T)$ is a Steiner triple system by using Exercise 1.1.4.
    We begin by counting the number of triples in $T$. The number of Type 1 triples
    is clearly $2n+1$, and defining the Type 2 triples, there are $\binom{2n+1}{2}
    = (2n+1)(2n)/2$ choices for $i$ and $j$, each choice giving rise to 3 triples
