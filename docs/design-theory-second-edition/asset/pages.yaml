  md: '# # Kirkman Triple Systems


    # ## 5.1 A recursive construction


    In this chapter we will consider Steiner triple systems with the additional property
    of being resolvable. Not only will we consider when such systems exist, but also
    many different PBDs will be found, and in the process several important constructions
    for PBDs will be introduced. In fact, understanding the various constructions
    in Section 5.2 is more than the point finding the PBDs themselves.


    We begin with some definitions. A *parallel class in a Steiner triple system (S,
    T)* is a set of triples in T that partitions S. An STS (S, T) *resolvable* if
    the triples in T can be partitioned into parallel classes. A resolvable STS(v)
    is also known as a Kirkman triple system of order v, or KTS(v).


    **Example 5.1.1** A KTS(9) with classes $\pi_1, \pi_2, \pi_3$ and $\pi_4$ can
    be defined as follows:


    | $\pi_1$ | $\pi_2$ | $\pi_3$ | $\pi_4$ |

    |---|---|---||

    | 1 2 3 | 1 4 7 | 1 5 9 | 1 6 8 |

    | 4 5 6 | 2 5 8 | 2 6 7 | 2 4 9 |

    | 7 8 9 | 3 6 9 | 3 4 8 | 3 5 7 |


    A STS(15) with parallel classes $\pi_1, \pi_2, \pi_3, \pi_4, \pi_5, \pi_6$ and
    $\pi_7$ can be defined as follows:


    | $\pi_1$ | $\pi_2$ | $\pi_3$ | $\pi_4$ |

    |---|---|---||

    | 1 2 3 | 1 4 5 | 1 6 7 | 1 8 9 |

    | 4 8 12 | 2 8 10 | 2 9 11 | 2 12 15 |

    | 5 10 14 | 3 13 15 | 3 12 14 | 3 5 6 |

    | 6 11 13 | 6 9 14 | 4 10 15 | 4 11 14 |

    | 7 9 15 | 7 11 12 | 5 8 13 | 7 10 13 |


    | $\pi_5$ | $\pi_6$ | $\pi_7$ |

    |---|---|--|

    | 1 10 11 | 1 12 13 | 1 14 15 |

    | 2 13 14 | 2 4 6 | 2 5 7 |

    | 3 4 7 | 3 9 10 | 3 8 11 |

    | 5 9 12 | 5 11 15 | 4 9 13 |

    | 6 8 15 | 7 8 14 | 6 10 12 |'
