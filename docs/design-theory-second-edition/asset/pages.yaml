  md: '56


    # 2. $\lambda$-Fold Triple Systems


    A Mendelsohn triple system of order $n\ MTS(n)$ is a pair $(S, T)$, where $T$
    is an edge disjoint collection of directed triples which partition the edge set
    of $D_n$ with vertex set $S$.


    Example 2.4.1 $AnMTS(4)$


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_74_0.png)


    # Exercises


    2.4.2 Show that each $MTS(n)$ contains $n(n-1)/3$ directed triples and therefore
    a necessary condition for the existence of an $MTS(n)$ is $n \equiv 0$ or 1 (mod
    3).


    2.4.3 Let $S$ be a set of size $n$ and $T$ a collection of directed triples of
    $D_n$ with vertex set $S$ such that


    +   (a) every directed edge of $D_n$ belongs to a directed triple of $T$, and

    (b) $|T| \leq n(n-1)/3$.


    Prove that $(S, T)$ is an $MTS(n)$. (Compare to Exercise 2.3.5.)


    2.4.4 Let $(S, T)$ be a Steiner triple system of order $n$. Replace each triple
    $[a, b, c]$ by the two directed $(a, b, c)$ and $(a, c)$, and denote the resulting
    collection of directed triples by $D(T)$. Prove that $(S, D(T))$ is an $MTS(n)$.
    (Hint: count the number of directed triples and show that each directed edge belongs
    to a directed triple in $D(T)$.)


    2.4.5 Let $(S, T)$ be an $MTS(n)$ and $T^* = \{[a, b, c] \mid (a, b, c) \in T\}$.
    This may well result in repeating triples since $(b, a, c) \in T$ is possible.
    Prove that $(S, T^*)$ is a 2-fold triple system.


    2.4.6 Let $S = \{1, 2, 3, 4, 5, 6\}$ and $T = \{1, 2, 3\}, \{2, 4\}, \{3, 2, 5\},
