  md: '# Affine and Projective Planes


    # 7.1 Affine planes


    In what follows we will call the blocks of a PBD lines. If several points belong
    to the same line we will say that they are collinear, and if two lines fail to
    intersect we will say that they are parallel. Additionally, if the point $p$ belongs
    to the line $\ell$ we will say that $p$ is on the line and that $\ell$ passes
    through $p$.

    An affine plane is a PBD $(P, B)$ with the following properties:


    +   (1) $P$ contains at least one subset of 4 points which are collinear,

    (2) (parallel postulate) given a line $\ell$ and a point $p$ not on $\ell$, there
    is EXACTLY line of $B$ containing $p$ which is parallel to $\ell$.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_173_0.png)


    4 points, no 3 of which are collinear.


    There is exactly one line through $p$ parallel to $\ell$.


    Figure 7.1: Affine plane.


    **Remark** Condition (1) in the definition of an affine plane guarantees that
    the plane is non-trivial; that is, it does not consist of a single line.'
