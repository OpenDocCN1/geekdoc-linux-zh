  md: "# 2.3. 2-Fold triple systems\n\nJust as Steiner triple systems (that is, triple\
    \ systems of index $\\lambda = 1$) we can think of a 2-fold triple system as a\
    \ decomposition of $2K_v$, the graph with $v$ vertices in which each pair of vertices\
    \ is joined by 2 edges, into edge disjoint triangles.\n\n# Exercises\n\n**2.3.2\
    \ If $(S, T)$ is a 2-fold triple system of order $v$, then show that $|T| = v(v-1)/3$.\n\
    \n**2.3.3 Deduce that a necessary condition for the existence of a 2-fold triple\
    \ system of order $v \\equiv 0$ or 1 (mod 3).**\n\n**2.3.4 Use trial and error\
    \ to construct a 2-fold triple system of order 6.**\n\n2.3.5 Let $S$ be a set\
    \ of size $v$ and $T$ a collection of 3-element subsets of $S$ such that\n\n+\
    \   (a) every pair of elements of $S$ belongs to at least two triples of $T$,\
    \ and\n\n+   (b) $|T| \\le v(v-1)/3$.\n\nShow that $(S, T)$ is a 2-fold triple\
    \ system of order $v$. (Compare this to Exercise 1.1.4.)\n\n**Remark 2.3.6** Exercise\
    \ 2.3.5 gives an easy technique for showing that $(S, T)$ is a 2-fold triple system.\
    \ Simply count the number of triples; if this is less than or equal to the correct\
    \ number of triples, and if every pair is in at least two triples, then every\
    \ pair is *exactly* two triples!\n\nThe *spectrum* for 2-fold triple systems is\
    \ defined to be the set of integers $v$ for which there exists a 2-fold triple\
    \ system of order $v$.\n\n**Theorem 2.3.7** *The spectrum for 2-fold triple systems\
    \ is precisely the set of all $v \\equiv 0$ or 1 (mod 3).**\n\nThe following constructions\
    \ provide a proof of the above.\n\n**The 3n Construction** Let $(Q, \\circ)$ be\
    \ an idempotent (not necessarily commutative) quasigroup of order $n$ and $S =\
    \ Q \times \\{1, 2, 3\\}$. Define a collection of triples $T$ as follows:\n\n\
    +   Type 1: $\\{(x, 1), (x, 2), (x, 3)\\}$ occurs exactly twice in $T$ for every\
    \ $x \\in Q$; and\n\n+   Type 2: if $x \neq y$, the triples $\\{(x, 1), (y, 1),\
    \ (x \\circ 2)\\}$, $\\{(y, 1), (x, 1), (y \\circ 2)\\}$, $\\{(x, 2), (y, 2),\
    \ (x \\circ 3)\\}$, $\\{(y, 2), (x, 2), (y \\circ 3)\\}$, $\\{(x, 3), (y, 3),\
    \ (x \\circ 1)\\}$, $\\{(y, 3), (x, 3), (y \\circ 1)\\}$ belong to $T$.\n\nThen\
    \ $(S, T)$ is a 2-fold triple system of order $3n$.\n\nFigure 2.2 represents this\
    \ construction graphically.\n\nAn example of this construction follows the next\
    \ construction."
