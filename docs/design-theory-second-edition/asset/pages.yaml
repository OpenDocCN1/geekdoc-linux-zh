    This gives us a necessary condition for the embedding to occur:


    **Lemma 9.1.7** *If the $r \times s$ latin rectangle can be embedded in a latin
    square of order $t$, then*


    ```

    $N_R(\sigma) \ge r+s-t$ for $1 \le \sigma \le t$.

    ```


    This is known as the Ryser Condition, named after Herb Ryser who first penned
    these conditions. Notice that when considering $R_1$ in Example 9.1.1, each of
    the symbols $1, \dots, 6$ occurs at least three times, with $N_R(\sigma) \ge 3$
    for $1 \le \sigma \le 6$; and $r+s-t = 4+5-6=3$. The Ryser Condition is satisfied.
    (We know this condition must be satisfied because the example of $T_1$ in Example
    9.1.2 demonstrates that there is enough room in $T$ for each symbol to occur $t=6$
    times!)


    # Exercises


