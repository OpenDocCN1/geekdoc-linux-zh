    Let $R$ be an $n^2 \times 3$ orthogonal array and $\alpha \in S_3$ (= the symmetric
    group on $\{1, 2, 3\}$). Define $R\alpha$ to be the $n^2 \times 3$ array obtained
    from $R$ by permuting the columns of $R$ according to $\alpha$. Then $R\alpha$
