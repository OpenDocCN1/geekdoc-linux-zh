    **Theorem 6.2.15** If $A_1$ and $A_2$ are orthogonal latin squares of order $m$
    and $B_1$ and $B_2$ are orthogonal latin squares of order $n$, then the direct
    products $A_1 \times B_1$ and $A_2 \times B_2$ are orthogonal latin squares of
    order $mn$.


    *Proof.* When we will index the rows and columns with the $mn$ ordered pairs $(x,
    y) \in \{1, 2, \dots, m\} \times \{1, 2, \dots, n\}$. We will use the Two-Finger
    Rule, so suppose cells $((x_1, y_1), (z_1, w_1))$ and $((x_2, y_2), (z_2, w_2))$
    contain the same symbol $(a, b)$ in $A_1 \times B_1$. We will show that these
    cells are occupied by different symbols in $A_2 \times B_2$. There are two cases
    to consider: (1) $(y_1, w_1) = (y_2, w_2)$ and (2) $(y_1, w_1) \neq (y_2, w_2)$.
    We handle each in turn.'
