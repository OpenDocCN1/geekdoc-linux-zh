    # **5.1.7** Show that the construction of a KTS($6n + 3$) in the proof of Theorem
    5.1.3 produces STS.


    We end this section by stating two results. The first result provides the right
    ingredients to use with the recursive construction of Theorem 5.1.3 to settle
    the existence problem for Kirkman triple systems, which is the second result.


    **Theorem 5.1.8** For all $n \ge 1$, there exists a PBD($3n + 1$) with block sizes
    $\{4, 7, 10, 19\}$.


    *Proof.* This is left to Section 5.2. $\square$


    # **Theorem 5.1.9** For all $n \ge 1$, there exists a KTS($6n + 3$).


    *Proof.* In view of Theorems 5.1.3 and 5.1.8, all we need to find a KTS($2k +
    1$) for each $k \in \{4, 7, 10, 19\}$. A KTS(9) and a KTS(15) are constructed
    in Example 5.1.1, so it remains to find a KTS(21) and a KTS(39).


