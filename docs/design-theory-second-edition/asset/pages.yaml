  md: '# 7.2. Projective planes


    designs. While the order of an affine plane determines the number of points, clearly
    this is not the case for block designs in general. That is to say, the block size
    of a block design does not, in general, determine the number of points. We just
    need to pay attention to the context in which we use the word “order” if we are
    bouncing back and forth between PBDs and affine planes.


    # 7.2 Projective planes


    A projective plane is a PBD (P, B) with the following properties:


    +   (1) P contains at least one subset of 4 points, no 3 of which are collinear;
    and


    +   (2) every pair of lines intersect in EXACTLY one point.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_175_0.png)


    4 points, no 3 of which

    are collinear.


    Every pair of lines intersects

    in (exactly) one point.


    Figure 7.2: Projective plane.


    **Remark** Condition (1) in the definition of a projective plane guarantees that
    the plane is non-degenerate; that is, does not consist of n + 1 points, with one
    line of size n and the remaining lines of length 2 (= the degenerate projective
    plane).'
