    Not too surprising, we can reverse the above construction to produce a complete
    set of MOLS(n). To be specific: Let $(P, B)$ be an affine plane of order $n$.
    Label the $n+1$ parallel classes in $B$ by $V, H, \pi_1, \pi_2, \dots, \pi_{n-1}$
    and the lines in each parallel class with the integers $1, 2, \dots n$. For each
    parallel class $\pi_x$ we construct a latin square $L_x$ of order $n$ as follows:
    Fill in $(i, j)$ of $L_x$ with the label of the line in $\pi_x$ which contains
    the point of intersection of line $i$ in $V$ with line $j$ in $H$. The resulting
    collection of latin squares is a complete set of MOLS(n).


