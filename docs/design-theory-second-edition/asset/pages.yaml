  md: '# 10.3. The Stern and Lenz Lemma


    We begin with some graph theoretical definitions. A component in a graph G is
    a maximal connected subgraph of G. A graph is k-regular if all vertices have degree
    k. A k-cycle is defined as the graph with vertex set $\{v_1, \dots, v_k\}$ and
    edge set $\{v_i, v_{i+1} \mid i \leq k-1\} \cup \{v_k, v_1\}$, and we denote the
    k-cycle by $(v_1, \dots, v_k)$. If H is a graph with vertex set V and edge set
    E, and if $A \subseteq V$, then the subgraph of H induced by A is the graph with
    vertex set A and edge set $\{{u, v} \mid u, v \in A\}$. We define this induced
    subgraph by H[A].


    Let G be a graph with g vertices. The difference of the edge $e = \{u, v\}$ in
    G, named so that $u < v$, is defined to be $v-u$ or $g-(v-u)$, whichever is smaller;
    we denote the difference of $e = \{u, v\}$ by $D_g(u, v)$, or by $D(u, v)$ if
    the value of g is clear. If $e = \{u, v\}$ with $u < v$ then


    ```

    D(e) = D(u, v) = \min\{v-u, g-(v-u)\}

    ```


    (it is important to remember that we are assuming that $u < v$).


