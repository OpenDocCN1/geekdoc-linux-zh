    **The $2n + 1$ Construction** Let $(S, T)$ be a Steiner triple system of order
    $n$ and let $(X, F)$ be a 1-factorization of $K_{n+1}$ with vertex set $X$, where
    $X \cap S = \emptyset$. Let $S^* = S \cup X$ and define a collection of triples
    $T^*$ as follows:


    +   (1) $T \subseteq T^*$.


    +   (2) Let $\alpha$ be any $n-1$ mapping from $S$ onto $\{1, 2, 3, \dots, n\}$.
    For each $x \in S$ and each $[a, b] \in F_\alpha$, place the triple $\{x, a, b\}$
    in $T^*$.


    Then $(S^*, T^*)$ is a Steiner triple system of order $2n + 1$.


