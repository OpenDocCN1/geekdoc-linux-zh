    ```

    $|T|=(2n+1)+3(2n+1)/2\n=(2n+1)(3n+1)/2\n=v(v-1)/6$

    ```


    Therefore $T$ contains the right number of triples, and so it remains to show
    that each pair of distinct symbols $S$ occurs in at least one triple of $T$. Let
    $(a, b)$ and $(c, d)$ be a pair of symbols. We consider three cases.


    Suppose that $a=c$. Then $\{(a,1), (a,2), (a,3)\}$ is a Type 1 triple in $T$ and
    contains $(a,b)$ and $(c,d)$.


    Suppose $b=d$. Then $a \neq c$ and so, $\{(a,b\}, (c,b), (a \circ c, b+1)\} \in
    T$ and contains $(a,b)$ and $(c,d)$ (of course, the second coordinate is dense
    modulo 3).


    Finally suppose $a \neq c$ and $b \neq d$. We assume that $b=1$ and $d=2$, as
    the other cases follow similarly. Since $(Q, \circ)$ is a quasigroup, $a \circ
    i=c$ for some $i \in Q$. $(S, \circ)$ is idempotent and $a \neq c$, it must be
    that $i \neq a$. Therefore $\{(a,1), (i,1), (a \circ i, c)\}$ is a Type 2 triple
    in $T$ and contains $(a,b)$ and $(c,d)$.


    By Exercise 1.1.4 it now follows that $(S, T)$ is a Steiner triple system.


