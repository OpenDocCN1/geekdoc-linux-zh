    # 6.3 Disproof of the MacNeish Conjecture


    In 1959 E. T. Parker [23] took the first step toward disproving the Euler Conjecture
    by disproving the MacNeish Conjecture. Since the Euler Conjecture is a special
    case of the MacNeish Conjecture, a disproof of the MacNeish Conjecture is certainly
    a step in the right direction. What Parker did was to construct 3 MOLS(21). Since
    21 = 3 · 7 and 2 = min{3, 7} - 1, this result disproves the MacNeish Conjecture.
    Clearly Corollary 6.2.17 cannot be used to construct 3 MOLS(21), so a different
    construction will be needed. The following construction has come to known as the
    PBD Construction.


    | | 1 | 2 | ... | y | ... | n |

    |---|---|---|---|---|---|---|

    | 1 | | | | | | |

    | 2 | | | | | | |

    | ... | | | | | | |

    | x | | | | | | |

    | n | | | | | | |


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_153_0.png)


    Figure 6.8: The PBD Construction.'
