    The permutation $\alpha = (1, 2, 3)(4, 5, 6)(7, 8, 9)$ is an automorphism of $(S,
    T)$. However $(S, T)$ is not cyclic because its automorphism is a cycle of length
    $v$.


    It is natural to ask, for which $v$ do there exist STS$(v)$ that are cyclic? This
    question can be answered by solving the following problems that were posed by
    L. Heffter in 1896 [13]. For each integer $v$, define a difference triple to be
    a subset of 3 distinct elements of $\{1, 2, \dots, v-1\}$ such that: (i) their
    sum is $0 \pmod v$, or (ii) one element is the sum of the other two (mod $v$).


    In what follows we will always label the elements of a difference triple with
    $x$, $y$ and $z$ with the proviso $x + y = \pm z \pmod v$. Note that for any difference
    triple defined by (i), we can label the three elements $x, y$ and $z$ in any way
    we want. However if the difference triple is defined by (ii) then $z$ is uniquely
    determined. We remark that $x, y$, and $z$ are distinct and nonzero. This is important!


    # Heffter''s Difference Problems


    +   (1) Let $v = 6n + 1$. Is it possible to partition the set $\{1, 2, \dots,
    (v-1)/2 = 3n\}$ into difference triples?


    +   (2) Let $v = 6n + 3$. Is it possible to partition the set $\{1, 2, \dots,
    (v-1)/2 = 3n+1\{\{v/3} = 2n+1$ into difference triples?


    # 1.7.2 A solution to Heffter''s first difference problem


    +   (a) when $v = 7$ is $\{\{1, 2, 3\}\}$, and


    +   (b) when $v = 13$ is $\{\{1, 3, 4\}, \{2, 5, 6\}\}$ since $1 + 3 = 4$ and
    $2 + 5 + 6 = 13 \pmod v$.


    A solution to Heffter''s second difference problem


    +   (a) when $v = 9$ does not exist, since $\{1, 2, \dots, (v-1)/2\} = \{1, 2,
    4\}$ which is not a difference triple, and


    +   (d) when $v = 15$ is $\{\{1, 3, 4\}, \{2, 6, 7\}\}$.


    # Exercises


    # 1.7.3 Find a solution to Heffter''s difference problem when


    +   (a) $v = 19$


    +   (b) $v = 21$


    +   (c) $v = 25$'
