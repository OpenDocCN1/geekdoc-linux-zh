    In Example 7.1.1(a) there is, clearly, just collection of 4 points, no3 of which
    are collinear. However, in general, such collections are far from unique. For
    example, in Example 7.1.1(b) there are exactly 54 collections of 4 points, no
    3 of which are collinear: $\{1, 2, 6, 9\}$ and $\{3, 5, 6, 8\}$ are 2 such collections.


    # Exercises


    7.1.2 Prove that in the affine plane in Example 7.1.1(b) there are exactly 54
    collections of 4 points, no 3 of which are collinear.


    7.1.3 Let $(P, B)$ be an affine plane. If $n \ge 2$, prove that the following
    statements are equivalent:


    +   (a) One line contains $n$ points.

    (b) One point belongs to exactly $n + 1$ lines.

    (c) Every line contains $n$ points.

    (d) Every point is on exactly $n + 1$ lines.

    (e) There are exactly $n^2$ points in $P$.

    (f) There are exactly $n^2 + n$ lines in $B$.


    The number $n$ is called the order of the affine plane $(P, B)$; i.e., the number
    of points on each line is considered the order of the affine plane. Exercise 7.1.3
    shows that an affine plane is simply a block design containing $n^2$ points with
    each block containing $n$ points. The converse is also true; i.e., a block design
    containing $n^2$ points with block size $n$ is an affine plane.


    # Exercises


    7.1.4 Show that a block design of order $n^2$ with block size $n$ is an affine
    plane.


    Remark Unfortunately, if $(P, B)$ is a block design with $|P| = n^2$ points and
    block size $n$, the order is $n^2$ if $(P, B)$ is considered as a block design,
    and $n$ if $(P, B)$ is considered as an affine plane. So the word “order” can
    mean two different things. The reason for this is that affine planes were studied
    long before PBDs and block'
