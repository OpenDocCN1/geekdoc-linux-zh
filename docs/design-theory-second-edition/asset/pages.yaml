  md: "# 8. Intersections of Steiner Triple Systems\n\n# Exercises\n\n**8.1.9** (a)\
    \ In Example 8.1.8 write out all triples in $T_2\\alpha$ and verify that $T_1\
    \ \\cap T_2\\alpha = \\{1, 5, 9\\}$. (b) Now use the Reduction Algorithm to find\
    \ a transposition $\beta$ so that $|T_1 \\cap T_2\beta| \\leq 1$.\n\n**8.1.10**\
    \ In Example 8.3 used repeated applications of the Reduction Algorithm to find\
    \ transpositions $\\alpha_1, \\alpha_2, \\dots, \\alpha_k$ so that $T_1 \\cap\
    \ T_2\\alpha_1\\alpha_2\\dots\\alpha_k = \\emptyset$. Begin with Example 8.1(3).(This\
    \ may take some time.)\n\nNow given a pair of Steiner triple systems $(S, T_1)$\
    \ and $(S, T_2)$ it may be possible to apply the Reduction Algorithm until $T_2\\\
    alpha_1\\alpha_2\\dots\\alpha_k = \\emptyset$. What can go wrong in the following:\
    \ at some element in every triple of $T_1 \\cap T_2\\alpha_1\\alpha_2\\dots\\\
    alpha_k$ has spread $S$. The following algorithm, known as Teirlinck’s Algorithm\
    \ [30] takes care of this case.\n\n**Teirlinck's Algorithm** Let $(S, T_1)$ and\
    \ $(S, T_2)$ be any two STS(n) and suppose that $[1, 2, 3] \\in T_1 \\cap T_2\
    \ = S$. Then there exists a transposition $\\alpha$ such that $T_1 \\cap T_2\\\
    alpha$ contains a triple $t$ and an element $e \\in t$ such that $|S(e)| < n$\
    \ and $|T_1 \\cap T_2\\alpha| \\leq |T_1 \\cap T_2|$.\n\nTo actually find the\
    \ transposition, we recursively, reducing the size of the intersection at each\
    \ step. It may be simpler for many readers to use the pictorial representation\
    \ rather than the following more formal description of a step in the algorithm.\n\
    \n+   1. Suppose $[1, 2, 3]$ is in both triples of $T_1$ and $T_2$.\n2. Let $\\\
    {3, x, y\\}$ be another triple in $T_2$ containing the symbol 3.\n3. Find the\
    \ triple containing $x$ and $y$ in $T_1$, say $\\{x, y, c\\}$. Since $S(3) = S$,\
    \ it follows that $c \notin \\{1, 2, 3\\}$.\n4. Find the triple containing $c$\
    \ and $3$ in $T_2$, say $\\{3, c, d\\}$.\n5. Find the triple containing $c$ and\
    \ $d$ in $T_1$, say $\\{c, d, e\\}$. Since $S(3) = S$, it follows that $e \notin\
    \ \\{1, 2, 3\\}$.\n\n+   6. Let $\\alpha$ be the transposition (3e).\n\nThen $\\\
    {c, d, e\\} \\in T_1 \\cap T_2\\alpha$ and $|S(e)| < n$. The fact that $|T_1 \\\
    cap T_2\\alpha| \\leq |T_1 \\cap T_2|$ is left as an exercise."
