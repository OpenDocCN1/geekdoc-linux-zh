  md: '# 2.2. The existence of idempotent latin squares


    # 2.2 The existence of idempotent latin squares


    A transversal T of a latin square of order n on the symbols {1, 2, ..., n} is
    a set of n cells, exactly one cell from each row and each column, such that each
    of the symbols in {1, 2, 3, ..., n} occurs in a cell of T.


    Example 2.2.1 Let


    | | 1 | 3 | 4 | 2 |

    |---|---|---|---||}{

    | L = | 4 | 2 | 1 | 3 |

    | | 2 | 4 | 3 | 1 |

    | | 3 | 1 | 2 | 4 |


    Then L has many transversals including


    +   $T_1 = \{(1, 1), (2, 2), (3, 3), (4, 4)\},

    $T_2 = \{(1, 3), (2, 4), (3, 1), (4, 2)\}$, and

    $T_3 = \{(1, 1), (2, 4), (3, 2), (4, 3)\}


    **Stripping a transversal** If {1, 2, ..., n} is a quasigroup of order $n-1$ that
    contains a transversal $T$, then this quasigroup can be used to produce a quasigroup
    $(\{1, 2, ..., n\}, *)$ by stripping the transversal $T$ as follows.


    +   (1) For each $(i, j) \in T$, define

    $i * n = n * j = i \circ j$, and $i * j = n$.


    +   (2) For each $(i, j) \notin T, 1 \leq i, j \leq n-1$ define

    $i * j = i \circ j$.


    +   (3) Define $n * n = n$.


    **Example 2.2.2** Using the quasigroup


    | | 1 | 2 | 3 | 4 |

    |---|---|---|---||}{

    | | 1 | 3 | 4 | 2 |

    | 2 | 4 | 2 | 1 | 3 |

    | 3 | 2 | 4 | 3 | 1 |

    | 4 | 3 | 1 | 2 | 4 |'
