    # Embeddings


    # 9.1 Embedding latin rectangles – necessary conditions


    As we have seen in Section 1.8, it is possible to construct STSs of order $v \in
    [2n + 1, 2n + 7]$ that contain an STS($n$); each construction starts with (1)
    $T \subseteq T^*$. This is referred to as an *embedding* of an STS($n$) into an
    STS($v$). There has a lot of interest in the related problem of embedding of an
    *partial STS(n)* into an STS($v$) for every $v \geq 2n + 1, v \equiv 1 \pmod 6$.
    The fact that such an embedding is always possible was proved by Bryant and Horsley
    in 2008. We will have to say about this topic later in the chapter.


    We begin by considering the problem of embedding incomplete latin rectangles into
    latin squares. An $r \times s$ incomplete latin rectangle $R$ on the set of symbols
    $S = [1, \dots, n]$ is an $r \times s$ (possibly $r = s$) array in which each
    symbol in $S$ occurs at most once in each row and column, and in which each cell
    contains exactly one symbol. So if $r = s = n$ then $R$ is a latin square. We
    do not require each symbol in $S$ to occur in a cell in $R$.


    **Example 9.1.1** $R_1$ is a $4 \times 5$ incomplete latin rectangle on the symbols
    $1, \dots, 6$.


    $R_1 = \begin{array}{|c|c|c|c|c|c|} \hline & 1 & 2 & 3 & 4 & 5 \ \hline 5 & 6
    & 1 & 3 & 2 \ \hline 6 & 1 & 4 & 2 & 3 \ \hline 4 & 3 & 2 & 5 & 6 \ \hline \end{array}$


    An $r \times s$ incomplete latin rectangle $R$ is said to be embedded in a latin
    square $T$ of order $t$ if the $r \times s$ array appearing in the top left corner
    of $T$ is $R$.


    **Example 9.1.2** $R_1$ from Example 9.1.1 can be embedded in a latin square $T_1$
    of order 6 and a latin square $T_2$ of order 9.


    $T_1 = \begin{array}{|c|c|c|c|c|c|} \hline & 1 & 2 & 3 & 4 & 5 & 6 \ \hline 5
    & 6 & 1 & 3 & 2 & 4 \ \hline 6 & 1 & 4 & 2 & 3 & 5 \ \hline 4 & 3 & 2 & 5 & 6
    & 1 \ \hline 2 & 4 & 5 & 6 & 1 & 3 \ \hline 3 & 5 & 6 & 1 & 4 & 2 \ \hline \end{array}$


    185'
