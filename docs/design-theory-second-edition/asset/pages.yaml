    +   **Case 2:** If $r \equiv 10$ or $22 \pmod{36}$ then $r \ge 46$. The $(3v -
    2)$ Construction with $v = (r+2)/3 \equiv 16 \pmod{36}$ produces an SQS($v$) containing
    SQS(8) (see Theorem 10.2.6) by the inductive hypothesis contains an SQS(8).


