  md: '# Kirkman Triple Systems


    # Exercises


    # 5.1.2 Show that in any KTS(v),


    +   (a) the number of triples in each parallel class is $v/3$, and

    (b) the number of parallel classes is $(v-1)/2$.


    Deduce that $v \equiv 3 \pmod 6$ is necessary.


    Kirkman triples are named after the Rev. T. P. Kirkman in 1850 posed and solved
    [15, 16] the “Kirkman schoolgirl problem”: Is it possible for a schoolmist to
    take 15 schoolgirls on a walk each day of the 7 days of week, with 5 rows of 3
    girls each, in a way that each pair of girls together in the same row on exactly
    one day? A little reflection shows that this problem is asking if there exists
    a KTS(15). The answer is clearly yes, which KTS(15) is exhibited in Example 5.1.1
    (you can think of $\pi_1, \pi_2, \pi_3, \pi_4, \pi_5, \pi_6, \pi_7$ as the arrangement
    of the Kirkman lines on Monday through Sunday).


    Recall that a pairwise balanced design of order $v$ (or simply, a PBD(v)) is an
    ordered pair $(S, B)$ where $S$ is a finite set of symbols with $|S|=v$, and $B$
    is a set of subsets of $S$ called $blocks$ (not necessarily of the same size),
    such that each pair of distinct elements of $S$ occurs in exactly one block in
    $B$. A Steiner triple system is a PBD with all blocks of size 3. The following
    recursive construction shows how a PBD($3n+1$) be used to construct a KTS($6n+3$)
    (notice that the proof actually constructs such a KTS). This construction is exhibited
    graphically in Figures 5.1 and 5.2.


    **Theorem 5.1.3** If there exists a PBD($3n+1$) with block sizes $k_1, k_2, \dots,
    k_x$, and if there exists KTS($2k_i+1$) for $1 \le i \le x$, then there exists
    a KTS($6n+3$).


    Proof. Let $(P, B)$ be a PBD($3n+1$), with $P = \{1, 2, \dots, 3n+1\}$ and with
    block sizes $k_1, k_2, \dots, k_x$. Define a KTS($6n+3$) $(S, T)$ with $S = \{\infty\}
    \cup (\{1, 2, \dots, 3n+1\} \times [1, 2])$ as follows:


    +   (1) For $1 \le i \le 3$, with $\{\infty, i\} \in T$,

    (2) for each block $b \in B$, let $S(b), T(b)$ be a KTS of order $2|b|+1$, where
    $S(b) = \{\infty\} \cup (b \times \{1, 2\})$ and the symbols have been named so
    that $\{\infty, (i, 1), (i, 2)\} \in T(b)$ for all $i \in b$, and $T(b)[{\{\infty,
    (i, 1), (i, 2)\} \mid i \in b \in T].$.


    The fact that this an STS($6n+3$) is left to Exercise 5.1.7 (see also Figure 5.1),
    but now show how the triples in TT can be partitioned into parallel classes $\pi_1,
    \pi_2, \dots, \pi_{n+1}$ (see Figure 5.2).


    For $1 \le x \le 3n+1$, let $B_x$ be the set of blocks in $B$ that contains symbol
    $x$. For each block $b \in B_x$, let $p_x(b)$ be the parallel class of triples
    in $T(b)$ that contains the triple $(\{\infty, (x, 1), (x, 2)\}$ (recall that
    in (2) the symbols are named so that $T(b)$ does not contain this triple). Then
    define


    ```

    \pi_x = \bigcup_{b \in B_x} p_x(b)$

    ```'
