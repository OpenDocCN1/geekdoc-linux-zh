    A set of mutually orthogonal quasigroups (latin squares) of order n is equivalent
    to a TD(n, k+2). This is quite to see. Let $(L, o_1), (L, o_2), \dots, (L, o_k)$
    be k mutually orthogonal quasigroups of order n.


    > $P = \{1, 2, \dots, n\} \times \{1, 2, \dots, k+2\}\nG = \{(i, 1), (i, 2), (i,
    3), \dots, (n, i)\} \mid i = 1, 2, \dots, k+2\}\nB = \{(i, j), (i, o_1 j), (i,
    o_2 j), \dots, (i, o_k j), (i, k+2)\} \\mid \text{all } i,\nj \in \{1, 2, \dots,
    n\}$


    It is straight and not difficult to see that $(P, G, B)$ is a TD(n, k+2). Conversely,
    suppose we have the TD(n, k+2) given by


    > $P = \{1, 2, \dots, n\} \times \{1, 2, \dots, k+2\}\nG = \{(i, 1), (i, 2), (i,
    3), \dots, (n, i)\} \mid i = 1, 2, \dots, k+2\}\nn^2 \text{ blocks B.}$


    Define groupoids $(L, o_1), (L, o_2), \dots, (L, o_k)$ of order n by: $x \ o_i
    y = z_i$, if and only


    > $\{(x, 1), (y, 2), (z_1, 3), (z_2, 4), \dots, (z_k, k+2)\} \in B.$


    Once it is easy to see that the k groupoids $(L, o_1), (L, o_2), \dots, (L, o_k)$
    are mutually orthogonal quasigroups. (The proof that TD(n, k+2) is equivalent
    to k mutually orthogonal quasigroups of order n is left to Exercise 6.5,3).'
