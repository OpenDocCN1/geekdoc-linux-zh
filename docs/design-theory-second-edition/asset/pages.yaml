    In what follows we need a 1-factorization of a very particular graph; the so-called
    deficiency graph of (Z_n,+) (= the integers modulo n). The deficiency graph of
    (Z_n,+), where n ≡ 1 or 5 (mod 6), is defined to be the graph G = (V, E) with
    vertex set V = Z_n\0 and edge E = {{x, -x}, {x, -2x} | x ∈ Z_n\0}. It is immediately
    seen that the deficiency graph has a 1-factorization (into 3 1-factors, of course).
    Important for us is that we will give a very simple algorithm for doing this,
    which requires some additional preliminaries.


    In this book, a wheel graph consisting of a cycle of even length and a 1-factor
    in which the edges join the opposite vertices of the cycle (called the spokes).
    A wheel can be 1-factored into 3-factors by taking the alternate edges of the
    cycle as two of the 1-factors and the spokes for the third.


