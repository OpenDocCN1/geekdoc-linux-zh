    Wilson’s Construction [34] for Steiner triple systems) Let $v=1$ or $3$ (mod 6)
    and set $S=\{\infty, \infty_2\}\cup Z_{v-2}$. It is important to note that $v-2$
    is 1 or 5 (mod 6). Definition of collections of triples as follows:


    Type 1: $T^*=\{x, y, z | x+y+z=0$ (mod 2)}, where $x, y, z$ are distinct elements
    in $Z_{v-2}\setminus\0\}$.


    Type 2: The 2-element subsets of $Z_{v-2}\setminus\0\}$ not covered by a Type
    1 triple are precisely the 2-element subsets of the form $[x, -x]$ and $[x, -2x]$;
    i.e., the deficiency graph of $(Z_{v-2}, +)$. Let $F_0, F_1$, and $F_2$ be a 1-factorization
    of the deficiency graph and define


    ```

    $T_0=\{0, x, y\} | [x, y] \in F_0\$

    T_1=\{\{\infty, x, y\} | [x, y] \in F_1\$

    T_2=\{\{\infty_2, x, y\} | [x, y] \in F_2\}$

    ```


    Type 3: $\{0, \infty, \infty_2\}$.


    Set $T=T^* \cup T_0 \cup T_1 \cup T_2 \cup{\{\infty, \infty, \infty_2\}$. Then
    $(S, T)$ is an STS($v$).


