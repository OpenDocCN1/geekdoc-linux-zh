    | $\dots$ | $\dots$ | $\dots$ | $\dots$ |

    | A(n,1) | A(n,2) | $\dots$ | A(n,n) |


    where $A(i, j) $ is the latin square of order $m$ formed from $A$ by replacing
    each entry $x$ with $(x, k)$, where $k$ is the entry in cell $(i, j)$ of $B$.


