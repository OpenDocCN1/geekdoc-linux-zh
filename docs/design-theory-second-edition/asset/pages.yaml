    $T_3(a) = \{(x, 1), (y, 2), (z, 3) | x+y+z \equiv a \pmod g\}$.


    So the triples in $T_3(a)$ are the triples that contain any three symbols that
    are on three different levels whose first coordinates add to $a$ modulo $g$. Two
    such triples are shown below.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_249_1.png)


    **Type 4** $T_4$ is partitioned into $g/2$ sets $T_4(d)$ for $1 \leq d \leq g/2$,
    where


    $T_4(d) = \{(x, i), (x+d, i), (y, j)\} | 1 \leq x, y \leq g, 1 \leq i, j \leq
    3, i \neq j\}$.


    So triples in $T_4(d)$ contain two symbols that are on the same level and are
    joined by an edge of difference $d$ modulo $g$, and any third symbol is on a different
    level. Two such triples are shown below.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_249_2.png)'
