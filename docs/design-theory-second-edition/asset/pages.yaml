    **Theorem 7.4.3** An affine plane of order $n$ (and therefore a projective plane
    of order $n$) is equivalent to a complete set of MOLS(n).


    Since there is a complete from MOLS(n) of every order $n = p^a > 2$ for every
    prime $p$ (constructed from finite fields), there is an *affine plane* (and therefore
    a *projective plane*) for each of these orders. These are the ONLY orders for
    which affine planes are known to exist. Although a theorem by R. H. Bruck and
    H. J. Ryser rules out the existence of affine planes of certain non-prime power
    orders, there are plenty of unsettled cases remaining (to put it mildly).


    **Theorem 7.4.4 (R. H. Bruck and H. J. Ryser [4])** Let $n = 1$ or $2 \pmod 4$
    and let the squarefree part of $n$ contain at least one prime factor $p \equiv
    3 \pmod 4$. Then there does not exist an affine plane of order $n$.


    This theorem rules out affine planes of order 6, 14, and among others.

    Fairly recently $n = 10$ was ruled out (by means of a massive computer search)
    and the first unsettled case is $n = 12$. In order to construct an affine plane
    of order 12, it is necessary to construct 11 MOLS(12). The closest anyone has
    come is 5 MOLS(12). This is due to A. L. Dulmage, D. M. Johnson, and N. S. Mendelsohn
    [8] and was done by hand!


    **Open Problem.** Does there exist an affine plane of non-prime power order?'
