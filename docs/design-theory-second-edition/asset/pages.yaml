  md: '# 3. Quasigroup Identities and Graph Decompositions


    3.1.10 Find all collections consisting of two identities from the table in Exercise
    3.1.8 which imply that a quasigroup has conjugate invariant subgroup $S_3$.


    A few words on vernacular.


    **Totally symmetric** Any quasigroup which is invariant under conjugation by $S_3$
    is called *totally symmetric*. So for example, if a quasigroup satisfies the identities
    $xy = yx$ and $(yx)x = y(x)$ it is totally symmetric. As Exercise 3.1.10 illustrates
    there are many different ways to describe a totally symmetric quasigroup using
    identities.

    **Semisymmetric** Any quasigroup which is invariant under conjugation by (at least)
    $((123))$ is called *semisymmetric*. We point out that a totally symmetric quasigroup
    is also semisymmetric but the converse is not necessarily so. For example the
    quasigroup


    | | 1 | 2 | 3 | 4 |

    |---|---|---|---||}{

    | 1 | 1 | 3 | 4 | 2 |

    | 2 | 4 | 2 | 1 | 3 |

    | 3 | 2 | 4 | 3 | 1 |

    | 4 | 3 | 1 | 2 | 4 |


    is semisymmetric but not totally symmetric. Finally, a semisymmetric quasigroup
    can be described by either one of the identities $x(y) = y$ or $(yx)x = y$ or
    by both, since they are equivalent.


