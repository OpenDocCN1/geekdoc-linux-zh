  md: '# #1 Steiner Triple Systems


    # 1.1 The existence problem


    A Steiner triple system is an ordered pair $(S, T)$, where $S$ is a finite set
    of points or symbols, and $T$ is a set of 3-element subsets of $S$ called triples,
    such that each pair of distinct elements of $S$ occurs together in exactly one
    triple of $T$. The order of a Steiner triple system $(S, T)$ is the size of the
    set $S$, denoted by $|S|.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_19_0.png)


    Figure 1.1: Steiner triple system.


    **Example 1.1.1** (a) $S = \{1\}$, $T = \phi$


    (b) $S = \{1, 2, 3\}$, $T = \{\{1, 2, 3\}\}


    (c) $S = \{1


    +   (d) $S = \{1, 2, 3, 4, 5, 6, 7, 8, 9\}$ and $T$ contains the following triples:

    - $\{1, 2, 3\}$ $\{1, 4, 7\}$ $\{1, 5, 8\}$

    - $\{4, 5, 6\}$ $\{2, 5, 8\}$ $\{2, 6, 7\}$ $\{2, 4, 9\}$

    - $\{7, 8, 9\}$ $\{3, 6, 9\}$ $\{3, 4, 8\}$'
