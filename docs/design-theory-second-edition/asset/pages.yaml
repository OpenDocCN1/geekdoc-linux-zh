    # 2.6 \lambda-Fold triple systems in general


    In Sections 2.3 and 2.4 we have determined the spectrum for $\lambda$-fold triple
    systems for $\lambda = 2, 3$, and 6. If we don''t mind repeated triples (and we
    don''t!) these results are sufficient, along with the spectrum for Steiner triple
    systems ($\lambda = 1$), to determine the spectrum for $\lambda$-fold triple systems
    for any $\lambda$. The accompanying table gives a summary of the spectrum problem
    for $\lambda$-fold triple systems in general.


    | $\lambda$ | spectrum of $\lambda$-fold triple systems |

    |---|---|

    | 0 (mod 6) | all $v \neq 2$ |

    | 1 or 5 (mod 6) | all $v \equiv 1$ or 3 (mod 6) |

    | 2 or 4 (mod 6) | all $v \equiv 0$ or 1 (mod 6) |

    | 3 (mod 6) | all odd $v$ |


    > **Theorem 2.6.1** The above table provides necessary and sufficient conditions
    for the existence of a $\lambda$-fold triple system of order $v$.


    The verification of Theorem 2.6.1 is left as an exercise.


