    # 1.6 The Wilson Construction


    Before giving the Wilson Construction for triples없이 graph G is a set of pairwise
    disjoint edges which partition the vertex set. A 1-factor of graph is a 2-regular
    spanning subgraph. A 1-factorization of G is a set of 1-factors which partition
