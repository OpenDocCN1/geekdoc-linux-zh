  md: '# 4.1. The general problem


    | 1 or 3 (mod 6) | 0 or 2 (mod 6) | 5 (mod 6) | 4 (mod 6) |

    | --- | --- | --- | --- |

    | $\emptyset$ | | | |

    | Steiner Triple System | | 4-cycle | |

    | | | | |

    | | 1-factor | | tripole |


    Figure 4.2: Leaves of maximum packings.


    We will prove (i), (ii), (iii), and (iv) in Section 3.2.

    The examples in Examples 4.1.1 illustrate the three possibilities for $v \equiv
    0, 2, 4$, or 5 (mod 6): the leave in (a) is a 1-factor, in (b) is a triple, and
    in (c) is a 4-cycle.

    We now present our second definition of being "close" to a Steiner triple system.

    A **covering** of the complete graph $K_v$, where triangles is a triple $(S, T,
    P)$, where $S$ is the vertex set of $K_v$, $P$ is a subset of the edge set of
    $\lambda K_v$ and $T$ is a collection of disjoint triangles in which each pair
    of vertices is joined by $\lambda$ edges). The collection of edges $P$ is called
    the **padding** and the number $v$ is the **order** of the covering $(S, T, P)$.
    So there is no confusion, we emphasize that an edge $\{a, b\}$ belongs to exactly
    $x+1$ triangles of $T$, where $x$ is the number of times $\{a, b\}$ belongs to
    $P$. If $|P|$ is as small as possible the covering $(S, T, P)$ is called a **minimum
    covering with triangles** (MCT), or more simply a *minimum covering* of order
    $v$. So a Steiner triple system is a minimum covering with padding $P = \emptyset$.


    # **Example 4.1.2** Minimum coverings


    +   (a) $(S_1, T_1, P_1)$ is a minimum covering of order 5.


    $S_1 = \{1, 2, 3, 4, 5\},$

    $T_1 = \{\{1, 2, 4\}, \{1, 2, 3\}, \{1, 2, 5\}, \{3, 4, 5\},$

    $P_1 = \{\{1, 2\}, \{1, 2\}\}$.'
