    **Theorem 2.2.3** *For $n \neq 2$ exists an idempotent quasigroup of order $n$.*


    *Proof.* If $n$ is odd we can rename the addition for the integers modulo $n$
    to form an idempotent latin square of order $n$ (see Exercise 1.2.3). Now $T =
    \{(1, 2), (2, 3), \dots, (n-1, n), (n, 1)\}$ is a transversal of the addition
    table for the integers modulo $n$ when $n$ is odd (see Exercise 2.2.5), and so
    is also a transversal of the idempotent quasigroup obtained by renaming it. Therefore
    we can form an idempotent quasigroup of order $n+1$ by stripping the transversal
    $T$. $\square$


