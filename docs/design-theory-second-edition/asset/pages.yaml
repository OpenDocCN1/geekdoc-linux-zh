    # 9.5 Embedding partial Steiner triple systems


    The fact that a partial idempotent commutative quasigroup of order $n$ can be
    embedded in an idempotent commutative quasigroup of order $t$ for all odd $t \geq
    2n+1$ (Theorem 9.4.7) can be used to obtain a very nice embedding for partial
    Steiner triple systems.


    A Steiner triple system of order $n$ is a pair $(X, P)$, where $P$ is a collection
    of edge disjoint triples of the edge set of $K_n$ with vertex $X$.


    **Example 9.5.1** (Partial STS of order 7)


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_216_0.png)


    The difference between a partial triple system of order $n$ and a triple system
    of order $n$ is that the triples in the partial triple system do not necessarily
    use all the edges of $K_n$.


    An obvious question to ask whether or not a partial triple system $(X, P)$ can
    be completed to a triple system. That is, does there exist a (complete) triple
    system $(X, T)$ where $P \subseteq T$? It is easy to see that the partial triple
    system $(X, P)$ in Example 9.5.1 *cannot* be completed to a triple system (check
    this!). The obvious question to ask is whether or not $(X, P)$ can be embedded
    in a (complete) triple system. That is, does there exist a triple system $(S,
    T)$ such that $X \subseteq S$ and $P \subseteq T$?'
