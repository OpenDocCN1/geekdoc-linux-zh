  md: '# 6.4. Disproof of the Euler Conjecture


    The Euler Conjecture is true. In 1959 Bose and Shrikhand [2] made the New York
    Times by constructing a pair of orthogonal squares of order 22.


    We will give the original counter-example due to Bose and Shrikhand. We take this
    opportunity to point out that the PBD of order 22 in Lemma 5.2.1 with 1 block
    of size 7 and the remaining blocks of size 4 can be used to construct a pair of
    orthogonal latin squares of order 22 (using the PBD Construction). However, the
    PBD in Lemma 5.2.1 had not yet been constructed! (Hind sight is a wonderful thing).


    The example constructed by Bose and Shrikhande uses a slightly modified version
    of the PBD Construction. In what follows, a partial parallel class of blocks in
    a PBD will be called a clear set of blocks.


    These blocks form a clear set. (P,B)


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_157_0.png)


    It is important to note that the blocks in a clear set do not have the same size
    nor be a complete parallel class; i.e., need not partition the points of the PBD.


    The π PBD Construction Let (P, B) be a PBD with a clear set π ⊆ B. For each block
    p in π let (p, o(p)) be ANY quasigroup, NOT NECESSARILY IDEMPOTENT. For each block
    b in B\π let (b, o(b)) be an idempotent quasigroup. Define a binary operation
    “o” on P:


    +   (1) if x in π, x o x = x o p(x);

    (2) if x does not belong to a block of the clear set π, x o x = x; and

    (3) if x ≠ y in b, x o y = x o (y), regardless of whether b in π or B\π.


    Theorem 6.4.1 The π PBD Construction does in fact produce a quasigroup.


    Proof. The proof of this theorem is similar to the proof of Theorem 6.3.2 (with
    obvious modifications) and is left to Exercise 6.4.7.'
