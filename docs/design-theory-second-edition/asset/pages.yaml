    **6.5.4** Construct a TD(4, 4).


    (The above TD(4, 4) and the TD(3, 4) in Example 6.5.2 turn out to be quite useful
    in what follows.)


    We now give a series of constructions leading up to the main construction. The
    reason for this, is that it makes the main construction much easier to follow.


    **m $\rightarrow$ 3m Construction** (If a TD(m, 4) exists, then a TD(3m, 4) exists).


    Let $(P, G, B)$ be a TD(m, 4) and let $W=\{1, 2, 3\}$. Let $P^* = W \times P$
    and define a collection of groups $G^*$ and blocks $B^*$ as follows:


    +   1) $G^* = \{W \times g \mid g \in G\}$,


    +   2) for each block $b \in B$, let $(W \times [a] \mid a \in b), W(b))$ be a
    TD(3, 4), and place the 9 blocks belonging to $W(b)$ in $B^*$.


    Then $(P^*, G^*, B^*)$ is a TD(3m, 4). See Figure 6.12.


    (It is worth mentioning that the $m \rightarrow$ 3m Construction is just the direct
    product in design theory clothing.)'
