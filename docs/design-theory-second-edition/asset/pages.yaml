  md: "# 10.4. The $(3v - 2u)$-Construction\n\nWe will now look closely at the triples\
    \ contained in these sets of quadruples. We begin by counting the number of triples\
    \ in the quadruples in each set.\n\n# **Lemma 10.4.6** The number of triples occurring\
    \ in quadruples\n\n+   1. in $Q_1$ is $v(v-1)(u-2)/2 - u(u-1)(u-2)/3,\n2. in $Q_2(a,\
    \ \\ell)$ is $4g^2$,n3. in $Q_3(a_1, a_2, a_3)$ is $12g^2$,n4. in $Q_4(D)$ is\
    \ $3g^2$,\n\nwhere $t$ is the number of 1-factors in the 1-factorization of $G(D,\
    \ g)$.\n\n*Proof.* (1) The number of quadruples in the SQS that are not in the\
    \ SQS(u) is $\binom{v}{4} - \binom{u}{4}$. Each such is used to define 3 quadruples\
    \ in $Q_1$. Each of the $\binom{u}{4}$ quadruples in the SQS(u) is used to define\
    \ 1 quadruple in $Q_1$. Since each quadruple contains 4 triples, the quadruples\
    \ in $Q_1$ contain\n\n$4\\left(\\binom{v}{3} - \\binom{u}{3}\\right) + \\left(\\\
