  md: '# 8.1. Teirlinck''s Algorithm


    # 8.1.7 Determine S(15) for {2, 12, 15},


    The following algorithm is called the Reduction Algorithm because it provides
    a way to alter $T_2$ so that the resulting Steiner system has fewer triples in
    common with $T_1$.


    **The Reduction Algorithm** Let $(S, T_1)$ and $(S, T_2)$ be any STS(n) and suppose
    that $\{1, 2, 3\} \in T_2$ and $|S| = n$. Then there exists a permutation $\alpha$
    such that $T_1 \cap T\alpha \subseteq T_1 \cap T_2$ and $|T_1 \cap T\alpha| <
    |T_1 \cap T_2|$.


    **Algorithm** Let $x$ be any element that does not belong to $S$ and let $\alpha
    = (3x)$. To begin, $T_1 \cap T\alpha$ will contain all triples in $T_1 \cap T_2$
    that do not contain an $x$ or a 3, as well as the triple $\{3, x, a\}$ if $\{3,
    x, a\} \in T_1 \cap T_2$. It follows that $(T_1 \cap T_2) \ I \subseteq T_1 \cap
    T_2$, where $I$ is the set of all triples in $T_1 \cap T_2$ containing exactly
    one of $x$ or 3. We will show that $P = \varnothing$ so that $T_1 \cap T\alpha
    = (T_1 \cap T_2) \ I$. Since there are two cases (possibly others, we will show
    if $\{1, 2, 3\} \in T_1 \cap T_2$; $|I| \geq 1$ and $|T_1 \cap I| < |T_1 \cap
    T_2|$) there are two cases to consider. We take one in case:


    +   (i) $\{x, a, b\} \in P$. Then $\{x, a, b\} \in T_2 \cap T\alpha$ implies $\{x,
    a, b\} \in T_2$ and $\{x, a, b\} \in T_1$. This is impossible if $x \notin S(3)$.


    +   (ii) $\{3, a, b\} \in P$. Then $\{3, a, b\} \in T_2 \cap T\alpha$ implies
    $\{x, a, b\} \in T_2$ and $\{3, a, b\} \in T_1$. This is impossible if $x \notin
    S(3)$.


    So, as advised, $T_1 \cap T\alpha = (T_1 \cap T_2) \ I$ and $|I| \geq 1$, $|T_1
    \cap T_2| < |T_1 \cap T_2|$.


    **Example 8.1.8** $(S, T_1)$ and $(S, T_2)$ be the two STS(9) defined by:


    $T_1 = \begin{pmatrix} 1 & 2 & 3 & 14 & 15 & 19 & 16 & 8 \ 4 & 5 & 6 & 25 & 28
    & 27 & 24 & 9 \ 7 & 8 & 9 & 36 & 34 & 35 & 37 & 3 \end{pmatrix}$ \n$T_2 = \begin{pmatrix}
    1 & 3 & 4 & 14 & 17 & 19 & 18 & 6 \ 2 & 5 & 9 & 26 & 28 & 27 & 24 & 5 \ 3 & 6
    & 7 & 35 & 36 & 34 & 39 & 7 \end{pmatrix}$


    Then $T_1 \cap T_2 = \{1, 2, 3\}, \{1, 4, 7\}, \{1, 5, 9\}, \{1, 6, 8\}$.


    +   (a) $S(3) = \{1, 2, 3, 5, 6, 8, 9\}$ with respect to $\{1, 2, 3\}$. Since
    $4 \notin S(3)$, if we take $\alpha = (3)$, $T_1 \cap T\alpha = (T_1 \cap T_2)
    \ I = \{1, 5, 9\}, \{1, 6, 8\}$.


    +   (b) There is a better choice for $\alpha$ with respect to the intersection:
    $S(1) = \{1, 2, 3\}$ with respect to $\{1, 2, 3\}$. Taking $\alpha = (4)$ gives
    $T_1 \cap T\alpha = (T_1 \cap T_2) \ I = \{1, 4, 7\}$.'
