    # 2.4 Mendelsohn triple systems


    The complete directed graph of order $n$, denoted by $D_n$, is the graph with
    $n$ vertices in which each pair of distinct vertices are joined by two directed
    edges (in opposite directions).


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_73_0.png)


    We will denote the directed edge from $a$ to $b$ by $(a, b)$ and the directed
    edge from $b$ to $a$ by $(b, a)$.


    A directed triple is a collection of three directed edges of the form $\{(a, b),
    (b, c), (c, a)\}$ where $a, b,$ and $c$ are distinct. We will denote this directed
    triple by any cyclic shift of $(a, b, c)$.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_73_1.png)'
