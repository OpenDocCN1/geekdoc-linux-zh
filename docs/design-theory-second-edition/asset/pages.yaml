  md: '# Mathematics


    # DISCRETE MATHEMATICS AND ITS APPLICATIONS

    Series Editor KENNETH H. ROSEN


    Design Theory, Second Edition presents some of the most important techniques used
    for constructing combinatorial designs. It augments the descriptions of the constructions
    with many figures to help readers understand and enjoy this branch of mathematics.


    This edition now offers a thorough development of the embedding of latin squares
    and combinatorial designs. It also presents some pure mathematical ideas, including
    connections between universal algebra and graph designs.


    The authors focus on several basic designs, including Steiner triple systems,
    latin squares, and finite projective and affine planes. They produce these designs
    using flexible constructions and add interesting properties that may be required,
    such as resolvability, embeddings, and orthogonality. The authors also construct
    more complicated structures, such as Steiner quadruple systems.


    By providing both classical and state-of-the-art construction techniques, this
    book enables readers to produce many other types of designs.


    # Features


    +   - Develops a deep understanding of the methods through both formal descriptions
    of the constructions and the accompanying illustrations

    - Focuses on construction methods to provide readers with the expertise to produce
    nonstandard experimental designs when needed

    - Includes important results in combinatorial designs, such as the existence of
    orthogonal latin squares, balanced incomplete and pairwise balanced designs, affine
    and projective planes, and quadruple systems

    - Contains extensive new material on embeddings, directed designs, universal algebraic
    representations of designs, and intersection properties of designs


