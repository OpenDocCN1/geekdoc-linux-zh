  md: "# 6. Mutually Orthogonal Latin Squares\n\nIf $L_1, \\dots, L_t$ is a set of\
    \ MOLS(n), it is natural to ask large $t$ can be. Since we can assume that each\
    \ of $L_1, \\dots, L_t$ is in standard form, we can quickly obtain an upper bound\
    \ on $t$ by considering the symbols in cell (2, 1) of $L_1, \\dots, L_t$ (so we\
    \ are assuming that $n \\geq 2$).\n\nNow, the symbol 1 occurs in cell (1, 1) of\
    \ each of these latin squares, so the cell (2, 1) in each of them must be occupied\
    \ by a symbol from the set $\\{2, 3, 4, \\dots, n\\}$. Furthermore, any two of\
    \ these latin squares are superimposed, since they are in standard form, the first\
    \ rows give the ordered pairs $(1, 1), (2, 2), (3, 3), (4, 4), \\dots, (n, n)$.\
    \ Hence the cell (2, 1) cannot be occupied by the same symbol in different squares\
    \ the the pair $(x, x)$ would occur if two symbols are superimposed. So the symbols\
    \ in cell (2, 1) of $L_1, \\dots, L_t$ are all different and belong to the set\
    \ $\\{2, 3, \\dots, n\\}$. Therefore, if $n \\geq 2$ then $t \\leq n-1$. Clearly\
    \ this upper bound can be obtained, since 2 MOLS(3) and 3 MOLS(4) are exhibited\
    \ in Example 6.1.1. A complete set of MOLS(n) is defined to be a set of $n-1$\
    \ MOLS(n) when $n$ is a prime power.\n\n| 1 | 2 | ... | n |\n|---|---|---|--|\n\
    | | | | |\n\n| 1 | 2 | ... | n |\n|---|---|---|---||\n| | | |\n\n| 1 | 2 | ...\
    \ | n |\n|---|---|---|---||\n| | | |\n\nFigure 6.4: MOLS(n) in standard form.\
    \ The cell (2, 1) must be occupied by a symbol from the set $\\{2, 3, \\dots,\
    \ n\\}$ and no two squares can have the same symbol in cell (2, 1).\n\n# Exercises\n\
    \n**6.1.2** If $L$ is a latin square of order $n$ and $\\alpha$ is any permutation\
    \ on $\\{1, 2, 3, \\dots, n\\}$, denote by $L\\alpha$ the latin square obtained\
    \ from $L$ by replacing each symbol $x$ in $L$ by $x\\alpha$. Prove that if $L_1$\
    \ and $L_2$ are orthogonal and $\\alpha$ and $\beta$ are any permutations, then\
    \ $L_1\\alpha$ and $L_2\beta$ are also orthogonal.\n\n**6.1.3** Apply a permutation\
    \ to the symbols in $L_3, L_4$ and $L_5$ of Example 6.1.1 to produce a complete\
    \ set of MOLS(4) in standard form.\n\n**6.1.4** Show that if $\\{L_1, \\dots,\
    \ L_t\\}$ is a set of MOLS(n), all of which are idempotent, then $t \\leq n-2$.\
    \ (Notice that the 2 MOLS(4) in Example 6.1.1 are idempotent, so this bound can\
