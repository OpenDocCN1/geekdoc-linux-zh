  md: '# Quasigroup Identities and Graph Decompositions


    # 3.1 Quasigroup identities


    Let $(Q, \circ)$ be a quasigroup of order $n$ and define an $n^2 \times 3$ array
    $R$ by: $(a, b, c) \in R$ if and only if $a \circ b = c$. Since $a \circ x = b$
    and $y \circ a = b$ have unique solutions for all $a, b \in Q$ the ordered pairs
    $(a, b)$ occurs in the same row of any two columns of $R$. Put another way, if
    we run our fingers down two columns of $R$ we obtain all $n^2$ ordered pairs $(a,
    b) \in Q \times Q$.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_83_0.png)


    The converse is also true. Let $R$ be an $n^2 \times 3$ array based on $Q$ with
    the property that each ordered pair $(a, b)$ appears in the same row in every
    pair of columns. Define a binary operation “$\circ$” on $Q$ by $a \circ b = c$
    if and only if $(a, b, c) \in R$. Then $(Q, \circ)$ is a quasigroup. This is easy
    to see. Let $a, b \in Q$. Then $(a, x, b)$ and $(y, a, b) \in R$ and the equations
    $a \circ x = b$ and $y \circ a = b$ have unique solutions. It follows that every
    quasigroup $(Q, \circ)$ is equivalent to an $n^2 \times 3$ array $R$ (called an
    orthogonal array) such that $a \circ b = c$ if and only if $(a, b, c) \in R$.'
