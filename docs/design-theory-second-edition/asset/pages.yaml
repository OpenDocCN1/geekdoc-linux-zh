    The following proof uses some graph theory, which we introduce. A proper k-edge-coloring
    of a graph G=(V, E) is a function f: E → C where C is a set of size k C={1, 2,
    ..., k} if if two edges e1 ≠ e2 are adjacent f(e1) ≠ f(e2). You can think of f
    as being the “color” that f assigns to the edge e; then a proper k-edge-coloring
    makes sure that each edge receives one of the “colors” {1, 2, ..., k}, and if
    two edges are adjacent they receive different colors.


