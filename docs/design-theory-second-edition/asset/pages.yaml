    # 1.7 Cyclic Steiner triple systems


    An automorphism of an STS $(S, T)$ is a bijection $\alpha : S \to S$ such that
    $t = \{x, y, z\} \in T$ if and only if $\alpha(t) = \{xa, \ya, \za\} \in T$. An
    STS(v) is cyclic if it has an automorphism permutation consisting of a single
    cycle of length $v$.


    Example 1.7.1 (a) $S = \{1, 2, 3, 4, 5, 6, 7\}$, $T = \{1, 2, 4\}, \{2, 3, 5\},
    \{3, 4, 6\}, \{4, 5, 7\}, \{5, 6, 1\}, \{6, 7, 2\}, \{7, 1, 3\}$ is an STS(7)
    which is cyclic, since the permutation $\alpha = (1, 2, 3, 4, 5, 6, 7)$ is an
    automorphism. (Of course (1, 2, 3, 4, 5, 6, 7) we mean $1\alpha = 2, 2\alpha =
    3, \dots, 7\alpha = 1$.) For example, if $t = \{1, 2, 4\}$, then $t\alpha = \{1\alpha,
    2\alpha, 4\alpha\} = \{2, 3, 5\}$ which is indeed a triple in $T$. Similarly,
    for each $t \in T, \alpha \in T$.'
