    Now replace $T(x, y, z)$ by the 9 triples


    $T^*(x, y, z) = \begin{array}{|c|c|c|} x_1, y_1, z_1 & x_1, y_2, z_3 & x_1, y_2,
    y_3 \ x_2, y_2, z_2 & y_1, z_2, x_3 & z_1, z_2, x_3 \ x_3, y_3, z_3 & z_1, x_2,
