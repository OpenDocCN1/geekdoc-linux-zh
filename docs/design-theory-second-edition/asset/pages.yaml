    **Lemma 10.4.12** The $(3v-2u)$ Construction, $v \neq u$ (mod 6) produces an SQS$(3v-2u)$
    that contains an SQS$(v$).


    *Proof.* Using Lemma 10.4.7, each triple in $T_1$ is a quadruple in (a). $T_2$
    is a quadruple in (b). Each triple in $T_3(a)$ is a quadruple in (b) for $6n+1
    \leq a$ and is a quadruple in (c) for $1 \leq a \leq 6n$. Each quadruple in $T_4(d)$
    is a quadruple in (c) if $d \in D_g(0, 6i-3) \mid 1 \leq i \leq n$ (where these
    differences are all different?) and is a quadruple in (d) (otherwise when $g/2
    \in D$). By Exercise 10.4.5, SQS$(3v-2u)$ has been produced. Clearly the quadruples
    in $Q_1$ form SQS$(v)$ in the SQS$(3v-2u)$, each of which intersects each other
    in an SQS$(u)$, so the results follow.


    To show the flexibility of this construction, the following example shows how
    the $(3v-2u)$ can be constructed with $v=10$ and $u=2$ to construct an SQS(26)
    that not only contains an SQS$(v=10)$ as guaranteed to exist by Lemma 10.4.12,
    but also contains SQS(8).


    **Example 10.4.13** Let $v=10$ and $u=2$, so $g=8$. Then $v \neq u$ (mod 6) and
    there exists an SQS(10) containing (trivially) an SQS(2). So we can use Lemma
    10.4.12 to define our SQS(26) containing an SQS(10). In fact, as we show below,
    it is possible to define our SQS(26) that it also contains an SQS(8). Writing
    $v=6n+2un=1$, from the $(3v-2u)$ Construction we see the quadruples in the SQS(26)


    +   (a) $Q_1$,


    +   (b) $Q_2(7, 1)$ and $Q_2(8, 2)$,


    +   (c) $Q_3(1, 2, 3)$; and,


    +   (d) $Q_4(1, 2, 4)$.


    To see that each triple is in a quadruple in exactly one of these sets, first
    notice that from Lemma 10.4.1 we know that in $T_1$ quadruples in $Q_2(7, 1)$;
    triples in $T_3(2)$, $T_3(3)$, $T_3(4)$, $T_3(5)$, $T_3(6)$, $T_3(7)$, $T_3(g=8)$,
    $T_4(1)$, $T_4(2)$, $T_4(3)$ and $T_4(g/2=4)$. Now, using Lemma 10.4.7 we know
    that in $T_1$ quadruples in $Q_3(1)$; triples are in quadruples in $Q_2(7, 1)$;
