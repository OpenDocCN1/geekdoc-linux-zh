    # 4.3 Minimum coverings


    Just as the case with maximum packings we will break the constructions into four
    parts depending on the padding. When $v \equiv 1$ or $3 \pmod 6$, the padding
    is the empty set there is nothing to do. As maximum packing we need only consider
