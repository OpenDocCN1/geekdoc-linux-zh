  md: '# 4. Maximum Packings and Minimum Coverings


    **The 4-cycle Construction** Let $v \equiv 5 \pmod 6$ and let $(P, B)$ be a PBD
    with one block of size 5 and the remaining blocks of size 3. Let $T$ be the set
    of triples in $B$. Replace the block $\{a, b, c, d, e\}$ of size 5 with the maximum
    packing $(\{a, b, c, d, e\}, T^*, L)$, where $T^* = \{\{a, b, c\}, \{a, d, e\}\}$
    and $L = \{\{b, e\}, \{e, c\}, \{c, d\}, \{d, b\}\}$. Then $(P, T \cup T^*, L)$
    is a maximum packing of order $v$ with leave the 4-cycle L.


