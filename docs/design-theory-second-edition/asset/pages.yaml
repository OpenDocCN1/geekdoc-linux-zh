    1)}, {(1, 1), (2, 1), (4, 1)}, {(1, 1), (2, 1), (5, 1), (5, 1)}; and using $\pi_2$
    and $\pi_1$ show that {(1, 1), (2, 1), (6, 1)} and {(1, 3), (3, 1), (5, 1)} are
    quadruples in B. Apply $\pi_1$ to each of these quadruples to see that each of
    the 35 containing symbols with second coordinate 1 occurs a quadruple in B. Applying
    $\pi_3$ to each of these quadruples shows that each of the 35 containing symbols
