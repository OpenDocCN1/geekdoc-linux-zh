    Then $Q_5(a, d)$ contains each triple in $T_3(a)$, $T_3(a+d)$ and $T_4(d)$.


    **Lemma 10.4.18** Let $g=0$ (mod 6), $a \neq 0$ (mod 3), $a \equiv d$ (mod 3)
    and $1 \leq d < g/2$. The sets of triples occurring in quadruples in $Q_5(a, d)$
    are precisely $T_3(a)$, $T_3(a+d)$ and $T_4(d)$.


    *Proof.* $Q_5(a, d)$ contains $g^2$ quadruples, there are 3 choices for each $(x,
    i)$ is one of them, $g$ choices for $y$, and $g/3$ choices for $z$. Similarly,
    $Q_5^0(a, d)$ contains $g^2$ quadruples, $d \neq g/2$. The number of triples occurring
    in quadruples in $T_3(a) \cup T_3(a+d) \cup T_4(d)$ is $4g^2+g^2$ which is the
    number of triples occurring in $T_3(a) \cup T_3(a+d) \cup T_4(d)$. Therefore,
    it remains to show that each of these triples occurs in at least one of quadruples
    in $Q_5(a, d)$.


