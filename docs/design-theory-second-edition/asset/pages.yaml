    **The Even-Odd Algorithm** Let $\{d, d+1\} \subseteq Z_{2n}\setminus\{0\}$, where
    $d$ is even and $1 \le d \le n-2$. Then the graph consisting of edges of length
    $d$ and $d+1$ can be partitioned into two 1-factors of $K_{2n}$. (See the Stern-Lorenz
    Lemma in Chapter 10 for a generalization of this.)


    We say that $(d)$ is even or odd depending whether it is a cycle of even or odd
    length. There are two cases to look at here: $(1)$ $(d)$ is even and $(2)$ $(d)$
    is odd.


    +   (1) If $(d)$ is even, then taking alternating edges of $\pi(d)$ partitions
    the edges in $\pi(d)$ into two 1-factors. Since $(d+1)$ is always even (because
    we assume $d$ is even), it can also be partitioned into two 1-factors. This gives
    a total of four 1-factors of $K_{2n}$.


    +   (2) If $(d)$ is odd then $\pi(d)$ consists of an even number of cycles $(d)+i$,
    $0 \le i < gcd(d,n)$. We use the edges of length $d+1$ to pair the cycles in $\pi(d)$
    as $C_i = (d)+i$ and $C_{i+1} = (d)+i+1$, i,, paired. Then the edges in $C_{i+1}$
    are $|x+d|x+d+1|$ for all $x \in C_i$. Set $f(i,i+1) = \{|x+d|x+d+1|\}$. Then
    $C_i \cup C_{i+1} \cup f(i,i+1)$ is a biwheel and can be factored into three 1-factors.
    (See Section 1.6.) Running over all pairs of cycles in $(d)$ gives 3 1-factors
    of $K_{2n}$ consisting of edges of length $d$ and $d+1$. Since the edges $f(i,i+1)$,
    form a 1-factor of $K_{2n}$, and $\pi(d+1)$ is 2-regular (each vertex has degree
    2), the deletion of these edges from $\pi(d+1)$ leaves a 1-factor. This remaining
    1-factor along with the other 3 gives a total of four 1-factors of $K_{2n}$ using
    all of the edges of length $d$ and $d+1$, even.


    **The Even-Odd Corollary** If $d$ is even and $d=n-1$, the edges of length $n-1$
    and $n$ can be partitioned into three 1-factors of $K_{2n}$.'
