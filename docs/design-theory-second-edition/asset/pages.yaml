  md: '# 6.3. Disproof of the MacNeish Conjecture


    *Proof.* $(P, B)$ be a PBD and for each block $b \in B$ let $(b, \circ(b))$ be
    an idempotent quasigroup. Regardless of whether $(P, B)$ is a quasigroup, it is
    certainly idempotent. So suppose $x \circ y = x \circ z$. Then $x, y,$ and $z$
    all belong to the same block $b$ of $B$. Hence $x \circ(b)y = x \circ(b)x = x
    \circ(b)z$ implies $y = z$. A similar argument shows that $x \circ y = y \circ
    x$ implies $y = z$. It follows that $(P, B)$ is an idempotent quasigroup.


    Now the outstanding feature of PBD Construction, as far as we are concerned, is
    that it can be used to construct orthogonal quasigroups.


    **Theorem 6.3.3** Let $(P, B)$ be a PBD with the property that every block $b
    \in B$ exists a pair of idempotent quasigroups $(b, o_1(b))$ and $(b, o_2(b))$
    which are orthogonal. Then the PBD Construction produces a pair of idempotent
    orthogonal quasigroups $(P, o_1)$ and $(P, o_2)$.


    *Proof.* We will use the Two-Finger Rule. There are a few cases in the proof.
    We will just handle one (the easiest one) and leave the remaining cases as an
    exercise. Suppose $x \circ y = z \circ w = u$, where $x \neq y$ and $z \neq w$.
    Let $x, y \in p$ and $z, w \in q$, where $p$ and $q$ belong to $B$. Now since
    $(P, o_1(p))$ and $(P, o_2(p))$ are orthogonal, $x, o_1(p)$ and $x, o_2(p)$ are
    distinct. Similarly, $z, o_1(w)$ and $z, o_2(w)$ are distinct. If $x \circ o_2(y)
    = z \circ o_2(w = u$, then $u$ belongs to both $p$ and $q$ and suppose $p = q$.
    Then $x \circ o_1(p) = y \circ o_1(w)$ and $x \circ o_2(y) = z \circ o_2(w)$ which
    contradicts the fact that $(P, o_1(p))$ and $(P, o_2(p))$ are orthogonal. As mentioned
    above, the other cases are left to Exercise 6.3.8.


    **Corollary 6.3.4** Let $(P, B)$ be a PBD of order $n$ and suppose that for each
    block $b \in B$ there $m$ exist $m$ idempotent MOLS($|b|$). Then there exist $m$
    MOLS(n).


