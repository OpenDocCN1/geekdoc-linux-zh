  md: "# 208 10. Steiner Quadruple Systems\n\n(V, B) of order v. Each quadruple {a,\
    \ b, c, d} in B contains the four 3-element sets {a, b, c}, {a, b, d}, {a, c,\
    \ d} and {b, c, d}, and altogether there $\binom{v}{3}$ 3-element subsets of V.\
    \ Since the blocks in B partition the $\binom{v}{3}$ 3-element subsets, we have\
    \ the following.\n\nTheorem 10.1.1 The number of quadruples in an SQS, (V, B)\
    \ is\n\n```\n$|B| = \\binom{v}{3}/4 = v(v-1)(v-2)/24.$\n```\n\nAs in the case\
    \ of Steiner triples, knowing |B| helps in proving that (V, B) is an SQS(v): if\
    \ each 3-element subset of V contains at least one block, and if $|B|=v(v-1)(v-2)/24$,\
    \ then (V, B) is an SQS (see Exercise 10.1.9).\n\n# Example 10.1.2 Triple examples.\n\
    \n+   (a) (V, B) = ({1}, $\\emptyset$) is an SQS(1).\n\n+   (b) (V, B) = ({1,\
    \ 2}, $\\emptyset$) is an SQS(2), because V contains no 3-element subsets.\n\n\
    +   (c) (V, B) = ({1, 2, 3, 4}, {1, 2, 3, 4}}) is an SQS(4).\n\n**The Boolean\
    \ Steiner Quadruple System Construction for an SQS(2$^n$)** For each $n \\ge 3$,\
    \ there exists an SQS(2$^n$) (V, B) which can be constructed as follows. Let $V\
    \ = \\mathbb{Z}_2^n$ be the set of binary words of length $n$, where each component\
    \ is either 0 or 1. If $a = (a_1, \\dots, a_n)$ and $b = (b_1, \\dots, b_n)$ are\
    \ two binary words of length $n$, then we define $a+b = (a_1+b_1, \\dots, a_n+b_n)$,\
    \ reducing each sum modulo 2. So $a+b$ is another binary word of length $n$. (For\
    \ example, (0, 1, 1, 0) + (0, 0, 1, 1) = (0, 1, 0, 1); for brevity 0110+0011 =\
    \ 0101.) Now define\n\n$B = \\{a, b, c, d\\}, a, b, c$ and $d$ are 4 distinct\
    \ binary words of length $n$ such that $a+b+c+d = 0 \\dots 0$.\n\nThen (V, B)\
    \ is the Steiner quadruple system known as the *Boolean Steiner quadruple system*.\n\
    \n*Proof.* To see that this defines an SQS(v = $2^n$), suppose that $a, b$ and\
    \ $c$ are any three different words of length $n$ (i.e., three elements of V).\
    \ Since each quadruple in B has the property that the sum of the 4 elements is\
    \ $0 \\dots 0$, the possible 4-element subset of V would be in B and contain $\\\
    {a, b, c\\}$ where $d = a+b+c = 00 \\dots 0$. So $\\{a, b, c\\}$ is in at one\
    \ quadruple in B. But to be in, we also need to show that $a, b, c$ and $d$ are\
    \ all different. Clearly this is, since we chose $a, b$ and $c$ to be all different,\
    \ and if $d$ is one of the others, say $d = a$, then $a+b+c+d = 00 \\dots 0$,\
    \ which implies that $c = b$; indeed $a, b, c$ and $d$ are all different. Therefore\
    \ $\\{a, b, c\\}$ is in exactly one quadruple in B, so (V, B) is an SQS($2^n$)."
