    **The Deficiency Graph Algorithm.** Let $m \equiv 1$ or $5 \pmod 6$ and let $G
    = (V, E)$ be the deficiency graph of $(Z_m, +)$. Let $F = \{\{x, -x\ \mid x \in
    Z_m \setminus \{0\}\}$ and $T = \{\{x, -2x\ \mid x \in Z_m \setminus \{0\}}$.


    +   (1) Decompose $T$ into disjoint cycles. (Since $T$ is a 2-factor of $G$ this
    is always possible.) We consider each cycle $C$ in $T$.

    (2) If $C$ is a cycle of length *even* then each pair of opposite vertices in
    $C$ is of the form $[x, -x]$, or there exists another cycle $C^*$ such that $x
    \in C$ if and only if $-x \in C^*$ (see Exercise 1.6.9). Regards, let $F(C)$ be
    the set of edges of $F$ which covers the vertices of $C$ or $C^*$, and form the
    biwheel $C \cup C^* \cup F(C)$ or $C \cup U \cup F(C)$, as the case may be.


    +   (3) If $C$ is a cycle of odd length then there exists a cycle $C^*$ such that
    $x \in C$ if and only if $-x \in C^*$ (see Exercise 1.6.9). Let $F(C)$ be the
    set of edges of $F$ which covers the vertices of $C \cup C^*$ and form the biwheel
    $C \cup C^* \cup F(C)$.'
