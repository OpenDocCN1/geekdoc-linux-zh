  md: '# 6. Mutually Orthogonal Latin Squares


    So to show that there exist a pair of orthogonal latin squares of every order
    $n \neq 2$ or 6, we need to handle the cases where $n \equiv 2 \text{(mod 4)}
    \geq 10$. The cases $n = 10$ and 14 are handled by example. (See Examples 6.5.10
    and 6.5.11.) The remaining cases, $n \equiv 2 \text{(mod 4)} \geq 18$, will be
    constructed using a construction due to Richard Wilson. Actually, Wilson''s Construction
    constructs a pair of orthogonal latin squares for every even $n \geq 18$ (and
    not just for $n = 2 \text{(mod 4)}$).


    A *transversal design* is a GDD (P, G, B) with all groups of the *same size* and
    that each block intersects each group. We will denote a transversal design with
    group size $m$ and block size $n$ by $TD(m, n)$. Clearly the *order* of a transversal
    design $TD(m, n)$ is $mn$.


