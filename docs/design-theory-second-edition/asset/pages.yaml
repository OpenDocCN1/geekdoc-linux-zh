  md: '# 6. Mutually Orthogonal Latin Squares


    Proof. It is convenient to use latin vernacular in the proof. We denote the latin
    square associated with the quasigroup $(F, \circ)$ by $L(k)$. We will check that
    $L(k)$ and $L(\ell)$ are orthogonal for $1 \le k < \ell < n$ using the Two-Finger
    Rule.


    Suppose that cells $(i_1, j_1)$ and $(i_2, j_2)$ contain the same symbol in $L(k)$
    and both the same symbol in $L(\ell)$. We will prove that $i_1 = i_2$ and $j_1
    = j_2$. For convenience, let $x \cdot y$ be denoted by $xy$.


    By definition of $(F, \circ(k))$ and $(F, \circ(\ell))$ we have that


    ```

    $i_1 + j_1 = i_2k + j_2$,

    $i\ell + j_1 = i_\ell + j_2$

    ```


    So


    ```

    $i_1k + j_1 - i_2k = j_2 = i_\ell + j_1 - j_\ell$, or

    ```


    ```

    $(i_1 - i_2)k = (i_1 - i_\ell).

    ```


    Since $k \neq \ell$ and $k, \ell \neq 0$, this means that $i_1 - i_2 = 0$, so
    $i_1 = i_2$ and therefore $j_1 = j_2$. $\square$


    **Example 6.2.3** The 3 quasigroups in Example 6.2.1 constructed using The Finite
    Field Construction are mutually orthogonal (check it out!).


    **Example 6.2.4** We construct 4 MOLS(5) using the finite field construction.
    The finite field of order 5 is, of course, the integers (mod 5). So we can easily
