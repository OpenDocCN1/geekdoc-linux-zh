    Figure 5.6: A GDD(2, 4) of order 14.


    We can combine GDD(3, 4) of order 12 and the GDD(2, 4) of order 14 constructed
    above by applying an extremely useful construction: Wilson''s Fundamental Construction
    of GDDs (named after R. M. Wilson). This is so important that we take the time
    to describe it.


    **Wilson''s Fundamental Construction** {33}. To construct "big" GDDs from "small"
    GDDs). Let $(P, G, B)$ be a GDD. Let $w$ be a positive integer called the weight,
    and $W = \{1, 2, \dots, w\}$. Suppose that for each $b \in B$ there exists a GDD$(W
    \times b, \{W \times \{p\} \mid p \in b\}, B(b))$. Then $(W \times P, G'', B'')$
    has $G'' = \{W \times g \mid g \in G\}$ and $B'' = \bigcup_{b \in B} B(b)$, is
    a GDD.


    Notice that if $(P, G, B)$ has group sizes $g_1, g_2, \dots, g_s$, then $(P \times
    W, G'', B'')$ has group sizes $wg_1, wg_2, \dots, wg_s$, and its block sizes are
    determined by the sizes of the blocks in $B(b)$, for each $b \in B$.


    This construction is exhibited graphically in Figure 5.7.


    We now apply Wilson''s Fundamental Construction to the GDD(2, 4) of order 14 defined
    above, using a weight of $w=3$; so $W=\{1, 2, 3\}$. For each block $b \in B$ we
    need to define a GDD$(W \times b, \{W \times \{x\} \mid x \in b\}, B(b))$. Since
    each block in $B$ has size 4, we can simply use a copy of the GDD(3, 4) of order
    12 constructed. Therefore we end up with a GDD$(\{1, 2, 3\} \times \{1, \dots,
    14\}, \{1, 2, 3\} \times \{i, t+i\} \mid i \le 7\}, \bigcup_{b \in B} B(b))$,
    which is a GDD(6, 4) of order 42. (See Figure 5.8).'
