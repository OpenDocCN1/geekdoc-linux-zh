  md: '# 1.1. The existence problem


    **Example 1.1.2** The Steiner triple system of order 7 in Example 1.1.1(c) can
    be represented graphically by taking the solid triangle joining 1, 2 and 4 below,
    rotating once to get the dotted triangle joining 2, 3 and 5, and continuing this
    process through 5 more rotations.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_21_0.png)


    Steiner triple systems were apparently defined for the first time by W. S. Woolhouse
    [35] (Prize question 1733, Lady’s and Gentlemen’s Diary, 1844) who asked: For
    positive integers $v$ there exist a Steiner triple system of order v? This existence
    problem of Woolhouse was solved in 1847 by Rev. T. P. Kirkman [14], who proved
    the following result.


    **Theorem 1.1.3** A Steiner triple system of order $v$ exists if and only if $v
    \equiv 1$ or 3 (mod 6).


    If $(S, T)$ is a triple system of order $v$, any triple $[a, b, c]$, $[b, c]$
    and $[a, c]$, and $S$ contains a total of $(\frac{v(v-1)}{2})$ 2-element subsets.
    Each pair of distinct elements of $S$ occurs together in exactly one of $T$, $|T|
    = \frac{v(v-1)}{6}$ and so $|T| = \frac{v(v-1)}{6}$ / giving


    ```

    $|T| = v(v-1)/6$ (1.1)

    ```


    For any $x \in S$, set $T(x) = \{t\{x\} | t \in T\}$. Then $T(x)$ partitions $S\setminus{x\}$
    into 2-element subsets, so


    $v - 1$ is even.


    Since $v - 1$ is even, it must be odd. The number of triples $|T| = v(v-1)/6$
    is never even when $v = 5$ (mod 6), and we can rule out $v = 5$ (mod 6) as a possible
    order of a Steiner triple system. Hence $v \equiv 1$ or 3 (mod 6) is a *necessary
    condition* for the existence of a Steiner triple system of order $v$.


    The next is to show that for all $v \equiv 1$ or 3 (mod 6) there exists a Steiner
    triple system of order $v$, which will settle the existence problem for Steiner
    triple systems. We will give a much simpler proof of this result than the one
    given by Kirkman.'
