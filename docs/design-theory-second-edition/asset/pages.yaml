  md: '# 6.2. The Euler and MacNeish Conjectures


    6.1.5 Show that any set of $n - 2$ MOLS(n) can be extended to a complete set of
    MOLS(n).


    # 6.2 The Euler and MacNeish Conjectures


    As mentioned in Section 5.1, in 1782 Euler considered the problem of finding two
    orthogonal latin squares of order 6. At that time he made the following conjecture.


    **The Euler Conjecture** A pair of orthogonal latin squares of order $n$ exists
    and only if $n \equiv 0$, 1, or 3 (mod 4).


    Euler made this conjecture because he was able to construct a pair of orthogonal
    latin squares of every order $n \equiv 0, 1$, or 3 (mod 4) and was *not* able
    to construct such a pair for any $n \equiv 2$ (mod 4).


    In 1900 G. Tarry [29] proved that there did not exist a pair of orthogonal latin
    squares of order 6. (Tarry used brute force. For a nonbrute proof see Doug Stinson
    [28]).


    In 1922 H. MacNeish [20] made the following conjecture.


    **The MacNeish Conjecture** Let $n = p_1^{f_1} p_2^{f_2} \cdots p_k^{f_k}$, where
    each of $p_1, p_2, p_3, \dots, p_k$ is a distinct prime. The maximum number of
    MOLS(n) is $m(n) = \min[p_1^{f_1}, p_2^{f_2}, p_3^{f_3}, \dots, p_k^{f_k}] - 1$.


    Clearly the Euler Conjecture is a special case of the MacNeish Conjecture, since
    if $n\equiv2$ (mod 4), $n=2 \cdot p_2^{f_2} p_3^{f_3} \cdots p_k^{f_k}$, and so
    $m(n) = \min[2, p_2^{f_2}, p_3^{f_3}, \dots, p_k^{f_k}] - 1 = 2 - 1 = 1$.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_141_0.png)


    Figure 6.5: The Euler Conjecture is a subcase of the MacNeish Conjecture.


    MacNeish had a very good reason for this conjecture. He found a *finite field
    construction* and a *direct product construction* which enabled him to construct
    $m(n)$ MOLS(n) for every $n$. (Finite fields had not been invented in Euler’s
    day.)'
