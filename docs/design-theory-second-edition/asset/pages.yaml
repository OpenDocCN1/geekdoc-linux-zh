  md: '# 1. Steiner Triple Systems


    The complete graph of order $v$, denoted by $K_v$, is the graph with $v$ vertices
    in which each pair of vertices is joined by an edge. For example, $K_7$ is shown
    in Figure 1.2.


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_20_0.png)


    Figure 1.2: The complete graph $K_7$.


    A Steiner triple system $(S, T)$ can be represented graphically as follows. Each
    symbol in $S$ is represented by a vertex, and each triple $\{a, b, c\}$ is represented
    by a triangle joining the vertices $a$, $b$ and $c$. Since each pair of symbols
    occurs in exactly one triangle in $T$, each edge belongs to exactly one triangle.
    Therefore a Steiner triple system $(S, T)$ is equivalent to a complete graph $K_{|S|}$
    in which the edges have been partitioned into triangles (corresponding to the
    triples in $T$).


    ![](img/7466d3cbff5ac3a5a3e2edbaf1652aba_20_1.png)


    Figure 1.3: Equivalence between a Steiner triple system and a decomposition of
    $K_n$ into triangles.'
