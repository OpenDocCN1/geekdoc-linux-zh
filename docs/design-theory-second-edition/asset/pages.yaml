    exists SQS($w$).


    Furthermore, SQS($w$) can be constructed which contains SQS(8) except $w \in \{1,
    2, 4, 10, 14\}$.


    Proof. There exists an SQS(w) for each $w \in \{1, 2, 4\}$. The cases $w = 8,
    10$ and $14$ are handled in Examples 10.1.3, 10.1.4 and 10.1.5. For each $w \in
    \{16, 20, 28, 32\}$, the $2v$ Construction produces an SQS($w$) containing SQS(8)
    (see Theorem 10.2.1). SQS(22) containing an SQS($v=8$) is produced by $(3v - 2)$
    Construction (see Exercise 10.2.7). If $w = 26, 34$ or $38$ then an SQS($w$) containing
    SQS(8) is constructed in Examples 10.4.13, 10.4.14 (see Exercise 10.4.17 or 10.4.22
    respectively).


    The remaining values of $w$ are handled inductively, so assume that for some $r
    \ge 40, r \equiv 2$ or $4 \pmod 6$, and for all $16 \le w < r$ there exists an
    SQS($w$) containing SQS(8) that we have already constructed SQS($w$)''s containing
