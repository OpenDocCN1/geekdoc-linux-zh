  md: '# # Intersections of Steiner Triple Systems


    # ## 8.1 Teirlinck’s Algorithm


    Two Steiner triple systems $(S, T_1)$ and $(S, T_2)$ are said to be disjoint provided
    $T_1 \cap T_2 = \emptyset$; i.e., they have no triples in common.


    **Example 8.1.1** Two disjoint $STS(7)$s. Let $S=\{1, 2, 3, 4, 5, 6, 7\}$ and


    $T_1 = \begin{pmatrix} 1 & 2 & 4 \ 2 & 3 & 5 \ 3 & 4 & 6 \ 4 & 5 & 7 \ 5 & 6 &
    1 \ 6 & 7 & 2 \ 7 & 1 & 3 \end{pmatrix} T_2 = \begin{pmatrix} 1 & 2 & 5 \ 2 &
    4 & 6 \ \dots & ... \end{pmatrix}$


    Let $(S, T)$ be a Steiner triple system and let $\alpha$ be a permutation on $S$;
    i.e., $a-1$ mapping of $S$ onto $S$. Let $T\alpha = \{xa, ya, za\} \mid (x, y,
    z) \in T\}$. Then $(S, \alpha)$ is a Steiner triple system and is said to be isomorphic
    to $(S, T)$. The $\alpha$ is called an isomorphism. In 1977 Luc Teirlinck [30]
    proved that every Steiner triple system has an isomorphic disjoint mate.


    **Example 8.1.2** The Steiner triple system $(S, T_1)$ in Example 8.1.1 is the
    isomorphic mate $T\alpha = \begin{smallmatrix} 1 & 2 & 3 & 4 & 5 & 6 & 7 \ 1 &
    2 & 4 & 5 & 6 & 7 & 3 \end{smallmatrix}\rangle$.


    In what follows we will give an algorithm which will construct $\alpha$ as a product
    of transpositions; i.e., permutations that interchange 2 elements and fix the
    remaining elements. We will denote the transposition that interchanges $a$ and
    $b$ by $(ab)$. Let $(S, T_1)$ and $(S, T_2)$ be any two Steiner triple systems
    of order $n$ and let $\{c, d, e\} \in T_1 \cap T_2$. Further let


    ```

    $A(c) = \{a \mid (a, x, y) \in T_1 \text{ and } \{c, x, y\} \in T_2 \setminus
    \{c, d, e\},\\nB(c) = \{b \mid (b, z, w) \in T_2 \text{ and } \{c, z, w\} \in
    T_1 \setminus \{c, d, e\}$

    ```


    Define the spread of $c$ with respect to $\{c, d, e\}$ as $S(c) = \{c, d, e\}
    \cup A(c) \cup B(c)$, where $t = (n-3)/2$.'
