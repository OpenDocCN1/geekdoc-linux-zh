    **v = 43**: For this construction, we intend a special PBD that is a fundamental
    "building block" in many constructions in Design Theory. A group divisible design
    $(P, G, B)$ where $P$ is a finite set, $G$ is a collection of sets which partition
    $P$, and $B$ is a set of subsets called $blocks$ of $P$, such that $(P, G \cup
    B)$ is a PBD. The number $|P|$ is the order of the group divisible design.


    A group divisible design is a PBD with a distinguished set of blocks, called groups,
    all groups of the same size, say $k$. If a group divisible design has all groups
    of the same size, then we will refer to this as a GDD$(v, k)$.


