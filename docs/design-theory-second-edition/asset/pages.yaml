    # 8.2 The general intersection problem


    Now we know that there exists a pair of disjoint triple systems of order $n =
    1$ or $3 \pmod 6$ the following problem is immediate: For every $n$ does there
    exist a pair of STS(n), $(S, T_1)$ and $(S, T_2)$ such that $|T_1 \cap T_2| =
    x$? We give a complete solution of this problem in section.


    Clearly, since $S$ contains $n(n-1)/6$ triples, a necessary condition for a pair
    of STS(n) to have $x$ triples in $x \in \{0, 1, 2, \dots, n(n-1)/6\}$. As we shall
    see, this is not quite sufficient.


    *A partial triple system is a pair $(S, P)$ where $P$ is a collection of triples
    with the property that every element of distinct elements of $S$ belongs to *at
    most* one triple of $P$. Two triple systems $(S, P_1)$ and $(S, P_2)$ are said
    to be *balanced* provided $P_1$ and $P_2$ cover the *same pairs* (or edges in
    graph theory vernacular).'
