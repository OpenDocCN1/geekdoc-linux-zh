    g'')$, and hence a 1-factorization of $G(D'', g'')$. If $d'' < g''/2$ then it
    remains to color the edges $\{u, u-d''\}$ for each $u \in A$; but these can be
    colored with a new color $2k+2$. Then we have a proper $\Delta = (2k+2)$-edge-coloring
    of $G(D'', g'')$.


