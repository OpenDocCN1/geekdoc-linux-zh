    # 7.4 Windows Privilege Escalation Techniques


    Windows privilege escalation techniques involve gaining higher levels of access
    on Windows systems. Attackers aim to elevate their privileges to perform unauthorized
    actions, access sensitive data, and compromise the system further. Ethical hackers
    use these techniques to uncover vulnerabilities and help organizations enhance
    their security measures. Here''s an overview of Windows privilege escalation techniques:


    ### 1. Weak User Passwords

    - Exploiting weak or easily guessable passwords to gain unauthorized access.

    - Attackers may use brute-force attacks or password cracking tools.


    ### 2. Credential Harvesting

    - Harvesting credentials from memory, registry, or saved files.

    - Attackers can use tools like `Mimikatz` to extract passwords.


    ### 3. Exploiting Misconfigured Services

    - Services running with elevated privileges might have misconfigurations.

    - Attackers can exploit these to escalate privileges.


    ### 4. Exploiting Unpatched Vulnerabilities

    - Exploiting known vulnerabilities in Windows components or applications.

    - Attacking outdated software that hasn''t received security updates.


    ### 5. Exploiting Insecure Registry Permissions

    - Manipulating Windows registry keys and values with weak or misconfigured permissions.

    - Attackers may change settings to gain higher privileges.


    ### 6. DLL Hijacking and Hijacking Services

    - Exploiting weak permissions and loading malicious `DLLs` to escalate privileges.

    - Hijacking services can allow attackers to run arbitrary code with system privileges.


    ### 7. Exploiting Scheduled Tasks

    - Identifying vulnerable scheduled tasks to execute malicious code.

    - Attackers may modify these tasks to gain elevated access.


    ### 8. Exploiting Insecure File/Folder Permissions

    - Gaining unauthorized access to files or folders due to misconfigured permissions.

    - Attackers can manipulate sensitive files to escalate privileges.


    ### 9. Exploiting Weak Group Policy Settings

    - Exploiting Group Policy misconfigurations that grant unnecessary privileges.

    - Attackers can modify `Group Policy` settings to their advantage.


    ### 10. Privilege Escalation Exploits

    - Using vulnerabilities or exploits to escalate privileges on the system.

    - Attackers look for unpatched vulnerabilities or zero-day exploits.


    ### 11. Privilege Escalation through User Account Control (UAC)

    - Exploiting `UAC` bypass techniques to escalate privileges.

    - Attackers may trick users into granting administrative permissions.


    ### 12. Impersonation and Lateral Movement

    - Gaining higher privileges on other systems after compromising one.

    - Using credentials acquired from one system to target others.


    ### 13. Metasploit Modules

    - Metasploit provides post-exploitation modules for Windows privilege escalation.

    - Ethical hackers can use these modules to demonstrate vulnerabilities.


    ### 14. Detection and Prevention

    - Regularly update and patch Windows systems to mitigate known vulnerabilities.

    - Use endpoint protection tools to detect and prevent privilege escalation attempts.


    ### 15. Ethical Use

    - Ethical hackers use Windows privilege escalation techniques to uncover security
    weaknesses and improve defenses.

    - Always obtain proper authorization and adhere to ethical guidelines.


    Windows privilege escalation techniques emphasize the importance of securing Windows
    environments and implementing proper access controls. Ethical hackers contribute
    by identifying and mitigating these vulnerabilities, helping organizations maintain
    a more secure computing environment.


    # 7.5 Exploiting Active Directory and Domain Escalation


    Exploiting Active Directory (`AD`) and domain escalation are advanced techniques
    used by attackers to gain unauthorized access to an organization''s network and
    escalate their privileges within the domain. Ethical hackers study and employ
    these techniques to identify vulnerabilities and help organizations strengthen
    their Active Directory security. Here''s an overview of exploiting Active Directory
    and domain escalation:


    ### 1. Active Directory Overview

    - Active Directory is Microsoft''s directory service used for managing users,
    groups, and resources in a network.

    - It plays a central role in managing access and permissions within a Windows
    domain.


    ### 2. Attacking Active Directory

    - Attackers target vulnerabilities and misconfigurations in `AD` to gain unauthorized
    access.

    - They can exploit weak permissions, unpatched systems, and insecure configurations.


    ### 3. Privilege Escalation within Active Directory

    - Attackers aim to escalate their privileges within the `AD` environment.

    - This involves gaining higher access levels, such as moving from a user to an
    administrator.


    ### 4. Domain Escalation Techniques

    - Kerberoasting: Exploiting weak service accounts to crack service ticket encryption
    and extract credentials.

    - Pass-the-Ticket (`PtT`): Using stolen Kerberos tickets to authenticate and gain
    unauthorized access.

    - Golden Ticket: Forging Kerberos tickets to create a ticket-granting ticket (`TGT`)
    for any user.

    - Silver Ticket: Forging service tickets for specific services needing the user''s
    password.


    ### 5. Abusing Trust Relationships

    - Exploiting trust relationships between domains to escalate privileges.

    - Attackers target weaker, less-secure domains to pivot to more critical ones.


    ### 6. Abusing Group Policies

    - Group Policy Objects (`GPOs`) control various aspects of a domain''s security
    and configuration.

    - Attackers can exploit misconfigured or weak `GPO` settings for privilege escalation.


    ### 7. BloodHound

    - BloodHound is a tool used for analyzing and visualizing Active Directory relationships.

    - Ethical hackers use it to identify paths to domain escalation and recommend
    mitigations.


    ### 8. Mimikatz and Active Directory Exploitation

    - `Mimikatz` is a powerful tool for extracting credentials and performing various
    AD attacks.

    - It can be used to dump plaintext passwords, perform Kerberos attacks, and more.


    ### 9. Detecting and Preventing Domain Escalation

    - Monitor and analyze event logs for signs of unusual activity, such as privilege
    escalation attempts.

    - Implement strong password policies and multi-factor authentication to mitigate
    credential theft.


    ### 10. Ethical Use

    - Ethical hackers study and utilize AD exploitation techniques to identify weaknesses
    and recommend improvements.

    - Always obtain proper authorization and adhere to ethical guidelines.


    # 7.6 Avoiding Detection and Covering Tracks

