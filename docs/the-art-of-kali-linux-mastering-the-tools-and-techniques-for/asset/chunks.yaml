    of strong password policies and secure hashing methods. Organizations should prioritize
    measures that deter attackers from easily recovering passwords from hashes.


    # 11.6 Defending Against Password Attacks


    Defending against password attacks is essential to ensure the security of accounts
    and systems. Ethical hackers focus on understanding these attacks to help organizations
    implement effective defenses.


    ### 1. Strong Password Policies

    - **Complexity Requirements**: Enforce policies that mandate the use of uppercase
    letters, lowercase letters, numbers, and special characters in passwords.

    - **Minimum Length**: Set a minimum password length to prevent the use of short
    and easily guessable passwords.


    ### 2. Password Expiry and Rotation

    - **Regular Changes**: Require users to change passwords periodically to minimize
    the exposure time of any compromised passwords.

    - **Avoid Frequent Changes**: Balance the need for password changes with user
    convenience to discourage predictable patterns.


    ### 3. Multi-Factor Authentication (MFA)

    - **Implement MFA**: Require users to provide multiple forms of authentication
    beyond just a password, such as a fingerprint or a one-time code.


    ### 4. Account Lockouts and Delays

    - **Failed Attempts**: Implement temporary or permanent account lockouts after
    a specified number of failed login attempts.

