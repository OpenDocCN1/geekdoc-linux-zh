    ●     fg: Bring a background process to the foreground.


    ●     bg: Send a process to the background.


    4\. Pausing and Resuming Processes:


    ●     Ctrl + Z: Pause a foreground process.


    ●     bg %job_number: Resume a paused process in the background.


    5\. Job Control:


    ●     jobs: List background and suspended jobs.


    ●     fg %job_number: Bring a background job to the foreground.


    ●     bg %job_number: Resume a suspended job in the background.


    6\. Monitoring System Resources:


    ● top or htop: Monitor CPU and memory usage, and list running processes in real
    time.


    ●     vmstat: Display virtual memory statistics.


    ●     iostat: Display I/O statistics.


    7\. Prioritizing Processes:


    ● nice command: Run a command with a specified priority level.


    ● renice priority process_id: Change the priority of a running process.


    8\. Process Tracing:


    ● strace command: Trace system calls and signals made by a command.


    ●     ltrace command: Trace library calls made by a command.


    9\. Process Signals:


    ● kill -signal process_id: Send a specific signal to a process (e.g., kill -9
    process_id to forcefully terminate).


    10\. Controlling Process Affinity:


    ● taskset: Set or retrieve the CPU affinity of a process.


    ●     chrt: Manipulate process scheduling attributes.


    11\. System Monitoring and Logging:


    ●     dmesg: Display kernel ring buffer messages.


    ●     journalctl: Query the systemd journal for system logs.


    12\. Background and Daemon Processes:


    ● Append & to the end of a command to run it in the background.


    ● Use nohup command & to run a command that persists after logout.


    13\. Process Information:


    ●     /proc: A virtual filesystem that provides information about processes.


    Process management and control are essential for maintaining system stability,
    diagnosing issues, and ensuring optimal performance. By mastering these skills,
    you''ll be able to effectively manage processes, troubleshoot problems, and maintain
    the security and reliability of Linux systems.


    # 3.5 User and Group Management'
