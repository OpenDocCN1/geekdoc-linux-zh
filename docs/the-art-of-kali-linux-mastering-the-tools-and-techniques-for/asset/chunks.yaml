    ## 7. Viewing and Searching


    - `less` or `more`: Display the contents of a file one page at a time.

    - `head`: Display the beginning of a file.

    - `tail`: Display the end of a file.

    - `grep`: Search for a pattern in files.

    - `find`: Search for files and directories.


    ## 8. Permissions


    - `chmod`: Change file permissions.

    - `chown`: Change file ownership.


    ## 9. Process Management


    - `ps`: List running processes.

    - `kill`: Terminate processes.

    - `top` or `htop`: Monitor system processes in real time.


    ## 10. Networking


    - `ping`: Test network connectivity.

    - `ifconfig` or `ip`: Display and configure network interfaces.

    - `netstat`: Display network statistics.


    ## 11. System Information


    - `uname`: Display system information.

    - `free`: Display memory usage.

    - `df`: Display disk space usage.


    ## 12. Package Management


    - `apt` or `yum`: Package managers for installing and managing software packages.


    ## 13. Wildcards and Globbing


    - `*`: Matches any characters.

    - `?`: Matches a single character.

    - `[]`: Matches a range of characters.


    ## 14. Redirection and Pipes


    - `>`: Redirect command output to a file.

    - `>>`: Append command output to a file.

    - `|`: Pipe output of one command as input to another.


    Mastering command-line fundamentals empowers you to efficiently manage and navigate
    a Linux system. These skills are essential for conducting tasks ranging from basic
    system administration to more complex cybersecurity tasks like penetration testing
    and forensic analysis. As you become more proficient, you''ll find that the command
    line is an indispensable tool in your toolkit.


    # 3.3 Working with Files and Directories


    Working with files and directories is a fundamental skill when using a Linux command-line
    interface. Ethical hackers and cybersecurity professionals often need to manipulate
    files, analyze their content, and manage directory structures. Here''s a comprehensive
    overview of working with files and directories:


    ### 1. Creating Files and Directories


    - `mkdir directory_name`: Create a new directory.

    - `touch file_name`: Create a new empty file.


    ### 2. Copying Files and Directories


    - `cp source destination`: Copy a file or directory.

    - `cp -r source_directory destination_directory`: Copy directories recursively.


    ### 3. Moving or Renaming Files and Directories


    - `mv source destination`: Move or rename a file or directory.


    ### 4. Deleting Files and Directories


    - `rm file_name`: Remove a file.

    - `rm -r directory_name`: Remove a directory and its contents (use with caution).

    - `rm -rf directory_name`: Force-remove a directory and its contents without confirmation
    (use with extreme caution).


    ### 5. Viewing File Contents


    - `cat file_name`: Display the entire contents of a file.

    - `less file_name`: Display file contents one page at a time (use arrow keys to
    navigate).


    ### 6. Displaying Part of a File


    - `head file_name`: Display the beginning of a file.

    - `tail file_name`: Display the end of a file.


    ### 7. Searching for Text in Files


    - `grep pattern file_name`: Search for a specific pattern in a file.

    - `grep -r pattern directory_name`: Search for a pattern recursively in a directory.


    ### 8. Editing Files


    - `nano file_name` or `vim file_name`: Open a text editor to edit a file.

    - Save changes with appropriate commands (usually `Ctrl + O` for `nano`, `:w`
    for `vim`).


    ### 9. Permissions and Ownership


    - `chmod permissions file_name`: Change file permissions (e.g., `chmod 755 file_name`).

    - `chown new_owner:new_group file_name`: Change file ownership (e.g., `chown user:group
    file_name`).


    ### 10. File Compression and Archiving


    - `tar -cvf archive_name.tar files`: Create a tar archive.

    - `tar -xvf archive_name.tar`: Extract files from a tar archive.

    - `gzip file_name`: Compress a file using gzip.


    ### 11. File Inspection


    - `file file_name`: Display file type and other information.


    ### 12. File and Directory Size


    - `du -h file_name`: Display the size of a file or directory in human-readable
    format.

    - `df -h`: Display disk usage.


    ### 13. Permissions


    - `ls -l`: List files with detailed permissions.

    - `chmod`: Change permissions.


    ### 14. Ownership


    - `ls -l`: List files with detailed ownership.

    - `chown`: Change ownership.


    # 3.4 Process Management and Control


    Process management and control are essential for maintaining system stability,
    diagnosing issues, and ensuring optimal performance. Here''s a comprehensive overview:


    ### 1. Listing Running Processes


    - `ps`: List running processes.

    - `ps aux`: List all processes with detailed information.

    - `top`: Monitor processes in real time.


    ### 2. Killing Processes


    - `kill process_id`: Terminate a process with its ID.

    - `killall name`: Terminate all instances of a process.


    ### 3. Background and Foreground Execution


    - Append `&` to the end of a command to run it in the background.

    - `fg`: Bring a background process to the foreground.

    - `bg`: Send a process to the background.


    ### 4. Pausing and Resuming Processes


    - `Ctrl + Z`: Pause a foreground process.

    - `bg %job_number`: Resume a paused process in the background.


    ### 5. Job Control


    - `jobs`: List background and suspended jobs.

    - `fg %job_number`: Bring a background job to the foreground.

    - `bg %job_number`: Resume a suspended job in the background.


    ### 6. Monitoring System Resources


    - `top` or `htop`: Monitor CPU and memory usage.

    - `vmstat`: Display virtual memory statistics.

    - `iostat`: Display I/O statistics.


    ### 7. Prioritizing Processes


    - `nice`: Run a command with a specified priority level.

    - `renice process_id`: Change the priority of a running process.


    ### 8. Process Tracing


    - `strace`: Trace system calls and signals made by a command.

    - `ltrace`: Trace library calls made by a command.


    ### 9. Process Signals


    - `kill -signal process_id`: Send a specific signal to a process (e.g., `kill
    -9 process_id` to forcefully terminate).


    ### 10. Controlling Process Affinity


    - `taskset`: Set or retrieve the CPU affinity of a process.

    - `chrt`: Manipulate process scheduling attributes.


    ### 11. System Monitoring and Logging


    - `dmesg`: Display kernel ring buffer messages.

    - `journalctl`: Query the systemd journal for system logs.


    ### 12. Background and Daemon Processes


    - Append `&` to the end of a command to run it in the background.

    - Use `nohup command &` to run a command that persists after logout.


    ### 13. Process Information


    - `/proc`: A virtual filesystem that provides information about processes.


    Process management and control are essential for maintaining system stability,
    diagnosing issues, and ensuring optimal performance. By mastering these skills,
    you''ll be able to effectively manage processes, troubleshoot problems, and maintain
    the security and reliability of Linux systems.


