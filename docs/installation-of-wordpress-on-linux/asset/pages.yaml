- img_proc: true
  md: '# # Jesse Dhammu blog

    Just another WordPress weblog


    To set up your Weblog with wordpress, first of all you will need to download the
    source files of wordpress blog software from the link http://www.wordpress.org
    XAMPP for Linux (Download it from- http://www.apachefriends.org/en/xampp-linux.html


    **Save the following three files on your Desktop.**


    +   1. xampp-linux-1.7.1.tar.gz

    2. wordpress-2.9.2.tar.gz


    **First of all install XAMPP on the P.C. by CLI.****


    Install XAMPP by extracting its content in a folder named "opt", this folder is
    located at the root of the file system.


    +   1. Open the **Terminal**, enter the following command:


    ```

    jesse@Punjabij ~ $ sudo tar -zxvf /home/jesse/Desktop/xampp-linux-1.7.1.tar.gz
    -C /opt/

    ```


    (Please note here jesse is my user name so you must enter the name of the user
    on which you are currently logged in).'
  merge: -1
  pgno: 0
- img_proc: true
  md: '![](img/f510d08fe53c65ebaa1a32d935781b34_1_0.png)


    Press enter after giving this command now it will prompt you for your Password,
    give your user login password and press enter.

    This command will extract all the files on Xampp into your /opt/ directory.'
  merge: -1
  pgno: 1
- img_proc: true
  md: '![](img/f510d08fe53c65ebaa1a32d935781b34_2_0.png)


    Now all the files have been extracted. So, we can Start XAMPP


    +   1. Open the **Terminal**, enter the following command:


    ```

    sudo /opt/lampp/lampp start

    ```


    The following lines will appear on your Terminal, if everything is done correctly:


    XAMPP: Starting Apache with SSL (and PHP5)...

    XAMPP: Starting MySQL...

    XAMPP: Starting ProFTPD...

    XAMPP for Linux started.'
  merge: -1
  pgno: 2
