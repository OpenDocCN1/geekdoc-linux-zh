  md: '# WordPress - Mozilla Firefox


    There doesnt seem to be a vp-config.php file. I need this before we can get started.
    Need more help? We got you. You can create a vp-config.php file through a web
    interface, but this doesn''t work for all servers. The safest way is to manually
    create the file.


    Create a Configuration File


    Next screen will appear to you. Read the details and click lets go.


    # WordPress Setup Configuration File - Mozilla Firefox


    Welcome to WordPress. Before getting started, we need some information on the
    database. You will need to know the following items before proceeding.


    +   1. Database name

    2. Database username

    3. Database password

    4. Database host

    5. Table prefix (if you want to run more than one in a single database)


    If for any reason this automatic file creation doesn''t work, don''t worry. All
    this fills in the database information to a configuration file. You may simply
    open wp-config-sample.php in a text editor, fill in your information, and save
    it as wp-config.php.


    In any case, these items were supplied to you by your Web Host. If you do not
    have this information, you will need to contact them before you can continue.
    If you''re already...


    Let''s go!'
  merge: -1
  pgno: 13
