    # WordPress > Setup Configuration File - Mozilla Firefox


    Below you should enter your database connection details. If you''re not sure,
    contact your host.


    | Database Name | wordpress | The name of the database you want to run WP in.
    |

    |---|---|-|

    | User Name | jesse | Your MySQL username |

    | Password | dhammu | ...and MySQL password. |

    | Database Host | localhost | 99% chance you won''t need to change this value.
    |

