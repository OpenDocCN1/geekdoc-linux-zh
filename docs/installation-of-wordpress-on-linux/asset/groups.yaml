- md: "\n# Jesse Dhammu blog\nJust another WordPress weblog\n\nTo set up your Weblog\
    \ with wordpress, first of all you will need to download the source files of wordpress\
    \ blog software from the link http://www.wordpress.org. XAMPP for Linux (Download\
    \ it from- http://www.apachefriends.org/en/xampp-linux.html)\n\n**Save the following\
    \ three files on your Desktop.**\n\n- 1. xampp-linux-1.7.1.tar.gz\n- 2. wordpress-2.9.2.tar.gz\n\
    \n**First of all install XAMPP on the P.C. by CLI.**\n\nInstall XAMPP by extracting\
    \ its content in a folder named \"opt\", this folder is located at the root of\
    \ the file system.\n\n- 1. Open the **Terminal**, enter the following command:\n\
    \n```\njesse@Punjabij ~ $ sudo tar -zxvf /home/jesse/Desktop/xampp-linux-1.7.1.tar.gz\
    \ -C /opt/\n```\n\n(Please note here jesse is my user name so you must enter the\
    \ name of the user on which you are currently logged in).\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_1_0.png)\n\
    \nPress enter after giving this command now it will prompt you for your Password,\
    \ give your user login password and press enter.\nThis command will extract all\
    \ the files on Xampp into your /opt/ directory.\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_2_0.png)\n\
    \nNow all the files have been extracted. So, we can Start XAMPP\n\n- 1. Open the\
    \ **Terminal**, enter the following command:\n\n```\nsudo /opt/lampp/lampp start\n\
    ```\n\nThe following lines will appear on your Terminal, if everything is done\
    \ correctly:\n\nXAMPP: Starting Apache with SSL (and PHP5)...\nXAMPP: Starting\
    \ MySQL...\nXAMPP: Starting ProFTPD...\nXAMPP for Linux started.\n\n# Now test\
    \ your XAMPP installation\n\n- 1. Open web browser.\n- 2. Enter the following\
    \ address:\n\nhttp://localhost\n\nIt should show the following page:\n\n# # XAMPP\
    \ for Linux 1.7.1 - Mozilla Firefox\n\nWelcome to XAMPP for Linux 1.7.1\n\nCongratulations\n\
    nYou successfully installed XAMPP on this system!\n\nNow you can start using Apache\
    \ and MySQL. Firstly you should click on ~Status~ on the left navigation to make\
    \ sure everything works fine.\n\nIf you want to start programming PHP or Perl\
    \ (or whatever) please take a look at the XAMPP manual first and get more information\
    \ about your XAMPP\n\nGood luck,\nKai \"Oswald\" Seidler + Kay Vegelong\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_4_0.png)\n\
    \nClick the Status link to see what's running:\n\n# # XAMPP for Linux 1.7.1 -\
    \ Mozilla Firefox\n\n## XAMPP Status\nThis page offers you one view all information\
    \ about what's running and what's not.\n\n| Component | Status | Hint |\n| ---\
    \ | --- | --- |\n| MySQL database | ACTIVATED | |\n| PHP | ACTIVATED | |\n| Common\
    \ Gateway Interface (CGI) | ACTIVATED | |\n| Server Side Includes (SSI) | ACTIVATED\
    \ | |\n| PHP extension -validator | DEACTIVATED | FAQ |\n| PHP extension -OCIB/Oracle\
    \ | DEACTIVATED | FAQ |\n\nSome changes to the configuration may cause false negative\
    \ status reports.\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_5_0.png)\n\nIf it\
    \ appears like this, then you're on the right track.\n\nNow click on \"phpmyadmin\"\
    \ which is listed under Tools. And here create a database named wordpress\n\n\
    Now extract the wordpress files in the directory /opt/lamp/htdocs/ with this command\n\
    \n```\njesse@Punjabizm / $ sudo tar -xzvf /home/jesse/Downloads/wordpress-2.9.2.tar.gz\
    \ -C /opt/lampp/htdocs/\n```\n\n```\nwordpress/wp-content/themes/default/single.php\n\
    wordpress/wp-content/themes/default/search.php\nwordpress/wp-content/themes/default/comment.php\n\
    wordpress/wp-content/themes/default/archive.php\nwordpress/wp-content/themes/default/page.php\n\
    wordpress/wp-content/themes/default/footer.php\nwordpress/wp-content/themes/default/sidebar.php\n\
    wordpress/wp-content/themes/default/style.css\nwordpress/wp-content/themes/default/attachment.php\n\
    wordpress/wp-content/themes/default/links.php\nwordpress/wp-content/themes/default/track.css\n\
    wordpress/wp-cron.php\nwordpress/wp-feed.php\nwordpress/index.php\njessampunjabi\
    \ ~ $ sudo tar -xzvf /home/Downloads/wordpress-2.9.2.tar.gz\ncd /opt/lammps/htdocs/\n\
    ```\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_6_0.png)\n\nThis will create a\
    \ folder wordpress in htdocs directory.\nNow open your web browser and browse\
    \ the url http://localhost/phpmyadmin\nThis will show the following page on the\
    \ screen\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_7_0.png)\n\nCrate a new database\
    \ base named wordpress by filling the database name in the input box and then\
    \ press create. After Database is created, press home.\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_8_0.png)\n\
    \nWhen you are at home page go to privileges, and there click on add new user.\n\
    \nHere in this add user screen, fill up the required fields like username, Database\
    \ name and password.\n\nThis part is done now scroll down the screen and press\
    \ go button at the bottom of the page.\nNext screen will appear, now scroll down\
    \ a little and select wordpress from the dropdown list.\n\n# localhost | localhost\
    \ | phpMyAdmin 3.1.1.3 - Mozilla Firefox\n\n- cicol (1)\n- drupal (6)\n- information_schema\
    \ (28)\n- joomla (36)\n- mysql (9)\n- phpmyadmin (8)\n- wordpress\n\nPlease select\
    \ a database\n\nDatabase-specific privileges\n\nDatabase Privileges Grant Table-specific\
    \ privileges Action\n\nAdd privileges on the following database: \n\nChange password:\n\
    \nPassword:\n\nPassword Hashing:\n\nAnd then moving down the screen, click on\
    \ check all in Global privileges so that all the check box will be tick marked\
    \ as shown in screen shot.\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_11_0.png)\n\
    \nNow press go. So you have successfully added a new user and have given the privileges\
    \ to that user, next you can open the url http://localhost/wordpress\nThis screen\
    \ will appear. Here click on \"Create a Configuration file\"\n\n# WordPress -\
    \ Mozilla Firefox\n\nThere doesnt seem to be a wp-config.php. I need this before\
    \ we can start.\n\nCreate a Configuration file\n\n# WordPress - Mozilla Firefox\n\
    \nWelcome to WordPress. Before getting started, we need some information. You\
    \ will need to know the following items:\n\n- 1. Database name\n- 2. Database\
    \ username\n- 3. Database password\n- 4. Database host\n- 5. Table Prefix (if\
    \ you want to run multiple WordPress installations in a single database)\n\nIn\
    \ any case, these items were supplied to you by your Web Host. If you do not have\
    \ this information, you will need to contact them before you can continue. Let's\
    \ go!\n\n# Setup Configuration File\n\nHere if the browser gives some error about\
    \ write permissions Don't be afraid, just open your terminal, and change the permissions\
    \ of /opt/lampp/htdocs/ by:\njesse@Punjabizm / $ sudo chmod 777 /opt/lampp/htdocs/wordpress/\n\
    \n![](img/f510d08fe53c65ebaa1a32d935781b34_14_0.png)\n\nok now..\n\nAfter clicking\
    \ on Let's go button, a database setup screen will come. There you need to fill\
    \ up your information like user name which you have given while creating database\
    \ in Xampp, and password, localhost\n\n# Configuration File\n\nBelow you should\
    \ enter your database connection details. If you're not sure, contact your host.\n\
    \n| Database Name | wordpress | The name of the database you want to run WP in.\
    \ |\n|---|---|---|\n| User Name | jesse | Your MySQL username |\n| Password |\
    \ dhammu | ...and MySQL password. |\n| Database Host | localhost | 99% chance\
    \ you won't need to change this value. |\n| Table Prefix | wp_ | If you want to\
    \ run multiple WordPress reinstallations in a single database, change this. |\n\
    \nAfter filling up the information, click on submit. In the next screen, Press\
    \ “Run the Install”.\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_16_0.png)\n\n\
    In Next welcome screen, fill up your Blog Title and your E-Mail address, the blog\
    \ title will appear on your Main page, then click install wordpress.\n"
  mdcn: "\n\n# Jesse Dhammu 博客\n另一个 WordPress 网络博客\n\n要用使用 wordpress 建立你的网络博客，首先你需要从链接\
    \ http://www.wordpress.org 下载 wordpress 博客软件的源码文件。Linux 版 XAMPP（在此处下载 - http://www.apachefriends.org/en/xampp-linux.html）\n\
    \n**将以下三个文件保存到桌面上。**\n\n- 1. xampp-linux-1.7.1.tar.gz\n- 2. wordpress-2.9.2.tar.gz\n\
    \n**首先，通过命令行 (CLI) 在电脑上安装 XAMPP。**\n\n通过将它的内容解压到名为 \"opt\" 的文件夹中安装 XAMPP，该文件夹位于文件系统的根目录下。\n\
    \n- 1. 打开**终端 (Terminal)**，输入以下命令：\n\n```\njesse@Punjabij ~ $ sudo tar -zxvf /home/jesse/Desktop/xampp-linux-1.7.1.tar.gz\
    \ -C /opt/\n```\n\n（请注意，这里的 jesse 是我的用户名，你必须输入当前登录的用户用户名）。\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_1_0.png)\n\
    \n输入此命令后按回车，现在会提示你输入密码，输入用户登录密码并按回车。\n此命令会将 Xampp 的所有文件解压到你的 /opt/ 目录。\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_2_0.png)\n\
    \n现在所有文件已解压。我们可以启动 XAMPP 了。\n\n- 1. 打开**终端 (Terminal)**，输入以下命令：\n\n```\nsudo /opt/lampp/lampp\
    \ start\n```\n\n如果一切操作正确，你的终端将显示以下几行：\n\nXAMPP: Starting Apache with SSL (and\
    \ PHP5)...\nXAMPP: Starting MySQL...\nXAMPP: Starting ProFTPD...\nXAMPP for Linux\
    \ started.\n\n# 现在测试你的 XAMPP 安装\n\n- 1. 打开浏览器。\n- 2. 输入以下地址：\n\nhttp://localhost\n\
    \n它应该显示以下页面：\n\n# # XAMPP for Linux 1.7.1 - Mozilla Firefox\n\n欢迎使用 XAMPP for\
    \ Linux 1.7.1\n\n恭喜\n你已成功在该系统上安装了 XAMPP！\n\n现在你可以开始使用 Apache 和 MySQL 了。首先，你应该点击左侧导航中的\
    \ ~Status (状态)”以确保一切运行正常。\n\n如果你想开始编写 PHP 或 Perl（或其他语言），请先查看 XAMPP 手册并获取有关你 XAMPP\
    \ 的更多信息\n\n祝你好运，\nKai \"Oswald\" Seidler + Kay Vegelong\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_4_0.png)\n\
    \n点击 Status 链接查看正在运行的内容：\n\n# # XAMPP for Linux 1.7.1 - Mozilla Firefox\n\n##\
    \ XAMPP 状态\n此页面为你提供关于正在运行和未运行内容的所有信息视图。\n\n| 组件 | 状态 | 提示 |\n| --- | --- | ---\
    \ |\n| MySQL 数据库 | 已激活 (ACTIVATED) | |\n| PHP | 已激活 (ACTIVATED) | |\n| 共同网关接口\
    \ (CGI) | 已激活 (ACTIVATED) | |\n| 服务器端包含 (SSI) | 已激活 (ACTIVATED) | |\n| PHP 扩展\
    \ - validator | 未激活 (DEACTIVATED) | FAQ |\n| PHP 扩展 - OCIB/Oracle | 未激活 (DEACTIVATED)\
    \ | FAQ |\n\n对配置的某些更改可能会导致虚假的状态报告。\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_5_0.png)\n\
    \n如果显示像这样，说明你的路径是正确的。\n\n现在点击“工具 (Tools)”列表下的“phpmyadmin”。在这里创建一个名为 wordpress\
    \ 的数据库。\n\n现在使用此命令在 /opt/lamp/htdocs/ 目录中解压 wordpress 文件\n\n```\njesse@Punjabizm\
    \ / $ sudo tar -xzvf /home/jesse/Downloads/wordpress-2.9.2.tar.gz -C /opt/lampp/htdocs/\n\
    ```\n\n```\nwordpress/wp-content/themes/default/single.php\nwordpress/wp-content/themes/default/search.php\n\
    wordpress/wp-content/themes/default/comment.php\nwordpress/wp-content/themes/default/archive.php\n\
    wordpress/wp-content/themes/default/page.php\nwordpress/wp-content/themes/default/footer.php\n\
    wordpress/wp-content/themes/default/sidebar.php\nwordpress/wp-content/themes/default/style.css\n\
    wordpress/wp-content/themes/default/attachment.php\nwordpress/wp-content/themes/default/links.php\n\
    wordpress/wp-content/themes/default/track.css\nwordpress/wp-cron.php\nwordpress/wp-feed.php\n\
    wordpress/index.php\njessampunjabi ~ $ sudo tar -xzvf /home/Downloads/wordpress-2.9.2.tar.gz\n\
    cd /opt/lammps/htdocs/\n```\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_6_0.png)\n\
    \n这将在 htdocs 目录中创建一个 wordpress 文件夹。\n现在打开你的浏览器并访问 URL http://localhost/phpmyadmin\n\
    屏幕上将显示以下页面\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_7_0.png)\n\n通过在输入框中填写数据库名称创建一个名为\
    \ wordpress 的数据库，然后点击创建 (create)。数据库创建后，点击首页 (home)。\n\n![](img/f510d08fe53c65ebaa1a32d935781b34_8_0.png)\n\
    \n当你处于首页时，前往权限 (privileges)，然后点击添加新用户 (add new user)。\n\n在添加用户界面中，填写用户名、数据库名称和密码等所需字段。\n\
    \n此部分完成后向下滚动屏幕并点击页面底部的执行 (go)按钮。\n将出现下一个屏幕，稍微向下滚动并从下拉列表中选择 wordpress。\n\n# localhost\
    \ | localhost | phpMyAdmin 3.1.1.3 - Mozilla Firefox\n\n- cicol (1)\n- drupal\
    \ (6)\n- information_schema (28)\n- joomla (36)\n- mysql (9)\n- phpmyadmin (8)\n\
    - wordpress\n\n请选择一个数据库\n\n数据库特定权限\n\n数据库权限 授予 表格特定权限 操作\n\n在以下数据库上添加权限： \n\n\
    更改密码：\n\n密码：\n\n密码哈希：\n\n然后向下移动屏幕，在全局权限 (Global privileges) 中勾选全部 (check all)，这样所有复选框都会像截图所示被勾选。\n\
    \n![](img/f510d08fe53c65ebaa1a32d935781b34_11_0.png)\n\n点击执行 (go)。\n\n"
