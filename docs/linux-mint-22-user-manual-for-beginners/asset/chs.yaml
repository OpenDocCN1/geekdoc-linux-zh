  # 引言


  Linux Mint 22 代表了当今最易用的 Linux 发行版之一。它构建在 Ubuntu 可靠的基础之上，Linux Mint 提供了熟悉的桌面体验，既欢迎
  Linux 新手，也欢迎寻求稳定、高效操作系统的资深用户。


  ## 本书适合人群


  本手册专为完全接触 Linux 的新手，或正从 Windows 或 macOS 等操作系统迁移而来的初学者设计。无论你是想为旧电脑注入新生命、寻求更安全的计算环境，还是仅仅对主流操作系统的替代方案感到好奇，本指南都将引导你了解所需的所有知识。


  你不需要任何先 Linux 经验。每个章节都循序渐进，从基础概念开始，逐渐走向复杂的技巧。指令假设读者具备基础计算机素养，无需技术背景。


  ## 你将学到


  通过学习本手册，你将在关键领域获得实用知识。你将学习如何从零安装 Linux Mint 22，自信地浏览桌面环境，并根据你的喜好自定义工作区。本指南涵盖了日常工作的基本任务，如管理文件、安装软件和连接网络。


  你将发现如何完成常见的效率任务，从文字处理到电子表格管理。手册解释了多媒体功能，包括播放音乐和视频、查看照片和录制音频。系统维护也得到了详尽介绍，确保你的安装保持快速、安全和可靠。


  除了基础知识，你还将探索让系统运行流畅的优化技术。安全实践将保护你的数据和隐私。故障排除章节将帮助你独立解决常见问题。在结束时，你将能够自信且高效地操作 Linux
  Mint。


  ## 如何使用本指南


  本手册遵循从安装到高级自定义的逻辑顺序。新用户按顺序阅读章节受益最多，因为后面的章节建立在之前的概念之上。然而，详细的目录允许资深用户直接跳转到特定主题。


  每个章节都用清晰、直白的语言提供分步骤说明。技术术语仅在必要时出现，并提供通俗的解释。指令指定了精确的菜单位置和按钮名称，消除了操作中的猜测。


  贯穿其中的实用示例展示了现实世界的应用。你将处理不是抽象概念，而是每天会遇到的具体任务。这种实践方法确保了你能够立即应用所学内容。


  花时间探索介绍介绍的功能。Linux Mint 的设计鼓励实验，大多数更改都可以轻松撤销。你与系统交互得越多，就会变得越从自在。


  ## 关于 Linux Mint 22


  Linux Mint 22 代号为“Wilma”，在保持该发行版稳定和易用声誉的同时带来了显著改进。它基于 Ubuntu 24.04 LTS（长期支持），该版本将获得直到
  2029 年的安全更新和支持，使其成为长期使用的极佳基础。


  默认的 Cinnamon 桌面环境提供了传统的布局，让从 Windows 迁移过来的的用户立即感到熟悉。底部的任务栏显示运行中的应用程序，右上角的菜单提供对已安装程序的访问。这种传统设计显著降低了学习曲线。


  性能优化确保了即使在旧硬件上也能流畅运行。Linux Mint 22 在难以运行现代 Windows 版本的电脑上运行高效，使其在复兴老旧方面广受欢迎。同时，它也能充分利用强大的硬件性能。


  隐私和安全得到了特别重视。与某些收集用户数据的操作系统不同，Linux Mint 默认尊重你的隐私。软件的开源性质意味着代码受到全球安全研究人员的定期审查。


  软件管理器提供了数千个免费应用程序，涵盖了几乎所有的计算需求。从浏览器到视频编辑器，从办公套件到游戏，其选择可媲美甚至超过其他平台。大多数软件只需点击即可安装，无需在互联网上寻找下载资源。


  Linux Mint 对用户体验的承诺不仅限于软件本身。该项目维护着大量的文档、活跃的论坛和社区社区。当问题出现时，可以从记得自己 Linux 起步阶段的经验用户那里获得帮助。


  此版本引入了若干增强日常使用的改进。文件管理器提供了更高的性能和额外功能。系统设置进行了重组以便于导航。硬件支持得到了扩展，特别是针对新的显卡和无线适配器。


  更新管理取得了仔细的平衡。关键的安全更新会自动安装，保护你的系统而无需持续关注。其他更新可以根据你的计划进行检查和应用。这种方法兼顾了安全性和稳定性。


  发行版的理念是提供一个开箱即用的完整系统。安装后，你就可以浏览网页、检查电子邮件、播放媒体文件并处理文档。额外的软件可以轻松安装，但你不必花费数小时配置基础功能才能完成实际工作。


  Linux Mint 22 支持 Cinnamon 之外的多个桌面环境，包括 MATE 和 Xfce。每个环境在功能和资源需求之间都有不同的平衡。本手册侧重于默认的
  Cinnamon 版本，因为它为新手提供了最精细的体验。


  随着学习的深入，你会发现 Linux Mint 结合了强大与易用性。最初看起来复杂的特性在练习后会变成本能。操作系统会随你一起成长，为想要探索的人提供深度，同时仍对偏于简单的人保持平易近人。


  你的 Linux Mint 之旅从安装开始，让我们开始在你的电脑上运行该系统。


  # 第 1 章：开始使用 Linux Mint 22


  了解 Linux Mint






  Linux Mint 是一个完整的操作系统，可以替代你电脑上的 Windows 或 macOS。与这些商业选项不同，Linux Mint 是免费且开源的，这意味着任何人都可以免费使用、修改和分发它。“开源”这一标识意味着底层代码公开，供全球的程序员进行检查和改进。


  该发行版源自 Ubuntu，而 Ubuntu 本身构建在 Debian 之上，后者 是最老且最受尊敬的 Linux 发行版之一。这种传承提供了一个坚实且经过良好测试的基础。Linux
  Mint 添加了自身的桌面环境、工具以及专注于易用性和优雅设计的理念。


  “Linux”一词指的是内核，即管理硬件和系统资源的核心组件。“Mint”则将此特定发行版与其他数百种发行版区分开来。每个 Linux 发行版将内核与不同的软件选择、桌面环境和配置打包。Linux
  Mint 的选择强调了用户友好和完善的体验。


  该项目始于 2006 年，由 Clement Lefebvre 创立。他的愿景核心是创建一个“开箱即用”且无需大量技术知识的 Linux 系统。这种哲学一直指导着今天的发展。只有当功能能够增强易用性且不会引入不必要的复杂性时，才会添加新功能。


  Linux Mint 独立于企业控制，意味着决策优先考虑用户而非商业利益。界面没有广告充斥。在未经明确许可的情况下不会进行数据收集。更新不会强制执行不希望的更改。这种用户优先的方法使其与许多商业操作系统区别开来。


  ## 系统要求


  Linux Mint 22 可以在多种硬件上高效运行，包括几年前的旧电脑。最低规格配置允许基本功能运行，而推荐配置则确保了典型使用场景下的流畅性能。


  最低要求包括至少 `1 GHz` 的处理器，尽管现代多核处理器提供更好的性能。内存（RAM）应至少为 `2 GB`，以允许基础多任务处理。存储需求从 `20 GB`
  空闲磁盘空间开始，为系统和某些应用程序留出空间。屏幕分辨率应达到 `1024x768` 像素，以便正确显示界面元素。


  推荐配置提供更快速的响应体验。`2 GHz` 或更高的双核处理器可以流畅地处理多个应用程序。`4 GB` 或更大的内存允许舒适地进行多任务处理而不会减慢。`100
  GB` 或更大的存储空间可以容纳系统、应用程序和你的个人文件，并留有余。更高的屏幕分辨率可以显示更多内容并利用现代显示器的优势。


  图形能力主要针对特殊用途。集成显卡可以轻松处理常规桌面使用、网页浏览、视频播放和办公应用程序。独立显卡则益于游戏、视频编辑和 3D 建模。Linux Mint
  22 对 `NVIDIA` 和 `AMD` 显卡都包含了改进的支持。


  从 USB 驱动器安装并不严格需要连接网络，但它会极大提升体验。安装过程中的在线访问允许下载更新和额外的语言包。安装后，连接网络可以实现软件安装、系统更新以及访问在线资源。


  运行现代 Windows 版本时感到吃力的旧电脑通常运行 Linux Mint 效果非常出色。该系统的效率可以有效延长电脑几年的寿命。许多用户报告说，在相同硬件上从
  Windows 切换到 Linux Mint 后，性能有所提高。


  ## 选择合适的版本


  Linux Mint 22 提供三个主要版本，每个版本都具有不同的桌面环境。桌面环境决定了你图形界面的外观、感受和行为。选择合适的版本取决于你的硬件能力和个人偏好。


  Cinnamon 版本代表旗舰版本，并获得了最多的开发关注。它提供了一个带有视觉效果和流畅动画的现代、吸引人的桌面。界面类似于传统的桌面布局，带有任务栏、菜单和系统托。Cinnamon
  比其他版本消耗更多系统资源，但在性能良好的硬件上它能提供最完善的体验。此版本适用于具有 `4 GB` 或更多内存和合理图形能力的电脑。


  MATE 版本提供了一个更轻量、更传统的桌面环境。它源自 `GNOME 2`，当 `GNOME` 迁移到不同的设计范式时，它保留了那种经典界面。MATE 提供了熟悉的桌面惯例，且资源需求比
  Cinnamon 低。拥有 `2-3 GB` 内存的电脑可以舒适地运行 MATE。界面可能看起来更简单，但它包含了生产力计算的所有基本功能。


  Xfce 版本针对较旧或配置较低的电脑。这种轻量级桌面环境在内存和处理能力有限的系统上运行得顺畅。Xfce 的高效率并不意味着牺牲功能。该界面在利用最少资源的同时提供了完整的桌面功能。在运行
  Cinnamon 或 MATE 时感到吃力的电脑，在运行 Xfce 时通常表现良好。


  所有三个版本都包含相同的 Linux Mint 工具和实用程序。它们访问相同的软件仓库，这意味着在各个版本中安装的应用程序相同。主要区别在于桌面环境和资源占用。


  对于大多数在过去五年内购买现代电脑的用户来说，Cinnamon 版本提供了最佳体验。其精化的界面和活跃的开发使其在硬件允许的情况下成为推荐选择。本手册侧重于 Cinnamon
  版本，尽管许多指令同样适用于 MATE 和 Xfce。


  如果你仍不确定哪个版本适合你的硬件，Cinnamon 是一个安全的起点。如果以后出现性能问题，你可以随时切换到更轻量的版本。该过程涉及安装另一种桌面环境并在登录时选择它，让你在无需重新安装系统即可尝试不同的选项。


  ## 创建可启动 USB 驱动器


  安装 Linux Mint 需要一个包含安装文件的可启动 USB 驱动器。此过程将 Linux Mint 镜像写入 USB 闪存器，使其能够启动你的电脑。你需要一个容量至少为
  `4 GB` 的 USB 驱动器，尽管 `8 GB` 或更大更好。请注意，创建启动盘会擦除其上的所有现有数据，请先备份任何重要文件。


  首先从 `linuxmint.com` 官方网站下载 Linux Mint 22 的 ISO 文件。导航到“下载”部分并选择 Cinnamon 版本，除非你特别指定了
  MATE 或 Xfce。ISO 文件约为 `2-3 GB`，因此下载时间取决于你的网速。将文件保存到你记得的地方。


  下载完成后，使用下载页面提供的校验和（checksum）验证 ISO 文件的完整性。这一步确保文件下载完整且正确。网站提供了 `SHA256` 校验和用于验证。在
  Windows 上，你可以使用命令提示符中内置的 `certutil` 命令。在 macOS 上，使用终端中的 `shasum` 命令进行验证。在 Linux
  上，使用 `sha256sum` 命令。将生成的哈值与网站上发布的进行对比。它们应该完全匹配。


  接下来，下载并安装 USB 写入工具。对于 Windows 和 macOS 用户，`balenaEtcher` 提供了一个友好的选项。从 `balena.io/etcher`
  下载并按照标准流程安装。对于 Linux 用户，有多种选择，包括许多发行版中预装的 `GNOME Disks`，或者用于高级用户的 `dd` 命令。





  将你的 USB 驱动器插入可用端口。启动 `balenaEtcher` 或你选择的 USB 写入工具。界面通常会显示三个简单的步骤。首先，选择你下载的 `Linux
  Mint ISO` 文件。其次，选择目标 USB 驱动器。双击确认已选择了正确的驱动器，因为此过程会擦除其上的所有内容。第三，点击 `Flash` 或 `Write`
  按钮开始。


  写入过程需要几分钟，取决于你的 USB 驱动器的速度。现代的 `USB 3.0` 驱动器比旧的 `USB 2.0` 型号更快。该工具会将 `ISO` 内容写入驱动器并验证数据。不要移除
  USB 驱动器或中断过程。写入成功完成后，会有通知提示。


  某些电脑需要特定的 `BIOS` 设置才能从 USB 驱动器启动。在继续进行安装之前，你可能需要调整启动顺序设置。重启电脑并按下访问 `BIOS` 设置的按键。常见的键包括
  `F2`、`F12`、`Delete` 或 `Esc`，取决于你的电脑制造商。正确的键通常会在启动期间短暂显示。


  在 `BIOS` 设置中，找到 `Boot` 部分。将启动顺序更改为将 USB 设备优先级置于内部硬盘之上。某些系统允许在启动期间按下某个键显示启动菜单，而无需进入
  `BIOS` 设置。这种一次性启动选择允许你选择 USB 驱动器，而无需永久更改启动顺序。


  保存 `BIOS` 更改并退出。插入可启动的 USB 驱动器后，重启电脑。它应该从 USB 驱动器启动，并显示 `Linux Mint` 启动菜单。如果你的电脑启动到现有的操作系统，请重启并尝试再次访问启动菜单，确保选中了
  USB 驱动器。


  # 安装 Linux Mint 22


  安装过程将你可启动的 USB 驱动器中的临时 `Linux Mint` 环境转换为电脑硬盘上的永久安装。安装程序将通过清晰的解释和合理的默认设置引导你完成每一步。


  从 USB 驱动器启动后，你将看到 `Linux Mint` 启动菜单。选择“Start Linux Mint”来启动实时运行环境。此临时版本完全从 USB 驱动器运行，而不会修改你的电脑。它允许你在安装之前尝试
  `Linux Mint`，并作为安装的起点。


  实时桌面会在简短延迟后加载。可以花点时间探索（可选）。桌面上的“Install Linux Mint”图标将开始安装过程。双击它启动安装程序。你也可以从菜单访问安装程序。


  第一个安装程序界面欢迎你，并询问语言选择。为安装过程和生成的系统选择你偏好的语言。安装程序将此此选择用于界面元素、菜单和预装应用程序。安装后可以添加更多语言。


  接下来，安装程序将检查磁盘空间是否充足、电源连接情况以及互联网连接情况。虽然不是强制要求访问互联网，但在安装期间进行连接允许下载更新和额外软件。如果通过 `Ethernet`
  连接，连接将自动建立。对于 `Wi-Fi`，点击系统托盘中的网络图标，选择你的网络并输入密码。


  安装类型屏幕提供几个选项。对于大多数完全替换另一个操作系统的用户，请选择“Erase disk and install Linux Mint”。此选项将整个硬盘用于
  `Linux Mint`，删除任何现有的操作系统和数据。在继续之前，请确保你已备份了重要文件。


  高级用户可以选择“Something else”进行手动分区。此选项允许创建自定义的分区布局、设置双启动配置或安装到特定的磁盘位置。新用户应避免手动分区，除非有针对其情况的特定说明指导。


  如果电脑上存在另一个操作系统，安装程序可能会提议与其并列安装，创建一个双启动设置。这允许在启动时在操作系统之间切换。双启动需要足够的空闲空间以及对启动管理的理解。为了简单起见，建议初学者进行删除现有系统的纯净安装。


  选择安装类型后，确认要使用的磁盘。安装程序会显示检测到的存储设备。如果你的电脑有多个驱动器，请确保你选择了正确的一个。仔细检查更改摘要，因为继续操作将擦除选定的磁盘。


  点击“Install Now”开始写入磁盘。确认对话框会检查将要进行的更改。确认后，安装程序将继续，同时你完成剩余的设置步骤。


  接下来将显示时区选择屏幕。选择你的地理位置以正确设置系统时钟。如果连接了互联网，安装程序通常会根据 `IP address` 自动检测你的位置。验证选择并在需要时调整。


  随后是键盘布局配置。从大量的列表中选择你的键盘类型。文本字段允许你测试布局，确保特殊字符显示正确。大多数美国用户选择“English (US)”布局。安装程序通常会检测到合适的默认值。


  用户账户创建屏幕要求几条信息。输入你的全名或用于显示的偏好名称。然后创建一个用户名，你用它登录登录和识别账户。用户名必须是小写字母、数字和有限的标点符号。


  为你的账户选择一个强密码。安装程序会在输入时指示密码强度。强密码结合了大和小字母、数字和符号。它们的长度至少为八个字符，越长越好。通过再次输入密码来确认密码。


  密码字段下方出现两个登录选项。“Log in automatically”允许系统跳过登录界面并在启动后立即加载你的桌面。这种便利性是以安全性为代价的，因为任何拥有物理访问权限的人都可以使用你的电脑。“Require
  my password to log in”在每次启动时都会显示登录界面，保护你的数据免受未经授权的访问。出于安全考虑，除非你是电脑的唯一用户且它处于安全位置，否则建议需要密码。


  输入账户信息后，安装将在后台继续。当文件复制到硬盘时，幻灯片会突出显示 `Linux Mint` 的特性。此过程根据硬件速度需要 10-30 分钟。安装程序会显示进度和预计剩余时间。


  安装完成后，对话框提示你继续使用实时环境或重启。移除 USB 驱动器并选择“Restart Now”。电脑重启并应该进入你新的 `Linux Mint` 安装。如果它再次尝试从
  USB 驱动器启动，请在启动期间移除它或调整 `BIOS` 启动顺序以优先考虑硬盘。


  # 首次启动和初始设置


  当你新安装的 `Linux Mint` 首次启动时，有几个初始设置任务等待。这些快速配置步骤确保你的系统从开始就处于优化状态。


  启动过程完成后，如果你选择启动时需要密码，将出现登录界面。输入密码并按 `Enter` 或点击登录按钮。桌面环境加载，首次登录时会自动显示欢迎屏幕。


  欢迎屏幕是你初始配置的指南。它提供了几个需要完成的任务，每个任务都旨在增强你的 `Linux Mint` 体验。你可以随时从菜单搜索“Welcome Screen”返回此实用工具。




  第一个建议涉及选择桌面配色方案。Linux Mint 同时支持浅色和深色主题。浅色主题使用亮色背景配合深色文字，类似于传统的桌面外观。深色主题则反其之，在深色背景上显示浅色文字。许多用户发现深色主题对眼睛更友好，特别是在长时间使用或光光环境下。你可以尝试两种主题，并在以后需要时切换。从主题选项中选择您的偏好。


  接下来，欢迎屏幕建议配置系统快照。`Timeshift` 可以创建系统备份，如果发生问题，它可以恢复您的安装。在学习和自定义系统期间，尽早设置 `Timeshift`
  可以提供一个安全保障。点击 `Timeshift` 选项启动该实用程序。


  `Timeshift` 的首次运行向导会引导您完成设置。它会询问您将快照存储在哪里。如果您的电脑只有一个硬盘，系统会自动选择该硬盘。多个硬盘则提供了将快照存储在独立硬盘上的选项，这可以提供更好的保护。选择合适的存储位置并继续。


  向导会询问快照类型。默认推荐并选中 `RSYNC`。这种类型可以高效地存储系统快照，仅记录快照之间的变化，而不是每次都复制所有文件。保持选中 `RSYNC` 并继续。


  接下来选择快照计划。`Timeshift` 可以按照固定间隔自动创建快照。选项包括每天、每周和每月。推荐的设置是在系统更新之前创建快照，以防止与更新相关的问题。启用至少每周快照以获得定期保护。您可以以后根据自己的偏好调整频率。


  最后，指定要保留多少快照。更多的快照提供更多的恢复点，但会消耗更多磁盘空间。默认设置高效地平衡了保护与存储。完成 `Timeshift` 设置以启用系统快照。


  返回欢迎屏幕并进入 `驱动管理器`。Linux Mint 会自动检测许多硬件组件，但某些设备在使用特定特定的驱动程序时性能更好，特别是显卡和无线适配器。`驱动管理器`会识别可用的专有驱动并允许轻松安装。


  从欢迎屏幕启动 `驱动管理器`。它会扫描您的硬件并显示结果。如果有可用的专有驱动，它们将出现在列表中并带有推荐。显卡驱动最为常见。`NVIDIA` 显卡受益于官方驱动，这些驱动提供了比开源替代方案更好的性能和功能。


  要安装推荐的驱动程序，从列表中选择它并点击 `应用更改`。系统将下载并安装驱动程序。驱动更改需要重启系统才能生效。安装驱动程序后，重启电脑以完成配置。


  系统托盘中的 `更新管理器` 图标会在首次登录后不久显示可用更新。保持系统更新可确保您拥有最新的安全补丁和改进。点击 `更新管理器` 图标查看可用的更新。首次运行时，可能会有重大更新。选择
  `安装更新` 以应用它们。在首次更新时，此过程可能需要相当的时间。


  如果您使用英语以外的语言，将关注语言支持。`语言设置`工具允许安装额外的语言包、输入法和键盘布局。可以通过欢迎屏幕或系统设置访问它。为您所需的应用程序、拼写检查和界面元素所需的任何语言安装支持。


  在完成这些初始设置任务后，您的 Linux Mint 安装已完全配置完毕并准备好日常使用。可以关闭欢迎屏幕，尽管它包含其他有用的信息和资源链接，在时间允许的情况下值得探索。


  ### 理解桌面环境


  `Cinnamon` 桌面环境提供了 Linux Mint 的图形界面。理解它的组件和结构有助于您高效地导航并自定义工作空间。


  屏幕底部是 `面板`，这是一个包含多个元素的水平条。在左侧，`菜单` 图标提供了访问已安装应用程序、系统设置和电源选项的。此菜单是您启动程序的主要导航点。


  沿面板向右移动，您将找到 `显示桌面` 按钮。点击它可以最小化所有打开的窗口以显示桌面，便于访问桌面图标或文件。再次点击可将窗口恢复到之前的状态。


  `窗口列表` 占据了 `面板` 的中间部分。每个打开的应用程序都显示为一个带有程序图标和名称的按钮。点击这些按钮可以在应用程序之间切换。右键点击提供额外的选项，如关闭应用程序或在工作空间之间移动它。


  在面板右侧，`系统托盘` 显示各种状态指示器和后台程序。`网络` 图标显示连接状态并提供网络设置。`音量` 图标控制系统音频级别。后台运行的程序可能会出现其他图标，例如更新通知器或消息应用程序。


  `时钟` 显示时间和日期。点击它会显示日历并快速访问时间设置。您可以通过系统设置自定义时间和日期格式。


  最后，最右侧的 `电源` 图标提供了访问会话选项的权限。点击它会显示注销、切换用户、锁定屏幕、重启和关机选项。`锁定屏幕` 选项临时离开电脑时特别有用。


  桌面本身提供了一个放置文件和文件夹快捷方式的区域。某些用户喜欢没有图标的干净桌面，而另一些用户认为桌面快捷方式方便。在桌面上右键点击会弹出上下文菜单，提供创建新文件和文件夹、更改桌面设置和访问文件管理的选项。


  如果面板上可见 `工作空间切换器`，允许在多个虚拟桌面之间组织工作。Linux 支持工作空间，其功能就像可以在之间切换的独立桌面。此功能有助于组织不同的任务。您可以将浏览器放在一个工作空间，办公应用程序放在另一个，通信程序放在第三个。使用键盘快捷键或点击工作空间切换器面板元素在工作空间之间切换。


  窗口可以使用标题栏中的控件进行移动、调整大小、最大化、最小化和关闭。每个窗口顶部的 `标题栏` 显示应用程序名称和右侧三个按钮。`X` 按钮关闭窗口。`最大化`按钮扩展窗口以填充屏幕。恢复的窗口可以通过拖动边缘或角来调整大小。`最小化`按钮将窗口隐藏在
  `窗口列表` 中而不关闭应用程序。


  `热点角` 是一个可选功能，允许通过屏幕角激活功能。将鼠标光标移动到屏幕角可以触发操作，如显示所有窗口、切换工作空间或显示桌面。此功能默认禁用，但对于认为方便的用户，可以通过系统设置启用。


  当发生通知时，`通知区域` 会出现在右上角。系统消息、应用程序警报和更新通知会出现在这里。通知在几秒后会自动淡出，但可以通过点击关闭按钮立即删除。


  `Alt-Tab` 键盘快捷键可以在打开的窗口之间循环，提供无需使用鼠标的快速切换。按住 `Alt` 并反复按 `Tab` 在 `窗口列表` 中移动。释放 `Alt`
  切换到选定的窗口。这种基于键盘的导航通常比点击面板按钮更快。





  在面板元素上点击右键可显示配置选项。面板本身可以进行广泛自定义，根据你的喜好添加或删除应用程序（applets）。这些自定义内容将在后面的章节中详细介绍。


  了解这些桌面组件是高效使用 Linux Mint 的基础。随着你对该环境越来越熟悉，你将开发出自然利用这些特性的工作流模式。


  # 第 2 章：桌面导航


  ### Cinnamon 桌面概述


  Cinnamon 桌面环境结合了视觉吸引力与实用功能。它的布局遵循传统的桌面设计，让从其他操作系统过渡过来的用户感到非常亲切。了解组件之间如何交互可以让你工作得更高效，并自定义你的环境以匹配你的工作流。


  桌面工作区占据了屏幕的大部分，为应用程序窗口和可选的桌面图标提供了空间。多个应用程序可以同时运行，窗口根据你的喜好重叠、平铺或最大化。窗口管理系统能够流畅地处理这些安排，即使在运行大量程序也是如此。


  视觉效果在不牺牲性能的情况下增强了桌面体验。打开、关闭、最小化或最大化应用程序时，会出现窗口动画。这些细微的效果为操作提供了视觉反馈，而不会产生干扰。`Alt-Tab`
  窗口切换会显示打开窗口的缩略图预览，让你更容易识别想要使用的窗口。


  桌面同时响应鼠标和键盘输入。许多操作可以使用其中任一种方法完成，允许你根据情况和喜好进行选择。一旦你学会了键盘快捷键，对于频繁的任务，它们通常证明更快；而鼠标操作则为新用户提供了可发现性。


  Cinnamon 通过共同的设计元素保持了应用程序之间的一致性。菜单、按钮和控件在不同程序中的显示非常相似，降低了尝试新软件时的学习曲线。这种一致性延伸到了键盘快捷键，许多命令在各个应用程序中的工作方式完全相同。


  ### 使用菜单


  菜单是你访问已安装应用程序、系统设置和各种功能的主要入口点。点击面板左侧的菜单图标可打开此中心枢。菜单将内容组织为几个部分，以便于导航。


  左列显示应用程序类别，如互联网、办公、图形以及音频和视频。点击某个类别，会在中间列中显示出该组内已安装的应用程序。这种组织方式有助于你根据用途寻找应用程序。如果你正在寻找网络浏览器，请检查“互联网”类别。需要编辑图像？查看“图形”。


  中间列显示所选类别中的应用程序。每个应用程序都带有其名称和图标显示。点击应用程序即可启动它。右键点击应用程序会显示额外选项，包括将其添加到面板或桌面以快速访问、从系统中删除它或查看其属性。


  右列提供了对常用位置和系统功能的快速访问。如“主目录”、“桌面”和“文档”等位置会出现在这里。系统管理选项包括系统设置、软件管理器和 `Terminal` 也可以从此列访问。


  菜单顶部有一个搜索框。这项强大功能允许你快速找到应用程序，而无需遍历类别。点击搜索框或只需在打开菜单后直接开始打字。随着你的输入，结果会立即出现，并过滤显示匹配的应用程序、文件和设置。例如，输入“fire”会快速显示
  Firefox。输入“update”会显示更新管理器。


  搜索功能扩展到了应用程序名称之外。它会搜索应用程序描述和关键词，即使你不知道应用程序的确切名称也同样有效。想找计算器但不记得是否安装了？输入“calculator”就会出现可用选项。


  最近使用的应用程序出现在菜单顶部附近，方便访问。此列表会根据你的使用模式进行调整，将经常使用的程序放在触手可及的地方。如果你经常使用相同的几个应用程序，它们将出现在此区域，减少了导航类别的需求。


  菜单底部的电源选项包括锁屏幕、注销、挂起、重启和关机。锁屏幕在不关闭应用程序的情况下保护会话，适用于短暂离开。注销结束你的会话并关闭所有应用程序。挂起让计算机进入低功率状态，将你的会话保持在内存中以便快速恢复。重启重启计算机，系统更新后是必要的。关机完全关闭计算机。


  你可以通过设置自定义菜单的外和行为。右键点击菜单图标并选择 `Configure` 以访问选项。设置允许更改菜单图标、调整大小、修改搜索行为并选择显示哪些元素。某些用户偏于只显示基本项目的极简菜单，而另一些用户则想要完整的列表。


  菜单会在会话之间记住你的喜好。你频繁访问的类别、经常运行的应用程序和搜索模式会影响显示的内容。这种自适应行为让菜单随着它对你使用模式的学习而变得越来越高效。


  ### 使用面板


  屏幕底部的面板包含多个称为应用程序（applets）的组件。每个应用程序提供特定的功能，从启动应用程序到显示系统信息。了解面板自定义允许你创建一个符合你需求的工作区。


  要修改面板，右键点击面板的空白区域并选择 `Panel Settings`。这会打开一个配置窗口，显示所有面板组件。窗口显示你当前的面板布局，每个应用程序都有表示。你可以添加新的应用、删除现有的并重新排列它们的顺序。


  添加应用程序可以扩展面板功能。在面板设置窗口中点击“Add applets to the panel”。新窗口将显示按类别组织的可用应用。应用包括工作区切换器、显示
  CPU 和内存使用的系统监控、天气显示、日历小部件以及其他各种添加项。选择一个应用并点击加号图标将其添加到面板。


  如果你不使用某些功能，删除应用程序可以清理面板。在面板设置窗口中，选择你想删除的应用并点击减号图标。应用将从面板中消失。如果需要，你随时可以将其添加回来。


  重新排列应用程序会改变它们在面板上的位置。在面板设置窗口中，选择一个应用并使用上下箭头调整其位置。这决定了应用在你的面板上从左到右出现的顺序。


  每个应用程序都有自己的设置，可以通过右键点击它并选择 `Configure` 或 `Settings` 来访问。例如，右键点击时钟应用程序允许更改时间和日期格式、选择显示的元素以及调整更新间隔。天气应用程序允许你设置位置并选择温度单位。探索单个应用程序的设置以进行完全自定义。


  面板高度可以调整以适应较大的图标或你的喜好。在面板设置中，一个滑块控制面板高度。较高的面板为应用元素和更大的窗口列表按钮提供了更多空间，而较短的面板则为应用程序最大化屏幕空间。





  如果需要，可以同时存在多个面板。高级用户有时会为了特定目的创建额外的面板，例如在屏幕侧边创建一个包含经常使用的应用程序启动器的垂直面板。这种高级自定义是可选的，且对于大多数用户来说并不是必要的。


  面板自动隐藏功能可以让面板在不需要时消失，从而最大化屏幕空间。可以在面板设置中启用此功能。启用自动隐藏后，当窗口靠近面板时，面板会滑出屏幕。将鼠标移动到面板位置，它就会重新出现。此功能适用于偏于最大应用程序空间且不在意面板临时隐藏的用户。


  当许多应用程序同时运行时，面板会智能地管理窗口按钮。如果窗口按钮变得过于拥挤，面板会调整它们的大小或将同一应用程序的窗口分组。这确保了无论你运行多少程序，面板功能都能保持完整。


  ## 管理窗口和工作空间


  高效窗口管理通过保持工作区域整洁来提高效率。Linux Mint 提供许多工具来排列窗口并有效利用屏幕空间。


  每个窗口顶部都有一个包含窗口标题和控制按钮的标题栏。右侧的三个按钮执行基本功能。`X` 按钮关闭窗口，终止应用程序或关闭文档。最大化按钮将窗口扩展以填充整个屏幕，当您需要关注单个应用程序时非常有用。最大化后，此按钮将变为还原按钮，将窗口恢复到之前的尺寸。最小化按钮将窗口从视图中移除但不关闭它，将其隐藏在窗口列表中，直到你点击按钮将其还原。


  调整窗口大小允许你同时查看多个应用程序。将鼠标光标悬停在任何窗口边缘或角上，直到光标变为调整光标，然后点击并拖动以调整窗口大小。拖动边缘可以独立调整宽度或高度，而拖动角可以同时调整两个维度。


  窗口贴靠简化了并排排列多个窗口的操作。将窗口标题栏拖到屏幕的左边缘或右边缘。当鼠标到达边缘时，会出现一个轮廓显示窗口将贴靠的位置。释放鼠标按钮，窗口将调整大小以正好填充屏幕的一半。将另一个窗口拖到对边缘即可创建分屏布局。这在比较文档、写作时参考信息或处理多个相关文件时被证明特别有用。


  贴靠也适用于屏幕角以实现四分屏布局。将窗口拖到任何一个角并在轮廓出现时释放。窗口将调整大小以占据屏幕的分之一。四个窗口可以这样排列，每个占据显示器的四分之一。


  双击窗口标题栏可将其最大化。这提供了点击最大化按钮的快速替代方案。最大化后再次双击即可恢复之前的尺寸。


  右键点击窗口标题栏会显示更多选项。你可以从此菜单最大化、最小化或关闭窗口。如果你使用多个工作空间，会显示将窗口移动到不同工作空间的选项。“始终置顶”选项让该窗口保持在其他窗口之上，对于你无论哪个应用程序获得焦点都希望可见的参考信息非常有用。


  工作空间提供了虚拟桌面，用于组织不同的任务或项目上下文。将工作空间想象成可以即时切换的多个桌面。你可能将电子邮件和通信应用程序放在一个工作空间，将网络浏览器放在另一个，将办公应用程序放在第三个工作空间。这种组织减少了桌面的杂乱，并帮助你专注于当前任务。


  面板上的工作空间切换器小组件将可用工作空间显示为小矩形。点击某个工作空间即可切换到它。当前工作空间上的窗口出现在切换器中，帮助你识别哪个工作空间包含特定的应用程序。


  在工作空间之间移动窗口非常简单。右键点击窗口标题栏，选择“移动到其他工作空间”，并选择目标工作空间。或者，你可以将窗口面板按钮拖到工作空间切换器中的另一个工作空间。


  快捷键提供了最快的工作空间导航。`Ctrl+Alt+右箭头` 切换到右侧的工作空间，而 `Ctrl+Alt+左箭头` 移动到上一个工作空间。如果你配置了网格工作空间布局，`Ctrl+Alt+向上`和`向下`箭头可以进行垂直导航。这些快捷键很快就会变得自然，允许任务上下文流畅移动。


  工作空间的数量可以在系统设置中配置。导航到系统设置，选择“工作空间”，并调整水平和垂直工作空间的数量。大多数用户发现二到四个工作空间足够了，但如果你的工作流需要，也可以配置更多。


  应用程序之间的窗口切换使用 `Alt+Tab` 快捷键。按住 `Alt` 并按 `Tab` 循环切换打开的窗口。会出现一个切换器显示所有窗口的缩略图和标题。按住
  `Alt` 的同时继续按 `Tab` 在列表中移动。当所需的窗口被高亮时释放 `Alt` 切换到它。`Alt+Shift+Tab` 以反序循环。


  窗口切换器还可以按工作空间过滤。默认情况下，`Alt+Tab` 显示所有工作空间的所有窗口。在系统设置的“窗口”下，你可以配置为仅显示当前工作空间上的窗口，当你在多个工作空间打开了许多应用程序时，这有助于切换。


  ## 桌面图标和快捷方式


  桌面图标提供了快速访问经常使用的文件、文件夹和应用程序。虽然某些用户偏于没有图标的整洁桌面，但另一些人认为它们对于重要项目很方便。


  要在桌面上放置应用程序快捷方式，打开菜单并找到所需的应用程序。右键点击该应用程序并选择“添加到桌面”。你的桌面上将出现一个图标。双击此图标即可启动应用程序。


  文件和文件夹快捷方式的工作原理类似。打开文件管理器并导航到你想要放在桌面上的项目。右键点击它并选择“创建软链接”。将创建一个带有箭头指示的链接文件，显示它是一个快捷方式。将此链接拖到桌面。原始文件保留在原有位置，而桌面链接提供了快速访问。


  可以直接在桌面上创建新文件夹。右键点击桌面的空白区域并选择“新建文件夹”。会出现一个文件夹，提示你对其命名。这些文件夹的功能与系统任何地方的文件夹完全相同。


  桌面图标可以自动排列或手动排列。右键点击桌面，你将在“排列桌面图标”下找到选项。自动排列按名称、大小或类型以网格模式对图标进行排序。手动排列允许你从任何喜好的位置放置图标。拖动图标即可在桌面上自由移动。


  图标大小通过桌面设置进行调整。右键点击桌面，选择“自定义”，并导航到“桌面”部分。通过滑块控制图标大小。较大的图标更容易查看和点击，但占用更多的桌面空间。较小的图标允许桌面上显示更多项目，同时保持易于访问。


  某些用户完全禁用桌面图标以获得极简外观。在桌面设置中，你可以禁用“显示桌面图标”。这将创建一个只有背景图像可见的整洁工作区域。应用程序和文件可以通过文件管理器和菜单访问。


  ## 系统托盘


  系统托盘占据面板的右侧，显示状态指示器和后台应用程序。这些小图标提供了信息和快速访问设置的通道。





  网络指示器显示您的连接状态。有线连接显示为插头图标，而无线连接则显示信号强度条。点击此图标可显示可用网络和连接选项。您可以从此菜单连接到不同的无线网络、查看连接详情，或访问完整的网络设置。


  音量控制图标显示当前的音频电平。点击它可以显示音量滑块以便快速调整。滑块控制影响所有音频输出的主音量。右键点击音量图标可以访问声音设置，以进行更详细的音频配置。


  电池指示器出现在笔记本电脑上，显示剩余电量。图标会根据电量水平以及是否连接了电源适配器而变化。点击它可以显示更详细的电池信息并访问电源设置。


  其他应用程序可能会在系统盘盘放置图标。消息应用程序通常在此处显示通知。云存储服务指示同步状态。音乐播放器提供播放控制。每个图标通常在点击后会弹出一个相关选项的菜单。


  系统托盘会自动管理图标溢出。如果显示的图标过多，无法舒适容纳，系统托盘会将它们合并。点击一个小小的箭头图标可以显示隐藏的托盘图标。这防止了托盘占用过多的面板空间。


  ## 自定义桌面外观


  Linux Mint 提供了广泛的外观自定义功能，允许您创建一个符合自己偏好和工作流的桌面。


  主题控制窗口、菜单和界面元素的整体外观。通过“系统设置”中的“主题”部分访问主题。Linux Mint 包含几个预装主题。浅色主题使用明亮的背景，而深色主题采用较暗的配色方案，许多用户发现长时间使用时这种主题更护眼。


  要更改主题，请打开“系统设置”并点击“主题”。您将看到桌面主题、窗口边框、图标和鼠标指针等类别。每个类别都可以独立自定义，尽管许多用户会选择匹配的主题以保持视觉的一致性。


  桌面主题影响窗口标题栏、菜单、按钮和其他界面元素。点击可用选项以预览它们的样式。更改将立即生效，让您能够轻松评估不同的主题。


  图标主题更改整个系统中图标的外观。不同的图标集提供从极简到详细、从扁平化到三维的不同风格。选择一个吸引您并符合您整体审美偏好的图标主题。


  窗口边框决定窗口框架和标题栏的外观。选项从最大化屏幕空间的最小边框到更具装饰性的设计不等。选择一种既提供您所需功能又能辅助您所选主题的边界样式。


  背景壁纸个性化您的桌面。右键点击桌面并选择“更改桌面背景”以访问壁纸设置。Linux Mint 包含了各种风格的壁纸。浏览并选择一个您喜欢的。


  要使用自己的图片作为壁纸，点击壁纸设置中的加号图标并导航到您的图像文件。照片非常适合作为背景。系统可以拉伸、平铺、居中或缩放图像以适应屏幕。尝试这些选项，为您选择的图像找到最佳外观。


  幻灯片背景按设定的间隔循环多张图像。在壁纸设置中，选择多个图像并启用幻灯片模式。选择图像变化的频率，从每分钟一次到每天一次。这为您的桌面增加了多样性，无需手动更改。


  桌面特效控制动画和视觉增强。在“系统设置”的“特效”下访问这些设置。选项包括窗口动画、阴影效果和透明度。启用特效可以增强视觉精致感，但需要更多的图形处理。大多数现代电脑都能轻松处理这些特效。旧或性能较弱的系统可以禁用特效以提高性能。


  字体设置调整整个系统中文本的外观。在“系统设置”中，选择“字体”来修改文档、桌面元素、窗口标题和等宽字的默认字体。


  # 第 3 章：基本系统设置


  ## 访问系统设置


  系统设置是配置 Linux Mint 的控制中心。这个集中实用程序提供了所有系统选项的访问，从显示设置到用户账户。


  要打开“系统设置”，点击“菜单”并在右列中选择“系统设置”。或者，在菜单搜索字段中搜索“系统设置”。“系统设置”窗口显示了许多图标，每个图标代表一个类别。


  图标被组织为：外观、偏好、硬件和管理。这种组织有助于找到特定设置。外观设置控制主题、桌面背景和视觉效果。偏好调整语言和输入法等个人设置。硬件设置配置显示器、打印机和其他设备。管理设置处理高权限的系统级配置。


  点击任何图标都会打开该特定的设置模块。某些设置非常直观，选项很少，而另一些设置提供了广泛的配置可能性。花时间探索不同的设置，以了解可用选项。


  许多设置更改会立即生效，无需确认。您可以自由尝试，因为大多数更改都可以轻松撤销。某些系统级修改会提示输入密码，以确认您想要进行管理更改。


  “系统设置”顶部的搜索功能可以帮助在您不确定选项包含哪个类别时找到特定选项。输入与您想要配置的内容相关的关键词，匹配的设置将出现在结果中。


  ## 显示配置


  显示设置控制您在使用多个显示器时显示器的分辨率、方向、刷新率和排列。


  打开“系统设置”并点击“显示”。显示设置窗口显示您已连接的显示器或多个显示器的表示。如果使用单个显示器，则会出现一个显示器。多个显示器显示为独立的框，可以对其进行排列以匹配它们的物理位置。


  分辨率决定屏幕上显示多少像素。较高的分辨率显示更多内容，但会使单个元素变得更小。较低的分辨率显示的元素较大，但显示的内容较少。Linux Mint 通常根据您的显示器能力自动选择最佳分辨率。如果当前分辨率看起来不对，点击“分辨率”下拉菜单并选择不同的选项。可用分辨率取决于您的显示器和显卡。


  刷新率决定显示器每秒更新多少次。较高的刷新率产生更平滑的运动，在移动窗口或滚动时尤为明显。大多数显示器支持 60 Hz 刷新率，适用于常规使用。某些显示器提供更高的频率，如
  75 Hz、120 Hz 或 144 Hz，对游戏或视频编辑有益。选择您的显示器能够舒适支持的最高刷新率。




  方向会改变显示旋转。标准的横屏模式（Landscape）适用于大多数情况。如果您垂直安装了显示器，请将显示旋转到纵向模式（Portrait），某些用户更于这样做阅读文档或编写代码。额外的旋转选项包括反向横屏和纵向。


  当使用多个显示器时，显示设置允许您对其进行排列以匹配物理布局。在设置窗口中拖动显示器图标以确定其位置。如果您的显示器水平相邻，请将它们并排放置；如果一个在另一个上方，则将它们堆叠。恰当的布局可确保鼠标光标在屏幕之间自然移动，离开一个屏幕边缘并出现在相邻屏幕上。


  主显示器决定了面板和桌面图标默认出现的位置。在使用多个显示器时，通过点击显示器并启用“主显示（Primary Display）”来选择哪一个是主显示。此显示器将显示面板、系统托和其他桌面元素。


  显示缩放可以在不改变分辨率的情况下调整界面元素的大小。在高分辨率显示器上，标准尺寸的界面元素可能显得太小。缩放会按比例增大其尺寸，提高可读性和易用性。此功能对
  4K 显示器特别有利，200 百比的缩放通常可以在屏幕空间和可读性之间提供最佳平衡。


  夜间模式在晚间期间减少蓝光发射，这有助于减轻眼睛疲劳并提高睡眠质量。在显示设置中启用夜间模式并配置其激活时间。您可以设置特定的开关时间，或让它根据您所在地的日落和日出自动调整。


  ### 声音设置


  声音设置控制音频输入输出设备、音量和声音主题。


  通过点击声音图标在系统设置中访问声音设置。设置窗口包含多个用于不同音频方面的标签页。


  输出（Output）标签页显示可用的音频输出设备。大多数计算机有一个或多个输出选项，例如内置扬声器、耳机插、HDMI 音频或外部 USB 音频设备。当前输出设备会显示为。要切换到不同的设备，请从列表中选择它。使用滑块调整所选设备的音量级。


  平衡控制调整左右音频平衡。如果音频在某只耳朵或扬声器中听起来更大，请调整平衡滑块使声音居中。此设置仅适用于立体声输出设备。


  输入（Input）标签页管理麦克风和其他音频输入设备。如果您的计算机内置麦克风，它将显示在这里。通过 USB 或音频线连接的外部麦克风也会出现在此列表中。选择您想要使用的输入设备并使用滑块调整其音量。输入电平表显示当前音频电，有助于确认麦克风是否正常工作并适当调整敏感性。


  音效设置控制各种系统操作的音频反馈。选项包括登录、接收通知、调整音量或遇到错误时播放声音。您可以单独启用或禁用这些声音。系统包含几种不同音频风格的声音主题。选择一个符合您喜好的主题，或者如果您喜欢静音操作，也可以完全禁用音效。


  应用程序（Applications）标签显示各个运行应用程序的音量控制。如果有程序同时产生音频，您可以独立调整每个应用程序的音量，而不影响系统整体音量。这允许您在例如边听音乐边看视频教程时平衡音频电平。


  高级设置提供了访问详细音频配置的权限。大多数用户永远不需要调整这些选项，因为 Linux Mint 会自动正确配置音频。如果有特定的音频制作需求，高级用户可以指定采样率、缓冲区大小和其他技术参数。


  ### 网络连接


  网络设置管理有线和无线互联网连接、VPN 和网络偏好。


  打开系统设置并选择网络以访问连接设置。网络窗口显示可用的连接类型和已配置的连接。


  对于有线连接，在大多数情况下，插入以太线会自动建立连接。系统托盘中的网络图标指示连接状态。如果自动配置失败，可以通过点击有线连接并选择设置来手动配置有线设置。大多数用户可以将其保持自动配置。


  无线连接需要选择您的网络并输入凭据。点击系统托盘中的网络图标查看可用的无线网络。网络出现在列表中，显示它们的名称和信号强度。安全网络会显示锁图标。


  要连接到无线网络，点击列表中的其名称。如果是加密网络，对话框会提示输入密码。按照路由器上配置的格式精确输入网络密码，注意大小写。如果您希望 Linux Mint
  在当该网络在范围内时自动加入该网络而不提示，请启用“自动连接”。


  在输入正确的凭据后，系统将建立连接。网络图标将变为显示信号强度，您就可以开始使用互联网了。密码会被安全存储，因此未来的连接将自动发生，无需重新输入。


  隐藏的无线网络不会公开广播其名称。要连接到隐藏网络，点击网络图标并选择“连接到隐藏网络”。手动输入网络名称和安全详情。这需要知道确切的网络名称和密码。


  VPN 连接通过公共网络提供安全隧道，在通过不受信任的网络连接或访问公司资源时非常有用。要配置 VPN，您需要来自 VPN 提供商或网络管理员的连接详情。在网络设置中，点击加号图标添加新连接，选择
  VPN 并选择合适的 VPN 类型。根据您的 VPN 服务提供的输入服务器地址、身份验证凭据和其他详情。


  网络偏好允许配置代理服务器、连接优先级和 MAC 地址设置等高级选项。大多数用户永远不需要调整这些设置。如果您的网络环境需要代理配置，您的网络管理员将提供必要的细节。


  ### 蓝牙设置


  蓝牙设置管理与耳机、扬声器、键盘、鼠标和其他蓝牙设备的无线连接。


  要访问蓝牙设置，打开系统设置并点击蓝牙。如果您的计算机具有蓝牙功能，设置窗口将显示启用或禁用蓝牙的开关。启用它以开始连接设备。


  将设备放入配对模式使其可发现。此过程因设备而异。耳机通常需要按住某个按钮直到 LED 闪烁。键盘和鼠标通常在底部有一个配对按钮。请咨询您的设备说明书获取特定的配对指令。


  在 Linux Mint 中启用蓝牙且您的设备处于配对模式后，设备应出现在蓝牙设置窗口中。点击设备名称并选择“连接”或“配对”。某些设备需要输入屏幕显示的 PIN
  码。在设备上输入该代码（对于键盘）或确认其匹配（对于其他设备）。


  配对完成后，设备将连接并变为可用。蓝牙音频设备将自动作为声音设置中的音频输出选项。键盘和鼠标等输入设备将立即开始工作。




  已连接设备出现在蓝牙设置中，并带有断开、删除或访问设备特定设置的选项。如果设备以后没有自动重新连接，请确保其已开启电源并处于范围内，然后在蓝牙设置中点击它并选择“连接”。


  ## 电源管理


  电源设置控制计算机如何管理能量消耗，这对于笔记本电脑最大化电池续航时间尤为重要。


  通过点击 `Power Management` 在系统设置中访问电源设置。设置窗口提供了在电池供电与接通电源运行时不同的行为选项。


  自动挂起在一段时间未活动后将计算机置低功耗状态。你可以为电池和交流电源设置不同的挂起时间。较长的时间可以让计算机保持更长时间激活，对于经常返回工作的用户非常方便。短的时间可以节省能量，但如果你只是在阅读屏幕而没有活动输入，可能会中断工作。


  “关闭盖子时”设置决定了笔记本在关闭屏幕时的行为。选项包括挂起、休眠或什么都不做。挂起模式是常见的，允许在打开盖子时快速恢复，且耗电极低。休眠会将会话保存到磁盘并完全关机，不消耗电源，但恢复速度较慢。什么都不做会让笔记本在屏幕关闭的情况下继续运行，在你使用外部显示器时非常有用。


  按钮电源设置指定了按下电源按钮时会发生什么。选项包括询问操作、挂起、休眠或关机。许多用户倾向于“询问”，它会弹出一个包含多个选项的对话框，而不是假设你的意图。


  电池百分比和剩余时间出现在笔记本的系统托中。点击电池图标可显示详细的电量信息以及根据当前功耗估计的剩余时间。这有助于你在使用电池供电时规划工作。


  电源统计提供了有关电池健康和历史用电情况的详细信息。通过点击电源管理设置中的“Power Statistics”访问这些信息。图表显示了随变化的充电和放电率，有助于识别消耗过多电的应用程序。


  ## 日期和时间配置


  日期时间设置确保系统时钟显示正确并根据你的时区进行调整。


  打开系统设置并点击 `Date & Time`。设置窗口显示当前的日期、时间和所在时区。


  Linux Mint 可以使用网络时间服务器自动同步时间。启用“Network time”以保持时钟准确。系统会定期连接到时间服务器并在需要时调整时。这确保了即使计算机的内部时钟略有漂移也能保持准确性。


  如果无法使用或不需要自动时间，你可以手动设置时间。禁用“Network time”并点击日期或时间来编辑数值。使用日历组件选择正确的日期时间字段来设置小时和分钟。


  时区选择对于准确显示时间至关重要。在地图上点击你当前的时区，或从下拉列表中选择。Linux Mint 包含了全球所有时区。选择与你所在地匹配的一个。如果你旅行，在更改时区时更新此设置以保持本地时间准确。


  时间格式可以显示为 12 小制（带有 AM/PM）或 24 小时制。在设置中选择你的偏好。许多国家使用 24 小时制，而其他国家则倾向于带有 AM/PM 标识的
  12 小制。


  ## 用户账户和权限


  用户账户设置管理谁可以使用你的计算机以及他们拥有什么权限。


  通过点击 `User Accounts` 在系统设置中访问用户账户。这将显示系统上所有的账户。你的账户显示第一个，标记为当前用户。


  要创建新用户账户，点击加号图标。系统会提示你输入密码以确认管理员权限。为新账户输入用户名，遵循与安装时创建账户时相同的规则。选择新用户应是标准用户还是管理员。


  标准用户可以使用计算机并修改自己的设置，但不能安装软件、修改系统设置或影响其他用户。管理员账户具有完全系统访问权限。除非新用户需要管理员权限，否则为了安全请创建一个标准账户。


  为新账户设置密码，或允许用户在首次登录时设置自己的密码。如果你自己设置密码，请确保它是强密码，并安全地告知用户。


  账户类型可以在创建后进行更改。点击现有账户并选择账户类型下拉菜单，以便在标准用户和管理员之间进行切换。这允许将用户提升为管理员状态或移除管理员权限。


  删除用户账户将将其从系统中移除。点击某个账户并选择减号图标来删除它。系统会询问你是保留还是删除该用户的文件。保留文件会将它们移动到安全位置，管理员可以访问这些文件。删除文件将将其永久删除。


  你的账户设置允许更改密码、显示名称和头像。点击你的账户并选择“Change password”来更新密码。这需要输入当前密码，然后输入两次新密码进行确认。


  头像显示在登录界面和各种界面元素中。点击用户图标图像选择新图片。你可以从内置图像中选择，或从自己的文件中选择。当多个用户共享一台计算机时，头像有助于快速识别账户。


  安装期间配置的自动登录可以在用户账户中更改。启用或禁用你账户的自动登录。记住，自动登录会降低安全性，因为它允许任何物理接触电脑的人无需验证即可使用你的电脑。


  # 第 4 章：文件管理


  ### 理解文件管理器


  文件管理器称为 `Nemo`，提供了对文件和文件夹的图形化访问。它是你进入文件系统的窗口，允许你在不使用命令行工具的情况下浏览、组织和操作文件。


  点击菜单或面板中的“Files”图标启动文件管理器。它默认打开并显示你的主目录（Home）。文件管理器窗口包含几个区域，每个区域都有特定用途。


  顶部的工具栏提供了导航按钮、视图选项和搜索功能。后退和前进箭头导航文件夹历史，类似于浏览器的导航。向上箭头移动到包含当前文件夹的父文件夹。


  左侧的侧边栏显示常用位置的快捷方式。`Home` 进入你的个人文件夹。`Desktop` 显示桌面内容。`Documents`、`Downloads`、`Music`、`Pictures`
  和 `Videos` 提供了对这些标准文件夹的快速访问。可以为经常访问的位置添加快捷方式。


  主视图区域显示当前位置的文件和文件夹。多种视图模式以不同的方式呈现内容。`Icon view` 图标视图显示大图标，适合有助于视觉识别的图片文件夹。`List
  view` 列表视图按列显示详细信息，包括名称、大小、类型和修改日期。`Compact view` 紧凑视图通过较小的图标和极少的细节在相同空间内适应更多项目。


  底部的状态栏显示有关当前文件夹和所选项目的信息。它显示文件夹包含多少个项目以及所选文件的总大小。当选择多个文件时，状态栏会指示你选择了多少个项目。


  位置栏显示你当前在文件系统中的位置位置。它显示文件夹路径，每个文件夹名称均可点击以直接跳转到该层级。这种面包屑式导航让向上移动多个文件夹层级变得轻而易举。


  ### 导航你的文件系统






  # Linux Mint 从根目录开始按层级结构组织文件。理解这种结构有助于你定位文件并了解各个内容的归属。


  你的 `Home` 文件夹包含了你所有的个人文件和设置。每个用户都有自己独立的 `Home` 文件夹，与其他用户分开。在你的 `Home` 文件夹中，你会发现几个标准子文件夹：

  - `Desktop` 存放桌面图标文件。

  - `Documents` 存储你的个人文档。

  - `Downloads` 接收下载的文件。

  - `Music` 组织音频文件。

  - `Pictures` 存储图像。

  - `Videos` 存放视频文件。

  - `Public` 为你想要让其他用户访问的文件提供共享位置。


  ## 文件管理与导航


  文件管理器的侧边栏提供了这些位置的快捷方式，以便快速访问。点击任何文件夹即可导航到该位置。主视图区域将更新并显示该文件夹的内容。


  在主视图区域中双击文件夹可以打开它并显示其内容。这是深入文件夹层级导航的主要方法。每次双击都会带你进入深一层。


  要导航回父文件夹，请使用工具栏上的向上箭头，或点击位置栏中的父文件夹名称。这将使你在文件夹结构中向回移动一级。


  工具栏上的 `Home` 按钮可以让你从文件系统的任何地方返回你的 `Home` 文件夹。当你深入进入文件夹层级时，这提供了一个快速返回起点的快捷方法。


  可以从侧边栏访问最近的文件。此特殊视图显示了你最近打开的文件，无论它们位于何处。当你需要访问某个文件但记记得它具体保存在哪里时，这个功能非常有帮助。


  文件系统根目录由 `/` 表示，包含系统文件和文件夹。这里的大多数文件与系统相关，在没有理由的情况下不应进行修改。你的 `Home` 文件夹存在于这个更广泛的文件系统中，但你主要在自己的
  `Home` 文件夹及其子文件夹中工作。


  外部驱动器和挂载分区在连接时会出现在侧边栏中。USB 驱动器、外部硬盘和网络位置会自动显示。点击它们即可像本地文件夹一样访问其内容。


  ## 创建与组织文件夹


  文件夹将相关文件组织在一起，使你的文件系统保持整洁并让文件易查找。创建逻辑文件夹结构可以提高效率并减少搜索文件的时间。


  要创建新文件夹，请导航到你想要它所在的位置。在文件管理器空白处点击右键，从右键菜单中选择“创建新文件夹”。或者，使用键盘快捷键 `Ctrl+Shift+N`。会出现一个带有高亮临时名称的新文件夹，准备好你输入所需的名称。输入一个描述性名称并按
  `Enter` 即可创建文件夹。文件夹名称应具有足够的描述性以指示其内容。根据你的工作方式，考虑为不同的项目、文档类型或时间段创建文件夹。例如，`Documents`
  文件夹可能包含按不同年份、客户或项目分类子文件夹。


  嵌套文件夹创建了层级组织。在文件夹内创建子文件夹以进一步组织内容。例如，`Photos` 文件夹可能包含每个年份的子文件夹，每一年又包含针对不同活动或旅行的文件夹。


  要创建子文件夹，请先进入父文件夹，然后使用上述方法创建新文件夹。这将新文件夹放在当前位置内。


  当组织需要变化时，重命名文件夹可以更新它们的名称。右键点击文件夹并在右键菜单中选择“重命名”，或选择文件夹并按 `F2`。文件夹名称将变为编辑。输入新名称并按
  `Enter` 确认更改。


  在组织文件时，考虑你以后将如何搜索它们。将相关项分组在一起。保持活动项目易于访问，同时将完成的工作归档在日期日期文件夹中。不要创建层级过多且复杂的文件夹结构，因为这会让导航变得繁琐。


  ## 移动、复制与删除文件


  文件管理涉及在位置之间移动文件、创建副本以及移除不再需要的文件。文件管理器提供了这些操作多种方法。


  要移动文件，从视图区域点击并拖动到侧边栏中的目标文件夹或另一个文件管理器窗口。在拖动时，光标会变化以指示操作类型。在目标位置上释放鼠标按钮。文件将从原始位置移动到新位置。


  或者，右键点击文件并在右键菜单中选择“剪切”，导航到目标文件夹，右键点击空白处并选择“粘贴”。键盘快捷键 `Ctrl+X` 用于剪切文件，而 `Ctrl+V`
  用于粘贴文件。


  复制文件会创建副本，在保留原文件的同时在别处添加一个副本。按住 `Ctrl` 键并拖动文件进行复制而非移动。光标会显示加号，表示正在执行复制操作。或者，右键点击并选择“复制”（或按
  `Ctrl+C`），导航到目标并粘贴（`Ctrl+V`）。


  当复制或移动文件到已包含相同名称文件的位置时，会出现一个对话框询问如何处理冲突。选项包括覆盖现有文件、跳过操作、重命名新文件或比较文件以决定。根据传入的文件是否更新、更完整或仅仅是与现有版本不同来选择。


  删除文件会将其从你的系统中移除。选择文件并按 `Delete` 键将其移动到“回收站（Trash）”。或者，右键点击并选择“移动到回收站”。回收站中的文件尚未被永久删除，如果不小心删除了，可以恢复。


  要在不将其发送到回收站的情况下永久删除文件，请选择它们并按 `Shift+Delete`。确认对话框会警告此操作是不可逆转的。只有当你确定不再需要这些文件并想要立即释放磁盘空间时，才使用永久删除。


  `Trash` 文件夹出现在文件管理器的侧边栏中。打开它可以查看已删除的文件。要从回收站恢复文件，请右键点击它并选择“还原”。文件将返回原始位置。要永久移除回收站的所有内容，右键点击回收站图标并选择“清空回收站”。这将释放被删除文件占据的磁盘空间。


  处理多个文件时，在执行操作前选择它们。点击第一个文件，按住 `Shift` 然后点击最后一个文件以选择范围。按住 `Ctrl` 点击单个文件以选择特定文件。一旦选中，任何移动、复制或删除操作都适用于所有选中的文件。


  ## 搜索功能


  文件管理器的搜索功能帮助在你了解文件某些信息但不确定确切位置时定位文件。


  点击工具栏上的搜索图标或按 `Ctrl+F` 激活搜索。搜索框出现在视图区域顶部。输入搜索词并按 `Enter`。文件管理器将显示当前文件夹及其子文件夹中所有匹配的文件。


  搜索词可以是文件名的部分。输入“report”可以找到名称中任何包含该词的文件，例如“annual_report.pdf”、“sales_report_2024.doc”或“report_final.txt”。搜索不区分大小写，因此“Report”和“report”产生的结果相同。


  要搜索整个 `Home` 文件夹，请在开始搜索前导航到 `Home`。要进行更广泛的搜索，请导航到更高层级的文件夹。要缩小结果，请在搜索前进入文件夹结构的更深层。


  高级搜索选项按文件类型、修改日期或大小过滤结果。在输入基础搜索词后，点击选项图标以显示这些过滤器。将结果限制为文档、图像、视频或其他文件类型。指定日期范围以查找在特定时间范围内修改的文件。设置大小限制以查找占用磁盘空间的大文件或可能是文本笔记的小文件。





  侧边栏中的“最近文件”（Recent files）部分提供了另一种定位最近访问文件的方法。此视图显示了你最近打开的文件，无论它们存储在何处。当你记得昨天处理过某个文件但想不起它保存在哪里时，这个功能就特别有用。


  ## 文件属性与权限


  每个文件都拥有属性，包括大小、类型、创建日期和权限。理解这些属性有助于有效地管理文件。


  右键点击任何文件并选择 `Properties`（属性）查看详细信息。`Properties` 对话框显示多个不同信息类别的标签页。


  `Basic`（基本）标签页显示文件名、类型、大小、位置和修改日期。文件大小以人类可读的格式（KB、MB、 GB）和精确字节显示。创建日期指示文件首次创建的时间，而修改日期显示最后一次更改的时间。访问日期记录了最后一次打开的时间。


  文件类型指示了它是什么种的文件，以及默认由哪个应用程序打开它。常见类型包括文本文档、PDF 文件、各种格式的图像、视频文件和压缩包。可以通过点击“打开方式”（Open
  With）并选择不同的程序来更改默认应用程序。


  `Permissions`（权限）标签页控制谁可以读取、写入或执行文件。这些权限是 Linux 安全的核心。每个文件都有三个权限类别：所有者（owner）、组（group）和其他人（others）。所有者通常是创建文件的用户。组包含特定组中的其他用户。其他人指的是系统上的所有人。


  对于每个类别，可以授予三种权限：读取（read）允许查看文件内容，写入（write）允许修改或删除文件，执行（execute）允许将文件作为程序运行（适用于脚本和应用程序）。文档和图像等标准文件通常赋予所有者读写权限，赋予其他人只读。


  要修改权限，请使用 `Permissions` 标签页中的下拉菜单。为每个类别选择适当访问级别。更改在关闭 `Properties` 对话框时立即生效。在授予他人写入权限时要小心，这允许他们修改或删除你的文件。


  ## 使用外部驱动器


  USB 盘和外部硬盘等外部存储设备提供了便携存储和备份功能。Linux Mint 在大多数情况下会自动处理这些设备。


  当你插入 USB 盘时，系统会在几秒内检测到它。会出现一个通知确认驱动器已被识别，并会出现在文件管理器的侧边栏中。点击驱动器名称即可访问其内容。驱动器在文件管理器中的打开方式就像任何文件夹一样，允许你正常地复制、移动或删除文件。


  USB 盘通常使用 `FAT32` 或 `exFAT` 文件系统以兼容操作系统。这些文件系统具有局限性，例如 `FAT32` 的文件大小限制为 4 GB。如果你需要存储更大的文件，请将驱动器格式化为
  `exFAT` 或 Linux 原生文件系统（如 `ext4`）。注意 `ext4` 格式的驱动器在 Windows 上没有额外软件的情况下无法读取。


  要安全地移除外部驱动器，请在物理拔出之前点击侧边栏中驱动器名称旁弹出图标。这确保所有数据都已写入驱动器，且没有待处理的操作。在不弹出的情况下移除驱动器可能会带来数据损坏或丢失的风险。


  外部硬盘的功能与 USB 盘类似，但通常提供更大的容量。连接后它们出现在侧边栏，并可以用相同的方式访问。某些外部硬盘需要外部电源适配器，而另一些通过 USB 连接供电。


  如果外部驱动器没有自动出现，请检查物理连接。尝试不同的 USB 端口。如果驱动器仍未出现，它可能存在硬件问题或使用了不支持的文件系统。系统设置中的 `Disks`（磁盘）工具可以提供有关连接驱动器的更多信息。


  ## 云存储集成


  云存储服务允许访问存储在远程服务器上的文件，提供了备份功能和从多个设备访问的能力。


  多个云存储提供商提供 Linux 客户端或集成选项。流行的服务包括 Dropbox、Google Drive（通过第三方客户端）、Nextcloud 和 Mega。安装方法随服务而异。


  要使用 Dropbox，请从 Dropbox 网站下载 Linux 客户端。通过 `Software Manager`（软件管理器）或双击下载的文件进行安装。安装后，运行
  `Dropbox` 并登录你的账户。客户端会在你的 `Home`（家）目录中创建一个 `Dropbox` 文件夹。放置在此文件夹中的文件会自动同步到云端和其他设备。


  Google Drive 不提供官方 Linux 客户端，但存在第三方选项。`GNOME Online Accounts`（GNOME 在线账户）集成允许通过文件管理器访问
  Google Drive。在系统设置的 `Online Accounts`（在线账户）下启用此项。添加你的 Google 账户并启用 Drive 访问。你的 Google
  Drive 将出现在文件管理器侧边栏中，允许你直接访问存储的文件。


  Nextcloud 提供具有良好 Linux 支持的自托管云存储。如果你有 Nextcloud 账户（自托管或通过提供商），请从 `Software Manager`
  安装 `Nextcloud` 桌面客户端。使用你的服务器详情和凭据进行配置。与 Dropbox 类似，它会创建一个与云存储同步的本地文件夹。


  云存储文件存在两种状态：存储在计算机上的本地副本和云服务器上的远程副本。本地文件的更改会自动同步到云端。这提供了备份保护并允许从其他设备访问文件。然而，大量文件可能会消耗大量的本地磁盘空间。


  某些云客户端提供选择性同步，允许你选择哪些文件夹本地同步。这在节省本地存储空间的同时保持了对所有文件的云端访问。需要时通过网页界面访问未同步的文件。


  # 第 5 章：安装与管理软件


  ## 理解软件源


  Linux Mint 使用软件包管理系统简化了软件的安装和更新。理解该系统的工作原理有助于你安全、高效地安装软件。


  软件包包含编译后的程序、配置文件和关于软件的元数据。包管理器处理安装、跟踪依赖关系并确保软件与系统正确集成。这与从网站下载可执行文件不同，因为软件包来自受信任的仓库。


  软件仓库是托管软件包集合的服务器。Linux Mint 包含了几个拥有数千个应用程序的默认仓库。这些仓库经过安全审查，确保软件安装安全。官方仓库包括：


  - 主仓库（main repository）包含 Linux Mint 团队完全支持的免费开源软件。你将使用的大多数应用程序来自这里。

  - 基础仓库（base repository）提供来自 Ubuntu 的系统包。

  - 导入仓库（import repository）包含额外的包。

  - 上游仓库（upstream repository）直接从 Ubuntu 提供包。


  对于默认仓库未包含的特殊软件可以添加额外的仓库。个人软件包存档（`PPAs`）允许开发者发布尚未进入官方仓库的软件。虽然 `PPAs` 扩展了可用软件范围，但它们受到的审查比官方仓库少。请仅从信任的源添加
  `PPAs`。


  可以通过 `Software Sources`（软件源）工具管理软件源。通过系统设置或 `Software Manager` 访问它。该工具显示已启用的仓库并允许添加或删除源。大多数用户永远不需要修改默认源，因为它们提供了全面的软件覆盖。


  ## 使用软件管理器






  软件管理器（Software Manager）提供了一个用于浏览和安装软件的图形化界面。它展示了可用应用程序的描述、截图和用户评论。


  通过点击菜单中的图标或或搜索“软件管理器”来启动软件管理器。主窗口显示推荐应用程序和类别。推荐应用程序突出了热门或最近添加的软件。类别按用途组织应用程序：互联网、办公、图形、音频与视频、开发等。


  点击任何类别均可浏览该类别下的应用程序。每个应用程序都会显示其图标、名称和简短描述。界面会显示哪些应用程序已安装，通过复选标记或“移除”按钮而不是“安装”来指示。


  要查看应用程序的详情，请点击它。详情页显示完整描述、演示界面的截图、用户评论和评分、文件大小以及版本信息。其他 Linux Mint 用户的评论可以让你对真实性能和易用性有所了解。


  用户评分以星级形式显示，五星为最高评分。阅读评论可以理解用户给出特定评分的原因。某些应用程序获得了极评价，而另一些则被用户报告过。在相似应用程序之间进行选择时，请考虑这些评分。


  安装应用程序只需点击 `Install` 按钮。系统会要求密码以确认你想要安装软件。输入密码后，软件管理器将下载应用程序及其任何依赖项，然后自动安装所有内容。安装完成后会弹出通知。


  已安装的应用程序将出现在你的菜单中，并按相应的类别组织。你可以从那里启动它，或通过名称搜索它。最近安装的应用程序通常出现在菜单的“最近”部分，以便方便访问。


  ### 从软件管理器安装应用程序


  让我们通过安装几个实用的应用程序来演示这一过程，并介绍一些你可能可能需要的软件。


  GIMP（GNU 图像处理程序）提供了与商业替代品可比拟的强大图像编辑功能。打开软件管理器并搜索“GIMP”。点击 GIMP 结果并查看信息。点击 `Install`
  并在提示时输入密码。安装完成后，在菜单的“图形”类别中找到 GIMP。


  VLC 媒体播放器可以处理几乎任何视频或音频格式。在软件管理器中搜索“VLC”。列表显示它是一个多功能媒体播放器。使用与 GIMP 相同的流程安装它。安装后，VLC
  将出现在“音频与视频”类别中。


  LibreOffice 预装在 Linux Mint 中，但你可能需要额外的办公应用程序。WPS Office 提供了一个具有类似 Microsoft Office
  界面的替代方案。在软件管理器中搜索它，查看详情，并在需要时安装。请注意，某些替代方案可能不在默认仓库中，可能需要添加额外的软件源。


  对于通信，有多个即时消息客户端可用。Pidgin 同时支持多个聊天协议。如果你使用即时消息服务，请搜索“Pidgin”并安装它。安装后，使用你服务的账户详情对其进行配置。


  程序员可以使用开发工具。Visual Studio Code 是一款流行的代码编辑器，可以通过软件管理器安装。搜索“Code”并从结果中选择 Visual Studio
  Code。这将安装微软的全功能代码编辑器，适用于多种编程语言。


  生产力工具（如笔记应用）可以增强效率。Simplenote 提供了带云同步的基本笔记功能。Joplin 提供了更高级的功能，包括对 markdown 的支持。搜索笔记应用程序并安装一个符合你需求的。


  每个安装的应用程序都会向你的菜单添加条目、启动程序的快捷方式，并与你的系统集成。应用程序通过与操作系统更新相同的系统进行更新，确保你始终拥有带有安全补丁和新功能的最新版本。


  ### 更新你的系统


  定期的更新可以保持你的系统安全、稳定并配备最新功能。Linux Mint 通过更新管理器（Update Manager）让更新变得简单。


  更新管理器图标出现在你的系统托盘中，当可用更新时，它的外观会有所不同。当有更新待安装时，通知也会提醒你。点击更新管理器图标启动该程序。


  更新管理器按类型和重要性显示可用的更新。安全更新解决漏洞，应及时安装。内核更新影响核心系统，可能会提供更好的硬件支持或性能改进。应用程序更新为已安装的程序带来新功能和错误修复。


  每个更新都显示在列表中，显示包名、当前版本、可用版本以及更改的简短描述。某些更新列出了许多单独的包，因为它们影响了多个系统组件。


  更新级别表示每项更新的测试程度和稳定性。级别 1 和 2 的更新经过了广泛测试，被认为是安全的。级别 3 的更新经过中度测试。级别 4 和 5 的更新测试较少且存在潜在风险，尽管问题很少见。默认情况下，Linux
  Mint 显示级别 3 及以下的更新，以平衡稳定性和新颖性。


  要安装更新，请点击更新管理器窗口顶部的 `Install Updates`。系统会提示输入密码以授权系统更改。更新管理器随后下载并安装所有选定的更新。此过程所需的时间取决于更新的大小和你的网络速度。


  在更新期间，你可以继续使用计算机。大多数更新不需要中断你的工作。然而，某些更新可能会要求重启应用程序以使用新版本。内核更新需要完全重启系统才能生效，尽管可以将重启推迟到方便的时候。


  在重大更新（特别是内核更新）之后，请重启计算机以确保所有更改正确生效。更新管理器会指示何时建议重启。你不需要立即重启，但在下一次关机之前重启，以确保你的系统运行更新后的内核。


  ### 使用更新管理器


  更新管理器提供了控制更新行为和可见性的配置选项。


  通过点击 `Edit` 菜单并选择 `Preferences` 访问更新管理器偏好。几项设置可以自定义更新体验。


  自动刷新决定了更新管理器检查新更新的频率。选项从每小时到每周不等。每日检查提供了良好的平衡，确保你获知重要更新而无需频繁检查。


  更新频率不影响安全更新，安全更新至关重要。系统可以配置为自动应用安全更新而不提示。如果你希望以最少的人工干预获得最大的安全性，请在偏好中启用此项。自动安全更新会在后台静默安装，保护你的系统而无需关注。


  更新级别决定更新管理器显示哪些更新。默认情况下，显示级别 1 到 3。你可以调整此以显示更多或更少的更新。大多数用户应该坚持默认设置，这些设置提供了经过良好的更新，同时避免了可能有问题更新。


  当可用更新时，更新管理器可以显示桌面通知。通知设置控制是否提醒你以及显示的显著程度。某些用户倾向于显眼的通知，以确保不会错过重要更新。另一些用户则喜欢微妙的指示，可以在他们方便时查看。




  内核更新会被特殊对待，因为它们对系统运行至关重要。你可以配置是否接收内核更新通知，以及是手动选择内核还是自动接受建议。除非你有特定的技术需求，否则接受推荐的内核更新通常效果良好。


  ## 从终端安装软件


  终端提供了安装软件的另一种方法，这对于遵循在线指令或无法访问 GUI 工具时非常有用。`apt` 软件包管理器通过命令行界面处理软件安装。


  通过在菜单中搜索“Terminal”（终端）或按下 `Ctrl+Alt+T` 打开终端。终端会显示一个命令提示符，你可以在其中输入命令。


  要安装软件包，请使用 `sudo apt install` 命令后跟上包名。例如，要安装 `htop` 系统监控器，请输入：

  ```

  sudo apt install htop

  ```


  输入命令后按回车。系统会提示你输入密码，因为安装软件需要管理员权限。输入密码（出于安全考虑，输入时屏幕不会显示字符）并按回车。


  `apt` 系统会计算依赖关系，确定需要哪些额外的包。它会显示将安装的内容以及安装需要多少磁盘空间。系统会弹出提示进行确认。输入 `y` 并按回车继续。


  终端会显示下载进度和安装状态。完成后，提示符返回，表示安装成功完成。新安装的应用程序将出现在你的菜单中，或者可以在终端中输入其名称来运行。


  要通过终端删除软件，请使用 `sudo apt remove` 后跟上包名。例如：

  ```

  sudo apt remove htop

  ```


  要通过终端更新所有软件包，首先使用以下命令更新包列表：

  ```

  sudo apt update

  ```


  然后使用以下命令升级所有软件包：

  ```

  sudo apt upgrade

  ```


  这些命令等同于图形化使用“软件管理器”和“更新管理器”。使用你偏好的方法即可。对于经验丰富的用户来说，终端方法更快，而且在遵循技术文档时是必要的。


  ## 不需要的应用程序


  随着时间的推移，你可能会安装一些不再使用的应用程序。删除它们可以释放磁盘空间并让菜单更整洁。


  软件管理器处理卸载的操作与安装一样简单。搜索你想要删除的应用程序。如果它已安装，详情页将显示“移除”按钮而不是“安装”。点击“移除”并在提示时确认。应用程序将被卸载，其菜单项也会消失。


  某些应用程序在卸载后仍会保留额外的数据或配置文件。这些文件通常占用空间极小，并被保留以防你以后重新安装该程序。如果你也想删除这些文件，请使用终端命令：

  ```

  sudo apt purge package-name

  ```


  这会完全删除应用程序及其配置文件。


  Linux Mint 预带的预装应用程序如果你不需要它们，也可以删除。但是，在删除系统组件时要小心。请只删除你认识并确定不需要的应用程序。软件管理器通常会防止删除核心系统组件。


  ## 管理已安装的软件


  软件管理器提供了所有已安装软件的视图，对于查看系统中安装了哪些内容很有帮助。


  在软件管理器中，点击“已安装”（Installed）部分查看所有已安装的应用程序。此列表包含了通过软件管理器和其他方法安装在你的系统上的所有内容。


  该列表显示了每个应用程序的名称、版本号、安装大小和简要描述。你可以按名称、大小或安装日期进行排序。按大小排序有助于识别占用大量磁盘空间的大程序。


  每个应用程序条目都包含一个显示安装来源的指示器。来自官方仓库的应用程序显示为受信任。来自 PPA 或或其他来源的应用程序会显示不同的指示器。这有助于你跟踪软件来源，对于排排除故障或评估安全性很有用。


  某些应用程序接收更新的频率比其他程序高。“已安装”视图显示了每个应用程序上次更新的时间，帮助你识别可能不再活跃维护的软件。非常过时的软件可能存在安全漏洞，因此考虑删除不再接收更新的闲置应用程序。


  # 第 6 章：互联网与通信


  ## 设置网络连接


  可靠的互联网连接对于大多数计算任务至关重要。Linux Mint 为有线和无线连接的网络配置变得非常简单。


  有线以太网连接通常会自动工作。将来自路由器或调制解调器的以太线插入电脑的网络端口。几秒钟后，系统托盘中的网络图标将显示已建立连接。在大多数使用 `DHCP`（动态主机配置协议）进行自动网络设置的家庭和办公室网络中不需要任何配置。


  如果自动配置不起作用，可能需要手动设置网络。右键点击网络图标并选择“网络设置”。点击你的有线连接并选择设置图标。默认情况下，`IPv4` 设置为自动（`DHCP`）。如果你的网络需要手动配置，请将其更改为手动，并输入由网络管理员提供的
  IP 地址、子网掩码、网关和 DNS 服务器。


  无线连接需要选择你的网络并输入密码。点击系统托盘中的网络图标显示可用的无线网络。网络以列表出现，带有名称（SSIDs）和信号强度指示器。信号越强，填充的线条越多。


  点击列表中的你的网络名称。如果网络是加密的（大多数都是），对话框会提示输入密码。按照无线路由器上的配置精确输入密码，注意大写字母、数字和特殊字符。密码是区分大小的，因此
  `"Password123"` 与 `"password123"` 不同。


  如果你希望 Linux Mint 在每次进入范围内都加入此网络，请启用“自动连接”。此便利功能对于家庭和办公室网络效果良好，但在公共网络上应谨慎使用。


  输入正确的凭据后，点击连接。系统会在几秒内建立连接。网络图标会更新以显示信号强度。通知将确认连接成功。


  尽管凭据正确但连接仍然失败，可能有几个原因。路由器可能太远，导致信号微弱。墙壁等物理障碍会干扰无线信号。尝试靠近路由器。如果附近有很多网络使用相同的信道，无线信道可能会拥堵。访问你的路由器管理界面以选择不同的信道。


  某些网络使用 MAC 地址过滤，要求网络管理员在允许连接之前授权你电脑特定的硬件地址。如果你能看到网络但即使使用正确凭据也连接，可能是 MAC 过滤处于激活状态。将你的
  MAC 地址（可在网络设置中查看）提供给管理员进行授权。


  ### 使用 Firefox 浏览器


  Firefox 作为 Linux Mint 的默认浏览器预预装的。它提供了快速、安全的网页浏览体验以及广泛的自定义选项。


  从菜单中的“互联网”类别启动 Firefox，或者如果你已将其添加到面板，则点击其图标启动。浏览器将打开到默认启动页，显示经常访问的网站和快捷方式。


  顶部的地址栏具有双重作用。直接在其中输入网页地址（`URLs`）以导航到特定网站。输入搜索词使用你的默认搜索引擎进行网络搜索。Firefox 能够智能地区分地址和搜索。




  书签可以保存您经常访问的网站链接。要书签页面，请点击地址栏右侧的星形图标。弹出的对话框允许为书签命名并选择保存位置。书签可以组织在文件夹中以便更好地管理。可以通过书签菜单或点击工具栏上的书签图标访问书签。


  多标签页允许您同时查看多个网站，而无需打开多个窗口。点击现有标签页旁加号图标或按下 `Ctrl+T` 可打开新标签页。点击标签或使用 `Ctrl+Tab` 在标签页之间切换。点击每个标签上的
  `X` 或按下 `Ctrl+W` 关闭标签页。


  浏览器历史记录了您访问过的网站。可以通过历史记录菜单或按下 `Ctrl+H` 访问。历史记录允许您返回之前访问过的站点，而无需记住具体地址。如果您想出于隐私删除浏览记录，可以通过设置清除历史记录。


  Firefox 包含了保护您在线活动的隐私功能。隐私浏览模式不会保存历史记录、Cookie 或临时文件。从文件菜单或按下 `Ctrl+Shift+P` 打开隐私窗口。在访问敏感信息或使用共享计算机时，请使用隐私浏览。


  增强型跟踪保护可以阻止许多跨网站跟踪您活动的广告跟踪器和脚本。这提高了隐私性，并通常会加快页面加载。通过点击地址栏中的盾牌图标访问这些设置。


  扩展程序为 Firefox 增加了功能。点击菜单按钮（三条横线）并选择“扩展程序和主题”来浏览可用扩展程序。热门选项包括密码管理器、广告拦截器和生产力工具。请谨慎安装扩展程序，仅选择来自信任开发者的，因为扩展程序对您的浏览活动具有很大的访问权限。


  设置可以自定义 Firefox 的行为。可以通过偏好下的菜单访问设置。设置控制主页、默认搜索引擎、隐私选项、下载位置以及许多其他偏好。探索这些设置以根据您的喜配置
  Firefox。


  ## 电子邮件设置与管理


  电子邮件仍然是核心通信工具。Linux Mint 包含了功能全电子邮件客户端 Thunderbird，尽管您也可以通过浏览器访问电子邮件。


  从网络分类下的菜单启动 Thunderbird。首次运行时，设置向导将引导您添加电子邮件帐户。输入您的姓名、电子邮件地址和密码。Thunderbird 会尝试对
  Gmail、Outlook 和 Yahoo 等常用电子邮件提供商进行自动配置。


  如果自动配置成功，Thunderbird 将使用正确的服务器设置配置您的账户。点击继续完成设置。您的电子邮件将下载并显示在主窗口中。


  如果自动配置失败，则需要手动设置。您需要电子邮件提供商的服务器信息：入站服务器地址（`IMAP` 或 `POP3`）、出站服务器（`SMTP`）、端口号和连接安全设置。电子邮件提供商通常会在其帮助部分记录这些设置。


  `IMAP` 和 `POP3` 是接收电子邮件的不同协议。`IMAP` 在设备间同步电子邮件，将消息留在服务器上。多个设备可以访问相同的电子邮件，并且在一个设备上进行的更改会反映在其他设备上。`POP3`
  将电子邮件下载到您的计算机并通常从服务器上删除。`POP3` 适用于单设备用户，而 `IMAP` 更适合从多个位置访问电子邮件。


  帐户设置后，Thunderbird 显示您的文件夹结构。收箱接收新消息。已件箱存储您发送的邮件副本。草稿保存您已开始但尚未发送的消息。垃圾箱包含已删除的电子邮件。您可以创建自定义文件夹来组织消息。


  要撰写新消息，请点击写信按钮。将出一个出一个窗口，包含收件人、主题和消息正文的字段。在 `To` 字段中输入收件人的电子邮件地址。多个收件人可以用逗号分隔。`Cc`
  字段将副本发送给额外的收件人，所有人可见。`Bcc`（密抄）发送副本而不向他人透露收件人地址。


  在大型文本区域中编写您的消息。工具栏提供了格式选项，包括字体选择、大小、颜色、粗体、斜体和下划线。您还可以创建项目列表并调整文本对齐。


  要附加文件，点击添加按钮并导航到您想要发送的文件。文件将附加到消息中。请注意文件大小，某些电子邮件提供商限制附件大小为 25MB 或更小。对于较大的文件，请考虑使用云存储并共享链接。


  点击发送传输消息。它将移动到已发送文件夹并递交给收件人。递送时间不等，但通常是实时的或在几分钟内完成。


  ## 即时消息应用程序


  实时文本通信通过即时消息进行。Linux Mint 上有多个应用程序提供此功能。


  Pidgin 是一款多功能的即时消息客户端，支持包括 Google Talk、XMPP 和 IRC 在内的多种协议。通过软件管理器搜索“Pidgin”来安装它。安装后，从网络分类启动它。


  首次运行时，Pidgin 会要求您添加帐户。点击“添加”开始。从下拉列表中选择您的聊天协议。输入您的帐户凭据。不同的协议需要不同的信息，但通常您需要用户名和密码。输入信息后，点击“添加”。


  Pidgin 的主窗口显示您的好友友列表（联系人）。当联系人在线时，他们会出现在列表中。双击联系人打开对话窗口。在下方的字段中输入消息并按回车发送。对话显示在上方区域，并带有时间戳。


  Telegram Desktop 提供了对 Telegram 消息服务的访问。通过软件管理器安装它。安装后，启动 Telegram Desktop 并使用手机号码登录。Telegram
  将通过短信发送验证码。输入代码以访问您的帐户。


  Telegram 界面左侧显示您的对话列表，右侧显示活动会话。点击任何对话以查看消息。在底部的字段中输入新消息并按回车发送。Telegram 支持照片共享、语音消息、文件传输和群聊。


  Signal 是一款注重隐私的聊天应用，支持桌面版。通过软件管理器安装 Signal Desktop。通过扫描应用程序中显示的 QR 码将其与您的手机关联。这将同步手机和电脑之间的对话。


  Discord 服务于游戏和社区通信。通过软件管理器安装 Discord。安装后，使用您的帐户凭据登录。Discord 在左侧显示服务器，中间左侧显示所选服务器内的频道，主区域显示对话内容。


  ## 视频会议工具


  视频通话已成为远程工作以及与远方亲友保持联系至关重要。


  Zoom 广泛用于专业视频会议。访问 `zoom.us` 并下载 Linux 客户端。下载后，使用软件安装工具打开文件并安装。启动 Zoom 并登录或作为访客加入会议。


  要加入会议，点击加入并输入主机提供的会议 ID。如果会议需要密码，系统将提示您输入。加入后，您的摄像头和麦克风应会自动激活，尽管您可以使用窗口底部的按钮进行控制。


  在会议期间，控制功能允许您静音/取消麦克风、启动/停止视频、共享屏幕、打开聊天和查看参与者。屏幕共享功能让其他人看到您的桌面，这对于演示或协作非常有用。





  Skype 提供视频通话和即时消息功能。通过软件管理器搜索“Skype”即可进行安装。安装完成后，启动它并使用您的微软账户登录。您的联系人将显示在左侧面板。


  要开始视频通话，选择一个联系人并点击视频通话按钮。对方将收到通知并接受通话。通话期间，类似于 Zoom 的控件可以管理音频、视频和屏幕共享。


  Google Meet 完全在浏览器中运行，无需安装。在 Firefox 中访问 `meet.google.com`。如有必要，使用您的 Google 账户登录。可以使用会议代码或链接启动新会议或加入现有会议。


  像 Google Meet 和 Zoom 网页版这类基于浏览器的工具提供了无需安装额外软件的便利。然而，专用应用程序有时会提供更好的性能和更多功能。


  ## 社交媒体应用


  虽然大多数社交媒体平台通过网络浏览器访问，但 Linux 上也有一些专用的应用程序。


  可以通过网络浏览器或 `Corebird` 等第三方应用程序使用 Twitter。`twitter.com` 的网页界面提供完整的功能，包括阅读推文、发布状态、直接消息和管理您的个人资料。


  Facebook 同样可以通过 `facebook.com` 上的浏览器良好运行。网页界面提供了对所有 Facebook 功能的完整访问。基于浏览访问意味着您无需更新应用程序即可始终拥有最新功能。


  LinkedIn、Instagram 以及其他社交平台在桌面系统上主要通过网络浏览器访问。它们的网站提供了针对桌面查看优化的完整功能。


  ## 下载管理


  Firefox 包含一个内置的下载管理器，可以处理大多数下载 需求。当您点击下载文件的链接时，Firefox 会显示下载进度指示。通过工具栏上的下载按钮（箭头图标）访问所有下载内容。


  下载的文件默认保存到您的 `Downloads` 文件夹中。您可以在 Firefox 设置中的 `General`，然后 `Files and Applications`
  下更改此位置。某些用户倾向于将文件下载到 `Desktop` 以便方便访问，而另一些用户则将下载内容组织到特定的项目文件夹中。


  对于更高级的下载管理，`uGet` 等应用程序提供了额外功能。`uGet` 支持多并行下载、中断下载的断点续传、下载调度和下载队列。如果您频繁下载大文件或需要这些高级功能，请通过软件管理器安装
  `uGet`。


  # 第 7 章：办公生产力


  ### LibreOffice 套件概述


  LibreOffice 是一个全面的办公套件，提供文字处理、电子表格、演示文稿等应用程序。它随 Linux Mint 预装，并与 Microsoft Office
  格式兼容。


  该套件包含多个应用程序：用于文字处理的 `Writer`、用于电子表格的 `Calc`、用于演示的 `Impress`、用于图表的 `Draw`、用于数学公式的
  `Math` 以及用于数据库管理的 `Base`。大多数用户主要使用 `Writer`、`Calc` 和 `Impress`。


  LibreOffice 使用开放文档格式 (`ODF`) 作为其原生文件格式。这些格式（文档的 `.odt`、电子表格的 `.ods`、演示的 `.odp`）是国际标准。LibreOffice
  还能以高兼容性打开和保存 Microsoft Office 格式（`.docx`, `.xlsx`, `.pptx`），尽管复杂的格式偶尔可能会不同。


  界面类似于传统的办公应用程序，具有菜单、工具栏和格式选项。熟悉旧版本 Microsoft Office 用户会发现 LibreOffice 非常亲切。其布局优先考虑功能而非美学，提供了对常用功能的快速访问。


  ### 使用 Writer 创建文档


  LibreOffice `Writer` 处理所有文字处理需求，从简单的信件到带有表格、图像和格式的复杂文档。


  从 `Office` 类下的 `Menu` 启动 `Writer`，或打开 LibreOffice 套件并选择 `Writer Document`。会出现一个空白文档，准备好打字。


  界面顶部有一个菜单栏，包含 `File`、`Edit`、`View`、`Insert`、`Format`、`Styles`、`Table`、`Form`、`Tools`、`Window`
  和 `Help` 菜单。菜单下方是带有常用格式选项的工具栏，如字体选择、大小、粗体、斜体、下划线和文本对齐。


  在文档任何地方开始打字。文本会自动流向，并在到达右边距时换行。按 `Enter` 开启新段落。默认格式使用 12 点的 `Liberation Serif` 字体并采用左对齐。


  要更改文本格式，请先通过点击并拖动文本来选中它。选中文本后，使用工具栏按钮应用格式。字体下拉菜单更改字体，尺寸下拉菜单调整字号，按钮则应用粗体、斜体和下划线样式。


  文本对齐控制行在页边距内的位置。左对齐（默认）创建整齐的左边缘和不规则的右边缘，适用于大多数文档。居中对齐将文本放在中间，用于标题。右对齐创建整齐的右边缘，偶尔用于日期或地址。两端对齐通过调整单词间距使两个边缘都整齐，创建出书籍和专业文档中使用的正式外观。


  列表可以清晰地组织信息。项目列表使用符号标记项目，而编号列表使用顺序数字。要创建列表，点击工具栏中的项目或编号按钮，然后输入列表项目，每项输入后按 `Enter`。下一行将自动继续列表格式。按两次
  `Enter` 结束列表并返回普通段落。


  图像增强了文档的视觉效果。要插入图像，将光标置于想要图像的位置，点击 `Insert` 菜单并选择 `Image`。导航到图像文件并点击 `Open`。图像将出现在文档中。点击图像选中它，然后拖动角手柄等比例调整大小。右键点击图像并选择
  `Properties` 以访问高级选项，如文本环绕，它可以控制文本如何绕过图像流。


  表格按行和列组织信息。要插入表格，点击 `Table` 菜单并选择 `Insert Table`。指定所需的行和列数。表格出现在文档中，单元格已准备好内容。点击任何单元格进行输入，然后按
  `Tab` 移动到下一个单元格。`Table` 菜单提供了添加或删除行列、合并单元格、调整边界和应用阴影的选项。


  页面格式控制边距、方向和大小。通过 `Format` 菜单下的 `Page` 访问这些设置。标准文档使用纵向（高），而横向（宽）适用于水平延伸的表格或图表。边距定义了页边缘的空白区域。默认边距适用于大多数文档，但您可以根据特定需求进行调整。


  页眉和页脚放置每页重复出现的内容，如文档标题、页码或日期。通过 `Insert` 菜单插入它们。页眉出现在页面顶部，页脚出现在底部。常见用途包括将您的姓名和文档标题放在页眉，页码放在页脚。


  样式保持整个文档格式的一致。与其手动格式化每个标题或段落，不如应用预定义的样式。左侧的 `Styles` 面板显示可用样式。点击样式将其应用于选中的文本。这确保所有标题看起来完全相同，并允许通过修改样式定义来更改整个文档的外观。





  点击 `File` 菜单并选择 `Save`，或按 `Ctrl+S` 保存您的文档。选择位置、输入文件名并选择文件格式。默认的 `.odt` 格式适用于在 LibreOffice
  中继续编辑。如果与 Microsoft Word 用户共享，请选择 `.docx`。工作时定期保存，以防止意外关机或崩溃导致数据丢失。


  ## 在 Calc 中处理电子表格


  LibreOffice Calc 处理从简单计算到复杂数据分析的电子表格任务。从 Office 类别启动它，或在打开 LibreOffice 时选择 `Spreadsheet`。


  Calc 显示由列（标记为 `A`、`B`、`C`）和行（编号为 `1`、`2`、`3`）组成的单元格矩阵。每个单元格都有唯一的列字母和行数字地址，例如 `A1`
  或 `C5`。点击任意单元格即可进行数据输入。


  点击单元格并输入即可。按 `Enter` 确认输入并向下移动一格，或按 `Tab` 向右移动。单元格可以包含文本、数字、日期或公式。Calc 会解释你输入的内容，适当格式化数字并自动识别日期。


  公式根据单元格内容执行计算。所有公式均以等号开头。将单元格 `A1` 和 `A2` 中的数字相加，点击单元格 `A3` 并输入：`=A1+A2`


  按 `Enter` 总和出现在 `A3` 中。单元格显示结果，而顶部的公式栏显示底层公式。常用的运算符包括用于加法的 `+`、用于减法的 `-`、用于乘法的 `*`
  和用于除法的 `/`。


  函数是用于常用计算的预建公式。`SUM` 函数用于多个单元格。要对单元格 `A1` 到 `A10` 求和，请输入：`=SUM(A1:A10)`


  冒号 `:` 表示从第一个单元格到最后一个单元格的范围。其他实用函数包括用于计算平均值的 `AVERAGE`、用于查找最高最低值的 `MAX` 和 `MIN`，以及用于计数数字输入的
  `COUNT`。


  单元格格式化可以调整外观。选择单元格并使用工具栏按钮应用加粗、更改字体大小、调整文本颜色或修改背景颜色。数字格式控制值的显示方式。选择包含货币的单元格并应用货币格式以显示美元符号和两位小数。


  列宽和行高会调整以适应内容。将鼠标指针置在列标题之间的边界上，直到它变成调整大小的光标。点击并拖动以调整宽度。双击边界将自动调整列宽以适应其内容。


  图表以图形方式可视化数据。选择您想要制作图表的数据，然后点击 `Insert` 菜单并选择 `Chart`。向导将引导您选择图表类型（柱状图、折线、饼图等）、配置数据范围并自定义外观。当底层数据更改时，图表会自动更新。


  冻结行或列以便在滚动查看大型电子表格时保持其可见。这有助于在处理超出屏幕的数据时保持上下文。点击 `View` 菜单，选择 `Freeze Rows and Columns`，并选择要冻结的行或列。


  ## 使用 Impress 创建演示文


  LibreOffice Impress 为会议、演讲或任何需要视觉幻灯片的情况创建演示文稿。从 Office 类别启动它，或在 LibreOffice 中选择
  `Presentation`。


  Impress 打开时会显示 `Presentation Wizard`。选择空白演示文稿从零开始，或选择提供预设布局和配色方案的模板。模板可以加快常见演示文稿类型的创建速度。


  每张幻灯片都包含内容的占位符。点击占位符添加标题、文本、图像或其他元素。第一张幻灯片通常使用标题幻灯片布局，留有演示标题和副标题的占位符。


  使用 `Slide` 菜单或工具栏按钮添加新幻灯片。选择适合幻灯片内容的布局。`Title and Content` 布局提供标题区域以及文本或图形空间。`Two
  Content` 布局创建两个并排的内容区域，适用于比较。


  点击文本占位符并输入以输入文本。使用 Writer 中熟悉的工具格式化文本，包括字体选择、大小、加粗、斜体和颜色。保持幻灯片上的文本简洁。演示文稿在简短的要点辅以您的口头说明时效果最佳。


  通过 `Insert` 菜单插入图像。通过拖动对位置并调整图像大小。图像使演示文稿更具吸引力，并有助于说明概念。确保图像与您的内容相关，且质量足够以便在投影屏幕上清晰显示。


  切换效果控制幻灯片从一张移动到下一张的方式。通过右侧的 `Slide Transition` 面应用切换效果。选项从简单的剪切到复杂的动画不等。谨慎使用切换效果，因为过多的动画会分散内容的注意力。一致的简单切换可以保持专业性。


  通过 `Animation` 面板为单个幻灯片元素添加动画。元素可以逐渐出现，逐个强调重点。同样，节制是关键。动画应该增强交流，而不是成为焦点。


  演讲者备注提供了您可见但观众不可见的提醒。在 `Normal` 视图下，在每张幻灯片下空间添加备注。在演示期间，备注显示在您的屏幕上，而观众只看到幻灯片。


  点击 `Slideshow` 菜单并选择 `Start from First Slide` 幻灯片，或按 `F5`。按 `Escape` 退出模式。


  ## PDF 管理


  `PDF`（便携文档格式）文件在不同系统中保持格式，是共享文档的理想选择。Linux Mint 包含了查看和创建 PDF 的工具。


  默认文档查看器会在双击时打开 PDF。它显示页面、允许缩放并提供导航工具。


  LibreOffice 可直接从任何文档创建 PDF。在 `Writer`、`Calc` 或 `Impress` 中完成文档后，点击 `File` 菜单并选择
  `Export as PDF`。配置选项包括页面范围、图像质量以及是否包含签。点击 `Export`，选择位置和文件名并保存 PDF。


  PDF 的创建完整保留了在 LibreOffice 中显示的文档格式。无论接收者的操作系统如何或是否安装了 LibreOffice，看到的布局都是相同的。这使得
  PDF 成为表单、报告和任何需要精确格式文档的完美选择。


  某些 PDF 是可填充表单，带有输入信息的字段。文档查看器允许填充这些字段。在文本框中输入、勾选框并选择单选按钮。完成表单后，保存填充后的版本。


  ## 日历和任务管理


  组织预约和任务可以提高效率。Linux Mint 支持多个日历应用程序。


  `GNOME Calendar` 提供直接的日历功能。通过 `Software Manager` 搜索 `Calendar` 安装它。安装后，从 Office
  类别启动它。


  日历打开时显示月视图。点击任何日期添加事件。输入事件标题、开始时间、结束时间和可选备注。保存事件，它将出现在日历上。颜色编码有助于区分不同的事件类型。


  事件可以按计划重复。在创建事件时，启用重复并指定每天、每周或每月循环。这对于定期会议或循环任务非常有效。


  日历通过 `GNOME Online Accounts` 与在线日历服务集成。在系统设置的 `Online Accounts` 下添加您的 Google 或其他日历账户。事件在您的计算机和在线日历之间同步，保持跨设备的时间表一致。


  `Evolution` 提供了更全面的组织工具，在了一个应用程序中包含电子邮件、日历、联系人和任务。如果您需要集成的个人信息管理，请通过 `Software Manager`
  安装它。






  ## 笔记应用


  数字笔记可以记录想法、会议记录和信息以备日后参考。


  GNOME Notes 提供了简单的笔记创建功能。可以通过软件管理器安装它。该界面以卡片形式显示笔记。点击加号按钮创建新笔记。可以自由输入并支持自动格式化。笔记会自动保存，无需手动保存操作。


  笔记支持基础格式，包括**粗*****斜体*和列表。它们是可以搜索的，因此即使有许多笔记，也能快速找到信息。简单的界面消除了干扰，让你专注于内容捕捉。


  对于更高级的笔记需求，Joplin 提供了许多功能，包括支持 markdown、通过笔记本进行笔记组织、标签以及与云服务的同步。可以通过软件管理器安装 Joplin。它适合管理大量笔记合集或希望在设备间进行同步的用户。


  # 第 8 章：多媒体管理


  ### 播放音频文件


  Linux Mint 包含了几个音频播放应用程序。预装的音乐播放器可以处理大多数音频格式，包括 `MP3`、`FLAC`、`OGG` 和 `AAC`。


  从菜单中的“音频与视频”类别启动音乐播放器。界面会显示你的音乐库、播放列表和播放控制。首次启动时，库可能是空的，直到你添加音乐。


  要添加音乐，点击汉堡菜单并选择 `Preferences`（首选项）。在 `Music Folders`（音乐文件夹）下，添加包含音乐文件的目录。播放器会扫描这些位置并将音频文件导入库。


  库按艺术家、专辑和歌曲对音乐进行组织。浏览各个类别以查找音乐。点击任何歌曲开始播放。标准播放控制包括播放/暂停、跳进/后退、音量调整以及随机播放/重复选项。


  创建播放列表以对相关歌曲分组。右键点击歌曲并将它们添加到新或现有的播放列表中。播放列表允许根据不同的心情或活动自定义收听体验。


  ### 管理音乐合集


  随着音乐库的增长，组织工作变得非常重要。适当的文件命名和文件夹结构有助于管理合集。


  在你的“音乐”文件夹中，按艺术家和专辑组织音乐文件。为每个艺术家创建一个文件夹，并为他们的专辑创建子文件夹。在专辑文件夹内，将音频文件放入其中，文件名包含曲目编号以确保排序正确。


  音频文件包含元数据标签，存储了艺术家名称、专辑标题、曲目编号流派等信息。音乐播放器读取这些标签来自动组织库。通过在音乐播放器中编辑或使用专用的标签编辑器程序，确保标签正确。


  许多音乐播放器支持导入 CD。插入 CD 后，播放器会提示将曲目提取（复制）到你的硬盘。它可以从在线数据库检索曲目信息并保存带有正确标签的音频文件。


  ### 视频播放


  VLC 播放器可以处理几乎任何视频格式。如果你还没有安装，可以在软件管理器中搜索“VLC”来获取。


  从“音频与视频”类别启动 VLC。界面包括一个大型查看区域和播放控制。点击 `Media`（媒体）菜单并选择 `Open File`（打开文件）打开视频文件，或直接将视频文件拖入窗口。


  VLC 可以播放 `MP4`、`MKV`、`AVI` 和 `MOV` 等常见格式，无需安装额外的解码器。播放控制类似于熟悉的播放器，具有播放/暂停、时间轴滚动、音量控制和全屏切换功能。


  字幕增强外语视频或提高可访问性。如果存在独立的字幕文件，可以通过点击 `Subtitle`（字幕）菜单并选择 `Add Subtitle File`（添加字幕文件）进行加载。VLC
  也会自动内置字幕。通过 `Subtitle` 菜单启用或禁用它们。


  VLC 包含了高级功能，如播放速度调整、视频效果和音频均衡器。可以通过 `Tools`（工具）菜单访问这些功能。播放速度的变化对于语言学习或快速复习长视频很有用。


  ### 照片查看与基础编辑


  双击图像文件时会打开默认图像查看器。它显示照片，并带有缩放、旋转和在文件夹中的多张图像之间导航的控件。


  对于基础编辑，GIMP 提供了全面的图像处理能力。如果尚未安装，请通过软件管理器安装。GIMP 可以处理从简单裁剪到复杂照片修饰的各种任务。


  启动 GIMP 并通过 `File`（文件）菜单打开图像。界面在中心显示图像，侧面带有工具箱。左侧的工具箱包含选择工具、绘画工具和变换工具。


  使用裁剪工具裁剪图像。从工具箱中选择它，然后在图像上点击并拖动以定义裁剪区域。通过拖动边缘或角来调整选择。按 `Enter` 完成裁剪，移除选择区域之外的内容。


  调整图像尺寸以用于网页或打印。点击 `Image`（图像）菜单并选择 `Scale Image`（缩放图像）。以像素输入新尺寸或按百分比调整。确保“链”图标已链接以保持宽高比，防止变形。


  通过 `Colors`（颜色）菜单调整亮度、对比色彩平衡。这些调整可以改进太暗、太亮或有色偏的照片。在应用之前进行细微调整并预览结果。


  ### 屏幕录


  捕捉屏幕活动对于创建教程、记录过程或录制视频通话很有用。


  SimpleScreenRecorder 提供了简单的录屏功能。可以通过软件管理器安装它。安装后，从“音频与视频”类别启动它。


  界面引导你完成录制设置。首先选择录制内容：整个屏幕、特定窗口或选定区域。对于教程，录制整个屏幕可以确保无遗漏。对于特定应用程序，选择该窗口。


  接下来配置音频录制。选择录制系统音频、麦克风输入、两者或两者都不。录制系统音频可以捕捉应用程序的声音。麦克风输入添加你的语音旁白。两者结合非常适合教程。


  设置输出位置和文件名。选择一个有可用空间的地方，因为视频文件可能很大。选择一种视频格式，`MP4` 是一个广泛兼容的选择。


  点击 `Start Recording` 开始。倒计时会为你留出准备时间。执行你想录制的动作。完成后点击 `Stop Recording`。视频文件将保存到你指定的地点，准备好共享或编辑。


  ### 音频录制


  录制音频对于播客、语音备注或音乐录制是必要的。


  GNOME Sound Recorder 提供了简单的音频录制功能。如果没有预装，请通过软件管理器安装。从“音频与视频”类别启动它。


  界面非常极简，有一个巨大的录制按钮。点击它开始录制。应用程序会在录制时显示波形，提供音频电平的视觉反馈。完成后点击 `Stop`。


  录制内容将时间戳作为文件名自动保存。可以在应用程序内播放或或其他音频播放器中打开它们。对于更高级的音频录制和编辑，考虑安装 `Audacity`，它提供了多轨道录制、特效和详细的编辑功能。


  ### 流媒体传输


  流媒体服务提供了海量娱乐库的访问。大多数流媒体平台通过网络浏览器工作。


  Netflix、Hulu、Disney+ 和类似服务只需要网络浏览器和订阅。在 `Firefox` 中访问它们的网站，登录并直接播放内容。视频质量会根据你的连接速度自动调整。


  对于音乐流媒体，Spotify 提供了可以通过浏览器访问的网页播放器。访问 `open.spotify.com`，登录并访问你的播放列表和推荐。某些流媒体服务提供了通过软件管理器提供的专用
  Linux 应用程序。





  YouTube 在 Firefox 中运行非常流畅。该浏览器支持现代视频解码器，提供高质量的播放体验。对于在 YouTube 上花费大量时间的用户，浏览器扩展可以通过阻止广告或添加功能来增强体验。


  # 第 9 章：系统维护与优化


  ### 保持系统更新


  定期更新可以维护系统的安全性和稳定性。`Update Manager` 使这一过程变得简单。


  在 `Update Manager` 偏好中启用自动检查更新。这可以确保你及时收到重要更新通知。应该尽快安装安全更新，因为它们可以防止已知漏洞攻击。


  内核更新改进了硬件支持并修复了漏洞。Linux Mint 的内核更新方法平衡了稳定性与新性。`Update Manager` 会推荐合适的内核版本。除非你有特定的技术需求，否则请接受推荐的内核。


  安装更新后，如果提示，请重启电脑。内核更新特别需要重启才能生效。应用程序更新通常会立即生效，无需重启。


  ### 磁盘清理与管理


  随着时间的推移，系统会积累不必要的文件。定期清理可以释放空间并提高性能。


  `Disk Usage Analyzer` 将存储消耗情况可视化。你可以从 `Menu` 中的 `System Tools` 启动它。它会扫描你的文件系统并以饼图或树图的形式显示结果。大文件夹一目可见，有助于识别哪些占用了空间。


  常见的空间占用者包括 `Downloads` 文件夹、`Trash`（垃圾箱）和缓存文件。定期检查 `Downloads` 文件夹，将文件移动到合适的位置或删除不再需要的。清空
  `Trash` 以永久删除已删除的文件并释放空间。


  包管理器缓存存储了下载的安装文件。安装软件后，这些文件仍留在缓存中。使用终端命令清除缓存：

  ```bash

  sudo apt clean

  ```


  这会移除缓存的包文件，可能释放数百兆字节的空间。


  ### 管理启动应用程序


  配置为在登录时自动启动的应用程序会减慢启动速度并消耗资源。


  通过 `System Settings` 或在 `Menu` 中搜索访问 `Startup Applications`。该实用程序显示登录时自动启动的应用程序。每个条目都显示应用程序名称以及一个指示是否已启用的复选框。


  检查列表并禁用你不需要在启动时立即使用的应用程序。例如，如果你很少使用云存储同步，请禁用该客户端自动启动。在需要时手动启动即可。


  某些启动应用程序对于系统功能是必须的。在禁用你不认识的项目时要谨慎。仅禁用你清楚了解并知道不需要持续运行的应用程序。


  如果你希望应用程序在登录后立即可用，可以将它们添加到启动项。点击 `Add`，浏览并选择该应用程序，它将在未来的登录时自动启动。


  ### 系统监控工具


  了解资源使用有助于识别性能问题。


  `System Monitor` 显示实时 CPU、内存和网络使用情况。从 `System Tools` 启动它，或在 `Menu` 中搜索“System Monitor”。


  `Processes` 标签页列出了所有运行的应用程序和后台进程。它显示每个进程的名称、状态、CPU 占用和内存消耗。按 CPU 或内存排序，以识别资源密集型进程。


  如果某个应用程序无响应，你可以从 `System Monitor` 强制关闭它。右键点击冻死的进程并选择 `Kill`。这将立即终止应用程序，允许你重启它或处理底层问题。


  `Resources` 标签页显示 CPU、内存、交换空间（swap）和网络使用随时间变化的图表。这些图表有助于识别模式。如果内存使用不断达到上限，你可能需要更多
  RAM 或应该关闭不必要的应用程序。


  ### 备份解决方案


  定期备份可以防止因硬件故障、误删或系统问题导致的数据丢失。


  `Timeshift` 在初始设置期间配置，用于备份你的系统文件。默认情况下它不包含 `Home` 文件夹中的个人文件。在进行重大系统更改（如安装大型软件或调整系统设置）之前，创建手动快照。


  从 `System Tools` 启动 `Timeshift`。点击 `Create` 立即制作快照。快照是增量的，仅存储自上次快照以来的更改，从而节省空间。


  要从快照恢复，启动 `Timeshift`，选择你想恢复的快照并点击 `Restore`。这将系统文件恢复到创建快照时的状态。在系统更改导致问题后使用此功能。


  备份个人文件有多种选择。最简单的方法定期将重要文件复制到外部驱动。连接外部驱动，打开文件管理器，并将你的 `Documents`、`Pictures` 和其他重要文件夹复制到驱动器。


  对于自动备份，通过 `Software Manager` 安装 `Déjà Dup`。此备份工具允许调度定期备份到外部驱动、网络位置或云服务。配置好备份目标和计划，然后它就会自动运行。


  ### 性能优化技巧


  一些调整可以提高系统的响应速度。


  如果图形硬件性能不足，请禁用不必要的桌面效果。打开 `System Settings`，选择 `Effects` 并禁用动画和过渡。在旧硬件上，桌面会感觉更加灵敏。


  关闭未使用的应用程序，而不是让它们同时运行。每个打开的应用程序都会消耗内存和 CPU 周期。只保留你正在使用的应用程序。


  如前所述，监控启动应用程序。启动应用程序越少，启动速度越快，为你实际使用的应用程序提供的资源就越多。


  可能时为资源密集型应用程序使用轻量级替代方案。如果 `Firefox` 感觉很慢，尝试 `Chromium` 或浏览器。如果 `LibreOffice` 对于快速记录来说显得太重，请使用简单的文本编辑器。


  ### 驱动管理


  驱动程序使硬件能够正常工作。Linux Mint 会自动检测大多数硬件，但某些设备受益于专有驱动。


  通过 `System Settings` 访问 `Driver Manager` 可以识别可以使用专有驱动的硬件。显卡受益为为，因为专有驱动通常比开源替代提供更好的性能和功能。


  启动 `Driver Manager` 并允许它扫描系统。如果有专有驱动，它们将出现在列表中并带有推荐。对于 `NVIDIA` 显卡，推荐的专有驱动通常提供最佳体验。


  选择推荐的驱动并点击 `Apply Changes`。安装后，重启电脑使驱动生效。如果你在安装驱动后遇到问题，可以返回 `Driver Manager` 并切换回开源替代方案。


  # 第 10 章：安全与隐私


  ### 理解 Linux 安全


  ### 设置强密码





  强密码是第一道防线。


  良好的密码应包含至少十二字符，混合大小写字母、数字和符号。避免使用字典单词、个人信息或可预测的模式。


  不要在不同账户之间重复使用密码。如果某个服务发生泄露，唯一的密码可以防止攻击者访问其他账户。


  密码管理器有助于管理许多唯一密码。`KeePassXC` 是一个可以通过 `Software Manager` 获取的优秀密码管理器。它将密码存储在加密数据库中，只需记住一个主密码。


  定期更改你的密码，特别是在怀疑被泄露时。通过 `System Settings` 中的 `User Accounts` 更新密码。


  ## 防火墙配置


  防火墙控制网络流量，阻止未经授权的连接。


  Linux Mint 包含一个防火墙（`ufw`），但对于家庭用户默认未启用。如果你的计算机直接暴露在互联网上，或者你需要额外的保护，请启用它。


  通过 `Software Manager` 安装 `GUFW`，这是一个图形化防火墙界面。安装后，在 `System Settings` 的 `Firewall
  Configuration` 下启动它。


  点击 `Status` 开关启用防火墙。默认配置阻止入站连接同时允许出站连接，适用于大多数用户。这允许正常浏览网页和使用应用程序，同时防止未经请求的入站连接。


  高级用户可以创建自定义规则允许特定的应用程序或端口，但默认设置对于典型的桌面使用已经足够。


  ## 隐私设置


  在线隐私需要对数据共享做出意识选择。


  Firefox 包含了增强跟踪保护，可以阻止许多广告商和跟踪器。在 `Firefox` 偏好的 `Privacy & Security` 中访问这些设置。`Standard`
  设置在阻止大多数跟踪器的同时保持网站兼容性。`Strict` 模式提供最大的保护，但可能会损坏某些网站。


  对敏感会话使用隐私浏览。隐私窗口不会保存历史、Cookie 或表单数据。虽然并非真正的匿名（你的互联网提供商仍能看到你的活动），但隐私浏览可以防止本地跟踪。


  在 `System Settings` 中检查应用程序权限。某些应用程序请求访问你的位置、摄像头或麦克风。仅对需要功能支持的信任应用程序授予权限。


  禁用不必要的在线账户。如果你启用了 `Google Drive`或其他在线服务但不再使用它们，请在 `System Settings` 的 `Online Accounts`
  下禁用它们，以防止数据同步。


  ## 安全浏览实践


  良好的浏览习惯可以防止许多安全问题。


  在输入敏感信息之前验证网站的合法性。检查地址栏中的 `HTTPS`，由锁头图标指示。`HTTPS` 加密了你的浏览器与网站之间的通信，保护传输的数据。


  谨慎处理邮件链接。钓鱼攻击使用欺骗性邮件将你引向虚假网站。在点击链接之前验证发送者的合法性。如有疑问，请直接导航到网站，而不是通过邮件链接。


  保持软件更新。安全更新修补了攻击者利用的漏洞。及时安装更新，特别是针对浏览器和系统组件的安全更新。


  仅从受信任的源下载软件。使用 `Software Manager` 安装应用程序。避免从未知网站下载可执行文件。


  ## 加密选项


  加密保护数据免受未经授权的访问。


  Linux Mint 在安装期间提供目录加密。如果你最初没有启用它，稍后设置需要更多精力。对于隐私至上的新安装，请在设置期间启用加密。


  使用存档加密加密敏感文件。右键点击文件或文件夹，选择 `Compress`，并在压缩对话框中启用密码保护。这将创建一个需要密码打开的加密存档。


  外部驱动器可以加密以实现便携安全。使用 `GNOME Disks`（在 `System Tools` 中可用）带加密格式驱动器。加密驱动器在连接时需要密码，在驱动器丢失或被盗时保护数据。


  ## 恶意软件保护


  Linux 遇到的恶意软件比其他操作系统少得多，但保持警惕仍然重要。


  避免从未知源安装软件。`PPAs` 和`第三方仓库`应来自声誉良好的提供者。在添加新的软件源之前进行研究。


  不要运行不可信的脚本或命令。`Terminal` 命令具有巨大的威力。在不理解命令的情况下从论坛复制并粘贴命令是危险的。


  `ClamAV` 为 Linux 提供病毒扫描功能。虽然它主要用于扫描你与 Windows 用户共享的文件，但它也可以检测 Linux 威胁。如果需要，可以通过
  `Software Manager` 安装它。


  养成通用的计算机卫生：不要打开可疑邮件附件，不要向不可信的源提供密码，并保持对社交工程策略的警惕。


  # 第 11 章：常见问题排除


  ### 启动问题


  如果 Linux Mint 无法正常启动，有几种解决方案。


  如果系统启动到空白屏幕，可能是图形驱动程序的问题。重启并在启动期间按 `Shift` 访问 `GRUB`（启动菜单）。选择“Advanced options”并选择较早的内核。这将使用之前的内核启动，该内核可能与你的硬件配合更好。


  对于严重的启动问题，从你的 Linux Mint USB 盘启动并使用现场环境进行故障排除。从那里，你可以访问已安装的系统文件并可能修复问题。


  ### 网络连接问题


  连接问题有几个常见原因。


  对于无线问题，请验证笔记本电脑上的物理无线开关已启用。某些笔记本电脑具有硬件开关或组合键（通常为 `Fn + 功能键`）可以禁用无线。


  如果未出现无线网络，你的无线适配器可能未被识别。检查 `Driver Manager` 以查看可用驱动程序。某些无线芯片需要默认未安装的专有驱动程序。


  如果连接表现异常，请重启网络服务。打开终端并输入：


  ```bash

  sudo service network-manager restart

  ```


  这将重启网络管理服务并通常能解决临时故障。


  ### 声音问题


  音频问题通常有简单的解决方案。


  首先检查音量设置。系统栏中的音量控制可能被静音或设置得太低。点击它并增大音量。


  验证已选择正确的输出设备。如果你有多个音频设备（内置扬声器、耳机、`HDMI audio`），请确保目标设备在 `Sound Settings` 中处于激活状态。


  某些应用程序有独立的音量控制。如果一个应用程序静音而其他有声音，请检查该应用程序的内部音量设置。


  ### 显示问题


  屏幕问题从分辨率不正确到显示器缺失。


  如果分辨率看起来错误，打开 `Display Settings` 为你的显示器选择正确的分辨率。Linux Mint 通常会自动检测，但对于某些显示器可能需要手动选择。


  对于多显示器问题，确保 `Display Settings` 中检测到所有显示器。如果显示器未出现，检查物理连接。尝试不同的线类型或端口。


  ### 软件安装错误


  偶尔会出现安装问题。


  如果 `Software Manager` 报告错误，先更新软件包列表。打开终端并运行：


  ```bash

  sudo apt update

  ```


  然后重试安装。过时的软件包列表会导致依赖解析问题。


  如果系统报告损坏包，使用以下命令修复它们：


  ```bash

  sudo apt --fix-broken install

  ```


  此命令可以解决阻止安装的依赖冲突。


  ### 系统性能问题


  运行缓慢有各种原因。






  如果系统突然变得缓慢，请打开 `System Monitor`（系统监器）来识别资源占用。通常是消耗过多 CPU 或内存的失控进程导致的。终止这些进程。


  可用磁盘空间不足会导致运行变慢。确保你的驱动器至少有 10%的剩余空间。使用 `Disk Usage Analyzer`（磁盘使用分析器）识别并删除不需要的大文件。


  过多的启动应用程序会延迟启动并消耗内存。在 `Startup Applications`（启动应用程序）设置中检查并禁用不需要启动的应用。


  ## 恢复选项


  当问题阻止正常操作时，恢复选项可以帮助恢复功能。


  `Timeshift` 快照允许回滚系统更改。从活动 USB 启动，在活动环境中安装 `Timeshift`，并将快照恢复到已安装的系统中。


  对于受损严重的系统，在重新安装 Linux Mint 时保留家目录文件夹可以保护个人文件。在安装过程中，选择手动分区，仅格式化根分区，并保持家目录分区不被触。


  # 第 12 章：高级技巧与自定义


  ## 终端基础


  终端提供了对系统的强大控制力。


  从 `System Tools`（系统工具）类别启动 `Terminal`（终端）或按下 `Ctrl+Alt+T`。终端显示命令提示符，显示你的用户名、计算机名和当前目录。


  使用 `cd` 命令导航目录。要切换到 Documents 文件夹：`cd Documents`


  使用 `ls` 列出目录内容。这将显示当前位置的文件和文件夹。


  在任何地方输入 `cd` 即可返回你的家目录。


  向上和向下箭头键可以循环切换之前输入的命令，节省重复任务的输入时间。


  ## 键盘快捷键


  快捷键可以加速常用操作。


  系统快捷键包括：


  - `Ctrl+Alt+T`: 打开终端

  - `Alt+Tab`: 在窗口间切换

  - `Ctrl+Alt+Left/Right Arrow`: 切换工作区

  - `Super` (Windows 键): 打开菜单

  - `Ctrl+Alt+Delete`: 注销菜单


  应用程序快捷键各不相同，但通常遵循惯例：


  - `Ctrl+S`: 保存

  - `Ctrl+C`: 复制

  - `Ctrl+V`: 粘贴

  - `Ctrl+Z`: 撤销

  - `Ctrl+F`: 查找


  学习你经常使用的应用程序的快捷键。它们通常列在命令名称旁边的菜单项中。


  ## 创建自定义快捷键


  为常用的应用程序或操作定义快捷键。


  打开 `System Settings`（系统设置）并选择 `Keyboard`（键盘）。导航到 `Shortcuts`（快捷键）标签页。现有快捷键按分类显示。要添加自定义快捷键，点击
  `Custom Shortcuts`，然后点击 `+` 按钮。


  为快捷键输入名称、执行的命令，然后点击“Apply”。点击 `Keyboard shortcut` 字段并按下你想使用的键组合。选择未分配的组合以避免冲突。


  例如，创建一个使用 `Ctrl+Alt+F` 打开文件器的快捷键。输入“File Manager”作为名称，`nemo` 作为命令，并设置键盘快捷键。


  ## 桌面效果与动画


  自定义视觉效果以匹配你的喜好。


  通过 `System Settings` 中的 `Effects` 访问效果设置。选项包括启用或禁用特定效果、调整动画速度以及配置窗口行为。


  桌面效果从微妙的阴影和淡入到复杂的动画不等。启用你认为视觉上吸引人的效果，同时禁用任何让你分心或在旧版硬件上引起性能问题的效果。


  ## 主题自定义


  主题会极大改变系统外观。


  除了包含的主题外，网上还可以获得更多主题。访问 `cinnamon-spices.linuxmint.com` 浏览社区创建的主题。下载你喜欢的主题。


  将下载的主题提取到家目录下的 `.themes` 文件夹。如果该文件夹不存在，请创建它。将主题放在那里后，它们将出现在 `Themes` 设置中供选择。


  图标主题的工作原理也类似。下载图标包，将其提取到家目录下的 `.icons` 文件夹，并在 `Themes` 设置中选择它们。


  尝试不同的主题、图标和窗口边框组合，创建个性化的外观。


  ## 扩展与小组件管理


  扩展（Extensions）和小组件（Applets）为你的桌面添加功能。


  右键点击面板并选择“Add applets to the panel”访问小组件管理。浏览可用选项并添加那些增强你工作流的项目。


  `Desklets` 直接将组件放置在桌面上。右键点击桌面并选择“Add Desklets”浏览选项。小组件可以显示系统信息、天气预报、日历或其他有用信息。


  扩展修改桌面行为。通过 `System Settings` 中的 `Extensions` 访问它们。启用你需要的功能的扩展，禁用你不使用的扩展。


  ## 自动化任务


  自动化无需人工干预即可处理重复性任务。


  `cron` 调度命令自动运行。它对于备份等定期维护任务非常有用。高级用户可以通过终端配置 `cron`，尽管存在图形化工具来简化过程。


  对于简单的自动化，`bash` 脚本组合了多个命令。创建一个包含你想执行的命令的文本文件，以 `.sh` 扩展保存，赋予可执行权限并运行它。这种技术适用于按相同步骤定期执行的任务。


  # 结论


  ### 你的 Linux Mint 之之旅


  本指南使你掌握了 Linux Mint 22 的全面知识。你学习了安装、导航、自定义、软件管理、多媒体处理、系统维护、安全实践和故障排除技巧。


  Linux Mint 随你共同成长。这里涵盖的技能为深入探索奠定了基础。随着你每天使用系统，你将发现符合你需求的工作流、适合你任务的应用程序以及反映你喜好的自定义。


  Linux 的开源特性意味着持续的改进。更新带来了新功能、更好的硬件支持和增强的安全。你对 Linux Mint 社区的参与，无论是提问还是最终帮助他人，都加强了整个生态系统。


  记住，熟练是通过实践培养的。最初看起来复杂的任务会变成常态。你最初忽略的功能后来可能被证明是有价值的。当问题出现或你准备好深入探索高级主题时，返回相关章节。


  ### 额外资源


  Linux Mint 提供了本手册之外的大量文档。`linuxmint.com` 官方文档详细涵盖了各个主题，并通过定期更新反映最新发布。


  Linux Mint 论坛建立了一个欢迎任何经验水平用户的社区。当你遇到此处未涵盖的问题时，论坛成员通常会提供解决方案。在发布问题之前先搜索现有的讨论，因为很多问题之前已经有答案了。


  YouTube 包含无数涵盖特定任务和工作流的 Linux Mint 教程。视频演示可以澄清文字难以描述的过程。


  许多城市都有本地的 Linux 用户小组。这些小组定期聚会，提供从经验用户那里学习以及与其他使用 Linux 的士联系的机会。


  ### 社区支持


  Linux Mint 最大的优势之一是它的社区。全球数千万用户每天使用 Linux Mint，形成了一个巨大的集体知识库。


  寻求帮助时，请提供相关细节：你试图完成什么、实际上发生了什么、收到的任何错误信息以及你已经尝试过的步骤。详细的问题描述会获得更有帮助的回复。


  随着经验的增加，考虑帮助他人。回答论坛问题或撰写教程可以在回馈社区的同时巩固你自己的知识。Linux 在这种协作精神下蓬勃发展。






