    Connected devices appear in the Bluetooth settings with options to disconnect,
    remove, or access device-specific settings. If a device doesn''t automatically
    reconnect in the future, ensure it''s powered on and in range, then click it in
    Bluetooth settings and select Connect.


    ## Power Management


    Power settings control how your computer manages energy consumption, particularly
    important for laptops to maximize battery life.


    Access power settings through System Settings by clicking `Power Management`.
    The settings window presents options for behavior when running on battery versus
    plugged into power.


    Automatic Suspend puts the computer into a low-power state after a period of inactivity.
    You can set different suspend times for battery and AC power. Longer times keep
    the computer active more, convenient if you frequently return to work. Shorter
    times conserve energy but may interrupt work if you''re simply reading the screen
    without active input.


    The "When the lid is closed" setting determines laptop behavior when you close
    the screen. Options include suspending, hibernating, or doing nothing. Suspend
    mode is typical, allowing quick resume when you open the lid while consuming minimal
    power. Hibernate saves your session to disk and powers down completely, using
    no power but taking longer to resume. Do nothing keeps the laptop running with
    the screen off, useful if you use an external monitor.


    Button Power settings specify what happens when you press the power button. Options
    include asking what to do, suspending, hibernating, or shutting down. Many users
    prefer Ask, which presents a dialog with multiple options rather than assuming
    your intent.


    Battery percentage and time remaining appear in the system tray on laptops. Clicking
    the battery icon shows detailed charge information and estimated time remaining
    based on current power consumption. This helps you plan work when running on battery.


    Power statistics provide detailed information about battery health and historical
    power usage. Access this by clicking "Power Statistics" in power management settings.
    Graphs show charge and discharge rates over time, helping identify applications
    that consume excessive power.


    ## Date and Time Configuration


    Date and time settings ensure your system clock displays correctly and adjusts
    for your timezone.


    Open System Settings and click `Date & Time`. The settings window shows current
    date, time, and timezone.


    Linux Mint can synchronize time automatically using internet time servers. Enable
    "Network time" to keep your clock accurate. The system periodically connects to
    time servers and adjusts the clock as needed. This ensures accuracy even if your
    computer''s internal clock drifts slightly.


    If automatic time isn''t available or desired, you can set time manually. Disable
    "Network time" and click the date or time to edit values. Use the calendar widget
    to select the correct date and time fields to set hours and minutes.


    Timezone selection is crucial for accurate time display. Click your current timezone
    on the map or select it from the dropdown list. Linux Mint includes all global
    timezones. Select the one matching your location. If you travel, update this setting
    when changing timezones to maintain accurate local time.


    The time format can display as 12-hour with AM/PM or 24-hour format. Select your
    preference in the settings. Many countries use 24-hour format, while others prefer
    12-hour with AM/PM indicators.


    ## User Accounts and Permissions


    User account settings manage who can use your computer and what permissions they
    have.


    Access user accounts through System Settings by clicking `User Accounts`. This
    displays all user accounts on the system. Your account appears first, marked as
    the current user.


    To create a new user account, click the plus icon. You''ll be prompted for your
    password to confirm administrative privileges. Enter a username for the new account,
    following the same rules as when you created your account during installation.
    Choose whether the new user should be a standard user or an administrator.


    Standard users can use the computer and modify their own settings but cannot install
    software, modify system settings, or affect other users. Administrator accounts
    have full system access. Unless the new user needs administrative privileges,
    create a standard account for security.


    Set a password for the new account or allow the user to set their own password
    on first login. If setting the password yourself, ensure it''s strong and communicate
    it securely to the user.


    Account types can be changed after creation. Click an existing account and select
    the account type dropdown to switch between Standard and Administrator. This allows
    elevating a user to administrator status or removing administrative privileges.


    Deleting user accounts removes them from the system. Click an account and select
    the minus icon to delete it. You''ll be asked whether to keep or delete that user''s
    files. Keeping files moves them to a safe location where an administrator can
    access them. Deleting files removes them permanently.


    Your account settings allow changing your password, display name, and profile
    picture. Click your account and select "Change password" to update your password.
    This requires entering your current password, then the new password twice for
    confirmation.


    The profile picture appears at login and in various interface elements. Click
    the user icon image to select a new picture. You can choose from included images
    or select your own from your files. Profile pictures help identify accounts quickly
    when multiple users share the computer.


    Automatic login, configured during installation, can be changed in user accounts.
    Enable or disable automatic login for your account. Remember that automatic login
    reduces security by allowing anyone physical access to use your computer without
    authentication.


    # Chapter 4: File Management


    ### Understanding the File Manager


    The file manager, called `Nemo`, provides graphical access to your files and folders.
    It functions as your window into the file system, allowing you to browse, organize,
    and manipulate files without using command-line tools.


    Launch the file manager by clicking the Files icon in the Menu or panel. It opens
    showing your Home folder by default. The file manager window contains several
    areas, each serving specific purposes.


    The toolbar at the top provides navigation buttons, view options, and search functionality.
    Back and forward arrows navigate through folder history, similar to web browser
    navigation. The up arrow moves to the parent folder containing the current folder.


    The sidebar on the left displays shortcuts to common locations. `Home` takes you
    to your personal folder. `Desktop` shows your desktop contents. `Documents`, `Downloads`,
    `Music`, `Pictures`, and `Videos` provide quick access to these standard folders.
    Additional shortcuts can be added for locations you access frequently.


    The main viewing area displays files and folders in the current location. Multiple
    view modes present content differently. `Icon view` shows large icons suitable
    for image folders where visual identification helps. `List view` displays detailed
    information in columns including name, size, type, and modification date. `Compact
    view` fits more items in the same space with smaller icons and minimal details.


    The status bar at the bottom shows information about the current folder and selected
    items. It displays how many items the folder contains and the total size of selected
    files. When selecting multiple files, the status bar indicates how many items
    you''ve selected.


    The location bar shows your current position in the file system. It displays the
    folder path, with each folder name clickable to jump directly to that level. This
    breadcrumb-style navigation makes moving up multiple folder levels effortless.


    ### Navigating Your File System

