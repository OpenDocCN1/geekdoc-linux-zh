    need. The table appears in your document with cells ready for content. Click in
    any cell to type, then press Tab to move to the next cell. The Table menu provides
    options to add or delete rows and columns, merge cells, adjust borders, and apply
    shading.


    Page formatting controls margins, orientation, and size. Access these settings
    through the Format menu under Page. Standard documents use portrait orientation
    (tall), while landscape (wide) suits tables or charts that extend horizontally.
    Margins define the blank space around page edges. Default margins work for most
    documents, but you can adjust them for specific requirements.


    Headers and footers place content that repeats on every page, such as document
    titles, page numbers, or dates. Insert them through the Insert menu. Headers appear
    at the top of pages, footers at the bottom. Common uses include placing your name
    and document title in the header, with page numbers in the footer.


    Styles maintain consistent formatting throughout documents. Rather than manually
    formatting each heading or paragraph, apply pre-defined styles. The Styles panel
    on the left shows available styles. Click a style to apply it to selected text.
    This ensures all headings look identical and allows changing the entire document''s
    appearance by modifying style definitions.'
