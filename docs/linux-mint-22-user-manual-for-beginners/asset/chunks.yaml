  trans: '

    侧边栏中的“最近文件”（Recent files）部分提供了另一种定位最近访问文件的方法。此视图显示了你最近打开的文件，无论它们存储在何处。当你记得昨天处理过某个文件但想不起它保存在哪里时，这个功能就特别有用。


    ## 文件属性与权限


    每个文件都拥有属性，包括大小、类型、创建日期和权限。理解这些属性有助于有效地管理文件。


    右键点击任何文件并选择 `Properties`（属性）查看详细信息。`Properties` 对话框显示多个不同信息类别的标签页。


    `Basic`（基本）标签页显示文件名、类型、大小、位置和修改日期。文件大小以人类可读的格式（KB、MB、 GB）和精确字节显示。创建日期指示文件首次创建的时间，而修改日期显示最后一次更改的时间。访问日期记录了最后一次打开的时间。


    文件类型指示了它是什么种的文件，以及默认由哪个应用程序打开它。常见类型包括文本文档、PDF 文件、各种格式的图像、视频文件和压缩包。可以通过点击“打开方式”（Open
    With）并选择不同的程序来更改默认应用程序。


    `Permissions`（权限）标签页控制谁可以读取、写入或执行文件。这些权限是 Linux 安全的核心。每个文件都有三个权限类别：所有者（owner）、组（group）和其他人（others）。所有者通常是创建文件的用户。组包含特定组中的其他用户。其他人指的是系统上的所有人。


    对于每个类别，可以授予三种权限：读取（read）允许查看文件内容，写入（write）允许修改或删除文件，执行（execute）允许将文件作为程序运行（适用于脚本和应用程序）。文档和图像等标准文件通常赋予所有者读写权限，赋予其他人只读。


    要修改权限，请使用 `Permissions` 标签页中的下拉菜单。为每个类别选择适当访问级别。更改在关闭 `Properties` 对话框时立即生效。在授予他人写入权限时要小心，这允许他们修改或删除你的文件。


    ## 使用外部驱动器


    USB 盘和外部硬盘等外部存储设备提供了便携存储和备份功能。Linux Mint 在大多数情况下会自动处理这些设备。


    当你插入 USB 盘时，系统会在几秒内检测到它。会出现一个通知确认驱动器已被识别，并会出现在文件管理器的侧边栏中。点击驱动器名称即可访问其内容。驱动器在文件管理器中的打开方式就像任何文件夹一样，允许你正常地复制、移动或删除文件。


    USB 盘通常使用 `FAT32` 或 `exFAT` 文件系统以兼容操作系统。这些文件系统具有局限性，例如 `FAT32` 的文件大小限制为 4 GB。如果你需要存储更大的文件，请将驱动器格式化为
    `exFAT` 或 Linux 原生文件系统（如 `ext4`）。注意 `ext4` 格式的驱动器在 Windows 上没有额外软件的情况下无法读取。


    要安全地移除外部驱动器，请在物理拔出之前点击侧边栏中驱动器名称旁弹出图标。这确保所有数据都已写入驱动器，且没有待处理的操作。在不弹出的情况下移除驱动器可能会带来数据损坏或丢失的风险。


    外部硬盘的功能与 USB 盘类似，但通常提供更大的容量。连接后它们出现在侧边栏，并可以用相同的方式访问。某些外部硬盘需要外部电源适配器，而另一些通过 USB
    连接供电。


    如果外部驱动器没有自动出现，请检查物理连接。尝试不同的 USB 端口。如果驱动器仍未出现，它可能存在硬件问题或使用了不支持的文件系统。系统设置中的 `Disks`（磁盘）工具可以提供有关连接驱动器的更多信息。


    ## 云存储集成


    云存储服务允许访问存储在远程服务器上的文件，提供了备份功能和从多个设备访问的能力。


    多个云存储提供商提供 Linux 客户端或集成选项。流行的服务包括 Dropbox、Google Drive（通过第三方客户端）、Nextcloud 和 Mega。安装方法随服务而异。


    要使用 Dropbox，请从 Dropbox 网站下载 Linux 客户端。通过 `Software Manager`（软件管理器）或双击下载的文件进行安装。安装后，运行
    `Dropbox` 并登录你的账户。客户端会在你的 `Home`（家）目录中创建一个 `Dropbox` 文件夹。放置在此文件夹中的文件会自动同步到云端和其他设备。


    Google Drive 不提供官方 Linux 客户端，但存在第三方选项。`GNOME Online Accounts`（GNOME 在线账户）集成允许通过文件管理器访问
    Google Drive。在系统设置的 `Online Accounts`（在线账户）下启用此项。添加你的 Google 账户并启用 Drive 访问。你的
    Google Drive 将出现在文件管理器侧边栏中，允许你直接访问存储的文件。


    Nextcloud 提供具有良好 Linux 支持的自托管云存储。如果你有 Nextcloud 账户（自托管或通过提供商），请从 `Software Manager`
    安装 `Nextcloud` 桌面客户端。使用你的服务器详情和凭据进行配置。与 Dropbox 类似，它会创建一个与云存储同步的本地文件夹。


    云存储文件存在两种状态：存储在计算机上的本地副本和云服务器上的远程副本。本地文件的更改会自动同步到云端。这提供了备份保护并允许从其他设备访问文件。然而，大量文件可能会消耗大量的本地磁盘空间。


    某些云客户端提供选择性同步，允许你选择哪些文件夹本地同步。这在节省本地存储空间的同时保持了对所有文件的云端访问。需要时通过网页界面访问未同步的文件。


    # 第 5 章：安装与管理软件


    ## 理解软件源


    Linux Mint 使用软件包管理系统简化了软件的安装和更新。理解该系统的工作原理有助于你安全、高效地安装软件。


    软件包包含编译后的程序、配置文件和关于软件的元数据。包管理器处理安装、跟踪依赖关系并确保软件与系统正确集成。这与从网站下载可执行文件不同，因为软件包来自受信任的仓库。


    软件仓库是托管软件包集合的服务器。Linux Mint 包含了几个拥有数千个应用程序的默认仓库。这些仓库经过安全审查，确保软件安装安全。官方仓库包括：


    - 主仓库（main repository）包含 Linux Mint 团队完全支持的免费开源软件。你将使用的大多数应用程序来自这里。

    - 基础仓库（base repository）提供来自 Ubuntu 的系统包。

    - 导入仓库（import repository）包含额外的包。

    - 上游仓库（upstream repository）直接从 Ubuntu 提供包。


    对于默认仓库未包含的特殊软件可以添加额外的仓库。个人软件包存档（`PPAs`）允许开发者发布尚未进入官方仓库的软件。虽然 `PPAs` 扩展了可用软件范围，但它们受到的审查比官方仓库少。请仅从信任的源添加
    `PPAs`。


    可以通过 `Software Sources`（软件源）工具管理软件源。通过系统设置或 `Software Manager` 访问它。该工具显示已启用的仓库并允许添加或删除源。大多数用户永远不需要修改默认源，因为它们提供了全面的软件覆盖。


    ## 使用软件管理器


    '
- fmt: '

    The Software Manager provides a graphical interface for browsing and installing
    software. It presents available applications with descriptions, screenshots, and
    user reviews.


    Launch the Software Manager from the Menu by clicking its icon or searching for
    "Software Manager." The main window displays featured applications and categories.
    Featured applications highlight popular or recently added software. Categories
    organize applications by purpose: Internet, Office, Graphics, Sound & Video, Development,
    and others.


    Click any category to browse applications within it. Each application displays
    with its icon, name, and brief description. The interface shows which applications
    are already installed, indicated by a checkmark or "Remove" button instead of
    "Install."


    To view details about an application, click it. The detail page shows a full description,
    screenshots demonstrating the interface, user reviews and ratings, file size,
    and version information. Reviews from other Linux Mint users provide insights
    into real-world performance and usability.


    User ratings appear as stars, with five stars being the highest rating. Read reviews
    to understand why users gave particular ratings. Some applications receive excellent
    ratings, while others have issues reported by users. Consider these ratings when
    choosing between similar applications.


    Installing an application requires only clicking the `Install` button. Your password
    is requested to confirm you want to install software. After entering your password,
    the Software Manager downloads the application and any required dependencies,
    then installs everything automatically. A notification confirms when installation
    completes.


    The installed application appears in your Menu, organized under the appropriate
    category. Launch it from there or search for it by name. Recently installed applications
    often appear in a "Recent" section of the Menu for convenient access.


    ### Installing Applications from the Software Manager


    Let''s walk through installing several useful applications to demonstrate the
    process and introduce software you might want.


    GIMP, the GNU Image Manipulation Program, provides powerful image editing capabilities
    comparable to commercial alternatives. Open the Software Manager and search for
    "GIMP." Click the GIMP result and review the information. Click `Install` and
    enter your password when prompted. After installation completes, find GIMP in
    the Graphics category of your Menu.


    VLC Media Player handles virtually any video or audio format. Search for "VLC"
    in the Software Manager. The listing shows it''s a versatile media player. Install
    it using the same process as GIMP. VLC appears in the Sound & Video category after
    installation.


    LibreOffice comes pre-installed with Linux Mint, but you might want additional
    office applications. WPS Office provides an alternative with a Microsoft Office-like
    interface. Search for it in the Software Manager, review the details, and install
    if desired. Note that some alternatives may not be in the default repositories
    and might require adding additional software sources.


    For communication, several instant messaging clients are available. Pidgin supports
    multiple chat protocols simultaneously. Search for "Pidgin" and install it if
    you use instant messaging services. After installation, configure it with your
    account details for the services you use.


    Development tools are available for programmers. Visual Studio Code, a popular
    code editor, can be installed through the Software Manager. Search for "Code"
    and select Visual Studio Code from the results. This installs Microsoft''s full-featured
    code editor suitable for multiple programming languages.


    Productivity tools like note-taking applications enhance organization. Simplenote
    provides basic note-taking with cloud sync. Joplin offers more advanced features
    including markdown support. Search for note-taking applications and install one
    matching your needs.


    Each installed application adds entries to your Menu, shortcuts for launching
    the program, and integrates with your system. Applications update through the
    same system as operating system updates, ensuring you always have the latest versions
    with security patches and new features.


    ### Updating Your System


    Regular updates keep your system secure, stable, and equipped with the latest
    features. Linux Mint makes updating straightforward through the Update Manager.


    The Update Manager icon appears in your system tray, showing a different appearance
    when updates are available. A notification also alerts you when updates await
    installation. Click the Update Manager icon to launch the application.


    The Update Manager displays available updates organized by type and importance.
    Security updates address vulnerabilities and should be installed promptly. Kernel
    updates affect the core system and may provide better hardware support or performance
    improvements. Application updates bring new features and bug fixes to installed
    programs.


    Each update appears in a list showing the package name, current version, available
    version, and brief description of changes. Some updates list many individual packages
    because they affect multiple system components.


    Update levels indicate how tested and stable each update is. Level 1 and 2 updates
    receive extensive testing and are considered safe. Level 3 updates receive moderate
    testing. Level 4 and 5 updates are less tested and potentially risky, though problems
    are rare. By default, Linux Mint shows updates through level 3, balancing stability
    with currency.


    To install updates, click `Install Updates` at the top of the Update Manager window.
    You''ll be prompted for your password to authorize system changes. The Update
    Manager then downloads and installs all selected updates. This process takes varying
    amounts of time depending on update sizes and your internet speed.


    During updates, you can continue using your computer. Most updates don''t require
    interrupting your work. However, some updates may request restarting applications
    to use new versions. Kernel updates require a full system restart to take effect,
    though the restart can be delayed until convenient.


    After significant updates, particularly kernel updates, restart your computer
    to ensure all changes take effect properly. The Update Manager indicates when
    a restart is recommended. You don''t need to restart immediately, but do so before
    the next shutdown to ensure your system runs the updated kernel.


    ### Using the Update Manager


    The Update Manager offers configuration options controlling update behavior and
    visibility.


    Access Update Manager preferences by clicking the `Edit` menu and selecting `Preferences`.
    Several settings customize the update experience.


    Automatic refresh determines how often the Update Manager checks for new updates.
    Options range from hourly to weekly. Daily checks provide a good balance, ensuring
    you''re informed of important updates without constant checking.


    Update frequency doesn''t affect security updates, which are critical. The system
    can be configured to apply security updates automatically without prompting. Enable
    this in preferences if you want maximum security with minimal manual intervention.
    Automatic security updates install silently in the background, protecting your
    system without requiring attention.


    Update levels determine which updates the Update Manager displays. By default,
    levels 1 through 3 are visible. You can adjust this to show more or fewer updates.
    Most users should stick with the defaults, which provide well-tested updates while
    avoiding potentially problematic ones.


    The Update Manager can display desktop notifications when updates are available.
    Notification settings control whether you''re alerted and how prominently. Some
    users prefer conspicuous notifications ensuring they don''t miss important updates.
    Others prefer subtle indicators they can check at their convenience.

