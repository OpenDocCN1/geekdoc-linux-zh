    # Linux Mint organizes files in a hierarchical structure starting from the root
    directory. Understanding this structure helps you locate files and understand
    where things belong.


    Your `Home` folder contains all your personal files and settings. Each user has
    their own `Home` folder, separate from other users. Within your `Home` folder,
    you''ll find several standard subfolders:

    - `Desktop` holds desktop icon files.

    - `Documents` stores your personal documents.

    - `Downloads` receives downloaded files.

    - `Music` organizes audio files.

    - `Pictures` stores images.

    - `Videos` keeps video files.

    - `Public` provides a shared location for files you want other users to access.


    ## File Management and Navigation


    The file manager sidebar provides shortcuts to these locations for quick access.
    Click any folder to navigate to it. The main viewing area updates to show that
    folder''s contents.


    Double-clicking a folder in the main viewing area opens it, displaying its contents.
    This is the primary method for navigating deeper into folder hierarchies. Each
    double-click takes you one level deeper.


    To navigate up to the parent folder, use the up arrow in the toolbar or click
    the parent folder name in the location bar. This moves you back up one level in
    the folder structure.


    The `Home` button in the toolbar returns you to your `Home` folder from anywhere
    in the file system. This provides a quick way back to your starting point when
    you''ve navigated deep into folder hierarchies.


    Recent files can be accessed from the sidebar. This special view shows files you''ve
    opened recently, regardless of their location. It''s helpful when you need to
    access a file but don''t remember exactly where you saved it.


    The file system root, represented by `/`, contains system files and folders. Most
    files here are system-related and shouldn''t be modified without good reason.
    Your `Home` folder exists within this broader file system, but you''ll primarily
    work within your `Home` folder and its subfolders.


    External drives and mounted partitions appear in the sidebar when connected. USB
    drives, external hard drives, and network locations show up automatically. Click
    them to access their contents just like local folders.


    ## Creating and Organizing Folders


    Folders organize related files together, keeping your file system tidy and making
    files easy to find. Creating a logical folder structure improves efficiency and
    reduces time spent searching for files.


    To create a new folder, navigate to the location where you want it. Right-click
    in empty space within the file manager and select "Create New Folder" from the
    context menu. Alternatively, use the keyboard shortcut `Ctrl+Shift+N`. A new folder
    appears with a temporary name highlighted, ready for you to type the desired name.
    Enter a descriptive name and press `Enter` to create the folder. evenFolder names
    should be descriptive enough to indicate their contents. Consider creating folders
    for different projects, document types, or time periods, depending on how you
    work. For example, a `Documents` folder might contain subfolders for different
    years, clients, or project types.


    Nested folders create hierarchical organization. Create subfolders within folders
    to further organize content. For instance, a `Photos` folder might contain subfolders
    for each year, with each year containing folders for different events or trips.


    To create subfolders, navigate into the parent folder first, then create a new
    folder using the same method described above. This places the new folder inside
    the current location.


    Renaming folders updates their names when organizational needs change. Right-click
    a folder and select "Rename" from the context menu, or select the folder and press
    `F2`. The folder name becomes editable. Type the new name and press `Enter` to
    confirm the change.


    When organizing files, think about how you''ll search for them later. Group related
    items together. Keep active projects easily accessible while archiving completed
    work in dated folders. Don''t create overly complex folder hierarchies with many
    levels, as this makes navigation tedious.


    ## Moving, Copying, and Deleting Files


    Managing files involves moving them between locations, creating copies, and removing
    files you no longer need. The file manager provides multiple methods for these
    operations.


    To move a file, click and drag it from the viewing area to a destination folder
    in the sidebar or another file manager window. As you drag, the cursor changes
    to indicate the operation. Release the mouse button when positioned over the destination.
    The file moves from its original location to the new one.


    Alternatively, right-click a file and select `Cut` from the context menu, navigate
    to the destination folder, right-click empty space, and select `Paste`. The keyboard
    shortcut `Ctrl+X` cuts files, while `Ctrl+V` pastes them.


    Copying files creates duplicates, leaving the original in place while adding a
    copy elsewhere. Drag files while holding the `Ctrl` key to copy instead of move.
    The cursor displays a plus sign indicating a copy operation. Alternatively, right-click
    and select `Copy` (or press `Ctrl+C`), navigate to the destination, and paste
    (`Ctrl+V`).


    When copying or moving files to a location that already contains files with the
    same names, a dialog appears asking how to handle the conflict. Options include
    replacing the existing file, skipping the operation, renaming the new file, or
    comparing files to decide. Choose based on whether the incoming file is newer,
    more complete, or simply different from the existing version.


    Deleting files removes them from your system. Select files and press the `Delete`
    key to move them to the `Trash`. Alternatively, right-click and select `Move to
    Trash`. Files in the `Trash` aren''t permanently deleted yet and can be restored
    if removed accidentally.


    To permanently delete files without sending them to `Trash`, select them and press
    `Shift+Delete`. A confirmation dialog warns that this action is irreversible.
    Only use permanent deletion when certain you won''t need the files again and want
    to free disk space immediately.


    The `Trash` folder appears in the file manager sidebar. Open it to view deleted
    files. To restore a file from `Trash`, right-click it and select `Restore`. The
    file returns to its original location. To permanently remove all `Trash` contents,
    right-click the `Trash` icon and select `Empty Trash`. This frees the disk space
    occupied by deleted files.


    When working with multiple files, select them all before performing operations.
    Click the first file, hold `Shift`, and click the last file to select a range.
    Hold `Ctrl` and click individual files to select specific ones. Once selected,
    any move, copy, or delete operation applies to all selected files.


    ## Search Functions


    The file manager''s search feature helps locate files when you know something
    about them but not their exact location.


    Click the search icon in the toolbar or press `Ctrl+F` to activate search. A search
    field appears at the top of the viewing area. Type your search terms and press
    `Enter`. The file manager displays all matching files within the current folder
    and its subfolders.


    Search terms can be partial file names. Typing "report" finds files containing
    that word anywhere in their names, such as "annual_report.pdf," "sales_report_2024.doc,"
    or "report_final.txt." Search isn''t case-sensitive, so "Report" and "report"
    produce identical results.


    To search your entire `Home` folder, navigate to `Home` before starting the search.
    To search more broadly, navigate to a higher-level folder. To narrow results,
    navigate deeper into your folder structure before searching.


    Advanced search options filter results by file type, modification date, or size.
    After entering basic search terms, click the options icon to reveal these filters.
    Restrict results to documents, images, videos, or other file types. Specify date
    ranges to find files modified within particular timeframes. Set size constraints
    to locate large files consuming disk space or small files that might be text notes.

