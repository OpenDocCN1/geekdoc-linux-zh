  trans: '


    Linux Mint 是一个完整的操作系统，可以替代你电脑上的 Windows 或 macOS。与这些商业选项不同，Linux Mint 是免费且开源的，这意味着任何人都可以免费使用、修改和分发它。“开源”这一标识意味着底层代码公开，供全球的程序员进行检查和改进。


    该发行版源自 Ubuntu，而 Ubuntu 本身构建在 Debian 之上，后者 是最老且最受尊敬的 Linux 发行版之一。这种传承提供了一个坚实且经过良好测试的基础。Linux
    Mint 添加了自身的桌面环境、工具以及专注于易用性和优雅设计的理念。


    “Linux”一词指的是内核，即管理硬件和系统资源的核心组件。“Mint”则将此特定发行版与其他数百种发行版区分开来。每个 Linux 发行版将内核与不同的软件选择、桌面环境和配置打包。Linux
    Mint 的选择强调了用户友好和完善的体验。


    该项目始于 2006 年，由 Clement Lefebvre 创立。他的愿景核心是创建一个“开箱即用”且无需大量技术知识的 Linux 系统。这种哲学一直指导着今天的发展。只有当功能能够增强易用性且不会引入不必要的复杂性时，才会添加新功能。


    Linux Mint 独立于企业控制，意味着决策优先考虑用户而非商业利益。界面没有广告充斥。在未经明确许可的情况下不会进行数据收集。更新不会强制执行不希望的更改。这种用户优先的方法使其与许多商业操作系统区别开来。


    ## 系统要求


    Linux Mint 22 可以在多种硬件上高效运行，包括几年前的旧电脑。最低规格配置允许基本功能运行，而推荐配置则确保了典型使用场景下的流畅性能。


    最低要求包括至少 `1 GHz` 的处理器，尽管现代多核处理器提供更好的性能。内存（RAM）应至少为 `2 GB`，以允许基础多任务处理。存储需求从 `20
    GB` 空闲磁盘空间开始，为系统和某些应用程序留出空间。屏幕分辨率应达到 `1024x768` 像素，以便正确显示界面元素。


    推荐配置提供更快速的响应体验。`2 GHz` 或更高的双核处理器可以流畅地处理多个应用程序。`4 GB` 或更大的内存允许舒适地进行多任务处理而不会减慢。`100
    GB` 或更大的存储空间可以容纳系统、应用程序和你的个人文件，并留有余。更高的屏幕分辨率可以显示更多内容并利用现代显示器的优势。


    图形能力主要针对特殊用途。集成显卡可以轻松处理常规桌面使用、网页浏览、视频播放和办公应用程序。独立显卡则益于游戏、视频编辑和 3D 建模。Linux Mint
    22 对 `NVIDIA` 和 `AMD` 显卡都包含了改进的支持。


    从 USB 驱动器安装并不严格需要连接网络，但它会极大提升体验。安装过程中的在线访问允许下载更新和额外的语言包。安装后，连接网络可以实现软件安装、系统更新以及访问在线资源。


    运行现代 Windows 版本时感到吃力的旧电脑通常运行 Linux Mint 效果非常出色。该系统的效率可以有效延长电脑几年的寿命。许多用户报告说，在相同硬件上从
    Windows 切换到 Linux Mint 后，性能有所提高。


    ## 选择合适的版本


    Linux Mint 22 提供三个主要版本，每个版本都具有不同的桌面环境。桌面环境决定了你图形界面的外观、感受和行为。选择合适的版本取决于你的硬件能力和个人偏好。


    Cinnamon 版本代表旗舰版本，并获得了最多的开发关注。它提供了一个带有视觉效果和流畅动画的现代、吸引人的桌面。界面类似于传统的桌面布局，带有任务栏、菜单和系统托。Cinnamon
    比其他版本消耗更多系统资源，但在性能良好的硬件上它能提供最完善的体验。此版本适用于具有 `4 GB` 或更多内存和合理图形能力的电脑。


    MATE 版本提供了一个更轻量、更传统的桌面环境。它源自 `GNOME 2`，当 `GNOME` 迁移到不同的设计范式时，它保留了那种经典界面。MATE 提供了熟悉的桌面惯例，且资源需求比
    Cinnamon 低。拥有 `2-3 GB` 内存的电脑可以舒适地运行 MATE。界面可能看起来更简单，但它包含了生产力计算的所有基本功能。


    Xfce 版本针对较旧或配置较低的电脑。这种轻量级桌面环境在内存和处理能力有限的系统上运行得顺畅。Xfce 的高效率并不意味着牺牲功能。该界面在利用最少资源的同时提供了完整的桌面功能。在运行
    Cinnamon 或 MATE 时感到吃力的电脑，在运行 Xfce 时通常表现良好。


    所有三个版本都包含相同的 Linux Mint 工具和实用程序。它们访问相同的软件仓库，这意味着在各个版本中安装的应用程序相同。主要区别在于桌面环境和资源占用。


    对于大多数在过去五年内购买现代电脑的用户来说，Cinnamon 版本提供了最佳体验。其精化的界面和活跃的开发使其在硬件允许的情况下成为推荐选择。本手册侧重于
    Cinnamon 版本，尽管许多指令同样适用于 MATE 和 Xfce。


    如果你仍不确定哪个版本适合你的硬件，Cinnamon 是一个安全的起点。如果以后出现性能问题，你可以随时切换到更轻量的版本。该过程涉及安装另一种桌面环境并在登录时选择它，让你在无需重新安装系统即可尝试不同的选项。


    ## 创建可启动 USB 驱动器


    安装 Linux Mint 需要一个包含安装文件的可启动 USB 驱动器。此过程将 Linux Mint 镜像写入 USB 闪存器，使其能够启动你的电脑。你需要一个容量至少为
    `4 GB` 的 USB 驱动器，尽管 `8 GB` 或更大更好。请注意，创建启动盘会擦除其上的所有现有数据，请先备份任何重要文件。


    首先从 `linuxmint.com` 官方网站下载 Linux Mint 22 的 ISO 文件。导航到“下载”部分并选择 Cinnamon 版本，除非你特别指定了
    MATE 或 Xfce。ISO 文件约为 `2-3 GB`，因此下载时间取决于你的网速。将文件保存到你记得的地方。


    下载完成后，使用下载页面提供的校验和（checksum）验证 ISO 文件的完整性。这一步确保文件下载完整且正确。网站提供了 `SHA256` 校验和用于验证。在
    Windows 上，你可以使用命令提示符中内置的 `certutil` 命令。在 macOS 上，使用终端中的 `shasum` 命令进行验证。在 Linux
    上，使用 `sha256sum` 命令。将生成的哈值与网站上发布的进行对比。它们应该完全匹配。


    接下来，下载并安装 USB 写入工具。对于 Windows 和 macOS 用户，`balenaEtcher` 提供了一个友好的选项。从 `balena.io/etcher`
    下载并按照标准流程安装。对于 Linux 用户，有多种选择，包括许多发行版中预装的 `GNOME Disks`，或者用于高级用户的 `dd` 命令。


    '
- fmt: '

    Insert your USB drive into an available port. Launch `balenaEtcher` or your chosen
    USB writing tool. The interface typically presents three simple steps. First,
    select the `Linux Mint ISO` file you downloaded. Second, select the target USB
    drive. Double-check that you''ve selected the correct drive, as this process erases
    everything on it. Third, click the `Flash` or `Write` button to begin.


    The writing process takes several minutes depending on your USB drive''s speed.
    Modern `USB 3.0` drives complete faster than older `USB 2.0` models. The tool
    writes the `ISO` contents to the drive and verifies the data. Don''t remove the
    USB drive or interrupt the process. A notification indicates when writing completes
    successfully.


    Some computers require specific `BIOS` settings to boot from USB drives. Before
    proceeding with installation, you may need to adjust boot order settings. Restart
    your computer and press the key that accesses `BIOS` settings. Common keys include
    `F2`, `F12`, `Delete`, or `Esc`, depending on your computer''s manufacturer. The
    correct key typically displays briefly during startup.


    In `BIOS` settings, locate the `Boot` section. Change the boot order to prioritize
    USB devices above the internal hard drive. Some systems allow pressing a key during
    startup to display a boot menu without entering `BIOS` settings. This one-time
    boot selection lets you choose the USB drive without permanently changing boot
    order.


    Save `BIOS` changes and exit. With the bootable USB drive inserted, restart your
    computer. It should boot from the USB drive, displaying the `Linux Mint` boot
    menu. If your computer boots to the existing operating system instead, restart
    and try accessing the boot menu again, ensuring the USB drive is selected.


    # Installing Linux Mint 22


    The installation process transforms your bootable USB drive''s temporary `Linux
    Mint` environment into a permanent installation on your computer''s hard drive.
    The installer guides you through each step with clear explanations and sensible
    defaults.


    After booting from the USB drive, you''ll see the `Linux Mint` boot menu. Select
    "Start Linux Mint" to launch the live environment. This temporary version runs
    entirely from the USB drive without modifying your computer. It allows you to
    try `Linux Mint` before installing and serves as the launching point for installation.


    The live desktop loads after a brief delay. Take a moment to explore if desired.
    The "Install Linux Mint" icon on the desktop begins the installation process.
    Double-click it to launch the installer. You can also access the installer from
    the menu.


    The first installer screen welcomes you and asks about language selection. Choose
    your preferred language for the installation process and resulting system. The
    installer uses this choice for interface elements, menus, and pre-installed applications.
    Additional languages can be added after installation.


    Next, the installer checks for adequate disk space, power connection, and internet
    connectivity. While internet access isn''t strictly required, connecting during
    installation allows downloading updates and additional software. If connected
    via `Ethernet`, the connection establishes automatically. For `Wi-Fi`, click the
    network icon in the system tray, select your network, and enter the password.


    The installation type screen presents several options. For most users replacing
    another operating system entirely, select "Erase disk and install Linux Mint."
    This option uses the entire disk for `Linux Mint`, removing any existing operating
    system and data. Ensure you''ve backed up important files before proceeding.


    Advanced users can select "Something else" for manual partitioning. This option
    allows creating custom partition layouts, setting up dual-boot configurations,
    or installing to specific disk locations. New users should avoid manual partitioning
    unless guided by specific instructions for their situation.


    If another operating system exists on the computer, the installer may offer to
    install alongside it, creating a dual-boot setup. This allows choosing between
    operating systems at startup. Dual-booting requires adequate free space and understanding
    of boot management. For simplicity, clean installation removing the existing system
    is recommended for beginners.


    After selecting the installation type, confirm the disk to use. The installer
    displays detected storage devices. If your computer has multiple drives, ensure
    you''ve selected the correct one. Review the changes summary carefully, as proceeding
    erases the selected disk.


    Click "Install Now" to begin writing to disk. A confirmation dialog reviews the
    changes about to be made. After confirming, the installation proceeds while you
    complete remaining setup steps.


    The timezone selection screen appears next. Choose your geographic location to
    set the system clock correctly. The installer often detects your location automatically
    based on `IP address` if connected to the internet. Verify the selection and adjust
    if needed.


    Keyboard layout configuration follows. Select your keyboard type from the extensive
    list. A text field lets you test the layout, ensuring special characters appear
    correctly. Most users in the United States select "English (US)" layout. The installer
    typically detects appropriate defaults.


    The user account creation screen requests several pieces of information. Enter
    your full name or a preferred name for display purposes. Then create a username,
    which you''ll use for logging in and identifying your account. Usernames must
    be lowercase letters, numbers, and limited punctuation.


    Choose a strong password for your account. The installer indicates password strength
    as you type. Strong passwords combine uppercase and lowercase letters, numbers,
    and symbols. They should be at least eight characters long, though longer is better.
    Confirm the password by typing it a second time.


    Two login options appear below the password fields. "Log in automatically" allows
    the system to skip the login screen and load your desktop immediately after starting.
    This convenience comes at a security cost, as anyone with physical access can
    use your computer. "Require my password to log in" presents a login screen at
    each startup, protecting your data from unauthorized access. For security, requiring
    your password is recommended unless you''re the computer''s sole user and it remains
    in a secure location.


    With account information entered, the installation continues in the background.
    A slideshow highlights `Linux Mint` features while files copy to your hard drive.
    This process takes 10-30 minutes depending on your hardware speed. The installer
    displays progress and estimated time remaining.


    When installation completes, a dialog prompts you to continue using the live environment
    or restart. Remove the USB drive and select "Restart Now." The computer restarts
    and should boot into your new `Linux Mint` installation. If it attempts to boot
    from the USB drive again, remove it during startup or adjust `BIOS` boot order
    to prioritize the internal drive.


    # First Boot and Initial Setup


    The first time your newly installed `Linux Mint` starts, several initial setup
    tasks await. These quick configuration steps ensure your system operates optimally
    from the beginning.


    After the boot process completes, the login screen appears if you chose to require
    your password at startup. Enter your password and press `Enter` or click the login
    button. The desktop environment loads, displaying the Welcome Screen automatically
    on first login.


    The Welcome Screen serves as your guide to initial configuration. It presents
    several tasks to complete, each designed to enhance your `Linux Mint` experience.
    You can return to this utility any time from the menu by searching for "Welcome
    Screen."

    '
