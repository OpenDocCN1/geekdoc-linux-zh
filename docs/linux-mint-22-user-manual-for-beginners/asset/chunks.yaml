  trans: '

    已连接设备出现在蓝牙设置中，并带有断开、删除或访问设备特定设置的选项。如果设备以后没有自动重新连接，请确保其已开启电源并处于范围内，然后在蓝牙设置中点击它并选择“连接”。


    ## 电源管理


    电源设置控制计算机如何管理能量消耗，这对于笔记本电脑最大化电池续航时间尤为重要。


    通过点击 `Power Management` 在系统设置中访问电源设置。设置窗口提供了在电池供电与接通电源运行时不同的行为选项。


    自动挂起在一段时间未活动后将计算机置低功耗状态。你可以为电池和交流电源设置不同的挂起时间。较长的时间可以让计算机保持更长时间激活，对于经常返回工作的用户非常方便。短的时间可以节省能量，但如果你只是在阅读屏幕而没有活动输入，可能会中断工作。


    “关闭盖子时”设置决定了笔记本在关闭屏幕时的行为。选项包括挂起、休眠或什么都不做。挂起模式是常见的，允许在打开盖子时快速恢复，且耗电极低。休眠会将会话保存到磁盘并完全关机，不消耗电源，但恢复速度较慢。什么都不做会让笔记本在屏幕关闭的情况下继续运行，在你使用外部显示器时非常有用。


    按钮电源设置指定了按下电源按钮时会发生什么。选项包括询问操作、挂起、休眠或关机。许多用户倾向于“询问”，它会弹出一个包含多个选项的对话框，而不是假设你的意图。


    电池百分比和剩余时间出现在笔记本的系统托中。点击电池图标可显示详细的电量信息以及根据当前功耗估计的剩余时间。这有助于你在使用电池供电时规划工作。


    电源统计提供了有关电池健康和历史用电情况的详细信息。通过点击电源管理设置中的“Power Statistics”访问这些信息。图表显示了随变化的充电和放电率，有助于识别消耗过多电的应用程序。


    ## 日期和时间配置


    日期时间设置确保系统时钟显示正确并根据你的时区进行调整。


    打开系统设置并点击 `Date & Time`。设置窗口显示当前的日期、时间和所在时区。


    Linux Mint 可以使用网络时间服务器自动同步时间。启用“Network time”以保持时钟准确。系统会定期连接到时间服务器并在需要时调整时。这确保了即使计算机的内部时钟略有漂移也能保持准确性。


    如果无法使用或不需要自动时间，你可以手动设置时间。禁用“Network time”并点击日期或时间来编辑数值。使用日历组件选择正确的日期时间字段来设置小时和分钟。


    时区选择对于准确显示时间至关重要。在地图上点击你当前的时区，或从下拉列表中选择。Linux Mint 包含了全球所有时区。选择与你所在地匹配的一个。如果你旅行，在更改时区时更新此设置以保持本地时间准确。


    时间格式可以显示为 12 小制（带有 AM/PM）或 24 小时制。在设置中选择你的偏好。许多国家使用 24 小时制，而其他国家则倾向于带有 AM/PM 标识的
    12 小制。


    ## 用户账户和权限


    用户账户设置管理谁可以使用你的计算机以及他们拥有什么权限。


    通过点击 `User Accounts` 在系统设置中访问用户账户。这将显示系统上所有的账户。你的账户显示第一个，标记为当前用户。


    要创建新用户账户，点击加号图标。系统会提示你输入密码以确认管理员权限。为新账户输入用户名，遵循与安装时创建账户时相同的规则。选择新用户应是标准用户还是管理员。


    标准用户可以使用计算机并修改自己的设置，但不能安装软件、修改系统设置或影响其他用户。管理员账户具有完全系统访问权限。除非新用户需要管理员权限，否则为了安全请创建一个标准账户。


    为新账户设置密码，或允许用户在首次登录时设置自己的密码。如果你自己设置密码，请确保它是强密码，并安全地告知用户。


    账户类型可以在创建后进行更改。点击现有账户并选择账户类型下拉菜单，以便在标准用户和管理员之间进行切换。这允许将用户提升为管理员状态或移除管理员权限。


    删除用户账户将将其从系统中移除。点击某个账户并选择减号图标来删除它。系统会询问你是保留还是删除该用户的文件。保留文件会将它们移动到安全位置，管理员可以访问这些文件。删除文件将将其永久删除。


    你的账户设置允许更改密码、显示名称和头像。点击你的账户并选择“Change password”来更新密码。这需要输入当前密码，然后输入两次新密码进行确认。


    头像显示在登录界面和各种界面元素中。点击用户图标图像选择新图片。你可以从内置图像中选择，或从自己的文件中选择。当多个用户共享一台计算机时，头像有助于快速识别账户。


    安装期间配置的自动登录可以在用户账户中更改。启用或禁用你账户的自动登录。记住，自动登录会降低安全性，因为它允许任何物理接触电脑的人无需验证即可使用你的电脑。


    # 第 4 章：文件管理


    ### 理解文件管理器


    文件管理器称为 `Nemo`，提供了对文件和文件夹的图形化访问。它是你进入文件系统的窗口，允许你在不使用命令行工具的情况下浏览、组织和操作文件。


    点击菜单或面板中的“Files”图标启动文件管理器。它默认打开并显示你的主目录（Home）。文件管理器窗口包含几个区域，每个区域都有特定用途。


    顶部的工具栏提供了导航按钮、视图选项和搜索功能。后退和前进箭头导航文件夹历史，类似于浏览器的导航。向上箭头移动到包含当前文件夹的父文件夹。


    左侧的侧边栏显示常用位置的快捷方式。`Home` 进入你的个人文件夹。`Desktop` 显示桌面内容。`Documents`、`Downloads`、`Music`、`Pictures`
    和 `Videos` 提供了对这些标准文件夹的快速访问。可以为经常访问的位置添加快捷方式。


    主视图区域显示当前位置的文件和文件夹。多种视图模式以不同的方式呈现内容。`Icon view` 图标视图显示大图标，适合有助于视觉识别的图片文件夹。`List
    view` 列表视图按列显示详细信息，包括名称、大小、类型和修改日期。`Compact view` 紧凑视图通过较小的图标和极少的细节在相同空间内适应更多项目。


    底部的状态栏显示有关当前文件夹和所选项目的信息。它显示文件夹包含多少个项目以及所选文件的总大小。当选择多个文件时，状态栏会指示你选择了多少个项目。


    位置栏显示你当前在文件系统中的位置位置。它显示文件夹路径，每个文件夹名称均可点击以直接跳转到该层级。这种面包屑式导航让向上移动多个文件夹层级变得轻而易举。


    ### 导航你的文件系统


