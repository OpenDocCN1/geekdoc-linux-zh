    Save your document by clicking `File` menu and selecting `Save`, or press `Ctrl+S`.
    Choose a location, enter a filename, and select the file format. The default `.odt`
    format works well for continued editing in LibreOffice. Choose `.docx` if sharing
    with Microsoft Word users. Save regularly while working to prevent data loss from
    unexpected shutdowns or crashes.


    ## Working with Spreadsheets in Calc


    LibreOffice Calc handles spreadsheet tasks from simple calculations to complex
    data analysis. Launch it from the Office category or select `Spreadsheet` when
    opening LibreOffice.


    Calc displays a grid of cells organized in columns (labeled `A`, `B`, `C`) and
    rows (numbered `1`, `2`, `3`). Each cell has a unique address combining its column
    letter and row number, like `A1` or `C5`. Click any cell to select it for data
    entry.


    Enter data by clicking a cell and typing. Press `Enter` to confirm entry and move
    down one cell, or `Tab` to move right. Cells can contain text, numbers, dates,
    or formulas. Calc interprets what you type, formatting numbers appropriately and
    recognizing dates automatically.


    Formulas perform calculations based on cell contents. All formulas begin with
    an equals sign. To add numbers in cells `A1` and `A2`, click cell `A3` and type:
    `=A1+A2`


    Press `Enter` and the sum appears in `A3`. The cell displays the result, while
    the formula bar at the top shows the underlying formula. Common operators include
    `+` for addition, `-` for subtraction, `*` for multiplication, and `/` for division.


    Functions are pre-built formulas for common calculations. The `SUM` function adds
    multiple cells. To sum cells `A1` through `A10`, type: `=SUM(A1:A10)`


    The colon `:` indicates a range from the first cell to the last. Other useful
    functions include `AVERAGE` for calculating means, `MAX` and `MIN` for finding
    highest and lowest values, and `COUNT` for counting numeric entries.


    Cell formatting adjusts appearance. Select cells and use toolbar buttons to apply
    bold, change font size, adjust text color, or modify background color. Number
    formatting controls how values display. Select cells containing currency and apply
    currency formatting to show dollar signs and two decimal places.


    Column width and row height adjust to accommodate content. Position the mouse
    pointer on the border between column headers until it becomes a resize cursor.
    Click and drag to adjust width. Double-clicking the border automatically sizes
    the column to fit its content.


    Charts visualize data graphically. Select the data you want to chart, then click
    `Insert` menu and choose `Chart`. A wizard guides you through selecting chart
    type (bar, line, pie, etc.), configuring data ranges, and customizing appearance.
    Charts update automatically when underlying data changes.


    Freeze rows or columns to keep them visible while scrolling through large spreadsheets.
    This helps maintain context when working with data extending beyond the screen.
    Click the `View` menu, select `Freeze Rows and Columns`, and choose which rows
    or columns to freeze.


    ## Creating Presentations with Impress


    LibreOffice Impress creates presentations for meetings, lectures, or any situation
    requiring visual slides. Launch it from the Office category or select `Presentation`
    in LibreOffice.


    Impress opens showing the `Presentation Wizard`. Choose a blank presentation to
    start fresh, or select a template providing pre-designed layouts and color schemes.
    Templates speed creation for common presentation types.


    Each slide contains placeholders for content. Click placeholders to add titles,
    text, images, or other elements. The first slide typically uses a title slide
    layout with placeholders for presentation title and subtitle.


    Add new slides using the `Slide` menu or toolbar button. Select a layout appropriate
    for the slide''s content. `Title and Content` layout provides a title area and
    space for text or graphics. `Two Content` layout creates two side-by-side content
    areas, useful for comparisons.


    Enter text by clicking text placeholders and typing. Format text using familiar
    tools from Writer, including font selection, size, bold, italic, and colors. Keep
    text concise on slides. Presentations work best with brief bullet points supplemented
    by your spoken explanation.


    Insert images through the `Insert` menu. Position and resize images by dragging.
    Images make presentations more engaging and help illustrate concepts. Ensure images
    are relevant to your content and high enough quality to display clearly on projection
    screens.


    Transitions control how slides advance from one to the next. Apply transitions
    through the `Slide Transition` panel on the right. Options range from simple cuts
    to elaborate animations. Use transitions sparingly, as excessive animation distracts
    from content. Consistent simple transitions maintain professionalism.


    Add animations to individual slide elements through the `Animation` panel. Elements
    can appear gradually, emphasizing points one at a time. Again, restraint is key.
    Animations should enhance communication, not become the focus.


    Presenter notes provide reminders visible to you but not the audience. Add notes
    in the space below each slide in `Normal` view. During presentations, notes appear
    on your screen while the audience sees only slides.


    Present your slideshow by clicking `Slideshow` menu and selecting `Start from
    First Slide`, or press `F5`. Press `Escape` to exit mode.


    ## PDF Management


    `PDF` (Portable Document Format) files maintain formatting across different systems,
    making them ideal for sharing documents. Linux Mint includes tools for viewing
    and creating PDFs.


    The default document viewer opens PDFs when you double-click them. It displays
    pages, allows zooming, and provides navigation tools.


    LibreOffice creates PDFs directly from any document. After finishing a document
    in `Writer`, `Calc`, or `Impress`, click `File` menu and select `Export as PDF`.
    Configure options including page range, image quality, and whether to include
    bookmarks. Click `Export`, choose a location and filename, and save the PDF.


    PDF creation preserves your document''s formatting exactly as it appears in LibreOffice.
    Recipients see identical layouts regardless of their operating system or whether
    they have LibreOffice installed. This makes PDFs perfect for forms, reports, and
    any documents requiring precise formatting.


    Some PDFs are fillable forms with fields for entering information. The document
    viewer allows filling these fields. Type in text fields, check boxes, and select
    radio buttons. After completing the form, save the filled version.


    ## Calendar and Task Management


    Organizing appointments and tasks improves productivity. Linux Mint supports several
    calendar applications.


    `GNOME Calendar` provides straightforward calendar functionality. Install it through
    the `Software Manager` by searching for `Calendar`. After installation, launch
    it from the Office category.


    The calendar opens showing a monthly view. Click any date to add an event. Enter
    the event title, start time, end time, and optional notes. Save the event and
    it appears on the calendar. Color-coding helps distinguish different event types.


    Events can repeat on schedules. When creating an event, enable repetition and
    specify daily, weekly, or monthly recurrence. This works well for regular meetings
    or recurring tasks.


    Calendar integrates with online calendar services through `GNOME Online Accounts`.
    Add your Google or other calendar accounts in System Settings under `Online Accounts`.
    Events sync between your computer and online calendars, keeping schedules coordinated
    across devices.


    `Evolution` provides more comprehensive organization tools including email, calendar,
    contacts, and tasks in one application. Install it through the `Software Manager`
    if you want integrated personal information management.

