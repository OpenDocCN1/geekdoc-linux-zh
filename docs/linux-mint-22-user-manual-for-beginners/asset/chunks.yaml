    点击 `File` 菜单并选择 `Save`，或按 `Ctrl+S` 保存您的文档。选择位置、输入文件名并选择文件格式。默认的 `.odt` 格式适用于在
    LibreOffice 中继续编辑。如果与 Microsoft Word 用户共享，请选择 `.docx`。工作时定期保存，以防止意外关机或崩溃导致数据丢失。


    ## 在 Calc 中处理电子表格


    LibreOffice Calc 处理从简单计算到复杂数据分析的电子表格任务。从 Office 类别启动它，或在打开 LibreOffice 时选择 `Spreadsheet`。


    Calc 显示由列（标记为 `A`、`B`、`C`）和行（编号为 `1`、`2`、`3`）组成的单元格矩阵。每个单元格都有唯一的列字母和行数字地址，例如 `A1`
    或 `C5`。点击任意单元格即可进行数据输入。


    点击单元格并输入即可。按 `Enter` 确认输入并向下移动一格，或按 `Tab` 向右移动。单元格可以包含文本、数字、日期或公式。Calc 会解释你输入的内容，适当格式化数字并自动识别日期。


    公式根据单元格内容执行计算。所有公式均以等号开头。将单元格 `A1` 和 `A2` 中的数字相加，点击单元格 `A3` 并输入：`=A1+A2`


    按 `Enter` 总和出现在 `A3` 中。单元格显示结果，而顶部的公式栏显示底层公式。常用的运算符包括用于加法的 `+`、用于减法的 `-`、用于乘法的
    `*` 和用于除法的 `/`。


    函数是用于常用计算的预建公式。`SUM` 函数用于多个单元格。要对单元格 `A1` 到 `A10` 求和，请输入：`=SUM(A1:A10)`


    冒号 `:` 表示从第一个单元格到最后一个单元格的范围。其他实用函数包括用于计算平均值的 `AVERAGE`、用于查找最高最低值的 `MAX` 和 `MIN`，以及用于计数数字输入的
    `COUNT`。


    单元格格式化可以调整外观。选择单元格并使用工具栏按钮应用加粗、更改字体大小、调整文本颜色或修改背景颜色。数字格式控制值的显示方式。选择包含货币的单元格并应用货币格式以显示美元符号和两位小数。


    列宽和行高会调整以适应内容。将鼠标指针置在列标题之间的边界上，直到它变成调整大小的光标。点击并拖动以调整宽度。双击边界将自动调整列宽以适应其内容。


    图表以图形方式可视化数据。选择您想要制作图表的数据，然后点击 `Insert` 菜单并选择 `Chart`。向导将引导您选择图表类型（柱状图、折线、饼图等）、配置数据范围并自定义外观。当底层数据更改时，图表会自动更新。


    冻结行或列以便在滚动查看大型电子表格时保持其可见。这有助于在处理超出屏幕的数据时保持上下文。点击 `View` 菜单，选择 `Freeze Rows and
    Columns`，并选择要冻结的行或列。


    ## 使用 Impress 创建演示文


    LibreOffice Impress 为会议、演讲或任何需要视觉幻灯片的情况创建演示文稿。从 Office 类别启动它，或在 LibreOffice 中选择
    `Presentation`。


    Impress 打开时会显示 `Presentation Wizard`。选择空白演示文稿从零开始，或选择提供预设布局和配色方案的模板。模板可以加快常见演示文稿类型的创建速度。


    每张幻灯片都包含内容的占位符。点击占位符添加标题、文本、图像或其他元素。第一张幻灯片通常使用标题幻灯片布局，留有演示标题和副标题的占位符。


    使用 `Slide` 菜单或工具栏按钮添加新幻灯片。选择适合幻灯片内容的布局。`Title and Content` 布局提供标题区域以及文本或图形空间。`Two
    Content` 布局创建两个并排的内容区域，适用于比较。


    点击文本占位符并输入以输入文本。使用 Writer 中熟悉的工具格式化文本，包括字体选择、大小、加粗、斜体和颜色。保持幻灯片上的文本简洁。演示文稿在简短的要点辅以您的口头说明时效果最佳。


    通过 `Insert` 菜单插入图像。通过拖动对位置并调整图像大小。图像使演示文稿更具吸引力，并有助于说明概念。确保图像与您的内容相关，且质量足够以便在投影屏幕上清晰显示。


    切换效果控制幻灯片从一张移动到下一张的方式。通过右侧的 `Slide Transition` 面应用切换效果。选项从简单的剪切到复杂的动画不等。谨慎使用切换效果，因为过多的动画会分散内容的注意力。一致的简单切换可以保持专业性。


    通过 `Animation` 面板为单个幻灯片元素添加动画。元素可以逐渐出现，逐个强调重点。同样，节制是关键。动画应该增强交流，而不是成为焦点。


    演讲者备注提供了您可见但观众不可见的提醒。在 `Normal` 视图下，在每张幻灯片下空间添加备注。在演示期间，备注显示在您的屏幕上，而观众只看到幻灯片。


    点击 `Slideshow` 菜单并选择 `Start from First Slide` 幻灯片，或按 `F5`。按 `Escape` 退出模式。


    ## PDF 管理


    `PDF`（便携文档格式）文件在不同系统中保持格式，是共享文档的理想选择。Linux Mint 包含了查看和创建 PDF 的工具。


    默认文档查看器会在双击时打开 PDF。它显示页面、允许缩放并提供导航工具。


    LibreOffice 可直接从任何文档创建 PDF。在 `Writer`、`Calc` 或 `Impress` 中完成文档后，点击 `File` 菜单并选择
    `Export as PDF`。配置选项包括页面范围、图像质量以及是否包含签。点击 `Export`，选择位置和文件名并保存 PDF。


    PDF 的创建完整保留了在 LibreOffice 中显示的文档格式。无论接收者的操作系统如何或是否安装了 LibreOffice，看到的布局都是相同的。这使得
    PDF 成为表单、报告和任何需要精确格式文档的完美选择。


    某些 PDF 是可填充表单，带有输入信息的字段。文档查看器允许填充这些字段。在文本框中输入、勾选框并选择单选按钮。完成表单后，保存填充后的版本。


    ## 日历和任务管理


    组织预约和任务可以提高效率。Linux Mint 支持多个日历应用程序。


    `GNOME Calendar` 提供直接的日历功能。通过 `Software Manager` 搜索 `Calendar` 安装它。安装后，从 Office
    类别启动它。


    日历打开时显示月视图。点击任何日期添加事件。输入事件标题、开始时间、结束时间和可选备注。保存事件，它将出现在日历上。颜色编码有助于区分不同的事件类型。


    事件可以按计划重复。在创建事件时，启用重复并指定每天、每周或每月循环。这对于定期会议或循环任务非常有效。


    日历通过 `GNOME Online Accounts` 与在线日历服务集成。在系统设置的 `Online Accounts` 下添加您的 Google 或其他日历账户。事件在您的计算机和在线日历之间同步，保持跨设备的时间表一致。


    `Evolution` 提供了更全面的组织工具，在了一个应用程序中包含电子邮件、日历、联系人和任务。如果您需要集成的个人信息管理，请通过 `Software
    Manager` 安装它。


    '
- fmt: '

    ## Note-Taking Applications


    Digital note-taking captures thoughts, meeting notes, and information for later
    reference.


    GNOME Notes offers simple note creation. Install it through the Software Manager.
    The interface displays notes as cards. Click the plus button to create new notes.
    Type freely with automatic formatting. Notes save automatically without needing
    manual save actions.


    Notes support basic formatting including bold, italic, and lists. They''re searchable,
    so you can find information quickly even with many notes. The simple interface
    removes distractions, focusing on content capture.


    For more advanced note-taking, Joplin provides features including markdown support,
    note organization in notebooks, tagging, and synchronization with cloud services.
    Install Joplin through the Software Manager. It suits users managing extensive
    note collections or wanting synchronization across devices.


    # Chapter 8: Multimedia Management


    ### Playing Audio Files


    Linux Mint includes several applications for audio playback. The pre-installed
    music player handles most audio formats including `MP3`, `FLAC`, `OGG`, and `AAC`.


    Launch the music player from the Sound & Video category in the Menu. The interface
    shows your music library, playlists, and playback controls. When first launched,
    the library may be empty until you add music.


    To add music, click the hamburger menu and select `Preferences`. Under `Music
    Folders`, add directories containing your music files. The player scans these
    locations and imports audio files into the library.


    The library organizes music by artists, albums, and songs. Browse through categories
    to find music. Click any song to begin playback. Standard playback controls include
    play/pause, skip forward/backward, volume adjustment, and shuffle/repeat options.


    Create playlists to group related songs. Right-click songs and add them to new
    or existing playlists. Playlists allow customizing listening experiences for different
    moods or activities.


    ### Managing Music Collections


    As music libraries grow, organization becomes important. Proper file naming and
    folder structure help manage collections.


    Organize music files by artist and album in your Music folder. Create a folder
    for each artist, with subfolders for their albums. Within album folders, place
    audio files with track numbers in filenames for proper ordering.


    Audio files contain metadata tags storing information like artist name, album
    title, track number, and genre. Music players read these tags to organize libraries
    automatically. Ensure tags are correct by editing them in your music player or
    using dedicated tag editor applications.


    Many music players support importing CDs. Insert a CD, and the player offers to
    rip (copy) tracks to your hard drive. It retrieves track information from online
    databases and saves properly tagged audio files.


    ### Video Playback


    VLC Media Player handles virtually any video format. If you haven''t installed
    it yet, get it from the Software Manager by searching for "VLC."


    Launch VLC from the Sound & Video category. The interface includes a large viewing
    area and playback controls. Open video files by clicking `Media` menu and selecting
    `Open File`, or drag video files directly into the window.


    VLC plays common formats like `MP4`, `MKV`, `AVI`, and `MOV` without requiring
    additional codec installations. Playback controls resemble familiar media players
    with play/pause, timeline scrubbing, volume control, and fullscreen toggle.


    Subtitles enhance videos in foreign languages or improve accessibility. If subtitle
    files exist separately, load them by clicking `Subtitle` menu and selecting `Add
    Subtitle File`. VLC also displays embedded subtitles automatically. Enable or
    disable them through the `Subtitle` menu.


    VLC includes advanced features like playback speed adjustment, video effects,
    and audio equalizer. Access these through the `Tools` menu. Playback speed changes
    are useful for language learning or quickly reviewing long videos.


    ### Photo Viewing and Basic Editing


    The default image viewer opens when you double-click image files. It displays
    photos with controls for zooming, rotating, and navigating through multiple images
    in a folder.


    For basic editing, GIMP provides comprehensive image manipulation capabilities.
    Install it through the Software Manager if not already present. GIMP handles tasks
    from simple cropping to complex photo retouching.


    Launch GIMP and open an image through `File` menu. The interface shows the image
    in the center with toolboxes on the sides. The toolbox on the left contains selection
    tools, painting tools, and transformation tools.


    Crop images using the crop tool. Select it from the toolbox, then click and drag
    on the image to define the crop area. Adjust the selection by dragging edges or
    corners. Press `Enter` to complete the crop, removing areas outside the selection.


    Resize images for web use or printing. Click `Image` menu and select `Scale Image`.
    Enter new dimensions in pixels or adjust by percentage. Ensure "chain" icon is
    linked to maintain aspect ratio, preventing distortion.


    Adjust brightness, contrast, and color balance through the `Colors` menu. These
    adjustments improve photos that are too dark, too light, or have color casts.
    Make small adjustments and preview results before applying.


    ### Screen Recording


    Capturing screen activity is useful for creating tutorials, documenting processes,
    or recording video calls.


    SimpleScreenRecorder provides straightforward screen recording. Install it through
    the Software Manager. After installation, launch it from the Sound & Video category.


    The interface guides you through recording setup. First, choose what to record:
    entire screen, a specific window, or a selected area. For tutorials, recording
    the entire screen ensures nothing is missed. For focusing on specific applications,
    select that window.


    Configure audio recording next. Choose whether to record system audio, microphone
    input, both, or neither. Recording system audio captures sounds from applications.
    Microphone input adds your voice narration. Both together work well for tutorials.


    Set the output location and filename. Choose a location with adequate free space,
    as video files can be large. Select a video format, with `MP4` being a widely
    compatible choice.


    Click `Start Recording` to begin. A countdown gives you time to prepare. Perform
    the actions you want to record. Click `Stop Recording` when finished. The video
    file saves to your specified location, ready for sharing or editing.


    ### Audio Recording


    Recording audio is necessary for podcasts, voice notes, or music recording.


    GNOME Sound Recorder provides simple audio recording. Install it through the Software
    Manager if not pre-installed. Launch it from the Sound & Video category.


    The interface is minimal, featuring a large record button. Click it to begin recording.
    The application displays a waveform as you record, providing visual feedback of
    audio levels. Click `Stop` when finished.


    Recordings save automatically with timestamps as filenames. Play recordings within
    the application or open them in other audio players. For more advanced audio recording
    and editing, consider installing `Audacity`, which provides multi-track recording,
    effects, and detailed editing capabilities.


    ### Streaming Media


    Streaming services provide access to vast entertainment libraries. Most streaming
    platforms work through web browsers.


    Netflix, Hulu, Disney+, and similar services require only a web browser and subscription.
    Visit their websites in `Firefox`, log in, and stream content directly. Video
    quality adjusts automatically based on your connection speed.


    For music streaming, Spotify offers a web player accessible through browsers.
    Visit `open.spotify.com`, log in, and access your playlists and recommendations.
    Some streaming services provide dedicated Linux applications available through
    the Software Manager.

    '
