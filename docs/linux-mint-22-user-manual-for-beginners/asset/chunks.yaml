    将你的 USB 驱动器插入可用端口。启动 `balenaEtcher` 或你选择的 USB 写入工具。界面通常会显示三个简单的步骤。首先，选择你下载的 `Linux
    Mint ISO` 文件。其次，选择目标 USB 驱动器。双击确认已选择了正确的驱动器，因为此过程会擦除其上的所有内容。第三，点击 `Flash` 或 `Write`
    按钮开始。


    写入过程需要几分钟，取决于你的 USB 驱动器的速度。现代的 `USB 3.0` 驱动器比旧的 `USB 2.0` 型号更快。该工具会将 `ISO` 内容写入驱动器并验证数据。不要移除
    USB 驱动器或中断过程。写入成功完成后，会有通知提示。


    某些电脑需要特定的 `BIOS` 设置才能从 USB 驱动器启动。在继续进行安装之前，你可能需要调整启动顺序设置。重启电脑并按下访问 `BIOS` 设置的按键。常见的键包括
    `F2`、`F12`、`Delete` 或 `Esc`，取决于你的电脑制造商。正确的键通常会在启动期间短暂显示。


    在 `BIOS` 设置中，找到 `Boot` 部分。将启动顺序更改为将 USB 设备优先级置于内部硬盘之上。某些系统允许在启动期间按下某个键显示启动菜单，而无需进入
    `BIOS` 设置。这种一次性启动选择允许你选择 USB 驱动器，而无需永久更改启动顺序。


    保存 `BIOS` 更改并退出。插入可启动的 USB 驱动器后，重启电脑。它应该从 USB 驱动器启动，并显示 `Linux Mint` 启动菜单。如果你的电脑启动到现有的操作系统，请重启并尝试再次访问启动菜单，确保选中了
    USB 驱动器。


    # 安装 Linux Mint 22


    安装过程将你可启动的 USB 驱动器中的临时 `Linux Mint` 环境转换为电脑硬盘上的永久安装。安装程序将通过清晰的解释和合理的默认设置引导你完成每一步。


    从 USB 驱动器启动后，你将看到 `Linux Mint` 启动菜单。选择“Start Linux Mint”来启动实时运行环境。此临时版本完全从 USB
    驱动器运行，而不会修改你的电脑。它允许你在安装之前尝试 `Linux Mint`，并作为安装的起点。


    实时桌面会在简短延迟后加载。可以花点时间探索（可选）。桌面上的“Install Linux Mint”图标将开始安装过程。双击它启动安装程序。你也可以从菜单访问安装程序。


    第一个安装程序界面欢迎你，并询问语言选择。为安装过程和生成的系统选择你偏好的语言。安装程序将此此选择用于界面元素、菜单和预装应用程序。安装后可以添加更多语言。


    接下来，安装程序将检查磁盘空间是否充足、电源连接情况以及互联网连接情况。虽然不是强制要求访问互联网，但在安装期间进行连接允许下载更新和额外软件。如果通过 `Ethernet`
    连接，连接将自动建立。对于 `Wi-Fi`，点击系统托盘中的网络图标，选择你的网络并输入密码。


    安装类型屏幕提供几个选项。对于大多数完全替换另一个操作系统的用户，请选择“Erase disk and install Linux Mint”。此选项将整个硬盘用于
    `Linux Mint`，删除任何现有的操作系统和数据。在继续之前，请确保你已备份了重要文件。


    高级用户可以选择“Something else”进行手动分区。此选项允许创建自定义的分区布局、设置双启动配置或安装到特定的磁盘位置。新用户应避免手动分区，除非有针对其情况的特定说明指导。


    如果电脑上存在另一个操作系统，安装程序可能会提议与其并列安装，创建一个双启动设置。这允许在启动时在操作系统之间切换。双启动需要足够的空闲空间以及对启动管理的理解。为了简单起见，建议初学者进行删除现有系统的纯净安装。


    选择安装类型后，确认要使用的磁盘。安装程序会显示检测到的存储设备。如果你的电脑有多个驱动器，请确保你选择了正确的一个。仔细检查更改摘要，因为继续操作将擦除选定的磁盘。


    点击“Install Now”开始写入磁盘。确认对话框会检查将要进行的更改。确认后，安装程序将继续，同时你完成剩余的设置步骤。


    接下来将显示时区选择屏幕。选择你的地理位置以正确设置系统时钟。如果连接了互联网，安装程序通常会根据 `IP address` 自动检测你的位置。验证选择并在需要时调整。


    随后是键盘布局配置。从大量的列表中选择你的键盘类型。文本字段允许你测试布局，确保特殊字符显示正确。大多数美国用户选择“English (US)”布局。安装程序通常会检测到合适的默认值。


    用户账户创建屏幕要求几条信息。输入你的全名或用于显示的偏好名称。然后创建一个用户名，你用它登录登录和识别账户。用户名必须是小写字母、数字和有限的标点符号。


    为你的账户选择一个强密码。安装程序会在输入时指示密码强度。强密码结合了大和小字母、数字和符号。它们的长度至少为八个字符，越长越好。通过再次输入密码来确认密码。


    密码字段下方出现两个登录选项。“Log in automatically”允许系统跳过登录界面并在启动后立即加载你的桌面。这种便利性是以安全性为代价的，因为任何拥有物理访问权限的人都可以使用你的电脑。“Require
    my password to log in”在每次启动时都会显示登录界面，保护你的数据免受未经授权的访问。出于安全考虑，除非你是电脑的唯一用户且它处于安全位置，否则建议需要密码。


    输入账户信息后，安装将在后台继续。当文件复制到硬盘时，幻灯片会突出显示 `Linux Mint` 的特性。此过程根据硬件速度需要 10-30 分钟。安装程序会显示进度和预计剩余时间。


    安装完成后，对话框提示你继续使用实时环境或重启。移除 USB 驱动器并选择“Restart Now”。电脑重启并应该进入你新的 `Linux Mint` 安装。如果它再次尝试从
    USB 驱动器启动，请在启动期间移除它或调整 `BIOS` 启动顺序以优先考虑硬盘。


    # 首次启动和初始设置


    当你新安装的 `Linux Mint` 首次启动时，有几个初始设置任务等待。这些快速配置步骤确保你的系统从开始就处于优化状态。


    启动过程完成后，如果你选择启动时需要密码，将出现登录界面。输入密码并按 `Enter` 或点击登录按钮。桌面环境加载，首次登录时会自动显示欢迎屏幕。


    欢迎屏幕是你初始配置的指南。它提供了几个需要完成的任务，每个任务都旨在增强你的 `Linux Mint` 体验。你可以随时从菜单搜索“Welcome Screen”返回此实用工具。

    '
- fmt: '

    The first suggestion involves choosing a desktop color scheme. Linux Mint supports
    both light and dark themes. Light themes use bright backgrounds with dark text,
    resembling traditional desktop appearance. Dark themes invert this, displaying
    light text on dark backgrounds. Many users find dark themes easier on the eyes,
    especially during extended use or in low-light conditions. You can try both and
    switch later if desired. Select your preference from the theme options.


    Next, the Welcome Screen suggests configuring system snapshots. `Timeshift` creates
    system backups that can restore your installation if problems occur. Setting up
    `Timeshift` early provides a safety net as you learn and customize your system.
    Click the `Timeshift` option to launch the utility.


    `Timeshift`s first-run wizard guides you through setup. It asks where to store
    snapshots. If your computer has a single drive, that drive is selected automatically.
    Multiple drives offer the option to store snapshots on a separate drive, which
    provides better protection. Select appropriate storage and continue.


    The wizard asks about snapshot type. `RSYNC` is recommended and selected by default.
    This type efficiently stores system snapshots, only recording changes between
    snapshots rather than duplicating all files each time. Continue with `RSYNC` selected.


    Choose the snapshot schedule next. `Timeshift` can create snapshots automatically
    at regular intervals. Options include daily, weekly, and monthly. The recommended
    setting creates snapshots before system updates, protecting against update-related
    issues. Enable at least weekly snapshots for regular protection. You can adjust
    frequency later based on your preferences.


    Finally, specify how many snapshots to retain. More snapshots provide more restore
    points but consume more disk space. Default settings balance protection and storage
    efficiently. Complete the `Timeshift` setup to enable system snapshots.


    Return to the Welcome Screen and proceed to the `Driver Manager`. Linux Mint detects
    many hardware components automatically, but some devices perform better with manufacturer-specific
    drivers, particularly graphics cards and wireless adapters. The `Driver Manager`
    identifies available proprietary drivers and allows easy installation.


    Launch the `Driver Manager` from the Welcome Screen. It scans your hardware and
    displays results. If proprietary drivers are available, they appear in the list
    with recommendations. Graphics card drivers appear most commonly. `NVIDIA` cards
    benefit significantly from official drivers, which provide better performance
    and features than open-source alternatives.


    To install a recommended driver, select it from the list and click `Apply Changes`.
    The system downloads and installs the driver. A system restart is required for
    driver changes to take effect. After installing drivers, restart your computer
    to complete the configuration.


    The `Update Manager` icon in the system tray indicates available updates shortly
    after first login. Keeping your system updated ensures you have the latest security
    patches and improvements. Click the `Update Manager` icon to review available
    updates. On first run, significant updates may be available. Select `Install Updates`
    to apply them. This process may take considerable time on first update.


    Language support receives attention next if you use languages beyond English.
    The `Language Settings` tool allows installing additional language packs, input
    methods, and keyboard layouts. Access it from the Welcome Screen or system settings.
    Install support for any languages you need for applications, spell-checking, and
    interface elements.


    After completing these initial setup tasks, your Linux Mint installation is fully
    configured and ready for daily use. The Welcome Screen can be dismissed, though
    it includes additional useful information and links to resources worth exploring
    when time permits.


    ### Understanding the Desktop Environment


    The `Cinnamon` desktop environment provides Linux Mint''s graphical interface.
    Understanding its components and organization helps you navigate efficiently and
    customize your workspace.


    At the bottom of the screen sits the `panel`, a horizontal bar containing several
    elements. On the left end, the `Menu` icon provides access to installed applications,
    system settings, and power options. This menu serves as your primary navigation
    point for launching programs.


    Moving right along the panel, you''ll find the `Show Desktop` button. Clicking
    it minimizes all open windows to reveal the desktop, useful for accessing desktop
    icons or files. Clicking again restores windows to their previous state.


    The `window list` occupies the central section of the `panel`. Each open application
    appears as a button showing the program''s icon and name. Clicking these buttons
    switches between applications. Right-clicking provides additional options like
    closing the application or moving it between workspaces.


    On the right side of the panel, the `system tray` displays various status indicators
    and background programs. The `network` icon shows connection status and provides
    access to network settings. The `volume` icon controls system audio levels. Additional
    icons may appear for programs running in the background, like update notifiers
    or messaging applications.


    The `clock` displays time and date. Clicking it reveals a calendar and quick access
    to time settings. You can customize time and date formats through system settings.


    Finally, the `power` icon on the far right provides access to session options.
    Clicking it reveals choices for logging out, switching users, locking the screen,
    restarting, and shutting down. The `lock screen` option is particularly useful
    when stepping away from your computer temporarily.


    The desktop itself provides an area for placing file and folder shortcuts. Some
    users prefer clean desktops with no icons, while others find desktop shortcuts
    convenient. Right-clicking on the desktop brings up a context menu with options
    for creating new files and folders, changing desktop settings, and accessing file
    management.


    The `workspace switcher`, if visible on your panel, allows organizing work across
    multiple virtual desktops. Linux supports workspaces, which function like separate
    desktops you can switch between. This feature helps organize different tasks.
    You might keep web browsers on one workspace, office applications on another,
    and communication programs on a third. Switch between workspaces using keyboard
    shortcuts or by clicking the workspace switcher panel element.


    Windows can be moved, resized, maximized, minimized, and closed using controls
    in their title bars. The `title bar` at the top of each window shows the application
    name and three buttons on the right. The `X` button closes the window. The `maximize`
    button expands the window to fill the screen. A restored window can be resized
    by dragging edges or corners. The `minimize` button hides the window in the `window
    list` without closing the application.


    `Hot corners` represent an optional feature allowing screen corner activation
    of functions. Moving the mouse cursor to a screen corner can trigger actions like
    showing all windows, switching workspaces, or displaying the desktop. This feature
    is disabled by default but can be enabled through system settings for users who
    find it convenient.


    The `notification area` appears in the top right corner when notifications occur.
    System messages, application alerts, and update notifications appear here. Notifications
    fade automatically after a few seconds but can be dismissed immediately by clicking
    the close button.


    `Alt-Tab` keyboard shortcut cycles through open windows, providing quick switching
    without using the mouse. Holding `Alt` and pressing `Tab` repeatedly moves through
    the `window list`. Release `Alt` to switch to the selected window. This keyboard-based
    navigation often proves faster than clicking panel buttons.

    '
