    内核更新会被特殊对待，因为它们对系统运行至关重要。你可以配置是否接收内核更新通知，以及是手动选择内核还是自动接受建议。除非你有特定的技术需求，否则接受推荐的内核更新通常效果良好。


    ## 从终端安装软件


    终端提供了安装软件的另一种方法，这对于遵循在线指令或无法访问 GUI 工具时非常有用。`apt` 软件包管理器通过命令行界面处理软件安装。


    通过在菜单中搜索“Terminal”（终端）或按下 `Ctrl+Alt+T` 打开终端。终端会显示一个命令提示符，你可以在其中输入命令。


    要安装软件包，请使用 `sudo apt install` 命令后跟上包名。例如，要安装 `htop` 系统监控器，请输入：

    ```

    sudo apt install htop

    ```


    输入命令后按回车。系统会提示你输入密码，因为安装软件需要管理员权限。输入密码（出于安全考虑，输入时屏幕不会显示字符）并按回车。


    `apt` 系统会计算依赖关系，确定需要哪些额外的包。它会显示将安装的内容以及安装需要多少磁盘空间。系统会弹出提示进行确认。输入 `y` 并按回车继续。


    终端会显示下载进度和安装状态。完成后，提示符返回，表示安装成功完成。新安装的应用程序将出现在你的菜单中，或者可以在终端中输入其名称来运行。


    要通过终端删除软件，请使用 `sudo apt remove` 后跟上包名。例如：

    ```

    sudo apt remove htop

    ```


    要通过终端更新所有软件包，首先使用以下命令更新包列表：

    ```

    sudo apt update

    ```


    然后使用以下命令升级所有软件包：

    ```

    sudo apt upgrade

    ```


    这些命令等同于图形化使用“软件管理器”和“更新管理器”。使用你偏好的方法即可。对于经验丰富的用户来说，终端方法更快，而且在遵循技术文档时是必要的。


    ## 不需要的应用程序


    随着时间的推移，你可能会安装一些不再使用的应用程序。删除它们可以释放磁盘空间并让菜单更整洁。


    软件管理器处理卸载的操作与安装一样简单。搜索你想要删除的应用程序。如果它已安装，详情页将显示“移除”按钮而不是“安装”。点击“移除”并在提示时确认。应用程序将被卸载，其菜单项也会消失。


    某些应用程序在卸载后仍会保留额外的数据或配置文件。这些文件通常占用空间极小，并被保留以防你以后重新安装该程序。如果你也想删除这些文件，请使用终端命令：

    ```

    sudo apt purge package-name

    ```


    这会完全删除应用程序及其配置文件。


    Linux Mint 预带的预装应用程序如果你不需要它们，也可以删除。但是，在删除系统组件时要小心。请只删除你认识并确定不需要的应用程序。软件管理器通常会防止删除核心系统组件。


    ## 管理已安装的软件


    软件管理器提供了所有已安装软件的视图，对于查看系统中安装了哪些内容很有帮助。


    在软件管理器中，点击“已安装”（Installed）部分查看所有已安装的应用程序。此列表包含了通过软件管理器和其他方法安装在你的系统上的所有内容。


    该列表显示了每个应用程序的名称、版本号、安装大小和简要描述。你可以按名称、大小或安装日期进行排序。按大小排序有助于识别占用大量磁盘空间的大程序。


    每个应用程序条目都包含一个显示安装来源的指示器。来自官方仓库的应用程序显示为受信任。来自 PPA 或或其他来源的应用程序会显示不同的指示器。这有助于你跟踪软件来源，对于排排除故障或评估安全性很有用。


    某些应用程序接收更新的频率比其他程序高。“已安装”视图显示了每个应用程序上次更新的时间，帮助你识别可能不再活跃维护的软件。非常过时的软件可能存在安全漏洞，因此考虑删除不再接收更新的闲置应用程序。


    # 第 6 章：互联网与通信


    ## 设置网络连接


    可靠的互联网连接对于大多数计算任务至关重要。Linux Mint 为有线和无线连接的网络配置变得非常简单。


    有线以太网连接通常会自动工作。将来自路由器或调制解调器的以太线插入电脑的网络端口。几秒钟后，系统托盘中的网络图标将显示已建立连接。在大多数使用 `DHCP`（动态主机配置协议）进行自动网络设置的家庭和办公室网络中不需要任何配置。


    如果自动配置不起作用，可能需要手动设置网络。右键点击网络图标并选择“网络设置”。点击你的有线连接并选择设置图标。默认情况下，`IPv4` 设置为自动（`DHCP`）。如果你的网络需要手动配置，请将其更改为手动，并输入由网络管理员提供的
    IP 地址、子网掩码、网关和 DNS 服务器。


    无线连接需要选择你的网络并输入密码。点击系统托盘中的网络图标显示可用的无线网络。网络以列表出现，带有名称（SSIDs）和信号强度指示器。信号越强，填充的线条越多。


    点击列表中的你的网络名称。如果网络是加密的（大多数都是），对话框会提示输入密码。按照无线路由器上的配置精确输入密码，注意大写字母、数字和特殊字符。密码是区分大小的，因此
    `"Password123"` 与 `"password123"` 不同。


    如果你希望 Linux Mint 在每次进入范围内都加入此网络，请启用“自动连接”。此便利功能对于家庭和办公室网络效果良好，但在公共网络上应谨慎使用。


    输入正确的凭据后，点击连接。系统会在几秒内建立连接。网络图标会更新以显示信号强度。通知将确认连接成功。


    尽管凭据正确但连接仍然失败，可能有几个原因。路由器可能太远，导致信号微弱。墙壁等物理障碍会干扰无线信号。尝试靠近路由器。如果附近有很多网络使用相同的信道，无线信道可能会拥堵。访问你的路由器管理界面以选择不同的信道。


    某些网络使用 MAC 地址过滤，要求网络管理员在允许连接之前授权你电脑特定的硬件地址。如果你能看到网络但即使使用正确凭据也连接，可能是 MAC 过滤处于激活状态。将你的
    MAC 地址（可在网络设置中查看）提供给管理员进行授权。


    ### 使用 Firefox 浏览器


    Firefox 作为 Linux Mint 的默认浏览器预预装的。它提供了快速、安全的网页浏览体验以及广泛的自定义选项。


    从菜单中的“互联网”类别启动 Firefox，或者如果你已将其添加到面板，则点击其图标启动。浏览器将打开到默认启动页，显示经常访问的网站和快捷方式。


    顶部的地址栏具有双重作用。直接在其中输入网页地址（`URLs`）以导航到特定网站。输入搜索词使用你的默认搜索引擎进行网络搜索。Firefox 能够智能地区分地址和搜索。

