    网络指示器显示您的连接状态。有线连接显示为插头图标，而无线连接则显示信号强度条。点击此图标可显示可用网络和连接选项。您可以从此菜单连接到不同的无线网络、查看连接详情，或访问完整的网络设置。


    音量控制图标显示当前的音频电平。点击它可以显示音量滑块以便快速调整。滑块控制影响所有音频输出的主音量。右键点击音量图标可以访问声音设置，以进行更详细的音频配置。


    电池指示器出现在笔记本电脑上，显示剩余电量。图标会根据电量水平以及是否连接了电源适配器而变化。点击它可以显示更详细的电池信息并访问电源设置。


    其他应用程序可能会在系统盘盘放置图标。消息应用程序通常在此处显示通知。云存储服务指示同步状态。音乐播放器提供播放控制。每个图标通常在点击后会弹出一个相关选项的菜单。


    系统托盘会自动管理图标溢出。如果显示的图标过多，无法舒适容纳，系统托盘会将它们合并。点击一个小小的箭头图标可以显示隐藏的托盘图标。这防止了托盘占用过多的面板空间。


    # 自定义桌面外观


    Linux Mint 提供了广泛的外观自定义功能，允许您创建一个符合自己偏好和工作流的桌面。


    主题控制窗口、菜单和界面元素的整体外观。通过“系统设置”中的“主题”部分访问主题。Linux Mint 包含几个预装主题。浅色主题使用明亮的背景，而深色主题采用较暗的配色方案，许多用户发现长时间使用时这种主题更护眼。


    要更改主题，请打开“系统设置”并点击“主题”。您将看到桌面主题、窗口边框、图标和鼠标指针等类别。每个类别都可以独立自定义，尽管许多用户会选择匹配的主题以保持视觉的一致性。


    桌面主题影响窗口标题栏、菜单、按钮和其他界面元素。点击可用选项以预览它们的样式。更改将立即生效，让您能够轻松评估不同的主题。


    图标主题更改整个系统中图标的外观。不同的图标集提供从极简到详细、从扁平化到三维的不同风格。选择一个吸引您并符合您整体审美偏好的图标主题。


    窗口边框决定窗口框架和标题栏的外观。选项从最大化屏幕空间的最小边框到更具装饰性的设计不等。选择一种既提供您所需功能又能辅助您所选主题的边界样式。


    背景壁纸个性化您的桌面。右键点击桌面并选择“更改桌面背景”以访问壁纸设置。Linux Mint 包含了各种风格的壁纸。浏览并选择一个您喜欢的。


    要使用自己的图片作为壁纸，点击壁纸设置中的加号图标并导航到您的图像文件。照片非常适合作为背景。系统可以拉伸、平铺、居中或缩放图像以适应屏幕。尝试这些选项，为您选择的图像找到最佳外观。


    幻灯片背景按设定的间隔循环多张图像。在壁纸设置中，选择多个图像并启用幻灯片模式。选择图像变化的频率，从每分钟一次到每天一次。这为您的桌面增加了多样性，无需手动更改。


    桌面特效控制动画和视觉增强。在“系统设置”的“特效”下访问这些设置。选项包括窗口动画、阴影效果和透明度。启用特效可以增强视觉精致感，但需要更多的图形处理。大多数现代电脑都能轻松处理这些特效。旧或性能较弱的系统可以禁用特效以提高性能。


    字体设置调整整个系统中文本的外观。在“系统设置”中，选择“字体”来修改文档、桌面元素、窗口标题和等宽字的默认字体。


    # 第 3 章：基本系统设置


    ## 访问系统设置


    系统设置是配置 Linux Mint 的控制中心。这个集中实用程序提供了所有系统选项的访问，从显示设置到用户账户。


    要打开“系统设置”，点击“菜单”并在右列中选择“系统设置”。或者，在菜单搜索字段中搜索“系统设置”。“系统设置”窗口显示了许多图标，每个图标代表一个类别。


    图标被组织为：外观、偏好、硬件和管理。这种组织有助于找到特定设置。外观设置控制主题、桌面背景和视觉效果。偏好调整语言和输入法等个人设置。硬件设置配置显示器、打印机和其他设备。管理设置处理高权限的系统级配置。


    点击任何图标都会打开该特定的设置模块。某些设置非常直观，选项很少，而另一些设置提供了广泛的配置可能性。花时间探索不同的设置，以了解可用选项。


    许多设置更改会立即生效，无需确认。您可以自由尝试，因为大多数更改都可以轻松撤销。某些系统级修改会提示输入密码，以确认您想要进行管理更改。


    “系统设置”顶部的搜索功能可以帮助在您不确定选项包含哪个类别时找到特定选项。输入与您想要配置的内容相关的关键词，匹配的设置将出现在结果中。


    ## 显示配置


    显示设置控制您在使用多个显示器时显示器的分辨率、方向、刷新率和排列。


    打开“系统设置”并点击“显示”。显示设置窗口显示您已连接的显示器或多个显示器的表示。如果使用单个显示器，则会出现一个显示器。多个显示器显示为独立的框，可以对其进行排列以匹配它们的物理位置。


    分辨率决定屏幕上显示多少像素。较高的分辨率显示更多内容，但会使单个元素变得更小。较低的分辨率显示的元素较大，但显示的内容较少。Linux Mint 通常根据您的显示器能力自动选择最佳分辨率。如果当前分辨率看起来不对，点击“分辨率”下拉菜单并选择不同的选项。可用分辨率取决于您的显示器和显卡。


    刷新率决定显示器每秒更新多少次。较高的刷新率产生更平滑的运动，在移动窗口或滚动时尤为明显。大多数显示器支持 60 Hz 刷新率，适用于常规使用。某些显示器提供更高的频率，如
    75 Hz、120 Hz 或 144 Hz，对游戏或视频编辑有益。选择您的显示器能够舒适支持的最高刷新率。

