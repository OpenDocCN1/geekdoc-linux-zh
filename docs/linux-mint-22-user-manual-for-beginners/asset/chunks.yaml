- fmt: '

    Orientation changes display rotation. The standard Landscape mode works for most
    situations. Rotate displays to Portrait mode if you have a monitor mounted vertically,
    which some users prefer for reading documents or writing code. Additional rotation
    options include inverted landscape and portrait orientations.


    When using multiple monitors, display settings allow arranging them to match their
    physical layout. Drag the monitor representations in the settings window to position
    them. Place them side by side if your monitors sit next to each other horizontally,
    or stack them if one sits above the other. Proper arrangement ensures the mouse
    cursor moves between screens naturally, exiting one screen''s edge and appearing
    on the adjacent screen.


    The primary display determines where the panel and desktop icons appear by default.
    When using multiple monitors, select which should be primary by clicking it and
    enabling "Primary Display." This monitor will show the panel, system tray, and
    other desktop elements.


    Display scaling adjusts interface element size without changing resolution. On
    high-resolution displays, standard size interface elements may appear too small.
    Scaling increases their size proportionally, improving readability and usability.
    This feature particularly benefits 4K monitors, where 200 percent scaling often
    provides optimal balance between screen space and readability.


    Night Light reduces blue light emission during evening hours, which may help reduce
    eye strain and improve sleep quality. Enable Night Light in display settings and
    configure when it activates. You can set specific on and off times or have it
    adjust automatically based on sunset and sunrise at your location.


    ### Sound Settings


    Sound settings control audio input and output devices, volume levels, and sound
    themes.


    Access sound settings through System Settings by clicking the Sound icon. The
    settings window contains several tabs for different audio aspects.


    The Output tab shows available audio output devices. Most computers have one or
    more output options, such as built-in speakers, headphone jacks, HDMI audio, or
    external USB audio devices. The current output device appears highlighted. To
    switch to a different device, select it from the list. Volume level for the selected
    device adjusts using the slider.


    Balance controls adjust the left-right audio balance. If audio seems louder in
    one ear or speaker, adjust the balance slider to center the sound. This setting
    applies only to stereo output devices.


    The Input tab manages microphones and other audio input devices. If your computer
    has a built-in microphone, it appears here. External microphones connected via
    USB or audio jack also show up in this list. Select the input device you want
    to use and adjust its volume using the slider. The input level meter displays
    current audio levels, helpful for confirming the microphone is working and adjusting
    sensitivity appropriately.


    Sound Effects settings control audio feedback for various system actions. Options
    include playing sounds when logging in, receiving notifications, adjusting volume,
    or encountering errors. You can enable or disable these sounds individually. The
    system includes several sound themes with different audio styles. Select one that
    suits your preference or disable sound effects entirely if you prefer silent operation.


    Applications tab shows volume controls for individual running applications. If
    multiple programs produce audio simultaneously, you can adjust each application''s
    volume independently without affecting overall system volume. This allows balancing
    audio levels when, for example, playing music while watching a video tutorial.


    Advanced settings provide access to detailed audio configuration. Most users never
    need to adjust these options, as Linux Mint configures audio correctly automatically.
    Advanced users can specify sample rates, buffer sizes, and other technical parameters
    if necessary for specific audio production needs.


    ### Network Connections


    Network settings manage wired and wireless internet connections, VPNs, and network
    preferences.


    Open System Settings and select Network to access connection settings. The Network
    window shows available connection types and configured connections.


    For wired connections, plugging an Ethernet cable automatically establishes a
    connection in most cases. The network icon in the system tray indicates connection
    status. If automatic configuration fails, you can manually configure wired settings
    by clicking the wired connection and selecting Settings. Most users can leave
    these on automatic configuration.


    Wireless connections require selecting your network and entering credentials.
    Click the network icon in the system tray to see available wireless networks.
    Networks appear in a list showing their names and signal strength. Secure networks
    display a lock icon.


    To connect to a wireless network, click its name in the list. If it''s secured,
    a dialog prompts for the password. Enter the network password exactly as configured
    on your router, paying attention to uppercase and lowercase letters. Enable "Connect
    automatically" if you want Linux Mint to join this network whenever it''s in range
    without prompting.


    After entering correct credentials, the system establishes the connection. The
    network icon changes to show signal strength, and you can begin using the internet.
    The password is saved securely, so future connections occur automatically without
    re-entering it.


    Hidden wireless networks don''t broadcast their name publicly. To connect to a
    hidden network, click the network icon and select "Connect to Hidden Network."
    Enter the network name and security details manually. This requires knowing the
    exact network name and password.


    VPN connections provide secure tunnels through public networks, useful when connecting
    through untrusted networks or accessing corporate resources. To configure a VPN,
    you need connection details from your VPN provider or network administrator. In
    Network settings, click the plus icon to add a new connection, select VPN, and
    choose the appropriate VPN type. Enter the server address, authentication credentials,
    and other details as provided by your VPN service.


    Network preferences allow configuring advanced options like proxy servers, connection
    priority, and MAC address settings. Most users never need to adjust these settings.
    If your network environment requires proxy configuration, your network administrator
    will provide necessary details.


    ### Bluetooth Setup


    Bluetooth settings manage wireless connections to headphones, speakers, keyboards,
    mice, and other Bluetooth devices.


    To access Bluetooth settings, open System Settings and click Bluetooth. If your
    computer has Bluetooth capability, the settings window shows a toggle to enable
    or disable Bluetooth. Enable it to begin connecting devices.


    Putting a device into pairing mode makes it discoverable. The process varies by
    device. Headphones often require holding a button until an LED flashes. Keyboards
    and mice typically have a pairing button on the bottom. Consult your device''s
    manual for specific pairing instructions.


    With Bluetooth enabled in Linux Mint and your device in pairing mode, the device
    should appear in the Bluetooth settings window. Click the device name and select
    Connect or Pair. Some devices require entering a PIN code displayed on screen.
    Type the code on the device (for keyboards) or confirm it matches (for other devices).


    After pairing completes, the device connects and becomes available for use. Bluetooth
    audio devices automatically become available as audio output options in sound
    settings. Input devices like keyboards and mice begin working immediately.

