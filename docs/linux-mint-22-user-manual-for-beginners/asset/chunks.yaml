  trans: '

    如果需要，可以同时存在多个面板。高级用户有时会为了特定目的创建额外的面板，例如在屏幕侧边创建一个包含经常使用的应用程序启动器的垂直面板。这种高级自定义是可选的，且对于大多数用户来说并不是必要的。


    面板自动隐藏功能可以让面板在不需要时消失，从而最大化屏幕空间。可以在面板设置中启用此功能。启用自动隐藏后，当窗口靠近面板时，面板会滑出屏幕。将鼠标移动到面板位置，它就会重新出现。此功能适用于偏于最大应用程序空间且不在意面板临时隐藏的用户。


    当许多应用程序同时运行时，面板会智能地管理窗口按钮。如果窗口按钮变得过于拥挤，面板会调整它们的大小或将同一应用程序的窗口分组。这确保了无论你运行多少程序，面板功能都能保持完整。


    ## 管理窗口和工作空间


    高效窗口管理通过保持工作区域整洁来提高效率。Linux Mint 提供许多工具来排列窗口并有效利用屏幕空间。


    每个窗口顶部都有一个包含窗口标题和控制按钮的标题栏。右侧的三个按钮执行基本功能。`X` 按钮关闭窗口，终止应用程序或关闭文档。最大化按钮将窗口扩展以填充整个屏幕，当您需要关注单个应用程序时非常有用。最大化后，此按钮将变为还原按钮，将窗口恢复到之前的尺寸。最小化按钮将窗口从视图中移除但不关闭它，将其隐藏在窗口列表中，直到你点击按钮将其还原。


    调整窗口大小允许你同时查看多个应用程序。将鼠标光标悬停在任何窗口边缘或角上，直到光标变为调整光标，然后点击并拖动以调整窗口大小。拖动边缘可以独立调整宽度或高度，而拖动角可以同时调整两个维度。


    窗口贴靠简化了并排排列多个窗口的操作。将窗口标题栏拖到屏幕的左边缘或右边缘。当鼠标到达边缘时，会出现一个轮廓显示窗口将贴靠的位置。释放鼠标按钮，窗口将调整大小以正好填充屏幕的一半。将另一个窗口拖到对边缘即可创建分屏布局。这在比较文档、写作时参考信息或处理多个相关文件时被证明特别有用。


    贴靠也适用于屏幕角以实现四分屏布局。将窗口拖到任何一个角并在轮廓出现时释放。窗口将调整大小以占据屏幕的分之一。四个窗口可以这样排列，每个占据显示器的四分之一。


    双击窗口标题栏可将其最大化。这提供了点击最大化按钮的快速替代方案。最大化后再次双击即可恢复之前的尺寸。


    右键点击窗口标题栏会显示更多选项。你可以从此菜单最大化、最小化或关闭窗口。如果你使用多个工作空间，会显示将窗口移动到不同工作空间的选项。“始终置顶”选项让该窗口保持在其他窗口之上，对于你无论哪个应用程序获得焦点都希望可见的参考信息非常有用。


    工作空间提供了虚拟桌面，用于组织不同的任务或项目上下文。将工作空间想象成可以即时切换的多个桌面。你可能将电子邮件和通信应用程序放在一个工作空间，将网络浏览器放在另一个，将办公应用程序放在第三个工作空间。这种组织减少了桌面的杂乱，并帮助你专注于当前任务。


    面板上的工作空间切换器小组件将可用工作空间显示为小矩形。点击某个工作空间即可切换到它。当前工作空间上的窗口出现在切换器中，帮助你识别哪个工作空间包含特定的应用程序。


    在工作空间之间移动窗口非常简单。右键点击窗口标题栏，选择“移动到其他工作空间”，并选择目标工作空间。或者，你可以将窗口面板按钮拖到工作空间切换器中的另一个工作空间。


    快捷键提供了最快的工作空间导航。`Ctrl+Alt+右箭头` 切换到右侧的工作空间，而 `Ctrl+Alt+左箭头` 移动到上一个工作空间。如果你配置了网格工作空间布局，`Ctrl+Alt+向上`和`向下`箭头可以进行垂直导航。这些快捷键很快就会变得自然，允许任务上下文流畅移动。


    工作空间的数量可以在系统设置中配置。导航到系统设置，选择“工作空间”，并调整水平和垂直工作空间的数量。大多数用户发现二到四个工作空间足够了，但如果你的工作流需要，也可以配置更多。


    应用程序之间的窗口切换使用 `Alt+Tab` 快捷键。按住 `Alt` 并按 `Tab` 循环切换打开的窗口。会出现一个切换器显示所有窗口的缩略图和标题。按住
    `Alt` 的同时继续按 `Tab` 在列表中移动。当所需的窗口被高亮时释放 `Alt` 切换到它。`Alt+Shift+Tab` 以反序循环。


    窗口切换器还可以按工作空间过滤。默认情况下，`Alt+Tab` 显示所有工作空间的所有窗口。在系统设置的“窗口”下，你可以配置为仅显示当前工作空间上的窗口，当你在多个工作空间打开了许多应用程序时，这有助于切换。


    ## 桌面图标和快捷方式


    桌面图标提供了快速访问经常使用的文件、文件夹和应用程序。虽然某些用户偏于没有图标的整洁桌面，但另一些人认为它们对于重要项目很方便。


    要在桌面上放置应用程序快捷方式，打开菜单并找到所需的应用程序。右键点击该应用程序并选择“添加到桌面”。你的桌面上将出现一个图标。双击此图标即可启动应用程序。


    文件和文件夹快捷方式的工作原理类似。打开文件管理器并导航到你想要放在桌面上的项目。右键点击它并选择“创建软链接”。将创建一个带有箭头指示的链接文件，显示它是一个快捷方式。将此链接拖到桌面。原始文件保留在原有位置，而桌面链接提供了快速访问。


    可以直接在桌面上创建新文件夹。右键点击桌面的空白区域并选择“新建文件夹”。会出现一个文件夹，提示你对其命名。这些文件夹的功能与系统任何地方的文件夹完全相同。


    桌面图标可以自动排列或手动排列。右键点击桌面，你将在“排列桌面图标”下找到选项。自动排列按名称、大小或类型以网格模式对图标进行排序。手动排列允许你从任何喜好的位置放置图标。拖动图标即可在桌面上自由移动。


    图标大小通过桌面设置进行调整。右键点击桌面，选择“自定义”，并导航到“桌面”部分。通过滑块控制图标大小。较大的图标更容易查看和点击，但占用更多的桌面空间。较小的图标允许桌面上显示更多项目，同时保持易于访问。


    某些用户完全禁用桌面图标以获得极简外观。在桌面设置中，你可以禁用“显示桌面图标”。这将创建一个只有背景图像可见的整洁工作区域。应用程序和文件可以通过文件管理器和菜单访问。


    ## 系统托盘


    系统托盘占据面板的右侧，显示状态指示器和后台应用程序。这些小图标提供了信息和快速访问设置的通道。


    '
- fmt: 'The network indicator shows your connection status. A wired connection displays
    as a plug icon, while wireless connections show signal strength bars. Clicking
    this icon reveals available networks and connection options. You can connect to
    different wireless networks, view connection details, or access full network settings
    from this menu.


    The volume control icon displays current audio levels. Click it to reveal a volume
    slider for quick adjustments. The slider controls master volume affecting all
    audio output. Right-clicking the volume icon provides access to sound settings
    for more detailed audio configuration.


    The battery indicator appears on laptops, showing remaining charge. The icon changes
    based on charge level and whether the power adapter is connected. Clicking it
    displays more detailed battery information and provides access to power settings.


    Additional applications may place icons in the system tray. Messaging applications
    often show notifications here. Cloud storage services indicate sync status. Music
    players provide playback controls. Each icon typically responds to clicks with
    a menu of relevant options.


    The system tray automatically manages icon overflow. If too many icons appear
    to fit comfortably, the system tray consolidates them. A small arrow icon reveals
    hidden tray icons when clicked. This prevents the tray from consuming excessive
    panel space.


    # Customizing Your Desktop Appearance


    Linux Mint offers extensive appearance customization, allowing you to create a
    desktop that matches your preferences and workflow.


    Themes control the overall appearance of windows, menus, and interface elements.
    Access themes through System Settings in the Themes section. Linux Mint includes
    several pre-installed themes. Light themes use bright backgrounds, while dark
    themes employ darker color schemes that many users find easier on the eyes during
    extended use.


    To change your theme, open System Settings and click Themes. You''ll see categories
    for Desktop theme, Window borders, Icons, and Mouse cursor. Each category can
    be customized independently, though many users select matching themes for visual
    consistency.


    Desktop themes affect window title bars, menus, buttons, and other interface elements.
    Click through available options to preview how they look. Changes apply immediately,
    allowing you to evaluate different themes easily.


    Icon themes change the appearance of icons throughout the system. Different icon
    sets offer varying styles from minimalist to detailed, flat to three-dimensional.
    Select an icon theme that appeals to you and matches your overall aesthetic preferences.


    Window borders determine how window frames and title bars appear. Options range
    from minimal borders that maximize screen space to more decorative designs. Select
    a border style that provides the functionality you need while complementing your
    chosen theme.


    Background wallpaper personalizes your desktop. Right-click the desktop and select
    "Change Desktop Background" to access wallpaper settings. Linux Mint includes
    numerous wallpapers in various styles. Browse through them and select one you
    like.


    To use your own images as wallpaper, click the plus icon in the wallpaper settings
    and navigate to your image file. Photos work well as backgrounds. The system can
    stretch, tile, center, or scale images to fit your screen. Experiment with these
    options to find the best appearance for your chosen image.


    Slideshow backgrounds rotate through multiple images at set intervals. In wallpaper
    settings, select multiple images and enable slideshow mode. Choose how frequently
    images change, from every minute to once per day. This adds variety to your desktop
    without requiring manual changes.


    Desktop effects control animations and visual enhancements. Access these settings
    in System Settings under Effects. Options include window animations, shadow effects,
    and transparency. Enabling effects enhances visual polish but requires slightly
    more graphics processing. Most modern computers handle these effects easily. Older
    or less powerful systems can disable effects to improve performance.


    Font settings adjust text appearance throughout the system. In System Settings,
    select Fonts to modify default fonts for documents, desktop elements, window titles,
    and fixed-width.


    # Chapter 3: Essential System Settings


    ## Accessing System Settings


    System Settings serves as the control center for configuring Linux Mint. This
    centralized utility provides access to all system options, from display settings
    to user accounts.


    To open System Settings, click the Menu and select System Settings from the right
    column. Alternatively, search for System Settings in the Menu search field. The
    System Settings window displays numerous icons, each representing a category.


    Icons are organized into groups: Appearance, Preferences, Hardware, and Administration.
    This organization helps locate specific settings. Appearance settings control
    themes, desktop backgrounds, and visual. Preferences adjust personal settings
    like language and input methods. Hardware settings configure displays, printers,
    and other devices. Administration settings manage system-level configurations
    requiring elevated permissions.


    Clicking any icon opens that particular settings module. Some settings are straightforward
    with few options, while others present extensive configuration possibilities.
    Take time to explore different settings to understand available options.


    Many settings changes apply immediately without requiring confirmation. You can
    experiment freely, as most changes are easily reversed. Some system-level modifications
    prompt for your password, confirming you want to make administrative changes.


    The search function at the top of System Settings helps locate specific options
    when you''re unsure which category contains them. Type keywords related to what
    you want to configure, and matching settings appear in the results.


    ## Display Configuration


    Display settings control your monitor''s resolution, orientation, refresh rate,
    and arrangement when using multiple monitors.


    Open System Settings and click Display. The display settings window shows a representation
    of your connected monitor or monitors. If using a single monitor, one display
    appears. Multiple monitors show as separate boxes that can be arranged to match
    their physical positions.


    Resolution determines how many pixels display on your screen. Higher resolutions
    show more content but make individual elements smaller. Lower resolutions display
    larger elements but show less content. Linux Mint usually selects the optimal
    resolution automatically based on your monitor''s capabilities. If the current
    resolution seems incorrect, click the Resolution dropdown and select a different
    option. Available resolutions depend on your monitor and graphics card.


    Refresh rate determines how many times per second the display updates. Higher
    refresh rates produce smoother motion, particularly noticeable when moving windows
    or scrolling. Most monitors support 60 Hz refresh rate, which works well for general
    use. Some monitors offer higher rates like 75 Hz, 120 Hz, or 144 Hz, beneficial
    for gaming or video editing. Select the highest refresh rate your monitor supports
    comfortably.

