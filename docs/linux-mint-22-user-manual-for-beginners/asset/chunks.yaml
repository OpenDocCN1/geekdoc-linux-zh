    书签可以保存您经常访问的网站链接。要书签页面，请点击地址栏右侧的星形图标。弹出的对话框允许为书签命名并选择保存位置。书签可以组织在文件夹中以便更好地管理。可以通过书签菜单或点击工具栏上的书签图标访问书签。


    多标签页允许您同时查看多个网站，而无需打开多个窗口。点击现有标签页旁加号图标或按下 `Ctrl+T` 可打开新标签页。点击标签或使用 `Ctrl+Tab`
    在标签页之间切换。点击每个标签上的 `X` 或按下 `Ctrl+W` 关闭标签页。


    浏览器历史记录了您访问过的网站。可以通过历史记录菜单或按下 `Ctrl+H` 访问。历史记录允许您返回之前访问过的站点，而无需记住具体地址。如果您想出于隐私删除浏览记录，可以通过设置清除历史记录。


    Firefox 包含了保护您在线活动的隐私功能。隐私浏览模式不会保存历史记录、Cookie 或临时文件。从文件菜单或按下 `Ctrl+Shift+P` 打开隐私窗口。在访问敏感信息或使用共享计算机时，请使用隐私浏览。


    增强型跟踪保护可以阻止许多跨网站跟踪您活动的广告跟踪器和脚本。这提高了隐私性，并通常会加快页面加载。通过点击地址栏中的盾牌图标访问这些设置。


    扩展程序为 Firefox 增加了功能。点击菜单按钮（三条横线）并选择“扩展程序和主题”来浏览可用扩展程序。热门选项包括密码管理器、广告拦截器和生产力工具。请谨慎安装扩展程序，仅选择来自信任开发者的，因为扩展程序对您的浏览活动具有很大的访问权限。


    设置可以自定义 Firefox 的行为。可以通过偏好下的菜单访问设置。设置控制主页、默认搜索引擎、隐私选项、下载位置以及许多其他偏好。探索这些设置以根据您的喜配置
    Firefox。


    ## 电子邮件设置与管理


    电子邮件仍然是核心通信工具。Linux Mint 包含了功能全电子邮件客户端 Thunderbird，尽管您也可以通过浏览器访问电子邮件。


    从网络分类下的菜单启动 Thunderbird。首次运行时，设置向导将引导您添加电子邮件帐户。输入您的姓名、电子邮件地址和密码。Thunderbird 会尝试对
    Gmail、Outlook 和 Yahoo 等常用电子邮件提供商进行自动配置。


    如果自动配置成功，Thunderbird 将使用正确的服务器设置配置您的账户。点击继续完成设置。您的电子邮件将下载并显示在主窗口中。


    如果自动配置失败，则需要手动设置。您需要电子邮件提供商的服务器信息：入站服务器地址（`IMAP` 或 `POP3`）、出站服务器（`SMTP`）、端口号和连接安全设置。电子邮件提供商通常会在其帮助部分记录这些设置。


    `IMAP` 和 `POP3` 是接收电子邮件的不同协议。`IMAP` 在设备间同步电子邮件，将消息留在服务器上。多个设备可以访问相同的电子邮件，并且在一个设备上进行的更改会反映在其他设备上。`POP3`
    将电子邮件下载到您的计算机并通常从服务器上删除。`POP3` 适用于单设备用户，而 `IMAP` 更适合从多个位置访问电子邮件。


    帐户设置后，Thunderbird 显示您的文件夹结构。收箱接收新消息。已件箱存储您发送的邮件副本。草稿保存您已开始但尚未发送的消息。垃圾箱包含已删除的电子邮件。您可以创建自定义文件夹来组织消息。


    要撰写新消息，请点击写信按钮。将出一个出一个窗口，包含收件人、主题和消息正文的字段。在 `To` 字段中输入收件人的电子邮件地址。多个收件人可以用逗号分隔。`Cc`
    字段将副本发送给额外的收件人，所有人可见。`Bcc`（密抄）发送副本而不向他人透露收件人地址。


    在大型文本区域中编写您的消息。工具栏提供了格式选项，包括字体选择、大小、颜色、粗体、斜体和下划线。您还可以创建项目列表并调整文本对齐。


    要附加文件，点击添加按钮并导航到您想要发送的文件。文件将附加到消息中。请注意文件大小，某些电子邮件提供商限制附件大小为 25MB 或更小。对于较大的文件，请考虑使用云存储并共享链接。


    点击发送传输消息。它将移动到已发送文件夹并递交给收件人。递送时间不等，但通常是实时的或在几分钟内完成。


    ## 即时消息应用程序


    实时文本通信通过即时消息进行。Linux Mint 上有多个应用程序提供此功能。


    Pidgin 是一款多功能的即时消息客户端，支持包括 Google Talk、XMPP 和 IRC 在内的多种协议。通过软件管理器搜索“Pidgin”来安装它。安装后，从网络分类启动它。


    首次运行时，Pidgin 会要求您添加帐户。点击“添加”开始。从下拉列表中选择您的聊天协议。输入您的帐户凭据。不同的协议需要不同的信息，但通常您需要用户名和密码。输入信息后，点击“添加”。


    Pidgin 的主窗口显示您的好友友列表（联系人）。当联系人在线时，他们会出现在列表中。双击联系人打开对话窗口。在下方的字段中输入消息并按回车发送。对话显示在上方区域，并带有时间戳。


    Telegram Desktop 提供了对 Telegram 消息服务的访问。通过软件管理器安装它。安装后，启动 Telegram Desktop 并使用手机号码登录。Telegram
    将通过短信发送验证码。输入代码以访问您的帐户。


    Telegram 界面左侧显示您的对话列表，右侧显示活动会话。点击任何对话以查看消息。在底部的字段中输入新消息并按回车发送。Telegram 支持照片共享、语音消息、文件传输和群聊。


    Signal 是一款注重隐私的聊天应用，支持桌面版。通过软件管理器安装 Signal Desktop。通过扫描应用程序中显示的 QR 码将其与您的手机关联。这将同步手机和电脑之间的对话。


    Discord 服务于游戏和社区通信。通过软件管理器安装 Discord。安装后，使用您的帐户凭据登录。Discord 在左侧显示服务器，中间左侧显示所选服务器内的频道，主区域显示对话内容。


    ## 视频会议工具


    视频通话已成为远程工作以及与远方亲友保持联系至关重要。


    Zoom 广泛用于专业视频会议。访问 `zoom.us` 并下载 Linux 客户端。下载后，使用软件安装工具打开文件并安装。启动 Zoom 并登录或作为访客加入会议。


    要加入会议，点击加入并输入主机提供的会议 ID。如果会议需要密码，系统将提示您输入。加入后，您的摄像头和麦克风应会自动激活，尽管您可以使用窗口底部的按钮进行控制。


    在会议期间，控制功能允许您静音/取消麦克风、启动/停止视频、共享屏幕、打开聊天和查看参与者。屏幕共享功能让其他人看到您的桌面，这对于演示或协作非常有用。

    '
- fmt: '

    Skype provides video calling and instant messaging. Install it through the Software
    Manager by searching for "Skype." After installation, launch it and sign in with
    your Microsoft account. Your contacts appear in the left panel.


    To start a video call, select a contact and click the video call button. The contact
    receives a notification and can accept the call. During calls, controls similar
    to Zoom allow managing audio, video, and screen sharing.


    Google Meet works entirely in web browsers, requiring no installation. Visit `meet.google.com`
    in Firefox. Sign in with your Google account if necessary. You can start a new
    meeting or join an existing one using a meeting code or link.


    Browser-based tools like Google Meet and Zoom''s web interface offer convenience
    without installing additional software. However, dedicated applications sometimes
    provide better performance and more features.


    ## Social Media Applications


    While most social media platforms are accessed through web browsers, some dedicated
    applications exist for Linux.


    Twitter can be used through web browsers or third-party applications like `Corebird`.
    The web interface at `twitter.com` provides full functionality including reading
    tweets, posting, direct messaging, and managing your profile.


    Facebook similarly works well through browsers at `facebook.com`. The web interface
    provides complete access to all Facebook features. Browser-based access means
    you always have the latest features without updating applications.


    LinkedIn, Instagram, and other social platforms are primarily accessed through
    web browsers on desktop systems. Their websites offer full functionality optimized
    for desktop viewing.


    ## Download Management


    Firefox includes a built-in download manager that handles most downloading needs.
    When you click links to download files, Firefox displays a download progress indicator.
    Access all downloads through the downloads button (arrow icon) in the toolbar.


    Downloaded files save to your `Downloads` folder by default. You can change this
    location in Firefox settings under `General`, then `Files and Applications`. Some
    users prefer downloading to the `Desktop` for easy access, while others organize
    downloads into specific project folders.


    For more advanced download management, applications like `uGet` provide additional
    features. `uGet` handles multiple simultaneous downloads, resume capability for
    interrupted downloads, download scheduling, and download queues. Install `uGet`
    through the Software Manager if you frequently download large files or need these
    advanced features.


    # Chapter 7: Office Productivity


    ### LibreOffice Suite Overview


    LibreOffice is a comprehensive office suite providing applications for word processing,
    spreadsheets, presentations, and more. It comes pre-installed with Linux Mint
    and offers compatibility with Microsoft Office formats.


    The suite includes several applications: `Writer` for word processing, `Calc`
    for spreadsheets, `Impress` for presentations, `Draw` for diagrams and drawings,
    `Math` for mathematical formulas, and `Base` for database management. Most users
    primarily use `Writer`, `Calc`, and `Impress`.


    LibreOffice uses the Open Document Format (`ODF`) as its native file format. These
    formats (`.odt` for documents, `.ods` for spreadsheets, `.odp` for presentations)
    are international standards. LibreOffice also opens and saves Microsoft Office
    formats (`.docx`, `.xlsx`, `.pptx`) with high compatibility, though complex formatting
    may occasionally differ.


    The interface resembles traditional office applications with menus, toolbars and
    formatting options. Users familiar with older Microsoft Office versions will find
    LibreOffice immediately recognizable. The layout prioritizes functionality over
    aesthetics, providing quick access to commonly used features.


    ### Creating Documents with Writer


    LibreOffice `Writer` handles all word processing needs from simple letters to
    complex documents with tables, images, and formatting.


    Launch `Writer` from the `Menu` in the `Office` category or by opening the LibreOffice
    suite and selecting `Writer Document`. A blank document appears, ready for typing.


    The interface includes a menu bar at the top with `File`, `Edit`, `View`, `Insert`,
    `Format`, `Styles`, `Table`, `Form`, `Tools`, `Window`, and `Help` menus. Below
    the menu sits a toolbar with common formatting options like font selection, size,
    bold, italic, underline, and text alignment.


    Begin typing anywhere in the document. Text flows automatically, wrapping to new
    lines as you reach the right margin. Press `Enter` to start new paragraphs. The
    default formatting uses `Liberation Serif` font at 12-point size with left alignment.


    To change text formatting, select the text first by clicking and dragging across
    it. With text selected, use toolbar buttons to apply formatting. The font dropdown
    changes typeface, the size dropdown adjusts point size, and buttons apply bold,
    italic, and underline styles.


    Text alignment controls how lines position within the page margins. Left alignment
    (default) creates a straight left edge with a ragged right edge, suitable for
    most documents. Center alignment places text in the middle, used for titles. Right
    alignment creates a straight right edge, occasionally used for dates or addresses.
    Justify alignment makes both edges straight by adjusting spacing between words,
    creating a formal appearance used in books and professional documents.


    Lists organize information clearly. Bulleted lists use symbols to mark items,
    while numbered lists use sequential numbers. To create a list, click the bullet
    or numbering button in the toolbar, then type list items, pressing `Enter` after
    each one. The next line automatically continues the list format. Press `Enter`
    twice to end the list and return to normal paragraphs.


    Images enhance documents visually. To insert images, place the cursor where you
    want the image, then click `Insert` menu and select `Image`. Navigate to the image
    file and click `Open`. The image appears in your document. Click the image to
    select it, then drag corner handles to resize proportionally. Right-click the
    image and select `Properties` to access advanced options like text wrapping, which
    controls how text flows around the image.


    Tables organize information in rows and columns. To insert a table, click the
    `Table` menu and select `Insert Table`. Specify the number of rows and columns
    you need. The table appears in your document with cells ready for content. Click
    in any cell to type, then press `Tab` to move to the next cell. The `Table` menu
    provides options to add or delete rows and columns, merge cells, adjust borders,
    and apply shading.


    Page formatting controls margins, orientation, and size. Access these settings
    through the `Format` menu under `Page`. Standard documents use portrait orientation
    (tall), while landscape (wide) suits tables or charts that extend horizontally.
    Margins define the blank space around page edges. Default margins work for most
    documents, but you can adjust them for specific requirements.


    Headers and footers place content that repeats on every page, such as document
    titles, page numbers, or dates. Insert them through the `Insert` menu. Headers
    appear at the top of pages, footers at the bottom. Common uses include placing
    your name and document title in the header, with page numbers in the footer.


    Styles maintain consistent formatting throughout documents. Rather than manually
    formatting each heading or paragraph, apply pre-defined styles. The `Styles` panel
    on the left shows available styles. Click a style to apply it to selected text.
    This ensures all headings look identical and allows changing the entire document''s
    appearance by modifying style definitions.

    '
