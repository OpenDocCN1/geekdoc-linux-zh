  trans: '


    软件管理器（Software Manager）提供了一个用于浏览和安装软件的图形化界面。它展示了可用应用程序的描述、截图和用户评论。


    通过点击菜单中的图标或或搜索“软件管理器”来启动软件管理器。主窗口显示推荐应用程序和类别。推荐应用程序突出了热门或最近添加的软件。类别按用途组织应用程序：互联网、办公、图形、音频与视频、开发等。


    点击任何类别均可浏览该类别下的应用程序。每个应用程序都会显示其图标、名称和简短描述。界面会显示哪些应用程序已安装，通过复选标记或“移除”按钮而不是“安装”来指示。


    要查看应用程序的详情，请点击它。详情页显示完整描述、演示界面的截图、用户评论和评分、文件大小以及版本信息。其他 Linux Mint 用户的评论可以让你对真实性能和易用性有所了解。


    用户评分以星级形式显示，五星为最高评分。阅读评论可以理解用户给出特定评分的原因。某些应用程序获得了极评价，而另一些则被用户报告过。在相似应用程序之间进行选择时，请考虑这些评分。


    安装应用程序只需点击 `Install` 按钮。系统会要求密码以确认你想要安装软件。输入密码后，软件管理器将下载应用程序及其任何依赖项，然后自动安装所有内容。安装完成后会弹出通知。


    已安装的应用程序将出现在你的菜单中，并按相应的类别组织。你可以从那里启动它，或通过名称搜索它。最近安装的应用程序通常出现在菜单的“最近”部分，以便方便访问。


    ### 从软件管理器安装应用程序


    让我们通过安装几个实用的应用程序来演示这一过程，并介绍一些你可能可能需要的软件。


    GIMP（GNU 图像处理程序）提供了与商业替代品可比拟的强大图像编辑功能。打开软件管理器并搜索“GIMP”。点击 GIMP 结果并查看信息。点击 `Install`
    并在提示时输入密码。安装完成后，在菜单的“图形”类别中找到 GIMP。


    VLC 媒体播放器可以处理几乎任何视频或音频格式。在软件管理器中搜索“VLC”。列表显示它是一个多功能媒体播放器。使用与 GIMP 相同的流程安装它。安装后，VLC
    将出现在“音频与视频”类别中。


    LibreOffice 预装在 Linux Mint 中，但你可能需要额外的办公应用程序。WPS Office 提供了一个具有类似 Microsoft Office
    界面的替代方案。在软件管理器中搜索它，查看详情，并在需要时安装。请注意，某些替代方案可能不在默认仓库中，可能需要添加额外的软件源。


    对于通信，有多个即时消息客户端可用。Pidgin 同时支持多个聊天协议。如果你使用即时消息服务，请搜索“Pidgin”并安装它。安装后，使用你服务的账户详情对其进行配置。


    程序员可以使用开发工具。Visual Studio Code 是一款流行的代码编辑器，可以通过软件管理器安装。搜索“Code”并从结果中选择 Visual
    Studio Code。这将安装微软的全功能代码编辑器，适用于多种编程语言。


    生产力工具（如笔记应用）可以增强效率。Simplenote 提供了带云同步的基本笔记功能。Joplin 提供了更高级的功能，包括对 markdown 的支持。搜索笔记应用程序并安装一个符合你需求的。


    每个安装的应用程序都会向你的菜单添加条目、启动程序的快捷方式，并与你的系统集成。应用程序通过与操作系统更新相同的系统进行更新，确保你始终拥有带有安全补丁和新功能的最新版本。


    ### 更新你的系统


    定期的更新可以保持你的系统安全、稳定并配备最新功能。Linux Mint 通过更新管理器（Update Manager）让更新变得简单。


    更新管理器图标出现在你的系统托盘中，当可用更新时，它的外观会有所不同。当有更新待安装时，通知也会提醒你。点击更新管理器图标启动该程序。


    更新管理器按类型和重要性显示可用的更新。安全更新解决漏洞，应及时安装。内核更新影响核心系统，可能会提供更好的硬件支持或性能改进。应用程序更新为已安装的程序带来新功能和错误修复。


    每个更新都显示在列表中，显示包名、当前版本、可用版本以及更改的简短描述。某些更新列出了许多单独的包，因为它们影响了多个系统组件。


    更新级别表示每项更新的测试程度和稳定性。级别 1 和 2 的更新经过了广泛测试，被认为是安全的。级别 3 的更新经过中度测试。级别 4 和 5 的更新测试较少且存在潜在风险，尽管问题很少见。默认情况下，Linux
    Mint 显示级别 3 及以下的更新，以平衡稳定性和新颖性。


    要安装更新，请点击更新管理器窗口顶部的 `Install Updates`。系统会提示输入密码以授权系统更改。更新管理器随后下载并安装所有选定的更新。此过程所需的时间取决于更新的大小和你的网络速度。


    在更新期间，你可以继续使用计算机。大多数更新不需要中断你的工作。然而，某些更新可能会要求重启应用程序以使用新版本。内核更新需要完全重启系统才能生效，尽管可以将重启推迟到方便的时候。


    在重大更新（特别是内核更新）之后，请重启计算机以确保所有更改正确生效。更新管理器会指示何时建议重启。你不需要立即重启，但在下一次关机之前重启，以确保你的系统运行更新后的内核。


    ### 使用更新管理器


    更新管理器提供了控制更新行为和可见性的配置选项。


    通过点击 `Edit` 菜单并选择 `Preferences` 访问更新管理器偏好。几项设置可以自定义更新体验。


    自动刷新决定了更新管理器检查新更新的频率。选项从每小时到每周不等。每日检查提供了良好的平衡，确保你获知重要更新而无需频繁检查。


    更新频率不影响安全更新，安全更新至关重要。系统可以配置为自动应用安全更新而不提示。如果你希望以最少的人工干预获得最大的安全性，请在偏好中启用此项。自动安全更新会在后台静默安装，保护你的系统而无需关注。


    更新级别决定更新管理器显示哪些更新。默认情况下，显示级别 1 到 3。你可以调整此以显示更多或更少的更新。大多数用户应该坚持默认设置，这些设置提供了经过良好的更新，同时避免了可能有问题更新。


    当可用更新时，更新管理器可以显示桌面通知。通知设置控制是否提醒你以及显示的显著程度。某些用户倾向于显眼的通知，以确保不会错过重要更新。另一些用户则喜欢微妙的指示，可以在他们方便时查看。

    '
- fmt: '

    Kernel updates receive special treatment because they''re fundamental to system
    operation. You can configure whether to receive kernel update notifications and
    whether to select kernels manually or accept recommendations automatically. Unless
    you have specific technical requirements, accepting recommended kernel updates
    works well.


    ## Installing Software from Terminal


    The terminal provides an alternative method for installing software, useful for
    following online instructions or when GUI tools aren''t accessible. The `apt`
    package manager handles software installation through command-line interface.


    Open a terminal by searching for "Terminal" in the Menu or pressing `Ctrl+Alt+T`.
    The terminal displays a command prompt where you type commands.


    To install a package, use the `sudo apt install` command followed by the package
    name. For example, to install the `htop` system monitor, type:

    ```

    sudo apt install htop

    ```


    Press Enter after typing the command. You''ll be prompted for your password since
    installing software requires administrative privileges. Type your password (it
    won''t be visible as you type for security) and press Enter.


    The `apt` system calculates dependencies, determining what additional packages
    are needed. It displays what will be installed and how much disk space the installation
    requires. A prompt asks for confirmation. Type `y` and press Enter to proceed.


    The terminal shows download progress and installation status. When complete, the
    prompt returns, indicating the installation finished successfully. The newly installed
    application is available in your Menu or can be run from the terminal by typing
    its name.


    To remove software through terminal, use `sudo apt remove` followed by the package
    name. For example:

    ```

    sudo apt remove htop

    ```


    To update all packages through terminal, first update the package list with:

    ```

    sudo apt update

    ```


    Then upgrade all packages with:

    ```

    sudo apt upgrade

    ```


    These commands are equivalent to using the Software Manager and Update Manager
    graphically. Use whichever method you prefer. The terminal approach is faster
    for experienced users and necessary when following technical documentation.


    ## Removing Unwanted Applications


    Over time, you may install applications you no longer use. Removing them frees
    disk space and declutters your Menu.


    The Software Manager handles uninstallation as easily as installation. Search
    for the application you want to remove. If it''s installed, the detail page shows
    a "Remove" button instead of "Install." Click Remove and confirm when prompted.
    The application is uninstalled, and its Menu entry disappears.


    Some applications install additional data or configuration files that remain after
    uninstallation. These files typically occupy minimal space and are retained in
    case you reinstall the application later. If you want to remove these files as
    well, use the terminal command:

    ```

    sudo apt purge package-name

    ```


    This completely removes the application and its configuration files.


    Pre-installed applications that came with Linux Mint can also be removed if you
    don''t use them. However, be cautious about removing system components. Stick
    to removing applications you recognize and know you don''t need. The Software
    Manager generally prevents removal of essential system components.


    ## Managing Installed Software


    The Software Manager provides a view of all installed software, useful for reviewing
    what''s on your system.


    In the Software Manager, click the "Installed" section to view all installed applications.
    This list includes everything installed on your system, both through the Software
    Manager and other methods.


    The list shows each application''s name, version number, installation size, and
    brief description. You can sort by name, size, or installation date. Sorting by
    size helps identify large applications consuming significant disk space.


    Each application entry includes an indicator showing the installation source.
    Applications from official repositories show as trusted. Applications from PPAs
    or other sources show different indicators. This helps you track where software
    came from, useful for troubleshooting or assessing security.


    Some applications receive updates more frequently than others. The Installed view
    shows when each application was last updated, helping you identify software that
    might not be actively maintained. Very outdated software may have security vulnerabilities,
    so consider removing unused applications that no longer receive updates.


    # Chapter 6: Internet and Communication


    ## Setting Up Internet Connections


    Reliable internet connectivity is essential for most computing tasks. Linux Mint
    makes network configuration straightforward for both wired and wireless connections.


    Wired Ethernet connections typically work automatically. Plug an Ethernet cable
    from your router or modem into your computer''s network port. Within seconds,
    the network icon in the system tray indicates an established connection. No configuration
    is necessary in most home and office networks using `DHCP` (Dynamic Host Configuration
    Protocol) for automatic network settings.


    If automatic configuration doesn''t work, manual network setup may be necessary.
    Right-click the network icon and select "Network Settings." Click your wired connection
    and select the Settings icon. By default, `IPv4` is set to Automatic (`DHCP`).
    If your network requires manual configuration, change this to Manual and enter
    IP address, subnet mask, gateway, and DNS servers as provided by your network
    administrator.


    Wireless connections require selecting your network and entering the password.
    Click the network icon in the system tray to display available wireless networks.
    Networks appear in a list with names (`SSIDs`) and signal strength indicators.
    Stronger signals appear with more bars filled.


    Click your network name in the list. A dialog prompts for the network password
    if the network is secured (most are). Type the password exactly as configured
    on your wireless router, paying attention to capital letters, numbers, and special
    characters. Passwords are case-sensitive, so `"Password123"` differs from `"password123."`.


    Enable "Connect automatically" if you want Linux Mint to join this network whenever
    it''s in range. This convenience feature works well for home and office networks
    but should be used cautiously with public networks.


    After entering correct credentials, click Connect. The system establishes the
    connection within a few seconds. The network icon updates to show signal strength.
    A notification confirms successful connection.


    If connection fails despite correct credentials, several issues might be responsible.
    The router might be too far away, resulting in weak signal. Physical obstacles
    like walls interfere with wireless signals. Try moving closer to the router. The
    wireless channel might be congested if many nearby networks use the same channel.
    Access your router''s administration interface to select a different channel.


    Some networks use MAC address filtering, requiring the network administrator to
    authorize your computer''s specific hardware address before allowing connections.
    If you can see the network but can''t connect even with correct credentials, MAC
    filtering might be active. Provide your MAC address (viewable in Network Settings)
    to the administrator for authorization.


    ### Using Firefox Web Browser


    Firefox comes pre-installed as Linux Mint''s default web browser. It provides
    fast, secure web browsing with extensive customization options.


    Launch Firefox from the Menu in the Internet category or by clicking its icon
    on the panel if you''ve added it there. The browser opens to its default start
    page showing frequently visited sites and shortcuts.


    The address bar at the top serves dual purposes. Type web addresses (`URLs`) directly
    into it to navigate to specific websites. Type search terms to perform web searches
    using your default search engine. Firefox intelligently distinguishes between
    addresses and searches.

