    YouTube 在 Firefox 中运行非常流畅。该浏览器支持现代视频解码器，提供高质量的播放体验。对于在 YouTube 上花费大量时间的用户，浏览器扩展可以通过阻止广告或添加功能来增强体验。


    # 第 9 章：系统维护与优化


    ### 保持系统更新


    定期更新可以维护系统的安全性和稳定性。`Update Manager` 使这一过程变得简单。


    在 `Update Manager` 偏好中启用自动检查更新。这可以确保你及时收到重要更新通知。应该尽快安装安全更新，因为它们可以防止已知漏洞攻击。


    内核更新改进了硬件支持并修复了漏洞。Linux Mint 的内核更新方法平衡了稳定性与新性。`Update Manager` 会推荐合适的内核版本。除非你有特定的技术需求，否则请接受推荐的内核。


    安装更新后，如果提示，请重启电脑。内核更新特别需要重启才能生效。应用程序更新通常会立即生效，无需重启。


    ### 磁盘清理与管理


    随着时间的推移，系统会积累不必要的文件。定期清理可以释放空间并提高性能。


    `Disk Usage Analyzer` 将存储消耗情况可视化。你可以从 `Menu` 中的 `System Tools` 启动它。它会扫描你的文件系统并以饼图或树图的形式显示结果。大文件夹一目可见，有助于识别哪些占用了空间。


    常见的空间占用者包括 `Downloads` 文件夹、`Trash`（垃圾箱）和缓存文件。定期检查 `Downloads` 文件夹，将文件移动到合适的位置或删除不再需要的。清空
    `Trash` 以永久删除已删除的文件并释放空间。


    包管理器缓存存储了下载的安装文件。安装软件后，这些文件仍留在缓存中。使用终端命令清除缓存：

    ```bash

    sudo apt clean

    ```


    这会移除缓存的包文件，可能释放数百兆字节的空间。


    ### 管理启动应用程序


    配置为在登录时自动启动的应用程序会减慢启动速度并消耗资源。


    通过 `System Settings` 或在 `Menu` 中搜索访问 `Startup Applications`。该实用程序显示登录时自动启动的应用程序。每个条目都显示应用程序名称以及一个指示是否已启用的复选框。


    检查列表并禁用你不需要在启动时立即使用的应用程序。例如，如果你很少使用云存储同步，请禁用该客户端自动启动。在需要时手动启动即可。


    某些启动应用程序对于系统功能是必须的。在禁用你不认识的项目时要谨慎。仅禁用你清楚了解并知道不需要持续运行的应用程序。


    如果你希望应用程序在登录后立即可用，可以将它们添加到启动项。点击 `Add`，浏览并选择该应用程序，它将在未来的登录时自动启动。


    ### 系统监控工具


    了解资源使用有助于识别性能问题。


    `System Monitor` 显示实时 CPU、内存和网络使用情况。从 `System Tools` 启动它，或在 `Menu` 中搜索“System
    Monitor”。


    `Processes` 标签页列出了所有运行的应用程序和后台进程。它显示每个进程的名称、状态、CPU 占用和内存消耗。按 CPU 或内存排序，以识别资源密集型进程。


    如果某个应用程序无响应，你可以从 `System Monitor` 强制关闭它。右键点击冻死的进程并选择 `Kill`。这将立即终止应用程序，允许你重启它或处理底层问题。


    `Resources` 标签页显示 CPU、内存、交换空间（swap）和网络使用随时间变化的图表。这些图表有助于识别模式。如果内存使用不断达到上限，你可能需要更多
    RAM 或应该关闭不必要的应用程序。


    ### 备份解决方案


    定期备份可以防止因硬件故障、误删或系统问题导致的数据丢失。


    `Timeshift` 在初始设置期间配置，用于备份你的系统文件。默认情况下它不包含 `Home` 文件夹中的个人文件。在进行重大系统更改（如安装大型软件或调整系统设置）之前，创建手动快照。


    从 `System Tools` 启动 `Timeshift`。点击 `Create` 立即制作快照。快照是增量的，仅存储自上次快照以来的更改，从而节省空间。


    要从快照恢复，启动 `Timeshift`，选择你想恢复的快照并点击 `Restore`。这将系统文件恢复到创建快照时的状态。在系统更改导致问题后使用此功能。


    备份个人文件有多种选择。最简单的方法定期将重要文件复制到外部驱动。连接外部驱动，打开文件管理器，并将你的 `Documents`、`Pictures` 和其他重要文件夹复制到驱动器。


    对于自动备份，通过 `Software Manager` 安装 `Déjà Dup`。此备份工具允许调度定期备份到外部驱动、网络位置或云服务。配置好备份目标和计划，然后它就会自动运行。


    ### 性能优化技巧


    一些调整可以提高系统的响应速度。


    如果图形硬件性能不足，请禁用不必要的桌面效果。打开 `System Settings`，选择 `Effects` 并禁用动画和过渡。在旧硬件上，桌面会感觉更加灵敏。


    关闭未使用的应用程序，而不是让它们同时运行。每个打开的应用程序都会消耗内存和 CPU 周期。只保留你正在使用的应用程序。


    如前所述，监控启动应用程序。启动应用程序越少，启动速度越快，为你实际使用的应用程序提供的资源就越多。


    可能时为资源密集型应用程序使用轻量级替代方案。如果 `Firefox` 感觉很慢，尝试 `Chromium` 或浏览器。如果 `LibreOffice` 对于快速记录来说显得太重，请使用简单的文本编辑器。


    ### 驱动管理


    驱动程序使硬件能够正常工作。Linux Mint 会自动检测大多数硬件，但某些设备受益于专有驱动。


    通过 `System Settings` 访问 `Driver Manager` 可以识别可以使用专有驱动的硬件。显卡受益为为，因为专有驱动通常比开源替代提供更好的性能和功能。


    启动 `Driver Manager` 并允许它扫描系统。如果有专有驱动，它们将出现在列表中并带有推荐。对于 `NVIDIA` 显卡，推荐的专有驱动通常提供最佳体验。


    选择推荐的驱动并点击 `Apply Changes`。安装后，重启电脑使驱动生效。如果你在安装驱动后遇到问题，可以返回 `Driver Manager` 并切换回开源替代方案。


    # 第 10 章：安全与隐私


    ### 理解 Linux 安全


    ### 设置强密码


    '
- fmt: '

    Strong passwords form the first line of defense.


    Good passwords contain at least twelve characters mixing uppercase and lowercase
    letters, numbers, and symbols. Avoid dictionary words, personal information, or
    predictable patterns.


    Don''t reuse passwords across different accounts. If one service experiences a
    breach, unique passwords prevent attackers from accessing other accounts.


    Password managers help manage many unique passwords. `KeePassXC` is an excellent
    password manager available through the `Software Manager`. It stores passwords
    in an encrypted database, requiring only one master password to remember.


    Change your password periodically, particularly if you suspect compromise. Update
    it through `User Accounts` in `System Settings`.


    ## Firewall Configuration


    Firewalls control network traffic, blocking unauthorized connections.


    Linux Mint includes a firewall (`ufw`), but it''s not enabled by default for home
    users. Enable it if your computer is directly exposed to the internet or you want
    additional protection.


    Install `GUFW`, a graphical firewall interface, through the `Software Manager`.
    After installation, launch it from `System Settings` under `Firewall Configuration`.


    Enable the firewall by clicking the `Status` toggle. The default configuration
    blocks incoming connections while allowing outgoing connections, suitable for
    most users. This allows browsing the web and using applications normally while
    preventing unsolicited incoming connections.


    Advanced users can create custom rules allowing specific applications or ports,
    but defaults work well for typical desktop use.


    ## Privacy Settings


    Online privacy requires conscious choices about data sharing.


    Firefox includes Enhanced Tracking Protection blocking many advertisers and trackers.
    Access these settings in `Firefox` preferences under `Privacy & Security`. The
    `Standard` setting blocks most trackers while maintaining site compatibility.
    `Strict` mode offers maximum protection but may break some websites.


    Use private browsing for sensitive sessions. Private windows don''t save history,
    cookies, or form data. While not truly anonymous (your internet provider still
    sees your activity), private browsing prevents local tracking.


    Review application permissions in `System Settings`. Some applications request
    access to your location, camera, or microphone. Grant permissions only to trusted
    applications requiring them for functionality.


    Disable unnecessary online accounts. If you enabled `Google Drive` or other online
    services but no longer use them, disable them in `System Settings` under `Online
    Accounts` to prevent data syncing.


    ## Secure Browsing Practices


    Safe browsing habits prevent many security issues.


    Verify website legitimacy before entering sensitive information. Check for `HTTPS`
    in the address bar, indicated by a padlock icon. `HTTPS` encrypts communication
    between your browser and websites, protecting transmitted data.


    Be cautious with email links. Phishing attacks use deceptive emails directing
    you to fake websites. Verify sender legitimacy before clicking links. When in
    doubt, navigate to websites directly rather than through email links.


    Keep software updated. Security updates patch vulnerabilities that attackers exploit.
    Install updates promptly, particularly security updates for browsers and system
    components.


    Download software only from trusted sources. Use the `Software Manager` for applications.
    Avoid downloading executable files from unknown websites.


    ## Encryption Options


    Encryption protects data from unauthorized access.


    Linux Mint offers home folder encryption during installation. If you didn''t enable
    it initially, setting it up later requires more effort. For new installations
    where privacy is paramount, enable encryption during setup.


    Encrypt sensitive files using archive encryption. Right-click files or folders,
    select `Compress`, and enable password protection in the compression dialog. This
    creates encrypted archives requiring passwords to open.


    External drives can be encrypted for portable security. Use `GNOME Disks` (available
    in `System Tools`) to format drives with encryption. Encrypted drives require
    passwords when connected, protecting data if drives are lost or stolen.


    ## Malware Protection


    Linux experiences far less malware than some other operating systems, but vigilance
    remains important.


    Avoid installing software from unknown sources. `PPAs` and `third-party repositories`
    should come from reputable providers. Research before adding new software sources.


    Don''t run untrusted scripts or commands. `Terminal` commands have significant
    power. Copy-pasting commands from forums without understanding them is dangerous.


    `ClamAV` provides virus scanning for Linux. While primarily useful for scanning
    files you''ll share with Windows users, it can detect Linux threats too. Install
    it through the `Software Manager` if desired.


    Practice general computer hygiene: don''t open suspicious email attachments, don''t
    provide passwords to untrusted sources, and maintain awareness of social engineering
    tactics.


    # Chapter 11: Troubleshooting Common Issues


    ### Boot Problems


    If Linux Mint won''t start properly, several solutions exist.


    If the system boots to a blank screen, graphics driver issues may be responsible.
    Restart and access `GRUB` (the boot menu) by pressing `Shift` during startup.
    Select "Advanced options" and choose an earlier kernel. This boots using a previous
    kernel that may work better with your hardware.


    For severe boot problems, boot from your Linux Mint USB drive and use the live
    environment to troubleshoot. From there, you can access your installed system''s
    files and potentially fix issues.


    ### Network Connectivity Issues


    Connection problems have several common causes.


    For wireless issues, verify the physical wireless switch on your laptop is enabled.
    Some laptops have hardware switches or keyboard combinations (often `Fn + a function
    key`) that disable wireless.


    If wireless networks don''t appear, your wireless adapter may not be recognized.
    Check `Driver Manager` for available drivers. Some wireless chips require proprietary
    drivers not installed by default.


    Restart networking services if connections behave erratically. Open a terminal
    and type:


    ```bash

    sudo service network-manager restart

    ```


    This restarts the network management service and often resolves temporary glitches.


    ### Sound Problems


    Audio issues often have simple solutions.


    Check volume settings first. The volume control in the system tray might be muted
    or set too low. Click it and increase volume.


    Verify the correct output device is selected. If you have multiple audio devices
    (built-in speakers, headphones, `HDMI audio`), ensure the desired device is active
    in `Sound Settings`.


    Some applications have independent volume controls. If one application is silent
    while others produce sound, check that application''s internal volume settings.


    ### Display Issues


    Screen problems range from incorrect resolution to missing displays.


    If resolution seems wrong, open `Display Settings` and select the correct resolution
    for your monitor. Linux Mint usually detects this automatically, but manual selection
    may be necessary for some displays.


    For multiple monitor issues, ensure all monitors are detected in `Display Settings`.
    If a monitor doesn''t appear, check physical connections. Try different cable
    types or ports if available.


    ### Software Installation Errors


    Installation problems occur occasionally.


    If the `Software Manager` reports errors, update package lists first. Open a terminal
    and run:


    ```bash

    sudo apt update

    ```


    Then try installation again. Outdated package lists cause problems with dependency
    resolution.


    If the system reports broken packages, repair them with:


    ```bash

    sudo apt --fix-broken install

    ```


    This command resolves dependency conflicts that prevent installations.


    ### System Performance Issues


    Slow performance has various causes.

