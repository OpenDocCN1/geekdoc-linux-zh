    \n每个这样的语句都会在其声明所在函数的**作用域**内分配**内存**。每个**数据声明**将占用一定量的以**字节**为单位的内存，并为该部分内存赋予一个标签，即*变量名*。每种数据类型都有指定的大小，且\
    \ *sizeof()* 库函数将返回此整数。在这种情况下，是 $3 \\times 256$ 个字符、一个整数和两个浮点数。确切大小取决于机器，但可能是\
    \ 780 字节。\n\n在数据声明所在的函数之外，这些数据是无法访问的——这就是声明的**作用域**。如果我们在 main() 函数外部声明，它的作用域将是**全局**的，其他函数就可以访问它。C\
    \ 语言允许你这样做这种危险的操作，如果你愿意的话，所以请小心。\n\n通常，我们会密切关注数据的作用域，并将**只读副本**或指向数据的**带标签的内存地址**传递给程序中可能需要对其执行操作甚至修改操作的部分。这些带标签的内存地址被称为**指针**。\n\
    \n我们在输出中使用**printf** 系列库函数（**sprintf** 用于创建字符串，**fprintf** 用于写入文件等），它们都使用共同的**格式字符串**参数来指定数据的表示方式。\n\
    \n- %c 字符\n- %s 字符串\n- %d 整数\n- %f 浮点数 等等\n\n参数中剩余的变量序列将按照指定顺序放入格式字符串中。\n\n在 C\
