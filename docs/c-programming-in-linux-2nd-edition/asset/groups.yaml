    \n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_32_1.png)\n\n# 3 FUNCTIONS, POINTERS\
    \ AND STRUCTURES\n\n## 3.1 FUNCTIONS\n\nThe entry point into all our programs\
    \ is called `main()` and this is a **function**, or a **piece of code** that does\
    \ something, usually returning some value. We structure programs into functions\
    \ to stop them become long unreadable blocks of code that cannot be seen in one\
    \ screen or page and also to ensure that we do not have repeated identical chunks\
    \ of code all over the place. We can call **library functions** like `printf`\
    \ or `strtok` which are part of the C language and we can call our own or other\
    \ people's functions and libraries of functions. We have to ensure that the appropriate\
    \ header file exists and can be read by the preprocessor and that the source code\
    \ or compiled library exists too and is accessible.\n\nAs we learned before, the\
    \ **scope** of data is restricted to the **function** in which it was declared,\
    \ so we use **pointers** to data and blocks of data to pass to functions that\
    \ we wish to do some work on our data. We have seen already that strings are handled\
    \ as pointers to arrays of single characters terminated with a NULL character.\n\
    \n```c\n/* C Programming in Linux (c) David Haskins 2008\n * chapter3_1.c */\n\
    \n#include <stdio.h>\n#include <string.h>\n#include <math.h>\n\ndouble doit(int\
    \ number1, int number2)\n{\n    return sqrt((double)(number1 + number2));\n}\n\
    \nint main(int argc, char *argv[], char *env[])\n{\n    int n1 = 0, n2 = 0, i\
    \ = 0;\n    n1 = atoi(strtok(argv[1], \" \"));\n    n2 = atoi(strtok(NULL, \"\
    \ \"));\n    printf(\"Content-type:text/html\\n\\n<html><body>\\n\");\n    for(i=1;\
    \ i<=100; i++)    printf(\"%f \", doit(n1+i, n2*i));\n    printf(\"</body></html>\\\
    n\");\n    return 0;\n}\n```\n\nIn this example we can repeatedly call the function\
    \ “doit” that takes two integer arguments and returns the result of some mathematical\
    \ calculation.\n\n**Compile**: `gcc -o func1 chapter3_1.c -lm`\n**Copy to cgi-bin**:\
    \ `cp func1 /home/david/public_html/cgi-bin/func1`\n\n(You should be using the\
    \ Makefile supplied or be maintaining a Makefile as you progress, adding targets\
    \ to compile examples as you go.)\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_34_0.png)\n\
    \nThe result in a browser looks like this called with “func1?5;5”.\n\nIn this\
    \ case the arguments to our function are sent as **copies** and are not modified\
    \ in the function but used.\n\nIf we want to actually modify a variable we would\
    \ have to send its pointer to a function.\n\n```c\n/* C Programming in Linux (c)\
    \ David Haskins 2008\n * chapter3_2.c */\n\n#include <stdio.h>\n#include <string.h>\n\
    #include <math.h>\n\nvoid doit(int number1, int number2, double *result)\n{\n\
    \    *result = sqrt((double)(number1 + number2));\n}\n\nint main(int argc, char\
    \ *argv[], char *env[])\n{\n    int n1 = 0, n2 = 0, i = 0;\n    double result\
    \ = 0;\n    n1 = atoi(strtok(argv[1], \";\"));\n    n2 = atoi(strtok(NULL, \"\
    ;\"));\n    printf(\"Content-type:text/html\\n\\n<html><body>\\n\");\n    for(i\
    \ = 1; i <= 100; i++)\n    {\n        doit(n1 + i, n2 * i, &result);\n       \
    \ printf(\"%6f \", result);\n    }\n    printf(\"</body></html>\\n\");\n    return\
    \ 0;\n}\n```\n\nWe send the address of the variable ‘result’ with `&result`, and\
    \ in the function `doit` we *de-reference* the pointer with `*result` to get at\
    \ the float and change its value, outside its scope inside main. This gives identical\
    \ output to chapter3_1.c.\n\n## 3.2 LIBRARY FUNCTIONS\n\nC contains a number of\
    \ built-in functions for doing commonly used tasks. So far we have used **atoi**,\
    \ **printf**, **sizeof**, **strtok**, and **sqrt**. To get full details of any\
    \ built-in library function all we have to do is type for example:\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_36_0.png)\n\
    \nWhich pretty-well tells you everything you need to know about this function\
    \ and how to use it and variants of it. Most importantly it tells you which **header\
    \ file** to include.\n\n### 3.3 A SHORT LIBRARY FUNCTION REFERENCE\n\nFull details\
    \ of all the functions available can be found at:\n\nCommon Library Functions\
    \ by Header File:\n\n| Header File | Category | Functions Example |\n| :--- |\
    \ :--- | :--- |\n| `math.h` | Trigonometric Functions | `cos` `sin` `tan` |\n\
    | `math.h` | Exponential, Logarithmic, and Power Functions | `exp` `log` `pow`\
    \ `sqrt` |\n| `math.h` | Other Math Functions | `ceil` `fabs` `floor` `fmod` |\n\
    | `stdio.h` | File Functions | `fclose` `feof` `fgetpos` `fopen` `fread` `fseek`\
    \ |\n| `stdio.h` | Formatted I/O Functions | `printf` `scanf` |\n| `stdio.h` |\
    \ Character I/O Functions | `fgetc` `fgets` `fputc` `fputs` `getc` `getchar` `gets`\
    \ `putc` `putchar` `puts` |\n| `stdlib.h` | String Functions | `atof` `atoi` `atol`\
    \ |\n| `stdlib.h` | Memory Functions | `calloc` `free` `malloc` |\n| `stdlib.h`\
    \ | Environment Functions | `abort` `exit` `getenv` `system` |\n| `stdlib.h` |\
    \ Math Functions | `abs` `div` `rand` |\n| `string.h` | String Functions | `strcat`\
    \ `strchr` `strcmp` `strncmp` `strcpy` `strncpy` `strcspn` `strlen` `strstr` `strtok`\
    \ |\n| `time.h` | Time Functions | `asctime` `clock` `ctime` `time` |\n\nThere\
    \ is no point in learning about library functions until you find you need to do\
    \ something which then leads you to look for a function or a library of functions\
    \ that has been written for this purpose. You will need to understand the function\
    \ signature — or what the argument list means and how to use it and what will\
    \ be returned by the function or done to variables passed as pointers to functions.\n"
