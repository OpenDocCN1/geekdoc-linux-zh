  mdcn: "\n\n# C 语言 Apache 模块\n# 带有 C 客户端库接口的 MySQL 服务器\n# 带有 C 接口的 GD 图形库\n# 涉及 CSS、(X)HTML、XML、JavaScript、Ajax\
    \ 的附带使用\n\n本课程由英国伦敦金斯顿大学（Kingston University）的一年级和二年级计算机科学学生设计并经过实验室测试。\n\n# 系统配置\n\
    \n本书假设你使用的是带有 KDE 或 Gnome 桌面的 Linux 操作系统。常见架构的具体设置说明请参见 http://www.ubiq.org/CProgrammingInLinux/\n\
    \n如果你使用的是 KDE 桌面，你将拥有 Konqueror 或 Dolphin 作为文件管理器，以及 kate 或 kedit 作为编辑器。\n\n在\
    \ Gnome 中，你可能会使用 Nautilus 和 gedit。\n\n你需要熟悉以“超级用户”身份执行某些操作的概念，以便获得复制或删除某些文件的访问权限。这通常通过在\
    \ Linux 命令前加上“sudo”并提供密码来实现，如下例所示：\n\n“sudo cp hello3 /srv/www/cgi-bin/hello3”\n\
    \n该命令将文件“hello3”复制到 Apache 服务器查找通用网关接口或 cgi 程序所在的区域。\n\n在 KDE 中，“kdesu konqueror”\
    \ 会以超级用户身份打开一个文件管理器。\n\n在 Gnome 中，“gnomesu nautilus” 会以超级用户身份打开一个文件管理器。\n\n你需要安装以下软件包：\n\
    \n| 软件包 | Ubuntu | Open Suse |\n| :--- | :--- | :--- |\n| C 开发库 | build-essential\
    \ | Base Development (pattern) |\n| Apache web 服务器 | apache2 | Web and LAMP Server\
    \ (pattern) |\n| Apache 开发库 | apache2-prefork-dev | apache2-devel |\n| MySQL 服务器、客户端和开发库\
    \ | mysql-server libmysqlclient-dev | libmysqlclient-devel |\n| GD 和开发库 | libgd2-xpm\
    \ libgd2-xpm-dev | gd gd-devel |\n\n在正文中，你会看到对文件夹 **cgi-bin** 的引用。该文件夹的位置因 Linux\
    \ 发行版而异。默认情况下，用于 web 程序的此文件夹是：\n\n- OpenSuse: `/srv/www/cgi-bin`\n- Ubuntu: `/usr/lib/cgi-bin`\n\
    \n为了将程序放置在那里，你需要超级用户权限，因此最好在你自己的 home/`*****`/public\\_html/cgi-bin 目录中创建一个文件夹，并更改\
    \ Apache 配置文件中的 **ScriptAlias** 和相关的 **Directory** 引用（OpenSuse）`/etc/apache2/default-server.conf`\
    \ 或（Ubuntu）`/etc/apache2/sites-available/default.`\n\n# 1 你好，世界\n\n## 1.1 你好程序\
    \ 1\n\n使用文件管理器（在 KDE 中为 Konqueror，在 Gnome 中为 Nautilus）在你的主目录中创建一个新目录，用于存放本书中的所有示例，名称可以随意，例如“Programming_In_Linux”，名称中不要包含空格。\n\
    \n打开一个编辑器（在 KDE 中为 kate，在 Gnome 中为 gedit），输入（或从提供的源代码 zip 包中复制）以下内容：\n\n```c\n\
    /*\nC Programming in Linux (c) David Haskins 2008\nchapter1_1.c\n*/\n#include\
    \ <stdio.h>\n\nint main(int argc, char *argv[])\n{\n    printf(\"Hello, you are\
    \ learning C!\\n\");\n    return 0;\n}\n```\n\n将文本保存为新创建的主目录文件夹中的 **chapter1_1.c**。\n\
    \n打开一个终端窗口并输入：**gcc -o hello chapter1_1.c** 将程序编译为可执行的形式。\n\n现在输入“ls -l”以列出该目录中所有文件的详细信息。你应该能看到\
    \ chapter1_1.c 在那里，以及一个名为“hello”的文件，这是你刚刚编写的已编译的 C 程序。\n\n现在输入：**./hello** 以执行或运行该程序，它应该返回以下文本：\n\
    \n“Hello you are learning C!”。\n\n如果成功运行，恭喜你，你现在的身份是程序员了！\n\n### 程序剖析\n\n位于 /***\
    \ *** / 之间的部分是一个注释，不会被编译，仅用于提供信息和参考。\n\n“#include...” 部分告诉编译器需要哪些系统库，以及该程序引用了哪些头文件。在我们的情况下，使用了“printf”，它定义在\
    \ stdio.h 头文件中。\n\n“int main(int argc, char *argv[])” 部分是实际程序的开始。这是一个入口点，大多数 C\
    \ 程序都有一个 main 函数。\n\n“int argc” 是函数“main”的一个参数，它是一个整数，用于计算通过“char *argv[]”（一个指向字符字符串的指针列表）传入的字符字符串参数的数量，这些参数可能在我们运行程序时通过命令行传入。\n\
    \n指向某事物的指针是指为这种数据类型在内存地址上指定的名称。我们可以有一个指向整数的指针：int *iptr，或者一个指向浮点数的指针：float *fPtr。任何事物列表都由\
    \ [] 描述，如果我们确切知道这个列表的大小，我们可能会将其声明为 [200]。在这种情况下，我们知道第二个参数是一个指向字符字符串的指针列表。\n\n\
    花括号内的其他所有内容都是 main 函数，在这种情况下，整个程序以行来表示。\n\n每一行或语句都以分号“;”结束。\n\n我们有像“printf(…)”这样的函数调用，这是调用定义在头文件\
    \ stdio.h 中的标准输入/输出库。\n\n在程序末尾，“return 0” 通过向系统返回零来结束程序。\n\n如果程序未正确运行，返回值通常用于指示成功或状态。\n\
    \n## 1.2 你好程序 2\n\n将这个例子再进一步，考察程序入口处函数的声明：int main(int argc, char *argv[])\n\n\
    用通俗的英语来说，这意味着：\n\n名为“main”的函数，返回一个整数，接受两个参数，一个是名为“argc”的整数，它是命令参数的数量，然后是 *argv[]，它是一个指向字符串的指针列表或数组，即这些字符串是你从命令行运行程序时输入的实际参数。\n\
    \n**一些定义：**\n\n- **函数**：一块程序代码，具有 **返回数据类型**、一个名称、一些由逗号分隔的不同数据类型的参数，括在 **括号**\
    \ 内，然后是括在 **花括号** 内的函数体，每个语句以 **分号** 结尾。\n- **整型符号 int**：像 0,1,2,3,4,5 这样的计数数字。\n\
    - **列表、数组符号 []**：相同类型事物按编号顺序排列的序列。\n- **指针符号 \\***：定位某种类型数据片段起始位置的内存地址。\n- **字符串或\
    \ char \\***：指向由组成“cat”的字符（如 'c', 'a', 't'）序列的指针。字符字符串以特殊字符 NULL 或 '\\0' 结尾，ASCII\
    \ 值为 0 或十六进制 00\n\n让我们重写一下程序，看看所有这些意味着什么，以免我们开始恐慌。\n\n```c\n/*************************************************\n\
    \ C Programming in Linux (c) David Haskins 2008\n chapter1_2.c\n *************************************************/\n\
    #include <stdio.h>\n\nint main(int argc, char *argv[])\n{\n int i=0;\n printf(\"\
    Hello, you are learning C!\\n\");\n printf(\"Number of arguments to the main function:%d\\\
    n\", argc);\n for(i=0; i<argc; i++)\n {\n printf(\"argument number %d is %s\\\
    n\", i, argv[i]);\n }\n return 0;\n}\n```\n\n将文本保存为同一文件夹中的 **chapter1_2.c**。\n\
    \n打开一个终端窗口并输入：\n\n```bash\ngcc -o hello2 chapter1_2.c\n```\n\n将程序编译为可执行的形式。\n\n\
    现在输入 `ls -l` 以列出该目录中所有文件的详细信息。你应该能看到 chapter1_2.c 在那里，以及一个名为 `hello2` 的文件，这是你刚刚编写的已编译的\
    \ C 程序。\n\n现在输入 `./hello2` 以执行或运行该程序，它应该返回以下文本：\n\n```text\nHello, you are still\
    \ learning C!!\nNumber of arguments to the main function:1\nargument number 0\
    \ is ./hello2\n```\n\n我们可以看到，程序自身的名称被计为一个命令行参数，并且列表中或参数数组中事物的计数从零开始，而不是从一开始。\n\
    \n现在输入 `./hello2 my name is David` 以执行该程序，它应该返回以下文本：\n\n```text\nHello, you are\
    \ still learning C!!\nNumber of arguments to the main function:5\nargument number\
    \ 0 is ./hello2\nargument number 1 is my\nargument number 2 is name\nargument\
    \ number 3 is is\nargument number 4 is David\n```\n\n那么，这里正在发生什么？似乎我们正在读回为了运行程序而输入的每个字符字符串（单词）。\n\
    \n"
