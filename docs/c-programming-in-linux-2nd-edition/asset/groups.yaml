    \n# 8 幽灵项目\n\n## 8.1 PHP 网站生成器项目\n\n能够编写简短的 C 程序来自动化繁琐任务，或者完成那些通常需要使用邮件合并等笨重工具花费数小时才能完成的工作，这是你学会后将最感庆幸的技能之一。这个项目就是这样一项节省时间的工具。Ghost\
    \ 是一个轻量级的 PHP 生成器，供你自定义使用。\n\n如果你发现自己总是需要构建 PHP 网站，那么一种能够一步生成所有参数传递、解码、表单构建和数据库管理代码的快速方法将非常有用。像\
    \ Ruby on Rails 这样的工具提供了此类功能，但它们的设置和运行复杂得多，并且你最终需要学习另一种语言才能进一步开发。\n\n开始使用这个工具的最佳方式可能是编译并运行它。将\
    \ ghost.zip 源代码解压缩到你的 public_html 文件夹中，这将创建一个名为 ghost 的文件夹。Makefile 包含一个名为 g1\
    \ 的目标，用于编译和链接 ghost。因此，进入 **public_html/ghost** 并输入：**make g1**。\n\n要运行网站生成器，请输入：\n\
    \n- ./ghost testwebsite data1 data2 data1 data3 data4 data6 data6\n- 这将创建：\n \
    \ - 一个文件夹 **public_html/testwebsite**\n  - 一个名为 **testwebsite** 的 mysql 数据库表，包含文本字段\
    \ data1 data2 data1 data3 data4 data6 data6\n  - 一个 **testwebsite.css** 文件\n \
    \ - 空的 **header.html** 和 **footer.html** 页面\n  - 一个 **index.php**，演示了对指定数据项的数据库表进行表单处理、条目、编辑与更新以及删除。\n\
    \n在浏览器中，你将在 `http://localhost/~yourname/testwebsite` 看到如下界面\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_72_0.png)\n\
    \n其背后的理念是，创建和管理表单内容的所有机械性工作都已完成并可以进行自定义。此屏幕截图显示了提交一条记录后的结果。顶部一行用于输入新数据，底部一行或几行允许编辑或删除记录。这是一个框架，允许你在自己的网站设计中采用和使用其中的部分。\n\
    \n让我们分段查看此代码。\n\n第一部分声明所需的数据，并创建文件夹和 CSS 文件。\n\n```cpp\nint main(int argc, char\
    \ *argv[])\n{\n  FILE *out = NULL;\n  MYSQL *conn = NULL;\n  MYSQL_RES *result\
    \ = NULL;\n  MYSQL_ROW row;\n  MYSQL_FIELD *field;\n  char SQL[STRINGSIZE] = \"\
    \";\n  char BIT[STRINGSIZE] = \"\";\n  char SQLINSERT[STRINGSIZE] = \"\";\n  char\
    \ SQLUPDATE[STRINGSIZE] = \"\";\n  char SQLDELETE[STRINGSIZE] = \"\";\n  int rc\
    \ = 0, i = 0, num_fields = 0;\n\n  //CREATE DIRECTORY////////////////\n  sprintf(BIT,\
    \ \"mkdir ~/public_html/%s\", argv[1]);\n  system(BIT);\n  //BUILD CSS///////////////////////\n\
    \  sprintf(BIT, \"../%s/%s.css\", argv[1], argv[1]);\n  out = fopen(BIT, \"w\"\
    );\n  fprintf(out, \"table {width:800;vertical-align:top;}\\n\");\n  fprintf(out,\
    \ \"th {font-size:80%;color:#fd9208;vertical-align:bottom;text-align:left;}\\\
    n\");\n  fprintf(out, \"td {font-size:80%;color:#fd9208;vertical-align:bottom;text-align:left;}\\\
    n\");\n  fprintf(out, \"input {font-size:80%;color:#196419;}\\n\");\n  fprintf(out,\
    \ \"a {font-size:65%;color:#000000;}\\n\");\n  fclose(out);\n```\n\n接下来生成 header.html\
    \ 和 footer.html 文件。这些文件由 PHP 文件加载，可以作为通用的公共页眉和页脚使用。CSS 文件在 header.html 文件中被引用。\n\
    \n```c\n//BUILD HEADER HTML///////////////////////////////////\nsprintf(BIT, \"\
    ./%s/head.html\", argv[1]);\nout = fopen(BIT, \"w\");\nfprintf(out, \"<html>\\\
    n\");\nfprintf(out, \"<head>\\n\");\nfprintf(out, \"<link rel=\\\"stylesheet\\\
    \" type=\\\"text/css\\\" href=\\\"%s.css\\\" />\\n\", argv[1]);\nfprintf(out,\
    \ \"<title>%s</title>\\n\", argv[1]);\nfprintf(out, \"</head>\\n\");\nfprintf(out,\
    \ \"<body>\\n\");\nfprintf(out, \"<center>\\n\");\nfprintf(out, \"<table><tr><td>\\\
    n\");\nfprintf(out, \"</td></tr></table>\\n\");\nfclose(out);\n//BUILD FOOT HTML///////////////////////////////////\n\
    sprintf(BIT, \"./%s/foot.html\", argv[1]);\nout = fopen(BIT, \"w\");\nfprintf(out,\
    \ \"</body></html>\\n\");\nfclose(out);\n```\n\n接下来我们创建数据库。\n\n```c\n//OPEN DATABASE/////////////////////////////////\n\
    conn = mysql_init(NULL);\nmysql_options(conn, MYSQL_READ_DEFAULT_GROUP, \"mysqldump\"\
    );\nmysql_real_connect(conn, \"localhost\", \"\", \"test\", 0, NULL, 0);\n//CREATE\
    \ TABLE////////////////////////////////////////\nsprintf(SQL, \"drop table if\
    \ exists %s\", argv[1]);\nrc = mysql_query(conn, SQL);\nsprintf(SQL, \"create\
    \ table %s (ID varchar(255)\", argv[1]);\nfor (i = 2; i < argc; i++)\n{\n    sprintf(BIT,\
    \ \",%s varchar(255)\", argv[i]);\n    strcat(SQL, BIT);\n}\n\nstrcat(SQL, \"\
    )\");\nrc = mysql_query(conn, SQL);\n```\n\n现在复杂的部分开始了，即生成一个 PHP 脚本。理解这一点的最佳方法是在浏览器中查看页面源代码时检查该程序的实际控制输出。\n\
    \n顶部是一个表单，针对由运行 ghost 程序生成的表中定义的每一列都有一个文本框。\n\n```html\n<tr>\n<form><input type='hidden'\
    \ name='MODE' value='INSERT'>\n<td><input type=hidden name='ID' value='1'>1</td>\n\
    <td><input type=text name='data1' /></td>\n<td><input type=text name='data2' /></td>\n\
    <td><input type=text name='data3' /></td>\n<td><input type=text name='data4' /></td>\n\
    <td><input type=text name='data5' /></td>\n<td><input type=text name='data6' /></td>\n\
    <td><input type='submit' value='post' /></td>\n</form>\n</tr>\n```\n\n对于表中的每一行，我们现在生成一个允许编辑数据的表单，以及一个用于执行删除操作的锚点链接。\n\
    \n```html\n<tr>\n<form><input type='hidden' name='MODE' value='UPDATE'>\n<td><input\
    \ type=hidden name='ID' value='0'>0</td>\n<td><input type=text name='data1' value='aaaaaaaaaaaaaa'></td>\n\
    <td><input type=text name='data2' value='aaaaaaaaaaaaaa'></td>\n<td><input type=text\
    \ name='data3' value='aaaaaaaaaaaaaa'></td>\n<td><input type=text name='data4'\
    \ value='aaaaaaaaaaaaaa'></td>\n<td><input type=text name='data5' value='aaaaaaaaaaaaaa'></td>\n\
    <td><input type=text name='data6' value='aaaaaaaaaaaaaa'></td>\n<td><input type='submit'\
    \ value='edit' /></form>\n<a href='?ID=0&MODE=DELETE'>delete</a></td>\n</tr>\n\
    ```\n\n仔细检查 index.php 文件，你可以看到这一切发生在哪里，并逆向查找在 ghost.c 源代码中生成此 PHP 代码的位置。一个好主意是在打印稿上使用高光笔，因为我们在另一种语言（PHP）内部嵌入了一种语言（HTML），而\
    \ PHP 又在另一种语言内部，因此非常谨慎地使用转义字符 `\\` ' 来表示必要的单引号和双引号，以使其正常工作。这看起来可能很复杂——但 ghost\
    \ 允许的快速原型设计使得花时间去自定义 C 代码是值得的，这样你想要的 PHP 和数据库就会以你期望的方式输出。\n\n这里是生成编辑或删除行的 PHP\
    \ 文件 index.php 的部分代码。静态 HTML 已突出显示，其他部分由 MySQL PHP 函数调用插入。\n\n"
