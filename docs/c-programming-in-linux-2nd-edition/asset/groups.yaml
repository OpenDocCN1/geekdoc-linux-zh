    \ the same C library.\n\nThe text displayed here is using one of the internal\
    \ fonts, Tiny, Small, Medium Bold, Large and Giant which are adequate for simple\
    \ labelling but you can also use TrueType fonts for more attractive output.\n\n\
    Geometric drawing with lines or certain styles, filled and open polygons, and\
    \ circles, arcs can be created. The main thing to remember is that the origin\
    \ of an image is the **TOP left hand corner** which might seem unintuitive to\
    \ anyone who has studied mathematics – quite why this is I have never discovered\
    \ but can only imagine that the first programmer to do anything in this area happened\
    \ to not know about graphs in which we think of the origin x=0, y=0 as being at\
    \ the bottom left hand.\n\nColours are specified as RGB values in the range 0\
    \ to 255 so that white is 255,255,255 and red is 255,0,0. To work out fine-grained\
    \ hues use a graphics tool like GNU GIMP which has colour pickers so you can find\
    \ out subtle RGB values. Palettes of colours from one image can be used in another\
    \ and the closest colour in a palette requested or created if there is space for\
    \ it to be allocated.\n\n### 6.2 USING TRUETYPE FONTS\n\nIn this example we modify\
