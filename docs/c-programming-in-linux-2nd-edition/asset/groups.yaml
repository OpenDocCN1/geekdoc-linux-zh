    n\");\n\tprintf(\"<html>\\n\");\n\tprintf(\"<body bgcolor=\\\"%s\\\"\\n\",argv[1]);\n\
    \tprintf(\"</body>\\n\");\n\tprintf(\"</html>\\n\");\n\treturn 0;\n}\n```\n\n\
    编译命令：`gcc -o data3 chapter2_3.c -lc`\n\n作为超级用户，将程序复制到你的 public_html/cgi-bin 目录（或\
    \ /srv/www/cgi-bin (OpenSuSe) 或 /usr/lib/cgi-bin (Ubuntu)）。\n\n在浏览器中输入：`http://localhost/cgi-bin/data3?red`\n\
    你应该会看到以下内容：\n\n![图像描述](img/ad23766cfc9c69ba4f733f8b935cc3d8_28_0.png)\n\n或者如果发送任何参数，你会得到令人惊讶的结果：\n\
    \n![图像描述](img/ad23766cfc9c69ba4f733f8b935cc3d8_28_1.png)\n\n我们在这里做的是使用字符串参数 argv[1]\
    \ 作为 HTML body 标签内的背景颜色代码。我们将 Content-type 规范更改为 text/html，奇迹般地，现在我们的程序正在生成 HTML\
    \ 内容。一种语言在另一种语言表达内部。Web 浏览器理解一组有限的颜色术语，颜色也可以通过十六进制代码定义，例如 #FFFFFF（白色）、#FF0000（红色）、#00FF00（绿色）、#0000FF（蓝色）。\n\
    \n这个有趣的练习不仅仅是一个小把戏；一个程序可以在另一种语言中生成另一个程序的想法非常强大，这是整个互联网力量背后的原因。当我们从这个**通用网关接口程序**生成\
    \ HTML（或 XML 或任何其他内容）时，我们正在创建**动态内容**，可以链接到实时、变化的数据，而不是**静态**预编辑的网页。在实践中，大多数网站都有动态和静态内容的混合，但在这里我们只是在非常简单的层面上看到这是如何做到的。\n\
    \n在这本书中，我们将使用浏览器作为我们程序的推荐界面，因此我们将生成 HTML 和二进制图像流 Web 内容，纯粹作为一种手段来使程序的力量立即显现。在终端屏幕上盯着代码看并不是什么令人印象深刻的事情，编写窗口类型应用程序也不那么简单。\n\
    \n在实践中，你被要求编写的大多数软件都将在网络上运行，所以我们要不就这样一开始就从这个想法开始。大多数 Web 应用程序还涉及**多种语言**，例如 CSS、(X)HTML、XML、JavaScript、PHP、JAVA、JSP、ASP、.NET、SQL。如果这听起来很可怕，别恐慌。对\
    \ C 语言的了解将表明，这些执行不同功能的语言在语法上都有 C 语言的基础。\n\n## 2.4 解析字符串\n\n从某种输入字符串中提取含义或有价值信息所涉及的工作被称为“解析”。我们现在将构建另一个有趣的、可通过互联网调用的\
    \ CGI 程序来展示我们手中的力量。\n\n"
