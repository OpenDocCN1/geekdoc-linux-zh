  - '[PAGE 56]


    In barely 10 lines (highlighted) of C we have inserted our data into a database
    table and can read it out again, which is pretty painless. With **mysql_init**
    we obtain a pointer to a data structure of type MYSQL, we can then se this to
    connect to the test database with **mysql_options** and **mysql_real_connect**,
    then we execute SQL statements just as we would in a terminal session. The results
    of a query can be retrieved as a sequence of MYSQL_ROW arrays of strings with
    **mysql_use_results**. We free up the memory used with **mysql_free_result** and
    close the database with **mysql_close**.


    As is usual with C libraries, you need to be able understand the usually sparse
    documentation to understand the function calls, and for MySQL 5.1 we can find
    all this information at:


    <http://dev.mysql.com/doc/refman/5.1/en/index.html>'
