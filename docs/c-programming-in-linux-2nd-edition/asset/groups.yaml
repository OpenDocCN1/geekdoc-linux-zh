  mdcn: "\n\n## 6 使用 GD 库进行图形处理\n\n动态生成适合特定场景的有趣图像是一种令人愉悦、具有挑战性且富有回报的编程类型。我们将使用 Thomas\
    \ Boutell 的 GD C 语言库，该库作为一个开放系统项目已存在多年。\n\n### 6.1 生成二进制内容\n\n在这里，我们创建一个图像，并将查询字符串（QUERY\
    \ STRING）中 `TEXT=` 部分的内容打印到其中，并将我们的内容类型设置为 image/gif。**gdImageGif** 函数将二进制图像写入\
    \ **stdout**，即输出流，而不是文件，因此二进制图像数据会被发送回浏览器。\n\n```c\n/*************************************************************************\n\
    \ * C Programming in Linux (c) David Haskins 2008\n * chapter6_1.c           \
    \                        *\n/************************************************************************/\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <gd.h>\n\
    #include <gdfonts.h>\n#include \"c_in_linux.h\"\n\nint main(int argc, char *argv[],\
    \ char *env[])\n{\n    int text=0,background=0,height=50,width=0;\n    char value[255]\
    \ = \"\";\n    gdImagePtr im_out = NULL;\n\n    decode_value(\"TEXT=\", (char\
    \ *) &value, 255);\n    width = ( strlen(value) * 10 ) + 5;\n    im_out = gdImageCreate(width,height);\n\
    \    background = gdImageColorAllocate(im_out, 255,0,255);\n    text  = gdImageColorAllocate(im_out,0,0,255);\n\
    \    gdImageFilledRectangle(im_out, 0,0, width-1, height-1, background);\n   \
    \ gdImageString(im_out,gdFontGetSmall(),10,5,(unsigned char *)value,    text);\n\
    \    printf(\"Content-type: image/gif\\n\\n\");\n    gdImageGif(im_out,stdout);\n\
    \    gdImageDestroy(im_out);\n    return 0;\n}\n```\n\n当使用 `cgi-bin/gdgraph1?TEXT=DavidHaskins`\
    \ 调用该程序时，会产生如下输出：\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_59_0.png)\n\n虽然这并不是最花哨或最吸引人的练习，但它至少展示了生成图形输出的关键原理。使用\
    \ GD 库，你可以加载现有图像，并以 **GIF**、**JPEG**、**PNG**、**WBMP** 等多种格式生成图像，甚至可以创建 **动画 GIF**。\n\
    \n如果你使用过 PHP 开发工具，你会认出 GD 库函数，因为它们几乎完全相同，这表明在这种情况下 PHP 只是同一个 C 库的封装层。\n\n这里显示的文本使用了内部字体之一，包括\
    \ Tiny、Small、Medium Bold、Large 和 Giant。这些字体足以满足简单的标签需求，但你也可以使用 TrueType 字体以获得更吸引人的输出。\n\
    \n可以使用线条或特定样式、填充和多边形（开放或封闭）以及圆形、圆弧进行几何绘图。需要牢记的主要一点是，图像的**左上角**是原点，对于学过数学的人来说，这可能显得反直觉——我从未发现为什么是这样，只能想象最早在这一领域从事工作的程序员恰好不熟悉我们通常认为原点\
    \ x=0, y=0 位于左下角的坐标系。\n\n颜色以 0 到 255 范围内的 RGB 值指定，因此白色是 255,255,255，红色是 255,0,0。要确定细微的色调，请使用\
    \ GNU GIMP 等图形工具，它拥有取色器功能，帮助查明细微的 RGB 值。可以从一张图像的调色板中获取颜色，并在另一张图像中使用，请求的调色板中最接近的颜色将被使用，如果还有空间则会自动创建该颜色。\n\
    \n### 6.2 使用 TrueType 字体\n\n在这个例子中，我们修改了之前的程序，使用 TrueType 字体生成标签。\n\n```c\n/*************************************************************\n\
    \ * C Programming in Linux (c) David Haskins 2008 * chapter6_2.c\n ************************************************************/\n\
    \n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <gd.h>\n\
    #include <gdfonts.h>\n#include \"c_in_linux.h\"\n\nint main(int argc, char *argv[],\
    \ char *env[]) {\n    int text=0,background=0,height=50,width=0,x=0,y=0,size=30,string_rectangle[8];\n\
