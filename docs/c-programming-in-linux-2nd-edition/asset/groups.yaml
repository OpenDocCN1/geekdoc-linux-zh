    \ im, FILE*out)\n```\n\n**绘图函数：**\n\n```c\nvoid gdImageSetPixel(gdImagePtr im,\
    \ int x, int y, int color)\nvoid gdImageLine(gdImagePtr im, int x1, int y1, int\
