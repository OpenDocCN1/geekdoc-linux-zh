    # ### 3.4 DATA STRUCTURES


    Sometimes we wish to manage a set of variable as a group, perhaps taking all the
    values from a database record and passing the whole record around our program
    to process it. To do this we can group data into structures.


    This program uses a struct to define a set of properties for something called
    a player. The main function contains a declaration and instantiation of an array
    of 5 players. We pass a pointer to each array member in turn to a function to
    rank each one. This uses a switch statement to examine the first letter of each
    player name to make an arbitrary ranking. Then we pass a pointer to each array
    member in turn to a function that prints out the details.'
  - "[PAGE 39]\n\n```\n```c\n/** *****************************************************\n\
    \ * C Programming in Linux (c) David Haskins 2008\n * chapter3_3.c\n * ******************************************************/\n\
    #include <stdio.h>\n#include <string.h>\nstruct player\n{\n    char name[255];\n\
    \    char role[255];\n    int ranking;\n};\nvoid rank(struct player *p)\n{\n \
    \   switch(p->name[0])\n    {\n        case 'P': p->ranking = 4;break;\n     \
    \   case 'H': p->ranking = 1;break;\n        case 'R': p->ranking = 2;break;\n\
    \        case 'J': p->ranking = 5;break;\n        case 'B': p->ranking = 3;break;\n\
    \    }\n}\nvoid show(struct player *p)\n{\n    printf(\"Name:%s Role:%s Ranking:%d<br>\\\
    n\",\n        p.name,p.role,p.ranking);\n}\nint main(int argc, char *argv[], char\
    \ *env[])\n{\n    struct player myteam[5] = { {\"Pele\", \"Striker\",0 },\n  \
    \                      {\"Beckham\", \"male model\" ,0 },\n                  \
    \      {\"Roddick\",\"tennis man\",0 },\n                        {\"Haskins\"\
    ,\"swimmer\",0 },\n                        {\"Jagger\", \"singer\",0 } };\n  \
    \  int i=0;\n    printf(\"Content-type:text/html\\n\\n\");\n    for(i=0;i<5;i++)\
    \ rank ( &myteam[i] );\n    for(i=0;i<5;i++) show ( myteam[i] );\n    return 0;\n\
    }\n```\n```"
