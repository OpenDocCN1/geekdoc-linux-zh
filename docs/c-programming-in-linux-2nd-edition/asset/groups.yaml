    \ separated by an arbitrary character `':'` and use these tokens as strings to\
    \ specify colours and integer numbers to specify the row and cell counts of a\
    \ table.\n\nThe function **atoi** converts a string representation of an integer\
    \ to an integer (\"1\" to 1).\n\nThe function **strtok** is a little odd in that\
    \ the first time you call it with the string name you want to parse, then on subsequent\
    \ calls the first parameter is changed to NULL.\n\nThe **for(...) ** loop mechanism\
    \ was used to do something a set number of times.\n\nThe HTML terms introduced\
    \ were:\n\n- `<html>`\n- `<body>`\n- `<table>`\n- `<tr>` table row\n- `<td>` table\
    \ data cell\n\n### 2.5 DATA AND MEMORY – CONCLUSION\n\nWe have used some simple\
    \ data types to represent some information and transmit input to a program and\
    \ to organise and display some visual output.\n\nWe have used HTML embedded in\
    \ output strings to make output visible in a web browser.\n\nAs an exercise try\
    \ this:\n\nWrite a program to put into your `**/public_html/cgi-bin**` folder\
    \ which can be called in a browser with the **name of a sports team or a country**\
