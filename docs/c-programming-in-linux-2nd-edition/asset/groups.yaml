    \       else if(code1 == '2' && code2== '1')\n                        value[j]\
    \ = '!';\n                }\n                else value[j] = pos1[i];\n      \
    \      }\n        }\n        if(j < size)\n        {\n            value[j] = '\\\
    0';\n        }\n        else value[size-1] = '\\0';\n    }\n}\n```\n\n# 5 使用 MySQL\
    \ 处理数据库\n\n## 5.1 关于不要重造轮子\n\n在每个项目中不从零开始是非常明智的，因此我们在前人（通过这条路径的人）所做的工作基础上进行构建。我们使用的所有\
    \ C 库都是由某人基于更底层的零散部件编写而成的，如果我们要的话，我们可以访问和修改这些代码。这就是开放系统的全部含义。\n\n在实践中，我们只是想使用可靠的服务，我们将要使用的前两个服务无处不在——数据库访问和图形图像生成。\n\
    \n## 5.2 MySQL C API\n\n要访问 MySQL 函数集，我们确保编译器可以访问 MySQL 的头文件和库，并简单地调用一些我们自己无需编写的\
    \ mysql 函数。\n\n在下一个例子中，我们将数据库代码连接到之前的工作上，并将解码后的数据插入数据库，然后读取我们迄今为止存储的内容。\n\n在新的终端窗口中，我们输入：\n\
    \n```\nmysql test\n```\n\n然后：\n\n```\ncreate table CIL (ITEM1 varchar(255),ITEM2\
    \ varchar(255));\n```\n\n这会在 test 数据库（在你的 MySQL 设置中应该已经创建好了）中创建一个供程序写入的表。\n\n\
    如果一切正常，看起来会是这样。\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_54_0.png)\n\n声明的数据类型\
    \ **MYSQL**、**MYSQL_RES** 和 **MYSQL_ROW** 是**预处理器定义**，它们代表 mysql.h 中更复杂的 C 声明，我们只需要知道如何调用它们即可。\n\
    \nMySQL 提供的文档包含了你执行更复杂操作所需的所有信息。\n\n```c\n/******+*****+*****+*****+*****+*****+*****+*****+\n\
    * C Programming in Linux (c) David Haskins 2008\n* chapter5_1.c\n* ++++++++++++++++++++++++++++++++++++++\n\
    */\n#include <stdio.h>\n#include <string.h>\n#include <mysql/mysql.h>\n#include\
    \ \"c_in_linux.h\"\n\nint main(int argc, char *argv[], char *env[])\n{\n\n char\
    \ value1[255] = \"\", value2[255] = \"\", SQL[1024]=\"\";\n int rc = 0;\n\n MYSQL\
    \ *conn = NULL;\n MYSQL_RES *result = NULL;\n MYSQL_ROW row;\n\n printf(\"Content-type:text/html\\\
    n\\n<html><body bgcolor=#23abe2>\\n\");\n strncpy(value1,(char *) getenv(\"QUERY_STRING\"\
    ),255);\n printf(\"QUERY_STRING : %s<BR>\\n\",value1);\n printf(\"<form>\\n\"\
    );\n //call the decode_value function to get value of \"ITEM1\"\n decode_value(\
    \ \"ITEM1=\", (char *) &value1, 255);\n if(strlen(value1) > 0 )\n printf(\"<input\
    \ type=\\\"TEXT\\\" name=\\\"ITEM1\\\" value=\\\"%s\\\">\\n\",value1);\n else\n\
    \ printf(\"<input type=\\\"TEXT\\\" name=\\\"ITEM1\\\">\\n\");\n //call the decode_value\
    \ function to get value of \"ITEM2\"\n decode_value( \"ITEM2=\", (char *) &value2,\
    \ 255);\n if(strlen(value2) > 0 )\n printf(\"<input type=\\\"TEXT\\\" name=\\\"\
    ITEM2\\\" value=\\\"%s\\\">\\n\",value2);\n else\n printf(\"<input type=\\\"TEXT\\\
    \" name=\\\"ITEM2\\\">\\n\");\n printf(\"<input type=\\\"SUBMIT\\\">\");\n printf(\"\
    </form></body></html>\\n\");\n//OPEN DATABASE\n conn = mysql_init(NULL);\n mysql_options(conn,MYSQL_READ_DEFAULT_GROUP,\"\
    /mysqlcap\");\n mysql_real_connect(conn, \"localhost\",\"\",\"\",\"test\",0,NULL,0);\n\
    \ //INSERT IF THERE IS ANY DATA\n if(strlen(value1) >0 || strlen(value2) >0)\n\
    \ {\n sprintf(SQL,\"insert into CIL values ('%s','%s')\",value1,value2);\n rc\
    \ = mysql_query(conn,SQL);\n }\n //READ\n rc = mysql_query(conn,\"select * from\
    \ CIL\");\n result = mysql_use_result(conn);\n while( (row = mysql_fetch_row(result))\
    \ != NULL)\n {\n printf(\"item1=%s item2=%s<br>\",row[0],row[1]);\n }\n\n mysql_free_result(result);\n\
    \ mysql_close(conn);\n return 0; }\n```\n\n都理解了吗？\n\n仅用不到 10 行（高亮部分）C 语言代码，我们就已将数据插入数据库表中，并能再次读取它们，这相当无痛。通过**mysql_init**，我们获得指向\
    \ MYSQL 类型数据结构的指针，然后可以使用它通过**mysql_options**和**mysql_real_connect**连接到 test 数据库，接着我们像在终端会话中那样执行\
    \ SQL 语句。查询结果可以作为 MYSQL_ROW 字符串数组序列通过**mysql_use_result**获取。我们使用**mysql_free_result**释放使用的内存，并使用**mysql_close**关闭数据库。\n\
    \n正如 C 库通常那样，你需要能够理解通常稀疏的文档才能理解函数调用，对于 MySQL 5.1，我们可以在此找到所有这些信息：\n\n<http://dev.mysql.com/doc/refman/5.1/en/index.html>\n\
    \n# MySQL 5.1 参考手册 / 连接器和 API / MySQL C API 包含：\n\n| 函数 | 函数 |\n|---|---|\n| mysql_affected_rows()\
