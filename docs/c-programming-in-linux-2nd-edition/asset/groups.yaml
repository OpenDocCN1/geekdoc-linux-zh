    \ February 2008               *\n/**...****/\n#include <stdlib.h>\n#include <string.h>\n\
    void decode_value(const char *key, char *value, int size)\n{\n    unsigned int\
    \ length = 0;\n    unsigned int i = 0;\n    int j = 0;\n    char *pos1 = \"\"\
    , *pos2 = \"\", code1 = '\\0', code2 = '\\0';\n    \n    strcpy(value, \"\");\n\
    \    if( ( pos1 = strstr(getenv(\"QUERY_STRING\"), key)) != NULL )\n    {\n  \
    \      for(i=0; i<strlen(key); i++) pos1++;\n        if( (pos2 = strstr(pos1,\
    \ \"&\")) != NULL )\n        {\n            length = pos2 - pos1;\n        }\n\
    \        else length = strlen(pos1);\n        for(i = 0, j = 0; i < length ; i++,\
    \ j++)\n        {\n            if(j < size)\n            {\n                if(pos1[i]\
    \ == '%')\n                {\n                    i++;    code1 = pos1[i];\n \
    \                   i++;    code2 = pos1[i];\n                    if(code1 ==\
