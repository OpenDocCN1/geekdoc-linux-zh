    Here we are doing the following:


    +   - asserting that all the character strings we will ever encounter in this
    application will be 255 limited to characters so we **define** this with a **preprocessor**
    statement – these start with #.

    +   - assert that towns are associated with counties, and counties are associated
    with countries some hierarchical manner.

    +   - assert that the population is counted in whole numbers – no half-people.

    +   - assert the location is to be recorded in a particular variant (WGS84) of
    the convention of describing spots on the surface of the world in latitude and
    longitude that uses a decimal fraction for degrees, minutes, and seconds.


    Each of these statements allocates **memory** within the **scope** of the function
    in which it is declared. Each **data declaration** will occupy an amount of memory
    in **bytes** and give that bit of memory a label which is the *variable name*.
    Each data type has a specified size and the *sizeof()* library function will return
    this as an integer. In this case $3 \times 256$ characters, one integer, and two
    floats. The exact size is machine dependent but probably it is 780 bytes.


    Outside the function in which the data has been declared this data is inaccessible
    – this is the **scope** of declaration. If we had declared outside the main()
    function it would be **global** in scope and other functions could access it.
    C lets you do this kind of dangerous stuff if you want to, so be careful.


    Generally we keep a close eye on the scope of data, and pass either **read-only
    copies**, or **labelled memory addresses** to our data to parts of the programs
    that might need to do work on it and even change it. These labelled memory addresses
    are called **pointers**.


    We are using for output the **printf** family of library functions (**sprintf**
    for creating strings, **fprintf** for writing to files etc.) which all use a common
    **format string** argument to specify how the data is to be represented.


    +   - %c character

    +   - %s string

    +   - %d integer

    +   - %f floating point number etc.


    The remaining series of variables in the arguments are placed in sequence into
    the format string as specified.'
