    ### 2.3 字符串可以“意味着”什么\n\n任何事物——赋予**变量**的**名称**及其**含义**或**用途**完全在于观察者的心中。试试这个：\n\
    \n```c\n/****...*****\n * C Programming in Linux (c) David Haskins 2008\n * chapter2_3.c\n\
