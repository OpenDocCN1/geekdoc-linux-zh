    \ colour terms and colours can be also defined by hexadecimal codes such as #FFFFFF\
    \ (white), #FF0000 (red), #00FF00 (green), #0000FF (blue).\n\nThis fun exercise\
    \ is not just a lightweight trick; the idea that one program can generate another\
    \ in another language is very powerful and is behind the whole power of the internet.\
    \ When we generate HTML (or XML or anything else) from a **common gateway interface\
    \ program** like this we are creating **dynamic content** that can be linked to\
    \ live, changing data rather than **static** pre-edited web pages. In practice\
    \ most web sites have a mix of dynamic and static content, but here we see just\
    \ how this is done at a very simple level.\n\nThroughout this book we will use\
    \ the browser as the preferred interface to our programs, hence we will be generating\
    \ HTML and binary image stream web content purely as a means to make immediate\
    \ the power of our programs. Writing code that you peer at in a terminal screen\
    \ is not too impressive, and writing window-type applications is not nearly so\
    \ straightforward.\n\nIn practice most of the software you may be asked to write\
    \ will be running on the web so we might as well start with this idea straight\
    \ away. Most web applications involve **multiple languages** too such as CSS,\
    \ (X)HTML, XML, JavaScript, PHP, JAVA, JSP, ASP, .NET, SQL. If this sounds frightening,\
    \ don't panic. A knowledge of C will show you that many of these languages, which\
    \ all perform different functions, have a basis of C in their syntax.\n\n## 2.4\
    \ PARSING A STRING\n\nThe work involved in extracting meaning or valuable information\
    \ from some kind of input string is called \"parsing\". We will now build another\
    \ fun internet-callable CGI program to demonstrate the power in our hands.\n"
  mdcn: "\n\n在此我们执行以下操作：\n\n- 断言我们在此应用程序中遇到的所有字符字符串都将限制在 255 个字符以内，因此我们通过**预处理器**语句来**定义**这一点——这些语句以\
