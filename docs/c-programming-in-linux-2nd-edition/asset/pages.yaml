- pgno: 48
  md: "First off we can put this function into a separate file called `decode_value.c`\
    \ and create a file for all the functions we may write called `c_in_linux.h` and\
    \ compile all this into a **library**. In the Make file we can add:\n\n```\nSRC_CIL\
    \ = decode_value.c\nOBJ_CIL = decode_value.o\n\n#CII_INCLUDEDES = -L/usr/include/apache2\
    \ -l -L/usr/include/apache2 -l/usr/include/apr-1\n#CII_LIBS = -L/usr/lib/mysql\
    \ -lmysqlclient -L/usr/lib -lgd -L/home/david/public_html/Ventus/code\n\nall:\
    \ lib_cil 4-4\n\nlib_cil:\n\tgcc -c $(SRC_CIL)\n\tar rs c_in_linux.a $(OBJ_CIL)\n\
    \t$(RM) *.o\n\n4-4:\n\tgcc -o logic4 chapter4_3.c c_in_linux.a -lc\n\tcp logic4\
    \ /home/david/public_html/cgi-bin/logic4\n```\n\nThis looks horrible and complex\
    \ but all it means is this: typing “make all” will:\n\n+   - compile all the `*.c`\
    \ files listed in the list OBJ_SRC and into object files `*.o`\n+   - compile\
    \ all the object files into a library archive called `lib_c_in_linux.a`\n+   -\
    \ compile 4-4 using this new archive.\n\nThis is the model we will use to keep\
    \ our files as small as possible and the share-ability of code at its maximum.\n\
    \nWe can now have a simpler “main” function file, and files for stuff we might\
    \ want to write as call-able functions from anywhere really which we do not yet\
    \ know about. All this is organised into a **library file** `(*.a for archive)`\
    \ – these can also be compiled as dynamically loadable **shared objects** `*.so`\
    \ which are much like Windows DLLs. This exactly how all Linux software is written\
    \ and delivered.\n\nFor example the MySQL C Application Programmers Interface\
    \ (API) comprises:\n\n+   - all the header files in `/usr/include/mysql`\n+  \
    \ - the library file `/usr/lib/mysql/libmysqlclient.a`"
