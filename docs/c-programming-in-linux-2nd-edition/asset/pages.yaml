  md: 'Try to describe the process in **pseudocode** of decoding this QUERY STRING:


    ```

    get the QUERY_STRING

    find the search string “ITEM1=” inside it

    look for the end of the value of “ITEM1=”

    copy the value to our “value” variable, translating funny codes such as:

    %621 is ! %623 is #

    ```


    These special codes are generated by the browser so that whatever you put in an
    HTML form will get safely transmitted and not mess about with the HTTP protocol.
    There are lot of them and the task for this chapter is to **finish this task off**
    so that EVERY key on your keyboard works as you think it should!!


    Program chapter4_3.c calls this unfinished function decode_value which this far
    can only cope with the **space** character and ! – it uses **if** and **else**
    and **for** and the library function **getenv**, **strcpy**, **strlen**, **sstr**
    in a piece of **conditional logic** in which a string is analysed to find a specific
    item and this thing then copied into a piece of memory called **value** which
    has been passed to it.


    The result shows the decoded value pasted into the first field;


    ![](img/ad23766cfc9c69ba4f733f8b935cc3d8_50_0.png)'
