  md: "The result in a browser looks like this called with “func1?5;5”.\n\nIn this\
    \ case the arguments to our function are sent as **copies** and are not modified\
    \ in the function but used.\n\nIf we want to actual modify a variable we would\
    \ have to send its pointer to a function.\n\n```\n\"\"\"\n* C Programming in Linux\
    \ (c) David Haskins 2008\n* chapter3_2.c\n\n#include <stdio.h>\n#include <string.h>\n\
    #include <math.h>\nvoid doit(int number1, int number2, double *result)\n{\n  \
    \  *result = sqrt((double)(number1 + number2)) ;\n}\nint main(int argc, char *argv[],\
    \ char *env[])\n{\n    int n1 = 0, n2 = 0, i=0;\n    double result = 0;\n    n1\
    \ = atoi(char *) strtok(argv[1],\";\");\n    n2 = atoi(char *) strtok(NULL,\"\
    ;\");\n    printf(\"Content-type:text/html\\n\\n<html><body>\\n\");\n    for(i=1;i<=100;i++)\n\
    \    {\n        doit(n1+i,n2*i,&result);\n        printf(\"%6f \", result);\n\
    \    }\n    printf(\"</body></html>\\n\");\n    return 0;\n}\n\"\"\"\n```\n\n\
    We send the address of the variable ‘result’ with &**result**, and in the function\
    \ doit we *de-reference* the pointer with * **result** to get at the float and\
    \ change its value, outside its scope inside main. This gives identical output\
    \ to chapter3_1.c.\n\n# ## 3.2 LIBRARY FUNCTIONS\n\nC contains a number of built-in\
