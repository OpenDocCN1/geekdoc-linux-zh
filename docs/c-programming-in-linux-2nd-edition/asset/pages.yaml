  md: '![](img/ad23766cfc9c69ba4f733f8b935cc3d8_31_0.png)


    In this program we take `argv[1]` which here is yellow:blue:5:5; and **parse**
    it using the library function **strtok** which chops the string into tokens separated
    by an arbitrary character `'':''` and use these tokens as strings to specify colours
    and integer numbers to specify the row and cell counts of a table.


    The function **atoi** converts an string representation of a integer to an integer
    ("1" to 1).


    The function **strtok** is a little odd in that the first time you call it with
    the string name you want to parse, then on subsequent calls the first parameter
    is changed to NULL.


    The **for(...) **loop mechanism was used to do something a set number of times.


    The HTML terms introduced were:


    ```

    `<html> <body> <table> <tr> table row <td> table data cell`

    ```


