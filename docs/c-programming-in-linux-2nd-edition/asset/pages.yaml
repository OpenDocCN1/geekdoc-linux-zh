- pgno: 26
  md: "# 2.2 WHAT IS A STRING?\n\nSome programming languages like Java and C++ have\
    \ a string data type that hides some of the complexity underneath what might seem\
    \ a simple thing.\n\nAn essential attribute of a character string is that it is\
    \ a series of individual character elements of indeterminate length.\n\nMost of\
    \ the individual characters we can type into a keyboard are represented by simple\
    \ numerical ASCII codes and the C data type char is used to store character data.\n\
    \nStrings are stored as arrays of characters ending with a NULL so an array must\
    \ be large enough to hold the sequence of characters plus one. Remember array\
    \ members are always counted from zero.\n\nIn this example we can see 5 individual\
    \ characters declared and initialised with values, and an empty character array\
    \ set to \"\".\n\nTake care to notice the difference between single quote marks\
    \ ` used around characters and double quote marks ¶ used around character strings.\n\
    \n```\n/******************************************** */\n* C Programming in Linux\
    \ (c) David Haskins 2008\n* chapter2_2c                          * */\n/********************************************\
    \ */\n\n#include <stdio.h>\n\nint main(int argc, char *argv[], char *env[])\n\
    {\n    char c1 = 'd';\n    char c2 = 'a';\n    char c3 = 'v';\n    char c4 = 'i';\n\
    \    char c5 = 'd';\n    char name[6] = \"\";\n\n    sprintf(name, \"%c%c%c%c%c%c\"\
    , c1, c2, c3, c4, c5);\n    printf(\"%s\\n\", name);\n    return 0;\n}\n```\n\n\
    Compile with gcc -o data2 chapter2_2c -lc"
  merge: -1
  img_proc: true
