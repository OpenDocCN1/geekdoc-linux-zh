- pgno: 58
  md: "# # 6 GRAPHICS WITH GD LIBRARY\n\nThe ability to generate interesting images\
    \ dynamically to suit the situation is an enjoyable, challenging, and rewarding\
    \ type of programming. We will be using Thomas Boutell's GD C library which has\
    \ been around for many years as an open systems project.\n\n# ## 6.1 GENERATING\
    \ BINARY CONTENT\n\nHere we create an image and print into it the value of the\
    \ TEXT= part of the QUERY STRING and set our content type to image/gif. The **gdImageGif**\
    \ function writes the binary image out to **stdout** which is the output stream\
    \ instead of to a file, so binary image data is sent back to the browser.\n\n\
    ```\n```\n/*************************************************************************\n\
    \ * C Programming in Linux (c) David Haskins 2008\n * chapter6_1.c           \
    \                        *\n/************************************************************************/\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <gd.h>\n\
    #include <gdfonts.h>\n#include \"c_in_linux.h\"\nint main(int argc, char *argv[],\
    \ char *env[])\n{\n    int text=0,background=0,height=50,width=0;\n    char value[255]\
    \ = \"\";\n    gdImagePtr im_out = NULL;\n\n    decode_value(\"TEXT=\", (char\
    \ *) &value, 255);\n    width = ( strlen(value) * 10 ) + 5;\n    im_out = gdImageCreate(width,height);\n\
    \    background = gdImageColorAllocate(im_out, 255,0,255);\n    text  = gdImageColorAllocate(im_out,0,0,255);\n\
    \    gdImageFilledRectangle(im_out, 0,0, width-1, height-1, background);\n   \
    \ gdImageString(im_out,gdFontGetSmall(),10,5,(unsigned char *)value,    text);\n\
    \    printf(\"Content-type: image/gif\\n\\n\");\n    gdImageGif(im_out,stdout);\n\
    \    gdImageDestroy(im_out);\n    return 0;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The program produces this output when called with cgi-bin/gdgraph1?TEXT=DavidHaskins


    ![](img/ad23766cfc9c69ba4f733f8b935cc3d8_59_0.png)


    While this is not the most fancy or attractive excise but does at least demonstrate
    the key principles involved in generating graphical output. With the GD library
    you can load existing images and generate them in many formats such as **GIF**,
    **JPEG**, **PNG**, **WMBP** and even create **animated GIFS**.


    If you have used PHP development tools you will recognise the GD library functions
    as they are pretty well identical showing that PHP is a wrapper in this case around
    the same C library.


    The text displayed here is using one of the internal fonts, Tiny, Small, Medium
    Bold, Large and Giant which are adequate for simple labelling but you can also
    use TrueType fonts for more attractive output.


    Geometric drawing with lines or certain styles, filled and open polygons, and
    circles, arcs can be created. The main thing to remember is that the origin of
    an image is the **TOP left hand corner** which might seem unintuitive to anyone
    who has studied mathematics – quite why this is I have never discovered but can
    only imagine that the first programmer to do anything in this area happened to
    not know about graphs in which we think of the origin x=0, y=0 as being at the
    bottom left hand.


    Colours are specified as RGB values in the range 0 to 255 so that white is 255,255,255
    and red is 255,0,0. To work out fine-grained hues use a graphics tool like GNU
    GIMP which has colour pickers so you can find out subtle RGB values. Palettes
    of colours from one image can be used in another and the closest colour in a palette
    requested or created if there is space for it to be allocated.'
  merge: -1
  img_proc: true
