  md: "In plain English this means:\n\nThe function called “main”, which returns an\
    \ integer, takes two arguments, an integer called “argc” which is a count of the\
    \ number of command arguments then *argv[] which is a list or array of pointers\
    \ to strings which are the actual arguments typed in when you run the program\
    \ from the command line.\n\n# **Some Definitions:**\n\n**function**: a block of\
    \ program code with a **return data type**, a name, some arguments of varying\
    \ data types separated by commas, enclosed in **brackets**, then the body of the\
    \ function enclosed in **curly brackets**, each statement ending with a **semi-colon**.\n\
    \n**integer symbol int**: a counting number like 0,1,2,3,4,5.\n\n**list, array\
    \ symbol []**: a sequence of things of the same kind in a numbered order.\n\n\
    **pointer symbol \\***: a memory address locating the start of piece of data of\
    \ a certain type.\n\n**string or char \\***: a pointer to a sequence of characters\
    \ like 'c', 'a', 't' making up “cat”. A character string ends with s special character\
    \ NULL or '\\0' ascii value 0 or hex 00\n\nLet’s rewrite the program to see what\
    \ all this means before we start to panic.\n\n```\n```\n /*************************************************\n\
    \ C Programming in Linux (c) David Haskins 2008\n chapter1_2.c\n *************************************************/\n\
    \ #include <stdio.h>\n\n int main(int argc, char *argv[])\n {\n int i=0;\n printf(\"\
    Hello, you are learning C!\\n\");\n printf(\"Number of arguments to the main function:%d\\\
    n\", argc);\n for(i=0; i<argc; i++)\n {\n printf(\"argument number %d is %s\\\
    n\", i, argv[i]);\n }\n return 0;\n }\n```\n```\n\nSave the text as **chapter1_2.c**\
    \ in the same folder."
