  md: '# 1.5 HELLO WORLD CONCLUSION


    We have seen that a simple program with a tiny bit of input and some output is
    in fact extremely powerful in that it reveals and exposes the inner workings of
    a great deal of our computer.


    Even though we have just begun we have encountered many of the key concepts we
    will use over and over again:


    +   - functions and arguments

    +   - Numbers (integers) and character strings as data types

    +   - Lists or arrays

    +   - Loops using “for” and “while”


    We have made a deliberate big leap from writing a program that runs simply in
    a “terminal screen” to one which will be visible over the internet in a browser.


    The reason for this is that the process of writing programs that interact with
    users in windowing systems like Windows, Gnome or KDE is extremely complex and
    not something you will be asked very often to do .


    The internet browser has become the de facto interface mode for almost everything
    we do these days so we might as well understand using it from the start.


    In all the successive chapters we will follow this model: starting off with some
    basic technique then applying it to a web-based system.


    In practice there is not much real-world C common gateway interface programming
    going on but there is a great deal of C and C++ based code running as Apache modules
    and Microsoft IIS ISAPI Dlls. Perhps not many know that much of Ebay is written
    in C / C++.


    Why? It is as fast as things get and their business with the bargaín snipers in
    a global real-time market needs this lightning fast core, so there is no other
    way to get that performance.'
  merge: -1
  img_proc: true
