- pgno: 68
  md: "```\n#include \"http.h\"\n#include \"http_config.h\"\n#include \"http_protocol.h\"\
    \n#include \"ap_config.h\"\n\n/* The sample content handler */\nstatic int labelmaker_handler(request_rec\
    \ *r)\n{\n  if (strcmp(r->handler, \"labelmaker\")) {\n    return DECLINED;\n\
    \  }\n  r->content_type = \"text/html\";\n\n  if (!r->header_only)\n    ap_rputs(\"\
    The sample page from mod_labelmaker.c\\n\", r);\n  return OK;\n}\n\nstatic void\
    \ labelmaker_register_hooks(apr_pool_t *p)\n{\n  ap_hook_handler(labelmaker_handler,\
    \ NULL, NULL, APR_HOOK_MIDDLE);\n}\n\n/* Dispatch list for API hooks */\nmodule\
    \ AP_MODULE_DECLARE_DATA labelmaker_module = {\n  STANDARD20_MODULE_STUFF,\n \
    \ NULL,          /* create per-dir    config structures */\n  NULL,          /*\
    \ merge per-dir    config structures */\n  NULL,          /* create per-server\
    \ config structures */\n  NULL,          /* merge per-server config structures\
    \ */\n  NULL,          /* table of config file commands        */\n  labelmaker_register_hooks\
    \ /* register hooks            */\n};\n```\n\n# ### 7.2 ADDING SOME FUNCTIONALITY\n\
    \nNow we can plug in the work we did for the graphics library in Chapter 6 as\
    \ a replacement handler function (in the code Chapter7_1.c there are BOTH handlers,\
    \ one commented out). Note the (highlighted) call to a modified decode_value function\
    \ that uses the r->args pointer to get the QUERY_STRING rather than getenv().\
    \ Also Apache handles the output a bit differently too – get get a pointer to\
    \ the array of bytes in the image by calling gdImageGifPtr then the ap_writev\
    \ function outputs the data. We have to free the pointer with gdFree after the\
    \ output call."
