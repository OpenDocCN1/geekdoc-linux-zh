- pgno: 44
  md: 'Here we display the **QUERY_STRING** which is what the program gets as the
    entire contents of an HTML form which contains NAME=VALUE pairs for all the named
    form elements.


    An HTML form by default uses the **GET** method which transmits all form data
    back to the program or page that contains the form unless otherwise specified
    in an action attribute. This data is contained in the QUERY_STRING as a series
    of variable = value pairs separated by the & character.


    > Note that in HTML values of things are enclosed in quotation marks, so to embed
    these inside a C string we have to “escape” the character with a special sign
    \ like this “\"ITEM1\"” . Also we are using “\n” or explicit new line characters
    at the end of each piece of HTML output, so that when we select “view source”
    in the browser we get some reasonably formatted text to view rather than the whole
    page appearing as one long single line.


    Calling this program in a browser we see a form and can enter some data in the
    boxes:


    ![](img/ad23766cfc9c69ba4f733f8b935cc3d8_44_0.png)


    And after submitting the form we see:


    ![](img/ad23766cfc9c69ba4f733f8b935cc3d8_44_1.png)


    To make much sense of the QUERY_STRING and find a particular value in it, we are
    going to have to *parse* it, to chop it up into its constituent pieces and for
    this we will need some **conditional logic** (if, else etc.) and some **loop**
    to count through the characters in the variable. A basic function to do this would
    ideally be created as this is a task you'
