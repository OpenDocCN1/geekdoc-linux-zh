- pgno: 46
  md: 'A **space** character has become a **+** and **!** has become **%21**.


    This encoding occurs because certain characters are explicitly used in the transmission
    protocol itself. The **&** for example is used to separate portions of the **QUERY_STRING**
    and the space cannot be sent at all as it is.


    Any program wishing to use information from the **HTML** form must be able to
    decode all this stuff which will now attempt to do.


    The program **chapter4_2.c** accomplishes what we see so far. It has a main function
    and a **decode_value** function all in the same file.


    The **decode_value** function takes three arguments:


    +   1. the name of the value we are looking for \*“ITEM1=”\* or \*“ITEM2=”\*.

    +   2. the address of the variable into which we are going to put the value if
    found

    +   3. the maximum number of characters to copy


    The function looks for the start and end positions in the **QUERY_STRING** of
    the value and then copies the characters found one by one to the value variable,
    adding a **NULL** character to terminate the string.'
  merge: -1
  img_proc: true
- pgno: 47
  md: "```\n/*********************************************************\n * C Programming\
    \ in Linux (c) David Haskins 2008\n * chapter4_2.c                           \
    \     *\n *********************************************************/\n#include\
    \ <stdio.h>\n#include <string.h>\n\nvoid decode_value(const char *key, char *value,\
    \ int size)\n{\n    int length = 0, i = 0, j = 0;\n    char *pos1 = '\\0', *pos2\
    \ = '\\0';\n    //if the string key is in the query string\n    if( pos1 = strstr((char\
    \ *) getenv(\"QUERY_STRING\"), key)) != NULL )\n    {\n        //find start of\
    \ value for this key\n        for(i=0; i<strlen(key); i++) pos1++;\n        //find\
    \ length of the value\n        if( (pos2 = strstr(pos1,\"&\")) != NULL )\n   \
    \             length = pos2 - pos1;\n        else length = strlen(pos1);\n   \
    \     //character by character, copy value from query string\n        for(i =\
    \ 0, j = 0; i < length ; i++, j++)\n        {\n            if( i < size) value[j]\
    \ = pos1[i];\n        }\n        //add NULL character to end of the value\n  \
    \      if( i < size) value[j] = '\\0';\n                else value[size-1] = '\\\
    0';\n    }\n}\nint main(int argc, char *argv[], char *env[])\n{\n        printf(\"\
    Content-type:text/html\\n\\n<html><body bgcolor=#23a8e2>\\n\");\n        char\
    \ value[255] = \"\";\n        strncpy(value,(char *) getenv(\"QUERY_STRING\"),255);\n\
    \        printf(\"QUERY_STRING : %s<BR>\\n\", value );\n        printf(\"<form>\\\
    n\");\n        //call the decode_value function to get value of \"ITEM1\"\n  \
    \      decode_value(\"ITEM1=\", (char *) &value, 255);\n        if(strlen(value)\
    \ > 0 )\n                printf(\"<input type='TEXT' name='ITEM1' value=\"%s\\\
    t\">\\n\",value);\n        else\n                printf(\"<input type='TEXT' name='ITEM1'>\\\
    n\");\n        //call the decode_value function to get value of \"ITEM2\"\n  \
    \      decode_value(\"ITEM2=\", (char *) &value, 255);\n        if(strlen(value)\
    \ > 0 )\n                printf(\"<input type='TEXT' name='ITEM2' value=\"%s\\\
    t\">\\n\",value);\n        else\n                printf(\"<input type='TEXT' name='ITEM2'>\\\
    n\");\n        printf(\"<input type='SUBMIT'>\");\n        printf(\"</form></body></html>\\\
    n\");\n        return 0;\n}  \n```\n\nIt looks like we are going to have to do\
    \ some serious work on this decode_value package so\nas this is work we can expect\
    \ to do over and over again it makes sense to write a **function**\nthat can be\
    \ **reused**."
