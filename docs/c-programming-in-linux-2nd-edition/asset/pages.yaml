  md: '# 7.3 APACHE MODULES CONCLUSION


    Whilst tricky to write and debug, this is probably the most rewarding and esoteric
    area where you can do real, commercially useful and safely deployable web content
    generation. It is easy to see how this example could be extended with parameters
    for colours and fonts to make a useful web content tool.


    There is very little clear simple material about apache modules but start with
    the on-line documentation at [http://httpd.apache.org/docs/2.2/developer/](http://httpd.apache.org/docs/2.2/developer/)


    One recent book worth looking at is “The Apache Modules Book” Nick Kew, Prentice
    Hall.'
