    # 7.9 Kly and Latex


    Kly is a "K-desktop" variant of Lyx. Both Kly and Lyx are front ends (WYSIWYG,
    running under X-Windows). Latex has been for years the most popular document preparation
    and typesetting program, particularly in academia (with equations, etc.).


    The good news is that even if you do not know Latex, you may still be able to
    use Kly. Think of Kly as a word processor, although its philosophy is different
    from that of other word processors these do, and therefore it may require an adjustment
    of your mindset. Latex (and Kly) philosophy is to type in, define the "styles"
    and leave the formatting to the typesetting program. This means you adjust the
    spacing (between words, sentences, paragraphs, chapter, etc.) manually. When you
    do with your document, you "compile" to create a device independent file (\*.dvi\).
    The dvi file can be viewed by a dvi viewer and printed. The quality of the output
    is usually outstanding, but the process is typically much frustrating than using
    a regular word processor.


    The strength of Latex is the quality of the prints, its capability to cope with
    long, complex documents (technical books, etc.), availability of all foreign characters,
    and its portability across many different platforms.


    Try it out, Kly is free. As almost any piece of Linux software, you can download
    it from Linux:


