  md: 'news:comp.os.misc (miscellaneous)

    news:comp.os.linux.advocacy (Use this one for discussion of pros and cons of Linux
    and perhaps a comparison of Linux with other operating systems. This is an excellent
    newsgroup if you like getting into endless arguments.).

    news:alt.linux.suz (Here you can read/write really opinions on Linux.)

    news:comp.os.linux.networking

    news:comp.os.linux.x (X-windows)

    news:comp.os.unix (general UNIX newsgroup)


    Please note that there is a newsgroup etiquette ("netiquette''), and the major
    points:

    - don''t post on a topic that is unrelated to the subject of the newsgroup;

    - don''t post to many newsgroups at the same time (cross-post);

    - use plain ASCII, don''t post attachments, pictures, html, etc.;

    - don''t advertise (particularly commercial products).


    Useful abbreviations/acronyms:


    | | |

    |---|---|

    | BTW | "By the way," |

    | AFAIK | "As far as I know," (S/he actually know the best, but is being cautious)
    |

    | RTFD | "Read the ''fine'' documentation!" (Impatient and probably rude) |

    | ASAP | "as soon as possible" |

    | FYI | "For your information," (Implying that everybody knows about it. S/he
    cannot mean that it is confidential if s/he puts it in a newsgroup, can s/he?)\
    |

    | IMHO | "In my humble opinion," Many variants are available, also showing other
    faces to express moods. |

    | :-) | |

    | c.o.l.a. | The newsgroup comp.os.linux.announcement (or perhaps comp.os.linux.advocacy?)
    |

    | Tia | "Thanks in advance!" |

    | iirc | "If I remember correctly," |

    | fwiw | "For what it''s worth" (The responder feels that the answer may not be
    a definitive one.) |


    Please tell me if you know of other abbreviations that a newbie Linux administrator
    ought to know.


