    permissions (maybe 0077).


    The numerical way of representing file permissions is called "octal" because the
    numbers have base 8

    (the decimal system base is 10). The highest digit in the system is 7 (octal system
    has eight

    digits: 0 to 7, analog to decimal system having ten digits: 0 to 9). The octal
    representation

    is a convenient notation for the binary representation of file permissions, where
    each permission is

    flagged as "set" or "denied" with a one or zero and the total is represented as
    a string of zeros and\ones, in this diagram:


    ```

    user class: owner group others

    example permissions: rwx rw-- r---

    absent permissions: --x -wx

    binary representation of the binary: 111 110 100

    octal representation: 7 6 4

    ```


    Default file permissions with umask. When a new file is created, it is given default
    permissions.

