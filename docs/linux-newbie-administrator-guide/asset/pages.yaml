- pgno: 116
  md: '(sp status) Display the list of currently running processes with their process
    IDs (PID) numbers. Use "ps axu" to see all processes running on your system (also
    those of other users or without a controlling terminal), each with the name of
    the owner. Use "top" to keep the processes currently running.


    fg PID Bring a background process to the foreground.


    bg PID Send the process to the background. Opposite to fg. The same can be accomplished
    with <Ctrl>z.


    any_command& Run any command in the background (the symbol "&" means running the
    proceeding command in background).


    kill PID Force a process to shutdown. Determine the PID of the process to kill
    us.


    killall Kill program(s) by name.


    program_name (in an xwindow terminal) Kill a GUI-based program with mouse. (Point
