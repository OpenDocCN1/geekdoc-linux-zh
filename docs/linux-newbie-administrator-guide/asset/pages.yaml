    # 3.5 Shell


    # 3.5.1 What is a shell and I want to use a different one?


    A shell is the program that interprets what you type on the command line and decides
    what to do with it. It can also be invoked in a non-interactive way, for example
    to execute a pre-typed list of commands contained in a text file (a ''shell script'').
    Think of a shell as an equivalent of the DOS "command.com" (command-line interpreter)
    and the shell script files as an equivalent of the DOS batch files (*.bat).


    There are several shells available on the Linux system (if you installed them):
    bash (''Bourne Again'' shell), .sh (Bourne shell), csh (C shell, with a syntax
    akin to the "c" programming language), pdksh (public domain Korn shell), tcsh
    (enhanced C shell), ash, zsh, and perhaps a couple more.


    The default shell on my system (and probably on yours) is bash , which is an excellent
    and standard shell, and I cannot see why a newbie myself would want to change
    it. bash is fully backwards-compatible with the Bourne shell (the most popular
    shell on UNIX) incorporates many enhancements and best features from other shells.
    From a newbie prospective, the different shells are included with Linux for historical
    reasons and backwards-compatibility of shell scripts that may require a particular
    shell to run.


    If you want to try another shell, type for example


    ```

    tcsh

    ```


    which will start the enhanced shell. When done, type


    ```

    exit

    ```'
