    mount filesystems and what kind of access is allowed for users. You really want
    to customize it to simplify mounting on your system. Linux default mounting scheme
    is restrictive so to be secure, you may want to remove some restrictions when
    setting up Linux at home.


    # 4.2.7 Mounting command is so long, how can I simplify it with an alias?


    An alias is an abbreviation of a more complex or often used operating system.
    For creating aliases, I as root, the file /etc/bashrc This way the aliases are
    available for all the users on the system. For creating user-specific aliases,
    I edit the file .bashrc in the user home directory.) The relevant part of my /etc/bashrc
    looks like this:


    ```

    alias cdomrom="mount -v /mnt/cdrom"

    alias ucdrom="mount -v /mnt/cdrom"

    alias dosdrive="mount -v /mnt/dosdrive"

    alias udosdrive="mount -v /mnt/dosdrive"

