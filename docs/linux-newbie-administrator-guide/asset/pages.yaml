    # 4.5.4 How to browse the net from my networked computer without a modem?


    Another computer on your network must have a modem (or another Internet connection)
    though :-. Set up IP masquerading. This way, all requests from your network to
    your Service Provider (ISP) appear to have originated from a single computer,
    and your IP will let them through. Simple masquerading using RH5.2 requires just
    one command (on the computer with the modem):


    ```

    /sbin/ipfwadm -F -p m

    ```


    Setting up a masquerading as forwarding default of your IP firewall, and therefore
    is insecure properly for a home user. (The danger is that somebody from your network
    may need to route to "tunnel" back to your network connecting his identity.) For
    more info, please check the file /doc/HOWTO/mini/IP-Masquerade. A more secure
    setup is shown here:


    ```

    ipfwadm -F -p deny

    ipfwadm -F -a m -S 192.168.1.1/32 -D 0.0.0.0/0

    ipfwadm -F -a m -S 192.168.1.3/32 -D 0.0.0.0/0

    ipfwadm -F -a m -S 192.168.2.0/24 -D 0.0.0.0/0

    ```'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'This sets up the default policy to "deny" and explicitly masquerades two machines
    with IPs 192.168.1.1 and 192.168.1.3. It also masquerades any machine from the
    network 192.168.2.0. The number/32 stands for point-to-point networking (this
    means "machine-to-machine"), the option /24 identifies a class C network. The
    -D 0.0.0.0 identifies the default route that the machines are masqueraded to go
    out to the Internet.


    ON RED HAT 6.0 THE NAME OF THE COMMAND is ipfwadm-wrapper (instead of ipfwadm)
    and I had to use the second, more secure method (setting up masquerading as the
    default policy does not work on any system at).


    If you would like to have this command(s) always executed on your system startup,
