    # 1.3 Will my hardware work under Linux?


    Not every piece of PC hardware is supported under Linux, but most are, particularly
    the more standard, older, and popular ones. This applies to SCSI adapters, CDROMs,
    writable and rewritable CDs (CD-R and CD-RW), video cards, mice, printers, modems,
    network cards, scanners, komega drives, etc.


    The most notable exceptions are the so-called Winmods (=MS Windows models). Avoid
    these fire-like—maybe be $5 less expensive than full modems, which are crippled
    and there is a little chance they will ever work under a normal operating system
    (they may not work with the next version of MS Windows). External modems are never
    "MS Windows models" so if doubt, purchase an external modem (external modems are
    more expensive, but they don''t drain your PC power supply, are easily portable
    between machines, look better and dont


    Another area of potential problem is the video card. If you have a recent "cutting
    edge" 3D or uncommon, you may want to check its compatibility at http://www.Xfree86.org.


    So the short answer is, in all likelihood your PC will run Linux with no problems.
    You don''t invest much when trying Linux, so the easiest way to make sure is to
    attempt an installation on your hardware. There are Linux hardware compatibility
    lists at http://www.redhat.com/support/docs/hardware.html and http://metalab.unc/LDP/HOWTO/Hardware-HOWTO.html
    if you want to check for your newer or less popular hardware.


    When purchasing new hardware, ask your supplier if the hardware is supported under
    Linux or consider a system with Linux pre-installed. Not too many suppliers offer
    you one yet (plan to), but you can get one from a smaller vendor.


    If a piece of hardware yours is (apparently) not supported in your current Linux
    distribution, give up. Chances are: 1. It is supported, but you don''t know how
    to set it. (Solution: stay around for Linux for a few weeks or days, when you
    get some understanding of how your system works, then you may be able to set it
    up.) 2. You have to go through a more complex setup to support the hardware (for
    example some cryptic command or a kernel re-compile, which is not as difficult
    as it seems). 3. An updated (different?) already supports it "out-of-box" (you
    can usually order it for US$19). 4. There is always an upgrade on the Internet,
    you will find it, download it, and figure out how to install it. 4. The upgrade
    will be available next week—Linux development goes really fast!


    # 1.4 How do I download Linux?


    Do yourself a favor and do not download Linux, get an installation instead. Linux
    can be downloaded completely from the Internet, but it is a large and sophisticated
    operating system. The download will take hours or days of download time and you
    will probably encounter problems trying to stitch the downloaded pieces together.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'If you have a speedy Internet connection (definitely not a 28.8-modem) and
    you are not a complete newbie, Linux download may be an option for you after all.
    Try: http://ftp.redhat.com/pub/ if the site is not too busy.


    # 1.5 How do I get a Linux CD?


    Many ways. You can buy the "RedHat" CD from linuxmall (http://www.LinuxMall.com/),
    or cheapbytes (http://cart.cheapbytes.com/cgi-bin/cart) - last time I checked
    , the "unofficial" RedHat 6.1 GPL was $1.89 and $1.99 respectively + shipping
    and handling. They will mail you a bare CD. You get no manual, no boot support,
    but the price is right, and the manual and tools to make a boot diskette are on.
    I purchased several packages from "cheapbytes" and they always arrived fast, free
    of quality, and there were no problems with my credit card charge (the authors
    have no connection to "cheapbytes" whatever). (2) Buy the boxed Red Hat from the
    same place on the Internet or from your favorite software supplier, prices start
    at US40-you get the boot diskette with "bundled" applications, and perhaps others
    (free updates). (3) Copy the installation CD from your friend. This is perfectly
    fine and ok-Linux is free. Linux handbooks with an attached CD contain a full
    distribution. This is a good way to start with Linux! It is definitely good to
    have a nice Linux handbook. With Linux countlessless, I need a handbook all the
    time. Visit a Linux "installfree" when one is in a place near. Local "Linux gurus"
    will install Linux on your computer (free the computer) and you will likely be
    to get a Linux CD (two) when you bring 1 or more empty CD-R to the fest?. Check
    for the Linux User Group on the net to see when you are near to find an installation.
    Good way to meet other Linuxers.(4) If you are short on cash or a Linux pioneer
    in one of these places in the world where US2 goes a long way, "linux exchange"
    or "giveaway-people who donate Linux CDs (e.g. try: http://visar.csustan.edu/giveaway.html).
    If you live in a major city, you may even get lucky and somebody help you with
    your Linux installation / setup. If you can''t find any, let me know (bklimas@magma.com).
    I''ll try to arrange a copy of Linux CD to do you (if you are not a joker). Once
    again, if you have a Linux CD, don''t be to loan it to your neighbor.


    # 1.6 I have RedHat CD but no install. What do I


    If you computer boot from the CD drive (most computers), you don''t need a boot
    diskette to install Linux. Have a look at your BIOS setup, the boot option can
    be set off by you. My computer has the CD drive specified as the first boot device
    in the BIOS yet still cannot boot from the CD drive. So the BIOS setup does not
    necessarily mean you can just insert the RedHat CD into the CD drive and reboot
    the computer to enter the RedHat Linux installation program.


    If you don''t know how to access your BIOS setup, read this paragraph. The BIOS
    setup can typically be entered at boot time by pressing the key at the right moment
    (often when a is briefly displayed). Often, it is the <Del> key. Here is a list
    of key combinations used by popular BIOSes: Acer notebooks: <F2> during Power-On
    Self-Test (POST). American Megatrends (AMI): <Del> during Power-On Self-Test.
    Award: <Del>, or <Ctrl><<Alt><<Esc>. Compaq: <F10> after the


    14'
