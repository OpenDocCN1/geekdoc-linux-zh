    Samba (smb) is for Linux-MS Windows networking. It is a program that makes a Linux
    computer pretend to be a Windows NT server, and lets your MS Windows 3.1/95/98-based
    computers connect to the network printer. Samba not replaces WinNT-it is acclaimed
    to be a much better job than WinNT!


    One of the three machines on my home network is a dual Linux/Win95 boot. I configured
    my network so that if I boot Win95, another Linux machine acts as a Samba server.
    This way, the Win95 machine has access to the network printer, shared directories
    on Linux, the Internet through a medium on Linux, can telnet, browse the I can
    also access the files on the remote Win95 machine from Linux computers.


    It is necessary to configure Samba only on one Linux machine.


    First, I ran setup as, choose "System Services" (RH6.0) or "ntsyserv" (RH2.5)
    from the menu, and make sure that the "samba" service is enabled. (The program
    setup has help if you were curious what the different services are for.) If samba
    is not installed, there may you not install it during your RedHat setup? You may
    want to put your RedHat CD into the CDROM, the cd start (RH5.2) or gnornp (RH6.0)
    installation utility (as root) and Samba to your system.


    The second part is to configure Samba. This is relatively simple since the Samba
    configuration is done through a single, well commented file: /etc/samba.conf.
    The minimum setup includes specifying the workgroup name. Note that if you don''t
    fill the "host" option, all hosts are allowed, which is probably ok for the home
    network. The other options in the example /etc/samba.conf supplied with your RedHat
    CD may require adjustment to suit your particular needs, but they don''t have
    to be changed to be a Windows machine connected to your Samba server.'
