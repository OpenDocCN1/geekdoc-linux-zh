    # 7.10 Writing CD-Rs (cdrecord and cdparanoia)


    Disclaimer: Copying copyrighted material is illegal. Do NOT use the instructions
    below for anything illegal.


    # INTRO


    Setting up a CD writer can be tricky. For good info see the http://www.guug.de/~wenni/linux/cdr/html/CD-Writing-3.html.


    I used the above document to set a cheap, no-name IDE-ATAPI CD writer on a PC
    running

    RH6.0. It works, and no changes to my setup were required after the recent upgrade
    to RH6.1.

    Here are the steps I followed (almost everything to be done as root):'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# SETUP


    In the file /etc/lilo.conf add a line at the end of the Linux "image" section:


    append="hdb=ide-scsi",


    Adjust the line above if your CD writer is not "hdb" (second drive on the first
    IDE interface). It makes your IDE-ATAPI CD-W(R) to be seen on your Linux system
    as a SCSI device. (It is not really a SCSI device, it is an IDE device, it pretends
    to be SCSI.) Run lilo after making any changes to /etc/lilo.conf. The change above
    is necessary to be able to enable SCSI on IDE-ATAPI CD-R(W) if you use Linux kernel
    2.2.x.


    +   Add the loop devices to the /dev/ directory. This is not an obligato, but
    a nice feature you can enjoy creating your own CDs. The loop device will let you
    mount a CD image (if it was already a filesystem) to inspect its content. The
    loop devices don''t exist on my hard drive after Linux RedHat installation, so
    I create them:


    ```

    cd /dev/

    .MADEV loop

    ```


    +   Add two lines at the end of the file /etc/rc.d/rc.local so that the needed
    kernel modules are automatically loaded on system setup:


    ```

    /sbin/insmod ide-scsi

    /sbin/insmod loop

    ```


    These two kernel modules are needed for SCSI emulation of IDE drives and to support
    the loop devices, respectively.


    +   Create or modify the device /dev/cdrom so it now points to the correct device
    , most likely:


    ```

    ln -s /dev/sr0 /dev/cdrom

    ```


    You need to do this because your "dev/cdrom" pointed to an IDE device (probably
    /dev/hdb) but now these changes your CD-R is going to SCSI emulation mode.


    +   Reboot the system to /etc/lilo.conf can take effect. Check if your CD-R(W)
    still works properly for normal reading.


    +   Download the "cdrecord" from your favorite Linux software repository (e.g.,
    httpfdirect.linux.org/). Then install the source code, compile it, install the
    program, and make symbolic links that are easy to run (the installation would
    be much easier if you found a binary *.rpm file):


    ```

    cd /usr/local

    tar -xvzf /the_path_to_which_you_downloaded/cdrecord-1.6.1.tar.gz

    ls

    cdrecord-1.6.1

    make

    ```'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'make install

    ls /opt/schily/bin/

    ln -s /opt/schily/bin/* /usr/local/


    The program cdrecord is a spartan, command line utility for writing CD. There
    are several GUI front ends to it, but they will be useless if the underlying cdrecord
    does not work properly.


    +   * See if your cdwriter is recognized. If it is, it should now show in the
    output from this command:


    cdrecord -scanbus


    # Data CDs


    +   * Create a CD image containing your data:


    mkisofs -o cd_image input_data_directory


    This makes an International Standard Organization (ISO) standard 9660-type filesystem
    containing the files from input_data_directory, which writes the files to an ordinary
    file on the hard drive. This output is an image "-r" sets the file permissions
    so all the files on the CD are publicly readable (can be read by all user, not
    only the file owner). The option "-o" indicates the parameter that follows the
    output filename (the "CD image). The filenames are abbreviated to "8.3" DOS-type
    length, since Linux supports called "Rock Ridge" extensions to ISO9660, it also
    writes the names and all the file permissions as well-this the new filesystem
    is portable across all popular operating systems (DOS, Windows, Linux, UNIX,--completely
    convenient to the user.


    +   * You may want to check the CD image by burning it through the loop device:


    ```

    mount -t iso9660 /dev/loop0 cd_image /mnt/cdrom

    [now the content of the file should appear in /mnt/cdrom]

    cd /mnt/cdrom

    [inspect the file mounted through the loop device]

    ```


    When done with inspection, change your working directory away from the mountpoint
    and unmount the file:


    ```

    cd

    umount /mnt/cdrom

    ```


    +   * If everything worked, you may burn your data CD:


    cdrecord -v speed=2 dev=1,0,0 -data cd_image


    The numbers in "dev" stand for the scsi bus number (the first one is 0, second
    is 1, ...), device id on the scsi bus (between 0 and 7), and the scsi lun number
    (always 0) respectively. You must customize them: the first two number can be
    read in the output from cdrecord -scanbus, the third number is 0. Make sure to
    use the correct numbers or to write to a wide drive and corrupt your data.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'The timing of writing to CD-Rs is very important, or an error may occur (the
    laser cannot be switched on and off at will). Therefore avoid doing intensive
    tasks when creating a CD, e.g. don''t create or erase large files on the hard
    drive. My system will not permit me to start new tasks using cdrecord.


    # AUDIO CDs


    +   - Audio tracks have to be in files of *.cdr (I guess it is the same as *.cdda.raw),
    *.wav (wave), or *.au format before you can write them to a CD.

    - The utility sox converts between the various audio file formats (sox converts
    quite a few of them). For example, this will convert a .wav file to a .cdr file:


    ```

    sox my_file.wav my_file.cdr

    to do the conversions manually - cdrecord supports *.wav and *.au directly (it
    is a conversion from *.wav or *.au to *.cdr "on the fly”). This is very convenient
    because audio files tend to be large.

    ```


    +   - CDs don''t contain a filesystem, they store "raw data". This means you cannot
    mount an audio CD. Also, each track is written separately, i.e., as if it were
    a different "partition" on the CD.

    - To read audio tracks from an audio CD and write them to a suitable file on your
    hard drive (typical format is *.raw or *.wav), you need a "cd ripper". A popular
    CD ripper is "cdparanoia". After downloading the source for cdparanoia, install
    it (use the autocompletion <Tab> shortcut when typing the long filenames):


    ```

    cd /usr/local

    tar -xzf

    /the_path_to_you_downloaded/cdparanoia-III-alpha9.6.src.tgz

    ls

    cd cdparanoia-III-alpha9.6

    ./configure

    make

    make install

    ```


    The installation program places a proper link to the executable

    (/usr/local/bin/cdparanoia) so I don''t have to create the link manually.


    To rip the first track from an audio CD, I can use:

    cdparanoia 1


    which will put the first track from the CD into the wave file "cdda.wav" in the
    current directory.


    To rip tracks 1 to 2 from an audio CD to a .raw file format, I can use:'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'cdparanoia -B -p "1-2"


    The option -B specifies to use a "batch" mode, so that each track is put into
    a separate file (this is probably what you would want, otherwise all tracks would
    be placed in one output file. The "-p" option specifies output in raw format.
    The files are named track1.cdda.raw and track2.cdda.raw.


    To rip all tracks from an audio CD, each track to a separate *.wav file, while
    forcing reading speed 4x, I can use:


    ```

    cdparanoia -S 4 -B "1-"

    ```


    Make sure you have sufficient free space on your hard drive. You can use the space
    on your DOS partition (if you have dual boot).


    +   To write audio files to a CD-R(W), I can use:


    ```

    cdrecord -v speed=2 dev=1,0,0 -audio*

    ```


    +   Old stereo will not play many CD-Rs (this is connected to the size of the
    pits on the CDs). My home stereo cannot read re-writable CDs (CD-RW) at all, however
    it will read-once disks (CD-Rs), re-writables may be good to store data but for
    audio (unless I plan to play them exclusively on my computer).


    # MIXED-MODE CDs


    +   Mixed-mode CDs (it is CDs that contain both data and audio, often game CDs)
    are not problems, e.g.:


    ```

    mount -t iso9660 /dev/cdrom /mnt/cdrom (mount a mixed-mode CD)

    mmkisofs -r -o cd_image /mnt/cdrom (make an ISO filesystem from the CD).

    ```


    ```

    umount /mnt/cdrom (unmount the CD)

    cdparanoia -S 4 -B "2-" (rip the content of all audio tracks on the CD)

    cdrecord -v speed=2 dev=1,0,0 cd_image -audio* (write the data and audio files)

    ```


    # OTHER ISSUES


    +   Re-writable CDs (CD-RW) are used the same way as regular write-once CDs (CD-R),
    but you have to blank re-writable disks before you will be able to re-use them,
    e.g.:


    ```

    cdrecord -v speed=2 dev=1,0,0 blank-fast

    ```


    To see other (more thorough and slower) options for blanking, use:'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'cdrecord blank=help


    To simplify writing long commands required by cdrecord, I may define a global
    alias by placing the following line in the file /etc/bashrc:


    ```

    alias cdrecord="cdrecord -v speed=2 dev=1,0,0"

    ```


    Re-login for the changes in /etc/bashrc to take effect. After creating this alias,
    I can record a CD using the shortened command (no need to specify the CD writer
    speed and device name all the time):


    ```

    cdrecord -audio track*

    ```


    Most CDs can be copied by copying all data (for data CDs) or all tracks (for audio
    CDs) onto the hard drive as described before, but some CDs cannot. For troublesome
    CDs, you might try something like:


    ```

    dd conv=noerror,notrunc if=/dev/cdrom of=cd_image

    cdrecord -t audio cd_image

    ```


    The dd command copies the input file (if), which in this case is the device /dev/cdrom
    to the output file (of) which in this example is a file called cd_image (on the
    hard drive in the current working directory). The option "conv=noerror,notrunc"
    specifies that the potential reading errors to be ignored, and files not truncated
    on an error. The second command copies the file cd_image that was created by the
    dd command onto an empty CD.


