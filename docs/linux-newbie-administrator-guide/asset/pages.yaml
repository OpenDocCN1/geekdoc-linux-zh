    # 3.2.2 About password security


    Weak passwords are probably the most common source of security problems. Even
    at home, you may expose yourself to trouble if somebody is able to hack your computer
    when you browse the Internet and read your files. Here are some examples of hazardous
    passwords:


    +   - no password (possible!)

    - the word "password" (wow, this one is really weak!)

    - your first or last name or your user name

    - name of wife (husband), daughter, girlfriend, dog, etc;

    - name of company, department, actually, etc.

    - date of your birth;

    - password written in the calendar or on your computer;

    - any word which is in the dictionary (the dictionary does not contain so many
    words as it might seem, a skilful hacker can set up a program to try them all);

    - a password which you also use in an insecure public place, for example an Internet
    store or a mailing list.


    A good password is relatively long (minimum 6 letter), contains a mixture of letters
    (upper and lower case, if possible) and numbers, and is changed regularly (8 weeks?).


    The system administrator can set the password policy through the utility included
    in this configuration program (run as root):


    ```

    linuxconf

    ```


    under the menu "user account"- "policies":"password" & account policies."


    Also make sure that any file that contains a password (e.g., /root/.kde/share/config/kpprc)
    has proper secure permissions so that it cannot be read by anybody. Most likely
    you want:


    ```

    chmod 600 kpprc

    ```


