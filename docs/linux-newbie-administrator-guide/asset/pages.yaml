  md: '# 5.5 Should I have a choice to download either the patch or the full source.


    Now you have a choice to download either the patch or the full source.

    If you''re upgrading from 2.0x kernel series you will have to download the full
    source.

    If you''re upgrading to a 2.2.x kernel series you can download only the patch,
    which is of course smaller than the full source. The patch contains only the differences.

    If you would like more detailed info on patches and take a look at this link:

    http://www.linuxpower.org/display_item.html?id=101 .

    Now grab your choice and download it. I highly suggest you download it to /usr/src/
    directory.

    I suggest downloading the file with the .tar.gz extension (if you''re downloading
    the full source).

    For patches I suggest .bz2 extension. Please note that the examples which follow
    will be based on this decisions (about file types).


    # 5.6 Unpacking the download file


    # 5.6.1 Unpacking the patch


    We are assuming that you downloaded the patch to /usr/src/ directory. For our
    example lets say the filename is patch-2.2.12.bz2. Before using it we must first
    unpack it .bz2 extension is bunzip2 format. By using the following command to
    unpack the file:


    ```

    command =

    bunzip2 patch-2.2.12.bz2

    ```


    No visual output will be shown. Check what files are located in the directory
    now. You will notice that the patch-2.2.12.bz2 is gone and patch-2.2.12 is there
    of a bigger size.


    # 5.6.2 Unpacking the full source


    Again we are assuming that you downloaded the full source into /usr/src/. For
    our example lets say the source filename is linux-2.2.12.tar.gz.

    in /usr/src/ you have a symbolic link named linux which points to for example
    at linux-2.0.36. Before even unpacking it we must first do something else. In
    /usr/src/ you How can you check that out? Type ls

    al in the /usr/src/ directory. You''ll see something like this:


    ```

    total 7295

    drwxr-xr-x 5 root root 1024 Mar 19 15:01 :

    drwxr-xr-x 20 root root 1024 Mar 13 22:52 ..

    lrwxrwxr-x 1 root root 11 Mar 15 18:21 linux->linux-2.0.36

    drwxr-xr-x 17 root root 1024 Mar 13 22:52 linux-2.0.36

    ```'
  merge: -1
  img_proc: true
- pgno: 104
  md: '<= end of page =>


    Notice the lrwxrxwwx 1 root root 11 Mar 15 18:21 linux -> linux-2.0.36 which is
    the symbolic linking point to your linux-2.0.36 directory.


    If we would unpack the kernel source now, by default it would be unpacked into
    the linux directory overwriting our previous source.


    Lets delete the link by typing rm linux. It removes only the link, not the directory!

    Now unpack the source. Type tar -xzf: linux-2.2.12.tar.gz. Lots of text will fly
    by. If you do a -al now you''ll notice the linux directory. That is our new kernel
    source directory.


    # ## 5.7 Compiling new kernel


    # ### 5.7.1 Using the patch


    If you downloaded the patch you will need to go that you are located in /usr/src/
    directory. We have unpacked the patch (Section 5.6.1). We will now move to the
    kernel directory (assuming linux). Type cd linux.


    Now we are located in the kernel directory. We have a lot of options and questions.
    Is your first patch of the kernel? No? We won''t go into details and we will assume
    that this is your first patch kernel. We are now to patch the kernel.


    To do this we will use the patch utility. For more detail and wider information
    about this I suggest checking out the article from the www://www.linuxpower.org
    web site, at this url: http://www.linuxpower.org/display_item.html?id=101


    Type patch -p1 /patch-2.2.12


    Lots of text will fly by. If it fails it will stop anywhere but only at the end
    (otherwise it will ask you a question) everything went ok. If not, then you might
    have a problem (you already patched a kernel, or something went really wrong).

    Everything went ok on. Now it''s time to configure the kernel and compile it.
    We now have 2 choices. One is to compile the new kernel from scratch, the other
    is to re-compile it using the old configuration. Since you are assuming that you''re
    gonna compile with the old configuration. If you don''t want, read section 6.2
    where you should use the steps there follow. The only difference is in step 1,


    This is the re-compile of the kernel using the old configuration. Follow these
    steps:


    +   1. type makeconfig


    At this point you could have been asked for new drivers and development ones.
    Unless you really need them answer (n).


    +   2. type make de


    +   3. type make clean


    +   4. type make Image (if this fails be bImage, which stands for big zImage)


    +   5. type make modules (if you enabled them)


    +   6. type make modules_install (if you typed #5)


    101'
