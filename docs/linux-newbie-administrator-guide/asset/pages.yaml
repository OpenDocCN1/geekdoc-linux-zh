- pgno: 19
  md: '# 1.7 What do I need to read before installation?


    You may want to read the RedHat manual. If you don''t have the printed copy, an
    html version is on your CD so you can read it using any web browser, e.g. Netscape
    for Windows. Look here to see how to access this manual and some additional reading
    material.


    It is also helpful to get some UNIX orientation if you don''t have any. A good
    Linux manual or your Unix behold. Almost all basic commands will run under Linux.
    Manuals for MS Windows are useless (click this, click that), manuals for Linux/Unix
    are typically great (giving you an understanding of the system, a lasting benefit).


    You may want to learn about your hardware: how many and what size drives have,
    the type, number, and size of all partitions on each drive, where are your DOS/Windows
    partitions, which one is the DOS/Windows boot partition (if you plan to have dual
    boot), what type of mouse you have, what video card and how much memory, monitor
    (max synchronization frequencies), etc.


    Go to BIOS to see the number and geometry of your drives. Run DOS "idisk" to display
    your hard drive(s) partition table(s). Switch your system to learn about the type
    of video card and the amount of video memory. Boot MS Windows, to the control
    panel-devices and write down the sound card, network card types and settings (name,
    type, IRQ, i/o address, DMA channel). Read the label underneath to see the type
    of mouse you have. (Next time you buy a mouse, get a Linux-2-3 Logitech or Linux
    makes use of all buttons). Dust off your monitor manual to find the maximum synchronization
    frequencies (vertical and horizontal) that your monitor supports. Never use frequencies
    off the monitor specification—this may damage your monitor.


    # 1.8 Can I have MS Windows and Linux installed on the same computer?


    Yes, you can. Many Linux use dual boots. This is typically achieved by installing
    MS Windows on one hard drive partition and Linux on another partition. Linux comes
    with a simple boot manager LILO, which will let you choose at the boot time the
    operating system you boot. Install MS Windows first and only afterwards else MS
    Windows installation program will disable your access to Linux. Have a boot floppy
    ready if you need to re-install MS Windows–MS will surely disable your access
    to Linux and you will have to boot from the floppy and re-run the command lilo
    to get back to business.


    From Linux, you will be able to read and write to your MS Windows partitions so
    that data exchange between MS- and Linux-based program is seamless. You will also
    be able to use your existing MS Windows-based resources: sound files, backgrounds,
    pictures, fonts, etc. (First check if it does not violate your license agreement
    :-) For products that are rent to you from Microsoft, it probably would. With
    my Linux computers, I am proud to have no pirated software on my system whatsoever.)'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.9 How do I partition my hard drive?


    If you plan a dual boot (Linux and MS Windows on the same computer), first use
    your DOS/Win utility FDISK to make the MS Windows partition(s). Leave a part of
    the hard drive(s)unpartitioned for Linux. You will make and format the Linux partitions
    during RedHat installation. Make the MS Windows partition "primary" and "bootable".
    Install, configure, and test your MS Windows before Linux installation. If you
    want to run Linux only, you need just clean hard drive (no partitions) to start
    with.


    It is possible to have only one Linux partition (plus one for MS Windows if you
    dual-boot). But it is better to have more partitions so you can keep users'' data
    from the rest of the operating system. This, if something goes wrong and you want
    to format and reinstall the operating system, you don''t lose your users'' data.
    (You can however do a Linux re-install without losing the contents of the /home
    directory that contains all user data if you skip the "re-format" option given
    to you installation.)


    During the Linux setup, you will be asked to partition the available space on
    your hard drive. There are many possible ways to partition, depending on your
    drive space, requirements, and taste. I like Linux hard partitions like this (for
    a modest size of 2 GB that I dedicated for Linux):


    | mount point | type | size |

    |---|---|--|

    | / | ext2 | 300 MB |

    | /usr | ext2 | 1200 MB |

    | /home | ext2 | 380 MB |

    | swap | swap | 120 MB |


    In the above example, I dedicate 300 MB for the mount point that holds the base
    of the Linux operating system. I give 1200 MB for the mount point that will be
    visible on my filesystem as the /usr directory and will contain users'' programs
    (the programs that don''t come with the base operating system and I later, for
    example WordPerfect). I dedicate 380 MB for the partition that will be visible
    as the /home and will contain the setting and data of all users on the machine.
    I give 120 MB for a "raw" partition for the operating system to use as the virtual
    memory (extension of the physical, silicon memory on the hard drive, so-called
    swap). If your kernel is lower than 2.2 (which is the case with RHEL 2.2 and earlier),
    your swap partition will be larger than approximately 127 MB. The rule of thumb
    is that your swap should be about twice the amount of the physical memory (RAM).
    120 MB is a bit of swap and it is unlikely you will need more. If you think you
    need more (e.g. you expect to run custom programs with large data structures)
    you want to create a large swap partition during the installation (or smaller
    swap partitions) or add swap file(s).


    2 GB is a lot of disk space and should be sufficient even for users who like having
    many applications. (This is because Linux applications tend to be slimmer than
    their MS Windows equivalents).

    However, if you try to install everything that''s available for Linux on the Internet,
    you will surely run out of disk space :-). My experience is that however large
    the hard drive, it will get filled and I regret I have no more :-).'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'If my space on the hard drive is really restricted, I may consider a two-partition
    setup like this (for a lean 600 MB total dedicated for Linux):


    | mount point | type | size |

    | / | ext2 | 600 MB |

    | swap | swap | 50 MB |


    In this example, I dedicate 600 MB to contain the base of the operating system,
    applications, and documents/data, and give 50 MB for the swap partition (for the
    operating system to use as the virtual memory). The 50-MB swap would be quite
    sufficient for medium duty operations. The limitation of 600 MB for the operating
    system, applications and user data means that you will have to select to which
    applications you install or else risk running out of hard drive space. Try pressing
    <F1> when installing the optional software that comes on Red Hat CD—will give
    you a short description of what the software does so you could decide if you really
    need it. You can easily finish the RedHat installation with 200 MB free on your
    Linux partition (of 600 MB used in this example) if you make reasonable choices.
    Please note that "bundling together" the root partition and the /home directory
    will likely save you some disk space, but it is not the safest solution.


    It is possible to install Linux on even less disk space than the example above,
    but you will have to be more selective as to what you need.


    For a larger hard drive space, I may consider the following setup (for a comfortable
    total of 6 GB dedicated for Linux):


    | mount point | type | size |

    | / | ext2 | 400 MB |

    | /usr | ext2 | 2000 MB |

    | /usr/local | ext2 | 2500 MB |

    | /home | ext2 | 800 MB |

    | swap | swap | 300 MB |


    Please note that the mount points can reside on different hard drives.


    Another consideration when setting up the partitions. Many older BIOS have the
    restriction that the boot partition cannot extend the 1024th cylinder on your
    first hard drive. To overcome this limitation, simply make the first (bootable)
    partition that it ends before the cylinder number1023 (which makes this partition
    approximately 512 MB in size, which is plenty for the "/" root partition). Once
    Linux boots, the BIOS restriction does not matter anymore as Linux can also access
    the partition(s) by the cylinder number1023.


    When and installing Linux, your drives are devices with the following names: hda--first
    IDE drive (for "hard drive", i.e. the master drive on the first IDE interface),
    hdb--second IDE drive (i.e., the slave drive on the first IDE interface), hdc--third
    IDE drive (i.e. the master drive on the second IDE interface), hdd--fourth IDE
    drive (i.e. the slave drive on the second IDE interface). The numbers mean on
    the partitions of the devices: "hda1" means the first IDE hard drive (hd a), first
    partition (1); "hda2" is the first IDE hard drive, second partition; "hda3"--the
    first IDE hard drive, third partition; (and so on if you have more than 3 partitions
    on the first hard drive'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'drive); "hdb1"--second hard drive, first partition (or just "hdb" if it is
    the CDROM installed as a slave on your first IDE interface), "hdc1"--third hard
    drive, first partition, etc. SCSI drives have analogous names but start with letters
    "sd" ("SCSI drive"), followed by the letter indicating the SCSI interface and
    by number indicating the SCSI device id. For example, "sda" means "first SCSI
    interface, id number 4". If you have an external zip drive attached to your parallel
    port, it will appear as a SCSI device "sda4" (it works in a SCSI-emulation mode).


    # 1.10 The MS Windows partition occupies my whole harddrive. Can I shrink/split
    it without a re-install?


    Possibly. There is a utility called FEX on your RedHat CD that does just that.
    Check the directory \dosutils\fipsdoc on your RedHat CD for documentation. If
    I were, I would back-up my essential data before doing anything to the partition.
    There are also commercial utilities to change the partition size without destroying
    the content of the partition.


    My preference is to do a clean re-install of MS Windows on a single, dedicated
    partition. I leave some space on the hard unpartitioned so I can use later for
    Linux. My fair division of hard drive space between MS Windows and Linux is 50/50.
    Linux programs tend to be smaller but they include a standard component that MS
    Windows offers only with thousands of dollars of add-ons: e.g., servers (not just
    clients) for telnet, ftp, http, and mail, several databases, programming languages...


    # 1.11 How do I install the installation?


    Insert the installation boot disk into your drive, the RedHat CD to the CDROM,
    and reboot. If you booted from the CD, insert the RedHat CD into your CDROM drive
    and reboot.


    You may also start the installation from DOS (real DOS mode under MS Windows),
    by running EZSTART._BAT on your RedHat CD from Cheabyetes.


    # 1.12 Is the Linux installation difficult?


    It was not for me. It seems that for most newbies, its fairly straightforward
    and painless. Depending on your hardware and installation conditions, it typically
    takes 0.5 h to 2.0 hours. [Except longer or possible problems for low systems
    with restricted memory--it took me whole to install RH on my 486-33 MHz with 8
    MB memory, the system pausing for 5 minutes at a time appearing to do nothing,
    yet installed ok.] However, some newbies reported that the installation was a
    "total nightmare" to their hard problems?). If you encounter problems, my advice
    would be to install a plain-vanilla system, without struggling with the high resolution
    on your fancy video card or some bleeding-edge hardware which you might have.
    Anything can be added/configured later, after you get more understanding of how
    things work on your system. A re-install is always an option for a newbie (it
    seems Linux guru think it is a shame to ever re-install). It seems that many newbies
    have problems because they specify too high screen resolutions (which may not
    be supported or supported only with some extra tune-up). Again, it may not be
    to break your whole installation for support of a single device--the support can
    be added/tuned up later.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 1.13 I finished the installation. How do I log-in for the very first time?


    As root, "root" is the only account that exists after the initial installation
    (newer installation programs do prompt you to create a regular user account during
    the installation). Example login:


    ```

    my_machine_name login: root

    Password: my_password

    ```


    In the example above, I typed the word "root" at the login prompt. After that,
    I entered the password that I chose during the initial Linux installation. The
    password did not appear on the screen when I typed it (for security).


    "root" is a special account with an absolute power over the system, and it is
    used for system administration. You surely want to create at least one more "user"
    account later to perform regular (not system administration) work. Read on to
    how to do it.


    Go to part 2: Linux Resources, Help and Some Links'
  merge: -1
  img_proc: true
