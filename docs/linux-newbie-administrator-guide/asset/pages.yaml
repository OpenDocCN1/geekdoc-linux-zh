  md: '# THE HOBBY OF THE KLIMAS FAMILY


    # ALWAYS UNDER DEVELOPMENT


    # LinuxNewbieAdministratorGuideline


    by Stan, Peter, Marie, and Barbara Klimas


    Easy Answers to the Questions Frequently Asked by the Beginner Users of Linux
    who Install Linux on their Home Computers or Admin their Home Network


    Distributed under the General Public Licence http://www.gnu.org/copleft/gpl.html.
    Your feedback, comments, corrections, and improvements are appreciated. Send them
    to bklimas@magma.ca (Generated from the html version of the Linux Newbie Administrator
    Guide)


    # # Introduction


    We (the Klimas family) are relative Linux newbies (with Linux since Summer 1998).
    We run RedHat mostly -> the solutions are not directly applicable to other Linux
    distributions (although most of them probably will). Hope this helps, we try to
    be as practical as possible. Of course, we provide no warranty whatsoever!


    # Part 0: For the Undefined (Linux Benefits)


    If you wonder what are Linux pros and cons, and whether Linux is for you.


    # Part 1: Before Linux Installation


    What distribution should I use, how to obtain it, Linux hardware requirements,
    how to partition your hard drive, about dual boot, and how to login the first
    time.


    # Part 2: Linux Resources, Help and Some Links


    If you would to know how to access the Linux documentation, wonder if Linux has
    a help command, or wanted to visit Linux-oriented groupsews or websites.


    # Part 3: Basic Operations FAQ


    After you installed, here are answers to questions that Linux newbie users/administrators
    have when trying to perform every-day tasks: how to run a program, shut down your
    computer, set up the path, add users with permission, work with file permissions,
    schedule jobs with "at" and cron, set up the swap space ...


    # Part 4: Linux Newbie Administrator FAQ


    More easy answers to questions that Linux newbie administrators frequently encounter:
    LILO issues, mounting drives, using X-windows, setting up network, ppp connection,
    printer, soundcard, remote access to your computer ...'
