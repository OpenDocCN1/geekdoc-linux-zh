    # Basic Operations FAQ


    # 3.1 Basics


    # 3.1.1 Filenames


    Linux is case-sensitive. For example: my_fileE, my_file, and my_FILE are three
    different files. Your username and password login are case-sensitive (This follows
    the tradition since both UNIX and "c" programming language are case-sensitive).
    Naming conventions for files and directories are identical.


    Filenames under Linux can be up to 256 characters long and they normally contain
    letters, numbers, ". (dots), underscores and "" (dashes). Other characters are
    possible but not recommended. In particular, it is not recommended to use special
    metacharacters: "*" (asterisk), "?" (question mark), " " (space), \$ (dollar sign),
    & (ampersand), any brackets, etc. This is because metacharacters have special
    meaning to the Linux shell. It is possible to have space inside the filename,
    but we don''t recommend it either--use underscore instead.


    It is not possible all to have ''/'' (slash) as a part of the filename because
    ''/'' is used to represent the top of the directory tree, and as a separator in
    the pathnames (as the same as \ is in DOS).'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'To manipulate files with names that contain metacharacters, I use a pair of
    ` (apostrophes), so that the metacharacters are quoted and therefore the shell
    does not interpret their meaning. For example, to remove a file file*` (contains
    space and asterisk), I would use:


    ```

    rm ''file*''

    ```


    Please note that I use a pair of ` (apostrophes) for quoting. Quoting with a pair
    of " (quotation marks) is generally weaker than quoting with `''`. When you use
    ` some metacharacters may get interpreted.


    Here is the meaning of some metacharacters:


    +   * = Matches any zero or more characters (except for ") dot at the beginning
    of a filename).

    * ? = Matches any single character.

    * [abc1] = Matches a single character in the enumerated set. In this example the
    set is: ''a'', ''b'', ''C'', or ''1''.

    * [a-z] = Matches any lower-case letter.

    * [-F] = Matches any upper-case letter from A to F in the Latin alphabet.

    * [0-9] = Matches any digit.

    * [a-zA-Z0-9] = Matches any letter (lower or upper case) or any digit.


    Examples. This command will show every filename in the current directory, with
    the exception of filenames starting with "." (dot):


    ```

    ls *

    ```


    An equivalent to this command is to type just "ls" or "dir". Files with names
    starting with "." are not shown because ". as the first character of a filename
    is not matched by "*". Think of files with names starting with "." as an equivalent
    of DOS hidden files. Use ls -a (list with the option "all") or ls .* to see "dot"
    files. The dot-files are in the user home directories and are typically used to
    hold user-level configurations.


    This command will show any filename that contains a dot:


    ```

    ls *.*

    ```


    This command will show any filename that contains two dots:


    ```

    ls *.*.*

    ```


    Please note that Linux does not have "filename extensions" and some other DOS-like
    file-naming features ("Micros~1.doc" comes to mind).


    This command will show all filenames in the current directory that start with
    "a" or "b", or any capital letter:'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'As an example of problems that you might face when using non-recommended characters
    in a

    filename, try creating a file with a name starting with a dash and then remove
    it--there seems to be no

    way to do it (a dash normally introduces command options). E.g., the command

    dir > -junk


    will create a funny file (the symbol ">\


    The dot at dashing means "the current directory" and here just serve the purpose
    of

    hiding the leading so it is not interpreted as introducing an option to the rm
    command. The

    point is that I rather stick to traditional naming conventions face the occasional

    complications.


    #  3.1.2 What are the different directories?


    This is explained very nicely in the Linux System Administrator Guide (SAG), which
    should be

    available on your system.


    ```

    cd /usr/doc/ldp/lynx sag.html

    ```


    This will start a text-browser "lynx" to view this html book. You can also use
    any other

    browser, e.g. Netscape for Windows, to view this book. This book and other LDP
    books are actually

    quite to read.


    Briefly, Linux contains five filesystems. These filesystems can reside on a single
    or different physical

    hard drives and/or hard partitions, depending on the size and need of your system.
    (A single

    filesystem can also be distributed between different physical devices, if needed.)


    The root "/ filesystem--contains basic operating system and maintenance tools.
    The content of this

    filesystem should be sufficient to start up the system and perform emery maintenance
    and

    repairs if they are necessary.

    /usr filesystem--contains all commands, libraries, documentation, and other files
    that do not


    change during normal operation. This will also contain many applications, the
    perhaps that ones

    come with your distribution, for example Netscape.

    /var filesystem--contains files that change: spool directories, log files, lock
    files, temporary files,

    /home filesystem--contains user files (users'') own settings, customization files,
    documents, data,

    mail, caches, etc).


    /proc filesystem--contains entirely illusory files. They don''t really exist on
    the disk and don''t

    take any space there (although ls -1 will show their size). When viewing them,
    you really access

    information stored in memory. It is used to access information about the system.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The parts of the root filesystem are:


    +   - /bin-commands needed during booting that may be used by normal users.

    - /sbin-commands not intended for general users (users may use them).

    - /etc-system-wide configuration files for your operating system.

    - /root-the home directory of the system administrator (called super-user) or
    root.

    - /dev-devices Devices appear on Linux so it is easy to write to.

    - /mnt-mount points for removable media (floppy, cdrom, zipdrive), partitions
    of other operating systems (like disk), network shares, and anything that is mounted
    on the file system temporarily. It normally contains subdirectories for the mounting
    shares.

    - /lib-shared libraries for programs that reside on the root filesystem.

    - /boot-files used by LILO a bootstrap loader, the thing loads first when the
    computer is booted and gives you an option on which operating system to boot,
    if you have more than one OS on your computer. It typically contains the Linux
    kernel, but if there could be stored somewhere else, only LILO is configured to
    know where it is.

    - /opt-optional large applications, for example kde under RedHat 5.2 (under kde
    is distributed as any other X-windows distribution, main executables are in the
