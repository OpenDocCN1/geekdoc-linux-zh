    # 5. How to upgrade your kernel?


    # 5.1 Introduction


    This document was written to help the new users of Linux upgrade their kernel.

    I used various sources for writing this document. From the official HOW-TOs (

    http://metalab.unc.edu/LDP/HOWTO/ ) to the Linux Knowledge Base and other sources.


    # 5.2 What is kernel?


    The kernel acts as a mediator for your programs and your hardware. First, it does
    (or arranges for) the

    memory management for all the running programs (processes), and makes sure that
    they all get a\ fair (or unfair, if you please) share of the processor''s cycles.
    In addition, it provides a nice, fairly

    portable interface for programs to talk to your hardware.

    There is certainly more to the kernel''s operation than this, but basic functions
    are the most

    important to know.


    # 5.3 Why upgrade?


    There are several reasons to upgrade your kernel. Most of the reasons are that
    you perhaps need a

    device driver for your new or old hardware (the previous device driver could have
    a bug

    somewhere) or you need to upgrade due to a bug in the kernel (security one or
    a non-security one).

    Usually new kernels run faster the old ones and are more stable and reliable.


    # 5.4 Where can I get the new kernel?


