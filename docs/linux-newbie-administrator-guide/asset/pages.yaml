    # 2. Linux Resources, Help and Some Links


    # 2.1 Any Linux reading materials?


    Check your RedHat CD for the softcopy of the RedHat manual (written with newbies
    in mind).

    Under Linux, you can read it:


    ```

    lynx /mnt/cdrom/doc/rhmanual/manual/index.htm

