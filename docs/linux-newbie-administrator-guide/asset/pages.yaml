  md: '# 4.2.10 Can I set 32-bit hard drive I/O?


    I know nothing about harddrives, but saw a review of RedHat 6.0 by Edward Choh
    (http://hardwarezone.community.com.sg/main.htm), in which he gave some interesting
    tips, including setting up the 32-bit input/output (I/O) and direct memory access
    (DMA). I tried, and it worked fine for me. Be warned that it can possibly harm
    the content of your harddrive so do not do it if you are a real PC newbie, don''t
    feel geeky today, or have a weak heart–I can''t guarantee it will work for you.


    The turning on of the 32-bit I/O and DMA has to be done by, and I did it in a
    single-user mode (to minimize the damage to the file system if something went
    wrong and I had to reboot). I definitely would not do it in a system currently
    running many programs or X-windows, and would have a current backup of any precious
    data.


    To boot your computer in a single-user mode, I type this at the lilo prompt (during
    bootup):


    ```

    linux single

    ```


    Say I would enable the 32-bit I/O on my first IDE harddrive, which is "hda". First,
    I time the harddrive current performance, and note the score:


    ```

    hdparm -t /dev/hda

    ```


    Now, I display my current I/O and DMA settings:


    ```

    hdparm -c /dev/hda

    ```


    [my system showed 0, meaning that the 32-bit I/O is turned off and the default
    16-bit access is used]


    ```

    hdparm -d /dev/hda

    ```


    [my system showed 0 again, meaning that the harddrive DMA access is turned off].


    Now, I turn on the 32 bit I/O and DMA:


    ```

    hdparm -c 1 /dev/hda

    hdparm -d 1 /dev/hda

    ```


    Now, I can time the performance of the harddrive again to compare the score with
    the original one:


    ```

    hdparm -t /dev/hda

    ```


    If everything worked ok, and the performance has improved, I can "commit" the
    new settings, so they can survive a soft reset:


    ```

    hdparm -k 1 /dev/hda

    ```'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'To have the new settings in effect every time you reboot the machine, you may
    add a line at the end of the file /etc/rc.d/rc.local (this file is something like
    AUTOEXEC.BAT in DOS):


    ```

    hdparm -c 1 -d -k 1 /dev/hda

    ```


    If something did not work as expected, or the performance did not really improve,
    I can reboot at any time and the old settings will be in effect as long as I did
    not perform the last operation.


    I performed this tune-up on 4 hard drives on our home network. It was a success
    on 3 newer hardrives; the performance improved by 30-300% and at least one computer
    "feels" faster than before. One harddrive (which is always flaky) hung the computer
    hard during the performance test and I had to reset the machine (no damage done).


