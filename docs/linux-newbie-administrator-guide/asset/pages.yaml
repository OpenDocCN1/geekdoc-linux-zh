    # 3.2.5 My mp3 player chokes. The sound is kind of interrupted (how to set suid).


    The MP3 player might not be given enough priority (it requires a lot of it). It
    could be that your system is lossy. Or you might be running too many cpu-intensive
    programs at the same time. Or, most likely, you may need to run the player with
    a higher priority (The priority of a program can be set with the command nice
    -- see man niceinfo nice). Try to run the player as root--programs run by root
    are given higher priority than those run by normal users. If this solves the problem,
    set the "suid" on the executable so all users are given "effective user id" of
    root when running it, for:


    ```

    chmod +s xllamp

    ```


    will do the trick for the amplifier program. The output from


    ```

    ls -l xllamp

    ```


    on my computer is:


    ```

    -rws-sr-x  1 root      root      319172 Mar 13 1998 xllamp

    ```


    The first "s" indicates that the user-id (suid) is set. The second "s" indicates
    that the group-id (gid) is also set. Anybody who executes xllamp is the effective
    user id of the root program and effective group id of the owner, in the example
    above is the user "root" and the group "root".


    Setting the suid for a program could possibly be a security hole in your system.
    This is unlikely on a closed home network and setting suid for a program of origin
    which is well traceable. However, at home, I wouldn''t suit a piece of code of
    origin which is uncertain, even if the setup instructions urged me to do so.


    Some programs do require suid for proper functioning, for example kppp (the popular
    modem "ppp" connection utility under the KDE graphical-user-interface desktop).'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 3.3 Job scheduling with "at", "batch", and cron


    # 3.3.1 How do I execute a command at specified time (using "at" or "batch")?


    The at command will execute the command(s) you specify at the date and time of
    your choice. For example, I could start playing music from my CDROM at 7 o''clock
    in the morning:


    ```

    at 7:00

    cdplay<Ctrl+d>

    ```


    In the example above, I entered the first line "at 7" on the command line and
    pressed ENTER. This, the command displayed a prompt "at". At this point, I entered
    my command "cdplay" and then pressed the control key "d" simultaneously to finish
    the input. Instead of pressing <Ctrl+d>, the next "at" would appear, which I would
    be able to enter the next command to be executed right after "cdplay", also at
    7. And so on, I could have made many commands scheduled for execution one by starting
    at 7. After typing the last command, I would finish the input with <Ctrl+d>. Think
    of the as sending "end-of-file" to the current input. Don''t press <Ctrl+d> twice
    because this will log you out-that''s what <Ctrl+d> does when entered straight
    into the Linux command.


    You can list the job you scheduled for execution:


    ```

    at -1

    ```


    which will give you the numbered list of the jobs waiting.


    If you changed your mind, you can remove a job from this list. For example:


    ```

    atrm 8

    ```


    will remove the job with the number eight on the list.


    I could also schedule a job for execution much later, for example:


    ```

    at 23:55 12/31/00

    startx

    ```


    would start my X-windowing system right on for the new millennium (5 minutes before
    midnight on 31 of December 2000).


    If you cannot execute the command, check if the daemon ("atd") is loaded (as root,
    use setup-system services"). If you cannot execute the command as a regular user
    although it works for root, check if the empty file /etc/at.deny exists and there
    is no file /etc/at.allow. This would be the default setup and it permits all users
    to execute at at. If you want only certain users to use at, create a file /etc/at.allow
    and list these users.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'For other options, check:


    man at


    If you wish to perform a processor-intensive job in a background when the system
    load is low, you may choose to use the batch command. For example, I could run
    setiathome (a program crunching data to help search of extraterrestrial intelligence,
    SETI) using:


    ```

    batch

    at>setiathome<Ctrl>d

    ```


    In this example, I entered the command batch and then, at the "at> prompt, I entered
    the command I wanted to be executed in the background. The job tries to start
    immediately, but goes ahead only when the system load is under 0.8 You can check
    the system load by inspecting the contents of the (virtual) file /proc/loadavg


    ```

    cat /proc/loadavg

    ```


    When a batch job finishes, the output is sent to me via e-mail.


    # 3.3.2 How do I set up cron?


    Cron (a Linux process that performs background work, often at night) is set up
    by default on your RedHat system. You don''t have to do anything about unless
    you would like to add some tasks to be performed on your system on a regular basis
    or change the time at which cron performs its duties.


    Please note that some of the cron work might be essential for your system functioning
    over a long period of time. Among other things cron:


    +   - rebuild the database of files which is used when you search for files with
    the locate command,

    - clean the /tmp directory,

    - rebuilding the manual pages,

    - "rotate" the log files, i.e. discard the old log files, rename the intermediate
    logs, and create new logs,

    - perform some other checks, e.g. adding fonts that you recently copied to your
    system.


    Therefore, it may not be the best idea to always switch your Linux off for the
    night--in such a case cron will never have a chance to do its job. If you like
    switching off your computer for nights, you may want to adjust cron so it performs
    its duties at some other time.


    To find out when cron wakes up to perform its duties, have a look at the file
    /etc/crontab, for example:


    ```

    cat /etc/crontab

    ```


    It may contain something like this:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '```

    # run-parts root run-parts /etc/cron.hourly

    01 * * * root run-parts /etc/cron.daily

    02 4 * * root run-parts /etc/cron.weekly

    22 4 1 * root run-parts /etc/cron.monthly

    ```


    You can see that there are four categories of cron jobs: performed hourly, daily,
    weekly and monthly.

    You can modify those or add your own category. Here is how it works.


    The columns in the entries below show: minute (0-59)


    Thus, in the example quoted, the hourly jobs are performed every time the clock
    clock shows "and one minute," which happens every hour, at one minute past the
    hour. The daily jobs are performed every time the clock shows 2 minutes past 4
    o''clock, which happens a day. The weekly jobs are performed at 22 minutes past
    four o''clock on Sundays. The monthly jobs are performed 42 minutes past four
    o''clock on the first day of every month. The directory with the script file that
    contains the command(s) is to executed as the last entry on each line.


    If you wanted jobs to be performed at noon instead of 4 in the morning, change
    the 4s to 12s. Cron wakes up every minute and examines if /etc/crontab has changed
    so there is no need to re-start after you make your changes.


    If you wanted to add a job to cron, place a script which runs your job (or a link
    to your script) in the directory /etc/cron.hourly or cron.daily or /etc/cron.weekly,
    or /etc/cron.monthly.


    # 3.4 Swap space


    Swap is an extension of the physical memory of the computer. Most likely, you
    created a swap partition during the initial RedHat setup. You can verify the amount
    of swap space available on your system:


    ```

    /proc/meminfo

    ```


    The general recommendation is that one should have: at least 4 MB swap space,
    at least 32 MB total (physical+swap) memory for a system running command-line-only,
    at least 64 MB of total (physical+swap) memory for a system running X-windows,
    and swap space at least 1.5 times the amount of the physical memory on the system.


    If this is too complicated, you might want to have a swap twice as large as your
    physical (silicon) memory, but not less than 64 MB.


    If you ever need to change your swap, here are some basics.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 3.4.1 Swap partitions


    You can have several swap partitions, each up to approximately 124 MB. Here are
    the steps to create and enable a swap partition:


    +   - Create the partition of the proper size using fdisk (partition type 82,
    "Linux swap").

    - Format the partition checking for bad blocks, for example:

    ```mkswap -c /dev/hda4```


    You have to substitute /dev/hda4 with your partition name. Since I did not specify
    the partition size, it will be automatically detected.


    +   - Enable the swap, for example:

    ```swapon /dev/hda4```


    To have the swap enabled automatically at bootup, you have to include the appropriate
    entry into your /etc/fstab file, for example:

    ```/dev/hda4 swap swap defaults 0 0```

    If ever need to disable the swap, you can do it with:

    ```swapoff /dev/hda4```


    # 3.4.2 Swap files


    Swapping to files is usually slower than swapping to a raw partition, so this
    is not the recommended permanent swapping technique. Creating a swap file, however,
    can be a quick fix if you temporarily need more swap space. You can have up to
    8 swap files, each with size up to 16 MB. Here are the steps for making a swap
    file:


    +   - Create a file with the size of your swap file:

    ```dd if=/dev/zero of=/swapfile bs=1024 count=8192```


    This physically creates the swap file /swapfile, the block size is 1024 B, it
    contains 8192 blocks, the total size is about 8 MB. (The dd command copies files.
    In the example above, the input file (if) was /dev/zero, the output file (of)
    was /swapfile. You cannot use the cp (copy) command for creating a swap file because
    the swap file must be physically continuous on the hard drive.)


    +   - Set up the file with the command:

    ```mkswap /swapfile 8192```'
  merge: -1
  img_proc: true
