    http://www.kernel.org/ . You can find a list of mirrors. Mirrors are sites with
    the (mostly) same

    information as the main site. Since the main kernel site is heavily overloaded
    with downloads

    choose a mirror closest to you or the one located in your country. For example:
    to get the

    new kernel from Norway point your browser to the .no kernel archive => http://www.kernel.org
    /

    Notice the .no after the www string. Lots of countries have mirrors for the kernel
    archive.

    Once the mirror page you will find information on that page which looks like this:


