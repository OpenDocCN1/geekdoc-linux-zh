- pgno: 64
  md: '# 4.1.3 How can I change the operating system that LILO boots on default?


    There are typically two sections in the file /etc/lilo.conf. One starts with "image="
    and it is relevant to Linux, the other starts with "other=" and this is the dos/win
    section. The first to appear in /etc/lilo.conf is booted by default. To change
    the system that boots on default, swap the sections. Don''t forget to re-run the
    command


    ```

    lilo

    ```


    after any changes to /etc/lilo/conf .


    # 4.1.4 The LILO prompt stays too short (or too long) on the screen during

    the bootup


    Add or adjust the line


    ```

    delay=100

    ```


    right before the "image=" or "append=" statement in your /etc/lilo.conf file.
    The number is the time of delay in tens of a second (0.1 s), so in the example
    above the delay will be 10 seconds. Don''t forget to re-run lilo after making
    the changes to the /etc/lilo.conf file, or the delay will not change.


    # 4.1.5 Uninstall Linux


    If you really wanted to "uninstall" Linux, you can run this command (from under
    DOS or MS Windows):


    ```

    FDISK/MBR

    ```


    which will get rid of LILO overwrites the master boot record (MBR) of your first
    hard drive, where LILO resides. After this you can remove the Linux partitions
    using the DOS FDISK utility to re-claim the hard drive space.


    # 4.2 Accessing the drives


    # 4.2.1 Where are my drives?


    Linux shows all the directories in one directory tree, respectively of what drives/hardware
    they are found on. Generally, this is a much better solution than the traditional
    DOS/Windows model-- completely abstracts the file system from the underlying hardware.
    You will appreciate this if you ever have to re-arrange or expand your hardware
    or add network resources. For the users who are accustomed to the DOS way of dealing
    with drives, it adds some extra complexity.


    In short, don''t search for drive letters. There are none under Linux; the content
    of your disks appears as subdirectories on your single Linux filesystem (directory
    tree). On default, the content of'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'removable media does not appear automatically in these subdirectories—you have
    to "mount" your drives. See the next answers for details. You should also unmount
    a drive before ejecting the media.


    You can access (read and write) a variety of drives and file systems from under
    Linux. This includes native Linux partitions, DOS and MS Windows partitions (on
    hard drives or floppies), ZIP and Jazz drives, and CDROM drives. Many common file
    system types are also supported. This means that you can download your Linux software
    using Netscape for Windows, save the downloaded file on you Windows hard drive
    partition, then boot Linux and copy the downloaded software from the Windows partition
    to your harddrive to the Linux partition, and finally install the software over
    Linux.


    # 4.2.2 How I access my CDROM?


    Mount it. The mounting adds all the drives and files from your CD to your Linux
    directory so you can easily access them without the drive letter.


    As root, you can mount the CDROM with a command like this:


    ```

    mount -t auto /dev/cdrom /mnt/cdrom

    ```


    If this works, the content of your CD appears in the directory /mnt/cdrom right
    away—you may have to customize it. Here is how it works.


    The command tells the operating system to mount a filesystem autodetecting the
    filesystem type ("-t auto"). The device is /dev/cdrom. The mountpoint (the directory
    where which "mounting" takes place) is /mnt/cdrom. This directory must exist and
    be empty. If it does not exist, create it with:


    ```

    mkdir /mnt/cdrom

    ```


    If the mounting command fails, make sure that check the device /dev/cdrom exists.
    If it doesn''t, where is your CDROM? Chances are it something like /dev/hdb if
    you have an IDE CDROM. Try /dev/hdb instead of /dev/cdrom in the mount example
    above. If this fails, you can try /dev/hdc or /dev/hld, if your cd is an IDE CDROM.
    If none of them is your CDROM, you might not have a drive but a SCSI CDROM? Try
    /dev/sda1, /dev/sda2, etc. ["hda" is the primary IDE master drive, "hdb" is the
    primary IDE slave drive, "hdc" is the secondary IDE master if you have two interfaces
    on your computer, hdd is the secondary IDE slave, "sda" is the first SCSI interface
    and the number is.]


    It is a good idea to have a device /dev/cdrom anyway because some programs assume
    that it exists. If it does not exist on your system, you may create it as a symbolic
    link, for example:


    ```

    ln -s /dev/hdb /dev/cdrom

    ```


    if your cd is the /dev/hdb drive.'
