    The first line of this script tells your computer to interpret this text file
    as a bash script. The second line makes the script wait 15 seconds (just to make
    sure the e-mail is not sent before the ppp connection is fully established). The
    third line executes the ifconfig command and pipes the output to the mail utility
    that sends it to my_email_address under the subject "notification".


    A flexible way to access your home computer is to configure it as a dial-up ppp
    server (as opposed to the dial-in client that that you use when you connect to
    your ISP). If somebody has a simple recipe how to do it, please drop a line.


    # 4.5.10 Can my home computer get hacked?


    Unfortunately, this is perfectly possible and attempts to do so are quite common.
    Every time you are connected to your Internet Service Provider (ISP) you are at
    risk. Read the previous answer if you would like to know how to is possible.


    The real danger is the intruder, if s/he is able to login onto your machine on
    any account, find another security hole and get root access. This is particularly
    possible if you are a real newbie administrator/or your machine is not security
    oriented (as you are at home, aren''t you—who would care about security, thank
    you!)


    To protect yourself, have long passwords that contain both numbers and letters
    for all accounts on your computer. The best way to enforce the password policies
    on all of your computer is to run (as root, available on RH6.0) linuxconf and
    under "password and account policies" make the minimum length to 6 or more characters,
    the minimum number of non-alphanumeric characters (i.e., not-letters) to 1 or
    2, the number of days after which the password must be changed to something like
    90 or less, and set a setting around password expiry to something like 7 days
    before the expiration. Check here for more info on weak passwords.


    It is also an idea to occasionally scan the files that contain a record of all
    the logins onto your computer: /var/log/secure (the most recent log) /var/log/secure.1
    (older log) /var/log/secure.2 (older log), etc. There are also other log files
    in the directory /var/log that you might want to view, check them out from time
    to time.


    If you remove not connections to your home Linux, you might want to restrict the
    rights to use telnet, ftp, etc. (all the network services are listed in the file
    /etc/inetd.conf) to the machines on your home network. The access is controlled
    by two files: /etc/hosts.allow and /etc/hosts.deny . access-control works as follows.
    When an outside connection is requested, the file /etc/host.allow is scanned and
    if the name of the machine from which the connection is requested is matched,
    the access is granted (regardless of any entry in /etc/host.deny). Otherwise,
    the file /etc/host.deny is scanned and if the'
