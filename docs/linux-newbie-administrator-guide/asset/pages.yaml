- pgno: 25
  md: 'This will start lynx, a simple text-mode HTML browser to view the manual. You
    can also use Netscape or any other html browser. If your RedHat is still not installed,
    you can view the manual with an MS Windows-based browser, e.g. Netscape for Windows.
    Just access the file index.htm on your CD in the directory as shown in the command
    above.


    If you already installed Linux, check /usr/doc/LDP for the excellent Linux Documentation
    Project manuals. (If you didn''t install the documentation, consider installing
    everything now.) For example, these commands will let you browse the Linux Administrators''
    Guide:


    ```

    cd /usr/doc/LDP/sag

    lynx.sag

    ```


    Also, check /usr/doc/HOWTO for the HOWTO documents, and /usr/doc/HOWTO/mini for
    the MINIHOWTOs. Check /usr/doc/FAQ for a set of FAQ. For example, these commands
    will let you view the Linux-FAQ on your cdrom (the CD must be mounted first):


    ```

    cd /mnt/cdrom/doc/FAQ/txt/

    less Linux-FAQ

    ```


    Since the documentation is also available on the RedHat CD, so you can read it
    before Linux installation. For example, this will let you read the Linux-FAQ under
    DOS, assuming your CDROM under DOS is the drive D:


    ```

    d:

    cd \FAQ\txt

    edit Linux-FAQ

    ```


    For more or updated documentation, see http://metalab.edu/mdw/index.html#guide.


    # 2.2 Is there a help command?


    Most Linux commands can be run with the "--help" option. For example


    ```

    cp --help | less

    ```


    More extensive info is accessed from the command line using the so-called manual
    pages man topic For example:


    ```

    man cp

    ```


    will display the manual page for the "cp" command. The manual pages are the standard
    "help" system under Linux, and contain wealth of detail, technical information,
    but often require an effort to understand by a newbie.


    The man command uses the simple utility called less lets you scroll through a
    text. Arrows to scroll, press "q" to quit. (Actually, less can do more than this.
    Press "h" for when running less , or learn about using man less . )'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'There is also the info command info topic . For example:


    ```

    info cp

    ```


    Often info contains information similar to man, but more up-to-date. Unfortunately,
    the info navigating utility is not very intuitive.


    If you don''t remember exactly the name of the command that you need to use, try
    apropos. For example, to obtain a list of commands which have something to do
    with "copy", try:


    ```

    apropos copy

    ```


    In menu driven programs, most notably set up when browsing the system services,
    you may press F1 for info what the particular service does.


    The kde windows manager includes a GUI-based "help browser", which can be started
    by clicking the "book with a light" icon on the Kpanel. This browser can be used
    to access the kde-specific help as well as the system manual pages. The Gnome
    desktop contains a similar help system.


    If you want to learn about the many packages that come on your CDs in rpm format,
    you may want to use the kde-based glint (glint in an X-terminal) to browse through
    the packages, display the info that they contain, and install them if you wish
    (the installation is to be done as root). Under RH6.0, the glint program is substititted
    with gnnorm, which is much faster, but also somewhat inconvenient to use.


    # 2.3 Newsgroups


    This is a intimidating place to be-the world''s strangest wrecks can be browsing
    all the newsgroups. For the malicious ones, I make an exception and enforce and
    inform the system administrator at their originating e-mail provider. Advertisements
    which I receive after posting to a newsgroup get deleted before reading-I know
    I am not the only one doing this, so make your subject line clearly if you want
    your email to be read, particularly if your e-mail address contains the string
    "aol". Despite their drawbacks, newsgroups can be an efficient way of accessing
    the information you need.


    Before going news, I would highly recommend DejaNews (http://www.dejane.com/home_ps.html).
    This is a huge archive of newsgroup postings and you can search using search tools.
    You can find an answer to your question without going through tons of trash, and
    without exposing yourself to anger after posting a question which "was already
    asked ten times this week." You may be surprised by the amount of information
    available DejaNews.


    There are several newsgroups devoted to Linux and seem much better than other
    newsgroups (they may be better by the Linux expert?). Here is a short list:

    news:comp.os.linux.announce (moderated--the postings are done by a moderator,
    who reviews them prior to the posting. Including the footer of any message for
    info how to post.)

    news:comp.os.linux.help

    news:comp.os.linux.setup'
  merge: -1
  img_proc: true
