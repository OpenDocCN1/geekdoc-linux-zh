- pgno: 106
  md: '<= end of example page =>


    If at section 5.7.x used make zImage you should copy the zImage file, otherwise
    copy the bzImage file. We will assume zImage.


    The option to which encounter right now is where to copy the kernel. On Red Hat
    distributions the kernel is located in /boot/ on Slackware in /. I''m not familiar
    with other distributions (Debian, SuSe, etc.). Depending on your distribution
    make your choice where you will copy the new kernel.


    We will make an example for Red Hat.


    Type cp /boot/vmlinux-2.2.12


    Now change the directory back to /usr/src/linux/

    Type cd /usr/src/linux/


    Now lets copy the new System.map. Please note that System.map is always located
    in /boot/

    Type cp System.map /boot/System.map-2.2.12


    Now we have to make a new symbolic link to boot which points to the new System.map.

    First change the directory to /boot by typing cd /boot .\Now delete the old symbolic
    link (note that the symbolic link only deletes the link, not also the file or
    directory to which points). Type rm System.map .\Now lets create a new symbolic
    link which points to the new System.map-2.2.12.Type ln -s System.map-2.2.12 System.map


    All we have to do is edit the lilo.conf file, add our new kernel in there and
    run lilo.

    Lets change directory to /etc by typing using your favourite editor (vi, joe,
    pico) edit the lilo.conf file. For our example we will use joe.

    You will see something like this in your file :


    = start of example page =>


    ```

    boot=/dev/hda

    map=/boot/map

    initrd=/boot/boot

    prom

    timeout=5

    image=/boot/vmlinux-2.0.36-0.7

    label=lilo.old

    root=/dev/hda1

    read-only

    ```


    < end of example page =>


    Please note that this can and be different on your system.

    Now we will add the new kernel to our lilo.conf file. Copy the part from image
    to the end and paste it before the current image. You should get something like
    this:


    = start of example page =>'
