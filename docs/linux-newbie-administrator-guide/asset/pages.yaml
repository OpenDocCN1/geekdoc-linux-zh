- pgno: 7
  md: '# 0.1 Fundamentally, why Linux?


    If you truly enjoy working with computers, Linux is the operating system of your
    dreams. It is more fun than any other computer operating system around. However,
    the reason why Linux is truly revolutionary is that it is Open Software. Our science
    and technology works owing to the free availability of information and peer review.
    You would fly a plane that was based on proprietary science and unreviewed design,
    a plane at the internals of nobody but the manufacturer could look? When, would
    you trust a closed, unreviewed, proprietary operating system? Linux is ideally
    suited for a mission-critical application.


    Making horseshoes was once a closely guarded secret. Science and technology exploded
    500 years ago to share the knowledge by the means of printing. In the early days
    of printing, many of those who dared to share were assassinated for revealing
    ‘trade secrets’. Linux is for the computer age when Gutenberg was for. Hopefully
    there will be no assassinations this time :-


    # 0.2 Is Linux for me?


    Only you can answer this question. Linux is a mature, powerful and extremely versatile
    UNIX-like operating system. The power and versatility come with a price--you may
    need to be computer-literate in order to set-up and maintain Linux. Linux is relatively
    easy to use the operating system and applications are set up properly. So, your
    mother will also be able to use Linux, if you set up an easy graphical account
    for her and put the icons/menus on her GUI desktop. Linux is secure, so your mother
    will not be able to damage the system no matter how hard she tries--unless it’s
    with a hammer :-


    Linux is quite different than MS Windows, so not expect that you can get around
    MS Windows, Linux will be obvious to you. You may need to learn. On the other
    hand, if you come from UNIX, Linux will be easy for you. If you don''t know much
    about computers or you don''t enjoy them, chances Linux administration is not
    for you. If you don''t know your hardware, Linux installation may be a challenge
    for you.


    # 0.2a Linux is difficult for newbies.


    This may be true. But the question is: do you really want to learn it?? None of
    the Klimas family (that writes this guide) has any computing science background,
    yet we use Linux every day and love it.


    # 0.3 What are the Linux benefits?


    Linux can give you:


    +   A modern and very stable multi-user, multitasking environment on your inexpensive
    PC hardware, at no (or almost no) monetary cost for the software. Linux is a rich
    and powerful platform--don’t think of it as a “poor people” operating system.
    Out-of-box Linux has such much capability as MS'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Windows NT with $5000 in software add-ons, is more stable, and requires less
    powerful hardware for comparable tasks.


    +   - Unsurpassed computing power, portability, and flexibility. A Linux cluster
    recently (April 1999) beat a Cray supercomputer in a standard benchmark. Linux
    is VERY standard--it is essentially a POSIX compliant UNIX. (Yes, Linux is a best-of-the-breed
    UNIX. The word "UNIX" is not used in conjunction with Linux because "UNIX" is
    a registered trademark.) Linux is most popular on Intel-based PCs (price), but
    it runs well on numerous other hardware platforms, from toy-like to mainframes.


    +   - A true great learning platform. If you are a parent, you should be really
    glad your daughter/son does Linux--she will surely learn something of lasting
    value. If you are a teacher, you should consider installation of Linux at your
    school.


    +   - Excellent networking capability built into your operating system. You think
    you don''t need a network? Once you use home networking, you will never be able
    to live without it! What about connecting the two or more computers that you have
    and sharing your hard drives, CDROM(s), sound card(s), modem, printer(s). What
    about browsing the net on two or more machines at the same time using a single
    Internet connection? What about playing a game with your son over your home network?
    Even your old 386 with Win3.11 may become useful again when connecting to your
    Linux Pentium and it is able to use your resources. Networking software comes
    with standard Linux, free to use your resources. Just setup is ready. And it is
    not a second-gear shareware--it is exactly the same software that runs most of
    the Internet (the Apache software runs more than 50% of all web servers and Sendmail
    touches some 70% of e-mail). The freedom of home networking is what I was able
    to discover only owing to Linux.


    +   - Connectivity to Microsoft, Novel, and Apple proprietary networking. Reading/writing
    to your DOS/MS Windows and other disk formats. This includes "transparent" use
    of data stored on the MS Windows partition of your hard drive.


    +   - Dozens of excellent applications built by researchers around the world (astronomy,
    information technology, chemistry, physics, engineering, linguistics, biology,
    ...). In many fields, Linux seems like "the" operating system in existence. The
    software in this category is typically not easy to use, but if you want the power,
    it is the best software that has humanity in its areas. Doubtful? Have a look:
    http://SAL.KachinaTech.COM/Z2/index.html for examples.


    +   - Thousands of free apps, tools, and small programs. "Small is beautiful"
    goes well with Linux philosophy.


    +   - Scores of top-of-the line commercial programs including Word and all the
    big databases (e.g., Oracle, Sybase, but not Microsoft''s). Many (most?) of these
    are offered free for developers and for personal use.


    +   - State-of-art development platform with many best-of-the-kind programming
    languages and tools coming free with the operating system. Access to all the operating
    source codes, if you require it, is also free.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '• Freedom from viruses, software manufactures "features", invasion of privacy,
    forced upgrades, licensing and marketing schemes, high software prices, and piracy.
    How is this? Linux has no viruses because it is too secure an operating system
    for the viruses to spread with any degree of efficiency. The rest rests from the
    open-source and non-commercial nature of Linux.


    • The operating platform that is guaranteed "here-to-stay". Since Linux is not
    owned, it cannot possibly be out of business. The Linux General Public License
    (GPL) ensures that development and support will be provided as long as there are
    Linux users.


    • A platform which will technically develop at a rapid pace. This is insured by
    the modern, open-source development model which Linux implements: "build-on-the-back-of-the-previous-developer"
    and "peer-review-your-code" (as opposed to the anachronistic closed-software model:
    "always-start-from-scratch" and "nobody-will-see-my-code"). Even if the current
    "Linux-hype" died out, Linux will develop as it did before the media hype started.


    If you wanted to learn first-hand about the General Public License, check these
    famous GNU documents:

    http://www.gnu.org/copyleft/gpl.html

    http://www.gnu.org/linux-and-gnu.html

    http://www.gnu.org/philosophy/categories.html#TheGNUSystem


    The licence under which Linux is distributed is probably the most important part
    of it.


    # 0.4 I don''t believe in free software, etc.


    And do you believe in the Internet? The Internet and Linux share underlying ideas
    and have common roots. Do you remember the disbelief about the Internet few years
    ago, the endless, seemingly unbeatable arguments that the free Internet cannot
    exist? "Who pays for that, anyway?"


    The reality is simple. Cooperation and good will benefit many at the same time:
    your gain is not my loss. Internet works fine and is expanding at a rapid pace.
    So Linux.


    # 0.5 "There ain''t so thing as a free lunch"


    Brett Bazant <bbazant@shaw.wave.ca> wrote in LinuxToday

    (http://linuxtoday.com/cgi-bin/showbt.pl?tbsn=12450&sn=5418):


    The economic paradigm which makes this true depends upon scarcity of resources.
    Software resources are only scarce because we keep software proprietary and secret.
    But not Linux! When I give you my software, it may create opportunity cost for
    me, but I get to keep it even after I''ve given it to you. It is a free lunch
    only rivaled in history by the leaves and the fishes.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 0.6 I need high security. With commercial software, I can sue them if things
    go wrong.


    Don''t count on suing. Things go wrong on many MS Windows NT machines every day,
    and there are no damages awarded by courts. Read your MS Windows agreement to
    find out that there is no guarantee whatsoever that ANYTHING will work. Trying
    to use it would be a waste of money.


    Linux provides no guarantees, although it is far more secure than any version
    of MS Windows. If you are really security-sensitive, you can use high-security
    tools built by companies that rely on the availability of the source code to design
    and test their security features (e.g., Kryptokom in Germany provides high security
    firewalls). The "security in obscurity" implemented in MS Windows has repeatedly
    demonstrated to be a naive approach.


    Here is a quote from David Kastrup, Research Engineer, Bochum, Germany (after
    the "Internet Week", http://www.techweb.com/se/directlink.cqi?INW19990329S0050);


    > Risk aversion is what when using Linux and other open products, rather than
    NT. The risks with NT are entirely out of your control, and there is nobody who
    could use if anything goes wrong. Why people still believe the myth that Windows
    in any form offers any bit of accountability more" than Linux remains a complete
    riddle to me.


    # 0.7 I need standards. Big software corporations (Microsoft) provide standards.


    Perhaps that is what people would expect from large corporations, but the reality
    is different. Once, big companies loved inventing nuts that could undo only by
    their own service shops. Did these nuts become standard? Hardly. They didn''t
    there was no public benefit involved, and they couldn''t have they were patented.
    Luckily, now we have open and free standards for nuts.


    An example from the computer field. The "standard" MS Word format has changed
    numerous over the recent years. This keeps happening properly for a good reason:
    as soon as other companies "reverse-engineer" the current Word format, Microsoft
    changes it. There are even sub-formats (a MS "fast-save" anybody). It is also
    completely closed--Microsoft not publish the specifications. How can the user
    benefit from this in a longer term?


    Xavier Basora (http://www.osopinion.com/Opinions/XavierBasora/XavierBasora47.html)
    writes:


    > " Microsoft''s standards are both proprietary and arbitrary-the stealth incompatibility
    of Office 97 file with older versions of Office or the subversion of Open standards
    like XML with proprietary extensions that Internet Explorer 5, MS Active server
    and so, are sober reminders of what the company does to market"


    To add to the confusion, companies typically do not "standardize" on file formats
    but on applications that are supposed to produce them. It is like standardizing
    on a manufacturer of nuts instead of nuts. How is this supposed to work if the
    file format keeps changing?'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'There are a few text/document oriented file formats that are quite more standard
    than MS Word file format: ASCII, SGML, HTML, LaTeX, TEX, XML, PostScript, pdf,
    dvi ... and all of them have excellent support under Linux. The Word file format
    can also be read/written very well under Linux by Word Perfect, Star Office, Applizware,
    etc. to cover your today''s needs.


    The story is similar with other proprietary computing "standards". Linux, by its
    very nature, is based on true, published, and free standards because "open source"
    makes the full specifications available to everybody (competitors or not).


    Go to Part 1: Before Linux Installation'
