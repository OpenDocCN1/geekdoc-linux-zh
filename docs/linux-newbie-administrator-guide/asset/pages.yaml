    ```


    This way, the executable (actually, a symbolic link to it) is on my PATH and it
    can be run by simplyntyping its name (no need to type the full path to the executable
    any). Some programs will put the executable (or a link to it) in a binary directory
    so you can skip the last step.


    o There are also programs distributed as "source code rpm" packages. They require
    installation of the *.rpm package with the "rpm" utility and then compliation
    of the source code by executing the same:

    "./configure - make - make install" sequence as for the sourcecode distributed
    as tarballs.


