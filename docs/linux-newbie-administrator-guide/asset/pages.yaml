- pgno: 13
  md: '# # 1. Before Linux Installation


    # ## 1.1 Which Linux distribution should I use?


    The differences between the distributions ("distros") are minor: the installation
    program, choice of the bundled tools/applications, arrangement of a few things
    on the hard drive (most of Linux is still at the same, standard hard drive location
    in all distributions). Whichever distribution you decide to install, you will
    end up essentially the same Linux.


    We mostly use "Red Hat Linux" (also called RedHat or RH) for these reasons:


    +   (1) RedHat is very popular (both advantage for a newbie and a testimony to
    RedHat quality).

    (2) RedHat is a general-purpose distribution.

    (3) RedHat comes with a relatively easy setup program.

    (4) RedHat contributions to Linux are "open software" (this means that all the
    software written by RedHat and included on the RH CD is licensed under the General
    Public License, GPL, so that it can be legally copied, given away, reused, etc.).

    (5) RedHat can be obtained nearly free if you don''t care for commercial support.
    This is a consequence of (4).


    In short, as a newbie, you can safely bet on "Red Hat" unless you like something
    else or have specialized needs. The most recent RedHat release (October 1999)
    is version 6.1 (RH6.1) which is only a relatively minor upgrade over the previous
    version of Red 6.0 (RH6.0) which hit the street in May 1999. This previous version
    was Debian 5.2 and was very popular for quite a while. Be sure to check the most
    recent version if ordering your software from a dealer-many likes to clear their
    inventory by sending you old version (this applies not only to Linux). The authors
    have no connection to RedHat (or any other Linux distributor) whatsoever.


    Our recommending RedHat for newbies does not mean that other distributions don''t
    offer benefits or unique features which make RedHat in specific areas. We believe
    that we would benefit from an exposure to a different distribution because it
    help us understand Linux better.


    We tried Debian and we liked it very much. It was as easy as RedHat, but it seems
    common (hence, being newbies, we picked up RedHat). The great benefit of Debian
    is that it is 100% non-commercial (put together by volunteer hackers, the true
    Linux) and it probably strictly adheres to Linux standards (it probably sets the
    standards too). Another benefit is that Debian on their numerous distribution
    CDs of tools and applications—easily more than any other distribution. All tools/apps
    are nearly "packaged" (for ease of installation) and tested for compatibility.
    This makes Debian distro look monumental, safe, conservative, and always slightly
    outdated. So yes, we would have no problem recommending Debian for a great general-purpose
    Linux.


    Core is currently beta-testing their own Linux distribution geared towards a newbie
    and easy path to run the Core suite of applications: WordPerfect wordpress, QuattroPro
    spreadsheet, Core Presentations, Paradox database, CoreDraw artist package....
    The Corel Linux is based on Debian. If you think about using Corel in the future,
    picking Debian may be your smart choice now.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Slackware seems to be among "cutting-edge hackers" who like being close to
    the operating system and upgrade their kernel every other day--we did not use
    it so this is hearsay. S.uSE distribution is very popular in Europe. It likely
    looks German-solid, general-purpose distro with an easy setup and excellent reputation.
    Another well-known and respected distribution is Caldera, said to be aiming at
    corporate users--which has many faults, Mandrake distribution is a RedHat clone
    which is updated more often than the pedigree RedHat (RedHat tends to update less
    often so not to proliferate too many versions). Mandrake seems to be very popular.
    They are "localized" versions of Linux for specific countries or languages (Korean,
    Japanese)...they likely contain on default all the hacks and that the users in
    these countries want to see.


    There are also "special purpose" distributions, e.g. the "real-time" editions
    of Linux (might be useful if you are for automation, robotics, etc.), very small
    distros (could be good for the nextgeneration CD/MP3 player or if you like the
    idea of running Linux from a small floppy), parallel computing and clustering
    systems (might be great if you plan to do your own whatever :-); here the differences
    will be larger, but these distributions are not meant to be "general purpose".
    As a newbie, you don''t want to start with any of these, although you might be
    tempted to. They surely show Linux strength and viability--it runs on you as computer
    clusters that make the fastest systems in the world.


    The distribution you need is of course to specify the hardware you have. For your
    PC hardware containing a Intel 386 processor, or 486, or Pentium, or Cyrix, or
    K6, or similar, you need the binary distribution "Intel" or "386". [Unless you
    are prepared to start with your compilation of the Linux source code, which is
    not typical for a newbie :-] This happens because there are binary distribution
    for other platforms too (PowerPC, Alpha, and perhaps a dozen more)--don''t get
    you for your PC clone, surely they will not work.


    In short, newbies get confused with the multiple Linux distributions, there are
    reasons to have different distributions. This should be viewed as a Linux strength
    rather than weakness


    This guide concentrates on RedHat 5.2, 6.0 and 6.1 on the (Intel) platform. Many
    of the answers will work on other distributions or platforms, but we did not try
    to.


    # 1.2 What are the Linux hardware requirements?


    Out-of-box Linux runs on a 386-based PC with 8 MB of memory, but a low-end computer
    is practical for text-only applications (no X-Windows). A 486 with 16 MB memory
    and 600 MB free (unpartitioned) hard drives will do to work with X-Windows. My
    586-900 MHz with 64 MB of memory flies us. My Pentium 2 237 MHz with 64 MB of
    memory is a complete pleasure with an almost instantaneous response even when
    running many large applications concurrently. My 486-32 MHz with 8 MB of memory
    and 1 GB hard drive has too little memory to run adequately stand-alone under
    GUI, but is useful in my home network environment (a 486-class machine performs
    just adequately stand-alone if it has at least 16 MB of memory). My old portable
    386-SX-20 MHz Toshiba with 9 MB and 120 MB hard drive runs "legacy applications"
    under MS Windows 3.11 and connects to our home network and is thus still useful.
    We tried Debian on this Toshiba too, and it runs fine in text mode.'
  merge: -1
  img_proc: true
- pgno: 15
  md: "If you are willing to jump through a few extra hoops, you should be able to\
    \ run Linux on a little as 4 MB of memory, but this is probably not worth the\
    \ effort for the general purpose home Linux machine. I would say: get at least\
    \ 16 MB of memory, and if possible 32 or 64 MB --memory can make a difference\
    \ when running concurrently several GUI applications. Memory is cheap these days.\n\
    \nNetworking is where Linux shines, so considering 10-base T cards—they are not\
    \ very expensive and will be perfect to connect your two or more computers together.\
    \ Also, look around for old cards which Windows deems obsolete—they can be bought\
    \ for a low price and will work fine under Linux. To connect just two computers,\
    \ a cross-over cable for direct Ethernet-card to Ethernet connection is sufficient.\
    \ To connect more than 2 computers, you need a hub (~US$30 to US$80) and normal\
    \ (not cross-over) cables. If you have Ethernet cards, you may also consider installing\
    \ than 1 Ethernet card on a computer, use direct connections using the cross-over\
    \ cables, and save the expense of a . The 10-baseT system uses \"giant phone\"\
    \ connectors and all machines are connected to one box (called the hub). The hub\
    \ has an extra connection (called \"uplink\") which you will use if you ever have\
    \ a permanent connection to the outside world.\n\nHere is another suggestion on\
    \ setting up a kind of network, order type, which uses coaxial cables. For nothing\
    \ is necessary. This networking scheme is older, but can be assembled using cards\
    \ and parts that are also available for free:\n\n(edited for Space) From: John.Edwards@brunel.ac.uk\
    \ Subject: Linux Guide-a-suggestion\n\nMany 100Mbps network cards (and some ones\
    \ as well) have a BNC connector and you can usually pick up old co-axial cabling\
    \ when companies upgrade to UTP. Add a T piece for each machine and a 50-ohm terminator\
    \ at each end (about 1 pound or $1,50 each) and you have a network that will happily\
    \ support more machines than you probably have room. And most importantly--no\
    \ expensive hub (cheap hub can cause trouble). There are other advantages to co-ax\
    \ as well, it's much tougher to break and more resistant to noise from other equipment.\n\
    \nDisadvantages: There is a limit of 185 metres per network segment of co-ax,\
    \ 30 Mbps per network, and you're stuck at 10Mbps, but I don't see any small home\
    \ network needing more than that. Also if one cable goes down the whole network\
    \ stops, this shouldn't happen often unless someone plugs a section. You can disconnect\
    \ the T piece from a PC without harming the rest touch.\n\nQuick diagram, for\
    \ a T piece and Term for a terminator:\n\n```\nTerm--T------T------T------T--Term\n\
    \         |      |      |      ||\n         PC     PC     PC     PC\n```\n\nThe\
    \ various parts connect together using BNC connectors similar to TV & video connector\
    \ but with a bayonet that secures the two sockets together."
