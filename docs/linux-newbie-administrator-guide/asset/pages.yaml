  md: 'If everything went ok, we have a new kernel, to be installed and used on the
    system.


    # 5.7.2 Using the full source


    If you downloaded the source you will need to go thru this section.

    We are assuming right now that you are located in /usr/src/kernel. We have unpacked
    the new kernel (Section 5.6.2). Now we will move to the kernel directory (assuming
    linux). Type cd

    linux.

    Now we are located in the kernel directory. Now lets start our fresh compile.


    +   1. type makeconfig

    2. type make dep

    3. type make clean

    4. type makeImage (if this fails beImage, which stands for bigImage)

    5. type make modules (if you enabled them)

    6. type make modules_install (if you used #5)


    We will have to configure your kernel. We won''t go into details or explains here
    since the

    configuration is different from machine to machine. Go thru the configuration
    wisely and if you

    don''t know what something is, leave it in putting it out of the configuration.


    If everything went ok, we have a new kernel, to be installed and used on the system.


    # 5.8 Installing the new kernel


    Installing the new kernel takes a knowledge of editing the lilo.conf file located
    in the /etc/ directory. It

    will state now from machine to machine and it not look the same on your machine

    as it does on others.

    First of all, we will assume that you are still in the /usr/src/linux/ directory.
    We will have to copy the

    new kernel and System.map to location which is different on some distributions.

    Lets change directory to the new kernel.

    Type ls -al just as what you''re. You will see something like this:


    = start of example page =>


    ```

    total 588

    drwxr-xr-x 1 1046 1046 1024 Apr 5 20:54

    drwxr-xr-x 1 1046 1046 1024 Mar 1 13:02:39

