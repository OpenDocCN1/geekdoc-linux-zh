- pgno: 112
  md: '# 6.2 Common Linux commands--system info


    | Command | Description |

    |---|---|

    | pwd | Print working directory, i.e., display the name of my current directory
    on the screen. |

    | hostname | Print the name of the local host (the machine on which you are working).
    Use netconf (as root) to change the name of the machine. |

    | whoami | Print my login name. |

    | id username | Print user id (uid) and group id (gid), effective id (if different
    from the real id) and the supplementary groups. |

    | date | Print or change the operating system date and time. E.g., change the
    date and time to 2000-12-31 23:57 using this command. date 123123572000. To set
    the hardware clock from the system clock, use the command (as root) setclock |

    | time | Determine the amount of time it takes for a process to complete + other
    info. Don''t confuse it with date command. E.g. I can find out how long it takes
    to display a directory content using: time ls |

    | who | Determines the users logged on the machine. |

    | rwho- | Determine all users logged on network. The rho service must be enabled
    for this command to run. If it isn''t, set up root to enable "rwho". |

    | finger user_name | Show system info about you. Try: finger root last Show the
    last users logged on your system. |

    | history | Show the last (1000 or so) commands executed from the command line
    on the current account. The "more" causes the display to stop after each screen.
    |

    | uptime | Amount of time since last reboot. |

    | ps | (print status) List the processes currently running by the current user.
    |

    | ps axu | more | List all the processes currently running, even those without
    the controlling terminal, together with the name of the user that each processes.
    |

    | top | Keep listing the currently running processes, sorted by cpu usage (top
    users first). In KDE, you can get GUI-based top from "K menu" under "System-Task
    Manager (or by executing "top" in an X-terminal). |

    | uname -a | Info on your server. |

    | free | Memory info (in kilobytes). (=disk free) Print disk info about all the
    filesystems (in human-readable format) |

    | du /bh | more | Print detailed disk usage for each subdirectory starting at
    root (in human legible form). |

    | cat /proc/cpuinfo | Cpu info. Note that the files in /proc directory are not
    real files. They are hooks to look at information available to the kernel. |

    | cat | List the interrupts in use. |

    | /proc/interrupts | |

    | cat /proc/version | Linux version and other info. |

    | cat | Show the types of filesystems currently in use. |

    | /proc/filesystems | |

    | cat /etc/printcap | (as root. Use /sbin/lsmod to execute this command when you
    are a non-root user.) Show the kernel modules currently loaded. |

    | lsmod | |'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 6.3 Basic operations


    | | |

    |---|---|

    | set|more | Show the current environment.

    | echo $PATH | Show the content of the environment variable "PATH". This command
    can be used to show other environment variables as well. Use "set" to see the
    full environment.

    | dmesg | less | Print kernel messages (the content of the so-called kernel ring
    buffer). Press "q" to quit "less". Use less /var/log/dmesg to see what "dmesg"
    dumped into the file after reboot.

    | any_command -help |more | Display a help on a command (works with more commands).
    "--help" works similar to DOS /h switch. The "more" pipe is needed if the output
    is longer than one screen.

    | ls | List the content of the current directory. Under Linux, the command "dir"
    is an alias to ls. Many users have "ls" to be an alias to "--color"

    | ls -l | List the content of the current directory, all files (those also starting
    with a dot), and in long form. Pipe the output through the "more" command, so
    that the display pauses after each screen.

    | cd directory | Change directory. Using "cd" with the directory name will take
    you to your home directory and is a convenient way to toggle between two directories.

    | cp source destination | Copy files.

    | mcopy source destination | Copy a file from/to a DOS file system (no mounting
    requirement). E.g., autoexec.bat . See man tools for related commands: mdir, mcr,
    mren, mden, mnd, m format...

    | mv source destination | Move or rename files. The same command is used for moving
    and directories.

    | ln source destination | Create a hard link destination to the file called "source".
    The link appears as a copy of the original file, but in reality only one of the
    file is kept, just two (or more) directory entries point to it.. Any changes the
    file are automatically visible throughout. When one entry is removed, the other(s)
    stay(s) intact. The limitation of the hard links is: the links to directories
    or special files are impossible.

    | ln -s destination | Create a symbolic (soft) link destination to the file called
    "source". The symbolic link specifies a path where to look for the file. In contradiction
    to hard links, the source and destination do not have to be on the same filesystem.
    In comparison the drawback of symbolic links is: if the original file is removed,
    the link is "broken", symbolic link can also create circular references (like
    circular references in spreadsheets or databases, e.g., "a" points to "b" and
    "b" points back to "a"

    | rm files | Remove (delete) files. You must use the file in order to remove it.

    | mkdir directory | Make a directory.

    | rmdir directory | Remove an empty directory. (recursive) Remove files, directories,
    and their subdirectories. Careful with this command as root—you delete all files
    on the system with such a command executed on the top of your directory tree,
    and this is not unless in Linux (yet). But if you really want to do it (consider),
    here is how (as root): rm -rf |

    | cat filename more | View the content of a text file "filename", one page at
    a time. The "|\ is the pipe symbol by many American keyboards it shares with (/)
    The pipe makes the output stop after each screen. For long files, it is sometimes
    convenient to use the commands head and tail that display just the beginning and
    the end of the file. If you happen to use "cat" a binary file and your terminal
    displays funny characters afterwards, you can restore it with the command "reset".'
  merge: -1
  img_proc: true
- pgno: 114
  md: '| less filename | Scroll through a content of a text file. Press q when "Less"
    is roughly equivalent to "more", the command you know from DOS, although very
    often "less" is more convenient than "more". |


    | pico filename | Edit a text file using the simple and standard text editor pico.
    |


    | pico -w filename | Edit a text file, while disabling the line wrap. Handy for
    editing configuration files, /etc/fstab. |


    | lynx file.html | View an html file or browse the net from the text mode. |


    | tar -xvf | Untar a tarred and compressed tarball (*.tar.gz or *.tgz) that you
    downloaded from the Internet. |


    | filename.tar.gz | Untar an uncompressed tarball (*.tar). |


    | gunzip filename.gz | Decompress a file (*.gz or *.z). Use gunzip (also zip or
    compress) if you want to compress files. |


    | bzip2 filename.bz2 | Decompress a file (*.bz2) with bzip2 compression utility.
    Used for big files. |


    | unzip filename.zip | Decompress a file (*zip) using a compression utility that
    could also be used PKZIP for DOS. |


    | find -name "filename" | Find the file name containing the string on your filesystem
    search from the root directory "/" . The "filename" may contain characters (*).
    |


    | locate filename | Find the file name containing the string "filename". Easier
    and faster than the previous command which depends on a database that normally
    builds at. |


    | mc | A good text-mode mail reader. A good and standard one is "elm". Your Newscat
    will read the mail from your Internet account. Pine let you read the "local" mail,
    the mail your son or a cron process seeks to you from a computer on your network.
    The command could also be used for reading/compiling mail messages environment--it
    is meant to be used in scripts for automation. |


    | talk username1 | Talk to another user currently logged on your machine (or use
    "talk username@hostname" "talk username"). If someone is trying to talk to you
    and it disrupts your work, you may use the command "msg n" to refuse accepting
    messages. You may want to use "who" or "who''re" to determine the the users who
    are currently logged in. |


    | mc | Launch the "Midnight Commander" file manager (like "Norton Commander" for
    Linux). |


    | telnet server | Connect to another machine using the TELNET protocol. Use a
    remote machine name or IP address. You will be prompted for your login name and
    password--you must have an account on the remote machine to login. Telnet will
    connect you to another machine and let you operate it if you were sitting at its
    keyboard (almost). Telnet is not very secure--everything you type in open text,
    except your password! |


    | rlogin server | (=remote) Connect to another machine. The login name/password
    from your current session is used; if it fails you are prompted for a password.
    |


    | rsh server | (=remote) Yet another way to connect to a remote machine. The login
    name/password from your current session is used; if it fails you are prompted
    for a password. |'
  merge: -1
