    # # Widget Concepts


    This section discusses concepts that apply to all widgets, including memory management
    and certain special states widgets can be. It''s a "conceptual" section; however,
    the concepts are very important to practical topics covered in the book.


    # # Widget Life Cycle


    Widget resource and memory management is mostly automatic. However, there are
    a couple of "gotchas" to keep in mind if you''re doing more complicated things.


    ```

    #include <gtk/gtkidget.h>

    void gtk_widget_destroy(GtkWidget* widget);

    ```


    **Figure 3-21.** Widget Destruction


    A widget can be destroyed at any time by calling gtk_widget_destroy() (shown in
    Figure 3-21); destroying a widget frees any allocated memory and other resources.
    If the widget is inside a container, it is automatically removed from the container
    before it''s destroyed. It''s worth noting that gtk_widget_destroy() is simply
    another name for gtk_object_destroy(); GtkObjects have "virtual destructors" so
    they will always do the right thing.


    Internally, a reference count is maintained for all objects (actually, GtkObjects).
    Objects begin their life with a reference count of 1, even though they have not
    yet been referenced. At this stage the object is floating and is flagged as such.
    It is possible to remove the object''s reference; this is sinking the floating
    object and will destroy the object if the floating reference was the only one.


    Containers first reference and then sink widgets that are added to them. By sinking
    a widget, a container takes "ownership" of it for resource management purposes.
    Thus, the reference count of widget remains 1, but the object is no longer flagged
    as floating. When a widget is removed from a container—or the container is destroyed—its
    reference count is decremented by 1. When an object''s reference count reaches
    0, it is destroyed.


    In practice, sometimes you only have to destroy widgets when you remove a widget
    from a container; perhaps some element of your interface is optional or appears
    under certain circumstances. When you remove the widget (using gtk_container_remove()),
    it will be unreferenced, its reference count will drop to 0, and it will be destroyed.
    To avoid this situation, you should add a reference to the widget before you remove
    it. Figure 5-22 lists the functions to manipulate reference counts.'
