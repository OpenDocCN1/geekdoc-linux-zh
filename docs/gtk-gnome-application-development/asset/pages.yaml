  md: '# Entering the Main Loop


    Once everything is set up, two steps remain: you need to show the window on

    screen, and wait for user input.


    ```

    gtk_widget_show_all(window);

    gtk_main();

    ```


    ```

    return 0;

    ```


    gtk_widget_show_all() recursively calls gtk_widget_show() on a container

    its children. The following code would have the same effect in this case:


    ```

    gtk_widget_show(label);

    gtk_widget_show(button);

    gtk_widget_show(window);

    ```


    It''s necessary to show and every widget that you want to appear on the screen.

    The opposite operation is called gtk_widget_hide(); widgets start their life hidden,

    an can be re-hidden/show any number of times. It''s good practice to show all

    child widgets before showing the outermost container; otherwise, the user will
    see

    the container appear first, followed by its children. Widgets are not actually
    visible

    on the screen until their parent container is shown—the exception to the rule
    is GTK-

    Window, which has no parent.


    Once your widgets have been shown, you wait for the user to do something\with
    them. gtk_main() enters the GTK main loop; the main loop is event-driven.

    un triggers events which generally result in signals being emitted\and callbacks
    being called. gtk_main() blocks indefinitely, waiting for re-

    spponding input. The main loop is described in more detail in the section called

    Main Loop. Events and their relation to the main loop are described in the section

    called Events in Chapter 1.


    # More on Signals and Callbacks


    If either of the program connects to is emitted, the corresponding call-back is
    called. Our ''delete_event'' callback calls the gtk_main() event loop by

    oking gtk_main(); this causes gtk_main() to return, ending the program.

    The"clicked" callback replaces the text with the label in text. Notice

    that the label was set to the callback as the user, data_pointer provided to gtk_signal_connect().


    A common mistake is to assume that all signals use the same kind of callback-not
    true. Each signal requires a callback with a particular type and signature

    behavior. The "clicked" signal is a very common callback type; its callback

    points to the widget emitting and any user_data_pointer provided by the

    program. This callback must handle corruption is likely to


    "delete_event", on the other hand, is handling of a special case. It accepts three-uments;
    the first and last are analogous to "clicked", while the second is a pointer to

    the event which triggered the signal (events are messages from X to the application,

    reporting mouse movements, key presses, and the like). The ''delete_event'' callback

    returns a ''magic'' value—if FALSE is returned, GTK+ will destroy the window;
    if

    TRUE is returned, GTK+ might not. Return TRUE if you need to do something

    other than destroy the window; for example, you might want to warn the user about

    an unsaved document.'
