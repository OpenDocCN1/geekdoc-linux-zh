    # Drawing Methods


    The most important task of any canvas item is rendering itself onto the canvas.
    Rendering is a two-stage process for efficiency reasons. The first stage, implemented
    in a GnomeCanvasItem''s update method, is guaranteed to happen only once per item
    per rendering cycle; the idea is to avoid any expensive transformations or calculations
    in the update method. In the second stage, the canvas items render themselves
    to the screen. update implements stages two for antialased items, while the draw
    method stages two for GDK items. An item''s redraw or draw method may be invoked
    multiple times during a redraw.


    Rendering in a one-shot idle time is however, because the canvas receives an event
    or determines that a redraw is needed, it adds an item which removes itself after
    a single invocation. (In GTK+ events are pending and the execution is in the main
    loop—see the called Main Loop in Chapter 3 for details). The canvas maintains
    a list of redraw regions and adds each request when received, so it knows which
    areas to repaint when the handler is finally invoked.


    Canvas items carry a flag indicating whether they need to be updated. When an
    item "changes" (for example, if you set a new fill color for GnomeCanvasRect),
    it will call gnome_canvas_item_update() to set the "update_request" flag for itself
    and the groups that contain it, up to and including the root canvas group. The
    GnomeCanvas widget only holds a pointer to a single item, the root group; all
    other items are handled recursively when methods are invoked in the root group.)
    In its one-shot idle time, the canvas invokes the update method of the root canvas
    item if its update flag is set, then clears the flag so the update method will
    not be'
