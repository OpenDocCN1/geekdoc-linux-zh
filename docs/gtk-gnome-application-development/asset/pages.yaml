    # Showing, Hiding, and Mapping


    Four methods are provided to show and hide widgets. show and hide are rarely overridden;
    the default implementations always show. show_all and hide_all are overridden
    by container widgets; they show or hide the container and all its children. Their
    default implementation shows the widget itself: no-container should need to change
    this; "show" and "hide" are registered as signals, but the _all variants are not.


    The default implementation of show sets the GTK_VISIBLE flag, and maps the widget
    if mapped. When containers are mapped, they map any child with the GTK_VISIBLE
    flag set. Thus, the implementation ensures that a widget will be mapped eventually.
    (When a widget is finally mapped, the GTK_MAPPED flag is set in addition to GTK_VISIBLE).


    The hide implementation does the opposite: it unsets the GTK_VISIBLE flag, and
    unmaps the widget if GTK_MAPPED is set.


    The default map and unmap implementations are more frequently overridden; the
    default implementations would suffice for windowless widgets and widgets with
    a single window (widget->window). Widgets with additional subwindows or special
    needs may need to override defaults.


    The map method is for putting a widget on the screen. The default implementation
    sets the GTK_MAPPED flag, and calls gdk_window_show() on widget->window for widgets
    that have a window. If a widget has subwindows, or needs to take any special action
    when it appears on the screen, it must override the map method, or (if optionally)
    call to the map method because Gtk widgets are required to iterate over their
    children and map each widget with the GTK_VISIBLE flag set (i.e., each child widget
    that''s shown).


    The unmap method is the reverse of the map method: it undoes the map method did.
    By default, it hide widget->window. unsets the GTK_MAPPED flag and calls gdk_window_hide().
    Container widgets must override the method to unmap their children.


    Keep in mind that none of these methods are invoked directly; they are invoked
    by calling gtk_widget_show(), gtk_widget_map(), and so on. These functions may
    perform special actions before and after invocation. Here is a summary:


