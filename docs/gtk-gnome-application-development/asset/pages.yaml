    \nThe Standard Gnome items have only one signal, \"event\", which is emitted for\
    \ all types of event. The canvas widget preprocesses GDK events that it receives,\
    \ and forwards some to canvas items. It also synthesizes events. Remember that\
    \ X sends events only to Windows (GdkWindows), and canvas items do not have an\
    \ associated GdkWindow. Thus the canvas widget must act as intermediary. Here\
    \ are some of the actions it takes:\n\n+   * Coordinates are automatically converted\
    \ to world coordinates. For example, if a canvas item receives an event of type\
    \ GDK_BUTTON_PRESS, the x and y fields of the event will be in world coordinates.\
    \ (The raw event was received on the canvas's GdkWindow and thus had coordinates.)\n\
    * Enter/leave events are synthesized for canvas items as the mouse pointer moves\
    \ across the canvas.\n* Events are propagated up the canvas item hierarchy, until\
    \ some item \"event\" signal handler returns TRUE. This works just as it does\
    \ with GdkWidget; events are the first to the bottom or leaf canvas item, and\
    \ eventually make it up to the root item.\n* User-generated events are synthesized\
    \ to canvas items; many you might expect to receive on a GdkWindow, such expose\
    \ and configure events, are not forwarded to canvas items.\n\nThe canvas does\
    \ this behind the scenes, so item events intuitively and much like normal GDK\
    \ events.\n\nA canvas item event callback looks like this:\n\n```\nstatic void\n\
