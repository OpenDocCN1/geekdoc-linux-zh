  md: "# # Chapter 10. GDK Basics\n\nThis chapter will discuss GDK, the underpinning\
    \ of GTK+, and some of the occasions you might have to use it. To write custom\
    \ widgets and canvas items, you will need to understand a few of these low-level\
    \ details. Like chapters two and three, this chapter is a quick summary that doesn't\
    \ hold your hand; there is no way to cover all of GDK in a single chapter. However,\
    \ the chapter will try to cover the important concepts and data types of GDK,\
    \ and should be a useful reference on topics, if details come up in later chapters,\
    \ you can use this background to understand them. This chapter does not attempt\
    \ to exhaustively catalog GDK's API.\n\n# # GDK and Xlib\n\nThe Window System\
    \ comes with a low-level and unpleasant library called Xlib. Almost every function\
    \ in GDK is a thin wrapper around a Xlib function; but some of the complexity\
    \ (and functionality) of Xlib are hidden to simplify programming and make it port\
    \ to other window systems. (There is a port of GDK to Windows available.) The\
    \ concealed Xlib functionality rarely be of interest to application programmers;\
    \ for example, features used by window managers are not exposed in GDK. If necessary,\
    \ you can use Xlib in your application by including the special `gdk/gdx.h` header\
    \ file.(Check the GDK source code to see how to extract the low-level Xlib structures\
    \ from GDK wrappers.)\n\nIf you need extracting details on a GDK function, you\
    \ can typically glance at the source to determine the Xlib function it wraps,\
    \ and read the main page for the Xlib function. Here is the implementation of\
    \ `gdk_draw_point()` :\n\n```\nvoid\ngdk_draw_point(GdkWindow *drawable,\n   \
    \             GdkGC *gc,\n                int x,\n                int y)\n{\n\
    \  GdkWindowPrivate drawable_private;\n  GdkGCPrivate *gc_private;\n\n  g_return_fail(drawable\
    \ == NULL);\n    return;\n  g_return_fail(gc == NULL);\n    return;\n\n  drawable_private\
    \ = (GdkWindowPrivate*)drawable;\n  if (drawable_private->destroyed)\n    return;\n\
    \  gc_private = (GdkGCPrivate*)gc;\n\n  XDrawPoint(drawable_private->display,\n\
    \             drawable_private->window,\n             gc_private->xgc, x, y);\n\
    }\n```\n\nEach data structure has its \"private\" version which contains information\
    \ relating to the particular window system GDK is used on; this is to keep windowsystem-specific\
    \ declarations out of the `gdk/gdk.h` header file. The private version of each\
    \ data structure contains a wrapped Xlib data structure, which is passed to XDrawPoint().\
    \ So the XDrawPoint() documentation will also apply to `gdk_draw_point()`."
