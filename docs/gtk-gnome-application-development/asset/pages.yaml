    # Drawing


    The relationship between draw, draw_focus, draw_default, and event_expose was
    discussed in the section Drawing. All four class functions are registered as draw
    handlers for a signal of the same name. The ''draw'' signal redraws a portion
    of the widget; it is managed by GTK+ or by widget implementations.


    Widget implementations should emit the ''draw'' signal when in response to focus
    events; this would draw on a frame indicating that the widget is focused. gtk_window_set_default()
    emits the "draw" signal for both the window default status and the widget gaining
    it. gtk_widget_grab_default() calls gtk_window_set_default(). Only widgets with
    the GTK_CAN_FOCUS or GTK_CAN_DEFAULT flag are set to worry about the draw and
    draw_default methods. These fairly should be set in the widget''s initialization
    function.


    The only method that has a default implementation in gdk_draw; the default implementation
    synthesizes the widget''s entry allocation. This allows you to write an event
    handler that handles the draw signal.


    GTK+ normally emits the ''draw'' signal in action. That is, it is a list of widgets
    (and regions of them) that need to be redrawn; when no events are pending, the
    GTK main loop runs an idle function that traverses the list and emits the ''draw''
    signal for each widget. Redraw areas are merged as much as possible to avoid multiple
    redraws, and the idle function is removed after it runs once. This arrangement
    minimizes the number of redraws and flicker.


