    # Iterating Over Children\n\nContainers have a formal method for iterating over\
    \ their children; GtkContainer's default methods use forall, for they know about\
    \ the data members in classes' instance. The formal method invokes a callback\
    \ on each child, with the provided callback as the second argument. Obviously\
    \ it's going to be trivial for GtkBin:\n\n```\nstatic void\ngtk_bin_forall (GtkContainer\
    \ *container,\n    boolean include_internals,\n    GtkCallback callback,\n   \
    \ gpointer callback_data)\n\nGtkBin *bin;\ng_return_if_fail (container != NULL);\n\
    gtk_return_if_fail (GTK_BIN (container));\ngtk_return_if_fail (callback != NULL);\n\
    \nbin = GTK_BIN (container);\nif (bin->child)\n    callback (bin->child, callback_data);\n\
    ```\n\nYou may notice that GtkBin ignores the `include_internals` argument. Some\
    \ containers have \"incidental\" widgets added to the user-provided children they\
    \ are primarily designed to hold. For example, GtkNotebook uses buttons to fill\
    \ each column in the list. These internal widgets must be included in the iteration\
    \ in many cases; for example, when drawing each child in a container, or destroying\
    \ each child in a container. However, some operations only operate on the \"primary\"\
    \ children, such as the pages in GtkNotebook. The include_internals flag indicates\
    \ whether to invoke the callback on incidental widgets.\n\nConvenience functions\
    \ are provided that invoke the formal method; these are used by application authors\
    \ as well as GtkContainer. gtk_container_foreach() iterates over only the primary\
    \ children of a container, while gtk_container_forall() iterates over all children.\n\
    \n# Child Type\n\nThe child_type method returns the type of children a container\
