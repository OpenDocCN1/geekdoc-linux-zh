    \nTypically, operations such as deleting or quitting an application have \"Cancel\"\
    \ or \"No\" as the dialogs; that allows the user to enter text or other information\
    \ have \"OK\" as the default. Remember that many window managers will focus windows\
    \ when they pop up, so keystrokes intend to go to your dialog instead. If your\
    \ dialog goes \"delete all my files\" as the default button, you will have it\
    \ back.\n\nEditable widgets make the \"activate\" signal when pressed. Typically\
