  md: '# Input Functions


    Input functions are handled on the GDK level. They are invoked when a file descriptor
    is ready for reading or writing. They''re especially useful for networked applications.


    To add an input function, you specify the file descriptor to monitor, the state
    you want to wait for (ready for reading or writing), and a callback/data pair.
    Figure 3-2 shows the API. Input functions can be removed using the tag returned
    by `gdk_input_add()`. Unlike timeout, and idle functions, it should be safe to
    call `gdk_input_remove()` from inside the input function; GTK+ will not be in
    the midst of iterating over the list of input functions.


    To specify the condition to wait for, use the GDKInputCondition flags: GTK_INPUT_READ,
    GTK_INPUT_EXCEPTION. You can OR one or more flags together; correspond to the
    three file descriptor sets passed to the `select()` system call; if any condition
    is met (possibly a subset of those you were watching for), the input function
    is invoked.


    The callback should look like this:


    ```

    typedef void (*GdkInputFunction)(gpointer data, gint source_fd, GdkInputCondition
    condition);

    ```


    It receives your callback, the file descriptor being watched, and the conditions
    that were met (possibly a subset of those you were watching for).


    ```

    #include <gdk/gdk.h>

    int gdk_input_add(gint source_fd, GdkInputCondition condition, GdkInputFunction
    function, gpointer data);

    void gdk_input_remove(gint tag);

    ```


    Figure 3-32. Input Functions'
