    # Using the Canvas


    GnomeCanvas is easy to use; this is its virtue compared to GtkDrawingArea or some
    other low-level approach. This section describes how to create a canvas, and work
    with canvas items. It ends with a programming example.


    # Preparing the GnomeCanvas Widget


    The first decision you have to make is whether to use the canvas in GDK mode or
    antialised mode. When you create a canvas, you must specify the mode you want;
    there is no way to change it later. gnome_canvas_new() creates a GDK canvas. gnome_canvas_new_aa()
    creates an antialised canvas. These are shown in Figure 12-5.


    Sometimes it matters which visual and colormap the canvas will use. In particular:


    +   - In GDK, if you want to use the GnomeCanvasImage to display images, you must
    use Imlib''s visual and colormap. GnomeCanvasImage uses Imlib to render images.

    - In antialised mode, GDK''s RGB buffer rendering functions (see the section RGB
    Buffers in chapter 10) are used to copy the RGB buffer to the screen. You must
    use the visual and colormap from the GDK module.


    To create a canvas with a non-default visual and colormap, gtk_widget_push_visual()
    and gtk_widget_push_colormap() are used. Here is the code to create a canvas that
    supports the image:


    ```

    GtkWidget* canvas;

    gtk_widget_push_visual(gdk_imlib_get_visual());

    gtkk_widget_push_colormap(gdk_imlib_get_colormap());

    canvas = gnome_canvas_new();

    gtk_widget_pop_visual();

    gtk_widget_pop_colormap();

    ```


