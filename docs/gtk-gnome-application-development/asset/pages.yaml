  md: '# Chapter 12. GnomeCanvas


    the buffer represents—the buffer region is defined by an X offset, Y offset, width
    and height. The X and Y offsets are in canvas coordinates, and are equivalent
    to (0,0) in buffer coordinates. To convert from canvas to buffer coordinates,
    subtract the offset. Buffer coordinates are only valid from (0,0) to the maximum
    width and height of the buffer.


    +   * Window coordinates are rarely used. The canvas essentially copies each temporary
    buffer to a GdkWindow (to prepare,it copies them to GTK_LAYOUT(canvas)-bin_window).
    Window coordinates are relative to this GdkWindow. In some cases you might want
    to draw the window directly rather than using a canvas, or you might want to respond
    to an event on the window (such as a drag-and-drop). Then you need to convert
    from window coordinates to one of the other coordinate systems.


    When using existing canvas, you will mostly be interested in world and item coordinates.
    When writing your items, you will also need to use canvas and buffer coordinates.


    There are two ways to convert between the various coordinate systems; one way
    is to use an affine directly—this is described in the next section. The easy way
    is to use one of the convenience functions provided for the purpose, shown in
    Figure 12-2. Conversion between canvas and item coordinates requires you to convert
    world coordinates first as an intermediate step. There is no function to convert
    to or from buffer coordinates, because this is a simple matter of subtracting
    the offset from the canvas coordinates (canvas to buffer), or adding the buffer
    offsets to the buffer (buffer to canvas).


