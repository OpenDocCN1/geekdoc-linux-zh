  md: '# Chapter 14. GTK+/Gnome Object Hierarchy


    This appendix is a quick tour of the GTK+ and Gnome object hierarchy. It includes
    GObject and all subclasses from both libraries, a brief description of each, and
    the header files the objects are found in. It also includes screenshots of widgets,
    to help you find the correct widget for a given task. The testgtk and test-gnome
    programs that come with the GTK+ and Gnome libraries are also a good way to find
    widgets; many of the screenshots in this appendix are from.


    The specific header file containing each object is listed; however, all GTK+ header
    files can be included with the /gtk/gtk.h convenience header. All GTK+ and Gnome
    headers can be included with the gnome.h header.


    Some objects are described as "abstract base classes—this means that only the
    subclasses of the object can be instantiated, but all of the subclasses through
    the base class interface.


    As a general rule, you should try to use the most specific object possible. That
    is, you could use GtkWindow for your application window, GnomeApp is a better
    choice; you could roll your own dialog from GnomeDialog, but GnomeAbout is a better
    choice. This maximizes UI consistency and minimizes your effort.


    Both GTK and Gnome come with "test" programs, called testgtk and test-gnome respectively.
    These programs are used to test the widgets and other features in each library.
    They''re also an excellent source of sample code, and a good way to browse the
    available widgets and find the one you need.


    # Hierarchy Summary


    ```

    GtkBin

    |

    +GtkButton

    |

    +GnomeColorPicker

    |

    +GnomeFontPicker

    |

    +GnomeHRef

    |

    +GtkToggleButton

    |

    +GtkOptionButton

    ```


    This would be it for GtkObject. The parent of the object (if any) is shown, the
    object itself (possibly highlighted or in bold), then the immediate children of
    the object, if any. The second element that might be nice: some of the objects
    are "immature" or "unsafe", which is a sort of mild warning suggesting programmers
    that they may not want to use the object. It might be nice to have some sort of
    icon or margin text used to mark these objects.


    ```

    GtkObject

    |

    +GtkWidget

    ```'
