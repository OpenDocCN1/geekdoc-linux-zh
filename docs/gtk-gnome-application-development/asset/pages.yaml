  md: 'Chapter 16. Frequently Asked Questions


    # Why does my memory debugging tool memory leaks in glib?


    glib does not call malloc every time it needs a new node in a data structure.
    If it does, linked lists (for example) would be substantially slower. Instead,
    glib caches pools of equal-sized "memory chunks" for use in these data structures.
    Since the chunks are still available for recycling when your program exits, they
    are not freed (i.d. the program will free the memory, but tools such as cmallocind
    or Helgrind will report it as a memory leak).


    To get around this, you can plug a new GAllocator into most of the data structures.
    AAllocator is a pool of memory as described above. You create an allocator manually;
    then you can free the allocator when you are finished. Figure 16-1 summarizes
    the relevant functions for GList. A quick glance through glib.h will reveal the
    corresponding functions for other data structures.


    The name argument to g_allocator_new() is used in debugging messages; the n_prealloc
    argument is passed through to g_mem_chunk_new().


    ```

    #include <glib.h>


    void g_list_push_allocator(GAllocator* allocator);

    void g_list_pop_allocator(void);

    GAllocator* g_allocator_new(gchar* name, guint n_prealloc);

    void g_allocator_free(GAllocator* allocator);

    ```


    Figure 16-1. Functions for replacing the GList memory allocator


    # I get a bunch of "assertion failed" warnings from GTK+. What causes these?


    These come from the g_return_if_fail() checks at the beginning of many GTK+ functions.
    (They only appear if your copy of GTK+ was compiled with debugging turning on—and
    hopefully if it was what you are writing an application.) You common one: if you
    accidentally accessed a destroyed widget or object, you will have a pointer to
    memory garbage. Among other things, this means the tag well will be invalid; so
    GTK+''s runtime type checks will fail.


    # Why are some things in Gnome rather than GTK+?


    Historical accident, mostly. Sometimes there is a reason; for example, GTK+ does
    not include gtk_imlib, so does not include any widgets that rely on it. In very
    general terms, GTK+ imposes less "policy" than Gnome; some Gnome widgets are deliberately
    to keep people from creating inconsistent user interface. GTK+ does not take this
    approach. Finally, some of the Gnome widgets were considered "experimental" to
    do in GTK+ at the time. However, the core Gnome widgets discussed in this book
    are not in this category.


    376'
