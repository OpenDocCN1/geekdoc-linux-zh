  md: '# Chapter 10. GDK Basics


    +   - GDK_CAP_NOT_LAST specifies that the last pixel is skipped for one-pixel
    lines.

    It is otherwise the same as GDK_CAP_BUT.

    - GDK_CAP_ROUND draws a small arc on the end of the line, extending beyond the
    line''s endpoint. The center of the arc is on the endpoint, and the radius of
    the arc is half the width of the line. For one-pixel lines, it has no effect (since
    there is no way to draw a one-pixel arc).

    - GDK_CAP_PROJECTING extends the line past its endpoint by half-its its width.

    It has no effect on one-pixel lines.


    The join-style parameter affects how lines are connected to one another, when
    drawing a polygon or drawing multiple lines in one function call. If you think
    of lines as long, rectangles, it is clear that they do not connect smoothly; there
    is a "notch" where the two endpoints come together. The three join styles fill
    in this notch:


