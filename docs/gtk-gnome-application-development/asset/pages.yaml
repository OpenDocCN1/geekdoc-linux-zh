    # GnomePropertyBox


    GnomePropertyBox is used for application preferences, or to edit the properties
    of a user-visible object. Its dialog with a GtkNotebook inside and four buttons:
    "OK," "Apply," "Close," and "Help." The "OK" button is equivalent in all respects
    to clicking "Apply" followed by "Close." "Apply" should immediately make any changes
    the user has requested with the widgets you placed in the GnomePropertyBox. Surprisingly,
    "Help" should display "OK" and "Close" are handled automatically


    You don''t need to deal with the property box''s buttons directly; instead: GnomePropertyBox
    emits "apply" and "help" signals. Handles for this could look like:


    ```

    void handler(GtkWidget* property, int page_num, gpointer data) {

    ```


    page_num is the currently-page of the GtkNotebook inside the dialog. Gtkpages
    are numbered from front to back, starting with 0; the front page is the first
    one you add to the notebook. For "help," the page number you provide context-sensitive
    help. When the user clicks the "Apply" or "OK" button, the "apply" signal is emitted
    once per page, then emitted a final time with -1 as the page_num value. Multiple
    emissions of "apply" are something of an anachronism, because it has become facto
    standard behavior to simply apply all pages when the -1 page number is received.


    To create a property box, you first create the dialog, then create each page and
    add it. A GnomePropertyBox is straightforward; gnome_property_box_new() takes
    no arguments.


    ```

    #include <libgnome-property-box.h>

    GtkWidget* gnome_property_box_new(void);

