  md: "# Chapter 10. CDK Basics\n\nThe first three members are the standard members\
    \ from GdkEvent; the time and state members are identical to those found in GdkEventButton\n\
    keyval contains a keysym. The X keeps a global translation table which converts\
    \ combinations of physical keys and modifiers to keysyms. For example, the key\
    \ marked \"A\" on the keyboard is the keysym GDK_a without modifiers, GDK_A with\
    \ shift down. Users can change the physical-keysym mapping; for example, they\
    \ may rearrange their keys to create a Dvorak keyboard (more commonly, they may\
    \ swap Control and Caps Lock, or use the Alt as a Meta key). Keysyms are defined\
    \ in gdk/gkeysym.h. You will need to include this file in your code.\n\nKeysyms\
    \ are matched with a string representation. For example, the GDK_a keysym maps\
    \ to the string \"a\". The keysym-to-string mapping. The string member of GdkEvent\
    \ contains a keysym's representation, and the length member contains the string's\
    \ length. Keep in mind that the length may be 0 (many non-alphanumeric keys have\
    \ no string representation default). If you are familiar with Xlib, the string\
    \ is simply the result of XLookupString() or XKeysymName(). If you aren't familiar\
    \ with Xlib, the man(3) pages for these functions may be helpful.\n\nIn general,\
    \ you are reading key events in order to create a textual representation of what\
    \ the user is typing, you should use the string field of GdkEventGtkKeyEvent and\
    \ Gtk use the string field, for example. A word processor would also read this\
    \ field. If you are reading events for some other reason (such as keyboard shortcuts),\
    \ or if you are interested in keys with no string representation (default as function\
    \ or arrow keys), you will need to use the keyval field and the keysym defined\
    \ in gdk/gkeysym.h.\n\nHere is a sample event callback demonstrating how to extract\
    \ information from a GdkWidget. It would be useful for connection to the \"key_press_event\"\
    \ signal of any GtkWidget:\n\n```\nstatic gint\nkey_press_cb(GtkWidget* widget,\
    \ GdkEventKey* event, gpointer data)\n{\n\tif (event->length > 0) {\n\t\tprintf(\"\
    %s\\n\", event->string);\n\t}\n\n\tprintf(\"The name of this keysym is '%s\\n\"\
    ,\n\tgdk_keyval_name(event->keyval));\n\n\tswitch (event->keyval) {\n\t\\case\
    \ Gdk_Home:\n\t\tprintf(\"The Home key was pressed.\\n\");\n\t\t\tbreak;\n\t\\\
    case Gdk_Up:\n\t\tprintf(\"The Up arrow key was pressed.\\n\");\n\t\t\tbreak;\n\
    \t\tdefault:\n\t\t\tbreak;\n\t}\n\ntif (gdk_keyval_is_uppercase(event->keyval))\
    \ {\n\t\tprintf(\"A non-uppercase key was pressed.\\n\");\n\t}\n```\n\n182"
