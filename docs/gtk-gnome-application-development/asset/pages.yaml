  md: "# Chapter 9. The GTK+ Object and Type System\n\n+   - All arguments must be\
    \ either readable or writable.\n- GTK_ARG_CONSTRUCT arguments must be both readable\
    \ and writable.\n- GTK_ARG_CONSTRUCT_ONLY arguments must be writable.\n- GTK_ARG_CHILD_ARG\
    \ should not be used outside of container-style object implementations; used internally\
    \ by the GtkContainer child argument functions.\n\nThe fourth and final argument\
    \ of `gtk_object_add_arg_type()` is an argument ID that can be any integer except\
    \ 0, but it is custom to use a private implementation in the object implementation's\
    \ .c file. GtkObject has two functions any subclass with arguments must implement\
    \ one to get arguments for subclass, and one to set them. These functions are\
    \ passed the argument ID, so they know which argument to get or set Argument ID\
    \ reduces the need for string comparisons, increasing the efficiency of argument\
    \ manipulation.\n\nFor example, GtkContainer defines these functions:\n\n```\n\
    static void gtk_container_get_arg(GtkObject* object,\n    GtkArg* arg,\n    guint\
    \ arg_id);\nstatic void gtk_container_set_arg(GtkObject* object,\n    GtkArg*\
    \ arg,\n    guint arg_id);\n```\n\nIt uses enumeration to create its argument\
    \ IDs:\n\n```\nenum {\n    ARG_0,                  /* Skip 0, an invalid argument\
    \ ID */\n    ARG_BORDER_WIDTH,\n    ARG_RESIZE_MODE,\n    ARG_CHILD\n};\n```\n\
    \nIt registers its arguments in `gtk_container_class_init()` as follows:\n\n```\n\
    gtk_object_add_arg_type(\"GtkContainer::border_width\",\n    GTK_TYPE_INT,\n \
    \   GTK_ARG_READWRITE,\n    ARG_BORDER_WIDTH);\ngtk_object_add_arg_type(\"GtkContainer::resize_mode\"\
    ,\n    GTK_TYPE_RESIZE_MODE,\n    GTK_ARG_READWRITE,\n    ARG_RESIZE_MODE);\n\
    gtk_object_add_arg_type(\"GtkContainer::child\",\n    GTK_TYPE_WIDGET,\n    GTK_ARG_WRITABLE,\n\
    \    ARG_CHILD);\n```\n\n`gtk_container_set_arg()` and `gtk_container_get_arg()`\
    \ are installed in the class struct:\n\n```\nobject_class->get_arg = gtk_container_get_arg;\n\
    object_class->set_arg = gtk_container_set_arg;\n```\n\n143"
