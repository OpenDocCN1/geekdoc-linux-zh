    # ### Figure 2-1. Familiar C Macros


    There are also many macros to use glib, such are the portable gpointer-to-gint
    and gpointer-to-guint conversions shown in Figure 2-2.

    Most of glib''s data structures are designed to store a gpointer. If you want
    to store pointers to dynamically allocated objects, this is the right thing. However,
    sometimes you want to store a list of integers without having to dynamically allocate
    them. The C standard does not strictly guarantee it, it is possible to store a
    gint or guint variable on the wide range of platforms it has been ported to; in
    some cases, an intermediate cast is required. The macros in Figure 2-2 abstract
    the presence of the cast.

    Here''s an example:


    ```

    gint my_int;

    gpointer my_pointer;


    my_int = 5;

    my_pointer = GINT_TO_POINTER(my_int);

    printf("We are storing %d\n", GPOINTER_TO_INT(my_pointer));

    ```


    Be careful, though; these macros allow you to store an integer in a pointer, but
    storing a pointer in an integer will *not* work. To do that properly, you must
    store the pointer in a list. (It''s undoubtedly a bad idea to do so, however.)


    ```

    #include <glib.h>

    nGINT_TO_POINTER(p);

    GPOINTER_TO_INT(p);

    GUINT_TO_POINTER(p);

    GPOINTER_TO_GUINT(p);

    ```


    # ### Figure 2-2. Macros for storing integers in pointers


    # ## Debugging Macros


    glib has a set of macros you can use to enforce invariants and preconditions in
    your code. GTK+ uses these liberally—one of the reasons it''s stable and easy
    to use. They all disappear when you define G_DISABLE_CHECKS or G_DISABLE_ASSERT,
    so there''s no no performance penalty in production code. Using these liberally
    is a very good idea. You''ll find bugs much faster if you do. You can add assertions
    and checks whenever you find a bug so that it doesn''t reappear in future versions—this
    complements a regression suite. Checks are especially useful when the code you''re
    writing will be used as a black box by other programmers, users will immediately
    know when and how they''ve misused your code.'
