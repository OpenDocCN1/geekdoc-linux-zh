- img_proc: true
  md: '# Header File


    gtk+gtmisc.h


    # Description


    The descriptively-named (or padding) of GtkMisc abstract base class allows you
    to set the "alignment" of its subclasses. Alignment is a float between 0.0 and
    1.0, where 0.0 is left-justified, 0.5 is centered, and 1.0 is right-justified.
    Alignment only matters if a GtkMisc receives a size allocation larger than its
    size request; the alignment matches the natural bounding box of the widget within
    its actual bounding box. Padding is a number of pixels to add to the widget''s
    size request. The widget will then leave those pixels blank.


    Widgets that do not derive from GtkMisc can be made "alignable" in the same way
    by placing them in a GtkAlignment container.


    # GtkLabel


    # Library


    GTK+


    # Header File


    gtk/gtklabel.h


    # Description


    GtkLabel simply displays a text string. If the text contains newlines, GtkLabel
    displays multiple lines. Labels honor the alignment parameter from their parent
    class (GtkMisc) you can use to center the text, or move it to the left or right.
    Alignment is not the same as justification. Justification defines the position
    of multiple lines respect to each other. Left-justified means each line starts
    in the same place, right-justified means each ends in the same place, center-centered
    means each centered around the same imaginary line. Justification has no meaning
    for one-line labels. Alignment set with gtk_widget_set_alignment() positions the
    entire block of text within its size allocation alignment only if the label receives
    enough space to hold the text block). Gtk_NO_WINDOW widgets (which means they
    don''t receive events and draw on their parent''s background).


