  md: '# GtkObject and the Type System


    Before delving further into GtkObject, you will need more details on GTK+’s type
    system. The type system is used in many contexts:


    +   - It allows signals and callbacks with any signature to be dynamically registered
    and dynamically queried. Function argument lists can be constructed at runtime.

    - It allows object attributes (values that can "get" or "set") to be dynamically
    queried and manipulated.

    - It exports information about enumerations and bitfields (lists of permitted
    values, and human-readable names).

    - It is possible to identify types at runtime and traverse the object class hierarchy.


    Because of its type system, GTK+ is particularly easy to manipulate from dynamically-interactive
    languages. There are bindings for nearly all popular languages, and the bindings
    for GTK+ already include much of the needed functionality (can be handled generically
    so the amount of glue code is reduced). You can find a complete list of functions
    for querying and using GTK+’s type system in `gtk/typeutils.h`; most of these
    are not used in applications. Only functions of general interest are described
    in this book.


    GTK+ has a so-called fundamental types that are automatically registered during
    `gtk_init()` (or `gnome_init()`). The fundamental types are all the primitive
    C types, such as `GTK_SCALAR`, and `GTK_TYPE_OBJECT`. Fundamental types are the
    base types understood by the GTK+ type system; for example, the type of `GTK_TYPE_ENUM`,
    and the type of any `GtkObject` subclass is `GTK_TYPE_OBJECT`. Fundamental types
    are supposed to cover all "special cases" in the GTK+ type system; all types are
    ultimately derived from some fundamental type. A type is extracted from a GtkObject
    using `G_TYPE_TYPE()`. The most fundamental types are shown in Table 9-1.


    There is a second category of GType values: builtin types are registered by GTK+
    and are always available. Builtin types include enumerations, flags, and some
    (GdkWindow, and GdkMenuGroup, for example). Builtin types are different from fundamental
    types because the GTK object system does not use them for the purpose of registering
    and setting argument values, they can be treated as fundamental types. They are
    somewhat distinguished from user-registered enumeration or flag types. The difference
    between builtin types and user types is the time of registration.


    Builtin types are accessible via macros that come with GTK+ and Gnome. These begin
    with `GTK_TYPE_`, as in `GTK_TYPE_WINDOW`, `GTK_TYPE_GDK_WINDOW`, `GTK_TYPE_RELIEF_STYLE`,
    `GN_DIALOG`. As you can see, the name of the type is derived from the `GtkObject`
    struct, or enumeration; if the object name is registered with "Gtk+", the examples
    above map to the `GdkWindow` widget, GdkWindow struct, GdkReliefStyle enumeration,
    and GnomeDialog widget, respectively.


    The final category of GType values consists of the registered GtkObject types.
    They are registered the first time the `_get_type()` routine for each object is
    called.


    Table 9-1. The GTK+ Fundamental Types


    | GtkType Constant | Corresponding C |

    |---|---|

    | GTK_TYPE_INVALID | None |'
