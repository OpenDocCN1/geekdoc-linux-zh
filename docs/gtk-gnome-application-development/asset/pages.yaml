  md: '# Chapter 10. GDK Basics


    A window''s GdkWindowClass can have one of two values:


    +   - GDK_INPUT_OUTPUT is a normal window.


    +   - GDK_INPUT_ONLY is a window that has a position and receives events but has
    no visual representation. Its children must be input only. You can set the cursor
    and other attributes for an input only window, but there is no way to draw to
    it (it''s invisible). Input-only windows are occasionally useful to capture events
    or change the cursor in a region that overlaps two normal windows.


    A visual describes the color-handling characteristics of a display; a colormap
    you can use to draw: see the section Visuals and Colormaps gives details on visuals
    and colormaps.


    Windows can be one of several different types, specified by the GdkWindowType
    enumeration:


    +   - GDK_WINDOW_ROOT is the type of the GDK wrapper for the root window, created
    at initialization time.


    +   - GDK_WINDOW_TOPLEVEL is a toplevel window; the parent argument to gdk_window_new()
    should be NULL in this case. GDK automatically uses the root window as the window''s
    parent.


    +   - GDK_WINDOW_CHILD is a subwindow within a toplevel window.


    +   - GDK_WINDOW_DIALOG is essentially the same as a toplevel window; its parent
    should be NULL and GDK will substitute the root window. A hint will be set to
    tell the window manager the window is a dialog; some window managers take this
    into account.


    +   - GDK_WINDOW_TEMP is used for pop menus and the like; it''s a window that
    will exist briefly. It''s a toplevel window, so its parent should be NULL; always
    override redraw and their cursor is always the same as their parent''s. They will
    ignore those elements of the attributes struct.


    +   - GDK_WINDOW_PIMAP is not a window at all; GdkPixmap and Gdk are always treated
    the same way, so Gdk uses the same struct to represent a Drawable. They can be
    considered kinds of GdkDrawable. See the section Drawables and Pixmaps.


    Only GDK_WINDOW_ROOT, TOPLEVEL, GDK_WINDOW_CHILD, GDK_WINDOW_TEMP, and GDK_WINDOW_DIALOG
    are valid for gdk_window_new(). Library managers do not create a GDK_WINDOW_ROOT.
    Pixmaps (GDK_WINDOW_PIMAP) are created with gdk_pixmap_new(). Foreign windows
    (GDK_WINDOW_FOREIGN) are X windows created out of GDK and wrapped using gdk_window_foreign_new()
    (declared in gdk/gdk.h, since you will need this function if you are using GLib
    directly).


    The cursor field specifies the mouse pointer (cursor) to use in this window; see
    the section The Mouse Pointer for information about cursors.


    The "class hint" is described in the section Setting Window Class Hints in chapter
    6. When writing windows, you will not use the class hint. It is only relevant
    for toplevel windows; GTK+ provides gtk_window_set_wmclass() so application authors
    can set it to something.


    The last field in GdkWindowAttr determines whether the window is override rect.\
    Normally, windows managers intercept all requests to show, hide, or resize a toplevel
    window. They can then redraw or cancel these requests, to win


