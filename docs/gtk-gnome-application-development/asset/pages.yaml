    GnomeApp has a single "content area" in the center, where you place the functionality
    of your application. On all four sides of this central area, you can add toolbars,
    menus, and statusbars. Figure 6-3 lists the relevant functions.


    These functions should be self-explanatory. They simply implement the widget you
    give in the appropriate place on the GnomeApp. There are easy ways to create the
    menu, toolbar, and statusbar; the remainder of this chapter describes...


    ```

    #include <libgnomeui/gnome-app.h>

