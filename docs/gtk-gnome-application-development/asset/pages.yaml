    \ need_resize : 1;\n    guint resize_mode : 2;\n\nGList *resize_widgets;\n```\n\
    \nThe focus-child is the member in the container with the keyboard focus; it can\
    \ be NULL if child has the focus. The GtkContainer implementation handles setting\
    \ and unsettling this child. The border_width is a width in pixels to add the\
    \ container's size on all sides; the container will also subtract this value from\
    \ its allocation. In other words, the width is a blank space around the container.\
    \ Library users set the border_width with gtk_container_set_border_width();\n\
    GtkContainer subclasses must honor the value in their size_request and size_allocate\
    \ implementations.\n\nThe need_resize, resize_mode, and resize_widgets are implementation\
    \ details that subclasses should not have to read or modify. These fields are\
    \ used to implement gtk_widget_queue_resize(); when a resize is requested for\
    \ a widget, the GtkContainer implementation ensures the size negotiation process\
    \ (requisition/allocation) will take a place in a one-shot idle helper. Subclasses\
    \ of GtkContainer simply implement size_request and size_allocate, and everything\
    \ else.\n\n# The GtkContainer Class Struct\n\n```\ntypedef struct _GtkContainerClass\
    \ GtkContainerClass;\n\nstruct _GtkContainerClass {\n    GtkWidget parent;\n \
    \   int n_child_args;\n    void (* add) (GtkContainer *container, GtkWidget *widget);\n\
    \    void (* remove) (GtkContainer *container, GtkWidget *widget);\n    void (*\
    \ check_resize) (GtkContainer *container);\n    void (* forall) (GtkContainer\
