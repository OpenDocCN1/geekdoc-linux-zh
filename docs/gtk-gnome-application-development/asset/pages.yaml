    # Miscellaneous Objects


    # GnomeClient


    # Library


    Gnome


    # Header File


    libgnomeui/gnome-client.h


    # Description


    GnomeClient is a GtkObject which conceals the details of session management and
    provides a nice session management API for Gnome applications. See the section
    called Session Management in Chapter 5 for more information.


    # GnomeEntryEdit


    # Library


    Gnome


    # Header File


    libgnomeui/gnome-dentry-edit.h


    # Description


    GnomeEntryEdit is a very specialized object; it is a sort of "widget manager"
    that keeps and tracks of two widgets, "easy" and an "advanced" page. The two pages
    combine to let the user edit a Gnome.desktop entry, as described in the section
    called .desktop.Entries in Chapter 4. GnomeEntryEdit is intended to be used in
    conjunction with a preexisting GtkNotebook. It isn''t a GtkNotebook subclass itself,
    but you might want to use the GtkNotebook in a GnomePropertyBox. The Gnome panel
    and the Gnome menu editor use this widget.'
