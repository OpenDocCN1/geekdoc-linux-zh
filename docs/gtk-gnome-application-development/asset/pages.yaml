    # Figure 7-1 GnomeDialogConstructor


    The GnomeDialog API numbers the buttons you add starting with 0; you use these
    numbers to refer to the buttons later, since you don''t have a pointer to the
    automatically-created widgets. In fact, the OK button is 0, and the Cancel button
    is 1. (Note that this is standard Gnome practice—OK or Yes goes first, Cancel
    or No. In gnome-idefs.h contains the macros GNOME_YES, GNOME_OK, GNOME_NO, which
    represent the button numbers in a two-button dialog)


    The above example, which specifies buttons called "OK" and "Cancel", is not quite
    correct for production code. Gnome provides a set of "stock buttons" for common
    button names. These ensure everyone uses "OK" instead of "OK" or "OK!''; they
    allow translators to translate common strings only once; they insert icons within
    the buttons, making them more attractive and recognizable to users. You should
    always use stock buttons if possible.


    You can use stock buttons in gnome_dialog_new(). Simply substitute the stock button
    for macros for the button names:


    ```

    dialog = gnome_dialog_new("My Dialog Title",

    GNOME_STOCK_BUTTON_OK,

    GNOME_STOCK_BUTTON_CANCEL,

    NULL);

    ```


    Gnome includes many things, stock menu items, and stock pixmaps—it''s a good idea
    to check these out before you try to reinvent the wheel. There''s a complete list
    in libgnoui/gnome-stock.h.


    # Filling in the Dialog


    After creating a dialog, you''ll want to put something inside. If you just want
    a label inside, you should use GnomeMessageBox or one of the routines (such as
    gnome_dialog()) instead of constructing the dialog manually. Otherwise, filling
    a dialog is very simple:


    ```

    GtkWidget*;

    /* create dialog as shown earlier ... */

    button = gnome_dialog_new_with_label("Push Me");


    gk_box_pack_start(GTK_BOX(GNOME_DIALOG(dialog))->vbox),

    button,

    TRUE,

    TRUE,

    0);

    ```'
