  md: '# # GtkStatusBar


    GtkStatusBar has no default text or "transient" text, as in AppBar; it only has
    a message stack. Each message is tagged with a "context" identified by a string.
    When you pop a message off the stack, you must specify a context; the topmost
    message in slot is popped. If there are no messages in the context you specify,
    no text is popped. In general, the GtkStatusBar "pop" operation works only within
    namespaces. There''s no way to unconditionally pop all messages or unconditionally
    pop the topmost message.


    In this principle lets different parts of the program use the statusbar without
    interfering with one another. However, in my experience there''s no need for this.
    For example, Ntk doesn''t have a stack for its statusbar; its statusbar is simply
    a label. If it is poor design to make anything essential appear in the statusbar,
    the user might not notice it. Accidentally deleting a message should not be a
    major worry.


    Figure 6 shows the GtkStatusBar functions.


    To use the statusbar:


    +   1. Obtain a context ID with gtk_statusbar_get_context_id(); the context_description
    can be any string you like.

    2. Push a message onto the statusbar using gtk_statusbar_push(); the message is
    tagged with the context ID. The return value is a message ID you can use to remove
    the message. (Unlike GnomeApp, GtkStatusBar lets you remove a message that is
    not on top of the stack).

    3. Eventually remove the message with gtk_statusbar_remove() or gtk_statusbar_pop().
    The former refers to a specific message by ID, the latter removes the topmost
    message in the supplied context.


    Note that gtk_statusbar_push() pushes a message on top of all other messages,
    even those in other contexts; but gtk_statusbar_pop() will only pop from the context
    supplied. Contents do not refer to separate stacks, they merely restrict what
    you are permitted to pop.


    ```

    #include <gtk/gtkstatusbar.h>

    GtkWidget* gtk_statusbar_new(GtkWidget*);

    gint gtk_statusbar_get_context_id(GtkStatusBar* statusbar, const gchar* context_description);

    gint gtk_statusbar_push(GtkStatusBar* statusbar, guint context_id, const gchar*
    text);

    void gtk_statusbar_pop(GtkStatusBar* statusbar, guint context_id);

    void gtk_statusbar_remove(GtkStatusBar* statusbar, guint context_id, guint message_id);

    ```


    Figure 6- GtkStatusBar


