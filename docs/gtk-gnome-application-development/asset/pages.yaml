  md: "# Chapter 3. GTK+ Basics\n\n```\n$ gtk-config -libs -gthread\n-L/home/hp/local/lib\
    \ -L/usr/X11R6/lib -lgtk -lgdk -rdynamic -lmoduleigthread -lgib -lpthread -ldl\
    \ -lXext -lX11 -lm\n$ gtk-config -cflags -I/home/hp/local/lib/include -I/home/hp/local/include\n\
    -I/usr/X11R6\n```\n\nIf you're using a Bourne shell variant, such as bash, you\
    \ can use backticks (not quite!) to execute gtk-config and substitute its output.\
    \ A simple Makefile for compiling Hello, World might look like this:\n\n```\n\
    CC=gcc\n\nall: hello.c\n\t$(CC) 'gtk-config -libs' 'gtk-config -cflags' -o hello\
    \ hello.c\n```\n\n```\nclean:\n\t/bin/rm -f *.o\n```\n\nOf course, this Makefile\
    \ is too simple for real-world applications; Chapter 4 describes how to make a\
    \ more realistic build using automake and autoconf. gtk-config allows you to locate\
    \ GTK+ on the user's system, instead of hardcoding a location in your Makefile.\
    \ It also comes in handy if you have two versions of GTK+ on your system; if you\
    \ install each in a dedicated directory tree, you can choose one or the other\
    \ by placing the correct gtk-config in your shell's path.\n\n# How It Works\n\n\
    This simple program contains all the elements of a GTK+ application. It doesn't\
    \ contain any Gnome features; but since Gnome builds on GTK+, the same concepts\
    \ will apply.\n\n# Initialization\n\nFirst, GTK+ must be initialized:\n\n```\n\
    gtk_init(&argc, &argv);\n```\n\nThis connects to an X server, and parses some\
    \ default arguments understood by all GTK+. Parsed arguments are removed from\
    \ argv, and argc is decreased accordingly. gtk_init() also registers a \"cleanup\
    \ function\" using atexit. In practice, this is only important when you fork();\
    \ the child process must exit with _exit() rather than exit() to avoid shutting\
    \ down GTK+ in the parent process.\n\n# Widgets\n\nNext, my program will use some\
    \ user interface elements. In the X tradition, these are called widgets. All widgets\
    \ are subclasses of the GtkWidget base class, so you can use GWidget to refer\
    \ to them. (Since C has no native support for object inheritance, GTK+ has its\
    \ mechanism—Chapter 9 describes this.)\n\n```\nwindow = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
    ```\n\n151"
