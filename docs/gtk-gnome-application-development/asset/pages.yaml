  md: "};\n\nAs you can see, GtkEv has no class functions or signals of its own. Each\
    \ instance stores a pointer to the small event window in event_window. Two rectangles\
    \ cache the area covered by the event window, and the area covered by the event\
    \ description text. The widget's allocation is divided between these two areas.\
    \ Finally, GtkEv stores a list of string vectors describing events; it caches\
    \ the end of the list and the length of the list. As events are received, text\
    \ describing them is pushed to the front of the buffer. When the list becomes\
    \ too long to fit on the screen, GtkEv removes an event from the back of the buffer\
    \ each time it adds a new event to the front, keeping the buffer size constant.\n\
    \n# GtkObject Features\n\nLike GtkObjects, GtkEv provides for its creation and\
    \ destruction.\n\n# Creation\n\nGtkEv's init, class init, constructor functions\
    \ are pure boilerplate and should require no explanation; here they are, to help\
    \ you oriented:\n\n```\nstatic GtkWidgetClass *parent_class = NULL;\n\nguint\n\
    gtk_ev_get_type(void)\n{\n    static guint ev_type = 0;\n\nif (!ev_type) {\n \
