  md: '# # Chapter 5. Gnome Application Basics


    This chapter describes the most rudimentary aspects of a Gnome application, including
    initializing the libraries, marking strings for translation, parsing command line
    arguments, saving configuration files, and responding to requests from the session
    manager. From here on, the book assumes you know how to write a simple GTK+ only
    application.


    # ## Initializing the Libraries


    On startup, your application must initialize the GTK+ and Gnome libraries with
    a call to `gnome_init()`; `gnome_init()` (Figure 5-1) takes the place of `gtk_init()`
    for Gnome apps (it calls `gtk_init()` for you).


    The first argument to `gnome_init()` is a short name for your application, and
    the second is a string representing the application''s version. These are used
    internally by the Gnome libraries (in default messages provided by the argument
    parser, for example).


    ```

    #include <libgnome/gnome-init.h>

    int gnome_init(const char *app_id, const char *app_version, int argc, char **argv);

    ```


    Figure 5-1. Initializing Gnome


    Ltk_init()`, `gnome_init()` parses the command-line arguments; unlike `gtk_init()`,
    it will not change `argc` and `argv`. If you want to parse application-specific
    options, you should use `gnome_init_with_pop_table()`, as described in the next
    text.


    The return value from `gnome_init()` is supposed to be non-zero if initialization
    fails, but the current implementation always returns 0; `gnome_init()` will simply
    abort if there is a problem (like a X crashing server) Common practice is to ignore
    this return value, in Gnome 1.0, but it is a good idea to check it in case future
    versions return an error.


    > [FOOTNOTE - after ''always returns 0''] Most people consider this a miss, but
    gtk_init shared the same problem until just before Gnome 1.0, so there was little
    to do. Future versions will hopefully fix the problem.


    # ## Internationalization


    All-visible strings in a Gnome application should be marked for translation. Translation
    is achieved using the GNU `gettext` facility which is a simple message catalog;
    it stores key-value pairs, where the key is the string-coded into the program,
    and the value is a translated string (if appropriate) or simply the key (if there’s
    no translation, or if the key is already in the correct language).


    As a programmer, it’s not your responsibility to provide translations. However,
    you must make sure strings are marked for translation—and that `gettext`''s scripts
    extract a list of strings to be translated—and you must call a special function
    on each string when the catalog lookup should take place.'
