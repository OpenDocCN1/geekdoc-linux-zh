    On the client side, pixmaps and bitmaps are just GdkWindows with type GDK_WINDOW_PIMAP.
    GdkDrawable is used in function declarations when either a window or a pixmap
    is an acceptable argument. Functions that draw graphics take either type; functions
    that move around or set window manager hints accept only windows. Only windows
    can receive events. GDK_INPUT_ONLY windows are a special case; they are not drawable
    and you can''t draw on them.

    The three of four logical combinations of "window features" and drawability actually
    exist:


    | Drawable | Not Drawable |

    | --- | --- |

    | Window Features Normal Window | Input Only Window |

    | No Features Pixmap/Bitmap | -- |


    Unfortunately, all of these distinct cases appear the same from a type-checking
    point of view. Be careful not to use the wrong one. Also keep in mind that a normal
    window is not drawable until it actually appears on the screen; you should wait
    until you receive an expose event before you draw. Expose events are covered in
    the section called Exposure.

    Like GDK, a GdkPixmap is merely a client-side handler for an object on the Server.
    Because of this, some things are entirely infeasible for performance point of
    view; notably, if you are doing anything that requires manipulation of individual
    pixels, drawables will be far too slow. On the other hand, copying a pixmap to
    a window is not as slow as you might think, because both objects are on the same
    machine.

    Creating a pixmap is easier than creating a window, because most of the windows
    are not relevant to pixmaps. The function gdk_pixmap_new() (Figure-14) accepts
    an initial size, and a depth. If a depth of -1 is given, the depth is copied from
    GdkWindow. You can''t choose an arbitrary number for the depth--the server will
    not support all depths, and the pixmap''s depth must match the depth of any windows
    you plan to copy to. To destroy a pixmap, call gdk_pixmap_free().

    GDK argument to gdk_pixmap_new() does not seem strictly necessary. However, the
    function wraps XCreatePixmap(), which takes an X as an argument. It uses this
