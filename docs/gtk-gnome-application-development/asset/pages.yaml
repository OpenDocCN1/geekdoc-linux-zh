    Figure 6-4. Creating Widgets from GnomeUUI


    If you are using the GnomeApp widget, gnome_app_create_menu() and gnome_app_create_toolbar()
    to create a menu or toolbar from the GnomeUUI table, you attach them to the GnomeApp.
    Most of the functions you want to use; they do everything automatically. There
    is a _with_data() variant of each function overrides the user_data field of GnomeUUI.


    If you have more specialized needs, you can manually fill a menu or toolbar and
    add it to the list of choice. The functions require you to specify an accelerator
    group to add accelerators to; for GnomeApp, an accelerator group already exists
    in the widget (the accel_group member). The functions for menu items allow you
    to parse the underscores in menu items to extract accelerators, and you can specify
    at which position in the GtkMenu function will be inserting menu items.


    (GtkMenu is simply the base class for GtkMenuBar and GtkMenu, it is a widget that
    contains menu items. An accelerator group is just a collection of accelerators,
    normally attached to a GtkWindow; use Gnome_APP(widget)->accel_group in this case.)


    When you use GnomeUUI table to create a menu or toolbar, pointers to the individual
    menu item or toolbar buttons are placed in the widget member of each GnomeUUI
    struct. You can use these pointers to access the individual widgets; for example,
    if you check a menu item you want to set the state of the check. The pointer is
    also useful if you want to manually create part of the menu; you can create an
    empty submenu, for example, and manually build the contents of the subtree.


    # GnomeHello: An Example


    The GnomeHello application has a menu and a toolbar created using the GnomeUUI
    method; the relevant code is in a separate file, menus.c. Appendix E lists this
    file


