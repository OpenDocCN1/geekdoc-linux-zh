  md: '# Selection Events


    X has a simple cut-and-paste mechanism (typically, you select some text with button
    1 and with button 2). The current contents of the "clipboard" are called the selection.
    You only need to know about this if you are writing a widget like GtkText or GtkEntry
    that allows you to cut and paste text. Events indicate that the current selection
    has changed, and look like this:


    ```

    typedef struct _GdkEventSelection GdkEventSelection;


    struct _GdkEventSelection {

    GdkEventType type;

    GdkWindow *window;

    gint8 send_event;

    GdkAtom selection;

    GdkAtom target;

    GdkAtom property;

    gint32 requestor;

    gint32 time;

    };

    ```


    Most GTK widgets deal with selection using a higher-level interface, found in
    gtk/gtkselection.h. If you''re interested in writing selection-handling code,
    take a look at this header.


    # Client Events


    Client events are an arbitrary chunk of data sent from one application to another.
    However, there are some conventional "messages" that can be sent, mostly defined
    in the Inter-Client Communications Manual (ICCM). The ICCM is mostly used for
    communication between applications and the window manager (The XLib event being
    carried is ClientMessage, so look for ClientMessage in the ICCM). An important
    ClientMessage event sent from the window manager to applications, asking for confirmation
    before deletion, GDK converts these to events with type GDK_DELETE, so a GdkEventClient
    will not be received. Some events in drag-and-drop are also Client Messages, so
    GDK translates these to GdkEventNDND, so a GdkEventClient will not be received
    for them. GdkEventClient will only be received if some client sends an unconventional
    message to GDK+ and is not prepared to handle. Most of the common messages are
    nicely wrapped in a high-level interface.


    Just for reference, here is the event:


    ```

    typedef struct _GdkEventClient GdkEventClient;


    struct _GdkEventClient {

    GdkEventType type;

    GdkWindow *window;

    gint8 send_event;

    GdkAtom message_type;

    gushort data_format;

    un

    char b[20];

    short s[10];

    long l[5];

    }

    ```'
