    \ particular actions are required before and after emitting the signal; thus it\
    \ should only be emitted via the gtk_widget_size_request() function.\n\n# # What\
    \ Happens When a Signal Is Emitted\n\nGiven the many options when creating signals\
    \ and connecting callbacks, you may be confused about what happens when a signal\
    \ is emitted. Here's a summary of the sequence of events:\n\n+   1. If you are\
    \ emitting by signal name, the signal ID is looked up.\n2. If another emission\
    \ of the same signal is in progress, and the signal has the GTK_RUN_NO_RECURSE\
    \ flag set, GTK+ signals the emission to restart and this emission ends.\n3. If\
    \ the signal is GTK_RUN_FIRST, the default handler is called using the signal's\
    \ marshall. If the emission is stopped from the handler (using g_emit_stop_by_name(i)\
    \ or one of its cousins), this emission ends. If the signal is re-emitted within\
    \ the handler and is GTK_RUN_NO_RECURSE, it restarts.\n4. If there are any emission\
    \ hooks installed for this, they are invoked. GTK+ does not check whether the\
    \ emission has stopped or re-emitted at this point; it will not check the next\
    \ step. Emission hooks do not re-emit the signal they are watching, or try to\
    \ stop it.\n5. Normally-connected callbacks are invoked using the signal's marshall.\
    \ Callbacks connected with g_signal_connect_after() are not invoked at this point.\
    \ After each callback, GTK+ checks whether it stopped the signal and the emission\
    \ ends so. GTK+ also checks whether the signal was re-emitted, and if it restarts\
    \ the process for GTK_RUN_NO_RECURSE signals.\n6. If the signal is GTK_RUN_LAST,\
    \ the default handler is invoked. Afterward GTK+ again checks whether the emission\
    \ has been stopped or should be restarted.\n7. Any callbacks connected with gtk_signal_connect_after()\
    \ are invoked. After invoking each one, GTK+ checks whether the emission should\
    \ be stopped or restarted.\n\n155"
