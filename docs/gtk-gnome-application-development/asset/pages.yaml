    # Changing the Cursor


    You can change the cursor at any time; cursor shapes are set on a window-window
    basis with `gdk_window_set_cursor()` (Figure 10-9). By default, windows use the
    user''s cursor; you can restore the default by setting a window''s cursor to NULL.


    Two ways are provided to create a cursor. The simplest way is to choose a cursor
    from the cursor font that comes with X. The cursor font contains instead of characters;
    you can view it with the command `xfd`. You can also use the available cursors
    using the `testgtk` program comes with GTK+. Each cursor has a distinct definition
    in `gdk/gdkcursors.h`. `gdk_cursor_new()` accepts one of these as its argument


    ```

    GdkCursor* cursor;

    cursor = gdk_cursor_new(GDK_CLOCK);

    gdk_window_set_cursor(window, cursor);

    gdk_cursor_destroy(cursor);

    ```


    Notice that you can destroy the cursor as soon as you attach it to a window; GdkCursor
    is a client-side handle for a server-side resource, and X will keep the server-side
    resource as long as it''s in use.


    If none of the cursors in the font appropriate are appropriate, you can create
    a cursor from a bitmap. Two bitmaps, actually: the source pixmap, and the mask.
    Since these are bitmaps, every pixel is either on or off (0 or 1). If a pixel
    is 0 in the mask, the pixel will be transparent. If a pixel is 1 in both bitmaps,
    it will be displayed in the fg (foreground) color passed to gdk_cursor_new_from_pixmap(pixmap).
