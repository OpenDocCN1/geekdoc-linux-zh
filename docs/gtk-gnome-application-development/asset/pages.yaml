  md: '# # Chapter 12. GnomeCanvas


    This canvas describes the GnomeCanvas widget, and the standard canvas items that
    come with Gnome. The following chapter discusses in more detail how to write a
    custom canvas item.


    # # Introduction to the Canvas


    The Gnome canvas is a powerful and extensible object-oriented display engine,
    useful in a wide variety of Gnome applications. The widget itself is simply a
    blank area; you can place GnomeCanvasItems on it. A GnomeItem is a GObject representing
    some element of the display (rectangle, ellipse or text). You can refer to this
    architecture as structured graphics; the canvas lets you draw with graphics. Since
    GnomeCanvas is a GObject, you can create your own subclasses to supplement custom
    items, the canvas can render almost anything. At the same time, you can use stock
    items (like text) for the canvas items you put on it.


    GnomeCanvas has two modes, representing a quality/speed tradeoff. In "GDC" mode,
    canvas items render directly to a GdkPixmap buffer using the GDK drawing primitives.
    The canvas copies the buffer to the screen once all items are rendered. In antialiased
    or "AA" mode, the canvas items render RGB pixels to a vector of bytes; and after
    all the items you have drawn on the RGB buffer, the canvas copies it to the screen.
    The RGB buffer mode is called "antialiased" because all the standard canvas items
    draw to the RGB buffer using the high-quality antialiased routines in libpixbuf.
    This results in smooth lines and very high display quality, but with some cost
    in speed.


    # # Basic Canvas Architecture


    This section introduces the architecture of the canvases, including the arrangement
    of items into hierarchical groups, and the many coordinate systems involved in
    using the canvas.


    # # GnomeCanvasGroup


    Canvas items are arranged in a tree structure. You can group items together as
    a unit; canvas architect Federico Mena Quintero likes to use a circuit diagram
    as an example. You might group the shapes representing logic gate, so you could
    manipulate the logic gate as a single component; that is, groups contain subgroups.
    Within each group, the canvas has its own order; objects higher in the stacking
    order.


    To implement this, the canvas comes with a special kind of canvas called GnomeCanvasGroup.
    As the name suggests, a canvas group groups a number canvas items together so
    you can manipulate the items as a single item. A GnomeGroup is invisible; to render
    it, it simply recurs its children, rendering each of them in turn. When you create
    a new GnomeCanvas, a default group called the "root" is created for you. All canvas
    items are added somewhere below the root group. The canvas widget only draws the
    root canvas directly; all other canvas items are managed by their parent group.'
