    # Text


    There are two functions to draw string; as an optimization, gdk_draw_text() takes
    the length of the string to draw as an argument. gdk_draw_string() uses strlen()
    to compute the string length for you. Otherwise they are identical. The x and
    y coordinates specify the location of the text''s baseline. See the section Fonts
    for information on fonts and font metrics. Text is drawn in the foreground color.


    There is no way to draw scaled or rotated text with GDK. GnomeCanvas offers a
    slow and low-quality way to draw scaled and rotated text (see called Text Here
    in Chapter 12). If you need high-quality scaling and rotating, you will need to
    use additional libraries, such as tlib for Type 1 fonts or FreeType for True fonts.
    Another possibility is the Display Postscript extension to X (XDPS); the GNU Project
    is working on a free implementation of XPS. The Gnome project also has a text
    solution in development, as part of the gnome-print library.


