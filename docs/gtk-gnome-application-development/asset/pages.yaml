    # Focus


    Within each toplevel window, one widget at a time may have the keyboard focus.
    Key events received by the toplevel window are forwarded to the focused widget.
    This is important because typing something on the keyboard should have only one
    effect—changing only one entry field, for example.

    Most widgets will give some visual indication that they have the current focus.
    The default GTK+ theme, the focused widget is typically surrounded by a thin frame.
    The user can move the focus between widgets, using the arrow keys or the Tab key.
    Focus can also move to a widget if the user clicks.

    The concept of focus is important for keyboard navigation. For example, pressing
    Enter or the space bar ''activates'' many widgets if they have the focus; you
    can move between buttons with the Tab key, and press one with Space, for example.


    # Grabs


    Widgets can grab the pointer and keyboard away from other widgets. This essentially
    means that the widget becomes ''modal''; input goes only to that widget, and the
    focus can''t be changed to another widget. A typical way to grab input is to create
    a modal dialog: if window has the grab, interaction with other windows is blocked.
    Note that there is another, GTK-level ''grab''; a GTK keyboard or pointer grab
    occurs on an X-wide band—that is, other applications are unable to receive keyboard
    or mouse events. A widget grab is a GTK+ focus; it only grabs away from other
    widgets in the same application.


    # Default


    Each window may have at most one default widget. For example, dialogs typically
    have a default button which is activated when the user presses the Enter key.


    # Widget States


    Widgets have states that determine their appearance:


    +   * Normal: just like it sounds.

    * Active: a button is currently pressed in, or a check box is currently checked,
    for example.

    * Prelight: the mouse is over the widget (and typically clicking would have some
    effect). Buttons ''highlight'' when you move over them, for example.

    * Selected: the widget is in a list or other set of alternatives, and is the currently
    selected option.

    * Insensitive: the widget is "ghosted", inactive, or unresponsive; it will not
    respond to input.


