    The current version of GTK+ will be better-behaved if you do this when creating
    the toplevel window during drawing; instead of creating the drawable itself. However,
    in principle you can do it for any drawable.

    GdkRGB understands several kinds of image data, including 24- and 32-bit RGB data,
    8-bit grayscale, and 8-bit indexes into an array of RGB values (a client-side
    GdkRGBbmap). This kind of buffer is the simplest, 24-bit RGB data; this is rendered
    with gdk_draw_rgb_image(). There are separate functions to render the other types,
    but all of work in the same way.


    A 24-bit buffer is a one-dimensional array of bytes; every triplet makes a pixel
    (byte 0 is red, byte 1 is green, byte 2 is blue). Three numbers describe the size
    of the array and the location of bytes within


    +   - The width is the number of pixels per row of the image.

    - The height is the number of rows in the image.


    +   - The rowstride is the number of bytes between rows. That is, for a buffer
    with stride r, row n starts at array row n at index n*r. The rowstride is not
    necessarily three times the buffer''s width; GdkRGB is faster if the source pointer
    and the rowstride are aligned to a 4-byte boundary. Specifying a rowstride allows
    you to use padding to achieve this.


    The x, y, width and height arguments to gdk_draw_rgb_image() define a region of
    the drawable to copy the RGB buffer. The RGB buffer must have at least width columns
    and height rows. Row 0, column 0 of the RGB buffer will be copied to point (x,
    y) on the drawable


    Dithering a larger number of colors on displays with a limited palette. Dithering
    only matters on 8- and 16-bit displays; 24-displays do not have a limited palette.
    The dither is an enumerated type; it has three possible values:


    +   - GDK_RGB_DITHER_NONE specifies that no dithering will be done. It is appropriate
    for line drawings with few colors, inappropriate for photographic images.

    - GDK_RGB_DITHER_NORMAL specifies dithering on 8-bit displays, but not 16-bit
    displays. This is usually the best quality/performance tradeoff.

    - GDK_RGB_DITHER_MAX specifies that dithering will always be done on 8- and 16-bit
    displays. The quality gain on 16-bit displays is probably not the speed penalty.


    The gc argument to gdk_draw_rgb_image() is simply passed through to gdk_draw_rgb_image()
    (recall that GdkRGB uses Gdk internally). The gc components that make sense (such
    as the clip mask, drawing function, and subwindow mode).


