  md: '# Chapter 2. glib: Portability and Utility


    # Memory


    glib wraps the standard malloc() and free() with its own g_variants, g_malloc()
    and g_free(), shown in Figure 2-5. These are nice in several small ways:


    +   - g_malloc() always returns a gpointer, not a char*, so there''s no need to
    cast the return value.

    - g_malloc() aborts the program if the underlying malloc() fails, so you don''t
    have to check for a NULL return value.

    - g_malloc() gracefully handles a size of 0, returning NULL.

    - g_free() will ignore any NULL pointers you pass to it.


    In addition to these conveniences, g_malloc() and g_free() can support various
    kinds of memory debugging and profiling. If you pass the --enable-mem-check option
    to glib''s configure script, the compiled g_free() will warn you if free the same
    pointer twice. The trace option enables code which keeps memory statistics; when
    you call g_mem_profile() they are printed to the console. Finally you can define
    USE_DMALLOC and the gl memory wrappers will use MALLOC(), etc. macros available
    in dmalloc.h on some platforms.


    ```

    #include <glib.h>


    gpointer g_malloc(size_t size);

    void g_free(gpointer mem);

    gpointer g_realloc(gpointer mem, size_t size);

    gpointer g_memdup(const gpointer mem, guint bytesize);

    ```


    Figure 2-5 glib memory allocation


    It''s important to match that g_malloc() with g_free(), plain malloc() with free(),
    and (if you''re using C++) with new. Otherwise bad things can happen, these allocators
    use different memory pools (and new/delete call constructors and destructors).


    Of course a g_realloc() equivalent to realloc(). There''s also a g_malloc0() which
    fills memory over os, and g_memdup() which returns a count of bytes starting at
    mem. g_realloc() and g_malloc() will both accept a size of 0, for consistency
    with g_malloc(). However g_malloc() will not.


    If it is not obvious: g_malloc() fills memory with unset bits, the value 0 for
    whatever type you intend to put there. Occasionally someone expects to get an
    array of floating point numbers when it does not work.


    Finally, there are type-aware allocation macros, shown in Figure 2-6. The type
    argument of each is the name of a type, and the count argument is the number of
    type-size blocks to allocate. These macros save you some time and multiplication,
    and are less error-prone. They automatically cast to the target pointer type,
    so attempting to assign the allocated memory to the wrong kind of pointer should
    trigger a compiler warning. (If you have warnings turned on, as a responsible
    programmer


