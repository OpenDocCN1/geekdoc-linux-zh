  md: '# Chapter 7. User Communication: Dialogs


    Since GtkDialog is a GtkWindow subclass, this function works fine. It blocks all
    interaction with windows other than the modal.


    Typically you want to go a step further, and wait for the user to click one of
    dialog buttons without setting up a list of callbacks. In GTK+ this is done by
    running a second instance of gtk_main(), another, nested loop. When the second
    loop exits, the flow of control returns to just after your gtk_main() call. However
    there are a host of complications and race conditions, due to the large number
    of ways to close a dialog; the resulting code is somewhat unpleasant and error-prone.
    The two functions in Figure 7-6 are provided to save you from the mess.


    ```

    #include <libgnome/gnome-dialog.h>

    gint gnome_dialog_run(GnomeDialog* dialog);

    g gnome_dialog_run_and_close(GnomeDialog* dialog);

    ```


    Figure 7-6. "Running" a Dialog


    These two functions block until the user clicks a dialog button, clicks the user''s
    manager closure, or does the equivalent with a key shortcut. If a button was clicked,
    that button''s number; recall that GtkDialog buttons are numbered from left to
    right starting with 0. If no button was clicked (the dialog was closed via window
    manager), they return -1


    The dialog is automatically modal for the duration of the call; otherwise it would
    reign (For example, calling gtk_main_quit() from your main application code would
    quit the nested loop rather than the primary one). However, if you plan to leave
    the dialog open after gnome_dialog_run() returns, and you want it to be modal,
    you should manually make it modal: gnome_dialog_run() will not change the dialog''s
    modality temporarily.


    It is your responsibility to figure out how the dialog will be closed or destroyed
    before you call gnome_dialog_run(). You can set the dialog up that no user actions
    destroy it then destroy itself after gnome_dialog_run() returns. You can also
    write a loop, calling gnome_dialog_run() repeatedly until the user gives valid
    input, and closing the dialog only after the loop ends. If you use a loop, be
    careful to manage the dialog modal state; otherwise there will be short intervals
    where it is not.


    gnome_dialog_run_and_close() manages the dialog''s "close" and "destroy" signals,
    and closes the dialog and only if it does not close "naturally" in response to
    user clicks or keystrokes. This function guarantees that gnome_dialog_close()
    will be called exactly before it returns, unless you connect malicious callbacks
    to sabotage the process. gnome_dialog_run_and_close() is not very useful in my
    opinion; it is much less than a way to avoid thinking about how the dialog will
    be closed.


