    # GDK Resource Management


    GDK objects have either reference counting or destruction, but not both. Pixmaps,
    fonts, graphics contents, and colormaps are purely reference counted. gdk_gc_destroy()
    exists but is deprecated – it''s just a wrapper for Gtk_gc_unref().). In general,
    reference counting is aligned to GtkObject reference counting. That, objects with
    a reference count of one; when the reference reaches 0 then the object is destroyed.


    Cursors and images are not reference counted; they have a destroy function. Some
    types represent objects that are never destroyed; GdkVisual is the main example.


    GdkWindow is the strange case; if it''s reference counted, but gdk_window_destroy()
    the client-side GdkWindow handle, window_destroy() applies to the actual server-side
    object. See the section called GdkWindow for an explanation. destroy unrefs the
    client-side handle after it destroys the server-side object. It''s safe to count
    all the GDK windows on a destroyed window that still has a reference greater than
    zero; they will remain immediately without taking any action.


    In practice this means that one action should "own" the GDK objects that are created
    and hold them, and the hold reference will remember (remember that objects created
    with a reference count of one). If also call gdk_window_destroy() eventually,
    destroying the server-side object and removing the initial reference count. If
    no other code increases the count, the client-side will be freed. If some other
    code increases the reference count with gdk_window_ref(), the client-side handle
    will remain to use but afterwards have no effect. When the reference count reaches
    zero, the client-side will be freed.


    In GTK+, windows are generally counted and destroyed by the widget; if others
    draw on the window, the window''s reference count.


