  md: "# Chapter 10. GDK Basics\n\n| Modifier Mask | Meaning |\n|--- |--- |\n| GDK_MOD5_MASK\
    \ | Mod5 |\n| GDK_BUTTON1_MASK | Button 1 |\n| GDK_BUTTON2_MASK | Button 2 |\n\
    | GDK_BUTTON3_MASK | Button 3 |\n| GDK_BUTTON4_MASK | Button 4 |\n| GDK_BUTTON5_MASK\
    \ | Button 5 |\n| GDK_RELEASE_MASK | Key releases |\n\nThe number of GdkEventButton\
    \ indicates which button triggered the event (i.e., the button was pressed or\
    \ released). Five are most common: one is the middle button, two is the left button,\
    \ and three is the right. Left-handed users reverse this. Button four and five\
    \ are generated by scroll mice when you spin the wheel; GDK attempts to capture\
    \ these events and near-scroll bars. You should probably ignore buttons four or\
    \ five.\n\nThe three mouse buttons have conventional meanings in Gnome. Button\
    \ is used for selection, drag and drop, and operating widgets: the most common\
    \ tasks. Button traditionally activates a pop-up menu. Button two is traditionally\
    \ used to move objects, such as the panel. Sometimes one objects icons can be\
    \ moved with either button one or two. It is a good idea to be consistent with\
    \ other applications whenever possible.\n\nThe source and device members are used\
    \ to determine which button triggered the event; the user may have a tablet and\
    \ a mouse connected simultaneously, for example. You can ignore these feels unless\
    \ you are writing an application that can take advantage of non-mouse devices.\n\
    \nThe last members of GdkEventButton, x_root and y_root are the x and y coordinates\
    \ translated to be relative to the root window rather than the window receiving\
    \ the event. You can use these as 'absolute' coordinates to compare events from\
    \ two different windows.\n\n# Keyboard Events\n\nThere are only two types of key\
    \ event: GDK_KEY_PRESS and GDK_KEY_RELEASE. Some hardware does not generate release\
    \ events; you should not write code that depends on GDK_KEY_RELEASE events, unless\
    \ your code should respond wisely if one is received.\n\nHere are the contents\
    \ of a key event:\n\n```\nstruct _GdkEventKey GdkEventKey {\n  struct GdkEvent\
    \ g_key;\n  GdkEventType type;\n  GdkWindow *window;\n  guint8 send_event;\n \
    \ guint32 time;\n  guint state;\n  guint keyval;\n  guint length;\n  gchar *string;\n\
    };\n```\n\n181"
