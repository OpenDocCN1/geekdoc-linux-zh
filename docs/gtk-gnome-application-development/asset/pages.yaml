    # Bounds


    The bounds method computes the approximate bounding box of a canvas item. In Gnome
    1.0, this method is only used in gnome_canvas_item_get_bounds(), a user-function
    to return the bounds of a canvas item. The canvas does not use it at all internally,
    and most likely you could get away without implementing it, though all the stock
    items do.


    The function should return an item''s bounding box in coordinates; here is the
    GnomeCanvasRE:


    ```

    static void

    gnome_canvas_re_bounds (GnomeCanvasItem *item,

    double *x1, double *y1,

    double *x2, double *y2)

    {

    GnomeCanvasRE *re;

    double width;

    nre = GNOME_CANVAS_RE (item);


    if (re)->width_pixels)

    width = (re)->width / item->canvas->pixels_per_unit) / 2.0;

    else

    width = (re)->width / 2.0;


    *x1 = re->x1 - width;

    *y1 = re->y1 - width;

    *x2 = re->x2 + width;

    *y2 = re->y2 + width;

    }

    ```


    # Realizing and Mapping


    Canvas items are realized and mapped just as widgets are. These methods play the
    same role they do for widgets; realizing a canvas item allocates all GDK resources
    it plans to use, deallocating the same resources. Mapping a canvas item shows
    its GdkWindow, unmapping it hides the GdkWindow. Very few canvas items have a
    GdkWindow (GnomeCanvasWidget is the big exception), so most canvas items will
    not even implement or unmap methods. GnomeCanvasRect does not. It does realize
    and unrealize methods, however.


    Here is its method:


    ```

    static void

    gnome_canvas_re_realize (GnomeCanvasItem *item)

    GnomeCanvasRE *re;

    re = GNOME_CANVAS_RE (item);

