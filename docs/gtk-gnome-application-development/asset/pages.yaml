    # Fonts


    An X font (is another) a server-side resource. In essence, a font is a collection

    of bitmaps representing characters. The bitmaps in a single font will have a similar

    size and style. GDK allows you to manipulate fonts with a client-side handle called

    GdkFont.


    To obtain a GdkFont, gdk_font_load() (or use the font from a preexisting Gdk-

    Style; more in this section called GdkStyle and Themes). Fonts are loaded by

    font names are a fairly involved topic. Names follow a convention called the

    "X Logical Font Description" or XLFD. The best way to get a feel is to play

    with the xfont program that comes with X. You can also get a list of font names

    of your server with the xlfonts programs. The standard X distribution includes

    a 30-page XLFD manual, but the basics are not too complicated.


    A font name is a string made up of hyphen-separated fields. Each field describes

    some aspect of the font. For example:


    ```

    -misc-fixed-medium-r-normal-0-0-75-75-c-0-iso8859-1

    ```


    or


    ```

    -adobe-new century schoolbook-bold-i-normal-11-80-100-100-p-66-iso8859-

    1

