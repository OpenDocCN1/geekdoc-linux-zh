  md: 'written in portable ANSI C and intended to be on UNIX-like systems. Libraries
    which involve graphics realty on the X Window System. Wrappers are available which
    export the Gnome API to nearly any language you can think of, Ada, Scheme, Python,
    Perl, Tom, Eiffel, Dylan, and Objective C. There are at least three C++ wrappers
    as well.


    This book will cover the C interface to the libraries; however, it would be useful
    for users of any language binding, the mapping from C to your preferred language
    is typically straightforward. The book covers version 1.0 of the Gnome libraries
    (including the culpable bug fix releases, such as 1.0.9—all 1.0.x versions are
    compatible).


    # Non-Gnome Libraries


    Taking full advantage of the free software tradition, Gnome didnt not start from
    scratch. It uses several libraries which are maintained separately from the Gnome
    project. These are part of the Gnome application development framework, and you
    can count on their presence in a Gnome environment.


    # glib


    glib is the base of the Gnome infrastructure. It''s a C utility library, providing
    routines to create and manage common data structures. It also addresses portability
    issues; for example, many lists as the sprintf() function, glib contains an implementation
    c_snprintf() which is guaranteed to exist on all platforms and slightly safer
    than snprintf() (it always NULL-terminates the target buffer).


    Gnome 1.0 uses glib version 1.2 and works with any glib in the 1.2 series (1.2.1,
    1.2.2, etc.). All glib versions beginning with 1.2 are compatible bug-fix releases.


    # GTK+


    GTK+, or the Gimp Tool Kit, is the GUI toolkit used in Gnome applications. GTK+
    was originally written for Gimp (GNU Image Manipulation Program—http://gimp.org),
    but has become a general-purpose library. GTK+ depends on glib.


    GTK+ includes GDK, the G Drawing Kit, which is a simplification and abstraction
    of the low-level X Window Libraries. Since GTK+ uses GDK rather than calling X
    directly, a port of GDK permits GTK+ to run on windows systems other than X with
    relatively few modifications. GTK+ and the Gimp have already been ported to the
    Win32 platform in this way.


    GTK+ provides several features for Gnome applications:


    +   - A dynamic type system.


    +   - An object system written in C, with inheritance, type checking, and a signal/callback
    infrastructure. The type and object systems are not GUI-specific.


    +   - A GtkWidget de-scribed object written using the object system, which defines
    the interface Gtk''s graphical components implementation.


    +   - A large collection of useful GtkWidget subclasses (widgets); this collection
    forms the bulk of Gtk+''s code.


    Gnome adds a number of additional widgets to the basic GTK+ collection.'
