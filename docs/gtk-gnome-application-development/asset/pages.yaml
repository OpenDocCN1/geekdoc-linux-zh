  md: "# Chapter 9. The GTK+ Object and Type System\n\nIf you do not specify the class\
    \ name as part of the argument name, GTK+ will start with the real type of the\
    \ object and look up the name in the argument table for each superclass until\
    \ it finds the right (GtkContainer in this case). If you do specify the class\
    \ name, GTK+ will only look for the argument in the specified class's argument\
    \ table.\n\nSince gtk_object_set() uses C variable arguments, it has limited type\
    \ safety. This can be a real problem in your code. You may have noticed that gulong\
    \ in the sample call to gtk_object_set(). The argument GtkContainer::border_width\
    \ has type GTK_TYPE_ULONG, which will extract size(gulong) bytes from the argument.\
    \ If you leave out the cast, C will probably pass only size(int) to functions.\
    \ As you might imagine, this causes memory corruption on main. This problem arises\
    \ with arguments of type GTK_TYPE_DOUBLE; if you pass 5 instead of 0, C will pass\
    \ an integer to gtk_object_set(). These bugs are very hard to find, once you introduce.\n\
    \ngtk_object_set() is syntactic sugar for a more functional call, gtk_object_set()\
    \ which converts each key-value pair in its argument list to GtkArg internally.\n\
    \n```\nGtkArg args[1];\nargs[0].name = \"GtkContainer::border_width\";nargs[0].type\
    \ = GTK_TYPE_ULONGnGTR_VALUE_ULONG(args[0]) = 10;\ngtk_object_setv(GTK_OBJECT(button),\n\
    \  1,\nargs);\n```\n\nThe second argument to gtk_object_setv() is the length of\
    \ the array of GtkArg. gtk_object_set() is easier to use when you are typing the\
    \ code manually, but gtk_object_setv() can be passed a dynamically-constructed\
    \ argument array—which is convenient if you are exporting GTK+ to an interpreted\
    \ environment.\n\nIt is also possible to set objects when objects are created.\
    \ You can create objects using the gtk_object_new() function, and most widgets\
    \ with the gtk_widget_new() function. The routines take a GType as their first\
    \ argument, and create an object or widget of that type. Then they take a list\
    \ of argument-value pairs, just as gtk_object_set() does. There are also gtk_object_new()\
    \ and gtk_widget_new() variants.\n\n# Reading Object Arguments\n\nTo get one or\
    \ more arguments, you create an array of GtkArg, filling in the name of each GtkArg,\
    \ gtk_object_setv() fills the fields with the argument values. If an error occurs,\
    \ the field is set to GTK_TYPE_INVALID. or the fundamental type of the returned\
    \ value is GTK_TYPE_STRING, GTK_TYPE_BOXED, you are responsible for freeing it.\n\
    \nHere's a simple example:\n\n```\nGtkArg args[2];\nargs[0].name = \"GtkContainer::border_width\"\
    ;\nargs[1].name = \"GtkContainer::resize_mode\";\n```"
