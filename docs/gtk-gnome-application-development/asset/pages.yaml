    # # Polygon Item


    GnomeCanvasPolygon represents a filled polygon; it can be filled or only an outline.
    Unlike GnomeCanvasRE, an unfilled GnomeCanvasPolygon is not "hollow"; the transparent
    portion in the center is part of the canvas item. GnomeCanvasLine is used for
    "hollow".


