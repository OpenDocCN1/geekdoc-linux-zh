    \ several widgets as examples, including a GtkEv widget written especially for\
    \ this book, GtkVBox from GTK+, and GnomeAppBar from libgnomeui.\n\n# What a Widget\
    \ Does\n\nA minimal widget implements the following (though GtkWidget's default\
    \ implementation may be sufficient in many cases):\n\n+   - Creation and destruction;\
    \ this means the GtkObject boilerplate (instance and class initializers, shutdown,\
    \ destroy and finalize methods). See Chapter 9, especially the section called\
    \ Object and Class Structures in Chapter 9 and the section called Object Finalization\
    \ in Chapter 9. Also see the section called Life Cycle in Chapter 3.\n- The realize/map/un/unrealize\
    \ cycle discussed in the section called Realizing, Mapping, and Shaving in Chapter\
    \ 3. Widgets must be able to create and update their associated X resources number\
    \ of times, and they must be able to show and hide them any number of times.\n\
    - Geometry negotiation, discussed in the section called Size Allocation in Chapter\
    \ 3. Your widget must respond to size requests, and honor size allocations.\n\
    - Drawing; widgets must be able to draw themselves on the screen. For container\
    \ widgets, the widget itself may be invisible but it must ensure widgets are drawn.\n\
    - The widget's unique functionality. Typically this means implementing handlers\
    \ for some of the widget's event signals.\n\n# The GtkWidget Base Class\n\nObviously,\
    \ to subclass GtkWidget, you will have to be familiar with the base class. This\
    \ section offers a brief tour of the GtkWidget class and instance structs, and\
    \ some important GTK+ routines that aren't very common in everyday programming.\n\
    \n# The GtkWidget Instance Struct\n\nA GtkWidget instance looks like this:\n\n\
    ```\ntypedef struct _GtkWidget GtkWidget\n\nstruct _GtkWidget {\n  GtkObject object;\n\
