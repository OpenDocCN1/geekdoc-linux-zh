  md: "# # Session Management\n\nThe term session refers to a snapshot of the state\
    \ of a user's desktop: what applications are open, where their windows are located,\
    \ what windows each application has open, what size windows are, what documents\
    \ are open, current cursor position, and so on. Users should be able to save their\
    \ session before logging out, and have it automatically restored as quickly as\
    \ next time they log in. For this, applications must cooperate by record and restore\
    \ those aspects of their control by the window manager.\n\nA special program calls\
    \ the session manager notifications when they should save their state. The Gnome\
    \ desktop environment comes with a session manager called gnome-session, but Gnome\
    \ uses the X session specification, which is several years old. KDE uses the same\
    \ specification, and at present time is planning to adopt it as well; an application\
    \ that implements session management via the interfaces should support managed\
    \ desktops. Gnome does implement some extensions to the basic specification (notably,\
    \ startup 'priorities') but these do not break other session managers and will\
    \ be implemented in KDE as well.\n\nIt is worth noting the session management\
    \ documentation comes with X; it's a good introduction to what's going on 'behind\
    \ the scenes'. The Gnome libraries also come with a useful document, called session-management.txt;\
    \ have a look at it, and the heavily-commented gnome-client.h header file, for\
    \ details not covered in this section.\n\n# # Using the GnomeClientObject\n\n\
    Gnome shields from the raw session management interface that comes with X. This\
    \ is done via a GtkObject GnomeClient. GnomeClient represents your application's\
    \ connection to the session manager.\n\nGnome manages the details of session management.\
    \ For most applications, you only have to respond to two requests.\n\n+   - When\
    \ a session is saved, the session manager will ask each client to save enough\
    \ information to restore its state the next time user logs in. Your application\
    \ should save as much interesting state as possible: the current open documents,\
    \ cursor position, command history, and so on. Applications should not save their\
    \ current window geometries; the window manager is responsible for that.\n- Sometimes\
    \ the session manager will ask your client to shut down and exit (typically when\
    \ the user logs out). When you receive this request you do whatever is necessary\
    \ to exit the application.\n\nWhen the session manager requests action from your\
    \ application, the GnomeClient object emits an appropriate signal. The two important\
    \ signals are \"save-yourself\" and \"die\". \"save-yourself\" is emitted when\
    \ an application should save its state, and \"die\" is emitted when an application\
    \ should exit. A \"save-yourself\" callback is fairly complex and has a few arguments;\
    \ a \"die\" callback is trivial.\n\nGnomeHello obtains a pointer to the GnomeClient\
