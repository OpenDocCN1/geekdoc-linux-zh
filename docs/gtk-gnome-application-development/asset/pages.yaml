  md: "# Expose Events\n\nExpose events are received when a previously-obscured region\
    \ of a window becomes visible. GdkWindow contents are not recorded, that is, if\
    \ you draw to a GdkWindow, then the X server places another window on top of it,\
    \ the graphics in the bottom window will be lost. When the window is moved, the\
    \ bottom window will receive an event indicating the region that needs to be redrawn.\
    \ Expose events are also sent when a window first appears on-screen. (Incidentally,\
    \ you should not draw into a GdkWindow until you receive the first expose event.\
    \ The first expose event is your signal that the window is unlikely to be off-screen.)\n\
    \nExpose events have a unique feature: GTK+ synthesizes them for windowless widgets.\
    \ This is the only kind of event GTK_NO_WINDOW widgets will receive.\n\nExpose\
    \ events are very simple:\n\n```\ntypedef struct _GdkEventExpose GdkEventExpose;\n\
    \nstruct _GdkEventExpose {\n  GdkEventType type;\n  GdkWindow *window;\n  gint\
    \ send_event;\n  GdkRectangle area;\n  gint count;\n};\n```\n\narea is the area\
    \ that has been exposed and should be redrawn. count is the number of expose events\
    \ that follow this one; conceivably you might want to compress events into a single\
    \ redraw. However, GDK already makes a reasonable effort to do so, so adding another\
    \ is unlikely to gain much. GdkRectangle is defined as follows:\n\n```\ntypedef\
    \ struct _GdkRectangle GdkRectangle;\n\nstruct _GdkRectangle {\n  gint16 x;\n\
    \  gint16 y;\n  gint16 width;\n  gint16 height;\n};\n```\n\nThere is one other\
    \ type when you will receive events. If you call gdk_window_copy_area() to copy\
    \ part of one window into another, the source window may be partially or completely\
    \ obscured. If X will be able to copy something from the obscured region. By default,\
    \ expose events will be generated for the areas of the destination window. Your\
    \ program's redraw routine can then refresh these areas of the window by moving.\
    \ You can avoid this behavior by calling gdk_gc_set_exposures() on the graphics\
    \ context passed to gdk_window_copy_area(). (Graphics contexts are discussed in\
    \ the section called Graphics Contexts)\n\nIf the source region is not obscured,\
    \ gdk_window_copy_area() can fully draw the entire region. In this case, no expose\
    \ events are generated; a single 'no expose' event is generated instead. This\
    \ event contains no information beyond the standard event fields:"
