    # How do I read the pixels out of a GdkPixmap?


    First and foremost: remember that a pixmap is a server-side resource, i.e. possible
    across a network and definitely across some kind of socket. Therefore, you do
    not want to request its pixels one by one. Iterating over a pixmap that could
    easily take many seconds.


    GDK wraps XLib object GdkImage. The wrapper is called. GdkImage is essentially
    a local copy of the data in a pixmap. You can copy a region of a pixmap or window
    into a GdkImage with the gdk_image_get() routine, then get and set pixels with
    gdk_image_get_pixel() and gdk_image_put_pixel(). You can also access the data
    structures directly, but this is complicated (due to visuals, differences between
    host and network byte order, and so on). If you modify the image, use gdk_draw_image()
    to copy it to a server-side drawable.


    Copying a pixmap to a Gdkimage, or copying a Gdkimage to a pixmap, involves moving
    quite a bit of data over the network; however, since it''s all in one burst the
    speed can be tolerable in many cases. Also, if the client and the server are on
    the same machine, and the X shared memory extension is available, GDK will automatically
    set a shared memory segment to copy the data


    Most of the time, if you plan to do a lot of image manipulation, you are better
    off using RGB as your primary data structure (see the section called RGB Buffers
    in Chapter 10). The functions in gdkpixbuf allow you to copy an RGB buffer to
    a drawable. These functions use GdkImage internally, but they are tuned to be
    very fast and handle all the complexities for you.


