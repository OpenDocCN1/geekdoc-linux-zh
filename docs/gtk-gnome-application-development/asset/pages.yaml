  md: 'Of course you can pack the contents of dialog->vbox using the packing options
    of your choice. The above code is just an example.


    Figure 7-2 shows a dialog from the Gnumeric spreadsheet, with its components la-bled.


    ![](img/f08b98c3d9ba764fd120a058661d79d5_117_0.png)


    Figure 7-2. A Dialog from the Gnumeric spreadsheet


    # # Handling GnomeDialog Signals


    Now for the tricky part. You have to prepare yourself to handle anything the user
    might do to your dialog. Here''s a brief list of possibilities; it''s worth going
    over the list whenever you create a dialog:


    +   - Closing the dialog by pressing the Escape key

    - Closing the dialog by clicking the window manager''s close decoration

    - Clicking one of the dialog''s buttons

    - Interacting with the contents of the dialog

    - If the dialog is not modal, interacting with other parts of the application


    GnomeDialog emits two signals in addition to those it inherits from parent classes.
    If the user clicks one of the buttons, a ''clicked'' signal is emitted. (This
    is not the ''clicked'' signal from Gtk-Button; it''s a different signal, emitted
    by GnomeDialog.) A GnomeDialog ''clicked'' handler should have three arguments:
    the signal, the number of the button clicked, and your callback data.


    GnomeDialog also has a ''close'' signal. It is emitted when gnome_dialog_close()
    is called; all the built-in event handlers (e.g. for the Escape shortcut) call
    this function to close the dialog. GnomeDialog''s default handler for ''close''
    has two possible behaviors: it can either call gtk_widget_hide() or gtk_widget_destroy()
    on the dialog. The behavior is configurable by calling gnome_dialog_close_hides(),
    shown in Figure 7-3.


    ```

    #include <libgnomeui/gnome-dialog.h>

    ```'
