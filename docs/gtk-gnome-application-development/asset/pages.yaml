  md: 'This creates a dialog titled "My Dialog Title" with an OK and a Cancel button;
    the strings are marked for translation with the _() macro. The OK button will
    be the leftmost icon in the dialog.


    ```

    #include <libgnomeui/gnome-dialog.h>

    GtkWidget* gnome_dialog_new(const gchar* title, ...);

