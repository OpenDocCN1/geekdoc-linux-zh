  md: '# Timeout Functions


    Timeout functions are connected and disconnected exactly as quit functions are;
    the expected callback is the same. gtk_timeout_add() expects an interval argument;
    the callback is invoked every interval millisecond. If the callback returns FALSE,
    it is removed from the list of timeout functions, just as if you''d called gtk_timeout_remove().
    It is not safe to call gtk_timeout_remove() from within a timeout function; this
    modifies GTK while iterating over it, causing a crash. Instead, return FALSE to
    remove a function.


    ```

    #include <gtk/gtkmain.h>

    guint gtk_timeout_add(uint interval, GtkFunction function, gpointer data);

    void gtk_timeout_remove(uint timeout_handler_id);

    ```


    Figure 3-30. Timeout Functions


    # Idle Functions


    Idle functions run continuously while the GTK+ main loop has nothing else to do.
    Idle functions run only when the event queue is empty and the main loop would
    normally sit idle, waiting for something to happen. As long as they return TRUE
    they are invoked or over; when they return FALSE, they are removed, just if gtk_idle_remove()
    had been called.


    The idle function API, in Figure 3-31, is identical to the timeout and quit functions.
    Again, gtk_idle_remove() should not be called from within an idle function, because
    it would corrupt GTK+''s idle function list. Return FALSE to remove the idle function.


    Idle functions are mostly used for "one-shot" code, which is run after all events
    have been handled. Relatively expensive operations such as GTK+ size notification
    and GnomeCanvas replaces place in idle functions that return FALSE. This ensures
    that expensive operations are performed only once, even though multiple consecutive
    events request the recalculation.


    The GTK+ main loop contains a simple scheduler; idle functions actually have priority
    to them, just as UNIX processes do. You can assign a non-default priority to your
    idle functions, but it''s a complicated topic outside the scope of this book.


    ```

    #include <gtk/gtkmain.h>

    guint gtk_idle_add(GtkFunction function, gpointer data);

    void gtk_idle_remove(uint idle_handler_id);

    guint gtk_idle_remove_by_data(gpointer data);

    ```


    Figure 3-31. Idle Functions'
