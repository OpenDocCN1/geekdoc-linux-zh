  md: '# Tooltips


    GTK+ provides tooltip functionality; you simply create a GtkTooltips and attach
    it to a widget. I like to use the following convenience function in my applications:


    ```

    void

    set_tooltip(GtkWidget* w, const gchar* tip)

    {

    nGtkTooltips* t = gtk_tooltips_new();

    gtk_tooltips_set_tip(t, w, tip, NULL);

    }

    ```


    The GtkTooltip will be destroyed along with the widget. Make your tooltips long
    than short; there''s no reason to skip on the amount of information you provide
    here. You should get in the habit of calling set_tooltip() every time you create
    a button or other widget that could benefit from it.


    Note that toolbars created from a UI template will have tooltips installed automatically.


    # Finishing Touches


    Really polished application windows behave well on small screens, and set hints
    so the window manager can keep track of them.


    # Adapting to Screen Size


    The functions in Figure 6-12 allow you to query the size of the screen in pixels.
    You can use this to adjust the layout of your application window; for example,
    if you know your application window is too large for a 640 by 480 display, you
    could provide an alternative widget layout for small screens. Applications that
    automatically adapt to the screen size are very impressive.


    Of course, you should have control in the hands of the user; users with large
    screens might want the small version of your application anyway, and you should
