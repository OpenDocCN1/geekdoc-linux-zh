  md: "# Chapter 9. The GTK+ Object and Type System\n\n```\n#include <gtk/gobject.h>\n\
    ```\n\n```\nvoid gtk_object_get(GtkObject* object, guint n_args, GtkArg args);\n\
    void gtk_object_set(GtkObject* object, const gchar* first_arg_name, ...);\nvoid\
    \ gtk_object_set(GtkObject* object, guint n_args, GtkArg args);\nvoid gtk_object_add_type(const\
    \ gchar* arg_name, GtkType arg_type, guint arg_flags, guint arg_flags);\nGtkArg*\
    \ gtk_object_query_args(GType class_type, guint32** arg_flags, guint* n_args);\n\
    ```\n\nFigure 9-3. Manipulating Object Arguments\n\nGObject can emit a signal.\
    \ Signals are stored in a global table by GTK+. Handlers or callbacks can be connected\
    \ to signals; when a signal is emitted, its callbacks are invoked. The process\
    \ of invoking all handlers for a signal is called emission.\n\nAbstractly, a signal\
    \ is a kind of message and the kind of message is associated with certain conditions\
    \ (such as the user selecting a list item) and with message-specific data passed\
    \ to the connected callbacks (such as the index of the user selected). User callbacks\
    \ are connected to a particular signal and a particular object instance. That\
    \ is, you do not connect the ‘clicked’ signal of all buttons; rather, you connect\
    \ to the ‘clicked’ signal of a particular one. (However, there is a way to monitor\
    \ all emissions of a signal—these callbacks are called ‘emission hooks’)\n\nSignals\
    \ are typically associated with a class function pointer which is invoked every\
    \ time the signal is emitted; if NULL, the pointer-to-class serves as a default\
    \ handler for the signal. It is up to the author of each GtkObject subclass whether\
    \ to provide a space in the class for a default handler, and to implement the\
    \ default handler in the base class. Conventionally, signals have the same name\
    \ as the class they are associated with.\n\nFor example, the GtkButton class has\
    \ a member called clicked; this is registered as the default handler for the ‘clicked’\
    \ signal. However, the GtkButton class does not implement a default handler, and\
    \ leaves the clicked member to NULL. Subclasses of GtkButton could potentially\
    \ fill it in with an appropriate function. If GtkButton implement a default clicked\
    \ handler, subclasses could override it with a different one.\n\nNote that GTK+\
    \ signals have nothing to do with UNIX signals. Sometimes GTK+ confuse the two.\n\
    \n# Adding a New Signal\n\nOnce you use the GTK+ type system and GArg, signal\
    \ registration is fairly transparent. Here is the registration code from GtkButton\
    \ again:\n\n```\nbutton_signals[PRESSED] = \ngtk_signal_new(\"Pressed\",\n  GTK_RUN_FIRST,\n\
    \  object_class->type,\n  GTK_SIGNAL_OFFSET (GtkButtonClass, pressed),\n  gtk_marshal_NONE_NONE);\n\
    ```\n\n146"
