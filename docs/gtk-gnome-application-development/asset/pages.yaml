    signals.


    In general, events go to the window the GdkWindow event occurred on. However,
    there are special cases.


    if a widget has the grab (i.e., if gtk_grab_add() was called, see the section
    called Grabs in Chapter 3), certain events will only be forwarded to the widget
    with the grab, or the children of that widget. Events that occur on other widgets
    are ignored. Only certain user-initiated events by buffer events and events are
    affected by a grab.


    Widget sensitivity (see the section Sensitivity in Chapter 3) also has events
    which are sent. Representing user interaction are not forwarded to insensitive
    widgets.


    As you might expect, widgets with no GdkWindow do not originate events; X sends
    events to windows. There is one exception: containers synthesize events for their
    windowless children.


    The Gtk+ main loop propagates events from child widgets to their parent containers.
    That is, for each event, a signal is emitted first from a child widget, then from
    its immediate parent, then from the parent''s parent, and so on. For example,
    if you click a GdkMenuItem, it ignores the button press and lets the menu a part
    of handle. Some events are not propagated; Table 10 details this.


    Event propagation ends once a widget "handles" the event. This ensures that only
    user-visible change from any user action. Handlers for GdkWidget event signals
    must return a value: Recall that the last handler to run determines the return
    value of a signal—see the section Emitting A in Chapter 3. All events are GDK_RUN_LAST,
    so the return value will come from:


    +   * The last handler connected with gtk_signal_connect_after(_), if any.

    * Otherwise, the default signal handler, if any.

    * Otherwise, the last handler connected with gtk_signal_connect(_), if any.

    * Otherwise, the default return value is FALSE.


    If the emission of an event signal returns TRUE, the Gtk+ main loop will stop
    propagating the event. If it returns FALSE, the main loop will propagate the event
    to the widget. Recall that each event results in two signals: a generic "event"
    and a signal such as "button_press_event" or "key_press_event". If either signal
    returns TRUE, the return value from the generic "event" signal has one additional
    effect: if TRUE, the more specific signal will not be emitted.


    Table 14 summarizes how GdkSignals correspond to event types, which events are
    affected by active grab, and which are propagated from parent to child. Signal
    handlers for all event signals should return a gdk signal and the one which triggered
    the signal, and a user data pointer.


