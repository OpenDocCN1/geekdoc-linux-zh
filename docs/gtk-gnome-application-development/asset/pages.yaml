    # ## Overview of a Gnome Source Tree


    Gnome application trees and distributed tarballs follow a set of conventions,
    most of them widely in the free software community. Aspects of these are formalized
    in documents such as the GNU Project''s Coding Standards (http://www.gnu.org/prep/standards.toc.html)
    and the Linux Filesystem Hierarchy Standard (http://www.filesystem.org/). It''s
    worth using these standards even with non-free software—partially because they
    are very good from a technical standpoint, and because ''going with the flow''
    will save you a lot of trouble, especially if you''re using the GNU toolset. Besides,
    you might want to free your source-someday.


    The GNU toolset, including automake and autoconf, makes it easy to comply with
    these standards. However, there are reasons not to use the GNU tools; for example,
    you might want to build a build that works on platforms such as Windows and MacOS.
    Some of the tools do work with Windows using the Cygnus ''Cygwin'' environment,
    however; see http://sourceware.com/cygwin.


    If you use autoconf users are not required to have these tools in order to build
    your source. The purpose of the tools is to build portable shell scripts that
    work well in any environment.


    The autoconf package encapsulates the lex, autobader, and aututables. Together
    these tools are used to create a portable shell script called configure; configure
    is distributed to users with your software package. It explores the compilation
    system and creates makefiles and a special header called config.h. The files created
    by configure are adapted to the specs of the user''s system.


    configure creates each Makefile from a template, called Makefile.in; automake
    generates Makefile.in from a handwritten Makefile.am. You distribute Makefile.in
    with your software, and users create a Makefile when they run configure.'
