  md: "# Chapter 3. GTK+ Basics\n\n```\nbutton = gtk_button_new();\n\nlabel = gtk_label_new(\"\
    Hello, World!\");\n\nggtk_container_add(GTK_CONTAINER(button), label);\ngtk_container_add(GTK_CONTAINER(window),\
    \ button);\n\ngtk_window_set_title(GTK_WINDOW(window), \"Hello\");\ngtk_container_set_border_width(GTK_CONTAINER(button),\
    \ 10);\n```\n\nEach widget has a function gtk_widget_get_name(), analogous to\
    \ a constructor in C++ or Java. This function allocates a new object, initializes\
    \ it, and returns a pointer to it. The _new() returns a GtkWidget*, even though\
    \ they allocate a subclass; this is for convenience.\n\nOnce you have a GtkWidget\
    \ representing an object, you can manage the object using its methods. All GTK+\
    \ functions begin with the name of the type they operate on, and a pointer to\
    \ that as the first argument. In the above code, gtk_container_add() accepts a\
    \ GtkContainer* as the first argument. GTK_CONTAINER() casts the GtkWidget*, and\
    \ also performs a type check. Casting is required because C does not understand\
    \ the inheritance relationship.\n\nAs you imagine, GtkButton and GtkWindow are\
    \ subclasses of GtkContainer. A GtkContainer can hold any other widget inside.\
    \ This creates a tooltip window, places a button inside it, and places a label\
    \ (line of text) inside the button. Then it sets the window size, and adds a small\
    \ border around the button.\n\n# Signals\n\nNext, you'll want to respond when\
    \ users manipulates the widgets. In this simple application, there are two things\
    \ that can happen: the user click the button, or close the window using a window\
    \ manager. Widgets (actually GtkObjects) emit-signals when something interesting\
    \ happens a program might want to respond. To respond to a signal, you \"connect\
    \ a callback\" to it-ie., register a function to be called when the signal is\
    \ emitted. Here's that code:\n\n```\ngtk_signal_connect(window,\n\t\"delete-event\"\
    ,\n\tGTK_SIGNAL_FUNC(delete_event_cb),\n\tNULL);\n```\n\n```\ngtk_signal_connect(button,\n\
    \t\"clicked\",\n\tGTK_SIGNAL_FUNC(button_click_cb),\n\tlabel);\n```\n\ngtk_signal_connect()\
    \ specifies the GtkObject to monitor, the callback to connect to, and finally\
    \ a user_data—this is an gpointer which will be passed to the callback. The macro\
    \ GTK_SIGNAL_FUNC() casts the callback to a standard function signature; since\
    \ callbacks have a variety of signatures, the alternative would be dozens of gtk_signal_connect()\
    \ variants.\n\nGTK+ performs runtime sanity checking; the GTK_OBJECT() macro includes\
    \ a type check in addition to a C cast, and gtk_signal_connect() will verify that\
    \ the object can actually emit the signal you've specified.\n\n53"
