  md: '# # Chapter 8. Gnome Application Checklist


    Almost all Gnome applications should support a common set of features. This checklist
    lists the most important ones. Always remember: Gnome is a direct response to
    the problem of application heterogeneity in the X environment, and one of the
    most important goals of any Gnome application should be look-and-feel consistent
    with Gnome applications, starting with the source code seen by programmers and
    ending with the GUI you present to users.


    +   - Create a standards-compliant source tree. Use the Gnome `autoconf` macros,
    and the `gnome-config` script, to reliably locate the Gnome libraries and header
    files.

    - Include a README file describing the page.

    - Include the standard `INSTALL` file describing how to compile and install the
    package; change the standard file to reflect anything specific to your application.

    - Include a copyright, in a file called `COPYING`.

    - Internationalize your application with GNU `gettext` and the standard C library.

    - Include the `intl` directory within your application, so users can build the
    application without having `gettext`. Include `intl` in your header file path.

    - Define the `G_LOG_DOMAIN` preprocessor symbol to identify the origin of glob
    error messages.

    - Define the `G_GNOMELOCATED` preprocessor symbol so Gnome can find translation
    files.

    - Install a `.desktop` file so your application will appear on the Gnome desktop''s
    menus.

    - Install help files using `topic.dat` files so the Gnome help browser can locate
    them.

    - Be sure the `make distcheck` target works; this will catch many common file
    errors.

    - Set up a `opt` argument parser; at a minimum, you will probably want to support
    with the `-geometry` option.

    - All configuration should support session management; at a minimum, it should
    save and restore the currently documents.

    - If appropriate, use the `GnomeApp` for your main document windows; this widget
    gives Gnome applications a consistent look-and-feel.

    - Call `gtk_window_set_class()` to set the class hint on your windows, so you
    can customize how windows treat them.

    - Use Unity to create menus and toolbars; when appropriate, use the Gnome standard
    for menu items.

    - Add a status bar to display hints for the menu items, and any other status your
    application has to report.

    - Use `GnomeDialog` and its subclasses for dialogs.

    - Add online help, including tooltips and documentation for display in the help
    browser.'
