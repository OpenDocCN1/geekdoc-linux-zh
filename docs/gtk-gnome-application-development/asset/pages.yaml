    # Object Initialization


    To write a GkObject, you must implement the methods provided by the GkObject interface,
    or at least be happy with the default implementations. There are only five GkObject
    methods; two of them are get_arg and set_arg, described in the section called
    Using Arguments in Your Own GkObject Subclass. The other three implement destruction;
    here are the fields in GkObjectClass:


    ```

    void (* shutdown) (GkObject *object);

    void (* destroy) (GkObject *object);


    void (* finalize) (GkObject *object);

    ```


    As you might guess, objects are destroyed in a three-stage process. Each method
    represents one stage in the process; if your subclass overrides any of them, it
    must “chain up” to the corresponding method in the parent class (see the section
    called Chaining Up). The three methods do the following:


    +   - The shutdown method allows objects to perform actions before destruction.
    Most subclasses do not override this method; the default shutdown emits the “destroy”
    signal to start the next phase. (The implementation will always be invoked


    Note: Objects can be destroyed regardless of their reference count. This means
    that the shutdown method is invoked and the destroy signal is emitted. However,
    as long as the reference count is greater than 0, the object will not be finalized.
    For example, the GtkWidget shutdown implementation removes the widget from its
    parent container, and unrealizes the widget. This is especially important for
    containers; their destroy method destroys the container. If the container was
    still visible and the user would see each child disappear, followed by the chain
    method, everything disappears at once.


    The destroy method frees as many resources as possible without rendering the object
    “unsafe”. If your object has invariants ensuring its integrity, a destroy method
    will not violate them. All public functions exported by an object implementation
    should gracefully handle destroyed objects (they should not crash—remember that
    an object


