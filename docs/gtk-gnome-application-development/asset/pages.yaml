    Figure 6-3. Adding Widgets to GnomeUIInfo


    # Menus and Toolbars with GnomeUIInfo


    It''s tedious to create large menus, especially if they have features such as
    icons and keyboard accelerators. Gnome provides a simple solution. You assemble
    a GnomeUIInfo struct for each menu item, simply listing its characteristics: name,
    icon, accelerator and so on. Gnome libraries can automatically create menus from
    arrays of GnomeUIInfo templates. The same method works with toolbars.


    Here''s the declaration of struct GnomeInfo:


    ```

    typedef struct {

    GnomeUIInfoType type;

    gchar* label;

    gchar* hint;

    pointer mouseinfo;

    pointer user_data;

    pointer unused_data;

    GnomeUIPixmapxtype pixmap_type;

    pointer pixmap_info;

    guint accelerator_key;

    GdkModifierType ac_mods;

    GtkWidget* widget;

    GnomeUIInfo;};

    ```


