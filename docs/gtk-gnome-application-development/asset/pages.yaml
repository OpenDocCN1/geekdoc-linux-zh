    autoconf processes configure.in to produce a configure script. configure is a
    portable shell script which examines the environment to determine which libraries
    are available, which features the platform, where libraries and headers are located,
    and so on. Based on this information, it modifies compiler flags, generates makefiles,
    and/or outputs the file config.h with appropriate preprocessor symbols. Again,
    configure does not require autoconf to run; you only use it before distributing,
    so users do not have to have autoconf.


    Your job is to write configure.in. The file is basically a series of m macros,
    used to expand snippets of shell script according to the parameters you pass them.
    You can also write shell code manually. Really understanding how to write a configure
    script requires some knowledge of shell scripting and the Bourne shell (which
    is a black art). Fortunately, you can cheat: start with an existing configure.in
    and modify it to suit your application. There is also an autoconf manual which
    describes the many pre-written macros shipped with autoconf.


    The GTK+ and Gnome developers have simplified things still further, by providing
    macros to locate GTK+ and Gnome on the user''s system.


