  md: "# Object Arguments\n\nArguments are one of the most interesting features of\
    \ GtkObject. Arguments are a mechanism for handling CORBA's Interface Definition\
    \ Language (IDL) calls an attribute; a value with a \"getter\" and a \"setter\"\
    . In concrete terms, object arguments pair a key (which is a string) with a value\
    \ (represented as a GArg). Each GtkObject subclass can register permissible keys\
    \ and the Gtypes of their associated values.\n\nUsing object arguments, one can\
    \ discover at runtime what an object has, and get or set their values. This is\
    \ very useful for people implementing API builders, since most of widget dialog\
    \ configurations can be automated. It can also make it easier to write GTK+ bindings\
    \ for scripting languages. It can be convenient for programmers, since they can\
    \ avoid all get/set functions—the GNtkCanvas, for example, use object arguments\
    \ for almost all of its API. Finally, object arguments are configurable via the\
    \ gtkrc configuration mechanism in a future version of GTK+, making it possible\
    \ for users to extensively customize GTK software.\n\n# Setting Object Arguments\n\
    \nMost commonly, arguments are used as an API to set attributes of widgets. However,\
    \ not all of GTK+ API has been exported via objects, so it is not always possible.\n\
    To set attributes, the most convenient interface is gtk_object_set ( ). Here's\
    \ an example:\n\n```\ngtk_object_set (GTK_OBJECT(hbox),\n    \"GtkContainer::border_width\"\
    , (gulong) 10,\n    NULL);\n```\n\nThe above code is identical in effect to:\n\
    \n```\ngtk_container_set_border_width (GTK_CONTAINER(hbox), 10);\n```\n\nIt is\
    \ up to you to use; it depends on the context. Typically, you would use the argument\
    \ mechanism if you have a reason to, i.e. if you are using your runtime-oriented\
    \ features. However, if you are setting several attributes, it may be easier to\
    \ type and read.\\gtk_object_set () takes a GtkObject as the first argument, followed\
    \ by any number of key-value pairs. If a key is not defined for the object you\
    \ pass in, a runtime error will be triggered. The list of key-value pairs must\
    \ be terminated with a NULL key. When a GtkObject registers itself with GTK+,\
    \ it tells GTK+ what type of value to expect after each key. For the aggregate\
    \ functions gtk_object_set () will expect more than one argument. For example,\
    \ a first argument and then user data argument will be expected after each key.\
    \ (Table 9-1 gives the types of the expected arguments.)\n\nIt is permissible\
    \ to leave off the object class portion of the object name—“GtkContainer::border_width\"\
    \ can be simple \"border_width\",\n\n```\ngtk_object_set (GTK_OBJECT(hbox),\n\
    \    \"border_width\", (gulong) 10,\n    NULL);\n```"
