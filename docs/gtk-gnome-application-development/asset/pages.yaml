  md: "# Chapter 9. The GTK+ Object and Type System\n\nThe type field contains the\
    \ value's GtkType, as you might expect. The name field is an object argument name—more\
    \ on arguments in a moment. The final union stores a value of the appropriate\
    \ type; there is one union member for each fundamental type. This value field\
    \ be accessed using a special set of macros provided for the purpose, listed each\
    \ macro corresponds to a fundamental type. These macros are defined so that you\
    \ can use the & * operator on them; e.g.&GTK_VALUE_CHAR(arg).\nTo print a GtkArg's\
    \ value, you might write code like this:\n\n```\nGtkArg arg;\n/* ... */\nswitch\
    \ (GTK_FUNDAMENTAL_TYPE (arg.type))\n{\ncase GTK_TYPE_INT:\n    printf(\"%*arg:\
    \ %d\\n\", GTK_VALUE_INT(arg));\n    break;\n/* case for each type ... */\n}\n\
    ```\n\n```\n#include <gtk/gktypeutils.h>\nGTK_VALUE_CHAR(arg);\nGTK_VALUE_UCHAR(arg);\n\
    GTK_VALUE_BOOLEAN(arg);\nGTK_VALUE_INT(arg);\nGTK_VALUE_UINT(arg);\nGTK_VALUE_LONG(arg);\n\
    GTK_VALUE_ULONG(arg);\nGTK_VALUE_FLOAT(arg);\nGTK_VALUE_DOUBLE(arg);\nGTK_VALUE_STRING(arg);\n\
    GTK_VALUE_ENUM(arg);\nGTK_VALUE_FLAGS(arg);\nGTK_VALUE_BOXED(arg);\nGTK_VALUE_POINTER(arg);\n\
    GTK_VALUE_OBJECT(arg);\nGTK_VALUE_SIGNAL(arg);\nGTK_VALUE_ARGS(arg);\nGTK_VALUE_CALLBACK(arg);\n\
    GTK_VALUE_C_CALLBACK(arg);\nGTK_VALUE_FOREIGN(arg);\n```\n\n# Figure 9-2. Macros\
    \ for Accessing GtkArg Values\n\nSome uses of GtkArg require you to assign a value\
    \ to it. The GTK_VALUE_ macros are not appropriate here; instead, a parallel set\
    \ of macros RETLOC which return a pointer to an assignable location. These are\
    \ called GTK_RETLOC_CHAR(arg), GTK_RETLOC_UCHAR(arg), and so on.\n\n139"
