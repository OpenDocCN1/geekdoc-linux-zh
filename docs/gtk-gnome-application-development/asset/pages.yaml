  md: '# # Chapter 16. Frequently Asked Questions


    This chapter contains some commonly-asked questions, and answers, with references
    to the rest of the book. See the table of contents for a summary of the questions.


    # ## Questions, with Answers


    # ### How do I make my application beep?


    Call the `gdk_beep()` function.


    # ### When I need to destroy my widgets?


    See the section called *Widget Life Cycle* in Chapter 3 for the simple answer,
    and the section called *Object Finalization* in Chapter 9 for more details.


    # ### When I turn on memory profiling in glib, my application becomes unstable.
    What gives?


    Normally `g_malloc()` and `g_free()` are just wrappers around `malloc()` and `free()`,
    with a couple of extra features described in the section called *Memory* in Chapter
    2. When you turn on memory profiling, they are no longer interchangeable with
    `malloc()` and `free()`. So you incorrectly mix the two pairs of functions, your
    program will crash.


    If you''re using the GNU C library, which comes with nearly all Linux distributions,
    it has a special feature which can help you debug: Set the `MALLOC_CHECK_` environment
    variable to 2 before running your program, then run the program in `gdb`. As soon
    as `free()` gets a pointer not created by `malloc()`, `abort()` will be called.


    # ### To create a custom display, I want to place widgets in arbitrary locations,
    or move them around rapidly, or draw to them directly. How?


    You are probably fighting a losing battle. Widgets aren''t really what you want,
    most likely: Consider using a `GtkDrawingArea` or the `GnomeCanvas` to create
    your custom display.


    If you really need interactive widgets, such as a `GtkEntry` or `GtkButton`, you
    can try to use `GtkLayout` or `GtkFixed`.


    If you have very specialized needs, you probably need to write your own widget.
    Chapter 11 tells you how to do so.'
