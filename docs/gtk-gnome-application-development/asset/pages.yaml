  md: '# The Mouse Pointer


    The mouse pointer is represented on the screen by a small bitmap cursor. The mouse
    pointer is normally an arrow shape, but it can be changed on a window-by basis.
    As the pointer moves, it generates motion events and moves the cursor on the screen
    to give the user feedback.


    # Pointer Location


    You can query the pointer''s location with gdk_window_get_pointer() (Figure 10-7).
    This function requests the X and Y coordinates of the pointer relative to the
    window passed as its first argument. It also requests the currently active modifiers
    (including modifier keys and buttons; this field is identical to the state in
    several events, such as button events). If NULL is passed for the x, y, or state,
    arguments will be ignored.


    ```

    #include <gdk/gdk.h>

    GdkWindow* gdk_window_get_pointer(GdkWindow* window, wint* x, wint* y, GdkModifierMask*
    state);

    ```


    Figure 10-7. Querying Pointer Location


    # Grabbing the Pointer


    It is possible to grab the pointer, which means that all pointer events will go
    to the grab window for the duration of the grab. Normally pointer events go to
    the window pointer is inside. You should grab the pointer, for example, if the
    user is clicking-and-drag to select a rectangular area. If you drag the pointer
    outside the window, you will continue to track the pointer''s location and change
    the selection accordingly. The grab also ensures that pointer events won''t be
    sent to other applications.


    To grab the pointer, call gdk_pointer_grab(), shown in Figure 10-8. The first
    argument to this function is the grab window; this window will receive events
    during the grab. The next argument should be TRUE or FALSE; it specifies which
    events will go only to the grab window or its child windows as well. The config
    specifies a pointer to confine to. The user will not be able to move the pointer
    outside this window unless they use a different cursor for the duration of the
    grab; see the next section for creating a cursor. If you don''t want to change
    the cursor, pass NULL as the cursor argument. (Note: it is safe to destroy the
    cursor immediately after calling gdk_pointer_grab() as it is a server-resource
    and will not deallocate the grab until it is over)


    The final argument, time when the grab should take effect, server time. This is
    intended to resolve conflicts if two clients try to grab the pointer simultaneously;
    the time must be after the current time, and it must not be in the future. Usually
    you will want to use the time from the event you''re processing, or the GDK_CURRENT_TIME
    macro. GDK_CURRENT_TIME is a constant that tells the X server to substitute the
    current time.


    gdk_pointer_grab() returns TRUE if successful. It is possible for it to fail if
    the grab window or confine to window is hidden, another client has the grab already,'
