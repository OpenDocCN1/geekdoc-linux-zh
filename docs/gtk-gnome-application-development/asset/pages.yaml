  md: "# Events\n\nThe GnomeCanvasItem class has a slot in its vtable called event;\
    \ this is the only GnomeCanvasItem class function associated with a signal. None\
    \ of the stock items implement a default handler for event, but of course your\
    \ own canvas item could.\n\nThe return value of event works like the GtkWidget\
    \ 'event'; if the last signal handler returns FALSE, the event is propagated to\
    \ the parent's item (by emitting the event signal on the parent), if TRUE propagation\
    \ ends.\n\n# Point\n\nThe point method is used to determine which canvas item\
    \ is located at a given point. The canvas uses this information to decide which\
    \ item should receive events. A point method calculates the distance from some\
    \ point to the canvas item. Canvas items must correctly report a distance of zero\
    \ if the point is on the item, or they will not receive events; they must report\
    \ non-zero if the point is not on the item, or they will receive too many zero\
    \ events. The exact value returned is nearly as important as the zero/non-zero\
    \ distinction\n\nFor convenience, the point method receives the same point-translated\
    \ into both item and canvas coordinates.\n\nThe point method also receives a pointer\
    \ to a GnomeCanvasItem; non-group items store a pointer to themselves in this\
    \ space. Groups store the *actual_item* received from the topmost child which\
