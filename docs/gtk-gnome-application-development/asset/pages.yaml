    The fourteen fields are:


    +   - Foundry: the vendor who created the font, such as Adobe or Sony. mis used
    for some generic fonts that come with X.

    - Family: the typeface or style of the font—Courier, Times, Helvetica, etc.

    - Weight: Bold, demibold, medium, etc.

    - Slant: Italic, Roman, Oblique (abbreviated as i, r, or o)

    - Set Width: the "proportional width" of the font; possible values include normal,
    condensed, semicondensed, etc.

    - " Style": any additional information about the font can go in this field; it
    is used to distinguish two fonts that otherwise have the same name. There are
    no constraints on the string.

    - Pixels: the pixel size of the font.

    - Points: the point size of the font, in tenths of a point. A point is 1/72 of
    an inch; the relationship of point size to pixel size is determined by the resolution
    (dots per inch) the X server displays. Typically people do not configure their
    X server to monitor, so the X server''s idea of the current resolution may be
    wildly.

    - Horizontal Resolution: horizontal display resolution in dots per inch (dpi)
    which is designed for.

    - Vertical Resolution: vertical display resolution of the font is designed for.

    - Spacing: Monospace (abbreviated m) or proportional (abbreviated p). Indicates
    whether all characters have the same width or different characters have different
    widths.

    - Average Width: the width of all characters in the font, in tenths of a point.

    - Set Registry: the organization or standard defining the character set.

    - Character Set Encoding: specifies the specific character set encoding. These
    last for European languages almost always use the "Latin-1" character set, which
    is an 8-bit encoding including ASCII as a subset.


