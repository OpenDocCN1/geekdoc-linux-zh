    | GTK_TYPE_FLOAT | gfloat |

    | GTK_TYPE_DOUBLE | gdouble |

    | GTK_TYPE_STRING | gchar* |

    | GTK_TYPE_ENUM | Any enumeration |

    | GTK_TYPE_FLAGS | guint |

    | GTK_TYPE_BOXED | gpointer |

    | GTK_TYPE_POINTER | gpointer |

    | GTK_TYPE_SIGNAL | GtkSignalFunc, gpointer |

    | GTK_TYPE_ARGS | gint, GtkArg* |

    | GTK_TYPE_CALLBACK | GtkCallbackMarshal, gpointer, GtkDestroyNotify |

    | GTK_TYPE_C_CALLBACK | GtkFunction, gpointer |

    | GTK_TYPE_FOREIGN | gpointer, GtkDestroyNotify |

    | GTK_TYPE_OBJECT | GObject* |


    Some of the fundamental types require further explanation.


    +   * GTK_TYPE_INVALID: used to signal errors.

    * GTK_TYPE_NONE: used to indicate a return value when specifying the nature of
    a signal.

    * GTK_TYPE_BOXED: Subtypes of GTK_TYPE_BOXED are used to mark the type of a generic
    pointer; language bindings will special these types. GDK types, such as GdkWindow,
    are registered as boxed types.

    * GTK_TYPE_SIGNAL: special-classed in GtkObject; it allows us to connect signal
    handlers with `gtk_object_set()`. It should not be used in application code.

    * GTK_TYPE_ARGS: type of an array of GtkArg (when used with `gtk_object_set()`,
    an integer length following the array is expected as arguments).

    * GTK_TYPE_CALLBACK: interpreted language bindings use this to pass callbacks
    around.

    * GTK_TYPE_C_CALLBACK: this is used for other kinds of callbacks, i.c. callbacks
    that are not attached to signals (such as the argument to a `foreach()` function).

    * GTK_TYPE_FOREIGN: unused in current GTK+ code. Represents a pointer plus a function
    used to destroy the pointed-to resource; represent object data (see the section
    called *Attaching Data to Objects*, for example).


    A fundamental type describes not only the data layout but also how memory is managed.
    For values passed in arguments, the called function is not allowed to retain the
    pointer beyond the duration of the call. For returned values,


