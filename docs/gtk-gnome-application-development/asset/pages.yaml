  md: '# # Chapter 1. Introduction


    This chapter gives you an overview of the technologies described in this book.


    # # What is Gnome?


    Gnome is a free (or "open source") software development project started in 1997
    by Miguel de Icaza of the Mexican Autonomous National University and a small team
    of programmers from around the world. Inspired by the success of the small K Desktop
    Environment (KDE) project, the burgeoning popularity of the GNU/Linux operating
    system, and the power of the GTK+ graphical toolkit, Gnome grew quickly — within
    a year hundreds of programmers were involved and many thousands of lines of code
    had been written. Gnome became a powerful framework for GUI application development
    which runs on any variety of UNIX.


    "Gnome" is actually an acronym: GNU Network Model Environment. Originally, the
    project was intended to create a framework for applications, similar to Microsoft''s
    OLE and COM technologies. However, the scope of the project rapidly expanded;
    it became clear that substantial groundwork was required before the "network object"
    part of the name could become reality. The latest development versions of Gnome
    include an object manager called Bonobo, and Gnome 1.0 included a fast, CORBA
    2.2 ORB called Orbit.


    Gnome is part of the GNU Project, whose overall goal is developing a free operating
    system (GNU) plus applications to go with. It stands for "GNU''s Not Unix", a
    humorous way of saying the GNU operating system is UNIX-compatible. You can learn
    more about Gnome at http://www.gnu.org.


    The desktop environment includes a file manager, a "panel" for task switching,
    launching programs, and docking apps, a "center control" for configuration, and
    several bells and whistles. These programs hide the underlying shell which should
    be an easy-to-use graphical interface.


    Gnome''s development framework makes it possible to write decent, easy-to-use,
    interoperable applications. The X Window System made a deliberate choice not to
    impose any user interface policies; Gnome adds a "policy layer," creating a consistent
    look-and-feel. Finished Gnome applications work with the desktop, but can also
    be "standalone" — users only need to install shared libraries. It is even possible
    to write Gnome applications that do not rely on the X System; you might need to
    provide a non-graphical CORBA service, for example.


    This book is about Gnome from a developer''s point of view; it describes how to
    write a Gnome application using the Gnome libraries and tools.


    # # The Gnome Development Framework


    Gnome''s application development framework centers around a suite of libraries,
    all'
