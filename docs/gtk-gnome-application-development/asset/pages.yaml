    | GTK_TYPE_NONE | void |

    | GTK_TYPE_CHAR | gchar |

    | GTK_TYPE_UCHAR | guchar |

    | GTK_TYPE_BOOL | gboolean |

    | GTK_TYPE_INT | gint |

