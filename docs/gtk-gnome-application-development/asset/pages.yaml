  md: '# Zooming


    The canvas gives you zooming "for free"; it is included in the world-to-canvas
    and world-to-world coordinate system conversions. You can set the zoom factor
    with gnome_canvas_set_pixels_per_unit() (Figure 12-7). By default, ratio of pixels
    to canvas is 1.0, meaning nothing. Specifying a value less than 1.0 means reduced
    size; greater than 1.0 means increased size.


    In antialased mode, you could achieve the same visual effect by scaling an affine
    transformation to the root canvas. The pixels_per_unit member of the GnomeCanvas
    struct predates the canvas''s view of affines. Still, gnome_canvas_set_pixels_per_unit()
    is a bit more convenient than the affine transform method, and it works in GDK
    mode (Because GDK uses Xib primitives, it''s nontrivial to implement affine transformations;
    a future version of Gnome may do so, however).


    ```

    #include <libgnome/gnome-canvas.h>

    gnome_canvas_set_pixels_per_unit(GnomeCanvas* canvas, double ppu);

    ```


    Figure 12-7. Canvas Zooming


    # Canvas Items


    Most of the time you will be interested in canvas items rather than the canvas
    itself. Canvas items are typically very easy to use, compared to widgets; none
    of the stamp-items have their own signals; (Since GnomeCanvas is a subclass of
    GObject, however, you could create an item with signals if you wanted to). The
    GnomeCanvas base class has a single signal, "event", which is used to convert
    all types of events. The "event" signal has no handler; canvas items do not respond
    to events unless you connect handlers of your own. Figure 12-8 lists all the useful
    functions for working with the GnomeCanvas base class.


    To create a canvas item, use the generic gnome_canvas_item_new(). This function
    accepts the group to place the item, in the GtkType of the GnomeCanvas subclass
    to create, and finally a NULL-terminated list of arguments to set. The argument
    list is purely for convenience, so you don''t have to call gnome_canvas_item_set()
    immediately. gnome_canvas_item_new() creates a new instance of the type with gtk_type_new(),
    adds the item to the GnomeCanvas, and schedules it to redraw.


    To destroy and remove an item from the canvas, call gtk_object_destroy(). You
    can use the standard reference counting mechanism with canvas items.


    You can set an item''s affine using gnome_canvas_item_affine_absolute()


    Items in a group are normally stacked in the order you add them, with the most
    recently-added item "top" and the oldest item on the bottom. You can manipulate
    the stacking order with gnome_canvas_item_raise() and gnome_canvas_item_lower().
    These move an item up or down by the given number of positions. It is safe to
    pass a too-large value for positions; the item will be moved as far as possible
    and no'
