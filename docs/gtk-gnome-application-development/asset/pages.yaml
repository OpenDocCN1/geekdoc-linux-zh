  md: "# Chapter 13. Writing a GnomeCanvasItem\n\nthe redraw region in canvas pixel\
    \ coordinates that this buffer represents. rect.x0 and rect.y0 are the buffer\
    \ offsets and correspond to row 0, column 0 in the RGB buffer; you can convert\
    \ from canvas pixel coordinates to RGB buffer coordinates by subtracting these\
    \ values. rect.x1 and rect.y1 are not part of the redraw area, but are bounds.\
    \ That, the coordinates in the rectangle are greater than or equal to rect.x0\
    \ and less than rect.x1.\n\nAs an optimization, the canvas does not initialize\
    \ the RGB buffer with the background color, because the first canvas item it might\
    \ cover the entire background any-way. Thus, if your canvas item is the first\
    \ one to render, you must put some pixel value in every pixel of the redraw region\
    \ defined by the buffer's rect. If your item does not cover a pixel, you should\
    \ fill that pixel with the bg_color; bg_color is a packed RGB value (no alpha).\
    \ If you do this manually, unpack an RGB value like this\n\nguchar: r, g:\n\n\
    ```\nr = (rgb >> 16) & 0xff;\ng = (rgb >> 8) & 0xff;\nb = rgb & 0xff;\n```\n\n\
    However, a convenient function is to fill a GnomeCanvasBuf with its bg_color:\n\
    \n```\nvoid\ngnome_canvas_buf_ensure_buf (GnomeCanvasBuf *buf)\n{\n  guchar *bufptr;\n\
    \  int y;\n\n  if (buf->is_buf) {\n    bufptr = buf->bufptr;\n    for (y = buf->rect.y0;\
    \ y < buf->rect.y1; y++) {\n      art_bg_fill(bufptr,\n                  buf->bg_color\
    \ >> 16,\n                  buf->bg_color >> 8) & 0xff,\n                  buf->bg_color\
    \ & 0xff,\n                  buf->rect.x1 - buf->rect.x0);\n      bufptr += buf->rowstride;\n\
    \    }\n    buf->is_buf = 1;\n  }\n}\n```\n\nAs you can see from the implementation\
    \ of gnome_canvas_buf_ensure_buf(), is_bg is a flag indicating that the RGB buffer\
    \ still contains memory garbage; it has been initialized, and subsequent items\
    \ indicates that the buffer will only draw themselves, ignoring background pixels.\
    \ These two flags are mutually exclusive; if your item receives a buffer with\
    \ is_bg set, it takes steps to fill the buffer, unset is_bg, and set is_buf:\n\
    \n```\nif (buf->is_bg) {\n  gnome_canvas_buf_ensure_buf(buf);\n  buf->is_bg =\
