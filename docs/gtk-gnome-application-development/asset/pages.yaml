    GnomeCanvas displays a text string. You can specify the coordinates of the string
    as an ordered pair; these coordinates represent the location of the text''s anchor.
    For example, if the "anchor" argument is set to GTK_ANCHOR_NORTH, the text item''s
    coordinates will represent the location of the top-center of the item. That is,
    the text will be centered around the X position and just below the Y position.
    Possible anchor values are:


    +   * GTK_ANCHOR_CENTER

    * GTK_ANCHOR_NORTH

    * GTK_ANCHOR_NORTH_WEST

    * GTK_ANCHOR_NORTH_EAST

    * GTK_ANCHOR_SOUTH

    * GTK_ANCHOR_SOUTH_WEST

    * GTK_ANCHOR_SOUTH_EAST

    * GTK_ANCHOR_WEST


    Affine transformation of GnomeCanvasText is not implemented well. Because the
    X font model is imperfect and limited, there is no good way to rotate and otherwise
    transform rendered text. In antialised canvas implement this in the only way it
    can: it the entire-font to a GdkPixmap, then copies the pixmap to GdkImage, which
    reads individual pixels of the image into a client-side bitmap, then copies the
    characters to be displayed from the entire-font bitmap into a temporary buffer,
    then uses libpix to apply any transformations to buffer, then copies the transformed
    buffer to the RGB buffer. Finally the canvas copies the RGB buffer to the screen.
    Needless to say that this is more than necessary. Scaling and rotating bitmaps
    results in a low quality image. If you try to use GnomeCanvasText with antialised,
    you will probably notice this: if your canvas is slow to update, respect the text
    item.


    There are plans to fix the text item, using a new font abstraction called Gnome.
    Gnome 1.0 lacks this feature.


    There is not good solution to the problem; if your application allows, you can
    get increased speeds by creating your own text item that caches the entire-font
    bitmaps. If you don''t render the same fonts often, this can be useless. Another
    possibility is to use X Type 1 fonts and use a rasterization library like tillib,
    but this limits the fonts available to you and adds a library dependency. You
    could also use True fonts with the FreeType library, or use the Display PostScript
    extension to X (XDFs).


    Unfortunately, your best bet is probably to wait for the Gnome feature in a version
    of the Gnome libraries.'
