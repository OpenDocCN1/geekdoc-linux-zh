  md: "\"in the middle\" and forward should only the first leave event and the last\
    \ enter into widgets. If you should be getting entering/leave events when you\
    \ aren't, this optimization is a likely cause.\n\nHere is GdkEventCrossing:\n\n\
    ```\ntypedef struct _GdkEventCrossing GdkEventCrossing;\n\nstruct _GdkEventCrossing\
    \ {\n  GdkEventType type;\n  GdkWindow *window;\n  gint send_event;\n  GdkWindow\
    \ *subwindow;\n  guint32 time;\n  double x;\n  double y;\n  double x_root;\n \
    \ double y_root;\n  GdkCrossingMode mode;\n  GdkNotifyType detail;\n  gboolean\
    \ focus;\n  guint state;\n};\n```\n\nAgain, many of the fields will be familiar,\
    \ coordinates relative to the window and the root window, a time stamp, a state\
    \ bitfield indicating which buttons and modifiers are active, and the standard\
    \ three fields from GdkEventAny. However, there are several new fields.\n\nThe\
    \ standard field contains a pointer to the pointer which is entering or leaving;\
    \ x and y are relative to this. However, the pointer may be in a child of the\
    \ window receiving the event before a leave event occurs; the pointer may end\
    \ up in a child window when an enter event occurs. In these cases, subdivision\
    \ is set to the child window. Otherwise subdivision will receive its own enter\
    \ leave events, if GDK_ENTER_NOTIFY_MASK or GDK_LEAVE_NOTIFY_MASK are in its mask.\n\
    \nThe mode field indicates whether the event occurred normally, or as a part of\
    \ grab. When the pointer is grabbed or ungraded (see the section The Mouse Pointer),\
    \ it may be moved; crossing events caused by a grab have the GDK_CROSSING_GRAB\
    \ mode, those caused by an ungroup have GDK_CROSSING_UNGRAB, and all others have\
    \ GDK_CROSSING_NORMAL. This field appears to be completely useless; some quick\
    \ trips through GTK+ and Gnome reveal no examples of its use.\n\nThe detail field\
    \ is rarely used. It gives information about the relative positions of the window\
    \ being left and the window being entered. It has two simple and useful values:\n\
    \n+   - GDK_NOTIFY_INFERIOR marks a crossing event received by a parent window\
    \ when the pointer moves into or out of a child window.\n- GDK_NOTIFY_ANCESTOR\
    \ marks a crossing event received by a child window when the pointer moves into\
    \ or out of its parent window.\n\nOther values are also possible: GDK_NOTIFY_VIRTUAL,\
    \ GDK_NOTIFY_INFERIOR, GDK_NOTIFY_NONLINEAR, GDK_NOTIFY_NONLINEAR_VIRTUAL, and\
    \ GDK_NOTIFY_UNKNOWN. However, they are never used and are too complicated to\
    \ explain here."
