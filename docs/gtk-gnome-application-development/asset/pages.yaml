    Status texts are in a stack; when the bar is refreshed, the top item of the stack
    is displayed. The bar is refreshed anytime you manipulate the stack. Pushing some
    text onto the status bar will display that text.

    There are two other options for the status text. You can set some "default" text;
    this is displayed if the bar is empty. The default text is "". You can also set
    the status without changing the stack; "transient" text is immediately displayed,
    but not stored. On the next refresh (the time you push, pop, or set the default),
    the transient text reappears, replaced by the text of the stack.


    GnomeAppBar lists the functions to manage the status text. gnome_appbar_set_status()
    is used to set the status text; gnome_appbar_refresh() forces a refresh without
    changing the stack--which is useful to be sure any transient text has cleared.
    The other functions should be obvious.


    Note that you can use the Gnome as a simple label--one message at a time, always
    replacing the previous message--just like setting the default or the transient
    text, and never use the stack.


    ```

