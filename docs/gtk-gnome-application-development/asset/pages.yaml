  md: '# Chapter 1. Introduction


    Gnome 1.0 is based on GTK+ version 1.2. All GTK+ versions beginning with 1.2 are
    compatible bug-free releases; 1.2.1, for example.


    # ORBit


    ORBit is a CORBA 2.2 ORB written in C. It was designed to be small and fast compared
    to other ORBs, and supports the C language mapping. ORBit is implemented as a
    suite of libraries.


    CORBA, or Common Object Request Broker Architecture, is a specification for Object
    Requests, or ORBs. An ORB is like a dynamic linker, but it works with objects
    rather than routines. At runtime, a program can request the services of a particular
    object; the ORB locates the object and creates a connection between it and the
    program. For example an email program might request an "addressbook" object, and
    use it to look up a person''s name. Unlike dynamic linking, CORBA works across
    a network, and even different programming languages and operating systems to interact
    with one another. If you are familiar with DCOM on the Windows operating system,
    CORBA is analogous.


    # Imlib


    Imlib ("Image Library") provides routines for loading, saving, displaying, and
    scaling images in a variety of popular formats (including GIF, JPEG, PNG, and
    TIFF). It comes in two versions: an Xlib-only version, and a GDK-based version.
    Gnome uses the GDK version.


    # Gnome Libraries


    The libraries in this section are part of the gnome-libs package and were developed
    specifically for the Gnome Project.


    # libnome


    libnome is a collection of GUI-related routines for Gnome applications. It includes
    code to parse configuration files, for example. It also includes interfaces to
    external facilities, such as internationalization (via the GNU gettext package),
    argument parsing (via the pop package), and sound (via the Enlightenment Sound
    Daemon). The gnome-libs takes care of interacting with these external libraries,
    so the programmer does not need to concern himself with their implementation or
    availability.


    # libnomeui


    libnomeui comes GUI-related Gnome code. It consists primarily of widgets to enhance
    and extend GTK+. Gnome generally impose user interface policy, which permits a
    more convenient API (since there is less for the programmer to specify). It also
    results in applications with more consistent interfaces, of course.


