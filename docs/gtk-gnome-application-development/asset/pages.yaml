  md: '# Chapter 6. The Main Window: GnomeApp


    A static initializer is the most convenient way to fill in the struct (but of
    course

    y can create it dynamically if you prefer). Gnome''s routines accept an array
    of GnomeUIInfo, and menus are provided to simplify and standardize the most common
    static initializers. Here''s a typical example, a File menu:


    ```

    static GnomeUIInfo file_menu[] = {

    GNOMEUIINFO_MENU_NEW_ITEM, N_("_New Window"),

    N_("Create a new text window"),

    GNOMEUIINFO_MENU_OPEN_ITEM(open_cb, NULL),

    GNOMEUIINFO_MENU_SAVE_AS_ITEM(save_as_cb, NULL),

    GNOMEUIINFO_SEPARATOR,

    GNOMEUIINFO_MENU_CLOSE_ITEM(close_cb, NULL),

    GNOMEUIINFO_MENU_EXIT_ITEM(exit_cb, NULL),

    GNOMEUIINFO_END

    };

    ```


    There isn''t always a macro for the menu you want, so sometimes you must

    manually specify each of the struct:


    ```

    GNOME_APP_UI_ITEM, N_("_Select All"),

    N_("Select cells in the spreadsheet"),

    select_all_cb, NULL,

    NULL, 0, 0, ''a'', GTK_CONTROL_MASK


    ```


    By now you''re probably wondering what the struct members mean. Simple enough.

    Here''s a breakdown:


    +   - type is a type marker for the GnomeUIType enumeration. See Table 6-1.

    - label is the text of the menu or toolbar. It should be marked for internation-ization
    with the N_() macro. For toolbar buttons.

    - hint is a long description of the item''s function. For toolbar buttons, it
    will appear

    in a tooltip; for menus, it may need to appear in the statusbar.

    - moreindinfo depends on the type of the item. See Table 6-1.

    - user_data should be set to NULL, and is not used. It may be used in future

    versions of Gnome.

    - pixmap_type is a value from the GnomeUIPixmapType enumeration; its purpose

    is to specify the type of the next member, pixmap_info.

    - pixmap_info can be raw pixmap data, a filename, or the name of a Gnome stock

    pixmap.

    - accelerator_key is the key to be used as an accelerator for this item. You can
    use a

    character such as ''a'', or a value from gdk/gdkkeysyms.h.

    - ac_mods is a modifier to use with the accelerator.

    - widget should be NULL; Gnome fills it in when it creates the menu item or toolbar

    button. You can retrieve it, if you need to manipulate the widget in some way.


