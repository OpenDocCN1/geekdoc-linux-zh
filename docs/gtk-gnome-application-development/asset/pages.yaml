    # Figure 5-2. Translation Macros


    Gnome makes this easy, by defining two macros shown in Figure 5-2, the macro _()
    both marks the string for translation and performs the message-catalog lookup.
    You should use it in any context C permits a function call. The N_() is a no-op,
    but marks the string for translation. You can use it when C does not permit a
    function call; for example in static array initializers. If you mark a string
    for translation with N_(), you must eventually call _() to actually perform the
    lookup.

    ''s a simple example:


    ```

    #include <gnome.h>

    static char a[] = {

    _("Translate Me"),

    _("Me Too")

    };

    ```


    ```

    int main(int argc, char** argv) {

    bindtext(PACKAGE, GNOMELOCALEDIR);

    textdomain(PACKAGE);

    printf("Translated String\n");

    printf("%s\n", a[0]);

    printf("%s\n", a[1]);

    return 0;

    }

    ```


    Notice that the string literals "Translate Me" and "Me Too" are marked so gettext
    can find them and produce a list of strings to be translated. Translators will
    use this list to create the actual translations. _() includes a function call
    to perform the translation lookup on each member of the array. Since a function
    call is allowed when the string literal "Translated String" is introduced, everything
    happens in a single step


