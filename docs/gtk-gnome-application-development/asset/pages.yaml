  md: "# Chapter 9. The GTK+ Object and Type System\n\n```\ngtk_object_getv (GTK_OBJECT\
    \ (button),\n      args);\n```\n\n```\ng_assert(args[0].type == GTK_TYPE_ULONG);\n\
    g_assert(args[1].type == GTK_TYPE_RESIZE_MODE);\ng_assert(GTK_FUNDAMENTAL_TYPE(args[1].type)\
    \ == GTK_TYPE_ENUM);\n```\n\n```\nprintf(\"*Border width: %lu Resize mode: %d\\\
    n\",\n       GTK_VALUE_ULONG(args[0]), GTK_VALUE_ENUM(args[1]));\n```\n\n# # Using\
    \ Object Arguments in Your GtkObject Subclass\n\nIf you're writing a custom GtkObject\
    \ or a custom subclass of some existing object, you can register your object arguments\
    \ in the class initialization function, at the same time register your object's\
    \ signals. To do this, call gtk_object_add_arg_type()—here's an example from GtkContainer:\n\
    \n```\ngtk_object_add_arg_type(*GtkContainer::border_width,\\n             GTK_TYPE_ULONG,\n\
    \             GTK_ARG_READWRITE,\n             GTK_ARG_BORDER_WIDTH);\n```\n\n\
    The first argument must be a static string, because GTK+ does not copy it. It\
    \ must also join with the name of your new class, separated from the argument\
    \ by colons (reminiscent of the C++ scope operator). The second argument should\
    \ be the type of the argument; this can be any GtkType GTK+ knows about.\nThe\
    \ third argument contains one or more flags, defined in gtk/gtkobject.h. The following\
    \ flags are:\n\n+   - GTK_ARG_READABLE means the argument's value can be read,\
    \ using gtk_object_getv().\n- GTK_ARG_WRITABLE means the argument's value can\
    \ be written, using gtk_object_set_setv() or gtk_object_set_setv()\n- GTK_ARG_CONSTRUCT\
    \ means the argument should be initialized with a default value. This happens\
    \ with numeric and pointer types; they are set to 0 or NULL, respectively. (This\
    \ happens within gtk_object_new() or gtk_widget_new(), which calls gtk_object_default_construct())\n\
    - GTK_ARG_CONSTRUCT_ONLY means the argument is used only for object construction;\
    \ it cannot be read or written. That is, you can't use these arguments with gtk_object_set_setv()\n\
    - GTK_ARG_CHILD_ARG is used by subclasses of GtkContainer;GtkContainer implements\
    \ a specialized variation on the object system for setting the attributes of child-pair\
    \ arguments (such as passing flags for GtkBox—the flags are not a property of\
    \ the child or the container, but of the pair). You only use this flag if you're\
    \ writing a new type of container, or some other kind of object with semantics.\n\
    - GTK_ARG_READWRITE is shorthand for (GTK_ARG_READABLE | GTK_ARG_WRITABLE). There\
    \ are some limitations on which flags can be used.\n\n162"
