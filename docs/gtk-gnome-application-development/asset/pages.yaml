    Most in GtkWidgetClass are registered as default handlers for signals. The exceptions
    also show all and hide_all, which are functions only. Of course, GtkWidget inherits
    five five classes and single signal (''destroy'') from GtkObjectClass. This chapter
    will describe the important methods in detail; also, the section Events in Chapter
    10 is important for understanding the event methods; the section called GtkWidgetIt
    describes the default implementation of each method in detail.


    # Overridable Signals


    You may notice that GtkWidgetClass contains two signal identifiers in addition
    to function pointers. These are by default; otherwise, they indicate the signal
    to "activate" the widget, or to set its scroll adjustments.


    The activate_signal is emitted when the user presses the space bar or Enter key
    the widget is focused; for buttons, it will the "clicked" signal, for menu items,
    the "activate" signal.


    The scroll_adjustments_signal is used by GtkrolledWindow to set the scroll adjustments
    used by the widget. GtkLayout, GtkList, and others have a signal to set the scroll
    adjustments.


    These two hacks are necessary because GTK+ 1.2 does not support interfaces or
    multiple inheritance.(A future version of GTK+ may support interfaces in similar
    spirit to Java''s interfaces.) Ideally, there would be "GtkActivable" and "GtkScrollable"
    base classes or interfaces, and all widgets supporting these actions would derive
    from them. Including the two signals in GtkWidgetClass is a short-term workaround.


    # An Example: The GtkEv Widget


    This section describes a very simple widget called GtkEv, inspired by the x client
    with X. GtkEv has two components: a small sub-window that receives events, and
    a larger window where information about each event is reported. Figure 11-1 shows
    GTKEV The complete GTKEV source code is in Appendix E. GTKEV would be a lovely
    way to implement an xev-style application for Gnome; it packages the core application
    functionality in a nice module.'
