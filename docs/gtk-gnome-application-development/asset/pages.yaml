  md: '# Chapter 6. The Main Window: GnomeApp


    This chapter describes Gnome''s features for creating your application''s main
    window, complete with menus and a toolbar.


    # The GnomeApp Widget


    All applications, excluding a few special needs, use the GnomeApp window for their
    main window. GnomeApp is a subclass of GtkWindow; it extends the basic topl window
    with convenient menu and toolbar handling. A GnomeApp window is automatically
    user-configurable in several ways:


    +   - Menu and toolbars can be detached from the window, or rearranged in relation
    to one another and the main window contents.

    - Users can disable detachable bars for all Gnome applications.

    - Users can choose whether to have small icons in the application''s menus.

    More options will be added in the future.


    ![](img/f08b98c3d9ba764fd120a058661d79d5_103_0.png)


    Figure 6-1. The Gnome spreadsheet, which uses the GnomeApp widget'
