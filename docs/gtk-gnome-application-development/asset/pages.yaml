  md: "# Chapter 3. GTK+ Basics\n\nis GtkBin which draws a relieved border around\
    \ the child. GtkWindow allows the child to appear in a toplevel window.\n\nThe\
    \ second type of container widget often has GtkContainer as its immediate parent.\
    \ These containers can have more than one child, and its purpose is to manage\
    \ layout. \"Layout\" means that these containers arrange sizes and positions to\
    \ the widgets they contain. For example, GtkBox arranges its children in a vertical\
    \ stack. GtkFixed allows you to position at arbitrary coordinates. GtkPacker gives\
    \ you Tk-style layout management.\n\nThis chapter is the second kind of container.\
    \ To produce the layout without hard-coding any sizes, you'll need to understand\
    \ how to use these. The goal is to avoid making assumptions about window size,\
    \ screen size, widget appearance, and fonts. Your application should ideally adapt\
    \ if these factors change.\n\n# Size Allocation\n\nTo understand layout containers,\
    \ you first have to understand how GTK+ widgets negotiate their size. It's quite\
    \ simple really; there are only two concepts, requisition and allocation. These\
    \ correspond to the two phases of layout.\n\n# Requisition\n\nA widget's requisition\
    \ consists of a width and a height—the size the widget would like to be. This\
    \ is represented by a GtkRequisition:\n\n```\ntypedef struct _GtkRequisition GtkRequisition;\n\
    struct _GtkRequisition {\n    int16 width;\n    int16 height;\n};\n```\n\nDifferent\
    \ widgets choose what size to request in different ways. GtkLabel, for example,\
    \ requests size to display all the text in the label. Most container widgets base\
    \ their size request on the size requests of their children. For example, if you\
    \ place several buttons in a box, the box will be large enough to hold all buttons.\n\
    \nThe first phase of layout starts with a toplevel widget as GtkWindow. Since\
    \ it is a container, GtkWindow asks its child for a size request; that might ask\
