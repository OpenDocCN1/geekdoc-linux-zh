  md: '# Chapter 16. Frequently Asked Questions


    # How can I center a window on the screen?


    If the window is a GnomeDialog, this is user-configurable and you should not do
    it. In most other cases it would be a bit strange; but there are exceptions, such
    as splash screens. The function you want is gtk_window_set_position(); you can
    leave the window''s position up to the window manager (the default), ask it to
    have centered, or ask it to appear under the mouse pointer. There is an enumeration
    which corresponds to these settings: GTK_WIN_POS_NONE, GTK_WIN_POS_CENTER, GTK_WIN_POS_MOUSE.
    For example:


    ```

    gtk_window_set_position(GTK_WINDOW(window), GTK_WIN_POS_CENTER);

    ```


    You do this before calling gtk_widget_show(), because the function affects how
    the window appears when it is first placed on-screen.


    # Is there a widget that does printing?


    No. When people ask this question they are usually looking for an abstract interface
    that draws either to the screen or to a printer. There is nothing like in GTK+
    right GnomeCanvas will probably have a feature like this in a future version.


    There is a gnome-print library available, which handles many unpleasant low-level
    details dealing with fonts and PostScript. It also comes with a printer-selection
    dialog.


    # When I fork (), I get a bunch of warnings and my program crashes. What''s going
    on?


    There are two things to remember:


    +   1. The child process must not try to use the GUI; since it shares file descriptors
    with the parent, including GTK+''s connection to the X server, GTK+ will be confused.

    2. The child process must be terminated with _exit() rather than using exit();calling
    _exit() will shut down GTK and confuse the parent process. (GTK+ registers a "cleanup"
    function using atex())


    # When I need to call gtk_widget_realize() VS. gtk_widget_show() ?


    the section called Realizing, Mapping, and Showing in Chapter 3 goes into some
    detail. Here is a brief summary.


    Showing a widget implies it eventually (to be precise, it schedules the widget
    to be mapped when its parents are mapped). Mapping a widget means calling gdk_window_show()
    to display the widget''s GdkWindow on the screen (if it has GdkWindow, some widgets
    don''t). To map a widget you must first realize it. Therefore if you show a widget
    you don''t need to explicitly realize it with gtk_widget_realize() because it
    will be realized eventually anyway.


    377'
