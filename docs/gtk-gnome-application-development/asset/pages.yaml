    # # Adding a Status Bar


    Adding a status bar is simple enough. Simply call the aptly-named gnome_app_set_statusbar
    function (Figure 6-5) with your statusbar widget as the second argument.


    However, there are some additional things to keep in mind. First, you can use
    Gtkstatusbar or GnomeAppBar as a statusbar. Second, you probably want to use the
    statusbar to display help about menu items as the user moves over them; Gnome
    comes with convenience functions to do this. section describes the two status
    bars; the section Online Help discusses the statusbar display menu item help.


    ```

    #include <libgnome/gnome-app.h>

    void gnome_app_set_statusbar(GnomeApp* app, GtkWidget* statusbar);

    ```


    **Figure 6-5.** Installing a Statusbar


    # # GnomeAppBar


    There''s no reason to prefer GnomeAppBar or GtkStatusBar; they simply have different
    APIs. The GnomeAppBar widget was written later, with several goals in mind:


    +   * To simplify the GtkStatusBar API.

    * To support an optional progress bar next to the status bar, similar to Netscape''s.

    * Eventual support for "interactive" use in the Emacs "minibuffer."

    This is finished in Gnome 1.0, however.


    To create a GnomeAppBar, use gnome_appbar_new() (Figure 6-6). The constructor
    lets you configure the properties of GnomeAppBar; it can have a progress bar (or
    not), a status text area (or not), or interactive (or not). You must either a
    status text area or a progress bar. GnomePreferencesType of constant GNOME_PREFERENCES_NEVER
    means the bar is never interactive.

    GNOME_PREFERENCES_USER means the bar is interactive if the user has activated
    that feature as a Gnome-wide preference.

    GNOME_PREFERENCES_ALWAYS means the bar is always interactive.

    In Gnome 1.0, interactivity is incompletely implemented; so avoid GNOME_PREFERENCES_ALWAYS.
    There are some experimental Gnome functions which provide an assertion of certain
    interactions, allowing users to choose between dialogues and the Emacs-style minibuffer
    approach; when these are more developed, GNOME_PREFERENCES_USER will make sense
    even if you don''t explicitly use the interactivity. GNOME_PREFERENCES_USER is
    the recommended setting.


