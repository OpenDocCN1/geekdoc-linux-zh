    # Receiving GDK Events in GTK+


    In a GTK program, you will never receive GDK events directly. Instead, all events
    are passed to a `GtkWidget`, which emits a corresponding signal. You handle events
    by connecting handlers to `GtkWidget` signals.


    The server sends each X a stream of events. Events are sent and received in the
    order of their occurrence. GTK converts each XEvent into a GdkEvent, then places
    them in a queue. GTK+ monitors GDK’s event queue; for each event, it decides which
    widget (if any) should receive it. For event types (like `button_press`), it also
    defines a ‘event’ signal: the GTK+ main loop calls `gtk_widget_event` to deliver
    an event to a widget; this function emits the ‘event’ signal, then emits signal
    for the specific event type (if appropriate). Some events are handled in special
    ways; notably, drag-and-drop events do not directly connect drag-and-drop


