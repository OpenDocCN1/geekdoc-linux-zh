    The first two arguments to gtk_table_attach() are the child and the place in the
    table. The next two specify which grid lines should form the bounding box of the
    table. The grid lines are not from the left (northwest) corner of the table, starting
    with 0; so a 2 by 3 table will have vertical lines 0, 1 and horizontal lines 0,1,2,3.
