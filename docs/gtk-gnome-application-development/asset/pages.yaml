  md: '# Description


    GtkObject is the base of GTK+ object hierarchy. It is not a graphical component;
    it implements interfaces for reference counting, attaching key-value pairs to
    objects and object destruction (“virtual destructors” in C++ terms). GtkObject
    itself makes heavy use of the GTK+ type system. The signal/callback infrastructure
    of GTK+ works in terms of GtkObject—that is, signals are emitted from a particular
    GtkObject, and callbacks are connected to a particular object and signal.


    Chapter 9 covers GtkObject in detail.


    # Widgets


    Widgets are the reason for GTK+''s existence. Widgets are subclasses of GtkWidget,
    which is in turn a subclass of GtkObject. A widget represents a rectangular region
    on the screen, and may be purely decorative, an interactive control, or a container
    controlling the arrangement of child widgets. Chapter 3 introduces GTK+ and thus
    widgets; Chapter 11 covers widget implementation and concepts in more detail.


    # GtkWidget


    # Library


    GTK+


    # Header File


    ```

    gtk/gtkwidget.h

    ```


    # Description


    GtkWidget is the parent class of all widgets. Chapters Chapter 3 and Chapter 11
    describe widgets in general terms.


    GtkWidget is an abstract base class.


