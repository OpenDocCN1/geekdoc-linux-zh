  md: '# Chapter 10. GDK Basics


    The foreground color is the "pen color" to draw lines, circles, and others.

    The purpose of the background color depends on the particular drawing operation.

    These colors must be allocated in the current colormap with gdk_color_alloc().

    The font used is: in Xlib, it specifies the font for using drawing text. In GDK,
    it used to have the same purpose; but now the GDK routines for drawing text require
    a GdkFont argument. An Xlib context can only store plain fonts, a GdkFont can
    represent a fontset (used to render some foreign languages). GDK should properly
    store a font field in its GdkGC instead of requiring a font argument to the text-drawing
    functions, but it doesn''t.

    The field function specifies how each pixel is drawn with the pixel that already
    exists in under. There are many possible values, but only two are ever:


    +   - GDK_COPY is the default. It ignores the existing pixel (just writes the
    new pixel over)

    - GDK_XOR blends the old and new pixels in an invertible way. That is, if you
    perform exactly the same GDK_XOR operation twice, the first draw is undone by
    the second. GDK_XOR is often used for "rubberbanding", since it makes easy to
    restore the original contents of the drawing once rubberbanding is complete.

    The fill field determines how the tile and stripe fields are used. A tile is a
    pixmap with the same depth as the drawable; it is copied over and into the destination—the
    origin of the first tile is (ts_x_origin, ts_y_origin). A stripe is a bitmap (pixmap
    with depth 1); stipples are also starting at (ts_x_origin, ts_y_origin).


    +   - GDK_SOLID means to ignore the tile and stripe. Shapes are in the foreground
    and background colors.

    - GDK_TILED means that shapes are drawn with the tile, instead of the foreground
    and background colors. Imagine a tile surface underneath your drawable; drawing
    GDK_TILED will scratch the contents of your drawable, revealing the tiled surface.

    - GDK_STIPPLED is like GDK_SOLID with a bitmap mask defined by the stripe. That
    is, bits set in the stripe are not set.

    - GDK_OPAQUE_STIPPLED draws bits in the stipple with the foreground color, and
    not set in the stipple with the background color.


    Some X developers do not implement the more obscure function and modes unless
    entirely. Efficient by using them unnecessarily slows down drawing.

    The optional clip mask is a bitmap; only bits set in it will be drawn. The mapping
    from the clip to the drawable is defined by clip_x_origin and clip_y_origin these
    define the drawable coordinates corresponding to (0,0) in the clip mask. It is
    also possible to use a clip rectangle (the most common and used form of clipping)
    or a region (an arbitrary area on the screen, typically a polygon or list of rectangles).
    To set a clip rectangle, use gdk_gc_set_clip_rectangle():


    ```

    GdkRectangle clip_rect;

    clip_rect.x = 10;

    clip_rect.y = 20;

    clip_rect.width = 200;

    clip_rect.height = 100;

    gdk_gc_set_clip_rectangle(gc, &clip_rect);

    ```


    To off clipping, select the clip rectangle, clip region, or clip mask to NULL.


