    Figure 2-31. Manipulating GHashTable


    GHashTable keeps an internal array size which is a prime number. It also keeps

    a count of the key-value pairs stored in the table. If the average

    of pairs per slot drops below 0.3 (or so, the array is smaller; if it

    goes above 3, the array is larger to reduce collisions. Resizing happens auto-

    m whenever you insert remove items from the table. This ensures the hash

    table''s use is optimal. Unfortunately it is inefficient to rebuild the hash ta-

    over and if you''re doing a large number of insertions or removals. To solve

    t problem, the hash table can be frozen, meaning that resizing is temporarily
    sup-

    pressed. When you''re done adding and removing items, you simply thaw the table,

    resulting in a optimal-size calculation. (Be careful though; a frozen table can

    end up with many hash collisions if you add large quantities of data. This should
    be

    fine as long as thaw before you do any lookups.) The functions are in Figure 2-32.


    ```

    #include <glib.h>

    void g_hash_table_freeze(GHashTable* hash_table);

    void g_hash_table_thaw(GHashTable* hash_table);

    ```


