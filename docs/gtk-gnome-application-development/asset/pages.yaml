    # Header File


    gtk/gtkwindow.h


    # Description


    GtkWindow represents a toplevel dialog or application window. As the primary toplevel
    widget in GTK+, it has many special responsibilities; for example, it maintains
    the current keyboard focus and determines its size allocation (rather than receiving
    one from a parent window).


    Gnome applications typically use GnomeApp for main applications, to take advantage
    of its added features; for dialogs, you should use GnomeDialog with Gnome and
    GtkDialog with GTK+. Of course there are several specialized dialog subclasses
    available as well. If appropriate to your application, GtkWindow can also be used
    directly.


    A danger worthy of note: GtkWindow is automatically destroyed if it receives a
    "delete-event" signal. To prevent this, you must install the last signal handler
    to run, and your signal'
