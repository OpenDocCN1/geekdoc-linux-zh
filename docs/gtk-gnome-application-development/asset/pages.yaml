  md: "# Chapter 11. Writing a GtkWidget\n\n* GtkEv always wants to be the same fixed\
    \ size.\n/\n\n```\nrequisition->width = 450;\nrequisition->height = 300;\n\n```\n\
    \nGTK+ takes care of storing a widget's last size request in widget->requisition.\n\
    If GtkEv was a real-life widget rather than an illustrative example, it would\
    \ be unnecessary to implement a size method. The default GtkWidget method simply\
    \ returns the current value of widget->requisition, so GtkEv could initialize\
    \ widget->requisition in gtk_ev_init() and use the default.\n\nAlternatively,\
    \ the size method could be implemented more elaborately; GtkEv could attempt to\
    \ predict the maximum width of the text to be displayed, for example.\nOnce a\
    \ widget's parent container decides how much space is actually available, the\
    \ widget receives a size allocation. The size allocation method should do the\
    \ following:\n\n+   * Assign the new allocation to widget->allocation; this does\
    \ not happen automatically, as it does for widget->requisition.\n* Divide the\
    \ allocation among any child widgets.\n* Resize any GdkWindow, if the widget is\
    \ realized.\n* Perform any widget-specific tasks; for example, GtkEv updates the\
    \ GdkRect representing its internal layout.\n\nHere is GtkEv size allocation method;\
