    screen. The "background" displayed by your X server is the root window; the root
    window has no parent. Application windows are typically re-children of the root
    window to hold the window''s titlebar and decorations, and place the application
    inside window. Managers have total control over windows—they can represent them,
    repaint them and Application windows can in turn subwindows, which are controlled
    by the application. Note that GTK+ uses the GTK library, rather than using GTDI;
    in particular, an X window is a wrapper called GdkWindow. Don''t confuse GdkWindow
    and GtkWindow.


    An window, or GdkWindow, gives the X server the structure of the graphics being
    displayed and importantly, this helps reduce traffic. The X server knows how to
    show windows on the screen; move them (keeping children in position relative to
    their parents); capture such movements on a per-window basis); and so on. A GdkWindow
    is the fundamental unit for drawing graphics—you can''t draw to the "screen" as
    a whole, you must draw on a GdkWindow.


    GTK widgets have a corresponding GdkWindow. There are exceptions, such as GtkLabel;
    these are non-window widgets, and relatively lightweight. Widgets with no GdkWindow
    drawn in their parent''s GdkWindow, such as operating systems, require a GdkWindow;
    thus they are impossible on non-window widgets.


    Widgets pass through a number of states to realize their GdkWindow:


    +   A widget is realized if its corresponding GdkWindow has been created. Widgets
    are realized via gtk_widget_realize(), and unrealized via gtk_widget_unrealize().
    Since an X window must have a parent, if a widget is realized its parent must
    also be.


    +   A widget is mapped if gtk_widget_show() has been called on its GdkWindow.
    This means the server has asked to display the window on the screen; otherwise
    the GdkWindow must exist, implying that the widget is realized.


    +   A widget is visible if its gtk_widget_show() has been called on its widget.
    A widget can be rendered invisible by calling gtk_widget_hide(1); this will either
    cancel the pending mapping or unmap the GdkWindow. Since top-level windows have
    no parent, they are mapped as soon as they are shown.


    In user code, you only need to call gtk_widget_show(); this implies realizing
    and mapping the window as soon as its parent is realized and mapped. It''s important
    to understand that gtk_widget_show() has no immediate effect, it merely schedules
    the widget to show. You don''t have to worry about showing widgets in any particular
    order; it also means that you can immediately access the GdkWindow of a widget.
