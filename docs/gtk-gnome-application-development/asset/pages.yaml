  md: "# Discovering the Available Object Arguments\n\nYou can easily find out at\
    \ runtime what arguments a given GtkObject understands, using the gtk_object_query_args().\
    \ Here is a nifty piece of code which prints out the arguments for the entire\
    \ class hierarchy of a given GtkObject:\n\n```\nvoid\nprint_arguments(Gtkobject*\
    \ object)\n{\n    GtkType type;\n\n    type = GTK_OBJECT_TYPE(object);\n\n   \
    \ do {\n        Gtkarg* args;\n        guint32* flags;\n        guint n_args;\n\
    \n        args = gtk_object_query_args(type,\n                               \
    \     &flags,\n                                    &n_args);\n\n        printf(\"\
    Displaying arguments for object type '%s\\n\",\n               gtk_type_name(type));\n\
    \n        i = 0;\n        while (i < n_args) {\n            printf(\"- Argument\
    \ %u is called '%s' and has type '%s\\n\",\n                   i,\n          \
    \         args[i].name,\n                   gtk_type_name(args[i].type));\n  \
    \          ++i;\n        }\n\n        free(args);\n        free(flags);\n    }\
    \ while (type != GTK_TYPE_INVALID);\n```\n\nNotice that a type's parent type can\
    \ be obtained using the gtk_type_parent() function, and you can extract the GtkType\
    \ tag from a GtkObject using the GTK_OBJECT_TYPE() macro. GTK_OBJECT_TYPE() is\
    \ defined as follows:\n\n```\n#define GTK_OBJECT_TYPE(obj) ((GTK_OBJECT(obj))->class->type)\n\
    ```\n\nAn object's type is stored in its class structure, and a pointer to an\
    \ object's class structure is stored in each instance of the object. (The class\
    \ structure pointer is klass rather than class to avoid confusing C++ compilers.)\n\
    \nFigure 9-3 summarizes the functions for reading, writing, and querying arguments."
