    # Why are signals specified as strings rather than integers or some sort of macro?


    Strings are nicer. They are easier to type and less headache for GtkObject authors
    to maintain. They don’t clutter the C namespace. Typing a string incorrectly will
    trigger a runtime error since macros don’t improve error checking. Finally, strings
    are internally converted to a numeric ID there is no loss in efficiency.


    Consider the maintenance headache of using enumerations instead: both values and
    their names would have to be unique across GTK+, Gnome, and third-party extensions.
    A nightmare.


    # Why is GTK+ written in C?


    First and foremost: asking this question in any public forum is strongly discouraged.
    Don’t do it. Check the archives for several extended off-topic feasts if you’re
    interested.


    Here are some reasons:


    +   * The original authors wanted to write it in C, and now many C-only applications
    are based on it. The current authors enjoy C.

    * GTK+ handles types and objects much more flexibly than C++; it is runtime-oriented,
    like Java or Objective C than C++. This system is convenient for GUI builders.

    * C is the lingua franca of UNIX; most people know how to code in it. There are
    also nice tools for languages like Java and Objective C. is more portable than
    C++, ANSI C is not widely implemented, so only an ill-defined subset of C++ can
    actually be used.

    * When GTK+ development first started, there was no free, working C++ compiler.
    Again: do not ask this question on any mailing lists, because people will not
    be amused.


