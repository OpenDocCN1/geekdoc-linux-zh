    # GnomeMDI


    # Library


    Gnome


    # Header File


    libgnomeui/gnome-mdi.h


    # Description


    GnomeMDI keeps track of multiple documents. Users can configure the documents
    are arranged in the application; they might be placed in a GtkNotebook in the
    same GtkWindow, or each document might have its own GtkWindow. Also, users can
    drag the notebook pages out of the GtkWindow, and they will be reparented into
