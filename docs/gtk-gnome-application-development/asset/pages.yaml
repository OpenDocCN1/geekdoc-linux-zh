    # Drawables and Pixmaps


    A pixmap is an off-screen buffer you can draw graphics into. After drawing into
    a pixmap, you can draw it to a window, causing it to appear on the screen (when
    the window is visible). You can also draw into a window directly, of course. Using
    a pixmap as a buffer allows you to rapidly update the screen without repeating
    a series of drawing operations. Pixmaps are also used to store image data loaded
    from disk, such as icons and images. You can then copy the pixmap to a window.
    In GDK, the type is GdkPixmap. A pixmap with a single bit representing each pixel
    is a bitmap; GDK type is GdkBitmap. "Bitmap" is not a separate type; it is simply
    a pixmap with a depth of 1. Like windows, pixmaps are server-side.


    In X terminology, a drawable is anything you can draw graphics on. G GDK has a
    corresponding type, called GdkDrawable. Drawables include windows, pixmaps, and
    bitmaps. Here is how the types are defined in GDK:


