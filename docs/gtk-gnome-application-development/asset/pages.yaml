  md: 'An accessor function is provided to access the root canvas group, shown in
    Figure 12-1.


    ```

    #include <libgnomeui/gnome-canvas.h>

    GnomeCanvasGroup* gnome_canvas_root (GnomeCanvas* canvas);

    ```


    **Figure 12-1. Root Group Accessor**


    Items must be part of a group; there is no such thing as an "orphan" item. When
    you create an item, you must specify its canvas group. It is also possible to
    reparent items after creation. However, items are permanently bound to the GnomeCanvas
    they were created on; it is not permitted to reparent an item to a different canvas.


    # # Coordinates


    Many of the features of the canvas are implemented via translations between different
    coordinate systems. Items can be moved, rotated, or scaled via affine transformations,
    described in more detail below (Short version: affine transformation is a way
    to convert from one coordinate system to another). Here are the important coordinate
    systems which come up when using the canvas and writing custom canvas items:


    +   - World coordinates are an absolute coordinate system; i.e., the world coordinate
    refers to the same place on the canvas in all cases. World coordinates are conceptually
    infinite and are represented by a double. World coordinates are real, topllevel,
    untreated, canonical coordinate system. Consistent with the Windows system and
    GDK, Y coordinates increase as you move downward, so lower Y are toward the top
    of the canvas.


    +   - Item coordinates are created by a particular item. Item coordinates exist
    because each canvas has an affine transformation associated with children. In
    case GnomeCanvasGroup, this transformation is applied to the group. To convert
    from world coordinates to item coordinates for particular item, you apply the
    transform for each canvas group in the item''s ancestry, starting with the root
    canvas group; then you apply the item''s own. (Don''t worry, Gnome comes with
    a function to do this for you.) Like world coordinates, item coordinates are conceptually
    infinite.


    +   - Canvas coordinates are pixel coordinates. While item and world coordinates
    are floating-point numbers, canvas coordinates are integers. To use the canvas,
    you must specify a "scroll region", which is the rectangle in world space you
    want to see. Canvas pixel coordinates also take into account a scaling factor
    representing the number of pixels per world unit. To convert from world coordinates
    to canvas coordinates, multiply and then round to an integer. (0,0) in canvas
    coordinates will be the top left corner of the scroll region.


    +   - Buffer coordinates are canvas coordinates modified by some offset. Item
    implementations use these during rendering. The item implementation passes the
    buffer (which is a GdkDrawable or an RGB buffer, depending on the canvas mode).
    The canvas tells the item implementation region of the screen'
