  md: "# Chapter 9. The GTK+ Object and Type System\n\n```\ntypedef void (*GtkSignal_NONE_NONE)\
    \ (GtkObject* object,\ngpointer user_data);\nvoid\ngtk_marshal_NONE_NONE (GtkObject\
    \ * object,\nGtkSignalFunc func,\ngpointer func_data,\nGtkArg * args);\n```\n\n\
    ```\n{\n  GtkSignal_NONE_NONE rfunc;\n  rfunc = (GtkSignal_NONE_NONE) func;\n\
    \  (*rfunc)(object,\n    func_data);\n}\n```\n\nAs you can see, the NONE_NONE\
    \ refers to the fact that the expected callback returns no value and has no \"\
    special\" arguments. GTK+ automatically passes the object emitting signal and\
    \ a user_data field to all callbacks; special arguments are inserted in these\
    \ two. Since there are no signal-specific arguments in this case, the array of\
    \ GtkArg is ignored.\n\nThe naming convention for marshallers places a double\
    \ underscore before the return value and the special arguments, if any. Here's\
    \ a more complex example:\n\n```\ntypedef void (*GtkSignal_INT_POINTER) (GtkObject\
    \ * object,\ngpointer user_data);\n```\n\n```\nvoid\ngtk_marshal_INT_POINTER (GtkObject\
    \ * object,\nGtkSignalFunc func,\ngpointer func_data,\nGtkArg * args);\n```\n\n\
    ```\n{\n  GtkSignal_INT_POINTER rfunc;\n  gint *return_val;\n  return_val = GTK_RETLOC_INT\
    \ (args[1]);\n  rfunc = (GtkSignal_INT_POINTER) func;\n  *return_val = (*rfunc)(object,\n\
    \    Gtk_VALUE_POINTER (args[0]),\n    func_data);\n}\n```\n\nThe last element\
    \ of the array of GtkArg is a space for the return value; if there is no return\
    \ value, this element will have type GTK_TYPE_NONE and can be ignored. GTK+ provides\
    \ macros as GTK_RETLOC_INT() to extract a \"return value\" from GtkArg. Similar\
