    # Other Features


    There simply isn''t space to cover all of glib''s features in this book. It''s
    worth look-

    ing at glib when you find yourself thinking,"There really should be a function

    that..."glib.h and the glib documentation on http://www.gtk.org / or are excellent

    resources.


    Here''s a brief list of features not already mentioned:


    +   * FLOAT_MAX, etc. equivalents for numeric types.

    * Byte-order conversions.

    * g_memmove() is more portable than them memmove().

    * G_DIR_SEPARATOR handles Windows/UNIX differences.

    * G_VA_COPY copies a list in a portable way.

    * Numerous macros to permit the use of compiler extensions (especially gcc ext-

    s) in a portable way.

    * Portable g_htonl() and other host-to-network conversions.

    * A GCache generic cache facility.


