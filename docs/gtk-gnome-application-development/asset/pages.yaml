  md: "# Chapter 12. GnomeCanvas\n\nConceptually, (A,B), the affine defines a relationship\
    \ between points on a plane. For any point (A,B), the affine defines a single\
    \ corresponding transformed point; the mapping is one-to-one, so given the transformed\
    \ point you can determine the original point.\n\nAffines have interesting properties\
    \ that can be used in computer graphics. Most importantly, they can be composed,\
    \ concatenated, or multiplied (the three terms are synonymous). You can compose\
    \ any number of affines to create a single affine; applying the single affine\
    \ has the same effect as applying each of the original affines in order. Note\
    \ that the order of composition is important! Unlike multiplication, affine composition\
    \ is not commutative (which is a reason to use the term \"multiply\" in this context).\n\
    \nlibart_gl1 defines a module for affine manipulation. It represents as an affine\
    \ of six doubles. Its affine functions are shown in Figure 12-3.\n\n```\n#include\
    \ <libart_gl1/art_affine>\nvoid art_affine_point(ArtPoint* dst, const ArtPoint*\
    \ src, const double affine[6]);\nvoid art_affine_invert(double dst_affine[6],\
    \ const double src_affine[6]);\nvoid art_affine_multiply(double dst_affine[6],\
    \ const double src_affine[6], const double src2[6]);\nvoid art_affine_identity(double\
    \ dst[6]);\nvoid art_affine_scale(double dst[6], double sx, double sy);\nvoid\
    \ art_affine_rotate(double dst[6], double theta);\nvoid art_affine_translate(double\
    \ dst[6], double tx, double ty);\nint art_affine_rectilinear(const double src[6]);\n\
    ```\n\n# Figure 12-3. Affine Manipulation\n\nart_affine_point() applies an affine\
    \ to a point. The affine is applied to the second argument (src) and the result\
    \ is copied into the first argument (dst). An ArtPoint is simply.\n\n```\ntypedef\
    \ struct _ArtPoint ArtPoint;\n\nstruct _ArtPoint {\n    double x, y;\n};\n```\n\
    \nAffines can be inverted. If an affine converts points in coordinate system A\
    \ into points in coordinate system B, its inverse converts in coordinate system\
    \ B into points in coordinate system A. art_affine_invert() fills its first argument\
    \ with the inverse of itself.\n\nart_affine_multiply() composes two affines as\
    \ described earlier in this section, placing the first in its first argument.\n\
    \nFour functions are provided to create affines with particular properties.\n\n\
    +   - art_affine_identity() creates the identity affine. Applying the identity\
    \ affine to a point has no effect.\n- art_affine_rotate() gives an affine that\
    \ rotates points by theta degrees.\n- art_affine_translate() gives an affine that\
    \ translates points in the X dimension and y in the dimension.\n\n257"
