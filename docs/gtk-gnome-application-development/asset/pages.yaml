    \ send_event;\n};\n\n```\n\n# # Window Change Events\n\nAs a GdkWindow is shown,\
    \ hidden, resized or destroyed, events are emitted.\nConfigure events indicate\
    \ that the size or position of the event window has changed.\nThey include the\
    \ new size and position of the window:\n\n```\ntypedef struct _GdkEventConfigure\
    \ GdkEventConfigure\nstruct _GdkEventConfigure {\n  GdkEventType type;\n  GdkWindow\
    \ *window;\n  gint send_event;\n  gint6 width;\n  gint6 height;\n};\n\n```\n\n\
    All widgets receive this event (since GTK_STRUCTURE_MASK is automatically in the\
    \ event mask), but most widgets resize their GdkWindow themselves in response\
    \ to a size allocation. Configure events just report that the resize-not very\
    \ useful. There are two notable exceptions. First, theoplevel GtkWindow widget\
    \ is in charge of initiating the size allocation process, and not to get an allocation\
    \ from others. It monitors configure events to determine its size allocation.\
    \ When you resize a GtkWindow using its window managers, it will receive configure\
    \ events and act accordingly. The second exception is Gtkdrawingarea. Gtkdrawingarea\
    \ sends a configure event when its size allocation changes. This is why you will\
    \ usually want to repaint the contents of the drawing if it is resized. If all\
    \ \"fake\" events GTK+ creates, the size will be TRUE for this configure event.\n\
    Other changes in a GdkWindow are signalled by GdkEventAny; these events contain\
    \ no special information, they just tell you that something has occurred. They\
    \ are distinguished by their type field:\n\n+   * GTK_DELETE means that the window\
    \ manager has asked the application to destroy this window. If a widget receives\
    \ the signal corresponding to this event, the signal emission is automatically\
    \ destroyed by the GTK+ main loop. Because FALSE is the default return value,\
    \ you must connect a signal handler which returns TRUE to prevent users from destroying\
    \ GdkWindow widgets.\n\n188"
