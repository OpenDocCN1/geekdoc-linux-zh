  md: "# Chapter 10. GDK Basics\n\n```\nelse if (gdk_keyval_is_upper(event->keyval))\
    \ {\n    printf(\"*An uppercase letter was pressed.\\n\");\n}\n```\n\ngdk_keyval_name()\
    \ is useful for debugging; it returns the name of the keysym without-the GDK_prefix.\
    \ For example, it returns \"Home\" if it passed the value GDK_Home. The string\
    \ is strictly allocated. gdk_keyval_is_lower() returns FALSE if the keysym has\
    \ an uppercase equivalent. It returns TRUE for lowercase letters, and all non-alphanumeric\
    \ characters. It returns FALSE for uppercase letters.\ngdk_keyval_is_upper() returns\
    \ the opposite value.\n\n# Movement Events\n\nEvents are emitted to track the\
    \ mouse as it moves around the screen. Motion events are emitted when the pointer\
    \ enters or leaves a window, crossing events are emitted when the pointer enters\
    \ leaves a GdkWindow. The type field for motion events is GDK_MOTION_NOTIFY. There\
    \ are two kinds of crossing events: GDK_ENTER_NOTIFY and GDK_LEAVE_NOTIFY.\n\n\
    There are two ways to track motion events. If you specify GDK_POINTER_MOTION_MASK\
    \ in the mask for a window, you will receive as many events as the X server can\
    \ generate. If the user moves the pointer rapidly, you will be buried by events\
    \ and your application may become unresponsive while it processes the backlog.\
    \ If you specify GDK_POINTER_MOTION_HINT, motion events are one at a time. At\
    \ least one event will be sent until you call gdk_window_get_pointer(), the pointer\
    \ enters and leaves the window, or a button or key occurs. Each time you receive\
    \ a motion event, you must call gdk_window_get_pointer() to get the current pointer\
    \ position and signal that you are ready for more events. See the section Mouse\
    \ Pointer for details on gdk_window_get_pointer().\n\nWhich you choose depends\
    \ on the application. If you need to extract the trajectory of the most recent\
    \ pointer, you will want to get all events. If you want to minimize track traffic,\
    \ maximize responsiveness, you must use GDK_POINTER_MOTION_HINT. However, gdk_window_get_pointer()\
    \ requires you to place some limit on your application responsiveness. If you\
    \ can handle motion events quickly enough to keep them from blocking, your application\
    \ will likely be fine. GDK_POINTER_MOTION_HINT events are unlikely to come more\
    \ than a hundred per second—if you can handle them in length, you should use GDK.\n\
    \nYou can receive motion events while one or more buttons are held down. To receive\
    \ motion events while a button is down, use GDK_BUTTON_MASK in place of GDK_POINTER_MOTION_MASK.\
    \ You can use GDK_POINTER_MOTION_HINT_MASK with GDK_BUTTON_MASK to limit the number\
    \ of events received, unless you are only interested in motion events while a\
    \ certain button is pressed, then you can use the specific GDK_BUTTON1_MASK, GDK_BUTTON2_MASK,\
    \ GDK_BUTTON3_MASK, and GDK_BUTTON_MOTION. Any combination of these is allowed.\
    \ They can also be combined with GDK_POINTER_MOTION_HINT to limit the number of\
    \ events.\n\nIn sum, you can select which motion events to receive along the \"\
    button state\" of motion using these flags:\n\n183"
