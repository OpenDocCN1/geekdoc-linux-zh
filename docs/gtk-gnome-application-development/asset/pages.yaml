  md: '# # Chapter 17. Online Resources


    This chapter documents some useful online resources for Gnome programmers.


    # ## Obtaining and Compiling the Libraries


    Because the exact compilation instructions can change between releases, this book
    won''t attempt to document them precisely. You should obtain the latest stable
    release of both GTK+ and Gnome from http://www.gtk.org/ and http://www.gnome.org,
    respectively, and follow the instructions that come with the distribution.


    It''s a very good idea to compile the GTK+ and Gnome libraries yourself, for several
    reasons:


    +   - You should have the source code around, to learn from and refer to when
    documentation is lacking.

    - You should compile with debugging switched on, so preconditions and assertions
    will be triggered if you try to use the library incorrectly. Most prebuilt binaries
    will turn these off for efficiency.

    - You will probably have unwrapped libraries, so you can see function names and
    so on in your debugger.


    # ## Web sites


    GTK+ and Gnome each have home pages, http://www.gtk.org/ and http://www.gnome.org,
    respectively.

    On the GTK site, take special note of these pages:


    +   - http://www.gtk.org/rdp/ is the GTK+ Reference Documentation Project; look
    here for reference materials on the GTK+ API.

    - http://www.gtk.org/faq/ has the GTK FAQ; asking these questions on the mailing
    is discarded. Appendix C of this book contains the official GTK+ FAQ with more
    questions; check it out as well.

    On the Gnome site, have a look at these:


    +   - http://www.gnome.org/kr/ contains browse, searchable, hypertext copies of
    all the code on the GTK+/Gnome CVS server. This includes GTK+ and Gnome, as well
    as many applications.

    - http://bugs.gnome.org/ allows you to browse GTK+ and Gnome bug reports, and
    submit new ones. If you find a bug, please submit it so the maintainers can keep
    track of it.

    - http://developer.gnome.org was not yet at press time, but will be available
    soon. It will contain comprehensive resources for Gnome developers.'
