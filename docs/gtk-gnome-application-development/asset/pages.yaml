    # ### Figure 3-4. Packing GtkBox


    A box contains two sets of widgets. The first set is packed at the "start" (top
    or left) of the box, the second at the "end" (bottom or right). If you pack three
    widgets into a somewhat complicated, end at the start of a box, the first widget
    appears topmost or leftmost; the second follows this; and the third appears closest
    to the center of the box. If you pack three widgets into the end of the same box,
    the first appears bottommost or the second follows it; and the third appears closest
    to the center. With six widgets, the order from top/left to bottom/right is: 1,
    2, 3, 2, 1. Figure 3-5 shows this for GtkBox. Order of packing is only important
    within each end of the box i.e., we could have alternated packing start and packing
    end, with the same results.


    ![](img/f08b98c3d9ba764fd120a058661d79d5_57_0.png)


    **Figure 3-5. Buttons packed into a GtkBox***


    # GtkBox Layout Details


    Packing is affected by three parameters, which are the same for both start and
    end packing; the meaning of these parameters is somewhat complicated, because
    they interact with the homogeneous setting of the box and with each other.


    Here''s how GtkBox computes its size request for the "nesting" direction (width
    for GtkBox, height for GtkBox):


    +   1. The requested size of each child is considered to be the child''s size,
    plus twice the padding value used to pack the child. A child''s padding is the
    amount of blank space on either side of it. In short, Child Size = (Child Widget''s
    Size Request) + 2*(Child Padding).

    2. If the box is homogeneous, the base size request for the entire box is equal
    to the size (request + padding) of the largest child, times the number of children.
    In a homogeneous box, all children are as large as the largest child.

    3. If the box is not homogeneous, the base size request for the entire box is
    the sum of the size (request + padding) of each child.


