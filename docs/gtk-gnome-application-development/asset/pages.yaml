  md: '# Mailing Lists


    Here are some of the mailing lists that cover GTK+ and Gnome development topics:


    +   - gtk-list@redhat.com is appropriate for questions about using GTK+, reading
    the GTK+ source code, discussion of GTK bugs, and so on.

    - gnome-list@gnome.org is very high traffic; it is the general Gnome mailing list,
    for discussion of all things Gnome-related.

    - gnome-devel-list@gnome.org is the right list for questions about the Gnome libraries
    and how to write programs with them. It''s also appropriate for discussing the
    development of the libraries, or submitting patches which might modify the libraries.

    - gtk-app-devel-list@redhat.com is an alternative to gtk-list more focused on
    application development. Most things appropriate for this list are also appropriate
    for gtk-list, but gtk-app-devel-list has you concerned about that.

    - gtk-devel-list@redhat.com is for discussion of developing the lib, GLK, and
    GTK+ libraries. It is not for discussion of using the libraries to develop applications.

    - gnome-announce-list@gnome.org carries announcements related to Gnome and Gnome
    applications. It is relatively low-traffic.


    To subscribe to any of these mailing lists, --request to the list name and send
    a message with subscribe my-address@wherever.net in the subject. For example,
    I subscribe to gtk-list@redhat.com by sending a message to gtk-list-request@redhat.com
    with subscribe helpbox in the subject line.


    Please, ask any and all questions about GTK+ and Gnome development on one of the
    mailing lists or on IRC. It is inappropriate to mail developers privately, unless
    you have reason to believe they have special knowledge of some particular section
    of code. You''ll certainly get a faster and better response from the list anyway.


    # Internet Relay Chat


    The two main IRC channels related to GTK+ and Gnome development are both on irc.gimp.org;
    join #gimp #gnome to ask questions. You can also meet the library developers and
    other participants in the GTK+/Gnome community.


    # This Book


    This book is available online at http://developer.gnome.org/doc/GGAD'
