  md: "# # Chapter 9. The GTK+ Object and Type System\n\nPeople often ask why GTK+\
    \ was written in C rather than an object-oriented language. The answer is that\
    \ C is more portable and readily available than any other language. However, C\
    \ lacks syntactic sugar for object-oriented programming, and it in no way provides\
    \ an object-oriented approach.\n\nGTK+ implements its own custom object system,\
    \ which offers standard object-oriented features such as inheritance and virtual\
    \ functions. In the context of languages such as Lisp, Motif, and Java, the GTK+\
    \ object system is runtime-centric instead of C++, allowing interpreted language\
    \ bindings and GUI builders to interact with its powerful functions.\n\nYou may\
    \ recall from Chapter 3 that widgets are a special type of GObject; any object\
    \ with GtkWidget is a widget. Widgets represent a region on the screen—most of\
    \ them are interface elements, such as buttons or menus. There is no GUI-specific\
    \ object about GObject; the object system can be used in non-graphical environments.\n\
    \nThis chapter dives into the details of GTK+'s object system, giving you an idea\
    \ what's happening \"behind the scenes\" in any GTK+ program. Sooner later you\
    \ will need this information: to write your own objects, debug existing objects,\
    \ or just understand GTK+ code on a conceptual level.\n\n# ## Object and Class\
    \ Structures\n\nEach GtkObject has two essential components: a struct representing\
    \ the object, and a struct representing the class. In general, the instance contains\
    \ the data members for each instance, and the class struct contains class function\
    \ pointers (which can be overridden by subclasses). The class struct can also\
    \ contain class data members—it's more practical to use static variables in the\
    \ .c file implementing the object. If you're familiar with C++, the class struct\
    \ is equivalent to a virtual, only the class struct is used by hand. Here are\
    \ the structs used in GtkButton:\n\n```\ntypedef struct _GtkButton GtkButton;\n\
    typed struct _GtkButtonClass GtkButtonClass;\n\nstruct _GtkButton {\n  GtkBin\
    \ bin;\n\n  GtkWidget *child;\n\n  guint in_button : 1;\n  guint button_down :\
    \ 1;\n  guint relief : 2;\n};\n\nstruct _GtkButtonClass {\n  GtkBin parent_class;\n\
    \n  void (* pressed) (GtkButton *button);\n  void (* released) (GtkButton *button);\n\
    };\n```"
