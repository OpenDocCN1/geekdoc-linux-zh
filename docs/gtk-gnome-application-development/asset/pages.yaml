  md: '# Chapter 6. The Main Window: GnomeApp


    GnomeApp has the usual constructor function, shown in Figure 6-2. The first argument
    app_id, is an internal name Gnome can work with this application. If it should
    be the same as the app_id passed to gnome_init(); the name of the executable is
    a good choice. The second argument is simply a title for the application; if you
