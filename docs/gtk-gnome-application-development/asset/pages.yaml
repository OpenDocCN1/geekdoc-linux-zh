  md: 'may be a better choice for storing some kinds of configuration information;
    the primary advantage of the libgnome configuration library is its simplicity.

    gnome-config has a long history; it was first written for the WINE Windows emulator
    project, then used in the GNU Midnight Commander file manager, and finally migrated
    into the GNOME libraries. The plan is to replace gnome-config with something more
    powerful in the next version of Gnome: we want to support per-host configuration,
    backends such as LDAP, and other features. However, the gnome-config API will
    almost certainly be supported even if the underlying engine changes dramatically.


    # Reading Stored Config Data


    Retrieving data from files is simple. you can simply call to retrieve the value
    for a given key. The value-retrieving functions (shown in Figure 5-4) can accept
    a path as their argument. For example, you might ask whether the user wants to
    see a dialog box:


    ```

    gbolean show_dialog;

    show_dialog =

    gnome_config_get_bool("*/myapp/General/dialog");

    ```


    If the config file does not exist, or there is no key matching the path you provide,
    these functions return 0, FALSE, or NULL. The functions that return a string allocated
    memory; you should call g_free(); the returned string. The string value functions
    return an allocated vector of allocated strings (g_strfree()) is the easiest way
    to free this memory.


    You can specify a default value to be returned if the key does not exist; to do
    so, append an =value to the path. For example:


    ```

    gbolean show_dialog;

    show_dialog =

    gnome_config_get_bool("*/myapp/General/dialog=true");

    ```


    Each function has a _default variant; these tell you whether the return value
    was taken from a config file or from the default you specified. For example:


    ```

    gbolean show_dialog;

    golean used_default;


    show_dialog =

    gnome_config_get_bool_with_default("*/myapp/General/dialog=true",

    &used_default);

    ```


    ```

    if (used_default)

    printf("Default value used for show_dialog\n");

    ```


