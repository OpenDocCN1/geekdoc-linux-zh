    AC_INIT(src/hello.c)


    AM_CONFIG_HEADER(config.h)


    AM_INIT_AUTOMOMAKE(GnomeHello, 0.1)


    AM_MAINTAINER_MODE


    AM_ACLOCAL_INCLUDE(macros)


    GNOME_INIT


