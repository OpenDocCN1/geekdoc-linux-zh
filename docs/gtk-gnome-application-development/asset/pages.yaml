  md: '# Chapter 2. glib: Portability and Utility


    glib is a C portability and utility library for UNIX-like systems and Windows.
    This chapter covers some of the most commonly-used library features in GTK+ and
    Gnome applications. glib is simple, and the concepts are familiar; so we''ll move
    quickly. For more complete coverage of glib, see glib or the free reference manual
    that comes with the library. (By using the glK+, Gnome headers; they are very
    clean and easy to read, and are handy as a quick reference. For that matter, don''t
    be afraid to look at the source code, and if you have specific questions about
    the implementation.)


    glib''s various facilities are intended to have a consistent interface; the coding
    style is semi-object-oriented, and identifiers are prefixed with ''g'' to create
    a kind of namespace.


    glib has a single header file, glib.h.


    # Basics


    glib provides substitutes for many standard and commonly-used C language constructs.
    This section describes glib''s fundamental type definitions, macros, memory allocation
    routines, and string utility functions.


    # Type Definitions


    Rather than using C''s standard types (int, long, etc.) glib defines its own.
    These serve a variety of purposes. For example, gu32 is guaranteed to be 32 bits
    wide, something no standard C can ensure. It is simply easier to type unsigned.
    A few of typedefs exist only for consistency; for example, gchar is equivalent
    to the standard char.


    The following primitives are defined by glib:


    +   - guint8, guint16, guint16, guint32, guint64,uint64—these give you integers
    of a guaranteed size. Not all platforms provide 64-bit integers; if a platform
    has them, glib will define G_HAVE_GUINT_64. (if it isn''t obvious, the given types
    are unsigned, the given types are signed).

    - gboolean is useful to make your code more readable, since C has no boolean type.

    - gchar, ghort, glong, gfloat, gdouble are purely cosmic.

    - gpointer may be convenient to type as void *, gpointer is const void *. (const
    gpointer will not do what you intend to mean it; spend time with a good book on
    C if you don''t see why.)


    # Frequently Used Macros


    glib defines a number of familiar macros used in many C programs, shown in Figure
    2-1. All of them are self-explanatory. MIN (i)/(j) returns the smaller or larger
    of their arguments. ABS (x) returns the absolute value of its argument. CLAMP
    (x, low, high) means x if x is outside the range [low, high]; if x is above the
    range, high is returned; In addition to the macros shown in Figure 2-1, TRUE/FALSE/NULL
    are defined as the 1/0/((void*)).'
