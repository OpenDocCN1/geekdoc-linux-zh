    # Other Config File Operations


    Figure-5 lists some additional operations available for manipulating config files.
    gnome_config_sync() writes the configuration to disk, and gnome_config_push_prefix()
    allows you to shorten the path passed to the other gnome-config functions. There
    are also boolean tests to ask gnome-config whether a section exists.


    Two new operations are added: drop a section means to forget any information about
    it in memory including cached values loaded from the file and values not saved
    to the file with gnome_config_sync(). To clean a file, it means to unset its value(s),
    the section, or key will not exist once gnome_config_sync() is called.


    gnome_config_sync() automatically calls gnome_config_drop_all() to free all gnome-config
    resources, since the information is stored on disk.


    Functions are also provided to get the "real" (filesystem) path of a configuration
    file from a gnome-config path. These are unlikely to be used in application code.


