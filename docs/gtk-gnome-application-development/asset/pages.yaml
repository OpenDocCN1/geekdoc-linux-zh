  md: "# Chapter 10. GDK Basics\n\n+   * GDK_POINTER_MOTION_MASK: all motion events\
    \ regardless of button state.\n* GDK_BUTTON_MOTION_MASK: all motion events while\
    \ any button is held.\n* GDK_BUTTON1_MOTION_MASK: all motion events while button\
    \ 1 is held.\n* GDK_BUTTON2_MOTION_MASK: all motion events while button 2 is held.\n\
    * GDK_BUTTON3_MOTION_MASK: all motion events while button 3 is held.\n\nBy default,\
    \ you are deluge with events as quickly as the X server can generate them, adding\
    \ GDK_POINTER_MOTION_HINT_MASK to the event mask enables one-at-time behavior.\n\
    \nMotion events are represented by GdkEvent:\n\n```\nstruct _GdkEvent GdkEvent\
    \ {\n  GdkEventType type;\n  GdkWindow *window;\n  gint8 event;\n  guint32 time;\n\
    \  double x;\n  double y;\n  double pressure;\n  double tilt;\n  double ytilt;\n\
    \  gint state;\n  gint6 is_hint;\n  GdkSource source;\n  guint32 deviceid;\n \
    \ double x_root, y_root;\n};\n```\n\nMost of these fields should be similar to\
    \ yours from GdkEventButton, in fact, the is_hint flag. If this is TRUE, GDK_POINTER_MOTION_MASK\
    \ was selected. Use this flag if you are writing a widget for other people to\
    \ use, and you want them to choose how to receive motion events. In your event\
    \ handler, you could do this:\n\n```\nx, y;\nx = event->motion.x;\ny = event->motion.y;\n\
    ```\n\n```\nif (event->motion.is_hint)\ngdk_window_get_pointer(event->window,\
    \ &x, &y, NULL);\n```\n\nThat is, you call gdk_window_get_pointer() only if necessary.\
    \ If you are using GDK_POINTER_MOTION_HINT_MASK, you should prefer the results\
    \ from gdk_window_get_recent(). If you are receiving every event, it makes no\
    \ sense to call gdk_window_get_pointer() because it is relatively slow and will\
    \ worsen the backlog—you're getting every event anyway/.\n\nCrossing events occur\
    \ when the mouse pointer enters or leaves a window. If you move the mouse pointer\
    \ rapidly across your application, GDK generates these events for every window\
    \ you pass through. However, GTK+ will try to remove the events\n\n184"
