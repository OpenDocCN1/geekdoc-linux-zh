  md: '# Chapter 7. User Communication: Dialogs


    )

    gtk_widget_destroyed() is defined in gtk/gtkwidget.h, and simply assigns NULL
    to its second argument. The code resets the dialog variable each time the user
    closes the dialog, and raises/deifies the dialog if the user tries to open it
    while another one is active. Note that the window manager has some say on whether
    the raise/deify is successful, so it is not guaranteed to happen.


    # Modal Dialogs


    Sometimes you need to prevent interaction with the rest of your application while
    the user manipulates a dialog. Dialogs that freeze the rest of the application
    in this way are called modal dialogs.


    There is a lot of debate about when to use modal dialogs; some users hate them,
    but there are times when they are necessary. Unfortunately, it is a bit easier
    to write code using modal dialogs, because you can stop in the middle of a function,
    wait for a response, then continue. With nonmodal dialogs, you have to return
    to control to the main application, and arrange callbacks back to where you left
    off user finally finishes the dialog. With a complex sequence, the result is ugly
    to read. This tempt many programmers to use modal dialogs all the time, or at
    least a little too often. Avoid the temptation, and your users will thank you.


    Avoid modal dialogs if users might want to refer back to information in the main
    application as they use the dialog, or if they want to cut-and-paste between the
    application and the dialog. "Properties" dialogs should usually be modal; because
    users want to experiment with the effects of the changes they make, without having
    to close the dialog. And there is no reason to make trivial message boxes modal,
    since clicking on them has no effect on the rest of the application.


    Do not use a modal dialog if it makes sense, however. For example, I wrote a frontend
    for the Debian package manager, called gnome-apt. The main application allows
    the user to select and configure packages for installation and removal; then there
    are a series of dialogs which are configured and perform the requested changes.
    These dialogs are modal, because it would no sense to make a change in the middle
    of performing it. Changing the request-fulfillment process and asking for confirmation
    a second time. Another example "File Properties" dialog for the Gnome file manager
    is modal, otherwise the user could delete the file while its properties were being
    edited—a strange situation. There are no hard rules; you will have to use your
    judgment on a dialog-by-dialog basis.


    All that said, it is very easy to create a modal dialog. In GTK+, any window can
    be made modal with gtk_window_set_modal() (Figure 7-5).


    ```

    #include <gtk/gtkwindow.h>

    gtk_window_set_modal(GtkWindow* window, gboolean modality);

    ```


    Figure 7-5. Modal Windows'
