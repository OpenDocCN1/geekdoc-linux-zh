  md: '# Other Layout Widgets


    Boxes and tables are the most commonly-used-layout widgets by far. However, there
    are a few others for special situations.


    +   - GtkListBox is a special kind of box appropriate for the "action area" of
    a dialog.

    - GtkPacker provides Tk-style packing, if you''re familiar with Tk.

    - GtkLayout provides an infinite scrolling area. In general, scrolling areas in
    GTK+ are limited to just over 30,000 pixels, because that is the maximum size
    of an X window.

    - GtkFixed allows you to manually position widgets at fixed coordinates.


    # Manually Affecting Layout


    It''s possible to manually override GTK+''s geometry management. This is a bad
    idea 95% of the time, because GTK+''s geometry is essentially determined by the
    theme, and resizing toplevel windows. If you find yourself wanting to do things
    manually, it''s probably because you''re using the wrong layout container, or
    you really need a custom container.


    You can force a size or position on a widget with the functions shown in Figure
    3-19. However, it is rarely a good idea to use them. In particular, gtk_widget_set_size()
    should not be used to set a toplevel window''s default size. If you use size because
    you''ve saved the application''s state and you''re restoring it, or if you use
    gtk_widget_set_size() to set a window geometry on the command line. Unfortunately,
    you''ll be unable to shrink the window and you''ll get hate mail. Rather than
    forcing a size, if you want to set an initial size with gtk_window_set_size(),
    gtk_widget_set_use() shown in Figure 3-20, is almost never a good idea for non-toplevel
    widgets either; most of the time, you can get better results using the proper
    layout widget.


    gtk_window_set_position() is only useful for toplevel windows; it borders on nonsensical
    for other widgets, and will likely cause bad things to happen. It''s primarily
    used to honor a -geometry command line argument.


