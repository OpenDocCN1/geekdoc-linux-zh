  md: "You might be wondering why the menu items names contain an underscore. The\
    \ underscore is used to make the key shortcut for the menu item; translators can\
    \ move it around to make it intuitive in their language. Gnome will parse the\
    \ menu item name to the accelerator, then remove the underscore.\n\nTable 6-1\
    \ summarizes the possible values for the type field of a GnomeUIInfo struct. See\
    \ libgnomeui/gnome-app-helper.h for more details. There are actually a few more\
    \ possible values, but the others are used internally by the library. The values\
    \ in Table 6-1 should be sufficient for application code.\n\n# Table 6-1 GnomeUIInfoType\
    \ Values\n\n| GnomeUIInfoType | Description | moreinfo Field |\n| --- | --- |\
    \ --- |\n| GNOME_APP_UI_ENDOR | Terminates a table of GnomeUIInfo | None |\n|\
    \ GNOME_APP_UI_ITEM | Normal item (or radio item) | Callback function |\n| GNOME_APP_UI_TOGGLEITEM\
    \ | Toggle/check item | Callback function |\n| GNOME_APP_UI_RADIOITEMS | Radio\
    \ item group | Array of radio items in the group |\n| GNOME_APP_UI_SUBTREE | Submenu\
    \ | Array of GnomeUIInfo in the subtree |\n| GNOME_APP_UI_SEPARATOR | Separator\
    \ | None |\n| GNOME_APP_UI_HELP | Help item | Help node to load |\n\nTo create\
    \ an entree menu tree, you include pointers to previous menu tables using GNOMEUIINFO_SUBTREE(_)\
    \ macro.\n\n```\nstatic GnomeUIInfo main_menu[] = {\n    GNOMEUIINFO_SUBTREE(N(\"\
    File\"), file_menu),\n    GNOMEUIINFO_END\n}\n```\n\nIn this particular case,\
    \ there is a better macro to use, however:\n\n```\nstatic GnomeUIInfo main_menu[]\
    \ = {\n    GNOMEUIINFO_MENU_FILE_TREE(file_menu),\n    GNOMEUIINFO_END\n}\n```\n\
    \nThe main advantage of this macro is standardization; it ensures that all Gnome\
    \ menus use the same key shortcut and have the same name. There are quite a few\
    \ analogous macros; see libgnomeui/gnome-app-helper.h for the complete list."
