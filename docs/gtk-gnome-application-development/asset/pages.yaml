    # Affine Transformations


    An affine is a transformation matrix made up of six real numbers that can be applied
    to an ordered pair. Depending on the contents of the affine, the point it is applied
    to can be:


    +   * translated by an arbitrary distance in either dimension;

    * rotated some number of degrees;

    * scaled by some factor.


