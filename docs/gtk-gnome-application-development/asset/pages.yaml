  md: '# Chapter 11. Writing a GtkWidget


    This chapter describes how to write a new GtkWidget. A widget is a GtkObject that
    derives from GtkWidget; before reading this chapter, you should be familiar with
    Chapter 9. This chapter will discuss the details of GtkWidget, but will not re-explain
    GtkObject in general. You will also need to know something about GDK to write
    a widget so sure to skim Chapter 10 if you haven''t.


    Widgets are easy to create; if you want to cut-and-paste the usual Gtk boilerplate
    (instance and class initializers, a get_type() function, and so on), and then
    implement your widget''s functionality. Writing widgets is an important development
    technique.


    After a brief overview, this chapter jumps straight to the implementation of a
    simple widget Gtk. It then takes a step back, describing widget implementation
    more systematically. It ends with many examples, then pays to become familiar
    with the GTK source code: the easiest way to implement a widget is to subclass
    or slightly modify the most similar stock GTK widget.

    Of course, you must comply with the terms of Gtk''s license if you cut-and-paste
    code from the library.


    # Overview


    This section gives a brief overview, including the different kinds of widgets
    you might encounter, and the general functionality of GtkWidget is required to
    have.


    # Kinds of Widget


    The term ''widget'' is really very broad, since it encompasses any object that
    implements the GtkWidget interface. There are many ways to classify widgets:


    +   * Containers are widgets that store other widgets inside, such as the boxes
    and tables described in Chapter 3. As Chapter 3 discussed, containers can be subdivided
    into that allow a single child (GtkButton, GtkFrame, GtkEvent, etc.), and those
    manage layout for multiple children (GtkBox, GtkTable, etc.). Containers are harder
    to implement ''plain'' widgets because the GtkContainer interface must be implemented
    in addition to the GtkWidget interface.

    * Composite widgets are widgets that already contain a collection of widgets in
    a nice package; for example, the GtkListBox widget of GtkWindow already contains
    a list to show files, dial buttons, buttons, and so on. Widgets like these are
    also easy to create, and are a convenient way to create windows. You could write
    a "MainWindow" widget for your application window, and then create a new instance
    of the widget whenever the user opens a new document. GnomeApp and GDialog are
    important components in Gnome.

    * Non-container widgets are either actual controls (buttons, scrollbars, etc.),
    or decorative flourishes (GtkLabel, GtkSeparator). As Chapter 3 briefly mentioned,
    there are two major ways to implement widgets: most widgets (those that need to
    receive events or draw their own background) have an associated GtkWindow; "no
    window" widgets draw on their parent container. Widgets without windows are implemented
    slightly differently. All-'
