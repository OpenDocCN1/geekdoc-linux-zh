  md: "# Keyboard Focus\n\nThe field in GdkEventCrossing indicates whether the event\
    \ window or one of its ancestors has the keyboard input focus. Keyboard focus\
    \ is an X concept, used to determine which window should receive key events. The\
    \ window manager decides which toplevel window has the focus (usually the focused\
    \ window is highlighted and brought to top; most window managers let you choose\
    \ between 'focus mouse' and 'click to focus' modes). When an application has the\
    \ focus, it is free to move it around subwindows—perhaps text entry fields. However,\
    \ GTK+ does not use X focus for subwindows. Toplevel GtkWindow are the ones that\
    \ can receive focus. Thus, they receive events from X (by way of GTK). GTK+ implements\
    \ its own mechanism of widget focus, but in reality entirely distinct. When a\
    \ toplevel GtkWindow receives key events, it forwards them to the widget with\
    \ GTK+'s focus.\n\nIn short, this means the focus flag will be TRUE if the toplevel\
    \ GtkWindow containing the event window has the X focus. The focus flag is unrelated\
    \ to GTK+'s widget focus.\n\n# Focus Events\n\nThe previous section explained\
    \ the difference between GTK+'s concept of keyboard focus and the X/GDK concept.\
    \ This makes focus a bit confusing. There is only one type of focus event GDK_FOCUS_CHANGE,\
    \ which is received whenever a window gains or loses the keyboard focus. As we\
    \ said, only toplevel GtkWindow widgets gain or lose the focus from GDK's point\
    \ of view may not seem useful. However, each GtkWindow maintains a current 'widget\
    \ focus' and the focus widget changes. Thus, even though GDK-style focus events\
    \ are not used for the focus widget changes, widgets receive events in the same\
    \ way as if it were used. There are subtle differences; for example, widgets receive\
    \ focus events whether or not GdkWindow's event mask includes GDK_FOCUS_MASK.\
    \ Only toplevel widgets need to specify this mask.\n\nFocus events are very simple.\
    \ When a window gains the keyboard focus, it receives a focus event with its member\
    \ set to TRUE ('focus in') and when a window loses the focus it receives a focus\
    \ event with the member set to FALSE ('focus out'). Otherwise, focus events contain\
    \ only the three standard fields\n\n```\ntypedef struct _GdkEventFocus GdkEventFocus\
    \ {\n  GdkEventType type;\n  GdkWindow *window;\n  gint8 send_event;\n  gint16\
    \ in;\n}\n```"
  merge: -1
  pgno: 185
