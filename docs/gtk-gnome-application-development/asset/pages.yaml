    /* - Mode: indent-tabs-mode: nil; c-basic-offset: 8 c-style: *K&R* -\n/* - */\n\
    ```\n\nWhen preparing a package for any piece of free software, it polite the\
    \ style of the preceding code. It's customary to include a file called HACKING\
    \ in source code distributions addressing this and similar issues; read it if\
    \ it exists.\n\n# Is there a GUI builder for GTK+ and Gnome?\n\nA promising GUI\
    \ builder called Glade is being developed. Glade can generate source code in several\
    \ languages, or an XML description of the widgets. An module called libglade loads\
    \ these XMLs at runtime and creates the described widgets. The next release of\
    \ the Gnome libraries will very likely include or require libglade.\n\n# How do\
    \ GTK+ and Gnome support internationalization?\n\nGTK+ 1.2 supports many European\
    \ and Asian languages. PDK contains an API for loading fonts and rendering multibyte\
    \ strings, which this book does not cover. The stock GTK+ style handles that text\
    \ use this API and will deal with multibyte strings correctly; GTK+ also supports\
    \ inputs for Asian languages. GTK+ 1.2 does not support right-to-left scripts\
    \ that require complex layouts and unusual line breaks. However, for these languages\
    \ is a high priority for GTK+ 1.4. For future plans, Owen Taylor's white paper\
    \ at http://www.gnome.org/white-papers/i18n/gtk18n/ is an excellent resource.\n\
    \nBoth GTK and Gnome use the gettext message catalog system to translate visible\
    \ strings, so any string toolkit knows how to be translated into foreign languages,\
    \ the section called Internationalization in Chapter 5 covers this topic."
