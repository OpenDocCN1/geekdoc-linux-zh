    # Pixmaps


    gdk_draw_pixmap() copies a pixmap to another drawable (pixmap or window). The
    source and destination drawables must have the same depth and visual. If you pass
    -1 for the width or height, the full size of the source pixmap is substituted.
    The source can actually be any drawable, including a window, but gdk_window_copy_area()
    will make your code clearer if the source is a window.


    Figure 23. Drawing Pixmaps


    ```

    #include <gdk/gdk.h>

    void gdk_draw_pixmap(GdkDrawable* drawable, GdkGC* gc, GdkDrawable* src, int xsrc,
    int ysrc, int xdest, int ydest, int width, int height);

    ```


    # RGB Buffers


    GdkRGB module allows you to copy a client-side buffer of image data to a drawable.
    If you want to manipulate image data extensively, or copy image data to the server,
    this is the correct way to do it. You can''t directly copy a GdkPixmap because
    it is a server-side object. Copying image data to the server with gdk_draw_point
    would be unbelievably slow, since each point would require a server request (probably
    more than once, since you need to change the GC for each point).


    Internally, GdkRGB uses an object to copy sizable data that have to be copied—GdkRGB
    is highly tuned and uses shared memory if the client and server happen on the
    same machine. It''s the fastest way to perform this task, given the X architecture.
    It will also handle tricky issues for you (such as adapting to the colmaps and
    visuals on a X server).


    The drawable you intend to copy the RGB buffer must use GdkRGB''s visual and colormap.
    If the drawable is a part of a widget, the easiest way to ensure this is to push
    the GdkRGB visual and colormap when you create the widget:


    ```

    GtkWidget* widget;

    gtk_widget_push_visual(gdk_get_visual(widget));

    ```


