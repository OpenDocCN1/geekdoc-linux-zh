  md: '# Chapter 10. GDK Basics


    may leave over the start of the next character. The left-side-bearing or learing
    is the distance from the left origin to the leftmost pixel in the character, the
    right-side-bearing or rearing is the distance from the origin to the rightmost
    pixel in the character. Thus the rearing can be larger than the width, in the
    case of italic fonts that lean over the start of the next character.


    GDK functions that return a character or string return the width of the character,
    or the sum of the characters within the string. If the rearing of the rightmost
    character is greater than its width, a string probably requires more space than
    `gdk_string_width()`, `gdk_text_width()`. For the height-measurement functions,
    the string, variant returns the length of the string for, and the `text_variant`
    accepts a precomputed length as an argument.


    The functions ending in measure are more than what you want. For a string with
    N characters, return the sum of the widths of the first N-1 characters, plus the
    rearing of the final character. They take into account the fact that rearing may
    be greater than width; if you need to decide how much space to leave for rendering
    a string, use `gdk_string_measure()` or `gdk_char_measure()` for functions. If
    you don''t need to consider the rearing, if you''re centering a string, it may
    look nicer to use the width (because a small italic flourish extending past the
    width won''t "fill" the space and the string will look slightly left of center).


    `gdk_text_extents()` and `gdk_string_extents()` return all the metrics for a string,
    including both bearings, the width, ascent, and descent. The returned left-side-bearing
    is the leftmost pixel in the bearing; the right-side-bearing is the rightmost
    pixel as returned by `gdk_text_measure()`. The width is the sum of characters,
    as returned by `gdk_text_width()`.


