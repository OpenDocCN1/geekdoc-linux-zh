  md: '# Chapter 10. GDK Basics


    +   - GDK_DESTROY means the window has been destroyed. Widgets normally destroy
    their own windows when they are unrealized. If a widget is not destroyed after
    a destroy event on its window, the GTK+ main loop destroys it.

    - GDK_MAP means the window has been shown on the screen. You should wait for the
    first event before you draw the window, however.

    - GDK_UNMAP means the window has been hidden; perhaps it was iconified, or perhaps
    you called `gtk_widget_hide()`


    # Little-used Events


    There are a few other event types that aren''t very useful, so this book does
    not cover them in detail. This section gives a brief description of each one,
    for completeness. You can safely skip this section.


    # Visibility Events


    Visibility events occur when a window is obscured or unobstructed. They are not
    very useful, because other events already give you the information you need. In
    particular, when a window is obscured you receive events indicating that newly-visible
    areas should be redraw. Here is:


    ```

    typedef _GdkEventVisibility GdkEventVisibility GdkEventVisibility;

    ```


    state is an enumeration value indicating whether the window was obscured or unobstructed.


    # Property Events


    X associates properties with windows. These are basically key-value pairs used
    for interclient communication; most commonly, they relay some information about
    a tolevel window to the window manager. GTK+ provides a high-level interface for
    all the important properties, so you should not need to deal with them directly.
    Property events are sent when a property''s value changes.


    ```

    typedef _GdkEventProperty GdkEventProperty GdkEventProperty;

    ```


    ```

    struct _GdkEventProperty {

    GdkEventType type;

    GdkWindow *window;

    gint8 send_event;

    GdkAtom atom;

    gint32 time;

    gint8 state;

    };

    ```


    189'
