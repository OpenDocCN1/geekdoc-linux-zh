  md: '# Standard Canvas Item Reference


    This section describes each of the canvas items that come with Gnome, giving a
    table of arguments and describing any non-obvious examples.


    # Rectangle and Ellipse Items


    The GnomeCanvasRect and GnomeEllipse canvas items share exactly the same interface,
    via a GnomeCanvasRE base class. Their shape is given as a bounding box: a top
    left coordinate (x1, y1) and a bottom right coordinate (x2, y2). The rectangle
    matches the shape of the bounding box; the ellipse is inscribed in the bounding
    box, touching the center of each side. Rectangles and ellipses can be filled or
    simply with an outline. If they are only an outline, they are considered to be
    “hollow”; that is, the transparent area inside the shape is not part of the canvas
    and events occur in that area will not be relayed to it.


    GnomeCanvasRE does not behave gracefully if you give the coordinates in the wrong
    order. That is, x2 must be greater than x1, and y2 must be greater than y1; otherwise
    GnomeCanvas gets confused.


    Table 12-1. GnomeCanvasRE Arguments


    | Name | Type | Read/Write | Description |

    |---|---|---|--|

    | x1 | double | Both | Leftmost coordinate |

    | y1 | double | Both | Topmost coordinate |

    | x2 | double | Both | Rightmost coordinate |

    | y2 | double | Both | Bottommost coordinate |

    | fill_color | gchar* | Write-only | Fill color; string for gdk_color_parse(),
    or NULL for transport |

    | fill_color_gdk | GdkColor* | Both | Fill color; specified as already-allocated
    GnomeColor |

    | fill_color_rgba | guint32 | Both | Fill color; specified as 32-bit value packing
    red, green, blue, and alpha into bytes 1, 2, 3, and 4; alpha of 255 is opaque,
    0 is invisible |

    | outline_color | gchar* | Write-only | Outline color; string for gdk_color_parse,
    or NULL for transport |'
