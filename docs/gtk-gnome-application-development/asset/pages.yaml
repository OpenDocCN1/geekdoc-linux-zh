  md: "# Chapter 3. GTK+ Basics\n\nThis chapter does the usual Hello, World to give\
    \ you an overview of GTK+, then moves on to discuss some of the essential details\
    \ you need to start developing GTK+ applications.\n\nIf you've already read the\
    \ GTK+ Tutorial from http://www.gtk.org/, or the book Developing Applications\
    \ with GTK and Gdk (also from New Riders), you may be able to skip or just skim\
    \ this chapter. If you haven't used GTK+ before, this chapter is going to be very\
    \ fast; read with care.\n\n# Whirlwind Tour of GTK+\n\nGTK+'s object-oriented\
    \ coding style, clean design, and carefully followed API-naming conventions make\
    \ programs simple to write and simple to understand. To make the point, here's\
    \ a complete \"Hello, World\" in GTK+, most likely you can guess 80% of the code\
    \ with no GTK+ experience whatsoever.\n\n# A Complete Hello, World\n\n![](img/f08b98c3d9ba764fd120a058661d79d5_49_0.png)\n\
    \nFigure 3-1. Hello, World\n\n```\n#include <gtk.h>\nstatic int delete_event_cb(GtkWidget*\
    \ w, GdkEvent* e, gpointer data);\nstatic void button_click_cb(GtkWidget* w, gpointer\
    \ data);\n\nint\n main(int argc, char *argv[])\n{\n  GtkWidget* window;\n  GtkWidget*\
    \ button;\n  GtkWidget* label;\n\n  gtk_init(&argc, &argv);\n  window = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
    \  button = gtk_button_new();\n  label = gtk_label_add(\"Hello, World!\");\n\n\
    \  gtk_container_add(GTK_CONTAINER(button), label);\n  gtk_container_add(GTK_CONTAINER(window),\
    \ button);\n\n  gtk_window_set_title(GTK_WINDOW(window), \"Hello\");\n  gtk_container_set_border_width(GTK_CONTAINER(button),\
    \ 10);\n```"
