    # Installing Datfiles: Documentation and Pixmaps


    Documentation and pixmaps are installed in the same way; automake allows you to
    install datfiles to arbitrary locations, and you can use variables defined by
    configure to decide where they go.


    # Pixmaps


    To install datfiles from your Makefile.am you simply come up with a name for the
    target--pixmap seems good--then create a variable for the directory and a corresponding
    variable for the files to install. For example:


    ```

    EXTRA_DATA = gnome-hello-logo.png


    pixmapdir = $(datadir)/pixmaps


    pixmap_DATA = gnome-hello-logo.png

    ```


    The "string" connects the pixmap variable with the pixmap_DATA variable with the
    pixmap_ suffix and generates appropriate rules in Makefile.in. This Makefile.am
    segment installs EXTRA_DATA, gnome-hello-logo.png into $(datadir)/pixmaps; $(datadir)
    is a variable filled by configure. Typically $(datadir) is /usr/local/share $(prefix)/share,
    which is the location for architecture-independent data files (that is, files
    which can be shared between several systems with different binary formats).


