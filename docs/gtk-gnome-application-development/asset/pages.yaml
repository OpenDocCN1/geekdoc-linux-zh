    The class initialization and base class initialization functions require some
    background information to understand fully; you will know how to write them after
    you read this chapter.


    # # Initializing a New Class


    When a type is used, GTK+ creates an instance of its class struct (using the information
    supplied to gtk_type_unique()). To initialize the class for a type, GTK+ first
    checks that all parent classes are initialized and initializes them. Then it fills
    the top portion of the class struct with a byte-for-byte copy of the parent''s
    struct. This subclass inherits any function pointers found in the parent class.


    Next, the base class initialization functions of each parent class and that of
    the class itself are called in order, starting with GObject. A base initializer
    is optional; in the Button case, there is none. If present, the base class supplements
    the byte-for-byte copy of the class; for example, some functions should not be
    inherited. To prevent class inheritance, the base class initializer can cancel
    certain function pointers. You do not need a base class initializer.


    Finally


    A concrete example would make the class creation process clear. For GtkButton
    is shown in Figure 9-1. When the GtkButton is registered, an empty GtkButton is
    created. This class is initialized as follows:


    +   1. The class struct for GtkBin, GtkButton''s immediate parent, is copied into
    it. This means GtkButton inherits class functions from GtkBin.

    2. The base class initialization function for GObject is called on it. This zeros
    some GObject functions that should not be inherited.

    3. There is no base class initializer for GtkWidget, or it would be called.

    4. The base class initializer for GtkContainer is called. This zeros some GtkContainer
    functions that should not be inherited, and initializes a GtkClassName member.


