  md: '# GtkData


    # Library


    GTK+


    # Header File


    gtk/gtkdata.h


    # Description


    GtkData is an abstract base class for a piece of data that might be shared between
    multiple objects. Right now its interface is empty; in the future, there may be
    generic operations for all GtkData objects.


    # GtkAdjustment


    # Library


    GTK+


    # Header File


    gtk/gtkadjustment.h


    # Description


    GtkAdjustment represents a numeric value. It can also store a maximum and minimum
    value, a "step increment", a "page increment", and a "page size". Some objects
    don''t use all the fields in the adjustment, and some interpret them differently.
    A change (including its GtkScale and Gtkscrollbar subclasses) will allow the user
    to move the slider between the minimum and maximum values. Clicking the arrows
    on the ends of a GtkScrollBar nudges the scroll bar by one "step increment"; clicking
    them with the middle button moves one "page increment". The "page size" determines
    the size of the scrollbar slider (it''s the length of the "visible" page size)
    in the same units as the overall range. GtkAdjustment emits signals when its values
    change.


    # GtkTooltips


    # Library


    GTK+'
