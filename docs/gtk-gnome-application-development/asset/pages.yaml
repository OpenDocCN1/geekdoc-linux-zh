    \       case GTK_RESIZE_MODE:\n            GTK_VALUE_ENUM (*arg) = container->resize_mode;\n\
    \            break;\n        default:\n            arg->type = GTK_TYPE_INVALID;\n\
    \            break;\n    }\nn\n```\n\nNotice that the type must be set to GTK_TYPE_INVALID\
    \ if your subclass doesn't understand the argument ID. This is used as an error\
