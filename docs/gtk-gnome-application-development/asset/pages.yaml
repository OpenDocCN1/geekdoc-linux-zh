  md: '# Argument Parsing with popt


    Gnome uses a powerful option-parsing library called popt. popt handles all the
    default Gnome options—to see the default options, pass the -help option to any
    Gnome application. You can add a `popt table` with your custom options. To do
    so, replace gnome_init() with gnome_init_with_popt_table() variant (Figure 5-3).


    ```

    #include <libgnome/gnome-init.h>

    int gnome_init_with_popt_table(const char *app_id, const char *app_version,

    int argc, char **argv, struct poptOption *options, int flags,

    popt-Context *Context) return ctw;

    ```


    Figure 5-3. Init with Argument Parsing


    A popt table is an array of struct poptOption, defined as follows:


    ```

    struct poptOption {

    const char *longName;

    char *shortName;

    int argInfo;

    void *arg;

    int val;

    char *desc;

    char *argDesc;

    };

    ```


    The two components are the long and short names for the option; for example, "help"
    and "h" would correspond to command-line options -help and -h. These can be NULL
    or \00 respectively, if you want only one name for the option.

    The arginfo member tells what kind of entry this is. Here are the possible values:


    +   - POPT_ARG_NONE means the option is a simple switch, it takes no argument.

    - POPT_ARG_STRING means the option takes a string argument, as in -geometry=*300x300+50+100*.

    - POPT_ARG_INT means the option takes an integer argument, as in --columns=10.

    - POPT_ARG_LONG means the option takes a long argument.

    - POPT_ARG_INCLUDE_TABLE means this struct poptOption does not specify an option,
    but rather another popt table to be included.

    - POPT_ARG_CALLBACK means this struct poptOption does not specify an option, but
    rather a callback function to be used for parsing options in the table. This kind
    of entry should be at the beginning of your table.

    - POPT_ARG_INT_DOMAIN means this struct poptOption specifies the translation domain
    for this table and messages.


    The meaning of arg depends on the arginfo member. For arguments that take an argument,
    arg should point to a variable of the argument type. popt will fill the pointed-to
    variable with the argument. For POPT_ARG_NONE, *arg is set to TRUE if the option
    is found on the command line. In all cases, arg may be NULL, causing popt to ignore
    it.'
