    \    GtkBinClass parent_class;\n    void (* pressed) (GtkButton *button);\n  \
    \  void (* released) (GtkButton *button);\n    void (* clicked) (GtkButton *button);\n\
    \    void (* enter) (GtkButton *button);\n    void (* leave) (GtkButton *button);\n\
    };\n```\n\nChapter 9 explains exactly what a class struct is; for, now pay attention\
    \ to the function pointers, and note how they correspond to signals. Get to from\
    \ this:\n\n```\nvoid (* clicked) (GtkButton *button);\n```\n\nto this:\n\n```\n\
    static void button_click_cb (GtkWidget* w, gpointer data);\n```\n\nsimply add\
    \ a gpointer data to the class struct signature. In Hello, World I've also changed\
    \ the type from GtkButton to GtkWidget; this is common, it can be more convenient\
    \ to have a GtkWidget. The argument will always be the GtkButton emitting the\
    \ signal.\nAnother example may be useful; here's \"delete_event\" from gtk/gtkwidget.h:\n\
    \n```\ngint (* delete_event) (GtkWidget *widget, GdkEventAny event, int *event);\n\
    ```\n\nand the callback from Hello, World:\nstatic gint delete_event_cb(GtkWidget*\
    \ w, GdkEventAny* event, gpointer data);\n\nThat's all there is to it. You can\
    \ write GTK+ applications using the information presented in this section. GTK+\
    \ and Gnome are powerful development tools because you can think about real functionality,\
    \ instead of struggling to get a window on the screen.\n\n# Containers And Widget\
    \ Layout\n\nThere are two kinds of container widgets in GTK+. All of them are\
    \ subclasses of the abstract GtkContainer. The first type of container always\
    \ descends from GtkBin, another abstract base class. Descendants of GtkBin can\
    \ contain only one child widget; these add some kind of functionality to the child.\
    \ For example, GtkButton is a GtkBin which makes the child into a clickable button.\
    \ GtkFrame"
