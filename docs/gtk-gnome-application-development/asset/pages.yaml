  md: "# Chapter 9. The GTK+ Object and Type System\n\ncaller assumes ownership of\
    \ the memory. GTK_TYPE_BOXED, GTK_TYPE_ARGS, and GTK_TYPE_STRING obey this rule.\n\
    \nNote that you should almost always use the most informative type available.\
    \ Notably, GTK_TYPE_POINTER should only be used for generic pointers (gpointer);\
    \ whenever possible, prefer a \"subclass\" of GTK_TYPE_BOXED such as GTK_TYPE_GDK_WINDOW\
    \ or GTK_TYPE_GDK_EVENT. Similarly, it is better to use a specific enumeration\
    \ type, rather than GTK_TYPE_ENUM. GTK_TYPE_CALLBACK is normally preferred to\
    \ GTK_TYPE_CALLBACK or GTK_TYPE_SIGNAL, because GTK_TYPE_CALLBACK includes information\
    \ about how to marshal the function and destroy the callback data.\n\nGTK+ has\
    \ a consistent interface for passing typed values; to do this, it needs a data\
    \ structure which stores a type tag and a value. GtkArg fills the bill. Here is\
    \ its definition, from gtk/gtktypeutils.h:\n\n```\ntypedef struct _GtkArg GtkArg;\n\
