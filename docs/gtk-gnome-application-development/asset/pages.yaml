    \ actions. For example, you normally change some boolean variable if the user\
    \ clicks a toggle button, in a callback to the \"toggled\" signal. If you update\
    \ the toggle button programmatically the flag was changed via some mechanism other\
    \ than the button, \"toggled\" will be emitted; but you want to block your callback,\
    \ since the flag is already correct.\n\ngtk_signal_connect() is not the only way\
    \ to connect to a signal. You can also use `gtk_signal_connect_object()`, which\
    \ simply swaps the signal-emitting pointer and the user data pointer in the arguments\
    \ passed to the callback. The object comes first, then any arguments you intend\
    \ to use, and finally the user data pointer; with gtk_signal_connect_object(),\
    \ the object is last and user data first. This is useful when you want to use\
    \ a pre-existing function as a callback without writing a wrapper to merge them.\
    \ For example:\n\n```\ngtk_signal_connect_object(GTK_OBJECT(button),\n    \"clicked\"\
    ,\n    G_CALLBACK_FUNC(gtk_widget_destroy),\n    GTK_OBJECT(dialog));\n```\n\n\
    Because the user data and the button are swapped, the first argument to it will\
    \ be the dialog rather than the button, closing the dialog. Using `gtk_signal_connect_object()`,\
    \ your callback must be a GtkObject to avoid conflicting marshallers that expect\
    \ an object as their first argument.\n\ngtk_signal_connect_after() allows GTK\
    \ to run the callback after the object's default signal handler, rather than before\
    \ it. This works with certain signals, with the GTK_RUN_LAST flag set; the section\
    \ Adding a New Signals explains this flag.\n\ngtk_signal_connect_object_after()\
    \ combines the effects of `gtk_signal_connect()` and `gtk_signal_connect_after()`.\n\
    \ngtk_signal_connect_full() gives you complete control over the connection and\
    \ is useful in language bindings. The object signal and arguments can be TRUE\
    \ or FALSE, toggling order and time of callback invocation. The functions mentioned\
