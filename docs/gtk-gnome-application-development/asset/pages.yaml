    # Type Checking and New Types


    GTK+ has an extensive type system, which is to some extent independent of its
    object system. The object system makes use of the larger type system. Every object
    has a type, and every type has a unique identifier. When writing a GObject, it''s
    customary to provide a function which returns the type''s identifier.


    In the case of GtkButton, the relevant function is:


    ```

    GtkType gtk_button_get_type();

    ```


    The first time this function is invoked, it will register a GtkButton type with
    the object system, and in the process obtain a type identifier. On subsequent
    calls, the type is simply returned. GtkType is undefined (is not the actual type
    of GTK+''s identifiers). To facilitate this, objects commonly provide macros in
    their header files:


    ```

    #define GTK_TYPE_BUTTON(obj)  (gtk_button_get_type((obj)))

    #define GTK_BUTTON(obj)       (GTK_CAST((obj), GtkButton))


    #define GTK_BUTTON_CLASS(class) (GTK_CHECK_CAST((gtk_button_get_class((class)),
    GtkButtonClass))

    #define GTK_IS_BUTTON(obj)      (GTK_CHECK_TYPE(obj, GTK_TYPE_BUTTON))

    #define GTK_IS_BUTTON_CLASS(class) (GTK_CHECK_TYPE(class, GTK_TYPE_BUTTON_CLASS))

    ```


    Instead of casting an object, you can use the GTK_BUTTON() macro. If GTK_NO_CHECK_CASTS
    is defined, these macros are equivalent to simple casts. Otherwise, retrieve the
    type of the object and compare it to the type you''re attempting to cast to.


    GTK+ also provides runtime type checking, with the GTK_IS_BUTTON() macro. This
    is used in preconditions; for example, checking a functioning button as an argument
    might have this mistake at the following:


    ```

    g_return_if_fail(GTK_IS_BUTTON(widget));

    ```


    The GTK+ and Gnome library functions have many such checks. You can also use the
    macro to make certain code conditional on an object''s type, though this is a
    poor idea from a design standpoint.


    To give you an idea what sort of information GTK+ stores about each object type,
    here''s the implementation of gtk_button_get_type():


    131'
