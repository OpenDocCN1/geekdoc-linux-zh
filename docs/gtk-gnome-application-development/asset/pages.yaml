    # # Visuals and Colormaps


    Unfortunately, not all hardware is created equal. The most primitive X servers
    port only two colors; each pixel is either on or off. This is referred to as a
    ''one bit pixel (pp)'' display. A display with one bit pixel is said to have a
    depth of one. More advanced X servers support 24 or 32 bits per pixel, allow you
    to specify a different depth on a window-by-window. 24 bits per pixel allows 2^24
    pixels, which includes more colors than the human eye can differentiate.


    Conceptually, a bitmap consists of a rectangular grid of pixels. Each pixel contains
    some number of bits; pixels are mapped to visible colors in a hardware-dependent
    way. One way to think about this is as a two-dimensional array of integers, where
    the integer value represents the required number of bits. Alternatively, you can
    think of this like a stack of bitmaps, or two-dimensional arrays of bits. If all
    the planes are parallel to one, a pixel is a perpendicular line passing through
    the same coordinates on each plane, a single bit from each. This is the origin
    of the depth, since the number of bits per pixel is equal to the depth of the
    stack.


    In the X System, pixels represent entries in a color lookup table. A color is
    red, green, blue (RGB)—monitors mix red, green, and blue light in some ratio to
    display each pixel. An eight bit display, for example bits are not enough to encode
    a color in-place; only a arbitrary RGB value would be possible. Instead, the bits
    are interpreted as an integer and used to index an array of RGB colors. This table
    is called the colormap; it can be modified to contain the colors you plan to use,
    though this is hardware-dependent—some colormaps are read-only.


    A visual is required to determine how a bit pattern is converted into a visible
    color. On an 8-bit display, the X server might interpret each pixel as an index
    into a colormap containing the 256 colors. 24-bit visuals typically have three
    colormaps: one for shades of red, one for shades of green, and one with an eight-bit
    value; the three eight-bit values are packed into a 24-bit visual. The visual
    defines the meaning of the pixel contents. Visuals also define whether the colormap
    is read-only or modifiable.


    In short, a visual is a description of the color capabilities of a particular
    X server. In Xlib, you have to do a lot of fooling around visuals; GDK and GTK+
    do for most of the mess.


    # # GdkVisual


    Xlib can a list of all available visuals and information about each; GDK provides
    a client-side copy of this information in a struct GdkVisual. GDK can report the
    available visuals, and rank them in different ways. Most of the time you will
    use `gdk_visual_get_system()`, which returns a pointer to the default visual (Figure


