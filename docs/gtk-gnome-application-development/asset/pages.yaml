  md: '# Chapter 7. User Communication: Dialogs


    ```

    void gnome_dialog_close_hides(GnomeDialog*) dialog, gboolean setting);

    void gnome_dialog_set_close(GnomeDialog*) dialog, gboolean setting);

    ```


    Figure 7-3. Closing GnomeDialog


    By default, "close" destroys the dialog. This is what you usually want; however,
    if a dialog is noticeably time-consuming to create, you might want to merely re-show
    it without ever destroying it. You might also want to hide the dialog from the
    user, extract the state of any widgets inside it, and then destroy it using gtk_widget_destroy().
    The decision depends on the structure of your code. However, in general it is
    simpler and less error-prone to let the dialog be destroyed when clicked. You
    can then connect to the "clicked" signal if you need to query the state of widgets
    in the dialog.


    If you connect to "close", that handler should return a boolean value. If it returns
    TRUE, the hide or destroy will not take place. You can use this to keep the user
    from closing the dialog, for example if they have not filled in all the fields
    of a form.


    The "close" signal is designed to collect several possible user actions into a
    single handler: it should be emitted when the user presses Escape or the window''s
    close button is clicked. It is also convenient to emit when the dialog is hidden.
    You can ask GnomeDialog to emit whenever a button is clicked with gnome_dialog_set_close()
    (Figure 7-3); if its argument is TRUE, the will emit "close" to "added" if any
    of its buttons are clicked. By default, this setting is FALSE for GnomeDialog,
    but for many of the special dialog types it is TRUE (the inconsistency is an unfortunate
    misfeature).


    Note that the "close" signal is emitted when the dialog "delete_event"; this means
    you only have to write one signal handler to deal with all dialog connections.
    There is no need to handle "delete_event" as a separate case.


    # Finishing Touches


    The difference between a good dialog and a great dialog is in the details. GnomeDialog
    comes with a number of features to make final polish easy. Figure 7-4 sums them.


    ```

    #include <libgnome/gnome-dialog.h>

    void gnome_dialog_set_parent(GnomeDialog*) dialog, GtkWindow* parent);

    void gnome_dialog_set_default(GnomeDialog*) dialog, GtkButton* button);

    void gnome_dialog_set_editable_enters(GnomeDialog*) dialog, GtkEditable* editable);

    void gnome_dialog_set_sensitive(GnomeDialog*) dialog, GtkButton button, gboolean
    setting);

    ```


    Figure 7-4. GnomeDialog Polish


    Dialogs have a logical parent, usually the main application window. You can tell
    the library about this parent-child relationship; this lets Gnome honor certain
    user preferences, and in turn indicates the relationship to the window manager.
    Most managers will minimize child dialogs when the parent window is minimized,
    and keep child dialogs on top of their parent.


