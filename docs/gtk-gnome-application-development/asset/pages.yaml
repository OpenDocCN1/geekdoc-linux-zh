    Figure 2-26. Predictions for GNode


    You can ask glib to report useful information about a GNode, the number of nodes
    it contains, its root node, its depth, and the node containing a particular data
    pointer. These are shown in Figure 2-27.


    GTraverse was introduced early, with respect to GTree; here are the possible values
    for GNode:


    +   - G_IN_ORDER first visits the leftmost child of the node, then visits the
    node itself, then recurses to the node''s children. This isn''t very useful; mostly
    it is intended for GTree.

    - G_PRE_ORDER visits the current node, then recurses each child in turn.

    - G_POST_ORDER visits each child, then visits the current node.

    - G_LEVEL_ORDER visits the first node itself; then the children of the node; the
    children of the children of the children; and so on. it visits each node of depth
    0, then each node of depth 1, then each node of depth 2,


    GNode''s tree-traversal functions have a GTverseFlags argument. This is a bitfield
    used to change the nature of the traversal. Currently there are three flags—you
    can visit leaf nodes, only non-leaf nodes, or all nodes:


