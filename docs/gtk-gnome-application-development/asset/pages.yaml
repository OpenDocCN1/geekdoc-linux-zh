  md: "# Chapter 7. User Communication: Dialogs\n\nDialogs are a continuous annoyance\
    \ in plain GTK+ every time you want to tell the user anything, you have to create\
    \ a window, create some buttons, create a label, pack the buttons and label into\
    \ the window, set up callbacks, remember to capture 'delete_event', and so on.\
    \ It’s a pain. Gnome saves you from this, with easy-to-use general-purpose dialog\
    \ widget, subclasses of it implement common dialog types. Gnome also has functions\
    \ for using modal dialogs.\n\n# The GnomeDialog Widget\n\nSince dialogs in plain\
    \ GTK+ are painstakingly constructed from scratch, there are at as many ways to\
    \ write a dialog as there are programmers. The programmer must decide where to\
    \ place the dialog on the screen, whether to put a separator above the buttons,\
    \ what container to put the buttons in, which the keyboard shortcuts, and so on.\
    \ Premiere GnomeDialog is that the programmer should not have to care about these\
    \ things; if they’re variable at all, the user should choose the way they want.\
    \ From the programmer’s perspective, dialogs 'just work'.\n\n# Creating a Dialog\n\
    \nA GnomeDialog is easy to create. Here’s a summary of the basic steps, more detail\
    \ follows:\n\n+   1. Read the section called Special Dialog Types and decide whether\
    \ one of the special dialog subclasses is appropriate. If so, skip the steps below\
    \ and create subclass instead.\n2. Create the widget with gnome_dialog_new().\
    \ Pass this title of the dialog (displayed by the main window) and the name of\
    \ each button you’d like to have.\n3. Plan how your dialog will work. You will\
    \ need to connect the \"close\" or \"clicked\" signals. You can have the dialog\
    \ hide or destroy itself when closed. You can also have the dialog automatically\
    \ close when clicked, or handle it yourself. There are a number of ways the user\
    \ can interact with a dialog, so it’s important to the combination of settings\
    \ you choose will work no matter what the user does.\n\nTo create a dialog, use\
    \ gnome_dialog_new(), shown in Figure 7-1. The argument list is a NULL-terminated\
    \ list of buttons to insert in the dialog. For example, you might say:\n\n```\n\
    GtkWidget* dialog;\ndialog = gnome_dialog_new(\"My Dialog Title\",\n         \
    \                            \"OK\",\n                                     \"\
    Cancel\",\n                                     NULL);\n```"
