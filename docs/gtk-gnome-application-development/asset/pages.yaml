    # Realization


    The realize and unrealize class functions are registered as signals. Realization
    is the process of creating resources associated with the widget; including but
    not limited to widget->window and widget->style.

    A realize method does the following:


    +   * Set the GTK_REALIZED flag.

    * Create the widgets, especially widget->window which should be a child of the
    parent''s parent->window (obtained with gtk_widget_get_parent_window()).

    * Place a pointer to the widget in the user data field of each window.

    * For windowless widgets, widget->window should be the parent''s window (obtained
    with gtk_widget_get_parent_window()). These widgets should also increase the reference
    count on parent->window by calling gdk_window_ref().

    * Set->style using gtk_style_attach().


    The default implementation of realization is appropriate for windowless widgets;
    it sets the GTK_REALIZED flag, sets->window to the parent''s window, increases
    the reference count on the parent, and widgets->style.

    Widget with their parent GdkWindow must override the realize method.


    The "realize" signal invokes the realize method as its default handler. This signal
    should never be emitted directly, because there are substantial pre- and post-conditions
    to be enforced. gtk_widget_realize() takes care of the details. Among other things,
    it ensures that the widget''s parent is realized; GTK+ maintains the invariant
    that widgets cannot be realized unless their parents are also realized.


    +   * Unmaps the widget if the widget is mapped; remember the GTK+ invariant that
    all mapped widgets are realized.


