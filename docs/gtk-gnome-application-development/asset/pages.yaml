    If a signal returns a value, you must pass a location for the returned value as
    the argument:


    ```

    int return_val;


    return_val = FALSE;

    gtk_signal_emit (GTK_OBJECT (widget), widget_signals[EVENT], event,

    &return_val);

    ```


    Notice that return_val is initialized to something else: if there are no signal
    handlers, none of them will assign a value to return. So you initialize the variable.
    Each signal handler''s return value will be assigned to the same location, so
    the final value of return_val, which is determined by the last signal handler
    to run. Note that certain return values (like strings) must be freed by the signal
    emitter.

    gtk_signal_emit_by_name(instance) is the same as gtk_signal_emit(instance), except
    the second argument is a signal name rather than a signal ID. There are also variants
    of both emission functions that take a vector of GtkArg instead of variable argument
    list. These variants accept arrays of n*GtkArg structs, where n is the number
    of signal arguments and there is an additional GtkArg for the return value. The
    GtkArg structs should be initialized with same values. If the function returns
    no value, the return value GtkArg will have GTK_TYPE_NONE.

    All four signal emission functions are summarized in Figure 9-5.


