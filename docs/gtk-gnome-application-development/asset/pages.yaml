    Button events are marked with a time stamp (time) by the X server. Time is given

    in milliseconds of "server time"; every few weeks the integer overflows and times-

    begins again at 0. Thus, you should not rely on the value as an absolute measure

    of time; it is intended only to determine relative time between events.


    The mouse pointer X and Y coordinates (relative to the window the event occurred

    in are included in GdkEventButton. Keep in mind that the pointer may be outside

    the window (a pointer grab, this action called The Mouse Pointer). If the pointer

    is outside the window, coordinates could be negative or larger than the

    window''s size. Coordinates are given as doubles rather than integers, because
    some\input devices like graphics tablets have sub-pixel resolution. For most purposes,

    y will need to cast the buttons to integers. press, tilt and ytilt are also special

    features of input devices, they can be ignored all the time.


    The state member of GdkEventButton indicates which modifier keys or mouse-

    tons were held down before the button was pressed. It is a bitfield, with

    one or more of the flags in Table 10-5. Since the modifiers are read just before
    the

    button press, it follows that events do not have the pressed button in

    state, but release events do have it.


    Be careful to check for the presence of certain bit masks, rather than the exact
    value

    of state. That is, prefer:


    ```

    if ( state & GDK_SHIFT_MASK ) == GDK_SHIFT_MASK )

    ```


    and avoid this:


    ```

    if ( state == GDK_SHIFT_MASK )

    ```


    If you check the exact value of state, your application will mysteriously stop
    working

    if the user has Num Lock or some other obscure modifier turned on.


