  md: "# Chapter 13. Writing a GnomeCanvasItem\n\n# Speed and RGB Rendering\n\nIf\
    \ you have a large number of objects, RGB mode can be faster than GDK mode. Drawing\
    \ to an RGB buffer is a simple matter of assigning to an array, which is much,\
    \ much faster than making the GDK canvas has to connect to the X server and it\
    \ to do the actual drawing. The expensive part is copying the RGB buffer to the\
    \ X server when you do it. However, the copy takes the same amount of time no\
    \ how many canvas items you have, since it is done only once, when all the items\
    \ have been rendered.\n\nThis is a big win in an application called \"Guppi\"\
    \ I'm in the process of writing, Guppi is a plot program. One of the things it\
    \ has to do is render a scatter plot with thousands of points. Each point is a\
    \ small colored shape; if I called GDK to render each, there would be tens of\
    \ hundreds of trips to the X server, across a network. Instead, I use in RGB mode,\
    \ with a custom item rendering the canvas copies the RGB buffer to the server\
    \ in a single burst. It's fast and responsive. For less-intensive elements of\
    \ the plot, such as the legend, I can save time and use the built-in canvas items.\n\
    \nThe only difficulty with-to-RGB rendering is that you need a rasterization library\
    \ comparable to the GDK primitives if you want to draw anything other than the\
    \ default canvas items. You can use it in your custom items, and it is the best\
    \ if you only be drawing hundreds of shapes, if you're drawing thousands of shapes,\
    \ however you'll quickly feel the need for something faster. This is available;\
    \ the maintainers of a package GDK Plotutils extracted the rasterization library\
    \ from the X distribution, and during the development of Guppi I extracted from\
    \ Plotutils and hacked it to work with the canvas's RGB buffers. I also added\
    \ alpha transparency support. The resulting library allows you to draw on an RGB\
    \ buffer as much as you would draw using GDK. The library is distributed under\
    \ the same license as the X Window System, and is free to include with their application.\n\
    \nRalph Levien, about libart_lg and the GdkRGB module, tell me that static routines\
    \ would be better; if you need more speed, consider this challenge.\n\n# The Draw\
    \ Method (GDK Mode)\n\nDrawing with GDK is much less complicated than drawing\
    \ with libart-lg, though it is also less flexible and produces lower-quality results.\
    \ Here is the GnomeCanvas-Implementation of the draw method:\n\n```\nstatic void\n\
    gnome_canvas_rect_draw (GnomeCanvasItem *item, GdkDrawable *drawable,\n\tint x,\
    \ int y, int width, int height)\n\nGnomeCanvas *re;\n\tdouble i2w[6], w2c[6],\
    \ i2c[6];\n\tint x1, y1, x2, y2;\n\tArtPoint i1, i2;\n\tArtPoint c1, c2;\n```"
