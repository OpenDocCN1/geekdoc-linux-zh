  md: '# GdkWindow


    GdkWindow is a wrapper around Xlib''s Window object. (It was discussed briefly
    in the section called Realizing, Mapping, and Showing in Chapter 3.) GdkWindow
    represents a region on the screen. It can be shown or hidden (called mapping and
    unmapping the window in Xlib). You can capture events received by a GdkWindow,
    draw graphs inside it, and move or resize it. GdkWindows are arranged in a tree
    structure where each can have children. Child windows are positioned relative
    to their parent window, and when the parent moves, child windows don''t draw outside
    of their parent''s bounds (they are clipped by the parent window).


    The tree of GdkWindows is not specific to each; there is a global tree of windows
    controlled by the X server and the window manager. The root window has no parent;
    all windows derive from it. All or part of it is your desktop box. Each window
    can be created by a different Unix process, some may come from user applications.


    GdkWindow and Gtk are very different; Gtk is a widget used to represent toplevel
    windows (toplevel windows are the highest-application windows in the window hierarchy).
    Window managers typically create decorations for today windows; decorations include
    title bars, buttons, and the like.


    It''s important to understand that X window is an object on the X server. X clients
    receive a unique integer ID for each, and refer to windows by ID. Thus, all window
    operations take place on the server; all functions that deal with X go across
    the network.


    GdkWindow is a wrapper around the ID returned by X. It copies some information
    (such as the window''s dimensions), so some operations operations are more efficient
    than the corresponding Xlib operations. Still, GdkWindow is essentially a handle
    for a server-side object. Many Gdk objects are similar; pixmaps, cursors, and
    so on are handlers for server-side objects.


    # GdkWindow and GtkWidget


    Many Gtk subclasses have an associated GdkWindow. In theory, GTK+ applications
    could create only toplevel windows, and have all draw widgets into them. It would
    make little sense to do so; GdkWindow allows the X Window System to automatically
    handle many details. For example, events from Gdk widget are marked with the window
    they occurred in; GTK+ can rapidly determine which widget event corresponds to
    which.


    There are widgets with no associated GdkWindow; these are called ''no window'',
    allocated to the GTK_NO_WINDOW flag that marks them. (You can test this with the
    macro GTK_WIDGET_NO_WINDOW()) Widgets without a window render them into their
    parent container''s GdkWindow. Windowless widgets are relatively small and lightweight;
    GtkLabel is the most common example. Because events are always received on a GdkWindow,
    windowless widgets do not receive events. (The Gtk. container can be used if you
    need to capture events


    # GdkWindow Attributes


    gdk_window_new() (shown in Figure 10-1) allows you to specify any of a window''s
    attributes when you create it; many of them can be changed later as. To specify'
