  md: '# Chapter 10. GDK Basics


    The subwindow_mode of the GC only matters if the drawable is a window. The default
    setting is GDK_CLIP_BY_CHILDREN; this means child windows are not affected by
    parent windows. This preserves the illusion that child windows are ''on top''
    of parents, and child windows are opaque. GDK_INCLUDE_INFERIORS draw right over
    the top of any child windows, overwriting any graphics that child windows may
    contain; normally this mode is not used. If you use GDK_INCLUDE_INFERIOR, you
    will probably use GDK_XOR as your drawing function, which allows you to restore
    the child window''s previous contents.


    graphics_exposure is a boolean value which defaults to TRUE; otherwise it generates
    expose events, the section Events explains this in more detail.


    The final GC values determine how lines are drawn. These values are used for drawing
    lines, connecting the borders of unfilled polygons and arcs. The line_width field
    specifies the width of a line, in pixels. A line_width of 0 specifies a ''thin
    line''; then lines are one-pixel lines that can be drawn quickly (usually with
    hardware acceleration), the exact pixels depend down on the X server in use. For
    consistent results, use a width of 1.


    The line_style field can have one of three:


    +   - GDK_LINE_SOLID is the default.

    - GDK_LINE_ON_OFF_DASH draws a dashed line with the foreground color, leaving
    the ''off'' parts of the dash

    - GDK_LINE_DOUBLE_DASH draws a dashed line in the foreground color, but the ''off''
    parts of the dash are drawn in the background color.


    Dashes are specified with gdk_gc_set_dashes (); GdkGc does not include a dash
    for this field. gdk_gc_set_dashes() accepts three arguments:


    +   - dash, is an array of dash lengths. Even-indexed lengths are ''on'' dashes;
    these are drawn in the foreground color. Odd-indexed lengths are ''off'' dashes;
    they are not drawn or in the background color, depending on line_style. 0 is not
    a permitted value; all lengths must be positive.

    - dash_offset is the index of the first pixel to use in the dash list. That is,
    the list specifies 5 pixels ''on'' and 5 ''off'', and the offset is 3, the line
    will begin in the middle of the ''off'' dash.

    - n is simply the number of elements in dash_list.


    You might set a dash pattern for this example:


    ```

    gchar dash_list[] = { 5, 5, 3, 3, 1, 3, 3 };ngdk_gc_set_dashes(gc, 0, dash_list,
    sizeof(dash_list));

    ```


    The default dash is [4, 4] with an offset of 0.


