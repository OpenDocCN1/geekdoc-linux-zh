    re-adding the widget to some other container, for example)


    It''s worth pointing out that removing widgets from containers is uncommon; in
    general it''s faster to hide the widget with `gtk_widget_hide()`, then `gtk_widget_show()`
    it at later time.


    gtk_object_sink() is used almost exclusively in widget implementations, when you
