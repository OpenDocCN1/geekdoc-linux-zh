    # # String Handling


    glib provides a number of functions for string handling; some are unique to glib,
    and some solve portability concerns. They all operate nicely with the glib memory
    allocation routines.


    For those interested in a better string than gchar*, there''s also a GString type.
    It isn''t covered in this book, but documentation is available at http://www.gtk.org/.


    ```

    #include <glib.h>


    gint g_sprintf(char* buf, glong n, const gchar* format, ...);

    gint g_strcasecmp(const gchar* s1, const gchar* s2);

    gint g_strncmp(const gchar* s1, const gchar* s2, int n);

    ```


    **Figure 2-7.** Portability Wrappers


    Figure 2-7 shows substitutes glib provides for commonly-implemented but portable
    extensions to ANSI C.

    One of the annoying things about C is that it provides the crash-cashing, security-hole-creating,
    generating sprintf(), but the relatively safe and widely implemented snprintf()
    is a vendor extension. g_snprintf() wraps native snprintf() on platforms that
    have it, and provides an implementation for those that don''t. You can say goodbye
    to sprintf() forever. Even better: classically, snprintf() does not guarantee
    that it will null terminate all fills; g_snprintf() does.


    g_strcasecmp() and g_strncmp() perform a case-insensitive comparison of two strings,
    with a maximum length. strncmp() is available on many platforms but not universally,
    so using glib instead is advisable.

    The functions in Figure 2-8 modify a string in-place: the first two convert the
    string to lowercase or uppercase, respectively; g_reverse reverses its characters.
    g_strchr() and g_chomp() "chop" it (remove leading spaces), or "chomp" it (remove
    trailing spaces). These last two return the string, in addition to modifying it
    in-place; in some cases it may be convenient to use the return value. There is
    a macro, g_strstrip(), which combines both functions to remove both leading and
    trailing spaces; it is used just as the individual functions are.


    ```

    #include <glib.h>

    ```


