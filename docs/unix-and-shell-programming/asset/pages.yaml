  md: "# Unix SHELL PROGRAMMING\n\nARGC is the number of command-line arguments present.\
    \ Unlike most awk arrays, ARGV is indexed from zero to ARGC-1. For example:\n\n\
    ```\n$ awk 'BEGIN {\n  for (i = 0; i < ARGC; i++)\n    print ARGV[i]\n  }' inventory-shipped\
    \ BBS-list\n| awk\n  | inventory-shipped\n  | BBS-list\n```\n\nIn this example,\
    \ ARGV[0] contains \"awk\", ARGV[1] contains \"inventory-shipped\", and ARGV[2]\
    \ contains \"BBS-list\". The value of ARGC is three, one more than the index of\
    \ the last element in ARGV, since the elements are numbered from zero.\n\nThe\
    \ following fragment processes ARGV in order to examine, and then remove, command\
    \ line options:\n\n```\nBEGIN {\n  for (i = 1; i < ARGC; i++) {\n    if (ARGV[i]\
