  md: '# 3.2.1 File Table


    The file table is a global Kernel structure.


    # User File Descriptor Table


    Its allocated per process and identifies all open file for a process.


    When a process open or creates a file, the Kernel allocates an entry from each
    table, corresponding to the file inode. Entries in these three structure maintain
    the state of the file and the user access to it. The file table keeps track of
    the offset of the byte in the file where the users next read or write will start
    the access rights allowed to the opening process.


    For example, if a process calls.


    ```

    open("/dev/anoop/fl.C", 1);

    ```


    The Kernel retrieves the inode for "/dev/anoop/fl.C". Then file table contains
    the entries for this file. user file descriptor table contains a number which
    is an integer type file descriptor.


    The Kernel returns a file descriptor for open (), and create system call which
    is an index into the user file descriptor table. And this file descriptor is created
    by the system call as read(), write ( ) etc.


    # 3.3 PROCESS


    A process is a program in execution and consists of a pattern of bytes that the
    CPU interprets as m/c instruction (called "text"), "data" and "stack". Many process
    appears to execute simultaneously as the Kernel schedules them for execution and
    several processes may be of one process. A process executes by following strict
    sequence of instruction that is self contained and does not jump to another process,
    it reads and writes its data and stack sections, but it can''t read the stack
    and data sections of other processes. Processes communicate with other processes
    via system calls.


    A process on UNIX is the entity that is created by "fork" system call. Every process
    except O (sched) is created when other processes invokes the "fork" system call.
    The process that invokes the "fork" system call is called parent process and newly
    created process is called child process. The Kernel identifies each process by
    its process number PID.


    A user compile the source code of program to create an executable file which consist
    of several parts:


    +   (i) A set of "headers" that describes the attributes of the file.

    (ii) The program text.

    (iii) A m/c language representation of data that has indication of how much space
    the Kernel should allocate for uninitialized data, called brs (Kernel initialize
    it to O at run time).

    (iv) Other section as symbol table information. bss (block started by symbol)
    comes from an assembly pseudo operator on IBM 7090 m/c.


