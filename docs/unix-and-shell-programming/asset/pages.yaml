    # 6.2 ALLOCATION OF DISK BLOCK


    When a process writes data to a file, the Kernel must allocate disk blocks from
    the file system for direct data blocks and sometimes for indirect data blocks.
    The file system block contains an array that is used to count the numbers of free
    disk blocks in the file system. The utility mkfs organizes the data blocks of
    a file system in a linked list, where each link of the list is a disk block that
    contains an array of free block numbers and one array entry is the number of the
    block of the linked list.


    When the Kernel wants to allocate a block from a file, it allocates the next available
    block in the super block. Once allocated, the block cannot reallocate until it
    becomes free. If the allocated block is the last available block in the super
    cache, the Kernel treats it as a pointer to a block that contains a list of free
    blocks. It reads the block, populate the super block array with the new list of
    block numbers and proceeds to use the original block number. It allocates a buffer
    for the block and clears the buffers zero. The disk block has now been assigned
    and the Kernel has a buffer to work with. If the file system contains no blocks
    the calling process receives an error


    If a process writes a lot of data to a file, repeatedly, the system for to store
    the data, but the Kernel assigns only one block at a time. The program mkfs tries
    to organize the original linked list of free block numbers so that block dispensed
    to a file are near each other. This performance because reduces disk seek time
    and latency when a process reads a file sequentially as given in Figure 6.5.'
