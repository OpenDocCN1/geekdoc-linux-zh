  md: '# 23.24.6 Structure of Linux Operating System


    The Linux Operating System is divided into three major components—the Kernel,
    the Shell and Utilities Application Programs.


    +   - The-Kernel

    This is the heart of the Linux Operating System. It performs the tasks that create
    and maintain the Linux environment. It keeps track of the disks, tapes, printers,
    terminals, communication lines and any other devices attached to the computer.
    It also interfaces between the computer''s hardware and the users.


    +   - The-Shell

    This is a program that interfaces between the user and the Linux Operating System.
    It listens to the user''s terminal and translates the actions requested by the
    user. There are a number of different Shells that may be used. See section on
    The Shell.


    +   - Utilities and Application Programs

    Utilities are the Linux Commands. Application Programs, such as Word Processors,
    Spreadsheets and Database Management Systems, may be installed alongside the Linux
    Commands. A user may run a utility or application through the shell.


    # The-Shell


    The-Shell is a program that provides an interpreter and interface between the
    user and the Linux Operating System. It executes commands that are read either
    from a terminal or from a file Files containing commands may be created, allowing
    users to build their own commands. In this manner, users may tailor Shell to their
    individual requirements and style.


    There are a number of different shells. Each provides a slightly different interface
    between the user and the Linux Operating System. The most important shells that
    originated from the Unix operating system:


    There are other shells that are less widely used and not available on many machines.
    For example, there is the Restricted Shell-sh. This restricts the area of memory
    the user may access to or her own directory, limiting access to all other users''
    shells.


    All of these shell interfaces are available to Linux. However, there are other
    shells that have been developed, most generally for Linux: ash, tsch and tsh are
    available on most versions of Linux. The most widely used, originally Linux-based
    shell is the Bourne-Agal shell (bash). Based on the original Bourne shell, it
    has similar extensions as the Korn shell, plus its own extensions.


    Linux also offers a windows-based shell interface, commonly known as X-Windows
    or simply as X. More akin to the Mackintosh windows than Microsoft windows, it
    is another method of interfacing with the Linux kernel. However, X-Windows interfaces
    are not considered for this course.


    A command issued by user may be run in the present shell, or the shell itself
    may start another copy of itself in which to run that command. In this way, a
    user may run several commands at the same time. A secondary shell is called a
    sub-shell.'
