  md: "# UNIX AND SHELL PROGRAMMING\n\n# 11.2 PROBLEM WITH MULTIPROCESSOR SYSTEM\n\
    \n```\nstruct queue {\n  * bp, * bpl;\nbpl -- torp = bp -- torp\nbpl -- backup\
    \ = bp;\nbp -- torp = bpl;\n  /* consider a context switch here */\nbpl -- torp\
    \ balkp = bpl:\n```\n\nThe Kernel cannot prevent a process and switch context\
    \ to another process while executing in Kernel mode, and it masks interrupts when\
    \ executing a critical region of code if an interrupt handler could corrupt Kernel\
    \ data structures. On a multiprocessor, however, if two or more process execute\
    \ simultaneously on separate processor, the Kernel could become corrupt in spite\
    \ of the protective measures that suffice for uniprocessor systems.\n\nThe Kernel\
    \ must make sure that such corruption can never occur.\n\nThere are three methods\
    \ for preventing such corruption:\n\n+   I. Execute all critical activity on one\
    \ processor, relying on standard uniprocessor methods for preventing corruption.\n\
    II. Serialize access to critical regions of code with locking primitives.\nIII.\
    \ Redesign algorithms to avoid contention for data structures.\n\n# 11.3 SOLUTION\
    \ WITH MASTER SLAVE PROCESSORS\n\nMaster processor can execute in Kernel mode\
    \ and slave executors only in user mode. The master processor is responsible for\
    \ handling all system calls and interrupt. Slave processors execute in user mode\
    \ and inform the master processor when a process makes a system call. /* System\
    \ with one master and several slave */\n\nThe scheduler algorithm decides which\
    \ processor should execute a process. When a process on a slave processor executes\
    \ a system call, the slave kernel keeps the PID field in the process table, indicating\
    \ that the process should run only on the master processor, and does a context\
    \ switch to schedule other processes. The master Kernel schedules, the process\
    \ of highest priority must run on the master processor and executes it. When it\
    \ finishes the system call, it sets the processor field of the slave, allowing\
    \ the process to run on slave processors.\n\nIf processes must run on the master\
    \ processor it is preferable that the master processor right away and not keep\
    \ waiting. If the master processor was executing a process in user mode when a\
    \ slave processor requested service for a system call, the master process would\
    \ continue executing until the next context switch. The master processor responds\
    \ more quickly if the slave processor sets a global flag that the master processor\
    \ checked in the clock interrupt handler, the master processor would do a context\
    \ switch at most one clock tick. Alternatively the slave processor could interrupt\
    \ the master processor and force it to do a context switch immediately but this\
    \ assumes h/w capability.\n\nThe clock interrupt handler on a slave processor\
    \ makes that processes are periodically rescheduled so that no process monopolizes\
    \ the processor. A side from the clock handler"
