  md: '# Portability


    It can be ported to almost any computer system with only the bare minimum of adaptations
    to suit the given computer architecture.


    # 1.4 HIERARCHICAL STRUCTURE OF UNIX O.S.


    # TREE STRUCTURE OF UNIX O.S.


    +   (i) / This is the root directory of file system. The main memory of entire
    file system and HOME directory for super user.


    +   (ii) /sbin - This contains programs used in booting the system and in recovery.


    +   (iii) /bin - This is used to hold useful utilities programs.


    +   (iv) /dev - This contains special device files that includes terminals, printers
    and storage device. Files contains device number that identify device to the O.S.


    +   (v) /etc - This contains system administrators and configuration database.


    +   (vi) /HOME - This contains home directory and files of all users, if your
    login is “Anoop” your default HOME directory is/home/Anoop.


    +   (vii) /tmp - This contains all temporary files used by UNIX system.


    +   (viii) /var - This contains the directory of all files that vary among system.
    Files in this directory includes.


    +   /var/admin - Contains system logging and accounting files.

    /var/mail - Contains user mail files.

    /var/news - Contains message of common interest.

    /var/temp - Is a directory for temporary files.

    /var/UUCP - Contains log and status files for UUCP system.


    +   (ix) /mnt - Contains entries for removable (mountable) media as CD-ROM, DLT
    tapes.

    (x) /proc - Contains process used in system.

    (xi) /usr - This contains other directory such as /usr/bin/usr/lib.

    /usr/bin - Contains many executable program and unix system utilities.

    /usr/sbin - Contains executable program for S.A.

    /usr/games - Contains Binaries for games programmes and data for games

    /usr/lib - Libraries for programs and programming language.'
  merge: -1
