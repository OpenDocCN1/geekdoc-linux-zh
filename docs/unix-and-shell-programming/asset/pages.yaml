  md: '# UNIX SHELL PROGRAMMING


    To solve problem, the system could prevent all interrupts while executing in Kernel
    mode, but that would delay servicing of the interrupt. Instead the Kernel raises
    the processor execution level to prevent interrupts when entering critical regions
    of code. A section of code is critical if execution of arbitrary handlers could
    result in consistency problems.


    The Kernel protects its consistency by allowing a context switch only when a process
    puts itself to sleep and by preventing one process from changing the state of
    another process. It also raises the processor execution level around critical
    regions of code to prevent interrupts that could otherwise cause inconsistency.


    # 3.5 SLEEP AND WAKEUP


    Processes go to sleep because they are awaiting the occured of event such as waiting
    for I/O completion from a peripheral device to exit, waiting for system resources
    to become available and soon. Processes are said to be sleep on an event that
    they are in the sleep state until the event occurs, at which time wakeup and enter
    the state ready to run. Many processes can simultaneously sleep on an event; when
    an event occurs, all processes sleeping on the event because the even condition
    no longer true. When a process wakeup, it follows the state transition from the
    “sleep” state to the “ready-to-run” state where its is eligible for later scheduling;
    it does not execute immediately. Sleeping process do not consume CPU resources.
    The Kernel does not constantly check to see that a-process is still sleeping but
    waits for the event to occur and awaken the then.


