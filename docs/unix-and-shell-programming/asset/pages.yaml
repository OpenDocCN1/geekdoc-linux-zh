  md: "# 13.20 FILE INPUT\n\nVariables which represent files are called \"file handles\"\
    , and are handled differently from other variables. They do not begin with any\
    \ special character—they are plain words. By convention, file handles are written\
    \ in upper case, like FILE_OUT or SOCK. The file handles are all in a global namespace,\
    \ so you cannot allocate them like other variables. File handles can be passed\
    \ from one to another like strings (detailed below).\n\nThe standard file handles\
    \ STDIN, STDOUT, and STDERR are automatically opened before the program runs.\
    \ Surrounding a file handle with <> is an expression that returns one line from\
    \ the file including \"\\n\" character, so <STDIN> returns one line from standard\
    \ input. The <> operator returns undef when there is no input. The \"chop\" operator\
    \ removes the last character from a string, so it can be used just after an input\
    \ operation to remove the trailing \"\\n\". The \"chop\" operator is similar,\
    \ but only removes the character if it is the end-of-line.\n\n```\n$line = <STDIN>;\
    \      ## read one line from the STDIN file handle\nchop($line);             \
    \  ## remove the trailing \\\n\" if present\n$line2 = <FILE2>;          ## read\
    \ one line from the FILE2 file handle\n                            ## which must\
    \ have been opened previously\n```\n\nSince the input operator returns undef at\
    \ the end of the file, the standard pattern to read all lines in a file is ...\n\
    \n```\n## read every line of a file\nwhile ($line = <STDIN>) {\n## do something\
    \ with $line\n}\n```\n\n# 13.20.1 Open and Close\n\nThe \"open\" and \"close\"\
    \ operators operate as in C to connect a file handle to a filename in the file\
    \ system.\n\n```\nopen(F1, \"filename\");      ## open \"filename\" for reading\
    \ as file handle F1\nopen(F2, \">filename\");       ## open \"filename\" for writing\
    \ as file handle F2\nopen(F3, \"\\>>appendtime\"); ## open for appending\nclose(F1);\
    \                   ## close a file handle\n```\n\nOpen can also be used to establish\
    \ a reading or writing connection to a separate process launched by the OS. This\
    \ works on Unix.\n\n```\nopen(F4, \"is -1 | \");      ## open a pipe to read from\
    \ an ls process\nopen(F5, \"| mail \\$addr\");   ## open a pipe to write to a\
    \ mail process\n```\n\nPassing commands to the shell to launch an OS process in\
    \ this way can be very convenient, but it's also a famous source of security problems\
    \ in CGI programs. When writing a string from the client side as a filename in\
    \ a call to open()."
