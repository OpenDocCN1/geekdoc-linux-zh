  md: '# 13.24.1 The Origins of Linux


    Linux traces its ancestry back to a mainframe operating system as Multics (Multiplexed
    Information and Computing Service). Begun in 1965, Multics was one of the first
    multli-user computer systems and remains in use until today. Bell Telephone Labs
    participated in the development of Multics, along with the Massachusetts Institute
    of Technology and General Electric.


    Two Bell software engineers, Ken Thompson and Dennis Richie, worked on Multics
    until Bell Labs withdrew from the project in 1969. One of their favorite pastimes
    had been playing a multi-user game called Space Travel. Now, without access to
    a Multics computer, they found themselves unable to indulge their fantasies of
    flying around the galaxy. Resolved to remedy, they decided to port the Space Travel
    game to run on an unused PDP-7 computer. Eventually, they implemented a rudimentary
    operating system that named Unics, as a pun on Multics. Somehow, the spelling
    of the name became Unix.


    # 13.24.2 The X Window System


    Another component of Linux is its graphical user interface, the X Window System.
    Unix was originally a mouseless, text-based system that used typewriter machines
    rather than modern CRT monitors. The Unix command interface is very sophisticated
    and, even today, power users prefer it to a point-and-click graphical environment,
    using their CRT monitor as though it were a noiseless telephone. Consequently,
    some unaware that Unix long ago outgrew its text-based childhood, and now provides
    users a choice of graphical or command interfaces.


    The X Window System (or simply X) was developed as part of the Massachusetts Institute
    of Technology''s (MIT) Project Athena, which it began in 1984. By 1988, MIT released
    X to the X Consortium, which released version 6 in September 1995.


    X is a unique graphical interface in two major respects. First, X integrates with
    a computer network, letting users access local and remote applications. For example,
    X lets you open a window that represents an application running on a remote server:
    the remote server does the heavy-duty computing; all your computer need to do
    is pass the server input and display the server''s output.


    Second, X lets you configure its look and feel to an amazing degree. To do so,
    you run a special application—called a window manager—on top of X. A variety of
    window managers is available, including some that closely mimic the look and feel
    of Microsoft Windows.


    # 13.24.3 Linux Distributions (Various Flavours of Linux.)


    Because Linux can be freely redistributed, you can obtain it in a variety of ways.
    In the Linux community, different organizations have combined the available components
    differently. Each combination is called a “distribution”, and the organizations
    that develop distributions are called “distributors”. Various individuals and
    organizations package Linux, often combining it with free proprietary applications.
    The flavor''s of Linux are:


    +   (i) Caldera OpenLinux

    (ii) Red Hat Linux'
