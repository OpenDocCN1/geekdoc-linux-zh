    a pointer to a data array whose size must be at least as the size of a disk block
    and a status field that summarizes the current status of the buffer.


    The data in a buffer corresponds to the data in a logical disk block on a file
    system and the Kernel identifies the buffer contents by examining identifiers
    in the buffer header.


    The buffer is the in-memory copy of the disk-block; the contents of the disk block
    map into the buffers but the mapping is temporary until the Kernel decides to
    map another disk block into'
