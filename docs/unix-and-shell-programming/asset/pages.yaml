    awakens them and return from their read without reading any data. If the count
    of reader processes drops to O and there are processes waiting to write data to
    the pipe, the Kernel awakens them and send them a signal to indicate an error
    condition.


    In both cases, it makes no sense to allow the processes to continue sleeping when
    there is no hope that the state of the pipe will ever change.


