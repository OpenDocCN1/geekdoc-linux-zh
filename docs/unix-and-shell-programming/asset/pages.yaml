  md: '# PREFACE


    The UNIX system was first described in a 1974 paper in the Communication of the
    ACM By Ken Thompson and Dennis Ritchie. Since that time, it has become increasingly
    widespread and popular throughout the computer industry where more and more vendors
    are offering support for it on their machines. It is especially popular in universities
    where its frequently used for operating systems research and case studies.


    This book describes the internal algorithm and structures that form the basis
    of the operating system and their relationship to the programmer interface. This
    book also cover the topic Shell Programming, AWK, SED and PERL. It is thus applicable
    to several environments.


    First it can be used as a text book for an operating system course. Second, system
    programmers can use the book as a reference to gain better understanding of how
    the kernel works and to compare algorithms used in the UNIX system to algorithms
    used in other operating systems. Finally Application Programmer can use the book
    to implement Shell Script, Programming with awk, Programming with perl and Programming
    with sed.


    Many exercise originally prepared for the course have been included at the end
    of the book, and they are a key part of the book. Some exercises are straightforward,
    designed to illustrate concepts brought out in the text.


    The book not only covers the entire scope of the subject but explain the philosophy
    of the subject. This makes the understanding of this subject more clear and makes
    it more interesting. The book will be very useful not only to the students but
    also to the subject teachers. The students have to omit nothing and possibly have
    to cover nothing more.


    —Authors'
  merge: -1
