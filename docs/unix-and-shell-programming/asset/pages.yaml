  md: '# UNIX AND SHELL PROGRAMMING


    ![](img/3e60d797e15e867a6d5f9f3c8d5cf7c0_16_0.png)


    Fig. 2.3 Block diagram of system kernel


    # Trap


    A trap (or exception) is a S.W. generated interrupt caused either by an error
    (for example, division by zero or invalid memory access) or by a specific request
    from a user program that an 0.5 service may be performed.


    # File Subsystem


    The file subsystem manages files, allocating file space administering free space
    controlling access to files and retrieving data for users. Process interact with
    the file subsystem via a specific set of system calls such as open, read, write,
    shown, stat, chmod etc.


    # 2.3.2 Buffer


    The file subsystem accesses data using a buffering mechanism that regulates data
    flow b/w the Kernel and secondary storage devices. The buffering mechanism interacts
    with block I/O devices to initiate data transfer to and from Kernel Block I/O
    device are access storage device to the rest of the system. It also interacts
    directly with raw I/O devices (character device that are not block device) without
    the intervention of buffering mechanism.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 2.3.3 Device Drivers


    Device drivers are the Kernel modules that control the operation of peripheral
    devices I/O device drivers make them appear to be random access storage device
    to the rest of system. A tape driver may allow the Kernel to create a tape unit
    as a random access storage device.


    # 2.3.4 Process Control Subsystem


    The file subsystem and process control subsystem interact when loading a file
    into memory execution. Its responsible for:


    +   (i) Memory Management—This module control the allocation of memory. If at
    any time the system does not have enough physical memory for all process, the
    Kernel moves b/w main memory and secondary memory so that all process get a fair
    choice to execute two policies for managing memory swapping and demand paging.


    +   (ii) Scheduler—This modules allocates the CPU to processes. It schedules them
    to run in turn until they voluntarily relinquish the CPU while awaiting are or
    until the Kernel prompts them when their recent run time exceeds a time quantum.


    +   (iii) Interprocess Communication—This mechanism allow arbitrary-processes
    to exchange of data and synchronize execution. There are several form of TPC,
    pipes, signals, messages semaphore.


    # 2.3.5 H/W Control


    This is responsible for handling interrupts and for communicating with m/c. Devices
    as disks or terminals may interrupt the CPU while a process is executing.'
  merge: -1
