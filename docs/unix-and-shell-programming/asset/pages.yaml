    As illustrated in figure. Suppose a lock is free and two processes on two processors
    simultaneously attempt to test and set it. They find that the lock is free at
    time t, set it, enter the critical region, and may corrupt kernel data structures.
    To prevent this situation the locking primitives must be atomic i.e. the actions
    of testing the status of the lock and setting the lock must be done as a single,
    indivisible operation, such that only one process can manipulate that lock at
    a time.


    # 11.41 Definition of Semaphores


    A semaphore is an integer object manipulated by the kernel that has the following
    atomic operations defined for it:


    +   (i) Initialization of the semaphore to a nonnegative value.


    +   (ii) A P operation that decrement the value of the semaphore. If the value
    of the semaphore is less than 0 after decrementing its value the process that
    did the P goes to sleep.


    +   (iii) A V operation that increment the value of the semaphore. If the value
    of the semaphore becomes greater than or equal to 0 as a result, one process that
    had been sleeping as the result of a P operation wakes up.


    +   (iv) A conditional P operation, abbreviated CP, that decrement the value of
    the semaphore and return an indication of true if its value is greater than 0.
    If the value of the semaphore is less than or equal to the value of the semaphore
    is unchanged and the return value is false.


    As illustrated in Figure 11.4. Suppose a lock is free and two processes on two
    processors simultaneously attempt to test and set it. They find that the lock
    is free at time t, set it, enter the critical region and may corrupt kernel data
    structures. To prevent this situation the locking primitives must be atomic i.e.,
    the actions of testing the status of the lock and setting the lock must be done
    as a single, indivisible operation, such that only one process can manipulate
    the lock at a time.'
