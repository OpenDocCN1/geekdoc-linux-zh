- img_proc: true
  md: '(iv) Process identifiers (PID) specifies the relationship of processes to each
    other.


    (v) The process table entry contains an event descriptor when the process is in
    the “sleep” state.


    (vi) Scheduling parameters allow the Kernel to determine the order in which processes
    move to the states “Kernel running” and “User Running”.


    (vii) A signal field enumerates the signals sent to a process but not handled.


    (viii) Various items gives process execution time and Kernel resource utilization,
    used for process accounting and for the calculation of process scheduling priority.
    One field is a user-timer used to send an alert signal to a process.


    # 8.2.2 u-Area


    The u-area contains fields that need to be accessible only to the running process.
    Therefore, the Kernel allocates space for u-area only when creating a process.
    It does not need u-areas for process table entries that do not have process. The
    fields in u-area are:


    +   (i) A pointer to the process table identifies the entry that corresponds to
    u-area.


    +   (ii) The real and effective user—ID determine various privileges allowed the
    process such as access rights.


    +   (iii) Timer fields record the time spent executing in user mode and in Kernel
    mode.


    +   An array indicates how the process wishes to react to signals.


    +   (v) The control terminal field identifies the “login terminal” associated
    with process if exists.


    +   (vi) An error field records error encountered during a system call.


    +   (vii) A return value field contains result of system calls.


    +   (viii) I/O parameters describe the amount of data to transfer, the address
    of the source (target) data array in user space, offset for I/O and so on.


    +   (ix) The current directory and root root describe file system environment
    of the process.


    +   (x) The user-file-descriptor table record the file process has.


    +   (xi) Limit field restrict the size of a process and the size of a file it
    can write.


    +   (xii) A permission mode mask sets setting on files process creates.


    # 8.3 LAYOUT OF SYSTEM MEMORY


    A process on UNIX system consists of three logical sections: text, data and stack.


    The text section contains the set of instructions the machine executes for the
    process; address in the text section includes address (for branch instructions
    or subroutine calls), data addresses (for access to global data variables), or
    stack address (for access to data structures to a subroutine).


    If the m/c were to treat the generated addresses as locations in physical memory
    it would be impossible for processes to execute concurrently. If their set of
    generated addresses overlapped, the compiler could generate addresses that do
    not overlap programs, but such a procedure impractical for general purpose computers
    because the amount of memory on a m/c is finite and the set of all programs that
    could be compiled is finite.'
