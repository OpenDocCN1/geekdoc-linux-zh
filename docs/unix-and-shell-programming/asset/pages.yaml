  md: '# UNIX AND SHELL PROGRAMMING


    Host M/C also known as server or a console. The number of terminal connected to
    the Host M/C depends on the number of ports that are present in its controller
    card. There are several type of terminal that can be attached to host M/C.


    +   (i) Dumb Terminal—These terminal consists of a keyboard and a display unit
    with no memory or disk of its own. These can never act as independent terminal.


    +   (ii) Terminal Emulation—A PC has its own microprocessor, memory and disk driver.
    By attaching this to host M/C through a cable and running a S/W from this PC.
    We can emulate it as if it is a dumb terminal. At such times the memory and disk
    are not in use and the PC can''t carry out any processing its. The S/W that makes
    the PC work like a dumb terminal is called emulation S/W. VTERM and XTALK are
    two such popular S/W.


    +   (iii) Dial-In-Terminal—These terminal used telephones lines to connect with
    host M/C. To communicate over telephone lines we attach a modem.


    ![](img/3e60d797e15e867a6d5f9f3c8d5cf7c0_10_0.png)


    Fig. 1.3


    # 2. Multitasking Capabilities


    Its capable of carrying out that a single user can run more one job at the same
    time. In UNIX this is done by running one job normally and other job in background.
    This is managed by dividing the CPU time b/w all processes.


    “The multitasking provide by MS-DOS is known as serial multitasking”.


    # 3. Communication


    The communication may be within the n/w of a single main computer or between two
    or more such computer n/w. The users can easily exchange mail, data, programs
    through such n/w. Distance poses no barrier to passing information or message
    to and from.


    # 4. Security


    UNIX has three inherent prevision for protecting data.


    +   (i) By assigning passwords and login names to individual users ensuring that
    not any-body can come and have access to your work.


    +   (ii) At the file level they are read, write, and execute permissions to each
    file decide who can access a particular file.


    +   (iii) File encryption.'
  merge: -1
