  md: '# 13.8.1 Built-in Variables that Control awk


    This is an alphabetical list of the variables which you can change to control
    how awk does

    certain things.


    CONVMT


    This string controls conversion of nstring to strings. It works by being passed,

    effect, as the first argument to the sprintf function. Its default value is "%6g".


    FS


    OFTMT


    This string controls conversion of numbers to strings for printing with the print

    statement. It works by being passed, in effect, as the first argument to the sprintf

    function. Its default value is "%6g".


    OFS


    This is the output field separator. It is output between the fields output by
    a print

    statement. Its default value is "", a string consisting of a single space.


    ORS


    This is the output record separator. It is output at the end of every print statement.

    Its default value is "\n".


    RS


    This is awk''s input record separator. Its default value is a string containing
    a single

    newline character, which means an input record consists of a single line of text.

    It can also be the null string, in which case records are separated by runs of
    blank lines,

    or or a regexp, in which case records are matched by the regexp in the input

    text.


    SUBSEP


    SUBSEP is the subscript separator. It has the default value of "\034"


    # 13.8.2 Built-in Variables that Convey Information


    This is an alphabetical list of the variables that are set automatically by awk
    on certain

    occasions in order to provide information to your program.


    ARGC


    ARGV


    The command-line arguments available to awk programs are stored in an array called
    ARGV.'
