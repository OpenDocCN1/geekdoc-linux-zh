  md: '# UNIX AND SHELL PROGRAMMING


    ```

    $string ~ /pattern/ ## true if the pattern is found somewhere in the string

    ("binky" ~ /ink/) == TRUE

    ("binky" ~ /onk/) == FALSE

    ```


    In the simplest case, the exact characters in the regular expression pattern must
    occur in the string. All of the characters in the pattern must be matched, but
    the pattern does not need to be at the start or end of the string, and the pattern
    does not need to use all the characters in the string.


    # 13.21.1 Character Codes


    The power of regular expressions is that they can specify patterns, not just fixed
    characters. First, there are special characters ...


    +   * a, X, 9—ordinary characters match that character exactly

    * (a period)—matches any character except "\n"

    * \w-(lowercase w) matches a "word" character: a letter or digit [a-zA-Z0-9]

    * \W-(uppercase W) any non word character

    * \s-(lowercase s) matches any single whitespace character — space, newline, tab,
    form [\n\r\t]

    * \S-(uppercase S) any non whitespace character

    * \t, \n, \r -- tab, newline

    * \d—decimal digit [0-9]

    * \ —inhibit the "specialness" of a character. So, for example, \. to match a
    period or \ to match a slash. If you are unsure if a character has special meaning,
    using \@, you can always put a slash in front of it \@ to make sure it is treated
    as a character.


    ```

    "piig" ~ /p.../ == TRUE any character (except \n)

    "piig" ~ /p.../ == TRUE need not use the whole string

    "piig" ~ /p...g/ == FALSE must use the whole pattern (the g is not matched)

    "piig" ~ /p\w\wg/ == TRUE \w is any letter or digit

    "pl23g" ~ /p\d\dg/ == TRUE \d = 0..9 digit

    "Piigq" ~ /Piig/i == FALSE

    "Piigq" ~ /Piig/i == TRUE

    ```


    The modifier "/ after the last / means the match should be insensitive


    String interpolation works in regular expression patterns. The variable like *
    and + continue to have their special meanings in the pattern after interpolation,
    unless the pattern is bracketed with a \Q.\E. The following examples test if the
    pattern in $target occurs within brackets < > in $string ...'
