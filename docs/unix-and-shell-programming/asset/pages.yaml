  md: "# UNIX AND SHELL PROGRAMMING\n\n# 13.9.1 Using getline with No Arguments\n\n\
    The getline command can be used without arguments to read input from the current\
    \ input file. All it does in this case is to read the next input and split it\
    \ into fields. This is useful if you've finished processing the current record,\
    \ but you want to do some special processing right on the next record. Here's\
    \ an example:\n\n```\nawk '\n  if ((t = index($0, \"/**\")) != 0) {\n    # value\
    \ will be \"\" if t is 1\n    tmp = substr($0, 1, t - 1)\n    u = index(substr($0,\
    \ t + 2), \"/*\")\n    while (u <= 0) {\n      m = \"unexpected EOF or error\"\
    \n      m = (m \":\" ERRNO)\n      print m > \"/dev/stderr\"\n      exit\n   \
    \ }\n    t = -1\n    u = index($0, \"/*\")\n    # substr expression will be \"\
    \" if /* * */\n    # occurred at end of line\n    $0 = tmp substr($0, t + u +\
    \ 3)\n    print $0\n  }\n'\n```\n\nThis program deletes all C-style comments,\
    \ `/* ... **/`, from the input. By replacing `print $0` with other statements,\
    \ you could perform more complicated processing on the uncommented input. This\
    \ program has a subtle problem—it does not work if one comment ends and another\
    \ begins on the same line.\n\n# 13.9.2 Using getline Into a Variable\n\nYou can\
    \ use `getline var` to read the next record from `awk`'s input into the variable\
    \ `var`. No other processing is done.\n\nFor example, suppose the next line is\
    \ a comment, or a special `string`, and you want to read it, without triggering\
    \ any rules. This form of `getline` allows you to read that line and store it\
    \ in a variable so that the main read-a-line-and-check-each-rule loop of `awk`\
    \ never sees it."
