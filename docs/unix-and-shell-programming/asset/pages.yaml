  md: '# ADVANTAGE OF DISK BUFFER


    +   1. System design is simpler. The use of buffers allows uniform disk access
    because the Kernel does not need to know the reason for the I/O. Instead it copies
    data to from buffers regardless of whether the data is part of a file, an inode
    or a super block. The buffering of disk I/O makes the code more modular, the parts
    of the Kernel that do the I/O with the disk have one interface for all purposes.


    +   2. The system places no alignment restrictions on user processes doing I/O,
    because the Kernel aligns data internally. H/W implementations frequently require
    a particular alignment of data for disk I/O such as aligning the data on two byte
    boundary or on a four-boundary in memory. Without a buffer mechanism, programmers
    would have to make sure that their data buffers were correctly aligned.


    Many programmers error would result and programs would not be portable to UNIX
    systems running on machines with alignment properties. By copying data from user
    to system (or vice versa) buffers, the Kernel eliminates the need for special
    alignment of user buffers, making user program simpler and more portable.


    +   3. Use of buffer cache can reduce the amount of disk traffic, thereby increasing
    overall system through put and reducing response time.


    Process reading from the file system may find data blocks in the cache and avoid
    the need for disk I/O. The Kernel frequently user “delayed write” to avoid unnecessary
    disk writes, leaving the block in the buffer cache and for a cache hit without
    the block.


    +   4. The buffer algorithms ensure file system integrity because they maintain
    a common single image of disk blocks contained in the cache.


    If two processes simultaneously attempt to manipulate one disk block, the buffer
    algorithm serialize their access preventing data corruption.


    # Disadvantage of Buffer Cache


    +   1. Since the Kernel does not immediately write data to the disk for a “delayed
    write” the system is vulnerable to crashes which leave disk data in an incorrect
    manner.


    Although recent system implementations have reduced the damage caused by catastrophic
    events, the basic problem remains. A user issuing a system call is never sure
    when the data finally makes its way to disk.


    +   2. Use of buffer cache requires an extra copy when reading and writing to
    from user processes.


    When transmitting large amounts of data the extra copy shows down-performance.


    +   3. Obviously, the chances of cache hit are greater for systems with many buffers.
    However, the number of buffers a system can performably configure is constrained
    by the amount of memory that should be kept available for executing processes;
    if too much memory is used for buffers the system may slow down because of excessive
    process swapping or paging.'
