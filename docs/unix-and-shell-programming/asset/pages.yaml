    # Calling User-Defined Functions


    Calling a function means causing the function to run its job. A function call
    is an expression, and its value is the value returned by the function.

    A function consists of a function name followed by the arguments in parentheses.
    What you write in the call for the arguments are expressions; when the time is
    called, these expressions are evaluated, and the values are the actual arguments.
    For example, here is a call to foo with three arguments (the first being a string
    concatenation):


    foo(x y, "lose", 4 * z)

    When function is called, it is given a copy of its arguments. This is known as
    value. The caller may use a variable as the expression for the argument, but the
    function does not know this.

    However, when arrays are parameters to functions, they are not copied. Instead,
    the array itself is available for direct manipulation by the function. This is
    usually called by reference. Changes to an array parameter inside the body of
    a function are visible outside that function. For example:


    ```

    function changeit(array, ind, nvalue)

    array[ind] = nvalue


    BEGIN {

    na[1] = 1; a[2] = 2; a[3] = 3

    changeit(a, 2, "two")

    printf "a[1] = %s, a[2] = %s, a[3] = %s\n"

    a[1], a[2], a[3]

    }

    ```


    This program ''a[1] = 1, a[2] = two, a[3] = 3'', because changeit stores "two"
    the second element of a.


