  md: '# STRUCTURE OF A PROCESS


    When the process completes the system call it may move to the state “user running”
    when it executes in user mode. After a period of time, the system clock may interrupt
    the processor and the process enters state preempted and the other process executes.


    ![](img/3e60d797e15e867a6d5f9f3c8d5cf7c0_77_0.png)


    Fig. 8.1 Process state transition diagram


    When a process executes a system call; it leaves the state “user running” and
    enters the state “Kernel running”. Suppose the system call requires I/O from the
    disk and the process must wait for the I/O to complete. It enters the state “sleep
    in memory” putting itself to sleep until not-ied that the I/O has completed. When
    the I/O later completes, the H/W interrupts the CPU, and the interrupt handler
    awakens the process causing it to enter the state “ready to run in memory”.


    When a process completes, it invokes the exit system call, thus entering the states
    “Kernel running” and finally the “zombie” state.


    # 8.2 KERNEL DATA STRUCTURES


    There are two Kernel data structures that describes the state of a process.


    # 8.2.1 Process Table


    The process table contains the filed that must always be accessible to the Kernel.
    The fields in process table are:


    +   (i) The state field identifies process state.

    (ii) The process table entry contains fields that allow the Kernel to locate the
    process and its u-area in main memory or secondary storage. The process table
    entry also contains a field that gives the process size, so that the Kernel knows
    how much space to allocate for the process.

    (iii) User identifiers (UID) determine various process privileges.'
