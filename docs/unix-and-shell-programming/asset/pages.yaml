  md: '# UNIX AND SHELL PROGRAMMING


    # 8.4 THE CONTEXT OF A PROCESS


    The context of a process consists of the contents of h/w Registers the contents
    of its (user) address space and Kernel data structures that relate to the process.
    We can say context of a process is the union of its Register context, user level
    context and system, level context.


    +   (a) User level context → It consists of process, text, data, user stack, and
    shared memory that occupy the virtual address space of the process.


    Parts of the virtual address space of a process that periodically do not reside
    in main memory because of swapping or paging constitute a part of the user level
    context.


    +   (b) Register Context → It consists of:

    (i) The Program counter specifies the address of the next instruction the CPU
    will execute.

    (ii) The Status Register (PS) specifies the h/w status of the machine as it relates
    to process.

    (iii) The stack pointer contains the current address of the next entry in the
    Kernel or user stack, determined by the mode of execution.

    (iv) The general purpose register contain data generated by the process during
    its execution.


    +   (c) System level context → The system level context of a process has a “static
    part” and a “dynamic part”. A process has one static part of the system level
