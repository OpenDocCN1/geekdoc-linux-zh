  md: '# Chapter 4


    # # BUFFER CACHE


    When a process want to access data from a file, the Kernel brings the data into
    memory where the process can examine alter it and request that the data be saved
    in the file system. The super block of a file system describes the free space
    available on the file system. The Kernel reads the super block into memory to
    access its data and writes it back to the file system when it wishes to save its
    data. Similarly the inode describes the layout of de. file. The Kernel reads an
    inode into memory when it want to update the file layout.


    The Kernel could read and write directly to and from the disk for all file system
    access, system response time and thought put be poor because of the slow disk
    transfer rate. The Kernel therefore minimize the frequency of disk access by keeping
    a pool of internal buffers, called the buffer cache which contains the data inherently
    used disk blocks.


    The position of buffer cache module in Kernel architecture between the file subsystem
    and (block) device drivers.


    When reading data from disk. The Kernel attempts to read the data from buffer
    cache. If the data is already in cache the Kernel does not have to read from disk.
    The Kernel reads the data from disk and caches it using an algorithm that tries
    to save as much good data in the cache as possible. “Similar for write"


    # ## 4.1 BUFFER HEADERS


    During system initialization, the Kernel allocates space for a number of buffers
    configurable to memory size and system performance constraints. A buffer consist
    of two parts.


    +   (i) A Memory Array—It contains data from the disk.


