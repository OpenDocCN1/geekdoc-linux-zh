  md: '# Chapter 8


    # STRUCTURE OF A PROCESS


    The Kernel contains a process table with an entry that describes the state of
    every active process in the system. The $u$-area contains additional information
    that controls the operation of a process. The process table entry and the $u$-area
    are part of the context of a process. The aspect of the process context that most
    visibly distinguishes it from the context of another process is of course, the
    contents of its address space.


    # 8.1 PROCESS STATES AND TRANSITIONS


    The following list contains the complete set of process states.


    +   (i) The process is executing in user mode.

    (ii) The process is executing in Kernel mode.

    (iii) The process is not executing but is ready to run as soon as the Kernel schedules
    it.

    (iv) The process is sleeping and resides in main memory.

    (v) The process is ready to run, but the swapper (schedule process O) must swap
    the process into main memory before the Kernel can schedule it to execute.

    (vi) The process is sleeping and the swapper has swapped the process to secondary
    storage to make room for other processes in main memory.

    (vii) The process is returning from the Kernel to user mode, but the Kernel preempts
    it and does a context switch to schedule another process.

    (viii) The process is newly created and is in a transition state; the process
    exists but is not ready to run, nor is it sleeping. This state is the start state
    for all processes except process.

    (ix) The process executed the exit system call and is in the zombie state. The
    process no longer exists, but it leaves a record containing an exit code and some
    timing statistics for its parent process to collect. The zombie state is the final
    state of a process.


    The process enters the state model in the “created” state when the parent process
    executes the fork () system calls. The process scheduler will eventually pick
    the process to execute and the process enters the state “Kernel running” where
    it completes its part of the fork() system call.'
