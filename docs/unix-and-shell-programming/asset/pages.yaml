    \ many system management tasks. The language is intended to be practical (easy\
    \ to use, efficient, complete) rather than beautiful (tiny, elegant, minimal).\
    \ It combines some of the features of C, sed, awk, and sh, so people familiar\
    \ with those languages should have little difficulty with it. Expression syntax\
    \ corresponds closely to C expression syntax. Unlike Unix utilities, perl does\
    \ not arbitrarily limit the size of your data—if you've got the memory, perl can\
    \ slurp through the whole file as a single string. Recursion is of unlimited depth\
    \ and the hash tables used by associative arrays grow as necessary to prevent\
    \ degraded performance. Perl uses sophisticated pattern matching techniques to\
    \ scale large amounts of data quickly. Although optimized for scanning text, perl\
    \ can also deal with binary data, and can make db files like associative arrays\
    \ (where db is available). Setuid perl scripts are safer than C programs through\
    \ a dataflow tracing mechanism which prevents stupid holes.\n\n# 13.11.1 Running\
    \ Perl\n\nA Perl program is just a text file. You edit the text of your Perl program,\
    \ and the Perl interpreter reads that file directly to “run” it. This structure\
    \ makes your edit-run-debug cycle nice and fast. On Unix, the Perl interpreter\
    \ is called “perl” and you run a Perl program by running the Perl interpreter\
    \ and telling it which file contains your program ...\n\n```\n> perl myprog.pl\n\
