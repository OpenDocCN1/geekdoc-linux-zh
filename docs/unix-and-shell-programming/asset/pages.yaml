  md: '(ii) Opening a named pipe → A named pipe is a file which semantics are the
    same as those of an unnamed pipe, except that it has a directory entry and is
    accessed by a pathname. Processes named pipes in the same way that open regular
    files and hence processes are not closely related to communicate. Named pipes
    persist in the file system hierarchy and unnamed pipes are transient. When all
    process finish using the pipe, the Kernel reclaims its inode.


    A process that opens the named pipe for reading will sleep until another process
    opens the named pipe for writing and vice versa.


    (iii) Reading and writing pipes → A pipe should be viewed as processes write into
    one end of the pipe and read from other. The number of processes reading from
    a pipe do not necessarily equal the number of processes writing the pipe, if the
