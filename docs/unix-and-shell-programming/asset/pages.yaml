    which is similar in function to the head command. If you want to chop off the
    header of a mail message, which is everything up to the first blank line, use:

    You can duplicate the function of the tail command, assuming you know the length
    of a file. We can count the lines, and expr can subtract 10 from the number of
    lines. A Bourne script to look at the last 10 lines of file might look like this:


    ```

    #!/bin/sh

    #print last 10 lines of file

    # First argument is the filename

    lines=`wc -l $1 | awk ''{print $1}''

    start=`expr $lines - 10

    sed "1,$start d" $1

    ```


