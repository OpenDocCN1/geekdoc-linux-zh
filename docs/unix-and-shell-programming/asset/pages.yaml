  md: '# UNIX AND SHELL PROGRAMMING


    When a user logs onto the System, a shell is automatically started. This will
    monitor the user''s terminal, waiting for the issue of any commands. The type
    of shell used is stored in a file called passwd in the subdirectory etc. (see
    Section 3.2). Any other shell may run as a subshell by issuing it as a command.
    For example, /usr/bin/ksh will run a Korn shell. The original shell will still
    be running—in background mode—until the Korn shell is terminated.


    # Users


    Linux is a multi-user operating system. Each user will require to create and access
    his or her own files. These files must be secure from other users on the system.
    Because of this, each user has a unique identification on a Linux system, with
    the option of a password to enhance security.


    There are two types of users on a Linux system:


    +   * Ordinary Users

    an ordinary user has a Home Directory under which files and sub-directories are
    normally stored. After logging onto the system, a user is normally taken directly
    to that directory.

    an ordinary user is a member of a Group of users. For security reasons, files
    (and directories) owned by a user may be accessed and used by the user, other
    members of the user''s group and all other users at different levels of permission.
    For example, a file may be read and altered by the user that owns it, may only
    be read by other members of the same group and may not be accessed at all by any
    other user.


    +   * Super-User

    a super-user is a privileged user who has full access to all files, regardless
    of whoever owns them or what their access permissions are:-

    The super-user has a responsibility: to administer and maintain the system.

    The super-user is normally known as root. root''s Home directory is the primary
    directory of the system, under which all other directories and all files are stored.'
