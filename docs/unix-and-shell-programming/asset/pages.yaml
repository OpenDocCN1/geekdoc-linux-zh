    In UNIX everything is treated as file. Its still necessary to divide there files
    into three categories:


    +   (i) Ordinary files—Contains only data. This includes all data, source programs,
    and executable code all UNIX commands as well as any files created by the user.
    The most common type or ordinary file is the text file.


    +   (ii) Directory files—A directory contains no external data but keeps some
    details of the file and sub-directories it contains. A directory file contains
    two field for each file. The name of the file and its identification number.


    +   (iii) Device files—Consider physical device as files. This definition includes
    printers, tapes, floppy driver, CD-ROMs, hard disk and terminal.


    # (a) Full Path Name


    List each directory, starting from/, down to the file itself. Each directory and
    the file name must be separated by a /.


    # (b) Partial Path Name


    If the file is in or a sub, directory below the working directory, the names of
    higher directories may be omitted.


    # (c) Relative Path Name


    If the file is in a directory near the working directory, a relative path may
    be used. If the working directory is /home/Ion, the file al.c in that directory
    may be reffered by:


    Full Path Name — /home/Ion/al.c

    Partial Path Name — al.c

    If the working directory is /home/Ion, the file temp under directory /home/nic
    may be reffered by:


    +   Full Path Name : /home/nic/temp

    Relative Path Name : ../nic/temp'
