  md: 'Open returns undef on failure, so the following phrase is often to exit if
    a file can''t be opened.

    The die operator prints error messages and terminates the program.


    ```

    open(FILE, $fname) || die "Could not open $fname";

    ```


    In this example, the logical-or operator || essentially builds an if statement,
    since it evaluates the expression if the first is false. This construct is a little
    strange, but it is a common pattern for Perl error handling.


    # 13.20.2 Input Variables


    In a scalar context the input operator reads one line at a time. In an array context,
    the input operator reads the entire file into memory as an array of lines ...


    ```

    @a = <FILE>; ## read the whole file in as an array of lines

    Syntax can be dangerous. The following statement looks like it reads just a single
    line, but actually the left side is an array context, so it reads the whole file
    and discards all but the first line ...

    my($line) = <FILE>;

    ```


    The behaviour of <FILE> also depends on the special variable $/ which is the current
    end-of-line marker (usually "\n"). Setting $/ to undef causes <FILE> to read the
    file into a single string.


    ```

    $/ = undef;

    $all = <FILE>; ## read the whole file into one string

    ```


    You can remember that $/ is the end-of-line marker because "$/" is used to designate
    separate lines of poetry. I thought this mnemonic was silly when I first saw it,
    but sure enough, I remember that $/ is the end-of-line marker.


    # 13.20.3 Print Output


    Print takes a series of things to print separated by commas. By default, print
    writes to the STDOUT file handle.


    ```

    print "Woo\n"; ## print a string to STDOUT

    $num = 42;

    $str = " Hoo";

    print "Woo", $a, " $num", "\n"; ## print several things

    ```


    An optional first argument to print can specify the destination file handle. There
    is no comma after the file handle.


    ```

    print FILE "Here", " there", " everywhere", "\n"; ## no comma after FILE

    ```'
