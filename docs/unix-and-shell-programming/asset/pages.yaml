  md: '# I File System Consistency


    The Kernel writes to disk to minimize file system corruption in event of system
    failure. For instance when it removes a file name from its parent directory,


    +   (i) It writes the directory synchronously to the disk before it destroys the
    contents of the file and frees the inode.


    If the system were to crash before the file contents were removed, damage to the
    system would be minimal. There would be an inode that would have a link count1
    greater than the number of directory entries it access, but all other paths to
    the file would still be legal.


    +   (ii) If the directory write were not synchronous it would be possible for
    the directory entry on disk to point to a free (or reallocated) inode after a
    system crash. Thus there would be more directory entries in the file system that
    refer to the inode than the inode would have link counts.


