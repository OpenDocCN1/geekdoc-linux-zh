    # 9.3 THE USER-ID OF A PROCESS


    The Kernel associates two user-IDs with a process, who is independent of the running
    process:


    +   (i) Real user-ID: It identifies the user who is responsible for the process

    (ii) Effective user-ID: Its used to assign ownership of newly created files to
    check file access permissions and to check permission to send signals via the
    kill system call.


    The Kernel allows a process to change its effective user-ID when it executes a
    setuid program or when to invoke setuid system call explicitly. A setuid program
    is an executable file with the setuid bit set in its permission mode field. When
    a process executes a setuid program, the Kernel sets the effective user-IDs in
    the process table and u-area to the owner ID of the file. Syntax


    setuid(uid);

    uid uid is the new user-ID and its result depends on the current value of the
    effective user-ID. If the effective user-ID of the calling process is not super
    user the Kernel resets the effective user-ID in the u-area to uid if uid has the
    value of the real user-ID or if it has the value of the saved user-ID. If the
    effective user-ID of a process is super user the Kernel resets all the user-ID
    fields in the process table and u-area to uid. Otherwise the system call return
    error.


    Generally a process inherits its real and effective user id from its parent during
    the fork system call and maintains its values across exec system calls.


