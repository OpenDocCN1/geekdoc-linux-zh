    # 3.3.2 Context of a Process


    The context of a process is its state as defined by its text, the values of its
    global variables and data structures, the values of m/c registers it user. The
    values stored in its process table slot u and u area the contents of its user
    and Kernel stacks.


    When executing a process, the system is said to be executing in the content of
    the process. When the Kernel decides that it should execute another process it
    does a context switch, when the system executes in the context of the other process.
    The Kernel allows a context switch only under specific conditions. When doing
    a context switch, the Kernel saves enough information so that it can switch back
    to the first process and resume its execution. Similarly when moving from user
    to Kernel mode, the Kernel saves enough information so that it can later return
    to user mode and continue execution from where it left off. Moving between user
    and Kernel mode is a change in not a context switch.


