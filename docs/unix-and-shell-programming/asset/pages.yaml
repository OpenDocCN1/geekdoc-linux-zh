    +   Each entry contains a numeric key, which is its user chosen name.


    +   Each mechanism contains a “get” system call to create a new entry or to retrieve
    an existing one, and the parameters to the calls include a key and flag. The Kernel
    searches the proper table for an entry named by the key.


    +   Process can call the “get” system calls with the IPC PRIVATE.


    +   They can set the IPC_CRE bit in the flag field to create a new entry if by
    key does not already exist, and they can force an error notification by setting
    the IPC_EXCL and IPC_CRE flags if an entry already exists for the key.


    +   For each mechanism, the Kernel uses the following formula to find the index
    into the table of data structures from descriptor;

    index = descriptor modulo (no. of entries in table)


    +   For example if the table of message structures contains 100 entries, the descriptors
    for entry 1 are 1, 101, 201 and so on. When a process removes an entry the Kernel
    increment the descriptor associated with it by the number of entries in the table.'
