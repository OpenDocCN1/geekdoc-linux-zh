    ## $dict("homer" => "D''Oh", "lisa" => "");

    $string = $dict("bart");

    ## Lookup the key "bart" to get

    ## the value "I didn''t do it"

    $string = $dict("merge");

    ## Returns undef -- there is no entry for "arge"

    $dict("homer") = "Mmmm, scalars";

    ## "homer" to "Mmmm, scalars"

    ```


    A hash array may be converted back and forth to an array where each key is immediately
    followed by its value. Each key is adjacent to its value, but the order of the
    key/value pairs depends on the hashing of the keys and so random. The “keys” operator
    returns an array of all the values, in an order consistent with the keys operator.'
