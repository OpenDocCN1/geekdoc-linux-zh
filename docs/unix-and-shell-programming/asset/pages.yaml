  md: '# Chapter 2


    # OPERATING SYSTEM SERVICES


    The Kernel performs various primitive operations on behalf of user process to
    support the user interface. Among the services provided by the Kernel are:


    +   - Controlling the execution of process fairly by allowing their creation,
    termination or suspension and communication.


    +   - Scheduling process fairly for execution on the CPU. Processes share the
    CPU in a time shared manner. The CPU executes a process, the Kernel suspend when
    its time quantum lapses and the Kernel schedules another process to execute. The
    Kernel later reschedules the suspended process.


    +   - Allocating main memory for an executing process.


    +   - Allocating secondary memory for efficient storage and retrieval of user
    data. This service constitutes the file system.


    +   - Allowing processes controlled access to peripheral devices such as terminals,
    tape driver, disk driver and N/W devices.


    # 2.1 ASSUMPTION ABOUT H/W—LEVEL OF UNIX SYSTEM


    The execution of user processes on UNIX systems is divided into two levels:


    +   - (i) User and (ii) Kernel level


    When a process executes a system call execution mode of the process changes from
    user mode to Kernel mode. The O.S. executor and attempts to service. The user
    request, returning an error code if it fails. Difference b/w, there are modes:


    | Kernel Mode | K |

    |---|---|

    | User Mode | U | U |


    # 2.1.1 Differences


    +   - Process in user mode can access their own instructions and data but not
    Kernel instructions and data. Process in Kernel mode however can access Kernel
    and user addresses. For example, the virtual address space of a process may be
    divided b/w'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# UNIX AND SHELL PROGRAMMING


    addresses are accessible only in Kernel mode and addresses that are accessible
    in either mode.


    (ii) Some m/c instructions are privileged and result in an error when executed
    in user mode. For example a m/c instruction that manipulates the processor status
    register. Process executed in user mode should not have these capabilities.


    Although the system executes in one of two modes, the Kernel runs on behalf of
    a process. The Kernel is not a seperate set of processes that run in parallel
    to user-process but its part of each user process.


    # 2.1.2 Interrupts and Exceptions


    The UNIX system allows devices such as I/O peripherals or the system clock to
    interrupt the CPU asynchronously. On, receipt of interrupt, the Kernel saves its
    current context determines the cause of the interrupt and services the interrupt.
    After the Kernel services the interrupt it restore its interrupted context and
    proceeds as if nothing had happened. The h/w usually prioritizes devices according
    to the order that interrupts should be handled. When the Kernel services an interrupt,
    it blocks lower priority interrupts but services higher priority interrupt.


    ![](img/3e60d797e15e867a6d5f9f3c8d5cf7c0_14_0.png)


    Fig. 2.1 Steps in starting an I/O device and getting interrupt.


    **In step 1.** The driver tells the controller what to do by writing into its
    device Register. The controller starts the device. When the controller has finished
    reading or writing the number of bytes it has been told to transfer, it signals
    the interrupt controller chip using certain bus lines in **step 2.**


    If the interrupt controller is prepare to accept the interrupt it assert a pin
    on CPU chip informing it, in **step 3.**


    **In step 4.** The interrupt controller puts the number of the device on the bus
    so the CPU can read it and know which device has just finished.


    ![](img/3e60d797e15e867a6d5f9f3c8d5cf7c0_14_1.png)


    Interrupt processing involves taking the interrupt, running, the interrupt handler,
    and returning to the user program.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Exception Operating Services


    An exception condition refers to unexpected events caused by a process such as
    addressing illegal memory, executing privileged instructions, dividing by zero
    and soon. OR “Exception are run time error”.


    # Difference


    | Exception | Interrupt |

    | --- | --- |

    | 1. Internal to process | 1. External to process |

    | 2. Occur within a program | 2. Occur between two programs |

    | 3. System attempt to restart the instruction after handling the exceptions.
    | 3. The system continues with the next instruction after servicing the interrupt.
    |


    # 2.2 PROCESSOR EXECUTION LEVEL


    The Kernel must prevent the occurrence of interrupts during critical activity,
    which could result in corrupt data if interrupts were allowed. For instance the
    Kernel may not want to receive a disk interrupt while manipulating linked lists
    handling the interrupt could corrupt the pointers. Setting the processor execution
    level to certain values masks off interrupts from that level and lower levels,
    allowing only higher level interrupts.


    ![](img/3e60d797e15e867a6d5f9f3c8d5cf7c0_15_0.png)


    # Memory Management


    The Kernel permanently resides in main memory as does the currently executing
    process.


    # 2.3 ARCHITECTURE OF UNIX O.S.


    # 2.3.1 System Calls and Libraries


    System calls and libraries represent the border between user program and the Kernel.\Instruct
    the Kernel to do some specific task”.

    System calls look like ordinary function calls in C programs and libraries map
    these function calls to the primitives needed to enter the O.S. Assembly language
    programs may invoke system called directly without a system call library. The
    libraries are linked with the programs at compile time and are part of the user
    program for purpose of this discussion.'
  merge: -1
  pgno: 15
