    # U-Area (User-area)


    U-area contains information describing the process that needs to be accessible
    only when the process is executing. The important fields are:


    +   (i) A pointer to the process table slot of the currently executing process.

    (ii) Parameters of the current system call return values and error codes.

    (iii) File descriptors for all open files.

    (iv) Current directory current root.

    (v) Process and file size limit.


    The Kernel can directly access fields of the u-area of executing process but not
    of the u-area of other-processes.


    # Process Table


    The process table is resident all the time and contains information needed for
    all processes even those that not currently present in memory. The user structure
    is swapped or page-out when its associated process is not in memory. The process
    table entry and u-area contain control and status information about the process
    fields in the process tables are:


    +   (i) A state field.

    (ii) Identifiers indicating the user who owns the process (UID).

    (iii) An event descriptor set when a process is suspended.

    (iv) Memory Image—Pointers to the text, data and stack segment or if paging is
    used to their page tables.


    # Region Table


    Region (called segment in some early version and Berkeley releases) is a contiguous
    area of virtual address space that can be treated as a distinct object to be shared
    or protected. Region is a data area which may be accessed in mutual exclusive
    manner. In the region page table actual page descriptors are stored.'
