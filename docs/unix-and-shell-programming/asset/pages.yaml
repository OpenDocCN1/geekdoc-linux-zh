  md: '# Chapter 5


    # # READING AND WRITING DISK BLOCKS


    To read a disk block a process uses an algorithm to get a Search for it in the
    buffer cache. If its in the cache, the Kernel can return it immediately without
    physically reading from disk. If its not in cache, the Kernel calls the disk driver
    to schedule a request and goes to sleep awaiting the event that the I/O completes.
    The disk drivers notifies the disk controller h/w that it want to read data and
    the disk controller later transmits the data to buffer. Finally the disk controller
    interrupts the processor when the I/O is complete and the disk interrupt handler
    awakens the sleeping process: the contents of the disk block now in the buffer.


    # ## 5.1 DISK CONTROLLER


    Several physical disk units are managed by a single disk controller device. The
    controller in turn is connected to an I/O channel that transmits information from
    disk unit to the central computer one channel might support several disk. Controller
    each of which might, in turn, support several disk drives.


    ![](img/3e60d797e15e867a6d5f9f3c8d5cf7c0_37_0.png)'
