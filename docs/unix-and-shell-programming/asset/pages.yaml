    The Kernel pushes a context layer when an interrupt occurs, when a process makes
    a system call or when a process does a context switch. It pops context layer when
    the Kernel returns from handling an interrupt, when a process returns to user
    mode after the Kernel completes execution of a system call, or when a process
    does a context switch. The Kernel pushes the context layer of the old process
    and pops the context layer of new process. The process table entry stores the
    necessary information to recover the current context layer.


    A process runs within its context layer. The number of context layers is bounded
    by the number of interrupt levels the m/c supports.


