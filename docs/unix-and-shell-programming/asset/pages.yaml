  md: '# 13.23.1 The Essential Command: s for Substitution


    Sed has several commands, but most people only learn the substitute command: s.
    The substitute command changes all occurrences of the regular expression into
    a new value. A simple example is “day” in the “old” file to “night” in the “new”
    file:


    ```

    sed s/day/night/ <new

    ```


    Or another way


    ```

    sed s/day/night/ old >new

    ```


    and for those want to test this:


    ```

    echo day | sed s/day/night/

    ```


    This will output “night”.


    “Using the strong (single quote) character, that would be:


    ```

    sed ''s/day/night/'' <new

    ```


    I must emphasize the sed editor changes exactly what you tell it to. So if you
    executed echo Sunday | sed ''s/day/night/'' <new


    This would output the word “night” because sed found the string “day” in the input.
    There are four parts to this substitute command:


    s Substitute command


    |././. Delimiter

    day Regular Expression Pattern Search

    night Replacement string


    The search pattern is on the left hand side and the replacement string is on the
    right hand side.


    # 13.23.2 The Slash as a Delimiter


    The character after s is the delimiter. It is conventionally a slash, because
    this is what ed, more, and vi use. It can be anything you want, however if you
    want to change a pathname that contains a slash—say /usr/local/bin to /common/bin—you
    could use the backslash to quote the slash:


    ```

    sed ''s/usr/local/bin/\common/bin/'''' <new

    ```


    # 13.23.3 Using & at the Matched String


    Sometimes you want to search for a pattern and add characters, like parenthesis,
    around or near the pattern you find. It is easy to do this if you are looking
    for a particular string:


    ```

    sed ''s/abc/ (abc)'' <new

    ```


    This won''t work if you don''t know exactly what you will find. How can you put
    the string found in the replacement string if you don''t know what it is?


    The solution uses the special character “&”. It corresponds to the pattern found.


    ```

    sed ''s/[a-z]*/(&)/'' <new

    ```'
