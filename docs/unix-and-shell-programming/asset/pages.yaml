  md: '# 13.10.1 Calling Built-in Functions


    To call a built-in function, write the name of the function followed by arguments
    in parentheses. For example, ''atan2(y + z, 1)'' is a call to the name atan2,
    with two arguments.


    Each built-in accepts a certain number of arguments. In some cases, arguments
    can be omitted. The omitted arguments vary from function to function and are described
    under the individual functions. In some awk implementations, extra arguments given
    to built-in functions are ignored.


    When a function is called, expressions that create the function''s actual parameters
    are evaluated completely before the function is performed. For example, in the
    code fragment:


    ```

    i = 4

    j = sqrt(i++)

    ```


    The variable i is set to five before sqrt is called with a value of four for its
    actual parameter.


    The order of evaluation of expressions used for the function''s parameters is
    undefined. Thus, you should not write programs that assume parameters are evaluated
    from left to right. For example,


    ```

    i = 5

    j = atan2(i++, i*= 2)

    ```


    If the order of evaluation is left to right, then i becomes six, and then 12,
    and atan2 is called with the two arguments six and twelve. If the order of evaluation
    is right to left, first i becomes 10, and then 11, and atan2 is called with the
    two arguments 11 and 10.


    # 13.10.2 Numeric Built-in Functions


    Here is a full list of built-in functions that work with numbers. Optional parameters
    are enclosed in square brackets ("["]]").


    ```

    int(x)

    ```


    This produces the nearest integer to x, located between x and zero, truncated
    toward zero. For example, int(3) is three, int(-3.9) is three, int(-3.9) is -3,
    and int(-3.5) is -3 as well.


    ```

    sqrt(x)

    ```


    This gives the positive square root of x. It reports an error if x is negative.


    ```

    exp(x)

    ```


    This gives you the exponential of x (e ^ x), or reports an error if x is out of
    range.


    ```

    log(x)

    ```


    This gives you the natural logarithm of x, if x is positive; otherwise.


    ```

    sin(x)

    ```


    This gives you the sine of x, with x in radians.


    ```

    cos(x)

    ```


    This gives you the cosine of x, with x in radians.'
