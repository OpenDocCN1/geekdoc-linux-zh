  md: '# Chapter 3


    # FILE SYSTEM


    After the disk has been partitioned its still not ready for use. A file system
    has to be created in each partition. There usually are multiple file systems in
    one m/c each having its own directory tree headed by root.


    Every file system is organized in a sequence of blocks of 512 bytes each. (1024
    in Linux) and will have four components:


    | Boot Block | Super Block | Inode Blocks | Data Block |


    +   1. Boot Block—This block contains a small boot strap program. This is the
    Master Boot Record (MBR) that DOS users would like to call. It is loaded into
    memory when the system is booted. It may in turn load another program from the
    disk but eventually it will load the Kernel (the file/stand/unix or/vm linux)
    into memory.


    +   2. Super Block—It describe the state of file system (balance sheet of EVERY
    UNIX file system). The Kernel first reads this area before allocating disk blocks
    and inodes for new files. The super block contains global file information about
    disk usage and availability of data blocks and inodes. It contains:

    —The size of the file system.

    —The length of a disk block.

