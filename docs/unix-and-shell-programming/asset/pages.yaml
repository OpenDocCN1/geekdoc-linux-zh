    # 13.17 ARRAYS — @


    List arrays (also known as "arrays" for short) take the concept of scalar variables
    to the next level. Whereas scalar variables associate one value with one variable
    name, lists associate array name with a "list" of values.


    Array constants are specified using parenthesis ( ) and the elements are separated
    by commas. Perl arrays like lists or collections in other languages they can grow
    and shrink, but in Perl they are just called "arrays". Array variable names begin
    with the at-sign (@). Unlike C, the assignment operator (=) works for arrays—an
    independent copy of the array and its elements is made. Arrays may not contain
    other elements as arrays. Perl has sort of "i-deep" mentality. although it''s
    possible to get around the ld-constraint using "references", but it''s no fun.
    Arrays work best if they contain scalars (strings and numbers). The elements in
    an array do not need to be the same type. A list array is defined with the following
    syntax:


    ```

    @array_name = ("element_1", "element_2"..."element_n")

    For example, consider the following list definition:

    @available_colors = ("red", "green", "blue","brown")

    @array = (1, 2, "hello") # a 3 element array

    @empty = (); # the array with 0 elements

    $x = 1;

    $y = 2;

    $nums = ($x + $y, $x - $y);

    ## @nums is now (3, -1)

    ```


    Just in C, square brackets [] are used to refer to elements, so a[6] is the element
    at index 6 in the array. As in Perl, index starts at 0. Notice the syntax to access
    an element begins with ''$'' not ''@''—use ''$'' only when referring to the whole
    array (remember: all scalar expressions with $$).


    ```

    @array = (1, 2, "hello", "there")

    $array[0] = $array[0] + $array[1]; ## $array[0] is now 3

    Perl arrays are not bounded. If code writes attempts to read an element outside
    the array size, undef is returned. The array grows automatically to be enough.
    Well written code should probably not rely on either of these features.

    @array = (1, 2, "hello", "there")

    $sum = $array[0] + $array[27]; ## $sum is now 1, since $array[27] returned undef

    $array[99] = "the end"; ## array grows to be size index

    ```'
