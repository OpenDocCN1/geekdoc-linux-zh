  md: 'In awk you became productive in several hours. For instance, to print only
    the second and sixth fields of the date command—the month and year—with a space
    separating them, use: date | awk `{print $2 " " $6}`


    Syntactically, awk consists of a pattern followed by an action. The action is
    enclosed in braces to separate it from the pattern. Newlines usually separate
    rules. Therefore, an awk program looks like this:


    ```

    pattern { action }

    ```


    When you run awk, you specify an awk program that tells awk what to do. The program
    consists of a series of rules. (It may also contain function definitions, an advanced
    feature that we will ignore for now. Each rule specifies one pattern to search
    for and one action to perform upon finding the pattern.


    # 13.2 HOW TO RUN AWK PROGRAMS


    There are several ways to run an awk program. If the program is short, it is easiest
    to include it in the command that runs awk, like this:


    ```

    awk ''program'' input-file input-file 2 ...

    ```


    When the program is long, it is usually more convenient to put it in a file and
    run it with a command like this:


    ```

    awk -f program-file input-file 2 ...

    ```


    # 13.3 COMMENTS IN AWK PROGRAMS


    A comment is some text that is included in a program for the sake of human readers;
    it is not really an executable part of the program. Comments can explain what
    the program does and how it works. Nearly all programming languages have provisions
    for comments, as programs are typically hard to understand without them.


    In the awk language, a comment starts with the sharp sign character (''#'') and
    continues to the end of the line. The ''#'' does not have to be the first character
    on the line. The awk language ignores the rest of a line following a sharp sign.


    # 13.4 THE PRINTF STATEMENT


    awk''s printf statement is essentially the same as that in C except that the *
    format specifier is not supported.


    ```

    printf format, expr[1], expr[2], . ., expr[n]

    ```


    Where format is a string that contains both information to be printed and specifications
    on what conversions are to be performed on the expressions in the argument list,
    as in “printf conversion characters”. Each specification begins with a %, ends
    with a letter that determines the conversion, and may include:


    Left-justify expression in its field.'
