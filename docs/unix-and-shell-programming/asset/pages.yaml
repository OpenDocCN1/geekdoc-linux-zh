  md: '(ii) It has a simple user interface that has the power to provide the services
    that users want.


    (iii) It provides primitives that permits complex programs to be built from simpler
    programs.


    (iv) It user a hierarchical file system that allows easy maintenance and efficient
    implementation.


    (v) It uses consistent format for files, the byte stream, making application programs
    easier to write.


    (vi) It provides a simple, consistent interface to peripheral devices.


    (vii) Its a multiuser, multiprocess system. Each user can execute several process
    simultaneously.


    (viii) It hides the m/c architecture from the user, making it easier to write
    programs that run on different h/w implementations.


    # 1.3 FEATURES OF UNIX


    There are ten features of UNIX:


    +   1. Multiser system

    2. Multitasking capabilities

    3. Communication

    4. Security

    5. Portability

    6. Pattern matching

    7. Programming facility

    8. Windowing system

    9. Documentation

    10. System calls and libraries.


    # 1. Multiuser System


    In a multiuser system, the same computer resources-hard disk, memory etc., are
    accessible to many users. The users don''t flock together at the same computer
    but are given different terminal to operate from. All terminals are connected
    to the main computer whose resources are available by all users. The following
    figure shows a typical UNIX setup.


    ![](img/3e60d797e15e867a6d5f9f3c8d5cf7c0_9_0.png)


    Fig. 1.2'
