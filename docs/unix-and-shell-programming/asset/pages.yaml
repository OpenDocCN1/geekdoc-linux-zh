  md: 'wakes up” slave processor from an idle state once a second. The slave processor
    schedules the highest priority process that needs not run one the master processor.


    The only chance for corruption of Kernel data structures comes in the scheduler
    algorithm, because it does not protect against having a process selected for execution
    on two processors.


    For instance, if a configuration consists of a master processor and two slaves,
    it is possible that the two slave process one in user mode for execution. If both
    processors were to schedule the process simultaneously, they would read, write
    and corrupt its address.


    The system can avoid this problem:


    +   - The master can specify the slave processor on which the process should execute,
    permitting more than one process to be assigned to a processor. One processor
    may have lots of processes assigned to it whereas others are idle. The master
    Kernel would have to distribute the process load b/w processors.


    +   - The Kernel can allow only one processor to execute the scheduling loop at
    a time.


    # 11.4 SOLUTION WITH SEMAPHORES


    Using this method for supporting UNIX systems on multiprocessor configuration
    is to partition the kernel into critical regions that at most one processor can
    execute code in a critical regions at a time. There are two issues:


    +   - How to implement Semaphores?


    +   - Where to define critical Region?


    There are various algorithms in uniprocessor UNIX systems use a sleep lock to
    keep others out of a critical region in case the first processor goes to sleep
    inside the critical region. The mechanism for setting the lock is


    ```

    while (lock is set) /* Test Operation */

    sleep (condition until lock is free);

    set lock:

    ```


    and the mechanism for unlocking the lock is free lock;

    wake up (all process sleeping on condition lock set);

    sleep-delineate some critical region

