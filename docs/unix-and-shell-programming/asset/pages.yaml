    # 9.1 PROCESS CREATION


    To create a new process in the UNIX operating system is to invoke the fork system
    call. The process that invokes fork is called the parent process, and the newly
    created process is called the child process. The syntax for the fork system call
    is:

    pid = fork();


    On return from the fork system call the two processes have identical copies of
    their user context except for the return value pid. In the parent process pid
    is the child process ID; in the child process, pid is O. Process O created internally
    by the Kernel when the system is booted, the only process not created via fork.


    The Kernel does the following sequence of operations for fork:


    +   (i) It Allocate a slot in the process table for the new process.

    (ii) It assigns a unique ID number to child process.

    (iii) It makes a logical copy of the context of the parent process.

    (iv) It increments file and inode table counters for files associated with the
    process.

    (v) It returns the ID number of the child to the parent process, and a value to
    the child process.


