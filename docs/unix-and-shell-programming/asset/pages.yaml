    # 13.12.1 Strings


    Strings constants are enclosed within double quotes ("") or single quotes ('''').
    Strings in double quotes are treated specially—special directives like `\n` (newline)
    and `\x20` (hex) are expanded. More importantly, a variable, such as `$x`, inside
    a double quoted string is evaluated at run-time—“interpolation”—and the variable
    is passed into the string. This evaluation of variables into strings is called
    “interpolation”, and a great Perl feature. Single quotes ('''') suppress all the
    special evaluation—they do not evaluate `\n` or `$x`, but may contain newlines.


    ```

    $fname = "binky.txt"

    $a = "Could not open the file $fname"; ## $fname evaluated and passed in -neato!

    $b = ''Could not open the file $fname.\''; ## single quotes ('''') do not special
    evaluation

    $a is now "Could not open the file binky.txt."

    $b is now "Could not open the file $fname."

    ```


    The characters ''$'' and ''@'' are used to trigger interpolation into strings,
    so those characters need to be escaped with a backslash (\) if you want them in
    a string. For example:

    `"nick@stanford.edu found \1"`


    The dot (.) concatenates two strings. If Perl has a number or other type when
    it wants a string, it just converts the value to a string and continues. It works
    the other way—a string like “42” will evaluate to the integer 42 in an integer
    context.


    ```

    $num = 42;

    $string = "The " . $num . " ultimate " . " answer";

    ## $string is now "The 42 ultimate answer"

    ```


