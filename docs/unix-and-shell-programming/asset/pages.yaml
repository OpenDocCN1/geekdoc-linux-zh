    # ## 13.17.2 Hash Arrays—


    Hash arrays, also known as “associative” arrays, are a built-in key/value data
    structure. Hash arrays are optimized to find the value for a very quick lookup.
    Hash variables with a percent sign (%) and use braces {} to access the value for
    a particular key. If there is no such key in the array, the value returned is
    undef. The keys are case sensitive, so you may want to consistently uppercase
    or lowercase strings before using them as a key (use lc and uc).


    ```

    $dict("bart") = "I didn’t do it";

    $dict("homer") = "D''Oh";

    $dict("lisa") = "";

