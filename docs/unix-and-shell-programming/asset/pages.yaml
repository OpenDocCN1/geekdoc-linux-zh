  md: '# 10.2.3 Semaphores


    The semaphore system allows processes to synchronize execution by doing a set
    of semaphores. Before the implementation of semaphores, a process would create
    a lock file with the create system call if it wanted to lock a resource. The create
    fails if the file already exists, and the process would assume that another process
    has the resource locked.


    Disadvantages—The process does not know when to try again and lock files may inadvertently
    be left behind when the system crashes or is reboated.


    ```

    P : if (S > 0)

    S --;

    V : if (S < 0)

    S ++;

    ```


    S is a semaphore variable.

    A semaphore in UNIX system V consists of the following elements:


    +   (i) The value of semaphore.

    (ii) The process ID of the last process to manipulate the semaphore.

    (iii) The number of processes waiting for the semaphore value to increase.

    (iv) The number of processes waiting for the semaphore value to equal 0.


