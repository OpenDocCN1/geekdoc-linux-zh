    started.


    NF is the number of fields in the input record. NF is set each time a new record
    is read, when new field is created, or when $0 changes.


    NR is the number of input records awk has processed since the beginning of the
    program''s execution. NR is set each time a new record is read.


    LENGTH is the length of the substring matched by the match function. RLENGTH is
    set by invoking the match function. Its value is the length of the matched string,
    -1 if no match was found.


    START is the start-index in characters of the substring matched by the match function.
    START is set by invoking the match function. Its value is the position of the
    string where the matched substring, or zero if no match was found.


    A side note about NR and FNR, awk simply increments both of these variables each
    time it reads a record, instead of setting them to the absolute value of the number
    of records read. This means that your program can change these variables, and
    their new values will be incremented for each record. For example:


    ```

    $ echo ''1

    > 2

    > 3

    > 4 '' | awk ''NR == 17 {

    > { print NR }

    -| 1

    -| 17

    -| 18

    -| 19

    ''

    ```


