  md: 'The Kernel caches in the buffer pool according to a LRU algorithm: it allocates
    a buffer to a disk blocks, it cannot use the buffer for another block all other
    buffers have been used recently. The Kernel maintains a free list of buffers that
    preserve the least recently used order. The free list is a doubly linked list
    of buffers with a dummy buffer header that marks its beginning and end when the
    Kernel returns to a buffer pool it usually attaches the buffer to the tail of
    the free list, occasionally to the head of the free list (for error case), never
    to the middle.


    When the Kernel access a disk block, it searches for the buffer with the appropriate
    device-number combination. Rather than search the entire buffer pool, it organizes
    the buffers into separate queues hashed as a function of the device and block
    number the Kernel links the buffers on ahash queue into a circular, doubly linked
    list. The number of buffers on a hash queue varies during the lifetime of the
    system. The Kernel must use a hashing function that distributes the buffers uniformly
    across the set of hash queues. Yet the hash function must be simple so that performance
    does not suffer. System administrators configure the hash queues when generating
    the O.S.


    # Hash queue headers


    | Block no 0 mod 4 | 28 | 4 | 64 |

    | 1 mod 4 | 17 | 5 | 97 |

    | 2 mod 4 | 98 | 50 | 10 |

    | 3 mod 4 | 3 | 35 | 99 |


    Fig. 4.3 Buffers on the hash queue


    Each buffer always exists on a hash queue. But there is no significance to its
    position on the queue. no two buffers may simultaneously contain the contents
    of the same disk block therefore every disk in the buffer pool exists on only
    one hash queue and only once in that queue. However, a buffer may be on the free
    list as if its status is free. The Kernel has two ways to find a buffer on a hash
    queue. It search the hash queue, if its looking for a particular buffer and removes
    a buffer from the free list if looking for any free buffer.


    # 4.2 SCENARIOS FOR RETRIEVAL OF A BUFFER


    High level Kernel algorithms in the file subsystem invoke the algorithms for managing
    the buffer cache. The high level algorithm determine the logical device number
    and block number that they wish access when they attempt to retrieve a block.
    The algorithms for reading and writing disk blocks use “getblk” algorithm to allocate
    buffers from the pool.


    +   There are five scenarios the Kernel may follow in getblk to allocate a buffer
    for a disk block.

    1. The Kernel finds the block on its hash queue and its buffer is free.'
