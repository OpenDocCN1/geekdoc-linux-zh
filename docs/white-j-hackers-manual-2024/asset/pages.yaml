  md: '# Linux: Secure your desktop


    Linux can thwart a majority of attacks on its own but we can help put a level
    10 defence around your computer.


    Running Linux just because you think it''s safer than Windows? Security in Linux
    is a built-in feature and extends right from the kernel to the desktop, but it
    doesn''t leave room to seem too much about your home. Linux is impervious to viruses
    and worms for sure, but attackers have several other tricks up their sleeves to
    leverage your precious and bytes that make up everything from your personal emails
    to your credit cards.


    Locking your data with a username and password should be your only line of defence
    and it isn''t enough to hold off an attacker. As the number and variety of attacks
    increases, you should go out of your way and take extra measures to secure your
    computer against unauthorised attacks.


    All mainstream Linux distributions such as Debian, Ubuntu, and Fedora have security
    teams that work to make sure you are protected against security vulnerabilities.
    These teams work with each other to make sure security patches are available as
    soon as a vulnerability is discovered. Your distribution will have a security
    repository specific to it (which is enabled by default), and you should choose
    to update your system automatically or manually with the click of a button. For
    example, in the Software & Apps menu, you can use Ubuntu to download and install
    security updates.


    In addition to updates, distributions also have a security mailing list to announce
    vulnerabilities, and others to share them. It''s a good idea to keep an eye on
    the list for your distro, and look for any security patches that are created.
    There is a small lag between the release and the package being put into the repository;
    the mailing lists guide inmates on how to grab and install the updates.


    You should also take time to disable unnecessary services. A Linux desktop starts
    with a number of services to be used to please as many people as possible. But
    really you don''t need them all. They shouldn''t be enabled on a secure server,
    and why would you need the Bluetooth service to connect to devices on a computer
    that doesn''t have one? Although distributions let you control the services that
    run on your Linux installation with a built-in graphical interface however some
    might stop functioning when


    you decided to use a service on which you rely. For example, many services rely
    on databases, so before you turn off MySQL or PostgreSQL you should make sure
    you aren''t running any applications that rely on them.


    # Secure user accounts


    On a multipasser system like Linux, it''s imperative that you limit access to
    the root advantages. Most distributions nowadays don''t allow you to log in as
    root at boot time, which is good. Furthermore, instead of giving multiple people
    root access, you can grant them root access using the sudo command. Using sudo
    instead of logging in as the root user has several advantages.


    One of the advantage of using sudo is that it allows you to restrict access to
    certain commands. This should be visited with the sudo command. The /var/log/sudo
    file records all commands performed as all.


    To allow a user to gain full privileges when they precede a command with sudo,
    add the following line in the /etc/sudoers:


    ```

    username ALL=(ALL) ALL

    ```


    To allow a user mer to run commands as root but only on the machine which has
    hostname:


    ```

    username hostname=(ALL) ALL

    ```


    To restrict access to certain commands, for example, the following line will only
    allow user to use certain commands:


    ```

    username ALL=(ALL) /bin/bash /bin/sbin /sbin/sbin /halt

    ```


    Similarly, you can add or remove users from the sudo list:


    ```

    username ALL=(ALL) -

    ```


