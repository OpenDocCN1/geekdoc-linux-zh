    # # Peeling open Tor 12


    We might not be in a position to share state secrets with foreign governments,
    but if we were, we''d use Tor Browser.


    Users who want to keep their business private when online turn to VPN (virtual
    private network) thinking it''s a sensible precaution, and when they search for
    terms online, it''s SEO-poisoned, VPN-promoting strategies occupy the first few
    pages of search results, but VPN companies pay up to 60% through affiliate links.
    Want our online freedom to flourish?


    secure during popular uprisings like the Arab Spring, movements in Iran, Turkey
    and Russia, as well as helping NSA leaker Edward Snowden keep secrets from his
    workplace. It''s also good for those engaged in normal, everyday activities, but
    who don''t want to be watched.


    Where are the cash?


    VPNs can hide your location and your activities, but you need to pay for that
    privacy another way - and you can never be truly certain that the connection that
    takes your money isn''t actually selling your data to data brokers, hiding it
    over to the police or,


    # Many layers


    Onion routing works by bouncing your connection between different routers so they''re
    hard to track. Let''s say you''re sitting at home and reading an article at http://905mac.com.
    Such a setup means you can''t be the target of anyone knowing that you''ve connected
    to the 905mac server. If you click a link, the URL will point to the site you''ve
    visited, not the 905mac server you''ve visited. Along with the way, you might
    also have DNS queries made by your own network which are aware of what you do
    online.


    Potentially, there are dozens of individuals who are now aware that you are secure
    for an long period, otherwise because of your use of Tor desktop.


    If you use Tor, your information is wrapped in multi-layer encryption and sent
    through network of randomly selected relays. These relays only decrypt one section
    of the route and not the entire journey. The final stop on this journey is the
    exit node and it''s the exit that makes the final connection to website.com.


    # ## Onion routing by bouncing your connection between different routers so they''re
    hard to track.


    Commercial VPNs are designed with a specific threat model in mind, and for most
    people looking for a level of anonymity which would allow them to smug subversive
    messages past government censors, for instance, Tor is the answer.


    Tor was born in the 1990s as the Onion Routing project, from the minds of engineers
    at the NSA Research Lab, who found a way of connecting anonymously without compromising
    the parties involved - even if someone is monitoring the network. It''s instrumental
    in keeping communications


    All nodes are organised by organisations and individuals who volunteer their bandwidth
    and resources to the cause of anonymity.


    Routing through Tor can happen in a variety of ways, including plugins, but the
    most common method is using the Tor Browser, which is built on Firefox - the most
    recent alpha version.


    # Set up Tor on your Linux


    The Tor Project offers free installations for Ubuntu and Debian, which is handy
    if you want apt to take care of automatically.


