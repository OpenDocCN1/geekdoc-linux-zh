    * set root=root(/arch-linux-2016.09.02-dual.iso

    * loopback $iso


    menuentry "Arch Linux"

    * loopback $iso arch/x86_64/vmlinuz-linux img_root=$iso arch/x86_64/archio.img
    copyfilrd /modules/$base

    * initrd=/iso/x86_64/archio.img


