    then we can add the information to the main menu, put each distro''s details in
    a file. By using Grub the image, you''ll find a submenu. Now we can use grub to
    build a menu. Create a file in the root of the USB stick called custommenu:


    ```

    cd $uuid

    dub-mkconfig 2>/dev/null -n -i "$LINUX_KERNEL"--initrd "$INITRD" > "/etc/grub/00_header.cfg"

    ```


    for menu in "submenu"; do echo "source $menu"/grub.cfg

