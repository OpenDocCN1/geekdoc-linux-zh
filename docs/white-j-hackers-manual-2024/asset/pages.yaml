  md: '# Remote access


    Set up restricted access


    You can grant different levels of access to the server to different users if you
    wish. If necessary, you can create a limited user on the server - the simplest
    is to use the User accounts system where you then create an account and a password
    and then log into that account once you set it up. Once done, log off and back
    in again


    account, then add the line to the end of your ssh,config file:

    Match User username

    Beneath this line, add any specific rules you wish to allow for that user; you
    can grant the user to login using a password rather than an SSH key.

    PasswordAuthentication yes


    If your server has multiple users set up and you wish to only grant remote access
    to a few, limit access by adding the following lines (make sure these follow any
    Match User lines you define):

    LimitUsers name1 name2

    Alternatively, you could restrict group by:

    AllowGroup group1 group2


    about running a application on the server from your own PC''s GUI? You need to
    enable SSH. This should be enabled on the server, which can be verified by examining
    OpenSSH''s configuration file:

    `sudo nano /etc/ssh/sshd_config`

    Look for a line like X11Forwarding yes and make sure it is not commented out (it
    starts with #). If it is, uncomment it, and then verify the existence of xauth
    on the server with `$ xauth`

    You should find out on your client PC by connecting using the -X switch: `ssh
    -X username@hostname`. The connection is working by launching a GUI from the command
    line, eg: `xclock`. The forwarding starts an xauth process which runs in the background
    mode, allowing you to send commands to the server. You can then open any window.

    It''s also possible to use SSH for the purposes of running a single application:
    using the following command:

    `ssh -f -X username@hostname`. Once you connect, the application is automatically
    terminated when disconnect.


    # Remote graphical access


    If you are interested in accessing every server on your local network, you might
    get lucky, but SSH is set up by default to allow tunnel network connections, giving
    you access to your server over the internet. Before doing this you need to handle
    a few things. First, switch from SSH key to password authentication (see PasswordAuthentication,
    bottom below).

    Second, consider signing up for a dynamic DNS address like my.free – which looks
    like a regular web address, but it is designed to provide an access connection
    to your network (your ideally connection).

    There are other ways to do this, for example using a service like username.duckdns.org:
    it is useful when your IP address changes, the service is designed to update your
    IP address automatically, ensuring you stay connected.

    SSH uses port 22 for its connections - besides automatically within your local
    network, but when you come to connect over the internet you''ll find your router
    blocks the connection. To resolve this, you will need to open your router''s administration
    page and find the forwarding section. Here, set up a rule that forwards any connections
    that use port 22 to your server PC using its local IP address (192.168.x.x).


    ![](img/97fdf078658cf34e6c480f18f1f2014d_136_0.png)


    Once set up, connecting over the internet is as simple as `ssh -X username@yourdomain.net`.
    If you like to tune your server settings further, remember the sshd_config file
    using name and focus on these areas. First, consider changing the SSH port from
    22 to something else, such as 2222.

    Remember to update your port forwarding settings in your router if, or when connecting
    using the switch: `ssh -p 2222` if you plan to use SSH key authentication to get
    the port to use.


    If you are restricted from accessing your server on the local network, only the
    most effective way to do this is by removing the rule from your router or disabling
    UPnP. You can also restrict SSH to only specific IPs: IP addresses–add SeparateListEntries
    for each IP address or define a range:


    There are two ways to restrict X11 connections. One way is to disable it for any
    reason or for specific users (see the Set Restricted Access box, bottom), then
    set X11DisplayOffset to 10 in the file. If you can''t open a window and an error
    occurs, then try other filters or settings with the DISPLAY variable. The value
    might change, but this won''t happen. After editing the sshd_config file with
    your settings, remember to restart the service to enable changes with:

    `sudo service ssh restart`n


    One final thing – if you want to access the X11 Window manager without using the
    -X flag, you need to edit a config file on your client PC:


    ```

    $ nano ~/.ssh/config

    This will create an empty file – add the line: ForwardX11 yes. Save the file and
    be able to login using SSH and launch graphical applications. ##

    ```


