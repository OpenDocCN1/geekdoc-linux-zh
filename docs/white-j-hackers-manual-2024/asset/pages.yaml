  md: '# Security protocols


    # How do we secure the transmission?


    The main reason for using these is because the developers take extreme measures
    to ensure the security of the communication and focused on the privacy of users.
    CryptoCast, for instance assumes that the network is controlled by an attacker
    who can intercept, tamper, and inject into networks.


    To ensure privacy over such networks, CryptoCast uses its end-to-end encrypted
    conversations using a Double Ratchet protocol. The users link their devices to
    peers through account connection and can each other''s client can identify each
    other''s device to prevent man-in-the-middle attacks. After each key exchange,
    it also manages the ongoing renewal and maintenance of short-lived keys during
    the session. All delivered to CryptoCast accounts receive forward secure messages,
    even if they are compromised the messages will still remain secret.


    GoldBug uses end-to-end encryption with multiple layers of cryptography. In addition
    to RSA, it uses the El Gamal encryption and also NTRU, which is particularly resistant
    against against quantum attacks through randomization, where each user has their
    own secret key size, cipher header, iteration and nonce. The encrypted messages
    are sent via a P2P signed channel. The fully signed connection is established
    to ensure that a compromised node is not able to connect.


    Jitsi uses the Public-Off Relay (POR) protocol to encrypt its conversations. Using
    128-bit AES, along with a couple of other functions, to provide audio and video
    encryption. Jitsi also uses the ZRTP protocol when it is establishing a connection
    via the RTP protocol to exchange audio and video.


    +   You can use Retroshare over Tor to hide the connection between you and your
    friends.


    The Qtox protocol uses NaCL cipher library to enforce end-to-end encryption with
    perfect secrecy. This protocol ensures that your users are prevented from making
    connections to non-peers. The client uses Orion routing to store and locate Tox
    IDs to make it easy to find users.


    Retroshare uses GPG (GNU Privacy Guard) cryptography and for exchanging asymmetric
    keys, it establishes an end-to-end encrypted connection using OpenSSL. You can
    also decrypt distributed hash table (DHT) to further improve anonymity.


    # Audio and video calls


    Can we securely transmit media?


    GoldBug has a number of features, that you can use to make audio and video calls.
    The application has a mechanism to secure encrypted files and CryptoCast also
    can


    make real time video calls. The client allows you to record encrypted video messages
    to your buffer that can be viewed immediately or whenever they come within the
    next days.


    CryptoCast can also encrypt files and photos as long as they are under 20MBMB.


    All audio and video calls made in Qtox can be sent through secure channels and
    also host group chats with others. Jitsi is a VoIP client and enables you to make
    calls using the Session Initiation Protocol (SIP). You can use Jitsi to make audio
    and video calls to one or users on both SIP and XMPP networks.


    Retroshare also enables users to make audio and video calls that enable the VoIP
    plugin. One of its application is to share files. Retroshare uses a system, which
    is similar to BitTorrent. Users can share files with friends or ever on the Retroshare
    network. There''s also a search function to find files, anonymously.


    # Verdict


    +   * CryptoCast

    * GoldBug

    * Jitsi

    * Qtox

    * Retroshare


    +   * CryptoCast and GoldBug can secure audio and video calls.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_62_0.png)


    The Hacker''s Manual | 59'
