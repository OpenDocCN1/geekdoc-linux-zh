  md: '# The terminal


    # Terminal:

    Remote access


    Uncover how to run another computer''s Windows applications through your own desktop
    with SSH key access.


    One of the great things about the Terminal is that it allows you to access and
    control another PC remotely using SSH. This is particularly useful if you have
    a PC headless (no attached monitor or input devices), as it enables you to lock
    away while retaining easy access to it from another computer.


    Systems Ubuntu typically use SSH to manage command lines—this gives you access
    from the Terminal to the target PC. But if you need to run an application that
    requires a graphical interface? If your target PC has a desktop environment, like
    Unity, then you could


    Most dedicated servers don''t have a desktop in place to run commands and improve
    performance. Frankly, you can access the GUI of an application on your Windows
    system with SSH, using a process called X Forward.


    This is done using the SSH protocol. First, you need to set up both PCs for SSH—if
    you''re running Ubuntu, the OpenSSH server is already installed, but you


    need to install OpenSSH Server on your server or target PC:

    $ apt-get update


    $ apt-get install openssh-server

    Once installed, switch to your client PC while on the same network—replace `username`
    and `hostname` with your computer''s name or IP address, eg. `nick@ubuntu`.


    You will see a message asking you for the password of the target user. If you
    want to skip this, you can add it permanently to the list of known hosts, so future
    attempts won''t have to prompt this message.


    You''ll be prompted to enter the target user''s password. Once accepted, you''ll
    see the command prompt change to the username and hostname of your PC (the Terminal
    window title also refers to this). This helps you identify which machine you are
    logged into. If you open another Terminal


    another Terminal to enter commands to your own PC. When you''re done, type `exit`
    to close the connection. You can now access the remote server through your own
    PC. How do you


    # Disable password authentication


    SSH servers are particularly vulnerable to brute-force attack. If you consider
    using a password in place, it''s worth disabling password authentication in favor
    of keys.


    Start by generating an SSH key pair on your client PC.


    Hit Enter to accept the default location for the file. When prompted, you can
    specify a passphrase for extra security or leave it empty. By hitting Enter, you''ll
    create your key:


    ```

    $ ssh-keygen username@hostname

    ```


    (Note: If you''ve changed the port number for


    SSH connections, specify if you need to copy the public key to the target server.


    TCP connections allow you to connect to the remote server. Once done, use the
    following command:


    ```

    $ ssh-copy-id username@hostname

    ```


    If you specified a passphrase for the key, you will be prompted for it. You can
    now connect without a password. You can edit the `ssh_config` file to copy the
    line


    ```

    PasswordAuthentication no

    ```


    Once done, you''ll be prompted for your passphrase when logging in, instead of
    the server''s password.


    ```

    $ ssh nick@ubuntu

    # The following public key has been saved in /home/nick/.ssh/id_rsa.pub

    # The public key has been added to /home/nick/.ssh/authorized_keys.

    # The following unique key pair has been saved in /home/nick/.ssh/id_rsa

    # The permissions of the file ''/home/nick/.ssh/id_rsa'' are 600.

    # The permissions of the file ''/home/nick/.ssh/authorized_keys'' are 644.

    ```


    If you subsequently need to access from another trusted server, copy the key (`id_rsa.pub`)
    from your client to the same location on the target using a USB stick.


    +   Generate public and private keys to ensure a secure connection.


