  md: "# # The terminal\n\n# ## ls\nThe key to understanding the console is in the\
    \ path (see Path to bash below), which tells you where you are in the folder structure\
    \ at any time. But how do you know what is in your current directory? Easy: use\
    \ `ls`. The `ls` command lists all the files in the folder you are currently browsing.\
    \ There is a lot of files to list, use `ls -l` to list them at the end of each\
    \ page of files.\n\n# ## df\nMaybe your server problems are to do with disk space?\
    \ Type `df` and you'll get a full breakdown of the size and usage of every volume\
    \ mounted on your system. By default it gives numbers in bytes, but use `df -h`\
    \ for human-readable sizes will be reported in megabytes, gigabytes or terabytes.\n\
    \n# ## cat\nA command you'll use if you're following tutorials you find online\
    \ - and you're not sure what to do - `cat` is short for concatenate and is used\
    \ to combine files. In its simplest form it is to take file1 and `cat file1 file2`\
    \ and merge them into file3, but it can also be combined with other commands to\
    \ create a new file based on searching for patterns in the original.\nQuite often\
    \ you use `cat` simply to explore a file - if it doesn't exist, `cat` will write\
    \ whatever you type to the screen. So `cat` as a way of writing text in a file\
    \ and displaying the results in the terminal. This is because `cat` is not destructive\
    \ - you won't accidentally use `cat` to change the original file where it was\
    \ created.\n\n# ## grep\nAs computer commands there are far more fantastic than\
    \ the name for them. `grep` (a variant of global regular expression) is how you\
    \ ever find exactly what you want in a Linux list. But what? `grep` is a useful\
    \ utility for finding patterns in files. Want to find the specific line about\
    \ a book in question? `grep \"book\".` will allow you to search for text in multiple\
    \ files. Using `grep \"keyword\" text` will find every text line in each file\
    \ you are searching for. Now you know how to `grep` right?\n\n> > Nano is not\
    \ the only text editor, but it's the easiest to use.\n\n# ## 15 nano\nWhen you're\
    \ using a graphical interface like a desktop environment in Windows, macOS or\
    \ Linux, an application like Text Editor or Task Manager might work. They will\
    \ show a list of applications and give you details about how much CPU, memory\
    \ or storage they are using. It's a bit troublesome when you're running a program\
    \ that's hanging and you don't know why. In a similar way, you can get a table\
    \ of running applications in the Linux terminal that does the same thing but much\
    \ better.\n\n# ## 16 kill\nUsing top you can figure out which process is using\
    \ your CPU cycles, but how do you stop it without a right-click? End process?\
    \ use the command `kill` followed by the process name. If you want to be sure\
    \ and kill\n\n![](img/97fdf078658cf34e6c480f18f1f2014d_141_0.png)\n\n```\nnano\
    \ 2.4\nfile: hello.py\nLine 1 of 8\n\ndef hello():\n    print(\"Hello World\"\
    )\n\nif __name__ == \"__main__\":\n    hello()\n\n^O Write Out  ^G Get Help  ^W\
    \ Search  ^K Cut Text ...\n```\n\n# # Path to bash\n\nWhen you use a terminal\
    \ inside Windows, it can be a bit daunting. The words that it is in the flashing\
    \ of the cursor will tell you where you are.\n\nThe first name of the list is\
    \ the user you're logged in, and it is followed by an '@' sign. The second word\
    \ is the name of the hostname.\n\nmachine you're logged into. If you use a 'terminal'\
    \ on that, usually the username and hostname are shown. So you'll see 'myname@hostname'.\
    \ When you log into a remote server, they'll be very different. This information\
    \ is followed by a colon which is followed by the path to the directory you are\
    \ in.\n\nfollowed by a dollar sign. When you use a terminal, you'll see your '$username@hostname$'.\
    \ The '-' indicates you're in the home folder of your user. If the hostname is\
    \ replaced with a '#', you're using the root user. Use this for moving around\
    \ and watch how the path changes as you do.\n\n142 | The Hacker's Manual"
