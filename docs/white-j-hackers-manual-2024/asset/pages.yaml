  md: '# Security


    # Secure chat


    While not particularly paranoid, we wouldn''t want anyone to eavesdrop on our
    playful banter about the Great British Bake Off with our mates.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_61_0.png)


    # How we tested..


    We''ll look at each instant messenger''s mechanisms for security and privacy,
    and whether any of these has a negative effect on the usability of the application.

    We''ll also watch out for applications that are cumbersome to use and run experience
    in their efforts to ensure privacy.

    Some users that are exchanging sensitive information probably won''t mind a hit
    on usability if it ensures privacy, but the majority will want to jump through
    too many extra hops.

    We''ll also account for IMs that offer the same convenience and features as their
    popular counterparts, as IM''s reputation and supported platforms can be a key
    factor. Similarly, if it is easy to switch to a new app if the installation is
    long and down.


    ver users, instant messaging (IM) has evolved into a fully-fledged, feature-rich
    medium. Simple text communication, a typical IM session includes the exchange
    of images, audio and even video streams. The primary users of IM have also been
    adopted for use by companies for farewell. Both kinds of users have a different
    set of requirements and a plethora of messaging services that have popped up to
    settle the growing demand for instant messaging.


    in bid to compete all popular IM services use their own home-brewed proprietary
    protocols. One thing is that Facebook seeks to offer a better communication experience
    to users, these publicly accessible services route all users via central servers
    that can


    be supposed. While IM clients and services are a dozen, many don''t offer the
    level of security and privacy that makes good sense in this post. We''ll look
    at some of the best options available to users that are able to converse online
    without the fear of being snooped.


