    # # Working with Fdisk


    The fdisk command is traditionally used to change partition tables, but with the
    `-l` switch it can show more detailed information about a particular drive. It
    is useful to identify the device `/dev/sda` for an external drive, for example:
    `fdisk -l /dev/sda`.


    The partitions are listed in the order they appear, not their position on the
    disk table. For a detailed look—see the partition table in disk order—this is
    the case. Examine the Start and End columns to find out where each partition exists
    on the device.


    Two other commands—`lspci` and `lsusb`—provide information about other hardware
    devices. The `lspci` focuses on internal hardware, while `lsusb` looks at what
    is connected to your PC''s ports.


    ```

    0000:00:14.0 USB Controller: Intel Corp. USB Controller (rev 05)

    Kernel driver: xhci_hcd

    0000:00:14.0 USB Controller: Intel Corp. USB Controller (rev 05)

