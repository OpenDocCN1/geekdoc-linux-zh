    # ## Permissions primer


    Another important part of securing your Linux system is setting permissions. Files
    and directories are files and directories. Every file must be owned by a user
    identifier who has a unique user ID (UID), and each user must also be assigned
    to at least one group, which is a collection of users that has been established
    by the system administrators.


    Users may be managed by groups. Like users, groups have unique identifiers called
    groups IDs (GID). The accessibility of a file or directory depends on its UID
    and GID. Users get access only when they are given permission to run. Permission
    is granted because the user belongs to the file''s group or the file is accessible
    to all users. The exception is the root user who is allowed to access all files
    in the system. Files, in Linux have three kinds of permissions assigned to them
    — users, groups and others — that determine whether a user can read, write, or
    execute a file.


    You can view the permissions of a file or directory with the `ls -l` command.
    When modifying permissions there are two ways to modify them: with numbers or
    with letters. Letters are easier to understand for beginners, but numbers are
    better once you get used to them. Table 1 (over the next page) shows the permissions
    of some example files.


    For example, `chmod +x script` executes the same thing as `chmod 755 script`.
    In similar, `chmod 744 file` sets permissions of the file.


    Arguments can''t be used to define permissions. For per groups, you must use access
    control lists (ACL) that allow you to specify permissions for multiple users and
    groups. While you can define them manually, graphical tools like E make the process
    easier and help you manage a lot of them. You can install ACL to fine tune the
    access permissions for each individual file. The tool is part of most modern desktop
    distributions. In Linux, let allows you to lock sensitive files such as the ones
    that have password protection. The file should be owned by the root user with
    644 permissions.


    > **Tip** From a security point of view, keep it more restrictive, and only allow
    elsewhere as a last resort.


