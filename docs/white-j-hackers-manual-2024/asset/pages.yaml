    regular, and 36 months for LTS (every two years).


    # ## A distro with humanity in mind


    With Mandrake making the entry, the early 2000s of this point was well established,
    well regarded and known it became the basis for hundreds of Linux distros. But
    it was only one mention: Ubuntu, released in 2004 by South African Mark Shuttleworth,
    who proved himself the self-appointed benefactor dictator for life. The Ubuntu
    Foundation was created in 2005 as a philanthropic project — to provide quality
    open-source software, with Canonical as the commercial arm.


    Ubuntu as a branch of Debian has seen over 200 distros fork from it, while Ubuntu
    has the share of all desktop Linux distros — this is nothing extraordinary.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_29_0.png)


    +   * With big bucks, comes big fools! Here''s the Red Hat HQ sniping its old
    logo.


