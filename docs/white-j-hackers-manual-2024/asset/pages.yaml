    # Distro developments


    A single kernel enabled a good number of Linux distributions to become the base
    for a whole new


    After looking into the development of the Linux kernel itself and the surrounding
    supporting software, let''s learn how Linux distributions (distros) were first
    developed and branched into a wide-ranging ecosystem.


    Distros enabled the use of the Linux kernel to grow rapidly. Not only did they
    ease the installation of Linux (which was once a complex process compilation,
    gathering the right tools, creating filesystems by hand, and bootloaders from
    the terminal on systems with limited resources), but also became the base for
    a new distro, tailored for a new era of use.


    # Primordial soup


    As Linux V0.01 was the first distribution of Linux - not by modern standards,
    it was lacking in every department - created by J Linus Torvalds called Linux.
    Released in the early of 1991, it came on 2.5-inch floppy disks, and required
    a HEX editor to get running. One was a kernel boot disk, the other stored the
    RO tools.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_26_0.png)


    In the early days of Linux everything changed rapidly. Distro development was
    quickly adding basic features, and people were trying to get the best out of a
    package-based OS. x86 MCC Linux was released in March 1992 as the first package-based
    Linux with an installer, and was made available through an FTP server.


    X - the standard Unix window system was ported, and TAMU Linux was released in
    May 1992 with the first TCP/IP network stack.


    While all of these were not as notable as the first distros, they can''t last
    the same. Slack for Softending Linux (Suse), also released in May 1992 is the
    only distro to still be in use today.


    However, because of its shortcomings (bugs and a challenge to execute an executable)
    inspired the creation of two of the longest-running, and most influential distros:
    Slackware and Debian.


    Nowadays, many of these distros appear, although


    maintained by individuals, groups, or businesses. Once they were established,
    stable and popular, offshoots branch from these roots offering many new specialisations
    or features. This creates a number of base distro, formed from the original package
    manager and software repositories. You can date all distros back to an initial
    root. Some branches sprout and die; the other group maintains it or there is no
    wider interest. Some branches become so popular they create a whole new world,
    the bases for a further expansion.


