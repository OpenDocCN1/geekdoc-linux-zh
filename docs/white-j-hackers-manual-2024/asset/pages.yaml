  md: "# # Hacking\n\n> > As the output of labeltrace is in plain text format, you\
    \ can use any text processing tool to trace a file, as grep, sort and sed etc.\n\
    \nIn this case, the `syscall_exit` point is more useful, because it also shows\
    \ the return value of the `(2)` system.\n\n```\n```bash\nstrace -tt -traces=demos\
    \ --session=2016015-154836 2>/dev/null | grep syscall_exit | grep 'ret = \"-1'\n\
    ```\n```\n\nIf you read the man page of `(2)`, you'll find a return value of -1.\
    \ This error means that such errors might be the root cause of the problem. The\
    \ next sections will talk about tracing your code.\n\nLearning Ltrace: How to\
    \ trace your C code is relatively easy, it involves several steps. The first is\
    \ creating your own trace event. As you will see, each trace event needs a provider\
    \ name, a tracepoint name, and an ID for list of fields.\n\nThe initial version\
    \ of your C code you want to trace, was as fibo:\n```#include <fibonacci.h>```\n\
    \n```\n```c\\int fibonacci(size_t n) {\n    if (n == 0)\n        return 0;\n \
    \   }\n    if (n == 1)\n        return 1;\n    }\n    if (n == 2)\n        return\
    \ 1;\n    }\n    return fibonacci(n-1)+fibonacci(n-2);\n}\n```\n```\n\n```\n```bash\n\
    strace -tt -traces=demos --session=2016015-154836 2>/dev/null | grep syscall_exit\
    \ | grep 'ret = \"-1'\n```\n```\n\n+   - **metadata**: Common Trace Format (CFT)\
    \ packetized metadata (LE)\n\nAs you can see, the channel of `channel_0` is 0x00000000.\
    \ The index of `channel_0` is 0x00000000. The block size is 32568377.\n\nAs you\
    \ can see, the labeltrace file is significantly smaller. However, both files are\
    \ stored in the CFT format. So if you want to trace your files, you can use the\
    \ LabelTrace utility to generate the trace data.\n\n# ## Analysing trace data\n\
    \nThe LabelTrace utility will be used for parsing the trace files. The first thing\
    \ is to use `labeltrace-strace -tt -traces=demos --session=2016015-154836` which\
    \ contains the full contents of the CFT file you want to trace. The next step\
    \ is to filter the output in what you want to get closer to the information you\
    \ need.\n\nAs the output of labeltrace is plain text, you can use any text processing,\
    \ using grep and sort, to extract your data. The following code below prints the\
    \ top 10 lines of all events:\n\n```\n```bash\nstrace -tt -traces=demos --session=2016015-154836\
    \ 2>/dev/null | grep syscall_exit | grep 'ret = \"-1'\n```\n```\n\nYou can see\
    \ the output of both (commands, output). The first one shows the number of entries\
    \ in the session 2016015-154836 is 352739. After that you can count the number\
    \ of system calls:\n\n```\n```bash\nstrace -tt -traces=demos --session=2016015-154836\
    \ 2>/dev/null | grep syscall_exit | grep 'ret = \"-1'\n```\n```\n\nEach system\
    \ call has an entry and an exit point, which you can trace to see exactly when\
    \ it was executed and when it has finished its job. For the writer `(2)` system\
    \ call, there exists `syscall_entry_write` and `syscall_exit_write`.\n\nAs an\
    \ example file is LibreOffice. The following command will show which files were\
    \ opened by the system calls:\n\n```\n```bash\nstrace -tt -traces=demos --session=2016015-154836\
    \ 2>/dev/null | grep syscall_exit | grep 'ret = \"-1'\n```\n```\n\nIn trace of\
    \ fibo, you will need the Ltrace code, to create a new trace event:\n\n```\n```c\n\
    #undef TRACEPOINT_PROVIDER\n#define TRACEPOINT_PROVIDER \"FIBO\"\n```\n```\n\n\
    ```\n```c\n#ifndef TRACEPOINT_HEADER_TO_H\n#define TRACEPOINT_HEADER_TO_H\n#define\
    \ TRACEPOINT_TP_H\n```\n```\n\n```\n```c\nTRACEPOINT_EVENT(\nfibo,\ntracing_fibo,\n\
    TP_ARGS(\nsize_t input_integer),\nTP_FIELDS(\nctf_integer(size_t input_integer,\
    \ int input_integer)\n))\n```\n```\n\n> Quick\nThe view command can help you review\
    \ the trace records if it executes after tracing and before ltrace. It executes\
    \ in the background.\n\n118 | The Hacker's Manual"
