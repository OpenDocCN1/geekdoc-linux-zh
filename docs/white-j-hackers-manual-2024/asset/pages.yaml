  md: '# OpenELELEC:

    Media streamer


    Crack out the hammer, we demonstrate how to build your smart-streaming stick using
    a Raspberry Pi for personal and internet media.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_77_0.png)


    +   > OpenELELEC runs an initial configuration wizard to get you connected - you
    can build it for yourself if you have a Raspberry Pi and want network capabilities.


    | Name | Status |

    | --- | --- |

    | TP-LINK C430R,v2, 192.168.1.65 | ready |

    | SKY59273 | idle |

    | PLUSNET-3TF6KG | idle |


    Why not opt for an excellent set-top box that you can use for the open-source
    Kodi center software (https://kodi.tv), you can access locally stored personal
    media on demand, watch a wide range of internet services seamlessly.


    # Choose your hardware


    The cheapest way to build an OpenELELEC streamer from scratch is to buy the Raspberry
    Pi. There''s one slight catch: the cheapest version has only one USB port, so
    you''ll need a powered hub and Wi-Fi adapter for the initial setup. You''ll need
    a Pi Zero (orless), case, and Wi-Fi adapter. If you''re willing to spend a bit
    more, the Raspberry Pi Model B+ ($25), the Pi 2 Model B ($36) or the Pi 3 Model
    B ($45) have built-in Wi-Fi and Android, microSD card slot. All come with Ethernet
    for networking, four USB ports and full-size HDMI port; choose the Pi 2 or 3 for
    a powerful media server.


    The success of Kodi - formerly known as XBMC - has led to the creation of Kodi-focused
    distributions. If you''re looking for a full-blown Ubuntu-based distro with Kodi
    sitting on top of it check out LibreELEC (https://librelec.tv).


    Kodi itself is overkill for most people, which is where OpenELELEC (https://openelec.tv)
    comes in. This is an embedded OS built for Kodi. Optimised for performance and
    designed to be simple to run and administer. If you''re using an underlying OS
    via SSH, but for the most, you can''t restrict yourself exclusively to the Kodi
    environment.


    For four hardware builds are available: 32-bit and 64-bit Linux, Nvidia and Android
    graphics. Two are for Raspberry Pi TVs and others, and the other for everything
    else, including the Pi Zero and the new Zero W, and one is final for Freebuild
    for Apple TV 1 boxes (see http://chewett.openelec.tv/apple) as well as ARM-based
    hardware (http://bit.ly/armodi).


    You''ll need a keyboard for the initial configuration of OpenELELEC, but once
    set up you''re able to control OpenELELEC remotely via your web browser or SSH.
    You also need Wi-Fi to access your media. If you have a small (sub-50GB) collection,
    then just attach a USB hard drive or store your media on a NAS and connect over
    the network. Note that the option will also slow down considerably, and you might
    experience buffering, particularly if connected via Wi-Fi.'
