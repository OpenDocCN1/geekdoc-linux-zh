  md: '# # VirtualBox


    crucial advantages: snapshots. Snapshots let you take one backup of your guest
    at a specific point in time. You can then proceed to experiment and revert to
    the snapshot to undo all the changes you have made.


    You can create snapshots while your machine is powered off or running - just select
    Machine > Take Snapshot to do so. Give your snapshot an identifiable name, and
    add a description, then click ''OK''.


    When you take a snapshot, VirtualBox starts recording changes in a different file.
    If you delete a snapshot, those changes are merged back into the main file (or
    the base image), snapshots are lost unless you create an additional snapshot when
    prompted. VMs support multiple snapshots, and you can move between them, or create
    multiple snapshots from a single guest.


