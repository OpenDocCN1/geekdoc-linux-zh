  md: '# # Hacking


    # # Grub: Boot ISOs from USB


    An easy way to avoid a bag full of DVDs by copying them all to one USB stick,
    with a convenient menu to pick which one to boot.


    Almost all the distribution (distro) ISO files on cover DVDs are what known as
    hybrid files. This means that not only can they be copied to a CD or DVD and this
    USB stick will then boot as if it were a DVD. This is a handy way of creating
    a bootable USB without having an optical drive. Each ISO requires a USB drive
    to drawback: With USB sticks holding tens of gigabytes costing only a few pounds,
    and small drives becoming harder to find, this is a way to save both space and
    in your pocket or computer bag. It wouldn''t be ideal to have more than one ISO
    on the same stick and choose which to boot? Not only is this both faster and more
    compact than a handful of DVDs.


    The good news is that this is possible with most distros, and the clue to how
    to do it is on our cover DVDs each month. We used to painstakingly unpack ISOs
    onto the DVD so we could boot them and then we included scripts to reconstruct
    the ISO for. Using Grub to boot the DVD to a disc, which has features that make
    booting from ISO files possible. The main disadvantage of this approach,


    least for the poor sap to get the USB working, is that different distros need
    to be treated differently and the options to boot from ISOs are rarely documented.


    In the next few pages, we will show you how to do this: to set up a USB stick
    in the first place and the options you cannot get from our own distro drives.
    We will also show you how to deal with less co-operative distros.


    # ## Setting up the USB stick


    First, we need to format the stick. We will assume that the stick is set up with
    a single partition, although you could use the first partition of a multi-partition
    layout. What you cannot use is a stick formatted NTFS. If you use ext16 or ext4,
    then the choice of filesystem is largely important, as long as it is Grub compatible.


    We will use FAT32 (there''s no point in using the journaling ext3 or ext4 on a
    flash drive). Use whatever fits in your drive which means we can download and
    extract ISO images from a Windows computer. Whatever you give the filesystem a
    label, we will use MULTIBOT as it will be important later.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_119_0.png)


    1 | The Hacker''s Manual'
