  md: '# How to build your own custom Ubuntu distro


    Why settle for what the distributions have to offer? Michael Reed looks at Cubic,
    a tool for creating your own custom resell based on Ubuntu.


    The art of beauty of Linux is the freedom of deploying distributions that others
    offer, but when you want to make things differently, why not make your own version,
    or ''spin''? And we''re going to look at how to use Cubic to modify the standard
    Ubuntu installation ISO and boot from it in terms of content and experience.


    As for the difficulty? If you can install packages from the command line and boot
    an ISO in a virtual machine, you will find it easy to get started with Cubic as
    the default. In our experience, we''ll start with the simplest example of adding
    some new packages and rebuilding the ISO.


    Once you''re working, we''ll show you how to customize it by making LXDE the default
    desktop environment, customizing that environment and adding PPAs so that your
    own spin feels like Linux and looks and works.


    # Cubic


    Cubic allows you to run Ubuntu or Linux Mint without any of their dependencies.
    If you are running another distribution, you can use Cubic and follow this tutorial
    to rebuild Ubuntu in Vm. By installing from PPA, you can locate Cubic on Launchpad
    (https://github.com/cubic-project/cubic) and install it using sudo apt-add-repository
    ppa:cubic-team/release.


    The next step is to get an up-to-date ISO to install with. We''ll use Ubuntu 21.04,
    but 20.04 (Long Term Service) is a good choice as well. We''ll use Launchbox which
    works as a good GUI app or run it in a terminal for extra information. When running,
    Cubic uses no-super


    ![](img/97fdf078658cf34e6c480f18f1f2014d_111_0.png)


    We added the LXDE desktop to a standard Ubuntu installation. We also added a default
    backup for all new users.


    Here are some tools that you will need:


    The first phase of the Cubic interface enables you to specify the project directory.
    Cubic doesn''t run any tests for free space, so you need to leave a lot of space
    for the unused ISO. Ubuntu Desktop installation is mandatory.


    The recompiling of an ISO is time-consuming and SSD works much faster than hard
    drive. One way of speeding things up is to link the project between different
    builds.


    This way, decomposition of the process only has one part, and once you''ve made
    changes delete the folder and start again with a true start at modifying the ISO.


    Having specified the directory for the project, press Next to the next page. Click
    the icon on the filename field and select the base ISO you want to use as your
    starting point for customisations. Once you''ve done that, most of the fields
    on this page will be filled in automatically, but you can safely change things
    here.'
