  md: "# # Multi-booting\n\nusing Windows, you can manage these entries by following\
    \ the setting in /etc/grub\n\n```\nGRUB_DISABLE_PROBER=false\n```\n\nAs the probe\
    \ function also works, if you do not want this to boot Windows, you should rename\
    \ those entries before the others, something like 'disabled-windows', or delete\
    \ the windows entry from your grub.cfg file to disable it.\n\n# # Sharing space\n\
    \nSo we have distros that co-exist in harmony, but what about our data? Do we\
    \ really need separate home directory for each distro? The answer to that is:\
    \ yes. While we could share a filesystem for /home and share the same user name\
    \ and home directory, this is risky. Programs store their configuration in your\
    \ home directory, and if two distros have different versions of the same program\
    \ might happily read the settings from an older version and update them, but then\
    \ when you switch back to the older version, it could cause serious problems.\n\
    \nOne solution is to have a separate filesystem for each distro, these are what\
    \ we use to avoid all conflicts. So you can install each entirely separately,\
    \ but also have your home directory in your main directory, just symlink. In this\
    \ case you will have a lot of shuffling to do before you get used to it.\n\n![](img/97fdf078658cf34e6c480f18f1f2014d_110_0.png)\n\
    \n> > You may find your installer uses less than all of the available space for\
    \ your installation, needing to resize partitions in GParted\n\nTo do this we\
    \ need to go to GParted and resize your partitions to make a large partition for\
    \ your data. Then edit /etc/fstab on each distro to mount this partition. We can\
    \ also bind folders entries to other distros, like create a directory in /mnt/common\
    \ and create symlink here in your other distros, for example:\n\n```\n$ ln -s\
    \ /mnt/common/user/home /home\n$ ln -s /mnt/common/user/Music /home/Music\n```\n\
    \nAnd now on. When you use a file in Documents, it will actually go to /mnt/common\
    \ and will be available for all your distros. This assumes that you are the only\
    \ user of the distros.\n\n# # Who owns what?\n\nNow we have to tackle the issue\
    \ of file permissions and ownership. The goal is to make sure that the directories\
    \ in /mnt/common have the same owner uid:\n\n```\n$ sudo chown -R user:user /mnt/common\n\
    ```\n\nYou may expect this to work for all the distros if you created them with\
    \ the same name in each of them, but Linux filesystems are not shared because\
    \ users might use different UIDs. The goal is to use the same UID for all distros.\
    \ So check your UID in each distro with the same id, just run a command in the\
    \ main one. If they all match, then you will not need to change matching UIDs\
    \ by editing /etc/fstab. We may need to edit this file, to prevent a mistake caused\
    \ by logging in as the user with the root id.\n\nFind the line for your user,\
    \ which will look like this: \n\n```\nuser:user /home /mnt/common/user/home\n\
    ```\n\nThe first number is the UID. Change it to match the other and so on. We\
    \ need to change all files owned by the old UID to the new one. Everything in\
    \ your home directory should be owned by you to take the brute force approach\
    \ and choose everything in there\n\n```\n$ sudo chown -R user:user\n```\n\nNow\
    \ you can switch between distros every time you reboot, with each distro naturally\
    \ and at full speed, and with access to all your data.\n\n![](img/97fdf078658cf34e6c480f18f1f2014d_110_1.png)\n\
    \n```\n# use 'bind' to persist the universally unique identifier for a\n# device;\
    \ this works if even added and are removed. See fstab\n\n# file system <mount\
    \ point> <type> <options>\n# on /dev/sda1 during installing\nUUID=57c4d5d6-75f5-45f7-a33d-b22da9880054\
    \ ext4\nerrors=ro,rel,nofime\n/dev/sda0 /media/photo ext4 none 0 0\n/dev/sda2\
    \ /mnt/common ext4 noat 0 0\n/dev/sda3 /home ext4 noatime 0 0\n/dev/sda4 /home\
    \ ext4 noatime 0 0\n/dev/sda5 /root ext4 defaults 0 0\n/dev/sda1 /windows ntfs\
    \ 0 0\n```\n\n* For additional entry to add to /etc/fstab to mount your root'\
    \ partitions."
