    # ## Working with files and folders


    You can now list and navigate your file system, but what about doing things, like
    moving and copying files? You''ll find a of different commands and the tricks
    you''ve learned will help you in good stead.


    Let''s start by looking at `cp` (copy) and `mv` (moving) files. The same options
    apply to both commands. The basic syntax is `cp [options] source [destination]`
    and `mv [options] source [destination]`. To avoid overwriting an existing file,
    use the `-i` flag for the command:


    > cp file.txt ~/Documents/backup.txt


    The following command creates a copy of the file with the same name. If you want
    to create a copy of the file with the same name, use `cp file.txt ~/Documents/backup`.


    To delete a file, use `rm`. Be careful: there is no trash bin! Once you delete
    a file, it''s gone for good. If you''re not sure you want to overwrite a file,
    use the `-i` flag like this:


    > rm file.txt


    You can also remove folders using `rm`. Here, you need to include the recursive
    flag `-r`, which ensures the folder along with all its contents is corrected and
    arranged in its original locations relative to the parent directory.


    If the folder is empty, the `rmdir` command will work. If it is not, then the
    `rmdir` command will copy the contents of the folder into it.


    You can use the `rm` command to delete a single directory: eg `rm -r foldername`.
    The `rm` command deletes folders only empty ones. If you want to delete a folder
    and all its contents, use the `-r` flag.


    You can also create new folders with `mkdir` - simply type `mkdir foldername`,
    replacing foldername with your chosen name. Use the `touch` command to create
    an empty file, such as `touch config.yaml


    Wildcards are very useful when searching. The question mark `?` and asterisk `*`
    are characters. Using single question marks matches any character except spaces,
    such as `*Document*`. Using `*Doctor*` will create two files named `Doctor` and
    `Who`. Using `mkdir Doctor*` will create two folders named `Doctor` and `Who`.
    Using `mkdir Doctor*` will get you the folder you want.


    We are finishing today by showing how to run multiple commands on a single line.
    The `&` symbol does that, but you can use the following to update your reports
    and update all available software: `sudo apt update && sudo apt-upgrade`


    `&&` is the AND command which will only run the second command if the first command
    completes successfully. If the first command failed then if you want to run the
    second command after the first regardless of what happens, use `;`


    ```

    sudo apt-update && sudo apt-upgrade

