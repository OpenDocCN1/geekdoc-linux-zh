  md: '# # Hacking


    # # Ubuntu: Linux on a tablet


    It''s time to dig deep and discover how to successfully install a working on a
    low-cost Windows 2-in-1 tablet.


    Are you jealous of the sudden proliferation of cheap Windows 2-in-1 tablets? Wish
    you could run Linux instead? Smartphone capability matters. But we are teaming
    up with the Octarius M10 tablet which is expected to be under £200; why pay more
    when it turns out you can run with a fair amount of Linux on one of these cheap
    devices?


    These devices use a low-end Intel Atom processor collectively as Bay Trail, and
    we want to source one, which is the focus of our tutorial. The device in question
    is a Lenovo X10, which features Atom Z3350 processor, 2GB RAM, 32GB internal eMMC,
    plus additional microSD slot, USB ports and multi-touch support. It can be bought
    with detachable keyboard and tracked through the likes of ebay.com for under £150.
    These devices come with Windows 10 pre-installed, but it is possible to run both
    or first flavours of Linux on them.


    In a perfect world, you''d create a simple live USB, plug it in, and out you go.
    But there are a number of obstacles. First, you have to boot a 64-bit ISO with
    a 32-bit EFI - most distributions offer a 64-bit or 32-bit ISO with traditional
    BIOS; so you need to convert the USB drive without losing data. Second, you need
    to find the latest kernel that supports it which is not particularly capable out
    of the box. But with some work (no, if you''re working with limited resources
    and time) you can still get Linux running in natively and setting up a boot USB
    using the Bay Trail-based kernel.


    You''re likely to find enthusiasts such as John Wells (www.johnwells.com), who
    has detailed guides and Downloadable scripts to get Ubuntu running on an Android
    TOGOT. Another good resource is the DebianWiki (https://wiki.debian.org/Installing_Debian)
    where you''ll find lists of features, what works, what issues out for and handy
    links and downloads for further information.


    Sadly for us there is no one-stop shop for the Linux tablet we had to do a bit
    of experimentation before finding the best way for us Experiment with Linux support
    over the page.


    # ## Install on Linux


    We decided to go the Ubuntu route when it came to the hand of Lenovo X10 tablet.
    We installed a modified version of Ubuntu (14.0.3) that is not only a live CD,
    but also as an installed. We experimented with Ubuntu - 15.10 and a daily build
    of 16.04 - but the live drives work poorly, and it seems impossible to get them
    working, as you''ll discover out later. So, the simplest and easiest way to install
    Linux on your Z3350-powered tablet is to install Ubuntu''s official ''Ubuntu 14.0.3
    LTS'' release. This comes with free UEFI support and includes custom-drivers for
    most of the devices


    However, there''s no touchscreen support, so you''ll need a mouse and keyboard
    to connect and touch.


    Go to ubuntu.com on your main PC and check out the latest release (2012 August
    15) date which is listed out for the X10. Then click the class and select the
    ''download'' link to get Ubuntu-14.0.3-desktop.iso. This is the file you will
    use.


    Once done, we have a flashable USB drive in order to write the ISO image and create
    the USB drive. The simplest way to do this is to use Ubootin select your flash
    drive, create the USB drive. Then plug it into one of the USB ports, restart the
    tablet by holding the power + buttons together. After a few seconds or so you
    will see confirmation that boot menu appears to appear - when here, you''ll need
    to tap Boot or Manager. Use the key to select the EFI USB drive, then Try Ubuntu
    without installing, and return again.


    > Quick tip

    Ian Manson has a lot of work ahead of him 14.0.3 for Z3350-powered devices. If
    you''d like to see how he did his work - we recommend visiting his website: www.linuxmans.com.au


    When you''re ready to back up the entire disk to your drive, format a microSD
    card for storing the restoring the backup of Linux if required. Note: If the microSD
    card isn''t detected by the device, you''ll need to use a microSD card reader,
    which you can get from the Microsoft software.


    With everything in place it''s time to play. If you''re very sorry, your tablets
    aren''t identical, so searching for your tablet model and a combination of relevant
    terms (''Linux'', ''Ubuntu'' and ''Debian'') to see what you can find.'
