    # # Terminal: Set up partitions


    It''s time to reveal everything you need to know about setting up a hard disk
    from partitioning, formatting and setting permissions.


    Core hard disk skill is important. You''ll have encountered this during the Ubuntu
    setup, or there may be times when you need to repartition a drive. In the first
    time, use the `q` command to exit without saving changes. There are two tools
    you can use: `fdisk` and `parted`. Former, `fdisk` is better, and one of its strengths
    is that any changes you make are not immediately written to disk instead set up
    and use the `w` to write your changes to disk. If you make a mistake, just quit
    and your drive is left untouched.


    however, you''ll need parted instead (see Box Resize partitions for details).


    # ## Partition with fdisk


    Let''s begin by using fdisk to list the disks on your system:


    Each drive shows `sda`, `sdb` and so on - will be displayed after the other. To
    restrict its output to a specific disk, use `sudo fdisk /dev/`. For example, `sudo
    fdisk /dev/sda`. You will see the disk size in GB or Ti, with the number of partitions
    and sectors also. You''ll see the sector (typically 512 bytes) partition table
    (MBR or GPT) disk which you can identify for the purposes of this tutorial:


    Beneith you will see a list of all partitions on the drive, complete with start
    and end point (in bytes), size and type (such as swap or ''Windows recovery'').
    Armed with this information you will be able to identify each drive. This is done
    as follows:


    ```

    sudo fdisk <dev/sd>

    ```


    ![](img/97fdf078658cf34e6c480f18f1f2014d_133_0.png)


    # ## Take a drive backup


    Partitioning is dangerous - if things goes wrong or you make the wrong choice
    you could end up wiping your drive of any existing data.


    If you''re planning to partition an existing drive, take a full backup before
    first. There are numerous ways to do this particular job, but it''s hard not to
    lose data. You can use any tool to partition to new drives, but here we''ve focused
    on using it to create an image file of:


    an entire drive or partition: use the following syntax:


    ```

    sudo dd if=/dev/sdX of=/path/to/backup/image

    ```


    Note: /media/username/backup is the path to your backup drive. The dd application
    also has an option to control file size compression and speed when creating the
    image. If you''re planning to create your system image, you''ll need to first
    boot from your Ubuntu live CD and then run it from:


    While you''re at it, you can also use dd to back up only the drive''s Master Boot
    Record or MBR partitions:


    ```

