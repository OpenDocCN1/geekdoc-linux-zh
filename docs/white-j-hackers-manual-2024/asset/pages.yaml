    0000:01:02.0 USB Controller: Intel Corp. USB Controller (rev 05)

    Kernel driver: xhci_hcd

    0000:01:03.0 USB Controller: Intel Corp. USB Controller (rev 05)

    Kernel driver: xhci_hcd

    ```


    Each connected device—which bus is it,its device ID and ID, plus some detailed
    information (type, manufacturer)—is listed. Use the `-v` switch for a more detailed
    view and don''t forget to use `lsmod` to ensure you have all connected hardware.


    fdisk provides information in verbose mode—lsmod -v` lists each device type and
    capabilities—and rather useful which kernel driver is used. However, it lists
    pages of partitions and detailed information about each device. Navigating this
    by is exhausting, so by identifying the device you want to check in more detail
    using `lsblk`.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_132_0.png)


    Use the `-l` switch with the ldisk command to generate a more useful view of your
    system''s internal-hardware drive


    > Make a note of its hardware and device number, then use the following command
    `sudo ldisk /dev/sdX` with your target device. Replace `X` with your device number.
    The list is then output to the selected output device.


    Another tool for considering more information about your hardware is the dmidecode
    utility, which lists information stored in your PC''s BIOS and presents it in
    a more useful format. For example, you can use `dmidecode -t memory` to see the
    maximum amount of memory your PC can support.


    The dmidecode command allows you to see more hardware details. Use the `-t` switch,
    which allows you to filter by type. For example: `sudo dmidecode -t memory`


    Note that this tool contains BIOS-information which isn''t always accurate, so
    dmidecode is a potentially useful resource, but be careful if things don''t stack
    up (it incorrectly reports only of your RAM). Treat it with care and it adds another
    layer to your system information.


