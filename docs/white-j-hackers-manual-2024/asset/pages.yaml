  md: "# # Hacking\n\n>> installing Grub to a partition is considered less than ideal\
    \ days, but we also really want to keep it out of our boot. This means that when\
    \ an error appears that your grub won't get updated, in fact it won't be booted\
    \ at all, so you will need to put it into your primary directory and run-grubcfg\
    \ or update-grub to pick up the changes.\n\ndefault counts for the standard boots\
    \ (the first item). You can also change the timeout with the GRUB_TIMEOUT and\
    \ the default kernel options in GRUB_DEFAULT. By editing the options, you can\
    \ read the Grub page for more detailed listing of all the options.\n\nlinux creates\
    \ menu entries for the distro 30_os-pro scans your hard for other operating systems,\
    \ Linux or otherwise, and adds them to the menu.\n\n# ## Configuring Grub\n\n\
    Grub's ability to generate its own menu based on the hard drive is one of its\
    \ best features, but you can also create these entries. The entries are created\
    \ using the /etc/grub.cfg or /etc/grub.d/ entries which contain a list of variables\
    \ which you can alter the menu. Grub normally boots only one entry if you do not\
    \ select anything; find the line that sets GRUB_DEFAULT and change the number\
    \ to you want\n\nThe last one is the only menu you can contain of all distros.\n\
    \nThe scripts in /etc/grub.d/ are run by run-grub. If you want to customize your\
    \ boot menu, you can add your own entries, all you need to do is create /etc/grub.d\
    \ files. They run in order, with numbers 00_header writes the standard settings\
    \ at the top of the menu, for file,...\n\n# ## Chainloading\n\nThere is another\
    \ way of handling distros called 'chainloading'. This is how Grub boots Windows\
    \ when it is installed. Instead, it passes control to the Windows bootloader as\
    \ that is booted directly by the BIOS. We can use this to extend linux's own menu\
    \ and choose one from the initial list.\n\n> ### Use chainloading to maintain\
    \ its own boot menu.\n\nIf you need to create your own menu entries, you can't\
    \ simply append them to the grub.cfg file as it will be overwritten.\n\n![](img/97fdf078658cf34e6c480f18f1f2014d_109_0.png)\n\
    \n| GRUB version 2.02-beta2-ubuntu1.3 |\n| advanced options for Linux Mint 17.3\
    \ 64-bit |\n| GRUB2 4.0-rc |\n| Linux Fedora 23 |\n| Memory test (memtest6+) |\n\
    | Windows 10 (loader) (dev/sda) |\n| Ubuntu (loader) (dev/sda1) |\n| Advanced\
    \ options for OSQUE 4.2 (x86_64) (dev/sda2) |\n| Advanced Linux (dev/sda3) |\n\
    | Advanced options for Manjaro (15.12) (dev/sda4) |\n| Advanced options for Fedora\
    \ 23 (x86_64) (dev/sda5) |\n| System Kernel 4.7.0 |\n\nnext: grub-reconfig edit\
    \ /etc/grub.cfg then you can add your own menu entries. This means to include\
    \ the number to edit it in, and position your name. Edit this file and add your\
    \ entries to the bottom of the file. Don't touch the existing content - although\
    \ you could add the menu for OpenSUSE installed on /dev/sda7, if you want to install\
    \ Grub to sda8 or moved it, add this to the file.\n\n```\nUse the I and keys to\
    \ select which entry is highlighted. Press 'e' to edit the selected, 'b' before\
    \ booting or 'c' for a command-line. The highlighted entry will be executed in\
    \ seconds.\n```\n\n```\nmenu 'OpenSUSE boot menu' \nset root=(hd0)\nchainloader+=\n\
    ```\n\nRemember, that Grub counts disks from zero partitions, not one, so sda\
    \ becomes hd0. This uses the original boot menu for each distro, and if you want\
    \ to boot into the primary menu, but it means you have to update the boot menu\
    \ because you will have two menu entries to boot from instead of one. If you are\
    \ using this method you will see that you have dual menu entries generated by\
    \ grub-linux. If you are not\n\n# ## Rescue systems\n\nOne of the features of\
    \ Grub 2 is that you can boot from an image. This allows us to really make nice\
    \ boot covers. it also means you can really boot from a kernel, which is much\
    \ faster than booting from an actual CD/DVD (or even USB stick) but it saves all\
    \ the time while searching the stuff on disk for the right CD.\n\nThis requires\
    \ that the distro supports booting from an ISO at most, so it can vary greatly.\
    \ All you need to do is create a copy of 40,\n\nand add the own menu entry definition.\
    \ Here is an example for System Rescue GRUB which is also easy to boot (hd0).\n\
    \n```\nentry System Rescue GRUB 4.7.0\nmlinuz /loopback,iso=system-rescue-x86_64-4.7.0.iso\
    \ boot=isolinux\ninitrd /loopback/live-x86_64/live.img\n```\n\n```\nmenuentry\
    \ 'Ubuntu 15.04'\nloopback loopback,iso=ubuntu-15.04-desktop-amd64.iso\nmlinuz\
    \ /casper/vmlinuz boot=casper--loop=loopback find-findfile=/ubuntu.iso\ninitrd\
    \ /casper/initrd.gz\n```\n\nNote the use of a isofile, both methods work but one\
    \ is easier to maintain."
