  md: '# # Troubleshoot display issues


    # # Display settings


    Xrandr is a powerful tool, but with all command-line tools, things can go wrong.
    If your displays get messy, try locking them to behaving as they should, or you
    can try xrandr -- to reset your main display to defaults.


    ```

    $ xrandr --output HDMI-0 --mode 1920x1200 --rate 60 --xrandr --output eDP-1 --auto
    right

    ```


    If you''re unsure whether or not a resolution will work correctly, try the following
    when setting a new resolution:


    This will attempt to set your new resolution. If after 10 seconds the resolution
    works, great. If the screen goes black for this time, wait.


    Sometimes you might get a BadMatch error when adding a resolution to yours.


    be down to a number of issues. Try doing a for the error. A BadMatch (invalid
    parameter) error when adding our own custom mode might have the fact that one
    of your displays is connected through a KVM switch, but in the event switching
    from the proprietary driver to the open-source Nouveau resolved the issue.


    The main use for xrandr is to change the resolution of your monitor, which is
    done the following:


    ```

    $ xrandr --output HDMI-0 --mode 1920x1050

    ```


    Substitute HDMI-0 for the connected device, and the mode from those you supported.
    You can also change the frame rate by adding --rate, but it is not always necessary.


    If you only have one display connected, you can replace --output with a single
    --flag, which tells xrandr the resolution for the specified size:


    For your displays to move the contents of each other,


    use the resolution of the other, with the left side set to --left and the right
    side set to --right with the same frame rate - always --the resolution of your
    main


    or --the only way you will find double merging and overlap


    ```

    $ xrandr --output eDP-1 --mode 1920x1080 --output HDMI-0 --mode 1920x1200 --right

    ```


    > > Joining you to display larger displays without making them too cramped


    # # Add resolutions


    Thanks to xrandr your full set of displays will be properly connected and you
    can move them over the Screen using your ability to align them. The xrandr command
    allows you to set the particulars of resolution then that are not automatically
    detected.


    If you want to add a new resolution, you have to create a new mode for it then
    add it to your display. Start by using the xrandr command like:


    ```

    $ xrandr --newmode 1920x1200 60.00 1920 2048 2560 2752 1200 1088 1120 1144 hvsync

    ```


    The three horizontal and vertical numbers, plus the desired refresh rate (in this
    cases it would be 60). This will create an output mode for your Mode. Use this
    to select every other monitor, then right-and-click choose yours. Next, by adding
    a space after --mode and then writing the name, it should produce a line like
    the following:


    ```

    $ xrandr --addmode 1920x1200 60.00

    ```


    Now enter xrandr then the mode has been added to the list of supported resolutions.
    If you want to use it at your place, use:


    ```

    $ xrandr --output HDMI-0 --mode 1920x1200 --rate 60

    ```


    Again, replace HDMI-0 with your own choice, and what exactly matches what was
    inside the quotation marks of the xrandr command.


    If the resolution is supported, you should be able to switch to it:


    ```

    $ xrandr --output HDMI-0 --mode 1920x1200 --rate 60

    ```


    Should you ever want to remove this mode for any reason, make sure you''ve removed
    it, then use this


    following:


    ```

    $ xrandr --rmmode 1920x1200, 60

    ```


    There are many screen resolution tricks around xrandr. If you have multiple displays
    connected than one, simply enter this one:


    ```

    $ xrandr --output VGA-off

    ```


    If you want to bring it back, replace --off with the default resolution, or --mode
    1366x768 for a specific support.


    If you have two monitors set up, you may want to change the positions within your
    virtual display. This is done by moving one display to the other using the following
    commands:


    ```

    $ xrandr --output VGA-0 --left of HDMI-0

    ```


    This will move the VGA-connected display to the left of the connected display
    via your HDMI port.


    # # Mirrors displays


    But if you like it to mirror the contents of each other, use the --same-as


    ```

    $ xrandr --output VGA-0 --same-as HDMI-0

    ```


    If one display has a higher resolution than the other, the resolution of the lower
    one will cut off the edges. By using --padding, you can move the move with the
    monitor to ensure it''s always onscreen—simply to match the resolution of your
    main display.


    ```

    $ xrandr --output VGA-0 --same-as HDMI-0

    ```


    Even if it isn''t xrandr do-type xrandr for a comprehensive list of its capabilities,
    including how to use it. One major limitation of xrandr is that its changes aren''t
    persisted—in other words, they don''t survive when you reboot or when you log
    off. (To get around this problem, check out Make Xrandr Persistence Persistence,)


