    # ## Get your Linux on game


    There''s always a niche interest in gaming on Linux, which was mostly done through
    Wine, which has been around since the 90s and frankly feels like a sticking plaster
    to enable play of Warcraft or whatever the current Windows game of choice was
    played on.


    Things changed when Valve ported its Source engine into Linux along with release
    for Steam. This opened the gate for Source-based Linux game distribution. In the
    end of 2011 Valve announced it was creating Steam...


    ![](img/97fdf078658cf34e6c480f18f1f2014d_29_1.png)


    dedicated Debian branch for running its Steam client. This was hard to tie in
    with failed attempt at creating a Steam Machine ecosystem. Today there are over
    7000 Linux games available on Steam, or around 1400 in total.


    Perhaps many believe it is worth stopping development SteamOS, after the Steam
    Machine failed in 2015. Valve released its own fork of Wine Proton that was integrated
    into Steam and proposed Linux support for Windows games to a new level, with plenty
    of games offering Proton compatibility.


    But why will this work to help one of Steam''s Linux-using gamers? A Valve was
    rewarded with Steam Deck, a Linux-powered handheld PC console, which would run
    all Linux games via its Steam Proton. Perhaps 2021 is the year for Linux desktop
    after all...


    30 | The Hacker''s Manual'
