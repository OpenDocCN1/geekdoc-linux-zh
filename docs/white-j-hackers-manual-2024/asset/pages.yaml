  md: "# # Grub\n\n# ## EFI booting\n\nIn this instance, we created a flash drive\
    \ that uses the old MBR method. While most of the computers today use UEFI, they\
    \ still have a compatibility mode to boot from an MBR. So this makes we stick\
    \ to the old way\n\nportable option, but if you need to stick your stick using\
    \ UEFI, the `grub-install` command to use the UEFI target, like this:\n\n```\n\
    $ sudo grub-install --target=x86_64 --boot-directory=/media/MULTBOOT/\n```\n\n\
    This is a 64-bit target, as UEFI is fully supported on 64-bit hardware. If you\
    \ want to use your USB stick with 32-bit equipment, sorry (not) with the MBR booting\
    \ method.\n\n![](img/97fdf078658cf34e6c480f18f1f2014d_120_0.png)\n\nIn these examples,\
    \ the usb is at `/dev/sdb` (the computer has a number of hard drives) and the\
    \ filesystem is mounted at `/media/sda1`, amend the paths to your circumstances.\
    \ If first install Grub on the stick to make it bootable,\n\n```\n$ mkdir -p /media/MULTBOOT/boot\n\
    $ sudo grub-install --target=i386-pc --boot-directory=/media/MULTBOOT/boot\n```\n\
    \nNote: the boot-directory options will contain the Grub files but the device\
    \ name you give is the whole stick, not the partition. We create a configuration\
    \ with\n\n```\n$ grub-mkconfig -o /media/MULTBOOT/boot/grub/grub.cfg\n```\n\n\
    This will create a configuration to boot the distros on your hard drive, so edit\
    \ `grub.cfg` to add the entry that fits your line\n\n```\n### END /dev/sdb/grub.cfg\n\
    ```\n\n# ## Adding distro\n\nThis gives us a bootable with no menu entries. If\
    \ we booted from this stick, we would have dropped into the Grub shell. So let's\
    \ add a regular (sorry, but) an Ubuntu entry to make booting from an ISO file\
    \ (also easy, it makes things easy). Just add the entry to the end of the file\
    \ and \n\n```\nset isofile=/ubuntu/ubuntu-16.04-amd64.iso\nloopback loop isofile\n\
    linux (isofile)/casper/vmlinuz-16.04-generic isofile=ubuntu-16.04-amd64 quiet\
    \ splash\ninitrd (isofile)/casper/init.rd\n```\n\n![](img/97fdf078658cf34e6c480f18f1f2014d_120_1.png)\n\
    \nUbuntu 16.04 -\n\nCreate the directory on the drive and copy over the ISO file.\
    \ Then use the usb drive and reboot from the stick. You should see a Grub menu\
    \ with one entry for Ubuntu and then you can open and boot from install.\n\n#\
    \ ## Special options\n\nThe first line creates a variable to hold the ISO file.\
    \ We use a variable because we only need to change one thing when we want to add\
    \ the menu to the drive. The second line tells Grub to mount a loop device (a\
    \ mounting of a file as if it were a block device). Then we have the two entries.\
    \ You might be wondering how we know what to add to the menu entries. The original\
    \ boot menu and knowing what to add for looking at the ISO. The latter, in the\
    \ case of Ubuntu, is to \n\nwhere the isofile variable is set to the path to the\
    \ file we need to mount the ISO. To see the original boot menu, we need to do\
    \ like this:\n\n```\n$ sudo mount --loop /path/to/iso/somewhere\n```\n\nMost ISOs\
    \ use islinux so you need to add the CFG files in the isolinux boot directory\
    \ of your\n\n![](img/97fdf078658cf34e6c480f18f1f2014d_120_2.png)\n\nUse the 1\
    \ to select what entry you want highlighted.\nPress the enter key to boot. Press\
    \ 'c' to edit the command line before booting or 'e' for help\n\n+   * This is\
    \ the menu you get with a default Grub configuration—functional but not very pretty.\n\
