  md: '# # Headless setup


    One to maximise your host PC''s is to run your virtual machine headless. This
    means there''s no way of interacting with the VM unless you access it remotely
    using the Remote Desktop Protocol (RDP). Make sure you have the VirtualBox Extension
    Pack installed. In your VM Settings, go to Display > Remote Desktop to enable
    RDP. Use the default port (3389) if you wish—choose multiple VMs for each between
    5000 and 50000.


    If you prefer, you can launch your VM from the terminal using one of commands:

    VBoxManage --startvm "name"


    ```

    VBoxManage startvm "name" --type headless

    ```


    Alternatively, hold Shift as you click the VM in the VirtualBox Manager, and you''ll
    be able to monitor its progress from the Preview window before connecting to your
    remote computer.

    When connecting to your headless VM from RDP, the client is built into most distros,
    but VirtualBox also ships with rdp which allows you to pass USB devices inside
    the VM to the PC. Use the following command:


    ```

    rdpclient -v <ip> -p <port>

    ```


    connect with your host PC''s IP address, and the port number you chose (3389 by
    default).


    +   - Run your VM headless to reduce resource usage if you plan to access it remotely.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_82_0.png)


    > Quick tip: Use the VirtualBox Guest Manager feature to create user-defined groups,
    then create the first VM in the list, right-click it, and choose ''Rename'', then
    create a new group from this group or other groups you want, and join them to
    the group.


    # # Other settings


    Go to Display to configure your virtual graphics card. Start by allocating as
    much memory as you need, and you''ll also need to enable 3D Acceleration to improve
    performance. If you''re running a VM without a GUI, leave the 2D acceleration
    off. Go to Desktop if you want to access the VM via RDP. The VirtualBox capture
    toggle will make it possible to record your screen as a video if you want to do
    so – for example, if you are making a tutorial.


