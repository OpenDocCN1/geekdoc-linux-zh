  md: '# Security


    # User experience


    Does it make instant easy to use?


    All applications, and not just the ones in this Roundup, that prioritize security
    will have their job cut out them. They have to incorporate the extra security
    and privacy features without distracting the user from their main task: sending


    messages to your buddies. Since there''s a good chance your friends aren''t using
    them as well-known instant messengers, you''ll have to convince them (or terrify
    them) to move. A straightforward installation procedure and interface


    will go a long way in getting your buddies to sign up for another service. Using
    new applications that aren''t dissimilar to the others will help you and your
    friends continue communicating without the application getting in the way.


    # CryptoCat


    If you didn''t mind setting up a 12-character long password, CryptoCat will feel
    just like any other IM client. When you''re in for the first time, CryptoCat will
    generate encryption keys and store them on your device. It will deny you to log
    into your account with a new device. Each device has a unique fingerprint that
    you can verify with your buddies.


    For additional security, you can ask CryptoCat to send messages only to trusted
    devices. When receiving messages, Cryptocat will always show you when buddy adds
    a new device. The IM window is standard are yours and includes buttons to return
    and send message video and files.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_63_0.png)


    # Goldbug


    On the first launch, you''ll be asked to activate authentication and the application
    generates eight sets of encryption key pairs for each different task, such as
    managing and emailing etc. Once the keys''ve been generated, you''ll need to enable
    the ''Activate'' button. You can now connect to a chat server or the echo network
    and add your friends.


    Initially, the project adds its own server as a neighbour but this is strictly
    for testing purposes and you''ll have to chat with friends before you. Besides
    the option to import and export public keys, Goldbug offers an interesting method
    which enables you to export your public key after encrypting it with friend''s
    already imported key. Despite its uniqueness, Goldbug has one of the most confusing
    interfaces and its workflow is latest.


