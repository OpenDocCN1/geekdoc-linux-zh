  md: '# Build the KERNEL


    The kernel is what makes Linux tick. Jonni Bidwell is happy to get his hands dirty
    and help you tune up those ticks...


    ![](img/97fdf078658cf34e6c480f18f1f2014d_31_0.png)


    Linux, if you want to be annoyingly precise about it, it isn''t a complete operating
    system. It is a kernel and like the kernel of a seed pod, it requires all the
    surrounding bits to be useful.

    A bootloader can happily load a Linux kernel with no init system specified, and
    it will run without applications (for example, systemd in the first instance)
    telling the kernel what to do it simply idle. Yet it has the potential to do almost
    anything. The kernel includes everything you would think of as being a low-level
    component


    of the operating system, as well as things you might think elsewhere. This includes
    drivers, filesystems, network protocols, schedulers, process and I/O memory allocators
    and all kinds of others.


    In the early days of Linux, users would regularly have to face compiling their
    own kernels, sometimes to get new hardware support, sometimes to reconfigure their
    way out of brokenness, and sometimes to improve performance. Users of Linux from
    the Scratch or Gentoo days will be familiar with the kernel compilation process,
    since


    it''s more or less demanding. But it''s an option for any flavour of Linux, so
    thought we''ve had a lot of making kernels more accessible.


    As we discover, the Linux Kernel is huge and complicated. It may be tempting for
    some to over it with a fine-tuned kernel, trying to optimize size. But this is
    for the most part hopeless, and more likely to result in breakage than anything
    else. If you want a faster, more responsive kernel, then a better approach is
    to use one of the many custom efforts that are available.'
