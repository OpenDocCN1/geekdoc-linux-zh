  md: '# Build the Kernel


    # Grasp what is a kernel and why it is initializing my computer to do


    Just what is a kernel and why it is initializing my computer to do?


    When you think of an operating system (OS) it ought to be an umbrella for the
    ''thing'' that''s responsible for nothing but your computer unless the BIOS or
    UEFI has control over the hardware. For popular systems like Windows and macOS
    it is layer everything together. There''s no choice of desktops, no option to
    boot to a (real) image and no real user space (like Explorer and Finder). On Linux
    there are things that are much more modular. The progression from UEFI to bootloader
    is screen if you''re quick to identify the moment the kernel happens over the
    initialization (for example, system runtime) or your operating system has a kernel.


    The fact that macOS is based on BSD (perpetuated by lately) and users who claim
    their OS is more than it stems from Darwin which it is based. Darwin is open source
    and partly sided, but it also comes from other (OS) like NEXTSTEP, which was bought
    by Apple in 1997. Darwin has its own kernel XNU (usually packed with Mach) and
    Linux is a hybrid, which is monolithic; to a monolithic, it''s based on the Mach
    kernel, originally a research project into microkernels, with BSD functions (it''s
    not a "BSD system"). The fewer layers of Mach, the more the GUI, COKit and various
    applications services, which are all theirs and have nothing to do with BSD.


    # Driving the lead


    The XNU kernel has its own API called IOKit and Linux has the less illustrated
    "Driver Model". Drivers (programs that manage hardware) are the easiest component
    of a kernel to get your head around. In the sense it''s easy to see what they
    need to do. The only thing is, most modern kernels have very few drivers in the
    kernel. Instead, the preferred approach is to include drivers as external modules,
    which can be loaded on demand, when the hardware is connected. During matching
    the drivers plug into the kernel, and for the most part they are a part of it.
    If other kernel components can be made and loaded on low-level systems (for example,
    the one loading modules in the first part), they have to be built in.


    So the Linux kernel has drivers for every bit of hardware supported by Linux.
    Modern hardware (particularly Wi-Fi and GPUs) often requires firmware to be loaded
    on every boot, otherwise it won''t work.


    Since this package (kernel) is required for all the drivers in the kernel (usually
    packed as linux-image) to work, we can''t forget its size (lib/firmware contains)
    over 700MB on our system. Drivers especially, occupy fairly negative


    ![](img/97fdf078658cf34e6c480f18f1f2014d_32_0.png)


    > The kernel is a modular masterpiece that runs everything from old AGP graphics
    to the Large Hadron Collider.


