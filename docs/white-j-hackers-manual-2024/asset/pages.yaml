    $ lltng-trace Control 2.7.1 - Hébert & Demôme


    # Using LLTng


    LLTng has two modes: instrument and tracing. Tracing is the act of inserting probes
    into source code, and there are two types of probes:


    (which are located at specific locations in the kernel code), and (which are dynamically
    executed when some things happen). Controlling tracing is what you can do using
    the LLTng command line.


    Display all available tracing events related to the kernel:


    ```

    $ sudo uuid list -kernel

    234 17065

    ```


    You will a small part of the output from LLTng list -kernel bottom. If the first
