  md: "# # Booting from ISO hard disk\n\nboot. This is a compressed file containing\
    \ a small root filesystem that takes care of loading any necessary drivers and\
    \ mounting the root filesystem before proceeding. It runs all in memory (so for\
    \ a CD-ROM, no swap is needed there). This is the magic of loading live CD filesystems\
    \ from the DVD or ISO. If you examine this—you will need a basic understanding\
    \ of shell scripting—you can see what kernel parameters are used to boot from\
    \ it.\n\nYou can also use this method to boot an ISO image from your hard disk.\
    \ Why not do that too? If you have enough space on your partition, you might prefer\
    \ to have a CD archive instead by adding a suitable entry to your boot menu.\n\
    \nintramfs is a compressed image archive. First, you will need to identify the\
    \ type of compression used by the kernel—then check the file extension to get\
    \ the right format:\n\nmeans you will always have having to hunt for the appropriate\
    \ CD or USB drive. With a submenu entry in /etc/grub.d/40_ will be added to the\
    \ end of the boot menu: whenever you run update-grub or grub-mkconfig.\n\n```\n\
    $ /path/to/intramfs\n```\n\nThen you can unpack it to the current directory as\
    \ your boot:\n\n```\n$ zcat /path/to/intramfs | cpio -id\n$ xcat /path/to/intramfs\
    \ | cpio -id\n$ gunzip /path/to/intramfs | cpio -id\n```\n\nFor files compressed\
    \ with bzip2 or xz, you may also modify the initramfs. By making your changes\
    \ to the filesystem and then repacking it by executing the command below you can\
    \ reboot in the first place:\n\nModified initrd is saved from the ISO image and\
    \ referenced only on your USB stick; you can distribute your USB stick without\
    \ modifying the original software. You could create a multi-distro USB stick complete\
    \ with themed Grub and themed splash screens (which are in the initrd) too to\
    \ boot at a Linux instance.\n\nOnce you are done you do not need to modify the\
    \ original ISO image. Just put it onto your USB stick and refer to it from there,\
    \ like this:\n\n```\nlinux (path/to/vmlinuz...)\ninitrd (path/to/initrd...)\n\
    ```\n\nIf you want to boot a distro that has already appeared on an LXFVD, you\
    \ can 'borrow' the initrd file from there. The init process doesn't create\n\n\
    # More options\n\nWhile you are editing the menu, you can add extra options to\
    \ suit your needs, e.g., SystemRescue booting. will load the payload and your\
    \ keymap. Similarly, you can set the root password with password=.\n\nThere are\
    \ many other options available, along with the general kernel options that are\
    \ documented in the Documentation/kernel_parameters.txt in the kernel source (there\
    \ a copy of LXFVD). We've included a number of files on the DVD, just copy the\
    \ root of your USB and save the ISO image file. There are 64- and 32-bit versions\
