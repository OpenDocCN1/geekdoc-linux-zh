    # Terminal:

    Get system info


    We discover how to get information about the Linux system and with the hardware
    of the Terminal.


    egardness of what you use, beneath it lies the shell, a command-line interface
    that gives you unparalleled access to your PC. In this series, we''re exploring
    how to immerse yourself in the Terminal by learning practical skills. It covers
    how to get key information about the inner workings of a system running Ubuntu
    (or any Debian-based distribution).


    There are plenty of system information tools available through your Desktop environment,
    but they''re scattered here, and rarely offer you the detailed information. By
    contrast, the Terminal offers a number of useful commands that can provide a sufficient
    summary of what you are missing from the Unity desktop.


    The first tool worth looking at is lshw. It provides a summary of the hardware
    installed in your system, particularly when you run it with the flag: lshw -short


    When used, you''ll see a list of your hardware: its type by description that usually
    includes manufacturer and model. Now let''s see:


    There are number of commands with various flags to provide all the details you
    need about your system.


    the universal lshw command, which provides every scrap of detail you might (or
    might not) about your system. Note it needs to be run as an administrator, so
    you might need to use sudo lshw. You''ll see various parts of your Linux box scattered
    across the screen - and a detailed list of system information is presented. Trying
    to dig it all out at once can be tricky, but you can output this information as
    an HTML file for reading (and searching) more easily in your web browser: sudo
    lshw -html


    The file will be generated whenever you are currently in the Terminal and your
    Home folder by default. With hwinfo, it can also provide a more descriptive view
    of your system, with four columns to help identify your hardware: H/W path, Device,
    and Class.


    If you''re looking for targeted information about a specific part of your computer,
    you''ll need to look into other members of the family. The lscpu command, which
    provides detailed information about your processor, including useful snippets,
    such as the number of slots, architecture, cache and hardware support for virtualization.


    If you''re looking for storage devices, try lsblk. This tool lists all of your
    storage devices, which covers hard drives, DVD drives, flash drives and basically.
    It includes information about the physical drives - sda and sdb - size, type,
    partition (or part), and where the drive is mounted in the Linux file system (mount
    points). Note that the RIM tool also shows the device that is removable. The list
    is displayed in a tree-like format - use lsblk -f for a straightforward list.
    The drive''s size is shown in human-readable format (G for gigabytes and M for
    megabytes). If you have SSD attached, use the -D flag to display support for TRIM
    (as) as well as other discarding capabilities.


