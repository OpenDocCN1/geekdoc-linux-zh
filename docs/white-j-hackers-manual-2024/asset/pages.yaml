  md: '# Distros


    # Install Ubuntu Server


    If you know what you want, and it has nothing to do with frippers such as graphical
    interfaces, you need Ubuntu Server.


    Having played with lightweight desktops, we''re now going to see what happens
    when we take the desktop away. Ever, a server is in a data centre or under the
    stairs - a machine with a job to do. That job might be to run a database or some
    web apps, or it might be to serve our media collection via Plex to your local
    network. Either way, there is no need for a human to interact physically with
    something that breaks badly. So there''s no need for those bulky desktop environments.


    Instead, we log into the terminal and do all our administration from the command
    line. The terminal application on the previous page is why we use it now to transform
    our lightweight machine into an SSH server.


    # “There’s more frustrating than a headless machine suddenly falling off the network.
    With a cable connection, at least you can run out of signals”


    ```

    time; sudo apt install openssh-server; then you can access the machine from other
    Linux machines on your LAN (or from Windows PuTTY, if you want) over SSH

    ```


    The beauty of SSH is that the machines connects both on the same network or over
    a considerable number of network hops away. If you do some configuration on your
    router, you can access your Ubuntu machine from absolutely


    | Name | Tag | Size | Version |

    | --- | --- | --- | --- |

    | Ubuntu | LTS | 1.5GB | 22.04 |

    | Debian | Stable | 700MB | 11 |

    | Fedora | Rawhide | 1.2GB | 36 |


    +   > No fancy Toolkit-installer using here Ubuntu: the terminal has charm all
    of its own.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_13_0.png)


    In the world, you may prefer, and it would be in keeping with our minimalism,
    to start from scratch with Ubuntu (which shares the same base as the Desktop flavours
    but includes no desktops). You can download the ISO from ubuntu.com, and the page
    focuses on the LTS release, so start with the latest 22.04. Alternatively, any
    cloud provider has its own Ubuntu image available to download (often free). Or
    you might be interested in Multpass (https://multpass.io/), which supplies you
