  md: '# Software


    # VirtualBox:

    Virtualisation


    We reveal how virtualisation can tap into your PC''s running multiple operating
    systems.


    Today''s multi-core PCs are built to run multiple tasks simultaneously, and what
    better to tap into all than through virtualization, in particular hardware virtualization,
    each capable of splitting a single PC (known as the ''host'') into multiple PCs
    (referred to as ''guests''), each capable of working and acting independently
    of the other.


    Virtualisation allows you to run multiple operating systems on one machine, memory,
    storage and other hardware resources in share individually with one or more guests.
    If your PC is powerful enough, you can run multiple machines in parallel, enabling
    you to use different operating systems on your computer simultaneously without
    having to multiple PCs.


    Virtualisation simply means dividing computing power. It allows you to easily
    run alternative operating systems in a safe, sandboxed environment – your PC can
    be isolated [in theory – Ed] from your host, making it easy to test new software
    or simply to try a different flavour of Linux, for example. It can also be used
    for flexibility purposes – as you may have switched from Windows to Linux, for
    instance, but without having to use a dual-boot setup.


    It goes without saying that the faster and more powerful your PC, the better it
    is to run one or more virtual machines. If your hardware allows all virtualization
    experiments, then it''s better to run a single machine in relatively low-powered
    environments.


    your (in the water) with the open-source solution, VirtualBox? VirtualBox may
    be free, but it''s still a powerful option that offers both a graphical front-end
    for configuring and managing your virtual machines, plus a raft of command-line
    tools for those who need them.


    VirtualBox is available through the Ubuntu Software Center, but for the purposes
    of this tutorial we need the newer version, which you can download from www.virtualbox.org/wiki/Linux,
    Downloads.


    You''ll find that a variety of different builds exist, and each guest you choose
    needs a specific distro (or version) build. Both x86 and AMD64 are available.
    You can download files, or follow the instructions provided to add the appropriate
    VirtualBox repository for your source set. Once it is installed, the guest you
    want to get started is


    launched in VirtualBox through the Dash. This is VM Manager, which will help you
    manage all your virtual machines (including the ones you created). It is also
    easy to create new VMs from scratch, but before you begin, just select File >
    Preferences to configure the default folder to store your virtual machines anywhere
    other than the default. This is an critical step, but as each guest might contain
    gigabytes of data for your needs, you may prefer to choose a dedicated drive (or
    one with more space). If you''d like to use a drive for your virtual machines,
    then consider installing an SSD to match your VM''s performance.


    # Choose VirtualBox


    There are many virtualization solutions available for Linux, but what better way
    to use yours (or even just


    +   To give your VMs a speedboost (VT-x, Acceleration, or INFLX2) to see if your
    processor supports it, first make sure it is enabled in your PC''s BIOS or UEFI
    – check your manual or website for instructions.


    > VirtualBox enables you to set up, and run multiple guest machines from the comfort
    of your desktop.


    # Create your VM


    Once VirtualBox is open, click ''File'' and click the New button to create your
    first virtual machine. The Create Virtual Machine Wizard appears in two ways:
    Easy or Expert. Choose Expert to see all configuration steps in a single window.
    Start by choosing your OS and from the drop-down menus –


    VirtualBox supports all major OS, including Solaris, Solaris and BSD (ISO) to
    install to Windows or Linux. The Linux version changes depending on your installation;
    select the major distro as well as Linux kernel versions from 2.2 onwards are
    available.


    It is important to choose the right of OS and version because this will ensure
    that all other settings are set so they''re comfortable. You''ll see this message
    when the Memory size matches to match the OS. This will be a comfortable setting,
    feel free to adjust the slider – it''s the colour-coded editor, and red to not
    to help you set the memory to a level that''s comfortable for your host PC.


