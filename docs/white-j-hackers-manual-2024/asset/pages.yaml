    Quick tip

    Software tracing is the process of understanding what''s happening within a software
    system. A trace application can trace user applications at the same time. If you''re
    an amateur Linux user finding tracing difficult try simple examples until it makes
    sense.


    LLTng is an open source tracing framework that runs on Linux. This allows you
    to investigate the interactions between multiple components of a system, such
    as the kernel, C/C++, and Java applications. On Ubuntu 16.04 you can install LLTng
    using:


    ```

    sudo apt-get install lltng-tools lltng-dmws libltng-ust-dev

    ```


    After a successful installation you will be able to run LLTng (see right above
    for installation process details). You can find your LLTng instances with:


