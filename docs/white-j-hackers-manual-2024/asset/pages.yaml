  md: '# Run desktop apps with root privileges


    One of the biggest advantages of Terminal is that it gives you sudo command, which
    allows you to run programs and access the system with root privileges. You can
    edit files outside of the terminal using a line editor such as geedit, which will
    give you root privileges to access certain files.


    sudo geedit and edit files in your home directory; they''ll end up owned by root
    rather than your user account.

    Instead, use sudo to launch any graphical application as Nautilus or as root.
    try sudo geedit. you will see a popup window asking you for your password. After
    you pass it, you will now have full access to your system.


    It''s a little messy - you''ll see the Terminal window remains open and ''frozen''
    if you press Ctrl+C. Geedit will close and you''ll get back to the prompt. The
    workaround is to launch the terminal again in its own process, or to wait until
    the screen clears, close the existing terminal window using the ''x'' button -
    select Terminal and the shell will remain running.


    [Backspace] to confirm you''re searching from the top rather than the bottom.

    Configuration files vary depending on the file you are editing, but they share
    some characteristics. One of them is the use of the # key. If a line begins with
    #, then the line is ignored. This is a handy way to introduce comments into your
    configuration files and can also be used to delete commands without deleting them
    (for testing purposes). Some configurations - such as PHP configuration - are
    long lists of commands and you can simply add # next to those commands you want
    to disable, tweak them accordingly, save the file and restart the PHP server to
    effect the changes.


    It''s always a good idea to back up a configuration file before you edit it. This
    is done by creating a copy of the file with an extension, like .bak.

    cp /etc/network/interfaces /etc/network/interfaces.bak


    (if you remember -i the file will prompt for automatically editing the file without
    prompting you). If you need to restore it, use the name of the backup file to
    overwrite the original file

    cp /etc/network/interfaces.bak /etc/network/interfaces


    Type y and hit Enter, prompted and the file will be restored, while keeping the
    backup copy if you want to make changes after editing it.


    Let''s look at the process of editing configuration by examining how you read
    and change the hostname of your system, which is used to identify your network.
    Back up the file, then open it in your editor:


    ```

    cat /etc/hostname

    sudo nano /etc/hostname

    sudo nano /etc/hosts

    ```


    You will see a long blank line with the name of your hostname in it. Remember
    the rules for hostname are: they need to be a maximum of 64 characters, letters
    or dashes only (no spaces or underscores).

    Once you''ve changed it, press Ctrl+O, then Y, and hit Enter to save your file.
    your hostname has been updated to the contents of the file. If you leave things
    as they are, you''ll get ''unable to resolve host'' errors and you will need to
    use sudo nano /etc/hosts and update the reference next to 127.0.0.1 to point to
    your hostname.


    This is a basic edit of a configuration file, so let''s try something a little
    more.


    ![](img/97fdf078658cf34e6c480f18f1f2014d_130_0.png)


    Take care editing files. Always make back up before first, and check your changes
    and syntax before committing.


    ```

    sudo cp /etc/grub/grub.cfg /etc/grub/grub.cfg.bak

    ```


    This change the file enables you to make changes to the boot loader settings.
    If you want a dual boot, you must select an option from the Grub menu. When you
    boot, the OS will be selected by default, and by default it is set to the first
    entry in the list (marked with a zero), you can set it to another by changing
    this number, GRUB_DEFAULT.


    Also, why not hide the grub menu if you want to spend long times in one operating
    system before switching to the other? For a period of time, you need to change
    the GRUB_TIMEOUT to GRUB_TIMEOUT="0". After you do this, if you only have one
    operating system installed, it will be set via the GRUB_HIDDEN_TIMEOUT=GRUB_HIDDEN_TIMEOUT=""


    When you have completed all your tweaking, remember to save the file and exit,
    then run update-grub and hit Enter, so your changes can be seen in the boot menu.


    # Quick tip


    Open a terminal and type ''nano'' to replace the file content, such as for interfaces.
    You''ll get a description and instructions for editing the file.


