  md: 'Rosen_ch01 Page 6 Tuesday, June 22, 2004 7:35 PM


    Open Source Licensing


    # 6


    # 10. License Must Be Technology-Neutral


    No provision of the license may be predicated on any individual technology or
    style of interface.


    This Open Source Definition has itself created confusion. It contains vague concepts
    in the Free Software Guidelines with some equally vague concepts about discrimination,
    authors'' integrity, and software redistribution. Public discussions about the
    OSD sometimes become arguments about the OSD itself.


    Lawyers point out that the OSD uses words like shall not and must in inconsistent
    ways. For example, the phrase must allow different things in the two places it
    is used in one sentence.


    > The license must allow modifications and derived works, and must allow it to
    be distributed under the same terms as the license of the original software. (OSD
    #3).


    The first part of this provision is interpreted to mean that a license may allow
    a licensee to create derivative works. The second part, however, is interpreted
    to mean that a license may require (but need require) that the same license be
    used to distribute those derivative works and also that a license may forbid licensing
    derivative works under the same license.


    Even the two sentences of OSD # 1, with their use of shall not restrict and shall
    not require, confuse new visitors to open source. One of the most frequent questions
    people ask is,"Is all open source software zero price?" Most open source licensees
