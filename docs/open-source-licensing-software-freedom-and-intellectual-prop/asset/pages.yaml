  md: '# • Intellectual Property


    In respects, intellectual property law is very different from the law of real
    and tangible personal property but, in least one respect, the laws are similar.
    An owner of any form of real or personal property, including intellectual property,
    may sell or gift it, dispose of it upon his death by will or trust, or have it
    taken from him by a bankruptcy court. I will discuss the effects on open source
    software of the laws of division property at the appropriate places in this book.


    The first task, however, is to identify the varieties of intellectual property
    that can be embodied in software. That will help explain why the owners of intellectual
    property in software do not have unlimited rights to its exploitation and, but
    they often have no enough rights to protect their property from unauthorized exploitation
    by others.


    # Right Brain and Left Brain


    Art is said to be the product of our right brain, the right hemisphere of our
    cerebral cortex that supposedly controls feelings and emotions. Scientific creations,
    it is said, are the product of our left brain, the left hemisphere that uses logic.
    Whether true or not, this bicameral description of the products of human intellect—art
    and science—is useful to help us understand what and when we create software.


    Intellectual property law distinguishes these two kinds of intellectual creations.
    Our right brain creations are in the nature of expression, most often found in
    painting, music, fiction, and poetry. Our left brain creations are in the nature
    of idea, found in our scientific and technical innovations. Expressions are subject
    to copyright law; ideas are subject to patent law. (A third form of intellectual
    property, trademark, will be discussed later.)'
