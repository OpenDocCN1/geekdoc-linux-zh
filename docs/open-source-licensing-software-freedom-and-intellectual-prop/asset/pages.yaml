  md: '# 6 Reciprocity and the GPL


    This book is not the place to resolve this ongoing debate. It is enough to say
    that licensors are free to decide what licensing suits them best and whether or
    how to give away rights. Licensees may accept or reject software under the terms
    of the license, but they don''t get to set their own terms. That''s what copyright
    law allows, and the GPL uses that law effectively and brilliantly for its awowed
