  md: '# 5 • Academic Licenses


    Preambles to open source licenses are occasionally written in strident political
    or philosophical terms (although the preamble to this Artistic License is not
    strident political), intended to convince others of the righteousness of the licensor''s
    position rather than inform licensees of the rules they are to follow. Many lawyers
    believe license preambles are a bad place to make a political or philosophical
    statement. There are two reasons for that:


    +   1. Licenses establish terms and conditions governing the relationship between
    two parties, in our case a licensor and a licensee. The preamble is not a term
    or condition. It is merely a statement. Therefore, it has no positive legal effect
    and it is not binding on a court. As such, it is superfluous.

    2. The preamble may subtly conflict with the actual rules, or may be stronger
    or more conciliatory than the actual license provisions. There is no absolute
    rule that tells a judge, in the event of a conflict between the preamble and the
    license terms, the license terms prevail. How a court will rule in the event of
    an actual conflict between the license and the preamble is difficult to predict.


    Preambles and other philosophical arguments should not be used to qualify or modify
    the terms of software licenses, the points they make are important to some licensors.
    The software artists who wrote the Artistic License (and, I will soon describe,
    the free software activists who wrote the GPL) spent a lot of time crafting their
