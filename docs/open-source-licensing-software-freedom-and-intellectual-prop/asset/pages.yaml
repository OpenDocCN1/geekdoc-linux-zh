  md: '# 16


    # Open Source Licensing


    The boundary line between expression and idea is very fuzzy in computer software.
    There may be two hemispheres, but there is one brain, and ultimately the software
    products of our creative intellect are simultaneously art and science, simultaneously
    expression and idea.


    I remember, for example, while a graduate computer student reading Donald Knuth''s
    *The Art of Computer Programming*, coming to appreciate that his programs (and
    a few of mine) were truly works of art in ways sometimes unrelated to the functions
    they performed. The Way Knuth expressed a particular algorithm, for example, an
    object of beauty to that young computer programmer. Only someone who has written
    a tight computer program that does something well can appreciate how much expression
    goes into writing a piece of software and how emotionally rewarding that creative
    process can be simply because of the elegance and precision of the code.


    Soon after that, I began to write software for Stanford University. As I became
    immersed in the practical world of grant proposals, teaching, and other university
    activities, I realized that the functions performed by my programs were far more
    important to my customers than the beauty of my code. Still later, when I moved
    into the high industry and began to worry about how commercial products are designed,
    manufactured, distributed, and supported, the *art of computer programming* became
    less and less relevant. What was essential were the functions that the software
    performed, the *ideas* that it implemented.


    Truth be, both perspectives are correct. When we create software, we create both
    copyrightable expressions and patentable ideas. The best functioning software
    is often the best-written software. Elegant source code usually leads to elegant
    software that does amazing things.'
