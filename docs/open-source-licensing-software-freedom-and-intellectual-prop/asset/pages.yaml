  md: '# Intellectual Property


    # Dominion Over Property


    Software isn''t *free*, as in the expression "the birds are free to fly." *Software*
    is someone''s property, and you can''t use another person''s property—to fly or
    to do anything else—without that owner''s permission.


    And so this explanation of the law to software freedom actually starts with the
    other side of the coin, property rights.


    Most people think of property as something tangible, discernible by touch. We
    exercise dominion over tangible land and call it our *real property*. We put personal
    things on our land and call that tangible stuff *personal property*. We expect
    to have wide-ranging rights to use our property for our benefit and enjoyment,
    with minimal interference from others. We assert that we *own* our property, and
    we often have the deeds or purchase receipts to prove it. We believe we have the
    right to prevent others from trespassing upon or taking our property.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# 14


    # Open Source Licensing


    In common usage, we also treat computer software as tangible property. We go to
    stores to buy software and pay for it with the same credit card we use to mouse
    pads in the next aisle. We take our new software home, put it in our computer,
    and it does our bidding.


    This concept of software as personal property is incomplete. There is much more
    to software than the disk it comes in. As one California court wrote in 1948,
    property is a very broad concept that includes not only the tangible but also
    "every intangible benefit and prerogative susceptible of possession or disposal."
    Computer software is this kind of intangible property because, under the law,
    it comes with specific benefits and prerogatives that can be separately owned
    and disposed of.


    Software is a product of human intellect, and therefore it is a kind of intellectual
    property. Intellectual property is a valuable property, and the law allows its
    owner to possess and control it. The programmer who writes software—or the company
    that hires to write software—is deemed to be the first owner of intellectual property
    embodied in that software. That owner may exercise dominion over intellectual
    property. He can give it away, sell it, or license others to use it. That owner
    has the prerogative to create copies of the intellectual property, and he or she
    may prevent others from making, or using those copies.


    Because of these tangible partly intangible aspects of computer software, it is
    possible to have different owners (1) a tangible copy of software purchased at
    a computer store or downloaded from a website, and (2) the intellectual property
    embodied in that software.


    Never confuse these two aspects of intellectual property, for the laws apply differently
    to each.'
