  md: '# Standing to Sue


    Not everyone who perceives a wrong is allowed to sue to correct that wrong. Parties
    to litigation must have a suitable stake—a legally protectable and tangible interest—in
    the outcome of a dispute. Standing to deals only with the question of whether
    the litigant is the proper party to fight the lawsuit, not the issue itself is
    justifiable.


    Open licenses often elicit passionate support in the open source community. Passion
    does not necessarily translate, under the law, to standing. Only parties with
    defined legal interest in the outcome may litigate an open source license. Even
    open source advocacy groups such as the Free Software Foundation and Open Source
    Initiative do not have to sue to protect software freedom or protect software
    under open source licenses. Nor is the an intended beneficiary of open source
    licenses, despite the open source goal to serve the public interest in software
    freedom. A member of the public can''t sue to enforce an open source license.


    Intellectual property laws narrowly limit standing. Only the owner of a copyright
    or patent may sue to enforce the copy or patent. Distributors who do not own copyrights
    or patents can''t sue under copyright or patent law to enforce their contributors''
    copyrights and patents, but they do have standing to enforce the copyrights and
    patents embodied in their own collective or derivative works.


    Since the GPL is intended by its authors to be a copyright license but not a contract,
    and since there is usually no attempt to seek assent by licensees to the terms
    of the GPL, that license presumably cannot be enforced under contract law. All
    the other licenses described in this book are designed to be contracts and so
    the parties to those licenses can sue to'
