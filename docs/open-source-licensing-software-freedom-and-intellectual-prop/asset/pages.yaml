  md: '# Dual and Multiple Licensing


    The owner of a copyright can license his or her work any number of times. Distributors
    of proprietary software do that when they grant discounts to favored customers,
    issue blanket licenses for unlimited copies to large corporations, and apply shrink-wrap
    licenses to copies sold in stores.


    The MPL described in Chapter 7 offered one example of dual licensing. Under the
    MPL, the Initial Developer may designate portions of the Covered Code as Multiple-Licensed.
    This allows any licensee to choose to accept those portions under MPL or a second
    license specified in "Exhibit A." Where that option is used, Initial Developers
    often choose the GPL.


    More sophisticated examples than this dual and multiple licensing are now widely
    used for important software. The owners of open source software may simultaneously
    license that same software under non-open source licenses. This is particularly
    attractive for licensees who are reluctant to accept certain conditions of the
    available open source licenses and who are willing to pay extra license fees to
