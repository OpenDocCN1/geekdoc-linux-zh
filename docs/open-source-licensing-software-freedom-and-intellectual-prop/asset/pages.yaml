- img_proc: true
  md: '# 1 Freedom and Open Source


    able for all to see—in order that the software can be studied, changed, and improved.


    Open source code is an essential requirement for software freedom, a technical
    prerequisite. Software freedom is the goal; open source is the means to that goal.


    The term open source has caught on in the media and in public discourse. It is
    now possible to ensure that open source licenses promote software freedom without
    the confusing freedom at all. We now mostly refer to open source software when
    we mean free software.


    Simply changing the name we call something, however, does not eliminate existing
    ambiguities. We still need a definition—a brief set of open source principles—that
    summarizes what open source means and provides guidelines for open source licenses.


    In 1997, Bruce Perens proposed the Debian Free Software Guidelines to reflect
    the new open source terminology, to avoid confusion about the term free software,
    and to clarify other issues under acceptable licenses. Those guidelines were refined
    in a month-long email discussion and finally adopted by consensus in this history
    as the Open Source Definition. (Perens wrote about this in Open Source Sources:
    Voices from the Open Source Revolution, [O''Reilly 1999].) Originally consisting
    of nine criteria for licenses, the Open Source Definition had a tenth guideline
    added in 2002.


    Licenses that meet these criteria are approved by the Open Source Initiative (OSI)
    board of directors. That is distributed in source form under such approved licenses
    is OSI Certified open source software. License approval becomes a prerequisite
    for widespread adoption of software by the open source community; such organizations
    as SourceForge, for example, will only permit software licensed under an OSI-approved
    license to be hosted on their website.'
  merge: -1
  pgno: 24
