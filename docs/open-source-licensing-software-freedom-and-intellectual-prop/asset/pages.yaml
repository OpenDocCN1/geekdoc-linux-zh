- img_proc: true
  md: '# Open Source Licensing


    You must cause any work that you distribute or publish, that in whole or in part
    contains or is derived from the Program or any part thereof, to be licensed as
    a whole at no charge to all third parties under the terms of this License. (GPL,
    Section 2.)


    This is the most powerful idea in the GPL and the one that has aroused the passion
    in its adherents and its detractors.


    Adherents of the GPL suggest that this provision protects free software. It guarantees
    that all derivative works of GPL-licensed software will also be GPL-licensed software.
    Licensees cannot selfishly remove their improvements from the public commons.
    Derivative work software will always be free and ever growing collection of dynamic
    and ever GPL-licensed software that can be reused and improved.


    Detractors say that this provision creates an island of software from which only
    GPL-licensed software can escape. The rest of the world cannot share the source
    code of GPL-licensed software unless they are willing to travel to that island
    and commit to using the GPL license for their works.


    Some of these GPL detractors are licensors of proprietary software. Their complaints
    are hypothetical. They have created islands of software from which nothing can
    escape.


    The only principled complaint about the GPL comes from those who license their
    software under academic open source licenses. Such software can be incorporated
    into GPL-licensed software but the converse is not true. In one sense, academic
    licenses are for generous donors of software, and the GPL and other reciprocal
    licenses are for generous sharers of software. Because of the GPL we have two—not
    just one—public commons of free software.'
