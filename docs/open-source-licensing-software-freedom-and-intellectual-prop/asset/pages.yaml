  md: '# 9 • The OSL and the AFL 221


    Litigation over software licenses can be expensive. One tactic used by litigation
    bullies is to file suit even if they may lose on the merits, the cost of litigation
    alone will force the other party to settle. In the United States (but not in all
    countries), each party is typically responsible for paying its own costs and attorneys''
    fees. Some important exceptions to this rule:


    +   - Certain statutes, such as the U.S. Copyright Act, provide that the prevailing
    party can recover attorneys'' fees and costs at the discretion of the court. (17
    U.S.C. § 505)

    - Under contract law, the contract itself can specify that the winner of a lawsuit
    is entitled to recover his her attorneys'' fees and costs from the loser.


    The OSL/AFL licenses take the second approach. Sometimes people avoid filing suit
    over a contract if they can''t afford to hire an attorney. When attorneys'' fees
    and costs can be recovered, however, some attorneys will offer to take such cases
    on a contingency basis. An attorneys'' fees provision can help small contributors
    and distributors obtain access to attorneys.


    For these reasons, large companies often don''t like attorneys'' fees provisions.
    They fear that it tends to encourage litigation and makes them more vulnerable
    to lawsuit.


    The OSL/AFL attorneys'' fees and costs provision takes the side of the small contributor
    or distributor against the large companies.


