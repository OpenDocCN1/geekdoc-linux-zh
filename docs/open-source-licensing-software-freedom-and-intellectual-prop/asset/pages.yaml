  md: '# Intellectual Property


    The law didn''t originally allow software to be treated as intellectual property,
    and neither copyright nor patent laws applied to software. Finally, after much
    debate, in 1980 Congress decided software should be copyrightable, and in 1981
    the U.S. Supreme Court decided that software-enabled inventions should be patentable.
    Federal courts and the U.S. Patent Office have since broadened patent coverage
    of software to include computer readable media that store software. This means
    that software is patentable. Some claim about those decisions, but that''s the
    law, at least in the United States.


    Other countries have similar laws and policies. Other countries are encouraged
    to ask their local attorneys for legal advice about specific differences, since
    some countries do not allow some kinds of software to be patented.


    A low level of expressive creativity is sufficient to create copyrightable software,
    but the standards for obtaining a patent in software are substantially higher.
    Notwithstanding that difference, the laws of copyright and patent do not require
    that all be at the level of Picasso or that all ideas be at the level of Einstein.
    Quality of expression and profundity of idea are the province of art critics and
    the marketplace. To obtain a copyright you simply be an author of original work;
    to obtain a patent you must merely be the inventor of something new, useful, and
    unobvious.


    # Acquiring Copyrights and Patents


    Copyright is said to sustain in an original work of authorship. An author need
    not undertake any formal act—other than the act of original creation and fixation—to
    obtain a copyright. This applies to software as well. Any original software that
    is written down is automatically protected by copyright.'
