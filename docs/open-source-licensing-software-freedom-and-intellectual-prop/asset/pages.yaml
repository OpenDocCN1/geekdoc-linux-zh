  md: '# 12


    # Open Source Litigation


    # Owning a Cause of Action


    The prospect of litigation over open source software is disturbing to all of us.
    Open source software cannot flourish in a litigious environment in which everyone
    is suing everybody ever perceived injustices relating to open source licenses.


    Indeed, in practice, there is very little litigation over open source. After all,
    why would a lessor who is permitting everyone to copy, modify, and distribute
    his or her software need to complain about someone who did those things? And why
    would a licensee who receives software with essentially unlimited rights to it
    need to demand even more from the lessor? When the software is essentially free
    (i.e., zero price), and when software freedom is guaranteed by the license, who
    would anyone bother to sue?


    But litigation can occur, and it is important for anyone involved with open source
    software to understand the risks.


    The risks are low. If you honor the terms of the licenses for open source software
    you acquire, you probably won''t be bothered. And whatever litigation risks you
    do accept with open source software are essentially the same risks as with proprietary
    software. If you live in a litigious society, you need to be prepared for lawsuits.'
