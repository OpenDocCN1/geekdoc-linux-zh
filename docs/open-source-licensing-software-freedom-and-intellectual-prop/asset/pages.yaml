  md: '# 6 Reciprocity and the GPL


    # Copyright Law and Linking


    Why do I spend so much time dealing with issues of software linking? Does this
    topic really matter to anyone but open source zealots?


    Consider the metaphor of the World Wide Web, a huge collection of individually
    written web pages that anyone can access and display just by linking. Those pages
    are individually copyrighted works, made available to all by their authors, generally
    for free (i.e., at zero price). Under the copyright law, you do not create a derivative
    work of someone''s web page by linking to it, nor is it a derivative of your web
    page if it links to you.


    At most, linkages create collective works. A web page, for example, that contains
    links to articles about open source may present these links in an original, copyrightable
    way. That list of links is a copyrightable original work of authorship, and the
    links operate to create a collective work. The original articles remain the copyrightable
    works of their own authors.


    Not that we can''t envision using the Internet to create derivative works of web
    pages. You can find a web page that you like and make changes to it, using the
    modified version as your own. You can translate a web page from one language to
    another. You can provide editorial revisions, annotate the web pages, and elaborate
    upon them. In doing so, you create derivative works. But it is not the linking
    that made the difference.


    I do not to discourage the creation of collective works. To do so would be inconsistent
    with the goals of free and open source software, just as it would be inconsistent
    with the goals of a free and open World Wide Web. Are the GPL''s Programs so different
    from other copyrightable works that they deserve a narrower range of freedom?'
