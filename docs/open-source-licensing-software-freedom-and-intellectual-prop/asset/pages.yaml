  md: '# Freedom and Open Source


    # The Language of Freedom


    Open source licenses promise to everyone what many in the community refer to as
    *software freedom*. The terminology of *freedom* is emotionally satisfying, but
    it has proven to be very confusing.

    Freedom is an important subject in law school. Constitutional law courses address
    such topics as the *free speech* clause of the First Amendment to the U.S. Constitution.
    But freedom seldom comes as a topic in classes devoted to business issues such
    as contract or tort law, or software licensing. Law schools on intellectual property
    deal with copyright and patent, but they don''t teach about freedom, referring
    instead to the *rights* of the owners of these legal monopolies. As a result,
    there is no easy conceptual basis for integrating the language of freedom into
    the legal language of software licenses. For example, where the word *free* is
    currently used in software licensing contexts, it usually means *zero*, as in
    *free of charge* or *free of defects*. Neither of these meanings is intended for
    open source licenses.


    Not that *software freedom* isn''t definable. The Free Software Foundation lists
    four essential kinds of software freedom:'
  merge: -1
  pgno: 22
