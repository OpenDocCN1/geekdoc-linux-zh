  md: '# 9


    # The OSL and the AFL


    # Academic or Reciprocal?


    The academic and reciprocal licenses described in this book so far have been very
    different from each other. This is at least in part because the two major categories
    of licenses—academic (BSD, MIT, Apache, etc.) and reciprocal (GPL, MPL, CPL, etc.)—have
    very different roots in the open source community, and they developed from different
    philosophical beliefs about software freedom.


    Proponents of academic licenses demand the freedom to incorporate open source
    software into any kinds of works, including proprietary works. Proponents of reciprocal
    licenses believe that freedom lies in a large public commons of software that
    grows through the contribution of derivative works back to the commons.


    Because of their very different ancestry, good licensing seldom crossed the license
    category boundaries. Academic licenses remained brief and vague like the BSD,
    while reciprocal licenses grew to include provisions relating to patents, source
    code publication, and protection of contributors'' integrity. But times are changing.
    Efforts are now underway within some open source projects to relicense their software
    under more robust academic licenses, but that process is slow.'
