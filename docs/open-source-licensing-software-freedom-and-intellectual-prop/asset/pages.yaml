  md: '# 9 • The OSL and the AFL


    Both the OSL and AFL are unilateral contracts. That means the licensee is the
    only one making promises, although the license also establishes certain conditions
    that must be met by all licensees. As all unilateral contracts, licensees must
    satisfy—including the reciprocity condition—in order to enforce the promise by
    the licensee that permits them to exercise otherwise exclusive copyright and patent
    rights.


    I will describe these two licenses in this chapter differently than I did for
    earlier licenses. I will explain each license section in turn, noting the four
    places where the AFL differs from the OSL because of the reciprocity provision.
    But then I will also describe how each section compares to provisions in the other
    licenses. This chapter, then, can be read as a summary of open source license
    provisions in all the licenses in this book.


    Every license described in this book guarantees the five Open Source Principles
    that I listed in Chapter 1—but they do it in different ways. You will immediately
    recognize as I compare licenses in this chapter that the differences are often
    subtle. Some rely on the definition of derivative work; others add or subtract
    from that concept for reciprocity purposes. Some licenses contain express patent
    grants, others do not; every express patent license contains a field of use restriction
    of some sort.


    This chapter is for comparison purposes. I will leave to the next chapter the
    important issues of choosing an appropriate open source license among the alternatives
    available to you.'
