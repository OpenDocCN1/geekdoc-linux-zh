  ## locate

  要使用 `locate` 命令查找文件，输入 `locate` 加上你想查找的文件名；然后按回车。搜索结果将列出文件所在的目录和路径。


  ### 示例

  假设你正在搜索一个名为 `"codewords2019.txt"` 的文件，但你找不到所有的副本。使用 `locate` 命令可以为你找到该文件，同时提供它们的目录路径，这样你就可以在浏览大量无关文件的情况下访问并修改它。


  ### 解释

  `locate` 命令可以帮助你找到文件名的实例，如果你有多个同名文件且不知道如何访问它们，那么它可能非常有用。使用它将得到一个包含你关键词的文件列表，以及与列出文件相关的路径。


  ### 练习

  使用 `locate` 命令创建一个文件或搜索一个已经创建的文件。在笔记本中记录你的发现。


  ## 正则表达式

  如果你需要缩小搜索范围，可能可以通过使用如 `grep` 之类的正则表达式来实现。我们将在章的稍后部分介绍这些通配符。


  ## find

  `find` 命令可以像 `ls` 命令一样，用于搜索当前工作目录下的所有文件。只需输入 `find` 而不加任何其他参数。如果你想列出另一个目录中的文件，也可以输入直接路径。它还可以用于其他用途，例如接下来几节将涵盖的内容。


  ## 搜索文件

  用法：`find <从这里开始搜索的路径> -name <要搜索的名称>`


  你可以如下所示搜索特定名称的文件：

  ![](img/Image00040.jpg)

  这将找到根目录下所有名为 `"my_filename.txt"` 的文件。当此命令与通配符配合使用时将变得非常强大。


  此命令还可以用于搜索特定类型的文件。输入 `find -name "*.[你想查找的文件类型]"`。例如，如果你想查看当前目录及其子目录下所有的 `".jpg"`
  文件，可以输入 `find . -name "*.jpg"` 并按回车。

  ![](img/00041.jpg)


  在搜索不是特定类型的文件时，你也可以使用此命令。例如，如果你输入 `find . -not -name "*.jpg"`，你将获得所有非 `.jpg` 文件的列表。


