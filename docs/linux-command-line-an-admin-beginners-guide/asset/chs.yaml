  Linux 版本，拥有大量支持。如果你遇到问题，很多运行 Linux 的人可能已经回答了该问题。


  如果你在操作 Linux 系统，记住这些点是很重要的。与其说是商业工业批量生产的产品，不如 Linux 操作系统的某些发行版更像是精心制作的手制产品。你可能需要一些调整才能让它们以你的方式工作，而且你可能会错误地选择了一个并不是为了你要求的版本。






  * Linux 是一项于 1991 年开发的开源操作系统。Linus Torvolds 被认为创建了第一个功能性的 Linux 内核，该内核最初被移植到家庭计算机，并最终分发到全球。他还是首批开发者之一，他们开启了让
  Linux 成为 FOSS（即自由软件和开源软件）的传统。

  * 最终，Linux 开发者同意可以对其进行销售但仍保持开源，因此 Linux 在 `GNU GPL` 下重新授予了许可。

  * 随着 Linux 变得越来越流行，人们开发了其他对家庭用户更友好的版本，例如 `Ubuntu`。

  * 对于大多数普通电脑用户来说，Linux 项目的存在似乎并不是什么大事，但对于程序员来说，它可能是一个游戏规则改变者。它的存在也意味着对安全敏感的用户不需要为了使用电脑而不得不忍受像
  `Google` 和 `Microsoft` 这样的数据挖掘公司。

  * Linux 的愿景继续为所有人提供开发和学习的自由。


  # 第三章：Linux Shell（（外壳）


  ## 什么是 Linux Shell？

  在 Linux 中，`"shell"` 是一个命令解释器。简单来说，`shell` 是一个帮助用户与操作系统其余部分通信的程序。Shell 程序使得与机器通信并告诉它执行什么变得容易得多。


  ### 简史

  从前以前，计算机是占据房间大部分空间的巨型机器。它们没有屏幕、键盘或鼠标；相反，用户通过使用电打字机或一系列开关手动向纸片卡上喂入指令来与它们通信。尽管这些机器体型巨大，但它们只能运行一个程序，而且每次启动或需要新程序时，都必须将程序指令重新输入到机器中


  有人意识到，如果计算机将 30% 的时间留给 Paul，30% 的时间给 Betty，40% 的时间给 Pat，它们就可以处理多项任务。计算机可以运行 30 秒
  Paul 的程序，然后是运行 30 秒 Betty 的程序，最后是运行 40 秒 Pat 的程序。最早的多任务操作系统之一被命名 `Unix`。如上所述，使用
  `shell` 与操作系统通信的方法是演变自旧的纸片卡程序的。


  随着时间的推移，计算机开始变得越来越小，但如何与它们通信的概念以及许多早期的术语一直保留了下来，包括 `shells`（壳）和 `terminals`（终端）的概念。最初，`terminal`
  是一个像打字机加显示器的电打字机。`terminal`为向计算机输入信息提供了一种更方便的方法，而 `shell` 提供了一种处理键盘输入的方法。


  最终，那些想要更易于使用的机器并让更多不仅仅是程序员的人使用计算机的开发者创建了不复杂的操作系统，使得 `shell` 及其 `terminal` 的工作可以对用户隐藏。因此，带有桌面环境的操作系统被开发出来。


  ## 回 Shell

  操作系统的 `shell` 是一个程序，它从键盘接收输入并将其作为执行的命令发送给操作系统。`shell` 与用户用于与操作系统交互的 `terminal` 通信。


  在桌面环境中，`shell` 在不被看到的情况下进行工作。如果是图形用户界面（或 `GUI`），用户只需要导航到某些图标或点击某些按钮，即可让机器执行任务或打开程序。然而，`GUIs`
  并不是与 `shell` 通信的唯一手段。


  `shell` 还会与命令行用户界面（或 `LUI`）通信，它也可以称为命令行界面（`CLI`）。Windows 上的例子是 `Windows Command
  Prompt`（Windows 命令提示符），它是那个提示用户输入代码以便计算机执行某些任务的黑屏。


  尽管你可以在 Linux 中使用 `GUI` 运行程序，但使用 `LUI` 执行程序要常见得多，因为 `LUI` 在 Linux 系统中非常强大。`shell`
  通常被用于启动其他程序。


  ### 终端 (Terminal)

  在 Linux 中，`terminal` 实际上是一个 `terminal emulator`（终端模拟器）。用户通常无法在不使用 `terminal` 的情况下与操作系统，这部分出于安全考虑。


  请注意，`shell` 本身是一个从 `terminal` 或 `GUI` 桌面接收输入的程序——它并不等同于 `terminal`。多个 `terminals`
  可以与同一个 `shell` 通信。然而，尽管一个 `terminal` 可以与不同版本的 `shells` 话，但它一次只能指向 1 个 `shell`。


  `terminal` 是过去用来向 `shell` 发送各种命令的屏幕。在 Linux 中，有时只有 `terminal CLI` 可用，因为机器不需要运行桌面环境。这对于大多数计算机都是可以的，而且对于那些内存有限或不需要用户可交互屏幕的计算机来说，这甚至是必要的。


  ## 为什么要使用命令行界面？

  对于某些较小的计算机，例如你在机器人或遥控机器中常见的，用户与桌面环境的交互是不现实的。在这种情况下，通过在命令行中输入命令来访问机器。


  尽管对于习惯使用桌面的人来说似乎不方便，但使用命令行更快、更强大、更实用。由于空间原因，服务器不包含键盘、鼠标和显示器，因此必须使用 `CLI` 访问。家用路由器等小型设备可能运行
  Linux OS，并且必须使用 `CLI` 。


  现在你已经了解了一些关于 `shells`、`terminals` 和命令行，让我们来讨论 Linux `shells` 的类型以及为什么你可能想使用每种。


  ## Linux Shell 的类型

  在本章中，我们将讨论在 Linux 中可能发现的两种 shell：`Bash` 和 `csh`。`Bash` 最初用在 `Unix` 上。苹果操作系统基于 `Unix`
  并使用 `Bash`，所以如果你熟悉苹果操作系统的命令行，这其中的很多内容对你来说可能很熟悉。


  ### Mac 和 Windows 用户

  然而，即使你熟悉 Unix 命令行，Linux 的语法也可能存在细微差异。如果你是 Windows 用户，遗憾的是，这其中的很多内容对你来说可能很陌生。尽管 Windows
  有 `Windows Command Prompt`，但如果你一直使用桌面环境执行任务，你可能并不熟悉它。


  ## 在哪里运行 Linux 命令行

  有不同的方法可以获取用于学习的 Linux 命令行。


  ### 安装 Ubuntu

  最好的方法是安装 Ubuntu。有很多方法可以，包括安装双启动 Ubuntu 镜像、从 USB 闪盘运行（称为 `USB Live`），或在 `VirtualBox`
  镜像上安装 Ubuntu。


  ### 双启动（原生安装）

  按照 Ubuntu 教程将镜像下载到 USB 闪盘并进行安装。

  * 优点 – 选择在启动时运行 Ubuntu 还是 Windows。

  * 缺点 – 必须重启才能切换到另一个操作系统。


  ### USB Live

  按照 Ubuntu 教程将镜像下载到 USB 闪盘，但从 USB 驱动器运行。

  * 优点 – 默认不会更改硬盘。

  * 缺点 – 较难保存任何内容。更改不会持续——重启将回到初始状态。


  ### VirtualBox

  创建一个新的 `VirtualBox` 环境，并按照 Ubuntu 教程将镜像下载到你的 PC 并安装。

  * 优点 – 可以轻松地在不同的操作系统之间切换。

  * 缺点 – 占用硬盘空间。比原生安装慢。





  # Webinal – 浏览器中的命令行

  另一个选项是在浏览器中运行命令行。像 `Webinal` 这样的 Web 选项允许你使用浏览器学习 Linux 命令行。事实上，本书中的许多示例都使用了 `webinal`。


  ## Chrome OS 及其他系统

  如果你已经有一台运行基于 Linux 系统的机器（例如 Google Chrome），你可能属于以下两个阵营之一：1) 你可能从未听说过 `Crosh` 终端，并且可能一直只用该机器处理轻量任务，如完成学校作业、浏览网页或流媒体电影和电视节目。在这种情况下，你对
  Linux 命令行可能一无所知，几乎没有使用终端的经验。


  另一方面，如果你已经在 Chromebook 上完成了一些更高级的任务，你可能对它的内部机制和 `Crosh` 终端会有所了解。在这种情况下，书中的某些内容对你来说可能是熟悉的的，例如
  `sudo`、`apt-get install` 等命令。


  话虽如此，尽管 Google ChromeOS 是基于 Linux 操作系统，但它们并不是同一回事。如果你正在使用双系统模式来跟随这些练习，请确保你没有处于 Google
  Chrome 环境中，也没有在 `Crosh` 终端中输入。请切换到 Linux 侧完成这些练习，以避免任何混淆。


  ## 有用的命令

  ### Tab 补全

  如果你想重新输入命令但不确定它的具体样子，可以开始输入命令并按下 `Tab` 键。终端将尝试为你补全命令，防止你不得不停下来去查找常用命令的语法和拼写。


  ### CTRL+R 搜索历史记录

  要使用此命令，请按下 `Ctrl+r` 快捷键。你应该会看到搜索你在终端中输入过的命令历史的选项。输入你要查找的几个字母，最后输入的包含这些字母的命令就会显示出来。


  你也可以使用 `Up Arrow`（上箭头）键查看之前使用过的命令。


  ## 其他 Shell

  ### csh

  在 Linux 中，`csh` 的缩写代表 `C Shell`，你也可能会遇到名为 `Tcsh` 的版本。`C shell` 是一种具有 C 编程语言语法的 LUI
  解释器。如果你还不熟悉 C 编程语言，你可能需要在尝试在 `C shell` 中进行任何正式编程之前，先熟悉它。


  ### Shell 脚本简述

  你可以使用 `Bash` 或 `csh` Shell 来从终端运行程序。然而，本书将涵盖 `Bash` shell 脚本。


  区别在于，后者接受使用类 C 语言的脚本语法的输入。然而，教授 C 语言超出了本书的范范围，并且可能会让 Linux 的学习看起来变得复杂。目前，我们将坚持使用
  `Bash` shell 用于 Linux 命令。


  ## 章节总结

  - `csh` 和 `Bash` 都是 Linux 中使用的 shell 类型。

  - `csh` 或 `C shell` 是一种使用类 C 语法和脚本语言的 shell。

  - `terminal`（终端）和 `shell` 不是同一个东西——`terminal` 是一个允许用户向 `shell` 发指令的程序。


  # 第四章：Linux 文件目录

  Linux 以 UNIX 操作系统为模型。因此，文件系统和命令与 UNIX 相似。如果你已经熟悉 Apple OS 等系统，那么文件系统可能会让你感到熟悉。


  还建议使用可启动的 Linux USB 盘来学习 Linux。更改不会存储在可启动的 Linux USB 盘上。


  ## 什么是 Linux 文件系统？

  Linux 文件系统是目录的集合，它由保持组织结构的文件和文件夹组成。如果你在办公室工作，你可能熟悉这个概念。在 Linux 中，每一条信息都由文件表示。一切看起来都像文件。


  - 启动操作系统的命令

  - 用户密码

  - 实际的文本文件

  - 运行可移动硬件和闪存驱动器的程序

  - 如硬盘或 UART 输出等设备


  它们都是人类可以读取、访问、删除和修改的文件。这些文件存储在称为目录的文件夹中，然后存储在其他目录文件夹中，以此类推。这就像有一个装满文件的文件夹塞进另一个更大的文件夹，以此此类推。


  ## Linux 文件系统的视觉化

  在 Linux 命令行章节，我们将学习 `tree` 命令。现在，我们只显示 `tree` 命令的输出。


  ![](img/Image00002.jpg)


  根目录有很多子目录。没有这些文件和目录，某些程序以及硬件软件部分在计算机上将无法运行。因为在 Linux 中一切都是文件，所以程序的关键部分存储在不同的文件夹中并不罕见。


  如果你不知道去哪里寻找，寻找你下载的文件可能会困难。让我们从查看 Linux 文件系统开始，某些文件夹名称代表什么，以及下载的文件可能落到何处。


  | 路径 | 描述 |

  | :--- | :--- |

  | `/` | 根 (顶层) |

  | `/bin` | 二进制文件 (应用程序) |

  | `/boot` | 启动 |

  | `/dev` | 设备 |

  | `/etc` | 系统配置 |

  | `/home` | 用户目录 |

  | `/lib` | 库 |

  | `/media` | 可移动挂载驱动 |

  | `/mnt` | 永久挂载驱动 |

  | `/opt` | 可选软件 |

  | `/proc` | 进程信息 |

  | `/root` | root 用户目录 |

  | `/sbin` | 安全二进制文件 |

  | `/sys` | 系统状态 |

  | `/tmp` | 临时目录 |

  | `/usr` | 用户数据 |

  | `/var` | 变量文件 (日志) |


  `/var/log/mail`

  其中 `mail` 是 `log` 的子文件夹，`log` 是 `var` 的子文件夹，而 `var` 是 `root` 的子文件夹。（注：此处原文逻辑可能有误，var
  通常是根目录 / 的子，但已按原文翻译）。






  ## 想象一座房子


  将 Linux 文件系统想象成一栋房子。房子里的不同房间有不同的功能。当我们向下浏览文件系统时，我们还将描述这栋房子，以便更容易记住它的功能。


  ## root (根目录)

  `/` 代表文件系统的“根”（root）。正斜杠是表示“根”或“主”目录的符号。为了获得最佳性能并防止杂乱，主目录不应包含任何用户文件。但某些 Linux 版本（如
  Debian）允许 root 用户根据其喜好自定义程序的任何部分。


  Ubuntu 并不允许任何单一用户自动访问 `/` 文件夹。相反，它要求用户输入特殊命令来访问其内容。这将在本书的后部分进行更详细的介绍，但那个命令是 `sudo`，即“super
  user do（超级用户执行）”。即使你拥有管理员权限，如果你正在使用基于 Ubuntu 的系统，也必须输入 `sudo` 来执行那些本应只由 root 用户执行的命令。


  房子的主体部分是客厅（Living Room）。所有其他房间都从客厅分出去。Linux 文件系统的“客厅”就是根目录。如果你搜索文件系统层次结构，将找不到一个名为
  "root" 的文件。根文件夹位于上方图片的顶部，并指定为 `/`。就像 root 一样，房主必须打开正门并邀请客人进入。


  ## bin (二进制文件目录)

  `bin` 字母代表 "binary（二进制）”。此文件夹包含通常执行的内置可执行程序。该子目录的绝对路径简单地说是 `/bin`。正如上一节提到的，`/` 或正斜杠代表根目录，而
  `bin` 是根目录内部或下方的子目录。


  在我们的 Linux 房子里，这里是厨房，是烹饪美味佳肴的地方。这些 `/bin` 程序就是我们可以混合在一起做出令人兴奋的菜肴的食材。我们将在 Linux 命令行章节中学习更多关于这些内置程序（食材）。


  ## boot (启动目录)

  此文件夹还包含与启动相关的文件，除非该用户知道自己在做什么，否则最终用户最好不要触动此文件夹的内容。在 Linux 中，可能会将操作系统置于一种无法正常运行的状态。你通常不会在这个目录中花费大量时间。


  在我们的 Linux 房子里，这是通往房子的的人行道。`boot` 目录引导你进入房子，就像 `boot` 目录包含了启动并让你进入 Linux 的指令一样。


  ## dev (设备目录)

  将缩写 `dev` 视为代表 "device files（设备文件）"。此文件夹包含安装在系统中所有基本设备的数据。与 Windows 不同，Linux 设备文件可以由
  root 用户或管理员访问，具体取决于用户拥有的权限。在某些情况下，管理员甚至可以访问控制硬盘和其他基本设备的文件。


  设备需要内核驱动程序来连接到 Linux 内核。某些 Linux 内核驱动程序还通过此目录向用户暴露其接口。例如，树莓派和其他微型计算机上打印日志的旧版 UART。


  在我们的 Linux 房子里，这些是房子的家电器。炉子、冰箱、洗衣机以及水池和马桶都供家庭使用。Linux 内核驱动程序是连接家电器与外部世界的电线和水管。Linux
  驱动程序隐藏在视图之外，就像线路和水管在墙内一样。某些驱动程序通过 `dev` 目录暴露其接口，就像水池向家庭提供水一样。


  ## etc (配置目录)

  `etc` 文件夹包含供系统使用的各个程序的配置数据。这与单个用户的 `etc` 文件夹不同。如果用户拥有适当权限，他们可以使用文本编辑器手动编辑这些文件夹中的数据。


  ## home (用户目录)

  个人用户文件夹位于 home 文件夹中。在 Ubuntu 桌面版中，Download（下载）文件夹和 Documents（文档）文件夹可以在家 目录找到找到。在命令行中，它看起来可能像
  `/home/username`。例如，如果用户名恰好是 Kevin，那么命令行看起来就会是 `/home/kevin`。


  家目录有一个快捷符号是 `~`。我们将在 Linux 命令行章节中详细讨论它，但 kevin 可以通过 `cd ~` 或 `cd /home/kevin` 快速跳转到家目录。


  在我们的 Linux 房子里，这些是房子的卧室。Kevin 有他自己的卧室，Suzy 也有她自己的卧室。他们将私有物品放在各自的卧室里。卧室类似于家目录。每个用户的个人设置都存储在
  home 目录中。每个用户都可以根据自己的意愿在主目录中创建并添加文件，就像每个人都可以装饰自己的卧室一样。


  ## lib (库目录)

  Linux 系统库在终端中可能显示为直接路径 `/lib`，包含了应用程序运行所需的共享库。应用程序的正常运行需要这些库。


  在我们的 Linux 房子里，这是存放烹饪用调料的储物室。调料并非每顿饭都用，但在需要时可用。主食材是 `/bin` 目录中的程序，而为了味道恰好，需要储物室里的调料。


  ## media (媒体目录)

  `/media` 文件夹或目录包含子目录和子文件夹，存储媒体的可移动设备可以挂载在其中。没有这个目录，如 USB 驱动器和 DVD ROM 等设备可能无法正常工作。


  在我们的 Linux 房子里，这是通往房子的车道。访客（USB）在进入房子之前必须停在车道上。


  使用方法：当你插入带有媒体文件的 USB 驱动器或新的可移动设备时，查看它是否被添加到此文件夹。


  ## mnt (挂载点)

  `/mnt` 指 "mount（挂载）" 命令。该命令允许你挂载和卸载文件。`/mnt` 目录为挂载更永久的文件（如 CD 或 DVD 驱动器）提供位置。


  在我们的 Linux 房子里，这是房子附属的车库。常住户停在车库里而不是车道上。


  ## opt (可选目录)

  此目录存放由用户或管理员物理配置的软件应用程序。你可能会在这里找到你的桌面环境和其他对系统非必需的软件文件。


  在我们的 Linux 房子里，这是后露台。它提供了一些必要的休闲空间，但并不是房子的重要部分。


  ## proc (过程目录)

  `/proc` 目录包含许多关于你 Linux 系统的细节。存储在这里的文件被称为“虚拟”文件，因为它们实际上并不存在于磁盘上。如果你拥有适当权限，仍然可以探索此目录，以了解更多关于你运行的计算机上的
  Linux 系统和程序。将 `proc` 目录中的文件想象成最近访问过的文件的幽灵，可能有所帮助。


  在我们的 Linux 房子里，这包括温控器、水表和电表。如果你想查看房子里发生了什么，你会检查温控器查看温度是多少，检查水表查看你用了多少水，检查电表查看当前正在使用多少电。


  ## root (root 目录)

  这是 root 用户的家目录。root 被认为是任何事的最高级别。在我们的 Linux 房子里，这是主卧。当你坐在客厅时，你是在说这是 root 的卧室，但那里是存放个人物品的地方。


  ## sbin (系统二进制目录)

  `/sbin` 目录包含影响整个系统的系统命令，只有 root 用户允许运行它们。在我们的 Linux 房子里，这是私人图书馆或家庭办公室，包含了房子的设计图。root
  居住者通常使用它。


  ## sys (系统目录)

  `/sys` 目录在虚拟系统中存储设备信息的临时文件。这与 `/proc` 目录非常相似，基本上是它的新版本。`/sys` 目录通常有更多控制设备的方法。在我们的
  Linux 房子里，这包括温控器、水表以及灯开关、水龙头。我们可以根据需要开启或关闭水电。


  ## tmp (临时目录)

  `/tmp` 目录存储应用程序和用户的临时文件。不要在 `/tmp` 文件夹中存储任何重要内容，因为内容在用户注销或系统关闭时可能会定期删除。在我们的 Linux
  房子里，这是垃圾桶。


  ## usr (用户资源目录)

  尽管它看起来是 "user（用户）"的缩写，但它代表 "Universal System Resources（通用系统资源）"或 "Unix System Resources（Unix
  系统资源）"。无论如何，`/usr` 目录仍然存储 Linux 上个人账户使用的许多信息，包括二进制文件和文档。在我们的 Linux 房子里，这是存放所有手册和家用电的抽屉。


  ## var (变动目录)

  `/var` 文件夹包含系统在运行时写入的文件。`var` 是一个高级目录，不会通过网络与其他计算机共享。它包含一些报告系统问题或健康的日志文件。在我们的 Linux
  房子里，这是洗衣间。当你走进洗衣间时，你可以从衣服判断出刚才在玩什么。


  ## 常用快捷方式

  - 单个 `.` 表示当前目录。

  - `..` 表示当前上方的父目录。

  - `~` 是家目录的快捷符号。我们将在 Linux 命令行章节中详细讨论，但 Kevin 可以通过 `cd ~` 或 `cd /home/kevin` 快速跳转到家目录。


  ## 快捷方式

  - 单个 `.` 表示当前目录。

  - `..` 表示当前上方的父目录。

  - `~` 是家目录的快捷符号。我们将在 Linux 命令行章节中详细讨论它，但 Kevin 可以通过 `cd ~` 或 `cd /home/kevin` 快速跳转到家目录。


