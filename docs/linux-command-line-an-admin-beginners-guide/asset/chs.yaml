  # 项目创意

  现在你已经对 Linux 文件系统及其结构有了通用的了解，并且知道如何使用它的基本命令和选项，你可能想通过尝试一些基础项目来进一步深化学习。


  ## 基础 - 入学者友好


  ### 继续学习 Bash

  你可能想继续学习 `Bash` 脚本语言，并尝试编写更复杂的命令。你甚至可以尝试编写一两个省力程序。这样的项目可能需要像 `alias` 和 `grep`这样的命令，并结合管道（piping）等技术。在熟悉了将基础命令组合之后，你可以开始使用条件检查和循环来真正增强你的脚本功能。


  让我们你想写一个程序来查找当前目录下的文本文件，并将结果限制在 2 个文件。

  ![](img/Image00084.jpg)


  在创建自动化消息（例如群发邮件）时，你可能可以使用这样的简单命令，而且你已经学的命令还可以完成许多其他事情。在互联网上搜索是了解你可以做哪些事情的好方法。输入类似“在
  `Bash` shell 中编写基础程序”的内容，并点击你感兴趣的链接、教程或视频。如果你有具体的项目，请根据你的特定需求定制搜索。


  多练习使用管道和 `grep`。将不同的命令组合在一起，或将你知道的命令应用于项目中，以扩展你的学习并了解它们是如何相互整合在一起的。


  ### 学习编程语言基础


  #### Python

  你可能会惊讶地发现，Linux 环境中的许多程序都是使用 `Python` 脚本语言创建的。许多 Linux 发行版都预装了 `Python`，而某些专门为编程爱好者和爱好者制作的
  Linux 发行版（如 `Raspbian`）甚至会将 `Python` 编程教程作为标准桌面程序。


  通过通过学习如何编写一个可以在你的 Linux 机器上运行的简单程序来提高你的编程知识。关于从哪里开始的建议可能包括在互联网上搜索“学习 `Python`”。你可能会在付费选项中发现许多免费教程，或者你可以通过
  Amazon 的 Kindle Unlimited 服务购买或借阅电子书。自信地应对下一个项目吧。


  #### C 和 C++

  为了使用其他 Linux 功能，你可能想学习一些 `C` 编程语言的基础。这样做将使你能够像之前提到的那样在 `csh` shell 中输入命令。你可能还会学习如何为
  Linux 编写程序和应用。


  ### 设置树莓派项目

  `Raspberry Pi` 是一种简单的微型电脑，小到可以握在手心中。不要被它的尺寸欺骗了；它仍然可以用于构建惊的项目。


  #### 简单的一体机

  你是否想过拥有一台“一体机”桌面电脑（即开箱自带显示器和所有硬件，不需要连接主机的电脑），但认为它们贵得惊人？好消息是！你现在可以通过设置 `Raspberry
  Pi` 微型电脑并将其连接到旧 LCD 显示器上，创建一个类似的东西。


  对于这个项目，你需要学会：

  * 组装一台基础电脑。

  * 将 Linux 下载到内存卡中。

  * 在终端中配置选项。


  这个项目相对容易完成——只需使用随你的 `Pi` 附带的构建包组装 `Raspberry Pi` 即可。如果你需要帮助，快速搜索互联网应该提供大量的教学视频。接下来，如果你的构建包里没有内存卡，请写入一个
  `Raspbian`。插入你写入了 `Raspbian` 操作系统的内存卡，然后接通电源并启动。


  使用 USB 扩展棒或接头将 `Pi` 连接到显示器并固定好。你现在拥有一台功能完备、“一体机”，没有可见的主机，并且具有无线连接能力。练习在上面浏览网页和安装新程序。如果你需要扩展存储空间，可以使用硬盘，它们应该可以通过标准的
  `USB` 端口连接。


  ## 中级


  ### 设置小型家庭服务器

  你不需要等到学会一种完整的编程语言就可以在 Linux 中做一些有意义的事情。如果你有一台闲置的小电脑并想重新利用它，你可以建立一个家庭服务器，以增加你自己网络的安全性。


  在我们开始之前，这里是你可能需要知道的一些命令：

  * `mkdir`

  * `sudo apt-get install`

  * `adduser`

  * `addgroup`

  * `hostname -i`

  * `chmod`


  #### 第一步：选择一台作为服务器的电脑

  此项目请使用小电脑，无论是旧的过时电脑还是 `Raspberry Pi` 微型电脑。你可以通过外部硬盘增加物理存储空间，不要认为你需要一台具有大量内存或处理能力的电脑来当服务器。


  #### 第二步：安装 Linux

  使用 `Debian` 的 USB 拷贝或专门为服务器使用配置的 Linux 版本。将程序的 USB 拷贝插入你想要重新利用作为服务器的电脑的 USB 端口，并按照提示进行安装。选择服务器版本，然后选择
  `LAMP` 软件包安装。




  LAMP 代表“Linux, Apache, MySQL, PHP”。在安装期间预装这些软件包将允许你跳过配置过程中的一些步骤。你可以选择为你的项目提供桌面环境，也可以决定不需要它，并选择将其仅保持为命令行界面。运行安装过程并按照提示设置好一切。


  ### 第三步：下载

  打开你的命令行并输入：

  ![](img/Image00085.jpg)


  记住 `sudo` 可以读作“以超级用户身份执行（super user do）”，它可能是获取执行管理任务权限的一种方式，否则 Linux 会阻止你执行这些任务。请尝试逐个输入所有命令，而不是一次性全部。


  ### 第四步：输入 IP 地址

  将“ubuntu”替换为你想要为服务器使用的名称，并输入你的静态 IP 地址。如果你不知道它，请使用带有 `-i` 选项的 `hostname` 命令


  就是这样——你现在准备好将其转换为一个私有服务器，用于存储和远程访问家庭媒体文件（如图片、音乐、视频等），同时确保你的数据安全，免受云共享网站数据挖掘行为的影响。如果你愿意，可以采取额外的步骤将其转换为
  Web 托管服务器，并让人付钱让你托管他们的网站。在在此之前，你可能还想再学习一个命令。


  #### tasksel

  解释：此命令代表“任务选择（task select）”，旨在那些想要将 Ubuntu Linux 用于服务器的用户。如果你确切知道想让服务器做什么，只需运行 `tasksel`
  命令即可安装创建特定服务器所需的软件。要使用 `tasksel` 命令，请输入 `sudo tasksel`。在你设置服务器后，可能需要此命令。


  现在，去制作你的服务器吧！


  ### 进阶

  物联网，或 `IoT`，非常迷人。你可以连接无人机、无线“智能”摄像头，甚至创建小型机器人设备，它们可以向服务器发送消息告知你它们状态。你可以将 `IoT` 技术用于许多领域，包括能够感知库存不足并向你发出订货信号的自动售卖机，消除手动检查的需求。这项技术的一个流行用途是智能摄像头。


  你可以尝试制作你自己的小型 `IoT` 项目，例如远程连接一个 `Linux` 终端来编写一个无头系统，为机器人或远程控制摄像头供电。你可能需要了解 `Python`
  并非常熟悉如何无线连接到 `Linux` 机器，因为你可能不希望你的新机器通过你必须在机器屏幕上访问的终端来接收命令。对于这个项目，你可能需要学会：


  * 使用 `Python` 编程。

  * 理解基础机器人原理。

  * 无头且无线地连接到 `Linux` 系统。


  关于更多信息，请查询一些无人机和小型机器人构建教程。你可能需要特殊的线缆和一些编程知识才能让你的作品按照你的想法运行。遗憾的是，这本书不会涵盖除基础 `Bash`
  脚本可能需要的知识之外的许多编程语言。如果你认为自己已准备好应对更大的项目，不要让这些内容让你沮馁——网络上有许多关于开启兴奋的 `AI` 世界的免费资源。你甚至可能会发现可以帮助你构建和项目的社区，它们甚至提供逐步教程。还有各种地方可以发布问题以获取社区反馈，所以如果你对此感兴趣，一定要尝试一下。


  ### 阅读建议

  这取决于你想知道什么。读完这本书后，你现在应该已经了如何操作 `Linux` 终端并输入简单命令的基础知识。通过使用教程，你可以创建一些非常棒的作品。


  如果你想进入编程领域，你需要掌握如 `Python` 这样的编程语言，并且需要更习惯在 `Bash` Shell 中输入命令。


  书中包含的练习非常基础，完全没有挑战性，但重点是让你习惯命令行。要在 `Linux` 中真正开始编程，你需要拿起你学到的少部分知识并对其加以扩展。随处寻找资源和教程，并练习编写和执行小型程序。像一个专注的学生一样努力，你将取得惊人的进展。


  记住，你已经掌握了所有的基础。现在，你只需要知道如何将这些积木组合在一起，创建更令人深刻目的程序。从慢开始，然后逐步推进。构建小型项目，直到你习惯更大的项目。


