  # 第五章：Linux 命令行 - 基础


  Linux 中的所有内容，从你的根文件系统到你的程序，都以文件或目录的形式存储。事实上，甚至目录也是一个文件。为了获得对 Linux 文件的完全访问，你可能需要学习如何使用命令行。命令行是一种比图形用户界面（GUI）更强大的访问文件的方式，通常比使用
  GUI 界面提供更多选项。


  回顾一下，GUI（图形用户界面）是显示的屏幕，其中包含可以点击的图标，用于访问你所需的编程文件。在大多数 Linux 版本中，大多数日常功能都可以通过 GUI
  完成。然而，要成为 Linux 高级用户，你必须学会使用命令行，以获得对文件系统和程序更灵活的控制控制力。命令行有时被称为行用户界面，或 `LUI`。它最常见的名称是命令行界面或
  `CLI`。在本章中，我们将涵盖一些基础命令，帮助你更习惯地使用 `CLI`。


  在计算机上有多种方法可以完成这些练习。你可以像附录 A 中那样在 VirtualBox 中运行完整的 Ubuntu 安装。Ubuntu 也可以从可启动的 Live
  USB 镜像运行，但你无法像使用 VirtualBox 安装那样在 Ubuntu 和 Windows/Mac 之间切换。


  另一个选项是在浏览器中打开虚拟终端模拟器。要找到终端模拟器，可以尝试搜索“virtual Linux terminal”。我实际上喜欢使用 `webinal.org`，因为终端从用户模式提示符（`~`）启动，而不是根用户模式提示符（`#`
  - 后文将详细解释）。一个带有虚拟 Linux 终端列表的良好资源是 `https://itsfoss.com/online-linux-terminals/`。


  在我们开始之前，现在是拿一把铅笔和一个笔记本做笔记的好时机。通过实际操作练习并仔细做笔记，你更有可能学到东西。如果你刚开始，列出的某些命令看起来有些相似。请记住，记忆所有这些命令需要时间，所以放慢速度，聪明地工作。做笔记可以防止自己感到无从从，因为人类大脑一次只能吸收少量信息。要成功学习某些知识，你应该将信息拆分成小块，而不是尝试一次性硬记。


  好了，铅笔和笔记本已准备好，电脑也打开了，让我们开始吧。我们将在示例中使用 Ubuntu。要开始，请打开终端。如下所示，你将搜索 Terminal 然后点击它。


  ![](img/Image00003.jpg)


  终端应用程序应该像这样：

  ![](img/Image00004.jpg)


  打开终端 - 你应该看到类似 `username@machinename~$` 的内容。美元符号 `$` 用于表示用户模式。它与井号或散列表 `#` 不同，后者用于表示根用户模式。记住，你无法在
  Ubuntu 中直接获得根用户访问权限；你必须输入 `sudo`（这是访问根目录的命令），然后输入你的命令。我们将在另一个章节中讨论如何操作。现在，让我们关注一些基础命令。


  ## 命令行 - 基础命令


  | 命令 | 说明 |

  | :--- | :--- |

  | `pwd` | 打印工作目录 |

  | `cd` | 切换目录 |

  | `clear` | 清除终端 |

  | `ls` | 列出目录 |

  | `file` | 文件属性 |

  | `mv` | 移动文件或目录 |

  | `cp` | 复制文件 |

  | `mkdir` | 创建目录 |

  | `rm` | 删除文件 |

  | `rmdir` | 删除空目录 |

  | `touch` | 创建空文件 |

  | `cat` | 合并文件（转储结果内容） |

  | `echo` | 将内容回到终端 |

  | `less` | 显示文件内容 |

  | `head` | 显示文件的前 20 行 |

  | `tail` | 显示文件的最后 20 行 |






  # 命令选项

  有时你可以为命令添加选项以使它们执行不同的功能。例如，你可以为 `file` 命令添加 `-b` 来显示简短版本。如果你只想在简短模式下查看文件类型，这可能会大派用场。在将此命令与选项结合使用时，请使用以下语法：`file
  [option] [filename]`。要查看完整的选项列表，请参考 `man` 命令，或在终端中输入命令后输入 `man`（例如 `file man`）来查看帮助页。你可能还可以使用
  `--help` 选项，例如 `ls --help`。


  ## 基础导航

  以下命令用于在文件系统中移动。


  ## pwd

  `pwd` 是 "print working directory"打印工作目录）的缩写，当使用此命令时，它会在屏幕上打印当前工作目录的完整路径。要使用它，只需输入
  `pwd` 并按回车键。你会得到类似 `/users/files/namedfolder` 的输出。


  示例：![](img/Image00005.jpg)

  在上面的示例中，当前工作目录是 `/home/linux12`，因为我们是以用户 `linux12` 登录的。我们可以从括号路径中的 `~` 推测出这一点。我们也可以通过提示符处的
  `$` 看到我们正处于用户模式。


  解释：

  Linux 系统可能要求你输入非常特定的命令来获取你想要的结果。你所所在的文件夹对于判断这些命令是否成功至关重要。程序不会假设你对当前文件夹以外的任何内容都有权限。但有时你可能不确定自己在哪里，而
  `pwd` 命令可以让你知道自己所处的位置。在这种情况下，我们在 Linux 房子的一间卧室里。


  ## cd

  此命令是 "change directory"（更改目录）的缩写。要切换到比当前工作目录更深层目录，请输入 `cd`，按下空格键，然后输入要移动的目录名称。假设我们正在尝试访问当前目录下名为
  `"my_test"` 的文件夹。我们将输入 `cd my_test`，然后按回车键。

  这样做是请求在当前文件夹中寻找 `"my_test"`。不熟悉 Linux 中文件和文件夹导航的人可能认为相对命令不起作用，认为访问文件和文件夹的唯一可靠方法是输入绝对路径，例如
  `cd misc/var/web`。虽然 Linux 确实识别相对命令，但其语法略有不同。


  示例![](img/Image00006.jpg)

  解释：

  上面的示例中包含很多操作。我们进入了 `my_test` 目录并打印工作目录，以确保我们处于所想的位置。`".."` 意味着父目录，因此 `cd ..` 将我们带回之前的家目录。然后我们切换到根目录并确认位置。`-`
  用于回到我们上一次所在的目录，因此 `cd -` 将我们带回家目录。

  互联网上许多关于使用 Linux 命令行的教程可能会让这个过程看起来比实际要复杂。初次使用命令行且不熟悉相对命令的人可能会犯在每次尝试执行命令时都输入完整路径的错误。你不需要这样做。请记住，Linux
  使用的是与 Windows 不同的语法。例如，在文件夹名称之前输入 `/` 就像是要求它在根目录下查找文件夹。如果该文件夹不在根目录下，你可能会收到错误消息。同样，如果你尝试在
  `~`（即家目录）中查找文件夹，而该文件夹不在该目录下，你也会收到错误消息。

  使用 `pwd` 和 `cd` 命令来移动并理解文件系统结构。


  示例：

  让我们从命令行中的家目录或 `~` 文件夹移动到 Desktop 文件夹。只需在命令行输入 `cd Desktop` 并按回车键。你现在应该看到类似的内容：![](img/Image00007.jpg)

  要返回，输入 `cd $HOME` 或 `cd ~`（在此上下文中， `$HOME` 和 `~` 代表同一个家目录）。这两个命令都会将你带回文件夹。你现在应该看到下面的内容：![](img/Image00008.jpg)

  你是否注意到目录与你在 Desktop 文件夹时有什么不同？


  练习：

  在你的 Linux 设备或虚拟机上打开命令行并输入 `ls`。这应该列出你设备上的文件和文件夹列表。接下来，使用“更改目录”命令。输入 `cd`，按下空格键，然后输入你想访问的文件夹名称。对于这次练习，让我们使用
  `etc`。为了确保你已进入正确的目录，请使用 `pwd` 命令，该命令将在下文中解释。


  ## 文件类型与组织

  使用命令行时，你可能想要检查文件的具体信息。它是文件还是目录？它是文本文件还是可执行文件？


  ## clear

  当你向终端输入命令时，它通常会变得非常杂乱，特别是如果你最近使用命令行下载了新软件。当屏幕变得杂乱时，会让你更难专注于下一个命令。杂乱的命令还会阻碍你之后想要实现的命令。虽然使用
  `Escape`、`Delete` 和 `Backspace` 无法删除你的旧命令，但如果你只想清除屏幕，并不非关闭终端并重新打开。

  只需在 `$` 之后向终端输入 `clear`。屏幕应该就会清空，你就可以继续输入命令。


  ## ls

  你可以使用 `ls` 或 `"list"`（列出）命令来显示当前工作目录中的文件。记住，当前工作目录是你命令行所在的目录。当你移动到一个新目录时，它就变成了你的当前工作目录。输入
  `ls` 以生成文件列表。`ls` 命令本身列出当前目录下的所有文件。但如果你在 `ls` 之后加上路径，你可以列出任何目录的文件。输入 `ls /` 查看根目录的文件，或输入
  `ls /etc` 查看等 目录的文件。


  示例![](img/Image00009.jpg)


  ### 有用的选项

  `ls` 命令的输出有很多有用信息。每行打印多个值。许多选项可以根据你的需求定制 `ls` 命令。我们将只涵盖几个常用的选项，但你可以通过输入 `ls --help`
  查看完整列表：

  - `-l`：长格式列表（小写 l）

