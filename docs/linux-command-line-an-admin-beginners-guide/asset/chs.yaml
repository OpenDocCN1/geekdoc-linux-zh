  ## 文件与目录

  如之前提到的，并不是每个用户都拥有管理员权限。在某些情况下，用户对某些文件的访问权限可能会受到限制。Linux 中的某些命令可以授予用户他们通常不具备的权限，例如读取、写入和执行。这些命令还可以更改用户对某些文件的权限。


  让我们再次查看 `ls -al` 命令。(Image00069.jpg) `rwx` 在 Linux 中，`rwx` 代表“读取、写入、执行”。(Image00070.jpg)
  左侧的第一个条目将指示这是一个文件还是一个目录。注意 `Desktop` 是一个目录，而 `hello3.txt` 在第一个条目中为 `-`，因此它是一个文件。共有
  3 组 `rwx`。从左到右读，第一组 `rwx` 属于所有者或用户（User）。第二组属于组（Group），最后一组属于其他人（everyone else）。


  所以，如果我们查看 `hello12.txt` 文件，我们可以看到 `linux12` 用户可以读取和写入，而 `linux12` 组中的人员可以读取和写入。其他人只有读取权限。没有人拥有执行权限。由于该文件是文本文件，预计它不是可执行的。然而，这是脚本中的一个常见问题——有时它们因为缺少执行权限而无法运行。解决方案就是添加执行权限。


  在 Linux 中，`rwx` 用于表示每个用户对某些文件拥有的权限。例如，在 Ubuntu Linux 中，没有任何用户拥有 root 用户文件的 `rwx`
  权限，因此他们需要使用 `sudo` 切换到超级用户模式来访问这些文件。


  ### `chmod`

  用于更改文件的访问模式，可以读作“change mode”（更改模式）的缩写。`chmod` 后第一个参数选择要更改的是用户、组、其他人还是所有人。其简写为：`u`
  代表用户，`g` 代表组，`o` 代表其他人，`a` 代表所有人。第二个参数选择更改的内容。你是在添加 `(+)` 还是移除 `(-)` 权限？第三个参数选择
  3 种属性中的哪一个发生更改。你是在更改读取、写入还是执行权限？有些人将其描述为指定谁更改、更改什么以及更改哪一项。


  例如，假设你创建了一个名为 `bubba.sh` 的脚本，但它没有如所示运行。(Image00071.jpg) 你能猜出它为什么不运行吗？！是的，问题在于它没有执行权限。所以让我们自己和我们的组赋予执行权限。(Image00072.jpg)
  要执行此命令，你可能需要在 webinal 中拥有管理员权限。然而，在大多数 Linux 平台上，你应该拥有某种程度的执行权限。Webinal 锁定了他们的权限，因为它是一个共享浏览器
  shell。


  **练习**：使用 `chmod` 命令将你之前练习中创建的一个文档文件更改为“只读”。如果你不确定如何操作或收到了错误消息，请至少尝试三次，并记录你每次的发现。


  ### `chown`

  `chown` 命令与 `chmod` 命令类似，使用此命令允许你通过命令行输入命令来更改文件所有者和组。要使用此命令，输入 `chown`、你想要拥有该文件的用户，然后跟一个冒号，最后是组名和文件本身。例如，如果你想让
  root 用户和 root 组拥有名为 `file2` 的文件，你需要输入 `chown root:root file2`。(Image00073.jpg) 在上面的示例中，用户
  `root` 和组 `root` 是不允许的，但你明白意思了。


  **练习**：更改你在之前的练习中创建的列表的所有权，让你没有权限通过终端访问它。写下你采取的步骤。


  ### `setuid`

  程序和脚本通常以用户 ID 和组 ID 的权限运行。`setuid` 命令允许用户设置用户 ID 或将其权限分配给另一个用户。例如，如果你想让具有普通用户访问权限的程序以管理员权限运行，就会使用
  `setuid` 命令。使用此命令时要非常小心，因为它通过绕过 Linux 为我们提供的自然分层可能会导致安全问题。如何判断 `setuid` 已设置？在用户字段中本应是
  `x` 的地方寻找 `s`。(Image00074.jpg)


  ### `setgid`

  `setgid` 可以读作“set group id”（设置组 ID），与 `setuid` 标签类似，但针对组权限，并且它涵盖了目录和文件。


  ## 用户唯一目录

  `/home/${USER}${HOME}`

  这是特定用户的家目录。由于这是用户的家目录，提示符将包含一个 `$`。快速到达这里的方法是输入 `cd $HOME` 或 `cd ~`。(Image00075.jpg)


  `/etc/passwd`

  这不是存储单个用户密码的目录；相反，它是定义用户帐户的地方。你可以通过此目录找到用户名和用户账户的 ID 号，还可以在这里找到账户的组 ID 号。在某些情况下，你还可以访问用户的全名、家目录以及默认
  shell 的位置。密码以及其他重要的用户和系统登录信息存储在 `/etc/shadow` 中。尽管手动尝试编辑这些某些文件可能很有吸引力，但最好不要。如之前所述，Linux
  可能会将程序存储在许多不同的地方，在不更改相关文件的情况下更改单个文件可能会导致文件不同步以及某些程序出现异常。


  ## 进程与任务

  在本节中，我们将介绍如何检查正在运行的进程、如何将不需要用户输入的进程放入后台，以及如何将进程带回。我们还将涵盖检查哪些进程正在运行以及哪些任务（jobs）之间的区别，并介绍一些杀死方法。进程是一个正在执行的单一程序。任务可以由多个进程组成。


  ### `ps`

  此命令代表“process status”（进程状态），并检查正在运行的进程。使用它就像输入任何命令一样简单。`ps` 命令允许用户查看运行进程的状态。要使用此命令，在终端中输入
  `ps`。你应该得到一个如下所示打印输出：Image00076.jpg) 让我们逐一查看看到的每个部分。在最左侧，你看到 `PID`，代表“process ID”（进程
  ID）。旁边是字母 `TTY`，代表“终端类型”。`TTY` 旁边是 `TIME`，后面跟着 `CMD`，代表正在运行的命令。每个执行的程序都有一个进程 ID，因此在这种情况下我们有程序运行。不幸的是，这并不好用。正如表格所示，`ps`
  命令只向我们显示关于 1) 它本身和 2) 打开的终端的信息。如果我们只是在玩终端，这是可以的，但我们可能需要在此命令之前添加选项才能变得有用。


  ### `ps`

  我们不仅仅满足于 `ps`，还可以添加几个选项让它变得有用。添加 `-elf` 会为我们提供带有更多详细信息的进程长列表。`-e` 代表“extended”（扩展）。你可以使用此命令来查看未提供的信息。在终端中输入
  `ps -e` 并查看结果是什么。你能理解给出的信息吗？如果不能，尝试添加 `-l` 选项。`-l` 代表长列表。在终端中输入 `ps -el` 查看结果。接下来我们将添加
  `-f` 选项，它代表“force”（强制）。在终端输入整个命令：`ps -elf`。这与之前的有什么不同？


  **练习**：打开几个程序并在不带任何选项使用 `ps` 命令。得到了什么？然后尝试添加 `-e`、`-l` 和 `-f` 选项。写下你的发现并回答此问题：如何使用选项来创建更好的命令？


  ### `top`

  这类似于 Windows 的任务管理器。它显示正在运行的程序和进程。在终端中输入 `top` 来使用它。你可以使用 `top` 命令获取列表，它应该显示出来。它允许你通过按
  `k` 来杀死进程。`top` 命令用于显示 Linux 进程。你还可以与其他命令结合以进行不同的用途。例如，你可以根据 CPU 占用率对进程进行排序。这使得发现挂起的进程变得容易得多。你还可以使用
  `-n` 选项让 `top` 命令刷新次数。


  ### `sleep`

  此命令允许你通过创建一个持续的进程来暂停系统，这在编程或测试系统时非常有用。要使用此命令，输入 `sleep` 以及时间，单位分别是 `s` 秒、`m` 分、`h`
  小时或 `d` 天。如果你需要暂停系统，输入 `sleep` 命令并让它运行比一天更长的时间。此命令有许多用途。例如，如果脚本正在干扰某个程序，你可以让它挂起直到运行。这还有助于发现软件的漏洞。选项：如我们探索过的，`sleep`
  命令可以与其他命令结合使用，或者作为 `while` 循环或其他部分，取决于你如何 Bash 编程。


  **练习**：使用 `echo` 命令配合 `sleep` 命令。输入 `echo "string"; sleep <time>` 并设置几秒。记录你的结果。


