    able to access that file simply by typing the filename, and maybe sudo if your
    account does not have administrator permission.In our house example, we can describe
    a relative path asOn the other hand, if you are working in another folder or directory,
    let's say, the root directory, and you typed in just the name of the file, you
    might come up with an error. Remember that, in the previous scenario, you stored
    the file in the home directory and not the root directory. Merely typing in the
    name won't work--you will either have to change directories and then type in the
    relative path.Another option is to type in the absolute path which is the entire
    path to that file starting at the root directory. Let's assume that you already
    know the path, in this case, let's say it's something like, /home/usr/passwords.
    Typing this whole path into the terminal would be one way to get to the file you
    need.Quiz Time:Take out your notebook and answer the following questions. Feel
    free to look at an earlier part of the chapter if you think you need a reminder.What
    is housed inside the Linux file system?Why is it important to know what kind of
    files each folder is designated to handle?Answers:The Linux file system houses
    files and directories that are vital to the operation of the system in addition
    to files that are important to the user.Linux has designations for what certain
    programs do, based on where they are stored.Where you store a file in Linux is
    important, but it's also important to understand syntax. You might have noticed
    that the cd and ls commands follow a certain format. What did they have in common?
    For one thing, they were all lowercase. Capitalization or lack thereof is important
    in Linux, which is a concept we will go over in the next section.Capitalization
    and Syntax in LinuxCapitalization does not necessarily matter in Windows, but
    in Linux, lowercase and capital letters are treated as different letters. For
    example, a folder called "home" would not be the same as "Home." It is also true
    of your username login.Did you notice that some of the subheadings in this book
    are not capitalized? It's not an oversight by the editor - in Linux, capitalization,
    or lack thereof, matters, and those subheadings were written to remind you how
    to properly write the commands.Linux is very sensitive when it comes to capitalization
    and the correct usage of syntax. You may want to double-check the commands you
    type to make sure that you've typed in the correct syntax. A missing period, misplaced
    colon, or any other identifying sign could result in an error or could lead you
    to a new directory entirely.Tips for Completing Exercises in Future Chapters:To
    avoid any issues, it's highly recommended that you look at all examples very carefully
    and make sure you understand what is being presented before practicing on your
    own. If there is ever any doubt and you have internet access, you should consult
    the internet, especially the Linux forums and tutorial websites, for more information.
    However, it is best to search for the answer yourself if you want to strengthen
    your programming abilities and understanding of the Linux system.Let's say you
    type in a directory path and get an error. Look at the picture and provided examples
    carefully--did the instructions tell you to type in a backward slash or a forward
    slash? Did you miss any steps, such as first checking if that directory existed?If
    you don't understand the information presented, re-read it while carefully taking
    notes. Ask yourself, "what exactly do I not understand?" If it's something simple,
    for example, you aren't sure whether the command is asking for a capital "I" or
    a lowercase "l," try applying some logic. What does the command stand for? If
    it appears to stand for something that starts with an "l," such as list, it's
    reasonable to guess that it's a lowercase "l." You should also keep in mind that,
    with a few exceptions, most commands in Linux are in lowercase. If there's a time
    where they are not in lowercase, it is one of those few exceptions and will be
    clear from the context. If there is ever any doubt go with lowercase.Although
    this book is designed to be beginner-friendly, it may appear confusing at first
    while you are familiarizing yourself with the Linux terminal and trying to learn
    the commands. Don't get frustrated if you type a command and receive an error
    message. You may have mistyped or entered the wrong letter or symbol, which is
    easy to do if you are just starting.There's also a good chance that you're simply
    in the wrong directory or you may be attempting to perform operations that you
    don't have permission to perform, depending on what version of Linux you're using.
    These errors appear more often if you are searching for online help without a
    full understanding of your system. This should be less of a problem for you if
    you're using the latest version of Ubuntu Linux because the examples in this book
    assume you are using Ubuntu Linux. If you still want to follow along using another
    distribution of Linux out of convenience for your situation, feel free to do so.
    You can try learning Kali Linux or Fedora for server maintenance and you don't
    want to go through the extra hassle of learning another version of Linux, for
    example.You should be able to pick up the syntax of your distro of choice fairly
    easily - just don't get discouraged if the commands don't work exactly the same
    in different versions of Linux. The syntax may differ but the basic commands and
    functions are the same; you may just have to learn slight variations in syntax
    to get them to work for you.If you would like more information about the Linux
    file hierarchy, there is a lot of useful information about it online. Feel free
    to do a Google search if you are interested.Chapter Summary
