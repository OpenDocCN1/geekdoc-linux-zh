    | `df` | 显示文件系统空间 |

    | `du` | 磁盘占用 |

    | `free` | 显示空内存使用情况 |

    | `w` | 哪些用户登录了？ |

    | `whoami` | 当前登录是谁？ |

    | `hostname` | 列出机器的主机 |

    | `uname` | 打印内核信息 |

    | `quota` | 用户配额和限制 |

    | `passwd` | 设置/更改用户密码 |

    | `chage` | 强制用户更改密码 |

    | `adduser` | 添加新用户 |

    | `usermod` | 修改用户 |

    | `addgroup` | 添加新组 |

    | `userdel` | 删除用户 |

    | `delgroup` | 删除组 |


