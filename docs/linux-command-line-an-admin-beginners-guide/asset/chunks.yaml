    # 命令选项

    有时你可以为命令添加选项以使它们执行不同的功能。例如，你可以为 `file` 命令添加 `-b` 来显示简短版本。如果你只想在简短模式下查看文件类型，这可能会大派用场。在将此命令与选项结合使用时，请使用以下语法：`file
    [option] [filename]`。要查看完整的选项列表，请参考 `man` 命令，或在终端中输入命令后输入 `man`（例如 `file man`）来查看帮助页。你可能还可以使用
    `--help` 选项，例如 `ls --help`。


    # 基础导航

    以下命令用于在文件系统中移动。


    ## pwd

    `pwd` 是 "print working directory"打印工作目录）的缩写，当使用此命令时，它会在屏幕上打印当前工作目录的完整路径。要使用它，只需输入
    `pwd` 并按回车键。你会得到类似 `/users/files/namedfolder` 的输出。


    示例：![](img/Image00005.jpg)

    在上面的示例中，当前工作目录是 `/home/linux12`，因为我们是以用户 `linux12` 登录的。我们可以从括号路径中的 `~` 推测出这一点。我们也可以通过提示符处的
    `$` 看到我们正处于用户模式。


    解释：

    Linux 系统可能要求你输入非常特定的命令来获取你想要的结果。你所所在的文件夹对于判断这些命令是否成功至关重要。程序不会假设你对当前文件夹以外的任何内容都有权限。但有时你可能不确定自己在哪里，而
    `pwd` 命令可以让你知道自己所处的位置。在这种情况下，我们在 Linux 房子的一间卧室里。


    ## cd

    此命令是 "change directory"（更改目录）的缩写。要切换到比当前工作目录更深层目录，请输入 `cd`，按下空格键，然后输入要移动的目录名称。假设我们正在尝试访问当前目录下名为
    `"my_test"` 的文件夹。我们将输入 `cd my_test`，然后按回车键。

    这样做是请求在当前文件夹中寻找 `"my_test"`。不熟悉 Linux 中文件和文件夹导航的人可能认为相对命令不起作用，认为访问文件和文件夹的唯一可靠方法是输入绝对路径，例如
    `cd misc/var/web`。虽然 Linux 确实识别相对命令，但其语法略有不同。


    示例![](img/Image00006.jpg)

    解释：

    上面的示例中包含很多操作。我们进入了 `my_test` 目录并打印工作目录，以确保我们处于所想的位置。`".."` 意味着父目录，因此 `cd ..` 将我们带回之前的家目录。然后我们切换到根目录并确认位置。`-`
    用于回到我们上一次所在的目录，因此 `cd -` 将我们带回家目录。

    互联网上许多关于使用 Linux 命令行的教程可能会让这个过程看起来比实际要复杂。初次使用命令行且不熟悉相对命令的人可能会犯在每次尝试执行命令时都输入完整路径的错误。你不需要这样做。请记住，Linux
    使用的是与 Windows 不同的语法。例如，在文件夹名称之前输入 `/` 就像是要求它在根目录下查找文件夹。如果该文件夹不在根目录下，你可能会收到错误消息。同样，如果你尝试在
    `~`（即家目录）中查找文件夹，而该文件夹不在该目录下，你也会收到错误消息。

    使用 `pwd` 和 `cd` 命令来移动并理解文件系统结构。


    示例：

    让我们从命令行中的家目录或 `~` 文件夹移动到 Desktop 文件夹。只需在命令行输入 `cd Desktop` 并按回车键。你现在应该看到类似的内容：![](img/Image00007.jpg)

    要返回，输入 `cd $HOME` 或 `cd ~`（在此上下文中， `$HOME` 和 `~` 代表同一个家目录）。这两个命令都会将你带回文件夹。你现在应该看到下面的内容：![](img/Image00008.jpg)

    你是否注意到目录与你在 Desktop 文件夹时有什么不同？


    练习：

    在你的 Linux 设备或虚拟机上打开命令行并输入 `ls`。这应该列出你设备上的文件和文件夹列表。接下来，使用“更改目录”命令。输入 `cd`，按下空格键，然后输入你想访问的文件夹名称。对于这次练习，让我们使用
    `etc`。为了确保你已进入正确的目录，请使用 `pwd` 命令，该命令将在下文中解释。


    # 文件类型与组织

    使用命令行时，你可能想要检查文件的具体信息。它是文件还是目录？它是文本文件还是可执行文件？


    ## clear

    当你向终端输入命令时，它通常会变得非常杂乱，特别是如果你最近使用命令行下载了新软件。当屏幕变得杂乱时，会让你更难专注于下一个命令。杂乱的命令还会阻碍你之后想要实现的命令。虽然使用
    `Escape`、`Delete` 和 `Backspace` 无法删除你的旧命令，但如果你只想清除屏幕，并不非关闭终端并重新打开。

    只需在 `$` 之后向终端输入 `clear`。屏幕应该就会清空，你就可以继续输入命令。


    ## ls

    你可以使用 `ls` 或 `"list"`（列出）命令来显示当前工作目录中的文件。记住，当前工作目录是你命令行所在的目录。当你移动到一个新目录时，它就变成了你的当前工作目录。输入
    `ls` 以生成文件列表。`ls` 命令本身列出当前目录下的所有文件。但如果你在 `ls` 之后加上路径，你可以列出任何目录的文件。输入 `ls /` 查看根目录的文件，或输入
    `ls /etc` 查看等 目录的文件。


    示例![](img/Image00009.jpg)


    ### 有用的选项

    `ls` 命令的输出有很多有用信息。每行打印多个值。许多选项可以根据你的需求定制 `ls` 命令。我们将只涵盖几个常用的选项，但你可以通过输入 `ls --help`
    查看完整列表：

    - `-l`：长格式列表（小写 l）

    - `-a`：列出所有文件，包括隐藏文件（以 `.` 开头）

    - `-s`：按大小排序

    显示当前目录更好的方法是 `ls -l`，因为它提供了更多有用信息。


    示例![](img/Image00010.jpg)

    解释：

    看到每个文件这样显示不是易读得多？注意左侧列的 `"d"`，`Desktop` 和 `my_test` 表示它们是目录。注意文件的修改时间——例如在 2 月
    2 日左右。我们稍后会讨论 `rwx` 字段。

    要查看目录中的隐藏文件，输入 `ls -al` 以长格式显示目录中的内容。


    示例![](img/Image00011.jpg)

    解释：

    注意名称前面的 `.` 表示隐藏文件。在最后，`..` 表示当前目录，`..` 表示父目录，它们都带有 `d` 表示目录。


    ## file

    使用此命令让电脑告诉你文件的类型。只需输入 `file` 后面跟你想知道类型的文件名。当你不确定如何处理特定文件时，`file` 命令很有帮助。假设你在相同名称下保存了几个不同类型的文件（`my_name.png`、`my_name.txt`
    和 `my_name.pdf`），或者你需要重写一个特定文件但不确定它是什么类型。你可以使用 `file` 命令来帮助判断。例如，如果我想知道 `"textfile.txt"`
    是什么类型的文件，甚至是 `cd` 命令是什么，我需要在终端输入以下：


    示例![](img/Image00012.jpg)

    解释：

    `file` 命令告诉我们 `textfile.txt` 文件是 ASCII 文本，就像你读的那样。然而，用于更改目录的 `cd` 命令是由 ASCII 文本制作的脚本，它是可执行的。正如
    Linux 基础目录章节提到的，`/bin` 目录是核心，存放了我们将运行的常用命令行程序。你也可以通过输入 `file *` 来查找当前工作目录下的所有文件。星号
    `*` 向机器信号你想显示当前目录下所有被 Linux 视为文件的特征。


    # 在 Linux 中操作文件

    这些命令用于操作文件，包括创建目录、移动、复制和删除。


    ## mv

    如果你在终端输入 `mv`，你是在告诉 Linux 移动一个文件。要使用此命令，输入 `mv` 和你想移动的文件名，然后输入你想移动过去的位置。完成所有操作后，按回车键。`mv`
    命令也用于重命名文件——将其视为将文件移动到一个新名称。

    示例：

    假设你想把名为 `"photos.png"` 的文件移动到我的 Desktop 目录。你只需要在终端输入：

    ![](img/Image00013.jpg)

    如果你操作正确，`"photos.png"` 文件将出现在我的 Desktop 目录。Desktop 目录位于家目录下，因为 `~` 代表家目录。要重命名文件，你可以进入
    `"Desktop"` 目录并输入新的文件名，`mv photos.png photos`。它现在应该出现在你的 Desktop 文件夹中，作为一个 `photos`
    文件。注意它结尾没有 `.png`，所以我们需要使用文件 `photos` 来确定它是一个什么![](img/Image00014.jpg)


    ## cp

    当你在终端输入 `cp` 时，它代表 "copy file"（复制文件）。在某种意义上，此命令的用法与 `mv` 命令类似。要在相同目录下创建一个具有新文件名的副本，你只需输入
    `cp` 和当前文件名，然后输入你想复制的新文件名。当复制目录时，你可能会收到一条消息，说需要在 `cp` 之后加上 `-r` 来复制。`-r` 是递归的，表示你想复制目录及其所有内容。

    示例：

    首先，我们搞清楚我们在哪里。使用 `pwd` 找到我们的位置![](img/Image00015.jpg)

    这显示了当前目录。现在让我们把 `photos.png` 从 `Desktop/photos` 移动到当前目录并重命名它![](img/Image00016.jpg)

    但是复制整个目录呢？我们可以用同样的方法复制目录吗？[](Image00017.jpg)

    不行。失败了，因为它包含文件。如果目录是空的，复制就会成功。要复制目录及其内部的文件，我们需要使用递归的 `-r` 选项![](img/Image0018.jpg)


    # mkdir

    `mkdir` 的缩写是 "make directory"（创建目录）。将其想象为 Windows 中的“新建文件夹”选项。在 Linux 中输入此命令会创建一个目录。例如，如果你在命令行输入
    `mkdir apples`，它会在工作目录下创建一个名为 `"apples"` 的目录。你也可以通过指定路径来创建一个目录。例如，假设你想在 Desktop
    上创建一个名为 `"photos"` 的文件夹。在命令行输入 `mkdir ~/Desktop/photos`，你的 Desktop 上会出现一个名为 `"photos"`
    的文件夹。

    示例![](img/Image00019.jpg)

    我们查看目录，我们创建了一个新目录。使用 `ls` 命令确认新目录。现在让我们尝试移动一个文件到新目录![](img/Image00020.jpg)


    # rm

    如果你想删除一个文件，输入 `rm` 和你想删除的文件名。确保你想删除的文件位于你所在的目录中，否则它可能会返回错误![](img/Image00021.jpg)

    我们现在创建了一个可以删除的文件（等等，我的意思是删除）。让我们删除它![](img/Image00022.jpg)


    ## 删除目录

    如果你想删除一个包含条目的目录，你可能可能需要在 `rm` 命令之后加上 `-r` 以表示递归删除。当你这样做时，它看起来像 `rm -r dir` 而不是简单的
    `rm dir`![](img/Image0023.jpg)

    我们创建了一个名为 `Desktop` 的目录。为什么？这样我们就可以删除它了![](img/Image0024.jpg)

    但它的作用与 `rm` 命令相同。如果目录仍然包含文件，它将无法删除。记得我们上次删除整个目录和文件吗？是的，我们需要使用 `-r` 命令来删除目录内部的文件![](img/Image0025.jpg)


    # rmdir

    `rmdir` 代表 "remove directory"（删除目录），它看起来像 `rmdir`。当你输入 `rmdir` 和你想删除的目录名称时，该目录应该消失。然而，目录必须是空的。这对于包含内容的目录是无效的。


