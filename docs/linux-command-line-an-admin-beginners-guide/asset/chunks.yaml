    * The Linux file system is like a hierarchy, with the top files being the main
    parts of the directory and smaller, sub-directories underneath.

    * Linux stores everything as a file.

    * Certain file directories complete certain tasks to avoid clutter or confusion.

    * The `/proc` directory can tell you a lot of information about the particular
    system.


    # CHAPTER FIVE: The Linux Command Line - The Basics


    Everything in Linux, from your root filesystem to your programs, is stored as
    a file or directory. In fact, even a directory is a file. To gain full access
    to the files in Linux, you may need to learn how to use the command line. The
    command line is a more powerful way to access files than the GUI and often gives
    the user more options than using a GUI interface.


    To review, a GUI (Graphical User Interface) is the screen that is displayed that
    contains clickable icons to access the programming files you need. Most everyday
    functions can be carried out using the GUI in most versions of Linux. However,
    to become a Linux power-user, you must learn to use the command line for more
    flexibility and control over the filesystem and programs. The command line is
    sometimes called the line user interface, or `LUI`. It is most commonly referred
    to as the command line interface or `CLI`. In this chapter, we will be covering
    some basic commands to help you get more comfortable using the `CLI`.


    There are multiple ways to do these exercises on a computer. You can run a complete
    Ubuntu installation in VirtualBox as covered in Appendix A. Ubuntu can also be
    run from a bootable Live USB image but you won''t be able to jump back and forth
    between Ubuntu and Windows/Mac like you can with the VirtualBox installation.


    Another option is opening up a virtual terminal emulator in a browser. To find
    terminal emulators, try searching for "virtual Linux terminal online". I actually
    like using `webinal.org` because the terminal starts at a user-mode prompt (`~`)
    instead of a root user mode prompt (`#` - explained in more detail below). One
    good resource with a list of virtual Linux terminals was `https://itsfoss.com/online-linux-terminals/`.


    Before we begin, this would be a good time to grab a pencil and a small notebook
    to take notes. You are more likely to learn by actually doing the exercises and
    taking careful notes. Some of the commands listed can seem somewhat similar if
    you are just starting out. Recognize that memorizing all of these commands can
    take time, so slow down and work smart. Take notes to prevent yourself from feeling
    overwhelmed, as the human mind can only absorb a little bit of information at
    a time. To successfully learn something, you should break the information up into
    small chunks and not try to cram it in all at once.


    Alright, with our pencil and notepad ready and the computer on, let''s get started.
    We will be using Ubuntu in our examples. To get started, open up a terminal. As
    shown below, you will search for Terminal and then click on it.


    ![](Image00003.jpg)


    The Terminal application should look like this:

    ![](Image00004.jpg)


    Open up a terminal - you should see something like `username@machinename~$`.

    The dollar sign, `$`, is used to denote user mode. It differs from the pound sign
    or hashtag `#`, which is used to denote root user mode. Remember that you do not
    get access to the root user directly in Ubuntu; you have to type in `sudo`, which
    is the command to access the root directory, and then your command. We''ll talk
    about how to do that in another chapter. For now, let''s focus on some basic commands.


    ## The Command Line - Basic Commands


    | Command | Description |

    | :--- | :--- |

    | `pwd` | Print Working Directory |

    | `cd` | Change Directory |

    | `clear` | Clear the terminal |

    | `ls` | List Directory |

    | `file` | File characteristics |

    | `mv` | Move a file or directory |

    | `cp` | Copy a file |

    | `mkdir` | Make Directory |

    | `rm` | Remove a file |

    | `rmdir` | Remove an empty directory |

    | `touch` | Create an empty file |

    | `cat` | Concatenate a file (dump contents of result) |

    | `echo` | Echo the contents to the terminal |

    | `less` | Display the contents of a file |

    | `head` | Display the first 20 lines of a file |

    | `tail` | Display the last 20 lines of a file |

    '
