- fmt: "\n# System Management Command\n\nThe following commands are commonly used\
    \ by IT professionals for managing computer systems inside an organization.\n\n\
    ## df\nThe `df` command stands for \"display file\" or \"file system space\" and\
    \ allows you to display file system space that is being used and is available.\
    \ To use it, all you have to do is type `df` and the folder name. If you only\
    \ type `df`, an overview as shown below is given.![](Image00053.jpg)\n\n## du\n\
    The `du` command is the \"disk usage command,\" which allows you to see disk utilization\
    \ for files and commands. To use this command, type `du` followed by the directory.\
    \ This command may come in handy if you need to recycle data space used by a program,\
    \ although it may give you a rounded up estimate instead of actual, real-time\
    \ usage. A common way to type this is `du -ch` which gives a summary (the `-c`)\
    \ and human-readable output (the `-h`) which append the `K` for Kilobytes, `M`\
    \ for Megabytes, or `G` for Gigabytes.![](Image00054.jpg)\n\n## free\nUse the\
    \ `free` command to find out how much memory and system RAM is available. This\
    \ may come in handy if you need to know if a program is eating up system resources\
    \ or how much memory a program is using.![](Image00055.jpg)\n\n## w\nThe `w` command\
    \ shows information about users who are currently logged on to the system, including\
    \ what they are doing. This potentially comes in handy if you want to check employee\
    \ productivity or if you want to check which employee is running a task that puts\
    \ a heavy load on the system memory.\n\n## whoami\nThe `whoami` command quickly\
    \ shows you which username and account you are logged in as. This may prove helpful\
    \ if you are not sure what permissions your user account has and what commands\
    \ you have the authority to run. It could also help you if you are logging yourself\
    \ into different accounts with different permissions while testing features on\
    \ the system. To use this command, type `whoami` into the terminal and press Enter.\
    \ You should see a readout with your username.![](Image00056.jpg)\n\n## hostname\n\
    You can use the `hostname` command to find out the name of the host. You can also\
    \ use it to print out the IP address with the `-i` option. In the result below,\
    \ the ip address of `127.0.0.1` indicates a localhost meaning \"this computer\"\
    .![](Image00057.jpg)\n\n## uname\nThis will give you a printout of information\
    \ about the operating system and the machine it is installed on. Use the `-a`\
    \ option to see all the kernel information including build date kernel version\
    \ info.![](Image00058.jpg)\n\n## Typical User Management Commands\n\nThe root\
    \ user has administrative privileges, which means that the user with access to\
    \ the root account can do nearly anything in the system, even bypassing security\
    \ checks for normal users without the root privilege. While the root user always\
    \ has administrative privileges, other users can have admin privileges or just\
    \ standard privileges.\n\nHaving administrative privileges is a good thing if\
    \ used properly, but it can be harmful if used carelessly. Administrative/root\
    \ users can mess up the operating system or even harm others' accounts if they\
    \ are not aware of what they are doing. That's why having root privileges is such\
    \ as big deal in Linux.\n\nAdministrators, IT professionals, and anyone else who\
    \ happens to have access to the root account have to make sure they enter the\
    \ correct commands and know what they are doing to keep from accidentally deleting\
    \ sensitive data or rendering programs non-functional. In addition to this, those\
    \ with administrative privileges usually have the responsibility of looking after\
    \ user accounts, fixing bugs, handling password issues, and maintaining a decent\
    \ level of security. Luckily, Linux has commands that make keeping track of data\
    \ and users easier.\n\n## quota\nWithout a set data quota, users on a network\
    \ could hog all the resources for themselves. They could start downloading unnecessary\
    \ files and keeping bit and pieces of information, such as reports, instructional\
    \ videos, and projects on their accounts as if it were their home machine, while\
    \ not considering the needs of other users or the operating system.\n\nWith the\
    \ `quota` command, limits for the user can easily be monitored. This command displays\
    \ the user's disk usage and limits, and a user with administrator privileges can\
    \ use this command to view the quotas of other users. To use this command, type,\
    \ `quota -s` and the user ID of the user whose quota you want to check.\n\n###\
    \ Editing Quotas\nIf you want to change the quota of a user or group, you can\
    \ use the `edquota` command by typing `edquota -u` and a username or ID to edit\
    \ the quota of an individual user. To edit the quota of a whole group, type `edquota\
    \ -g` and the group name or group ID.\n\n## passwd\nAs mentioned previously, users\
    \ with administrative privileges can do a lot with Linux if they know how. The\
    \ following are a few more things you might have to do if your job grants you\
    \ root user privileges.\n\nLet's imagine that someone at work forgets his or her\
    \ password. If you are the IT person in charge, you should know how to properly\
    \ deal with that situation. Unless the company you are working for has an enhanced\
    \ security add-on system that doesn't grant true admin privileges, this problem\
    \ can be easily remedied by typing![](Image00059.jpg)\n\nThere may also be situations\
    \ in which the user will need to change his or her password but has not changed\
    \ it yet. In this case, you may want to execute a command that will force a user\
    \ to change his or her password (see the `chage` command below).\n\nThe `passwd`\
    \ command is used to change a user's password. This command can only be used by\
    \ someone with administrator access. An administrator can also use it with other\
    \ options to do a variety of other things, such as `-w` to warn a user before\
    \ their password expires, or the `-n` option to set the minimum number of days\
    \ a user must wait before changing his or her password.\n\n**Exercise:** Experiment\
    \ with the `passwd` command and its options. Log in as the target user to test\
    \ and write your findings in your notebook.\n\n## chage\nThe `chage` command can\
    \ be used in Linux to force a user to change a password by typing `chage -d 0\
    \ <username>`. Like the setting in the previous example, this command will also\
    \ force the user to change his or her password upon next login.\n\nIf you want\
    \ to make it so the user who refuses to change his or her password will be locked\
    \ out of his or her account, use the `-E` option with the `chage` command instead.\
    \ It should look something like `chage -E <date or days until expiration> <username>`.\
    \ This will lock the user out of his or her account until he or she has it reset\
    \ by an administrator or root user.\n\nThese features are important because they\
    \ can serve to automatically enforce policies your company may have about users\
    \ changing their passwords, so important information is not compromised.\n\n**Exercise:**\
    \ Use the `chage` command on a user you created, so the user will have to change\
    \ his or her password. Log in as the user to test this.\n\n## adduser\nThe `adduser`\
    \ command can be used to create and add new users. Type, `adduser` and the username\
    \ you want the new user to have to create a new user.\n\n### Adding a Normal User\n\
    To add a normal user, type `adduser` and the username you want the new user to\
    \ have. The user will automatically be assigned an ID number and granted all the\
    \ privileges a normal user on the system has.![](Image00060.jpg)\n\n### Adding\
    \ an Administrative User\nTo add an administrative user with higher privileges\
    \ like root access, follow the same process of adding a new normal user above.\
    \ The difference is that the admin user is added to a group with higher privileges.\
    \ For instance on Ubuntu, this is the `sudo` group.![](Image00061.jpg)\n\n###\
    \ Adding a System User\nSystem users are accounts created when certain programs\
    \ are installed and they perform certain jobs and run certain processes. They\
    \ typically don't belong to actual human users, but instead to programs that run\
    \ in the background. They have limited access to the system, enough so they can\
    \ perform their tasks with minimal human interference.\n\nAssigning these programs\
    \ group IDs and privileges controlled by the administrator is one way Linux keeps\
    \ the system safe from malicious software and unruly programs. Contrast this to\
    \ a Windows system, in which an installed program is typically given admin. \n\
    \nTo add a system user, type `adduser --system` and the username. System users\
    \ are accounts created when certain programs are installed and they perform certain\
    \ jobs and run certain processes. They typically don't belong to actual human\
