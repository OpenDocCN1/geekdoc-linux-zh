    现在，计算你的得分。如果需要，请保留到小数点后一位。你表现得如何？


    如果你正确回答了所有这些问题，太棒了！你现在可能已经掌握了 Linux 命令行的基础知识，并可能准备好应对更复杂、更高级的项目。如果你的得分低于 100%，请记录下你错的所有题目，并回到它们所在的章节进行复习。继续在命令行中练习，直到你对所有命令都感到熟悉为止。


    # 项目创意

    现在你已经对 Linux 文件系统及其结构有了通用的了解，并且知道如何使用它的基本命令和选项，你可能想通过尝试一些基础项目来进一步深化学习。


    ## 基础 - 入学者友好


    ### 继续学习 Bash

    你可能想继续学习 `Bash` 脚本语言，并尝试编写更复杂的命令。你甚至可以尝试编写一两个省力程序。这样的项目可能需要像 `alias` 和 `grep`这样的命令，并结合管道（piping）等技术。在熟悉了将基础命令组合之后，你可以开始使用条件检查和循环来真正增强你的脚本功能。


    让我们你想写一个程序来查找当前目录下的文本文件，并将结果限制在 2 个文件。

    ![](img/Image00084.jpg)


    在创建自动化消息（例如群发邮件）时，你可能可以使用这样的简单命令，而且你已经学的命令还可以完成许多其他事情。在互联网上搜索是了解你可以做哪些事情的好方法。输入类似“在
    `Bash` shell 中编写基础程序”的内容，并点击你感兴趣的链接、教程或视频。如果你有具体的项目，请根据你的特定需求定制搜索。


    多练习使用管道和 `grep`。将不同的命令组合在一起，或将你知道的命令应用于项目中，以扩展你的学习并了解它们是如何相互整合在一起的。


    ### 学习编程语言基础


    #### Python

    你可能会惊讶地发现，Linux 环境中的许多程序都是使用 `Python` 脚本语言创建的。许多 Linux 发行版都预装了 `Python`，而某些专门为编程爱好者和爱好者制作的
    Linux 发行版（如 `Raspbian`）甚至会将 `Python` 编程教程作为标准桌面程序。


    通过通过学习如何编写一个可以在你的 Linux 机器上运行的简单程序来提高你的编程知识。关于从哪里开始的建议可能包括在互联网上搜索“学习 `Python`”。你可能会在付费选项中发现许多免费教程，或者你可以通过
    Amazon 的 Kindle Unlimited 服务购买或借阅电子书。自信地应对下一个项目吧。


    #### C 和 C++

    为了使用其他 Linux 功能，你可能想学习一些 `C` 编程语言的基础。这样做将使你能够像之前提到的那样在 `csh` shell 中输入命令。你可能还会学习如何为
    Linux 编写程序和应用。


    ### 设置树莓派项目

    `Raspberry Pi` 是一种简单的微型电脑，小到可以握在手心中。不要被它的尺寸欺骗了；它仍然可以用于构建惊的项目。


    #### 简单的一体机

    你是否想过拥有一台“一体机”桌面电脑（即开箱自带显示器和所有硬件，不需要连接主机的电脑），但认为它们贵得惊人？好消息是！你现在可以通过设置 `Raspberry
    Pi` 微型电脑并将其连接到旧 LCD 显示器上，创建一个类似的东西。


    对于这个项目，你需要学会：

    * 组装一台基础电脑。

    * 将 Linux 下载到内存卡中。

    * 在终端中配置选项。


    这个项目相对容易完成——只需使用随你的 `Pi` 附带的构建包组装 `Raspberry Pi` 即可。如果你需要帮助，快速搜索互联网应该提供大量的教学视频。接下来，如果你的构建包里没有内存卡，请写入一个
    `Raspbian`。插入你写入了 `Raspbian` 操作系统的内存卡，然后接通电源并启动。


    使用 USB 扩展棒或接头将 `Pi` 连接到显示器并固定好。你现在拥有一台功能完备、“一体机”，没有可见的主机，并且具有无线连接能力。练习在上面浏览网页和安装新程序。如果你需要扩展存储空间，可以使用硬盘，它们应该可以通过标准的
    `USB` 端口连接。


    ## 中级


    ### 设置小型家庭服务器

    你不需要等到学会一种完整的编程语言就可以在 Linux 中做一些有意义的事情。如果你有一台闲置的小电脑并想重新利用它，你可以建立一个家庭服务器，以增加你自己网络的安全性。


    在我们开始之前，这里是你可能需要知道的一些命令：

    * `mkdir`

    * `sudo apt-get install`

    * `adduser`

    * `addgroup`

    * `hostname -i`

    * `chmod`


    #### 第一步：选择一台作为服务器的电脑

    此项目请使用小电脑，无论是旧的过时电脑还是 `Raspberry Pi` 微型电脑。你可以通过外部硬盘增加物理存储空间，不要认为你需要一台具有大量内存或处理能力的电脑来当服务器。


    #### 第二步：安装 Linux

    使用 `Debian` 的 USB 拷贝或专门为服务器使用配置的 Linux 版本。将程序的 USB 拷贝插入你想要重新利用作为服务器的电脑的 USB 端口，并按照提示进行安装。选择服务器版本，然后选择
    `LAMP` 软件包安装。

    '
- fmt: '

    LAMP stands for "Linux, Apache, MySQL, PHP." Having these packages pre-installed
    during set-up will allow you to skip a few steps in the configuring process. You
    may elect to give your project a desktop environment, or you may decide that you
    don''t need one and choose to keep it as only a command line. Go through the installation
    process and follow the prompts to set everything up.


    ### Step Three: Downloads

    Open your command line and type:

    ![](Image00085.jpg)


    Remember that `sudo` can be read to mean "super user do," and it may be a way
    of getting permission to perform administrative tasks that Linux would otherwise
    block you from doing. Try entering all of the commands separately rather than
    all at once.


    ### Step Four: Enter the IP Address

    Replace "ubuntu" with the name you want to use for your server, and enter your
    static IP address. If you don''t know it, use the `hostname` command with the
    `-i` option.


    That''s it--you''re now ready to turn this into a private server to store and
    remotely access home media files, such as pictures, music, videos, and more while
    keeping your data secure and free from the data-mining practices of cloud sharing
    sites. If you want, you can take a few additional steps and turn it into a web
    hosting server and have people pay you to host their websites. Before you do this,
    you may want to learn one more command, however.


    #### tasksel

    Explanation: This command stands for "task select" and is intended for those who
    want to use Ubuntu Linux for servers. If you know exactly what you want your server
    to do, you can just run the `tasksel` command to install the software you need
    to create a specific server. To use the `tasksel` command, type `sudo tasksel`.
    You may need this command once you set up your server.


    Now, go make that server!


    ### Advanced

    The Internet of Things, or `IoT`, is fascinating. You can connect drones, wireless
    "smart" cameras, and even create small robotic appliances that send messages to
    a server to let you know their status. You could use `IoT` technology for many
    things, including vending machines that can sense when their inventory is low
    and can signal you to order more, eliminating the need for you to check them by
    hand. A popular use for this technology is the smart camera.


    You can try making your own, small `IoT` project, like remotely connecting a `Linux`
    terminal to program a headless system to power a robot or remote-controlled camera.
    You might need to know `Python` and have a good idea of how to connect wirelessly
    to a `Linux` machine, as you probably don''t want your new machine to have to
    receive commands via a terminal you have to access through a screen on the machine
    itself. For this project, you might need to know how to:


    * Program in `Python`.

    * Understand basic robotics principles.

    * Connect to a `Linux` system headlessly and wirelessly.


    For more information on this, look up some drone and small robot builds. You may
    need special cables and some programming knowledge to get your creations to do
    what you want. Unfortunately, this book won''t be covering much about programming
    languages outside of what you may need to know for basic `Bash` scripting. If
    you believe you''re ready to tackle a larger project, don''t let any of this discourage
    you--there are plenty of free resources on the web about getting started with
    the exciting world of `AI`. You may even find communities that will help you with
    your builds and projects, even providing step-by-step tutorials. There are various
    places to post questions for community feedback too, so you should definitely
    try it out if this interests you.


    ### Suggestions for Further Reading

    It depends on what you want to know. After reading this book, you should now have
    a working knowledge of how to navigate the `Linux` terminal and enter simple commands.
    With the use of tutorials, you can create some pretty amazing builds.


    If you want to get into programming, you will need to have a good grasp of a programming
    language like `Python`, and you need to get more comfortable entering commands
    into the `Bash` shell.


    The exercises included in this book were very basic and not challenging at all,
    but the main focus was getting you used to the command line. To truly start programming
    in `Linux`, you need to then take the little bit that you''ve learned and expanded
    upon it. Look for resources and tutorials everywhere, and practice writing and
    executing small programs. Apply yourself like a dedicated student, and you will
    make amazing progress.


    Remember, you''ve gotten all the foundations. Now, all you need to know how to
    do is put the building blocks together to create more impressive programs. Start
    out slow, then work your way up. Build small projects until you get comfortable
    with larger ones.


    ### Closing Thoughts

    I hope you''ve enjoyed this book, appreciate `Linux` a little more, and find the
    `Linux` command line less intimidating. If this book has helped you, consider
    leaving a five-star rating on Amazon and Goodreads, and don''t forget to share
    this book with a friend who wants to learn `Linux` too.

    '
