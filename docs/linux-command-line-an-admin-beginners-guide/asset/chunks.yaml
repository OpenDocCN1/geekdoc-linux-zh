    \ write down the results in your notebook.#pingThe ping command lets you check\
    \ whether or not a remote host is responding. Just type in ping , followed by\
    \ the URL of the website you are trying to reach. For example, if you wanted to\
    \ ping Google, you would type, ping www.google.com.Exercises:ping a website of\
    \ your choice. Use the Ctrl+c keyboard shortcut to escape the loop, then record\
    \ your findings.Help CommandsmanIf you type in man in the terminal followed by\
    \ the command you want to be described, you'll get a list of uses for the command.\
    \ For example, if you typed man touch, you would get a list of uses for the touch\
    \ command. This comes in handy if you need to know what a command is in a pinch\
    \ and don't have time to look it up.Typing man for the manual page command will\
    \ give you a lot more information about the command you may want to use, including\
    \ syntax for executing successful versions of the command you want to use. You\
    \ will also get information on what the command does.Exercise:Look up the man\
    \ vim command by typing “man vim” at a command prompt. You should get something\
    \ like below:              ![](Image00049.jpg)And the Description follows the\
    \ above:![](Image00050.jpg)Further Explanation:man pages = manual pagesBack when\
    \ programming was just beginning, remembering a certain command syntax wasn't\
    \ as easy as hopping on the Internet and looking it up. Linux was created from\
    \ Unix and computers were around before the Internet was widely available. It\
    \ made more sense to build a list of command explanations into the system itself.Since\
    \ this system was invented before internet access and reliable search engines\
    \ were available, the man command provided the user with a convenient way to look\
    \ up information about different commands.Today, man pages are still useful, especially\
    \ if you are working in a terminal that has no GUI and is not connected to the\
    \ internet. No matter where you are, you can still get help finding the proper\
    \ commands and what they do.If you are unsure of how to use a certain command,\
    \ type man, then the command that you are having trouble with a space in the middle.\
    \ An explanation of the command and how it is to be used will show up on the screen.Type\
    \ clear if you want the terminal to stop displaying the man page text.#helpThe\
    \ help command functions like the man command and it can sometimes be used to\
    \ find options to use with commands. The help command can also remind you how\
    \ a command is supposed to be used. To use it, type the command and then -help.\
    \ For instance to see the help for cd, type cd -help![](Image00051.jpg)The Magic\
    \ of PipingLet's talk a little bit about piping, revisit grep, and go over the\
    \ various options that can be used with this helpful command.If you've ever browsed\
    \ a Linux help forum, you might have come across people talking about \"piping\"\
    \ certain programs. It's not a complicated process that only computer programmers\
    \ can master; in fact, piping isn't much more complicated than any other Linux\
    \ command.One important aspect of Linux command lines is the ability to \"pipe\"\
    \ commands. I personally consider this Linux's greatest strength.The Unix philosophy\
    \ is to have each program do one thing well.  Piping creates a small chain of\
    \ commands. The output from one command is used as input for the next . For example,\
    \ if you searched for all of the .doc files in a certain directory, then directed\
    \ Linux to grep those files to find the desired string, that would be an example\
    \ of piping.Piping can be described as the process of redirecting standard output\
    \ to another command, program, or process to be worked on further. Let's say you\
    \ want documents sorted, but you only want to sort the ones that have \"cheese\"\
    \ in the title. You may consider using a pipe command to help you give those instructions\
    \ to the terminal.Let's make a simple piping command.Find the \"| \" key on your\
    \ keyboard--it is usually Shift+\\ . This is the symbol you will use to create\
    \ a piping command. Open up your terminal and type the following: ls | grep txt.\
    \ Write your findings in your notebook.![](Image00052.jpg)Exercise:Create your\
    \ own pipe and enter the command in the terminal. Write down your findings in\
    \ your notebook.Chapter Summary\n\n*   In this chapter, we covered more advanced\
    \ Linux commands, including searching using the locate, which, and find commands.\
    \ We also learned about the grep command; how to find the word count, line count,\
    \ number of bytes; and how to use wildcards.\n\n*   We also covered other useful\
    \ commands, such as zipping files, history, tree, alias, curl, diff, cmp, and\
    \ pinging.\n\n*   We also covered some helpful commands, including man and the\
    \ help commands.\n\nCHAPTER SEVEN: Linux System and User ManagementImportant System\
    \ Management Commands\n\n| Command | Description |\n\n| df | Display filesystem\
    \ space |\n\n| du | Disk usage |\n\n| free | Free memory usage display |\n\n|\
    \ w | Which users are logged in? |\n\n| whoami | Whoami logged in as? |\n\n| hostname\
    \ | List the hostname of the machine |\n\n| uname | Print kernel information |\n\
    \n| quota | Quotas and limits of users |\n\n| passwd | Set/change a users password\
    \ |\n\n| chage | Force user to change password |\n\n| adduser | Add new user |\n\
    \n| usermod | Modify a user |\n\n| addgroup | Add a new group |\n\n| userdel |\
    \ Delete user |\n\n| delgroup | Delete a group |"
