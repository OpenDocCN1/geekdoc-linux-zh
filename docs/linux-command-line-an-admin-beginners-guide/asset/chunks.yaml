- fmt: "\n* Managing users and passwords.\n* Setting data quotas for users and administrators.\n\
    \n# CHAPTER EIGHT: Understanding Linux Security\n\nLinux is different, not just\
    \ in how it is built, but also the way that it's maintained. Unlike Windows, which\
    \ may need an update every week to remain stable, Linux operating systems are\
    \ built to be stable and run with minimal patching and interference. There's also\
    \ a dedicated community of volunteers, many of which are computer programmers,\
    \ who are constantly checking the software to make sure it's running properly.\
    \ Linux systems also have built-in features that make it secure, which makes it\
    \ incredibly difficult to hack into. With Linux systems, you would have very little\
    \ use for virus protection.\n\nHowever, have you ever wondered why Linux is so\
    \ secure? Like some other more secure operating systems, like Chrome OS, Linux\
    \ has a closed file system and doesn't allow content from unauthorized sources\
    \ or users. The concept is about the same as apps in the Apple or Chrome store—if\
    \ you've ever used one of these systems, you've probably noticed that you can't\
    \ just download any file from the internet and automatically use it one your computer,\
    \ even if it's the proper format.\n\nThis is because Apple and Chrome OS not only\
    \ check for the proper format, but they also have other security measures in place\
    \ to make sure you don't accidentally download files that could potentially harm\
    \ your computer. This is intended to keep your computer safe from viruses, malware,\
    \ and spyware; the downside is that it can also make your software choices a bit\
    \ more limited. You may have to find alternative apps that will run on your OS\
    \ instead of downloading familiar software to do the same job; for example, on\
    \ a Chrome OS, you'll have much less trouble running Google Docs than Microsoft\
    \ Office. Fortunately, the Linux repository has lots of alternative software programs\
    \ to choose from, and if you know what you want to do, you shouldn't have a lot\
    \ of trouble choosing an alternative. Most popular software has other versions\
    \ that are available to Linux users.\n\n## The Underpinning of Linux Security\n\
    \n### Administrator/Root User\nLinux users typically fall into two categories\
    \ in regards to permissions - admin users and normal users. Admin users are commonly\
    \ the most powerful users on the Linux system, having `root` access to every part\
    \ of the operating system and being able to execute commands that could damage\
    \ the operating system if not used properly.\n\nAdmin/`root` users can pretty\
    \ much do anything they want on the computer, including viewing and changing other\
    \ user accounts. The `root` user can access anyone's home directory and data,\
    \ and they are usually an administrator, as they need to be able to create, delete,\
    \ and manage all users on the system.\n\n### Normal Users\nUser accounts are the\
    \ accounts that belong to people who are authorized to use the machine but may\
    \ not have all the access an administrator has. A typical person can have access\
    \ to a Linux machine as a user and not have full administrator privileges. The\
    \ user can perform the tasks he or she is authorized to do while minimizing the\
    \ chances that they will mess up the operating system.\n\n**Exercise:** Explain\
    \ how a root user is different from other users. Write your answers in your notebook\
    \ before going on to the next section. \n\n### sudo\nIn Ubuntu, users may need\
    \ to use a special command called `sudo` to gain `root` user access to certain\
    \ files or privileges, such as downloading files or making major changes to the\
    \ operating system. As explained earlier in this book, `sudo` is short for \"\
    super user do.\"\n\nIn Ubuntu Linux, users are not in `root` user mode. For example,\
    \ you may not be able to read or change some of the files in the `root` directory.\
    \ The extra step of typing `sudo` in front of the command is one extra safeguard\
    \ against accidentally damaging or deleting something important. If you run into\
    \ anything like this, you can try to use the `sudo` command to get access and\
    \ run programs as the `root` user or administrator. Without typing `sudo`, you\
    \ may not have the necessary permissions to run programs that only have administrator\
    \ privileges and you may not be able to download files. See the example below\
    \ to see how `adduser` on Ubuntu needs a `sudo` prefix.\n\n![](Image00066.jpg)\n\
    \n### apt-get\nExplanation: Repositories are places on the internet that house\
    \ Linux programs. You don't need to use a USB stick or memory card or type in\
    \ a special code to install the software. Instead, it's a lot like visiting the\
    \ app store on a Chromebook or Kindle, except done at the command line. All you\
    \ need to do is type in:\n\n```\nsudo apt-get install <software_name>\n```\nWhere\
    \ `<software_name>` is the name of the program you want to download.\n\nTo remove\
    \ the software, just type in:\n```\nsudo apt-get remove <software_name>\n```\n\
    Where `<software_name>` is the name of the program you want to remove.\n\nTo update,\
    \ type in:\n```\nsudo apt-get upgrade\n```\nand the name of the program you want\
    \ to update.\n\nHere is a quick list of repo commands. Use your favorite search\
    \ engine such as duckduckgo to discover all the variations available.\n\n* `apt-get\
    \ update` will update the list of repos.\n* `apt-get upgrade` will update the\
    \ program or all the installed programs if a single program is not specified.\n\
    * `apt-cache search` will search for a program in the repo.\n* `apt-get install`\
    \ will install the program.\n"
