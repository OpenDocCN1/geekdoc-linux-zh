    \n## 本书的组织结构\n已经理解某些概念，则不需要从头到尾阅读本书。以下是章节简要列表及其内容：\n\n### Linux 概述\n本章提供了 Linux\
    \ 操作系统的概要概述、它是如何发明的、开源软件对你（用户）意味着什么，以及各种 Linux 类型及其区别。\n\n### Linux Shell\nShell\
    \ 提供了一种通过图形用户界面（GUI）或命令行界面（CLI）与机器通信的方式。如果不熟悉这些术语或想快速复习，请阅读本章。\n\n### 基础文件目录\n\
    本章涵盖了 Linux 中找到的基础文件，如 `bin` 和 `root`，以及它们的作用。\n\n### Linux 命令行——基础\n如果你认为自己准备好学习\
    \ Linux 而不需要基础信息，可以跳过其他章节从这里开始。本章涵盖了一些 Linux 命令，包括 `cd` 和 `pwd`。本章还涵盖了允许你的命令正确运行语法。\n\
    \n### Linux 命令行——进阶命令\n本章包含了更高级的命令，例如 `ping`、`tar` 和 `locate`。\n\n### Linux 系统与用户管理\n\
    学习 Linux 如何通过授予适当权限来管理并保护重要文件。\n\n### 理解 Linux 安全\n尽管 Linux 是开源的，它是可用最安全的操作系统之一。了解以及如何保持安全。\n\
    \n### 持续学习建议\n一旦你掌握了基础，可能想要一些关于下一步学习的建议。本章将提供如何继续学习 Linux 的想法。\n\n# 第二章：Linux\
    \ 概述\n### 什么是 Linux？\nLinux 是操作系统或 OS。Wikipedia（https://en.wikipedia.org/wiki/Operating_system）定义如下：操作系统（OS）是管理计算机硬件、软件资源并为计算机程序提供服务的软件。\n\
    \n将操作系统想象成一个身体，Linux 内核就是大脑。大脑需要需要使用手臂、腿部、手指、脚趾（计算机硬件）。大脑规划何时吃午餐和其他活动（软件资源）。将软件资源想象为起床、刷牙和上班等动作。大脑提供了生活所需的常用功能，如呼吸、决策等。Linux\
    \ 内核需要执行这些常用服务，如增加时钟。\n\n计算机硬件可以被视为鼠标、键盘和显示器。操作系统管理来自键盘和鼠标的输入并在屏幕上显示输出。Word 等软件资源只是发送操作系统想要显示的内容。操作系统还为每个运行程序留出时间，否则只能运行一个程序。你能想象只能查看互联网，然后关闭它来打开日历应用吗？\n\
    \n### 为什么使用 Linux？\n你可能已经注意到 Linux 操作系统（或 Linux OS）在服务器工作和其他后端功能中的流行。它以可靠和运行时间长闻名，这意味着它不会经常崩溃或需要重启。一个典型的网站可能运行在持续运行数月而不重启的\
    \ Linux 操作系统上。\n\nLinux 是可用最安全、稳健且易用的免费开源操作系统之一。在功能方面，Linux OS 可以轻松与微软和苹果的产品竞争，这对于由志愿者免费维护来说非常令人印象深刻。\n\
    \n### 什么是开源？\n开源意味着任何人都可以下载并查看运行 Linux 的计算机代码，并构建自己的版本。由于 Linux 是开源的，因此有一个整个志愿者生态系统不断修复\
    \ Linux 并向其添加功能。Linux 有付费版本提供付费的技术支持。许多公司使用这些版本来保持服务器顺利运行。操作系统也有家庭应用程序。然而，Linux\
    \ 与 Windows 和 Apple 相比的一个缺点是，Excel 等流行工具在 Linux 上不支持，尽管有 LibreOffice 或 Google\
    \ Docs 等良好的替代方案。\n\n书中的某些章节包含大量密集信息。强烈建议你在阅读这些章节时手拿纸笔，并可以使用计算机来练习并熟悉命令。本书的目的是帮助你熟悉\
    \ Linux 命令行，让你能够更有心地使用 Linux 最强大的功能。它不是一本随意的读物，而是关于 Linux 命令行基础的入门教程。\n\n# 第三章：Linux\
    \ Shell\n...（剩余文本遵循相同模式）\n...\n对于家庭使用或编程练习，使用 Ubuntu 可能是最好的。它非常稳定，并且带有许多功能，包括一个功能完整的桌面环境和包管理器，这让操作变得简单。由于它的熟悉性，它可能不是一个坏尝试的发行版。它也是一个广泛使用的\
    \ Linux 版本，拥有大量支持。如果你遇到问题，很多运行 Linux 的人可能已经回答了该问题。\n\n如果你在操作 Linux 系统，记住这些点是很重要的。与其说是商业工业批量生产的产品，不如\
    \ Linux 操作系统的某些发行版更像是精心制作的手制产品。你可能需要一些调整才能让它们以你的方式工作，而且你可能会错误地选择了一个并不是为了你要求的版本。\n\
    \n"
