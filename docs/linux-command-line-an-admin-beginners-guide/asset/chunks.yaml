    ## Searching


    ### Wildcards

    In Linux, "wildcards" are symbols that can substitute for other information when
    performing a search. Three wildcard symbols are used quite frequently in Linux,
    each with their own unique functions: the star wildcard `*` or asterisk symbol;
    the question mark wildcard `?`; and the square bracket wildcard `[ ]`.


    | Symbol | Description |

    | :--- | :--- |

    | `*` | Match one or more preceding terms |

    | `.` | Match one instance of any character except newline |

    | `?` | Match zero or one of the preceding character |

    | `[ ]` | Match a character in the set |

