    # 第八章：理解 Linux 安全


    Linux 的不同之处不仅在于其构建方式，还在于其维护方式。Windows 可能需要每周更新一次以保持稳定，而 Linux 操作系统的设计目标是保持稳定，并在极少需要补丁和干扰的情况下运行。Linux
    一个由志愿者组成的专门社区，其中许多人是计算机程序员，他们不断检查软件以确保其运行正常。Linux 系统还内置了使其安全的特性，这使其极难被破解。在 Linux
    系统上，你几乎不需要使用病毒防护软件。


    然而，你是否想过为什么 Linux 如此安全？就像其他一些更安全的操作系统（如 Chrome OS）一样，Linux 拥有封闭的文件系统，并且不允许来自未经授权的源或用户的内容。这一概念与
    Apple 或 Chrome 商店中的应用相似——如果你用过这些系统中的任何一个，可能会注意到你不能直接从互联网下载任何文件并自动在你的计算机上使用它，即使它的格式是正确的。


    这是因为 Apple 和 Chrome OS 不仅检查格式是否正确，还采取了其他安全措施，确保你不会意外下载可能损坏你计算机的文件。此举旨在保护你的计算机免病毒、恶意软件和间谍软件的侵害；缺点是它可能会限制你的软件选择。你可能需要寻找可以在操作系统上运行的替代应用，而不是下载熟悉的软件来完成相同的工作；例如，在
    Chrome OS 上，运行 Google Docs 比运行 Microsoft Office 麻烦要少得多。幸运的是，Linux 仓库有许多替代软件程序供选择，如果你知道你想做什么，选择替代方案应该不会有太大困难。大多数流行软件都有适用于
    Linux 用户的版本。


    ## Linux 安全的基础


    ### 管理员/Root 用户

    在权限方面，Linux 用户通常分为两类：管理员用户和普通用户。管理员通常是 Linux 系统上最强大的用户，拥有对操作系统每个部分的 `root` 权限，并能够执行如果使用不当可能会损坏操作系统的命令。


    管理员/`root` 用户几乎可以在计算机上做任何事情，包括查看和更改其他用户账户。`root` 用户可以访问任何人的家目录和数据，他们通常是管理员，因为他们需要创建、删除和管理系统上的所有用户。


    ### 普通用户

    用户账户属于授权使用机器的人，但他们可能没有管理员拥的所有访问权限。普通人可以用户身份访问 Linux 机器，而没有完全的管理员权限。用户可以执行其授权的任务，同时最大限度地减少搞乱操作系统的机会。


    **练习：** 解释 root 用户与其他用户的区别。在进入下一节之前，请将答案写在笔记本上。


    ### sudo

    在 Ubuntu 中，用户可能需要使用名为 `sudo` 的特殊命令来获取某些文件或权限的 `root` 用户访问，例如下载文件或对操作系统进行重大更改。正如书中提到的，`sudo`
    是“super user do”（超级用户执行）的缩写。


    在 Ubuntu Linux 中，用户并不处于 `root` 用户模式。例如，你可能无法读取或更改 `root` 目录中的某些文件。在命令前输入 `sudo`
    这个额外步骤是防止意外损坏或删除重要内容的一种额外保护。如果你遇到此类问题，可以尝试使用 `sudo` 命令来获取访问并以 `root` 用户或管理员身份运行程序。如果不输入
    `sudo`，你可能没有足够的权限运行仅限管理员权限的程序，并且可能无法下载文件。见下例所示 Ubuntu 上的 `adduser` 如何需要 `sudo`
    前缀。


    ![](img/Image0066.jpg)


    ### apt-get

    解释：仓库是互联网上存放 Linux 程序的地方。你不需要使用 USB 闪输或内存卡输入特殊代码来安装软件。相反，它非常像访问 Chromebook 或 Kindle
    上的商店，只不过是在命令行完成的。你只需要输入：


    ```

    sudo apt-get install <software_name>

    ```

    其中 `<software_name>` 是你想下载的程序名称。


    要删除软件，只需输入：

    ```

    sudo apt-get remove <software_name>

    ```

    其中 `<software_name>` 是你想删除的程序名称。


    要更新，输入：

    ```

    sudo apt-get upgrade

    ```

    以及你想更新的程序名称。


    这里是仓库命令的快速列表。使用你喜欢的搜索引擎（如 duckduckgo）来发现所有可用变体。


    * `apt-get update` 更新仓库列表。

    * `apt-get upgrade` 更新程序，或在未指定单个程序时更新所有已安装程序。

    * `apt-cache search` 在仓库中搜索程序。

    * `apt-get install` 安装程序。


