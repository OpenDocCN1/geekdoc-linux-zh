    # Command Options

    Sometimes you can add options to commands to make them do different things. For
    example, you could add `-b` to your `file` command to display a brief version.
    This may come in handy if all you want to know is the file type in brief mode.
    When combining this command with options, use the syntax: `file [option] [filename]`.
    For a complete list of options, see the `man` command, or manual pages by typing
    `man` after the command (ie `file man`) into the terminal. You may also be able
    to use the `--help` option such as `ls --help`.


    # Basic Navigation

    The following commands are used to move around in the filesystem.


    ## pwd

    `pwd` stands for "print working directory," and when this command is used, it
    will print the full path of your present working directory on the screen. To use
    this, just type `pwd` and press Enter . You should get something like, `/users/files/namedfolder`.


    Example:![](Image00005.jpg)

    In the example above, the present working directory is `/home/linux12` because
    we''re logged in as the user `linux12`. We could have guessed this from the `~`
    in the bracket path. We can also see that we''re in user mode because of the `$`
    at the prompt.


    Explanation:

    Linux systems may require you to enter very specific commands to receive the results
    you want. The folder you are working in matters when determining whether or not
    these commands are successful. A program isn''t going to assume you have access
    to anything other than your current folder. But sometimes you may not be sure
    where you are and the `pwd` command lets you know where you are. In this case,
    we''re in one of the bedrooms of the Linux house.


    ## cd

    This command stands for "change directory." To change to a lower level directory
    than the one you''re already working in, type `cd`, press the Spacebar and then
    type the name of the directory to move to. Let''s say we''re trying to access
    a folder called `"my_test"` in the current directory. We would type `cd my_test`,
    and then we would press Enter .

    Doing so is a request to find `"my_test"` in the current folder. Those not familiar
    with navigating files and folders in Linux may think that relative commands do
    not work and the only reliable way to access files and folders is by typing in
    the absolute path, such as `cd misc/var/web`. While Linux does recognize relative
    commands, there is a slightly different syntax.


    Example![](Image00006.jpg)

    Explanation:

    A lot is going on in the example above. We move into the `my_test` directory and
    print the working directory to make sure we are where we think we are. The `".."`
    means the parent directory so the `cd ..` takes us back to the home directory
    where we came from. We then change into the root directory and confirm our location.
    The `-` is used to take us back to the last directory we were in so the `cd -`
    takes us back to the home directory.

    A lot of tutorials on the internet about using the Linux command line may make
    the process appear more complicated than it really is. A person new to using the
    command line and unfamiliar with using relative commands may make the mistake
    of typing out the full path every time he or she tries to execute a command. You
    don''t have to do this. Remember that Linux uses a different kind of syntax than
    Windows. For example, typing `/` before the folder name is like asking it to find
    a folder in root. If the folder is not in root, you may receive an error message.
    Likewise, if you try to find a folder in `~`, or home, and the folder is not in
    that directory, you may also receive an error message.

    Use the `pwd` and the `cd` commands to move around and understand the filesystem
    structure.


    Example:

    Let''s go from your home, or `~`, folder to your Desktop folder on the command
    line. Just type `cd Desktop` into the command line and press Enter . You should
    now see something like this:![](Image00007.jpg)

    To go back, type `cd $HOME`, or `cd ~` (`$HOME` and `~` represent the same home
    directory in this context). Both of these will take you back to your home folder.
    You should now see something like below:![](Image00008.jpg)

    Do you notice how the directory is different from when you were in your Desktop
    folder?


    Exercise:

    Open the command line on your Linux device or virtual machine and type, `ls`.
    This should bring up a list of files and folders on your device. Next, use the
    "change directory" command. Type, `cd`, press the Spacebar , then type and the
    name of a folder you would like access to. For this exercise, let''s use, `etc`.
    To ensure you''ve gone to the correct directory, use the `pwd` command, which
    will be explained below.


    # Files Types & Organization

    When using the command line, you may want to check the specifics of a file. Is
    it a file or a directory? Is it a text file or an executable?


    ## clear

    When you are typing commands into the terminal, it can often become quite cluttered,
    especially if you''ve recently downloaded new software using the command line.
    When the screen gets cluttered, it can make it harder to focus on your next command.
    The cluttered commands can also get in the way of commands you want to implement
    later. Although using `Escape`, `Delete`, and `Backspace` will not work to remove
    your old commands, you don''t necessarily have to close the terminal and open
    a new one if all you want is to clear the screen.

    Just type, `clear` into the terminal after the `$`. The screen should clear itself,
    and you should be able to resume typing commands onto the screen.


    ## ls

    You can use the `ls`, or `"list"` command, to display files in the current working
    directory. Remember that the current working directory is the directory on your
    current command line that you are working with. As you move into a new directory,
    that becomes your current working directory.

    Type `ls` to have a list of files generated. The `ls` by itself command lists
    all the files in the current directory. However, if you put a path after the `ls`,
    you can list the files in any directory.

    Type `ls /` to see the files in the root directory or `ls /etc/systemd` to see
    the files in the `/etc/systemd` directory


    Example:![](Image00009.jpg)


    ### Helpful Options

    The output of the `ls` command isn''t very helpful. 3 values are printed out on
    the same line. There are 2 of these values in bold (`Desktop` and `my_test`) to
    signify a directory. Many options can be used to tailor the `ls` command to your
    needs. We will only cover a few of the most used options but you can see the entire
    list by typing `ls --help` (there are a lot of options so I won''t capture them
    here).

    - `-l` : long listing format (this is a lower-case l and not a #1)

    - `-a` : list all the files including hidden files (preceded with a `.`)

    - `-s` : Sort by size

    A better way to display the current directory is with `ls -l` because it gives
    much more useful information.


    Example:![](Image00010.jpg)

    Explanation

    See how this is much easier to read with each file on a different line? Notice
    the `"d"` in the left-hand column of `Desktop` and `my_test` is used to indicate
    a directory. Also note the modification timestamp of the file - which was February
    2 at around 6pm.

    We will discuss the `rwx` fields at a later time.

    To see the hidden files in a directory, type `ls -al` to show everything in the
    directory in long format.


    Example:![](Image00011.jpg)

    Explanation

    Notice the files with the `"."` preceding the name. This indicates a hidden file.
    At the end of the Linux Basic File Directory chapter, we discussed the `.` which
    indicates the current directory and the `..` which indicates the parent directory
    and are shown at the top of the dump. They both have a `d` indicating they are
    directories.


    ## file

    Use this command to have your computer tell you a file''s type. All you have to
    do is enter the file followed by the name of the file of which you want to know
    the type. The `file` command can be helpful when you aren''t sure how to handle
    a specific file. Let''s say you''ve saved several different kinds of files under
    the same name (`my_name.png`, `my_name.txt`, and `my_name.pdf`), or you need to
    help rewrite a specific file on the system, but you aren''t sure what kind of
    file it is. You can use the `file` command to help you figure that out.

    For example, if I wanted to know what type of file `"file textfile.txt"` was or
    even what the `cd` command was, I would need to type the following into the terminal.


    Example:![](Image00012.jpg)

    Explanation:

    The `file` command tells us the `textfile.txt` file has ASCII text which is just
    text like you are reading. However, the `cd` command used to change directories
    is a shell script made from ASCII text which is executable. As discussed in the
    Linux Basic File Directory chapter, the `/bin` directory is the kitchen and holds
    the common Linux command line programs we''ll be running.

    You can also use this command to find all of the files in your current working
    directory by typing `file *`. The asterisk, `*`, signals to the machine that you
    want it to show you the file characteristics of everything that Linux considers
    a file in the current directory.


    # Manipulating Files in Linux

    These commands are used to manipulate files including create a directory, move,
    copy, and delete.


    ## mv

    If you type `mv` into the terminal, you are telling Linux to move a file. To use
    this command, type `mv` and the name of the file you want to move, then type the
    name of the location where you want to move that. Once you''ve done all that,
    hit Enter . The `mv` command is also used to rename a file - think of this as
    moving the file to a new name.

    Example:

    Let''s say you want to move a file called `"photos.png"` to my Desktop directory.
    All you would need to do is type the following into the terminal:

    ![](Image00013.jpg)

    If you do everything correctly, the file `"photos.png"` would appear in my Desktop
    directory. The Desktop directory is under the home directory because `~` refers
    to the home directory.

    To rename the file, you can go to the `"Desktop"` directory and type the new filename,
    `mv photos.png photos`. It should now appear in your Desktop folder as a `photos`
    file. Notice that it''t have the `.png` at the end so we would need to use the
    file `photos` to figure out that it was a.![](Image00014.jpg)


    ## cp

    When you type `cp` into the terminal, it stands for "copy file." In a sense, this
    command is used similarly to the `mv` command. To make a copy of a file with a
    new filename in the same directory, you would simply need to type `cp` and the
    name of the current file, then the name of the new file you want to copy to. When
    copying directories, you may receive a message saying you need to put `-r` after
    `cp` to copy the files or directories. The `-r` is for recursive and indicates
    you want to copy the directory and all the contents the directory.

    Example:

    First, we’ll figure out where we are. Use the `pwd` to find out where we are.![](Image00015.jpg)

    This shows the current directory. Now, let’s copy `photos.png` file from `Desktop/photos`
    to the current directory and rename it `photos.png![](Image00016.jpg)

    But what about copying a complete directory? Can we just copy a directory the
    same way?!![](Image00017.jpg)

    Nope. That failed because the directory has files in it. If the directory were
    empty, the copy would succeed. To copy the directory and all the files inside
    it, we need to use the `-r` option which does a recursive copy![](Image00018.jpg)


    # mkdir

    The abbreviation `mkdir` stands for "make directory." Think of it kind of the
    "create new folder" option in Windows. Entering this command in Linux will make
    a new directory where you specify. For example, if you type `mkdir apples` on
    the command line, it will create a new directory labeled `"apples"` in the directory
    where you are working. You can also create a new directory and put it in a specific
    directory by specifying a path. For example, let''s say you want to create a new
    folder called `"photos"` on your Desktop. At the command line, you would type
    `mkdir ~/Desktop/photos`, and a folder called `"photos"` would appear on your
    desktop.

    Example:![](Image00019.jpg)

    We look at the directory and then we created a new directory in the directory.
    We confirmed the new directory with the `ls` command. Now let’s try moving a file
    into the new directory![](Image0020.jpg)


    # rm

    If you want to remove a file, type `rm` and the name of the file you want to remove.
    Make sure the file you want to remove is in the directory you are working in,
    or it may return an error.![](Image0021.jpg)

    We’ve now made a copy of a file that we can now delete (Wait, I meant delete).
    Let''s delete it.![](Image0022.jpg)


    ## Removing a Directory

    If you want to delete a directory that has items in it, you may have to add `-r`
    after the `rm` command to indicate the remove is recursive. When you do this,
    it will look like `rm -r dir` instead of just `rm dir`.![](Image0023.jpg)

    We created a new directory named `Desktop`. Why? So that we can delete it, course.![](Image0024.jpg)

    But this acts the same as the `rm` command. The directory can’t be deleted if
    it still has files in it. Remember how we deleted the entire directory and files
    last time? Yes, we need to use the `-r` command to delete the files inside the
    directory as well![](Image0025.jpg)


    # rmdir

    `rmdir` stands for "remove directory," and it looks like `rmdir` on the line.
    When you type `rmdir` and the name of the directory you want to remove, the directory
    should disappear. The directory has to be empty, however. This will not work on
    a directory that has something in it.


    ## Removing a Directory

    If you want to delete a directory that has items in it, you may have to add `-r`
    after the `rm` command to indicate the remove is recursive. When you do this,
    it will look like `rm -r dir` instead of just `rm dir![](Image00026.jpg)

    We created a new directory named `Desktop`. Why? So that we can delete it, course.![](Image0027.jpg)

    But this acts the same as the `rm` command. The directory can’t be deleted if
    it still has files in it. Remember how we deleted the entire directory and files
    last time? Yes, we![](Image0028.jpg)


