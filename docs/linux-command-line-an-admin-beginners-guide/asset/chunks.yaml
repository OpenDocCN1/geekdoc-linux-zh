    # which


    Linux 的 `which` 命令可以通过提供文件的绝对路径来帮助你定位重要程序的安装位置。要使用此命令，请输入 `which`，然后跟上你想查找的程序名称。例如，如果你正在寻找互联网浏览器
    "Firefox" 可执行文件存储的路径和目录，你可以在终端输入 `which firefox` 并按回车键![](img/Image00048.jpg)


    目录及其路径应该打印在屏幕上，看起来像 `/usr/bin/firefox`。我们也可以通过输入 `which` 后跟上你想定位的每个文件名（中间用空格分隔）来查找多个文件。例如，输入
    `which firefox gimp` 将为你提供 Firefox 互联网浏览器和 Gimp 图像编辑程序的路径和目录。


    练习：使用 `which` 命令定位你在之前的练习中创建的文件，然后将结果记录在笔记本中。


    # ping


    `ping` 命令允许你检查远程主机是否有响应。只需输入 `ping`，然后跟上你尝试访问的网站 URL。例如，如果你想 ping Google，可以输入
    `ping www.google.com`。


    练习：`ping` 一个你选择的网站。使用键盘快捷键 `Ctrl+c` 退出循环，然后记录你的发现。


    # Help Commands


    如果你在终端中输入 `man` 后跟上你想获取描述的命令，你将获得该命令的用途列表。例如，如果你输入 `man touch`，你将获得 `touch` 命令的用途列表。当你急需知道某个命令的作用而没有时间去查找时，这会非常有用。


    输入 `man` 命令（手册页命令）将为你提供关于你可能想要使用的命令的更多信息，包括执行你想要使用的命令成功版本的语法。你还将获得关于该命令作用的信息。


    练习：在命令提示符处输入 `man vim` 来查找 `man vim` 命令。你应该得到类似下面的内容![](img/Image00049.jpg)


    描述随其后：![](img/Image00050.jpg)


    ### 进一步解释：`man` pages = manual pages（手册页）


    在编程刚开始的时候，记住某些命令语法并不像跳到网上查找那么简单。Linux 是从 Unix 创建的，在互联网普及之前计算机就已经存在。在系统本身中构建一个命令说明列表更有意义。


    由于这个系统是在互联网访问和可靠的搜索引擎出现之前发明的，`man` 命令为用户提供了一种查找不同命令信息的方便方法。今天，`man` 页面仍然有用，特别是当你工作在一个没有
    GUI 且未连接互联网的终端中时。无论你在哪里，你都可以获得找到正确命令及其作用的帮助。


    如果你不确定如何使用某个命令，输入 `man`，然后输入你遇到困难的命令（中间留有空格）。命令的解释及其使用方法将显示在屏幕上。如果你想让终端停止显示手册页文本，输入
    `clear`。


    # help


    `help` 命令的功能类似于 `man` 命令，有时可以用于查找与命令使用的选项。`help` 命令还可以提醒你命令应该如何使用。要使用它，输入命令然后加上
    `-help`。例如，要查看 `cd` 的帮助信息，输入 `cd -help`](Image00051.jpg)


    ## 管道的魔法


    让我们简单聊聊管道（piping），复习 `grep` 并介绍可以使用这个非常有用的命令的各种选项。


    如果你曾经浏览过 Linux 帮助论坛，你可能会遇到人们讨论“管道化”某些程序。这不是一个只有计算机程序员才能掌握的复杂过程；事实上，管道并不比任何其他 Linux
    命令复杂多少。Linux 命令行的一个重要方面是“管道”命令的能力。我个人认为这是 Linux 最大的优势。


    Unix 哲学是让每个程序只做好一件事。管道创建了一个小型命令链。上一个命令的输出被用下一个命令的输入。例如，如果你搜索某个目录中所有的 `.doc` 文件，然后引导
    Linux 使用 `grep` 这些文件以找到所需的字符串，那就是管道的一个示例。


    管道可以描述为将标准输出重定向到另一个命令、程序或进程以进行进一步处理的过程。假设你想对文档进行排序，但只想对标题中包含“cheese”的文件进行排序。你可能考虑使用管道命令来帮助你执行这些指令。让我们创建一个简单的管道命令。在键盘上找到
    `|` 键——它通常是 `Shift+\`。这是你将用于创建管道的符号。打开终端并输入以下内容：


    ```

    ls | grep txt

    ```

    在笔记本中记录你的发现![](img/Image00052.jpg)


    练习：创建你自己的管道并在终端中输入命令。写下你的发现。章节总结


    *   在这一章中，我们涵盖了更高级的 Linux 命令，包括使用 `locate`、`which` 和 `find` 命令进行搜索。我们还学习了 `grep`
    命令；如何查找字数、行数、字节数；以及如何使用通配符。

    *   我们还涵盖了其他实用的命令，如压缩文件、`history`、`tree`、`alias`、`curl`、`diff`、`cmp` 和 `ping`。

    *   我们还涵盖了一些辅助命令，包括 `man` 和 help 命令。


