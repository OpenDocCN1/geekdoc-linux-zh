    # 星号通配符

    `star wildcard`（即星号符号 *）用于在搜索信息时匹配任意字符的一个或多个实例。例如，如果你在终端中输入 `find . -name "my_test*"`
    并按回车，搜索结果将列出当前工作目录下所有以 `my_test` 开头的文件。


    ## 问号通配符 `?`

    问号通配符或 `?`，用于匹配搜索中的单个字符。例如，如果你想搜索每个长度恰好为五个字符的文件，你可以输入 `find . -name "?????"` 并按回车。注意
    `?` 和 `*` 之间的区别：`*` 匹配 1 个或多个字符，而 `?` 仅匹配 1 个字符。


    ## 方括号通配符 `[ ]`

    你可以使用方括号通配符（即 `[ ]`）来搜索文件名或目录中包含的特定信息。例如，如果你想在特定目录下找到所有以小写字母 "a"、b" 或 "c" 开头的文件，可以在命令提示符中输入
    `find . -name "[a,b,c]*"`。括号匹配 `a`、`b` 或 `c`，而 `*` 则涵盖名称中的任何其他字符。如果你只想找到名为 `a`、`b`
    或 `c` 的文件，可以使用 `find . -name "[a,b,c]"`，并将仅匹配这些字符。


    方括号通配符命令还可以执行许多其他操作，例如查找特定范围的文件，甚至是一组范围。例如，如果你想搜索所有以字母开头的文件，可以输入 `find . -name
    "[a-z]*"` 并按回车。搜索结果将列出所有以小写字母开头的文件列表。


    ### 练习

    - 使用星号通配符 `*` 在你的 `Desktop` 文件夹中查找包含特定单词的文件。

    - 尝试使用问号通配符 `?` 查找具有特定长度的文件。

    - 使用方括号通配符 `[ ]` 查找所有以字母 "a" 开头的文件。

    - 将这三个通配符与在本章中学到的三个命令配对。在笔记本中记录你的发现。


    # locate

    要使用 `locate` 命令查找文件，输入 `locate` 加上你想查找的文件名；然后按回车。搜索结果将列出文件所在的目录和路径。


    ### 示例

    假设你正在搜索一个名为 `"codewords2019.txt"` 的文件，但你找不到所有的副本。使用 `locate` 命令可以为你找到该文件，同时提供它们的目录路径，这样你就可以在浏览大量无关文件的情况下访问并修改它。


    ### 解释

    `locate` 命令可以帮助你找到文件名的实例，如果你有多个同名文件且不知道如何访问它们，那么它可能非常有用。使用它将得到一个包含你关键词的文件列表，以及与列出文件相关的路径。


    ### 练习

    使用 `locate` 命令创建一个文件或搜索一个已经创建的文件。在笔记本中记录你的发现。


    # 正则表达式

    如果你需要缩小搜索范围，可能可以通过使用如 `grep` 之类的正则表达式来实现。我们将在章的稍后部分介绍这些通配符。


    # find

    `find` 命令可以像 `ls` 命令一样，用于搜索当前工作目录下的所有文件。只需输入 `find` 而不加任何其他参数。如果你想列出另一个目录中的文件，也可以输入直接路径。它还可以用于其他用途，例如接下来几节将涵盖的内容。


    ## 搜索文件

    用法：`find <从这里开始搜索的路径> -name <要搜索的名称>`


    你可以如下所示搜索特定名称的文件：

    ![](img/Image00040.jpg)

    这将找到根目录下所有名为 `"my_filename.txt"` 的文件。当此命令与通配符配合使用时将变得非常强大。


    此命令还可以用于搜索特定类型的文件。输入 `find -name "*.[你想查找的文件类型]"`。例如，如果你想查看当前目录及其子目录下所有的 `".jpg"`
    文件，可以输入 `find . -name "*.jpg"` 并按回车。

    ![](img/00041.jpg)


    在搜索不是特定类型的文件时，你也可以使用此命令。例如，如果你输入 `find . -not -name "*.jpg"`，你将获得所有非 `.jpg` 文件的列表。


    ### 练习

    使用 `find` 命令定位一个特定类型的文件列表。在练习的下部分写下你想要使用的文件，然后复制该文件的绝对路径，以防需要输入它。接下来，搜索该特定文件。Linux
    能够找到它吗？在笔记本中记录你的发现。


    # grep

    `grep` 命令是全局正则表达式解析器，它在文件中查找模式。要使用它，输入 `grep` 后紧跟你想查找的命令或字符串，以及你想让它搜索该命令或字符串的位置。


    例如，如果你想在特定目录下找到所有以特定单词或字母开头的文件，可以使用 `grep` 命令，输入 `"grep [你想查找的文件名] [目录名称]"`。


    如果你想找到特定目录下所有以特定单词开头的文件，可以使用 `grep` 命令。如果你想找到名为 James 的信息，可以输入如下内容并输出。

    ![](img/Image0042.jpg)


    ### 解释

    `grep` 代表“全局正则表达式解析器”。


    ### 练习

    使用 `grep` 搜索一个单词。在这种情况下，我们将使用 `grep` 搜索每个 `"photos."` 文件。输入 `grep -w "photos"`
    文件。如果你没有文件，可以使用 `touch` 命令创建一个。接下来，搜索某个特定单词。如果你正在使用虚拟机，通过在文件名之前输入 `tar` 命令之前来搜索你的用户名。在笔记本中记录你的发现。


    # 归档与压缩

    ## tar

    在 Linux 中，`tar` 代表“磁带归归档”。你可以使用 `tar` 命令创建归档文件并存储数据，从而节省磁盘空间。只需输入 `tar`，选择你使用的选项、文件名以及你想存储的位置。


    在这个例子中，假设我们想创建一个名为 `"abc"` 的文件，可以输入 `tar abc/home/docs`。如果你操作正确，它将包含 `docs` 目录的内容。


    ### 解释

    `tar` 命令可以帮助节省空间。


    ## gzip

    `gzip` 命令压缩文件，你可以以类似于 `tar` 命令的方式使用 `gzip` 命令。要使用此功能，在终端中输入 `gzip` 和文件名，然后按回车。默认情况下，`gzip`
    命令会在创建压缩版本后删除原始文件。但你可以通过在文件名之前输入 `-k` 来防止。例如，如果你不想让 Linux 删除原始文件，可以输入 `gzip -k
    filename`。


    ## zcat

    如果你想在不解压缩的情况下读取压缩文件，以节省潜在的时间空间，可以使用 `zcat` 命令。要使用它，输入 `zcat` 和你想查看的压缩文件的名称。然后按回车。如果你操作正确，可以在不解压缩的情况下查看文件内容。


    ### 练习

    首先使用 `zcat` 在不解压缩的情况下读取压缩文件。


    # 有用命令

    ## wc

    `wc` 或“单词计数”命令统计单词、字母和行数。要使用它，输入 `wc` 和文件或目录的名称。例如，假设我们要获取 `file1.txt` 的字数，可以输入
    `wc file.txt`。结果将给出三个数字：第一个是行数，第二个是单词数，第三个是字节数。如果你只想知道其中之一，可以使用选项。将上一个例子中的 `-l`
    替换为 `-w` 将得到字数。将 `-w` 替换为 `-c` 将得到字节数。你也可以使用 `--help` 命令查看列表。


    ### 练习

    找到你选择的文件的字数、行数和字节数。尝试使用与之前不同的文件。比较两个文件的字数，然后在笔记本中记录你的发现。


    ## history

    `history` 允许你查看在终端中输入的命令。输入 `history` 并按回车。默认情况下，Linux 会列出最后输入的命令。你甚至可以将此命令与其他命令结合（如
    `tail` 命令），使其有用。有时你可能需要提醒自己具体如何编写命令。与其一直查找或记忆它们，不如使用 Linux 的内置功能使该过程更简单。某些命令如
    `help` 命令、`man` 命令和 `history` 命令就属于这一类。输入 `history` 命令允许你查看过去输入的终端命令，如果你不记得具体输入了什么且无法浪费时间在互联网上查找，这将非常有用。你也可以通过向上方向键找到最近的命令。


    ### 练习

    使用 `history` 命令显示你的最后命令。接下来，跳转到“管道的魔法”部分，并使用本章中学与其他命令配合管道，使历史只显示你最后使用的命令。


    ## tree

    你记得之前用过 `tree` 命令吗？如果你想知道当前工作文件夹包含哪些子目录和文件，可以使用 `tree` 命令。在命令行中输入 `tree` 然后按回车。这可能会让你想起
    `ls` 命令，但它要详细得多，因为它不仅显示目录包含的文件夹，还显示这些文件夹内的每个程序文件。


    ### 练习

    使用 `tree` 命令生成文件和文件夹的详细列表。


    ## alias

    `alias` 是为了频繁使用的命令提供的快捷方式。为了方便输入，可以设置它。例如，一个常用的别名是 `ll`，它调用 `ls -al` 来显示所有文件。为了在会话中生效，你需要编辑
    shell 配置文件。在设置别名之前，请确保已经测试过它们是否正常工作。


    ### 练习

    创建三个别名并运行它们。你看到这些别名有种潜在用途？


    ## curl

    `curl` 命令可以从互联网下载文件。要使用它，输入 `curl`、你想执行的选项以及你想要检索信息的 URL。


    ### 示例

    如果你想查看网站的内容，可以输入 `curl [你想查看的网址]`。结果将是 HTTP 源代码。为了上传文件，你可以输入 `curl [文件] [上传地址]`。例如，如果我想将名为
    `"photos"` 的文件上传到本地服务器 `"server"`，我可能会输入。


    ### 练习

    使用 `curl` 命令下载文件并将其保存到桌面。使用 `curl` 命令查看你选择的网站的内容。


