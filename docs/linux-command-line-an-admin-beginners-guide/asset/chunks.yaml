    # Modes


    - **Command Mode** - This is the default mode and lets you move around in the
    editor, exit the editor, and search for text. Press the `Escape` key to return
    to `Command Mode` from the other modes.

    - **Insert Mode** - This mode lets you insert text into the document. To get into
    this mode, you first need to be in `Command Mode` and then press the `i` key to
    enter `Insert Mode`. Press the `Escape` key at any time to exit `Insert Mode`.

    - **Visual Mode** - This mode is used for selecting text in the document. To get
    into this mode, you first need to be in `Command Mode` and then press the `v`
    key to enter `Visual Mode`. Press the `Escape` key at any time to exit `Visual
    Mode`.


    ## Quitting

    To quit `vi` or `vim`, type colon and then the letter `q` `:q` into the terminal
    and press `Enter`. Like every other program run in the terminal, `vi` and `vim`
    require that you type a different command into the terminal to quit. Typing `Escape`
    or `Delete` will not yield any results.


    ### Exercise

    Open `vim` by typing `vim` and the name of the file you want to edit. For this
    exercise, we will edit that file we were working on in the previous example. You
    should be able to use the arrow keys to move the cursor to where you want to begin
    editing. Press `i` and then the `Enter` or `Return` key to enable editing. Add
    a sentence such as "I''m using vim" to this document. Next, save the document.
    Press `Escape` to go back into "Command" mode, then type `:q` to quit. It may
    take a few tries before you feel comfortable using the editor and entering the
    key combinations.


    ## More vim

    Other things you can do with `vim` include viewing and editing two documents or
    files at once, copying, and pasting.


    ### Vertical Split

    To view two documents or files at once, type in `vsplit` and the name of the file.
    In some cases, you may have to type in the absolute path. Once you do this, you
    can now view and edit both documents. This may come in handy if you are editing
    a file''s code and you need certain lines of the two to match.


    ### Copying

    If you want to copy text in `vim`, enter `Visual mode` and select the text and
    type `y` (short for yank). Make sure you are in `Visual mode`, or this may not
    work.


    ### Cutting

    If you want to cut text in `vim`, enter `Visual mode` and select the text and
    type `d`. Make sure you are in `Visual mode` or this may not work.


    ### Pasting

    To paste, type `p`. Make sure you are in `Visual mode` or this may not work. The
    program should let you know what mode it''s in by displaying it at the bottom.


    ### Exercise

    Practice opening up two files at once and edit them to say the same thing. Then
    try cutting, copying, and pasting information into your document. Play around
    with what you''ve learned and try to master the `vim` text editor. Remember, it
    might take a little practice to get the commands right when you first start using
    this editor.


    ## Summary

    - In this chapter, we covered some basic commands, including commands that may
    help you change directories, list the files in a directory, view the path of the
    directory you are currently working in, clear the screen of text and already executed
    commands, view a file''s type, move files, remove files, remove empty and full
    directories, create blank files, concatenate files, print file contents to the
    screen of your terminal, and view a set number of lines or bytes in a file.

    - We also practiced some helpful exercises that may aid you in remembering those
    commands.


