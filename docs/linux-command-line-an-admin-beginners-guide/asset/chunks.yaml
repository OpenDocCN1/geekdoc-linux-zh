    # The Star Wildcard

    The `star wildcard`, or asterisk symbol, is used to match one or more instances
    of any character when searching for information. For example, if you type `find
    . -name "my_test*"` in the terminal and press Enter, your search results will
    list all files that start with `my_test` in the directory in which you are currently
    working.


    ## The Question Mark Wildcard `?`

    The question mark wildcard, or `?`, is used to match one character in the search.
    For example, if you wanted to search for every instance of a file that was only
    five characters long, you would type, `find . -name "?????"` and press Enter.
    Note the difference between `?` and `*` the `*` matches 1 or more characters while
    the `?` only matches 1 character.


    ## The Square Brackets Wildcard `[ ]`

    You can use the `square brackets wildcard`, or `[ ]`, to search for specific information
    contained in filenames or directories. For instance, if you wanted to find every
    file in a specific directory that started with the letter "a," "b," or "c" in
    lowercase, you could enter, `find . -name "[a,b,c]*"` into the command prompt.
    The brackets match `a`, `b` or `c` while the `*` covers any other characters in
    the name. If you only wanted the file named `a`, `b`, or `c`, you would use `find
    . -name "[a,b,c]"` and only those characters would be matched.


    Many other things can also be done with the `square brackets wildcard` command,
    such as finding files within a certain range, or even sets of ranges. For instance,
    if you wanted to search for every file that began with a letter, you could type,
    `find . -name "[a-z]*"` and press Enter. The search results should yield a list
    of every file that has a name that starts with a lowercase letter.


    ### Exercise

    - Use the star wildcard `*` to find every instance of a file containing a certain
    word in your `Desktop` folder.

    - Try using the question mark wildcard `?` to find every instance of a file with
    a certain number of letters.

    - Use the square brackets wildcard `[ ]` to find every instance of a file that
    starts with the letter "a."

    - Pair these three wildcards with three commands you learned in this chapter.
    Record your findings in your notebook.


    # locate

    To use the `locate` command to find a file, type `locate` and the name of the
    file you want to find; then, press Enter. The search results should list the directory
    and path in which the file is found.


    ### Example

    Let''s pretend you are searching for a file that you named `"codewords2019.txt"`,
    but you can''t find all of them. Using the `locate` command should find that file
    for you while also giving you their directory path, so you can access and modify
    it without looking through a bunch of unrelated files.


    ### Explanation

    The `locate` command helps you find instances of a file name and may be useful
    if you have multiple files of the same name and do not know how to access them.
    Using it will result in a list of files that contain your keywords and the paths
    associated with the listed files.


    ### Exercise

    Create a file or search for one already created using the `locate` command. Record
    your findings in your notebook.


    # Regular Expressions

    If you need to narrow down your search, you may be able to do so by using regular
    expressions such as `grep`. We will be covering these wildcards later in this
    chapter.


    # find

    The `find` command can be used like the `ls` command to search for all files in
    the current working directory. Just type `find` and no other arguments. You can
    also type in the direct path if you want to have it list other files in another
    directory. It can also be used for other things, such as what the next few sections
    will cover.


    ## Searching for Files

    Usage: `find <path to start searching from> -name <name to search for>`


    You can search for files with a specific name as follows:

    ![](Image00040.jpg)

    Will find all the files named `"my_filename.txt"` in the root directory. This
    command becomes very powerful when paired with wildcards.


    This command can also be used to search for files of a specific type. Type `find
    -name "*.[the type of file you want to be found]"`. For example, if you want to
    see all of the `".jpg"` files in the current directory and subdirectories, you
    would type, `find . -name "*.jpg"` and Enter.

    ![](00041.jpg)


    You can also use this command when searching for files that are not of a certain
    type. For example, if you entered `find . -not -name "*.jpg"`, you would get a
    list of all files that are not `.jpg` files.


