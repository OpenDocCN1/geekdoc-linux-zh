    # Archive And Compression

    ## tar

    In Linux, `tar` stands for "tape archive." You can use this command to create
    archive files and compress and store data, so it takes up less space on your drive.
    Just type `tar`, choose the option you want to use, name the file, and decide
    where you want to store it.


    In this example, let''s say you wanted to create a tar file named `"abc"` and
    from the directory called `"docs."`. To do this, you would type something like
    `tar abc.tar usr/home/docs`. If you did it correctly, you would have a `.tar`
    file called `"abc.tar"` that includes the contents of the `docs` directory in
    the current directory.


    ### Explanation

    The `tar` command helps you save space, which can come in handy if you have a
    computer or network with limited storage space due to usage as server or multi-user
    machine.


    ### Exercise

    Create a new file using the `touch` command, then change it into a `.tar` file.


    ## gzip

    The `gzip` command zips a file, and you can use the gzip command in a similar
    way to the tar command. Like tar, it is used to compress or expand files. To use
    this feature, type `gzip` and the filename into the terminal, then press Enter.
    By default the gzip command deletes the original file once it creates zipped version.
    You can prevent this, however, by typing `-k` before the filename. For example,
    if you did not want Linux to delete the original file, you could type `gzip -k
    filename`.


    ### Exercise

    Create a zipped text file using `gzip`.


    ## zcat

    If you want to read files that were gzipped without unzipping them and potentially
    wasting time and space in the process, you can use the `zcat` command. This command
    will allow you to read gzipped files from the terminal. To use it, type `zcat`
    and the name of the gzipped file you want to look at. Then, press Enter. If you''ve
    done this correctly, you should be able to view the contents of the file without
    having to decompress it.


    ### Exercise

    Read a zipped text file without unzipping it first using `zcat`.


    # Useful Commands

    ## wc

    The `wc`, or "word count," command counts the number of words, letters, and lines.
    To use it, you would type `wc` and the name of the file or directory. For example,
    let''s say we wanted to get word count of `file1.txt`. We could type `wc file.txt`.
    The results should give us three numbers--the first is the number of lines, the
    second is the number of words, and the third is the number of bytes. If you only
    wanted to know one of these things, you could use options.


    Replacing the `-l` in the previous example with `-w` will give you just the word
    count. Replacing `-w` with `-c` would give us the number of bytes. You can also
    use the `--help` command for a list of options.


    ### Exercise

    Find the word count, number of lines, and number of bytes of a file of your choice.
    Try to use a different file than the ones you''ve used. Compare the word count
    of two different files, then write your findings in your notebook.


    ## history

    `history` allows you to view the commands that have been typed in the terminal.
    Type `history` and press Enter. By default Linux will list the last commands typed.
    You can even combine this command with other commands, such as the `tail` command,
    to make it useful. Sometimes you may need a reminder of how exactly write a command.
    Instead of looking them up all the time or memorizing them, you can use Linux''s
    built-in features to make that process easier. Some commands, such as the `help`
    command, the `man` command, and the `history` command, fall into this category.
    Entering the `history` command allows you to view the past commands entered into
    the terminal, which will come in handy if you don''t remember exactly what you
    typed and can''t afford to waste time looking up on the Internet. You can also
    find recent commands by pressing the Up key.


    ### Exercise

    Use the `history` command to display your last commands. Next, jump to the Magic
    of Piping section and use piping with another command learned in this chapter
    to make the history display only the last commands you used.


    ## tree

    Do you remember using the `tree` command earlier? You can use the `tree` command
    if you want to know what subdirectories and files are contained in the folder
    in which you are working. Type `tree` into the command line, then press Enter.
    This may remind you of the `ls` command, but it is much more detailed, as it shows
    not only folder a directory contains but also each program file inside those folders
    as well.


    ### Exercise

    Use the `tree` command to generate a detailed list of files and folders in your
    current working directory. Then, do the same thing using the `ls` command. Write
    how they are different in your notebook. What might you use the `ls` command for
    that you would not use the `tree` command for? What might you use the `tree` command
    for that you couldn''t use the list command for?


    ## alias

    This is a shortcut for commands that you use frequently. Some people use an alias
    to change the default behavior of a command. For example, we could assign an alias
    to the `rm` command so that it asks us to confirm the deletion of a file (the
    `rm -i` where that is a lowercase I). To use the alias command, just type the
    new command you created.


    ### Example

    A common alias is `ll` which will call `ls -al` to show all files in long-form.


    Don''t worry about messing anything up; your custom commands will not be available
    in your next session unless you edit your shell configuration profile. You can
    look up how to edit your shell configuration profile, but make sure you are well
    versed in Linux programming and commands before you do that, as it is not a task
    that is recommended for beginners. It is possible to mess a few things up when
    creating custom commands, so be careful and don''t opt to make them permanent
    until you have tested it and know it works.


    ### Exercise

    Create three custom commands and then run them. Record your findings in your notebook.
    What were your commands, and what did they help you do? What potential uses do
    you see for setting aliases in the future?


    ## curl

    The `curl` command can be used to download files from the internet using the terminal
    in the absence of a GUI. To use this command, type `curl`, the option that you
    want the machine to perform, and the URL of the information you want to retrieve.
    You can also use the `curl` command to upload files to the Internet.


