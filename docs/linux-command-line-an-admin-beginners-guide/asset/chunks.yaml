    kernel version info.![](Image00058.jpg)#Typical User Management CommandsThe root
    user has administrative privileges, which means that the user with access to the
    root account can do nearly anything in the system, even bypassing security checks
    for normal users without the root privilege. While the root user always has administrative
    privileges, other users can have admin privileges or just standard privileges.Having
