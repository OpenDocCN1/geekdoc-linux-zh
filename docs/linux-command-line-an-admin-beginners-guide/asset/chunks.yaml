    We know what the current directory looks like. How can we create a new empty file![](Image0032.jpg)

    As you can see, the `touch` command created a new file with a size of 0 (see the
    0 before the Feb 2?) Notice that the total didn’t change (still 4) because total
    gives the number of blocks used. Since the file is 0 in size, nothing needs to
    change.

