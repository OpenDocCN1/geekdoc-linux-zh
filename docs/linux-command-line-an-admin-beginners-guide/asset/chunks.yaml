    # 模式


    - **命令模式 (Command Mode)** - 这是默认模式，允许你可以在编辑器中移动、退出编辑器以及搜索文本。按下 `Escape` 键可从其他模式返回
    `Command Mode`。

    - **插入模式 (Insert Mode)** - 此模式允许你向文档中插入文本。要进入此模式，你首先需要处于 `Command Mode`，然后按下 `i`
    键进入 `Insert Mode`。随时按下 `Escape` 键即可退出插入模式`。

    - **可视模式 (Visual Mode)** - 此模式用于选择文档中的文本。要进入此模式，你首先需要处于 `Command Mode`，然后按下 `v`
    键进入 `Visual Mode`。随时按下 `Escape` 键即可退出可视模式`。


    ## 退出

    要退出 `vi` 或 `vim`，在终端中输入冒号加字母 `q` 即 `:q` 并按 `Enter`。与终端中运行的所有其他程序一样，`vi` 和 `vim`
    需要你在终端中输入特定的命令来退出。输入 `Escape` 或 `Delete` 不产生任何结果。


    ### 练习

    通过输入 `vim` 加上你要编辑的文件名来打开 `vim`。在练习中，我们将编辑上一个示例中处理过的文件。你应该能够使用方向键将光标移动到你想开始编辑的地方。按下
    `i` 然后按 `Enter` 或 `Return` 键启用编辑。在此文档中添加类似“I''m using vim”的句子。接下来，保存文档。按下 `Escape`
    返回“命令”模式，然后输入 `:q` 退出。可能需要尝试几次你才能熟练使用该编辑器并输入组合键。


    ## 更多 vim

    使用 `vim` 可以做的其他事情包括同时查看和编辑两个文档或文件、复制和粘贴。


    ### 垂直分屏

    要同时查看两个文档或文件，输入 `vsplit` 和文件名。在某些情况下，你可能需要输入绝对路径。一旦这样做，你就可以同时查看并编辑两个文档。如果你正在编辑文件的代码并需要两个文件的某些行保持匹配，这可能会非常有用。


    ### 复制

    如果你想在 `vim` 中复制文本，进入 `Visual mode` 并选择文本，输入 `y`（yank 的缩写）。确保你处于 `Visual mode`，否则可能可能无效。


    ### 剪切

    如果你想在 `vim` 中剪切文本，进入 `Visual mode` 并选择文本并输入 `d`。确保你处于 `Visual mode`，否则可能无效。


    ### 粘贴

    要进行粘贴，输入 `p`。确保你处于 `Visual mode`，否则可能无效。程序应该通过在底部显示让你知道它当前处于哪种模式。


    ### 练习

    练习同时打开两个文件并编辑它们显示相同的内容。然后尝试剪切、复制和粘贴信息到你的文档中。尝试你所学的内容并尝试掌握 `vim` 文本编辑器。记住，刚开始使用此编辑器时，可能需要一些练习才能正确输入命令。


    ## 总结

    - 在本章中，我们涵盖了一些基础命令，包括帮助你更改目录、列出目录中的文件、查看当前工作目录的路径、清除屏幕文本和已执行的命令、查看文件类型、移动文件、删除文件、删除空目录和满目录、创建空文件、合并文件、将文件内容打印到终端屏幕，以及查看文件中指定行数或字节。

    - 我们还练习了一些实用的练习，可能有助于你记住那些命令。


