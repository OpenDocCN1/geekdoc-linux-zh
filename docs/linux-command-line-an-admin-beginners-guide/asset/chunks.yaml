    Now, tally up your score. Round to the nearest tenth if needed. How did you do?


    If you got 100% of these questions correct, great job! You might know the basics
    of the Linux command line now, and you might be ready to take on more complex
    and advanced projects. If you scored below 100%, make a note of all of the questions
    you missed and go back to the chapters where they are found and look them over.
    Keep practicing on the command line until you feel comfortable with all of the
    commands.


    # Project Ideas

    Now that you have a general idea of the Linux file system and how it is structured,
    along with how to use its basic commands and options, you may want to further
    your learning by attempting some basic projects.


    ## Basic-Beginner Friendly


    ### Continue Bash

    You might want to continue learning the `Bash` scripting language and try your
    hand at writing more complex commands. You may even try creating a labor-saving
    program or two. Such a project will likely require commands like `alias` and `grep`,
    combined with techniques like piping. After getting familiar with stringing basic
    commands together, you can start to use conditional checks and loops to really
    power up your scripts.


    Let''s pretend you want to write a program to find the text files in the current
    directory and limit the result to 2 files.

    ![](Image00084.jpg)


    You might be able to use simple commands like this when creating automated messages,
    such as for group emails, and there are many other things you could do with the
    commands you''ve already learned as well. Searching on the internet is a great
    way to get an idea of the things you could do. Type in something like "scripting
    basic programs in the `Bash` shell" and click on the links, tutorials, or videos
    that interest you. If you have a specific project in mind, tailor your search
    to your specific needs.


    Give yourself some more practice with piping and using `grep`. Mix commands together
    or apply the commands you know to a project to expand your learning and get an
    idea of how it all fits together.


    ### Learn the Basics of a Programming Language


    #### Python

    You may be surprised to find out that a lot of programs in the Linux environment
    are created using the `Python` scripting language. Many distributions of Linux
    come with `Python` pre-installed, and distros of Linux that might have been made
    especially for aspiring programmers and hobbyists, such as `Raspbian`, may even
    have `Python` programming tutorials as standard desktop programs.


    Improve your coding knowledge by taking the next step and learning how to write
    a simple program that can be run on your Linux machine. Some suggestions for where
    to start may include just doing an internet search for "learn `Python." You may
    find many free tutorials among paid options, or you can purchase or borrow an
    ebook, via Amazon''s Kindle Unlimited service for example. Feel confident about
    tackling your next project.


    #### C and C++

    To use other Linux features, you might want to learn some basics of the `C` programming
    language. Doing so will enable you to enter commands into the `csh` shell, as
    mentioned before. You may also learn how to write programs and apps for the Linux
    OS.


    ### Set up a Raspberry Pi Project

    `Raspberry Pi` is a simple mini-computer that may be small enough to fit into
    the palm of your hand. Don''t let its size fool you; it can still be used to build
    amazing projects.


    #### Simple All-in-One Computer

    Have you ever wanted an "all-in-one" desktop computer (computers that come with
    the monitor and all of the hardware right out of the box and don''t have to be
    connected to a tower), but thought they were prohibitively expensive? Good news!
    You can now create something fairly similar by setting up a `Raspberry Pi` mini-computer
    and hooking it up to an old LCD computer monitor.


    For this project, you need to know how to:

    * Assemble a basic computer.

    * Download Linux onto a memory card.

    * Configure options in the terminal.


    This project is relatively easy to complete-- merely put together a `Raspberry
    Pi` by use of the build kit that came with your `Pi`. If you need help, a quick
    internet search should provide plenty of instructional videos. Next, write a memory
    card with `Raspbian` if your build kit didn''t already come with one. Insert the
    memory card that you wrote with the `Raspbian` operating system, then hook it
    up to power and boot it up.


    Use a USB wand or dongle to connect the `Pi` to a monitor and anchor it in place.
    You now have a functional, "all-in-one" computer with no visible tower and wireless
    connectivity capability. Practice surfing the web and installing new programs
    on it. If you need expanded storage space, external hard drives are available
    and should connect with a standard `USB` port.


    ## Intermediate


    ### Set Up a Small Home Server

    You don''t have to wait until you learn a full coding language to do something
    productive in Linux. If you have a small computer that you aren''t using and want
    to re-purpose, you could set up a home server for added security on your own network.


    Before we get started, here are some of the commands that you might need to know:

    * `mkdir`

    * `sudo apt-get install`

    * `adduser`

    * `addgroup`

    * `hostname -i`

    * `chmod`


    #### Step One: Select a computer to act as a server

    Use a small computer for this project, either an old outdated computer or a `Raspberry
    Pi` mini-computer. You can increase the physical storage via external hard drives,
    and don''t think you need a computer with a lot of RAM or processing power to
    act as your server.


    #### Step Two: Install Linux

    Use a USB copy of `Debian` or a version of Linux configured especially for server
    use. Put the USB copy of the program into the USB port of the computer you want
    to re-purpose as a server, and go through the prompts of the install. Select the
    server version, then select the `LAMP` package install.

