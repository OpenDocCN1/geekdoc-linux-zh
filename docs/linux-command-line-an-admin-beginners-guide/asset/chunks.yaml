    # 系统管理命令


    以下是 IT 专业人员用于管理组织内部计算机系统的常用命令。


    ## df

    `df` 命令代表“显示文件”（display file）或“文件系统空间”（file system space），允许你显示已用和可用的文件系统空间。要使用它，只需输入
    `df` 和文件夹名称即可。如果只输入 `df`，将给出如下所示的概述。![](img/Image00053.jpg)


    ## du

    `du` 命令是“磁盘使用情况命令”，它允许你查看文件和命令的磁盘占用情况。要使用此命令，输入 `du` 后跟目录。如果你需要回收程序使用的数据空间，此命令可能会非常有用，尽管它提供的是进位后的估值，而非真实的实时使用量。常用的输入方式是
    `du -ch`，它会提供摘要（`-c`）和人类可读的输出（`-h`），后者会加上 `K`（KB）、`M`（MB）或 `G`（GB）。![](img/Image00054.jpg)


    ## free

    使用 `free` 命令可以查看可用内存和系统 RAM。如果你需要知道某个程序是否正在消耗系统资源，或者某个程序占用了多少内存，这个命令会很有用。(Image00055.jpg)


    ## w

    `w` 命令显示当前登录系统用户的信息，包括他们正在做什么。如果你想检查员工的工作效率，或者想检查哪个员工正在运行对系统内存负载沉重的任务，这个命令可能非常有用。


    ## whoami

    `whoami` 命令可以快速显示你当前登录的用户名和账户。如果你不确定自己的用户账户拥有什么权限以及你有权运行哪些命令，这可能会很有帮助。如果你在测试系统功能时登录了具有不同权限的多个账户，它也能帮到你。要使用此命令，在终端中输入
    `whoami` 并按回车。你应该能看到显示用户名的输出。(Image00056.jpg)


    ## hostname

    你可以使用 `hostname` 命令查找主机名。你还可以使用 `-i` 选项打印 IP 地址。在下面的结果中，`127.0.0.1` 的 IP 地址表示本地主机（localhost），即“这台计算机”。![](img/Image00057.jpg)


    ## uname

    这将为你提供有关操作系统及其安装机器的信息打印。使用 `-a` 选项查看所有内核信息，包括构建日期和内核版本信息。(Image00058.jpg)


    ## 典型用户管理命令


    root 用户拥有管理员权限，这意味着拥有 root 账户访问权限的用户可以在系统中执行任何事情，甚至可以绕过对没有 root 权限的普通用户的安全检查。虽然
    root 用户始终拥有管理员权限，但其他用户可以拥有管理员权限或仅标准权限。


    如果使用得当，拥有管理员权限是好事，但如果使用粗心，则是有害的。如果管理员/root 用户不知道自己在做什么，可能会搞乱操作系统，甚至损害他人的账户。这就是为什么在
    Linux 中拥有 root 权限是一件大事。


    管理员、IT 专业人员以及任何其他恰好拥有 root 账户访问权限的人必须确保输入正确的命令，并清楚自己在做什么，以防止意外删除敏感数据或导致程序失效。此外，拥有管理员权限的人通常还负责管理用户账户、修复漏洞、处理密码问题以及维持在一定程度的安全水平。幸运的是，Linux
    包含了一些命令，使得跟踪数据和用户变得更容易。


    ## quota

    如果没有设置数据配额，网络上的用户可能会独占所有资源。他们可能会开始下载不需要的文件，并在账户中保留各种碎片信息，如报告、教学视频和项目。


    使用 `quota` 命令可以轻松监控用户的限制。该命令显示用户的磁盘使用情况和限制，拥有管理员权限的用户可以使用此命令查看用户的配额。要使用此命令，输入
    `quota -s` 和你想检查的用户 ID。


    ### 编辑配额

    如果你想更改某个用户或组的配额，可以使用 `edquota` 命令。编辑单个用户的配额，输入 `edquota -u` 和用户名。编辑整个组的配额，输入 `edquota
    -g` 和组名或组 ID。


    ## passwd

    提到，拥有管理员权限的用户如果知道方法，可以在 Linux 中做很多事情。假设某人忘记了自己的密码。如果你是负责 IT 的人员，应该知道如何正确处理这种情况。除非你工作的公司没有授予真正的管理员权限，否则可以通过输入
    `passwd` 来解决这个问题。(Image00059.jpg) 可能存在需要更改密码但尚未更改的情况。在这种情况下，你可能想要执行强制用户更改密码的命令（参见下文
    `chage` 命令）。


    `passwd` 命令用于更改用户的密码。具有管理员权限的人还可以使用该命令的各种选项，例如 `-w` 在密码过期前警告用户，或者 `-n` 设置用户在更改密码前必须等待的最少日数。**实验：**
    尝试 `passwd` 命令及其选项，以目标用户身份登录并记录你的发现。


    ## chage

    `chage` 命令可用于 Linux 强制用户更改密码，输入 `chage -d 0 <username>`。与之前的示例类似，此命令也会强制用户在下次登录时更改密码。如果你想让拒绝更改密码的用户被锁定账户，请使用
    `chage` 命令的 `-E` 选项。它看起来类似于 `chage -E <日期或天数> <username>`。这将锁定用户的账户，直到管理员或 root
    用户将其重置。这些功能很重要，因为它们可以执行公司可能关于用户更改密码的策略，确保重要信息不泄露。**实验：** 对你创建的用户使用 `chage` 命令，以该用户身份登录。


    ## adduser

    `adduser` 命令用于创建和添加新用户。输入 `adduser` 和你想创建的新用户用户名。


    ### 添加普通用户

    要添加普通用户，输入 `adduser` 和你想创建的新用户用户名。该用户将被分配一个 ID，并获得系统上普通用户拥拥所有权限。(Image0060.jpg)


    ### 添加管理员用户

    要添加具有 root 等权限的管理员用户，遵循上述添加普通用户的相同流程。区别在于管理员用户被添加到具有更高权限的组中。例如，在 Ubuntu 上，这是 `sudo`
    组。(Image00061.jpg)


    ### 添加系统用户

    系统用户是在安装某些程序时创建的账户，执行特定的任务并运行进程。它们通常不属于真实用户，而是后台运行的程序。它们对系统的访问有限，以便能够在最少的人为干预下完成任务。管理员控制这些程序的组
    ID 和权限是 Linux 防止恶意软件和不受控程序的一种方式。与 Windows 系统相比，在 Windows 中，安装的程序通常被授予管理员权限。要添加系统用户，输入
    `adduser --system` 和用户名。系统用户是在安装某些程序时创建的账户，执行特定的任务并运行进程。它们通常不属于真实用户，而是后台运行的程序。它们对系统的访问有限，以便能够在最少的人为干预下完成任务。


    ### 强制新密码

    要强制用户更改密码，使用 `passwd --e <username>`。这将强制用户在下次登录时更改密码。


    ### 分配组 ID

    要分配程序组 ID，使用 `usermod -g <groupname> <username>`。这允许用户属于特定的组。(Image0062.jpg)


    ### 用户信息

    `w` 命令显示当前登录系统用户的信息，包括他们正在做什么。如果你想检查员工的工作效率，或者想检查哪个员工正在运行对系统内存负载沉重的任务，这个命令可能非常有用。如果你从事
    IT 工作，这个命令对你可能特别有用，因为可以防止你在员工负载已经给机器内存带来压力的情况下在机器上操作或安装程序。


