    ## diff

    The `diff` command compares two similar files and prints out the parts that are
    different, making changing the files to where they are identical much easier.
    This command is easy to use -- just open your Linux terminal and type `diff`,
    then the name of the two files you want to be compared, separated by a space.
    For example, you can type `diff file1 file2


    ## cmp

    If you want to compare two files byte by byte, you can use the `cmp` command.
    Unlike the `diff` command, this command will print out which bytes and line numbers
    are different in the files being compared.


