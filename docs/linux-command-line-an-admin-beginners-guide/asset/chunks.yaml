    develop a working knowledge of the Linux command line.Once you develop a working
    knowledge of the command line, you will be able to tackle more advanced Linux
    projects with confidence. Maybe you''ve wanted to program your own server system,
    adapt a Linux system for home use, or just dabble in computer programming. Whatever
