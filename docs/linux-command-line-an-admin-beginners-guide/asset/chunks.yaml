    * Linux 是一项于 1991 年开发的开源操作系统。Linus Torvolds 被认为创建了第一个功能性的 Linux 内核，该内核最初被移植到家庭计算机，并最终分发到全球。他还是首批开发者之一，他们开启了让
    Linux 成为 FOSS（即自由软件和开源软件）的传统。

    * 最终，Linux 开发者同意可以对其进行销售但仍保持开源，因此 Linux 在 `GNU GPL` 下重新授予了许可。

    * 随着 Linux 变得越来越流行，人们开发了其他对家庭用户更友好的版本，例如 `Ubuntu`。

    * 对于大多数普通电脑用户来说，Linux 项目的存在似乎并不是什么大事，但对于程序员来说，它可能是一个游戏规则改变者。它的存在也意味着对安全敏感的用户不需要为了使用电脑而不得不忍受像
    `Google` 和 `Microsoft` 这样的数据挖掘公司。

    * Linux 的愿景继续为所有人提供开发和学习的自由。


    # 第三章：Linux Shell（（外壳）


    ## 什么是 Linux Shell？

    在 Linux 中，`"shell"` 是一个命令解释器。简单来说，`shell` 是一个帮助用户与操作系统其余部分通信的程序。Shell 程序使得与机器通信并告诉它执行什么变得容易得多。


    ### 简史

    从前以前，计算机是占据房间大部分空间的巨型机器。它们没有屏幕、键盘或鼠标；相反，用户通过使用电打字机或一系列开关手动向纸片卡上喂入指令来与它们通信。尽管这些机器体型巨大，但它们只能运行一个程序，而且每次启动或需要新程序时，都必须将程序指令重新输入到机器中


    有人意识到，如果计算机将 30% 的时间留给 Paul，30% 的时间给 Betty，40% 的时间给 Pat，它们就可以处理多项任务。计算机可以运行 30
    秒 Paul 的程序，然后是运行 30 秒 Betty 的程序，最后是运行 40 秒 Pat 的程序。最早的多任务操作系统之一被命名 `Unix`。如上所述，使用
    `shell` 与操作系统通信的方法是演变自旧的纸片卡程序的。


    随着时间的推移，计算机开始变得越来越小，但如何与它们通信的概念以及许多早期的术语一直保留了下来，包括 `shells`（壳）和 `terminals`（终端）的概念。最初，`terminal`
    是一个像打字机加显示器的电打字机。`terminal`为向计算机输入信息提供了一种更方便的方法，而 `shell` 提供了一种处理键盘输入的方法。


    最终，那些想要更易于使用的机器并让更多不仅仅是程序员的人使用计算机的开发者创建了不复杂的操作系统，使得 `shell` 及其 `terminal` 的工作可以对用户隐藏。因此，带有桌面环境的操作系统被开发出来。


    ## 回 Shell

    操作系统的 `shell` 是一个程序，它从键盘接收输入并将其作为执行的命令发送给操作系统。`shell` 与用户用于与操作系统交互的 `terminal`
    通信。


    在桌面环境中，`shell` 在不被看到的情况下进行工作。如果是图形用户界面（或 `GUI`），用户只需要导航到某些图标或点击某些按钮，即可让机器执行任务或打开程序。然而，`GUIs`
    并不是与 `shell` 通信的唯一手段。


    `shell` 还会与命令行用户界面（或 `LUI`）通信，它也可以称为命令行界面（`CLI`）。Windows 上的例子是 `Windows Command
    Prompt`（Windows 命令提示符），它是那个提示用户输入代码以便计算机执行某些任务的黑屏。


    尽管你可以在 Linux 中使用 `GUI` 运行程序，但使用 `LUI` 执行程序要常见得多，因为 `LUI` 在 Linux 系统中非常强大。`shell`
    通常被用于启动其他程序。


    ### 终端 (Terminal)

    在 Linux 中，`terminal` 实际上是一个 `terminal emulator`（终端模拟器）。用户通常无法在不使用 `terminal` 的情况下与操作系统，这部分出于安全考虑。


    请注意，`shell` 本身是一个从 `terminal` 或 `GUI` 桌面接收输入的程序——它并不等同于 `terminal`。多个 `terminals`
    可以与同一个 `shell` 通信。然而，尽管一个 `terminal` 可以与不同版本的 `shells` 话，但它一次只能指向 1 个 `shell`。


    `terminal` 是过去用来向 `shell` 发送各种命令的屏幕。在 Linux 中，有时只有 `terminal CLI` 可用，因为机器不需要运行桌面环境。这对于大多数计算机都是可以的，而且对于那些内存有限或不需要用户可交互屏幕的计算机来说，这甚至是必要的。


    ## 为什么要使用命令行界面？

    对于某些较小的计算机，例如你在机器人或遥控机器中常见的，用户与桌面环境的交互是不现实的。在这种情况下，通过在命令行中输入命令来访问机器。


    尽管对于习惯使用桌面的人来说似乎不方便，但使用命令行更快、更强大、更实用。由于空间原因，服务器不包含键盘、鼠标和显示器，因此必须使用 `CLI` 访问。家用路由器等小型设备可能运行
    Linux OS，并且必须使用 `CLI` 。


    现在你已经了解了一些关于 `shells`、`terminals` 和命令行，让我们来讨论 Linux `shells` 的类型以及为什么你可能想使用每种。


    ## Linux Shell 的类型

    在本章中，我们将讨论在 Linux 中可能发现的两种 shell：`Bash` 和 `csh`。`Bash` 最初用在 `Unix` 上。苹果操作系统基于
    `Unix` 并使用 `Bash`，所以如果你熟悉苹果操作系统的命令行，这其中的很多内容对你来说可能很熟悉。


    ### Mac 和 Windows 用户

    然而，即使你熟悉 Unix 命令行，Linux 的语法也可能存在细微差异。如果你是 Windows 用户，遗憾的是，这其中的很多内容对你来说可能很陌生。尽管
    Windows 有 `Windows Command Prompt`，但如果你一直使用桌面环境执行任务，你可能并不熟悉它。


    ## 在哪里运行 Linux 命令行

    有不同的方法可以获取用于学习的 Linux 命令行。


    ### 安装 Ubuntu

    最好的方法是安装 Ubuntu。有很多方法可以，包括安装双启动 Ubuntu 镜像、从 USB 闪盘运行（称为 `USB Live`），或在 `VirtualBox`
    镜像上安装 Ubuntu。


    ### 双启动（原生安装）

    按照 Ubuntu 教程将镜像下载到 USB 闪盘并进行安装。

    * 优点 – 选择在启动时运行 Ubuntu 还是 Windows。

    * 缺点 – 必须重启才能切换到另一个操作系统。


    ### USB Live

    按照 Ubuntu 教程将镜像下载到 USB 闪盘，但从 USB 驱动器运行。

    * 优点 – 默认不会更改硬盘。

    * 缺点 – 较难保存任何内容。更改不会持续——重启将回到初始状态。


    ### VirtualBox

    创建一个新的 `VirtualBox` 环境，并按照 Ubuntu 教程将镜像下载到你的 PC 并安装。

    * 优点 – 可以轻松地在不同的操作系统之间切换。

    * 缺点 – 占用硬盘空间。比原生安装慢。

