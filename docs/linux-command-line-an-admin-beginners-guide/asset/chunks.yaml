    # Webinal – Command Line in Browser

    Another option is running the Command Line in a browser. Web options such as `Webinal`
    allow you to learn the Linux command line using a browser. In fact, a lot of the
    examples in this book use `webinal`.


    ## Chrome OS and Others

    If you already have a machine that runs an OS based off Linux, such as Google
    Chrome, you may fall into one of two camps - 1) you may have never even heard
    of the `Crosh` terminal and may have stuck to using your machine for light tasks,
    such as doing schoolwork, surfing the internet, or streaming movies and TV shows.
    In this case, you might have little to no knowledge of the Linux command line
    and little to no experience using a terminal.


    On the other hand, if you''ve completed more advanced tasks with your Chromebook,
    you might have some familiarity with its inner workings and the `Crosh` terminal.
    In that case, some of this book may have been familiar to you, namely commands
    like `sudo`, `apt-get install`, among others.


    That said, even though Google ChromeOS is based on the Linux operating system,
    they are not the same. If you are using dual OS mode to follow along with these
    exercises, make sure that you are not in Google Chrome and that you are not typing
    in a `Crosh` terminal. Switch to the Linux side to complete these exercises there
    to avoid any confusion.


    ## Useful Commands

    ### Tab-Completion

    If you want to re-type a command but aren''t sure what it looks like, you can
    start typing the command and press the `Tab` key. The terminal will attempt to
    complete the command for you, preventing you from having to stop to look up syntax
    and spelling for commonly used commands.


    ### CTRL+R--Search History

    To use this command, tap the `Ctrl+r` keyboard shortcut. You should get an option
    to search the history of commands you have typed into the terminal. Type in a
    few letters of what you''re looking for and the last command you entered that
    contains those letters should show up.


    You can also use the `Up Arrow` key to view the last commands you used to a point.


    ## Other Shells

    ### csh

    The abbreviation `csh` stands for `C Shell` in Linux, or you may also get the
    version called `Tcsh`. The `C shell` is an LUI interpreter with a C programming
    language-like syntax. If you are not already familiar with the C programming language,
    you may want to familiarize yourself with it before you attempt to do any serious
    programming in a `C shell`.


    ### Brief Overview of Shell Scripts

    You can use either `Bash` or `csh` shells to run programs from a terminal. However,
    this book will cover `Bash` shell scripting.


    The difference is the latter of the two will accept inputs using C-like scripting
    syntax. However, teaching C language is beyond the scope of this book, and may
    make learning Linux seem complicated. For now, we will stick to the `Bash` shell
    for Linux commands.


    ## Chapter Summary

    - `csh` and `Bash` are both types of shells used in Linux.

    - `csh`, or `C shell`, is a type of shell that uses C-like syntax and scripting
    language.

    - A `terminal` and a `shell` are not the same thing - a `terminal` is a program
    used to allow the user to give instructions to the `shell`.


    # CHAPTER FOUR: Linux Basic File Directory

    Linux is modeled on the UNIX operating system. As such, the filesystem and commands
    are similar to UNIX. If you are already familiar with systems like Apple OS, the
    file system may be familiar to you.


    It''s also recommended that you use a bootable Linux USB stick for learning Linux.
    Changes are not stored on a bootable Linux USB stick.


    ## What is the Linux Filesystem?

    The Linux filesystem is a collection of directories, and it is composed of files
    and folders that keep it organized. You may be familiar with this concept if you''ve
    worked in an office. In Linux, every piece of information is represented by a
    file. Everything looks like a file.


    - The command that boots the operating system

    - User passwords

    - Actual text files

    - The program to run removable hardware and flash drives

    - Devices such as a hard drive or UART output


    It''s all a file that a person can read, access, delete, and modify. These files
    are stored in folders called directories, which are then stored in other directory
    folders, and so on. It''s like having a folder full of files, stuffed into another
    larger folder, stuffed into another even larger folder and so on.


    ## Visualizing the Linux Filesystem

    In the Linux Command Line section, we''ll learn about the `tree` command. For
    now, we''ll just show the output of the `tree` command.


    ![](Image00002.jpg)


    The root directory has many sub-directories. Without these files and directories,
    certain programs and bits of hardware and software would not function at all on
    the computer. Because everything is a file in Linux, it''s not uncommon for crucial
    parts of a program to be stored in separate folders.


    It can also be difficult to find a file that you''ve downloaded if you don''t
    know where to look. Let''s begin by looking at the Linux file system, what certain
    folder names represent, and where a downloaded file is likely to end up.


    | Path | Description |

    | :--- | :--- |

    | `/` | root (top level) |

    | `/bin` | binaries (applications) |

    | `/boot` | boot (startup) |

    | `/dev` | device |

    | `/etc` | system configuration |

    | `/home` | home directory |

    | `/lib` | libraries |

    | `/media` | removable mount drives |

    | `/mnt` | permanent mount drives |

    | `/opt` | optional software |

    | `/proc` | process information |

    | `/root` | root home directory |

    | `/sbin` | secure binaries |

    | `/sys` | system status |

    | `/tmp` | temporary directory |

    | `/usr` | user data |

    | `/var` | variable files (log) |


    `/var/log/mail`

    Where `mail` is a subfolder of `log` which is a subfolder of `var` which is a
    subfolder of `root`.

