  trans: '

    LAMP 代表“Linux, Apache, MySQL, PHP”。在安装期间预装这些软件包将允许你跳过配置过程中的一些步骤。你可以选择为你的项目提供桌面环境，也可以决定不需要它，并选择将其仅保持为命令行界面。运行安装过程并按照提示设置好一切。


    ### 第三步：下载

    打开你的命令行并输入：

    ![](img/Image00085.jpg)


    记住 `sudo` 可以读作“以超级用户身份执行（super user do）”，它可能是获取执行管理任务权限的一种方式，否则 Linux 会阻止你执行这些任务。请尝试逐个输入所有命令，而不是一次性全部。


    ### 第四步：输入 IP 地址

    将“ubuntu”替换为你想要为服务器使用的名称，并输入你的静态 IP 地址。如果你不知道它，请使用带有 `-i` 选项的 `hostname` 命令


    就是这样——你现在准备好将其转换为一个私有服务器，用于存储和远程访问家庭媒体文件（如图片、音乐、视频等），同时确保你的数据安全，免受云共享网站数据挖掘行为的影响。如果你愿意，可以采取额外的步骤将其转换为
    Web 托管服务器，并让人付钱让你托管他们的网站。在在此之前，你可能还想再学习一个命令。


    #### tasksel

    解释：此命令代表“任务选择（task select）”，旨在那些想要将 Ubuntu Linux 用于服务器的用户。如果你确切知道想让服务器做什么，只需运行
    `tasksel` 命令即可安装创建特定服务器所需的软件。要使用 `tasksel` 命令，请输入 `sudo tasksel`。在你设置服务器后，可能需要此命令。


    现在，去制作你的服务器吧！


    ### 进阶

    物联网，或 `IoT`，非常迷人。你可以连接无人机、无线“智能”摄像头，甚至创建小型机器人设备，它们可以向服务器发送消息告知你它们状态。你可以将 `IoT`
    技术用于许多领域，包括能够感知库存不足并向你发出订货信号的自动售卖机，消除手动检查的需求。这项技术的一个流行用途是智能摄像头。


    你可以尝试制作你自己的小型 `IoT` 项目，例如远程连接一个 `Linux` 终端来编写一个无头系统，为机器人或远程控制摄像头供电。你可能需要了解 `Python`
    并非常熟悉如何无线连接到 `Linux` 机器，因为你可能不希望你的新机器通过你必须在机器屏幕上访问的终端来接收命令。对于这个项目，你可能需要学会：


    * 使用 `Python` 编程。

    * 理解基础机器人原理。

    * 无头且无线地连接到 `Linux` 系统。


    关于更多信息，请查询一些无人机和小型机器人构建教程。你可能需要特殊的线缆和一些编程知识才能让你的作品按照你的想法运行。遗憾的是，这本书不会涵盖除基础 `Bash`
    脚本可能需要的知识之外的许多编程语言。如果你认为自己已准备好应对更大的项目，不要让这些内容让你沮馁——网络上有许多关于开启兴奋的 `AI` 世界的免费资源。你甚至可能会发现可以帮助你构建和项目的社区，它们甚至提供逐步教程。还有各种地方可以发布问题以获取社区反馈，所以如果你对此感兴趣，一定要尝试一下。


    ### 阅读建议

    这取决于你想知道什么。读完这本书后，你现在应该已经了如何操作 `Linux` 终端并输入简单命令的基础知识。通过使用教程，你可以创建一些非常棒的作品。


    如果你想进入编程领域，你需要掌握如 `Python` 这样的编程语言，并且需要更习惯在 `Bash` Shell 中输入命令。


    书中包含的练习非常基础，完全没有挑战性，但重点是让你习惯命令行。要在 `Linux` 中真正开始编程，你需要拿起你学到的少部分知识并对其加以扩展。随处寻找资源和教程，并练习编写和执行小型程序。像一个专注的学生一样努力，你将取得惊人的进展。


    记住，你已经掌握了所有的基础。现在，你只需要知道如何将这些积木组合在一起，创建更令人深刻目的程序。从慢开始，然后逐步推进。构建小型项目，直到你习惯更大的项目。


    ### 结语

    我希望你喜欢这本书，更加欣赏 `Linux`，并发现 `Linux` 命令行不再那么令畏。如果这本书对你有帮助，请考虑在 Amazon 和 Goodreads
    上给出五星好评，别忘了将这本书分享给也想学习 `Linux` 的朋友。


    '
