    # which


    The Linux `which` command can aid you in locating where your important programs
    are installed by providing the absolute path of the file. To use this command,
    type `which`, followed by the name of the program you want to find. For example,
    if you are looking for the path and directory where the executable file for the
    internet browser "Firefox" is stored, you would type `which firefox` and press
    the Enter key in the terminal.![](Image00048.jpg)


    The directory and its path should print to the screen, which should look something
    like `/usr/bin/firefox`. We can also use this to find multiple files by typing
    `which` followed by the name of each file you want to locate, separated by a space.
    For example, entering `which firefox gimp` would give you the paths and directories
    of both the Firefox internet browser and the Gimp photo editing program.


    Exercise: Use the `which` command to locate a file you created in a previous exercise,
    then write down the results in your notebook.


    # ping


    The `ping` command lets you check whether or not a remote host is responding.
    Just type in `ping`, followed by the URL of the website you are trying to reach.
    For example, if you wanted to ping Google, you would type `ping www.google.com`.


    Exercises: `ping` a website of your choice. Use the `Ctrl+c` keyboard shortcut
    to escape the loop, then record your findings.


    # Help Commands


    If you type in `man` in the terminal followed by the command you want to be described,
    you''ll get a list of uses for the command. For example, if you typed `man touch`,
    you would get a list of uses for the `touch` command. This comes in handy if you
    need to know what a command is in a pinch and don''t have time to look it up.


    Typing `man` for the manual page command will give you a lot more information
    about the command you may want to use, including syntax for executing successful
    versions of the command you want to use. You will also get information on what
    the command does.


    Exercise: Look up the `man vim` command by typing `man vim` at a command prompt.
    You should get something like below:![](Image00049.jpg)


    And the Description follows the above:![](Image00050.jpg)


    ### Further Explanation: `man` pages = manual pages


    Back when programming was just beginning, remembering a certain command syntax
    wasn''t as easy as hopping on the Internet and looking it up. Linux was created
    from Unix and computers were around before the Internet was widely available.
    It made more sense to build a list of command explanations into the system itself.


    Since this system was invented before internet access and reliable search engines
    were available, the `man` command provided the user with a convenient way to look
    up information about different commands. Today, `man` pages are still useful,
    especially if you are working in a terminal that has no GUI and is not connected
    to the internet. No matter where you are, you can still get help finding the proper
    commands and what they do.


    If you are unsure of how to use a certain command, type `man`, then the command
    that you are having trouble with a space in the middle. An explanation of the
    command and how it is to be used will show up on the screen. Type `clear` if you
    want the terminal to stop displaying the man page text.


    # help


    The `help` command functions like the `man` command and it can sometimes be used
    to find options to use with commands. The `help` command can also remind you how
    a command is supposed to be used. To use it, type the command and then `-help`.
    For instance to see the help for `cd`, type `cd -help`](Image00051.jpg)


    ## The Magic of Piping


    Let''s talk a little bit about piping, revisit `grep`, and go over the various
    options that can be used with this helpful command.


    If you''ve ever browsed a Linux help forum, you might have come across people
    talking about "piping" certain programs. It''s not a complicated process that
    only computer programmers can master; in fact, piping isn''t much more complicated
    than any other Linux command. One important aspect of Linux command lines is the
    ability to "pipe" commands. I personally consider this Linux''s greatest strength.


    The Unix philosophy is to have each program do one thing well. Piping creates
    a small chain of commands. The output from one command is used as input for the
    next. For example, if you searched for all of the `.doc` files in a certain directory,
    then directed Linux to `grep` those files to find the desired string, that would
    be an example of piping.


    Piping can be described as the process of redirecting standard output to another
    command, program, or process to be worked on further. Let''s say you want documents
    sorted, but you only want to sort the ones that have "cheese" in the title. You
    may consider using a pipe command to help you give those instructions. Let''s
    make a simple piping command. Find the `|` key on your keyboard--it is usually
    `Shift+\`. This is the symbol you will use to create a piping. Open up your terminal
    and type the following:


    ```

    ls | grep txt

    ```

    Write your findings in your notebook![](Image00052.jpg)


    Exercise: Create your own pipe and enter the command in the terminal. Write down
    your findings.Chapter Summary


    * In this chapter, we covered more advanced Linux commands, including searching
    using the `locate`, `which`, and `find` commands. We also learned about the `grep`
    command; how to find the word count, line count, number of bytes; and how to use
    wildcards.

    * We also covered other useful commands, such as zipping files, `history`, `tree`,
    `alias`, `curl`, `diff`, `cmp`, and `pinging`.

    * We also covered some helpful commands, including `man` and the help commands.


