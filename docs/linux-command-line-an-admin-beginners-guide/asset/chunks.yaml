    \ Thoughts]\n\n# CHAPTER ONE: INTRODUCTION\nIf you want to learn how to use the\
    \ operating system, but felt it was too complicated this book is for you. I'm\
    \ confident that as you read this book and practice the exercises you will be\
    \ able to develop a working knowledge of the Linux line. Once you develop a working\
    \ knowledge of the command line, you will be able to tackle more advanced projects\
    \ with confidence. Maybe you've wanted to program your own server, adapt a Linux\
    \ system for home use, or just dangle in computer programming. Whatever the reason,\
    \ you're likely to find this book helpful for your situation.\n\n## How This Book\
    \ is Organized\nYou do not necessarily need to read this book cover-to-cover if\
    \ you already understand some of the concepts. Below is a brief list of the chapters,\
    \ along with their contents:\n\n### Linux Overview\nThis chapter gives a brief\
    \ overview of the Linux operating system, how it was invented, what open-source\
    \ software means for you (the end-user), and various types of Linux and how they\
    \ may differ from each other.\n\n### Linux Shells\nThe shell provides one way\
    \ for you to communicate with your machine via a GUI or CLI. If you't familiar\
    \ with these terms or want a quick refresher, read this chapter.\n\n### Basic\
    \ File Directory\nThis chapter covers the names of basic files found in Linux\
    \ as `bin` and `root`, and what they do.\n\n### The Linux Command Line--The Basics\n\
    If you believe you are ready to jump in and start learning Linux without any preliminary\
    \ information you may skip the other chapters and start here. This chapter covers\
    \ some Linux commands including `cd` and `pwd`. This chapter also covers basic\
    \ syntax which will allow your commands to read correctly.\n\n### The Linux Command\
    \ Line--More Advanced Commands\nThis chapter contains more advanced commands,\
    \ such as `ping`, `tar`, and `locate`.\n\n### Linux System and User Management\n\
    Learn how Linux manages users and protects its important files by only granting\
    \ access to users with the proper permissions.\n\n### Understanding Linux Security\n\
    Even though's open-source, Linux is one of the most secure operating systems available.\
    \ Learn why and how to keep it that way in this chapter.\n\n### Suggestions for\
    \ Continued Learning\nOnce you've gotten the basics down maybe you would like\
    \ some suggestions on what to learn next. This chapter will give you ideas on\
    \ how you can continue learning about Linux.\n\n# CHAPTER TWO: Linux Overview\n\
    ### What is Linux?\nLinux is an operating system or OS. It is defined by Wikipedia\
    \ (https://en.wikipedia.org/wiki/Operating_system) as follows: An operating system\
    \ (OS) is system software that manages computer hardware, software resources,\
    \ and provides common services for computer programs.\n\nThink of the operating\
    \ system as a body with the Linux kernel as the brain. The brain uses arms, legs,\
    \ fingers, toes, etc (computer hardware) when needed. The brain plans out when\
    \ to take lunch and other activities (software resources) during the day. Think\
    \ of software resources as actions such as waking up, brushing teeth, and going\
    \ to work. The brain also provides common functions needed for living such as\
    \ breathing, heartbeat, decision making, etc. The Linux kernel needs to perform\
    \ these common services such as incrementing the internal clock, etc.\n\nThe computer\
    \ hardware can be thought of as the mouse and keyboard and video display. The\
    \ operating system manages the input from the keyboard and mouse and displays\
    \ the output on the screen. A software resource such as Word or the app running\
    \ on a Kindle just sends what it wants to display to the operating system. The\
    \ OS manages the hardware that changes the pixels to make the picture on the display.\
    \ The OS also gives each running program a piece of time to run otherwise only\
    \ 1 program could run at a time. Can you imagine only being able to check the\
    \ internet, then shutting Firefox down so that you could check email, then closing\
    \ that to open the calendar app?\n\n### Why Use Linux?\nYou may have noticed the\
    \ popularity of the Linux Operating System (or Linux OS) in webserver work and\
    \ other backend computer functions. It has a reputation for being dependable and\
    \ having long uptime which means it doesn't crash often or require frequent reboots.\
    \ A typical website may be running on a Linux Operating System that has continued\
    \ to run uninterrupted for months or years without a restart.\n\nLinux is one\
    \ of the most secure, robust, and user-friendly free open-source operating systems\
    \ available. The Linux OS can easily compete with Microsoft's and Apple's in terms\
    \ of features, which is truly impressive for free maintained by a population of\
    \ volunteers.\n\n### What is open source?\nOpen-source means that anyone can download\
    \ and look at the computer code that runs Linux and build it to their own version.\
    \ Because Linux is open-source there is an entire ecosystem of volunteers that\
    \ are constantly fixing and adding features to Linux. There are paid versions\
    \ of the Linux that offer technical support for a fee. Many corporations use these\
    \ to keep their servers running smoothly. The operating system also has applications\
    \ for home use. However one disadvantage Linux has compared to Windows and Apple\
    \ is that popular tools like Excel are not supported on Linux although there are\
    \ good alternatives as LibreOffice or Google Docs.\n\nCertain chapters in this\
    \ book contain a lot of dense information. It is highly recommended that you read\
    \ these chapters with a pen and paper in hand and also have access to a computer\
    \ where you can practice and get comfortable with the commands. The purpose of\
    \ this book is to help you get comfortable with the Linux command line so you\
    \ can more confidently use Linux's most powerful features. It is not a casual\
    \ read, but rather, a beginner's instruction to the basics of the Linux command\
    \ line.\n\n# CHAPTER THREE: Linux Shells\n... (remaining text follows same pattern)\n\
    ...\nFor home use or programming practice, it is probably best to use Ubuntu.\
    \ It's fairly stable and comes with a lot of features out-of-the-box, including\
    \ a fully functional desktop environment and package manager that makes it easy.\
    \ Because of its familiarity, it might not be a bad distro to try. It is also\
    \ a widely used version of Linux with lots of support. If you run into problems\
    \ a problem has probably answered by a lot of the people who keep Linux running.\
    \ \n\nIt's important to keep these things in mind if you are working with a Linux\
    \ system. Rather than a product mass-produced by the commercial industry, certain\
    \ distributions of the Linux operating system are comparable to a carefully crafted\
    \ homemade product. It may take some tinkering to get them to work the way you\
    \ want and you could choose a version by mistake that isn't made to do what you\
    \ want it to do\n"
