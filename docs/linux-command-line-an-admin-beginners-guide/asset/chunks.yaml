    \ background. They have limited access to the system, enough so they can perform\
    \ their tasks with minimal human interference.\n\nAssigning these programs group\
    \ IDs and privileges controlled by the administrator is one way Linux keeps the\
    \ system safe from malicious software and unruly programs. Contrast this to a\
    \ Windows system, in which an installed program is typically given admin. \n\n\
    To add a system user, type `adduser --system` and the username. System users are\
    \ accounts created when certain programs are installed and they perform certain\
    \ jobs and run certain processes. They typically don't belong to actual human\
    \ users, but instead to programs that run in the background. They have limited\
    \ access to the system, enough so they can perform their tasks with minimal human\
    \ interference.\n\n### Forcing New Password\nTo force a user to change their password,\
    \ use `passwd --e <username>`. This will force the user to change their password\
    \ upon next login.\n\n### Assigning Group IDs\nTo assign a program group ID, use\
    \ `usermod -g <groupname> <username>`. This allows the user to belong to a specific\
    \ group.![](Image0062.jpg)\n\n### User Information\nThe `w` command shows information\
    \ about users who are currently logged on to the system, including what they are\
    \ doing. This potentially comes in handy if you want to check employee productivity\
    \ or if you want to check which employee is running a task that puts a heavy load\
    \ on the system memory. If you work in IT, this command may be especially helpful\
    \ for you because it may prevent you from working on the machine or installing\
    \ programs during times where employee workloads are already putting a strain\
    \ on the memory of the machine.\n\n## whoami\nThe `whoami` command quickly shows\
    \ you which username and account you are logged in as. This may prove helpful\
    \ if you are not sure what permissions your user account has and what commands\
    \ you have the authority to run. It could also help you if you are logging yourself\
    \ into different accounts with different permissions while testing features on\
    \ the system. To use this command, type `whoami` into the terminal and press Enter.\
    \ You should see a readout with your username.![](Image00056.jpg)\n\n## hostname\n\
    You can use the `hostname` command to find out the name of the host. (repeated\
    \ content removed)\n\n## uname\nThis will give you a printout of information about\
    \ the operating system and the machine it is installed on. Use the `-a` option\
    \ to see all the kernel information including build date kernel version info.![](Image00058.jpg)\n\
    \n## Typical User Management Commands\nThe root user has administrative privileges,\
    \ which means that the user with access to the root account can do nearly anything\
    \ in the system, even bypassing security checks for normal users without the root\
    \ privilege. (repeated content removed)\n\n## quota\nWithout a set data quota,\
    \ users on a network could hog all the resources for themselves. (repeated content\
    \ removed)\n\n## Editing Quotas\nIf you want to change the quota of a user or\
    \ group, you can use the `edquota` command...Administrators, IT professionals,\
    \ and anyone else who happens to have access to the root account have to make\
    \ sure they enter the correct commands and know what they are doing to keep from\
    \ accidentally deleting sensitive data or rendering programs non-functional. (repeated\
    \ content removed)\n\n## passwd\nAs mentioned previously, users with administrative\
    \ privileges can do a lot with Linux if they know how. (repeated content removed)\n\
    \n## chage\nThe `chage` command can be used in Linux to force a user to change\
    \ a password by typing `chage -d 0 <username>`. (repeated content removed)\n\n\
    ## adduser\nThe `adduser` command can be used to create and add new users. (repeated\
    \ content removed)\n\n## userdel\nIf you accidentally create an extra user, need\
    \ to get rid of a test user account, or need to get rid of a user account for\
    \ other reasons, you can do so with the `userdel` command. (repeated content removed)\n\
    \n## usermod\nAnother powerful command you might find yourself needing is `usermod`.\
    \ (repeated content removed)\n\n## Chapter Summary\nIn this chapter, we went over:\n"
