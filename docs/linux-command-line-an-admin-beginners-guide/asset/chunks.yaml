    file you typed in. If you want to use `curl` to view the content of a website,
    type `curl [site whose file content you want to view]`. The result should be the
    HTTP source code.


    To upload a file, you can type `curl [file] [upload address]`. For example, if
    I wanted to upload a file called `"photos"` to a local server called `"server"`,
    I might type.


