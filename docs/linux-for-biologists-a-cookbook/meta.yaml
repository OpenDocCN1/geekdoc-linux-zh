  md: '# **5** Getting started with Galaxy


    The Galaxy<sup>32</sup> project enables researchers to perform computational analyses
    using a web interface.


    You can use the service online at http://usegalaxy.org/ or any of the other available
    public servers<sup>33</sup>.


    The software powering the servers itself, is available under an open-source licence.
    You can download it and set up a local instance on your computer.


    +   32 https://galaxyproject.org/

    33 https://galaxyproject.org/use/'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# ## 5.1 Why use Galaxy?


    These are *some* advantages of using Galaxy.


    You can:


    +   - **Upload your data** — and perform analysis using a *web interface*.

    - **Use included tools** — or install additional ones from the Galaxy tool shed
    (needs a *local instance*).

    - **Use history** — functionality to keeps track of the jobs¹ you run. This gives
    you the possibility to run them again at a later time (reproducibility).

    - **Create workflows** — by combining multiple tools. The output of one tool can
    be used as input for another.

    - **Share your data** — with other users. This includes histories, workflows etc.,


    > ¹ Commands run with additional arguments, if any, along with input and output
    file paths.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 5.1.1 What can you use Galaxy for?


    These are some tasks you can accomplish using Galaxy:


    +   - Get data from various sources (databases)

    - Manipulate text data

    - Convert between file formats

    - Statistics

    - Sort and filter data


    > **Note:** The *exercise* in *Using the Linux command line* chapter, can be reproduced
    using Galaxy, without the need to use the command line or install software.


    You only need your input data — query sequence and the protein sequence database.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# 5.1.2 Why run Galaxy on your computer?


    Running Galaxy on your computer i.e., a *local instance*, has some advantages:


    +   - **Data storage is local** — on your computer, whereas, if you use a public
    instance, it will be stored on a server, possibly unencrypted$^2$.


    +   - **Access more tools** — that are not installed on public servers by installing
    them on your local instance.


    +   - **CPU and storage limits** — are dependent on your computer, whereas on
    public servers, there are limits on CPU and storage usage per user$^2$.


    > $^2$ This is the case on https://usegalaxy.org — the main Galaxy instance. For
    more information, please read the https://galaxyproject.org/main/#user-data-and-job-quotas.'
  merge: -1
  pgno: 244
