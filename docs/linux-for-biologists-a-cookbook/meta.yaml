    ## 6.2.5 Exporting notes and notebooks

    To export the notebook or a page, select:

    ```

    File → Export

    ```

    In the dialog window that appears, select the desired option and click on the
    Forward button (Fig. 121).

    ![](img/5d1416436999bb5232d6af690a9da18a_301_0.png)

    In the next screen, you can select the format of the exported notebook or page
    in the **Format** drop-down box (Fig. 122).

    ![](img/5d1416436999bb5232d6af690a9da18a_302_0.png)

    Fig. 122: Select an export format

    You can leave it at the default — HTML. Click on the **Forward** button to proceed.

    In the final screen, select a directory to save the exported notebook or page.

    > **Note:** If you are using the defaults, it is a good idea to create a new output
    directory and select it under **Output folder**.

    Click on the **OK** button to complete export.

    ![](img/5d1416436999bb5232d6af690a9da18a_303_0.png)

    Fig. 123: Select an output folder

    When complete, open the output directory in file manager.

    *Double-click* on *Home.html* to open it in the browser (Fig. 124).

    ![](img/5d1416436999bb5232d6af690a9da18a_304_0.png)

    Fig. 124: Viewing exported notebook


    ## 6.2.6 Activating more features using plugins

    These are some plugins included with Zim:

    - **Insert Symbol** — insert special symbols and characters

    - **Table of Contents** — adds a widget displaying the current page''s table of
    contents

    - **Tags** — add tags to your notes

    - **Tray Icon** — adds an icon to system tray for quick access to your notebooks

    - **Spell Checker** — adds support for checking spelling

    You will need to activate (or enable) them in preferences, before you can start
    using them.


    ### Enabling a plugin

    To enable a plugin:

    1. Select `Edit → Preferences`

    2. Click on the Plugins tab

    3. Check the box corresponding to the plugin you wish to enable (Fig. 125)

    4. Click on the OK button

    ![](img/5d1416436999bb5232d6af690a9da18a_306_0.png)

    *Fig. 125: Enabling plugins*

    > **Note:** *Some plugins have additional options.* Click on the **Configure**
    button below the plugin description to access these options.


    ## 6.2.7 Getting help

    Zim includes a detailed user manual. You can access this by selecting (Fig. 126):

    `Help → Contents`

    ![](img/5d1416436999bb5232d6af690a9da18a_307_0.png)

    **Fig. 126: Help on using Zim**


    ## Glossary

    ### **Anaconda**

    A free and open-source (Anaconda Individual Edition) Python and R distribution.
    It includes *Conda* and more than 250 open-source scientific packages. Additional
    packages can be installed from *Anaconda Cloud* repositories. Website: https://anaconda.com/products/individual


    ### **Anaconda Cloud**

    Repository for Python and R packages and notebooks. Website: https://anaconda.org


    ### **apt**

    A command-line program that handles the installation and removal of software on
    Debian, Ubuntu and other Linux distributions. Related section: → The command-line
    version (*apt*)


    ### **bioconda**

    A channel for *Conda* package manager with over 7000 packages of bioinformatics
    software. Website: https://bioconda.github.io/


    ### **build-essential**

    A package that installs software build tools like make and compilers like gcc,
    which are required for building modules written in languages like C.


    ### **Bash**

    *GNU* project''s shell program. The name stands for The Bourne-Again Shell. It
    is the most commonly used shell in Linux distributions. Website: https://www.gnu.org/software/bash/


    ### **Bioconductor**

    Tools written in the R programming language for the analysis and comprehension
    of high-throughput genomic data. Website: https://www.bioconductor.org/


    ### **BiocManager**

    An R package to install and update packages from the *Bioconductor* project repository.
    Website: https://cran.r-project.org/package=BiocManager


    ### **BioPython**

    Python tools for computational molecular biology. Website: http://biopython.org/


    ### **Bio::Phylo**

    Perl package for phylogenetic analysis. Website: https://metacpan.org/pod/Bio::Phylo


    ### **commands**

    Also called as binaries or executables.


    ### **Conda**

    Conda is a package and environment manager. As a *package manager*, it can be
    used to install software from *Anaconda Cloud*. Software *dependencies* will be
    installed automatically. As an *environment manager*, it can be used to create
    and manage environments containing different sets of packages. You can activate
    and use these environments as necessary.


    ### **cpanminus**

    A Perl script to get, build and install modules from *CPAN*. It provides the `cpanm`
    command. Website: https://metacpan.org/pod/App::cpanminus


    ### **cutadapt**

    A Python program that finds and removes adapter sequences, primers, poly-A tails
    and other unwanted sequences from high-throughput sequencing reads. Website: https://cutadapt.readthedocs.io


    ### **CPAN**

    Abbreviation for Comprehensive Perl Archive Network. It provides additional Perl
    modules for installation (196,752 as of Dec 2020). Website: https://www.cpan.org/


    ### **CRAN**

    Abbreviation for Comprehensive R Archive Network. A network of FTP and web servers
    providing up-to-date versions of R, packages and documentation. Website: https://cran.r-project.org/


    ### **Debian**

    A Linux distribution made of free and open source software. It is free for anyone
    to download, use, modify and distribute. Website: https://www.debian.org/


    ### **Debian package**

    An archive of executable files, libraries, and documentation of software. It can
    be installed on Debian Linux and Debian-based systems like Ubuntu and Linux Mint.
    These files have the .deb file extension.


    ### **dependencies**

    Additional programs or libraries that are needed for a program to work.


    ### **edgeR**

    An R package for empirical analysis of digital gene expression data. It is available
    from the *Bioconductor* project repository. Website: https://www.bioconductor.org/packages/edgeR/


    ### **FAST**

    Abbreviation for FAST Analysis of Sequences Toolbox. A set of utilities written
    in Perl that extend the UNIX paradigm to bioinformatic sequence records. Website:
    https://metacpan.org/pod/FAST


    ### **Files**

    The default file manager in *Linux Mint* Cinnamon edition. Its original name is
    Nemo.


    ### **gdebi**

    A simple tool to install *Debian package* files along with their *dependencies*
    (if any). Website: https://launchpad.net/gdebi


    ### **GNU**

    GNU is a recursive acronym for GNU''s Not Unix. The goal of the project is to
    offer a Unix-compatible system that would be 100% free software. Website: https://www.gnu.org/


    ### **GUI**

    Abbreviation for graphical user interface. On a personal computer, it typically
    includes application windows with buttons to access their functions, icons for
    launching applications and widgets for managing devices and services.


    ### **IDE**

    Abbreviation for integrated development environment. Some examples include PyCharm,
    RStudio and *Eclipse*.


    ### **local-lib**

    A Perl module to create a local directory structure to install modules with their
    *dependencies* without requiring administrator privileges. Website: https://metacpan.org/pod/local::lib


    ### **Linux Mint**

    A desktop Linux distribution. It is based on *Debian* and *Ubuntu*. Website: https://linuxmint.com/


    ### **MEGA**

    Software for Molecular Evolutionary Genetics Analysis. Available as *GUI* and
    command-line versions. Website: https://megasoftware.net/


    ### **MetaCPAN**

    A search engine for Perl packages and modules available on *CPAN*. Website: https://metacpan.org/


    ### **Miniconda**

    A minimal distribution of *Conda*. It is faster to install and also uses less
    disk space, when compared to *Anaconda* — the alternative installer which comes
    bundled with additional packages. Website: https://docs.conda.io/en/latest/miniconda.html


    ### **Modeller**

    A program for comparative protein structure modelling by satisfaction of spatial
    restraints. Website: https://salilab.org/modeller/


    ### **nano**

    A simple command-line based text editor. Website: https://www.nano-editor.org/


    ### **OVA**

    A file format for distributing virtual machine images.


    ### **pip**

    The Python package installer. It can be used to install packages from *PyPI* and
    other Python package indexes. Website: https://pip.pypa.io/


    ### **PyMOL**

    PyMOL is a molecular visualization system originally developed by Warren L. Delano.
    It is currently maintained by Schrödinger, Inc. Website: https://pymol.org/2/


    ### **PyPI**

    Abbreviation for Python Package Index. Repository for software written in Python
    (275,161 projects as of Dec 2020). Website: https://pypi.org/


    ### **root**

    The primary administrator account on a Linux system.


    ### **R**

    Programming language and free software environment for statistical computing and
    graphics. Website: https://r-project.org


    ### **RStudio Desktop**

    An *IDE* for *R*. It includes an R console, an editor with syntax-highlighting
    and tools for plotting, debugging.'
