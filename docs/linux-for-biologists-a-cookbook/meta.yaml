    ## 2.4.5 Terminal — access the command-line

    The Terminal application (Fig. 28) provides the possibility of working with the
    command-line interface. The default login shell for users on Linux Mint is *Bash*.


    ![](img/5d1416436999bb5232d6af690a9da18a_59_0.png)


    Fig. 28: Terminal


    By selecting the Edit → Preferences menu item, you can customize Terminal''s appearance
    and functionality (Fig. 29).


    ![](img/5d1416436999bb5232d6af690a9da18a_60_0.png)


    > Fig. 29: Changing Terminal colour scheme in preferences


    ## 2.4.6 Screenshot — take screenshots of desktop or windows

    The Screenshot program is useful for taking screenshots of the entire screen,
    an application window or a selected area of the screen (Fig. 30).


    ![](img/5d1416436999bb5232d6af690a9da18a_61_0.png)


    > Fig. 30: Screenshot program


    ## **2.4.7 Software Manager — install software from repositories**

    Software Manager can be used to install software from Linux Mint, Ubuntu, Debian
    and Flathub repositories (Fig. 31). For a step-by-step procedure for installing
    software using Software Manager, please consult *The quick and easy method*.


    ![](img/5d1416436999bb5232d6af690a9da18a_62_0.png)


    > Fig. 31: Software Manager


    ## **2.4.8** GNU Image Manipulation Program — edit images

    The GIMP program can be used to edit images in various formats like JPG, PNG,
    TIFF, BMP etc., (Fig. 32).


    ![](img/5d1416436999bb5232d6af690a9da18a_63_0.png)


    **Fig. 32:** Editing an image in GIMP


    ## **2.4.9 Inkscape — create vector graphics**

    Inkscape can be used to create and edit images in the scalable vector graphics
    (SVG) format (Fig. 33).


    ![](img/5d1416436999bb5232d6af690a9da18a_64_0.png)


    Fig. 33: Creating vector graphics in Inkscape


    ## 2.4.10 Notes

    ### Adding an application to favourites

    If you use an application frequently, you can consider adding it to favourites.
    This list is on the left side of the applications'' menu. To favourite an application,
    right-click on the application name in applications menu and select **Add to favorites**.
    Alternatively, you can choose the **Add to panel** action, which will add the
    application to your Panel. Some applications are visible in the Panel by default
    — a Show Desktop applet, Firefox browser, Terminal, and Files.


    ### Setting default applications

    If you would like to set default applications for certain categories or file types,
    you can do so in System Settings under:

    - Preferences → Preferred applications


    ## 2.5 Files and directories

    This section includes an introduction to your home directory, files, directories,
    and their functions, the root filesystem and a how-to on transferring files between
    systems.


    ### 2.5.1 Your home directory

    When you log in to the desktop and open *Files*, it will display your home directory
    ([Fig. 34]). The following directories will be present in your home directory
    by default: Desktop, Documents, Downloads, Music, Pictures, Public, Templates,
    and Videos.


    ![](img/5d1416436999bb5232d6af690a9da18a_67_0.png)


    Fig. 34: Home directory


    #### Notes

    ##### /home/user

    The complete (or absolute) path to your home directory will be of the form /home/user,
    where user is your username on the system.


    ##### $HOME

    The HOME environment variable will automatically be set to the complete path to
    your home directory in the filesystem. Hence, you can substitute /home/user with
    $HOME in your commands or scripts.


    ### 2.5.2 Hidden files and directories

    In addition to the default directories mentioned earlier, there are hidden files
    and directories in home directory (Fig. 35). They have a dot (.) character at
    the beginning of their file name.


    ![](img/5d1416436999bb5223232d6af690a9da18a_69_0.png)


    Fig. 35: Hidden files and directories in home directory


    You can view (or hide) these files using the following menu entry in file manager:
    View → Show Hidden Files

    Alternatively, you can use the `Ctrl + h` keyboard shortcut.


    ### 2.5.3 Important files in home directory

    ```.bashrc

    ```

    This is the configuration file used by Bash, the default shell for user accounts.
    You will mostly use this file, when you need to set or modify environment variables
    like PATH.

    ```.bash_aliases

    ```

    You can use the .bash_aliases file to set aliases for commands. For example, here
    is a commonly used alias:

    ```bash

    alias l=''ls -l''

    ```

    This means when you type l at the command-line, the bash shell will execute `ls
    -l`, which will output a long listing of files, instead of the default.


    > **Note:** To learn more about the `ls` command, read the [ls — list files](#)
    section.


    ### **2.5.4 File and directory names are case-sensitive**

    One thing you will need to remember is that file and directory names in Linux
    are case-sensitive. For example, a file named:

    ```sequence.txt

    ```

    is different from:

    ```Sequence.txt

    ```

    Similarly, Documents and documents are two different directories. Both these files
    or directories mentioned above, can exist in the same directory and can have different
    contents.


    ### 2.5.5 Accessing the root filesystem

    To access the root filesystem (/), click on File System in the sidebar of file
    manager (Fig. 36).


    ![](img/5d1416436999bb5232d6af690a9da18a_72_0.png)


    Fig. 36: Click on File System entry to access the root filesystem


    #### Directories under / and their functions

    - `/etc` — stores configuration files of applications

    - `/home` — contains home directories of users

    - `/media` — locations where devices like external disks will be mounted i.e.,
    made available

    - `/root` — home directory of root user (administrator)

    - `/tmp` — temporary files created by applications

    - `/usr` — applications and libraries are installed here along with their data
    and documentation

    - `/var` — storage for log files, application cache, databases etc.,


    #### Root file system and root home directory are different

    `/` is the root filesystem

    All users on the system can access files and directories here, provided they have
    the appropriate permissions.


    #### `/root` is home directory of root

    Only root will have access to it.


    ### **2.5.6 Transferring files between systems**

    One useful feature of Files is the ability to connect to remote systems using
    protocols like SSH, FTP, SMB and Webdav. Once connected, you can transfer files
    from your Linux desktop to the remote system or *vice-versa*. To connect to a
    remote system, use the following menu entry in Files (Fig. 37):

    File → Connect to Server


    ![](img/5d1416436999bb5232d6af690a9da18a_74_0.png)


    Fig. 37: Connect to Server option in Files


    ##### Connecting to an SSH server

    Open File → Connect to Server and follow the steps below (Fig. 38):

    1. In the field corresponding to **Server**, enter the domain name or IP address
    of the server you are connecting to

    2. Port 22 is the default for SSH, so you do not need to change that usually

    3. From the **Type** drop-down box, select SSH

    4. Under **Folder**, you can specify a directory (optional) to open, once connection
    is successful

    5. Enter the username and password of your account on the *server*

    6. Click on the **Connect** button


    ![](img/5d1416436999bb5232d6af690a9da18a_76_0.png)


    **Fig. 38: Connecting to an SSH server**


    Once the remote directory is open in *Files*, you can start transferring files
    from your desktop or *vice-versa*.


    ## 3 Getting software on Linux

    In this section, I will discuss how you can get software on your Linux desktop.
    For any software you would like to install, you can start with the *quick and
    easy* method. It will install software available in Linux distribution repositories.
    If your software of interest is not available or if you need a different version,
    you can consider using the other methods.


    ## 3.1 The quick and easy method

    The *quick and easy* method is to use *Software Manager*, to search and install
    software on your desktop. It supports installing software from Linux Mint, Debian
    and Flathub repositories. Examples of software that can be installed using this
    method:

    - **Circo**<sup>10</sup> — plotter for visualizing data.

    - **Clustal Omega**<sup>11</sup> — general purpose multiple sequence alignment
    program for nucleotide and protein sequences.

    - **EMBOSS**<sup>12</sup> — European molecular biology open software suite.

    - **NCBI BLAST+**<sup>13</sup> — next generation suite of BLAST sequence search
    tools.

    - **Bioconductor**<sup>14</sup> — tools for the analysis and comprehension of
    high-throughput genomic data.

    - **CD-HIT**<sup>15</sup> — suite of programs designed to quickly group sequences.

    - **UGENE**<sup>16</sup> — integrated bioinformatics toolkit.


    <sup>10</sup> https://circos.ca

    <sup>11</sup> https://www.clustal.org/omega

    <sup>12</sup> https://emboss.sourceforge.net

    <sup>13</sup> https://blast.ncbi.nlm.nih.gov/Blast.cgi

    <sup>14</sup> https://www.bioconductor.org

    <sup>15</sup> http://weizhongli-lab.org/cd-hit/

    <sup>16</sup> http://ugene.net/'
