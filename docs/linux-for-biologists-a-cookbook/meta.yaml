    # ## 3.1 The quick and easy method


    The *quick and easy* method is to use *Software Manager*, to search and install
    software on your desktop. It supports installing software from Linux Mint, Debian
    and Flathub repositories.


    Examples of software that can be installed using this method:


    +   - **Circo**<sup>10</sup> — plotter for visualizing data.

