- img_proc: true
  md: '# **2.5.3 Important files in home directory**


    ```

    .bashrc

    ```


    This is the configuration file used by Bash, the default shell for user accounts.
    You will mostly use this file, when you need to set or modify environment variables
    like PATH.


    ```

    .bash_aliases

    ```


    You can use the .bash_aliases file to set aliases for commands.


    For example, here is a commonly used alias:


    ```

    ```

    alias l=''ls -l''

    ```

    ```


    This means when you type l at the command-line, the bash shell will execute `ls
    -l`, which will output a long listing of files, instead of the default.


    > > **Note:** To learn more about the `ls` command, read the [ls — list files](#)
    section.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# **2.5.4 File and directory names are case-sensitive**


    One thing you will need to remember is that file and directory names in Linux
    are case-sensitive.


    For example, a file named:


    ```

    sequence.txt

    ```


    is different from:


    ```

    Sequence.txt

    ```


    Similarly, Documents and documents are two different directories.


    Both these files or directories mentioned above, can exist in the same directory
    and can have different contents.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# ### 2.5.5 Accessing the root filesystem


    To access the root filesystem (/), click on File System in the sidebar of file
    manager (Fig. 36).


    ![](img/5d1416436999bb5232d6af690a9da18a_72_0.png)


    Fig. 36: Click on File System entry to access the root filesystem


    # **Directories under / and their functions**


    +   - `/etc` — stores configuration files of applications


    - `/home` — contains home directories of users


    - `/media` — locations where devices like external disks will be mounted i.e.,
    made available


    - `/root` — home directory of root user (administrator)'
  merge: -1
  pgno: 72
- img_proc: true
  md: '+   - `` `/tmp` `` — temporary files created by applications

    - `` `/usr` `` — applications and libraries are installed here along with their
    data and documentation

    - `` `/var` `` — storage for log files, application cache, databases etc.,


    # **Root file system and root home directory are different**


    `` `/` `` is the root filesystem


    All users on the system can access files and directories here, provided they have
    the appropriate permissions.


    # **`/root` is home directory of root**


    Only root will have access to it.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# **2.5.6 Transferring files between systems**


    One useful feature of Files is the ability to connect to remote systems using
    protocols like SSH, FTP, SMB and Webdav. Once connected, you can transfer files
    from your Linux desktop to the remote system or *vice-versa*.


    To connect to a remote system, use the following menu entry in Files (Fig. 37):


    File → Connect to Server


    ![](img/5d1416436999bb5232d6af690a9da18a_74_0.png)


    # Fig. 37: Connect to Server option in Files'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Connecting to an SSH server


    Open File → Connect to Server and follow the steps below (Fig. 38):


    +   1. In the field corresponding to **Server**, enter the domain name or IP address
    of the server you are connecting to


    2. Port 22 is the default for SSH, so you do not need to change that usually


    3. From the **Type** drop-down box, select SSH


    4. Under **Folder**, you can specify a directory (optional) to open, once connection
    is successful


    5. Enter the username and password of your account on the

    *server*


    6. Click on the ** Connect ** button'
  merge: -1
