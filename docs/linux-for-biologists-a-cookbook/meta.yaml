  mdcn: "\n**RStudio** 是用于安装和管理R包的工具。其开源版本可从项目官网免费下载。官网地址：https://rstudio.com/products/rstudio/download/\n\
    相关章节：\n- 安装Debian软件包\n**setuptools** 用于构建和安装Python包的Python工具。\n**shell** 为操作系统服务提供命令行界面（CLI）。\n\
    **软件管理器** Linux Mint默认的*图形用户界面*应用程序，用于在Linux Mint上安装软件。其他Linux发行版也有功能相似的应用程序，例如：\n\
    - Ubuntu上的**Ubuntu Software**\n- Fedora和其他基于GNOME的发行版上的**Software**\n- Kubuntu和其他基于KDE的发行版上的**Discover**\n\
    相关章节：\n- 快速简便的方法\n**Synaptic** 适用于使用apt的系统的*图形用户界面*包管理器。官网地址：https://www.nongnu.org/synaptic/\n\
    **文本编辑器** 用于编辑文本文件的程序。\n## 生物学家的Linux指南\n### 示例（*图形用户界面*）\n- Linux Mint上的文本编辑器（xed）、Ubuntu上的文本编辑器（gedit）、KDE\
    \ Plasma上的Kwrite、Geany等。\n### 示例（命令行）\n- *nano*、VIM或vi、GNU Emacs等。\n相关章节：\n- [文本编辑器\
    \ — 创建并编辑文本文件]()\n- [使用nano编辑文本文件]()\n**Ubuntu** 由Canonical和开发者社区开发的Linux发行版，基于*Debian*。官网地址：https://ubuntu.com/\n\
    **wheel** 用于安装以Python wheel（.whl）格式分发的Python包的Python工具。\n全局索引\n## 8 致谢\n本书在Linux系统上使用开源软件制作。所用字体和图片均遵循开源许可或属于公共领域。\n\
    ### 使用的软件\n- Linux Mint — https://linuxmint.com\n- Sphinx — https://www.sphinx-doc.org/en/master/\n\
    - sphinx-autobuild 扩展 — https://github.com/executablebooks/sphinx-autobuild\n\
    - 用于生成PDF的LaTeX — https://www.latex-project.org/\n- 用于编辑文本的GNOME Builder — https://wiki.gnome.org/Apps/Builder\n\
    - 用于预览HTML的Firefox — https://www.mozilla.org/en-GB/firefox/\n- 用于将HTML转换为ODT的Pandoc\
    \ — https://pandoc.org/\n- 用于校对润色的LibreOffice — https://www.libreoffice.org/\n\
