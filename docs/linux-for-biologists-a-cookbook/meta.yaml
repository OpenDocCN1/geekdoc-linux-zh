  md: '# ## 3.2.7 Python virtual environments


    A virtual environment is a *self-contained* directory tree containing Python and
    some additional packages.


    # ### Advantages


    These are *some* advantages of using virtual environments.


    # ### No administrator privileges


    You do not need administrator privileges to create a virtual environment or install
    packages in an environment.


    # ### Multiple environments


    Multiple virtual environments can be created with each containing their own sets
    of packages.


    These are isolated and packages in an environment can be installed, updated or
    removed without affecting other environments.


    # ### Share your environment


    You can share your configuration with others. They will be able to reproduce your
    environment, with the exact versions of packages.


    # ## 3.2. Python packages'
