  md: '# 1.3.2 Administrator privileges


    The software installation steps in this book will need administra-tor privileges.
    In the default configuration, only root or mem-bers of the sudo user group will
    be able to install software on a Linux system.


    Note: If you are using the virtual machine, distributed with this book, you do
    not need to do anything.


