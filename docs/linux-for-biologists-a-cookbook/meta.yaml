  md: '# 3.2.8 Notes


    **You will need to update these packages manually**


    Packages installed in this manner should also be updated manually.


    When you notice there is an update for the package, for example, from the project''s
    website or from their source code repository, follow the steps in Updating an
    installed package to install the latest version.


    **Why pip3 and not pip?**


    The `pip` package includes the following commands:


    +   - `pip3` — Python 3 version

    - `pip2` — Python 2 version


    *Support for Python 2 ended in January 2020.*


    Since there is a possibility for both commands to exist on a system, it is safer
    to use `pip3` when installing packages using this method.


    **What about programs written in Python 2?**


    *Support for Python 2 ended in January 2020.*


    If you do need to use a program written only in Python 2, you can create an isolated
    environment — either using Python venv or Conda and then install the package there.'
