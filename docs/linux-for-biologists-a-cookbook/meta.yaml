    ## About this book

    The target audience for this book, what you will need to follow the included recipes
    and a note on the author.


    ### 1.1 Who is it for?

    If you are a student or a researcher in biological sciences and are new to Linux,
    this book will help you get started quickly. The primary focus is in using graphical
    user interfaces (GUIs) to accomplish tasks, but I have also included methods using
    the command line interface.


    ### 1.2 What you will learn

    Using the included recipes, you will learn how to:

    - Run Linux on your computer

    - Use the desktop and included software

    - Work with files and directories

    - Search and install software

    - Run some basic commands

    - Run the Galaxy platform on your computer


    > **Note:** *If you need help while following this book...* You can visit the
    forums of this book on Leanpub. If your query is not answered there, please start
    a new discussion.

    > https://community.leanpub.com/c/linuxforbiologi


    ### 1.3 What you will need

    To follow the recipes in this book, you will need:

    1. A Linux desktop

    2. Administrator privileges


    ### 1.3.1 Linux desktop

    The Linux and open-source world is full of choice. There are different versions
    (or distributions) of Linux that are available for download and use. To ensure
    that you can follow this book successfully, *Linux Mint 20.1* is used as a *reference*
    distribution. All the included recipes have been tested on this distribution.


    ### **Virtual machine image**

    If you do not have access to a Linux desktop, you can download a virtual machine
    from the website of this book and use it to run a virtual machine on your computer
    ([Fig. 1]).

    ![](img/5d1416436999bb5232d6af690a9da18a_19_0.png)

    **Fig. 1:** Linux Mint running in VirtualBox


    Follow the steps in *Running a Linux virtual machine* to get started.


    ### What about other Linux distributions?

    Although most of the recipes will work on other Linux distributions, you will
    need to make changes in some cases. For example, the applications you use might
    be different — instead of the *Files* file manager used here, you might use Nautilus
    or Dolphin. If there are problems, I recommend you download and use the *virtual
    machine*.


    ### 1.3.2 Administrator privileges

    The software installation steps in this book will need administrator privileges.
    In the default configuration, only root or members of the sudo user group will
    be able to install software on a Linux system.


    > **Note:** If you are using the virtual machine distributed with this book, you
    do not need to do anything. If you are not using the virtual machine, you will
    need to ensure your user account is part of the sudo group, to be able to install
    software.


    ### 1.4 About the author

    Hello. I''m Vimal. I got introduced to Linux and open source software while pursuing
    my Master''s degree in Biotechnology at Madurai Kamaraj University, India.

    ![](img/5d1416436999bb5232d6af690a9da18a_22_0.png)

    The idea of being able to use and modify software without restrictions was new
    and exciting to me. I learnt to install Linux, compile software from source code
    and even create my own Linux live CD! This experience became valuable in academia,
    where I worked primarily in research support for a period of over 9 years. During
    this time, I had installed and managed Linux servers, databases, web applications
    and websites, contributed in the development of scientific software, published
    software in repositories, and taught beginner level courses in Python programming
    and Bioinformatics.

    This book is a compilation of the experiences I had gained over time in my interactions
    with students, colleagues, and the users of our services. Thank you for your interest
    in reading it. I hope you will find it useful.

    Vimalkumar Velayudhan

    Website: https://vimalkvn.com

    Email: vimal@disroot.org


    ## Getting started with Linux

    In this section, you will learn how to:

    1. Run Linux on your computer

    2. Use the desktop and included software

    3. Work with files and directories

    4. Start using the command-line and learn some basic commands


    ### 2.1 Linux — an overview

    Linux is an *operating system* developed by Linus Torvalds in 1991. It is released
    under an open-source licence and the source code is freely available for everyone.


    ### 2.1.1 Linux distribution

    A Linux distribution includes the Linux operating system with additional software.

    Examples:

    - Debian³ https://www.debian.org/

    - Ubuntu⁴ https://ubuntu.com/

    - Linux Mint⁵ https://linuxmint.com/

    - Fedora⁶ https://getfedora.org/

    - openSUSE⁷ https://www.opensuse.org/


    ### 2.1.2 Desktop environment

    A desktop environment is a *graphical user interface* that provides easy access
    to files and applications.

    Examples:

    - GNOME (*Fig.* 2)

    - KDE Plasma (*Fig.* 3)

    - Xfce (*Fig.* 4)

    - MATE (*Fig.* 5)

    - Cinnamon (*Fig.* 6)

    Linux distributions might offer additional variants for download, depending on
    the desktop environment in use.

    ![](img/5d1416436999bb5232d6af690a9da18a_26_0.png)

    **Fig. 2:** GNOME

    ![](img/5d1416436999bb5232d6af690a9da18a_27_0.png)

    **Fig. 3:** KDE Plasma

    ![](img/5d1416436999bb5232d6af690a9da18a_28_0.png)

    **Fig. 4:** Xfce

    ![](img/5d1416436999bb5232d6af690a9da18a_29_0.png)

    **Fig. 5:** MATE


    ### **This book uses Linux Mint (Cinnamon)**

    This book will use Linux Mint 20.1 with the Cinnamon desktop environment as the
    reference distribution (Fig. 6).

    ![](img/5d1416436999bb5232d6af690a9da18a_30_0.png)

    **Fig. 6:** Linux Mint with Cinnamon desktop environment

    All the included recipes have been tested on this distribution.


    ### 2.1.3 Ways to run a Linux desktop

    To run a Linux desktop on your computer, you can:

    1. Install a *Linux distribution* or

    2. Run a virtual machine

    I will follow the *second* method in this book, as it is a lot easier for new
    users to get started.

    > **Note:** There are other possibilities, but the methods above are the most
    common.


    ### 2.2 Running a Linux virtual machine

    To run virtual machines of other operating systems (guests) on your computer (host),
    you will need to first install a *hypervisor* — software that runs virtual machines.
    Examples of hypervisors include VirtualBox, Parallels, VMware Workstation etc.
    I will use VirtualBox in this book (Fig. 7).

    ![](img/5d1416436999bb5232d6af690a9da18a_32_0.png)


    ### 2.2.1 Requirements

    **VirtualBox installed on your computer**

    You can install VirtualBox by following the instructions below depending on your
    operating system.

    > **Attention:** *Installing software will require administrator privileges.*

    **Instructions for macOS and Windows**

    You can download an installer for macOS or Windows from the Downloads section
    of the VirtualBox website (Fig. 8).

    https://www.virtualbox.org/wiki/Downloads

    ![](img/5d1416436999bb5232d6af690a9da18a_34_0.png)

    **Fig. 8:** VirtualBox downloads page

    **Instructions for Linux distributions**

    Most Linux distributions include VirtualBox in their package repositories. It
    is recommended you install it using your package manager like `Synaptic` or `apt`,
    `dnf` etc. For example, to get VirtualBox working on Ubuntu 20.04 LTS, you will
    need to install the `virtualbox` and `virtualbox-guest-additions-iso` packages.

    > **Note:** If you cannot install from repositories, you can download an installer
    from the [Linux Downloads](https://www.virtualbox.org/wiki/Linux_Downloads) section
    of the project website.


    ### **Virtual machine image of Linux Mint**

    You can download a ready-to-use virtual machine image of Linux Mint 20.1 from
    the website of this book:

    > https://vimalkvn.com/linuxforbiologists

    It is distributed as an OVA format file. Click on the download link and save the
    `linuxmint-20.1.ova` file to your computer.'
