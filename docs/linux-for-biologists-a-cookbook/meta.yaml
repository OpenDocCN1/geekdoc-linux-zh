    # When should I use a virtual environment?


    The method described here will not work if the programs you are installing require
    two different versions of the same package from PyPI.


    In that case, you can consider creating an isolated environment — either using
    Python virtualenv or Conda and then installing the packages there.


    Related sections:


    +   - Python virtual environments

    - Conda packages


    # Older versions of pip


    If the version of pip installed in your system is older than 20.0, it will attempt
    to install packages in system paths by default, resulting in *permission denied*
    errors.


    To avoid that, you will need to add the --user option to the install and uninstall
    commands, for example:


    ```

    ```pip3 install --user biopython```

    ```'
