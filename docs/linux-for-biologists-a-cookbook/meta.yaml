    ## 4.3.4 free — 查看空闲与已用内存

    使用free命令可以查看空闲内存、已用内存（RAM，即随机存取存储器）以及交换空间的大小。

    用法：

    ```bash

    free -h

    ```

    输出：

    ```text

    total used free shared buff/cache Mem: 3.8Gi 618Mi 1.3Gi 7.0Mi 1.9Gi Swap: 979Mi
    0B 979Mi

    ```

    `-h`选项会让输出结果更易读，且显示对应的单位。上例中空闲物理内存（RAM）的大小为1.3 GiB（吉字节）。


    ## 4.3.5 `locate` — 通过文件名查找文件

    通过文件名搜索文件。该方法速度较快，因为它使用了文件名数据库。

    例如：

    ```bash

    locate bashrc

    ```

    输出：

    ```bash

    /etc/bash.bashrc

    /etc/skel/.bashrc

    /home/user/.bashrc

    ...

    ```

    > **注意：** 该方法可能无法找到近期创建或修改的文件，因为新文件可能还未被收录进数据库中。如需手动更新数据库，可以运行以下命令：

    ```bash

    sudo updatedb

    ```

    或者，你也可以使用*find*命令搜索新文件。


    ### 4.3.6 which — 定位命令路径

    `which` 命令会打印出命令的完整路径，前提是该命令存在于搜索路径（即`$PATH`）中。

    例如：

    ```bash

    which python3

    ```

    输出：

    ```text

    /usr/bin/python3

    ```


    ## 4.4 使用nano编辑文本文件

    *GNU nano*是一款命令行文本编辑器，具备撤销/重做、语法高亮、交互式查找替换等功能。要打开该程序，只需在终端会话中输入`nano`即可。


    ### 4.4.1 创建新文件

    要创建新文件，只需在`nano`后跟上你想要创建的文件名即可。

    例如：

    ```bash

    nano exercise.txt

    ```

    这会打开该文件以进行写入操作（图80）。

    ![图80：在nano中创建文件](img/5d1416436999bb5232d6af690a9da18a_215_0.png)

    此时你就可以开始输入文本了。


    ### 4.4.2 从剪贴板粘贴文本

    若要将其他程序（例如网页浏览器）中的文本复制并粘贴到你正在用nano编辑的文件中，请按照以下步骤操作：

    - 使用`Ctrl + c`将程序中的文本复制到剪贴板

    - 在nano中，将光标移动到你想要粘贴文本的位置

    - 使用`Shift + Ctrl + v`快捷键粘贴文本


    ### 4.4.3 保存修改

    要保存文件，请使用`Ctrl + o`快捷键。该操作对应界面底部显示的`^O`（Write Out，写出）功能（图81）。

    此处的`^`代表`Ctrl`键。

    ![图81：保存修改需使用写出功能](img/5d1416436999bb5232d6af690a9da18a_217_0.png)

    界面底部会显示如下提示（图82）：

    ```

    File Name to Write: exercise.txt

    ```

    ![图82：输入文件名以保存文件](img/5d1416436999bb5232d6af690a9da18a_218_0.png)

    按下**ENTER**键即可接受默认值（即原文件名）。


    ### 4.4.4 退出nano

    要退出nano，请使用`Ctrl + x`快捷键。若未做任何修改，nano会直接关闭；若有未保存的修改，它会提示你是否保存（图83）。

    ![图83：确认是否保存文件修改](img/5d1416436999bb5232d6af690a9da18a_219_0.png)

    输入`y`保存修改，输入`n`放弃修改。


    ## 4.5 练习 — 使用命令行

    这是一项使用命令行完成指定任务的练习，你将用到*前面所讲的*命令。


    ### 任务

    给定一条蛋白质序列，从蛋白质序列数据库中找出匹配的序列。


    ### 方法

    使用NCBI BLAST+工具包中的程序，你可以通过序列（查询序列）搜索序列数据库，从而找到匹配的序列。


    ### 4.5.1 步骤概述

    - 安装NCBI BLAST+

    - 下载蛋白质查询序列

    - 下载蛋白质序列数据库并对其进行格式化

    - 使用查询序列搜索数据库


    ### 4.5.2 获取示例数据

    要继续操作，你需要下载本练习中用到的蛋白质查询序列和数据库。


    #### 下载查询序列

    本练习中用到的蛋白质查询序列是严重急性呼吸综合征冠状病毒2型（SARS-CoV-2）的*刺突糖蛋白*。该序列可在UniProtKB²⁷（蛋白质知识库）中获取。该蛋白质的数据库编号为P0DTC2²⁸。你可以从该条目的页面下载FASTA格式的序列，也可以通过以下直接链接下载：

    https://www.uniprot.org/uniprot/P0DTC2.fasta


    #### 下载蛋白质数据库

    本练习用到的数据库是UniProtKB *Swiss-Prot*²⁹。这是一个人工注释的蛋白质序列数据库，附加了功能信息。你可以从网站的*下载*³⁰页面下载整个数据库的压缩FASTA格式文件。

    | 标记 | 网址 |

    |:----:|-----|

    | ²⁷ | https://uniprot.org/uniprot/ |

    | ²⁸ | https://www.uniprot.org/uniprot/P0DTC2 |

    | ²⁹ | https://www.uniprot.org/uniprot/?query=reviewed:yes |

    | ³⁰ | https://www.uniprot.org/downloads |


    ### 4.5.3 安装NCBI BLAST+工具包

    > **注意：** *该安装流程会在系统路径中安装软件，因此需要管理员权限。*

    NCBI BLAST+在Linux软件包仓库中可用，你可以使用`apt`进行安装：

    ```bash

    sudo apt install ncbi-blast+

    ```

    当提示是否继续时，输入`y`。

    ```text

    [sudo] password for user: Reading package lists... Done Building dependency tree
    Reading state information... Done The following additional packages will be installed:
    libmbedcrypto3 libmbedtls12 libmbedx509-0 ncbi-data The following NEW packages
    will be installed: libmbedcrypto3 libmbedtls12 libmbedx509-0 ncbi-blast+ ncbi-data
    0 upgraded, 5 newly installed, 0 to remove and 0 not upgraded. Need to get 14.9
    MB of archives. After this operation, 75.0 MB of additional disk space will be
    used. Do you want to continue? [Y/n] y

    ```


    ### 4.5.4 下载查询序列

    你可以按照以下步骤下载查询序列：

    - 创建新目录

    - 进入该目录

    - 下载查询序列

    - 查看已下载的序列（可选）


    #### 创建新目录 — `mkdir`

    为了将本项目相关的输入、输出文件存放在一起，请使用`mkdir`命令在你的主目录中创建一个新目录。

    ```bash

    mkdir -p ~/projects/sars-cov-2

    ```

    说明：`~`是主目录的简写，`-p`参数会在必要时创建父级目录。本例中`projects`目录不存在，因此也会被一同创建。


    #### 切换目录 — `cd`

    使用`cd`命令进入刚刚创建的目录：

    ```bash

    cd ~/projects/sars-cov-2

    ```


    #### 下载序列 — `wget`

    要下载序列文件，你可以使用`wget`命令，将下载链接作为参数传入。本例中，下载链接对应FASTA格式文件的地址（见[示例数据]）：

    ```bash

    wget https://www.uniprot.org/uniprot/P0DTC2.fasta

    ```

    下载完成后，你可以使用`ls`命令验证文件是否存在：

    ```bash

    ls -l

    ```

    输出：

    ```text

    total 4

    -rw-rw-r-- 1 user user 1414 Feb 10 00:00 P0DTC2.fasta

    ```


    #### 查看已下载的序列 — `cat` 或 `less`

    由于`P0DTC2.fasta`是纯文本格式的FASTA文件，你可以使用`cat`命令查看其内容：

    ```bash

    cat P0DTC2.fasta

    ```

    输出：

    ```text

    >sp|P0DTC2|SPIKE_SARS2 Spike glycoprotein OS=Severe acute respiratory syndrome
    coronavirus 2 OX=2697049 GN=S PE=1 SV=1 MFVFLVLLPLVSSQCVNLTTTRTQLPPAYTNSFTRGVVYPDKVFRSSVLHSTQDLFLPFFS
    NVTWFHAIHVSGTNGTKRFDNPVLPFNDGVVFASTEKSNIIRGWIFGTTLDSKTQSLLIV NNATNVVVIKVCEFQFCFNDPFGLGVVYHKNKKSWMESEFRVYSSANNCTFEYVSQPFMLDE
