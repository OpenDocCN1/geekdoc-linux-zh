    ```

    This will take some time depending on your network connection. Once complete,
    you will find a directory named galaxy in the current directory. Next, you will
    need to create a Python virtual environment.


    ### 5.2.3 Creating a Python virtual environment

    In this step, you will use Python 3 venv module to create an isolated virtual
    environment for Galaxy.


    > **Note:** For a detailed guide on creating and using virtual environments, read:
    → Python virtual environments


    To create the virtual environment:

    1. Change into the galaxy directory:

    ```bash

    cd galaxy

    ```

    2. Create virtual environment using .venv as the name.

    ```bash

    python3 -m venv .venv

    ```

    > **Attention:** The dot (.) in .venv, is important.

    3. Activate the virtual environment:

    ```bash

    source .venv/bin/activate

    ```

    Your shell prompt will now change to include (.venv):'
