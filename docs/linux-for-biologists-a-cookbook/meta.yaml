  md: "# ## Creating a virtual environment\n\nFirst, using *The quick and easy method*,\
    \ search and install the python3-venv package. This includes the venv module necessary\
    \ for creating virtual environments.\n\nYou can create a virtual environment in\
    \ any directory where you have write privileges, for example, your home directory.\n\
    \nTo demonstrate, I will create a virtual environment called py3env in my home\
    \ directory.\n\n```\n```\npython3 -m venv py3env\n```\n```\n\nIf successful, you\
    \ will find a directory named py3env in the current directory. No messages will\
    \ be displayed.\n\n> > **Note:** python3 is the command to run the Python 3 interpreter.\
    \ Its complete path is `/usr/bin/python3`.\n> \n> **venv** is the Python module\
    \ to create virtual environments.\n> \n> The `-m` option runs the venv module\
    \ as a script.\n\nBefore you can use a virtual environment, you will need to activate\
    \ it."
