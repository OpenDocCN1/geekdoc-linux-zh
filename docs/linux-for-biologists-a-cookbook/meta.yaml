  md: "# ## 4.5.6 Search database using query sequence\n\nWith the query sequence\
    \ downloaded and the database downloaded and formatted, you can start performing\
    \ a BLAST search.\n\nFirst, change into the directory containing the query sequence:\n\
    \n```\n```bash\ncd ~/projects/sars-cov-2\n```\n```\n\nNow run the blastp command\
    \ using the query sequence and the complete path to the database:\n\n```\n```bash\n\
    blastp -query P0DTC2.fasta \\\n-db /home/user/databases/swissprot \\\n-out blastp-results.txt\
    \ \\\n-outfmt \"7 sacc stitle qlen slen pident\"\n```\n```\n\nWhat the options\
    \ mean:\n\n+   - **-query** Path to the query sequence.\n- **-db** Complete path\
    \ of the sequence database.\n- **-out** File to save results to.\n- **-outfmt**\
    \ Format of the output file. This will use format option 7 (tab-delimited text)\
    \ and include the following information:\n  - accession number and description\
    \ of matching sequences (sacc and stitle),\n  - query and subject sequence lengths\
    \ (qlen and slen)\n  - percentage identity of the match (pident)."
