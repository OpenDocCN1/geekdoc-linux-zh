- md: "## 4.2.13 `mv` — move a file or directory\n\nWith the `mv` command, you can\
    \ move a file or directory from one location (source) to another (destination).\
    \ You can choose to keep the existing file or directory name or rename them. The\
    \ basic format of the command is:\n\n```bash\nmv source destination\n```\n\nA\
    \ safer approach is to add the `-iv` options to the command:\n\n```bash\nmv -iv\
    \ source destination\n```\n\nWith `-i` (*interactive*), `mv` will require your\
    \ confirmation before overwriting a file or directory, if it exists already in\
    \ destination. `-v` (*verbose*) will print the command's actions on the screen.\n\
    \nFor convenience, you can *add an alias*.\n\n### Sample files\n\nTo follow the\
    \ examples below, you will need to copy the following files into your home directory\
    \ using the `cp` command:\n\n```bash\ncp -v /usr/share/dict/words ~\ncp -rv /usr/share/doc/bash\
    \ ~\n```\n\n`~` is a shortcut for home directory.\n\n## Moving a file or directory\n\
    \nThe simplest use case is to move a file or directory from one location (directory)\
    \ to another.\n\n### Moving a File\n\nFor example, to move the `words` file copied\
    \ *above* into your Documents directory, use:\n\n```bash\nmv -iv words Documents/\n\
    ```\n\nOutput:\n\n```text\nrenamed 'words' -> 'Documents/words'\n```\n\n### Moving\
    \ a directory\n\nSimilarly, to move the `bash` directory copied *above* into your\
    \ Documents directory, use:\n\n```bash\nmv -iv bash Documents/\n```\n\nOutput:\n\
    \n```text\nrenamed 'bash' -> 'Documents/bash'\n```\n\nIn both cases, the file\
    \ or directory name will not be changed.\n\n## Renaming a file or directory\n\n\
    In this case, you would like to rename a file or directory.\n\n### Renaming a\
    \ file\n\nTo rename the `words` file copied *above* to `dictionary.txt`, use:\n\
    \n```bash\nmv -iv words dictionary.txt\n```\n\nAlternatively, to move it into\
    \ your Documents directory and rename it at the same time, use:\n\n```bash\nmv\
    \ -iv words Documents/dictionary.txt\n```\n\n### Renaming a directory\n\nTo rename\
    \ the `bash` directory copied *above* into `bash-commands`, use:\n\n```bash\n\
    mv -iv bash bash-commands\n```\n\n## Notes\n\n### What happens if a file exists?\n\
    \nYou will notice a prompt requesting you for confirmation to overwrite the file.\n\
    \nType y and press the ENTER key to proceed:\n\n```text\nmv: overwrite 'Documents/words'?\
    \ y\nrenamed 'words' -> 'Documents/words'\n```\n\nTo cancel, simply press ENTER\
    \ key at the prompt.\n\n### What happens if a directory exists?\n\n`mv` will overwrite\
    \ a directory only if it is empty. You can either:\n\n- copy files into destination\
    \ directory or\n- rename the destination directory\n\n### Adding an alias for\
    \ mv\n\nRather than typing `mv -iv`, every time you need to use the command, you\
    \ can add an alias for the command in your `~/.bash_aliases` file. For example:\n\
    \n```bash\nalias mv='mv -iv'\n```\n\nNow, when you type `mv`, you will actually\
    \ be running `mv -iv`.\n\n## 4.2.14 `rm` — remove files or directories\n\nWith\
    \ the `rm` command, you can remove (or delete) files or directories. The basic\
    \ format of the command is:\n\n```bash\nrm source\n```\n\nA safer approach is\
    \ to add the `-iv` options to the command:\n\n```bash\nrm -iv source\n```\n\n\
    With `-i` (*interactive*), `rm` will require your confirmation before deleting\
    \ a file or directory. `-v` (*verbose*) will print the command's actions on the\
    \ screen.\n\nFor convenience, you can *add an alias*.\n\n### Sample files\n\n\
    To follow the examples below, you will need to:\n\n1. Copy the following files\
    \ into your home directory using the `cp` command:\n\n```bash\ncp -v /usr/share/dict/words\
    \ ~\ncp -rv /usr/share/doc/bash ~\n```\n\n`~` is a shortcut for home directory.\n\
    \n2. Create an empty directory:\n\n```bash\nmkdir empty-dir\n```\n\n## Removing\
    \ files\n\nTo remove a file, for example, the `words` file copied *above*, you\
    \ can use:\n\n```bash\nrm -iv words\n```\n\nOutput:\n\n```text\nrm: remove regular\
    \ file 'words'? y\nremoved 'words'\n```\n\n## Removing directories\n\n### Removing\
    \ empty directories\n\nIf the directory is empty, you can remove it using the\
    \ `-d` option:\n\n```bash\nrm -d empty-dir\n```\n\nAlternatively, you can use\
    \ the *rmdir* command:\n\n```bash\nrmdir empty-dir\n```\n\n### Removing directories\
    \ with content\n\nIf the directory has some content i.e., files or subdirectories,\
    \ you will need to add the `-r` (recursive) option. For example, using the `bash`\
    \ directory copied *above*:\n\n```bash\nrm -ivr bash\n```\n\nThis command will\
    \ ask for your confirmation for deleting every file in the directory and then\
    \ delete it:\n\n```text\nrm: descend into directory 'bash'? y\nrm: remove regular\
    \ file 'bash/RBASH'? y\nremoved 'bash/RBASH'\n...\nrm: remove regular file 'bash/README.gz'?\
    \ y\nremoved 'bash/README.gz'\nrm: remove directory 'bash'? y\nremoved directory\
    \ 'bash'\n```\n\nInstead of `-i`, you could use the `-I` option, which will only\
    \ prompt once, when removing directories recursively:\n\n```bash\nrm -Ivr bash\n\
    ```\n\nOutput:\n\n```text\nrm: remove 1 argument recursively? y\nremoved 'bash/RBASH'\n\
    ... removed 'bash/README.gz'\nremoved directory 'bash'\n```\n\nIf you are *completely\
    \ sure* you do not need the directory and its contents, you can *force* its removal\
    \ using the `-f` option:\n\n```bash\nrm -vrf bash\n```\n\n`rm` will delete the\
    \ directory without confirmation.\n\n## Notes\n\n### Adding an alias for rm\n\n\
    Rather than typing `rm -iv`, every time you need to use the command, you can add\
    \ an *alias* for the command in your `~/.bash_aliases` file. For example:\n\n\
    ```bash\nalias rm='rm -iv'\n```\n\nNow, when you type `rm`, you will actually\
    \ be running `rm -iv`.\n\n## 4.2.15 `echo` — display text or values of variables\n\
    \nWith the `echo` command, you can print text or the values of *environment variables*\
    \ on the screen. The basic format of the command is:\n\n```bash\necho text_or_variable\n\
    ```\n\n### Printing text\n\nTo print text on the screen, use `echo` followed by\
    \ the text you would like to display.\n\n```bash\necho \"Hello, This is echo!\"\
    \n```\n\nOutput:\n\n```text\nHello, This is echo!\n```\n\n### Printing values\
    \ of environment variables\n\nYou can also use `echo` to display values of your\
    \ environment variables. For example:\n\n```bash\necho $PATH\n```\n\n## Linux\
    \ for Biologists\n\nThe `$` in `PATH` indicates, it is a variable.\n\nOutput:\n\
    \n```text\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin\n\
    ```\n\n`PATH` contains the list of paths (directories) that will be searched for\
    \ locating programs or commands. You can set or modify environment variables in\
    \ your `~/.bashrc`.\n\n## 4.3 Other useful commands\n\nThese are some additional\
    \ commands that you might find useful.\n\n## 4.3.1 `df` — report disk usage\n\n\
    The `df` command will report used and available disk space on all storage devices\
    \ connected to the system. For example, to find the amount of disk space used\
    \ in `/` — the root filesystem, you can use the command:\n\n```bash\ndf -h /\n\
    ```\n\nOutput:\n\n```text\nFilesystem      Size  Used Avail Use% Mounted on\n\
    /dev/mapper/vgmint-root  28G  6.9G  20G  26% /\n```\n\nThe `-h` option makes the\
    \ output human-readable. Without this, available disk space will be reported as\
    \ `20600196` instead of `20G`.\n\n## 4.3.2 `du` — estimate disk usage of files\
    \ or directories\n\nCalculate the amount of disk space used by files or directories.\
    \ For example, to calculate the amount of disk space used by files in your home\
    \ directory, use the command:\n\n```bash\ndu -sh ~\n```\n\nOutput:\n\n```text\n\
    7.4G\t.\n```\n\nThe `-s` option prints a summary instead of printing space used\
    \ by individual files. `-h` makes the output human-readable.\n\n## 4.3.3 `find`\
    \ — search for files\n\nSearch for files using their file name, file type etc.,\
    \ For example, to find files in the home directory with `.bash` in their name,\
    \ use the command:\n\n```bash\nfind ~ -name \"*.bash*\"\n```\n\nOutput:\n\n```text\n\
    /home/user/.bashrc\n/home/user/.bash_history\n/home/user/.bash_logout\n```\n\n\
    > **Note:** The `~` here is a shortcut for home directory.\n\n> The asterisk symbol\
    \ (`*`) in `.bash*` acts as a wildcard.\n\n> The `find` command does not use a\
    \ database, so the search will be slower when compared to `locate`. However, it\
    \ can identify files that were created or modified recently."
