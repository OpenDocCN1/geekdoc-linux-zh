    ## 3.6 Debian packages

    If your software of interest is available as a *Debian package*, you can use the
    *gdebi* program to install it. If the software has any *dependencies*, they will
    be installed automatically. Examples of software that can be installed using this
    method:

    - **RStudio Desktop** — an IDE for the R programming language

    - **Modeller** — a program for comparative modelling of protein three-dimensional
    structures

    - **MEGA** — Molecular Evolutionary Genetics Analysis


    ### 3.6.1 Requirements

    > **Attention:** *This procedure installs software in system paths and so requires
    administrator privileges.*


    ### 3.6.2 Installing a Debian package

    To demonstrate the steps involved in installing a Debian package, I will download
    and install *RStudio Desktop* — an IDE for R, distributed as a Debian package.


    **1. Downloading Debian package**

    Open the RStudio project''s download<sup>26</sup> page in a web browser. Under
    Choose Your Version, click on the download button below RStudio Desktop (Open
    Source License) (Fig. 66).

    ![](img/5d1416436999bb5232d6af690a9da18a_159_0.png)

    > **Fig. 66:** Download RStudio Desktop (Open Source License)

    This will take you to the installers section with information on the current version
    (Fig. 67).<sup>26</sup> https://rstudio.com/products/rstudio/download/

    ![](img/5d1416436999bb5232d6af690a9da18a_160_0.png)

    Fig. 67: RStudio Desktop installers

    > **Note:** Although the instructions in Fig. 67 state that you will need to install
    R before installing RStudio, you can safely *skip* that step. The Gdebi program
    used here will automatically install R while installing RStudio. Scroll down to
    the All Installers section. Click on the download link corresponding to Ubuntu
    18/Debian 10 (Fig. 68).


    ## All Installers

    Linux users may need to **import RStudio''s public code-signing key** prior to
    installation, depending on the operating system''s security policy. RStudio requires
    a 64-bit operating system. If you are on a 32-bit system, you can use an **older
    version of RStudio**.

    | OS | Download | Size | SHA-256 |

    |------|----------|------|-----------|

    | Windows 10/8/7 | RStudio-1.4.1103.exe | 156.96 MB | c3384189 |

    | macOS 10.13+ | RStudio-1.4.1103.dmg | 152.77 MB | 20148bd6 |

    | Ubuntu 16 | rstudio-1.4.1103-amd64.deb | 119.26 MB | f0857e27 |

    | Ubuntu 18/Debian 10 | rstudio-1.4.1103-amd64.deb | 120.30 MB | 76864349 |

    | Fedora 19/Red Hat 7 | rstudio-1.4.1103-x86_64.rpm | 138.02 MB | 8fcb2d29 |

    > **Fig. 68:** RStudio installers for different operating systems

    In the dialog window that appears, select **Save File** and then click on the
    **OK** button ([Fig. 69](#)).

    ![](img/5d1416436999bb5232d6af690a9da18a_162_0.png)

    Fig. 69: Save installer file

    Once the file download is complete, you can find it in your Downloads directory.


    **2. Installing downloaded package**

    Open file manager and navigate to your Downloads directory. Double-click on the
    downloaded file (Fig. 70).

    ![](img/5d1416436999bb5232d6af690a9da18a_163_0.png)

    Fig. 70: Downloaded Debian package

    This will open the Gdebi application. Click on the **Install Package** button
    (Fig. 71).

    ![](img/5d1416436999bb5232d6af690a9da18a_164_0.png)

    Fig. 71: Gdebi: Click on the Install Package button

    You will be prompted to enter *your password*. Type in your password and click
    on the **Authenticate** button to proceed (Fig. 72).

    ![](img/5d1416436999bb5232d6af690a9da18a_165_0.png)

    Fig. 72: Enter your password when prompted

    As this package has additional dependencies, another dialog will appear listing
    these packages, which need to be installed in order for it to work. Click on the
    **Continue** button to proceed (Fig. 73).

    ![](img/5d1416436999bb5232d6af690a9da18a_166_0.png)

    Fig. 73: Additional dependencies to be installed. Installation will now proceed
    (Fig. 74).

    ![](img/5d1416436999bb5232d6af690a9da18a_166_1.png)

    Fig. 74: Installation progress

    When installation is complete, you will see a message "Same version is already
    installed" at the top of the window (Fig. 75).

    ![](img/5d1416436999bb5232d6af690a9da18a_167_0.png)

    **Fig. 75:** Package installed successfully


    **3. Launching installed programs**

    You can launch installed programs from the Applications Menu (Fig. 76).

    > **Note:** This only applies to applications with a graphical user interface.

    ![](img/5d1416436999bb5232d6af690a9da18a_168_0.png)

    Fig. 76: Launching installed program from applications menu

    The main window of the program will be displayed (Fig. 77).

    ![](img/5d1416436999bb5232d6af690a9da18a_168_1.png)

    Fig. 77: Main window of RStudio Desktop


    ### 3.6.3 Upgrading installed software

    Upgrading software installed from a Debian package, is similar to installation.
    When a new version of the program is available, download the package file (.deb)
    and then follow the steps in *Installing a Debian package*.


    ### 3.6.4 Removing installed software

    You can follow the steps in *Removing installed software*, to search and remove
    packages installed in this manner.


    ### 3.6.5 Notes

    #### The command-line version

    You can use the *apt* package manager to install Debian packages on the command-line.

    #### These programs need to be updated manually

    Programs installed in this manner will not *usually* be updated automatically.
    So, this method should only be used for software not available using *The quick
    and easy method*.

    #### If dependencies cannot be located, installation will fail

    Installation of some programs might fail, if dependencies cannot be located in
    software repositories. In that case, you will need to find and install those packages
    manually and then attempt to install the program again.


    ## Using the Linux command line

    In this section, you will find an overview of the Linux command line, the shell
    and terminal programs, some commonly used commands, and a sample exercise.


    ### 4.1 Shell and Terminal

    A *shell* is a program that provides an interface to the operating system''s services.
    The most commonly used shell in Linux distributions is *Bash*. A *terminal* program
    runs the shell and provides an interface for users to type commands. The default
    terminal application in Linux Mint is `Terminal` (Fig. 78). You can launch it
    from the **Applications Menu** or by clicking on its icon in the Panel.

    ![](img/5d1416436999bb5232d6af690a9da18a_174_0.png)

    Fig. 78: A Terminal window.

    Once a terminal window is open, you can start typing commands at the `$` prompt.
    For example, the following command:

    ```pwd

    ```

    will output the current working directory:

    ```

    /home/user

    ```


    #### 4.1.1 The shell prompt

    The prompt `user@cookbook:~$` in Fig. 78 indicates the following:

    - **user** — username of the account

    - **cookbook** — the computer''s hostname

    - **~** — short form for the user''s home directory i.e., `/home/user`

    - **$** — a regular user account. For the root user, this will change to **#**


    ### 4.2 Commands — an overview

    This section provides an overview of some commands that are used frequently on
    Linux systems. Familiarity with these will help you navigate the file system and
    work with files, and directories.


    #### 4.2.1 Command options

    A command might support additional options. For example, the command:

    ```

    ls

    ```

    — prints a list of files in a directory, whereas:

    ```

    ls -a

    ```

    — will also print hidden files in that directory.


    #### 4.2.2 Getting help on using commands

    In most cases, you can see the complete list of options a command supports using
    `--help`:

    ```

    ls --help

    ```

    **Output:**

    ```

    Usage: ls [OPTION]... [FILE]...

    List information about the FILEs (the current directory by default).

    Sort entries alphabetically if none of -cftuSUX nor --sort is specified.

    Mandatory arguments to long options are mandatory for short options too.

    -a, --all do not ignore entries starting with .

    ...

    ```

    > **Note:** To keep this discussion short, the examples in this section only include
    *some* options supported by a command.'
