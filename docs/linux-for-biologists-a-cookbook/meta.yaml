  md: '# 1.3 What you will need


    To follow the recipes in this book, you will need:


    +   1. A Linux desktop

    2. Administrator privileges'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# ### 1.3.1 Linux desktop


    The Linux and open-source world is full of choice.


    There are different versions (or distributions) of Linux that are available for
    download and use.


    To ensure that you can follow this book successfully, *Linux Mint 20.1* is used
    as a *reference* distribution. All the included recipes have been tested on this
    distribution.


    # **Virtual machine image**


    If you do not have access to a Linux desktop, you can download a virtual machine
    from the website of this book and use it to run a virtual machine on your computer
    ([Fig. 1]).


    ![](img/5d1416436999bb5232d6af690a9da18a_19_0.png)


    **Fig. 1:** Linux Mint running in VirtualBox


    # ### 1.3. What you will need'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Linux for Biologists


    Follow the steps in *Running a Linux virtual machine* to get started.


    # What about other Linux distributions?


    Although most of the recipes will work on other Linux distributions, you will
    need to make changes in some cases.


    For example, the applications you use might be different — instead of the *Files*
    file manager used here, you might use Nautilus or Dolphin.


    If there are problems, I recommend you download and use the *virtual machine*.'
  merge: -1
  pgno: 20
