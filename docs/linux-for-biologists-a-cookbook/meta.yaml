  md: '# Activating a virtual environment


    You will need to activate a virtual environment before you can start using it.
    To do so, use the source command with the path to the virtual environment’s activate
    script.


    For example, to activate py3env created in the previous step, use:


    ```

    source py3env/bin/activate

    ```


    Your shell prompt will now change to indicate that the virtual environment is
    now active. Note the (py3env) label at the beginning of the prompt:


    ```

    (py3env) user@cookbook:~$

    ```


    You can now start using this virtual environment.


    > Note: Before you start installing packages...


    It is a good idea to install (or upgrade) Python build tools — pip, setuptools,
    and wheel in a new virtual environment.


    These build tools are necessary for building and installing packages from PyPI
    and other sources.


    Installing them will ensure that additional packages will build and install without
    errors.'
  merge: -1
