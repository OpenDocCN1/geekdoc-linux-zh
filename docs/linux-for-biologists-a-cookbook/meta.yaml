  md: '# **Removing directories with content**


    If the directory has some content i.e., files or subdirectories, you will need
    to add the -r (recursive) option.


    For example, using the bash directory copied *above*:


    ```

    ```

    rm -ivr bash

    ```

    ```


    This command will ask for your confirmation for deleting every file in the directory
    and then delete it:


    ```

    ```text

    rm: descend into directory ''bash''? y

    rm: remove regular file ''bash/RBASH''? y

    removed ''bash/RBASH''

    ...

    rm: remove regular file ''bash/README.gz''? y

    removed ''bash/README.gz''

    rm: remove directory ''bash''? y

    removed directory ''bash''

    ```

    ```


    Instead of -i, you could use the -I option, which will only prompt once, when
    removing directories recursively:


    ```

    ```

    rm -Ivr bash

    ```

    ```


    Output:


    ```

    ```text

    rm: remove 1 argument recursively? y

    removed ''bash/RBASH''

    ```

    ```'
