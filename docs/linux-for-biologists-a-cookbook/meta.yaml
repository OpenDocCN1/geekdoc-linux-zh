    ## 删除或重命名页面

    要删除或重命名页面，你可以在页面上执行*右键单击*操作，然后选择需要的功能。


    ## 6.2.5 导出笔记和笔记本

    要导出笔记本或单页，请选择：

    ``` File → Export ```

    在弹出的对话框窗口中，选择需要的选项，然后单击“前进”按钮（图121）。

    ![](img/5d1416436999bb5232d6af690a9da18a_301_0.png)

    在下一个界面中，你可以通过**格式**下拉框选择要导出的笔记本或页面的格式（图122）。

    ![](img/5d1416436999bb5232d6af690a9da18a_302_0.png)

    图122：选择导出格式

    你可以保留默认选项——HTML。单击**“前进”**按钮继续操作。

    在最后一个界面中，选择一个目录来保存导出的笔记本或页面。

    > **注意：** 如果使用默认设置，建议新建一个输出目录，然后在**输出文件夹**下选择该目录。

    单击**“确定”**按钮完成导出。

    ![](img/5d1416436999bb5232d6af690a9da18a_303_0.png)

    图123：选择输出文件夹

    导出完成后，在文件管理器中打开输出目录。双击*Home.html*文件即可在浏览器中打开它（图124）。

    ![](img/5d1416436999bb5232d6af690a9da18a_304_0.png)

    图124：查看已导出的笔记本


    ## 6.2.6 通过插件启用更多功能

    Zim自带的部分插件如下：

    - **插入符号**——插入特殊符号和字符

    - **目录**——添加显示当前页面目录的小部件

    - **标签**——为笔记添加标签

    - **托盘图标**——在系统托盘添加图标，方便快速访问你的笔记本

    - **拼写检查器**——添加拼写检查功能

    你需要先在偏好设置中激活（或启用）这些插件，之后才能使用它们。


    ### 启用插件

    启用插件的步骤如下：

    1. 选择`Edit → Preferences`

    2. 单击“插件”选项卡

    3. 勾选你要启用的插件对应的复选框（图125）

    4. 单击“确定”按钮

    ![](img/5d1416436999bb5232d6af690a9da18a_306_0.png)

    *图125：启用插件*

    > **注意：** *部分插件还有额外选项。* 单击插件描述下方的**“配置”**按钮即可访问这些选项。


    ## 6.2.7 获取帮助

    Zim内置了详细的用户手册，你可以通过以下方式打开（图126）：

    `Help → Contents`

    ![](img/5d1416436999bb5232d6af690a9da18a_307_0.png)

    **图126：Zim使用帮助**


    ## 术语表

    ### **Anaconda**

    一款免费开源的Python和R发行版（即Anaconda个人版）。它内置了*Conda*，还包含超过250款开源科学软件包。你可以从*Anaconda Cloud*仓库安装额外的软件包。官网：https://anaconda.com/products/individual


    ### **Anaconda Cloud**

    用于存放Python、R软件包和笔记本的仓库。官网：https://anaconda.org


    ### **apt**

    一款命令行程序，用于在Debian、Ubuntu及其他Linux发行版上安装、卸载软件。相关章节：→ 命令行版本（*apt*）


    ### **bioconda**

    面向*Conda*包管理器的软件源，包含超过7000款生物信息学软件包。官网：https://bioconda.github.io/


    ### **build-essential**

    一款软件包，用于安装make等构建工具以及gcc等编译器，这些是编译C语言等编写的模块所必需的。


    ### **Bash**

    *GNU*项目的Shell程序，名称是The Bourne-Again Shell的缩写。它是Linux发行版中最常用的Shell。官网：https://www.gnu.org/software/bash/


    ### **Bioconductor**

    用R编程语言编写的工具集，用于分析和解读高通量基因组数据。官网：https://www.bioconductor.org/


    ### **BiocManager**

    一款R软件包，用于从*Bioconductor*项目仓库安装和更新软件包。官网：https://cran.r-project.org/package=BiocManager


    ### **BioPython**

    用于计算分子生物学的Python工具集。官网：http://biopython.org/


    ### **Bio::Phylo**

    用于系统发育分析的Perl软件包。官网：https://metacpan.org/pod/Bio::Phylo


    ### **commands**

    也称作二进制文件或可执行文件。


    ### **Conda**

    一款软件包和环境管理器。作为*包管理器*，它可以用于从*Anaconda Cloud*安装软件，软件依赖项会自动安装；作为*环境管理器*，它可以用于创建和管理包含不同软件包集合的环境，你可以按需激活和使用这些环境。


    ### **cpanminus**

    一款Perl脚本，用于从*CPAN*获取、构建和安装模块，它提供`cpanm`命令。官网：https://metacpan.org/pod/App::cpanminus


    ### **cutadapt**

    一款Python程序，用于从高通量测序读段中查找并移除接头序列、引物、poly-A尾及其他不需要的序列。官网：https://cutadapt.readthedocs.io


    ### **CPAN**

    综合Perl存档网络（Comprehensive Perl Archive Network）的缩写，它提供额外的Perl模块供安装（截至2020年12月共196752个）。官网：https://www.cpan.org/


    ### **CRAN**

    综合R存档网络（Comprehensive R Archive Network）的缩写，是由FTP和Web服务器组成的网络，提供最新版本的R、软件包和文档。官网：https://cran.r-project.org/


    ### **Debian**

    一款由自由开源软件组成的Linux发行版，任何人均可免费下载、使用、修改和分发。官网：https://www.debian.org/


    ### **Debian软件包**

    包含软件的可执行文件、库和文档的归档文件，可安装在Debian Linux以及基于Debian的系统（如Ubuntu和Linux Mint）上，这类文件的后缀名为.deb。


    ### **dependencies**

    程序运行所需的额外程序或库。


    ### **edgeR**

    一款用于数字基因表达数据经验分析的R软件包，可从*Bioconductor*项目仓库获取。官网：https://www.bioconductor.org/packages/edgeR/


    ### **FAST**

    序列分析工具箱（FAST Analysis of Sequences Toolbox）的缩写，是一组用Perl编写的实用工具，将UNIX范式扩展到了生物信息学序列记录。官网：https://metacpan.org/pod/FAST


    ### **Files**

    Linux Mint Cinnamon版的默认文件管理器，原名为Nemo。


    ### **gdebi**

    一款简易工具，用于安装*Debian软件包*文件及其依赖项（如有）。官网：https://launchpad.net/gdebi


    ### **GNU**

    是“GNU''s Not Unix”的递归缩写，该项目的目标是提供一款100%由自由软件构成、类Unix的系统。官网：https://www.gnu.org/


    ### **GUI**

    图形用户界面（graphical user interface）的缩写。在个人电脑上，它通常包含带有功能按钮的应用程序窗口、用于启动应用程序的图标，以及用于管理设备和服务的窗口小部件。


    ### **IDE**

    集成开发环境（integrated development environment）的缩写，常见实例包括PyCharm、RStudio和*Eclipse*。


    ### **local-lib**

    一款Perl模块，用于创建本地目录结构，无需管理员权限即可安装带依赖项的模块。官网：https://metacpan.org/pod/local::lib


    ### **Linux Mint**

    一款桌面版Linux发行版，基于*Debian*和*Ubuntu*开发。官网：https://linuxmint.com/


    ### **MEGA**

    分子进化遗传学分析（Molecular Evolutionary Genetics Analysis）软件，提供*GUI*和命令行两个版本。官网：https://megasoftware.net/


    ### **MetaCPAN**

    用于检索*CPAN*上可用Perl软件包和模块的搜索引擎。官网：https://metacpan.org/


    ### **Miniconda**

    *Conda*的最小发行版，相比捆绑了额外软件包的替代安装程序*Anaconda*，它的安装速度更快，占用的磁盘空间也更少。官网：https://docs.conda.io/en/latest/miniconda.html


    ### **Modeller**

    一款通过满足空间约束进行蛋白质比较结构建模的程序。官网：https://salilab.org/modeller/


    ### **nano**

    一款简易命令行文本编辑器。官网：https://www.nano-editor.org/


    ### **OVA**

    用于分发虚拟机镜像的文件格式。


    ### **pip**

    Python软件包安装器，可用于从*PyPI*及其他Python软件包索引导源安装软件包。官网：https://pip.pypa.io/


    ### **PyMOL**

    一款分子可视化系统，最初由Warren L. Delano开发，现由Schrödinger公司维护。官网：https://pymol.org/2/


    ### **PyPI**

    Python软件包索引（Python Package Index）的缩写，是存放Python编写软件的仓库（截至2020年12月共275161个项目）。官网：https://pypi.org/


    ### **root**

    Linux系统上的主管理员账户。


    ### **R**

    用于统计计算和图形绘制的编程语言及自由软件环境。官网：https://r-project.org


    ### **RStudio Desktop**

    面向*R*的*IDE*，包含R控制台、带语法高亮功能的编辑器，以及绘图、调试等工具。

    '
