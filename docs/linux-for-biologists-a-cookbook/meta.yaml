    # **Keyboard shortcuts**


    Alternatively, you can use keyboard shortcuts to apply formatting to your text.


    For example:


    ```

    Bold : Ctrl + b

    ```


    ```

    Italic or Emphasis : Ctrl + i

    ```


    ```

    Superscript : Ctrl + Shift + p

    ```


    ```

    Subscript : Ctrl + Shift + b

    ```'
