- md: "As `local-lib` makes these modules discoverable automatically, you can start\
    \ using them in your scripts immediately. Here is an example using the `Bio::Phylo`\
    \ package. After installing the module with `cpanm Bio::Phylo`, create a file\
    \ using a text editor and copy the following content:\n\n```perl\nuse Bio::Phylo;\n\
    # print version\nprint Bio::Phylo->VERSION;\n# print citation\nprint Bio::Phylo->CITATION;\n\
    ```\n\nSave the file as `biophylo_test.pl` and then run it:\n\n```bash\nperl biophylo_test.pl\n\
    ```\n\nOutput:\n\n```\nv2.0.1\nRutger A Vos, Jason Caravas, Klaas Hartmann, Mark\
    \ A Jensen and Chase Miller, 2011. Bio::Phylo - phyloinformatic analysis using\
    \ Perl. BMC Bioinformatics 12:63. doi:10.1186/1471-2105-12-63\n```\n\n## 3.4 R\
    \ packages\n\nIf your software of interest is available as an R package on *CRAN*\
