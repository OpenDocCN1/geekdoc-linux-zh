- md: '## Why is this a quick and easy method?

    You can use a graphical user interface (Software Manager) or the command-line
    (apt) to install software available in Linux package repositories. Software installed
    in this manner will also be kept updated along with the rest of the system.


    ## Additional software repositories

    It takes some time for newer versions of software to become available in distribution
    repositories. If your software of interest is not available or if you need a more
    recent version of the software, you could try installing them from these additional
    sources:

    - *Python* packages from *PyPI*

    - *Perl* modules from *CPAN*

    - *R* packages from *CRAN* or *Bioconductor*

    - *Conda* packages from *Anaconda Cloud*


    > **Attention:** Software installed using these methods will also need to be kept
    updated manually.


    ## 3.2 Python packages

    If your software of interest is available as a Python package on *PyPI*, you can
    install it using *pip* — Python package installer.

    > **Note:** Your software might already be available using *The quick and easy
    method*. Search for package names starting with `python-`. In certain cases, installing
    packages in a virtual environment might be a better option. Read: [When should
    I use a virtual environment?]()


    ### 3.2.1 Requirements

    #### Python package installer (pip)

    To install pip, follow *The quick and easy method* for installing software. Search
    and install the `python3-pip` package.


    #### $HOME/.local/bin added to $PATH

    Packages that include commands will install them in the `$HOME/.local/bin` directory
    (*What is $HOME?*). To be able to run these commands easily, you will need to
    add this directory to your $PATH variable. You can do so by following the steps
    in *Adding directories to PATH*.

    > **Attention:** *You should not add sudo in the commands below.* This method
    only installs files in your home directory and so does not require administrator
    privileges.


    ### 3.2.2 Searching for a package on PyPI

    Open PyPI website<sup>17</sup> in a web browser. In the Search projects field,
    enter the name of the software you would like to install and press the ENTER key
    or click on the search button (Fig. 55).


    ![](img/5d1416436999bb5232d6af690a9da18a_102_0.png)


    > **Fig. 55:** Searching for a package on PyPI


    A list of packages matching the search term will be displayed (Fig. 56).

    <sup>17</sup> https://pypi.org


    ![](img/5d1416436999bb5232d6af690a9da18a_103_0.png)


    Fig. 56: Search results for biopython. 1.78 is the version number. Click on the
    result to proceed to the project description page. In the project description
    page, find the package name (Fig. 57) in the `pip install` command. In this case,
    it is **biopython**.


    ![](img/5d1416436999bb5232d6af690a9da18a_103_1.png)


    > **Fig. 57:** Project description page for Biopython


    > **Note:** You will need to use `pip3` instead of the `pip` command in the steps
    below. [Why?]()

    You can now proceed towards installing the package.


    ### 3.2.3 Installing a Python package

    Open a terminal. Use the `pip3 install` command with the name of the package you
    would like to install. Using biopython as an example:

    ```bash

    pip3 install biopython

    ```

    Output:

    ```bash

    Collecting biopython

    Downloading biopython-1.78-cp38-cp38-manylinux1_x86_64.whl (2.3 MB) |********************|
    2.3 MB 2.1 MB/s

    Collecting numpy

    Downloading numpy-1.20.1-cp38-cp38-manylinux2010_x86_64.whl (15.4 MB) |********************|
    15.4 MB 90 kB/s

    Installing collected packages: numpy, biopython

    Successfully installed biopython-1.78 numpy-1.20.1

    ```

    > **Note:** One limitation of this method is that you will not be able to install
    *multiple versions* of a package. This can be solved using a *virtual environment*.


    ### 3.2.4 Updating an installed package

    When you notice an update is available for the package, you can use the `install`
    command with the `-U` option, and the name of the package:

    ```bash

    pip3 install -U biopython

    ```


    ### 3.2.5 Removing an installed package

    Use the `uninstall` command with the name of the package you would like to remove:

    ```bash

    pip3 uninstall biopython

    ```


    ### 3.2.6 Using installed packages

    #### Where are the files installed?

    You can use the `pip3 show` command with the name of the package to identify the
    path where it is installed:

    ```bash

    pip3 show biopython

    ```

    Output:

    ```

    Name: biopython

    Version: 1.78

    Summary: Freely available tools for computational molecular biology.

    Home-page: https://biopython.org/

    Author: The Biopython Contributors

    Author-email: biopython@biopython.org

    License: UNKNOWN

    Location: /home/user/.local/lib/python3.8/site-packages

    Requires: numpy

    Required-by:

    ```

    The installation path will be listed next to the Location keyword.


    #### Using Python packages and modules

    Python packages and modules will be installed in `$HOME/.local/lib/python3.8/site-packages`.

    > **Note:** This is the path for Python 3.8. If you have a different version of
    Python installed, this value will change. This directory will be automatically
    included in $PYTHONPATH. So, you can import and use installed packages and modules
    in your scripts, without any extra effort.


    For example, here is a simple Python script to test BioPython installed using
    pip:

    ```python

    from Bio.Seq import Seq

    seq = Seq(''ATGC'')

    comp = seq.complement()

    print(f''The complement of {seq} is {comp}'')

    ```

    The Bio.Seq package is part of BioPython. Copy the code sample above and save
    it as `biopy_test.py`. Then run it from the terminal like so:

    ```bash

    python3 biopy_test.py

    ```


    Output:

    ```

    The complement of ATGC is TACG

    ```


    #### Using included commands

    If the package includes commands, those will be installed in `$HOME/.local/bin`
    directory. For these commands to be easily accessible, you will need to add this
    directory to PATH, as mentioned under *requirements*. As an example, when you
    install the Python package of *cutadapt*, the `cutadapt` command will be installed
    in `$HOME/.local/bin`, which you can then run from a terminal like this:

    ```bash

    cutadapt --version

    ```

    Output:

    ```

    3.1

    ```


    ### 3.2.7 Python virtual environments

    A virtual environment is a *self-contained* directory tree containing Python and
    some additional packages.


    #### Advantages

    These are *some* advantages of using virtual environments.


    #### No administrator privileges

    You do not need administrator privileges to create a virtual environment or install
    packages in an environment.


    #### Multiple environments

    Multiple virtual environments can be created with each containing their own sets
    of packages. These are isolated and packages in an environment can be installed,
    updated or removed without affecting other environments.


    #### Share your environment

    You can share your configuration with others. They will be able to reproduce your
    environment, with the exact versions of packages.


    #### Creating a virtual environment

    First, using *The quick and easy method*, search and install the `python3-venv`
    package. This includes the `venv` module necessary for creating virtual environments.
    You can create a virtual environment in any directory where you have write privileges,
    for example, your home directory. To demonstrate, I will create a virtual environment
    called `py3env` in my home directory.

    ```bash

    python3 -m venv py3env

    ```

    If successful, you will find a directory named `py3env` in the current directory.
    No messages will be displayed.


    > **Note:** `python3` is the command to run the Python 3 interpreter. Its complete
    path is `/usr/bin/python3`.

    > **Note:** `venv` is the Python module to create virtual environments.

    > **Note:** The `-m` option runs the `venv` module as a script.


    Before you can use a virtual environment, you will need to activate it.


    #### Activating a virtual environment

    You will need to activate a virtual environment before you can start using it.
    To do so, use the `source` command with the path to the virtual environment’s
    `activate` script. For example, to activate `py3env` created in the previous step,
    use:

    ```bash

    source py3env/bin/activate

    ```

    Your shell prompt will now change to indicate that the virtual environment is
    now active. Note the `(py3env)` label at the beginning of the prompt:

    ```

    (py3env) user@cookbook:~$

    ```

    You can now start using this virtual environment.


    > **Note:** Before you start installing packages, it is a good idea to install
    (or upgrade) Python build tools — pip, setuptools, and wheel in a new virtual
    environment. These build tools are necessary for building and installing packages
    from PyPI and other sources. Installing them will ensure that additional packages
    will build and install without errors.'
  mdcn: "\n## 为什么这是一种快速简便的方法？\n你可以通过图形用户界面（软件管理器）或命令行（apt）安装 Linux 软件仓库中提供的软件。通过这种方式安装的软件也会随系统其余部分一同更新。\n\
    \n## 额外软件仓库\n发行版仓库中新版本软件的上线通常需要一定时间。如果你需要的软件不在仓库中，或者你需要更新版本的软件，可以尝试从以下额外源安装：\n\
    - 来自 *PyPI* 的 *Python* 包\n- 来自 *CPAN* 的 *Perl* 模块\n- 来自 *CRAN* 或 *Bioconductor*\
    \ 的 *R* 包\n- 来自 *Anaconda Cloud* 的 *Conda* 包\n\n> **注意：** 通过这些方法安装的软件也需要手动保持更新。\n\
    \n## 3.2 Python 包\n如果你需要的软件在 *PyPI* 上以 Python 包的形式提供，你可以使用 *pip*（Python 包安装器）进行安装。\n\
    > **注意：** 你需要的软件可能已经可以通过*快速简便方法*安装，请搜索以`python-`开头的包名。某些情况下，在虚拟环境中安装包可能是更好的选择。阅读：[何时应使用虚拟环境？]()\n\
    \n### 3.2.1 要求\n#### Python 包安装器（pip）\n要安装 pip，请按照安装软件的*快速简便方法*操作，搜索并安装`python3-pip`包。\n\
    \n#### 将$HOME/.local/bin添加到$PATH\n包含命令的包会将其安装在`$HOME/.local/bin`目录（*什么是$HOME？*）中。为了能方便地运行这些命令，你需要将这个目录添加到$PATH变量中，你可以按照*将目录添加到PATH*中的步骤操作。\n\
    > **注意：** *你不应在下面的命令中添加sudo。* 此方法仅在你的主目录中安装文件，因此不需要管理员权限。\n\n### 3.2.2 在PyPI上搜索包\n\
    在浏览器中打开PyPI网站<sup>17</sup>。在“搜索项目”字段中输入你要安装的软件名称，然后按ENTER键或点击搜索按钮（图55）。\n![](img/5d1416436999bb5232d6af690a9da18a_102_0.png)\n\
    > **图55：** 在PyPI上搜索包\n\n将显示与搜索词匹配的包列表（图56）。\n<sup>17</sup> https://pypi.org\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_103_0.png)\n图56：biopython的搜索结果。1.78是版本号。点击结果进入项目描述页面。\n\
    在项目描述页面中，找到`pip install`命令中的包名（图57），本例中是**biopython**。\n![](img/5d1416436999bb5232d6af690a9da18a_103_1.png)\n\
    > **图57：** Biopython的项目描述页面\n\n> **注意：** 以下步骤中你需要使用`pip3`而非`pip`命令。[原因？]()\n现在你可以开始安装该包了。\n\
    \n### 3.2.3 安装Python包\n打开终端，使用`pip3 install`命令加上你要安装的包名，以biopython为例：\n```bash\n\
    pip3 install biopython\n```\n输出：\n```bash\nCollecting biopython\nDownloading biopython-1.78-cp38-cp38-manylinux1_x86_64.whl\
    \ (2.3 MB) |********************| 2.3 MB 2.1 MB/s\nCollecting numpy\nDownloading\
    \ numpy-1.20.1-cp38-cp38-manylinux2010_x86_64.whl (15.4 MB) |********************|\
    \ 15.4 MB 90 kB/s\nInstalling collected packages: numpy, biopython\nSuccessfully\
    \ installed biopython-1.78 numpy-1.20.1\n```\n\n> **注意：** 此方法的一个限制是你无法安装同一个包的*多个版本*，这个问题可以通过使用*虚拟环境*解决。\n\
    \n### 3.2.4 更新已安装的包\n当你发现该包有可用更新时，可以在`install`命令后加上`-U`选项和包名来更新：\n```bash\npip3\
    \ install -U biopython\n```\n\n### 3.2.5 卸载已安装的包\n使用`uninstall`命令加上你要卸载的包名即可：\n\
    ```bash\npip3 uninstall biopython\n```\n\n### 3.2.6 使用已安装的包\n#### 文件安装在哪里？\n你可以使用`pip3\
    \ show`命令加上包名来查看其安装路径：\n```bash\npip3 show biopython\n```\n输出：\n```\nName: biopython\n\
    Version: 1.78\nSummary: Freely available tools for computational molecular biology.\n\
    Home-page: https://biopython.org/\nAuthor: The Biopython Contributors\nAuthor-email:\
    \ biopython@biopython.org\nLicense: UNKNOWN\nLocation: /home/user/.local/lib/python3.8/site-packages\n\
    Requires: numpy\nRequired-by: \n```\n安装路径会显示在Location关键字旁边。\n\n#### 使用Python包和模块\n\
    Python包和模块会安装在`$HOME/.local/lib/python3.8/site-packages`目录中。\n> **注意：** 这是Python\
    \ 3.8的路径，如果你安装的是其他版本的Python，该路径值会发生变化。此目录会自动添加到$PYTHONPATH中，因此你无需额外操作，就可以在脚本中导入和使用已安装的包和模块。例如，以下是一个简单的Python脚本，用于测试通过pip安装的BioPython：\n\
    ```python\nfrom Bio.Seq import Seq\nseq = Seq('ATGC')\ncomp = seq.complement()\n\
    print(f'The complement of {seq} is {comp}')\n```\nBio.Seq包是BioPython的一部分。复制上面的代码示例，将其保存为`biopy_test.py`，然后在终端中运行：\n\
    ```bash\npython3 biopy_test.py\n```\n输出：\n```\nThe complement of ATGC is TACG\n\
    ```\n\n#### 使用附带命令\n如果包附带命令，这些命令会安装在`$HOME/.local/bin`目录中。为了让这些命令易于调用，你需要按照*要求*部分所述，将该目录添加到PATH中。例如，当你安装*cutadapt*的Python包时，`cutadapt`命令会被安装到`$HOME/.local/bin`中，你可以在终端中像这样运行它：\n\
    ```bash\ncutadapt --version\n```\n输出：\n```\n3.1\n```\n\n### 3.2.7 Python虚拟环境\n\
    虚拟环境是一个*独立的*目录树，包含Python解释器以及一些额外的包。\n#### 优势\n以下是使用虚拟环境的*部分*优势。\n#### 无需管理员权限\n\
    创建虚拟环境或在环境中安装包都不需要管理员权限。\n#### 多环境支持\n可以创建多个虚拟环境，每个环境都包含各自独立的包集合。这些环境相互隔离，某个环境中的包可以安装、更新或卸载，不会影响其他环境。\n\
    #### 共享环境\n你可以将自己的配置分享给他人，他人就能复现出完全相同的包版本环境。\n#### 创建虚拟环境\n首先，按照*快速简便方法*搜索并安装`python3-venv`包，该包包含了创建虚拟环境所需的`venv`模块。你可以在任何有写入权限的目录中创建虚拟环境，例如你的主目录。为了演示，我将在我的主目录中创建一个名为`py3env`的虚拟环境。\n\
    ```bash\npython3 -m venv py3env\n```\n如果创建成功，你会在当前目录下看到名为`py3env`的目录，不会显示任何提示信息。\n\
    > **注意：** `python3`是运行Python 3解释器的命令，其完整路径为`/usr/bin/python3`。\n> **注意：** `venv`是用于创建虚拟环境的Python模块。\n\
    > **注意：** `-m`选项的作用是将`venv`模块作为脚本运行。\n\n在使用虚拟环境之前，你需要先激活它。\n#### 激活虚拟环境\n你需要先激活虚拟环境才能开始使用它。激活方法是在`source`命令后跟上虚拟环境中`activate`脚本的路径，例如要激活上一步创建的`py3env`，请使用以下命令：\n\
    ```bash\nsource py3env/bin/activate\n```\n此时你的shell提示符会发生变化，表明虚拟环境已激活，注意提示符开头的`(py3env)`标签：\n\
    ```bash\n(py3env) user@cookbook:~$\n```\n现在你就可以开始使用这个虚拟环境了。\n> **注意：** 在开始安装包之前，建议在新虚拟环境中安装（或升级）Python构建工具——pip、setuptools和wheel。这些构建工具是构建和安装来自PyPI及其他源的包所必需的，安装它们可以确保后续包的构建和安装不会出错。\n"
