    2. 获取最新版本的Galaxy

    3. 创建Python虚拟环境

    4. 启动Galaxy

    完成以上步骤后，你就可以在浏览器中打开Galaxy的网页界面，开始使用内置工具了。

    > **注意：** 要使用Galaxy提供的全部功能（例如安装额外工具），你还需要完成以下操作：

    5. 注册用户账号

    6. 为用户授予管理员权限


