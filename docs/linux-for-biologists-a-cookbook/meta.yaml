- md: "## Chapter 3. Getting software on Linux\n### 3.1.1 Requirements\n> **Attention:**\
    \ This procedure installs software in system paths and so requires administrator\
    \ privileges.\n### 3.1.2 Finding and installing software\nTo demonstrate the steps\
    \ involved, I will install *PyMOL* — a software for molecular visualization. You\
    \ can follow the same procedure for finding and installing other software available\
    \ in the repositories.\nOpen **Software Manager** by clicking on its icon in the\
    \ applications’ menu (Fig. 39). You can also launch it from the Administration\
    \ section of the applications’ menu.\n![](img/5d1416436999bb5232d6af690a9da18a_80_0.png)\n\
    **Fig. 39:** Click on Software Manager in applications’ menu\nWhen launched, you\
    \ will see its main window (Fig. 40).\n![](img/5d1416436999bb5232d6af690a9da18a_81_0.png)\n\
    **Fig. 40:** Main window of Software Manager\nIn the search bar, type pymol. In\
    \ some time, packages in repositories that match the search term i.e., pymol,\
    \ will be displayed below (Fig. 41).\n![](img/5d1416436999bb5232d6af690a9da18a_82_0.png)\n\
    **Fig. 41:** Search results for pymol\nClick on the first result — **Pymol**.\
    \ You will be taken to the package description page.\n> **Note:** Why not select\
    \ Python3-pymol? The description of the second result, *Python3-pymol* indicates\
    \ that it contains Python 3 *modules* for working with PyMOL, which is not what\
    \ we are looking for. If you are unsure, you can read the complete description\
    \ of the package on the next page and confirm if this is the package you would\
    \ like to install.\nIn the package description page, click on the **Install**\
    \ button (Fig. 42).\n![](img/5d1416436999bb5232d6af690a9da18a_83_0.png)\n**Fig.\
    \ 42:** Click on the Install button to install this package\nPyMOL is a molecular\
    \ graphics system targeted at medium to large biomolecules like proteins. It can\
    \ generate high-quality publication-ready molecular graphics images and animations.\n\
    \nFeatures include:\n- Visualization of molecules, molecular trajectories and\
    \ surfaces of crystallography data or orbitals\n- Molecular builder and sculptor\n\
    - Internal raytracer and movie generator\n- Fully extensible and scriptable via\
    \ a Python interface\n\nFile formats PyMOL can read include PDB, XYZ, CIF, MDL\
    \ Molfile, ChemDraw, CCP4 maps, XPLOR maps and Gaussian cube maps. http://www.pymol.org\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_83_1.png)\nA dialog window will now appear,\
    \ prompting you to enter *your password*. Type in your password and click on the\
    \ **Authenticate** button (Fig. 43).\n![](img/5d1416436999bb5232d6af690a9da18a_84_0.png)\n\
    **Fig. 43:** Type in your password and click on the Authenticate button\nInstallation\
    \ will now proceed. When installation is complete, you will notice two buttons\
    \ — Launch and Remove, in place of the Install button (Fig. 44).\n![](img/5d1416436999bb5232d6af690a9da18a_85_0.png)\n\
    **Fig. 44:** Installation complete. Notice the Launch and Remove buttons\nClick\
    \ on the Launch button. This will open the PyMOL program (Fig. 45).\n![](img/5d1416436999bb5232d6af690a9da18a_86_0.png)\n\
    **Fig. 45:** Main window of PyMOL\nAlternatively, you can search for the application\
    \ in the **Applications Menu** and launch it from there.\n> **Note:** For applications\
    \ that do not have a graphical user interface, the Launch button will not be present.\
    \ If the program includes any commands, you can access them in a *terminal* session.\n\
    ### 3.1.3 Removing installed software\nYou can follow these steps to remove software\
    \ installed from repositories.\nOpen Software Manager. Click on the settings button\
    \ in the main application window and then select Show installed applications (Fig.\
    \ 46).\n![](img/5d1416436999bb5232d6af690a9da18a_87_0.png)\n**Fig. 46:** From\
    \ Software Manager settings, select Show Installed Applications\nAlternatively,\
    \ you can type the name of the software in the search bar and then press the **ENTER**\
    \ key.\nIn the list of **Installed Applications**, click on the package you would\
    \ like to remove — Pymol, in this case (**Fig. 47**).\n![](img/5d1416436999bb5232d6af690a9da18a_88_0.png)\n\
    **Fig. 47:** Click on the package you would like to remove\nYou will be taken\
    \ to the package description page. Click on the **Remove** button to remove (or\
    \ uninstall) the package (**Fig. 48**).\n![](img/5d1416436999bb5232d6af690a9da18a_89_0.png)\n\
    **Fig. 48:** Click on the Remove button to remove the package\nYou will be prompted\
    \ to enter your password. Type in *your password* and then click on the **Authenticate**\
    \ button to proceed (Fig. 49).\n![](img/5d1416436999bb5232d6af690a9da18a_90_0.png)\n\
    **Fig. 49:** Type in your password and click on the Authenticate button\nThe software\
    \ will now be removed (or uninstalled) from the system.\n### 3.1.4 Updating installed\
    \ software\nWhen updates are available for software installed on your system,\
    \ you will see a notification in the system tray (Fig. 50).\n![](img/5d1416436999bb5232d6af690a9da18a_91_0.png)\n\
    To apply software updates: Click on the notification icon in system tray. This\
    \ will open the *Update Manager* program. To install all available software updates,\
    \ click on the *Install Updates* button in the toolbar (Fig. 51).\n![](img/5d1416436999bb5232d6af690a9da18a_92_0.png)\n\
    **Fig. 51:** Click on the **Install Updates** button to apply all available updates\n\
    You will be prompted to enter your password (Fig. 52). Type in *your password*\
    \ and click on the **Authenticate** button.\n![](img/5d1416436999bb5232d6af690a9da18a_93_0.png)\n\
    **Fig. 52:** Type in your password and click on the Authenticate button\nUpdate\
    \ Manager will now continue installing updates (Fig. 53).\n![](img/5d1416436999bb5232d6af690a9da18a_94_0.png)\n\
    **Fig. 53:** Update Manager installing software updates\nWhen the update process\
    \ is complete, you will see a message — Your system is up to date (Fig. 54).\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_95_0.png)\n**Fig. 54:** Updates installed\
    \ successfully\n### 3.1.5 Notes\n#### The command-line version (apt)\nYou can\
    \ use the `apt` package manager to install software from the command-line.\n####\
    \ Searching for software\nOpen a terminal to perform a search for matching packages\
    \ in the repositories. For example, here is a search for `pymol`:\n```apt search\
    \ pymol\n```\n> **Note:** You do not need to include sudo here. This will output\
    \ matching results from repositories, if any:\n```\np pymol - Molecular Graphics\
    \ System\np pymol-data - data files for PyMOL\np python3-pymol - Molecular Graphics\
    \ System (Python 3 module)\n```\nOnce you have identified the correct package\
    \ name — in this case, it is pymol — you can proceed towards installing the package.\n\
    #### Installing a package\nYou can install a package using the following command:\n\
    ```sudo apt install pymol\n```\n> **Attention:** You need to include sudo here.\
    \ Also, in the commands below, you will be asked to enter *your* password. You\
    \ will also need to confirm if you would like to continue with the changes. Type\
    \ y and then press the **ENTER** key to proceed.\n```\n[sudo] password for user:\n\
    Reading package lists... Done\nBuilding dependency tree\nReading state information...\
    \ Done\nThe following additional packages will be installed:\n  pymol-data python3-pymol\n\
    The following NEW packages will be installed:\n  pymol pymol-data python3-pymol\n\
    0 upgraded, 3 newly installed, 0 to remove and 4 not upgraded.\nNeed to get 0\
    \ B/5,192 kB of archives.\nAfter this operation, 19.8 MB of additional disk space\
    \ will be used.\nDo you want to continue? [Y/n] y\n```\n#### Removing an installed\
    \ package\nTo remove an installed package, use the command:\n```sudo apt remove\
    \ pymol\n```\nThe command above does not remove dependent packages. You can remove\
    \ them using:\n```sudo apt autoremove\n```\n#### Updating packages\nTo update\
    \ *all installed packages*, you can use these commands:\n```sudo apt update\n\
    sudo apt upgrade\n```\nTo update *a specific package* — if an update is available,\
    \ you can simply use `apt install` again:\n```sudo apt install package_name\n\
    ```"
  mdcn: "\n## 第3章 在Linux上安装软件\n### 3.1.1 要求\n> **注意：** 本流程会在系统路径中安装软件，因此需要管理员权限。\n\
    ### 3.1.2 查找并安装软件\n为了演示相关步骤，我将安装*PyMOL*——一款分子可视化软件。你可以按照同样的流程查找并安装软件仓库中的其他软件。\n\
    点击应用程序菜单中的图标打开**软件管理器**（图39），你也可以从应用程序菜单的“管理”板块启动它。\n![](img/5d1416436999bb5232d6af690a9da18a_80_0.png)\n\
    **图39：** 点击应用程序菜单中的软件管理器\n启动后你会看到它的主窗口（图40）。\n![](img/5d1416436999bb5232d6af690a9da18a_81_0.png)\n\
    **图40：** 软件管理器主窗口\n在搜索栏中输入pymol。片刻后，软件仓库中匹配搜索词（即pymol）的软件包会显示在下方（图41）。\n![](img/5d1416436999bb5232d6af690a9da18a_82_0.png)\n\
    **图41：** pymol的搜索结果\n点击第一个结果——**Pymol**，你会进入软件包描述页面。\n> **说明：** 为什么不选Python3-pymol？第二个结果*Python3-pymol*的描述显示它包含用于操作PyMOL的Python\
    \ 3 *模块*，这不是我们需要的。如果你不确定，可以在下一页阅读该包的完整描述，确认是否是你想要安装的包。\n在软件包描述页面，点击**安装**按钮（图42）。\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_83_0.png)\n**图42：** 点击安装按钮安装该包\nPyMOL是针对蛋白质等中等至大型生物分子的分子图形系统，能够生成可用于出版的高质量分子图形图像与动画。功能包括：\n\
    - 可视化分子、分子轨迹以及晶体学数据或轨道的表面\n- 分子构建与雕刻工具\n- 内置光线追踪器与影片生成器\n- 通过Python接口完全可扩展、可编写脚本\n\
    PyMOL可读取的文件格式包括PDB、XYZ、CIF、MDL Molfile、ChemDraw、CCP4地图、XPLOR地图和高斯立方地图。\nhttp://www.pymol.org\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_83_1.png)\n此时会弹出一个对话框，提示你输入*你的密码*，输入密码后点击**验证**按钮（图43）。\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_84_0.png)\n**图43：** 输入你的密码并点击验证按钮\n现在会开始安装流程，安装完成后，你会发现安装按钮的位置替换为了两个按钮——启动和移除（图44）。\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_85_0.png)\n**图44：** 安装完成，注意启动和移除按钮\n\
    点击启动按钮，即可打开PyMOL程序（图45）。\n![](img/5d1416436999bb5232d6af690a9da18a_86_0.png)\n\
    **图45：** PyMOL主窗口\n或者，你也可以在**应用程序菜单**中搜索该应用并从这里启动。\n> **说明：** 对于没有图形用户界面的应用，不会显示启动按钮。如果程序包含任何命令，你可以在*终端*会话中访问它们。\n\
    ### 3.1.3 卸载已安装的软件\n你可以按照以下步骤卸载从软件仓库安装的软件：\n打开软件管理器，点击主应用窗口中的设置按钮，然后选择“显示已安装应用”（图46）。\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_87_0.png)\n**图46：** 从软件管理器设置中选择显示已安装应用\n\
    或者，你也可以在搜索栏中输入软件名称，然后按**回车**键。\n在**已安装应用**列表中，点击你想要卸载的包——本例中为Pymol（**图47**）。\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_88_0.png)\n**图47：** 点击你想要卸载的包\n你会进入软件包描述页面，点击**移除**按钮即可卸载（或移除）该包（**图48**）。\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_89_0.png)\n**图48：** 点击移除按钮卸载该包\n系统会提示你输入密码，输入*你的密码*后点击**验证**按钮继续（图49）。\n\
    ![](img/5d1416436999bb5232d6af690a9da18a_90_0.png)\n**图49：** 输入你的密码并点击验证按钮\n该软件现在会从系统中被卸载（或移除）。\n\
    ### 3.1.4 更新已安装的软件\n当系统中有已安装软件的可用更新时，你会在系统托盘收到通知（图50）。\n![](img/5d1416436999bb5232d6af690a9da18a_91_0.png)\n\
    要应用软件更新：\n点击系统托盘中的通知图标，这将打开*更新管理器*程序。\n要安装所有可用的软件更新，点击工具栏中的*安装更新*按钮（图51）。\n![](img/5d1416436999bb5232d6af690a9da18a_92_0.png)\n\
    **图51：** 点击**安装更新**按钮以应用所有可用更新\n系统会提示你输入密码（图52），输入*你的密码*后点击**验证**按钮。\n![](img/5d1416436999bb5232d6af690a9da18a_93_0.png)\n\
    **图52：** 输入你的密码并点击验证按钮\n更新管理器现在会继续安装更新（图53）。\n![](img/5d1416436999bb5232d6af690a9da18a_94_0.png)\n\
    **图53：** 更新管理器正在安装软件更新\n更新过程完成后，你会看到提示——您的系统已是最新版本（图54）。\n![](img/5d1416436999bb5232d6af690a9da18a_95_0.png)\n\
    **图54：** 更新安装成功\n### 3.1.5 说明\n#### 命令行版本（apt）\n你可以使用`apt`包管理器从命令行安装软件。\n####\
    \ 搜索软件\n打开终端，在软件仓库中搜索匹配的软件包。例如，以下是对`pymol`的搜索：\n```apt search pymol```\n> **说明：**\
    \ 此处无需输入sudo。如果有匹配结果，会从软件仓库输出以下内容：\n``` \np pymol - Molecular Graphics System\n\
    p pymol-data - data files for PyMOL\np python3-pymol - Molecular Graphics System\
    \ (Python 3 module)\n```\n一旦你确认了正确的包名——本例中为pymol——就可以继续安装该包。\n#### 安装包\n你可以使用以下命令安装软件包：\n\
    ```sudo apt install pymol```\n> **注意：** 此处需要输入sudo。此外，在下方的命令中，系统会要求你输入*你的*密码，你还需要确认是否要继续执行变更，输入y后按**回车**键继续。\n\
    ```\n[sudo] password for user:\nReading package lists... Done\nBuilding dependency\
    \ tree       \nReading state information... Done\nThe following additional packages\
    \ will be installed:\n  pymol-data python3-pymol\nThe following NEW packages will\
    \ be installed:\n  pymol pymol-data python3-pymol\n0 upgraded, 3 newly installed,\
    \ 0 to remove and 4 not upgraded.\nNeed to get 0 B/5,192 kB of archives.\nAfter\
    \ this operation, 19.8 MB of additional disk space will be used.\nDo you want\
    \ to continue? [Y/n] y\n```\n#### 卸载已安装的软件包\n要卸载已安装的软件包，使用以下命令：\n```sudo apt remove\
    \ pymol```\n上述命令不会卸载依赖的软件包，你可以使用以下命令卸载它们：\n```sudo apt autoremove```\n#### 更新软件包\n\
    要更新*所有已安装的软件包*，你可以使用以下命令：\n```sudo apt update\nsudo apt upgrade```\n要更新*特定软件包*——如果有可用更新，你可以再次使用`apt\
    \ install`命令：\n```sudo apt install package_name```\n"
