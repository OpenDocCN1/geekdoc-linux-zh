    ## 5 Galaxy入门

    Galaxy<sup>32</sup>项目支持研究者通过网页界面完成计算分析。你可以在线使用http://usegalaxy.org/上的服务，或是其他任意可用的公共服务器<sup>33</sup>上的服务。支撑这些服务器的软件基于开源许可发布，你可以下载该软件并在自己的电脑上搭建本地实例。

    > 32 https://galaxyproject.org/

    > 33 https://galaxyproject.org/use/


    ## 5.1 为什么要使用Galaxy？

    使用Galaxy有以下*部分*优势：

    - **上传你的数据** — 并通过*网页界面*完成分析。

    - **使用内置工具** — 或从Galaxy工具库安装额外工具（需要*本地实例*）。

    - **使用历史记录** — 该功能可以追踪你运行的作业¹，让你可以在之后重新运行这些作业（保证结果可复现）。

    - **创建工作流** — 通过组合多个工具实现，一个工具的输出可以作为另一个工具的输入。

    - **共享你的数据** — 可以与其他用户共享历史记录、工作流等内容。

    > ¹ 作业运行时会附带额外的参数（如有），以及输入和输出文件的路径。


    ### 5.1.1 你可以用Galaxy做什么？

    使用Galaxy可以完成以下任务：

    - 从各类来源（数据库）获取数据

    - 处理文本数据

    - 转换文件格式

    - 统计分析

    - 排序和筛选数据

    > **注意：** 《使用Linux命令行》一章中的*练习*可以用Galaxy复现，无需使用命令行或安装软件。你只需要准备输入数据——查询序列和蛋白质序列数据库即可。


    ### 5.1.2 为什么要本地运行Galaxy？

    在自己的电脑上运行Galaxy（即*本地实例*）有以下优势：

    - **数据本地存储** — 数据会存储在你的电脑上，而如果使用公共实例，数据会存储在服务器上，可能未加密$^2$。

    - **访问更多工具** — 可以在本地实例上安装公共服务器未安装的工具。

    - **CPU和存储限制** — 取决于你的电脑配置，而公共服务器会对每个用户的CPU和存储使用量设置限制$^2$。

    > $^2$ 上述情况适用于https://usegalaxy.org——Galaxy的主实例。更多相关信息请查阅https://galaxyproject.org/main/#user-data-and-job-quotas。


    ## 5.2 在你的电脑上运行Galaxy

