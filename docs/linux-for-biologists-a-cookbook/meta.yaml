  md: '# **1.1 Who is it for?**


    If you are a student or a researcher in biological sciences and are new to Linux,
    this book will help you get started quickly.


    The primary focus is in using graphical user interfaces (GUIs) to accomplish tasks,
    but I have also included methods using the command line interface.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 1.2 What you will learn


    Using the included recipes, you will learn how to:


    +   - Run Linux on your computer

    - Use the desktop and included software

    - Work with files and directories

    - Search and install software

    - Run some basic commands

    - Run the Galaxy platform on your computer


    > **Note:** *If you need help while following this book...*


    You can visit the forums of this book on Leanpub. If your query is not answered
    there, please start a new discussion.


    https://community.leanpub.com/c/linuxforbiologi'
  merge: -1
