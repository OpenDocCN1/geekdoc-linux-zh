  md: '# **Using Python packages and modules**


    Python packages and modules will be installed in $HOME/.local/lib/python3.8/site-packages.


    **Note:** This is the path for Python 3.8.


    If you have a different version of Python installed, this value will change.


    This directory will be automatically included in $PYTHONPATH. So, you can import
    and use installed packages and modules in your scripts, without any extra effort.


    For example, here is a simple Python script to test BioPython installed using
    pip:


    ```

    ```python

    from Bio.Seq import Seq


    seq = Seq(''ATGC'')

    comp = seq.complement()


    print(f''The complement of {seq} is {comp}'')

    ```

