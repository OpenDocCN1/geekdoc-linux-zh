  md: '# ## 4.2.4 cd — change directory


    To change into a directory, use cd followed by the name of that directory.


    For example, to change into /home/user/Downloads, use:


    ```

    cd Downloads

    ```


    > **Note:** When you log in or open a new terminal window, you will be placed
    in your home directory — /home/user, where user is your username.


    You can verify your current directory using the pwd command discussed earlier:


    ```

    pwd

    ```


    ```

    /home/user/Downloads

    ```


    # ### cd with no arguments


    No matter where you are in the file system, typing cd *without any arguments*
    will take you to your home directory.


    ```

    user@cookbook:/usr/share/dict$ cd

    user@cookbook:~$

    ```'
  merge: -1
