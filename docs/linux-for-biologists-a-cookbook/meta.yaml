    ## 4.6.2 Dealing with spaces in file names

    When you create a new file or directory, it is a good idea to *not use spaces*
    in the file or directory name. This is especially useful while working with these
    files or directories in the command-line. Instead, you can use an underscore (_)
    or hyphen (-) to separate words in file names.


    If you do have to work with file or directory names containing spaces, you can
    use quotes around the file or directory name. For example:

    ```bash

    mkdir "Sample Data"

    ```

    To change into the Sample Data directory, use:

    ```bash

    cd "Sample Data"

    ```

    Print current directory:

    ```bash

    pwd

    ```

    Output:

    ```

    /home/user/Sample Data

    ```

    This would have been simpler if the directory name is `sample-data`. You will
    not need to use quotes in that case.


    ## 5 Getting started with Galaxy

    The Galaxy<sup>32</sup> project enables researchers to perform computational analyses
    using a web interface. You can use the service online at http://usegalaxy.org/
    or any of the other available public servers<sup>33</sup>. The software powering
    the servers itself, is available under an open-source licence. You can download
    it and set up a local instance on your computer.


    > 32 https://galaxyproject.org/

    > 33 https://galaxyproject.org/use/


    ## 5.1 Why use Galaxy?

    These are *some* advantages of using Galaxy. You can:

    - **Upload your data** — and perform analysis using a *web interface*.

    - **Use included tools** — or install additional ones from the Galaxy tool shed
    (needs a *local instance*).

    - **Use history** — functionality to keeps track of the jobs¹ you run. This gives
    you the possibility to run them again at a later time (reproducibility).

    - **Create workflows** — by combining multiple tools. The output of one tool can
    be used as input for another.

    - **Share your data** — with other users. This includes histories, workflows etc.,


    > ¹ Commands run with additional arguments, if any, along with input and output
    file paths.


    ### 5.1.1 What can you use Galaxy for?

    These are some tasks you can accomplish using Galaxy:

    - Get data from various sources (databases)

    - Manipulate text data

    - Convert between file formats

    - Statistics

    - Sort and filter data


    > **Note:** The *exercise* in *Using the Linux command line* chapter, can be reproduced
    using Galaxy, without the need to use the command line or install software. You
    only need your input data — query sequence and the protein sequence database.


    ### 5.1.2 Why run Galaxy on your computer?

    Running Galaxy on your computer i.e., a *local instance*, has some advantages:

    - **Data storage is local** — on your computer, whereas, if you use a public instance,
    it will be stored on a server, possibly unencrypted$^2$.

    - **Access more tools** — that are not installed on public servers by installing
    them on your local instance.

    - **CPU and storage limits** — are dependent on your computer, whereas on public
    servers, there are limits on CPU and storage usage per user$^2$.


    > $^2$ This is the case on https://usegalaxy.org — the main Galaxy instance. For
    more information, please read the https://galaxyproject.org/main/#user-data-and-job-quotas.


    ## 5.2 Running Galaxy on your computer

    To run a local instance of Galaxy on your computer, you will need to:

    1. Check if your computer meets all requirements

    2. Get the latest release of Galaxy

    3. Create a Python virtual environment

    4. Start Galaxy


    At this stage, you will be able to open Galaxy''s web interface in a browser and
    start using the tools included.


    > **Note**: To make use of all the features that Galaxy offers like installing
    additional tools, you will also need to do the following:

    5. Register a user account

    6. Grant administrator privileges for user


    ### 5.2.1 Check system requirements

    Before running Galaxy, you will need to:

    1. Install Git and Python virtualenv module

    2. Check if there is enough free disk space

    3. Ensure that a Conda environment is not active


    #### Install Git and Python virtualenv module

    Git is necessary for getting the latest version of Galaxy''s source code from
    GitHub. Python virtualenv module is necessary to set up an isolated virtual environment
    for running Galaxy.


    To install them, use *Software Manager* or *apt*, and search and install the following
    packages:

    1. git

    2. python3-venv


    #### Check free disk space

    You will need *at least* 5 GB of free disk space for the initial setup. More space
    will be needed for your analyses and for the tools you might install from the
    Galaxy tool shed.


    To check available disk space, you can use the Disk Usage Analyzer application
    or the `df` command.


    #### Ensure a Conda environment is not active

    **Note:** If you are not using Conda, you can ignore this requirement and proceed
    to the next step: → [Getting the latest release of Galaxy](#)


    If you are using Conda, please make sure an environment is not active before the
    *Starting Galaxy* step. You can deactivate an active Conda environment using the
    command:

    ```bash

    conda deactivate

    ```

    Although it is possible to install Galaxy using an existing Conda installation,
    it is simpler to create and use a virtual environment using Python’s venv module.


    With all the requirements satisfied, you can proceed towards getting the latest
    release of Galaxy using Git.


    ### 5.2.2 Getting the latest release of Galaxy

    Create a directory to set up Galaxy and change into it:

    ```bash

    mkdir ~/programs

    cd ~/programs

    ```

    Here ~ is a shortcut for your home directory.


    > **Note:** This directory is not specific for Galaxy. You can use it for installing
    or storing other programs too.


    Get the latest release of Galaxy from the project''s repository on GitHub. The
    latest release at the time of this writing is 21.01. You can get (or clone) the
    repository using the `git clone` command:

    ```bash

    git clone -b release_21.01 https://github.com/galaxyproject/galaxy.git

    ```

    The `-b` option of `git clone`, checks out the specified Git branch — release_21.01
    in this case.


    Output:

    ```bash

    Cloning into ''galaxy''...

