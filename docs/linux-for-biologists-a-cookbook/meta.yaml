    # Download query sequence


    The protein query sequence used in this exercise is *Spike glycoprotein* from
    Severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2). It is available
    from UniProtKB²⁷ — the protein knowledge base.


    The database identifier for this protein is P0DTC2²⁸. You can download the sequence
    in FASTA format from the entry page or using this direct link:


    https://www.uniprot.org/uniprot/P0DTC2.fasta


    # Download protein database


    The database used in this exercise is UniProtKB *Swiss-Prot*²⁹. It is a manually
    annotated database of protein sequences with added functional information.


