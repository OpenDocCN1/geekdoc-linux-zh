    # ## 2.4.10 Notes


    # ### Adding an application to favourites


    If you use an application frequently, you can consider adding it to favourites.
    This list is on the left side of the applications'' menu.


    To favourite an application, right-click on the application name in applications
    menu and select **Add to favorites**.


    Alternatively, you can choose the **Add to panel** action, which will add the
    application to your Panel. Some applications are visible in the Panel by default
    — a Show Desktop applet, Firefox browser, Terminal, and Files.


    # ### Setting default applications


    If you would like to set default applications for certain categories or file types,
    you can do so in System Settings under:


    +   - Preferences → Preferred applications'
