    ## **6.1.3 Integrating Zotero in LibreOffice**

    To be able to insert citations and bibliography in your documents, you will need
    to install the Word Processor Add-in.


    ### **Installing Word Processor add-in**

    To install the add-in in LibreOffice:

    1. From the main menu bar of Zotero, select Edit → Preferences (Fig. 100).

    ![](img/5d1416436999bb5232d6af690a9da18a_276_0.png)

    > Fig. 100: Viewing Zotero preferences

    2. In the Zotero Preferences dialog window that opens, click on the Cite tab.
    Now, click on the Word Processors tab to select it.


    Click on the Install LibreOffice Add-in button (Fig. 101).

    ![](img/5d1416436999bb5232d6af690a9da18a_277_0.png)

    **Fig. 101:** Installing LibreOffice Add-in from Zotero preferences.


    3. The Zotero LibreOffice Plugin Installation wizard will now open (Fig. 102).

    ![](img/5d1416436999bb5232d6af690a9da18a_278_0.png)

    **Fig. 102:** Zotero LibreOffice Plugin Installation wizard.


    Click on the **Next** button to proceed.

    4. Click on **Manual Installation** in the **Select LibreOffice Installation**
    dialog window (Fig. 103).

    ![](img/5d1416436999bb5232d6af690a9da18a_279_0.png)

    **Fig. 103:** Click on the Manual Installation button.

    5. A file browser window will open, with the directory set to the location of
    the add-in file — Zotero_OpenOffice_Integration.oxt (Fig. 104).

    ![](img/5d1416436999bb5232d6af690a9da18a_280_0.png)

    **Fig. 104:** File browser open with location of the Add-in file.

    6. *Double-click* on Zotero_OpenOffice_Integration.oxt. This will open LibreOffice
    Extension Manager, with a prompt requesting if you would like to install the add-in.
    Click on the **OK** button to confirm (Fig. 105).

    ![](img/5d1416436999bb5232d6af690a9da18a_281_0.png)

    **Fig. 105:** Click on the OK button in LibreOffice Extension Manager.


    The add-in will now be installed (Fig. 106).

    ![](img/5d1416436999bb5232d6af690a9da18a_282_0.png)

    **Fig. 106:** Zotero LibreOffice Add-in installed successfully.


    If you *restart* LibreOffice, you will notice the Zotero toolbar in the main window
    (Fig. 107).

    ![](img/5d1416436999bb5232d6af690a9da18a_283_0.png)

    **Fig. 107:** Zotero toolbar in LibreOffice.


    You can now start inserting citations and bibliographies in your documents.


    ## **6.2 Creating a notebook using Zim**

    Zim is a *GUI* application for taking notes on the desktop. You can use it to
    create and maintain a personal or laboratory notebook on your computer.


    ### **6.2.1 Features of Zim**

    Using Zim, you can:

    - **Create digital notebooks** — add pages, and organize them using an index page.

    - **Take notes quickly** — using a WYSIWYG (What You See Is What You Get) interface¹.

    - **Insert images** — files, symbols, screenshots, equations and more².

    - **Export notes** — to formats like HTML, LaTeX, and Markdown.

    - With the help of plugins, you can add even more functionality.


    > ¹ Similar in functionality to that of word processors like LibreOffice Writer.
    You do not need to learn a new markup language to use Zim.

    > ² Requires enabling plugins in preferences.


    ### **6.2.2 Installing Zim**

    Zim is available in the distribution repositories. You can install it using *Software
    Manager* (Fig. 108).

    ![](img/5d1416436999bb5232d6af690a9da18a_286_0.png)

    > **Fig. 108:** Installing Zim using Software Manager.


    ### **6.2.3 Creating a notebook**

    Open Zim by clicking on its icon in applications menu (Fig. 109). You can use
    the search bar to locate it quickly.

    ![](img/5d1416436999bb5232d6af690a9da18a_287_0.png)

    **Fig. 109:** Opening Zim from applications menu.


    When you open the program for the first time, you will notice an Add Notebook
    dialog (Fig. 110). Here, you can set a name for this notebook and select a directory
    to save notebooks.

    ![](img/5d1416436999bb5232d6af690a9da18a_288_0.png)

    **Fig. 110:** Add notebook.


    You can accept the defaults. Click on the OK button to proceed. This will open
    the main window of the program (Fig. 111).

    ![](img/5d1416436999bb5232d6af690a9da18a_289_0.png)

    **Fig. 111:** Main window of Zim.


    ### **6.2.4 Taking notes**

    The *Home* page is the main page of a notebook. You can start typing your notes
    here. Zim saves changes automatically.


    ### **Basic text formatting**

    Formatting text in Zim is similar to that of word processor programs. You can
    use the **Format** menu bar entry and select the desired option (Fig. 112).

    ![](img/5d1416436999bb5232d6af690a9da18a_291_0.png)

    > Fig. 112: Options for formatting text.


    ### **Keyboard shortcuts**

    Alternatively, you can use keyboard shortcuts to apply formatting to your text.
    For example:

    ```

    Bold : Ctrl + b

    ```

    ```

    Italic or Emphasis : Ctrl + i

    ```

    ```

    Superscript : Ctrl + Shift + p

    ```

    ```

    Subscript : Ctrl + Shift + b

    ```


    For headings, use:

    - Heading 1: `Ctrl + 1`

    - Heading 2: `Ctrl + 2`

    - Heading 3: `Ctrl + 3`

    - Heading 4: `Ctrl + 4`

    - Heading 5: `Ctrl + 5`


    ### **Inserting images**

    To insert an image, you can select the following option from the menu bar:

    #### **Insert → Image**

    In the dialog that opens, browse to the directory containing your image and then
    select the image (Fig. 113).

    ![](img/5d1416436999bb5232d6af690a9da18a_292_0.png)

    **Fig. 113:** Insert image. Check *Attach image first* option.


    Check the *Attach image first* option. This will copy the image to your notebook
    directory. Click on the Open button to insert the image (Fig. 114).

    ![](img/5d1416436999bb5232d6af690a9da18a_293_0.png)

    **Fig. 114:** Image inserted into current page.


    ### **Resizing an image**

    If you would like to resize the image, *right-click* on the image and select Edit
    Properties (Fig. 115).

    ![](img/5d1416436999bb5232d6af690a9da18a_294_0.png)

    > **Fig. 115:** Edit image properties.


    In the dialog window that opens, change either the **Width** or the **Height**
    of the image to the desired size and click on the **OK** button (Fig. 116).

    ![](img/5d1416436999bb5232d6af690a9da18a_295_0.png)

    **Fig. 116:** Change the width or height of the image.


    The image will now be resized (Fig. 117).

    ![](img/5d1416436999bb5232d6af690a9da18a_296_0.png)

    **Fig. 117:** Resized image.


    ### **Adding more pages**

    To add more pages, select the following option from the menu bar (Fig. 118):

    - File → New Page


    > **Note:** You can also *right-click* on a page in the **Index** view and select
    the **New Page Here** option.

    ![](img/5d1416436999bb5232d6af690a9da18a_297_0.png)

    **Fig. 118:** Adding a new page.


    Enter a name for the page in the New Page dialog window (Fig. 119) and click on
    the OK button.

    ![](img/5d1416436999bb5232d6af690a9da18a_298_0.png)

    **Fig. 119:** Enter a name for the new page.


    The new page will appear in the **Index** view (Fig. 120).

    ![](img/5d1416436999bb5232d6af690a9da18a_299_0.png)

    **Fig. 120:** Newly added page.


    ### **Adding subpages**

    A subpage will be placed under an *existing* page. To add a new subpage:

    1. Select an existing page in **Index** view

    2. Select **File** → **New Sub Page** from the menu bar

    3. Enter a name for the page and click on the **OK** button'
