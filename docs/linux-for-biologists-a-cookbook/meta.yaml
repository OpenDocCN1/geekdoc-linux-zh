    由于`local-lib`会自动发现这些模块，你可以立即在脚本中使用它们。下面是一个使用`Bio::Phylo`包的示例。使用`cpanm Bio::Phylo`安装该模块后，用文本编辑器创建一个文件，并复制以下内容：

    ```perl

    use Bio::Phylo;

    # print version

    print Bio::Phylo->VERSION;

    # print citation

    print Bio::Phylo->CITATION;

    ```

    将文件保存为`biophylo_test.pl`，然后运行它：

    ```bash

    perl biophylo_test.pl

    ```

    输出：

    ```perl

    v2.0.1

    Rutger A Vos, Jason Caravas, Klaas Hartmann, Mark A Jensen and Chase Miller, 2011.

    Bio::Phylo - phyloinformatic analysis using Perl.

    BMC Bioinformatics 12:63.

    doi:10.1186/1471-2105-12-63

    ```

    ## 3.4 R 包

    如果你关注的软件在*CRAN*或*Bioconductor*上以R包的形式提供，你可以分别使用`install.packages()`或`BiocManager::install()`命令来安装它。

    > **注意：** 你的软件可能已经可以通过*快速简便方法*获取。请搜索以`r-cran-`或`r-bioc-`开头的包名。

    ### 3.4.1 要求

    **已安装 r-base 包**

    r-base包提供了*GNU R*统计计算与图形系统。如果你尚未安装它，请遵循*快速简便方法*，搜索并安装r-base包。

    > **注意：** *你不应该在下面的命令中添加sudo。* 该方法仅在你的主目录中安装文件，因此不需要管理员权限。

    ### 3.4.2 启动R会话

    要启动R会话，请打开终端窗口。输入R命令并按ENTER键。

    ```bash

    user@cookbook:~$ R

    ```

    你将进入R会话界面，会显示一些附加信息，包括已安装的R版本。你可以在`>`提示符处输入R命令。

    ```r

    R version 3.6.3 (2020-02-29) -- "Holding the Windsock"

    Copyright (C) 2020 The R Foundation for Statistical Computing

    → Computing Platform: x86_64-pc-linux-gnu (64-bit)

    R is free software and comes with ABSOLUTELY NO WARRANTY.

    You are welcome to redistribute it under certain conditions.

    Type ''license()'' or ''licence()'' for distribution details.

    Natural language support but running in an English locale

    R is a collaborative project with many contributors.

    Type ''contributors()'' for more information and ''citation()'' on how to cite
    R or R packages in publications.

    Type ''demo()'' for some demos, ''help()'' for on-line help, 🛈 or ''help.start()''
    for an HTML browser interface to help.

    Type ''q()'' to quit R.

    ```

    # 生物学家Linux指南

    ### 3.4.3 从CRAN安装包

    你可以在CRAN上查阅按分类列出的任务视图<sup>18</sup>或可用包列表<sup>19</sup>（当前共有17157个包）来搜索R包。确定要安装的包后，你可以按照以下步骤进行安装。下面我将以安装<em>edgeR</em>包为例。

    - **1. 使用`install.packages()`命令安装包**

    启动R会话。在提示符处，输入带引号的包名的`install.packages()`命令。例如：

    ```r

    install.packages("BiocManager")

    ```

    按下ENTER键继续。

    - **2. 确认使用个人库**

    你会看到一个提示，要求你确认是否要使用个人库：

    ``` Installing package into ''/usr/local/lib/R/site-library'' (as ''lib'' is unspecified)
    ```

    > <sup>18</sup> [任务视图](https://cran.r-project.org/web/views/)

    > <sup>19</sup> [可用包列表](https://cran.r-project.org/web/packages/available_packages_by_name.html)

    ``` Warning in install.packages("BiocManager") : ''lib = "/usr/local/lib/R/site-library"''
    is not writable Would you like to use a personal library instead? (yes/No/ cancel)
    yes ```

    输入yes确认，然后按ENTER键。

    - **3. 必要时创建个人库**

    如果你从未安装过包，个人库目录将不存在。这种情况下，你会被提示确认是否要创建它：

    ```r

    Would you like to create a personal library ''~/R/x86_64-pc-linux-gnu-library/3.6''
    to install packages into? (yes/No/cancel) yes

    ```

    输入yes确认，然后按ENTER键。

    > **注意：** 下次安装包时，你不会再看到这个提示。

    - **4. 包安装摘要**

    现在应该开始安装：

    ```r

    trying URL ''https://cloud.r-project.org/src/contrib/BiocManager_1.30.10.tar.gz''

    Content type ''application/x-gzip'' length 40205 bytes (39 KB)

    ==================================================

    downloaded 39 KB

    * installing *source* package ‘BiocManager’ ...

    ** package ‘BiocManager’ successfully unpacked and MD5 sums checked

    ** using staged installation

    ** R

    ** inst

    ** byte-compile and prepare package for lazy loading

    ** help

    *** installing help indices

    ** building package indices

    ** installing vignettes

    ** testing if installed package can be loaded from temporary location

    ** testing if installed package can be loaded from final location

    ** testing if installed package keeps a record of temporary installation path

    * DONE (BiocManager)

    ```

    下载的源包位于''/tmp/RtmpDgm0Z8/downloaded_packages''目录下。如果过程中没有出现错误，说明包安装成功。

    ### 3.4.4 从Bioconductor安装包

    你可以在网站上搜索Bioconductor软件包列表<sup>20</sup>（当前共有1974个包）。确定要安装的包后，你可以按照以下步骤进行安装。下面我将以安装<em>edgeR</em>包为例。

    - **使用`BiocManager::install()`命令安装包**

    1. 启动R会话。

    2. 安装BiocManager包。从Bioconductor仓库安装R包时必须先执行这一步。

    > **注意：** 你只需要执行一次该操作。下次想要从Bioconductor安装包时，可以直接跳到第3步。

    3. 在R提示符处，使用带引号的你要安装的包名的`BiocManager::install()`命令。例如：

    ```r

    BiocManager::install("edgeR")

    ```

    按下ENTER键继续。

    > <sup>20</sup> [Bioconductor软件包列表](https://www.bioconductor.org/packages/release/BiocViews.html#__Software)

    现在将下载、编译并安装该包及其依赖项。

    ```r

    Bioconductor version 3.10 (BiocManager 1.30.10), R 3.6.3 (2020-02-29)

    Installing package(s) ''BiocVersion'', ''edgeR''

    also installing the dependencies ''limma'', ''locfit'', ''Rcpp'' ...

    ** testing if installed package can be loaded from temporary location

    ** checking absolute paths in shared objects and dynamic libraries

    ** testing if installed package can be loaded from final location

    ** testing if installed package keeps a record of temporary installation path

    * DONE (edgeR)

    ```

    如果过程中没有出现错误，说明包安装成功。

    ### 3.4.5 更新R包

    当包有可用更新时，使用以下命令进行更新。对于从CRAN安装的包：

    ```r

    install.packages("BiocManager")

    ```

    对于从Bioconductor安装的包：

    ```r

    BiocManager::install("edgeR")

    ```

    ### 3.4.6 卸载R包

    要卸载已安装的包，请使用带引号的包名的`remove.packages()`命令。例如：

    ```r

    remove.packages("BiocManager")

    ```

    ### 3.4.7 注意事项

    - **r-base-dev和build-essential包**

    如果你要从CRAN及其他来源安装额外包，你还需要安装`r-base-dev`和`build-essential`包。不过，安装`r-base`时，这些包会作为依赖项一并安装，因此你无需手动安装它们。

    - **为什么要使用个人库？**

    安装包时，R会首先尝试使用系统库——例如`/usr/local/lib/R/site-library`。该路径仅可由拥有管理员权限的用户修改。因此，`$HOME`目录下的个人库是用户安装包的更优选择。

