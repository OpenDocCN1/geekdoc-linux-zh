    - **Use history** — functionality to keeps track of the jobs¹ you run. This gives
    you the possibility to run them again at a later time (reproducibility).

    - **Create workflows** — by combining multiple tools. The output of one tool can
    be used as input for another.

    - **Share your data** — with other users. This includes histories, workflows etc.,


    > ¹ Commands run with additional arguments, if any, along with input and output
    file paths.'
