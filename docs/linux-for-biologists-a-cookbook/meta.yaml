    # ## 4.6.1 Adding directories to PATH


    The PATH variable stores the list of directories that will be searched to locate
    commands you type. If you have a *command* that is stored in a directory that
    is not on this list, you will need to add it to `PATH`.


    You can display the current value of `PATH` using the *echo* command:


    ```

    echo $PATH

    ```


    Output:


    ```

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:

    `bin:/usr/games:/usr/local/games:/snap/bin

    ```


    To modify PATH and add a directory, you can follow the steps below. This example
    adds */home/user/.local/bin* to PATH.


    > **Attention:** You will need to be careful while editing *PATH*.


    You will also need to ensure that it includes $PATH in the list. Otherwise, you
    will not be able to access any commands!


    +   1. Open $HOME/.bashrc in a text editor.

    2. Add the following lines at the end of the file. Add the directory you wish
    to add separated by a colon. The list should end in $PATH.'
