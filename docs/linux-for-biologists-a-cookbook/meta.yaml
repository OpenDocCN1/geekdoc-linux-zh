    ## 4.2.4 cd — change directory

    To change into a directory, use `cd` followed by the name of that directory. For
    example, to change into `/home/user/Downloads`, use:

    ```bash

    cd Downloads

    ```

    > **Note:** When you log in or open a new terminal window, you will be placed
    in your home directory — `/home/user`, where `user` is your username. You can
    verify your current directory using the `pwd` command discussed earlier:

    ```bash

    pwd

    ```

    ```

    /home/user/Downloads

    ```

    ### Go to parent directory

    Use `cd ..` to go to the parent directory. For example, when you are in `/home/user/Downloads`
    and type:

    ```bash

    cd ..

    ```

    You will be taken to `/home/user`. A single dot (`.`) refers to the *current*
    directory.


    ## 4.2.5 mkdir — create new directory

    Use `mkdir` followed by the name of the directory you would like to create:

    ```bash

    mkdir Workspace

    ```

    > **Attention:** *The directory you''re creating must not already exist or this
    command will not work.* As discussed *earlier*, directory names are case-sensitive,
    so a directory named `Workspace` is different from another named `workspace`.

    #### Spaces in directory names

    If there are spaces in the directory name, use double quotes, for example:

    ```bash

    mkdir "Project Work"

    ```

    Without that, two separate directories — `Project` and `Work` will be created.


    ## 4.2.6 rmdir — remove empty directory

    Use `rmdir` followed by the name of the directory you would like to remove:

    ```bash

    rmdir Workspace

    ```

    > **Attention:** *This directory must be empty before it can be removed.* There
    should be no other files or directories within that directory.


    ## 4.2.7 ls — list files

    To list files in a directory, use the `ls` command:

    ```bash

    ls

    ```

    **Output:**

    ```

    Desktop

    Documents

    Downloads

    Music

    Pictures

    Public

    Templates

    Videos

    ```

    ### Listing hidden files

    You can provide additional options to `ls`. It will change how the command works.
    For example, to display hidden files and directories too, use:

    ```bash

    ls -a

    ```

    **Output:**

    ```

    .

    .cache

    Downloads

    .local

    Public

    ..

    .cinnamon

    .gnupg

    .bash_history

    .config

    .bash_logout

    Desktop

    Pictures

    .var

    Videos

    .bashrc

    Documents

    .linuxmint

    .profile

    .Xauthority

    ```

    ### Getting a detailed file listing

    To get a detailed listing of files, use:

    ```bash

    ls -l

    ```

    Output:

