    When your work is complete, you can deactivate an environment. To do so, use the
    command:


    ```

    conda deactivate

    ```


    Your shell prompt will change to its default state i.e., without the name of the
    Conda environment — (blast) in this case.


    # ## Removing an environment


    To remove an environment, when you no longer need it, use the command:


    ```

    conda remove -n blast --all

    ```


    Here -n is used to indicate the name of environment you would like to remove and
    --all removes all packages installed in that environment.'
  merge: -1
