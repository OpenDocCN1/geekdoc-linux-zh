  md: '# ## Why is this a quick and easy method?


    You can use a graphical user interface (Software Manager) or the command-line
    (apt) to install software available in Linux pack-age repositories.


    Software installed in this manner will also be kept updated along with the rest
    of the system.


    # ## Additional software repositories


    It takes some time for newer versions of software to become available in distribution
    repositories.


    If your software of interest is not available or if you need a more recent version
    of the software, you could try installing them from these additional sources:


    +   - *Python* packages from *PyPI*

    - *Perl* modules from *CPAN*

    - *R* packages from *CRAN* or *Bioconductor*

    - *Conda* packages from *Anaconda Cloud*


    > **Attention:** Software installed using these methods, will also need to be
    kept updated manually.'
