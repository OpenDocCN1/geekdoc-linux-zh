- md: "## 4.3.4 free — view free and used memory\nWith free, you can find the amount\
    \ of free and used memory (RAM (Random Access Memory)) and swap space.\n\nUsage:\n\
    ```bash\nfree -h\n```\n\nOutput:\n```text\ntotal used free shared buff/cache\n\
    Mem: 3.8Gi 618Mi 1.3Gi 7.0Mi 1.9Gi\nSwap: 979Mi 0B 979Mi\n```\n\nThe `-h` option\
    \ makes the output human-readable with corresponding units displayed. In the example\
    \ above, the amount of free physical memory (RAM) is 1.3 GiB (Gibibytes).\n\n\
    ## 4.3.5 `locate` — find files using their names\nSearch for files using their\
    \ file names. This method is quick as it uses a file name database. For example:\n\
    \n```bash\nlocate bashrc\n```\n\nOutput:\n```bash\n/etc/bash.bashrc\n/etc/skel/.bashrc\n\
    /home/user/.bashrc\n...\n```\n\n> **Note:** This method might not find files that\
    \ were created or modified recently. Newer files might not yet be included in\
    \ the database. To update the database manually, you can run the command:\n```bash\n\
    sudo updatedb\n```\nAlternatively, you can use the *find* command to search for\
    \ new files.\n\n### 4.3.6 which — locate a command\nThe `which` command prints\
    \ the complete path to a command, if it exists in the search path i.e., `$PATH`.\
    \ For example:\n\n```bash\nwhich python3\n```\n\nOutput:\n```text\n/usr/bin/python3\n\
    ```\n\n## 4.4 Editing text files using nano\n*GNU nano* is a command-line text\
    \ editor with features like undo/redo, syntax colouring, interactive search and\
    \ replace and more. To open the program, type `nano` in a terminal session.\n\n\
    ### 4.4.1 Create new file\nTo create a new file, use `nano` followed by the name\
    \ of the file you would like to create. For example:\n```bash\nnano exercise.txt\n\
    ```\nThis will open the file for writing (Fig. 80).\n\n![Fig. 80: Creating a file\
    \ in nano](img/5d1416436999bb5232d6af690a9da18a_215_0.png)\n\nYou can start typing\
    \ text at this stage.\n\n### 4.4.2 Pasting text from clipboard\nTo copy and paste\
    \ text from a different program, for example, a web browser into a file you are\
    \ editing in nano, do the following:\n- Copy the text from the program to clipboard\
    \ using `Ctrl + c`\n- In nano, move the cursor to the position where you would\
    \ like to paste the text\n- Use the `Shift + Ctrl + v` keyboard shortcut to paste\
    \ the text\n\n### 4.4.3 Saving changes\nTo save the file, use the shortcut `Ctrl\
    \ + o`. This corresponds to the `^O` Write Out function displayed at the bottom\
    \ (Fig. 81). The `^` here refers to the `Ctrl` key.\n\n![Fig. 81: To save changes\
    \ use the Write Out function](img/5d1416436999bb5232d6af690a9da18a_217_0.png)\n\
    \nA prompt like the following will be displayed at the bottom (Fig. 82):\n```\n\
    File Name to Write: exercise.txt\n```\n\n![Fig. 82: Enter a file name to save\
    \ the file](img/5d1416436999bb5232d6af690a9da18a_218_0.png)\n\nPress the **ENTER**\
    \ key to accept the default value — the original file name.\n\n### 4.4.4 Exit\
    \ nano\nTo exit nano, use the `Ctrl + x` shortcut. If there are no changes, nano\
    \ will close. If there are unsaved changes, it will prompt you to save them (Fig.\
    \ 83).\n\n![Fig. 83: Confirmation to save changes to file](img/5d1416436999bb5232d6af690a9da18a_219_0.png)\n\
    \nType `y` to save changes or `n` to discard them.\n\n## 4.5 Exercise — using\
    \ the command-line\nThis is an exercise in using the command-line to accomplish\
    \ a task. You will be making use of the commands *discussed earlier*.\n\n### Task\n\
    Given a protein sequence, identify matching sequences from a protein sequence\
    \ database.\n\n### Approach\nUsing programs in the NCBI BLAST+ package, you can\
    \ search a database of sequences using sequence (query) to identify matching sequences.\n\
    \n### 4.5.1 Summary of steps\n- Install NCBI BLAST+\n- Download protein query\
    \ sequence\n- Download protein sequence database and format it\n- Search database\
    \ using the query sequence\n\n### 4.5.2 Get sample data\nTo proceed, you will\
    \ need to download the protein query sequence and database used in this exercise.\n\
    \n#### Download query sequence\nThe protein query sequence used in this exercise\
    \ is *Spike glycoprotein* from Severe acute respiratory syndrome coronavirus 2\
    \ (SARS-CoV-2). It is available from UniProtKB²⁷ — the protein knowledge base.\
    \ The database identifier for this protein is P0DTC2²⁸. You can download the sequence\
    \ in FASTA format from the entry page or using this direct link: https://www.uniprot.org/uniprot/P0DTC2.fasta\n\
    \n#### Download protein database\nThe database used in this exercise is UniProtKB\
    \ *Swiss-Prot*²⁹. It is a manually annotated database of protein sequences with\
    \ added functional information. You can download the entire database as a compressed\
    \ FASTA format file from the *downloads*³⁰ page on the website.\n\n| Mark | URL\
    \ |\n|:----:|-----|\n| ²⁷ | https://uniprot.org/uniprot/ |\n| ²⁸ | https://www.uniprot.org/uniprot/P0DTC2\
    \ |\n| ²⁹ | https://www.uniprot.org/uniprot/?query=reviewed:yes |\n| ³⁰ | https://www.uniprot.org/downloads\
    \ |\n\n### 4.5.3 Install NCBI BLAST+ package\n> **Attention:** *This procedure\
    \ installs software in system paths and so requires administrator privileges.*\n\
    \nNCBI BLAST+ is available in the Linux package repositories. You can install\
    \ it using `apt`:\n```bash\nsudo apt install ncbi-blast+\n```\nType `y` when prompted\
    \ to continue.\n```text\n[sudo] password for user: \nReading package lists...\
    \ Done\nBuilding dependency tree\nReading state information... Done\nThe following\
    \ additional packages will be installed:\n  libmbedcrypto3 libmbedtls12 libmbedx509-0\
    \ ncbi-data\nThe following NEW packages will be installed:\n  libmbedcrypto3 libmbedtls12\
    \ libmbedx509-0 ncbi-blast+ ncbi-data\n0 upgraded, 5 newly installed, 0 to remove\
    \ and 0 not upgraded.\nNeed to get 14.9 MB of archives.\nAfter this operation,\
    \ 75.0 MB of additional disk space will be used.\nDo you want to continue? [Y/n]\
    \ y\n```\n\n### 4.5.4 Download query sequence\nYou can follow these steps to download\
    \ the query sequence:\n- Create new directory\n- Change into it\n- Download query\
    \ sequence\n- View the downloaded sequence (optional)\n\n#### Create new directory\
    \ — `mkdir`\nTo keep the input and output files related to this project together,\
