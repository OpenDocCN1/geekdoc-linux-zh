- md: '## 2.2 Running a Linux virtual machine

    ## 2.2.2 Importing the virtual machine image

    Open VirtualBox on your computer and then follow the steps below to import the
    downloaded virtual machine image.

    ### Step 1 — Select OVA file

    From the main window of VirtualBox, select: File → Import Appliance (Fig. 9)

    > Fig. 9: Select File --> Import Appliance from the menu

    In the Appliance to import screen, click on the button that appears next to the
    File entry field (Fig. 10).

    ![](img/5d1416436999bb5232d6af690a9da18a_37_0.png)

    Fig. 10: Click on the button that appears next to the File entry field

    Browse to the location of the `linuxmint-20.1.ova` file, select it, and then click
    on the **Open** button. The File entry field will now have the complete path to
    the selected file (Fig. 11).

    ![](img/5d1416436999bb5232d6af690a9da18a_38_0.png)

    ![](img/5d1416436999bb5232d6af690a9da18a_38_1.png)

    **Fig. 11:** Click on the Next button to proceed

    Click on the **Next** button to proceed.

    ### Step 2 — Adjust appliance settings (optional)

    In the next screen — Appliance settings (Fig. 12), you can modify the configuration
    of this virtual machine.

    > **Note:** *This step is optional.* You can click on the **Import** button at
    the bottom to proceed to the *next step*.

    For example, you can add more CPU or RAM for this virtual machine, depending on
    the configuration of your computer.

    ![](img/5d1416436999bb5232d6af690a9da18a_39_0.png)

    **Fig. 12:** Appliance settings screen

    Click on the **Import** button to proceed.

    ### Step 3 — Import progress and completion

    You will notice a progress bar at this stage (Fig. 13).

    ![](img/5d1416436999bb5232d6af690a9da18a_40_0.png)

    Fig. 13: Virtual machine import progress

    When import is complete, you will be taken back to the main window of VirtualBox.
    The imported virtual machine — LinuxMint 20.1, will appear in the panel on the
    left (Fig. 14).

    ![](img/5d1416436999bb5232d6af690a9da18a_41_0.png)

    Fig. 14: Imported virtual machine

    ### 2.2.3 Starting the virtual machine

    To start the virtual machine, select LinuxMint 20.1 and then click on the Start
    button in the main toolbar (Fig. 15).

    ![](img/5d1416436999bb5232d6af690a9da18a_42_0.png)

    > Fig. 15: Start virtual machine

    Once the boot process is complete, you will be logged in directly to the desktop
    (Fig. 16).

    ![](img/5d1416436999bb5232d6af690a9da18a_43_0.png)

    Fig. 16: The Linux Mint desktop

    For reference, the default username is user and password is also user.

    ### 2.2.4 Stopping the virtual machine

    When your work is complete, you can shut down the virtual machine by clicking
    on the Quit button in Linux Mint''s Applications Menu. This will display a confirmation
    dialog (Fig. 17).

    ![](img/5d1416436999bb5232d6af690a9da18a_44_0.png)

    Fig. 17: Confirmation dialog for system shutdown

    Click on the Shut Down button to stop the virtual machine.


    ## 2.3 The desktop

    Once you have started the virtual machine, you will be logged in directly to the
    desktop. For reference, the default user account for logging in to the virtual
    machine, is:

    - Username: user

    - Password: user

    ### 2.3.1 The Cinnamon desktop

    In its default configuration, the Cinnamon desktop includes the following components
    (Fig. 18):

    - **Applications Menu** — search and launch installed applications, logout, shutdown
    or restart system.

    - **Panel** — launch pinned applications, manage open applications windows.

    - **System Tray** — contains applets for managing the network, sound, power, software
    updates etc.,

    - **Calendar** — provides current date and time, and a calendar.

    ![](img/5d1416436999bb5232d6af690a9da18a_46_0.png)

    Fig. 18: Components of the Cinnamon desktop

    ### 2.3.2 Changing system settings

    The System Settings application can be used to customize the desktop, the operating
    system and hardware (Fig. 19). You can launch it from the applications'' menu.

    ![](img/5d1416436999bb5232d6af690a9da18a_47_0.png)

    *Fig. 19: System Settings application*

    The settings you can configure here include accessibility, user accounts, date
    and time, keyboard layout, language, network, display and more.

    #### Changing keyboard layout

    The default keyboard layout of the virtual machine is English (US). You can change
    this under:

    - Hardware → Keyboard → Layouts

    ![](img/5d1416436999bb5232d6af690a9da18a_48_0.png)

    > Fig. 20: Keyboard layouts in System Settings

    #### Changing system date and time

    The system date and time can be updated by selecting:

    - Preferences → Date and Time

    ![](img/5d1416436999bb5232d6af690a9da18a_49_0.png)

    Fig. 21: Date and time settings


    ## 2.4 Available software

    This is a brief overview of applications included in Linux Mint 20.1 Cinnamon.
    You can launch them from the Applications Menu (Fig. 22). You can search the list
    of installed applications using the search bar.

    ![](img/5d1416436999bb5232d6af690a9da18a_50_0.png)

    **Fig. 22:** Launching an application

    **Note:** Some applications discussed here are not included in the default installation.

    This includes *GNU Image Manipulation Program* and *Inkscape*. You can install
    them using *Software Manager*.

    ### 2.4.1 Files — manage files and directories

    Files is the default file manager (Fig. 23) in Linux Mint.

    ![](img/5d1416436999bb5232d6af690a9da18a_52_0.png)

    Fig. 23: Main window of Files

    #### Using Files

    You can launch Files from the Applications Menu or by clicking on its icon in
    the Panel. These are some tips on using Files.

    ##### Toggle icon and list views

    You can quickly switch between Icon and List View using icons in the toolbar.

    ##### Toggle sidebar

    You can open the sidebar view or hide it using icons in the status bar.

    ##### Open an extra pane

    You can open an extra pane using:

    ```

    View → Extra Pane

    ```

    This is especially useful when you are copying files between local directories
    or when connected to remote systems.

    ##### Bookmark locations

    When you are browsing a directory, you can bookmark it if you will access it frequently.
    This function is available under:

    ```

    Bookmark → Add Bookmark

    ```

    ##### Connect to servers

    Files can be used to connect to external servers using FTP, SSH, Samba and Webdav.
    This option is available under:

    - File → Connect to Server

    To learn more about this feature, read the following section in this book: *Transferring
    files between systems*.

    ### 2.4.2 Firefox — browse the web

    Firefox is the default web browser (Fig. 24).

    ![](img/5d1416436999bb5232d6af690a9da18a_55_0.png)

    Fig. 24: Firefox web browser

    Other web browsers can be installed using *Software Manager*.

    ### 2.4.3 Text Editor — create and edit text files

    The Text Editor can be used for working with files in plain text formats like
    `.txt`, `.md` and `.fasta`, or editing configuration files like `.bashrc` (Fig.
    25).

    ![](img/5d1416436999bb5232d6af690a9da18a_56_0.png)

    **Fig. 25:** Text Editor with Document Statistics and Preferences windows open

    Using **Edit → Preferences**, you can customize settings like the font used, display
    of line numbers, indentation, word wrap etc. The **Tools → Document Statistics**
    feature is useful for counting the numbers of words and characters in a document.

    #### Opening hidden files in Text Editor

    To open hidden files in Text Editor:

    1. Use File → Open to select a file

    2. In the Open Files dialog that appears, right-click in the middle pane and select
    Show Hidden Files (Fig. 26).

    ![](img/5d1416436999bb5232d6af690a9da18a_57_0.png)

    Fig. 26: Opening hidden files in Text Editor

    You can also use the Ctrl + h keyboard shortcut.

    ### 2.4.4 LibreOffice — edit documents and spreadsheets

    LibreOffice Writer and LibreOffice Calc can be used to create and edit documents
    and spreadsheets, respectively (Fig. 27).

    ![](img/5d1416436999bb5232d6af690a9da18a_58_0.png)

    Fig. 27: LibreOffice Writer and Calc programs

    The default file formats used by Writer and Calc are ODF Text Document (`.odt`)
    and ODF Spreadsheet (`.ods`) respectively. These applications also support reading
    and writing files in Microsoft Office formats like `.docx` or `.doc` (Word) and
    `.xlsx` or `.xls` (Excel). There are additional applications in the LibreOffice
    suite with functionality to create and edit slide shows or presentations, scientific
    formulas, diagrams and file-based databases.'
