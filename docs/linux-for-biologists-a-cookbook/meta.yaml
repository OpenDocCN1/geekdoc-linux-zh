  md: '# 5.2.1 Check system requirements


    Before running Galaxy, you will need to:


    +   1. Install Git and Python virtualenv module

    2. Check if there is enough free disk space

    3. Ensure that a Conda environment is not active


    # Install Git and Python virtualenv module


    Git is necessary for getting the latest version of Galaxy''s source code from
    GitHub. Python virtualenv module is necessary to set up an isolated virtual environment
    for running Galaxy.


    To install them, use *Software Manager* or *apt*, and search and install the following
    packages:


    +   1. git

    2. python3-venv


    # Check free disk space


    You will need *at least* 5 GB of free disk space for the initial setup. More space
    will be needed for your analyses and for the tools you might install from the
    Galaxy tool shed.


    To check available disk space, you can use the Disk Usage Analyzer application
    or the `df` command.'
