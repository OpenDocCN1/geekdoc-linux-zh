- md: "## Installing Python build tools\nUse `pip3 install` to install or upgrade\
    \ the required packages:\n```bash\npip3 install -U pip setuptools wheel\n```\n\
    The `-U` option of `pip3 install` will upgrade listed packages if newer versions\
    \ are available.\n\n## Output\n```bash\nCollecting pip\nDownloading pip-21.0.1-py3-none-any.whl\
    \ (1.5 MB) ...\nInstalling collected packages: pip, setuptools, wheel\n...\nSuccessfully\
    \ installed pip-21.0.1 setuptools-54.2.0 wheel-0.36.2\n```\n\n## Deactivating\
    \ a virtual environment\nTo exit a virtual environment, use the command:\n```bash\n\
    deactivate\n```\nYour shell prompt will change to its original appearance:\n```bash\n\
    user@cookbook:~$\n```\n\n### 3.2.8 Notes\n**You will need to update these packages\
    \ manually**\nPackages installed in this manner should also be updated manually.\
    \ When you notice there is an update for the package, for example, from the project's\
    \ website or from their source code repository, follow the steps in *Updating\
    \ an installed package* to install the latest version.\n\n**Why pip3 and not pip?**\n\
    The `pip` package includes the following commands:\n- `pip3` — Python 3 version\n\
    - `pip2` — Python 2 version\n*Support for Python 2 ended in January 2020.* Since\
    \ there is a possibility for both commands to exist on a system, it is safer to\
    \ use `pip3` when installing packages using this method.\n\n**What about programs\
    \ written in Python 2?**\n*Support for Python 2 ended in January 2020.* If you\
    \ do need to use a program written only in Python 2, you can create an isolated\
    \ environment — either using Python `venv` or Conda and then install the package\
    \ there.\n\n## Linux for Biologists\nRelated sections:\n- Python virtual environments\n\
    - Conda packages\n\n### When should I use a virtual environment?\nThe method described\
    \ here will not work if the programs you are installing require two different\
    \ versions of the same package from PyPI. In that case, you can consider creating\
    \ an isolated environment — either using Python `virtualenv` or Conda and then\
    \ installing the packages there.\n\nRelated sections:\n- Python virtual environments\n\
    - Conda packages\n\n### Older versions of pip\nIf the version of pip installed\
    \ in your system is older than 20.0, it will attempt to install packages in system\
    \ paths by default, resulting in *permission denied* errors. To avoid that, you\
    \ will need to add the `--user` option to the install and uninstall commands,\
    \ for example:\n```bash\npip3 install --user biopython\n```\n\nA better approach\
    \ is to *upgrade* your local version of pip. Once upgraded, you will no longer\
    \ need to use `--user`. To upgrade pip, do:\n```bash\npip3 install --user -U pip\n\
    ```\nYou can check the installed version of pip using:\n```bash\npip3 -V\n```\n\
    \n## 3.3 Perl modules\nFor installing Perl modules, you can configure the *local-lib*\
    \ module to create and use a local directory. The default location is `$HOME/perl5`.\
    \ If your software of interest is available on *CPAN*, you can install it easily\
    \ using the *cpanminus* script.\n\n> **Note:** Your software of interest might\
    \ be available using *The quick and easy method*. Search for package names containing\
    \ `perl`.\n\n### 3.3.1 Requirements\n**The build-essential and cpanminus packages\
    \ installed**\nIf you do not have them installed, follow *The quick and easy method*\
    \ and search and install the following packages:\n1. **build-essential** — installs\
    \ compilers and build tools like `make`\n2. **cpanminus** — script to obtain,\
    \ build and install modules from CPAN along with their *dependencies*\n\n> **Attention:**\
    \ You should not add `sudo` in the commands below.\n> This method only installs\
    \ files in your home directory and so does not require administrator privileges.\n\
    \n### 3.3.2 Configuring local-lib module\nTo configure local-lib:\nOpen the `$HOME/.bashrc`\
    \ file in a text editor. Add the following text at the end of the file:\n```bash\n\
    # Configuration for Perl local-lib module\neval \"$(perl -Mlocal::lib)\"\n```\n\
    Save the file. Here is a sample `.bashrc`, for reference (**Fig. 58**)\n![](img/5d1416436999bb5232d6af690a9da18a_121_0.png)\n\
    \n**Fig. 58:** local-lib configuration in .bashrc\n```bash\nif [ -f ~/.bash_aliases\
    \ ]; then\n    . ~/.bash_aliases\nfi\n# enable programmable completion features\
    \ (you don't need to enable\n# this, if it's already enabled in /etc/bash.bashrc\
    \ and /etc/profile\n# sources /etc/bash.bashrc).\nif ! shopt -oq posix; then\n\
    \    if [ -f /usr/share/bash-completion/bash_completion ]; then\n        . /usr/share/bash-completion/bash_completion\n\
    \    elif [ -f /etc/bash_completion ]; then\n        . /etc/bash_completion\n\
    \    fi\nfi\n# Add $HOME/.local/bin to PATH\nexport PATH=\"$HOME/.local/bin:$PATH\"\
    \n# Configuration for Perl local-lib module\neval \"$(perl -Mlocal::lib)\"\n```\n\
    Open a new terminal window. You will notice the following message displayed (**Fig.\
    \ 59**)\n![](img/5d1416436999bb5232d6af690a9da18a_122_0.png)\n\n> Fig. 59: Attempting\
    \ to create directory `/home/user/perl5`\n\n*Configuration is now complete.* You\
    \ can now start installing modules from CPAN and other sources.\n\n### 3.3.3 Searching\
    \ for a module on CPAN\nOpen *MetaCPAN* website (https://metacpan.org) in a web\
    \ browser. In the *Search* field, enter the name of the module you would like\
    \ to install and click on the **Search the CPAN** button. I will use David H.\
    \ Ardell's *FAST* package as an example. (**Fig. 60**)\n![](img/5d1416436999bb5232d6af690a9da18a_123_0.png)\n\
    \n**Fig. 60:** Searching for a module on MetaCPAN\n\nThis should display modules\
    \ matching the search term — *FAST* (**Fig. 61**)\n![](img/5d1416436999bb5232d6af690a9da18a_124_0.png)\n\
    \n**Fig. 61:** Search results for modules\n\nIf you click on the *appropriate*\
    \ module name, you will be taken to a description page, where you can learn more\
    \ about the module (**Fig. 62**)\n![](img/5d1416436999bb5232d6af690a9da18a_125_0.png)\n\
    \n**Fig. 62:** Module description page\n\nOn this page, you can also verify the\
    \ module name to use in the next step. To do that, click on *Install Instructions*\
    \ under TOOLS menu in the sidebar. This will open a pop-up window with information\
    \ on the module name you need to use with the `cpanm` command. In this case, the\
    \ module name to use, is simply called FAST (**Fig. 63**)\n![](img/5d1416436999bb5232d6af690a9da18a_126_0.png)\n\
    \n**Fig. 63:** Module install instructions for FAST\n\nYou can now proceed towards\
    \ installing this module.\n\n### 3.3.4 Installing a Perl module\nOpen a terminal\
    \ window. Install the module with the **cpanm** command:\n```bash\ncpanm FAST\n\
    ```\nThis will install the module and its dependencies, if there are any.\n\n\
    **Output:**\n```bash\n--> Working on FAST\nFetching http://www.cpan.org/authors/id/D/DH/DHARD/FAST-1.06.tar.gz\
    \ ... OK\nConfiguring FAST-1.06 ... OK\n==> Found dependencies: Bit::Vector, Sort::MergeSort,\
    \ Sort::Key\n--> Working on Bit::Vector\nFetching http://www.cpan.org/authors/id/S/ST/STBEY/Bit-Vector-7.4.tar.gz\
    \ ... OK\nConfiguring Bit-Vector-7.4 ... OK\n... Building and testing FAST-1.06\
    \ ... OK\nSuccessfully installed FAST-1.06\n6 distributions installed\n```\n\n\
    ### 3.3.5 Using installed modules\n#### Using included commands\nIf the module\
    \ includes commands, those will be installed in `$HOME/perl5/bin`. This directory\
    \ will be included in `$PATH` when you configured local-lib. Then, you can start\
    \ using the commands included in a module immediately after installation. For\
    \ example, here is the help page of the `fasuniq` command included with the FAST\
    \ package installed in the previous step:\n```bash\nfasuniq -h\nUsage: fasuniq\
    \ [options] [MULTIFASTA-FILE] [MULTIFASTA-DATA-ON-STDIN]\n| fasuniq [options]\
    \ ...\n```\n\n#### Using modules in your scripts\nModules will be installed in:\
    \ `$HOME/perl5/lib/perl5/5.30.0.`\n> **Note:** This is the module path for Perl\
    \ 5.30.0. If you have a different version of Perl installed on your system, it\
    \ will change."
