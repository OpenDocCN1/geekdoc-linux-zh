  md: '# 4.3.1 df — report disk usage


    The df command will report used and available disk space on all storage devices
    connected to the system.


    For example, to find the amount of disk space used in / — the root filesystem,
    you can use the command:


    ```

    df -h /

    ```


    Output:


    ```

    Filesystem          Size  Used Avail Use% Mounted on

    /dev/mapper/vgmint-root  28G  6.9G  20G  26% /

    ```


    The -h option makes the output human-readable. Without this, available disk space
    will be reported as 20600196 instead of 20G.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# 4.3.2 du — estimate disk usage of files or directories


    Calculate the amount of disk space used by files or directories.


    For example, to calculate the amount of disk space used by files in your home
    directory, use the command:


    ```

    ```

    du -sh ~

    ```

    ```


    Output:


    ```

    ```

    7.4G .

    ```

    ```


    The -s option prints a summary instead of printing space used by individual files.


    -h makes the output human-readable.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# ## 4.3.3 find — search for files


    Search for files using their file name, file type etc.,


    For example, to find files in the home directory with .bash in their name, use
    the command:


    ```

    ```bash

    find ~ -name "*.bash*"

    ```

    ```


    Output:


    ```

    ```bash

    /home/user/.bashrc

    /home/user/.bash_history

    /home/user/.bash_logout

    ```

    ```


    > > **Note:** The ~ here is a shortcut for home directory.

    >

    > The asterisk symbol (*) in .bash* acts as a wildcard.

    >

    > The find command does not use a database, so the search will be slower when
    compared to locate. However, it can identify files that were created or modified
    recently.'
