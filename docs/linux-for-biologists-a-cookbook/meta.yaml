  md: '# ## 6.2 Creating a notebook using Zim


    Zim is a *GUI* application for taking notes on the desktop. You can use it to
    create and maintain a personal or laboratory notebook on your computer.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 6.2.1 Features of Zim


    Using Zim, you can:


    +   - **Create digital notebooks** — add pages, and organize them using an index
    page.


    +   - **Take notes quickly** — using a WYSIWYG (What You See Is What You Get)
    interface¹.


    +   - **Insert images** — files, symbols, screenshots, equations and more².


    +   - **Export notes** — to formats like HTML, LaTeX, and Markdown.


    —


    With the help of plugins, you can add even more functionality.


    > ¹ Similar in functionality to that of word processors like LibreOffice Writer.
    You do not need to learn a new markup language to use Zim.


    > ² Requires enabling plugins in preferences.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# **6.2.2 Installing Zim**


    Zim is available in the distribution repositories.


    You can install it using *Software Manager* (Fig. 108).


    ![](img/5d1416436999bb5232d6af690a9da18a_286_0.png)


    > **Fig. 108:** Installing Zim using Software Manager'
  merge: -1
