- md: "## 4.5.5 Download protein sequence database\nYou can follow these steps to\
    \ download and prepare the protein sequence database:\n- Create new directory\n\
    - Change into it\n- Download the database archive\n- Uncompress (or extract) the\
    \ database archive\n- Format the database\n\n### Create new directory — mkdir\n\
    In order to keep all BLAST databases in one location, create a directory to store\
    \ them using the `mkdir` command:\n```bash\nmkdir ~/databases\n```\n\n### Change\
    \ directory — cd\nChange into the newly created directory using the `cd` command:\n\
    ```bash\ncd ~/databases\n```\n\n### Download the database archive — wget\nVisit\
    \ the database downloads³¹ page on the UniProt website. Navigate to the UniProtKB\
    \ section. Right-click on the fasta download link corresponding to **Reviewed\
    \ (Swiss-Prot)** and then copy it to clipboard (Fig. 84).\n\n![](img/5d1416436999bb5232d6af690a9da18a_228_0.png)\n\
    \n*Fig. 84: Download link for Swiss-Prot database*\n\n> ³¹ https://www.uniprot.org/downloads\n\
    \nTo download the database, you can use the `wget` command with the link to download\
    \ as the argument:\n```bash\nwget https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/uniprot_sprot.fasta.gz\n\
    ```\nWhen the download is complete, you will find a file named `uniprot_sprot.fasta.gz`\
    \ in the current directory. You can use the `ls` command to verify if it exists:\n\
    ```bash\nls -lh\n```\nOutput:\n```\ntotal 86M\n-rw-rw-r-- 1 user user 86M Feb\
    \ 10 15:00 uniprot_sprot.fasta.gz\n```\nSince this file is in a compressed format\
    \ (.gz), you will need to uncompress it before proceeding.\n\n### Uncompress the\
    \ database archive — gunzip\nTo uncompress (or extract) the database archive file\
    \ downloaded in the previous step, you can use the `gunzip` command.\n\n> **Note:**\
    \ By default, `gunzip` will remove the original compressed file after extraction.\
    \ If you would like to keep the original file (.gz), you can include the `-k`\
    \ (keep input files) option with `gunzip`.\n\nProvide the file name of the downloaded\
    \ file as the argument:\n```bash\ngunzip uniprot_sprot.fasta.gz\n```\nWhen the\
    \ extraction is complete, you will find the database file in FASTA format in the\
    \ same directory:\n```bash\nls -lh\n```\nOutput:\n```\ntotal 267M\n-rw-rw-r--\
    \ 1 user user 267M Feb 10 15:00 uniprot_sprot.fasta\n```\n\n### View the database\n\
    Since this extracted database file is large, you can use the *head* command to\
    \ view the first few lines of the file:\n```bash\nhead -n 5 uniprot_sprot.fasta\n\
    ```\nOutput:\n```\n>sp|Q6GZX4|001R_FRG3G Putative transcription factor 001R OS=Frog\
    \ virus 3 (isolate Goorha) OX=654924 GN=FV3-001R PE=4 SV=1\nMAFSAEDVLKEYDRRRRMEALLLSLYYPNDRKLLDYKEWSPPRVQVECPKAPVEWNNPPSEKGLIVGHFSGIKYKGEKAQASEVDVNKMCCWVSFKFDAMRRYQGIQTCKIPGKVLSDLDAKIKAYNLTVEGVEGFRYSRVTKQHVAAFLKELRHSKQYENVNLIHYILTDKRVDIQHLEKDLVKDKFALVESAHRMRQGHMINVKYILYQLLKKHGHGPDGPDILTVKTGSKGVLYDD\n\
    ```\nAlternatively, you can use the `less` command to view it one page at a time:\n\
    ```bash\nless uniprot_sprot.fasta\n```\nIf you would like to count the number\
    \ of sequences in the database, you can use the `grep` command.\n```bash\ngrep\
    \ \">\" -c uniprot_sprot.fasta\n```\nOutput:\n```\n564277\n```\nThe `-c` option\
    \ of `grep` counts the number of times the given search string (`>` in this case)\
    \ occurs in the input file.\n\n> **Note:** A sequence in a FASTA format should\
    \ start with the `>` character. Hence, counting the number of times it occurs\
    \ gives the number of sequences in the file.\n\nYou can now proceed towards formatting\
    \ the database.\n\n### Format the database — makeblastdb\nThe database needs to\
    \ be formatted before it can be used in a BLAST search. You can format it using\
    \ the `makeblastdb` command, which is part of the NCBI BLAST+ package. The command\
    \ has multiple options. Here is an example:\n```bash\nmakeblastdb -in uniprot_sprot.fasta\
    \ -parse_seqids \\\n  -title \"Swiss-Prot\" -dbtype prot -out swissprot\n```\n\
    > **Note:** The `\\` character splits the long command into multiple lines.\n\n\
    Output:\n```\nBuilding a new DB, current time: 03/24/2021 15:12:50\nNew DB name:\
    \ /home/user/databases/swissprot\nNew DB title: Swiss-Prot\nSequence type: Protein\n\
    Keep MBits: T\nMaximum file size: 1000000000B\nAdding sequences from FASTA; added\
    \ 564277 sequences in 47.507 seconds.\n```\n\nWhat the options mean:\n- **-in**：File\
    \ name containing input sequences.\n- **-parse_seqids**：Parse sequence identifiers\
    \ from the input file. These will be displayed in search results.\n- **-title**：A\
    \ descriptive name for this database.\n- **-dbtype**：The type of input sequences\
    \ — acceptable values are `prot` (for protein) and `nucl` (for nucleotide) sequences.\n\
    - **-out**：The value here will be used to name the output files. This is also\
    \ the name you will need to use for the database while doing a search (see *New\
    \ DB Name* in output).\n\nWhen formatting is complete, you will notice the following\
    \ files in the databases directory:\n```bash\nls -lh\n```\nOutput:\n```\ntotal\
    \ 585M\n-rw-rw-r-- 1 user user 100M Mar 24 15:13 swissprot.phr\n-rw-rw-r-- 1 user\
    \ user 4.4M Mar 24 15:13 swissprot.pin\n-rw-rw-r-- 1 user user 2.2M Mar 24 15:13\
    \ swissprot.pog\n-rw-rw-r-- 1 user user 18M Mar 24 15:13 swissprot.psd\n-rw-rw-r--\
    \ 1 user user 411K Mar 24 15:13 swissprot.psi\n-rw-rw-r-- 1 user user 195M Mar\
    \ 24 15:13 swissprot.psq\n-rw-rw-r-- 1 user user 267M Feb 10 15:00 uniprot_sprot.fasta\n\
    ```\n\n## 4.5.6 Search database using query sequence\nWith the query sequence\
    \ downloaded and the database downloaded and formatted, you can start performing\
    \ a BLAST search. First, change into the directory containing the query sequence:\n\
    ```bash\ncd ~/projects/sars-cov-2\n```\nNow run the `blastp` command using the\
    \ query sequence and the complete path to the database:\n```bash\nblastp -query\
    \ P0DTC2.fasta \\\n  -db /home/user/databases/swissprot \\\n  -out blastp-results.txt\
    \ \\\n  -outfmt \"7 sacc stitle qlen slen pident\"\n```\n\nWhat the options mean:\n\
    - **-query**：Path to the query sequence.\n- **-db**：Complete path of the sequence\
    \ database.\n- **-out**：File to save results to.\n- **-outfmt**：Format of the\
    \ output file. This will use format option 7 (tab-delimited text) and include\
    \ the following information:\n  - accession number and description of matching\
    \ sequences (`sacc` and `stitle`),\n  - query and subject sequence lengths (`qlen`\
    \ and `slen`)\n  - percentage identity of the match (`pident`).\n\nWhen the database\
    \ search is complete, you can open `blastp-results.txt` to view the results:\n\
    ```bash\nless -S blastp-results.txt\n```\nThe `-S` option of the `less` command\
    \ disables word-wrap.\n\nOutput:\n```\n# BLASTP 2.9.0+\n# Query: sp|P0DTC2|SPIKE_SARS2\
    \ Spike glycoprotein\n# OS=Severe acute respiratory syndrome coronavirus 2\n#\
    \ OX=2697049 GN=S PE=1 SV=1\n# Database: /home/user/databases/swissprot\n# Fields:\
    \ subject acc., subject title, query length,\n# subject length, % identity\n#\
    \ 88 hits found\nP0DTC2 Spike glycoprotein OS=Severe acute respiratory syndrome\
    \ coronavirus 2 OX=2697049 GN=S PE=1 SV=1 1273 1273 100.000\nP59594 Spike glycoprotein\
    \ OS=Severe acute respiratory syndrome coronavirus OX=694009 GN=S PE=1 SV=1 1273\
    \ 1255 76.038\nQ3LZX1 Spike glycoprotein OS=Bat coronavirus HKU3 OX=442736 GN=S\
    \ PE=3 SV=1 1273 1242 76.041\nQ3I5J5 Spike glycoprotein OS=Bat coronavirus Rp3/2004\
    \ OX=349344 GN=S PE=1 SV=1 1273 1241 75.334\nQ0Q475 Spike glycoprotein OS=Bat\
    \ coronavirus 279/2005 OX=389167 GN=S PE=3 SV=1 1273 1241 74.745\n...\n```\n\n\
    ## 4.6 Notes\n\n### 4.6.1 Adding directories to PATH\nThe `PATH` variable stores\
    \ the list of directories that will be searched to locate commands you type. If\
    \ you have a *command* that is stored in a directory that is not on this list,\
    \ you will need to add it to `PATH`. You can display the current value of `PATH`\
    \ using the *echo* command:\n```bash\necho $PATH\n```\nOutput:\n```\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/usr/games:/usr/local/games:/snap/bin\n\
    ```\n\n> **Attention:** You will need to be careful while editing `PATH`. You\
    \ will also need to ensure that it includes `$PATH` in the list. Otherwise, you\
    \ will not be able to access any commands!\n\n- Open `$HOME/.bashrc` in a text\
    \ editor.\n- Add the following lines at the end of the file. Add the directory\
    \ you wish to add separated by a colon. The list should end in `$PATH`."
