    ## 4.2.8 cp — copy files

    With the `cp` command, you can copy files or directories from one place (*source*)
    to another (*destination*).

    ### Copying one file

    To copy one file, use the following format:

    ```bash

    cp source_file destination

    ```

    Where *source_file* is the file you would like to copy and `destination` can *either*
    be a file name or a directory.

    #### If destination is a file name

    The copied file will have that file name. For example:

    ```bash

    cp /usr/share/dict/words /home/user/Documents/dictionary.txt

    ```

    This will copy the *words* file from `/usr/share/dict/` to `/home/user/Documents/`
    and save it as *dictionary.txt*.

    ### If destination is a directory

    The file will be copied *into* that directory with the *same* file name. For example:

    ```bash

    cp /usr/share/dict/words /home/user/Documents

    ```

    This will copy the **words** file from `/usr/share/dict/` to `/home/user/Documents/`
    with the same file name.

    ### Copying multiple files

    To copy multiple files, use the following format:

    ```bash

    cp source_file1 source_file2 destination

    ```

    Where `source_file1` and `source_file2` are the files you would like to copy.
    You can have *any* number of source files. Here, *destination* is the directory
    where you would like to copy source files into. For example:

    ```bash

    cp /usr/share/dict/words /usr/share/dict/spanish /home/user/Documents

    ```

    This will copy the `words` and `spanish` dictionary files from `/usr/share/dict/`
    into `/home/user/Documents`.

    ### Copying directories

    You can copy entire directories using the `-r` (recursive) option. For example:

    ```bash

    cp -r /usr/share/dict /home/user/Documents

    ```

    This will copy the `/usr/share/dict` directory and its contents to the `Documents`
    directory.


    ## 4.2.9 cat — display contents of files or combine them

    With the `cat` command, you can view the contents of a file on the screen or combine
    contents of multiple files.

    ### View contents of a file

    To view the contents of a file, use `cat`, followed by the name of the file:

    ```bash

    cat /usr/share/dict/words

    ```

    Output:

    ```

    A

    A''s

    AMD

    AMD''s

    AOL

    AOL''s

    AWS

    AWS''s

    Aachen

    ...

    ```

    This will display the *entire contents* of the file.

    ### Combine contents of files

    If you include multiple file names in `cat`, it will combine them and print their
    contents on the screen. If you would like to save the output to a file instead,
    use the following format:

    ```bash

    cat file1.txt file2.txt > files.txt

    ```

    The `>` operator redirects standard output to the file name following it.


    ## 4.2.10 less — view and navigate file contents

    With the `less` command, you have more control when viewing a file. It allows
    you to scroll up and down the file and provides features like searching the file
    using keywords. To view the contents of a file, use `less`, followed by the name
    of the file:

    ```bash

    less /usr/share/dict/words

    ```

    When the file is open, it will appear as in Fig. 79.

    ![](img/5d1416436999bb5232d6af690a9da18a_193_0.png)

    *Fig. 79: The `words` file open in less command*

    At the `:` prompt, you can type commands that `less` will understand.

    ### Navigating the file

    You can scroll down the file by pressing the ENTER key. Alternatively, you can
    use the PgUp and PgDn keys to scroll one page at a time.

    ### Searching the file

    You can search a file while viewing it in `less`. To do this:

    1. Type `/` (forward slash) key

    2. Type the text you would like to search

    3. Press the ENTER key

    4. If there are matching results, they will be highlighted

    ### Quitting the less command

    To quit the `less` command, type `q` at the prompt.


    ## 4.2.11 head — print first few lines of a file

    With the `head` command, you can view the first few (default: 10) lines of a file.
    For example:

    ```bash

    head /usr/share/dict/words

    ```

    Will produce the following output:

    ```

    A

    A''s

    AMD

    AMD''s

    AOL

    AOL''s

    AWS

    AWS''s

    Aachen

    Aachen''s

    ```


    ## 4.2.12 tail — print last few lines of a file

    With the `tail` command, you can view the last few (default: 10) lines of a file.
    For example:

    ```bash

    tail /usr/share/dict/words

    ```

    Output:

    ```

    élan''s

    émigré

    émigré''s

    émigrés

    épée

    épée''s

    épées

    étude

    étude''s

    études

    ```

    The `tail` and the `head` commands discussed [earlier](#), are useful when you
    want to quickly view the contents of a *large* text file. In both cases, you can
    control the *number of lines* displayed, using the `-n` option, instead of the
    default value (10). For example:

    ```bash

    tail -n 5 /usr/share/dict/words

    ```

    will display the last 5 lines of the file.'
