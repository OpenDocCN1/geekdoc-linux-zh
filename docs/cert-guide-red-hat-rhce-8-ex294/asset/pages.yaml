    # # TROUBLESHOOTINGnCOMMON SCENARIOS


    Apart from the problems that may arise in playbooks, another type of error relates
    to connectivity issues. To connect to managed hosts, SSH must be configured correctly,
    and also authentication and privilege escalation must work as expected.


    # ## Analyzing Connectivity Issues


    To be able to connect to a managed host, you need to have an IP network connection.
    Apart from that, you need to make sure that the host has been set up correctly:


    +   * The SSH service needs to be accessible on the remote host.

    * Python must be installed.

    * Privilege escalation needs to be set up.


