    **Table 8-3** Modules for Managing Changes on SELinux


    | Module | Use |

    |---|---|

    | file | Manages context on files but not in the SELinux policy |

    | secontext | Manages file context in the SELinux policy |

    | command | Is required to run the restore command after using secontext |

    | selinux | Manages current SELinux state |

    | boolean | Manages SELinux Booleans |


    # # Managing SELinux File Context


    The essential thing to understand when working with SELinux to secure files is
    that the context type that is set on the file defines which processes can work
    with the files. The file context type can be set on a file'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'directly, or it can be set on the SELinux policy.


    When you’re working with SELinux, all of its properties should be set in the SELinux
    policy. To do this, you use the Ansible secontext module. Setting a context type
    in the policy doesn''t automatically apply it to files though. You still need
    to run the Linux restorecon command to do this; Ansible does not offer a module
    to run this command; it needs to be invoked using the command module.


    As an alternative, you can use the file module to set SELinux context. The disadvantage
    of this approach is that the context is set directly on the file, not in the SELinux
    policy. As a result, if at any time default context is applied from the policy
    to the file system, all context that has been set with the Ansible file module
    risks being overwritten. For that reason, the recommended way to manage SELinux
    context in Ansible is to use the secontext module.


    To be able to work with the Ansible secontext module and the Linux restorecon
    command, you also need to make sure that the appropriate software is installed
    on Linux. This software comes from the policycoreutils-python-utils RPM package,
    which is not installed by default in all installation patterns.


    Listing 8-11 shows a sample playbook that uses this module to manage SELinux context
    type.'
