  md: '> Free developer subscriptions are available for RHEL as well as Ansible. Register
    yourself at https://developers.redhat.com and sign up for a subscription if you
    want to test the topics described in this section on RHEL and you don''t have
    a valid subscription yet.


    To understand how to use the Ansible modules to register a RHEL system, you need
    to understand how to use the Linux command-line utilities. When you are managing
    subscriptions from the Linux command line, multiple steps are involved.


    +   1. First, you use the **subscription-manager register command to provide your
    RHEL credentials.** Use, for instance, **subscription-manager register --username=yourname
    --password=yourpassword.

    2. Next, you need to find out which pools are available in your account. A pool
    is a collection of software channels available to your account. Use **subscription-manager
    list --available** for overview.

    3. Now you can connect to a specific pool using **subscription-manager attach
    --pool=poolID.** Note that if only one subscription is available in your account,
    you don''t have to provide the **--pool** argument.'
