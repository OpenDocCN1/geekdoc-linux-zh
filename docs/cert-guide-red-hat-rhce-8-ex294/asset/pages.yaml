    # Managing GPG Keys


    To guarantee the integrity of packages, most repositories are set up with a GPG
    key. This enables the client to verify that packages have not been tampered with
    while transmitted between the repository server and client. For that reason, if
    packages are installed from a repository server on the Internet, you should always
    make sure that gpgcheck: yes is set while using the yum_repository module.


    However, if you want to make sure that a GPG check is performed, you need to make
    sure the client knows where to fetch the repository key. To help with that, you
    can use the rpm_key module. You can see how to do this in Listing 12-8. Notice
    that the playbook in this'
