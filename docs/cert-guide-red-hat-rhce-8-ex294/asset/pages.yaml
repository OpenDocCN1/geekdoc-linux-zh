  md: '# Creating and Mounting File Systems


    After creating the block device layer of the storage setup, you must put a file
    system on top of it. Ansible provides the filesystem module to do so. This module
    supports creating as well as resizing file systems. Table 15-6 gives an overview
    of its most common options.


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_630_0.png)


    Table 15-6 filesystem Common Options


    | Option | Use |

    | --- | --- |

    | dev | Indicates the block device name. |

    | ftype | Specifies the file system type. All common Linux systems are included.
    |

    | opts | Identifies options that should be passed to the underlying Linux mkfs
    command. |

    | resize | Extends the file system if set to yes. The file system will be extended
    to the current block size. |


    The filesystem module has a relatively limited number of options. The reason is
    that all options are passed directly to the underlying Linux **mkfs** command,
    and they are specified using the **opts** argument. **Listing 15-9** shows how
    to create a file system.'
  merge: -1
  pgno: 630
- img_proc: true
  md: '# Listing 15-9 Creating an XFS File System


    ```

    - name: create an XFS filesystem

    filesystem:

    dev: /dev/vgdata/lvdata

    fstype: xfs

    ```


    After the file system is created, it can be mounted. To mount file systems, you
    can use the mount module. Table 15-7 shows common options to this module, and
    Listing 15-10 shows a task that mounts a file system.


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_631_0.png)


    # Table 15-7 mount Module Common Options


    | Option | Use |

    | --- | --- |

    | fstype | Specifies the file system type. Notice the fstype is not automatically
    detected. |

    | path | Indicates the directory where the file system must be mounted. |

    | src | Specifies the device that should be mounted. |

    | state | Specifies the current mount state. Use mounted to actively mount the
    device now, as through fstab. Use present to set in /etc/fstab but not mount it.
    |


    # Listing 15-10 Using the mount Module to Mount a File System


    ```

    - name: mount the filesystem

    ount:

    src: /dev/vgdata/lvdata

    fstype: xfs

    ```'
