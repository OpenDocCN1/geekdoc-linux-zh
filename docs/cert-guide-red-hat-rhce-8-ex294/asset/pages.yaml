  md: "sometimes you interface a /dev/sda, but at other times it might be a /dev/vda\
    \ for a KVM virtual disk or a /dev/nvme01 for an NVME disk device. To do so, you\
    \ must write a playbook that first finds out the name of the disk device and puts\
    \ that in a variable that you can work with further on the playbook. The set_fact\
    \ argument comes in handy to do so. You can use it in combination with a when\
    \ conditional statement to store a detected device name in a variable. In Listing\
    \ 15-4 you can see what that looks like, and in Exercise 15-1 you practice this\
    \ approach.\n\n# Listing 15-4 Storing the Detected Disk Device Name in a Variable\n\
    \n```\n---\nname: define variable according to diskname detected\nhosts: all\n\
    tasks:\n  - ignore_errors: yes\n  set_fact:\n    disk2name: sdb\nwhen: ansible_facts['devices']['sdb']\n\
    ```\n\n# Exercise 15-1 Working with Different Device Names\n\n+   1. Use your\
    \ editor to create the file exercise151.yaml and write the play header as follows:"
  merge: -1
