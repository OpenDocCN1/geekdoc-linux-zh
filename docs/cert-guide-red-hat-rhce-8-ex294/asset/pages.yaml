    credentials, and because a private key cannot be guessed, it is considered a more
    secure way to log in to managed hosts.


    While working with public/private keys, the public/private key pair is generated
    on the workstation that the user is typically connecting from. In our case, that
    is the Ansible control machine. After generating the public/private key pair,
    the public key needs to be copied over to the managed hosts. While authenticating,
    the user generates an authentication token using its private key, and this authentication
    is sent to the managed machine, where it is matched against the public key that
    is stored on the managed machine. If the matching succeeds, the user is authenticated.


