    \ that are performed by a plug-in run on the Ansible control host, and the result\
    \ of the plug-in work is typically stored in variables or templates. In the case\
    \ of handling SSH keys, the lookup plug-in comes in handy to find items in the\
    \ file system. Listing 13-5 shows a simple example where the lookup plug-in is\
    \ used to set the value of a variable to the contents of the file.\n\n# Listing\
    \ 13-5 Setting Variable Value to File Contents with the lookup Plug-in\n\n```\n\
