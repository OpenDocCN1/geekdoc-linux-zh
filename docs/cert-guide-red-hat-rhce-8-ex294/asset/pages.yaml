    # Using Ansible for Provisioning


    Another common scenario for use of Ansible is for deploying and installing systems
    (provisioning). Provisioning is particularly common in virtual and cloud environments,
    where in the end a new machine is just a configuration file that needs to be pushed
    to the managed machine and started from there. Ansible does not offer the functionality
    for PXE-boot and kickstart a bare-metal server but is used in combination with
    solutions that can take care of that as well. While exploring the different modules
    that are available, you''ll notice that a wide range of modules is provided to
    work with Ansible in different cloud environments.


    # Using Ansible for Continuous Delivery


    Continuous integration/continuous delivery (CI/CD) makes that source code can
    easily be developed and updated, and the results are easily provisioned as a new
    version of an application. Ansible cannot take care of the entire CI/CD procedure
    itself, but Ansible playbooks play an important role in the CD part of the CI/CD
    pipeline.'
