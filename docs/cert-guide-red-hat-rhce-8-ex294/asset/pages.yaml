  md: 'Working with roles splits the contents of the role off the tasks that are run
    through the playbook. Splitting files to store them in a location that makes sense
    is common in Ansible, and this approach is documented in the Ansible Best Practices,
    which you can find at the Ansible documentation website. In this section you find
    a summary of some of the most important best practices from this document. Notice
    that in this book the best practice of using project directories is not applied.


    +   - When you''re working with Ansible, it''s a good idea to work with project
    directories in bigger environments. Working with project directories makes it
    easier to delegate tasks and have the right people responsible for the right things.


    +   - Each project directory may have its own ansible.cfg file, inventory file,
    and playbooks.


    +   - If the project grows bigger, variable files and other include files may
    be used, and they are normally stored in subdirectories.


    +   - At the top-level directory, create the main playbook from which other playbooks
    are included. The suggested name for the main playbook is site.yml.


    +   - Use group_vars/ and host_vars/ to set host-related variables and do not
    define them in inventory.


    +   - Consider using different inventory files to differentiate between production
    and staging'
