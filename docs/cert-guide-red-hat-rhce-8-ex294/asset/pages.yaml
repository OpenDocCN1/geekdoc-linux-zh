    # USING RHEL SYSTEM ROLES


    Some parts of the RHEL operating system have changed significantly between RHEL
    versions. Examples are networking, which has changed from the init-based network
    script to the current solution that is based on NetworkManager. Another example
    is time synchronization, which has evolved from an NTP-based solution to a Chrony-based
    solution.


    To allow for a uniform approach while managing multiple RHEL versions, Red Hat
    provides RHEL System Roles. RHEL System Roles make managing different parts of
    the operating system easy. Table 9-4 provides an overview.


    Table 9-4 RHEL System Roles Overview'
