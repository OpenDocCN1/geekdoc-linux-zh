    # # INSTALLING AWX


    The installation of AWX is very different. AWX is provided as a container in OpenShift,
    Kubernetes, or Docker-Compose. Of these methods, the Docker-Compose method is
    the most accessible method because it doesn''t require a complete container orchestration
    platform like OpenShift or Kubernetes to be set up. For that reason, in this procedure
    you learn how to set up AWX on top of Docker-Compose. Make sure you use a dedicated
    system for installing AWX (so don''t try to run it on the machine where you just
    installed Ansible Tower).


    +   1. Use `sudo systemctl disable --now firewall` to disable the firewall—not
    because you have to, but just because it makes easier to get started with AWX.


    +   2. Disable SELinux by using `sudo setenforce 0`. Make this persistent as well
    by including the line `SELINUX=disabled` in the /etc/sysconfig/selinux configuration
    file.'
