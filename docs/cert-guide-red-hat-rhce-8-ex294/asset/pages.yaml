    as plain text in a playbook would be a huge risk, so Ansible Vault is the solution.
    Ansible Vault can be used to encrypt and decrypt any data in Ansible.


    The following approach is used while working with Ansible Vault:


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_242_0.png)


    +   1. Sensitive data is stored as values in a separate variable file.

    2. The variable file is encrypted, using the ansible-vault command.

    3. While accessing the variable file from a playbook, you enter a password to
    decrypt.


