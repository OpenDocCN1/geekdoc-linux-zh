    # What Is Automation?


    In the years of the system administrator, companies used servers. These servers
    performed a wide range of different tasks, and to ensure that every server was
    doing what it needed to be doing, a system administrator was needed. System administrators
    typically had advanced skills in managing different parts of the operating system
    that ran on their servers.


    Even though the years of the system administrator were glorious, and many gurus
    worked in IT departments, from a company perspective, this scenario was not ideal.
    First, because system administrator skills are specific to that person, if that
    person goes away, forgets about brilliant solutions applied earlier, or just has
    a bad day, things might go wrong.


    Another part that was not ideal that the system administrator typically took care
    of individual servers, and with the development of IT in recent years, companies
    have gone from a handful of servers to data'
  merge: -1
