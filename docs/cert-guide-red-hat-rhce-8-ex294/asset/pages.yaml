  md: '+   12. Make your new group membership effective by using **newgrp** docker.


    +   13. Create a symbolic link to start Python. Use **sudo ln -s /usr/bin/python3
    /usr/bin/python.**


    +   14. Install the Docker compose software. Use **sudo pip3 install docker-compose.**


    +   15. Edit ~/awx/installer/inventory and ensure it contains the line

    **pg_admin_password=password.** Look up the existing pg_admin_password line and
