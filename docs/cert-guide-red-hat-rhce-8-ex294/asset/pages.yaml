    +   - To make sure that you do not miss anything, make a task list for each question.
    You have scratch paper with you during the exam. Use it to make a short list of
    tasks that you have to accomplish and work on them one by one. This approach helps
    you to concentrate on what the exam question is actually asking.


    +   - After you have worked on all assignments, go have a cup of coffee (you are
    allowed to take a break during the exam). When you return, read all questions
    again to make sure that you did not miss anything. Taking a small break is important;
    it allows you to take distance from the exam, after which you will read the questions
    as if it is the first time that you have seen them.


    Another important part of the exam is the order in which you work on the assignments.
    Even though I cannot talk about specific exam content, some topics need to be
