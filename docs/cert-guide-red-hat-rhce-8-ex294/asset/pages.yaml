  md: "parameter can be set to no to skip checking the GPG key.\n\n# Managing Software\
    \ with yum\n\nThe yum module can be used to manage software packages. You use\
    \ it to install and remove packages or to update packages. This can be done for\
    \ individual packages, as well as package groups and modules. Let's look at some\
    \ examples that go beyond the mere installation or removal of packages, which\
    \ was covered sufficiently in earlier chapters.\n\nListing 12-2 shows a module\
    \ that will update all packages on this system.\n\n# Listing 12-2 Using yum to\
    \ Perform a System Update\n\n```\n---\n- name: updating all packages\n  hosts:\
    \ ansible2\n  tasks:\n    name: system update\n    yum:\n      name: '*'\n   \
    \   state: latest\n```\n\nNotice the use of the name argument to the yum module.\
    \ It has '*' as its argument. To prevent the wildcard from being interpreted by\
    \ the shell, you must make sure it is placed between single quotes.\n\nListing\
    \ 12-3 shows an example where yum package groups are used to install the Virtualization\
    \ Host"
  merge: -1
  pgno: 498
