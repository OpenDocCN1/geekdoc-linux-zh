- img_proc: true
  md: 'centers and cloud environments with hundreds if not thousands of servers. So
    a more efficient approach was needed.


    A first attempt in many sites was the use of shell scripts. Based on the deep
    knowledge of many system administrators, shell scripts can be used in a flexible
    way to automate a wide range of tasks on many servers. Using shell scripts, however,
    does come with some disadvantages:


    +   - Shell scripts cannot be used on a wide range of different devices that need
    management.

    - It is difficult to write shell scripts in a way that will always produce the
    same result in every situation.


    Because of these differences, and also because of changes in the way companies
    consume IT, a new approach was needed.


    # Understanding the DevOps Way of Working


    Throughout the years the way IT is consumed has changed. In the past, IT was used
    to provide great services to end users who just had to deal with them. Now the
    landscape has changed to an environment in which IT is everywhere, and multiple
    applications can provide a solution to the same IT problem. The years of the system
    administrator slowly came to end, and the'
  merge: -1
