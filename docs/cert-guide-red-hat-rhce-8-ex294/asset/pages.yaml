  md: "# Listing 12-3 Installing Package Groups\n\n```\n----\n- name: install or update\
    \ a package group\n  hosts: ansible2\ntasks:\n  - name: install or update a package\
    \ group\n    yum:\n      name: '@Virtualization Host'\n      state: latest\n```\n\
    \nWhen a yum package group needs to be installed, instead of an individual package\
    \ group the name of the package group needs to start with an sign (@), and the\
    \ entire package group name needs to be put between single quotes. Also notice\
    \ the use of state: latest in Listing 12-3. This line ensures that the packages\
    \ in the package group are installed if they have not been installed yet. If they\
    \ have already been installed, they are updated to the latest version.\n\nA new\
    \ feature in RHEL 8 is the yum AppStream module. Modules as listed by the Linux\
    \ yum modules list command can be managed with the Ansible yum module. Working\
    \ with yum modules is similar to working with yum package groups. In the example\
    \ in Listing 12-4, the main difference is that a version number and the installation\
    \ profile are included in the module name."
