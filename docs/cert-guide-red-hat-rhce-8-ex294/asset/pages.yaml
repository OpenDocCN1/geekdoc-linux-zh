  md: 'system administrator’s role needed to come closer to that of the developers.


    In this new way of working, the developers take care of building applications,
    and system administrators take care of implementing the code as a working application.
    Because this change required a deep cooperation between the developer and the
    system administrator, a new role was created: the role of the DevOps. The term
    DevOps in this role, tasks performed by the developer and the system administrator
    come together. A common definition of DevOps is “a set of practices intended to
    reduce the time between committing a change to a system and the change being placed
    into normal production, while ensuring high quality” (Len Bass, Ingo Weber, and
    Liming Zhu, DevOps: A Software Architect’s Perspective, Boston, MA: Addison-Wesley
    Professional, 2015).


    With this new role, the “DevOps way of working” was introduced. The exact definition
    is not always the same, but in general, it comes down to managing the entire application
    life cycle, which consists of the following elements:


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_56_0.png)


    +   • Coding: Developing and reviewing application source code'
