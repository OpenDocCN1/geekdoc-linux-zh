  md: '# Setting Up Repositories


    Most managed systems access the default distributions that are provided while
    installing the operating system. In some cases external repositories might not
    be accessible. If that happens, you need to set up a repository yourself. Before
    you can do that, however, it''s important to know what a repository is. A repository
    is a directory that contains RPM files, as well as the repository client, which
    is an index that allows the repository client to figure out which packages are
    available in the repository.


    Ansible does not provide a specific module to set up a repository. You must use
    a number of modules instead. Exactly which modules are involved depends on how
    you want to set up the repository. For instance, if you want to set up an FTP-based
    repository on the Ansible control host, you need to accomplish the following tasks:


    +   * Install the FTP package.

    * Start and enable the FTP server.

    * Open the firewall for FTP traffic.

    * Make sure the FTP shared repository directory is available.

    * Download packages to the repository directory.

    * Use the Linux createreepo command to generate the index that is required in
    each repository.'
  merge: -1
  pgno: 505
- img_proc: true
  md: "The playbook in Listing 12-7 provides an example of how this can be done.\n\
    \n# Listing 12-7 Setting Up an FTP-based Repository\n\n```\n- name: install FTP\
    \ to export repo\nhosts: localhost\ntasks:\n  - name: install FTP server\n   \
    \ yum:\n      name:\n        - vsftpd\n        - createrepo_c\n      state: latest\n\
    \  - name: start FTP server\n    service:\n      name: vsftpd\n      state: started\n\
    \      enabled: yes\n  - name: open firewall for FTP\n    firewalld:\n      service:\
    \ ftp\n        state: enabled\n        permanent: yes\n\n- name: setup the repo\
    \ directory\nhosts: localhost\ntasks:\n  - name: make directory\n    file:\n \
    \     path: /var/ftp/repo\n      state: directory\n  - name: download packages\n\
    \    yum:\n      name: nmap\n      download_only: yes\n      download_dir: /var/ftp/repo\n\
    \  - name: createrepo\n    command: createrepo /var/ftp/repo\n```\n\nThe most\
    \ significant tasks in setting up the reporepo are the **download packages** and\
    \ **createrepo** tasks."
