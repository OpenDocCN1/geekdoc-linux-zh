  md: "| Argument | Use |\n| --- | --- |\n| command | Specifies the command that needs\
    \ to be executed |\n| units | Indicates the units (minute, hour, day, week) to\
    \ identify the time in the future when the task must be executed |\n| count |\
    \ Specifies the number of units to execute the task |\n| script_file | Indicates\
    \ the name of a script that needs to be executed |\n| state | Uses added or deleted\
    \ as state to either add or delete a specific command |\n| unique | Set to yes\
    \ to ensure a specific job is started once only |\n\nThe most important point\
    \ to understand when working with at is that it is used to define how far from\
    \ now a task has to be executed. This is done using **count** and **units**. If,\
    \ for example, you want to run a task five minutes from now, you specify the job\
    \ with the arguments **count: 5** and **units: minutes**. Also notice the use\
    \ of the **unique** argument. If set to yes, the task is ignored if a similar\
    \ job is scheduled to run already. Listing 14-4 shows an example.\n\n# Listing\
    \ 14-4 Running Commands in the Future with at\n\n```\n----\n- name: run an at\
    \ task\nhosts: ansible2\ntasks:\n  - name: run command and write output to file\n\
    ```"
