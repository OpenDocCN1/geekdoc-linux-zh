    \ If your hosts use different device names, such as /devdb in a KVM virtual machine,\
    \ it is important to change the examples in this chapter and in the GitHub repository\
    \ accordingly. Or you can apply the solution that is shown in Exercise 15-1 to\
    \ dynamically detect device names.\n\n# Listing 15-2 Using assert to Run a Task\
