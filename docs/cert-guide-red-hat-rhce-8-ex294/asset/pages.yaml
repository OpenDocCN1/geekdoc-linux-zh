    # OPTIMIZING ANSIBLE PROCESSING


    To optimize the working of Ansible, you can manage parallel as well as serial
    task execution. Parallel task execution manages the number of hosts on which tasks
    are executed simultaneously. Serial task execution can be used to make sure that
    all tasks are executed on a host or group of hosts before proceeding to the next
    host or group of hosts.


    # Managing Parallel Task Execution


    While processing a playbook, Ansible can apply the tasks to multiple hosts simultaneously.
    Theoretically, Ansible can run tasks on all hosts at the same time, and in many
    cases that would not be a problem because processing is executed on the managed
    host anyway. If, network devices or other nodes that do not have their own Python
    stack are involved, processing needs to be done on the control host. To prevent
    the control host from being overloaded in that case, the maximum number of simultaneous
    connections by'
  merge: -1
  pgno: 421
- img_proc: true
  md: 'default is set to 5. You can manage this setting using the forks parameter
    in ansible.cfg. Alternatively, you can use the -f option with the ansible and
    ansible-playbook commands.


    Processing a maximum of five managed nodes simultaneously is good if processing
    needs to be done on the control host. Because processing in most environments
    is done on the managed hosts, the maximum setting of five forks just slows down
    the working of Ansible, and it is a good idea to increase the maximum to something
    significantly higher. If only Linux hosts are managed, there is no reason to keep
    the maximum number of simultaneous tasks much lower than 100.


    While executing tasks, Ansible processes tasks in a playbook one by one. This
    means that, by default, the first task is executed on all managed hosts. Once
    that is done, the next task is processed, until all tasks have been executed.
    Notice that there is no specific order in the execution of tasks, so you may see
    that in one run ansible1 is processed before ansible2, while on another run they
    might be processed in the opposite order.


    # Managing Serial Task Execution


    By default, Ansible runs task by task. This means that it runs the first task
    on all hosts, and once that is done, it proceeds to run the next task on all hosts.
    In some'
  merge: -1
  pgno: 422
- img_proc: true
  md: 'cases, this is undesired behavior. If, instance, a playbook is used to update
    a cluster of hosts this way, this would create a situation where the old software
    has been updated, but the new version has not been started yet and the entire
    cluster would be down. To prevent this situation from happening, you can configure
    serial task execution. To do so, use the **serial** keyword in the play header.


    When, for instance, the **serial: 3** keyword is used in the header of a play,
    all tasks are executed on three hosts, and after completely running all tasks
    on three hosts, the next group of three hosts is handled. In Exercise 10-2, you
    practice using the **serial** and **forks** parameters.


