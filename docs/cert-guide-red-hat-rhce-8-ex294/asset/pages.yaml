  md: '+   3. Install the EPEL repository using sudo yum install epel-release.


    +   4. Install Ansible using sudo yum install ansible.


    +   5. After installing Ansible, clone the AWX GitHub repository using git clone
    https://github.com/ansible/awx.


    +   6. Now you need to install some supporting packages. To do so, use sudo yum
    install utils device-mapper-persistent-data lvm2.


    +   7. Add the Docker repository by using sudo yum config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo.


    +   8. Remove the default CentOS/RHEL 8 container management tool podman by using
    sudo yum remove podman -y.


    +   9. Install the Docker Community Edition Software by using sudo yum install
    docker-ce docker-cli containerd.io --nobest -y.


    +   10. Enable the Docker daemon. To do so, use sudo systemctl enable --now docker.


    +   11. Make your current user account a member of the group docker. Use sudo
    usermod -aG $(whoami).'
  merge: -1
