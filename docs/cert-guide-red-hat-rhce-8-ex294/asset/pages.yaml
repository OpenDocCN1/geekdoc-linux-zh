    | rhel-system-roles.postfix | Configures hosts as a Mail Transfer Agent using
    Postfix |

    | rhel-system-roles.selinux | Manages SELinux settings |

    | rhel-system-roles.storage | Configures storage |

    | rhel-system-roles.timesync | Configures time synchronization |


    # # Understanding RHEL System Roles


    RHEL System Roles are based on the community Linux System Roles and provide a
    uniform interface to make configuration tasks easier where significant differences
    may exist between versions of the managed operating system. RHEL System Roles
    can be used to manage Red Hat Enterprise Linux 6.10 and later, and well as RHEL
    7.4 and later, and all versions of RHEL 8. The RHEL System Roles listed in Table
    9-4 are based on the generic Linux System Roles. Although they may be used for
    the specific task you want to accomplish, the Linux System Roles are not supported
    by RHEL technical support.


