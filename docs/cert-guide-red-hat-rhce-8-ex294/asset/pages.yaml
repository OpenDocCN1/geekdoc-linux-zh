- img_proc: true
  md: '# USING HANDLERS


    Playbooks contain lists of tasks. Tasks are always executed in order, and if one
    task fails, none of the following tasks are executed. In some cases, you might
    need to manage execution dependencies in a more specific way. That is when handlers
    can come in handy. A handler is a task that is triggered and is executed by a
    successful task.


    # Working with Handlers


    To work with handlers, you should define a notify statement at the level where
    the task is defined. The notify statement should list the name of the handler
    that is to be executed, and the handlers are listed at the end of the play. Make
    sure the name of the handler matches the name of the item that is called in the
    notify statement, because that is what the handler is looking for.


    The playbook in Listing 7-17 shows how to work with handlers. It is a multiplay
    playbook, where the first play is used to define the index.html on localhost.
    Next, this file is used in the second play to set up the web server.


    The handler is triggered from the task where the copy module is used to copy the
    index.html file. If this task is successful, the notify statement calls the handler.'
  merge: -1
  pgno: 287
- img_proc: true
  md: "Notice that handlers can be specified as a list, so one task can call multiple\
    \ handlers. Also notice that in Listing 7-17, a second task is defined, which\
    \ is intended to fail.\n\n# Listing 7-17 Working with Handlers\n\n```\n---\n-\
    \ name: create file on localhost\n  hosts: localhost\n  tasks:\n    name: create\
    \ index.html on localhost\n    copy:\n      content: \"welcome to the webserver\"\
    \n      dest: /tmp/index.html\n\n- name: set up web server\n  hosts: all\n  tasks:\n\
    \    - name: install httpd\n      yum:\n        name: httpd\n        state: latest\n\
    \    - name: copy index.html\n      copy:\n        src: /tmp/index.html\n    \
    \    dest: /var/www/html/index.html\n      notify:\n        - restart_web\n  \
    \  - name: copy nothing - intended to fail\n      copy:\n        src: /tmp/nothing\n\
