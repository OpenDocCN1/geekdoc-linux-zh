    \ the secontext command is used to write the new context to the policy. If executed\
    \ successfully, this task will trigger a handler to run the Linux restorecon command\
    \ by using the command module.\n\nDon’t forget: A handler will run only if the\
    \ task that triggers it generates a changed status. If the current state already\
    \ matches the desired state, no changes are"
