- img_proc: true
  md: 'In some cases, a small IT staff may use Ansible to manage just a few servers.
    In other cases, Ansible is used to manage multiple IT projects in a worldwide
    organization. These different use cases ask for a different approach in the way
    Ansible is used. If it is used at a small scale, there’s nothing wrong with having
    just one Ansible configuration take of all needs in IT. If, however, Ansible is
    used to manage large-scale environments, it’s a good idea to work with different
    project directories.


    A project directory is a self-contained environment that includes everything needed
    to work in a specific project. The playbooks are found within the project directory.
    These are the Ansible scripts, written in YAML, that enforce the desired configuration
    on managed hosts. Apart from these playbooks, other components may also be found
    in the project directory, such as variable files, additional files used to include
    tasks, and the inventory and the ansible.cfg configuration files.


    Having all of these within the same project directory makes it easy to delegate
    tasks in an Ansible managed environment. If you’re working on just a few servers,
    this approach might not make too much sense, but once your Ansible environment
    is taking care of many managed assets, you will recognize the convenience of working
    with project directories.


    Using project directories is good to keep together items'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'that belong together. While using the project directory, you may put the ansible.cfg
    file and the inventory file in the specific project directory. This approach makes
    sense if each project has its own specific configuration files. Alternatively,
    the configuration files may be in the ansible user home directory. This approach
    makes sense if different user accounts exist for managing Ansible, where each
    user has his own configuration. You can also choose to manage all Ansible configuration
    at a system level, where inventory and ansible.cfg are the same for your entire
    system. Table 3-2 summarizes the different options.


    # Table 3-2 Options for Storing Configuration Files


    | Location | Use |

    | --- | --- |

    | Project directory | Useful if specific projects need their own configuration
    files. Project directories may be changed between users or may be private to a
    specific user account. |

    | Home directory | Useful to allow one user to work with its specific settings.
    |

    | /etc/ansible | Useful in small environments where configuration is the same
    for every Ansible user and every project.


