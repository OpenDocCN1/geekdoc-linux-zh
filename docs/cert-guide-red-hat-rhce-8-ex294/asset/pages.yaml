    # Understanding SSH Connection Management Requirements


    Before we look at setting up SSH keys, let me quickly summarize how SSH keys are
    used in the communication process between a user and an SSH server. The following
    list provides a simplified overview of the procedure when a user logs in to an
    SSH server:


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_544_0.png)


    +   1. The user initiates a session with an SSH server.

    2. The server sends back an identification token that is encrypted with the server
    private key to the user.

    3. The user uses the server’s public key fingerprint,'
  merge: -1
  pgno: 544
- img_proc: true
  md: 'which is stored in the ~/.ssh/known_hosts file to verify the identification
    token.


    +   4. If no public key fingerprint was stored yet in the ~/.ssh/known_hosts file,
    the user is prompted to store the remote server identity in the ~/.ssh/known_hosts
    file. At this point there is no good way to verify whether the user is indeed
    communicating with the intended server.


    +   5. After establishing the identity of the remote server, the user can either
    send over a password or generate an authentication token that is based on the
    user''s private key.


    +   6. If an authentication token that was based on the user''s private key is
    sent over, this token is received by the server, which tries to match it against
    the user''s public key that is stored in the ~/.ssh/authorized_keys file.


    +   7. After the incoming authentication token to the stored user public key in
    the authorized_keys file is matched, the user is authenticated. If this authentication
    fails and password authentication is allowed, password authentication is attempted
    next.


    In the authentication procedure, two key pairs play an important role. First,
    there is the server''s public/private key pair, which is used to establish a secure
    connection.'
  merge: -1
  pgno: 545
- img_proc: true
  md: "To manage the host public key, you can use the Ansible known_hosts module.\
    \ Next, there is the user’s public/private key pair, which the user uses to authenticate.\
    \ To manage the public key in this key pair, you can use the Ansible authorized_key\
    \ module.\n\n# Using the Lookup Plug-in\n\nWhen you’re working with SSH public\
    \ keys, the lookup plug-in plays an important role. Ansible comes with a number\
    \ of plug-ins to add to the Ansible core functionality. The lookup plug-in enables\
    \ Ansible to access data from outside sources. You can use it to read the file\
