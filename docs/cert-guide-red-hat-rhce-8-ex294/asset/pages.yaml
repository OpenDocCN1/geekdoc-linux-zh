    \ task if the device exists. For an easier solution, you can also use a when statement\
    \ to look for the existence of a device. The advantage of using the assert module\
    \ is that an error message can be printed if the condition is not met.\n\nListing\
    \ 15-2 shows where the assert module is used;\nListing 15-3 shows the result of\
    \ running this playbook.\n\n> Important\n\nFor the labs and demos in this chapter,\
