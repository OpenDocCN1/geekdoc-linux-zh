- img_proc: true
  md: "systemctl command). The mask feature marks a systemd service in such a way\
    \ that it cannot be started, not even by accident. Listing 14-1 shows an example\
    \ where the systemd module is used to manage services.\n\n# Listing 14-1 Using\
    \ systemd Module Features\n\n```\n---\nname: using systemd module to manage services\n\
    hosts: ansible2\ntasks:\n  name: enable service httpd and ensure it is not masked\n\
    \  systemd:\n    name: httpd\n    enabled: yes\n    masked: no\n    daemon_reload:\
    \ yes\n```\n\nThe large amount of functionality that is available in systemd,\
    \ the functions that are offered by the systemd services are a bit limited, and\
    \ for many specific features, you must use generic modules such as file and command\
    \ instead. An example is setting the default target, which is done by creating\
    \ a symbolic link using the file module.\n\n# Managing cron Jobs\n\nThe cron module\
    \ can be used to manage cron jobs. A Linux cron job is one that is periodically\
    \ executed by the Linux crond daemon at a specific time. The cron module can manage\
    \ jobs in different ways:"
  merge: -1
