    # USING VAULT TO MANAGE SENSITIVE VALUES


    Sometimes, you must deal with sensitive data when working with Ansible—think about
    webkeys, passwords, and other types of sensitive data that you really shouldn’t
    store as plain text in a playbook. Ansible Vault is the solution to that problem.
    You can use Ansible Vault to encrypt and decrypt sensitive data to make it unreadable,
    and only while accessing data does it ask for a password so that it is decrypted.


    # Understanding Vault


    Ansible may need to access environments where'
