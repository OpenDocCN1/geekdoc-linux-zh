- img_proc: true
  md: "# Key Topic\n\n+   - Write the job directly to a user’s crontab\n- Write the\
    \ job to /etc/crontab or under the /etc/cron.d directory\n- Pass the job to anacron\
    \ so that it will be run once an hour, day, week, month, or year without specifically\
    \ defining when exactly\n\nIf you are familiar with Linux cron, using the Ansible\
    \ cron module is straightforward. Listing 14-2 shows an example that runs the\
    \ fstrim command every day at 4:05 and at 19:05.\n\n# Listing 14-2 Running a cron\
    \ Job\n\n```\n---\nname: run a cron job\nhosts: ansible2\ntasks:\n  - name: run\
    \ a periodic job\n    cron:\n      name: \"run fstrim\"\n      minute: \"5\"\n\
    \      hour: \"4,19\"\n      job: \"fstrim\"\n```\n\nAs a result of this playbook,\
    \ a crontab file is created for user root. To create a crontab file for another\
    \ user, you can use the user attribute. Notice that while managing cron jobs using\
    \ the cron module, a name attribute is specified. This attribute is required for\
    \ Ansible to"
