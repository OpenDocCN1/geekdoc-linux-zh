    # Understanding Infrastructure as Code


    The essence in infrastructure as code is that machine-readable code (the automation
    language) is used to describe the state the managed IT infrastructure needs to
    be in. This is referred to as the desired state. This code is next applied to
    the infrastructure to ensure it actually is in that state.


    In this approach, the machine-readable code files, which basically are simple
    text files, should be managed like software code, using a version control system,
    or Concurrent Version System (CVS). That means the tools that are common to the
    developer are implemented to manage the infrastructure as code. Commonly, Git
    repositories are used for this purpose.


    Putting these files in a CVS makes managing it easy. This approach provides some
    benefits, such as easy management of change history, upgrades, and rollback. Infrastructure
    as code is the place where the developer meets the operator in DevOps. Developers
    can easily review changes, and operators can ensure that the systems are in the
    state that developers expect.


