  md: "This outcome can be prevented by using **ignore_errors** and **force_handlers**.\
    \ If you specify **ignore_errors: yes** in a task, the playbook continues, even\
    \ after processing the failing task. Likewise, **force_handlers** can be used\
    \ to ensure that handlers will be executed, even if a failing task was encountered.\
    \ Listing 7-21 shows an example of a playbook that uses **ignore_errors.**\n\n\
    # Listing 7-21 Example with ignore_errors\n\n```\n- name: restart sshd only if\
    \ crond is running\n  hosts: all\n  tasks:\n    - name: get the crond server status\n\
    \      command: /usr/bin/systemctl is-active crond\n      ignore_errors: yes\n\
    \      register: result\n    - name: restart sshd based on crond\n      service:\n\
    \        name: sshd\n        state: restarted\n      when: result.rc == 0\n```\n\
    \nThe essence of the playbook in Listing 7-21 is that the sshd service needs to\
    \ be restarted, based on the result of the current status of the crond service.\
    \ To find the current status of the crond service, you use the command **systemctl\
    \ is-active crond**, and the result of that command is registered. To allow the\
    \ playbook to continue, even if the service currently is not running, you include\
    \ **ignore_errors: yes** in the task definition."
