  md: "```\nstate: mounted\npath: /mydir\n```\n\n# Configuring Swap Space\n\nSwap\
    \ space can be a useful addition in systems that have a shortage of memory. Swap\
    \ space is emulated memory that is allocated on disk. To set up swap space, you\
    \ first format a device as swap space and next mount the swap space. To format\
    \ a device as swap space, you use the filesystem module. There is no specific\
    \ Ansible module to activate the swap space, so you use the command module to\
    \ run the Linux swap own command.\n\nBecause adding swap space is not always required,\
    \ it can be done in a conditional statement. In the statement, use the ansible_swaptotal_mb\
    \ fact to discover how much swap is actually available. If that amount falls below\
    \ a specific threshold, the swap space can be created and activated. Listing 15-11\
    \ shows an example where a conditional check is performed, and additional swap\
    \ space is configured if the current amount of swap space is lower than 256 MiB.\n\
    \n# Listing 15-11 Setting Up Swap Space\n\n```\n---\n  name: configure swap storage\n\
    \  hosts: ansible2\n  tasks:\n    name: setup swap\n```"
