    with different sections. The section header is between square brackets, and parameters
    are specified in a key = value format. The common sections in ansible.cfg are
    [defaults] and [privilege escalation]. In the default section, generic information
    is provided. The privilege_escalation section defines how the ansible user should
    require administrative privileges to connect to the managed hosts.


