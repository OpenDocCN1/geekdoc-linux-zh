  md: 'At this point you should have access to the main web page in either AWX or
    Ansible Tower. In the following sections you learn how to start performing your
    management tasks from there.


    # MANAGING NODES WITH ANSIBLE TOWER


    To manage machines with Ansible Tower, you must do something to reach out to these
    machines. Because Ansible Tower is still Ansible, there is no fundamental difference
    in how you reach out to the managed machines from Ansible Tower:


    +   * You need to set up name resolution for managed machines.

    * You must ensure that the managed machines are running an SSH process that is
    accessible through the firewall.

    * You need a user account with sudo privileges.

    * You need to set up a password and SSH keys.


    If you''re reading this appendix after working through the other chapters in this
    book, setting up Tower is easy. It consists of the following tasks, which are
    all executed on the Tower node:


