    # shell


    The shell module is similar to the command module and allows you to run arbitrary
    commands, with one important difference: the shell module does run the commands
    through a shell. That means the usual shell features, such as pipes and redirects,
    do work while using this module. Compare, for instance, the result of the command
    **ansible all -m shell -a “rpm -qa | grep nmap”** to the command used before.
    This time it will work.


    # raw


    The third module that enables you to run arbitrary commands on managed nodes is
    the raw module. The shell and the command modules, when used, generate a Python
    script, which is sent over SSH to be executed on the managed host. The raw module,
    however, doesn''t need Python on the managed host; it sends the'
