- img_proc: true
  md: 'the **that** condition must be true. So you are looking for **filesize** to
    be equal to or bigger than 1, and smaller than or equal to 100.


    Before this can be done, one little problem needs to be managed: when `vars_prompt`
    is used, the variable type is set to be a string by default. This means that a
    statement like `filesize <= 100` would fail with a mismatch. That is why Jinja2
    filter is used to convert the variable type from string to integer.


    Filters are a powerful feature provided by the Jinja2 templating language and
    can be used in Ansible to modify variables before processing. For more information
    about filters, see https://docs.ansible.com/ansible/latest/user_guide/playbooks_filters.html.
    The int filter can be used to convert the value of a string variable to an integer.
    To do this, you need to rewrite the entire variable as a Jinja2 operation, which
    is done using “**{{ filesize | int }} <= 100}}”.


    In line, the entire string is written as a variable. The variable is further treated
    in a Jinja2 context. In this context, the part **(filesize | int)** ensures that
    the string is converted to an integer, which makes it possible to check if the
    value is smaller than 100.


    When you run the code in **Listing 11-11**, the result shown in **Listing 11-12**
    is produced.'
