  md: '# FOUNDATION TOPICS


    # MANAGING SERVICES


    Services can be managed in many ways. You can manage systemd services, but Ansible
    also allows for management of tasks using Linux cron and at. Apart from that,
    you can use Ansible to manage the desired systemd target that a managed system
    should be started in, and it can reboot running machines. Table 14-2 gives an
    overview of the most significant modules for managing services.


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_582_0.png)


    Table 14-2 Modules Related to Service Management'
  merge: -1
  pgno: 582
- img_proc: true
  md: '| Module | Use |

    | --- | --- |

    | service | Works for multiple init systems, including BSD init, upstart, and
    systemd; a generic module that allows for services |

    | service_facts | Gathers facts for services started by BSD init, upstart, or
    systemd |

    | cron | Uses the Linux cron service to schedule services |

    | at | Uses the Linux at service to run services one time only |

    | systemd | Manages systemd specific service properties; does have overlap with
    the service module |

    | reboot | Reboots managed hosts |


    # # Managing Systemd Services


    Throughout this book you have used the service module a lot. This module enables
    you to manage services, regardless of the init system that is used, so it works
    with System-V init, with Upstart, as well as systemd. In many cases, you can use
    the service module for any service-related task.


    If systemd specifics need to be addressed, you must use the systemd module instead
    of the service module. Such systemd-specific features include **daemon_reload**
    and **mask**. The **daemon_reload** forces the systemd daemon reread its configuration
    files, which is useful after applying changes (or after editing the service files
    directory, without using the Linux'
  merge: -1
