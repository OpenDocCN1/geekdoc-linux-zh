    # FOUNDATION TOPICS


    DISCOVERING STORAGE-RELATED FACTS


    To work with storage in an Ansible environment, you need to know which devices
    exist on the managed nodes. A wide range of storage devices is available, and
    you probably need to run conditionals based on the specific device type. Once
    the device type is successfully discovered, you can continue to manage your storage
    devices by using one of the multiple storage-related modules. Table 15-2 shows
    a list of modules that are discussed in this chapter. Many other vendor-dependent
    storage management modules are available as well; you can use **ansible-doc -l**
    to search for specific vendors.


    Table 15-2 Modules for Managing Storage'
  merge: -1
  pgno: 608
- img_proc: true
  md: '| Module | Use |

    | --- | --- |

    | parted | Manages partitions in a scripted way |

    | lvg | Manages LVM volume groups |

    | lvol | Manages LVM logical volumes |

    | filesystem | Manages file systems on storage devices |

    | mount | Mounts storage devices that have been configured with a file system
    |

    | vdo | Interfaces the new VDO storage layer that is available in RHEL8 |


    The challenge in writing playbooks that deal with storage is that many storage
    devices could be used and different device names can be used for them. So, to
    make sure that your playbook is applied to the right devices, you first need to
    find which devices are available on your managed system. After you find them,
    you can use conditionals to make sure that tasks are executed on the right devices.


    # Using Storage-Related Facts


    Facts about storage are gathered automatically when the setup module is collecting
    facts about the managed machines. Relevant information is stored in different
    facts; Table 15-3 gives an overview.


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_609_0.png)'
