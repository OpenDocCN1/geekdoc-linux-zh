  md: '# File Module Manipulation Overview


    Many modules are available to manage different aspects of files. Table 8-2 provides
    an overview of some of the most commonly used file modules.


    | Module | Use |

    | --- | --- |

    | copy | Copies files to remote locations |

    | fetch | Fetches files from remote locations |

    | file | Manages files and file properties |

    | acl | Works with file system ACLs |

    | find | Finds files based on any property |

    | linefile | Manages lines in text files |

    | blockinfile | Manages blocks in text files |

    | replace | Replaces strings in text files based on regex |

    | synchronize | Performs rsync-based synchronization tasks |

    | stat | Retrieves file or file system status |


    Most of these modules are discussed in the following sections. When using file-related
    modules, you might need a module that is not discussed here. If that is the case,
    the best approach is to use the ansible-doc'
