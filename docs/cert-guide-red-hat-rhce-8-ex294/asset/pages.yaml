  md: '# # Working with Magic Variables


    Apart from the variables that can be set by the Ansible user or administrator
    and the variables that are discovered as Ansible facts, there are also the so-called
    magic variables. Magic variables are variables that are set automatically by Ansible
    to reflect an Ansible internal state. There are about 30 magic variables; Table
    6-5 shows an overview of some of the most important magic variables.


    ### Table 6-5 Magic Variables Overview


