    The foundation of working with Ansible Vault is the creation of encrypted files.
    When the command ansible-vault create secret.yaml is used, Ansible Vault prompts
    for a password and then opens the file using the default editor. Alternatively,
    the password can be provided in a password file. In that case, the password file
    must be really well protected (for example, by putting it in the user root home
    directory). If a password file is used, the encrypted variable file can be'
