  md: '# On Exam Day


    Make sure to bring appropriate identification to the exam. To be allowed to take
    the exam, you need an approved government ID. Normally, a passport or driver’s
    license will do; other types of proof may be accepted in your country as well.
    Do not forget it; without ID, you will not be allowed to take the exam.


    Also, make sure you are on time. It is a good idea to arrive half an hour before
    the exam’s scheduled starting time. If you are late, you will normally be allowed
    access to the exam, but you will not get extra time. So, make sure that you are
    on time.


    After proving your identity, you are introduced to the exam environment. Because
    of the nondisclosure agreement that every test-taker signs with Red Hat, I cannot
    tell you in detail what the exam environment looks like. I can tell you, though,
    that there will be an environment in which you have to work. Depending on the
    exam you are taking, this consists of one or more servers. There is also a list
    of tasks that have to be performed. Work your way through the tasks, read all
    well, and you will pass the exam.


    # During the Exam


    The tasks that you have to work on during the exam are not necessarily presented
    in the most logical order. Therefore, it is a good idea to start reading through
    all'
  merge: -1
  pgno: 660
- img_proc: true
  md: 'the tasks before you start working on the first assignment. While reading through
    all the tasks, you can decide which is the best order to create the configurations
    needed. Determine the best possible order for yourself because it may not be obvious.


    Another important tip is to read carefully. Not many people know how to read carefully
    anymore, and you are probably among those people. IT administrators are very skilled
    in scanning web pages to retrieve the information that they need. That skill will
    not help you on the exam. I cannot stress that point enough. According to my estimate,
    40 percent of all people who fail the exam fail because they do not read (they
    scan instead). So, let me give you some tips on how to read the exam questions:


    +   • If English is not your native language, or if you master one or more additional
    languages, you can switch the language in which questions are presented. Maybe
    the English language question is not clear to you, but the question translated
    in another language is. So, if in doubt, read the translation as well.


    +   • The English language questions are the most used and best scanned questions.
    Exam questions are perfect because Red Hat has made a tremendous effort to make
    them perfect. Given the fact that most of the exam candidates work on English'
  merge: -1
