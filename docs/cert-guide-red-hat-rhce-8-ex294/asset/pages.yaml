    # Understanding Handler Execution and Exceptions


    When a task fails, none of the following tasks run. How does that make handlers
    different? A handler runs only on the success of a task, but the next task in
    the list also runs only if the previous task was successful. What, then, is so
    special about handlers?


    The difference is in the nature of the handler. Handlers are meant to perform
    an extra action when a task makes a change to a host. So in the design of the
    playbook, the handler should be considered an extension to the regular task. They
    are a conditional task that runs only upon the success of a previous task.


    If a handler is triggered and a task that is later in the play fails, the handler
    will not be executed on the node where the subsequent task has failed. There are
    two solutions to prevent this. To start with, you can use **force_handlers: true**
    in the play header to ensure that the handler will run anyway. You also can use
    the'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'more generic ignore_errors: true statement in the play header to accomplish
    the same thing. Because force_handlers: true is more specific, using that option
    is preferred if you just need to make sure that your handlers will run.


    When you work with handlers, there are a few specifics to be aware of:


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_295_0.png)


    +   - Handlers are specified in a handlers section at the end of the play.

    - Handlers run not in the order they occur in the handlers section and not in
    the order as triggered.

    - Handlers run only if the task calling them generates a changed status.

    - Handlers by default will not run if any task in the same play fails, unless
    force_handlers or ignore_errors are used.

    - Handlers run only after all tasks in the play where the handler is activated
    have been processed. You might want to define multiple plays to avoid this behavior.


