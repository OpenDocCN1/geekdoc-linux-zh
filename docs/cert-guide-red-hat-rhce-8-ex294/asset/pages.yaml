- img_proc: true
  md: 'Even if it is possible to disable fact gathering for all of your Ansible configuration,
    this practice is not recommended. Too many playbooks use conditionals that are
    based on the current value of facts, and all of these conditionals would stop
    fact gathering if were disabled altogether.


    As an alternative to make working with facts more efficient, you can disable a
    fact cache. To do so, you need to install an external plug-in. Currently, two
    plug-ins are available for this purpose: jsonfile and redis. To configure fact
    caching using the redis plug-in, you need to install it first. Next, you can enable
    fact caching through ansible.cfg. The following procedure describes how to do
    this:


    +   1. Use yum install redis.

    2. Use service redis start.

    3. Use pip install redis.

    4. Edit /etc/ansible/ansible.cfg and ensure it contains the following parameters:


    ```

    [defaults]

    gathering = smart

    fact_caching = redis

    fact_caching_timeout = 86400

    ```'
