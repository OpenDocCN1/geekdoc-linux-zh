    # USING JINJA2 TEMPLATES


    A template is a configuration file that contains variables and, based on the variables,
    it is generated on the managed hosts according to host-specific requirements.
    Using templates allows for a structural way to generate configuration files, which
    is much more powerful than changing specific lines from specific files. Ansible
    uses Jinja2 to generate templates.


    # Working with Simple Templates


    Jinja2 is a generic templating language for Python developers. It is used in Ansible
    templates, but Jinja2-based approaches are also found in other parts of Ansible.
    For instance, the way variables are referred to based on Jinja2.


    In a Jinja2 template, three elements can be used. Table 8-4 provides an overview.


