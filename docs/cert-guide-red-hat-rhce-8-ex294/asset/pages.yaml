  md: 'command straight over the the SSH connection. This makes the raw module an
    excellent choice while setting up a machine or to work on a managed machine that
    doesn’t have a Python stack, such as a network device.


    Using the appropriate options, you can use the raw module to perform initial setup
    tasks on managed hosts. An example is the command `ansible -u root -i inventory3--ask-pass
    -m raw -a "yum install python3"`, which can be used to install Python 3 on host
    ansible3, which may be a node that hasn’t received any Ansible configuration yet.
    Notice that the raw module could be used as an alternative to the command or shell
    module, but this approach is not recommended. As a generic rule of thumb, you
    should always try to use the module that is the most specific for the task that
    you want to accomplish.


    > Note

    The command, shell, and raw modules are all used to run arbitrary commands on
    a managed node. In most cases, it is recommended to avoid using them.Most other
    modules are idempotent and make it easy to track changes. The command, shell,
    and raw modules just run an arbitrary command, and it’s hard to track what exactly
    has been changed using these modules, and for reason it is difficult to guarantee
    idempotency when they are used. For that reason, you should try to avoid them
