- img_proc: true
  md: "```\n- name: create a user {{ users }} on host (\n  ansible_hostname ))\nuser:\n\
    \  name: \"{{ users }}\"\n```\n\nAs you can see, the sample playbook in Listing\
    \ 6-1 has a vars section. In this section, one variable is defined, using the\
    \ common key: value syntax. Next, in the task definition the user module is used\
    \ to work with this variable. To refer to the variable, you just place the name\
    \ definition between double curly brackets. However, in the name argument to the\
    \ user module, the variable is between double quotes and double curly braces.\
    \ The reason is that the value in this case starts with the variable. If a value\
    \ starts with a variable, the variable must be placed between double quotes. If\
    \ more than just the variable name in the line specifies the value, the entire\
    \ line that starts with the variable must be between double quotes.\n\nNext you\
    \ see the variable ansible_hostname, which is not defined anywhere. That is because\
    \ this variable is an Ansible fact. Facts are also used as variables, fact they\
    \ are variables that are automatically set, based on properties of the managed\
    \ system. Fact discovery is used by default to discover all that Ansible possibly\
    \ might to know about a machine to use in conditionals. You don’t have to define\
    \ facts; facts are a part of the system properties."
