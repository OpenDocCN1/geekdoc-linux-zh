    # # MANAGING MULTIPLAY

    PLAYBOOKS


    Up to now, you’ve worked with a playbook that has just

    one play. Many playbooks that you find out in the wild

    work with multiple plays though. Using multiple plays

    in a playbook makes it easy to perform the complete

    setup of a managed environment, where you can set up

    one group of servers with one specific configuration and

    another group of servers with another configuration.

    When you work with multiplay playbooks, each play has

    own list of hosts to address.


    # ## Multiplay Playbook Considerations


    The main benefit of running a multiplay playbook is

    that you can configure multiple plays that should all be

    run in the same procedure. In each play, different

    connectivity options can be used. To start with, you can

    define different hosts or host groups, but it’s also'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'possible to use different connection parameters that may even overwrite default
    parameters that have been set in the ansible.cfg file. Think of parameters like
    **become: no**, which indicates that no privilege escalation is needed, or **remote_user:
    bob**, which instructs the playbook to run the remote tasks as bob instead of
    using the default user account.


    When you are writing playbooks, there are many options. It might seem tempting
    to write huge playbooks, including many tasks and multiple plays. Doing so is
    not recommended as a best practice though. To summarize the most important guideline
    from the best practices: keep it simple. If there is no need to put everything
    in one playbook, then simply don''t. The bigger playbook, the more difficult it
    will be to troubleshoot.


    In many cases it''s a much better solution to write multiple smaller playbooks
    and use includes to include functionality from other playbooks. One advantage
    is that this approach makes troubleshooting a lot easier. Another advantage is
    that this approach makes it easy to develop a toolkit with many small playbooks
    that can be used in a flexible way to perform a wide range of management tasks.
    You’ll read more about this approach in Chapter 10, “Using Ansible in Large Environments."'
