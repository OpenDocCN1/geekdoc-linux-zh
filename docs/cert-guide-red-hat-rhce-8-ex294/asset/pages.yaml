  md: "# USING LOOPS AND ITEMS\n\nSome modules enable you to provide a list that needs\
    \ to be processed. Many modules don't, and in these cases, it makes sense to use\
    \ a loop mechanism to iterate over a list of items. Take, for instance, the yum\
    \ module. While specifying the names of packages, you can use a list of packages.\
    \ If, however, you want to do something similar for the service module, you find\
    \ out that this is not possible. That is where loops come in. In this section\
    \ you learn all there is to know about using loops.\n\n# Working with Loops\n\n\
    To help you understand working with loops, Listing 7-1 shows a simple playbook\
    \ that installs software packages using the yum module and then ensures services\
    \ installed from these packages are started using the service module.\n\n**Listing\
    \ 7-1** Using loop\n\n```\n----\n- name: install and start services\n  hosts:\
    \ ansible\n  tasks:\n    - name: install packages\n      yum:\n        name:\n\
    \        - vsftpd\n        - httpd\n        - samba\n      state: latest\n   \
    \ - name: start the services\n```"
  merge: -1
