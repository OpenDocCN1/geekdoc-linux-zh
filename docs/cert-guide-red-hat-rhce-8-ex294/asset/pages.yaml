    # UNDERSTANDING AD HOC COMMANDS


    An ad hoc command is an Ansible task that you can run against managed hosts without
    the need to use any playbook files or other script-like solutions. Ad hoc commands
    are easy to use and they are fast, and for that reason, they are commonly used.


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_131_0.png)


    Ad hoc commands are used in particular on the following:


    +   - Setup tasks that bring nodes to a desired state

    - Quick tests to verify that a playbook was indeed successful

    - Quick discovery tasks to verify that a node meets certain criteria'
