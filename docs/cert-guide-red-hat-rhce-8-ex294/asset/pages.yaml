  md: "manage the cron jobs and has no meaning for Linux crontab itself. If, for instance,\
    \ you later want to remove a cron job, you must use the name of the job as an\
    \ identifier.\n\nListing 14-3 shows a sample playbook that removes the job that\
    \ was created in Listing 14-2. Notice that it just specifies state: absent as\
    \ well as the name of the job that was previously created; no other parameters\
    \ are required.\n\n# Listing 14-3 Removing a cron Job Using the name Attribute\n\
    \n```\nname: run a cron job\nhosts: ansible2\ntasks:\n  - name: run a periodic\
    \ job\n    cron:\n      name: \"run fstrim\"\n      state: absent\n```\n\n# Managing\
    \ at Jobs\n\nWhereas you use Linux cron to schedule tasks at a regular interval,\
    \ you use Linux to manage tasks that need to run once only. To interface with\
    \ Linux at, the Ansible at module is provided. Table 14-3 gives an overview of\
