    Ansible,” for more information about that procedure.

    You don’t need to configure an inventory or an ansible.cfg file; this functionality
    is taken over by Ansible Tower.


    # # UNDERSTANDING ANSIBLE TOWER CORE COMPONENTS


    To work with Ansible Tower, you use a few key resources. Working with Ansible
    Tower means you need to be able to configure these key resources the appropriate
    way. Let’s start with an overview:


    +   - Organization: In Ansible Tower, an organization is a collection of managed
    devices. Notice that in the evaluation version of Ansible Tower, only one organization
    is available.


    +   - Users: Different users can be created, and RBAC can be configured for these
    users.


    +   - Inventories: Inventories are the managed servers. They can be created statically
    or dynamically.


    +   - Credentials: Credentials are what you need to log'
