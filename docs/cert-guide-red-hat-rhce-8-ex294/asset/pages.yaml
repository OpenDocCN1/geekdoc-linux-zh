    \ and\nan analyze that.\n\n# FOUNDATION TOPICS\n\n# UNDERSTANDING THE USE\n VARIABLES\
    \ IN ANSIBLE\nPLAYBOOKS\n\nUp to now you've learned how to work with playbooks.\n\
    Although convenient, a playbook that just works with\nstatic data is not very\
    \ impressive. That's why using\nvariables are labels\nthat refer to data that\
    \ can be dynamically changed, and\nmakes Ansible really flexible, particularly\
    \ when\nvariables are used in combination with conditionals, as\ndiscussed in\
    \ Chapter 7, “Using Task Control.”Before\nlearning about variables and facts in\
    \ detail, let's look at\nthe example in Listing 6-1 showing how variables are\n\
    used.\n\nListing 6-1 Using Variables Example\n\n```\n---\n- name: create a user\
    \ using a variable\nhosts: ansible\nvars:\n  users: lisa\ntasks:\n```"
  merge: -1
