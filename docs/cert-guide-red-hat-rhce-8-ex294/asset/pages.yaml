    # USING ANSIBLE ROLES


    In Ansible, playbooks are used to perform common

    tasks. Tasks in an Ansible environment are rarely

    unique, however. If you write a playbook to install,

    enable, and expose the latest version of Nginx, it is very

    likely that someone else has done that before. That is'
  merge: -1
