    # Using Variables When Importing and Including Files


    The main goal to work with imported and included files is to make working with
    reusable code easy. To make sure you reach this goal, the imported and included
    files should be as generic as possible. That means it''s a bad idea to include
    names of specific items that may change when used in a different context. Think,
    for instance, of the names of packages, users, services, and more.


    To deal with include files in a flexible way, you should define specific items
    as variables. Within the include_tasks file, for instance, you refer to {{ package
    }}}, and in the main playbook from which the include files are called, you can
    define the variables. Obviously, you can use this approach with a straight variable
    definition or by using host variable or group variable include files.'
