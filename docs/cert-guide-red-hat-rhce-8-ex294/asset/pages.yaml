  md: '# Configuring sudo for the Ansible User


    While working with Ansible, the ansible user account is used to gather information
    from managed hosts but also to install software, change configurations, and perform
    other tasks that require root privileges. To ensure that Ansible can complete
    these tasks, you must configure privilege escalation. The default solution to
    do so on Linux is to use sudo.


    To set up sudo, you have two options. You can use the Linux visudo command to
    write the desired configuration to the /etc/sudoers file. Alternatively, you can
    use snapin files. These independent files that are created in the /etc/sudoers.d/
    directory. Using these snapin files is the preferred way because it allows for
    easy management of settings for different users, without changing the main /etc/sudoers
    configuration file.


    While setting up a sudo configuration, like when setting up SSH login, you have
    the choice to it secure or conveniently. If sudo is used occasionally, it is common
    to require the user to enter a password before being allowed to escalate permissions.
    In Ansible playbooks, where tasks often are executed on many hosts, it is very
    inconvenient if the sudo password needs to be entered every time and on each host.
    This is why it is common to configure sudo such that no password has to be'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'entered to acquire root privileges. In Exercise 2-7 you are guided through
    the procedure to do so.


    # Exercise 2-7 Setting Up Privilege Escalation


    +   1. Ensure that the user ansible exists on all managed nodes and has been configured
    for SSH key-based access as described in Exercise 2-6.

    2. On all managed nodes as well as the control node, from a root shell, use the
    command echo "ansible ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/ansible.\.

    3. On all managed nodes, as the ansible user, type sudo ls -l /root/. This command
    should show you the contents of the /root/ directory (which is accessible by the
    root user only) without prompting for a password.


    > If using passwordless privilege escalation is unacceptable in your environment,
    you might want to consider using Ansible Tower. Ansible Tower is a web-based platform,
    based on the AWX open-source project, which was developed to meet some inconveniences
    that are met when using Ansible from the command line. One of its features is
    to securely store the password that is required to run commands using sudo. Read
    AppendixB, "Getting Started with Ansible Tower," for a quick impression of what
    Ansible Tower can do.'
