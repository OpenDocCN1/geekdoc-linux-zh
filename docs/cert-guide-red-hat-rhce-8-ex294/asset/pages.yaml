  md: "Exam tip\nof the troubleshooting options you've seen so far, the output verbosity\
    \ options are not the most useful. Using common sense is. Most errors in playbooks\
    \ are the result of logic errors, where the flow of tasks in a playbook has not\
    \ well thought through. It is relatively easy to avoid those types of errors:\
    \ don't include too many tasks in a play, and don't include too many plays in\
    \ a playbook. That way, you make it easy to avoid losing oversight.\n\nExercise\
    \ 5-3 you work on a multiplayer playbook.\n\n# Exercise 5-3 Creating a Multiplay\
    \ Playbook\n\n+   1. Use an editor to create the file\nexercise53.yaml and create\
