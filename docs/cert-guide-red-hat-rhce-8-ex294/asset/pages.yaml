  md: "the simple playbook in Listing 6-3 to analyze fact gathering.\n\n# Listing\
    \ 6-3 Simple Playbook to Show Fact Gathering\n\n```\nname: show fact gathering\n\
    - hosts: all\n  tasks:\n    - name: show all facts\n      debug:\n        var:\
    \ ansible_facts\n```\n\nThe playbook in Listing 6-3 collects all known facts about\
    \ the managed hosts and stores them in the variable ansible_facts. To show how\
    \ this process works, Listing 6-3 uses the debug module. This module can be used\
    \ for debugging purposes, and it is used to either show a message or print the\
    \ contents of a variable. In this case, the debug module prints all the contents\
