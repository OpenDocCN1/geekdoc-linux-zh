  md: '# MANAGING PARTITIONS AND LVM


    After detecting the disk device that needs to be used, you can move on and start
    creating partitions and logical volumes. The following sections explain how to
    partition a disk using the parted module, how to work with the lvg and lvol modules
    to manage LVM logical volumes, how to create file systems using the filesystem
    module and mount them using the mount module, and finally, how to manage swap
    storage.


    # Creating Partitions


    If you need to manage partitions, Ansible provides the parted module. Because
    this module has a few options that are not really intuitive, Table 15-4 provides
    an overview. Listing 15-6 shows a task that uses this module.


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_625_0.png)


    Table 15-4 parted Options'
  merge: -1
  pgno: 625
- img_proc: true
  md: "| Option | Use |\n| --- | --- |\n| name | Is required for GPT; specifies a\
    \ unique name assigned to the partition |\n| label | Specifies the type of partition\
    \ that should be created: mdos is the default (and used on MBR disks); gpt is\
    \ used to create GPT partitions |\n| device | Indicates the device on which the\
    \ partition should be created |\n| number | Specifies the partition number |\n\
    | state | Uses present to create and absent to remove a partition |\n| part_start\
    \ | Indicates the starting partition, expressed as an offset from the beginning\
    \ of the disk |\n| part_end | Specifies where to end the partition, expressed\
    \ as an offset from the beginning of the disk |\n| flags | Sets partition properties,\
    \ such as the LVM partition type |\n\n# Listing 15-6 Creating Partitions with\
    \ parted\n\n```\n---\nname: create storage\nhosts: ansible2\ntasks:\n  name: create\
    \ new partition\n  parted:\n    name: files\n    label: gpt\n    device: /dev/sdb\n\
    \    number: 1\n    state: present\n    part_start: 1MiB\n    part_end: 2GiB\n\
    \  name: create another new partition\n  parted:\n    name: swap\n    label: gpt\n\
    ```"
  merge: -1
  pgno: 626
