    # Using Include Files


    When you are defining variables, you can define them all in the header of the
    Play. For small playbooks this approach can work fine, but as a playbook grows
    bigger and gets more complex, you can easily lose oversight. For that reason,
    it is common to define variables in include files. Specific host and group variables
    can be used as include files (the section “Managing Host and Group Variables”
    later in this chapter), but it’s also possible to include an arbitrary file as
    a variable file, using the `vars_files:` statement. Notice that the `vars_files`
    parameter can have a single value or a list providing multiple values. If a list
    is used, each item needs to start with a dash; see the “Using Multivalued Variables”
    section for more information about using lists.


    When you include variables from files, it’s a good idea to work with a separate
    directory that contains all variables because that makes it easier to manage as
    your projects'
