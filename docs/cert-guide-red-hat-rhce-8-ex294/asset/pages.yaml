    device: /dev/sdb

    number: 2

    state: present

    part_start: 2GiB

    part_end: 4GiB

    flags: [ lvm ]

    ```


    Working with the parted module is not always intuitive. Let''s look at the contents
    of the playbook in Listing 15-6 for an example. The first argument to the parted
    module is **name**. If the partition is created as an MBR partition, this argument
    is not required. If you want to create a GPT partition, however, a name must be
    specified.


    The next item you should notice is **label**. This argument is used to set the
    partition table type, not the file system label. File system labels are a property
    of the file system and for that reason are set using the filesystem module.


    Next, there is the size specification. When you use parted, sizes are indicated
    as an offset from the start of a disk. To create partitions, you should use **part_start**.
    If these arguments are not used, partition starts at 0% and ends at 100% of the
    available disk space. When you specify **part_start**, the first couple of bytes
    on a disk are used for metadata storage, so you cannot start a partition at the
    beginning of a disk. That''s why you see the first partition starts at 1 MiB.
    Also notice the second partition, where **part_start** is set to 2 GiB. You need
    to enter this because the parted module is not smart enough to figure out that
    the next'
