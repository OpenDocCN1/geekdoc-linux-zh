  pgno: 627
- img_proc: true
  md: "partition should be created after already existing partitions.\n\nFinally,\
    \ there is the flags argument. This argument sets the partition type and is required\
    \ if you want to create an LVM partition type.\n\n# Managing Volume Groups and\
    \ LVM Logical Volumes\n\nIf you need to manage LVM logical volumes, the lvg module\
    \ is available for managing LVM volume groups, and the lvol module is available\
    \ for managing LVM logical volumes. Creating a volume group is relatively easy:\
    \ you use the vg argument to set the name of the volume group and the pvs argument\
    \ to identify the physical volume (which is often a partition or a disk device)\
    \ on which the volume group needs to be created. Also, you might have to specify\
    \ the pesize to refer to the size of the physical extents. Listing 15-7 shows\
    \ a task that creates a volume group. (Listing 15-7 and some of the following\
    \ listings show only the tasks that you should include, not the complete playbook!)\n\
    \n# Listing 15-7 Creating an LVM Volume Group\n\n```\n- name: create a volume\
    \ group\nlvg:\n  vg: vgdata\n  pesize: \"g\"\npvs: /dev/sdb1\n```"
  merge: -1
  pgno: 628
- img_proc: true
  md: "After you create an LVM volume group, you can create LVM logical volumes. When\
    \ you’re creating logical volumes, a wide range of options is available. Table\
    \ 15-5 gives an overview of some of the most useful options, and Listing 15-8\
    \ shows a task that creates an LVM logical volume.\n\n# Key Topic\n\nTable 15-5\
    \ lvol Common Options\n\n| Option | Use |\n| --- | --- |\n| lv | Specifies the\
    \ name of the logical volume. |\n| pvs | Indicates a comma-separated list of physical\
    \ volumes. If the PV is a partition, make sure it has the Lvm option set. |\n\
    | resizefs | Indicates that the underlying file system must be resized automatically\
    \ when the logical volume is resized. |\n| size | Specifies the size of the logical\
    \ volume. |\n| snapshot | Specifies a name if this logical volume is a snapshot.\
    \ |\n| vg | Indicates the name of the volume group in which the logical volume\
    \ should be created. |\n\n# Listing 15-8 Creating an LVM Logical Volume\n\n```\n\
    name: create a logical volume\nlvol:\nn  lv: lvdata\n  size: 100%FREE\n  vg: vgdata\n\
    ```"
