    While working with playbooks, you may use different modules for troubleshooting.
    The debug module was used in previous chapters and is particularly useful for
    analyzing variable behavior. Some other modules may prove useful when troubleshooting
    Ansible. Table 11-4 gives an overview.


    Table 11-4 Troubleshooting Modules Overview


    | Module | Use |

    | --- | --- |

    | debug | Writes debug information, which is useful for checking variable values
    |

    | uri | Tests the answer coming from any URL, which is useful for API calls |

    | fail | Uses a when conditional to determine when a module should be considered
    failing |

    | script | Allows for the execution of a shell script on the managed host |

    | stat | Gathers status information about files |

    | assert | Tests whether the expected result is present and otherwise fails |


    The following sections discuss how these modules can be used.


