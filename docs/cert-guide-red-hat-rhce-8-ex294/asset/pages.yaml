    have run successfully still generate their result. Because this can give an unexpected
    result, it is important to always restore the original situation if that happens.


    In some cases you might want the entire playbook to stop executing on all hosts
    when a failing task is encountered. If that is the case, you can use any_errors_fatal
    in the play header or on a block (blocks are explained later in this chapter).


    # Managing Task Errors


    Generically, tasks can generate three different types of results. Table 7-4 gives
    an overview.


    **Table 7-4** Tasks Overview


    | Result | Explanation |

    |---|---|

    | ok | The task has run successfully but no changes were applied. |

    | changed | The task has run successfully and changes have been applied. |

    | failed | While running the task, a failure condition was encountered. |


    As you saw before, if a task fails, all execution stops.'
