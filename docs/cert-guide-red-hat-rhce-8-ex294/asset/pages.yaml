    | Return values | The type of result that can be expected |


    The first interesting element in the result of **ansible-doc** is the name of
    the module, which is followed by the name of the Python script that is used by
    this module. Ansible modules are written in Python, and the Python scripts are
    just installed on your control system. So if you want to see what is happening,
    you can open the Python script, analyze it, and—if you want—even optimize it.


    Following the name of the underlying script is a short module description. It''s
    a good idea to read the module description, particularly if you''re using a module
    for the first time. The examples that you may have copied from your Google search
    don''t provide information about the gotchas in a particular module, so read it!'
