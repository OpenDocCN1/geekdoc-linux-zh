- img_proc: true
  md: 'exactly what roles are all about. Ansible roles are ready-to-use playbook-based
    Ansible solutions that you can easily include in your own playbooks. Community
    roles are provided through Ansible Galaxy, but it’s also possible to create your
    own roles. And apart from that, Red Hat provides RHEL System Roles. In this chapter
    you learn about all roles.


    Working with Ansible roles has many benefits. The most important benefit is that
    roles make it possible to provide Ansible code in a reusable way. You can easily
    define a specific task in a role, and after defining it in a role, you can easily
    redistribute that and ensure that tasks are handled the same way, no matter where
    they are executed. Roles can be custom-made for specific environments, or default
    roles provided from Ansible Galaxy can be used.


    # Understanding Ansible Roles


    The essence of using Ansible roles is that they work with include files. All the
    different components that you may use in a playbook are used in roles and stored
    in separate directories. While defining the role, you don''t need to tell the
    role that it should look in some of these specific directories; it does automatically.
    The only thing you need to do is tell your Ansible playbook that it should include
    a role. While you are doing that, the different components of the role are stored
    in different'
  merge: -1
