    When you use the user module, many options are available. Most of them speak for
    themselves; however, just two arguments need attention, and they are **group**
    and **groups**. The **group** argument is used to specify the primary group of
    the user. By default, when you are creating a new user, a new group is created
    with the name of that user, and that group is set as the primary group. The **groups**
    argument is used to make the user a member of additional groups. While using the
    **groups** argument for existing users, make sure to include the **append** argument
    as well. Without **append**, all current secondary group assignments are overwritten.


    Also notice that the user module has some options that cannot normally be managed
    with the Linux **useradd** command. As shown in Listing 13-1, the module can be
    used to generate an SSH key and specify its properties.


