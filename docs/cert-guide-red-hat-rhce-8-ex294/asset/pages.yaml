    # FOUNDATION TOPICS


    # MANAGING ANSIBLE ERRORS AND LOGS


    When a playbook is processed or an ad hoc command is executed, Ansible produces
    output. This output gives a first indication of what has happened. If the output
    does not provide enough information, you can use additional solutions. In this
    section you learn about them.


    # Using Check Mode


    Before actually running a playbook in a way that all changes are implemented,
    you can start the playbooks in check mode. To do this, you use the **--check**
    or **-C** command-line argument to the **ansible** or **ansible-playbook** command.
    The effect of using check mode is that changes that would have been made are shown
    but not executed. You should realize, though, that check mode is not supported
    in all cases. You will, for'
  merge: -1
  pgno: 447
- img_proc: true
  md: 'instance, have problems with check mode if it is applied to conditionals, where
    a specific task can do its work only after a preceding task has made some changes.
    Also, to successfully use check mode, the modules don''t support it, but some
    don''t. Modules that don''t support check mode don''t show any result while running
    check mode, but also they don''t make changes.


    Apart from the command-line argument, you can use **check_mode: yes** or **check_mode:
    no** with any task in a playbook. If **check_mode: yes** is used, the task always
    runs in check mode (and does not implement any changes), regardless of the use
    of the --check option. If a task has **check_mode: no** set, it never runs in
    check mode and just does its work, even if the **ansible-playbook** command is
    used with the --check option. Using check mode on individual tasks might be a
    good idea if using check mode on the entire playbook gives unpredictable results:
    you can enable it on just a couple of tasks to ensure that they run successfully
    before proceeding to the next set of tasks. Notice that using check_mode: no for
    specific tasks can be dangerous; these tasks will make changes, even if the entire
    playbook was started with the --check option!'
