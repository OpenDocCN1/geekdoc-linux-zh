    it returns a value of -1. If the requested string is found, the **find** function
    returns an integer that returns the position where the string was found. For instance,
    if the string lisa is found in /etc/passwd, it returns an unexpected value 2604,
    which is the position in the file, expressed as a byte offset from the beginning,
    where the string is found for the first time.


