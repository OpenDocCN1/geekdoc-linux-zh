    # Using Key-Value Pairs


    YAML is all about defining key-value pairs, also known as dictionaries. An example
    of such a key-value pair is **name: vsftpd** key-value pairs can be defined in
    two ways: **key: value** or **key=value**. Of these two, the first method is preferred,
    but the second way works.


    If an object in YAML needs multiple key-value pairs to define its properties,
    it is common to define one key-value pair on a line. If the **key=value** format
    is used, it''s possible to define all the multiple key-value pairs on one line.
    The sample playbook in Listing 5-4 shows such'
