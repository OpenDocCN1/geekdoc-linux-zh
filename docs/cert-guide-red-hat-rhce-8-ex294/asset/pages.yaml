  md: '# ADVANCED INVENTORY USAGE


    You have already learned how to create an inventory file. Up to now, you have
    worked with a small inventory file that contains just a couple of hosts, which
    can be put into inventory groups. When an environment is getting bigger, you''ll
    probably want some more flexibility regarding inventory files. This section is
    about advanced inventory usage. You learn how to make inventory flexible by working
    with host name patterns, dynamic inventory, and multiple inventory files.


    # Working with Host Name Patterns


    To work with hosts, you need to list them in inventory. This can be done by including
    host names, as well as IP addresses. If you want to use an IP address in a playbook,
    the IP address must be specified as such in the inventory. You cannot use IP addresses
    that are based only on DNS name resolving. So specifying an IP address in the
    playbook but not in the inventory file—assuming DNS name resolution—doesn’t work.


    The easiest way to refer to multiple hosts is to use host groups. Groups can be
    specified in inventory, and apart from the specified groups, there are the implicit
    host'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'groups all and ungrouped. Apart from that, host name wildcards may be used.
    For instance, you can use ansible -m ping ''ansible*'' to match all hosts that
    have a name starting with ansible. When you use wildcards in host name patterns,
    it is important to always put the pattern between single quotes: the command ansible
    -m ping ansible* will fail with a no matching error. Wildcards can be used at
    any place in the host name. You so also use ansible -m ping ''*ble1’, as long
    as the pattern is placed between single quotes.


    Note that when you use wildcards to match host names, Ansible doesn’t distinguish
    between IP addresses, host names, or hosts; it just matches anything. So the pattern
    ''web*'' matches all servers that are members of the group ''webservers'', but
    also hosts ''web1'' and ''web2''.


    To address multiple hosts, you can also specify a comma-separated list of targets,
    as in ansible -m ping ansible1,192.168.4.202. The comma-separated list can be
    a mix of anything and can include host name, addresses, and host group names.


    Some more advanced patterns are possible as well. You can specify a logical AND
    condition by including an ampersand (&), and a logical NOT by using an exclamation
    point (!). So the pattern web,&file applies to hosts only if they are members
    of the web and file'
  merge: -1
  pgno: 413
- img_proc: true
  md: 'groups, and the pattern web,!webserver1 also applies to all hosts in the web
    group, except host webserver1. When you use the logical AND operator, the position
    of the ampersand doesn''t really matter. So you can rewrite web,&file as &web,file
    also. Notice that you can use a colon (:) instead of a comma (,), but using a
    comma is better to avoid confusion when using IPv6 addresses, which contain colons
    by default.


    # Configuring Dynamic Inventory


    Static inventories work well for a small environment. However, if the environment
    is getting bigger and more dynamic, static inventories are not efficient anymore,
    so dynamic inventories may be considered. A dynamic inventory is a script that
    can be used to detect whether new hosts have been added to the managed environment.


    > Key Topic


    Dynamic inventory scripts are provided by the community and exist for many different
    environments. Alternatively, it is fairly easy to write your own dynamic inventory
    script. The main requirement is that the dynamic inventory script works with a
    --list and a --host <hostname> option and produces its output in JSON format.
    Also, the script must have the Linux execute permission set. Many dynamic inventory
    scripts'
