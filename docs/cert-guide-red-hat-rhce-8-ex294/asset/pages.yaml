    \ http_sys_content_t\n      state: present\nnotify:\n  - run restorecon\nhandlers:\n\
    \  - name: restorecon\n    command: restorecon -v /tmp/selinux\n```\n\nIn the\
    \ sample playbook in Listing 8-11, the required software package is installed\
