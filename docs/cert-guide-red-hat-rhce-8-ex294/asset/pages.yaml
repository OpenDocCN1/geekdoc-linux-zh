  md: '# MANAGING ENCRYPTED PASSWORDS


    When managing users in Ansible, you probably want to set user passwords as well.
    The challenge is that you cannot just enter a password as the value to the **password**:
    argument in the user module because the user module expects you to use an encrypted
    string.


    # Understanding Encrypted Passwords


    When a user creates a password, it is encrypted. The hash of the encrypted password
    is stored in the /etc/shadow file, a file that is strictly secured and accessible
    only with root privileges. The string looks like $$237687687/$9809erhb8oywy48oih290u09.
    In this string are three elements, which are separated by $ signs:


    +   - The hashing algorithm that was used

    - The random salt that was used to encrypt the password

    - The encrypted hash of the user password


    When a user sets a password, a random salt is used to prevent two users who have
    identical passwords from having identical entries in /etc/shadow. The salt and
    the unencrypted password are combined and encrypted, which generates the encrypted
    hash that is stored in'
  merge: -1
  pgno: 554
- img_proc: true
  md: '/etc/shadow. Based on this string, the password that the user enters can be
    verified against the password field in /etc/shadow, and if it matches, the user
    is authenticated.


    # Generating Encrypted Passwords


    When you''re creating users with the Ansible user module, there is a password
    option. This option is not capable of generating an encrypted password. It expects
    an encrypted password string as its input. That means an external utility must
    be used to generate an encrypted string. This encrypted string must be stored
    in a variable to create the password. Because the variable is basically the user
    password, the variable should be stored securely in, for example, an Ansible Vault
    secured file.


    To generate the encrypted variable, you can choose to create the variable before
    creating the user account. Alternatively, you can run the command to create the
    variable in the playbook, use register to write the result to a variable, and
    use that to create the encrypted user. If you want to generate the variable beforehand,
    you can use the following ad command:


    ```

    ansible localhost -m debug -a "msg={{ ''password'' |

    password_hash(''sha512'',''myrandomomsalt'') }}"

    ```


    This command generates the encrypted string as shown in Listing 13-11, and this
    string can next be used in a'
