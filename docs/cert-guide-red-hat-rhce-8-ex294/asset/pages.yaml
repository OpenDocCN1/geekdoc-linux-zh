  md: "```\n---\n- name: conditional install\n  hosts: all\n  tasks:\n    name: install\
    \ apache on Red Hat and family\n    yum:\n      name: httpd\n      state: latest\n\
    \      when: ansible_facts['os_family'] == \"RedHat\"\n    name: install apache\
    \ on Ubuntu and family\n    apt:\n      name: apache2\n      state: latest\n \
    \     when: ansible_facts['os_family'] == \"Debian\"\n```\n\nThe use of **when**:\
    \ Because it is not a part of properties of the modules on which it is used, the\
    \ **when** statement must be indented at the same level as the module itself.\
    \ In the example in Listing 7-7, a string test is used to check whether the value\
    \ of the Ansible fact **ansible_os_family** (which in the playbook is written\
    \ as the equivalent **ansible_facts['os_family']**) is equal to the string RedHat.\
    \ Because this is a string test, the string itself must be between double quotes.\
    \ Without the double quotes, it would be considered an integer test. A string\
    \ test is just one of the many conditional tests that can be executed. Table 7-3\
    \ provides an overview with some other examples of conditional tests.\n\nListing\
    \ 7-8 shows the output of the playbook in Listing 7-7. Because no hosts use a\
