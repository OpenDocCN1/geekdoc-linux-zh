  md: "When you use the RHEL SELinux System Role, some changes require the managed\
    \ host to be rebooted. To take care of this, a block structure is used, where\
    \ the System Role runs in the block. When a change that requires a reboot is applied,\
    \ the SELinux System Role sets the variable selinux_reboot_required and fails.\
    \ As a result, the rescue section in the playbook is executed. This rescue section\
    \ first makes sure that the playbook fails because of the selinux_reboot_required\
    \ variable being set to true. If that is the case, the reboot module is called\
    \ to reboot the managed host. While rebooting, playbook execution waits for the\
    \ rebooted host to reappear, and when that happens, the RHEL SELinux System Role\
    \ is called again to complete its work. Listing 9-9 shows the part of the sample\
    \ playbook that takes care of this task.\n\n# Listing 9-9 Rebooting Managed Hosts\
    \ If Required\n\n```\nname: execute the role and catch errors\nblock:\n  - include_role:\n\
    \      name: rhel-system-roles.selinux\nrescue:\n  # Fail if failed for a different\
    \ reason than\n  selinux_reboot_required:\n    - name: handle errors\n      fail:\n\
    \        msg: \"role failed\"\n        when: not selinux_reboot_required\n\n \
    \ - name: restart managed host\n    shell: sleep 2 && shutdown -r now \"Ansible\n\
    updates triggered\"\n```"
