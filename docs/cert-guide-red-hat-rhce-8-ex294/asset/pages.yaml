    # # Optimizing Command Output Error Formatting


    You might have noticed that the formatting of error messages in Ansible command
    output can be a bit hard to read. Unfortunately, there''s an easy way to make
    it a little more readable by including two options in the ansible.cfg file. These
    options are **stdout_callback = debug** and **stdout_callback = error**. After
    including these options, you''ll notice it''s a lot easier to read error output
    and distinguish between its different components!


    # # Logging to Files


    By default, Ansible does not write anything to log files. The reason is that the
    Ansible commands have all the options that may be useful to write output to the
    STDOUT. If so required, it''s always possible to use shell redirection to write
    the command output to a file.


    If you need Ansible to write log files, you can set the **log_path** parameter
    in ansible.cfg. Alternatively, Ansible can log to the filename that is specified
    as the argument to the $ANSIBLE_LOG_PATH variable. Notice that Ansible logs can
    grow big very fast, so if'
  merge: -1
  pgno: 456
- img_proc: true
  md: 'logging to output files is enabled, make sure that Linux log rotation is configured
    to ensure that files cannot grow beyond a specific size.


