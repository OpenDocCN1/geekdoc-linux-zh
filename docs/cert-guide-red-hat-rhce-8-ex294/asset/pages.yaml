    \ update an AppStream module\n    yum:\n      name: '@php:7.3/devel'\n      state:\
    \ present\n```\n\n> Note\nWhen using the yum module to install multiple packages,\
    \ you can provide the name argument with a list of multiple packages. Alternatively,\
    \ you can provide multiple packages in a loop. Of these solutions, using a list\
    \ of multiple packages as the argument to name is always preferred. If multiple\
    \ package names are provided in a list, the yum module must execute a task for\
    \ every single package. If multiple package names are provided as the argument\
    \ to name, yum can install all these packages in one single task.\n\n# Managing\
