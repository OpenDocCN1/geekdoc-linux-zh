- img_proc: true
  md: "precedence.\n\n+   - /etc/ansible/roles is the location where roles are stored\
    \ to make them accessible to any user.\n\n+   - /usr/share/ansible/roles is the\
    \ location where roles are stored after they are installed from RPM files. This\
    \ location has lowest precedence and should not be used for storing custom-made\
    \ roles.\n\nTo create a custom role, you just have to create the default role\
    \ directory structure with a main.yml file at the location where it is expected.\
    \ To easily create the custom directory structure, you can use the ansible-galaxy\
    \ init command. This command creates all directories including sample files for\
    \ you, after which you just have to provide the specific contents.\n\n# Using\
    \ Roles from Playbooks\n\nAfter making the roles you want to use available, you\
    \ need to use them from a playbook. Using roles from a playbook is not difficult:\
