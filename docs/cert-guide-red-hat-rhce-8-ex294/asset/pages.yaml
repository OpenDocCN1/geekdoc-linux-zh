  md: '# Using Jinja2


    In Jinja2 templates, you can use filters. Filters are a way to perform an operation
    on the value of a template expression, such as a variable. The filter is included
    in the variable definition itself, and the result of the variable and its filter
    is used in the file that is generated. Table 8-5 gives an overview of some common
    filters. Exercise 8-3 you practice your skills and work with templates that use
    a conditional statement.


    **Table 8-5** Common Filters Overview


    | Filter example | Use |

    | --- | --- |

    | {{ myvar \| to_json }} | Writes the contents of myvar in JSON format |

    | {{ myvar \| to_yaml }} | Writes the contents of myvar in YAML format |

    | {{ myvar | ipaddr }} | Tests whether myvar contains an IP address |


