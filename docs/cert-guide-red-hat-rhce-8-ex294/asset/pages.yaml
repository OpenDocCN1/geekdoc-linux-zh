  md: 'In Ansible, there are three types of variables. Table 6-2 provides an overview.


    # Table 6-2 Ansible Variable Types Overview


    | Type | Use |

    |---|---|n| Fact | Variables that contain values describing specific system properties
    |

    | Variable | Variables that are defined at the discretion of the user |

    | Magic Variable | System variable that is automatically set |


    Ansible facts are system properties that are collected when Ansible executes on
    a remote system. After facts are gathered, the facts can be used as variables.
    Apart from the system facts, which just exist as a system property, there are
    custom facts. These facts are defined by an administrator and stored as a file
    on the managed hosts. In the following sections, you learn how to work with facts
    on Ansible-managed systems. Magic Variables are specific system variables, which
    will be discussed later in this chapter.


    # Gathering Facts


    When any Ansible playbook is used, it first gathers facts for all the managed
    hosts. This is done by an implicit fact gathering task in every playbook. The
    result of this process is stored in the ansible_facts variable. Let’s run'
  merge: -1
