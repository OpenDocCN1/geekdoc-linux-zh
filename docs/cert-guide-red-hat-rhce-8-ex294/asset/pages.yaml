    # Ansible Is Python


    There are many programming and scripting languages in use in IT. In open source,
    the last few decades have seen the rise of the Python scripting language. Python
    has become the foundation of different solutions, such as Ansible and OpenStack.
    The reason is that Python is relatively easy to learn. The focus in Python is
    on readability of code, while at the same time Python makes it possible to do
    things in an easy way.


    Ansible is written in Python, and most components that are used in Ansible are
    written in Python as well. The default Ansible version that is installed on Red
    Hat'
