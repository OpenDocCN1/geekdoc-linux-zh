  md: '# Introduction


    Welcome to the Red HatCE 8 (EX294) Cert Guide!

    With the release of Red Hat Enterprise Linux 8, Red Hat has decided to take a
    completely new direction for the RHCE exam. The exam is now completely about managing
    configurations with Ansible. This is a great choice because in the current IT
    landscape the days of the system administrator who applies specialized skills
    to tune individual servers is over. Today the work is all about automation, and
    Ansible has rapidly become one of the most important solutions to do so.


    As a Linux instructor with more than 25 years of experience, I have been certified
    for both the RHCSA and RHCE exams for every RHEL version since RHEL 4. Taking
    the exams myself has helped me keep current on the progression of the exam, what
    is new, and what is different. I am thrilled to be able to share my knowledge
    with you in this comprehensive Cert Guide so you can get the guidance you need
    to pass your RHCE RHEL 8 EX294 exam.


    As you will see, this Cert Guide covers every objective in the updated RHCE exam,
    with 16 chapters, more than 40 exercises, 4 practice exams (2 printed in the book
    and 2 on the companion website), and 2 hours of video'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'training. This Red Hat RHCE 8 (EX294) Cert Guide is the best resource you can
    get to prepare for and pass the exams.


    # GOALS AND METHODS


    To learn the topics described in this book, I recommend that you create your own
    testing environment, which is explained in Chapter 2, “Installing Ansible.” You
    cannot become an RHCE without practicing a lot. To get familiar with the topics
    in the chapters, here is what I recommend:


    +   Read the explanation in the chapters and study the code examples that are
    provided in the listings. For your convenience, the listings are also provided
    in the book GitHub repository at https://github.com/sandervanvugt/rhce8-book.
    Study the examples and try to understand what they do.


    +   Walk through all of the numbered exercises in the book. The numbered exercises
    provide step-by-step instructions, and you should follow along with all of them,
    to walk through configuration tasks and learn how to manage specific features.


    +   At the end of each chapter, there’s an end-of-chapter lab. This lab is much
    like the lab assignments that you will find on the exam.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Within the exercises included in every chapter of the book, you will find all
    the examples you need to understand what is on the exam and thoroughly learn the
    material needed to pass it. The exercises in the chapters provide step-by-step
    procedure descriptions that you can work through to find working solutions that
    you can get real experience before taking the tests. Although you may feel familiar
    with some topics, it''s a good idea to work through all of the exercises in the
    book. The RHCE exam is hands-on, which can be a lot of pressure on test. The exercises
    in each chapter provide the practice you need to make sure you have the experience
    you need to not make small errors and mistakes while taking the exam. The exercises
    are the best way to make sure you work through common errors and learn from your
    mistakes before you take the test.


    Each chapter also includes an end-of-chapter lab. These labs ask questions that
    are similar to the questions that you might encounter on the exam so you can use
    them to practice. I have purposely excluded solutions for these labs for a few
    reasons: (1) you need to train yourself to verify your work before test day because
    you will be expected to do this on the exam; (2) while taking the test, you will
    be required to verify for yourself whether your solution is working as expected;
    and (3) most labs have multiple solutions and I don''t want to'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'suggest that my solution is the right one and yours is wrong because it takes
    a different approach. Your solution is as good as mine, as long as it accomplishes
    what was asked for in the exercise.


    # OTHER RESOURCES


    This book contains everything you need to pass the exam, but if you want more
    guidance and practice, I have a number of video training titles available to help
    you study, including the following:


    +   • Hands-on Ansible Complete Video Course


    +   • Red Hat Certified Engineer (RHCE) 3/ed Video Course


    Apart from these products, you might also appreciate my website: rhatcert.com.
    Through this website, I provide updates on anything that is useful to exam candidates.
    I recommend that you register on the website so that I can send you messages about
    important updates that I''ve made available. Also, you''ll find occasional video
    updates on my YouTube channel: rhatcert. I hope that these resources provide you
    with everything you need to pass the Red Hat exams in an affordable way! Good
    luck!


    # WHO SHOULD READ THIS BOOK?'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'This book is written as an RHCE exam preparation guide. That means that you
    should read it if you want to increase your chances of passing the RHCE exam.
    I have also written this book to help you become familiar with Ansible. So even
    if you''re not interested in the RHCE EX294 exam at all, this book will tell you
    everything you need to know to get your Ansible career up and running.


    So, why should you consider passing the RHCE exam? That question is simple to
    answer. Linux has become a very important operating system, and qualified professionals
    are sought after all over the world. If you want to work as a Linux professional
    and prove your skills, the RHCE certificate really helps. Having certificates
    dramatically increases your chances of becoming hired as a Linux professional.
    Notice that in order to get RHCE certified, you must hold a current RHCSA certification.
    You can take the RHCE EX294 exam before you are RHCSA certified, but you can call
    yourself an RHCE only if you have passed both the RHCSA exam and the RHCE exam.


    # HOW THIS BOOK IS ORGANIZED


    This book is organized as a reference guide to help you prepare for the exams.
    If you''re new to the topics, you'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'can just read it cover to cover. You can also read the individual chapters
    that you need to fine-tune your skills in this book. Every chapter starts with
    a “Do I Know This Already?” quiz. This quiz asks questions about 10 topics that
    are covered in each chapter and provides a simple tool to check you''re already
    familiar with the topics covered in a chapter. These quizzes do not represent
    the types of questions you will get on the real exam though.


    The best exam preparation is offered in the RHCE practice exams; these are an
    essential part of readying yourself for the real testing experience. You might
    be able to provide the right answer to the multiple-choice chapter questions,
    but that doesn’t mean that you can create the configurations when you take the
    tests. We have included two practice exams in the printed book. The book’s companion
    website then includes two additional practice exams as well as flashcards created
    from the book’s glossary so you can further test your knowledge and skills. You
    will also find two hours of video from my Red Hat Certified Engineer (RHCE) 3/ed
    Complete Video Course.


    The following topics are covered in the chapters:


    +   * **Chapter 1, “Understanding Configuration Management”**: In this chapter,
    you learn about Ansible as a solution. The chapter explains what can be done with
    Ansible and how Ansible relates to'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'other solutions for configuration management.


    +   * **Chapter 2, “Installing Ansible”**: This chapter covers installation of
    Ansible. You learn what is needed to set up the Ansible control node, as well
    as the other parts of the Ansible software.


    +   * **Chapter 3, “Setting Up an Ansible Managed Environment”**: In this chapter
    you learn how to get started with node management. The chapter explains what is
    needed on the managed nodes as well as the essential Ansible configuration files
    that are required to reach out to the managed nodes.


    +   * **Chapter 4, “Using Ad Hoc Commands”**: In this chapter you learn about
    Ansible modules. Modules are the heart of Ansible, they provide solutions for
    everything that Ansible can do, and the easiest way to use these modules is in
    ad hoc commands. In this chapter you learn how to work with them.


    +   * **Chapter 5, “Getting Started with Playbooks”**: This chapter provides an
    introduction to working with playbooks. You learn about YAML, the language used
    to write playbooks, and how to structure a playbook using plays and tasks.


    +   * **Chapter 6, “Working with Variables and Facts”**: In Ansible, variables
    can be used to provide dynamic values to specific configuration items. Using variables
    enables you to separate the static'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'code in a playbook with host-specific information. In this chapter you learn
    how to work with variables as well as Ansible facts, which are variables that
    are automatically set for managed nodes.


    +   **• Chapter 7, “Using Task Control”**: To make Ansible smart, you must apply
    task control. Using task control enables you to run tasks conditionally, and can
    be done in many ways. You learn how to use tests, to test for a specific condition,
    as well as loops that allow you to evaluate a range of items, and handlers, which
    allow for task execution only if another task was executed successfully.


    +   **• Chapter 8, “Deploying Fleets”**: Ansible is used for configuration management,
    and configuration on Linux is stored in files. Hence, managing files is a key
    skill in Ansible. In this chapter you learn how to use modules to modify files
    and how to use templates to automatically set up configuration files with specific
    parameters obtained from facts or variables.


    +   **• Chapter 9, “Using Ansible Roles”**: When you are working with Ansible,
    it’s good if code can be reused. That is what Ansible roles are all about. In
    this chapter you learn how to work with roles, which are provided through Ansible
    Galaxy, or as RHEL system roles.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '**Chapter 10, “Using Ansible in Large Environments”**: When working with Ansible
    in large environments, you should know about a few specific techniques. These
    techniques are covered in this chapter. You learn how to optimize Ansible by modifying
    the number of concurrent tasks that can be executed. You also learn how to work
