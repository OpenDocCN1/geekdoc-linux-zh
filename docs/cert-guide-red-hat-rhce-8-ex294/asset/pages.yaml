    # WORKING WITH MODULES


    Ansible functionality is provided by modules. More than 3000 modules are available
    to take care of a wide range of tasks, allowing administrators to manage Linux
    servers, Windows servers, cloud infrastructure, cloud instances, containers, network
    devices, and much more. Knowing Ansible equals modules. Finding the right module
    for the right task is a key skill, and the more modules you know, the easier working
    with Ansible will be.


    The modules can best be seen as plug-in programs that are used in Ansible playbooks
    or when using ad hoc commands. The modules themselves are written as Python scripts.
    That doesn''t mean that you have to know Python though. Python knowledge is required
    only if you are a developer who wants to develop your own modules.


    # Exploring Essential Modules


    Because working with modules is key, let''s explore some key modules. Table 4-3
    provides an overview.


    Table 4-3 Ansible Key Modules'
