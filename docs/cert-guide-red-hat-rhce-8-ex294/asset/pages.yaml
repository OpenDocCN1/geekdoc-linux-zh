  md: '# Browsing Available Modules


    As mentioned before, to be successful with Ansible, you need to know modules.
    There are many modules, of course, and to figure out which modules are available,
    you can use **ansible-doc -l**. This command lists all modules that are installed
    on your system. When you use it on a CentOS 8.1 installation with a default Ansible
    installation, you see that no fewer than 3387 modules are installed!


    The fact is that many modules are available for Ansible—so many that you''ll never
    use all of them, and also so many that in some cases you''ll have a choice between
    different modules to accomplish the same task. When you''re new to Ansible, finding
    the appropriate module can be hard. By working your way through this Cert Guide,
    you''ll learn about some of the most useful modules, but you''re always advised
