    \ and which type of file you'll find where.\n\n# Listing 9-1 Roles Sample Directory\
    \ Structure\n\n```\nansible@control roles]$ tree tretestrole/\ntretestrole/\n\
    -- defaults\n  -- main.yml\n-- files\n-- handlers\n  -- main.yml\n-- meta\n  --\
    \ main.yml\n-- README.md\n-- tasks\n  -- main.yml\n-- templates\n-- tests\n  --\
    \ inventory\n  -- test.yml\n-- vars\n  -- main.yml\n```\n\n# Table 9-2 Role Directory\
    \ Structure"
