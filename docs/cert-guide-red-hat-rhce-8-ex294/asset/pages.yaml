  md: '> Note

    Fact caching can be convenient but should be used with caution. If, for instance,
    a playbook installs a certain package only if a sufficient amount of disk space
    is available, it should not do this based on information that may be up to 24
    hours old. For that reason, using a fact cache is not recommended in many situations.


    # Working with Custom Facts


    Apart from the facts that can be gathered in all cases, Ansible also offers an
    option to work with custom facts. A custom fact is used to provide a host with
    arbitrary values that Ansible can use to change the behavior of plays. Custom
    facts can be provided as static files. These files must be in either INI or JSON
    format, have the extension .fact, and on the managed hosts stored in the /etc/ansible/facts.d
    directory.


    Alternatively, custom facts can be generated by a script, and in that case the
    only requirement is that the script must generate its output in JSON format. Dynamic
    custom facts are useful because they allow the facts to be determined at the moment
    that a script is running. Listing 6-8 provides an example of a static custom fact
    file.


    # Listing 6-8 Custom Facts Sample File


    ```

    [packages]

    web_package = httpd

    ftp_package = vsftpd

    ```'
