  md: 'Because there are many different ways to refer to facts, they may be quite
    confusing. Let''s finish this section with an overview of all options:


    # Key Topic


    +   - In Ansible versions since 2.5, all facts are stored in one variable: ansible_facts.
    This method is used while gathering facts from a playbook

    - Before Ansible version 2.5, facts were injected into variables such as ansible_hostname.
    This method is used by the setup module. (Note that this may change in future
    versions of Ansible)

    - Facts can be addressed in dotted notation: `{{ansible_facts.default_ipv4.address}}.

    - Alternatively, facts can be addressed in square brackets notation: `{{ansible_facts[''default_ipv4''][''address'']}}.

    This notation is preferred.


    # Managing Fact Gathering


    By default, upon execution of each playbook this slows down playbooks, and for
    that reason, it is possible to disable fact gathering completely. To do so, you
    can use the `gather_facts: no` parameter in the play header. If later in the same
    playbook it is necessary to gather facts, you can do this by running the setup
    module in a task.'
