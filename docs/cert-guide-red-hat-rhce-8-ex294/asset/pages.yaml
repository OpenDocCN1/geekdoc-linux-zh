    than 60 books about different Linux-related topics, including the best-selling
    RHCSA-RHCE 7 Cert Guide and the RHCSA 8 Cert Guide. Sander is also the author
    of more than 25 video Video Courses, including his RHCSA and RHCE Complete Video
    Courses, Hands-On Ansible LiveLessons, and many other titles. He teaches courses
    for customers around the world and is also a regular speaker at major conferences
