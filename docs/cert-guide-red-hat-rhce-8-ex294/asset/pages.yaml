  md: 'Let’s look at a sample command, and based on that sample, try to understand
    what is needed in an ad hoc command:


    ```

    ansible all -m user -a "name=lisa"

    ```


    This command contains a few de-gients. To start with, there is the **ansible**
    command, which is the command for running ad hoc commands. Next, you need to specify
    on which hosts you want to run the ad hoc commands, which is accomplished by the
    **all** part of the command. The third element refers to the module that you want
    to run. A module is a script that is executed by Ansible to perform a specific
    task. In the sample command shown, the **-m** option is used to call the module,
    and the specific module in this example is **user**. Finally, you need to provide
    arguments to the module by using the **-a** option. In an ad hoc command, all
    arguments are provided between double quotes. In this case there is just one argument,
    but if there are many arguments, all of them need to be included between double
    quotes.

    Table 4-2 summarizes all these components of the ad hoc command.


    # **Table 4-2** Ad Hoc Command Components'
  merge: -1
  pgno: 132
- img_proc: true
  md: '| Command | Use |

    |---|---|

    | ansible | The command to run ad hoc commands |

    | all | Managed nodes where the command should be issued |

    | -in user | The module to be used |

    | -a "name=lisa" | Arguments to be passed to the module |


    When running an ad hoc command, you must be using your Ansible user account (not
    root), and you must be in a project directory where the inventory file and the
    ansible.cfg file can be found. Next, you run the command **ansible all -m user
    -a “name=lisa”**, which reaches out to all hosts in inventory to ensure that user
    lisa exists.


