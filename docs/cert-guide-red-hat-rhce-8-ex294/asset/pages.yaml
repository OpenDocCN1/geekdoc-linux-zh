  md: "| Directory | Contents |\n| --- | --- |\n| defaults | Defunt variables that\
    \ may be overwritten by other variables |\n| files | Static files that are needed\
    \ by role tasks |\n| handlers | Handlers for use in this role |\n| meta | Metadata,\
    \ such as dependencies, plus license and maintainer information |\n| tasks | Role\
    \ task definitions |\n| templates | Jinja2 templates |\n tests | Optional inventory\
    \ and a test.yml file to test the role |\n| vars | Variables that are not meant\
    \ to be overwritten |\n\nMost of the role directories have a main.yml file. This\
    \ is the entry-point YAML file that is used to define components in the role.\n\
    \n# Understanding Role Location\n\nBefore creating your own custom role, you need\
    \ to decide where to store it. Roles can be stored in different locations:\n\n\
    +   - /.roles is used to store roles in the current project directory. This location\
    \ has the highest precedence.\n- ~/.ansible/roles exists in the current user home\
    \ directory and makes the role available to the current user only. This location\
    \ has second-highest"
  merge: -1
