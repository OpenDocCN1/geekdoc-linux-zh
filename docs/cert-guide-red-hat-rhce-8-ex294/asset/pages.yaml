    \ are true, the task is successful. Based on the success or failure of a task,\
    \ the module uses the success_msg or fail_msg options to print a message. Listing\
    \ 11-11 shows an example that uses the assert module.\n\n# Listing 11-11 Using\
    \ the assert Module\n\n```\n---\n- hosts: localhost\n  vars_prompt:\n    - name:\
    \ filesize\n      prompt: \"specify a file size in megabytes\"\n  tasks:\n   \
    \ - name: check if file size is valid\n      assert:\n        - \"{{ (filesize\
    \ | int) <= 100 }}\"\n        - \"{{ (filesize | int) >= 1 }}\"\n      fail_msg:\
    \ \"file size must be between 0 and 100\"\n      success_msg: \"file size is good,\
    \ let\\'s continue\"\n    - name: create a file\n      command: dd if=/dev/zero\
    \ of=bigfile count=$({filesize})\n```\n\nThe example in Listing 11-11 contains\
    \ a few new items. As you can see, the play header starts with a vars_prompt.\
    \ This defines a named variable filesize, which is based on the input provided\
    \ by the user. This filesize variable is next used by the assert module. The that\
    \ statement contains a list in which two conditions are stated. If specified like\
    \ this, all conditions stated in"
