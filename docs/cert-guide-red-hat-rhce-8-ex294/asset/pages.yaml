  md: '# Appendix B. Getting Started with Ansible Tower


    In this book you’ve learned how to work with Ansible from the command line, or
    Ansible Engine as Red Hat refers to it. Although working with Ansible from the
    command line offers you all that you may ever need, there is an alternative that
    enables you to manage Ansible from a web-based environment. This solution is known
    as Ansible Tower. You won’t find one single question about Ansible Tower on the
    exam, but the solution is too important to completely ignore it, which is why
    in this appendix I introduce you to working with Ansible Tower. This appendix
    covers the following topics:


    +   - Understanding Ansible Tower

    - Installing Ansible Tower

    - Installing AWX

    - Managing Nodes with Ansible Tower

    - Understanding Ansible Tower Core Components

    - Running a Project in Ansible Tower


    # UNDERSTANDING ANSIBLE'
  merge: -1
  pgno: 706
- img_proc: true
  md: '# TOWER


    Ansible Tower offers a web-based environment to manage Ansible in large environments.
    From this dashboard you can easily get an overview of the current status of Ansible,
    the job activity, and the success and failure of recent jobs. It offers other
    benefits as well:


    +   **Workflow Design:** Using Ansible workflows enables you to model complex
    processes in Ansible Tower. Different playbooks can be connected together and
    use different inventories as well as different credentials to run the playbooks.


    +   **Activity logging:** Ansible Tower provides activity logging. You can easily
    find out which user ran which job at what specific time.


    +   **Scalability:** You can build clusters with Ansible Tower. In a cluster,
    up to 20 cluster nodes can work together to provide Ansible control node functionality
    in a scalable way and service up to 200,000 nodes.


    +   **Notifications:** Ansible Tower can be configured to send notifications to
    specific users.


    +   **Scheduling:** In Ansible Tower you are able to schedule jobs to run at a
    specific time.


    +   **Integrated inventory:** In Ansible Tower, multiple sources of inventory
    can be used and presented as'
  merge: -1
  pgno: 707
- img_proc: true
  md: 'one big inventory, no matter where the inventory hosts come from.


    +   - **Self-service**: Using Ansible Tower makes it easy to delegate jobs to
    specific users. Ansible Tower enables you to create user accounts and grant specific
    Tower permissions to specific jobs.


    +   - **Remote execution**: The Ansible Tower run command interface provides an
    easy-to-use interface for remote command execution, which in fact runs ad hoc
    commands on selected nodes.


    +   - **REST API and Tower CLI tool**: Apart from the web interface, Ansible Tower
    provides a REST API and the towercli command-line tool, which allows users to
    address the API directly without using the web interface.


    Ansible Tower is a Red Hat product that comes with an enterprise license for updates
    and support. You can request a limited evaluation version of Tower at ansible.com,
    or you can use the open-source upstream project AWX instead.


    Once they are configured, there is no difference between Tower and AWX. The setup
    procedure for both solutions is quite different, which is why the following sections
    contain instructions for setting up both environments. To install either solution,
    you need a dedicated node that meets the following requirements:'
  merge: -1
  pgno: 708
- img_proc: true
  md: '+   - 4 GB RAM (8 GB recommended)

    • 2 vCPUs

    • 20 GB disk space, much more when used to manage many nodes

    • RHEL 7 or 8


    The managed machines have no specific requirements. Even when used with Ansible
    Tower, Ansible is still agentless, which means that normal access mechanisms are
    used for the managed machines.


    # # INSTALLING ANSIBLE TOWER


    To install the Ansible Tower software, you need to obtain a free evaluation version
    from www.ansible.com. This installation version gives access to a tarball, as
    well as a license. You can use the Ansible Tower license with your current Red
    Hat account or use a license file. The following procedure explains how to install
    Ansible Tower on a virtual machine that has CentOS 8.x installed.


    +   1. Go to https://ansible.com/products/tower and request access to the free
    evaluation of Ansible Tower.

    2. Store the tarball containing the Ansible software in your home directory. The
    name of the tarball should be ansible-tower-setup-latest.tar.'
  merge: -1
  pgno: 709
- img_proc: true
  md: '+   3. Use tar xvf ansible-tower-setup-latest.tar to extract the tar archive
    to the current directory.


    +   4. Use cd ansible[Tab] to change into the directory that was created by extracting
    the tarball.


    +   5. Type vim inventory to open the inventory file that is provided. Make sure
    to set your passwords as follows:


    ```

    admin_password=''password''

    pg_password=''password''

    rabbitmq_password=''password''

    ```


    +   6. Run the setup.sh file using sudo ./setup.sh. Completion will take about
    15 minutes.


    +   7. When setup is complete, access the Ansible Tower main web page, using https://localhost.
    Log in with the provided credentials.


    +   8. You now see a screen where you are prompted for a license (see Figure B-1).
    There are three options to access the license:


    +   * If you don''t have a license, click the Request License link to request
    one.


    +   * If you have a license file, use the Browse button to browse to the location
    of that file.


    +   * If your current Red Hat ID is entitled to use a'
