  md: '# Managing Systemd Targets


    Managing the default target that a host should start in a common task on Ansible.
    However, the systemd module has no options to manage this setting, and no other
    option to manage it is available. For that reason, you must fall back to a generic
    option instead.

    If you need to manage the default systemd target, a file with the name /etc/systemd/system/default.target
    has to exist as a symbolic link to the desired default target. See, for instance,
    Listing 14-5, where the output of the Linux ls -l command is used to show the
    current configuration.


    # Listing 14-5 Showing the Default System Target


    ```

    [ansible@control rhce8-book]$ ls -1

    /etc/systemd/system/default.target

    lrwxrwxrwx. 1 root 37 Mar 23 05:33

    /etc/systemd/system/default.target ->

    /lib/systemd/system/multi-user.target

    ```


    Because Ansible itself doesn''t have any module to specifically set the default.target,
    you must use a generic module. In theory, you could use either the command module
    or the file module, but because the file module is a more specific module to generate
    the symbolic link, you should use the file module. Listing 14-6 shows how to manage
    the boot target.


    # Listing 14-6 Managing the Default Boot Target'
  merge: -1
  pgno: 591
- img_proc: true
  md: "```\n---\n- name: set default boot target\nhosts: ansible2\ntasks:\n  - name:\
    \ set boot target to graphical\n    file:\n      src: /usr/lib/systemd/system/graphical.target\n\
    \      dest: /etc/systemd/system/default.target\n      state: link\n```\n\n# #\
    \ Rebooting Managed Hosts\n\nIn some cases, a managed host needs to be rebooted\
    \ while running a playbook. To do so, you can use the reboot module. This module\
    \ uses several arguments to restart managed nodes. To verify the renewed availability\
    \ of the managed hosts, you need to specify the test_command argument. This argument\
    \ specifies an arbitrary command that Ansible should run successfully on the managed\
    \ hosts after the reboot. The success of this command indicates that the rebooted\
    \ host is available again.\n\nEqually useful while using the reboot module are\
    \ the arguments that relate to timeouts. The reboot module uses no fewer than\
    \ four of them:\n\n+   - **connect_timeout**: The maximum seconds to wait for\
    \ a successful connection before trying again\n- **post_reboot_delay**: The number\
    \ of seconds to"
  merge: -1
  pgno: 592
- img_proc: true
  md: "wait after the reboot command before trying to validate the managed host is\
    \ available again\n\n+   **pre_reboot_delay**: The number of seconds to wait before\
    \ actually issuing the reboot\n\n+   **reboot_timeout**: The maximum seconds to\
    \ wait for the rebooted machine to respond to the test command\n\nWhen the rebooted\
    \ host is back, the current playbook continues its tasks. This scenario is shown\
    \ in the example in Listing 14-7, where first all managed hosts are rebooted,\
    \ and after a successful reboot the message “successfully rebooted” is shown.\
    \ Listing 14-8 shows the result of running this playbook. In Exercise 14-2 you\
    \ can practice rebooting hosts using the reboot module.\n\n# Listing 14-7 Rebooting\
    \ Managed Hosts\n\n```\n-- name: reboot all hosts\n  hosts: all\n  gather_facts:\
    \ no\n  tasks:\n    - name: reboot hosts\n      reboot:\n        msg: reboot initiated\
    \ by Ansible\n        test_command: whoami\n    - name: print message to show\
    \ host is back\n      debug:\n        msg: successfully rebooted\n```\n\n# Listing\
    \ 14-8 Verifying the Success of the reboot"
