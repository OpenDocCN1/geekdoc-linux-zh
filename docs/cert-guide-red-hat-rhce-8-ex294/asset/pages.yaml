  md: "# Listing 8-15 Exploring Jinja2 for Statements\n\n```\n{% node in groups['all']\
    \ %}\nhost_port={{ node }}:8080\n{% endfor %}\n```\n\nIn this Jinja2 file, a variable\
    \ with the name host_ports is defined on the second line (which is the line that\
    \ will be written to the target file). To produce its value, the host group all\
    \ is processed in the for statement on the first line. While processing the host\
