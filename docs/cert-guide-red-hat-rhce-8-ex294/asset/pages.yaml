  md: '# # Chapter 16. Final Preparation


    Congratulations! You made it through the book, and now it''s time to finish getting
    ready for the exam. This chapter helps you get ready to take and pass the exam.
    In this chapter, you learn more about the exam process and how to register for
    the exam. You also get some useful tips that help you avoiding some common pitfalls
    while taking the exam.


    # ## GENERIC TIPS


    In this section, you get some generic tips about the exam. You learn how to verify
    your exam readiness, how to register for the exam, and what to do on the exam.


    # ### Verifying Your Readiness


    Register for the exam only when you think you are ready for it. This book contains
    a lot of material to help you verify your exam readiness. To start with, you should
    be able to answer all the “Do I Know This Already?” questions, which you find
    at the beginning of each chapter. You should also have completed all the exercises
    in the chapters successfully. At the end of each'
  merge: -1
  pgno: 657
- img_proc: true
  md: 'chapter, you can find the end-of-chapter labs. These are the first real way
    of testing your readiness. The end-of-chapter lab questions are formulated in
    the same way as you might expect the real exam to be, so they are a good way of
    finding out whether you are ready for the exam.


    Now you have worked through all the material in this book, you are ready for the
    test exams in this chapter. Make sure that you can perform all the tests in the
    test exams before you register for the exam.


    No sample answers are provided for the test exams, and that is of purpose. On
    the real exams, nobody tells you what you''ve done wrong if you fail on specific
    tasks. You should be able to find out whether you have performed specific tasks
    successfully. If you are in doubt about specific tasks, chances are that you are
    not ready for these tasks. The idea is that you should make sure that you feel
    comfortable with the exam topics. And if you are, you''ll be able to verify the
    playbooks that you''ve written.


    # Registering for the Exam


    There are two ways of taking the RHCE exam. You can either take it as a classroom
    exam or as a kiosk exam. The classroom exam is typically on Friday only, and it
    is offered primarily by Red Hat to provide an exam at the end of a course. Therefore,
    most of the people who are'
  merge: -1
  pgno: 658
- img_proc: true
  md: 'with you in the exam classroom have taken four days of course training before
    taking the exam, and for that reason, classroom exam availability is limited.


    For a long time, the classroom exam was the only way to take the exam. For some
    time now, though, Red Hat provided kiosk exams too. A kiosk exam is an individual
    exam, where you work through the exam tasks on a kiosk computer. This monitored
    computer is in a booth in an exam center, where you are monitored through multiple
    cameras while working on the exam tasks. The good things about a kiosk exam are
    that it is individual and that you schedule the exam time and place yourself at
    your convenience.


    You can register for the exam through redhat.com or through a training company.
    It does not really matter where you buy it because you end up at the same exam
    anyway. It might be easier, though, to get a discount while booking through a
    local training company. Booking through Red Hat is faster normally because you
    have direct access to Red Hat. Notice that specific policies may apply to specific
    countries, and not all options may be available in your area.


    If you book a classroom exam, you get an invitation for the time and date the
    exam is scheduled. If you book a kiosk exam, you get a voucher code that you can
    use to book the exam venue, time, and date yourself.'
