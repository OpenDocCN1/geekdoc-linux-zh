    # From Ad Hoc Commands to Playbook


    Before we get into the details about possibilities of using them, explore them,
    let’s run a playbook. In Chapter 4, “Using Ad Hoc Commands,” you learned how to
    work with ad hoc commands, and in Listing 4-5, you created a Bash script to run
    some of these commands against managed nodes. Listing 5-1 shows you commands.


    # Listing 5-1 Running Ad Hoc Commands from a Script


    ```

    #!/bin/bash

    ansible all -m yum -a "name=httpd state=installed"

    ansible all -m service -a "name=httpd state=started enabled=yes"

    ```


    All that you do in this script can be done in a playbook as well. Just take a
    look at the playbook example in Listing 5-2 to see what a playbook would look
    like. If you look close enough, you can see that all elements that were specified
    in the ad hoc commands also occur in the playbook.


    # Listing 5-2 Configuring Hosts from a Playbook'
  merge: -1
  pgno: 169
- img_proc: true
  md: "```\n---\n- name: install start and enable httpd\n  hosts: all\n  tasks:\n\
    \  - name: install package\n    yum:\n      name: httpd\n      state: installed\n\
    \  - name: start and enable service\n    service:\n      name: httpd\n       \
    \ state: started\n        enabled: yes\n```\n\n# Playbook Elements\n\nA playbook\
    \ is a collection of plays. Each play targets specific hosts, and in each play\
    \ a list of tasks is specified. In the sample playbook in Listing 5-2, one play\
    \ with the name “install start and enable httpd” is defined.\n\nPlaybooks are\
    \ written in the YAML format and are normally saved with either the .yml or the\
    \ .yaml extension. YAML format essentially specifies objects as key-value pairs.\
    \ Dashes can be used to specify lists of embedded objects. For more details about\
    \ YAML, see the section “Working with YAML” later in this chapter.\n\nAt the start\
    \ of each playbook, you find three dashes. Optionally, you may also find three\
    \ dots at the end of the playbook. Using these characters makes it easy to embed\
    \ the playbook code into something else and easily isolate the playbook code when\
    \ it is included.\n\nWhile you’re working with playbooks, the target hosts"
  merge: -1
  pgno: 170
- img_proc: true
  md: 'are specified in the play, not in the command that runs the playbook (which
    happens in ad hoc commands). After you indicate the target hosts, you specify
    a list of tasks. Each item in the list is identified with a hyphen. For each task,
    you specify the Ansible module that the task is running and a name. Notice that
    using names for tasks is not mandatory but is highly recommended, because tasks
    using names makes it a little easier to identify which tasks have been able to
    run successfully. Next, you should identify the arguments that the task should
    be running.


    To identify hierarchical relations in playbooks, you use indentation. The basic
    rules for indentation are easy:


    +   - Data elements at the same level in the hierarchy must have the same indentation.

    - Items that are children (properties) and another element are indented more than
    the parents.


    You create indentation using spaces. There is no requirement for how many spaces
    to use, but using two spaces is common. Using tabs for indentation is not permitted.


    Within the playbook, one or more plays are defined. Plays are the highest level
    in the playbook, and each play starts with a hyphen. The reason is that the playbook
    defines a list of plays, and it is valid if the list contains just one play. All
    properties of the play (name,'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'hosts, and the word tasks) are indented at the same level, and next there is
    a list of tasks. The list of tasks is a property of the play, and these tasks
    are indented one level deeper than the parent items to show the hierarchical relation
    between play and tasks. The next level of indentation happens at the task argument
    level, where each argument is passed to a task is indented one more level deeper.


    > Tip

    To make working with indentation easier, you may configure the vi editor. If the
    following line is included in the file ~/.vimrc, indentation automatically happens
    correctly if vi detects that a YAML file is created. Notice this requires you
    to either use the .yaml or the .yaml extension to the files.

    ```

