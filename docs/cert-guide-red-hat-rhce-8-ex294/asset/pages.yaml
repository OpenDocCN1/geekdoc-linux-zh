    # yum


    The yum module can be installed to manage software on the Red Hat distribution
    and related distributions. Use, for example, ansible all -m yum -a “name=nmap
    state=latest” to install the latest version of the nmap package on all managed
    nodes. Notice that yum is not the only module available for managing software.
    A more generic module is package, which has the advantage that it works on any
    Linux distribution. Between the two of them, use the yum module if you need to
    work with specific yum command features, and use the package module if the highest
    priority is to manage software on different managed distributions.


