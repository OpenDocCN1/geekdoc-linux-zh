    # USING WHEN TO RUN TASKS CONDITIONALLY


    In Ansible, you can use a when statement to run tasks conditionally. Multiple
    tests can be done using when; for instance, you can test whether a variable has
    a specific value, whether a file exists, whether a minimal amount of memory is
    available, and more.


    # Working with when


    Let''s get started with a simple playbook to explore the workings of when. In
    the sample playbook in Listing 7-7, you can see how a when statement is used to
    install the right software package for the Apache web server, based on the Linux
    distribution that was found in the Ansible facts. Notice that when used in when
    statements, the variable that is evaluated is not placed between double curly
    braces.


    Listing 7-7 Using when for Conditional Software Installation


    ![](img/ea4c3f03927a5fe74f47acc2107727ea_271_0.png)'
