    # Managing Host and Group Variables


    In some cases you might want to set variables for specific hosts or specific host
    groups. You can do this by using host_vars and group_vars inclusions. In older
    versions of Ansible, it was common to set host variables and group variables in
    inventory, but this practice is now deprecated.


    If you want to use host variables, you must create a subdirectory with the name
    host_vars within the Ansible project directory. In this directory, create a file
    that matches the inventory name of the host to which the variables should be applied.
    So the variables for host ansible1 are defined in host_vars/ansible1. To use host
    group variables, you use a similar approach. To start, you create a directory
    with the name group_vars. In this directory, a file with the name of the host
    group is created, and in this file all variables are defined. So if you want to
    define variables for the host group web servers, you need to create a file with
    the name group_vars/webservers. In Exercise 6-2 you practice working with host
    and group variables.


    ### Exercise 6-2 Using Host and Group Variables Variables'
