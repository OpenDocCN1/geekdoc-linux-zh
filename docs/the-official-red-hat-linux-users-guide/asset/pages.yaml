    * DontZoom — Permits cycling through configured video resolutions using the Ctrl-Keypad-Plus
    and Ctrl-Alt-Keypad-Minus combinations.


    # ServerLayout


    This section binds together a Screen section with the necessary InputDevice sections
    and various options to create a unified collection of preferences for the XFree86
    server as it starts. If you have more than one ServerLayout section, and the one
    to use is not specified on the command line when bringing up the XFree86 server,
    the first ServerLayout section in the configuration file is used.


    The following options are used in a ServerLayout section:


    +   * Identifier — A unique name to describe this ServerLayout section.

    * InputDevice — The names of any InputDevice sections to be used with the XFree86
    server. Most users will only have two lines, Keyboard and Mouse, the first keyboard
    and mouse configured for the system. The options CoreKeyboard and CorePointer
    refer to the fact that these are the preferred keyboard and mouse, respectively,
    to use with the XFree86 server.


    +   * Screen — The name of the Screen section to use. The number to the left of
    the name refers to the particular screen number to use in a multi-head configuration.
    For standard single-head video cards, this value is 0. The numbers to the right
    give the X and Y absolute coordinates for the upper-left corner of the screen,
    by default 0 0.


    Below is an example of a typical screen entry:


    ```

    Screen 0 "Screen0" 0 0

    ```'
