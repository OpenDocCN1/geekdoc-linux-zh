    **WARNING** Setting permissions to 666 will allow everyone to read and write to
    a file or directory. Setting permissions to 777 allows everyone read, write, execute
    permission. These permissions could allow tampering with sensitive files, so in
    general, it is not a good idea to use these settings.


    Table 8-4 shows a list of some common settings, numerical values, and their meanings.


    # Table 8-4: Example Permission Settings


    | Permissions | What It Means |

    |---|---|

    | -rw------ (600) | Only the owner has read and write permissions. |

    | -rw-r-r- (644) | Only the owner has read and write permissions; the group and
    others have only read-only permissions. |

    | -rwx------ (700) | Only the owner has read, write, and execute permissions.
    |

    | -rwxr-xr-x (755) | The owner has read, write, execute permissions; the group
    and others have only read and execute permissions. |

    | -rwx--x--x (711) | The owner has read, write, and execute permissions; the group
    and others have only execute. |

    | -rw-rw-rw- (666) | Everyone can read and write to the file. (Be careful with
    these permissions.) |

    | -rwxrwxrwxx (777) | Everyone can read, write, and execute. (Again, this permissions
    setting can be hazardous.) |

    | drwx------ (700) | Only the user can read or write in this directory. |

    | drwxr-xr-x (755) | Everyone can read the directory, but its contents can only
