  md: '# Chapter 5: Getting Started


    # Logging In


    The next step to using your Red Hat Linux system is to log in. When you log in,
    you are introducing yourself to the system (also called *authentication*). If
    you type the wrong user name or password, you will not be allowed access to your
    system until you provide the proper user name or password.


    Unlike some operating systems, your Red Hat Linux system uses accounts to manage
    privileges, maintain security, and more. Not all accounts are created equal; some
    accounts have fewer rights to access files or services than others.


    > **NOTE** Like Unix, Linux is case sensitive. This means that *root* refers to
    a different account than if you typed *Root*. By default, *root* refers to the
    root user (also known as the superuser) or system administrator.


    If you did not create a user account during installation, it is highly recommended
    that you log in as root after you create a user account, to prevent accidental
    deletion of files or damage to your Red Hat Linux installation. If you have not
    already created and logged into a user account, see the “Creating a User Account”
    section later in this chapter.


    > **CAUTION** Because your Red Hat Linux system creates the root account during
    installation, some users are tempted to use only this account for all of their
    activities. This is a dangerous idea, because the root account is allowed to do
    anything on the system. You can easily damage your system by accidentally modifying
    sensitive system files.


    # Graphical Login


    During installation, if you select graphical as the login type, you will see a
    graphical login screen. Again, unless you have chosen to give your machine its
    own hostname, which is primarily used in a network setting, your machine will
    probably be called *localhost*.


    ![](img/70f8904e8a1105c5df33b26207132b97_126_0.png)


    Figure 5-3. The Graphical Login Screen'
  merge: -1
