    +   1. From the Nautilus window choose Edit ⇨ Backgrounds and Emblems. The Backgrounds
    and Emblems appears.

    2. Click the Emblems button at the left of the window.

    3. Find the emblem you want and drag it onto the icon.


    > NOTE You can also right-click an icon, choose Properties from the context menu,
    and add or remove icons from the Emblems tab of the icon''s Properties window.'
