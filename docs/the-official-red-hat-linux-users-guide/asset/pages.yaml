    # Can You Install Using the Red Hat Linux CD-ROM?


    Most new computers will allow booting from the CD-ROM. If your system will support
    booting from the CD-ROM, it is an easy way to begin a local CD-ROM installation.


    Your BIOS may need to be changed to allow booting from your CD-ROM drive. For
    more information about editing your BIOS and the installation process in general,
