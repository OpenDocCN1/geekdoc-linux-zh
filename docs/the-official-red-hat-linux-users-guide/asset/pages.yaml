  md: '# Chapter 23: System Directories 309


    Red Hat Linux, the intended use for /usr/local is slightly different from that
    specified by the FHS. The FHS says that /usr/local should be where software that
    is to remain safe from system software upgrades. System upgrades from Red Hat
    are done safely with the rpm command and graphical Package Manager tool, you do
    not need to protect files by putting them in /usr/local. Instead, we recommend
    you use /usr/local for software that is to your machine.


    For instance, as you have noted about /usr via read-only NFS from a host named
    jake. If is a package or program you would like to install, but you are not allowed
    to write to jake, you should install under /usr/local. Later perhaps, if you have
    managed to convince the system administrator of jake to install the program over
    /usr, you can uninstall it from /usr/local.


    # The /var directory


    Because the FHS requires that you be able to mount /usr read-only, any programs
    that write log files or lock directories write them to the /var directory. System
    log files such as messages and last go in /var/log. The /var/lib/rpm directory
    also contains the RPM system databases. Lock files go in /var/lock, usually in
    directories particular for the program using the file. The /var/pool directory
    has subdirectories for various systems that need to store data files.


    # Special File Locations


    Red Hat extends the FHS structure slightly to accommodate special files by Red
    Hat Linux. The following list describes the major file locations in Red Hat Linux:


    +   * /var/lib/rpm/ — Most files pertaining to the Red Hat Package Manager (RPM)
    are kept in the directory. See Part V for more information on RPM.

    * /var/spool/update/ — This directory contains files used by Red Hat Update Agent,
    including RPM header information for the system. This location may also be used
    to temporarily store RPMs downloaded while updating your system. For more information
    on Red Hat Network, see the Red Hat website at https://rhn.redhat.com/.

    * /etc/sysconfig/ — This directory stores a variety of configuration information.
    Many scripts run at boot time use the files in this directory.

    * initrd/ — This directory is empty after the system is booted, but is used as
    a critical point during the boot process.


    > WARNING Do not remove the /initrd/ directory for any reason. Removing this directory
    will cause your system to fail to boot with a kernel panic error message.


    # The /proc File System


    The Linux kernel has two primary functions: to control access to physical devices
    on the computer and schedule when and how processes interact with these devices.
    The /proc/'
