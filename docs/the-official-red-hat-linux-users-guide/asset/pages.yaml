- img_proc: true
  md: 'The following sections show you how to customize your system to suit your needs
    and preferences.


    # Setting your Preferences


    The central location for configuring your system is from the Preferences menu
    of the Main Menu. (You can also access Preferences by double-clicking the Start
    icon on your desktop or double-clicking the Preferences icon.) The Preferences
    menu offers a wide selection of configuration options. The following list discusses
    options briefly.


    +   * About Myself — From here you can change your login session, as well as add
    information about yourself such as your home and office numbers.


    +   * Accessibility — Here you can make changes to the red Hat Linux responses
    to key presses, mouse clicks, and so on.


    +   * Background — You can configure your background with new colors, patterns,
    or a new image.


    +   * CD Properties — From here you can configure whether or not CDs are automatically
    mounted by default, which command is executed when a CD is inserted in the drive,
    and more.


    +   * Extras — A advanced preferences are under Extras, including an HTML viewer
    that launches the preferences for viewing HTML files in graphical applications,
    the Desktop Switching tool, and some Extra Preferences. Also included here is
    the Preferred Applications utility, which allows you to set your default Web browser,
    text editor, and terminal.


    +   * File types and programs — From here you can add new file types and change
    the programs that are associated with file types.


    +   * Font — Here you can configure which fonts are used for various system elements,
    such as title bars, terminal windows, the desktop, and applications.


    +   * Keyboard — Make decisions about your keyboard, such as the keyboard repeat
    rates, cursor blink rate, and whether you want your keyboard to beep at.


    +   * Keyboard Shortcuts — You can configure shortcuts (a combination of keystrokes
    on the keyboard) to perform actions within an application or on your desktop.
    For example, you can configure a shortcut to move from your current Workspace
    to Workspace 2 by pressing Ctrl-F2.


    +   * Menus and Toolbars — Customize your toolbars and menus behave. For example,
    you can choose not to icons displayed in menu.


    +   * Mouse — Here you can configure your mouse, with options such as allowing
    for a left-handed mouse, setting your double-click delay, and changing your cursor
    and the sensitivity of mouse motions.


    +   * Network Proxy — Here you can set your HTTP proxy (if you have one) as well
    as your username and password the proxy might require.


    +   * Password — This tool allows you to change your user password; you have to
    enter your existing password first.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Chapter 6: Using the Graphical Desktop 115


    +   * Pilot/Handspring Tool — If you have a Palm Pilot or Handspring Visor, you
    can configure it to sync with Red Hat Linux using this tool.


    +   * Screensaver — This tool lets you change your default screensaver, configure
    the settings of a given screensaver, and set the number of minutes your system
    will wait to bring the screensaver up.


    +   * Sound — In this section you can configure the system sounds associated with
    various functions. For example, if you would like to have a sound play when you
    log in to your desktop, you can configure that.


    +   * Theme — This utility allows you to change your theme or window border as
    well as install new ones.


    +   * Window Focus — This tool enables you to change the way you give a window
    focus (which means to bring it to front). The default setting is that you have
    to click somewhere on the window to give it, but you can also configure your settings
    so that you can merely point to a window to give it focus and bring it to the
    front.


    # Customizing the Desktop


    The Start Here in Nautilus contains additional configuration tools that help you
    with your new Red Hat Linux system and server applications included. The System
    Settings includes tools that help you set up your system for personal everyday
    use. Below you will find a list of the tools included in System Settings and what
    you can do with them.


    +   * Date & Time — This tool allows you to set the date and time of your machine.
    You will be able to set your time zone information as well. See Chapter 19 for
    more information on time and date configuration.


    +   * Soundcard Detection — The Soundcard Detection tool probes your machine for
    available sound devices. See Chapter 14 for more details on configuring your sound
    hardware.


    +   * Users & Groups — The Users & Groups tool allows you to add and remove users
    from your system. See Chapter 10 for details.


    +   * Printing — The Printer Configuration tool allows you to add a new printer
    to your system. The printer may be connected to your machine or available on a
    network. See Chapter 16 for details.


    As mentioned before, you will also find server configuration tools in the Start
    Here. These tools help you configure services and applications that you are using
    on the local machine to serve other machines. The server configuration tools are
    found by clicking on the Server Settings icon. A couple of the tools found in
    this area are the tools for the Apache Web Server and a DNS/Bind tool. You must
    have those applications installed before these tools appear in this section. Refer
    to the Official Red Hat Linux Administrator’s Guide (Red Hat Press/Wiley, 2003)
    for details.


    # Customizing the Panel


    You can hide the Panel automatically or manually, place it on any edge of your
    desktop, change its size and color, and change the way it behaves. To alter the
    default Panel settings,'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'right-click in an unused area of the panel and select Properties. You can set
    the size of the Panel, its position on the desktop, and whether you want the Panel
    to be automatically hidden (Autide) when not in use. If you choose to Autide the
    Panel, it will not appear on the desktop until you move your mouse pointer towards
    it.


    # Adding Icons and Applets to the Panel


    To make the Panel fit your needs, you may want to add more applets and launcher
    icons. To add an applet to the Panel, right-click in an unused area of the Panel,
    select Add to Panel, and choose from the menu of applets. When you select an applet,
    it will appear on your Panel, as that is the only place it will run.


    To add a launcher icon to the panel, right-click in an unused area of the Panel
    and select Add to Panel ⇨ Launcher. This will launch a dialog box that allows
    you to enter the name of the application, location and name of the command that
    starts the application (such as `/usr/bin/foo/`), and even choose an icon for
    the application. Click OK and the new launcher will appear on the menu.


    > TIP Quick and easy way to add a launcher to the Panel is to right-click on an
    unused area of the Panel and choose Add to Panel ⇨ Launcher from menu. Then select
    an application that appears in the menu. This will automatically add a launcher
    icon based on the properties of the item in the Main Menu.


    # Autohiding the Panel


    Autohiding the Panel makes the Panel disappear altogether until you drag your
    mouse to the bottom of the screen (or whichever edge of the screen your Panel
    is located). To autohide the Panel, right-click an empty spot on the Panel and
    select Properties, check the Autohide checkbox, and click Close. The Panel in
    Figure 6-11 is not visible because we chose to autohide it.


    # Adding Drawers to the Panel


    A drawer is really like a Panel within a Panel. A drawer can be collapsed to just
    an icon (a drawer) or extended to an entirely new Panel. Drawers are quite useful
    for organizing applications on a Panel. For example, you might want to have a
    drawer on your Panel that includes all of your Internet software and another drawer
    that contains all of your Office Productivity software to avoid a cluttered Panel.


    To add a drawer to the Panel, right-click an empty spot on the Panel and choose
    Add to Panel ⇨ Drawer from the menu that appears.'
