    You will probably use the asterisk (*) most frequently when you are searching.
    The asterisk will search out everything that matches the pattern you are looking
    for. So, even by typing:


    ```

    ls *.txt

    ```


    or:


    ```

    ls sn*

    ```


    You would find sneakers.txt and any other files whose names begin with sn or .txt.
    It helps to narrow your search as much as possible.


    One way to narrow a search is to use the question mark symbol (?). Like the asterisk,
    ? can help locate a file matching pattern.


    In this case, though, ? is useful for using a single character, so if you were
    searching sneaker?.txt, you would get sneakers.txt as a result, and/or sneakers.txt,
    if there were a file with that name.


    Regular expressions are more complex than the straightforward asterisk or question
    mark. When an asterisk, for example, just happens to be part of a filename, might
    be the case if the file sneakers.txt was called sneak*.txt, that is when regular
    expressions can be useful.


    Using the backslash (\), you can specify that you do not want to search out everything
    using the asterisk, but you are instead looking for a file with an asterisk in
    the name. This is called escaping the wildcard.


    For example, if the file is called sneak*.txt, type:


    ```

    sneak*.txt

    ```


    Table 8-3 shows a brief list of wildcards and regular expressions.


    # Table 8-3: Wildcards and Regular Expressions


    | Character | What It Matches |

    | --- | --- |

    | * | All characters |

    | ? | One character in a string (such as sneaker?.txt) |

    | \* | The * character |

    | \? | The ? character |

    | \) | The ) character |'
  merge: -1
