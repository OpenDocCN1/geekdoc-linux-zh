    Figure 2-23. Account Creation


    # Setting the Root Password


    Setting up a root account and password is one of the most important steps during
    your installation. The root account (sometimes called the superuser) is similar
    to the administrator account used on Windows NT machines. The root account is
    used to install packages, upgrade RPMs, and perform most system maintenance. Logging
    in root gives you complete control over your system.


    > WARNING Because the root user has complete access to the entire system, logging
    in root is best done only to perform system maintenance or administration. The
    root account does not operate within the restrictions on normal user accounts,
    so changes made can have implications for your entire system. Following this important
    rule will minimize the chances of a typo or an incorrect command damaging your
    system.


    To become root logged into another account, for instance if you need to fix something
    quickly, you type su - the shell prompt in a terminal window and then press Enter,
    enter the root password and press Enter.


    The installation program will prompt you to set a root password for your system.
    A root password is the administrative password for your Red Hat Linux system.
    You must enter a root password; the installation program will not let you proceed
    to the next section without entering a root password.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# 58 Part I: Installing Red Hat Linux


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice; if the two passwords
    do not match, the installation program will ask you to enter them again.


    You should make your password something you can remember, but not something that
    is easy for someone to guess. Your name, your phone number, qwerty, password,
    root, 123456, and anteater are all examples of bad passwords. Good passwords mix
    numerals with upper and lower case letters and do not contain dictionary words:
    Aard387vark or 420BMnt, for example. It is recommended that you do not write down
    this or any password you create; if you write down your password, keep it in a
    secure place.


    > CAUTION Do not use one of the example passwords offered in this book. Using
    one of these passwords could be considered a security risk.


    > TIP To change your root password after you have completed the installation,
