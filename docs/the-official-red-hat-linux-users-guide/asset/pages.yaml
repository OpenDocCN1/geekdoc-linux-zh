    # # Booting Single-User Mode


    You may be able to boot single-user mode directly. If your system boots but does
    not allow you to log in when it has completed booting, try single-user mode.


    # # Booting into Single-User Mode in GRUB


    If you are GRUB, use the following steps to boot into single-user mode:


    +   1. If you have a GRUB partition configured, type **p** and enter the password.

    2. Select Red Hat Linux with the version of the kernel you wish to boot and type
    **e** for edit. You will be presented with a list of items in the configuration
    file for the title just selected.

    3. Select the line that starts with **kernel** and type **e** to edit the line.

    4. Go to the end of the line and type **single** as a separate word (press the
    spacebar and then **type single**) to edit mode.

    5. Back at the GRUB screen, type **b** to boot into single-user mode.


    # # Booting Single-User Mode in LILO


    If you are using LILO, specify one of these options at the LILO boot prompt (if
    you are using the graphical screen and you must press Ctrl-x to exit the graphical
    screen and go to the boot:)


    ```

    boot: linux single

    boot: linux emergency

    ```


    In single-user mode, your computer boots to runlevel 1. Your local file systems
    will be mounted, but your network will not be activated. You will have a usable
    system maintenance shell.


    In emergency mode, you are booted into the most minimal environment possible.
    The root file system will be read-only, and almost nothing will be set up. The
    main advantage of'
  merge: -1
