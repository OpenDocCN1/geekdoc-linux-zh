  md: '# Appendix E: The X Window System


    # Module


    This section tells the XFree86 server which modules from the /usr/X11R6/lib/modules/
    directory to load. Modules provide the XFree86 server with additional functionality.


    > CAUTION You should not edit these values.


    # Monitor


    This section refers to the type of monitor used by the system. While one Monitor
    section is the minimum, there may be one Monitor section for each monitor in use
    with the machine.


    > WARNING Be careful when manually editing values in the options of the Monitor
    section. Inappropriate values in this section could damage or destroy your monitor.
    Consult the documentation that came with your monitor for available operating
    parameters.


    The following options are usually configured during installation or when using
    the X Configuration tool:


    +   * HorizSync — Tells XFree86 the range of horizontal sync frequencies compatible
    with the monitor in kHz. These values are used as a guide by the XFree86 server
    so that it will know whether to use a particular Modeline entry''s values with
    this monitor.

    * Identifier — Provides a unique name for the monitor, usually numbering each
    monitor starting at 0. The first monitor would be named Monitor0, and so on.

    * Modeline — Used to specify the video modes that are used by your monitor at
    particular resolutions, with horizontal sync and vertical resolutions. Modeline
    entries are usually preceded by a comment that explains what the mode line specifies.
    If your configuration file does not include comments for the various mode lines,
    you can scan over the values (also called mode descriptions) to uncover what the
    mode line is attempting to do. See the XFree8Config man page for detailed explanations

    * ModelName — An optional parameter that displays the model name of the monitor.

    * VendorName — An optional parameter that displays the vendor that manufactured
    the monitor.

    * VertRefresh — Lists the vertical refresh frequencies supported by the monitor
    in kHz. These values are used as a guide by the XFree86 server so that it will
    know whether to use a particular Modeline entry''s values with this monitor.


    # Screen


    This section binds together particular Device and Monitor that can be utilized
    with at least one Screen section in your configuration file. The following options
    are common:


    +   * DefaultDepth — Tells the Screen section the default color depth to try in
    bits. 8 is the default, 16 provides thousands of colors, and 32 displays millions
    of colors.'
