  md: '# Preface


    Welcome to the Official Red Hat Linux User''s Guide! From installation to navigation
    and instructions on performing common tasks, this book is designed to help new
    and intermediate Linux users get up and running with Red Hat Linux.


    * If you need more advanced coverage of Red Hat Linux, see the companion book
    to this one: the Red Hat Linux Administrator''s Guide (Red Hat Press/Wiley, 2003).


    As you read this book, keep in mind that Linux looks, feels, and performs differently
    from other operating systems you may have used, such as Windows or Mac OS. Our
    advice is to forget about the conventions of those other operating systems, and
    with an open mind, approach Red Hat Linux as a new, interesting, and versatile
    alternative.


    # Conventions Used in this Book


    As you read this book you will see that certain words are represented in different
    fonts and styles. These conventions are designed to help you easily navigate the
    book so that you can find wherever you need fast. The following sections discuss
    the major typographical conventions used in this book.


    # Commands and File Names


    Linux commands (and other operating system commands, when used) are represented
    in a monospace font; for example: `boot linux console-device`. This style indicates
    to you that you can type the word or phrase on the command line and press Enter
    to invoke a command.


    File names, directory names, and paths are also represented in monospont to set
    them visually apart from normal text; for example: `/test/new/RedHat`.


    # Computer Output


    Computer output is displayed by the computer as the command line. You will see
    this output, which includes responses to commands you typed in, error messages,
    and interactive prompts for your input during scripts or programs, displayed in
    monospont against a gray background, as follows:


    ```

    $ ls

    Desktop axhome logs paulvesterberg.png

    Mail backupfiles mail reports

    ```


    # User Input


    Text the user has to type, either on the command line or into a text box on a
    GUI screen, displayed in bold font; for example: To boot your system into the
    text based installation program, type text at the boot: prompt.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Navigational Callouts


    Throughout this book, we use several methods of calling out important or otherwise
    noteworthy information. In order of how critical the information is to your system,
    these items will be marked as Note, Tip, Important, Caution, or Warning. Following
    are examples of each of these items:


    > NOTE Remember that Linux is case sensitive. In other words, a rose is not a
    ROSE is not a rOSE.


    > TIP The directory /usr/share/doc contains additional documentation for packages
    installed on your system.


    > IMPORTANT If you modify the DHCP configuration file, the changes will not take
    effect until you restart the DHCP daemon.


    > CAUTION Do not perform runtime tasks as root. Use a regular user account unless
    you need to use the root account for system administration tasks.


    > WARNING If you choose not to partition manually, a server installation will
    remove all existing partitions on all installed hard drives. Do not choose this
    installation class unless you are sure you have no data to save.


    # How This Book Is Organized


    The chapters in this book are grouped by topic into seven parts. The following
    sections give you a brief description of each of the book''s parts.


    # Part I: Installing Red Linux


    This part is ideal for users (both new and experienced) who want a quick and simple
    installation solution. From fundamental concepts such as installation preparation
    to the step-by-step installation procedure, this part will be a valuable resource
    as you install Red Hat Linux. Once you have completed the installation as outlined
    in this manual, you will have a fully functioning system. This part also contains
    useful information to assist you before and after installing Red Hat Linux.


    # Part II: The Basics


    This part is task-oriented, showing you useful tips, hints, warnings, and screenshots.
    These chapters help users learn the basics of using Red Hat Linux, including the
    graphical user interface, working from the shell prompt, dealing with removable
    media, working with files and directories, and managing users and groups.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Part III: Getting the Most from Your Red Hat Linux System


    This part shows you how to use your Red Hat Linux system for the most common user
    tasks, such as using office-productivity software, listening to music, getting
    online, and working with graphics.


    # Part IV: Configuring Your Red Hat Linux System


    This part shows you how to configure Red Hat Linux to recognize (and be to print
    from) your printer, as well as how to set up a firewall to protect your private
    information from hackers, and setting your system''s time and date.


    # Part V: Updating and Adding Packages to Red Hat Linux


    There are two methods to installing new packages (the Linux term for applications)
    and updating old ones: using RPM files or using the rpm command. This part shows
    you how to perform both of these methods.


    # Part VI: Additional References


    This part includes a lot of really handy information, such as keyboard shortcuts,
    a comparison of similar MS-DOS and Linux commands, a chapter including the most
    frequently asked about Red Hat Linux, and a breakdown of the system directories
    used by your Red Linux system. Also included is a chapter showing how you can
    monitor your system''s performance and status.


    # Part VII: Appendices


    This final part contains some of the less commonly needed information about Red
    Hat Linux, for example: rescue mode, KDE, how to configure a dual-boot system,
    the logistics of disk partitioning, the basics of the X Window System, and information
    about the CD-ROMs that accompany this book.


    # Where to Go from Here


    After you feel comfortable using and navigating your Red Hat Linux system, you
    may find needing more information. The Official Red Hat Linux Administrator''s
    Guide, is the companion to this book, covers more technical aspects and opinions
    of your Red Linux system than this book does.


    There are also many resources available on the Internet. The following sections
    provide you with good online resources for Linux-related information.


    # Linux Websites


    Following are a few websites about Red Hat Linux. (Note that some sites discuss
    other Linux distributions as well.)'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'http://www.redhat.com — On the Red Hat website you can find links to the Linux
    Documentation Project (LDP), online versions of the Red Hat Linux manuals, FAQs
    (Frequently Asked Questions), a database which can help you find a Linux Group
    near you, technical information in the Red Hat Support Knowledge Base, and more.


    http://www.linuxheadquarters.com — The Linux Headquarters website features easy
    to follow, step-by-step guides for a variety of Linux tasks.


    http://www.slashdot.org — Slashdot is a site that is run by many people, good
    number of which are Linux users and administrators, on topics such as open-source
    development, Linux, and new technology.


    # Linux Newsgroups


    You can participate in newsgroups by watching the discussions of others attempting
    to solve problems, or by actively asking or answering questions. Experienced Linux
    users are known to be extremely helpful when trying to assist new users with various
    Linux issues — especially if you are posing your questions in the right venue.
    If you do not have access to a news reader information via the Web at Mozilla
    Mail for newsgroups), you can access this at http://www.deja.com. Dozens of Linux-related
    newsgroups exist, including the following:


    +   * linux.help — A great place to get help from fellow Linux users.


    +   * linux.redhat — This newsgroup primarily covers Red Hat Linux-specific issues.


    +   * linux.redhat.install — Pose installation questions to this newsgroup or
    search it to see how others solved similar problems.


    +   * linux.redhat.misc — Questions or requests for help that do not really fit
    into traditional categories go here.


    +   * linux.redhat.rpm — A good place to go if you are having trouble using RPM
    to accomplish particular objectives.'
  merge: -1
