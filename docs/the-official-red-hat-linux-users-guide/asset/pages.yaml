    | test3 | | SMB | queue@servername.example.com |

    | test4 | | NCP | |

    | test5 | | JETDIRECT | printer.example.com:9100 |


    Figure 16-1. Printer Configuration Tool


    > NOTE Starting with version 6.0, Red Hat Linux ships with two systems: Printer
    Configuration Tool configures the printing system LPRNG. LPRNG is also the default
    printing system. This chapter focuses on using Printer Configuration Tool to configure
    LPRNG. It is recommended that new users use the default printing system as described
    in this chapter. For information on the CUPS printing system, refer to the Official
    Red Hat Linux Administrator''s Guide.


    # Print Queue Types


    This chapter explains local printer configuration only but a total of five types
    of print queues can be configured with the Printer Configuration tool:


    +   * Local Printer — A printer attached directly to your computer through a parallel
    or USB port. In the main printer list (shown in Figure 16-1), the Queue Type for
    a local printer is set to LOCAL.

    * Unix Printer (lpd Spool) — A printer attached to a different Unix system that
    can be accessed over a TCP/IP network (for example, a printer attached to another
    Red Hat Linux system on your network). In the main printer list the Queue Type
    for a remote Unix printer is set to LPD.

    * Windows Printer (SMB) — A printer attached to a different system that is sharing
    a printer over an SMB network (for example, a printer attached to a Microsoft
    Windows machine). In the main printer list the Queue Type for a remote Windows
    printer is set to SMB.

    * Novel Printer (NCP Queue) — A printer attached to a different system that uses
    Novell''s NetWare network technology. In the main printer list the Queue Type
    for a remote Novell printer is set to NCP.

    * JetDirect Printer — A printer connected directly to the network instead of a
    computer. In the main printer list the Queue Type for a JetDirect printer is set
    to JETDIRECT.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Chapter 16: Printer Configuration 249


    See the Official Red Linux Administrator''s Guide or click on the Printer Configuration
    Tool Help for information on configuring printers other than local printers.


    > IMPORTANT If you add a new printer queue or modify an one, you need to restart
    the printer daemon (lpd) for the changes to take effect.


    Clicking the Apply button saves any changes that you have made and restarts the
    printer daemon. The changes are not written to the /etc/printcap configuration
    file until the printer daemon (lpd) is restarted. Alternatively, you can choose
    File -> Save Changes and then choose File -> Restart lpd to save your changes
    and restart the printer daemon.


    If a printer appears in the main printer list with the queue type set to INVALID,
    the printer configuration is missing options that are required for the printer
    to function properly. To remove this printer from the list, select it from the
    list and click the Delete button.


    # Adding a Local Printer


    To add a local printer as one attached to the parallel port or USB port of your
    computer, click the New button in the main Printer Configuration Tool window.
    The window shown in Figure 16-2 will appear. Click Forward to proceed.


    ![](img/70f8904e8a1105c5df33b26207132b97_276_0.png)


    Figure 16-2. Adding a Printer


    You will then see the screen shown in Figure 16-3. Enter a unique name for the
    printer in the Queue Name text field. This can be any descriptive name for your
    printer. The printer name cannot contain spaces and must begin with a letter a
    z (or A through Z). The valid characters are a through z, A through Z, 0 through
    9, -, and _. Select Local Printer from the Queue Type menu and click Forward.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 250 Part IV: Configuring Your Red Hat Linux System


    ![](img/70f8904e8a1105c5df33b26207132b97_277_0.png)


    Figure 16-3. Adding a Local Printer


    The Printer Configuration Tool attempts to detect your printer device and display
    it, as shown in Figure 16-4. If the Printer Configuration Tool detected your printer
    model, it will display the recommended printer driver.


    If your printer device is not shown, click Custom Device. Type the name of your
    printer device and click OK to add it to the printer device list. A printer device
    attached to the parallel USB port is usually referred to as /dev/usb10. If your
    printer model does not appear, you will be given the opportunity to select it
    in the next step. Click Next to continue. After selecting your printer device,
    click Forward.


    ![](img/70f8904e8a1105c5df33b26207132b97_277_1.png)


    Figure 16-4. Choosing a Printer Device'
  merge: -1
