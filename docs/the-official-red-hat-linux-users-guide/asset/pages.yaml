  md: '# # Chapter 18


    # # Time and Date Configuration


    The Time and Date Properties tool allows you to change the system date and time,
    to configure the time zone used by the system, and set up the Network Time Protocol
    (NTP) daemon to synchronize the system clock with a time server.


    You must be running the X Window System and have root privileges. To start the
    application from the desktop, click the Main Menu Button and choose $\Rightarrow$
    System Settings $\Rightarrow$ Date & Time, or type the command `redhat-config-date`
    at a shell prompt.


    # # Time and Date Properties


    The first tabbed window that appears after starting the Time and Date Properties
    tool is for configuring the system date and time and the NTP daemon (ntpd).


    ![](img/70f8904e8a1105c5df33b26207132b97_292_0.png)


