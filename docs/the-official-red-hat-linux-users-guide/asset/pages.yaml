  md: '# Chapter 11: Working with Documents 191


    ![](img/70f8904e8a1105c5df33b26207132b97_218_0.png)


    # OpenOffice.org Writer


    Red Hat Linux includes a powerful suite called OpenOffice 1.0, which includes
    the following applications:


    +   * Word Processing (OpenOffice.org)

    * Spreadsheets (OpenOffice.org Calc)

    * Presentations (OpenOffice.org Impress)


    Figure 11-1. OpenOffice.org Writer


    The main interface is the document editing area (the white space in the middle
    of the window where you can type your text). At the top of the window are various
    functions collected into toolbars that control fonts, letter sizes, justification
    (to align the text of your document to the left, center, or right margins), and
    other text formatting buttons. There is also a text box that enables you to type
    into the exact location of a document on your machine and load the document into
    the editing area. There are buttons for opening, saving, and printing documents,
    as well as buttons for creating new documents (which will open up a new window
    with a blank document for you to add content).


    Along the left side of the window there is a toolbar with buttons for checking
    your spelling, automatic highlighting of misspelled words, word and phrase searching,
    and other convenient editing functions.


    If you hover over a toolbar, a pop-up (often called a tooltip) will display a
    brief explanation of the button''s functionality. You can display more detailed
    tips by clicking the Help menu and checking Extended Tips.


    You can immediately begin typing text into the document editing area at any time
    with the default settings.


    OpenOffice.org Writer is useful for general document editing, you can also add
    objects as images, illustrations, charts, and tables to complement your text or
    give impact to your documents. To add an image, click Insert ➡ Graphics ➡ From
    File, and choose the image from the pop-up file browser. The image will appear
    where you placed your'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 192 Part iii: Getting the Most from Your Red Hat Linux System


    cursor and can be sized larger or smaller to fit your needs. Figure 11-2 shows
    an image added to a document.


    ![](img/70f8904e8a1105c5df33b26207132b97_219_0.png)


    Figure 11-2. Adding an Image to Your Document


    After you have created your document, you can save it in any format that you wish.
    To save your text, click the Save button (it looks like a little floppy disk).
    You can choose the file format from the File type drop-down menu. The default
    file type is appropriate for files that you are working on with OpenOffice applications.
    However, for files that you need to distribute to Microsoft offices, or if you
    are editing a file that was sent as an email attachment with the .doc extension,
    you can save the file as a Microsoft Word file type that others will be able to
    open in Microsoft Word. Please consult Table 11-1 for available formats.


    # OpenOffice.org Calc


    Large enterprises to home offices, professionals in every industry use spreadsheets
    for keeping records, creating business charts, and manipulating data. OpenOffice.org
    Calc is a powerful spreadsheet application that allows you to enter and manipulate
    data in cells organized into columns and rows.


    You can perform calculations on groups of cells (such as adding or subtracting
    a column of cells) or create charts based on cell groupings. You can even incorporate
    spreadsheet data into your documents for a professional touch.


    To start OpenOffice.org Calc from the desktop panel, select Main Menu -> Office
    -> OpenOffice.org Calc (to start OpenOffice.org Calc from a shell prompt, type
    oocalc).'
  merge: -1
  pgno: 219
