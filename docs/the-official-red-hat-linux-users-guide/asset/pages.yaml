  md: '# Locating Files and Directories


    There will be times when you know a file or directory exists but you will not
    know where to find it. Searching for a file or directory can be easier with the
    locate command.


    With locate, you will see every file or directory whose name contains the search
    criterion. For example, if you want to search for all files with the word finger
    in the name, type:


    ```

    locate finger

    ```


    The locate command uses a database to locate files and directories that have the
    word finger in the file or directory name. The search results could include a
    file finger.txt, a file called pointerfinger.txt, a directory named fingerprints,
    and so on. To learn more about locate, read the locate page (type man locate at
    a shell prompt).


    The locate command works very quickly, as long as the database is up to date.
    Database is automatically updated on a nightly basis through a cron job cron runs
    in the background, performing various tasks (such as updating the locate database)
    by regularly scheduled intervals.


    > TIP cron is a daemon that executes tasks at regularly scheduled intervals. To
    read the cron man page type man cron at the shell prompt.


    cron periodically updates the locate database, which is used to catalog file locations
    by the locate command. Switching between operating systems and shutting down your
    machine at the end of the day can interfere with the automatic database update
    run by cron.


    To update the database manually, log in as root (type su at a shell prompt and
    enter your root password) and use the command updated.


    After a few minutes, the locate database that is used by the locate command will
    be current.


    Refer to the man page on anacron (type man anacron at the command line) for more
    information.


    # Printing from the Command Line


    Printing is not an involved process, whether you click on a button in a GUI or
    type commands from the command line. This section explains how to print, cancel,
    and view jobs from the command line, assuming you have a properly configured printer
    connected to your system. Refer to Chapter 16 for more information about setting
    up your printer.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Chapter 8: Shell Prompt Basics 151


    The lpr command, followed by a filename, sends specified file to the print queue.
    For example, lpr foo.txt prints the foo.txt file.


    To view the jobs waiting in the print queue, lpq at the command line and you will
    see information similar to the following:


    ```

    active root 389 foo.txt

    ```


    In this example, 389 is the job number.


    You can cancel jobs in the queue by typing lprm followed by the print job number
    displayed when you use the lpq command. To cancel the foo.txt print job, for example,
    you would use lprm 389 and press Enter.


    # Clearing and Resetting the Terminal


    After every ls command in a shell prompt, the terminal window you are working
    in can begin to look crowded. You can always exit from the terminal window and
    open a new one, but there is a quicker and easier way to clear the contents displayed
    in the terminal: clearing the terminal.


    To clear the terminal, type the command clear at the shell prompt. The command
    then clears the terminal window.


    Sometimes, you may accidentally open a program file or some other non-text file
    in a terminal window. After closing the file, you could find that the text you
    are typing does not match the output on the monitor.


    In such cases, type reset to return the terminal window to its default values.


    # Manipulating Files with cat


    Red Hat Linux has a utility that can help keep short lists, gather lists together,
    and even show you information about your system. The utility is called cat, for
    concatenate, which means to combine files.


    The cat command will also display the contents of an entire file on the screen
    (for example, type cat filename.txt). If the file is fairly long, it will quickly
    scroll past on the screen. To prevent this, use the cat filename.txt | less command.


    Using the pipe (|) and less command displays the file one page at a time. You
    can then use the up and down arrows to move backward and forward through the pages.
    For more on pipes to combine two separate functions, the “Pipes and Pagers” section
    later in this chapter.


    # Using Redirection


    Redirection means causing the shell to change what it considers to be standard
    input where the standard output should be going.'
