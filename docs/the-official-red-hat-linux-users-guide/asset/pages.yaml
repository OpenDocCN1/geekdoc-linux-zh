  md: '# 86 Part I: Installing Red Hat Linux


    > NOTE There are a few cases where the system BIOS will not allow the Red Hat
    CD-ROM to boot because of the size of the boot image on the CD-ROM itself. In
    such cases as these, a boot disk should be made to boot Red Hat Linux. Once booted,
    the CD-ROMs will work properly for the installation.


    To change your BIOS, refer to your system manual for the correct keyboard combination
    that allows you to use your BIOS, or you can read the key sequence needed while
    the system begins to boot.


    To create a boot disk, follow the instructions in Chapter 2.


    To boot Red Hat Linux using a boot disk, insert the diskette into your floppy
    drive and then reboot/restart your computer. Make sure that your BIOS is set to
    use the floppy or removable disk (A:;) to boot.


    # Are You Unable to Boot from the Local Boot Disk?


    If you are experiencing difficulties in getting a local boot disk to boot your
    system correctly, you may need an updated boot disk.


    Check the online errata at


    ```

    http://www.redhat.com/support/errata

    ```


    for updated disk images (if available) and follow the instructions in Chapter
    2 to create an updated boot disk for your system.


    # Are You Unable to Boot from PCMCIA Boot Disks?


    If you are experiencing difficulties in getting the PCMCIA boot disks you made
    to boot your system correctly, you may need an updated boot disk.


    Check the online errata at


    ```

    http://www.redhat.com/support/errata

    ```


    for updated disk images (if available) and follow the instructions provided to
    make an updated boot disk for your system.


    # Is Your System Displaying Signal 11 Errors?


    If you receive a fatal signal 11 error during your installation, it is probably
    due to a hardware error in memory on your system''s bus. A hardware error in memory
    can be caused by problems out or with your system''s hardware. Like other operating
    systems, Red Hat Linux has its demands on your system''s hardware. Some of this
    hardware may not be able to meet those demands, even if they work properly under
    another OS.


    Check to see if you have the latest installation and supplemental boot diskettes
    from Red Hat. Review the online errata at


    ```

    http://www.redhat.com/support/errata

    ```'
