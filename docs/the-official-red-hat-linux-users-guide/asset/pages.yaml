  md: 'By this point, you might be wondering how all this additional complexity is
    normally used. See Figure D-6 for an example.


    ![](img/70f8904e8a1105c5df33b26207132b97_391_0.png)


    Figure D-6. Disk Drive with a Single Partition


    In many cases, there is only a single partition spanning the entire disk, essentially
    duplicating the method used before partitions. The partition table has only one
    entry used, and it points to the start of the partition.


    In the figure, this partition is labeled as being of the "DOS" type. Although
    it is only one of several possible partition types listed in Table D-1, it is
    adequate for the purposes of this discussion. This is a typical partition layout
    for most newly purchased computers that have a consumer version of Microsoft Windows
    preinstalled.


    #  Partitions within Partitions — An Overview of Extended Partitions


    Of course, over time it became obvious that four partitions would not be enough.
    As disk drives continued to grow, it became more and likely that a person could
    configure reasonably sized partitions and still have disk space left over. There
    needed to be some way of creating partitions.


    Enter the extended partition. As you can see in Table D-1, there is an "Extended"
    partition type. When a partition is created and its type is set to "Extended,"
    an extended partition table is created. In essence, the extended partition is
    like a disk drive in its own right — it has a partition table that points to one
    or more partitions (now called logical partitions, as opposed to the four primary
    partitions) contained entirely within the extended partition itself. Figure D-7
    shows a disk drive with one primary partition and one extended partition containing
    two logical partitions (along with some unpartitioned free space).'
