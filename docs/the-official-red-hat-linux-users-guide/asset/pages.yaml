  md: '# Part IV: Configuring Your Red Hat Linux System


    To change the date, use the arrows to the left and right of the month. Use the
    arrows to the left and right of the year to change the year, and click on the
    day of the week to change the day of the week. Changes will not take place until
    you click the OK button.


    To change the time, use the up and down arrow buttons beside the Hour, Minute,
    and Second in the Time section. Changes will not take place until you click the
    OK button.


    > NOTE Changing the date and time will change the system clock as well as the
    hardware clock. Clicking Apply or OK is equivalent to executing the hwclock command
    with the selected date and time.


    The Network Time Protocol (ntpd) daemon synchronizes the system clock with a remote
    server or time source (as a satellite). The application allows you to configure
    a NTP daemon to synchronize your system clock with a remote server. To enable
    this feature, click the Enable Network Time Protocol button. This will enable
    the Server pull-down menu. You can then choose one of predefined servers or type
    a server name in the pull-down menu. Your system will not start synchronizing
    with the NTP server until you click Apply. After you click, the configuration
    will be saved and the NTP daemon will be started (restarted if it is already running).
    If you want this daemon to start automatically at boot time, you need to execute
    the command /sbin/chkconfig --level 34 ntpd to enable ntpd runlevels 3, 4, and
    5.


    For more information on NTP, read the NTP documentation available in the /usr/share/doc/ntp-version-directory.


    The NTP server is written to the /etc/ntp.conf and /etc/ntp/step-tickers files.


    Clicking the OK button will apply any changes that you have made to the date and
    time, the NTP daemon settings, and the time zone settings and exit the program.


    > WARNING If you configured a medium or high security level during installation
    or with the Security Level Configuration Tool, the firewall rules will block the
    connection to the NTP port. To allow NTP to work, run the Security Level Configuration
    Tool, select Custom, and add udp:ntp to the other ports.


    # Time Zone Configuration


    To configure the system time zone, click the Time Zone tab. The time zone can
    be changed by either the interactive map or by choosing the desired time zone
    from the list below the map. To use the map, click on the city that represents
    the desired time zone. A red X will appear, and the time zone selection will change
    in the list below the map. Click Apply to save the changes.'
