  md: '# Mounting a Windows Partition Automatically


    To mount a Windows partition upon system boot (for instance, if you want to have
    access to

    Windows as though it were another hard drive), follow these steps to modify the
    /etc/fstab

    file.


    +   1. At a shell prompt, log in as root (type su and then enter the root password).


    +   2. Open the /etc/fstab in a text editor by typing (example):


    ```

    pico /etc/fstab

    ```


    +   3. Add the following on a new line (/dev/hda1 may vary, but for most users
    this is

    correct):


    /dev/hda1 /mnt/windows vfat auto,owner,users 0 0


    ```

    /dev/hda1 /mnt/windows vfat auto,owner,users 0 0

    ```


    +   4. Press Ctrl-x and type y when prompted to save the changes. The next time

    the system is rebooted, the /etc/fstab file will be read and the Windows partition
    will

    automatically mounted in the /mnt/windows directory.


    > NOTE You do not have to reboot your computer to mount the Windows partition.
    This line is in

    /etc/fstab file, use the mount command /mnt/windows to mount it without rebooting.


    To access the partition, type cd /mnt/windows. To navigate through Windows'' embedded

    spaces in their directories, surround the directory in quotation marks, as in
    "Program

    Files".


    # Finding Commands Quickly


    Question: I was looking at a man page yesterday, but I can''t recall the name
    of the

    command I was reading about and I didn''t write it down. How do I get the man
    page back?


    The command you used will likely be stored in a file called .bash_history. By

    default, this file records the last 500 commands you typed at the shell prompt.


    You can glimpse the history of your commands by typing history at the shell prompt,
    but

    the results will scroll too quickly for you to be able to read every line.


    Another way to view .bash_history is with a utility as less. Type .bash_history

    at the shell prompt, and less will display one page at a time. To move forward
    a screen,

    press the space; move back a screen, press the b key; and to quit, press q.


    Paging through .bash_history to find a command can be tedious. To save time, you
    can

    search through the file for keywords using grep, a powerful search utility.


    Say you were reading a man page the day before, but cannot recall its name. To
    search for the

    command, type:


    ```

    history | grep man

    ```


    You will see a list of all the commands you typed that have the word man in them.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Chapter 21: Frequently Asked Questions 297


    There are plenty of ways to use your command history. For other tips and tricks,
    see the next section.


    # Tips on Using Command History


    Question: What are some other ways I can use command history?


    If you type history, you will see a numbered list scroll very quickly, showing
    you the previous 500 commands you have used.


    You do not need to see all of the last 500 commands, the command history number
    might be useful. For example, using the command history 20 displays only the previous
    20 commands you typed (you can use any quantity as an argument of the history
    command).


    Here are other command history shortcuts that may be useful to you:


    +   - !! (called "bang bang") — Executes the command in the history.

    - !number(as in 1302) — Executes the command that is numbered 302 in the history
    file.

    - !string (as in !rpm) — Executes a command with the most recent matching string
    from the history file.

    - Up and down arrow — At the shell or GUI terminal, you can simply press the up
    arrow to move back through previous commands in your history list (the down arrow
    will move you forward through the commands) until you find the command you want.
    Press Enter to execute the command, just as if you had typed it on the command
    line.


    # Keep Is Output from Scrolling


    Question: Whenever I ls I can barely see the output of the directory because it
    scrolls too quickly. How can I actually read the output?


    To prevent output of ls from scrolling too quickly, pipe the output to a utility
    such as less or more. Use to page, at a time.


    To read the contents of /etc with less, type the following command at the shell
    prompt:


    ```

    ls -al /etc | less

    ```


    To move forward a screen, press the spacebar; to move back a screen, press the
    b key; to quit, q.


    > TIP You can achieve the same results with more, another paging utility.


    You can also print directory listings by piping the output to a printer in the
    way that you piped the output to your screen. If you have configured a printer,
    type the following to pipe the output of a command to the printer.'
  merge: -1
  pgno: 324
