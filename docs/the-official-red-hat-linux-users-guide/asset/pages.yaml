  md: '# Part I: Installing Red Hat Linux


    +   * Network adapters — Information on your computer''s network card (if you
    have one).

    * SCSI controllers — If your computer uses SCSI peripherals, you will find additional
    information on the SCSI controller here.


    This method is not a complete subset for opening your computer''s case and physically
    examining each component. However, in many cases it can provide sufficient information
