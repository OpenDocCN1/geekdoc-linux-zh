- img_proc: true
  md: '# Part III: Getting the Most from Your Red Hat System


    +   * Mozilla Mail

    * Text-based email clients (Pine and Mutt)


    Before you launch an email client, you should have some information from your
    Internet Service Provider (ISP) handy so that you can configure the client properly.
    The following lists a few important things you may need to know:


    +   * Your email address — The email you use to send and receive mail. This is
    usually in the form of username@yourisp.net


    +   * Server type for receiving email (POP or IMAP) — In order to receive mail,
    you must know what type of server network administrator or ISP is. This POP or
    IMAP address is usually in the form of mail.someisp.net


    +   * POP, for Post Office Protocol, is used to send mail from a mail server to
    your client''s inbox, where the incoming email is stored. Most email servers use
    the POP protocol, although some can use the newer IMAP


    +   * IMAP, for Internet Message Access Protocol, is a protocol for retrieving
    messages from your ISP''s email server. IMAP differs from POP in that mailAP servers
    are stored on the server and stays there as you download and read your mail, whereas
    POP mail is downloaded to your computer and does not stay on the server.


    +   * Server type for sending email (SMTP) — The Simple Mail Transfer Protocol
    (SMTP) is a protocol for sending email messages to servers. Most email systems
    that send mail over the Internet use SMTP to send messages from one server to
    another; the messages can be retrieved with an email client using POP or IMAP.
    SMTP is also used to send messages from a mail client to a mail server. This is
    why you need to specify both the POP or IMAP server when you configure your email
    application.


    If you have any questions regarding what information you need, contact your ISP
    or network administrator.


    > NOTE Unless properly configured, you will not be able to make full use of the
    email clients discussed in this chapter.


