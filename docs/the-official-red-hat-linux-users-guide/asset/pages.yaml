  md: '# Chapter 10


    # Managing Users and Groups


    Users can be either people, meaning accounts tied to physical users, or logical
    users, meaning accounts that exist for specific applications to use. Groups are
    logical expressions of organization. Groups tie users together, giving them permissions
    to read, write, or execute files.


    When a file is created, it is assigned a user and group. It is also assigned separate
    read, write, and execute permissions for the file''s owner, group, and everyone.
    The user and group of a particular file, as well as the access permissions on
    the file, can be changed by root, or in most cases, by the creator of the file.
    (See Chapter 8 for more information on permissions.)


    This chapter shows you how to manage users and groups with the User Manager tool
    in Red Hat Linux and describes the importance of shadow passwords.


    # Managing Users


    Managing users and groups can be a tedious task, but Red Hat Linux provides a
    few tools and conventions to make management easier.


    You can use tools like useradd or groupadd to create new users and groups from
    the shell prompt. But an easier way to manage users and groups is through the
    graphical application, User Manager. For more information on useradd and groupadd,
    refer to the Official Red Hat Linux Administrator''s Guide (Red Hat Press/Wiley,
    2003).


    # User and Group Configuration


    User Manager allows you to view, modify, add, and delete local users and groups.
    To use User Manager, you must be running the X Window System, have root privileges,
    and have the redhat-config-users RPM package installed. To start User Manager
    from the desktop, click the Main Menu Button and choose System Settings -> Users
    & Groups (or type the command redhat-config-users at a shell prompt.'
  merge: -1
  pgno: 208
