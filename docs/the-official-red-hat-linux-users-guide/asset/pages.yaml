- img_proc: true
  md: '![](img/70f8904e8a1105c5df33b26207132b97_129_0.png)


    Figure 5-5. The Red Hat User Manager


    +   5. Click OK. The new user will appear in the user list.


    To create a user account from a shell prompt, follow these steps:


    +   1. Open a shell prompt.


    +   2. If you are not logged in as root, type the command su - and enter the root
    password.


    +   3. Type useradd followed by a space and the username for the new account you
    are creating at the command line (for example, useradd jsmith) and press Enter.
    Often, usernames are variations on the user''s name, such as jsmith for John Smith.
    User account names can be anything from the user''s name, initials, or birthplace
    to something more creative.


    +   4. Type passwd followed by a space and the username again (for example, passwd
    jsmith).


    +   5. At the new password: prompt, enter a password for the new user and press
    Enter.


    +   6. At the Retype new password: prompt, enter the same password to confirm
    your selection.'
