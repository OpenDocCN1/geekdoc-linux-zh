    \ of what the shorthand represents:\n\n+   - Identities:\n  - u The user who owns\
    \ the file (that is, the owner)\n  - g The group to which the user belongs\n \
    \ - o Others (not the owner or the owner's)\n  - a Everyone or all (u, g, and\
    \ o)\n\n+   - Permissions:\n  - r Read access\n  - w Write access\n  - x -- Execute\
    \ access\n\n+   - Actions:\n  - + Adds the permission\n  - - Removes the permission\n\
