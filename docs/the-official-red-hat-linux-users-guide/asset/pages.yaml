    # ServerFlags


    This section contains miscellaneous XFree86 server settings. These settings may
    be overridden by options placed in the ServerLayout section. Among the most useful
    settings are these two:


    +   * DontZap — Prevents the use of the Ctrl-Alt-Backspace key combination to
