    # Adding Emblems to Icons


    This feature allows you to add little emblems to icons to help you better distinguish
    similar icons from one another. For example, one of the emblems says “Draft”;
    if you have several documents in a folder and want to be able to visually tell
    the drafts from the final versions, you can add the “Draft” emblem to all the
