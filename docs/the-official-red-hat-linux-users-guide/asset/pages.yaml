  md: '# Appendix D: An Introduction to Disk Partitions 365


    ![](img/70f8904e8a1105c5df33b26207132b97_392_0.png)


    Figure D-7. Disk Drive with Extended Partition


    As the figure implies, there is a difference between primary and logical partitions
    — there can only be four primary partitions, but there is no fixed limit to the
    number of logical partitions that can exist.


    However, due to the way in which partitions are accessed in Linux, you should
    avoid defining more than 12 logical partitions on a single disk drive.


    Now that we have discussed partitions in general, the next section shows you how
    to use this knowledge to install Red Hat Linux.


    # Making Room for Red Hat Linux


    There are three possible scenarios you may face when attempting to repartition
    your hard disk:


    +   * Unpartitioned free space is available

    * An unused partition is available

    * Free space in an actively used partition is available


    The following sections look at each scenario in order.


    > NOTE Please keep in mind that the illustrations in this chapter are simplified
    for clarity and do not reflect the exact partition layout that you will encounter
    when actually installing Red Hat Linux.


    # Using Unpartitioned Free Space


    In this situation, the partitions already defined do not span the entire hard
    disk, leaving unallocated space that is not part of any defined partition. Figure
    D-8 shows what this might look like.'
