  md: '# Appendix D


    # An Introduction to Disk Partitions


    Disk partitions are a standard part of the personal computer landscape and have
    been for quite some time. However, with many people purchasing computers featuring
    pre-installed operating systems, relatively few people understand how partitions
    work. This chapter attempts to explain the reasons for and use of disk partitions
    so your Red Hat Linux installation will be as simple and painless as possible.
    This also discusses the partition naming scheme used by Linux systems, sharing
    disk space with other operating systems, and related topics.


    > NOTE If you are reasonably comfortable with disk partitions, you could skip
    ahead to the "Making Room for Red Hat Linux" section in this chapter for more
    information on the process of freeing up disk space to prepare for a Red Hat Linux
    installation.


    # Hard Disk Basic Concepts


    Hard disks (also called *hard drives*) perform a very simple function — they store
    data and reliably retrieve it on command.


    When discussing issues such as disk partitioning, it is important to know a bit
    about the underlying hardware. Unfortunately, it is easy to become bogged down
    in details. Therefore, this chapter uses a simplified diagram of a disk drive
    to help explain what is really happening when a disk drive is partitioned.


    Figure D-1 shows a brand-new, unused disk drive.


    ![](img/70f8904e8a1105c5df33b26207132b97_386_0.png)


    Figure D-1. An Unused Disk Drive'
  merge: -1
  pgno: 386
- img_proc: true
  md: 'Not much to look at, is it? But if we are talking about disk drives on a basic
    level, it will do. Say that we would like to store some data on this drive. it
    will not work. There is something we need to do first, maybe formatting the drive
    (as discussed in the next section).


    # It''s Not What You Write, It''s How You Write It


    Experienced computer users probably got this one on the first try. We need to
    format the drive. Formatting (usually known as "making a file system") writes
    information to the drive, creating order out of the empty space on an unformatted
    drive.


    ![](img/70f8904e8a1105c5df33b26207132b97_387_0.png)


    Figure D-2. Disk Drive with a File System


    As Figure D-2, the order imposed by a file system involves some trade-offs, as
    follows:


    +   * A small percentage of the drive''s available space is used to store file
    system-related data. This percentage can be considered overhead.

    * A file system splits the remaining space into small, consistently-sized segments.
    In Linux, these segments are known as blocks.


    > NOTE Blocks really are consistently sized, unlike our illustrations. Keep in
    mind, also, that an average disk contains thousands of blocks. But for the purposes
    of this discussion, please ignore these minor discrepancies.


    Given that file systems make things like directories and files possible, these
    tradeoffs are usually seen as a small price to pay.


    It is also worth noting that there is no single, universal file system. As Figure
    D-3 shows, a disk drive may have one of many different file systems written on
    it. As you might guess, different file systems tend to be incompatible; that is,
    an operating system that supports one file system (or a handful of related file
    system types) may not support another. This last statement is not a hard-and-fast
    rule, however. for example, Red Hat Linux supports a variety of file systems (including
    many commonly used by other operating systems, such as'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# Appendix D: An Introduction to Disk Partitions 361


    FAT, which is used by Windows 9x/Me, making data interchange between different
    file systems easy.


    ![](img/70f8904e8a1105c5df33b26207132b97_388_0.png)


    Figure D-3. Disk Drive with a Different File System


    Of course, writing a file system to disk is only the beginning. The goal of this
    process is to actually store and retrieve data. Figure D-4 shows our example drive
    after some files have been written to it.


    ![](img/70f8904e8a1105c5df33b26207132b97_388_1.png)


    Figure D-4. Disk Drive with Data Written to It


    As the figure shows, 14 of the previously empty blocks are now holding data. However,
    we cannot determine exactly how many files reside on this drive by simply looking
    at this picture. There may be as few or as many as 14 files, as all files use
    at least one block and some use multiple blocks. Another important point to note
    is that the used blocks do not have to form a contiguous region; used and unused
    blocks may be interspersed. This concept is known as fragmentation. Fragmentation
    can play a part when attempting to resize an existing partition.'
  merge: -1
