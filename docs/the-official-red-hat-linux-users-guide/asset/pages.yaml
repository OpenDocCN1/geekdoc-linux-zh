  md: '# Chapter 21


    # Frequently Asked Questions


    This chapter answers some of the most common questions about using Red Hat Linux
    that you may ask us as you become more familiar with it. From recovering forgotten
    passwords to troubleshooting package installation problems, this chapter will
    ease you step-by-step through some tasks to help you get on your way.


    # Localhost Login and Password


    > Question: I have installed Red Hat Linux. After rebooting, I get a message telling
    me it needs a localhost login password. What do I need to do?


    Unless you specified a host name for your computer or received that information
    from a network, your Red Hat Linux installation will call your machine localhost.localdomain
    by default.


    When you get to initial prompt, Linux asks you to log in to your system. If you
    created a user account during installation, you can log in using username and
    password. If you didn''t create a user account during installation, then you can
    log in as the root. The root password is the system password assigned to root
    during installation.


    > NOTE You should create at least one user account during installation. If you
    did not, you can create a new user after logging in as root with the Red Hat User
    Manager GUI application or with the useradd command-line utility. For more information,
    refer to Chapter 2.


    # Error Messages During Installation of RPMs


    > Question: How do I install an RPM from a CD or the Internet? I keep getting
    an error message when I use rpm.


    If you are getting an error message similar to the following


    ```

    failed to open /var/lib/rpm/packages.rpm

    ```


    it is because you do not have proper permission to install RPM files.


    When you install software, you are often required to make systemwide changes that
    only root can make, such as creating new directories outside of your user home
    directory or making changes to your system configuration. If you are using your
    normal user account, you will not have permission to make such changes by default.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# 294 Part VI: Additional References


    You need to be the root user in order to install RPM files. At a shell prompt,
    you can switch to the root user by running the following command:


    ```

    su -

    ```


    You should be able to install the RPM package without further errors.


    > NOTE For more information about using RPM and Package Management Tool, see Part
    V of this book.


    # Starting Applications


    Question: I installed an application that I downloaded from the Internet, and
    everything seemed to go fine, but I still get "command not found" when I type
    its name. I think I have the right name, so why will it not start?


    If you are trying to start an application from the shell prompt and it is not
    working, try typing out the full directory path before the name of the application''s
    executable (such as /usr/local/bin/myexecutable).


    For example, if you have downloaded the setiathome client application and want
    to try it out, follow the instructions for installing the software, which creates
    a subdirectory in your home directory called seti/. Now, start the application
    using the full path to the executable file as follows:


    ```

    /home/joe/seti/setiathome

    ```


    The reason you may need to use the full pathnames in order to start an application
    is because the executable wasnt placed in a directory where your user shell environment
    knew it could be (such as /usr/local/bin) — that is, the application''s starting
    command is not in your PATH. You can customize your settings so that you'' wont
    be required to type the full path to the application each time. To do this, you
    will have to edit your PATH environment variable,


    # Editing Your PATH


    Question: Why do I always have to specify the full path of the commands for my
    programs?


    If you frequently start programs that are not located in a directory that your
    user shell has been configured to search, you will have to edit your user shell
    configuration file to add the directory containing the executable you wish to
    run. You can do this by adding the directory to your PATH environment variable.


    > CAUTION These instructions are intended only for user accounts. Avoid modifying
    files such as the user''s bash_profile because of the potential security risks.


    Start a text editor like pico at a shell prompt. You can open the file called
    .bash_profile by typing the following:


    ```

    pico .bash_profile

    ```'
