  md: '# # Chapter 15


    # # Working with Images


    There are several types of image files. Some images are created using sophisticated
    software packages, while others are made from digital cameras and scanners. You
    may have downloaded some of these image files from the Internet or received them
    in an email. You may also want to create your own images to send to others. You
    can view and manipulate the most common types of images using the applications
    included in Red Hat Linux.


    This chapter shows you how to work with images using the major image-capable software
    in Red Hat Linux.


    > NOTE One of the applications that you can use for image files — OpenOffice.org
    Draw — is covered in Chapter 11.


    # ## Viewing Images


    This section discusses some of the common tools for viewing image files. Certain
    tools are specialized applications with several functions that enhance your image
    viewing experience, while others are general-purpose browsers that have some image
    viewing functionality.


    # ## Viewing Images with Nautilus


    Nautilus is a general-purpose file manager and browser for your desktop environment.
    Nautilus has many functions beyond simple image viewing; however, for this section,
    we focus on showing how to use it for basic image browsing. For more information
    about Nautilus, see chapters 6 and 13.


    Nautilus is known for its ease-of-use, and it handles images with the same ease
    as it does for other file types. To begin browsing your image collection with
    Nautilus, double-click on your home desktop icon.


    You will be presented with a view of all the files and folders within your home
    directory. Double-click an image (or folder containing the image), and Nautilus
    will open the new file or folder within its browser window. Figure 15-1 shows
    that Nautilus automatically creates thumbnails of any images in your folders.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# 236 Part III: Getting the Most from Your Red Hat Linux System


    ![](img/70f8904e8a1105c5df33b26207132b97_263_0.png)


    Figure 15-1. Contents of a Folder in Nautilus


    Double-click on any thumbnail icon to view the image in its native size. The image
    will load within the browser window, along with a thumbnail view and detailed
    file information along the left panel.


    Below the file information are advanced options for working with the file. By
    default, Nautilus offers you the option of opening the file with Eye of Gnome,
    a robust image viewer with more imaging features than Nautilus.


    To increase and decrease the size of the viewed image in Nautilus, click on the
    magnifying glass icon on the location bar.


    ![](img/70f8904e8a1105c5df33b26207132b97_263_1.png)


    Figure 15-2. The Zoom Function in Nautilus


    Click the plus (+) icon to increase the size of the image or minus (-) to decrease
    it.


    # Viewing Images with GQview


    GQview is a powerful image viewer for GNOME desktop users that supports several
    image file formats, including the following:


    +   * JPG/JPEG'
