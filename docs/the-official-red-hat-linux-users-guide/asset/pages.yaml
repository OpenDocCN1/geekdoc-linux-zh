    # Establishing an xDSL Connection


    DSL stands for Digital Subscriber Lines. There are different types of DSL such
    as ADSL, IDSL, and SDSL. The Network Administration Tool uses the term xDSL to
    mean all types of connections.


    Some DSL providers require you to configure your system to obtain an IP address
    through DHCP with an Ethernet card. If you are required to use DHCP, refer to
    the “Establishing an Ethernet Connection” section earlier in this chapter to configure
    your Ethernet card.


    Some DSL providers require you to configure a PPPoE (Point-to-Point Protocol over
    Ethernet) connection with an Ethernet card. If you must supply a username and
    password to connect, you are probably using PPPoE. Ask your DSL provider which
    method to use.


    If you are required to use PPPoE, start the Network Administration Tool and follow
    these steps:


    +   1. Click the Devices tab.

    2. Click the Add button.

    3. Select xDSL connection from the Device Type list and click Forward.

