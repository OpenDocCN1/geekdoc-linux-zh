    # Is Your Ram Not Being Recognized?


    Sometimes, the kernel does not recognize all of your memory (RAM). You can check
    this with the following command:


    ```

    cat /proc/meminfo

    ```


    Find out if the displayed quantity is the same as the known amount of RAM in your
    system. If they are not equal, add the following line to /boot/grub/grub.conf:


    ```

    mem=XXM

    ```


    Or, if you used LILO, add the following line to the /etc/lilo.conf file:


    ```

    append="mem=XXM"

    ```


    Replace xx with the amount of RAM you have in megabytes. Remember that per-image
    append lines completely overwrite the global append. It might be worth adding
    this to the per-image descriptions, as shown in the example:


    ```

    mem=128M

    append=/grub/conf, the above example would look similar to the following:

    ```


    ```

    #NOTICE: You have a /boot partition. This means that

    # all kernel paths are relative to /boot/

    default=30

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Red Hat Linux (2.4.6-2)

    root (hd0,0)

    kernel vmlinuz-2.4.6-2 ro=/dev/hda3 mem=128M

    ```


    After you reboot, the changes made to grub.conf will be reflected on your system.


    In /etc/lilo.conf, the above example would look similar to the following:


    ```

    boot=/dev/sda

    map=/boot/map

    install=/boot/boot.b

    ```'
