    # Manipulating Files at the Shell Prompt


    Files can be manipulated easily using one of the graphical file managers such
    as Nautilus or Konqueror. They can also be manipulated using a shell prompt, which
    is often faster. This section explains how to manipulate files at the shell prompt.


    # Creating Files


    You can create new files either with applications (such as text editors) or by
    using the command touch, which will create an empty file that you can use to add
    text or data. To create a file with touch, type the following at a shell prompt:


    ```

    touch filename

    ```


    Replace filename with the name you wish to give the new file. If you run a directory
    listing after executing the touch command, you''ll see that the file contains
    zero (0) bytes of information because it is an empty file.


    ```

    ls -l filename

    -rw-rw-rw- 1 sam sam 0 Apr 10 17:09 newfile

    ```


    # Copying Files


    Like many other Linux features, there are a variety of ways to manipulate files
    and directories. You can also use wildcards, as explained in Chapter 8, to make
    the process of copying, moving, or deleting multiple files and directories faster.


    To copy a file, type the following command:


    ```

    cp source destination

    ```


    Replace source with the name of the file you want to copy, and destination with
    the name of the directory where you want the file to go.


    So, to copy the file sneakers.txt to the directory tigger/ in your home directory,
    move to your home directory and type:


    ```

    cp sneakers.txt tigger/

    ```


    You can use relative and absolute pathnames with cp.'
