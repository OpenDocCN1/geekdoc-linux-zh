  md: "# 164 Part II: The Basics\n\nTo remove read and write permissions from sneakers.txt\
    \ use the chmod command to take away both read and write permissions.\n\n```\n\
    chmod go-rw sneakers.txt\n```\n\nBy typing chmod go-rw, you are telling the system\
    \ to remove read and write permissions for the group and for others from the file\
    \ sneakers.txt.\n\nThe result will look like this:\n\n```\n-rw---- sam sam 150\
    \ Mar 19 08:08:sneakers.txt\n```\n\nThink of these settings as a kind of shorthand\
