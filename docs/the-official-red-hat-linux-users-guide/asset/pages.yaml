  md: '# Manipulating Images with The GIMP


    The GNU Image Manipulation Program (GIMP) is a powerful tool that can be used
    to create, alter, manipulate, and enhance digital image files — photographs, scanned
    images, computer-generated images, and more. This section offers a quick overview
    of The GIMP and refers to comprehensive references for learning about it.


    # GIMP Basics


    To use GIMP, you will need to know some of the basics. Start The GIMP from the
    desktop by clicking the Main Menu button and choosing Graphics ⇨ The GIMP (from
    the shell prompt, you can start GIMP by typing gimp).


    Figure 15-5 shows a typical GIMP session.


    ![](img/70f8904e8a1105c5df33b26207132b97_266_0.png)


    Figure 15-5. The GIMP in Action


    # Loading a File


    To load an existing file, choose File ⇨ Open. You will see the Load Image dialog,
    as shown in Figure 15-6.


    The Load Image dialog displays your working directory — the directory you were
    in when the GIMP was launched. You can navigate up and down the file system tree
    by double-clicking on the Directories list on the left, then selecting a file
    to open from the Files list on the right.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# 240 Part III: Getting the Most from Your Red Hat Linux System


    ![](img/70f8904e8a1105c5df33b26207132b97_267_0.png)


    Figure 15-6. The Load Image Dialog


    File name completion is supported by the GIMP. If you type the first letter (or)
    of a file name into the Selection field and press the Tab key, the views will
    change to only those subdirectories/or files beginning with that letter or letters.


    The file you select will appear in the Selection field near the bottom of the
    Dialog. A thumbnail preview will be displayed on the dialog; alternatively, you
    will see a Generate Preview button. If you want to select a thumbnail of the dialog,
    click the Generate Preview button.


    After you have selected a file, click the OK button to open it. You can also double-click
    a name to open it.


    # Saving a File


    To save an image file, right-click on the image and choose File �� Save (or As).


    > NOTE You will see the Save Image dialog if you choose Save as or if you choose
    Save and the file has not been saved before.


    The Save Image dialog looks almost exactly like the Load Image dialog and navigation
    of the system tree and choosing files works in the same way.


    When you are saving an image, you will need to choose an image format. The GIMP
    supports a wide variety of image formats, including .gif, .png, .jpg, and .bmp.'
