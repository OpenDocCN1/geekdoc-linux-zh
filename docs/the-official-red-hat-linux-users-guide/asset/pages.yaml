  md: '# Chapter 22: Keyboard and Shell Prompt Shortcuts 303


    # ### Table 22-2: System Prompt Shortcut Characters

    | Character | What It Represents |

    | --- | --- |

    | ~ (tilde character) | Stands for the home directory for the currently logged
    in user. For example, if root is logged in, typing cd ~ will take you to the /root
    directory (which is root''s home directory). |

    | . (dot) | Stands for current working directory. For example, typing /program
    attempts to execute the program file in the current working directory. |

    | .. (two dots) | Stands for the parent directory of the current working directory.
    For example, if you''re in the /home/user directory, typing cd .. will take you
    up one directory to the /home directory. |

    | * (asterisk) | Also called a wildcard character, the asterisk allows you to
    shorten file names in commands. To use the wildcard, you can simply type as much
    of the file or directory''s name needed to distinguish it from the other file
    and directory names in the current working directory and then type * to represent
    the rest of the file. For example, if you have two files in a directory named
    file1111 and file2222, you can simply type file1* and Linux will know that you
    mean file1111. |'
