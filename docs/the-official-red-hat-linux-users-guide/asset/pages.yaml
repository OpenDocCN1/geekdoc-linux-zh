  md: '# Chapter 6: Using the Graphical Desktop


    # # Emptying the Trash


    The can is just like a real trash — it does not empty itself, you have to empty
    it.


    > **WARNING** After you empty the Trash, all files in it are gone forever.


    To empty the Trash, do one of the following:


    +   - Double-click the Trash icon on your desktop and choose File ⇨ Empty Trash.

    - Right-click the Trash icon on your desktop and choose Empty Trash.


    > Note If you want to delete one file from the Trash, not every file, you can
    open the Trash, click on the file, and choose Edit ⇨ Delete from Trash.


    # # Customizing your System


    You can customize nearly every aspect of the brand-new Red Hat Linux 8.0 interface.
    From adding new Panels and changing the look of your interface, resizing icons
    and adding emblems to icons, Red Hat Linux 8.0 makes it easier than ever to customize
    the desktop interface.


    Figure 6-11 shows how different you can make your desktop look. Compare this with
    Figure 6-1; the two do not even resemble one another.


    ![](img/70f8904e8a1105c5df33b26207132b97_140_0.png)


    Figure 6-11. Customizing Your Desktop'
  merge: -1
