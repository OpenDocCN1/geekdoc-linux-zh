  md: '# # Chapter 9


    # # Managing Files and Directories


    Your desktop file manager is a powerful and important tool for managing files
    and directories using a graphical interface. This chapter discusses various shell
    commands that can be used to manage files and directories on your Red Hat Linux
    system. This chapter also discusses compression tools to create archives of your
    files for backups or to send to others conveniently.


    > NOTE Due to security, unless you are root, you will not be able to gain access
    to all system-level files and directories. If you do not have the permission to
    open, delete, or execute a file, you will receive an error message saying your
    access is denied. This is normal behavior and is used to prevent non-privileged
    users from deleting or altering important system files.


    # # A Larger Picture of the File System


    Every operating system has a method of storing data in files and directories so
    that it can keep track of additions, modifications, and other changes.


    In Linux, every file is stored in a directory. Directories can also contain directories;
    these subdirectories can also contain files and other subdirectories.


    You might think of the file system as a tree-like structure, in which directories
    branch off. These directories may contain, or be the "parent" of, other directories
    that may hold files and directories of their own.


    There would not be a tree without a root, and the same is true for the Linux file
    system. No matter how away the directories branch, everything is connected to
    the root directory, which is represented as a single slash (/).


    > TIP Red Hat Linux uses the root term in several different ways, which might
    be confusing to new users. There is the root account (also called the superuser),
    who has permission to do anything, the root account''s home directory (/root),
    and the root directory for the entire file system (/). When you are speaking to
    someone using root, be sure which root you are talking about.


    Unless you are a system administrator or have root (superuser) access, you probably
    not have permission to write to the files and directories outside of your home
    directory. Certain directories are reserved for specific purposes. For example,
    /home is the default location for non-root users'' home directories.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 170 Part II: The Basics


    Users who are not system administrators might find the following directories useful
    for their home directories, reading documentation, or storing temporary files:


    +   * home — The default location for non-root users home directories. For example,
    a user with the username has the home directory /home/foo.

    * /usr/share/doc — Location of documentation for installed packages. For example,
    the documentation for the deconfig software package is located in /usr/share/doc/deconfig-version-number.

    * /tmp — The reserved directory for all users to store temporary files. Files
    stored here are not permanent. A system process removes old files from this directory
    on a periodic basis Do not use any files or directories that you want to keep.


    Your Red Hat Linux is compatible with many other Linux distributions because of
    the Filesystem Hierarchy Standard (FHS). The FHS guidelines help to standardize
    the system programs and files are stored on all Linux systems.


    To learn more about the FHS, see Chapter 25.


    You can also visit the FHS website at http://www.pathname.com/fhs.


    # Identifying and Working with File Types


    If you are new to Linux, you see files with extensions you do not recognize. A
    file''s extension is the last part of a file''s name after the final dot (in the
    file sneakers.txt, "txt" is that file''s extension).


    Table 9-1 shows the major file extensions and their meanings.


    # Table 9-1: File Types and Extensions


    | Compressed and Archived Files* | |

    | Extension | File Type |

    | .bz2 | A file compressed with bzip2 |

    | .gz | A file compressed with gzip |

    | .tar | A file archived with tar (short for archive), also known as a tar file
    |

    | .tbz | A tarred and bzipped file |

    | .tgz | A tarred and gzipped file |

    | File Formats | |

    | Extension | File Type |

    | .au | An audio file |

    | .gif | A GIF image file |'
