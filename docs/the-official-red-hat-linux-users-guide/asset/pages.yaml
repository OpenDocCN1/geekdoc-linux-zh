  md: '# # Appendix C


    # # Configuring a Dual-Boot System


    Sharing a computer between two operating systems requires disk booting. You can
    use either operating system on the computer, but not both at once (unless you''re
    using a virtual machine such as VMware; see http://www.vmware.com for more information).
    Each operating system boots from and uses its own hard drives or disk partitions.


    This chapter explains how to configure your system to boot into both Red Hat Linux
    and another operating system. For clarity, we will assume that the other operating
    system is Microsoft Windows, but the general procedures are similar for other
    operating systems.


    > NOTE If Red Hat Linux will coexist on your system with OS/2, you must create
    your disk partitions with OS/2 partitioning software — otherwise, OS/2 may not
    recognize the disk partitions. During the installation, do not create new partitions,
    but set the partition types for your Linux partitions using ed.


    If you do not have any operating systems installed on your computer, install Windows
    first and then install Red Hat Linux.


    +   * If you are installing Windows 9x or Windows Me, you cannot define partitions
    during the Windows installation. Install Windows and then see the "Partitioning
    with FIPS" section later in this chapter for instructions on using FIPS to repartition
    your hard drive and create free space for Linux.


    +   * If you are installing Windows NT or Windows 2000, you can create partitions
    of a specific size for Windows. Leave enough free space (that is not partitioned
    or formatted) on the hard drive to install Linux.


    > TIP When partitioning your hard drive, keep in mind that the BIOS in some systems
    cannot access more than the first 1024 cylinders on a hard drive. If this is the
    case, leave enough room for /boot/ Linux partition on the first 1024 cylinders
    of your hard drive to boot Linux.


    See Chapter 1 to determine how much disk space to leave.


    After installing Windows, see the "Installing Red Hat Linux in a Dual-Boot Environment"
    section later in this chapter.


    If the computer you want to install Red Hat Linux on is currently running Windows
    (or some other operating system you have installed), you have an important decision
    to make. Your choices are:'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# 350 Part VII: Appendices


    +   - Do you want Red Hat Linux to be the only operating system on your computer,
    despite the fact that you already have Windows on your computer? If your answer
    is yes, you do not have to configure a dual-boot system. First back up any information
    that you want to save and start the installation.


    During the installation, if you choose to have the installation program automatically
    partition your system on the Disk Partitioning setup, Remove all partitions on
    this system. If you choose manual partitioning with Disk Drill or fdisk, delete
    all the existing MS-DOS (Windows) partitions and create your Linux partitions.


    +   - Do you want to install Red Hat Linux and then have the option of booting
    either Red Hat Linux or your other operating system? A Red Hat Linux installation
    can be performed so that Red Hat Linux is installed on your system, but the other
    operating system is not affected. Because you already have Windows installed,
    you need to allocate disk space for Linux. Refer to the next section and refer
    to the "Installing Red Hat Linux in a Dual-Boot Environment" section later in
    this chapter.


    # Allocating Disk Space for Linux


    If you already have Windows installed on your system, you must have free hard
    drive space available on which to install Red Hat Linux. Your choices are as follows:


    +   - Add a new hard drive.

    - Use an existing hard drive or partition.

    - Create a new partition.


    For all three options, be aware that the BIOS in some older systems cannot access
    more than the first 1024 cylinders on a hard drive. If this is the case, the /boot
    Linux partition must be located on the first 1024 cylinders of your hard drive
    to boot Linux.


    > WARNING Remember to back up all important information before reconfiguring your
    hard drive. Reconfiguring your hard drive can result in the loss of data if you
    are not extremely careful. Additionally, be sure to create a boot disk for both
    operating systems in case the boot loader fails to recognize either of them.


    # Adding a New Hard Drive


    The simplest way to make room for Red Hat Linux is to add a new hard drive to
    the computer and then install Red Hat Linux on that. For example, if you add a
    second IDE drive to the computer, the Red Hat Linux installation program will
    recognize it as hdb and the existing hard drive (the one used by Windows) as hda.
    For SCSI hard drives, the newly installed Red Hat Linux hard drive would be recognized
    as sdb and the other hard drive as sda.


    If you choose to install a new hard drive for Linux, all you need to do is start
    the Red Hat Linux installation program. After starting the Red Hat Linux installation
    program, just make sure you choose to install Linux on the newly installed hard
    drive (such as hdb or sdb) rather than the hard drive used by Windows.'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Appendix C: Configuring a Dual-Boot System 351


    # Using an Existing Hard Drive or Partition


    Another way to make room for Linux is to use a hard drive or disk partition that
    is currently being used by Windows. For example, suppose that Windows Explorer
    shows two hard drives, C and D:. This could indicate either that the computer
    has two hard drives, or a single hard drive with two partitions.


    In either case (assuming the hard drive has enough disk space), you can install
    Red Hat Linux on the hard drive or disk partition that Windows recognizes as D:


    > NOTE Windows uses letters to refer to removable drives (for example, a Zip drive)
    and network storage (virtual drives) as well as for local hard drive space; you
    cannot install Linux on a removable or network drive.


    This choice is available to you only if the computer has two or more hard drives
    or partitions.


    If a local Windows partition is available in which you want to install Linux,
    follow these steps:


    +   1 Copy all data you want to save from the selected hard drive or partition
    (D: in this example) to another location.

    2 Start the Red Hat Linux installation program and tell it to install Linux in
    the designated drive or partition; in this example, in the hard drive or partition
    that Windows designates as D.


    Note that C and D distinguishes between hard drives and disk partitions. Thus:


    +   * IF C: and D: on this computer refer to separate hard drives, the installation
    program will recognize them as hda and hdb (IDE) or sda and sdb (SCSI). Tell the
    installation program to install on hdb or sdb.

    * IF C: and D: refer to partitions on a single drive, the installation program
    will recognize them as hda1 and hda2 (or sda1 and sda2 for SCSI). During the partitioning
    phase of the Red Hat Linux installation, delete the second partition (hda2 or
    sda2) and partition the unallocated space for Linux. You do not have to delete
    the second partition prior to starting the Red Hat Linux installation.


    # Creating a New Partition


    The third way to make room for Linux is to create a new partition for Red Hat
    Linux on the other operating system. If Windows Explorer shows only one hard drive
    (C:), and you do not want to add a new hard drive, you must partition the drive.
    After partitioning, Windows Explorer will see a smaller C: drive; and, when you
    run the Red Hat Linux installation program, you can partition the remainder of
    the drive for Linux.


    > NOTE Make sure to leave enough room on your Windows partition to function properly.


    You can use a destructive partitioning program, such as fdisk, to divide the hard
    drive, but doing so will require you to reinstall Windows. (This is probably not
    your best option.)'
  merge: -1
  pgno: 378
- img_proc: true
  md: 'A number of non-destructive third-party partitioning programs are available
    for the Windows operating system. If you choose to use one of these, consult their
    documentation.


    For instructions on how to partition with FIPS, a program that is on the Red Hat
    Linux CD-ROM#1, refer to the "Partitioning with FIPS" section later in this chapter.


    # # Installing Red Hat Linux in a Dual-Boot Environment


    After Windows is installed and you have free disk space ready for Linux, you can
    start the Red Hat Linux installation program. See Chapter 1 for instructions on
    installing Red Hat Linux.


    At this point, the only difference between a Red Hat Linux installation and configuring
    a dual-boot system by the Red Hat Linux installation is partitioning the hard
    drive and configuring the boot loader. When you are at the Disk Partitioning Setup
    screen, return to this section.


    # ## Disk Partitioning


    At the Partitioning Setup screen of the installation program, you choose, you
    have a few options. Depending on which option you choose, the steps for configuring
    a dual-boot system vary. If you do not know how many partitions to create, refer
    to Chapter 2 for a recommended partitioning scheme. If you choose:


    +   * **Automatic partitioning** — Keep all partitions and using free space. This
    option will leave your Windows partitions on the hard drive and partition the
    free space or additional hard drive for Red Hat Linux.

    * **Manual partitioning with Disk Druid** — Do not delete the existing partitions
    (they are the partitions of type NTFS). Create your Linux partitions on the additional
    hard drive or in the free space you have reserved for Red Hat Linux.

    * **Manual partitioning with fdisk** — This option is similar to Disk Druid except
    you will not have the graphical interface. The basic procedure is the same. Do
    not delete the existing partitions of type FAT16, FAT32, or NTFS. Create your
    Linux partitions on the additional hard drive or in the free space you have reserved
    for Red Hat Linux.


    # ## Configuring the Boot Loader


    When you are at the Boot Loader Installation screen during the Red Hat Linux installation,
    choose to install the boot loader. You can use a different boot loader to boot
    both Red Hat Linux and Windows.


    Red Hat does not support alternate boot loaders. Thus, this section will discuss
    how to configure GRUB or LILO to boot both operating systems.


    The Red Linux installation program will usually detect Windows and automatically
    configure the boot loader (GRUB or LILO) to boot either Red Hat Linux or Windows.
    This can be seen on the boot loader screen of the installation program. An entry
    DOS appears in the list of operating systems to boot.'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# Appendix C: Configuring a Dual-Boot System 353


    # Post-Installation


    After the installation, whenever start the computer, you can indicate whether
    you want to start Red Hat Linux or the other operating system from the boot loader.
    Choose Red Hat Linux to boot into Red Hat Linux or choose DOS to boot into Windows.


    If you did not partition all the free space on your hard drive for Red Hat Linux,
    you can partition it for Windows after installing Red Hat Linux. You can use fdisk
    to create these partitions.


    parted is easier to use fdisk because of the interface and the commands used.
    For example, to use the partition table, you type print in instead of typing p
    in fdisk. For more information about parted, see the Official Red Hat Linux Administrator''s
    Guide (Red Hat/Wiley, 2003).


    > WARNING It is highly recommended that you used parted or fdisk to create partitions
    after installing Red Hat Linux. Other partitioning software has been known to
    change the partitioning of the hard drive and move the Linux partitions. If this
    happens, the boot loader will not be able to find the Linux partitions and will
    not boot into Red Hat Linux.


    To access files on the Windows partitions while using Red Hat Linux, see Chapter
    21.


    > NOTE If you formatted the Windows partitions in NTFS format, this method will
    not work.


    # Partitioning with FIPS


    As a convenience to our customers, we provide the FIPS utility. This is a freely
    available program that can resize FAT (File Allocation Table) partitions. It is
    located on the Red Hat CD-ROM in the dosutils directory. If you are using NTFS
    partitions, FIPS will not work.


    > WARNING Many people have successfully used FIPS to repartition their hard drives.
    However, the nature of the operations carried out by FIPS and the wide variety
    of hardware and software configurations it must run, Red Hat guarantee that FIPS
    will work properly on your system. Therefore, no immediate support is available
    for FIPS: use it at your own risk.


    With the immediately preceding warning in mind, if you departition your hard drive
    with FIPS, this is what you should do:


    +   Perform a Backup — Make two copies of all the important data on your computer.
    These copies should be removable media (such as tape, CD-ROM, or diskettes), and
    you should make sure they are readable before proceeding.


    +   Read the Documentation — Completely read the FIPS documentation, which is
    located in the dosutils/fipsdocs directory on the Red Hat Linux CD-ROM #1.


    Should you decide to use FIPS, after FIPS runs you will be left with two partitions:
    the one you resized and the one FIPS created out of the newly freed space. If
    your goal is to use space to install Red Hat Linux, you should delete the newly
    created partition, either by using


    ![](img/70f8904e8a1105c5df33b26207132b97_380_0.png)'
