  md: '# GIMP Options


    Like many applications, The GIMP provides more than one method to accomplish tasks.
    The easiest way to work with images is to right-click on the image, which will
    display a set of menus containing most of The GIMP''s many capabilities, including
    image sizing, rotation, and filter application.


    For example, imagine you have a picture that you would like to make it look as
    if it were clipped from a Newsprint. . . . . To do this, right-click on the image
    and select Filters ⇨ Distorts ⇆ . . . . . Select the quantity of lines per inch
    using the sliders. When you reach a desired quantity and are ready to render the
    image, click OK. The GIMP will then render the image with the new effect applied.
    Figure 15-7 shows an example of an image after the Newsprint filter has been applied.


    ![](img/70f8904e8a1105c5df33b26207132b97_268_0.png)


    Figure 15-7. An Image Modified with a GIMP Filter


    The Toolbox (Figure 15-8) also has several easily accessible functions. Using
    the Toolbox you can add text to images, erase regions of an image, or even fill
    selected regions with the color of your choice.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# 242 Part III: Getting the Most from Your Red Hat Linux System


    ![](img/70f8904e8a1105c5df33b26207132b97_269_0.png)


    For example, if you wish to add text to a file, select the Text button and click
    on your image. This will load the Text Tool dialog box, where you can choose a
    font and type some text in the provided text box. Click OK and your text will
    be displayed as a floating section on the image. You can then move the text to
