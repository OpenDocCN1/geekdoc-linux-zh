  md: '# 308 Part VI: Additional References


    itself. In this way, our sample package may have many different tools that each
    go in their own subdirectories, such as /opt/sample/tool1 and /opt/sample/tool2,
    each of which have their own bin, man, and other directories.


    # The /proc Directory


    The /proc directory contains special "files" that extract information from or
    send information to the kernel. For more information on the great variety of data
    available within /proc and the many ways this directory can be used to communicate
    with kernel, the section "/proc File System" later in this chapter.


    # The /sbin Directory


    The /sbin directory is for executables used only by the root user. The executables
    in /sbin are only used to bind and mount /usr and perform system recovery operations.


    # The /usr Directory


    The /usr directory is for files that can be shared across a whole site. The /usr
    directory usually has its own partition, and it should be mountable read-only.
    Table 23-1 briefly describes the major subdirectories of /usr.


    # Table 23-1: Subdirectories of /usr


    | Subdirectory | What It Contains |

    | --- | --- |

    | /bin | Executables |

    | /dict | Non-FHS compliant documentation pages |

    | /etc | System-wide configuration files |

    | /games | Games |

    | /include | C header files |

    | /kerberos | Binaries (and much more) for Kerberos |

    | /lib | Object files and libraries that are not designed to be directly utilized
    by users or shell scripts |

    | /libexec | Small helper programs called by other programs |

    | /sbin | System administration binaries (those that do not belong in /sbin) |

    | /share | Files that are not architecture-specific, src is for source code |

    | /X11R6 | Files for the X Window System (XFree86 on Red Hat Linux) |


    # The /usr/local Directory


    The /usr/local directory is similar in structure to the /usr directory.'
