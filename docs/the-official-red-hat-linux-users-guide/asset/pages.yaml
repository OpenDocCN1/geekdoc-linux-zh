  md: '# # Partitioning Your System Manually


    If you chose automatic partitioning and did not select Review, please skip ahead
    to the "Network Configuration" section.


    If you chose to partition manually with Disk Druid, the "Partitioning with Disk
    Druid" section a bit later in this chapter. If you chose to partition manually
    with fdisk, please skip ahead to the "Partitioning with fdisk" section.


    # # Recommended Partitioning Scheme


    If you chose Disk Druid or fdisk, Red Hat recommends that you create the following
    partitions:


    +   * *Swap partition (at least 32MB)* — Swap partitions are used to support virtual
    memory. In other words, data is written to a swap partition when there is not
    enough RAM to store the data your system is processing. The size of your swap
    partition should be equal to twice your computer''s RAM, or 32MB, whichever is
    larger.

    For example, if you have 1GB of RAM or less, your swap partition should be at
    least equal to the amount of RAM on your system, or to two times the RAM. A maximum
    of 2GB of swap is recommended.


    +   * *A boot partition (100MB)* — The partition mounted /boot contains the operating
    system kernel (which allows your system to boot Red Hat Linux), along with files
    used during the bootstrap process. Due to the limitations of most PC BIOSes, creating
    a small partition to hold these files is a good idea. For most users, a 100MB
    boot partition is sufficient.


    > > WARNING Do not create your /boot partition as an LVM partition type. The boot
    loaders included with Red Hat Linux cannot read LVM partitions and you will not
    be able to boot your Red Hat Linux system.


    If your drive has more than 1024 cylinders (and your system was manufactured more
    than two years ago), you may need to create a /boot partition if you use the root
    (/) to use all of the remaining space on your hard drive.


    +   * *A root (/) partition (1.5-4.5GB)* — This is where the root (/) directory
    will be located. In this setup, all files (except those stored in /boot) are on
    the root partition. A 1.5GB root partition will permit the equivalent of a personal
    desktop or workstation installation (with little free space), while a 4.5GB root
    partition will let you install every package.


    # # Partitioning with Disk Druid


    The partitioning tool used by the installation program is Disk Druid. With the
    exception of certain esoteric situations, Disk Druid can handle the partitioning
    requirements for a typical installation. If you chose automatic partitioning and
    selected Review, you can either accept the current partition settings (click Next),
    or modify the setup with Disk Druid.'
  merge: -1
