  md: '# # Appendix B


    # # The KDE Desktop Environment


    KDE, which stands for the *K Desktop Environment*, is a graphical desktop environment
    that allows you to access your Red Hat Linux system and applications using your
    mouse and keyboard.


    This chapter covers the fundamental aspects of using KDE, including:


    +   * System navigation

    * Working with files and applications

    * Customizing the desktop to suit your needs


    This book focuses on the default Red Hat desktop environment (which is based on
    GNOME) that is described in detail in Chapter 6. If you would like to learn more
    about KDE than this chapter covers, visit the official website at the following
    URL:


    ```

    http://www.kde.org

    ```


    > TIP If you have both KDE and GNOME installed on your system, you can use applications
    from both environments. For example, you can use the GNOME email and personal
    information management suite, Evolution, while you are working in KDE, or use
    K-Mail, the KDE email application, in GNOME.


    # # Setting Up KDE


    To use KDE in Red Hat Linux, you either need to install KDE during the installation
    of your Red Hat Linux system (as described in Chapter 2) or you need to add the
    KDE package to Red Hat Linux after the installation. (See Part V for more information
    about adding packages to Red Hat Linux.)


    The first time you log into KDE (refer to Chapter 5 for more information about
    logging into your Red Hat Linux machine), a setup wizard will appear that allows
    you to set up your language and locale settings. Figure B-1 shows the welcome
    screen of the KDE setup.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# 336 Part VII: Appendices


    Step 1 Introduction


    ![](img/70f8904e8a1105c5df33b26207132b97_363_0.png)


    Welcome to KDE 3.0.1!

    This Personalizer will help you configure the basic setup of your KDE desktop
    in five quick, easy steps. You can set things like your country (for date and
    time formats, etc.), language, desktop behavior and more

    You will be able to change all the settings later using the KDE Control Center.
    You may choose to postpone your personalization until later by clicking on Skip.
