    | updates | Prompts you to install a floppy diskette containing updates (bug fixes).
    This is not needed if you are performing a network installation and have already
    placed the updated image contents in RHUpdates/ on the server.


    #  Kernel Options


    Options can also be passed to the kernel. For example, to instruct the kernel
    to use all the RAM in a system with 128MB of RAM, enter:


    ```

    boot: linux mem=128M

    ```


    For text mode installations, use:


    ```

    boot: linux text mem=128M

    ```


    After entering any options, press Enter to boot using those options.


    If you need to specify boot options to identify your hardware, please write them
    down. The boot options will be needed during the boot loader configuration portion
    of the installation (the "Boot Loader Configuration" section later in this chapter
    for more information).


    # Booting Without Diskettes


    The Red Hat Linux CD-ROM can be booted by computers that support bootable CD-ROMs.
    Not all computers support this feature, so if your system cannot boot from the
    CD-ROM, there is one other way to start the installation without using a boot
    diskette. The following method is specific to x86-based computers only.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# 28 Part I: Installing Red Hat Linux


    If you have MS-DOS installed on your system, you can boot directly from the CD-ROM
    drive without using a boot diskette. To do this (assuming your CD-ROM drive is
    d:), use the following commands:


    ```

    C:> d:

    D:\> cd \dosutils

    D:\> dosutils autoboot.bat

    ```


    This method will not work if run in an MS-DOS Command Prompt window — the autoboot.bat
    file must be executed with MS-DOS as the only operating system; that is, Windows
    cannot run.


    If your computer cannot boot from CD-ROM (and you cannot use a MS-DOS-based autoboot.bat),
    you will have to use a boot diskette to start the installation.


    # Selecting an Installation Method


    What type of installation method do you wish to use? The following installation
    methods are available:


    +   * CD-ROM — If you have a CD-ROM drive and the Red Hat Linux CD-ROMs, you can
    use this method. You will need a boot diskette or a bootable CD-ROM. PCMC boot
    and driver diskettes may also be used. Refer to the next section for CD-ROM installation
    instructions.


    +   * Hard Drive — If you have copied the Red Hat Linux images to a local hard
    drive, you can use this method. You will need a boot diskette. PCMC boot and driver
    diskettes may also be used. See the "Installing from a Hard Drive" section later
    in this chapter for hard drive installation instructions.


    +   * NFS Image — If you are installing from an NFS server using ISO images or
    a mirror image of Red Hat Linux, you can use this method. You will need a network
    boot diskette. PCMC boot and driver diskettes may also be used. See the "Installing
    via NFS" section later in this chapter for network installation instructions.
    Please note that NFS installations may also be performed in GUI mode.


    +   * FTP — If you are installing directly from an FTP server, use this method.
    You will need a boot diskette. PCMC boot and driver diskettes may also be used.
    See the "Installing via FTP" section later in this chapter for FTP installation
    instructions.


    +   * HTTP — If you are installing directly from an HTTP (Web) server, use this
    method. You will need a network boot diskette. PCMC boot and driver diskettes
    may also be used. See the "Installing via HTTP" section in this chapter for HTTP
    installation instructions.


    # Installing from CD-ROM


    To install Red Hat Linux from a CD-ROM, choose the CD-ROM option from the boot
    loader screen and select OK. When prompted, insert the Red Hat CD into your CD-ROM
    drive (if you did not boot from the CD-ROM). When the CD is in the CD-ROM drive,
    select OK and press Enter.'
  merge: -1
