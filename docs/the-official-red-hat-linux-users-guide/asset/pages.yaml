    receipts). Detailed information about creating functions for calculating your
    numerical data in OpenOffice.Calc, refer to the OpenOffice.Calc documentation
    by selecting Help -> Contents.


    If you need to create charts or graphs for class or business presentations, OpenOffice.org
    has several chart and graph templates available to choose from. Highlight the
    areas where you would like to chart, then click Insert -> Chart ... In the Chart
    window, the data ranges you will be shown in the text box for you to customize
    further if you desire. Click Next to display the many different charts and graphs
    you can create using your data. Choose the style you want, and click Create. The
