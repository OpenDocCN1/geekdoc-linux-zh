  md: '# # Chapter 22

    Keyboard and Shell Prompt Shortcuts


    Red Hat Linux includes various shortcuts to help you more smoothly navigate your
    interface, be it text or graphical, as well shortcuts to kill applications, switch
    virtual consoles, and more.


    The tables in this chapter describe some of the more useful keyboard shortcuts
    (Table 22-1) and shell prompt shortcut characters (Table 22-2) that are available
    in Red Hat Linux.


    Many more are available in addition to those listed in this chapter. For more
    command line and keyboard shortcuts, visit:


    ```

    http://sunsite.dk/linux-newbie/lnag_commands.html#shortcuts

    ```


    # Table 22-1: Red Hat Linux Keyboard Shortcuts


    | Shortcut | What It Does |

    | --- | --- |

    | Alt-Tab | If you have more than one application open at a time, you can use
    Alt-Tab to switch among open tasks and applications. |

    | Ctrl-Alt-+ | Switches to the next X-server resolution (this works only when
    X is running and if you have configured more than one resolution for your system).
    |

    | Ctrl-Alt-- | Switches to the previous X-server resolution (this works only when
    X is running and if you have configured more than one resolution for your system).
    |

    | Ctrl-Alt-Backspace | Kills your current X session and returns you to the login
    screen. Use if this normal exit procedure does not work. |

    | Ctrl-Alt-Delete | Shut down and reboot. Shuts down your current session and
    reboots the OS. Use only when the normal shutdown procedure does not work. |'
