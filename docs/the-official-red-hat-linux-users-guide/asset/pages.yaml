  md: '# # Chapter 16


    # # Printer Configuration


    Red Hat Linux includes the Printer Configuration Tool to allow users to configure
    a printer. The Printer Configuration Tool helps maintain the /etc/printcap configuration
    file, print spool directories, and print filters.


    This chapter provides information on configuring, testing, and modifying a local
    printer with the Printer Configuration Tool.


    > NOTE Information on configuring various types of printers, configuring a printer
    without the Printer Configuration Tool, use, refer to the Official Red Hat Linux
    Administrator''s Guide (Red Hat Press/Wiley, 2003) or click on the Help button
    when you open the Printer Configuration Tool.


    # # Introducing the Printer Configuration Tool


    To use the Printer Configuration Tool, you must have root privileges. To start
    the Printer Configuration Tool, use one of the following methods:


    +   - In a graphical desktop environment, click the Main Menu button and choose
    System Settings ⇨ Printing.


    +   - Type the command redhat-config-printer at a shell prompt to start the graphical
    version.


    +   - You can also run Printer Configuration Tool as a text-based application
    if you do not have the X Window System installed, or if you just prefer the text-based
    interface. To do, type the command redhat-config-printer-ui from a shell prompt,
    which will prompt you for the root password before it continues.


    > IMPORTANT Do not edit the /etc/printcap file. Each time the printer daemon (lpd)
    is started or restarted, a new /etc/printcap file is dynamically created.


    If you want to add a printer without the Printer Configuration Tool, edit the
    /etc/printcap.local file. The entries in /etc/printcap.local are not displayed
    in the Printer Configuration Tool but are read by the printer daemon. If you upgrade
    your system from a previous version of Red Hat Linux, your existing configuration
    file is converted to the new format used by the Printer Configuration Tool. Each
    time a file is saved the old file is saved as /etc/printcap.old.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Part IV: Configuring Your Red Hat Linux System


