    that you want to include all files contained in the filesdir directory recursively.


    To extract the contents of a zip file, type the following command:


    ```

    unzip filename.zip

    ```


    You can use zip to compress multiple files and directories at the same time by
    listing them with a space between each:


    ```

    zip -r filename.zip file1 file2 file3 /usr/work/school

    ```


    The above command compresses file1, file2, file3, and the contents of the /usr/work/school
    directory (assuming this directory exists) and places them in a named filename.zip.


    > **TIP** For more information, type **man zip** and **man unzip** at a shell
