    # Email Applications


    Email is a very popular way of communicating with others over the Internet. You
    can use email with an email client, an application that understands the various
    email transmission standards and allows you to send, receive, and read email.
    Red Hat Linux includes several email applications, including graphical email clients
    like Evolution and Mozilla Mail, as well as text-based clients like Pine and Mutt.


    All of the email client applications are designed to suit certain types of users;
    so, you can choose one that best suits your particular needs.


    The purpose of this section is to demonstrate how to use of the popular email
    applications included in Red Hat Linux. Because all email clients perform the
    same basic tasks (send and receive email), choose the one that is most convenient
    and easy to use.


    The following sections briefly discuss the following email clients:


    +   - Evolution

    - KMail'
