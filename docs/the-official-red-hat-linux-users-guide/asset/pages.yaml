  md: '# Redirecting Standard Input


    Not only can you redirect standard output, you can perform the same type of redirection
    with standard input.


    When you use the standard input symbol < , you are telling the shell that you
    want a file to be read as input for a command.


    Use a file you have already created to demonstrate this idea. Just type the following:


    ```

    cat < sneakers.txt

    ```


    Because you used the less-than symbol (<) to separate the cat command from the
    file, the output of sneakers.txt was read by cat.


    # Pipes and Pagers


    A pipe is the symbol located on the same key as the backslash on your keyboard.
    In Linux, pipes connect the standard output of one command to the input of another
    command. Consider the ls command that was discussed earlier in this chapter. There
    are plenty of options available with ls, but what if the contents of a directory
    scroll by too quickly to view them?


    As an example, view the contents of the /etc directory.


    ```

    ls -al /etc

    ```


    How do you get a closer look at the output before it moves off the screen?


    One way is to pipe the output to a utility called less. less is a pager utility
    that allows you to view information one page (or screen) at a time.


    ```

    ls -al /etc | less

    ```


    Now you can view the contents of /etc one screen at a time. To move back a screen,
    press b; to quit, press q. Alternatively, you can use the arrow keys to navigate
    with less.


    > Tip To read startup messages more closely, at a shell prompt, type dmesg | less.
    You will be able to read the file one screen at a time. Use the arrow keys to
    navigate the file.


    Pipes can also be used to print certain lines from a file. Type the following:


    ```

    grep coffee sneakers.txt | lpr

    ```


    This will print every line in the sneakers.txt file that mentions the word "coffee"
    (read more about grep in the "Grep Command" section later in this chapter).'
  merge: -1
  pgno: 182
