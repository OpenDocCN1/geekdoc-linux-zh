    # Archiving Files at the Shell Prompt


    A tar (stand for tape archive, a term which hails back to a time when the only
    storage media around were tapes) file is a collection of several files and/or
    directories in one file. It is a good way to create backups and archives.


    Some of the options used with tar are listed in Table 9-3.


    # Table 9-3: tar Options


    | Option | What It Does |

    | --- | --- |

    | -c | Create a new archive. |

    | -f | When used with the -c option, the filename specified for the creation of
    the tar file; when used with the -x option, unarchive the specified file. |

    | -t | Show the list of files in the tar file. |'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Chapter 9: Managing Files and Directories 177


    | -v | Show the progress of the files being archived. |

    | -x | Extract files from an archive. |

    | -z | Compress the tar file with gzip. |

    | -j | Compress the tar file with bzip2. |


    To create a tar file, type


    ```

    tar -cvf filename.tar files/directories

    ```


    In this example, filename.tar represents the file you are creating, and files/directories
    represents the files or directories you want to put in the archived file.


    You can tar multiple files and directories at the same time by listing them with
    a space between each:


    ```

    tar -cvf filename.tar /home/mine/work /home/mine/mine/school

    ```


    The above command places all the files in the work and the subdirectories of the
    home directory for user mine in a new file filename.tar in the current directory.


    To list the contents of a tar file, type


    ```

    tar -tvf filename.tar

    ```


    To extract the contents of a tar file, type


    ```

    tar -xvf filename.tar

    ```


    This command does not compress the files, but places copies of its contents in
    the working directory.


    Remember, the tar command does not compress the files by default. To create a
    tarred and bzipped compressed file, use the -j option as follows:


    ```

    tar -ojvf filename.tbz

    ```


    tar files compressed with bzip2 are conventionally given the extension .tbz.


    This command creates an archive file and compresses it as the file filename.tbz.
    If you uncompress the filename.tbz with the bunzip2 command, the filename.tbz
    file is removed and replaced with filename.tar.


    You can also expand and unarchive a bzip tar file in one command:


    ```

    tar -xjvf filename.tbz

    ```


    To create a tarred and gzipped compressed file, use the -z option:


    ```

    tar -czvf filename.tgz

    ```


    tar files compressed with gzip are conventionally given the extension .tgz.'
