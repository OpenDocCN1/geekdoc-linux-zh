  md: '# Installation Type


    Choose the type of installation you would like to perform. Red Hat Linux allows
    you to choose the installation type that best fits your needs. Your options are
    Personal Desktop, Workstation, Server, Custom, and Upgrade.


    ![](img/70f8904e8a1105c5df33b26207132b97_64_0.png)


    Figure 2-11. Choosing an Installation Type


    To perform an upgrade, see Chapter 3.

    For information about the different installation classes, please refer to the
    "Selecting an Installation Method" section earlier in this chapter.


    # Disk Partitioning Setup


    Partitioning allows you to divide your hard drive into isolated sections where
    each section behaves as if it were its own hard drive. Partitioning is particularly
    useful if you run more than one operating system. If you are not sure how to partition
    your system, read Appendix D for more information.


    On this screen, you can choose to perform automatic partitioning or manual partitioning
    using Disk Druid or fdisk (see Figure 2-12).


    Automatic partitioning allows you to perform an installation without having to
    partition your drive(s) yourself. If you do not feel comfortable partitioning
    your system, it is recommended that you do not choose to partition manually and
    instead let the installation partition for you.'
