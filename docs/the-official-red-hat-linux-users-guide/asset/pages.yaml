    Redirect standard output, use the > symbol. Placing > after the cat command (or
    after any utility or application that writes to standard output) will direct its
    output to the filename following the symbol.


    For example, using cat by itself outputs whatever you input to the screen as if
    it were the line you just typed. The following example shows cat repeating every
