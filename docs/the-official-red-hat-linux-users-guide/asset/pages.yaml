- img_proc: true
  md: '# Additional Boot Options


    While it is easiest for a user to boot from the CD-ROM and perform a graphical
    installation, sometimes there are installation scenarios booting in a different
    manner may be needed. This section discusses addition boot options available for
    Red Hat Linux.


    NOTE See Table 2-2 in this section for additional boot options.


    +   * If you not wish to perform a graphical installation, you can start a text
    mode installation using the following boot command:

    ```boot: linux text\```

    * ISO images now have an md5sum embedded in them. To test the checksum integrity
    of an ISO image, at the boot prompt type:

    ```boot: linux mediaicheck\```

    The installation program will prompt you to insert a CD or select an ISO image
    to test and select OK to perform the checksum operation. This operation can be
    performed on any Red Linux CD and does not have to be performed in a specific
    order (for example, CD #1 does not have the first CD you verify). It is strongly
    recommended to perform this operation on any Red Linux CD that was created from
    downloaded ISO images. This procedure works with CD-based installations and hard
    drive and NFS installations using ISO images.

    * If the installation program not properly detect your hardware, you may need
    to restart the installation in expert mode. *Expert mode* disables hardware probing
    and allows you to enter options for the drivers loaded during installation. The
    initial boot messages will not contain any references to SCSI or network cards.
    This is normal; these devices are supported by modules that are loaded during
    the installation process. Enter expert mode using the following boot command:

    ```boot: linux noprobe\```

    For text mode installations, use:

    ```boot: linux text noprobe\```

    * If you need to perform the installation in serial mode, type the following command:

    ```boot: linux console=device\```

    For text mode installations, use:

    ```boot: linux text console=device\```

    in the above command, device should be the device you are using (such as tty0
    or ttyS1). For example, linux text console=tty0, 115200n8.


    Table 2-2 shows more boot-time command arguments.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Table 2-2: Boot Options


    | Command | What It Does |

    | --- | --- |

    | askmethod | Asks to select the installation method you would like to use when
    booting from the Red Hat Linux CD-ROM. |

    | apic | Works around a bug commonly encountered in the Intel 440GX chipset BIOS
    and should only be executed with the installation program kernel. |

    | apm=allow_ints | Changes how the suspend state is handled (and may be necessary
    for some laptops). |

    | apm=off | Disables APM (Advanced Power Management). This is useful because some
    BIOSes have buggy power management (APM) and tend to crash. |

    | apm=power_off | Makes Red Hat Linux shut the system by default. This is useful
    for SMP systems that do not shut down by default. |

    | apm=realmode_power_off | Some BIOSes crash when trying to shut down the machine.
    This command changes the method of how this is done from the Windows NT method
    to the Windows 95 method. |

    | dd | Prompts you to use a driver disk during the installation of Red Hat Linux.
    |

    | display=IP:0 | Allows remote display forwarding. In this command, IP should
    be replaced with the IP address of the system you want the display to appear on.
    you must execute the command xhost +remotehostname, where remotehostname is the
    name of the host you are running the original display from. Using the command
    xhost +remotehostname limits access to the remote display terminal and does not
    allow access from anyone or any system not specifically authorized for remote
    access. |

    | driverdisk | Performs the same function as the dd command and also prompts you
    to use a driver disk during the installation of Red Hat Linux. |

    | expert | Allows partitioning of removable media and prompts for driver disk.
    |

    | ide=nodma | Disables DMA on all IDE devices and may be useful when having IDE-related
    problems. |

    | isa | Prompts you for ISA device configuration. |

    | lowres | Forces the graphical (GUI) installation program to run at a lower resolution
    (640x480). |'
  merge: -1
