  pgno: 223
- img_proc: true
  md: '# Chapter 11: Working with Documents 197


    If you are familiar with illustration and graphics applications as The GIMP (refer
    to Chapter 15 for more information), you will find that OpenOffice.Draw has some
    of the same basic functions with the added benefit of being integrated with the
    rest of the OpenOffice.org suite.


    There are toolbars for creating straight and curved lines, basic shapes such as
    squares and circles, 3-D objects such as cones and cubes, and more. You can create
    images and fill them with the color of your choice using the Area Style/Filling
    drop-down menu on the main toolbar. You can additionally insert text into your
    illustrations. OpenOffice.Draw also allows you to open and import images and modify
    them with the tools provided.


    When you complete your illustration or image modifications, you can save the file
    in one of several native native file formats or export your work to a universal
    format as .jpg or .png. Refer to Table 11-1 for the complete list of compatible
    image file formats.


    # Viewing PDFs


    A PDF (Portable Document Format) file is an electronic image of a document. PDF
    captures formatting information from a variety of desktop publishing applications,
    making it possible to send formatted documents and have them appear on the recipient''s
    monitor or printer as they were intended. To view a PDF you must have a PDF reader.


    ![](img/70f8904e8a1105c5df33b26207132b97_224_0.png)


    Figure 11-8: The xpdf PDF Viewer


    An open source application called xpdf is included with Red Hat Linux.


    To view a PDF with xpdf:'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Part III: Getting the Most from Your Red Hat Linux System


    +   1. In your desktop environment, click the Main Menu button and choose Graphics
    xpdf (to launch xpdf from a shell prompt, type xpdf).

    2. Right-click in the xpdf screen to display a list of options.

    3. Select Open to display a list of files.

    4. Select the PDF file you want to view and click Open.


    To see a list of menu options, right-click inside the screen. The toolbar at the
    bottom has navigational tools that let you move backward and forward through the
    document, as well as standard zoom, print, and find tools. The xpdf man page provides
    useful information on the xpdf options. To view the xpdf man page, at a shell
    prompt man xpdf.


    ![](img/70f8904e8a1105c5df33b26207132b97_225_0.png)


    Figure 14-9: Viewing a PDF in xpdf


    Another popular PDF viewer is Adobe Acrobat Reader. While it is not included with
    Red Hat Linux, you can download it free at http://www.adobe.com/.'
