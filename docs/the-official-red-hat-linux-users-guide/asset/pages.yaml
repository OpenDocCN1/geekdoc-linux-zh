    # Problems After Installation


    If you have problems after installing Red Hat Linux, the following sections help
    you troubleshoot the problem.


    # Trouble with the Graphical GRUB Screen?


    If some reason you need to disable the graphical boot screen, you can do so, as
    root, by editing the /boot/grub/grub.conf file and then rebooting your system.


    To do this, comment out the line that contains with splashimage in the grub.conf
    file. (To comment out a line, insert the ; character at the beginning of the line)


    Once you reboot, the grub.conf file will be reread and the graphical changes will
    take place.


    Once you''ve fixed the problem, you may re-enable the graphical boot screen by
    uncommenting (or adding) the line above in the grub.conf file and rebooting.


    # Trouble with the Graphical LILO Screen?


    If some reason you need to disable the graphical boot screen, you can do so, as
    root, by editing the /etc/lilo.conf file and then running LILO.


    First, as root, comment out (or delete) the line which reads message=/boot/message
