    Hat Linux Administrator’s Guide from Red Hat. To make a RAID device, you must
    first create software partitions. After you have created two or more software
    partitions, select RAID to join the software partitions into a RAID device.

    - LVM — Used to create an LVM logical volume. The role of LVM (Logical Volume
    Manager) is to present a simple view of underlying physical storage space, such
