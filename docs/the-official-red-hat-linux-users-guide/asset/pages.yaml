  md: '```

    sam@halloween sam$ cat sneakers.txt

    buy some sneakers

    then go to the coffee shop

    then buy some coffee

    bring the coffee home

    take off shoes

    put on sneakers

    make some coffee

    relax

    sam@hallow sam$

    ```


    Here are some common examples of settings that can be used with chmod:


    +   - g+w — Adds write access for the group

    - o-rwx — Removes permissions for others

    - u-x — Allows the owner to read and execute the file

    - a+rw — Allows everyone to read and write to the file

    - ug+rx — Allows the owner and group to read and execute (not write)


    By adding the -R option, you can change permissions for entire directory trees.


    Because you cannot really "execute" a directory as you would an application, when
    you add or remove execute permission for a directory, you are really allowing
    (or denying) permission to search through that directory.


    To allow every read and write access to every file in the example directory tigger,


    ```

    chmod -R a+rw tigger

    ```


    If you do not allow others to have execute permission to tigger, it will not matter
    who has read or write access: no one will be able to get into the directory unless
    they know the exact filename they want.


    For example, type


    ```

    chmod a-x tigger

    ```


    to remove everyone''s execute permissions.


    Here is what happens now when you try to cd into tigger:


    ```

    sam@halloween sam$ cd tigger

    bash: tigger: Permission denied

    sam@halloween sam$

    ```


    Next, restore your own and your group''s access.


    ```

    chmod ug+x tigger

    ```'
