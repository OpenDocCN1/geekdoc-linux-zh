- img_proc: true
  md: '# 26 Part I: Installing Red Hat Linux


    | Command | What It Does |

    | --- | --- |

    | mediacheck | Gives you the option of testing the integrity of the installation
    source (if an ISO-based method). Verifying that the ISO images are intact before
    you attempt an installation will help to avoid problems that are often encountered
    during installation. |

    | mem=xxxM | Allows you to override the amount of memory the kernel detects for
    the machine. This may be necessary for some older systems where only 16MB is detected
    and for some new machines where the video card shares the memory with the main
    memory. When executing this, xxxM should be replaced with the amount of memory
    in megabytes. |

    | nmi_watchdog=1 | Enables the built-in kernel deadlock detector. This command
    can be used to debug hard kernel lockups. By executing periodic NMI (Non Maskable
    Interrupt) interrupts, the kernel can monitor whether any CPU has locked up and
    print out debugging messages as needed. |

    | noaptic | Tells the kernel not to use the APIC chip. This command may be helpful
    for some motherboards with a bad APIC (such as the Abit BPG) or with a buggy |

    | noht | Disables hyperthreading (when available in SMP systems). |

    | nomce | Disables self-diagnosis checks performed on the CPU. The kernel enables
    self-diagnosis on the CPU by default (called Machine Check Exception). On some
    older Compaq machines, this check is run too often and may need to be disabled.
    |

    | nomount | This command disables automatic mounting of any installed Linux partitions
    in rescue mode. |

    | nopass | Disables the passing of keyboard and mouse information to stage 2 of
    the installation program. This is good for testing keyboard and mouse configuration
    strings during stage 2 of the installation program when performing a network installation
    |

    | nopcmcia | Ignores any PCMIA controllers in system. |

    | noprobe | Disables hardware detection and instead prompts the user for hardware
    information. |

    | noshell | Disables shell access on virtual console 2 during an installation.
    |

    | nousb | Disables the loading of USB support during the installation. If the
    installation program tends to hang early in the process, this command may be helpful.'
