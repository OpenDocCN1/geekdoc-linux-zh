    This directory contains information for specific drivers in use by the kernel.
    A common file found here is rtc, which provides output from the driver for the
    system''s Real Time Clock (RTC), the device that keeps time while the system is
    switched off. For more information about /usr/src/linux-2.4/Documentation/rtc.txt.


    # /proc/fs


    This directory shows which file systems are exported. If you are running an NFS
    server, you can cat /proc/fs/nfs/exports to view the file systems being shared
