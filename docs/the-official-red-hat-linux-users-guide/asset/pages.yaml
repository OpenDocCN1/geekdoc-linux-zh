    # Do I Need a Driver Disk?


    A driver disk adds support for hardware that is not otherwise supported by the
    installation program. The driver disk could be produced by Red Hat, it could be
    a disk you make yourself from found on the Internet, or it could be a disk that
    a hardware vendor includes with a piece of hardware.


    > NOTE A driver disk is different from a boot disk. If you require a boot disk
    to begin the Red Hat Linux installation, you will still need to create floppy
    and boot from it before using the driver disk. If you do not already have an installation
    boot disk and your system does not support booting from the CD-ROM, you create
    an installation boot disk. For instructions on how make a boot disk, see Chapter
    2.


    While the Red Hat installation program is loading, you may see a screen for a
    driver disk. The driver disk screen is most seen in three scenarios:


    +   * If you run the installation program in expert mode

    * If you run the installation program by entering linux dd : prompt

    * If you run the installation program on a computer that does not have any PCI
    devices


    There is no need to use a driver disk unless you need a particular device in order
    to install Red Hat Linux. Driver disks are most used for non-standard or very
    new CD-ROM drives, SCSI adapters, or NICs. These are the only devices used during
    the installation that requires drivers not on the Red Hat CD-ROMs (or boot disk,
    if you created an installation boot disk to begin the process).


    > NOTE If an unsupported device is needed to install Red Hat Linux on your system,
    continue with the installation and add support for the new piece of hardware after
    the installation is complete.


    # How Do I Obtain a Driver Disk?


    The Red Hat Linux CD-ROM #1 includes driver images (images/drvnet.img — network
    cards and images/drvblock.img — drivers for SCSI controllers) containing rarely
    used drivers. If you suspect your system may require one of these drivers, you
    should create the driver disk before beginning your Red Hat Linux installation.


    Another option for finding driver disk information is on Red Hat''s website at
    `http://www.redhat.com/support/errata`


    under the section called Bug Fixes. Occasionally, popular hardware may be available
    after a release of Red Hat Linux that will not work with drivers already in the
    installation program or including the driver disk images on the Red Hat CD-ROM
    #1. In such cases, the Red Hat website may contain a link to a current driver
    disk image.


    # Creating a Driver Disk from an Image File


    If you have a driver disk image that you need to write to a floppy disk, this
    can be done within DOS or Red Hat Linux.


    To create a driver disk from a driver disk image using Red Hat Linux:'
