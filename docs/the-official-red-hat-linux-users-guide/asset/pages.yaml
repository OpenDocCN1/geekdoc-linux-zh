- img_proc: true
  md: '# 362 Part VII: Appendices


    As with computer-related technologies, disk drives changed over time after their
    introduction. In particular, they got bigger. Not larger in physical size, but
    bigger in their capacity to store information. This additional capacity drive
    found a fundamental change in the way disk drives were used.


    # Partitions: Turning One Drive Into Many


    As disk drive capacities soared, some people began to wonder if having all of
    that formatted space in one big chunk was a great idea. This line of thinking
    was driven by several issues, some philosophical, some technical. On the philosophical
    side, above a certain size, it seemed that the additional space provided by a
    larger drive created more clutter. On the technical side, some file systems were
    never designed to support anything above a certain capacity. Even if the file
    system could support larger drives with a greater capacity, the overhead by the
    file system to track files could become excessive.


    The solution to this problem was to divide disks into partitions. Each partition
    can be accessed as if it were a separate disk. This is done through the addition
    of a partition table.


    > NOTE While the diagrams in this chapter show the partition table as being separate
    from the actual disk drive, this is not entirely accurate. In reality, the partition
    table is stored at the very start of the disk, before any file system or user
    data. For clarity, we keep it separate in the diagrams for this chapter.


    ![](img/70f8904e8a1105c5df33b26207132b97_389_0.png)


    Figure D-5. Disk Drive with Partition Table


    As Figure D-5 shows, the partition table is divided into four sections. Each section
    can hold the information necessary to define a single partition, meaning that
    this particular partition table can define no more than four partitions.


    Each partition table entry contains several important characteristics of the partition:


    +   * The points on the disk where the partition starts and ends — The starting
    and ending points define the partition''s size and location on the disk.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# Appendix D: An Introduction to Disk Partitions


    +   * Whether the partition is active — The "active" flag is used by some operating
    systems'' boot loaders. In other words, the operating system in the partition
    that is marked "active" is the partition that will be booted by default.


    +   * The partition''s type — The partition type can be a bit confusing. The type
    is a number that identifies the partition''s anticipated usage. If that statement
    says a bit vague, that is because the meaning of the partition type is a bit vague.
    Some operating systems use the partition type to denote a specific file system,
    to flag the partition as being associated with a particular operating system,
    to indicate that the partition contains a bootable operating system, or some combination
    of the three. Table D-1 contains a listing of some popular (and obscure) partition
    types along with their corresponding numerical values.


