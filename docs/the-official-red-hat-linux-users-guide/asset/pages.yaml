    are unencrypted and provide no security from network sniffing. Allowing incoming
    Telnet access is not recommended. If you want to allow inbound Telnet access,
    you will need to install the telnet-server package.


    +   - WWW (HTTP) — The HTTP protocol is used by Apache (and other Web servers)
    to serve Web pages. If you plan on making your Web server available, enable this
    option. Option is not required for viewing pages locally or for developing Web
    pages. You will need to install the httpd package if you want to serve Web pages.


    > Note Enabling WWW (HTTP) will not open a port for HTTPS. To enable HTTPS, specify
    it in the Other fields field.


    +   - Mail (SMTP) — If you want to allow incoming mail delivery directly through
    your firewall this option. You do not need to enable this if you collect your
    mail from your ISP''s server using POP3 or IMAP, or if you use a tool fetchmail.
    Note that an improperly configured SMTP server can allow remote machines to use
    your server to send spam (spam is a term for unsolicited email).


    +   - FTP — The FTP protocol is used to transfer files between machines on a network.
    If you want to enable this option. You will need to install the wftpdpd (and possibly
    the anftp) package for this option to be useful.


    +   - Other ports — You can allow access to ports that are not listed by listing
    them in this field. Use the following format: port:protocol. For example, if you
    want to allow IMAP access through your firewall, you can specify imap:tcp. You
    can also explicitly specify numeric ports, to allow UDP packets on port 1234 through
    the firewall, either 1234:udp. To specify multiple ports, separate with commas.


    > TIP To change your security level after you have completed the installation,
    click the Main Menu and select System Settings -> Security Level (or type the
    redhat-configsecuritylevel command from a prompt) to launch the Security Level
    Configuration tool. If you are not logged in root, Linux will prompt you for the
    root password to continue.


