  md: '# Appendix E: The X Window System 383 Fonts


    Red Hat Linux uses xfs (X Font Server) to provide fonts to the XFree86 server
    and the X

    client applications that connect to it. While it is possible not to use xfs and
    place the paths to

    directories in your XF86 Config file, xfs has several advantages:


    +   * It is easy to add and remove fonts, including editing the font path. The
    font path is a

    collection of paths in the file system where fonts are stored. The xfs service
    keeps thenfont path out of the XFree86 configuration files, making it easier to
    edit.


    +   * Fonts may be stored on one machine acting as a networked font server and
    can be

    shared among multiple X servers over the network. A common set of fonts can be

    maintained in one place and easily shared between all users.


    +   * More types of fonts are supported. xfs can handle TrueType, Type1, and bitmap
    fonts.


    The XFree86 configuration files know whether to use xfs or hard-coded font paths
    because

    of the FontPath setting in their Files sections. By default, the FontPath is

    :/7100. This allows the XFree86 server to connect to port 7100 using an inner-machine

    communication link. The xfs server listens on this port and respond with information

    queried by XFree86 server.


    The xfs service must run when X is started. If it is not, you will be returned
    to a

    command prompt with an error similar to the following:


    ```

    failed to set default font path ''unix'':/7100

    ```


    Check if xfs is running using the ps aux | grep xfs command. By default, xfs is

    set to start in runlevels 2, 3, 4, and 5, covering all runlevels where you would
    run X. If xfs is

    running on your system, you can start it using the /usr/sbin/ntsysv, serviceconf,
    or /sbin/chkconfig utilities to

    command to force it to the correct runlevels. For more configuring services for
    a particular

    level, see the Official Red Hat Linux Administrator''s Guide.


    # xfs Configuration


    The /etc/rc.d/init.d/ xfs script starts the xfs server. Several options can be

    configured in the /etc/X11/xfs config file:


    +   * alternate-servers — Sets a list of alternate font servers to be used if
    this font server

    is not available. A comma must separate every font server in the list.


    +   * catalogue — An ordered list of font paths to contain that the font files.
    Comma

    must follow every font path before a new font path can be started in the list.
    You can use

    the string :unescaled immediately after the font path to make the unscaled fonts
    in that

    path load first. Then, you can specify the entire path again, so that other scaled
    fonts will

    be loaded.


    +   * client-limit — Sets the number of clients this font server will serve before

    refusing to handle any more. The default is 10.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '+   - clone-xfs — Decides if the server will clone a new version of itself
    when the client limit is hit. By default, this option is on. Set it to off to
    disable this feature.


    +   - default-point-size — Sets the default point size for any font that does
    not specify this value. The value for this option is in decoints. The default
    of 120 corresponds to 12 points.


    +   - default-resolutions — Specifies a list of resolutions supported by the XFree86
    server. Each resolution in the list must be separated by a comma.


    +   - defglyphs — Tells xfs whether to delay the loading of glyphs, which is an
    image used to visually represent a font. You can disable this feature (none),
    enable it for all fonts (all), or turn off this feature only for 16-bit fonts
    (16), which are largely used by Asian languages.


    +   - error-file — Allows you to specify the path and file name of a location
    where errors can be logged.


    +   - no-listen — Tells xfs not to listen using a protocol. By default, this option
    is set to tcp to prevent xfs from listening on TCP ports, primarily for security
    reasons. If you plan on using xfs to serve fonts to networked workstations on
    a LAN, you need to remove this line.


    +   - port — Specifies the TCP port that xfs will listen if no-listen does not
    exist or is commented out.


    +   - usesyslog — Tells xfs to use the system error log if set on.


    # # Adding Fonts


    When using xfs, adding fonts to your system is rather straightforward. Use the
    `chkfontpath --list` command to see the font paths currently configured on your
    system. To add new fonts to a new directory, follow these instructions as the
    root user:


    +   1. Create a font directory, such as /usr/share/fonts and place the fonts inside
    that directory. Be sure to set the permissions correctly; it is only necessary
    that the files can be read; no other permissions are necessary.


    +   2. Type the chkfontpath --add font-directory-path command, where the font-directory-path
    is the full path to the directory holding the fonts. This will add this font path
    to your xfs configuration.


    > NOTE You must have a fonts.dir file in your new directory for the chkfontpath
    command to work correctly. The creation of the fonts.dir file, as well as any
    other files used by xfs is beyond you. Many font collections available for Linux
    include these fonts, so it may not be necessary to create them by hand.


    +   3. Restart xfs using the /sbin/service xfs restart command. You will also
    need to restart your X session.


    +   4. Typing the chkfontpath --list command will show the new font path. Any
    fonts you added will be available for use.'
