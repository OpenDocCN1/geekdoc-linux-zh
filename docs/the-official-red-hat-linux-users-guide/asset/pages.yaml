  md: '# Upgrading Your File System


    ![](img/70f8904e8a1105c5df33b26207132b97_99_0.png)


    > NOTE This section only pertains to users performing an upgrade from Red Hat
    Linux version 7.1 or earlier or from a Red Hat Linux 7.2 or 7.3 installation where
    ext2 was chosen as the file system.


    If the installation program detects the ext2 file system on your Red Hat Linux
    system, you choose to retain your current ext2 file system or migrate to the ext3
    file system.


    TIP Unless you have a good reason not to migrate, to the ext3 file system.


    The following list describes the ext2 and ext3 file systems and how they can be
    utilized:


    +   * ext2 — An ext2 file system supports Unix file types (regular files, directories,
    symbolic links, etc) and provides the ability to assign long file names (up to
    255 characters). Versions prior to Red Hat Linux 8.0 used ext2 file systems by
    default.

    * ext3 — The ext3 file system is based on the ext2 file system and has one main
    advantage over ext2 — journaling. A journaling file system reduces time spent
    recovering a file system after a crash because there is no need to fsck the file
    system.


    NOTE If you choose to migrate to the ext3 file system, your existing system data
    will not be modified.'
