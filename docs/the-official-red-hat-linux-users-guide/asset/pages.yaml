  md: "# Chapter 8\n\n# Shell Prompt Basics\n\nThe shell prompt (also known as the\
    \ command line interface, CLI) is a text-only interface to your Red Hat system.\
    \ Just about any administration task (such as managing files, users, and groups)\
    \ can be performed from the shell prompt.\n\n> NOTE By default, Red Hat Linux\
    \ uses the bash prompt, although you can change to another shell if you prefer\
    \ typing the name of the shell at the command prompt.\n\nThis chapter shows the\
    \ basics of how to interact with Red Hat Linux from a shell prompt.\n\n# Why Use\
    \ a Shell Prompt?\n\nGraphical environments for Linux have come a long way in\
    \ the past few years. You can be perfectly productive in the X Window System and\
    \ only have to open a shell prompt to complete a few tasks. However, many Red\
    \ Hat Linux functions can be completed faster than the shell prompt than from\
    \ a GUI. In less time than it might take you to open a file manager, locate a\
    \ directory, and then create, delete, or modify files from a GUI, you could have\
    \ finished your work with just a few commands\n\n```\nFile Edit View Terminal\
    \ Help\n[sam@Halloween ~]$ cd ..\n[sam@Halloween ~]$ cd ..\n[sam@Halloween /]$\
    \ \n```\n\nFigure 8-1. A Shell Prompt"
  merge: -1
  pgno: 170
- img_proc: true
  md: 'A shell prompt looks similar to other command-line interfaces you might be
    familiar with, such as MS-DOS. When you enter commands at a shell prompt, the
    shell interprets these commands and then tells the Linux operating system (OS)
    what to do. Experienced users can write shell scripts to expand their capabilities
    even further.


    The following sections explain how to navigate, manipulate files, perform simple
    administration tasks, and other shell prompt basics.


    # Determining Your Current Directory with pwd


    Once you start looking through directories, it is easy to get lost or forget the
    name of your current directory. By default, the bash shell shows only your current
    directory, not the entire path.


    ```

    File Edit View Terminal Go Help

    [sam@Halloween sam]$ pwd

    /home/sam

    [sam@Halloween sam]$

    ```


    Figure 8-2. The pwd Command Shows Where You Are


    To determine the exact location of your current directory within the file system,
    go to a shell prompt, type the command *pwd*, and press Enter.


    You should see something like:


    > /home/sam


    This tells you that you are in the user''s directory, which is located in the
    /home directory.


    The pwd command stands for *print working directory*. When you enter the *pwd*
    command, you''re basically asking Linux to display your current location within
    the file system. Linux responds by printing the name of the current directory
    at the shell prompt, also known as the standard output.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Chapter 8: Shell Prompt Basics 145


    You will find that using pwd is very helpful as you learn to navigate Red Hat
    Linux.


    # Changing Directories with cd


    Changing directories is easy as long as you know your current directory and that
    location relates to where you want to go.


    To change directories, use the cd command. Typing this command by itself will
    always return you to your home directory; moving to any other directory requires
    a pathname.


    You can use absolute or relative pathnames. Absolute paths start at the top with
    / (referred to the root directory) and then look down the file system from there
    for the requested directory; relative paths look in your current directory and
    then down from there. The following directory tree illustrates how cd operates.


    ```

    /n/directory1

    /directory1/directory2

    /directory1/directory2/directory2

    ```


    If you are currently in directory3 and you want to switch to directory1, you need
    to move up in your directory tree.


    Executing the command


    ```

    cd directory1

    ```


    while you are in directory3 will thus present you with an error message explaining
    that there is no such directory. This is because there is no directory1 within
    directory3.


    To move up directory1 you''ll have to type the absolute pathname, as follows:


    ```

    cd /directory1

    ```


    This is an example of an absolute path; it tells Linux to start at the top (/)
    and look down until it finds directory1. A path is absolute if the first character
    is a /. Otherwise, it is a relative path.


    Absolute paths will take you to any directory from any directory. Relative paths
    will only take you to directories below your current one.


    Use the following exercise to test what you have learned so far regarding absolute
    and relative paths.


    From your home directory, type the relative path:


    ```

    cd ../../etc/x11

    ```


    After using the full command in the example, you should be in the directory x11,
    which is where you will find configuration files and directories related to the
    X Window System.


    Take a look at your last cd command. You told your system to:'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Part II: The Basics


    +   1. Go up one level to your login directory''s parent directory (probably /home).

    2. Then go up to that directory''s parent (which is the root, or /, directory).

    3. Then go down to the etc directory.

    4. Finally, go to the X11 directory.


    Conversely, using an absolute path would get you to the /etc/X11 directory more
    quickly.

    Example:


    ```

    cd /etc/X11

    ```


    > NOTE Always make sure you know which working directory you are in before you
    state the relative path to the directory or file you want to. You do not have
    to worry about your position in the file system, though, when you state the absolute
    path to another directory or file. If you are not sure, type pwd and your current
    working directory will be displayed.


    Absolute paths start from the root directory (/) and move down to the directory
    you specify.


    # Table 8-1: cd Options


    | Command | Function |

    |---|---|

    | cd | Returns you to your home directory. |

    | cd ~ | Also returns you to your home directory |

    | cd / | Takes you to the system''s root directory. |

    | cd /root | Takes you to the home directory of the root, or superuser, account
    created at installation; you must be the root user to access this directory. |

    | cd /home | Takes you to the home directory, where user login directories are
    usually stored. |

    | cd .. | Moves up one directory. |

    | cd -otheruser | Takes you to otheruser''s login directory, if otheruser has
    granted you permission to do so. |

    | cd /dir/subdir | Regardless of which directory you are in, this absolute path
    would take you straight to subdir, a subdirectory of dir1. |

    | cd ../dir3/X11 | This relative path would take you two directories to the root
    directory, then to dir3, then to the X11 directory. |


    Now that you are starting to understand how to change directories, see what happens
    when you change to root''s login directory (the superuser account). Type:


    ```

    cd /root

    ```'
  merge: -1
