- img_proc: true
  md: '# 160 Part II: The Basics


    For example, if you forget the command updateddb, but remember a portion of the
    command, you can su to root and then type up at the shell prompt, the Tab key
    twice, and you will see a list of possible completions including updateddb. By
    typing the partial command and pressing Tab again, your command is completed for
    you.


    # Using Multiple Commands


    Linux allows you to enter multiple commands at one time. The only requirement
    is that you separate the commands with the semicolon.


    Want to see how long you have been online and open your Web browser at the same
    time? Just combine the date command with Mozilla''s command.


    ```

    date; mozilla; date

    ```


    Remember that commands are case sensitive, so the command to start Mozilla must
    be in lowercase to start the browser.


    ```

    [sam@halloween sam]$date; mozilla; date

    Mon Feb 7 13:26:27 EST 2000

    Mon Feb 7 14:28:32 EST 2000

    [sam@halloween sam]$

    ```


    Running the combination of commands prints out the time and date, starts Mozilla,
    and then prints the time and date again after you close Mozilla. The discrepancy
    between the two results from the date command shows that you were using Mozilla
    for just over an hour.


    # Ownership and Permissions


    Earlier in this chapter, when you tried to cd to root''s login directory, you
    received the following message:


    ```

    [sam@halloween sam]$cd /root

    bash: /root: Permission denied

    [sam@halloween sam]$

    ```


    That was one demonstration of Linux''s security features. Linux, like UNIX, is
    a multiuser system, and file permissions are one way the system protects against
    accidental or malicious tampering.


    One way to gain entry when you are denied permission is to su to root, as you
    have learned earlier. This is because whoever knows the root password has complete
    access to the system.


    ```

    [sam@halloween sam]$su

    Password: your_root_password

    [root@localhost sam]#cd /root

    [root@localhost/root]#

    ```


    But switching to the root user is not always convenient or recommended, because
    it is easy to make mistakes and alter important configuration files as root.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Chapter 8: Shell Prompt Basics 161


    All files and directories are "owned" by the person who created them. If, for
    example, you created the file sneakers.txt in your login directory, sneakers.txt
    belongs to you.


    That means you can specify who is allowed to read the file, write to the file,
    or (if it is an application instead of a text file) can execute the file.


    Writing, reading, and executing are the three main settings in permissions. Because
    users are placed into a group when their accounts are created, you can also specify
    whether certain groups can read to, or execute a file.


    Take a closer look at sneakers.txt using the ls -1 (long) option in Figure 8-8.


    ```

    sam@halloween sam]$ls -1 sneakers.txt

    -rw-rw-r--  1 sam sam      150 Mar 19 08:08 sneakers.txt

    sam@halloween sam]$chmod o+w sneakers.txt

    sam@halloween sam]$ls -1 sneakers.txt

    -rw-rw-r--  1 sam sam       66 Aug 16 14:21 sneakers.txt

    sam@halloween sam]$

    ```


    There is a lot of detail provided here. You can see who can read (r) and write
    to (w) the file, as well as who created the file (sam), and to which group the
    owner belongs (sam). Remember that, by default, the name of your group is same
    as your login name.


    Figure 8-8. Permissions for sneakers.txt


    Other information to the right of the group includes file size, date and time
    of file creation, and file name. The first column shows current permissions; it
    has ten slots. The first slot represents the type of file. The remaining nine
    slots are actually three sets of permissions for different categories of users.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# 162 Part II: The Basics


    Those three sets are: the owner of the file, the group in which the file belongs,
    and "others", meaning users and groups not yet specified.


    | (rw-) | (rw-) | (r--) | 1 sam sam |

    | --- | --- | --- | --- |

    | owner | group | others |


    The first item, which specifies the file type, can show one of the following:


    +   - d — A directory

    - (dash) — A regular file (rather than directory or link)

    - 1 — A symbolic link to another program or file elsewhere on the system


    Beyond the first item, in the following three sets, you will see one of the following:


    +   - r — File can be read

    - w — File can be written to

    - x — File can be executed (if it is a program)


    When you see a sam as owner and group, or others, it means that particular permission
    has not been granted. Look again at the first column of sneakers.txt and identify
    its permissions.


    ```

    [sam@halloween sam]$ -1 sneakers.txt

    -rw-rw-r-- 1 sam sam 150 Mar 19 08:08 sneakers.txt

    [sam@halloween sam]$

    ```


    The file''s owner (in this case, sam) has permission to read and write to the
    file. The group, also called sam, sam) has permission to read and write to sneakers.txt
    as well. It is not a program, so neither the owner or the group has permission
    to execute it because it simply cannot be executed. No one in the sam group can
    only read the file. They cannot write to it or execute.


    # The chmod Command


    Use the chmod command to change permissions easily. This example shows how to
    change the permissions on sneakers.txt with the chmod command.


    The original file looks like this, with its initial permissions:


    ```

    -rw-rw-r-- 1 sam sam 150 Mar 19 08:08 sneakers.txt

    ```


    If you are the owner of the file or are logged into the root account (rw-), you
    can change any permissions for the owner, group, and others.


    Right now, the owner and group can read and write to the file (rw-). Anyone outside
    of the group can only read the file (r--).'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Chapter 8: Shell Prompt Basics 163


    > CAUTION Remember that file permissions are a security feature. Whenever you
    allow anyone else to read, write to, and execute files, you are increasing the
    risk of files being tampered with, altered, or deleted. As a rule, you should
    only grant read and write permissions to those who truly need them.


    In the following example, you may allow everyone to write to the file, so they
    can read it, write notes in it, and save it. It means you will have to change
    the "others" section of the file permissions.


    Take a look at the file first. At the shell prompt, type:


    ```

    ls -l sneakers.txt

    ```


    The command displays this file information:


    ```

    -rw-rw-rw- 1 sam sam 150 Mar 19 08:08 sneakers.txt

    ```


    Now, type the following:


    ```

    chmod o+w sneakers.txt

    ```


    The chmod o+w command tells the system you want to give others write permission
    to the sneakers.txt. To check the results, list the file''s details again. Now,
    the file looks like this:


    ```

    -rw-rw-rw- 1 sam sam 150 Mar 19 08:08 sneakers.txt

    ```


    Now, everyone can read and write to the file.


    ![](img/70f8904e8a1105c5df33b26207132b97_190_0.png)


    Figure 8-9. Changing Permissions for sneakers.txt'
