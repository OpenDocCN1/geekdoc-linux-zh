    settings) that are not explicitly defined by you. By default, only the following
    connections are allowed:


    +   - DNS replies

    - DHCP (so that any network interfaces use that DHCP can be properly configured)


    If you choose High, your firewall will not allow the following:


    +   - Active mode FTP (passive mode FTP, used by default in most clients, should
    still work)

    - IRC DCC file transfers

    - RealAudio

    - Remote X Window System clients'
