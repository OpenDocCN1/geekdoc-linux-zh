  md: '# Partition Naming Scheme


    Linux refers to partitions using a combination of letters and numbers. This naming
    scheme can be confusing, particularly if you are used to the "C drive" way of
    referring to hard disks and their partitions. In the MS-DOS/Windows world, partitions
    are named using the following method:


    +   1. Each partition''s type is checked to determine if it can be read by DOS/Windows.

    2. If the partition''s type is compatible, it is assigned a drive letter. The
    drive letters start at C (A and B are reserved for floppy drives) and move on
    to the following letters, depending on the number of partitions to be labeled.
    The drive letter can then be used to refer to that partition as well as the file
    system contained on that partition.


    Red Linux uses a naming scheme that is more flexible and conveys more information
    than the approach used by other operating systems. The naming scheme is file-based,
    with filenames in the following format:


    ```

    /dev/xxN

    ```


    Here is how to decipher the partition naming scheme:


    +   * /dev/ — This string is the name of the directory in which all devices reside.
    Partitions reside on hard disk and hard disks are devices, the files representing
    all partitions reside in /dev/.

    * xx — The first two letters of the partition name indicate the type of device
    on which the partition resides. You normally see either ha (for IDE disks) or
    sd (for SCSI disks).

    * y — This letter indicates which device the partition is. For example, /dev/sda
    (the first hard disk) or /dev/bdb (the second disk).

    * N — The final number denotes the partition. The first four (primary or extended)
    partitions are numbered 1 through 4. So, for example, /dev/hda3 is the third primary
    or extended on the first hard disk and /dev/sdb6 is the second logical partition
    on the second SCSI hard disk.


    > NOTE There is no part of this naming convention that is on partition type; unlike
    DOS/Windows, all partitions can be identified under Red Hat Linux. Of course,
    this does not mean that Red Hat Linux can access data on every type of partition,
    but in many cases it is possible to access data on a partition dedicated to another
    operating system.


    Keep this information in mind; it will make things easier to understand when you
    are up the partitions Red Hat Linux requires.


    # Disk Partitions and Other Operating Systems


    If your Red Linux partitions will be sharing a hard disk with partitions used
    by other operating systems, most of the time you will have no problems. However,
    there are certain combinations of Linux and other operating systems that require
    extra care. See Appendix C for information on creating partitions compatible with
    other operating systems.'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# Part VII: Appendices


    # Disk Partitions and Mount Points


    One that many people know to Linux find confusing is the matter of how partitions
    are

    used and accessed by the Linux operating system. In Windows or MS-DOS, the naming

    scheme is relatively simple: each partition gets a drive letter. You then use
    the correct drive

    letter to refer to files and directories in its corresponding partition.


    This is entirely different from how Linux deals with partitions and, for that
    matter, with disk

    storage in general. The main difference is that each partition is used to form
    part of the storage

    necessary to support a single set of files and directories. This is done by associating
    a partition

    with a directory through a process as mounting. Mounting a partition makes it
    storage

    available at the specified directory (known as a mount point).


    For example, if /dev/hda5 were mounted on /usr, that would mean that all files\and
    directories under /usr would physically reside on /dev/hda5. So the file

    /usr/share/doc/FAQ/txt/Linux-FAQ would be stored on /dev/hda, while the file

    /etc/x11/gdm/Sessions/Gnome would not.


    Continuing our example, it is also possible that one or more directories below
    /usr would

    mount points for other partitions. For instance, a partition (say, /dev/hda?)
    could be mounted

    on /usr/local, meaning that /usr/local/man/whatis then reside on /dev/hda7

    rather than /dev/hda5.


    # How Many Partitions to Create?


    When preparing to install Red Hat Linux, you will need to give some consideration
    to the

    number and size of the partitions to be used by your new operating system. The
    question of

    "how many partitions" continues to spark debate within the Linux community, and
    without

    any end to the debate in sight, it is safe to say that there are probably as many
    partition layouts

    as there are people debating the issue.


    Keeping this in mind, we recommend that you should create at least the following
    partitions:


    +   * A swap partition — Swap partitions are used to support virtual memory. In
    other words,

    data is written to swap when there is not enough RAM to hold the data your system
    is

    processing. You must create a swap partition to correctly use Red Hat Linux.

    minimum size of your swap partition should be twice the amount of your

    computer''s RAM or 32MB, whichever is larger, up to 1GB. A swap partition of over

    1GB is typically not necessary.


    +   * A /boot partition — The partition mounted on /boot contains the operating
    system

    kernel (which allows your system to boot Red Hat Linux), along with a few other
    files

    used during the boot process.


    > CAUTION Make sure you read the next section — the information that applies to
    the /boot: partition.'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# Appendix D: Introduction to Disk Partitions 373


    Due to the limitations of most PC BIOSes, creating a small partition to hold these
    files is a good idea. For most users, a 32MB boot partition is sufficient.


    +   - A root partition (/) — The root partition is where (the root directory)
    resides. In this partitioning layout, all files (except those stored in /boot)
    reside on the root partition. Because of this, it is in your best interest to
    maximize the size of your root partition. For example, a 1.2GB root partition
    may permit the equivalent of a workstation installation (with very free space),
    while a 3.4GB root partition may let you install every package. Obviously, the
    more space you can give the root partition, the better.


    Specific recommendations concerning the proper size for various Red Hat partitions
    can be found in Chapter 1.


    # One Last Wrinkle: Using GRUB or LILO


    GRUB and LILO are the most common boot loaders for Red Hat Linux on x86-based
    systems. As operating systems, they operate outside of any operating system, using
    the Basic I/O System (or BIOS) built into the computer hardware itself. This section
    describes GRUB and LILO''s interactions with PC BIOSes and is specific to x86-compatible
    computers.


    GRUB and LILO are subject to some limitations imposed by the BIOS in x86-based
    computers. Specifically, some BIOSes cannot access more than two hard drives,
    and cannot access any data stored beyond cylinder 1023 of any drive. Note that
    some recent BIOSes have these limitations, but this is by no means universal.


    All the data /boot directory (including the Linux kernel) is located in the /boot
    partition. If you follow the partition layout recommended above or if you are
    performing a workstation or server install, the /boot directory will be in a small,
    separate partition. Otherwise, it may reside in the root partition (/). In either
    case, the partition in /boot resides conform to the following guidelines if you
    are going to use GRUB or LILO to boot your Red Hat Linux system:


    > Note Disk Druid, as well as automatic partitioning, takes these BIOS-related
    limitations into account.


    +   - On the first two IDE drives — If you have two IDE (or EIDE) drives


    +   - On the first IDE or first SCSI drive — If you have one IDE (or EIDE) drive
    and one or more SCSI drives /boot must be located either on the IDE or the SCSI
    drive at ID 0. No other SCSI drives will work.


    +   - On the two SCSI drives — If you have only SCSI drives, /boot must be located
    at an ID 0 or ID 1. No other SCSI drives will work.'
  merge: -1
