- img_proc: true
  md: '+   On a partition that''s completely below cylinder 1023 — No matter which
    of the above configurations apply, the partition that holds /boot/ must be located
    entirely below cylinder 1023. If the partition holding /boot/ straddles cylinder
    1023, you may face a situation where GRUB and LILO will work initially (because
    all the necessary information is below cylinder 1023) but will fail if a new kernel
    is to be loaded and that kernel resides above cylinder 1023.


    As mentioned earlier, it is possible that some of newer BIOS may permit GRUB and
    LILO to work with configurations that do not meet these guidelines. Likewise,
    some of GRUB and LILO''s more esoteric features may be used to get a Linux system
    started, even if the configuration does not meet our guidelines. However, due
    to the number of variables involved, Red Hat does not support such efforts.'
