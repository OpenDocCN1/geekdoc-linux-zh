- img_proc: true
  md: '# Chapter 1

    Installation Options and System Requirements


    Before installing Red Hat Linux on your system, you first need to make sure that
    your hardware is compatible with Linux. This chapter provides instructions for
    learning about your hardware and details the requirements for your hardware depending
    on the installation type you choose when you install Red Hat Linux.


    > NOTE See Chapter 2 for instructions on how to install Red Hat Linux.


    Although this chapter reflects the most current information possible, you should
    read the Red Hat Linux Release Notes for information that may not have been available
    prior to the documentation being finalized. The Release Notes can be found on
    the Red Hat Linux CD #1 and online at:


    ```

    http://www.redhat.com/docs/manuals/linux

    ```


    # Do You Have the Right Red Hat Linux Components?


    If you have purchased this new book, you have the Red Hat Linux distribution on
    the accompanying CD-ROMs. If not, you can download Red Hat Linux by visiting http://www.redhat.com
    and clicking the Download link in the upper-right corner of the screen.


    # Is Your Hardware Compatible?


    Hardware compatibility is particularly important if you have an older system or
    a system that you built yourself. Red Hat Linux 8.0 is compatible with most hardware
    in systems that were factory built within the last two years. However, hardware
    specifications change almost daily, so it is difficult to guarantee that your
    hardware will be 100 percent compatible.


    The most recent list of supported hardware can be found online at:


    ```

    http://hardware.redhat.com/hcl/

    ```'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Learning About Your Hardware with Windows


    If your computer is running Windows, you can find information about your hardware
    using the Device Manager. The Device Manager''s location differs depending on
    the version of Windows you are running. The following sections describe how to
    find your hardware information in the two main versions of Windows: Windows 95/98/Me
    (these DOS-based versions of Windows are often collectively referred to as Windows
    9x) and Windows NT/2000/XP.


    # Finding your hardware information in Windows 9x


    If your computer is already running one of the versions of Windows 9x, you can
    use the following steps to get additional configuration information:


    ![](img/70f8904e8a1105c5df33b26207132b97_31_0.png)


    Figure 1-1. Windows 9x System Properties


    +   1. In Windows, click the My Computer icon using the secondary (normally the
    right) mouse button. A pop-up menu should appear.

    2. Select Properties. The System Properties window should appear. Note the information
    listed under Computer — in particular the amount of RAM listed.

    3. Click on the Device Manager tab. You will then see a graphical representation
    of your computer''s hardware configuration.'
  merge: -1
  pgno: 31
- img_proc: true
  md: "# Chapter 1: Installation Options and System Requirements\n\n![](img/70f8904e8a1105c5df33b26207132b97_32_0.png)\n\
    \nFigure 1-2. Windows 9x Device Manager\n\n+   4. At this point, you can either\
    \ double-click on the icons or single-click on the plus (+) to look at each entry\
    \ in more detail. Look under the following icons for more information:\n    *\
    \ **Disk drives** — The type (IDE or SCSI) of hard drive will be found here. IDE\
    \ drives will normally include the word \"IDE,\" while SCSI drives will not.\n\
    \    * **Hard disk controllers** — Information about your hard drive controller.\n\
    \    * **CD-ROM** — Information about any CD-ROM connects to your computer.\n\n\
    > NOTE In some cases, there may be no CD-ROM icon, yet your computer has a functioning\
    \ CD-ROM drive. In this case, it is normal, depending on how Windows was originally\
    \ installed. In this case, you may be able to learn additional information by\
    \ looking at the CD-ROM driver loaded in your computer's config.sys file.\n\n\
    +   * **Mouse** — The type of mouse present on your computer.\n    * **Display\
    \ adapters** — If you are interested in running the X Window System, you should\
    \ write down the information you find here.\n    * **Sound, video, and game controllers**\
    \ — If your computer has sound capabilities you will find more information about\
    \ them here."
