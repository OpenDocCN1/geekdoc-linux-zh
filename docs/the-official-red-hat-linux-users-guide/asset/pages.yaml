    # Changing Window or Desktop Colors


    Just like a pattern, pattern changing a color is easy. To do so, from the Nautilus
    window choose Edit -> Backgrounds and Emblems and then click the Colors button
    at left. Then you can click the desired color and while holding the mouse button
