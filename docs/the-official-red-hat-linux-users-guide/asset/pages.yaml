  md: '# Part II: The Basics


    ![](img/70f8904e8a1105c5df33b26207132b97_139_0.png)


    Figure 6-9. Creating a New Folder


    # Deleting Files with the Trash Icon


    The Trash icon on your Red Hat Linux desktop is one of the most obvious methods
    of deleting files. If you want to delete a file on your desktop or from a window
    onscreen, click on the file and drag it onto the Trash icon and release the mouse
    button. When the Trash has something in it, you will see its icon change from
    being empty (see Figure 6-1) to being full of paper.


    ![](img/70f8904e8a1105c5df33b26207132b97_139_1.png)


    Figure 6-10. A Full Trash Can


    > TIP Every time you right-click a file in the Red Hat Linux interface (such as
    as in the Nautilus file manager), there will be a Move to Trash item on the menu
    that appears. You can choose this menu item to instantly move the file to the
    Trash.


    # Recovering Files from the Trash


    The nice thing about the Trash is that you have a chance to salvage the file —
    just like you could take a piece of paper out of a trash can after throwing it
    away. To recover a file you have thrown in the Trash, double-click the Trash icon
    on your desktop, find the file you want to recover, and drag it out of your desktop
    or wherever else you want to put it.


    > CAUTION Keep in mind that you cannot recover a file from the Trash after you
    have emptied the trash or deleted the file from the Trash (as discussed in the
    next section).'
  merge: -1
