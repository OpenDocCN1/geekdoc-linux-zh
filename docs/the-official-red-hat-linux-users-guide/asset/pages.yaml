  md: '# Appendix E: The X Window System 377


    file, /etc/X11/X86Config, before they can be used. The video drivers are located
    in the /usr/X11R6/lib/modules/drivers/ directory. The DRI hardware accelerated
    3-D drivers are located at the /usr/X11R6/lib/modules/dri/ directory.


    # XFree86 Server Configuration Files


    The XFree86 server configuration files are stored in the /etc/X11/ directory.
    The XFree86 version 4 user uses /etc/X11/X86Config. When Red Hat Linux is installed,
    the configuration files for XFree86 are created using information gathered during
    the installation process.


    While there is rarely a manual to edit these files, it is useful to know about
    the various sections and optional parameters found within.


    Each section begins with a SectionName line and ends with an EndSection. Within
    each of the sections, you will find several lines containing an option name and
    at least one option value, occasionally in quotes. The following sections explore
    the most useful sections of XFree86 version 4 file and the roles of popular settings.


    To review the configuration of your XFree86 server, type the xset -q command.
    This provides you with information about the keyboard, pointer, screen saver,
    and font paths.


    > NOTE For information, refer to the x86Config man page.


    # Device


    This section specifies information about the video card used by the system. You
    must have at least one Device section in your configuration file. You may have
    multiple Device sections in the case of multiple video cards or multiple settings
    that can run a single card. The following options are either required or widely
    used:


    +   * **BusID**: Specifies the bus location of the video card. This option is
    only necessary for systems with multiple cards and must be set so that the Device
    section will use the proper settings for the correct card.

    * **Driver**: Tells XFree86 which driver to load in order to use the video card.

    * **Identifier**: Provides a name for this video card. Usually, this name is set
    to the exact name of the video card used in the Device section.

    * **Screen**: An optional setting used when a video card has more than one head,
    or connector, to go out to a separate monitor. If you have multiple monitors connected
    to one card, Device sections must exist for each of them with a different Screen
    for each Device section. The value accepted by this option is a number starting
    at 0 and increasing by one for each head on the video card.

    * **VideoRam**: The amount of RAM available on the video card in kilobytes. This
    is not normally necessary because the XFree86 server usually probe the video card
    to autodetect the amount of video RAM. But because some video cards XFree86 cannot
    correctly autodetect, this option allows you to specify the amount of video RAM.


    ![](img/70f8904e8a1105c5df33b26207132b97_404_0.png)'
  merge: -1
