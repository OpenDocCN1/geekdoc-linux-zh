  md: '# # Appendix F


    # # About the CD-ROMs


    The two CD-ROMs that accompany this book contain the Publisher''s Edition of Red
    Hat Linux 8.0.


    To use the CD-ROMs to install Red Hat Linux, follow these steps:


    +   1. Insert CD-ROM #1 into your computer''s CD-ROM drive.


    +   2. Boot (or reboot) your computer, making sure that your BIOS is set to boot
    from CD-ROM. The Red Hat installation Welcome screen appears.


    > NOTE If you can''t boot from the CD-ROM, you''ll need to create a boot diskette.
    See Chapter 2 for information on creating a boot disk.


    +   3. See Chapter 2 for full instructions on installing Red Hat Linux.


    # # System Requirements


    Make sure your computer meets the minimum system requirements listed in Chapter
    1. If your computer does not meet these requirements, you may not be able to install
    Red Hat Linux from these CD-ROMs.


    # # Need Help?


    If you have difficulty installing or using any of the materials on the companion
    CD-ROMs, consult the detailed installation and troubleshooting instructions in
    Part I.


    If you still have trouble with the CD, please call the Customer Care phone number:
    (800) 762-2974. Outside the United States, call (317) 572-3994. You can also contact
    Customer Service by email at techsupdum@wiley.com. Wiley Publishing Inc. will
    provide technical support only for installation and other general quality items.'
