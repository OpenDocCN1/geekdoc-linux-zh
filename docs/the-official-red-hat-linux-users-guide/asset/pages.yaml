    * BMP


    GQview is useful for viewing individual image files as well as browsing collections
    of files in folders. It supports zoom in and out functions, as well as thumbnail
    views of all image files within a directory. It also supports several advanced
    options not found in the simple image viewers such as Nautilus and Konquerer.


    GQview can be started from your desktop by clicking the Main Menu button and Graphics
    -> GQview (to start GQview from a shell or terminal prompt, type gqview).


    Upon start-up, GQview will browse your user home directory by default. If you
    have any images in this directory, the gallery panel will automatically generate
    thumbnails for you to highlight and view in the main display area.


    ![](img/70f8904e8a1105c5df33b26207132b97_264_0.png)


    Figure 15-3. GQview Displaying a .jpg Image'
