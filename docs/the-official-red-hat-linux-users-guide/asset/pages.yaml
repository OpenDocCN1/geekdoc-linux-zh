    To start OpenOffice.org Impress from the desktop, select Main Menu ⇨ Office ⇨
    OpenOffice.org Impress (to start OpenOffice.org from a shell prompt, type oooimpress).


    OpenOffice.org Impress features several AutoPilot features that allow you to create
    presentations from a collection of style templates. You can make slides with itemized
    lists, outlines, or images. You can even import charts and graphs from OpenOffice.org
