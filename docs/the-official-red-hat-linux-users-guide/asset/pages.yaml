    machine does not support booting from the CD-ROM drive or if you need PCMCIA support
    in order to make use of the CD-ROM drive on your system. The PCMCIA diskettes
    can be used for all installation methods (CD-ROM, hard drive, NFS, FTP, and HTTP).


    To create a boot disk, refer to Chapter 1.


    Insert the boot diskette into your computer''s first drive and reboot (or boot
    using the CD-ROM, if your computer supports booting from it). Your BIOS settings
    may need to be changed to allow you to boot from diskette or CD-ROM.


    # Changing BIOS Settings


    To change your BIOS settings, watch the instructions provided on your display
    when your computer first boots. You will see a line of text telling you to press
    the Del or F1 key to enter the BIOS settings. Once you have entered your BIOS
    setup program, find the section where you can alter your boot sequence. The default
    is "C, A" or "A, C" (depending on whether you boot from hard drive C or a diskette
    A). Change this sequence so that the CD-ROM is first in your boot order and that
    C A (whichever is your typical boot default) is second. The system instructs you
    to first look at the CD-ROM drive for bootable media; if it does not find bootable
    media on the CD-ROM drive, it will then check your hard drive or diskette drive.
    Save your changes before exiting the BIOS. For more information, refer to the
    documentation that came with your system.


    After a short delay, a screen containing the boot : prompt should appear. The
    screen contains information on a variety of boot options. Each boot option also
    has one or more help screens associated with it. To access a help screen, press
    the appropriate function key as listed in the line at the bottom.


    As you boot the installation program, be aware of two issues:


    +   * Once you boot the prompt, the installation program will automatically begin
    if you take no action within the first minute. To disable this feature, press
    one of the screen function keys.


    +   * If you press a help function key, there will be a slight delay while the
    help screen is read from the boot media.


    Normally, you only need to press Enter to boot the installation program. Watch
    the boot messages to see if the Linux kernel detects your hardware. If your hardware
    is properly detected, you can continue to the next section. If it does properly
    detect your hardware, you may need to restart the installation in expert mode.'
  merge: -1
