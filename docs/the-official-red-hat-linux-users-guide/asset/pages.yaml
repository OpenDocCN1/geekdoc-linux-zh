  md: '# Chapter 8: Shell Prompt Basics 147


    If you are not logged in as root, you are denied permission to access that directory.
    Denying access to the root and other users'' accounts (or login directories) is
    one way your Linux system prevents accidental or malicious tampering. See the
    “Ownership and Permissions” section later in this chapter.


    To change to the root and login directory, use the cd command. For example:


    ```

    [sam@halloween sam]$su

    Password:your_root_password

    [root@halloween sam]#cd /root

    [root@halloween /root]#

    ```


    > TIP The su command switches users and allows you to temporarily log in as another
    user. When you type su by itself, you become root (also called superuser) while
    still inside your login shell (user''s home directory). Typing su - makes you
    root with root''s shell as if you had logged in as root originally.


    As soon as you get the root password, you will see the changes in your command
    prompt to show your new, superuser status, the root account details at the front
    of the prompt and "# at the end (as shown in the prior example).


    When you are done as root, type exit at the prompt and you will return to your
    user account.


    ```

    [root@halloween /root]#exit

    exit

    [sam@halloween sam]$

    ```


    # View Directory Contents with ls


    Now that you know how to change directories, it is time to learn how to view the
    contents of these directories. Using the ls command, you can display the contents
    of your current directory.


    Many options are available with the ls command. The ls command itself will not
    show all the files in your directory. Some files are hidden files (also called
    dot files because their filenames start with a dot) and can only be seen by using
    the -a option with the ls command.


    > TIP To see all the options of the ls command, you can read the man page for
    the ls command by typing man ls is at a shell prompt. If you want to print the
    man page, at the prompt type man ls | col -b | lpr.'
  merge: -1
