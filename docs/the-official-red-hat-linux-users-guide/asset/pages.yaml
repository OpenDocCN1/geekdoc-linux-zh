  md: '# Chapter 12


    # Getting Online


    There are many types of Internet connections, the most common of which include


    +   * Modems

    * xDSL modems

    * Cable modems

    * Wireless devices


    While this is by no means an exhaustive list of connection types, these are by
    far the most common methods of connecting to the Internet today. Other connection
    types, such as ISDN and token ring, are pretty exclusively the domain of business-class
    networks and as such are beyond the scope of this book. For more information on
    these more advanced connection types, see the Official Red Hat Linux Administrator’s
    Guide (Red Hat Press/Wiley, 2003).


    # Network Configuration


    To communicate with other computers, your computer needs a network connection.
    Computers connect to networks by having the operating system recognize a network
    interface adapter (such as Ethernet) or other hardware (such as a dial-up modem).


    The Network Administration Tool comes with Red Hat Linux and can be used to configure
    your network interface. To use the Network Administration Tool, you must be running
    the X Window System and have root privileges. To start the application, click
    the Main Menu and choose System Settings -> Network (or type the command redhat-config-network
    at a prompt).


    If you prefer modifying the configuration files directly, refer to the Official
    Red Hat Administrator’s Guide for information on their location and contents.


    | TIP Visit the Red Hat Hardware Compatibility List at http://hardware.redhat.com/hcl/
    to determine if Red Hat Linux supports your hardware device. |


    # Overview of Configuring a Network Connection


    To configure a network connection with the Network Administration Tool, perform
    the following steps:'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Part III: Getting the Most from Your Red Hat Linux System


    +   1. Add the physical hardware device to the hardware list.

    2. Add a network device associated with the physical hardware device.

    3. Configure any hosts that cannot be looked through DNS.

    4. Configure the hostname and DNS settings.


    This chapter will discuss each of these steps for each of the following types
    of network connections:


    +   **Modem Connection** — A modem uses a modem to establish a connection to the
    Internet. Digital data is modulated into analog signals and sent over phone lines.
    To configure this type of connection, see the “Establishing a Modem Connection”
    section later in this chapter for more information.


    +   **xDSL Connection** — An xDSL (Digital Subscriber Line) connection uses high-speed
    transmissions over telephone lines. There are different types of DSL as ADSL,
    ISDSL, and SDS. The term xDSL means any type of DSL connection. See the “Establishing
    an xDSL Connection” later in this chapter for more information.


    +   **Cable Connection** — A cable modem connection uses the same coaxial cable
    that your TV cable travels on transmit data. Most cable Internet providers require
    you to install an Ethernet card (or other Ethernet adapter, such as a USB adapter)
    in your computer that connects to the cable modem. Then, the cable modem connects
    to the coaxial cable and to your Ethernet card. The Ethernet card is usually required
    to be configured for DHCP. See the “Establishing an Ethernet Connection” section
    for more information on setting up your Ethernet card.


    +   **Wireless Connection** — If you are connecting your Red Hat Linux computer
    to a wireless access point (WAP) or peer-to-peer (also called ad-hoc) network
    with a wireless (802.11x) network card, then you will need to configure your wireless
    device. See the “Establishing a Wireless Connection” section later in this chapter
    for more information.


    # Establishing an Ethernet Connection


    To establish an Ethernet connection (such as for a cable modem or DSL connections),
    you need a network interface card (NIC), a network cable (usually a CAT5 cable),
    and a network to connect. There are different speeds to networks; make sure your
    NIC is compatible with the network you want to connect.'
  merge: -1
