  md: '# Chapter 16: Printer Configuration 253


    # Renaming a Printer


    If you want to rename a printer, change the value of Queue Name in the Names and
    Aliases tab. Click OK to return to the main window. The name of the printer should
    change in the printer list. Click Apply to save the change and restart the printer
    daemon.


    # Changing a Printer''s Queue Type


    The Queue Type tab shows the queue type that you selected when adding the printer
    and its settings. You can change the queue type of the printer or just change
    the settings. After modifications, click OK to return to the main window. Click
    Apply to save the change and restart the printer daemon.


    Depending on queue type you choose, you will see different options. Refer to the
    "Queue Type" section earlier in this chapter for a description of the options.


    # Changing a Printer''s Driver


    The Driver tab shows the printer driver that is currently being used. This is
    the same list that used when adding the printer. If you change the printer driver,
    click OK to return to the main window. Click Apply to save the change and restart
    the printer daemon.


    > TIP If you have problems printing, try selecting a different driver from this
    list and printing a test page. Some drivers work better than others for your printer.


    # Changing a Printer''s Driver Options


    The Driver tab displays advanced printer options. Options vary for each printer
    driver. Common options include:


    +   * Send Form-Feed (FF) — This option should be selected if the last page of
    your job is not ejected from the printer (for example, the printer feed light
    flashes). This does not work, try selecting End-of-Transmission (EOT) instead.
    Some printers require both Send Form-Feed (FF) and Send End-of-Transmission (EOT)
    to eject the last page.

    * End-of-Transmission (EOT) — This option should be selected if sending a formfeed
    does not work. Refer to FF above.

    * Assume Unknown Data is Text — This option should be selected if your printer
    driver does not recognize some of the data sent to it. Only select this option
    if you are having problems printing. If this option is selected, the printer driver
    will assume any data it cannot recognize is text and try to print that data as
    the Convert Text to Postscript option, the printer driver will assume the unknown
    data is text and then convert to PostScript.

    * Prerender Postscript — This option should be selected if you are printing characters
    beyond the ASCII set (such as Japanese characters) but are not printing correctly.
    This option will prevent non-standard PostScript fonts from being printed correctly.
    If your printer does not support the fonts you are trying to print, try selecting
    this option. For example, you should select this option if you are printing Japanese
    fonts to a non-Japanese printer. Extra time is required to perform this action.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# 254 Part IV: Configuring Your Red Hat Linux System


    Do not choose it unless you are having problems printing the correct fonts. You
    should also select this option if your printer cannot handle PostScript level
    3. This option converts it to PostScript level 1.


    +   - Convert Text to PostScript — This option is selected by default. If your
    printer can print plain text, unselecting this when printing text documents to
    decrease the time it takes to print.


    +   - Page Size — This allows you to select the page size for your printer, such
    as US Letter, US Legal, A3, and A4.


    +   - Effective Filter Locale — This option defaults to C. If you are printing
    Japanese characters, select ja_JP. Otherwise, accept the default of C.


    +   - Media Source — This option defaults to Printer default. Change this option
    to use print from a different tray.


    If you modify the driver options, click OK to return to the main window. Click
    Apply to the change and restart the printer daemon.


    # Managing Your Print Jobs


    When you send a print job to the printer daemon as printing files from OpenOffice.org
    applications or printing an image from The GIMP, the print job is added to the
    print spool queue.


    The print spool queue is a list of print jobs that have been sent to the printer
    and information about each print request, such as:


    +   - The status of the request

    - The username of the person who sent the request

    - The hostname of the system that sent the request

    - The job number


    # Viewing Print Jobs


    To view the list of print jobs in the print spool, open a shell prompt and type
    the command lp1q. The last few lines will look like the following:


    | Rank | Owner/ID | Job Files | Size Time |

    | active@localhost+902 | A | 902 sample.txt | 2050 01:20:46 |


    # Canceling a Print Job


    If you want to cancel a print job, find the job number of the request with the
    command lpq (see the previous section) and then use the command lprm job_number.
    For example, typing the command lprm 902 would cancel the print job in the example
    in the previous section.


    > NOTE You must have proper permissions to cancel a print job. You cannot cancel
    print jobs that started by other users unless you are logged in root on the machine
    to which the printer is attached.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Printing from a Shell Prompt


    You can also print a file directly from a shell prompt. For example, the command
    lpr sample.txt prints the text file sample.txt. The print filter determines what
    type of file it is and converts it to a format the printer can understand.


    # Additional Resources


    To learn more about printing on Red Hat Linux, go to the GNU/Linux Printing site
    at http://www.linuxprinting.org , whichcontains a large amount of information
    about printing in Linux. Also, the following documentation on your Red Hat Linux
    machine can be very helpful:


    +   * man printcap — The manual page for the /etc/printcap printer configuration
    file.

    * man lpr — The manual page for the lpr command, which allows you to print files
    from the command line.

    * man lpd — The manual page for the LPRng printer daemon (lpd).

    * man lprpm — The manual page for the command line utility that allows you to
    remove print jobs from the LPRng spool queue.

    * man mpage — The manual page for the command line utility that allows you to
    print multiple pages on one sheet of paper.'
  merge: -1
