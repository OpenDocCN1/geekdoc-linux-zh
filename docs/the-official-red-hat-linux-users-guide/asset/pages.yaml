    # Appending Standard Output


    You can use output redirection to add new information to the end of an existing
    file. Similar to when you used the > symbol, you tell your shell to send the information
    somewhere other than standard output.


    However, when you use >>, you are adding information to a file, rather than replacing
    the contents of a file entirely.


    The best explanation is a demonstration. Take two files which have already been
    created in previous examples (sneakers.txt and home.txt) and join them by using
    the append symbol (>>). You want to add the information in home.txt to the information
    already in sneakers.txt, so type the following:


    ```

    cat home.txt >> sneakers.txt

    ```


    Now check the file using the command cat sneakers.txt. The final output shows
    the contents of home.txt at the end of the file.


    ```

    [sam@halloween sam]$cat sneakers.txt

    buy some sneakers

    ```'
