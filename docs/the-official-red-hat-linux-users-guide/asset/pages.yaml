  md: '# Chapter 5: Getting Started 101


    # # Opening or Closing a Shell Prompt


    The graphical desktop offers access to a shell prompt, an application that allows
    you to type commands to control your interface instead of a graphical interface
    for all computing needs. While this book focuses on performing tasks using the
    graphical interface and graphical tools, it is sometimes useful and faster to
    perform tasks from a shell prompt. Refer to Chapter 8 for more details.


    You can open a shell prompt by clicking the Main Menu button and choosing System
    Tools ⇒ Terminal. You can also start a shell prompt by double-clicking the Start
    Here icon, then Applications, then System Tools, and finally Terminal.


    To exit a terminal, do one of the following:


    +   * Click the X button on the upper-right corner of the window.

    * Type exit at the prompt.

    * Press Ctrl-D at the prompt.


    # # Creating a User Account


    When you installed Red Hat Linux you were the opportunity to create one or more
    user accounts. If you did not create one least (not including the root account),
    you should do so now.


    > > **NOTE** We cannot stress this point enough: You should avoid working in the
    root account unless you absolutely have to.


    There are two ways to create new and/or additional user accounts: by using the
    Red Hat User Manager or from a shell prompt.


    To create a user account graphically using the User Manager:


    +   1. Click the Main Menu button and choose System Settings ⇒ Users and Groups.
    If you prefer, you can double-click the Start Here icon on the panel at the bottom
    of your desktop. In the new window that appears, click the System Settings icon,
    and then click the Users & Groups icon. If you prefer to use the shell prompt,
    you can start the User Manager by typing redhat-config-users at a shell prompt.

    2. If you are not logged in root, you will be prompted for your root password.

    3. The window shown in Figure 5-5 will appear. Click Add User.

    4. In the New User dialog box, enter a username (this can be an abbreviation or
    nickname), the full name of the user for whom this account is being created, and
    a password (which you will enter a second time for verification). The name of
    this user''s home directory and the name of the login shell should appear by default.
    For most users, you can accept the defaults for the other configuration options.
    See Chapter 10 for details about additional options.'
  merge: -1
