  md: '# Part VII: Appendices


    # DRI


    Direct Rendering Infrastructure (DRI) is an interface that primarily allows 3-D
    software applications to take advantage of the 3-D hardware acceleration capabilities
    on modern supported video hardware. In addition, DRI can improve 2-D hardware
    acceleration when using drivers that have been enhanced to use the DRI for 2-D
    operations. This section is ignored unless DRI is enabled in the Module section.


    Because different video cards use DRI in different ways, read the /usr/X11/lib/X11/code/README.DRI
    file for specific information about your particular video card before changing
    any DRI values.


    # Files


    This section sets paths for services vital to the XFree86 server, such as the
    font. Common options include:


    +   - FontPath — Sets the locations where the XFree86 server can find fonts. Fixed
    sized paths to directories font files can be placed here and by commas. Default,
    Red Linux uses xfs as the server point and finds FontPath to unix/~7100. This
    tells the XFree86 server to obtain font information using Unix domain sockets
    for inter-process communication (IPC). See the "Fonts" section in chapter for
    more information concerning XFree86.

    - ModulePath — Allows to set up multiple directories to store modules loaded by
    the XFree86 server.

    - RgbPath — Tells the XFree86 server where the RGB color database is located on
    the system. This database file defines all valid color names in XFree86 and ties
    them to specific RGB values.


    # InputDevice


    This section configures an input device, such as a mouse or keyboard, that is
    used to submit information to the system via the XFree86 server. Most systems
    have at least two InputDevice sections, one for the keyboard and the mouse. Each
    section includes its two lines:


    +   - Driver — Tells XFree86 the name of the driver to load the device.

    - Identifier — Sets the name of the device, usually the name of the device followed
    by a number, starting with 0 for the first device. For example, the first keyboard
    InputDevice would have an Identifier of Keyboard.


    Most InputDevice sections contain lines assigning specific options to that device.
    Each of these lines start with Option and contain the name of the option in quotes,
    followed by the value to assign to that option. Mice usually receive options such
    as Protocol, PS/2, and Device, which designates the mouse for this section. The
    InputDevice section is well commented, allowing you to configure additional options
    for your particular devices by uncommenting certain lines.'
