  md: '# Chapter 8: Shell Prompt Basics 159


    # Command History and Tab Completion


    It does not take long the thought of typing the same command over and over becomes
    unappealing.


    One minor typing error can ruin lines of command. One solution is to use the command
    line history. By scrolling with the up arrow and down arrow keys, you can find
    plenty of your previously typed commands.


    Try it by taking a look again at sneakers.txt (created in earlier examples in
    this chapter). The first time, however, at the shell prompt, type:


    ```

    cat sneakers.txt

    ```


    Nothing happens, of course, because there is no sneakers.txt file. No problem.
    We will just use the up arrow to bring back the command and then use the left
    arrow to get to the point where we missed the "e." Insert the letter and press
    Enter again.


    We now see the contents of sneakers.txt.


    By default, up to 500 commands can be stored in the bash command-line history.


    > TIP By typing the env command at a shell prompt, you can see the environment
    variable that controls the size of the command-line history. The line that reads
    HISTFILESIZE=500 shows the number of commands that bash will store.


    The command-line history is actually kept in a file called .bash_history in your
    home directory. You can read it in a number of ways: using pico (or emacs vi),
    cat, less, and others.


    Be aware that the .bash_history file can be quite long. To read it with the more
    command, from your home directory type:


    ```

    more .bash_history

    ```


    To move forward a screen, press the space; to move back a screen, press b; to
    quit, press q. To find a command in your history file without keeping the arrow
    keys or pressing through the history, use grep, a powerful search utility (the
    "Grep Command" section earlier in this chapter for more details). Say you are
    searching for a previously used command that is similar to cat sneakerssomething.


    Say you have used the command fairly recently and you think it might be in your
    history file.


    ```

    history grep sneak

    ```


    Another timesaving tool is known as command completion. If you type part of a
    file, command, or pathname and press the Tab key, bash will present you with either
    the remaining portion of the file/path, or a beep (if the beep sound is enabled
    on your system). If you get a beep, just press Tab again to obtain a list of the
    files/paths that match what has been typed so far.'
  merge: -1
