    # Checking a Package''s Signature


    If you wish to verify that a package has not been corrupted or tampered with,
    examine only the md5sum by typing the following command at a shell prompt (replace
    rpm-file with the filename of the RPM package):


    ```

    rpm -K --nopg rpm-file

    ```


    You will see the following message


    ```

    rpm-file : md5 OK

    ```


    This brief message means the file was not corrupted by the download.


    > TIP To see a more verbose message, replace -K -vvv in the command.


    On the other hand, how trustworthy is the developer who created the package? If
    the package is signed with the developer''s GnuPG key, you will know that the
    developer really is who he says he is.


    An RPM package can be signed using the Gnu Privacy Guard (or GnuPG), to help you
    ensure your downloaded package is trustworthy.


    GnuPG is a tool for secure communication; it is a complete and free replacement
    for the encryption technology of PGP, an electronic privacy program. With GnuPG,
    you can'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Chapter 20: Package Management with RPM 287


    authenticate the validity of documents and encrypt/decrypt data to and from other
    recipients. GnuPG is capable of decrypting and verifying PGP 5.x files as well.


    During the installation of Red Hat Linux, GnuPG is installed by default. That
    way you can immediately start using GnuPG to verify any packages that you receive
    from Red Hat. First, you will need to import Red Hat''s public key.


    # Importing Keys


    To verify official Red Hat packages, you must import the Red Hat GPG key. To do
    so, execute the following command at a prompt:


    ```

    rpm --import /usr/share/rhn/RPM-GPG-KEY

    ```


    To display a list of all keys installed for RPM verification, execute the command:


    ```

    rpm -qa gpg-pubkey*

    ```


    For the Red Hat key, the output will include:


    ```

    gpg-pubkey-db42a60e-37ea5438

    ```


    To display details about a specific key, use rpm -qi followed by the output from
    the previous command, as follows:


    ```

    rpm -qi gpg-pubkey-db42a60e-37ea5438

    ```


    # Verifying the Signature of Packages


    To check the GnuPG signature of an RPM file after importing the builder''s GnuPG
    key, use the following command (replace rpm-file with filename of the RPM package):


    ```

    rpm -K rpm-file

    ```


    If all goes well, you will see the message: md5 gpg OK. That means the signature
    of the package has been verified and it is not corrupt.


    # Impressing Your Friends with RPM


    RPM is a useful tool for managing your system and diagnosing and fixing problems.
    The best way to make sense of all of its options is to look at some examples.


    +   Perhaps you have deleted some files by accident, but you are not sure what
    you deleted. If you want to verify your entire system and see what might be missing,
    you could try the following command:


    ```

    rpm -Va

    ```


    +   If some files are missing or appear to be corrupted, you should probably either
    re-install the package or uninstall and reinstall the package.


    +   At some point, you might see a file that you do not recognize. To find out
    which package owns it, you would enter the following command:


    ```

    rpm -qf /usr/X11R/bin/ghostview

    ```'
