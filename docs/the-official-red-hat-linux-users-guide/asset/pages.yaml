- img_proc: true
  md: '# Chapter 19


    # Package Management


    Red Hat Linux consists of various software applications and utilities, known as
    RPM packages. A package is just a file that contains a software program (identical
    in concept to .exe files in Windows).


    This chapter explains four ways to update your system: using the Package Management
    Tool, the Red Hat Network, the online Errata List, or the Red Hat Installation
    CD-ROMs.


    # Updating with the Package Management Tool


    During installation, users select an installation type such as Workstation or
    Server. Software packages are installed based on this selection. Because people
    use their computers differently, users might want to install or remove packages
    after installation. The Package Management Tool allows users to perform these
    actions.


    To start the application, click the Main Menu button and choose System Settings
    ⇒ Packages (or type the command redhat-config-packages at the shell prompt).


    ![](img/70f8904e8a1105c5df33b26207132b97_298_0.png)


    Figure 19-1. Package Management Tool'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Part V: Updating and Adding Packages to Red Hat Linux


    The interface for the Package Management tool is similar to the one used during
    the package management stage of installation (Chapter 2). Packages are divided
    into package groups, which contain a list of standard packages and extra packages
    that share common functionality. For example, the Graphical Internet group contains
    a browser, email client, and other graphical programs that are used to connect
    to the Internet. The standard packages cannot be selected for removal unless the
    entire group is removed. The extra packages are optional that can be selected
    for installation or removal as long as the package group is selected.


    The main window shows a list of package groups. If the package group has a checkmark
    in the checkbox beside it, packages from that group are currently installed. To
    view the individual packages list for a group, click the Details button beside
    it. Individual packages with a checkmark beside them are currently installed.


    # Installing Packages


    To install packages in a package group that is not currently installed, check
    the checkbox beside it. To customize the packages to be installed within the group,
    click the Details button beside it.


    The list of standard and extra packages is displayed. Clicking on the package
    name displays the disk space required to install the package at the bottom of
    the window. Checking the checkbox beside the package name marks it for installation.


    ![](img/70f8904e8a1105c5df33b26207132b97_299_0.png)


    Figure 19-2. Individual Package Selection'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Chapter 19: Package Management 273


    You can also select individual packages from already installed package groups
    by clicking the Details button and checking any of the extra packages not already
    installed.


    After selecting package groups and individual packages to install, click the Update
    button on the main window. The application will compute the amount of disk space
    required to install the packages as well as any package dependencies and display
    a summary window. If there are package dependencies, they will be automatically
    added to the list of packages to be installed. Click the Show Details button to
    view the complete list of packages to be installed.


    ![](img/70f8904e8a1105c5df33b26207132b97_300_0.png)


    Figure 19-3. Package Installation Summary


    Click Continue to start the installation process. When it is finished, an Update
    Complete message will appear.


    > TIP If you use Nautilus to browse the files and directories on your computer,
    you can also use it to install packages. In Nautilus, go to the directory that
    contains an RPM package (they usually end in .rpm), and double-click on the RPM
    icon to start installing the package.


    # Removing Packages


    To remove all packages installed within a package group, uncheck the checkbox
    beside it. To remove individual packages, click the Details button beside the
    package group and uncheck the individual packages.


    When you are finished selecting packages to remove, click the Update button in
    the main window.


    Package Manager computes the amount of disk space that will be freed as well as
    the software package dependencies. If other packages you selected to remove, they
    will be automatically added to the list of packages to be removed. Click the Show
    Details button to view the list of packages to be removed.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 274 Part V: Updating and Adding Packages to Red Hat Linux


    ![](img/70f8904e8a1105c5df33b26207132b97_301_0.png)


    Figure 19-4. Package Removal Summary


    Click Continue to start the process. When it is finished, an Update Complete message
    will appear.


    > TIP You can combine the installation and removal of packages by selecting package
    groups/packages to be installed or removed and then by clicking Update. The Completed
    System Preparation window will display the number of packages to be installed
    and removed.


    # Updating Packages with the Red Hat Network


    Red Hat Network is an Internet service for managing one or more Red Hat Linux
    systems. All Security Alerts, Bug Fix Alerts, and Enhancement Alerts (collectively
    known as *Errata Alerts*) can be downloaded directly from Red Hat using the Red
    Hat Agent standalone application or through the RHN Web interface available at
    http://rhn.redhat.com/.


    > NOTE Everyone receives a free Red Hat Network account for one system. Additional
    accounts must be purchased.


    # What You Get with Red Hat Network


    Red Hat Network saves users time because they receive an email when updated packages
    are released. Thus, users do not have to search the Web for updated packages or
    security alerts. By default, the Red Hat Network installs the packages as well.
    Users do not have to learn how to use RPM or worry about resolving software package
    dependencies; RHN does it all.


    Each Red Hat Network accounts with:


    +   * *Errata Alerts* — Learn when Security Alerts, Bug Fix Alerts, and Enhancement
    Alerts are issued for all the systems in your network through the Basic interface.

    * *Automatic email notifications* — Receive an email notification when an Errata
    Alert is issued for your system.

    * *Scheduled Errata Updates* — Schedule delivery of Errata Updates (with optional
    automatic installation).

    * *Package installation* — Schedule package installation on one or more systems
    with the click of a button.'
