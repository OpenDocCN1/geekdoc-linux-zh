    # Table 8-2: Options for ls


    | Option | What It Does |

    |---|---|

    | -a | Lists all files in the directory, including the hidden files (.filename).
    The . and at the top of your list refer to the parent directory and the current
    directory. |

    | -l | Lists details about each, including permissions (modes), owner, group,
    size, creation date, whether the file is a link to somewhere else on the system,
    and where its links points. |

    | -F | Adds a symbol to each listing. These symbols include / to indicate a directory;
    @ to indicate a symbolic link to another file; and * to indicate an executable
    file. |

    | -r | Lists the contents of the directory from back to front. |

    | -R | This option lists the contents of all directories below the current directory
    recursively. |

    | -S | Sorts files by their size.'
