  md: '# Chapter 3: Upgrading Your Current System 75


    The installation program provides two boot loaders to choose from, GRUB and LILO:


    +   - GRUB (GR Unified Bootloader), which is installed by default, is a very powerful
    boot loader that can load a variety of operating systems, as well as proprietary
    operating systems with chain-loading (the mechanism for loading operating systems
    by loading another boot loader, such as DOS or Windows).

    - LILO (Linux Loader) is a versatile boot loader for Linux. It does not depend
    on a specific file system, can boot Linux kernel images from floppy diskettes
    and hard disks, and can even boot other operating systems.


    If you do not want to install GRUB as your boot loader, Change boot loader. You
    can then choose to install LILO or not to install a boot loader.


    If you already have a boot loader that can boot Linux and do not want to overwrite
    your current boot loader, or if you plan to boot the system using boot diskettes,
    choose Do not install a boot loader by clicking on the Change boot loader.


    > CAUTION if you do not want to install GRUB or LILO for any reason, you will
    not be able to boot the system directly, and you will need to use another boot
    method (such as a boot diskette). Use this only option if you are sure you have
    no other way of booting the system!


