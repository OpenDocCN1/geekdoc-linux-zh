  md: '# Chapter 2: Installing Red Hat Linux 29


    > NOTE If you already have another operating system installed and want to create
    a dual boot system so that you can use both Red Hat Linux and the other operating
    system, read Appendix C for.


    The installation program will then probe your system and attempt to identify your
    CD-ROM drive. It will start by looking for an IDE (also known as ATAPI) CD-ROM
    drive. If this is found, you will continue to the next stage of the installation
    process (the “Welcome to Red Hat Linux” section later in this chapter).


    > NOTE To abort the installation process at this time, reboot the machine and
    then eject the boot diskette CD-ROM. You can safely cancel the installation at
    any point before the About to Install screen. See the “Preparing to Install” section
    later in this chapter for more information.


    If your CD-ROM drive is not detected, and it is a SCSI CD-ROM, you can manually
    select the SCSI-ROM type when prompted. Select SCSI if your CD-ROM drive is attached
    to a supported SCSI adapter; the installation program will then ask you to choose
    a SCSI driver. Choose the driver that most resembles your adapter.


    You may specify options for the driver if necessary; however, most drivers will
    detect your SCSI adapter automatically.


    #  If the IDE CD-ROM Was Not Found?


    If you have an IDE (ATAPI) CD-ROM, but the installation program fails to find
    your IDE (ATAPI) CD-ROM and asks you what type of CD-ROM drive you have, restart
    the installation and at the boot: prompt enter linux hd=edrom. Replace the x with
    one of the following letters, depending on the interface the unit is connected
    to, and whether it is configured as master or slave (also known as primary and
    secondary):


    +   a — First IDE controller, master

    b — First IDE controller, slave

    c — Second IDE controller, master

    d — Second IDE controller, slave


    If you have a third/or fourth controller, continue assigning letters in alphabetical
    order going from controller to controller and master to slave.


    # Installing from a Hard Drive


    Hard drive installations require the use of the ISO (or CD-ROM) images. An ISO
    image is a file containing an exact copy of a CD-ROM disk image. Because Red Hat
    Linux has so many packages included with its distribution, there are several ISO
    images available. After placing the required ISO images (the binary Red Hat Linux
    CD-ROMs) in a directory, choose to install from the hard drive.'
