  md: '# Using the Notification Area


    As part of the Panel Notification Area, the Red Hat Network Notification Tool
    provides you with an easy way to make your system is up to date with current errata
    and bug fixes from Red Hat. The applet shows different images that indicate whether
    your system is up or needs upgrades. If you click on the applet, a list of available
    updates will be displayed. To update your system, click the button to launch the
    Red Hat Update Agent. If you are not registered with Red Hat Network, it will
    launch the registration application. Right-click on the applet icon and select
    Help for details.


    ![](img/70f8904e8a1105c5df33b26207132b97_135_0.png)


    Figure 6-5. The Red Hat Network Notification Tool


    One thing that is displayed in the Notification Area is a security notification
    that alerts you whenever you have gained root authentication for your system.
    It disappears when the authentication times out.


    ![](img/70f8904e8a1105c5df33b26207132b97_135_1.png)


    Figure 6-6. The Authentication Icon


    # Using Nautilus


    The graphical desktop includes a file manager called Nautilus that gives you a
    graphical display of your system and personal files. Nautilus is designed to be
    much more than a listing of files, however; it also allows you to


    +   * Configure your desktop

    * Configure your Red Hat Linux system

    * Play digital music and video files

    * Browse photos

    * Access your network resources


    You can do all this and more from one integrated interface. In essence, Nautilus
    becomes a navigation tool for your entire desktop experience.


    Working in Nautilus is efficient and provides an alternative to searching through
    the various submenus connected to the Main Menu or using a shell prompt to navigate
    the file system.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Chapter 6: Using the Graphical Desktop 109


    To start Nautilus as a file manager, double-click on your home directory icon.
    Once Nautilus appears, you can navigate through your home directory or the rest
    of the file system.


    To return to your home directory, click the Home button.


    When you navigate through your file system, you can always see where you are by
    looking at the frame on the left that shows you the current directory.


    The main frame contains folders and files that you can drag with your mouse to
    move and copy into new locations. If you prefer, you may click the Tree on the
    bottom left to display a hierarchical view of your complete file system that may
    make moving and copying easier for you.


    If the Tree does not appear on the bottom left, you can make the table by right-clicking
    in the tree area and choosing Tree from the menu.


    If you do not want to use the tree view, you can open another Nautilus window
    by selecting File New Window. After you have another Nautilus window, you can
    drag and drop files to different directories.


    > NOTE By default, dragging a file from one directory to another will move the
    file. If you wish to copy the file to another directory, press the Ctrl key while
    dragging and dropping the file.


    By default, text-based files and images in your home directory will be seen as
    thumbnails. For text files, this means you will see a portion of the actual text
    in the icon. For images, you will see a scaled down (or *thumbnail*) version of
    the image. To turn off this feature, select Edit Preferences. Select Performance
    from the menu on the left and then select Never for the visual enhancements that
    you want to disable. Disabling these features will increase the speed of Nautilus.


    # Start Here


    The Start Here window was designed to hold all of the tools and applications you
    need to access when using your system. From your favorite applications to system
    and configuration tools, the Start Here window provides a central location for
    using and customizing your system.


    You may access Start Here at any time by double-clicking on the desktop icon labeled
    Here.


    The Start Here screen includes icons that allow you to access your favorite applications,
    desktop preferences, Main Menu items, server configuration tools, and system settings.'
  merge: -1
