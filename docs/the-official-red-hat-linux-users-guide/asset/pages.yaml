    the user to click on to initiate applications and opening files.

    * Icons — Small images representing an application, folder, shortcut, or system
    resource (such as a floppy drive). Launcher icons usually refer to application
    shortcuts.

    * Graphical Desktop Environment — The most visible area of a GUI. The desktop
