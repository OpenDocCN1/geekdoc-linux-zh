  md: '# # Appendix A


    # # Rescue Mode


    When things go wrong, there are ways to fix problems. However, these methods require
    that you understand the system well. This chapter describes how to boot into rescue
    mode and single user mode, where you can use your own knowledge to repair the
    system.


    # ## What Is Rescue Mode?


    Rescue mode provides the ability to boot a small Linux environment entirely from
    a diskette, CD-ROM, or using some other method. As the name implies, rescue mode
    is provided to you from something.


    During normal operation, your Red Hat Linux system uses files located on your
    system''s hard drive to do everything — run programs, store your files, and more.
    However, there may be times when you are unable to boot Linux completely to access
    its files on your system''s hard drive. Using rescue mode, you can access the
    files stored on your system''s hard drive even if you cannot actually run Linux
    from that hard.


    Normally, you will need to get into rescue mode for one of two reasons:


    +   * You are unable to boot.

    * You are having hardware or software problems and you want to get a few important
    files off your system''s hard drive.


    In the following sections we take a closer look at each of these scenarios.


    # ## What to Do if You Are Unable to Boot Linux


    This problem is often caused by the installation of another operating system —
    such as Windows — after you have installed Red Linux. Other operating systems
    assume that you have no other operating systems on your computer, and you overwrite
    the Master Boot Record (MBR) that originally contained the GRUB or LILO boot loader.
    If the boot loader is overwritten in this manner, you will not be able to boot
    Red Hat Linux unless you get into rescue mode.


    Another common problem occurs when using a partitioning tool to resize a partition
    or create a new partition from free space after installation and it changes the
    order of your partitions. The partition number of your / (root) partition changes,
    the boot loader will not be able to find it to mount the partition. To fix this
    problem, boot into rescue mode and modify /boot/grub/grub.conf if you are using
    GRUB or /etc/lilo.conf if you are using'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# 330 Part VII: Appendices


    LILO. See the “Booting Rescue Mode” section later in this chapter for instructions
    on how to boot into rescue mode.


    # Hardware/Software Problems


    This category includes a wide variety of situations. Two examples include failing
    hard drives and forgetting to run LILO after building a new kernel (if you are
    using LILO as your boot loader). If you are using GRUB, you do not have to execute
    a command to reread the GRUB configuration file. If you specify an invalid root
    device or kernel in the GRUB configuration file, you might not know when to reboot
    your computer.


    In these situations, you may be unable to boot Red Hat Linux. If you can get into
    rescue mode, you might be able to resolve the problem or at least get copies of
    your most important files.


    # Booting Rescue Mode


    To boot in rescue mode, boot from a Red Hat Linux boot disk or the Red Hat Linux
    CD-ROM #1 and enter the following command at the boot prompt:


    ```

    boot: linux rescue

    ```


    You can get to the installation boot prompt in one of these:


    +   * By booting your system from an installation diskette made from the boot.img
    image. This method requires that the Red Hat Linux CD-ROM #1 be inserted as the
    image or that the rescue image be on the hard drive as an ISO image.


    > TIP To create an installation diskette, insert a blank floppy disk and use the
    images/boot.img file on the Red Hat Linux CD-ROM #1 with the command if=.boot.img
    of=/dev/fd0.


    +   * By booting your system from the Red Hat Linux CD-ROM #1.


    +   * By booting from a network disk made from the bootnet, or PCMCIA disk from
    pcmcia.img you can only do this if your network connection is working. You will
    need to identify the network host and transfer type. For an explanation of how
    to specify this information, refer to Chapter 2.


    After booting off a boot disk or Red Hat Linux CD-ROM #1 and providing a valid
    rescue image, you will see the following message:


    The environment will now attempt to find your Red Hat Linux installation and mount
    it under the directory /mnt/sysimage. You can then make any changes required to
    your system. If you want to proceed with this step choose ''Continue''. You can
    also choose to mount your filesystem read-only instead of read-write by choosing
    ''Read-only''. If some reason this process fails you can choose ''Skip'' and this
    step will be skipped and you will go directly to a command shell.


    ![](img/70f8904e8a1105c5df33b26207132b97_357_0.png)'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Appendix A: Rescue Mode 331


    If you select Continue, Linux will attempt to mount your file system under the
    directory /mnt/sysymage.


    If it fails to mount a partition, it will notify you. If you select Read-Only,
    it will attempt to mount your file system in read-only mode. If you select Skip,
    your file system will not be mounted. Choose Skip if you think your file system
    is corrupted.


    # After Entering Rescue Mode...


    After you have your system in rescue mode, a prompt appears on VC (virtual console)
    1 and VC 2 (using the Ctrl-Alt-F1 key to access VC 1 and Ctrl-Alt-F2 to access
    VC 2) as:


    ```

    sh-2.05a#

    ```


    If you select Continue to mount your partitions automatically and they were mounted
    successfully, you are in single-user mode.


    To mount a Linux partition manually inside rescue mode, create a directory such
    as /foo type the following command:


    ```

    mount -t ext3 /dev/hda5 /foo

    ```


    In the command above, /foo is a directory you have created and /dev/hda5 is the
    partition you want to mount.


    > NOTE If the partition is of ext2, replace ext3 with ext2.


    If you do not know the names of your partitions, use the following command to
    list them:


    ```

    fdisk -l

    ```


    If your file system is mounted and you want to make your system the root partition,
    use the command chroot /mnt/sysymage. This is useful if you need to run commands
    such as rpm that require your root partition to be mounted as /. To exit the chroot
    environment, type exit to return to the prompt.


    # Commands You Run In Rescue Mode


