    # Troubleshooting Your Installation of Red Hat Linux


    This section discusses some common installation problems and their solutions.


    # You Are Unable to Boot Red Hat Linux


    If you''re unable to boot Red Hat Linux, the following sections help you troubleshoot
    the problem.


    # Are You Unable to Boot from the CD-ROM?


    If you cannot boot from your Red Hat Linux CD-ROM, you have two options:


    +   - Change your BIOS so that booting from the CD-ROM is recognized first in
    the boot order

    - Boot using a boot disk you have created'
