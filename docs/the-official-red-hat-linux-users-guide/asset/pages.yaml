  md: '# Appendix E: The X Window System 381


    # Desktop Environments and Window Managers


    The configuration of XFree server is useless unless accessed by an X client that
    will use to display a program using the hardware controlled by the X server. X
    clients are programs designed to take advantage of the X server''s hardware, usually
    to provide interactivity with a user.


    You do not have to run a complicated window manager in conjunction with X clients.
    Assuming that you are not already in an X environment and do not have an .xinit
    file in your home directory, the xinit command to start X with a basic terminal
    (the default xterm application). You will see that this basic environment utilizes
    your keyboard, mouse, video card, and not for the XFree8 server, using the server''s
    hardware preferences. Type exit at the xterm prompt to leave this X environment.


    Of course, most computer users require more features and functionality from their
    GUI. Developers have added layers of features to create highly developed and interactive
    environments that utilize the full power of the XFree8 server. These layers break
    into two fundamental groups based on their purpose: window managers and desktop
    environments. The following sections describe each of these groups.


    # Window Managers


    Window managers are X client programs that control the other X clients are positioned,
    resized, or moved. Window managers can also provide title bars to windows, keyboard
    focus by keyboard or mouse, user-specified key and mouse button bindings. Window
    managers work with a collection of different X clients, wrapping around the program,
    making it a certain way and appear on the screen in a particular place.


    Four window managers are included with Red Hat Linux 8.0:


    +   * twm - The minimalist Tab Window Manager, which provides the most basicIPSET
    of any of the window managers.


    +   * mwm - The default window manager for the GNOME desktop environment, mwm
    stands for Metacity Window Manager. It is a simple and efficient window manager
    that supports custom themes.


    +   * sawfish - This full featured window manager was the default for Red Hat
    Linux until the release of Red Hat Linux 8.0. It can be used with or without the
    GNOME desktop environment.


    +   * wmaker - WindowManager is a full-featured GNU window manager that was designed
    to emulate the look and feel of the NEXTSTEP environment.


    These window managers can run as individual X clients to gain a better sense of
    their differences. Type the xinit path-to-window-manager command, where path-to-windowmanager
    is the location of the window manager binary file. The binary file can be found
    by typing which window-manager-name or by looking for the name of the window manager
    in a bin directory.


    ![](img/70f8904e8a1105c5df33b26207132b97_408_0.png)'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# Desktop Environments


    Desktop environment brings together assorted X clients that can run together using
    similar methods, utilizing a common development environment.


    Desktop environments are different from window managers, which only control the
    appearance and placement of X windows. Desktop environments use an underlying
    window manager to enable advanced features that X clients and other processes
    to communicate with one another. This allows all applications to work in their
    environment to commonly integrate and be used in new ways, such as permitting
    drag-and-drop between them.


    GNOME is the default environment for Red Linux, and uses the GTK2 base widget
    toolkit and miscellaneous other widgets that extend the base functionality. KDE,
    another environment, uses a different toolkit called GNOME and KDE both contain
    advanced productivity applications, such as word processors, spreadsheets, and
    control panel devices that allow you to have complete control of the look and
    feel of your experience. Both environments can run standard X client applications,
    and most KDE applications can run in GNOME as the Qt libraries are installed.


    When you start X using the start command, a pre-specified desktop environment
    is utilized. To change the desktop environment used when X starts, open a terminal
    and type the switch command. This brings up a graphical utility that allows you
    to select the desktop environment or window manager to use the next X times.


    Desktop environments utilize window managers to provide the consistency in appearance
    between different applications. KDE contains its own window manager, called kwm,
    specifically for this functionality.


    For information the customization of the GNOME and KDE desktop environments, see
    Chapter 6 for GNOME and Appendix B for KDE.


    # Runlevels


    Most users run X from runlevels 3 or 5. Runlevel 3 places your system in multi-user
    mode with full networking capabilities. The machine will boot to a text-based
    login prompt with all necessary services started. Most servers are in runlevel
    3, as X is not necessary to provide any services used most users. Runlevel 5 is
    similar to runlevel 3, except that it automatically starts X and provides a graphical
    login screen. Many workstation prefer this method because it never forces them
    to see a command prompt.


    The default runlevel used when your system boots can be found in the /etc/initab
    file. If you have a line in that looks like id:3:initdefault; your system will
    boot to runlevel 3. If you have a line that looks like id:5:initdefault; your
    system is set to boot into runlevel 5.


    As root, change the runlevel in this file to set a different default. Save the
    file and restart your system to verify that it boots to the correct runlevel.
    The Official Red Hat Linux Administrator''s Guide (Red Hat Press/Wiley, 2003)
    for more information on runlevels.'
  merge: -1
  pgno: 409
