    # Accessing a Windows Partition


    **Question:** I have a dual-boot system with Red Hat Linux and Windows 95/98/Me.
    Is there a way to access my Windows partition while I am running Linux?


    You can access another partition on your system (for example, a Windows partition),
    in two different ways, as discussed in the following sections.


    # Mounting a Windows Partition Manually


    To mount a Windows partition manually (for example, if you only need to access
    your Windows partition once in a while and don''t want to have Windows mounted
    every time you boot your system), follow these steps:


    +   1. Assume that your Windows partition is on your first IDE drive, in the first
    partition (/dev/sda1).

    2. At a shell prompt, log in as root (type au) and then enter the root password.

    3. Create a directory at which the Windows partition will be mounted by typing
    the following command:


    ```

    mkdir /mnt/windows

    ```


    +   4. Before you can access the partition, you will need to mount it at the directory
    you just created. As root, type the following command at a shell prompt:


    ```

    mount -t vfat /dev/hd1 /mnt/windows

    ```'
