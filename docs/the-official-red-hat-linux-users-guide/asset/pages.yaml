  md: '# Chapter 17: Basic Firewall Configuration 263


    # Configuring Services


    GNOME Lokkit also allows you to turn common services on and off. If you answer
    Yes to configuring services, you are prompted about the following services:


    +   - **Web Server** — Choose this option if you want people to connect to a Web
    server such as Apache running on your system. You do not need to choose this option
    if you only want to view pages on your system or other services on the network.

    - **Incoming Mail** — Choose this option if your system needs to accept incoming
    mail. You do not need to retrieve email using IMAP, POP3, or fetchmail.

    - **Secure Shell** — Secure Shell, or SSH, is a suite of tools for logging into
    and executing commands on a remote machine over an encrypted connection. If you
    need to access your machine remotely select this.

    - **Telnet** — Telnet allows you to log into your machine remotely; however, it
    is not secure. It is recommended that you use SSH to log into your machine remotely
    if you need to. If you are required to have Telnet access to your system, select
    this option.


    To disable other services that you do not need, see the *Official Red Hat Linux
    Administrator''s Guide*.


    # Activating the Firewall


    Click Finish will write the firewall rules to /etc/sysconfig/iptables and start
    the firewall by starting the iptables service.


    It is highly recommended that you run GNOME Lokkit from the machine, not from
    a remote X session. If you disable remote access to your system, you will no longer
    be able to access it or disable the firewall rules.


    Click Cancel if you do not want to write the firewall rules.


    # Mail Relay


    A mail relay is a system that allows others to send email through it. If your
    system is a mail relay, someone could possibly use it to spam others from your
    machine.


    If you choose to enable mail services, you click Finish on the Activate the Firewall
    page, you will be prompted to check for mail relay. If you choose Yes to check
    for mail relay, GNOME Lokkit will attempt to connect to the Mail Abuse Prevention
    System at http://www.mail-abuse.org/ and run a mail relay test program. The results
    of the test will be displayed when it is finished. If your system is open to mail
    relay, it is highly recommended that you configure Sendmail to prevent it.


    You must have the iptables service enabled and running to activate the firewall.
    See the next section for details.'
  merge: -1
