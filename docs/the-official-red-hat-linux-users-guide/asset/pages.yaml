    If you already like your KDE configuration and wish to quit the Personalizer,
    press Skip Wizard, then Quit and Keep


    Please choose your country:

    Please choose your language


    Figure B-1. The KDE Setup Wizard


    # Using the Desktop


    After setting up KDE using the wizard, your default desktop will look similar
    to Figure B-2.

    The KDE desktop displays application launchers, document windows, file folders,
    folders, and so on.

    You can also access the Main Menu and configure the desktop to suit your needs.


    The long bar across the bottom of the desktop is called the Panel. The Panel contains
    application launchers, status indicators, and the desktop manager. You can have
    up to 16 desktops running at the same time in KDE. The Panel’s taskbar shows your
    currently running applications.


    Icons located on the desktop can be files, folders, device links, or application
    launchers. Click on an icon to open the associated resource.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Appendix B: The KDE Desktop Environment 337


    ![](img/70f8904e8a1105c5df33b26207132b97_364_0.png)


    Figure-B-2. A Typical KDE Desktop


    The KDE desktop works similarly to other graphical desktop environments. You can
    drag and drop files and application icons to any location on the desktop. You
    can also add new icons for all types of applications and resources to the desktop,
    Panel, or file manager. The desktop itself is also highly customizable. You can
    change the appearance of buttons, window and frame decorations, easily. Configuration
    tools are also available that allow you to customize the way KDE behaves at events
    such as single- and double-clicking mouse buttons and combining (also called *chording*)
    keystrokes to create time-saving shortcuts.


    The default KDE desktop displays icons for the trash can, your home directory,
    the KDE Control Panel, and a link to the Red Hat website. You can access any one
    of these resources clicking on the associated icon.


    When you right-click on the icons, you will see several options for working with
    these resources, such as Delete, Rename, Move to Trash, and Copy.


    You can drag and drop unwanted items such as files to the Trash icon if you no
    longer need them. Right-click on the trash can and select Empty Trash Bin to delete
    the items from your system permanently.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# Using the Panel


    The Panel stretches across the bottom of the desktop. By default, it contains
    the Main Menu icon (the big red Fedora) and quick-launch icons for logging out,
    opening a terminal window, and other common applications and utilities.


    ![](img/70f8904e8a1105c5df33b26207132b97_365_0.png)


    Figure B-3. The KDE Panel


    The Panel is highly configurable. You can add and remove buttons that launch applications
    easily. To do so, right-click on the Panel and choose Panel ⇨ Configuration to
    open the Panel Settings.


    Other tabs in Settings contain options to further customize your Panel. Click
    Help for more information on these options.


    Applications and utilities can be added easily to the Panel. To add an application
    to the Panel, right-click on the Panel and choose Panel ⮑ Add. Then select Button,
    Extension, Applet, or Special Button, and make your choice from the corresponding
    menus.


    # Using the KDE Main Menu


    The Main Menu is the central point for using KDE. Clicking the Main Menu button
    on the Panel displays a large master menu from which you can perform tasks such
    as launching applications, finding files, and configuring your desktop. The Main
    Menu also contains several submenus that organize applications and tools into
    several categories, including Extras, Graphics, Internet, and Games.


    From the Main Menu, you can also lock your screen (which will display a password-protected
    screensaver), run applications from a command line, and log out of your KDE session.


    # Using Applets


    Applets are small applications that run on the Panel. There are several types
    of applets that perform functions as system/network monitoring, launching applications
    by typing commands in a text box, and even checking the local weather.


    There are some applets that run on the Panel by default. The following sections
    cover those default applets in detail.


    # Working with Multiple Desktops


    By default, KDE provides four desktops (sometimes called workspaces) that you
    can use to display multiple applications without having to crowd all of them onto
    one desktop. Each desktop can hold icons, open applications, and even have individually
    customized backgrounds.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Appendix B: The KDE Desktop Environment 339


    For example, while you are writing a message in KMail on Desktop 1, you can have
    Konqueror browsing the Web on Desktop 2, the KWord word processor open on Desktop
    3, and so on.


    You can change the number and names of desktops available in KDE by following
    these steps:


    +   1. Right-click on the desktop; you will see a brief menu of actions you can
    take.

    2. Select Configure Desktop; the KDE Panel configuration tool will open.

    3. Click the Number of Desktops tab.


    ![](img/70f8904e8a1105c5df33b26207132b97_366_0.png)


    B-4. The Number of Desktops Tab in the Panel Configuration


    You can change the names of your desktops (from Desktop 1, Desktop 2, etc.) by
    deleting the default names and typing a new name in each desktop''s corresponding
    text box. You can also change the number of desktops available to you by adjusting
    the slider at the top of the Desktop tab. For more desktops, drag the bar to the
    right; for fewer desktops, drag the bar to the left.


    The Desktop, Appearance, and Borders tabs are where you can make various desktop
    configuration selections, like icon arrangement and font size.'
  merge: -1
