  md: '# # Chapter 7


    # # Diskettes and CD-ROMs


    Using diskettes and CD-ROMs with Red Hat Linux requires some understanding about
    removable media. This chapter discusses how to read and write files to and from
    diskettes, how to format diskettes, and how to read and copy data from a CD-ROM.
    This chapter also covers using CD-writable and CD-rewritable drives.


    > NOTE The term disk typically refers to disks such as hard drives; the term diskette
    refers specifically to floppy disks, and the term disc refers to optical media
    such as CD-ROMs and DVDs.


    # # Using Diskettes


    Diskettes are one of the oldest removable media solutions available for the PC.
    Diskettes are ideal as a portable storage solution for files that need to be physically
    moved around. For example, if two PCs are not on the same network, diskettes are
    a great solution to transfer files from one computer to the other.


    # # Mounting and Unmounting a Diskette


    A diskette must be mounted before it can be used. Insert a diskette into the diskette
    drive and type `mount /mnt/floppy/` at a shell prompt.


    The diskette drive activity light shines as the diskette''s file system is mounted
    to the `/mnt/floppy` directory.


    You can access the contents of the diskette by changing into that directory with
    the `cd /mnt/floppy` command.


    Alternatively, you can also mount a diskette by right-clicking on the desktop
    and choosing Disks -> Floppy. The diskette adds a desktop icon that you can double-click
    to explore the diskette contents.


    Now that the diskette has been mounted it is available to be copied from or written
    to. You can open, save, and copy files to or from the diskette as you would normally
    do to your hard drive. You can even explore the diskette''s contents in Nautilus
    or Konqueror.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Part II: The Basics


    ![](img/70f8904e8a1105c5df33b26207132b97_157_0.png)


    Figure 7-1. Viewing Files on a Diskette with Nautilus


    When you are finished using the diskette, you should unmount it before ejecting
    it from the drive. To do this, close any applications that may be using files
    on the diskette or exploring the diskette''s contents (such as Nautilus or Konqueror),
    and at a shell prompt type the following command:


    ```

    umount /mnt/floppy/

    ```


    You can now safely eject the diskette from the drive.


    > > If you are using the default Red Hat desktop environment, you can unmount
    the diskette by right-clicking on the icon and choosing Unmount Volume from the
    menu that appears.


    # Reading MS-DOS Formatted Diskettes


    If you have an MS-DOS formatted diskette, you can access the files on it by using
    the mtools utility. mtools offers a wide range of options for working with diskettes,
    including copying, moving, deleting, and formatting. (To read more about mtools,
    **type man mtools** at a shell prompt.


    For example, to copy a file called file.txt from an MS-DOS formatted diskette
    (such as one from a Windows system), type the following command at a shell prompt:


    ```

    mcopy a:file.txt

    file.txt

    ```'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Chapter 7: Diskettes and CD-ROMs 131


    file.txt will then be copied from the diskette drive (assuming that the disk is
    in drive A:) to the directory you were in when you issued the mcopy command. If
    you are in your home directory, you will find file.txt located there.


    If you want to see the contents of the MS- formatted diskette, type mdir at the
    prompt. You will be shown the contents of the diskette. The directory listing
    will look familiar to some MS-DOS or Windows users, as it is styled in the MS-dos
    dir listing format. For example:


    ```

    @joe@localhost joe]$ mdir a:

    Volume drive A has no label

    Volume Serial Number: 0000-0000

    Directory for A/

    FOOBAR TXT 6004 01-01-1999 1:01

    ZZTOP COM 1533 01-01-1999 1:01

    TAXES99 XLS 26469 01-01-1999 1:01

    THISFILE TXT 277 01-01-1999 1:01

    COMMAND 33890 01-01-1999 1:01

    5 files 128 173 bytes

    1 271 827 bytes free

    ```


    To change to a subdirectory on the diskette, type the following command at a shell
    prompt:


    ```

    cd subdir

    ```


    In the above command, replace subdir with the name of the subdirectory you want
    to access.


    # Putting Linux Files on an MS-DOS Diskette


    To copy files from a Linux machine to an MS-DOS formatted diskette so that a Windows
    machine can read it, you should format your disk with a file system like gfloppy
    (see the "Using gfloppy" section later in this chapter). Mount it in Linux as
    described in the preceding section. Copy files using the following command (substituting
    filename with the name of the file you wish to copy):


    ```

    cp filename /mnt/floppy

    ```


    You can then unmount the floppy and eject it from the drive. The new file on the
    diskette should now be accessible from your Windows machine.


    > NOTE The file will not be copied until the mount command has been successfully
    executed.


    # Formatting a Diskette


    To use a diskette specifically with Red Hat Linux, you need to format the disk
    using the ext2 file system. ext2 is one of the file systems supported by Red Hat
    Linux, and is the default method used for formatting diskettes.


    > WARNING Formatting a diskette will erase all of its contents. Be sure to back
    up any files that you need before performing any of the following operations on
    your diskettes.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# 132 Part II: The Basics


    You have created an ext2 file system on the diskette, you can manipulate its contents
    in the same ways that you manipulate directories and files on your hard drive.


    > NOTE If you''re wondering why a floppy is formatted with ext2 rather than ext3,
    it''s because the only real difference between ext2 and ext3 is journaling, which
    increases the size of the file system. Disettes are small, they don''t require
    journaling features (or the increased size of the file system), ext2 should be
    used instead of ext3 for diskettes.


    # Using gfloppy


    To start gfloppy, click the Menu button and choose System Options ⇨ Floppy Formatter
    (or, from a shell prompt, you can type **usr/bin/gfloppy**). As shown in Figure
    7-2, the gfloppy interface is simple and has few options.


    The default settings are sufficient for most users and needs; however, you can
    also choose the density of your floppy with an MS-DOS file system if you desire.
    You can also choose the density of your floppy disk (if you are not using the
    high density 3.5" 1.44MB diskette). You can also elect to *quick format* the diskette
    if it was previously formatted as ext2.


    ![](img/70f8904e8a1105c5df33b26207132b97_159_0.png)


    Figure 7-2. gfloppy


    Insert a diskette and change the settings to suit your needs; then click Format.
    The status box will appear on top of the main window, showing the status of formatting
    and verifying (see Figure 7-3). When it is complete, you can eject the disk and
    close gfloppy.


    ![](img/70f8904e8a1105c5df33b26207132b97_159_1.png)


    Figure 7-3. gfloppy Status Box


    # Using KFloppy


    Another way to format a diskette for either ext2 or MS-DOS is to use KFloppy.
    To start the utility, open a shell prompt and type the command **kfloppy**. You
    will be presented with a graphical interface, as shown in Figure 7-4.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'Insert a diskette that you wish to format and choose whether you want a Quick
    Format or Full Format by choosing the appropriate radio button. To check for bad
    sectors or blocks on the diskette while formatting, choose Verify Integrity in
    the associated box.


    ![](img/70f8904e8a1105c5df33b26207132b97_160_0.png)


    Figure 7-4. KDE Floppy Formatter


    To begin formatting, click the Format button. A window will pop up asking if you
    wish to format the diskette. Click Continue to dismiss this window and begin formatting.
    A status bar will appear at the bottom of the window showing the status of the
    format. After the diskette has been formatted, a final window will appear to inform
    you of a successful format. Click OK, remove the diskette, and click Quit to close
    the application.


    # Using mke2fs


    The mke2fs command is used to create a Linux ext2 file system on a device such
    as a hard drive partition or (in this case) a floppy diskette. mke2fs essentially
    formats the device and creates an empty, Linux-compatible device that can be used
    for storing files and data.


    Insert your diskette into the drive and issue the following command at a shell
    prompt:


    ```

    /sbin/mke2fs /dev/fd0

    ```


    On Linux systems, /dev/fd0 refers to the first diskette drive. If your computer
    has more than one floppy disk drive, your primary floppy drive will be /dev/fd0,
    and your second floppy drive will be designated /dev/fd1, and so on.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 134 Part II: The Basics


    The mk2fs utility has a number of options. The -c option makes the mk2fs command
    check the device for bad blocks before creating the file system. The other options
    are covered in the mk2fs man page.


    Once you have created an ext2 file system on the diskette, it is ready to be used
    with your Red Linux system.


    # Using CD-ROMs


    The CD-ROM format is a popular way to deliver large software applications and
    multimedia presentations. Most of the software that can be purchased from retail
    outlets comes on CDROMs. This section shows how to use CD-ROMs on your Red Hat
    Linux system.


    By default, Red Hat automatically detects a CD-ROM when it is inserted in the
    CD-ROM device. The disc will be mounted and your file manager will open a window
    with the disc drive''s contents for you to explore.


    # Using CD-ROMs with Your File Manager


    By default, CDs are automatically mounted and the default file manager opens for
    you to explore the contents of the CD. Figure 7-5 shows the contents of a CD-ROM
    within the Nautilus file manager.


    ![](img/70f8904e8a1105c5df33b26207132b97_161_0.png)


    Figure 7-5. Contents of a CD-ROM in Nautilus'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Chapter 7: Diskettes and CD-ROMs 135


    A desktop icon will also appear, which you can use to unmount and eject your CD-ROM
    after use. Right-click on the icon to view all of the available choices. For example,
    to unmount and eject the CD-ROM, right-click the icon and choose E from the menu.


    # Using CD-ROMs from a Shell Prompt


    You can also manually mount and unmount your CD-ROMs from a shell prompt. Insert
    a CD into your CD-ROM drive, open a shell prompt, and type the following command:


    ```

    mount /mnt/cdrom

    ```


    The CD-ROM should now be mounted and available for your file manager. example,
    if you are using Konqueror, you can access your CD-ROM by clicking the icon on
    the desktop and typing /mnt/cdrom in the location bar. Figure 7-6 shows the contents
    of a CD-ROM displayed in the Konqueror file manager.


    ![](img/70f8904e8a1105c5df33b26207132b97_162_0.png)


    Figure 7-6. Contents of a CD-ROM in Konqueror


    Working with your CD, you must unmount it before you eject it from your CD-ROM
    drive.


    Close any applications or file managers that are using the CD-ROM and type the
    following at a shell prompt:


    ```

    mount /mnt/cdrom

    ```


    You can now safely press the eject button on your CD-ROM drive (or by using the
    eject command) to retrieve your CD.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# CD-Rs and CD-RWs


    CD-writable (CD-R) drives have grown in popularity as an inexpensive way to back
    up and archive data, including applications, personal files, and even multimedia
    (audio/video and still image) presentations. Red Hat Linux includes several tools
    for using CD-Rs and rewritable (CD-RW) drives.


    # Using X-CD-Roast


    X-CD-Roast is a graphical application for duplicating and creating (mastering)
    CD-ROMs. X-CD-Roast automates the process of burning CD-Rs and CD-RWs and is highly
    configurable for many CD mastering or duplicating needs.


    To start X-CD-Roast, choose Main Menu ⇨ System Tools ⇨ CD Writer. To start it
    at a shell prompt, type `/usr/bin/xcdroast`. X-CD-Roast will first scan your device
    busses and find your CD-R(W) drive. It will then allow you to configure settings
    for CD-writer, CD-ROM drive, and more.


    Figure 7-7 illustrates the Setup screen and its configuration options. Note that
    the CD-R(W) drive may be different from the drive shown.


    ![](img/70f8904e8a1105c5df33b26207132b97_163_0.png)


    Figure 7-7. X-CD-Roast Setup Screen


    Check your CD-R(W) manufacturer documentation to set some of the CD Settings options,
    such as CD Writer Speed and CD Writer FIFO-Buffer Size. All CD image (.iso or
    .img) files need to be stored in a central location accessible to X-CD-Roast.
    You will have to specify'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Chapter 7: Diskettes and CD-ROMs 137


    a path on your hard drive''s file system that has at least 700MB of free space
    available. You can configure the path where you wish to store CD images in the
    HD Settings under path.


    X-CD-Roast is well documented within the interface itself, as several of the options
    have long, descriptive pop-up tips that inform you of the associated function
    in detail. You can access these tooltips by leaving your mouse pointer on a button
    or drop-down menu for at least two seconds.


    # Using X-CD-Roast to Duplicate CD-ROMs


    To duplicate an existing CD-ROM for backup purposes, click the Duplicate CD button
    in the main panel. You can read all of the tracks on CD — all CD-ROM information,
    including data and audio, is stored on tracks — clicking Read CD. You can set
    the speed at which you read a CD-ROM as well as find out some information about
    the CD-ROM track as its type and size. Because you are copying tracks from an
    audio CD, you can preview each track with Play Audio-Tracks reads all tracks of
    a CD-ROM by default, you can delete unwanted tracks by Delete Tracks.


    Finally, to burn your tracks onto CD-R(W) media, choose Write CD. Figure 7-8 shows
    the Write CD dialog where you can configure the speed at which you read and write
    the tracks to CD-R as well as whether you wish to copy the CD-ROM on-the-fly or
    create an image file before burning, which is recommended to prevent write or
    read errors from occurring during the duplication process.


    Click the Write CD button to start the burning process.


    ![](img/70f8904e8a1105c5df33b26207132b97_164_0.png)'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# X-CD-Roast to Create a CD


    You should always back up personal data and information often in case of hardware
    failure or file system corruption. X-CD-Roast allows you to backup files on your
    hard drive partition using Create CD. This facility allows you to add files and
    directories into a CD session using Master Tracks.


    There are other options within the Master Tracks dialog that allows you to create
    advanced settings; however, the defaults are set correctly to create data CD-ROMs,
    so no further configuration is necessary. Figure 7-9 shows a session that is preparing
    the entire /home directory for backup.


    ![](img/70f8904e8a1105c5df33b26207132b97_165_0.png)


    Figure 7-9. Using X-CD-Roast to Back Up Hard Drive Files


    Highlight the files and directories you wish to add to the session and click Add.
    After you have added all the files and directories you want to write to the CD-R(W),
    click the Create session/image tab to create the .img file. You must first click
    Calculate size and then Master to image to create the image.


    To write your tracks to the CD-R(W), click Write Tracks from the panel on the
    left. In the Layout Tracks tab, highlight the image file you created in the right,
    and click Add. The image will be displayed in the Tracks to write box on the left
    side. Click accept layout, and click the Write Tracks tab to return to the main
    writing dialog. Click Write Tracks to write the image to the CD-R(W).'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Writing ISOs with X-Roast


    Large files ending in .iso are known as ISO9660 (or ISO) image files. For example,
    Red Linux is freely available as ISO images that you can download and write to
    the CD-R(W). There are other ISO image files available on FTP and websites. There
    are other file types that can be burned as, such as .img and .raw, but ISO are
    the most common CD image format.


    To write an ISO image file to a CD-R(W) with X-Roast, move the ISO file to the
    path specified during setup and then Create CD. In the Layout tabs, highlight
    the ISO image file you wish to burn and click Add, then Accept track layout. This
    will automatically load the Write tracks when you can click Write Tracks to burn
    the image to the CD-R(W).


    # Using CD-Rs and CD-RWs with Command Line Tools


    If you want to use a shell prompt to write images to CD-R or CD-RWs, there are
    two utilities available: mkisos and cdrecord. These two utilities have advanced
    options that are beyond the scope of this guide; for basic image creation and
    writing, these tools save some time over the graphical alternatives such as X-Roast,
    and we discuss this briefly in the following sections.


    # Using mkisos


    mkisos creates ISO9660 image files that can be written to CD-R(RW). The images
    that mkisos creates are made up of all types of files. It is most useful for archival
    and file backup purposes.


    Suppose you wish to backup a directory called /home/joeuser/, but you wish to
    exclude the subdirectory /home/joeuser/junk/ because it contains unnecessary files.
    You want to create an ISO image called backup.iso and write it to CD-R so that
    you can use it on your Red Hat Linux PC at work and your Windows laptop for trips.
    This can be done with mkisos running the following command:


    ```

    mkisos -o backup.iso -x /home/joeuser/junk/ -J -A -V /home/joeuser/

    ```


    The image will be created in the directory you were in you ran the command. Table
    7-1 explains each command-line option. For more information on using mkisos, refer
    to the additional resources in the “Additional Resources” section later in this
    chapter.


    You can now use the ISO image file with either X-Roast as described in this chapter,
    or by cdrecord, the command-based CD recording utility. For more information about
    using cdrecord, see the next section.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Part II: The Basics


    # Table 7-1: mkisofs Options


    | Option | Function |

    | -O | Specify an output filename of the ISO image. |

    | -J | Generate Joliet naming records; useful if the CD will be used in Windows
    environments. |

    | -R | Generate Rock Ridge (RR) naming records to preserve filename length and
    casing, especially for UNIX/Linux environments. |

    | -A | Set an Application ID — a text string that will be written into the volume
    header of the image that can be useful to determine what applications are on the
    CD. |

    | -V | Set a Volume ID — a name that will be assigned to the image if it is burned
    and the disc is mounted in Solaris and Windows environments. |

    | -v | Set verbose execution, which is useful for viewing the status of the image
    as it is being made. |

    | -x | Exclude any directory immediately following this option; this option can
    be repeated (for example, ... -x /home/joe/trash -x /home/joe/delete ...) |


    # cdrecord


    The cdrecord utility uses audio, data, and mixed-mode (a combination of audio,
    video, and/or data-ROMs) using options to configure several aspects of the write
    process, including speed, device, and data settings.


    To use cdrecord, you must first establish the device address of your CD-R(W) device
    by running the following command as root at a shell prompt:


    ```

    cdrecord -scansbus

    ```


    This command will show all CD-R(W) devices on your computer. Remember the device
    address of the device you will use to write your CD. The following is an example
    output from running cdrecord:


    ```

    -scansbus

    cdrecord 1.8 (i686-pc-linux-gnu) Copyright (C) 1995-2000 Jorg Schilling

    Using libscij2 version ''schily-0.1''

    scansbus:

    0,0,0 0 *

    0,1,0 1 *

    0,2,0 2 *

    0,3,0 3 ''HP ''CD-Writer+ 9200 ''1.0c'' Removable CD-ROM

    0,4,0 4 *

    0,5,0 5 *

    ```'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Chapter 7: Diskettes and CD-ROMs 141


    | 0,6,0 | 6) * |

    | 0,7,0 | 7) * |


    To write the backup file image in the previous section, switch to the root user
    and use the following at a shell prompt:


    ```

    cdrecord -v -eject speed=4 dev=0,3,0 backup.iso

    ```


    The command above sets the speed at 4, the device address as 0,3,0, and sets write
    output to verbose (-v), which is useful for tracking the status of the write process.
    The -eject argument eject the CD-ROM after the write process is complete. The
    same command can also be used for burning ISO images downloaded from the Internet,
    such as Red Hat Linux ISO images.


    You can use cdrecord to erase CD-RW discs for reuse by typing the following:


    ```

    cdrecord --dev=0,3,0 --blank=fast

    ```


    # Additional Resources


    This chapter covers several applications briefly. Refer to the following resources
    for information about the applications in this chapter.


    # Installed Documentation


    +   * cdrecord man page — Discusses how to burn data, audio, and mixed-mode CD-ROMs.
    Offers all options and commands in detail, including some example commands for
    common CD-R(W) burning tasks.

    * /usr/share/doc/cdrecord-version (where version is the version of cdrecord installed
    on your system) — Several documentation files are included with general usage
    and licensing information.

    * mkisofs man page — Comprehensive detail of the utility, including some warnings
    about creating certain types of ISO images. The utility offers all options and
    commands in detail, including some example commands for creating common ISO image
    files.

    * /usr/share/doc/mkisofs-version (where version is the version of mkisofs installed
    on your system) — Several documentation files are included with general usage
    and licensing information.

    * /usr/share/doc/xdcroast-version (where version is the version of X-CD-Roast
    installed on your system) — Contains useful command-line options and usage information
    for this graphical CD-R(W) mastering application.

    * /usr/share/doc/dvdrecord-version (where version is the version of dvdrecord
    installed on your system) — For users who have DVD-R(+W) devices, this set of
    documentation helps you get started mastering DVD-ROMs for data backup and multimedia
    presentation.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Useful Websites


