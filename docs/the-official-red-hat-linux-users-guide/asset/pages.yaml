  md: '# Part I: Installing Red Hat Linux


    GRUB) or linux (for LILO). Other partitions may also have boot labels. If you
    would like to add or change the boot label for partitions that have been detected
    by the installation program, click once on the partition to select it. Once selected,
    you can change the boot label by clicking the Edit button.


    Select Default before the preferred boot partition to choose your default boot
    OS. You will not be able to move forward in the installation unless you choose
    a boot image.


    > NOTE The label column lists what you must enter at the boot prompt, in non-graphical
    boot loaders, in order to boot the desired operating system. After you have loaded
    the GRUB boot screen, use the arrow keys to choose a boot label or type to edit.
    You will be presented with a list of items in the configuration file for the boot
    label you have selected. At the graphical LILO screen, press Ctrl-x to exit the
    prompt. If you forget the boot labels defined on system, you can always press
    Tab at the prompt to display a list of boot labels.


    Boot loader passwords provide a security mechanism in an environment where physical
    access is available.


    If you are installing a boot loader, you should create a password to protect your
    system. Without a boot loader password, users with access to your system can pass
    options to the kernel, which can compromise your security. With a boot loader
    in place, the password must be first entered in order to select any options.


    If you choose to use a boot loader to enhance your security, be sure to select
    the checkbox labeled Use boot loader password. Once selected, enter a password
    and confirm.


    To configure more advanced boot loader options, such as changing the drive order
    or passing options to the kernel, be sure Configure advanced boot loader options
    is selected before clicking Next.


    # Advanced Boot Loader Configuration


    Now that you have chosen boot loader to install, you can also determine where
    you want the boot loader to be installed. You may install the boot loader in one
    of two places:


    +   * The master boot record (MBR) — This is the recommended place to install
    a boot loader, unless the MBR already starts another operating system loader,
    as System Commander. The MBR is a special area on your hard drive that is automatically
    loaded by your computer''s BIOS, and is the earliest point at which boot loader
    can take control of the boot process. If you install it in the MBR, when you make
    boots, GRUB (or LILO) will present a boot prompt. You can then boot Red Hat Linux
    or any other operating system that you have configured the boot loader.


    +   * The first sector of your boot partition — This is recommended if you are
    already using another boot loader on your system (Windows NT/2000/XP include boot
    loaders). In this case, your other boot loader will take control first. You can
    then configure that boot loader to start GRUB (or LILO), which will then boot
    Red Hat Linux.'
