- img_proc: true
  md: '# Table 9-2: Shell Prompt Compression Tools


    | Compression Tool | File Extension | Uncompression Tool |

    | --- | --- | --- |

    | gzip | .gz | gunzip |

    | bzip2 | .bz2 | bunzip2 |

    | Zip | .zip | unzip |


    # bzip2 and bunzip2


    To use bzip2 to compress a file, type the following command at a shell prompt:


    ```

    bzip2 filename

    ```


    The file will be compressed and saved as filename.bz2.


    To expand the compressed file, type the following command:


    ```

    bunzip2 filename.bz2

    ```


    The filename.bz2 is replaced with filename.


    You can use bzip2 to compress multiple files and directories into a single archive
    by listing them with a space between each one:


    ```

    bzip2 filename.bz2 file1 file2 file3 /usr/work/school

    ```


    The above command compresses file1, file2, file3, and the contents of the /usr/work/school
    directory (assuming this directory exists) and places them in a named filename.bz2.


    > TIP For more information, type man bzip2 and man bunzip2 at a shell prompt to
    read the man for bzip2 and bunzip2.


    # gzip and gunzip


    To use gzip to compress a file, type the following command at a shell prompt:


    ```

    gzip filename

    ```


    The file will be compressed and saved as filename.gz.


    To expand the compressed file, type the following command:


    ```

    gunzip filename.gz

    ```


    The filename.gz is replaced with filename.


    You can use gzip to compress multiple files and directories at the same time by
    listing them with a space between each one:


    ```

    gzip -r filename.gz file1 file2 file3 /usr/work/school

    ```'
