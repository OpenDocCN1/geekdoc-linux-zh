    # OpenOffice.org Draw


    If you would like to create graphics in your documents and presentations, you
    can use OpenOffice.org Draw. Using your mouse as you would a pen or a paintbrush,
    OpenOffice.org Draw allows you to make illustrations and save them in several
    formats that you can add to documents, place on websites, or attach to an email.


    To start OpenOffice.org Draw from the desktop, click the Main Menu button and
    choose ⇒ OpenOffice.org Draw (to start OpenOffice.org Draw from a shell prompt,
    type odraw). Figure 11-7 Shows OpenOffice.org Draw in action.


    ![](img/70f8904e8a1105c5df33b26207132b97_223_0.png)


    Figure 11-7. OpenOffice.org Draw'
