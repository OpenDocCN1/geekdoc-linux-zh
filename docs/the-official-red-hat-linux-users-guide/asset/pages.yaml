  md: '# Chapter 14: Audio, Video, and General Amusement 231


    # # Playing Digital Videos


    It has become more and more popular to play digital video movie files, such as
    Video Compact Discs (VCDs), Digital Versatile (or Video) disks (DVDs), and streaming
    video from the Web. Red Hat Linux offers a tool Xine that can play several digital
    video file formats on your graphical desktop.


    Xine uses a panel that lets you open files and media, control volume, create playlists,
    take screenshots of the video still, and more. Figure 14-4 shows the Xine panel
    playing a file.


    ![](img/70f8904e8a1105c5df33b26207132b97_258_0.png)


    Figure 14-4. The Xine Panel


    To start Xine, click the Main Menu and choose Extras ⮕ Sound & Video ⇞ Player
    (or type xine to start it from a shell prompt).


    To play a movie on disc, choose either VCD or DVD on the bottom of the panel.
    This should automatically load your video disk for viewing by pressing the Play
    Button.


    To play a file that you have downloaded from the Internet, choose the MRL browser
    on the left side of the panel will pop up a file browser that allows you to choose
    the video from a listing of your home directory. Choose the file and press the
    Play Button. You can close the MRL browser by clicking Dismiss.


    By default, Xine will play a file in a window on your desktop. To play a file
    full screen (where the video fills your desktop screen), click the Fullscreen/Window
    Mode button to the Quit at the top-right side of the panel. Right-click anywhere
    on the screen to hide the panel. When you are finished viewing the video, right-click
    again to show the panel and press the Quit button to quit Xine.


    For more information on Xine, type man xine at a shell prompt or visit the Xine
    home page at the following URL:


    ```

    http://xine.sourceforge.net

    ```


    # # Troubleshooting Your Sound or Video Card


    Although Red Hat Linux is about configuring sound and video hardware, there are
    times when the configuration either doesn''t happen properly or becomes corrupted.
    The following sections show how to troubleshoot your sound and video cards.


    # # Troubleshooting Your Sound Card


    If, for some reason, you do not hear sound and know that you have a sound card
    installed, you can run the Sound Card Configuration Utility.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# 232 Part III: Getting the Most from Your Red Hat Linux System


    Use the Sound Card Configuration Tool, click the Main Menu button and choose System
    Settings ⇌ Soundcard Detection. A small box will pop up prompting for your root
    password.


    > NOTE Most cards are supported by Red Hat Linux, but there are some cards that
    are not completely compatible or may not work at all. If you are having trouble
    configuring your sound card, check the Hardware Compatibility List at ~/hardware.redhat.com/
    to see if your card is supported.


    The Sound Card Configuration Utility probes your system for sound cards. If it
    detects a plug and sound card, it will automatically try to configure the correct
    settings for your card. You can then click the Play sound button to play a sound
    sample. If you can hear the sample, select OK and your sound card configuration
    is complete.


    ![](img/70f8904e8a1105c5df33b26207132b97_259_0.png)


    Figure 14-5. Sound Card Configuration Tool


    If the Sound Card Configuration Tool does not work (if the sample does not play
    and you still do not have audio sounds), although they are not quite as simple
    as running the Sound Card Configuration Tool. You can edit your modules.conf file
    as discussed below (this strategy is not recommended for most new users), or refer
    to the documentation that comes with your sound card for more information.


    If your sound card is not a plug and play card, you can manually edit /etc/modules.conf
    file to include the sound module that it should use, for example:


    ```

    alias sound sb

    alias midi opl3

    options opl3 io=0x388

    options sb io=0x2220 irq=7 dma=0,1 mpu io=0x300

    ```


    # Troubleshooting Your Video Card


    Video configuration is handled by the Red Hat Linux installation (see Chapter
    2). However, if you did not choose to configure a video card at that time, or
    if you need to reconfigure your settings, you can use the X Configuration Tool
    utility. You will want to do this, for example, if you install a new video card.


    > NOTE The X Configuration Tool will back up your system''s original video configuration
    file to /etc/X11/XF86Config.backup in case you need to switch back.'
