    # File System Types


    Red Hat Linux allows you to create different partition types, based on the file
    system they will use. This is a brief description of the different file systems
    available and how they can be utilized.


    **ext2** — An ext2 file system supports standard Unix file types (regular files,
    directories, symbolic links, etc.). It provides the ability to assign long file
    names, up to 255 characters. Versions prior to Red Hat Linux 7.2 use ext2 file
    systems by default.


    **ext3** — The ext3 file system is based on the ext2 file system and has one main
    advantage— journaling. Using a journaling file system reduces time recovering
    a file system after a crash as you do not need to fsck the file system (fsck utility
    is used to check the file system for metadata consistency and optionally repair
    one or more Linux file systems). The ext3 system will be selected by default and
    is highly recommended.


    **physical volume (LVM)** — Creating one or more physical volume (LVM) partitions
    allows you to create an LVM logical volume.


    **software RAID** — Creating two or more software RAID partitions allows you to
    create a RAID device. For more information regarding RAID, see the *Official Red
    Hat Linux Administrator''s Guide from Red Hat Press.*


    **swap** — Swap partitions are used for virtual memory. In other words, data is
    written to a swap partition when there is not enough RAM to store the data your
    system is processing.


    **vfat** — The VFAT file system is a Linux file system that is compatible with
    Windows long filenames from the FAT file system.'
