    # Plain Text Email Clients


    Most modern email clients allow the user to select whether they want to send their
    emails in

    text or in HTML. The advantage of HTML-formatted email is that they can contain\graphics
    and interactive links to websites. The particular font can be specified; the layout
    is

    very controllable; textures, pictures, or backgrounds can be added; all this makes
    for a visually

    apaling message when it gets to the recipient.


    On the other hand, plain text email is just that — plain text. There is nothing
    fancy, no pictures

    embedded in the email, and no special fonts. Plain text emails are simple.


    The term plain text refers to textual data in ASCII format. Plain text is the
    most portable

    format because it is supported by nearly every email application on various types
    of machines.


    This chapter will discuss two plain text email clients, Pine and Mutt.


