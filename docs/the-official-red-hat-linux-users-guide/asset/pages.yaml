  md: '# Chapter 1: Installation Options and System Requirements 9


    # Recording Your System''s Hardware


    Table 1-1 shows the information you need about your system''s hardware to install
    Red Hat Linux. It''s a good idea to write this information down as a handy reference
    to help make your Red Hat Linux installation go more smoothly.


    # Table 1-1. System Requirements Table


    | Hardware | Information Needed | Example |

    | --- | --- | --- |

    | Hard drive(s) | Type, label, size | IDE /dev/hda=1.2 GB |

