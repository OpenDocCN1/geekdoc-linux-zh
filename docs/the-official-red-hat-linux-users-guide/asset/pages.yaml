  md: '# 118 Part II: The Basics


    **NOTE** The original Panel is an edge Panel.


    +   * Floating Panel — A floating Panel can be moved anywhere on the screen.

    * Sliding Panel — A sliding Panel can be moved along any edge of the screen, but
