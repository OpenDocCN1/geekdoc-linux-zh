  md: '# Customizing Workspaces


    Workspaces are the equivalent of extra desktops on your system. By default, Red
    Hat Linux comes with four workspaces you can work with, but you are by no means
    limited to four. The following sections show you how to add and remove workspaces,
    drag applications across workspaces, and make a single application appear on all
    of your workspaces.


    # Adding or Removing Workspaces


    Depending on your needs, you may want more or fewer than the four default workspaces.
    To add or remove workspaces from your panel, right-click the Workspace Switcher
    Panel applet (refer to Figure 6-3) and choose Preferences. The Workspace Switcher
    Preferences window appears. From this window you can change the number of workspaces,
    to show only the first workspace (if you do not want any additional workspaces),
    or change the number of rows that your workspaces are displayed in.


    ![](img/70f8904e8a1105c5df33b26207132b97_146_0.png)


    Figure 6-14. The Workspace Switcher Preferences Window


    # Dragging Applications Across Workspaces


    Workspaces can be useful if you find you have a lot of opens at the same time
    and do not want all of them cluttering up single workspace. Using workspaces,
    you can group applications of a certain type on different workspaces. For example,
    if you are working with several Internet applications, several OpenOffice.org
    applications, and several graphics applications, you could have all of the Internet
    applications on one workspace, all of the OpenOffice.org applications on a second
    workspace, and all of the graphics applications on another.


    Moving an application across workspaces is easy; click the icon for an open window
    in one workspace on the Workspace Switcher Panel applet (refer to Figure 6-3)
    and drag it to a different workspace on the panel.


    > The current workspace is easily identified because it is the dark box among
    the rest of the workspaces, which are of a lighter color.


    After dragging the application to a different workspace, you can access the application
    by clicking on that workspace on the Workspace Switcher Panel applet and then
    clicking on the application.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Making One Window Appear on All Workspaces


    You may find that working with workspaces you have applications that you want
    to be accessible on all workspaces. For example, if you are waiting on an important
    email but do not want to keep switching workspaces to check your email, making
    one window appear on all workspaces would allow you to keep your eye on your client
    no matter what workspace you are using. To make one window appear on all desktops,
    click the down arrow in the upper left corner of the window. In the menu displayed,
    select Put on All Workspaces.


    # Changing Your System''s Appearance


    Some customization features do not really change the way you work with your system,
    but just change the look of your system. For example, your desktop background
    does not affect the way you work with your system, but it does change the appearance
    of your desktop.


    The following sections show how to change your system''s appearance.


    # Changing Themes


    Themes are becoming more and more popular in modern software; a theme is basically
    a different interface for your windows and graphical user interface.


    > TIP Even Mozilla 1.0 supports its own themes (choose View  Apply Theme from
    the Mozilla browser window).


    To change your theme, click the Main Menu button and choose Preferences ⇨ Theme,
    choose a theme from the Installed themes list, and click Close.


    ![](img/70f8904e8a1105c5df33b26207132b97_147_0.png)


    Figure 6-15. The Theme Preferences Window'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Chapter 6: Using the Graphical Desktop 121


    Red Hat Linux comes with the following choice of themes:


    +   * Bluecurve — This is the default theme for Red Hat Linux 8.0.


    +   * Raleigh — This theme is named after the city in North Carolina that Red
    Hat is based in looks a great deal like Red Hat Linux 7.x and earlier.


    +   * Redmond 95 — This theme is named after the city in Washington that Microsoft
    is based in, and looks quite reminiscent of Windows 95.


    +   * Metal — This theme looks like the default theme (called Bluecurve), but
    is colored differently and includes some metallic textures.


    New themes can be installed by dragging them from their location in a folder (or
    desktop) onto the Theme Preferences window.


    ![](img/70f8904e8a1105c5df33b26207132b97_148_0.png)


    Figure 6-16. The Metal Theme


    You can change your interface even more drastically by clicking the Window Borders
    tab and trying out some of the various window borders.'
