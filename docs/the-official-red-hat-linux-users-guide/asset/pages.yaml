    # Forgotten Password


    **Question:** Help! I forgot my root password. How do I log in now?


    You can log in using single-user mode and create a new root password.


    To enter single-user mode, reboot your computer. If you use the default bootloader,
    GRUB,

    can you enter single-user mode by following these steps:


    +   At the bootloader menu, press e to enter editing mode.


    +   You will be presented with a boot entry list. Look for the line that looks
    similar to the

    following:


    ```

    kernel /vmlinux-2.4.18-0 root=/dev/hda2

    ```


    Press the arrow key until this line is highlighted and press e.


    +   You can now add the word single one space after the end of the text to tell
    GRUB

    boot into single-user Linux mode. Press Enter to make the editing change take
    effect.


    +   You will be brought back to the edit mode screen. From here, press b and GRUB
    will

    boot single-user Linux mode. After it finishes loading, you will be presented
    with a shell

    prompt to the following:


    ```

    sh-2.05#

    ```


    +   You may now change the root password by typing


    ```

    bash# passwd root

    ```


    You will be asked to re-type the password for verification. After you are finished,

    password will be changed. You can then reboot by typing reboot at the prompt;
    then you can

    log in to root as you normally would.


    # Password Maintenance


    **Question:** I forgot or want to change my user account password.


    Open a shell prompt and type the following:


    ```

    passwd username

    ```


    Replace username with your normal user name.


    The password program will then ask for the new password, which you will need to
    enter twice.

    You can now use the new password to log in to your user account.


    > NOTE you cannot change any password but your own unless you are logged in as
    the root user.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Chapter 21: Frequently Asked Questions 299


    # Changing Login from Console to X at Startup


    **Question:** How do I change my login from the shell prompt to the graphical
    screen?


    Instead of logging in to your system at the console and typing the `startx` command
    to start the X Window System, you can configure your system so that you can log
    directly to X and bypass the shell prompt altogether.


    To do this you must edit the `/etc/initab` file by changing just one number in
    the runlevel section. The next time you log in, reboot the computer. You will
    have a graphical login.


    Open a shell prompt. If you''re logged in to your user account, su root by typing


    ```

    su

    Password: yourpassword

    ```


    Now type `pico /etc/inab` to edit the file with pico. The file /etc/init opens.
    On the first screen, you will see the runlevel section of the file, which looks
    like the following:


    ```

    # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    #

    id:3:initdefault:

    ```


    To change from a system prompt to a graphical login, you should change the number
    in the following line:


    ```

    id:3:initdefault: from a 3 to a 5.

    ```


    > **WARNING** Change only the number of the default runlevel from 3 to 5.


    Your changed line should look like the following:


    ```

    id:5:initdefault:

    ```


    When you are satisfied with your change, save and exit the file using the Ctrl-x
    keys. You will see a message telling you that the file has been modified, and
    asking you to confirm your change. Press y for yes.


    Now, your next login after reboot will be from the graphical screen.'
  merge: -1
