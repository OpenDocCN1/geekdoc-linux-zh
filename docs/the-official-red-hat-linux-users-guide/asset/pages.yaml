- img_proc: true
  md: '# Part VII: Appendices


    After you make any adjustments to your desktop configuration, click Apply to save
    the changes and choose the Panel configuration tool.


    Buttons for your desktops appear on the panel in the Desktop Pager. Simply click
    on the tiles to move to a different desktop.


    > TIP You can use the keyboard combination of the Ctrl and Function keys to switch
    desktops. For example, Ctrl-F2 will switch you from Desktop 1 to Desktop 2, Ctrl-F3
    will take you to Desktop 3, and so on.


    # Viewing the Taskbar


    The taskbar displays all running applications — both minimized and on the desktop.


    ![](img/70f8904e8a1105c5df33b26207132b97_367_0.png)


    Figure B-5. Applications on the Taskbar


    You can maximize running applications or bring them to the front of your working
    windows by clicking on the associated item on the taskbar.


    > TIP Another way to bring minimized background windows to the front is to use
    the Alt and Tab Keys. To pick an item from the taskbar, hold down Alt-Tab. To
    scroll through the tasks, hold down the Alt key, pressing the Tab key in succession.
    When you found the task you want to maximize and bring to the front, release both
    keys.


    # Adding Icons and Applets to the Panel


    To customize the Panel for your particular needs, you can include additional applets
    and icons (launchers).


    To add an applet to the panel, click the Main Menu button and choose Configure
    Panel ➞ Applet. Choose the applet you want from the menu and it will immediately
    appear on the Panel. You can move the applet by clicking on the app bar and choosing
    Move from the menu.


    To add a new launcher to the Panel, click the Main Menu button and choose Configure
    Panel ➞ Button and choose the application or resource you wish to add to the Panel.
    This will automatically add an icon to the Panel.


    # Configuring the Panel


    You can hide the panel automatically or manually, place it on any edge of your
    desktop, change its size and color, and change the way it behaves. To alter the
    default Panel settings, click the Main Menu button and choose Configure Panel
    ➞ Preferences. The Settings window will appear, allowing you to adjust all Panel
    settings, or any of the specific properties (Position, Hiding, Look & Feel, Menus,
    and so on).'
