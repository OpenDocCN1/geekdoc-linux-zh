  md: '# Appendix B: The KDE Desktop Environment 345


    ues and keyboard/mouse customization. You can also configure your shell prompt
    settings via the Konsole option. Privacy and encryption settings can be configured
    via the Crypto option.


    +   - System — This section is an advanced administration interface. You will
    need your root password to configure many of these options. This section allows
    you to configure system boot settings, Linux kernel configuration, printer settings,
