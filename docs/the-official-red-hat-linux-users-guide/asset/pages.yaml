  md: '# Chapter 11


    # Working with Documents


    Red Hat Linux includes several tools for managing all of your documents. Whether
    you are preparing for a business or school presentation, writing a formal letter,
    or opening a document from an email attachment, Red Hat Linux has a tool that
    suits your needs.


    This chapter shows you how to get up and running with the OpenOffice.org suite
    of applications, a new addition to Red Hat Linux in version 8.0, and shows you
    how to view PDF documents.


    # The OpenOffice.org Suite


    Office productivity suites are collections of applications to save time and assist
    users at the office, at school, and at home. Usually, productivity suites are
    graphical and include such applications as word processors, spreadsheets, and
    presentation utilities. The applications that comprise a productivity suite are
    integrated — meaning that you can, write a document with an embedded chart created
    by the spreadsheet application as well as a slide from a graphical presentation
    application.


    Integration of the software that makes up a productivity suite helps you to give
    impact to your presentations, lectures, or printed material.


    Red Hat Linux includes a powerful business productivity suite called OpenOffice.org,
    which incorporates several complementary applications into one integrated package.
    Using OpenOffice.org is much faster and easier than learning complex tasks to
    format your documents and presentations.


    The OpenOffice.org suite allows you complete control over the layout and content
    of your documents and lets you see the results as you edit. This real-time, visual
    form of document formatting is called what you see and what you get (or WYSIWYG
    — pronounced "wizzywig").


    # OpenOffice.org Features


    The OpenOffice.org suite contains several applications for creating and editing
    documents, spreadsheets, business presentations, and artwork. It includes templates,
    forms, and wizards for creating basic professional documents and presentations
    quickly. The OpenOffice.org suite is easy to read, edit, and create files in several
    formats, including files that are commonly associated with Microsoft Office, such
    as .doc (for Microsoft Word files), .xls (for Microsoft Excel files), and .ppt
    (for Microsoft PowerPoint files).'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 190 Part III: Getting the Most from Your Red Hat Linux System


    Table 11-1 shows the many different types of files you can use and tasks you can
    accomplish with the OpenOffice.org suite.


    # Table 11-1: OpenOffice.org Features


    | Application | File Compatibility | Document Types |

    |---|---|-|

    | OpenOffice.org Writer | .swd, .doc, .rtf, .txt, .htm/.html | Formal letters,
    business forms, school papers, resumes, newsletters |

    | OpenOffice.org Calc | .scx, .dbf, .xls, .sdc, .slk, .csv, .htm/.html | Spreadsheets,
    charts, tables, graphs, directories, address books, receipts and bills, small
    databases |

    | OpenOffice.org Impress | .sxi, .ppt, .sxd, .ssd | Business and academic presentations,
    Web presentations, lectures, slide shows |

    | OpenOffice.org Draw | .sxd, .sda; export files to several image formats, including
    .jpg, .bmp, .gif, and .png | Illustrations, line drawings, clip art, organizational
    charts |


    As you can see, the OpenOffice.org suite has many file compatibility features,
    and allows you to accomplish several tasks for academic, business, or home use.
    The following sections will show you how to use the OpenOffice.org suite.


    # OpenOffice.org Writer


    Writing documents using OpenOffice.org is similar to other word processing applications
    you have used before, such as Microsoft Word, WordPerfect, and so on. A word processor
    is like a text editor but has additional features that allow you to format, design,
    and print your documents without the need to memorize formatting tags or codes.
    OpenOffice.org Writer is a powerful processor that features WYSIWYG formatting
    — what you see in the OpenOffice.org Writer window is exactly what you will get
    if you print the document or if you give the document to someone else for them
    to view. Figure 11-1 shows OpenOffice.org Writer in action.


    To start OpenOffice.org Writer from your desktop panel, choose Main Menu ➡ Office
