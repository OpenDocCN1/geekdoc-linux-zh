  md: '# Boot Loader Configuration


    In order to boot the system without a boot diskette, you usually need to install
    a boot loader. Boot loader is the first program that runs when a computer starts.
    It is responsible for loading and transferring control to the operating system
    kernel software. The kernel, in turn, initializes the rest of the operating system.


    The installation program provides two boot loaders for you to choose:


    +   * GRUB (GRand Unified Bootloader), which is installed by default, is a very
    powerful boot loader. GRUB can load a variety of free operating systems, as well
    as proprietary operating systems by chain-loading (the mechanism for loading unsupported
    operating systems by loading another loader, such as MS-DOS or Windows).


    +   * LILO (Linux LOader) is a versatile boot loader for Linux. LILO does not
    depend on a specific file system, but can Linux kernel images from floppy diskets
    and hard disks, and can even boot other operating systems.


    ![](img/70f8904e8a1105c5df33b26207132b97_73_0.png)


    If you do not want to install GRUB as your boot loader, click Change boot loader.
    You can then choose to install LILO or not to install a boot loader at all.


    If you already have a boot loader that can boot Linux and do not want to overwrite
    your current boot loader, or if you plan to boot the system using boot diskettes,
    choose not to install a boot loader by clicking on Change boot loader.'
  merge: -1
  pgno: 73
