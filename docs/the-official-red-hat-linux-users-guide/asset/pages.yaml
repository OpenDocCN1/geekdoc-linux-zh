    +   * Low Security — This option will not allow remote connections to the system,
    including NFS connections and remote X System sessions. Services that run below
    port 1023 will not accept connections, including FTP, SSH, Telnet, and HTTP.


    +   * Disabled Firewall — This option does not create any security rules. This
    option should only be chosen if the system is on a trusted network (not the Internet),
    if the system is behind a firewall, or if you write your own custom firewall rules.
    If you choose this option and click Next, proceed to the “Activating the iptables
