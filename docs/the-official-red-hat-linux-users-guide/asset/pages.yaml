  md: '# Working with Konqueror


    Konqueror is the file manager and Web browser for the KDE desktop. Konqueror allows
    you to configure your KDE desktop, configure your Red Hat Linux system, play multimedia
    files, browse digital images, surf the Web, and all from one interface. This section
    explains some of the ways Konqueror can help you with and enjoy your Red Hat Linux
    system.


    # Managing Files with Konqueror


    To start Konqueror for file management, click on your home directory icon. Konqueror
    will open up in a window on your desktop, allowing you to navigate through your
    home directory throughout your Red Hat Linux system. After exploring, you can
    return to your home directory by clicking the Home button on the toolbar.


    ![](img/70f8904e8a1105c5df33b26207132b97_368_0.png)


    You can navigate the system by clicking on folders within the main window frame
    or through the hierarchical file system viewer over the navigation panel, as shown
    in Figure B-6. Files and folders in the main window frame can be moved or copied
    to any other folder or sent to the trash.


    > TIP You can also delete files and folders by right-clicking on the desired item
    and choosing Delete.


    Konqueror can also generate thumbnail icons for text, images, PostScript/PDF files,
    and Web files. You can even generate preview sounds from digital music files.
    From the toolbar choose View -> Preview and choose the file types for which you
    would like to see thumbnail icons'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'generated. Thumbnails will be immediately generated for any associated files
    in the Konqueror window.


    # The Navigation Panel


    Another useful feature of Konqueror is the navigation panel, which appears on
    the left side of the Konqueror window by default. The navigation panel makes many
    of your personalized resources available to you in convenient tabbed icons. Figure
    B-7 shows the navigation panel.


    ![](img/70f8904e8a1105c5df33b26207132b97_369_0.png)


    Figure B-7. Working with the Navigation Panel


    The navigation panel lets you access your Web bookmarks, browsing history, network
    resources, file system, and has a built-in media player for playing multimedia
    files without having to open a separate application. The navigation panel makes
    Konqueror an efficient solution for users who wish to have fast and easy access
    to all of their information.


    # Viewing Images with Konqueror


    You can also use the Konqueror file manager to view images. If you choose KDE
    as your default desktop environment, click on your home directory icon to access
    the Konqueror file manager:


    Using Konqueror as an image browser works similarly to Nautilus (discussed in
    the previous section). To configure Konqueror to view image files within a folder
    as automatically generated thumbnail icons, view View ⇨ Preview ⇒ Images. When
    you click on a thumbnail icon, the browser displays the image in its native size.'
  merge: -1
