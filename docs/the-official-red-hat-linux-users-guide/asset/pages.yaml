  md: '# 344 Part VII: Appendixes


    ![](img/70f8904e8a1105c5df33b26207132b97_371_0.png)


    Figure B-10. The Open With... Dialog Box


    # Customizing KDE


    KDE allows you to configure the desktop and your system to suit your needs. The
    KDE Control Center, available by clicking the Menu button and choosing Control
    Center, lets you customize the look and behavior of the desktop. The following
    list explains some of the configuration options in detail:


    +   * File Browsing — This section lists you to configure the Konqueror file manager
    and customize file operations. You can also associate files to applications that
    you prefer (for example, assigning all digital music files to open in XMMS instead
    of the default player).

    * Look & Feel — This section allows you to customize the visual aspect of your
    desktop environment. You can customize background images and configure fonts,
    themes, icons, Panel elements, screensavers, and window headers. You can also
    customize mouse and keyboard events, which makes working with the desktop as efficient
    for your needs as possible.


    > NOTE KDE features for smooth (anti-aliased) fonts. However, not all fonts are
    smooth by default. In order to have smooth fonts for your entire desktop (whether
    you are reading text files, Web pages, or text in menus and icons), you must choose
    fonts that are designed to be anti-alias, such as LucidaTypewriter or Courier).


    +   * Personalization — This section allows you to set country and language options
    to your particular locale. You can also configure accessibility features such
    as audible and visual'
  merge: -1
