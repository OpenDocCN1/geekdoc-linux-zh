  md: '# Chapter 8: Shell Prompt Basics 157


    can change the lines displayed by specifying a number option, as shown in the
    following command:


    ```

    head -20 filename

    ```


    # The tail Command


    The reverse of head is tail. Using tail, you can view the last ten lines of a
    file.


    # The grep Command


    The grep command is useful for finding specific character strings in a file. For
    example, if you want to find every reference made to "coffee" in the file sneakers.txt,
    you would:


    ```

    grep coffee sneakers.txt

    ```


    You will see every line in that file where the word "coffee" is found.


    > TIP Unless otherwise specified, grep searches are case sensitive. That means
    searching for "Coffee" is different from searching for "coffee." So, among grep''s
    options is -i, which allows you to make a case-insensitive search through a file.
    Read the grep page for more about this command.


    # I/O Redirection and Pipes


    You can use pipes and output when you want to store and/or print information to
    read at a later time.


    You can, for example, use grep to search for particular contents of a file and
    then have results saved as a file or send to a printer.


    To print the information about references to "coffee" in sneakers.txt, for example,
    just type the following:


    ```

    grep coffee sneakers.txt | lpr

    ```


    # Wildcards and Regular Expressions


    What if you forget the name of the file you are looking for? Using wildcards or
    regular expressions, you can perform actions on a file or files without knowing
    the complete filename. Just fill out what you know, substitute the remainder with
    a wildcard. Wildcards are special symbols that you substitute for letters, numbers,
    and symbols that make finding particular directories and files easier than examining
    long directory listings to find what you are searching for.


    > TIP To read more about wildcards and regular expressions, take a look at the
    bash man page (bash).


    Remember that you can save the file to a text file by typing man bash | -b > bash.txt.
    Then, you can open and read the file with less or pico (pico bash.txt). If you
    want to print the file, be aware that it is quite long.'
