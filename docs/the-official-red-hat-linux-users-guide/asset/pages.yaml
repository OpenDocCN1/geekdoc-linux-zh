    appropriate image file.


    # Which Installation Class Is Best for You?


    Usually, Red Hat Linux is installed on its own disk partition or sets of partitions,
    or another installation of Linux.


    > WARNING Installing Red Hat Linux over another installation of Linux (including
    Red Hat Linux) does not preserve any information (files or data) from a prior
    installation. Make sure you save any important files! To preserve the current
    data on your existing system, you should back up your data and/or performing an
    upgrade install (you can only upgrade from a previous Red Hat installation—see
    Chapter 3 for more information).


    The following installation types are available:


    +   - A personal desktop installation is most appropriate if you are new to the
    world of Linux and would like to give it a try. This installation will create
    a system for your home, laptop, or desktop use. A graphical environment will be
    installed.

    - A workstation desktop installation is most appropriate if you would like a graphical
    desktop environment and software development tools. This installation is good
    for Linux software developers who want to use the graphical desktop environment.'
