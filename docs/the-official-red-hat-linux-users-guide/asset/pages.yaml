  md: '# # Chapter 13

    # Choosing Your Internet Software


    In version 8.0, Red Hat Linux offers a wealth of choices of Web browsing and email
    software for the Internetあくまで. This chapter describes the major applications that
    you can choose from Red Hat Linux 8.0 for your Web browsing and email needs.


    # ## Web Browsing


    After you have configured your Internet connection (see Chapter 12), you are ready
    to get online and start surfing. Red Hat Linux comes with several open source
    browsers for you to choose from. This chapter briefly explains how to surf the
    Web using the following browsers:


    +   * Mozilla

    * Nautilus

    * Konqueror

    * Galeon


    # ## Mozilla


    Mozilla functions like any other Web browser. Mozilla has fairly standard navigation
    toolbars, buttons, and menus.


    If you have previously been using Netscape as your Web browser and performed an
    upgrade of Red Hat Linux, the first time you start Mozilla you will not see the
    main Mozilla browser (shown in Figure 13-5). Instead, you will first see Mozilla
    asking to convert your Netscape profile.


    ![](img/70f8904e8a1105c5df33b26207132b97_236_0.png)


    Figure 13-1. Mozilla Profile Creation'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'If you click Convert Profile, your prior Netscape bookmarks and preferences
    will be converted to a Mozilla profile for you. When you launch Mozilla, either
    from the panel or by clicking the Main Menu button and choosing Internet -> Web
    Browser, you will see that your previous bookmarks are now available in Mozilla.


    If you click Manage Profiles, you will have the opportunity to create one or more
    profiles, or user accounts, for Mozilla.


    ![](img/70f8904e8a1105c5df33b26207132b97_237_0.png)


    Figure 13-2. Mozilla Profile Manager


    Here you can choose to create a new profile or to create a profile based on your
    existing account. This feature helps you stay organized by creating separate user
    accounts for business use, personal use, etc.


    Creating Create Profile will take you to an information screen explaining what
    this process entails. To continue, click Next.


    ![](img/70f8904e8a1105c5df33b26207132b97_237_1.png)


    Figure 13-3. Profile Configuration'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Chapter 13: Choosing Your Internet Software 211


    Next, choose a name to use for this profile. If you do not enter a name, the profile
    will be called Default User.


    You can also click Choose Folder to select where your Mozilla settings and preferences
    will be stored. By default, these settings are stored in the following directory:


    ```

    /home/youraccountname/.mozilla/Default User

    ```


    When you click Finish, your new profile will be added.


