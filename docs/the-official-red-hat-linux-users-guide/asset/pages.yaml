- img_proc: true
  md: '# Chapter 16: Printer Configuration 251


    Next, the Printer Configuration Tool will help detect which printer is attached
    to the printer device you selected. If you are configuring a local printer and
    the model is auto-detected, the recommended driver is automatically selected and
    marked with an asterisk (*). If the tool detects the wrong printer or does not
    detect any printer, you can manually select one. The printers are organized by
    manufacturer. Click the arrow beside the manufacturer for your printer. Find your
    printer from the expanded list and click the arrow beside the printer name. A
    list of drivers for your printer will appear. Select one. If you do not know which
    to use, select the first one in the list. If you are having problems using that
    driver, edit the printer in the Printer Configuration tool and select a different
    driver. By using this process of elimination, you should be able to select a driver
    that works with your printer. If not, contact your printer''s manufacturer and
    ask them about Unix/Linux drivers.


    ![](img/70f8904e8a1105c5df33b26207132b97_278_0.png)


    Figure 16-5. Choosing a Printer Driver


    # Confirming Your Printer


    The last step is to confirm your printer. Click Apply if this is the printer that
    you want to add. Click Back to modify your printer configuration.


    The new printer will appear in the printer list in the main window. Click the
    Apply button in the main window to save your changes to the /etc/printcap configuration
    and restart the printer daemon (lp4). After applying the changes, tap a page test
    to ensure the configuration is correct (see the next section for details).


    # Printing a Test Page


    After you have configured your printer, you should print a test page to make sure
    the printer is functioning properly. Also, if you change the printer or modify
    the driver options, you should print a page test to test the different configuration.


    +   * To print a test page, select the printer that you want to test from the
    printer list and choose Print US Letter Postscript Test Page, Print A4 Postscript
    Test Page'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Part IV: Configuring Your Red Hat Linux System


    Page from the pull-down menu. If your printer does not support PostScript printing,
    choose to print the ASCII test page.


    # Modifying Existing Printers


    After adding your printer(s), you can edit settings by selecting the printer from
    the printer list and clicking the Edit button. The tabbed window shown in Figure
    16-6 will appear. The window contains the current values for the printer that
    you selected to edit. Make any changes and click OK. Click Apply in the main Printer
    Configuration Tool window to save the changes and restart the printer daemon.


    ![](img/70f8904e8a1105c5df33b26207132b97_279_0.png)


    Figure 16-6. Editing a Printer


    # Deleting a Printer


    To delete an existing printer, select the printer and click the Delete button
    on the toolbar. The printer will be removed from the printer list. Click Apply
    to save the changes and restart the printer daemon.


    # Setting the Default Printer


    To set the default printer, select the printer from the printer list and click
    the Default button on the toolbar. The default printer icon (which looks like
    a checkmark) appears in the first column of the printer list beside the default
    printer.'
