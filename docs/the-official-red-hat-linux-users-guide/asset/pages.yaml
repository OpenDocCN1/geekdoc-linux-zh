    # /proc/self/


    The /proc/self/ directory is a link to the currently running process. This allows
    a process to look at itself without having to know its process ID. Within a shell
    environment, a listing of the /proc/self/ directory produces the same contents
    as listing the process directory for that process.


    # /proc/bus/


    This directory contains information specific to various busses available on the
    system. For example, on a standard system ISA, PCI, and USB buses, current data
    on each of these buses is available in its directory /proc/bus/.


    The contents of the subdirectories and files vary greatly over the precise configuration
    of your system. However, each of the directories for each bus of type has at least
    one directory for each bus of type. Individual bus directories, usually signified
    with numbers as 00, contain binary files that refer to the various devices available
    on that bus.


    For example, a system with USB bus but no USB devices connected to it has a /proc/bus/usb/
    directory connecting several files.


    The /proc/bus/usb/ directory contains files that track the various devices on
    any USB busses, as well as the drivers required to use them. The /proc/bus/usb/001/
