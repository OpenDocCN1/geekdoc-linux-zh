    # **Deleting a Panel**


    To delete a Panel, right-click the Panel you want to delete and choose Delete
    this Panel from the menu that appears. All of the configuration settings of that
    Panel will be lost.


    > **WARNING** You can delete the original Panel, but all of the settings will
