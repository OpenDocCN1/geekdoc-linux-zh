    # Compressing Files from the Shell Prompt


    Compressed files use less disk space and download faster than large, uncompressed
    files.

    While File Roller is a useful utility for the graphical interface, you can also
    use the shell

    prom compress files. In Red Hat Linux you can compress files from the shell prompt
    with

    compression tools gzip, bzip2, or zip.

    The bzip2 compression tool is recommended because it provides the most compression
    and is

    found on most Unix-like operating systems. The gzip compression tool can also
    be found on

    most Unix-like operating systems. If you need to transfer files between Linux
    and other

    operating system such as Microsoft''s Windows, you should use zip because it is
    more\commonly used on those other operating systems.'
