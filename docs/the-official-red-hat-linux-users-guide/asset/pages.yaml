  md: '# 238 Part III: Getting the Most from Your Red Hat Linux System


    The interface of GQview is straightforward. The toolbar allows you to fit the
    display window, zoom in and out, and toggle between thumbnail view and text-only
    browser panels. It has a text field to enter a particular path to your image directories.
    Right-clicking on an image display opens a pop-up menu of image size and other
    file options such as renaming, moving, copying. You can also hide and unhide the
    thumbnail panel and toggle and full-screen modes within the pop-up menu.


    You can also combine functions within GQview and create a dynamic presentation
    effect for groups of images within a directory. In the text field below the toolbar,
    the path to the directory where your images are located and highlight the first
    image in the thumbnail file list on the left. Press v then s, and you will start
    a full-screen slideshow where GQview displays images against a black background
    over your desktop. By default, each image in the slideshow is presented for 15
    seconds. You can stop and resume the slideshow at any time by pressing s. When
    the slideshow ends, press v to exit full-screen mode.


    GQview can also be used to change your desktop wallpaper quickly and easily. Right-click
    on the image and choose Edit -> Set as wallpaper. From the Edit menu, you can
    also choose to open the file with a number of image editing utilities, including
    The GIMP, Xview, and Espan.


    GQview also allows you to customize several settings by clicking the Configure
    button. The configuration pop-up menu allows advanced users to configure a directory
    on startup, change thumbnail sizes, and even change the default image editors
    to manage the file if you would like to use one that is not listed.


    ![](img/70f8904e8a1105c5df33b26207132b97_265_0.png)


    Figure 15-4. The GQview Options Dialog Box'
  merge: -1
