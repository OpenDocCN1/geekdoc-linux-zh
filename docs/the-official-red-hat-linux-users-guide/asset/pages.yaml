  md: '# Chapter 6: Using the Graphical Desktop 123


    # Changing Desktop Backgrounds


    To change your desktop background, click the Main Menu button and choose Preferences
    Background. The Background Preferences window appears, from which you can change
    the background pattern or even drag a picture onto the window to make that picture
    your background.


    ![](img/70f8904e8a1105c5df33b26207132b97_150_0.png)


    Figure 6-19. Changing Your Desktop Background


    # Changing Window or Desktop Patterns


    This feature allows you to change the pattern for a window background or the desktop.
    To do so, from the Nautilus window edit Edit Backgrounds and Emblems and then
    click the Patterns button on the left. By default, the Patterns customization
    features are in front. On the Patterns window are different patterns that you
    can use to change the look of the Nautilus window or even your desktop. To find
    a pattern that you like, click it, and then drag it to either the Nautilus window
    or to the desktop and watch Nautilus (or the desktop) to change your pattern.
    Drag the Reset box onto the item to reset it to its original state.


    > NOTE As you are dragging a pattern across the screen, you can tell whether or
    not the item underneath can be changed by looking at the shape of the cursor.
    If the cursor shows a plus symbol, you can change the item underneath the pattern;
    if the cursor shows no plus symbol, dropping the pattern there will do nothing.'
  merge: -1
