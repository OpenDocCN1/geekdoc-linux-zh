- img_proc: true
  md: '![](img/70f8904e8a1105c5df33b26207132b97_144_0.png)


    Figure 6-12. Adding a Drawer to the Panel


    # Moving the Panel


    To move a Panel, right-click an empty spot on the Panel and choose Properties.
    Then click the desired Position for your Panel. The Position options will be different
    depending on the type of Panel you are dealing with.


    # Resizing the Panel


    To resize a Panel, right-click an empty spot on the Panel and choose Properties.
    Then pull down the Size: drop-down list and choose a new size for your Panel.
    The size for the default Panel is Medium (48 pixels).


    # Adding Panels


    To add a Panel, right-click any empty spot on the Panel and choose New Panel ➜
    Type, and select from among the following types of Panels:


    +   * Corner Panel — A Panel that sits in the corner.


    +   * Edge Panel — A Panel that sits along one edge of the screen.'
