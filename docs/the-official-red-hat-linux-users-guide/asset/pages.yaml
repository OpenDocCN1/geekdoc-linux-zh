  md: '# Chapter 2: Installing Red Hat Linux 53


    If you are connecting your system to the Internet but do not plan to run a server,
    this is the safest choice. If additional services are needed, you can choose Customize
    to allow specific services through the firewall.


    > NOTE If you select a medium or high firewall to be setup during this installation,
    network authentication methods (NIS and LDAP) will not work.


    # Medium


    If you choose Medium, your firewall will not allow remote machines to have access
    to certain resources on your system. By default, access to the following resources
    are not allowed:


    +   * Ports lower than 1023 — The standard reserved ports, used by most system
    services, such as FTP, SSH, telnet, HTTP, and NIS.

    * The NFS server port (2049) — NFS is disabled for both remote servers and local
    clients.

    * The local X System display for remote clients.

    * The X Font server port (by default, xfs does not listen on the network; it is
    disabled in the font server).


    If you want to allow resources such as RealAudio while still blocking access to
    normal system services, choose Medium. Select Customize to allow specific services
    through the firewall.


    > NOTE If you select a medium or high firewall to be set up during this installation,
    network authentication methods (NIS and LDAP) will not work.


    # No Firewall


    No firewall provides complete access to your system and does no security checking.
    Security checking is the disabling of a trusted network (not the Internet) or
    plan to do more firewall configuration layer. This should only be selected if
    you are running on a trusted network


    Choose Customize to add trusted devices or allow additional incoming services.


    +   * Trusted Devices — Selecting any of the Trusted Devices allows all traffic
    from that device; it is excluded from the firewall rules. For example, if you
    are running a local network but are connected to the Internet via a PPP dial,
    you can check eth0 and any traffic coming from your local network will be allowed.
    Selecting eth0 means all traffic over the Ethernet is allowed, put the ppp0 interface
    is still protected by the firewall. If you want to restrict traffic on an interface,
    leave it unchecked.


    > CAUTION It is not recommended that you make any device that is connected to
    public networks, such as the Internet, a trusted device.


    +   * Allow Incoming — Enabling these options allows the specified services to
    pass through the firewall. Note, during a workstation installation, the majority
    of these services are not installed on the system.'
