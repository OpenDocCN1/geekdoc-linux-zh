  md: 'If you are working with many files and folders in a given folder and want one
    folder to be very easy to spot compared to the others, right-click the icon and
    choose Stretch Icon from the menu. Little handles will appear at the icon''s corners;
    you can then stretch the icon by clicking on one of the handles and dragging it
    away from the center of the icon to make it larger or towards the center of the
    icon to make it smaller.


    To reset the icon to its original size, right-click the icon and choose Restore
    Icon''s Original Size.


    # Changing Your Screensaver


    Red Hat Linux 8.0 comes with some impressive screensavers.


    ![](img/70f8904e8a1105c5df33b26207132b97_154_0.png)


    Figure 6-24. Screensavers in Red Hat Linux


    To change your screensaver, click the Main Menu button and choose Preferences
    -> Screensaver. The Screensaver Preferences window appears, from which you can
    change your screensaver, modify the settings of a screensaver, and preview a screensaver.'
