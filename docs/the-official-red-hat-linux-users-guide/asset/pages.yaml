  md: '# Part I: Installing Red Hat Linux


    To run the text-based configuration tool, as type `sndconfig` in a terminal window.


    > Note `sndconfig` must be in runlevel 3.


    If the sound card configuration tools do not help, you may need to select the
    Enable sound server startup option under Sound in the Control Center. To do this,
    click on Preferences -> Control Center to launch the Preferences window. In the
    Preferences window, double click the Sound icon and select Enable sound server
    startup on the General tab and click OK.


    # Apache-based http service/Sendmail Hangs During Startup


    If you are having trouble with the Apache-based http service or Sendmail hanging
    at startup, make sure the following line is in the `/etc/hosts` file:


    ```

    127.0.0.1 localhost localdomain localhost

    ```


    # Removing Red Hat Linux


    To uninstall Red Hat Linux from your system, you will need to remove the GRUB
    or LILO information from your boot record (MBR).


    In MS-DOS, Windows 95/98/Me can use `fdisk` to create a new MBR with the undocumented
    flag `/mbr`. This will only rewrite the MBR to boot the primary DOS partition.
    The command should look like the following:


    ```

    fdisk /mbr

    ```


    If you need to remove Linux from a hard drive, and have attempted to do this with
    the default MS-DOS fdisk, you will experience the `Partitions exist but they do
    not exist` problem. The best way to remove non-MS-DOS partitions is with a tool
    that understands partitions other than MS-DOS (such as Windows 2000/XP, which
    are not based on MS-DOS).


    You can do this with the installation media by typing `linux expert` at the boot:
    prompt.


    Select install (versus upgrade) and at the point you should partition the drive,
    choose fdisk.


    In fdisk, press `p` to print out the partitions and then remove the Linux partitions
    with the `d` command. When you are satisfied with the changes you have made, you
    can quit with `w` and the changes will be saved to disk. If you deleted too much,
    press `q` and no changes will be made.


    After you have removed the Linux partitions, you can reboot your computer using
    Control-Alt-Delete instead of continuing the install.'
