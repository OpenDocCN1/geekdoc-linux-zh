- img_proc: true
  md: '# Part IV: Configuring Your Red Hat Linux System


    > **NOTE** Enabling WWW (HTTP) will not open a port for HTTPS. To enable HTTPS,
    specify it in the Other ports field.


    +   * **Mail (SMTP)** — If you want to allow mail delivery through your firewall
    so that remote hosts can connect directly to your machine to deliver mail, enable
    this option. You do not need to enable this if you collect your mail from your
    ISP''s server using POP3 or IMAP, or if you use a tool such as fetchmail. Note
    that an properly configured SMTP server can allow remote machines to use your
    server to send spam.

    * **FTP** The FTP protocol is used to transfer files between machines on a network.
    If you are planning on making your FTP server publicly available, enable this
    option. You need to install wuftpd (and possibly the anftpd) package for this
    option to be useful.

    * **Other ports** — You can allow access to ports that are not listed by listing
    them in the Other ports field. Use the following format: `port:protocol`. For
    example, if you want to allow IMAP access through your firewall, you can specify
    imap:tcp. You can also explicitly specify numeric ports. For example, to allow
    UDP packets on port 1234


    > **TIP** To specify multiple ports, separate them with commas.


    You must have the iptables service enabled and running to activate the security
    level. See the "Activating the Service" section later in this chapter for details.


    # GNOME Lokkit


    GNOME Lokkit allows you to configure firewall settings for an average user by
    constructing basic iptables networking rules. Instead of having to write the rules,
    this program asks you a series of questions about how you use your system and
    then writes the rules for you in the /etc/sysconfig/iptables file.


    > **NOTE** You should not try to use GNOME Lokkit to generate complex firewall
    rules. GNOME Lokkit is intended for average users who want to protect themselves
    while using a dial-up modem, cable modem, or DSL Internet connection.


    To configure specific firewall rules or disable specific services and deny specific
    hosts and users, use the *Official Red Hat Linux Administrator''s Guide* (Red
    Hat/Wiley 2003).


    To start GNOME Lokkit, type the command **gnome-lokkit** at a shell prompt. If
    you do not have the X Window System installed or if you prefer a text-based program,
    use the command **lokkit** to start the text-mode version of GNOME Lokkit.


    # GNOME Lokkit Configuration


    After starting the program, choose the appropriate security level for your system.'
