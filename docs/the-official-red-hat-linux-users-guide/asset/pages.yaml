    # XFree86


    Red Linux 8.0 uses XFree86 version 4.2 as its base X Window System, which includes
    the

    various X libraries, fonts, utilities, documentation, and development tools.


    > NOTE Red no longer provides the older XFree86 version 3 server packages. Before
    upgrading to the latest version of Red Hat Linux, make sure your video card is
    compatible with XFree86 version 4 by checking the Red Hat Hardware Compatibility
    List at http://hardware.redhat.com/hcl/.


    The server includes many cutting-edge XFree86 technology enhancements such as
    hardware

    3-D acceleration support, the XRender extension for anti-aliased fonts, a modular
    driver design, support for modern video hardware and input devices, and many other
    features.


    The Red Hat installation program installs the base components of XFree86. You
    may

    choose to install any optional XFree86 packages.


    The X Window System resides primarily in two locations in the file system:


    +   * /usr/X11R6/ directory — This directory contains X client binaries (in the
    bin directory), assorted header files (in the directory), libraries (in the lib
    directory), and manual pages (in the man directory), and other X documentation
    (in the /usr/X11R6/lib/X11/doc/ directory).

    * /etc/X11/ directory — The etc/X11/ directory contains all of the configuration
    files for the various components that make up the X Window System. This includes
    configuration files for the X server itself, the X font server (xfs), the X Display
    Manager (xdm), and many other base components.


    Display managers such as gdm and as well as various window managers and other
    tools, also store their configuration in this hierarchy.


    XFree86 version 4 is a single binary executable: /usr/X11R6/bin/XFree86. This
    server dynamically loads X modules at runtime from the /usr/X11R6/lib/modules/
    directory, including video drivers, font engine drivers, and other modules as
    needed. Some of these modules are automatically loaded by the server, whereas
    are optional features that you must specify in the XFree86 server''s configuration'
