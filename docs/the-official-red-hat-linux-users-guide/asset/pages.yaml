  md: '# Chapter 23: System Directories 311


    ```

    cpuid level      : 1

    wp               : yes

    flags            : fpu vme pse tsc mtr mce cx8 pge mmx syscall 3dnow k6_mtr

    bogomips         : 799.53

    ```


    When viewing different virtual files in the /proc/ file system, you will notice
    some of the information is easily understandable while some is not human-readable.
    This is in part why utilities exist to pull data from virtual files and display
    it in a useful way. Some examples of such applications are lspci, awk, free, and
    top.


    > NOTE Some of the files in the /proc/ directory are only read by the root user.


    As a general rule, most virtual files in the /proc/ directory are read-only. However,
    some can be used to adjust settings in the kernel. This is especially true for
    files in the /proc/sys/ subdirectory.


    To change the value of a virtual file, use the echo command and a > to redirect
    the new value to the file. For instance, to change your hostname on the fly, you
    can type:


    ```

    echo name.example.com > /proc/sys/kernel/hostname

    ```


    Other files are binary or boolean switches. For instance, if you type cat /proc/sys/net/ipv4/forward,
    you will either see 0 or 1. A 0 indicates the kernel is not forwarding network
    packets. By using the command to change the value of the ip_forward file to 1,
    you can immediately turn packet forwarding on.


    # Directories in /proc/


    Common groups of information concerning the kernel are grouped into directories
    and subdirectories within the /proc/ directory.


    # /proc Directories


    Every /proc/ directory contains a number of directories numerical names. A listing
    of them may start off like this:


    | dr-xr-xr-x 3 root     root      0 Feb 13 01:28 1 |

    | dr-xr-xr-x 3 root     root      0 Feb 13 01:28 1010 |

    | dr-xr-xr-x 3 xfs      xfs       0 Feb 13 01:28 1087 |

    | dr-xr-xr-x 3 daemon daemon   0 Feb 13 01:28 1123 |

    | dr-xr-xr-x 3 root     root      0 Feb 13 01:28 11307 |

    | dr-xr-xr-x 3 apache apache  0 Feb 13 01:28 13660 |

    | dr-xr-xr-x 3 root     root      0 Feb 13 01:28 1337 |

    | dr-xr-xr-x 3 rpcuser rpcuser 0 Feb 13 01:28 667 |


    These directories are called process directories because they are named after
    a program''s process ID and contain information specific to that process. The
    owner and group of each process directory is set to the user running the process.
    When the process is terminated, its /proc/ process vanishes.'
