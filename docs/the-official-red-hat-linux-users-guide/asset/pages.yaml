    # Additional Resources


    Much more can be said about the XFree86 server, the clients that connect to it,
    and the associated desktop environments and window managers. Advanced users interested
    in tweaking their XFree86 configuration will find these additional sources of
    information useful.


    # Installed Documentation


    The following documentation can be accessed from your Red Hat Linux system itself:


    +   * usr/X11R/lib/X11/doc/README — Briefly describes the XFree86 architecture
    and how to get additional information about the XFree86 project as a new user.


    +   * usr/X11R/lib/X11/doc/RELENTRIES — For advanced users that want to read about
    the latest features available in XFree86.


    +   * XFree86Config — Contains information about the XFree86 configuration files,
    including the meaning and syntax for the different sections within the files.


    +   * XFree86 — The primary page for all XFree86 information, details the difference
    between local and network X server connections, explores common environmental
    variables, lists command line options, and provides helpful administrative key
    combinations.


    +   * Xserver — Describes the X display server.


    # Useful Websites


    See the following websites for more information on XFree86:


    +   * http://www.xfree86.org — Home page of the XFree86 project, which produces
    the XFree86 open sourceforge of the X Window System.


    +   * http://dri.sourceforge.net — Home page of the DRI (Direct Rendering Infrastructure)
    project.


    +   * http://www.redhat.com/mirrors/LDP/HOWTO/XFree86-HOWTO — A HOWTO document
    detailing the manual installation and custom configuration of XFree86.


    +   * http://www.gnome.org — The home of the GNOME project.


    +   * http://www.kde.org — The home of the KDE desktop environment.'
