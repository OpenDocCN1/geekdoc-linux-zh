  md: '# Chapter 6


    # Using the Graphical Desktop


    Red Hat Linux includes a powerful graphical desktop environment where you can
    easily access your applications, files, and system resources. Both new and experienced
    users will be able to take full advantage of the Red Hat Linux system using the
    graphical desktop.


    This chapter covers the fundamentals of the Red Hat desktop (which is based on
    GNOME graphical user interface) and how you can customize it for your needs.


    # Introducing the Red Hat Desktop


    Your first view of the graphical desktop will look something like Figure 6-1.


    ![](img/70f8904e8a1105c5df33b26207132b97_132_0.png)


    Figure 6-1. The Graphical Desktop


    The graphical desktop gives you access to the applications and system settings
    on your computer. You will notice that it offers three main tools to make use
    of the applications on your system: Panel icons, desktop icons, and menus.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Part II: The Basics


    The long bar across the bottom of the desktop is called the Panel. The Panel contains
    application launchers, status indicators, and small applications called applets
    that enable you to control sound volume, switch workspaces, and monitor the status
    of your system.


    The icons elsewhere on the desktop can be file folders, application launchers,
    and removable devices such CD-ROM and diskettes when they have been mounted. To
    open a folder or launch an application, double-click on its icon.


    The menu systems can be found by clicking on the Main Menu button. They can also
    be found by clicking on the Start Here icon located on the desktop and double-clicking
    the Applications icon.


    The desktop works in the manner you might expect it to when working with other
    operating systems, such as Windows or Mac OS. You can drag and drop files and
    application icons to areas that are easily accessible. You can add new icons for
    files and applications to the desktop, panel, and file manager. You can change
    the appearance of most of the tools and well as change system settings using the
    provided configuration tools.


    # Introducing the Panel


    The Panel is the bar that stretches across the bottom of the screen and holds
    icons and small applications that make your system easier. The Panel also holds
    the Main Menu, which contains menu items for all of your applications. Applets
    allow you to run specific tasks or monitor your system or services, like the Red
    Hat Network, while remaining out of your way.


    ![](img/70f8904e8a1105c5df33b26207132b97_133_0.png)


    Figure 6-2. The Panel at the Bottom of the Desktop


    # Using the Main Menu


    You can click on the Panel''s Main Menu button (the big red hat icon on the left
    of the Panel) to expand it into a large set of menus that enable you to access
    the applications on your system. From here, you can start applications included
    in Red Hat Linux. Notice that in addition to the recommended applications, you
    can also access additional applications on the Extras entry. These submenu give
    you access to a full range of applications on your system. From the Main Menu,
    you can also do the following:


    +   * Log out

    * Run applications from a command line

    * Find files

    * Lock your screen (which runs a password-protected screen saver).'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Introducing Applets


    Applets are small applications that run on the Panel. Applets usually let you
    monitor things on your system or the Internet. Some have more specific tasks while
    others are designed to be entertaining.


    There are a few applets that run on your Panel by default. These applets are fairly
    important and are covered in the following sections.


    # Workspace Switcher


    The Workspace Switcher (see Figure 6-3) is a simple applet that allows you to
    see what applications you have open on your workspace (a workspace is also called
    a desktop). The graphical desktop gives you the ability to use multiple workspaces
    so you do not have to have all your running applications crossing one viewable
    desktop area. The Workspace Switcher represents each workspace in small squares
    and shows the applications running on them. You may click one of the squares with
    your mouse to move to that workspace.


    You can also use the keyboard shortcut Ctrl-Alt-Right Arrow or Ctrl-Alt-Left Arrow
    to switch between workspaces.


    ![](img/70f8904e8a1105c5df33b26207132b97_134_0.png)


    Figure 6-3. The Workspace Switcher


    # The Taskbar


    Next to the Workspace Switcher is the Taskbar. The Taskbar is an applet that shows
    the titles of running applications on any desktop. This is very helpful if you
    decide to minimize an application, as it will seem to disappear from the desktop.
    After it disappears, you can bring it back by clicking on its title in the Taskbar.


    ![](img/70f8904e8a1105c5df33b26207132b97_134_1.png)


    Figure 6-4. The Taskbar


    # Working with Icons


    An icon is a picture (usually small, although you can resize icons) or even devices
    or application launchers. Double-clicking an icon enables access to the target
    of the icon. To access the file or directory that an icon represents, either double-click
    the icon or right-click it and choose Open (or Open With. . . . if you want to
    choose the application with which to open the file). In Figure 6-1, you can see
    three icons on the desktop, as well as several icons on the Panel (also called
    applets).'
