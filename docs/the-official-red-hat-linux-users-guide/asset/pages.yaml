  md: '# # Chapter 25


    # ## Gathering System Information


    Sometimes you may need to gather essential system information. For example, you
    should know how to find the amount of free memory, the amount of available hard
    drive space, how your hard drive is partitioned, and what processes are running.
    This chapter discusses how to retrieve this type of information from your Red
    Hat Linux system using simple commands and a few simple programs.


    # ## System Processes


    The ps aux command displays a list of current system processes, including processes
    owned by other users. To display the owner of the processes along with the processes
    themselves, the command ps aux. This list is a static list; in other words, it
    is a snapshot of what is running when you invoke the command.


    If you want a constantly updated list of running processes, the top command (as
    described later in this section).


    The ps output can be long. To prevent it from scrolling off the screen, you can
    pipe it through less:


    ```

    ps aux | less

    You can use the ps command in combination with the grep command to see if a process
    is running. For example, to determine if emacs is running, use the following command:\ps
    ax | grep emacs

    ```


    The top command displays running processes and important information about them,
    including their memory and CPU usage. The list is both real-time and interactive.
    An example of top''s output is as follows:


