  md: '# Part II: The Basics


    Now, if you check your work with ls -ld you will see that only others will be
    denied the tiger directory.


    # Changing Permissions with Numbers


    Remember the reference to the shorthand method of chmod. Here is another way to
    change permissions, although it may seem a little complex at first.


    Go back to the original permissions for sneakers.txt (type ls -l sneakers.txt).


    ```

    -rw-rw-r--  1 sam sam  150 Mar 19 08:08 sneakers.txt

    ```


    Each permission can be represented by a numerical value:


    +   * r=4

    * w=2

    * x=1

    * --=0


    When these values are added together, the total is used to set specific permissions.
    For example, if you read and write permissions, you would have a value of 6; that
    is, 4 (read) + 2 (write) = 6.


    For sneakers.txt, here are the numerical permissions settings:


    | (rw-) | (rw-) | (r--) |

    | --- | --- | --- |

    | 4+2+0 | 4+2+0 | 4+0+0 |


    The total for the user is six, the total for the group is six, and the total for
    others is four. The permissions setting is read as 664.


    If you want to change sneakers.txt so those in your group will not have write
    access but still read the file, remove the access by subtracting 2 (from) from
    that set of numbers.


    The numerical values, then, would become six, four, and four (644).


    To implement these new settings, type:


    ```

    chmod 644 sneakers.txt

    ```


    Now verify the changes by listing the file. Type:


    ```

    ls -l

    sneakers.txt

    ```


    The output should be:


    ```

    -rw-r--r--  1 sam sam  150 Mar 19 08:08 sneakers.txt

    ```


    Now, neither the group nor others have write permission to sneakers.txt. To return
    the group''s write access for the file, add the value of w (2) to the second set
    of permissions.'
  merge: -1
