  md: '# Chapter 2: Installing Red Hat Linux 27


    | Command | What It Does |

    |---|---|

    | nousstorage | Disables the loading of the usbstorage module in the installation
    program''s loader. It may help with device ordering on SCSI systems. |

    | reboot=b | Changes the way the kernel tries to reboot the machine. If a kernel
