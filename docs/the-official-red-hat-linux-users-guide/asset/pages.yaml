  md: '# # Chapter 20

    # Package Management with RPM


    The RPM Package Manager (RPM) is an open packaging system that runs on Red Hat
    Linux as well as other Linux and Unix systems. Red Hat encourages other vendors
    to use RPM for their own products, and some (such as Mandrake Linux, which is
    based on Red Hat Linux) do use RPM. This chapter describes how to install and
    manage packages using RPM.


    > > NOTE If you''re new to Red Hat Linux or you prefer a graphical interface,
    you can use the Package Management Tool to manage RPM packages. See Chapter 19
    for details.


    # # Introducing RPM


    For the end user, RPM makes system updates easy. Installing, uninstalling, and
    upgrading RPM packages can be accomplished with short commands. RPM maintains
    a database of installed packages and their files, so you can invoke powerful queries
    and verifications on your system.


    During upgrades, RPM handles configuration files carefully so that you never lose
    your customizations — something that you will not accomplish with regular .tar.gz
    files.


    > > Because RPM makes changes to your system, you must be logged in as root to
    install, remove, or upgrade an RPM package.


    # # RPM Design Goals


    To understand how to use RPM, it can be helpful to understand RPM''s design goals:


    +   - **Upgradability** — Using RPM, you can upgrade individual components of
    your system without reinstalling. When you get a new release of an operating system
    based on RPM (such as Red Hat Linux), you do not need to reinstall on your machine
    (as you do with operating systems based on other packaging systems). RPM allows
    intelligent, fully-automated, in-place upgrades of your system. Configuration
    files in packages are preserved across upgrades, so you won''t lose your customizations.
    No special upgrades are needed to upgrade a package because the same RPM is used
    to install and upgrade the package on your system.

    - **Powerful Querying** — RPM is designed to provide powerful querying options.
    You can search through your entire database for packages or just for certain files.
    You can also easily find out what package file belongs to and from where the package
    came.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Part V: Updating and Adding Packages to Red Hat Linux


    files RPM package contains are in a compressed archive, with a custom header containing
    useful information about the package and its contents, allowing you to query individual
    packages quickly and easily.


    +   - System Verification — Another powerful feature is the ability to verify
    packages. If you are worried that you deleted an important file for some package,
    simply verify the package. You will be notified of any anomalies. At that point,
    you can reinstall the package if necessary. Any configuration files that you modified
    are preserved during reinstallation.

    - Pristine Sources — A crucial design goal was to allow the use of pristine software
    sources, as distributed by the original authors of the software. With RPM, you
    have the pristine sources along with any patches that were used, plus complete
    build instructions. This is an important advantage for several reasons.


    For instance, if a new version of a program comes out, you do not necessarily
    have to start from scratch to compile. You can look at the patch to see what you
    might need to do. The compiled-in defaults, and all of the changes that were made
    to get the software properly are easily visible using this technique.


    The goal of keeping pristine sources may only seem important for developers, but
    it results in higher quality software for end users.


    # Using RPM


    RPM has five basic modes of operation (not counting package building): installing,
    uninstalling, upgrading, querying, and verifying. The following sections contain
    an overview of each mode. For complete details and options try rpm --help, or
    see the “Additional Resources” section later in this chapter for more information
    on RPM.


    # Finding RPM Packages


    Before using an RPM, you must know where to find them. An Internet search will
    return RPM repositories, but if you are looking for RPM packages built by Red
    Hat, you can find them at the following locations:


    +   - The Red Hat Linux CD-ROMs

    - The Red Hat Errata Page at the following URL: http://www.redhat.com/apps/support/errata/

    - A Red Hat FTP mirror site; many of these mirror sites are available at the following
    URL: http://www.redhat.com/download/mirror.html

    - The Red Hat Network. See Chapter 19 for more information on the Red Hat Network


    # Installing a Package


    RPM packages typically have file names like foo-1.0.1386.rpm. The file name includes
    (foo), the package version (1.0), the release (1), and the architecture for'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Chapter 20: Package Management with RPM 281


    which the package was intended (i386). Installing this example package is as simple
    as logging in as root and typing the following commandat a shell prompt:


    ```

    rpm -Uvh foo-1.0-1.i386.rpm

    ```


    The -Uvh options follow the command specify that you want to install or upgrade
    the package, that you will verify verbose messages, and that you want to see hash
    (#) when the package is installing.


    If installation is successful, you will see the following:


    ```

    Preparing... ########################### [100%]

    foo ################################# [100%]

    ```


    As you can see, RPM prints out the name of the package and prints a succession
    of hash marks as the package is installed as a progress marker.


    The signature of a package is checked when installing or upgrading a package.
    Verifying the signature fails, you will see an error message as:


    ```

    error: V3 DSA signature: BAD, key ID 0352860f

    ```


    If it is a new, header-only signature, you will see an error message as:


    ```

    error: Header V3 DSA signature: BAD, key ID 0352860f

    ```


    If you do not have the appropriate key installed to verify the signature, the
    message will contain NOKEY such as:


    ```

    warning: V3 DSA signature: NOKEY, key ID 0352860f

    ```


    See the "Package''s Signature" section later in this chapter for more information
    on checking a package''s signature.


    Installing packages is designed to be simple, but you may sometimes see errors.
    The following describe the most common package installation errors.


    # Package Already Installed


    If the package of the same version is already installed, you will see the following
    error:


    ```

    preparing... ############################ [100%]

    package foo-1.0-1 is already installed

    ```


    If you want to install the package again and the same version you are trying to
    install is already installed, you can use the --replacepkgs option, which tells
    RPM to ignore the error. The installation command would then look like:


    ```

    rpm -ivh --replacepkgs foo-1.0-1.i386.rpm

    ```


    This option is helpful if files installed from the RPM were deleted or if you
    want the original configuration files from the RPM to be installed.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Part V: Updating and Adding Packages to Red Hat Linux


    # Conflicting Files


    If you attempt to install a package containing a file that has already been installed
    by another package or an earlier version of the same package, you will see the
    following error:


    ```

    Preparing...########################################### [100%]

    file /usr/bin/bin from install of foo-1.0.0 conflicts with file from package bar-2.0.20

    ```


    To make RPM ignore this error, use the --replacefiles option as:


    ```

    rpm -ivh --replacefiles foo-1.0-1.1386.rpm

    ```


    # Unresolved Dependency


    RPM packages can depend on other packages, which means that they require other
    packages to be installed in order to run properly. If you try to install a package
    that has an unresolved dependency, you will see the following error:


    ```

    Preparing...########################################### [100%]

    error: Failed dependencies:

    bar.so.2 is needed by foo-1.0-1

    Suggested resolutions:

    bar-2.0.20-3.1386.rpm

    ```


    If you are installing an official Red Hat package, the system will usually suggest
    the package(s) to resolve the dependency. You can then find this package on the
    Red Linux CD-ROMs or from the Red Hat FTP site (or mirror), and add it to the
    command, as:


    ```

    rpm -ivh foo-1.0-1.1386.rpm bar-2.0.20-3.1386.rpm

    ```


    If installation of both packages is successful, you will see the following output:


    ```

    Preparing...########################################### [100%]

    1:foo############################################### [50%]

    2:bar############################################### [100%]

    ```


    If the system does not suggest a package to resolve the dependency, you can try
    the --redhatprovides option to determine which package contains the required file.
    You need the rpmdb-redhat package installed to use this option.


    ```

    rpm -q --redhatprovides bar.so.2

    ```


    If the package that contains bar.so.2 is in the installed database from the rpmdb-redhat
    package, the name of the package will be displayed:


    ```

    bar-2.0.20-3.1386.rpm

    ```


    If you want to force the installation anyway (a bad idea since the package probably
    will not run correctly), use the --nodeps option.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Chapter 20: Package Management with RPM 283


    # # Uninstalling a Package.


    Uninstalling a package is just as simple as installing one. Type the following
    command at a shell prompt:


    ```

    rpm -e foo-1.0-1.i386.rpm

    ```


    > **NOTE** Make sure to use the actual name of the original package in your uninstall
    command.


    You may encounter a dependency error when uninstalling a package if another installed
    package depends on the one you are trying to remove. For example:


    ```

    Preparing ################################# [100%]

    error: removing these packages would break dependencies:

    foo is needed by bar-2.0.20-3.i386.rpm

    ```


    To cause RPM to ignore this error and uninstall the package (which is also a bad
    idea because the package that depends on it will probably fail to work properly),
    use the --nodeps option.


    # # Upgrading


    Upgrading a package is similar to installing one. To upgrade the foo package,
    for example, you would type the following command at a shell prompt:


    ```

    rpm -Uvh foo-2.0-1.i386.rpm

    ```


    The use of -U option in the command above makes RPM automatically unalls all old
    versions of the foo package


    > **TIP** You may want to use -U to install packages;the command will work even
    when there are no previous versions of the package installed.


    Because RPM performs intelligent upgrading of packages with configuration files,
    you may see a message similar to the following:


    ```

    saving /etc/foo.conf as /etc/foo.conf.rpmsave

    ```


    This message means that your changes to the configuration file may not be forward
    compatible with the new configuration file in the package, RPM saved your original
    file and installed a new one.


    You should investigate the differences between the two configuration files and
    resolve them as rapidly as possible to ensure that your system continues to function
    properly.


    Upgrading is a combination of uninstalling and installing, so during an RPM upgrade
    you may encounter uninstalling and installing errors, plus one more. If RPM thinks
    you are trying to upgrade to a package with an older version number, you will
    see an error message similar to the following:


    ```

    package foo-2.0-1 (which is newer than foo-1.0-1) is already installed

    ```'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 284 Part V: Updating and Adding Packages to Red Hat Linux


    To force RPM to "upgrade" anyway, use the --oldpackage option, as follows:


    ```

    rpm -Uvh --oldpackage foo-1.0-1.i386.rpm

    ```


    # Freshening a Package


    Freshening a package is similar to upgrading one. To freshen the foo package,
    for example, type the following command at a shell prompt:


    ```

    rpm -Pvh foo-1.2-1.i386.rpm

    ```


    RPM''s freshen checks the versions of the packages specified in the command against
    the versions of packages that have already been installed on your system. When
    a new version of an already-installed package is processed by RPM''s freshen,
    it will be upgraded to the newer version. However, RPM''s freshen option will
    not install a package if no previously-installed package of the same name exists.
    This differs from RPM''s upgrade option, as an upgrade will install packages whether
    or not an older version of the package was already installed.


    RPM''s freshen works for single packages or a group of packages. If you have just
    downloaded a large number of different packages and only want to upgrade those
    that are already installed on your system, freshening will do the job. If you
    use freshening, you will not have to delete any unwanted packages from the group
    that you have downloaded before using RPM.


    In this case, you can simply issue the following command:


    ```

    rpm -Pvh *.rpm

    ```


    RPM will automatically upgrade only those packages that are already installed.


    # Querying a Package


    Use -q command to query the database of installed packages. The rpm -q foo command
    will print the package name, version, and release number of the installed package:


    ```

    foo-2.0-1

    ```


    > NOTE that we used the package name foo. To query a package, you will need to
    replace foo with the actual package name.


    Instead of specifying the package name, you can use the following options along
    with -q to specify the package(s) you want to query. These are called Package
    Specification Options.


    +   - a — Queries all currently installed packages.


    +   - f file — Queries the package which owns file. When specifying a file, you
    must specify the full path of the file (for example, /usr/bin/1s).


    +   - pZ packagefile — Queries the package packagefile.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Chapter 20: Package Management with RPM 285


    There are a number of ways to specify what information to display about queried
    packages.

    The following options are used to select the type of information for which you
    are searching.

    These are called Information Selection Options.


    +   - i — Displays package information including name, description, release, size,
    build date, install vendor, and other miscellaneous information.

    - -1 — Displays the list of files that the package contains.

    - s — Displays the state of all the files in the package.

    - d — Displays a list of files marked as documentation (man pages, info pages,
    READMEs, etc.).

    - c — Displays a list of files marked as configuration files. These are the files
    you after installation to adapt the package to your system (for example, sendmail.cf,
    passwd, inittab, etc.).


    > TIP For options that display lists of files, you can add -v to the command to
    display the lists in a familiar 1s -format.


    # Verifying a Package


    Verifying a package compares information about files installed from a package
    with the same information from the original package. Among other things, verifying
    compares the size, MD5 sum, permissions, type, owner, and group of each file.


    The command rpm -V verifies a package. You can use any of the Package Selection
    Options listed for querying to specify the packages you wish to verify. A simple
    use of rpm -V foo (where foo is the package you are verifying), verifies that
    all the files in the foo package are as they when they were originally installed.


    For example:


    +   - To verify a package containing a particular file (in this case, the vi file),
    use the following command:

    - rpm -Vf /bin/vi

    - To verify ALL installed packages, use the following command:

    - rpm -Va

    - To verify an installed package against an RPM package file, use the following
    command:

    - rpm -Vp foo-1.0-1.1386.rpm


    If everything verified properly, there will be no output. If there are any discrepancies,
    they will be displayed. The format of the output is a string of eight characters
    (a c denotes a configuration file) and then the file name. Each of the eight characters
    denotes the result of a comparison of one attribute of the file to the value of
    attribute recorded in the RPM'
  merge: -1
  pgno: 312
