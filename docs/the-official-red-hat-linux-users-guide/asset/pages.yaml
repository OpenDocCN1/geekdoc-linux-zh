    from the pull-down menu on the page shown in Figure 12-5. Otherwise, the Select
    Ethernet Adapter window appears.


    > NOTE The installation program usually detects supported Ethernet devices and
    prompts you to configure them. If you configured any Ethernet devices during the
    installation, they will already appear in the hardware list on the Hardware tab.'
