    | Extension | File Type |

    | --- | --- |

    | .html / .htm | An HTML file |

    | .jpg | A JPEG image file |

    | .pdf | An electronic image of a document (PDF stands for Portable Document Format)
    |

    | .png | A PNG image file (PNG stands for Portable Network Graphic) |

