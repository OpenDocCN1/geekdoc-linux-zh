  md: '# Part I


    # Installing Red Hat Linux


    Installing Red Hat Linux has never been easier than with Red Hat Linux 8.0.


    This part shows you how to determine whether or not your hardware is compatible
    with Red Hat Linux as well as whether or not your system has enough space to hold
    the operating system. It also shows you how to install Red Hat Linux, taking you
    through all of the major options that you can use to do so, and shows you how
    to use the Setup Agent to set up your new Red Hat system as well as other tasks
    that you might want to perform after installing Red Hat Linux.


    # Chapter 1: Installation Options and System Requirements


    # Chapter 2: Installing Red Hat Linux


    # Chapter 3: Upgrading Your Current System


    # Chapter 4: After Installation . . .'
