  md: '# Part VI: Additional References


    directory contains a hierarchy of special files that represent the current state
    of the kernel — allowing applications and users to peer into the kernel''s view
    of the system.


    Within the /proc/ directory, one can find a wealth of information about the system
    hardware and any processes running. In addition, some of the files within the
    /proc/ directory tree can be manipulated by users and applications to communicate
    configuration changes to the kernel.


    # A Virtual File System


    In Linux, all data are stored as files. Most users are familiar with the two primary
    types of files: text and binary. But the /proc/ directory contains another type
    of file called virtual file. It is for this reason that /proc/ is often referred
    to as a virtual file system.


    These virtual files have unique qualities. Most of them are listed as zero bytes
    in size and when one is viewed, it can contain a large amount of information.
    In addition, most of the time and date settings on virtual files reflect the current
    time and date, indicative of the fact they are changing.


    Virtual files such as interrupts, /proc/meminfo, /proc/mounts, and /proc/partitions
    provide an up-to-the-moment glimpse of the system''s hardware. Others, like /proc/filesystems
    and the /proc/sys/ directory provide system configuration information and interfaces.


    For organizational purposes, files containing information on a similar topic are
    grouped into virtual directories and subdirectories. For instance, /proc/ide/
    contains information for all physical IDE devices. Likewise, process directories
    contain information about each running process on the system.


    # Viewing Virtual Files


    By using the cat, more, or less commands on files within the /proc/ directory,
    you can immediately access an enormous amount of information about the system.
    For example, if you want to see what your computer has, cat /proc/cpuinfo and
    you will see output similar to the:


    ```

    processor : 0

    vendor_id : AuthenticAMD

    cpu family : 5

    model : *

    model name : AMD-K6 (tm) 3D+ Processor

    stepping : 1

    cpu Mhz : 400.919

    cache size : 256 KB

    dfub_bug : no

    hlt_bug : no

    f00f_bug : no

    coma_bug : no

    fpu : yes

    fpu_exception : yes

    ```'
