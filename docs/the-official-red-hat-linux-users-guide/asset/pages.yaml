    # # The Graphical Installation Program User Interface


    If you have used a graphical user interface (GUI) before, you will be familiar
    with this process; simply use your mouse to navigate the screens, "click" buttons,
    or enter text fields. You can also navigate through the installation using the
    Tab and Enter keys.


    > > If you do not wish to use the GUI installation program, the text mode installation
    program is also available. Use the boot command boot text to start the text mode
    installation program. Please refer to the section "The Text Mode Installation
    Program User Interface" for an overview of text mode installation instructions.


    # # A note about Virtual Consoles


    The Red Hat installation program offers more than the dialog boxes of the installation
    process. Several different kinds of diagnostic messages are available to you,
    in addition to providing a way to enter commands from a shell prompt. The installation
    program displays these messages on five virtual consoles, among which you can
    switch using a single keystroke combination. These virtual consoles could be helpful
    if you encounter a problem while installing Red Hat Linux. Messages displayed
    on the installation or system consoles can help pinpoint a problem. See Table
    2-1 for a listing of the virtual consoles, keystrokes used to switch to them,
    and their contents.'
