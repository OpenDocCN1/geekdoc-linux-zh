    - /home — Typical location of user home directories.


    # The File System Hierarchy Standard (FHS)


    Red Hat is committed to the Filesystem Hierarchy Standard (FHS), a collaborative
    document that defines the names and locations of many files and directories. The
    current FHS document is the authoritative reference to any FHS-compliant file
    system, but the standard leaves many areas undefined or extensible. In this section,
    we provide an overview of the standard and a description of the parts of the file
    system not covered by the standard.


    The complete standard is available at:


    ```

    http://www.pathname.com/fhs

    ```


    Compliance with the standard means many things, but the most important are compatibility
    with other FHS-compliant systems and the ability to mount a /usr partition read-only
    because it contains common executables and is not meant to be changed by users.
    Because /usr directory is mounted read-only, it can be mounted from the CD-ROM
    or from another machine via a read-only NFS mount.


    # Why Share a Common Structure?


    An operating system''s file system structure is its most basic level of organization.
    Almost all of the ways an operating system interacts with its users, applications,
    and security model are dependent on the way it stores its files on a storage device.
    It is crucial for a variety of reasons that users, as well as programs, be to
    refer to a common guideline to where to read and write files.


    A file system can be seen in terms of two logical categories of files:


    +   - Shareable vs. unshareable files — Shareable files are those that can be
    accessed by various hosts; unshareable files are not available to any other hosts.

    - Variable vs. static files — Variable files can change at any time without intervention;
    static files, such as read-only documentation and binaries, do not change without
    an action from the system administrator or an agent that the system administrator
    has in motion to accomplish that task.


    The reason for looking in these files is to help you understand the type of permissions
    given to the directory that holds them. The way in which the operating system
    and its users need to use the files determines the directory where those files
    be placed, whether the directory is mounted read-only or read-write, and the level
    of access allowed each file. The top level of this organization is crucial, as
    the access to the underlying directories can be restricted or security problems
    may manifest themselves if the top level is left disorganized or without a widely-used
    structure.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Chapter 23: System Directories 307


    However, simply having a structure does not mean much unless it is a standard.
    Competing structures can actually cause more problems than they fix. Because of
    this, Red Hat has chosen the most widely used file system structure for Unix-like
    systems (FHS) and has extended it only slightly to accommodate special uses defined
    within Red Hat Linux.


    # FHS Organization


    The directories and files noted here are just a subset of those specified by the
    FHS document. Check the latest FHS document at http://www.pathname.com/fhs for
    the most information.


    # /dev Directory


    /dev directory contains file entries that represent devices that are attached
    to the system. These files are essential for the system to function properly.


    # /etc Directory


    /etc is reserved for configuration files that are local to your machine. No binaries
    are to be put in /etc. Any binaries that were formerly in /etc should now go into
    /bin or sbin.


    The X11 and skel directories are subdirectories of /etc. The X11 directory is
    for configuration files such as X86Config. The skel directory is for "skeleton"
    user files, which are used to populate a home directory when a user is first created.


    # /lib Directory


    /lib directory should contain only libraries that are needed to execute the binaries
    in /bin and /sbin. These shared library images are particularly important for
    booting the system and executing commands within the root system.


    # /mnt Directory


    /mnt directory is for temporarily mounted files systems, such as CD-ROMs and floppy
    disks.


    # /opt Directory


    /opt directory provides an area for large, static application software packages
    to be stored.


    For packages that wish to avoid putting their files throughout the file system,
    /opt provides a logical and predictable organizational system under that package''s
    directory. This gives the system administrator an easy way to determine the location
    of each file within a particular package.


    For example, if sample is the name of a particular software package located within
    /opt, then all of its files could be placed within directories inside /opt/sample,
    such as /opt/sample/bin for binaries and /opt/sample/man for manual pages.


    Large packages that encompass many different subpackages, each of which accomplish
    a particular task, also go within /opt, giving that large package a standardized
    way to organize'
  merge: -1
