    # Using Mutt


    Mutt is a very powerful text-based client for Unix operating systems.


    Mutt''s configuration file, ~/.muttrrc, gives its flexibility and configurability.
    It is also this file that might give new users problems. The number of options
    that Mutt has available to send, receive, and read your mail. As is true with
    all the functions that Mutt uses with powerful software, it takes time to understand
    the features and what they can do for you.


    Most of the options are invoked using the set or unset commands, with either Boolean
    string values, e.g. set folder = ~/Mail.


    All configuration options can be changed at any time by typing : (colon) followed
    by the relevant command hints at the top of the screen. To turn these hints back
    on, type : set help.


    If you cannot remember the command you want to use, there is always tab-completion
    to help you.


    You do not have to type all your preferred configuration commands each time you
    run; you can save them in a file that is loaded every time the program starts.
    This configuration must exist in your home directory; it has been named either
    ~/.muttrrc or ~/.muttrrc.


    When you launch Mutt, the first thing you see is a screen with a list of email
    messages. Your initial menu is called the index.'
