    # # Custom Installations


    During *custom installation*, you have complete control over the packages that
    will be installed on your system. The custom installation allows you the most
    flexibility during your installation. The personal desktop, workstation, and server
    installations automatically go through the installation process for you omit certain
    steps.


    The recommended disk space requirements for a custom installation are as follows:


    +   - Custom (minimum): 400MB

    - Custom (choosing everything): 4.5GB


    As you might guess from the name, a custom installation puts the emphasis on flexibility.
    You have complete control over which packages will be installed on your system.


    If you choose automatic partitioning, a custom installation will create the following
    partitions:


    +   - The swap partition — The size of the swap partition is determined by the
    amount of RAM in your system and the amount of space available on your hard drive.
    For example, if you have 128 MB of RAM, then the swap partition created can be
    128 MB - 256 MB (twice your RAM), depending on how much disk space is available.

    - /boot — A 100 MB partition in which the Linux kernel and related files reside.

    - / — The root partition within which all other files are stored (the exact size
    of this partition is dependent on your available disk space).


    # # Upgrading Your System


    Upgrading from Red Hat Linux 6.2 (or greater) will not delete any existing data.
    The installation program updates the modular kernel and all currently installed
    software packages. See Chapter 3 for instructions on upgrading your system.'
