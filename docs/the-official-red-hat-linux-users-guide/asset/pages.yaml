  md: 'For instance, you find a file called saturday without an extension. Using the
    file command, you can tell what type of file it is by typing


    ```

    file saturday

    ```


    In the example, the command output display tells you the file is an ASCII text
    file. Any file that is designated as a text file should be readable by the cat,
    more, or less commands, or using a text editor.


    > TIP To learn more about file, read the man page by typing man file. For more
    information on helpful commands for reading files, see Chapter 8.


    # File Compression and Archiving


    Sometimes it is useful to store a group of files in one file so that they can
    be backed up, transferred to another directory, or even transferred to a different
    computer. It is also useful to compress files into one file so that they use less
    disk space and download faster.


    It is important to understand the distinction between an archive file and a compressed
    file. An archive file is a collection of files and directories that are stored
    in one file. The archive file is not compressed—it uses the same amount of disk
    space as the individual files and directories combined. A compressed file is a
    collection of files and directories that are stored in one file and in a way that
    uses less disk space than the individual files and directories combined. If you
    do not have enough disk space on your computer, you can compress files that do
    not use very often or files that you want to save but do not use anymore. You
    can create an archive file and then compress to save even more disk space.


    > NOTE An archive file is not compressed, but a compressed file can be an archive
    file.


    # Using File Roller


    Red Hat Linux includes a graphical utility called File Roller that can compress,
    decompress, and archive files and directories. File Roller supports Unix and Linux
    file compression and archiving formats, and has a simple interface and extensive
    help documentation if you need it. It also has the advantage of being integrated
    into the graphical desktop environment and file manager manager.


    To start File Roller, click Main Menu ⇨ Accessories ⇨ Archive Manager. You can
    also start File Roller from a shell prompt by typing file-roller. Figure 9-1 shows
    File Roller in action.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Chapter 9: Managing Files and Directories 173


    ![](img/70f8904e8a1105c5df33b26207132b97_200_0.png)


    Figure 9-1: File Roller


    > If you use a file manager (such as Nautilus), you can simply double-click the
    file you wish to unarchive or decompress to start File Roller. The File Roller
    window will appear with the decompressed/unarchived file in a folder to extract
    or browse.


    # Decompressing and Unarchiving with File Roller


    To compress and unarchive a file, click the Open toolbar button. A file menu will
    pop up, allowing you to choose the file you wish to work with. For example, if
    you have a file foo.tar.gz it will appear in the main File Roller browser window
    as a folder, which you can navigate by double-clicking the file. File Roller reveals
    all directory and subdirectory hierarchies, which is convenient if you are looking
    for a particular file in the archive. You can extract individual files or entire
    archives by clicking the Extract button, choosing the directory where you would
    like to save the unarchived files, and clicking OK.


    # Creating Archives with File Roller


    If you need to free up drive space, or send multiple files or a directory of files
    to another user over email, File Roller allows you to create archives of your
    files and directories. To create a new archive, click New on the toolbar. A file
    browser will pop up, allowing you to specify an archive name and the technique
    (you can usually leave this as Automatic and simply type in the file name and
    file extension in the provided text box). Click OK, and your new archive is now
