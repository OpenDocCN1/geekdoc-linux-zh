    # ## Using Free Space from an Active Partition


    This is the most common situation. Unfortunately, it is also the hardest to handle.
    The main problem is that, even if you have enough free space, that space is presently
    allocated to a partition that is already in use.


    If you purchased a computer with preinstalled software, the hard disk most likely
    has one massive partition holding the operating system and data.


    Aside from adding new hard drive to your system, you have two choices: destructive
    repartitioning and non-destructive repartitioning. The following sections discuss
    both of these choices in detail.


    # ## Destructive Repartitioning


    Basically, destructive repartitioning involves deleting the single large partition
    and creating several smaller ones. As you might imagine, any data you had in the
    original partition is destroyed. This means that making a complete backup of any
    files that you don''t want to lose is necessary. For your own sake, make two backups
    of important files, use verification (if available in your backup software), and
    try to read data from your backup *before* you delete the partition.


    > >CAUTION If there was an operating system of some type installed on that partition,
    it will need to be reinstalled as well (assuming you want to continue using that
    operating system, of course). Be aware that some computers sold with preinstalled
    operating systems may not include the CD-ROM media to reinstall the original operating
    system. The best time to notice if this applies to your system is before you delete
    your partition and its operating system installation.


    After creating a smaller partition for your existing software, you can reinstall
    any software, restore your data, and continue your Red Hat Linux installation.
    Figure D-10 shows this being done.


    > >NOTE New computers often come with recovery disks so that you can restore your
    computer to its factory settings in case your operating system becomes corrupted.
    Using these recovery disks will undo everything you did with fdisk.'
