  md: '# # Part V

    # Updating and Adding Packages to Red Hat Linux


    Linux installs new applications with files called *packages*. Packages are similar
    to executables in Windows — installing a new package typically involves a new
    application on your Linux system. Using RPM files, you can install new applications
    simply by double-clicking the RPM file in a graphical environment. If you''re
    more comfortable using the command-line interface, or system prompt, you can use
    the `rpm` command from the system prompt. This part shows you how to install and/or
    update packages using either of these methods.


    +   - Chapter 19: Package Management

    - Chapter 20: Package Management with RPM'
