  md: '# Chapter 5: Getting Started 103


    > **IMPORTANT** You can fancy or plain when you pick a user account name, but
    take precautions when you choose a password. The password is the key to your account,
    so it should be both unique and easy for you to remember. Your password should
    be at least six characters. You can use both uppercase and lowercase letters,
    well as numbers and characters. Avoid easily guessed selections such as qwerty
    password. If you want to pick an easy-to-remember but somewhat unique password,
    consider a variation of a word that substitutes numbers and/or symbols for some
