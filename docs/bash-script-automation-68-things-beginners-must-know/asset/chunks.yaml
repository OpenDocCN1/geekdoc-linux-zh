    The $PATH variable is an environment variable in Unix-based systems like Linux
    and macOS. It tells the shell where to search for executable files when you enter
    a command. Without properly setting the $PATH, the shell may not find executables
    even if they are installed on the system. This concept is crucial for script automation.


    The following code demonstrates how the $PATH variable works by showing the current
    directories where the shell looks for executable files, and how you can add a
    directory to it.


    [Code Example]


    # Display the current $PATH value


    echo $PATH


    # Temporarily add a new directory to the $PATH (for the current session)


    export PATH=$PATH:/new/directory/path


    # Verify that the new directory is now included in $PATH


    echo $PATH


    [Execution Result]


    /usr/local/bin:/usr/bin:/bin:/new/directory/path


    The $PATH is a colon-separated list of directories that tells the shell where
    to look for executables. When you type a command, the shell searches these directories
    in order until it finds the appropriate program. If the program is not found,
    you''ll get a "command not found" error.echo $PATH prints the current list of
    directories.export PATH=$PATH:/new/directory/path appends a new directory to the
    $PATH for the current session. This change is temporary and will reset when you
    close the terminal unless you add the export command to your shell configuration
    file (like .bashrc or .bash_profile).


    [Supplement]


    Adding directories to $PATH allows you to run custom scripts or programs from
    any location in the terminal without typing the full path.Be careful when modifying
    $PATH. Always include the existing value $PATH when making changes, so you don''t
    overwrite the original directories.


    ## 22\. Using source to Execute Another Script in the Current Shell


    Learning Priority★★★★☆


    Ease★★★☆☆


    The source command is used to run a script within the current shell session, meaning
    that any changes made by the script (like setting variables) will persist after
    the script ends. This is different from running a script normally, which spawns
    a new shell.


    The following code example demonstrates how to use the source command to run another
    script and retain any environment changes.


    [Code Example]


    # Create a script that exports a variable


    echo ''export MY_VAR="Hello from the script"'' > script.sh


    # Use source to run the script in the current shell


    source script.sh


    # Verify that the variable is available in the current shell


    echo $MY_VAR


    [Execution Result]


    Hello from the script


    The source command executes a script in the current shell context. If the script
    contains commands that modify the environment (like exporting variables or changing
    directories), those changes will remain in effect after the script finishes. This
    is useful for setting up environment variables or other configurations that need
    to persist across a shell session.If you simply run the script using ./script.sh,
    it will be executed in a subshell, and any changes made to the environment (like
    exporting a variable) will not affect the parent shell.source script.sh is equivalent
    to using the shorthand . script.sh.


    [Supplement]


    source is commonly used to load environment configurations or set up shell settings
    from files like .bashrc or .bash_profile.Be mindful of sourcing scripts that contain
    commands like cd, as they can change your working directory and affect the rest
    of your session.


    ## 23\. Using $(<filename) to Assign File Content to a Variable


    Learning Priority★★★★☆


    Ease★★★★☆'
