  trans: "\n\n为了在终端中通过输入脚本名称来运行脚本，你必须使用 `chmod +x` 命令赋予其执行权限。\n\n### 代码示例\n\n```bash\n\
    # 首先，创建脚本\necho -e '#!/bin/bash\\necho \"This is an executable script!\"' > script.sh\n\
    \n# 然后，使其具有可执行权限\nchmod +x script.sh\n\n# 现在你可以直接运行它\n./script.sh\n```\n\n###\
    \ 执行结果\n\n这是一个可执行的脚本！\n\n`chmod +x script.sh` 命令修改了脚本的权限，允许用户执行它。默认情况下，新创建的脚本没有执行权限，除非你显式更改权限，否则系统将不允许你直接运行它们。运行\
    \ `chmod +x script.sh` 后，可以使用 `./script.sh` 执行脚本。如果你不赋予其可执行权限，则需要使用 `bash script.sh`\
    \ 来运行，这不需要执行权限，但操作不够方便。\n\n### 补充\n\n`chmod` 命令代表“change mode”（更改模式），用于修改 Unix\
    \ 类系统中的文件权限。`+x` 标志为脚本添加了执行权限，这意味着它可以作为程序运行。\n\n## 3. 使用 ./script.sh 执行脚本\n\n\
    学习优先级★★★★★\n简单程度★★★★☆\n\n要在终端中执行 Bash 脚本，请在确保脚本具有执行权限后，使用 `./script.sh` 命令。这是使用\
    \ Bash 自动化任务时最先要学习的内容之一。\n\n要从命令行运行 Bash 脚本，你需要确保脚本具有执行权限。然后，你可以使用 `./script.sh`\
    \ 执行它。\n\n### 代码示例\n\n```bash\n# 步骤 1：确保你的脚本具有可执行权限\nchmod +x script.sh\n\n# 步骤\
    \ 2：执行脚本\n./script.sh\n```\n\n### 执行结果\n\n如果脚本正确，它将运行并显示脚本内部命令的输出。例如，如果 `script.sh`\
    \ 包含：`#!/bin/echo \"Hello, World!\"`\n\n终端将输出：\n\nHello, World!\n\n`chmod +x script.sh`\
    \ 命令赋予脚本执行权限。如果没有这个权限，脚本将无法运行。`./` 指定脚本在当前目录中。如果脚本位于其他位置，处，你必须提供正确的路径（例如 `~/scripts/myscript.sh`）。脚本开头的\
    \ `#!/bin/bash` 被称为“shebang”，它告诉系统该脚本应该使用 Bash shell 运行。\n\n### 补充\n\n如果你遇到类似\
    \ permission denied（拒绝访问）的错误，通常意味着脚本没有适当的执行权限。使用 `./script.sh` 可确保你从当前目录运行脚本，而在不带\
    \ `./` 运行 `script.sh` 只有在目录位于系统的 `PATH` 中时才会生效。\n\n## 4. 在 Bash 中不带空格赋值变量\n\n\
    学习优先级★★★★☆\n简单程度★★★★☆\n\n在 Bash 脚本中，变量赋值时变量名、等号和值之间不能有空格。这对于防止错误并确保脚本按预期运行非常重要。\n\
    \n在 Bash 脚本中为变量正确赋值时，等号周围不能有任何空格。\n\n### 代码示例\n\n```bash\n#!/bin/\n\n# 给变量赋值（等号周围没有空格）\n\
    my_var=\"Hello, World!\"\n\n# 输出变量的值\necho $my_var\n```\n\n### 执行结果\n\nHello,\
    \ World!\n\n如果你在等号周围放置空格，例如 `my_var = \"Hello, World!\"`，你将得到一个错误。\n\n### 补充\n\
    \n`chmod` 命令代表“change mode”（更改模式），用于修改 Unix 类系统中的文件权限。`+x` 标志为脚本添加了执行权限，这意味着它可以作为程序运行。\n\
    \n## 5. 使用 $(command) 捕捉输出\n\n学习优先级★★★★★\n简单程度★★★★☆\n\n在 Bash 中，`$(command)` 允许你将命令的输出捕捉到一个变量中。当你之后需要处理命令的结果时非常有用。\n\
    \n### 代码示例\n\n```bash\n#!/bin/\n# 捕获日期\ncurrent_date=$(date)\n\n# 打印捕获的日期\necho\
    \ \"Today's date is $current_date\"\n```\n\n### 执行结果\n\n今天的日期是 [Current Date]\n\
    \n## 6. 使用 $? 检查上一个命令的退出状态\n\n学习优先级★★★★★\n简单程度★★★☆☆\n\n在 Bash 中，每个命令都会返回一个退出状态。0\
    \ 表示成功，任何非零值均表示错误。你可以通过检查 `$?$ 来判断命令是否成功。\n\n### 代码示例\n\n```bash\n#!/bin/\n# 尝试进入目录\n\
    cd /nonexistent/directory\n\n# 检查上一个命令的状态\nif [ $? -eq 0 ]; then\n    echo \"\
    Directory changed successfully.\"\nelse\n    echo \"Failed to change directory.\"\
    \nfi\n```\n\n### 执行结果\n\nFailed to change directory.\n\n"
- fmt: "\n`[[ ... ]]` is more robust than `[ ... ]` because it handles special characters\
    \ and logical operators more gracefully. It avoids issues like word splitting\
    \ and allows for advanced features such as regex-style pattern matching (`==`,\
    \ `!=`). Unlike `[ ... ]`, it does not require special quoting for variables containing\
    \ spaces.\n\n### Supplement\n`[[ ... ]]` is specific to Bash and not available\
    \ in all shells. In POSIX-compliant scripts, `[ ... ]` should be used. Inside\
    \ `[[ ... ]]`, pattern matching works without needing `*` to be quoted, whereas\
    \ `[ ... ]` requires careful quoting to avoid globbing and expansion.\n\n## 8.\
    \ Always Quote Variables to Prevent Word Splitting and Globbing\n\nLearning Priority:★★★★★\n\
    Ease:★★★★☆\n\nIn Bash scripting, it's important to always quote variables when\
    \ they are expanded. Without quoting, the shell might split the variable's contents\
    \ by whitespace or perform unintended filename expansion (globbing), which can\
    \ lead to unexpected results.\n\nQuoting variables with `\" \"` ensures that their\
    \ contents are treated as a single value, avoiding issues like word splitting\
    \ and globbing.\n\n### Code Example\n```bash\n#!/bin/# Without Without, the variable\
    \ could be split by spaces\nfilename=\"my file.txt\"\n\n# Incorrect usage (no\
    \ quotes):\n# This will break if the filename contains spaces\nif [ -e $filename\
    \ ]; then\n    echo \"$filename exists\"\nelse\n    echo \"$filename does not\
    \ exist\"\nfi\n\n# Correct usage (with quotes):\nif [ -e \"$filename\" ]; then\n\
    \    echo \"$filename exists\"\nelse\n    echo \"$filename does not exist\"\n\
    fi\n```\n\n### Execution Result\n```text\nmy file.txt does not exist  # Incorrect\
    \ result without quotes\nmy file.txt exists         # Correct result with quotes\n\
    ```\n\nWhen variables aren't quoted, Bash may split the value at spaces or other\
    \ special characters (known as word splitting). Additionally, if the variable\
    \ contains wildcard characters like `*` or `?`, Bash might try to expand them\
    \ into filenames in the current directory (globbing). Always quoting variables\
    \ ensures they are handled as single, literal values.\n\n### Supplement\nQuoting\
    \ isn't just for filenames. Always quote variables when used in any expression\
    \ to avoid unwanted behavior. `\"$@\"` is a special case in function arguments:\
    \ it should always be quoted to preserve argument separation when passed as a\
    \ whole.\n\n## 9. Using \"$@\" to Safely Handle All Script Arguments\n\nLearning\
    \ Priority:★★★★★\nEase:★★★★☆\n\nThe `\"$@\"` variable in Bash scripting allows\
    \ you to safely pass all the arguments provided to a script. It preserves the\
    \ integrity of spaces and special characters in arguments, making it the most\
    \ reliable way to handle multiple parameters.\n\nWhen writing a Bash script, `\"\
    $@\"` ensures that each argument is handled as a separate entity, even if it contains\
    \ spaces. This is especially important when dealing with filenames or arguments\
    \ that include spaces or special characters.\n\n### Code Example\n```bash\n#!/bin/#\
    \ A simple script to echo all provided arguments safely\necho \"All arguments\
    \ passed to the script:\"\n\n# \"$@\" treats each argument separately, even if\
    \ it has spaces\nfor arg in \"$@\"; do\n  echo \"$arg\"\ndone\n```\n\n### Execution\
    \ Result\n```text\n$ ./script.sh \"file 1.txt\" file2.txt \"file 3.txt\"\nAll\
    \ arguments passed to the script:\nfile 1.txt\nfile2.txt\nfile 3.txt\n```\n\n\
    Using `\"$@\"` ensures that each argument is treated individually, even when arguments\
    \ contain spaces. Without the quotes around `\"$@\"`, arguments with spaces could\
    \ be broken into multiple arguments. Compare this with using `$*`, which concatenates\
    \ all arguments into a single string, splitting them based on spaces. This can\
    \ lead to errors when handling filenames with spaces.\n\n### Supplement\n`\"$@\"\
    ` behaves similarly to positional parameters like `$1`, `$2`, etc., but it's a\
    \ shorthand for handling all arguments in one go. `\"$@\"` ensures compatibility\
    \ across different environments and avoids common pitfalls when handling complex\
    \ inputs like filenames with spaces.\n\n## 10. Accessing Command-Line Arguments\
    \ with $1, $2, etc.\n\nLearning Priority:★★★★☆\nEase:★★★☆☆\n\nIn Bash scripting,\
    \ positional parameters like `$1`, `$2`, and so on allow you to directly access\
    \ individual command-line arguments. Each argument passed to the script corresponds\
    \ to a specific number, with `$1` being the first, `$2` the second, and so forth.\n\
    \nUsing positional parameters is a straightforward way to retrieve specific arguments\
    \ passed to a Bash script. However, you need to be careful with spacing and missing\
    \ arguments, as each is tied to a specific index.\n\n### Code Example\n```bash\n\
    #!/bin/# A script to show how to access specific command-line arguments\necho\
    \ \"The first argument is: $1\"\necho \"The second argument is: $2\"\necho \"\
    The third argument is: $3\"\n```\n\n### Execution Result\n```text\n$ ./script.sh\
    \ apple banana cherry\nThe first argument is: apple\nThe second argument is: banana\n\
    The third argument is: cherry\n```\n\n`$1` accesses the first argument, `$2` the\
    \ second, and so on. These are called positional parameters. If fewer arguments\
    \ are provided than expected, the corresponding variables will be empty. For example,\
    \ if you run the script without the third argument, `$3` will be empty.\n\n###\
    \ Supplement\n`$0` refers to the script's name or path, while `$#` gives the total\
    \ number of arguments passed. Be cautious: when arguments contain spaces, they\
    \ should be wrapped in quotes when passed to avoid being split into separate arguments.\n\
    \n## 11. Counting Command-Line Arguments with $#\n\nLearning Priority:★★★★★\n\
    Ease:★★★★☆\n\nThe `$#` variable in Bash automatically keeps track of the number\
    \ of arguments passed to a script. This is useful when a script needs to behave\
    \ differently depending on the user's input. The following example shows how to\
    \ use `$#` to count the number of arguments.\n\n### Code Example\n```bash\n#!/bin/#\
    \ Simple script to count and display the number of arguments\necho \"You have\
    \ passed $# arguments to the script.\"\n\n# Optional: Loop through arguments to\
    \ display them\nif [ $# -gt 0 ]; then\n  echo \"Here are the arguments:\"\n  for\
    \ arg in \"$@\"; do\n    echo \"$arg\"\n  done\nelse\n  echo \"No arguments were\
    \ passed.\"\nfi\n```\n\n### Execution Result\n```text\n$ ./count_args.sh apple\
    \ banana orange\nYou have passed 3 arguments to the script.\nHere are the arguments:\n\
    apple\nbanana\norange\n\n$ ./count_args.sh\nYou have passed 0 arguments to the\
    \ script.\nNo arguments were passed.\n```\n\n`$#` holds the number of arguments\
    \ passed to the script. If no arguments are passed, `$#` will equal zero. The\
    \ `for arg in \"$@\"` loop iterates over all arguments provided, while `\"$@\"\
    ` expands to each argument as a separate string, preserving whitespace and other\
    \ special characters.\n\n### Supplement\n`$@` vs `$*`: `$@` treats each argument\
    \ as a separate entity, while `$*` treats all arguments as a single string. In\
    \ case of no arguments, `$#` is zero, and `$@` expands to an empty string.\n\n\
    ## 12. Using shift to Process Command-Line Arguments Sequentially\n\nLearning\
    \ Priority:★★★★☆\nEase:★★★☆☆\n\nThe `shift` command in Bash is used to move through\
    \ positional parameters (arguments) one by one. After `shift` is executed, the\
    \ first argument (`$1`) is removed, and all other arguments are shifted down by\
    \ one position.\n\nThe following example demonstrates how to use `shift` to process\
    \ and remove arguments sequentially.\n\n### Code Example\n```bash\n#!/bin/# Script\
    \ to process each argument using shift\necho \"Processing arguments sequentially:\"\
    \n\nwhile [ $# -gt 0 ]; do\n  echo \"Current argument: $1\"\n  shift # Move to\
    \ the next argument\ndone\necho \"All arguments processed.\"\n```\n\n### Execution\
    \ Result\n```text\n$ ./shift_example.sh first second third\nProcessing arguments\
    \ sequentially:\nCurrent argument: first\nCurrent argument: second\nCurrent argument:\
    \ third\nAll arguments processed.\n```\n"
