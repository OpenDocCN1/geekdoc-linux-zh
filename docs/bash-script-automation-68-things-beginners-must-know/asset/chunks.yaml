    `real`: 实际经过的时间，从开始到结束（包括所有的系统时间和用户时间）。`user`: 在用户模式下花费的 CPU 时间，即进程本身所消耗的时间。`sys`:
    操作系统代表该进程在系统（或内核）模式下花费的时间。在上面的示例中，`sleep 2` 会等待 2 秒后才结束，因此 `real` 时间反映了这一点。由于没有进行重度处理，`user`
    和 `sys` 时间接近于零。


    [补充]


    `time` 是许多 Linux 和类 Unix 系统中内置的 Shell 命令。它对于性能调优非常有用，特别是在优化运行较慢的脚本或命令时。`user`
    时间和 `sys` 时间之间的差异可以帮助识别脚本是更受限于 CPU 限制（`user` 时间）还是在大量使用系统资源（`sys` 时间）。


    ## 74. 使用环境变量代替硬编码路径


    学习优先级★★★★★


    难度★★★☆☆


    在脚本中硬编码文件路径会导致使其变得僵化，并且难以在不同的环境中复用。相反，你应该使用环境变量，这允许脚本在不进行修改的情况下，灵活地运行于各种系统。


    此示例展示了如何使用 `$HOME` 环境变量而不是在脚本中硬编码用户的家目录。


    [代码示例]


    ```

    # 不要硬编码路径，使用 $HOME 以增加灵活性

    cd $HOME/Documents


    # 打印路径以验证是否使用了正确的目录

    echo "Current directory: $HOME/Documents"

    ```


    [执行结果]


    ```

    Current directory: /home/username/Documents

    ```


    `$HOME` 是一个预定义的环境变量，用于存储当前用户的家目录路径。使用它让脚本更具可移植性，因为它会自动适应运行脚本的用户环境。如果在不同的机器上使用该脚本，它无需任何更改即可无缝运行。其他有用的环境变量包括
    `$PATH`、`$USER` 和 `$PWD`，它们在文件系统导航或用户管理方面各自有用途。


    [补充]


    在处理系统路径时，使用环境变量不仅让你的脚本更具适应性，还能增强安全性。硬编码敏感路径或用户特定细节在跨环境共享脚本时可能会导致问题，而环境变量是在运行时动态确定的。


