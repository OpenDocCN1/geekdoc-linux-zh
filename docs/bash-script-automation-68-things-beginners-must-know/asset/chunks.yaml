  trans: "\n每调用一次 `shift`，第一个参数（`$1`）会被丢弃，其余参数向左移动。这对于需要依次处理每个参数但不想在内存中保留所有参数的脚本非常有用。每次位移后，`$2`\
    \ 变成 `$1`，`$3` 变成 `$2`，以此此类推，直到没有剩余参数。\n\n[补充]\n\n你可以使用 `shift n` 来移动多个位置，其中 `n`\
    \ 是移动的位置数。所有参数都被移出后，`$#` 将变为 0，意味着没有更多待处理的参数。\n\n## 13. 环境变量在整个脚本中均可用\n\n学习优先级\
    \ ★★★★\n难度 ★★★★☆\n\nBash 脚本中的环境变量是键值对，可以在脚本范围内全局访问。这些变量可以在脚本的任何地方引用，并用于各种操作中，这使得它们在管理配置、路径和其他系统相关数据时非常强大。它们对于自动化任务至关重要，因为允许高效地传递和重用数据。\n\
    \n在下面的示例中，我们定义了一个环境变量 `MY_VAR`，并演示了如何在脚本的不同部分访问和使用它。这展示了环境变量的全局可用性。\n\n[代码示例]\n\
    \n```bash\n#!/bin/bash\n\n# 定义一个环境变量\nMY_VAR=\"Hello, Bash!\"\n\n# 使用环境变量\necho\
    \ \"The value of MY_VAR is: $MY_VAR\"\n\n# 修改环境变量\nMY_VAR=\"Hello, World!\"\n\
    echo \"After modification, MY_VAR is: $MY_VAR\"\n```\n\n[执行结果]\n\nThe value of\
    \ MY_VAR is: Hello, Bash!\nAfter modification, MY_VAR is: Hello, World!\n\n环境变量设置在\
    \ shell 中，并可以使用 `$` 符号加上变量名在脚本的任何地方引用。这些变量在脚本的作用范围内是全局的，意味着可以在脚本的任何点进行访问和修改，而无需重新声明。如果变量被修改，更改将立即反映在下一次使用它的地方。\n\
    \n[补充]\n\n要查看当前 shell 中可用的所有环境变量，可以使用 `printenv` 或 `env` 命令。这些命令将列出当前会话可用的所有环境变量及其值。\n\
    \n## 14. 导出变量以便子进程可用\n\n学习优先级 ★★★★\n难度 ★★★☆☆\n\n当 Bash 脚本创建子进程时（例如调用另一个脚本或命令），环境变量不会自动传递。你必须使用\
    \ `export` 命令使变量对这些子进程可用。这在需要在脚本或进程之间共享数据的复杂自动化任务中特别有用。\n\n在下面的示例中，我们定义了一个变量，并演示了在没有\
    \ `export` 的情况下，它对子进程不可用。然后，我们使用 `export` 让它可用，并展示子进程如何访问它。\n\n[代码示例]\n\n```bash\n\
    #!/bin/bash\n\n# 定义一个变量\nLOCAL_VAR=\"I am local\"\n\n# 尝试在子进程中访问它（这将不起作用）\nbash\
    \ -c 'echo \"Child process sees: $LOCAL_VAR\"'\n\n# 现在导出变量\nexport GLOBAL_VAR=\"\
    I am global\"\n\n# 在子进程中访问导出的变量（这将起作用）\nbash -c 'echo \"Child process sees: $GLOBAL_VAR\"\
    '\n```\n\n[执行结果]\n\nChild process sees:\nChild process sees: I am global\n\n`export`\
    \ 命令标记变量以便导出到子进程，允许它们继承该变量。在示例中，第一个 `bash -c` 命令没有显示 `LOCAL_VAR`，因为它没有导出。第二个 `bash\
    \ -c` 命令显示了 `GLOBAL_VAR` 的值，因为它被导出了，使得子进程可以使用。\n\n[补充]\n\n环境变量可以用于与系统交互的脚本，例如定义可执行文件的路径或配置应用程序环境。在多脚本或多进程自动化工作流中，`export`\
    \ 命令至关重要，可确保脚本和命令之间正确共享数据。\n\n## 15. 使用 unset 变量\n\n学习优先级 ★★★★\n难度 ★★★★☆\n\nBash\
    \ 中的 `unset` 命令用于从 shell 环境中删除或移除变量。一旦变量被移除，再次再次访问或使用。\n\n此示例展示了如何使用 `unset` 设置、访问和移除变量。\n\
    \n[代码示例]\n\n```bash\n# 创建变量并为其赋值\nmy_var=\"Hello, World!\"\n\n# 访问变量\necho \"\
    Before unset: $my_var\"\n\n# 移除变量\nunset my_var\n\n# 再次尝试访问变量\necho \"After unset:\
    \ $my_var\"\n```\n\n[执行结果]\n\nBefore unset: Hello, World! \nAfter unset:\n\n`unset`\
    \ 命令从 shell 环境中完全移除变量。在第二个 `echo` 语句中，变量已不存在，因此什么都没有打印。重要的是，`unset` 只能移除当前 shell\
    \ 会话范围内的变量。一旦变量被 unset，如果你想再次使用它，必须重新定义它。\n\n[补充]\n\n`unset` 也可以用于删除 shell 函数，而不只是变量。对不存在的变量使用\
    \ `unset` 不会导致错误；它会静静地无操作。\n\n## 16. 在 Bash 中声明函数\n\n学习优先级 ★★★★\n难度 ★★★☆☆\n\n\
    在 Bash 中，函数允许你将一组命令组合在一个名称下。函数使用 `function_name() { commands; }` 语法定义，并通过调用函数名来触发。\n\
    \n此示例演示了如何声明、调用并向函数传递参数。\n\n[代码示例]\n\n```bash\n# 定义一个接受两个参数的函数\ngreet() {\n  \
    \  echo \"Hello, $1! Welcome to $2.\"\n}\n\n# 带参数调用函数\ngreet \"Alice\" \"Bash\
    \ scripting\"\n```\n\n[执行结果]\n\nHello, Alice! Welcome to Bash scripting.\n\n在示例中，`greet()`\
    \ 是一个接受两个参数（$1, $2）。当使用 `\"Alice\"` 和 `\"Bash scripting\"` 调用函数时，这些值作为参数传递。这是一种使代码模块化并可复用的强大方法。\n\
    \n[补充]\n\nBash 函数不需要 `function` 关键字；你可以直接使用 `name() { commands; }` 语法声明函数。Bash\
    \ 函数不像其他编程语言那样返回值。相反，你可以使用 `return` 返回退出状态或使用 `echo` 输出数据。\n\n## 17. 使用 command\
    \ -v 检查命令是否可用\n\n学习优先级 ★★★★\n难度 ★★★★☆\n\n`command -v` 工具帮助系统中是否存在命令，这对于依赖工具的脚本至关重要。如果命令可用，它将返回命令路径，否则为空。\n\
    \n此示例演示了如何使用 `command -v` 检查是否安装了特定命令（例如 `git`）。如果存在，它将打印成功消息；如果没有，将打印失败消息。\n\n\
    [代码示例]\n\n```bash\n#!/bin/bash\n\n# 检查 'git' 命令是否存在\nif command -v git >/dev/null\
    \ 2>&1; then\n    echo \"Git is installed.\"\nelse\n    echo \"Git is not installed.\"\
    \nfi\n```\n\n[执行结果]\n\n如果安装了 git，将输出：Git is installed. \n如果没有安装 git，将输出：Git is\
    \ not installed.\n\n`command -v` 命令检查指定的命令是否在系统的 `$PATH` 中。重定向输出（>/dev/null 2>&1`）确保屏幕上不会出现不必要的输出，允许我们以干净的方式处理结果。这对于需要在执行某些操作之前检查依赖项脚本特别有用。\n\
    \n[补充]\n\n`command -v` 工具比 `which` 或 `type` 等替代方案更可靠，因为它是大多数 shell 内的，并在不同的 Unix\
    \ 类系统之间具有良好的移植性。\n\n## 18. 使用 set -e 在失败时自动退出\n\n学习优先级 ★★★★\n难度 ★★★☆☆\n"
- fmt: "\nThe `set -e` command is used in bash scripts to stop the script execution\
    \ immediately when any command fails. This is critical for ensuring that errors\
    \ are caught early, especially in automation scenarios where missing one failure\
    \ could cause cascading issues.\n\nThis example shows how `set -e` works by demonstrating\
    \ that the script will exit when a command fails. In the script, the second command\
    \ (`false`) fails, and the third command never executes because of `set -e`.\n\
    \n### Code Example\n```bash\n#!/bin/bash  \n\n# Enable exit on command failure\
    \ \nset -e  \n\n# This command will succeed \necho \"This will run.\" \n\n# This\
    \ command will fail \nfalse  \n\n# This command will not run because the script\
    \ will exit on the previous failure \necho \"This will not run.\"\n```\n\n###\
    \ Execution Result\n\nThis will run.\n\nThe script exits after `false` fails,\
    \ and the final echo command does not execute.\n\nWhen `set -e` is enabled, the\
    \ shell exits as soon as any command returns a non-zero exit status, which is\
    \ a sign of failure. This is particularly useful in long or complex scripts, ensuring\
    \ that the script doesn't continue after an error occurs. Without `set -e`, a\
    \ script would keep running, potentially causing harder-to-debug problems later\
    \ in execution.\n\n### Supplement\n\nTo selectively ignore failures in a `set\
    \ -e` environment, you can append `|| true` to commands that are allowed to fail.\
    \ For example: `false || true`\n\nThis would prevent `set -e` from exiting the\
    \ script after `false` fails.\n\n## 19. Ensure Unset Variables Cause Errors with\
    \ set -u\n\nLearning Priority★★★★★\nEase:★★★★☆\n\nUsing `set -u` in Bash scripts\
    \ forces the script to treat any unset variables as errors, which helps prevent\
    \ bugs due to unintentional missing values. It stops the script if an unset variable\
    \ is used, ensuring reliability and reducing the risk of undefined behavior.\n\
    \nThis feature is critical in scripts where the absence of a variable value could\
    \ cause failures or incorrect results. The following example shows how `set -u`\
    \ works.\n\n### Code Example\n```bash\n#!/bin/set -u  # Enable error on unset\
    \ variables\n\n# Declare a variable\nname=\"Alice\"\n\n# Try to print an unset\
    \ variable\necho \"Hello, $name!\"  # Works fine, variable is set\necho \"Welcome,\
    \ $age!\"  # Error! $age is not set\n```\n\n### Execution Result\n\nHello, Alice!\n\
    ./script.sh: line 9: age: unbound variable\n\nIn this example, `set -u` ensures\
    \ that if the variable `age` is not defined, the script immediately throws an\
    \ error and stops. This prevents the script from continuing with incorrect assumptions\
    \ or using empty values that might break the intended behavior.\n\n### Supplement\n\
    \nBy default, Bash allows the use of unset variables, which can lead to hard-to-debug\
    \ errors, especially in large automation scripts. For example, using `$foo` when\
    \ `foo` is not defined will return an empty string, which might not trigger an\
    \ immediate error but can cause issues down the line. `set -u` avoids such risks.\n\
    \n## 20. Debugging with set -x to Print Commands Before Execution\n\nLearning\
    \ Priority★★★★☆\nEase:★★★★☆\n\n`set -x` is a debugging tool in Bash that prints\
    \ every command to the terminal before executing it. This helps in tracking the\
    \ script’s flow and identifying where things might go wrong.\n\nUsing `set -x`,\
    \ each command is printed with a `+` sign before its execution. This is extremely\
    \ useful for debugging complex scripts where you need to see exactly what’s being\
    \ run at each step.\n\n### Code Example\n```bash\n#!/bin/set -x  # Enable debug\
    \ mode\n\n# Declare variables\nname=\"Bob\"\ngreeting=\"Hello\"\n\n# Print variables\n\
    echo \"$greeting, $name!\"\n\n# Perform a simple arithmetic operation\nresult=$((5\
    \ + 3))\necho \"The result is $result\"\n```\n\n### Execution Result\n\n```text\n\
    + name=Bob\n+ greeting=Hello\n+ echo Hello, Bob!\nHello, Bob!\n+ result=8\n+ echo\
    \ The result is 8\nThe result is 8\n```\n\nIn this example, `set -x` prints each\
    \ command before executing it. This helps to understand the flow of the script\
    \ and makes it easier to identify if a variable is not set correctly, if a command\
    \ fails, or if there is an unexpected flow in the script execution.\n\n### Supplement\n\
    \n`set -x` can be toggled on and off during script execution. For example, you\
    \ might want to enable debugging only for a specific block of code by using `set\
    \ -x` and then disable it with `set +x` once the critical part is complete. This\
    \ allows more focused debugging without excessive output for the whole script.\n\
    \n## 21. Understanding the $PATH Variable to Find Executables\n\nLearning Priority★★★★★\n\
    Ease:★★★★☆\n\nThe `$PATH` variable is an environment variable in Unix-based systems\
    \ like Linux and macOS. It tells the shell where to search for executable files\
    \ when you enter a command. Without properly setting the `$PATH`, the shell may\
    \ not find executables even if they are installed on the system. This concept\
    \ is crucial for script automation.\n\nThe following code demonstrates how the\
    \ `$PATH` variable works by showing the current directories where the shell looks\
    \ for executable files, and how you can add a directory to it.\n\n### Code Example\n\
    ```bash\n# Display the current $PATH value\necho $PATH\n\n# Temporarily add a\
    \ new directory to the $PATH (for the current session)\nexport PATH=$PATH:/new/directory/path\n\
    \n# Verify that the new directory is now included in $PATH\necho $PATH\n```\n\n\
    ### Execution Result\n\n```text\n/usr/local/bin:/usr/bin:/bin:/new/directory/path\n\
    ```\n\nThe `$PATH` is a colon-separated list of directories that tells the shell\
    \ where to look for executables. When you type a command, the shell searches these\
    \ directories in order until it finds the program. If the program is not found,\
    \ you'll get a \"command not found\" error.\n\n`echo $PATH` prints the current\
    \ list of directories.\n`export PATH=$PATH:/new/directory/path` appends a new\
    \ directory to the `$PATH` for the current session. This change is temporary and\
    \ will reset when you close the terminal unless you add the export command to\
    \ your shell configuration file (like `.bashrc` or `.bash_profile`).\n\n## 22.\
    \ Using source to Execute Another Script in the Current Shell\n\nLearning Priority★★★★☆\n\
    Ease:★★★☆☆\n\nThe `source` command is used to run a script within the current\
    \ shell, meaning that any changes made by the script (like setting variables)\
    \ persist after the script ends. This is different from running a script normally,\
    \ which spawns a new shell.\n\nThe following code example demonstrates how to\
    \ use the source command to run another script and retain environment changes.\n\
    \n### Code Example\n```bash\n# Create a script that exports a variable\necho 'export\
    \ MY_VAR=\"Hello from the script\"' > script.sh\n\n# Use source to run the script\
    \ in the current shell\nsource script.sh\n\n# Verify that the variable is available\
    \ in the current shell\necho $MY_VAR\n```\n\n### Execution Result\n\nHello from\
    \ the script\n"
