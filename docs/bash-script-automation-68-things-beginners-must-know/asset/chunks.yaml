    [Execution Result]


    $ ./script.sh "file 1.txt" file2.txt "file 3.txt"


    All arguments passed to the script:


    file 1.txt


    file2.txt


    file 3.txt


    Using "$@" ensures that each argument is treated individually, even when arguments
    contain spaces. Without the quotes around "$@", arguments with spaces could be
    broken into multiple arguments.Compare this with using $*, which concatenates
    all arguments into a single string, splitting them based on spaces. This can lead
    to errors when handling file names with spaces.


    [Supplement]


    "$@" behaves similarly to positional parameters like $1, $2, etc., but it''s a
    shorthand for handling all arguments in one go."$@" ensures compatibility across
    different environments and avoids common pitfalls when handling complex inputs
    like file names with spaces.


    ## 10\. Accessing Command-Line Arguments with $1, $2, etc.


    Learning Priority★★★★☆


    Ease★★★☆☆


    In Bash scripting, positional parameters like $1, $2, and so on allow you to directly
    access individual command-line arguments. Each argument passed to the script corresponds
    to a specific number, with $1 being the first, $2 the second, and so forth.


    Using positional parameters is a straightforward way to retrieve specific arguments
    passed to a Bash script. However, you need to be careful with spacing and missing
    arguments, as each is tied to a specific index.


    [Code Example]


    #!/bin/# A script to show how to access specific command-line arguments


    echo "The first argument is: $1"


    echo "The second argument is: $2"


    echo "The third argument is: $3"


    [Execution Result]


    $ ./script.sh apple banana cherry


    The first argument is: apple


    The second argument is: banana


    The third argument is: cherry


    $1 accesses the first argument, $2 the second, and so on. These are called positional
    parameters.If fewer arguments are provided than expected, the corresponding variables
    will be empty. For example, if you run the script without the third argument,
    $3 will be empty.


    [Supplement]


    $0 refers to the script''s name or path, while $# gives the total number of arguments
    passed.Be cautious: when arguments contain spaces, they should be wrapped in quotes
    when passed to avoid being split into separate arguments.


    ## 11\. Counting Command-Line Arguments with $#


    Learning Priority★★★★★


    Ease★★★★☆


    The $# variable in Bash automatically keeps track of the number of arguments passed
    to a script. This is useful when a script needs to behave differently depending
    on how many arguments are provided by the user.


    The following example shows how to use $# to count the number of arguments passed
    to a script.


    [Code Example]


    #!/bin/# Simple script to count and display the number of arguments


    echo "You have passed $# arguments to the script."


    # Optional: Loop through arguments to display them


    if [ $# -gt 0 ]; then


      echo "Here are the arguments:"


      for arg in "$@"; do


        echo "$arg"


      done


    else


      echo "No arguments were passed."


    fi


    [Execution Result]


    If you run this script with arguments, like so:$ ./count_args.sh apple banana
    orange


    The output will be:You have passed 3 arguments to the script.


    Here are the arguments:


    apple


    banana


    orange


    If you run the script without any arguments:$ ./count_args.sh


    The output will be:You have passed 0 arguments to the script.


    No arguments were passed.


    The $# variable holds the number of arguments passed to the script. If no arguments
    are passed, $# will equal 0\. This is useful for scripts that require a certain
    number of inputs or need to behave differently depending on the user''s input.
    The "for arg in $@" loop iterates over all arguments provided, while "$@" expands
    to each argument as a separate string, preserving whitespace and other special
    characters.


    [Supplement]


    $@ vs $*: $@ treats each argument as a separate entity, while $* treats all arguments
    as a single string.In case of no arguments, $# is zero, and $@ expands to an empty
    string.


    ## 12\. Using shift to Process Command-Line Arguments Sequentially


    Learning Priority★★★★☆


    Ease★★★☆☆


    The shift command in Bash is used to move through positional parameters (arguments)
    one by one. After shift is executed, the first argument ($1) is removed, and all
    other arguments are shifted down by one position.


    The following example demonstrates how to use shift to process and remove arguments
    sequentially.


    [Code Example]


    #!/bin/# Script to process each argument using shift


    echo "Processing arguments sequentially:"


    while [ $# -gt 0 ]; do


      echo "Current argument: $1"


      shift  # Move to the next argument


    done


    echo "All arguments processed."


    [Execution Result]


    If you run this script with arguments:$ ./shift_example.sh first second third


    The output will be:Processing arguments sequentially:


    Current argument: first


    Current argument: second


    Current argument: third


    All arguments processed.'
