    ## 66\. Using getopts for Parsing Command-Line Options in Bash


    Learning Priority★★★★★


    Ease★★★☆☆


    The getopts command in Bash allows you to parse command-line options passed to
    a script. It''s commonly used to handle flags (like -a, -b, etc.) and their arguments.


    This example shows how to use getopts to parse command-line flags and their arguments
    in a script.


    [Code Example]


    #!/bin/# Parsing command-line options using getopts


    while getopts "a:b:" opt; do   # Expecting options -a and -b, both require arguments


      case $opt in


        a)


          echo "Option -a was triggered with argument: $OPTARG"


          ;;


        b)


          echo "Option -b was triggered with argument: $OPTARG"


          ;;


        *)


          echo "Invalid option"


          ;;


      esac


    done


