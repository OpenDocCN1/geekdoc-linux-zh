    Ease★★★☆☆


    When working with Bash scripts, it is crucial to ensure that files are saved with
    Unix-style line endings, which use LF (\n). Windows-based systems often use CRLF
    (\r\n), which can cause issues when running scripts on Unix-based systems (such
    as Linux or macOS). This step is vital to avoid unexpected script failures caused
    by improper line endings.


    Here’s how you can check and ensure your files are saved with the correct Unix-style
    line endings using a simple command.


    [Code Example]


    # Convert a file to Unix-style line endings (LF)


    # This command overwrites the original file with Unix-style line endings.


    dos2unix myscript.sh


    [Execution Result]


    If the file was converted successfully, you will see a message like:vbnet


    dos2unix: converting file myscript.sh to Unix format...


    On Unix systems, lines in a file end with the newline character \n (LF). In contrast,
    Windows systems use both a carriage return (\r) and newline character (\n) together,
    known as CRLF (\r\n). If a file has Windows-style endings and you run it on a
    Unix-based system, the \r character may be interpreted incorrectly, causing script
    errors. This is why ensuring LF line endings is necessary when writing Bash scripts
    that will be run on Unix-like systems.


    [Supplement]


    You can verify the line endings in a file by using the cat -v command. For example:cat
    -v myscript.sh


    If you see ^M characters at the end of each line, the file has Windows-style CRLF
    line endings.


    ## 68\. Understand Differences Between /bin/sh and /bin/bash


    Learning Priority★★★★★


    Ease★★★★☆


    Though /bin/sh and /bin/bash are often used interchangeably, they have differences
    that can affect script behavior. /bin/sh refers to the Bourne shell, which is
    more limited, while /bin/bash refers to the Bourne Again shell, an enhanced version
    with more features. Knowing the difference is crucial because certain Bash features
    will not work in scripts run by /bin/sh.'
