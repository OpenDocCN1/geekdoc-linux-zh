    [Execution Result]


    Child process sees:


    Child process sees: I am global


    The export command marks a variable for export to child processes, allowing them
    to inherit that variable. In the example, the first bash -c command does not display
    LOCAL_VAR because it was not exported. The second bash -c command shows the value
    of GLOBAL_VAR because it was exported, making it available to the child process.


    [Supplement]


    Environment variables can be used in scripts that interact with the system, such
    as defining paths for executables or configuring application environments. The
    export command is vital in multi-script or multi-process automation workflows
    to ensure data is shared properly between scripts and commands.


    ## 15\. Removing Variables Using unset


    Learning Priority★★★★☆


    Ease★★★★☆


    The unset command in Bash is used to delete or remove variables from the shell
    environment. Once a variable is removed, it can no longer be accessed or used.


    This example shows how to set, access, and remove a variable using unset.


    [Code Example]


    # Create a variable and assign a value to it


    my_var="Hello, World!"


    # Access the variable


    echo "Before unset: $my_var"


    # Remove the variable


    unset my_var


    # Try accessing the variable again


    echo "After unset: $my_var"


    [Execution Result]


    Before unset: Hello, World! 


    After unset:


    The unset command removes the variable completely from the shell environment.
    In the second echo statement, the variable no longer exists, so nothing is printed.
    It''s important to know that unset can only remove variables within the scope
    of the current shell session. Once a variable is unset, you must redefine it if
    you want to use it again.


    [Supplement]


    unset can also be used to delete shell functions, not just variables.Using unset
    on a non-existent variable will not cause an error; it will silently do nothing.


    ## 16\. Declaring Functions in Bash


    Learning Priority★★★★★


    Ease★★★☆☆


    In Bash, functions allow you to group a set of commands under a single name. Functions
    are defined using the function_name() { commands; } syntax and can be invoked
    by calling the function name.


    This example demonstrates how to declare, call, and pass arguments to a function.


    [Code Example]


    # Define a function that takes two arguments


    greet() {


        echo "Hello, $1! Welcome to $2."


    }


    # Call the function with arguments


    greet "Alice" "Bash scripting"


    [Execution Result]


    Hello, Alice! Welcome to Bash scripting.


    In this example, greet() is a simple function that takes two arguments ($1 and
    $2). When the function is called with "Alice" and "Bash scripting", those values
    are passed as arguments and used within the function. The function''s parameters
    are accessed using $1, $2, etc. This is a powerful way to modularize your code
    and make it reusable.


    [Supplement]


    Bash functions do not need the function keyword; you can declare a function directly
    using the name() { commands; } syntax.Functions in Bash do not return values like
    in other programming languages. Instead, you can return an exit status using return
    or output data using echo.


    ## 17\. Check if a command is available using command -v


    Learning Priority★★★★☆


    Ease★★★★☆


    The command -v utility helps check if a command exists on the system, which is
    crucial when writing scripts that depend on specific tools. If the command is
    available, it will return the command path, otherwise, it will return nothing.


    This example demonstrates how to use command -v to check if a specific command
    (e.g., git) is installed. If it exists, it prints a success message; if not, it
    prints a failure message.


    [Code Example]


    #!/bin/bash  


    # Check if ''git'' command exists 


    if command -v git >/dev/null 2>&1; then 


    echo "Git is installed." 


    else  


    echo "Git is not installed." 


    fi


    [Execution Result]


    If git is installed, it will output:Git is installed. 


    If git is not installed, it will output:Git is not installed.


    The command -v command checks if a given command is available in the system’s
    $PATH. Redirecting output (>/dev/null 2>&1) ensures that no unnecessary output
    appears on the screen, allowing us to handle the result in a clean way. This is
    especially useful in scripts where you need to check dependencies before proceeding
    with certain actions.


    [Supplement]


    The command -v utility is more reliable than alternatives like which or type because
    it is built into most shells and offers portability across different Unix-like
    systems.


    ## 18\. Automatically exit on failure using set -e


    Learning Priority★★★★★


    Ease★★★☆☆'
