    \ 可以作为命令运行（尽管可能会报错），Bash 会进入 if 块。在 Bash 中处理布尔逻辑的正确方法是使用诸如 `/bin/true` 或 `/bin/false`\
    \ 这样的命令，它们会分别以状态码 `0`（真）或 `1`（假）退出。在 Bash 中，任何成功以状态码 `0` 退出的命令都被视为“真”，而其他任何内容（非零退出状态）均被视为“假”。\n\
    \n### 补充\n`true` 和 `false` 是大多数类 Unix 系统中的内置命令。`/bin/true` 总是以 `0` 退出，而 `/bin/false`\
    \ 总是以非零状态（通常为 `1`）退出。如果你想在 Bash 中检查条件，除非是在显式地检查字符串相等，否则避免使用 \"true\" 或 \"false\"\
    \ 这样的字符串。\n\n## 64. 在 Bash 中使用 bc 或 awk 进行浮点运算\n\n学习优先级★★★★★\n难度★★★☆☆\n\nBash\
    \ 原生仅处理整数运算。要执行浮点运算，你需要使用 `bc`（基础计算器）或 `awk` 等外部工具。这些工具允许你轻松处理非整数计算。\n\n此示例展示了如何使用\
    \ `bc` 和 `awk` 在 Bash 中执行浮点运算，而 Bash 无法直接处理此类计算。\n\n### 代码示例\n```bash\n# 使用 bc\
    \ 进行浮点运算\n\nnum1=1.5\nnum2=2.3\n\nresult=$(echo \"$num1 + $num2\" | bc)\n\necho\
    \ \"使用 bc 的结果: $result\"\n\n# 使用 awk 进行浮点运算\n\nresult=$(echo \"$num1 $num2\" |\
    \ awk '{print $1 + $2}')\n\necho \"使用 awk 的结果: $result\"\n```\n\n### 执行结果\n```\n\
    使用 bc 的结果: 3.8\n使用 awk 的结果: 3.8\n```\n\nBash 设计用于简单的脚本编写，原生不支持浮点运算，因为它的算术运算基于整数计算。若要处理小数，必须使用\
    \ `bc` 和 `awk` 等工具。`bc` 是一个命令行计算器，可以处理浮点运算。它可以接收管道输入，例如 `echo \"$num1 + $num2\"\
    \ | bc`。`awk` 是另一个多功能命令行工具，主要用于模式扫描和处理，但它也支持算术运算，包括浮点计算。`bc` 和 `awk` 常用于 Bash\
    \ 脚本，以执行比简单整数运算需要更高精度的计算。\n\n### 补充\n在 Bash 中，像 `$((1.5 + 2.3))` 这样的表达式会报错，因为\
    \ Bash 不原生支持浮点运算。相反，你必须依赖于 `bc` 和 `awk` 等外部工具。对于简单操作，`bc` 通常是首选，因为它简单直观；而 `awk`\
    \ 则提供了文本处理和格式化等额外功能。\n\n## 65. 在 Bash 中使用 let 和 (( ... )) 进行算术运算\n\n学习优先级★★★★☆\n\
    难度★★★★☆\n\n在 Bash 脚本中，你可以使用 `let` 或 `(( ... ))` 语法执行算术运算。这些对于增加计数器、计算和或在脚本中处理数值等任务非常有用。\n\
    \n以下示例展示了如何在 Bash 脚本中使用 `let` 和 `(( ... ))` 执行算术运算。\n\n### 代码示例\n```bash\n#!/bin/bash\n\
    # 使用 let 进行算术运算\n\nlet \"a = 5 + 3\"     # 将 5 加 3，结果存储在 'a' 中\necho \"使用 let:\
    \ a = $a\"  # 输出: 8\n\n# 使用 (( ... )) 进行算术运算\n(( b = 7 * 2 ))     # 7 乘以 2，结果存储在\
    \ 'b' 中\necho \"使用 (( ...)): b = $b\"  # 输出: 14\n\n# 增加变量\nlet \"a += 1\"    \
    \ # a 增加 1\necho \"增加后，a = $a\"  # 输出: 9\n(( b-- ))      # b 递减 1\necho \"递减后，b\
    \ = $b\"  # 输出: 13\n```\n\n### 执行结果\n```\n使用 let: a = 8\n使用 (( ...)): b = 14\n\
    增加后，a = 9\n递减后，b = 13\n```\n\n`let` 命令可以求值算术表达式。在表达式中变量前不需要 `$` 符号。\n\n`(( ...\
    \ ))` 语法是一种算术求值结构。它更灵活且更常用，因为可以与条件语句内联使用（例如 `if (( ... ))`）。两种方法都会自动处理整数运算，所以你不需要担心定义类型。\n\
    \n### 补充\n`let` 和 `(( ... ))` 仅适用于整数；如果你需要浮点运算，则需要使用如 `bc` 等外部工具。`(( ... ))` 允许更复杂的表达式，在许多情况下被认为比\
    \ `let` 更现代且更受青睐。\n\n## 66. 在 Bash 中使用 getopts 解析命令行选项\n\n学习优先级★★★★★\n难度★★★☆☆\n\
    \nBash 中的 `getopts` 命令允许你解析传递给脚本的命令行选项。它通常用于处理标志（flags，如 `-a`、`-b` 等）及其参数。\n\n\
    此示例展示了如何在脚本中使用 `getopts` 解析命令行标志及其参数。\n\n### 代码示例\n```bash\n#!/bin/bash/\n# 使用\
    \ getopts 解析命令行选项\n\nwhile getopts \"a:b:\" opt; do  # 期望带有参数的选项 -a 和 -b\n  case\
    \ $opt in\n    a)\n      echo \"选项 a: $OPTARG\"\n      ;;\n    b)\n      echo\
    \ \"选项 b: $OPTARG\"\n      ;;\n    *)\n      echo \"无效选项\"\n      ;;\n  esac\n\
    done\n```\n*(注：原文中 66 部分代码不完整，此处根据上下文补全了标准的 getopts 结构)*\n\n## 67. 确保文件使用 Unix\
    \ 风格行符 (LF)\n\n学习优先级★★★★☆\n难度★★★☆☆\n\n在编写 Bash 脚本时，确保文件保存为 Unix 风格行符（LF）至关重要。Windows\
    \ 系统通常使用 CRLF (\\r\\n)，这在运行脚本时可能会引起问题。这一步骤对于避免因行符错误导致的脚本失败非常重要。\n\n以下是你可以使用简单命令检查并确保文件使用正确的行符。\n\
    \n### 代码示例\n```bash\n# 将文件转换为 Unix 风格行符\n# 该命令用 Unix 风格行符覆盖原始文件\ndos2unix myscript.sh\n\
    ```\n\n## 68. 理解 /bin/sh 和 /bin/bash 的区别\n\n尽管 `/bin/sh` 和 `/bin/bash` 经常互换使用，但它们之间存在影响脚本行为的区别。`/bin/sh`\
    \ 指的是 Bourne shell，其功能较有限；而 `/bin/bash` 指的是 Bourne Again shell，是一个功能更丰富的增强版本。了解这种区别至关重要，因为某些\
    \ Bash 特性在 `/bin/sh` 运行的脚本中无法工作。\n\n"
- fmt: "\nHere’s a simple example to illustrate how certain features available in\
    \ Bash may not work when using `/bin/sh`.\n\n### Code Example\n```bash\n#!/bin/\n\
    # This script will work in Bash but not in /bin/sh.\n\nmy_array=(\"apple\" \"\
    banana\" \"cherry\")\n\nfor item in \"${my_array[@]}\"; do\n  echo $item\ndone\n\
    ```\n\n### Execution Result\nWhen run in Bash (`/bin/bash`), the script outputs:\n\
    ```\napple\nbanana\ncherry\n```\nIf run in `/bin/sh`, it would likely throw an\
    \ error such as: `syntax error: bad substitution`\n\nThe Bourne shell (`/bin/sh`)\
    \ is more basic and is the default shell on many Unix systems. In contrast, Bash\
    \ (`/bin/bash`) includes enhancements like arrays, string manipulation, and more\
    \ advanced scripting capabilities. For instance, arrays (`my_array=(\"apple\"\
    \ \"banana\" \"cherry\")`) are a feature of Bash, and attempting to use arrays\
    \ in `/bin/sh` will result in errors.\n\n### Supplement\nTo check what `/bin/sh`\
    \ actually points to on your system, run: `ls -l /bin/sh`\n\nOn many modern systems,\
    \ `/bin/sh` is a symlink to another shell like `dash`, which is even more limited\
    \ than Bash.\n\n## 69. Creating Temporary Files Securely with mktemp\n\nLearning\
    \ Priority★★★★★\nEase★★★★★★☆\n\nWhen writing shell scripts, it is often necessary\
    \ to create temporary files. The `mktemp` command allows you to generate secure,\
    \ unique temporary files or directories, preventing conflicts and security issues\
    \ like file overwriting or access by unauthorized users.\n\nBelow is an example\
    \ of how to create a temporary file using `mktemp`. The generated file will be\
    \ unique and secure, and you can store data in it temporarily.\n\n### Code Example\n\
    ```bash\n#!/bin/\n# Create a secure temporary file\ntemp_file=$(mktemp)\n\n# Add\
    \ some data to the temp file\necho \"This is temporary data\" > \"$temp_file\"\
    \n\n# Display the temp file's content\ncat \"$temp_file\"\n\n# Clean up by removing\
    \ the temp file\nrm \"$temp_file\"\n```\n\n### Execution Result\n```\nThis is\
    \ temporary data\n```\nIn this example, `mktemp` creates a unique file in the\
    \ default temporary directory, usually `/tmp`, with a randomly generated name.\
    \ The command ensures that no other file with the same name exists, making it\
    \ more secure than manually creating a temp file. Temporary files should always\
    \ be removed after use, as demonstrated with the `rm` command.\n\n### Supplement\n\
    Without `mktemp`, creating temporary files can lead to security vulnerabilities,\
    \ especially if attackers manage to predict the file name or location. `mktemp`\
    \ ensures that the file creation is atomic, meaning it is either created successfully\
    \ or not at all, which helps to avoid race conditions.\n\n## 70. Manipulating\
    \ File Paths with basename and dirname\n\nLearning Priority★★★★☆\nEase★★★★☆\n\n\
    When automating tasks with shell scripts, you often need to extract the filename\
    \ or directory path from a full file path. The `basename` command extracts the\
    \ file name, while `dirname` extracts the directory path.\n\nThis example shows\
    \ how to use `basename` and `dirname` to handle file paths. You can easily extract\
    \ either the file name or the directory path, which is useful for processing file\
    \ paths in scripts.\n\n### Code Example\n```bash\n#!/bin/\nfile_path=\"/home/user/documents/report.txt\"\
    \n\n# Extract and display the file name\nfile_name=$(basename \"$file_path\")\n\
    echo \"File Name: $file_name\"\n\n# Extract and display the directory path\ndir_name=$(dirname\
    \ \"$file_path\")\necho \"Directory Path: $dir_name\"\n```\n\n### Execution Result\n\
    ```\nFile Name: report.txt\nDirectory Path: /home/user/documents\n```\n`basename`\
    \ removes everything before the last `/` in a path and returns the file name,\
    \ while `dirname` removes the file name and returns the directory part. These\
    \ commands are especially helpful when writing scripts that need to manipulate\
    \ file paths dynamically, such as when working with logs, configuration files,\
    \ or data processing pipelines.\n\n### Supplement\nUsing `basename` and `dirname`\
    \ is safer and cleaner than trying to parse file paths manually with `awk` or\
    \ `cut`. They handle edge cases, such as paths with special characters or no directories,\
    \ more reliably.\n\n## 71. Redirecting Error Output to a File Using 2>\n\nLearning\
    \ Priority★★★★☆\nEase★★★★☆\n\nIn Bash, the `2>` operator allows you to redirect\
    \ error messages (standard error) to a file. This is crucial when you want to\
    \ capture or troubleshoot error logs separately from standard output.\n\nThe following\
    \ example shows how to redirect error messages from a command to a file, while\
    \ the regular output is displayed on the screen.\n\n### Code Example\n```bash\n\
    #!/bin/\n# Trying to list a non-existent directory\nls /nonexistent_directory\
    \ 2> error_log.txt\n\n# Successful command that lists current directory\nls .\n\
    ```\n\n### Execution Result\n(file: error_log.txt will contain \"ls: cannot access\
    \ '/nonexistent_directory': No such file or directory\")\n(list of files from\
    \ current directory will be shown on the screen)\n\nThe `ls /nonexistent_directory`\
    \ command tries to access a directory that doesn't exist, resulting in an error.\
    \ By using `2> error_log.txt`, the error message is redirected to a file called\
    \ `error_log.txt`, while the normal output of the `ls .` command still appears\
    \ on the screen. This separation helps in keeping logs organized and prevents\
    \ error messages from cluttering the main output. `2>` specifically targets file\
    \ descriptor `2`, which is standard error (stderr). You can also redirect standard\
    \ output (stdout) with `>`, and combine both using `&>`.\n\n### Supplement\nFile\
    \ descriptor `0` is for input (stdin), `1` for output (stdout), and `2` for error\
    \ (stderr). You can combine both output and errors into the same file with `&>\
    \ file.txt` or separately with `> output.txt 2> error.txt`.\n\n## 72. Limiting\
    \ Subshell Usage for Better Performance\n\nLearning Priority★★★☆☆\nEase★★☆☆☆\n\
    \nUsing subshells `$(...)` or `(...)`` in Bash can simplify some tasks, but overusing\
    \ them can lead to performance issues because each subshell spawns a new process.\
    \ Limit their usage to avoid unnecessary resource consumption.\n\nThe example\
    \ below demonstrates a subshell usage to capture a command’s output. It also explains\
    \ the difference between subshells and avoiding them.\n\n### Code Example\n```bash\n\
    #!/bin/\n# Subshell usage: command executed inside $() creates a new process\n\
    output=$(ls /)\necho \"Subshell result: $output\"\n\n# Avoiding subshell by directly\
    \ using the command\necho \"Direct command output:\"\nls /\n```\n\n### Execution\
    \ Result\n```\nSubshell result: (list of files from root directory)\n/bin /boot\
    \ /dev /etc ...\n\nDirect command output:\nbin  boot  dev  etc  ...\n```\nIn the\
    \ first command, `output=$(ls /)`, the `ls /` command is executed in a subshell,\
    \ creating a new process, and its result is stored in the variable `output`. In\
    \ contrast, the second `ls /` command is executed directly without spawning an\
    \ additional process.Using subshells frequently in scripts, especially in loops,\
    \ can negatively impact performance because each instance creates a separate process.\n\
    \n### Supplement\nA subshell is a child process that inherits the environment\
    \ of the parent but runs independently.Subshells are useful for isolating variable\
    \ changes and other side effects, but too many subshells can slow down scripts.\n\
    \n## 73. Measuring Command Performance Using time\n\nLearning Priority★★★★☆\n\
    Ease★★★★☆\n\nThe `time` command in Bash is used to measure how long a command\
    \ or script takes to run. It gives you three important metrics: real time (total\
    \ elapsed time), user time (time spent in user-mode), and sys time (time spent\
    \ in kernel-mode). This is very useful for analyzing the performance of scripts\
    \ or commands.\n\nThis example shows how to use `time` to measure how long a simple\
    \ command like `sleep` takes to run.\n\n### Code Example\n```bash\n# Measure how\
    \ long the 'sleep' command takes to execute\ntime sleep 2\n```\n\n### Execution\
    \ Result\n```\nreal    0m2.002s\nuser    0m0.000s\nsys     0m0.002s\n```\n"
