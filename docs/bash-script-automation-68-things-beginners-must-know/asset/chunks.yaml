  trans: "\n\n这里有一个简单的示例，用于说明 Bash 中可用的某些功能在运行 `/bin/sh` 时可能无法工作。\n\n### 代码示例\n```bash\n\
    #!/bin/\n# 此脚本在 Bash 中可以运行，但在 /bin/sh 中不能运行。\n\nmy_array=(\"apple\" \"banana\"\
    \ \"cherry\")\n\nfor item in \"${my_array[@]}\"; do\n  echo $item\ndone\n```\n\
    \n### 执行结果\n当在 Bash (`/bin/bash`) 中运行时，脚本输出如下：\n```\napple\nbanana\ncherry\n```\n\
    如果在 `/bin/sh` 中运行，它可能会抛出错误，例如：`syntax error: bad substitution`\n\nBourne shell\
    \ (`/bin/sh`) 更加基础，是许多 Unix 系统上的默认 shell。相比之下，Bash (`/bin/bash`) 包含了数组、字符串处理和更高级的脚本能力等增强功能。例如，数组（`my_array=(\"\
    apple\" \"banana\" \"cherry\")`）是 Bash 的特性， `/bin/sh` 中尝试使用数组会导致错误。\n\n### 补充\n\
    要检查 `/bin/sh` 在你的系统上实际上指向什么，请运行：`ls -l /bin/sh`\n\n在许多现代系统中，`/bin/sh` 是指向另一个 shell（如\
    \ `dash`）的符号链接，它的功能比 Bash 还要有限。\n\n## 69. 使用 mktemp 安全创建临时文件\n\n学习优先级★★★★★\n难度★★★★★★☆\n\
    \n在编写 shell 脚本时，通常需要创建临时文件。`mktemp` 命令允许你生成安全的、唯一的临时文件或目录，防止冲突以及如文件覆盖或被未经授权的用户访问等安全问题。\n\
    \n以下是一个使用 `mktemp` 创建临时文件的示例。生成的文件是唯一且安全的，你可以临时存储其中存储数据。\n\n### 代码示例\n```bash\n\
    #!/bin/\n# 创建安全的临时文件\ntemp_file=$(mktemp)\n\n# 向临时文件添加一些数据\necho \"This is temporary\
    \ data\" > \"$temp_file\"\n\n# 显示临时文件的内容\ncat \"$temp_file\"\n\n# 删除临时文件以清理环境\n\
    rm \"$temp_file\"\n```\n\n### 执行结果\n```\nThis is temporary data\n```\n在这个示例中，`mktemp`\
    \ 在默认临时目录（通常是 `/tmp`）中创建一个随机生成名称的唯一文件。该命令确保不存在其他同名文件，使其比手动创建临时文件更安全。正如 `rm` 命令所示，临时文件在使用后应始终被删除。\n\
    \n### 补充\n如果不使用 `mktemp`，创建临时文件可能会导致安全漏洞，特别是当攻击者能够预测文件名或位置时。`mktemp` 确保了文件创建是原子性的，这意味着它要么被成功创建，要么完全不创建，这有助于避免竞态条件。\n\
    \n## 70. 使用 basename 和 dirname 纵文件路径\n\n学习优先级★★★★☆\n难度★★★★☆\n\n在用 shell 脚本自动化任务时，你通常需要从完整文件路径中提取文件名或目录路径。`basename`\
    \ 命令提取文件名，而 `dirname` 提取目录路径。\n\n此示例展示了如何使用 `basename` 和 `dirname` 处理文件路径。你可以轻松提取文件名或目录路径，这对于在脚本中处理文件路径非常有用。\n\
    \n### 代码示例\n```bash\n#!/bin/\nfile_path=\"/home/user/documents/report.txt\"\n\n\
    # 提取并显示文件名\nfile_name=$(basename \"$file_path\")\necho \"File Name: $file_name\"\
    \n\n# 提取并显示目录路径\ndir_name=$(dirname \"$file_path\")\necho \"Directory Path: $dir_name\"\
    \n```\n\n### 执行结果\n```\nFile Name: report.txt\nDirectory Path: /home/user/documents\n\
    ```\n`basename` 移除路径中最后一个 `/` 之前的内容并返回文件名，而 `dirname` 移除文件名并返回目录部分。这些命令在编写需要动态处理文件路径的脚本时特别有用，例如在处理日志、配置文件或数据处理流水线时。\n\
    \n### 补充\n使用 `basename` 和 `dirname` 比尝试用 `awk` 或 `cut` 手动解析文件路径更安全且干净。它们能更可靠地处理边界情况，例如带有特殊字符或没有目录路径。\n\
    \n## 71. 使用 2> 将错误输出重定向到文件\n\n学习优先级★★★★☆\n难度★★★★☆\n\n在 Bash 中，`2>` 运算符允许你将错误消息（标准错误）重定向到文件。当你想要从标准输出中单独捕获或排除错误日志时，这至关重要。\n\
    \n以下示例展示了如何将命令的错误消息重定向到文件，同时普通输出显示在屏幕上。\n\n### 代码示例\n```bash\n#!/bin/\n# 尝试列出一个不存在的目录\n\
    ls /nonexistent_directory 2> error_log.txt\n\n# 成功的列出当前目录的命令\nls .\n```\n\n###\
    \ 执行结果\n(文件 error_log.txt 将包含 \"ls: cannot access '/nonexistent_directory': No\
    \ such file or directory\")\n(当前目录的文件列表将显示在屏幕上)\n\n`ls /nonexistent_directory`\
    \ 命令尝试访问一个不存在的目录，导致错误。通过使用 `2> error_log.txt`，错误消息被重定向到名为 `error_log.txt` 文件，而\
    \ `ls .` 命令的正常输出仍然显示在屏幕上。这种分离有助于保持日志整洁，并防止错误消息干扰主输出。`2>` 特指文件描述符 `2`，即标准错误 (stderr)。\n\
    \n### 补充\n文件描述符 `0` 是标准输入 (stdin)，`1` 是标准输出 (stdout)，`2` 是标准错误 (stderr)。你可以使用\
    \ `>` 重定向输出，使用 `2>` 重定向错误，或者使用 `&>` 将两者重定向到同一个文件。\n\n## 72. 限制子 shell 使用以优化性能\n\
    \n学习优先级★★★☆☆\n难度★★☆☆☆\n\n在 Bash 中使用子 shell `$(...)` 或 `(...)` 可以简化任务，但过度使用会导致性能问题，因为每个子\
    \ shell 都会创建一个进程。限制它们的使用以避免不必要的资源消耗。\n\n下面的示例演示了使用子 shell 获取命令输出。它解释了使用子 shell\
    \ 和避免它们的区别。\n\n### 代码示例\n```bash\n#!/bin/\n# 子 shell 使用：在 () 中执行命令会创建一个新进程\noutput=$(ls\
    \ /)\necho \"Subshell result: $output\"\n\n# 直接使用命令避免子 shell\necho \"Direct command\
    \ output:\"\nls /\n```\n\n### 执行结果\n```\nSubshell result: (根目录的文件列表)\n/bin /boot\
    \ /dev /etc ...\n\nDirect command output:\nbin ...\n```\n在第一个命令 `output=$(ls /)`\
    \ 中，`ls /` 在子 shell 中执行，结果存储在变量 `output` 中。相比之下，第二个 `ls /` 命令直接执行，没有产生额外的进程。在脚本中频繁使用子\
    \ shell（特别是在循环中）会对性能产生负面影响，因为每次都会创建一个独立的进程。\n\n### 补充\n子 shell 是一个继承父进程环境但独立运行的子进程。子\
    \ shell 对于隔离变量变化和其他副作用很有用，但过多的子 shell 会减慢脚本运行。\n\n## 73. 使用 time 测量命令性能\n\n学习优先级★★★★☆\n\
    难度★★★★☆\n\nBash 中的 `time` 命令用于测量命令或脚本运行的时间。它提供三个重要的指标：实际时间（总耗时）、用户时间（在用户模式下花费的时间）和系统时间（在内核模式下花费的时间）。对于分析脚本或命令的性能非常有用。\n\
    \n此示例展示了如何使用 `time` 测量如 `sleep` 等简单命令的运行时间。\n\n### 代码示例\n```bash\n# 测量 'sleep'\
    \ 命令执行所需的时间\ntime sleep 2\n```\n\n### 执行结果\n```\nreal    0m2.002s\nuser    0m0.000s\n\
    sys     0m0.002s\n```\n\n"
- fmt: '

    `real`: The actual elapsed time, from start to finish (includes all system and
    user time). `user`: The amount of CPU time spent in user-mode, which is the time
    the process itself took. `sys`: The time spent in system (or kernel) mode by the
    operating system on behalf of the process. In the above example, `sleep 2` waits
    for 2 seconds before finishing, so the `real` time reflects this. Since no significant
    processing is done, the `user` and `sys` times are close to zero.


    [Supplement]


    `time` is a built-in shell command in many Linux and Unix-like systems. It’s useful
    for performance tuning, especially when optimizing scripts or commands that may
    be running slow. The difference between `user` time and `sys` time can help identify
    whether the script is more CPU-bound (`user` time) or making heavy use of system
    resources (`sys` time).


    ## 74\. Using Environment Variables Instead of Hardcoded Paths


    Learning Priority★★★★★


    Ease★★★☆☆


    Hardcoding file paths in scripts can make them rigid and difficult to reuse in
    different environments. Instead, you should use environment variables, which allow
    the script to work flexibly across various systems without modification.


    This example shows how to use the `$HOME` environment variable instead of hardcoding
    a user’s home directory in a script.


    [Code Example]


    ```

    # Instead of hardcoding the path, use $HOME for flexibility

    cd $HOME/Documents


    # Print the path to verify the correct directory is being used

    echo "Current directory: $HOME/Documents"

    ```


    [Execution Result]


    ```

    Current directory: /home/username/Documents

    ```


    `$HOME` is a predefined environment variable that stores the current user''s home
    directory path. Using it makes the script more portable, as it automatically adapts
    to the environment of the user running the script. If the script is used on a
    different machine, it will work seamlessly without any changes. Other useful environment
    variables include `$PATH`, `$USER`, and `$PWD`, each serving specific purposes
    for file system navigation or user management.


    [Supplement]


    When working with system paths, using environment variables not only makes your
    script more adaptable but also enhances security. Hardcoding sensitive paths or
    user-specific details can lead to issues when sharing scripts across different
    environments, whereas environment variables are dynamically determined at runtime.


