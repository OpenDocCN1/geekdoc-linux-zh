    Learning Priority★★★★☆


    Ease★★★★☆


    The time command in Bash is used to measure how long a command or script takes
    to run. It gives you three important metrics: real time (total elapsed time),
    user time (time spent in user-mode), and sys time (time spent in kernel-mode).
    This is very useful for analyzing the performance of scripts or commands.


    This example shows how to use time to measure how long a simple command like sleep
    takes to run.


    [Code Example]


    # Measure how long the ''sleep'' command takes to execute


    time sleep 2


    [Execution Result]


    real    0m2.002s  


    user    0m0.000s  


    sys     0m0.002s'
