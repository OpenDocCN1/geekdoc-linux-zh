    ```\n\n### Execution Result\n\nFailed to change directory.\n"
  raw: 'In order to run your script by typing its name in the terminal, you must give
    it execution permission using the chmod +x command.


    [Code Example]


    # First, create the script


    echo -e ''#!/bin/bash\necho "This is an executable script!"'' > script.sh


    # Then, make it executable


    chmod +x script.sh


    # Now you can run it directly


    ./script.sh


    [Execution Result]


    This is an executable script!


    The command chmod +x script.sh modifies the permissions of the script, allowing
    it to be executed by the user. By default, newly created scripts do not have execute
    permissions, so the system will not allow you to run them directly unless you
    explicitly change their permissions.After running chmod +x script.sh, the script
    can be executed using ./script.sh. If you don''t make it executable, you''d need
    to run it using bash script.sh instead, which does not require execute permission
    but is less convenient.


    [Supplement]


    The chmod command stands for "change mode" and is used to modify file permissions
    in Unix-like systems. The +x flag adds execute permission for the script, meaning
    it can be run as a program.


    ## 3\. Executing a script using ./script.sh


    Learning Priority★★★★★


    Ease★★★★☆


    To execute a Bash script in the terminal, use the ./script.sh command after making
    sure the script has executable permissions. This is one of the first things to
    learn when automating tasks with Bash.


    To run a Bash script from the command line, you need to ensure that the script
    has executable permissions. Then, you can execute it using ./script.sh.


    [Code Example]


    # Step 1: Ensure your script has executable permissions


    chmod +x script.sh


    # Step 2: Execute the script


    ./script.sh


    [Execution Result]


    If the script is correct, it will run and display the output of the commands inside
    the script. For example, if script.sh contains:#!/bin/echo "Hello, World!"


    The terminal will output:


    Hello, World!


    The chmod +x script.sh command gives the script executable permissions. Without
    this, the script won''t run using ./../ specifies that the script is in the current
    directory. If the script is in another location, you must provide the correct
    path (e.g., ~/scripts/myscript.sh).The #!/bin/bash at the beginning of the script
    is called a "shebang" and tells the system that this script should be run using
    the Bash shell.


    [Supplement]


    If you get an error like permission denied, it usually means the script doesn''t
    have the proper executable permissions.Using ./script.sh ensures you are running
    the script from your current directory, while running script.sh without ./ would
    only work if the directory is in your system’s PATH.


    ## 4\. Assigning variables in Bash without spaces


    Learning Priority★★★★☆


    Ease★★★★☆


    In Bash scripting, variables are assigned without spaces between the variable
    name, equal sign, and value. This is important to prevent errors and ensure the
    script runs as expected.


    To correctly assign a value to a variable in a Bash script, there must be no spaces
    around the equal sign.


    [Code Example]


    #!/bin/


    # Assign a value to a variable (no spaces around the equals sign)


    my_var="Hello, World!"


    # Output the value of the variable


    echo $my_var


    [Execution Result]


    Hello, World!


    If you place spaces around the = sign, like my_var = "Hello, World!", you will
    get an error such as command not found.To access the value of a variable, use
    $ before the variable name, like echo $my_var.Variable names in Bash can only
    contain letters, numbers, and underscores, and they cannot start with a number.


    [Supplement]


    Variable values in Bash can be reused in the script, and they are not typed (e.g.,
    they can hold strings or numbers).Double quotes around values are optional if
    there are no spaces in the value. However, it''s a good practice to always use
    quotes to avoid issues with values containing spaces.


    ## 5\. Using $(command) to Capture Command Output


    Learning Priority★★★★★


    Ease★★★★☆


    Bash allows you to capture the output of a command by using $(command). This is
    useful when you want to use the result of a command in a script for further processing
    or as a variable.


    You can use $(command) to store the output of a command in a variable and then
    use it later in your script. This is a common practice in Bash scripting.


    [Code Example]


    #!/bin/# Capture the current date using the ''date'' command


    current_date=$(date)


    # Print the captured date


    echo "Today''s date is: $current_date"


    [Execution Result]


    Today''s date is: Wed Oct 2 12:34:56 UTC 2024


    In the example, $(date) captures the output of the date command, which is then
    stored in the current_date variable. You can use this technique for any command,
    not just date. This method is more modern and preferred over using backticks (`command`),
    which serve the same purpose but can be harder to read in complex scripts.


    [Supplement]


    $(command) is known as command substitution. It allows you to assign the output
    of any command to a variable or use it directly in your script. It works by running
    the command inside the parentheses, capturing the result, and replacing it with
    the output in the script where it''s used. Always ensure the command inside the
    $(...) is correct, as any error will cause the output to be empty.


    ## 6\. Checking the Exit Status of the Last Command with $?


    Learning Priority★★★★★


    Ease★★★☆☆


    In Bash, every command returns an exit status. You can check if a command was
    successful by examining the special variable $?. A value of 0 means success, while
    any other value indicates an error.


    The $? variable stores the exit status of the last executed command. You can use
    it to determine whether a command was successful or if it failed, and then take
    appropriate action based on the result.


    [Code Example]


    #!/bin/# Try to change to a directory


    cd /some/nonexistent/directory


    # Check the exit status of the last command


    if [ $? -eq 0 ]; then


        echo "Directory changed successfully."


    else


        echo "Failed to change directory."


    fi


    [Execution Result]


    Failed to change directory.


    In the example above, the cd /some/nonexistent/directory command fails because
    the directory doesn''t exist, and $? returns a non-zero value. The if [ $? -eq
    0 ] checks the exit status, and since it''s not 0, the script prints "Failed to
    change directory." This approach allows you to handle errors in your scripts effectively.


    [Supplement]


    The exit status is an integer that represents the outcome of a command: 0 means
    success, and non-zero values indicate various types of errors. This mechanism
    is essential for building robust Bash scripts, especially when chaining multiple
    commands. You can also use || (logical OR) or && (logical AND) to simplify checking
    for command success directly in one line, for example:cd /some/path && echo "Success"
    || echo "Failure"


    ## 7\. Advanced Conditional Testing with Double Square Brackets [[ ... ]]


    Learning Priority★★★★☆


    Ease★★★☆☆


    In Bash scripting, [[ ... ]] is an advanced conditional syntax that offers more
    features than the simpler [ ... ]. It provides additional capabilities such as
    string comparison with pattern matching, and better handling of operators like
    && and ||.


    [[ ... ]] allows for complex conditional expressions and reduces the risk of errors
    like word splitting or unexpected behavior when using special characters.


    [Code Example]


    #!/bin/# Using [[ ... ]] to check if a string matches a pattern


    input="hello123"


    if [[ $input == hello* ]]; then


        echo "The input starts with ''hello''"


    else


        echo "The input does not start with ''hello''"


    fi


    # Another example using logical operators with [[ ... ]]


    number=10


    if [[ $number -gt 5 && $number -lt 20 ]]; then


        echo "The number is between 5 and 20"


    fi


    [Execution Result]


    The input starts with ''hello''


    The number is between 5 and 20'
