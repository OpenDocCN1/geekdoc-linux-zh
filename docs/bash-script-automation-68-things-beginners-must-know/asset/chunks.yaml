    sed ''s/hello/goodbye/g'' sample.txt


    [Execution Result]


    goodbye world! goodbye again!


    s/old/new/g: In this command, s stands for substitution, hello is the text to
    search for, and goodbye is the text to replace it with. The g at the end stands
    for "global," meaning that all occurrences of the text in the file will be replaced.sed
    can also be used for more complex operations, such as inserting, deleting, or
    transforming data based on regular expressions.It processes files without opening
    them in a text editor, making it perfect for automation tasks.


    [Supplement]


    sed stands for "stream editor" and is commonly used in Unix/Linux environments.You
    can use sed inline to directly modify files with the -i flag: sed -i ''s/old/new/g''
    filename.txt.


    ## 58\. Using cron to Schedule Bash Scripts


    Learning Priority★★★★★


    Ease★★★☆☆


    cron is a time-based job scheduler in Unix-like operating systems. It allows users
    to automate the execution of scripts at specific times or intervals, such as daily
    backups or system maintenance tasks.


    This example shows how to schedule a simple Bash script that outputs the current
    date and time to a file every minute.


    [Code Example]


    # First, create a simple script to write the date to a file


    echo -e "#!/bin/bash\n\necho \$(date) >> ~/cron_test.txt" > ~/write_date.sh


    # Make the script executable


    chmod +x ~/write_date.sh


    # Edit the cron jobs to run the script every minute


    crontab -e


    # Add the following line to the crontab file:


    # * * * * * ~/write_date.sh


    [Execution Result]


    After a minute, cron_test.txt will contain:Tue Oct  2 10:15:01 UTC 2024


    Tue Oct  2 10:16:01 UTC 2024


    The script runs every minute and appends the current date and time to the file.


    In crontab, the five fields represent minute, hour, day of the month, month, and
    day of the week. In this example, the * * * * * syntax means the script will run
    every minute.Use crontab -l to view current scheduled jobs and crontab -r to remove
    all jobs.Be careful with the paths in your scripts, as cron uses a different environment
    than your shell, so specify full paths if necessary.


    [Supplement]


    Cron jobs are widely used for server maintenance, backups, and other recurring
    tasks.You can redirect the output of cron jobs to log files for easier debugging
    by appending something like >> /path/to/logfile 2>&1 at the end of a cron job
    line.


