    ## 49 使用 ''&'' 在后台运行命令


    学习优先级★★★★☆


    难度★★★★☆


    在 Bash 脚本中，`&` 符号允许你在后台运行命令的同时，仍可以使用终端执行其他任务。这对于多任务处理或运行长时间运行的进程而不阻塞终端非常有用。


    以下代码演示了如何使用 `&` 符号在后台执行命令，让你能够继续使用终端而无需等待命令完成。


    [代码示例]


    ```bash

    # 在后台运行一个长时间的命令

    sleep 10 &


    # 在运行后台命令后立即打印消息

    echo "The sleep command is running in the background!"

    ```


    [执行结果]


    ```

    [1] 12345  # 这是后台进程的作业 ID 和进程 ID

    The sleep command is running in the background!

    ```


    当你向命令后添加 `&` 时，它会在后台运行，释放终端。当你需要启动一个任务（例如下载文件或运行服务器）而无需等待其完成时，这特别有用。终端将显示后台任务的进程
    ID (PID) 和作业号，以便你进行跟踪。


    [补充]


    你可以使用 `jobs` 命令检查后台作业的状态。要将后台进程带回前台，请使用 `fg` 命令接作业号，例如 `fg %1`。要终止后台进程，请使用 `kill`
    命令接进程 ID，例如 `kill 12345`。


