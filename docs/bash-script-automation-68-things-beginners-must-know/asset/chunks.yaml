    ## 62\. Bash Exit Codes: 0 is True, Non-zero is False


    Learning Priority★★★★★


    Ease★★★★☆


    In Bash scripting, exit codes determine the success or failure of a command. Bash
    treats an exit code of 0 as "success" (true) and any non-zero code as "failure"
    (false). This behavior is the opposite of how truth values are generally treated
    in most programming languages.


    Understanding how Bash interprets exit codes is crucial for control flow, especially
    in conditional statements like if and loops. Knowing this helps you handle errors
    effectively and write scripts that respond to different command outcomes.


    [Code Example]


    # A successful command returns 0


    ls /tmp


    echo $?  # This will output 0


    # A failing command returns a non-zero value


    ls /nonexistentdirectory


    echo $?  # This will output a non-zero value, typically 2 or 1


    [Execution Result]


    0


    ls: cannot access ''/nonexistentdirectory'': No such file or directory


    2


    In Bash, every command returns an exit status upon completion, stored in the special
    variable $?.0 indicates success (true) in Bash logic, allowing control structures
    like if to proceed.Non-zero values (like 1, 2, 127) indicate different types of
    errors. These values can be useful in debugging or to take alternative actions
    in scripts.For example:if ls /tmp; then


    echo "Command succeeded!"


    else


    echo "Command failed!"


    fi


    In this script, if the ls command succeeds, it prints "Command succeeded!" If
    it fails, it prints "Command failed!"


    [Supplement]


    Common exit codes include 1 for general errors, 2 for misuse of shell built-ins,
    and 127 for command not found.$? holds the exit code of the last executed command,
    making it a crucial tool for error handling in Bash scripts.Some commands define
    their own specific exit codes (e.g., grep returns 1 if no matches are found, which
    is not an error but is still non-zero).


    ## 63\. Strings like "true" or "false" are not Boolean values in Bash


    Learning Priority★★★★★


    Ease★★★☆☆


    In Bash, strings such as "true" or "false" are treated as regular strings and
    do not have an inherent Boolean meaning. Bash does not interpret these as true
    or false values like in some other programming languages. Instead, the exit status
    of commands determines truthiness: an exit status of 0 is considered "true," and
    a non-zero exit status is considered "false."


    This example demonstrates how strings like "true" or "false" do not evaluate as
    Boolean values, and how the actual Boolean values in Bash depend on the command''s
    exit status.


    [Code Example]


    # A string "true" will be treated like any string, not a Boolean.


    if "true"; then


      echo "This will still run!"


    else


      echo "This will not run."


    fi


    # Correct approach using command exit status


    if /bin/true; then


      echo "This is true because /bin/true exits with status 0."


    else


      echo "This is false."


    fi


    [Execution Result]


    This will still run!


    This is true because /bin/true exits with status 0.'
