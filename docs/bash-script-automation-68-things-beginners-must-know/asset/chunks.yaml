    user    12345  0.0  0.0  10000   800 ?        S       00:00  00:00 sleep 100

    user    12346  0.0  0.0  10000   800 pts/0     S+      00:01  00:00 grep --color=auto
    sleep

    ```


    `ps aux` 命令列出所有运行的进程，而 `grep` 用于过滤此列表匹配特定名称（在本例中为 ''sleep''）的进程。在结果中，你可以看到两个项目：一个是
    sleep 进程本身，另一个是搜索它的 `grep` 命令。这是使用 `grep` 检查运行进程时的典型行为。


    [补充]


    `ps` 命令代表 "process status"（进程状态）。`aux` 选项提供了用户、PID、CPU 使用率和命令名称等详细信息。如需从结果中排除
    `grep` 进程，请使用 `ps aux | grep ''[s]leep''`，这可以避免匹配到 `grep` 进程本身。你可以使用 `kill` 接其
    PID 来停止进程（例如 `kill 12345`）。


