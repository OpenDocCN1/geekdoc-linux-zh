    # 第一章 简介\n\n## 1. 目的\n\n在本书中，你将找到关于 Bash 脚本的清晰且集中的介绍，专为已经有基础的初学者设计。内容仅涵盖了核心知识，让你专注于真正重要的部分。无论你是\
    \ Bash 脚本的新手还是想要提高自己的技能，本书都将提供从新手到专业水平进所需的一切。即使是经验丰富的用户也会将其作为一个快速参考，以回顾必须掌握的技巧。\n\
    \n# 第二章 初学者教程\n\n## 1. 使用 #!/bin/bash 指定解释器\n\n在 Bash 脚本中，第一行应该以 `#!/bin/bash`\
    \ 开始。这被称为“Shebang”，它告诉系统使用 Bash 解释器作为解释器。如果没有它，系统可能会尝试使用不同的 Shell 或解释器来运行脚本，导致错误。\n\
    \n为了确保脚本在正确的解释器中运行，你必须在脚本顶部包含 `#!/bin/bash` Shebang。\n\n```bash\n#!/bin/bash\n\
    # 一个简单的问候用户的脚本\necho \"Hello, World!\"\n```\n\n**Hello, World!**\n\n`#!/bin/bash`\
    \ 是给操作系统的指令。执行脚本时，系统会检查第一行以确定使用哪种解释器。如果是 `#!/bin/bash`，系统将使用 Bash Shell 运行脚本。你可以将\
    \ `/bin/bash` 替换为其他 Shell（如 `#!/bin/sh`），使用不同的解释器。如果你忘记写 Shebang，脚本将默认使用当前终端会话中的\
    \ Shell，这可能不是 Bash。\n\n## 2. 使用 chmod +x 让你的脚本具有执行权限\n\n编写好 Bash 脚本后，你需要使用 `chmod\
    \ +x` 命令使其具有执行权限。这是像程序一样运行的权限。如果没有它，系统将不允许你直接运行脚本。\n"
- fmt: "\nIn order to run your script by typing its name in the terminal, you must\
    \ give it execution permission using the `chmod +x` command.\n\n### Code Example\n\
    \n```bash\n# First, create the script\necho -e '#!/bin/bash\\necho \"This is an\
    \ executable script!\"' > script.sh\n\n# Then, make it executable\nchmod +x script.sh\n\
    \n# Now you can run it directly\n./script.sh\n```\n\n### Execution Result\n\n\
    This is an executable script!\n\nThe command `chmod +x script.sh` modifies the\
    \ permissions of the script, allowing it to be executed by the user. By default,\
    \ newly created scripts do not have execute permissions, so the system will not\
    \ allow you to run them directly unless you explicitly change their permissions.\
    \ After running `chmod +x script.sh`, the script can be executed using `./script.sh`.\
    \ If you don't make it executable, you'd need to run it using `bash script.sh`\
    \ instead, which does not require execute permission but is less convenient.\n\
    \n### Supplement\n\nThe `chmod` command stands for \"change mode\" and is used\
    \ to modify file permissions in Unix-like systems. The `+x` flag adds execute\
    \ permission for the script, meaning it can be run as a program.\n\n## 3. Executing\
    \ a script using ./script.sh\n\nLearning Priority★★★★★\nEase★★★★☆\n\nTo execute\
    \ a Bash script in the terminal, use the `./script.sh` command after making sure\
    \ the script has executable permissions. This is one of the first things to learn\
    \ when automating tasks with Bash.\n\nTo run a Bash script from the command line,\
    \ you need to ensure that the script has executable permissions. Then, you can\
    \ execute it using `./script.sh`.\n\n### Code Example\n\n```bash\n# Step 1: Ensure\
    \ your script has executable permissions\nchmod +x script.sh\n\n# Step 2: Execute\
    \ the script\n./script.sh\n```\n\n### Execution Result\n\nIf the script is correct,\
    \ it will run and display the output of the commands inside the script. For example,\
    \ if `script.sh` contains: `#!/bin/echo \"Hello, World!\"`\n\nThe terminal will\
    \ output:\n\nHello, World!\n\nThe `chmod +x script.sh` command gives the script\
    \ executable permissions. Without this, the script won't run using `./../` specifies\
    \ that the script is in the current directory. If the script is in another location,\
    \ you must provide the correct path (e.g., `~/scripts/myscript.sh`). The `#!/bin/bash`\
    \ at the beginning of the script is called a \"shebang\" and tells the system\
    \ that this script should be run using the Bash shell.\n\n### Supplement\n\nIf\
    \ you get an error like permission denied, it usually means the script doesn't\
    \ have the proper executable permissions. Using `./script.sh` ensures you are\
    \ running the script from your current directory, while running `script.sh` without\
    \ `./` would only work if the directory is in your system’s `PATH`.\n\n## 4. Assigning\
    \ variables in Bash without spaces\n\nLearning Priority★★★★☆\nEase★★★★☆\n\nIn\
    \ Bash scripting, variables are assigned without spaces between the variable name,\
    \ equal sign, and value. This is important to prevent errors and ensure the script\
    \ runs as expected.\n\nTo correctly assign a value to a variable in a Bash script,\
    \ there must be no spaces around the equal sign.\n\n### Code Example\n\n```bash\n\
    #!/bin/\n\n# Assign a value to a variable (no spaces around the equals sign)\n\
    my_var=\"Hello, World!\"\n\n# Output the value of the variable\necho $my_var\n\
    ```\n\n### Execution Result\n\nHello, World!\n\nIf you place spaces around the\
    \ equal sign, like `my_var = \"Hello, World!\"`, you will get an error.\n\n###\
    \ Supplement\n\nThe `chmod` command stands for \"change mode\" and is used to\
    \ modify file permissions in Unix-like systems. The `+x` flag adds execute permission\
    \ for the script, meaning it can be run as a program.\n\n## 5. Using $(command)\
    \ to Capture Output\n\nLearning Priority★★★★★\nEase★★★★☆\n\nIn Bash, `$(command)`\
    \ allows you to capture the output of a command into a variable. This is useful\
    \ when you need to process the result of a command later.\n\n### Code Example\n\
    \n```bash\n#!/bin/\n# Capture the date\ncurrent_date=$(date)\n\n# Print the captured\
    \ date\necho \"Today's date is $current_date\"\n```\n\n### Execution Result\n\n\
    Today's date is [Current Date]\n\n## 6. Checking the Exit Status of the Last Command\
    \ with $?\n\nLearning Priority★★★★★\nEase★★★☆☆\n\nIn Bash, every command returns\
    \ an exit status. 0 means success, and any non-zero value indicates an error.\
    \ You can check if a command was successful by examining `$?`.\n\n### Code Example\n\
    \n```bash\n#!/bin/\n# Try to change to a directory\ncd /nonexistent/directory\n\
    \n# Check the status of the last command\nif [ $? -eq 0 ]; then\n    echo \"Directory\
