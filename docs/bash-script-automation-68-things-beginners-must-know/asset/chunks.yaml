    ## 52 Generate Random Numbers in Bash Using $RANDOM


    Learning Priority★★★☆☆


    Ease★★★★★


    In Bash, you can generate random numbers using the `$RANDOM`. Each time `$RANDOM`
    is called, it returns a random integer between 0 and 32767.


    To generate a random number, simply reference the `$RANDOM` variable. You can
    also scale it to a range.


    [Code Example]


    ```bash

    # Example of generating a random number

    echo $RANDOM # Outputs a random number between 0 and 32767


    # Example of generating a random number within a range (1-100)

    random_number=$(( $RANDOM % 100 + 1 ))

    echo "Random number between 1 and 100: $random_number"

    ```


    [Execution Result]


    15243```


    The `$RANDOM` variable is a built-in feature of Bash, and it generates pseudo-random
    numbers. To create random numbers within a specific range, modulo (%) is used
    to limit the upper bound, and addition ensures the lower bound is respected. The
    formula `($RANDOM % range + min)` can be adapted to any range. For example, to
    get a random number between 50 and 150, you would use: `random_number=$(( $RANDOM
    % 101 + 50 ))` # Range: 50-150


    [Supplement]


    Because `$RANDOM` generates pseudo-random numbers, the sequence can be predictable
    if you start the shell with the same state. You can change the starting point
    of the sequence using the `RANDOM` variable itself. For instance: `RANDOM=42`
    # Sets a specific seed


    `echo $RANDOM` # Outputs the next random number from this seed-```


    ## 53 Search for Files in a Directory Tree Using find


    Learning Priority★★★★★


    Ease★★★★☆


    The `find` command in Bash allows you to search for files and directories within
    a directory hierarchy, making it essential for navigating and managing files.
    It provides flexible filtering options, such as searching by name, size, or modification
    time.


    Here’s a simple example of how to use the `find` command to search for files in
    a directory by name.


    [Code Example]


    ```bash

    # Search for all files named ''example.txt'' in the current directory and its
    subdirectories

    find . -name "example.txt"


    # To search for all files with a ''.log'' extension

    find /var/logs -name "*.log"


    # To search for all files modified within the last 7 days

    find /home/user/Documents -mtime -7

    ```


    [Execution Result]


    ```

    ./example.txt

    /var/logs/system.log

    /home/user/Documents/report.txt

    ```

