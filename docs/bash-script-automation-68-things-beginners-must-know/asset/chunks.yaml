    This is a new line\nThis is on a new line\nThis is a new line\nThis is on a new\
    \ line\n```\n\nWhile `echo` may not always interpret escape sequences (like `\\\
    n` for newlines) correctly, `printf` handles them predictably across different\
    \ environments. `printf` also allows you to format numbers, strings, and other\
