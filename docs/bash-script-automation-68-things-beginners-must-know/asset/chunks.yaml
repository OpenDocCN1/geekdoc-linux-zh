    Second line of text


    The > operator overwrites any existing content in a file, starting fresh with
    only the new content. In contrast, the >> operator keeps the existing content
    in the file and appends the new output at the end. Using > is useful when you
    want to reset or update the file entirely, while >> is commonly used for logging,
    where you want to keep a history of all outputs.


    [Supplement]


    This distinction is critical in automation, particularly in logging. Accidentally
    using > instead of >> could result in losing important data. Always double-check
    when appending to ensure you''re preserving prior output.


    ## 27\. Handling Signals with trap in Bash Scripts


    Learning Priority★★★★☆


    Ease★★★☆☆


    The trap command in Bash allows you to handle signals like SIGINT (which happens
    when you press Ctrl+C) during script execution. This is important to prevent the
    script from being interrupted unexpectedly and ensure proper cleanup before exiting.


    Below is a simple example showing how to use trap to catch SIGINT (Ctrl+C). When
    the user tries to interrupt the script, it will display a custom message instead
    of exiting immediately.


    [Code Example]


    #!/bin/


    # Function to handle Ctrl+C (SIGINT)


    cleanup() {


      echo "Caught SIGINT! Cleaning up before exiting..."


      exit 1


    }


    # Trap SIGINT (Ctrl+C) and call the cleanup function


    trap cleanup SIGINT


    # Simulate a long-running process


    echo "Press Ctrl+C to test the trap. Sleeping for 10 seconds..."


    sleep 10


    echo "Done without interruption!"


    [Execution Result]


    Press Ctrl+C to test the trap. Sleeping for 10 seconds...


    Caught SIGINT! Cleaning up before exiting...


    Signals in Unix: A signal is a way to notify a process that an event has occurred.
    SIGINT (Signal Interrupt) is sent when the user presses Ctrl+C, and it normally
    terminates the script immediately.The trap command: trap allows you to specify
    code that will run when a particular signal is received. In this case, the signal
    is SIGINT, and the code is the cleanup function.Why use trap?: Without trap, a
    script would terminate instantly on Ctrl+C, which might leave files open or other
    processes incomplete. Using trap ensures you can handle such interruptions properly.Other
    Signals: Apart from SIGINT, you can handle other signals like SIGTERM (termination),
    SIGQUIT (quit), etc., using trap.


    [Supplement]'
