    ## 49 Running Commands in the Background Using ''&''


    Learning Priority★★★★☆


    Ease★★★★☆


    In Bash scripting, the `&` symbol allows you to run a command in the background
    while still using the terminal for other tasks. This is useful for multitasking
    or running long-running processes without blocking the terminal.


    The following code demonstrates how to use the `&` symbol to execute a command
    in the background, allowing you to keep using the terminal without waiting for
    the command to finish.


    [Code Example]


    ```bash

    # Run a long-running command in the background

    sleep 10 &


    # Print a message immediately after running the background command

    echo "The sleep command is running in the background!"

    ```


    [Execution Result]


    ```

    [1] 12345  # This is the job ID and process ID of the background process

    The sleep command is running in the background!

    ```


    When you append `&` to a command, it runs in the background, freeing up the terminal.
    This is especially helpful when you need to start a task, like downloading a file
    or running a server, without waiting for it to finish. The terminal will display
    the process ID (PID) and job number of the background task so that you can track
    it.


    [Supplement]


    You can check the status of background jobs with the `jobs` command. To bring
    a background process to the foreground, use the `fg` command followed by the job
    number, e.g., `fg %1`. To terminate a background process, use the `kill` command
    followed by the process ID, e.g., `kill 12345`.


    ## 50 Checking If a Process Is Running with ps aux | grep


    Learning Priority★★★★★


    Ease★★★☆☆


    The `ps aux | grep` command allows you to check if a particular process is running.
    It''s a powerful tool for process management and debugging in Linux, often used
    to find running programs by their name or other attributes.


    The following command example demonstrates how to use `ps aux | grep` to search
    for a running process. It checks whether a specific process, like `sleep`, is
    active.


    [Code Example]


    ```bash

    # Run a command in the background

    sleep 100 &


    # Check if the ''sleep'' process is running

    ps aux | grep sleep

    ```


    [Execution Result]


    ```

    user    12345  0.0  0.0  10000   800 ?        S       00:00  00:00 sleep 100

    user    12346  0.0  0.0  10000   800 pts/0     S+      00:01  00:00 grep --color=auto
    sleep

    ```


    The `ps aux` command lists all running processes, and `grep` is used to filter
    this list for processes matching a specific name (in this case, ''sleep''). In
    the result, you can see two entries: one for the sleep process itself and one
    for the `grep` command that searched for it. This is a typical behavior when using
    `grep` to check running processes.


    [Supplement]


    The `ps` command stands for "process status." The `aux` options provide details
    such as user, PID, CPU usage, and command name. To exclude the `grep` process
    from the results, use `ps aux | grep ''[s]leep''`, which avoids matching the `grep`
    process itself. You can stop a process using `kill` followed by its PID (e.g.,
    `kill 12345`).


