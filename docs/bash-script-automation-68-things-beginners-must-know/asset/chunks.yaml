    -b was triggered with argument: world


    getopts processes options one at a time. In the example, -a and -b are expected
    to have arguments (a: and b:).$OPTARG is the variable that stores the value of
    the current option''s argument.This example expects both -a and -b to be followed
    by values (e.g., -a value -b value).If an option does not require an argument,
    you can remove the colon (e.g., -c for a flag that doesn’t need a value).getopts
    is ideal for handling options like flags or switches when executing scripts.


