  trans: "\n\n`[[ ... ]]` 比 `[ ... ]` 更健壮，因为它能更优雅地处理特殊字符和逻辑运算符。它避免了单词拆分等问题，并允许如正则表达式模式匹配（`==`,\
    \ `!=`）等高级功能。与 `[ ... ]` 不同，它对包含空格的变量不需要特殊的引号。\n\n### 补充\n`[[ ... ]]` 是 Bash 特有的，在所有\
    \ shell 中都可用。在符合 POSIX 标准的脚本中，应该使用 `[ ... ]`。在 `[[ ... ]]` 内部，模式匹配不需要对 `*` 加引号，而\
    \ `[ ... ]` 则需要小心加引号以避免通配符（globbing）和展开。\n\n## 8. 始终引用变量以防止单词拆分和通配\n\n学习优先级：★★★★★\n\
    难度：★★★★☆\n\n在 Bash 脚本中，展开变量时始终加上引号非常重要。如果不加引号，shell 可能会按空格分割变量内容或执行无预期的文件名扩展（通配），这可能导致意外的结果。\n\
    \n使用 `\" \"` 引用变量可以确保其内容被视为单个值，避免单词拆分和通配等问题。\n\n### 代码示例\n```bash\n#!/bin/# 如果没有引号，变量可能会被空格拆分\n\
    filename=\"my file.txt\"\n\n# 错误用法（无引号）：\n# 如果文件名包含空格，此处将失效\nif [ -e $filename\
    \ ]; then\n    echo \"$filename exists\"\nelse\n    echo \"$filename does not\
    \ exist\"\nfi\n\n# 正确用法（带引号）：\nif [ -e \"$filename\" ]; then\n    echo \"$filename\
    \ exists\"\nelse\n    echo \"$filename does not exist\"\nfi\n```\n\n### 执行结果\n\
    ```text\nmy file.txt does not exist  # 不加引号的错误结果\nmy file.txt exists         #\
    \ 带引号的正确结果\n```\n\n当变量未加引号时，Bash 可能会在空格或其他特殊字符处分割该值（称为单词拆分）。此外，如果变量包含 `*` 或 `?`\
    \ 等通配符字符，Bash 可能会尝试将它们展开为当前目录下的文件名（通配）。始终引用变量可以确保它们被作为单个字面值处理。\n\n### 补充\n引用不仅是为了文件名。在任何表达式中使用变量时，始终加上引号以避免意外行为。`\"\
    $@\"` 是函数参数中的一个特殊情况：作为整体传递时应始终加引号以保留参数的间隔。\n\n## 9. 使用 \"$@\" 安全处理所有脚本参数\n\n学习优先级：★★★★★\n\
    难度：★★★★☆\n\nBash 脚本中的 `\"$@\"` 变量允许你安全地传递给脚本的所有参数。它保留了参数中空格和特殊字符的完整性，是处理多个参数最可靠的方法。\n\
    \n在编写 Bash 脚本时，`\"$@\"` 确保每个参数都被视为一个独立的实体，即使它包含空格。这在处理包含空格或特殊字符的文件名或参数时尤为重要。\n\
    \n### 代码示例\n```bash\n#!/bin/# 一个安全输出所有提供参数的简单脚本\necho \"All arguments passed to\
    \ the script:\"\n\n# \"$@\" 独立处理每个参数，即使它包含空格\nfor arg in \"$@\"; do\n  echo \"\
    $arg\"\ndone\n```\n\n### 执行结果\n```text\n$ ./script.sh \"file 1.txt\" file2.txt\
    \ \"file 3.txt\"\nAll arguments passed to the script:\nfile 1.txt\nfile2.txt\n\
    file 3.txt\n```\n\n使用 `\"$@\"` 确保每个参数都被单独处理，即使参数包含空格。如果不给 `\"$@\"` 加引号，包含空格的参数可能会被拆分成多个参数。将其与使用\
    \ `$*` 进行比较，`*` 将所有参数合并为一个字符串，并根据空格进行分割。这在处理包含空格的文件名时会导致错误。\n\n### 补充\n`\"$@\"\
    ` 的行为类似于 `$1`、 `$2` 等位置参数，但它是一次性处理所有参数的快捷方式。`\"$@\"` 确保了跨环境的兼容性，并避免了处理带空格的文件名等复杂输入时的常见陷阱。\n\
    \n## 10. 使用 $1, $2 等访问命令行参数\n\n学习优先级：★★★★☆\n难度：★★★☆☆\n\n在 Bash 脚本中，如 `$1`、 `$2`\
    \ 等位置参数允许你直接访问单个命令行参数。传递给脚本的每个参数对应一个特定的数字，其中 `$1` 是第一个，`$2` 是第二个，依此类推。\n\n使用位置参数是获取传递给\
    \ Bash 脚本的特定参数的直接方法。但你需要注意空格和缺失参数的情况，因为每个参数都与特定的索引绑定。\n\n### 代码示例\n```bash\n#!/bin/#\
    \ 一个用于显示如何访问特定命令行参数的脚本\necho \"The first argument is: $1\"\necho \"The second\
    \ argument is: $2\"\necho \"The third argument is: $3\"\n```\n\n### 执行结果\n```text\n\
    $ ./script.sh apple banana cherry\nThe first argument is: apple\nThe second argument\
    \ is: banana\nThe third argument is: cherry\n```\n\n`$1` 访问第一个参数，`$2` 访问第二个，依此类推。这些被称为位置参数。如果提供的参数比预期的少，相应的变量将为空。例如，如果运行脚本时不提供第三个参数，`$3`\
    \ 将为空。\n\n### 补充\n`$0` 指脚本的名称或路径，而 `$#` 提供传递的参数总数。注意：当参数包含空格时，传递时应用引号括起来，以防被拆分成单独参数。\n\
    \n## 11. 使用 $# 统计命令行参数\n\n学习优先级：★★★★★\n难度：★★★★☆\n\nBash 中的 `$#` 变量会自动跟踪传递给脚本的参数数量。当脚本需要根据输入采取不同行为时，这非常有用。以下示例展示了如何使用\
    \ `$#` 统计参数数量。\n\n### 代码示例\n```bash\n#!/bin/# 统计并显示参数数量的简单脚本\necho \"You have\
    \ passed $# arguments to the script.\"\n\n# 可选：循环遍历显示参数\nif [ $# -gt 0 ]; then\n\
    \  echo \"Here are the arguments:\"\n  for arg in \"$@\"; do\n    echo \"$arg\"\
    \n  done\nelse\n  echo \"No arguments were passed.\"\nfi\n```\n\n### 执行结果\n```text\n\
    $ ./count_args.sh apple banana orange\nYou have passed 3 arguments to the script.\n\
    Here are the arguments:\napple\nbanana\norange\n\n$ ./count_args.sh\nYou have\
    \ passed 0 arguments to the script.\nNo arguments were passed.\n```\n\n`$#` 保存传递给脚本的参数数量。如果没有传递参数，`$#`\
    \ 将等于零。`for arg in \"$@\"` 循环遍历所有提供的参数，而 `\"$@\"` 将每个参数展开为独立的字符串，保留了空格和其他特殊字符。\n\
    \n### 补充\n`$@` 与 `$*`：`$@` 将每个参数视为独立的实体，而 `$*` 将所有参数视为一个字符串。在没有参数的情况下，`$#` 为 0，`$@`\
    \ 展开为空字符串。\n\n## 12. 使用 shift 顺序处理命令行参数\n\n学习优先级：★★★★☆\n难度：★★★☆☆\n\nBash 中的 `shift`\
    \ 命令用于逐个移动位置参数（参数）。在执行 `shift` 后，第一个参数（`$1`）会被移除，所有其他参数都会向下移动一位。\n\n以下示例演示了如何使用\
    \ `shift` 顺序处理并移除参数。\n\n### 代码示例\n```bash\n#!/bin/# 使用 shift 处理每个参数的脚本\necho \"\
    Processing arguments sequentially:\"\n\nwhile [ $# -gt 0 ]; do\n  echo \"Current\
    \ argument: $1\"\n  shift # 移动到下一个参数\ndone\necho \"All arguments processed.\"\n\
    ```\n\n### 执行结果\n```text\n$ ./shift_example.sh first second third\nProcessing\
    \ arguments sequentially:\nCurrent argument: first\nCurrent argument: second\n\
    Current argument: third\nAll arguments processed.\n```\n\n"
- fmt: "\nEach time shift is called, the first argument (`$1`) is discarded, and the\
    \ remaining arguments are shifted left. This is useful for scripts where you need\
    \ to process each argument in turn but don't want to keep all arguments in memory.\
    \ After each shift, `$2` becomes `$1`, `$3` becomes `$2`, and so on, until there\
    \ are no arguments left.\n\n[Supplement]\n\nYou can use `shift n` to shift by\
    \ more than one position, where `n` is the number of positions to shift. After\
    \ all arguments are shifted out, `$#` becomes 0, meaning there are no more arguments\
    \ left to process.\n\n## 13. Environment variables are accessible throughout a\
    \ script\n\nLearning Priority★★★★★\nEase★★★★☆\n\nEnvironment variables in Bash\
    \ scripts are key-value pairs that are accessible globally within the script.\
    \ These variables can be referenced anywhere in the script and be used in various\
    \ operations, making them powerful for managing configuration, paths, and other\
    \ system-related data. They are crucial for automation tasks because they allow\
    \ data to be passed and reused efficiently.\n\nIn the following example, we define\
    \ an environment variable `MY_VAR` and demonstrate how it can be accessed and\
    \ used in different parts of the script. This shows the global availability of\
    \ environment variables.\n\n[Code Example]\n\n```bash\n#!/bin/bash\n\n# Define\
    \ an environment variable\nMY_VAR=\"Hello, Bash!\"\n\n# Use the environment variable\n\
    echo \"The value of MY_VAR is: $MY_VAR\"\n\n# Modify the environment variable\n\
    MY_VAR=\"Hello, World!\"\necho \"After modification, MY_VAR is: $MY_VAR\"\n```\n\
    \n[Execution Result]\n\nThe value of MY_VAR is: Hello, Bash!\nAfter modification,\
    \ MY_VAR is: Hello, World!\n\nEnvironment variables are set in the shell and can\
    \ be referenced anywhere in the script using the `$` sign followed by the variable\
    \ name. These variables are global within the scope of the script, meaning they\
    \ can be accessed and modified at any point in the script without re-declaration.\
    \ If a variable is modified, the change is immediately reflected wherever it is\
    \ used next.\n\n[Supplement]\n\nTo see all the environment variables available\
    \ in your current shell, you can use the `printenv` or `env` command. These commands\
    \ will list all the environment variables currently available to your session,\
    \ along with their values.\n\n## 14. Exporting variables to make them available\
    \ to child processes\n\nLearning Priority★★★★★\nEase★★★☆☆\n\nWhen a Bash script\
    \ creates child processes (like calling another script or command), environment\
    \ variables are not passed automatically. You must use the `export` command to\
    \ make a variable available to these child processes. This is especially useful\
    \ in complex automation tasks where you need to share data between scripts or\
    \ processes.\n\nIn the following example, we define a variable and demonstrate\
    \ that without `export`, it is not available to child processes. Then, we use\
    \ `export` to make it available and show how the child process can access it.\n\
    \n[Code Example]\n\n```bash\n#!/bin/bash\n\n# Define a variable\nLOCAL_VAR=\"\
    I am local\"\n\n# Try accessing it in a child process (this won't work)\nbash\
    \ -c 'echo \"Child process sees: $LOCAL_VAR\"'\n\n# Now export the variable\n\
    export GLOBAL_VAR=\"I am global\"\n\n# Access the exported variable in a child\
    \ process (this will work)\nbash -c 'echo \"Child process sees: $GLOBAL_VAR\"\
    '\n```\n\n[Execution Result]\n\nChild process sees:\nChild process sees: I am\
    \ global\n\nThe `export` command marks a variable for export to child processes,\
    \ allowing them to inherit that variable. In the example, the first `bash -c`\
    \ command does not display `LOCAL_VAR` because it was not exported. The second\
    \ `bash -c` command shows the value of `GLOBAL_VAR` because it was exported, making\
    \ it available to the child process.\n\n[Supplement]\n\nEnvironment variables\
    \ can be used in scripts that interact with the system, such as defining paths\
    \ for executables or configuring application environments. The `export` command\
    \ is vital in multi-script or multi-process automation workflows to ensure data\
    \ is shared properly between scripts and commands.\n\n## 15. Removing Variables\
    \ Using unset\n\nLearning Priority★★★★☆\nEase★★★★☆\n\nThe `unset` command in Bash\
    \ is used to delete or remove variables from the shell environment. Once a variable\
    \ is removed, it can no longer be accessed or used.\n\nThis example shows how\
    \ to set, access, and remove a variable using `unset`.\n\n[Code Example]\n\n```bash\n\
    # Create a variable and assign a value to it\nmy_var=\"Hello, World!\"\n\n# Access\
    \ the variable\necho \"Before unset: $my_var\"\n\n# Remove the variable\nunset\
    \ my_var\n\n# Try accessing the variable again\necho \"After unset: $my_var\"\n\
    ```\n\n[Execution Result]\n\nBefore unset: Hello, World! \nAfter unset:\n\nThe\
    \ `unset` command removes the variable completely from the shell environment.\
    \ In the second `echo` statement, the variable no longer exists, so nothing is\
    \ printed. It's important to know that `unset` can only remove variables within\
    \ the scope of the current shell session. Once a variable is unset, you must redefine\
    \ it if you want to use it again.\n\n[Supplement]\n\n`unset` can also be used\
    \ to delete shell functions, not just variables. Using `unset` on a non-existent\
    \ variable will not cause an error; it will silently do nothing.\n\n## 16. Declaring\
    \ Functions in Bash\n\nLearning Priority★★★★★\nEase★★★☆☆\n\nIn Bash, functions\
    \ allow you to group a set of commands under a single name. Functions are defined\
    \ using the `function_name() { commands; }` syntax and can be invoked by calling\
    \ the function name.\n\nThis example demonstrates how to declare, call, and pass\
    \ arguments to a function.\n\n[Code Example]\n\n```bash\n# Define a function that\
    \ takes two arguments\ngreet() {\n    echo \"Hello, $1! Welcome to $2.\"\n}\n\n\
    # Call the function with arguments\ngreet \"Alice\" \"Bash scripting\"\n```\n\n\
    [Execution Result]\n\nHello, Alice! Welcome to Bash scripting.\n\nIn this example,\
    \ `greet()` is a function that takes two arguments (`$1`, `$2`). When the function\
    \ is called with `\"Alice\"` and `\"Bash scripting\"`, those values are passed\
    \ as arguments. This is a powerful way to modularize your code and make it reusable.\n\
    \n[Supplement]\n\nBash functions do not need the `function` keyword; you can declare\
    \ a function directly using `name() { commands; }` syntax. Functions in Bash do\
    \ not return values like other programming languages. Instead, you can return\
    \ an exit status using `return` or output data using `echo`.\n\n## 17. Check if\
    \ a command is available using command -v\n\nLearning Priority★★★★☆\nEase★★★★☆\n\
    \nThe `command -v` utility helps check if a command exists on the system, which\
    \ is crucial when writing scripts that depend on tools. If the command is available,\
    \ it will return the command path, otherwise, it will return nothing.\n\nThis\
    \ example demonstrates how to use `command -v` to check if a specific command\
    \ (e.g., `git`) is installed. If it exists, it prints a success message; if not,\
    \ it prints a failure message.\n\n[Code Example]\n\n```bash\n#!/bin/bash\n\n#\
    \ Check if 'git' command exists\nif command -v git >/dev/null 2>&1; then\n   \
    \ echo \"Git is installed.\"\nelse\n    echo \"Git is not installed.\"\nfi\n```\n\
    \n[Execution Result]\n\nIf git is installed, it will output:Git is installed.\
    \ \nIf git is not installed, it will output:Git is not installed.\n\nThe `command\
    \ -v` command checks if a given command is available in the system’s `$PATH`.\
    \ Redirecting output (`>/dev/null 2>&1`) ensures that no unnecessary output appears\
    \ on the screen, allowing us to handle the result in a clean way. This is especially\
    \ useful in scripts where you need to check dependencies before proceeding with\
    \ certain actions.\n\n[Supplement]\n\nThe `command -v` utility is more reliable\
    \ than alternatives like `which` or `type` because it is built into most shells\
    \ and offers portability across different Unix-like systems.\n\n## 18. Automatically\
    \ exit on failure using set -e\n\nLearning Priority★★★★★\nEase★★★☆☆\n"
