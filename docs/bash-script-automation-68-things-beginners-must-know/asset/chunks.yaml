    ps aux | grep some_process_name


    # Once you find the PID, use kill to terminate it


    kill 12345  # Replace 12345 with the actual PID


    [Execution Result]


    If the process with PID 12345 is running, it will be terminated, and no output
    will be shown. If the process does not exist, you''ll get an error:: kill: (12345)
    - No such process


    The kill command does not always "kill" a process immediately. It sends a signal
    to the process. By default, it sends signal 15 (SIGTERM), which tells the process
    to terminate gracefully. If the process doesn''t respond, you can forcefully terminate
    it using signal 9 (SIGKILL). Example:kill -9 12345  # This sends a SIGKILL signal,
    which forces the process to stop


    To find the PID of a process, you can also use the pgrep command, which searches
    for processes by name:pgrep some_process_name


    [Supplement]


    Bash has different signals that can be sent using the kill command, such as SIGHUP
    (signal 1), SIGINT (signal 2), SIGTERM (signal 15), and SIGKILL (signal 9). Each
    signal has a different behavior, and not all processes respond to them in the
    same way. The most common signals are SIGTERM (gentle termination) and SIGKILL
    (forceful termination).


