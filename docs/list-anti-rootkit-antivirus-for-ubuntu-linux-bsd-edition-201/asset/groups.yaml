    # # Ubuntu、Linux & BSD 反 Rootkit 与反杀毒软件列表 (2018版)


    Muhammad Vandestra

    Dragon Promedia Studio


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_0_0.png)


    # # 反 Rootkit 与反杀毒软件列表

    适用于 Ubuntu, Linux & BSD

    (2018版)


    作者：

    Muhammad Vandestra & Dragon Promedia Studio

    2018


    # 序言


    所有的计算机系统都可能遭受恶意软件、勒索软件和病毒的影响，包括 BSD 和 Linux。坦率地说，Linux 病毒非常少，因此用户通常不会安装杀毒软件。但仍然建议
    Linux 用户在连接网络或有文件传输的 Linux 系统上安装杀毒软件。某些用户可能认为杀毒软件占用了过多资源。坦率地说，存在低占用的 Linux 杀毒软件。为了更好地理解杀毒程序，如果你经营着拥有多台工作站的中小型企业，在中央计算机上安装杀毒软件可能是一个好主意，它可以管理公司所有的电子邮件、数据和流量。为了保护系统免受病毒攻击，最好的方法仅是从受信任的网站下载并安装软件。随着
    Linux 版 AVG Antivirus 的停产以及 Symantec、Norton 或 McAfee 等大厂软件的缺失，Linux 在操作系统安全方面只剩下少数选择。为了防止黑客接管你的
    Linux 系统，Ubuntu、Debian、Mint、Fedora 和 CentOS 等良好的杀毒软件是必须的。


    ## 1. Comodo 杀软件


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_6_0.png)


    Linux 版 Comodo 杀毒软件 (CAVL) 提供与 Windows 版本相同的病毒保护，并带有完全配置的反垃圾邮件系统。CAVL 具有访问时和按需病毒扫描器功能，还利用基于云的行为分析对未知文件提供无与伦比的保护。强大的
    AV 引擎辅以高度可配置的邮件网关，过滤垃圾邮件并拦截电子邮件威胁。功能包括：


    - 主动 AV 保护所有已知威胁

    - 自动更新最新的病毒库

    - 包含扫描调度程序、详细的事件查看器和扫描配置文件

    - 邮件过滤器兼容 Postfix、Gmail 和 Exim MTA

    - 安装后即可使用：无烦人的误报，提供可靠的病毒保护。适用于 Linux 电脑的强大杀毒软件


    - 检测并消除 Linux 笔记本电脑和台式电脑上的病毒

    - 邮件网关拦截电子邮件和垃圾邮件

    - 具有访问时、按需和基于云的扫描功能

    - 病毒库每日更新多次


    ## 2. Linux 工作站 F-PROT


    ![](img/5b2a9ddda94540065fa5b6cbfb03bd5_7_0.png)


    对于使用开源操作系统的家庭用户，我们提供了 Linux 工作站 F-Prot 杀毒软件。Linux 工作站 F-PROT 杀毒软件利用著名的 F-PROT
    杀毒引擎进行主要扫描，此外还有一套搜索未知病毒的内部启发式系统。F-PROT 杀毒软件专门用于消除威胁 Linux 工作站的病毒，提供针对宏病毒和其他恶意软件（包括木马）的全面保护。Linux
    工作站 F-PROT 的功能包括：


    - 扫描超过 219958 病毒及其变体

    - 使用 `cron` 工具执行计划扫描

    - 扫描硬盘、CD-ROM、软盘、网络驱动器、目录和特定文件

    - 扫描引导扇病毒、宏病毒和木马


    ## 3. ClamAV 杀毒软件


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_8_0.png)


    ClamAV 是一种开源 (GPL) 杀毒引擎，用于多种场景，包括电子邮件扫描、网络扫描和端点安全。它提供了多种工具，包括灵活可扩展的多线程守护进程、命令行扫描程序和高级数据库更新工具。功能包括：


    - 命令行扫描

    - 用于 sendmail 的 Milter 接口

    - 用于脚本更新和数字签名的高级数据库更新器

    - 病毒库每日更新多次

    - 内置支持所有标准邮件格式

    - 内置支持各种存档格式，包括 Zip, RAR, D, Tar, Gzip, Bzip2, OLE2, Cabinet, CHM, BinHex, SIS
    等

    - 内置支持 ELF 执行文件以及使用 UPX、FSG、Petite、NSPack、wwpack32、MEW、Upack 包以及由 SUE、Yuda Cryptor
    等加密的可移动执行文件

    - 内置支持流行文档格式，包括 MS Office 和 MacOffice、HTML、Flash、RTF 和 PDF


    ## 4. Sophos Linux 恶意软件扫描


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_9_0.png)


    Sophos 杀毒引擎可以有效检测并清理病毒、木马和其他恶意软件。除了基于高级启发式的复杂检测，Linux 版 Sophos 还使用 Live Protection
    通过 SophosLabs 实时查询疑文件。为了防止 Linux 机器成为分发点，Linux 版 Sophos 还检测、阻止并移除 Windows、Mac
    和 Android 恶意软件。功能：


    - 通过访问时、按需或计划扫描检测并阻止恶意软件

    - 性能卓越，影响低


    ## 5. F-Secure Linux 安全


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_10_0.png)


    F-Secure 是 Linux 最完整的安全软件，它拥有从防火墙到云端杀毒再到网络保护的所有功能。F-Secure Linux Security 为使用
    Linux 环境的企业提供服务器和客户端保护。它支持多种平台。支持以下 32 位发行版：


    - CentOS 6.7

    - Debian 7.9

    - Oracle Linux 6.6, 6.7

    - Red Hat Linux 6.7

    - SUSE Linux Server 11 SP1, SP4

    - Ubuntu 12.04, 14.04


    支持以下 64 位 (AMD64)发行版：


    - CentOS 6.7, 7.1

    - Debian 7.9, 8.0, 8.1

    - Oracle Linux 6.6, 7.1 UEK

    - RHEL 7.1

    - SUSE Linux Server 12


    ## 6. Panda DesktopSecure Linux


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_12_0.png)


    Panda DesktopSecure Linux 是运行 Linux 电脑的理想解决方案。它专为运行该操作系统的家庭电脑（包括笔记本和台式机）特定保护需求而设计。这种强大且易用的杀毒软件包含了多种技术和防火墙，以防止病毒、黑客和入侵者导致的数据丢失。


    - 全面保护：Panda DesktopSecure Linux 中和所有类型的病毒、蠕虫、木马、拨号器、间谍软件和垃圾邮件，无论威胁源自 Windows
    还是 Linux。

    - 永久邮件保护：电子邮件是恶意软件传播的主要手段。确保监控发送到用户邮箱的电子邮件，以便在感染文件系统之前消除威胁。PandaDesktop 扫描最常用的电子邮件客户端，如
    Xian Evolution、Kmail、Mozilla Mail 和 Thunderbird。


    '
