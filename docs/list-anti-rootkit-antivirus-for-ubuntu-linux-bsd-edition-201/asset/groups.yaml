    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_0_0.png)


    # # List Anti Rootkit & AntiVirus

    For Ubuntu, Linux & BSD

    (Edition 2018)


    by

    Muhammad Vandestra & Dragon Promedia Studio

    2018


    # Prolog


    All computer systems can suffer from malware, ransomware and viruses, including
    BSD and Linux. Frankly, very few viruses exist for Linux, so users typically do
    not install antivirus software. It is still recommended that Linux users have
    antivirus software installed on Linux systems that are on a network or that have
    files being transferred to the device. Some users may argue that antivirus software
    uses up too much resources. Frankly, low-footprint software exists for Linux.
    To better understand antivirus programs, it may be beneficial to understand malware
    itself.


    If you are running a SME business with a number of workstations, it might be a
    good idea to install an antivirus on the central computer that manages all the
    emails, data and traffic in your company. The best way to protect a system against
    viruses is to only download and install software from trusted sites and developers.


    With the discontinuation of AVG Antivirus for Linux and the lack of security suite
    from big players such as Symantec Norton or Intel McAfee, Linux are left with
    a few choices when it comes to OS security. Linux users are generally free from
    virus attack but bugs that enables a hacker to take over your linux system is
    out there, then an antivirus with a good firewall is a must for your Ubuntu, Debian,
    Mint, Elementary, Fedora, CentOS and more.


    ## 1. Comodo Antivirus


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_6_0.png)


    Comodo Antivirus for Linux (CAVL) offers the same virus protection as our Windows
    software with the added benefit of a fully configured anti-spam system.


    Featuring on-access and on-demand virus scanners, CAVL also uses cloud based behavior
    analysis of unknown files to provide unrivalled protection against zero-day malware.
    The powerful AV engine is complemented by a highly configurable mail gateway to
    filter spam and block email-borne threats. Features


    - Proactive AV protection intercepts all known threats

    - Automatic updates for the most up-to-date virus protection

    - Includes scan scheduler, detailed event viewer and customer scan profiles

    - Mail filter is compatible with Postfix, gmail and Exim MTAs

    - Install and forget. No annoying false alarms, just solid virus protection.


    Powerful anti-virus and email filtering software for Linux based computers.


    - Detects and eliminates viruses from Linux based laptops and desktops

    - Mail gateway blocks email-borne viruses and spam

    - Features on-access, on-demand, and cloud based scanning

    - Virus definitions updated multiple times per day

    - Simple to use: install and forget while Comodo Antivirus protects you in the
    background.


    ## 2. F-PROT for Linux Workstations


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_7_0.png)


    For home users using the Linux open-source operating system, we offer F-Prot Antivirus
    for Linux Workstations. F-Prot Antivirus for Linux Workstations utilizes the renowned
    F-PROT Antivirus engine for primary scan but in addition to that a system of internal
    heuristics devised to search for unknown viruses


    F-PROT Antivirus for Linux was specially developed to effectively eradicate viruses
    threatening workstations running Linux. It provides full protection against macro
    viruses and other forms of malicious software – including Trojans. F-PROT for
    Linux Workstations features:


    - Scans for over 219958 viruses and their variants

    - Ability to perform scheduled scans when using the cron utility

    - Scans hard drives, CD-ROMS, diskettes, network drives, directories and specific
    files

    - Scans for images of boot sector viruses, macro viruses and Trojan Horses


    ## 3. Clamav Antivirus


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_8_0.png)


    ClamAV is an open source (GPL) anti-virus engine used in a variety of situations
    including email scanning, web scanning, and end point security. It provides a
    number of utilities including a flexible and scalable multi-threaded daemon, a
    command line scanner and an advanced tool for automatic database updates. Features


    - Command-line scanner

    - Milter interface for sendmail

    - Advanced database updater for scripted updates and digital signatures

    - Virus database updated multiple times per day

    - Built-in support for all standard mail file formats

    - Built-in support for various archive formats, including Zip, RAR, Dng, Tar,
    Gzip, Bzip2, OLE2, Cabinet, CHM, BinHex, SIS and others

    - Built-in support for ELF executables and Portable Executable files packed with
    UPX, FSG, Petite, NSPack, wwpack32, MEW, Upack and obfuscated by SUE, Yuda Cryptor
    and others

    - Built-in support for popular document formats including MS Office and MacOffice,
    HTML, Flash, RTF and PDF


    ## 4. Sophos Linux Malware Scanner


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_9_0.png)


    The Sophos Antivirus engine effectively detects and cleans viruses, Trojans, and
    other malware. In addition to sophisticated detection-based on advanced heuristics,
    Sophos Antivirus for Linux uses Live Protection to look up suspicious files in
    real time via SophosLabs.


    To prevent the Linux machine from becoming a distribution point, Sophos Antivirus
    for Linux also detects, blocks, and removes Windows, Mac, and Android malware.
    Features:


    - Detects and blocks malware with on-access, on-demand, or scheduled scanning

    - Excellent performance, low impact


    ## 5. F-Secure Linux Security


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_10_0.png)


    F-Secure is the most complete security software for Linux, it has ever feature
    from Firewall to Cloud Antivirus, to Web Protection. F-Secure Linux Security provides
    both server and client protection for companies using the Linux environment. It
    provides a wide varieties of platforms. The following 32-bit distributions are
    supported:


    - CentOS 6.7

    - Debian 7.9

    - Oracle Linux 6.6, 6.7

    - Red Hat Linux 6.7

    - SUSE Linux Server 11 SP1, SP4

    - Ubuntu 12.04, 14.04


    The following 64-bit (AMD64) distributions are supported:


    - CentOS 6.7, 7.1

    - Debian 7.9, 8.0, 8.1

    - Oracle Linux 6.6, 7.1 UEK

    - RHEL 7.1

    - SUSE Linux Server 12


    ## 6. Panda DesktopSecure for Linux


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_12_0.png)


    Panda DesktopSecure for Linux is the ideal solution for computers running Linux.
    It is designed to respond to the specific protection demands of home computers,
    both laptops and PCs, running this operating system.


    This powerful and simple to use antivirus includes a wide range of technologies
    and a firewall to prevent data loss from your PC caused by viruses, hackers and
    intruders.


    - Complete protection — Panda DesktopSecure for Linux neutralizes all types of
    threats: viruses, worms, Trojans, dialers, spyware, spam; regardless of the source
    of the threat: Windows or Linux. PandaDesktopSecure also incorporates a heuristic
    engine that can detect potential threats and block them until the disinfection
    routine is available.


    - Permanent mail protection — Email is the main means of propagation by malware.
    It is essential to ensure that you have permanent protection that monitors the
    email messages sent to users’ mailboxes in order to eliminate the threat before
    it infects the file system. PandaDesktop scans the most widely used mail clients,
    such as Xian Evolution, Kmail, Mozilla Mail and Thunderbird


    - Ease of use – Panda DesktopSecure has been specifically designed for home computers
    and workstations, providing an intuitive graphic interface based on X-Window,
    which is fully compatible with the majority of distributions and desktops on the
    market, such as Gnome and KDE. DesktopSecure can also warn you in the case of
    incidents and offers clear reports of the scans carried out, and includes a detailed
    information system to keep you informed.


    - Powerful firewall — DesktopSecure for Linux incorporates firewall technology
    to protect against access attempts from remote computers and external connection
    attempts from the protected computer, identifying the application involved as
    if it were a personal firewall. This firewall can also be configured using system
    rules to administer external connections.

