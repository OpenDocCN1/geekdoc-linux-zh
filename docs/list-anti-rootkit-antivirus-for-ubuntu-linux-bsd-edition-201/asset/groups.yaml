    For Fedora-based systems:


    ```

    sudo dnf install clamav

    ```


    For SUSE-based systems:


    ```

    sudo zypper in clamav

    ```


    If you''re running a Debian-based desktop, you can install ClamTK (the GUI) with
    the command:


    ```

    sudo apt install clamtk

    ```


    There are also third-party tools that can be added (to include support for the
    likes of MTA, POP3, Web & FTP, Filesys, MUA, Bindings, and more).


    Upon installation, the first thing you''ll want to do is update the signatures
    with the command sudo freshclam. Once that completes, you can scan a directory
    with the command:


    ```

    clamscan -r -i DIRECTORY

    ```


    where DIRECTORY is the location to scan. The -r option means to recursively scan
    and the -i options means to only print infected files. If you work with the GUI,
    it''s even easier. From the GUI you can run a scan, and should ClamAV find anything,
    act on it (Figure 1).


    The one caveat to ClamAV is that it does not include real-time scanning. In fact,
    if you''re not using the ClamTK GUI, then to create a scheduled scan, you must
    make use of crontab. With the ClamTK GUI, you can only set up a schedule for your
    user home directory.'
