    # 7. Avast Core Security


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_14_0.png)


    Avast security for linux comes in 3 different package, you can choose to protect
    your Linux email servers, file servers or the entire network.


    +   - Avast Core Security – Basic antivirus that combat the newest threats and
    malware from infecting your linux server.

    - Avast File Server Security – Protect files right on your server and save the
