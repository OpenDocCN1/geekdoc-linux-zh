- pgno: 22
  md: '# How To Install ClamAV Antivirus On Ubuntu & Other Linux Distro


    ![](img/5b2a9ddda94540065fa5b6cbfb03bdc5_22_0.png)


    Without a doubt, ClamAV is the most popular option for keeping viruses off of
    your Linux machines and out of your shared directories. There are a few reasons
    why ClamAV is so popular among the Linux crowd. First, it''s open source, which
    in and itself is a big win. Second, it''s very effective in finding trojans, viruses,
    malware, and other threats. ClamAV features a multi-threaded scanner daemon which
    is perfectly suited for mail servers and on-demand scanning.


    ClamAV can run from command line or it with the ClamTK GUI. Both tools are easy
    to use and very dependable. Installing ClamAV is simple.


    For Debian-based systems:


    ```

    sudo apt install clamav

    ```


    For RHEL/CentOS systems:


    ```

    sudo yum install epel-release

    ```


    ```

    sudo yum install clamav

    ```'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'For Fedora-based systems:


    ```

    sudo dnf install clamav

    ```


    For SUSE-based systems:


    ```

    sudo zypper in clamav

    ```


    If you''re running a Debian-based desktop, you can install ClamTK (the GUI) with
    the command:


    ```

    sudo apt install clamtk

    ```


    There are also third-party tools that can be added (to include support for the
    likes of MTA, POP3, Web & FTP, Filesys, MUA, Bindings, and more).


    Upon installation, the first thing you''ll want to do is update the signatures
    with the command sudo freshclam. Once that completes, you can scan a directory
    with the command:


    ```

    clamscan -r -i DIRECTORY

    ```


    where DIRECTORY is the location to scan. The -r option means to recursively scan
    and the -i options means to only print infected files. If you work with the GUI,
    it''s even easier. From the GUI you can run a scan, and should ClamAV find anything,
    act on it (Figure 1).


    The one caveat to ClamAV is that it does not include real-time scanning. In fact,
    if you''re not using the ClamTK GUI, then to create a scheduled scan, you must
    make use of crontab. With the ClamTK GUI, you can only set up a schedule for your
    user home directory.'
  merge: -1
  img_proc: true
