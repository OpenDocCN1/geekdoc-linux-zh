    ![](img/811ca1dd60b3dba6276f6fbead02a4df_0_0.png)


    > Enjoy Your System!


    > 6/10/24, 10:44 AM


    # ARTICLES


    # ENJOY YOUR SYSTEM!


    By Marina Vishmidt , 14 September 2005


    A spectre is haunting the European art system : the spectre of Openness! Marina
    Vishmidt inspects the freshly objectified remains of ''Process Art'' exhibited
    as Open Systems at Tate Modern


    > ''Everything is forgotten, everything is possible, everything is,"great"''Jeff
    Wall, Dan Graham''s Kammerspiel(1)


    Until the 18th of September, there is an exhibition of the blockbuster type to
    be visited at Tate Modern which is called Open Systems: Rethinking Art c.1970.
    The exhibition showcases a wild, woolly, and professedly heterogeneous array of
    international responses to the crisis of the autonomous art object over a time
    period roughly demarcated as the beginning of the 1960s to the mid-late 1970s.
    Roughly demarcated, and loosely interpellated, as work that reflects upon the
    relationship of art production to economic, geopolitical, and other worldly ''systems'',
    it undertakes to chronicle this ''opening'' with an ambition that could only be
    described as epochal if its results could be described less persuasively as anodyne.


    In her introductory text to Open Systems, curator Donna DeSalvo cites other recent
    comprehensive museum surveys of the conceptualist moment in contemporary art such
    as Reconsidering the Object of Art, Los Angeles Museum of Contemporary Art, 1995
    and Circa 1968, Museu de Serralves, Porto, 1999 (though, curiously, not the better-known
    in Britain Live in Your Head show at the Whitechapel Gallery in 2001) and sites
    her own enterprise apart from these as more of a ''proposition'', deftly aligning
    it with the letter and spirit of so many art gestures from that time now historicized
    as ''conceptual''. However, although it might be wise, it''s hard to exercise
    wholehearted restraint in echoing here Lawrence Weiner''s own oft-cited proposition,
    ''the piece need not be built''. Framing the show as a mere proposition can thus
    legitimate any observed shortfalls in curatorial rigor or thematic coherence as
    not just emblematic of the work itself, but rooted in the critical meta-discourse
    which imbues conceptual art at every level. To what extent such a framing clarifies
    the project of Open Systems or compounds the system-generated noise is a debate
    of however limited interest, but it may in turn generate a series of counter-propositions:


    +   1/ Under the terms of engagement spelled out in the catalogue text, any room
    filled with art in Tate Modern could be annotated as the Open Systems exhibition.


    +   2/The transition from object to process-based art is presented as an object.


    +   3/The tensions and ruptures in the smooth circuit of artworld signification
    marked by the work exhibited in Open Systems are elided by the absence of contemporary
    context, any reference to the institutional system that provides a platform for
    such laminated critique, or any scepticism as to the currency of the terms ''open''
    and ''system'' in contemporary cultural production. This gap of reflexivity need
    not be read as subversive.


    As counter-propositions, they may supply some ballast to negotiate the otherwise
    humdrum aporia of viewing Open Systems as constitutively anything but, or the
    apotheosis of a ''recuperated'' institutional critique, the production of a system
    that can reference an outside as a tense instant, and only in an instant, before
    its casual absorption, e.g. the art institution as microcosm of capital.


    https://www.metamute.org/editorial/articles/enjoy-your-system


    1/4'
