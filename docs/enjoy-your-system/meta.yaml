    rehearsal of openness within its walls (see upcoming Open Congress at Tate Britain).
    Whereas art institutions elsewhere in Europe gamely attempt to restructure themselves
    in line with the principles of relationality and transience they espouse (Palais
    de Tokyo, Rooseum Malmö, Shedhalle Zürich), Tate has never courted such pretensions,
    diffidently carrying on as a capital-intensive neutral container of big-ticket
    spectaculars and politicised aesthetic speculation alike. So it is perhaps in
    the non-convergence of a museum colloquy of experimental culture from 30 and 40
    years ago and the quest to adequately museum-ify the ''de-materialised'' art of
    digital networks that the system really comes into its own; a red carpet by the
    river for ''openness'' and a red fire extinguisher for the consequences of the
    de-materialisation of the art object, even after all this time.


    (1) extracted in Conceptual Art: A Critical Anthology, Alexander Alberro and Blake
    Stimson, eds., MIT Press, 2000.'
