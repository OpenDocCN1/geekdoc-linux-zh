    \ quixotic 共鸣**。）\n\n![](img/811ca1dd60b3dba6276f6fbead02a4df_2_0.png)\n\n展览开幕三天后，一场关于策展数字媒体的研讨会——**《策展，非物质性，系统》**——作为《开放系统》活动项目的一部分举行。全神贯注于桌上新策展地形的难题，除丹麦策展人Jakob\
