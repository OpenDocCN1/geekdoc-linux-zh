    ** articulates 过去并不意味着认识'它本是如何'。它意味着掌控一种记忆，正如它在危险时刻闪现**\"，我们在这类展览中既不冒**前者之沉闷浪漫主义**的风险，也不冒**后者之未经审查的偶然性**的风险——这类展览只是指出，Donald\
    \ Judd**展演了空间中形式的极简主义现象学**，而Cildo Meireles**在钞票和可乐瓶上印制反对派信息并将它们送回流通**，两者都在与**系统**打交道。\n\
    \n（系统中无疑存在一个** fugitive 扭曲**：当我参观展览时，Martha Rosler的\"厨房符号学\"录像带的反射正播放于**遮蔽**Valie\
