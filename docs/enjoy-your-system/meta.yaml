    > Enjoy Your System!


    > 6/10/24, 10:44 AM


    # ARTICLES


    # ENJOY YOUR SYSTEM!


    By Marina Vishmidt, 14 September 2005


    A spectre is haunting the European art system: the spectre of Openness! Marina
    Vishmidt inspects the freshly objectified remains of ''Process Art'' exhibited
    as Open Systems at Tate Modern


    > ''Everything is forgotten, everything is possible, everything is, "great"''
    Jeff Wall, Dan Graham''s Kammerspiel(1)


    Until the 18th of September, there is an exhibition of the blockbuster type to
    be visited at Tate Modern which is called Open Systems: Rethinking Art c.1970.
    The exhibition showcases a wild, woolly, and professedly heterogeneous array of
    international responses to the crisis of the autonomous art object over a time
    period roughly demarcated as the beginning of the 1960s to the mid-late 1970s.
    Roughly demarcated, and loosely interpellated, as work that reflects upon the
    relationship of art production to economic, geopolitical, and other worldly ''systems'',
    it undertakes to chronicle this ''opening'' with an ambition that could only be
    described as epochal if its results could be described less persuasively as anodyne.


    In her introductory text to Open Systems, curator Donna DeSalvo cites other recent
    comprehensive museum surveys of the conceptualist moment in contemporary art such
    as Reconsidering the Object of Art, Los Angeles Museum of Contemporary Art, 1995
    and Circa 1968, Museu de Serralves, Porto, 1999 (though, curiously, not the better-known
    in Britain Live in Your Head show at the Whitechapel Gallery in 2001) and sites
    her own enterprise apart from these as more of a ''proposition'', deftly aligning
    it with the letter and spirit of so many art gestures from that time now historicized
    as ''conceptual''. However, although it might be wise, it''s hard to exercise
    wholehearted restraint in echoing here Lawrence Weiner''s own oft-cited proposition,
    ''the piece need not be built''. Framing the show as a mere proposition can thus
    legitimate any observed shortfalls in curatorial rigor or thematic coherence as
    not just emblematic of the work itself, but rooted in the critical meta-discourse
    which imbues conceptual art at every level. To what extent such a framing clarifies
    the project of Open Systems or compounds the system-generated noise is a debate
    of however limited interest, but it may in turn generate a series of counter-propositions:


    - 1/ Under the terms of engagement spelled out in the catalogue text, any room
    filled with art in Tate Modern could be annotated as the Open Systems exhibition.


    - 2/ The transition from object to process-based art is presented as an object.


    - 3/ The tensions and ruptures in the smooth circuit of artworld signification
    marked by the work exhibited in Open Systems are elided by the absence of contemporary
    context, any reference to the institutional system that provides a platform for
    such laminated critique, or any scepticism as to the currency of the terms ''open''
    and ''system'' in contemporary cultural production. This gap of reflexivity need
    not be read as subversive.


    As counter-propositions, they may supply some ballast to negotiate the otherwise
    humdrum aporia of viewing Open Systems as constitutively anything but, or the
    apotheosis of a ''recuperated'' institutional critique, the production of a system
    that can reference an outside as a tense instant, and only in an instant, before
    its casual absorption, e.g. the art institution as microcosm of capital.


    https://www.metamute.org/editorial/articles/enjoy-your-system


    1/4


    Perhaps the trick is to play ''spot the system''. When afflicted by paralysing
    doubt as to what accounts for the simultaneous presence of apparently unrelated
    objects or indeed as to your own place in the world, seize upon a plausible system.
    The tagline Supported by individual American Patrons and Exhibition Patrons of
    Tate may provide a facile simulacrum of one. The exigencies of availability of
    privately collected work produced within the temporal parameters of the exhibition
    may explain disconcerting omissions (British ones spring to mind: Stephen Willats,
    John Latham, Mary Kelly ... ) and incongruities of presence (Bas Jan Ader?) as
    much as anything else. The garrulous kaleidoscope of Open Systems throws up a
    great deal that is interesting and evocative, as much for the safe detonation
    of fossilised critical insights as for the infrequency of public display, a form
    of pleasure gently prompted by the glassy specimens of Marcel Broodthaers'' ''Un
    jardin d''hiver'' and the inaudible narration of Robert Smithson''s slide projection
    ''Hotel Palenque'' in the adjacent room, but maybe more trenchant in Hans Haacke''s
    ''Shapolsky et al., Manhattan Real Estate Holdings, a Real Time Social System,
    as of May 1, 1971'' installation of photographic panels that were once hot enough
    to merit the Guggenheim''s kibosh, but now smile as serenely from the walls of
    Tate Modern as a trophy elk over the mantelpiece.


    Robert Smithson was of course powerfully interested in systems, or rather, the
    entropy attendant on them. If the exhibition is to submit to a systemic analysis,
    it can be read as manifesting this emergent property, entropy, dissolution hot
    on the heels of homeostasis. On the face of it, this next-to-last phase of perfect
    homogeneity has been finessed by the show. Work is de-contextualised, the taxonomy
    and chronology employed can be a touch desultory. Mel Bochner''s "Measurement:
    Room", (black tape and Letraset fixed to the gallery walls, mapping out and indicating
    their height and length) deliberately telescopes this undecideability between
    historical gloss and site-fidelity: although the piece was crafted for the installation
    space in the show, it is not altogether clear whether the measurements of the
    room in Tate Modern are being taken or the measurements of the original space
    of installation are being given. The idea is a machine for producing the work,
    but the mileage of the work is that it does not map cleanly onto the idea - it
    produces a space of encounter, and contaminates the frame of reference. If the
    actual measurements of the room in the Tate where this is installed are beside
    the point, it would be a non sequitur, rendered inoperative as a piece albeit
    more effective as a museum piece. If the measurements do correspond, then this
    would be the only moment in the exhibition where space and context emerge, grudgingly,
    at the unavoidable behest of the work. Either way, the perceptual imbalance prompted
    by an acme of rigorous precision provides torsion for the navigation of the rest
    of a staid display and points beyond it. But this is not to eliminate the incipient
    tokens of entropy. This entropy may make itself felt by small dysfunctionalities
    accumulating over the course of the exhibition (small objects being filched from
    interactive displays, projectors going on the blink, Helio Oiticica''s orange
    juice machine in his ''Project FILTRO for Vergara, New York'' 1972, needing a
    clean) or in more imposing slippages, like the eschewing of critical context of
    critique in the presentation of avowedly critical work with specific critical
    targets. But it may well be the case that the ''Open Systems'' proposition can
    be viewed through yet another prism, one that enjoins us to ''just step sideways''
    from the whole systems scheme and take a fundamentally unsystematic tack.


    ![](img/811ca1dd60b3dba6276f6fbead02a4df_1_1.png)


    The Wikipedia entry for ''nominalism'' tells us that it is the position in metaphysics
    that there exist no universals outside of the mind. ''Nominalism is best understood
    in contrast to realism. Philosophical realism holds that when we use descriptive
    terms such as "green" or "tree" the Forms of those concepts really exist, independently
    of world in an abstract realm. Such thought is associated with Plato. Nominalism,
    by contrast, holds that ideas represented by words have no real existence beyond
    our imaginations.'' What valence does the concept hold for Open Systems? Principally,
    the unflaggingly undead Duchampian insight that art is a function of naming. This
    would be nominalism in action. If all that artworks have in common is being named
    as such, this highlights art''s status as a particular kind of commodity, rather
    than a subject of universal judgements of aesthetic taste. Once this is established
    it ramifies any attempt to reach out into ''non-art'' systems, whether parasitically
    or critically or both. So if the show wants you to play a game of name that system,
    that''s one riposte, which would entail another, folded into the first: look at
    the naming and the production of difference that ensues. This is difference considered
    strictly in light of the homeostatic sameness that the ''Open Systems'' system
    produces: this proposition aims to subdue the situated instability of difference
    and stop it from entropically proliferating. A system opens up to eat; cybernetics
    should have taught us that much, and Open Systems is no exception, although the
    exhibition programme at the Tate Modern has served up more striking examples in
    the past see [http://www.tate.org.uk/modern/shrinkingchildhoods/](http://www.tate.org.uk/modern/shrinkingchildhoods/).


    Meanwhile, the system of art practice and exhibition is constituted by the production
    of difference, both as a discrete field of endeavour in social space and internally,
    among its material, de-materialised and discursive objects. So the philosophical
    impasse between universalism and nominalism repeats itself as a metabolic one,
    between a system indeterminate in its signification and closed in its effects
    organising various art work ''systems'' attempting to survive and expand by exceeding
    their membranes and incorporating/infecting other systems, in some cases hoping
    to trigger extreme systemic breakdown. If a system implies a universal dimension,
    structuring a multiplicity of relations in enunciating a purpose or set of objectives,
    nominalism perceives objects as atomised and unities as conventional. Open Systems
    utilises a bait-and-switch technique, at one moment positing a generality of systemic
    engagement for its exhibits, at another pulling back and calling this an unverifiable
    proposition, albeit less in a bracing spirit of inquiry than equivocation. This
    is one way to enjoy Open Systems or possibly get an intimation of its real modus
    operandi: first, forget about systems, second, think about systems. The proliferation
    of names when the flows of signification exceed cognitive and economic rationality,
    and are in turn encompassed by them, conceptual art has taught us that much. How
    antagonism turns into an exhibit of congealed time. Think about a power station
    that was metabolised into the people''s palace of cultural enjoyment by the mangle
    of urban change, think of heat death.


    The elision of the disjunctures and correspondences that obtain between the show''s
    thematic and institutional context would make for an easy target. But this hiatus
    is only an index of an overriding deafness to the vicissitudes of time and site,
    of life and spectacle and gender and money that conditioned the assembled artefacts,
    somewhere, sometimes, somehow ... ? If in Walter Benjamin''s words, ''to articulate
    what is past does not mean to recognize "how it really was". It means to take
    control of a memory, as it flashes in a moment of danger'' we do not run the risk
    of either the stolid romanticism of the former or the unvetted contingency of
    the latter in a show pointing out that Donald Judd, who enacted the Minimalist
    phenomenology of form in space and Cildo Meireles, who printed oppositional messages
    on bank notes and Coke bottles and sent them back into circulation, were both
    engaging with systems.


    (There is no doubt a fugitive kink in the system: when I visited the exhibition,
    the reflection from Martha Rosler''s ''Semiotics of the Kitchen'' video tape was
    playing on the glass shielding a large photograph documenting Valie Export and
    Peter Weibel''s ''From the Portfolio of Doggedness'' action. Perhaps the seeming
    abeyance of the curatorial concept was really intended to make space for such
    quixotic resonances.)


    ![](img/811ca1dd60b3dba6276f6fbead02a4df_2_0.png)


    Three days after the show opened, a symposium on curating digital media, Curating,
    Immateriality, Systems took place as part of the Open Systems events programme.
    Engrossed in the conundrums of the new curatorial topographies on the table, none
    of the speakers, save for Danish curator Jakob Lillemose, alluded to the exhibition
    or the issues it raised at any point, just as the exhibition scrupulously demurred
    from any address to present-day rethinking of art production or curation. Perhaps
    inadvertent, or a pleasingly symmetrical illustration of the uses and abuses of
    the signifier ''open'' in what is after all a vertically'
  mdcn: "\n 暂无需调用工具。这是OCR后处理任务，我将直接分析文本并完成要求的修正、合并、格式化工作。\n\n## 处理后文本\n\n![](img/811ca1dd60b3dba6276f6fbead02a4df_0_0.png)\n\
    \n> 享受你的系统！\n\n> 2024年6月10日，上午10:44\n\n# 文章\n\n# 享受你的系统！\n\n作者：Marina Vishmidt，2005年9月14日\n\
    \n一个幽灵正在欧洲艺术体系上空游荡：开放的幽灵！Marina Vishmidt检视了在泰特现代美术馆以\"开放系统\"之名展出的、新近被客体化的\"过程艺术\"\
    遗骸\n\n> \"一切都已被遗忘，一切皆有可能，一切都是，'伟大的'\"\n> ——杰夫·沃尔，丹·格雷厄姆的《室内剧》(1)\n\n截至9月18日，泰特现代美术馆有一场重磅展览可供参观，名为**开放系统：重新思考约1970年的艺术**。展览展示了大量狂野、毛茸茸且自称异质的国际回应，针对的是大约从1960年代初到1970年代中晚期这一时间段内**自主性艺术客体**的危机。这段时期被粗略地划定，松散地定义为反映艺术生产与经济、地缘政治及其他世俗\"\
    系统\"之间关系的作品，它肩负着记录这一\"开放\"的雄心——如果其结果能更不被令人信服地描述为平淡无奇的话，这份雄心只能被称为划时代的。\n\n在《开放系统》的导论文字中，策展人Donna\
    \ DeSalvo引用了其他近期对当代艺术中观念主义时刻进行全面性博物馆调研的展览，如洛杉矶当代艺术博物馆的《重新思考艺术的对象》（1995年）和波尔图塞拉维斯博物馔的《约1968年》（1999年）（尽管奇怪的是，她并未提及在英国更为人熟知的2001年白教堂美术馆\"\
    生活在你的头脑中\"展览），并将自己的事业与这些展览区分开来，将其定位为更像一种\"命题\"，巧妙地使其与那个时代如今被历史化为\"观念\"的众多艺术手势的**字面与精神**保持一致。然而，尽管这可能很明智，却很难全心全意地克制自己不去呼应劳伦斯·韦纳本人常被引用的命题：\"\
    这件作品不需要被建造\"。将展览框定为仅仅是一个命题， thus 可以将任何观察到的策展严谨性或主题连贯性上的不足合法化，不仅作为作品本身的象征，而且植根于在**各个层面**赋予观念艺术以生命的那种批判性元话语。这样的框架在多大程度上澄清了《开放系统》的项目，抑或加剧了系统生成的噪音，是一个兴趣有限的争论，但它可能反过来产生一系列**反命题**：\n\
    \n- 1/ 根据目录文字中阐明的参与条款，泰特现代美术馆任何装满艺术的房间都可以被标注为《开放系统》展览。\n\n- 2/ 从客体到基于过程的艺术的过渡被呈现为一个客体。\n\
    \n- 3/ 《开放系统》中展出的作品所标记的艺术世界表意平滑回路中的张力与断裂，因当代语境的缺失、对提供这种层压批判平台的制度系统的任何指涉、以及对\"\
    开放\"和\"系统\"这两个词在当代文化生产中**流通性**的任何质疑而被抹去。这种反思性的缺口不必被解读为颠覆性的。\n\n作为**反命题**，它们可能为协商提供某种平衡，否则将陷入把《开放系统》视为本质上**并非开放**的平凡困境，或者被\"\
    收编\"的制度批判的**极致**——一种能够引用外部作为一个紧张瞬间的系统之生产，而且仅在一瞬间，便被随意吸收，例如，作为资本缩影的艺术机构。\n\nhttps://www.metamute.org/editorial/articles/enjoy-your-system\n\
    \n1/4\n\n也许诀窍在于玩\"找出系统\"的游戏。当被令人麻痹的怀疑所困扰，不确定是什么导致了表面上毫不相关的客体同时存在，或者不确定你自己在世界上的位置时，抓住一个看似写出了的体系。Supported\
    \ by individual American Patrons and Exhibition Patrons of Tate（由个体美国赞助人和泰特展览赞助人支持）这一标语可能提供了一个肤浅的**拟像**。在展览的时间参数内创作的私人收藏作品的**可用性**要求，或许可以解释那些令人不安的遗漏（英国的例子跃然脑海：Stephen\
    \ Willats、John Latham、Mary Kelly……）和令人不安的存在（Bas Jan Ader？），就像其他任何东西一样。《开放系统》那喋喋不休的万花筒涌现出大量有趣且唤起回忆的事物，既因为它对僵化批判洞察的安全引爆，也因为公开展示的稀少——一种由Marcel\
    \ Broodthaers的\"冬日花园\"玻璃标本及其隔壁展厅Robert Smithson幻灯片投影\"帕伦克酒店\"的听不见的叙述所轻轻唤起的愉悦形式，但或许Hans\
    \ Haacke的\"Shapolsky等人，曼哈顿房地产控股，一个实时社会系统，截至1971年5月1日\"的摄影面板装置更为尖锐，这些面板曾经热到足以招致古根海姆博物馆的禁止，如今却像壁炉架上方的战利品麋鹿一样，从泰特现代美术馆的墙上**安详地微笑**。\n\
    \nRobert Smithson当然对系统，或者更确切地说，对系统所伴随的**熵**，怀有强烈的兴趣。如果展览要接受**系统性分析**，它可以被解读为展现了这一**涌现属性**：**熵**，**溶解紧跟在稳态之后**。表面上，这种近乎最后的**完全同质**阶段已经被展览巧妙处理。作品被**去语境化**，所采用的分类学和年代学可能有些**敷衍**。Mel\
    \ Bochner的《\"测量：房间\"》（黑色胶带和Letraset固定于展厅墙面，勾勒并标示其高度和长度）故意压缩了这种**历史光泽**与**场所忠诚**之间的不可判定性：尽管这件作品是为展览中的安装空间而制作的，但尚不清楚是在测量泰特现代美术馆房间的实际尺寸，还是在给出原始安装空间的尺寸。这个观念是一部生产作品的机器，但作品的妙处在于它并不能干净利落地映射到观念上——它产生了一个**遭遇空间**，并**污染**了参照框架。如果泰特安装这件作品的房间的实际测量无关紧要，那将是一个**非\
    \ sequitur**，作为一件作品而言虽被**废止**，但作为**博物馆藏品**却更为有效。如果测量确实对应，那么这将是展览中唯一一个空间和语境在作品的**不可回避的指令**下**勉强浮现**的时刻。无论如何，由**严谨精确的极致**所引发的感知失衡，为其余**沉闷展示**的导航提供了**张力**，并指向了更远的地方。但这并不能消除**熵的萌芽迹象**。这种熵可能通过展览过程中累积的小功能失调来显现（交互展示中的小型物品被盗、投影仪出故障、Helio\
    \ Oiticica橙汁机在其1972年\"为纽约Vergara的FILTRO项目\"中需要清洁），或者以更**显赫的滑移**形式出现，例如在呈现明确具有批判性的作品时**规避批判语境**及其**具体批判目标**。但很可能，《开放系统》这一命题可以通过另一种棱镜来审视，它要求我们\"\
    只需向旁边跨一步\"，**脱离整个系统方案**，采取一种根本**非系统性的策略**。\n\n![](img/811ca1dd60b3dba6276f6fbead02a4df_1_1.png)\n\
    \n维基百科\"唯名论\"词条告诉我们，它是形而上学中认为**心灵之外不存在共相**的立场。\"唯名论最好通过与实在论的对比来理解。哲学实在论认为，当我们使用描述性术语如'绿色'或'树'时，这些概念的形式真实存在，独立于世界，存在于一个抽象领域。这种思想与柏拉图相关联。相比之下，唯名论认为，词语所代表的观念除了我们的想象之外没有真实的存在。\"\
    这一概念对《开放系统》具有怎样的**价值**？ principally，**杜尚式**那种经久不衰的**不死洞察**：艺术是**命名**的功能。这将是**行动中的唯名论**。如果艺术品唯一的共同点是被命名为艺术品，这就凸显了艺术作为一种特殊商品的**地位**，而非**普遍审美判断**的主体。一旦这一点确立，它就**使任何伸向\"\
    非艺术\"系统的尝试变得复杂化**，无论是寄生性的、批判性的，还是兼而有之。所以如果展览想让你玩**\"命名那个系统\"**的游戏，那是一种回应，其中还包含着另一种回应，**折叠于**第一种之中：审视**命名**及随之而来的**差异生产**。这是**严格根据**\"\
    开放系统\"系统所产生的**稳态同一性**来考虑的**差异**：这一命题旨在**驯服差异的情境性不稳定**，阻止其**熵性地增殖**。系统打开是为了**进食**；控制论应该已经教会了我们这一点，《开放系统》也不例外，尽管泰特现代美术馆的展览项目在过去曾提供过更**醒目的例子**，参见[http://www.tate.org.uk/modern/shrinkingchildhoods/](http://www.tate.org.uk/modern/shrinkingchildhoods/)。\n\
    \n与此同时，艺术实践和展览的**系统**由**差异的生产**所构成，既作为社会空间中一个**离散的实践领域**，也在其内部，在其物质的、**非物质化的**和话语的客体之间。因此，**普遍主义与唯名论之间的哲学超越了**作为**代谢性超越而重复自身**，介于一种**意义不确定但效果封闭的系统**组织各种艺术作品\"\
    系统\"试图通过**超越其膜边界**并**整合/感染其他系统**来生存和扩张，在某些情况下希望触发**极端的系统崩溃**。如果系统意味着一种**普遍维度**，在**宣示目的或目标集**时结构多元关系，那么唯名论将客体感知为**原子化的**，将统一体感知为**约定俗成的**。《开放系统》运用了一种**\
    \ bait-and-switch 技巧**，一时为其展品**假设一种系统参与的普遍性**，一时又退缩回来，称这是一种**无法验证的命题**，与其说是一种**振奋精神的探究**，不如说是**模棱两可**。这是享受《开放系统》的一种方式，或者可能**窥见其真正运作方式**：首先，**忘记系统**；其次，**思考系统**。当表意之流**超越认知和经济理性**，继而**被它们所囊括**时，名称的增殖——观念艺术已经教会了我们这一点。**对抗如何变成凝结时间的展览**。想想一座发电站如何通过城市变迁的**绞肉机**被**代谢为人民的文化享受宫殿**，想想**热寂**。\n\
    \n展览主题与其制度语境之间存在的**断裂与对应**的**抹除**将是一个容易的目标。但这种** hiatus** 仅仅是一种**索引**，指向对**时间流转和场所变迁**、**生活与\
