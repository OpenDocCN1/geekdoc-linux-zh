    综合性机构，泰特现代美术馆（Tate Modern），通过在其墙内演练开放性的修辞来攫取资金份额（参见即将在泰特英国馆举办的开放大会）。尽管欧洲其他地方的艺术机构努力地尝试按照其所倡导的关联性和短暂性原则来重塑自身（东京宫、马尔默
    Rooseum、苏黎世 Shedhalle），泰特却从未迎合这类矫饰，而是淡然地继续充当着资本密集型的中立容器，既容纳高调壮观的展览，也容纳政治化的美学思辨。因此，或许正是在三十年、四十年前的实验文化博物馆对话与将数字网络"去物质化"艺术充分博物馆化的追求之间的不交汇之处，这个体系才真正发挥所长；那是一条铺向河边的红毯，迎接着"开放性"，同时也是一支红色灭火器，应对着艺术客体去物质化的后果——即便经历了这么久的时间依然如此。


    (1) 摘自《观念艺术：批评选集》，Alexander Alberro 和 Blake Stimson 编，MIT 出版社，2000 年。

