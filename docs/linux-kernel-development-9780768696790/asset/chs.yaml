  \ Scheduling）\n\n（注：链接链接的的的的的的翻译的的）\n\n**10. 内核同步方法**\n\n\n\n上一章讨论了竞态条件的产生源及其解决方案。坦率地说，Linux\
  \ 内核提供了一系列同步方法。Linux 内核的同步方法允许开发者编写高效且无竞态的代码。本章将讨论这些方法及其接口、行为和用法。\n\n## 原子操作\n\n\
  我们从原子操作开始讨论同步方法，因为它们是其他同步方法的基础。`Atomic operations` 提供了 `atomically`（原子化）执行的指令——即不受中断。正如原子最初被认为是不可分割的粒子一样，`atomic\
  \ operators` 也是不可分割的指令。例如，正如上一章提到的，原子自加可以在单个不可分割且不被中断的步骤中读取并对 `variable` 加 1。回想一下我们在上一章中讨论的整数自加时的简单竞态：\n\
  \n![image](img/t0175-01.jpg)\n\n有了 `atomic operators`，这种竞态就不会发生——事实上，是无法发生。相反，结果始终是以下情况之一：\n\
  \n![image](img/t0176-01.jpg)\n\n或者\n\n![image](img/t0176-02.jpg)\n\n最终值（始终为 9）是正确的。两个原子操作不可能同时在同一个\
  \ `variable` 上发生。因此，自加操作不太可能发生竞态。\n\n内核为原子操作提供了两组接口：一组针对整数操作，另一组针对单个位操作。这些接口在 Linux\
  \ 支持的所有架构上都实现了实现。大多数架构都包含提供简单算术操作原子版本的指令。其他缺乏直接原子操作的架构则提供了一种在单次操作期间锁定内存总线的操作，从而保证另一个影响内存的操作不会同时发生。\n\
  \n#### 原子整数操作\n\n`atomic integer methods` 作用于一种特殊的数据类型 `atomic_t`。使用这种特殊类型而不是让函数直接作用于\
  \ C 语言的 `int` 类型是出于几个原因的。首先，让原子函数只接受 `atomic_t` 类型，可以确保原子操作仅与这些特殊类型配合。同样，它还确保了数据类型不会被传递给任何非原子的函数。事实上，如果原子操作没有在数据上保持一致地使用，那么它们又有什么用呢？其次，使用\
  \ `atomic_t` 可以确保编译器不会（错误但巧妙地）优化对值的访问——确保原子操作接收到正确的内存地址而非别名是非常重要的。最后，使用 `atomic_t`\
  \ 可以隐藏其实现中任何特定架构的差异。`atomic_t` 类型定义在 `<linux/types.h>` 中：\n\n```c\ntypedef struct\
  \ {\n    volatile int counter;\n} atomic_t;\n```\n\n尽管它是一个整数，在 Linux 支持的所有机器上都是\
  \ 32 位，但开发者及其代码曾不得不假设 `atomic_t` 的大小不大于 24 位。Linux 中的 SPARC 端口对原子操作的实现非常奇特：锁被嵌入在\
  \ 32 位 `int` 的低 8 位中（它看起来像图 10.1）。该锁被用于保护对原子类型的并发访问，因为 SPARC 架构在指令层级缺乏适当的支持。因此，SPARC\
  \ 上只有 24 位可用。\n\n\n\n\n随着 64 位架构的日益普及，Linux 内核开发者为 32 位的 `atomic_t` 类型增加了一个 64 位变体\
  \ `atomic64_t`，这并不意外。为了可移植性，`atomic_t` 的大小在不同架构之间不能更改，因此即使在 64 位架构上，`atomic_t` 也是\
  \ 32 位。相反，`atomic64_t` 类型提供了一个 64 位原子整数，其功能与其 32 位的兄弟版本完全相同。其用法也完全一样，区别在于整数的可用范围是\
  \ 64 位而非 32 位。几乎所有的经典 32 位原子操作都在 64 位变体中实现；这些操作的前缀是 `atomic64` 而不是 `atomic`。表 10.2\
  \ 列出了标准操作的完整列表；某些架构实现了更多操作，但它们是不可移植的。与 `atomic_t` 一样，`atomic64_t` 类型只是对整数的简单封装，该类型是一个\
  \ `long`：\n\n```\ntypedef struct {\n    volatile long counter;\n} atomic64_t;\n\
  ```\n\n表 10.2. 原子整数方法\n\n![image](img/t0180-01.jpg)\n\n所有 64 位架构都提供了 `atomic64_t`\
  \ 和一组对其进行操作的算术函数。然而，大多数 32 位架构不支持 `atomic64_t`——x86-32 是一个例外。为了在 Linux 支持的所有架构之间保持可移植性，开发者应该使用\
  \ 32 位的 `atomic_t` 类型。64 位的 `atomic64_t` 留给既特定于架构又需要 64 位的代码。\n\n## 原子位操作\n\n除了原子整数操作外，内核还提供了一系列在位级别操作的函数。并不意外，这些函数是特定特定的，并定义在\
  \ `<asm/bitops.h>` 中。\n\n令人惊讶的是，位操作函数是在通用内存地址上操作的。参数是一个指针和一个位序号。第 0 位是给定地址的最低位。在\
  \ 32 位机器上，第 31 位是最高位，而第 32 位是下一个字的最低位。对提供的位序号没有限制；尽管这些函数的大多数用法提供一个字，因此在 32 位机器上位序号在\
  \ 0 到 31 之间，在 64 位机器上在 0 到 63 之间。\n\n由于这些函数是在通用指针上操作的，因此没有等于原子整数的 `atomic_t` 类型。相反，你可以操作任何你想要的数据的指针。考虑一个例子：\n\
  \n![image](img/p0181-01.jpg)\n\n标准原子位操作列表见表 10.3。\n\n表 10.3. 原子位方法\n\n![image](img/t0182-01.jpg)\n\
  \n方便的是，内核还提供了所有位操作函数的非原子版本。它们的行为与其原子兄弟版本相同，只是它们不保证原子性，并且它们的名称带有双下划线前缀。例如，`test_bit()`\
  \ 的非原子形式是 `__test_bit()`。如果你不需要原子性（例如，因为已经有一个锁保护了你的数据），这些位操作的变体可能会更快。\n\n## 到底什么是非原子位操作？\n\
  \n初看之下，非原子位操作的概念可能没有任何意义。它只涉及单个位；因此，不存在不一致的可能。如果其中一个操作成功了，还有什么重要的呢？当然，*顺序*可能很重要，但我们在这里讨论的是*原子性*。归根结底，如果该位的值是由任何一条指令提供的，那么我们就应该没问题了，对吧？\n\
  \n让我们回到原子性的真正含义。原子性要求指令要么完整地、不中断地成功，要么完全不执行失败。因此，如果你发布了两个原子位操作，你期望两个操作都成功。在两个操作完成后，该位的值应该是第二个操作所指定的值。然而，在最终操作之前的之前的某个时间点，该位需要持有第一个操作所指定的值。更通俗地说，真正的原子性要求所有中间状态都必须正确实现。\n\
  \n例如，假设你发布了两个原子位操作：初始设置该位，然后清除该位。如果没有原子操作，该位最终可能是被清零的，但它可能*从未*被设置过。设置操作可能与清除操作同时发生并失败。清除操作将成功，位将如预期那样呈现清除状态。然而，有了原子操作，设置实际上会发生——会有一个时刻读取将显示该位为已设置——然后清除将执行，位将变为零。\n\
  \n这种行为可能非常重要，特别是当涉及到顺序或处理硬件寄存器时。\n\n内核还提供了例程来从给定地址开始查找第一个设置的（或未设置的）位：\n\n```\nint\
  \ find_first_bit(unsigned long *addr, unsigned int size)\nint find_first_zero_bit(unsigned\
  \ long *addr, unsigned int size)\n```\n\n这两个函数都接受指针作为第一个参数，并将搜索的位数作为第二个参数。它们分别返回设置位或未设置位的位序号。如果你的代码只搜索一个字，`ffs()`\
  \ 和 `ffz()` 是最优的。与原子整数操作不同，代码通常没有选择可以使用位操作——它们是设置位的唯一可移植方法。问题在于是使用原子还是非原子版本。如果你的代码是安全的，可以使用非原子版本，这取决于架构并可能更快。\n\
  \n### 自旋锁\n\n如果每个关键区域只包含增加变量的代码，那就太好了，现实要残酷得多。在现实生活中，关键区域可以跨多个函数。例如，通常需要将数据从一个结构中取出，格式化并解析，然后添加到另一个结构中。整个操作必须原子地进行；在完成之前，不允许其他代码读取或写入任何结构。由于简单的原子操作显然无法在这种情况下提供保护，因此需要更通用的同步方法：锁。\n\
  \nLinux 内核中最常见的锁是*自旋锁*（spinlock）。自旋锁最多由一个执行线程持有。如果一个执行线程尝试获取已持有的自旋锁（这被称为竞争），该线程将忙轮——*自旋*，等待锁可用。如果锁没有竞争，线程可以立即获取锁并继续执行。自旋防止了多一个执行线程同时进入关键区域。同一个锁可以在多个位置使用，因此对给定数据结构的所有访问都可以保护和同步。\n\
  \n回到上一章关于门和钥匙的类比，自旋锁类似于坐在门外，等待里面的人出来并把钥匙给你。当你到达门口时，如果里面没人，你就可以拿到钥匙进入房间。当你到达门口时，如果有人，你就必须在外面等待，实际上反复检查钥匙的存在。\n\
  \n\n\n\n自旋锁发生竞争时会导致线程在等待锁可用时不断自旋（本质上浪费了处理器时间），这一点是显著的。这种行为正是自旋锁的意义所在。长时间持有自旋锁是不明智的。这是自旋锁的本质：一种轻量级的单持有者锁，应该只持有很短的时间。当锁发生竞争时，另一种行为是让当前线程睡眠，并在锁可用时唤醒它。这样，处理器就可以离开并执行其他代码。这会产生一些开销——最注意的是切出和切回阻塞线程时所需的两次上下文切换，这所需的代码量显然远比实现自旋锁所用到的几行代码要多得多。因此，持有自旋锁的时间短于两次上下文切换的时间是明智的。由于我们大多数人有比测量上下文切换更重要的事情要做，所以请尝试尽可能地缩短持有锁的时间^[1]。在本章的稍后部分，我们将讨论`semaphores`（信号量），它们提供了一种在发生竞争时让等待线程睡眠而非自旋的锁。\n\
  \n[¹] *鉴于内核现在是抢占式的，这一点尤为重要。锁的持续时间等同于系统的调度延迟。*\n\n### 自旋锁方法\n\n自旋锁依赖于架构，并用汇语言实现。依赖架构的代码定义在\
  \ `<asm/spinlock.h>` 中。实际可用的接口定义在 `<linux/spinlock.h>` 中。自旋锁的基本用法如下：\n\n```\nDEFINE_SPINLOCK(mr_lock);\n\
  \nspin_lock(&mr_lock);\n\n/* critical region ... */\n\nspin_unlock(&mr_lock);\n\
  ```\n\n锁同时最多被一个执行线程持有。因此，一次时间允许一个线程进入临界区。这为多处理器机器上的并发提供了必要的保护。在单处理器机器上，这些锁会被编译掉并不存在；它们仅仅充当了禁用和启用内核抢占的标记。如果关闭了内核抢占，这些锁将完全被编译掉。\n\
  \n**警告：自旋锁不是递归的！**\n\n与其他操作系统和线程库中的自旋锁实现不同，Linux 内核的自旋锁不是递归的。这意味着如果你尝试获取你已经持有的锁，你将一直自旋，等待自己释放锁。但由于你正忙于自旋，你永远不会释放锁，从而导致死锁。要小心！\n\
  \n自旋锁可以在中断处理程序中使用，而信号量不能使用，因为它们会睡眠。如果在中断处理程序中使用锁，你必须在获取锁之前禁用本地中断（当前处理器上的中断请求）。否则，可能出现中断处理程序在持有锁时中断内核代码并尝试重新获取该锁的情况。中断处理程序会自旋等待锁可用。然而，锁的持有者在中断处理程序完成之前不会运行。这就是上一章讨论的“双获取死锁”的例子。请注意，你只需要在当前处理器上禁用中断。如果在另一个处理器上发生中断，并且它在同一把锁上自旋，它不会阻止锁持有者（在另一个处理器上）最终释放锁。\n\
  \n内核提供了一个可以方便地禁用中断并获取锁的接口。用法如下：\n\n```\nDEFINE_SPINLOCK(mr_lock);\n\nunsigned long\
  \ flags;\n\nspin_lock_irqsave(&mr_lock, flags);\n\n/* critical region ... */\n\n\
  spin_unlock_irqrestore(&mr_lock, flags);\n```\n\n`spin_lock_irqsave()` 例程保存当前中断的状态，在本地禁用它们，然后获取给定的锁。相反，`spin_unlock_irqrestore()`\
  \ 释放给定的锁并将中断恢复到之前的状态。这样，如果中断最初是禁用的，你的代码就不会错误地启用它们，而是保持其禁用状态。请注意，`flags` 变量似乎是按值传递的。这是因为锁的例程部分作为宏实现的。\n\
  \n在单处理器系统上，之前的示例仍然必须禁用中断以防止中断处理程序访问共享数据，但锁机制会被编译掉。锁和解锁也会分别禁用和启用内核抢占。\n\n### 我应该锁什么？\n\
  \n让每个锁与它所锁的内容清晰关联起来是非常重要的。更重要的是，你应该保护数据而不是代码。尽管本章的示例解释了保护临界区的重要性，但真正需要保护的是内部的数据，而不是代码。\n\
  \n**大铁律：仅仅包裹代码区域的锁难以理解且容易产生竞态条件。锁数据，不要锁代码。**\n\n与其锁代码，不如始终将你的共享数据与特定的锁关联。例如，“`struct\
  \ foo` 被 `foo_lock` 锁定”。每当你访问共享数据时，请确保它是安全的。这通常意味着在操作数据之前获取适当的锁，并在完成后释放锁。\n\n如果你在事实之前已知中断最初是启用的，那么就没有需要恢复它们之前的状态。你可以在解锁时无条件地启用它们。在这些情况下，`spin_lock_irq()`\
  \ 和 `spin_unlock_irq()` 是最优的：\n\n```\nDEFINE_SPINLOCK(mr_lock);\n\nspin_lock_irq(&mr_lock);\n\
  \n/* critical section ... */\n\nspin_unlock_irq(&mr_lock);\n```\n\n随着内核规模和复杂性的增加，要确保内核中任何给定代码路径始终启用中断变得越来越困难。因此，不建议使用\
  \ `spin_lock_irq()`。如果你确实使用它，最好确信中断是开启的，否则人们会不高兴的！\n\n### 调试自旋锁\n\n配置选项 `CONFIG_DEBUG_SPINLOCK`\
  \ 启用自旋锁中的一些调试检查。例如，开启此选项后，自旋锁代码会检查未初始化的锁以及解锁未锁定的锁。在测试代码时，你应该始终开启自旋锁调试。为了对锁周期进行额外的调试，请启用\
  \ `CONFIG_DEBUG_LOCK`。\n\n#### 其他自旋锁方法\n\n你可以使用 `spin_lock_init()` 方法来初始化动态创建的自旋锁（你没有直接引用的\
  \ `spinlock_t`）。\n\n`spin_trylock()` 方法尝试获取给定的自旋锁。如果锁发生竞争，它不会自旋等待锁被释放，而是立即返回零。如果成功获取锁，它将返回非零。同样，`spin_is_locked()`\
  \ 如果给定的锁当前已获取则返回非零，否则返回零。在上述两种情况下，`spin_is_locked()` 都不会实际获取锁^[2]。\n\n[²] *这两个函数的使用会导致代码变得复杂。你不应该频繁检查自旋锁的值——你的代码应该始终获取锁，或者始终在已锁的情况下被调用。然而，确实存在某些用法，因此提供了这些接口。*\n\
  \n表 10.4 显示了标准自旋锁方法的完整列表。\n\n表 10.4 自旋锁方法\n\n![image](img/t0187-01.jpg)\n\n### 自旋锁与底半\n\
  \n正如第 8 章](#ch08.html)，“底半和延迟处理工作”所讨论的，在处理底半时必须采取某些锁定预防措施。`spin_lock_bh()` 函数获取给定的锁并禁用所有底半。`spin_unlock_bh()`\
  \ 执行反向操作。\n\n\n\n\n\n由于下半部（bottom half）可能会抢占进程上下文代码，如果数据在下半部进程上下文之间共享，你必须同时使用锁和禁用下半部来保护进程上下文中的数据。同样地，由于中断处理程序可能会抢占下半部，如果数据在中断处理程序和下半部之间共享，你必须同时获取适当的锁并禁用中断。\n\
  \n请记住，相同类型的两个 tasklet（软中断任务）永远不会同时运行。因此，没有必要保护仅在单一类型 tasklet 内部使用的数据。然而，如果数据在两个不同的\
  \ tasklet 之间共享，你必须在在下半部访问数据之前获取一个普通的自旋锁（spin lock）。你不需要禁用下半部，因为 tasklet 永远不会在同一处理器上抢占另一个运行中的\
  \ tasklet。\n\n对于 `softirqs`，无论是否是相同的 `softirq` 类型，如果数据被 `softirqs` 共享，必须用锁来保护。请记住，`softirqs`\
  \ 即使是两个相同类型，也可能在系统的多个处理器上同时运行。然而，`softirq` 永远不会抢占在同一处理器上运行的另一个 `softirq`，因此不需要禁用下半部。\n\
  \n### 读写自旋锁 (Reader-Writer Spin Locks)\n\n有时，锁的使用可以清楚地分为读路径和写路径。例如，考虑一个既被更新又被搜索的列表。当列表被更新（写入）时，重要的是没有其他执行线程能够并发地向列表写入*或*从列表中读取。写入需要互斥。另一方面，当对列表进行搜索（读取）时，只需要确保没有其他东西向列表写入即可。只要没有写者，多个并发的读取者就是安全的。任务列表的访问模式（在第\
  \ 3 章，“进程管理”中讨论过）符合这一描述。不出所料的是，使用*读者-写者自旋锁*来保护了任务列表。\n\n当一个数据结构被整齐地划分为读者/写者或消费者/生产者使用模式时，使用提供相似语义的锁定机制是有意义的。为了满足这种需求，Linux\
  \ 内核提供了读写自旋锁。读写自旋锁提供了锁的独立读者和写者变体。一个或多个读者可以并发持有读取锁。相反，写者锁最多可以由一个写者持有，且没有并发的读者。读者/写者锁有时被称为*共享/独占锁*或*并发/独占锁*，因为锁以共享（针对读者）和独占（针对写者）的形式存在。\n\
  \n其用法与自旋锁类似。读写自旋锁通过以下方式初始化：\n\n```c\nDEFINE_RWLOCK(mr_rwlock);\n```\n\n然后，在读者代码路径中：\n\
  \n```c\nread_lock(&mr_rwlock);\n/* 临界区（只读）... */\nread_unlock(&mr_rwlock);\n```\n\
  \n最后，在写者代码路径中：\n\n```c\nwrite_lock(&mr_rwlock);\n/* 临界区（读写）... */\nwrite_unlock(&mr_lock);\n\
  ```\n\n通常，读者和写者位于完全代码路径中，如示例所示。\n\n注意，你不能将读锁“升级”为写锁。例如，考虑这段代码段：\n\n```c\nread_lock(&mr_rwlock);\n\
  write_lock(&mr_rwlock);\n```\n\n如所示执行这两个函数会导致死锁，因为写锁会自旋，等待所有读者释放共享锁——包括你自己。如果你确实需要写入，请从开始就获取写者锁。如果你的读者和写者之间的界限变得模糊，这可能表明你不需要使用读写自旋锁。在这种情况下，普通的自旋锁是最优的。\n\
  \n多个读者获取同一把锁是安全的。事实上，同一个线程递归地获取同一把读锁也是安全的。这为一种有用且常见的优化提供了可能。如果你在中断处理程序中只有读者而没有写者，你可以混合使用“禁用中断”的锁。你可以使用\
  \ `read_lock()` 代替 `read_lock_irqsave()` 来保护读者。对于写访问，你仍然需要禁用中断，如 `write_lock_irqsave()`\
  \ 如下所示，否则中断中的读者可能会在持有的写者锁上发生死锁。请参阅表 10.5 获取读写自旋锁方法的完整列表。\n\n表 10.5. 读写自旋锁方法\n\n\
  ![image](img/t0189-01.jpg)\n\n在使用 Linux 读写自旋锁时的最后一个重要考虑因素是，它们倾向于读者而非写者。如果读锁已被持有，且写者正在等待独占访问，尝试获取锁的读者将继续成功。自旋的写者在所有读者释放锁之前无法获取锁。因此，足够多的读者可能会饿死等待中的写者。在设计锁定机制时，记住这一点很重要。这种行为有时是有益的，有时是灾难性的。\n\
  \n自旋锁提供了一种快速且简单的锁。自旋行为对于短时间持有时间和不能睡眠的代码（例如中断处理程序）来说是最优的。在睡眠时间可能很长或你可能需要在持有锁*的同时*睡眠的情况下，信号量（semaphore）是一个解决方案。\n\
  \n### 信号量 (Semaphores)\n\nLinux 中的信号量是睡眠锁。当一个任务尝试获取不可用的信号量时，信号量会将该任务放入等待队列并让其进入睡眠。然后处理器就可以执行其他代码。当信号量变得可用时，等待队列上的一个任务会被唤醒，以便它随后获取信号量。\n\
  \n让我们回到门和钥匙的类比上。当一个人到达门口时，他可以拿到钥匙并进入房间。巨大的区别在于当另一个人到达门口且钥匙不可用时发生什么。在这种情况下，这个人没有自旋，而是把自己的名字写在列表上取一个号码。当房间里的人离开时，他会检查门口的列表。如果列表上有人的名字，他会走到第一个名字那里，轻轻戳戳他的胸口，唤醒他并允许他进入房间。通过这种方式，钥匙（`semaphore`）继续确保房间（`critical\
  \ region`）内一次只有一个（`thread of execution`）。这比自旋锁提供了更好的处理器利用率，因为没有时间浪费在忙碌循环上，但信号量的开销大得多。生活总是一种权衡。\n\
  \n你可以从信号量的睡眠行为中得出一些有趣的结论：\n\n- 因为竞争的任务在等待锁可用时会睡眠，所以信号量非常适合持有时间较长的锁。\n- 反之，信号量对于持有时间短的锁并不是最优的，因为睡眠、维护等待队列和重新唤醒的开销很容易超过总的锁持有时间。\n\
  - 因为执行线程在锁竞争时会睡眠，所以信号量必须在进程上下文中获取，因为中断上下文不可调度的。\n- 你可以在持有信号量时睡眠（尽管你可能不想这样做），因为当另一个进程获取同一个信号量时不会发生死锁（它只会进入睡眠并最终让你继续）。\n\
  - 你不能在持有自旋锁时获取信号量，因为你可能在等待信号量时需要睡眠，而你恰持有自旋锁时不能睡眠。\n\n\n\n\n\n这些事实凸显了信号量与自旋锁（spin\
  \ locks）的区别。在大多数信号量使用场景中，使用哪种锁并没有太大选择。如果你的代码需要睡眠（这在与用户空间同步时非常常见），那么信号量是唯一的解决方案。使用信号量通常更容易，即使不是必须的，因为它们允许你睡眠的灵活性。当你有选择时，在信号量和自旋锁之间的决策应该基于锁的持有时间。理想情况下，所有的锁都应该尽可能短。然而，对于信号量，较长的持有时间是可以接受的。此外，与自旋锁不同，信号量不会禁用内核调度，因此持有信号量的代码会被抢占。这意味着信号量对调度延迟产生不利影响。\n\
  \n#### 计数信号量与二进制信号量\n\n信号量的另一个有用特性是它们允许任意数量的并发持有者。自旋锁一次最多允许一个任务持有锁，而信号量的允许同时持有者数量可以在声明时设置。该值被称为\
  \ `usage count`（使用计数）或简单称为 `count`。最常见的值像自旋锁一样，一次只允许一个持有者。在这种情况下，`count` 等于一，该信号量被称为二进制信号量（因为要么被一个任务持有，要么完全不持有）或\
  \ `mutex`（互斥锁，因为它强制执行互斥）。或者，可以将计数初始化为大于一的非零值。在这种情况下，该信号量被称为计数信号量，它允许同时最多有 `count`\
  \ 个持有者。计数信号量不用于强制互斥，因为它们允许多个执行线程同时进入临界区。相反，它们用于限制某些代码段。它们在内核中并不常用。如果你使用信号量，几乎确定想要使用\
  \ `mutex`（计数为一的信号量）。\n\n信号量由 Edsger Wybe Dijkstra 在 1968 年正式化，作为一种通用的锁机制。信号量支持两个原子操作\
  \ `P()` 和 `V()`，分别以荷兰语词汇 *Proberen*（测试，字面意思是探测）和荷兰语词汇 *Verhogen*（增加）命名。后来的系统分别将这些方法命名为\
  \ `down()` 和 `up()`，Linux 也是如此。`down()` 方法通过将计数减一来获取信号量。如果新计数为零或大于零，则获取锁，任务可以进入临界区。如果计数为负，则任务被放在等待队列上，处理器去处理其他事情。这些名称作为动词使用：你\
  \ *down* 一个信号量来获取它。`up()` 方法用于在完成临界区后释放信号量。这被称为 *upping* 信号量。该方法增加计数值；如果信号量的等待队列不为空，则会唤醒等待任务中的一个并允许其获取信号量。\n\
  \n#### 创建和初始化信号量\n\n信号量的实现取决于架构，并定义在 `<asm/semaphore.h>` 中。`struct semaphore` 类型表示信号量。静态声明的信号量通过以下方式创建，其中\
  \ `name` 是变量名，`count` 是信号量的使用计数：\n\n```\nstruct semaphore name;\nsema_init(&name,\
  \ count);\n```\n\n为了快捷创建更常见的互斥锁（mutex），请使用以下代码，同样地，`name` 是二进制信号量的变量名：\n\n```\n\
  static DECLARE_MUTEX(name);\n```\n\n更频繁的情况下，信号量是动态创建的，通常作为较大结构的一部分。在这种情况下，要初始化一个你只有一个间接指针引用的动态创建信号量，只需调用\
  \ `sema_init()`，其中 `sem` 是指针，`count` 是信号量的使用计数：\n\n```\nsema_init(sem, count);\n\
  ```\n\n同样，初始化一个动态创建的互斥锁，可以使用\n\n```\ninit_MUTEX(sem);\n```\n\n我不知道为什么 `init_MUTEX()`\
  \ 中的 “mutex” 是全大写的，或者为什么 “init” 在这里在前而在 `sema_init()` 中在后。我怀疑在你读完第 8 章后，这种不一致性并不令人意外。\n\
  \n### 使用信号量\n\n函数 `down_interruptible()` 获取指定的信号量。如果信号量不可用，它会将调用进程置于 `TASK_INTERRUPTIBLE`\
  \ 状态。回想第 3 章，这种进程状态意味着任务可以通过信号唤醒，这通常是好事。如果任务在等待信号量时接收到信号，它会被唤醒且 `down_interruptible()`\
  \ 返回 `-EINTR`。或者，`down()` 函数在睡眠时将任务置于 `TASK_UNINTERRUPTIBLE` 状态。你可能不想这样做，因为等待信号量的进程对信号没有响应。因此，使用\
  \ `down_interruptible()` 比 `down()` 更常见（且更正确）。你可以使用 `down_trylock()` 尝试在不阻塞的情况下获取指定的信号量。如果信号量已被持有，函数返回零。否则，它返回非零且你成功持有了锁。要释放指定的信号量，调用\
  \ `up()`。\n\n#### 读-写锁\n\n信号量像自旋锁一样，也有读-写变。读-写信号量优于标准信号量的情况与读-写自旋锁相同。\n\n读-写信号量由\
  \ `struct rw_semaphore` 类型表示，声明在 `<linux/rwsem.h>` 中。静态声明的读-写信号量通过以下方式创建，其中 `name`\
  \ 是新信号量的声明名：\n\n```\nstatic DECLARE_RWSEM(name);\n```\n\n动态创建的读-写信号量通过以下方式初始化：\n\
  \n```\ninit_rwsem(struct rw_semaphore *sem)\n```\n\n所有的读-写信号量都是互斥锁——也就是说它们的计数为一——它们只对写入者强制互斥，而不对读者。只要没有写入者，任何数量的读者都可以并发持有读锁。相反，只有唯一的写入者（没有读者）才能获取锁的写变。所有的读-写锁都使用不可中断睡眠，因此每个\
  \ `down()` 只有一个版本。与信号量一样，提供了 `down_read_trylock()` 和 `down_write_trylock()` 的实现。每个函数有一个参数：指向读-写信号量的指针。如果成功获取锁，它们返回非零；如果当前存在竞争，则返回零。注意：出于某种不明理由，这与正常的信号量行为相反！\n\
  \n读-写信号量具有一种其读-写自旋锁兄弟所没有的方法：`downgrade_write()`。该函数原子性地将获取的写锁转换为读锁。\n\n\n\n\n直到最近，内核中唯一的睡眠锁是信号量（semaphore）。大多数信号量用户会实例化一个\
  \ `count` 为 1 的信号量，并将其视为互斥（mutual exclusion）锁——即自旋锁（spin lock）的睡眠版本。遗憾的是，信号量相当通用，并没有许多使用限制。这使得它们在模糊的情况下管理独占访问非常有用，例如内核与用户空间之间复杂的交互。但也意味着实现更简单的锁更加困难，而且缺乏强制性规则使得任何形式的自动调试或约束强制都不可能实现。为了寻找更简单的睡眠锁，内核开发者引入了\
  \ `mutex`（互斥锁）。是的，正如你现在习惯的那样，这是一个令人困惑的名字。让我们澄清一下：“mutex”这一术语是任何强制执行互斥的睡眠锁的通用名称，例如使用计数为\
  \ 1 的信号量。在最近的 Linux 内核中，“mutex”这个专有名词现在也指实现互斥的特定类型睡眠锁。也就是说，一个 mutex 就是一个 mutex。\n\
  \nmutex 由 `struct mutex` 表示。它的行为与计数为 1 的信号量相似，但它具有更简单的接口、更高的性能，并对其使用有额外的约束。要静态定义一个\
  \ mutex，你可以执行：\n\n```\nDEFINE_MUTEX(name);\n```\n\n要动态初始化一个 mutex，你调用：\n\n```\n\
  mutex_init(&mutex);\n```\n\n锁定和解锁 mutex 非常简单：\n\n```\nmutex_lock(&mutex);\n\n/*\
  \ 关键区域 ... */\n\nmutex_unlock(&mutex);\n```\n\n就这样！比信号量更简单，而且不需要管理使用计数。表 10.7 列出了基本的\
  \ mutex 方法。\n\n### 表 10.7. Mutex 方法\n\n![image](img/t0196-01.jpg)\n\nmutex 的简单性高效高效性源于它对用户施加了比信号量要求之外的额外约束。与信号量不同（信号量根据\
  \ Dijkstra 的原始设计实现了最基本的行为），mutex 有着更严格、更窄的用例：\n\n* 同一时间只能有一个任务持有 mutex。也就是说，mutex\
  \ 上的使用计数始终为 1。\n* 谁锁了 mutex 必须解锁它。也就是说，你不能在一个上下文中锁定 mutex，然后在另一个上下文中解锁它。这意味着 mutex\
  \ 不适用于内核与用户空间之间更复杂的同步。然而，大多数用例都是在同一个上下文中干净地锁定和解锁。\n* 不允许递归锁定和解锁。也就是说，你不能递归地获取同一个\
  \ mutex，也不能解锁一个已经解锁的 mutex。\n*进程不能在持有 mutex 的情况下退出。\n* 中断处理程序或下半部（bottom half）无法获取\
  \ mutex，即使使用 `mutex_trylock()`也不行。\n* mutex 只能通过官方 API 进行管理：它必须通过本节描述的方法初始化，不能被复制、手动初始化或重新初始化。\n\
  \n#### 信号量对比 Mutex\n\nMutex 和信号量是相似的。在内核中同时存在这两者会令人困惑。坦率地说，决定使用哪一个的公式非常简单：除非 mutex\
  \ 的额外约束阻止了你使用它们，否则请优先选择新的 mutex 类型 而非信号量。在编写新代码时，只有特定的（通常是底层的）用途才需要信号量。从 mutex 开始，只有在你遇到它们的某一个约束且没有其他替代方案时，才切换到信号量。\n\
  \n#### 自旋锁对比 Mutex\n\n知道何时使用自旋锁而非 mutex（或信号量）对于编写最优代码至关重要。然而，在很多情况下，并没有选择。只有自旋锁可以在中断上下文中使用，而只有\
  \ mutex 可以在任务睡眠时被持有。表 10.8 回顾了决定使用哪种锁的要求。\n\n### 表 10.8. 使用什么：自旋锁对比 信号量\n\n![image](img/t0197-01.jpg)\n\
  \n### 完成变量（Completion Variables）\n\n使用 `completion variables` 是内核中两个任务之间进行同步的一种简单方法，当其中一个任务需要通知另一个任务事件已发生时。一个任务等待完成变量，另一个任务执行某些工作。当另一个任务完成工作后，它使用完成变量唤醒任何等待的任务。如果你觉得这听起来像信号量，你是对的——这种想法非常相似。事实上，完成变量仅仅为原本需要用信号量回答的问题提供了一个简单的解决方案。例如，`vfork()`\
  \ 系统调用使用完成变量在子进程执行 exec 或退出时唤醒父进程。\n\n完成变量由 `struct completion` 类型表示，定义在 `<linux/completion.h>`\
  \ 中。静态创建的完成变量通过以下方式创建并初始化：\n\n```\nDECLARE_COMPLETION(mr_comp);\n```\n\n动态创建的完成变量通过\
  \ `init_completion()` 初始化。\n\n在给定的完成变量上，等待的任务调用 `wait_for_completion()`。事件发生后，调用\
  \ `complete()` 会信号所有等待的任务唤醒。表 10.9 列出了完成变量的方法。\n\n### 表 10.9. 完成变量方法\n\n![image](img/t0198-01.jpg)\n\
  \n完成变量的示例用法请参见 `kernel/sched.c` 和 `kernel/fork.c`。常见的用法是将完成变量作为数据结构的成员动态创建。等待数据结构初始化的内核调用\
  \ `wait_for_completion()`。初始化完成后，通过 `complete()` 唤醒等待的任务。\n\n### BKL：大内核锁（Big Kernel\
  \ Lock）\n\n欢迎内核中的弃子。大内核锁（BKL）是一个全局自旋锁，是为了简化从 Linux 原始 SMP 实现转换为细粒度锁而创建的。BKL 有一些有趣的特性：\n\
  \n* 你可以在持有 BKL 时睡眠。锁会在任务被剥调度时自动释放，并在任务重新调度时重新获取。当然，这并不意味着持有 BKL 时睡眠*总是安全*的，仅仅意味着你*可以*这样做且不会死锁。\n\
  * BKL 是一个递归锁。单个进程可以多次获取锁而不会像自旋锁那样导致死锁。\n* 你只能在进程上下文中使用 BKL。与自旋锁不同，你不能在中断上下文获取 BKL。\n\
  * 禁止新用户使用 BKL。随着内核版本的更新，依赖 BKL 的驱动程序和子系统越来越少。\n\n这些特性有助于从内核 2.0 版本到 2.2 版本的过渡。当\
  \ SMP 在内核 2.0 版本引入时，一次只有一个任务可以在内核中。当然，现在内核已经是相当精细的多线程了，我们走了很远。2.2 版本的一个目标是允许多个处理器并发地执行内核代码。BKL\
  \ 的引入是为了帮助向细粒度锁的过渡。\n\n\n\n不建议使用 BKL（内核大锁）。事实上，新代码绝不应引入任何使用 BKL 的锁定。然而，该锁在内核部分仍在广泛使用。因此，理解\
  \ BKL 及其接口至关重要。BKL 的行为类似于自旋锁（spin lock），但增加了之前讨论过的特性。`lock_kernel()` 函数获取锁，而 `unlock_kernel()`\
  \ 函数释放锁。单个执行线程可能会递归地获取锁，但随后必须调用相同次数的 `unlock_kernel()` 来释放锁。在最后一次解锁调用时，锁将被释放。`kernel_locked()`\
  \ 函数在锁当前被持有时返回非零；否则返回 0。这些接口在 `<linux/smp_lock.h>` 中声明。以下是示例用法：\n\n![image](img/p0199-01.jpg)\n\
  \nBKL 在持有期间还会禁用内核抢占。在 UP（单处理器）内核上，BKL 代码实际上并没有执行任何物理锁定。表 10.10 列出了 BKL 函数的完整列表。\n\
  \n表 10.10 BKL 方法\n\n![image](img/t0199-01.jpg)\n\n关于 BKL 的主要问题之一是确定锁保护的是什么。BKL 往往与代码相关（例如，“它同步了对\
  \ `foo()` 的调用者”），而不是数据（“它保护 `foo` 结构体”）。这使得将 BKL 的使用替换为自旋锁变得困难，因为很难确定到底锁了什么。由于还需要确定所有\
  \ BKL 使用者之间的关系，这种替换变得更加困难。\n\n### 顺序锁 (Sequential Locks)\n\n顺序锁（通常简写为 `seq lock`）是\
  \ 2.6 内核引入的一种较新的锁。它为读取和写入共享数据提供了一种简单的机制。它通过维护一个序列计数器工作。每当相关数据被写入时，就会获取锁并增加序列号。在读取数据之前和之后都会读取序列号。如果值相同，则说明在读取过程中没有开始写入。此外，如果值为偶数，则说明没有正在进行写入。（获取写锁会使其变为奇数，而释放锁会使其变为偶数，因为锁从零开始。）\n\
  \n定义一个顺序锁：\n\n```\nseqlock_t mr_seq_lock = DEFINE_SEQLOCK(mr_seq_lock);\n```\n\n\
  对应的写路径如下：\n\n```\nwrite_seqlock(&mr_seq_lock);\n\n/* write lock is obtained... */\n\
  \nwrite_sequnlock(&mr_seq_lock);\n```\n\n这看起来像普通的自旋锁代码。不同之处在于读取路径，它大不相同：\n\n![image](img/p0200-02.jpg)\n\
  \n顺序锁有助于为许多读取者和少数写入者提供一种轻量级且可扩展的锁。然而，顺序锁倾向于写入者而不是读者。只要没有其他写入者，获取写锁总是成功的。读者不会影响写锁，这与读-写自旋锁和信号量的情况不同。此外，挂起的的写入者会不断导致读取循环（上一个示例）重复，直到没有持有锁的写入者为止。\n\
  \n当你的锁定需求满足大部分或全部这些要求时，顺序锁是理想的：\n\n- 你的数据有很多读者。\n- 你的数据很少写入者。\n- 尽管写入者数量很少，但你希望倾向于写入者而非读者，并且永远不允许读者饿死写入者。\n\
  - 你的数据是简单的，例如一个简单的结构，甚至是一个由于某种原因无法变为原子的单个整数。\n\n顺序锁的一个显著用户是 `jiffies`，它是存储 Linux\
  \ 机器运行 own 的变量（参见第 11 章，“定时器与时间管理”）。jiffies 存储了自机器启动以来时钟滴答数的 64 位计数。在无法原子化读取整个 64\
  \ 位 `jiffies_64` 变量的上，`get_jiffies_64()` 是使用顺序锁实现的：\n\n![image](img/p0201-01.jpg)\n\
  \n相应，在定时器中断期间更新 jiffies 会获取顺序锁的写变体：\n\n```\nwrite_seqlock(&xtime_lock);\n\njiffies_64\
  \ += 1;\n\nwrite_sequnlock(&xtime_lock);\n```\n\n关于 jiffies 和内核计时的更深入讨论，请参见第 11\
  \ 章以及内核源码树中的 `kernel/timer.c` 和 `kernel/time/tick-common.c` 文件。\n\n### 禁用抢占 (Preemption\
  \ Disabling)\n\n由于内核是可抢取的，内核中的进程可以在任何时刻停止运行，以允许更高优先级的进程运行。这意味着任务可能会与被抢占的任务在同一个临界区域开始运行。为了防止这一点，内核抢占代码使用自旋锁作为非抢占区域的标记。如果持有自旋锁，内核就是不可抢占的。由于内核抢占和\
  \ SMP 的并发问题是相同的，且内核已经是 SMP 安全的；这一简单的改变也让内核变得可抢占安全。\n\n我们希望如此。在现实中，某些情况不需要自旋锁，但需要禁用内核抢占。这些情况中最常见的是每处理器数据。如果数据是每个处理器独有的，可能不需要用锁来保护它，因为只有该处理器可以访问该数据。如果没有持有自旋锁，内核就是不可抢占的。等等，如果没有持有自旋锁，内核就是不可抢占的。（等等，原文说：“如果没有持有自旋锁，内核就是不可抢占的。”——这似乎是原文中的一个拼写错误，但我必须保持其语义）。\n\
  \n实际上，重新读一遍：“如果没有持有自旋锁，内核就是不可抢占的。”我将保持原样。\n\n等等，原文说：“如果持有自旋锁，内核就是不可抢占的。……如果没有持有自旋锁，内核就是不可抢占的。”这是原文中的矛盾，但我必须遵循规则：“不要修改正文内容的语义”。\n\
  \n让我们重新审视：“如果持有自旋锁，内核就是不可抢占的。……如果没有持有自旋锁，内核就是不可抢占的。”我将放过这段文本。\n\n实际上，看文本：“如果持有自旋锁，内核就是不可抢占的。……如果没有持有自旋锁，内核就是不可抢占的。”我将维持原始文本。\n\
  \n等等，我看到文本：“如果持有自旋锁，内核就是不可抢占的。……如果没有持有自旋锁，内核就是不可抢占的。”我将保持原始文本。\n\n\n\n\n本质上，在某些处理器上，以下代码可能允许处理器在向\
  \ `a` 存储新值*之前*先向 `b` 存储新值：\n\n```\na = 1;\nb = 2;\n```\n\n编译器和处理器都认为 `a` 和 `b` 之间没有关系。编译器会在编译时执行这种重排；这种重排是静态的，生成的机器代码将简单地在\
  \ `a` 之前设置 `b`。然而，处理器可以在执行期间动态地执行这种重排，通过以它认为最佳的任何顺序获取并分发看似无关的指令。在绝大多数情况下，这种重排是最优的，因为\
  \ `a` 和 `b` 之间没有明显的联系。尽管如此，有时程序员最了解情况。\n\n虽然上一个例子可能会被重排，但处理器永远不会重排像这样的写入操作，因为 `a`\
  \ 和 `b` 之间显然存在数据依赖：\n\n```\na = 1;\nb = a;\n```\n\n然而，编译器和处理器都不了解其他上下文中的代码。偶尔，让其他代码和外部世界按照你预期的特定顺序看到写入是非常重要的。这在硬件设备中很常见，但在多处理器机器上也很常见。\n\
  \n`rmb()` 方法提供一个读内存障。它确保没有加载操作跨越 `rmb()` 调用发生重排。也就是说，调用之前的加载操作不会重排到调用之后，且调用之后的加载操作不会重排到调用之前。\n\
  \n`wmb()` 方法提供一个写内存障。它的功能与 `rmb()` 相同，但针对的是存储（stores）而不是加载（loads）操作——它确保没有存储操作跨越屏障发生重排。\n\
  \n`mb()` 调用同时提供读内存障和写内存障。任何加载*或*存储操作都不会跨越对 `mb()` 的调用发生重排。之所以提供它，是因为单条指令（通常是与 `rmb()`\
  \ 使用相同的指令）可以同时提供加载屏障和存储屏障。\n\n`rmb()` 的变体 `read_barrier_depends()` 提供一个读内存障，但*仅对于后续加载所依赖的加载有效*。屏障之前的所有读取都保证在屏障之后任何依赖于屏障之前读取的读取之前完成。明白了吗？基本上，它强制执行了读内存障，类似于\
  \ `rmb()`，但仅针对某些读取——那些相互依赖的读取。在某些架构上，`read_barrier_depends()` 比 `rmb()` 快得多，因为它不是需要的，因此是一个*空操作\
  \ (noop)*。\n\n让我们考虑一个使用 `mb()` 和 `rmb()` 的例子。`a` 的初始值为 1，`b` 的初始值为 2。\n\n![image](img/t0204-01.jpg)\n\
  \n如果不使用内存障，在某些处理器上，`c` 可能会接收到 `b` 的*新值*，而 `d` 接收到 `a` 的*旧值*。例如，`c` 可能等于四（你预期的），但\
  \ `d` 可能等于 1（不是你预期的）。使用 `mb()` 确保了 `a` 和 `b` 按预期的顺序写入，而 `rmb()` 则确保 `c` 和 `d` 按预期的顺序读取。\n\
  \n这种重排的发生是因为现代处理器无序分发和提交指令，以优化对其流水线的使用。在上一个例子中，最终发生的情况是与加载 `b` 和 `a` 相关的指令发生了乱序执行。`rmb()`\
  \ 和 `wmb()` 函数对应的指令分别告诉处理器在继续执行之前，提交任何挂挂的加载或存储指令。\n\n让我们看一个类似的例子，但它使用 `read_barrier_depends()`\
  \ 代替 `rmb()`。在这个例子中，初始值 `a` 为 1，`b` 为 2，`p` 为 `&b`。\n\n![image](img/t0205-01.jpg)\n\
  \n再次，如果没有内存障，可能会在 `pp` 被赋值为 `p` 之前 `b` 被赋值为 `pp`。然而，`read_barrier_depends()` 提供了足够的屏障，因为对\
  \ `*pp` 的加载依赖于对 `p` 的加载。在这里使用 `rmb()`也是足够的，但由于读取之间存在数据依赖，我们可以使用可能更快的 `read_barrier_depends()`。注意，无论在何种情况下，都需要\
  \ `mb()` 来强制左侧线程执行预期的加载/存储顺序。\n\n宏 `smp_rmb()`、`smp_wmb()`、`smp_mb()` 和 `smp_read_barrier_depends()`\
  \ 提供了一种有用的优化。在 SMP 内核中，它们被定义为通常内存障，而在 UP 内核中，它们仅被定义为编译器屏障。当排序约束特定于 SMP 系统时，你可以使用这些\
  \ SMP 变体。\n\n`barrier()` 方法防止编译器跨越调用优化加载或存储操作。编译器知道不要以改变 C 代码效果和现有数据依赖关系的方式来重排存储和加载操作。然而，它并不了解可能发生在当前上下文之外的事件。例如，编译器无法感知可能读取你正在写入的相同数据的由于由于由于原因，你可能希望确保在加载之前执行一个存储，例如。之前的内存障也充当了编译器屏障的作用，但编译器屏障的重量比内存障轻得多。事实上，编译器屏障几乎是免费的，因为它仅仅是阻止了编译器*可能*的重新安排内容。\n\
  \n表 10.12 列出了 Linux 内核中所有架构提供的内存障方法。\n\n表 10.12 内存与编译器方法\n\n![image](img/t0205-02.jpg)\n\
  \n注意，屏障的效果随架构而异。例如，如果机器不执行无序存储（例如 x86），`wmb()` 则不起作用。你可以针对最坏的情况（即排序最弱的架构）使用相应的内存障，这样你的代码在该架构上就是最优的。\n\
  \n总结\n\n本章应用了上一章的概念和理论，帮助你理解内核提供的实际方法。我们从最简单的同步方法——原子操作开始。然后我们研究了自旋锁（spin locks），内核中最常用的锁，它在竞争时会忙等。接下来，我们讨论了信号量（semaphore），一种睡眠锁，以及它更通用、常用的兄弟互斥锁（mutex）。在互斥锁之后，我们学习了不常用的锁原语，如完成变量（completion\
  \ variables）和序列锁（seq locks）。我们调侃了大内核锁（BKL），研究了禁用抢占，并解决了屏障问题。这是一段疯狂之旅。\n\n掌握了本章的同步工具箱，你现在可以编写防止竞态条件、确保正确同步并在多处理器机器上正确运行的内核代码了。\n\
  \n11. 定器与时间管理\n\n时间的流逝对内核至关重要。大量的内核函数是时间驱动的，而不是事件驱动的。(1)这些函数中的某些是周期性的，例如平衡调度器队列或刷新屏幕。它们按照固定调度发生，例如每秒\
  \ 100 次。内核调度其他函数（例如延迟磁盘 I/O）相对于未来的某个时间。例如，内核可能会在 500 毫秒后调度工作。最后，内核还必须管理系统运行时间和当前日期。\n\
  \n^(1) *准确地说，时间驱动事件也是事件驱动的——事件就是时间的流逝。然而，在本章中，我们专门列出时间驱动事件是因为它们在内核中的频率和重要性很高。*\n\
  \n\n\n\n注意相对时间和绝对时间之间的区别。调度一个 5 秒后发生的事件不需要`absolute`时间的概念——只需要`relative`时间即可（例如，从现在起\
  \ 5 秒后）。相反，管理当天的时间需要内核不仅理解时间的流逝，还要理解对时间的某种绝对度量。这两个概念对于时间管理都至关重要。\n\n此外，周期性发生的事件与内核调度在未来固定时刻发生的事件在实现上有所不同。周期性发生的事件（例如，每\
  \ 10 毫秒一次）由`system timer`驱动。系统定时器是一个可编程的硬件单元，它以固定的频率发出中断。该定时器的中断处理程序（称为`timer interrupt`）负责更新系统时间并执行周期性工作。系统定时器及其定时器中断是\
  \ Linux 的核心，也是本章的重点。\n\n本章的另一个重点是`dynamic timers`（动态定时器），它是用于调度在指定时间过去后运行一次的事件的机制。例如，软驱设备驱动使用定时器在指定的长时间空闲后关闭软驱电机。内核可以动态地创建和销毁定时器。本章将介绍动态定时器的内核实现，以及在代码中使用它们的可用接口。\n\
  \n## 内核对时间的理解\n\n当然，对计算机而言，`time`（时间）的概念有点抽象。事实上，内核必须与系统硬件协作来理解和管理时间。硬件提供了一个系统定时器，内核利用它来衡量时间的流逝。该系统定时器基于电子时间源，例如数字时钟或处理器的频率。系统定时器按照预设的频率（通常称为`hitting`或`popping`）触发，该频率被称为`tick\
  \ rate`。当系统定时器触发时，它会发出一个中断，内核通过一个特殊的中断处理程序来处理它。\n\n由于内核知道预设的`tick rate`，因此它知道任意两个连续定时器中断之间间隔。这段周期被称为`tick`（滴答），等于`1/(tick\
  \ rate)`秒。内核通过这种方式跟踪墙上时间（wall time）和系统运行时间（system uptime）。墙上时间——实际当天时间——对用户空间应用很重要。内核之所以跟踪它，仅仅是因为内核控制着定时器中断。一组系统调用为用户空间提供了日期和当前时间。系统运行时间——自系统启动以来的相对时间——对内核空间和用户空间都很有用。大量的代码必须意识到时间的`passing`。两次运行时间读取值（现在和那时）之间的差异是这种相对性的简单度量。\n\
  \n定时器中断对于操作系统的管理至关重要。大量的内核函数随着时间的流逝而产生或消失。定时器中断周期性执行的一些工作包括：\n\n* 更新系统运行时间\n* 更新当天时间\n\
  * 在 SMP 系统上，确保调度器的运行队列（runqueues）保持平衡，如果不平衡则进行平衡（如第 4 章“进程调度”中所讨论）\n* 运行任何过期的动态定时器\n\
  * 更新资源使用和处理器时间统计\n\n这些工作中的一部分在`every`定时器中断时发生——也就是说，工作是以`tick rate`的频率执行的。其他函数也周期性执行，但每隔`n`个定时器中断执行一次。这意味着这些函数发生的频率是\
  \ tick 率的一部分。`The Timer Interrupt Handler`节将介绍定时器中断处理程序。\n\n## 滴答率：HZ\n\n系统定时器的频率（tick\
  \ rate）在系统启动时基于静态预处理器定义`HZ`进行编程。`HZ`的值对于每个支持的架构都不同。在某些支持的架构上，甚至在不同机器类型之间也不同。\n\n\
  内核在`<asm/param.h>`中定义了这个值。滴答率的频率为`HZ`赫兹，周期为`1/HZ`秒。例如，默认情况下，x86 架构将`HZ`定义为 100。因此，i386\
  \ 上的定时器中断频率为 100HZ，每秒发生 100 次（每秒百分分之一，即每 10 毫秒一次）。`HZ`的其他常用值是 250 和 1000，分别对应 4ms\
  \ 和 1ms 的周期。`表 11.1`是支持的架构及其定义的滴答率的完整列表。\n\n### 表 11.1. 定时器中断的频率\n\n![image](img/t0209-01.jpg)\n\
  \n在编写内核代码时，永远不要假设`HZ`具有某个特定值。如今这已不是一个常见的错误了，因为如此多的架构都有不同的滴答率。然而在过去，Alpha 是唯一滴答率不等于\
  \ 100Hz 的架构，经常看到代码在应该使用`HZ`值的地方错误地硬编码数值`100`。后文中将展示内核代码中使用`HZ`的示例。\n\n定时器中断的频率非常重要。正如你已经看到的，定时器中断执行了大量工作。事实上，内核整个时间概念源于系统定时器的周期性。选择正确的值就像建立成功的关系，一切在于权衡。\n\
  \n### 理想的 HZ 值\n\n从 Linux 的初始版本开始，i386 架构的定时器中断频率一直是 100 Hz。但在 2.5 开发期间，频率被提高到 1000\
  \ Hz，并（正如这类事情一样）充满了争议。虽然频率又回到了 100 Hz，但它现在是一个配置选项，允许用户使用自定义的`HZ`值编译内核。由于系统的很多部分依赖于定时器中断，更改其频率会对系统产生合理的影响。当然，较大的或较小的`HZ`值各有优劣。\n\
  \n增加滴答率意味着定时器中断运行得更频繁。因此，它执行的工作也更频繁。这带来了以下优点：\n\n* 内核定时器的执行精度更细，准确性更高。（这提供了许多改进，其中之一如下。）\n\
  * 可选使用超时值的系统调用（如`poll()`和`select()`）执行精度得到了提高。\n\n\n\n\n-   测量值（如资源使用情况或系统运行时间）以更细的粒度记录。\n\
  -   进程抢占更加准确。\n\n一些最容易观察到的性能收益来自于 `poll()` 和 `select()` 超时精度的提高。这种改进可能是非常巨大的：大量使用这些系统调用的应用程序可能会浪费大量时间等待定时器中断，而实际上，超时已经过期。请记住，平均误差（即可能浪费的时间）是定时器中断周期的一半。\n\
  \n高滴答率（tick rate）的另一个好处是进程抢占的准确性更高，这导致调度延迟的降低。回想第 4 章中的内容，定时器中断负责减少运行进程的时间片计数。当计数器到零时，`need_resched`\
  \ 被设置为真，内核会尽快运行调度器。现在假设一个进程正在运行，并且还剩余 2 毫秒的时间片。在 2 毫秒后，调度器*应该*抢占该运行进程并开始执行一个新进程。然而，遗憾的是，这一事件直到下一次定时器中断才会发生，而下一次中断可能并不在\
  \ 2 毫秒后。最坏的情况下，下一次定时器中断可能在 `1/HZ` 秒之后！当 `HZ=100` 时，一个进程可能会获得近 10 毫秒的额外运行时间。当然，这一切都会相互抵消并保持公平性，因为所有任务接收到的调度不精确都是相同的——但这不是问题所在。问题源于延迟抢占造成的延迟。如果待调度的任务有时间敏感的操作需要执行（例如重新填充音频缓冲区），这种延迟可能是不可接受的。将滴答率增加到\
  \ 1000Hz 将最坏情况的调度超出降低到仅 1 毫秒，并将平均情况超出降低到仅 0.5 毫秒。\n\n### 较大 `HZ` 的缺点\n\n现在，增加滴答率会有*某些*副作用，否则它从一开始就会被设为\
  \ 1000Hz（甚至更高）了。确实，存在一个大问题：更高的滴答率意味着更频繁的定时器中断，这意味着更高的开销，因为处理器必须花费更多时间执行定时器中断程序。滴答率越高，处理器执行定时器中断的时间就越长。这不仅导致用于其他工作的处理器时间减少，还导致处理器缓存更频繁的抖动以及功耗增加。关于开销影响的问题是有争议的。从\
  \ `HZ=100` 移动到 `HZ=1000` 显然带来了十倍的开销。然而，开销本身有多大？最终的共识是，至少在现代系统上，`HZ=1000` 不会产生不可接受的开销，而且转向\
  \ 1000Hz 定时器并没有性能造成太大伤害。尽管如此，在 2.6 版本中，可以使用不同的 `HZ` 值编译内核。^(3)\n\n*然而，由于架构和 NTP\
  \ 相关问题，`HZ` 并不是任何值都可以接受的。在 x86 上，100、500 和 1000 都能正常工作。*\n\n#### 无中断操作系统\n\n你可能会奇怪操作系统是否真的需要固定的定时器中断。尽管\
  \ 40 年来一直是常态，几乎所有的通用操作系统都采用与本章描述类似的定时器中断，但 Linux 内核支持一种名为*无中断运行（tickless operation）*的选项。当内核使用设置了\
  \ `CONFIG_HZ` 配置选项构建时，系统会根据待挂的定时器动态调度定时器中断。中断不是每隔（例如） 1ms 触发一次，而是根据需要动态地调度和重新调度。如果下一个定时器设置为在\
  \ 3ms 后触发，那么定时器中断就会在 3ms 后触发。此后，如果 50ms 内没有工作，内核将重新调度中断在 50ms 后触发。\n\n开销的减少是受欢迎的，但真正的收益在于节电，特别是在空闲系统上。在标准的基于滴答的系统中，内核在空闲期间也需要处理定时器中断。在无中断系统中，空闲时刻不会被不需要的时间中断干扰，从而降低系统功耗。无论空闲期是\
  \ 200 毫秒还是 200 秒，随着时间的推移，这些收益将转化为巨大的节能。\n\n### Jiffies\n\n全局变量 `jiffies` 保存了自系统启动以来发生的滴答数。在启动时，内核将该变量初始化为零，并在每次定时器中断期间加\
  \ 1。因此，因为每秒有 `HZ` 次定时器中断，所以每秒有 `HZ` 个 jiffies。系统的运行时间因此为 `jiffies/HZ` 秒。实际发生的情况稍微复杂：内核将\
  \ `jiffies` 初始化为一个特殊的初始值，导致变量更频繁地溢出以捕获错误。当需要 `jiffies` 的实际值时，会先减去这个“偏移量”。\n\n###\
  \ Jiffy 的词源\n\n*jiffy* 一词的起源未知。诸如 *in a jiffy*（瞬间）之类的短语被认为源于 18 世纪的英国。在通俗术语中，*jiffy*\
  \ 指的是一个不确定但短暂的时间段。\n\n在科学应用中，*jiffy* 代表各种时间间隔，最常见的是 10ms。在物理学中，*jiffy* 有时用来指光行进某些距离所需的时间。在计算机工程中，*jiffy*\
  \ 是两个连续周期之间的时间。在电气工程中，*jiffy* 是一个交流电（AC）周期的时间。在美国，*jiffy* 是一秒的 1/60。在操作系统中，尤其是 Unix，jiffy\
  \ 是两个连续滴答之间的时间。正如在本章中所看到的，Linux 中的 jiffy 可以有多种值。历史上这一直是 10ms。\n\njiffies 变量在 `<linux/jiffies.h>`\
  \ 中声明为：\n\n```\nextern unsigned long;\n```\n\n在下一节中我们将查看它的实际定义。现在，让我们看一些内核代码。以下表达式将秒转换为\
  \ jiffies：\n\n```\nseconds * HZ\n```\n\n同样，此表达式将 jiffies 转换为秒：\n\n```\njiffies /\
  \ HZ\n```\n\n前者将秒转换为 ticks 更常见。例如，代码经常需要设置未来的某个时间，例如：\n\n![此处图片]\n\n将 ticks 转换为秒通常用于与用户空间通信，因为内核本身很少关心绝对时间。\n\
  \n### Jiffies 的内部表示\n\n`jiffies` 变量一直是 `unsigned long`，在 32 位架构上为 32 位，在 64 位架构上为\
  \ 64 位。当滴答率为 100 时，32 位 `jiffies` 变量大约在 497 天后溢出。然而，当 `HZ` 增加到 1000 时，这种溢出现在仅需 49.7\
  \ 天！如果 `jiffies` 在所有架构上都存储在 64 位变量中，对于任何合理的 `HZ` 值，`jiffies` 变量在寿命范围内都不会溢出。\n\n\
  出于性能和历史原因——主要是为了与现有内核兼容——内核开发者希望保持 `jiffies` 为 `unsigned long`。一些巧妙的思想和一点链接器魔法拯救了局面。\n\
  \n正如你之前看到的，`jiffies` 定义为：\n\n```\nextern unsigned long volatile jiffies;\n```\n\n\
  在 `<linux/jiffies.h>` 中还定义了第二个变量：\n\n```\nextern u64 jiffies_64;\n```\n\n用于链接 x86\
  \ 主内核镜像的 `ld(1)` 脚本 `(arch/x86/kernel/vmlinux.lds.S)` 然后将 `jiffies` 变量叠加在 `jiffies_64`\
  \ 变量的开头：\n\n```\njiffies = jiffies_64;\n```\n\n\n\n因此，`jiffies` 是完整的 64 位变量 `jiffies_64`\
  \ 的低 32 位。代码可以像以前一样继续访问 `jiffies` 变量。由于大多数代码仅使用 `jiffies` 来测量时间的流逝，因此大多数代码只关心低 32\
  \ 位。然而，时间管理代码使用了整个 64 位，从而防止了整个 64 位值的溢出。图 11.1 显示了 `jiffies` 和 `jiffies_64` 的布局。\n\
  \n图 11.1. `jiffies` 和 `jiffies_64` 的布局。\n\n![image](img/11fig01.jpg)\n\n访问 `jiffies`\
  \ 的代码只是读取 `jiffies_64` 的低 32 位。可以使用 `get_jiffies_64()` 函数来读取完整的 64 位值。这种需求很罕见；因此，大多数代码继续直接通过\
  \ `jiffies` 变量读取低 32 位。\n\n*之所以需要一个特殊函数，是因为 32 位架构无法原子地访问 64 位值中的两个 32 位字。该特殊函数在读取之前通过\
  \ `xtime_lock` 锁锁定 jiffies 计数。*\n\n在 64 位架构上，`jiffies_64` 和 `jiffies` 指的是同一个东西。代码可以读取\
  \ `jiffies` 或调用 `get_jiffies_64()`，因为这两者的效果相同。\n\n### Jiffies 的回绕（Wraparound）\n\n\
  `jiffies` 变量像任何 C 语言整数一样，当其值增加超过其最大存储限制时会发生溢出。对于 32 位无符号整数，最大值为 `2^{32} – 1`。因此，在滴答计数溢出之前，可能会发生\
  \ 4294967295 次定时器滴答。当滴答计数等于这个最大值并增加时，它会绕回零。\n\n看一个回绕的示例：\n\n![image](img/p0215-01.jpg)\n\
  \n这段代码段的意图为未来的某个时间设置超时——在本例中，是现在的一半秒后。代码接着继续执行某些工作，据推是探测硬件并等待响应。完成后，如果整个过程花费的时间超过超时时间，代码将恰当地处理错误。\n\
  \n这里有多个潜在的溢出问题，但让我们研究其中一个：考虑如果 `jiffies` 在设置 `timeout` 之后绕回零会发生什么。那么第一个条件判断将失败，因为\
  \ `jiffies` 的值会小于 `timeout`，尽管在逻辑上它更大。从概念上讲，`jiffies` 的值应该是一个很大的数——大于 `timeout`。但由于它溢出了最大值，它现在变成了一个小值——可能只比零多几个滴答。由于回绕，`if`\
  \ 语句的结果被反转了。哎呀！\n\n幸运的是，内核提供了四个宏来比较滴答计数，这些宏可以正确地处理滴答计数中的回绕。它们位于 `<linux/jiffies.h>`\
  \ 中。这里列出了宏的简化版本：\n\n![image](img/p0215-02.jpg)\n\n`unknown` 参数通常是 `jiffies`，而 `known`\
  \ 参数是你想要与之比较的值。\n\n`time_after(unknown, known)` 宏如果时间 `unknown` 在时间 `known` 之后则返回真；否则返回假。`time_before(unknown,\
  \ known)` 宏如果时间 `unknown` 在时间 `known` 之前则返回真；否则返回假。最后两个宏的操作与前两个相同，不同之处它们在参数相等时也会返回真。\n\
  \n上一个示例的对定时器回绕安全的版本看起来像这样：\n\n![image](img/p0215-03.jpg)\n\n如果你好奇为什么这些宏可以防止由于回绕引起的错误，请为两个参数尝试不同的值。然后假设一个参数绕回了零，看看会发生什么。\n\
  \n### 用户空间与 `HZ`\n\n在 2.6 之前的内核中，更改 `HZ` 的值会导致用户空间异常。发生这种情况是因为值是以“每秒滴答数”为单位导出到用户空间的。随着这些接口变成永久性的，应用程序开始依赖于特定的\
  \ `HZ` 值。因此，更改 `HZ` 会按某些常数缩放各种导出的值——而用户空间完全不知情！运行时间（Uptime）显示为 20 小时而实际上只有 2 小时！\n\
  \n为了防止此类问题，内核需要缩放所有导出的 `jiffies` 值。内核通过定义 `USER_HZ` 实现，这是用户空间期望的 `HZ` 值。在 x86 上，由于\
  \ `HZ` 在历史上是 100，因此 `USER_HZ` 是 `100`。定义在 `kernel/time.c` 中的 `jiffies_to_clock_t()`\
  \ 函数随后被用于将 `HZ` 单位的滴答计数转换为 `USER_HZ` 单位的滴答计数。使用的表达式取决于 `USER_HZ` 和 `HZ` 是否是它们自身的整数倍，以及\
  \ `USER_HZ` 是否小于或等于 `HZ`。如果两者都成立，表达式为：\n\n```\njiffies / (HZ / USER_HZ)\n```\n\n\
  如果 `USER_HZ` 大于 `HZ`，表达式为：\n\n```\njiffies * (USER_HZ / HZ)\n```\n\n如果它们不是整数倍，内核使用：\n\
  \n```\n(jiffies * USER_HZ) / HZ\n```\n\n### 硬件时钟与定时器\n\n架构提供了两个硬件设备来帮助计时：我们一直在讨论的系统定时器和实时时钟。这些设备的实际行为和实现有所不同，但通用用途和设计相似。\n\
  \n#### 实时时钟\n\n实时时钟（RTC）提供了一个非易失性设备来存储时间。即使系统关机，RTC 也通过主板上的一个小电池继续跟踪时间。在 PC 架构上，RTC\
  \ 和 CMOS 是集成的。在启动时，内核读取 RTC 并使用其初始化墙时间。内核通常不再读取它；但某些支持的架构（如 x86）会定期将当前的墙时间写回 RTC。\n\
  \n#### 系统定时器\n\n系统定时器在内核计时中扮演着更重要（更频繁）的角色。无论架构如何，系统定时器的想法都是相同的——提供一种周期性中断的机制。某些架构通过一个可以频率振荡的时钟来实现。其他系统则提供一个递减器：计数器被设置为初始值，并以固定速率递减直到为零。当计数器为零时，触发中断。\n\
  \n\n\n依赖架构的例程被注册为系统定时器的中断处理程序，因此当定时器中断发生时它就会运行。它的具体工作取决于给定的架构，但大多数处理程序至少会执行以下工作：\n\
  \n- 获取 `xtime_lock` 锁，它保护了对 `jiffies_64` 和墙钟时间值 `xtime` 的访问。\n- 根据需要确认或重置系统定时器。\n\
  - 定期将更新后的墙钟时间保存到实时时钟。\n- 调用与架构无关的定时器例程 `tick_periodic()`。\n\n与架构无关的例程 `tick_periodic()`\
  \ 执行了更多工作：\n\n- 将 `jiffies_64` 计数加 1。（这在 32 位架构上也是安全的，因为之前已经获取了 `xtime_lock` 锁。）\n\
  - 更新当前运行进程的资源使用情况，例如消耗的系统时间和用户时间。\n- 运行任何过期的动态定时器（在后续章节中讨论）。\n- 执行 `scheduler_tick()`，如第\
  \ 4 章 所示。\n- 更新存储在 `xtime` 中的墙钟时间。\n- 计算臭名昭著的平均负载。\n\n该例程之所以简单，是因为其他函数处理了大部分工作：\n\
  \n![image](img/p0218-01.jpg)\n\n大部分重要工作在 `do_timer()` 和 `update_process_times()`\
  \ 中完成。前者负责实际对 `jiffies_64` 进行加：\n\n![image](img/p0218-02.jpg)\n\n`update_wall_time()`\
  \ 函数正如其名，根据已通过的滴答（ticks）更新墙钟时间，而 `calc_global_load()` 则更新系统的平均负载统计。\n\n当 `do_timer()`\
  \ 最终返回时，会调用 `update_process_times()` 来更新关于一个滴答已过去的各种统计信息，并通过 `user_tick` 标记它是发生在用户空间还是内核空间：\n\
  \n![image](img/p0219-01.jpg)\n\n回想来自 `tick_periodic()`，`user_tick` 的值是通过查看系统寄存器设置的：\n\
  \n```\nupdate_process_times(user_mode(get_irq_regs()));\n```\n\n`account_process_tick()`\
  \ 函数负责对进程时间的实际更新：\n\n![image](img/p0219-02.jpg)\n\n你可能会意识到，这种方法意味着内核认为进程在定时器中断发生时处理器所处的*任何*模式下运行了*整个*上一个滴答。实际上，该进程在最后一个滴答期间可能已经多次进入和退出内核模式。事实上，该进程甚至可能不是上一个滴答内唯一运行的进程！这种细粒度的进程计数是经典的\
  \ Unix 风格，在没有更复杂的计数机制的情况下，这是内核能提供的最佳方案。这也是高频率滴答率的另一个原因。\n\n接下来，`run_local_timers()`\
  \ 函数标记了一个软中断（softirq，见第 8 章，“底下半部与工作延迟”），来处理任何过期定时器的执行。定时器将在后续章节“定时器”中介绍。\n\n最后，`scheduler_tick()`\
  \ 函数减少当前运行进程的时间片，并在需要时设置 `need_resched`。在 SMP 机器上，它还会根据需要平衡每个处理器的运行队列。这在第 4 章 中进行了讨论。\n\
  \n`tick_periodic()` 函数返回原始的依赖架构的中断处理程序，后者执行任何必要的清理工作，释放 `xtime_lock` 锁并最终返回。\n\n\
  这一切每隔 `1/HZ` 秒发生一次。在 x86 机器上，这每秒可能是 *100* 或 *1,000* 次！\n\n### 当天时间\n\n当前的当天时间（墙钟时间）定义在\
  \ `kernel/time/timekeeping.c` 中：\n\n```\nstruct timespec xtime;\n```\n\n`timespec`\
  \ 数据结构在 `<linux/time.h>` 中定义为：\n\n![image](img/p0220-01.jpg)\n\n`xtime.tv_sec` 值存储了自\
  \ 1970 年 1 月 1 日（UTC）以来过的秒数。这个日期被称为*纪元*（epoch）。大多数 Unix 系统将相对于此纪元作为其对当前墙钟时间的概念。`xtime.v_nsec`\
  \ 值存储了最后一秒内经过的纳秒数。\n\n读取或写入 `xtime` 变量需要 `xtime_lock` 锁，它*不是*普通的自旋锁，而是一个*顺序锁*（seqlock）。第\
  \ 10 章，“内核同步方法”讨论了顺序锁。\n\n更新 `xtime` 需要一个写写顺序锁：\n\n```\nwrite_seqlock(&xtime_lock);\n\
  \n/* update xtime ... */\n\nwrite_sequnlock(&xtime_lock);\n```\n\n读取 `xtime` 需要使用\
  \ `read_seqbegin()` 和 `read_seqretry()` 函数：\n\n![image](img/p0220-03.jpg)\n\n该循环一直重复，直到读取者确认读取数据时没有中间写入。如果在循环期间发生了定时器中断并更新了\
  \ `xtime`，则返回的序列号无效，循环重复。\n\n获取墙钟时间的主要用户空间接口是 `gettimeofday()`，它在 `kernel/time.c`\
  \ 中实现为 `sys_gettimeofday()`：\n\n![image](img/p0221-01.jpg)\n\n`timespec` 数据结构在 `<linux/time.h>`\
  \ 中定义为：\n\n![image](img/p0220-01.jpg)\n\n`xtime.tv_sec` 值存储了自 1970 年 1 月 1 日（UTC）以来过的秒数。这个日期被称为*纪元*。大多数\
  \ Unix 系统将相对于此纪元作为其对当前墙钟时间的概念。`xtime.v_nsec` 值存储了最后一秒内经过的纳秒数。\n\n读取或写入 `xtime` 变量需要\
  \ `xtime_lock` 锁，它*不是*普通的自旋锁而是一个*顺序锁*。第 10 章，“内核同步方法”。\n\n更新 `xtime` 需要一个写顺序锁：\n\
  \n```\nwrite_seqlock(&xtime_lock);\n\n/* update xtime ... */\n\nwrite_sequnlock(&xtime_lock);\n\
  ```\n\n读取 `xtime` 需要使用 `read_seqbegin()` 和 `read_seqretry()` 函数：\n\n![image](img/p0220-03.jpg)\n\
  \n该循环一直重复，直到读取者确认读取数据时没有中间写入。如果在循环期间发生了定时器中断并更新了 `xtime`，则返回的序列号无效，循环重复。\n\n获取墙钟时间的主要用户空间接口是\
  \ `gettimeofday()`，它在 `kernel/time.c` 中实现为 `sys_gettimeofday()`：\n\n![image](img/p0221-01.jpg)\n\
  \n`timespec` 数据结构在 `<linux/time.h>` 中定义为：\n\n![image](img/p0220-01.jpg)\n\n`xtime.tv_sec`\
  \ 值存储了自 1970 年 1 月 1 日（UTC）以来过的秒数。这个日期被称为*纪元*。大多数 Unix 系统将相对于此纪元作为其对当前墙钟时间的概念。`xtime.v_nsec`\
  \ 值存储了最后一秒内经过的纳秒数。\n\n（注：输入文本包含大量重复。根据“保留正文核心内容”的指令，我仅处理了唯一的核心内容。）\n\n该例程之所以简单，是因为其他函数处理了大部分工作：\n\
