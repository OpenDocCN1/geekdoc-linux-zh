  \n由于原文文本本身存在严重的排版错误和重复，上述译文基于原文逻辑尽可能进行了处理。\n\n---\n**由于您提供的原始文本存在大量重复和句子断裂（例如代码块重复、部分不完整的句子），我已确保翻译逻辑的连贯性。以下是基于您文本逻辑的最终翻译：**\n\
  \n[content]\n-   由于 `long` 的大小在不同架构上有所不同，*永远不要*假设 `sizeof(int)` 等于 `sizeof(long)`。\n\
  -   同样，不要假设指针和 `int` 的大小相同。\n\n操作系统使用一种简单的助记符来描述其类型的尺寸。例如，64 位 Windows 被称为 `LLP64`，这意味着\
  \ `long` 类型和指针类型均为 64 位。64 位 Linux 系统为 `LP64`：`long` 和指针类型为 64 位。32 位 Linux 系统为\
  \ `ILP32`：`int`、`long` 和指针类型均为 32 位。这种助记符有助于让人一眼看出是哪种操作系统实现了其字长位宽，因为这种选择涉及到权衡。\n\
  \n考虑 `ILP64`、`LP64` 和 `LLP64`。在 `ILP64` 中，`int`、`long` 和指针类型的大小均为 64 位。这使得编程变得更容易，因为主要的\
  \ C 类型具有相同的大小（整数和指针之间的大小不匹配是编程错误的常见来源），但缺点是常见的整数类型比通常需要的要大得多。在 `LP64` 中，程序员可以使用不同大小的整数类型，但必须注意\
  \ `int` 类型的大小小于指针的大小。在 `LLP64` 中，程序员被困限于相同大小的 `int` 和 `long` 类型，并且还要担心所有整数和指针之间的大小不匹配问题。大多数程序员更倾向于\
  \ Linux 采用的 `LP64` 模型。\n\n### 不透明类型（Opaque Types）\n\n不透明数据类型不公开其内部格式或结构。它们几乎是 C\
  \ 语言中能达到的最“黑盒”的状态。语言对它们的支持有限。相反，开发者声明一个 `typedef`，将其称为不透明类型，并希望没有人将其强制转换回标准的 C 类型。所有的使用通常都是通过开发者创建的一组特殊接口完成的。一个例子是\
  \ `pid_t` 类型，它存储一个进程标识符。该类型的实际大小并不公开——尽管任何人都可以“作弊”偷看一眼并发现它是一个 `int`。如果没有代码显式地使用该类型的大小，就可以在不产生太大麻烦的情况下更改它。事实确实如此：在旧的\
  \ Unix 系统中，`pid_t` 被声明为 `short`。\n\n另一个不透明类型的例子是 `atomic_t`。正如在第 10 章“内核同步方法”中所述，该类型持有一个可以进行原子操作的整数值。尽管该类型是\
  \ `int`，但使用不透明类型有助于确保数据仅在特殊的原子操作函数中使用。不透明类型还有助于隐藏 `atomic_t` 的可用大小，由于 32 位 SPARC\
  \ 的架构限制，它并不总是完整的 32 位。\n\n内核中其他不透明类型的示例包括 `dev_t`、`gid_t` 和 `uid_t`。\n\n在处理不透明类型时，请记住以下规则：\n\
  \n-   不要假设类型的大小。它在某些系统上可能是 32 位，在另一些系统上可能是 64 位。此外，内核开发者可以随时间更改其大小。\n-   不要将类型转换回标准的\
  \ C 类型。\n-   保持大小无关。编写代码时要确保类型的实际存储和格式可以发生变化。\n\n### 特殊类型（Special Types）\n\n内核中的某些数据尽管没有用不透明类型表示，但需要特定的数据类型。一个例子是中断控制中使用的\
  \ `flags` 参数，它应该始终存储在无符号 `long` 中。\n\n在存储和操作特定数据时，务必注意表示该类型的数据类型并使用它。将这些值之一存储在另一种类型（如\
  \ `unsigned int`）中是一个常见的错误。虽然在 32 位架构上不会产生问题，但 64 位机器将遇到麻烦。\n\n### 显式大小类型（Explicitly\
  \ Sized Types）\n\n作为程序员，你通常在代码中需要显式大小的数据。这通常是为了匹配外部要求，例如硬件、网络或二进制文件提出的要求。例如，声卡可能有一个\
  \ 32 位的寄存器，网络数据包可能有一个 16 位的字段，或者执行文件可能有一个 8 位的 cookie。在这些情况下，表示数据的数据类型需要*恰好*正确的大小。\n\
  \n内核在 `<asm/types.h>` 中定义了这些显式大小的数据类型，该文件由 `<linux/types.h>` 包含。表 19.2 是完整的列表。\n\
  \n表 19.2. 显式大小的数据类型\n\n![image](img/t0385-01.jpg)\n\n有符号变体很少被使用。\n\n这些显式类型仅仅是对标准\
  \ C 类型的 `typedef`。在 64 位机器上，它们可能看起来如下：\n\n```\ntypedef signed char s8;\ntypedef\
  \ unsigned char u8;\ntypedef signed short s16;\ntypedef unsigned short u16;\ntypedef\
  \ signed int s32;\ntypedef unsigned int u32;\ntypedef signed long s64;\ntypedef\
  \ unsigned long u64;\n```\n\n在 32 位机器上，它们可能定义如下：\n\n```c\ntypedef signed char s8;\n\
  typedef unsigned char u8;\ntypedef signed short s16;\ntypedef unsigned short u16;\n\
  typedef signed int s32;\ntypedef unsigned int u32;\ntypedef signed long long s64;\n\
  typedef unsigned long long u64;\n```\n\nchar 的符号性（Signedness of Chars）\n\nC 标准规定\
  \ `char` 数据类型可以是有符号的或无符号的。由编译器、处理器或两者决定 `char` 类型的合适默认值。\n\n在大多数架构上，`char` 默认是有符号的，因此范围是从\
  \ -128 到 127。在少数其他架构上（如 ARM），`char` 默认是无符号的，范围是从 0 到 255。\n\n例如，在 `char` 默认无符号的系统上，这段代码会在\
  \ `i` 中存储 255 而不是 -1：\n\n```c\nchar i = -1;\n```\n\n在其他机器上，`char` 默认是有符号的，这段代码正确地在\
  \ `i` 中存储 -1。如果程序员的意图是存储 -1，之前的代码应该是：\n\n```c\nsigned char i = -1;\n```\n\n而如果程序员真的想要存储\
  \ 255，代码应该是：\n\n```c\nunsigned char = 255;\n```\n\n如果你在代码中使用 `char`，请假设它可以是*有符号\
  \ char* 或*无符号的 char*。如果你需要它显式地为其中一种，请将其声明为此。\n\n### 数据对齐（Data Alignment）\n\n*对齐*指的是数据在内存中的位置。如果一个变量位于与其大小倍数的内存地址上，则它是*自然对齐的*。例如，一个\
  \ 32 位类型如果位于 4 的倍数地址上，就是自然对齐的（即其低 2 位为零）。因此，大小为 2^(*n*) 字节的数据类型地址的低 *n* 位必须为零。\n\
  \n某些架构对数据的对齐有严格要求。在某些系统上（通常是基于 RISC 的系统），加载未对齐的数据会导致处理器异常（处理过的错误）。在其他系统中，访问未对齐的数据可行，但会导致性能下降。\n\
  \n#### 避免对齐问题\n\n编译器通常通过自然对齐所有数据类型来防止对齐问题。事实上，对齐问题通常不是内核开发者的主要关注点——gcc 开发者会担心这些问题，所以程序员不需要。然而，当程序员过分操作指针并访问编译器预期之外的数据时，问题就会出现。\n\
  \n\n\n使用一个指向更大对齐地址的强制转换指针来访问对齐地址会导致对齐问题（无论这在特定架构上意味着什么）。换句话说，这是一个坏消息：\n\n```\nchar\
  \ wolf[] = \"Like a wolf\";\n\nchar *p = &wolf[1];\n\nunsigned long l = *(unsigned\
  \ long *)p;\n```\n\n这个示例将指向 `char` 的指针视为指向 `unsigned long` 的指针，这可能导致加载的 32 位或 64\
  \ 位 `unsigned long` 值从一个不是 4 倍或 8 倍的地址加载。\n\n这种复杂的访问方式可能看起来很晦涩，而且通常确实如此。尽管如此，它仍然会出现；所以要小心。现实世界中的例子通常不会那么直观或复杂。\n\
  \n#### 非标准类型的对齐\n\n如前所述，标准数据类型的对齐地址是该数据类型大小的倍数。非标准（复杂）C 类型遵循以下对齐规则：\n\n- 数组的对齐方式是其基础类型的对齐方式；因此，每个元素都会被进一步正确对齐。\n\
  - `union`（联合体）的对齐方式是其包含的最大类型对齐方式。\n- 结构体的对齐方式使得该结构体数组中的每个元素都能得到正确对齐。\n\n结构体还引入了填充（padding），这引入了其他问题。\n\
  \n#### 结构体填充\n\n结构体的填充是为了确保结构体中的每个元素都是自然对齐。这确保了当处理器访问结构体中的给定元素时，该元素是对齐的。例如，考虑在 32\
  \ 位机器上的这个结构体：\n\n![image](img/p0387-02.jpg)\n\n结构体在内存中的布局并非完全如此，因为结构体成员的自然对齐是不够的。相反，编译器创建结构体的方式使得内存中的\
  \ `struct` 类似于如下：\n\n![image](img/p0388-01.jpg)\n\n填充变量的存在是为了确保正确的自然对齐。第一个填充浪费了\
  \ 3 字节的空间，以便将 `cat` 放置在 4 字节边界上。这会自动对齐剩余的类型，因为它们都比 `cat` 小。第二个也是最后一个填充是为了填充 `struct`\
  \ 的大小。额外的字节确保了结构体的大小是 4 的倍数，从而使得该结构体数组中的每个成员都是自然对齐的。\n\n注意，在大多数 32 位机器上，这两个结构体的\
  \ `sizeof(animal_struct)` 都返回 12。C 编译器会自动添加这些填充以确保正确的对齐。\n\n你通常可以通过重新排列结构体成员的顺序来消除对填充的需求。这可以让你在不需要填充的情况下获得正确对齐的数据，从而得到更小的结构体：\n\
  \n![image](img/p0388-02.jpg)\n\n这个结构体的大小只有 8 字节。然而，并不总是可以重新排列结构定义。例如，如果此结构体被指定为标准的一部分或已在现有代码中使用，那么它的顺序就是固定的，尽管这种需求在内核（由于缺乏正式的\
  \ ABI）中比在用户空间中少常见。通常，你可能出于其他原因而想要使用特定的顺序——例如，为了最好地布局变量以优化缓存行为。注意，ANSI C 规定编译器永远不能更改结构体成员的顺序——这完全取决于你，即程序员。然而，编译器可以提供帮助：`-Wpadded`\
  \ 标志会指示 `gcc` 在每次向结构体添加填充时生成警告。\n\n*如果编译器能够任意更改结构中项的顺序，任何使用该结构体的现有代码都会崩溃。在 C 中，函数仅通过向结构体的基地址加上偏移量来计算结构体中变量的位置。*\n\
  \n内核开发者在批量使用结构体时（即当将其发送到网络或直接将结构体保存到磁盘时）需要意识到结构体填充，因为不同架构所需的填充可能不同。这是 C 没有原生结构体比较运算符的原因之一。结构体中的填充可能包含垃圾数据，无法对一个结构体和另一个进行逐字节比较。C\
  \ 的设计者（正确地）认为，让程序员根据每种情况编写唯一的比较函数并利用结构的布局是最好的。\n\n#### 字节序\n\n*字节序*（Byte ordering）是一个字内部字节的顺序。处理器可以对字中的字节进行编号，使得最低位是字中的第一个（最左侧）或最后一个（最右侧）值。如果最高字节首先编码，剩余字节的重要性递减，则字节序称为*大端*（big-endian）。如果最低字节首先编码，剩余字节的重要性递增，则字节序称为*小端*（little-endian）。\n\
  \n在编写内核代码时，永远不要假设任何给定的字节序（当然，除非你正在为特定架构编写代码）。Linux 内核支持两种字节序的机器——包括可以在启动时从任种字节序中选择的机器——通用代码必须兼容其中一种。\n\
  \n图 19.1 是大端字节序的示例。图 19.2 是小端字节序的示例。\n\n图 19.1. 大端字节序。\n\n![image](img/19fig01.jpg)\n\
  \n图 19.2. 小端字节序。\n\n![image](img/19fig02.jpg)\n\nx86 架构的 32 位和 64 位变体都是小端的。大多数其他架构都是大端的。\n\
  \n让我们看看这种编码在实践中意味着什么。考虑数字 1027，以四字节整数的形式以二进制存储：\n\n00000000 00000000 00000100 00000011\n\
  \n内存中的内部存储在大端和小端之间是不同的，如表 19.3 所示。\n\n表 19.3. 大端与小端\n\n![image](img/t0390-01.jpg)\n\
  \n注意大端架构如何将最高字节存储在最小的地址中。这与小端完全相反。\n\n作为最后一个例子，这里有一个简单的代码段，用于测试给定的架构是大端还是小端：\n\n\
  ```\nint x = 1;\n\nif (*(char *)&x == 1)\n    /* little endian */\nelse\n    /*\
  \ big endian */\n```\n\n这在用户空间或内核内部均有效。\n\n#### 大端和小端的历史\n\n*大端*（big-endian）和*小端*（little-endian）这两个术语源于乔纳森·斯威夫特（Jonathan\
  \ Swift）1726 年的讽刺小说《格列佛游记》。在小说中，虚构的小利普浦人主要的政治问题是蛋应该从大端敲开还是小端敲开。倾向于大端的人是大大端人，而倾向于小端的人是小端人。\n\
  \n小利普浦人与我们的大端与小端争论之间的相似之处在于，争论的根源更多是政治而非技术优势。\n\nLinux 支持的每种架构都在 `<asm/byteorder.h>`\
  \ 中定义了 `__BIG_ENDIAN` 或 `__LITTLE_ENDIAN` 之一，以对应机器的字节序。\n\n该头文件还包含来自 `include/linux/byteorder/`\
  \ 的系列宏，有助于在各种字节序之间进行转换。最常用的宏是\n\n![image](img/p0391-01.jpg)\n\n这些宏将一种字节序转换为另一种字节序。在顺序相同的情况下（例如，从原生字节序转换为大端，而处理器是大端的），这些宏将什么都不做。否则，它们将返回转换后的值。\n\
  \n#### 时间\n\n\n\n\n\n时间的测量是另一个核心概念，它在不同架构甚至不同的内核版本之间可能存在差异。永远不要假设定时器中断的频率或每秒 `jiffies`\
  \ 的数量。相反，请始终使用 `HZ` 来正确缩放你的时间单位。这很重要，因为不仅定时器频率在不同架构之间不同，而且在特定架构的不同内核版本之间也可能发生变化。\n\
  \n例如，在 x86 平台上 `HZ` 为 100。这意味着定时器中断每秒发生 100 次，或者每 10 毫秒一次。然而，在 2.6 内核系列的早期，`x86`\
  \ 的 `HZ` 是 1000。在其他架构上，该值有所不同：Alpha 的 `HZ` 等于 1024，而 ARM 等于 100。\n\n永远简单地将 `jiffies`\
  \ 与 100 等数字进行比较并假设它们总是意味着相同的意思。为了适当地缩放时间，请乘以或除以 `HZ`。例如\n\n![image](img/p0391-02.jpg)\n\
  \n`HZ` 定义在 `<asm/param.h>` 中。该主题将在第 10 章中进一步讨论。\n\n### 页面大小\n\n在处理内存页时，永远不要假设页面大小。x86-32\
  \ 程序员的一个常见错误是假设页面大小为 4KB。虽然在 x86-32 机器上确实如此，但其他架构具有不同的大小。事实上，某些架构甚至支持多种页面大小！表 19.4\
  \ 列出了每个支持架构的有效页面大小。\n\n表 19.4 架构页面大小\n\n![image](img/t0392-01.jpg)\n\n在处理内存页时，使用\
  \ `PAGE_SIZE` 作为页的大小（单位为字节）。`PAGE_SHIFT` 值是地址左移以推导出其页码所需的所需的位数。例如，在具有 4KB 页的 x86-32\
  \ 上，`PAGE_SIZE` 为 4096，`PAGE_SHIFT` 为 12。这些值定义在 `<asm/page.h>` 中。\n\n### 处理器排序\n\
  \n回想第 9 章“内核同步简介”和第 10 章，不同的架构具有不同程度的处理器排序。某些架构具有严格的排序限制，所有的加载和存储都按照代码规定的顺序发生。其他芯片具有弱排序，加载和存储会根据处理器认为合适的方式进行重排序。\n\
  \n在你的代码中，如果依赖数据顺序，请确保通过使用适当的内存障（如 `rmb()` 和 `wmb()`），使得即使是最弱排序的处理器也能以正确的顺序提交你的加载和存储。第\
  \ 10 章 有更多信息。\n\n### SMP、内核抢占与高内存\n\n在讨论可移植性时，包含对称多处理、内核抢占和高内存似乎有些不正确。毕竟，这些并不是影响操作系统的机器特性，而是\
  \ Linux 内核的特征，它们确实在某种程度上与架构无关。然而，它们代表了重要的配置选项，你应该始终假设这些选项在代码中是用的。也就是说，始终为 SMP/preempt/highmem\
  \ 系统编写程序，这样在任何配置下你都是安全的。除了之前的可移植性规则外，你还需要遵循以下规则：\n\n- 始终假设你的代码运行在 SMP 系统上并使用适当的锁。\n\
  - 始终假设你的代码在开启内核抢占的情况下运行，并使用适当的锁和内核抢占语句。\n- 始终假设你的代码运行在高内存（未永久映射的内存）系统上，并根据需要使用 `kmap()`。\n\
  \n### 结论\n\n为 Linux 内核编写可移植、简洁且适当的代码有两个主要影响：\n\n- 始终针对最大公约数编写代码：假设任何情况都会发生，任何潜在限制都存在。\n\
  - 始终假设只有最小公可用：不要假设任何特定的内核功能是可用的，仅要求最基础的架构特征。\n\n编写可移植的代码需要意识到许多问题，包括字长、数据类型大小、对齐、填充、字节序、符号性、端序、页面大小以及处理器的加载/存储排序。在大多数内核编程中，主要关注的是确保正确使用数据类型。尽管如此，总有一天会遇到古旧的架构问题，因此理解可移植性问题并在内核内部始终编写简洁、可移植的代码是非常关重要的。\n\
  \n## 20. 补丁、黑客技术与社区\n\nLinux 的最大优势之一是围绕它的庞大用户和开发者社区。社区提供了大量的眼睛来检查你的代码，专家来提供建议，用户来测试并报告问题。最重要的是，社区是决定哪些代码被接受\
  \ Linus 官方内核树的最终仲裁者。理解系统如何运作极其重要。\n\n### 社区\n\n如果 Linux 内核社区要找一个家，那将是 *Linux 内核邮件列表*（Linux\
  \ Kernel Mailing List）。Linux 内核邮件列表（或常客简称为 *lkml*）是大多数关于内核的公告、讨论、辩论和口战的发生地。新功能会被讨论，在采取任何行动之前，大多数代码都会发布在列表中。该列表每天收到超过\
  \ 300 条消息，因此它不适合心细的人。建议任何对内核内核开发感兴趣的人订阅（或至少阅读摘要或存档）。仅仅通过观察大牛们的工作，你就能学到很多东西。\n\n\
  你可以通过向 `majordomo@vger.kernel.org` 发送以下纯文本消息来订阅：\n\n```\nsubscribe linux-kernel\
  \ <your@email.address>\n```\n\n你可以在 `http://vger.kernel.org/` 获取更多信息，并在 `http://www.tux.org/lkml/`\
  \ 查看常见问题解答。\n\n许多网站和其他邮件列表专门针对内核以及广义的 Linux。对于入门内核黑客来说，`http://kernel-newbies.org/`\
  \ 是一个极好的资源——这个网站专门服务于那些在内核上练手的人。另外两个优秀的内核信息来源是 `http://www.lwn.net/`（Linux Weekly\
  \ News，它有一个非常好的内核新闻板块）和 `http://www.kerneltrap.org/`（Kernel Trap，它对内核开发提供了深刻的见解）。\n\
  \n### Linux 编码风格\n\nLinux 内核像任何大型软件项目一样，都有定义的编码风格，规定了代码的格式、风格和布局。这样做并不是因为 Linux\
  \ 内核风格更优（尽管它可能确实如此），而不是因为你的风格不可读，而是因为编码风格的*一致性*对于编码的*生产力*至关重要。然而，人们经常认为编码风格是无关的，因为它不影响编译后的对象代码。在像内核这样许多开发者参与的大型项目中，编码风格的一致性至关重要。一致性意味着熟悉，从而导致易于阅读、减少困惑，并对代码将继续遵循给定风格产生预期。这增加了能够阅读你代码的开发者人数，以及你能阅读的代码量。在开源项目中，眼睛越多越好。\n\
  \n只要确实选择了一种风格并专一使用，那么选择*哪种*风格并不那么重要。幸运的是，Linus 很久以前就规定了我们应该使用的风格，大多数代码都遵循了这一点。大部分风格内容在内核源码树的\
  \ `Documentation/CodingStyle` 文件中通过 Linus 一贯的幽默风格进行了介绍。\n\n#### 缩进\n\n缩进的风格惯是使用长度为八字符的制表符（tabs）。这并不意味着使用八个空格缩进是可以的。每一级缩进都比上一级多一个\
  \ tab，而 tab 的长度是八个字符。例如：\n\n![image](img/p0396-01.jpg)\n\n\n\n\n\n出于不明原因，这条规则是最常被违反的规则之一，尽管它对可读性影响巨大。在经过几个小时的代码编写后，8\
  \ 字符制表符让清晰地识别不同代码块的缩进变得容易几个数量级。当然，8 字符制表符的缺点是经过几级缩进后，行剩余的可用空间并不多。这受到 80 字符行长度限制的进一步影响（见后续章节）。Linus\
  \ 对此此的反驳是，你的代码不应该复杂和混乱到需要两个或三个以上的缩进。他认为，如果你确实需要那么深，你应该重构代码，将复杂层（以及相应的缩进层）提取到单独的函数。\n\
  \n### Switch 语句\n\n从属 `case` 标签应该与父 `switch` 语句缩进相同的进，这有助于缓解 8 字符制表符的影响。例如：\n\n\
  ![image](img/p0396-02.jpg)\n\n在故意从一个 `case` 语句穿透到另一个时，进行注释是常见（且良好）的做法，如示例所示。\n\n\
  ### 空格\n\n本节涵盖了符号和关键字周围的空格，而不包括我们在上两个章节中涵盖过的缩进空格。通常来说，Linux 编码风格规定大多数关键字周围要有空格，且函数与其括号之间不留留白。例如：\n\
  \n```c\nif (foo)\n\nwhile (foo)\n\nfor (i = 0; i < NR_CPUS; i++)\n\nswitch (foo)\n\
  ```\n\n相反，函数、宏以及看起来像函数的关键字——如 `sizeof`、`typeof` 和 `alignof`——关键字与括号之间同样不留空格。\n\n\
  ```c\nwake_up_process(task);\n\nsize_t nlongs = BITS_TO_LONG(nbits);\n\nint len\
  \ = sizeof(struct task_struct);\n\ntypeof(*p)\n\n__alignof__(struct sockaddr *)\n\
  \n__attribute__((packed))\n```\n\n如前所示，括号内部参数之前或之后不留空格。例如，这是禁止的（verboten）：\n\n```c\n\
  int prio = task_prio( task );  /* 糟糕的风格！ */\n```\n\n在大多数二元运算符和三元运算符周围，请在运算符的两侧都加一个空格。例如：\n\
  \n```c\nint sum = a + b;\n\nint product = a * b;\n\nint mod = a % b;\n\nint ret\
  \ = (bar) ? bar : 0;\n\nreturn (ret ? 0 : size);\n\nint nr = nr ? : 1; /* 允许的简写，等同于\
  \ \"nr ? nr : 1\" */\n\nif (x < y)\n\nif (tsk->flags & PF_SUPERPRIV)\n\nmask = POLLIN\
  \ | POLLRDNORM;\n```\n\n相反，在大多数一元运算符周围，运算符与操作数之间不留空格：\n\n```c\nif (!foo)\n\nint\
  \ len = foo.len;\n\nstruct work_struct *work = &dwork->work;\n\nfoo++;\n\n—bar;\n\
  \nunsigned long inverted = ~mask;\n```\n\n引用运算符（dereference operator）周围空格的处理尤为重要。正确的风格是：\n\
  \n```c\nchar *strcpy(char *dest, const char *src)\n```\n\n在引用运算符两侧放置空格是错误的风格：\n\n\
  ```c\nchar * strcpy(char * dest, const char * src)  /* 糟糕的风格 */\n```\n\n同样错误的还有\
  \ C++ 风格将引用运算符放在类型旁边：\n\n```cpp\nchar* strcpy(char* dest, const char* src)  /* 糟糕的风格\
  \ */\n```\n\n### 大括号\n\n括号的位置取决于个人喜好，很少有技术理由支持某种约定优于另一种，但我们必须达成某种共识。接受的内核风格是将左大括号放在第一行的语句末尾。右大括号另起一行，并作为第一个字符。以下是一个示例：\n\
  \n```c\nif (strncmp(buf, \"NO_\", 3) == 0) {\n      neg = 1;\n      cmp += 3;\n\
  }\n```\n\n如果下一个 token 是同一语句的延续，则右括号不单独占一行，而是与该 token 共享一行。例如：\n\n![image](img/p0398-03.jpg)\n\
  \n以及这个示例：\n\n![image](img/p0399-01.jpg)\n\n这条规则对于函数不适用，因为函数不能嵌套在函数内部：\n\n```c\n\
  unsigned long func(void)\n{\n  /* ... */\n}\n```\n\n最后，*不需要*括号的语句可以省略。例如，以下做法是鼓励的但不是必须：\n\
  \n```c\nif (cnt > 63)\n      cnt = 63;\n```\n\n这一切背后的逻辑是 `K&R`。大部分 Linux 编码风格遵循\
  \ `K&R 风格`，即那本著名书中使用的 C 语言编码风格。\n\n*C 程序语言，由 Brian Kernighan 和 Dennis Ritchie 著（Prentice\
  \ Hall, ISBN# 0-13-11-362-8），被称为 K&R，是 C 语言的圣经，由 C 语言作者及其同事编写。*\n\n### 行长度\n\n源代码的长度应保持在\
  \ 80 字符以内。这允许代码在方向上适应标准的 80×24 终端。\n\n对于代码绝对必须换行超过 80 字符的情况，目前没有公认的标准。有些开发者直接允许行换行，让他们的编辑器处理以可读方式显示代码的工作。其他开发者则拆分行，手动在适当的位置插入换行符，可能每新的一行比原始行多起始一个制表位。\n\
  \n同样，有些开发者会将换行的函数参数与左括号对齐。例如：\n\n![image](img/p0399-04.jpg)\n\n其他开发者则拆分行但不对齐参数，而是使用标准的两个制表符：\n\
  \n![image](img/p0399-05.jpg)\n\n由于这种情况没有决定性的规则，选择权交由开发者你自己。许多内核贡献者（包括我）倾向于前面的示例：手动拆分大于\
  \ 80 字符的行，尝试让生成的后续行与上一行整对齐。\n\n### 命名\n\n任何名称都不应采用 `CamelCase`、`Studly Caps` 或或其他混合大小写方案。如果用途明确，将局部变量命名为\
  \ `idx` 甚至只是 `i` 是完全没问题的。像 `theLoopIndex` 这样可爱的名称是不可接受的。匈牙利命名（在变量名中编码类型）是不必要的，且永远不应该使用。这是\
  \ C，不是 Java；是 Unix，不是 Windows。\n\n尽管如此，全局变量和函数应该具有描述性的名称，使用小写并在需要时通过下划线分隔。将全局函数命名为\
  \ `atty()` 是令人困惑的；如 `get_active_tty()` 这样的名称更易接受。这是 Linux，不是 BSD。\n\n### 函数\n\n\
  作为一个经验法则，函数不应超过一两个屏幕的文本，且局部变量少于十个。一个函数应该只做一件事并做好。将一个函数分成更小的函数没有坏。如果你担心函数调用开销，可以通过\
  \ `inline` 关键字使用*内联函数*。\n\n### 注释\n\n对代码进行注释很重要，但注释必须正确。通常，你想要描述代码在做*什么*以及*为什么*这样做，而不是它是*如何*实现的。*如何*应该从代码本身显而易见。如果不是，你可能需要重新思考并重构你写的内容。此外，注释不应包含谁编写了函数、修改日期或其他琐碎的废话。内核使用\
  \ C 风格注释，尽管 `gcc` 也支持 C 风格注释。内核注释的通用风格类似于：\n\n```c\n/*\n * get_ship_speed() - 返回海盗船的当前速度\n\
  \ * 我们需要这个来计算船的坐标。由于此函数可能会睡眠，\n * 不要在持有自旋锁（spinlock）时调用它。\n */\n```\n\n在注释中，重要的注意事项通常带有\
  \ `\"XXX:\"` 前缀，而 Bug 通常带有 `\"FIXME:\"` 前缀，如下：\n\n```c\n/*\n * FIXME: 我们假设 dog ==\
  \ cat，这在未来可能不成立\n */\n```\n\n内核有一种自生成文档的机制。它基于 GNOME-doc，但经过了稍微修改并更名为 Kernel-doc。要创建\
  \ HTML 格式的独立文档，请运行\n\n```bash\nmake htmldocs\n```\n\n或者针对 postscript：\n\n```bash\n\
  make psdocs\n```\n\n你可以通过遵循注释的特殊格式来该系统记录你的函数：\n\n更多信息请参阅 `Documentation/kernel-doc-nano-HOWTO.txt`。\n\
  \n\n\n\nLinux 内核开发者社区对 `typedef` 运算符有强烈的反感。他们的理由是：\n\n- `typedef` 隐藏了数据结构的真实类型。\n\
  - 因为类型被隐藏了，代码更容易出现错误，例如在栈上按值传递结构体体。\n- `typedef` 仅仅是懒惰的表现。\n\n因此，为了避免被嘲笑，请避免 `typedef`。\n\
  \n当然，`typedef` 也有一些很好的用处：隐藏变量的特定架构实现，或者在类型可能发生变化时提供前向兼容性。请仔细判断 `typedef` 是真的需要的，还是仅仅为了减少你需要输入的字符数。\n\
  \n## 使用现有的例程\n\n*不要重复造轮子*。内核提供了字符串处理函数、压缩例程和链表接口，因此请使用它们。\n\n不要用通用接口去封装现有的接口。你经常能看到某些显然是从一个操作系统移植到\
  \ Linux 的代码，各种内核接口被封装在某些极其糟糕的“胶水函数”中。没有人喜欢这样做，所以直接使用提供的接口即可。\n\n## 在源码中尽量减少 `ifdef`\n\
  \n直接在 C 源码中放置 `ifdef` 预处理器指令是不受推崇的。你不应该在函数中执行如下操作：\n\n```\n...\n#ifdef CONFIG_FOO\n\
  \n    foo();\n\n#endif\n...\n```\n\n相反，如果没有设置 `CONFIG_FOO`，请将 `foo()` 定义为空：\n\n\
  ```c\n#ifdef CONFIG_FOO\nstatic int foo(void)\n{\n    /* .. */\n}\n#else\nstatic\
  \ inline int foo(void) { }\n#endif /* CONFIG_FOO */\n```\n\n然后，你就可以无条件地调用 `foo()`。让编译器为你完成工作。\n\
  \n## 结构体初始化器\n\n需要使用标签标识符来初始化结构体。这是好事，因为它防止了结构变化导致初始化错误。它还允许省略值。遗憾的是，C99 采用了一种相当丑的标签标识符格式，并且\
  \ `gcc` 正在废弃之前那种相当好看的 GNU 风格标签标识符。因此，内核代码需要使用新的 C99 标签标识符格式，无论它看起来多丑：\n\n```c\n\
  struct foo my_foo = {\n    .a    = INITIAL_A,\n    .b    = INITIAL_B,\n};\n```\n\
  \n在此代码中，`a` 和 `b` 是 `struct foo` 的成员，`INITIAL_A` 和 `INITIAL_B` 分别是它们的初始化值。如果某个字段未设置，它将设置为根据\
  \ ANSI C 的默认值（例如，指针为 `NULL`，整数为 0，浮点数为 0.0）。例如，如果 `struct foo` 还有一个成员 `int c`，那么上述语句会将\
  \ `c` 初始化为 0。\n\n## 事后修复代码\n\n如果手头来了一堆代码，它们甚至一点像 Linux 内核编码风格的边都没有，请不要担心。只要花点功夫并使用\
  \ `indent` 工具，就能让一切变得完美。`indent` 是一个在大多数 Linux 系统上都能找到的优秀 GNU 工具，它能根据给定规则对源码进行格式化。默认设置是\
  \ GNU 编码风格，并不美观。要让该工具遵循 Linux 内核风格，请执行以下命令：\n\n```bash\nindent -kr -i8 -ts8 -sob\
  \ -l80 -ss -bs -psl <file>\n```\n\n这指示该工具根据内核编码风格格式化代码。或者，脚本 `scripts/Lindent` 会自动以所需的选项调用\
  \ `indent`。\n\n## 指挥链\n\n内核黑客是开发内核的开发者。有些人是为了薪水，有些人是为了爱好，但几乎所有人都是为了乐趣。有重大贡献的内核黑客列在内核源码树根目录下的\
  \ `CREDITS` 文件中。\n\n内核的大部分部分都有关联的*维护者*（maintainer）。维护者是负责内核特定部分的个人（或若干个人）。例如，每个驱动程序都有一个关联的维护者。每个内核子系统——例如网络——也有一个关联的维护者。特定驱动程序或子系统的维护者通常列在\
  \ `MAINTAINERS` 文件中，该文件同样位于内核源码树的根目录下。\n\n有一种特殊的维护者被称为内核维护者（kernel maintainer）。这些人实际上维护着整个内核树。从历史上看，Linus\
  \ 维护开发内核（那是真正的乐趣所在）以及开发结束后后一段时间的稳定内核。在开发内核变为稳定内核不久后，Linus 会将火炬交给一位顶尖的内核开发者。该开发者继续维护该树，而\
  \ Linus 则开始新的开发树工作。鉴于 2.6 开发将永久持续的“新世界秩序”，Linus 仍然是 2.6 内核系列的维护者。另一位开发者维护 2.4 系列，该系列处于严格的仅修复漏洞模式。\n\
  \n## 提交 bug 报告\n\n如果你遇到 bug，最佳行动是编写修复方案，创建补丁（patch），进行测试，并按照后续章节讨论的方法将其提交。当然，你也可以报告问题并让别人帮你修复。\n\
  \n提交 bug 报告最重要的部分是充分描述问题。描述症状、任何系统输出以及一个完全解码的 oops（如果有 oops 的话）。重要的是，如果可能，请提供可靠复现问题的步骤以及对你硬件配置的简要描述。\n\
  \n决定将给谁发送 bug 报告是下一步。内核源码树根目录下的 `MAINTAINERS` 文件列出了与每个驱动程序和子系统关联的个人——他们应该接收任何与他们维护的代码相关的问题。如果你找不到感兴趣的相关方，请将报告发送到\
  \ Linux 邮件列表。即使你找到了维护者，也要抄送邮件列表。\n\n`REPORTING-BUGS` 和 `Documentation/oops-tracing.txt`\
  \ 文件提供了更多信息。\n\n## 补丁\n\nLinux 的所有更改都以补丁的形式发布，补丁是 GNU `diff`(1) 程序的输出，并由 `patch11)\
  \ 程序读取。\n\n### 生成补丁\n\n生成补丁最简单的方法有两个源码树：一个是原始内核树，另一个是你修改后的树。一种常见的方案是将原始树命名为 `linux-x.y.z`（这是源码包解压后的初始），并将你的修改树简单命名为\
  \ `linux`。然后，为了生成这两个树的补丁，在树的级目录下执行以下命令：\n\n```bash\ndiff -urN linux-x.y.z linux/\
  \ > my-patch\n```\n\n这通常在你的家执行，而不是 `/usr/src/linux`，这样不需要 root 权限。`-u` 指定使用统一差异格式。如果没有这个，补丁会很丑且人类难以阅读。`-r`\
  \ 指示 `diff` 递归比较所有目录，`-N` 指定包含修改树中的新文件。或者，如果你只需要对比单个文件，可以执行：\n\n```bash\ndiff -u\
  \ linux-x.y.z/some/file linux/some/file > my-patch\n```\n\n你需要在源码树的级目录下进行比较。这样创建的补丁供他人使用，即使他们的目录名称不同。要应用这种格式的补丁，请在源码树根目录下执行：\n\
  \n```bash\npatch -p1 < ../my-patch\n```\n\n在此示例中，补丁名为 `my-patch` 并创建在上一级。`-p1` 标志指示\
  \ `diff` 去掉补丁中的第一个目录。这使得无论补丁制作者使用什么样的目录命名规范，你都能应用它。\n\n有一个非常有用的工具 `diffstat` 生成补丁变化的直方图（行的增加和删除）。要在你的某个补丁上生成输出，请执行：\n\
  \n```bash\ndiffstat -p1 my-patch\n```\n\n\n\n\n当你向 lkml 发布补丁时，包含此输出通常很有用。因为 `patch(1)`\
  \ 程序会忽略检测到 diff 之前的所有行，你甚至可以在补丁的顶部包含一段短的描述。\n\n## 使用 Git 生成补丁\n\n如果你使用 `Git` 来管理源码树，那么你也需要使用\
  \ `Git` 来生成补丁——没必要重经历上述所有的手动步骤并承受 `Git` 的复杂性。使用 `Git` 生成补丁是一个简单的两部分过程。首先，你需要编写并在本地提交你的更改。对\
  \ `Git` 树进行修改与对标准源码树的操作是一样的。在编辑存储在 `Git` 中的文件时不需要进行任何特殊操作。完成更改后，你只需要将它们提交到你的 `Git`\
  \ 仓库：\n\n```bash\ngit commit -a\n```\n\n`-a` 标志指示 `Git` 提交所有的更改。如果你只想提交特定文件的更改，也可以这样做：\n\
  \n```bash\ngit commit some/file.c\n```\n\n然而，即使使用了 `-a` 标志，`Git` 也不会在未文件显式添加到仓库之前提交它们。要添加一个文件然后提交它（以及所有其他更改），请执行以下两条命令：\n\
  \n```bash\ngit add some/other/file.c\ngit commit -a\n```\n\n当你运行 `git commit` 时，`Git`\
  \ 允许你输入更改日志。让该记录变得详尽且完整，充分解释提交的内容。（我们在下一节详细介绍需要包含的内容。）你可以针对你的仓库创建多个提交。得益于 `Git`\
  \ 的设计，后续提交甚至可以针对同一个文件，并相互为基础构建。当你的树中有一个（或两个）提交时，你可以为每个提交生成一个补丁，你可以像处理上一节中描述的补丁一样处理它们：\n\
  \n```bash\ngit format-patch origin\n```\n\n这将为你的仓库中所有不在原始树中的提交生成补丁。`Git` 会在你的内核源码树根目录下创建这些补丁。要仅为最后\
  \ `N` 个提交生成补丁，你可以执行以下命令：\n\n```bash\ngit format-patch -N\n```\n\n例如，此命令仅为上一次提交生成一个补丁：\n\
  \n```bash\ngit format-patch -1\n```\n\n## 提交补丁\n\n补丁应该按照上一节描述的方法生成。如果补丁涉及特定的驱动程序或子系统，补丁应发送给\
  \ `MAINTAINER` 中列出的维护者。无论哪种方式，都应对 Linux 内核邮件列表 `linux-kernel@vger.kernel.org` 抄送。只有在经过广泛讨论，或者补丁非常简单且明显正确后，才应发送给内核维护者（例如\
  \ Linus）。\n\n通常，包含补丁的邮件主题行格式为“*[PATCH] 描述.*”。邮件正文用技术细节描述了你的补丁所做的更改及其背后的原理。尽可能具体。在邮件的某处注明创建该补丁时的内核版本。\n\
  \n大多数内核开发者希望在邮件中内联阅读你的补丁，并可选地将整体保存到单个文件中。因此，最好的做法是将补丁直接内联插入到邮件末尾。注意，某些邮件客户端可能会换行或或其他更改格式；这会破坏补丁并让开发者感到恼扰。如果你的邮件客户端这样做，请查看它是否有“插入内联（Insert\
  \ Inline）”、“预格式（Preformat）”或类似的功能。否则，将补丁作为不经编码的纯文本附件也是可以的。\n\n如果你的补丁很大或包含多个逻辑更改，你应该将补丁拆分成若干块，每个块代表一个逻辑更改。例如，如果你既引入了一个新\
  \ API 又更改了几个驱动程序来使用它，你可以将更改分为两个补丁（新 API 然后是驱动程序的迁移）和两封邮件。如果任何块需要先前的的补丁，请明确说明。\n\n\
  发布后，请保持耐心等待回复。不要被任何负面回应所击败——至少你得到了回复！讨论问题并在需要时提供更新补丁。如果你没有收到任何回复，尝试发现错误并解决问题。向邮件列表和维护者寻求额外的意见。运气好的话，你可能会在未来的内核发布看到你的更改——恭喜！\n\
  \n### 结论\n\n任何黑客最重要的特质都是欲望和动力——一种想要抓挠的痒，以及去抓挠的决心。这本书提供了内核关键部分的导览，讨论了接口、数据结构、算法和原理。它提供了一个实用的内核内部视角，以满足你的好奇心，或让你在内核事业中快速起步。\n\
  \n然而，正如我之前所说的，唯一的起点就是阅读和编写代码。`Linux` 提供了一个不仅支持而且鼓励这两项活动的社区——所以，开始阅读和编码吧！祝黑客愉快！\n\
  \n## 参考文献\n\n本参考文献列出了与本书互补的作品。请注意，补充本书的绝佳“额外阅读”是内核源码。在 `Linux` 上工作，我们都被赋予获得了对整个现代操作系统源代码的完整且不受限制的访问权限。不要视为所当然。深入其中吧！阅读并编写代码！\n\
  \n### 操作系统设计书籍\n\n这些书籍涵盖了本科课程中讨论的 OS 设计。它们都涉及设计功能性操作系统所包含的概念、算法、问题和解决方案。我推荐所有的，但如果我只能选一本，Deitel\
  \ 的书既全面又易于阅读。\n\nDeitel, H., P. Deitel, and D. Choffnes. *Operating Systems*. Prentice\
  \ Hall, 2003. 关于操作系统理论的卓越著作，包含了一些案例研究。\n\nTanenbaum, Andrew. *Modern Operating Systems*.\
  \ Prentice Hall, 2007. 对现代操作系统（如 `UNIX` 和 `Windows`）中所用概念的概述。\n\nTanenbaum, Andrew.\
  \ *Operating Systems: Design and Implementation*. Prentice Hall, 2006. 关于类 Unix\
  \ 系统 `Minix` 设计和实现的极佳入门级著作。\n\nSilberschatz, A., P. Galvin, and G. Gagne. *Operating\
  \ System Concepts*. John Wiley and Sons, 2008. 因为封面上看起来像恐龙，因此被称为“恐龙书”。OS 设计的极佳介绍。这本书经常修订；其中任何一个版本都可以。\n\
  \n### Unix 内核书籍\n\n这些书籍涉及了 Unix 内核的设计和实现。前五本讨论了特定版本的 Unix，后两本关注于所有 Unix 变体共同的问题。如果你只想买其中本，我会坚持选这两本。\n\
  \nBach, Maurice. *The Design of the Unix Operating System*. Prentice Hall, 1986.\
  \ 对 Unix System V Release 2 设计的良好讨论。\n\nMcKusick, M., K. Bostic, M. Karels, and\
  \ J. Quarterman. *The Design and Implementation of the 4.4BSD Operating System*.\
  \ Addison-Wesley, 1996. 系统设计者对 4.4BSD 设计的讨论。\n\nMcKusick, M. and G. Neville-Neil.\
  \ *The Design and Implementation of the FreeBSD Operating System*. Addison-Wesley,\
  \ 2004. 对 `FreeBSD` 5.2 设计和实现的良好讨论。\n\nMcDougall, R and J. Mauro. *Solaris Internals:\
  \ Solaris and OpenSolaris Kernel Architecture*. Prentice Hall, 2006. 关于 `Solaris`\
  \ 内核核心子系统和算法的有趣讨论。\n\nCooper, C., and C. Moore. *HP-UX 11i Internals*. Prentice\
  \ Hall, 2004. `HP-UX` 和 `PA-RISC` 架构的内部查看。\n\nVahalia, Uresh. *Unix Internals: The\
  \ New Frontiers*. Prentice Hall, 1995. 一本关于现代 Unix 特性（如线程管理和内核抢占）的精彩著作。\n\n\n\n\n\
  \nSchimmel, Curt. *UNIX Systems for Modern Architectures: Symmetric Multiprocessing\
  \ and Caching for Kernel Programmers*. Addison-Wesley, 1994. 一本关于在现代架构上支持现代 Unix\
  \ 所临危险的佳作。极力推荐。\n\n### 关于 Linux 内核的书籍\n\n这些书籍与本书一样，讨论了 Linux 内核。这一类别中的优秀书籍并不多。不过，我推荐下面这两本。\n\
  \nBenvenuti, Christian. *Understanding Linux Network Internals*. O’Reilly and Associates,\
  \ 2005. 对 Linux 网络内部原理的深度剖析。\n\nCorbet, J., A. Rubini, and G. Kroah-Hartman. *Linux\
  \ Device Drivers*. O’Reilly and Associates, 2005. 关于如何为 2.6 内核编写设备驱动程序的优秀讨论，重点关注支持各种类型设备的编程接口。\n\
  \n### 关于其他内核的书籍\n\n了解你的竞争对手百害无益。这些书籍讨论了 Linux 以外的操作系统的设计和实现。看看他们哪里做对了，哪里做错了。\n\n\
  Kogan, M and H. Deitel. *The Design of OS/2*. Addison-Wesley, 1996. 对 OS/2 2.0 的趣味视角。\n\
  \nSingh, Amit. *Mac OS X Internals: A Systems Approach*. Addison-Wesley Professional,\
  \ 2006. 关于整个 Mac OS X 系统的论述，既深又广。\n\nSolomon, D., and M. Russinovich. *Windows Internals:\
  \ Covering Windows Server 2008 and Windows Vista*. Microsoft Press, 2009. 对一个相当非\
  \ Unix 的操作系统的有趣视角。\n\n### 关于 Unix API 的书籍\n\n对 Unix 系统及其 API 进行深入讨论，不仅对于编写强大的用户空间程序很重要，对于理解内核的职责也同样重要。\n\
  \nLove, Robert. *Linux System Programming*. O’Reilly and Associates, 2007. 我关于系统级\
  \ Linux 编程的个人著作，涵盖了 Linux 系统调用和 `libc` API，并关注了 Linux 特有的技巧和小门道。\n\nStevens, W.R.\
  \ and S. Rago. *Advanced Programming in the UNIX Environment*. Addison-Wesley, 2008.\
  \ 对 Unix 系统调用接口的优秀（尽管非定论性的）讨论。\n\nStevens, W. Richard. *UNIX Network Programming,\
  \ Volume 1*. Prentice Hall, 2004. 关于 Unix 系统使用的 sockets API 的经典教材。\n\n### 关于 C 语言语言的书籍\n\
  \nLinux 内核以及大部分 Linux 系统都是用 C 语言编写的。这两本书精通了该主题。\n\nKernighan, B. and D. Ritchie.\
  \ *The C Programming Language*. Prentice Hall, 1988. C 语言语言的权威著作，由 C 语言的作者及其同事编写。\n\
  \nvan der Linden, Peter. *Expert C Programming*. Prentice Hall, 1994. 对 C 语言中一些较少为人知的细节的精彩讨论。作者极具幽默感。\n\
  \n### 其他著作\n\n这是一本其他书籍的集合，它们并不与操作系统严格相关，但讨论了无疑影响它们的话题。\n\nHofstadter, Douglas. *Gödel,\
  \ Escher, Bach: An Eternal Golden Braid*. Basic Books, 1999. 对人类思维的深刻且不可或缺的观察，狂野地深入了多个学科，包括计算机科学。\n\
  \nKnuth, Donald. *The Art of Computer Programming, Volume 1*. Addison-Wesley, 1997.\
  \ 一本关于计算机科学基础算法的无价之宝，包含了内存管理中使用的最佳和最坏拟合算法。\n\n### 网站\n\nKernel.org. 内核源码的官方仓库。它也是许多内核黑客补丁的家园。[www.kernel.org](http://www.kernel.org)。\n\
  \n*Linux Weekly News*. 一个优秀的新闻网站，对本周的 Linux 新闻（包括内核动态）提供明智、准确的评论。极力推荐。[www.lwn.net](http://www.lwn.net)。\n\
  \n*OS News*. 操作系统新闻，以及原创文章、采访和评测。[www.osnews.com](http://www.osnews.com)。\n\n##\
