- "# Linux 内核开发\n\n\n\n![](img/9780768696790.jpg)\n\n![cover-image](img/9780768696790.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n由于 `IPC` 机制涉及的开销比简单的 `function` 调用要大得多，而且因为通常涉及到从内核空间到用户空间（或反之）的上下文切换，消息传递包含了延迟和吞吐量的影响，这种影响在简单函数调用的单体内核中是看不到的。因此，现在所有实用的基于微内核的系统都大部分或所有服务器放置在内核空间，以消除频繁上下文切换的开销，并可能允许直接函数调用。`Windows\
  \ NT` 内核（`Windows XP`、`Vista` 和 `7` 基于此）和 `Mach`（部分 `Mac OS X` 基于此）都是微内核的示例。`Windows\
  \ NT` 和 `Mac OS X` 都没有在用户空间运行任何微内核服务器。\n\nLinux 是一个单体内核；也就是说，Linux 内核在单一地址空间执行，这完全违背了微内核的设计。然而，Linux\
  \ 借鉴了微内核的大部分优点：模块化设计、内核抢占能力、内核线程的支持以及动态加载分离二进制文件（`kernel modules`）的能力。相反，Linux 并没有微内核设计中的诅咒：一切都运行在内核态，通过直接函数调用——而不是消息传递——进行通信。尽管如此，Linux\
  \ 是模块化的、多线程的，内核本身是可调度的。务实主义再次胜利。\n\n随着 Linus 和其他内核开发者贡献 Linux 内核，他们在不忽视 Unix 根基（更重要的是\
  \ `Unix API`）的情况下推进 Linux。因此，由于 Linux 不基于任何特定的 Unix 变体，Linus 和公司可以为任何给定的问题选择最佳解决方案——或者有时发明新的解决方案！Linux\
  \ 与经典 Unix 系统之间存在一些差异：\n\n- Linux 支持内核模块的动态加载。尽管 Linux 内核是单体的，但它可以根据需要动态加载和卸载内核代码。\n\
  - Linux 有对称多处理器（`SMP`）支持。大多数 Linux 变体支持 SMP，传统的 Unix 实现没有。\n- Linux 内核是抢占式的。与传统的\
  \ 变体不同，Linux 内核在执行时可以抢占任务。在其他商业 Unix 实现中，`Solaris` 和 `IRIX` 是抢占式内核，但大多数不是。\n- Linux\
  \ 对线程采取了一种有趣的方法：它不区分线程和普通进程。对于内核来说，所有进程都是相同的——只是共享资源。\n- Linux 提供了一种带有对象的内核模型，具有类、可插的事件以及用户空间文件系统（`sysfs`）。\n\
  - Linux 忽略了一些内核开发者认为设计不良好的常用特性，例如 `STREAMS` 或无法实现的标准。\n- Linux 在每个意义上都是自由的。Linux\
  \ 实现的功能集是内核开发模型的结果。如果一个功能没有价值或考虑不周，Linux 开发者没有义务实现它。相反，Linux 对变化采取了精英态度：修改必须解决特定的现实问题，源自良好的设计，并有可靠的实现。因此，现代\
  \ Unix 变体（如 `pageable kernel`）没有被考虑。\n\n尽管有这些差异，Linux 仍然具有强大 Unix 传统的操作系统。\n\n##\
  \ Linux 内核版本\n\nLinux 内核有两种：稳定和开发。稳定内核适用于广泛部署的生产级发布。新的稳定内核通常只提供错误修复或新驱动程序。另一方面，开发内核经历了（几乎）变化，当开发者实验新解决方案时，内核代码经常发生剧烈变化。\n\
  \nLinux 使用简单的命名方案来区分稳定内核和开发内核（见图 1.2）。三个或四个用点隔开的数字表示 Linux 内核版本。第一个值是主版本，第二个是小版本，第三个是修订版本。可选的第四个值是稳定版本。小版本还决定内核是稳定的还是开发内核；偶数是稳定的，而奇数是开发的。例如，内核版本\
  \ `2.6.30.1` 指定稳定内核。该内核主版本为二，小版本为六，修订数为三十，稳定版本为一。前两个值描述内核系列——在本例中为 `2.6` 系列。\n\n\
  图 1.2 内核版本命名规范。\n\n![image](img/01fig02.jpg)\n\n开发内核有一系列阶段。最初，内核开发者开发新功能会导致混乱。随着时间的推移，内核成熟，最终宣布功能冻结。那时，Linus\
  \ 不接受新功能。然而，对现有功能的工作可以继续。在 Linus 认为内核几乎稳定后，会实施代码冻结。此时，只接受错误修复。不久（希望），Linus 发布新稳定系列的第一个版本。例如，开发系列\
  \ `1.3` 稳定变为 `2.0`，`2.5` 稳定变为 `2.6`。\n\n在给定的系列内，Linus 定期发布新内核，每个版本获得一个新的修订版本。例如，`2.6`\
  \ 系列的第一版本是 `2.6.0`。下一个是 `2.6.1`。这些修订版本包含错误修复、新驱动程序和新功能，但两个修订版本之间（例如 `2.6.3` 和 `2.6.4`）的差异很微小。\n\
  \n开发一直持续到 2004 年，在受邀的内核开发者会议上，全体开发者决定延长 2.6 内核系列，推迟引入 2.7 开发系列。理由是 2.6 内核反馈良好、稳定且足够成熟，不需要新的不稳定特性。这一做法被证明是明智的，随后的几年表明\
  \ 2.6 是一个成熟且强大的野兽。截至本文写作，2.7 开发系列并不在计划中，也不可能。相反，每个 2.6 修订版本的开发周期变长了，每次发布都包含一个微开发系列。\n\
  \n等等，我看到提供的文本存在差异或缺失了一个章节。让我重新处理最后部分：\n\nLinus 的副手 Andrew Morton 将他的 `2.6-mm` 树——曾是内存管理相关变更的测试场——重新用途一个通用测试平台。因此，不稳定的变化流向\
  \ `2.6-mm`，并在成熟后进入 2.6 的微开发系列之一。因此，在过去的几年里，每个 2.6 版本（例如 `2.6.29`）都花了几个月，比其前一个版本有显著变化。这种“微型开发系列”被证明相当成功，在引入新功能的同时保持了高水平的稳定性，短期内不太可能改变。事实上，内核开发者之间的共识是这种新的发布流程将无限持续。\n\
  \n为了补偿发布频率的降低，稳定版本（`2.6.32.8` 中的 `8`）包含了关键错误修复，这些通常是从开发中的内核（在本例中为 `2.6.33`）反向的。通过这种方式，上一个版本继续获得专注于稳定的关注。\n\
  \n## Linux 内核开发社区\n\n\n\n当你开始为 Linux 内核开发代码时，你就成为了全球内核开发社区的一部分。该社区的主要论坛是`Linux 内核邮件列表`（Linux\
  \ Kernel Mailing List，通常简称为 `lkml`）。订阅信息可以在 [`vger.kernel.org`](http://vger.kernel.org)\
  \ 获取。请注意，这是一个高流量列表，每天有数百封邮件产生，而且其他读者——他们包括 Linus 在内的所有核心内核开发者——并不乐意处理胡说八道的内容。然而，在开发过程中，该列表是一项无价的辅助，因为你可以在那里找到测试者、接受同行评审并提问。\n\
  \n后续章节将提供内核开发流程的概述，并对如何成功参与内核开发社区进行更完整的描述。然而，在此期间，潜水学习（静默阅读）Linux 内核邮件列表是你能找到的对本书最好的补充。\n\
  \n## 在我们开始之前\n\n本书是关于 Linux 内核的：它的目标、实现这些目标的设计，以及实现该设计的具体代码。这种方法非常务实，在解释一切是如何运作的时，在理论与实践之间采取了中之道。我的目标是让你对\
  \ Linux 内核的设计和实现产生内部人的欣赏和理解。这种方法结合一些关于内核黑客（kernel hacking）的个人轶和技巧，应该确保本书让你快速上手，无论你是想开发核心内核代码、新的设备驱动程序，还是只想更好地地理解\
  \ Linux 操作系统。\n\n在阅读本书时，你应该拥有一个 Linux 系统和内核源码。理想情况下，到这一步，你已经是一个 Linux 用户，并对源码进行过摸索，但需要一些帮助来将所有内容整合在一起。相反，你可能从未用过\
  \ Linux，但只是出于好奇想学习内核的设计。然而，如果你渴望写一些你自己的代码，那么源码是不可替代的。源代码是*免费*提供的；尽尽管使用它吧！\n\n噢，最重要的是，*玩得开心*！\n\
  \n## 2. 从内核开始\n\n在这一章中，我们将介绍 Linux 内核的一些基础知识：从哪里获取源码、如何编译它，以及如何安装新内核。然后，我们将介绍内核与用户态程序之间的区别，以及内核中常用的编程结构。尽管内核在许多方面确实是独特的，但根结底，它与任何其他大型软件项目并没有太大区别。\n\
  \n### 获取内核源码\n\n当前的 Linux 源码可以在 Linux 内核官方网站 [`www.kernel.org`](http://www.kernel.org)\
  \ 获取，始终提供完整的 `tarball`（使用 `tar` 命令创建的归包）和增量补丁（incremental patch）两种形式。\n\n除非你有特定的理由要使用旧版本的\
  \ Linux 源码，否则你*总是*想要最新的代码。[kernel.org](http://kernel.org) 仓库是获取代码的地方，那里还有许多领先内核开发者提供的额外补丁。\n\
  \n### 使用 Git\n\n在过去的几年里，在 Linus 本人的带领下，内核开发者们开始使用一个新的版本控制系统来管理 Linux 内核源码。Linus\
  \ 创建了这个名为 `Git` 的系统，并考虑了速度。与 `CVS` 等传统系统不同，`Git` 是分布式的，因此它的用法和工作流对许多开发者来说并不熟悉。我强烈建议使用\
  \ `Git` 下载和管理 Linux 内核源码。\n\n你可以使用 `Git` 获取 Linus 树的最新“推送”版本的副本：\n\n```bash\ngit\
  \ clone git://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux-2.6.git\n```\n\
  \n检出后，你可以将你的树更新到 Linus 的最新版本：\n\n```bash\ngit pull\n```\n\n通过这两个命令，你可以获取并随后保持官方内核树更新。要提交并管理你自己的更改，请参阅第\
  \ 20 章“补丁、黑客与社区”。对 `Git` 的完整讨论不在本书的范围内；许多在线资源提供了极佳的指南。\n\n### 安装内核源码\n\n内核 tarball\
  \ 以 GNU zip (`gzip`) 和 bzip2 格式分发。`bzip2` 是默认且首选格式，因为它的压缩效果通常比 `gzip` 好得多。bzip2\
  \ 格式的 Linux 内核 tarball 命名为 `linux-x.y.z.tar.bz2`，其中 `x.y.z` 是该特定版本内核源码的版本。下载源码后，解压和提取非常简单。如果你的\
  \ tarball 是用 `bzip2` 压缩的，运行：\n\n```bash\ntar xvjf linux-x.y.z.tar.bz2\n```\n\n如果是用\
  \ GNU zip 压缩的，运行：\n\n```bash\ntar xvzf linux-x.y.z.tar.gz\n```\n\n这会将源码解压并提取到 `linux-x.y.z`\
  \ 目录。如果你使用 `git` 获取和管理内核源码，则不需要下载 tarball。只需运行描述的 `git clone` 命令，`git` 就会下载并解包最新的源码。\n\
  \n#### 在何处安装和对源码进行开发\n\n内核源码通常安装在 `/usr/src/linux`。你不应该使用此源码树进行开发，因为编译 C 库时所使用的内核版本通常链接到这个树。此外，你不应该需要\
  \ root 权限来修改内核——相反，应该在你的家目录下工作，并仅在安装新内核时使用 root。即使在安装新内核时，`/usr/src/linux` 也应该保持原封不动。\n\
  \n### 使用补丁\n\n在整个 Linux 内核中，补丁（patches）是通信的通用语言。你会以补丁的形式发布代码更改，并以补丁的形式接收代码。*增量补丁*提供了从一个内核树移动到下一个的简单方法。无需下载每个内核\
  \ tarball，只需应用增量补丁即可进入下一个版本。这节省了每个人的带宽和你的时间。要应用增量补丁，在内核源码树*内部*只需运行：\n\n```bash\n\
  patch -p1 < ../patch-x.y.z\n```\n\n通常，针对给定内核版本的补丁是应用于上一个版本的。补丁的生成和应用将在后面的章节中进行更深入讨论。\n\
  \n### 内核源码树\n\n内核源码树分为若干目录，大多数目录包含许多子目录。源码根目录中的目录及其描述列在表 2.1](#ch02.html_ch02table01)中。\n\
  \n表 2.1 内核根目录\n\n![image](img/t0013-01.jpg)\n\n根目录中的一些文件值得注意。`COPYING` 文件是内核许可（GNU\
  \ GPL v2）。`CREDITS` 列出了在内核中有超过少量代码的开发者。`MAINTAINERS` 列出了维护内核子系统和驱动程序的人员。`Makefile`\
  \ 是基础内核 `Makefile`。\n\n### 编译内核\n\n编译内核非常简单。惊讶的是，它比编译和安装其他系统级组件（如 `glibc`）要容易得多。2.6\
  \ 系列内核引入了新的配置和构建系统，这使得工作变得更加简单，并且与早期版本相比是一个受欢迎的改进。\n\n#### 配置内核\n\n\n\n由于 Linux\
  \ 源代码是开放的，你可以在编译之前对其进行配置和定制。事实上，你可以只将你需要的特定功能和驱动程序的支持编译到内核中。在构建内核之前，配置内核是一个必不可少的步骤。由于内核提供了无数功能并支持各种硬件，有*非常多*内容需要配置。内核配置由配置选项控制，这些选项以\
  \ `CONFIG_FEATURE` 的形式以 `CONFIG` 为前缀。例如，对称多处理处理（SMP）由配置选项 `CONFIG_SMP` 控制。如果设置了此选项，则启用\
  \ SMP；如果未设置，则禁用 SMP。配置选项既用于决定构建哪些文件，也用于通过预处理器指令对代码进行操纵。\n\n控制构建过程的配置选项要么是**布尔值（Booleans）**，要么是**三态（tristates）**。布尔选项为\
  \ `yes` 或 `no`。内核功能（如 `CONFIG_PREEMPT`）通常是布尔值。三态选项是 `yes`、`no` 或 `module` 之一。`module`\
  \ 设置表示该配置选项已设置但将编译为模块（即一个独立的动态加载对象）。在三态的情况下，`yes` 选项明确意味着将代码编译到主内核镜像中而不是作为模块。驱动程序通常由三态表示。\n\
  \n配置选项也可以字符串或整数。这些选项不控制构建过程，而是指定内核源码可以作为预处理器宏访问的值。例如，一个配置选项可以指定静态分配数组的大小。\n\n厂商内核（例如\
  \ Canonical 为 Ubuntu 提供的内核或 Red Hat 为 Fedora 提供的内核）作为发行版的一部分是预编译的。此类内核通常启用了所需内核功能的良好交叉部分，并将几乎所有的驱动程序都编译为模块。这提供了一个极佳的基础内核，并以单独模块的形式支持广泛的硬件。无论好坏，作为一名内核黑客，你需要编译自己的内核，并学习在自己的内核中包含哪些模块。\n\
  \n幸运的是，内核提供了多个工具来方便配置。最简单的工具是一个基于文本的命令行实用程序：\n\n```bash\nmake config\n```\n\n该实用程序会逐一遍历每个选项，并要求用户交互式选择\
  \ `yes`、`no` 或（对于三态）`module`。由于这需要*很长*的时间，除非你是按小时计薪的，否则你应该使用基于 ncurses 的图形化实用程序：\n\
  \n```bash\nmake menuconfig\n```\n\n或者基于 gtk+ 的图形化实用程序：\n\n```bash\nmake gconfig\n\
  ```\n\n这三个实用程序将各种配置选项分为不同的类别，例如“处理器类型和特性（Processor Type and Features）”。你可以浏览类别，查看内核选项，当然还可以更改它们的值。\n\
  \n此命令根据你架构的默认值创建一个配置：\n\n```bash\nmake defconfig\n```\n\n尽管这些默认值有些是随机的（在 i386 上，据传它们是\
  \ Linus 的配置！），但如果你从未配置过内核，它们为你提供了一个良好的起点。为了快速上手，运行此命令，然后返回并确保针对你硬件的配置选项已启用。\n\n\
  配置选项存储在内核源码树根目录下的一个名为 `.config` 的文件中。你可能会发现直接编辑这个文件（正如大多数内核开发人员所的那样）更简单。搜索并更改配置选项的值非常容易。在修改你的配置文件后，或者在新的内核树上使用现有的配置文件时，你可以验证并更新配置：\n\
  \n```bash\nmake oldconfig\n```\n\n你应该在每次构建内核之前始终运行此命令。\n\n配置选项 `CONFIG_IKCONFIG_PROC`\
  \ 将完整的内核配置文件压缩后放置在 `/proc/config.gz`。这使得在构建新内核时轻松克隆当前配置。如果当前内核启用了此选项，你可以将配置从 `/proc`\
  \ 复制并用它构建新内核：\n\n```bash\nzcat /proc/config.gz > .config\nmake oldconfig\n```\n\n\
  在内核配置完成后——无论你如何操作——你可以使用一个命令来构建它：\n\n```bash\nmake\n```\n\n与 2.6 之前的内核不同，你不再需要在构建内核之前运行\
  \ `make dep`——依赖树是自动维护的。你也不需要指定特定的构建类型（例如 `bzImage`），或像在旧版本中那样单独构建模块。默认的 `Makefile`\
  \ 规则将处理一切。\n\n### 最小化构建噪声\n\n一种减少构建噪声但仍能看到警告和错误的技巧是重定向来自 `make` 的输出：\n\n```bash\n\
  make > ../detritus\n```\n\n如果你需要查看构建输出，可以读取该文件。然而，由于警告和错误是输出到标准错误（standard error）的，你通常不需要这样做。事实上，我就是这么做的：\n\
  \n```bash\nmake > /dev/null\n```\n\n这会将所有无价值的输出重定向到那个巨大的、不祥的无归之地 `/dev/null`。\n\n\
  ### 启动多个构建作业\n\n`make` 程序提供了一个将构建过程拆分为多个并行*作业（jobs）*的功能。这些作业中的每一个独立并并发运行，在多处理器系统上显著加快构建过程。它还提高了处理器的利用率，因为构建大型源码树的时间包含了大量的\
  \ I/O 等待时间（进程等待 I/O 请求完成的空闲时间）。\n\n默认情况下，`make` 只启动一个作业，因为 `Makefiles` 往往具有错误的依赖信息。如果依赖关系错误，多个作业可能会相互干扰，导致构建过程中出现错误。内核的\
  \ `Makefiles` 具有正确的依赖信息，因此启动多个作业不会失败。要使用多个构建作业构建内核，请使用：\n\n```bash\nmake -jn\n```\n\
  \n在这里，`n` 是启动的任务数量。通常的做法是每个处理器启动两个任务。例如，在 16 核机器上，你可以这样做：\n\n```bash\nmake -j32\
  \ > /dev/null\n```\n\n使用诸如出色的 `distcc` 或 `ccache` 等工具也可以极大缩短内核构建时间。\n\n### 安装新内核\n\
  \n内核构建完成后，你需要安装它。如何安装取决于架构和引导加载程序——请查阅你的引导加载程序关于在哪里拷贝内核镜像以及如何设置启动的说明。始终保留一个已知安全的内核，以防新内核出现问题！\n\
  \n例如，在使用 grub 的 x86 系统上，你会将 `arch/i86/boot/bzImage` 复制到 `/boot`，命名为 `vmlinuz-version`，并编辑\
  \ `/boot/grub/grub.conf` 为新内核添加条目。使用 LILO 启动的则会编辑 `/etc/lilo.conf` 然后重新运行 `lilo`。\n\
  \n幸运的是，安装模块是自动化的且与架构无关。作为 root，运行：\n\n```bash\nmake modules_install\n```\n\n这将所有编译后的模块安装到它们正确的目录下。\n\
  \n构建过程还会在内核源码根目录下创建一个 `System.map` 文件。它包含一个符号查找表，将内核符号映射到起始地址。这在调试期间用于将内存地址转换为函数和变量名。\n\
  \n### 性然不同的本质\n\n###普通用户空间应用程序相比，Linux 内核具有若干独特的属性。尽管这些差异并不意味着开发内核代码比开发用户空间代码更困难，但确实使其变得不同。\n\
  \n这些特性使得内核成为截然不同的物。一些常规规则被扭曲了，另一些则是全新的。尽管某些差异是显而易见的（我们都知道内核可以做任何事情），但另一些并不明显。其中最重要的差异是\n\
  \n• 内核既无法访问 C 库也无法访问标准 C 头文件。\n\n\n\n\n\n- 内核使用 `GNU C` 编写。\n- 内核缺乏提供给用户态的内存保护。\n\
  - 内核无法轻易执行浮点运算。\n- 内核为每个进程提供较小的固定大小栈。\n- 由于内核具有异步中断、可抢占性并支持 `SMP`，同步和并发是内核中的主要关注问题。\n\
  - 可移植性至关重要。\n\n让我们简要查看这些问题，因为所有内核开发者都必须时刻记住这些点。\n\n## 没有 libc 或标准头文件\n\n与用户态应用不同，内核没有链接标准\
  \ C 库——或者说，没有链接任何其他库。这有多个原因，包括“先有鸡蛋还是先有蛋”的问题，但首要原因是速度和大小。整个 C 库——甚至是其中一个相当不错的子集——对于内核来说都太大了，效率也低。\n\
  \n不要担心：许多常用的 `libc` 函数已经在内核内部实现。例如，常见的字符串处理函数位于 `lib/string.c` 中。只需包含头文件 `<linux/string.h>`\
  \ 即可直接使用。\n\n### 头文件\n\n当我在本书中提到头文件时，指的是内核源码树中内核的头文件。内核源文件不能包含外部头文件，就像它们不能使用外部库一样。\n\
  \n基础文件位于内核源码树根的 `include/` 目录下。例如，头文件 `<linux/inotify.h>` 位于源码树的 `include/linux/inotify.h`。\n\
  \n一组特定架构的头文件位于内核源码树的 `arch/<architecture>/include/asm`。例如，如果为 x86 架构编译，你的特定架构头文件位于\
  \ `arch/x86/include/asm`。源代码通过简单的 `asm/` 前缀来包含这些头文件，例如 `<asm/ioctl.h>`。\n\n在缺失的函数中，最熟悉的是\
  \ `printf()`。内核无法访问 `printf()`，但它提供了 `printk()`，其工作原理与其那个熟悉的“表兄弟”几乎相同。`printk()`\
  \ 函数将格式化字符串复制到内核日志缓冲区，该缓冲区通常由 `syslog` 程序读取。其用法与 `printf()` 类似：\n\n```\nprintk(\"\
  Hello world! A string '%s' and an integer '%d'\\n\", str, i);\n```\n\n`printf()`\
  \ 和 `printk()` 之间的一个显著区别是，`printk()` 允许你指定优先级标记。该标记被 `syslogd` 用于判断在何处显示内核消息。是这些优先级的示例：\n\
  \n```\nprintk(KERN_ERR \"this is an error!\\n\");\n```\n\n注意，`KERN_ERR` 和打印的消息之间没有逗号。这是刻意为之；优先级标记是一个表示字符串字面量的预处理器定义，它在编译期间会被连接到打印的消息上。我们在本书中全程使用\
  \ `printk()`。\n\n## GNU C\n\n像任何自尊的 Unix 内核一样，Linux 内核是用 `C` 编写的。也许令人惊讶的是，内核并不是用严格的\
  \ ANSI C 编写的。相反，在可行的情况下，内核开发者利用 `gcc`（GNU 编译器集合，包含了编译内核以及 Linux 系统上用 C 编写的大多数内容的\
  \ C 编译器）提供的各种语言扩展。\n\n内核开发者同时使用 `ISO C99` 和 `GNU C` 扩展 C 语言。这些更改将 Linux 内核与 `gcc`\
  \ 绑定，尽管最近另一个编译器 Intel C 编译器已经能够支持足够的 `gcc` 特性，使其它也能编译 Linux 内核。最早支持的 `gcc` 版本是 3.2；建议使用\
  \ `gcc` 4.4 或更高版本。内核使用的 `ISO C99` 扩展并不特殊，由于 `C99` 是 C 语言的官方修订版，它们正逐渐出现在许多其他代码中。而与标准\
  \ ANSI C 更不熟悉的偏离是由 `GNU C` 提供的。让我们看看在内核中看到的一些有趣的扩展；这些更改将内核代码与其他你可能熟悉的项目区分开来。\n\n\
  ### 内联函数\n\n`C99` 和 `GNU C` 都支持 `inline functions`。内联函数正如其名，会被内联插入到每个函数调用处。这消除了函数调用和返回（寄存器保存和恢复）的开销，并允许可能进行更大的优化，因为编译器可以将调用者和被调用函数视为一个整体进行优化。作为缺点（世上没有免费午餐），代码体积增加了，因为函数内容被复制到所有调用者中，这增加了内存消耗和指令缓存占用。内核开发者将内联函数处理小型时间敏感型函数。对大型函数进行内联（特别是那些被使用多次或不是极端时间敏感的函数）是不受鼓励的。\n\
  \n当使用关键字 `static` 和 `inline` 作为函数定义的一部分时，即声明了内联函数。例如：\n\n```\nstatic inline void\
  \ wolf(unsigned long tail_size)\n```\n\n函数声明必须在任何使用之前，否则编译器无法将函数内联。通常做法是将内联函数放在头文件中。由于它们被标记为\
  \ `static`，因此不会创建导出函数。如果一个内联函数仅被一个文件使用，可以将其放在该文件的顶部。\n\n### 内联汇编\n\n`gcc` 编译器允许在其他\
  \ C 函数中嵌入汇编。当然，这一特性仅用于内核中某些特定架构特有的部分。\n\n`asm()` 编译器指令用于内联汇编代码。例如，这段内联汇编执行了 x86\
  \ 处理器的 `tsc` 指令，它返回时间戳 (`tsc`) 寄存器的值：\n\n```\nunsigned int low, high;\nasm volatile(\"\
  rdtsc\" : \"=a\" (low), \"=d\" (high));\n/* low 和 high 现在包含 64 位 tsc 的低 32 位和高 32\
  \ 位 */\n```\n\n`gcc` 编译器有一个内置指令，可以将条件分支优化为可能跳转或极不可能跳转。编译器使用该指令对分支进行适当优化。内核将该指令封装在易用的宏\
  \ `likely()` 和 `unlikely()` 中。\n\n例如，考虑如下的 `if` 语句：\n\n```\nif (error) {\n    /*\
  \ ... */\n}\n```\n\n要将此分支标记为极不可能跳转（即可能不跳转）：\n\n```c\n/* 我们预测 'error' 几乎总是为 0 ...\
  \ */\nif (unlikely(error)) {\n    /* ... */\n}\n```\n\n相反，将分支标记为极可能跳转：\n\n```c\n\
  /* 我们预测 'success' 几乎总是非 0 ... */\nif (likely(success)) {\n    /* ... */\n}\n```\n\
  \n你只有在分支方向*先验地*非常已知，或者当你想以牺牲另一种情况为代价来优化特定情况时，才应该使用这些指令。这是一个重要点：当分支标记正确时，这些指令会带来性能提升；当分支标记错误时，会导致性能*损失*。\n\
  \n\n\n\n\n当用户空间应用程序尝试非法内存访问时，内核可以捕获该错误，发送 `SIGSEGV` 信号并杀死该进程。然而，如果内核尝试进行非法内存访问，结果就变得变得不可控了（毕竟，谁来守护内核呢？）。内核中的内存违规会导致\
  \ `oops`，这是一种严重的内核错误。不言而喻，你绝不能非法访问内存，例如解引用 `NULL` 指针——但在内核内部，风险要高得多！\n\n此外，内核内存是不可分页的（pageable）。因此，你消耗的每一字节内存都意味着减少了一字节可用物理内存。下次当你为内核添加\
  \ `one more feature`（更多功能）时，请记住这一点！\n\n## 不（易地）使用浮点数\n\n当用户空间进程使用浮点数指令时，内核负责管理从整数模式到浮点模式的转换。内核在使用浮点数指令时需要执行的工作取决于架构，但内核通常会捕获陷阱（trap），然后启动从整数模式到浮点模式的转换。\n\
  \n与用户空间不同，内核并没有无缝支持浮点数的奢侈，因为内核无法轻易捕获自身。在内核内部使用浮点数需要手动保存和恢复浮点寄存器，以及其他可能的杂务工作。简单的回答是：`Don’t\
  \ do it`（别这么做！）！在极少数情况下，内核中才有浮点操作。\n\n## 小型的、固定大小栈\n\n用户空间可以在栈上静态分配许多变量，包括巨大的结构体和数千元素的数组。这种行为是合法的，因为用户空间有一个可以动态增长的大栈。（较旧、不那么先进的操作系统的开发者——例如\
  \ DOS——可能还记得即使是用户空间也有固定大小栈的时代。）\n\n内核栈既不大也不动态；它是小小的且大小固定的。内核栈的确切大小取决于架构。在 `x86`\
  \ 上，栈的大小可以在编译时配置，可以是 `4KB` 或 `8KB`。从历史上看，内核栈是两个页，这通常意味着在 32 位架构上是 `8KB`，在 64 位架构上是\
  \ `16KB`——这个大小是固定且绝对的。每个进程都拥有自己的栈。\n\n后续章节将更详细地讨论内核栈。\n\n## 同步与并发\n\n内核容易受到竞态条件的影响。与单线程用户空间应用程序不同，内核的许多属性允许对共享资源的并发访问，因此需要同步来防止竞态。具体来说：\n\
  \n- `Linux` 是一个抢占式多任务操作系统。进程根据内核进程调度器的意愿进行调度和重新调度。内核必须在这些任务之间进行同步。\n- `Linux` 支持对称多处理\
  \ (`SMP`)。因此，如果没有适当的保护，运行在两个或多个处理器上同时执行的内核代码可能会并发访问同一资源。\n- 中断相对于当前正在执行的代码是异步发生的。因此，如果没有适当的保护，中断可能发生在访问资源的过程中，随后中断处理程序可能会再次访问同一资源。\n\
  - `Linux` 内核是可抢占。因此，如果没有保护，内核代码可能会被抢占以让不同的代码执行，后者会访问同一资源。\n\n竞态条件的典型解决方案包括 `spinlocks`（自旋锁）和\
  \ `semaphores`（信号量）。后续章节将对同步和并发进行深入讨论。\n\n## 可移植性的重要性\n\n尽管用户空间应用程序并不一定要追求可移植性，但\
  \ `Linux` 是一个可移植的操作系统，并且应该保持如此。这意味着与架构无关的 C 代码必须在各种系统上正确编译和运行，而与架构的代码必须正确地隔离在内核源码树中特定系统的目录中。\n\
  \n一些规则——例如保持字节序中性（endian neutral）、保持 `64-bit clean`（64 位对齐）、不假设字长或页大小等——大有裨益。可移植性将在后面的章节中深入讨论。\n\
  \n### 总结\n\n毫无疑问，内核具有独特的特性。它执行自己的规则和标准，而且由于内核要管理整个系统，其风险显然更高。尽管如此，`Linux` 内核的复杂性和入门槛与任何其他大型软件项目相比并无本质上的区别。Linux\
  \ 开发道路上最重要的一步是意识到内核并不是可畏的东西。陌生是肯定的。不可逾越？完全不是。\n\n本章和前一章为本书剩余章节涵盖的主题奠定了基础。在之后的每个章节中，我们将涵盖一个特定的内核概念或子系统。在此过程中，你必须阅读并修改内核源码。只有通过实际阅读和实验代码，你才能真正理解它。源码是免费提供的——利用它吧！\n\
  \n## 3. 进程管理\n\n本章介绍了 `process`（进程）的概念，这是 Unix 操作系统中的基本抽象之一。它定义了进程以及线程（threads）等相关概念，并讨论了\
  \ Linux 内核如何管理每个进程：它们如何在内核中被枚举、如何被创建，以及最终如何死亡。由于运行用户应用程序是我们拥有操作系统的原因，因此进程管理是任何操作系统内核至关重要的部分，包括\
  \ `Linux`。\n\n### 进程\n\n`process` 是处于执行中的程序（存储在某些介质上的对象代码）。然而，进程不仅仅是执行程序代码（在 Unix\
  \ 中通常称为 `text section`）。它们还包括一组资源，如打开的文件和待处理的信号、内部内核数据、处理器状态、一个带有一个或多个内存映射的内存地址空间、一个或多个\
  \ `threads of execution`（执行线程）以及一个包含全局变量的 `data section`（数据段）。实际上，进程是运行程序代码的活动结果。内核需要高效且透明地管理所有这些细节。\n\
  \n执行线程（通常缩为 `threads`）是进程内部的活动对象。每个线程包含唯一的程序计数器、进程栈和一组寄存器。内核调度的是单个线程而不是进程。在传统的 Unix\
  \ 系统中，每个进程由一个线程组成。然而，在现代系统中，多线程程序（由多个线程组成的程序）是常见的。正如你之后将看到的，Linux 对线程有独特的实现：它不区分线程和进程。对\
  \ Linux 来说，线程只是特殊的进程。\n\n在现代操作系统中，进程提供了两种虚拟化：虚拟处理器和虚拟内存。虚拟处理器为进程提供了一种它独占系统的错觉，尽管它可能与其他数百个进程共享处理器。第\
  \ 4 章 (`ch04.html`)，“进程调度”将讨论这种虚拟化。虚拟内存允许进程分配和管理内存，就像它拥有系统中所有的内存一样。虚拟内存将在第 12 章\
  \ (`ch12.html`)，“内存管理”中介绍。有趣的是，注意线程共享虚拟内存抽象，而每个线程都有自己的虚拟处理器。\n\n程序本身不是进程；进程是`活动中的`程序和相关资源。事实上，可以存在多个执行`相同`程序的进程。事实上，甚至可以存在多个共享各种资源的进程，如打开的文件或地址空间。\n\
  \n\n\n\n\n进程的生命始于它的创建，这并不令人意料。在 Linux 中，这是通过 `fork()` 系统调用实现的，该调用通过复制现有进程来创建一个新进程。调用\
  \ `fork()` 的进程是“父进程”（parent），而新进程是“子进程”（child）。父进程继续执行，而子进程从相同的地方开始执行：即 `fork()`\
  \ 调用返回的地方。`fork()` 系统调用会从内核返回两次：一次在父进程中，再次是在新出生的子进程中。\n\n通常，在 `fork` 之后，我们希望执行一个新的不同的程序。`exec()`\
  \ 系列函数调用会创建一个新的地址空间并将新程序加载到其中。在现代 Linux 内核中，`fork()` 实际上是通过 `clone()` 系统调用实现的，该将在随后的节中讨论。\n\
  \n最后，程序通过 `exit()` 系统调用退出。该函数终止进程并释放其所有资源。父进程可以通过 `wait4()` 系统调用查询已终止子进程的状态，该调用允许进程等待特定进程的终止。当一个进程退出时，它会被放入一个特殊的“僵尸状态”（zombie\
  \ state），代表已终止的进程，直到父进程调用 `wait()` 或 `waitpid()`。\n\n*内核实现了 `wait4()` 系统调用。Linux\
  \ 系统通过 C 库通常提供 `wait()`、`waitpid()`、`wait3()` 和 `wait4()` 函数。所有这些函数都会返回关于终止进程的状态，尽管它们的语义略有不同。*\n\
  \n### 注意事项\n\n进程的另一个名称是 `task`（任务）。Linux 内核内部将进程称为任务。在本书中，我交替使用这两个术语，尽管当我说 `task`\
  \ 时，我通常是从内核的角度指的是进程。\n\n### 进程描述符与任务结构\n\n内核将进程列表存储在一个名为 `task list`（任务列表）的循环双向链列表中。任务列表中的每个元素都是类型为\
  \ `struct task_struct` 的进程描述符（process descriptor），它定义在 `<linux/sched.h>` 中。进程描述符包含了关于特定进程的所有信息。\n\
  \n*某些关于操作系统设计的书籍将此列表称为任务数组（task array）。由于 Linux 的实现是链表而非静态数组，因此在 Linux 中它被称为任务列表。*\n\
  \n`task_struct` 是一个较大的数据结构，在 32 位机器上大约占用 1.7 KB。然而，考虑到该结构包含了内核关于进程的所有已知和需要的信息，这个大小已经相当小了。进程描述符包含了描述正在执行程序的数据——打开的文件、进程的地址空间、挂起的信号、进程的状态等（参见[图\
  \ 3.1]）。\n\n图 3.1 进程描述符和任务列表。\n\n![image](img/03fig01.jpg)\n\n### 分配进程描述符\n\n`task_struct`\
  \ 结构通过 `slab allocator`（slab 分配器）分配，以提供对象重用和缓存颜色（cache coloring）（见第 12 章）。在 2.6\
  \ 内核系列之前，`struct task_struct` 存储在每个进程内核栈的末尾。这使得寄存器较少的架构（如 x86）可以通过栈指针（stack pointer）计算进程描述符的位置，而无需使用额外的寄存器来存储该位置。现在进程描述符通过\
  \ slab 分配器动态创建，创建了一个新结构 `struct thread_info`，它再次位于栈的底部（对于向下增长的栈）和栈的顶部（对于向上增长的栈）。见图\
  \ 3.2。\n\n*创建 `struct thread_info` 并不是寄存器受限架构的唯一原因。新结构还非常容易计算其值的偏移量，以便用于汇编代码。*\n\
  \n图 3.2 进程描述符和内核栈。\n\n![image](img/03fig02.jpg)\n\n`thread_info` 结构在 x86 上定义在 `<asm/thread_info.h>`\
  \ 中：\n\n```\n![image](img/p0025-01.jpg)\n```\n\n每个任务的 `thread_info` 结构分配在其栈的末尾。结构中的\
  \ `task` 元素是指指向任务实际 `task_struct` 的指针。\n\n### 存储进程描述符\n\n系统通过唯一的进程标识（process identification）值或\
  \ `PID` 来识别进程。PID 是一个由不透明类型 `pid_t` 表示的数值，通常是一个 `int`。然而，由于与早期的 Unix 和 Linux 版本向后兼容，默认最大值仅为\
  \ 32,768（一个 `short int` 的值），尽管该值可以可选地增加到四百万（这在 `<linux/threads.h>` 中进行控制）。内核将此值存储在每个进程描述符的\
  \ `pid` 中。\n\n*不透明类型（Opaque type）是一种物理表示未知或无关紧要的数据类型。*\n\n这个最大值很重要，因为它本质上是可能同时存在的进程最大数量。虽然\
  \ 32,768 对于桌面系统可能足够，但大型服务器可能需要很多进程。如果系统愿意破坏性，管理员可以通过 `/proc/sys/kernel/pid_max`\
  \ 增加该值。\n\n在内核内部，任务通常通过指向其 `task_struct` 的指针进行引用。事实上，大多数处理进程的内核代码都直接与 `task_struct`\
  \ 工作。因此，能够快速查找当前执行任务的进程描述符是有用的，这是通过 `current` 宏完成的。该宏必须由每种架构独立实现。某些架构将当前进程的 `task_struct`\
  \ 指针保存在寄存器中。其他架构（如 x86，其寄存器很少可以浪费）则利用 `thread_info` 存储在栈上的事实来计算 `thread_info` 以及\
  \ `task_struct` 的位置。\n\n在 x86 上，`current` 通过对栈指针的低 13 位进行掩码操作来获取 `thread_info`。这是通过\
  \ `current_thread_info()` 函数实现的。汇编代码如下：\n\n```\nmovl $-8192, %eax\nandl %esp, %eax\n\
  ```\n\n这假设栈大小为 8KB。当启用 4KB 栈时，使用 4096 代替 8192。\n\n最后，`current` 解引用 `thread_info`\
  \ 的 `task` 成员以返回 `task_struct`：\n\n```\ncurrent_thread_info()->task;\n```\n\n此此与\
  \ PPC（IBM 的现代 RISC 微处理器）的方法进行对比，后者将当前 `task_struct` 存储在寄存器中。因此，PPC 的 `current` 仅仅返回寄存器\
  \ `r2` 中的值。PPC 可以采用这种方法是因为它不像 x86 有那么多寄存器。因为访问进程描述符是一项常见且重要的工作，PPC 内核开发者认为使用寄存器是值得。\n\
  \n### 进程状态\n\n进程描述符的 `state` 字段描述了进程的状态（参见图 3.3）。系统上的每个进程都处于五种不同状态中的一种。该值由五个标志之一表示：\n\
  \n• `TASK_RUNNING`——进程是可运行的；它正在运行，或者在运行队列中等待运行（运行队列在第 4 章中讨论）。这是用户空间执行进程的唯一可能状态；它也适用于内核空间中正在运行的进程。\n\
  \n\n\n\n\n- `TASK_INTERRUPTIBLE`—进程处于睡眠状态（即被阻塞状态），正在等待某个条件的出现。当该条件满足时，内核会将进程的状态设置为\
  \ `TASK_RUNNING`。如果该进程接收到一个信号，它也会提前唤醒并变为可运行状态。\n\n- `TASK_UNINTERRUPTIBLE`—此状态与\
  \ `TASK_INTERRUPTIBLE` 相同，不同在于如果它接收到信号，它*不会*唤醒并变为可运行状态。这用于进程必须无中断地等待，或者预期事件将很快发生的情况。由于任务在此状态下不响应信号，因此\
  \ `TASK_UNINTERRUPTIBLE` 的使用频率通常比 `TASK_INTERRUPTIBLE` 低。\n\n*这就是为什么你在 `ps(1)` 中看到那些状态为\
  \ `D` 的令人恐惧的、无法杀死的进程。因为任务不会响应信号，你无法向它发送 `SIGKILL` 信号。此外，即使你能够终止该任务，这也是明智的，因为任务可能正在执行某项重要操作，并且可能持有某个信号量。*\n\
  \n- `__TASK_TRACED`—进程正通过 *ptrace* 被另一个进程（如调试器）进行*跟踪*。\n\n- `__TASK_STOPPED`—进程执行已停止；任务既不在运行，也没有资格运行。如果任务接收到\
  \ `SIGSTOP`、`SIGTSTP`、`SIGTTIN` 或 `SIGTTOU` 信号，或者在被调试期间接收到*任何*信号，就会发生这种情况。\n\n图\
  \ 3.3 进程状态流程图。\n\n![image](img/03fig03.jpg)\n\n### 修改当前进程状态\n\n内核代码经常需要更改进程的状态。首选机制是使用：\n\
  \n```c\nset_task_state(task, state); /* 将任务 'task' 设置为 'state' */\n```\n\n该函数将给定的任务设置为给状态。如果适用，它还会提供内存屏障以强制其他处理器上的执行顺序。（这只在\
  \ SMP 系统上需要。）否则，它等同于：\n\n```c\ntask->state = state;\n```\n\n方法 `set_current_state(state)`\
  \ 与 `set_task_state(current, state)` 同义。关于这些及相关函数的实现，请参阅 `<linux/sched.h>`。\n\n\
  ### 进程上下文\n\n进程最重要的部分之一是执行的程序代码。这些代码从一个*可执行文件*中读取并在程序的地址空间内执行。普通程序执行发生在*用户空间*中。当程序执行系统调用（见第\
  \ 5 章，“系统调用”）或触发异常时，它会进入*内核空间*。此时，内核被认为正在“代表该进程执行任务”，并处于*进程上下文*中。在进程上下文中，`current`\
  \ 宏是有效的。退出内核后，进程在用户空间中恢复执行，除非在此期间出现了一个更高优先级的进程变为可运行状态，在这种情况下，则会调用调度器来选择更高优先级的进程。\n\
  \n*除了进程上下文外，还有中断上下文，我们将在第 7 章“中断与中断处理程序”中讨论它。在中断上下文中，系统并不是代表进程运行，而是正在执行中断处理程序。没有进程绑定到中断处理程序。*\n\
  \n系统调用和异常处理程序是进入内核定义的定义的接口。进程只能通过这些接口之一在内核空间开始执行——*所有*对内核的访问都是通过这些接口完成的。\n\n###\
  \ 进程族树\n\nUnix 系统中的进程之间存在独特的层级结构，Linux 也不例外。所有进程都是 `init` 进程的后代，其 PID 为 1。内核在启动过程的最后一步启动\
  \ `init`。`init` 进程随后读取系统*初始化脚本 (initscripts)* 并执行更多程序，最终完成启动过程。\n\n系统上的每个进程恰只有一个父进程。同样，每个进程都有零或多个子进程。属于同一个父进程的直接子进程被称为*兄弟*。进程之间的关系存储在进程描述符中。每个\
  \ `task_struct` 都有一个指向父进程 `task_struct` 的指针，命名为 `parent`，以及名为 `children` 的子进程列表。因此，给定当前进程，可以通过以下代码获取父进程的进程描述符：\n\
  \n```c\nstruct task_struct *my_parent = current->parent;\n```\n\n同样，可以通过方式遍历进程的子进程：\n\
  \n![image](img/p0030-01.jpg)\n\n`init` 任务的描述符被静态分配为 `init_task`。所有进程之间关系的一个良好例子是，这段代码总是能执行成功的：\n\
  \n![image](img/p0030-02.jpg)\n\n事实上，你可以从系统中的任何一个进程追踪到*任何*其他进程。然而，通常情况下，我们只想要遍历系统中的*所有*进程。这很容易，因为任务列表是一个环形双链表。在给定任何有效任务的情况下，获取列表中的下一个任务请使用：\n\
  \n```c\nlist_entry(task->tasks.next, struct task_struct, tasks)\n```\n\n获取上一个任务的方法也一样：\n\
  \n```c\nlist_entry(task->tasks.prev, struct task_struct, tasks)\n```\n\n这两个例程由 `for_each_process`\
  \ 提供，它会遍历列表：\n\n![image](img/p030-03.jpg)\n\n### 注意事项\n\n遍历每个任务的开销很大；代码这样做之前应该有充分的理由（且没有其他替代方案）。\n\
  \n### 进程创建\n\nUnix 中的进程创建是独特的。大多数操作系统实现一种*产生 (spawn)* 机制在新的地址空间中创建新进程、读取可执行文件并开始执行。Unix\
  \ 采取了独特的方法，将这些步骤分为两个不同的函数：`fork()` 和 `exec()`。前者 `fork()` 创建一个当前任务的副本子进程。它与父进程的区别仅在于\
  \ PID（是唯一的）、PPID（设置为原始进程的 PID）以及某些资源和统计数据（如挂起的信号）。后者 `exec()` 将新的可执行文件加载到地址空间中并开始执行。这是大多数操作系统提供的函数。\n\
  \n*我所说的 `exec()` 指 `exec()` 族函数中的任何成员。内核实现了 `execve()` 系统调用，在此基础上实现了 `execlp()`、`execle()`、`execv()`\
  \ 和 `execvp()`。*\n\n### 写时复制\n\n传统上，在 `fork()` 期间，父进程拥的所有资源被复制并给子进程。这种方法是幼稚且低效的，因为它复制了许多可以共享的数据。更糟糕，如果新进程立即执行新镜像，那么所有的复制都白费了。在\
  \ Linux 中，`fork()` 通过使用*写时复制 (copy-on-write)* 页来实现。写时复制（或 *COW*）是一种延迟或完全防止数据复制的技术。与其复制进程地址空间，父进程和子进程可以共享同一个副本。\n\
  \n然而，数据被标记为这样：如果对其写入，就会创建一个副本且每个进程获得一个唯一的副本。因此，资源的复制只在被写入时发生；在此之前它们都是只读的。如果页面从未被写入（例如在\
  \ `fork()` 之后立即调用了 `exec()`），它们永远不需要被复制。\n\n\n\n\n\n`fork()` 产生的唯一开销是复制父进程的页表以及为子进程创建一个唯一的进程描述符。在进程在\
  \ `fork` 之后立即执行新可执行映像的常见情况下，这种优化避免了对大量数据（带有地址空间，轻松达到数十兆）的浪费拷贝。这是一项重要的优化，因为 Unix\
  \ 哲学鼓励快速执行进程。\n\n## Forking (派生)\n\nLinux 通过 `clone()` 系统调用实现 `fork()`。该调用接受一系列标志，指定父进程和子进程应该共享哪些资源（如果有）。更多关于标志的信息，请参见本章后面的“Linux\
  \ 线程的实现”部分）。`fork()`、`vfork()` 和 `__clone()` 库调用都会带有所需的标志调用 `clone()` 系统调用。而 `clone()`\
  \ 系统调用又会调用 `do_fork()`。\n\n派生的大部分工作由 `do_fork()` 处理，它定义在 `kernel/fork.c` 中。该函数调用\
  \ `copy_process()` 然后启动进程运行。有趣的工作是由 `copy_process()` 完成的：\n\n1. 它调用 `dup_task_struct()`，为新进程创建一个新的内核栈、`thread_info`\
  \ 结构和 `task_struct`。新值与当前任务的值相同。此时，子进程和父进程的进程描述符是相同的。\n2. 随后它检查新子进程不会超过当前用户进程数量的资源限制。\n\
  3. 子进程需要与它的父进程区分开来。进程描述符的多个成员被清空或设置为初始值。未继承的进程描述符成员主要是统计信息。`task_struct` 中的大部分值保持不变。\n\
  4. 子进程的状态被设置为 `TASK_UNINTERRUPTIBLE`，以确保它尚未运行。\n5. `copy_process()` 调用 `copy_flags()`\
  \ 来更新 `task_struct` 中的 `flags` 成员。表示任务是否使用了超级用户权限的 `PF_SUPERPRIV` 标志被清空。表示进程尚未调用过\
  \ `exec()` 的 `PF_FORKNOEXEC` 标志被设置。\n6. 它调用 `alloc_pid()` 为新任务分配一个可用的 PID。\n7. 根据传递给\
  \ `clone()` 的标志，`copy_process()` 会复制或共享打开的文件、文件系统信息、信号处理程序、进程地址空间和命名空间。这些资源通常在给定进程的线程之间共享；否则它们是唯一的，因此在此处复制。\n\
  8. 最后，`copy_process()` 清理并向调用者返回新子进程的指针。\n\n回到 `do_fork()` 中，如果 `copy_process()`\
  \ 成功返回，新子进程将被唤醒并运行。内核刻意地先运行子进程。^(8) 在子进程立即调用 `exec()` 的常见情况下，这消除了如果父进程先运行并开始向地址空间写入时可能发生的任何写拷贝（copy-on-write）开销。\n\
  \n^(8) *这目前运行并不正确，尽管目标是让子进程先运行。*\n\n## vfork()\n\n`vfork()` 系统调用具有与 `fork()` 相同的效果，但父复制页进程条目。相反，子进程作为父进程地址空间中的唯一线程执行，而父进程被阻塞，直到子进程调用\
  \ `exec()` 或退出。子进程*不被允许*写入地址空间。在 3BSD 引入此调用的早期，这是一项受欢的优化，因为当时还没有使用写拷贝页来实现 `fork()`。今天，有了写拷贝和子进程先运行的语义，`vfork()`\
  \ 的唯一用处是不拷贝父进程的页表条目。如果 Linux 某一天获得了写拷贝页表条目，将不再有任何好处。^(9) 由于 `vfork()` 的语义非常复杂（例如，如果\
  \ `exec()` 失败会发生什么？），理想情况下系统不需要 `vfork()`，内核也不会实现它。将 `vfork()` 实现为普通的 `fork()` 是完全可能的——这就是\
  \ Linux 在 2.2 版本之前所做的。\n\n^(9) *可以使用补丁来为 Linux 添加此功能。随着时间的推移，该功能很可能会进入 Linux 内核主干。*\n\
  \n`vfork()` 系统调用通过向 `clone()` 系统调用传递特殊标志来实现：\n\n1. 在 `copy_process()` 中，`task_struct`\
  \ 成员 `vfork_done` 被设置为 `NULL`。\n2. 在 `do_fork()` 中，如果给出了特殊标志，`vfork_done` 指向一个特定地址。\n\
  3. 子进程首次运行后，父进程不是返回，而是等待子进程通过 `vfork_done` 指针向其发送信号。\n4. 在 `mm_release()` 函数中（当任务退出内存地址空间时使用），检查\
  \ `vfork_done` 是否为 `NULL`。如果不是，则向父进程发送信号。\n5. 回到 `do_fork()` 中，父进程唤醒并返回。\n\n如果这一切按计划进行，子进程现在在一个新的地址空间中执行，而父进程再次在它的地址空间中执行。开销较低，但实现方式并不优雅。\n\
  \n## Linux 线程的实现\n\n线程是一种流行的现代编程抽象。它们在共享的地址空间内提供了多个执行线程。它们还可以共享打开的文件和其他资源。线程实现了*并发编程*，并在多处理器系统中实现了真正的*并行性*。\n\
  \nLinux 对线程有独特的实现。对于 Linux 内核来说，没有线程的概念。Linux 将所有线程实现为标准进程。Linux 内核没有为线程提供特殊的调度语义或数据结构。相反，线程仅仅是与其他进程共享资源的进程。每个线程都有唯一的\
  \ `task_struct`，在内核看来表现为一个普通进程——线程恰好与其他进程共享地址空间。\n\n这种线程方法与 Microsoft Windows 或\
  \ Sun Solaris 等操作系统形成了鲜明对比，这些操作系统对线程有*显式*支持（有时称为*轻量级进程*）。“轻量级进程”这个名称总结了 Linux 与其他系统之间的哲学差异。对于这些操作系统来说，线程是比重量进程更轻、快的执行单元抽象。对于\
  \ Linux 来说，线程只是进程间共享资源的一种方式（进程已经是轻量级的）。^(10) 例如，假设有一个由四个线程组成的进程。在具有显式线程支持的系统中，可能会有一个进程描述符指向四个不同的线程。进程描述符描述共享资源，例如地址空间或打开的文件。线程则描述它们独有的资源。相反，在\
  \ Linux 中，简单的四个进程，因此有四个普通的 `task_struct` 结构。这四个进程被设置为共享某些资源。结果非常优雅。\n\n^(10) *作为一个示例，基准测试\
  \ Linux 的进程创建时间与这些其他系统的进程（甚至是线程！）创建时间的对比。结果对 Linux 有利。*\n\n### 创建线程\n\n线程的创建与创建普通任务相同，不同之处向\
  \ `clone()` 系统调用传递对应于要共享特定资源的标志：\n\n```\nclone(CLONE_VM | CLONE_FS | CLONE_FILES\
  \ | CLONE_SIGHAND, 0);\n```\n\n\n\n\n之前的代码产生的行为与普通的 `fork()` 相同，不同之处地址空间、文件系统资源、文件描述符和信号处理器是共享的。换句话说，新任务及其父进程就是通常所说的\
  \ `threads`（线程）。\n\n相比之下，普通的 `fork()` 可以实现为：\n\n```bash\nclone(SIGCHLD, 0);\n```\n\
  \n而 `vfork()` 实现为：\n\n```bash\nclone(CLONE_VFORK | CLONE_VM | SIGCHLD, 0);\n```\n\
  \n传递给 `clone()` 的标志有助于指定新进程的行为，并详细说明父进程和子进程将共享哪些资源。表 3.1 列出了 clone 标志及其影响，这些标志定义在\
  \ `<linux/sched.h>` 中。\n\n表 3.1 `clone()` 标志\n\n![image](img/t0035-01.jpg)\n\n##\
  \ 内核线程\n\n内核在后台执行某些操作通常是非常用的。内核通过 `kernel threads`（内核线程）来实现这一点——它们是仅存在于内核态的标准进程。内核线程与普通进程的显著区别是内核线程没有地址空间（指向其地址空间的\
  \ `mm` 指针为 `NULL`）。它们仅在内核态中运行，不会不会切换到用户态。然而，内核线程是可调度和可抢占的，与普通进程一样。\n\nLinux 将若干任务委托给内核线程，最著名的\
  \ `flush` 任务和 `ksoftirqd` 任务。你可以通过运行命令 `ps -ef` 查看你 Linux 系统上的内核线程。它们有很多！内核线程在系统启动时由其他内核线程创建。事实上，内核线程只能由另一个内核线程创建。内核通过从\
  \ `kthreadd` 内核进程派生所有新的内核线程来自动处理这种情况。声明在 `<linux/kthread.h>` 中的用于从现有内核线程创建新内核线程的接口为：\n\
  \n![image](img/p0036-01.jpg)\n\n新任务由 `kthread` 内核进程通过 `clone()` 系统调用创建。新进程将运行 `threadfn`\
  \ 函数，该函数传递了 `data` 参数。进程将被命名为 `namefmt`，它在可变参数列表中接受 `printf` 风格的格式化参数。进程是在不可运行状态下创建的；在通过\
  \ `wake_up_process()` 显式唤醒之前，它不会开始运行。可以使用单个函数 `kthread_run()` 创建进程并使其变为可运行：\n\n\
  ![image](img/p0036-02.jpg)\n\n该例程以宏的形式实现，简单地同时调用了 `kthread_create()` 和 `wake_up_process()`：\n\
  \n![image](img/p0036-03.jpg)\n\n内核线程启动后将持续存在，直到它调用 `do_exit()` 或内核的其他部分调用 `kthread_stop()`\
  \ 并传递由 `kthread_create()` 返回的 `task_struct` 结构的地址：\n\n```c\nint kthread_stop(struct\
  \ task_struct *k)\n```\n\n我们将在后面的章节中详细讨论特定的内核线程。\n\n## 进程终止\n\n虽然遗憾，但进程最终必须死亡。当进程终止时，内核会释放该进程拥有的资源，并通知其父进程其死亡。\n\
  \n通常，进程的销毁是自发的。它发生在进程调用 `exit()` 系统调用时，可能是显式地在准备终止时调用，也可能是隐式地从任何程序的主程序返回时调用（也就是说，C\
  \ 编译器在 `main()` 返回后放置了对 `exit()` 的调用）。进程也可以非愿终止。这发生在进程接收到无法处理或忽略的信号或异常时。无论进程如何终止，大部分工作都由定义在\
  \ `kernel/exit.c` 中的 `do_exit()` 处理，它完成了一系列任务：\n\n1. 它在 `task_struct` 的 `flags`\
  \ 成员中设置 `PF_EXITING` 标志。\n2. 它调用 `del_timer_sync()` 来移除任何内核定时器。返回后，保证没有定时器在队列中，也没有定时器处理器在运行。\n\
  3. 如果启用了 BSD 进程计数，`do_exit()` 调用 `acct_update_integrals()` 写入计数信息。\n4. 它调用 `exit_mm()`\
  \ 释放进程持有的 `mm_struct`。如果没有其他进程使用该地址空间（即未共享），内核将销毁它。\n5. 它调用 `exit_sem()`。如果进程正在队列等待\
  \ IPC 信号量，它在这里被出队。\n6. 随后它调用 `exit_files()` 和 `exit_fs()` 分别减少文件描述符和文件系统数据对象的引用计数。如果任何一个计数达到零，则该对象将不再被任何进程使用，并被销毁。\n\
  7. 它将任务的退出码（存储在 `task_struct` 的 `exit_code` 成员中）设置为 `exit()` 提供的代码或任何强制终止的内核机制代码。退出码存储在此处供父进程可选地检索。\n\
  8. 它调用 `exit_notify()` 向任务的父进程发送信号，将任务的任何子进程重新养到其线程组中的另一个线程或 init 进程，并将任务的退出状态（存储在\
  \ `task_struct` 结构中的 `exit_state` 中）设置为 `EXIT_ZOMBIE`。\n9. `do_exit()` 调用 `schedule()`\
  \ 切换到新进程。由于任务现在是可调度的，这是该任务将执行执行的代码。`do_exit()` 永远不会返回。\n\n此时，假设任务相关的对象将被释放。\n\n\
  ## 移除进程描述符\n\n在 `do_exit()` 完成后，已终止进程的进程描述符仍然存在，但该进程是僵尸且无法运行。如所述，这使得能够获取子进程的信息。因此，清理进程和移除其进程描述符的操作是分开的。\n\
  \n`wait()` 系列函数通过单一（且复杂的）系统调用 `wait4()` 实现。标准行为是挂起调用任务的执行，直到其一个子进程退出，此时函数返回退出子进程的\
  \ PID。此外，函数还提供一个指针，该指针在返回时持有子进程的退出码。\n\n当需要最终释放进程描述符时，`release_task()` 被调用。它执行以下操作：\n\
  \n1. 它调用 `__exit_signal()`，该函数调用 `__unhash_process()`，后者调用 `detach_pid()` 将进程从 pid\
  \ 哈希表中移除并从任务列表中移除。\n2. `__exit_signal()` 释放已死进程使用的剩余资源，并完成统计和账记录。\n3. 如果任务是线程组的最后一个成员，且领导者是僵尸，则\
  \ `release_task()` 会通知僵尸领导者的父进程。\n4. `release_task()` 调用 `put_task_struct()` 释放包含进程内核栈和\
  \ `thread_info` 结构的页面，并释放分配包含 `task_struct` 的 slab 缓存。\n\n此时，进程描述符和所有仅属于该进程的资源均已释放。\n\
  \n\n\n\n如果父进程在子进程之前退出，必须存在某种机制将任何子任务 `reparent`（重父）到一个新进程，否则没有父进程的终止进程将永远成为僵尸进程，浪费系统内存。解决方案是在退出时，将任务的子进程重父给当前线程组中的另一个进程，或者如果失败，则重父给\
  \ `init` 进程。`do_exit()` 调用 `exit_notify()`，后者调用 `forget_original_parent()`，而该者又调用\
  \ `find_new_reaper()` 来执行重父操作：\n\n![image](img/p0038-01.jpg)\n\n这段代码尝试在进程线程组中寻找并返回另一个任务。如果线程组中没有其他任务，它会寻找并返回\
  \ `init` 进程。现在已经为子进程找到了合适的父进程，每个子进程都需要被定位并重父给 `reaper`（收养者）：\n\n![image](img/p0039-01.jpg)\n\
  \n随后调用 `ptrace_exit_finish()` 来执行相同的重父操作，但是针对一组被 `ptraced`（被跟踪）的子进程：\n\n![image](img/p0039-02.jpg)\n\
  \n同时拥有子进程列表和被跟踪列表的原理非常有趣；这是 2.6 内核中的新特性。当一个任务被 `ptraced` 时，它会被临时重父给调试进程。然而，当该任务的父进程退出时，它必须与其他兄弟进程一起被重父。在以前的内核中，这会导致遍历系统中的每个进程来寻找子进程。解决方案仅仅是维护一个独立的进程正在跟踪的子进程列表——将寻找子进程的范围从每个进程减少到两个相对较小的列表。\n\
  \n当进程成功重父后，就不存在流失僵尸进程的风险。`init` 进程定期对其子进程调用 `wait()`，清理任何分配给它的僵尸进程。\n\n### 结论\n\n\
  在本章中，我们查看了 `process`（进程）这一操作系统的核心抽象。我们讨论了进程的通用性、它为什么重要，以及进程与线程之间的关系。然后，我们讨论了 Linux\
  \ 如何存储和表示进程（通过 `task_struct` 和 `thread_info`）、进程是如何创建的（通过 `fork()` 最终通过 `clone()`）、新的可执行镜像如何加载到地址空间（通过\
  \ `exec()` 族系统调用）、进程的层级结构、父进程如何获取已死亡子进程的信息（通过 `wait()` 族系统调用），以及进程最终如何死亡（通过 `exit()`\
  \ 强制性或意图性）。进程是一个基础且至关重要的抽象，是每个现代操作系统的核心，也是我们之所以拥有操作系统的根本原因（为了运行程序）。\n\n下一章将讨论进程调度，即内核决定哪些进程在何时、以何种顺序以及何种方式运行的精妙且有趣的方法。\n\
  \n## 4. 进程调度\n\n前一章讨论了 `processes`（进程），即活动程序代码的操作系统抽象。本章将讨论 `process scheduler`（进程调度器），即让这些进程运行起来的内核子系统。\n\
  \n进程调度器决定哪个进程运行、何时运行以及运行多久。进程调度器（或简单简称为 `scheduler`）在系统中的可运行进程之间分配有限的处理器时间资源。调度器是像\
  \ Linux 等多任务操作系统的基础。通过决定下一个运行的进程，调度器负责最优化地利用系统，并给用户一种多个进程正在同时执行的印象。\n\n调度器背后的思想非常简单。为了最有效地利用处理器时间，假设存在\
  \ `runnable`（可运行）进程，进程应该始终处于运行状态。如果系统中可运行进程多于处理器，某些进程在某一时刻将不会运行。这些进程处于 `waiting\
  \ to run`（等待运行）。在给定一组可运行进程的情况下，决定运行哪个进程是调度器必须做出的根本决策。\n\n### 多任务\n\n`multitasking`（多任务）操作系统是指能够同时交替执行多一个进程的操作系统。在单处理器机器上，这营造了多个进程并发运行的幻象。在多处理器机器上，这种功能允许进程实际上在不同的处理器上并行并发运行。无论在哪种类型的机器上，它还允许许多进程\
  \ `block`（阻塞）或 `sleep`（睡眠），在工作可用之前不进行实际执行。这些进程虽然在内存中，但并不是 `runnable` 的。相反，此类进程利用内核来等待某些事件（键盘输入、网络数据、时间流逝等）发生。因此，现代\
  \ Linux 系统可以在内存中有很多进程，但（例如）只有一个进程处于可运行状态。\n\n多任务操作系统有两种类型：`cooperative multitasking`（协作多任务）和\
  \ `preemptive multitasking`（抢式多任务）。Linux 与所有 Unix 变体以及大多数现代操作系统一样，实现了抢式多任务。在抢式多任务中，调度器决定进程何时停止运行以及新进程何时开始运行。非自愿挂起运行进程的行为被称为\
  \ `preemption`（抢占）。进程在被抢占之前运行的时间通常是预先定的，被称为进程的 `timeslice`（时间片）。时间片实际上给了每个可运行进程处理器时间的一份\
  \ `slice`（切片）。时间片使得调度器能够对系统做出全局决策。它也防止了任何进程垄占处理器。在许多现代操作系统，时间片是根据进程行为和可配置策略动态计算的。正如我们将看到的，Linux\
  \ 独特的“公平”调度器并没有采用时间片，但效果显著。\n\n相反，在 `cooperative multitasking` 中，进程在自愿决定之前不会停止。进程自愿挂起的行为被称为\
  \ `yielding`（让出）。理想情况下，进程经常让出，给每个可运行进程一个不错的份额，但操作系统无法强制执行。这种方法的缺点显而易见：调度器无法对运行时间做出全局决策；进程垄占处理器的时间可能超过用户的意愿；而且一个不让出的挂起进程可能会导致整个系统崩溃。幸运的是，过去十年设计的大多数操作系统都采用了抢式多任务，Mac\
  \ OS 9（及以前）和 Windows 3.1（及以前）是最著名的（且令人尴尬的）例外。当然，Unix 从诞生起就采用了抢式多任务。\n\n### Linux\
  \ 进程调度器\n\n从 1991 年 Linux 第一版到 2.4 内核系列，Linux 调度器的设计简单到几乎平庸。它很容易理解，但在面对大量进程或大量处理器时扩展性差。\n\
  \n作为回应，在 2.5 内核开发期间，Linux 内核进行了调度器重构。新的调度器因其算法行为被称为 `O(1) 调度器`^(1，解决了之前 Linux 调度器的缺点，并引入了强大的新功能和特性。通过引入常数时间的时间片计算算法和处理器队列，它纠正了早期调度器的设计局限性。\n\
  \n^(1) `O(1)` 是大 O 表示法的一个示例。简而言之，意味着无论输入大小如何，调度器都能以常数时间完成工作。关于大 O 表示法的详细解释请见 第 6\
  \ 章“内核数据结构”。*\n\n\n\n\n`O(1)` 调度器的表现出色，并且随着 Linux 支持拥有数十甚至上百个处理器的大型“铁甲”机器，它扩展得非常从容。然而，随着时间的推移，显而易见\
  \ `O(1)` 调度器在调度延迟敏感型应用方面存在若干病态失败。这些应用被称为`交互进程`，包括任何与用户交互的应用程序。因此，尽管 `O(1)` 调度器对于缺乏交互进程的大型服务器负载是理想的，但在桌面系统上的表现却低于标准，因为交互式应用是系统的“存在的意义”（raison\
  \ d’être）。从 2.6 内核系列早期开始，开发者引入了新的进程调度器，旨在改进 `O(1)` 调度器的交互性能。其中最著名的是`旋转阶梯截止日期`（Rotating\
  \ Staircase Deadline）调度器，它将借鉴队列理论的`公平调度`概念引入了 Linux 进程调度器。这一概念为 `O(1)` 调度器最终在内核版本\
  \ 2.6.23 中被`完全公平调度器`（Completely Fair Scheduler，简称 `CFS`）取代提供了灵感。\n\n本章讨论了调度器设计的基础，以及它们如何应用于完全公平调度器及其目标、设计、实现、算法和相关的系统调用。我们还讨论了\
  \ `O(1)` 调度器，因为它的实现是一种更“经典”的 Unix 进程调度器模型。\n\n### 策略 (Policy)\n\n策略是调度器决定何时运行什么任务的行为。调度器的策略通常决定了系统的整体感受，并负责优化利用处理器时间。因此，它是非常重要的。\n\
  \n#### I/O 密集型与 处理器密集型进程\n\n进程可以分为`I/O 密集型`（I/O-bound）或`处理器密集型`（processor-bound）。前者的特征是进程花费大量时间来提交和等待\
  \ I/O 请求。因此，此类进程的运行时间很短，因为它们最终会由于等待更多 I/O 而阻塞。（在这里，我们说的`I/O`是指任何类型的可阻塞资源，例如键盘输入或网络\
  \ I/O，而不只是磁盘 I/O。））例如，大多数图形用户界面（GUI）应用程序都是 I/O 密集型的，即使它们从不从磁盘读取或写入数据，因为它们的大部分时间都在等待通过键盘和鼠标进行用户交互。\n\
  \n相反，处理器密集型进程花费大量时间执行代码。它们倾向于一直运行直到被抢占，因为它们并不经常在 I/O 请求上阻塞。然而，由于它们不是 I/O 驱动的，因此系统响应并不要求调度器频繁运行它们。因此，针对处理器密集型进程的调度策略倾向于以较低频率运行此类进程，但持续时间更长。处理器密集型进程的最终例子是执行无限循环的进程。更容易接受的例子包括执行大量数学计算的程序，例如\
  \ `ssh-keygen` 或 `MATLAB`。\n\n当然，这些分类并不是互斥的。进程可以同时表现出两种行为：例如，X Window 服务器既是处理器密集型也是\
  \ I/O 密集型。其他进程可能是 I/O 密集型的，也会进入高强处理器活动期。一个很好的例子是文字处理器，它通常处于等待按键的状态，但在任何时刻可能因为拼写检查或宏计算的疯狂状态而占满处理器。\n\
  \n系统中的调度策略必须尝试满足两个冲突的目标：快速进程响应时间（低延迟）和最大系统利用率（高吞吐量）。为了满足这些相互矛盾的需求，调度器通常采用复杂的算法来确定最值得运行的进程，同时不损害对其他低优先级进程的公平性。Unix\
  \ 系统的调度策略倾向于明确偏向 I/O 密集型进程，从而提供良好的进程响应时间。Linux 旨在提供良好的交互响应和桌面性能，优化了进程响应（低延迟），因此倾向于\
  \ I/O 密集型进程而非处理器密集型进程。正如我们将看到的，这是通过一种创造方式实现的，并没有忽视处理器密集型进程。\n\n#### 进程优先级 (Process\
  \ Priority)\n\n一种常见的调度算法类型是`基于优先级`的调度。目标是根据进程的价值和对处理器时间的需求进行排序。基本思想（在 Linux 中并未完全这样实现）是：高优先级的进程在低优先级之前运行，而相同优先级的进程则采用`轮询`调度（一个接一个，循环）。在某些系统中，高优先级的进程还会获得更长片。剩余时间片且优先级最高的可运行进程将始终运行。用户和系统都可以设置进程的优先级以影响系统的调度行为。\n\
  \nLinux 内核实现了两个独立的优先级范围。第一个是 `nice` 值，一个从 –20 到 +19 的数字，默认值为 0。较大的 nice 值对应较低的优先级——你正在对系统上的其他进程表现“友好”（nice）。与高\
  \ nice 值（低优先级）的进程相比，低 nice 值（高优先级）的进程获得更大比例的系统处理器资源。Nice 值是所有 Unix 系统使用的标准优先级范围，尽管不同的\
  \ Unix 系统以不同的方式应用它们，反映了它们各自的调度算法。在其他基于 Unix 的系统（如 Mac OS X）中，nice 值是对分配给进程的`绝对`（absolute）时间的控制；在\
  \ Linux 中，它是对时间片`比例`（proportion）的控制。你可以使用命令 `ps -el` 查看系统上的进程列表及其相应的 nice 值（在标记为\
  \ `NI` 的列下）。\n\n第二个范围是`实时优先级`（real-time priority）。这些值是可以配置的，但默认范围从 0 到 99（包含边界）。与\
  \ nice 值相反，更高的实时优先级值对应更高的优先级。所有实时进程的优先级都高于普通进程；也就是说，实时优先级和 nice 值处于不相交的值空间中。Linux\
  \ 按照相关的 Unix 标准（特别是 POSIX.1b）实现了实时优先级。所有现代 Unix 系统都实现了类似的方案。你可以使用命令查看系统上的进程列表及其相应的实时优先级（在标记为\
  \ `RTPRIO` 的列下）：\n\n```\nps -eo state,uid,pid,ppid,rtprio,time,comm\n```\n\n值为“-”表示该进程不是实时的。\n\
  \n#### 时间片 (Timeslice)\n\n时间片是代表任务在被抢占之前可以运行多久的数值。调度策略必须规定一个默认时间片，这并不是一项简单的任务。时间片过长会导致系统交互性能变差；系统不再感觉应用程序是并发执行的。时间片过短会导致大量的处理器时间浪费在进程切换的开销上，因为系统时间花从一个短时间片进程切换到下一个。此外，I/O\
  \ 密集型与处理器密集型进程之间的冲突目标再次出现：I/O 密集型进程不需要长时间片（尽管它们喜欢频繁运行），而处理器密集型进程渴望长时间片（以保持缓存热度）。\n\
  \n*在其他系统中，timeslice 有时被称为 quantum 或 processor slice。Linux 将其称为 timeslice，因此你也应该这样称呼它。*\n\
  \n\n\n\n根据这一论点，似乎任何较长的时间片都会导致糟糕的交互性能。在许多操作系统中，人们都记住了这一点，因此默认时间片设置得很短——例如 10 毫秒。然而，Linux\
  \ 的 `CFS` 调度器并不直接为进程分配时间片。相反，`CFS` 采用了一种新颖的方法，为进程分配处理器的比例。因此，在 Linux 上，进程接收的处理器时间量是系统负载的函数。这种分配的比例进一步受到每个进程\
  \ `nice` 取值的影响。`nice` 值充当权重，改变每个进程接收的处理器时间比例。`nice` 值较高（优先级较低）的进程获得收缩权重，使其获得较小比例的处理器；`nice`\
  \ 值较低（优先级较高）的进程获得扩张权重，使其获得更大比例的处理器。\n\n如前所述，Linux 操作系统是抢占式的。当一个进程进入可运行状态时，它就有了运行资格。在大多数操作系统中，进程是否立即运行并抢占当前运行的进程取决于进程的优先级和可用时间片。在\
  \ Linux 中，在新的 `CFS` 调度器下，这一决策取决于新可运行进程消耗了多少比例的处理器。如果它消耗的处理器比例小于当前执行的进程，它就会立即运行，抢占当前进程。如果不是，它将被调度在稍后运行。\n\
  \n## 调度策略的实例\n\n考虑一个有两个可运行任务的系统：一个文本编辑器和一个视频编码器。文本编辑器是 I/O 密集型的，因为它几乎花费所有时间在等待用户按键。（无论用户打字有多快，它并没那么快。）尽管如此，当文本编辑器确实接收到按键时，用户期望编辑器能立即响应。相反，视频编码器是\
  \ CPU 密集型的。除了从磁盘读取原始数据流并在随后写入生成的视频外，编码器所有时间都花在对原始数据应用视频解码器上，能够轻松消耗 100% 的处理器。视频编码器对运行时间没有强性的的时间限制——如果它现在开始运行或在半秒后开始，用户都察觉不到且不在意。当然，越早完成越好，但延迟不是要考虑的问题。\n\
  \n在这种情况下，理想情况下，调度器会给文本编辑器分配比视频编码器更大比例的可用处理器，因为文本编辑器是交互性的。我们对文本编辑器有两个目标：首先，我们希望它有大量的可用处理器时间；这并不是因为它需要很多处理器（它并不需要），而是因为我们希望它在需要时总有可用的处理器时间。其次，我们希望文本编辑器在醒来的一刻（例如，当用户按键时）抢占视频编码器。这可以确保文本编辑器具有良好的交互性能并对用户输入做出响应。在大多数操作系统中，这些目标（如果实现了话）是通过给文本编辑器分配比视频编码器更高的优先级更大的时间片来实现的。高级操作系统通过检测文本编辑器是交互性的自动做到这一点。Linux\
  \ 也实现了这些目标，但通过不同的手段。它不是为文本编辑器分配特定的优先级和时间片，而是保证文本编辑器拥有特定比例的处理器。如果视频编码器和文本编辑器是唯一的运行进程，且都处于相同的\
  \ `nice` 级别，那么这个比例将是 50%——每个都将保证一半的处理器时间。由于文本编辑器大部分时间都处于阻塞状态，等待用户按键，它使用的处理器远远低于\
  \ 50%。相反，视频编码器可以自由使用超过其分配的 50%，使其能够快速完成编码。\n\n关键概念是文本编辑器醒来时发生了什么。我们的首要目标是确保它在用户输入后立即运行。在这种情况下，当编辑器醒来时，`CFS`\
  \ 注意到它被分配了 50% 的处理器，但使用的少得多。具体来说，`CFS` 确定文本编辑器运行的时间比视频编码器短。在尝试给所有进程公平的处理器份额的情况下，它抢占视频编码器并允许文本编辑器运行。文本编辑器运行，快速处理用户的按键，然后再次睡眠等待更多输入。由于文本编辑器没有消耗其分配的\
  \ 50%，我们继续这种方式，即 `CFS` 始终在文本编辑器需要时允许运行，而让视频编码器在其余时间内运行。\n\n## Linux 调度算法\n\n在之前的章节中，我们抽象地讨论了进程调度，仅偶尔提到\
  \ Linux 如何将给定的概念应用于现实。现在调度的基础已经建立，我们可以深入研究 Linux 的进程调度器了。\n\n### 调度器类\n\nLinux 调度器是模块化的，允许使用不同的算法调度不同类型的进程。这种模块化被称为调度器类（Scheduler\
  \ classes）。调度器类允许不同的、可插拔的算法共存并调度各自类型的进程。每个调度器类都有一个优先级。定义在 `kernel/sched.c` 中的基础调度器代码按优先级顺序遍历每个调度器类。具有可运行进程的优先级最高的调度器类胜出，决定下一个运行的进程。\n\
  \n完全公平调度器（`CFS`）是用于普通进程的注册调度器类，在 Linux 中称为 `SCHED_NORMAL`（在 POSIX 中称为 `SCHED_OTHER`）。`CFS`\
  \ 定义在 `kernel/sched_fair.c` 中。本部分的其余内容讨论了 `CFS` 算法，适用于自 2.6.23 以来的任何 Linux 内核。我们将在后面的章节讨论实时进程的调度器类。\n\
  \n### Unix 系统中的进程调度\n\n为了讨论公平调度，我们必须描述传统的 Unix 系统如何调度进程。如上一节所述，现代进程调度器有两个共同概念：进程优先级和时间片。时间片是进程运行持续的时间；进程从某些默认时间片开始。优先级较高的进程运行得更频繁，并且（在许多系统中）获得更大的时间片。在\
  \ Unix 上，优先级以 `nice` 值的形式导出到用户空间。这听起来很简单，但在实践中它会导致几个病态问题，我们现在将进行讨论。\n\n\n\n首先，将\
  \ nice 值映射到时间切片（timeslices）需要决定为每个 nice 值 分配多少绝对时间切片。这导致了次优的切换行为。例如，假设我们为默认 nice\
  \ 值（零）的进程分配 100 毫秒的时间切片，并为具有最高 nice 值（`+20`，最低优先级）的进程分配 5 毫秒的时间切片。此外，假设这些进程中每种都有可运行的。因此，我们的默认优先级进程获得了\
  \ 20/21（105 毫秒中的 100 毫秒）的 CPU，而我们的低优先级进程仅获得了 1/[21]（105 毫秒中的 5 毫秒）的 CPU。我们可以在这个示例中使用任何数字，但由于我们选择了这种分配，就假设这种分配是最优的。现在，如果恰好运行两个低优先级进程会发生什么？我们预计它们每个都会获得\
  \ 50% 的 CPU，事实也如此。但它们每次只运行 5 毫秒（在每个 10 毫秒中各占 5 毫秒）！这意味着，我们现在不是每 105 毫秒切换两次，而是每 10\
  \ 毫秒切换两次。相反，如果我们有两个普通优先级的进程，每个进程再次获得了正确的 50% CPU，但是以 100 毫秒为增量的单位。这两种时间切片分配并不一定是理想的；它们仅仅是特定的\
  \ nice 值到时间切片映射结合特定可运行进程优先级混合的产物。事实上，考虑到高 nice 值（低优先级）进程倾向于后台、CPU 密集型任务，而普通优先级进程倾向于前景用户任务，这种时间切片分配恰恰与理想情况完全相反！\n\
  \n第二个问题涉及相对 nice 值以及同样的 nice 值到时间切片的映射。假设我们有两个进程，每个进程之间只差一个 nice 值。首先，假设它们的 nice\
  \ 值分别为 `0` 和 `1`。这可能会映射（在 `O(1)` 调度器中确实是这样）到分别为 100 毫秒和 95 毫秒的时间切片。这两个值几乎相同，因此这里单个\
  \ nice 值带来的差异很小。现在，假设我们的两个进程的 nice 值分别为 18 和 19。这现在分别映射到 10 毫秒和 5 毫秒的时间切片——前者获得的\
  \ CPU 时间是后者的倍！因为 nice 值通常以相对方式使用（因为系统调用接受的是增量而非绝对值），这种行为意味着“将一个进程降低一个 nice 值”的效果取决于起始\
  \ nice 值，且差异巨大。\n\n第三，如果执行 nice 值到时间切片的映射，我们需要分配绝对时间切片的能力。这个绝对值必须以内核可以测量的单位来衡量。在大多数操作系统中，这意味着时间切片必须是定时器滴答（timer\
  \ tick）的整数倍数。（参见第 11 章，“定时器与时间管理”，关于时间的讨论）。这引入了几个问题。首先，最小时间切片的下限是定时器滴答的周期，这可能高达\
  \ 10 毫秒或低至 1 毫秒。其次，系统定时器限制了两个时间切片之间的差异；连续的 nice 值映射切片间隔可能高达 10 毫秒或低至 1 毫秒。最后，时间切片会随着不同的定时器滴答而变化。（如果这一段对定时器滴答的讨论很陌生，请在阅读第\
  \ 11 章后重读）。这只是 CFS 的动机之一。）\n\n第四也是最后一个问题，关于在旨在优化交互式任务的优先级调度器中处理进程唤醒。在这样的系统中，你可能希望通过允许新唤醒的任务立即运行来给予它们优先级提速，即使它们的时间切片已经过期。尽管这在许多（如果不是大多数）情况下改进了交互性能，但它也为病态情况打开了大门，某些睡眠/唤醒用例可能会利用调度器，以系统其他部分为代价为某个进程提供不公平的\
  \ CPU 时间。\n\n这些大多数问题可以通过对旧式的 Unix 调度器进行重大但非范式性的改变来解决。例如，将 nice 值设为几何级而非加法级解决了第二个问题。而使用与定时器滴答耦的测量值将\
  \ nice 值映射到时间切片解决了第三个问题。但这些解决方案掩盖了真正的问题，即分配绝对时间切片会产生恒定的切换率但可变的公平性。CFS 采用的方法是对时间切片分配的一种（对于进程调度器而言的）彻底重新思考：完全取消时间切片，并为每个进程分配比例的\
  \ CPU。因此，CFS 产生了恒定的公平性但可变的切换率。\n\n## 公平调度\n\nCFS 基于一个简单的概念：将进程调度建模为系统拥有一个理想的、完美多任务的处理器。在这样的系统中，每个进程将获得\
  \ CPU 时间的 `1/n`，其中 `n` 是可运行进程的数量，我们将以无限小的持续时间对它们进行调度，以便在任何可衡量的时期内，我们都运行所有 `n` 个进程相同的时间。例如，假设我们有两个进程。在标准的\
  \ Unix 模型中，我们可能会运行一个进程 5 毫秒，然后运行另一个进程 5 毫秒。在运行期间，每个进程都会获得 100% 的 CPU。在理想的、完美多任务处理器中，我们将同时运行两个进程\
  \ 10 毫秒，每个进程占用 50% 的功率。后一种模型被称为完美多任务。\n\n当然，这种模型也是不切实际的，因为在单处理器上无法字面上地同时运行多个进程。此外，以无限小的持续时间运行进程是不高效的。也就是说，抢占一个进程以运行另一个进程是有切换成本的：例如，交换一个进程与另一个进程的开销以及对缓存的影响。因此，尽管我们希望以极短的时间运行进程，但\
  \ CFS 注意到了这样做的开销和性能损失。相反，CFS 将以轮询运行每个进程一段时间，下一次选择运行时间最少的进程。CFS 不是为每个进程分配时间切片，而是根据可运行进程总数量的函数来计算进程应该运行多久。CFS\
  \ 不是使用 nice 值来计算时间切片，而是使用 nice 值来加权进程应获得的 CPU 比例：高 nice 值（低优先级）进程相对于默认 nice 值获得分数权重，而低\
  \ nice 值（高优先级）进程获得更大的权重。\n\n然后，每个进程按照其权重相对于所有运行线程总权重的比例运行“时间切片”。为了计算实际的时间切片，CFS\
  \ 为其对完美多任务中“无限小”调度时间的近似设置了一个目标。这个目标被称为目标延迟（targeted latency）。较小的目标可以产生更好的交互性和更接近完美多任务，代价是更高的切换成本以及更差的吞吐量。假设目标延迟为\
  \ 20 毫秒，并且有两个相同优先级的可运行任务。无论这些任务的优先级如何，它们每个都会运行 10 毫秒后抢占给另一个。如果我们有四个相同优先级的任务，每个运行\
  \ 5 毫秒。如果有 20 个任务，每个运行 1 毫秒。\n\n\n\n\n请注意，随着可运行任务数量趋于无穷大，分配给处理器的比例和分配的时间片将趋于零。由于这最终会导致不可接受的上下文切换成本，CFS\
  \ 为每个进程分配的时间片设置了一个底部。这个底部被称为 `minimum granularity`（最小粒度）。默认值为 1 毫秒。因此，即使可运行进程的数量趋于无穷大，每个进程至少也会运行\
  \ 1 毫秒，以确保产生的切换成本有一个上限。（敏锐的读者会注意到，当进程数量增长到足以使得计算出的比例被最小粒度限制在底部时，CFS 就不再完全公平。事实确实如此。尽管存在对公平队列的改进以提高这种公平性，但\
  \ CFS 的设计初衷就是为了进行这种权衡。在只有少数可运行进程的常见情况下，CFS 是完全公平的。）\n\n现在，让我们再次考虑两个可运行进程的情况，但它们的\
  \ nice 值不同——例如，一个具有默认 nice 值（0），另一个的 nice 值为 5。这些 nice 值具有不同的权重，因此我们的两个进程接收到的处理器时间比例不同。在这种情况下，权重计算导致\
  \ nice-5 进程承担了约 1/3 的惩罚。如果我们的目标延迟仍然 20 毫秒，我们的两个进程将分别获得 15 毫秒和 5 毫秒的处理器时间。假设这两个可运行进程的\
  \ nice 值改为 10 和 15。分配的时间片将会是多少？同样是各 15 和 5 毫秒！绝对 nice 值不再影响调度决策；只有相对值会影响分配的处理器时间比例。\n\
  \n通而言之，任何进程接收到的处理器时间比例仅由它与其他可运行进程之间 nice 值的相对差异决定。nice 值产生的不是时间片的加法增加，而是几何级数差异。分配给任何\
  \ nice 值的绝对时间片并不是一个绝对数值，而是处理器的一个给定比例。CFS 被称为 `fair scheduler`（公平调度器），因为它给每个进程提供处理器时间的一个公平份额——即一个比例。正如前面提到的，请注意\
  \ CFS 并非完全公平，因为它只近似了完美的多任务处理，但它*可以*为 `n` 个可运行进程的不公平性设置一个为 `n` 的延迟下界。\n\n# Linux\
  \ 调度实现\n\n在讨论了 CFS 背后的动机和逻辑之后，我们现在可以探索 CFS 的实际实现，它位于 `kernel/sched_fair.c` 中。具体而言，我们将讨论\
  \ CFS 的四个组成部分：\n\n- 时间统计\n- 进程选择\n- 调度器入口点\n- 睡眠与唤醒\n\n## 时间统计\n\n所有进程调度器都必须统计进程运行的时间。正如之前过的，大多数\
  \ Unix 系统通过为每个进程分配一个时间片来实现这一点。在系统时钟的每次滴答（tick）期间，时间片根据滴答周期（tick period）减少。当时间片达到零时，该进程会被抢占，让另一个具有非零时间片的可运行进程运行。\n\
  \n### 调度实体结构 (Scheduler Entity Structure)\n\nCFS 没有时间片的概念，但它仍然必须统计每个进程运行的时间，因为它需要确保每个进程只运行其应得的公平份额。CFS\
  \ 使用定义在 `<linux/sched.h>` 中的`scheduler entity structure`——`struct sched_entity`\
  \ 来跟踪进程统计：\n\n![image](img/p0050-01.jpg)\n\n调度实体结构嵌入在进程描述符（process descriptor）——`struct\
  \ task_stuct` 中，作为一个名为 `se` 的成员变量。我们在第 3 章“进程管理”中讨论过进程描述符。\n\n### 虚拟运行时间 (Virtual\
  \ Runtime)\n\n`vruntime` 变量存储进程的 `virtual runtime`（虚拟运行时间），这是根据可运行进程的数量归一化（或加权）后的实际运行时（运行的时间）。虚拟运行时间的单位是纳秒，因此\
  \ `vruntime` 与定时器滴答解耦。虚拟运行时间用于帮助我们近似 CFS 正在建模的“理想多任务处理器”。有了这样一个理想处理器，我们就不需要 `vruntime`，因为所有可运行进程都会完美地进行多任务处理。也就是说，在理想处理器上，所有相同优先级进程的虚拟运行时间是相同的——所有任务都将获得相等、公平的处理器份额。由于处理器无法实现完美的多任务处理且我们必须顺序运行每个进程，因此\
  \ CFS 使用 `vruntime` 来计算进程运行了多久，从而决定它应该运行多久。\n\n定义在 `kernel/sched_fair.c` 中的函数 `update_curr()`\
  \ 管理着这种统计：\n\n```\n![image](img/p0051-01.jpg)\n```\n\n`update_curr()` 计算当前进程的执行时间并将其存储在\
  \ `delta_exec` 中。它将该值传递给 `update_curr()`，后者根据可运行进程进行加权。当前进程的 `vruntime` 随后增加：\n\n\
  ```\n![image](img/p0052-01.jpg)\n```\n\n`update_curr()` 由系统定时器定期调用，并在进程变为可运行或阻塞时调用。通过这种方式，`vruntime`\
  \ 是给定进程运行时间的准确衡量，也是下一个应该运行进程的指标。\n\n## 进程选择 (Process Selection)\n\n在上一节中，我们讨论了在理想的多任务处理器上\
  \ `vruntime` 是相同的。在现实中，我们无法完美多任务，因此 CFS 尝试通过一个简单的规则来平衡运行时间：当 CFS 决定运行哪个进程时，它选择 `vruntime`\
  \ 最小的进程。这实际上就是 CFS 调度算法的核心：选择 `vruntime` 最小的任务。仅此而已！本小节其余描述了如何实现 `vruntime` 最小进程的选择。\n\
  \nCFS 使用红黑树来管理可运行进程列表并高效地找到 `vruntime` 最小的进程。红黑树在 Linux 中称为 `rbtree`，是一种`自平衡二搜索树`。我们在第\
  \ 6 章中泛指了自平衡二搜索树，特别讨论了红黑树。目前，如果不熟悉，只需要知道红黑树是通过特定 `key` 标识任意数据的数据结构，并且能够高效搜索指定的 `key`。（具体而言，根据给定\
  \ key 获取节点的时间复杂度是树中节点数的对数。）\n\n### 选择下一个任务\n\n让我们假设我们有一个系统中所有可运行进程的红黑树，每个节点的键是可运行进程的虚拟运行时间。稍后我们将查看如何构建该树，但现在假设我们已经有了它。给定该树，CFS\
  \ 想要运行的下一个进程（即 `vruntime` 最小的进程）是树中最左的节点。也就是说，如果你从根节点通过左子节点一直向下移动，直到到达叶子节点，你就找到了\
  \ `vruntime` 最小的进程。（再次，如果不熟悉二搜索树，请担心。只需知道这个过程是高效的即可。）因此，CFS 的进程选择算法总结为“运行 rbtree\
  \ 中最左节点代表的进程”。执行此选择的函数是 `__pick_next_entity()`，定义在 `kernel/sched_fair.c` 中：\n\n\
  ```\n![image](img/p0053-01.jpg)\n```\n\n\n\n注意 `__pick_next_entity()` 并没有真正遍历树来寻找最左节点，因为该值已经由\
  \ `rb_leftmost` 缓存。虽然遍历树寻找最左节点是高效的——时间复杂度为 `O(height of tree)`，对于平衡树的 `N` 个节点为 `O(log\
  \ N)`——但缓存最左节点要简单得多。该函数的是 CFS 下次运行的进程。如果函数返回 `NULL`，则表示没有最左节点，因此树中没有节点。在这种情况下，没有可运行的进程，CFS\
  \ 会调度空闲任务（idle task）。\n\n### 向树添加进程\n\n现在让我们来看 CFS 如何将进程添加到红黑树（rbtree）并缓存最左节点。这通常发生在进程变为可运行（唤醒）或通过\
  \ `fork()` 首次创建时，正如第 3 章 所示。向树中添加进程是由 `enqueue_entity()` 完成的：\n\n![image](img/p0054-01.jpg)\n\
  \n该函数更新运行时间和和其他统计数据，然后调用 `__enqueue_entity()` 执行将条目插入红黑树的实际工作：\n\n![image](img/p0054-02.jpg)\n\
  \n![image](img/p0055-01.jpg)\n\n让我们来看这个函数。`while()` 循环体遍历树以寻找匹配的键，该键即被插入进程的 `vruntime`。根据平衡树的规则，如果键小于当前节点的键，则向左孩子移动；如果键较大，则向右孩子移动。如果它向右移动过（即使只有一次），它就知道插入的进程不可能是新的最左节点，并将\
  \ `leftmost` 设置为 0。如果它只向左移动，`leftmost` 保持为 1，我们就有了一个新的最左节点，并通过将 `rb_leftmost` 设置为插入的进程来更新缓存。当我们与在移动方向上没有子节点的节点比较时，循环终止；此时\
  \ `link` 为 `NULL` 且循环结束。退出循环后，函数在父节点上调用 `rb_link_node()`，使插入的进程成为新子节点。`rb_insert_color()`\
  \ 函数更新树的自平衡属性；我们在第 6 章中讨论颜色逻辑。\n\n### 从树中移除进程\n\n最后，让我们来看 CFS 如何从红黑树中移除进程。这发生在进程阻塞（变为不可运行）或终止（停止存在）时：\n\
  \n![image](img/p0056-01.jpg)\n\n与向红黑树添加进程一样，实际工作是由辅助函数 `__dequeue_entity()` 完成的：\n\
  \n![image](img/p0056-02.jpg)\n\n从树中移除进程要简单得多，因为 rbtree 的实现提供了执行所有工作的 `rb_erase()`\
  \ 函数。该函数的其余部分更新 `rb_leftmost` 缓存。如果要移除的进程是最左节点，该函数会调用 `rb_next()` 来寻找中序遍历中的下一个节点。当当前最左节点被移除时，这将成为新的最左节点。\n\
  \n### 调度器入口\n\n进程调度的主入口点是 `schedule()` 函数，它定义在 `kernel/sched.c` 中。内核的其他部分使用此函数来调用进程调度器，决定运行哪个进程并执行它。`schedule()`\
  \ 对于调度调度器类是通用的。也就是说，它找到具有可运行进程的优先级最高的调度器类，并询问它下一个运行什么。鉴于此，`schedule()` 的简单并不令人意外。该函数唯一重要的部分（其他部分太无趣，不在此赘述）是它对\
  \ `pick_next_task()` 的调用，该函数也定义在 `kernel/sched.c` 中。`pick_next_task()` 函数遍历每个调度器类（从优先级最高的类开始），并在优先级最高的类中选择优先级最高的进程：\n\
  \n![image](img/p0057-01.jpg)\n\n注意函数开头的优化。由于 CFS 是普通进程的调度器类，而大多数系统运行的都是普通进程，因此这里有一个小小的黑科技（hack）：如果可运行进程的数量等于\
  \ CFS 提供的可运行进程数量（这表明所有可运行进程都由 CFS 提供），则快速选择下一个 CFS 提供的进程。\n\n该函数的核心是 `for()` 循环，它按优先级顺序遍历每个类，从优先级最高的类开始。每个类都实现了\
  \ `pick_next_task()` 函数，该函数返回其下一个可运行进程的指针，如果没有则返回 `NULL`。第一个返回非 `NULL` 值的类已经选择了下一个可运行进程。CFS\
  \ 对 `pick_next_task()` 的实现调用了 `pick_next_entity()`，进而调用了我们在上一节讨论过的 `__pick_next_entity()`\
  \ 函数。\n\n### 睡眠与唤醒\n\n处于睡眠（阻塞）的任务处于一种特殊的不可运行状态。这非常重要，因为如果没有这种特殊状态，调度器将选择那些不想运行的任务，或者更糟糕，睡眠将不得不实现为忙等待（busy\
  \ looping）。任务睡眠有多种原因，但总是在它等待某些事件时。该事件可以是指定的时间、来自文件 I/O 的更多数据，或另一个硬件事件。任务在尝试获取受竞争的信号量时也会非自愿进入睡眠（这在第\
  \ 9 章“内核同步简介”中有所介绍）。例如，任务对文件发出了 `read()` 请求，需要从磁盘读取。另一个例子是，任务可能等待键盘输入。无论何种情况，内核的行为都是相同的：任务标记自己为睡眠，将自己放入等待队列，从红黑树中移除，并调用\
  \ `schedule()` 选择一个新进程。唤醒则是相反的：任务被设置为可运行，从等待队列中移除，并重新加入红黑树。\n\n如上一章所述，睡眠与两种状态相关：`TASK_INTERRUPTIBLE`\
  \ 和 `TASK_UNRUPTIBLE`。它们的区别在于 `TASK_UNRUPTIBLE` 状态的任务会忽略信号，而 `TASK_INTERRUPTIBLE`\
  \ 状态的任务在收到信号时会提前唤醒并响应。这两类睡眠任务都位于等待队列上，等待事件发生，且均不可运行。\n\n#### 等待队列\n\n睡眠通过等待队列处理。等待队列是等待事件发生的进程简单列表。等待队列在内核中由\
  \ `wait_queue_head_t` 表示。等待队列通过 `DECLARE_WAITQUEUE()` 静态创建，或通过 `init_waitqueue_head()`\
  \ 动态创建。进程将进入等待队列并标记为不可运行。当与之相关的事件发生时，队列上的进程会被唤醒。\n\n以前广泛使用简单的睡眠接口。但这些接口存在竞态条件：可能在条件成立后进入睡眠。在这种情况下，任务可能会无限睡眠。因此，内核中推荐的睡眠方法稍微复杂：\n\
  \n![image](img/p0059-01.jpg)\n\n任务执行以下步骤将自己添加到等待队列：\n\n1. 通过宏 `DEFINE_WAIT()` 创建一个等待队列项。\n\
  2. 通过 `add_wait_queue()` 将自己添加到等待队列。当等待条件满足时，该等待队列会唤醒进程。当然，其他地方需要有代码在事件实际发生时调用队列的\
  \ `wake_up()`。\n3. 调用 `prepare_to_wait()` 将进程状态改为 `TASK_INTERRUPTIBLE` 或 `TASK_UNRUPTIBLE`。该函数在需要时也会任务重新加入等待队列，这在循环的后续迭代中是必要的。\n\
  \n\n\n\n4. 如果状态被设置为 `TASK_INTERRUPTIBLE`，信号会唤醒进程。这被称为*虚假唤醒*（spurious wake up，并非由事件发生引起的唤醒）。因此，需要检查并处理信号。\n\
  \n5. 当任务唤醒时，它会再次检查条件是否成立。如果是，则退出循环。否则，它会再次调用 `schedule()` 并循环。\n\n6. 现在既然条件为真，任务将自身的状态设置为\
  \ `TASK_RUNNING`，并通过 `finish_wait()` 从等待队列中移除。\n\n如果条件在任务进入睡眠之前已经发生，循环将终止，任务就不会错误地进入睡眠。请注意，内核代码通常需要在循环体中执行各种其他任务。例如，它可能需要在调用\
  \ `schedule()` 之前释放锁，并在调用后重新获取锁，或者对其他事件做出响应。\n\n`fs/notify/inotify/inotify_user.c`\
  \ 中的 `inotify_read()` 函数负责处理从 inotify 文件描述符的读取，它是使用等待队列的一个简单示例：\n\n![image](img/p0060-01.jpg)\n\
  \n![image](img/p0060-02.jpg)\n\n该函数遵循我们示例中列出的模式。主要区别在于它在 `while()` 循环体内检查条件，而不是在\
  \ `while()` 语句本身中。这是因为检查条件是复杂的，需要获取锁。循环通过 `break` 终止。\n\n### 唤醒\n\n唤醒通过 `wake_up()`\
  \ 处理，该函数会唤醒所有在给定等待队列上等待的任务。它会调用 `try_to_wake_up()`，该函数会将任务的状态设置为 `TASK_RUNNING`，调用\
  \ `enqueue_task()` 将任务添加到红黑树，如果唤醒任务的优先级高于当前任务的优先级，则设置 `need_resched`。导致事件发生的代码通常会自己调用\
  \ `wake_up()`。例如，当数据从硬盘到达时，VFS 在持有等待数据进程的等待队列上调用 `wake_up()`。\n\n关于睡眠的一个重要注意是存在虚假唤醒。仅仅因为任务被唤醒，并不意味着任务正在等待的事件已经发生；睡眠应该始终在循环中处理，以确保任务正在等待的条件确实已经发生。图\
  \ 4.1 展示了每个调度器状态之间的关系。\n\n图 4.1 睡眠与唤醒。\n\n![image](img/04fig01.jpg)\n\n### 抢占与上下文切换\n\
  \n上下文切换（从一个可运行任务切换到另一个任务）是由定义在 `kernel/sched.c` 中的 `context_switch()` 函数处理的。当选择新进程运行时，`schedule()`\
  \ 会调用它。它执行两个基本工作：\n\n- 调用 `switch_mm()`（声明在 `<asm/mmu_context.h>` 中），将虚拟内存映射从上一个进程切换到新进程。\n\
  - 调用 `switch_to()`（声明在 `<asm/system.h>` 中），将处理器状态从上一个进程切换到当前进程。这涉及保存和恢复栈信息、处理器寄存器以及任何必须按进程进行管理和恢复的其他体系特定状态。\n\
  \n然而，内核必须知道何时调用 `schedule()`。如果内核只在代码显式调用时才执行 `schedule()`，用户空间程序将无限运行。相反，内核提供了\
  \ `need_resched` 标志来指示是否应该执行重新调度（参见 表 4.1）。该标志在进程应该被抢占时由 `scheduler_tick()` 设置，当一个比当前运行进程优先级更高的进程被唤醒时由\
  \ `try_to_wake_up()` 设置。内核检查该标志，发现它被设置，然后调用 `schedule()` 切换到新进程。该标志是给内核的消息，表示应该尽快调用调度器，因为另一个进程值得运行。\n\
  \n表 4.1 用于访问和操作 `need_resched` 的函数\n\n![image](img/t0062-01.jpg)\n\n在返回用户空间或从中断返回时，会检查\
  \ `need_resched` 标志。如果它被设置，内核会在继续执行之前调用调度器。\n\n该标志是每个进程对应的，而不仅仅是全局的，因为访问进程描述符中的一个值（由于\
  \ `current` 的速度且其极有可能是缓存热的）比访问全局变量要快。在历史上，在 2.2 内核之前，该标志是全局的。在 2.2 和 2.4 中，该标志是\
  \ `task_struct` 内部的一个 `int`。在 2.6 中，它被移动到 `thread_info` 结构内部一个特殊标志变量的位位。\n\n####\
  \ 用户抢占\n\n当内核准备返回用户空间、`need_resched` 被设置并调用调度器时，会发生用户抢占。当内核返回用户空间时，它知道自己处于安全的静止状态。换句话说，如果继续执行当前任务是安全的，那么选择新任务执行也是安全的。因此，每当内核准备从中断返回或在系统调用后返回用户空间时，都会检查\
  \ `need_resched` 的值。\n\n简而言之，用户抢占可能发生在：\n- 从中断返回用户空间时\n- 从系统调用返回用户空间时\n\n#### 内核抢占\n\
  \nLinux 内核与大多数 Unix 变体和其他操作系统不同，它是完全抢占的。在非抢占内核中，内核代码一直运行直到结束（返回用户空间）或显式阻塞。但在 2.6\
  \ 中，Linux 内核变为可抢占：只要不持有锁，就可以在任何点抢占。何时可以重新调度？支持内核抢占的第一项变化是在每个进程的 `thread_info` 中添加了抢占计数器\
  \ `preempt_count`。该计数器从零开始，每获取锁加一，每释放锁减一。当计数器为零时，内核是可以抢占的。从中断返回时，如果返回内核空间，内核检查 `need_resched`\
  \ 和 `preempt_count` 的值。如果 `need_resched` 被设置且 `preempt_count` 为零，则有一个更重要的任务就绪，抢占是安全的。因此，调用调度器。如果\
  \ `preempt_count` 不为零，说明持有锁，重新调度是不安全的。在这种情况下，中断照常返回到当前执行的任务。当当前任务持的所有锁被释放时，`preempt_count`\
  \ 返回零。此时，解锁代码会检查 `need_resched` 是否被设置。如果是，则调用调度器。内核代码有时需要启用和禁用内核抢占，将在第 9 章](#ch09.html)\
  \ 中讨论。\n\n内核抢占也可以显式发生，即当内核中的任务阻塞或显式调用 `schedule()` 时。这种形式的内核抢占一直受到支持，因为不需要额外的逻辑来确保内核处于安全的抢占状态。假设显式调用\
  \ `schedule()` 的代码知道重新调度是安全的。\n\n\n\n\n\n- 当中断处理程序退出且在返回内核空间之前\n- 当内核代码再次变为可抢占时\n\
  - 如果内核中的任务显式调用了 `schedule()`\n- 如果内核中的任务阻塞（这将导致对 `schedule()` 的调用）\n\n### 实时调度策略\n\
  \nLinux 提供了实时调度策略：`SCHED_FIFO` 和 `SCHED_RR`。普通的非实时调度策略是 `SCHED_NORMAL`。通过`scheduling\
  \ classes`框架，这些实时策略并不是由完全公平调度器（CFS）管理的，而是由一个定义在 `kernel/sched_rt.c` 中的特殊实时调度器管理的。本节其余部分将讨论实时调度策略和算法。\n\
  \n`SCHED_FIFO` 实现了一种没有时间片的简单先入先调度算法。可运行的 `SCHED_FIFO` 任务的优先级始终高于任何 `SCHED_NORMAL`\
  \ 任务。当一个 `SCHED_FIFO` 任务变为可运行时，它将继续运行，直到它阻塞或显式释放处理器；它没有时间片，可以无限运行下去。只有优先级更高的 `SCHED_FIFO`\
  \ 或 `SCHED_RR` 任务才能抢占 `SCHED_FIFO` 任务。两个或多个相同优先级的 `SCHED_FIFO` 任务进行轮询运行，但在它们显式选择释放处理器时也是如此。如果一个\
  \ `SCHED_FIFO` 任务是可运行的，则所有较低优先级的任务在它变为不可运行之前都无法运行。\n\n`SCHED_RR` 与 `SCHED_FIFO`\
  \ 相同，区别在于每个进程只能运行到耗尽预定的时间片为止。也就是说，`SCHED_RR` 是带有时间片的 `SCHED_FIFO`——它是一种实时轮询调度算法。当\
  \ `SCHED_RR` 任务耗尽其时间片时，相同优先级的任何其他实时进程将按轮询方式调度。时间片用于仅允许对同优先级进程进行重新调度。与 `SCHED_FIFO`\
  \ 一样，高优先级进程总是会立即抢占低优先级进程，而低优先级进程永远无法抢占 `SCHED_RR` 任务，即使其时间片已耗尽。\n\n两种实时调度策略都实现了静态优先级。内核不会为实时任务计算动态优先级值。这确保了给定优先级的实时进程`总是`会抢占低优先级的进程。\n\
  \nLinux 中的实时调度策略提供了软实时行为。`soft real time`（软实时）是指内核尝试在时间截止内调度应用程序，但内核并不保证总是能实现这些目标。相反，`hard\
  \ real time`（硬实时）系统保证在某些限制内满足任何调度需求。Linux 不保证调度实时任务的能力。尽管没有保证硬实时行为的设计，但 Linux 的实时调度性能是非常出的。2.6\
  \ Linux 内核能够满足严格的时间要求。\n\n实时优先级的范围从 0 到 `MAX_RT_PRIO` 减 1（包含边界）。默认情况下，`MAX_RT_PRIO`\
  \ 为 100——因此，默认的实时优先级范围是 0 到 99。此优先级空间与 `SCHED_NORMAL` 任务的 nice 值共享：它们使用从 `MAX_RT_PRIO`\
  \ 到 (`MAX_RT_PRIO + 40`）的空间。默认情况下，这意味着 -20 到 +19 的 nice 范围直接映射到 100 到 139 的优先级空间。\n\
  \n### 与调度器相关的系统调用\n\nLinux 提供了一系列用于管理调度器参数的系统调用。这些系统调用允许操作进程优先级、调度策略和处理器亲和性，并提供了一个向其他任务\
  \ `yield`（让）处理器的显式机制。\n\n各种书籍以及你熟悉的系统手册（man pages）都提到了这些系统调用（它们都在 C 库中实现，没有多少封装——它们只是调用系统调用）。表\
  \ 4.2 列出了这些系统调用并提供了简要描述。系统调用如何在内核中实现将在第 5 章“系统调用”中讨论。\n\n表 4.2. 与调度器相关的系统调用\n\n\
  ```\n### 与调度器相关的系统调用\n![image](img/t0065-01.jpg)\n```\n\n#### 与调度策略和优先级相关的系统调用\n\
  \n`sched_setscheduler()` 和 `sched_getscheduler()` 系统调用分别设置和获取给定进程的调度策略和实时优先级。它们的实现与大多数系统调用一样，涉及大量的参数检查、设置和清理。然而，重要工作仅仅是读取或写入进程\
  \ `task_struct` 中的 `policy` 和 `rt_priority` 值。\n\n`sched_setparam()` 和 `sched_getparam()`\
  \ 系统调用设置和获取进程的实时优先级。这些调用仅在特殊的 `sched_param` 结构中编码 `rt_priority`。`sched_get_priority_max()`\
  \ 和 `sched_get_priority_min()` 调用分别返回给定调度策略的最大和最小优先级。实时策略的最大优先级为 `MAX_USER_RT_PRIO`\
  \ 减 1；最小为 1。\n\n对于普通任务，`nice()` 函数根据给定的值增加给定进程的静态优先级。只有 root 用户可以提供负值，从而降低 nice\
  \ 值并增加优先级。`nice()` 函数调用内核的 `set_user_nice()` 函数，该函数设置 `task_struct` 中的 `static_prio`\
  \ 和 `prio` 值。\n\n#### 处理器亲和性系统调用\n\nLinux 实现了硬亲和性（hard affinity）。也就是说，尽管它通过尝试将进程保持在同一处理器上提供软亲和性，但调度器允许用户指定“任务必须在这些处理器上运行”。这种硬亲和性以位码的形式存储在\
  \ `task_struct` 的 `cpus_allowed` 中。默认情况下，所有位都已设置，因此进程可以在任何处理器上运行。然而，用户通过 `sched_setaffinity()`\
  \ 可以提供一个或多个位的位码。同样，`sched_getaffinity()` 返回当前的 `cpus_allowed` 位码。\n\n内核以简单的方式强制硬亲和性。首先，当进程最初创建时，它继承父进程的亲和性。由于父进程在允许的处理器上运行，因此子也在允许的处理器上运行。其次，当处理器的亲和性改变时，内核使用迁移线程将其推送到法的处理器。最后，负载均衡器提取任务。因此，进程只会在其进程描述符\
  \ `cpus_allowed` 字段中指定的处理器上运行。\n\n#### 让处理器时间\n\nLinux 提供了 `sched_yield()` 系统调用作为进程显式向其他任务让处理器的机制。它的原理是将进程从活动数组（它当前所在的地方，因为它正在运行）移除并插入过期数组。这样做的效果不仅是抢占进程并放在优先级列表的末尾，还将其放入过期列表——保证它在一段时间内不会运行。由于实时任务永远不会过期，它们是一个特殊情况。因此，它们仅仅被移动到优先级列表的末尾。在早期的\
  \ Linux 版本中，`sched_yield()` 的语义大不相同；最好的情况下只是被移动到优先级列表的末尾。这种让操作通常持续很长时间。现在，应用程序甚至内核代码在调用\
  \ `sched_yield()` 之前应该确定它们确实想要放弃处理器。\n\n内核代码为了方便可以调用 `yield()`，它会确保任务状态为 `TASK_RUNNING`\
  \ 然后调用 `sched_yield()`。用户空间应用程序使用 `sched_yield()` 系统调用。\n\n\n\n\n进程调度器是任何内核的重要部分，因为运行进程（至少对我们大多数人来说）是使用计算机的初衷。然而，权衡进程调度的需求绝非易事：大量的可运行进程、可扩展性考量、延迟与吞吐量之间的权衡，以及各种负载的需求，都使得一种“一刀切”的算法难以实现。然而，Linux\
  \ 内核新的 CFS 进程调度器通过一种新颖且有趣的方法，接近了满足所有方的需求，并为大多数用用例提供了一个具有良好扩展性的优解决方案。\n\n上一章涵盖了进程管理。本章深入探讨了进程调度的背后的理论，以及当前\
  \ Linux 内核使用的特定实现、算法和接口。下一章将介绍内核为运行进程提供的主要接口：系统调用。\n\n# 5. 系统调用\n\n在任何现代操作系统中，内核都提供了一\
  \ set 接口，使得在用户空间运行的进程能够与系统交互。这些接口为应用程序提供了硬件的受控访问、提供了一种创建新进程并与现有进程通信的机制，以及请求其他操作系统资源的能力。接口充当了应用程序与内核之间的信使，应用程序发出各种请求，而内核执行这些请求（或返回错误）。这些接口的存在，以及应用程序无法随心所欲直接操作的事，是提供稳定系统的关键。\n\
  \n## 与内核通信\n\n系统调用在硬件和用户空间进程之间提供了一个层。这一层主要有三个用途。首先，它为用户空间提供了一个抽象的硬件接口。例如，在从文件读取或写入时，应用程序并不关心磁盘类型、介质，甚至是文件所在的文件系统类型。其次，系统调用确保了系统的安全性和稳定性。内核作为系统资源和用户空间之间的中间人，可以根据权限、用户和其他标准仲裁访问。例如，这种仲防止防止应用程序错误地使用硬件、窃取其他进程的资源或对系统造成损害。最后，用户空间与系统其余部分之间的单一通用层允许为进程提供虚拟化系统，这在第\
  \ 3 章“进程管理”中讨论过。如果应用程序可以在内核不知道的情况下自由访问系统资源，那么几乎无法实现多任务和虚拟内存，而且绝无法保证稳定性和安全性。在 Linux\
  \ 中，系统调用是用户空间与内核交互的唯一手段；它们是异常（exceptions）和陷阱（traps）之外进入内核的唯一合法入口。事实上，其他接口（如设备文件或\
  \ `/proc`）最终也是通过系统调用访问的。有趣的是，Linux 实现的系统调用比大多数系统得多^(1) 本章将介绍系统调用在 Linux 中的作用和实现。\n\
  \n^(1) *x86 上大约有 335 个系统调用。（每个架构都允许定义独特的系统调用。）虽然并非所有操作系统都会发布其精确的系统调用，但估计某些操作系统拥有超过数个。在本书的上一个版本中，x86\
  \ 只有 250 个系统调用。*\n\n## API、POSIX 和 C 库\n\n通常，应用程序是针对用户空间实现的应用程序编程接口（API）编写的，而不是直接针对系统调用编写。这很重要，因为应用程序使用的接口与内核提供的实际接口之间不需要存在直接对应。API\
  \ 定义了一组应用程序使用的编程接口。这些接口可以实现为单个系统调用，可以通过多个系统调用实现，也可以在完全不使用系统调用的情况下实现。同一个 API 可以存在于多个系统中，并为应用程序提供相同的接口，而\
  \ API 本身的实现可以在不同系统之间存在巨大差异。参见图 5.1 关于 POSIX API、C 库和系统调用之间关系的示例。\n\n图 5.1. 调用 `printf()`\
  \ 时应用程序、C 库与内核之间的关系。\n\n![image](img/05fig01.jpg)\n\nUnix 世界中常见的应用程序编程接口之一是基于 POSIX\
  \ 标准的。技术上讲，POSIX 由 IEEE^(2)的一系列标准组成，旨在提供一个大致基于 Unix 的可移植操作系统标准。Linux 努力在适用处符合 POSIX\
  \ 和 SUSv3 标准。\n\n^(2) *IEEE (eye-triple-E) 是电气电子工程师学会。它是一个非营利专业协会，涉及许多技术领域，并负责许多重要标准（如\
  \ POSIX）。欲更多信息请访问 [`www.ieee.org`](http://www.ieee.org)。*\n\nPOSIX 是 API 与系统调用之间关系的极佳示例。在大多数\
  \ Unix 系统上，POSIX 定义的 API 调用与系统调用之间有很强的相关性。事实上，POSIX 标准的创建是为了类似于早期 Unix 系统提供的接口。另一方面，一些非常不像\
  \ Unix 风格的系统（例如 Microsoft Windows）提供了兼容 POSIX 的库。\n\nLinux 中的系统调用接口（与大多数 Unix 系统一样）部分由\
  \ C 库提供。C 库实现了 Unix 系统上的主要 API，包括标准 C 库和系统调用接口。C 库被所有 C 程序使用，由于 C 语言的特性，很容易被其他编程语言封装以便在它们的程序中使用。C\
  \ 库还提供了大部分的 POSIX API。\n\n从应用程序程序员的角度来看，系统调用是无关的；程序员只关心的是 API。相反，内核只关心系统调用；库调用和应用程序如何使用系统调用并不是内核关心的事。尽管如此，内核跟踪系统调用的潜在用途并保持系统调用尽可能通用和灵活是非常重要的。\n\
  \n关于 Unix 接口的一条格言（meme）是“提供机制，而不是策略”。换句话说，Unix 系统调用存在是为了在抽象意义上提供特定的功能。该函数如何被使用不是内核的事。\n\
  \n### Syscalls\n\n系统调用（在 Linux 中通常称为 *syscall*）通常通过 C 库中定义的函数调用访问。它们可以定义零、一个或多个参数（输入），并可能产生一个或多个副作用，^(3)例如写入文件或将某些数据拷贝到提供的指针中。系统调用还提供一个\
  \ `long` 返回值(4)表示成功或错误——通常（但并非总是）负返回值表示错误。返回零通常是（再次，并非总是）成功的信号。当系统调用返回错误时，C 库会将特殊的错误代码写入全局变量\
  \ `errno` 中。可以通过 `perror()` 等库函数将该变量转换为人类可读的错误。\n\n^(3) *注意这里的“可能”字。尽管几乎所有的系统调用都有副作用（即导致系统状态发生某些变化），但少数系统调用（如\
  \ `getpid()`）仅仅是从内核返回某些数据。*\n\n\n\n\n使用 `long` 类型是为了兼容 64 位架构。\n\n最后，系统调用具有定义的行为。例如，系统调用\
  \ `getpid()` 被定义为返回一个整数，该整数是当前进程的 PID。该系统调用在内核中的实现非常简单：\n\n```c\nSYSCALL_DEFINE0(getpid)\n\
  {\n    return task_tgid_vnr(current); // 返回 current->tgid\n}\n```\n\n注意，定义并没有说明具体的实现。内核必须提供系统调用预期的行为，但只要结果是正确的，它可以自由地使用任何想要的实现方式。当然，这个系统调用极其简单，没有太多的其他方式可以实现它。\n\
  \n你可能会奇怪，为什么 `getpid()` 返回的是 `tgid`（线程组 ID）？在普通进程中，`TGID` 等于 `PID`。对于线程，同一个线程组内所有线程的\
  \ `TGID` 相同的。这使得线程能够调用 `getpid()` 并获得相同的 `PID`。\n\n`SYSCALL_DEFINE0` 只是一个宏，用于定义一个没有参数的系统调用（因此为\
  \ `0`）。展开后的代码如下：\n\n```c\nasmlinkage long sys_getpid(void)\n```\n\n让我们看看系统调用是如何定义的。首先，注意函数定义上的\
  \ `asmlinkage` 修饰符。这是一个指令，告诉编译器只在栈上查找该函数的参数。这是所有系统调用必须的修饰符。其次，该函数返回一个 `long`。为了\
  \ 32 位和 64 位系统之间的兼容性，在用户空间中定义为返回 `int` 的系统调用，在内核中会返回 `long`。第三，注意 `getpid()` 系统调用在内核中被定义为\
  \ `sys_getpid()`。这是 Linux 中所有系统调用遵循的命名约定：系统调用 `bar()` 在内核中实现为函数 `sys_bar()`。\n\n\
  ### 系统调用号\n\n在 Linux 中，每个系统调用都被分配了一个 `syscall number`（系统调用号）。这是一个用于引用特定系统用的唯一数字。当用户空间进程执行系统调用时，`syscall\
  \ number` 标识执行的是哪一个系统调用；进程不会通过名称来引用系统调用。\n\n`syscall number` 是重要的；一旦分配，就不能更改，否则编译好的应用程序将会崩溃。同样，如果删除了某个系统调用，其系统调用号不能被回收，否则之前编译的代码可能会尝试调用一个系统调用，但实际上调用了另一个。Linux\
  \ 提供了一个名为“未实现”的系统调用 `sys_ni_syscall()`，它除了返回 `-ENOSYS`（对应无效系统调用的错误）外，什么都不做。该函数用于在系统调用被删除或变得不可用的罕见情况下“填补漏洞”。\n\
  \n内核在系统调用表中维护着所有已注册系统调用的列表，存储在 `sys_call_table` 中。该表是与架构相关的；在 x86-64 上，它定义在 `arch/i386/kernel/syscall_64.c`\
  \ 中。该表将每个有效的系统调用分配给一个唯一的 `syscall number`。\n\n### 系统调用性能\n\nLinux 中的系统调用比许多其他操作系统都要快。这部分是因为\
  \ Linux 具有快速的上下文切换时间；进入和退出内核是一个精简且简单的过程。另一个因素是系统调用处理程序以及单个系统调用本身的简单性。\n\n### 系统调用处理器\n\
  \n用户空间应用程序无法直接执行内核代码。它们不能简单地对内核空间存在的方法进行函数调用，因为内核存在于受保护的内存空间中。如果应用程序可以直接读写内核的地址空间，系统的安全性和稳定性将无从谈起。\n\
  \n相反，用户空间应用程序必须以某种方式向内核信号它们想要执行系统调用，并让系统切换到内核模式，在内核模式下，内核代表应用程序在内核空间执行系统调用。\n\n\
  向内核发送信号的机制是软件中断：触发异常，系统将切换到内核模式并执行异常处理程序。在这种情况下，异常处理器实际上是系统调用处理器。x86 上定义的软件中断号是\
  \ 128，通过 `int $0x80` 指令触发。它触发了向内核模式的切换以及异常向量 128 的执行，即系统调用处理器。系统调用处理器是名其实实的函数 `system_call()`。它是依赖架构的；在\
  \ x86-64 上，它以汇编形式实现在 `entry_64.S` 中。最近，x86 处理器增加了名为 `sysenter` 的功能。该功能提供了一种比使用 `int`\
  \ 中断指令更快速、更专门的方法来陷入内核以执行系统调用。内核迅速添加了对该功能的支持。然而，无论系统调用处理器是如何被调用的，重要的概念是，用户空间通过某种方式导致异常或陷阱以进入内核。\n\
  \n以下对系统调用处理器的描述大部分基于 x86 版本。它们都是相似的。\n\n#### 标明正确的系统调用\n\n仅仅进入内核空间是不够的，因为存在多个系统调用，它们都以相同的方式进入内核。因此，必须将系统调用号传递到内核。在\
  \ x86 上，系统调用号通过 `eax` 寄存器传递给内核。在触发进入内核的陷阱之前，用户空间在 `eax` 中放入对应所需的数字。系统调用处理器随后从 `eax`\
  \ 读取该值。其他架构也采取类似的措施。\n\n`system_call()` 函数通过与 `NR_syscalls` 比较来检查系统调用的有效性。如果大于或等于\
  \ `NR_syscalls`，函数返回 `-ENOSYS`。否则，调用指定的系统调用：\n\n```\ncall sys_call_table(%rax,8)\n\
  ```\n\n由于系统调用表中的每个元素都是 64 位（8 字节），内核将系统调用号乘以 4 以得到在系统调用表中的位置。在 x86-32 上，代码类似，将 8\
  \ 替换为 4。见图 5.2。\n\n图 5.2 调用系统调用处理器并执行系统调用。\n\n![image](img/05fig02.jpg)\n\n####\
  \ 参数传递\n\n除了系统调用号外，大多数系统调用都需要向它们传递一个或多个参数。用户空间必须在陷阱期间设法向内核传递参数。实现此最简单的方法是通过传递系统调用号相同的方式：参数存储在寄存器中。在\
  \ x86-32 上，寄存器 `ebx`、`ecx`、`edx`、`esi` 和 `edi` 包含前五个参数。在六个或更多参数的罕情况下，单个寄存器持有所有参数的用户空间指针。\n\
  \n返回值也通过寄存器发送用户空间。在 x86 上，它被写入 `eax` 寄存器。\n\n### 系统调用实现\n\nLinux 系统调用的实际实现不需要考虑系统调用处理器的行为。因此，在\
  \ Linux 中添加新的系统调用是容易的。困难的工作在于设计和实现系统调用；在内核中注册它非常简单。\n\n#### 实现系统调用\n\n实现系统调用的第一步是定义其目的。它将做什么？系统调用应该只有一个目的。在\
  \ Linux 中，多路系统调用（根据标志位参数执行完全不同的系统调用）是不被鼓励的。以 `ioctl()` 作为不应该那样做的例子。\n\n\n\n\n新系统调用的参数、返回值和错误代码是什么？系统调用应该具有清晰、简单的接口，并且参数尽可能少。系统调用的语义和行为至关重要；它们不能改变，因为现有的应用程序将依赖它们。要有前瞻性；考虑函数可能会随着时间的推移而发生变化。是否可以向你的系统调用中添加新功能，还是说任何更改都需要一个全新的函数？你是否可以在不破坏向后兼容性的情况下轻松修复错误？许多系统调用提供一个标志位（flag）参数来解决向前兼容性问题。标志位并不是为了在单个系统调用中复用不同的行为——如前所述，这是不可接受的——而是为了在不破坏向后兼容性或无需添加新系统调用的情况下启用新功能和选项。\n\
  \n面向未来设计接口非常重要。你是否在无谓地限制该功能？将系统调用设计得尽可能通用。不要假设它今天的用途与明天相同。系统调用的 `purpose`（目的）将保持不变，但其\
  \ `uses`（用途）可能会改变。该系统调用具有可移植性吗？不要对架构的字长或字节序做假设。第 19 章“可移植性”讨论了这些问题。确保你没有做出会在未来破坏系统调用的低劣假设。记住\
  \ Unix 的格言：“提供机制，不提供策略。”\n\n当你编写系统调用时，你需要意识到可移植性和健壮性的需求，这不仅是为了现在，更是为了未来。基础的 Unix\
  \ 系统调用通过了时间的考验；它们大多数在今天与 30 年前一样有用且适用！\n\n### 验证参数\n\n系统调用必须仔细地验证其所有参数，以确保它们是有效且合法的。系统调用运行在内核空间（kernel-space），如果用户可以不受限制地将无效输入传递到内核，系统的安全性和稳定性就会受到影响。\n\
  \n例如，文件 I/O 系统调用必须检查文件描述符是否有效。与进程相关的函数必须检查提供的 `PID` 是否有效。每个参数都必须经过检查以确保它不仅是有效合法的，而且是正确的。进程不能请求内核访问其无权访问的资源。\n\
  \n最重要的检查之一是用户提供的任何指针的有效性。想象一下，如果一个进程可以未经检查地将任何指针（带有所有缺陷）传递给内核，甚至传递一个它没有读取权限的指针！进程就可以欺骗内核去复制它们没有访问权限的数据，例如属于另一个进程的数据或被映射为不可读的数据。在跟随指针进入用户空间之前，系统必须确保：\n\
  \n* 指针指向用户空间中的某个内存区域。进程不能欺骗内核代表它们读取内核空间的数据。\n* 指针指向进程地址空间中的某个内存区域。进程不能欺骗内核读取他人的数据。\n\
  * 如果是读取，内存被标记为可读；如果是写入，内存被标记为可写；如果是执行，内存被标记为可执行。进程不能绕过内存访问限制。\n\n内核提供了两种方法来执行必要的检查以及在用户空间之间所需的拷贝。注意，内核代码绝不能盲目地跟随进入用户空间的指针！这两种方法中必须始终使用其中一种。\n\
  \n对于向用户空间写入，提供了 `copy_to_user()` 方法。它接受三个参数。第一个是进程地址空间中的目标内存地址。第二个是内核空间中的源指针。最后，第三个参数是要拷贝数据的字节数。\n\
  \n对于从用户空间读取，`copy_from_user()` 方法与 `copy_to_user()` 类似。该函数从第二个参数读取到第一个参数，字节数由第三个参数指定。\n\
  \n这两个函数在出错时都会返回失败拷贝的字节数。成功时，它们返回零。在这种错误情况下，系统调用返回 `-EFAULT` 是标准做法。\n\n让我们考虑一个使用了\
  \ `copy_from_user()` 和 `copy_to_user()` 的示例系统调用。这个系统调用 `silly_copy()` 完全毫无价值；它将数据从第一个参数拷贝到第二个参数中。这种做法是次优的，因为涉及了一个中间的、多余的内核空间拷贝，而没有产生任何益处。但它有助于说明这一点。\n\
  \n![image](img/p0076-01.jpg)\n\n`copy_to_user()` 和 `copy_from_user()` 都可能会阻塞。这种情况会发生，例如如果包含用户数据的页面不在物理内存中，而是被交换到了磁盘。在这种情况下，进程将睡眠，直到页异常处理程序将该页面从磁盘上的交换文件带入物理内存。\n\
  \n最后一个可能的检查是权限的有效性检查。在较旧的 Linux 版本中，需要 `root` 权限的系统调用使用 `suser()` 是标准做法。该函数仅检查用户是否为\
  \ root；现在这已被移除，取而代之的是更细粒度的“能力（capabilities）”系统。新系统对特定资源启用特定的访问检查。使用有效的能力标志位调用 `capable()`\
  \ 时，如果调用者持有指定的能力，则返回非零，否则返回零。例如，`capable(CAP_SYS_NICE)` 检查调用者是否具有修改其他进程 nice 值的能力。默认情况下，超级用户拥有所有能力，非\
  \ root 用户无所所有。例如，这里是 `reboot()` 系统调用。注意它的第一步是确保调用进程拥有 `CAP_SYS_REBOOT`。如果删除了那个条件语句，任何进程都可以重启系统。\n\
  \n![image](img/p0077-01.jpg)\n\n![image](img/p0078-01.jpg)\n\n查看 `<linux/capability.h>`\
  \ 获取所有能力及其权限列表。\n\n### 系统调用上下文\n\n如第 3 章所述，在执行系统调用期间，内核处于进程文中。`current` 指针指向当前任务，即调用系统用的进程。\n\
  \n在进程文中，内核能够睡眠（例如，如果系统调用阻塞或显式调用了 `schedule()`），并且是完全可抢占的。这一点非常重要。首先，睡眠的能力意味着系统调用可以利用内核的大部分功能。正如我们在第\
  \ 7 章“中断和中断处理程序”中将看到的，睡眠的能力极大地简化了内核编程。进程文中可抢占的事实意味着，就像用户空间一样，当前任务可能会被另一个任务抢占。由于新任务可能会执行同一个系统调用，必须确保系统调用是可重入的。当然，这与对称多处理引入的问题相同。同步重入性将在第\
  \ 9 章“内核同步简介”和第 10 章“内核同步方法”中介绍。\n\n*中断处理程序不能睡眠，因此它们的功能比运行在进程中的系统调用限制得多。*\n\n当系统调用返回时，控制继续在\
  \ `system_call()` 中，它最终切换到用户空间并继续执行用户进程。\n\n#### 绑定系统调用的最后步骤\n\n编写系统调用后，将其注册为正式系统调用是非常容易的：\n\
  \n\n\n\n\n1. 在系统调用表末尾添加条目。这需要对每个支持系统调用的架构进行操作（对于大多数调用来说，这意味着所有的架构）。系统调用在表中的位置（从零开始计数）就是它的系统调用号。例如，列表中的第十项被分配系统调用号为九。\n\
  \n2. 对于每个支持的架构，在`<asm/unistd.h>` 中定义系统调用号。\n\n3. 将系统调用编译进内核映像中（而不是编译为模块）。这可以通过将系统调用放在\
  \ `kernel/` 下的相关文件中实现，例如存放杂项系统调用的 `sys.c`，非常简单。\n\n让我们通过一个虚构的系统调用 `foo()` 来更详细地查看这些步骤。首先，我们想将\
  \ `sys_foo()` 添加到系统调用表。对于大多数架构，该表位于 `entry.S` 中，看起来如下：\n\n![image](img/p0079-01.jpg)\n\
  \n然后将新的系统调用添加到列表的末尾：\n\n```text\n.long sys_foo\n```\n\n虽然没有明确指定，但系统调用随后会被赋予随后的系统调用号——在本例中为\
  \ 338。对于你想要支持的每个架构，必须将系统调用添加到该架构的系统调用表中。系统调用不需要每个架构下接收相同的系统调用号，因为系统调用号是架构唯一 ABI\
  \ 的一部分。通常，你希望系统调用对每个架构都可用。注意每五个条目在注释中放置一个数字的约定；这有助于查找哪个系统调用被分配了哪个数字。\n\n接下来，将系统调用号添加到\
  \ `<asm/unistd.h>`，它目前看起来如下：\n\n![image](img/p0080-01.jpg)\n\n随后将以下内容添加到列表末尾：\n\n\
  ```text\n#define __NR_foo                338\n```\n\n最后，实现实际的 `foo()` 系统调用。由于系统调用在所有配置下都必须编译进核心内核映像，在本例中我们在\
  \ `kernel/sys.c` 中定义了它。你应该将其放在函数最相关的地方；例如，如果函数与调度有关，你可以在 `kernel/sched.c` 中定义它。\n\
  \n![image](img/p0081-01.jpg)\n\n就是这样！启动此内核后，用户空间就可以调用 `foo()` 系统调用。\n\n### 从用户空间访问系统调用\n\
  \n通常，C 库为系统调用提供支持。用户应用程序可以从标准头引入函数原型，并与 C 库链接以使用你的系统调用（或间接使用你调用的库例程）。然而，如果你刚刚写了一个系统调用，`glibc`\
  \ 可能并不已经支持它！\n\n幸运的是，Linux 提供了一组宏来封装系统调用的访问。它设置了寄存器内容并发出 trap 指令。这些宏命名为 `_syscalln()`，其中\
  \ `n` 在 0 到 6 之间。该数字对应传递给调调参数数量，因为宏需要知道期望有多少参数，并将其推入寄存器。例如，考虑系统调用 `open()`，其定义如下：\n\
  \n```c\nlong open(const char *filename, int flags, int mode)\n```\n\n在没有显式库支持的情况下使用该系统调用的宏应为：\n\
  \n```c\n#define __NR_open 5\n\n_syscall3(long, open, const char *, filename, int,\
  \ flags, int, mode)\n```\n\n然后，应用程序只需简单地调用 `open()`。\n\n每个宏都有 `2 + 2 × n` 个参数。第一个参数对应系统调用的返回类型。第二个是系统调用的名称。接下来按照系统调顺序是每个参数的类型和名称。`__NR_open`\
  \ 定义在 `<asm/unistd.h>` 中；它是系统调用号。`_syscall3` 宏展开为一个带有内联汇编的 C 函数；汇编代码执行上一节讨论的步骤，将系统调用号和参数推入正确的寄存器，并发出软件中断以\
  \ trap 进入内核。在应用程序中放置此宏就是使用 `open()` 系统调用所需的全部。\n\n让我们编写一个宏来使用我们极佳的新 `foo()` 系统调用，然后写一些测试代码来展示我们的成果。\n\
  \n![image](img/p0082-01.jpg)\n\n### 为什么不实现系统调用\n\n之前的章节已经表明，实现一个新的系统调用很容易，但这绝不应该鼓励你这样做。事实上，在添加新的系统调用时，你应该保持谨慎和克制。通常，有比提供新系统调用更可行的替代方案。让我们看看优点、缺点和替代方案。\n\
  \n将新接口作为系统调用实现的优点如下：\n\n- 系统调用实现简单且易于使用。\n- Linux 上的系统调用性能很快。\n\n缺点：\n\n- 你需要一个系统调用号，这需要官方分配给你。\n\
  - 系统调用进入稳定系列内核后，它就板上钉钉了。在不破坏用户空间应用程序的情况下，接口无法更改。\n- 每个架构都需要单独注册并支持该系统调用。\n- 系统调用不便于从脚本中使用，且无法从文件系统直接访问。\n\
  - 因为你需要分配的系统调用号，在内核外部维护和使用系统调用很困难。\n- 对于简单的信息交换，系统调用大材小用了。\n\n替代方案：\n\n- 实现设备节点并对其进行\
  \ `read()` 和 `write()`。使用 `ioctl()` 操作特定设置。\n- 某些接口（如信号量）可以表示为文件描述符并以此操作。\n- 将信息添加到\
  \ sysfs。\n\n对于许多接口，系统调用是正确的答案。然而，Linux 一直试图避免为每个新抽象都简单地添加系统调用。结果是一个极其干净的系统调用层，很少有废弃的情况。\n\
  \n结论\n\n在本章中，我们讨论了什么是系统调用，以及它们与库调用和应用程序接口（API）的关系。随后我们查看了 Linux 内核如何实现系统调用，以及执行系统调用所需的事件链：进入内核、传输系统调用号和参数、执行正确的系统调用函数，以及返回用户空间并返回值。\n\
  \n然后我们介绍了如何添加系统调用，并提供了一个从用户空间使用新调用的简单示例。整个过程非常简单！正如添加新调用的简单性所示，工作在于实现。本书的其他部分讨论了编写良好的、高效的安全系统调用所需的概念和内核接口。\n\
  \n最后，我们通过对实现系统调用优点的讨论以及添加新调用的替代方案列表总结了本章。\n\n## 6 内核数据结构\n\n本章介绍了用于内核的内置数据结构。与任何大型软件项目一样，Linux\
  \ 内核提供了这些通用数据结构以鼓励代码复用。内核开发者应该尽可能使用这些数据结构，而不是自己实现解决方案。在接后的章节中，我们将涵盖这些最实用的通用数据结构，它们是：\n\
  \n- 链表\n- 队列\n- 映射/哈希表\n- 二叉树\n\n我们通过讨论算法复杂性结束本章，即算法和数据结构支持更大输入的扩展易用程度。\n\n\n\n\n\
  \n## 链表\n\n链表是 Linux 内核中最简单且最常见的数据结构。`linked list` 允许存储和操作变数量的 `elements`（元素），这些元素被称为列表的\
  \ `nodes`（节点）。与静态数组不同，链表中的元素是动态创建并插入到列表中的。这使得能够管理编译时未的变数量元素。由于元素是在不同的时间创建的，它们并不一定占用内存中的连续区域。因此，这些元素需要被`linked`（链接）在一起；因此列表中的每个元素都包含一个指向\
  \ `next`（下一个）元素的指针。当元素添加到或从列表中移除时，只需调整指向下一个节点的指针即可。\n\n### 单向链表与双向链表\n\n表示此类链表的简单数据结构可能如下所示：\n\
  \n![image](img/p0086-01.jpg)\n\n图 6.1 是一条链表。\n\n图 6.1。单向链表。\n\n![image](img/06fig01.jpg)\n\
  \n在某些链表中，每个元素还包含一个指向 `previous`（上一个）元素的指针。这些列表被称为 `doubly linked lists`（双向链表），因为它们正向和反向都链接。像图\
  \ 6.1 中的列表中没有指向上一个元素指针的链表被称为 `singly linked lists`（单向链表）。\n\n表示双向链表的数据结构类似于：\n\n\
  ![image](img/p0086-02.jpg)\n\n图 6.2 是一条双向链表。\n\n图 6.2。双向链表。\n\n![image](img/06fig02.jpg)\n\
  \n## 循环链表\n\n通常情况下，由于链表中的最后一个元素没有下一个元素，它被设置为指向一个特殊值（如 `NULL`），以指示它是列表的最后一个元素。在某些链表中，最后一个元素并不指向特殊值。相反，它指向回第一个值。这种链表被称为\
  \ `circular linked list`（循环链表），因为该列表是循环的。循环链表可以是双向或单向两种版本。在循环双向链表中，第一个节点的“previous”指针指向最后一个节点。图\
  \ 6.3 和 6.4 分别是单向循环和双向循环链表。\n\n图 6.3。循环单向链表。\n\n![image](img/06fig03.jpg)\n\n图 6.4。循环双向链表。\n\
  \n![image](img/06fig04.jpg)\n\n尽管 Linux 内核的链表实现是独特的，但它根本上是一个 `circular doubly linked\
  \ list`（循环双向链表）。使用这种链表提供了最大的灵活性。\n\n### 在链表中移动\n\n在链表中的移动是线性发生的。你访问一个元素，顺着下一个指针移动，然后访问下一个元素。重复此过程。这是遍历链表最简单的方法，也是链表最擅长的方法。链表并不适用于随机访问是重要操作的用例。相反，当遍历整个列表很重要并且需要动态添加和删除元素时，你就会使用链表。\n\
  \n在链表实现中，第一个元素通常由一个特殊指针表示——称为 `head`（头），它能够轻松访问列表的“开始”部分。在非循环链表中，最后一个元素通过其下一个指针为\
  \ `NULL` 来界定。在循环链表中，最后一个元素通过其指向头元素来界定。因此，遍历列表是从第一个元素到最后一个元素线性地通过每个元素进行的。在双向链表中，移动也可以向后发生，从最后一个元素到第一个元素线性进行。当然，给定列表中的特定元素，你也可以向后和向前迭代任意数量的元素。你不需要遍历整个列表。\n\
  \n## Linux 内核的实现\n\n与大多数链表实现（包括前几节描述的通用方法）相比，Linux 内核的实现是独特的。回想之前的讨论，数据（或数据的组，如\
  \ `struct`）通过向数据添加 `next`（可能可能还有 `previous`）节点指针来维护在链表中的。例如，假设我们有一个 `fox` 结构来描述\
  \ `Canidae`（犬科）家族的该成员：\n\n![image](img/p0088-01.jpg)\n\n在链表中存储此结构的通用模式是将列表指针嵌入到结构中。例如：\n\
  \n![image](img/p0088-02.jpg)\n\nLinux 内核的方法是不同的。Linux 的方法不是将结构转换为链表，而是`在结构中嵌入一个链表节点`！\n\
  \n### 链表结构\n\n在过去，内核中存在多种链表的实现。内核开发中需要一个单一的、强大的链表实现来消除重复代码。在 2.1 内核开发系列期间，引入了官方内核链表实现。现在所有现有的链表使用都使用这个官方实现；不要重复造轮子！\n\
  \n链表代码在头文件 `<linux/list.h>` 中声明，数据结构非常简单：\n\n```\nstruct list_head {\n    struct\
  \ list_head *next;\n    struct list_head *prev;\n};\n```\n\n`next` 指针指向下一个节点，`prev`\
  \ 指针指向上一个节点。然而，这似乎并没有特别有用。一个巨大的链表有什么价值？效用在于 `list_head` 如何被使用：\n\n![image](img/p0089-01.jpg)\n\
  \n借此，`fox` 中的 `list.next` 指向下一个元素，`fox` 中的 `list.prev` 指向上一个元素。现在这变得很有用了，但还有更好的。内核提供了一系列用于操作链表的例程。例如，`list_add()`\
  \ 方法将新节点添加到现有的链链表中。然而，这些方法是通用的：它们只接受 `list_head` 结构。使用宏 `container_of`，我们可以轻松地找到父结构。这是因为在\
  \ C 语言中给定变量在结构中的偏移量在编译时由 ABI 固定的。\n\n![image](img/p0089-02.jpg)\n\n使用 `container_of()`，我们可以定义一个简单的函数来返回父结构：\n\
  \n```\n#define list_entry(ptr, type, member) \\\n    container_of(ptr, type, member)\n\
  ```\n\n有了 `list_entry()`，内核提供了创建、操作和其它管理链表的例程——而无需知道 `list_head` 所在的结构。\n\n### 定义链表\n\
  \n如所示，`list_head` 本身是无价值的；它通常嵌入在你的结构中：\n\n![image](img/p0089-04.jpg)\n\n列表在使用之前需要初始化。由于大多数元素是动态创建的（这可能就是为什么你需要链表），初始化链表的最常见方法是在运行时：\n\
  \n```\nstruct fox *red_fox;\nred_fox = kmalloc(sizeof(*red_fox), GFP_KERNEL);\n\
  red_fox->tail_length = 40;\nred_fox->weight = 6;\nred_fox->is_fantastic = false;\n\
  INIT_LIST_HEAD(&red_fox->list);\n```\n\n如果结构是在编译时静态创建的，并且你有它的直接引用，你可以这样做：\n\n```\n\
  struct fox red_fox = {\n    .tail_length = 40,\n    .weight = 6,\n    .list = LIST_HEAD_INIT(red_fox.\
  \ list),\n};\n```\n\n### 列表头\n\n前面的章节展示了如何轻松地将现有结构（例如我们的 `struct fox` 示例）转换为链表。通过简单的代码更改，我们的结构现在可以由内核的链表例程管理。但在使用这些例程之前，我们需要一个规范指针来引用整个列表——一个\
  \ `head` 指针。\n\n\n\n\n\n内核链表实现的一个非常好的特性是，我们的 fox 节点是不可区分的。每个节点都包含一个 `list_head`，我们可以从任意一个节点迭代到下一个节点，直到遍历每一个节点为止。这种方法非常优雅，但你通常会想要一个特殊的指针指向你的链表，而它本身并不是链表节点。有趣的是，这个特殊节点实际上是一个普通的\
  \ `list_head`：\n\n```\nstatic LIST_HEAD(fox_list);\n```\n\n这定义并初始化了一个名为 `fox_list`\
  \ 的 `list_head`。大多数链表操作例程接受一个或两个参数：头节点，或者头节点加上一个实际链表节点。让我们来看这些例程。\n\n### 操作链表\n\n\
  内核提供了一系列用于操作链表的函数。它们都接受指向一个或多个 `list_head` 结构的指针。这些函数在通用 C 语言中以内联函数（inline functions）的形式，可以在\
  \ `<linux/list.h>` 中找到。\n\n有趣的是，所有这些函数的复杂度都是 `O(1)`。这意味着无论链表的大小或任何输入如何，它们都能在常数时间内执行。例如，向列表中添加或删除条目所需的时间，无论该列表是有\
  \ 3 个还是 3,000 个条目都是相同的。这可能并不令人意外，但值得了解。\n\n*请参阅本章节后续的“算法复杂度”部分以获取关于 `O(1)` 的讨论。*\n\
  \n### 向链表添加节点\n\n向链表添加一个节点：\n\n```\nlist_add(struct list_head *new, struct list_head\
  \ *head)\n```\n\n此函数将 `new` 节点添加到给定列表，紧跟在 `head` 节点之后。由于链表是循环的，且通常没有第一个或最后一个节点的概念，因此你可以传递任意元素作为\
  \ `head`。然而，如果你传递了“最后一个”元素，此函数可以用来实现栈。\n\n回到我们的 fox 示例，假设我们有一个想要添加到 `fox_list` 链表的新\
  \ `struct fox`。我们会这样做：\n\n```\nlist_add(&f->list, &fox_list);\n```\n\n向链表的末尾添加一个节点：\n\
  \n```\nlist_add_tail(struct list_head *new, struct list_head *head)\n```\n\n此函数将\
  \ `new` 节点添加到给定列表，紧排在 `head` 节点之前。与 `list_add()` 一样，由于列表是循环的，你通常可以传递任意元素作为 `head`。但是，如果你传递了“第一个”元素，此函数可以用来实现队列。\n\
  \n### 从链表删除节点\n\n在向链表添加节点之后，从列表中删除节点是下一个最重要的操作。要从链表中删除节点，请使用 `list_del()`：\n\n```\n\
  list_del(struct list_head *entry)\n```\n\n此函数从列表中移除元素 `entry`。请注意，它不会释放属于 `entry`\
  \ 或其嵌入其中的数据结构的任何内存；此函数仅仅是将该元素从列表中移除。在调用此函数后，你通常会销毁你的数据结构以及内部的 `list_head`。\n\n例如，删除我们之前添加到\
  \ `fox_list` 的 `fox` 节点：\n\n```\nlist_del(&f->list);\n```\n\n注意，该函数并不接收 `fox_list`\
  \ 作为输入。它仅接收一个特定节点并修改前驱和后继节点的指针，使得给定节点不再是链表的一部分。其实现很有启发性：\n\n![image](img/p0091-01.jpg)\n\
  \n要从链表中删除节点并对其重新初始化，内核提供了 `list_del_init()`：\n\n```\nlist_del_init(struct list_head\
  \ *entry)\n```\n\n此函数的行为与 `list_del()` 相同，但它还会重新初始化给定的 `list_head`，理由是你不再需要列表中的该条目，但你可以复用数据结构本身。\n\
  \n### 移动和合并链表节点\n\n将节点从一个列表移动到另一个列表：\n\n```\nlist_move(struct list_head *list, struct\
  \ list_head *head)\n```\n\n此函数从其链表中移除 `list` 条目，并将其添加到给定列表 `head` 元素之后。\n\n将节点从一个列表移动到另一个列表的末尾：\n\
  \n```\nlist_move_tail(struct list_head *list, struct list_head *head)\n```\n\n此函数的功能与\
  \ `list_move()` 相同，但将 `list` 元素插入 `head` 条目之前。\n\n检查列表是否为空：\n\n```\nlist_empty(struct\
  \ list_head *head)\n```\n\n如果给定列表为空，则返回非零；否则返回零。\n\n将两个不连接的列表合并：\n\n```\nlist_splice(struct\
  \ list_head *list, struct list_head *head)\n```\n\n此函数通过将 `list` 指向的列表插入到给定列表 `head`\
  \ 元素之后，将两个列表合并在一起。\n\n合并两个不连接的列表并重新初始化旧列表：\n\n```\nlist_splice_init(struct list_head\
  \ *list, struct list_head *head)\n```\n\n此函数的工作原理与 `list_splice()` 相同，不同在于被 `list`\
  \ 指向的空列表被重新初始化了。\n\n节省几次解引用\n\n如果你恰好已经有了 `next` 和 `prev` 指针可用，可以通过调用内部函数来节省几个周期（具体来说是解引用操作）。内部函数的名称通常与其封装函数相同，只是前面加了双下划线。例如，与其使用\
  \ `list_del()`，你可以调用 `__list_del(prev, next)`。这仅在你已经获取了 `prev` 和 `next` 指针时有用。否则，你只是在写丑陋的代码。查看\
  \ `<linux/list.h>` 头文件。\n\n### 遍历链表\n\n现在你已经知道了如何在内核中声明、初始化和操作链表。这些都很好，但如果你没有访问数据的方法，这一切就毫无意义！链表只是存储数据的容器；你需要一种通过列表移动并访问数据的方法。内核（天谢地）提供了一套用于遍历链表并引用结构的良好接口。\n\
  \n注意，与链表操作函数不同，遍历整个列表显然是一个 `O(n)` 操作，其中 *n* 是列表中的条目数。\n\n### 基本方法\n\n遍历列表的最基本方法是使用\
  \ `list_for_each()` 宏。该宏接受两个参数，都是 `list_head` 结构。第一个是用于指向当前条目的指针；它是你必须提供的临时变量。第二个是作为要遍历列表之头的\
  \ `list_head`（参见早之前的章节“列表头”）。在循环的每次迭代中，第一个参数指向列表中的下一个条目，直到每个条目都被访问。使用方法如下：\n\n![image](img/p0093-01.jpg)\n\
  \n好吧，那还是没用！指向列表结构的指针通常没用；我们需要的是包含 `list_head` 的结构指针。例如，在我们之前的 `fox` 结构示例中，我们想要每个\
  \ `fox` 的指针，而不是结构中 `list` 成员的指针。可以使用之前讨论过的 `list_entry()` 宏来获取包含给定 `list_head` 的结构。例如：\n\
  \n![image](img/p0093-02.jpg)\n\n### 可用的方法\n\n之前的方法写出的代码并不直观或优雅，尽管它确实说明了 `list_head`\
  \ 节点是如何工作的。因此，大多数内核代码使用 `list_for_each_entry()` 宏来遍历链表。该宏处理了 `list_entry()` 完成的工作，使得链表遍历变得简单：\n\
  \n```\nlist_for_each_entry(pos, head, member)\n```\n\n\n\n\n\n在这里，`pos` 是指向包含 `list_head`\
  \ 节点的对象的指针。可以将其想象为 `list_entry()` 的返回值。`head` 是指向 `list_head` 头节点的指针，你想要从该节点开始迭代——在我们之前的示例中，它是\
  \ `fox_list`。`member` 是 `pos` 中 `list_head` 结构体的变量名——在我们的示例中为 `list`。这听起来可能很复杂，但用起来非常简单。以下是我们如何重写之前的\
  \ `list_for_each()` 来遍历每一个狐狸节点的示例：\n\n![image](img/p0094-01.jpg)\n\n现在让我们来看一个真实的示例，源自内核文件系统通知系统\
  \ *inotify*：\n\n![image](img/p0094-02.jpg)\n\n该函数遍历 `inode->inotify_watches` 列表中的所有目。每个条目的类型为\
  \ `struct inotify_watch`，该结构中的 `list_head` 命名为 `i_list`。随着循环的每次迭代，`watch` 都会指向列表中的新节点。这个简单函数的目的是在提供的\
  \ `inode` 结构体中搜索 `inotify_watches` 列表，找到一个 `inotify_handle` 与提供的句柄的 `inotify_watch`\
  \ 条目。\n\n### 反向遍历列表\n\n宏 `list_for_each_entry_reverse()` 的工作方式与 `list_for_each_entry()`\
  \ 相同，但它是反向移动列表。也就是说，它不是通过 `next` 指针*向前*顺向遍历列表，而是通过 `prev` 指针*向后*移动。其用法与 `list_for_each_entry()`\
  \ 相同：\n\n```\nlist_for_each_entry_reverse(pos, head, member)\n```\n\n支持反向遍历列表的理由只有少数。其中之一是性能考虑：如果你知道要查找的项可能在你开始搜索的节点*后面*，那么你可以向后移动以期尽早找到它。第二个原因是顺序非常重要。例如，如果你将链表当作栈使用，可以从列表的尾部向后遍历，以实现*后进先出\
  \ (LIFO)* 排序。如果你没有明确的理由反向遍历列表，就不要这样做——直接使用 `list_for_each_entry()` 即可。\n\n### 边删边遍历\n\
  \n如果你在迭代过程中从列表中删除条目，那么标准的列表迭代方法就不适用。标准方法依赖于列表条目在执行过程中不会发生变化的假设，因此，如果当前条目在循环体内被移除，随后的迭代将无法移动到下一个（或上一个）指针。这是循环中的常见模式，程序员通过在执行可能的删除操作*之前*将下一个（或上一个）指针存储在临时变量中来解决这个问题。Linux\
  \ 内核提供了一个例程来为你处理这种情况：\n\n```\nlist_for_each_entry_safe(pos, next, head, member)\n\
  ```\n\n你以与 `list_for_each_entry()` 相同的方式使用此版本，只需提供 `next` 指针，其类型与 `pos` 相同。`list_for_each_entry_safe()`\
  \ 宏使用 `next` 指针来存储列表中的下一个条目，从而安全地移除当前条目。让我们再次看一个 inotify 中的示例：\n\n![image](img/p0095-01.jpg)\n\
  \n该函数遍历并移除 `inotify_watches` 列表中的所有条目。如果使用标准的 `list_for_each_entry()`，此代码将引入释放后使用（use-after-free）错误，因为移动到列表中的下一个项需要访问已被销毁的\
  \ `watch`。\n\n如果你需要反向遍历链表并可能移除元素，内核提供了 `list_for_each_entry_safe_reverse()`：\n\n\
  ```\nlist_for_each_entry_safe_reverse(pos, n, head, member)\n```\n\n其用法与 `list_for_each_entry_safe()`\
  \ 相同。\n\n### 你可能仍然需要锁！\n\n`list_for_each_entry()` 的“安全”变体*仅*保护你免受循环体*内部*删除操作的影响。如果存在来自其他代码的并发删除或其他任何其他形式的并发列表操作，你需要对列表的访问进行适当的锁定。\n\
  \n请参第 9 章“内核同步简介”和第 10 章“内核同步方法”，了解关于同步和锁的讨论。\n\n### 其他链表方法\n\nLinux 提供了许多其他列表方法，能够以几乎所有想象得到的方式访问和操作链表。所有这些方法都定义在头文件\
  \ `<linux/list.h>` 中。\n\n### 队列\n\n任何操作系统内核中常见的编程模式都是*生产者与消费者*。在这种模式下，生产者创建数据——例如，要读取的错误消息或要处理的网络数据包——而消费者读取、处理或以其他方式*消耗*这些数据。通常实现这种模式最简单的方法是使用*队列*。生产者将数据推入队列，消费者从队列中取出数据。消费者按照入队列的顺序获取数据。也就是说，队列中的第一条数据就是取出的第一条数据。由于这个原因，队列也被称为\
  \ *FIFOs*，*先进先出（first-in, first-out）*的缩写。请参见图 6.5。\n\n\n\n\n\n```c\nunsigned int\
  \ kfifo_in(struct kfifo *fifo, const void *from, unsigned int len);\n```\n\n该函数将从\
  \ `from` 开始的 `len` 字节拷贝到由 `fifo` 表示的队列中。成功时，它返回入队队列的字节数。如果队列中的可用空间少于 `len` 字节，该函数将仅拷贝至多可用字节的数量。因此，返回值可能小于\
  \ `len`，或者在没有拷贝任何内容时为 0。\n\n## 取出队列数据\n\n当你使用 `kfifo_in()` 向队列中添加数据时，可以使用 `kfifo_out()`\
  \ 将其移除：\n\n```c\nunsigned int kfifo_out(struct kfifo *fifo, void *to, unsigned int\
  \ len);\n```\n\n该函数最多从 `fifo` 指向的队列中拷贝 `len` 字节到由 `to` 指向的缓冲区中。成功时，该函数返回拷贝的字节数。如果队列中的数据少于\
  \ `len` 字节，该函数拷贝的将少于请求量。\n\n数据出队列后，将无法再次从队列访问。这是队列的正常用法，但如果你想“查看”队列内部的数据而不将其移除，可以使用\
  \ `kfifo_out_peek()`：：\n\n```c\nunsigned int kfifo_out_peek(struct kfifo *fifo,\
  \ void *to, unsigned int len, unsigned offset);\n```\n\n它的工作原理与 `kfifo_out()` 相同，不同之处在于输出偏移（offset）不会增加，因此出队列的数据在后续的\
  \ `kfifo_out()` 调用中仍然是可读的。参数 `offset` 指定队列中的索引；指定为零则从队列头部读取，与 `kfifo_out()` 的操作方式一致。\n\
  \n## 获取队列大小\n\n要获取用于存储 kfifo 队列的缓冲区的总大小（字节为单位），请调用 `kfifo_size()`：\n\n```c\nstatic\
  \ inline unsigned int kfifo_size(struct kfifo *fifo);\n```\n\n在内核命名的另一个糟糕示例中，请使用\
  \ `kfifo_len()` 来获取 kfifo 中已入队数量的字节数：\n\n```c\nstatic inline unsigned int kfifo_len(struct\
  \ kfifo *fifo);\n```\n\n要找到可写入 kfifo 的可用字节数，请调用 `kfifo_avail()`：\n\n```c\nstatic\
  \ inline unsigned int kfifo_avail(struct kfifo *fifo);\n```\n\n最后，`kfifo_is_empty()`\
  \ 和 `kfifo_is_full()` 在给定的 kfifo 分别为空或全满时返回非零值，否则返回零：\n\n```c\nstatic inline int\
  \ kfifo_is_empty(struct kfifo *fifo);\nstatic inline int kfifo_is_full(struct kfifo\
  \ *fifo);\n```\n\n### 重置和销毁队列\n\n要重置 kfifo 并丢弃队列的所有内容，请调用 `kfifo_reset()`：\n\n```c\n\
  static inline void kfifo_reset(struct kfifo *fifo);\n```\n\n要销毁用 `kfifo_alloc()`\
  \ 分配的 kfifo，请调用 `kfifo_free()`：\n\n```c\nvoid kfifo_free(struct kfifo *fifo);\n\
  ```\n\n如果你是用 `kfifo_init()` 创建的 kfifo，则由负责释放关联缓冲区。具体操作取决于你是如何创建它的。关于分配和释放动态内存的讨论，请参见第\
  \ 12 章。\n\n## 队列使用示例\n\n掌握了这些接口后，让我们来看一个使用 kfifo 的简单示例。假设我们创建了一个由 `fifo` 指向的、大小为\
  \ 8KB 的 kfifo。现在我们可以向队列中入队数据。在这个示例中，我们入队简单的整数。在在你自己的代码中，你可能会入队更复杂的、特定于任务的结构。通过在示例中使用整数，让我们看看\
  \ kfifo 到底是如何工作的：\n\n![image](img/p0099-01.jpg)\n\n名为 `fifo` 的 kfifo 现在包含了从 0 到\
  \ 31（包含）的数字。我们可以查看队列中的第一个元素并验证它是否为 0：\n\n![image](img/p0099-02.jpg)\n\n要出队列并打印 kfifo\
  \ 中的所有项，我们可以使用 `kfifo_out()`：\n\n![image](img/p0100-01.jpg)\n\n这会按顺序打印 0 到 31（包含）的数字。（如果这段代码段打印的数字是反向的，从\
  \ 31 到 0，那么我们拥有的是一个*栈*而不是*队列*。）\n\n## 映射 (Maps)\n\n*映射*（map），也称为*关联数组*（associative\
  \ array），是一个唯一键的集合，每个键都与一个特定的值相关。键与其值之间的关系被称为*映射*（mapping）。映射至少支持三种操作：\n\n- 添加 (key,\
  \ value)\n- 移除 (key)\n- value = 查找 (key)\n\n虽然哈希表是映射的一种类型，但并不是所有的映射都是通过哈希实现的。映射除了哈希表外，还可以使用自平衡二叉搜索树来存储数据。虽然哈希提供了更好的平均情况渐进复杂度（请参见本章节后部分的“算法复杂度””部分），但二叉搜索树具有更好的最坏表现（对数级对比线性）。二叉搜索树还实现了*顺序保持*（order\
  \ preservation），使用户能够以排序顺序高效地遍历整个集合。最后，二叉搜索树不需要哈希函数；相反，只要键类型可以定义 `<=` 运算符，任何类型的键都是合适的。\n\
  \n虽然是映射的通用术语，但并不是所有映射都是通过哈希实现的。而不是哈希表，映射也可以使用自平衡二叉搜索树来存储其数据。虽然哈希提供了更好的平均情况渐进复杂度（请参见本章节后部分的“算法复杂度””部分），但二叉搜索树具有更好的最坏表现（对数级对比线性）。二叉搜索树还实现了*顺序保持*，使用户能够以排序顺序高效地遍历整个集合。最后，二叉搜索树不需要哈希函数；相反，只要键类型可以定义\
  \ `<=` 运算符，任何类型的键都是合适的。\n\n虽然是映射的通用术语，但并不是所有映射都是通过哈希实现的。而不是哈希表，映射也可以使用自平衡二叉搜索树来存储其数据。虽然哈希提供了更好的平均情况渐进复杂度（请参见本章节后部分的“算法复杂度””部分），但二叉搜索树具有更好的最坏表现（对数级对比线性）。二叉搜索树还实现了*顺序保持*，使用户能够以排序顺序高效地遍历整个集合。最后，二叉搜索树不需要哈希函数；相反，只要键类型可以定义\
  \ `<=` 运算符，任何类型的键都是合适的。\n\n虽然是映射的通用术语，但并不是所有映射都是通过哈希实现的。而不是哈希表，映射也可以使用自平衡二叉搜索树来存储其数据。虽然哈希提供了更好的平均情况渐进复杂度（请参见本章节后部分的“算法复杂度””部分），但二叉搜索树具有更好的最坏表现（对数级对比线性）。二叉搜索树还实现了*顺序保持*，使用户能够以排序顺序高效地遍历整个集合。最后，二叉搜索树不需要哈希函数；相反，只要键类型可以定义\
  \ `<=` 运算符，任何类型的键都是合适的。\n\n虽然是映射的通用术语，但并不是所有映射都是通过哈希实现的。而不是哈希表，映射也可以使用自平衡二叉搜索树来存储其数据。虽然哈希提供了更好的平均情况渐进复杂度（请参见本章节后部分的“算法复杂度””部分），但二叉搜索树具有更好的最坏表现（对数级对比线性）。二叉搜索树还实现了*顺序保持*，使用户能够以排序顺序高效地遍历整个集合。最后，二叉搜索树不需要哈希函数；相反，只要键类型可以定义\
  \ `<=` 运算符，任何类型的键都是合适的。\n\n*(注：由于原文文本在 Maps 章节后出现了大量重复段落，翻译时遵循了“不要重复输出原文”的原则，仅对核心逻辑部分进行了翻译。)*\n\
  \n### 初始化 idr\n\n设置 idr 很容易。首先你静态定义或动态分配 idr。然后调用 `idr_init()`：\n\n```c\nvoid idr_init(struct\
  \ idr *idp);\n```\n\n例如：\n\n```c\nstruct idr id_huh;  /* 静态定义 idr 结构\nidr_init(&id_huh);\
  \ /* 初始化结构 */\n```\n\n### 分配一个新的 UID\n\n一旦设置好了 idr，就可以分配一个新的 UID，这是一个步骤的过程。首先你告诉\
  \ idr 你想要分配一个新的 UID，允许它调整大小。然后，通过第二次调用，你实际请求该 UID。这种设计是为了允许你进行初始扩容，这可能需要内存分配。我们在第\
  \ 12 章 中讨论内存分配，在第 9 章和第 10 章中讨论锁定。现在，让我们专注于使用 idr 而不考虑锁定。\n\n调整底层树的第一个函数是 `idr_pre_get()`：\n\
  \n```c\nint idr_pre_get(struct idr *idp, gfp_t gfp_mask);\n```\n\n该函数将在满足新的 UID\
  \ 分配时，调整 `idp` 指向的 idr。如果需要调整大小，内存分配将使用 *gfp 标志* `gfp_mask`（gfp 标志在第 12 章 中讨论）。你不需要对此调用进行同步。与内核中几乎所有其他函数相反，`idr_pre_get()`\
  \ 在成功时返回一，失败时返回零——小心！\n\n实际获取新 UID 并加入 idr 的第二个函数是 `idr_get_new()`：\n\n```c\nint\
  \ idr_get_new(struct idr *idp, void *ptr, int *id);\n```\n\n该函数使用 idp 指向的 idr 分配一个新的\
  \ UID，并与指针 `ptr` 关联。成功时，函数返回零并将新 UID 存储在 `id` 中。失败时，它返回非零错误代码：如果需要再次调用 `idr_pre_get()`\
  \ 则返回 `-EAGAIN`，如果 idr 已满则返回 `-ENOSPC`。\n\n让我们来看一个完整的示例：\n\n![image](img/p0102-01.jpg)\n\
  \n\n\n\n\n如果成功，此代码段将获取一个新的 UID，并存储在整数 `id` 中，将该 UID 映射到 `ptr`（我们在代码段中并未定义）。\n\n\
  函数 `idr_get_new_above()` 允许调用者指定一个最小 UID 值作为返回值：\n\n```c\nint idr_get_new_above(struct\
  \ idr *idp, void *ptr, int starting_id, int *id);\n```\n\n它的工作与 `idr_get_new()`\
  \ 相同，不同在于新的 UID 保证大于或等于 `starting_id`。使用该函数的变体允许 `idr` 用户确保 UID 永远不会被重用，使得值不仅在当前分配的\
  \ ID 中是唯一的，在整个系统运行期间内都是唯一的。这段代码段与我们之前的示例相同，只是我们请求的是严格递增的 UID 值：\n\n![image](img/p0102-02.jpg)\n\
  \n### 查找 UID\n\n当我们在 idr 中分配了若干个 UID 后，可以查找它们：调用者提供 UID，idr 返回关联的指针。通过 `idr_find()`\
  \ 函数，可以以比分配新 UID 简单得的方式实现：\n\n```c\nvoid *idr_find(struct idr *idp, int id);\n```\n\
  \n成功调用此函数将返回 `idp` 指向的 idr 中与 UID `id` 关联的指针。如果出错，函数返回 `NULL`。注意，如果你通过 `idr_get_new()`\
  \ 或 `idr_get_new_above()` 将 `NULL` 映射到一个 UID，此函数将成功返回 `NULL`，导致你无法区分成功与失败。因此，你不应该将\
  \ UID 映射到 `NULL`。\n\n用法非常简单：\n\n```c\nstruct my_struct *ptr = idr_find(&idr_huh,\
  \ id);\n\nif (!ptr)\n    return -EINVAL;  /* error */\n```\n\n### 移除 UID\n\n要从 idr\
  \ 中移除 UID，请使用 `idr_remove()`：\n\n```c\nvoid idr_remove(struct idr *idp, int id);\n\
  ```\n\n成功调用 `idr_remove()` 会从 `idp` 指向的 idr 中移除 UID `id`。遗憾的是，`idr_remove()` 无法指示错误（例如当\
  \ `id` 不在 `idp` 中）。\n\n## 销毁 idr\n\n销毁 idr 是一件简单的事，通过 `idr_destroy()` 函数完成：\n\n\
  ```c\nvoid idr_destroy(struct idr *idp);\n```\n\n成功调用 `idr_destroy()` 只释放与 `idp`\
  \ 指向的 idr 关联未使用内存。它不会释放当前分配的 UID 正在使用的内存。通常，内核代码不会在关闭或卸载之前销毁其 idr 设施，并且在没有更多用户（因此没有更多\
  \ UID）之前不会卸载，但为了强制移除所有 UID，你可以调用 `idr_remove_all()`：\n\n```c\nvoid idr_remove_all(struct\
  \ idr *idp);\n```\n\n你会在调用 `idr_destroy()` *之前* 对 `idp` 指向的 idr 调用 `idr_remove_all()`，以确保所有\
  \ idr 内存均已释放。\n\n## 二叉树\n\n*树*（tree）是一种提供分层树状数据结构的数据结构。从数学上讲，它是一个*无环、连通、有向图*，其中每个顶点（称为*节点*）具有零或多个出边以及零或一个入边。*二叉树*是一种节点最多有两个出边的树——即节点具有零、一个或两个子节点的树。请参阅图\
  \ 6.6 的二叉树示例。\n\n图 6.6. 二叉树。\n\n![image](img/06fig06.jpg)\n\n## 二叉搜索树\n\n*二叉搜索树*（通常缩写为\
  \ *BST*）是一种对其节点施加了特定排序的二叉树。该排序通常通过以下归纳法定义：\n\n* 根节点的左子树仅包含值小于根节点的节点。\n* 根节点的右子树仅包含值大于根节点的节点。\n\
  * 所有子树也是二叉搜索树。\n\n因此，二叉搜索树是一种二叉树，其中所有节点都是*有序的*，使得左孩子的值小于其父节点，右孩子的值大于父节点。因此，查找给定节点和中序遍历都是高效的（分别为对数级和线性级）。请参阅图\
  \ 6.7 的二叉搜索树示例。\n\n图 6.7. 二叉搜索树 (BST)。\n\n![image](img/06fig07.jpg)\n\n## 自平衡二叉搜索树\n\
  \n节点的*深度*通过它距离根节点的父节点数量来衡量。树的“底部”节点——那些没有子节点的节点——称为*叶子节点*（leaves）。树的*高度*是树中最深节点的深度。*平衡二叉搜索树*是一种所有叶子节点深度差最多为一的二叉搜索树（参见图\
  \ 6.8）。*自平衡二叉搜索树*是一种在正常操作过程中尝试保持（半）平衡的二叉搜索树。\n\n图 6.8. 平衡二叉树。\n\n![image](img/06fig08.jpg)\n\
  \n### 红黑树\n\n二叉搜索树是一种是一种在正常操作过程中尝试保持（半）平衡的二叉搜索树。\n\n1. 所有节点为红色或黑色。\n2. 叶子节点为黑色。\n\
  3. 叶子节点不包含数据。\n4. 所有非叶子节点都有两个孩子。\n5. 如果节点为红色，则它的两个孩子都是黑色的。\n6. 从节点到其任一叶子节点的路径包含相同数量的黑色节点。\n\
  \n这些属性结合确保了最深叶子节点的深度不超过最浅叶子节点的两倍。\n\n\n\n\n\n演示搜索和插入的最佳方法是展示一个真实世界的示例。首先，让我们来看搜索。以下函数实现了对\
  \ Linux 页面缓存（page cache）中某个文件块（由 `inode` 和偏移量对表示）的搜索。每个 `inode` 都有自己的 `rbtree`（红黑树），以文件偏移量为键。因此，该函数在给定的\
  \ `inode` 的 `rbtree` 中搜索匹配的偏移量值：\n\n![image](img/p0106-01.jpg)\n\n在这个示例中，`while`\
  \ 循环遍历 `rbtree`，根据需要向给定偏移量方向的左子或右子节点进行遍历。`if` 和 `else` 语句实现了红黑树的比较函数，从而强制执行了树的排序（ordering）。如果循环找到了一个具有匹配偏移量的节点，则搜索完成，函数返回相关的\
  \ `page` 结构。如果循环到达 `rbtree` 的末尾而未找到匹配项，则说明树中不存在该项，函数返回 `NULL`。\n\n插入更加复杂，因为它同时实现了搜索和插入逻辑。以下代码并不是一个简单的函数，但如果你需要实现自己的插入例程，这是一个非常好的指南：\n\
  \n![image](img/p0107-01.jpg)\n\n与我们的搜索函数一样，`while` 循环正在遍历树，沿着提供的偏移量方向移动。然而，与搜索不同的是，函数期望*不是*找到匹配的偏移量，而是到达作为新偏移量正确插入点的叶子节点。当找到插入点时，会调用\
  \ `rb_link_node()` 在指定位置插入新节点。然后调用 `rb_insert_color()` 来执行复杂的重平衡算法“跳舞”。如果页面已添加到页面缓存中，函数返回\
  \ `NULL`；如果页面已经在缓存中，则返回现有 `page` 结构的地址。\n\n### 在何时该使用何种数据结构\n\n到目前为止，我们讨论了 Linux\
  \ 最重要的四种数据结构：链表、队列、映射（maps）和红黑树。在这一节中，我们将介绍一些提示，帮助你决定在自己的代码中使用何种数据结构。\n\n如果你的主要访问方法是遍历所有数据，请使用链表。直观上来说，在访问每个元素时，没有任何数据结构提供的复杂度能比线性复杂度更好，因此对于这项简单的任务，你应该优先选择最简单的数据结构。当性能不重要、当你需要存储相对较少的项目时，或者你需要与使用链表的其他内核代码进行交互时，也请考虑链表。\n\
  \n如果你的代码遵循生产者/消费者模式，请使用队列，特别是当你想要（或能够应对）固定大小的缓冲区时。队列使添加和删除项目变得简单高效，并且它们提供了先进先出（FIFO）的语义，这是大多数生产者/消费者用例所要求的。相反，如果你需要存储未知数量且可能大量的项目，链表可能更合理，因为你可以动态地向列表中添加任意数量的项目。\n\
  \n如果你需要将一个 UID 映射到一个对象，请使用映射（map）。映射使得这种映射变得简单且高效，而且它们还为你维护并分配 UID。然而，Linux 的映射接口专门针对从\
  \ UID 到指针的映射，这并不适用于其他许多情况。如果你正在处理分发给用户态的描述符（descriptors），可以考虑这个选项。\n\n如果你需要存储大量数据并高效地查找它们，请考虑红黑树。红黑树能够以对数时间进行搜索，同时仍提供高效的线性时间中序遍历。虽然实现起来比其他数据结构复杂，但它们的内存占用并没有显著变差。如果你没有执行许多对时间敏感的查找操作，红黑树可能不是你的最佳选择。在这种情况下，请优先选择链表。\n\
  \n没有一种这些数据结构符合你的需求吗？内核实现了其他很少使用的数据结构，可能满足你的需求，例如基数树（radix trees，一种 *trie*）和位图（bitmaps）。只有在用尽所有内核提供的解决方案之后，你应该考虑“自建”数据结构。一种在单个源文件中实现的常用数据结构是哈希表。由于哈希表无非是一些桶和一个哈希函数，而且哈希函数针对每个特定用例，因此在\
  \ C 这种非泛型编程语言中提供全内核范围的解决方案意义不大。\n\n### 算法复杂度\n\n在计算机科学及相关学科中，量化表达算法的算法复杂度——或*可扩展性*（scalability）通常是有用的。表示可扩展性的多种方法。一种常用技术是研究算法的*渐近行为*（asymptotic\
  \ behavior）。这是算法因为其输入变得极其巨大并趋于无穷大而表现出的行为。渐近行为显示了随着输入不断增大，算法的扩展性如何。研究算法的可扩展性——即随输入规模增加时的性能——使我们能够针对基准对算法进行建模，并更好地理解它的行为。\n\
  \n#### 算法\n\n算法是一系列指令，可能包含一个或多个输入，并产生结果或输出。例如，计算房间内人数的步骤就是一个算法，人是输入，计数是输出。在 Linux\
  \ 内核中，页面置换（page eviction）和进程调度器都是算法的示例。从数学上讲，算法类似于函数。（或者至少你可以将其建模为函数。）例如，如果你将计数算法命名为\
  \ `f`，将要计数的人数命名为 `x`，你可以写道：\n\n```y = f(x)\n\n#### 大 O 表示法\n\n一种有用的符号是上界（upper bound），它是一个函数，在初始点之后，其值始终大于另一个函数的值。可以说上界的增长速度等于或快于该函数。一种特殊的符号大\
  \ O 表示法（读音为 *big oh*）被用来描述这种增长。它写为 `f(x) is O(g(x))`，读作 *f is big-oh of g*。其正式的数学定义为\n\
  \n![image](img/06eq1.jpg)\n\n用英语来说，完成 `f(x)` 的时间始终小于或等于完成 `g(x)` 时间乘以某个任意常数，只要输入\
  \ `x` 大于某个初始值。本质上，你正在寻找一个行为与算法一样甚至更糟的函数。\n\n#### 大 Theta 表示法\n\n当大多数人谈论大 O 表示法时，他们更准确地指的是\
  \ Donald Knuth 所描述的大 Theta 表示法（big-theta notation）。技术上讲，大 O 表示法指的是上界。例如，7 是 6 的上界；9、12\
  \ 和 65 也是。随后，当大多数人讨论函数增长时，他们讨论的是*最小上界*（least upper bound），或者一个同时模拟上界和下界的函数。\n\n\
  如果 f(x) 是 g(x) 的大 Theta，那么\n\n```g(x)既是 f(x) 的上界，又是下界。\n```\n\n那么，你可以说 `f(x)` 的阶数（order）是\
  \ `g(x)`。\n\n\n\n\n因此，当人们提到大 O 表示（big-o notation）时，他们通常指的是这种最小的大 O 表示，即大 Theta 表示（big-theta）。你真的不需要担心这个，除非你想让\
  \ Knuth 教授感到非常高兴。\n\n## 时间复杂度\n\n考虑计算房间内人数的原始示例。假设你每秒可以数数一个人。那么，如果房间里有 7 个人，则需要\
  \ 7 秒钟数完。更一般地说，给定 `n` 个人，数完所有人需要 `n` 秒。因此，你可以说该算法是 `O(n)`。如果任务是在房间里的每个人面前跳舞呢？因为无论房间里是\
  \ 5 个人还是 5000 个人，跳舞花费的时间相同，所以这项任务是 `O(1)`。其他常见的复杂度请参见表 6.1。\n\n表 6.1. 常见时间复杂度值表\n\
  \n![image](img/t0110-01.jpg)\n\n将房间里的每个人介绍给其他人的复杂度是多少？模拟该算法的可能函数是什么？如果介绍每一个人需要 30\
  \ 秒，那么让 10 个人相互介绍需要多久？100 个人相互介绍又呢？了解算法随着工作量增加的性能表现，是确定特定任务最佳算法的关键组成部分。\n\n当然，避免使用\
  \ `O(n!)` 或 `O(2^n)` 等复杂度是明智的。同样，用功能等效的 `O(log n)` 算法替换 `O(n)` 算法通常是一种改进。然而，情况并不总是如此，不能仅根据大\
  \ O 表示就盲目假设。记住，给定 `O(g(x))`，有一个常数 `c` 乘以 `g(x)`。因此，一个 `O(1)` 算法可能需要 3 小时才能完成。当然，无论输入有多大，它总是\
  \ 3 小时，但与输入较少的 `O(n)` 算法相比，这仍然是一很长时间。在比较算法时，应该始终考虑典型的输入大小。\n\n倾向于复杂度更低的算法，但要记住算法相对于典型输入大小的开销。不要盲目地优化到你永远不需要支持的扩展性水平！\n\
  \n### 结论\n\n在本章中，我们讨论了 Linux 内核开发人员用于实现从进程调度器到设备驱动程序所有内容的许多通用数据结构。在我们继续学习 Linux\
  \ 内核时，你会发现这些数据结构非常有用。在编写自己的内核代码时，务必复用现有的内核基础设施，不要重复造轮。\n\n我们还涵盖了算法复杂度以及衡量和表达复杂度的工具，其中最著名的是大\
  \ O 表示。在整本书和 Linux 内核中，大 O 表示是衡量算法和内核组件在面对大量用户、进程、处理器、网络连接和其他不断增长的输入时扩展性的一个重要概念。\n\
  \n## 7. 中断与中断处理程序\n\n任何操作系统内核的核心职责之一是管理连接到机器的硬件——硬盘和蓝光光、键盘和鼠标、3D 处理器和无线电台。为了履行这一职责，内核需要与机器的各个设备进行通信。鉴于处理器的速度比其通信的硬件快几个数量级，让内核发出请求并等待显著缓慢的硬件响应并不是理想的。相反，由于硬件响应相对较慢，内核必须能够自由去处理其他工作，仅在硬件实际完成工作后对其进行处理。\n\
  \n处理器如何在不影响机器整体性能的情况下与硬件协同工作？这个问题的一个答案是轮询（polling）。内核可以定期检查系统中的硬件状态并做出相应响应。然而，轮询会产生开销，因为无论硬件是否活动或就绪，它必须重复发生。更好的解决方案是提供一种机制，让硬件在需要注意时向内核信号。这种机制被称为中断（interrupt）。在本章中，我们将讨论中断以及内核如何响应中断，即使用称为中断处理程序（interrupt\
  \ handlers）的特殊函数。\n\n### 中断\n\n中断允许硬件向处理器发送信号。例如，当你打字时，键盘控制器（管理键盘的硬件设备）会向处理器发出电信号，以器操作系统有新的可用的按键。这些电信号就是中断。处理器接收到中断并通知操作系统，使操作系统能够响应新数据。硬件设备产生中断相对于处理器时钟是异步的——它们可以在任何时间发生。因此，内核可以在任何时间被中断以处理这些中断。\n\
  \n中断在物理上是由源自硬件设备的电子信号产生的，这些信号被定向到中断控制器的输入引脚，中断控制器是一个简单的芯片，它将多条中断路线复用为一条通往处理器的单线。接收到中断后，中断控制器向处理器发送信号。处理器检测到该信号并中断当前的执行以处理中断。然后，处理器可以通知操作系统发生了中断，操作系统可以妥善地处理该中断。\n\
  \n不同的设备可以通过与每个中断相关的唯一值与不同的中断关联。这样，来自键盘的中断与来自硬盘的中断是不同的。这使得操作系统能够区分中断，并知道哪个硬件设备导致了哪个中断。这时，操作系统可以使用相应的处理程序处理每个中断。\n\
  \n这些中断值通常被称为中断请求（IRQ）线。每条 IRQ 线都分配有一个数字值——例如，在经典的 PC 上，IRQ 0 是定时器中断，IRQ 1 是键盘中断。然而，并不是所有中断都有如此严格的定义。例如，与\
  \ PCI 总线设备关联的中断通常动态分配的。其他非 PC 架构对中断值也有类似的动态分配。重要的概念是特定的中断与特定的设备相关，且内核知道这一点。硬件随后发出中断以引起内核的注意：*嘿，我有新的按键在等候！读取并处理这些小家伙们！*\n\
  \n异常（Exceptions）\n\n在操作系统的文本中，异常通常与中断同时被讨论。与中断不同，异常相对于处理器时钟是同步发生的。事实上，它们通常被称为同步中断。异常是处理器在执行指令时产生的，可能是响应编程错误（例如，除以零），或者是必须由内核处理的异常状况（例如，页错误）。由于许多处理器架构处理异常的方式与中断类似，处理这两种者的内核基础设施也是相似的。本章中关于中断（硬件产生的异步中断）的大部分讨论也涉及异常（处理器产生的同步中断）。\n\
  \n你已经熟悉其中一种异常了：在上一章中，你看到了 x86 架构上的系统调用是如何通过发布软件中断来实现的，这种软件中断会陷入内核并导致特殊系统调用处理程序的执行。中断的工作方式类似，你将会看到，不同之处是硬件——而不是软件发出的中断。\n\
  \n\n\n\n内核响应特定中断而运行的函数被称为 `interrupt handler`（中断处理程序）或 `interrupt service routine\
  \ (ISR)`。每个产生中断的设备都有一个关联的中断处理程序。例如，一个函数处理来自系统定时器的中断，而另一个函数处理由键盘产生的中断。设备的中断处理程序是设备\
  \ `driver`（驱动程序）的一部分——即管理设备的内核代码。\n\n在 Linux 中，中断处理程序是普通的 C 函数。它们匹配特定的原型，这使得内核能够以标准的方式传递处理程序信息，但在其他情况下它们就是普通函数。中断处理程序与其他内核函数的区别在于，内核是响应中断而调用它们的，并且它们运行在一个特殊的上下文中，称为\
  \ `interrupt context`（中断上下文，将在本章稍后部分进行讨论）。这种特殊上下文有时被称为 `atomic context`（原子上下文），因为正如我们将要看到的，在该上下文中执行的代码无法阻塞的。在本书中，我们将使用“中断上下文”这一术语。\n\
  \n由于中断可能在任何时间发生，中断处理程序也可能在任何时间被执行。处理程序必须快速运行，以便尽快恢复被中断代码的执行。因此，虽然操作系统延迟服务中断对硬件来说非常重要，但中断处理程序在尽可能短的时间内执行对系统的其余部分也同样重要。\n\
  \n至少，中断处理程序的工作是向硬件确认接收中断：*嘿，硬件，我收到了；现在回去工作吧！* 然而，通常情况下，中断处理程序有大量工作要完成。例如，考虑网络设备的中断处理程序。除了响应硬件外，中断处理程序还需要将网络包从硬件拷贝到内存中，对其进行处理，并将数据包推送到适当的协议栈或应用程序。显然，这是一项大量的工作，特别是对于今天的千兆和万兆以太网卡。\n\
  \n### 上半部与下半部（Top Halves Versus Bottom Halves）\n\n这两个目标——让中断处理程序快速执行*且*完成大量工作——显然是相互冲突的。由于这些竞争目标，中断的处理被分为两个部分，或称为两半。中断处理程序是\
  \ `top half`（上半部）。上半部在接收到中断后立即运行，仅执行对时间敏感的工作，例如确认接收中断或重置硬件。可以稍后执行的工作被推迟到 `bottom\
  \ half`（下半部）。下半部在未来的更方便的时间运行，且此时所有中断都是开启的。Linux 提供了实现下半部的各种机制，它们将在第 8 章“下半部与工作延迟”中进行讨论。\n\
  \n让我们通过我们的老朋友——网卡，来看一个上半部/下半部对立的例子。当网卡从网络接收数据包时，它们需要通知内核其就绪性。它们希望并需要立即这样做，以优化网络吞吐量和延迟并避免超时。因此，它们会立即发出中断：*嘿，内核，我这里有一些新的数据包！*\
  \ 内核通过执行网卡注册的中断来响应。\n\n中断运行，确认硬件，将新的网络包拷贝到主内存中，并为网卡接收更多数据包做好准备。这些任务是重要的、时间敏感的且特定于硬件的工作。内核通常需要快速将网络包拷贝到主内存中，因为网卡上的网络数据缓冲区的大小是固定且极小的，特别是与主内存相比。拷贝数据包的延迟会导致缓冲区溢出，导致传入的数据包淹没网卡的缓冲区，从而导致数据包丢失。在网络数据安全地进入主内存后，中断的工作就完成了，它可以将系统控制权交还给产生中断时被中断的代码。数据包的其余处理和操作将在后的下半部进行。在本章中，我们查看上半部；在下一章中，我们将学习下半部。\n\
  \n### 注册中断处理程序\n\n中断处理程序由管理硬件的驱动程序负责。每个设备有一个关联驱动程序，如果该设备使用中断（大多数设备都是如此），该驱动程序必须注册一个中断处理程序。\n\
  \n驱动程序可以使用 `request_irq()` 函数注册中断处理程序并启用指定的中断线进行处理，该函数定义在 `<linux/interrupt.h>`\
  \ 中：![image](img/p0116-01.jpg)\n\n第一个参数 `irq` 指定了要分配的中断号。对于某些设备（例如系统定时器或键盘等传统 PC\
  \ 设备），此值通常是硬编码的。对于大多数其他设备，它是通过探测或其他程序化方式动态确定的。\n\n第二个参数 `handler` 是指向处理此中断的实际中断处理函数的指针。每当操作系统接收到中断时，就会调用此函数。\n\
  \n```\ntypedef irqreturn_t (*irq_handler_t)(int, void *);\n```\n\n注意处理函数的特定原型：它接受两个参数，并返回\
  \ `irqreturn_t`。该函数将在本章稍后部分讨论。\n\n#### 中断处理程序标志\n\n第三个参数 `flags` 可以是零，也可以是 `<linux/interrupt.h>`\
  \ 中定义的一个或多个标志的位掩码。在这些标志中，最重要的是：\n\n- `IRQF_DISABLED`——设置时，该标志指示内核在执行此中断处理程序时禁用所有中断。未设置时，中断处理程序在除自身外所有中断开启的情况下运行。大多数中断处理程序都不会设置此标志，因为禁用所有中断是不良的做法。它被留给执行快速的性能敏感型中断。该标志是\
  \ `SA_INTERRUPT` 标志目前的体现，过去它用于区分“快”中断和“慢”中断。\n\n- `IRQF_SAMPLE_RANDOM`——此标志指定由设备产生的中断应对内核熵池。内核熵池提供来自各种随机事件的真随机数。如果指定了此标志，来自该设备的中断计时将作为熵输入池。如果你的设备以可预测的速率发出中断（例如系统定时器）或可能受到外部攻击者的影响（例如网络设备），则*不要*设置此标志。另一方面，大多数其他硬件在非确定时间产生中断，因此是良好的熵源。\n\
  \n- `IRQF_TIMER`——此标志指定该处理程序处理系统定时器的中断。\n\n- `IRQF_SHARED`——此标志指定中断线可以在多个中断处理程序之间共享。注册在给定线上的每个处理程序都必须指定此标志；否则每线只能存在一个处理程序。关于共享处理程序的更多信息将在后续章节提供。\n\
  \n第四个参数 `name` 是与中断相关的 ASCII 文本表示。例如，PC 键盘中断的此值为 `keyboard`。这些文本名称被 `/proc/irq`\
  \ 和 `/proc/interrupts` 用于与用户通信，这将在稍后讨论。\n\n\n\n\n第五个参数 `dev` 用于共享中断线。当一个中断处理程序被释放时（后文将讨论），`dev`\
  \ 会提供一个唯一的令牌（cookie），以便仅从中断线中移除所需的特定中断处理程序。如果没有这个参数，内核将无法在给定的中断线上知道移除*哪个*处理程序。如果该线不是共享的，可以在此处传递\
  \ `NULL`，但如果你的中断线是共享的，则必须传递一个唯一的令牌。（除非你的设备是那种运行在 ISA 总线上的陈旧老旧设备，否则它极可能支持共享。）此指针也会在每次调用时传递给中断处理程序。常见的做法是传递驱动程序的设备结构：此指针是唯一的，且在处理程序内部使用可能很有用。\n\
  \n执行成功后，`request_irq()` 返回 0。非零值表示错误，此时指定的中断处理程序未注册。常见的错误是 `-EBUSY`，表示给定的中断线已被占用（可能是当前用户，或者你没有指定\
  \ `IRQF_SHARED`）。\n\n注意，`request_irq()` 可能会睡眠，因此不能在中断上下文或其他代码不能阻塞的情况下调用。在不安全睡眠的情况下调用\
  \ `request_irq()` 是一个常见的错误。这部分是因为 `request_irq()` 能够阻塞的*原因*：这确实并不清楚。在注册时，`/proc/irq`\
  \ 中会创建一个与中断对应的条目。`proc_mkdir()` 函数创建新的 procfs 条目。该函数调用 `proc_create()` 来设置新的 procfs\
  \ 条目，而后者会调用 `kmalloc()` 来分配内存。正如你在第 12 章“内存管理”中所看到的，`kmalloc()` 可以睡眠。所以就是这样！\n\n\
  ### 中断示例\n\n在驱动程序中，请求中断线并安装处理程序是通过 `request_irq()` 完成：\n\n![image](img/p0117-01.jpg)\n\
  \n在这个示例中，`irqn` 是请求的中断线；`my_interrupt` 是处理程序；我们通过标志位指定该线是可以共享的；设备命名为 `my_device`；我们为\
  \ `dev` 传递了 `my_dev`。如果失败，代码将打印错误并返回。如果调用返回 0，则处理程序已成功安装。从那时起，处理程序将响应中断被调用。按照正确的顺序初始化硬件并注册中断处理程序至关重要，以防止中断处理程序在设备完全初始化之前运行。\n\
  \n## 释放中断处理程序\n\n当你的驱动程序卸载时，你需要注销中断处理程序并可能需要禁用中断线。要这样做，请调用\n\n```c\nvoid free_irq(unsigned\
  \ int irq, void *dev)\n```\n\n如果指定的中断线不是共享的，此函数将移除处理程序并禁用该线。如果中断线是共享的，将移除通过 `dev`\
  \ 识别的处理程序，但只有当最后一个处理程序被移除时才会禁用中断线。现在你可以知道为什么一个唯一的 `dev` 很了。对于共享中断线，需要一个唯一的令牌来区分存在同一条线上的多个处理程序，并使\
  \ `free_irq()` 仅移除正确的处理程序。无论何种情况（共享或非共享），只要 `dev` 不为 `NULL`，它必须与目标处理程序匹配。`free_irq()`\
  \ 必须从进程上下文调用。\n\n表 7.1 回顾了注册和注销中断处理程序的函数。\n\n表 7.1 中断注册方法\n\n![image](img/t0118-01.jpg)\n\
  \n## 编写中断处理程序\n\n以下是一个中断处理程序的声明：\n\n```c\nstatic irqreturn_t intr_handler(int irq,\
  \ void *dev)\n```\n\n注意，此声明与传递给 `request_irq()` 的 `handler` 参数的原型相匹配。第一个参数 `irq`\
  \ 是处理程序正在服务的的中断线的数值值。该值被传递给处理程序，但除了打印日志消息外，通常并不频繁使用。在 Linux 内核 2.0 版本之前，没有 `dev`\
  \ 参数，因此使用 `irq` 来区分使用相同驱动程序（因此使用相同中断处理程序）的多个设备。作为一个例子，可以考虑一台具有多个相同类型硬硬盘控制器的计算机。\n\
  \n第二个参数 `dev` 是指向在注册中断处理程序时传递给 `request_irq()` 的相同 `dev` 的通用指针。如果此值是唯一的（这是支持共享所要求的），它可以作为一个令牌，用来区分可能使用相同中断处理程序的多个设备。`dev`\
  \ 也可能指向中断处理程序使用的结构。由于 `device` 结构对每个设备都是唯一的，且在处理程序内部可能有用，因此通常将其传递给 `dev`。\n\n中断处理程序的返回值是特殊类型\
  \ `irqreturn_t`。中断处理程序可以返回两个特殊值：`IRQ_NONE` 或 `IRQ_HANDLED`。当中断处理程序检测到其设备并非源头的中断时，返回前者。如果中断处理程序被正确调用，且其设备确实导致了中断，则返回后者。或者，可以使用\
  \ `IRQ_RETVAL(val)`。如果 `val` 非零，该宏返回 `IRQ_HANDLED`。否则，宏返回 `IRQ_NONE`。这些特殊值用于让内核知道设备是否正在发出伪中断（即未请求的中断）。如果给定中断线上的所有中断处理程序都返回\
  \ `IRQ_NONE`，那么内核就能检测到该问题。注意这个奇怪的返回类型 `irqreturn_t`，它仅仅是一个 `int`。该值提供了与没有此功能的早期内核的向下兼容性；在\
  \ 2.6 之前，中断处理程序返回 `void`。驱动程序可以简单地将 `irqreturn_t` 重新定义为 `void`，然后在 2.4 中无需修改即可工作。中断处理程序通常标记为\
  \ `static`，因为永远不会从另一个文件直接调用它。\n\n中断处理程序的角色完全取决于设备及其发出中断的原因。至少，大多数中断处理程序需要向设备提供确认，证明它们已收到了中断。更复杂的设备还需要在中断处理程序中发送和接收数据并执行扩展工作。如所述，扩展工作尽可能地推到下半部（bottom\
  \ half）处理程序中，该部分将在下一章中讨论。\n\n## 重入性与中断处理程序\n\nLinux 中的中断处理程序不需要是重入的。当一个给定的中断处理程序执行时，相应的中断线在所有处理器上被屏蔽，防止接收同一条线上的另一个中断。通常情况下，所有其他中断都是开启的，因此其他中断会被处理，但当前线始终是禁用的。因此，同一个中断处理程序永远不会并发调用处理嵌套中断。这极大地简化了中断处理程序的编写。\n\
  \n### 共享处理程序\n\n共享处理程序的注册和执行与非共享处理程序类似。以下是三个主要区别：\n\n• 必须在传递给 `request_irq()` 的\
  \ `flags` 参数中设置 `IRQF_SHARED` 标志。\n\n• `dev` 参数必须对每个注册的处理程序是唯一的。指向任何每个设备结构的指针都足够了；常见的选择是\
  \ `device` 结构，因为它是唯一的且对处理程序可能有用。\n\n• 中断处理程序必须能够区分其设备是否真的生成了中断。这需要硬件支持以及中断处理程序中的关联逻辑。对于共享处理程序，你*不能*传递\
  \ `NULL`！\n\n\n\n\n\n所有共享同一中断线的驱动程序必须满足前面的要求。如果任何一个设备无法公平共享，则所有设备都不能共享该线路。当调用 `request_irq()`\
  \ 并指定 `IRQF_SHARED` 时，只有当该中断线当前未注册，或者该线上所有已注册的处理程序也指定了 `IRQF_SHARED` 时，调用才会成功。然而，共享处理程序可以混合使用\
  \ `IRQF_DISABLED`。\n\n当内核接收到中断时，它会顺序调用该线上每个注册的句程序。因此，处理程序必须能够区分某个中断是否是由其产生的，这一点非常重要。如果关联设备没有产生中断，处理程序必须快速退出。这要求硬件设备具有一个处理程序可以检查的状态寄存器（或类似的机制）。大多数硬件确实具有这种功能。\n\
  \n## 现实中的中断处理程序\n\n让我们来看位于 `drivers/char/rtc.c` 中的实时时钟（RTC）驱动程序的真实中断处理程序。许多机器（包括\
  \ PC）都有 RTC。它是一个独立于系统时器的设备，用于设置系统时钟、提供闹钟或提供周期定时器。在大多数架构上，系统时钟通过向特定寄存器或 I/O 范围写入的时间来设置。任何闹钟或周期定时器功能通常通过中断实现。中断等同于现实世界的闹钟：接收到中断类似于响响的闹钟声。\n\
  \n当 RTC 驱动程序加载时，会调用函数 `rtc_init()` 来初始化驱动程序。它的职责之一是注册中断处理程序：\n\n![image](img/p0120-01.jpg)\n\
  \n在这个示例中，中断线存储在 `rtc_irq` 中。该变量被设置为给定架构的 RTC 中断。在 PC 上，RTC 位于 IRQ 8。第二个参数是中断处理程序\
  \ `rtc_interrupt`，由于得益于 `IRQF_SHARED` 标志，它愿意与其他处理程序共享中断线。从第四个参数可以看到，驱动程序名称为 rtc。由于此设备共享了中断线，因此它为\
  \ `dev` 传递了一个每个设备唯一的值。\n\n最后，是处理程序本身：\n\n![image](img/p0121-01.jpg)\n\n每当机器接收到 RTC\
  \ 中断时，就会调用此函数。首先，注意自旋锁（spin lock）的调用：第一组确保了在 SMP 机器上不会有另一个处理器并发访问 `rtc_irq_data`，第二组保护\
  \ `rtc_callback` 免受相同影响。锁在第 10 章“内核同步方法”中讨论。\n\n`rtc_irq_data` 变量是一个 `unsigned long`，存储了关于\
  \ RTC 的信息，并在每次中断时更新以反映中断状态。\n\n接下来，如果设置了 RTC 周期定时器，将通过 `mod_timer()` 进行更新。定时器在第\
  \ 11 章“定时器和时间管理”中讨论。\n\n最后一段代码位于“now do the rest of the actions”注释下，它执行一个可能的预设回调函数。RTC\
  \ 驱动程序允许在每次 RTC 中断时注册并执行回调函数。\n\n最后，此函数返回 `IRQ_HANDLED` 表示它妥妥地处理了该设备。由于中断处理程序不支持共享，且\
  \ RTC 没有机制来检测虚假中断，因此该处理程序始终返回 `IRQ_HANDLED`。\n\n## 中断上下文\n\n在执行中断处理程序时，内核处于`中断上下文`（interrupt\
  \ context）。回想一下，进程上下文是内核代表进程执行时所的操作模式——例如，执行系统调用或运行内核线程。在进程环境中，`current` 宏指向关联的任务。此外，由于在进程上下文中进程与内核是耦合的，因此进程上下文可以睡眠或其他方式调用调度器。\n\
  \n另一方面，中断上下文与进程没有关联。`current` 宏是不相关的（尽管它指向被中断的进程）。由于没有后备进程，中断上下文无法睡眠——它将如何进行重新调度呢？因此，你不能从中断上下文调用某些函数。如果一个函数会睡眠，那么你就不能在你的中断处理程序中使用它——这限制了人们在中断处理程序中可以调用的函数。\n\
  \n中断上下文是对时间非常敏感的，因为中断处理程序会中断其他代码。代码应该是快速且简单的。可以进行忙等待（Busy looping），但并不建议这样做。这一点非常重要；始终要记住，你的中断处理程序中断了其他代码（甚至可能是另一条线路上的另一个中断处理程序！）。由于这种异步性质，所有中断处理程序都必须尽可能快速且简单。尽可能地，工作应该从中断处理程序中移出，并在更方便的时间在下半部（bottom\
  \ half）执行。\n\n中断处理程序栈的设置是一个配置选项。在历史上，中断处理程序并没有它们自己的栈。相反，它们会共享被中断的进程的栈。(1)内核栈的大小为两页；通常在\
  \ 32 位架构上为 8KB，在 64 位架构上为 16KB。由于在这种设置下中断处理程序共享栈，因此它们对在那里分配的数据必须极其吝啬。当然，内核栈本身就是有限的，因此所有内核代码都应该谨慎。\n\
  \n*进程始终在运行。当没有其他可调度的任务时，空闲任务运行。*\n\n在 2.6 内核进程早期，增加了一个选项将栈大小从两页减少到一页，在 32 位系统上仅提供\
  \ 4KB 的栈。这减少了内存压力，因为以前系统上的每个进程都需要两页连续的不可分配内核内存。为了应对栈大小的减少，中断处理程序被赋予了它们栈，每个处理器一个，大小为一页。这个栈被称为`中断栈`。虽然中断栈的总尺寸是原始栈的一半，但平均可用栈更大，因为中断处理程序获得了整页的专属内存。\n\
  \n你的中断处理程序不应该关心在使用什么栈设置或内核栈的大小。始终使用极少量的栈空间。\n\n## 实现中断处理程序\n\n可能并不意外，Linux 中断处理系统的实现取决于架构。实现取决于处理器、使用的中断控制器的类型以及架构和机器的设计。\n\
  \n图 7.1 是中断通过硬件和内核路径的图表。\n\n图 7.1 中断从硬件并经过内核的路径。\n\n![image](img/07fig01.jpg)\n\n\
  设备通过其总线向中断控制器发送电信号来发出中断。如果中断线已启用（可以被屏蔽），中断控制器会将中断发送给处理器。在大多数架构上，这是通过向处理器的特殊引脚发送电信号来实现的。除非处理器中禁用了中断（也会发生），否则处理器立即停止正在的工作，禁用中断系统，并跳转到内存中的预定义位置并执行那里的代码。这个预定义点由内核设置，是中断处理程序的`入口点`（entry\
  \ point）。\n\n\n\n\n中断在内核中的旅程从这个预定义的入口点，就像系统调用通过预定义的异常处理程序进入内核一样。对于每一条中断线，处理器都会跳转到内存中的一个唯一位置并执行那里的代码。通过这种方式，内核知道了入站中断的\
  \ IRQ 编号。初始入口只是简单地保存此数值，并将当前的寄存器值（属于被中断的任务）存储在栈上；然后，内核调用 `do_IRQ()`。从这里开始，大部分的中断处理代码都是用\
  \ C 语言编写的；然而，它们仍然依赖于特定的架构。\n\n`do_IRQ()` 函数声明如下：\n\n```c\nunsigned int do_IRQ(struct\
  \ pt_regs regs)\n```\n\n由于 C 语言约定将函数参数放在栈的顶端，`pt_regs` 结构体包含了之前在汇编入口程序中保存的初始寄存器值。由于中断值也被保存了，`do_IRQ()`\
  \ 可以提取出它。在计算出中断线后，`do_IRQ()` 确认收到中断并禁用该线上的中断递送。在普通的 PC 机器上，这些操作由 `mask_and_ack_8259A()`\
  \ 处理。\n\n接下来，`do_IRQ()` 确保在该线上注册了有效的处理程序，并且该处理程序处于启用状态且当前没有在执行。如果是这样，它会调用定义 `kernel/irq/handler.c`\
  \ 中的 `handle_IRQ_event()` 来运行该线已安装的中断处理器。\n\n![image](img/p0124-01.jpg)\n\n![image](img/p0124-02.jpg)\n\
  \n![image](img/p0125-01.jpg)\n\n首先，由于处理器禁用了中断，除非在注册处理程序时指定了 `IRQF_DISABLED`，否则中断会被重新开启。请记住，`IRQF_DISABLED`\
  \ 指定处理程序必须在中断禁用的情况下运行。接下来，每个潜在的处理程序都会在一个循环中执行。如果该线不是共享的，循环将在第一次迭代后终止。否则，所有的处理程序都将被执行。之后，如果在注册时指定了\
  \ `IRQF_SAMPLE_RANDOM`，就会调用 `add_interrupt_randomness()`。该函数利用中断的时机为随机数生成器产生熵。最后，中断再次被禁用（`do_IRQ()`\
  \ 期望它们仍然关闭状态），然后函数返回。回到 `do_IRQ()` 中，函数进行清理并返回初始入口点，然后该点跳转到 `ret_from_intr()`。\n\
  \n例程 `ret_from_intr()` 与初始入口代码一样，是用汇编编写的。该例程检查是否有待处理的重新调度。（回想第 4 章 “进程调度”，这这意味着\
  \ `need_resched` 被设置为真）。如果存在待处理的重新调度，且内核正在返回用户空间（即中断中断了一个用户进程），则会调用 `schedule()`。如果内核正在返回内核空间（即中断中断了内核本身），则只有在\
  \ `preempt_count` 为 0 时才会调用 `schedule()`。否则，抢占内核是不安全的。在 `schedule()` 返回后，或者如果没有待处理的任务，初始寄存器将得到恢复，内核将恢复之前任何被中断的任务。\n\
  \n在 x86 上，初始的汇编程序位于 `arch/x86/kernel/entry_64.S`（32 位 x86 使用 `entry_32.S`），C 方法位于\
  \ `arch/x86/kernel/irq.c`。其他支持的架构也类似。\n\n### `/proc/interrupts`\n\n*Procfs* 是一个虚拟文件系统，仅存在于内核内存中，通常挂载在\
  \ `/proc`。在 procfs 中读取或写入文件会调用内核函数，模拟对真实文件进行读取或写入操作。一个相关的例子是 `/proc/interrupts`\
  \ 文件，它填充了与系统中断相关的统计数据。这里是一个单处理器 PC 的示例输出：\n\n![image](img/p0126-01.jpg)\n\n第一列是中断线。在该系统上，存在编号为\
  \ 0–2、4、5、12 和 15 的中断。未显示的行线上没有安装处理程序。第二列是接收到的中断数量计数器。系统中的每个处理器都有对应列，但这台机器只有一个处理器。如你所见，定时中断已接收\
  \ 3,602,371 次中断，^(2)，而声卡（EMU10K1）没有收到任何中断（这表明自机器启动以来一直未未使用）。第三列是处理此中断的中断控制器。`XT-PIC`\
  \ 对应标准的 PC 可编程中断控制器。在带有 I/O APIC 的系统上，大多数中断会列出 `IO-APIC-level` 或 `IO-APIC-edge`\
  \ 作为其中断控制器。最后，最后一列是与此中断相关的设备。该名称由之前讨论过的传递 `request_irq()` 的 `devname` 参数提供。如果中断是共享的（例如示例中的中断号\
  \ 4），则注册在该中断上的所有设备都会被列出。\n\n^(2) *作为一个练习，在读完第 11 章 后，根据已发生的定时器中断数量，你能判断系统运行了多久（以\
  \ `HZ` 为单位）吗？*\n\n对于好奇的人，procfs 代码主要位于 `fs/proc`。提供 `/proc/interrupts` 的函数同样依赖架构，并名为\
  \ `show_interrupts()`。\n\n### 中断控制\n\nLinux 内核实现了一系列用于操作中断状态的接口。这些接口允许你禁用当前处理器的中断系统或为整个机器屏蔽中断线。这些例程都依赖架构，可以在\
  \ `<asm/system.h>` 和 `<asm/irq.h>` 中找到。请参见本章后面的表 7.2 的完整列表。\n\n表 7.2 中断控制方法\n\n\
  ![image](img/t0130-01.jpg)\n\n控制中断的原因通常源于需要同步。通过禁用中断，你可以保证处理程序不会抢占你的当前代码。此外，禁用中断也会禁用内核抢占。然而，禁用中断传递或禁用内核抢占无法防止来自另一个处理器的并发访问。由于\
  \ Linux 支持多处理器，内核代码通常需要获取某种锁以防止另一个处理器访问共享数据。这些锁通常与禁用本地中断一起获取。锁提供了防止另一个处理器并发访问的保护，而禁用中断提供了防止来自可能的处理程序的访问保护。第\
  \ 9 章和第 10 章讨论了各种同步问题及其解决方案。尽管如此，理解内核中断接口是非常关重要的。\n\n#### 禁用和启用中断\n\n要在本地（仅限当前处理器）禁用中断并在稍后启用，请执行以下操作：\n\
  \n```c\nlocal_irq_disable();\n\n/* 中断已禁用 .. */\n\nlocal_irq_enable();\n```\n\n这些函数通常实现为单个汇编操作。（当然，这取决于架构。）事实上，在\
  \ x86 上，`local_irq_disable()` 是简单的 `cli`，而 `local_irq_enable()` 是简单的 `sti` 指令。`cli`\
  \ 和 `sti` 分别是*清除*和*设置**允许中断*标志的汇编调用。也就是说，它们在发射处理器上禁用和启用中断递送。\n\n\n\n\n如果 `local_irq_disable()`\
  \ 例程如果在调用其**之前**中断已经处于禁用状态，它是危险的。相应的 `local_irq_enable()` 调用会无条件地启用中断，尽管它们最初是关闭的。相反，需要一种机制将中断恢复到之前的状态。这是一个常见的问题，因为取决于调用链，内核中的某条代码路径既可以在中断已开启的情况下访问，也可以在中断未开启的情况下访问。例如，假设之前的代码片段是一个大函数的一部分。假设该函数被另外两个函数调用，其中一个禁用了中断而另一个没有。随着内核规模和复杂性的增长，要了解所有通向某个函数的代码路径变得越来越困难，因此在禁用中断之前保存中断系统的状态要安全得得多。然后，当你准备好重新启用中断时，只需将它们恢复到原始状态即可：\n\
  \n![image](img/p0128-01.jpg)\n\n请注意，这些方法至少部分是以宏的形式形式的，因此 `flags` 参数（必须定义为 `unsigned\
  \ long`）似乎是按值传递的。该参数包含中断系统状态的特定体系相关数据。由于至少有一个支持的架构将栈信息包含在值中（咳，SPARC），`flags` **不能**传递给另一个函数（具体来说，它必须留在同一个栈帧中）。由于因此，保存中断的调用和恢复中断的调用必须在同一个函数中发生。\n\
  \n之前的所有函数都可以从中断上下文和进程上下文调用。\n\n### 不再有全局 `cli()`\n\n内核以前提供过一种方法来禁用系统中**所有**处理器的中断。此外，如果另一个处理器调用了此方法，它必须等待到中断启用后才能继续。此函数命名为\
  \ `cli()`，相应的启用调用命名为 `sti()`——尽管存在于所有架构，但这种命名非常以 x86 为中心。这些接口在 2.5 版本期间被弃用，因此现在所有的中断同步都必须使用本地中断控制和自旋锁的组合（在第\
  \ 9 章）“内核同步导论”中讨论过）。这意味着以前只需要通过全局禁用中断来确保对共享数据互斥访问的代码，现在需要多做一点工作。\n\n以前，驱动程序编写者可以假设在他们的中断处理程序以及任何其他访问共享数据的地方使用的\
  \ `cli()` 会提供互斥。`cli()` 调用将确保没有其他中断处理程序（以及它们特定的处理程序）运行。此外，如果另一个处理器进入了受 `cli()`保护的区域，在原始处理器通过调用\
  \ `sti()` 退出 `cli()` 保护区域之前，它不会继续。\n\n移除全局 `cli()` 有若干优点。首先，它迫使驱动程序编写者实现真正的锁。具有特定目的的细粒度锁比全局锁更快，而\
  \ `cli()` 实际上就是全局锁。其次，移除操作简化了中断系统中的许多代码并删除了更多。结果是变得更加简单且易于理解。\n\n### 禁用特定的中断线\n\n\
  在上一节中，我们查看了禁用整个处理器所有中断交付的函数。在某些情况下，仅为**整个**系统禁用一条**特定的**中断线是有用的。这被称为“屏蔽”（*masking\
  \ out*）一条中断线。例如，你可能想在操作设备状态之前禁用该设备的中断交付。Linux 为此任务提供了四个接口：\n\n```c\nvoid disable_irq(unsigned\
  \ int irq);\nvoid disable_irq_nosync(unsigned int irq);\nvoid enable_irq(unsigned\
  \ int irq);\nvoid synchronize_irq(unsigned int irq);\n```\n\n前两个函数在中断控制器中禁用指定的中断线。这禁用了向系统中**所有**处理器交付给定中断的交付。此外，`disable_irq()`\
  \ 函数在任何正在执行的处理程序完成之前不会返回。因此，调用者不仅可以确保新中断不会在给定的线上传递，还确保了任何正在执行的处理程序已经退出。`disable_irq_nosync()`\
  \ 函数不等待当前处理程序完成。\n\n`synchronize_irq()` 函数在返回之前会等待特定的中断处理程序退出（如果它正在执行的话）。\n\n对这些函数的调用是嵌套的。对于给定的中断线上的每次调用\
  \ `disable_irq()` 或 `disable_irq_nosync()`，都需要相应的 `enable_irq()` 调用。只有在最后一次调用 `enable_irq()`\
  \ 时，中断线才会被实际启用。例如，如果 `disable_irq()` 被调用了两次，那么在第二次调用 `enable_irq()` 之前，中断线实际上不会被重新启用。\n\
  \n这三个函数都可以从中断上下文或进程上下文调用，且不会睡眠。如果从中断上下文调用，请小心！例如，你不想在处理某条中断线时启用它。（记住，处理程序的中断线在被处理期间是被屏蔽的。）\n\
  \n禁用多个中断处理程序之间共享的中断线是相当无礼的。禁用该线会禁用该线上**所有**设备的中断交付。因此，较新设备的驱动程序往往不使用这些接口^(3)。因为\
  \ PCI 设备必须根据规范支持中断线共享，它们不应该使用这些接口。因此，`disable_irq()` 及其同类函数更多出现在旧式设备的驱动程序中，例如 PC\
  \ 并行端口。\n\n^(3) *许多旧设备设备，特别是 ISA 设备，不提供获取它们是否生成了中断的方法。因此，ISA 设备的中断线通常无法共享。由于 PCI\
  \ 规范强制共享中断，现代 PCI 设备支持中断共享。*\n\n### 中断系统的状态\n\n中断系统的状态（例如，中断是否启用）或你当前是否在中断文中执行通常是有用的。\n\
  \n`irqs_disabled()` 宏定义在 `<asm/system.h>` 中，如果本地处理器的中断系统被禁用，则返回非零。否则返回 0。\n\n两个定义在\
  \ `<linux/hardirq.h>` 中的宏提供了检查内核当前上下文的接口。它们是：\n\n```c\nin_interrupt()\nin_irq()\n\
  ```\n\n第一个用第一个：如果内核正在执行任何类型的中断处理，它返回非零。这包括执行中断处理程序或下半部处理程序。宏 `in_irq()` 只在内核专门执行中断处理程序时返回非零。通常你想检查是否在进程文中。也就是说，你想确保自己**不在**中断文中。这种情况通常是因为代码想要执行某些只能在进程文中执行的操作，例如睡眠。如果\
  \ `in_interrupt()` 返回 0，则内核在进程文中。\n\n是的，这些名字很困惑，并且没能传达它们的含义。表 7.2 是中断控制方法及其描述的总结。\n\
  \n### 总结\n\n本章查看了中断，这是设备用于异步信号处理器的硬件资源。实际上，中断是硬件用来*中断*操作系统的。\n\n\n\n\n\n大多数现代硬件使用中断来与操作系统通信。管理特定硬件的设备驱动会注册一个中断处理程序，以响应并处理由其关联硬件发出的中断。在中断中执行的工作包括确认和重置硬件、将数据从设备拷贝到主内存（反之亦然）、处理硬件请求以及发送新的硬件请求。\n\
  \n内核提供了用于注册和注销中断处理程序、禁用中断、屏蔽中断线以及检查中断系统状态的接口。表 7.2 提供了其中许多函数的概述。\n\n由于中断会中断其他正在执行的代码（进程、内核本身，甚至其他中断处理程序），因此它们必须快速执行。然而，通常会有大量工作需要完成。为了在大量工作量与快速执行的需求之间取得平衡，内核将处理中断的工作分成了两部分。中断处理程序被称为“上半部分”（top\
  \ half），已在本章节中讨论过。下一章将介绍“下半部分”（bottom half）。\n\n## 8. 下半部分与工作推迟\n\n上一章讨论了中断处理程序，这是内核处理硬件中断的机制。中断处理程序是任何操作系统中重要的——事实上是必须的——部分。然而，由于各种限制，中断处理程序只能构成任何中断处理方案的第一部分。这些限制包括：\n\
  \n- 中断处理程序是异步运行，因此会中断其他可能重要的代码，包括其他中断处理程序。因此，为了避免让被中断的代码停顿过久，中断处理程序需要尽可能快地运行。\n\
  - 中断处理程序运行时，最好的情况是禁用了当前中断（如果未设置 `IRQF_DISABLED`），最坏的情况（如果设置了 `IRQF_DISABLED`）则是禁当前处理器上的所有中断。由于禁用中断会防止硬件与操作系统通信，因此中断处理程序需要尽可能快地运行。\n\
  - 中断处理程序通常对时间非常敏感，因为它们处理的是硬件。\n- 中断处理程序不运行在进程上下文中；因此，它们不能阻塞。这限制了它们能做的事情。\n\n现在显而易见，中断处理程序只是管理硬件中断解决方案的一个部分。操作系统确实需要一种快速、异步、简单的机制，来立即响应硬件并执行任何对时间敏感的操作。中断处理程序很好地履行了这一功能；但其他不那么关键的工作也可以并且应该推迟到中断启用的后续时间点执行。\n\
  \n因此，管理中断被分为两个部分，或两个半部分。第一部分中断处理程序（上半部分）由内核在响应硬件中断时立即异步执行，正如上一章所述。本章将介绍中断方案的第二部分：下半部分。\n\
  \n### 下半部分\n\n下半部分的任务是执行任何未由中断处理程序完成的与中断相关的工作。在理想的世界中，这几乎是所有工作，因为你希望中断处理程序尽可能少地工作（相应地运行尽可能快）。通过将尽可能多的工作卸到下半部分，中断处理程序可以尽快将系统控制权还给被它中断的对象。\n\
  \n尽管如此，中断处理程序必须执行某些工作。例如，中断处理程序几乎肯定需要向硬件确认已收到中断。它可能需要向硬件或从硬件拷贝数据。这项工作对时间敏感，因此在中断处理程序中执行它是有意义的。\n\
  \n几乎任何其他工作都可以在下半部分执行。例如，如果你在上半部分将数据从硬件拷贝到内存，那么在下半部分对其进行处理显然是有意义的。遗憾的是，对于在何处执行什么工作并没有硬性规定——决定完全取决于设备驱动程序的作者。虽然没有哪种安排是违法的，但某种安排可能是次优的。记住，中断处理程序是异步运行的，至少禁用了当前的中断线。最小化它们的持续时间至关重要。虽然并不总是清楚如何在上半部分和下半部分之间划分工作，但有一些实用的技巧有所帮助：\n\
  \n- 如果工作对时间敏感，请在中断处理程序中执行。\n- 如果工作与硬件相关，请在中断处理程序中执行。\n- 如果工作需要确保另一个中断（特别是同一个中断）不会中断它，请在中断处理程序中执行。\n\
  - 对于其他所有工作，考虑在下半部分执行该项工作。\n\n在尝试编写自己的设备驱动程序时，查看其他中断处理程序及其对应的下半部分会有帮助。在决定如何在这半部分和下半部分之间划分你的中断处理工作时，问问自己哪些必须放在上半部分，哪些可以放在下半部分。通常，中断处理程序执行得越快越好。\n\
  \n### 为什么需要下半部分？\n\n理解为什么要推迟工作以及确切何时推迟至关重要。你想限制在中断处理程序中执行的工作量，因为中断处理程序在所有处理器上运行时都禁用了当前中断。更糟糕的是，注册了\
  \ `IRQF_DISABLED` 的处理器运行时会禁用本地处理器上的所有中断线，并禁用所有处理器上的当前中断线。最小化禁用中断的时间对于系统响应和性能至关重要。再加上中断处理程序相对于其他代码（甚至是其他中断处理程序）是异步运行的，很显然，你应该努力尽量缩短中断处理程序的运行时间。处理传入的网络流量不应阻止内核接收按键。解决方案是将部分工作推迟到以后。\n\
  \n但“以后”是什么时候呢？重要的是意识到以后往往意味着不是现在。下半部分的意义不是在未来的某个特定点执行工作，而是将工作推迟到未来系统不忙且中断再次启用的任何点。通常，下半部分在中断返回后立即运行。关键在于它们在所有中断启用的情况下运行。\n\
  \nLinux 并不是将硬件中断处理分为两部分的唯一标准；大多数操作系统都是如此。上半部分快速且简单，在禁用部分或全部中断的情况下运行。下半部分（无论如何实现）在稍后在所有中断启用的情况下运行。这种设计通过仅在需要的时间内禁用中断运行，保持了低系统延迟。\n\
  \n#### 下半部分的世界\n\n与完全通过中断处理程序实现的上半部分不同，有多种机制可以实现下半部分。这些机制是允许你实现下半部分的不同接口和子系统。上一章只查看了实现中断处理程序的一种方法，而本章将查看实现下半部分的方法。在\
  \ Linux 的发展史上，出现过许多下半部分机制。令人困惑的是，其中某些机制的名字相似甚至非常愚蠢。这需要一种特殊的程序员来为下半部分命名。\n\n本章将讨论\
  \ `2.6` 中存在的下半部分机制的设计和实现。我们还讨论了如何在你编写的内核代码中使用它们。旧的但早已被移除的下半部分机制在历史上具有重要意义，因此在相关时会被提及。\n\
  \n##### 原始的“下半部分”\n\n\n\n\n起初，Linux 仅提供了用于实现“下半部”（bottom halves）的机制。这个名字是有逻辑的，因为在当时这是延迟工作的唯一手段。该基础设施也被称为\
  \ `BH`，为了避免与通用术语 `bottom half` 混淆，我们将这样称呼它。`BH` 非常简单，就像过去的老样子一样。它为整个系统提供了一个静态创建的\
  \ 32 个下半部列表。上半部（top half）可以通过在一个 32 位整数中设置一个位来标记下半部是否会运行。每个 `BH` 都是全局同步的。没有两个 `BH`\
  \ 可以同时运行，即使在不同的处理器上也是如此。这很容易用但缺乏灵活性；方法简单，却是一个瓶颈。\n\n### 任务队列 (Task Queues)\n\n后来，内核开发者引入了\
  \ `taskqueues`，既作为延迟工作的方法以及 `BH` 机制的替代品。内核定义了一系列队列。每个队列包含一个待调用函数的链表。队列中的函数根据其所在的队列在特定时间运行。驱动程序可以在相应的队列中注册它们的下半部。这种工作效果相当不错，但要完全替换\
  \ `BH` 接口仍然太不灵活。对于网络等对性能敏感的子系统，它也不够轻量。\n\n### 软中断 (Softirqs) 和 任务单元 (Tasklets)\n\
  \n在 2.3 开发期间，内核开发者引入了 `softirqs` 和 `tasklets`。除了与现有驱动程序的兼容性外，`softirqs` 和 `tasklets`\
  \ 可以完全替换 `BH` 接口。`softirqs` 是一组静态定义的下半部，可以在任何处理器上同时运行；即使是相同类型的也可以并发运行。`tasklets`\
  \ 的名字非常糟糕且误解，它是构建在 `softirqs` 之上的灵活、动态创建的下半部。两个不同的 tasklet 可以在不同的处理器上并发运行，但两个相同类型的\
  \ tasklet 不能同时运行。因此，tasklet 是在性能和易用性之间的一种很好的折中。对于大多数下半部处理，tasklet 就足够了。在性能对得至关重要的情况下（如网络传输），`softirqs`\
  \ 是很有用的。然而，使用 `softirqs` 需要更加小心，因为两个相同的 `softirq` 可以同时运行。此外，`softirqs` 必须在编译时静态注册。相反，代码可以动态注册\
  \ tasklets。\n\n*将 `BHs` 转换为 `softirqs` 或 `tasklets` 并非易事，因为 `BHs` 是全局同步的，因此假设在执行期间没有其他\
  \ `BH` 在运行。然而，这种转换最终在 2.5 版本中实现了。*\n\n*它们与任务（tasks）没有任何关系。把 tasklet 想成一个简单易用的 softirq\
  \ 即可。*\n\n为了让问题变得更加复杂，有些人将所有下半部都称为软件中断或 `softirqs`。换句话说，他们将 `softirq` 机制和泛指下半部统称为\
  \ `softirqs`。忽略这些人吧。他们和命名 `BH` 以及 tasklet 机制的那群人是一类。\n\n在开发 2.5 内核时，`BH` 接口最终被抛弃了，因为所有\
  \ `BH` 用户都已转换到其他下半部接口。此外，任务队列接口被工作队列（work queue）接口所取代。工作队列是一种简单而实用的工作队列方法，用于稍后在进程上下文中执行工作。我们稍后会介绍它们。\n\
  \n因此，今天的 2.6 内核有三种下半部机制：`softirqs`、`tasklets` 和工作队列。旧的 `BH` 和任务队列接口已成为仅仅的记忆。\n\n\
  ### 内核定时器 (Kernel Timers)\n\n另一种延迟工作的机制是 `kernel timers`。与本章为止讨论的机制不同，定时器根据指定的时间延迟工作。也就是说，虽然本章讨论的工具可以将工作延迟到*现在以外的任何时间*，但你使用定时器是将工作延迟到至少经过某个特定时间。\n\
  \n因此，定时器的用途与本章讨论的通用机制不同。关于定时器的详细讨论见 `第 11 章`，“定时器与时间管理”。\n\n### 消除混淆\n\n这些是一些非常令人困惑的内容，但实际上只涉及命名问题。让我们重回顾。\n\
  \n`Bottom half`（下半部）是一个通用的操作系统术语，指中断处理的延迟部分，之所以这样命名是因为代表了中断处理方案的第二个（或底部）部分。在 Linux\
  \ 中，这个术语目前也有这个含义。内核所有延迟工作的机制都是“下半部”。有些人也混淆地将所有下半部称为“softirqs”。\n\n`Bottom half`\
  \ 也指 Linux 中原始的延迟工作机制。这种机制也被称为 `BH`，所以我们现在这样称呼它，并将前一个作为通用的描述。`BH` 机制在一段时间以前就被弃用了，并在\
  \ 2.5 开发内核系列中完全移除。\n\n目前，存在三种延迟工作的方法：`softirqs`、`tasklets` 和工作队列。Tasklets 构建在 `softirqs`\
  \ 之上，而工作队列是它们自己的子系统。`表 8.1` 展示了下半部的历史。\n\n表 8.1 下半部状态\n\n![image](img/t0137-01.jpg)\n\
  \n解决了这些命名混淆后，让我们来看看具体的机制。\n\n### 软中断 (Softirqs)\n\n讨论实际的下半部方法，应该从 `softirqs` 开始。`softirqs`\
  \ 很少被直接使用；tasklets 是更常见的下半部形式。尽管如此，由于 tasklets 是构建在 `softirqs` 之上的，我们首先介绍它们。软 irq\
  \ 代码位于 `kernel/softirq.c`。\n\n#### 实现软中断\n\nSoftirqs 在编译时静态分配。与 tasklets 不同，你不能动态注册\
  \ softirqs。`softirqs` 由 `softirq_action` 结构体表示，该结构定义在 `<linux/interrupt.h>` 中：\n\
  \n```c\nstruct softirq_action {\n    void (*action)(struct softirq_action *);\n\
  };\n```\n\n在 `kernel/softirq.c` 中声明了该结构体的 32 项项数组：\n\n```c\nstatic struct softirq_action\
  \ softirq_vec[NR_SOFTIRQS];\n```\n\n每个注册的 softirq 占用数组中的一个项。因此，有 `NR_SOFTIRQS` 个注册的\
  \ softirqs。注册 softirqs 的数量在编译时静态确定且不能更改。内核强制执行 32 个注册 softirqs 的限制；但在当前内核中，存在 9\
  \ 个。\n\n#### 软中断处理程序 (The Softirq Handler)\n\n软中断处理程序 `action` 的原型如下：\n\n```c\n\
  void softirq_handler(struct softirq_action *)\n```\n\n当内核运行软中断处理程序时，它执行该 `action`\
  \ 函数，并将相应的 `softirq_action` 结构指针作为唯一参数传递。例如，如果 `my_softirq` 指向 `softirq_vec` 数组中的一项，内核将如下方式调用软中断处理程序：\n\
  \n```c\nmy_softirq->action(my_softirq);\n```\n\n内核将整个结构传递给软中断处理程序似乎有点奇怪。这种技巧允许向结构添加未来内容，而无需更改每个软中断处理程序。\n\
  \n软中断从不抢占另一个软中断。能够抢占软中断的事件只有中断处理程序。然而，另一个软中断——即使是同一个——可以在另一个处理器上运行。\n\n#### 执行软中断\n\
  \n注册的 softirq 在执行之前必须被标记。这被称为*产生软中断（raising the softirq）。通常，中断处理程序在返回之前标记其软中断待执行。然后，在适当的时间，软中断就会运行。挂起的的软中断会在以下位置被检查并执行：\n\
  \n- 从硬件中断代码路径返回时\n- 在 `ksoftirqd` 内核线程中\n\n\n\n\n• 在任何显式检查并执行挂起的软中断（softirqs）的代码中，例如网络子系统。\n\
  \n无论调用方式如何，softirq 的执行都发生在 `__do_softirq()` 中，它由 `do_softirq()` 调用。该函数非常简单。如果有挂起的\
  \ softirq，`__do_softirq()` 会遍历每一个 softirq 并调用其处理程序。让我们来看 `__do_softirq()` 中重要部分的简化变：\n\
  \n![image](img/p0139-01.jpg)\n\n这段代码段是 softirq 处理的核心。它检查并执行任何挂起的 softirq。具体步骤如下：\n\
  \n1. 它将局部变量 `pending` 设置为 `local_softirq_pending()` 宏返回的值。这是一个表示挂起的 softirq 的 32\
  \ 位掩码——如果位 `n` 被设置，则表示第 `n` 个 softirq 处于挂起状态。\n2. 现在既然 softirq 的挂起位掩码已保存，它就会清除实际的掩码。*这实际上是在禁用本地中断的情况下发生的，但在这个简化示例中省略了。如果中断没有禁用，那么在保存掩码和清除掩码之间的间隔时间内可能会触发一个\
  \ softirq（从而处于挂起状态）。这将导致错误地清除了一个挂起位。*\n3. 指针 `h` 被设置为 `softirq_vec` 中的第一个条目。\n4.\
  \ 如果 `pending` 的第一位被设置，则调用 `h->action(h)`。\n5. 指针 `h` 加 1，因此它现在指向 `softirq_vec`\
  \ 数组中的第二个条目。\n6. 位掩码 `pending` 向右移动一位。这会丢弃第一位并将所有其他位向右移动一位。因此，原来的第二位现在变成了第一位（依此类推）。\n\
  7. 指针 `h` 现在指向数组中的第二个条目，而 `pending` 位掩码现在将第二位作为第一位。重复之前的步骤。\n8. 继续重复直到 `pending`\
  \ 为 0，此时没有更多挂起的 softirq，工作完成。请注意，此检查足以确保 `h` 始终指向 `softirq_vec` 中的有效条目，因为 `pending`\
  \ 最多有 32 个设置位，因此此循环最多执行 32 次。\n\n### 使用 Softirqs\n\nSoftirqs 留给系统上对时间最敏感且最重要的下半部处理。目前，只有两个子系统——网络和块设备——直接使用\
  \ softirqs。此外，内核定时器和 tasklets 是构建在 softirqs 之上的。如果你添加了一个新的 softirq，你通常会问自己，为什么使用\
  \ tasklet 不够用。Tasklets 是动态创建的，由于其锁定要求较低而更容易使用，而且性能仍然非常好。尽管如此，对于能够以高效方式进行自锁的时间敏感型应用，softirqs\
  \ 可能是正确的解决方案。\n\n### 分配索引\n\n你可以在编译时通过 `<linux/interrupt.h>` 中的 `enum` 静态地声明 softirqs。内核使用这个索引（从零开始）作为相对优先级。数值优先级低的\
  \ softirq 在数值优先级高的 softirq 之前执行。\n\n创建一个新的 softirq 包括向此 `enum` 中添加新条目。在添加新的 softirq\
  \ 时，你可能不想像在其他地方那样简单地将条目添加到列表末尾。相反，你需要根据你想赋予它的优先级来插入新条目。按照习惯，`HI_SOFTIRQ` 始终是第一个，`RCU_SOFTIRQ`\
  \ 始终是最后一个条目。新条目可能属于 `BLOCK_SOFTIRQ` 和 `TASKLET_SOFTIRQ` 之间。表 8.2 包含了现有 tasklet 列表。\n\
  \n表 8.2 Softirq 类型\n\n![image](img/t0140-01.jpg)\n\n### 注册你的处理程序\n\n接下来，softirq\
  \ 处理程序通过 `open_softirq()` 在运行时注册，该函数接受两个参数：softirq 的索引和它的处理函数。例如，网络子系统在 `net/core/dev.c`\
  \ 中这样注册它的 softirqs：\n\n```\nopen_softirq(NET_TX_SOFTIRQ, net_tx_action);\nopen_softirq(NET_RX_SOFTIRQ,\
  \ net_rx_action);\n```\n\nsoftirq 处理程序在中断开启的情况下运行，且不能睡眠。在处理程序运行时，当前处理器上的 softirqs\
  \ 会被禁用。然而，另一个处理器可以执行其他的 softirqs。如果同一个 softirq 在执行期间再次被触发，另一个处理器可以同时运行它。这意味着任何共享数据——即使是仅在\
  \ softirq 处理程序内部使用的全局数据——都需要适当的锁定（在接两个章节中讨论）。这是一个重要点，这也是通常倾向于使用 tasklets 的原因。仅仅防止你的\
  \ softirqs 并发运行是不理想。如果一个 softirq 获取了锁以防止其另一个实例同时运行，那么就没有理由使用 softirq 了。因此，大多数 softirq\
  \ 处理程序都诉诸于每个处理器的数据（每个处理器特有的数据，因此不需要锁定）和其他技巧来避免显式锁定并提供极的可扩展性。\n\nsoftirqs 的*存在意义*（raison\
  \ d’être）是可扩展性。Tasklets 本质上是多个实例不能并发运行的 softirqs。\n\n### 触发你的 Softirq\n\n在 softirq\
  \ 添加到 `enum` 并通过 `open_softirq()` 注册后，它就准备好运行了。为了将其标记为挂起，以便在下一次执行 softirqs 时运行，调用\
  \ `raise_softirq`。\n\n```\nraise_softirq(NET_TX_SOFTIRQ);\n```\n\n这触发了 `NET_TX_SOFTIRQ`\
  \ softirq。它的处理程序 `net_tx_action()` 在下一次执行 softirqs 时运行。该函数在触发 softirq 之前禁用中断，然后恢复到之前的状态。如果中断已经禁用，可以使用函数\
  \ `raise_softirq_iroff()` 作为一种小优化。例如\n\n```\n/* 中断已经禁用\n */\nraise_softirq_iroff(NET_TX_SOFTIRQ);\n\
  ```\n\nsoftirqs 通常由中断处理程序触发。在中断处理程序的情况下，它执行硬件相关的工作，触发 softirq 然后退出。处理中断时，内核调用 `do_softirq()`。softirq\
  \ 然后从中断处理程序停止的地方继续执行。在这个例子中，“上半部”和“下半部”的命名是合理的。\n\n## Tasklets\n\nTasklets 是构建在\
  \ softirqs 之上的下半部机制。如前所述，它们与任务无关。Tasklets 的性质和行为类似于 softirqs；但它们具有更简单的接口和锁定规则。\n\
  \n作为设备驱动程序作者，选择使用 softirqs 还是 tasklets 的决策很简单：你几乎总是应该使用 tasklets。正如我们在上一节中看到的，softirqs\
  \ 的用户几乎可以用手指数出来。softirqs 仅用于高频和高度线程化的用途。相比之下，tasklets 的用途广泛得多。tasklets 在大多数情况下运行良好且易于使用。\n\
  \n### 实现 Tasklets\n\n由于 tasklets 是在 softirqs 之上实现的，因此它们本质上是 softirqs。正如过的，tasklets\
  \ 由两个 softirqs 表示：`HI_SOFTIRQ` 和 `TASKLET_SOFTIRQ`。这些类型唯一的区别是基于 `HI_SOFTIRQ` 的 tasklets\
  \ 在基于 `TASKLET_SOFTIRQ` 的 tasklets 之前运行。\n\n### Tasklet 结构\n\nTasklets 由 `tasklet_struct`\
  \ 结构表示。每个结构代表一个唯一的 tasklet。该结构在 `<linux/interrupt.h>` 中声明：\n\n![image](img/p0142-01.jpg)\n\
  \n`func` 成员是 tasklet 处理程序（相当于 softirq 的 `action`），它接收 `data` 作为唯一参数。\n\n\n\n\n\n\
  `state` 成员的值为 0、`TASKLET_STATE_SCHED` 或 `TASKLET_STATE_RUN`。`TASKLET_STATE_SCHED`\
  \ 表示 tasklet 已被调度等待运行，而 `TASKLET_STATE_RUN` 表示 tasklet 正在运行。作为一种优化，`TASKLET_STATE_RUN`\
  \ 仅在多处理器机器上使用，因为单处理器机器始终知道 tasklet 是否正在运行（它要么是当前执行的代码，要么不是）。\n\n`count` 字段用作 tasklet\
  \ 的引用计数。如果它不为零，则 tasklet 被禁用且无法运行；如果为 0，则 tasklet 启用并在标记为待处理（pending）时可以运行。\n\n\
  ### 调度 Tasklets\n\n已调度（Scheduled）的 tasklet（等于触发的软中断 softirqs）存储在两个每个处理器的结构中：`tasklet_vec`（用于普通\
  \ tasklet）和 `tasklet_hi_vec`（用于高优先级 tasklet）。这两个结构都是 `tasklet_struct` 结构的链表。列表中的每个\
  \ `tasklet_struct` 结构代表一个不同的 tasklet。\n\n*这里又是一个令人困惑的命名方案示例。为什么软中断是被“触发”（raised）的而\
  \ tasklet 是被“调度”（scheduled）的？谁知道呢？这两个词都是标记下半部（bottom half）为待处理，以便尽快执行。*\n\nTasklets\
  \ 通过 `tasklet_schedule()` 和 `tasklet_hi_schedule()` 函数进行调度，这些函数接收 tasklet 的 `tasklet_struct`\
  \ 指针作为其唯一参数。每个函数都会确保提供的 tasklet 尚未被调度，然后根据情况调用 `__tasklet_schedule()` 和 `__tasklet_hi_schedule()`。这两个函数非常相似。（区别在于一个使用\
  \ `TASKLET_SOFTIRQ`，另一个使用 `HI_SOFTIRQ`。）编写和使用 tasklets 将在下一节中介绍。现在，让我们来看 `tasklet_schedule()`\
  \ 采取的步骤：\n\n1. 检查 tasklet 的 `state` 是否为 `TASKLET_STATE_SCHED`。如果是，则该 tasklet 已被调度等待运行，函数可以立即返回。\n\
  2. 调用 `__tasklet_schedule()`。\n3. 保存中断系统的状态，然后禁用本地中断。这确保了在 `tasklet_schedule()`\
  \ 操作 tasklets 时，该处理器上的任何内容都不会干扰 tasklet 代码。\n4. 将待调度的 tasklet 添加到 `tasklet_vec`\
  \ 或 `tasklet_hi_vec` 链表的头部，该链表对于系统的每个处理器是唯一的。\n5. 触发 `TASKLET_SOFTIRQ` 或 `HI_SOFTIRQ`\
  \ 软中断，以便 `do_softirq()` 在不久的将来执行此 tasklet。\n6. 恢复中断到之前的状态并返回。\n\n在下一个最早方便的时候，将如上一节所所述运行\
  \ `do_softirq()`。由于大多数 tasklet 和软中断在中断处理程序中被标记为待处理，`do_softirq()` 最可能在最后一个中断返回时运行。由于\
  \ `TASKLET_SOFTIRQ` 或 `HI_SOFTIRQ` 现在被触发，`do_softirq()` 会执行关联的处理程序。这些处理程序 `tasklet_action()`\
  \ 和 `tasklet_hi_action()` 是 tasklet 处理的核心。让我们来看看这些处理程序执行的步骤：\n\n1. 禁用本地中断交付（不需要先保存它们的状态，因为此处代码始终作为软中断处理程序调用，且中断总是开启的），并获取该处理器的\
  \ `tasklet_vec` 或 `tasklet_hi_vec` 列表。\n2. 通过将列表设置为 `NULL` 来清除该处理器的列表。\n3. 启用本地中断交付。同样，不需要将其恢复到之前的状态，因为此函数知道它们最初总是开启的。\n\
  4. 遍历获取的列表中的每个待处理 tasklet。\n5. 如果是多处理器机器，通过检查 `TASKLET_STATE_RUN` 标志检查 tasklet 是否在另一个处理器上运行。如果它当前正在运行，则现在不执行它，并跳到下一个待处理\
  \ tasklet。（记住，给定类型只能有一个 tasklet 可以并发运行。）\n6. 如果 tasklet 当前未运行，设置 `TASKLET_STATE_RUN`\
  \ 标志，以便另一个处理器不会运行它。\n7. 检查 `count` 值是否为零，以确保 tasklet 未被禁用。如果 tasklet 被禁用，则跳过它并进入下一个待处理\
  \ tasklet。\n8. 我们现在知道 tasklet 未在别处运行，已标记为运行以确保它不会在别处启动，且 `count` 值为零。运行 tasklet\
  \ 处理程序。\n9. tasklet 运行后，清除 tasklet `state` 字段中的 `TASKLET_STATE_RUN` 标志。\n10. 对下一个待处理\
  \ tasklet 重复此操作，直到没有更多已调度的 tasklet 等待运行。\n\ntasklets 的实现简单但相当巧妙。正如你所见的，所有 tasklet\
  \ 都复用在两个软中断 `HI_SOFTIRQ` 和 `TASKLET_SOFTIRQ` 之上。当一个 tasklet 被调度时，内核会触发其中一个软中断。这些软中断反过来由特殊函数处理，然后由运行任何已调度的\
  \ tasklet。这些特殊函数确保给定类型只有一个 tasklet 并发运行。\n\n#### 使用 Tasklets\n在大多数情况下，tasklets 是实现普通设备下半部的首选机制。tasklets\
  \ 是动态创建的、易于使用且快速的。\n\n##### 声明你的 Tasklet\n你可以静态或动态创建 tasklet。选择哪种选项取决于你对 tasklet\
  \ 是直接引用还是间接引用。如果你要静态创建 tasklet，使用 `<linux/interrupt.h>` 中的两个宏之一：\n\n```\nDECLARE_TASKLET(name,\
  \ func, data)\nDECLARE_TASKLET_DISABLED(name, func, data);\n```\n\n这两个宏都会静态创建一个具有指定名称的\
  \ tasklet struct。当 tasklet 被调度时，将执行指定的函数 `func` 并传递参数 `data`。这两个宏之间的区别在于初始引用计数。第一个宏创建\
  \ `count` 为零的 tasklet，tasklet 是启用的。第二个宏将 `count` 设置为 1，tasklet 是禁用的。这里有一个例子：\n\n\
  ```c\nDECLARE_TASKLET(my_tasklet, tasklet_handler, dev);\n```\n\n这创建了一个名为 `my_tasklet`\
  \ 的启用 tasklet，其处理程序为 `tasklet_handler`。当执行它时，`dev` 的值会被传递。\n\n要通过间接引用（指针）初始化动态创建\
  \ `struct tasklet_struct` `t`，调用 `tasklet_init()`：\n\n```\ntasklet_init(t, tasklet_handler,\
  \ dev);\n```\n\n##### 编写你的 Tasklet Handler\ntasklet 处理程序必须匹配正确的原型：\n\n```c\nvoid\
  \ tasklet_handler(unsigned long data)\n```\n\n与软中断一样，tasklet 不允许睡眠。这意味着你不能在 tasklet\
  \ 中使用信号量或其他阻塞函数。tasklet 在在所有中断都开启的情况下运行，因此如果你的 tasklet 与中断处理程序共享数据，你必须采取措施（例如禁用中断并获取锁）。然而，与软中断不同，两个相同的\
  \ tasklet 不会并发运行——尽管不同的 tasklet 可以在两个处理器上同时运行。如果你的 tasklet 与其他 tasklet 或软中断共享数据，你需要适当的锁。\n\
  \n##### 调度你的 Tasklet\n为了调度执行 tasklet，调用 `tasklet_schedule()` 并传递相关的 `tasklet_struct`\
  \ 指针：\n\n```c\ntasklet_schedule(&my_tasklet); // 标记 my_tasklet 为待处理\n```\n\n\n\n\
  \n\n在 tasklet 被调度后，它将在不久后的某个时间点运行一次。如果在该 tasklet 获得运行机会之前再次调度了同一个 tasklet，它仍然只会运行一次。如果它已经在运行（例如在另一个处理器上），则该\
  \ tasklet 将被重新调度并再次运行。作为一种优化，tasklet 始终会在调度它的处理器上运行——你可能希望这能更好地利用处理器的缓存。\n\n你可以通过调用\
  \ `tasklet_disable()` 来禁用 tasklet，该函数会禁用给定的 tasklet。如果 tasklet 当前正在运行，该函数将在其执行完成之前不会返回。或者，你可以使用\
  \ `tasklet_disable_nosync()`，它会禁用给定的 tasklet，但在返回之前不会等待 tasklet 完成。这通常是不安全的，因为你无法假设\
  \ tasklet 仍在运行。调用 `tasklet_enable()` 可以启用 tasklet。在对使用 `DECLARE_TASKLET_DISABLED()`\
  \ 创建的 tasklet 之前，也必须调用此函数。例如：\n\n![image](img/p0146-01.jpg)\n\n你可以通过 `tasklet_kill()`\
  \ 从等待队列中移除 tasklet。该函数接收一个指向 tasklet `tasklet_struct` 的唯一指针作为参数。在处理经常重新调度自己的 tasklet\
  \ 时，从队列中移除已调度的 tasklet 是很有用的。该函数首先等待 tasklet 执行完毕，然后将其从队列中移除。当然，没有任何东西能阻止其他代码重新调度该\
  \ tasklet。此函数不能在中断上下文中使用，因为它会睡眠。\n\n### ksoftirqd\n\nSoftirq（以及 tasklet）的处理由一组每个处理器特有的内核线程提供支持。当系统被大量的\
  \ softirq 淹没时，这些内核线程可以帮助处理 softirq。由于 tasklet 是使用 softirq 实现的，以下讨论同样适用于 softirq\
  \ 和 tasklet。为了简单起见，我们主要提述 softirq。\n\n如前所述，内核在许多地方处理 softirq，最常见的是在处理中断返回时。softirq\
  \ 可能会以高频率触发（例如在网络流量密集的期间）。此外，softirq 函数可以重新激活自己。也就是说，在运行期间，softirq 可以再次触发自己以便再次运行（例如，网络子系统的\
  \ softirq 就会再次触发自己）。softirq 高频发生与其重新激活能力相结合，可能导致用户空间程序被剥夺处理器时间。然而，不及时处理重新激活的 softirq\
  \ 是不可接受的。在最初设计 softirq 时，这导致了一个需要解决的困境，而且没有任何显而易见的解决方案是完美的。首先，让我们来看这两个显而易见的解决方案。\n\
  \n第一种解决方案是继续处理进入的 softirq，并在返回之前重新检查并重新处理任何等待中的 softirq。这确保了内核能够及时处理 softirq，最重要的是，任何重新激活的\
  \ softirq 也会被立即处理。问题在于高负载环境，在该环境中会有许多 softirq 不断重新激活自己。内核可能会持续处理 softirq，而无法完成任何其他工作。用户空间被忽视了——事实上，除了\
  \ softirq 和中断处理程序外，什么都没有运行，反过来系统的用户会发疯。如果系统从不处于高负载状态，这种方法可能运行良好；如果系统处于中等中断水平，这种解决方案是不可接受的。用户空间不能被长时间剥夺时间。\n\
  \n第二种解决方案是*不*处理重新激活的 softirq。在从中断返回时，内核仅仅查看所有等待中的 softirq 并按常执行它们。然而，如果任何 softirq\
  \ 重新激活了自己，它们将在内核*下一次*处理等待中的 softirq 时运行。这可能要等到下一次中断发生，这意味着在任何新的（或重新激活的）softirq 执行之前可能会持续很久。更糟糕的是，在原本空闲的系统中，立即处理\
  \ softirq 是有利的。遗憾的是，这种方法忽略了哪些进程是可运行的。因此，虽然这种方法防止了用户空间饿死，但它确实饿了 softirq，并且没有充分利用空闲系统。\n\
  \n在设计 softirq 时，内核开发者意识到需要某种折中方案。最终在内核中实现的解决方案是*不*立即处理重新激活的 softirq。相反，如果 softirq\
  \ 的数量过多，内核会唤醒一组内核线程来处理这些负载。内核线程以可能的最低优先级（`nice`  `19`）运行，这确保了它们不会取代任何重要的任务运行。这种妥协防止了密集的\
  \ softirq 活动完全剥夺用户空间的处理器时间。相反，它也确保了“额外”的 softirq 最终会运行。最后，该解决方案还有一个特性，即在空闲系统上，softirq\
  \ 处理得非常快，因为内核线程会立即调度。\n\n每个处理器有一个线程。这些线程被命名为 `ksoftirqd/n`，其中 `n` 是处理器编号。在双处理器系统中，你将会有\
  \ `ksoftirqd/0` 和 `ksoftirqd/1`。在每个处理器上设置一个线程确保了如果有空闲处理器，它可以始终处理 softirq。在线程初始化后，它们运行一个类似下方的紧凑循环：\n\
  \n![image](img/p0147-01.jpg)\n\n如果有任何等待中的 softirq（由 `softirq_pending()` 报告），`ksoftirqd`\
  \ 会调用 `do_softirq()` 来处理它们。注意，它重复执行此操作以处理任何重新激活的 softirq。在每次迭代后，如果需要将调用 `schedule()`\
  \ 以允许更重要的进程运行。所有处理完成后，内核线程将自己设置为 `TASK_INTERRUPTIBLE` 并调用调度器选择一个可运行的进程。\n\n每当 `do_softirq()`\
  \ 检测到正在执行的内核线程重新激活自己时，softirq 内核线程就会唤醒。\n\n### 旧的 BH 机制\n\n尽管幸运的是，旧的 BH 接口不再出现在\
  \ 2.6 中，但它存在了*很长*一段时间——从内核的最早版本开始。因为它具有极强的生命力，它确实带有某些历史意义，需要不仅仅匆匆一眼。这个简短章节中的任何内容实际上都与\
  \ 2.6 无关，但历史很重要。\n\nBH 接口非常古老，而且迹迹斑斑。每个 BH 必须静态定义，最多有 32 个。由于处理程序必须在编译时定义，因此模块不能直接使用\
  \ BH 接口。然而，它们可以寄依靠现有的 BH。随着时间的推移，这种静态要求和 32 个底半部分的数量限制变成了它们使用的一个大障碍。\n\n所有 BH 处理程序都是严格序列化的——没有两个\
  \ BH 处理程序（即使类型不同）可以并发运行。这使得同步变得简单，但对多处理器可扩展性没有好处。在大型 SMP 机器上的性能并不理想。使用 BH 接口的驱动程序在多个处理器上的扩展性良好。特别是网络层，遭受了很大。\n\
  \n除了这些属性外，BH 机制与 tasklet 类似。事实上，BH 接口在 2.4 中是实现在 tasklet 之上的。32 个可能的底半部分由 `<linux/interrupt.h>`\
  \ 中定义的常量表示。为了将一个 BH 标记为等待状态，会调用 `mark_bh()` 函数并传递 BH 的编号。在 2.4 中，这反过来调度了 BH tasklet\
  \ `bh_action()` 运行。在 2.4 内核之前，BH 机制是独立实现的，不依赖于任何底层的底半机制，就像今天 softirq 的实现的方式一样。\n\
  \n\n\n\n\n由于这种形式的下半部（bottom half）存在缺陷，内核开发者引入了任务队列（task queues）来取代下半部。尽管任务队列赢得了许多新用户，但从未实现这一目标。在\
  \ 2.3 版本中引入了 `softirq` 和 `tasklet` 机制来终结 BH。BH 机制是在 `tasklet` 之上重新实现的。不幸的是，由于新接口固有的序列化能力较弱，将下半部从\
  \ BH 接口转换为 `tasklet` 或 `softirqs` 非常复杂[6]。然而，在 2.5 期间，当定时器和 SCSI（最后的 BH 用户）最终迁移到\
  \ `softirqs` 时，这种转换确实发生了。内核开发者果断删除了 BH 接口。再见，BH！\n\n也就是说，较弱的序列化对性能有益，但编程也更困难。例如，将一个\
  \ BH 转换为 tasklet 需要仔细的考虑：这段代码与任何其他 tasklet 同时运行是否安全？然而，在完成转换后，这种性能提升是值得的。\n\n##\
  \ 工作队列 (Work Queues)\n\n工作队列与我们目前看到的延迟工作形式不同。工作队列将工作推迟到内核线程——这种下半部始终运行在进程上下文（process\
  \ context）中。因此，推送到工作队列的代码具有进程上下文的所有通常优势。最重要的是，工作队列是可调度的，因此可以睡眠。\n\n通常情况下，决定使用工作队列还是\
  \ `softirqs/tasklets` 是很容易的。如果延迟工作需要睡眠，则使用工作队列。如果延迟工作不需要睡眠，则使用 `softirqs` 或 `tasklets`。事实上，工作队列的常见替代方案是内核线程。由于内核开发者不希望创建新的内核线程（在某些地方，这是一种会受罚的行为），因此人们强烈倾向于使用工作队列。它们也非常容易使用。\n\
  \n如果你需要一个可调度的实体来执行下半部处理，你就需要工作队列。它们是唯一运行在进程中的下半部机制，因此也是唯一可以睡眠的机制。这意味着它们对于需要分配大量内存、获取信号量或执行块\
  \ I/O 的情况非常有用。如果你不需要内核线程来处理延迟工作，可以考虑使用 tasklet。\n\n### 实现工作队列\n\n在最基本的形式下，工作队列子系统是一个创建内核线程的接口，用于处理从其他地方入队的工作。这些内核线程被称为*worker\
  \ threads*（工作线程）。工作队列允许你的驱动程序创建一个特殊的工作线程来处理延迟工作。然而，工作队列子系统实现并提供了一个默认的工作线程来处理工作。因此，在最常见的形式下，工作队列是将工作推送到通用内核线程的简单接口。\n\
  \n默认的工作线程被称为 `events/n`，其中 `n` 是处理器编号；每个处理器有一个。例如，在单处理器系统上有一个线程 `events/0`。双处理器系统将会额外有一个\
  \ `events/1` 线程。默认工作线程处理来自多个位置的延迟工作。内核中的许多驱动程序都将它们的下半部工作推送到默认线程。除非驱动程序或子系统对创建自己的线程有强迫需求，否则优选默认线程。\n\
  \n然而，没有什么能阻止代码创建它自己的工作线程。如果你在工作线程中执行了大量处理，这可能是有利的。计算密集型型和对性能至关重要的工作可能会从其自己的线程中获益。这也减轻了默认线程的负载，防止其他队列工作被饥饿。\n\
  \n#### 表示线程的数据结构\n\n工作线程由 `workqueue_struct` 结构表示：\n\n![image](img/p0149-01.jpg)\n\
  \n该结构定义在 `kernel/workqueue.c` 中，包含一个 `struct cpu_workqueue_struct` 数组，系统中的每个可能的处理器有一个。由于工作线程存在于系统的每个处理器上，因此在给定的机器上，每个工作线程、每个处理器都有这样的结构。`cpu_workqueue_struct`\
  \ 是核心数据结构，也定义在 `kernel/workqueue.c` 中：\n\n![image](img/p0150-01.jpg)\n\n注意，每种工作线程都有一个关联的\
  \ `workqueue_struct`。内部，每个线程（因此是每个处理器）都有一个 `cpu_workqueue_struct`，因为每个处理器上有一个工作线程。\n\
  \n#### 表示工作的数据结构\n\n所有工作线程都实现为运行 `worker_thread()` 函数的普通内核线程。在初始设置之后，该函数进入无限循环并进入睡眠。当工作被入队时，线程被唤醒并处理工作。当没有剩余工作需要处理时，它会返回睡眠状态。\n\
  \n工作由定义在 `<linux/workqueue.h>` 中的 `work_struct` 结构表示：\n\n```\nstruct work_struct\
  \ {\n    atomic_long_t data;\n    struct list_head entry;\n    work_func_t func;\n\
  };\n```\n\n这些结构被连接成一个链表，每个处理器上的每个类型的队列都有一个链表。例如，每个处理器有一个通用线程的延迟工作列表。当工作线程唤醒时，它运行其列表中的任何工作。当它完成工作时，它会从链表中移除相应的\
  \ `work_struct` 条目。当列表为空时，它返回睡眠。\n\n![image](img/p0151-01.jpg)\n\n该函数在无限循环中执行以下操作：\n\
  \n1. 线程将自己标记为睡眠状态（任务状态设置为 `TASK_INTERRUPTIBLE`）并将自己添加到等待队列中。\n2. 如果工作列表为空，线程调用 `schedule()`\
  \ 并睡眠。\n3. 如果列表不为空，线程不睡眠。相反，它将自己标记为 `TASK_RUNNING` 并从等待队列中移除。\n4. 如果列表不为空，线程调用 `run_workqueue()`\
  \ 执行工作。\n\n![image](img/p0151-02.jpg)\n\n`run_workqueue()` 函数反过来实际执行工作：\n\n1. 当列表不为空，它获取列表中的下一个条目。\n\
  2. 它检索要调用的函数 `func` 及其参数 `data`。\n3. 它从列表中移除此条目并清除结构中的等待位。\n4. 它调用函数。\n5. 重复。\n\n\
  ### 工作队列实现总结\n\n不同数据结构之间的关系确实有点复杂。图 8.1 提供了一个图形示例，应该将它们整合在一起。\n\n图 8.1。工作、工作队列和工作线程之间的关系。\n\
  \n![image](img/08fig01.jpg)\n\n在最高层，有工作线程。可能有多种工作线程；每个类型的每个处理器有一个工作线程。内核部分可以根据需要创建工作线程。默认情况下，有一个\
  \ *events* 工作线程。每个工作线程由 `cpu_workqueue_struct` 结构表示。`workqueue_struct` 结构表示给定类型的所有工作线程。\n\
  \n例如，假设在通用的 *events* 工作类型之外，你还创建了 *falcon* 工作类型。还假设你有一台四处理器计算机。那么就有四个 *events* 线程（因此有四个\
  \ `cpu_workqueue_struct` 结构）和四个 *falcon* 线程（另外四个 `cpu_workqueue_struct` 结构）。*events*\
  \ 类型有一个 `workqueue_struct`，*falcon* 类型也有一个。\n\n\n\n\n现在，让我们从底层开始，即从工作（work）开始。你的驱动程序创建一个工作，并希望将其推后执行。`work_struct`\
  \ 结构表示了这项工作。除其他因素外，该结构包含一个指向处理延迟工作的函数指针。工作被提交给一个特定的（specific）工作线程——在这种情况下，是一个特定的\
  \ falcon 线程。随后，工作线程会被唤醒并执行队列中的工作。\n\n大多数驱动程序使用名为 `events` 的现有默认工作线程。它们简单又方便。然而，某些更严重的情况需要自己的工作线程。例如，XFS\
  \ 文件系统创建了两种新类型的工作线程。\n\n## 使用工作队列 (Work Queues)\n\n使用工作队列非常简单。我们首先介绍默认的 `events`\
  \ 队列，然后介绍创建新的工作线程。\n\n### 创建工作\n\n第一步实际上是创建一些要推迟的工作。要在运行时静态地创建该结构，使用 `DECLARE_WORK`：\n\
  \n```c\nDECLARE_WORK(name, void (*func)(void *), void *data);\n```\n\n这会静态地创建一个名为\
  \ `name` 的 `work_struct` 结构，其处理函数为 `func`，参数为 `data`。\n\n或者，你可以通过指针在运行时创建工作：\n\n\
  ```c\nINIT_WORK(struct work_struct *work, void (*func)(void *), void *data);\n```\n\
  \n这会动态地初始化由 `work` 指向的工作队列，处理函数为 `func`，参数为 `data`。\n\n### 你的工作队列处理函数\n\n工作队列处理函数的原型为：\n\
  \n```c\nvoid work_handler(void *data)\n```\n\n工作线程执行此函数，因此该函数运行在进程上下文（process context）中。默认情况下，中断已开启且没有持有任何锁。如果需要，函数可以睡眠。注意，尽管在进程上下文中运行，工作处理函数也无法访问用户空间内存，因为内核线程没有关联的用户空间内存映射。只有在代表用户空间进程运行（（例如执行系统调用时），内核才能访问用户内存。只有此时，用户内存才会被映射。\n\
  \n工作队列或其他内核其他部分之间的锁处理与任何其他进程上下文代码相同。这使得编写工作处理函数变得简单得多。接下来的两章介绍锁。\n\n### 调度工作\n\n\
  现在工作已经创建，我们就可以对其进行调度。要将给定工作的处理函数推入默认的 `events` 工作线程队列中，只需调用：\n\n```c\nschedule_work(&work);\n\
  ```\n\n工作会被立即调度，并在当前处理器上的 `events` 工作线程唤醒后立即运行。\n\n有时你并不希望工作立即执行，而是希望在某些延迟后后执行。在这些情况下，你可以调度工作在未来的某个时间执行：\n\
  \n```c\nschedule_delayed_work(&work, delay);\n```\n\n在这种情况下，由 `&work` 表示的 `work_struct`\
  \ 将至少在未来 `delay` 个定时器滴答后才会执行。使用 ticks 作为时间单位将在第 10 章 中介绍。\n\n### 刷新工作 (Flushing\
  \ Work)\n\n队列中的工作会在工作线程下次唤醒时执行。有时，你需要在继续之前确保某批工作已完成。这对于模块来说尤为重要，它们几乎肯定想在卸载之前调用此函数。内核中的其他地方也可能需要确保没有待处理的工作，以防止竞态条件。\n\
  \n对于这些需求，有一个函数可以刷新给定的工作队列：\n\n```c\nvoid flush_scheduled_work(void);\n```\n\n（注：原文中存在大量重复段落，此处已按要求处理翻译）\n\
  \n## 工作队列 (Work Queues)\n\n队列中的工作会在工作线程下次唤醒时执行。有时，你需要在继续之前确保某批工作已完成。这对于模块来说尤为重要，它们几乎肯定想在卸载之前调用此函数。内核中的其他地方也可能需要确保没有待处理的工作，以防止竞态条件。\n\
  \n对于这些需求，有一个函数可以刷新给定的工作队列：\n\n```c\nvoid flush_scheduled_work(void);\n```\n\n###\
  \ 刷新工作\n\n队列中的工作会在工作线程下次唤醒时执行。有时，你需要在继续之前确保某批工作已完成。这对于模块来说尤为重要，它们几乎肯定想在卸载之前调用此函数。内核中的其他地方也可能需要确保没有待处理的工作，以防止竞态条件。\n\
  \n对于这些需求，有一个函数可以刷新给定的工作队列：\n\n```c\nvoid flush_scheduled_work(void);\n```\n\n###\
  \ 调度工作\n\n现在工作已经创建，我们就可以对其进行调度。要将给定工作的处理函数推入默认的 `events` 工作线程队列中，只需调用：\n\n```c\n\
  schedule_work(&work);\n```\n\n工作会被立即调度，并在当前处理器上的 `events` 工作线程唤醒后立即运行。\n\n有时你并不希望工作立即执行，而是希望在某些延迟后执行。在这些情况下，你可以调度工作在未来的某个时间执行：\n\
  \n```c\nschedule_delayed_work(&work, delay);\n```\n\n在这种情况下，由 `&work` 表示的 `work_struct`\
  \ 将至少在未来 `delay` 个定时器滴答后才会执行。使用 ticks 作为时间单位将在第 10 章 中介绍。\n\n### 你的工作队列处理函数\n\n\
  工作队列处理函数的原型为：\n\n```c\nvoid work_handler(void *data)\n```\n\n工作线程执行此函数，因此该函数运行在进程上下文中。默认情况下，中断已开启且没有持有任何锁。如果需要，函数可以睡眠。注意，尽管在进程上下文中运行，工作处理函数也无法访问用户空间内存，因为内核线程没有关联的用户空间内存映射。只有在代表用户空间进程运行（例如执行系统调用时），内核才能访问用户内存。只有此时，用户内存才会被映射。\n\
  \n工作队列或其他内核其他部分之间的锁处理与任何其他进程上下文代码相同。这使得编写工作处理函数变得简单得多。接下来的两章介绍锁。\n\n### 创建工作\n\n\
  第一步实际上是创建一些要推迟的工作。要在运行时静态地创建该结构，使用 `DECLARE_WORK`：\n\n```c\nDECLARE_WORK(name, void\
  \ (*func)(void *), void *data);\n```\n\n这会静态地创建一个名为 `name` 的 `work_struct` 结构，其处理函数为\
  \ `func`，参数为 `data`。\n\n或者，你可以通过指针在运行时创建工作：\n\n```c\nINIT_WORK(struct work_struct\
  \ *work, void (*func)(void *), void *data);\n```\n\n这会动态地初始化由 `work` 指向的工作队列，处理函数为\
  \ `func`，参数为 `data`。\n\n### 使用工作队列\n\n使用工作队列非常简单。我们首先介绍默认的 `events` 队列，然后介绍创建新的工作线程。\n\
  \n### 使用工作队列\n\n现在，让我们从底层开始，即从工作开始。你的驱动程序创建一个工作，并希望将其推后执行。`work_struct` 结构表示了这项工作。除其他因素外，该结构包含一个指向处理延迟工作的函数指针。工作被提交给一个特定的（specific）工作线程——在这种情况下，是一个特定的\
  \ falcon 线程。随后，工作线程会被唤醒并执行队列中的工作。\n\n大多数驱动程序使用名为 `events` 的现有默认工作线程。它们简单又方便。然而，某些更严重的情况需要自己的工作线程。例如，XFS\
  \ 文件系统创建了两种新类型的工作线程。\n\n### 使用工作队列\n\n使用工作队列非常简单。我们首先介绍默认的 `events` 队列，然后介绍创建新的工作线程。\n\
  \n### 创建工作\n\n第一步实际上是创建一些要推迟的工作。要在运行时静态地创建该结构，使用 `DECLARE_WORK`：\n\n```c\nDECLARE_WORK(name,\
  \ void (*func)(void *), void *data);\n```\n\n这会静态地创建一个名为 `name` 的 `work_struct`\
  \ 结构，其处理函数为 `func`，参数为 `data`。\n\n或者，你可以通过指针在运行时创建工作：\n\n```c\nINIT_WORK(struct\
  \ work_struct *work, void (*func)(void *), void *data);\n```\n\n这会动态地初始化由 `work`\
  \ 指向的工作队列，处理函数为 `func`，参数为 `data`。\n\n### 你的工作队列处理函数\n\n工作队列处理函数的原型为：\n\n```c\n\
  void work_handler(void *data)\n```\n\n工作线程执行此函数，因此该函数运行在进程上下文中。默认情况下，中断已开启且没有持有任何锁。如果需要，函数可以睡眠。注意，尽管在进程上下文中运行，工作处理函数也无法访问用户空间内存，因为内核线程没有关联的用户空间内存映射。只有在代表用户空间进程运行（例如执行系统调用时），内核才能访问用户内存。只有此时，用户内存才会被映射。\n\
  \n工作队列或其他内核其他部分之间的锁处理与任何其他进程上下文代码相同。这使得编写工作处理函数变得简单得多。接下来的两章介绍锁。\n\n### 调度工作\n\n\
  现在工作已经创建，我们就可以对其进行调度。要将给定工作的处理函数推入默认的 `events` 工作线程队列中，只需调用：\n\n```c\nschedule_work(&work);\n\
  ```\n\n工作会被立即调度，并在当前处理器上的 `events` 工作线程唤醒后立即运行。\n\n有时你并不希望工作立即执行，而是希望在某些延迟后执行。在这些情况下，你可以调度工作在未来的某个时间执行：\n\
  \n```c\nschedule_delayed_work(&work, delay);\n```\n\n在这种情况下，由 `&work` 表示的 `work_struct`\
  \ 将至少在未来 `delay` 个定时器滴答后才会执行。使用 ticks 作为时间单位将在第 10 章 中介绍。\n\n### 刷新工作\n\n队列中的工作会在工作线程下次唤醒时执行。有时，你需要在继续之前确保某批工作已完成。这对于模块来说尤为重要，它们几乎肯定想在卸载之前调用此函数。内核中的其他地方也可能需要确保没有待处理的工作，以防止竞态条件。\n\
  \n对于这些需求，有一个函数可以刷新给定的工作队列：\n\n```c\nvoid flush_scheduled_work(void);\n```\n\n##\
  \ 旧的任务队列机制 (Old Task Queue Mechanism)\n\n就像 BH 接口让位于软中断（softirqs）和任务队列（tasklets）一样，工作队列接口也是产生于任务队列接口的缺陷。任务队列接口（在内核中通常简称为\
  \ `tq`，像任务队列一样）与进程意义上的任务（tasks）没有任何关系。\n\n## 旧的任务队列机制\n\n队列中的工作会在工作线程下次唤醒时执行。有时，你需要在继续之前确保某批工作已完成。这对于模块来说尤为重要，它们几乎肯定想在卸载之前调用此函数。内核中的其他地方也可能需要确保没有待处理的工作，以防止竞态条件。\n\
  \n对于这些需求，有一个函数可以刷新给定的工作队列：\n\n```c\nvoid flush_scheduled_work(void);\n```\n\n\n\n\
  决定使用哪种半部（bottom half）是非常重要的。在当前的 2.6 内内核中，你有三个选择：`softirqs`、`tasklets` 和 `work queues`。Tasklets\
  \ 是基于 `softirqs` 构建的，因此两者非常相似。work queue 机制则是完全不同的物，它是构建在内核线程之上的。\n\n从设计上看，`softirqs`提供的序列化最少。这意味着软\
  \ irq 处理程序需要经过额外的步骤来确保共享数据的安全，因为两个或多个相同类型的 `softirqs` 可能会在不同的处理器上并发运行。如果涉及的代码已经是高度线程化的（例如在深度使用每个处理器变量的网络子系统中），那么\
  \ `softirqs` 是一个很好的选择。对于对时间敏感且高频率的用例，它们无疑是最快的替代方案。\n\n如果代码不是细粒度线程化的，那么 `tasklets`\
  \ 更有意义。它们具有更简单的接口，而且由于相同类型的 tasklet 可能不会并发运行，因此它们更容易实现。tasklets 实际上上是不并发运行的 `softirqs`。驱动程序开发者应该始终选择\
  \ `tasklets` 而不是 `softirqs`，除非他们准备好利用每个处理器变量或类似的魔法手段来确保 `softirq` 能在多个处理器上安全地并发。\n\
  \n如果你的延迟工作需要在进程上下文（process context）中运行，在这三个者中你唯一的选择是 `work queues`。如果进程上下文不是要求——具体来说，如果你不需要睡眠——那么\
  \ `softirqs` 或 `tasklets` 可能更合适。`work queues` 涉及的开销最高，因为涉及内核线程，因此涉及上下文切换。这并不是说它们效率低下，但考虑到每秒数千次的中断（网络子系统可能会经历的），其他方法更为合理。然而，对于大多数情况，`work\
  \ queues` 就足够了。\n\n从易用性方面来说，`work queues` 冠。使用默认的 `events` 队列是小菜一碟。接下来是 `tasklets`，它们也有一个简单的接口。最后是\
  \ `softirqs`，它们需要静态创建，并且在实现时需要仔细的思考。\n\n表 8.3 是这三种半部接口的比较。\n\n表 8.3. 半部比较\n\n![image](img/t0156-01.jpg)\n\
  \n简而言之，普通的驱动编写者有两个选择。首先，你是否需要一个可调度实体来执行你的延迟工作——从根本上说，你需要因为某种原因睡眠吗？那么 `work queues`\
  \ 是你唯一的选择。否则，优先选择 `tasklets`。只有当扩展性变成问题时，你才需要研究 `softirqs`。\n\n### 半部之间的锁定\n\n我们还没有讨论过锁，这是一个有趣且广泛的话题，我们专门用了接下来的两个章节来讨论它。尽管如此，你需要理解，在使用半部时，保护共享数据免受并发访问至关重要的，即使在单处理器机器上也是如此。记住，半部几乎可以在任何时刻运行。如果锁定的概念对你来说很陌生，你可以在读完接下来的两个章节后回到这一节。\n\
  \n`tasklets` 的优点之一是它们相对于自身是序列化的：同一个 tasklet 不会并发运行，即使在两个不同的处理器上也是如此。这意味着你不需要担心 tasklet\
  \ 内部的并发问题。tasklet 之间的并发（即当两个不同的 tasklet 共享相同数据时）需要适当的锁。\n\n由于 `softirqs` 不提供序列化（即使是同一个\
  \ `softirq` 的两个实例可能同时运行），所有共享数据都需要适当锁。\n\n如果进程上下文代码和半部共享数据，你需要在访问数据之前禁用半部处理并获取锁。同时进行这两者可以确保本地和\
  \ SMP 保护，并防止死锁。\n\n如果中断上下文代码和半部共享数据，你需要在访问数据之前禁用中断并获取锁。这同样确保了本地和 SMP 保护，并防止了死锁。\n\
  \n`work queue` 中的任何共享数据也需要锁定。锁定问题与普通的内核代码没有区别，因为 `work queues` 运行在进程上下文中。\n\n第 9\
  \ 章，“内核同步导论”提供了有关并发问题的背景知识，而 第 10 章 涵盖了内核锁原语。这些章节涵盖了如何保护半部使用的数据。\n\n### 禁用半部\n\n\
  通常情况下，仅禁用半部是不够的。在多数情况下，为了安全地保护共享数据，你需要获取一个锁*并且*禁用半部。你在驱动程序中可能使用的此类方法在第 10 章 中介绍。然而，如果你正在编写内核核心代码，可能只需要禁用半部。\n\
  \n要禁用所有的半部处理（具体来说是所有的 `softirqs` 因此所有的 `tasklets`），调用 `local_bh_disable()`。要启用半部处理，调用\
  \ `local_bh_enable()`。是的，该函数的命名有误；当 BH 接口让位于 `softirqs` 时，没有人费力更改名字。表 8.4 是这些函数的总结。\n\
  \n表 8.4. 半部控制方法\n\n![image](img/t0158-01.jpg)\n\n这些调用是可以嵌套的——只有对 `local_bh_enable()`\
  \ 的最终调用才会启用半部。例如，第一次调用 `local_bh_disable()` 时，本地软 irq 处理被禁用。如果又调用三次 `local_bh_disable()`，本地处理仍保持禁用状态。只有在第四次调用\
  \ `local_bh_enable()` 时，处理才被重新启用。\n\n这些函数通过通过 `preempt_count` 维护一个每个任务的计数器来实现这一点。当计数器为零时，半部处理是可能的。由于半部被禁用，`local_bh_enable()`\
  \ 还会检查任何挂起的半部并执行它们。\n\n这些函数对于每个架构唯一的，通常在 `<asm/softirq.h>` 中写为复杂的宏。以下是好奇者的 C 表示：\n\
  \n```\n![image](img/p0158-01.jpg)\n```\n\n这些调用不会禁用 work queues 的执行。由于 work queues\
  \ 运行在进程环境中，不存在异步执行问题，因此没有必要禁用它们。然而，由于 `softirqs` 和 `tasklets` 会异步发生（例如，在处理中断返回时），内核代码可能需要禁用它们。另一方面，对于\
  \ `work queues`，保护共享数据与任何进程上下文相同。第 8 章和第 9 章](#ch09.html)提供了细节。\n\n### 总结\n\n在本章中，我们涵盖了\
  \ Linux 内内核中延迟工作的三种机制：`softirqs`、`tasklets` 和 `work queues`。我们讨论了它们的设计和实现。我们讨论了如何在自己的代码中使用它们，并嘲讽了它们糟糕的名字。为了历史的完整性，我们还回顾了存在于旧版本\
  \ Linux 内核中的半部机制：BH's 和任务队列。\n\n\n\n在本章中，我们深入讨论了同步和并发问题，因为这些主题在下半部（bottom halves）中有大量的应用。我们甚至以讨论为了并发保护目的而禁用下半部作为本章的结束。现在，是时候深入探讨这些主题了。第\
  \ 9 章 讨论了抽象层面的内核同步和并发，为理解这些问题的核心问题提供了基础。第 10 章 讨论了我们喜爱的内核提供的解决这些问题的特定接口。掌握了接下来的这两章，世界将为你为你开启。\n\
  \n# 9. 内核同步简介\n\n在共享内存应用程序中，开发者必须确保共享资源免受并发访问的影响。内核也不例外。共享资源需要免受并发访问的保护，因为如果多个执行线程^1\
  \ 同时访问并操作数据，线程可能会覆盖彼此的更改，或者在数据处于不一致状态时访问数据。共享数据的并发访问是导致不稳定的根源，而且通常难以追踪和调试——在开始时就做对这一点非常重要。\n\
  \n^1 *执行线程一词是指执行代码的任何实例。这包括内核中的任务、中断处理程序、下半部或内核线程。本章可能会将执行线程简称为线程。请记住，这个术语描述任何正在执行的代码。*\n\
  \n妥善保护共享资源可能是困难的。几年前，在 Linux 支持对称多处理之前，防止数据的并发访问是非常简单的。因为只支持单个处理器，数据被并发访问只有发生在发生中断或内核代码显式重新调度并启用另一个任务运行时。在早期的内核中，开发是非常简单的。\n\
  \n那些日子已经结束了。对称多处理支持在 2.0 内核中引入，并在以后不断增强。多处理支持意味着内核代码可以同时在两个或多个处理器上运行。因此，如果没有保护，运行在两个不同处理器上的内核代码可能会同时访问共享数据。随着\
  \ 2.6 内核的引入，Linux 内核是抢占式的。这意味着（再次在没有保护的情况下）调度程序可以在任何时候抢占内核代码并重新调度另一个任务。今天，许多场景允许内核内部出现并发，它们都需要保护。\n\
  \n本章讨论了存在于任何操作系统内核中的抽象并发和同步问题。下一章详细介绍了 Linux 内核提供的解决同步问题和防止竞态条件的特定机制和接口。\n\n## 关键区域和竞态条件\n\
  \n访问和操作共享数据的代码路径称为关键区域（也称为关键区）。多个执行线程同时访问同一资源通常是不安全的。为了防止关键区域期间的并发访问，程序员必须确保代码原子地执行——也就是说，操作无中断地完成，就像整个关键区域是一条不可分割的指令一样。如果两个线程可能同时在同一个关键区域内执行，那就是错误。当这种情况发生时，我们称之为竞态条件（race\
  \ condition），之所以命名是因为线程在竞争先到达。注意你的代码中的竞态条件可能表现得有多罕见——调试竞态条件通常很难，因为它们不容易复现。确保防止不安全的并发并防止竞态条件的发生被称为同步。\n\
  \n### 为什么我们需要保护？\n\n为了最好理解同步的性，让我们看看竞态条件的普遍性。作为第一个例子，让我们考虑一个现实案例：ATM（自动取款机，在美国境外也称为\
  \ cash machine、cashpoint 或 ABM）。\n\n现金机最常见的功能之一是从个人银行账户中取款。一个人走到机器前，插入 ATM 卡，输入密码，选择取款，输入金额，点击确认，取出钱，并将其寄给我。\n\
  \n在用户请求特定金额的钱后，现金机需要确保该钱确实存在于用户的账户中。如果钱存在，它将需要从可用总资金中扣除取款金额。实现此点的代码看起来如下：\n\n![image](img/p162-01.jpg)\n\
  \n现在，假设扣款正在发生：假设扣款同时发生。扣款如何发生并不重要：假设客户在银行中总共有 105 美。\n\n现在，让我们来看一个具体的计算示例。考虑一个简单的共享资源（单个全局整型）和一个简单的关键区域（仅是递增它的操作）：\n\
  \n```\ni++;\n```\n\n这可能会翻译成计算机处理器的机器指令，类似于以下：\n\n```\n获取 i 的当前值并将其复制到寄存器\n将寄存器中存储的值加\
  \ 1\n将 i 的新值写回内存\n```\n\n现在，假设有两个执行线程，它们都进入了这个关键区域，且 `i` 的初始值为 7。预期的结果类似于下面（每行代表一个时间单位）：\n\
  \n![image](img/t0164-01.jpg)\n\n正如所预期的，7 递增两次是 9。然而，一种可能的结果如下：\n\n![image](img/t0164-02.jpg)\n\
  \n\n\n\n\n如果两个执行线程在 `i` 递增之前读取了它的初始值，那么两个线程都会递增并保存相同的值。结果是变量 `i` 的值是 8，而实际上它现在应该是\
  \ 9。这是临界区（critical region）最简单的例子之一。幸运的是，解决方案同样简单：我们只需要一种方法，在一个不可分割的步骤中执行这些操作。大多数处理器都提供一种指令，可以原子地读取、递增并写回单个变量。使用这种\
  \ `atomic instruction`（原子指令），唯一可能的结果是\n\n![image](img/t0164-03.jpg)\n\n或者相反\n\n\
  ![image](img/t0164-04.jpg)\n\n这两个原子操作永远不会交织。处理器会在物理上确保这种操作是不可能的。使用这样的指令可以解决这个问题。内核提供了一组实现这些原子指令的接口；它们将在下一节讨论。\n\
  \n## 锁 (Locking)\n\n现在，让我们考虑一个需要更复杂解决方案竞态条件。假设你有一个需要处理的请求队列。在这个练习中，我们假设实现是一个链表，其中每个节点代表一个请求。有两个函数在操作队列：一个函数向队列末尾添加新请求；另一个函数从队列头部移除请求并对该请求进行某些有用操作。内核的不同部分会调用这两个函数；因此，请求不断地被添加、移除和处理。操作请求队列显然需要多条指令。如果一个线程在另一个线程操作队列时尝试从队列读取，读取线程将发现队列处于不一致状态。显而易见，如果允许并发访问队列，可能会发生何种破坏。通常当共享资源是复杂的数据结构时，竞态条件的结果就是数据结构的损坏。\n\
  \n上述场景起初可能没有明确的解决方案。你如何防止一个处理器在另一个处理器更新队列时从队列中读取呢？虽然对于特定架构实现简单的原子指令（如算术和比较）是可行的，但让架构提供指令来支持上例中无限大小的临界区将是荒谬的。我们需要的是一种确保一次只有一个线程在操作数据结构的方法——一种在另一个执行线程处于标记区域时防止访问该资源的机制。\n\
  \n`lock`（锁）提供了这样一种机制；它的工作原理非常像门上的锁。想象门后的房间就是临界区。在房间内，在同一时刻只能存在一个执行线程。当线程进入房间时，它会锁上后面的门。当线程完成对共享数据的操作后，它离开房间并打开锁。如果另一个线程在门锁定时到达到达，它必须等待内部的线程离开房间并打开锁才能进入。线程持有锁；锁保护数据。\n\
  \n在之前的请求队列示例中，可以使用单个锁来保护队列。每当有新请求要添加到队列时，线程首先获取锁。然后它就可以安全地将请求添加到队列中并最终释放锁。当线程想要从队列中移除请求时，它也会获取锁。然后它可以读取请求并从队列中移除。最后，它释放锁。对队列的任何其他访问也同样需要获取锁。因为锁一次只能被一个线程持有，所以一次只有一个线程可以操作队列。如果一个线程在另一个线程正在更新队列时出现，第二个线程必须等待第一个线程释放锁才能继续。锁防止了并发并保护队列免受竞态条件的影响。\n\
  \n任何访问队列的代码首先需要获取相关的锁。如果有另一个执行线程出现，锁会防止并发：\n\n![image](img/t0166-01.jpg)\n\n注意，锁是\
  \ `advisory`（建议性的）且 `voluntary`（自愿的）。锁完全是程序员必须利用的编程构造。没有任何东西能阻止你编写在没有相应锁的情况下操作虚拟队列的代码。当然，这种做法最终会导致竞态条件和损坏。\n\
  \n锁有各种形状和大小——仅 Linux 本身就实现了若干种不同的锁机制。这些机制之间最重要的区别在于当锁由于另一个线程已持有而不可用时的行为——某些锁的变体采用\
  \ `busy wait`（忙等），而其他锁则会让当前任务休眠，直到锁可用。下一节将讨论 Linux 中不同锁的行为及其接口。\n\n*也就是说，在一个紧凑的循环中旋转，反复检查锁的状态，等待锁可用。*\n\
  \n敏锐的读者现在可能在大声尖叫了。锁并没有解决问题；它只是将临界区缩小到只剩下锁和解锁的代码：可能确实要小得多，但仍然是一个潜在的竞态！幸运的是，锁是使用原子操作实现的，确保了不存在竞态。单条指令就可以验证密钥是否已被占用，如果没有被占用，则夺取它。具体实现取决于架构，但几乎所有处理器都实现了一个原子\
  \ `test and set`（测试并设置）指令，该指令测试整数的值，并仅在值为零时将其设置为新值。值为零表示未锁定。在流行的 x86 架构上，锁是通过使用类似的类似的\
  \ `compare and exchange`（比较并交换）指令实现的。\n\n## 并发产生\n\n在用户空间中，同步的需求源于程序是根据调度器的意愿进行抢占式调度。由于进程可以随时被抢占，另一个进程可以被调度到处理器上，进程在访问临界区的过程中可能会被意外抢占。如果新调取的进程随后进入同一个临界区（例如，如果两个进程操作相同的内存或写入同一个文件描述符），就会发生竞态。多个单线程进程共享文件，或者单个程序内的信号，也会出现同样的问题，因为信号可以异步发生。这种类型的并发——两件事并非实际上同时发生，而是交织在一起以至于就像同时发生一样——被称为\
  \ `pseudo-concurrency`（伪并发）。\n\n如果你有一台对称多处理器机器，两个进程可以在同一时刻在临界区执行。这被称为 `true concurrency`（真并发）。尽管真并发和伪并发的原因和语义不同，但它们会导致相同的竞态条件，并需要相同类型的保护。\n\
  \n内核也有类似的并发原因：\n\n- **中断**：中断可以在几乎任何时间异步发生，中断当前正在执行的代码。\n- **软中断和任务队列**：内核可以在几乎任何时间唤起或调度软中断或任务队列，中断当前正在执行的代码。\n\
  - **内核抢占**：由于内核是抢占式的，内核中的一个任务可以抢占另一个任务。\n- **休眠与用户空间的同步**：内核中的任务可以休眠并从而调用调度器，导致新进程的运行。\n\
  - **对称多处理器**：两个或多个处理器可以在同一时刻执行内核代码。\n\n\n\n\n内核开发者需要理解并对这些并发原因做好准备。如果在操作资源的代码过程中发生了中断，且中断处理程序可以访问同一个资源，那么就是一个严重的\
  \ bug。同样，如果内核代码在访问共享资源时是可以抢占的，也是一个 bug。类似地，如果内核代码在临界区中间进入睡眠，它也是一个 bug。最后，两个处理器永远不应该同时访问同一块数据。只要清楚了哪些数据需要保护，提供锁来保持系统稳定并不困难。相反，困难的部分在于识别这些情况，并意识到为了防止并发，你需要某种形式的保护。\n\
  \n让我们重申这一点，因为它非常重要。在代码中实现实际的锁来保护共享数据并不困难，特别是在开发设计阶段早期完成时。棘手的部分在于识别实际的共享数据和相应的临界区。这就是为什么从一开始就并在代码中设计锁机制，而不是在事后补救，是至关重要的。在事后（*ex\
  \ post*）去识别临界区域并将锁补全到现有代码中可能是困难的。生成的代码通常也不美观。此处的教训是，*始终*从开始就在你的代码中设计好锁。\n\n能够防止中断处理程序并发访问的代码被称为\
  \ `interrupt-safe`。在对称多处理器机器上能够防止并发访问的代码是 `SMP-safe`。能够防止内核抢占导致并发访问的代码是 `preempt-safe`。在所有这些情况下，用于提供同步和防止竞态条件的实际机制将在下一章中介绍。\n\
  \n*你还将发现，除少数例外外，是 SMP-safe 意味着是 preempt-safe。*\n\n## 知道需要保护什么\n\n识别具体哪些数据需要保护是至关重要的。因为任何可以并发访问的数据几乎都需要保护，因此，识别哪些数据*不需要*保护并从何处入手通常更容易。显然，任何局部于某一个特定执行线程的数据都不需要保护，因为只有该线程可以访问该数据。例如，局部自动变量（以及其地址仅存储在栈上的动态分配数据结构）不需要任何形式的锁，因为它们仅存在于执行线程的栈上。同样，只由某个特定任务访问的数据不需要锁（因为一个进程在同一时间内只能在一个处理器上执行）。\n\
  \n什么*确实*需要锁？大多数全局内核数据结构都是。一个好的经验法是：如果另一个执行线程可以访问该数据，那么该数据就需要某种形式的锁；如果其他人能看到它，就锁住它。记住锁*数据*，而不是*代码*。\n\
  \n### CONFIG ：SMP 与 UP\n\n由于 Linux 内核可以在编译时进行配置，因此为特定机器专门定制内核是有意义的。最重要的是，`CONFIG_SMP`\
  \ 配置选项控制内核是否支持 SMP。许多锁问题在单处理器机器上消失了；因此，当未设置 `CONFIG_SMP` 时，不需要的代码就不会编译到内核镜像中。例如，这种配置允许单处理器机器跳过自旋锁（spin\
  \ locks）的开销。同样的技巧也适用于 `CONFIG_PREEMPT`（启用内核抢占的配置选项）。这是一个极佳的设计——内核维护一个整洁的源码，并根据需要使用各种锁机制。在不同的架构上，`CONFIG_SMP`\
  \ 和 `CONFIG_PREEMPT` 的不同组合会编译出不同的锁支持。\n\n在你的代码中，为最悲观的情况（带有内核抢占的 SMP）提供适当的保护，这样就能覆盖所有场景。\n\
  \n每编写内核代码时，应该问自己这些问题：\n\n• 数据是全局的吗？除当前线程外的执行线程可以访问它吗？\n• 数据在进程上下文和中断上下文之间共享吗？它在两个不同的中断处理程序之间共享吗？\n\
  • 如果进程在访问此数据时被抢占，新调度的进程可以访问同一份数据吗？\n• 当前进程会在任何事情上睡眠（阻塞）吗？如果是，这会让任何共享数据处于什么状态？\n\
  • 什么能防止数据在我下方被释放？\n• 如果此函数在另一个处理器上被再次调用会怎样？\n• 鉴于上述点，我如何确保我的代码对并发是安全的？\n\n简而言之，内核中几乎所有的全局和共享数据都需要下一章中讨论的同步方法。\n\
  \n## 死锁\n\n*死锁*（deadlock）是一种涉及一个或多个执行线程和一个或多个资源的情况，使得每个线程等待其中一个资源，但所有资源已被持有。所有线程互相等待，但它们在释放已持有的资源方面永远不会取得任何进展。因此，没有任何线程可以继续执行，导致死锁。\n\
  \n一个很好的类比是四路路口。如果每个路口的每辆车都决定在通过之前等待其他车，那么没有一辆车会前进，我们就有了交通死锁。\n\n死锁最简单的例子是自死锁（self-deadlock）：如果一个执行线程尝试获取它已经持有的锁，它必须等待锁被释放。但它永远不会释放锁，因为正忙于等待锁，结果就是死锁：\n\
  \n```\nacquire lock\nacquire lock, again\nwait for lock to become available\n```\n\
  \n*某些内核通过提供递归锁（recursive locks）来防止这种死锁。递归锁是单个执行线程可以多次获取。幸运的是，Linux 不提供递归锁。这被广泛认为是一好事。虽然递归锁可能缓解自死锁问题，但它们很容易导致粗糙的锁语义。*\n\
  \n同样，考虑 *n* 个线程和 *n* 个锁。如果每个线程都持有另一个线程想要的锁，所有线程都在等待各自的锁变得可用时阻塞。最常见的例子是两个线程和两个锁，通常被称为*致命拥抱*或\
  \ *ABBA 死锁*：\n\n![image](img/t0170-01.jpg)\n\n每个线程都在等待另一个，没有任何一个线程会释放其原始锁；因此，没有任何锁会变得可用。\n\
  \n防止死锁场景是非常重要的。虽然很难证明代码没有死锁，但你*可以*编写无死锁的代码。几条简单的规则大有益：\n\n• 实现锁顺序。嵌套锁必须*始终*以相同的顺序获取。这可以防止致命拥抱死锁。记录锁的顺序以便他人遵循。\n\
  • 防止饥饿。问问自己，*这段代码总是能完成吗？如果* foo *没有发生，* bar *会永远等待吗？*\n• 不要重复获取同一个锁。\n• 为了简单性而设计。锁方案中的复杂性会引入死锁。\n\
  \n\n\n\n第一点是最重要且值得强调的。如果同时获取了两个或多个锁，必须`总是`按照相同的顺序获取它们。假设你拥有 `cat`、`dog` 和 `fox`\
  \ 锁，它们分别保护同名的数据结构。现在假设你有一个函数需要同时对这三个数据结构进行操作——也许是为了在它们之间拷贝数据。无论何种情况，数据结构都需要加锁以确保安全访问。如果一个函数按照\
  \ `cat`、`dog` 然后 `fox` 的顺序获取锁，那么`所有`其他函数都必须以相同的顺序获取这些锁（或其子集）。\n\n（上一个示例已翻译，此处接原文）\n\
  \n### [锁的可扩展性](https://wiki.example.org/lock_scalability)\n（此处为根据原文内容逻辑构建的翻译，由于原文未提供后续文本）\n\
  \n**不对，我应该重新根据你提供的文本进行完整翻译。**\n\n---\n\n重新翻译如下：\n\n原文：\nIf one function acquires\
  \ the locks in the order `cat`, `dog`, and then `fox`, then `every` other function\
  \ must obtain these locks (or a subset of them) in the same order.\n\n译文：\n如果一个函数按照\
  \ `cat`、`dog` 然后 `fox` 的顺序获取锁，那么`所有`其他函数都必须以相同的顺序获取这些锁（或其子集）。\n\n（注：由于你提供的待翻译文本包含大量关于锁顺序和可扩展性的描述，我将严格按照你提供的“待翻译文本”进行逐段翻译。）\n\
