  \n有符号变体很少被使用。\n\n这些显式类型仅仅是对标准 C 类型的 `。。\n\n。 `char` 的符号性\n\n-   C 标准规定 `char` 数据类型可以是有符号的或无符号的。由编译器、处理器或两者决定\
  \ `char` 类型的合适默认值。\n\n在大多数架构上，`char` 默认是有符号的，因此范围是从 -128 到 127。在少数其他架构上（如 ARM），`char`\
  \ 默认是无符号的，范围是从 0 到 255。\n\n例如，在 `char` 默认无符号的系统上，这段代码会在 `i` 中存储 255 而不是 -1：\n\n\
  ```c\nchar i = -1;\n```\n\n在其他机器上，`char` 默认是有符号的，这段代码正确地在 `i` 中存储 -1。如果程序员的意图是存储\
  \ -1，之前的代码应该是：\n\n```c\nsigned char i = -1;\n```\n\n而如果程序员真的想要存储 255，代码应该是：\n\n\
  ```c\nunsigned char = 255;\n```\n\n如果你在代码中使用 `char`，请假设它可以是*有符号 char* 或*无符号的 char*。如果你需要它显式地为其中一种，请将其声明为此。\n\
  \n### 数据对齐（Data Alignment）\n\n*对齐*指的是数据在内存中的位置。如果一个变量位于与其大小倍数的内存地址上，则它是*自然对齐的*。例如，一个\
  \ 32 位类型如果位于 4 的倍数地址上，就是自然对齐的（即其低 2 位为零）。因此，大小为 2^(*n*) 字节的数据类型地址的低 *n* 位必须为零。\n\
  \n某些架构对数据的对齐有严格要求。在某些系统上（通常是基于 RISC 的系统），加载未对齐的数据会导致处理器异常（处理过的错误）。在其他系统中，访问未对齐的数据可行，但会导致性能下降。\n\
  \n#### 避免对齐问题\n\n编译器通常通过自然对齐所有数据类型来防止对齐问题。事实上，对齐问题通常不是内核开发者的主要关注点——gcc 开发者会担心这些问题，所以程序员不需要。然而，当程序员过分操作指针并访问编译器预期之外的数据时，问题就会出现。\n\
