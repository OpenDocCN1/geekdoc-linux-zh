  \ 函数负责对进程时间的实际更新：\n\n![image](img/p0219-02.jpg)\n\n你可能会意识到，这种方法意味着内核认为进程在定时器中断发生时处理器所处的*任何*模式下运行了*整个*上一个滴答。实际上，该进程在最后一个滴答期间可能已经多次进入和退出内核模式。事实上，该进程甚至可能不是上一个滴答内唯一运行的进程！这种细粒度的进程计数是经典的\
  \ Unix 风格，在没有更复杂的计数机制的情况下，这是内核能提供的最佳方案。这也是高频率滴答率的另一个原因。\n\n接下来，`run_local_timers()`\
  \ 函数标记了一个软中断（softirq，见第 8 章，“底下半部与工作延迟”），来处理任何过期定时器的执行。定时器将在后续章节“定时器”中介绍。\n\n最后，`scheduler_tick()`\
  \ 函数减少当前运行进程的时间片，并在需要时设置 `need_resched`。在 SMP 机器上，它还会根据需要平衡每个处理器的运行队列。这在第 4 章 中进行了讨论。\n\
  \n`tick_periodic()` 函数返回原始的依赖架构的中断处理程序，后者执行任何必要的清理工作，释放 `xtime_lock` 锁并最终返回。\n\n\
  这一切每隔 `1/HZ` 秒发生一次。在 x86 机器上，这每秒可能是 *100* 或 *1,000* 次！\n\n### 当天时间\n\n当前的当天时间（墙钟时间）定义在\
  \ `kernel/time/timekeeping.c` 中：\n\n```\nstruct timespec xtime;\n```\n\n`timespec`\
  \ 数据结构在 `<linux/time.h>` 中定义为：\n\n![image](img/p0220-01.jpg)\n\n`xtime.tv_sec` 值存储了自\
  \ 1970 年 1 月 1 日（UTC）以来过的秒数。这个日期被称为*纪元*（epoch）。大多数 Unix 系统将相对于此纪元作为其对当前墙钟时间的概念。`xtime.v_nsec`\
  \ 值存储了最后一秒内经过的纳秒数。\n\n读取或写入 `xtime` 变量需要 `xtime_lock` 锁，它*不是*普通的自旋锁，而是一个*顺序锁*（seqlock）。第\
  \ 10 章，“内核同步方法”讨论了顺序锁。\n\n更新 `xtime` 需要一个写顺序锁：\n\n```\nwrite_seqlock(&xtime_lock);\n\
  \n/* update xtime ... */\n\nwrite_sequnlock(&xtime_lock);\n```\n\n读取 `xtime` 需要使用\
  \ `read_seqbegin()` 和 `read_seqretry()` 函数：\n\n![image](img/p0220-03.jpg)\n\n该循环一直重复，直到读取者确认读取数据时没有中间写入。如果在循环期间发生了定时器中断并更新了\
  \ `xtime`，则返回的序列号无效，循环重复。\n\n获取墙钟时间的主要用户空间接口是 `gettimeofday()`，它在 `kernel/time.c`\
  \ 中实现为 `sys_gettimeofday()`：\n\n![image](img/p0221-01.jpg)\n\n`timespec` 数据结构在 `<linux/time.h>`\
  \ 中定义为：\n\n![image](img/p0220-01.jpg)\n\n`xtime.tv_sec` 值存储了自 1970 年 1 月 1 日（UTC）以来过的秒数。这个日期被称为*纪元*。大多数\
  \ Unix 系统将相对于此纪元作为其对当前墙钟时间的概念。`xtime.v_nsec` 值存储了最后一秒内经过的纳秒数。\n\n### 定时器\n\n*定时器*（Timers）有时被称为*动态定时器*或*内核定时器*——对于管理内核代码中的时间流至关重要。内核代码通常需要延迟某些函数的执行直到以后。在之前的章节中，我们查看了使用底下半部机制，这种机制非常适合将工作延迟到以后。遗憾的是，“以后”的定义故意变得非常模糊。底下半部的目的与其说是为了*延迟工作*，不如说是为了*现在不执行这项工作*。我们需要一个延迟指定时间的工具——至少不会更短，并且希望不要太长。解决方案是内核定时器。\n\
  \n定时器易于使用。你执行一些初始设置，指定过期时间，指定在过期后执行的函数，并激活定时器。给定的函数在定时器过期后运行。定时器*不是*循环的。定时器在过期后会被销毁。这就是使用*动态*命名的原因之一：定时器不断被创建和销毁，且对定时器的数量没有限制。定时器贯穿整个内核。\n\
  \n#### 使用定时器\n\n定时器由 `struct timer_list` 表示，它定义在 `<linux/time.h>` 中：\n\n幸运的是，使用定时器不需要深入理解这个数据结构。不建议随意修改它以保持代码向前兼容。内核提供了一系列定时器相关的接口以方便管理定时器。所有内容在\
  \ `<linux/timer.h>` 中声明。大部分实际实现位于 `kernel/timer.c` 中。\n\n创建定时器的第一步是定义它：\n\n```\n\
  struct timer_list my_timer;\n```\n\n\n\n\n接下来，必须初始化定时器的内部值。这是通过辅助函数完成的，并且必须在调用任何定时器管理函数之前完成：\n\
  \n```\ninit_timer(&my_timer);\n```\n\n现在，你按照需要填充剩余的值：\n\n![image](img/p0222-02.jpg)\n\
  \n`my_timer.expires` 值指定了绝对节拍（ticks）单位的超时值。当当前的 `jiffies` 计数等于或大于 `my_timer.expires`\
  \ 时，处理函数 `my_timer.function` 将带有唯一参数 `my_timer.data` 运行。正如从 `timer_list` 的定义所示，该函数必须匹配此原型：\n\
  \n```\nvoid my_timer_function(unsigned long data);\n```\n\n`data` 参数允许你使用同一个处理程序注册多个定时器，并通过该参数来区分它们。如果你不需要该参数，可以简单传递零（或任何其他值）。\n\
  \n最后，你激活定时器：\n\n```\nadd_timer(&my_timer);\n```\n\n大功告成，定时器已启动并运行！请注意 `expired`\
  \ 值的重要性。当当前节拍计数等于或大于指定的过期时间时，内核运行定时器处理程序。虽然内核保证在定时器过期之前不会运行定时器处理程序，但运行定时器可能会有延迟。通常，定时器会在接近过期时运行；然而，它们可能会延迟到过期后的第一个定时器节拍。因此，定时器不能用于实现任何形式的硬实时处理。\n\
  \n有时你可能需要修改已激活定时器的过期时间。内核实现了一个函数 `mod_timer()`，它可以更改给定定时器的过期时间：\n\n```\nmod_timer(&my_timer,\
  \ jiffies + new_delay);  /* 新的过期时间 */\n```\n\n`mod_timer()` 函数也可以用于已初始化但未激活的定时器。如果定时器未激活，`mod_timer()`\
  \ 会激活它。如果定时器未激活，函数返回零；如果已激活，则返回一。无论何种情况，从 `mod_timer()` 返回后，定时器都会被激活并设置为新的过期时间。\n\
  \n如果你需要在定时器过期之前去激活定时器，请使用 `del_timer()` 函数：\n\n```\ndel_timer(&my_timer);\n```\n\
  \n该函数同时适用于激活和未激活的定时器。如果定时器已未激活，函数返回零；否则，函数返回一。注意，你不需要对已经过期的定时器调用此函数，因为它们会自动去激活。\n\
  \n在删除定时器时，存在一个必须防止的潜在竞态条件。当 `del_timer()` 返回时，它仅保证定时器不再处于激活状态（即它在未来不会被执行）。然而，在多处理器机器上，定时器处理程序可能已经在另一个处理器上执行。要取消激活定时器并等待可能正在执行的定时器处理器退出，请使用\
  \ `del_timer_sync()`：\n\n```\ndel_timer_sync(&my_timer);\n```\n\n与 `del_timer()`\
  \ 不同，`del_timer_sync()` 无法在中断上下文中使用。\n\n### 定时器竞态条件\n\n由于定时器相对于当前执行的代码是异步运行的，因此存在若干潜在的竞态条件。首先，永远不要使用以下操作来替代简单的\
  \ `mod_timer()`，因为这在多处理器机器上是不安全的：\n\n```\ndel_timer(my_timer)\nmy_timer->expires\
  \ = jiffies + new_delay;\nadd_timer(my_timer);\n```\n\n其次，在几乎所有情况下，都应该使用 `del_timer_sync()`\
  \ 而非 `del_timer()`。否则，你无法假设定时器当前没有在运行，而这正是你最初调用该函数的原因！想象一下，如果在删除定时器后，代码继续释放或以其他方式操作定时器处理程序使用的资源。因此，优选同步版本。\n\
  \n最后，你必须确保保护定时器处理函数中使用的任何共享数据。内核相对于其他代码异步运行该函数。有关定时器的数据应该像在第 8 章和第 9 章内核同步简介”中讨论的那样进行保护。\n\
  \n### 定时器实现\n\n内核在定时器中断完成后，以软中断（softirqs）的形式在下半部执行定时器。定时器中断处理程序运行 `update_process_times()`，然后调用\
  \ `run_local_timers()`：\n\n![image](img/p0224-02.jpg)\n\n`TIMER_SOFTIRQ` 软中断由 `run_timer_softirq()`\
  \ 处理。该函数在当前处理器上运行所有已过期的定时器（如果有）。\n\n定时器存储在链表中。然而，如果内核要不断遍历整个列表来寻找过期的定时器，或者按过期值对列表进行排序，将变得非常笨拙；这样定时器的插入和删除将变得非常昂贵。相反，内核根据过期值将定时器分为五组。随着过期时间的临近，定时器会在组间向下移动。这种分区确保了在大多数定时器软中断的执行中，内核只需花费极少工作即可找到过期的定时器。因此，定时器管理代码是高效的。\n\
  \n### 延迟执行\n\n通常，内核代码（尤其是驱动程序）需要一种方法在不使用定时器或下半部机制的情况下延迟执行一段时间。这通常是为了让硬件时间完成给定的任务。时间通常非常短。例如，网卡的规格可能会列出更改以太网模式需要两微秒。在设置了所需的速度后，驱动程序应该至少等待两微秒再继续。\n\
  \n内核提供了多种解决方案，取决于延迟的语义。这些解决方案具有不同的特性。有些在延迟时占用处理器——实际上阻止了——其他工作的完成。其他解决方案不占用处理器，但无法保证你的代码会在确切的时间恢复。实际上，没有方法可以保证延迟恰好是请求的时间。然而，有些方法非常接近，并且都承诺至少等待所需的时间。有些等待得更长。\n\
  \n#### 忙循环\n\n最简单的解决方案（尽管很少是最优方案）是*忙等待*或*忙循环*。这种技术仅适用于你想延迟的时间是节拍率的整数倍，或者对精度要求不高。\n\
  \n想法很简单：在循环中旋转直到通过了数量的节拍。例如 ![image](img/p0225-01.jpg)\n\n循环持续到 `jiffies` 大于 `delay`，这在过了\
  \ 10 个节拍后才会发生。在 `HZ` 等于 1000 的 x86 上，这会导致等待 10 毫秒。同样地\n\n![image](img/p0225-02.jpg)\n\
  \n它旋转直到通过了 2*HZ 个节拍，无论时钟频率如何，这总是两秒。\n\n这种方法对系统的其他部分不利。当你的代码等待时，处理器被浪费在愚蠢的循环中——没有完成任何工作！你很少想采用这种脑残的方法，在这里展示它是因为清晰且简单的延迟执行方法。\n\
  \n更好的解决方案是重新调度你的进程，允许处理器在你的代码等待时完成其他工作：\n\n```\nunsigned long delay = jiffies +\
  \ 5*HZ;\n\nwhile (time_before(jiffies, delay))\n          cond_resched();\n```\n\
  \n\n\n\n对 `cond_resched()` 的调用会调度一个新的进程，但只有在 `need_resched` 被设置时才会如此。换句话说，这种解决方案只有在有更重要的任务需要运行时才会条件地调用调度器。请注意，由于这种方法调用了调度器，因此你不能在中断处理程序中使用它——只能在进程上下文中使用。所有这些方法最好都在进程上下文中使用，因为中断处理程序应该尽可能快地执行。（而且忙循环无助于实现这一目标！）。此外，只要可能，不应在持有锁或禁用中断的情况下发生任何形式的延迟执行。\n\
  \nC 语言爱好者可能会好奇，有什么保证保证之前的循环即使是有效的。C 编译器通常被允许对给定的加载操作只执行一次。通常情况下，无法保证循环条件语句中的 `jiffies`\
  \ 变量会在每次循环迭代中被重新加载。然而，内核要求 `jiffies` 在每次迭代时都要被重新读取，因为该值在其他地方（在定时器中断中）会被递增。事实上，这就是为什么该变量在\
  \ `<linux/jiffies.h>` 中被标记为 `volatile`。`volatile` 关键字告诉编译器在每次访问时从主内存重新加载该变量，并且永远不在寄存器中为变量值创建别名，从而确保之前的循环按预期完成。\n\
  \n### 小延迟\n\n有时，内核代码（再次通常是驱动程序）需要短的（小于一个时钟周期）且相当精确的延迟。这通常是为了与硬件同步，而硬件通常会列出某些活动完成所需的最小时间——通常小于\
  \ 1 毫秒。对于如此短的等待，使用像之前示例那样基于 `jiffies` 的延迟是不可能的。对于 100Hz 的定时器中断，一个时钟周期是一个相当大的 10\
  \ 毫秒！即使是 1,000Hz 的定时器中断，时钟周期仍然有一毫秒。对于更小、更精确的延迟，显然需要另一种解决方案。\n\n幸运的是，内核提供了三个用于微秒、纳秒和毫秒延迟的函数，定义在\
  \ `<linux/delay.h>` 和 `<asm/delay.h>` 中，它们不使用 `jiffies`：\n\n```\nvoid udelay(unsigned\
  \ long usecs)\nvoid ndelay(unsigned long nsecs)\nvoid mdelay(unsigned long msecs)\n\
  ```\n\n前一个函数通过忙循环指定的 `microseconds`（微秒）数量来延迟执行。后一个函数按指定的 `milliseconds`（毫秒）数量延迟执行。回想一秒等于\
  \ 1,000 毫秒，这等于 1,000,000 微秒。用法非常简单：\n\n```\nudelay(150);      /* 延迟 150 μs */\n\
  ```\n\n`udelay()` 函数的实现为一个循环，该循环知道在给定的时间范围内可以执行多少次迭代。`mdelay()` 函数然后基于 `udelay()`\
  \ 实现。由于内核知道处理器在一秒内可以完成多少次循环（参见 BogoMIPS 侧边栏），`udelay()` 函数简单地将该值缩放到给定延迟所需的正确循环迭代次数。\n\
  \n### 我的 BogoMIPS 比你的大！\n\nBogoMIPS 值一直一直是困惑和幽默的来源。事实上，BogoMIPS 的计算与你计算机的性能几乎没有关系，它主要用于\
  \ `udelay()` 和 `mdelay()` 函数。它的名字是 *bogus*（即虚假的）和 *MIPS*（每秒百万条指令）的缩写。每个人都熟悉类似于下面的启动信息（这是在\
  \ 2.4GHz 的 7300 系列 Intel Xeon 上的）：\n\n```\nDetected 2400.131 MHz processor.\nCalibrating\
  \ delay loop... 4799.56 BogoMIPS\n```\n\nBogoMIPS 值是处理器在给定时间内可以执行的忙循环迭代次数。实际上，BogoMIPS\
  \ 是对处理器“无所事事”速度的测量！此值存储在 `loops_per_jiffy` 变量中，并可以通过 `/proc/cpuinfo` 读取。延迟循环函数使用\
  \ `loops_per_jiffy` 值来计算（相当精确地）它们需要执行多少次忙循环迭代来提供所需的延迟。\n\n内核在启动时通过 `init/main.c`\
  \ 中的 `calibrate_delay()` 计算 `loops_per_jiffy`。\n\n`udelay()` 函数应仅用于小延迟，因为在快速的机器上，较大的延迟可能会导致溢出。原则上，不要使用\
  \ `udelay()` 处理超过 1 毫秒的延迟。对于更长的时间，`mdelay()` 运行良好。与其他用于延迟执行的忙等待解决方案一样，除非绝对需要，否则不应使用这两个函数（特别是\
  \ `mdelay()`，因为它被用于如此长的延迟）。记住，在持有锁或禁用中断的情况下忙循环是不礼貌的，因为系统响应和性能将受到不利影响。然而，如果你需要精确延迟，这些调用是你的最佳选择。这些忙等待函数的典型用途是延迟很短的时间，通常在微秒范围内。\n\
  \n### schedule_timeout()\n\n一种更优延迟执行的方法是使用 `schedule_timeout()`。此调用让你的任务进入睡眠，直到至少过了指定的时间。无法保证睡眠时间会*恰好*是指定的时间——只能保证持续至少与指定的时间一样。当指定时间过后，内核会唤醒任务并将其放回运行队列。用法非常简单：\n\
  \n```\n/* 将任务状态设置为可中断睡眠 */\nset_current_state(TASK_INTERRUPTIBLE);\n/* 睡一会儿，会在 s\
  \ 秒后醒来 */\nschedule_timeout(s * HZ);\n```\n\n唯一的参数是所需的超时时间，单位为 jiffies。\n\n####\
  \ schedule_timeout() 实现\n\n`schedule_timeout()` 函数的实现非常直观。事实上，它是内核定时器的简单应用，让我们来看：\n\
  \n（引用图像 p0228-02 和 p0228-03）\n\n函数创建一个名为 `timer` 的定时器，并设置它在未来的 `timeout` 时钟周期后过期。它设置定时器在过期时执行\
  \ `process_timeout()` 函数。然后启用定时器并调用 `schedule()`。由于任务被标记为 `TASK_TIBLE` 或 `TASK_UNINTERTIBLE`，调度器*不会*运行该任务，而是选择另一个。\n\
  \n当定时器过期时，运行 `process_timeout()`：\n\n```\nvoid process_timeout(unsigned long data)\n\
  {\n    wake_up_process((task_t *) data);\n}\n```\n\n此函数将任务置于 `TASK_RUNNING` 状态并放回运行队列。\n\
  \n当任务重新调度时，它返回到 `schedule_timeout()` 中（调用 `schedule()` 之后）。如果任务被提前唤醒（如果收到了信号），定时器将被销毁。函数随后返回睡眠的时间。\n\
  \n`switch()` 语句中的代码是用于特殊情况的，不是该函数的通用用法。\n\n`MAX_SCHEDULE_TIMEOUT` 检查允许任务无限睡眠。在这种情况下，没有设置定时器（因为持续时间没有限制），并立即调用调度器。如果你这样做，你必须有另一种方法来唤醒你的任务！\n\
  \n注意，由于 `schedule_timeout()` 调用了调度器，调用它的代码必须能够睡眠。关于原子性和睡眠的讨论请参见第 8 章和第 9 章。简而言之，你必须在进程上下文中且持有锁。\n\
  \n### 在等待队列上睡眠，带超时\n\n\n\n\n\n第 4 章 讨论了内核中的进程上下文代码如何将自己置于等待队列上等待特定事件，然后调用调度器来选择一个新任务。在其他地方，当事件最终发生时，会调用\
  \ `wake_up()`，休眠在等待队列上的任务会被唤醒并可以继续运行。\n\n有时，我们需要等待特定事件发生或等待指定时间流逝——以者先到为准。在这些情况下，代码在将自己放入等待队列后，可能简单地调用\
  \ `schedule_timeout()` 而不是 `schedule()`。当所需的事件发生或指定时间到达时，任务会被唤醒。代码需要检查它*为什么*被唤醒——它可能是因为事件发生、时间到期或接收到了信号——并根据实际情况继续执行后续操作。\n\
  \n### 总结\n\n在本章中，我们查看了内核的时间概念，以及如何管理墙钟时间（wall time）和运行时间（uptime）。我们对比了相对时间与绝对时间，以及绝对事件与周期性事件。然后，我们涵盖了诸如定时器中断、定时器滴答（timer\
  \ ticks）、`HZ` 和 `jiffies` 等时间概念。\n\n我们查看了定时器的实现，以及你如何在自己的内核代码中使用它们。我们通过概述开发者可以使用的其他传递时间的方法作为本章的结束。\n\
  \n你编写的大部分内核代码将需要对时间及其流逝有某种理解。极有可能的是——特别是如果你在编写驱动程序——你将需要处理内核定时器。阅读这一章的意义不仅仅是为了消磨时间。\n\
  \n## 12 内存管理\n\n内核内部的内存分配不像内核外的内存分配那么简单。简单来说，内核缺乏用户空间所享有的奢侈。与用户空间不同，内核并不总是具备轻易分配内存的能力。例如，内核无法轻易地处理内存分配错误，且内核通常不能睡眠。由于这些限制以及对轻量级内存分配方案的需求，在内核中获取内存比在用户空间复杂得多。这并不是说从程序员的角度来看，内核内存分配是困难的——只是不同。\n\
  \n本章讨论了在内核内部获取内存的方法。然而，在深入具体的分配接口之前，你需要了解内核是如何处理内存的。\n\n 页（Pages）\n\n内核将物理页（physical\
  \ pages）视为内存管理的基本单元。虽然处理器的最小可寻址单位是字节或字，但内存管理单元（MMU，管理内存并执行虚拟到物理地址翻译的硬件）通常以页为单位进行处理。因此，MMU\
  \ 以页大小为粒度维护系统的页表（因此其名字来源）。在虚拟内存方面，页是最关重要的最小单元。\n\n正如你在第 19 章“可移植性”中所示，每个架构都定义了自己的页大小。许多架构甚至支持多种页大小。大多数\
  \ 32 位架构具有 4KB 的页，而大多数 64 位架构具有 8KB 的页。这意味着在有一台拥有 4KB 页和 1GB 内存的机器上，物理内存被划分为 262,144\
  \ 个不同的页。\n\n内核用 `struct page` 结构来表示系统上的每一个物理页。该结构定义在 `<linux/mm_types.h>` 中。我简化了定义，删除了两个对我们讨论基础没有帮助的混淆联合体（unions）：\n\
  \n![image](img/p0231-01.jpg)\n\n让我们看看重要的字段。`flags` 字段存储页的状态。这些标志包括页是否为脏（dirty）或是否被锁定在内存中。位标志表示不同的值，因此至少可以同时提供\
  \ 32 个不同的标志。标志值定义在 `<linux/page-flags.h>` 中。\n\n`_count` 字段存储页的引用计数——即对该页有多少次引用。当此计数达到\
  \ -1 时，说明没有人在使用该页，它就可以在新的分配中使用。内核代码不应该直接检查此字段，而应该使用 `page_count()` 函数，该函数接受一个 `page`\
  \ 结构作为唯一参数。虽然在内部当页空闲时 `_count` 为 -1，但 `page_count()` 返回 0 表示空闲，在页被使用时返回一个正非零整数。一个页可能被页缓存（page\
  \ cache）使用（在这种情况下 `mapping` 字段指向与该页相关的 `address_space` 对象）、作为私有数据（由 `private` 指向），或进程页表中的映射。\n\
  \n`virtual` 字段是页的虚拟地址。通常，这仅仅是页在虚拟内存中的地址。某些内存（称为高内存 high memory）并没有永久映射到内核的地址空间中。在这种情况下，该字段为\
  \ `NULL`，如果需要，必须动态映射。我们稍后会讨论高内存。\n\n需要理解的关键点是，`page` 结构与物理页相关，而不是虚拟页。因此，该结构描述的内容充其量是瞬时的。即使页包含的数据继续存在，由于交换（swapping）等原因，它可能并不总是同一个\
  \ `page` 结构相关。内核使用此数据结构来描述相关的物理页。该数据结构的目标是描述物理内存，而不是其中的数据。\n\n内核使用此结构来跟踪系统中的所有页，因为内核需要知道一个页是否空闲（即页未被分配）。如果页未闲，内核需要知道是谁拥有该页。可能的所有者包括用户空间进程、动态分配的内核数据、静态内核代码、页缓存等。\n\
  \n## 区域（Zones）\n\n由于硬件限制，内核不能将所有页视为同等。某些页由于其在内存中的物理地址无法无法某些任务。由于这种限制，内核将页分为不同的区域。内核利用区域将具有相似属性的页分组。特别是，Linux\
  \ 必须处理硬件在内存寻方面的缺陷：\n\n- 某些硬件设备只能对特定的内存地址执行 DMA（直接内存访问）。\n- 某些架构能够物理寻址的内存大于大于虚拟寻址。因此，某些内存没有永久映射到内核地址空间。\n\
  \n由于这些限制，Linux 有四个主要的内存区域：\n\n- `ZONE_DMA`：包含可以进行 DMA 的页。\n- `ZONE_DMA32`：与 `ZONE_DMA`\
  \ ，包含可以进行 DMA 的页。与 `ZONE_DMA` 不同，这些页只能被 32 位设备访问。\n- `ZONE_NORMAL`：包含正常的、常规映射的页。\n\
  - `ZONE_HIGHMEM`：包含“高内存”，即未永久映射到内核地址空间的页。\n\n这些区域以及另外两个不显著的区域定义在 `<linux/mmzone.h>`\
  \ 中。\n\n\n\n\n内存区的实际用法和布局取决于架构。例如，某些架构在向任何内存地址执行 DMA 时没有任何问题。在这些架构中，`ZONE_DMA` 是空的，无论其用途如何，都使用\
  \ `ZONE_NORMAL` 进行分配。作为一个对面的反例，在 x86 架构上，ISA 设备无法向整个 32 位地址空间执行 DMA，因为 ISA 设备只能访问物理内存的前\
  \ 16MB。因此，x86 上的 `ZONE_DMA` 包含了从 0MB 到 16MB 范围内的所有内存。\n\n*同样地，某些损坏的 PCI 设备只能向 24\
  \ 位地址空间执行 DMA。*\n\n`ZONE_HIGHMEM` 的工作原理也一样。一个架构可以和不能直接映射的内容各不相同。在 32 位 x86 系统上，`ZONE_HIGHMEM`\
  \ 是物理 896MB 标记以上的所有内存。在其他架构上，`ZONE_HIGHMEM` 是空的，因为所有内存都是直接映射的。`ZONE_HIGHMEM` 的内存称为高内存（high\
  \ memory）。系统的其余内存称为低内存（low memory）。\n\n*Linux 的高内存与 DOS 中的高内存毫无关系，后者是为了绕过 DOS 的限制和\
  \ x86 的“实模式”处理器状态。*\n\n`ZONE_NORMAL` 往往是前两个区域在占用其所需份额后剩余的部分。例如，在 x86 上，`ZONE_NORMAL`\
  \ 是从 16MB 到 896MB 的所有物理内存。在其他（更幸运的）架构上，`ZONE_NORMAL` 是所有可用内存。[表 12.1] 列出了 x86-32\
  \ 上每个区域及其消耗的页列表。\n\n#### 表 12.1 x86-32 上的区域\n\n![image](img/t0234-01.jpg)\n\nLinux\
  \ 将系统的页划分为不同的区域（zones），以建立内存池来根据需要满足分配。例如，拥有一个 `ZONE_DMA` 池使得内核具备了满足 DMA 所需内存分配的能力。如果需要此类内存，内核可以简单从\
  \ `ZONE_DMA` 中提取所需数量的页。注意，区域之间没有物理关联，它们仅仅是内核用于跟踪页的逻辑分组。\n\n尽管某些分配可能需要特定区域的页，但其他分配可能会从多个区域提取。例如，虽然对\
  \ DMA 可内存的分配必须源自 `ZONE_DMA`，但普通分配可以来自 `ZONE_DMA` 或 `ZONE_NORMAL`，但不能兼者；分配不能跨越区域边界。当然，内核倾向于从普通区域满足普通分配，以便为\
  \ `ZONE_DMA` 中的页留出需要它的分配。但如果情况迫在眉睫（例如，当内存变得紧张时），内核可以从任何可用且合适的区域中提取。\n\n并不是所有架构都定义所有的区域。例如，像\
  \ Intel 的 x86-64  64 位架构可以完全映射并处理 64 位内存。因此，x86-64 没有 `ZONE_HIGHMEM`，所有物理内存都包含在\
  \ `ZONE_DMA` 和 `ZONE_NORMAL` 中。\n\n每个区域都由 `struct zone` 表示，该结构定义在 `<linux/mmzone.h>`\
  \ 中：\n\n![image](img/p0235-01.jpg)\n\n该结构很大，但系统中只有三个区域，因此只有三个这样的结构。让我们来看更重要的字段。\n\
  \n`lock` 字段是一个自旋锁，用于保护结构免受并发访问。注意，它只保护结构本身，而不是该区域中的所有页。特定的锁并不保护单个页，尽管内核的部分可能会锁定恰好驻在所述页中的数据。\n\
  \n`watermark` 数组持有该区域的最小水位、低水位和高水位。内核使用水位来设置每个区域内存消耗的适宜性基准，并根据水位相对于空闲内存的变化调整其激进程度。\n\
  \n`name` 字段正如所料的，是一个以 `NULL` 结尾的字符串，表示该区域的名称。内核在启动期间在 `mm/page_alloc.c` 中初始化此值，三个区域被命名为\
  \ DMA、Normal 和 HighMem。\n\n### 获取页\n\n现在我们已经了解了内核如何管理内存（通过页、区域等）——让我们看看内核实现的接口，以便你能够在内核中分配和释放内存。\n\
  \n内核提供了一种请求内存的低级机制，以及若干个访问它的接口。所有这些接口都以页为粒度进行内存分配，并在 `<linux/gfp.h>` 中声明。核心函数是：\n\
  \n```\nstruct page * alloc_pages(gfp_t gfp_mask, unsigned int order)\n```\n\n这分配了\
  \ 2^(order)（即 `1 << order`）连续的物理页，并返回指向第一个页的 `page` 结构的指针；出错时返回 `NULL`。我们将在稍后的章节中查看\
  \ `gfp_t` 类型和 `gfp_mask` 参数。你可以使用函数将给定的页转换为逻辑地址：\n\n```c\nvoid * page_address(struct\
  \ page *page)\n```\n\n这返回一个指向逻辑地址的指针。\n\n#### 释放页\n\n一组函数允许你在不再需要已分配的页时释放这些页：\n\n\
  ```c\nvoid __free_pages(struct page *page, unsigned int order)\nvoid free_pages(unsigned\
  \ long addr, unsigned int order)\nvoid free_page(unsigned long addr)\n```\n\n\n\n\
  [content]\n\n`kmalloc()` 函数的操作与用户空间中熟悉的 `malloc()` 例程相似，区别在于多了一个额外的 `flags` 参数。`kmalloc()`\
  \ 是用于按字节块获取内核内存的简单接口。如果你需要整页内存，之前讨论的接口可能是更好的选择。然而，对于大多数内核分配，`kmalloc()` 是首选的接口。\n\
  \n该函数在 `<linux/slab.h>` 中声明：\n\n```c\nvoid * kmalloc(size_t size, gfp_t flags)\n\
  ```\n\n该函数返回一个指向内存区域的指针，其长度*至少*为 `size` 字节。分配的内存区域在物理上是连续的。如果出错，它将返回 `NULL`。内核分配总是成功的，除非可用内存不足。因此，你必须在所有调用\
  \ `kmalloc()` 之后检查是否为 `NULL` 并适当处理错误。\n\n`kmalloc()` 分配的内存可能比你请求的要，尽管你无法知道到底多给了多少！因为内核分配器本质上是基于页的，某些分配可能会向上取整以适应可用内存。内核返回的内存绝不会少于请求量。如果内核无法找到至少请求的量，分配将失败，函数返回\
  \ `NULL`。\n\n让我们来看一个例子。假设你需要为一个虚拟的 `dog` 结构动态分配足够的空间：\n\n```c\nstruct dog *p;\n\n\
  p = kmalloc(sizeof(struct dog), GFP_KERNEL);\n\nif (!p)\n    /* 处理错误 ... */\n```\n\
  \n如果 `kmalloc()` 调用成功，`p` 现在指向一个至少为请求大小的内存块。`GFP_KERNEL` 标志指定了内存分配器在尝试获取内存并返回给 `kmalloc()`\
  \ 调用者时的行为。\n\n### gfp_mask 标志\n\n你已经在底层页分配函数和 `kmalloc()` 中看到过各种分配器标志的示例了。现在是时候深入讨论这些标志了。标志由\
  \ `gfp_t` 类型表示，该类型在 `<linux/types.h>` 中定义为 `unsigned int`。*gfp* 代表 `__get_free_pages()`，这是我们之前讨论过的内存分配例程之一。\n\
  \n标志被分为三类：动作修饰符（action modifiers）、区域修饰符（zone modifiers）和类型（types）。动作修饰符指定了内核应该*如何*分配请求的内存。在某些情况下，只能采用特定的方法来分配内存。例如，中断处理程序必须指示内核在分配内存过程中不要睡眠（因为中断处理程序不能重新调度）。区域修饰符指定了从*何处*分配内存。正如你在本章前面的部分看到的，内核将物理内存划分为多个区域（zones），每个区域都有不同的用途。区域修饰符指定了从这些区域中的哪一个进行分配。类型标志根据特定*类型*内存分配的需求指定动作和区域修饰符的组合。类型标志简化了多个修饰符的指定；与其提供动作和区域修饰符的组合，你只需要指定一个类型标志。`GFP_KERNEL`\
  \ 是一个类型标志，用于内核内部进程上下文的代码。让我们来看看这些标志。\n\n#### 动作修饰符\n\n所有标志（包括动作修饰符在内）都声明在 `<linux/gfp.h>`\
  \ 中。然而，`<linux/slab.h>` 文件包含了这个头文件，所以通常不需要直接包含它。在实际上，你通常只使用稍后讨论的类型修饰符。尽管如此，了解这些单独的标志是有好处的。表\
  \ 12.3 是动作修饰符列表。\n\n表 12.3. 动作修饰符\n\n![image](img/t0239-01.jpg)\n\n这些分配可以一起指定。例如：\n\
  \n```c\nptr = kmalloc(size, __GFP_WAIT | __GFP_IO | __GFP_FS);\n```\n\n此调用指示页分配器（最终通过\
  \ `alloc_pages()`）如果需要，分配可以阻塞、执行 I/O 并执行文件系统操作。这使得内核在寻找空闲内存以满足分配方面具有很大的自由。\n\n大多数分配都指定了这些修饰符，但是通过我们稍后讨论的类型标志间接实现的。别担心——你不需要每次分配内存时都要弄清楚使用这些奇怪标志中的哪一个！\n\
  \n#### 区域修饰符\n\n区域修饰符指定了分配应该从哪个内存区域起始。通常，分配可以从任何区域完成。然而，内核更倾向于 `ZONE_NORMAL`，以确保在其他区域需要时留有空闲页。\n\
  \n只有三个区域修饰符，因为除了 `ZONE_NORMAL`（默认分配起始的地方）之外只有三个区域。表 12.4 是区域修饰符列表。\n\n表 12.4. 区域修饰符\n\
  \n![image](img/t0240-01.jpg)\n\n指定这三个标志之一会修改内核尝试满足分配的区域。`__GFP_DMA` 标志强制内核从 `ZONE_DMA`\
  \ 满足请求。该标志表示：*我绝对必须拥有可以让我执行 DMA 的内存*。相反，`__GFP_HIGHMEM` 标志指示分配器从 `ZONE_NORMAL` 或（优先从）`ZONE_HIGHMEM`\
  \ 满足请求。该标志表示：*我可以使用高内存（high memory），所以你可以乖乖地给我其中的一部分，但普通内存也可以*。如果哪一个标志都没有指定，内核将从\
  \ `ZONE_DMA` 或 `ZONE_NORMAL` 完成分配，并强烈倾向于从 `ZONE_NORMAL` 满足分配。\n\n你不能在对 `__get_free_pages()`\
  \ 或 `kmalloc()` 指定 `__GFP_HIGHMEM`。因为这两者返回的都是逻辑地址而不是 `page` 结构，这些函数可能会分配当前未映射到内核虚拟地址空间的内存，因此没有逻辑地址。只有\
  \ `alloc_pages()` 可以分配高内存。然而，你的大多数分配将不会指定区域修饰符，因为 `ZONE_NORMAL` 就足够了。\n\n#### 类型标志\n\
  \n类型标志指定了满足特定类型事务所需的动作和区域修饰符。因此，内核代码倾向于使用正确的类型标志，而不是指定它可能可能需要的其他许多种标志。这既更简单又不容易出错。表\
  \ 12.5 是类型标志列表，表 12.6 显示了每个类型标志与哪些修饰符相关。\n\n表 12.5. 类型标志\n\n![image](img/t0241-01.jpg)\n\
  \n表 12.6. 每个类型标志后的修饰符\n\n![image](img/t0241-02.jpg)\n\n让我们来看看常用的标志，以及你何时以及为什么可能需要它们。内核中的绝大多数分配使用\
  \ `GFP_KERNEL` 标志。生成的分配是一个可能会睡眠的普通优先级分配。由于调用可能会阻塞，此标志只能从可以安全重新调度的进程上下文使用（即没有持有锁等）。由于该标志对内核如何获取请求的内存没有任何限制，因此内存分配成功的概率很高。\n\
  \n在光谱的另一端是 `GFP_ATOMIC` 标志。因为该标志指定了不能睡眠的内存分配，该分配在为调用者获取内存方面具有限制性。如果没有足够大的连续内存块，内核不太可能释放内存，因为它不能让调用者睡眠。相反，`GFP_KERNEL`\
  \ 分配可以让调用者睡眠以将不活动页交换到磁盘、刷新脏页到磁盘等。由于 `GFP_ATOMIC` 无法执行这些任何操作，与 `GFP_KERNEL` 分配相比，它的成功概率较低（至少在内存低时）。尽管如此，当当前代码无法睡眠时（例如在中断处理程序、软中断和任务中），`GFP_ATOMIC`\
  \ 标志是唯一的选择。\n\n[/content]\n\n\n\n\n在这两个标志之间是 `GFP_NOIO` 和 `GFP_NOFS`。使用这些标志启动的分配可能会阻塞，但它们会避免执行某些其他操作。`GFP_NOIO`\
  \ 分配不会为了满足请求而启动任何磁盘 I/O。另一方面，`GFP_NOFS` 可能会启动磁盘 I/O，但不会启动文件系统 I/O。为什么你可能需要这些标志呢？它们分别用于某些底层的块\
  \ I/O 或文件系统代码。想象一下，如果文件系统代码中的一条常用路径在*没有* `GFP_NOFS` 标志的情况下分配了内存，会怎样？分配可能会导致*更多*文件系统操作，从而引发其他分配，进而产生更多的文件系统操作！这可能会无限持续。调用分配器的此类代码必须确保分配器本身也不执行该代码，否则分配可能会导致死锁。不奇怪的是，内核仅在少数地方使用了这两个标志。\n\
  \n`GFP_DMA` 标志用于指定分配器必须从 `ZONE_DMA` 满足请求。该标志被设备驱动程序使用，它们需要为设备提供 DMA 可访问的内存。通常，你会将此标志与\
  \ `GFP_ATOMIC` 或 `GFP_KERNEL` 标志结合使用。\n\n在你编写的大部分代码中，你会使用 `GFP_KERNEL` 或 `GFP_ATOMIC。表\
  \ 12.7 是常见情况及对应标志的列表。无论分配类型如何，你必须检查并处理失败。\n\n表 12.7. 何时使用什么标志\n\n![image](img/t0243-01.jpg)\n\
  \n### `kfree()`\n\n`kmalloc()` 的对应函数是 `kfree()`，它在 `<linux/slab.h>` 中声明：\n\n```\n\
  void kfree(const void *ptr)\n```\n\n`kfree()` 方法释放之前通过 `kmalloc()` 分配的内存块。不要对之前未通过\
  \ `kmalloc()` 分配的内存调用此函数，或对已经释放的内存调用此函数。这样做是一个错误，会导致糟糕的行为，例如释放属于内核其他部分的内存。像在用户空间一样，要注意平衡分配和释放，以防止内存泄漏和其他错误。请注意，调用\
  \ `kfree(NULL)` 会经过显式检查并且是安全的。\n\n让我们来看一个在中断处理程序中分配内存的示例。在这个例子中，中断处理程序想要分配一个缓冲区来存放传入的数据。预处理器宏\
  \ `BUF_SIZE` 是该所需缓冲区的 own（字节字节），它显然大于几个字节。\n\n```\nchar *buf;\nbuf = kmalloc(BUF_SIZE,\
  \ GFP_ATOMIC);\nif (!buf)\n    /* 内存分配失败！ */\n```\n\n稍后当你不再需要该内存时，不要忘记释放它：\n\n```\n\
  kfree(buf);\n```\n\n### `vmalloc()`\n\n`vmalloc()` 函数的工作方式与 `kmalloc()` 类似，但它分配的内在虚拟上是连续的，而不一定在物理上连续的。这就是用户空间分配函数的工作方式：`malloc()`\
  \ 返回的页面在处理器的虚拟地址空间内是连续的，但不能保证它们在物理 RAM 中也是连续的。`kmalloc()` 函数保证页面在物理上是连续的（在虚拟上也是连续的）。`vmalloc()`\
  \ 函数仅确保页面在虚拟地址空间内是连续的。它通过分配可能不连续的物理内存块并“修复”页表，将内存映射到连续的块中来实现。\n\n`vmalloc()` 函数在\
  \ `<linux/vmalloc.h>` 中声明，并在 `mm/vmalloc.c` 中定义。用法与用户空间相同：\n\n```\nvoid * vmalloc(unsigned\
  \ long size)\n```\n\n该函数返回一个指向至少 `size` 字节虚拟连续内存的指针。出错时，函数返回 `NULL`。该函数可能会睡眠，因此不能在中断上下文中调用。\n\
  \n要释放通过 `vmalloc()` 获取的分配，请使用\n\n```\nvoid vfree(const void *addr)\n```\n\n此函数释放之前通过\
  \ `vmalloc()` 分配的从 `addr` 开始的内存块。该函数也可以睡眠，因此不能在中断上下文中调用。它没有返回值。\n\n这些函数的使用非常简单：\n\
  \n![image](img/p0245-01.jpg)\n\n## Slab 层\n\n分配和释放数据结构是任何内核内部最常见的操作之一。为了方便数据的频繁分配和释放，程序员经常会引入*空闲列表（free\
  \ lists）*。空闲列表包含一组可用的、已经分配好的的数据结构块。当代码需要数据结构的新实例时，它可以从空闲列表中获取一个结构，而不是分配足够的内存并对其进行设置。稍后，当数据结构不再需要时，它会被返回空闲列表而不是被释放。从这个意义上说，空闲列表充当了对象缓存，缓存频繁使用的类型对象。\n\
  \n内核中空闲列表的一个主要问题是不存在全局控制。当可用内存较低时，内核没有办法通知每个空闲列表让其缩小规模以释放内存。内核完全无法理解这些随机的空闲列表。为了解决这个问题并合并代码，Linux\
  \ 内核提供了 slab 层（也称为 slab 分配器）。slab 层充当通用的数据结构缓存层。\n\nslab 分配器的概念首次在 Sun Microsystems\
  \ 的 SunOS 5.4 操作系统实现。Linux 数据结构缓存层共享相同的名称和基本设计。\n\nslab 层尝试利用以下几个基本原则：\n\n• 频繁使用的数据结构往往经常分配和释放，因此对其进行缓存。\n\
  \n\n\n\n\n-   频繁的分配和释放会导致内存碎片（无法找到大块连续的可用内存）。为了防止这种情况，缓存的空闲列表是连续排列的。由于被释放的数据结构会返回到空闲列表，因此不会产生碎片。\n\
  -   空闲列表在频繁的分配和释放期间提供了更好的性能，因为被释放的对象可以立即返回给下一次分配。\n-   如果分配器能够感知对象大小、页面大小和总缓存大小等概念，它就可以做出更智能的决策。\n\
  -   如果缓存的某部分是每个处理器特有的（系统中每个处理器独立且唯一），则可以在不使用 SMP 锁的情况下执行分配和释放。\n-   如果分配器是感知 NUMA\
  \ 节点，它可以从与请求者相同的内存节点中完成分配。\n-   存储的对象可以进行 `colored`（染色）处理，以防止多个对象映射到相同的缓存行上。\n\n\
  Linux 的 slab 层在设计和实现时充分考虑了这些前提条件。\n\n## Slab 层的设计\n\nslab 层将不同的对象分为称为 `caches`（缓存）的组，每个缓存存储不同类型的对象。每种对象类型有一个缓存。例如，一个缓存用于进程描述符（`task_struct`\
  \ 结构的空闲列表），而另一个缓存用于 inode 对象（`struct inode`）。有趣的是，`kmalloc()` 接口构建在 slab 层之上，它使用了一系列通用缓存。\n\
  \n然后，这些缓存被划分为 `slabs`（因此得出了该系统的名称）。slab 由一个或多个物理连续的页面组成。通常，slab 只由单个页面组成。每个缓存可能由多个\
  \ slab 组成。\n\n每个 slab 包含数量数量 `objects`，即被缓存的数据结构。每个 slab 处于三种状态之一：满（full）、部分（partial）或空（empty）。满\
  \ slab 没有空闲对象（slab 中的所有对象都已分配）。空 slab 没有已分配对象（slab 中的所有对象都是空闲的）。部分 slab 包含一些已分配对象和空闲对象。当内核的某个请求新对象时，如果存在部分\
  \ slab，则从该处满足请求；否则，从空 slab 满足请求。如果不存在空 slab，则创建一个。显然，满 slab 永远无法满足请求，因为它没有空闲对象。这种策略减少了碎片。\n\
  \n让我们以 `inode` 结构为例，它是磁盘 inode 在内存中的表示（参见第 13 章，“虚拟文件系统”）。这些结构频繁地创建和销毁，因此通过 slab\
  \ 分配器管理它们是合理的。因此，`struct inode` 从 `inode_cachep` 缓存中分配。（这种命名约定是标准的。）此缓存由一个或多个 slab\
  \ 组成——因为有很多对象，可能有很多 slab。每个 slab 尽可能包含尽可能 `struct inode` 对象。当内核请求新的 `inode` 结构时，内核从部分\
  \ slab 中返回一个已分配但未使用的结构指针；如果没有部分 slab，则从空 slab 中返回。当内核使用完 `inode` 对象后，slab 分配器会将该对象标记为空闲。图\
  \ 12.1 概述了缓存、slab 和对象之间的关系。\n\n图 12.1 缓存、slab 和对象之间的关系。\n\n![image](img/12fig01.jpg)\n\
  \n每个缓存由一个 `kmem_cache` 结构表示。该结构包含三个列表——`slabs_full`、`slabs_partial` 和 `slabs_empty`——存储在\
  \ `kmem_list3` 结构中，该结构定义在 `mm/slab.c` 中。这些列表包含了与缓存相关的所有 slab。 描述符 `struct slab`\
  \ 代表每个 slab：\n\n![image](img/p0247-01.jpg)\n\nslab 描述符要么在 slab 外部的通用缓存中分配，要么在 slab\
  \ 内部开头分配。如果 slab 的总大小足够小，或者内部空隙空间足够容描述符，则将描述符存储在 slab 内部。\n\nslab 分配器通过 `__get_free_pages()`\
  \ 与底层内核页面分配器接口来创建新的 slab：\n\n![image](img/p0248-01.jpg)\n\n该函数使用 `__get_free_pages()`\
  \ 分配足够容缓存的内存。该函数的第一个参数指向需要更多页面的缓存。第二个参数指向传递给 `__get_free_pages()` 的标志。注意此值是如何与另一个值进行按位或（OR）操作的。这会将缓存所需的默认标志添加到\
  \ `flags` 参数中。分配的 2 的幂大小存储在 `cachep->gfporder` 中。之前的函数比预想的要复杂一点，因为它包含了使分配器感知 NUMA\
  \ 的代码。当 `nodeid` 不为 -1 时，分配器尝试从请求分配的相同内存节点完成分配。这在 NUMA 系统上提供了更好的性能，因为在 NUMA 系统中访问节点之外的内存会导致性能损失。\n\
  \n出于教学目的，我们可以忽略感知 NUMA 的代码并编写一个简单的 `kmem_getpages()`：\n\n![image](img/p0249-01.jpg)\n\
  \n内存通过 `kmem_freepages()` 释放，该函数会对给定缓存的页面调用 `free_pages()`。当然，slab 层的意义在于避免分配和释放页面。反之，只有当给定缓存中不存在任何部分或空\
  \ slab 时，slab 层才会调用页面分配函数。只有当可用内存变低且系统尝试释放内存，或者显式销毁缓存时，才会调用释放函数。\n\nslab 层通过一个简单的接口按缓存进行管理，该接口导出到整个内核。该接口允许新缓存的创建和销毁，以及缓存内对象的分配和释放。对缓存及其内部\
  \ slab 的复杂管理完全由 slab 层的内部处理。在你创建一个缓存后，slab 层工作就像一个针对特定类型对象的专用分配器。\n\n## Slab 分配器接口\n\
  \n通过以下方式创建新缓存：\n\n![image](img/p0249-02.jpg)\n\n第一个参数是存储缓存名称字符串。第二个参数是缓存中每个元素的大小。第三个参数是第一个对象在\
  \ slab 内的偏移。这样做是为了确保页面内的特定对齐。通常，0 就足够了，这产生标准对齐。`flags` 参数指定控制缓存行为的可选设置。它可以是 0（指定无特殊行为），或者是以下一个或多个标志的按位或组合：\n\
  \n- `SLAB_HWCACHE_ALIGN`——此标志指示 slab 层将 slab 内每个对象对齐到缓存行。这防止了“伪共享”（两个或多个对象尽管在内存中的地址不同，但映射到相同的缓存行）。这提高了性能，但代价是增加了内存足迹，因为更严格的对齐会导致更多的浪费空间。内存消耗的增加取决于对象的大小以及它们相对于系统缓存行的对齐情况。对于性能关键代码中频繁使用的缓存，设置此选项是一个好主意；否则，请仔细考虑。\n\
  - `SLAB_POISON`——此标志导致 slab 层用已知值（`a5a5a5a5`）填充 slab。这被称为*中毒*（poisoning），有助于捕捉对未初始化内存的访问。\n\
  - `SLAB_RED_ZONE`——此标志导致 slab 层在分配内存周围插入“红区”，以帮助检测溢出。\n\n\n\n\n\n- `SLAB_PANIC`—此标志在分配失败时会导致\
  \ slab 层触发恐慌（panic）。当分配*绝不能失败*时，此标志非常有用，例如在启动期间分配 VMA 结构缓存时（参见第 15 节，“进程地址空间空间”）。\n\
  - `SLAB_CACHE_DMA`—此标志指示 slab 层在 DMA 可访问内存中分配每个 slab。如果分配的对象用于 DMA 且必须驻留在 `ZONE_DMA`\
  \ 中，则需要此标志。否则，你不需要此标志，且不应该设置它。\n\n最后一个参数 `ctor` 是缓存的构造函数。每当向缓存添加新页时，就会调用该构造函数。在实践中，Linux\
  \ 内核中的缓存并不经常利用构造函数。事实上，曾经还有一个一个析构函数参数，但因为没有内核代码使用它而被删除了。你可以为此参数传递 `NULL`。\n\n执行成功后，`kmem_cache_create()`\
  \ 返回指向所创建缓存的指针。否则，它返回 `NULL`。此函数不能在中断上下文中调用，因为它可能会睡眠。\n\n要销毁一个缓存，请调用：\n\n```c\n\
  int kmem_cache_destroy(struct kmem_cache *cachep)\n```\n\n如名所示，此函数会销毁给定的缓存。它通常在创建自定义缓存的模块的关闭代码中调用。它不能在中断上下文中调用，因为它可能会睡眠。此函数的调用者在调用此函数之前必须确保以下两个条件成立：\n\
  \n- 缓存中的所有 slab 都是空的。事实上，如果其中一个 slab 中的对象仍被分配并正在使用，缓存又能被销毁呢？\n- 在调用 `kmem_cache_destroy()`\
  \ 期间（显然以及在调用之后）没有任何访问该缓存。调用者必须确保这种同步性。\n\n执行成功后，该函数返回零；否则返回非零。\n\n### 从缓存中分配\n\n\
  缓存创建后，通过以下函数从缓存中获取对象：\n\n```c\nvoid * kmem_cache_alloc(struct kmem_cache *cachep,\
  \ gfp_t flags)\n```\n\n此函数返回一个指向给定缓存 `cachep` 中对象的指针。如果缓存中的任何 slab 都没有空闲对象，且 slab\
  \ 层必须通过 `kmem_getpages()` 获取新页，则 `flags` 的值将传递给 `__get_free_pages()`。这些是我们之前看过的相同标志。你可能想要\
  \ `GFP_KERNEL` 或 `GFP_ATOMIC`。\n\n要稍后释放对象并将其返回到原始 slab，请使用函数：\n\n```c\nvoid kmem_cache_free(struct\
  \ kmem_cache *cachep, void *objp)\n```\n\n这会将 `cachep` 中的对象 `objp` 标记为空闲。\n\n###\
  \ 使用 Slab 分配器的示例\n\n让我们来看使用 `task_struct` 结构（进程描述符）的真实示例。这段代码以稍微复杂的形式出现在 `kernel/fork.c`\
  \ 中。\n\n首先，内核有一个全局变量，存储指向 `task_struct` 缓存的指针：\n\n```c\nstruct kmem_cache *task_struct_cachep;\n\
  ```\n\n在内核初始化期间，在位于 `kernel/fork.c` 的 `fork_init()` 中，创建了缓存：\n\n![image](img/p0251-01.jpg)\n\
  \n这创建了一个名为 `task_struct` 的缓存，它存储类型为 `struct task_struct` 的对象。对象在 slab 内部以 `ARCH_MIN_TASKALIGN`\
  \ 字节的偏移量创建。这个预处理器定义是一个特定体系的值。它通常被定义为 `L1_CACHE_BYTES`——L1 缓存的字节大小。没有构造函数。注意，没有检查返回值为\
  \ `NULL`（表示失败），因为提供了 `SLAB_PANIC` 标志。如果分配失败，slab 分配器将调用 `panic()`。如果你不提供此标志，则必须检查返回值！在这里使用\
  \ `SLAB_PANIC` 标志是因为这是系统运行所必需的缓存。（没有进程描述符，机器运行会非常糟糕。）\n\n每当进程调用 `fork()` 时，都必须创建一个新的进程描述符（回想第\
  \ 3 节](#ch03.html)，“进程管理”）。这在 `dup_task_struct()` 中完成，它由 `do_fork()` 调用：\n\n```c\n\
  struct task_struct *tsk;\ntsk = kmem_cache_alloc(task_struct_cachep, GFP_KERNEL);\n\
  if (!tsk)\n    return NULL;\n```\n\n任务死亡后，如果它没有子进程在等待它，它的进程描述符会被释放并返回 `task_struct_cachep`\
  \ slab 缓存。这在 `free_task_struct()` 中完成（其中 `tsk` 是正在退的任务）：\n\n```c\nkmem_cache_free(task_struct_cachep,\
  \ tsk);\n```\n\n由于进程描述符是内核的核心且始终需要，`task_struct_cachep` 缓存从不会被销毁。然而，如果是这样，你通过以下方式销毁缓存：\n\
  \n```c\nint err;\nerr = kmem_cache_destroy(task_struct_cachep);\nif (err)\n    /*\
  \ error destroying cache */\n```\n\n简单吗？slab 层在低内存条件下处理所有的底层对齐、着色、分配、释放和回收。如果你频繁创建许多相同类型的对象，请考虑使用\
  \ slab 缓存。千万不要实现自己的空闲列表（free list）！\n\n### 在栈上进行静态分配\n\n在用户空间中，分配通常在堆上。但在内核中，栈很小且是固定的。因此，我们不能在栈上分配大型结构体。\n\
  \n\n\n\n\n在任何给定的函数中，你必须将栈空间用量降到最低。虽然没有硬性规定，但你应该将特定函数中所有局部变量（即自动变量）的总和保持在几百字节以内。在栈上进行大型静态分配（例如大型数组或结构体）是极其危险的。否则，内核中的栈分配将与用户空间相同。栈溢出是静无声息发生的，并无疑会导致问题。由于内核不会尽任何精力来管理栈，当栈溢出时，多余的数据会直接溢出到栈尾存在的任何数据上。第一个“吃掉”它是\
  \ `thread_info` 结构。（回想第 3 章，该结构分配在每个进程内核栈的末尾。）除了栈之外，可能潜伏着任何内核数据。最好的情况下，栈溢出时机器会崩溃；最坏的情况下，溢出会静默地损坏数据。\n\
  \n因此，对于任何大型内存分配，使用动态分配方案（例如本章之前讨论过的方案）是明智的。\n\n## 高内存映射 (High Memory Mappings)\n\
  \n根据定义，高内存中的页可能不会永久映射到内核的地址空间。因此，通过带有 `__GFP_HIGHMEM` 标志的 `alloc_pages()` 获取的可能可能逻辑地址。\n\
  \n在 x86 架构上，896MB 以外的所有物理内存都是高内存，并且不会永久或自动映射到内核的地址空间，尽管 x86 处理器能够物理寻址高达 4GB（使用 PAE^(6)）的物理内存。在分配后，这些页必须映射到内核的逻辑地址空间。在\
  \ x86 上，高内存页被映射在 3GB 到 4GB 标记之间的某个位置。\n\n^(6) `PAE` 代表物理地址扩展（Physical Address Extension）。它是\
  \ x86 处理器的一种特性，使其能够在只有 32 位虚拟地址空间的情况下，物理寻址 36 位（64GB）的内存。\n\n### 永久映射 (Permanent\
  \ Mappings)\n\n要将给定的 `page` 结构映射到内核地址空间，请使用声明在 `<linux/highmem.h>` 中的此函数：\n\n```\n\
  void *kmap(struct page *page)\n```\n\n该函数适用于高内存或低内存。如果 `page` 结构属于低内存中的页，则直接返回该页的虚拟地址。如果\
  \ `page` 位于高内存中，则创建一个永久映射并返回该地址。该函数可能会睡眠，因此 `kmap()` 只在进程上下文中工作。\n\n由于永久映射的数量有限的（如果不是，我们就不会陷入这种困境，可以直接永久映射所有内存），因此在不再需要时应该取消高内存映射。这是通过以下函数实现的，它可以取消映射给定的\
  \ `page`：\n\n```c\nvoid kunmap(struct page *page)\n```\n\n### 临时映射 (Temporary Mappings)\n\
  \n在必须创建映射但当前上下文无法睡眠的情况下，内核提供了临时映射（也称为原子映射）。这是一组预留的映射，可以容纳临时映射。内核可以原子地将高内存页映射到这些预留映射之一。因此，临时映射可以使用不能睡眠的地方（例如中断处理程序），因为获取映射永远不会阻塞。\n\
  \n设置临时映射通过以下方式完成：\n\n```c\nvoid *kmap_atomic(struct page *page, enum km_type type)\n\
  ```\n\n`type` 参数是以下枚举值之一，它们描述了临时映射的用途。它们定义在 `<asm-generic/kmap_types.h>` 中：\n\n\
  ![image](img/p0254-01.jpg)\n\n此函数不会阻塞，因此可以在中断上下文中和其他无法重新调度的地方使用。它还会禁用内核抢占，这是因为这些映射对于每个处理器都是唯一的。（而且重新调度可能会改变哪个任务在哪个处理器上运行。）\n\
  \n映射通过以下方式撤销：\n\n```c\nvoid kunmap_atomic(void *kvaddr, enum km_type type)\n```\n\
  \n此函数也不会阻塞。在许多架构中，它除了启用内核抢占外，实际上什么都不做，因为临时映射仅有效到下一次临时映射出现为止。因此，内核可以完全“忘记” `kmap_atomic()`\
  \ 映射，而 `kunmap_atomic()` 不需要执行任何特殊操作。下一个原子映射将直接覆盖上一个映射。\n\n## PerCPU 分配 (Per-CPU\
  \ Allocations)\n\n现代支持 SMP 的操作系统广泛地使用每个 CPU 数据——即特定处理器独有的数据。通常，每个 CPU 数据存储在数组中。数组中的每个项目对应系统上的一个可能处理器。当前处理器的编号索引该数组，这就是\
  \ 2.4 内核处理每个 CPU 数据的方式。这种方法没有问题，因此大量的 2.6 内核代码仍然在使用它。你这样声明数据：\n\n```c\nunsigned\
  \ long my_percpu[NR_CPUS];\n```\n\n然后你通过如下方式访问它：\n\n![image](img/p0255-01.jpg)\n\
  \n注意，不需要锁，因为这些数据对于当前处理器是唯一的。如果当前处理器外没有其他处理器碰这些数据，就不存在并发问题，当前处理器可以安全地访问数据而无需锁。\n\n\
  内核抢占是每个 CPU 数据唯一需要的问题。内核抢占带来两个问题，列如下：\n\n- 如果你的代码被抢占并在另一个处理器上重新调度，则 `cpu` 变量不再有效，因为它指向了错误的处理器。（通常，代码在获取当前处理器后不能睡眠。）\n\
  - 如果另一个任务抢占了你的代码，它可以在同一处理器上并发访问 `my_percpu`，这将导致竞态条件。\n\n然而，任何担心都是多余的，因为 `get_cpu()`\
  \ 调用在返回当前处理器的同时也禁用了抢占。相应的 `put_cpu()` 调用会启用抢占。注意，如果你使用 `smp_processor_id()` 来获取当前处理器，内核抢占不会被禁用；始终使用上述方法以保持安全。\n\
  \n## 新的 percpu  (The New percpu Interface)\n\n2.6 内核引入了一个名为 `percpu` 的新接口，用于创建和操作每个\
  \ CPU 数据。该接口泛化了之前的示例。这种方法简化了每个 CPU 数据的创建和操作。\n\n之前讨论的创建和访问每个 CPU 数据的方法仍然有效且可用。此新接口头文件\
  \ `<linux/percpu.h>` 声明了所有程序。你可以在 `mm/slab.c` 以及 `<asm/percpu.h>` 中找到实际定义。\n\n###\
  \ 编译时的 Per CPU 数据 (Per-CPU Data at Compile-Time)\n\n在编译时定义每个 CPU 变量非常简单：\n\n```c\n\
  DEFINE_PER_CPU(type, name);\n```\n\n这会为系统上的每个处理器创建一个类型为 `type`、名为 `name` 的变量实例。如果你在其他地方需要该变量的声明以避免编译警告，以下宏是你的帮手：\n\
  \n```c\nDECLARE_PER_CPU(type, name);\n```\n\n你可以使用 `get_cpu_var()` 和 `put_cpu_var()`\
  \ 程来操作变量。调用 `get_cpu_var()` 返回当前处理器上给定变量的左值。它还会禁用抢占，`put_cpu_var()` 则相应地启用抢占。\n\n\
  ```c\nget_cpu_var(name)++; /* 在此处理器上增加 name */\nput_cpu_var(name);   /* 完成；启用内核抢占\
  \ */\n```\n\n你也可以获取另一个处理器的每个 CPU 数据的值：\n\n```c\nper_cpu(name, cpu)++; /* 在给定的处理器上增加\
  \ name */\n```\n\n\n\n在使用这种方法时需要小心，因为 `per_cpu()` 既不禁用内核抢占，也不提供任何形式的锁机制。每 CPU 数据的无锁特性仅在当前处理器是该数据的唯一操作者时才存在。如果其他处理器碰了其他处理器的数据，你就需要锁。请小心。第\
  \ 9 章“内核同步导论”和第 10 章“内核同步方法”讨论了锁。\n\n另一个微妙的注意事项是：这些编译时的每-CPU 示例不适用于模块，因为链接器实际上将它们在一个唯一的特定执行段中创建（对于好奇的人来说，是\
  \ `.data.percpu`）。如果你需要从模块访问每-CPU 数据，或者需要动态创建此类数据，仍然是有希望的。\n\n### 运行时的 Per-CPU 数据\n\
  \n内核实现了一个类似于 `kmalloc()` 的动态分配器，用于创建每-CPU 数据。该例程为系统中的每个处理器创建一个请求内存的实例。原型定义在 `<linux/percpu.h>`\
  \ 中：\n\n```c\nvoid *alloc_percpu(type);  /* 一个宏 */\n\nvoid *__alloc_percpu(size_t\
  \ size, size_t align);\n\nvoid free_percpu(const void *);\n```\n\n`alloc_percpu()`\
  \ 宏为系统上的每个处理器分配一个给定类型对象的实例。它是 `__alloc_percpu()` 的封装，后者接收实际要分配的字节数作为参数，以及分配时需要对齐的字节数。`alloc_percpu()`\
  \ 宏将分配对齐在给定类型自然对齐的字节边界上。这种对齐方式是通常的行为。例如，\n\n```c\nstruct rabid_cheetah = alloc_percpu(struct\
  \ rabid_cheetah);\n```\n\n这与\n\n![image](img/p0257-02.jpg) 等同。\n\n`__alignof__`\
  \ 构建是 gcc 的一个特性，它返回给定类型或左值所需的（以字节为单位的对齐，在没有对齐要求的奇特架构上则返回推荐的对齐）。它的语法与 `sizeof` 相同。例如，以下代码在\
  \ x86 上返回四：\n\n```c\n__alignof__ (unsigned long)\n```\n\n当给定一个左值时，返回值是该左值可能具有的最大对齐。例如，结构内部的左值的对齐要求可能比在结构外创建相同类型的实例更高，因为存在结构对齐要求。关于对齐的问题在第\
  \ 19 章中进一步讨论。\n\n相应的 `free_percpu()` 调用会释放所有处理器上的给定数据。\n\n调用 `alloc_percpu()` 或\
  \ `__alloc_percpu()` 返回一个指针，该指针用于间接引用动态创建的每-CPU 数据。内核提供了两个宏来方便这一操作：\n\n![image](img/p0258-01.jpg)\n\
  \n`get_cpu_var()` 宏返回当前处理器数据特定实例的指针。它还会禁用内核抢占，随后通过调用 `put_cpu_var()` 重新启用。\n\n让我们来看一个使用这些函数的完整示例。当然，这个例子有点笨，因为你通常会分配一次内存（可能在某个初始化函数中），在多个地方使用它，并释放一次（可能在某个关闭函数中）。尽管如此，这个例子应该让用法变得非常清晰：\n\
  \n![image](img/p0258-02.jpg)\n\n### 使用 Per-CPU 数据的原因\n\n使用每-CPU 数据有几个好处。首先是减少了对锁的需求。取决于处理器访问每-CPU\
  \ 数据的语义，你可能完全不需要锁。请记住，“只有此处理器访问此数据”的规则只是一种编程约定。你需要确保本地处理器只访问其独特的数据。没有什么能阻止你“作弊”。\n\
  \n其次，每-CPU 数据极大地减少了缓存失效。这发生在处理器试图保持其缓存同步时。如果一个处理器操作了存储在另一个处理器缓存中的数据，该处理器必须刷新或更新其缓存。频繁的缓存失效被称为*缓存抖动\
  \ (thrashing the cache)*，会对系统性能造成破坏性影响。使用每-CPU 数据可以将缓存影响降到最低，因为理想情况下处理器只访问自己的数据。`percpu`\
  \ 接口对所有数据进行缓存对齐，以确保访问一个处理器的数据不会在同一缓存行上引入另一个处理器的数据。\n\n因此，使用每-CPU 数据通常消除了（或至少最小化）对锁的需求。使用每-CPU\
  \ 数据的唯一安全要求是禁用内核抢占，这比锁要便宜得多，而且接口会自动完成这一点。每-CPU 数据可以安全地从中断上下文或进程上下文使用。但请注意，你不能在访问每-CPU\
  \ 数据的过程中进入睡眠（否则你可能会落在另一个处理器上）。\n\n目前没有人被强制使用新的每-CPU 接口。手动操作（如最初讨论的使用数组）是可以的，只要你禁用了内核抢占。然而，新接口用用得多，并且在未来可能会获得额外的优化。如果你确实决定在内核代码中使用每-CPU\
  \ 数据，请考虑新接口。反对使用它的一个警告是它与早期的内核不后兼容。\n\n### 选择分配方法\n\n有了无数分配方法和手段，如何在内核中获取内存并不总是显而易见的——但这确实重要！如果你需要连续的物理页，请使用低级页分配器之一或\
  \ `kmalloc()`。这是从内核内部分配内存的标准方式，很可能也是你分配大部分内存的方式。回想给这些函数的最常见的两个标志是 `GFP_ATOMIC` 和\
  \ `GFP_KERNEL`。指定 `GFP_ATOMIC` 标志以执行不会睡眠的高优先级分配。这是中断处理程序和其他无法睡眠的代码的要求。可以睡眠的代码（例如未持有自旋锁的进程上下文）应该使用\
  \ `GFP_KERNEL`。该标志指定了在需要时可以睡眠以获取请求内存的分配。\n\n如果你想从高内存分配，请使用 `alloc_pages()`。`alloc_pages()`\
  \ 函数返回一个 `struct page` 而不是逻辑地址指针。因为高内存可能没有映射，访问它的唯一方法可能是通过相应的 `struct page` 结构。要获得实际指针，使用\
  \ `kmap()` 将高内存映射到内核的逻辑地址空间。\n\n如果你不需要物理连续的页——只需要虚拟连续的页——请使用 `vmalloc()`，尽管要注意 `vmalloc()`\
  \ 相比 `kmalloc()` 有微小的性能损失。`vmalloc()` 函数分配虚拟连续但本质上并非物理连续的内核内存。它像用户空间分配那样，通过将物理内存块映射到连续的逻辑地址空间来实现。\n\
  \n如果你正在创建和销毁大量数据结构，请考虑设置一个 缓存 (slab cache)。slab 层维护了一个每个处理器的对象缓存（空闲列表），这可能会极大增强对象的分配和释放性能。与其频繁地分配和释放内存，slab\
  \ 层为你存储了已分配对象的缓存。当你需要一个新的内存块来存放数据结构时，slab 层通常不需要分配更多内存，而是只需从缓存中返回一个对象。\n\n### 结论\n\
  \n\n\n\n在本章中，我们学习了 Linux 内核如何管理内存。我们查看了内存的各种单元和分类，包括字节（bytes）、页（pages）和区域（zones）。(第\
  \ 15 章介绍了第四种分类，即进程地址空间。）随后我们讨论了获取内存的各种机制，包括页分配器（page allocator）和内存分配器（slab allocator）。在内核内部获取内存并不总是那么容易，因为你必须小心确保分配过程遵守某些内核条件，例如无法阻塞或访问文件系统。为此，我们讨论了\
  \ `gfp` 标志以及每个标志的各种用例和要求。在内核中获取内存的相对难度是内核开发与用户空间开发之间最大的差异之一。虽然本章大部分内容讨论了用于获取内存的接口族，但你现在也应该理解*为什么*内核中的内存分配是困难的。\n\
  \n掌握这一章后，下一章将讨论虚拟文件系统（VFS），内核中负责管理文件系统并为用户空间应用程序提供统一、一致文件 API 的内核子系统。继续吧！\n\n# 13.\
  \ 虚拟文件系统\n\n`Virtual Filesystem`（有时称为 `Virtual File Switch` 或更通用的 `VFS`）是内核中实现为用户空间程序的文件和文件系统相关接口的子系统。所有文件系统都依赖\
  \ VFS，使它们不仅能够共存，还能相互操作。这使得程序可以使用标准的 Unix 系统调用来读写不同的文件系统，即使是在不同的介质上，如图 13.1` 工具将数据从挂载为\
  \ `ext3` 的硬盘移动到挂载为 `ext2` 的移动磁盘。两个不同的文件系统，两种不同的介质，一个 VFS。\n\n![image](img/13fig01.jpg)\n\
  \n## 通用文件系统接口\n\nVFS 是使 `open()`、`read()` 和 `write()` 等系统调用忽略文件系统或底层物理介质运行的胶水。在今天，这听起来可能并不新奇——我们一直认为这种功能是所当然的——但对于此类通用系统调用来说，能够在许多不同的文件系统和变化的介质上工作是一项非凡的成就。更有甚者，系统调用在这些不同的文件系统和介质*之间*工作——我们可以使用标准系统调用将文件从一个文件系统复制或移动到另一个文件系统。在旧的操作系统（如\
  \ DOS）中，这将是无法实现的；对非原生文件系统的任何访问都需要特殊工具。正因为像 Linux 这样的现代操作系统通过虚拟接口抽象了对文件系统的访问，这种互操作性和通用化访问才成为可能。\n\
  \n新的文件系统和新的存储介质种类可以进入 Linux，而程序不需要重写甚至重新编译。在本章中，我们将讨论 VFS，它提供的抽象使得无数文件系统能够表现得像一个整体一样。在下一章中，我们将讨论块\
  \ I/O 层，它允许各种存储设备——从 CD 到蓝光光盘，再到硬盘和 CompactFlash 运行。VFS 和块 I/O 层共同提供了抽象、接口和胶水，允许用户空间程序发出通用系统调用，通过任何文件系统上的统一命名策略来访问文件，而该文件系统本身存在于任何存储介质上。\n\
  \n## 文件系统抽象层\n\n这种针对任何类型文件系统的通用接口之所以可行，是因为内核在其低级文件系统接口周围实现了一个抽象层。该抽象层使 Linux 支持不同的文件系统，即使它们在支持的功能或行为上有所不同。这是可能的，因为\
  \ VFS 提供了一个公共的文件模型，可以表示任何文件系统的通用功能集和行为。当然，它偏向于 Unix 风格的文件系统。（你将在本章稍后的部分看到什么构成 Unix\
  \ 风格的文件系统。）无论如何，Linux 仍然支持差异巨大的文件系统类型，从 DOS 的 FAT 到 Windows 的 NTFS，再到许多 Unix 风格和\
  \ Linux 特有的文件系统。\n\n抽象层通过定义所有文件系统支持的基础概念接口和数据结构来工作。文件系统调整它们对概念的理解（例如“*我打开文件的方式*”和“*对我来说目录是什么*”）以匹配\
  \ VFS 的预期。实际的文件系统代码隐藏了实现细节。然而对于 VFS 层和内核的其他部分来说，每个文件系统看起来都是相同的。它们都支持文件和目录等概念，并且都支持创建和删除文件等操作。\n\
  \n结果是一个通用的抽象层，使内核能够轻松简洁地支持多种类型的文件系统。文件系统的程序旨在提供 VFS 预期的抽象接口和数据结构；反之，内核可以轻松与任何文件系统工作，而导出的用户空间接口在任何文件系统上无缝工作。\n\
  \n事实上，内核中没有任何内容需要理解文件系统的底层细节，文件系统本身除。。例如考虑一个简单的用户空间程序\n\n```bash\nret = write (fd,\
  \ buf, len);\n```\n\n此系统调用将 `buf` 指向的 `len` 字节写入文件描述符 `fd` 所代表的文件当前位置。该系统调用首先由通用的\
  \ `sys_write()` 系统调用处理，该调用决定 `fd` 所在文件系统的实际文件写入方法。然后，通用写系统调用调用该方法（它是文件系统实现的一部分），将数据写入介质（或该文件系统在写入时执行的操作）。图\
  \ 13.2 显示了从用户空间的 `write()` 调用通过 VFS 的通用系统调用，最终到达物理介质的数据流。系统调用的一侧是通用的 VFS 接口，为用户空间提供前端；系统调用的另一侧是特定文件系统的后端，处理实现细节。本章的其余部分介绍\
  \ VFS 如何实现这种抽象并提供其接口。\n\n图 13.2 数据流：从用户空间发出 `write()` 调用，通过 VFS 的通用系统调用，进入文件系统的特定写方法，最后到达物理介质。\n\
  \n![image](img/13fig02.jpg)\n\n## Unix 文件系统\n\n从历史上看，Unix 提供了四种基本的文件系统相关抽象：文件、目录项（entries）、inodes\
  \ 和挂载点（mount points）。\n\n*文件系统*是遵循特定结构的数据分级存储。文件系统包含文件、目录和相关的控制信息。在文件系统上执行的典型操作是创建、删除和挂载。在\
  \ Unix 中，文件系统挂载在*命名空间*（namespace）的全局层次结构中的特定挂载点上。(1) 这使得所有挂载的文件系统显示为单一树中的项。将这种单一、统一的树与\
  \ DOS 和 Windows 的行为对比，后者将文件命名空间划分为驱动器号，如 `C:`。这在设备和分区边界之间划分了命名空间，将硬件细节“泄漏”到了文件系统抽象中。由于这种划分可能是任意的甚至会让用户感到困惑，因此它不如\
  \ Linux 的统一命名空间。\n\n^(1) *最近，Linux 将这种层次结构改为每个进程，为每个进程提供唯一的命名空间。由于每个进程都继承其父进程的命名空间（除非另有指定），看起来只有一个全局命名空间。*\n\
  \n\n\n\n`file` 是一个字节的有序字符串。第一个字节标记文件的开始，最后一个字节标记文件的结束。每个文件都被分配了一个人类可读的名字，以便系统和用户进行识别。典型的文件操作包括读、写、创建和删除。Unix\
  \ 的文件概念与面向记录的文件系统（例如 OpenVMS 的 `Files-11`）形成鲜明对比。面向记录的文件系统比 Unix 简单的字节流抽象提供了更丰富、更具结构的文件表示，但这是以牺牲简单灵活性为代价的。\n\
  \n文件被组织在目录中。`directory` 类似于文件夹，通常包含相关文件。目录还可以包含其他目录，称为子目录。通过这种方式，目录可以嵌套形成路径。路径的每个组件称为一个\
  \ `directory entry`（目录项）。路径示例为 `/home/wolfman/butter`——根目录 `/`、目录 `home` 和 `wolfman`\
  \ 以及文件 `butter` 都是目录项，被称为 `dentries`。在 Unix 中，目录实际上是普通文件，简单地列出了其中包含的文件。由于目录对 `VFS`\
  \ 来说是一个文件，因此对文件执行的相同操作也可以在目录上执行。\n\nUnix 系统将文件概念与其任何相关信息分离来，例如访问权限、大小、所有者、创建时间等。这些信息有时被称为\
  \ `file metadata`（即关于文件数据的数据），并存储在与文件分离的数据结构中，被称为 `inode`。这个名字是 `index node` 的缩写，尽管如今\
  \ `inode` 一术已更加通用。\n\n所有这些信息与文件系统自身的控制信息结合在一起，这些信息存储在 `superblock` 中。`superblock`\
  \ 是一个包含整个文件系统信息的数据结构。有时这些数据被称为 `filesystem metadata`。文件系统元数据包括关于单个文件和整个文件系统的信息。\n\
  \n传统上，Unix 文件系统将这些概念作为其物理磁盘布局的一部分来实现。例如，文件信息存储在磁盘上独立数据块中的 `inode` 中；目录是文件；控制信息集中存储在\
  \ `superblock` 中，以此此类推。Unix 文件概念被 `physically mapped`（物理映射）到存储介质上。Linux `VFS` 设计用于与理解并实现这些概念的文件系统工作。非\
  \ Unix 文件系统（如 `FAT` 或 `NTFS`）在 Linux 中仍然运行，但它们的文件系统代码必须提供这些概念的表象。例如，即使一个文件系统不支持独立的\
  \ `inodes`，它也必须在内存中组装 `inode` 数据结构，就像它支持一样。或者，如果文件系统将目录视为特殊对象，对 `VFS` 来说它们必须作为仅仅的文件表示。通常，这涉及非\
  \ Unix 文件系统实时完成的一些特殊处理，以适应 Unix 范式和 `VFS` 的要求。然而，这些文件系统仍然工作，且开销是合理的。\n\n### VFS\
  \ 对象及其数据结构\n\n`VFS` 是面向对象的。一组数据结构表示了通用文件模型。这些数据结构类似于对象。由于内核是严格使用 `C` 语言编写的，没有直接支持面向对象范式的语言带来的优势，因此数据结构被表示为\
  \ `C structures`。这些结构包含了数据以及指向由文件系统实现的、操作这些数据的函数指针。\n\n人们经常忽略这一点，甚至否认它，但内核中有很多面向对象编程的例子。尽管内核开发者可能避开\
  \ `C++` 和其他显式面向对象的语言，但从对象的角度思考通常是有用的。`VFS` 由四种主要的对象类型组成：\n\n- `superblock`：包含关于整个文件系统的信息。\n\
  - `inode`：代表单个文件（及其元数据）。\n- `dentry`：代表路径中的目录项。\n- `file`：代表与进程关联的打开文件。\n\n传统上，Unix\
  \ 文件系统将这些概念作为其物理磁盘布局的一部分来实现。例如，文件信息存储在磁盘上独立数据块中的 `inode` 中；目录是文件；控制信息集中存储在 `superblock`\
  \ 中，以此此类推。Unix 文件概念被 `physically mapped`（物理映射）到存储介质上。Linux `VFS` 设计用于与理解并实现这些概念的文件系统工作。非\
  \ Unix 文件系统（如 `FAT` 或 `NTFS`）在 Linux 中仍然运行，但它们的文件系统代码必须提供这些概念的表象。例如，即使一个文件系统不支持独立的\
  \ `inodes`，它也必须在内存中组装 `inode` 数据结构，就像它支持一样。或者，如果文件系统将目录视为特殊对象，对 `VFS` 来说它们必须作为仅仅的文件表示。通常，这涉及非\
  \ Unix 文件系统实时完成的一些特殊处理，以适应 Unix 范式和 `VFS` 的要求。然而，这些文件系统仍然工作，且开销是合理的。\n\n`VFS` 喜爱结构，它包含比主要对象多出的几个结构：\n\
  \n- `file_system_type`：描述文件系统及其能力。\n- `vfsmount`：代表挂载点并包含位置和挂载标志等信息。\n- `fs_struct`：描述与进程关联的文件系统。\n\
  - `file`：描述与进程关联的打开文件。\n\n本章其余部分将讨论这些对象以及它们在实现 VFS 层中所扮演的角色。\n\n### superblock 对象\n\
  \nsuperblock 对象由每个文件系统实现，用于存储描述特定文件系统的信息。该对象通常对应于 *filesystem superblock* 或 *filesystem\
  \ control block*，它存储在磁盘的特殊扇区上（因此有了该对象的名称）。不是基于磁盘的文件系统（例如基于虚拟内存的文件系统，如 `sysfs`）动态生成\
  \ superblock 并存储在内存中。\n\nsuperblock 对象由 `struct super_block` 表示并定义在 `<linux/fs.h>`\
  \ 中。以下是它的样子，带有描述每个条目的注释：\n\n创建、管理和销毁 superblock 对象的代码位于 `fs/super.c` 中。superblock\
  \ 对象通过 `alloc_super()` 函数进行创建和初始化。挂载时，文件系统会调用此函数，从磁盘读取其 superblock 并填充其 superblock\
  \ 对象。\n\n\n\n\n\n超级块（superblock）对象中最重要的项是 `s_op`，它是指向超级块操作表的指针。超级块操作表由 `struct super_operations`\
  \ 表示，定义在 `<linux/fs.h>` 中。它的结构如下：\n\n![image](img/p0267-02.jpg)\n\n该结构中的每一项都是指向对超级块对象操作函数的指针。超级块操作对文件系统及其索引节点（inodes）执行低级操作。\n\
  \n当文件系统需要对其超级块执行操作时，它会遵循从超级块对象的指针指向所需的方法。例如，如果文件系统想要向其超级块写入，它将调用：\n\n```\nsb->s_op->write_super(sb);\n\
  ```\n\n在此调用中，`sb` 是指向文件系统超级块的指针。通过该指针进入 `s_op` 得到超级块操作表，最终得到所需的 `write_super()`\
  \ 函数，然后进行调用。注意，`write_super()` 调用必须传递一个超级块，尽管该方法与超级块相关联。这是因为 C 语言缺乏面向对象的支持。在 C++\
  \ 中，像如下的调用即可：\n\n```\nsb.write_super();\n```\n\n在 C 语言中，方法无法轻松获取其父对象，因此你必须手动传递它。\n\
  \n让我们来看 `super_operations` 指定的一些超级块操作：\n\n- `struct inode * alloc_inode(struct super_block\
  \ *sb)` 在给定的超级块下创建并初始化一个新的索引节点对象。\n- `void destroy_inode(struct inode *inode)` 释放给定的索引节点。\n\
  - `void dirty_inode(struct inode *inode)` 当索引节点变脏（被修改）时由 VFS 调用。ext3 和 ext4 等日志文件系统使用此函数来执行日志更新。\n\
  - `void write_inode(struct inode *inode, int wait)` 将给定的索引节点写入磁盘。`wait` 参数指定该操作应是同步的。\n\
  - `void drop_inode(struct inode *inode)` 当索引节点的最后一个引用被释放时由 VFS 调用。标准的 Unix 文件系统没有定义此函数，在这种情况下\
  \ VFS 只地删除索引节点。\n- `void delete_inode(struct inode *inode)` 从磁盘上删除给定的索引节点。\n- `void\
  \ put_super(struct super_block *sb)` VFS 在卸载时调用以释放给定的超级块对象。调用者必须持有 `s_lock` 锁。\n\
  - `void write_super(struct super_block *sb)` 使用指定的超级块更新磁盘上的超级块。VFS 使用此函数将修改后的内存中超级块与磁盘同步。调用者必须持有\
  \ `s_lock` 锁。\n- `int sync_fs(struct super_block *sb, int wait)` 将文件系统元数据与磁盘上的文件系统同步。`wait`\
  \ 参数指定该操作应是同步的。\n- `void write_super_lockfs(struct super_block *sb)` 防止文件系统发生更改，然后用指定的超级块更新磁盘上的超级块。它目前被\
  \ LVM（逻辑卷管理器）使用。\n- `void unlockfs(struct super_block *sb)` 像 `write_super_lockfs()`\
  \ 一样解锁文件系统允许更改。\n- `int statfs(struct super_block *sb, struct statfs *statfs)` 由\
  \ VFS 调用获取文件系统统计信息。与给定文件系统相关的统计数据放在 `statfs` 中。\n- `int remount_fs(struct super_block\
  \ *sb, int *flags, char *data)` 当文件系统用新的挂载选项重新挂载时由 VFS 调用。调用者必须持有 `s_lock` 锁。\n\
  - `void clear_inode(struct inode *inode)` 由 VFS 调用释放索引节点并清除包含相关数据的任何页。\n- `void\
  \ umount_begin(struct super_block *sb)` 由 VFS 调用中断挂载操作。它用于 NFS 等网络文件系统。\n\n所有这些函数都由\
  \ VFS 在进程上下文中调用。`dirty_inode()` 之外，所有函数在需要时都可以阻塞。\n\n这些函数中的某些是可选的；特定文件系统可以在超级块操作结构中将其值设置为\
  \ `NULL`。如果关联的指针为 `NULL`，VFS 将根据操作调用通用函数或什么都不做。\n\n### 索引节点对象\n\n索引节点对象代表内核操作文件或目录所需的所有信息。对于\
  \ Unix 风格的文件系统，这些信息直接从磁盘上的索引节点读取。然而，如果文件系统没有索引节点，文件系统必须从磁盘上存储它的任何地方获取信息。没有索引节点的文件系统通常将文件特定信息作为文件的一部分存储；与\
  \ Unix 风格的文件系统不同，它们不将文件数据与其控制信息分离。某些现代文件系统这两者都不采用，并将文件元数据存储作为磁盘数据库的一部分。无论情况如何，索引节点对象都会以适用于文件系统的方式在内存中构建。\n\
  \n索引节点对象由 `struct inode` 表示，定义在 `<linux/fs.h>` 中。以下是该结构，带有描述每个条目的注释：\n\n![image](img/p0270-01.jpg)\n\
  \n![image](img/p0270-02.jpg)\n\n索引节点代表文件系统的每个文件，但索引节点对象只在访问文件时才在内存中构建。这包括特殊文件，例如设备文件或管道。因此，`struct\
  \ inode` 中的某些条目与这些特殊文件有关。例如 `i_pipe` 条目指向命名管道数据结构，`i_bdev` 指向块设备结构，`i_cdev` 指向字符设备结构。这三个指针存储在一个联合体（union）中，因为给定的索引节点一次只能表示这些中的一个（或都不表示）。\n\
  \n可能会出现给定文件系统不支持索引节点对象中表示的属性的情况。例如，某些文件系统可能记录访问时间戳。在这种情况下，文件系统可以根据自己的需要实现该功能；它可以为\
  \ `i_atime` 存储零、让 `i_atime` 等于 `i_mtime`、在内存中更新 `i_atime` 但从不刷回磁盘，或者文件系统实现者决定的任何其他。\n\
  \n### 索引节点操作\n\n与超级块操作一样，`inode_operations` 成员很重要。它描述了文件系统实现的 VFS 可以在索引节点上调用的函数。与超级块一样，索引操作通过以下方式调用：\n\
  \n```\ni->i_op->truncate(i)\n```\n\n在此调用中，`i` 是指向特定索引节点的引用。在这种情况下，`i` 所在文件系统定义的\
  \ `truncate()` 操作将在给定的索引节点上执行。`inode_operations` 结构定义在 `<linux/fs.h>` 中：\n\n![image](img/p0271-01.jpg)\n\
  \n以下接口构成了 VFS 可能在给定索引节点上执行（或要求文件系统在上面执行）的各种函数：\n\n- `int create(struct inode *dir,\
  \ struct dentry *dentry, int mode)` VFS 从 `creat()` 和 `open()` 系统调用调用此函数，创建一个与给定\
  \ dentry 关联且具有指定初始模式的新索引节点。\n- `struct dentry * lookup(struct inode *dir, struct\
  \ dentry *dentry)` 该函数在目录中查找对应 dentry 指定文件名的索引节点。\n- `int link(struct dentry *old_dentry,\
  \ struct inode *dir, struct dentry *dentry)` 由 `link()` 系统调用调用，在目录 `dir` 中为文件 `old_dentry`\
  \ 创建新文件名 `dentry` 的硬链接。\n- `int unlink(struct inode *dir, struct dentry *dentry)`\
  \ 从 `unlink()` 系统调用调用，从目录 `dir` 中删除由目录项 `dentry` 指定索引节点。\n- `int symlink(struct\
  \ inode *dir, struct dentry *dentry, const char *symname)` 从 `symlink()` 系统调用调用，在目录\
  \ `dir` 中为 `dentry` 代表的文件创建一个名为 `symname` 的符号链接。\n- `int mkdir(struct inode *dir,\
  \ struct dentry *dentry, int mode)`\n\n\n\n\n\n由 `mkdir()` 系统调用调用，使用给定的初始模式创建一个新目录。\n\
  \n```c\nint rmdir(struct inode *dir,\n          struct dentry *dentry)\n```\n\n\
  由 `rmdir()` 系统调用调用，从目录 `dir` 中移除由 `dentry` 引用的目录。\n\n```c\nint mknod(struct inode\
  \ *dir,\n          struct dentry *dentry,\n          int mode, dev_t rdev)\n```\n\
  \n由 `mknod()` 系统调用调用，创建一个特殊文件（设备文件、命名管道或套接字）。该文件通过设备 `rdev` 和目录 `dir` 中的目录项 `dentry`\
  \ 。初始权限通过 `mode` 指定。\n\n```c\nint rename(struct inode *old_dir,\n           struct\
  \ dentry *old_dentry,\n           struct inode *new_dir,\n           struct dentry\
  \ *new_dentry)\n```\n\n由 VFS 调用，将 `old_dentry` 指定的文件从 `old_dir` 目录移动到目录 `new_dir`，文件名由\
  \ `new_dentry` 指定。\n\n```c\nint readlink(struct dentry *dentry,\n             char\
  \ *buffer, int buflen)\n```\n\n由 `readlink()` 系统调用调用，将与 `dentry` 指定符号链接相关的完整路径中最多\
  \ `buflen` 字节复制到指定的缓冲区。\n\n```c\nint follow_link(struct dentry *dentry,\n      \
  \       struct nameidata *nd)\n```\n\n由 VFS 调用，将符号链接转换为其指向的 inode。`dentry` 指向的链接被转换，结果存储在\
  \ `nd` 指向的 `nameidata` 结构中。\n\n```c\nint put_link(struct dentry *dentry,\n     \
  \        struct nameidata *nd)\n```\n\n由 VFS 调用，在调用 `follow_link()` 之后进行清理。\n\n\
  ```c\nvoid truncate(struct inode *inode)\n```\n\n由 VFS 调用，修改给定文件的大小。在调用之前，inode\
  \ 的 `i_size` 字段必须设置为所需的新尺寸。\n\n```c\nint permission(struct inode *inode, int mask)\n\
  ```\n\n检查 `inode` 引用的文件是否允许指定的访问模式。如果允许访问，此函数返回零，否则返回负数错误代码。大多数文件系统将此字段设置为 `NULL`\
  \ 并使用通用 VFS 方法，该方法仅比较 inode 对象中的模式位与给定的掩码。更复杂的文件系统（例如支持访问控制列表 ACL）具有特定的 `permission()`\
  \ 方法。\n\n```c\nint setattr(struct dentry *dentry,\n          struct iattr *attr)\n\
  ```\n\n由 `notify_change()` 调用，在 inode 被修改后通知“更改事件”。\n\n```c\nint getattr(struct\
  \ vfsmount *mnt,\n           struct dentry *dentry,\n           struct kstat *stat)\n\
  ```\n\n当 VFS 发现 inode 需要从磁盘刷新时被调用。扩展属性允许将键/值对与文件关联。\n\n```c\nint setxattr(struct\
  \ dentry *dentry,\n             const char *name,\n             const void *value,\n\
  \             size_t size,\n             int flags)\n```\n\n```c\nint getxattr(struct\
  \ dentry *dentry,\n             const char *name,\n             void *value,\n \
  \            size_t *size)\n```\n\n```c\nint listxattr(struct dentry *dentry,\n\
  \             const char *name,\n             char *list,\n             size_t *size,\n\
  \             int flags)\n```\n\n```c\nint removexattr(struct dentry *dentry,\n\
  \             const char *name)\n```\n\n由 VFS 用于为文件 `dentry` 设置扩展属性 `value`。\n\n\
  ```c\nint getxattr(struct dentry *dentry,\n             const char *name,\n    \
  \         void *value,\n             size_t size)\n```\n\n由 VFS 用于将扩展属性 `value`\
  \ 复制到。\n\n```c\nint listxattr(struct dentry *dentry,\n             const char *name,\n\
  \             char *list,\n             size_t *size,\n             int flags)\n\
  ```\n\n复制 `dentry` 的属性列表。\n\n```c\nint removexattr(struct dentry *dentry,\n    \
  \         const char *name)\n```\n\n从 `dentry` 中移除属性。\n\n#### Dentry 状态\n\n一个有效的\
  \ dentry 对象处于三种状态之一：已使用的（used）、未使用的（unused）或负的（negative）。\n\n已使用的 dentry 对应一个有效的\
  \ inode（`d_inode` 指向关联的 inode），并表示该对象有一个或多个用户（`d_count` 为正数）。已使用的 dentry 正被 VFS\
  \ 使用并指向有效数据，因此不能被丢弃。\n\n未使用的 dentry 对应一个有效的 inode（`d_inode` 指向 inode），但 VFS 当前没有使用该\
  \ dentry（`d_count` 为零）。因为 dentry 对象仍然指向一个有效对象，所以 dentry 会被保留（缓存）以备后之用。由于 dentry\
  \ 没有被过早销毁，如果需要，无需重新创建 dentry，且路径查找可以比没有 dentry 时更快。然而，如果需要回收内存，dentry 可以被丢弃，因为它没有处于活动状态。\n\
  \n负的 dentry 不与有效的 inode 关联（`d_inode` 为 `NULL`），因为 inode 已被删除或者路径名从初就是不正确的。然而，保留了\
  \ dentry，以便此后的查找可以快速解决。例如，考虑一个不断尝试打开并读取不存在的配置文件的守护进程。`open()` 系统调用不断返回 `ENOENT`，但直到内核构建路径、遍历磁盘上的目录结构并验证文件不存在后才会返回。由于即使是失败的查找也是昂贵的，因此缓存“负”结果是值得的。虽然负的\
  \ dentry 很有用，但如果内存紧张，它可以被销毁，因为实际上没有东西在使用它。\n\n#### Dentry 缓存 (Dentry Cache)\n\n\
  在 VFS 层费力将路径名中的每个元素转换为 dentry 对象并到达路径末尾后，丢弃所有工作将是非常浪费的。相反，内核将 dentry 对象缓存在 dentry\
  \ 缓存中，简单称为 *dcache*。\n\ndentry 缓存由三部分组成：\n\n• “已使用”dentry 列表，通过 inode 对象的 `i_dentry`\
  \ 字段与其关联的 inode 链接。由于给定的 inode 可以有多个链接，因此可能存在多个 dentry 对象；因此使用了列表。\n\n\n\n\n\n-\
  \ 一个双向链表的“最近最少使用”列表，用于存储未使用的和负数的 dentry（目录项）对象。该列表在头部插入，因此靠近头部的条目比靠近尾部的条目新。当内核必须移除项以回收内存时，会从尾部移除；这些条目是最旧的，预计在不久后被使用的概率最低。\n\
  - 一个哈希表和哈希函数，用于将给定路径快速解析为关联的 dentry 对象。\n\n哈希表由 `dentry_hashtable` 数组表示。每个元素都是一个指向相同哈希值的\
  \ dentry 列表的指针。该数组的大小取决于系统中物理内存的数量。\n\n实际的哈希值由 `d_hash()` 决定。这允许文件系统提供唯一的哈希函数。\n\
  \n哈希表查找通过 `d_lookup()` 执行。如果如果在 `dcache` 中找到匹配的 dentry 对象，则返回它。如果失败，则返回 `NULL`。\n\
  \n举例来说，假设你正在编辑主目录下的一个源文件 `/home/dracula/src/the_sun_sucks.c`。每当访问此文件时（例如当你第一次打开它、之后保存它、编译它等），VFS\
  \ 必须遵循每个目录项以解析完整路径：`/`、`home`、`dracula`、`src` 以及最后的 `the_sun_sucks.c`。为了避免每次访问此路径名称都进行这种耗时操作，VFS\
  \ 可以先尝试在 `dcache` 中查找路径名称。如果查找成功，无需费力即可获取所需的最终 dentry 对象。相反，如果 dentry 不在 `dcache`\
  \ 中，VFS 必须通过遍历文件系统的每个路径组件来手动解析路径。完成此任务后，内核会将 dentry 对象添加到 `dcache` 中，以加速未来的查找。\n\
  \n`dcache` 还提供了 inode 缓存（icache）的前端接口。与 dentry 对象关联的 inode 对象不会被释放，因为 dentry 对 inode\
  \ 维护了一个正引用计数。这使得 dentry 对象能够将 inode 钉钉在内存中。只要 dentry 被缓存，相应的 inode 也会被缓存。因此，当从缓存中成功查找路径名称时（如上例所示），关联的\
  \ inode 已经缓存在内存中了。\n\n缓存 dentry 和 inode 是有益的，因为文件访问表现出空间局部时间和局部性。文件访问具有时间局部性，是因为程序倾向于反复访问和重新访问相同的文件。因此，当访问一个文件时，缓存关联的\
  \ dentry 和 inode 极有可能在不久后产生缓存命中。文件访问具有空间局部性，是因为程序倾向于访问同一目录下的多个文件。因此，缓存一个文件的目录项极高概率产生缓存命中，因为接下来可能会操作另一个相关文件。\n\
  \n### Dentry Operations\n\n`dentry_operations` 结构指定了 VFS 在给定文件系统的目录项上调用的方法。\n\n\
  `dentry_operations` 结构定义在 `<linux/dcache.h>` 中：\n\n![image](img/p0278-01.jpg)\n\n\
  这些方法如下：\n\n- `int d_revalidate(struct dentry *dentry, struct nameidata *)`\n  判断给定的\
  \ dentry 对象是否有效。每当 VFS 使用来自 `dcache` 的 dentry 时，都会调用此函数。大多数文件系统将此方法置为 `NULL`，因为它们在\
  \ `dcache` 中的 dentry 对象始终有效。\n- `int d_hash(struct dentry *dentry, struct qstr *name)`\n\
  \  从给定的 dentry 创建哈希值。每当向哈希表添加 dentry 时，VFS 都会调用此函数。\n- `int d_compare(struct dentry\
  \ *dentry, struct qstr *name1, struct qstr *name2)`\n  由 VFS 调用以比较两个 dentry。VFS\
  \ 用于比较两个文件名 `name1` 和 `name2`。大多数文件系统（如 FAT）是大小敏感的。VFS 每当添加 dentry 时都会调用此函数。此函数需要\
  \ `dcache_lock`。\n- `int d_delete(struct dentry *dentry)`\n  当 dentry 计数达到零时，由 VFS\
  \ 调用。\n- `void d_release(struct dentry *dentry)`\n  当指定的 dentry 被释放时，由 VFS 调用。\n\
  - `void d_ip(struct dentry *dentry, struct inode *inode)`\n  当 dentry 被删除时，由 VFS\
  \ 调用。\n\n### The File Object\n\n文件对象由 `struct file` 表示，定义在 `<linux/fs.h>` 中。让我们再次查看该结构，并为每个部分添加注释：\n\
  \n![image](img/p0279-02.jpg)\n\n与 dentry 对象类似，文件对象实际上并不对应于任何磁盘数据。因此，对象中没有标志位表示对象是否为脏并需要写回磁盘。文件对象通过\
  \ `f_dentry` 指向其 dentry。dentry 反过来指向 inode，inode 反映了文件是否为脏。\n\n### File Operations\n\
  \n与其他所有 VFS 对象一样，文件操作表也非常重要。与 `struct file` 关联的操作是那些构成标准系统调用基础的常见系统调用。\n\n文件对象方法在\
  \ `file_operations` 中指定并定义在 `<linux/fs.h>` 中：\n\n![image](img/p0280-01.jpg)\n![image](img/p0280-02.jpg)\n\
  \n文件系统可以为这些操作各实现唯一的函数，或者在存在通用方法时使用它们。通用方法通常在普通的基于 Unix 文件系统上运行良好。文件系统没有义务实现所有这些方法——尽管不实现基础方法是愚蠢的——如果不感兴趣，可以简单地将方法设为\
  \ `NULL`。\n\n以下是各个的操作：\n\n- `loff_t llseek(struct file *file, loff_t offset, int\
  \ origin)`\n  更新文件指针到给定的偏移量。通过 `llseek()` 系统调用调用。\n- `ssize_t read(struct file *file,\
  \ char *buf, size_t count, loff_t *offset)`\n\n\n\n\n从给定文件的位置 `offset` 处读取 `count`\
  \ 字节到 `buf` 中。文件指针随后将随之更新。此函数由 `read()` 系统调用调用。\n\n```\nssize_t aio_read(struct\
  \ kiocb *iocb,\n                 char *buf, size_t count,\n                 loff_t\
  \ offset)\n```\n\n开始向 `iocb` 描述的文件的 `buf` 缓冲区中异步读取 `count` 字节。此函数由 `aio_read()`\
  \ 系统调用调用。\n\n```\nssize_t write(struct file *file,\n              const char *buf,\
  \ size_t count,\n              loff_t *offset)\n```\n\n将 `buf` 中的 `count` 字节写入给定文件的位置\
  \ `offset` 处。文件指针随后将随之更新。此函数由 `write()` 系统调用调用。\n\n```\nssize_t aio_write(struct\
  \ kiocb *iocb,\n                  const char *buf,\n                  size_t count,\
  \ loff_t offset)\n```\n\n开始向 `iocb` 描述的文件的 `buf` 缓冲区中异步写入 `count` 字节。此函数由 `aio_write()`\
  \ 系统调用调用。\n\n```\nint readdir(struct file *file, void *dirent,\n           filldir_t\
  \ filldir)\n```\n\n返回目录列表中的下一个目录。此函数由 `readdir()` 系统调用调用。\n\n```\nunsigned int poll(struct\
  \ file *file,\n                  struct poll_table_struct *poll_table)\n```\n\n\
  休眠并等待给定文件的活动。它由 `poll()` 系统调用调用。\n\n```\nint ioctl(struct inode *inode,\n      \
  \    struct file *file,\n          unsigned int cmd,\n          unsigned long arg)\n\
  ```\n\n向设备发送命令和参数对。当文件是已打开的设备节点时使用它。此函数从 `ioctl()` 系统调用调用。调用者必须持有 BKL（大内核锁）。\n\n\
  ```\nint unlocked_ioctl(struct file *file,\n                   unsigned int cmd,\n\
  \                   unsigned long arg)\n```\n\n实现与 `ioctl()` 相同的功能，但不需要持有 BKL。当用户空间调用\
  \ `ioctl()` 系统调用时，如果 `unlocked_ioctl()` 存在，VFS 将调用它来代替 `ioctl()`。因此，文件系统只需要实现其中一个，优选\
  \ `unlocked_ioctl()`。\n\n```\nint compat_ioctl(struct file *file,\n            \
  \     unsigned int cmd,\n                 unsigned long arg)\n```\n\n为 32 位应用程序在\
  \ 64 位系统上实现 `ioctl()` 的可移植变体。此函数设计为即使在 64 位架构上也是 32 位安全的，会执行任何必要的尺寸转换。新驱动程序应该设计其\
  \ ioctl 命令，使所有命令都具有可移植性，从而允许 `compat_ioctl()` 和 `unlocked_ioctl()` 指向函数。与 `unlocked_ioctl()`\
  \ 一样，`compat_ioctl()` 不持有 BKL。\n\n```\nint mmap(struct file *file,\n     struct\
  \ vm_area_struct *vma)\n```\n\n将给定文件映射到给定的地址空间，并由 `mmap()` 系统调用调用。\n\n```\nint open(struct\
  \ inode *inode,\n      struct file *file)\n```\n\n创建一个新的文件对象并将其链接到对应的 inode 对象。它由\
  \ `open()` 系统调用调用。\n\n```\nint flush(struct file *file)\n```\n\n每当打开文件的引用计数减少时，VFS\
  \ 调用此函数。其目的取决于文件系统。\n\n```\nint release(struct inode *inode,\n           struct\
  \ file *file)\n```\n\n当对文件的最后一个引用被销毁时，VFS 调用此函数——例如，当共享文件描述符的最后一个进程调用 `close()`\
  \ 或退出时。其目的取决于文件系统。\n\n```\nint fsync(struct file *file,\n      struct dentry *dentry,\n\
  \      int datasync)\n```\n\n由 `fsync()` 系统调用调用，将该文件的所有缓存数据写入磁盘。\n\n```\nint aio_fsync(struct\
  \ kiocb *iocb,\n             int datasync)\n```\n\n由 `aio_fsync()` 系统调用调用，将与 `iocb`\
  \ 关联的文件的所有缓存数据写入磁盘。\n\n```\nint fasync(int fd, struct file *file, int on)\n```\n\
  \n启用或禁用异步 I/O 的信号通知。\n\n```\nint lock(struct file *file, int cmd,\n      struct\
  \ file_lock *lock)\n```\n\n操作给定文件的文件锁。\n\n```\nssize_t readv(struct file *file,\n\
  \             const struct iovec *vector,\n             unsigned long count,\n \
  \            loff_t *offset)\n```\n\n由 `readv()` 系统调用调用，从文件读取并将结果放入 `vector` 中。随后更新偏移量。\n\
  \n```\nssize_t writev(struct file *file,\n              const struct iovec *vector,\n\
  \              unsigned long count,\n              loff_t *offset)\n```\n\n由 `writev()`\
  \ 系统调用调用，将 `vector` 中的 `count` 个缓冲区写入给定文件。\n\n```\nssize_t sendfile(struct file\
  \ *file,\n                loff_t *offset,\n                size_t count,\n     \
  \           int actor,\n                void *target)\n```\n\n由 `sendfile()` 系统调用调用，将数据从一个文件拷贝到另一个文件。它完全在内核中执行拷贝。\n\
  \n```\nssize_t sendpage(struct file *file,\n                 struct page *page,\n\
  \                 size_t size,\n                 loff_t offset,\n              \
  \   long len,\n                 loff_t pos)\n```\n\n用于映射页。\n\n```\nunsigned long\
  \ get_unmapped_area(struct file *file,\n                               long addr,\n\
  \                               long len,\n                               long *offset)\n\
  ```\n\n获取未使用的地址空间。\n\n```\nint check_flags(int flags)\n```\n\n用于检查传递给 `fcntl()`\
  \ 的标志的有效性。\n\n```\nint flock(struct file *filp,\n          int cmd,\n          struct\
  \ file_lock *lock)\n```\n\n用于实现 `flock()` 系统调用，该调用提供建议锁。\n\n### 关于 Ioctls！\n\n不久前，只存在一种\
  \ ioctl 方法。现在有三种。`unlocked_ioctl()` 与 `ioctl()` 相同，例外是在不持有大内核锁（BKL）的情况下被调用的。该函数的作者负责确保同步。BKL\
  \ 是一种粗粒度的锁，而 `compat_ioctl()` 是为了 32 位兼容的 ioctl。\n\n`compat_ioctl()` 同样在不持有 BKL\
  \ 的情况下调用，但它的目的是为 64 位系统提供 32 位兼容的 ioctl 方法。如何实现取决于你现有的 ioctl 命令。具有隐式尺寸类型（如 `long`）的旧驱动程序应该实现一个能够与\
  \ 32 位应用程序正常工作的 `compat_ioctl()` 方法。这通常意味着将 32 位的值转换为 64 位内核的相应类型。\n\n### 与文件系统相关的数据结构\n\
  \n除了基础 VFS 对象外，内核还使用其他标准数据结构来管理与文件系统相关的数据。第一个对象用于描述特定变的文件系统，例如 ext3、ext4 或 UDF。第二个数据结构描述文件系统的挂载实例。\n\
  \n由于 Linux 支持许多不同的文件系统，内核必须有一个特殊的结构来描述每个文件系统的功能和行为。定义在 `<linux/fs.h>` 中的 `file_system_type`\
  \ 结构实现了这一点：\n\n\n\n\n![image](img/p0285-01.jpg)\n\n`get_sb()` 函数在文件系统加载时从磁盘读取超级块并填充超级块对象。其余函数描述了文件系统的属性。\n\
  \n每个文件系统只有一个 `file_system_type`，无论系统上挂载了多少个该文件系统的实例，或者该文件系统是否被挂载。\n\n当文件系统实际挂载时，情况变得变得，此时会被\
  \ `vfsmount` 结构。该结构代表文件系统的特定实例——换句话说，一个挂载点。\n\n`vfsmount` 结构定义在 `<linux/mount.h>`\
  \ 中。内容如下：\n\n![image](img/p0285-02.jpg)\n\n维护所有挂载点列表的复杂之处在于文件系统与其他挂载点之间的关系。`vfsmount`\
  \ 中的各种链表跟踪了这些信息。\n\n`vfsmount` 结构还通过 `mnt_flags` 字段存储挂载时指定的标志（如果有的话）。表 13.1 是标准挂载标志的列表。\n\
  \n表 13.1. 标准挂载标志\n\n![image](img/t0286-01.jpg)\n\n这些标志在管理员不信任的可移动设备上最为有用。它们在 `<linux/mount.h>`\
  \ 中与其他其它较少使用的标志一起定义。\n\n### 与进程相关的数据结构\n\n系统上的每个进程都有它们自己的打开文件列表、根文件系统、当前工作目录、挂载点等。三个数据结构将\
  \ VFS 层与系统上的进程结合在一起：`files_struct`、`fs_struct` 和 `namespace`。\n\n`files_struct`\
  \ 定义在 `<linux/fdtable.h>` 中。处理器描述符中的 `files` 条目指向该表的地址。所有关于打开文件和文件描述符的进程信息都包含其中。内容如下，并带有注释：\n\
  \n![image](img/p0287-01.jpg)\n\n`fd_array` 数组指向打开文件对象的列表。由于 `NR_OPEN_DEFAULT` 等于\
  \ `BITS_PER_LONG`（在 64 位架构上为 64），这为 64 个文件对象预留了空间。如果进程打开了超过 64 个文件对象，内核将分配一个新数组并将\
  \ `fdt` 指针指向它。通过这种方式，访问合理数量的文件对象是非常快速的，在静态数组中进行。如果进程打开了异常数量的文件，内核可以创建一个新数组。如果系统上的大多数进程打开了超过\
  \ 64 个文件，为了获得最佳性能，管理员可以增加 `NR_OPEN_DEFAULT` 预处理器宏以匹配。\n\n第二个与进程相关的结构是 `fs_struct`，它包含了与进程相关的文件系统信息，并由进程描述符中的\
  \ `fs` 字段指向。该结构定义在 `<linux/fs_struct.h>` 中。内容如下，并带有注释：\n\n![image](img/p0287-02.jpg)\n\
  \n该结构持有当前进程的工作目录 (`pwd`) 和根目录。\n\n第三个也是最后一个结构是 `namespace` 结构，它定义在 `<linux/mnt_namespace.h>`\
  \ 中，并由进程描述符中的 `mnt_namespace` 字段指向。进程命名空间是在 Linux 2.4 内内核引入的。它们允许每个进程对系统上挂载的文件系统拥有独特的视图——不仅是唯一的根目录，而是完全唯一的文件系统层次结构。这是该结构，带有通常注释：\n\
  \n![image](img/p0287-03.jpg)\n\n`list` 成员指定了组成命名空间的挂载文件系统的双向链表。\n\n这些数据结构从每个进程描述符链接出来。对于大多数进程，进程描述符指向唯一的\
  \ `files_struct` 和 `fs_struct` 结构。然而，对于使用标志 `CLONE_FILES` 或 `CLONE_FS` 标志创建的进程，这些结构是共享的。([3)\
  \ 因此，多个进程描述符可能会指向同一个 `files_struct` 或 `fs_struct` 结构。每个结构的 `count` 成员提供引用计数，以防止在进程在使用该结构时将其破坏。\n\
  \n^(3) *线程通常指定* `CLONE_FILES` 和 `CLONE_FS`，因此在它们之间共享同一个* `files_struct` 和 `fs_struct`。相比之下，普通进程没有指定这些标志，因此拥有自己的文件系统信息和打开文件表。*\n\
  \n`namespace` 结构的工作方式恰相反。默认情况下，所有进程共享相同的命名空间。（也就是说，它们从同一个挂载表看到相同的文件系统层次结构）。只有在 `clone()`期间指定\
  \ `CLONE_NEWNS` 标志时，进程才会获得 `namespace` 结构的唯一副本。由于大多数进程*没有*提供此标志，所有进程都会继承其父进程的命名空间。因此，在许多系统中只有一个命名空间，尽管仅需一个\
  \ `CLONE_NEWNS` 标志即可实现。\n\n### 结论\n\nLinux 支持广泛的文件系统，从原生文件系统（如 ext3 和 ext4）到网络文件系统（如\
  \ NFS 和 Coda）——仅官方内核就有 60 多个文件系统。VFS 层为这些不同的文件系统提供了实现它们的框架，以及一个与标准系统调用交互的接口。因此，VFS\
  \ 层既使得在 Linux 中实现新文件系统变得简洁，又使这些文件系统能够标准的 Unix 系统调用自动相互操作。本章描述了 VFS 的目的并讨论了它的各种数据结构，包括至关重要的\
  \ inode、dentry 和 superblock 对象。第 14 章，“块 I/O 层”讨论了数据物理上如何到达文件系统。\n\n## 14. 块 I/O\
  \ 层\n\n*块设备*是根据固定大小数据块的随机（即不一定按顺序）访问来区分的硬件设备。固定大小的数据块称为*块 (blocks)*。常见的块设备是硬盘，但也存在许多其他块设备，例如软驱器、蓝光光驱器和闪存。注意这些都是可以挂载文件系统的设备——文件系统是块设备的通用语言。\n\
  \n另一种基本设备类型是*字符设备*。字符设备（或 *char* 设备）被视为顺序数据流并进行访问，一个字节接一个字节。字符设备的示例是串口和键盘。如果硬件设备作为数据流被访问，它就被实现为字符设备。反之，如果设备是以随机（非顺序）方式访问的，它就是块设备。\n\
  \n区别在于设备是否能够随机访问数据——换句话说，设备是否可以从一个位置*寻址 (seek)* 到另一个位置。例如，考虑键盘。作为驱动程序，键盘提供一个数据流。如果你输入\
  \ *wolf*，键盘驱动程序返回一个按准确顺序包含这四个字母的流。乱序读取字母，或者读取流中除下一个之外的任何字母，其意义。因此，键盘驱动程序是一个字符设备；设备提供用户在键盘上输入的字符流。从键盘读取首先返回一个带有\
  \ *w* 的流，然后是 *o*，然后是 *l*，最后是 *f*。当没有按键等待时，该流是空的。相反，硬盘就完全不同。硬盘驱动程序可能会请求读取一个任意块的内容，然后读取另一个块的内容；这些块不需要连续的。硬盘的数据是随机访问的，而不是作为数据流；因此，硬盘是块设备。\n\
  \n\n\n\n在内核中管理块设备比管理字符设备需要更多的细心、准备和工作。字符设备只有一个位置——即当前位置——而块设备必须能够在介质上的任何位置之间来回导航。事实上，内核并不需要提供一个专门用于管理字符设备的子系统，但块设备恰恰拥有了这种支持。这种子系统的存在是必须的，部分是因为块设备的复杂性。然而，获得如此广泛支持的一个大原因是块设备对性能非常敏感；榨干硬盘的每一分性能远比从键盘上再挤出百分之几的速度要重要得多。此外，正如你将看到的，块设备的复杂性为这种优化提供了很大的空间。本章的主题是内核如何管理块设备及其请求。内核的这部分部分被称为\
  \ `block I/O layer`（块 I/O 层）。有趣的是，重构块 I/O 层是 2.5 开发内核的主要目标。本章涵盖了 2.6 内核中全新的块 I/O\
  \ 层。\n\n### 块设备的解剖结构\n\n块设备上最小的可寻址单位是 `sector`（扇区）。扇区的大小为 2 的幂，但 512 字节是最常见的尺寸。扇区大小是设备的物理属性，扇区是所有块设备的基本单位——设备无法寻址或操作比扇区更小的单位，尽管许多块设备可以同时操作多个扇区。大多数块设备具有\
  \ 512 字节的扇区，尽管其他尺寸也很常见。例如，许多 CD-ROM 光盘具有 2 千字节的扇区。\n\n软件有不同的目标，因此施加了它自己的最小逻辑可寻址单位，即\
  \ `block`（块）。块是文件系统的抽象——文件只能以块的倍数进行访问。虽然物理设备在扇区级别是可以寻址的，但内核以块为单位执行所有的磁盘操作。由于设备最小的可寻址单位是扇区，因此块的大小不能小于扇区，且必须是扇区的倍数。此外，内核（与硬件和扇区一样）要求块是\
  \ 2 的幂。内核还要求块的大小不能大于页面大小（参见第 12 章“内存管理”和第 19 章“可移植性”）。^(1) 因此，块的大小是扇区大小的 2 的幂倍，且不超过页面大小。常见的块大小有\
  \ 512 字节、1 千字节和 4 千字节。\n\n^(1) *这是一个人为的限制，在未来可能会消失。然而，强制块保持等于或小于页面大小简化了内核。*\n\n\
  有点令人困惑的是，一些人对扇区和块使用不同的名称。作为设备最小的可寻址单位，“扇区”有时被称为“硬扇区”或“设备块”。与此同时，作为文件系统最小的可寻址单位，“块”有时被称为“文件系统块”或“I/O\
  \ 块”。本章继续称这两个概念为 `sectors` 和 `blocks`，但你应该记住这些其他术语。图 14.1 是扇区与缓冲区之间关系的图表。\n\n图 14.1\
  \ 扇区与块之间的关系。\n\n![image](img/14fig01.jpg)\n\n其他术语（至少在硬盘方面）也很常见——例如 `clusters`（簇）、`cylinders`（柱面）和\
  \ `heads`（头部）。这些概念仅针对特定的块设备，并且大部分情况下对用户空间软件是不可见的。扇区之所以对内核很重要，是因为所有设备 I/O 必须以扇区为单位进行。反之，内核使用的高级概念——块是构建在扇区之上的。\n\
  \n### 缓冲区和缓冲区头 (Buffers and Buffer Heads)\n\n当一个块存储在内存中时（例如在读取之后或等待写入时），它被存储在 `buffer`（缓冲区）中。每个缓冲区精确对应一个块。缓冲区作为内存中表示磁盘块的对象。记住，块由一个或多个扇区组成，但大小不超过一个页面。因此，一个页面可以在内存中容纳一个或多个块。由于内核需要一些关联信息来辅助数据（例如缓冲区来自哪个块设备以及哪个特定块），每个缓冲区都与一个描述符相关。该描述符被称为\
  \ `buffer head`（缓冲区头），类型为 `struct buffer_head`。`buffer_head` 结构包含了内核操作缓冲区所需的所有信息，并定义在\
  \ `<linux/buffer_head.h>` 中。\n\n看看这个结构，带有描述每个字段的注释：\n\n![image](img/p0291-01.jpg)\n\
  \n`b_state` 字段指定此特定缓冲区的状态。它可以是表 14.1 中的一个或多个标志。有效的标志存储在 `bh_state_bits` 枚举中，该枚举定义在\
  \ `<linux/buffer_head.h>` 中。\n\n表 14.1 `bh_state` 标志\n\n![image](img/t0292-01.jpg)\n\
  \n`bh_state_bits` 枚举在列表的最后还包含一个 `BH_PrivateStart` 标志。这不是一个有效的状态标志，而是对应于其他代码可以使用的第一个可用位。所有等于或大于\
  \ `BH_PrivateStart` 的位值均不被块 I/O 层使用，因此这些位对于想要在 `b_state` 字段中存储信息的个别驱动程序来说是安全的。\n\
  \n`b_count` 字段是缓冲区的使用计数。该值由两个内联函数增加和减少，这两个函数都定义在 `<linux/buffer_head.h>` 中：\n\n\
  ![image](img/p0293-01.jpg)\n\n在操作缓冲区头之前，你必须通过 `get_bh()` 增加其引用计数，以确保缓冲区头不会被释放。完成缓冲区头操作后，通过\
  \ `put_bh()` 减少引用计数。\n\n给定缓冲区对应的磁盘物理块，是位于 `b_bdev` 描述的块设备上的第 `b_blocknr` 个逻辑块。\n\
  \n给定缓冲区对应的内存物理页面是 `b_page` 指向的页面。更具体地说，`b_data` 是直接指向块的指针（存在于 `b_page` 某处），其长度为\
  \ `b_size` 字节。因此，该块位于内存中，从地址 `b_data` 开始，到地址 `(b_data + b_size)` 结束。\n\n缓冲区头的目的是描述这种磁盘上块与物理内存缓冲区（特定页面上的字节序列）之间的映射。作为这种“缓冲区到块”映射的描述符，是该数据结构在内核中唯一的作用。\n\
  \n\n\n在 2.6 内核之前，`buffer head` 是一个重要得多的数据结构：它是内核中 I/O 的*单位*。`buffer head` 不仅描述了磁盘块到物理页的映射，还充当所有块\
  \ I/O 的容器。这带来了两个主要问题。首先，`buffer head` 是一个庞大且难以管理的数据结构（现在它已经收缩了一些），而且从 buffer heads\
  \ 来操作数据既不简洁也不简单。相反，内核倾向于以页（pages）为单位进行工作，因为页简单且能够实现更高的性能。描述每个单独缓冲区（可能比一个页小）的大型 buffer\
  \ head 是低效的。因此，在 2.6 内核中，投入了大量工作来让内核直接与页和地址空间工作，而不是缓冲区。其中一些工作在第 16 章“页缓存与页回写”中有所讨论，那里讨论了\
  \ `address_space` 结构和 `pdflush` 守护进程。\n\nbuffer heads 的第二个问题是它们只描述单个缓冲区。当作为所有 I/O\
  \ 操作的容器时，buffer head 强制内核将潜在的大块 I/O 操作（例如写操作）分解为多个 `buffer_head` 结构。这导致了不必要的开销和空间消耗。因此，2.5\
  \ 开发内核的主要目标是引入一种新的、灵活且轻量级的容器用于块 I/O 操作。结果就是 `bio` 结构，将在下一节中讨论。\n\n### `bio` 结构\n\
  \n内核中块 I/O 的基本容器是 `bio` 结构，它定义在 `<linux/bio.h>` 中。该结构以*段*（segments）列表的形式表示正在进行（活动中）的\
  \ I/O 操作。一个段是内存中连续的缓冲区块。因此，单个缓冲区不需要在内存中是连续的。通过允许分块描述缓冲区，`bio` 结构为内核提供了从内存中多个位置对甚至单个缓冲区执行块\
  \ I/O 操作的能力。这种矢量 I/O 被称为*散离聚集 I/O (scatter-gather I/O)*。\n\n以下是定义在 `<linux/bio.h>`\
  \ 中的 `struct bio`，并为每个字段添加了注释：\n\n![image](img/p0294-01.jpg)\n\n`bio` 结构的主要目的是表示一个正在进行的块\
  \ I/O 操作。为此，结构中的大多数字段都与管理有关。最重要的字段是 `bi_io_vec`、`bi_vcnt` 和 `bi_idx`。图 14.2 显示了\
  \ `bio` 结构与其伙伴之间的关系。\n\n图 14.2。`struct bio`、`struct bio_vec` 和 `struct page` 之间的关系。\n\
  \n![image](img/14fig02.jpg)\n\n#### I/O 向量\n\n`bi_io_vec` 字段指向 `bio_vec` 结构数组。这些结构被用作特定块\
  \ I/O 操作中单个段的列表。每个 `bio_vec` 被视为形为 `<page, offset, len>` 的矢量，它描述了一个特定的段：它所处的物理页、作为页内偏移量的块位置，以及从给定偏移量开始的块的长度。这些矢量的完整数组描述了整个缓冲区。`bio_vec`\
  \ 结构定义在 `<linux/bio.h>` 中：\n\n![image](img/p0295-01.jpg)\n\n在每个给块 I/O 操作中，`bio_vec`\
  \ 数组中从 `bi_io_vec` 开始有 `bi_vcnt` 个矢量。随着块 I/O 操作的执行，`bi_idx` 字段指向数组中的当前索引。\n\n总之，每个块\
  \ I/O 请求由一个 `bio` 结构表示。每个请求由一个或多个块组成，存储在 `bio_vec` 结构数组中。这些结构充当矢量，描述每个段在内存物理页中的位置。I/O\
  \ 操作中的第一个段由 `b_io_vec` 指向。每个额外的段都跟在第一个之后，列表中总共有 `bi_vcnt` 个段。当块 I/O 层提交请求中的段时，`bi_idx`\
  \ 字段会被更新以指向当前段。\n\n`bi_idx` 字段用于指向列表中的当前 `bio_vec`，这有助于块 I/O 层跟踪部分完成的块 I/O 操作。然而，更重要的用法是允许拆分\
  \ `bio` 结构。通过此功能，实现独立冗余磁盘阵列（RAID，一种为了性能和可靠性而允许单卷跨越多个磁盘的硬盘设置）的驱动程序可以获取一个最初用于单个设备的\
  \ `bio` 结构，并将其分到 RAID 阵列中的多个硬盘上。RAID 驱动程序需要做的只是拷贝 `bio` 结构并更新 `bi_idx` 字段，指向单个驱动器应该开始操作的位置。\n\
  \n`bio` 结构在 `bi_cnt` 字段中维护一个使用计数。当该字段达到零时，结构被销毁并释放其底层内存。以下两个函数为你管理使用计数器：\n\n```\n\
  void bio_get(struct bio *bio)\n\nvoid bio_put(struct bio *bio)\n```\n\n前者增加使用计数，而后者递减使用计数（如果计数达到零，则销毁\
  \ `bio` 结构）。在操作正在进行的 `bio` 结构之前，请务必增加其使用计数，以确保它不会在你的眼底下完成并被空间。当你完成后，相应地递减使用计数。\n\
  \n最后，`bi_private` 字段是结构所有者（即创建者）的私有字段。按照规则，只有在你分配了 `bio` 结构时，才能读取或写入此字段。\n\n####\
  \ 新旧对比\n\nbuffer heads 和新的 `bio` 结构之间的差异非常重要。`bio` 结构表示 I/O 操作，它可能包含内存中的一个或多个页。另一方面，`buffer_head`\
  \ 结构表示单个缓冲区，描述磁盘上的单个块。由于 buffer heads 与单个页中的单个磁盘块绑定，buffer heads 导致请求被不必要地分成块大小的单元，随后后再重新组装。由于\
  \ `bio` 结构是轻量级的，它可以描述不连续的块，且不一定拆分 I/O 操作。\n\n从 `struct buffer_head` 切换到 `struct\
  \ bio` 提供了其他好处，例如：\n\n- `bio` 结构可以轻松表示高内存，因为 `struct bio` 只处理物理页而不处理直接指针。\n- `bio`\
  \ 结构可以同时表示普通页 I/O 和直接 I/O（不通过页缓存的 I/O 操作——关于页缓存的讨论请参见第 16 章“页缓存与页回写”）。\n- `bio`\
  \ 结构使得易于执行散离聚集（矢量）块 I/O 操作，操作中涉及的数据源自多个物理页。\n- `bio` 结构比 buffer head 轻量得多，因为它只包含表示\
  \ I/O 操作所需的最小信息，而不包含与缓冲区本身相关的不必要信息。\n\n然而，buffer heads 的概念仍然是；buffer heads 充当描述符，将磁盘块映射到页。`bio`\
  \ 结构不包含任何关于缓冲区状态的内——它仅仅是描述单个块 I/O 操作的多个或多个数据段的矢量数组，加上相关信息。在当前的设置中，仍然需要 `buffer_head`\
  \ 结构来包含关于缓冲区的信息，而 `bio` 结构描述正在进行的 I/O。保持这两个结构分离使得它们都能保持尽可能小。\n\n### 请求队列\n\n\n\n\
  \n\n块设备维护 `request queues`（请求队列）以存储其待的块 I/O 请求。请求队列由 `request_queue` 结构表示，定义在 `<linux/blkdev.h>`\
  \ 中。请求队列包含一个请求的双向链表以及相关的控制信息。内核中的高层代码（如文件系统）会将请求添加到队列中。只要请求队列不为空，与队列关联的块设备驱动程序就会从队列头部获取请求并将其提交到关联的块设备。队列请求列表中的每个项都是单个请求，类型为\
  \ `struct request`。\n\n队列中的单个请求由 `struct request`表示，该结构也定义在 `<linux/blkdev.h>` 中。每个请求可以由多个\
  \ `bio` 结构组成，因为单个请求可以操作多个连续的磁盘块。需要注意的是，虽然磁盘上的块必须是相邻的，但内存中的块并不需要是相邻的；每个 `bio` 结构可以描述多个段（回想，段是内存中连续的块区域），请求可以由多个\
  \ `bio` 结构组成。\n\n## I/O 调度器\n\n仅仅按照内核发出请求的顺序、一旦发出就立即发送到块设备，会导致性能低下的。现代计算机中最慢的操作之一就是磁盘寻道。每次寻道——将硬盘磁头定位到特定块的位置——都需要许多毫秒的时间。最小化寻道对系统性能至关重要。\n\
  \n因此，内核不会按照接收到请求的顺序或在接收后立即向磁盘发出块 I/O 请求。相反，它会执行名为 `merging`（合并）和 `sorting`（排序）的操作，以极大提高整个系统的性能。执行这些操作的内核子系统被称为\
  \ `I/O scheduler`调度器。\n\n*这一点必须强调。一个没有这些功能的系统，或者这些功能实现不当的系统，即使只有少量的块 I/O 操作，其性能也会糟糕。*\n\
  \nI/O 调度器在系统中待处理的块 I/O 请求之间分配磁盘 I/O 资源。它通过对请求队列中的待处理请求进行合并和排序来实现。I/O 调度器不与进程调度器混淆（参见第\
  \ 4 章，“进程调度”），后者将处理器资源分配给系统中的各个进程。这两个子系统在本质上相似但并不相同。进程调度器和 I/O 调度器都在多个对象之间虚拟化了资源。在进程调度器的情况下，处理器被虚拟化并在系统进程之间共享。这提供了多任务和时分操作系统（如任何\
  \ Unix）中固有的虚拟化幻象。另一方面，I/O 调度器在多个待处理的块请求之间虚拟化了块设备。这样做是为了最小化磁盘寻道并确保最佳的磁盘性能。\n\n###\
  \ I/O 调度器的工作\n\nI/O 调度器通过管理块设备的请求队列来工作。它决定队列中请求的顺序以及每个请求何时调度到块设备。它管理请求队列的目标是减少寻道，从而获得更大的\
  \ `global throughput`全局吞吐量。这里的“全局”修饰词很重要。坦然，I/O 调度器以牺牲系统的`overall`性能为代价对某些请求不公平。\n\
  \nI/O 调度器执行两个主要动作来最小化寻道：合并和排序。合并是将两个或多个请求合并为一个。考虑一个文件系统提交到队列的示例请求——例如，从文件中读取一段数据。（当然，此时一切操作都是以扇区和块为单位进行的，而不是文件，但假设请求的块源自文件的一段。）如果队列中已经有一个从磁盘上相邻扇区读取的请求（例如，同一个文件的较早的段），那么这两个请求可以合并为一个单个请求，操作一个或多个相邻的磁盘上扇区。通过合并请求，I/O\
  \ 调度器将多个请求的开销减少到单个请求。更重要的是，只需要向磁盘发出一条命令就可以在不需要寻道的情况下处理多个请求。因此，合并请求减少了开销并最小化了寻道。\n\
  \n现在，假设你的虚拟读取请求被提交到请求队列，但没有相邻扇区的读取请求。因此，你无法将此请求与任何请求合并。现在，你可以简单地将此请求挂在队列末尾。但如果磁盘上相似位置还有其他请求呢？将此新请求插入到队列中靠近操作物理相邻扇区的其他请求的地方难道不是更有意义吗？事实上，I/O\
  \ 调度器正是这样做的。整个请求队列按扇区保持排序，以便沿整个队列的所有寻道活动（尽可能地）在硬盘扇区上顺序移动。目标不仅是最小化每次单次寻道，而是通过保持磁盘磁头直线移动来最小化所有的寻道。这与电梯中使用的算法类似——电梯不会疯狂地在各个楼层之间跳跃。相反，它们试图在一个方向上优雅地移动。当到达一个方向的终点层时，电梯可以调转方向向另一个方向移动。由于这种相似性，I/O\
  \ 调度器（有时仅指它们的排序算法）被称为 `elevators`电梯算法。\n\n### Linus 电梯\n\n现在让我们来看一些真实的 I/O 调度器。第一个\
  \ I/O 调度器被称为 `Linus Elevator`。（是的，Linus 确实有一部以他命名的电梯！）它是 2.4 中默认的 I/O 调度器。在 2.6\
  \ 中，它被我们将看到的以下 I/O 调度器取代——然而，由于这个电梯比后续的简单，在执行许多相同功能的同时，它提供了一个极佳的介绍。\n\nLinus Elevator\
  \ 执行合并和排序。当请求被添加到队列时，首先会与所有其他待处理请求进行检查，以查看它是否可能是合并的候选。Linus Elevator I/O 调度器执行`front\
  \ merging`（前向合并）和`back merging`（后向合并）。执行的合并类型取决于现有相邻请求的位置。如果新请求紧随现有请求之后，则进行前向合并。相反，如果新请求紧邻于现有请求之前，则进行后向合并。由于文件的布局方式（通常按扇区编号增加）以及典型工作负载中执行的\
  \ I/O 操作（数据通常从头到尾读取，而不是反过来），与后向合并相比，前向合并非常罕见。尽管如此，Linus Elevator 检查并执行这两种类型的合并。\n\
  \n\n\n\n如果合并尝试失败，则会在队列中寻找一个可能的插入点（即队列中能够按扇区顺序将新请求插入到现有请求之间的的位置）。如果找到了，则将新请求插入该处。如果未找到合适的位置，则将请求添加到队列末尾。此外，如果在队列中发现一个早于预定义阈值的现有请求，即使新请求可以在其他地方进行插入排序，也会被添加到队列末尾。这防止了许多指向磁盘附近位置的请求无限期地饥饿指向磁盘其他位置的请求。遗憾的是，这种“年龄”检查并不高效。它并没有在规定时间内为服务请求提供任何真实尝试，只是在适当的延迟后停止对请求进行插入排序。这改进了延迟，但仍然可能导致请求饥饿，而这正是\
  \ 2.4 I/O 调度器必须解决的大问题。\n\n总而言之，当请求被添加到队列时，可能会发生四种操作。按顺序如下：\n\n1. 如果队列中存在指向相邻磁盘扇区的请求，则将现有请求和新请求合并为单个请求。\n\
  2. 如果队列中的某个请求足够旧，则将新请求插入到队列末尾，以防止其他较旧请求的饥饿。\n3. 如果队列中存在扇区顺序上合适的位置，则将新请求插入该处。这保持了队列按磁盘物理位置排序。\n\
  4. 最后，如果不存在此类合适的插入点，则将请求插入到队列末尾。\n\nLinus 电梯调度算法实现在 `block/elevator.c` 中。\n\n###\
  \ Deadline I/O 调度器\n\nDeadline I/O 调度器试图防止由 Linus 电梯算法引起的饥饿。为了尽可能的减少寻道，对磁盘某一区域的密集磁盘\
  \ I/O 操作可能会无限期地饥饿对磁盘另一部分的请求操作。事实上，指向磁盘同一区域的请求流会导致其他远处的请求永远无法得到服务。这种饥饿是不公平的。\n\n\
  糟糕的是，请求饥饿的通用问题引入了一个特定的问题实例，被称为 `写操作饥饿读取`。写操作通常可以在内核处理它们时随时提交到磁盘，相对于提交的应用程序是完全异步的。读取操作则完全不同。通常，当应用程序提交读取请求时，该程序会阻塞直到请求被完成。也就是说，读取请求相对于提交应用程序是同步的。虽然系统响应在很大程度上不受写延迟（提交写请求所需的时间）的影响，但读取延迟（提交读请求所需的时间）是非常重要的。写延迟对应用程序性能影响很小，但应用程序必须等待每个读取请求的完成。因此，读取延迟对系统性能至关重要。\n\
  \n然而，我们仍然不想无限期延迟写请求，因为内核需要确保数据最终写入磁盘，以防止内存缓冲区增长过大或过旧。\n\n更严重的问题是，读取请求往往相互依赖。例如，考虑读取大量文件的情况。每次读取都是以小的缓冲区块进行的。在从磁盘读取上一个块并返回给应用程序之前，应用程序不会开始读取下一个块（或者说，读取下一个文件）。更糟糕的是，读取和写操作都需要读取各种元数据（如\
  \ inode）。从磁盘读取这些块会进一步加剧 I/O 的序列化。因此，如果每个读取请求都受到个别地饥饿，此类应用程序的总延迟就会累积并可能变得巨大。由于读取请求的异步性和相互依赖性导致读取延迟对系统性能的影响大得多，Deadline\
  \ I/O 调度器实现了几项功能，以确保最大限度地减少一般的请求饥饿，特别是读取饥饿。\n\n注意，减少请求饥饿是以牺牲全局吞吐量为代价的。即使 Linus 电梯也做了这种妥协，尽管方式温和得多。如果\
  \ Linus 电梯始终按扇区顺序将请求插入队列，并且从不检查旧请求并退回到队列末尾插入，它可能会提供更好的整体吞吐量（通过更大幅地减少寻道）。虽然减少寻道很重要，但无限期的饥饿也不是好事。因此，Deadline\
  \ I/O 调度器在提供良好的全局吞吐量的同时，努力限制饥饿。不要误：要在提供请求公平性的同时最大化全局吞吐量是一项艰难的任务。\n\n在 Deadline I/O\
  \ 调度器中，每个请求都关联有一个过期时间。默认情况下，读取请求的过期时间为未来 500 毫秒，写请求为未来 5 秒。Deadline I/O 调度器的运行方式与\
  \ Linus 电梯类似，它维护了一个按磁盘物理位置排序的请求队列。它将此队列称为 `sorted queue`（排序队列）。当新请求被提交到排序队列时，Deadline\
  \ I/O 调度器会像 Linus 电梯一样执行合并和插入。然而，Deadline I/O 调度器还会根据请求类型将请求插入第二个队列。读取请求被排序到特殊的读\
  \ FIFO 队列中，写请求被插入到特殊的写 FIFO 队列中。虽然普通队列按磁盘扇区排序，但这些队列保持 FIFO（实际上，它们是按时间排序的）。因此，新请求始终被添加到队列末尾。在正常操作下，Deadline\
  \ I/O 调度器从排序队列的头部提取请求到调度队列中。然后将调度队列交给磁盘驱动器。这将产生最小的寻道。\n\n然而，在 Deadline I/O 调度器中执行头部合并是可选的。这并不总是值得的，因为许多工作负载的可头部合并的请求很少。\n\
  \n如果写 FIFO 队列或读 FIFO 队列头部的请求过期（即当前时间大于请求关联的过期时间），Deadline I/O 调度器将开始从 FIFO 队列处理请求。通过这种方式，Deadline\
  \ I/O 调度器试图确保没有请求的等待时间超过其有效期。\n\n图 14.3。Deadline I/O 调度器的三个队列。\n\n![image](img/14fig03.jpg)\n\
  \n注意，Deadline I/O 调度器并没有对请求延迟做出任何严格保证。然而，它能够通常在请求过期时或之前提交请求。这防止了请求饥饿。由于读取请求的过期值远小于写请求，Deadline\
  \ I/O 调度器还致力于确保写请求不会饥饿读取请求。这种对读取请求的偏好提供了最小的读取延迟。\n\nDeadline I/O 调度器位于 `block/deadline-iosched.c`\
  \ 中。\n\n### Anticipatory I/O 调度器\n\n\n\n\n\n尽管 Deadline I/O 调度器在最小化读取延迟方面表现出色，但它是以全局吞吐量为代价的。考虑一个正在进行密集写入的系统。每当提交读取请求时，I/O\
  \ 调度器都会迅速处理该读取请求。这导致磁盘寻道到读取位置，执行读取操作，然后寻道回来继续正在进行的写入操作，并对每个读取请求重复这种“小戏码”。对读取请求的偏好是好事，但由此产生的成对寻道（一次到读取请求位置，另一个回到正在进行的写入位置）对全局磁盘吞吐量是有害的。Anticipatory\
  \ I/O 调度器旨在继续提供卓越的读取延迟的同时，也提供优秀的全局吞吐量。\n\n首先，Anticipatory I/O 调度器以 Deadline I/O\
  \ 调度器为基础。因此，它与前者并非完全不同。Anticipatory I/O 调度器实现了三个队列（加上调度队列）并为每个请求设置了过期时间，这与 Deadline\
  \ I/O 调度器一样。主要的改变在于增加了 `anticipation heuristic`（预期启发式算法）。\n\nAnticipatory I/O 调度器试图最小化在其他磁盘\
  \ I/O 活动期间发出的读取请求引发的寻道风暴。当发出读取请求时，它会像通常一样在其正常的过期期内进行处理。然而，在提交请求后，Anticipatory I/O\
  \ 调度器不会立即寻道回来处理其他请求。相反，它会在几毫秒内什么都不做（实际值是可以配置的；默认为六毫秒）。在这几毫秒内，应用程序很有可能会提交另一个读取请求。提交到磁盘相邻区域的任何请求会被立即处理。等待期结束后，Anticipatory\
  \ I/O 调度器会寻道回到之前停止的地方并继续处理之前的请求。\n\n需要注意的是，如果为了更多请求在 `anticipation` 上花费的这几毫秒能够减少哪怕只有一小部分由于在其他密集请求期间处理读取请求而导致的往返寻道，那么也是完全值得的。如果在等待期内发出了相邻的\
  \ I/O 请求，I/O 调度器就节省了一对寻道。随着越来越多的读取请求发送到磁盘同一区域，会有更多的寻道被避免。\n\n当然，如果等待期内没有发生活动，Anticipatory\
  \ I/O 调度器就会失败，浪费几毫秒。从 Anticipatory I/O 调度器中获得最大收益的关键在于正确预测应用程序和文件系统的行为。这是通过一组统计数据和相关的启发式算法实现的。Anticipatory\
  \ I/O 调度器跟踪与每个进程块 I/O 习惯相关的统计数据，以便正确预测应用程序的行为。只要正确预测的比例足够高，Anticipatory I/O 调度器就可以大幅减少为服务读取请求而寻道的代价，同时提供系统响应所需的对这类请求的关注。这使得\
  \ Anticipatory I/O 调度器能够在最小化读取延迟的同时，最小化寻道的次数和持续。这导致了低系统延迟和高系统吞吐量。Anticipatory I/O\
  \ 调度器位于内核源码树的 `block/as-iosched.c` 文件中。在大多数工作负载中表现良好。它是服务器的理想选择，但在涉及某些不常见但关键的寻道友好型数据库的工作负载中表现不佳。\n\
  \n## 完全公平队列 I/O 调度器\n\n完全公平队列 (CFQ) I/O 调度器是一种为特殊工作负载设计的 I/O 调度器，但在实践中它实际上在多种工作负载中都能提供良好的性能。然而，它与之前介绍的\
  \ I/O 调度器有本质区别。\n\nCFQ I/O 调度器根据产生 I/O 请求的进程将传入的 I/O 请求分配到特定的队列。例如，来自进程 `foo` 的\
  \ I/O 请求进入 `foo` 的队列，来自进程 `bar` 的 I/O 请求进入 `bar` 的队列。在每个队列内部，请求会与相邻请求合并并进行插入排序。因此，队列保持按扇区排序，这与其他\
  \ I/O 调度器的队列是一的。与 CFQ I/O 调度器的区别在于，每个提交 I/O 的进程都有一个队列。\n\nCFQ I/O 调度器然后以轮询方式处理队列，在继续处理下一个队列之前，从每个队列中提取可配置数量的请求（默认为四个）。这在进程级别上提供了公平性，确保每个进程都能获得磁盘带宽的公平分片（公平份额）。它预期的工作负载是多媒体，在这种情况下，这种公平算法可以保证例如，音频播放器始终能够及时从磁盘重新填充其音频缓冲区。然而在实践中，CFQ\
  \ I/O 调度器在许多场景下表现都很良好。\n\n完全公平队列 I/O 调度器位于 `block/cfq-iosched.c`。它推荐用于桌面工作负载，尽管在没有任何病态边界的几乎所有工作负载中表现都良好。它现在是\
  \ Linux 的默认 I/O 调度器。\n\n## Noop I/O 调度器\n\n第四个也是最后一个 I/O 调度器是 Noop I/O 调度器，之所以命名是因为它基本上是一个\
  \ `noop`（无操作）——它做得不多。Noop I/O 调度器不执行排序或任何形式的寻道预防。反之，它不需要实现类似于你在前三个 I/O 调度器中看到的最小化请求延迟的巧妙算法。\n\
  \n然而，Noop I/O 调度器确实执行合并，这是它唯一的任务。当新请求被提交到队列时，它会与任何相邻请求合并。除了此操作外，Noop I/O 调度器确实是一个\
  \ `noop`，仅维持请求队列近乎 FIFO（先进先出）的顺序，块设备驱动程序从中提取请求。\n\nNoop I/O 调度器之所以不承担重任是有原因的。它旨在用于真正的随机访问块设备，例如闪存卡。如果一个块设备与“寻道”相关的开销很少或没有，那么就不需要对传入的请求进行插入排序，Noop\
  \ I/O 调度器就是理想人选。Noop I/O 调度器位于 `block/noop-iosched.c`。它仅用于随机访问设备。\n\n## I/O 调度器选择\n\
  \n你现在看到了 2.6 内核中的四种不同的 I/O 调度器。这些每个 I/O 调度器都可以启用并编译进内核。默认情况下，块设备使用完全公平队列 I/O 调度器。这可以通过内核命令行上的启动选项\
  \ `elevator=foo` 进行覆盖，其中 `foo` 是有效且启用的 I/O 调度器。参见表 14.2。\n\n表 14.2 传递给 `elevator`\
  \ 选项的参数\n\n![image](img/t0304-01.jpg)\n\n例如，内核命令行选项 `elevator=as` 将为所有块设备启用 Anticipatory\
  \ I/O 调度器，覆盖默认的完全公平队列调度器。\n\n\n\n\n\n# 第 12 章 (ch12.html)，“内存管理”探讨了内核如何管理物理内存。除了管理自身的内存外，内核还必须管理用户空间进程的内存。这种内存被称为\
  \ `process address space`（进程地址空间），它是系统分配给每个用户空间进程的内存表示。Linux 是一个虚拟内存操作系统，因此内存资源在系统的进程之间是虚拟化的。单个进程对内存的视图就像它独自拥有访问系统物理内存的权限。更重要的是，即使是单个进程的地址空间也可以比物理内存大得多。本章将讨论内核如何管理进程地址空间。\n\
  \n## 地址空间\n\n进程地址空间由进程可以访问的虚拟内存地址以及进程被允许使用的虚拟内存中的地址组成。每个进程被分配一个 `flat`（平坦）的 32 位或\
  \ 64 位地址空间，其大小取决于架构。`flat` 一词表示地址空间存在于单一范围范围内。（例如，32 位地址空间从地址 0 扩展到 4294967295。）某些操作系统提供\
  \ `segmented address space`（分段地址空间），地址不存在于单一的线性范围内，而是存在于多个段中。现代虚拟内存操作系统通常具有平坦内存模型，而不是分段模型。通常，这种平坦地址空间是每个进程独有的。一个进程地址空间中的内存地址与另一个进程地址空间中的相同内存地址完全没有关系。两个进程在各自的地址空间的相同地址上可以有不同的数据。或者，进程可以选择与其他进程共享其地址空间。我们称这些进程为\
  \ `threads`（线程）。\n\n内存地址是地址空间内的给定值，例如 `4021f000`。这个特定值标识了进程 32 位地址空间中的一个特定字节。虽然进程可以寻址高达\
  \ 4GB 的内存（使用 32 位地址空间时），但它没有权限访问所有内存。地址空间中有趣的部分是进程有权访问的内存地址区间，例如 `08048000-0804c000`。这些合法地址区间被称为\
  \ `memory areas`（内存区域）。进程可以通过内核动态地向其地址空间添加和删除内存区域。\n\n进程只能在有效的内存区域内访问内存地址。内存区域具有关联权限，例如可读、可写和可执行，关联进程必须遵守这些权限。如果进程访问了不在有效内存内的内存地址，或者以无效方式访问了有效区域，内核将发出可恐的“Segmentation\
  \ Fault”（段错误）消息并杀死进程。\n\n内存区域可以包含各种精彩内容，例如：\n\n- 可执行文件代码的内存映射，称为 `text section`（代码段）。\n\
  - 可执行文件已初始化全局变量的内存映射，称为 `data section`（数据段）。\n- 零页（一个全零的页，用于此类目的）的内存映射，其中包含未初始化的全局变量，称为\
  \ `bss section`（bss 段）。\n\n*“BSS”一词具有历史性。它代表 block started by symbol（由符号启动的块）。未初始化的变量不存储在可执行对象文件中，因为它们没有任何关联的值。但\
  \ C 标准规定未初始化的全局变量被分配某些默认值（基本上是全零），因此内核从可执行文件中加载变量（无值）到内存中，并将零页映射到该区域，从而为变量赋予零值，而无需在对象文件中通过显式初始化来浪费空间。*\n\
  \n- 用于进程用户空间栈的零页内存映射。（不要将其与进程的内核栈混淆，内核栈是独立的，由内核维护和使用。）\n- 每个加载到进程地址空间中的共享库（如 C 库和动态链接器）额外的\
  \ text、data 和 bss 段。\n- 任何内存映射文件。\n- 任何共享内存段。\n- 任何匿名内存映射，例如与 `malloc()` 关联的。\n\n\
  *较版本的 glibc 除了 `brk()` 之外，还通过 `mmap()` 实现 `malloc()`。*\n\n进程地址空间中的所有有效地址仅存在于一个区域；内存区域不重叠。正如你所，运行进程中的每个不同内存块都有独立的内存区域：栈、对象代码、全局变量、映射文件等。\n\
  \n## 内存描述符\n\n内核使用名为 `memory descriptor`（内存描述符）的数据结构表示进程的地址空间。该结构包含了所有与进程地址空间相关的信息。内存描述符由\
  \ `struct mm_struct` 表示，定义在 `<linux/mm_types.h>` 中。让我们来看内存描述符，并带有描述每个字段的注释：\n\n\
  ![image](img/p0307-01.jpg)\n\n`mm_users` 字段是使用此地址空间的进程数。例如，如果两个线程共享此地址空间，`mm_users`\
  \ 等于二。`mm_count` 字段是 `mm_struct` 的主引用计数。所有 `mm_users` 等于 `mm_count` 的一次增加。因此，在之前的示例中，`mm_count`\
  \ 仅为一。如果有九个线程共享一个地址空间，`mm_users` 将是九，但 `mm_count` 仍然只有一。只有当 `mm_users` 到零时（当所有使用地址空间的线程退出时），`mm_count`\
  \ 才会减一。当 `mm_count` 最终达到零时，不再有指向此 `mm_struct` 的引用，它会被释放。当内核操作地址空间并需要增加关联的引用计数时，内核会增加\
  \ `mm_count`。两个计数允许内核区分主使用计数器（`mm_count`）和使用地址空间的进程数（`mm_users`）。\n\n`mmap` 和 `mm_rb`\
  \ 字段是不同的数据结构，但包含相同的内容：此地址空间中的所有内存区域。前者将它们存储在链表中，而后者将它们存储在红黑树中。红黑树是一种二叉树；与所有二叉树一样，搜索给定元素是一个\
  \ `O(log n)` 操作。关于红黑树的进一步讨论，请参见本章后面的“[Lists and Trees of Memory Areas#ch15.html_ch15lev2sec6).”虽然内核通常会避免使用两个数据结构来组织相同数据的额外负担，但这种冗余在这里非常有用。`mmap`\
  \ 数据结构作为链表，允许对所有元素进行简单高效的遍历。另一方面，`mm_rb` 数据结构作为红黑树，更适合搜索给定元素。内存区域将在本章稍后部分详细讨论。内核并没有复制\
  \ `mm_struct` 结构；只是复制了包含它们的对象。在树上覆盖链表并使用两者访问同一组数据，这种做法有时被称为 `threaded tree`（线程树）。\n\
  \n所有的 `mm_struct` 结构通过 `mmlist` 字段在双向链列表中连接。列表中的初始元素是 `init_mm` 内存描述符，它描述了 init\
  \ 进程的地址空间。该列表通过 `mmlist_lock` 保护并发访问，该锁定义在 `kernel/fork.c` 中。\n\n### 分配内存描述符\n\n\
  \n\n\n\n与给定任务相关的内存描述符存储在进程描述符的 `mm` 字段中。（进程描述符由定义在 `<linux/sched.h>` 中的 `task_struct`\
  \ 结构表示。）因此，`current->mm` 是当前进程的内存描述符。`copy_mm()` 函数在 `fork()` 期间将父进程内存描述符拷贝给子进程。`mm_struct`\
  \ 结构通过 `kernel/fork.c` 中的 `allocate_mm()` 宏从 `mm_cachep` slab 缓存中分配。通常，每个进程都会接收到一个唯一的\
  \ `mm_struct`，从而拥有一个唯一的进程地址空间。\n\n进程可以通过向 `clone()` 传递 `CLONE_VM` 标志来选择与其子进程共享地址空间。此时进程被称为线程。回想第\
  \ 3 章“进程管理”，这本质上是 Linux 中普通进程与所谓“线程”之间的唯一区别；Linux 内核在其他方面并不区分它们。对于内核来说，线程只是仅仅共享了某些资源的普通进程。\n\
  \n在指定了 `CLONE_VM` 的情况下，不会调用 `allocate_mm()`，而是通过 `copy_mm()` 中的以下逻辑将进程的 `mm` 字段指向其父进程的内存描述符：\n\
  \n![image](img/p0308-01.jpg)\n\n### 销毁内存描述符\n\n当与特定地址相关的进程退出时，会调用定义在 `kernel/exit.c`\
  \ 中的 `exit_mm()` 函数。该函数执行一些清理工作并更新某些统计信息。然后调用 `mmput()`，减少内存描述符的 `mm_users` 用户计数。如果用户计数达到零，则调用\
  \ `mmdrop()` 减少 `mm_count` 使用计数器。如果该计数器最终为零，则调用 `free_mm()` 宏通过 `kmem_cache_free()`\
  \ 将 `mm_struct` 返回给 `mm_cachep` slab 缓存，因为该内存描述符没有任何用户了。\n\n### `mm_struct` 与内核线程\n\
  \n内核线程没有进程地址空间，因此没有相关的内存描述符。因此，内核线程描述符的 `mm` 字段为 `NULL`。这就是内核线程的定义——没有用户上下文的进程。\n\
  \n这种地址空间的缺失没有问题，因为内核线程永远不会访问任何用户空间内存。（它们会访问谁的内存？）因为内核线程在用户空间中没有任何页，所以它们不应该拥有自己的内存描述符和页表。（页表将在本章稍后讨论。）尽管如此，内核线程仍然需要某些数据（例如页表），以便访问内核内存。为了给内核线程提供所需数据，同时避免在内存描述符和页表上浪费内存，或在每次内核线程开始运行时切换到新地址空间时浪费处理器周期，内核线程会使用上一个运行的任务的内存描述符。\n\
  \n每当进程被调度时，进程 `mm` 字段引用的进程地址空间会被加载。随后更新进程描述符中的 `active_mm` 字段以指向新的地址空间。内核线程没有地址空间且\
  \ `mm` 为 `NULL`。因此，当内核线程被调度时，内核发现 `mm` 为 `NULL` 并保持上一个进程的地址空间加载。内核随后更新内核线程描述符的 `active_mm`\
  \ 字段，指向上一个进程的内存描述符。内核线程就可以根据需要使用上一个进程的页表。由于内核线程访问用户空间内存，它们只利用地址空间中与内核内存相关的信息，而这些信息对所有进程都是相同的。\n\
  \n### 虚拟内存区域\n\n内存区域结构 `vm_area_struct` 表示内存区域。它定义在 `<linux/mm_types.h>` 中。在 Linux\
  \ 内核中，内存区域被称为虚拟内存区域（简称 VMA）。\n\n`vm_area_struct` 结构描述了给定地址空间内连续区间上的单个内存区域。内核将每个内存区域视为唯一的内存对象。每个内存区域拥有某些属性，例如权限和一组关联的操作。通过这种方式，每个\
  \ VMA 结构可以表示不同类型的内存区域——例如内存映射文件或进程的用户空间栈。这与 VFS 层采用的面对象方法类似（参见第 13 章）。以下是该结构，并了描述每个字段的注释：\n\
  \n![image](img/p0310-01.jpg)\n\n回想每个内存描述符都与进程地址空间中的唯一区间相关。`vm_start` 字段是该区间内的起始（最低）地址，而\
  \ `vm_end` 字段是区间内最后一个（最高）地址之后的第一个字节。也就是说，`vm_start` 是包含性的起始，而 `vm_end` 是不包含结束。因此，`vm_end\
  \ – vm_start` 是内存区域的字节长度，它存在于 `vm_start, vm_end)` 区间。同一地址空间内不同内存区域的区间不能重叠。\n\n`vm_mm`\
  \ 字段指向此 VMA 关联的 `mm_struct`。注意，每个 VMA 对于其关联的 `mm_struct` 都是唯一的。因此，即使两个独立的进程将同一个文件映射到各自的地址空间，它们每个也都有一个唯一的\
  \ `vm_area_struct` 来识别其唯一的内存区域。相反，两个共享地址空间的线程也共享其其中所有的 `vm_area_struct` 结构。\n\n\
  #### VMA 标志\n\n`vm_flags` 字段包含定义在 `<linux/mm.h>` 中的位标志，这些标志指定了内存区域中所包含页的行为并提供相关信息。与特定物理页相关的权限不同，VMA\
  \ 标志指定的是由内核负责的行为，而不是硬件。此外，`vm_flags` 包含与内存区域中每个页或整个内存区域的信息，而不是特定的单个页。[表 15.1 是可能的\
  \ `vm_flags` 值列表。\n\n表 15.1. `vm_flags`\n\n![image](img/t0311-01.jpg)\n\n让我们深入查看一些更重要且有趣的标志。`VM_READ`、`VM_WRITE`\
  \ 和 `VM_EXEC` 标志指定了此特定内存区域页的常规读、写、执行权限。它们根据需要组合，形成访问该 VMA 的进程必须遵守的适当访问权限。例如，进程的对象代码可能带有\
  \ `VM_READ` 和 `VM_EXEC` 标志映射，但没有 `VM_WRITE`。另一方面，来自可执行对象的数据段将映射为 `VM_READ` 和 `VM_WRITE`，但此时\
  \ `VM_EXEC` 意义不大。同时，只读的内存映射数据文件将仅带有 `VM_READ` 标志映射。\n\n`VM_SHARED` 标志指定该内存区域是否包含多个进程间共享的映射。如果设置了该标志，直观上它被称为共享映射。如果未设置该标志，则只有一个进程可以查看此特定映射，它被称为私有映射。\n\
  \n`VM_IO` 标志指定该内存区域是设备 I/O 空间的映射。该字段通常由设备驱动程序在 I/O 空间上调用 `mmap()` 时设置。它指定了其他等内存区域不能包含在任何进程的转转储（core\
  \ dump）中。`VM_RESERVED` 标志指定该内存区域不能被交换出。它也被设备驱动映射所使用。\n\n\n\n\n`VM_SEQ_READ` 标志向内核提供了一个提示，说明应用程序正在该映射中执行顺序（即线性且连续的）读取。内核随后可以选择增加对底层文件执行的预读（read-ahead）。`VM_RAND_READ`\
  \ 标志则规定了完全相反：应用程序正在该映射中执行相对随机（即非顺序的）读取。内核随后可以选择减少或完全禁用对底层文件的预读。这些标志分别通过通过 `madvise()`\
  \ 系统调用配合 `MADV_SEQUENTIAL` 和 `MADV_RANDOM` 标志来设置。预读是在请求数据之前按顺序读取后续数据的行为，希望这些额外数据很快就会被需要。如果应用程序按顺序读取数据，这种行为是有有益的。然而，如果数据访问模式是随机的，预读就无效了。\n\
  \n#### VMA 操作\n\n`vm_area_struct` 结构中的 `vm_ops` 字段指向与给定内存区域相关的操作表，内核可以调用该表来操纵 VMA。`vm_area_struct`\
  \ 充当表示任意内存区域的通用对象，而操作表描述了可以操作该对象特定实例的具体方法。\n\n操作表由 `struct vm_operations_struct`\
  \ 表示并定义在 `<linux/mm.h>` 中：\n\n![image](img/p0312-01.jpg)\n\n以下是每个具体方法的描述：\n\n• `void\
  \ open(struct vm_area_struct *area)`\n\n当给定的内存区域被添加到地址空间时，调用此函数。\n\n• `void close(struct\
  \ vm_area_struct *area)`\n\n当给定的内存区域从地址空间中移除时，调用此函数。\n\n• `int fault(struct vm_area_sruct\
  \ *area, struct vm_fault *vmf)`\n\n当访问不在物理内存中的页时，页错误异常处理程序会调用此函数。\n\n• `int page_mkwrite(struct\
  \ vm_area_sruct *area, struct vm_fault *vmf)`\n\n当一个只读页正变为可写时，页错误异常处理程序会调用此函数。\n\
  \n• `int access(struct vm_area_struct *vma, unsigned long address, void *buf, int\
  \ len, int write)`\n\n当 `get_user_pages()` 失败时，由 `access_process_vm()` 调用此函数。\n\n\
  #### 内存区域的列表与树\n\n如前所述，通过内存描述符的 `mmap` 和 `mm_rb` 字段访问内存区域。这两个数据结构独立地指向与内存描述符相关的所有内存区域对象。事实上，它们都包含指向相同\
  \ `vm_area_struct` 结构的指针，只是表示方式不同。\n\n第一个字段 `mmap` 将所有内存区域对象以单链表的形式连接。每个 `vm_area_struct`\
  \ 结构通过其 `vm_next` 字段链接到列表中。这些区域按地址升序排序。第一个内存区域是 `mmap` 指向的 `vm_area_struct` 结构。最后一个结构指向\
  \ `NULL`。\n\n第二个字段 `mm_rb` 将所有内存区域对象以红黑树的形式连接。红黑树的根是 `mm_rb`，地址空间中的每个 `vm_area_struct`\
  \ 结构通过其 `vm_rb` 字段链接到树上。\n\n红黑树是一种平衡二叉树。红黑树中的每个元素被称为节点。初始节点被称为树的根。大多数节点有两个孩子：左孩子和右孩子。某些节点只有一个孩子，而末节点（称为叶节点）没有孩子。对于任何节点，左侧的元素值较小，而右侧的元素值较大。此外，每个节点根据两条规则分配一种颜色（红色或黑色，因此得名此类树）：红色节点的节点是黑色的，从节点到叶节点的树的路径必须包含相同数量的黑色节点。根节点始终是红色的。树的查找、插入和删除都是\
  \ `O(log(n))` 操作。\n\n当需要遍历每个节点时使用链表。当需要在地址空间中定位特定的内存区域时使用红黑树。通过这种方式，内核利用冗余的数据结构，无论对内存区域执行什么操作，都能提供最佳性能。\n\
  \n#### 现实中的内存区域\n\n让我们来看特定进程的地址空间及其内部的内存区域。此任务使用了常用的 `/proc` 文件系统和 `pmap`(1) 工具。示例是一个简单的用户空间程序，除了作为一个示例外，没有做任何有价值的事：\n\
  \n```c\nint main(int argc, char *argv[])\n{\n    return 0;\n}\n```\n\n注意此进程地址空间中的几个内存区域。首先，你知道有文本段（text\
  \ section）、数据段（data section）和 bss 段。假设此进程与 C 库动态链接，这三个内存区域也存在于 `libc.so` 和 `ld.so`\
  \ 中。最后，还有进程的栈（stack）。\n\n`/proc/<pid>/maps` 的输出列出了该进程地址空间中的内存区域：\n\n![image](img/p0314-02.jpg)\n\
  \n数据格式如下：\n\nstart-end permission offset major:minor inode file\n\n`pmap` 工具显示进程内存的格式化列表。它比\
  \ `/proc` 输出更易读：\n\n![image](img/p0314-03.jpg)\n\n前三行是 `libc.so`（C 库）的文本段、数据段和 bss。接下来的两行是执行文件的文本段和数据段。后续三行是动态链接器\
  \ `ld.so` 的文本段、数据段和 bss。最后一行是进程的栈。\n\n注意文本段都是可读可执行的，这是预之中的。相反，数据段和 bss（都包含全局变量）被标记为可读可写，但不可执行。栈自然地是可读可写可执行的。\n\
  \n整个地址空间占用了 1340KB，但只有 40KB 是可写且私有的。如果内存区域是共享或不可写的，内核在内存中只保留一份文件的副本。对于共享映射，这似乎是常识，但不可写的情况可能会让人意外。如果你考虑到不可写映射永远不会更改（只读），就很明显在内存中加载一次映像是安全的。因此，C\
  \ 库只需要在内存中占用 1212KB，而不是每个使用它的进程乘以 1212KB。由于此进程可以访问 1340KB 的数据和代码，但仅消耗 40KB 的物理内存，这种共享节省的空间是非常巨大的。\n\
  \n注意没有映射到设备 `00:00` 节点 0 的内存区域。这是零页，是一个由全零组成的映射。通过将零页映射到可写内存区域，该区域实际上被“初始化”为全零。这很重要，因为它提供了一个清零的内存区域，这是\
  \ bss 期的。由于映射不是共享的，一旦进程写入这些数据，就会创建一个副本（写时复制）并更新零值。\n\n与该进程相关的每个内存区域都对应一个 `vm_area_struct`\
  \ 结构。由于该进程不是线程，它有一个从 `task_struct` 引用的唯一 `mm_struct` 结构。\n\n\n\n\n内核经常需要对内存区域执行操作，例如检查给定地址是否存在于特定的\
  \ VMA 中。这些操作非常频繁，并构成了 `mmap()` 例程的基础，该例将在下一节中介绍。内核定义了一些辅助函数来协助这些工作。\n\n这些函数都声明在\
  \ `<linux/mm.h>` 中。\n\n#### `find_vma()`\n\n内核提供了一个函数 `find_vma()`，用于查找给定内存地址所属的\
  \ VMA。它定义在 `mm/mmap.c` 中：\n\n```c\nstruct vm_area_struct * find_vma(struct mm_struct\
  \ *mm, unsigned long addr);\n```\n\n该函数在给定的地址空间中搜索第一个 `vm_end` 字段大于 `addr` 的内存区域。换句话说，该函数找到第一个包含\
  \ `addr` 或起始地址大于 `addr` 的内存区域。如果不存在这样的内存区域，函数返回 `NULL`。否则，返回一个指向 `vm_area_struct`\
  \ 结构的指针。注意，由于返回的 VMA 可能从大于 `addr` 的地址开始，因此给定地址并不一定位于返回的 VMA 内部。`find_vma()` 函数的结果被缓存在内存描述符的\
  \ `mmap_cache` 字段中。由于对一个 VMA 进行操作后可能会跟随对该 VMA 的更多操作，缓存结果具有较高的命中率（实践中约为 30–40%）。检查缓存结果非常快。如果给定地址不在缓存中，你必须搜索与该内存描述符相关的内存区域以匹配。这是通过红黑树实现的：\n\
  \n![image](img/p0316-01.jpg)\n\n对 `mmap_cache` 的初始检查测试缓存的 VMA 是否包含所需的地址。注意，仅仅检查\
  \ VMA 的 `vm_end` 字段是否大于 `addr` 并不能确保它是大于 `addr` 的第一个此类 VMA。因此，为了让缓存在此处有用，给定的 `addr`\
  \ 必须位于 VMA 之中——幸运的是，这恰好是同同一 VMA 上发生连续操作的场景。\n\n如果缓存中不包含所需的 VMA，函数必须搜索红黑树。如果当前 VMA\
  \ 的 `vm_end` 大于 `addr`，函数向左子节点移动；否则向右子节点移动。一旦找到包含 `addr` 的 VMA，函数就会终止。如果未找到此类 VMA，函数将继续遍历树并返回找到的第一个在\
  \ `addr` 之后起始的 VMA。如果没有找到 VMA，则返回 `NULL`。\n\n#### `find_vma_prev()`\n\n`find_vma_prev()`\
  \ 函数的工作与 `find_vma()` 相同，但它还会返回 `addr` 之前的最后一个 VMA。该函数也定义在 `mm/mmap.c` 中，并在 `<linux/mm.h>`\
  \ 中声明：\n\n![image](img/p0317-01.jpg)\n\n`pprev` 参数存储了指向 `addr` 之前的 VMA 的指针。\n\n\
  #### `find_vma_intersection()`\n\n`find_vma_intersection()` 函数返回与给定地址区间重叠的第一个 VMA。该函数定义在\
  \ `<linux/mm.h>` 中因为它因为它内联函数：\n\n![image](img/p0317-02.jpg)\n\n第一个参数是要搜索的地址空间，`start_addr`\
  \ 是区间的起始地址，`end_addr` 是区间的结束地址。\n\n显然，如果 `find_vma()` 返回 `NULL`，`find_vma_intersection()`\
  \ 也会返回 `NULL`。然而，如果 `find_vma()` 返回一个有效的 VMA，只有当该 VMA 不在给定地址范围结束之后起始时，`find_vma_intersection()`\
  \ 才会返回该 VMA。如果返回的内存区域确实在给定地址范围结束之后起始，函数返回 `NULL`。\n\n#### `mmap()` 和 `do_mmap()`：创建地址区间\n\
  \n内核使用 `do_mmap()` 函数创建一个新的线性地址区间。说该函数创建一个新的 VMA 在技术上是不准确的，因为如果创建的地址区间与现有地址区间相邻，且它们共享相同的权限，则这两个区间将合并为一个。如果无法合并，则创建一个新的\
  \ VMA。在任何情况下，`do_mmap()` 都是向进程地址空间添加地址区间的函数——无论这意味着扩展现有的内存区域还是创建一个新的。\n\n`do_mmap()`\
  \ 函数声明在 `<linux/mm.h>` 中：\n\n![image](img/p0318-01.jpg)\n\n该函数映射由 `file` 指定的文件，在偏移量\
  \ `offset` 处，长度为 `len`。`file` 参数可以为 `NULL`，`offset` 可以为零，在这种情况下映射将不受文件支持。在这种情况下，这被称为匿名映射。如果提供了文件和偏移量，则映射被称为文件支持映射。\n\
  \n`addr` 参数可选地指定从搜索空闲区间的起始地址。\n\n`prot` 参数指定内存区域中页的访问权限。可能的权限标志定义在 `<asm/mman.h>`\
  \ 中，并且每个支持的架构所独特，尽管在实践中每个架构定义了表 15.2 中列出的标志。\n\n表 15.2. 页保护标志\n\n![image](img/t0318-01.jpg)\n\
  \n`flags` 参数指定与剩余 VMA 标志对应的标志。这些标志指定了映射类型并改变映射的行为。它们也定义在 `<asm/mman.h>` 中。参见表 15.3。\n\
  \n表 15.3. 映射类型标志\n\n![image](img/t0319-01.jpg)\n\n如果任何参数无效，`do_mmap()` 返回一个负值。否则，将在虚拟内存中定位一个合适的区间。如果可能，该区间将与相邻的内存区域合并。否则，将从\
  \ `vm_area_cachep` slab 缓存中分配一个新的 `vm_area_struct` 结构，并通过 `vma_link()` 函数将新内存区域添加到地址空间的内存区域链表和红黑树中。接下来，会更新内存描述符中的\
  \ `total_vm` 字段。最后，函数返回新创建的地址区间的初始地址。\n\n`do_mmap()` 功能通过 `mmap()` 系统调用导出到用户空间。`mmap()`\
  \ 系统调用定义为：\n\n```c\nvoid * mmap2(void *start,\n           size_t length,\n     \
  \      int prot,\n           int flags,\n           int fd,\n           off_t pgoff)\n\
  ```\n\n该系统调用命名为 `mmap2()` 是因为它是 `mmap()` 的第二个变体。原始的 `mmap()` 最后一个参数接收字节偏移量；而当前的\
  \ `mmap2()` 接收页偏移量。这使得具有较大偏移量的大文件可以被映射。POSIX 指定的原始 `mmap()` 在 C 库中作为 `mmap()` 可用，但在内核本身不再实现，而新版本作为\
  \ `mmap2()` 可用。这两个库调用都使用 `mmap2()` 系统调用，原始的 `mmap()` 将偏移量从字节转换为页。\n\n#### `munmap()`\
  \ 和 `do_munmap()`：移除地址区间\n\n`do_munmap()` 函数从指定的进程地址空间中移除地址区间。该函数声明在 `<linux/mm.h>`\
  \ 中：\n\n```c\nint do_munmap(struct mm_struct *mm, unsigned long start, size_t len);\n\
  ```\n\n第一个参数指定了从哪个地址空间中移除从地址 `start` 开始、长度为 `len` 字节的区间。成功后，返回 0。否则，返回负错误代码。\n\n\
  `munmap()` 系统调用导出到用户空间，以便进程能够从其地址空间移除地址区间；它是 `mmap()` 系统调用的补充：\n\n```c\nint munmap(void\
  \ *start, size_t length)\n```\n\n该系统调用定义在 `mm/mmap.c` 中，并作为 `do_munmap()` 的简单封装：\n\
  \n![image](img/p0320-01.jpg)\n\n### 页表\n\n\n\n尽管应用程序在映射到物理地址的虚拟内存上运行，但处理器直接在这些物理地址上操作。因此，当应用程序访问虚拟内存地址时，必须先将其转换为物理地址，处理器才能解析该请求。这种查找是通过页表完成的。页表的工作原理是将虚拟地址拆分成若干块。每个块被用作表中的索引。该表指向另一个表，或者指向关联的物理页。\n\
  \n在 Linux 中，页表由三级组成。多级结构使得即使在 64 位机器上也能实现稀疏的地址空间。如果页表被实现为单一静态数组，那么即使在 32 位架构上，其大小也将是巨大的。Linux\
  \ 即使在不支持硬件三级的架构上也使用三级页表。（例如，某些硬件仅使用两级或在硬件中实现哈希。）使用三级是一种“最大公约数”策略——实现较简单的架构可以通过编译器优化按需要简化内核页表。\n\
  \n顶层页表是页全局目录（PGD），它由 `pgd_t` 类型的数组组成。在大多数架构上，`pgd_t` 类型是一个 `unsigned long`。PGD 中的条目指向二级目录\
  \ PMD 中的条目。\n\n第二级页表是页中间目录（PMD），它是一个 `pmd_t` 类型的数组。PMD 中的条目指向 PTE 中的条目。\n\n最后一级简单称为页表，由\
  \ `pte_t` 类型的页表条目组成。页表条目指向物理页。\n\n在大多数架构中，页表查找（至少在某种程度上）由硬件处理。在正常运行期间，硬件可以承担大部分使用页表的职责。然而，内核必须进行相应的设置，使硬件能够顺利并执行其工作。图\
  \ 15.1 展示了使用页表进行虚拟到物理地址查找的流程。\n\n图 15.1. 虚拟到物理地址查找。\n\n![image](img/15fig01.jpg)\n\
  \n每个进程都有自己的页表（当然，线程共享它们）。内存描述符的 `pgd` 字段指向进程的页全局目录。操作和遍历页表需要 `page_table_lock`，它位于关联的内存描述符内部。\n\
  \n页表数据结构非常依赖于架构，因此定义在 `<asm/page.h>` 中。\n\n由于虚拟内存中的几乎每次访问都必须解析其在物理内存中对应的地址，因此页表的性能至关重要。遗憾的是，在内存中查找所有这些地址只能做到这么快。为了这一点，大多数处理器实现了*转译查找缓冲区*（或简称为\
  \ *TLB*），它作为虚拟到物理映射的硬件缓存。当访问虚拟地址时，处理器首先检查该映射是否缓存在 `TLB` 中。如果命中（hit），则立即返回物理地址。否则，如果未命中（miss），则查询页表以获取相应的物理地址。\n\
  \n尽管如此，页表管理仍然是内核的一个关键且不断演变的部分。2.6 版本对该领域的更改包括从高内存中分配部分页表。未来的可能性包括具有写时复制语义的共享页表。在那种方案中，页表将在\
  \ `fork()` 跨父子进程之间共享。当父进程或子进程尝试修改特定的页表条目时，将创建一个副本，两个进程将不再共享该条目。共享页表将消除 `fork()`\
  \ 时拷贝页表条目的开销。\n\n### 结论\n\n在这个充满悬念的章节中，我们查看了为每个进程提供的内存抽象。我们查看了内核如何表示进程地址空间（通过 `struct\
  \ mm_struct`）以及内核如何表示该空间内的内存区域（`struct vm_area_struct`）。我们涵盖了内核如何创建（通过 `mmap()`）和销毁（通过\
  \ `munmap()`）这些内存区域。最后，我们涵盖了页表。由于 Linux 是基于虚拟内存的操作系统，这些概念对于它的运行和进程模型非常重要。\n\n下一章涵盖页缓存，这是一种用于满足所有页\
  \ I/O 的通用内存数据缓存，以及内核如何执行基于页的数据写回。\n\n# 16. 页缓存与页写回\n\nLinux 内核实现了一种名为*页缓存*（page\
  \ cache）的磁盘缓存。该缓存的目标是通过在物理内存中存储原本需要访问磁盘的数据，最大限度地减少磁盘 I/O。本章涉及页缓存以及页缓存的变化传回磁盘的过程，这被称为*页写回*（page\
  \ writeback）。\n\n两个因素的共同作用使得磁盘缓存成为任何现代操作系统的关键组件。首先，磁盘访问速度比内存访问慢几个数量级——毫秒对比纳秒。从内存而非磁盘访问数据要快得多，而从处理器的\
  \ L1 或 L2 缓存访问数据则更快。其次，被访问过一次的数据很有可能在不久的将来再次被访问。这种原则——即对特定数据的访问倾向于在时间上形成聚集——被称为*时间局部性*（temporal\
  \ locality），它确保了如果数据在第一次访问时被缓存，那么在不久的将来有很大概率命中缓存（访问缓存中的数据）。鉴于内存比磁盘快得多，加上使用过的数据可能被再次使用的这一事实，磁盘的内存缓存是一项巨大的性能胜利。\n\
  \n### 缓存方法\n\n页缓存由 RAM 中的物理页组成，其内容对应磁盘上的物理块。页缓存的大小是动态的；它可以增长到消耗任何空闲内存，并缩小以缓解内存压力。我们将被缓存的存储设备称为*备份存储*（backing\
  \ store），因为磁盘位于缓存之后，作为任何缓存数据的规范版本源。每当内核开始读取操作时（例如，当进程发出 `read()` 系统调用时），它首先检查所需数据是否在页缓存中。如果是，内核可以跳过磁盘直接从\
  \ RAM 读取数据。这被称为*缓存命中*（cache hit）。如果数据不在缓存中，称为*缓存未命中*（cache miss），内核必须调度块 I/O 操作从磁盘读取数据。从磁盘读取数据后，内核将数据填充到页缓存中，以便任何随后的读取都可以从缓存中进行。整个文件不需要被缓存；页缓存可以完整持有某些文件，同时对其他文件只存储一两页。缓存什么取决于访问了什么。\n\
  \n#### 写缓存\n\n这部分内容解释了数据如何通过读取操作进入页缓存，但当进程写入磁盘时（例如，通过 `write()` 系统调用）会发生什么？泛而言之，缓存可以实现三种不同策略之一。在第一种策略中，称为*不写*（no-write），缓存简单不缓存写入操作。针对存储在缓存中的数据的写入操作将直接写入磁盘，使缓存数据失效，并要求在任何随后的读取中再次从磁盘读取。缓存很少采用这种策略，因为这不仅没有缓存写入操作，还通过使缓存失效而让这些操作变得昂贵。\n\
  \n\n\n\n在第二种策略中，写操作会自动同时更新内存缓存和磁盘文件。这种方法被称为 `write-through cache`（直写缓存），因为写操作会立即\
  \ `through`（通过）缓存写入磁盘。这种方法的优点是能够保持缓存的 `coherent`（一致性——即与底层存储保持同步且有效），而无需对其进行 `invalidate`（失效）。它也非常简单。\n\
  \nLinux 采用的第三种策略被称为 `write-back`（回写）。在 `write-back cache` 中，进程直接在页缓存中执行写操作。底层存储不会被立即或直接更新。相反，页缓存中被写入的页面会被标记为\
  \ `dirty`（脏），并被添加到 `dirty list`（脏列表中）。定期地，`dirty list` 中的页面会通过名为 `writeback` 的过程写回磁盘，使磁盘上的副本与内存缓存保持一致。然后，这些页面会被标记为不再脏。“脏”这个词可能会引起混义，因为实际上“脏”的并不是页缓存中的数据（它们是最新的），而是磁盘上的数据（它们是过时的）。更好的术应该是\
  \ `unsynchronized`（未同步）。尽管如此，我们仍称缓存内容（而非无效的磁盘内容）为脏。回写策略通常被认为优于直写策略，因为通过延迟磁盘写入，可以将这些操作进行合并并在稍后的时间批量执行。其缺点是复杂性。\n\
  \n*某些书籍或操作系统将这种策略称为 copy-back 或 write-behind cache。这三个名称是同义词。Linux 和其他 Unix 系统使用名词“write-back”来指这种缓存策略，使用动词“writeback”来指将缓存数据写回底层存储的操作。本本书遵循这种用法。*\n\
  \n## 缓存淘汰 (Cache Eviction)\n\n缓存的最后环节是从缓存中移除数据的过程，其目的是为了为更相关的缓存条目留出空间，或者通过缩小缓存来为其他用途腾出更多\
  \ RAM。这个过程以及决定移除哪些内容的策略被称为 `cache eviction`（缓存淘汰）。Linux 的缓存淘汰通过选择 `clean`（洁的，非脏）页面并简单地将其替换为其他内容来实现。如果缓存中的洁页不足，内核会强制执行\
  \ `writeback` 以产生更多的洁页。困难之处在于决定淘汰 `what`（什么内容）。理想的淘汰策略会淘汰未来最可能不被使用的页面。当然，知道哪些页面最不可能被访问需要预测未来，这就是为什么这种充满希望的策略通常被称为\
  \ `clairvoyant algorithm`（先知算法）。这种策略是理想的，但无法实现。\n\n### 最久未使用 (Least Recently Used)\n\
  \n缓存淘汰策略尝试利用它们可以访问的信息来逼近 `clairvoyant algorithm`。其中最成功的算法之一（特别是针对通用页缓存）被称为 `least\
  \ recently used`（最久未使用），或 `LRU`。一种 `LRU` 淘汰策略需要跟踪每个页面被访问的时间（或至少按访问时间对页面列表排序），并淘汰具有旧时间戳（或位于排序列表开头）的页面。这种策略效果良好，因为缓存数据闲置的时间越长，它在不久将来被访问的可能性就越小。“最久未使用”是对“最可能使用”的一种极佳近似。然而，`LRU`\
  \ 策略的一个特定缺陷是，许多文件只被访问一次就再也没有被访问。将它们放在 `LRU` 列表的顶部并不是最优的。当然，和之前一样，内核无法得知一个文件只会被访问一次。但它确实知道该文件过去被访问了多少次。\n\
  \n### 双列表策略\n\n因此，Linux 实现了 `LRU` 的改进版本，称为 `two-list strategy`（双列表策略）。Linux 不再维护一个列表\
  \ `LRU list`，而是维护两个列表：`active list`（活跃列表）和 `inactive list`（非活跃列表）。活跃列表上的页面被认为是“热”的，不可被淘汰。非活跃列表上的页面可用于缓存淘汰。只有当页面\
  \ `while already residing`（已经在）非活跃列表中被访问时，才会被放入活跃列表。两个列表都以伪 LRU 的方式维护：像队列一样，项被添加到尾部并从头部移除。列表保持平衡：如果活跃列表变得远大于非活跃列表，则活跃列表头部的项会被移回非活跃列表，使其可以被淘汰。`two-list\
  \ strategy` 解决了经典 `LRU` 中“仅使用一次”的缺陷，并且使得简单的伪 LRU 语义也能良好运行。这种双列表方法也被称为 `LRU/2`；它可以推广到\
  \ n 个列表，称为 `LRU/n`。\n\n我们现在知道了页缓存是如何填充的（通过读和写）、在面对写操作时是如何同步的（通过 `writeback`）、以及旧数据是如何被淘汰为新数据让路的（通过\
  \ `two-list strategy`）。现在让我们考虑一个现实场景，看看页缓存如何使系统受益。假设你正在处理一个大型软件项目——也许是 Linux 内核——并打开了许多文件。当你打开并读取源码时，文件被存储在页缓存中。由于数据被缓存了，在文件之间跳转是瞬间完成的。当你编辑文件时，保存似乎也是瞬间完成的，因为写入只需要进入内存而不需要磁盘。当你编译项目时，缓存的文件使得编译能够以更少的磁盘访问进行，从而速度快得多。如果整个源码树太大到无法放入内存，则必须淘汰其中的部分内容——得益于\
  \ `two-list strategy`，任何被淘汰的文件将位于非活跃列表。稍后，希望在你没有编译时，内核将执行 writeback 并更新源文件的磁盘副本。这种缓存导致了系统性能的提升。\n\
  \n### Linux 页缓存 (The Linux Page Cache)\n\n页缓存顾其实名，是 RAM 中的页缓存。页面源于对普通文件系统文件、块设备文件和内存映射文件的读写。通过这种方式，页缓存包含了被访问文件的块。在页\
  \ I/O 操作（如 `read()`）期间，内核会检查数据是否位于页缓存中。如果数据在页缓存中，内核可以快速从内存返回请求的页面，而不是从较慢的磁盘读取数据。在本章的其余部分中，我们将探索维护\
  \ Linux 页缓存的数据结构和内核机制。\n\n*正如你在第 13 章“虚拟文件系统”中所看到的，执行实际页/O 操作的不是 `read()` 和 `write()`\
  \ 系统调用，而是由 `file->f_op->read()` 和 `file->f_op->write()` 指定的文件特定方法。*\n\n#### `address_space`\
  \ 对象\n\n页缓存中的一个页面可能由多个不连续的物理磁盘块组成。由于构成每个页的块是不连续的，检查页缓存以查看某些数据是否已缓存变得困难。因此，无法仅使用设备名称和块号来索引页缓存中的数据，而这本应是最简单的解决方案。\n\
  \n*例如，在 x86 架构上，物理页的大小为 4KB，而许多文件系统上的磁盘块可能小至 512 字节。因此，8 个块可以放入单个页中。这些块不需要连续的，因为文件可能分布在整个磁盘上。*\n\
  \n\n\n\n\n此外，Linux 页缓存（page cache）在可缓存页类型上非常通用。事实上，System V Release 4 中引入的原始页缓存只缓存文件系统数据。因此，SVR4\
  \ 页缓存使用等同于 inode 对象的结构，即 `struct vnode` 来管理页缓存。而 Linux 页缓存旨在缓存*任何*基于页的对象，这包含了许多形式的文件和内存映射。\n\
  \n虽然 Linux 页缓存可以通过扩展 `inode` 结构（已在第 13 章“虚拟文件系统”中讨论过）来支持页 I/O 操作，但这种选择会将页缓存限制在文件中。为了维持一个通用的页缓存——即不绑定于物理文件或\
  \ `inode` 结构——Linux 页缓存使用了一个新对象来管理缓存条目和页 I/O 操作。该对象就是 `address_space` 结构。可以将 `address_space`\
  \ 视为在第 15 章“进程地址空间”中引入的虚拟 `vm_area_struct` 的物理对应物。虽然一个文件可能由 10 个 `vm_area_struct`\
  \ 结构表示（例如，如果有五个进程各 `mmap()` 两次），但该文件只有一个 `address_space` 结构——就像文件可以有很多虚拟地址但在物理内存中只存在一次一样。像\
  \ Linux 内核中许多部分一样，`address_space` 的命名并不准确。也许更好的名字是 `page_cache_entity` 或 `physical_pages_of_a_file`。\n\
  \n`address_space` 结构定义在 `<linux/fs.h>` 中：\n\n![image](img/p0327-01.jpg)\n\n`i_mmap`\
  \ 字段是该地址空间中所有共享和私有映射的优先级搜索树（priority search tree）。优先级搜索树是堆（heaps）和基树（radix trees）的巧妙结合.^(4)\
  \ 回想之前，虽然缓存的文件关联一个 `address_space` 结构，但它可以拥有多个 `vm_area_struct` 结构——从物理页到多个虚拟页的一对多映射。`i_mmap`\
  \ 字段允许内核高效地找到与此缓存文件相关的映射。\n\n^(4) *内核实现基于 Edward M. McCreight 在 SIAM Journal of\
  \ Computing（第 14 卷第 2 期，第 257–276 页，1985 年 5 月）提出的基优先级搜索树。*\n\n地址空间中总共有 `nrpages`\
  \ 个页。\n\n`address_space` 与某些内核对象关联。通常，这是一个 inode。如果是这样，`host` 字段指向关联的 inode。如果关联对象不是\
  \ inode，则 `host` 字段为 `NULL`——例如，如果 `address_space` 与交换器（swapper）关联。\n\n### `address_space`\
  \ 操作\n\n`a_ops` 字段指向地址空间操作表，方式与 VFS 对象及其操作表相同。操作表由 `struct address_space_operations`\
  \ 表示，也定义在 `<linux/fs.h>` 中：\n\n![image](img/p0328-01.jpg)\n\n这些函数指针指向为此缓存对象实现页 I/O\
  \ 的函数。每个后端存储都通过其自己的 `address_space_operations` 描述其如何与页缓存交互。例如，ext3 文件系统在 `fs/ext3/inode.c`\
  \ 中定义了它的操作。因此，这些是管理页缓存的函数，包括最常见的：将页读入缓存以及更新缓存中的数据。因此，`readpage()` 和 `writepage()`\
  \ 方法最重要的。让我们来看看每个操作涉及步骤，从页读操作开始。首先，Linux 内核尝试在页缓存中查找请求的数据。使用 `find_get_page()` 方法执行此检查；它被传递一个\
  \ `address_space` 和页偏移量。这些值在页缓存中搜索所需的数据：\n\n```\npage = find_get_page(mapping, index);\n\
  ```\n\n在这里，`mapping` 是给定的 `address_space`，`index` 是文件中所需的偏移量（以页为单位）。是的，将 `address_space`\
  \ 结构命名为 `mapping` 只是加剧了命名上的混乱。为了一致，我复制了内核的命名，但我并不认同。）如果缓存中不存在该页，`find_get_page()`\
  \ 返回 `NULL` 并分配一个新页添加到页缓存中：\n\n![image](img/p0329-01.jpg)\n\n最后，可以从磁盘读取请求的数据，添加到页缓存并返回给用户：\n\
  \n```\nerror = mapping->a_ops->readpage(file, page);\n```\n\n写操作略有不同。对于文件映射，每当页被修改时，VM\
  \ 直接调用\n\n```\nSetPageDirty(page);\n```\n\n内核稍后通过 `writepage()` 方法将页写入。特定文件的写操作更为复杂。`mm/filemap.c`\
  \ 中的通用写路径执行以下步骤：\n\n![image](img/p0329-02.jpg)\n\n首先，在页缓存中搜索所需的页。如果不在缓存中，则分配并添加条目。接下来，内核设置写请求并将数据从用户空间拷贝到内核缓冲区。最后，将数据写入磁盘。\n\
  \n由于之前的步骤是在页缓存期间执行的，内核在启动任何 I/O 之前必须检查页缓存中是否存在，这种检查必须很快。否则，搜索页缓存的开销可能会抵消缓存可能提供的任何好处。（至少如果缓存命中率很低——开销必须极其糟糕才能抵消从内存中检索数据的收益处。）\n\
  \n### 基树 (Radix Tree)\n\n由于内核在启动任何 I/O 之前必须检查页缓存中是否存在页，这种检查必须很快。\n\n正如你在上一节看到的，通过\
  \ `address_space` 对象加偏移量来搜索页缓存。每个 `address_space` 都有一个存储为 `page_tree` 的唯一基树。基树是一种二叉树。基树允许在仅给定文件偏移量的情况下快速搜索所需的页。页缓存搜索如\
  \ `find_get_page()` 调用 `radix_tree_lookup()`，它在给定的树上对给定对象进行搜索。\n\n核心基树代码以通用形式存在于\
  \ `lib/radix-tree.c` 中。基树的用户需要包含 `<linux/radix-tree.h>`。\n\n### 旧的页哈希表 (Page Hash\
  \ Table)\n\n在 2.6 内核之前，页缓存不是通过基树搜索的。相反，对系统中的所有页维护了一个全局哈希。哈希返回一个哈希到给定值的双向链表条目列表。如果所需的页在缓存中，列表中的其中一个项就是对应的页。否则，该页不在页缓存中，哈希函数返回\
  \ `NULL`。\n\n全局哈希有四个主要问题：\n\n-   单一全局锁保护哈希。即使在中等规模的机器上，锁竞争也非常高，性能因此受到损害。\n-   哈希表比需要的大，因为它包含了页缓存中的所有页，而只有与当前文件相关的页是有相关的。\n\
  -   哈希查找失败时（即给定的页不在页缓存中）的性能比预期慢，特别是因为需要遍历从给定哈希值的链表。\n-   哈希消耗的内存比其他可能的解决方案多。\n\n\
  2.6 引入基于基树的页缓存解决了这些问题。\n\n### 缓冲区缓存 (Buffer Cache)\n\n\n\n\n单个磁盘块通过块 I/O 缓冲区与页缓存（page\
  \ cache）关联。回想第 14 章“块 I/O 层”，缓冲区（buffer）是单个物理磁盘块在内存中的表示。缓冲区充当描述符，将内存中的页映射到磁盘块；因此，页缓存通过缓存磁盘块以及推迟块\
  \ I/O 操作，也减少了块 I/O 操作期间的磁盘访问。这种缓存通常被称为 `buffer cache`（缓冲区缓存），尽管从从其实现方式上来说，它并不是一个独立的缓存，而是页缓存的一部分。\n\
  \n块 I/O 操作一次处理一个磁盘块。一种常见的块 I/O 操作是读写 inode。内核提供了 `bread()` 函数来执行从磁盘读取单个块的低级读取。通过缓冲区，磁盘块被映射到关联的内存页，并缓存在页缓存中。\n\
  \n缓冲区缓存和页缓存并非总是统一的；这种统一是 2.4 版本 Linux 内核的一项重大特性。在更早的内核中，有两个独立的磁盘缓存：页缓存和缓冲区缓存。前者缓存页，后者缓存缓冲区。这两个缓存并没有统一：一个磁盘块可能同时存在两个缓存中。这导致了同步两个缓存副本的徒劳工作，以及由于复制缓存项而浪费的内存。今天，我们只有一个磁盘缓存：页缓存。然而，内核仍然需要使用缓冲区在内存中表示磁盘块。方便的是，缓冲区描述了块到页的映射，而该页位于页缓存中。\n\
  \n### 刷新线程 (The Flusher Threads)\n\n写操作在页缓存中是延迟的。当页缓存中的数据比底层存储（backing store）上的数据新时，我们称这些数据为\
  \ `dirty`（脏）。在内存中积累的脏页最终需要写回磁盘。脏页写回发生在三种情况：\n\n- 当空闲内存缩小到指定的阈值以下时，内核会将脏数据写回磁盘以释放内存，因为只有干净的（非脏）内存可以被驱逐。当内存洁净时，内核可以从缓存中驱逐数据并缩小缓存，从而释放出更多内存。\n\
  - 当脏数据过期超过特定阈值时，会将足够旧的数据写回磁盘，以确保脏数据不会无限处于脏状态。\n- 当用户进程调用 `sync()` 和 `fsync()` 系统调用时，内核会按需执行写回。\n\
  \n这三项任务的目标相当不同。事实上，在旧的内核中，是由两个独立的内核线程执行这些工作的（见下节）。然而在 2.6 中，一组内核线程^(5) `flusher\
  \ threads` 执行了所有三项任务。\n\n^(5) “gang”一词在计算机科学中通常指可以并行操作的一组事物。\n\n首先，当系统空闲内存缩小到指定水平以下时，刷新线程需要将脏数据刷回磁盘。这种后台写回的目标是在物理内存不足时，找回脏页占用的内存。该过程开始的内存水平由\
  \ `dirty_background_ratio` sysctl 配置。当空闲内存低于此阈值时，内核调用 `wakeup_flusher_threads()`\
  \ 唤醒一个或多个刷新线程，并让它们运行 `bdi_writeback_all()` 函数以开始写回脏页。该函数接参数是尝试写回的页数。该函数继续写出数据，直到满足两个条件：\n\
  \n- 已指定的最小页数已写出。\n- 空闲内存量高于 `dirty_background_ratio` 阈值。\n\n这些条件确保了刷新线程尽其职责来缓解低内存状况。只有当刷新线程写回了所有脏页且已无事可做时，写回才会在这些条件满足之前停止。\n\
  \n为了第二个目标，刷新线程会定期唤醒（与低内存状况无关）并写出旧的脏页。这样做是为了确保没有脏页无限留在内存中。在系统故障期间，由于内存是易易失的，内存中未写入磁盘的脏页将会丢失。因此，定期将页缓存与磁盘同步是非常重要的。在系统启动时，会初始化一个定时器来唤醒刷新线程并使其运行\
  \ `wb_writeback()` 函数。该函数随后写回所有修改于 `dirty_expire_interval` 毫秒之前的数据。然后，定时器被重新初始化为在\
  \ `dirty_writeback_interval` 毫秒后再次过期。通过这种方式，刷新线程定期唤醒并向磁盘写入所有超过指定限制的脏页。\n\n系统管理员可以在\
  \ `/proc/sys/vm` 或通过 sysctl 设置这些值。表 16.1 列出了这些变量。\n\n表 16.1 页写回设置\n\n![image](img/t0332-01.jpg)\n\
  \n刷新代码存在于 `mm/page-writeback.c` 和 `mm/backing-dev.c` 中，写回机制存在于 `fs/fs-writeback.c`\
  \ 中。\n\n### 笔记本模式 (Laptop Mode)\n\n`laptop mode`是一种特殊的页写回策略，旨在通过减少硬盘活动并允许硬盘保持旋转停止状态来优化电池寿命。可以通过\
  \ `/proc/sys/vm/laptop_mode` 进行配置。默认情况下，此文件包含 0，禁用笔记本模式。向此文件写入 1 可启用笔记本模式。\n\n笔记本模式对页写回行为做了一个改变。除了在脏页过旧时执行写回外，刷新线程还会利用任何其他物理磁盘\
  \ I/O，将所有脏缓冲区刷入磁盘。这种方式，页写回利用了磁盘刚刚旋转启动的机会，确保以后不会导致磁盘再次旋转。\n\n当 `dirty_expire_interval`\
  \ 和 `dirty_writeback_interval` 设置为较大值（例如 10 分钟）时，这种行为改变最有意义。由于写回被如此延迟，磁盘旋转频率较低，当它旋转时，笔记本模式确保了该机会得到充分利用。由于关闭硬盘驱动器是节电的重要来源，笔记本模式可以极大提高笔记本电脑的电池持续时间。缺点是系统崩溃或其他故障可能会丢失大量数据。\n\
  \n许多 Linux 发行版在切换电池时自动启用或禁用笔记本模式，并修改其他写回调优参数。这使得机器在使用电池供电时受益于笔记本模式，并在接入交流电电源后自动恢复到正常的页写回行为。\n\
  \n### 历史：bdflush, kupdated 和 pdflush\n\n在 2.6 内核之前，刷新线程的任务是由另外两个内核线程 `bdflush` 和\
  \ `kupdated` 完成的。\n\n`bdflush` 内核线程在可用内存不足时执行脏页的后台写回。它维护着一组类似于刷新线程的阈值，每当空内存低于这些阈值时，都会通过\
  \ `wakeup_bdflush()` 唤醒它。\n\n两个主要区别区分了 bdflush 和当前的刷新线程。第一点区别将在下一节讨论，即始终只有一个 `bdflush`\
  \ 守护进程，而刷新线程的数量是磁盘旋转数量的函数。第二点区别是 `bdflush` 是基于缓冲区的；它写回脏缓冲区。相反，刷新线程是基于页的；它们写回整个页。当然，页可以对应缓冲区，但实际的\
  \ I/O 单位是整页而不是单个缓冲区。这样做是有益的，因为管理页比管理缓冲区更容易，因为页是一个更通用、更常见的单位。\n\n\n\n由于 `bdflush`\
  \ 只在内存低或缓冲区数量过大时才刷新缓冲区，因此引入了 `kupdated` 线程来定期写回脏页。它的作用与 `wb_writeback()` 函数相同。\n\
  \n在 2.6 内核中，`bdflush` 和 `kupdated` 被 `pdflush` 线程所取代。`pdflush` 是 `page dirty flush`（页脏刷新）的缩写（又一个令人困惑的名字），其执行方式与如今的刷新线程（flusher\
  \ threads）相似。主要区别在于 `pdflush` 线程的数量是动态的，默认在 2 到 8 个之间，取决于系统的 I/O 负载。`pdflush` 线程不与任何特定磁盘关联，而是对系统中所有磁盘都是全局的。这使得实现非常简单。缺点是\
  \ `pdflush` 容易在拥塞的磁盘上遇到麻烦，而现代硬件很容易导致拥塞。转向每磁器（per-spindle）刷新可以使 I/O 同步执行，从而简化拥塞逻辑并提高性能。在\
  \ 2.6.32 内核中，刷新线程取代了 `pdflush` 线程。每磁器刷新是主要的区别；本节的其余部分也适用于 `pdflush`，因此适用于 2.6 内核。\n\
  \n### 使用多线程避免拥塞\n\n`bdflush` 方案的主要缺陷之一是 `bdflush` 仅包含一个线程。这导致在深度页写回期间可能会发生拥塞，单个\
  \ `bdflush` 线程会阻塞在一个拥塞的设备队列上（等待提交到磁盘的 I/O 请求列表），而其他设备队列则处于空闲状态。如果系统有多个磁盘和相应的处理能力，内核应该保持每个磁盘都忙碌。遗憾的是，即使有大量数据需要写回，`bdflush`\
  \ 也可能卡在处理单个队列上，无法让所有磁盘保持饱和状态。发生这种情况是因为磁盘的吞吐量是有限的——遗憾的是，而且相对较小。如果只有一个线程在执行页写回，由于磁盘吞吐量是如此限制性的因素，该线程很容易花费很长时间等待单个磁盘。为了缓解这一点，内核需要对页写回进行多线程处理。这样，没有任何一个设备队列会成为瓶颈。\n\
  \n2.6 内核通过允许多个刷新线程存在来解决这个问题。每个线程独立地将脏页刷新到磁盘，允许不同的刷新线程专注于不同的设备队列。使用 `pdflush` 线程，线程数量是动态的，每个线程都试图忙碌地从每个超级块的脏列表中获取数据并将其写回磁盘。`pdflush`\
  \ 方法防止了单个忙碌的磁盘饿死其他磁盘。这都很好，但如果每个 `pdflush` 线程都在写入同一个拥塞队列时挂起了了呢？在这种情况下，多个 `pdflush`\
  \ 线程的性能并不会比单个线程有所。然而，消耗的内存将显著增加。为了减轻这种影响，`pdflush` 线程采用了拥塞规避机制：它们积极尝试写回队列未拥塞的页。结果是\
  \ `pdflush` 线程分散了工作，并避免仅仅猛击同一个忙碌的设备。\n\n这种方法效果相当好，但拥塞规避并非完美。在现代系统中，拥塞很容易引起，因为 I/O\
  \ 总线技术的改进速度比计算机的其他部分慢——处理器根据摩尔定律不断变快，但硬盘只比二十年前快了一点点。此外，除了 `pdflush` 之外，I/O 系统没有其他部分采用拥塞规避。因此，在某些情况下，`pdflush`\
  \ 避免在特定磁盘上写回的时间比预期的要得多。在自 2.6.32 起的现有刷新模型中，线程与块设备关联，因此每个线程从其对应的块设备脏列表中获取数据并写回其磁盘。因此，写回是同步的，而且由于每个磁盘有一个线程，它们不需要采用复杂的拥塞规避。这种方法提高了公平性并降低了饥饿风险。\n\
  \n由于页写回的改进（从引入 `pdflush` 开始到现在的刷新线程），2.6 内核可以比任何早期内核保持更多的磁盘饱和。在面对大量活动时，刷新线程可以保持多个磁盘的高吞吐量。\n\
  \n### 结论\n\n本章探讨了 Linux 的页缓存和页写回。我们看到内核通过页缓存执行所有页 I/O，以及页缓存如何通过在内存中存储数据来减少磁盘 I/O，显著提高系统性能。我们讨论了如何通过名为写回缓存（write-back\
  \ caching）的过程在页缓存中维持写入，该过程保持内存中的页为“脏”，并延迟将数据写回磁盘。内核线程的刷新“帮派”处理了这种最终的页写回。\n\n在过去的几个章节中，我们对内存和文件系统管理建立了坚实的理解。现在让我们转向设备驱动和模块主题，看看\
  \ Linux 内核如何为内核代码的运行时插入和移除模块化且动态的基础。\n\n## 17. 设备与模块\n\n在本章中，我们讨论了与设备驱动和设备管理相关的四个内核组件：\n\
  \n- **设备类型（Device types）——** 所有 Unix 系统中使用的分类，用于统一通用设备的行为\n- **模块（Modules）——** Linux\
  \ 内核按需加载和卸载对象代码的机制\n- **内核对象（Kernel objects）——** 支持为内核数据结构添加简单的面向对象行为和父子关系\n- **Sysfs——**\
  \ 系统设备树的文件系统表示\n\n### 设备类型\n\n在 Linux 中，与所有 Unix 系统一样，设备被归类为三类型之一：\n\n- 块设备\n- 字符设备\n\
  - 网络设备\n\n块设备（缩写为 `blkdevs`）通过称为 `blocks`（块）的设备指定分块进行寻址，并通常支持寻址（`seeking`），即数据的随机访问。块设备的示例包括硬盘、蓝光光片和闪存等内存设备。块设备通过名为\
  \ `block device node`（块设备节点）的特殊文件访问，并通常挂载为文件系统。我们在第 13 章“虚拟文件系统”中讨论文件系统，在第 14 章“块\
  \ I/O 层”中讨论块设备。字符设备（缩写为 `cdevs`）通常不可寻址，仅作为流提供数据，通常是字符（字节）。字符设备的示例包括键盘、鼠标、打印机以及大多数伪设备。字符设备通过名为\
  \ `character device node`（字符设备节点）的特殊文件访问。与块设备不同，应用程序直接通过其设备节点与字符设备交互。\n\n网络设备以最常见的网络设备类型命名为以太网设备（Ethernet\
  \ devices），通过物理适配器（如笔记本电脑的 802.11 卡）和特定协议（如 IP）访问网络（如互联网）。由于打破了 Unix “一切皆文件”的设计原则，网络设备不是通过设备节点访问，而是通过名为\
  \ `socket API` 的特殊接口访问。\n\nLinux 还提供了少量其他设备类型，但它们专门用于单一任务且并不常见。一个例外是杂项设备（miscellaneous\
  \ devices，通常缩写为 `miscdevs`），它们实际上是字符设备的简化形式。杂项设备允许设备程序作者轻松地表示简单设备，用功能换取通用基础设施。\n\
  \n\n\n\n并非所有设备驱动都代表物理设备。某些设备驱动是 `virtual`（虚拟的），提供对内核功能的访问。我们将这些称为 `pseudo devices`（伪设备）；最常见的包括\
  \ `kernel random number generator`（通过 `/dev/random` 和 `/dev/urandom` 访问）、`null device`（通过\
  \ `/dev/null` 访问）、`zero device`（通过 `/dev/zero` 访问）、`full device`（通过 `/dev/full`\
  \ 访问）以及 `memory device`（通过 `/dev/mem` 访问）。然而，大多数设备驱动代表物理硬件。\n\n## 模块\n\n尽管从“单内核”的角度来说整个内核运行在单一地址空间内，但\
  \ Linux 内核是模块化的，支持在运行时动态插入和移除代码。相关的子程序、数据以及入口点和退出点被组合在一个二进制镜像文件中，这种可加载的内核对象被称为 `module`。对模块的支持允许系统仅保留极少的基础内核镜像，并通过可加载的独立对象提供可选的功能和驱动程序。模块还允许内核代码的移除和重新加载，便于调试，并允许根据新设备的热插拔按需加载新驱动程序。\n\
  \n本章将介绍内核模块背后的原理，以及你如何编写自己的模块。\n\n### Hello, World!\n\n与内核核心子系统的开发（这是我们目前为止讨论的大部分内容）不同，模块开发更像编写一个新应用程序，至少在模块具有入口点、退出点且存在于独立文件中这一点是如此。\n\
  \n这可能很陈词滥调，但如果有机会写一个 `Hello, World!` 却不利用这个机会，将是一种遗憾。这是一个 `Hello, World!` 内核模块：\n\
  \n![image](img/p0338-01.jpg)\n\n这是你能找到的最简单的内核模块了。`hello_init()` 函数通过 `module_init()`\
  \ 注册为该模块的入口点。内核在加载模块时会调用 `hello_init()`。对 `module_init()` 的调用实际上并不是函数调用，而是一个宏，它将唯一的参数赋值为该模块的初始化函数。所有的\
  \ `init` 函数都必须具有以下形式：\n\n```c\nint my_init(void);\n```\n\n由于 `init` 函数通常不被外部代码直接调用，因此你不需要将函数导出到文件作用域之外，可以将其标记为\
  \ `static`。\n\n`init` 函数返回一个 `int`。如果初始化（或你的 init 函数执行的操作）成功，该函数必须返回零。如果失败，函数必须撤销任何初始化并返回非零值。\n\
  \n此 init 函数仅仅打印一条简单的消息并返回零。在实际的模块中，init 函数负责注册资源、初始化硬件、分配数据结构等。如果此文件被静态编译到内核镜像中，该\
  \ init 函数将存储在内核镜像中，并在内核启动时运行。\n\n`module_exit()` 函数注册模块的退出点。在这个示例中，我们注册了函数 `hello_exit()`。当模块从内存中移除时，内核会调用退出点。退出函数在返回之前可能会释放资源、关闭并重置硬件并执行其他清理工作。简单来说，退出函数负责撤销\
  \ `init` 函数和模块生命周期所做的任何工作——本质上是为模块清理现场。退出函数返回后，模块被卸载。\n\n退出函数必须具有以下形式：\n\n```c\n\
  void my_exit(void);\n```\n\n与 `init` 函数一样，你可能也将其标记为 `static`。\n\n如果此文件被编译到静态内核镜像中，退出函数将*不会*被包含，而且它*永远不会*被调用，因为如果它不是模块，代码永远无法从内存中移除。\n\
  \n`MODULE_LICENSE()` 宏指定了该文件的版权许可。向内存中加载非 GPL 模块会导致内核中设置受污染（tainted）标记。版权许可有两个用途：首先，它是出于信息目的；当\
  \ oops 错误设置了受污染标记时，许多内核开发者对错误报告的信任会降低，因为他们假设内核中加载了仅二进制的模块（即他们无法调试的模块）。其次，非 GPL 模块不能调用\
  \ GPL 仅限符号。我们将在本章稍后的“导出的符号”节中介绍 GPL 仅限符号。\n\n最后，`MODULE_AUTHOR()` 和 `MODULE_DESCRIPTION()`\
  \ 宏分别提供模块作者和模块的简要描述。这些宏的值完全是信息性的。\n\n### 构建模块\n\n在 2.6 内核中，得益于新的 `kbuild` 构建系统，构建模块比之前的版本更容易了。构建模块的首要决策是决定模块源码存放在哪里。你可以将模块源码作为补丁或最终将你的代码合并到官方树中添加到内核源码中。或者，你可以在源码树之外维护并构建你的模块源码。\n\
  \n#### 位于源码树\n\n理想情况下，你的模块是 Linux 的官方部分，因此存在于内核源码树中。将你的工作引入内核起初可能需要更多工作，但这是首选路径，因为当你的代码进入\
  \ Linux 内核时，整个内核社区都可以帮助维护和调试它。\n\n当你决定将模块放在内核源码树中，下一步是决定模块位于树的*位置*。驱动程序存储在内核源码树根目录下\
  \ `drivers/` 目录的子目录下。在 `drivers/` 内部，类、类型和特定设备进一步组织了程序。例如，字符设备驱动位于 `drivers/char/`，块设备位于\
  \ `drivers/block/`，USB 设备位于 `drivers/usb/`。规则是灵活的，因为许多设备属于多个类别——例如，许多 USB 设备是字符设备，但它们位于\
  \ `drivers/usb/` 而不是 `drivers/char/`。尽管有这些复杂性，一旦你掌握了，这种组织是易理解且具有描述性的。\n\n假设你有一个字符设备并想将其存储在\
  \ `drivers/char/`。该目录下有许多 C 源文件和少量其他目录。只有一两个源文件的驱动程序可能直接将源文件放在此目录中。具有多个源文件或其他辅助数据的驱动程序可能会创建一个新的子目录。没有硬性规定。假设你想创建自己的子目录。进一步假设你的驱动程序用于一个带有计算机接口的鱼竿——Fish\
  \ Master XL 3000，因此你需要在 `drivers/char/` 内部创建一个 `fishing` 子目录。\n\n接下来，你需要在 `drivers/char/`\
  \ 中的 Makefile 中添加一行。因此，你编辑 `drivers/char/Makefile` 并添加：\n\n```makefile\nobj-m +=\
  \ fishing/\n```\n\n这会导致构建系统在每次编译模块时都进入 `fishing/` 子目录。更有可能是，你的驱动程序的编译取决于某个特定的配置选项；例如，可能是\
  \ `CONFIG_FISHING_POLE`（参见本章稍后的“管理配置选项”节了解如何添加新的配置选项）。在这种情况下，你应该添加行：\n\n```makefile\n\
  obj-$(CONFIG_FISHING_POLE) += fishing/\n```\n\n最后，在 `drivers/char/fishing/` 内部，你添加一个带有以下行的新\
  \ Makefile：\n\n```makefile\nobj-m += fishing.o\n```\n\n构建系统现在进入 `fishing/` 并从 `fishing.c`\
  \ 构建模块 `fishing.ko`。是的，令人困惑的是，你写的是 `.o` 扩展，但模块被编译为 `.ko`。和之前一样，更有可能是你的鱼竿驱动程序的编译取决于配置选项。所以你可能想写以下内容：\n\
  \n```makefile\nobj-$(CONFIG_FISHING_POLE) += fishing.o\n```\n\n\n\n\n有一天，你的钓鱼竿驱动程序可能会变得非常复杂——自动检测鱼线测试只是最新的“标配”功能！——以至于它增长到占据超过一个源文件。没问题，钓鱼者们！你只需让你的\
  \ Makefile 读取以下内容：\n\n```\nobj-$(CONFIG_FISHING_POLE) += fishing.o\nfishing-objs\
  \ := fishing-main.o fishing-line.o\n```\n\n现在，只要设置了 `CONFIG_FISHING_POLE`，`fishing-main.c`\
  \ 和 `fishing-line.c` 就会编译并链接到 `fishing.ko`。\n\n最后，你可能需要在构建过程中为你的文件向 C 编译器传递额外的编译标志。要这样做，只需在你的\
  \ Makefile 中添加如下行即可：\n\n```\nEXTRA_CFLAGS += -DTITANIUM_POLE\n```\n\n如果你选择将源文件放置在\
  \ `drivers/char/` 而不创建新的子目录，你只需将前面的行（即你放在 `drivers/char/fishing/Makefile` 中的内容）放入\
  \ `drivers/char/Makefile` 即可。\n\n要进行编译，请像通常一样运行内核构建过程。如果你的模块构建取决于某个配置选项（如 `CONFIG_FISHING_POLE`），请确保在开始之前该选项已启用。\n\
  \n## 在外部环境中生存\n\n如果你倾向于在内核源码树之外维护和构建你的模块，即过上“局外人”的生活，只需在你自己的源目录中创建一个包含以下单行内容的 Makefile\
  \ 即可：\n\n```\nobj-m := fishing.o\n```\n\n这会将 `fishing.c` 编译为 `fishing.ko`。如果你的源文件跨多个文件，两行足够了：\n\
  \n```\nobj-m := fishing.o\nfishing-objs := fishing-main.o fishing-line.o\n```\n\n\
  此示例将 `fishing-main.c` 和 `fishing-line.c` 编译为 `fishing.ko`。\n\n在外部生存的主要区别在于构建过程。因为你的模块位于内核树之外，你需要指示\
  \ `make` 如何找到内核源文件和基础 Makefile。这也很：\n\n```\nmake -C /kernel/source/location SUBDIRS=$PWD\
  \ modules\n```\n\n在此示例中，`/kernel/source/location` 是你配置的内核源码树的位置。请记住，你*不应该*将内核源码树的工作副本存储在\
  \ `/usr/src/linux` 中，而是存储在主目录下其他易于访问的地方。\n\n## 安装模块\n\n编译后的模块被安装到 `/lib/modules/version/kernel/`，其中\
  \ `kernel/` 下的每个目录对应于模块在内核源码树中的位置。例如，对于内核版本为 2.6.34，如果你将钓鱼竿模块直接放在 `drivers/char/`，那么编译后的模块将位于\
  \ `/lib/modules/2.6.34/kernel/drivers/char/fishing.ko`。\n\n使用以下构建命令将编译的模块安装到正确的位置：\n\
  \n```bash\nmake modules_install\n```\n\n这需要以 root 身份运行。\n\n## 生成模块依赖\n\nLinux 模块工具理解依赖关系。这意味着模块\
  \ `chum` 可以依赖于模块 `bait`，当加载 `chum` 模块时，模块加载器会自动加载 `bait` 模块。这种依赖信息必须被生成。大多数 Linux\
  \ 发行版会自动生成映射并在每次启动时保持更新。要构建模块依赖信息，只需以 root 身份运行\n\n```bash\ndepmod\n```\n\n要进行快速更新，仅重新构建比依赖信息新的模块信息，请以\
  \ root 身份运行\n\n```bash\ndepmod -A\n```\n\n模块依赖信息存储在文件 `/lib/modules/version/modules.dep`\
  \ 中。\n\n## 加载模块\n\n加载模块最简单的方法是通过 `insmod`。此实用工具非常基础。它只是简单请求内核加载你指定的模块。`insmod` 程序不执行任何依赖解析或高级错误检查。用法非常简单易懂。以\
  \ root 身份只需运行此命令：\n\n```bash\ninsmod module.ko\n```\n\n在这里，`module.ko` 是你想加载的模块的文件。要加载钓鱼竿模块，你将以\
  \ root 身份运行此命令：\n\n```bash\ninsmod fishing.ko\n```\n\n同样地，要移除模块，你使用 `rmmod` 实用工具。以\
  \ root 身份运行以下命令，其中 `module` 是已加载模块的：\n\n```bash\nrmmod module\n```\n\n例如，此命令移除了钓鱼竿模块：\n\
  \n```bash\nrmmod fishing\n```\n\n然而，这些实用工具并不智能。`modprobe` 工具提供了依赖解析、错误检查和报告、可配置的行为以及更高级的功能。强烈建议使用它。\n\
  \n要通过 `modprobe` 向内核插入模块，请以 root 身份运行：\n\n```\nmodprobe module [ module parameters\
  \ ]\n```\n\n在这里，`module` 是要加载的模块名称。任何后续参数都将被视为加载时传递给模块的参数。请参见“[模块参数]章节关于模块参数的讨论。\n\
  \n`modprobe` 命令不仅尝试加载请求的模块，还会加载它所依赖的任何模块。因此，它是加载内核模块的首选机制。\n\n`modprobe` 命令也可以用于从内核中移除模块。要移除模块，以\
  \ root 身份运行\n\n```bash\nmodprobe –r modules\n```\n\n在这里，`modules` 指定了要移除的一个或多个模块。与\
  \ `rmmod` 不同，如果给定模块依赖的任何模块未被使用，`modprobe` 也会移除这些模块。Linux 手页的第 8 节提供了关于其其他较少用选项的参考。\n\
  \n## 管理配置选项\n\n本章早前的部分查看了在设置了 `CONFIG_FISHING_POLE` 配置选项时才编译钓鱼竿模块。配置选项在之前的章节中也讨论过，但现在让我们来看如何实际添加新选项，继续钓鱼竿设备驱动示例。\n\
  \n得益于 2.6 内核中新的“kbuild”系统，添加新的配置选项非常简单。你只需要在负责内核源码树相关分支的 `Kconfig` 文件中添加条目。对于驱动，这通常是源码所在的目录。如果钓鱼竿驱动位于\
  \ `drivers/char/`，你将使用 `drivers/char/Kconfig`。\n\n如果你*创建*了一个新的子目录并希望新的 `Kconfig`\
  \ 文件位于那里，你需要从现有的 `Kconfig` 引入它。你通过向现有的 `Kconfig` 文件添加如下的一行来实现这一点：\n\n```\nsource\
  \ \"drivers/char/fishing/Kconfig\"\n```\n\n在此示例中，你将此行添加到 `drivers/char/Kconfig`。\n\
  \n`Kconfig` 中的条目很容易添加。我们的钓鱼竿模块看起来像这样：\n\n![image](img/p0344-01.jpg)\n\n第一行定义了该条目代表什么配置选项。注意，假设了\
  \ `CONFIG_` 前缀且*没有*写出来。\n\n第二行表示该选项是 `tristate`，这意味着它可以被编译进内核 (Y)、编译为模块 (M) 或完全不编译\
  \ (N)。要移除作为模块编译选项——例如，如果此选项代表的是功能而不是设备驱动程序——请使用 `bool` 指令代替 `tristate`。指令后的引号文本提供了该选项在各种配置工具中的名称。\n\
  \n第三行指定了该选项的默认值，即不编译 (`n`)。你也可以将默认值指定为内置内核 (`y`) 或编译为模块 (`m`)。对于设备驱动程序，默认通常是不编译\
  \ (`n`)。\n\n`help` 指令表示后续文本（按其缩进的形式呈现）是该条目的帮助文本。各种配置工具可以在请求时显示此文本。由于这些文本是为构建自己的内核的开发者准备的，可以是简洁且技术性的。终端用户通常不构建内核，如果他们这样做，他们也可以理解配置帮助。\n\
  \n还有其他选项。`depends` 指令指定了在设置此选项之前必须设置的选项。如果不满足依赖条件，该选项将被禁用。例如，如果你在 `Kconfig` 条目中添加以下指令，则在启用\
  \ `CONFIG_FISH_TANK` 选项之前，该设备驱动无法启用 (`y` 或 `m`)：\n\n```\ndepends on FISH_TANK\n\
  ```\n\n\n\n\n`select` 指令类似于 `depends`，不同之处在于当我们的选项被选中时，它会强制启用指定的选项。`select` 指令的使用频率不应高于\
  \ `depends`，因为它会自动启用其他配置选项。下行表示每当 `CONFIG_FISHING_POLE` 被启用时，就会启用 `CONFIG_BAIT`：\n\
  \n```\nselect BAIT\n```\n\n对于 `select` 和 `depends`，你都可以通过 `&&` 请求多个选项。对于 `depends`，你还可以通过在选项前加感叹号指定某个选项*不*被启用。例如\n\
  \n```\ndepends on EXAMPLE_DRIVERS && !NO_FISHING_ALLOWED\n```\n\n该行指定了驱动程序依赖于 `CONFIG_EXAMPLE_DRIVERS`\
  \ 被设置且 `CONFIG_NO_FISHING_ALLOWED` 未设置。\n\n`tristate` 和 `bool` 选项后面可以跟一个 `if` 指令，这使得整个选项取决于另一个配置选项。如果条件不满足，该配置选项不仅会被禁用，而且不会出现在配置工具中。例如，该指令指示配置系统仅在设置了\
  \ `CONFIG_OCEAN` 时才显示某个选项。在这里，只有在启用 `CONFIG_OCEAN` 时，`deep sea mode` 才会可用：\n\n```\n\
  bool \"Deep Sea Mode\" if OCEAN\n```\n\n`if` 指令也可以跟在 `default` 指令之后，仅在满足条件时强制执行默认值。\n\
  \n配置系统导出了多个元选项以帮助使配置更加简单。`CONFIG_EMBEDDED` 选项仅在用户指定想要查看设计用于禁用关键功能的选项（推测是为了节省嵌入式系统中宝贵的内存）时才启用。`CONFIG_BROKEN_ON_SMP`\
  \ 选项用于指定一个不是 SMP 安全的驱动程序。通常此选项不会被设置，从而强制用户显式承认该缺陷。当然，新驱动程序不应该使用此标记。`CONFIG_DEBUG_KERNEL`\
  \ 选项启用与调试相关的选项的选择。最后，`CONFIG_EXPERIMENTAL` 选项用于标记实验性或具有测试质量的选项。该选项默认为关闭，再次强制用户在启用你的驱动程序之前显式承认风险。\n\
  \n## 模块参数\n\nLinux 内核提供了一个简单的框架，允许驱动程序声明用户可以在启动时或加载模块时指定的参数，并将这些参数作为全局变量暴露在你的驱动程序中。这些模块参数也会出现在\
  \ sysfs 中（见本章后文）。因此，创建和管理可以以多种方便方式指定的模块参数是非常轻而易事的。\n\n定义模块参数通过宏 `module_param()`\
  \ 完成：\n\n```\nmodule_param(name, type, perm);\n```\n\n在这里，`name` 既是暴露给用户的参数名称，也是模块内部持有参数的变量名称。`type`\
  \ 参数持有参数的数据类型；它是 `byte`、`short`、`ushort`、`int`、`uint`、`long`、`ulong`、`charp`、`bool`\
  \ 或 `invbool` 。这些类型分别对应字节、短整数、无符号短整数、整数、无符号整数、长整数、无符号长整数、`char` 指针、布尔值以及与用户指定值反反的布尔值。`byte`\
  \ 类型存储在单个 `char` 中，布尔类型存储在 `int` 类型的变量中。其余的存储在对应的 C 原生类型中。最后，`perm` 参数指定 sysfs 中对应文件的权限。权限可以使用常用的八进制格式指定，例如\
  \ `0644`（所有者可读写，组可读，其他人可读），或通过对常用的 `S_Ifoo` 定义进行或运算来指定，例如 `S_IRUGO | S_IWUSR`（所有人可读；用户也可写）。值为零将完全禁用\
  \ sysfs 条目。\n\n该宏不会为你声明变量。你必须在在使用宏*之前*完成声明。因此，典型的用法可能如下\n\n![image](img/p0346-01.jpg)\n\
  \n这将位于你模块源文件的最外层作用域。换句话说，`allow_live_bait` 是该文件的全局变量。\n\n内部变量名称可以与外部参数不同。这通过 `module_param_named()`\
  \ 实现：\n\n```\nmodule_param_named(name, variable, type, perm);\n```\n\n在这里，`name`\
  \ 是外部可见的参数名，`variable` 是内部全局变量的名称。例如\n\n```\nstatic unsigned int max_test = DEFAULT_MAX_LINE_TEST;\n\
  module_param_named(maximum_line_test, max_test, int, 0);\n```\n\n通常情况下，你会使用 `charp`\
  \ 类型定义一个接收字符串的模块参数。内核将用户提供的字符串拷贝到内存中，并让你的变量指向该字符串。例如\n\n```\nstatic char *name;\n\
  module_param(name, charp, 0);\n```\n\n如果需要，也可以让内核将字符串直接拷贝到你提供的字符数组。这是通过 `module_param_string()`\
  \ 实现的：\n\n```\nmodule_param_string(name, string, len, perm);\n```\n\n在这里，`name`\
  \ 是外部参数名，`string` 是内部变量名，`len` 是由 `string` 指定的缓冲区的大小（或更小，但没什么意义），`perm` 是 sysfs\
  \ 权限（或为零以完全禁用 sysfs 条目）。例如\n\n```\nstatic char species[BUF_LEN];\nmodule_param_string(specifies,\
  \ species, BUF_LEN, 0);\n```\n\n你可以通过 `module_param_array()` 接受存储在 C 数组中的逗号分隔参数列表：\n\
  \n```\nmodule_param_array(name, type, nump, perm);\n```\n\n在这里，`name` 再次是外部和内部变量名，`type`\
  \ 是数据类型，`perm` 是 sysfs 权限。新参数 `nump` 是指向整数的指针，内核在其中存储到数组中的条目数量。注意，由 `name` 指向的数组必须静态分配。内核在编译时确定数组的大小并确保不会导致溢出。使用非常简单。例如\n\
  \n```\nstatic int fish[MAX_FISH];\nstatic int nr_fish;\nmodule_param_array(fish,\
  \ int, &nr_fish, 0444);\n```\n\n你可以通过 `module_param_array_named()` 让内部数组的名称与外部参数不同：\n\
  \n```\nmodule_param_array_named(name, array, type, nump, perm);\n```\n\n参数部分与其他宏相同。\n\
  \n最后，你可以通过 `MODULE_PARM_DESC()` 为你的参数注释：\n\n```\nstatic unsigned short size = 1;\n\
  module_param(size, ushort, 0644);\nMODULE_PARM_DESC(size, \"鱼竿的尺寸（英寸）。\");\n```\n\
  \n所有这些宏都需要包含 `<linux/module.h>`。\n\n## 导出符号\n\n当模块加载时，它们会被动态链接到内核中。与用户空间一样，动态链接的二进制文件只能调用*导出*的外部函数。在内核中，这通过特殊指令\
  \ `EXPORT_SYMBOL()` 和 `EXPORT_SYMBOL_GPL()` 实现。\n\n导出函数供模块使用。未导出的函数无法从模块调用。对于模块来说，链接和调用规则严格得多。核心代码可以调用内核中的任何非静态接口，因为所有核心源文件都链接在单一基础映像。当然，导出符号也必须是非静态的。导出内核符号被称为*导出内核接口*。\n\
  \n导出符号很容易。在函数声明之后，通常紧跟一个 `EXPORT_SYMBOL()`。例如\n\n![image](img/p0348-01.jpg)\n\n\
  假设 `get_pirate_beard_color()` 已经在可访问的头文件中声明，现在任何模块都可以访问它。\n\n某些开发者希望他们的接口仅供 GPL\
  \ 模块访问。内核链接器通过使用 `MODULE_LICENSE()` 指令来强制这种限制。如果你希望上述的函数仅供标记为 GPL 许可证的模块访问，请改用\n\
  \n```\nEXPORT_SYMBOL_GPL(get_pirate_beard_color);\n```\n\n\n\n\n如果你的代码可以作为模块配置，你必须确保在编译为模块时，它使用的所有接口都是导出的。否则，会导致链接错误（以及模块损坏）。\n\
  \n## 设备模型\n\n2.6 Linux 内核的一项重大新特性是增加了统一的 `device model`（设备模型）。设备模型为表示设备和描述它们在系统中的拓扑结构提供了单一机制。这种系统提供了若干处优势：\n\
  \n- 尽力减少代码重复\n- 提供通用设施（如引用计数）的机制\n- 枚举系统中所有设备、查看其状态并查看它们连接到哪个总线的能力\n- 生成系统整个设备结构的完整且有效树的能力，包括所有总线和互连\n\
  - 将设备与其驱动程序链接以及反之亦然的能力\n- 按类（如输入设备）对设备进行分类，而无需理解物理设备拓扑结构\n- 从叶子节点向根节点遍历设备树，按正确的顺序关闭设备\n\
  \n设备模型最初的动机是为了最后一点：提供一个准确的设备树以便于电源管理。为了在内核中实现设备级电源管理，你需要构建一个表示系统中设备拓扑结构的树：例如，什么驱动器连接到什么控制器，以及什么设备连接到什么总线。关机时，内核必须在关闭较高节点之前关闭树的较低（叶子）节点。例如，内核需要在关闭\
  \ USB 控制器之前关闭 USB 鼠标，并在关闭 PCI 总线之前关闭 USB 控制器。为了对整个系统准确且高效地执行此操作，内核需要设备树。\n\n###\
  \ Kobjects\n\n设备模型的核心是 `kobject`，`kernel object`（内核对象）的缩写，由 `struct kobject` 表示并定义在\
  \ `<linux/kobject.h>` 中。kobject 类似于 `C#` 或 `Java` 等面向对象语言中的 `Object` 类。它提供了基本设施，如引用计数、名称和父指针，能够创建层次结构结构。\n\
  \n直接进入主题：\n\n![image](img/p0349-01.jpg)\n\n`name` 指针指向此 kobject 的名称。\n\n`parent`\
  \ 指针指向该 kobject 的父节点。通过这种方式，kobjects 在内核中构建了对象层次结构，并实现了多个对象之间关系的表达。正如你将看到的，这其实就是\
  \ `sysfs` 的全部：它是内核内部 kobject 对象层次结构在用户空间的文件系统中的表示。\n\n`sd` 指针指向 `sysfs_dirent` 结构，该结构在\
  \ sysfs 中表示此 kobject。该结构内部有一个 `inode` 结构，代表 sysfs 文件系统中的 kobject。\n\n`kref` 结构提供了引用计数。`ktype`\
  \ 和 `kset` 结构描述并分组 kobjects。我们将在接两个子节介绍它们。\n\nKobjects 通常嵌入在其他结构中，其本身通常并不有趣。相反，更重要的结构（例如定义在\
  \ `<linux/cdev.h>` 中的 `struct cdev`）有一个 `kobj` 成员：\n\n![image](img/p0350-01.jpg)\n\
  \n当 kobjects 被嵌入到其他结构内部时，这些结构就获得了 kobject 提供的标准化函数。最重要的是，结构嵌入的 kobject 现在允许结构成为对象层次结构的一部分。例如，`cdev`\
  \ 结构可以通过父指针 `cdev->kobj.parent` 和列表 `cdev->kobj.entry` 在对象层次结构中呈现。\n\n### Ktypes\n\
  \nkobjects 与特定类型相关，称为 `ktype`，`kernel object type`（内核对象类型）的缩写。Ktypes 由 `struct kobj_type`\
  \ 表示并定义在 `<linux/kobject.h>` 中：\n\n![image](img/p0350-02.jpg)\n\nKtypes 的简单工作是描述一组\
  \ kobjects 的默认行为。与其让每个 kobject 定义自己的行为，不如将行为存储在 ktype 中，相同“类型”的 kobjects 指向同一个 `ktype`\
  \ 结构，从而共享相同的行为。\n\n`release` 指针指向 kobject 引用计数归零时调用的析构函数。该函数负责释放与此 kobject 关联的内存并进行清理。\n\
  \n`sysfs_ops` 变量指向 `sysfs_ops` 结构。该结构描述了 sysfs 文件在读取和写入时的行为。它将在“向 sysfs 中添加文件”节中进行更详细的介绍。\n\
  \n最后，`default_attrs` 指向 `attribute` 结构数组。这些结构定义了与此 kobject 关联的默认属性。属性代表与给定对象相关的属性。如果此\
  \ kobject 被导出到 sysfs，则属性将作为文件导出。数组中的最后一个元素必须是 `NULL`。\n\n### Ksets\n\n`Ksets`，`kernel\
  \ object sets`（内核对象集）的缩写，是 kobjects 的聚合集合。Ksets 作为一组内核对象的基容器类工作，将相关的 kobjects（例如“所有块设备”）收集在同一个地方。Ksets\
  \ 听起来与 ktypes 相似，并引发问题：“为什么要分两个？” Ksets 将相关的内核对象组合在一起，而 ktypes 允许内核对象（无论功能是否相关）共享公共操作。这种区分是为了允许具有相同\
  \ ktypes 的 kobjects 被分组到不同的 ksets 中。也就是说，在 Linux 内核中，只有少数 ktypes，但有很多 ksets。\n\n\
  `kset` 指针指向 kobject 关联的 kset。ksets 由 `kset` 结构表示，该结构在 `<linux/kobject.h>` 中声明：\n\
  \n![image](img/p0351-01.jpg)\n\n在该结构中，`list` 是此 kset 中所有 kobjects 的链表，`list_lock`\
  \ 是保护列表中该条目的目的自旋锁（关于自旋锁的讨论请参阅 第 10 章“内核同步方法”），`kobj` 是代表该集合基类的 kobject，`uevent_ops`\
  \ 指向一个描述此 kset 中 kobjects 热插拔行为的结构。`Uevent`，`user events`（用户事件）的缩写，是一种与用户空间通信设备热插拔和热移除信息的机制。\n\
  \n### Kobjects、Ktypes 和 Ksets 的相互关系\n\n为止讨论的几个结构之所以令人困，并不是因为它们的数量（只有三个）或复杂性（它们都相当简单），而是因为它们都是相互关联的。在\
  \ kobject 的世界，很难在不讨论其他结构的情况下讨论其中一个。然而，在了每个结构的基础之后，你可以对它们的关系建立坚定的理解。\n\n关键对象是 kobject，由\
  \ `struct kobject` 表示。kobject 为内核数据结构引入了基本对象属性——如引用计数、父子关系和命名。kobjects 本身并不有用。相反，kobjects\
  \ 通常嵌入在其他数据结构中，使得包含它们的结构具有 kobject 的特性。kobjects 与特定的 ktype 关联，该 ktype 由 `struct\
  \ kobj_type` 表示并由 kobject 内部的 `ktype` 变量指向。Ktypes 定义了相关 kobjects 的某些默认属性：销行为、sysfs\
  \ 行为和默认属性。`ktype` 结构的命名并不理想；不要将 ktypes 看作一种分组，而要看作一组共享操作。\n\n\n\n\n\n随后 `kobjects`\
  \ 被分为若干集合，称为 `ksets`，由 `struct kset` 表示。`ksets` 提供了两个功能：首先，它们嵌入的 `kobject` 作为了一组\
  \ `kobjects` 的基类；其次，`ksets` 聚合了相关的 `kobjects`。在 `sysfs` 中，`kobjects` 是文件系统中的独立目录。相关的目录——例如，某个目录的所有子目录——可能位于同一个\
  \ `kset` 中。\n\n图 17.1 展示了这些数据结构之间的关系。\n\n图 17.1. kobjects、ksets 和子系统之间的关系。\n\n![image](img/17fig01.jpg)\n\
  \n## 管理和操作 Kobjects\n\n在掌握了 `kobjects` 及其相关的基础原理后，现在是查看用于管理和操作 `kobjects` 的导出接口了。大多数时候，驱动程序编写者不需要直接处理\
  \ `kobjects`。相反，`kobjects` 被嵌入在某些特定类的结构中（如你之前看到的字符设备结构），并由相关的驱动子系统在“后台”进行管理。尽管如此，`kobjects`\
  \ 并不打算保持隐藏，它们可能会渗透到驱动代码中，或者你可能正在修改驱动子系统本身。\n\n使用 `kobject` 的第一步是声明并初始化它。`kobjects`\
  \ 通过函数 `kobject_init` 初始化，该函数声明在 `<linux/kobject.h>`：\n\n```c\nvoid kobject_init(struct\
  \ kobject *kobj, struct kobj_type *ktype);\n```\n\n该函数的第一个参数是要初始化的 `kobject`。在调用此函数之前，必须对\
  \ `kobject` 进行清零。这通常发生在嵌入 `kobject` 的较大函数的初始化过程中。如果没有，简单地调用一次 `memset()` 即可：\n\n\
  ```c\nmemset(kobj, 0, sizeof (*kobj));\n```\n\n在清零之后初始化 `parent` 和 `kset` 是安全的。例如：\n\
  \n```c\nstruct kobject *kobj;\n\nkobj = kmalloc(sizeof (*kobj), GFP_KERNEL);\n\n\
  if (!kobj)\n    return -ENOMEM;\n\nmemset(kobj, 0, sizeof (*kobj));\n\nkobj->kset\
  \ = my_kset;\n\nkobject_init(kobj, my_ktype);\n```\n\n这种多步操作由 `kobject_create()`\
  \ 自动处理，它返回一个新分配的 `kobject`：\n\n```c\nstruct kobject * kobject_create(void);\n```\n\
  \n用法非常简单：\n\n```c\nstruct kobject *kobj;\n\nkobj = kobject_create();\n\nif (!kobj)\n\
  \    return –ENOMEM;\n```\n\n大多数 `kobjects` 的使用应优先选择 `kobject_create()` 或相关的辅助函数，而不是直接操作结构。\n\
  \n## 引用计数\n\n`kobjects` 提供的功能之一是统一的引用计数系统。初始化后，`kobject` 的引用计数设置为一。只要引用计数不为零，对象就会继续存在于内存中，并被称为*固定*（pinned）。任何持有该对象引用的代码都会先增加引用计数。代码完成对对象的操作后，引用计数会递减。增加引用计数被称为*获取*（getting）对对象的引用，而减少引用计数被称为*释放*（putting）对对象的引用。\n\
  \n当引用计数达到零时，可以销毁对象并释放任何相关的内存。\n\n### 增加和减少引用计数\n\n增加引用计数通过 `kobject_get()` 完成，该函数声明在\
  \ `<linux/kobject.h>`：\n\n```c\nstruct kobject * kobject_get(struct kobject *kobj);\n\
  ```\n\n该函数返回指向 `kobject` 的指针，如果失败则返回 `NULL`。\n\n减少引用计数通过 `kobject_put()` 完成，该函数也声明在\
  \ `<linux/kobject.h>`：\n\n```c\nvoid kobject_put(struct kobject *kobj);\n```\n\n\
  如果提供的 `kobject` 的引用计数达到零，将调用 `kobject` 关联的 `ktype` 指向的 `release` 函数，释放任何相关的内存，对象不再有效。\n\
  \n### Krefs\n\n在内部，`kobject` 的引用计数是由 `kref` 结构提供的，它定义在 `<linux/kref.h>` 中：\n\n```c\n\
  struct kref {\n    atomic_t refcount;\n};\n```\n\n唯一的成员是一个用于持有引用计数的原子变量。使用结构仅仅是为了提供类型检查。在使用\
  \ `kref` 之前，必须通过 `kref_init()` 初始化它：\n\n```c\nvoid kref_init(struct kref *kref)\n\
  {\n    atomic_set(&kref->refcount, 1);\n}\n```\n\n如你所见，此函数只是将内部的 `atomic_t` 初始化为一。因此，`krefs`\
  \ 一经初始化就会被引用计数一固定；这与 `kobjects` 的行为相同。\n\n要获取对 `kref` 的引用，使用声明在 `<linux/kref.h>`\
  \ 中的 `kref_get()`：\n\n```c\nvoid kref_get(struct kref *kref)\n{\n    WARN_ON(!atomic_read(&kref->refcount));\n\
  \    atomic_inc(&kref->refcount);\n}\n```\n\n该函数增加引用计数。它没有返回值。要丢弃对 `kref` 的引用，使用声明在\
  \ `<linux/kref.h>` 中的 `kref_put()`：\n\n![image](img/p0354-06.jpg)\n\n该函数将引用计数减一，如果计数现在为零，则调用提供的\
  \ `release()` 函数。正如那个不祥的 `WARN_ON()` 语句所示，提供的 `release()` 函数不能仅仅是 `kfree()`，而必须是一个特殊的函数，它接受\
  \ `struct kref` 作为其唯一参数且没有返回值。该函数返回 0，除非释放的引用是该对象的最后一个引用，在这种情况下它返回 1。通常，`kref_put()`\
  \ 的调用者并不关心返回值。\n\n与其让内核代码通过 `atomic_t` 类型和简单的“get”与“put”封装函数来实现自己的引用计数，人们更鼓励开发者使用\
  \ `kref` 类型及其辅助函数，在内核中提供一种通用且已知正确的引用计数机制。\n\n所有这些函数都定义在 `lib/kref.c` 中，并声明在 `<linux/kref.h>`\
  \ 中。\n\n## sysfs\n\n*sysfs 文件系统*是一个内存中的虚拟文件系统，提供了 `kobject` 层次结构的视图。它使用户能够以简单文件系统的方式查看其系统的设备拓扑结构。通过属性，`kobjects`\
  \ 可以导出文件，允许从内核读取并可选地写入内核变量。\n\n尽管设备模型最初的目的是为了电源管理原因提供设备拓扑结构，但 `sysfs` 是其产物。为了方便调试，设备模型的开发者决定将树形导出为文件系统。这很快被证明非常有用，起初作为以前存在于\
  \ `/proc` 中的设备相关文件的替代品，后来作为系统对象层次结构的强大视图。事实上，`sysfs` 原名为 `driverfs`，它早于 `kobjects`\
  \ 。最终 `sysfs` 表明一个新的对象模型将非常有益，`kobject` 随随之诞生了。今天，每个带有 2.6 内核的系统都有 `sysfs`。大多数系统将其挂载在\
  \ `/sys`。\n\n`sysfs` 背后的魔法仅仅是通过每个 `kobject` 内部的 `dentry` 成员将 `kobjects` 与目录项绑定。回想\
  \ 第 12 章，`dentry` 结构代表目录项。通过将 `kobjects` 与 `dentry` 链接，`kobjects` 自然然地映射到目录。现在将\
  \ `kobjects` 导出为文件系统变得就像在内存中构建 `dentry` 树一样简单。但等等！`kobjects` 已经形成了一棵树，我们我们爱的设备模型。由于\
  \ `kobjects` 映射到 `dentry` 且对象层次结构已经形成了内存中的树，`sysfs` 变得轻而易举。\n\n图 17.2 是挂载在 `/sys`\
  \ 的 `sysfs` 文件系统的部分视图。\n\n图 17.2. `/sys` 树的局部视图。\n\n![image](img/17fig02.jpg)\n\n\
  \n\n\n\nsysfs 根包含至少 10 个目录：`block`、`bus`、`class`、`dev`、`devices`、`firmware`、`fs`、`kernel`、`module`\
  \ 和 `power`。`block` 目录包含系统中每个注册块设备的目录。这些目录每一个包含了该块设备上的所有分区。`bus` 目录提供了系统总线的视图。`class`\
  \ 目录按高层功能组织的设备视图。`dev` 目录是注册设备节点的视图。`devices` 目录是系统设备拓扑的视图。它直接映射到内核内部设备结构的层次结构。`firmware`\
  \ 目录包含特定系统的低级子系统树，例如 ACPI、`EDD`、`EFI` 等。`fs` 目录包含注册文件系统的视图。`kernel` 目录包含内核配置选项和状态信息，而\
  \ `modules` 目录包含系统加载模块的视图。`power` 目录包含系统级电源管理数据。并非所有系统都拥有所有目录，其他系统还拥有此处未提到的目录。\n\
  \n最重要的目录是 `devices`，它向外界导出设备模型。该目录结构是系统的实际设备拓扑。其他目录中的大部分数据只是 `devices` 目录中数据的另一种组织形式。例如，`/sys/class/net/`\
  \ 根据注册网络接口的高层概念组织设备。该目录内部可能包含子目录 `eth0`，它包含一个指向 `devices` 中实际设备目录的符号链接 `device`。\n\
  \n查看你权限访问的 Linux 系统上的 `/sys`。这种对系统设备精确的视图非常整洁，而且看到 `class` 中的高层概念与 `devices` 中的低级物理设备以及\
  \ `bus` 中的实际驱动程序之间的连接是非常有益的。当你意识到这些数据是作为内核维护设备层次结构的副作用而免费提供的，并且这些数据是内核内部维护的系统表示时，整个体验会变得更有意义。\n\
  \n如果你觉得 sysfs 有趣，你可能可能对 HAL 感兴趣，HAL 是一种硬件抽象层，你可以在 [`www.freedesktop.org/wiki/Software/hal`](http://www.freedesktop.org/wiki/Software/hal)\
  \ 找到它。HAL 基于 sysfs 中的数据构建一个内存数据库，将类、设备和驱动的概念连接在一起。在这些数据之上，HAL 提供了丰富的 API，以实现更智能、硬件感知的应用程序。\n\
  \n## 从 sysfs 中添加和移除 kobjects\n\n初始化的 kobjects 不会自动导出到 sysfs。要向 sysfs 表示一个 kobject，你使用\
  \ `kobject_add()`：\n\n```\nint kobject_add(struct kobject *kobj, struct kobject\
  \ *parent, const char *fmt, ...);\n```\n\n给定的 kobject 在 sysfs 中的位置取决于它在对象层次结构中的位置。如果设置了\
  \ kobject 的 `parent` 指针，则该 kobject 映射到其父级内部的 sysfs 子目录。如果未设置 `parent` 指针，kobject\
  \ 映射到 `kset->kobj` 内部的子目录。如果给定的 kobject 中 `parent` 和 `kset` 字段均未设置，则假设该 kobject\
  \ 没有父对象，并映射到 sysfs 中的根级目录。在大多数用例中，调用 `kobject_add()` 之前，应该恰当地设置 `parent` 和 `kset`\
  \ 中的一个或两者。无论如何，sysfs 中表示 kobject 的目录名称由 `fmt` 给出，它接受 `printf()` 风格的格式字符串。\n\n辅助函数\
  \ `kobject_create_and_add()` 将 `kobject_create()` 和 `kobject_add()` 的工作合并为一个函数：\n\
  \n```\nstruct kobject * kobject_create_and_add(const char *name, struct kobject\
  \ *parent);\n```\n\n注意，`kobject_create_and_add()` 接收 kobject 目录名称作为直接指针 `name`，而\
  \ `kobject_add()` 使用 `printf()` 风格的格式化。\n\n移除 kobject 的 sysfs 表示通过 `kobject_del()`\
  \ 完成：\n\n```\nvoid kobject_del(struct kobject *kobj);\n```\n\n所有这些函数都定义在 `lib/kobject.c`\
  \ 中，并在 `<linux/kobject.h>` 中声明。\n\n## 向 sysfs 中添加文件\n\nKobjects 映射到目录，完整的对象层次结构很好地映射到完整的\
  \ sysfs 目录结构，但文件呢？sysfs 仅仅是一个没有文件来提供实际数据的漂亮树结构。\n\n### 默认属性\n\n通过 kobjects 和 ksets\
  \ 中的 `ktype` 字段提供一组默认文件。因此，所有相同类型的 kobject 具有相同的默认文件来填充它们的 sysfs 目录。`kobj_type`\
  \ 结构包含一个成员 `default_attrs`，它是一个 `attribute` 结构体数组。属性将内核数据映射到 sysfs 中的文件。\n\n`attribute`\
  \ 结构定义在 `<linux/sysfs.h>` 中：\n\n![image](img/p0358-01.jpg)\n\n`name` 成员提供此属性的名称。这将是\
  \ sysfs 中生成文件的文件名。`owner` 成员指向代表所有模块的 `module` 结构（如果有的话）。如果模块不拥有此属性，该字段为 `NULL`。`mode`\
  \ 成员是一个 `mode_t` 类型，指定了 sysfs 中文件的权限。只读属性如果是对全用户可读的，可能想将其设置为 `S_IRUGO`，如果仅所有者可读，则可能设置为\
  \ `S_IRUSR`。可写属性可能想将 `mode` 设置为 `S_IRUGO | S_IWUSR`。sysfs 中的所有文件和目录都由 uid 0 和 gid\
  \ 0 所有。\n\n尽管 `default_attrs` 列出了默认属性，但 `sysfs_ops` 描述了如何使用它们。`sysfs_ops` 成员指向同名结构的指针，该结构定义在\
  \ `<linux/sysfs.h>` 中：\n\n![image](img/p0359-01.jpg)\n\n当从用户空间读取 sysfs 条目时会调用 `show()`\
  \ 方法。它必须将 `attr` 提供的属性值拷贝到 `buffer` 提供的缓冲区。缓冲区长度为 `PAGE_SIZE` 字节；在 x86 上，`PAGE_SIZE`\
  \ 是 4096 字节。函数在成功时返回实际写入 `buffer` 的数据字节数，失败时返回负的错误代码。\n\n`store()` 方法在写入时被调用。它必须从\
  \ `buffer` 读取 `size` 字节到属性 `attr` 所代表的变量中。缓冲区的大小始终为 `PAGE_SIZE` 或更小。函数在成功时返回从 `buffer`\
  \ 读取的数据字节数，失败时返回负的错误代码。\n\n由于这组单一函数必须处理*所有*属性上的文件 I/O 请求，它们通常需要维护某种泛泛映射，以调用特定于每个属性的处理器。\n\
  \n### 创建新属性\n\n通常，与 kobject 关联的 ktype 提供的默认属性已经足够。事实上，ktype 的目的是为 kobjects 提供通用操作。在\
  \ kobjects 之间共享 ktypes 不仅简化了编程，还提供了代码合并，并为相关对象的 sysfs 目录提供了统一的外观。\n\n尽管如此，通常 kobject\
  \ 的某些特定实例是特殊的。它想要甚至需要自己的属性——也许是为了提供更通用 ktype 不共享的数据或功能。为此，内核提供了 `sysfs_create_file()`\
  \ 接口以便在默认集合之上添加新属性：\n\n```\nint sysfs_create_file(struct kobject *kobj, const struct\
  \ attribute *attr);\n```\n\n该函数将 `attr` 指向的 `attribute` 结构与 `kobj` 指向的 kobject 关联。在调用之前，应该填充给定的属性。该函数在成功时返回零，否则返回负错误代码。\n\
  \n\n\n\n注意，kobject 的 `ktype` 中指定的 `sysfs_ops` 被调用以处理此新属性。现有的默认 `show()` 和 `store()`\
  \ 方法必须处理新创建的属性。\n\n除了创建实际文件，还可以创建符号链接。在 sysfs 中创建符号链接非常简单：\n\n```\nint sysfs_create_link(struct\
  \ kobject *kobj, struct kobject *target, char *name);\n```\n\n该函数在从 `kobj` 映射的目录到从\
  \ `target` 映射的目录中创建一个名为 `name` 的链接。该函数在成功时返回零，否则返回负的错误代码。\n\n### 销毁属性\n\n移除属性通过\
  \ `sysfs_remove_file()` 处理：\n\n```c\nvoid sysfs_remove_file(struct kobject *kobj,\
  \ const struct attribute *attr);\n```\n\n调用返回后，指定的属性将不再出现在给定的 kobject 目录中。\n\n通过\
  \ `sysfs_create_link()` 创建的符号链接可以使用 `sysfs_remove_link()` 删除：\n\n```c\nvoid sysfs_remove_link(struct\
  \ kobject *kobj, char *name);\n```\n\n返回后，从 `kobj` 映射的目录中的符号链接 `name` 将删除。\n\n这四个函数都声明在\
  \ `<linux/kobject.h>` 中。`sysfs_create_file()` 和 `sysfs_remove_file()` 函数定义在 `fs/sysfs/file.c`\
  \ 中。`sysfs_create_link()` 和 `sysfs_remove_link()` 函数定义在 `fs/sysfs/symlink.c` 中。\n\
  \n### sysfs 约定\n\nsysfs 文件系统目前是实现以前保留给设备节点上的 `ioctl()` 调用或 procfs 文件系统的功能的地方。不再使用这些废弃的内核接口，现在的内核开发者在相应的目录中作为\
  \ sysfs 属性来实现此类功能。例如，与其在设备节点上使用新的 `ioctl()`，不如在驱动程序的 sysfs 目录中添加 sysfs 属性。这种方法避免了对晦\
  \ `ioctl()` 参数的不类型安全使用以及 `/proc` 的混乱。\n\n然而，为了保持 sysfs 的整洁和直观，开发者必须遵循某些约定。首先，sysfs\
  \ 属性应该每个文件导出一个值。值应该是基于文本的，并映射到简单的 C 类型。目标是避免我们今天在 `/proc` 中看到的高度结构化或高度混乱的数据表示。每个文件提供一个值使得从命令行进行读写变得轻而易举，并使\
  \ C 程序能够轻松地将内核数据从 sysfs 吸到自己的变量中。在“一个文件一个值”的规则导致数据表示效率下的的情况下，在一个文件中放置多个相同类型的值是可以接受的。适当地对其进行划分；一个简单的空格可能是最好的。最终，将\
  \ sysfs 属性视为映射到单个内核变量（正如它们通常的那样），并记住从用户空间（特别是从 shell）操作的便利性。\n\n其次，在 sysfs 中以清晰的层级结构组织数据。正确设置\
  \ kobject 的父节点，使其能够直观地映射到 sysfs 树。将属性与正确的 kobject 关联，并记住 kobject 层级不仅存在于内核中，还作为导出到用户空间的树存在。保持\
  \ sysfs 树的有序和层次化。\n\n最后，记住 sysfs 提供从内核到用户的服务，因此它是一种用户空间 ABI。用户程序可以依赖 sysfs 目录和文件的存在性、位置、值和行为。不建议以任何方式更改现有文件，而修改给定属性的行为但保留其名称和位置无疑是自找麻烦。\n\
  \n这些简单的约定应该使 sysfs 为用户空间提供一个丰富且直观的接口。正确地使用 sysfs，用户空间开发者就可以与内核拥有一个简单、简洁、又强大且直观的接口。\n\
  \n#### 内核事件层\n\n内核事件层在 kobject 之上实现了一个从内核到用户的通知系统。在 2.6.0 发布之后，很明显需要一种机制将事件从内核推送到用户空间，特别是对于需要更集成、更异步系统的桌面系统。这种想法是让内核顺着层堆栈向上推送事件：硬盘满了！处理器过热！分区已挂载！\n\
  \n事件层的早期版本出现后又消失，不久后整个部分就与 kobject 和 sysfs 紧密结合在一起。事实证明，结果非常漂亮。内核事件层将事件建模为从对象（特别是\
  \ kobject）发出的信号。因为 kobject 映射到 sysfs 路径，因此每个事件的源都是 sysfs 路径。如果相关事件与你的硬盘有关，`/sys/block/hda`\
  \ 就是源地址。在内核内部，我们将事件建模为源自底层 kobject。\n\n每个事件都被赋予一个表示信号的动词或动作字符串。如 modified（已修改）或\
  \ unmounted（已卸载）等描述发生了什么的术语。\n\n最后，每个事件都有一个可选的负载（payload）。内核事件层并不是向用户空间传递提供负载的任意字符串，而是将负载表示为\
  \ sysfs 属性。\n\n内部，内核事件通过 netlink 从内核空间传到用户空间。netlink 是一种传输网络信息的高速组播套接字。使用 netlink\
  \ 意味着从用户空间获取内核事件就像阻塞套接字一样简单。其目的是用户空间实现一个监听套接字的系统守护进程，处理任何读取事件并将事件传递给系统堆栈。此类用户空间守护进程的一种可能建议是将事件连接到\
  \ D-BUS，D-BUS 已经实现了系统级消息总线。通过这种方式，内核可以像系统的任何其他组件一样发射信号。\n\n*关于 D-BUS 的更多信息请访问 http://dbus.freedesktop.org/。*\n\
  \n从你的内核代码向用户空间发送事件，请使用 `kobject_uevent()`：\n\n```\nint kobject_uevent(struct kobject\
  \ *kobj, enum kobject_action action);\n```\n\n第一个参数指定发射此信号的 kobject。实际内核事件包含该 kobject\
  \ 映射的 sysfs 路径。\n\n第二个参数指定描述此信号的动作或动词。内核事件包含一个映射到提供的 `enum kobject_action` 值的字符串。函数没有直接提供字符串，而是使用枚举来鼓励值重用、提供类型安全并防止拼写和其他错误。枚举定义在\
  \ `<linux/kobject.h>` 中，形式为 `KOBJ_`*foo*。当前值包括 `KOBJ_MOVE`、`KOBJ_ONLINE`、`KOBJ_OFFLINE`、`KOBJ_ADD`、`KOBJ_REMOVE`\
  \ 和 `KOBJ_CHANGE`。这些值分别映射到字符串“move”、“online”、“offline”、“add”、“remove”和“change”。只要现有值不足，添加新的动作值是可以接受的。\n\
  \n使用 kobject 和属性不仅鼓励产生符合基于 sysfs 世界的事件，还鼓励创建新的 kobject 和属性来表示尚未通过 sysfs 暴露的对象和数据。\n\
  \n此函数及相关函数定义在 `lib/kobject_uevent.c` 中，并声明在 `<linux/kobject.h>` 中。\n\n### 结论\n\n\
  在本章中，我们看了用于实现设备驱动和管理设备树的内核功能，包括模块、kobject（以及相关的 ksets 和 ktypes）以及 sysfs。这些功能对于设备驱动作者来说很重要，因为它们能够编写模块化的、高级的驱动程序。\n\
  \n在最后三章中，我们将讨论从特定的 Linux 内核子系统转向通用内核问题，从下一章开始处理 Linux 内核调试。\n\n\n\n\n内核开发与用户态开发的一个区别是与调试相关的艰巨性。与用户态相比，调试内核是非常困难的。更复杂的是，风险也高得多。内核中的故障可能会导致整个系统崩溃。\n\
  \n调试内核的成功——并最终，整个内核开发的成功——很大程度上取决于你对操作系统的经验和理解。诚然，外表和魅力也有帮助，但要成功地调试内核问题，你需要理解内核。本章将介绍调试内核的方法。\n\
  \n## 入门\n\n内核调试通常是一个漫长且令人抓狂的过程。某些 bug 曾困扰了整个内核开发社区数月之久。幸运的是，对于这些棘手问题中的每一个，都有许多简单的\
  \ bug，其修复方法也同样简单。如果运气好，你所有的 bug 都将保持简单且不足道。然而，在在你开始调查之前，你并不知道这一点。为此，你需要：\n\n- 一个\
  \ bug。这听起来很傻，但你需要一个定义明确且特定的 bug。如果它能够可靠地复现（至少对某人来说如此），会有帮助，但遗憾的是，bug 并不总是那么听话或定义良好。\n\
  - 一个存在该 bug 的内核版本。如果知道 bug *首次* 出现的地方更好。如果你还不知道，本章可以教你一个快速确定它的技巧。\n- 对相关内核代码的了解或运气。调试内核是棘手的，你对周围代码的理解越深就越好。\n\
  \n本章的大部分技术都假设你可以可靠地复现该 bug。你调试的成功取决于你复制问题的能力。如果你不能这样做，那么修复 bug 就仅限于对问题进行概念化处理并在代码中寻找缺陷。这种情况确实经常发生，但如果你能复现问题，成功的机会显然要大得多。\n\
  \n存在有人无法复现的 bug 看起来可能很奇怪。在用户态程序中，bug 往往是直接的。例如，*执行 foo 会导致我的应用程序转储（dump core）*。内核中的\
  \ bug 往往模糊得多。内核、用户态和硬件之间的交互通常非常微妙。竞态条件可能在算法的百万次迭代中只出现一次丑陋面孔。设计不当甚至编译错误的代码在某些系统上可能产生可以接受性能，但在另一些系统上性能却糟糕。某些特定配置在某些随机机器上、在某些奇特工作负载下，可能会触发一个此前从未见过的\
  \ bug，这种情况很常见。你在处理 bug 时拥的信息越多越好。很多时候，如果你能可靠地复现 bug，你已经成功了一大半。\n\n## 内核中的 bug\n\n\
  内核中的 bug 差异很大。它们由于无数原因发生，并以同样的形式表现。bug 的范围从明显的错误代码（例如未在正确的位置存储正确的值）到同步错误（未正确锁定共享变量），再到硬件管理不当（向错误的控制寄存器发送错误的操作）。它们的表现涵盖从性能低下、行为错误、数据损坏到系统死锁的一切情况。\n\
  \n通常，是一个长链事件导致了从代码中的错误到用户观察到的错误。例如，没有引用计数的共享结构可能会导致竞态条件。由于缺乏计数，一个进程可能会释放该结构，而另一个进程仍然想使用它。稍后，第二个进程可能会尝试通过现在失效的指针使用已不存在的结构。这可能导致\
  \ `NULL` 指针解引用、读取垃圾数据，或者完全没有坏事（如果数据尚未被覆盖）。`NULL` 指针解引用会导致 oops，而垃圾数据会导致损坏（然后是错误行为或\
  \ oops）。用户报告 oops 或错误行为。内核开发者随后必须从错误回溯，发现数据在释放后被访问了，存在竞态，而修复方法是在共享结构上添加正确的引用计数。\n\
  \n调试内核听起来可能很难，但实际上，内核与其他任何大型软件项目并没有区别。内核确实有独特的问题，例如时序限制和竞态条件，这是允许在内核内部运行多个执行线程的结果。\n\
  \n## 通过打印调试\n\n内核打印函数 `printk()` 的行为几乎与 C 库的 `printf()` 函数完全相同。事实上，在整本书中我们很少利用它们之间的真实差异。对于大多数意图来说，这是可以的；`printk()`\
  \ 只是内核格式化打印函数的名称。然而，它确实有一些特殊功能。\n\n### 健壮性\n\n`printk()` 一个容易被忽视的属性是它的健壮性。`printk()`\
  \ 函数可以在内核的*任何地方*在*任何时间*被调用。它可以从中断上下文或进程上下文调用。它可以在持有任何锁时调用。它可以在多个处理器上同时调用，但它并不要求调用者持有锁。\n\
  \n这是一个具有韧性的函数。这很重要，因为 `printk()` 的实用性取决于它始终在那里且始终有效。\n\n`printk()` 健壮性的铠甲上确实存在裂缝。在内核启动过程的某个点之前（控制台初始化之前），它是不可用的。事实上，如果控制台没有初始化，输出应该去向哪里呢？这通常不是问题，除非你在启动过程的早期调试问题（例如，在\
  \ `setup_arch()` 中，它执行特定架构的初始化）。这种调试本身就是一个挑战，而缺乏任何类型的打印方法只会加剧问题。\n\n还有一些希望，但不多。硬核架构黑客可以使用运行的硬件（例如串口）与外部世界通信。这对于大多数人来说并不有趣。解决方案是一个可以在启动过程早期输出到控制台的\
  \ `printk()` 变体：`early_printk()`。它的行为与 `printk()` 相同，只是名称及其更早工作的能力发生了变化。然而，这不是一个移植的解决方案，因为并不是所有支持的架构都实现了这种方法。如果你使用的架构确实实现了它（大多数架构包括\
  \ x86），这可能是你最好的希望。\n\n除非你需要在启动早期写入控制台，否则你可以依靠 `printk()` 始终有效。\n\n### 日志级别 (Loglevels)\n\
  \n`printk()` 和 `printf()` 使用上的主要区别在于前者指定日志级别的能力。内核使用日志级别来决定是否将消息打印到控制台上。内核会在控制台上显示所有日志级别低于指定值的消息。\n\
  \n你像这样指定日志级别：\n\n```\nprintk(KERN_WARNING \"This is a warning!\\n\");\nprintk(KERN_DEBUG\
  \ \"This is a debug notice!\\n\");\nprintk(\"I did not specify a loglevel!\\n\"\
  );\n```\n\n`KERN_WARNING` 和 `KERN_DEBUG` 字符串是 `<linux/kernel.h>` 中的简单定义。它们展开为类似于\
  \ `<4>` 或 `<7>` 的字符串并连接到 `printk()` 消息的前面。内核根据根据指定的日志级别和当前的控制台日志级别 `console_loglevel`\
  \ 决定在控制台上打印哪些消息。表 18.1 是可用日志级别的完整列表。\n\n表 18.1 可用日志级别\n\n![image](img/t0366-01.jpg)\n\
  \n如果你不指定日志级别，它将默认为 `DEFAULT_MESSAGE_LOGLEVEL`，目前目前是 `KERN_WARNING`。因为这个值可能会变化，你应该始终为你的消息指定日志级别。\n\
  \n\n\n内核将最重要的日志级别 `KERN_EMERG` 定义为 `<0>`，并将最不关键的日志级别 `KERN_DEBUG` 定义为 `<7>`。例如，在预处理器处理之后，之前的示例看起来如下所示：\n\
  \n```\nprintk(\"<4>This is a warning!\\n\");\nprintk(\"<7>This is a debug notice!\\\
  n\");\nprintk(\"<4>did not specify a loglevel!\\n\");\n```\n\n你如何使用 `printk()` 日志级别完全取决于你自己。当然，你打算保留的普通消息应该具有适当的日志级别。但在试图解决问题时，随处撒洒的调试信息——承认吧，我们都是这么做的，而且确实有效——可以采用任何你想要的日志级别。一种方案是保持默认的控制台日志级别不变，并将所有调试消息设置为\
  \ `KERN_CRIT` 或类似的级别。相反，你可以将调试消息设置为 `KERN_DEBUG` 并更改你的控制台日志级别。两者各有优劣，由你决定。\n\n##\
  \ 日志缓冲区 (The Log Buffer)\n\n内核消息存储在一个大小为 `LOG_BUF_LEN` 的环形缓冲区中。该大小可以在编译时通过 `CONFIG_LOG_BUF_SHIFT`\
  \ 进行配置。单处理器机器的默认值是 16KB。换句话说，内核可以同时存储 16KB 的内核消息。如果消息队列达到最大值并再次调用 `printk()`，新消息将覆盖最旧的消息。日志缓冲区之所以被称为“环形”，是因为读取和写入是以循环模式进行的。\n\
  \n使用环形缓冲区有多个优势。因为很容易在环形缓冲区上同时进行写入和读取，即使在中断上下文中也可以轻松使用 `printk()`。此外，它使得日志维护变得简单。如果消息太多，新消息会直接覆盖旧消息。如果发生某个问题导致大量消息，日志只会通过覆盖自身，而不会不受控地消耗内存。环形缓冲区唯一的缺点——可能丢失消息——为了换取它提供的简单性和健壮性来说，这是一个非常微小的代价。\n\
  \n## `syslogd` 和 `klogd`\n\n在标准的 Linux 系统上，用户态的 `klogd` 守护进程从日志缓冲区检索内核消息，并通过 `syslogd`\
  \ 守护进程将其馈入系统日志文件。要读取日志，`klogd` 程序可以读取 `/proc/kmsg` 文件，也可以调用 `syslog()` 系统调用。默认情况下，它使用\
  \ `/proc` 方法。无论哪种情况，`klogd` 都会阻塞直到有新的内核消息可读。然后它唤醒，读取任何新消息并进行处理。默认情况下，它将消息发送给 `syslogd`\
  \ 守护进程。\n\n`syslogd` 守护进程将接收到的所有消息附加文件中，默认文件为 `/var/log/messages`。它可以通过 `/etc/syslog.conf`\
  \ 进行配置。\n\n你可以在启动 `klogd` 时指定 `-c` 标志，让它在加载时更改控制台日志级别。\n\n## 混淆 `printf()` 和 `printk()`\n\
  \n当你刚开始开发内核代码时，你很可能会经常混淆 `printf()` 和 `printk()`。这种混淆是很自然的，因为你无法否认多年在用户态开发中使用 `printf()`\
  \ 的习惯。如果运气好的话，这个错误不会持续太久，因为反复的链接器错误会变得越来越令人厌烦。\n\n有一天，你可能会发现自己在用户态代码中不小心使用了 `printk()`\
  \ 而不是 `printf()`。当那一天到来时，你可以说自己是一个真正的内核黑客了。\n\n## Oops\n\n`oops` 是内核告知用户发生了糟糕情况的常用方式。因为内核是整个系统的监视器，它无法像用户态出错时那样简单地自我自愈或杀掉自己。相反，内核会发出一个\
  \ `oops`。这包括向控制台打印错误消息、转储寄存器内容并提供回溯轨迹（back trace）。内核的失败很难管理，因此内核必须经过层层程序来发出 `oops`\
  \ 并完成清理工作。通常，在 `oops` 之后，内核处于一种不一致的状态。例如，内核在发生 `oops` 时可能正在处理重要数据的中间。它可能持有一个锁，或者正处于与硬件通信的过程中。内核必须优雅地退出当前上下文并尝试恢复对系统的控制。在许多情况下，这是无法做到的。如果\
  \ `oops` 发生在中断上下文中，内核将无法继续并发生 panic（恐慌）。panic 会导致系统立即停止。如果 `oops` 发生在空闲任务（pid zero）或初始化任务（pid\
  \ 1）中，结果也是 panic，因为内核在没有这些重要进程的情况下无法继续。然而，如果 `oops` 发生在任何其他进程中，内核会杀死该进程并尝试继续执行。\n\
  \n`oops` 可能由于多种原因引起，包括内存访问违规或非法指令。作为内核开发者，你经常会遇到（无疑也会导致）`oops`。\n\n下面是一个来自 PPC 机器的\
  \ `Oops` 示例，发生在 tulip 网络网卡的定时器处理程序中：\n\n![image](img/p0368-01.jpg)\n\nPC 用户可能会对寄存器的数量感到惊叹（竟然有\
  \ 32 个！）。你可能更熟悉的 x86-32 的 `oops` 会稍微简单一点。然而，对于所有架构来说，重要的信息是相同的：寄存器的内容和回溯轨迹。\n\n\
  回溯轨迹显示了导致问题的精确函数调用链。在这种情况下，你可以清楚地看到发生了什么：机器处于空闲状态并执行空闲循环 `cpu_idle()`，该函数在循环中调用\
  \ `default_idle()`。定时中断发生，导致了定时器的处理。执行了定时器处理函数 `tulip_timer()`，该函数执行了 `NULL` 指针解引用。你甚至可以使用偏移量（函数右侧的如\
  \ `0x128/0x1c4` 这样的数字）来找到确切的错误行。\n\n寄存器内容同样有用，尽管频率较低。通过该函数汇编代码的解码副本，寄存器值可以帮助你重建导致问题的精确事件。在寄存器中看到意想不到的值可能为问题的根源提供线索。在这种情况下，你可以看到哪些寄存器持有\
  \ `NULL`（全为零的值），并发现函数中的哪个变量具有意想不到的值。在这种情况下，问题通常是竞态条件——在本例中，是定时器与该网卡的其他部分之间的竞争。调试竞态条件始终是一个挑战。\n\
  \n## `ksymoops`\n\n上一个 `oops` 被“已解码的（decoded）”，因为内存地址被翻译成了它们所代表的函数。这里显示了上一个 `oops`\
  \ 的未解码版本：\n\n![image](img/p0369-01.jpg)\n\n回溯轨迹中的地址需要转换为符号名称。这是通过 `ksymoops` 命令结合内核编译期间生成的\
  \ `System.map` 文件来完成的。如果你使用了模块，还需要一些模块信息。`ksymoops` 会尝试获取大部分此类信息，因此你通常可以通过以下方式调用它：\n\
  \n```\nksymoops saved_oops.txt\n```\n\n程序随后输出 `oops` 的解码版本。如果 `ksymoops` 使用的默认信息不可接受，或者你想为信息提供替代位置，程序支持各种选项。`ksymoops`\
  \ 的手册页有很多在你在使用之前应该阅读的信息。`ksymoops` 程序可能已经随你的发行版自带了。\n\n## `kallsyms`\n\n幸运的是，处理\
  \ `ksymoops` 不再是一项要求。这是一件大事，因为虽然开发者在使用它可能没问题，但终端用户经常无法匹配 `System.map` 文件，或者完全无法解码\
  \ `oops`。\n\n\n\n2.5 版本内核引入了 `kallsyms` 功能，该功能通过 `CONFIG_KALLSYMS` 配置选项启用。此选项在内核中存储映射到内核映像的函数地址的符号名称，以便内核能够打印解码后的回溯轨迹（back\
  \ traces）。因此，解码 oops 不再需要 `System.map` 或 `ksymoops`。缺点是，内核的大小会略微增加，因为地址到符号的映射必须留在永久映射的内核内存中。然而，在开发阶段以及部署期间，这种内存消耗是值得的。`CONFIG_KALLSYMS_ALL`\
  \ 配置选项额外存储所有符号的符号名称，而不仅仅是函数。这通常只有特殊的调试器需要。`CONFIG_KALLSYMS_EXTRA_PASS` 选项会导致内核构建过程对内核对象代码进行第二次扫描。它只在调试\
  \ `kallsyms` 本身时才有用。\n\n### 内核调试选项\n\n在编译期间你可以设置多个配置选项来辅助调试和测试内核代码。这些选项位于内核配置编辑器（Kernel\
  \ Configuration Editor）的 Kernel Hacking 菜单中。它们都依赖于 `CONFIG_DEBUG_KERNEL`。在内核内核开发（hacking）时，根据实际情况尽可能开启这些选项。\n\
  \n其中一些选项非常有用，可以启用 slab 层调试、高内存调试、I/O 映射调试、自旋锁调试和栈溢出检查。然而最有用的设置之一是自旋锁内睡眠检查（sleep-inside-spinlock\
  \ checking），它实际上做了很多工作。\n\n从 2.5 版本开始，内核拥有一套出色的基础设施来检测各种原子性违规。回想第 9 章“内核同步简介”，`atomic`\
  \ 指某事物在不拆分的情况下执行的能力；代码要么在不中断的情况下完成，要么完全不完成。持有自旋锁或禁用内核抢占的代码是原子的。代码在原子状态不能睡眠——持有锁时睡眠会导致死锁。\n\
  \n得益于内核抢占，内核有一个中央原子性计数器。可以将内核设置为：如果任务在原子状态下睡眠，甚至执行了某些*可能*睡眠的操作，内核将打印警告并提供回溯。可以检测的潜在错误包括：在持有锁时调用\
  \ `schedule()`、在持有锁时发出阻塞内存分配，或在持有每 CPU 数据的引用时睡眠。这种调试基础设施捕获了许多错误并被强烈推荐。\n\n以下选项充分利用了这一特性：\n\
  \n```\nCONFIG_PREEMPT=y\nCONFIG_DEBUG_KERNEL=y\nCONFIG_KALLSYMS=y\nCONFIG_DEBUG_SPINLOCK_SLEEP=y\n\
  ```\n\n### 断言错误和转储信息\n\n许多内核例程可以轻松标记错误、提供断言（assertions）并转储信息。最常见的两种是 `BUG()` 和 `BUG_ON()`。当被调用时，它们会导致\
  \ oops，从而产生栈跟踪并转储到内核的错误消息。为什么这些语句会导致 oops 取决于架构。大多数架构将 `BUG()` 和 `BUG_ON()` 定义为非法指令，从而产生预期的\
  \ oops。你通常将这些例程用作断言，标记不应该发生的情况：\n\n```\nif (bad_thing)\n    BUG();\n```\n\n或者更好\n\
  \n```\nBUG_ON(bad_thing);\n```\n\n大多数内核开发者认为，与 `BUG()` 相比，`BUG_ON()`更容易阅读且更具自文档性。此外，`BUG_ON()`\
  \ 将其断言封装在 `unlikely()` 语句中。注意，某些开发者讨论过通过选项编译掉 `BUG_ON()` 语句的想法，以节省嵌入式内核的空间。这意味着你在\
  \ `BUG_ON()` 内部的断言不应该有任何副作用。`BUILD_BUG_ON()` 宏实现了相同的目的，但在编译时完成。如果提供的语句在编译时求值为真，则编译将带错误终止。\n\
  \n更关键的错误通过 `panic()` 信号指示。调用 `panic()` 会打印错误消息然后停止内核。显然，你只想在最糟糕的情况下使用它：\n\n```\n\
  if (terrible_thing)\n    panic(\"terrible_thing is %ld!\\n\", terrible_thing);\n\
  ```\n\n有时，你只是想在控制台上发布一个简单的栈跟踪来帮助调试。在这些情况下，使用了 `dump_stack()`。它简单地将寄存器内容和函数回溯轨迹转储到控制台：\n\
  \n```\nif (!debug_check) {\n    printk(KERN_DEBUG \"provide some information...\\\
  n\");\n    dump_stack();\n}\n```\n\n### 魔术 `SysRq` 键\n\n一个可能的救命稻草是魔术的 `SysRq` 键，它通过\
  \ `CONFIG_MAGIC_SYSRQ` 配置选项启用。`SysRq`（系统请求）键是大多数键盘上的标准键。在 i386 和 PPC 上，可以通过 Alt+PrintScreen\
  \ 访问。当启用此配置选项时，特殊的组合键允许你无论内核在做什么都能与内核进行通信。这允许你在系统崩溃时执行一些实用的任务。\n\n除了配置选项外，还有一个 sysctl\
  \ 可以切换此功能的开关。要开启它：\n\n```\necho 1 > /proc/sys/kernel/sysrq\n```\n\n从控制台来看，你可以按下\
  \ `SysRq-h` 查看可用选项列表。`SysRq-s` 将脏缓冲区同步到磁盘，`SysRq-u` 卸载所有文件系统，`SysRq-b` 重启机器。连续发送这三个组合键比简单地按下机器重位开关是重启崩溃机器更安全的方法。\n\
  \n如果由于由于被严重锁死，它可能对任何魔术 `SysRq` 组合都没有响应，或者可能无法完成给定的命令。然而，幸运的话，这些选项可能会保存你的数据或辅助调试。表\
  \ 18.2 是支持的 `SysRq` 命令列表。\n\n表 18.2 支持的 `SysRq` 命令\n\n![image](img/t0372-01.jpg)\n\
  \n内核源码树中的 `Documentation/sysrq.txt` 文件包含更多信息。实际实现在 `drivers/char/sysrq.c` 中。魔术 `SysRq`\
  \ 键是辅助调试或拯救崩溃系统的关键工具。然而，因为它为控制台上的任何用户提供了强大的功能，因此在重要的机器上你应该谨慎使用。但对于你的开发机器，它是一个巨大的帮助。\n\
  \n### 内核调试器的传奇\n\n许多内核开发者长期以来一直要求一个内核调试器。遗憾的是，Linus 不想在他的树中包含调试器。他认为调试器会导致误错误的开发者产生糟糕的修复。没有人能反驳他的逻辑——源于对代码真实理解的修复显然可能是正确的。尽管如此，许多内核开发者想要一个官方的内核调试器。由于短期内不太可能发生，出现了许多补丁为标准\
  \ Linux 内核添加了内核调试支持。尽管这些是外部的非官方补丁，但这些工具的功能非常全且强大。在你深入这些解决方案之前，查看标准 Linux 调试器 `gdb`\
  \ 能给你提供多少帮助是一个好主意。\n\n#### `gdb`\n\n你可以使用标准调试器窥视运行内核的内部。在内核上启动调试器与调试运行中的进程相似：\n\n\
  ```\ngdb vmlinux /proc/kcore\n```\n\n`vmlinux` 文件是存储在构建目录根下的未压缩内核映像，而不是压缩的 `zImage`\
  \ 或 `bzImage`。\n\n可选的 `/proc/kcore` 参数充当核心文件，让 `gdb` 实际上可以查看运行内核的内存。你需要 root 权限才能读取它。\n\
  \n你可以发出任何 `gdb` 命令来读取信息。例如，打印变量的值：\n\n```\np global_variable\n```\n\n反汇编一个函数：\n\n\
  ```\ndisassemble function\n```\n\n\n\n如果你使用 `-g` 标志编译内核（在内核 `Makefile` 的 `CFLAGS`\
  \ 变量中添加 `-g`），`gdb` 就能提供多得信息。例如，你可以转储结构体的内容并跟踪指针。你得到的内核文件也会大得多，因此不要常规性地带上调试信息进行编译。\n\
  \n遗憾的是，这已经是 `gdb` 所能做的极限了。它无法以任何方式修改内核数据。它无法对内核代码进行单步执行，也无法设置断点。无法修改内核数据结构是一个很大的缺点。虽然偶尔反汇编函数无疑是有用的，但如果它也能修改数据，那将会变得有用得。。\n\
  \n## `kgdb`\n\n`kgdb` 是一个补丁，它允许 `gdb` 通过串口线远程调试整个内核。它需要两台电脑。第一台电脑运行运行了 `kgdb` 补丁的内核。第二台电脑通过\
  \ `gdb` 串口（连接两台机器的空调制线）对第一台电脑进行调试。使用 `kgdb`，可以使用 `gdb` 的整个功能集：读取和写入任何变量、设置断点、设置观察点、单步执行等等！特殊版本的\
  \ `kgdb` 甚至允许执行函数。\n\n设置 `kgdb` 和串口线有点复杂，但一旦完成，调试就变得简单。该补丁在 `Documentation/` 目录下安装了大量文档——去看看吧。\n\
  \n不同的人维护针对各种架构和内核版本的 `kgdb` 补丁。在网上搜索是寻找某个特定内核补丁的最佳方法。\n\n## 探测系统（Poking and Probing\
  \ the System）\n\n随着你内核调试经验的增加，你会获得一些小技巧，帮助你探测内核以寻找答案。由于内核调试可能相当具有挑战性，每一个小提示和技巧都有帮助。让我们来看两个。\n\
  \n### 使用 UID 作为条件\n\n如果你正在开发的代码与进程有关，有时你可以在不破坏现有代码的情况下开发备用实现。如果你正在重写一个重要的系统调用，并希望有一个功能完备的系统来调试它，这非常有帮助。例如，假设你正在重写\
  \ `fork()` 算法以利用某个令人兴奋的新功能。除非你第一次尝试就搞定一切，否则调试系统将并不容易：一个无法工作的 `fork()` 系统调用注会导致系统无法工作。一如既往，总有希望。\n\
  \n通常，保留原有算法并在侧边构建你的替代方案是安全的。你可以通过使用用户 ID (UID) 作为条件来决定使用哪种算法来实现：\n\n```c\nif (current->uid\
  \ != 7777) {\n    /* 旧算法 .. */\n} else {\n    /* 新算法 .. */\n}\n```\n\n除了 UID 7777\
  \ 以外的所有用户将使用旧算法。你可以创建一个 UID 为 7777 的特殊用户来测试新算法。这使得测试关键的进程相关代码变得容易得多。\n\n### 使用条件变量\n\
  \n如果涉及的代码不在进程上下文中，或者你希望有一种更全局的方法来控制该功能，你可以使用条件变量。这种方法比使用 UID 更加简单。只需创建一个全局变量并在代码中将其用作条件检查即可。如果变量为零，你遵循一条代码路径；如果不为零，则遵循另一条。该变量可以通过你导出的接口或通过调试器的器的探测（poke）来设置。\n\
  \n### 使用统计数据\n\n有时，你想了解特定事件发生的频率。有时，你想比较多个事件并生成一些比例进行比较。你可以通过创建统计数据和一个导出其值的机制轻松地做到。\n\
  \n例如，假设你想查看 `foo` 的发生情况和 `bar` 的发生情况。在一个文件中（理想情况下是这些事件发生的文件），声明两个全局变量：\n\n```c\n\
  unsigned long foo_stat = 0;\nunsigned long bar_stat = 0;\n```\n\n每发生一次这些事件，就增加相应变量的值。然后以你认为合适的方式导出数据。例如，你可以在\
  \ `/proc` 中创建一个包含这些值的文件，或者写一个系统调用。或者，直接通过调试器读取它们。\n\n注意，这种方法并不是特别 SMP 安全的。理想情况下，你应该使用原子操作。然而，对于一个微不足的一次性调试统计，你通常不需要这种保护。\n\
  \n### 限制调试的速率和发生次数\n\n通常，你想在某个区域放置一些调试检查（带有相应的打印语句）来嗅探问题。这可以防止在函数被多次调用时出现信息洪流。有两个相对简单的技巧可以防止这种情况。第一种是速率限制（rate\
  \ limiting），当你想要观察某个事件时非常。为了防止任何洪水，系统仍保持可用。例如：\n\n```c\nif (error && ratelimit())\
  \ {\n    printk(KERN_DEBUG \"error=%d\\n\", error);\n}\n```\n\n`ratelimit()` 函数在速率限制生效时返回零，否则返回非零。默认情况下，它每\
  \ 5 秒只允许一条消息，但允许初始最多十条突发。\n\n另一种棘手的情况发生在你尝试确定代码路径是否以特定方式执行时。与之前的示例不同，你不需要实时通知。这里的解决方案不是限制调试的速率，而是限制调试的发生次数：\n\
  \n```c\nstatic unsigned long limit = 0;\nif (limit < 5) {\n    limit++;\n    printk(KERN_ERR\
  \ \"blah blah blah\\n\");\n}\n```\n\n这个示例将调试输出限制在五次。在五次消息之后，条件始终为假。\n\n在两个示例中，变量应该像所示那样是\
  \ `static` 且局部于函数的。这使得变量的值可以跨函数调用持久化。\n\n这两个示例都不是 SMP 安全或可抢占安全的，尽管快速切换到原子操作可以让它们变得安全。对于临时的调试检查，你通常不需要如此谨慎。\n\
  \n## 通过二分查找寻找罪魁更改\n\n知道 bug 是什么时候引入内核源码的通常是有用的。如果你知道 bug 发生在版本 2.6.33，但在 2.4.29\
  \ 中没有，那么你对导致 bug 的更改就有清晰的认识。修复 bug 通常只需要回滚或其他修复那个错误的更改。\n\n然而，许多时候你并不知道哪个内核版本引入了\
  \ bug。你知道 bug 存在于*当前内核*，但它似乎一直存在于当前内核中！只要稍微努力，你就能找到那个更改。有了这个更改，修复 bug 通常就不远了。\n\n\
  首先，你需要一个可靠可复现的问题——最好是一个你可以在启动后立即验证的 bug。接下来，你需要一个已知的内核。你可能已经知道了。例如，如果你知道几个月前内核还可以工作，就获取那个时期的内核。如果你错了，就尝试更早的版本。寻找一个没有\
  \ bug 的内核应该不难。\n\n接下来，你需要一个已知的坏内核。为了方便，从你已知的有 bug 的早期内核开始。\n\n\n\n现在，你从已知的损坏内核向已知的良好内核进行二分搜索。让我们来看一个例子。假设最新的良好内核是\
  \ 2.6.11，最早的损坏内核是 2.6.20。首先选择一个中间位置的内核，例如 2.6.15。测试 2.6.15 是否存在 bug。如果 2.6.15 运行正常，你就知道问题出现在较后的内核中，因此尝试\
  \ 2.6.15 和 2.6.20 之间的中间一个内核——例如 2.6.17。相反，如果 2.6.15 不正常，你就知道问题出在较早的内核中，因此你可能会尝试\
  \ 2.6.13。重复此过程。\n\n最终，你应该将问题缩小到两个连续发布的内核——其中一个有 bug，另一个没有。这样，你就能清楚地知道导致 bug 的更改是什么。这种方法比查看每一个内核要高效得多！\n\
  \n### 使用 Git 进行二分搜索\n\ngit 源码管理工具提供了一种执行二分搜索的实用机制。如果你使用 git 控制你的 Linux 源码树副本，它可以自动化二分搜索过程。此外，git\
  \ 工具在 `revision level` 级别执行二分搜索，实际上可以定位到引入 bug 的特定提交。与许多 git 相关任务不同，使用 git 进行二分搜索并不困难。首先，你告诉\
  \ git 你想开始进行二分搜索：\n\n```\ngit bisect start\n```\n\n然后，你为 git 提供最早的损坏版本：\n\n```\n\
  git bisect bad <revision>\n```\n\n如果内核的最新版本就是你已知的最早罪魁祸首，你不需要提供版本号：\n\n```\ngit bisect\
  \ bad\n```\n\n接着，你为 git 提供最新的良好版本：\n\n```bash\ngit bisect good v2.6.28\n```\n\n\
  git 随后会自动检出 Linux 源码树，并在提供的坏版本和好版本之间进行二分。然后你编译、运行并测试该版本。如果它运行正常，你运行：\n\n```\ngit\
  \ bisect good\n```\n\n如果它运行异常——也就是说，如果给定的内核版本存在 bug——你就运行：\n\n```\ngit bisect bad\n\
  ```\n\n在每条命令上，git 都会再次以版本为基础对树进行二分，根据需要返回下一次二分结果。你重复这一过程直到无法再进行二分。git 然后会打印出问题的版本号。\n\
  \n这是一个漫长的过程，但 git 确实使其变得简单。如果你认为知道 bug 的来源——例如，在 x86 特定的启动代码中——你可以指示 git 只在涉及指定目录列表的提交之间进行二分：\n\
  \n```\ngit bisect start — arch/x86\n```\n\n### 当无可无策时：社区\n\n也许你已经尝试了一切想到的方法。你在键盘前苦作了无数小时——事实上，可能是无数天——但解决方案仍然难以寻觅。如果\
  \ bug 存在于 Linux 主流内核，你始终可以寻求内核社区其他开发者的帮助。\n\n向内核邮件列表发送一封简短但完整的邮件，描述 bug 和你的发现，可能有助于发现解决方案。毕竟，没有人喜欢\
  \ bug。\n\n第 20 章，“补丁、黑客行为与社区”专门讨论了社区及其主要论坛——Linux 内核邮件列表 (LKML)。\n\n### 总结\n\n本章涵盖了内核调试，即确定\
  \ `why` 实现偏离了意图的过程。我们学习了多种技术，从内置内核调试基础设施到调试器，从日志记录到使用 git 进行二分搜索。由于调试 Linux 内核可能比调试用户空间应用程序困难得多，本章的内容对于任何打算实际编写内核代码的人来说至关重要。\n\
  \n在下一章中，我们将涵盖另一个通用主题：Linux 内核的可移植性。继续！\n\n# 19. 可移植性\n\nLinux 是一个 `portable` 操作系统，支持广泛的计算机架构。`Portability`\
  \ 指代码从一个系统架构移动到另一个架构的难易程度（如果可以的话）。我们知道 Linux 是可移植的，因为它已经 `ported` 到各种系统。但这种可移植性并非一蹴而就——它需要勤奋和持续关注编写可移植的代码。因此，相对来说，现在将\
  \ Linux 引入新系统变得很容易。本章讨论了如何编写可移植的代码——在编写核心内核代码和设备驱动程序时需要注意的问题。\n\n### 可移植操作系统\n\n\
  某些操作系统设计时将可移植性作为主要特性。尽可能减少机器特定的代码。汇编代码被保持到最低，并且接口和功能足够通用且抽象，以便它们能够在广泛的架构上运行。显而易见的优势是支持新架构变得相对容易。在某些情况下，高度可移植且简单的操作系统只需要几百行独特代码即可迁移到新架构。缺点是不支持特定于架构的特性，且代码无法针对特定机器进行手动调优。通过这种设计选择，用可移植代码换取了最优代码。高度可移植操作系统的示例包括\
  \ Minix、NetBSD 和许多学术系统。\n\n另一面是那些为了高度定制、最优代码而牺牲了所有可移植性的操作系统。代码尽可能地用汇编语言编写，或为特定架构进行设计。内核功能围绕特定的架构特性设计。因此，将操作系统移动到新架构等同于从头开始重写内核，即使可行，该操作系统可能也不适用于其他架构。通过这种设计决策，用可移植代码换取了最优代码。此类系统通常比可移植性维护的系统更难维护。当然，这些系统并不比可移植性更好的系统更高效；但它们忽视可移植性的倾向允许了不妥协的设计。微软\
  \ DOS 和 Windows 95 是这种设计决策的两个例子。\n\nLinux 在可移植性方面采取了中间道路。在实际范围内，接口和核心代码都是架构无关的 C\
  \ 代码。然而，在性能至关重要的地方，内核功能会针对每个架构进行调整。例如，许多快速路径和底层代码是依赖架构的，并且通常用汇编编写。这种方法使 Linux 在不放弃优化的情况下保持可移植性。在可移植性会影响性能的地方，性能通常胜出。否则，代码保持可移植性。\n\
  \n通常，导出的内核接口是架构无关的。如果函数的任何部分需要每个支持的架构都是唯一的（无论是出于性能考虑还是需要），这些代码将实现在独立的函数中并在需要时调用。每个支持的架构然后实现其架构特定的函数并将其链接到内核镜像中。\n\
  \n一个很好的例子是调度器。调度器的大部分是用架构无关的 C 编写的，位于 `kernel/sched.c` 中。调度器的少数工作（如切换处理器状态或交换地址空间）是依赖架构的。因此，从一个进程切换到另一个进程的\
  \ C 方法 `context_switch()` 调用了 `switch_to()` 和 `switch_mm()` 方法分别切换处理器状态和地址空间。\n\n\
  `switch_to()` 和 `switch_mm()` 的代码由 Linux 支持的每个架构独立实现。当 Linux 移植到新架构时，新架构必须为这些函数提供实现。\n\
  \n\n\n\n特定于架构的文件位于 `arch/architecture/`，其中 `architecture` 是代表 Linux 中每个架构的短名称。例如，Intel\
  \ x86 架构的短名称为 `x86`。（该架构同时支持 `x86-32` 和 `x86-64`）。这些机器的特定架构文件位于 `arch/x86`。2.6 内核系列支持的架构有\
  \ `alpha`、`arm`、`avr32`、`blackfin`、`cris`、`frv`、`h8300`、`ia64`、`m32r`、`m68k`、`m68knommu`、`mips`、`mn10300`、`parisc`、`powerpc`、`s390`、`sh`、`sparc`、`um`、`x86`\
  \ 和 `xtensa`。在本章后面的表 19.1 中提供了这些架构更完整的列表。\n\n#### 表 19.1. 支持的 Linux 架构\n\n![image](img/t0382-01.jpg)\n\
  \n### Linux 可移植性历史\n\n当 Linus 首次向这个毫无防备的世界发布 Linux 时，它只运行在 Intel i386 机器上。尽管该操作系统相当通用且编写良好，但可移植性并不是一个主要考虑的问题。事实上，Linus\
  \ 甚至暗示过 Linux 永远不会在 i386 架构以外的任何平台上运行！然而，1993 年开始将 Linux 移植到 Digital Alpha 架构。Digital\
  \ Alpha 是一种现代基于 RISC 的高性能架构，具有 64 位内存寻址能力。这与 Linus 最初的 386 形成了鲜明对比。尽管如此，Linux 移植到\
  \ Alpha 耗了大约一年时间，Alpha 成为 x86 之后第一个官方支持的架构。这次移植可能相当困难，因为它面临着作为首者的这一不不受欢迎的挑战。开发者并没有简单地将对\
  \ Alpha 的支持接到内核上，而是根据需要，出于可移植性的考虑重写了内核部分^(1)。虽然这增加了整体工作量，但结果要清晰得多，未来的移植也变得更加容易。\n\
  \n^(1) *这在 Linux 内核开发中是一种常见现象。如果某事要做，就必须正确完成。内核开发者并不反感为了完美而重写大量代码。*\n\n尽管 Linux\
  \ 的早期版本只支持 Intel i386 架构，但 1.2 内核系列增加了对 Digital Alpha、MIPS 和 SPARC 的支持——尽管这种支持带有某种实验性。\n\
  \n随着 2.0 内核的发布，Linux 正式增加了对 Motorola 68k 和 PowerPC 的支持。此外，之前 1.2 中支持的架构被标记为官方且稳定。\n\
  \n2.2 内核系列通过增加 ARM、IBM S/390 和 UltraSPARC 带来了更多架构支持。几年后，2.4 将支持的架构数量几乎翻倍达到 15 个，因为增加了对\
  \ CRIS、IA-64、64 位 MIPS、HP PA-RISC、64 位 IBM S/390 和 Hitachi SH 的支持。\n\n当前版本的内核 2.6\
  \ 通过增加 AVR、FR-V、无 MMU 的 Motorola 68k、M32xxx、H8/300、IBM POWER、Xtensa 以及一个在 Linux\
  \ 下虚拟机中运行的内核版本（称为 Usermode Linux），将支持的架构数量增加到了 21 个。\n\n这些架构中的都支持多种芯片和机器类型。某些支持的架构（如\
  \ ARM 和 PowerPC）各支持许多不同的芯片和机器类型。其他的（如 x86 和 SPARC）则支持处理器的 32 位和 64 位变体。因此，尽管 Linux\
  \ 运行在 21 种宽架构下，它运行在更多的机器上！\n\n### 字长与数据类型\n\n*字*（word）*是机器一次可以处理的数据量。这符合文档的类比，该类比还包括*字符*（通常为\
  \ 8 位）和*页*（包含许多字，通常等于 4KB 或 8KB 的内容）作为数据的其他衡量单位。字是字节的整数倍——例如一、二、四或八字节。当人们谈论机器的“n\
  \ 位”时，他们通常是在谈论机器的*字长*（word size）。例如，当人们说 Intel i7 是一个 64 位芯片时，他们指的是它的字长，即 64 位或\
  \ 8 字节。\n\n处理器通用寄存器（GPRs）的大小等于其字长。给定架构中组件的宽度（例如内存总线）通常至少与字长一样宽。通常，至少在 Linux 支持的架构中，虚拟内存地址空间等于字长，尽管物理地址空间有时会较小。因此，指针的大小等于字长。此外，C\
  \ 类型 `long` 的大小等于字长，而 `int` 类型的大小有时会小于字长。例如，Alpha 的字长为 64 位。因此，寄存器、指针和 `long` 类型的长度均为\
  \ 64 位。然而，`int` 类型为 32 位。Alpha 可以。\n\n### 字、双字与混淆\n\n在 64 位机器上，一个*字*有很多位。在 32 位机器上，一个字是\
  \ 32 位。在 16 位机器上，一个字是 16 位。在 8 位机器上，一个字是 8 位。\n\nC 标准定义 `long` 至少为 32 位。在许多 64 位系统上，它是\
  \ 64 位。`int` 类型通常是 32 位。\n\n指针的大小等于字长。在 64 位系统上，指针是 8 字节；在 32 位系统上，它是 4 字节。\n\n\
  C 标准定义 `long` 至少为 32 位。在许多 64 位系统上，它是 64 位。`int` 类型通常是 32 位。\n\n\n\n\n-   由于 `long`\
  \ 的大小在不同架构上有所不同，*永远不要*假设 `sizeof(int)` 等于 `sizeof(long)`。\n-   同样，不要假设指针和 `int`\
  \ 的大小相同。\n\n操作系统使用一种简单的助记符来描述其类型的尺寸。例如，64 位 Windows 被称为 `LLP64`，这意味着 `long` 类型和指针类型均为\
  \ 64 位。64 位 Linux 系统为 `LP64`：`long` 和指针类型为 64 位。32 位 Linux 系统为 `ILP32`：`int`、`long`\
  \ 和指针类型均为 32 位。这种助记符有助于让人一眼看出是哪种操作系统实现了其字长长度（word size），因为这种选择涉及到权衡。\n\n考虑 `ILP64`、`LP64`\
  \ 和 `LLP64`。在 `ILP64` 中，`int`、`long` 和指针类型的大小均为 64 位。这使得编程变得更容易，因为主要的 C 类型具有相同的大小（整数和指针之间的大小不匹配是编程错误的常见来源），但缺点是常见的整数类型比通常需要的要大得多。在\
  \ `LP64` 中，程序员可以使用不同大小的整数类型，但必须注意 `int` 类型的大小小于指针的大小。在 `LLP64` 中，程序员被困限于相同大小的 `int`\
  \ 和 `long` 类型，并且还要担心所有整数和指针之间的大小不匹配问题。大多数程序员更倾向于 Linux 采用的 `LP64` 模型。\n\n### 不透明类型（Opaque\
  \ Types）\n\n不透明数据类型不公开其内部格式或结构。它们几乎是 C 语言中能达到的最“黑盒”的状态。语言对它们的支持有限。相反，开发者声明一个 `typedef`，将其称为不透明类型，并希望没有人将其强制转换回标准的\
  \ C 类型。所有的使用通常都是通过开发者创建的一组特殊接口完成的。一个例子是 `pid_t` 类型，它存储一个进程标识符。该类型的实际大小并不公开——尽管任何人都可以通过“作弊”偷看一眼并发现它是一个\
  \ `int`。如果没有代码显式地使用该类型的大小，就可以在不产生太大麻烦的情况下更改它。事实确实如此：在旧的 Unix 系统中，`pid_t` 被声明为 `short`。\n\
  \n另一个不透明类型的例子是 `atomic_t`。正如第 10 章“内核同步方法”中所述，该类型持有一个可以进行原子操作的整数值。尽管该类型是 `int`，但使用不透明类型有助于确保数据仅在特殊的原子操作函数中使用。不透明类型还有助于隐藏\
  \ `atomic_t` 的可用大小，由于 32 位 SPARC 的架构限制，它并不总是完整的 32 位。\n\n内核中其他不透明类型的示例包括 `dev_t`、`gid_t`\
  \ 和 `uid_t`。\n\n在处理不透明类型时，请记住以下规则：\n\n-   不要假设类型的大小。它在某些系统上可能是 32 位，在另一些系统上可能是 64\
  \ 位。此外，内核开发者可以随时间更改其大小。\n-   不要将类型转换回标准的 C 类型。\n-   保持大小无关（size agnostic）。编写代码时要确保类型的实际存储和格式可以发生变化。\n\
  \n### 特殊类型（Special Types）\n\n内核中的某些数据尽管没有用不透明类型表示，但需要特定的数据类型。一个例子是中断控制中使用的 `flags`\
  \ 参数，它应该始终存储在无符号 `long` 中。\n\n在存储和操作特定数据时，务必注意表示该类型的数据类型并使用它。将这些值之一存储在另一种类型（如 `unsigned\
  \ int`）中是一个常见的错误。虽然在 32 位架构上不会产生问题，但 64 位机器将遇到麻烦。\n\n### 显式大小类型（Explicitly Sized\
  \ Types）\n\n作为程序员，你通常在代码中需要显式大小的数据。这通常是为了匹配外部要求，例如硬件、网络或二进制文件提出的要求。例如，声卡可能有一个 32\
  \ 位的寄存器，网络数据包可能有一个 16 位的字段，或者执行文件可能有一个 8 位的 cookie。在这些情况下，表示数据的数据类型需要*恰好*正确的大小。\n\
  \n内核在 `<asm/types.h>` 中定义了这些显式大小的数据类型，该文件由 `<linux/types.h>` 包含。表 19.2 是完整的列表。\n\
