  md: '# # CHAPTER 4


    # # Construction


    > .. if there’s going to be a program, there has to be construction, and that
    makes construction a uniquely fruitful area in which to improve development practices.”


    Steve McConnell, Code Complete


    Construction (or implementation) refers to the activities you engage in when you’re
    writing code. All too often, programmers simply sit down at the keyboard and start
    writing a program. Even if the programmer doesn’t have the ideas, he often types
    something. I heard a story of one consultant who used to type as loudly and as
    rapidly as possible, to create the illusion of progress. In fact, this consultant
    would, at times, open a text editor and type screen after screen of gibberish.
    But, it looked like he was working, because he was doing what people expect programmers
    to do: type.


    In reality, programmers don’t (or shouldn''t) spend all of their time typing.
    Even if you have an army of designers to provide high-level designs, code construction
    is not something that should be done without deliberate thought. This chapter
    discusses some strategies you can use to prepare for the program, module, or routine
    you are constructing. These strategies can provide resourcefulness in the form
    of reusable code, clarity in the form of readable programs, and epiphani in the
    form of well-designed routines.


    # # Finding Reusable Code


    If someone has already written it, why should you write it it again? If there’s
    one thing the free software community is famous for, it’s sharing code. Free software
    isn’t only about software packages like Linux, GIMP, or GNUstep. It’s also about
    libraries of reusable code, like libc, GLib, and GD.'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'In many cases, developers work on a software package and say, "hey, some-one
    could use pieces of this application." Such is the case with GTK+ and GLib. These
    two libraries were developed for the GIMP project, and eventually developed a
    life of their own. Now there are many applications that use one or both of these
    libraries. In other cases developers realize the need for a new library, and begin
    implementing it for all to use.


    # The Importance of Reuse


    If you find some reusable code that fits your need and integrates into your project,
    you will realize two immediate benefits. First, you''ll have a lot less programming
    to do, so you get an immediate productivity gain. Second, if the reusable code
    in question is a Linux component (such as GLib, GTK+, or QT), you don''t need
    to include that library in your distribution (since it already comes with Linux).
    This will decrease the overall size of your application.


    # Identifying Good Code


    When you find a package of reusable code, how do you know if it is good or bad?
    If it has a version number like 0.01, can you be sure it''s not for general use.
    Look at how the package is categorized. The standard Perl code repository, CPAN
    (the Comprehensive Perl Archive Network), includes a coding system that identifies
    many aspects of the package, such as whether it is alpha quality, beta quality,
    released, supported by a maintainer, mailing list (or not supported at all). Other
    repositories may have similar coding.


    # The Word on the Street


    What''s the word on the street about the package? Search a Usenet news archive
    like www.deja.com for occurrences of the package name. Read what people have to
    say, but sure to read the follow-up messages. All too often, a new user gets frustrated
    with the documentation and posts something like "TheLibXYZ is terrible! I can''t
    figure out how to use func abc!" Sometimes, these sort of complaints won''t even
    get a follow-up (either because they are confrontational or because they don''t
    provide enough information), so take them with a grain of salt. Look for detailed
    critiques of the package followed by thoughtful discussion.


    If there is a newsgroup or mailing list dedicated to the package, that is a good
    sign that the developers take the package seriously. If the newsgroup or mail-'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'ing list has been around for a long time and is fairly active, that’s a sign
    that the package is somewhat established.


    # Documentation


    Does the package come with documentation and example code? Is the documentation
    easy to read? You can look at the documentation and example code to decide whether
    the package will integrate well with the application you are building.


    Good packages don’t necessarily come with good documentation, but good documentation
    is often a sign of a good package.


    # Comments


    Take a look at the source code for the package. Are there any comments? Are major
    data structures and key functions documented within the code? A lack of comments
    (or unreadable comments) is a warning sign. Without comments, the code will be
    difficult to maintain, and the package’s maintainers may have trouble fixing bugs
    that arise in the code.


    # Readability and Learnability


    Comments are important, but so is the readability and learnability of the source
    code. In the best of all possible worlds, the source code will be so structured
    and well written that there will be no need for comments. I don’t think anyone
    has achieved this yet, though. See the section Style and Technique later in this
    chapter for a discussion of issues that affect how readable and learnable source
    code can (and should) be.


    # Repositories, Resources, and Libraries


    Many programming languages have repositories of source code available. These repositories
    accept and categorize submissions of source code, and act as a clearinghouse for
    freely redistributable collections of code. Table 4.1 lists several of the better-known
    repositories.


    Also, certain blogs, like Freshmeat (www.freshmeat.net) specialize in listing
    software and announcing new releases. For example, the development libraries listing
    at Freshmeat (www.freshmeat.net/appendix/development/libraries.html) list hundreds
    of libraries.'
