    # Words of Caution


    Be careful when using transactions! If you use a transaction that might block
    another operation, make sure to follow two rules:


    +   ■ Don''t let the program pause for user input during a transaction.


    +   ■ Do your thing as quickly as possible, and get out of there and release your
    locks.


    Also, make sure that all parts of your program are following the same rules. If
    you are using shared locks in some places that perform updates, and no locks in
    others, it might be possible for lost updates to occur. If you are updating data,
    make sure you acquire locks in the same way each time, to ensure that the database
    server does the correct thing.


    # Administrative Issues


    To use your freshly installed database without hassle, you need to take care of
    some issues. This section does not addressing ongoing security or maintenance
    concerns, but points out issues that will come sooner or later. You will find
    that there are some server-specific discussions of other issues in the database-specific
    sections earlier in this chapter. This section is intended as a supplement to
    those discussions.


