    The point of bringing up all these things we don''t have to worry about is not
    to make you hate and fear assembler (although that is a natural human reaction),
    but to point out that these system-level functions need to exist for any type
    of message passing program to work. The fact that the compiler will provide all
    of these functions for message passing inside a single process/flat memory architecture
    is a great help. What we are now going to examine are the tools that will implement
    these system-level functions in alternate architectures, out-side of the process
    space, passing messages between multiple programs.


    As an example, let''s look at another simple book example. In this example, we
    are assuming a book component (Wiley.Book) has been shipped to us in binary format
    by the publisher. The book component is loaded on demand by our application, though
    it runs in another process. In this case, we talk to the book through a local
    placeholder, or stub, which forwards requests to the real object. If the book
    was running in-process, we would just make calls directly on the object.


    Here is the code:


    ```

    Book bk = (Book) CreateObject("Wiley.Book");

    int x = bk.setCheckedDate("01-01-2000");

    ```


    Now, let''s start looking at the things we don''t have to worry about. By using
    a component object model, we don''t have to:


    +   - Find the program identified by "Wiley.Book"

    - Load the "Wiley.Book" program into memory or find an already running version
    of the program

    - Manage the execution state, offsets, or concurrency between the local "Wiley.Book"
    placeholder and the remote "Wiley.Book" instance

    - Find some piece of shared memory to place the argument

    - Do any data type translations to turn data types supported by the local Book
    program into data types supported by the remote "Wiley.Book" program


    All of these functions are provided by the component object model''s infrastructure,
    and makes things a lot easier when attempting to pass messages between processes.
    This is similar to CORBA, except that the two'
