  md: 'The code is pretty straightforward: Find the file, open it, record the checkout
    data as a tab-separated series of strings, and close the file. From the point
    of view of our checkout program, we''ve done our job; the program has adequately
    recorded which book is being checked out, when it is due, and who is checking
    it out. However, from the point of view of programs that might call the checkout
    function, the implementation is horribly flawed in that it doesn''t take into
    account special properties of files: that the file may be used by consecutive
    executions of the program, and that the same file may be used by concurrent executions
    of the program.


    The problem with consecutive execution is clear: While the checkout data will
    be persistent after the program runs, the next book that gets checked out will
    overwrite the data for the previous book!


    The way in which the operating system deals with this is called a file pointer.
    While the file pointer records the current offset of read and write operations
    from the beginning of the file, and allow programs to reset the pointer to the
    beginning of the file or advance the file pointer an arbitrary number of bytes
    into the file. Most file interfaces extend this functionality by offering two
    versions of the open function; one opens the file and sets the file pointer to
    the beginning of the file, the other opens the file and advances the file pointer
    to the end of the file. The second version of the open function is generally referred
    to as *append mode*. So to fix the consecutive execution problem, the line of
    code should read something like this:


    ```

    f.open(FILE_APPEND);

    ```


    For operating systems that don''t support preemptive multitasking, the problem
    with concurrent execution is moot (since two programs can''t write to the file
    at the same time). However, since this book is about a real operating system,
    we need to worry about what happens if two programs try to access the file at
    the same time.


    The root cause of the problem is to ensure that we have the correct book, on the
    correct date, from the correct patron, all three calls to write need to occur
    exactly as written. If the calls to write() from one instance of the checkout
    program are interleaved with calls to another instance of the checkout program,
    we are no longer recording correct data (because, milliseconds after one process
    opens the file, process two writes to the sample process one wants to write to,
    before process one has a chance to write anything at all). The way in which the
    system deals with this is called a *file lock*. What the file lock does is keep
    any other program from opening the file until the first program has closed it.'
