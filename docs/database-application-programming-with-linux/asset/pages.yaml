  md: '# Using the DBI


    To use the DBI, you need to first connect to a database server. Once you have
    made the connection, you can send a SQL statement to the server, and process the
    result set, if any is returned.


    # Connecting to a Database


    To connect to a database server, you need to use the DBI->connect(DSN, USER, PWD)
    method, where:


    DSN is a DBI data source, or connection string. The DBI connection string is a
    combination of the DBD name suffix from Table 12.1 (everything after DBD:) and
    information that the driver uses to locate the database server and connect to
    it. For example, to connect to the *inventory* database on the PostgreSQL server
    on the local host, using DBD::Pg, the connection string would be "dbi:Pg:dbname=inventory".


    USER is the user name.


    PWD is the password.


    Table 12.2 lists some drivers, and the basic connection strings that the driver
    supports,


    DATABASE is the name of the database.


    HOST is the name of the machine the database server is running.


    Table 12.2 Connection Strings for Various Drivers


    | DATABASE | DRIVER | CONNECTION STRING |

    | --- | --- | --- |

    | PostgreSQL | DBD::Pg | dbi:Pg:dbname=DATABASE<br>dbi:Pg:dbname=DATABASE;host=HOST<br>dbi:Pg:dbname=DATABASE;host=HOST,port=PORT
    |

    | Sybase | DBD::Sybase | dbi:sybase:database=DATABASE<br>dbi:sybase:database=DATABASE;server=SERVER
    |

    | Oracle | DBD::Oracle | dbi:Oracle:SID=SID<br>dbi:Oracle:host=HOST,sid=SID |

    | Mini SQL | DBD::mSQL | dbi:mSQL:database=DATABASE<br>dbi:mSQL:database=DATABASE;host=HOST<br>dbi:mSQL:database=DATABASE;host=HOST,port=PORT
    |

    | MySQL | DBD::mysql | dbi:mysql:database=DATABASE<br>dbi:mysql:database=DATABASE;host=HOST<br>dbi:mysql:database=DATABASE;host=HOST,port=PORT
    |'
  merge: -1
  pgno: 353
- img_proc: true
  md: "PORT is the TCP/IP port that the database server uses. Unless configured the\
    \ database to use a non-standard port, you will not usually need this.\nSID is\
    \ the Oracle System Identifier that you can find in the /etc/oratab file.\nSERVER\
    \ is the Sybase server name designated in the ~sybase/interfaces file.\n\nTo connect\
    \ to the database, you should follow these three steps:\n\n+   1. Import the DBI\
    \ module.\n2. Invoke the DBI->connect() method with the DSN, user name, and password.\
    \ This gives you a database handle, named dbh in the examples that follow.\n3.\
    \ Check for connection errors.\n\nWhen you are done with the connection, you should\
    \ disconnect. This example (connect.pl) makes a connection to a PostgreSQL database\
    \ server:\n\n```\n#!/usr/bin/perl\n# Step 1. Import the DBI module.\n#\nuse DBI;\n\
    \n# Step 2. Create a connection.\nmy $dsn = 'dbi:Pg:dbname=postgres';\nmy $user\
    \ = 'postgres';\nmy $pass = '';\nmy $dbh = DBI->connect($dsn, $user, $pass);\n\
    \n# Step 3. Check for errors.\n#\nunless (defined $dbh) {\n    die $DBI::errstr;\n\
    } else {\n    print \"Connection successful.\\n\";\n}\n\n# Final Step. When you\
    \ are done with the database\n# connection, disconnect.\n#\n$dbh->disconnect();\n\
    ```\n\nTo run this example, simply change to the directory containing the Chapter\
    \ 12 examples (you can get the example programs at this book's companion Web site\
    \ at www.wiley.com/compbooks/jpson). Then, run the command perl connect.pl. You\
    \ may need to change the dsn, $user, and $pass variables"
