    # Reduce Memory Load


    When someone is reading your program, she has to juggle a lot of things in her
    short-term memory. For instance, a reader of your program needs to keep the name
    of the file, module or class, and procedure in mind. In addition to these chunks
    of information, the reader also needs to track any variables or control structures
    that are in the current routine.


    The typical American telephone number is a good example of the number of pieces
    of information that can be reliably kept in short-term memory: seven digits, or
    seven pieces of information. If there are too many pieces of information that
    readers of your program need to keep track of, they might have a hard time understanding
    your program.


    McConnell discusses many things you can do to reduce the burden on programmers''
    short-term memories. The following section discusses a few techniques.


    Keep references to variables together. McConnell suggests that you shouldn''t
    spread references to variables all over your program. You can consolidate references
    to variables by keeping an eye on the variable span and variable live time.


    Variable span measures the distance between references to a variable. If you can
    minimize the size of the span, you can avoid unnecessary burdens on your users.
    In this example (not counting comments or whitespace), $distance has a span of
    one (one line between references to $distance) and Stime has a span of zero (no
    lines between references to $time):


    ```

    my $distance = 100; # distance in miles

    my $time = 2.5; # time in hours

    ```


    ```

    # Calculate speed, in miles per hour.

    #nmy $speed = $distance / $time;

    ```


    Similar to span is variable live time, which measures how many lines a variable
    is live. Consider the following example:


    ```

    01 int emp_index = 0;

    02 int emp_salary = 0;

