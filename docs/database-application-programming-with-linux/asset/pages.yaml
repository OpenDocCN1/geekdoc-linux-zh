  md: '# Collaboration Diagram


    A collaboration diagram shows how objects cooperate. Let''s look at some examples:


    An object (an instance of a class). An instance of a class is shown as a box.
    The name is underlined, and preceded by a colon, as shown in Figure B.9.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_518_0.png)


    Figure B.9 An instance of a spreadsheet object.


    A named object. You can give names to instances by putting the name of the object
    before the colon. Figure B.10 shows sheet1, a spreadsheet with a name.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_518_1.png)


    Figure B.10 A named instance of a spreadsheet.


    Sending a message. Figure B.11 shows how to send a message. In this example, we''re
    passing sheet1 to the Printer, telling it to print the spreadsheet.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_518_2.png)


    Figure B.11 Sending a message to the printer.


    Figure B.12 shows a conditional message, in which case the spreadsheet is only
    printed if a cell A1''s contents it''s OK to print.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_518_3.png)


    Figure B.12 Sending a conditional message to the printer.'
