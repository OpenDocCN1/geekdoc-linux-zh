  md: '# INTRODUCTION


    Welcome to the first edition of Database Application Programming with Linux. This
    book is, for the most part, about building desktop database applications for Linux,
    although the way we address that topic will open your mind to a lot of great stuff.
    If you opened this book hoping to learn how to build an application that uses
    a relational database to store data, and a graphical front-end to interact with
    users, you came to the right place!


    There is one thing we should make perfectly clear: this book does not talk about
    how to develop Web database applications. There are many fine books on this topic
    (Brian has even written a couple of them), and perhaps we will address it in a
    future edition of this book. However, with the growth of desktop application environments
    as KDE and GNOME, we felt challenged to produce a book with a desktop focus. It
    wouldn''t be fair to say that this book is only about plugging databases into
    a pretty user interface. In fact, it''s much more than that. In this book, we''re
    going to look at a lot of things that will help you build better applications,
    and you''ll be able to apply many of these things to other programming endeavors.
    Here''s a list of some of the topics we discuss:


    **Database systems.** In this book, we look at five popular database systems for
    Linux: PostgreSQL, MySQL, Mini SQL, Sybase, and Oracle. Wherever possible (and
    incompatibilities permitting), we have developed example code that works with
    as many of these databases as possible. Differences that were known to us during
    writing and testing are documented where appropriate, and Chapter 9, “Databases,”
    takes a close look at these databases. Two areas we focus on in particular are
    how you can get up and running with the database system of your choice, and how
    each database server deals with specific database development issues. We also
    take a good look at the different data types and formats, two things that are
    confusing when developing cross-database applications.


    If your favorite database system is not covered in this book, we apologize, but
    we had a limited amount of time to produce this book, and we chose these database
    systems we could best deliver the experience of the authors. If you are interested
    in other database systems for Linux, see Christopher Browne''s resource on this
    topic at ntlog.org/~cbrowne/rdbms.html.


    **Conceptual Modeling.** In this book, we spend as much time talking about what
    you must do to prepare for programming as we do about programming itself (I think
    I heard a groan from the back of the room). Don''t—'
  merge: -1
  pgno: 10
