  md: "# CHAPTER 9\n\nWhen RedHat sees a file in /var/lock/subsys that has the same\
    \ name as a script in /etc/rc.d/init.d, it knows to shut it down when the system\
    \ is brought down. Here is a modified version of hellogoodbye for RedHat systems:\n\
    \n```\n#!/bin/sh\n\ncase \"$1\" in\n  start)\n    touch /var/lock/subsys/hellogoodbye\n\
