  md: '# SQL Reference


    QL is the accepted standard for database definition and manipulation. Here, we
    give some examples of standard syntax that will assist you in setting up, populating,
    manipulating, and accessing your databases. Most major and minor database management
    systems (DBMSs) implement one of the SQL standards at least partially. You should
    check the documentation for your own DBMS to determine its specific syntax. However,
    the syntax given here should work in most environments. This short appendix will
    help you with SQL, and builds on the syntax shown in Chapter 2, "Database Design";
    you can find more extensive examples in books devoted to SQL or relational databases.
    A book that has extensive chapters on SQL with many examples of syntax supporting
    a well-developed schema example is Elmasri and Navathe’s, Fundamentals of Database
    Systems, Third Edition (Addison-Wesley, 1999).


    NOTE The examples in this appendix use a semicolon as the command delimiter. See
    SQL Monitors in Chapter 9, "Databases," for a description of how to send these
    commands to the database, and which delimiter you must use.


    # CREATE TABLE


    Use the CREATE TABLE statement to create a new table. We introduced the CREATE
    TABLE statement in Chapter 2. Let’s look at some special clauses supported by
    this statement.'
  merge: -1
  pgno: 504
- img_proc: true
  md: '# The CONSTRAINT Clause


    On database servers that support it, the CONSTRAINT clause to restrict the range
    or types of acceptable values in a column. For example, values that are not permitted
    to be null are labeled NOT NULL. Also, the primary keys can be specified using
    the keyword PRIMARY KEY. The CHECK constraints can be used to define the acceptable
    range of values for a column.


    Be aware that some DBMSs differ on the defaults for some of these constraints,
    most assume that a column can be NULL unless specified with NOT NULL, while a
    few such as Sybase assume the opposite—that a column is NOT NULL unless designated
    with NULL.


    For a complete discussion of this clause, see the section Invalid Values in Chapter
    9.


    # Enforcing Relationships


    On some database systems, you can use special clauses of the CREATE TABLE command
    to specify the types of relationships between tables. These relationships are
    enforced in such a way that, for example, you can''t delete an author who still
    has books listed under her name. For a complete discussion of this topic, see
    the section Declarative Referential Integrity in Chapter 9.


    # Data Types


    There are a variety of data types available in SQL. The types char , int, small-float,
    real, and double are usually available. In addition, there is a date type, which
    (usually) requires data in the form YYYY-MM-DD, to represent month, year, and
    day. There is also a timestamp that permits the specification of time using HH:MM:SS
    for hours, minutes, and seconds. For a discussion of dates and data types, see
    the section Data Types in Chapter 9.


    # Autoincrement Columns


    In some cases, you will want to define columns that are incremented in sequence
    time a row is inserted. This is useful for defining primary keys, and guaranteeing
    that each row has a unique value for its primary keys. There is a discussion of
    this topic in Chapter 9, in the section Generating Unique Values.'
  merge: -1
