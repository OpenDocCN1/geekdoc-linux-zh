    Design’). This is what you''d expect me to do with a large application written
    in a 3GL: I am writing a program that deals with the general case of a problem,
    lots of exception han-dling, is clearly coded and commented, and is going to be
    used and reused by other programmers and users (I am wearing the hat of a programmer).


    But happens when I''m working on a spreadsheet, and I need to write a macro subroutine
    to price my personal stock portfolio? Well, since the spreadsheet has support
    for a scripting language, I''ll probably write something quick and dirty in Perl
