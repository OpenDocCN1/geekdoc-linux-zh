    # Tools Selection


    Given that there are two viable engineering methodologies available to you, how
    do you decide which one to use? 3GL languages have the benefits that they are
    powerful and flexible, and have access to the most recent hardware and infrastructure
    innovations. 3GL applications generally require less support at the Help Desk
    level, and 3GL compilers and libraries are generally freely available and widely
    distributed. 3GL languages have the drawbacks that they require an up-front investment
    of time, in both terms of application design and programmer training, and that
    they require an ongoing investment in testing over the life of the project.'
