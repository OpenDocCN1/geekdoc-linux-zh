  md: '# Use Cases


    A use case is a description of the scenarios that follow from interacting with
    the concepts found in the requirements. For example, if your requirements included
    concepts such as a cash register, products, and customers, a use case would describe
    how these concepts interact when someone purchases a product. The purpose of use
    cases is to enhance the understanding of the requirements. You should use the
    requirements as a basis for the use cases, but use brainstorming sessions with
    the customer to develop the use cases.


    Use cases tend to follow a common format, but there is no canonical use case format.
    You may use as much or as little of the format as you''d like, and you can embellish
    as you see fit.


    Fowler says “use cases provide the basis of communication between customers and
    developers in planning the project.” At a certain point, you will depart from
    artifacts that can be easily understood by the users, and will begin focusing
    on developing artifacts that get closer to code. Because it is important to get
    requirements correct before design, make sure you take full advantage of use cases
    as communications tool between you and your customers.


    Your users can provide what Fowler refers to as domain expertise (knowledge of
    the area affected by the problem you are trying to solve). Make use of this expertise.


    # Actors and Events


    Use cases are made up primarily of actors and events.


    Actors are the participants in use cases. They represent things (users, operators,
    pilots, and other intelligent beings) that initiate actions. Actors don''t have
    to be human, though. Computer systems, and electronic devices, for example, can
    be actors as well.


    Events are what happen as the result of something an actor does. Most events will
    result in other events, and in some cases, the same event may have alternative
    outcomes.


    # Identifying Use Cases


    How do you start writing a use case? The only constraint is that you must write
    enough use cases to account for all the requirements that relate to how participants
    interact with the problem domain. If you have followed a structured format for
    writing requirements, you can include a reference to the'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'numbered parts of the requirements that a particular use case addresses (such
    as "1.1," "3.1.1.1," or "4.2").


    Within these constraints, you still need to decide where to begin. Larman cautions
    against writing use cases for individual steps. Instead, look for larger processes
    that have many steps. For example, you would not model the system reports total
    fines as a use case. Instead, this is a step in the "Pay Fines" use case from
    our library example.


    Larman suggests two methods for identifying use cases:


    +   * Identify all the participants involved in the requirements, and then identify
    the processes or events that are involved in (actor-based).

    * Identify the events that are indicated by the requirements and relate them to
    actors and use cases (event-based).


    In this example, we take an actor-based approach. If you look at the requirements,
    the only actor that is explicitly mentioned is the Patron. But someone needs to
    facilitate the Patron''s interactions with the system. If you didn''t know anything
    about libraries, you could ask your user (a domain expert) who this is. We''re
    pretty sure they''d tell you this person is a librarian. As far as we know from
    looking at the requirements, the system doesn''t need to know anything about library
    (unless that librarian happens to be a Patron). Nevertheless, the librarian is
    responsible for coordinating the system processes, such as loaning out a book
    or generating a report. So it is clear that the librarian is an actor in the system.
    To identify actors and events, inspect the requirements. If you have more than
    one person involved in this inspection you can compare notes and brainstorm about
    the list you come up with.


    You should write a use case for each event you identified. Based on an inspection
    of the requirements, here are the actors and the events they initiate:


    | Actor | Events |

    |---|---|

    | Patron | Borrow Books Return Books Pay Fines Toggle Borrowing History (at the
    Patron''s request, turns off tracking all books a patron has borrowed) |

    | Librarian | Generate a Report |


    # Use Case Diagrams


    Use diagrams, while simple, can be useful to illustrate use cases and the actors
    who participate in them. The actors are shown as stick figures, and'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'the use cases are shown as ovals. This is not too fancy. Eventually, the sequence
    diagrams will illustrate the details of activities that the use cases describe.
    For now, the use case diagrams are useful for someone who is unfamiliar with the
    problem to understand it at a very high level. Figure 7.2 shows the use cases
    we listed in our actor/event example.


    The elements of a use case diagram include:


    +   - Each use case, shown as an oval

    - Each actor


    For each use case the actor participates in, a line is drawn from each actor to
    that use case.


    # Writing Use Cases


    As you write use cases, keep the following in mind:


    Use cases should enhance your understanding of the problem. If it is particularly
    illuminating to create a particular use case, then do so.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_167_0.png)


    **Figure 7.2** Library system use case diagram.'
