    # Modular Decomposition


    Once you have completed the previous steps, you can move on to breaking the system
    into smaller pieces. One of the biggest problems with large software projects
    is that it is not possible for any one person to comprehend the system as a whole.
    When you break the system down into smaller pieces, you create manageable components
    that can be understood by one person. In Chapter 8, “Object-Oriented Design,”
    we look at techniques for designing systems that are made of manageable components.


    # System Design


    There are three activities involved in designing the types of applications we
    are covering in this book: database design, user interface design, and module
    or object design. Once these activities are completed, developing the system becomes
    quite manageable. Although this book presents them in a specific order, don''t
    look at these activities as something that must be performed one at a time, in
    sequence to completion. It is much more iterative than that. In fact, you may
    complete your database and user interface designs, and when you move on to object
    design, you may learn something that sends you back to user interface design.
    The reality is that these activities feed into one another.


    **Database design.** This activity models the system data in a manner that can
    be easily processed by a relational database system. Unfortunately, the output
    of this process is not always something that is intuitive to humans. Instead,
    the output of the database design process ensures that the data is correct, consistent,
    and efficient. The burden falls on the user interface design to present a pretty
    face. Database design is covered in detail in Chapter 2.


    **User interface design.** This activity models the system’s data and behavior
    in a visual manner. User interface design involves many factors that affect the
    human cognition, as memory (human, not computer memory) issues, spatial organization,
    and aesthetics. User interface design is discussed in Chapter 3.


    **Module or object design.** Object-oriented analysis and design models the system’s
    data and behavior in a way that is close to how humans think of real-world objects.
    Modular design isolates related processes and data in a n'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'way that maximizes code reuse. Chapter 4, "Construction," discusses modularity,
    and object-oriented concepts are introduced in Chapter 5, "Object-Oriented Programming."
    Chapters 7 and 8 discuss object-oriented analysis and design.


    # Summary


    Before you start building software, it''s important to make sure you are solving
    the right problem. To this end, there are four areas you need to pay special attention
    to:


    **The problem definition.** This answers the question, "why am I building this
    system?" It''s the most important thing to get right. If you don''t get the problem
    definition right, you run the risk of solving the wrong problem.


    **Requirements analysis.** In order to build up a document that serves as a roadmap
    for the system, you need to analyze the problem. To do this, you will need to
    become involved with the stakeholders, understand their business needs, and pay
    attention to many details.


    **The formal requirements document.** Using a formalized, organized approach,
    you can build a document that unambiguously specifies what it is you to build.
    As you build the system, you will need to exert control over the changes that
    will be made to the requirements.


    The prototype. Once you have developed this document, you may need to validate
    the requirements with a prototype.


    **System architecture and design.** Before you can proceed to the design of the
    system objects, the database, and the user interface, you must determine the architecture
    of your system. This encompasses three stages: system structuring, control modeling,
    and modular decomposition. The concepts discussed in Chapters 4, 5, 7, and 8 can
    be applied to modular design.


    This chapter offers the image of building a physical structure as a metaphor for
    constructing a software system. It''s important to keep in mind that one metaphor
    does not fit all cases. In practice, the building metaphor is most appropriate
    to the specification and design stage of a software project. Where it still fits
    in other stages, we''ll build on this metaphor. However, in Chapter 6, "Software
    Engineering," we''ll take a look at some of the advantages that the open source
    approach can offer over (or in combination with) the approaches discussed in this
    chapter.'
