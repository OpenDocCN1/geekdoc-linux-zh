    # # Generating Unique Values


    When you use a primary key, you need a way to come up with values for it each
    time you insert a new row. Each database server has a different way of dealing
    with generating these values.


    **MySQL.** Under MySQL, you can declare a primary key column with the auto_increment
    attribute:


    Then, when you insert a value into the table, make sure you specify NULL for the
    primary key:


    ```

    INSERT INTO people (name

    ```


    This automatically increments the primary key column for each insert:


    ```

    mysql> SELECT * FROM people;

    +-----------+

    | name  | id |

    +-----------+

    | Brian | 1  |

    | Oscar | 2  |

    +-----------+

    ```


    2 rows rows in (0.00 sec)


    **PostgreSQL.** Under PostgreSQL, create the table as you normally would, but
    also create a sequence object for that table:


    ```

    CREATE SEQUENCE people_seq;

    ```'
