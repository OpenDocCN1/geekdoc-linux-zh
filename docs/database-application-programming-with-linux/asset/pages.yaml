  md: '# Viewpoint Model for Analysis


    Once you have the raw requirements written down and validated, you can make them
    easier to understand and absorb by using several representational models. For
    example, Somerville suggests a viewpoint model. Used in conjunction with the raw
    requirements, viewpoint model diagrams can provide a great deal of insight about
    a system, and serve as the basis for the requirements document, system architecture,
    and detailed system design.


    The viewpoint analysis takes a look at the requirements from the viewpoint of
    different users. Figure 1.3 shows a possible viewpoint hierarchy for the timesheet
    requirements.


    Somerville places the viewpoint model within a larger requirements analysis framework,
    which is worth investigating for further research on requirements analysis. For
    the purposes of the analysis in this chapter, the viewpoint hierarchy suffices
    to provide a visual representation of the requirements. This technique can also
    be used as inspiration for user scenarios or use cases (see Chapter 3, "User Interface
    Design" or Chapter 7, "Object-Oriented Analysis") to arrive at a better understanding
    of the requirements.


    # The Formal Requirements Document


    Somerville points out three major problems with requirements that are specified
    in natural language. First, natural language is ambiguous. Anyone who has read
    a document in legalese to the extremes knows which we must go to make natural
    language precise. Second, a free-flowing natural language description can fail
    to distinguish between important categories of information (such as functional
    versus nonfunctional requirements, described in the next paragraph. Finally, requirements
    that are expressed using informal nat-


