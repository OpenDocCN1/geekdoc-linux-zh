    the grid with data when the user clicks the Execute Search button. It does so
    by first looking at the currently selected company id (using) and constructing
    a SQL query similar to SELECT name, city FROM WHERE company = selected-id. Then,
    it puts results into a recordset, and associates that recordset with the grid.
    Finally, it calls gtk_widget_show, which refreshes the grid.


