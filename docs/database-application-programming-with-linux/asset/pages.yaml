  md: '# Database Design


    NF is not limited to entities that represent relationships. Any entity that has
    a compound primary key should go through this process.


    To determine whether the database is in 2NF, we must examine whether each attribute
    in the Author Of and Borrows entities and consider whether that attribute is dependent
    on the entire primary key, or just one part of the primary key.


    What does it mean to be dependent on the entire primary key? Consider Borrows:Due
    Date and Borrows:Return Date. The attributes Patron ID, ISBN, and Borrowed Date
    uniquely identify a particular loan, and the Due Date and Return Date answer answer
    the “When was a particular loan, and when the loaned material returned?” Consequently,
    we say that these two attributes are dependent on the entire primary key (the
    combination of Patron ID, ISBN, and Borrowed Date).


    What does it mean to be dependent on part of the compound primary key? Consider
    Borrows:Hold Requested and Borrows:Requestor ID (remember, Requestor ID is another
    patron, the patron the loan is made to, but someone else wants the book). Are
    these attributes related to a particular loan, the patron who borrowed a book,
    or just to a book? One way to phrase this question is that a user could answer
    it is, “Can a patron put a hold on a book even if it’s not currently lent to someone?”
    Let’s suppose that the answer to this is yes—perhaps the library allows patrons
    to hold a book by telephoning the library or using the Internet. This would allow
    a patron to hold a book between the time she realizes she needs it and the time
    she can get to the library to actually check it out.


    So, the attributes Hold Requested and Requestor ID are only dependent on one part
    of the compound primary key: the ISBN, which corresponds to the Book entity. Further
    investigation (conversations with the imaginary librarians) reveals that only
    one person can have a hold at a time, and the library does not want to track a
    book’s hold history. If we needed to issue multiple holds, or track the hold history,
    then the hold information could go into a new entity. Since this is not the case,
    it makes perfect sense to move these attributes into the Book entity.


    We still have one other entity to consider, Author Of. Fortunately, the only attributes
    in the Author Of entity are those that make up the primary key, so there is no
    need to make any changes to this entity. Figure 2.4 shows the database in 2NF.


    To move a database to 2NF:


    +   1. Identify any attributes that are not dependent on all the attributes that
    make up a compound primary key.'
