    # Configuring Data Sources


    Before you can connect to a data source, you''ll need to configure the gdalib
    file. You can do this by copying and modifying the gdalib.sample file, which is
    included with the gnome-db distribution, or you can use any of the tools designed
    for this purpose.


    The GDA Manager (gda-mgr or gda-manager) is the GNOME-DB configuration utility,
    which you use to create or modify system-wide and personal data sources. A personal
    data source is a data source that''s available to a particular user, while a system
    data source does not determine access; you still need to supply a username and
    password when you log in, and it is possible that two users have different data
    sources that ultimately point to the same database and server. You think of a
    data source as a convenient tool for grouping information about a connection so
    you don''t have to remember every time you want to log in.'
