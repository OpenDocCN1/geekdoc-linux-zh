  md: '# A Table Model for JDBC


    Now, let''s build a table model that uses JDBC and SQL to get its data. In the
    interest of keeping things simple, this table model will operate in read-only
    mode. you won''t be able to edit any of the columns, so there is no way to propagate
    changes back to the database. However, the companion Web site at www.wiley.com/combooks/jepson
    includes an example program, JDBCTableModel.java, that provides read-write capabilities.
    In addition to the responsibilities of a table model outlined earlier, the JDBC
    table model will:


    **Open a connection to the database server.** To facilitate this, we''ll make
    the constructor for the class to take a JDBC URL, a user name, and a password
    as arguments. In the constructor, we''ll create a connection, and assign it to
    a field name Connection.


    **Issue a query and store the results.** This is handled in the fetchData() method.
    The fetchData() method takes an SQL query as an argument, and uses the Connection
    created in the previous step to send the query to the server. To put this data
    into a form that can be easily used by the model, fetchData() performs the following
    steps:


    +   1. Issue the query and get the result set. See the earlier section Process
    Result Sets for more details on how this works.

    2. Get a ResultSetMetaData object from the result set. This object contains a
    lot of information about the result set, such as the names of all the columns.

    3. Store the column names. Use the ResultSetMetaData object to put all the column
    names into a Vector called column_list. Before this, remove any elements in that
    vector that may be left over from a previous query.

    4. Store the result set''s data. Put the results into a data structure similar
    to the multidimensional array we saw in the SimpleModel example. You won''t know
    the number of rows until ResultSet.next() returns false, so it''s easiest to use
    the Vector object, which is a growable array that you can add elements to on the
    fly.


    A Vector can contain any type of object. To store a result, use one Vector element
    for each row. To store all the column values for that row, you need to use another
    Vector for each element. For example, to fetch a value from the Vector named rows,
    you''d like to do something like:


    ```

    String val = rows[1][2]; // Get the 2nd column from row 1.

    ```


    Instead, you need to first get the Vector that corresponds to the row:'
