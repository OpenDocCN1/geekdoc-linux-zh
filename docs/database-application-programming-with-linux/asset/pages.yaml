    of software engineering remain is the result of a failure in classical software
    engineering and, specifically, the failure of software engineering to incorporate
    the possibilities of the global Internet.


    # ## The Cathedral and the Bazaar


    Eric Raymond, in his provocative series of essays, “The Cathedral and the Bazaar,”
    (www.tuxedo.org/~esr/writings/) brings the example of open source, community software,
    and specifically the development of the Linux operating system, to illustrate
    how the failure of classical software engineering to address the central problems
    of software development can be corrected. The crux of Raymond’s argument, as it
    pertains to classical software engineering, is that by opening your source code
    to the community of developers and users of the global Internet, you can bring
    sufficient additional resources to bear on its development, testing, and maintenance
    problems. Further, you not only overcome the exponential issues of communication
    and regression testing, but create software that has the functions users want,
    rather than just those specified in the requirements document and enforced in
    the body of test cases.


    Using the Internet reduces communication costs significantly. Communicating via
    email is considerably more efficient than communicating face to face. Because
    you have a record of the body of questions and answers over time, you can create
    a compilation of frequently asked questions (FAQs), which brings the same sort
    of benefits to software engineering communication that base classes bring to OO
    programming.


    Using a mailing list means that you can effectively clone the project lead. The
    questions that the project lead previously had to respond to personally can now
    be answered by anyone on the list who has the answer (and answers to frequently
    asked questions can make their way on permanent lists of such answers, called
    FAQs).


    Using the Internet enormously increases the number of developers available for
    a project, with a rate of growth that is greater than the growth in the communications
    cost. If you have five developers, and you try to add five more developers, the
    communications overhead will have a negative impact on the project. However, if
    you add 50 Internet developers, the overall effect will be positive, despite the
    increase in communications overhead (which is mitigated by FAQs and mailing lists).
    In addition, if par-'
