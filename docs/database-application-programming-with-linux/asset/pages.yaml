  md: 'Subject doesn''t need to know anything about the true identity of the Observer.
    Item knows it is being watched by a bunch of Observers, but it doesn''t know who
    they are.


    # NOTE


    The notification that is sent to each observer shouldn''t carry extra information:
    It should only tell observers that something has changed. It''s to the observers
    to discover whatever data they need. If the Item communicated its price to the
    Observer instead, coupling would be increased. The Subject wouldn''t know what
    the Observer wants—as as far as it is concerned, the Observer might be interested
    in something else, such as the starting bid or some other piece of data.


    The Observer pattern is ideal in circumstances where the Observer already knows
    about the Subject. By applying this pattern, you solve the notification problem
    without increasing coupling.


    Figure 8.4 shows a class diagram that shows the Item, Bidder, and Observer classes.
    The filled diamond in some of the relationships indicates composition, that one
