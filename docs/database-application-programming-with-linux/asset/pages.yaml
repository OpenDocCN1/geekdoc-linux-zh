  md: "What do you do with an algorithm that wastes so many CPU cycles? It would be\
    \ much better if you could get the numbers to increase in a linear, quadratic,\
    \ or logarithmic fashion. Both Skiena and Flamig discuss how to compute the complexity\
    \ of algorithms. The ideal algorithms will progress at a logarithmic or linear\
    \ rate. Table 4.5, based on Table 1.1 from Practical Algorithms in C++, shows\
    \ where progressions can lead.\n\nFunctions that have a constant complexity function\
    \ (not shown in Table 4.5) may also be desirable. These functions take the same\
    \ number of steps, no matter how large the input. If the constant is small enough\
    \ (one or two steps would be nice), this level of complexity is desirable. However,\
    \ if the constant is huge (such as 4 million steps), a constant complexity is\
    \ less desirable.\n\nAs it turns out, it is possible to convert some exponential\
    \ algorithms to something more manageable. Skiena suggests something similar to\
    \ the following algorithm:\n\n```\nFibonacci (n):\nIf n is zero, return zero (A)\n\
    If n is one, return one (B)\nAllocate an array f[], with length n.\nSet f[0] to\
    \ 0 (C)\nSet f[1] to 1 (D)\nFor i = 2 to n:\n  Set f[i] to the sum of f[i - 1]\
    \ and f[i - 2] (E)\nReturn f[n]\n```\n\nWhat does this algorithm do? If you feed\
    \ it one or a zero, it gets out of as soon as possible and returns the value you\
    \ want to otherwise. It pre-pares an array of size n, and sets the first two elements\
    \ to zero and one, respectively. Then, it iterates over the remaining elements\
    \ (2 to n) and sets each element to the sum of the two elements before it. When\
    \ it's done, it returns the final element, which is the Fibonacci number you want.\n\
    \n# Table 4.5 The Complexity of Functions, where n Is the Size of the Input\n\n\
    | COMPLEXITY | n = 1 | n = 16 | n = 64 | n = 65536 |\n|---|---|---|---||}{\n|\
    \ Linear (n) | 1 | 16 | 64 | 65,536 |\n| Quadratic (n²) | 1 | 256 | 4,096 | 4,294,967,296\
    \ |\n| Exponential (2²) | 2 | 65,536 | 18,446,744,073, 709,551,616 | Unbelievably\
    \ Huge |\n| Logarithmic (log,n) | 0 | 4 | 6 | 16 (sweet!) |"
