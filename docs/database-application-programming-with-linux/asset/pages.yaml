  md: '# Overview of GNOME-DB


    GNOME-DB is a data access architecture for GNOME that consists of three parts:
    the GDA (GNOME data access) UI library, the GDA client API, and GDA providers:


    The GDA UI Library is a collection of widgets whose contents are dynamically bound
    to a data source. For example, you can define a list widget that is connected
    to a data source: Instead of storing each row, one by one, in the list widget,
    the GDA widget knows how to get its values from a result set. More importantly,
    when a user makes a selection in the list widget, you can find other values from
    the corresponding row (such as the unique ID of the customer name someone selected
    in the widget).


    The GDA Client API is a data access API that performs the same function as ODBC,
    DBI, or JDBC, which is modeled on Microsoft''s ADO (ActiveX Data Objects), and
    has a strongly object-based object model.


    Finally, a GDA Provider is a CORBA server that acts as a gateway to an underlying
    data source, such as an Oracle or PostgreSQL database server, or an ODBC driver
    that connects to a database server on your behalf. If you use the GN-DB ODBC provider,
    you are, in effect, using two data access APIs, GNOME-DB and ODBC: think of it
    as a GNOME-DB to ODBC bridge.


    # Providers and Data Sources


    A GDA Provider is your gateway to a database. However, the GDA Provider only knows
    how to talk to a database server. If you''ve got several database servers, how
    do you tell the provider which database server to connect to? GNOME-DB uses a
    file called gdalib to configure data sources, which consist of the following information:


    +   * Data source name. This is a name that you choose, something to help you
    remember the purpose of the data source. It is the first line of a data source,
    and appears within [brackets].

    * Provider. This is the name of the GDA Provider, a CORBA server that gives the
    GDA client API access to the database.

    * DSN. This is provider-specific information, such as the name of the HOST which
    the server can be found, or the DATABASE (one of many within the database server)
    you want to connect to.

    * Description. A description that explains the purposes of the data source.

    * Configurator. The name of a Bonobo component that is used to configure the data
    source. This is used by the front-end application, as described in the'
  merge: -1
  pgno: 426
