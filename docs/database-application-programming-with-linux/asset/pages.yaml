    # Data Type Sizes


    Some data types, such as CHAR, can take on different sizes depending on how you
    declare a column. For example, when you declare a column as CHAR(50), 50 bytes
    of space are allocated for that column. This means that every row in the table
    will reserve 50 bytes of space for that, even if the column is blank or if the
    data in it only fills partially with a value that is less than 50 bytes in length,
    such as “Hello."


    Some data types, such as DECIMAL, can take on different sizes and precisions.
    For example, a column declared as DECIMAL(10,2) under Sybase or Oracle can have
    10 digits, two of which appear to the right of the decimal point. Actually, some
    database servers interpret this differently: Early versions of MySQL count the
    decimal point as a digit, so you really get seven digits to the left of the decimal
    point. For the record, Mini SQL does not support the DECIMAL data type (but it
    supports the REAL data type, which defaults to a width and precision: It does
    not take a width and precision as an argument). For a list of databases supported
    by various database servers, see Table 9.7, the Data Type Cross-Reference Table
    in Chapter 9.


    # NULL (The Sound of No Hands Clipping)


    There will be times when you don''t know a value, but you need to add some data
    to your database. You know a patron''s name, but not the patron''s middle initial?
    It is not appropriate to leave the patron''s middle initial blank, because there
    is no way to tell if that means the patron doesn''t have a middle initial or if
    the patron''s middle initial is unknown.


    SQL supports a special state called NULL for these sorts of situations. When you
    don''t know the value for a column, you can set it to NULL. Some columns can never
    be NULL, though, such as primary or foreign keys, or data that is too important
    to leave incomplete. For example, if it would be acceptable to let the volume
    of a book remain unknown, you would have trouble if the ISBN or publisher_code
    were NULL: When you try to examine a set of tables like book and publisher, books
    without may mysteriously “drop out” of sight when you issue queries. See the section
    titled Joins later in this chapter for details.'
