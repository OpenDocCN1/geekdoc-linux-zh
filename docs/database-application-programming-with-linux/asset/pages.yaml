  md: '# Table 2.2 Some (Not All) SQL Data Types


    | NAME | PURPOSE |

    | --- | --- |

    | CHAR(1-255) | Short text data, such as names, phone numbers, mixed numeric and
    text identifiers. |

    | INTEGER | Numeric integer data such as quantity, numeric identifiers, and yearly
    salary. Often abbreviated INT. |

    | REAL | Floating point data such as hourly wage, price per pound, and velocity.
    Synonyms include FLOAT, DOUBLE, and DECIMAL. |

    | DATE | Date value, such as August 1, 1999. |

    | TIME | Time value, such as 10:10 A.M. |

    | DATETIME | Combined date and time value, such as 10:10 A.M. on August 1, 1999.
    |

    | BIT | True or false value that indicates one of two states, such as on/off,
    active/inactive, and wet/dry. |

    | MONEY | Currency value, such as $100.95. |


    # Bit or Not?


    Some database servers do not support a bit data type. On those servers, some developers
    choose to use the smallest numeric data type, such as INTEGER or SMALLINT, and
    store a 0 or 1 in the column. The reason they choose the smallest data type is
    that you only need one bit to store a true or false value (real bit columns are,
    as the name suggests, only one-bit wide). It’s a good idea to save space where
    you can wasted space in one column is amplified when there are many rows in a
    table.


    Because this book is targeted at users of a few different database servers, and
    since not every of these servers supports a bit type, we will use INTEGER fields
    in this way. Also, some servers, such as PostgreSQL, support BOOLEAN instead of
    BIT.


