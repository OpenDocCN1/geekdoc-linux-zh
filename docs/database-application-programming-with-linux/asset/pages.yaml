    looking at each of these categories, you''ll see the virtues of information hid-ing,
    and in contemplating how these techniques can be applied to an object-oriented
    approach, you''ll find ways to make your applications stronger.


    **GUI dependencies.** The X Windows system is blessed (or cursed, depending on
    how you look at it) with a wide variety of GUI toolkits. These include Motif/LessTif,
    GTK+, Qt, Tk, and many others. If you write an application that uses a GUI interface,
    you should consider isolating the code that deals with the GUI. This will make
    it easier for you and others to port the applic-ation to any GUI toolkit or to
    systems with radically different sets of fonts and display sizes such as palm
    devices.


    **Nonstandard language features.** Are you using a language extension or library
    that is not widely available? If so, isolate the parts of your program that do
    this in a separate module. It will make it easier to port your applic-ation to
    an environment or platform that does not support the extension or library.


    **Cutting-edge libraries.** Are you using a cutting-edge version of a library
    that has phrases “alpha release,” “developers only,” or “deprecated API” in the
    documentation? If you think the library is volatile, chances are that the interface
    will change. It''s a good idea to isolate the parts of your applic-ation that
    deal with the library into separate modules.


    **Business logic.** Many applications are used to automate or model certain business
    processes. These processes are shaped by rules, policies, and laws. If the laws
    change, so must the program. What do you can to isolate busi-ness logic within
    modules.


    **Areas of potential change.** If you''ve identified an area of the system that
    is very likely to change, make sure to put that part in its own module.'
