  md: '# CHAPTER 15


    # # Introduction to CORBA


    The Common Object Request Broker Architecture (CORBA) is a technology that lets
    objects communicate with each other across networks, between operating systems,
    and in different programming languages. For example, you can create an object
    in C++, run it on a Linux-based system, and connect to it from an object written
    in Java that''s running on another machine operating system (such as Windows,
    Solaris, or MacOS).


    CORBA can also be used to connect objects running on the same system, or even
    within the same process. This feature makes CORBA suitable for building a general-purpose
    component model, as with GNOME''s Bonobo, which uses CORBA for creating compound
    documents (such as embedding a drawing in a spreadsheet).


    CORBA was introduced in 1991 by the Object Management Group (OMG), which continues
    to revise and maintain the CORBA specification, and act as a clearinghouse for
    information (www.omg.org/corba/).


    Why should CORBA be of interest to Linux database developers? Here are some reasons:


    +   - CORBA is the foundation of GNOME''s component model, Bonobo, which supports
    component reuse, embedded objects, and compound documents (in these respects,
    it is similar to Microsoft''s COM/ActiveX). GNOME''s database API, gnome-db, is
    implemented as a collection of CORBA servers.'
  merge: -1
  pgno: 474
- img_proc: true
  md: 'CORBA is an industry-accepted standard for interoperability between CORBA running
    on different systems, different operating systems, and in different programming
    languages. At least two CORBA implementations ship with Linux distributions, and
    one of them MICO has even been ported to the PalmOS platform. Despite competing
    technologies (such as Microsoft''s DCOM and Java''s RMI), CORBA is the most pervasive
    solution for connecting objects together.


    # CORBA Terminology


    CORBA is heavily tied to the object-oriented concepts described in Chapter 5,
    “Object-Oriented Programming,” but expands on many of those concepts (by extending
    the object-oriented paradigm to distributed computing). Here are some CORBA terms
    that will make it easier to understand the examples that follow:


    **Interface.** A language-neutral definition of the functions and data that a
    CORBA object exposes. The interface is a promise that a component will support
    certain functions, and expose certain data attributes.


    **Implementation.** An application that implements all of the features defined
    in an interface.


    **Server.** A process that allows remote and local applications (clients) to access
    an instance of the implementation.


    **Client.** An application that can connect to a server and invoke its methods.


    **Skeleton.** The raw, prototypical definition of the implementation. The implementation
    fleshes out the skeleton.


    **Stub.** The definition of the object that the client actually talks to. The
    client invokes methods defined in the stub; the stub forwards the requests to
    the implementation by connecting to the server.


    **ORB.** The Object Request Broker, software that is capable of acting as a server
    for objects or as a client. As a client, the ORB allows you to locate objects
    and invoke their methods. As a server, the ORB allows clients to connect to the
    object. This software is implemented as a shared library in MICO and ORBit. When
    you execute a client or server, the ORB is started along with the client or server.


    **IDL.** Interface Definition Language, a C++-like programming language to write
    interfaces.


    **IDL Compiler.** This tool converts IDL into source code for you, including stubs,
    skeletons, and header files. Some IDL compilers will also generate'
  merge: -1
  pgno: 475
- img_proc: true
  md: '# Introduction to CORBA


    skeleton implementations that you can fill in with your own code to create full
    implementations.


    **IOR.** Interoperable Object Reference, a string representation of an object
    that a client uses to connect to the object''s ORB. Here is a rough analogy: An
    IOR is to an ORB as a host name is to a server.


    **Object Adapter.** Software that acts as an interface between the object and
    the ORB.


    **BOA.** The Basic Object Adapter. This is the first object adapter in the CORBA
    specification. Over time, it has been mutated by various vendor extensions to
    the point where implementations are not compatible at the source level.


    **POA.** The Portable Object Adapter. This is an object adapter from more recent
    CORBA specifications. It addresses many of the limitations that led to the incompatible
    extensions to BOA, and should be source-code compatible across implementations.
    Using POA, a server written in C++ should be portable across across CORBA implementations
    that support C++.


    **Language Binding.** A connection between a particular language and an ORB. This
    includes libraries, header files, and IDL compilers that support the language
    in question. For example, ORBit''s C binding lets you write clients and servers
    in C.


    **IIOP.** This is the Internet-ORB Protocol. It allows ORBs, including those from
    different CORBA implementations, to talk to each other. For example, ORBit and
    MICO can talk to each other using IIOP.


    Figure 15.1 shows the relationship of some of these items.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_476_0.png)


    **Figure 15.1** Some relationships in CORBA.'
