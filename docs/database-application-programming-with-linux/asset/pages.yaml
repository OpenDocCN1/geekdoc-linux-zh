  md: '# Object-Oriented Perl


    In the next section, we will look at the Tangram framework, which makes it easy
    to move objects between Perl and relational databases. Before we talk specifically
    about Tangram, let’s look at some of the object-oriented features of Perl. Before
    you read this, make sure you are comfortable with object-oriented concepts (see
    Chapter 5, “Object-Oriented Programming”).


    A Class definition in Perl is stored in a package, which contains code that is
    isolated from other code. There is more to Perl’s object-oriented capabilities,
    but packages provide a fundamental feature: isolation of data and behavior into
    logical groups.


    # Packages


    If you have the package Foo, and it contains a variable called $x, that variable
    is different from $x that is contained within another package:


    ```

    package Foo;

    $x = 100;

    package Bar;

    $x = 3000;

    ```


    By default, Perl code goes into a package called main. If you’ve included other
    packages definitions (such as package Foo), you can switch back to main with:


    ```

    package main;

    ```


    You can create your own $x that belongs to main:


    ```

    $x = 30;

    ```


    If you want to refer to your $x, you don’t need to do anything fancy, but if you
    want to refer to the other $x variables, you need to put the package name and
    two colons (::) between the $ and the variable name:


    ```

    print $x, "\n";

    print $Foo::x, "\n";

    print $Bar::x, "\n";

    ```


    Packages can also contain subroutines, such as:


    ```

    package Foo;

    sub test {

    ```'
