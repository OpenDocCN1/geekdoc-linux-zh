- img_proc: true
  md: "# CREATE/DROP Index\n\nTo assure that your database performs well, you will\
    \ want to place indexes on columns used frequently for searches and joins. However,\
    \ indexes were dropped from the last SQL standard as they were viewed as low-level\
    \ constructs, not to appear in the formal definition of the query language. Thus,\
    \ you should look at the specific instructions for your database regarding indexing.\
    \ See Chapter 2 for a few generic commands that work with most systems.\n\n# Putting\
    \ Data into the Database\n\nOnce you have created your database tables, you will\
    \ want to populate (put data into) the database. This is done with the SQL INSERT\
    \ command.\nFor example:\n\n```\nINSERT INTO publisher\nVALUES ('John Wiley &\
    \ Sons, Incorporated', 'New York',\n  '1000 Brick Street, New York, NY 033416,\
    \ 100);\n```\n\nInsert a subset of column values into a given row:\n\n```\nINSERT\
    \ INTO publisher (name, id)\nVALUES ('John Wiley & Sons, Incorporated', 100);\n\
    ```\n\nIf you try to insert a row that is missing a key or NOT NULL column value,\
    \ you will get an error message. Many systems will also generate errors if you\
    \ violate other specified constraints, but this is not always guaranteed. Read\
    \ your documentation to see which constraint types will generate these errors\
    \ and, if so, how it is done.\n\nFor more information, see the section Putting\
    \ Data into the Database in Chapter 2.\n\n# UPDATE\n\nTo update a row in your\
    \ database, use the following syntax:\n\n```\nUPDATE publisher\nSET name = 'Wiley\
    \ Computer Publishing'\nWHERE id = 100;\n```"
  merge: -1
