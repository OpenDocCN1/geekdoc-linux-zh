    # Filtering Result Sets


    Most of the time, you don''t want to retrieve the entire contents of a table.
    Instead, you usually need to retrieve rows that match a given criteria. In this
    case, you will find the WHERE clause handy. The WHERE clause allows you to specify
    a set of constraints on the results before they are sent back to you. The general
    form of an SQL statement with a WHERE clause is:


    ```

    SELECT <column-list>

    FROM <table>

    WHERE <condition>

    [ AND|OR <condition> ]...

    ```


    The <condition> is a logical expression, such as author_id = 100 ("author id equal
    to 100") or publication_year > 1965 ("year of publication is greater than 1965").
    When you use a conditional expression in a WHERE clause, the SELECT statement
    only retrieves rows matching criteria.


    Most conditions will be expressed with one of the operators shown in Table 2.9.


    For example, here is an SQL SELECT that retrieves all books that were published
    after 1965:


    ```

    SELECT title, publication_year

    FROM book

    WHERE publication_year > 1965

    ```


    This SELECT retrieves all books that were not published in 1963:


    ```

    SELECT title, publication_year

    FROM book

    WHERE publication_year <> 1963

    ```'
