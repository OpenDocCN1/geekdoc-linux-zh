  md: 'indexing, record-level locking, and transaction processing to the rescue of
    programmers everywhere.


    While relational databases came to prominence by fixing the nightmarish problems
    of file-based applications, they rose to fame by supporting message passing applications
    with two essential capabilities: stored procedures, which allowed programmers
    to write code that would execute inside the database; and database drivers, which
    allowed programmers to write network client programs that communicate with a remote
    database server without having to write network servers, custom protocols, or
    make direct calls to the socket interface.


    So, without further background ago, let''s return to the checkout example using
    pseudocode and SQL database:


    ```

    Connection conn = getConnection(DATABASE_URL, USERNAME, PASSWORD);

    CallableStatement cstmt = conn.prepareCall(

    "UPDATE book set checkout_date = ? WHERE id = ?");

    cstmt.setString(1, "01-01-2000");

    cstmt.setInt(2, bookid);

    cstmt.execute(););

    ```


    In addition to handling all the pesky problems of storing, relating, retrieving,
    and managing persistent data, this client-server code retains most of the syntactic
    elegance of a component object model, while adding the distributed execution capabilities
    of a socket program.


    # Summary


    Using either of the message passing frameworks we have looked at will still leave
    you with architectural problems. Component object models have an elegant syntax
    for crossing process boundaries, but do not provide much as far as distributed
    execution, and don''t address the issue of centralized storage at all. Client-server
    is a very powerful interface for networking, but the code is ugly, protocols are
    not easily extensible, and while it can get you to your centralized storage, it
    doesn''t help you actually store anything. In the next chapter, “Introduction
    to CORBA,” we’ll look at an architecture for distributing components across different
    machines and/or operating systems.'
