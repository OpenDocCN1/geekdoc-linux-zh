  md: '# Building Routines and Modules


    If you know what behaviors your objects must have, and you''ve designed important
    algorithms, you can start building routines. Even at the routine level, you need
    to do a certain amount of design work.


    # PDL


    PDL (Program Design Language) is a tool for designing routines that was developed
    by the company Caine, Farber, & Gordon. McConnell suggests a generalized version
    of PDL that is very useful for building routines.


    If you''ve ever written all the comments first and filled in the code later, you''ve
    used a form of PDL. PDL is essentially a comments-to-code-to-comments method for
    writing routines. The following steps to follow when writing a routine using PDL
    are based on this methodology.


    +   1. Describe the purpose of the routine. What is the routine going to do? What
    are its input and outputs? You should be able to find the routine''s purpose in
    the specification for the system. If not


    This routine will sort the input array and store the result in another array.
    Since the array is sorted, the minimum value will be the first element of the
    array. Further, if the minimum value occurs more than once in the input, each
    extra occurrence will be adjacent to the first element of the sorted array. The
    routine can get a count of extra occurrences by counting these duplicate elements
    that appear at the beginning of the array.'
