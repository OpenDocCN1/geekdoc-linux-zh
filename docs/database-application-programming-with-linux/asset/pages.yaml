    # Involve the User


    > “With a mind like yours, you''ll probably want the land-crab.”

    nHunter S. Thompson, “Fear and Loathing in Las Vegas”


    When you (as a user) meet a new system, you make discoveries and inferences about
    how that system works. As you get more familiar with the system, you build up
    a mental model of how system works. Mandel describes this mental model as “an
    internal representation of how users understand and interact with a system.”


    Every user''s mind is different, so every user''s mental model is a little different.
    Through the development of the prototype and implementation, it''s your job to
    discover the common elements of users'' mental models.


    Which comes first, the mental model of a system or the system itself? Before you
    develop the system, you can use a set of techniques to develop an immature mental
    model of the system. This immature model must be reconciled with the system requirements
    to produce a model that is compatible with the user''s mind.


    Mandel suggests using a set of techniques to discover the user''s mental model,
    which are discussed in Object-Oriented Interface Design: IBM Common User Access
    Guidelines (QUE, 1993). The first four of these techniques should be done as early
    in the design and development process as possible, but should be repeated as necessary
    throughout the lifecycle of the software:


    +   - Analyze the user''s tasks.


    +   - Survey and interview potential users.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '+   - Visit the user''s work sites.


    +   - Gather input and feedback from users (not their managers—you need to hear
    it from the people who are doing the work!).


    Mandel and IBM include a fifth technique, usability testing, but this task is
    performed later in the lifecycle of the software. Using the common elements you
    obtain by using these techniques, you must ensure that your prototype and implementation
    fits or complements the user''s mental model.


    # Follow Established Design Guidelines


    There are two general types of guidelines you need to consider when developing
    UI prototypes and UI implementations. The first type of guidelines concerns a
    general approach to how humans interact with computers. Mandel provides three
    golden rules of user interface design that should guide you as you develop the
    prototypes and implementations. This section summarizes these rules.


    The second type of guidelines is more specific. You might have a set of guidelines
    that pertain to your development environment (such as KDE, GNOME, or GNU). You
    may also have a set of design guidelines that your department or company uses.
    These types of guidelines are often very specific and pertain to things such as
    required controls (for example, an Exit menu, or OK or Cancel buttons), interoperability
    with other applications, and how to deal with specific situations such as whether
    the application can have any modal components.


    You can find documentation for KDE and GNOME, including user interface guidelines,
    at http://developer.kde.org/documentation/standards/kde/index.html and www.gnome.org/gdp/
    (but check the main sites www.kde.org and www.gnome.org for the latest information).
    Java''s design guidelines are available in the book Java Look and Feel Design
    Guidelines by Sun Micros (Adams-Wesley, 1999) and online at http://java.sun.com/products/jlf/guidelines.html.
    Operating system vendors such as IBM, Apple, and Microsoft also publish user interface
    style guidelines.


    # Mandel''s Golden Rules


    Mandel suggests three golden rules of user interface design: Place users in control,
    reduce their memory load, and make the UI consistent.


    # Place Users in Control


    When I walk to the University of Rhode Island campus, I almost always have to
    cross the quadrangle. When I do that, I see a lot of paths worn in the grass'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'where should be sidewalks, and I see a lot of sidewalks where there should
    be paths. Mandel relates the story of a designer who needed walkways through a
    grassy area. The designer planted grass everywhere and let people walk where they
    wanted. After a while, the worn paths made it clear where the walkways belonged,
    and the walkways were constructed. This is an excellent example of putting users
    in control.


    Mandel outlines 10 principles that you can follow to place your users in control
    of the user interface.


    Use modes judiciously. Anyone who has been in the same room as a novice using
    the vi editor is familiar with a recurring beeping sound. This comes when the
    novice gets stuck in command mode and can''t figure out how to get back into input
    mode. The vi editor (one of the default text editors that comes with Linux and
    one of my editors of choice) has two modes: command and input. When you are in
    input mode, you can type freely. To issue a command (such as save file), press
    Escape to switch to command mode, issue the save command (:w), and press a command
    key (such as i) to return to input mode. It''s easy for novice users to get confused
    by this operation.


    For those who like it, vi modal operation works well. However, unnecessary use
    of modes can take control away from the user for no good reason at all. When your
    application encounters an exceptional situation, for example, you might need to
    have a modal alert box pop up. Design tools need modes of operation, too. If I
    am using tgif (a figure-drawing tool) to draw a rectangle, I can click on the
    toolbar to put the program in rectangle mode. When the program is in rectangle
    mode, it behaves differently than if it is in text entry mode.


    Allow users to use either the keyboard or mouse. Although the mouse is required
    for the operation of the X Window System, you should provide alternative input
    methods. Some users don''t want to use the mouse: They may want to develop a keying
    rhythm that doesn''t involve five-second five-second pauses while they fumble
    for the mouse. Some users have disabilities that prevent them from using the mouse
    or make the mouse awkward to use. Every mouse-based operation in the system should
    have a keyboard equivalent.


    Allow users to change focus. Let users switch tasks without having to save or
    discard the changes they are working on. For example, if I am editing a customer''s
    details and I am suddenly reminded that I promised to have all my calls updated
    before I go to lunch, I''d like to be able to take'
  merge: -1
