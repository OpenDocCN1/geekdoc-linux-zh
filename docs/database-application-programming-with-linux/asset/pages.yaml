  md: 'The fatal expense was the growth of the Internet. The most sophisticated pieces
    of software in the early 1990s (with the exception, perhaps, of the 4GLs themselves)
    were relational databases. So, 4GL made it easy to access the functionality inherent
    in RDBMS software, and lots of people developed applications that let users query
    tables and update records. But when the Internet became raison d''etre of application
    development, it was impossible to access Internet services from 4GL tools, while
    3GL tools could work well with the Internet, and applications written using 3GLs
    raised the bar of end-user expectations to a place where they could not be fulfilled
    using existing 4GL tools.


    4GLs were also problematic during installation. Because the generated application
    relied on services from the 4GL, to install an application using a 4GL you also
    had to install the runtime of the 4GL on every machine that was going to run the
    application, and provide technical support at the desktop level to ensure that
    all of the required libraries were installed and configured properly. This extension
    of the technical support Help Desk raised concerns about the total cost of ownership
    of these types of applications. The positioning of browsers as a universal client,
    with a ubiquitous runtime for HTML, JavaScript, and Java made 4GL seem less less,
    and started a trend back towards centralization of application deployment.


    All this being said, RAD is far from finished. The most recent generation of RAD
    tools are extremely Internet savvy, and generally, much more complex and capable
    than the previous releases. There is a huge population of 4GL developers, and
    because the barrier of entry is much lower to development than programming, that
    population is growing every day. But most importantly of all, for the right type
    of application, using a 4GL tool will produce functional software 10 to 20 times
    faster than a 3GL tool, which means that you can effectively overcome the productivity
    difference between good and mediocre programmers by using a RAD approach.


    Developers of tools are large and a very clever bunch, and if we assume that they
    will continue to address current 4GL technical difficulties (arbitrary complexity
    limitations, configuration management, generation lagging), two main problems
    remain. One is that the barrier to entry is still too high to achieve the full
    participation of end users in the development process, and the other is that there
    is limited code reuse of functionality developed in the 4GL.


    As previously stated, users are users because they can''t or won''t be programmers.
    The latter is a personal preference, and hence, very difficult to change, 4GL
    tool developers targeted the former, lowering the programming barrier of entry
    to allow users who wanted to be programmers, who lacked the background or skill
