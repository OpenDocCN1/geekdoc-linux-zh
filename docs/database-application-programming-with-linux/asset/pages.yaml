  md: 'The company_label Gtk widget. This widget is a plain text label that acts as
    a prompt for the cmb_company widget:


    ```

    <widget>

    <class>GtkLabel</class>

    <name>company_label</name>

    <label>Company:</label>

    <justify>GTK_JUSTIFY_LEFT</justify>

    </widget>

    ```


    The cmb_company Custom widget. This custom widget is created by a function called
    get_company_combo that we wrote for this example (we’ll see it shortly). Here
    is how a custom widget works: libgable doesn’t need to know what type of widget
    it is, because GTK’s polymorphism allows everything to be treated as a GtkWidget
    object. So, all we need to do is write the get_company_combo function, create
    whatever kind of widget we feel like creating (in this case, a GnomeDbComboCombo
    object), and cast it to a GtkWidget when we return it from the function.


    This combo also has a delete_event event handler. The purpose of this event handler
    is (in the spirit of cleaning up after ourselves) to release the underlying Gda_Recordset
    object that powers the combo.


    Here is the definition of the custom widget:


    ```

    <widget>

    <class>Custom</class>

    <name>cmb_company</name>

    <signal>

    <name>delete_event</name>

    <handler>on_cmb_combo_delete_event</handler>

    </signal>

    <creation_function>get_company_combo/creation_function

    </widget>

    ```


    The grid widget Custom widget. This is another custom widget; in this case, a
    GnomeDbGrid object. As with the cmb_company Custom object, it has a custom creation
    function, and an event handler for its deletion:


    ```

    <widget>

    <class>Custom</class>

    <name>grid</name>

    <width>350</width>

    <height>128</height>

    <signal>

    <name>delete_event</name>

    <handler>on_grid_delete_event</handler>

    </signal>

    <creation_function>get_grid/creation_function

    </widget>

    ```'
