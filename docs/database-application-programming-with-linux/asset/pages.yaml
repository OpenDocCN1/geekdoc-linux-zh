  md: '# CHAPTER 9


    # Databases


    Chapter 2, “Database Design,” introduced you to the logical structure of a relational
    database: A collection of related tables that are composed of rows and columns.
    The goal of this chapter is to look at the services that a Relational Database
    Management System (RDBMS) provides. By the end of this chapter, you should be
    able to answer these questions:


    +   - How does an RDBMS make information available to applications?

    - What do I need to do to get started with one of these databases?

    - What sort of neat stuff can I do with the information stored in an RDBMS?

    - What are the differences between the various RDBMSs that are available for Linux?


    # What is an RDBMS?


    If a relational database is a collection of related tables, what is an RDBMS?
    In Fundamentals of Database Systems (Addison-Wesley, 2000), Elmasri and Navathe
    define a database system as a “general-purpose software system that facilitates
    the processes of defining, constructing, and manipulating databases for various
    applications.”


    What do we need to add to this definition to address our expectations of an RDBMS?
    Assuming that Chapter 2 presented a comprehensive overview of'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'relational features, we could say that an RDBMS is a database system that supports
    those features: The data is organized into tables that can be manipulated with
    commands such as SELECT, UPDATE, INSERT, and DELETE. Further, tables can be linked
    to one another using the WHERE clause (this feature is covered in the section
    titled Joins in Chapter 2).


    As it turns out, this is very close to the three criteria that Elmasri and Navathe
    propose:


    Data is stored in relations (tables). Further, these tables are organized in a
    way that every column can be identified by its name (as SELECT first_name FROM
    customer), and the way in which rows are ordered in the table is not important
    (however, see Ordering Result Sets in Chapter 2).


    Operations are relational operations. The operations that the system provides
    generate new tables from old tables. For example, the SELECT name, id FROM customer
    statement would create a new table as its result (a table that is unnamed) and
    that is a subset of the old table (customer).


    Joins must be supported. A relational database system must support a join operation,
    as described in the section titled Joins in Chapter 2.


    # Relational Databases and the PC


    Some database programmers who come to Linux bring them certain assumptions from
    a Windows-based PC background. As a result, of what these new users find is a
    bewildering. This is due to the fact that most of the SQL databases for Linux
    is client-server. There is a tradition in Windows of having application development
    and database features presented as a single (monolithic) tool. Examples of these
    are FoxPro, Access, and FileMaker. Although these tools can work with client-server
    databases, they also have their own database engines, and so, there is a more
    complete integration between parts of the program as GUI builders and an SQL database.
    Figure 9.1 shows the structure of such a system.


    With most databases for Linux, however, there are at least three components to
    contend with: the database server, a client API for connecting to the data-base,
    and the language you use to build applications. If you need to build a graphical
    user interface for your applications, it can get even more complicated: Now you
    have a widget tool kit and the X server to worry about. Figure 9.2 shows one possible
    arrangement of these components.


    So, for those of you coming from a client-server database background, please pardon
    the parts of this chapter that seem elementary (some of us have a bit of catching
    up to do).'
