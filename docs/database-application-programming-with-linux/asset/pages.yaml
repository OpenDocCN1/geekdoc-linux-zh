    636f6d003f07c000000424f41c0a8fe666000a3e03010000024000001000000101

    0000100000f1400000010000001010000000000000000

    ```


    This IOR is not much less you can pass it to the client, so instead of starting
    it as just shown, redirect the output to a file and use to put the server in the
