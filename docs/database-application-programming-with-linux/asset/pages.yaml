  md: "If you can't log in with this program, don't try to debug it. Next, we see\
    \ how you can use GNOME-DB's error handling to get verbose descriptions of errors.\
    \ Hopefully, this will help you out if you had any trouble logging in to the database.\
    \ In all the programs that follow, login.c and login.h will be reused as is—no\
    \ changes will be made to the listings for those files you saw previously.\n\n\
    # Trap Errors\n\nIn the previous example, there was no explicit error handling.\
    \ So, if you tried to connect to a bogus data source, or if you supplied the wrong\
    \ user id or password, it would simply keep the dialog on the screen as if nothing\
    \ had happened. As it turns out, we can make some simple modifications to support\
    \ error handling.\n\nFirst, we'll encapsulate all the error handling behavior\
    \ in an error.c program file (which has an accompanying head, error.h). This program\
    \ has the duty of defining an error handler and hooking up a Gda_Connection object's\
    \ error handler to that function. In the error handler, on_error(), we create\
    \ an error dialog that is connected to the connection that had the error, and\
    \ display it. Figure 13.19 shows the result of logging in to a data source with\
    \ the wrong user id and password.\n\nHere is the listing for error.c:\n\n```\n\
    #include \"error.h\"\n\n/*\n* When an error occurs, display a dialog\n* the list\
    \ of errors.\n */\nvoid on_error(GtkObject* cnc) {\n  GtkWidget *error_dialog;\n\
    \n  /* Create an error dialog */\n  error_dialog = gnome_db_errordlg_new(GDA_CONNECTION(cnc),\n\
    \                 \"Database Error\");\n\n  /* Display the dialog */\n  gtk_window_set_modal(GTK_WINDOW(error_dialog),\
    \ TRUE);\n  gnome_db_errordlg_show_errors(GNOME_DB_ERRORDLG(error_dialog));\n\n\
    }\n/*\n* Connect the on_error routine to the connection's error signal.\n */\n\
    ```"
