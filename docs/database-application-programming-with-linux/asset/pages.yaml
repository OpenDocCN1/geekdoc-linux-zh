  md: '# Swing


    Swing is a set of components that are part of the Java Foundation Classes (JFC).
    You can use Swing to build graphical user interfaces from the ground up. With
    Swing, you build a hierarchical system of components. For example, a window may
    contain one or more panels, which in turn contains buttons and text fields. Swing
    includes many components, and many combinations are possible. Figure 11.2 shows
    an exploded view of one such possibility.


    # A Frame, a Field, and a Button


    Let''s take a look at a very simple Swing application. This application has one
    Frame (a main Window), one text entry field, and one button. We''ll look at the
    simplest case first (no event handling), and then add event handling to the example.
    At that stage, we will use event handling to respond to a button click and requests
    to close the window.


    To create this simple application, we need to perform the following steps, which
    are necessary for most simple Swing applications:


    +   1. Import the Swing and AWT classes:


    ```

    import javax.swing.*;

    import java.awt.*;

    import java.awt.event.*;

    ```


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_324_0.png)


    Figure 11.2 A component hierarchy.'
