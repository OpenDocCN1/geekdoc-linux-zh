  md: '# Requirements


    “Building a 4-foot tower requires a steady hand, a level surface, and 10 undamaged
    beer cans. Building a tower 100 times that size doesn''t merely require 100 times
    as many beer cans. It requires a different kind of planning and construction altogether.”


    Steve McConnell, Code Complete


    recognizing the potential irony of having a reference to a Microsoft book in the
    first sentence of a book about Linux, we added three extra sentences much as you
    would pad a data structure with extra bytes in aligning it optimally in memory.
    But, there''s nothing we can do about that quote up there. It''s from the same
    book, and we like that quote, so there stays!


    In Code Complete (Microsoft Press, 1993), Steve McConnell suggests that building
    a physical structure is an appropriate metaphor for software construction. Building
    a medium-sized software system is very close to complex- and cost to building
    a single-family house. Building a large software system parallels the complexity
    and cost of a large office building.


    As with constructing a physical structure, the cost of fixing mistakes goes up
    the longer the mistake goes undetected. If you realize you need to make a fundamental
    change to the foundation of a house just as the shingles are going on, the cost
    can be prohibitive. It is the same for software development: The earlier a defect
    is introduced, the more expensive it is to fix as time goes on. For example, an
    error in the requirements analysis may cost a negligible amount with respect to
    the overall cost of the project if it is detected while you are validating the
    requirements. It will cost significantly more if it is detected while you are
    detecting the software. For this reason, it''s important to get the requirements
    right. Before you build a system, make sure you are solving the right problem.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'In this chapter, we''ll look at approaches to the traditional problems of system
    design. However, in Chapter 6, "Software Engineering," we''ll take a fresh look
    at these problems in the context of open source development processes.


    # Toward a System Design


    To build a system, you need a good blueprint. The first step in developing this
    blueprint is to state the problem that the system will solve. From there, you
    can develop a requirements document that states the functionality of the system
    will be. You can then design the system, starting with its architecture, and move
    on to the design of its individual components.


    # The Problem Definition


    The problem definition states the problem that needs to be solved. When I wrote
    that last sentence, I was tempted to say "the problem that the system will solve,"
    but even that supposes too much. As a general guideline, the problem definition
    should state the problem without specifying a solution, including whether a system
    will be developed to solve the problem. This leaves room for other solutions to
    problems, such as modifications to existing business processes. Like other stages
    of the requirements process, the problem definition should be developed by the
    users, system designers, and developers working together.


    Let''s take a look at a problem definition that violates this guideline:


    We need a system to capture the amount of time an employee spends working on a
    given task and store that information in a database so we can query it.


    This problem definition skips over the problem itself and jumps right to the solution.
    It would be better to say:


    Our present method of tracking the amount of time an employee works on a given
    task is inefficient. This method uses a spreadsheet for each employee to track
    information. It is error-prone, difficult to extract information from, and difficult
    to consolidate. Consolidating spreadsheets from multiple employees is the most
    time-consuming and error-prone part of this process.


    Given a statement of the problem, you can move on to analyzing the problem and
    coming up with a requirements specification.


    # Requirements Analysis


    The process of analyzing requirements begins with an analysis of the problem definition,
    and goes on to define and specify the requirements. The'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'requirements analysis is a process that brings you and the user community together
    to discuss what must be done. The problem definition is your first clue. At the
    end of the process, you''ll have a document that states what the user needs and
    what the user will get.


    # Working with People


    To do a thorough job of requirements analysis, you''ll need to spend time with
    your user community, their managers, and other people affected by the system (such
    as the developers of systems that your system need to exchange data with). All
    of these people are collectively referred to as stakeholders. To gather information
    for requirements analysis, you''ll need to interview the stakeholders, converse
    with them to clarify ambiguities, and, ultimately, obtain their approval colloquially
    called "buy-in," and reinforces the notion that the stakeholders have something
    invested in the success of the project.


    In Software Engineering (Addison-Wesley, 1995), discusses several issues to keep
    in mind when you interact with stakeholders:


    Differing terminology. Some stakeholders, such as end users, cannot articulate
    their needs in technical terms. Instead, they will articulate their needs using
    terms and concepts they are familiar with. These terms and concepts may not be
    familiar to you, the software engineer. You''ll need to become familiar with the
    concepts and terminology of the problem''s domain. If possible, ride shotgun with
    users and learn their business.


    Misunderstanding of scope and scale. Stakeholders who are not versed in software
    engineering have no idea of the costs and complexity involved with software development.
    You should use metaphors (such as the one discussed at the beginning of this chapter)
    to explain how complicated software development is. Explain that it''s easy to
    verify when something like a Web page is finished by inspection (and the fact
    that the Web browser doesn''t generate an error when you load the document). You
    can''t do this with software. In practice, you can''t verify the correctness of
    software with 100-percent confidence.


    Conflicting requirements. Different stakeholders may have requirements that conflict
    with others. This is especially likely if the group of stakeholders is made up
    of members from different communities and corporate cultures. Citing the requirements
    in a document that is readable by both you and the stakeholders helps everyone
    to come to a consensus on the end product. It also becomes the basis of a contract
    between the developers and the stakeholders.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'External influences. Remember that political, business, and economic factors
    have an influence on the process. A high-level agenda may influence the way in
    which users deal with the requirements process. High-level organizational changes
    can result in a project being canceled. If business practices change, the requirements
    may also change.


    # The Analysis Process


    Sommerville describes six activities that make up the requirements analysis process.
    These do not always happen in sequence. In other words, as you complete one activity,
    you may learn something that changes your understanding of an activity you''ve
    already completed. This iterative process is one of continual refinement. The
    following are some important steps in the analysis process:


    Domain understanding. The domain is the area or realm that the problem affects.
    Before you analyze the problem and the requirements, you need to become an expert
    in the domain. For example, in investment banking, programmers often spend time
    on a trading desk to learn about the business. Some of them master the business
    so well, become traders or analysts themselves. Many good software engineers have
    lost this way!


    Requirements collection. Don''t wait until you''ve mastered the users'' business
    to start learning what they want. Interview the stakeholders to learn what kind
    of system they need. Write everything down. As you do this, you''ll develop a
    better understanding of the problem domain.


    Classification. After you collect requirements


    Conflict resolution. If the problem involves different stakeholders, you may be
    left with some conflicting requirements. You''ll need to find these conflicts
    and resolve them. This process can be politically tricky. For example, in some
    cases, this conflict resolution can reanimate rivalries within the organization
    that had long slumbered.


    Conflict resolution may also emphasize gaps in the knowledge of PointyHaired Bosses
    (of Dilbert fame: also known as PHBs). It''s not always easy telling someone who
    signs the paychecks that he or she is wrong, but in many cases, the people in
    the trenches know better than the higher-ups.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'If you want to master the fine art of dealing with such situations, you might
    look at books on topics such as conflict management, interpersonal conflict, problem
    employees, or business communication.


    **Prioritization.** Users may ask for the world. While you can''t give it all
    to them, you can ask them to prioritize their needs. This lets you determine what
    is most important, and sets the stage for creating incremental deliverables later
    in the process.


    **Validation.** By now, you have a set of raw requirements. Next, you need to
    review the raw requirements to determine whether you have everything the stakeholders
    think they want. This won''t be the last time you''ll validate the requirements,
    but it''s good to validate them before you move toward the final requirements
    document.


    Assuming that we''ve been through this process with the problem definition that
    appears at the beginning of this chapter, the raw requirements might look like:


    # Timesheet System Requirements


    A system is needed that captures the capture and reporting on the number of hours
    a consultant works on a project. Our company provides consulting services, and
    we need to track how the consultants spend their time, and use this information
    to invoice the customers.


    Each consultant may be assigned to one or more projects. The rate for consultant
    is determined on a per-project basis. A project is associated with a single customer,
    who is responsible for paying us the consultant''s rate.


    Each project is broken down into tasks that have a fixed start and end date. When
    a consultant submits the number of hours she worked on a given day, those hours
    must be associated with a particular task.


    The system should track the following information about a consultant:


    +   - First name.

    - Last name.

    - Address.

    - Home phone number.

    - Projects the consultant is assigned to.

    - The rate at which the consultant is billed to each project.


    The Staff Coordinator is responsible for assigning consultants to projects and
    setting their rates.


    The system should track the following information about a project:


    +   - Customer name.

    - Customer address.'
