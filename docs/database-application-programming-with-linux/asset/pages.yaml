  md: '# Objects versus Objects


    When I talk about objects in the context of user interfaces, I am talking about
    elements that make up the conceptual model. Essentially, objects are things the
    user interacts with, or something the user thinks about in terms of doing something
    to the object, or having the object do something.


    When I talk about objects in the context of object-oriented programming, I am
    talking about a programming term that has much more specific meaning. See Chapter
    5, "Object-Oriented Programming," for a description of objects in this context.


    In the real world, there may be some overlap between interface objects and programming
    objects. For example, you may have a Customer object in the user interface, and
    also a Customer object in your application''s model.


    Figure 3.3 shows the icons I have designed for each of the container objects in
