    # Summary


    There are many responsibilities a database server can take on. These responsibilities
    are determined in part by the complexity of the system you are writing, but are
    also determined by the need to maintain consistency in any set of data.


    By now, you should be able to do some simple work with one or more of the database
    servers discussed in this chapter. In the chapters that follow, we''ll look at
    how to write programs that connect to these databases, and take advantage of many
    of the features we discussed in this chapter.'
