  md: 'Line 1. Define a variable for the recordset object. The recordset is an object
    that holds the results of an SQL query.


    Line 2. Define a character buffer to hold the contents of the query.


    Line 3. Define an integer variable to hold the result code of the query.


    Line 6. Create a new result set.


    Line 7. Associate that result set with an existing connection object (assume this
    was initialized as discussed in the section titled Make a Connection).


    Lines 8-11. Store the text of the SQL query into the sql_buffer variable. This
    takes the form of SELECT column, another-column FROM table-name.


    Lines 12–16. Open the recordset. This has the effect of executing the SQL query
    and putting the results into the recordset object.


    Lines 17–20. If the query failed, print an error message and quit.


    After this function creates a recordset, it creates a new GnomeDbCombo object
    with recordset as the combo''s source for its data.


    To use this function, you must pass in a connection object, the name of a table,
    and the name of two columns in that table: the id column (the table''s primary
    key) and the label column (this is the column that''s used as the text of the
    combo menu).


    The get_selected_value() private function. This function takes the Gnome-DbComboobject''s
    underlying recordset, repositions it to be in sync with the current selection,
    and returns one of the column values from the recordset. So, you can use this
    to get the currently selected item, by specifying the column that corresponds
    to the label, or to get the id value of the currently selected item, by specifying
    the column that corresponds to the id.


    The get_selected_label() public function. This is just a simple wrapper around
    the get_selected_value function that fetches the label of the currently selected
    item.


    The get_selected_id() public function. This is another wrapper around get_selected_value,
    but it gets the id of the currently selected item. Here is the power of table_combo.c:
    When a user makes a selection of a company, it is not always meaningful to use
    that name in any subsequent queries. If you''ve designed a normalized database
    design, you will be more interested in the id, so you can do a query like "SELECT
    * FROM contacts WHERE company = selected_id." This function lets the user select
    a company name such as Bulbic Bearing Supply Co., and lets the application find
    out that the id of selection is 120 (see SAMPLE_DATA.SQL).'
