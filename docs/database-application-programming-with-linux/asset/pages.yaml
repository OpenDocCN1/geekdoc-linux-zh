  md: '# Style and Technique


    Many arguments have erupted over matters of style. There are only two sure things
    when it comes to these matters: There is more than one right way, and the most
    important thing is to be consistent.


    Someone will have to read your code at some point, and there''s a good chance
    that more hours will be spent reading, learning, and enhancing your code than
    you will spend building the code. This is true of any software, even inhouse systems,
    but it is especially true for free software. Choose a style that makes for readable
    and understandable code. Apply this this style in a consistent fashion, and your
    code will be well understood.


    This section is necessarily terse, because this is not a book on programming style.
    Many of the issues in this section are treated well in other books. Code Complete
    by Steve McConnell (Microsoft Press, 1993) provides a thorough treatment of these
    many and many other issues covered in this chapter.


    This section is also necessarily general, because the techniques in this book
    apply to many languages. If you are not sure about the stylistic conventions for
    a language, you should check the documentation for the language to find information
    about stylistic conventions. This is especially important if you are writing libraries
    to be used by other programmers, since your adherence to convention could affect
    the success of your software.


    # Naming Conventions


    Things need names. Without names, they are just things. Variables, functions,
    methods, classes, and all need names.


    StudlyCaps versus studyCaps versus all_lowercase When you create a name made of
    up than one word, you need to decide how to make it readable. For example, getemployeeid
    is descriptive of an action, but hardly readable. The three most common ways of
    dealing with this is with StudlyCaps, studyCaps (like StudlyCaps but with the
    first word in lowercase), or all lowercase with underscores: GetEmployeeID, getEmployeeID,
    or get_employee_id. Which one you use depends on your personal preferences and
    what the conventions are for the programming language you use.


    Choose names that are descriptive. The more important something is, the more descriptive
    its name should be. While it''s okay to name a loop control variable i for its
    short loop, because it is traditional practice among programmers, a more descriptive
    name would be needed for a loop that'
