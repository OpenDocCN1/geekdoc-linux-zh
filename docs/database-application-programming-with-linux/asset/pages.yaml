  md: 'The Sybase solution to the problem may seem a little unusual. If two of these
    transactions execute simultaneously, one of them is forced to fail. This is because
    this solution leads to a deadlock situation. When User A issues the SELECT statement,
    a shared lock is acquired. If User B comes in and issues the SELECT statement,
    User B also gets a shared lock. The deadlock occurs when the two users try to
    execute the UPDATE: The first user to the UPDATE statement waits to acquire an
    exclusive lock, but cannot get it until the shared lock is released. When the
    second user issues the UPDATE statement, Sybase detects the deadlock and chooses
    to terminate one of the transactions.


    # Doing without Transactions


    As of this writing, the current version of MySQL (version 3.23) does not support
    transactions. However, it supports explicit locking and unlocking of tables. Use
    the LOCK TABLES statement to lock one or more tables, which should appear as a
    comma-separated list or tables and lock modes (READ or WRITE):


    ```

    LOCK TABLES table_one WRITE, table_two READ

    ```


    Here is a MySQL solution to the last update problem:


    ```

    LOCK TABLES inventory WRITE;

    SELECT quantity FROM inventory WHERE item=''widget'';

    UPDATE inventory SET quantity = 30;

    UNLOCK TABLES;

    ```


    Version 3.24 of MySQL will have support for transactions.


    You must lock all tables that you are going to use. MySQL uses this assumption
    to guarantee that you won''t have to worry about deadlocks. If you don''t lock
    a table that you use, you may run into a deadlock situation.


    If you really wanted to use transactions with a database that doesn''t support
    them (as Mini SQL or MySQL), you would need to build a broker (a component that
    acts as a mediator for requests) between your applications and the database. In
    order to do this, the broker would need to implement some features, such as:


    +   - A client/server protocol so your applications could make requests

    - Some of caching to hold uncommitted objects before they are sent to the database'
