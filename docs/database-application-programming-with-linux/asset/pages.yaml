  md: '# System Structuring


    When you break the system down into its structure, you need to divide it into
    subsystems, smaller systems that function independently of other subsystems. The
    requirements document shown earlier in this chapter hints at a system made up
    of three independent smaller systems: a Consultant Maintenance subsystem, a Company
    Maintenance subsystem, and a Timesheet Maintenance subsystem.


    The fact that these subsystems exchange data does not make them dependent upon
    each other. Instead, we look to one of the models that Sommerville discusses,
    the repository model. In one type of the repository model, each subsystem exchanges
    data with the others through a shared database. Since this is a book about building
    database applications, we are going to use this model for every example in this
    book. Figure 1.4 shows a possible structure for this system.


    Some features of the repository model include:


    **Agreement.** Each subsystem must agree on the structure of the shared database
    base (rather than on a subsystem-by-subsystem basis), this is not a problem. Chapter
    2, "SQL and Relational Database Design," discusses how you can take the system
    requirements and develop a database design.


    **Centralization.** The database administrator can maintain central control over
    access control, security, backups, and other issues.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_32_0.png)


    **Figure 1.4** Repository model for the timesheet system.'
  merge: -1
