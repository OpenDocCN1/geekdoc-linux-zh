    methods as Patron.hasOverdueBooks() and Book.isLoanOut(). When this happens, you
    should go back to your class and collaboration diagrams, and add these methods:
    they are important enough that they need to be shown in the diagrams. In cases,
    we see the need for iterative development: much is learned each time we go around.


