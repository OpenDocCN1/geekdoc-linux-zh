  md: '# Some Frequently Asked Questions


    Let''s take a look at some of the questions often asked by people who are starting
    to work with databases on Linux and Unix.


    # What Is a Database?


    A database is a collection of related tables. Databases can be used as a way of
    controlling who has access to a particular set of tables. One very common practice
    is to give each user (or project) his or her own database. Users can then create
    tables and other database objects as necessary. With some database servers, they
    can grant other users access to tables on a selective basis. In this way, a database
    is similar to a home directory.


    # What Is the Difference between a Database and Database Server?


    A database server is roughly synonymous with a database system, which we described
    earlier. A database server is the daemon that runs in the background and manages
    the data itself, as well as access to the data from clients. A database system
    includes the server and all the utility programs, libraries, and other files that
    support the operation of the database.


    It''s very common to hear people refer to a database server as “the database.”
    This can be confusing, and it would be easier if they didn’t do it. For example,
    if your database administrator tells you “the database will be offline most of
    the afternoon,” does it mean that the accounting database is going offline, or
    the entire database server (and thus, all the databases on that server, including
    the accounting database)? When in doubt, ask!


    # What Is the Difference between a Database and a Table?


    Some desktop database systems, particularly X databases (the DBF file format)
    like dBase and FoxPro, had a history of using the terms database and table interchangeably;
    in this context, both terms mean as we described it in Chapter 2. This bad habit
    was encouraged by the fact that until later versions, those systems didn’t have
    the concept of a database that contained tables.


    A table is a collection of rows and columns, and a database is a collection of
    tables.


    # What Is the Difference between an RDBMS and a DBM File?


    DBM (Database Manager) is a library for managing databases that consist of key/value
    pairs. DBM files are essentially hash tables. So, each entry in the'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'DBM file has the equivalent of two columns: One is the key (a unique ID) and
    the other is the value. Although some programmers have overloaded DBM to support
    retrieving multiple values by a single key, DBM is not a replacement for an SQL
    database server. However, DBM is very powerful and useful, and if your database
    requirements are very simple, you should consider using DBM. For documentation
    on GNU implementation of DBM, type ‘man’ at the shell prompt.


    # How Do I Seek on a Table in an RDBMS?


    In desktop database products that are Xbase-compatible, a common paradigm for
    reading rows from a table was:


    +   - Open the table for reading:


    USE invoices


    +   - Set the current index to the field you are interested in:


    SET INDEX TO customer_name


    +   - Seek the first occurrence of some value:


    SEEK ‘Big Company''


    +   - Scan through the database until the match fails:


    SCAN WHILE customer_name = ‘Big Company''

    ? inv_no

    END SCAN


    With SQL, you don’t deal with the data in this way. Instead, you use one statement
    to retrieve all the matching rows, which creates a result set. You can think of
    a result set as a temporary table, or cursor, that contains all the data you asked
    for. Here is an example that retrieves the same data:


    ```

    SELECT inv_no

    FROM invoices

    WHERE customer_name = ‘Big Company''

    ```


    So, the question becomes, how do I process each row in my programs? It differs
    from one programming language to another. In the chapters follow, we’ll answer
    that question in a variety of programming languages.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# What Is SQL?


    SQL is the Structured Query Language, a language for accessing and manipulating
    relational databases. While SQL has been standardized, there are few implementations
    that come close to the standard. Chapter 2 introduces some basic SQL, and this
    chapter also looks at some special topics in SQL. An SQL reference can be found
    in Appendix A, "SQL Reference."


    # How Does SQL Get from My Program to the RDBMS?


    Just as Linux applications need to link to /usr/lib/libc.so in order to gain system
    calls, database applications must also link against a library that provides access
    to the database. This library (a data access API) does a number of things on your
    own behalf, including:


    +   - Opening a TCP/IP connection to the database server that is used to send
    data and receive data from the server


    +   - Performing whatever handshaking is needed to authenticate you to the server


    +   - Sending SQL commands to the server for you


    +   - Parsing the output of the SQL commands and converting them into objects
    or data structures that you can work with in your program


    # What Format Is the Data Stored in?


    The short answer is, it doesn''t matter. Once upon a time, it was important to
    consider whether a database was compatible with Xbase, Access, or some other database
    format. The reason this was important was that people needed some way to connect
    other programs (such as word processors and spreadsheets) to the database. A common
    format like Xbase made it easy to do this.


    But, because we are dealing with networked database servers, it''s more important
    to ask, "how can I connect my programs to the database?" Because what you are
    really trying to figure out is how you''re going to get data in and out of it.


    Because all the databases we''re looking at support SQL, you can pump data in
    and out of them using SQL. Most databases also have a dump utility that lets you
    export and import in a delimited format, such as comma or tab delimited. Most
    applications that need to deal with a lot of data (such as a spreadsheet or desktop
    database) can import from and export to such a format. See the Bulk Data Operations
    section, later in this chapter, for more details.'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'You could also use a database independence API, such as ODBC (C or C++),

    BI (Perl), or JDBC (Java), and write your own programs to move data from

    one place to another.


    # What Is a Database Independence API?


    All of the database systems we are looking at can be accessed from C or C++,

    by using the native database API. This API is a collection of headers and

    libraries that are installed on the server along with the database itself.


    Because most native database APIs are not compatible with each other, most

    people prefer to use a database independence API, which unifies the different

    APIs. Essentially, a database independence API makes all the database APIs

    look the same, regardless of what database you are using.


    For example, ODBC is used by C and C++ programmers as a bridge to a vari-

    of databases. Whether a programmer is using Sybase, Oracle, Post-

    gresSQL, MySQL, or Mini SQL, the programming API is still ODBC; what''s

    different is the special driver program that glues ODBC to native API. Figure

    9.3 shows how ODBC can connect to Sybase''s CT-Lib, which uses the net-

    work to communicate to a SQL Server. We''ll briefly touch on ODBC in some

    of following chapters.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_234_0.png)


    **Figure 9.3** Using ODBC to connect to a database.'
  merge: -1
