  md: 'the ODBC API in this book, you can learn how to set up ODBC drivers, and use
    them from Java (see Chapter 11), Perl (see Chapter 12), or GNOME-DB applications
    written in C (see Chapter 13).


    There are two freely distributable ODBC kits for Linux: iODBC and unixODBC. These
    kits include the ODBC driver manager, which acts as a mediator between your database
    and an ODBC driver. The ODBC driver does the actual work of connecting to the
    database server. In addition to the driver manager, both ODBC kits include the
    headers and libraries you need to develop ODBC applications and drivers. The unixODBC
    package also includes several ODBC drivers.


    # ODBC


    ODBC is an ODBC driver manager and software development kit that is maintained
    by OpenLink Software (www.openlink.com). You can find more information about ODBC,
    as well as downloads for the latest versions, at www.odbc.org.


    Installation. You can download binary or source releases of ODBC. The source release
    includes a README and INSTALL file that has instructions on how to compile and
    install it. The automatic configuration script makes it easy to prepare the source
    code before you compile it.


    Installing drivers. Once you''ve installed ODBC, you''ll need to get some ODBC
    drivers, which let you connect to a database. ODBC should be compatible with any
    ODBC driver for Linux, including the free drivers with unixODBC. To find an ODBC
    driver for a specific database server, consult the homepage for that (see Table
    9.6 in Chapter 9 for a list of database homepages). OpenLink Software, the maintainers
    of ODBC, has commercial driver offerings for many database servers. Other vendors
    may have similar offerings.


    Once you have obtained an ODBC driver you want to use with ODBC, consult the ODBC
    documentation for details on how to install a driver. As of this you will need
    to edit the ODBC configuration files manually (but the developers are working
    on graphical configuration tools).


    # unixODBC


    The unixODBC project features an ODBC driver manager, several ODBC drivers, and
    graphical utilities for configuring ODBC. In addition, unixODBC also includes
    a driver template, which is designed to make it easier to write new drivers. The
    unixODBC homepage is at www.odbc.org, where you can download the unixODBC source
    code and browse the online documentation.'
