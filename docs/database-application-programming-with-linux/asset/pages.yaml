  md: '# Joins


    In the final SELECT example, you saw an example where you had to use the publisher
    to filter the result set by publisher. What would you do if you wanted to see
    the name of the publisher in the result set? You can specify more than one table
    in the FROM clause and use the WHERE clause to specify how those tables are related
    to each other. The general form of a join looks like:


    ```

    SELECT <column-list>, <table>2, <table3>...

    FROM <table>1, <table>2 = <<table>2>.primary-key = <foreign-key>

    AND <table2>.primary-key = <table3>.foreign-key>...

    ```


    Consider the publisher table as <<table>1> and the book table as <table2>. The
    publisher table''s primary key is publisher_code, and the book table''s foreign
    key reference to publisher has the same name. Therefore, if you want to select
    a list of titles and publishers, you can issue this query:


    ```

    SELECT book.title, publisher.publisher_name

    FROM publisher, book

    WHERE publisher.publisher_code = book.publisher_code

    ```


    # NOTE


    In this section, foreign key refers to a column that is a reference to a column
    in another table. Although the use of the word implies we are talking about an
    index, there is no rule that the foreign key actually has to have an index. In
    some cases, it may be a simple column without an index. In many circumstances,
    though, it is generally beneficial to have an index that corresponds to the column.
    For details on creating indexes, see the following section titled Indexes.


    This example introduced the dot (.) operator. The dot operator lets you specify
    the table that contains a column, and is used here to eliminate ambiguity. Without
    the operator, the database server wouldn''t know which table the publisher_code
    on the left came from, and which table the publisher_code on the right came from.
    Even though it''s obvious to us, it''s not obvious to the data engine. It''s a
    good idea to use the dot when you have more than one table in a SELECT statement,
    since it also makes it easier for other programmers to understand how the SELECT
    statement works.


    You can also use joins with cross-reference tables like the author_of table. Here
    is the general form of a SELECT statement that uses a cross-reference table to
    join two tables:


    ```

    SELECT <column-list>

    FROM <table>, <crossref>, <table2

    ```'
