  md: 'appears at the top of the main GNOME panel menu (the footprint menu on the
    GNOME panel). You can also start gdafe by running the command gdafe from within
    xterm or gnome-terminal (or other X Window shell).


    **Connect to a database.** When you start up gdafe, the main window appears as
    shown in Figure 13.16. At this point, you must connect to a data source. To connect
    to a data source:


    +   - Click Connect or select Open Connection from the File menu. The Open Connection
    dialog appears, as shown in Figure 13.17. This dialog uses the GnomeDbLogin widget,
    which we''ll look at in the next section, Programming GNOME-DB.

    - Select the data source from the GDA Datasource menu. Only data sources defined
    in gdalib appear here.

    - Supply a user name and password.

    - Click OK to connect.


    If all went well, you didn''t get any error messages, and the gdafe window expanded
    to include a tab labeled SQL. If you did receive error messages, it may indicate
    that your gdalib is not configured correctly. If you-read the reading section
    on setting up data source, double-check the contents of the file, and you still
    cannot log in, you should consult the GNOME-DB documentation, since it is possible
    that 1) something changed since the writing of this book, or 2) the gda-mgr application
    is fully functional, and should be used to configure your data sources.


    **Issue a query.** After you make a connection, the SQL tab appears with a top
    section and bottom section, as shown in Figure 13.18. To execute a query, type
    some SQL into the top part, and click the leftmost icon. query should be executed,
    and the results appear in a grid in the lower region, as shown in Figure 13.18.
    This grid is a GnomeDBobject, which we''ll learn more in the next section.


    The gdafe application offers more, such as the ability to define tables, the objects
    in a database, and view or create various trace files and logs. You should consult
    the GNOME-DB documentation for more details.


