  md: '# CHAPTER 13


    which tell it that we want to compile a GNOME application that uses the GDA user
    interface library.


    The c-option tells the compiler not to worry about external dependencies (as functions
    from the GNOME-DB or GNORBA libraries) until we link (in lines 14-15).


    **Line 2.** Again, the gda-config utility is used, this time to get the linking
    flags for our application (this handles linking in all the GNOME and GDA libraries).


    **Line 4.** These are the two object files that we''ll link to create the final
    executable.


    **Line 6.** This is a target that specifies the ultimate goal of this Makefile:
    creat-ing executable file db_login.


    **Lines 8 and 9.** These lines tell that login_o is dependent on login.c and login.h,
    and it should use the C compiler ($CC) and the CFLAGs set in lines 1 and 2 to
    compile these files. The $$& refers to the target (login.o) and the $< refers
    to the first dependency, login.c.


    **Lines 11 and 12.** These lines function identically to lines 8 and 9, but they
    compile db_login.c to db_login.o.


    **Lines 14 and 15.** These lines contain instructions to link the object files
    (see line 4) into a final executable. The GNU C compiler is capable of linking,
    so it is used here instead of ld (which is the name of the standard Unix linker).


    **Lines 17 and 18.** This target cleans up the executable (db_login) and the object
    files. It is useful if you want to package the file before shipping it out.


    When you run the compilation, the following things happen:


    +   1. db_login.o is created.

    2. login.o is created.

    3. db_login.o and login.o are linked to the GDA client and UI libraries, as well
    as a bunch of other libraries, producing the final executable: db_login (to see
    a list of the libraries, run the command gda-config—libs gdaui gnome on the shell).


    To run the program, simply run the command db_login from the shell. In most cases,
