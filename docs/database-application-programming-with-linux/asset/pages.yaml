  md: '# Identify the Entities You Want to Represent


    The first step in designing a database is to make sure you know what entities
    you want the database to represent. For example, if you are designing a database
    for a public library, two of the entities your database will represent books and
    patrons.


    It is also helpful if you have some ideas about how the entities interact with
    one another. If patrons can take out several books at a time, your logical database-base
    design will be different than it would if patrons are allowed to take out only
    one book.


    In the case of a public library, it seems to make sense to take for granted that
    patrons can take out more than one book. However, it is a good habit to explicitly
    specify these sorts of constraints before you design a database. Something that
    is obvious to one person may not be obvious to another, and you will avoid misunderstanding
    if you spell out all the issues in advance.


    This stage of database design is dependent on requirements analysis and definition,
    which is covered in detail in Chapter 1, “Requirements.” Let’s examine the database
    requirements for a public library database. As we do this, let''s make sure the
    following questions are answered:


    What are the concepts and/or real-world objects are you trying to model?

    You can answer this question by reading the requirements and looking for nouns
    (persons, places, and things) that the requirements seem to focus on. For example,
    patrons and books are obvious concepts at first glance. The section titled Identify
    Concepts in Chapter 7, “Object-Oriented Analysis,” describes a more rigorous approach
    to answering this question.


    How is each relationship qualified? For example, there is certainly a relationship
    between patrons and books. What phrase describes that relationship? For another
    approach to answering this question, see the Discover and Diagram Associations
    section in Chapter 7.


    What constraints exist? For example, there is a stated limit on the number of
    books a patron can check out? Under what circumstances would a patron be prohibited
    from borrowing a book?


    # Use the Requirements


    Like other aspects of system requirements, the database design is subject to change
    over the life of your software. You will come up with an initial definition that
    will be subtly modified as you grow closer to an initial release. Even after the
    software is released, future versions will'
