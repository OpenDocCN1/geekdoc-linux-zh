    attributes. The : tells you that the attribute belongs to the entity. So, Book:ISBN
    refers to the ISBN of the Book entity.


    A many-to-many relationship is modeled by creating an entity between two entities.
    In this case, we are creating the Borrows entity between Patron and Book. The
    Borrows entity has the following attributes:


