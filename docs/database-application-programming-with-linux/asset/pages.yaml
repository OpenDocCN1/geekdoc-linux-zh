    # Lost Updates


    When you have more than one user working with the database system at the same
    time, most operations proceed as they would be in a single-user situation. However,
    there are some situations where multiuser access creates complicated situations.


    **Problem.** A multi-user database system can process many changes concurrently.
    How do we keep changes submitted by one user from colliding with changes made
    by another user?


    **Example.** Consider a system that tracks inventory. Two sales are made roughly
