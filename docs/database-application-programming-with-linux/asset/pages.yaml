  md: '# The Security of Initial Accounts


    ```

    bash2-2.03$ cat -vt /tmp/invoice.out

    001^IBig Company

    002^ILittle Co., Inc.

    ```


    Many database systems come with one or more well-known default users and passwords.
    In order to secure the state of your database, you should change the passwords
    or delete the users.


    PostgreSQL. PostgreSQL comes with one account by default, which corresponds to
    the Unix user id of the user who manages and runs the database. This user is usually
    named postgres.


    If you do not make any changes to its configuration, PostgreSQL allows any user
    on the local machine to connect to the database as any user, including the postgres
    account. That is, PostgreSQL does not use passwords to authenticate a user; it
    trusts any user on the local system.


    To secure your installation, you should examine the pg_hba.conf (or pg_hba.conf.sample)
    file that comes with PostgreSQL, and select a level of authentication you are
    comfortable with. If you installed PostgreSQL from a source distribution, this
    file needs to reside in /usr/local/pgql/data/pg_hba.conf. Some versions of Linux
    (such as RedHat 6.0) may store this file in /usr/lib/pgql/pg_hba.conf.


    For more details, read the pg_hba.conf and pg_passwd man pages (type ''man pg_hba.conf''
    and ''man pg_passwd'').


    MySQL. By default, MySQL comes with a root user that has no password. After you
    install MySQL, you should set a password for this account with the command:


    ```

    mysqladmin -root password secret

    ```


    (replace secret with the password you want to use).


    From that point on, you may only use mysqladmin or other mysql utilities using
    the -p command line argument to specify a password. The -u command is useful if
    you are running the command as another user. For:


    ```

    bash2-2.03$ mysqladmin -root -psecret ping

    mys is alive

    ```


    In general, you should be cautious putting passwords on the command line, as they
    can be seen by utilities as ps. A safer way to do this is to use -p without the
    password, and you will be prompted for a password:'
  merge: -1
