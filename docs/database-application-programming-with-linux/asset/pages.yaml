    # Tangram: Object-Relational Mapping in Perl


    Tangram is a wonderful module for Perl that automatically maps your application
    objects to a relational database representation. It also happens to be free software.
    Tangram handles such features as aggregation, inheritance, polymorphism, and sophisticated
    retrieval facilities. You can get Tangram from CPAN (see the CPAN section in this
    chapter for instructions on installing a module from CPAN). Before you install
    Tangram, you may need to install the module Set::.


    We discussed the problems of bridging objects and databases in Chapter 8, "Object-Oriented
    Design," in the section *Designing for a Three-Tier Architecture*. The discussion
    of Figure 8.3 in Chapter 8 for an example of this problem. Also, see the section
    *Bridging Database and Objects* in Chapter 8 for more information. An object-relational
    mapping tool such as Tangram solves many of these problems by putting a sophisticated
    abstraction layer between the database and your objects.


    In this section, we''ll look at some of the functions you can do with Tangram,
    including an example that integrates Tangram and Tk. This discussion will only
    scratch the surface. However, Tangram includes some great documentation that explains
    this useful tool in more depth.


    # Defining a Schema and Classes


    Tangram supports your efforts from start to finish. Before you use Tangram you
    must tell it how your database is structured, and use the Tangram::Deploy module
    to create the tables and prepare the database. To define a schema, you must write
    a Perl module that creates a schema object. We suggest that you create this in
    a file that also contains class definitions, since this will keep your schema
    close to the classes it describes.


    Let''s look at the Objects.pm file, which contains schema definition and class
    definitions for a simple contact database. It will support a company, employee,
    and job title. Objects.pm will handle the following:


    **Create a schema.** A Tangram schema is encapsulated in the class Tangram::Schema.
    To define a class, you must create a nested hash that contains class definitions
    and pass it to Tangram::Schema''s constructor. For example, this hash would define
    an object Employee with a first name (Inname), last name (Lname), and two mysterious
    attributes, title and employer:'
