  md: 'current data model, we''d have to allow for repeating values: some books would
    have one, two, or more authors as shown in Figure 2.2.


    Repeating attributes can be problematic in a number of ways:


    **They can result in wasted storage.** If you allow an entity to contain repeating
    attributes, you need to include attributes for each value (Author One, Author
    Two, Author Three, and so forth). Most books will probably have one author. For
    those, the Author Two and Author Three attributes will remain empty, which is
    a waste of space.


    **Using repeating attributes requires you to live with arbitrary constraints.**
    If you design the database to handle up to three authors per book, you will need
    to modify the structure of your database when you come across a book with four
    or more authors.


    **If you use repeating attributes, you will find that it is more difficult to
    formulate queries on your database.** This is because SQL was designed with the
    same considerations that went into the design of the normal forms.


    How do we resolve this problem? The first step is to create a new entity to representing
    repeating values. In this case, the entity will be an author, so it makes sense
    to add an Author entity. The Author entity will have the following attributes:
    First Name, Last Name, and Author ID.


    Because one author can write many books and one book can have many authors, we
    will use a many-to-many relationship. In order to represent this relationship,
    we need to create a new entity, which, like the other entities, will become a
    table when we write the DDL. We will call this new entity “Author Of” to signify
    that a particular Author entity is the author of a given Book entity. The Author
    Of entity has the following attributes: Author ID and ISBN. Together, these values
    form a *compound primary key* (two or more attributes) that identifies a unique
    instance of the Author Of entity. Because an author can write a book only once
    (for the purposes of this example, we are discounting multiple revisions of the
    same book), an instance of the Author Of is *uniquely identified* by a combination
    of ISBN and Author ID.


