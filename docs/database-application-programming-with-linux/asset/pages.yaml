    If you''ve used GUI toolkits as Tk or Java''s AWT, you will probably be comfortable
    with GTK+, at least you get over the shock of an object-oriented framework for
    C. Even if you haven''t worked with similar toolkits, you should find GTK+ easy
    to learn.


