    # Networking


    Data Networking is a very interesting subject. Signal processing, copper and fiber
    optic cabling, Ethernet, Packet framing and switching, and Routing are all complex
    and diverse subjects: What makes TCP/IP one of the great achievements in computing
    is that it provides a standardized interface to every possible engineering solution
    from all of the preceding disciplines. The way that TCP/IP accomplishes is to
    break the networking infrastructure into a series of layers, in which each layer
    has only to be aware of the layer directly below it, the layer directly above
    it. The top layer of the TCP/IP stack (also referred to as the OSI model) is called
    the Application layer. This is the layer that software programs use to put data
    onto the network, and since BSD 4.3, the operating system interface that programmers
    use to access the Application layer has been called a socket. Sockets, like most
    good things in Unix, act something like a file; you can open them, read from them,
    write to, and close them.


    Communication requires two participants: one who is talking, and one who is listening.
    Dialog requires that there be some way for the person who was listening to talk
    once in a while. And if you''ve ever been party to a metussion about interpersonal
    communication, you know that there needs to be some way to start a conversation
    in a silent room. TCP/IP protocols are the mechanisms that network programs use
    to keep from going to bad angry, and Client/Server is a framework that uses TCP/IP
    protocols to create useful application programs.


    Client/Server defines two participants, a client and a server. The server''s job
    is to listen until spoken to. The client''s job is to start a conversation. Client
    and server punctuate and signify their conversation using a pre-agreed protocol,
    which governs when the client may speak, when the server may reply, and what the
    possible topics of conversation are. SMTP is an example of a client-server TCP/IP
    protocol. In SMTP:


    +   - The client says hello to the server.

    - The server says hello to the client.

    - The only possible topic of conversation is about sending e-mail.

    - The client and server agree that the end of one line means that the other party
    can begin speaking.'
