    # The Value of Patterns


    Remember, a pattern is a solution, but it is not meant to be treated as reusable
    code. Patterns often include examples to aid in explanation, but there is no reason
    you dont need to implement the solution using the same class names and methods
    in the example. Patterns are more abstract than implementations; they suggest
    the classes and collaborations that make up a potential solution. You can then
    superimpose this suggestion on your problem to create a solution.


    Patterns make systems easy to explain—using patterns, two programmers can communicate
    about a system on a high level, but express enough to be able to understand the
    nuances. Patterns also provide a way to codify and communicate programmers'' experiences
    to share with others, or recollect themselves at a later date (Gamma, et al).


    Patterns help us break problems down by recognizing several places where patterns
    can be applied within complex problems. This makes systems easier to understand
    because we can look at a system as an applied set of patterns. Patterns free us
    to think about complex systems on a higher level.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_200_0.png)


    Figure 8.6 Observing a directory''s contents.'
