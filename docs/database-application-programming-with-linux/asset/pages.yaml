  md: '# GTK+ Widgets


    There are many widgets in GTK+ that you can choose from: buttons, text areas,
    and windows. Figure 13.3 shows just a few of these widgets, as well as their parent
    classes in the inheritance tree.


    # Developing User Interfaces with Glade


    Glade is a user interface builder for GTK+ and GNOME. Glade is similar to commercial
    GUI builders in that you select a widget from a palette, and actively draw the
    screen. Figure 13.4 shows Glade in action (the screen titled window1 is a simple
    window built with Glade).


    You can find Glade in many Linux distributions, or you can visit the Glade home
    page at http://glade.pn.org for downloads and more information.


    Glade uses a simple XML file format to specify the screen layout. It is so simple
    that you can edit these XML files directly (although the easiest way to deal with
    them is through the Glade program itself). Although Glade can generate code that
    the widget definitions, the libglade library makes it very easy to use these XML
    screen definitions directly in your own programs. We''ll look at both approaches
    in this chapter, and you can decide what is best for your needs when it comes
    to build your own programs.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_409_0.png)


    **Figure 13.3** Some of the GTK+ widgets.'
