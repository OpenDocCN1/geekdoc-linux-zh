    # Prepared Statements


    If you anticipate that you will be using the SQL statement many times, you can
    use a prepared statement. Some database servers may compile the query on the server,
    which can produce a performance benefit if you call it multiple times.


    You can also use a prepared statement to create placeholders in a SQL statement.
    For example, if you wanted to insert three rows into the count table, you could
    create a prepared INSERT statement with placeholders (question marks) for the
    values:


    ```

    my $sth = $dbh->prepare(''*INSERT INTO contact

    (first_name, last_name, company)

    VALUES(?, ?, ?);

    ```


    That gives you a statement handle, $sth. You can call the statement handle''s
    execute() method with the values that should go into the placeholders. The database
    driver or back-end server takes care of putting quotes around the values that
    need.


    ```

    $sth->execute(''Brian'', ''Jetson'', ''FrobCo'');

    ```


    The preceding command is the equivalent of issuing the following INSERT statement:


    ```

    INSERT INTO contact

    (first_name, last_name, company)

    VALUES(''Brian'', ''Jetson'', ''FrobCo'');

    ```


    Not only is this convenient, but it can also be much faster, especially if the
    statements occur inside a loop that is executed many times. Here is an exam-'
