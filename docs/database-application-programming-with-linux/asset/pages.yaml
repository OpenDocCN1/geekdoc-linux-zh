  md: '# SQL Reference


    A word of caution: The modification of views poses a special problem with regard
    to database consistency. The problem is that if you modify a view, you will want
    the base tables from which it is derived to remain consistent. However, if you
    modify a view, the changes that should be made to the base tables will not necessarily
    be uniquely determinable. This is especially true when using aggregate functions
    and joined tables. Read the documentation of your system to determine if you are
    able to update views, and pay special attention to how this is done to avoid surprising
    results. Also do a little reading in a database to be aware of the problems that
    can arise if this is not without caution.


    As an example, most systems do not permit the update of views that are derived
    from joins. Consider a view based on some of the tables defined in Chapter 2:


    ```

    CREATE VIEW borrowed_books

    AS SELECT last_name, title

    FROM patron, borrows, book

    WHERE borrows.patron_id = patron.patron_id

    AND borrows.isbn = book.isbn;

    ```


    Suppose that you wish to alter the view by changing the spelling of the last name
    Smith to Smyth in the row, Smith, The Tragic Empress. However, there are two ways
    to effect this change in the view from the perspective of the base tables. One
    way is to change every last name spelled Smith to Smyth. Another is to change
    this spelling only for the rows in borrow involving Smith and The Tragic Empress.
    Now if for some reason, there is no patron named Smith, the database will have
    problems. As you can see, the solution is straightforward. In general you should
    be careful with updates over views.


    # DELETE


    The format of a basic DELETE command is simple. To delete a row from a table:


    Beyond this basic, the DELETE command can also be used in combination with many
    of the joining and nested querying techniques described above in order to target
    the rows that should be deleted. Of course, deletion can be a risky operation,
    so exercise this with caution and make frequent backups!'
