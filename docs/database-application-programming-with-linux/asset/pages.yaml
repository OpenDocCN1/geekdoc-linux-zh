- img_proc: true
  md: "# CHAPTER 4\n\n4. Write the PDL in human language, not in a programming language.\
    \ The PDL is a direct translation of the algorithm and data structure description\
    \ into an explicit outline of the steps that the routine takes. Avoid the temptation\
    \ to use PDL to describe how the routine will run. Instead, focus on the level\
    \ of intent: what you want the routine to do. What versus can be a subtle distinction.\
    \ Here is the PDL:\n\n```\nif the array is empty\n    set the return values to\
    \ undefined or null\n    print a warning message\nelse if the array is not empty\n\
    \    sort the input array numerically into another array\n    remove and save\
    \ element one (the min) of the new array\n    set the count to one\n    while\
    \ the top value of the sorted array equals the min\n        remove the top element\n\
    \        add one to the count\n    if the count is greater than one\n        print\
    \ out a warning message\nreturn the min and the count\n```\n\n5. Check the PDL.\
    \ Keep checking and refining the PDL until you feel it is time to write the code.\n\
    \n6. Write the routine declaration and opening/closing braces. Indent as appropriate.\
    \ Use the algorithm and data structure description as the description of the routine:\n\
    \n```\n# This routine will sort the input array and store the\n# result in another\
