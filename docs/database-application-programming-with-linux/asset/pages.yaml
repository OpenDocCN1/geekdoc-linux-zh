    # Hitting the Ground Running


    > In this chapter, we''ll look at databases from a conceptual and design viewpoint.
    If you do not currently have a database system installed, and would like to use
    one to work through the SQL examples later in this chapter, you should visit Chapter
    9, “Databases,” and get set up with a database before you read this chapter.


    # Designing a Database


    In order to get the most performance and flexibility out of a database, you should
    follow an established set of database design guidelines. These design result in
    database systems that scale well and handle everything from the simplest to the
    most exotic queries.


    In typical database systems, you will only be concerned with the logical structure
    of the database: the tables, their columns, and the relations between tables.
    The physical structure of the database is handled by the database management system
    (DBMS), and includes how and where the tables are stored on disk, the algorithms
    used to index tables, and other facets of database management you won''t have
    to worry about.


    Let’s look at the steps involved in designing a simple database. You can follow
    these steps in designing your own databases.'
