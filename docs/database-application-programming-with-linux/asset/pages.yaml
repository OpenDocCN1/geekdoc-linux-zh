  md: '# Oracle


    Unfortunately, Oracle does not have a utility that can be used to create SQL dumps
    from a database, or to easily create delimited files that can be loaded into other
    systems. A crude methods of achieving a tab-delimited dump is shown next, where
    the || (concatenation) operator is used to con-cate field values with the tab
    character.


    You should save these commands into a file exported_invoice.sql (type <TAB>—make
    sure your editor does not replace tabs with spaces!):


    ```

    rem

    rem ECHO OFF - Suppresses echoing of commands

    rem - as they are executed

    rem FEEDBACK OFF - Suppresses record count reports

    rem HEADING OFF - Suppresses column headings

    rem NEWPAGE OFF - Don''t send formfeeds or blank

    rem - lines between pages.

    rem

    rem TEREOUT OFF - Don''t display output of

    rem commands.

    rem TRIMPOOL ON - Trim trailing blanks in output.

    rem


    SET ECHO OFF;

    SET FEEDBACK OFF;

    SET HEADING OFF;

    SET NEWPAGE NONE;

    SET TEREOUT OFF;

    SET TRIMSPOOL ON;


    rem

    rem Spool the results to an output file with

    rem columns delimited by a tab character.

    rem

    SPOOL /tmp/invoice.out


    SELECT inv_no || ''<TAB>'' || customer_name

    FROM invoice;


    SPOOL OFF;


    QUIT;

    ```


    Then, load this script into SQL*Plus, as shown in this example:


    ```

    sqlplus bjepson/open_sesame@export_invoice.sql

    ```


    Then you can see that tabs have been inserted into the output:'
