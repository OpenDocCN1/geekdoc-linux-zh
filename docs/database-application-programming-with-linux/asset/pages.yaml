    # Creating a database. Creating a database under Oracle is complicated, involves
    fundamental changes to the configuration of Oracle itself. When you install Oracle,
    a database is usually created for. If you must create a database, Oracle''s Database
    Assistant program, dbassist.


    Fortunately, you shouldn''t need to create another database under most circumstances.
    Like Sybase (which is discussed next), Oracle puts the objects created by each
    user into a separate schema (a schema is a logical organization of tables and
    other database objects). So, when the user bepson creates a table test_table,
    and user joan creates a table of the same name, these tables are created within
    separate schemas. So, you could select all the rows from joan''s table with the
    command SELECT * FROM joan.test_table, and all the rows from bepson''s with SELECT
    * FROM bepson.test_table.


    If you would like to create a separate work area for a given user, you should
    use a tablespace, which is a unit of storage in which you can create database
    objects as tables. You can create a tablespace with the CREATE TABLESPACE command.
    Consult the Oracle documentation for more details.


    # Sybase Adaptive Server Enterprise


    Sybase is a relational database system that includes advanced data management
    features such as stored procedures, triggers, and declarative referential integrity.
    Sybase was one of the first major database vendors to recognize Linux. Although
    they did not port their server to Linux as quickly as some of us would have liked,
    they offered a free download of their client libraries, enabling Sybase programmers
    to develop applications to access Sybase servers on other platforms.


