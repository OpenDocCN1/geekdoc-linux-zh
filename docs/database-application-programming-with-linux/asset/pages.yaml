    | Motha Goose | 10 Storyville | 555-1002 |


    For most database management systems, any parallels between the database and objects
    end here: Purely relational database management systems are not object oriented.
    All but two of the database systems we cover in this book are purely relational.
    The exceptions are PostgreSQL and Oracle, which have object-relational features
