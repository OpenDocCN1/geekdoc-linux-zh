    you generate output in a variety of formats, including HTML and delimited text.
    You can obtain kpsql at www.mutinybaysoftware.com/kpsql.


    PgAccess This is a sophisticated database development environment written in Tl/Tk.
    It has many features styled after Microsoft Access, including a form builder,
    report designer, schema design tool, and powerful capabilities. The PgAccess home
    page is at www.flex.ro/pgaccess.


    # Oracle Tools


    The following are some tools designed specifically for Oracle:


    OraSoft Application Suite. The OraSoft Oracle Applications for Linux page, at
    http://oracle.matthouse.com, is home to a development effort to build a full-featured
    suite of tools for working with Oracle on Linux. At the time of this writing,
    this includes a table browser, visual query tool, stored procedure editor, a server
    monitoring tool, and the powerful Object Manager.


    ora_explain. The DBD:Oracle database driver (see the section titled Installing
    Database Drivers (DBDs) in Chapter 12 where to get this) includes the powerful
    ora_explain tool. This is a visual tool for inspecting Oracle query plans, which
    shows you how the Oracle engine will handle a given query. ora_explain also lets
    you monitor and visualize the query plans for all the SQL that the server is currently
    processing (even for other users). Query plans are a complicated facet of database
    servers, which can be indispensable when you need to optimize a query. ora_explain
    takes a lot of the mystery out of this process.


    Orac. Orac is a powerful database administration tool written in Perl. It includes
    a vast array of features that help support, maintain, and tune an Oracle site.'
