    Sybase, Mini SQL, MySQL, and PostgreSQL). Although there is a common SQL dialect
    that all these database servers speak, there are some differences, especially
    in terms of which data types the server supports.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_58_0.png)


    Identifiers

    an identifier is the name of something, like a table, column, or variable. Identifiers
    should not be confused with literal values, such as the integer value 100 or the
    string value "This string has 29 characters". While you can generally use any
    character on the keyboard in a literal string, there is a limited set of characters
    that you can use in an identifier.

    All database servers allow you to use identifiers that start with an alphabetic
    character (a-z and A-Z) that is followed by one or more alphanumeric characters
    (a-z, A-Z, 0-9, and _, the underscore character). Examples of valid identifiers
    include A, A1, Author, Author_Number. Invalid identifiers include 100, 10Author,
    and Author#.


    The CREATE TABLE statement looks like this:


    ```

    CREATE TABLE <table name> (<column declaration list>)

    ```


    where <table name> is any valid identifier that your database server supports,
    and <column declaration list> is a comma-delimited set of column declarations
    of the form:


    ```

    <column name> <type> [ ( <optional-size>, <optional-precision> ) ]

    ```'
