    Use comments to describe your intent. Don''t write comments that simply repeat
    the code does. Instead, write comments that describe the intent. Focus on the
    why, not the how. For example, here is a bit of Python code that documents how
    things are happening:


    ```

    # Multiply sales by the rate, and add the result to base.

    #

    total = base + (sales * rate)

    ```


    Contrast that example to this code, which documents why the calculation is happening,
    which preserves your intent:


    ```

    # Calculate the sales commission and add it to the base

    # to figure out the employee''s total salary.


    total = base + (sales * rate)

    ```


    Avoid gratuitously complex formatting. Don''t use excessively ornamental or complicated
    formatting, because it will be so complicated that no one will bother to update
    it. Consider this bizarre case:


