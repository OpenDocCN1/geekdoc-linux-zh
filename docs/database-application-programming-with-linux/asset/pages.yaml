    need to know about the internals of the module. Figure 4.2 shows an example of
    two objects that are highly coupled, while Figure 4.3 shows two objects that exhibit
    lower coupling.


    # Information Hiding


    Coupling is closely related to the notion of information hiding. Loosely coupled
    modules hide internal data and private information well. Information hiding has
    a lot more depth, though. It is a technique that will make your programs safer,
    more maintainable, and more understandable to other programmers. One practical
    benefit of hiding information is that when things (such as when you port your
    application to a different GUI library), you only need to change your code in
    one place: the module that hid the GUI dependency from the rest of the system.


    McConnell refers to the information you hide as "secrets." He goes on to suggest
    some categories of information that you might want to hide. The following-list
    of categories is based on McConnell''s list, but with some changes. In


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_131_0.png)


    Figure 4.2 High coupling.'
