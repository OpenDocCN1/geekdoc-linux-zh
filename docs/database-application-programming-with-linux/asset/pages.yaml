    # Putting Data into the Database


    Once you have created the tables, you will need to put some data into those tables.
    The INSERT statement creates to add new rows to the table, and fills one or more
    of the new row’s columns with data. Choose which columns to fill with data by
    including a list of columns and values.


    The INSERT statement consists of the keywords INSERT INTO, followed by the table
    name. After the table name, the columns appear in a parenthesized list, and the
    values to insert appear in a second parenthesized list preceded by the VALUES
    keyword. One general form of the INSERT statement looks like:


    ```

    INSERT INTO <table name>

    (<column-list>)

    VALUES (<value-list> )

    ```


    If your CREATE TABLE statement declared a column NOT NULL, you must specify that
    column in the INSERT statement. For example, you could add a row to the patron
    table with the following command:


    ```

    INSERT INTO patron

    (first_name, last_name, patron_id)

    VALUES (''Brian'', ''Jepson'', 100)

    ```


    However, the following command would fail, because you did not specify the first_name
    column, and the database assumes you want to insert a NULL for the first_name
    column (as well as all the other columns you didn’t specify; if those columns
    were created as NOT NULL, the database will generate errors when you try to insert
    a NULL):'
