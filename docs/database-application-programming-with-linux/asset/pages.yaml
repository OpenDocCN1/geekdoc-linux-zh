  md: '# Database Design


    the table is a little bit of a mess. We have to deal with this mess before we
    can decide what Publisher Name is dependent on.


    Here are some possible solutions to clean it up:


    +   - Represent the publisher code as an attribute in the Book entity.

    - Split the ISBN into two attributes, Publisher Code and Book Code. Then, you
    can regenerate the ISBN by concatenating the two.


    The first choice is by far the cleanest alternative. While it introduces redundant
    information into the Book entity, it is a reasonable trade-off to make. On the
    other hand, since ISBN is always referred to as a whole, breaking it into two
