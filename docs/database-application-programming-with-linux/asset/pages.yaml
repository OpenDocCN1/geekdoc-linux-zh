    To configure a data source:


    +   1. If you don''t already have it, obtain the source code distribution of GNOME-DB.

    2. Copy the file gdalib.sample to ~/gnome/gdalib (the file named gdalib that is
    contained in the .gnome subdirectory of your home directory). The gdalib.sample
    file can be found in the top-level directory of the GNOME-DB distribution:


    ```

    bash-2.03$ cd /usr/src/bjepson/gnome/gnome-db

    bash-2.03$ cp gdalib.sample ~/gnome/gdalib

    ```


    +   3. Open your copy of the gdalib file in a text editor, such as vi or emacs.
    Add a data source description to the file. A sample data description is shown
    here, and explained in Table 13.4.


    ```

    [MySQL]

    provider=gda-mysql

    dn=DATABASE=bjepson_db;UNIX_SOCKET=/tmp/mysql.sock

    Description=Brian Jepson''s MySQL database

    Configurator=None

    ```


    Table 13.4 Data Source Breakdown

    | LINE | DESCRIPTION |

    |---|---|n| [MySQL] provider= | The name of the data source. The name of the GDA
    provider. |

    dn= | Information used by the provider to connect to a data server. For all other
    providers, like gda-odbc provider, it is a semicolon-delimited list of keyword/value
    pairs (KEYWORD1=VALUE1;KEYWORD2=VALUE2). See Table 13.5 for an explanation of
    the various keywords that can be used.

    With Oracle, you can leave the dsn blank, because the client library will make
    use of the environment variable $ACLE_SID which should contain the name of your
    Oracle system identifier. |

    Description= | A verbose description of the data source. |

    Configurator= | Reserved for future use.'
