- img_proc: true
  md: 'well with each other. If you want to build an application with database access,
    a user interface, automatic graph generation, you can find freely redistributable
    source code on CPAN that is trustworthy.


    CPAN consists of a collection of more than 100 cooperating Web and ftp sites that
    mirror the content of the main archive. You can learn more about CPAN by visiting
    the CPAN dispatcher at www.perl.com/CPAN (no trailing slash), which you can use
    to find a CPAN site close to you.


    # Installing CPAN Modules


    There are two ways you can install a CPAN module such as DBI: use a precompiled
    package or build it from the source code. Before you do either, check to see if
    the module is already installed on your system (some Linux distributions install
    various modules by default). To check for the existence of a module, try loading
    it with the -M switch to Perl and confirmation script with -e:


    ```

    perl -MMODULE_NAME -e ''print ''OK\n'';

    ```


    For example, you could check for the existence of the DBI module with:


    ```

    perl -MDBI -e ''print ''OK\n'';

    ```


    If this program prints OK, the module is installed. If you see an error message,
    it is not installed.\ If the module is not installed, use one of the methods described
    next to install it. When you are doing installing the module, you should read
    its documentation. To read a module''s documentation, issue this command from
    the shell:


    ```

    perldoc MODULE_NAME

    ```


    as in:


    ```

    perldoc DBI

    ```


    Precompiled package. Many Linux distributions come with Perl modules, or include
    utilities that know how to find a module. If you are running a variant of the
    Debian distribution, use Debian''s dselect program to locate and install the module.


    If you are running an RPM-based Linux system, use an application that is capable
    of locating RPMs on the Web, such as gnorpm or rpmfind. You should search for
    and install the RPM (RedHat Package Manager) file that contains the module. RPMs
    containing Perl modules are usually titled Perl-MODULE_NAME, as in Perl-DBI.'
