    Real. An approximate floating-point value that is generally four bytes wide.\Time.
    A time expression of the form HH:MM:SS, such as ''06:45:00'' or ''23:59:59''.
    Some implementations combine date and time into one. Sybase uses the datetime
    type, which can be assigned a time value (such as ''23:59:59'') without a date
