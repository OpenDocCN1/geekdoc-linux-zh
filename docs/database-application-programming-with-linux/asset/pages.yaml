    In this chapter, we''ll focus on a responsibility-driven design that, for the
    moment, ignores the issues involved with the database and user interface requirements.
    The responsibility-driven design will produce a design that accounts for the domain
    logic, and *nothing else*.


    It might seem insane to not consider the needs of the database and user interface,
