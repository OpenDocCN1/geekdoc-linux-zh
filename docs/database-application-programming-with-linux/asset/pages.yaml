    The solution to the testing issues involves a change in the definition of software
    quality. In classical software engineering, it was a truism that you never test
    developers, for they have too much of an understanding of why things can go wrong
    and too much empathy for the original developers. The thinking went that they
    will not provide you with objective feedback about the performance of the program.
    It was also a truism that users and developers often disagree about what constitutes
    a bug. This leads to the requirement that any user feedback be filtered by a “responsible”
    project manager, who would classify and prioritize issues (with the most common
    classifications being “Functioning as Designed” and “Training Issue” and the most
    common priority being “On Hold”). If you define software quality as unsatisfactory,
    the software will always be unsatisfactory. Users do not care about requirements
    documents or successful cases, they care being able to do what they want to do.


    Once you redefine software quality in this way, it is clear that what actually
    want is for your users to become developers and your developers to become testers,
    at least until an end-user-friendly release of your product ships. Consider Helix
    Code (www.helixcode.com), who distributes an end-user-friendly release of the
    GNOME desktop, complete with friendly installation and upgrade wizards. If your
    users are developers, they will be able to create satisfactory software, because
    they will be empowered to write the functions they require, and modify the program
    to produce the output they desire. If your developers are testers, they will understand
    what the software is supposed to do, and be able to fix defects during the testing
    process, rather than putting the requests back into the already backed-up development
    queue.


    This definition, along with the introduction of the Internet, again brings logarithmic
    benefits to the testing process, which overcome the exponential growth in testing
    requirements. The testing process becomes more efficient, because defects are
    fixed directly in the testing process, rather than in a separate development process.
    Adding 50 motivated testers means that you don’t have to try and minimize the
