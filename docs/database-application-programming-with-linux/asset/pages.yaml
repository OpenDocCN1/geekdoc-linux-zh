    \ specializations of the motorized vehicle class. The motorized vehicle class\
    \ can be said to be a generalization of the other two classes.\n\n```\n```\nMotorizedVehicle\n\
    +maximum_speed:\n+weight:\n+start_engine( )\n+stop_engine( )\n      |\n      |\n\
    Automobile      RidingLawnmower\n+number_of_doors: +blade_length:\n```\n```\n\n\
    Figure B.2 Generalization.\n\nAssociation. Associations show the relationships\
