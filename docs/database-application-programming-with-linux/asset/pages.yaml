    Next is an SQL statement that creates the line_item table. The REFERENCES clause
    takes the form REFERENCES table(column), where table is the name of a table, and
    column is the name of a column within that table that has a unique index. Since
    a primary key has a unique index, you can reference a primary key in this way:


    ```

    CREATE TABLE line_item

