  md: 'How a Staff Coordinator gets the timesheet figures. The system should generate
    a Weekly Summary Report that lists each customer name. For each customer name,
    the report should state the total number of hours for all consultants, and the
    amount to bill the customer. Within each customer, the report must show each project,
    the total number of hours for all consultants who billed to project, and the total
    amount to bill for that project. Within each project, the report must show the
