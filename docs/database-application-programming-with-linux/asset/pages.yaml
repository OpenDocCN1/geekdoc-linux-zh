  md: 'section Configuring Data Sources, later in the chapter. As of this writing,
    the Configurator was not yet implemented.


    The data sources are stored in a file named gdalib, which resides in the user''s
    private . own directory. Let''s look at an excerpt from a gdalib file. The name
    of the data source is MyDatabase, and it uses the gda-postgres Provider to connect
    to the database name bjepson on the local PostgreSQL server, as the user bjepson
    (under PostgreSQL, each user''s private database is named after his or her user
    name)


    ```

    [MyDatabase]

    Provider=gda-postgres

    DSN=bjepson;HOST=localhost

    Description=My Personal Database

    Configurator=None

    Username=bjepson

    ```


    Don''t worry about setting up this file right now. We''ll talk about it in the
    section Configuring Data Sources.


    How does GNOME-DB use these data source descriptions? When you run a GNOME-DB
    application, one of the first things you''ll see is the login screen (refer Figure
    13.17 later in this chapter), which prompts you to select a data source and supply
    your user name and password. The user name you supply at login overrides (and
    replaces) whatever setting you have in your gdalib file.


    # GNOME-DB in Action


    Let''s illustrate how these components work together in two informal scenarios,
    with sequence diagrams. As you read these, keep the following in mind:


    +   - While the scenarios are very close to how GNOME-DB works, they are intended
    as a conceptual description to help you understand how the pieces go together,
    not an exact description.

    - When you write your own GNOME-DB programs, you don''t need to worry about all
    these details!


    Scenario: User connects to database (see Figure 13.14).

    Participants: User, Application, GDA Client library, GDA Provider, and Database.

    Scenario: Fill a grid with the results of a query (see Figure 13.15).

    Participants: Application, GDA Client Library, GDA Provider, Database, GnomeDbGrid.

    Prerequisites: User connects to database.'
