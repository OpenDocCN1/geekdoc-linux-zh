  md: '# CHAPTER 14


    # # Software Architecture


    In Chapters 5 through 8, we discussed the process of developing software, and
    specifically, object-oriented programming. Object-oriented programming is a set
    of constructs that enable modularity in the software development process. In this
    chapter, we are going to discuss the process of deploying software, and examine
    how this process impacts the software development process, and particularly object-oriented
    design.


    When you deploy software, you want the program to run correctly from start to
    finish. The fact that there are no defects in the development system does not
    mean that there will be defects in the production system. You want your program
    to run as quickly and efficiently as possible. You want your program to be able
    to recover from any unforeseen conditions. You want to be able to upgrade your
    program. You only want people using your program who are authorized to use it.
    You want as many people as possible to be able to use your software. Bottom line:
    Getting people to use new software tools is difficult enough, so you don''t need
    any more problems, especially problems that are external to the software itself.


    # ## Modularity and Troubleshooting


    A modular design is key to effective troubleshooting. If the system is broken,
    you need to be able to isolate the cause, or be able to replace the whole system,
    and if your job is to troubleshoot, chances are that replacing the whole'
  merge: -1
  pgno: 462
- img_proc: true
  md: 'system is not an option. So, you need to be able to isolate the cause. How
    do you do that? You take the largest testable chunk of the system and you see
    if chunk is working. If that chunk works, put it back in and move on to the next
    large chunk. If the first chunk doesn''t work, you take the largest testable chunk
    of the first chunk and repeat the process. When you find the broken part, you
    replace it with a working part. But if it is not a modular design, you can''t
    start by isolating the faulty component, and you need to take the whole thing
    apart, starting at the beginning.


    The most depressing aspect of troubleshooting is that the goal of the whole activity
    is to get the application back to where it was before someone started messing
    with it. Instead of replacing the timing belt whenever it breaks, a tune-up every
    six months. A tune-up is a different activity than trouble-shooting. In troubleshooting,
    either the system works or it doesn''t. In tuning, results come as a function
    (points on the curve, which is the range of possible performance), and your job
    is to find the sweet spot in the function (getting most efficiency from what you
    put in). But again, modular design is the key to effective tuning. If you cannot
    isolate portions of the system from the effects of the system as a whole, it is
    very difficult to find out if the system as a whole is running as efficiently
    as it could.


    Tuning doesnt necessarily need to be about halting (or slowing) the decline of
    a system. Suppose your problem is that you getting killed in Quake by the time
    your screen redraws, you are already dead. You run a series of tests and you figure
    out that the problem is that your video subsystem is too slow. If your video subsystem
    is a separate, removable component, all you have to do is replace the old, slow
    video card with a new, fast, video card, and presto, Quake is a whole new game.


    To summarize, a modular design allows your system to be flexible, reliable, and
    scalable, and these are all good things. In addition, a modular design gives you
    the freedom to make implementation choices.


    # Architectural Choices


    Suppose you were building single-family homes. If you were working with a shell
    that required a full basement, rather than just a slab, would limit the possible
    sites where you could construct this house. So ok, you could change the shell
    you were working with. But what if the blueprints specify a wall size that can
    only be accomplished with the basement-loving shell? Then you really have no choice,
    because even if you''re locked in buy-'
  merge: -1
  pgno: 463
- img_proc: true
  md: 'ing that particular shell, and even if your carpenters were trained to work
    with a variety of different shells, your architect made it impossible for you
    to deal with the situation (if the architect explains his design choice by saying
    ’That’s why there is a basement,’ you have my permission to throttle him).


    As a software architect, the major implementation choices you can make are: where
    the program is going to be stored, where the program is going to execute, and
    where the data is going to be stored. In making these choices, there are three
    factors to consider:


    **Network speed.** Accessing information across a network is an order of magnitude
    slower than accessing information from local disk, which is an order of magnitude
    slower than accessing information from main memory, which is an order of magnitude
    slower that accessing information from process memory.


    **Complexity.** The management complexity of a piece of software rises linearly
    with the number of sites where it stores data.


    **Price versus performance.** The price-performance curve of computer hardware
    is nonlinear; that is, a system that costs twice as will be much less than twice
    as good, and a system that costs four times much will be much less than four times
    as good.


    Another thing to remember is that it is quite possible to implement solutions
    to architectural problems using both hardware and software. Suppose you need to
    scale the processing power in a linear fashion? A hardware solution would use
    Symmetric Multi-Processing (SMP), and would place additional processors in a single
    machine. A software solution would use load-balancing algorithms to spread the
    processing burden across multiple machines, each of which has a single processor
    (Linux supports both approaches). Suppose you need to scale storage capacity in
    a linear fashion? A hardware solution would use a Storage Area Network (SAN) to
    link additional devices to a single machine. A software solution would use the
    Network File System (NFS) to link the storage of multiple machines. Suppose you
    need to encrypt data sent across the network? A hardware solution would use a
    network-card that encrypts data using a Virtual Private Network. A software solution
    would use Secure Sockets Layer (SSL) to encrypt data using a public key encryption
    algorithm.


    Within these parameters, you can make a lot of different choices, but as a rule
    of thumb you should have centralized storage (such as linking additional storage
    devices to a single machine) and distributed execution (such as the load-balancing
    described earlier).'
