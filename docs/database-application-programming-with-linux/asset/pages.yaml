    names a few possibilities, not taking into account the possibility that there
    be misspellings of the name! These sorts of inconsistencies can lead to complicated
    retrieval problems in the long run. Moving the publisher name into its own table
    eliminates these kinds of problems.


    What about Publication City? You might be tempted to think that this is a function
    of who the publisher is, but that''s not necessarily the case. A publisher may
