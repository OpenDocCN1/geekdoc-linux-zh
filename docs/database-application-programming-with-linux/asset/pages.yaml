  md: '# Displaying Data in a Grid


    When you have a lot of tabular data, it can be useful to display it in a grid
    format. Although it is not the most elegant way to present data, it is familiar
    to many users, since it follows the format of spreadsheets and many printed reports.
    If you are looking for a way to explore data, particularly data that lends itself
    to hierarchical exploration, you should look at the following section, where data
    is explored in a tree format.


    Let''s look at the Tk::Columns module, which doesn''t let you edit the contents
    of the grid, but is somewhat nice for displaying a read-only grid. If you need
    to create an editable grid, you should look at Tk::Table. However, large tables
    created with Tk::Table can consume a lot of memory.


    Tk::Columns is not part of the standard Perl/Tk distribution. It is contained
    within the Tk::DKW distribution, which you can install as described in the section
    titled CPAN. If you use the CPAN utility, you can simply ask it to install Tk::Columns,
    and it will automatically figure out that it''s part of Tk-DKW.


    # Using Tk::Columns


    Tk::Columns is very easy to use, and it integrates well with the DBI. To create
    a Tk::Columns widget, use the Columns method. Before you create it, you should
    know your column headers. If these are in an array, you should pass them in a
    reference using the -columnlabels attribute:


    ```

    @columns = (''Column A'', ''Column B'', ''Column C'');

    $grid = $main->Columns(-columnlabels => \@columns);

    ```


    Once you have created the grid, add rows to it using the insert() method. The
    insert method takes a positional argument (where you want the row to be added,
    usually "end"), and a list of values for the row:


    ```

    $grid->insert(''end'', ''Value for A'', ''Value for B'', ''Value for C'');

    ```


    Before you call MainLoop, you should pack on the object:


    ```

    $grid->pack;

    ```


    Let''s look at a short program that demonstrates the use of Tk::Columns. As you
    look at the code, take note of the integration of DBI and Tk::Columns. In this
    example, we use the DBI to get two chunks of data that we use to create the TK::Columns
    object. The first is the list of column headers; these are obtained from a regular
    statement handle ($sth) by examining the NAME attribute, which is a reference
    to an array of column names that we use for the -columns attribute:


    ```

    my $cols = $sth->(NAME);

    ```'
