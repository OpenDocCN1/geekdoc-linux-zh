- img_proc: true
  md: 'As with the INSERT command above, upon execution, the UPDATE command may trigger
    pre-defined constraints, generating errors where such constraints are violated.
    Again, please read your documentation to see which constraint types will generate
    errors and, if so, how it is done.


    For more information, see the section Updating Data in the Database in Chapter
    2.


    # # ALTER TABLE (Changing the Structure of a Table)


    To add a column to a table, use the ALTER TABLE statement:


    ```

    ALTER TABLE publisher ADD phone CHAR(14);

    ```


    The ALTER TABLE statement uses the same column definitions as the CREATE TABLE
    statement (see Creating Tables) in Chapter 2).


    Under Sybase, when you add a column with ALTER TABLE, the new column must accept
    NULLs. This is because when Sybase’s ALTER TABLE statement adds the column to
    any existing rows, their values are automatically set to NULL. Under some other
    database systems, you can specify NOT NULL in ALTER TABLE statement (however,
    for this to succeed over Oracle, the table must not have any rows):


    ```

    ALTER TABLE publisher ADD phone CHAR(14) NOT NULL;

    ```


    Consult your database server’s documentation for details on the ALTER TABLE statement.


    To drop a column with ALTER TABLE, use the DROP clause:


    ```

    ALTER TABLE publisher DROP phone;

    ```


    # # DROP TABLE


    To drop a table, use the following syntax:


    ```

    DROP TABLE publisher;

    ```


    # # SQL Query Fundamentals


    Please refer to Chapter 2 for more information about basic query operations on
    a database. Here is some specific SQL syntax with a few tips to prevent errors
    in constructing your queries.'
