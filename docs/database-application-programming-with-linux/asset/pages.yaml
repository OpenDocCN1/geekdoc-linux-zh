    # Updating Data in the Database


    You can modify existing rows using the UPDATE statement. The UPDATE

    statement should be qualified with a WHERE clause, or the update is applied

    to every row in the table. The general form of the UPDATE statement is:


    ```

    UPDATE <table>

    SET <column> = <value>, <column> = <value>] ...

    WHERE <condition>

    [ AND|OR <condition> ]...

    ```


    For example, to change Brian Jepson''s first name, either of these two

    UPDATE statements would do the job (although the second is preferred,

    it it uses a primary key to locate the row, and primary keys do not change

    as long as the row exists):


    ```

    UPDATE author

    SET first_name = ''Buh-Rian''

    WHERE first_name = ''Brian''

    AND last_name = ''Jepson''


    UPDATE author

    SET first_name = ''Buh-Rian''

    WHERE author_id = 120

    ```


    # Deleting Data from the Database


    You can delete rows using the DELETE statement. The DELETE statement

    also uses a WHERE clause to specify which rows to delete. If you don''t

    include a WHERE clause, every row in the table is deleted!


    The general form of the DELETE statement is:'
  merge: -1
  pgno: 71
- img_proc: true
  md: '```

    DELETE FROM <table>

    WHERE <condition>

    [ AND|OR <condition> ]...

    ```


    For example, you could delete the book *Now Wait for Last Year* with either of
    the two commands (although the second is preferred, since it uses the primary
    key):


    ```

    DELETE FROM book

    WHERE title = ''Now Wait for Last Year''

    nDELETE FROM book

    WHERE isbn = ''0-679-74220-4''

    ```


    # WARNING


    If you do not use a WHERE clause in the UPDATE or the DELETE statements, the changes
    are applied to every row in the specified table. It''s important, we felt best
    to say it twice!


    # Indexes


    If you create indexes on your tables, the performance of some retrieval operations
    can be greatly improved. In general, it makes sense to create an index for each
    primary key and foreign key in a table, because these are the most heavily used
    columns in join operations.


    There is a special type of index, called a *unique index*, that enforces the uniqueness
    of the key. This is useful for primary keys: the very definition of primary keys
    requires that they are unique within the table. For example, there must only be
    one author with a given author id (such as 100), and no two authors may have the
    same author id.


    # NOTE


    If you declare a column as PRIMARY KEY in the CREATE TABLE statement, an index
    will be automatically created for it.


    The general form of the CREATE INDEX statement is:


    ```

    CREATE [UNIQUE] INDEX <index-name>

    ON <table> (<column>, <column>...)

    ```


    For example, to create a UNIQUE index on patron.patron_id, issue the following
    CREATE INDEX statement:'
  merge: -1
  pgno: 72
- img_proc: true
  md: '```

    CREATE UNIQUE INDEX ix_patron_id

    ON patron (patron_id)

    ```


    The composite primary key of the borrows table is a combination of patron_id,
    isbn, and borrowed date (the assumption, which might not hold true in the real
    world, while a patron may take out a book more than once, can only borrow it once
    on a given day, since there is only one book). To enforce the uniqueness of that
    primary key, you could declare the following unique index:


    ```

    CREATE UNIQUE INDEX ix_borrows

    ON borrows (patron_id, isbn, borrowed_date)

    ```


    Here is an example of a nonunique index. This index exists to improve the performance
    of joins involving the author_of.isbn column.


    ```

    CREATE INDEX ix_author_of_isbn

    ON author_of (isbn)

    ```


    # Summary


    Relational database systems give you the ability to model real-world objects and
    the relationships between them. Because the most intuitive way to design tables
    is not always the most efficient in terms of system resources, database design
    is a critical activity that must be performed before you create the tables. Avoid
    the temptation to skip the normal forms: Although an nonnormalized database system
    may perform acceptably well for small data sets, small increases in the size of
    a data set can sometimes cause huge performance hits (see the section Analyzing
    Complexity in Chapter 4, “Construction”).


    PostgreSQL, Sybase, Oracle, Mini SQL, and MySQL have many things in common, but
    outer joins, dates, and other implementation details may differ greatly. The section
    titled Modularity in Chapter 4 suggests some strategies for isolating these sorts
    of differences using modular programming techniques. Nevertheless, you should
    focus on achieving a mastery of SQL in general, but keep yourself educated about
    quirks and implementation differences.'
