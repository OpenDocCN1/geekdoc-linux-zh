  md: '# DBI and Perl


    To fetch all objects, use the storage manager''s select() method, and pass in
    the class name. This code fetches all the employees:


    ```

    @employees = $storage->select(''Employee'');

    ```


    You can then invoke a method or fetch a property for one of these objects:


    ```

    print $employees[0]->($lname, "\n";

    ```


    The storage manager''s remote()method generates a stand-in for the real object
    that you can use to select a subset of the actual objects by using a filter. First,
    create a Tangram::Remote object:


    ```

    $emp_remote = $storage->remote(''Employee'');

    ```


    Next, create a filter object. The comparison operators are overloaded in such
    a way that the statement puts a Tangram::Filter object in $filter. This filter
    will match only employees whose first name is Brian:


    ```

    $my $filter = $emp_remote->($fname) eq ''Brian'';

    ```


    Next, pass the remote object and the filter to the select() method to get the
    real objects:


    ```

    my @employees = $storage->select($emp_remote, $filter);

    ```


