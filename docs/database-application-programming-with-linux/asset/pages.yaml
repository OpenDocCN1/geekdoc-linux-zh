    # Keys


    You relate two entities together by linking a key from one entity to key on the
    other entity. There are two types of keys. The first, a primary key, is one or
    more attributes that identify one and only instance of an entity.


    For example, suppose the Patron entity has an attribute called Patron ID, and
    that the Book entity has an attribute called Book ID. In the case of the Patron,
    the ID could be a number stamped on the patron''s library card. In the case of
    the Book, it could be its ISBN number. Although these IDs are attributes, they
    are also primary keys. What matters is that a primary key identifies one and only
    instance of an entity. The primary key is sometimes said to uniquely identify
    the entity. No two instances should have the same key value. If this holds true
    for the Patron ID and Book ID, then these attributes are suitable primary keys.


    The second type of key is a foreign key. It is one or more attributes in an entity
    that points to the primary key of another entity. For example, suppose you want
    to keep track of the patrons'' favorite books. One way to do this is to add an
    attribute to the Patron entity called Favorite Book ID. This column would contain
    the ID of a patron''s favorite book, and as such, is a foreign key into the Book
    entity.


