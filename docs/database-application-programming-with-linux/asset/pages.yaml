  md: '# Make the User Interface Consistent


    Mandel''s third golden rule outlines techniques you can use to make user interfaces
    consistent. Consistency reinforces learning and allows users to transfer skills
    between applications. Mandel lists five techniques for building consistent user
    interfaces:


    Understand the context of the user''s tasks. Users should be able to move smoothly
    throughout the operation of the application. Make cues available to show where
    the user has been and where he is going. Don’t make the user switch modes gratuitously
    or switch between keyboard and mouse needlessly.


    Maintain consistency within and across products. Attach established means to common
    elements. An OK button, for example, should approve an action and close a dialog,
    and a Cancel button should cancel pending changes and close the dialog. Text you
    can edit (such as a text field) is usually shown in a box with a different background
    than the enclosing screen. Text you can’t edit (such as the label for a text field)
    is usually shown with the same background as the enclosing screen. Follow consistent
    conventions within your own application and follow the standards that other programs
    adhere to.


    Keep interaction results the same. This technique can be thought of as a supplement
    to maintaining consistency. Make sure that the results of common actions are the
    same throughout your application. If the user presses Ctrl+P in one part of the
    application, make sure it does the same thing (or nothing at all) in another part
    of the application. Users get surprised when the same action yields different
    results.


    Provide aesthetic appeal and integrity. Use consistent design techniques throughout
    your application. Use a consistent set of fonts, colors, and layouts to build
    your application. Don’t choose design elements that are inconsistent with others.


    Encourage exploration. Develop engaging user interfaces that encourage users to
    explore. This exploration is how novice users become experts. To encourage exploration,
    make sure the interface is friendly, enticing, and that it includes features,
    such as wizards, that guide the user through otherwise intimidating tasks.


