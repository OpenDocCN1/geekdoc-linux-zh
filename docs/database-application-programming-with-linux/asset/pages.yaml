    /*

    * Get a value from the currently selected row.

    */

    char* get_selected_value(GtkWidget* combo, gint column_index) {


    GdaRecord* grs; /* The underlying record set */

    Gda_Field* field; /* The field whose value we need */

    char buffer[64]; /* A buffer to hold the return value */


    /* Reposition the record set on the selected row */

