  md: 'We recommend that you deploy the schema into an empty database. This avoids
    collisions with other database objects and minimizes overall clutter. Before you
    run it, make sure you change the dsn, $user, and $pass variables accordingly.
    To run this example, type perl deploy.pl at the shell.


    # Creating Objects


    You can create a new object and make it immediately persistent with Tangram. To
    accomplish this, follow these steps:


    +   1. Create a Tangram Storage Manager. To create it, invoke Tangram::Storage::connect
    method. You don''t need to create a database handle, since Tangram does this for
    you. Pass the schema object, connection string, user name, and password, as shown
    here (that $dsn, $user, and $pass as appropriate for your system):


    ```

    my $dsn = "dbi:mysql:database=contacts"

    my $user = "bjepson"

    my $pass = "open_sesame"

    my $storage = Tangram::Storage->connect($schema, $dsn, $user, $pass);

    ```


    +   2. Create an Instance of the Object. Next, create an instance of the real
    object. This is the class you defined in Perl, and (so far) independent of Tangram:


    ```

    $company = new Company()

    $company->(name) = "A Sample Company";

    ```


    +   3. Pass the Object to the Storage Manager''s insert() Method. The insert()
    method takes any kind of object as an argument. However, it looks for objects
    that are instances of classes that have the same name as the classes defined in
    the schema object. The insert() method uses the information in the schema to figure
    out which attributes of the object to store in the database. It looks simple,
    but Tangram is really doing a lot of work for you:


    ```

    $storage->insert($company);

    ```


    # Finding Objects


    When it comes to find objects, Tangram is very helpful. You can either retrieve
    the objects (be warned, this can be memory intensive if you have a lot of objects),
    or retrieve a lightweight proxy object that stands in the real objects until you
    retrieve them from the database.'
