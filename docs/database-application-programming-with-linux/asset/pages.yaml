    # Summary of Developing the MICO Example


    In this example, we developed a CORBA client and server. The client found the
    server by using its IOR, and invoked some of its methods. Here is a summary of
    the steps we took:


    +   1. Write the interface definition.

    2. Generate stubs and skeletons with the idl utility.

    3. Develop and compile the implementation.

    4. Develop and compile the server.

    5. Develop and compile the client.

    6. Execute the server and client.


    Here is a Makefile that automate the compilation:


    ```

