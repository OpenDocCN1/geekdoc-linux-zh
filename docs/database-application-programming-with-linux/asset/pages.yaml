  md: '# Using a Prototype to Validate Requirements


    Once you have established the formal requirements, you need to validate them.
    One of the best methods for validating requirements is to build a prototype. This
    prototype should not be confused with a prototype of the user interface, which
    is discussed in detail in Chapter 3.


    As difficult as it may be to let something go, in most cases, you should throw
    away (archive) your prototype and implement the system from scratch. You don''t
    have to throw away everything. If you have followed a modular approach in building
    the prototype, you can reuse some of the modules/or objects you built while you
    developed the prototype. Take care when invoking this privilege, however. If you
    know that you might need to reuse a module, build it as though you were building
    it for a production system, not it may slow things down in the short term, but
    in the long run, you will save time.


    Somerville warns against building a general-purpose prototype. A prototype should
    have one purpose, such as one of the following: prototyping the user interface,
    validating requirements, or demonstrating the feasibility of the project. If you
    are (and you should be) using the prototype to verify the requirements, make sure
    this is the only thing you use the prototype for. A prototype that is put together
    to validate the requirements may not make the best user interface prototype.


    What to build with the prototype? Fortunately, Linux users have at their disposal
    many wonderful tools for developing prototypes. Any of the most popular scripting
    languages, such as Perl, Python, or Tcl, support a variety of user interfaces.
    These scripting languages can be used to quickly develop a prototype complete
    with a user interface and database connectivity (and any of these languages is
    fine for building the final product, as well).


    How much design? How much design needs to go into the prototype? To large extent,
    use this book to familiarize yourself with the techniques for building an application.
    Then, as you are building a prototype, you can select the techniques that you
    feel are appropriate for the level of detail your prototype will capture. Many
    prototypes focus on areas of uncertainty in the requirements: If the area of uncertainty
    is something that greatly affects the database design, you may want to put more
    effort into the prototype''s database design.


    # The Volatility of Requirements


    There is no such as a stable set of requirements. All you can hope for is a snapshot
    in time of what the stakeholders need. Time goes on,'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'requirements will change. In fact, it is likely that they will change as you
    design and develop the system. With this in mind, you need a firm change control
    procedure in place. The stakeholders must understand that a change in the requirements
    can have one of two outcomes.


    +   - The change will be incorporated in the system you are writing, in which
    case it will involve additional expense as you adjust the schedule.


    +   - The change can be incorporated in a future release of the system.


    One key to successfully building a system is successfully managing changes in
    the requirements. McConnell suggests some strategies for managing changes that
    can help you as you develop the software (however, see Chapter 6''s section titled
    The Cathedral and the Bazaar, which refers to and is titled after Eric S. Raymond''s
    essay of the same name, for a different perspective on this problem):


    Create a formal procedure for requesting changes. This will help you manage the
    inevitable flood of requests and keep them from over-helming you.


    Establish a change-control board. The change-control board is a committee or group
    that is responsible for deciding what changes are allowed to be made.


    Deal with changes in batches. All of us have given in the urge to implement a
    change that seems easy to implement. If you implement every change way, some good
    changes might fall through the cracks if you occur too late in development. Dealing
    with them in batches also gives small changes greater visibility in the overall
    schedule.


    Estimate the cost of every change. Because of the inherent complexity in software
    development, even the simplest change can have large effects on other parts of
    the system. Before you agree to a change, make sure you know what it will cost.


    Major change requests indicate something is wrong. If you''re getting major change
    requests during development, you should strongly consider applying the brakes
    on the development process and going back to the requirements stage. Perhaps you
    had been prototyping to validate the requirements without knowing it!


    # The System Architecture


    Before you can proceed to a detailed design of the system, you need to sort out
    the system''s architecture. The architecture is a high-level model of the system
    that clearly depicts its subsystems and the connections among them.'
  merge: -1
