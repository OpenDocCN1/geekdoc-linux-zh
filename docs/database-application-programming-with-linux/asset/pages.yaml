    # After You Install


    Before you use your newly installed version of Sybase, you must log on as the
    user sybase. This user is created when you install the Sybase rpms. The root user
    will need to give this user a password before you can log directly on this account.


    The first time (and only the first time) you log on to this account, your login
    scripts attempt to run the program svrbuild, which configures the Sybase installation.
    If this script fails, you may need to start it by logging on as the sybase user
    and running svrbuild from the shell prompt. However, since installation procedures
    with any product are subject to change, consult the Sybase documentation for specific
    details.


    As of this writing, svrbuild requires the X Windows System, so the sybase user''s
    login scripts fail to start it on machines that do not log directly on to X. To
    get around this, log on as the sybase user, start the X Windows system, then run
    svrbuild. See the Sybase documentation for instructions on using the svrbuild
    utility.


    **Startup and shutdown.** The Sybase installation creates the /etc/rc.d/init.d/sybase
    script that you can use as directed in Automatic Startup and Shutdown, later in
    this chapter.


    **Setting up your environment.** Sybase generally installs itself in /opt/sybaseir,
    where sybaseir is the release name of the version of Sybase you are running. This
    is the same as the sybase user''s home directory, and you can use ~sybase as a
    shortcut for this directory.


    To use Sybase, you should add ~sybase/bin to your PATH, and create the SYBASE
    environment variable. You should also set the DSQUERY variable to the name of
    the Sybase server you created when you installed Sybase (you can find the name
