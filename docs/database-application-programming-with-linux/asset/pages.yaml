  md: '# CHAPTER 10


    # Linux Development Tools Catalog


    Before you start hacking on your own database applications, you should find tools
    that might save you time. In this chapter, we''ll look at a selection of tools
    that can help you develop database applications and manage your database server.


    # Database Tools


    It can be tricky getting the database end to cooperate with a front-end you are
    trying to write. The following are examples of when you might want to have a closer
    relationship with the data server:


    +   - Debugging an SQL statement

    - Optimizing the performance of an SQL statement

    - Examining the impact of various indexing alternatives

    - Examining the database for data quality problems (invalid values and relational
    integrity violations)

    - Routine database administration


    In situations such as these, you might turn to your trusty SQL monitor program
    (the section titled SQL Monitors in Chapter 9, “Databases”), if you didn''t know
    of the alternatives. However, there are many database administration tools that
    make dealing with the database a lot easier than would be possible with a command-line
    client.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Multi-RDBMS


    Many of the database administration tools support more than one RDBMS. Although
    each of these tools favors the features of one particular RDBMS, they all represent
    progress toward centralized administration tools for multiple database systems.


    # Katabase


    Katabase is the desktop database component of Koffice, KDE''s office suite. At
    the time of this writing, Katabase was still in the planning stages. Although
    Katabase is planned to be similar to tools such as Access or Paradox, the designers
    want to support it as many databases and data formats as possible. It seems that
    in some ways, it be similar to GNOME-DB (see Chapter 13, "GNOME"). You can find
    out more about it at http://koffice.kde/org/katabase/


    # KSQL


    KSQL (formerly MySQL) is an open source graphical database client for various
    SQL databases. In its original incarnation, it only supported MySQL. More recent
    releases are based on a plug-in architecture (the database connection is handled
    by a plug-in for a specific database server), which makes it easy for KSQL to
    support other database systems. As of this writing, KSQL supports plug-ins for
    MySQL, Mini SQL, Sybase, and PostgreSQL. However, many of the features described
    next are only available for MySQL. Over time, they may be available for the other
    supported databases.


    **Installation.** KSQL is available in source and binary (RPM) form at http://ksql.sourceforge.net/.
    You can also obtain plug-ins and documentation at this site.


    **Connecting to a database server.** To start KSQL


