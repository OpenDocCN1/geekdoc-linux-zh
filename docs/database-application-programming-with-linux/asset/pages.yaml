  md: '# Object-Oriented Programming


    Object-oriented programming is a paradigm that was developed to facilitate the
    design and development of large and complex projects, to encourage software reuse,
    and to decrease software maintenance time. The introduction of object-oriented
    programming is the most significant change in computer science since the introduction
    of subroutines, and has similar revolutionary and evolutionary characteristics.
    If you are used to procedural programming, transitioning to object-oriented programming
    will require a conceptual, rather than tactical, shift. The algorithms that you
    use to compute a result will remain the same, but way in which you organize and
    link those algorithms will change. So, while the bad news is that you will have
    to adjust to a new way of thinking about programs, the good news is that good
    procedural design practices (and programming techniques) will be better supported
    and easier to implement under this new paradigm.


    Since the goal of object-oriented programming is to support the development of
    large and complicated programs, and to reduce the maintenance cost of all programs,
    we can find much direct support in the syntax of object-oriented languages for
    good design practices. Here we examine the built-in constructs that the object-oriented
    languages provide to support the design process. In Chapter 8, “Object-Oriented
    Design,” we look at some ways to design object-oriented applications.'
  merge: -1
