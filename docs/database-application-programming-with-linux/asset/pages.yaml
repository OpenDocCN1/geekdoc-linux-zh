    Timestamp. A timestamp value that combines date and time. Systems that support
    this, timestamp columns are automatically updated whenever a row is changed. This
    is usually used to check the last time a row was modified, rather than for storing
    time and date values. Databases combine date and time into a single type (see
    Date) don''t need a timestamp data type. You should consult your database server
    documentation for more information.


    Date formats can be a tricky thing. Many database systems are somewhat flexible
    in the date formats they support, but not all systems agree on the same format.
    Table 9.8 shows some of the common date formats that are supported by each database
