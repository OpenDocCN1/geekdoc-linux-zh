    # Running the Example


    After following these steps you have two executables: Server and Client. The server
    creates an instance of an employee named Brian, and lets clients connect. The
    client program connects, raises the employee''s salary by $25,000, and then finds
    out the employee''s name and current salary.


    # NOTE


    All of the steps we just went are handled by the Makefile—if you want to, you
    can just type *make* in the example directory to compile the example.


    For this IOR, you must first run Server. This starts the server and deploys its
    IOR (the /. make sure you are running the executable name in the current directory,
    and not some other programmed Server):


