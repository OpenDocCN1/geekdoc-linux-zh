    | Sybase | DBD::Sybase |

    | Oracle | DBD::Oracle |

    | PostgreSQL | DBD::Pg |

    | Mini SQL | DBD::mSQL |

    | MySQL | DBD::mysql |

    | Legacy XBase (*.DBF) files | DBD::XBase |

    | DBI-ODBC Bridge | DBD::ODBC |

    | Informix | DBD::Informix |

