  md: '# Class Diagrams


    The next step, class diagrams, will take you very close to the code. To develop
    class diagrams, you should reflect upon the conceptual model and collaboration
    diagrams. The class diagram will look somewhat like a subset of the conceptual
    model, but it will have more details and any extra classes you defined when you
    wrote the collaboration diagrams.


    To develop class diagrams, we''ll use a technique based on the one found in Larman:


    **Identify all classes.** Examine the collaboration diagrams, and find all the
    classes. For economy, we will show the byName and byCard collections as attributes,
    since they are explicitly used in the collaboration diagrams (we''ll also add
    byISBN collection to support searching for books by ISBN). Library has a relationship
    with Patron, and showing a relationship between Library and a Patron collection
    would be redundant.


    **Diagram the attributes.** For each class you found in the previous step, look
    up its attributes in the conceptual model. Start a diagram of classes with these
    attributes. As you can see in Figure 8.13, these classes have an extra box at
    the bottom to hold methods.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_211_0.png)


    **Figure 8.13** Borrow Books class diagram with classes, attributes, and methods.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'As with the conceptual model, don''t worry about foreign keys. For example,
    you don''t need a Patron and Book attribute on Loan, because we will capture this
    relationships between Loan and the other classes.


    **Diagram the methods.** Look at all the messages that are sent to each class
    in the collaboration diagrams. For each message sent to the class, add a method,
    its parameters, and its return type to the class diagram. Methods appear in the
    lower box, as shown in Figure 8.13. Unless you have constructors that take arguments,
    don''t show constructors. Unless they are specifically referenced in the collaboration
    diagrams, don''t show accessor (get and set) methods for of class implies a constructor,
    and every attribute implies accessor methods. If you included get and set methods
    for every attribute, the more important methods might be lost in the clutter.
    For example, Patron and setBook set the implied Book and Patron attribute of Loan.
    We''ll include them in the diagram because they increase clarity.


    **Diagram the associations.** Examine the collaboration diagrams (not the conceptual
    model)


    +   - One class sends a message to another


    +   - One class is passed to another as a parameter


    +   - One class creates another


    **One further clarification.** Only choose things that need to be maintained over
    time. This excludes things that would only be represented as temporary variables
    (such as the patron and book that LoanHandler creates before passing them to the
    Loan). Table 8.2 lists the associations we found.


    Figure 8.14 shows the diagram with attributes, methods, and associations.


    Table 8.2 Associations in the Borrow Books Class Diagram

    | ASSOCIATION | RATIONALE |

    | --- | --- |

    | LoanHandler looks-in Library | The LoanHandler needs to have access to the Library
    across multiple messages (the Library is used in both identifyPatron and loanBook).
    |

    | Library contains Book contains Patron | These are required because the Library
    is used as an expert in two places (identifyPatron [Figure 8.9] steps 1a and 1b
    loanBook step 1). |

    | Loan captures-loan-of Patron is a borrower with respect to a Loan | In order
    to complete a loan, the book and patron must be associated with the Loan object
    (loanBook steps 3 and 4). |'
