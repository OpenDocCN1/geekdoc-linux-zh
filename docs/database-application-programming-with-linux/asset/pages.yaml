    of applications that they can produce, generally have configuration management
    issues, and 4GL tools and components usually have to be purchased from software
    vendors. Scripting languages don''t have these limitations: The most popular and
    successful scripting languages are open source, work well with configuration management
    tools, and are highly extensible.


    # The Magic Cauldron


    In "The Cathedral and the Bazaar," Eric Raymond describes how to run a successful
    3GL project (fetchmail, which is at www.tuxedo.org/~esr/fetchmail) as a community
    software initiative. And by large, the great success stories (such as Perl, Apache,
    Linux) of the Open Source movement have been 3GL projects. In his "The Magic Cauldron,"
    Eric Raymond discusses how the open source revolution will affect the economics
    of software development. He starts by describing the qualities a program must
    have to be a candidate for open source development.


    For purposes of examining this question, it will be helpful to sort kinds of degrees
    by the service they offer by open technical standards, which is well correlated
    with how commoditized the underlying service has become.... As middleware services
    become commoditized, they will in turn tend to fall into the open-source infrastructure—a
    transition we''re seeing in operating systems now. [tMC]


    What is interesting for our argument is that the criteria Eric describes for a
    project to be open source are very similar to the criteria for a project to be
    executed with a scripting language. Open source software requires that the application
    be a commodity service with open technical standards. Scripting language applications
    exist as a collection of commoditized components that communicate through open,
    standards-based interfaces. He goes on to say:


    Finally, we may note that purveyors of unique or highly differentiated services
    have more incentive to fear copying of their methods by competitors than do vendors
    of services for which the critical algorithms and knowledge bases are well understood.
    Accordingly, open source is more likely to dominate when... key methods (or functional
    equivalents) are part of common engineering knowledge.[tMC]'
