  md: "my $self = {}; # create a hash reference\nbless ($self, $class); # bless the\
    \ hash reference into the class\nreturn $self; # return the hash reference\n\n\
    Notice that we use the my operator to ensure that the $self and $class variables\
    \ are scoped within the enclosing block. This ensures that each time you invoke\
    \ the constructor, you don't accidentally touch an old instance of the object—as\
    \ soon as the return statement executes, Perl forgets that $self refers to an\
    \ object. The only way to get it back is to call one of the object's methods.\
    \ Create a method the you would any other subroutine, but make sure that you grab\
    \ the first argument and put it into a variable called $self. Even if you don't\
    \ pass any other argument to the method, Perl makes sure that there is at least\
    \ one argument (the object itself):\n\n```\nsub print_name {\n    my $self = shift;\n\
    \    my $name = $self->(name);\n    print \"My name: $name\\n\";n}\n```\n\nCreate\
