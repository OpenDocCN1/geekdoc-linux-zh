  md: '# Object-Oriented Analysis


    Don''t worry about catching all the attributes right now. We may pick up along
    the way, especially as we move to the design phase.


    # Attributes versus Foreign Keys


    Larman specifically suggests that we avoid creating attributes for foreign keys,
    something that you might consider doing based on the information with Chapter
    2. Larman warns us that if we include attributes that are foreign keys, we are
    making a presupposition as to how the relationship will be implemented. It''s
    enough that the associations catch the relationships. For example, the Loan doesn''t
    need an attribute to refer to the book or patron.


    Figure 7.5 shows the conceptual model with concepts, associations, and attributes.


    Keep in mind that choosing attributes and their types does not say about how the
    classes will be implemented. We are still studying the problem domain here, and
    the attributes are just part of the conceptual model, and have no direct bearing
    on the implementation. Consider the Librarian for example: a concept without attributes
    or major responsibilities. It''s possible that the Librarian will eventually drop
    out of the model when you move into design or implementation, or perhaps it will
    be merged with another concept, such as Library. Nothing is set in stone at this
    stage.


    # Conceptual Model Summary


    Here are the steps we take to build the conceptual model:


    +   1. *Identify concepts.* What are the key concepts (ideas or things) in the
    problem domain?

    2. *Draw the model.* The first draft of the diagram shows the concepts in isolation
    from each other: no associations or attributes. It is the first step in visualizing
    the problem domain.

    3. *Discover and draw associations.* Find out how concepts are related and diagram
    this information.

    4. *Add attributes.* Find out what data belongs to each concept and add this information
    to the diagram.'
