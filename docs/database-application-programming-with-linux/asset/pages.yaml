  md: 'work in hand with the run-time binding facilities of interfaces. Actually,
    there is much overlap in these things—many component object models include some
    distributed features (GNOME’s Bonobo, for example, is based on CORBA, a distributed
    component architecture that is discussed in Chapter 15, “Introduction to CORBA”).


    Object models enable the development of large and complex systems and reduce the
    programming costs associated with such systems. The larger the project you are
    working on, the more likely it is that someone else has developed some portion
    of the system. Taking advantage of these existing programs immediately reduces
    the programming effort involved in developing your system, and having these programs
    be supported by your original author reduces the ongoing maintenance costs of
    your system.


    To return to our Book example, there are thousands of libraries in the United
    States, all of which have to check out and return books. Chances there is already
    a perfectly adequate Book object out there. In fact there may be hundreds. Let’s
    suppose that each publisher, when they ship a book to the library, also ships
    their version of a Book object. When you write your check-out program, you have
    no way of knowing which publisher’s book is being checked out Using a component
    object model, the check-out system could query the Book that is being checked
    out, asking it what check-out methods it supports, and then call the appropriate
    check-out method of the Book. Suppose you wanted to enhance your check-out program
    to include inter-library loans. Using a distributed object model, the check-out
    program could ask another library in the system to send a copy of the interface
    that the remote Book object supports, and then call the appropriate check-out
    method on that interface.


    # Abstract Classes


    Abstract classes are a way of specifying interfaces without supplying the implementation.
    The previous example assumes that every Book object has an appropriate check-out
    method. Being able to dynamically query an interface is all fine and good, but
    if the interface doesn’t contain the method you need, you are out of luck. Abstract
    classes address this situation, guaranteeing types of objects support particular
    methods.


    Let’s look at how abstract classes enable the development of complex systems.
    In any large development project (in fact, whenever there is more than one developer
    working on the project), a number of tasks will have to be completed concurrently.
    If it takes two months to develop the check-out system, and two months to develop
    the book object, and you have three months to deliver the entire system, you can’t
    have the check-out developer sitting around until the book developer has completed
    his work. The solution is that you spend one month designing the Abstract class
    of Book. It doesn’t take the full months'
