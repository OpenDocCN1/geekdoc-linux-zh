  md: '# Message Passing Facilities


    Me, the three greatest triumphs of programming are C, Unix-like operating systems,
    and TCP/IP. I say that not only because they are wonderful, capable programs,
    but because these three programs provide the foundation for almost every other
    program in existence. GNU C makes it possible to control a single process and
    address space. Unix (operating systems in general, if you want to be charitable)
    makes it possible to control multiple processes and devices. TCP/IP makes it possible
    to control multiple machines. With these three programs, programmers have almost
    unlimited possibilities for developing software.


    Modern compilers are wonderful things, and if you know what I am talking about.
    If you have never programmed in assembler, please don''t put this book down and
    start trying now. I am not a sadist, and the proper explanation should be quite
    enough to disabuse you of that notion.


    Let''s take two, very straightforward lines of code from the Book example (see
    Chapter 5, "Object-Oriented Programming"), and then talk about what they look
    like in assembler.


    Here is the code in C++:


    ```

    Book bk = new Book();

    int x = bk.setCheckedOutDate("01-01-2000");

    ```


    Through compiler magic, we don''t have to do all the messy stuff that happens
    in assembler, as such:


    +   - Repeating the definition of the Book object

    - Allocating contiguous register addresses to hold this instance of the Book object

    - Remembering which addresses we allocated or checking that these registers still
    have the data we placed in them

    - Figuring out the offset of the setCheckOutDate code segment

    - Storing the current state of the executing program segment on the stack while
    we move into the subroutine

    - Allocating memory for the parameter data or the return data

    - Assigning the register value of the parameter address into the subroutine

    - Assigning the register of the result address into the executing program'
