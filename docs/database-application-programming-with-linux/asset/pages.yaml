  md: '# From Design to Code


    Once you have completed a design for your system, and taken the database and user
    interface into account, you should map your design to code. This is a straightforward
    translation from your design artifacts. Let''s walk through the implementation
    of the Loan class:


    +   1. Define classes with the methods and attributes shown in the class diagrams.
    Include accessor methods (get and set methods) for all attributes.

    2. Add attributes to support visibility inherent in the model. If the multiplicity
    of an association is greater than one, you need to use a collection class. Add
    any accessor methods that are needed. For example, Patron and Book are visible
    to Loan, there are two attributes of the Loan class: a Patron called patron, and
    a Book called book.

    3. Add the constructor. Write the constructor for the class. If you need to create
    any instances of attributes added in Step 1 or 2 (such as the Library or BorrowingPolicy),
    do so within the body of the constructor.

    4. Use the collaboration diagrams to write the body of the method. Start with
    message 1 and follow it to 1.1, 1.1.1, etc. Then move to message 2, and so forth.

    5. Inspect the contracts (see Chapter 7, "Object-Oriented Analysis") to decide
    what error and exception handling is needed. You may find that the classes do
    not support the functionality needed to implement all the exceptions. See the
