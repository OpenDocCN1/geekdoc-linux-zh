  md: "# Processing Result Sets\n\nThe DBI is very flexible when it comes to getting\
    \ data out of the database. To issue a query and process its results, you should\
    \ take the following steps:\n\n+   1. Use prepare() to create a statement handle,\
    \ and execute() to execute the statement.\n2. Fetch each row in the result set.\n\
    3. Invoke the finish() method.\n\n# Prepare and Execute\n\nUse the prepare() method\
    \ to get a statement handle, and then use the execute method to execute the statement:\n\
    \n```\n$sth = $dbh->prepare(\"SELECT * FROM contact\")nor die $DBI::errstr;\n\n\
    $sth->execute()\nor die $DBI::errstr;\n```\n\n# Fetch the Rows\n\nNext, you can\
    \ get the result set using one of the following statement handle methods:\n\n\
    fetch_array(). Fetches the next row as an array of values:\n\n```\nwhile ( @values\
    \ = $sth->fetch_array() {\n    my ($first, $last, $company) = @values;\n    print\
    \ \"\\$first last works for \\$company.\\n\";\n}\n```\n\nfetch_arrayref(). This\
    \ fetches the next row as a single reference value to an array. The DBI documentation\
    \ says that this is the fastest way to fetch data:\n\n```\nwhile ( @array_ref\
    \ = $sth->fetch_arrayref() {\n    my ($first, $last, $company) = @array_ref;\n\
    \    print \"\\$first last works for \\$company.\\n\";\n}\n```\n\nfetch_hashref().\
    \ This fetches the next row as a hash of values using the column names as a key.\
    \ While this is very convenient, it does not perform as well as the alternatives:"
