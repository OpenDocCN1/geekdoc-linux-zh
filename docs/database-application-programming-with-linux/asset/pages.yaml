  md: "# SQL Reference\n\nFirst things first. Here are the definitions of tables we'll\
    \ look at in this section:\n\n```\nCREATE TABLE publisher\n  name CHAR(32),\n\
    \  code CHAR(32));\n\nCREATE TABLE book\n  title CHAR(50) NOT NULL,\n  isbn CHAR(25),\n\
    \  publisher_code CHAR(25);\n\nCREATE TABLE banned_book (isbn CHAR(25));\n\nCREATE\
    \ TABLE borrowed_book (isbn CHAR(25), borrowed_date DATE);\n```\n\nThe following\
    \ command shows a basic SELECT statement. The SELECT statement allows you to extract\
    \ (or “project”) any subset of specific rows and columns from your database, based\
    \ on logical conditions applied to the source tables. The process of combining\
    \ multiple tables within a single statement is known as a “join.” Joins are discussed\
    \ in Chapter 2, in the section called joins.\n\n```\nSELECT title, name\nFROM\
    \ publisher, book\nWHERE publisher_code = code;\n```\n\nHere we are joining two\
    \ tables from book's foreign key publisher_code to publisher's primary key code,\
    \ and projecting only the title and name of the publisher. We joined only two\
    \ tables here, it is common and necessary to join many tables at a time as you\
    \ remember to provide the correct join conditions for all tables involved (often,\
    \ where there are n tables, there are n - 1 joins).\n\nCommon errors that occur\
    \ with simple queries include:\n\nForgotten to provide the join condition (such\
    \ as WHERE publisher_code = code). This error will result in a table containing\
    \ all possible combinations (also known as the Cartesian product) of book titles\
    \ and first authors with the publisher's address. This can get pretty big if you\
    \ have a lot of rows in each table.\n\nForgotten to specify the table with which\
    \ a column is associated. You are not required to specify that name comes from\
    \ the publisher table. However, if more than one table being joined has a column\
    \ named name, you would be required to specify the table (as in publisher.name)."
