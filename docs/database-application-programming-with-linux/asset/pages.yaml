- img_proc: true
  md: '# CHAPTER 12


    hierarchical arrangement of components in Java''s Swing. This model is applicable
    to Tk, as well.


    To create a basic Tk application, you need to do the following:


    +   1. Use (import) the Tk module:


    ```

    use Tk;

    ```


    +   2. Create a main window. Use the -title attribute to specify a window title:


    ```

    my $main = MainWindow->new(-title => ''Tk Demo'');

    ```


    +   3. Add one frame to the window. Use the frame to hold components. To create
    a frame, invoke the main window''s Frame() method. Then you must invoke the pack()
    method to make sure the frame is packed into the window correctly:


    ```

    my $top = $main->Frame();

    $top->pack();

    ```


    You can specify where you want pack() to anchor the frame by including the -side
    attribute:


    ```

    $top->pack(-side=>''top'');

    ```


    The next chunk of code creates two frames—the first is anchored to the top of
    the window. The second frame is anchored to the right of the window, and appears
    before the first frame:


    ```

    my $top = $main->Frame();

    my $bottom = $main->Frame();

    $top->pack(-side=>''top'');

    $bottom->pack(-side=>''right'');

    ```


    +   4. Add components to the frames. It''s very easy to add a component to anything
    in Perl/Tk. Just as we added a frame to a window by calling the window''s Frame()
    method, you can add a text label to a frame by calling the frame''s Label() method:


    ```

    my $label = $top->Label(-text => ''Name:'');

    $label->pack(-side=>''left'');

    ```


    If you don''t plan to refer to an object that you create, you can invoke the pack()
    method to create the object (although this can rapidly become unreadable with
    complicated forms). We''ll call this an anonymous component (as compared to a
    named component, as shown in the preceding code:'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# DBI and Perl


    $top->Label(-text => ''Name:'')pack(-side=>''left'');


    You can associate commands with certain components, such as a button. To create
    a command, set the command attribute when you create the object. This destroys
    the main window when the Cancel button is pressed, thereby terminating the application:


    ```

    my $btn = $bottom->Button(-text => ''Cancel'',

    -command => [$main => ''destroy'']);

    $btn->pack(-side=>''left'');

    ```


    You can also create commands that call subroutines. Notice here that we also refer
    to a named instance of an entry field. The say_hello() subroutine can call $entry->get()
    to get the current value:


    ```

    $bottom->Button(-text => ''OK'',

    -command => sub { say_hello($entry) }

    )->pack(-side=>''left'');

    ```


    +   When you have added all the components, Put Tk into its main loop. At this
    point, you give control up to Tk until the main window is destroyed. Here is the
    command to start the main loop:


    MainLoop;


    # Component Constructors


    When you create an object, as $top->Label, you are in effect calling the constructor
    for an object called Tk::OBJECT_TYPE, in Tk::Label. Since you call it through
    another object, such as the frame called $top, you are also associating it with
    that object.


    # Component Attributes


    The attributes that are passed to the constructor (such as -text, -command, etc.)
    are a special kind of list notation. The => is a synonym for a comma. So, “text=>''Cancel''”
    is equivalent to ''-text'', the former makes it clear that the two values are
    associated with each other. This notation is often used to assign values to hashes
    as well. See the Tk::options page (perdoc Tk::options) for a list of standard
    attributes you can use with some widgets. The widget''s man page for a list of
    options the widget supports.'
