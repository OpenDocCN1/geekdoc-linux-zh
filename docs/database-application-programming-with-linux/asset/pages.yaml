  md: '# Object-Oriented Design


    In the previous chapter, we analyzed the formal requirements for a library system,
    and produced some artifacts (use cases, conceptual model, system sequence diagrams,
    and contracts) that will help us design the system. In this chapter, we''ll create
    an object-oriented design and look at the issues involved with turning it into
    an application. As with the previous chapter, the process followed in this chapter
    is closely patterned after Craig Larman''s Applying UML and Patterns (Prentice
    Hall, 1998), but is highly condensed, and does not delve into the issues deeply.


    This design addresses application logic (the domain tier), storing data in a database
    (the persistence tier), and the user interface (presentation tier). The domain
    tier is the central focus of the object-oriented design, and is in the driver''s
    seat. The design of the other two tiers will be based on the analysis and design
    that went into the domain tier.


    # Three-Tier Architecture


    A traditional client-server architecture is usually thought of as a two-tier application:
    The front-end is the user interface, while the back-end is the database.


    While this approach had its moment in the sun, it caused more problems than it
    solved. In a client-server system, the front-end often became responsible for'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'a lot of processing, the back-end. The result of this was that domain logic
    was spread offload to the database and user interface.


    In a three-tier architecture, the presentation tier (or user interface) relies
    on another layer (the domain tier) to make decisions about information, perform
    processing, and worry where data goes after you click OK. The domain tier, in
    turn, uses the persistence tier, which is often a database system, to permanently
    store objects. Figure 8.1 shows this architecture graphically.


    You will often hear about three-tier systems as systems with distinct processes
    for each layer. In Web applications, the presentation layer is usually a Web browser
    with some HTML forms, the domain layer is an application server, and the persistence
    layer is a relational database. This is an example of a three-tier system with
    physically separate tiers. While this is a common three-tier implementation model,
    it is not the only one. In this chapter, we''re going to focus on the logical
    separation of tiers, rather than the physical separation.


    Two benefits you can derive from a three-tier architecture are reuse and scalability.
    When you separate your application into logical tiers, you end up with a more
    modular design, which is a foundation of reusability. If you build applications
    in an environment that supports distributed objects, you can easily distribute
    components across multiple processes on the same machine, or even across different
    machines, providing you with many alternatives for scaling your application. CORBA,
    which works very well on Linux, can be used as the foundation of a distributed
    architecture. We''ll discuss CORBA in Chapter 15, "Introduction to CORBA."


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_193_0.png)


    Figure 8.1 A three-tier architecture.'
  merge: -1
