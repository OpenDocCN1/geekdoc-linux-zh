  md: '# Introduction


    even the chapters about analysis and design are peppered lightly with some concrete
    examples, and we think you''ll find it useful. We won''t mind if you skip ahead
    to the implementation-oriented stuff, which begins in Chapter 9. We''re hoping
    that if you do that, you''ll eventually come back to the earlier stuff.


    ML and Patterns. Perhaps these are two buzzwords you''ve heard a lot, or perhaps
    these are with which you are familiar. For those who don''t know, UML and Patterns
    are modeling aids that are used by programmers and designers to better communicate
    with others. UML is a notation that denotes a number of things, including the
    mental model you have of a system that you''re going to build, the classes that
    make up a system, and how these classes are related. Patterns are a way of expressing
    solutions to problems in a context. When you are looking at a problem that needs
    to be solved, you can apply one or more Patterns to reach a solution. This makes
    it easy for you to find a solution, gives you confidence that you are doing something
    tried and true, and makes it easier for other people to understand your design.
    Chapter 7, "Object-Oriented Analysis," and Chapter 8, "Object-Oriented Design,"
    talk about how you can apply UML and Patterns to analyze and design your project.


    SQL. Chapter 2, "Database Design," specifically addresses SQL, the programming
    language used by all database servers we discuss in this book. Before we dive
    into the SQL, though, we take a good look at how to design a database in the context
    of a problem needs to be solved. We look at a particular set of requirements,
    plan a database for a system, and refine it until well enough to work with an
    SQL database system. Then, we show you how to create the tables that make up the
    data-base, and how to work with them in SQL. Appendix A, "SQL Reference," will
    help you find your way around the language. Chapter 9 treats many database issues,
    including several special topics in SQL.


    Programming languages. Chapters 11, 12, and 13 cover Java, Perl, and C, respectively.
    In all three chapters, we look at how you develop graphical applications in these
    languages that talk to an SQL database back-end. Chapter 13 looks at C programming
    in the context of GNOME, an exciting desktop application framework for Linux and
    other operating systems.


    # Who Can Use This Book


    Before we wrote this book, we decided to keep one user in particular in mind:
    someone who has been using the Linux system for a little while, and who may have
    learned a bit of programming. This is not to say that'
