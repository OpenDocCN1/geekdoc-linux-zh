  md: '# Table 11.4 Some JDBC URLs


    | DATABASE | JDBC URL |

    | --- | --- |

    | PostgreSQL | jdbc:postgresql:DATABASE

    jdbc:postgresql://HOST/DATABASE

    jdbc:postgresql://HOST:PORT/DATABASE |

    | MySQL | jdbc:mysql:////DATABASE

    jdbc:mysql://HOST/DATABASE

    jdbc:mysql://HOST:PORT/DATABASE |

    | Mini SQL | jdbc:msql:////HOST/DATABASE

    jdbc:msql:////HOST:PORT/DATABASE |

    | Oracle | jdbc:oracle:thin:SID

    jdbc:oracle:thin:@HOST:PORT:SID |

    | Sybase | jdbc:sybase:Tds:HOST:PORT

    jdbc:sybase:Tds:HOST:PORT/DATABASE

    (you can find the host and port number in -sybase/interfaces) |

    | JDBC-ODBC Bridge | jdbc:odbc:DSN |


    Table 11.4 shows the basic JDBC URLs for various drivers, where:


    HOST is the name of the host on which the database server resides. If host is
    not given, most JDBC drivers assume localhost.


    DATABASE is the name of the database (not the database server) you want to use
    when you are connected. For an explanation of the difference between a database
    and database server, see the section titled What Is the Difference between a Database
    and Database Server? In Chapter 9.


    SID is the Oracle system identifier that can be found in /etc/oratab. This is
    only applicable to Oracle database servers.


    PORT is the TCP/IP port to connect. The JDBC driver usually assumes that the database
    server was installed with the default port, unless it was not, you should not
    use the PORT.


    DSN is the ODBC data source name. You must configure this using the ODBC driver
    manager as discussed in Chapter 10.


    The getConnection() method can throw an SQLException, so you must use a try...catch
    construct to handle this exception.


