    a database server with advanced capabilities, including object-relational functionality,
    an embedded Java virtual machine, and extensive support for multimedia storage
    and retrieval.


    Unfortunately, it is one of the most difficult database servers to install. The
    installation suffers from many flaws:


    +   The installer requires huge amounts of runtime memory.

    Despite the fact that it has a friendly graphical interface, the installer requires
    you to complete numerous steps at a shell prompt before, during, and after installation.

    The default settings consume much more disk space than other databases (over 700MB).'
