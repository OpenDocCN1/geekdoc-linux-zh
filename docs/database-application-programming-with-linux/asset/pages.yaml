    # Installing Database Drivers (DBDs)


    As with other modules, you can install a DBD from source, or from a precompiled
    package (see the instructions in the CPAN section of this chapter). If the database
    server you are came with your Linux distribution (as PostgreSQL does), you should
    be able to install a precompiled package for the DBD. If you installed from source,
    or from a third-party distribution, you may want to install the DBD from source,
    because some DBDs are sensitive to the version of the database server you are
    using.


    The name of a DBD is always of the form DBD:DRIVERNAME, such as DBD::Pg or DBD::mSQL.
    Table 12.1 lists some of the DBDs available. After you install a DBD, you should
    read the documentation using the command perld DBD::DRIVERNAME, as in perld DBD::Pg.


    # If You Have Trouble


    If you have trouble building DBI or a DBD, please examine the DBI README again,
    or visit the DBI FAQ at www.symbolstore.org/technology/perl/DBI/doc/faq.html,
    and see the section Compilation Problems.


    | Table 12.1 Servers and Drivers |

    | DATABASE SERVER | DBD NAME |

