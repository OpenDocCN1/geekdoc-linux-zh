- img_proc: true
  md: 'care of updating the calls, and after lunch, go back to where I was with the
    customer''s details.


    **Display descriptive messages and text.** Take care to use messages that are
    understandable, even to novices, by not using a lot of jargon or technical terms.
    Don''t write messages, particularly error messages, that blame the user for errors
    that occurred. Messages and text in your applications should be well-written by
    writers skilled in whatever language(s) you speak and read natively.


    You should consider internationalization issues when you develop text labels,
    messages, and error messages. Learn about the internationalization features of
    the development environment offers.


    **Provide immediate and reversible actions, and feedback.** When something happens
    in your application, provide a visual response, such as changing the state of
    a visual object or putting a message in the status bar. Provide a progress bar
    that shows the progress of long tasks. Provide a status bar that shows the state
    of the application and displays informative messages to the user. You should undo
    and redo options for most tasks. When a task is irreversible, you should make
    clear that there is no return from it.


    **Provide meaningful paths and exits.** Your user interface should let users move
    through the application any way they want, and the system should use cues to make
    clear what the system is currently doing, so users know where they are in the
    system at any given time.


    **Accommodate users with different skill levels.** Novices will do novice things
    with your application, and expert users will do thing with it. Make sure your
    application supports different skill levels by making easy things easy, and difficult
    things doable.


    **Make the user interface transparent.** Strive to make the users notice the interface
    as possible. Mandel says the users "feel like they are reaching right the computer
    and directly manipulating the objects they are working with." One technique to
    achieve transparency is to use objects and actions to mimic the real-world objects
    (see also the list item Allow users to directly manipulate interface objects).
    For example, let your users print by dragging Tex, HTML, and other documents to
    the printer icon.


    **Allow users to customize the interface.** KDE and GNOME can be customized in
    many ways: Users can control the appearance of windows, menus, and many other
    parts of the desktop. Make sure your application follows the default customizations
    for the overall user interface. This ensures a consistent look and feel between
    applications. You can let users tweak other aspects of your application, such
    as the contents of menus, mapping of shortcut keys, and layout of toolbars.'
