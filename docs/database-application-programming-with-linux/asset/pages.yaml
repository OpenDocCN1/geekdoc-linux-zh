  md: '# Characteristics of Object-Oriented Languages


    In this section, we will consider some of the main features of object-oriented
    languages, including:

    **Encapsulation.** Hiding information and behavior behind an interface.

    **Classes.** Using encapsulation to mirror the behavior of real-world objects.

    **Interfaces.** Defining the types of interactions you can have with an object.

    **Abstract Classes.** Defining behaviors that are shared among different classes.

    **Inheritance.** Sharing behavior much in the same way that organisms share.

    **Polymorphism.** Interchanging classes that have the same or similar interfaces.


    # Encapsulation


    One of the main innovations in object-oriented programming is the robust integration
    of program and data. Each individual object is a combination of attributes (data)
    and methods (behavior represented by program code). This combination is referred
    to as *encapsulation* (behavior and data are encapsulated in the same way that
    pain-relieving chemicals are encapsulated in a gel tab). Encapsulation is extended
    from one object to another through *visibility modifiers*. An object may declare
    its attributes and methods Public, Private, or Protected (the names of modifiers
    vary from language to language). These visibility modifiers govern whether one
    object may access the attributes or methods of another object. The use of visibility
    modifiers is called *information hiding.*


    As an example, consider a book in a public library loan application. Books are
    due to be returned two weeks after they are checked out. In a procedural program,
    you would need the following:


    +   - A location in memory to store the identity of the book.

    - The date the book was checked out.

    - A function to figure out when the book was due back.

    - A way to pass the date when the book was checked out to the function that figures
    out when the book is supposed to be returned.


    Encapsulation lets us create a book object, which:'
  merge: -1
  pgno: 135
- img_proc: true
  md: '+   - Uniquely identifies the book with the book''s ISBN number and its title\(data).


    +   - Has an attribute that contains the date when the book was checked out\(data).


    +   - Has a method, such as getDate, adds two weeks to the check-out date to determine
    the return date(behavior).


    Having used encapsulation to implement the logic of a book loan, you can develop
    a variety of subsystems for checking books out, without having to concern yourself
    with figuring out when the book is due back. In addition, if the library policy
    changes, and books are to be lent for only one week, rather than two, you only
    need to change one piece of code (such as the getDate method of the book object)
    to upgrade all of your checkout systems to the new policy.


    Now let''s suppose that the library had a lot of bar code scanners that are not
    Y2K compliant. If the scanners had been updating the OutDate attribute of the
    book, the only way to check books out after December 31, 1999 would be to replace
    all of the scanners. However, since we used information hiding, rather than having
    to replace all of the magnetic scanners, all we need to do is update the setCheckoutDate
    method to use something like a Y2K windowing technique to adjust the incorrect
    dates, and the system will continue to function normally.


    # Classes


    We use classes to specify the structure and behavior of these sets of encapsulated
    objects. This is an organizing principle that facilitates the design of encapsulated
    objects. A class is a kind of "cookie cutter" for describing and creating objects,
    or instances of class, that have a common set of features. In most applications
    there are many occurrences (or instances) of objects that have the same attributes
    and methods. Classes are a refinement, and extension, of a structure or record
    in a procedural language, such as the C language''s structs. In fact, the C++
    compiler implements C++ classes as C structs.'
