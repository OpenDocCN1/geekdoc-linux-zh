    # The GNOME Application Framework


    As someone who wants to develop an application for GNOME, you''ll be most interested
    in the application framework. Let''s look at the parts of the GNOME application
    framework that are most important to a database application developer. The assumption
    in this chapter is that a database developer wants to develop a user interface,
    create application objects, and have these objects interact with a database. While
    there are a variety of other ways you can deal with the database, if you are interested
    in GNOME, you are interested in developing a desktop application.'
