  md: 'value-added services. No one said you can''t make money off of software, but
    no one said you had to make it in closed-source licensing.


    # Summary


    If you''re convinced that your Next Great Idea should be realized as an open source
    project, your first question is probably going to be, “how do I get started?”


    For starters, check out Eric S. Raymond’s writings at www.tuxedo.org/~esr/ writings
    and the Free Software Foundation''s philosophy page at www.gnu.org/philosophy/philosophy.html.
    This will give you two different perspectives on free software, and will help
    you think about you will approach the issue of open source.


    As far as the infrastructure that a project needs, you don''t need to worry about
    at all! There are a number of free support services for open source projects:


    SourceForge (www.sourceforge.net). The SourceForge project is sponsored by VA
    Linux Systems, and offers configuration management tools (the CVS suite), mailing
    lists, bug tracking, Web site hosting, and much more (such as MySQL database).


    Freshmeat Server51 (server51.freshmeat.net). Server51 also offers FTP and WWW
    hosting, CVS, mailing lists, and bug tracking.


    More services can be found at the open directory project''s Open Source Hosting
    page, http://dmoz.org/Computers/Open_Source/Hosting/.


    One of the advantages of going with a service that specializes in open source
    projects (aside from the fact that it is free) is using such a service will draw
    developers and users to your project, since these services make the community
    aware of the projects they host. And this one simple thing helps solve the problem
    of attracting a critical mass. Once you''ve got this critical mass, you''ve got
    to do what you can to energize it!'
