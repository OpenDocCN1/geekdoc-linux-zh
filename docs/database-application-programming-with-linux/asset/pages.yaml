    # # Separating Content and Presentation


    When you are working with data, it is helpful if you can separate the content
    from its presentation, because you may end up with a more loosely coupled design.


    In this section, we''ll look at how you can put the results of an SQL query into
    the SwingTable component, which is a sort of grid control.


    # # JTable and TableModel


    The JTable component can use the Observer pattern (see the section titled Observer
    in Chapter 8, "Object-Oriented Design") to keep the content and presentation separate.
    This lets us reusable code without restricting the look and feel of the component.
    The presentation (look and feel) is taken care of by the JTable component, while
    the data is encapsulated in a TableModel object.


    When you first set up the JTable, it consults the TableModel to find out the structure
    of the table, and the data that it contains. If the model changes, it notifies
    the JTable, which in turn reads all all relevant information. Your table model
    must implement at least the following methods, which the JTable uses to get information:


    getRowCount(). This method is used to discover how many rows are in the data set.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_336_0.png)


    **Figure 11.8** Using BoxLayout.'
