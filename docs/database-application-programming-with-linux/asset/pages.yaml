    # Modularity


    In Chapter 5, "Object-Oriented Programming," you will learn about object-oriented
    programming. The object-oriented approach derives a lot of power from the fact
    that it hides information. In a well-designed system, objects are not tightly
    bound to one another. Instead, they use a carefully defined collection of methods
    to allow other objects to access their behavior and data. The information these
    methods protect is important, as is the information that these methods publicize.


    This act of information hiding is a key component of modular programming. A module
    is a group of routines that share common data. Like an object, a module can be
    looked at as a collection of behaviors and data. Unlike an object, a module does
    not come with inheritance or polymorphism. However, the notions that are fundamental
    to modular programming can be applied to object-oriented programming as well.
    In fact, it is useful to look at modular programming without the conceptual baggage
    of object-oriented programming. Not that there''s anything wrong with that baggage,
    but looking at modularity alone offers the opportunity for some unique insights.


    McConnell identifies three components of the modular approach that are key: cohesion,
    coupling, and information hiding. Of the three, we will look at information hiding
    most closely.


    Cohesion and coupling are closely related features of modules. We''re going to
    say whether a module is cohesive or coupled. Instead, we will look at how a cohesive
    module is, and how a coupled module is to other routines out-side the module.


    A good module should have high cohesion. When you design a module, to rank it
    based on the answers to the following questions. The more strongly you feel that
    the answer is "yes," the more cohesion the module has.


    Do the module''s routines clearly belong together? Example: a collection of routines
    for connecting to, querying, and updating databases.


    Does every routine in the module share common data? Example: a module that simulates
    the gravitational effects of an object. This module would have routines to manipulate
    data like the speed, position, and mass of the object.'
