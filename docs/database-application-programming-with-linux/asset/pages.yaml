    Let''s look at what this code does, step by step:


    **Line 7.** Define local variables to hold references to the name, address, and
    phone number widgets.


    **Line 10.** Define strings that we''ll store the current text of those widgets
    in.


    **Lines 12–18.** Because we don''t have any global references to the name, address,
    or phone number widgets, we need some method to find where they are located. Glade
    provides a lookup_widget(method) that is very useful. Simply pass any widget on
    the form, and the name of the widget you are interested in, and it will find that
    widget for you. Because we''re in the event handler for the OK button, we get
    a reference to that widget in the pointer*button. So, to find entryName, entryAddress,
    or entryPhone, we just pass button and the name of each widget to lookup_widget(),
    and it returns the widget we want.


    **Lines 21–23.** Next, we use the gtk_entry_get_text() to get the current string
    that each widget holds. Note that we cast each widget using the GTK_ENTRY macro,
    because that method needs a GtkEntry object as an argument, and each widget is
    currently represented as a GtkWidget object. Again, this is one of the macros
    that helps GTK+ implement polymorphism.


    **Lines 26–28.** Now, we simply use glib''s g_print function to print out the
    current value of the name, address, and phone number. If this were a database
    application, we might store those values in a database table.


    **Line 31.** We''re all done here, so we call gtk_main_quit(), which terminates
    the GTK+ loop.


