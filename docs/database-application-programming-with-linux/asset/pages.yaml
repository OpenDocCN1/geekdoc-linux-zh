    # Common Database Issues


    Rather than simply give you a shopping list of all the features of an RDBMS, we''ll
    look at the problems that come up in the day-to-day life of an RDBMS. We''ll look
    at the features that high-end database systems use to address the problems, and
    what you can do to deal with the problems if you are using a lightweight database
    that lacks such features.


    # Invalid Values


    If you''re going to store data in a relational database, you should do what you
    can to store the data as accurately as possible. Let''s look at the things that
    can go wrong with this, and what you can do to protect your data.


    **Problem.** How do we keep human and computer errors from putting invalid data
    values in the database?


    **Example.** Consider a system that must track customer addresses. The user interface
    is infallible in catching all human errors. However, somewhere between the user
    interface and database, a data conversion has turning all zip codes from strings
    to numbers. As a result, all zip codes that start with 0 are missing the leading
    zero (for example, 02881 becomes 2881). So, there are many zip codes in the database
    that have only four digits, and this is causing confusion at the post office!


    The designers of the system knew the rule that each zip code must have five digits
    (we''re ignoring zip+4 for this example). How could a problem like this be avoided?'
  merge: -1
  pgno: 254
- img_proc: true
  md: "Solution. Create a set of rules that must be met before the database will accept\
    \ new data. For example, if a US zip code is entered that does not have five digits,\
    \ reject it and send the error back to the user. This way, there is no way that\
    \ invalid data can be entered in the database.\n\nImplementation. It is not sufficient\
    \ to implement these rules in the user interface, or even in the domain layer.\
    \ All too often, databases are manipulated by feeds from other systems, automated\
    \ processes, and administrators performing direct updates to the database by hurriedly\
    \ typing when system is corrupted. There are too many places invalid data can\
    \ be entered, and the best place to catch it is at the database itself: Don't\
    \ let anything that's not right.\n\n# The SQL Way\n\nWhen you create a table,\
    \ you can specify constraints using the CONSTRAINT clause. The CONSTRAINT clause\
    \ takes the form CONSTRAINT constraint_name CHECK (condition). If we want to verify\
    \ that a character value has a certain number of characters, we can use the CHAR_LENGTH()\
    \ function to do so. Because some strings may be padded on either side with white\
    \ space, it is suggested that you use LTRIM and RTRIM on the value, which makes\
    \ for a funny expression: CHAR_LENGTH(LTRIM RTRIM(value))). The following is a\
    \ CREATE TABLE statement that defines an address table where all zip codes must\
    \ be five characters long:\n\n```\nCREATE TABLE address\n(street_address CHAR(35),\n\
    \  city CHAR(35),\n  state CHAR(2),\n  zip CHAR(5),\n  CONSTRAINT check_zip (CHAR_LENGTH(LTRIM(RTRIM(zip))))\
    \ = 5\n)\n```\n\n> NOTE Some implementations of SQL do not support the CHAR_LENGTH\
    \ function. You may want to see if LENGTH is implemented instead.\n\nThe CONSTRAINT\
    \ clause is supported in Oracle, PostgreSQL, and Sybase. See the database server\
    \ documentation for specific notes on how to use this feature. For database systems\
    \ that do not support this clause, you'll have to fake it."
  merge: -1
  pgno: 255
