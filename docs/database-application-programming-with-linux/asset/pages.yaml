  md: '# Extensibility. Since there is an agreed-upon database structure, new tools
    can be easily integrated into the system.


    # Control Modeling


    The next step is to model how control will flow within and between the subsystems.
    One of the models that Sommerville discusses is the event-based control model.
    In this model, there is no central system that governs the flow of control. Instead,
    there are entities that originate outside of the system control determine which
    subsystems are activated and how control flows between subsystems. Such events
    can come from other systems or from the system''s user interface.


    Since this book is concerned with GUI-enabled desktop database applications, as
    opposed to batch-oriented systems, the event-based model fits our reader example
    well.


    However, if we assume the existence of a single application entry point, we need
    to include entry point (the Main Screen in Figure 1.5) in our control model. So,
    our model derives a bit from a centralized control model (also discussed by Sommerville),
    as well as an event-based control model. In the centralized model, a single subsystem
    takes responsibility for the initial control of the other subsystems. Figure 1.5
    shows a control model for the timesheet system.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_33_0.png)


    **Figure 1.5** Control model for the timesheet system.'
