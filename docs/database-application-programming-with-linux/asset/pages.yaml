    \ is known as *drives*, and each role is qualified as *driver* and *vehicle*.\n\
    \n```\n```\nPerson\n+name:\n  |\n  drives ► vehicle\n  Automobile\n+number_of_doors:\n\
    ```\n```\n\nFigure B.3 Two associated classes."
