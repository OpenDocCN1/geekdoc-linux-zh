  md: '# CHAPTER 2


    # # Database Design


    Database systems use tables to store information about real-world objects or concepts
    (entities). A table is a container for data. For example, a table of invoices
    is analogous to a file cabinet full of invoices. The advantage of the database
    table is ease of searching. You can easily search the table for all invoices from
    a given date or for a particular customer. With the file cabinet, this is not
    so easy.


    In a relational database system, relationships between tables mirror the relationships
    between entities you are trying to model. Flat-file database systems organize
    information into tables, much as relational database systems do. However, flat-file
    systems do not provide facilities for creating and managing relationships between
    tables. In a relational database system, the relationships between tables help
    you model the real-world behavior of entities in your database.


    A table is essentially a grid of rows and columns. Each row represents a particular
    instance of an entity (such as a person, place, or thing). For example, if you
    have a table called Person, then each row contained in that table corresponds
    to a particular person. Table 2.1 illustrates this.


    It may be helpful to think of a relational database system in object-oriented
    terms. If you think of each row as an *instance*, then you can think of each column
    as an *attribute* (or property). For example, a person might have a certain address,
    telephone number, or seating preference at major sporting events. If you locate
    an intersection of a row and column, you also identify a single value, such as
    Brian Jepson''s telephone number.'
  merge: -1
  pgno: 36
- img_proc: true
