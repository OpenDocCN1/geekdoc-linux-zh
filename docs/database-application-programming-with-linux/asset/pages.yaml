  md: 'Trying to join two tables on nonkey or foreign key columns. Foreign keys are
    meant the vehicle for joining two tables. If you use arbitrary columns (such as
    publisher_code = publisher.name), you might get unexpected results due to the
    fact that nonkey columns may not be identical columns. For example, if you have
    a table that contains people''s names and you try to join this table with another
    based upon their last name only, you will associate each Smith patron with all
    the rows in another table that matches that last name. This results in a smaller
    Cartesian product than would occur if you specified no join condition, but still
    get bogus data, as shown in Table A.1.


    Only a unique identifier as a user ID will give you correct results. If your database
    is well-normalized (because there won''t be a last name in the borrows or loan
    table), then it will be harder to make such mistakes, but you should be aware
    of these kinds of errors.


    # Retrieving All Columns


    Here is a tip to simplify your queries. If you are retrieving all columns of a
    table, or a set of joined tables, you can make use of the "*" notation.


    ```

    SELECT *

    FROM book;

    ```


    The asterisk indicates that all columns from the book table will be included in
    the result.


    # Aliases


    Sometimes we wish to rename the columns in a result set. Here is an example of
    the use of an alias to accomplish this:


    ```

    SELECT name AS PublisherName

    FROM publisher;

    ```


    Table A.1 John Smith Borrowed Now Wait for Last Year, But All the Smiths Are Held
    Accountable


    | FIRSTNAME | LASTNAME | BOOKBORROWED |

    | John | Smith | Now Wait for Last Year |

    | Joe | Smith | Now Wait for Last Year |

    | Bob | Smith | Now Wait for Last Year |'
  merge: -1
  pgno: 509
- img_proc: true
  md: "This can be used to make the results more meaningful to people who have to\
    \ read the output, as shown here:\n\n```\nmysql SELECT name AS PublisherName\n\
    \  -> FROM publisher;\n+------------------------------------+\n| PublisherName\
    \                      |\n+------------------------------------+\n| Grove    \
    \                          |\n| Vintage Books                       |,\n| Wiley\
    \ Computer Publishing         ||\n+------------------------------------+\n  3\
    \ rows in set (0.00 sec)\n```\n\n# Querying with NULLs and Sets\n\nSometimes a\
    \ null value has meaning in the context of your application logic; thus, you might\
    \ wish to execute a query that selects all records with NULL in a particular column.\
    \ For example, this statement gets all the books that have an unknown publisher:\n\
    \n```\nSELECT title\nFROM book\nWHERE publisher_code IS NULL;\n```\n\nYou might\
    \ also want to query based on a set of values for a particular column. The next\
    \ query selects all books where the publisher code is in the list ‘0-679’, '0-802':\n\
    \n```\nSELECT title\nFROM book\nWHERE publisher_code IN ('0-679', '0-802');\n\
    ```\n\nYou can also use IN to compare rows to the results of a query. This command\
    \ fetches all the books that are listed in the banned_books table:\n\n```\nSELECT\
    \ title\nFROM book\nWHERE isbn IN (SELECT isbn FROM banned_books);\n```\n\nAs\
    \ of writing, Mini SQL and MySQL do not support the IN keyword.\n\n# DISTINCT\n\
    \nSome queries will give you repetition in your result rows unless you specify\
    \ with the keyword DISTINCT. In this example, we can see the names of books"
  merge: -1
  pgno: 510
- img_proc: true
  md: 'that were checked out without having to see multiple rows for all the dates
    on which they were checked out:


    ```

    SELECT DISTINCT title

    FROM book, borrowed_book

    WHERE book.isbn = borrowed_book.isbn;

    ```


    # Aggregate Queries


    SQL has aggregate features to assist you in finding maximum, minimum, count, sum,
    and average values. For example, let''s get a count of all the loans the library
    ever made:


    ```

    SELECT COUNT(*)

    FROM borrowed_book;

    ```


    We can also group this by each book title, as in:


    ```

    SELECT title, COUNT(*)

    FROM book, borrowed_book

    WHERE book.isbn = borrowed_book.isbn

    GROUP BY title;

    ```


    Consult your database documentation for which aggregate functions are supported.


    # Views


    SQL permits the definition of named views or virtual tables. Since the result
    of any SQL query is a table, this table can itself be used as a virtual table
    within the database. Views are simply the named results of given queries. For
    example, to execute a banned books view, we can execute the following SQL statement:


    ```

    CREATE VIEW banned_book_info

    AS SELECT title, isbn

    FROM book

    WHERE isbn IN (SELECT isbn FROM banned_book);

    ```


    Then, you can use SELECT to get data out of this view as though it were a regular
    table:


    ```

    SELECT * FROM banned_book_info;

    ```'
