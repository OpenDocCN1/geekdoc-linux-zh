    message that would violate referential integrity.


    The REFERENCES constraint is supported by Oracle and Sybase. Although MySQL and
    PostgreSQL recognize the keyword, it is ignored by the server (the keyword is
    only there to make it easier to port SQL from other servers).


    # Triggers


    You can also use a trigger to customize how the database will react to an operation
    such as a deletion. A trigger is a special type of procedure that is invoked whenever
    certain database events occur.


    To install a trigger in your database, you can send it to the server as you would
    any SQL statement (see the sections titled Sending SQL to the Server under each
    database section in this chapter).


    If you would rather delete all the line items when an invoice is deleted, you
    can use a trigger to cascade the deletion to all the child tables. In other words,
    whenever you delete a row from the invoice table, you want the trigger to execute
    the command DELETE FROM line_item WHERE line_item.inv_no = old.inv_no (where old.inv_no
    is the invoice number of the row you are deleting from the invoice table).


    # Cascading Deletes with Oracle Triggers


    Here is a trigger in Oracle''s PL/SQL that cascades delete on the invoice table
    down to the line_item table:'
  merge: -1
