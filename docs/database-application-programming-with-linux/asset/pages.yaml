    # NOTE


    If you do not include a column in an INSERT statement, the database will insert
    a NULL value for column when it creates the new row. If you have specified a default
    value for column in the CREATE TABLE statement, it will use that value instead
    of NULL. For example: CREATE TABLE employee (salary INT DEFAULT 60000). Similarly,
    some database servers support auto-increment columns, which are assigned successive
    values each time you insert a new row (see the section titled Generating Unique
    Values in Chapter 9).


    If your INSERT statement specifies values for all columns in the table, you don''t
    need the <column-list>. For example, this INSERT statement inserts a row into
    the patron table:


    ```

    INSERT INTO patron

    VALUES (''Brian'', ''Jepson'', ''C'', NULL, ''Kingston'', ''RI'',

    02881'', NULL, 100, 0)

