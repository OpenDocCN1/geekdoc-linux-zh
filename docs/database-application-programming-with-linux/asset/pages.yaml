  md: '# CORBA Goodies


    Let''s take a look at some utilities and services that can help you in working
    with CORBA applications.


    # Naming Services


    In the examples we saw in this chapter, we had to get the IOR from the server
    to the client somehow; otherwise, there was no way the client could have found
    the server. CORBA also supports a naming service that allows clients to find an
    object based on its name.


    Each CORBA implementation discussed supports some kind of naming service. The
    biggest trick in using a naming service is the client application how to find
    the naming service. Each implementation solves this problem in its own way.


    ORBit uses GOAD, the GNOME Object Activation Directory. GOAD is coupled to a user''s
    GNOME session: GNOME applications use a feature of the X server to find the IOR
    of the naming service.


    MICO ships with a daemon called *nsd*, the name service daemon. MICO uses its
    own addressing scheme to help clients locate this service.


    # Java 2


    JDK 1.2 (also known as Java 2) includes a CORBA-compliant ORB, and a CORBA API.
    As a result, you can develop CORBA clients and server using Java 2. The IDL compiler,
    idltjava, does not come with the JDK distribution. The idltjava compiler is available
    as a separate download, but as of this writing, only Solaris and Windows versions
    were available. Until an idltjava compiler is available for Linux, the only way
    you can take advantage of Java 2''s new CORBA features is to compile your IDL
    on one of the supported platforms. There have been reports that idltjava runs
    under WINE (www.winehq.com), a Win32 implementation for Linux, but we were unable
    to confirm these reports.


    More information on idltjava can be found at www.javasoft.com/products/jdk/idl/.'
  merge: -1
