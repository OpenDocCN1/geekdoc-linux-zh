  md: '# Choosing Patterns


    How do you choose which patterns to use? There are many ways to approach this.
    The first question you need to ask is, when is it appropriate to use a pattern?
    To answer this question, you need to think about the problem you are trying to
    solve.


    To assign responsibilities in our design, we''re using Larman''s General Responsibility
    Assignment Software Patterns (GRASP). We''re not going to describe each pattern
    here. Instead, we''ll bring them up as we use them. To get you thinking about
    how you''d use them, here''s a table of pattern names, and the categories they
    fit into. Table 8.1 lists some of the GRASP patterns.


    # Using UML in Object-Oriented Design


    The artifacts in the previous chapter are aids to comprehension. The artifacts
    that are produced in this chapter describe software constructs. In this chapter,
    we''ll build two artifacts that will directly help you in writing code: A Collaboration
    and Class Diagram. When those are completed, we''ll discuss techniques to deal
    with the user interface and database issues. By deferring consideration of these
    issues, we can concentrate on the domain logic, and evolve a purer design of our
    classes.


    In this chapter, we''re going to design for only one of the use cases. In practice,
    you will assign one or more use cases to a given iteration, and develop a prototype
    for that use case. As you proceed through successive iterations, you will generally
    take on more use cases. For example, if you did Borrow Books in the first iteration,
    you might do Borrow Books and Return Books in the second iteration.


    # Baggage from Previous Iterations


    When you move into the next iteration, what can you keep? Do you have to throw
    away all the artifacts and implementations from the previous iteration? Let''s
    consider both scenarios:


    Table 8.1 Patterns Used in This Chapter (from Larman''s GRASP Patterns)


    | PATTERN | DESCRIPTION |

    | Controller | Who is responsible for handling a system operation |

    | Expert | What is the most basic technique we can use to delegate responsibility
    |

    | Creator | Who should be responsible for creating an instance |'
