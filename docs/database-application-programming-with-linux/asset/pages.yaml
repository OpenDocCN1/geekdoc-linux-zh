  md: '# CHAPTER 12


    # DBI and Perl


    Perl is no stranger to database programming. In fact, it''s probably the most
    commonly used language for Web database development. Perl also has a long history
    of being run from the shell, used in CGI scripts, or used in shell scripts. This
    stdout/stdin legacy should not shackle it, though, because Perl has many pretty
    faces. "Linux Development Tools Catalog," are written in Perl. So, if you have
    some hang-ups about using Perl for a graphical database application, try to check
    them at the door. If you can''t, we''ll do our best to rid of them. This chapter
    expects some familiarity with the Perl programming language. Familiarity with
    Perl references (see the perlerf man page) will also be helpful.


    # The Perl DBI


    The DBI is a high-level interface to various database systems. It provides database
    independence by using a single API for every supported database. You can use the
    DBI interface to connect to databases, issue SQL statements, and retrieve result
    sets.


    Figure 12.1 shows the architecture of a typical DBI application. The following
    is a breakdown of each component:


    Application. The application is a program written in Perl that needs to interact
    with a database server. It will use a DBI connection string to tell the DBI module
    which database it wants to connect to (we''ll talk more about connection strings
    later in this chapter).


    335'
