  md: '# Leftovers


    There will certainly be some leftovers that can''t be handled by the database
    system. Suppose that a patron may not have more than 10 books checked out at any
    time. While high-end database systems like Sybase, Oracle, and PostgreSQL can
    handle these sorts of constraints (see the sections titled Invalid Values and
    Triggers in Chapter 9), lightweight SQL engines like Mini SQL cannot. Leftovers
    as these will have to be handled by your application. Be sure that the leftovers
    are documented and communicated to whoever is working on the front-end of the
    application lest they fall through the cracks.


    # Digging Deeper


    We did not model everything that the library system would need, such as tracking
    the amount of fines owed. Because this chapter focused primarily on applying the
    normal forms, we did not pay as much attention to capturing the entities that
    need to be modeled. Instead, we started out with simple entities (Patron and Book)
    and started from there. Chapter 3, "User Interface Design," offers some simple
    techniques for finding entities that need to be modeled. Chapter 7 provides a
    survey of a more rigorous technique that can be used to discover what entities
    or objects are lurking in your requirements. In fact, you can perform the steps
    in Chapter 7 to create a conceptual model before you do your database design,
    and normalize the conceptual model into a database design.


    # SQL


    Structured Query Language (SQL) is a programming language that you can use to
    manipulate information contained in a relational database. Use SQL to create tables,
    modify data, and issue queries.


    Each database system uses a slightly different SQL syntax. We''ll try to stick
    to examples that use a common subset of SQL; however, where there are differences,
    we will note them. Each database management system uses a different method of
    sending SQL statements to the database server.


    If you want to try out these commands as you read through the chapter, you should
    see the SQL Monitors section in Chapter 7 to learn how to issue SQL statements
    to the database you are using. See the What''s on the Web Site? section in the
    introduction for the location of example programs, including the SQL examples
    in this chapter. Before you execute SQL statements, you will need to install a
    database server, have a database that you can create tables in, and be able to
    use an SQL monitor program to issue queries.'
