  md: 'Implementation. The solution can be implemented using locks and/or actions,
    which prevents other users from making changes until you are finished. A transaction
    groups a collection of statements into a unit, and uses locks in the following
    way: If you acquire a lock during a transaction, it is held until the transaction
    is completed. Transactions offer other benefits, such as all-or-nothing completion:
    If one of the elements in the transaction fails, all the pending changes are automatically
    rolled back, or undone.


    # The SQL Way


    Let''s look at how different database servers address this problem using SQL:


    PostgreSQL. After you begin a transaction, you must explicitly place any locks
    you will need. Until you release the locks, no other user may read from the table:


    ```

    BEGIN TRANSACTION;

    LOCK inventory;

    SELECT quantity FROM inventory WHERE item=''widget'';

    [...] some calculations that result in 30 [...]

    UPDATE inventory SET quantity = 30;

    COMMIT;

    ```


    Oracle. Like PostgreSQL, Oracle gives you the ability to lock a table. The SHARE
    ROW EXCLUSIVE lock will allow other users to view data, but won''t let them acquire
    a lock on the table (which is required to change data). Oracle implicitly creates
    a transaction, so there is no need for a BEGIN TRANSACTION statement. Here is
    an example where we lock the inventory table in SHARE ROW EXCLUSIVE MODE, and
    then perform an update:


    ```

    LOCK TABLE IN SHARE ROW EXCLUSIVE MODE;

    SELECT quantity FROM inventory WHERE item=''widget'';

    [...] some calculations that result in 30 [...]

    UPDATE inventory SET quantity = 30;

    COMMIT;

    ```


    Sybase. The HOLDLOCK keyword in a SELECT statement will lock a portion of a table
    within a transaction. When the transaction is complete, the lock is released,
    which allows other users to retrieve data:


    ```

    BEGIN TRANSACTION

    SELECT quantity FROM inventory HOLDLOCK

    WHERE item = ''widget''

    [...] some calculations that result in 30 [...]

    UPDATE inventory SET quantity = 30 WHERE item = ''widget''

    COMMIT TRANSACTION

    ```'
