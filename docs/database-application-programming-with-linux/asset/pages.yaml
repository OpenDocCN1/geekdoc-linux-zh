  md: '# UI and Database Design in Context


    Earlier chapters on database and UI design presented design strategies outside-of
    the context of the OO analysis and design process. Although this approach enabled
    us to focus on the core issues without coupling the details of those issues to
    OO analysis and design, we did not generate design documents that capture the
    level of detail that the OO analysis and design did. In fact, the design strategies
    discussed in these chapters are ideal for smaller projects. On larger projects,
    it makes sense to begin with object-oriented design, and proceed to UI and database
    design.


    # Designing the User Interface


    Now that we have a collaboration diagram and a class design, we need to develop
    a user interface. The two questions we need to answer are “how do we design the
    user interface,? and “how do we incorporate it into our current design?”


    There are two parts to the design of the user interface. The first is the GUI
    design, which is discussed in Chapter 3, “User Interface Design.” How do we graft
    this technique into the OO&D process?


    Examine the steps in the section titled The Development Process in Chapter 3.
    Steps 4 and 5 of that section are discussed in detail in the section titled Develop
    and Refine the UI Prototype. That section suggests identifying nouns and verbs,
    and building an object-attribute tree. However, you can use the conceptual model
    we created in the previous chapter as the basis of this process, possibly eliminating
    the need to identify nouns and verbs.


    The second part of the design of the user interface is adapting the user interface
    to the domain objects shown in Figure 8.15. The Observer pattern, discussed earlier
    in this chapter, gives us a great way to solve this problem: The LoanHandler would
    be the subject, and the user interface classes would be observers. There are other
    patterns available to deal with this issue. Larman explains the Model-View Separation
    pattern, which is helpful in hooking up a user interface to domain objects.


    # Bridging Database and Objects


    As we discussed earlier in this chapter, bridging objects and a relational data-base
    can be very difficult. In this section, we''ll glance at some patterns for building
    frameworks that map objects to relational databases. Building such a framework
    is a lot of work (probably larger than the system itself)!!'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Object-Oriented Design 203


    The point of this section is to educate you about object-relational mapping and
    expose you to some frameworks that others have built. Unless you are responsible
    for building an object-relational framework that''s going to be widely reused,
    it is probably more trouble than it''s worth: Use one of the solutions listed
    in the next section. All of the object-relational mapping tools discussed are
    open source software, so if the solution doesn''t fit your needs, you should customize
    or port it. This will certainly be less effort than building from scratch!


    # NOTE


    As of this writing, no object-relational framework exists specifically for GNOME
    or KDE, so if you''re looking for some way to contribute to the free software
    community, perhaps this section will inspire you.


    # Patterns for Object-Relational Mapping


    There are a number of pattern languages (collections of cooperating patterns)
    that address the issue of object-relational mapping. Many of these are listed
    on the Cetus Links Object-Relational Mapping page at www.cetus-links.org/oo_db_systems_3.html.


    Let''s take a look at some of the patterns in the most popular pattern languages


    Table Design Time. According to this pattern, the best time to design a table
    is after you have created a first pass of your object model (this is the class
    diagram as shown in Figure 8.15, not the conceptual model). The Table Design Time
    pattern suggests that doing a database design first will result in a design that
    does not work well with an object-oriented approach.


    Representing Objects as Tables. This pattern depends on the Foreign Key Reference,
    Object Identifier, and Representing Collections patterns. Otherwise, it suggests
    that many attributes can map cleanly to columns.


    Representing Collections in a Relational Database. This pattern suggests using
    an extra table to represent one-to-many relationships, as we did with many-to-many
    relationships in Chapter 2, "Database Design." This approach allows visibility
    from the parent object, instead of the child (From Domain to Persistence earlier
    in this chapter).


    Object Identifier (OID). This pattern suggests using unique IDs for each persistent
    object. If you read Chapter 2, this should not be a much of a surprise. However,
    primary keys are usually unique within a given table. A unique OID should be unique
    throughout the entire database. That way,'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 204 CHAPTER 8


    you use two tables to represent subclasses of a parent class (such as Student-Patron
    and ChildPatron), you won''t have objects with duplicate OIDs if you cast them
    to their superclass.


    **Foreign Key Reference.** The Foreign Key Reference pattern suggests storing
    a reference to the foreign instance''s OID, as is done in relational database
    design.


    **Broker.** A broker is a special class that knows how to talk to the database.
    It is responsible for creating instances of domain objects from the database,
    and for updating the database when an object changes. Tangram: Object-Relational
    Mapping in Perl in Chapter 12, "DBI and Perl," for an example of a framework that
    uses a broker, the Tangram::Storage class.


    Crossing Chasms is a complete pattern language that includes many other patterns.
    We''ve presented a glance at some of the patterns here to give you a taste of
    it, but it would be best if you read the entire pattern language to plan implement
    any of it.


    # Object-Relational Mapping Tools


    Here are free tools that may help you with object-relational mapping: Tangram.
    Tangram is an object-relational mapping framework for Perl. The section titled
    Tangram: Object-Relational Mapping in Perl provides an introduction to Tangram,
    and can be found in Chapter 12.


    **Enterprise Java Beans (EJB).** EJB is a component technology for Java that is
    used to develop your domain objects (business objects). It includes many features,
    including persistence via an object-relational mapping. Consulting AG provides
    an EJB implementation (RC-EJB) under the GNU General Public License. More information
    is available at www.roesch-ag.ch/ejb/ejb/download.html.


    **GNUSTep.** GNUSTep is a free implementation of OpenStep, a suite of enterprise
    application frameworks developed by Sun and Next. GNUSTep includes GNUStep-db,
    an implementation of EOF (Enterprise Objects Framework), which supports object-relational
    mapping to a number of SQL databases. More information can be found at www.gnustep.org.


    **JORA.** Konstantin Knizhnik''s home page is at www.ispras.ru/~knizhnik/. Among
    other things related to object-oriented database development, you can find JORA
    (Java Object-Relational Adapted) there, which helps you map Java classes to database
    tables.'
