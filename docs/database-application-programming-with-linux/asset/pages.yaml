  md: '# Java, Swing, and JDBC


    Java is a convenient language for database development, and an ideal choice for
    beginners to SQL application development. The standard Java SDK includes JDBC,
    a data access API that is powerful and easy to learn. Also, Java’s user interface
    offerings have matured to the point where you can build powerful applications
    even without a visual user interface builder.


    Linux and Java are a great combination, as well. There are several high-quality
    Java implementations for Linux that are freely available, including some open
    source implementations. Table 11.1 lists these Java implementations.


    In this chapter, we’ll look at the building blocks of Java database programming,
    and show you how to put them together to build your own systems. This chapter
    expects some familiarity with programming in Java, as well as an understanding
    of how Java locates classes and uses jar files (archives of Java classes).


    # JDBC


    JDBC is a database access API for Java. You can use it to open a connection to
    a database server. Then, you can use the connection to send SQL to the database
    server and retrieve the results of any SQL statements that you execute.


    Figure 11.1 shows a high-level view of the major JDBC components (this figure
    was inspired by the interactive dialog on the About tab of the unixODBC utility).
    Let’s look at each of these components before we get any closer to JDBC.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Table 11.1 Implementations Available on Linux


    Application. The Application is a program written in Java that needs to connect
    to the database. It is armed only with a JDBC URL, such as jdbc:postgresql:accounting_db.
    The Application relies on the Driver Manager to connect to the database.


    Driver Manager. The Driver Manager is responsible for managing a registry of JDBC
    drivers and helping the Application connect to a driver.


    JDBC Driver. A JDBC Driver is a collection of classes that implement the JDBC
    API and have the capability to communicate with a database system. When the Driver
    Manager connects an Application to a Driver, it asks the Driver to create an instance
    of a java.sql.Connection subclass. The Application uses this object to get the
    full JDBC API, without needing to know the real identity of this object. Here
    is polymorphism in action: The Application thinks it is talking to an instance
    of java.sql.Connection, when in reality it is talking to something like org.postgresql.Connection
    (the connection object from the PostgreSQL driver) or org.gjt.mm.mysql.Connection
    (the connection object from the MySQL driver).'
