    # Data Types


    Although the SQL standard includes a standard set of data types, not all of the
    database servers adhere to that standard. Table 9.7, the Data Type Cross-Reference
    table, is included here as a guide to the differences. This is not a complete
    list of data types supported by each server, but a common convergence point to
    make it easier to port from one to another.


    Boolean. A true or false value. Some databases support a bit type, which can be
    0 or 1.


    Character(len). A string of length len. Often abbreviated as char.


    Character Varying(len). A variable string of maximum length len. Often implemented
    as varchar.


    Date. A date value. Some implementations combine date and time into data type.
    In Oracle, this is the date type. In Sybase, it is datetime.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Table 9.7 Data Type Cross-Reference Table


    | SQL-92 TYPE | POSTGRESQL SQL | MYSQL | ORACLE | SYBASE |

    |---|---|---|---|---|n| boolean | bool | bit | | |

    | character(len) | | * | | | |

    | character varying(len) or varchar(len) | | text(len) | | | |

    | date | | | | | datetime |

    | decimal(prec, scale) | | | | | |

    | decimal(9, 0) | decimal | decimal(9,0) | decimal(9,0) | decimal(9,0) |

    | double precision | float8 | * | | |

    | float(prec) | float4/float8 | * | | |

    | integer | int4/integer | * | | |

    | numeric(prec, scale) | | * | | | |

    | numeric(9, 0) | numeric | * | | | |

    | smallint | int2 | | | | |

    | real | float8 | * | | | |

    | time | | | | date | datetime |

    | timestamp | | * | | |


    * indicates it is the same as SQL-92


    **Decimal(prec, scale).** An exact numeric value. The number of digits is specified
    in prec. The number of those digits are reserved for the decimal portion are specified
    in scale. For example, decimal(5,2) could hold a maximum value of 999.99. Older
    versions of MySQL counted the decimal point, but current versions do not. With
    the older versions (3.22 and earlier), the maximum for decimal(5,2) would be 99.99.


    **Double Precision.** An approximate floating-point value. This is generally eight
    bytes wide, so you can put some pretty big numbers in.


    **Float(prec).** An approximate floating-point value with the specified precision
    (prec). Depending on the precision, this will be either four or eight bytes wide.'
