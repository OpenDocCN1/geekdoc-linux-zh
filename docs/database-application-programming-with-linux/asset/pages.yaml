  md: '# Object-Oriented Analysis


    In Chapter 4, “Construction,” we talked about a host of techniques for building
    high-quality code. In that chapter, we focused on a subroutine (also known as
    function or method) as the unit of work. In this chapter, we''re going to look
    at system construction on a much higher level. We''ll analyze a formal requirements
    document and produce some documents that will help in the next chapter as we design
    classes and look at what''s involved in writing code.


    This (and the following) chapter bring together many of the activities that fall
    under object-oriented analysis and design (OOA&D). Keep in mind that the steps
    we present don''t form a rugged, proven process. Instead, these steps represent
    a sampling of activities that are used in industrial-strength OAA&D processes.
    So, the activities in this chapter form a lightweight process that you could use
    to build good systems, but you would do yourself a disservice if you didn''t look
    beyond the ideas in this chapter. After you digest the material in this chapter,
    you would be wise to consult the following books (which we highly recommend),
    and use them as departure points for further investigation into OOA&D:


    +   - Applying UML and Patterns by Craig Larman (Prentice Hall, 1998).

    - UML Distilled Second Edition by Martin Fowler and Kendall Scott (Addison-Wesley,
    1999).'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# CHAPTER 7


    The process presented in this (and the following) chapter is closely patterned
    after Larman''s.


    One reason that these two chapters cannot offer a full OAA&D process (besides
    the fact that it''s too damn short for such thing) is that there is really isn''t
    one true process. Instead, there are many activities that can be put together,
    a modular system, to build a process that works for you and the organizations
    you develop software for.


    # What''s the Point?


    You may be wondering why we are bothering so much with analysis and design. There
    are two ways you can use the information in this and the next chapter. First,
    you can learn all about the analysis and design process, and follow the references
    to learn more about it. Second, you can simply learn the notation, and use it
    as a tool to understand the examples in this book. We''ll agree that a notation
    such as UML makes it easier to understand how application fits together. In the
    next chapter, we''ll look at patterns, an idiom that lets you look at the structure
    of a solution on a very high level.


    Whether you agree with the details of the process in these chapters is not important.
    The most important thing we want to sell you on is the use of UML and patterns
    as tools for communication.


    # The Unified Modeling Language


    The Unified Modeling Language (UML) is a notation for representing problems and
    specifying the design of systems that deal with the problems. UML has evolved
    over time from deep roots in object-oriented process and notation, and is recognized
    as a standard for modeling within OAA&D. It''s an interesting sort of standard,
    because you can choose which parts of UML are most useful to you. You are not
    bound by the standard to do things a certain way, or in a certain order. More
    details on UML can be found at the UML Resource Center at www.rational.com/uml.


    It''s important to point out that UML is not a modeling process, but a notation
    for creating models of systems. However, UML is used within modeling processes.'
  merge: -1
