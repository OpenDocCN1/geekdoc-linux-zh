    # MySQL


    MySQL is a database server that offers fast performance (especially on large data
    sets), while offering many SQL features, locking, and a flexible mechanism. The
    MySQL developers offer a feature comparison at www.mysql.com/crash-me-choose.html.
    At this page, you can choose one or more database servers, and see which features
    they support.


    For most purposes, you do not need to pay for a MySQL license. Also, older versions
    of MySQL are released under the GPL. You can find MySQL at www.mysql.com (use
    a mirror site if possible for downloads of the source or binary distributions).


    # Before You Install


    Before you install MySQL, take the following into consideration:


    **Where to find the documentation.** Documentation for MySQL is available online
    at www.mysql.com. However, this documentation covers the latest (sometimes beta
    or alpha) version of MySQL. The source code distribution includes user documentation
    in the Docs subdirectory.


    If you install MySQL from a binary distribution, the documentation should install
    into /usr/doc, in a directory named something similar to /usr/doc/MySQL-3.23.11-alpha
    (the exact name will depend on the version of MySQL you installed).


    Instructions on installing MySQL can be found in the source code distribution,
    which includes two files, INSTALL-SOURCE, and INSTALL-SOURCE-GENERIC. You should
    read these before trying to compile MySQL.


    **Source versus binary installation.** The MySQL Web site includes source code
    and binary distributions. If you need more control over the configuration'
