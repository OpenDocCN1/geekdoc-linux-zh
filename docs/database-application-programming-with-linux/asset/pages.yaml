- img_proc: true
  md: '# CHAPTER 12


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_349_0.png)


    Figure 12.1 DBI application architecture.


    **DBI.** DBI is a driver manager that handles requests for a database connection.
    It passes requests on to a database driver (DBD), which handles the actual work
    of interacting with the database.


    **Database Driver (DBD).** A DBD is a module that implements the DBI specification.
    It is essentially an adapter that bridges the DBI interface with the vendor-specific
    API that is supported by the database server. The DBD has the ability to connect
    to a database server, send SQL statements, and obtain result sets.


    **Database System.** This is a database server, such as PostgreSQL, Sybase, Oracle,
    Mini SQL, MySQL, or even a non-SQL data source such as a comma-delimited file.


    # Installing the DBI


    There are two ways you can install the DBI: Use a precompiled package or build
    it from the source code. In either case, you need to get the package from the
    CPAN archive, or from your Linux distribution media.


    # CPAN


    Perl''s one-stop repository, the Comprehensive Perl Archive Network (CPAN), contains
    a huge collection of peer-reviewed modules that cooperate'
