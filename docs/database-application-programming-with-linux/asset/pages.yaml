  md: 'In addition to McConnell''s list of potential secrets, there are some secrets
    that database developers may want to consider hiding. In an ideal world, APIs
    such as DBI, ODBC, and JDBC would provide you with complete independence from
    your database server. In practice, these APIs fall short because of the amount
    of differences between database systems.


    There are several aspects of database systems that generic data access APIs cannot
    address, or do not always fully address. One aspect is generating unique values
    for primary keys (see Generating Unique Values in Chapter 9, "Databases”). With
    Mini SQL, for example, you must access a special 9_seq (sequence) field to get
    new value for a primary key. Under Sybase, MySQL, and other databases, you can
    declare columns in such a way that they get a unique value each time you insert
    a new row into the database. To make things more complicated, some database developers
    choose to make a separate table for managing and generating sequential keys.


    Does your program rely on features of your database server that are not handled
    by the database access API? If so, move these parts into a separate module. When
    it comes to port your application to a different database, someone will be thankful!


    # Summary


    When you get ready to build something, the first thing you should do is have a
    look around for reusable components. One of the benefits of all the free software
    development that goes on is the development of reusable libraries. A perfect example
    of this is GTK+, which was developed to support the GIMP, but has been used in
    many other applications.


    When you can''t reuse, you may need to build something yourself. When you do this,
    pay attention to issues that affect the readability, design, and modularity of
    your code. The world needs more modular and readable implementations of robust
    and fast algorithms. When you develop code for Linux, you can either contribute
    a new puzzle for people to solve, or another tile in the mosaic of free software.'
