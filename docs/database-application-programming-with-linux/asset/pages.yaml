  md: '# Deploying the Schema


    Before you can use the schema, you need to create the tables in the database.

    The Tangram::Deploy module does this for you, and also creates a number of

    other tables that tell Tangram about such things as the relationships between

    tables. This happens behind the scenes, so we don''t need to be too concerned

    with how it works.


    To deploy the schema and:


    +   1. Import the DBI and Tangram modules. Also, import modules that contain

    schema definition and any class definitions (in our example, this is all

    stored in Objects.pm). Make sure you include an import list if you chose

    to export anything as we did with Objects.pm.

    2. Connect to the database server using DBI.

    3. Pass the database handle to $schema''s deploy method.


    The following example, deploy.pl, should be run once, to deploy the schema

    to the database:


    ```

    #!/usr/bin/perl -w

    \use strict;


    # Step One.

    #

    use DBI;

    use Tangram;

    use Tangram::Deploy;

    use Objects qw(\$schema); # Local object definitions.


    # Step Two.

    #

    my $dsn = "dbi:mysql:database=contacts";nmy $user = "bjepson";nmy $pass = "open_sesame";nmy
    $dbh = DBI->connect($dsn, $user, $pass);


    # Step Three.

    #

    $schema->deploy($dbh);


    $dbh->disconnect();

    ```'
