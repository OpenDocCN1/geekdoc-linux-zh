- img_proc: true
  md: 'Once again, the conditions that create a strong preference for open source
    are the same conditions that create a strong preference for using a scripting
    language. The application that turns on your VCR from your Web browser is a unique
    and highly differentiated service, while the critical algorithms and knowledge
    bases of double entry accounting are entirely part of common engineering knowledge.


    The example of accounting software is an interesting one, because the most successful
    commercial 4GL programs on the market today are extended accounting packages,
    under the generic name of “Enterprise Resource Planning” (ERP) applications. ERP
    applications are pathologically closed source; they are tightly controlled by
    the software vendor, difficult to implement, extremely difficult to customize,
    very expensive, upgraded infrequently, and always filled with bugs.


    Suppose you open-source that accounting package becomes popular and benefits from
    improvements made by the community. Now, your competitor also starts to use it
    without paying the developing cost and cuts into your business. Is this an argument
    against open-sourcing? [MC]


    The answer to this question is no, and the proof is the Business Process Reengineering
    (BPR) that generally accompanies the implementation of an ERP package. While the
    person doing the BPR will probably charge three hundred dollars an hour, and may
    take (upwards) a year to get to the point, what he or she will eventually tell
    you that instead of trying to customize the ERP package to fit your business processes,
    you should just change your business processes to fit the ERP package. The fact
    that companies in the same industry, in the same market segment, would spend a
    lot of time and a lot of money to achieve the same business process as their competitor
    shows that whether or not another company has the source code to your accounting
    software, the fact that the other company has the same binary version of your
    accounting software means that there is no possible competitive advantage from
    the accounting software in any form.


    One example of this type of project could fit well into a BPR model is GnuCash
    (www.gnucash.org), a personal finance and small accounting application.


    So, for those of you who are thinking of writing a closed-source application,
    consider the fact that you’re not in the business of selling software licenses,
    and you never will be. Licenses are at least twice removed from the original problem
    your software will solve; the notion of a software license is far too abstract
    for most people to grasp, let alone obey to the letter of the law. Get back to
    the original goal: solving a problem in a context. This certainly involves software,
    but is executed in the support, customization, and other'
