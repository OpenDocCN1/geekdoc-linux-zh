  md: '# All the tools and techniques you need to get started on database programming
    with Linux


    # Database Application Programming with Linux


    Linux''s popularity as an enterprise programming solution has skyrocketed thanks
    to support from major database software providers. With new software coming each
    year, and constant improvements in existing software, programmers will be able
    to develop database applications using Linux. Written by experts in the database
    and open source communities, this comprehensive, hands-on guide provides all the
    tools, techniques, and skills you''ll need to start your way to becoming a Linux
    database expert.


    Oracle, design tools and programming languages such as Java, Perl, and C. In addition,
    you''ll learn more about application frameworks, components, and find the most
    up-to-date coverage of Linux database applications to make this an indispensable
    resource.


    BRIAN JEPSON is a programmer and consultant specializing in Internet and intranet
    development. He is President and co of the SMT Computing Society. He is also the
    author of Official Guide to Mini SQL 2.0, Java Database Programming, and Windows
    NT (all from Wiley).


    JOAN PECHAM is Associate Professor of Computer Science at the University of Rhode
    Island. She is also Associate Editor for the Journal of Database Management.


    Bringing you quickly up to speed on real-world database development basics, with
    software design basics, including requirements gathering, database and user interface
    design, and Object-oriented design. You''ll then discover in discussions of database
    engines and APIs such as PostgreSQL, MiniSQL, Sybase, and


    With this book, you''ll gain a better understanding of the critical pieces of
    Linux project planning and development:


    +   * Design and specification issues

    * Database design and theory

    * UML and Patterns for object-oriented analysis and design


    You''ll learn about:


    +   * Starting with PostgreSQL, MySQL, Sybase, Oracle, and MiniSQL

    * Implementation-level differences between various databases

    * Database development

    * Administration and modeling tools

    * Programming with CORBA


    The companion Web site at www.wiley.com/compbooks/jepson features:


    +   * Example programs


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_531_0.png)


    Visit our Web site at www.wiley.com/compbooks/


    JOHN WILEY & SONS, INC.

    New York • Chichester • Weinstein

    Brisbane • Singapore • Toronto


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_531_1.png)'
