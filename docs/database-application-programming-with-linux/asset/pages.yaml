- img_proc: true
  md: 'Don''t let implementation details affect how you develop a use case. Try to
    think about the problem in isolation from issues such as whether your language
    supports multiple inheritance or how you will develop your classes.


    The format we use here is based on the expanded use case format shown in Larman
    and the use case format shown in Fowler. This format consists of the use name,
    the actors involved with the use case, a description, the reference numbers of
    the corresponding requirements, and the typical course of events.


    Don''t be surprised if the example use cases you see here above and beyond what
    the requirements state. Remember that use cases are developed to give you an enhanced
    understanding of the requirements, and part of this may involve getting into things
    in more detail. In many cases, you will find that the information you discover
    in the use case contradicts something in the requirements, and you''ll have to
    change the requirements (if it turns out the use case is correct).


    Here''s a sample use case for borrowing a book:


    # Use Case: Borrow Books


    Actors: Patron (initiator), Librarian

    Reference: 3.1.1, 3.1.1.1, 3.1.1.2


    Typical Course of Events


    | Action | System Response |

    |1. The patron brings one or more books up to the circulation desk.

    2. The librarian asks the patron to present his or her library card.

    3. The patron gives the library card to the librarian.

    4. The patron identifies the patron to the system.

    6. The librarian records the fact that each book has been borrowed by the patron.

    8. When all books have been recorded, the librarian returns the library card.

    9. The patron leaves with the book. | 5. The system acknowledges that it knows
    about patron.

    7. Calculate due date for each book and record the fact that the patron must return
    book on the due date. |


    (Continues)'
