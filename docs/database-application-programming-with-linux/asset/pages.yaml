    Climb(branch):

    Climb to the branch

    For the first sturdy adjacent branch I can reach from the branch I''m on:

    Climb(adjacent branch)

    If there are no more sturdy branches:

    Descend the tree.

    ```


    It''s worth pointing out that the algorithm for descending a tree is much simpler:


    +   Descend(tree)

    Scream loudly until an adult arrives with a ladder


    Recursion is not important because it is an efficient way of doing things—very
    often, it''s not the most efficient. In some cases, an iterative solution (discussed
    later in the chapter) may be the most efficient. Each time a function invokes
    it, a certain amount of memory must be set aside to store the current state of
    the variables in the function, as well as the arguments passed to the new invocation
    of the function (this makes recursion expensive). If your function takes complicated
    objects or data types as arguments, the memory overhead of recursion can become
    unacceptable. Furthermore, some recursive functions require exponential time to
    operate. The impact of exponential time is discussed in the next section.


    Despite the fact that recursion doesn''t always perform best, it prepares you
    for a way of thinking that is crucial to creating your own algorithms. Once you
    grasp recursion, you will find it''s easy to solve many problems with a recursive
    algorithm. Because recursive algorithms can be demanding on system resources,
    it is helpful to be able to convert recursive algorithms to algorithms that are
    based on looping constructs as for and while loops.


    In the next section, we will see an example of an inefficient recursive algorithm
    that performs much better when it is rewritten as an iterative algorithm. Bryan
    Flamig''s Practical Algorithms in C++ (Wiley, 1995) includes detailed explanations
    of how to remove recursion, when to leave recursive, and when not to leave recursive.
    Although oriented toward the C++ programmer, I think the lessons in Flamig transfer
    well to other programming languages.


    # Analyzing Time Complexity


    The discussion went something like this:


    Consultant: “I think we should optimize your system so that it performs well for
    larger data sets. What would happen if you had 10,000 rows in the table that you
    are processing? Are you certain that it wouldn''t grind to a halt?”'
  merge: -1
  pgno: 121
- img_proc: true
  md: "Customer: “I don’t care how long it takes for very large data sets. It performs\
    \ fast enough for 40 rows, I don’t think we need to think about 500 or even 1000,\
    \ alone 10,000.”\n\nHow did this story end? You're probably expecting to hear\
    \ that the customer came back to the consultant with a requirements change to\
    \ make the system handle data sets of 10,000 rows. This is not the case. In fact,\
    \ the system went from 40 to 50 rows, and in the process, went from processing\
    \ the table in 1 second to processing it in 20 minutes. What happened? To find\
    \ out, let's take a look at how to model the complexity of an algorithm.\n\nWe\
    \ can predict the number of steps an algorithm will perform on a given input by\
    \ modeling its complexity. To model the number of steps an algorithm takes, you\
    \ need to define what a step is, look at the program, and count the number of\
    \ steps. An example is a recursive algorithm that calculates a Fibonacci sequence,\
    \ a numerical sequence in which each successive number is the sum of the two preceding\
    \ numbers, such as 1, 1 (1+0), 2, 3, 5, 8, and so on. The algorithm is defined\
    \ in Skiena as:\n\n```\nF(0) = 0\n\nF(1) = 1\n\nF(n) = F(n - 1) + F(n - 2)\n```\n\
    \nIn pseudocode, it looks like the following (A, B, and C are reference points\
    \ we'll refer to when we step through the calculation):\n\n```\nFibonacci(n):\n\
    \  If n is zero, return zero (A)\n  If n is one, return one (B)\n  Otherwise:\n\
    \    Return Fibonacci(i - 1) + Fibonacci(i - 2) (C)\n```\n\nLet's walk through\
    \ the steps to calculate the third Fibonacci number, defining comparison, addition,\
    \ and subtraction each one step. Although C takes three steps by itself, it takes\
    \ total of five steps to reach and complete: Even if A and B don't return a value,\
    \ they take up one step, just for the comparison. These steps are shown graphically\
    \ in Figure 4.1.\n\n```\nF(3) = F(2) + F(1) (A+B+C = five steps)\nF(2) = F(1)\
    \ + F(0) (A+B+C = five steps)\nF(1) = 1 (A+B = two steps)\nF(0) = 0 (A = one step)\n\
    F(1) = 1 (A+B = two steps)\n```"
