    Two crucial components to success in classical software engineering are communication
    and regression testing, because they both have exponential, rather than linear,
    effects. Most of the code reuse strategies in object-oriented programming are
    based on enabling binary reuse (reusing as a component or precompiled library).
    This eliminates the need to have access to the source code you are reusing, which
    is so good because controlling source code addresses the two nonlinear problems
    of classical software engineering:


    **Program correctness.** Uncontrolled changes to source code drive quality assurance
    managers crazy: unless they know exactly which programs were changed, in what
    order, they have to run the entire suite of test cases.


    **Project management.** Giving new developers access to the source code on a project
    drives managers crazy. They have to spend days, perhaps weeks, instructing the
    new programmer in the nuances and stylistic ticks of the code base before the
    programmer can even start to be productive, which pushes the project further behind,
    which causes more developers to be added to the project, and so on.


    The typical approach to these two problems was in the makeup of the development
    team. The classical software engineering team was made up of a single, omnipotent
    software architect (the Hero), surrounded by a small group of core developers
    and a huge body of test cases, run by a faceless army of semi-automated drones
    in the testing department:


    **Ensuring program correctness.** The only way to ensure program correctness was
    to have a test case for every feature in the program. In some projects, this would
    mean a test case for every function, and with the demands of regression testing,
    the only way to make it through all of the test cases is to use drones. The drones
    would run the test case, record the output, and send it back to development if
    the output diverged from the test result in any way.


    **Project management.** You couldn''t add any new developers later on in the project,
    so you needed a project manager to constantly monitor the progress of the project.
    Without this constant monitoring, it became impossible to make up time if was
    slippage early in the project. The manager needed to know about slippage as soon
    as possible to manipulate the feature set to work around the slippage. This often
    involved splitting the project into two phases: deliver a subset of functionality
    by the original ship date, and adding the remaining features in a second phase.


    Classical software engineering remained constant from procedural programming through
    object-oriented programming. The fact that the central prob-'
