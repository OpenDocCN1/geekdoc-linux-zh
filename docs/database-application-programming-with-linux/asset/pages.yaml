  md: "To run this example, simply change to the directory containing the Chapter\
    \ 12 examples. Then, run the command perl dbigrid.pl.\n\n# Displaying Hierarchical\
    \ Data\n\nA hierarchical display, such as the tree display used in many file system\
    \ explorers, is a visual tool that involves the user and expresses the relationships\
    \ between data. There are many circumstances in which a tree display can make\
    \ the ideas in your applications clearer.\n\nFor example, if you have many tables\
    \ with cascading relationships, such as you find in customer->invoice->item tables,\
    \ the tree view provides an excellent way to explore this data. Consider such\
    \ a relationship, shown in Figure 12.5.\n\nWe can use the Tk::Tree module to make\
    \ this happen. To use Tree, you should create a scrollable tree (see Tk::Scrolled,\
    \ in the earlier section Some Widgets). Tree assembles the hierarchy by looking\
    \ at node strings that are similar to directory listings.\n\nFor example, \"food\"\
    \ could be a top-level item, while \"food/meat\" is a child node of food. Similarly,\
    \ the Tk::Tree object, you should specify the separator to use, and any options,\
    \ such as -scrollbars,-height, and -width:\n\n```\n$tree = Tree->Scrolled(\n \
    \ -separator => '/',\n  -scrollbars => 'se',\n  -height => 20,\n  -width => 30);\n\
    ```\n\nAfter you create the tree, you should pack it, and then you can add nodes\
    \ to it using the add() method. You should supply the raw node string, as shown\
    \ in the preceding code, as well as a label by the -text attribute, since the\
    \ node strings are user friendly:\n\n```\n$tree->add(\"food\", -text => \"Food\"\
    );\n$tree->add(\"food/dairy\", -text => \"Dairy\");\n$tree->add(\"food/dairy/milk\"\
    , -text => \"Milk\");\n```\n\n| Company | Invoice | Line_Item |\n| --- | --- |\
    \ --- |\n| name | inv_no | inv_no |\n| id | customer_id | description / quantity\
    \ |\n\n**Figure 12.5** The invoice schema."
