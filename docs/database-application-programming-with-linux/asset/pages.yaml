    # Using GNOME-DB


    Before we get into the details of programming with GNOME-DB, let''s take a quick
    look at some of the tools that come with it. These tools will let you test whether
    you can connect to the database with GNOME-DB, and will also introduce you to
    some of the widgets, such as the login and grid widgets.


    # The Front-End (gdafe)


    The GNOME-DB front-end program, gdafe, is a lot like some of the front-end applications
    we saw in Chapter 9, “Databases.” The main difference is that gdafe is built with
    the components that make up GNOME-DB. Let''s look at some brief instructions for
    using gdafe.


    To start gdafe, select SQL Front End from the GNOME-DB submenu of the GNOME Applications
    menu. The GNOME Applications menu usually'
