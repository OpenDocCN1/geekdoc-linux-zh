- img_proc: true
  md: '# Mod_Corba


    Mod_Corba is a plug-in module for Apache (www.apache.org) that exposes all the
    functionality of the Apache module API as a CORBA object. As a result, you can
    extend Apache using CORBA objects you develop yourself. The Mod_Corba home page
    is at www.netrinsics.com/Mod_Corba.html.


    # Summary


    In this chapter, we took a brief look at using CORBA on Linux. This chapter did
    not provide a comprehensive overview of CORBA (it would take an entire book!).
    For further studies in CORBA, we suggest that you consult the beginner’s documentation
    and reading list on the OMG’s CORBA for Beginner’s Page at www.omg.org/corba/beginners.html.
    Also, you should spend some time looking at the CORBA on Linux pages at http://linas.org/linux/corba.html.'
