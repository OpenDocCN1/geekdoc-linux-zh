    When you have finished writing the use cases, revisit each item in your requirements,
    and make sure each one has been accounted for in the use cases. Note that satisfying
    some requirements implicitly satisfies others. For example, if you look at the
    use cases and see that 3.1.1 and 3.1.2 are satisfied, you can also consider 3.1
    to be satisfied, because all of its subordinate requirements are satisfied.


    However, if we examined sections 1 and 2 of the requirements and found an actor
    that wasn''t accounted for in the rest of the requirements or the use cases, this
    would be cause for concern. In such an event, you would need to ask a domain expert
    why the actor never appears in the requirements, and alter the requirements appropriately
    (either adding requirements that relate to the actor, or removing the reference
    to the actor).


    The process we follow in this chapter involves a deeper exploration of requirements
    than we saw in Chapters 2 and 3. If you choose to use OAA&D process (such as the
    one described in this and the next chapter), you may want'
