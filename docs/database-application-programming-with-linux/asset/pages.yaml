  md: "source. in general, it is better to find a driver that is specific to the database\n\
    you want to connect to.\n\nFor example, if you use the JDBC-ODBC bridge to connect\
    \ to MySQL, then\nyour programs need to load the JDBC-ODBC driver, which is written\
    \ par-\ntially in C. Then, the JDBC-ODBC driver connects to the ODBC Driver Man-\n\
    ager, which uses the MySQL ODBC driver to connect to the database. Note\nthat\
    \ is just an example; if you wanted to connect to MySQL from Java,\nyou'd most\
    \ likely use one of the type 4 JDBC drivers available for MySQL.\n\nNot only do\
    \ you avoid an extra level of indirection by using a JDBC driver, but\nyou can\
    \ often find a JDBC driver that is written in 100-percent Java (these are\ncalled\
    \ type 3 and type 4 drivers, discussed later in this section). If you use a pure\n\
    JDBC driver, it is more likely that your applications will benefit from Java’s\n\
    cross-platform capabilities. Using a driver that is a mix of Java and native code,\n\
    such as the JDBC-ODBC bridge, presents a significant barrier to portability.\n\
    \nSun Microsystems maintains a list of JDBC drivers with Web sites\nwhere you\
    \ can download (or purchase) the drivers. This list is available at\nhttp://java.sun.com/products/jdbc/drivers.html.\n\
    \nJDBC drivers are divided into four categories:\n\n+   **Type 1: A JDBC-ODBC\
    \ bridge.** This type of JDBC driver, such as the one\nthat ships with the JDBC,\
    \ uses a locally installed ODBC Driver Manager to\nconnect to databases. If you\
    \ use this driver, you will also need to configure\nyour ODBC driver manager,\
    \ as described in Chapter 10, \"Linux Develop-\nment Tools Catalog.\\ You may\
    \ need to add some additional configuration to\nyour Java installation to make\
    \ it aware of the ODBC driver manager.\n\n+   **Type 2: Hybrid Driver.** This\
    \ is a driver that is written partly in Java and\npartially in C. These drivers\
    \ generally use a database-specific client API to\nconnect to the database.\n\n\
    +   **Type 3: 100-percent Java using a Network Protocol.** This is a JDBC driver\n\
    \ is written in 100-percent Java. However, it does not connect directly to\nthe\
    \ database server. Instead, connects to a middleware server that acts as\na broker\
    \ between the type 3 driver and the database.\n\n+   **Type 4: 100-percent Java\
    \ with Native Protocol.** This type of driver is written\nin 100-percent Java,\
    \ and uses the database server’s network protocol to\nconnect directly to the\
    \ database server. This is usually a Java implement-\ntion of the client API.\
    \ It eliminates the need to link against the C API.\n\nTable 11.2 lists information\
    \ about JDBC drivers for several databases, includ-\ningwhere you can locate the\
    \ JDBC drivers, and the name of the jar file you\nwill need to install. Note that\
    \ as version numbers change, so may the names\nof these files, please consult\
    \ the Web site listed (or the Java JDBC driver\nlist) for the latest information."
