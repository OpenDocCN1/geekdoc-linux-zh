  md: '# Event Handling


    Although those nine steps are enough to put a simple user interface on screen,
    they are not enough to build something that is actually useful. If you wrote a
    program following only those steps, it would become annoying the second you clicked
    the Close button. The frame would disappear, but the program would not exit. This
    is because the system generates an event when the frame is closed. The JFrame
    gets the event and does the right thing, but it ends there.


    It''s up to you to decide what to do when the window is closed. This is a good
    thing, because you can check to see if your program is ready to exit before you
    let the window close.


    Java handles events, such as button clicks, using something similar to the Observer
    pattern. In this pattern, the subject of the event is a Swing component, such
    as a JButton or a JFrame. The observers are classes, such as WindowAdapter, that
    you register with it. When certain events occur (such as when a window is closed),
    the subject sends a message to all registered observers. Figure 11.3 shows some
    of the methods of the JFrame and WindowAdapter objects. When you write your own
    custom event handlers, you create a subclass of WindowAdapter that overrides some
    or all of its methods. One such subclass is shown in Figure 11.3 as MyAdapter.


    To add a window listener to a Frame, follow these steps (these are also shown
    as a collaboration diagram in Figure 11.4):


    +   1. Create a JFrame object.

    2. Define a subclass of WindowAdapter, and override methods you need to, such
    as windowClosing(), then create an instance of that class.

    3. Register that class with the JFrame using addActionListener().


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_326_0.png)


    Figure 11.3 Observer pattern in Swing.'
