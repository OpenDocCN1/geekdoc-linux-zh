  md: '# CHAPTER 13


    # GNOME


    GNOME  (the GNU Network Object Model Environment) is an ongoing project that aims
    to create a complete user environment for Unix and Unix-like systems. The term
    "user environment" is a little vague. To clarify, GNOME is not a windowing environment
    (instead, it uses the X Window System); it is not a window manager (GNOME cooperates
    with several window managers). Instead, the GNOME user environment consists of:


    **Applications.** GNOME includes a variety of software applications, from complex
    applications such as personal information managers, spreadsheets, to simple applications
    such as address books, diversions, and multimedia utilities.


    **Application framework.** This part of GNOME is of most interest to us. The application
    framework includes the libraries, documentation, and utilities that you''ll use
    to build graphically rich applications that rely on features of the GNOME environment.
    Some of the GNOME libraries include Gnorba, a wrapper around CORBA; GTK+, a widget
    set and event-driven application development kit; and GLIB, a library that includes
    support for data structures such as hashes and linked lists.


    **Session management.** GNOME session management helps remember what state they
    were in when you log out. The next time you log in, the applications restores
    the desktop and applications. Web browsers can remember what document you were
    browsing, and your word processor can open the document you were editing and position
    the insertion point where you left off.'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# CHAPTER 13


    Desktop environment. The GNOME file manager resembles file managers in other operating
    systems (such as the Macintosh Finder and Windows Explorer). It not lets you browse
    files on your computer, but supports a variety of other file systems (including
    tar files and FTP sites). It also supports a document-centric user interface model
    by launching the corresponding application when you double-click on a document.


    Figure 13.1 shows a screenshot of a GNOME desktop, with the Gnumeric spreadsheet
    and the GNOME calendar applications running.


    # Getting GNOME


    Free Linux distributions include a stable release of GNOME. The unstable (bleeding-edge)
    Debian distributions give you a good way of keeping up with the leading-edge GNOME
    releases. Also, Helix Code (www.helixcode.com) offers a GNOME distribution that
    works with many features of Linux.

    Under RedHat (and RedHat-based systems, as Mandrake Linux), you can select GNOME
    RPMs during initial installation, or install the gnome-*rpm files directly from
    the CD-ROM using the rpm utility. Under Debian, use the dselect program to install
    the GNOME packages you are interested in. RedHat makes new releases available
    at http://updates.redhat.com, and new Debian packages appear when you run Update
    from within the dselect program.

    For other distributions of Linux, consult the documentation that came with the
    distribution.

    nYou can also get the latest version of GNOME by visiting www.gnome.org. At this
    site, you can find various binary releases of GNOME, as well as complete source
    code.


    # Keeping Up with the Developers


    Although not for the faint of heart (or those wishing for a stable system), nothing
    is more exhilarating than tracking the development versions youryourself. The
    best way to keep up with the latest developments is to learn about current developments,
    get the source, and compile it. To do this, you can follow these steps:


    Subscribe to mailing lists. Before you download or compile the source code, monitor
    some of the core mailing lists for a while. There is a list of mailing lists at
    www.gnome.org. You can either subscribe to the lists or use the Web page to read
    recent postings. If you are planning to build GNOME from source, you probably
    want to read gnome-dev-list to figure out what the current trends in GNOME are.'
