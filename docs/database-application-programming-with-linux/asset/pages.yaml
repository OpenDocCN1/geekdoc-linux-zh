    # Drivers and Driver Managers


    If you are writing a program that needs to connect to a database, what''s the
    best way to make that connection? Just as a graphical application needs to link
    against the X Windows System libraries (such as libX11.so,0), an application that
    needs to connect to a MySQL database needs to link against libmysqlclient.so.
    As with MySQL, every database system includes headers'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'and libraries that you can use to connect to the database. PostgreSQL has libpq,
    Oracle has libclntsh.so, and the list goes on and on.


    In general, it''s not a good idea to get involved with these client libraries
    because you will end up writing an application that only works with one database.
    Instead, you should use a database independence API such as ODBC (C and C++),
    DBI (Perl), or JDBC (Java). There are many reasons why this is advantageous:


    +   - With a database independence API, your programs are more portable to other
    platforms and database servers.

    - Every client library does essentially the same thing: It facilitates accessing,
    querying, and modifying data stored in the database. Why would you use a different
    client library for every database?


    If you use ODBC (or DBI or JDBC) to develop a MySQL application, you can turn
    it into a PostgreSQL, Oracle, Mini SQL, or Sybase application by using a different
    database driver. Your programs connect to the driver manager, which acts as a
    broker between your program and the database. The driver manager uses one of the
    drivers on your system to actually issue calls to the database. As the programmer,
    you only need to bother with the ODBC (or DBI or JDBC) API, and you don''t need
    to think about the client API for whichever database you want to connect.


    However, a database independence API, such as ODBC, frees you from concerns that
    the underlying mechanics of how your program connects to and interacts with the
    database. If you choose to use vendor-specific extensions to SQL, you may introduce
    additional complications that make your application less portable. For example,
    MySQL supports a REPLACE statement, which combines DELETE and INSERT into one
    operation. Other-database servers do not support this, and JDBC, ODBC, or DBI
    will not be able to translate your SQL.


    # ODBC


    ODBC is one of the venerable ancestors of data access APIs. It is a standard API
    for developing portable applications that need to connect to SQL database systems.
    ODBC was initially developed on the Microsoft Windows platform, but is available
    for many other platforms. ODBC applications are commonly written in C or C++.
    We won''t be looking at any ODBC specific examples in this book, but there are
    bridges to ODBC from other languages, including Java (JDBC-ODBC bridge) and Perl
    (DBI:ODBC). Also, GNOMEDB can connect to ODBC data sources, even if you don''t
    learn to program'
  merge: -1
  pgno: 298
