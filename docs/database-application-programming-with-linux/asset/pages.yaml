  md: '# Designing for a Three-Tier Architecture


    In earlier chapters, we considered the UI and database design issues in total
    isolation from object-oriented design. This allowed us to present the techniques
    that were specific to each of those activities, which will prepare you for the
    material in this chapter. These activities, however, generally don''t occur in
    isolation. In some ways, they conflict with each other. UI design often takes
    a human-centered approach, database design often takes a data-centered approach,
    and object-oriented design often takes a responsibility-driven approach. As a
    consequence, each design produces results (see Figure 8.2) that may not merge
    with each other when you need to build an application.


    The problem is artificially complicated by the fact that we looked at each design
    in isolation. In fact, it can be partially simplified by using the class diagram
    (see Class Diagrams, elsewhere in this chapter) to drive the design of the user
    interface and database. If you use this technique, you can at least guarantee
    that you will start each design process with the same assumptions.


    These issues will be explored in the following section UI and Database Design
    in Context.


    The issues involved in bridging the presentation and domain layers are relatively
    simple. However, the real problem lies in the persistence layer. Somewhere, we
    need to store domain objects in this persistence layer, and as needed, rematerialize
    them.


    # From Domain to Persistence


    Why is going between the domain layer and persistence layer so complicated? Just
    to give you a taste of why it''s problematic, let''s remember how a database represents
    a part-whole association between two entities, such as an


