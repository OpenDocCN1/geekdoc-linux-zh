  md: 'oper would go off and use 4GL tool to generate a prototype. The prototype didn’t
    have to do much, it just had to give the various people from the RAD session an
    idea of what the software would look like and how it might be used. The developers
    would then implement the functionality behind the screens and buttons, still using
    the 4GL tool, and give the application to users test. Over time, as users provided
    their feedback about the defects and required functionality of the software, the
    prototype would be refined, again and again, until users were satisfied with the
    end product.


    RAD addressed the involvement of users and management of source code very well.
    The users were intimately involved with the requirements, specification, design,
    implementation, and testing of their application. If they didn’t like the application
    they had no one to blame but themselves, and you would be amazed at how effective
    that can be in muting dissent. The source code was managed well, because there
    was, far as the developers were concerned, no source code to manage. Everything
    was done by the 4GL, so if there was a defect in the software, it was a problem
    with the tool, not the developers’ program. In addition, 4GLs are very effective
    at addressing code reuse, you are guaranteed that none of your programmers will
    be writing their own version of the quickest algorithm. The maintenance costs
    of a RAD approach are higher than in classical software engineering, but are amortized
    over the life of the project, rather incurred up front, and are offset by a decrease
    in requirements gathering and design time.


    # OO and 4GL


    While many 4GL tools, with their abstraction of source code to component palettes,
    property pages, and dragging gestures, do not fully implement object-oriented
    techniques, the 4GL tools expose, both implicitly and explicitly, OO capabilities.
    In fact, 4GL tools were the killer app for the component models we discussed in
    Chapter 5, “Object-Oriented Programming.”


    # Problems with RAD


    The problem with RAD was that development is a discipline of programming. The
    applications that you can create using a 4GL are a very limited subset of the
    applications you can create using a 3GL. As an example, using C, you can create
    C++, and using C++ you can create Visual Basic, but if you only have Visual Basic,
    you are at the end of the line. Another consequence of the dependence of 4GLs
    on 3GLs is that it takes an entire generation of applications for structural innovations
    to trickle down to the developers.'
