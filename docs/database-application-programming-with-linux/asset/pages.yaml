    # # Sequence Diagram


    The sequence diagram shows a number of events that occur in sequence, with time
    starting at the top and ending at the bottom. Here are some examples:


    **Sending a creation message.** To create an instance of a class, you need to
    send a create( ) message. Figure B.7 shows a Web browser creating a socket object.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_517_0.png)


    **Figure B.7** A creation message.


    **Sending a message.** Once you have created an object, you''ll want to send messages
    to it. Figure B.8 shows the Web browser sending a message that asks a newly created
    socket to connect to a host.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_517_1.png)


    **Figure B.8** Sending a message.'
