  md: '# CORBA Implementations for Linux


    What is a CORBA implementation? Is it a daemon? An API? A collection of tools?
    In reality, it''s a little bit of each. At a minimum, each implementation includes
    an ORB, an IDL compiler, and headers and libraries that you can use to compile
    your own applications.


    Table 15.1 lists some few CORBA implementations that run under Linux. Of these,
    we will only look at MICO and ORBit in this chapter.


    # MICO


    MICO aims for full CORBA compliance. MICO is implemented in C++, has a binding
    for C++, and has been branded as CORBA compliant by the Open-Group. Bindings are
    available for other languages, such as Perl, Eiffel, and Tcl.


    MICO can be installed under Debian systems using dselect. Under RedHat, use the
    gnorpm or rpmfind utility to locate the mico and mico-dev-packages. If you have
    trouble finding MICO for your system, visit the MICO home page (see Table 15.1).


    # ORBit


    ORBit is a standards-compliant CORBA implementation that aims for high performance.
    It is implemented in C, and the default bindings support C. Bindings are available
    for other languages, such as C++, Perl, and Python.


    **Table 15.1** Some Few CORBA Implementations


    | IMPLEMENTATION | IDL COMPILER | DEFAULT LANGUAGE BINDING | HOME PAGE |

    |---|---|---|---||

    | MICO | idl | C++ | www.mico.org/ |

    | ORBit | orbit-idl | ANSI C | www.labs.redhat.com/orbit/ |

    | OmniORB | omnidl2 | C++ | www.uk.research.att.com/omnorb/ |

    | JacORB | idl | Java | www.inf.fu-berlin.de/~brose/jacorb/ |

    | Fnorb | fnidl | Python | www.fnorb.org |

    | JavaORB | idl2java | Java | www.multiman.com/dogweb/ |

    | TAO (The Ace ORB) | idl | C++ | http://theaceorb.com/ |'
