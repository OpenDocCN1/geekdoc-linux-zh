    # Layout Managers


    Layout managers are possibly the most confusing aspect of using Swing. What''s
    worse, you''ll encounter layout managers in other places, such as the Abstract
    Window Toolkit (AWT), the basic graphics toolkit on which some of Swing is based.
    We''ll do our best to make this aspect of Java easy to understand.


    A layout manager simply controls the way components are added to a frame. Without
    a layout manager, a frame could only hold one component. There are many layout
    managers that Swing supports, and each one varies in complexity and flexibility.


