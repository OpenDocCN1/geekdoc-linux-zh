  md: '# UML Reference


    In this appendix, we''ll take a look at various bits of UML notation.


    # Class Diagram


    The class diagram shows the attributes and methods of classes, as well as their
    relationships between each other. Let''s look at some examples:


    Class. A class definition is shown as a box with the name of the class. Within
    that box, the attributes of the class appear, followed by the methods. Figure
    B.1 shows a class that represents a motorized vehicle. It can start and stop its
    engine (methods) and has a weight and maximum speed (attributes).


    | MotorizedVehicle |

    | +maximum_speed:

    +weight:

    | +start_engine( )

    +stop_engine( ) |


    **Figure B.1** A class definition.'
