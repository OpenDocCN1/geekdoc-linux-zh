    # The Wonder of Relational Databases


    While component object models and client server offer offer a great deal of flexibility
    in where and how your program executes, they don''t say anything at all where
    your program''s data is stored. Relational Databases are another programming wonder,
    but before we get into the mechanics of how relational databases work in a message
    passing environment, let''s look why relational databases are useful.


    In addition to providing access to processor cycles and register areas; operating
    systems also provide a standardized interface to disk drives and permanent storage.
    The operating system interface to permanent storage generally is implemented in
    the form of file systems, directories, and files. File systems allow access to
    multiple physical devices, directories break file systems into groupings of files
    and other directories, and files are a series of bytes of arbitrary length. Since
    file systems and directories are merely organizing constructs, we will concentrate
    on files.


    # Files as Databases


    The file interface is small. You can create files, open files, read from files,
    write to files, close files, and delete files. The file system is also powerful,
    because, although there limited number of functions you can use, there is no limit
    on how you do use the available functions. Look at how we would use a file in
    our book example.


    Being able to figure out the return date for a book at checkout is all well and
    good, but if you don''t write this information down somewhere (and hopefully somewhere
    where you can find it again), the point is moot. In addition to calling the Book.setCheckoutDate(),
    we also need to be able to record which book is being checked out, when it is
    due back, and who is checking it out.


    Here is some code:


    ```

    f = new File("/data/Library/Checkout.dat");

    f.open();

    f.write(Book.getID());

    f.write("\t");

    f.write(Book.getCheckoutDate());

    f.write("\t");

    f.write(Patron.getID());

    f.close();

    ```'
