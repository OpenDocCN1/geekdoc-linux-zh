  md: '# CHAPTER 3


    # NOTE


    When you consider software development processes, keep in mind that the process
    must be implemented in an iterative fashion if it is to succeed. That is, you
    will have to repeat parts of the processes at various times. For example, you
    might complete the step titled "involve the user," only to find that you need
    to walk through that one more time before you move on to the next step. It''s
    almost definite that you will complete the entire cycle once, and return to the
    beginning to complete the cycle again.


    The following steps summarize the example UI development process we use in this
    chapter (this process was inspired by the ideas in Theo Mandel''s The Elements
    of User Interface Design (Wiley, 1997):


    +   1. Consider the requirements. Before you consider the user interface, you''ll
    encounter the requirements for the system. Requirements are discussed in detail
    Chapter 1, "Requirements." While it''s possible that important user interface
    elements will be identified in the requirements, the user interface won''t be
    completely specified. This doesn''t give the programmer free license to create
    any user interface she wishes. Rather, it suggests that some questions need to
    be asked, and perhaps asked again.


    +   2. Involve the user. The human component of your system is the most important.
    Without the human, the software has no one to serve, no duties to perform. The
    user decides which features to use, which features are too baroque to be used
    (like the digital clock on most VCRs), and whether the system is used at all.
    The user is at the center of a system with a user interface. Because of this,
    the user needs to be consulted on the design of the user interface as early and
    often as possible.


    +   3. Follow established design guidelines. Many user interface guidelines have
    been developed by operating system developers and vendors. The best of these guidelines
    take into account issues how people react to different types of visual stimuli,
    form conceptual models of systems, and react when confronted by good and bad design.
    Established design guidelines are lines that are your name suggests: a collection
    of information that guides you in developing an interface, not rigid rules that
    take the creative process out of user interface design.


    +   4. Develop a UI prototype. The user interface (UI) prototype is a mocked-up
    implementation of the system''s user interface. A mock-up is an implementation
    that includes all of the visual components, and just enough code to let users
    move around the system. The mock-up offers none of the business logic or connection
    to the back-end database. It is necessarily quick and dirty. In many cases, you
    will find it easiest to develop prototypes in a'
