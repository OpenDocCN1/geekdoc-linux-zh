    # The Spiral Model, 4GL, and RAD


    While Raymond''s solution to classical software engineering is novel, the analysis
    of the fundamental flaws of classical software engineering is not. To rephrase
    the problem statement: Despite improvements in tools and tech-niques, software
    takes a time to develop, costs too much, and has bugs. To rephrase the analysis:
    Modifying source code is exponentially difficult and users should be programmers.
    In the mid 1990s there was a movement in software engineering, which tried to
    deal with these issues, called Rapid Application Development.


    There are two immediate functional problems with implementing a solution using
    this analysis. The first is that by large, users are users because they can''t
    or won''t be programmers. Especially in the area of productivity tools, users
    use these tools because the program makes it easier or more convenient to access
    existing functionality, not because they need functionality that does not already
    exist. The second is that modifying source code takes and creates bugs, the point
    of software engineering is to produce software, and that is not possible without
    code.


    RAD attempted to address these problems by using software tools to create and
    manage source code. They called these tools Fourth Gener-ation Languages (4GL),
    and what these tools attempted to do was enable the creation of software by nonprogram,
    using pre-built components, property pages and drag-and-drop gestures to design,
    assemble, and compile programs.


    Once these 4GL tools (Visual Basic, PowerBuilder, Oracle Forms) were available,
    it was possible to use a new model of software development. With 3GLs (the programming
    tools of classical software engineering such as C), most development followed
    a pattern called the Waterfall Model, which basically went through Requirements
    Gathering, Functional Specification, Design, Implementation, and Testing. With
    4GLs a new pattern, called the Spiral Model, emerged.


    In the Spiral Model, you start with Joint Application Design (JAD). Basically,
    you lock a collection of people from various disciplines (technical, functional,
    management) in a room together with one of oversize flip pads and a bunch of magic
    markers, and don''t let them out until they have decided what the software should
    do. Based on one of these marker designs, a devel-'
