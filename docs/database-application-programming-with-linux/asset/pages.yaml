  md: '# # CHAPTER 3


    # # User Interface Design


    > “But wait a minute, if these new devices are so wonderful, why do we need special
    dedicated staff members to make them work—power users’ or ‘key operators’? Why
    do we need manuals or special instructions to use the typical business telephone?
    Why do so many features go unused? And why do these devices add to the stresses
    of life rather than reduce them?”


    Donald A. Norman, The Design of Everyday Things


    This chapter offers you to the art of building user interfaces. While this chapter
    covers many of the issues involved with this art, it cannot claim to be a comprehensive
    text on the topic. Think of this chapter as a prelude to deeper involvement in
    user interface development.


    Although this chapter is intended as an introduction, it includes a methodology
    for developing user interfaces. While this methodology works for simple applications,
    you should consult some of the resources that are mentioned in this chapter. User
    interface design and implementation is complicated and should, in theory, require
    the involvement of programmers, human factors engineers, and graphical designers.
    Nonetheless, this chapter should open your eyes to some of the issues, and give
    you a jumping-off point for further studies.


    # # The Development Process


    When a programmer develops a user interface, there is sometimes a tendency to
    assume that the developer knows best. This can lead the programmer to develop
    the user interface without involving the user. This approach ignores the word
    user in user interface.


    To develop a user interface that makes life easy for users, developers, and innocent
    passersby, you should follow a dynamic, iterative process that involves the user
    as much as possible.'
