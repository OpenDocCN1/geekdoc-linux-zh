    # Summary


    We looked at a lot of stuff in this chapter: Swing and JDBC are two big pieces
    of Java that go together. Swing represents a massive improvement over the user
    interface components in earlier releases of the JDK. The data-driven table model
    is a great example of how Swing makes it easy to integrate your user interface
    with a data source.


    Although we took a close look at both Swing and JDBC, there is much more to both
    of these APIs. As you develop applications of your own, we suggest that you use
    the Java API reference, which is available online. You can find links to the JDBC
