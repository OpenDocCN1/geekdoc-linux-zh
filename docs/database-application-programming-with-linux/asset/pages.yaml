- img_proc: true
  md: '# Getting Started with an RDBMS


    In this section, we''ll take a brief look at some of the database systems available
    for Linux, and what you need to do to get started with them. This section is not
    meant to be a substitute for the documentation that accompanies the system, but
    is meant to help you get to the point where you can execute your first SQL query.


    # PostgreSQL


    PostgreSQL is a highly advanced, robust open source database system that is based
    on POSTGRES, a research database developed at the University of California. PostgreSQL
    runs on many varieties of Unix, and includes many of the features you would find
    in a commercial database system like Oracle or Sybase. PostgreSQL should be strongly
    considered when a high-end database is needed.


    You can download the latest version from www.postgresql.org (please use a local
    mirror site, if possible, since this will avoid network congestion on the main
    server).


    # Before You Install


    Before you install PostgreSQL, you should consider the following:


    Where to find the documentation. Most Linux distributions include PostgreSQL.
    The documentation for PostgreSQL is usually installed into /usr/doc/postgresql-x.y.z,
    where x.y.z is the version number of PostgreSQL. When you install PostgreSQL from
    source code, the documentation is installed into ~postgres/doc (where postgres
    is the name of the PostgreSQL superuser).


    Source versus binary installation. Although PostgreSQL is included with most Linux
    distributions, you may choose to install it by building it from source. The PostgreSQL
    source distribution includes a README and INSTALL file. Both read these documents
    to learn how to install PostgreSQL from source code; we don''t believe that there
    is any advantage to building it from source; whenever possible, you should install
    the version that came with your Linux distribution, or look for binary releases
    at the PostgreSQL home page.


    Upgrading an older installation. The PostgreSQL INSTALL document includes instructions
    for upgrading an existing PostgreSQL installation.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# After You Install


    After you install PostgreSQL, you should consider the following:


    **Startup and shutdown.** If your Linux distribution included PostgreSQL, it should
    be already configured to start and stop shutdown. If you installed PostgreSQL
    from source, you should look in the contrib/linux subdirectory of the source distribution
    for an initialization script that can start and stop PostgreSQL.


    For more details on how to install a script, see the Automatic Startup and Shutdown
    sections, later in this chapter.


    **Setting your environment.** If your Linux distribution included PostgreSQL,
    your environment should be set up to use it. If you installed PostgreSQL from
    source, the INSTALL document explains all the steps necessary to use PostgreSQL,
    including setting necessary environment variables.


    **Sending SQL to the server.** PostgreSQL includes an interactive tool called
    psql that you can use to send SQL commands to the server and view the results
    of queries. To log on psql, simply run the program from the Linux shell. If you
    have created a user and database for yourself (see the entries *Adding a user*
    and *Creating a database* in this section), you will be logged on and connected.
    To use psql, type an SQL statement followed by \g or a semicolon, and then press
    Enter (to exit, type \q and then press Enter).


    Here is a sample session:


    ```

    [postgres@oscorp psql]$ psql

    Welcome to the POSTGRESQL interactive sql monitor:

    Please read the file COPYRIGHT for copyright terms of POSTGRESQL


    type ? for help on slash commands

    type q to quit

    type g or terminate with semicolon to execute query

    You are currently connected to the database: postgres


    postgres=> select * from sample\g

    name | id

    -----|-----

    Brian | 100

    Joan | 110

    Ty | 120

    (3 rows)

    postgres=> \q

    ```


    **Logging on to psql as the PostgreSQL superuser.** The PostgreSQL superuser is
    usually the account postgres. In many installations, the postgres Linux'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'user does not have a password (as opposed to having a blank password, which
    means you can log on without typing a password) by default, which means you cannot
    log on to that account with telnet or at the console.


    So, you should either log on as root and use the command su - postgres, or log
    on as root and set a password for the user postgres before logging on as postgres.
    In general, it is a good idea to not set a password for this user, so that you
    have one less account to worry about from a security standpoint (in which case
    you''ll always need to use su to become the postgres user).


    Once you have su''d to or logged on as postgres, start the psql utility to issue
    commands as the PostgreSQL superuser. You can also use the -u option to have psql
    prompt you for a user name (type postgres at this prompt) and password if you
    are logged on as a different user.


    Adding a user. PostgreSQL relies on the operating system to authenticate users.
    This means if you are logged on as a user, PostgreSQL will trust you. This extends
    to processes that run as you: If a script is running under your user id, and it
    makes a connection to PostgreSQL, the PostgreSQL database server will trust that
    process as though you were.


    However, PostgreSQL doesn''t know about a user until the PostgreSQL superuser
    has run the createuser script. To add a user to PostgreSQL:


    +   1. Log on to Linux as the PostgreSQL superuser.


    +   2. Run the command createuser username (for example, createuser bjection).
    The createuser program starts running, and asks you a few questions:


    Enterter user''s postgres ID or Return to use unix user id. In general, you should
    use the Unix user id. See the createuser man page for details on this option.


    is user "username" allowed to create databases? If you want the user to be able
    to create databases, answer yes to this question.


    is user "username" allowed to add users? If you want the user to be able to add
    other users, answer yes to this question.


    Shall I create a database for "username"? If you want the user to have his own
    database (which is most likely the case), answer yes to this question.


    Once you have answered these questions, the new user is created.


    > NOTE You can use the destroyer command to delete this user and all the databases
    owned by that user.'
