  md: 'By default, PostgreSQL is very trusting of users on the local machine. For
    more details, see the section titled The Security of Initial Accounts later in
    this chapter.


    **Creating a database.** To create a database for a PostgreSQL user (only if you
    did not create a database when you created the user):


    +   1. Log on to Linux as the PostgreSQL superuser (usually the user postgres).

    2. Run the command `createdb username` (as in createdb bjpson). The createdb program
    creates the database for you.


    After this database is created, the user bjpson can connect to the database and
    issue queries by starting the psql program from the Linux shell.


    # Mini SQL


    Mini SQL is a lightweight SQL system that was originally designed as a backend
    for a suite of network management applications. It became very popular for use
    with Web applications, and has also been used in desktop application development.
    Mini SQL supports a small subset of SQL that makes large application development
    a little tricky. However, it is small and fast, which appeals to a lot of developers.


    Mini SQL is distributed in source code form, but it is somewhere between free
    software and shareware. If your organization is a school, church, or other charitable
    institution, you may use Mini SQL for no charge. Others have to pay a fee, which
    includes support.


    You can download Mini SQL from www.hughes.com.au.


    # Before You Install


    Before you install Mini SQL, consider the following:


    **Where to find the documentation.** Installation instructions are included with
    the source distribution in the files README and INSTALL. After you install Mini
    SQL, the user documentation will be in /usr/local/Hughes/doc.


    **Source versus binary installation.** Mini SQL is typically distributed in source
    code form. The source code distribution can be found at www.hughes.com.au.


    **Upgrading an older installation.** Unless you are upgrading a much older installation,
    there are not usually any extra steps that must be taken to upgrade. However,
    consult the README and INSTALL documents for details.'
