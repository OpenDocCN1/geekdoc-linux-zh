    Figure 15.5 shows how the source code files go together for the ORBit client.


    # Running the Example


    After following these steps, you should have two executables: Server and Client.
    After the instructions in the section titled Running the Example, under a Simple
    MICO Example, apply to this example, as well.


    # Summary of Developing ORBit Example


    In this example, we implemented a CORBA client and server in C. As with the C++/MICO
    example, the client finds the server by using its IOR. Here is a summary of the
    steps we took:


    +   1. Write the interface definition.

    2. Generate stubs, skeletons, and a skeletal implementation using orbit-idl.

    3. Develop the implementation.

    4. Develop and compile the server.

    5. Develop and compile the client.

    6. Execute the server and client.


    Here is a Makefile that automates the compilation:


    ```

    # C compiler and linking flags.

    #nCFLAGS = -I/usr/lib/glib/include

    LFLAGS = -LORBIT -LIIOP -LORBitutil


    # Object files for client and server.

    #nCLIENTOBJOBS = Employee-common.o Employee-stubs.o

    ```'
