  md: 'Let''s perform each of these steps:


    **Step 1.** We''ll call the implementation Employee_impl.


    **Step 2.** Here is the Employee_impl.h file. We have defined two private data
    members (_name and _salary) to hold the attributes, and four methods. The first
    method is the constructor, which needs the name of the employee as an argument.
    The second method replaces the employee''s salary by the amount specified in the
    argument, and the remaining two methods return the values of the name and salary.


    ```

    #include "Employee.h"

    // Step 2A. Inherit from Employee_skel.

    class Employee_impl : virtual public Employee_skel (


    // Step 2B. Define private data members.

    char *_name; // Name.

    CORBA::ULong _salary; // Salary.


    public:

    // Step 2C. The constructor.

    Employee_impl(const char *thename);


    // Step 2D. Define methods for each operation in

    // the interface.

    virtual void raise(CORBA::ULong amount);


    // Step 2E. Define accessor methods for each

    // attribute.

    virtual char *name();

    virtual CORBA::ULong salary();


    );

    ```


    **Step 3.** Here is the implementation Employee_impl.cc. All of the methods defined
    in Employee_impl.h are implemented here. Notice that before we assign or return
    a string, we duplicate it first using CORBA::string_dup(). This avoids returning
    a reference to a locally-allocated block of memory (which would probably cause
    your application to segfault).'
