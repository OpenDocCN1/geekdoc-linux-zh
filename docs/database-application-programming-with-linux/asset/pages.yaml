  md: '# Table 2.9 Conditional Operators


    | OPERATOR | SAMPLE | MEANING |

    | --- | --- | --- |

    | = | <expr1> = <expr2> | <expr1> must be equal to <expr2> |

    | > | <expr1> > <expr2> | <expr1> must be greater than <expr2> |

    | < | <expr1> < <expr2> | <expr1> must be less than <expr2> |

    | >= | <expr1> >= <expr2> | <expr1> must be greater or equal to <expr2> |

    | <= | <expr1> <= <expr2> | <expr1> must be less than or equal to <expr2> |

    | <> | <expr1> <> <expr2> | <expr1> must not be equal to <expr2> |

    | LIKE | <expr1> LIKE <pattern> | <expr1> matches pattern (% matches any string,
    _ matches any single character) |


    This SELECT statement fetches all the books published in the 1960s


    ```

    SELECT title, publication_year

    FROM book

    WHERE publication_year >= 1960

    AND publication_year <= 1969

    ```


    This SELECT gets all whose titles start with "The":


    ```

    SELECT title

    FROM book

    WHERE title LIKE ''The%''

    ```


    This SELECT fetches all authors whose last name matches D__k (where there are
    exactly two letters between D and k, such as Dick, Dark, or Dock):-


    ```

    SELECT first_name, last_name

    FROM author

    WHERE last_name LIKE ''D__k%''

    ```


    (The extra % takes of databases like PostgreSQL that try to match the trailing
    whitespace. See the section titled Data Type Sizes, earlier in this chapter.)


    Finally, this SELECT statement retrieves all the books published by either Grove
    or Wiley Computer Publishing:


    ```

    SELECT title

    FROM book

    WHERE publisher_code = ''0-802''

    OR publisher_code = ''0-471''

    ```'
