  md: '# CHAPTER 6


    # Software Engineering


    In the previous chapter we discussed strategies for code reuse using object-oriented
    OO languages. But why is code reuse so important? To understand the push toward
    OO, and the way in which it encourages code reuse, need to look at some commonly
    accepted beliefs in software engineering that were put forth in Frederick P. Brooks''
    The Mythical Man-Month (Addison-Wesley, 1995):


    Communication. The complexity and communication costs of a project rise with the
    square of the number of developers, while work done only rises linearly. While
    four programmers may get twice as much work done as two, the project becomes six
    times as expensive and complex, so the extra work you get out of the two programmers
    is wasted.


    Maintenance. The total cost of maintaining a widely used program is typically
    40 percent or more of the cost of developing it.


    Regression testing. A change to any piece of code that requires, in addition to
    testing the changed code, every piece of code that interacts with the changed
    code must be retested.


    Wheel reinvention. Every experienced programmer has a toolkit of algorithms and
    routines for common programming tasks. Rarely are the toolkits shared between
    programmers.


    Productivity. A good programmer is more productive than a mediocre programmer
    by a factor of 10.'
  merge: -1
