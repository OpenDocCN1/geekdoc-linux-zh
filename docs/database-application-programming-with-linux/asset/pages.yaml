  md: '# Faking It


    If your database system does not support constraints, you don''t have much recourse
    on the server side. One option is to agree not to directly access the database
    in your code, and instead, go through an access layer that uses a set of rules
    to determine whether the data is okay.


    You can encode these rules in the database as tables, or store them in some other
    fashion. The most important thing is to make sure that 1) the rules are not forgotten,
    and 2) they are easily updatable. Table 9.1 shows a set of rules that specify
    constraints on various tables.


    Then, instead of going directly through an API such as ODBC, you can write a data
    access layer that sits between your program and an API such as ODBC. Here is some
    PDL (see the section PDL, in Chapter 4, “Construction”) describes how this is
    handled in the data access layer (with an SQL statement as input). You could use
    this to write an application in a language such as Perl or Java:


    ```

    Open the rules table.

    For each row in the rules table where table_name is ''address'':


    Examine the value in the SQL statement that corresponds to

    rules.column_name.


    If the value is not at least as wide as minimum_size:

    Display an error


    If no errors were encountered:

    Submit the SQL statement to the ODBC, JDBC, or DBI driver.

    ```


    Another advantage of this rules-based approach is that you can use the same rules
    to develop quality checks for your system. For a given table, you could write
    a program that interprets the rules and applies them to the database. Here is
