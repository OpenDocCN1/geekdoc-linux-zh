  md: '# User Interface Services


    GNOME relies on a number of libraries to support the user interface. Let''s look
    at some of these libraries.


    GTK+. Gimp Toolkit (GTK+) is a graphical user interface kit that was originally
    designed for GIMP, the GNU Image Manipulation Program. GTK+ is also the cornerstone
    of the GNOME user interface.


    On the surface, GTK+ appears to be a collection of widgets (such as windows and
    user interface controls). Upon inspection, you will see that it is a generalized
    object-oriented framework for GUI development in C and other languages. GTK+ also
    provides support for object-oriented features (such as polymorphism and inheritance)
    in C. Finally, you don''t have to use C to program with GTK+. There are bindings
    for many other languages, including C++, Python, and Perl.


    More information on GTK+ can be found at www.gtk.org.


    libgnome. The core GNOME libraries (a package called gnome-libs) include a library
    called gnomeui. This library includes a number of GNOME-specific widgets (such
    as GnomeCalculator, GnomeCanvas, and GnomeEntry), utility functions for working
    with those widgets, and a top-level application called GnomeApp.


    libblade. This library works with the Glade interface builder to separate the
    presentation of the user interface from the core application logic that backs
    it. libblade loads the user interface definitions at run-time, using XML-based
    format to represent user interface elements. You can either edit these files by
    or use Glade to design the user interface. Since libblade loads the user interface
    definition at run-time, you can customize the user interface without recompiling
    your application.


    # Distributed Object Services


    GNOME also has a number of CORBA-based features you can use to develop distributed
    objects or access objects that others have written.


    GNORBA. This library is responsible for making CORBA easy to use from GNOME. It
    takes care of locating and activating the service that acts as a CORBA object
    directory (GOAD), integrating ORBit with the GTK+ event loop, and initializing
    GNOME applications that use CORBA.'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'GOAD, GOAD is the GNOME Object Activation Directory, a CORBA service that manages
    a master list of all CORBA services on your computer, and activates them on demand.
    With GOAD, you can get a list of services, activate a service by name, or register
    a newly created service with the GOAD server.


    # Data Access Services


    GNOME-DB is a database application framework for GNOME. It takes care of managing
    connections to databases and offers a collection of widgets that are data-aware
    (you, can, create a pop-up menu that gets its options from a database query).
    We''ll look at GNOME-DB in detail later in this chapter.


    # GNOME Programming


    It is true that most of GNOME is written in C and most of the API is exposed through
    C bindings, you don''t have to use C to write GNOME applications. Other languages,
    such as C++, Python, and Perl, enjoy a varying degree of support in GNOME. Perl
    may be the best-supported language (after C); Perl modules exist for GTK+, Glade,
    and most of the GNOME API (including ORBit and GOAD). C++ and Python can work
    with the GNOME and GTK+ API, but at the time of this writing, neither of them
    have specific support for GOAD (although there are Python bindings for ORBit,
    and GOAD support is probably not far off).


    In this section, we''re going to start with a simple introduction to GTK+, and
    then work our way to some of the more interesting and useful parts of GNOME. Although
    alternatives to C exist for GNOME developers, we''re going to look exclusively
    at C in this chapter. You''ll be surprised how GTK+ and GNOME converge to make
    the sometimes tedious C language a easier to deal with!


