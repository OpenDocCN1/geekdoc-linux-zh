  md: 'Part-of relationships. There are two ways that we can model the relationships
    between parts and whole. The first is aggregation, which is the simplest form:
    It says that one thing is the part of another. If the whole were to go away, the
    part would still exist. Figure B.4 shows an example of aggregation: A Person is
    a member of a Club. If the club were dissolved tomorrow, the Person would still
    exist. The hollow diamond indicates that a club aggregates its members.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_516_0.png)


    **Figure B.4** Aggregation.


    Composition, on the other hand, signifies a stronger relationship. In composition,
    if the whole is deleted, the part goes with it. Figure B.5 shows the relationship
    of a book to its chapter. The chapter is an intrinsic part of the book, and if
    the book is destroyed, the chapter goes with it. The filled diamond indicates
    the composite nature of the relationship.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_516_1.png)


    **Figure B.5** Composition.


    **Multiplicity.** In some cases, you may want to show how many of one thing is
    associated with another. Consider Figure B.6, in which exactly one (signified
    by 1) book is associated with many (signified by *) chapters.'
  merge: -1
