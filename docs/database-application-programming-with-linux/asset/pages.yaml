  md: '# What about the Data?


    All of our use cases were derived from activities that were explicitly stated
    in the requirements. However, section 2 of the requirements discuss the data that
    the system needs to maintain. Common sense would suggest that we need, the ability
    to add, edit, or delete this data! A more complete specification would have included
    a description of how a patron signs up for a card, how books are entered into
    and removed from circulation, and how this information is kept up to date. From
    these requirements, we develop use cases that handle adding, editing, and deleting
    a patron or a book. For the purposes of keeping the example simple, our requirements
    do not address these issues.


    to defer database and user interface design until you have done an initial class
    diagram, since this artifact can be used as the basis of a database or user interface
    design. For simple systems, the analysis and design techniques in Chapters 2 and
    3 should be sufficient. We''ll discuss design issues in more detail in the next
    chapter.


    # Use Case Summary


    **Actors.** When you choose the actors for a use case, think of everyone who is
    involved. You should try to choose one actor who is the initiator. Think about
    how the process is played out in the real world, and ask yourself, "who started
    it?"


    **Reference.** This is a cross-reference to the formal requirements. The reference
    serves two purposes: You can use it to find out where the use case has its origins,
    and you can also use it as a handy reference when you are verifying that all the
    requirements have been accounted for.


    **Typical course of events.** This will tap your storytelling skills. You need
    to think about how the process should be played out. If you think of exceptions
