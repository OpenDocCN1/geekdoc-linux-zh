    # Reduce User’s Memory Load


    Human memory is tricky—we can store tiny bits of data in short-term memory, but
    we can retrieve it rapidly and reliably. We can store enormous amounts of data
    in long-term memory, but we cannot retrieve it rapidly or reliably. We spend often
    long periods of time trying to remember something that is in long-term memory,
    and sometimes we forget things. Reminders and cues can help get things out of
    long-term memory.


    Mandel’s second golden rule of user interface design asks us to do everything
    we can reduce the user’s memory load. Taking into account the constraints of human
    memory, Mandel offers the following principles to reduce memory load:


    Relieve short-term memory. Don’t require users to jot down notes while they are
    using your application. For example, don’t give the user a code number and require
    the user to supply that code number a few screens later. Whenever possible, carry
    as much information through different stages of the system. When this is not possible,
    allow users to back up nondestructively (as a wizard, shown in Figure 3.1, does
    with its Next and Back buttons), or use cut and paste to move important information
    around.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_85_0.png)


    **Figure 3.1** Using a wizard to add a new customer.'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'Rely on recognition, not recall. Don’t tax your users’ long-term memory by
    asking them to remember things like airport codes and state abbreviations. Provide
    pop-up and pull-down menus to select lists of data.


    Visual cues. Use as many cues as possible to let the users know what state are
    in (such as creating a new record versus editing an old record). Use elements
    such as status bars, scrollbars, and enabled/disabled buttons (like a bold or
    italic text in a word processor) to let the users know what''s happening. Make
    it possible for them to take a break, come back to their computer, and know exactly
    where they left off with a glance at the screen.


    Provide defaults, undo, and redo. If you let users customize different aspects
    of your application, give them a way to return to the defaults. That way, if you
    choose an unreadable default font or wildly contrasting colors, they can return
    to the way they were. Provide as many levels of undo as possible, and include
    a redo option that reverses the action of the undo. And let your users make some
    changes, and then step back and forth through the changes they made to figure
    out what is going on.


    Interface shortcuts. Provide keyboard equivalents that are consistent with other
    applications. For example, Ctrl+C is a common shortcut for copying, and Ctrl+V
    is a common shortcut for pasting. Look at other applications or a style guide
    for common shortcuts, and adopt them if they are standard for your application
    environment.


    Promote an object-action syntax. Let the users select an object (such as a file
    or a bunch of text), and then right-click to see a list of actions that are appropriate
    for the object. This way, users don’t need to remember what actions are applicable
    to a given object.


    Use real-world metaphors. Users already know how to use folders, trash cans, and
    recycling bins. Use metaphors, such as dragging a document to a folder, for common
    actions.


    Progressive disclosure. Don’t dump all the features of your application in the
    users’ laps. Put common tasks at their fingertips and let them look around a bit
    for the less common features. As they master the simple tasks, they will naturally
    investigate and learn more about the complex tasks if needed.


    Promote visual clarity. Don’t clutter your screen. Group controls that are conceptually
    related. Learn about techniques for visual organization so users can find what
    they need without getting a headache. Edward Tufte’s The Visual Display of Quantitative
    Information (Graphics Press, 1992) and Envisioning Information (Graphics Press,
    1990) include ideas applicable to any graphical presentation of information.'
