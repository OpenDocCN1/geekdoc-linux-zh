  md: '# Overpowered by Minutia?


    Why does the word System have a colon in front of it? Why is it underlined?

    In the Conceptual Model, we looked at concepts, whose nearest equivalents on the
    implementation level are classes. In the System Sequence Diagrams, we are modeling
    behavior, and we discuss this behavior in terms of concrete entities: objects.
    The underlining and colon in front of the word System specifies an unnamed (anonymous)
    object of the System class. If we gave it a name, such as my_system, it would
    be represented as my system: System.


    # Developing the Diagrams


    To develop the system sequence diagrams, you can follow this simple method, adapted
    from Larman


    **Represent actors and the system.** For each diagram, put the actor at the left
    and the system at the right. The actor will generate events that the system responds
    to. Don''t get fancy at this point; you should not try to show the domain objects,
    such as a Patron or Book. Just show the system as a black box.


    **Illustrate each event.** Examine the use cases for system interactions. Try
    to group things at the level of intent, not at the level of how things should
    be carried out. For example, you should not make loanBook() and setDueDate() two
    separate system operations. Instead, you can assume that loan-Book() takes care
    of setting the due date. This will be explicitly stated in the contracts, which
    we will explore in the next section.


    **Annotate each event.** You might find it helpful to decorate the system sequence
    diagrams with text from the use case. It makes it easy to see what part of the
    use case system operation is taking responsibility for. This will help you write
    the contracts.


    Figures 7.7 through 7.10 illustrate the remaining use cases.


    # Contracts


    At this point, we are almost ready to proceed to the design of the system. Before
    we can do this, we need to determine what the responsibilities of the system are.
    Contracts, which were originated by Bertrand Meyer in the Eiffel language, offer
    us a way to describe what those responsibilities are, without having to specify
    how they are carried out. The format we use for contracts in this chapter is based
    on the format presented by Larman.'
