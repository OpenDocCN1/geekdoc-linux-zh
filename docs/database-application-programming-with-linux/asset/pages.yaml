    # Creating Tables


    To create a table, use the CREATE TABLE statement, which is a straightforward
    translation of the information we put into the data dictionary in the previous
    section. Before you construct a CREATE TABLE statement on your own, check Table
    9.7, the Data Type Cross-Reference Table in Chapter 9 that shows the data types
