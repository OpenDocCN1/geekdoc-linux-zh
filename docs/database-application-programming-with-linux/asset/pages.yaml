    # Perl/Tk


    Perl/Tk is a collection of object-oriented modules that bring the Tk toolkit to
    Perl. Tk (www.scriptics.com) is the graphical user interface toolkit that is distributed
    along the Tcl language. Perl/Tk is based on source code from the Tcl/Tk distribution,
    but does not need an existing installation of Tcl/Tk in order to function.


    You can use Perl/Tk to develop applications with a sophisticated graphical user
    interface. Perl/Tk has an intuitive object-oriented syntax for building interfaces,
    and includes a good selection of graphical components you can use in your applications.


    # Installing Perl/Tk


    Perl/Tk distribution is contained in the Tk archive on CPAN. In this chapter,
    the section titled CPAN explains how to install an optional module with Perl.
    Use these instructions to install Tk, which is a large archive containing many
    modules related to Perl/Tk. To get documentation on Perl/Tk, you should start
    by issuing this command at the shell prompt:


    ```

    perldoc Tk::UserGuide

    ```


    You may also find it interesting to look at the interactive widget demo. This
    demo is contained in a script called widget, which is installed on either /usr/bin
    or /usr/local/bin. Run this script by logging on to X and using the command widget
    at a shell prompt. Because you can view demos with their source code, the widget
    demo is a powerful learning tool.


    # Creating a Simple Form


    As many with other user interface tool kits, Tk arranges components hierarchically.
    A top-level window contains all the components, such as buttons, text fields,
    and frames. Some components, such as a frame, can contain other components. Figure
    11.2 in Chapter 11, "Java, Swing, and JDBC," shows the'
