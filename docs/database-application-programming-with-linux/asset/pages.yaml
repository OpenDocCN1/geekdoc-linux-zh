  md: '# GTK+ versus OO Toolkits


    Feature for feature, GTK+ compares very well with object-oriented graphical toolkits
    like Java''s AWT. But how does it differ? Let''s take a quick look:


    **Use macros for explicit casts.** In an object-oriented language, such as Java,
    polymorphism is handled automatically. For example, the java.awt.Frame (a top-level
    window class in Java''s AWT) is a subclass of the java.awt.Container (which can
    contain other objects). If you have a Frame named myFrame, you can invoke Container''s
    add() method with:


    ```

    myFrame.add(myWidget);

    ```


    and traverses the inheritance tree to find the function in java.awt.Container.
    GTK+, on the other hand, cannot do this, because C does not support OO constructs.
    Instead, you need to convert a GtkWindow object to a GtkContainer object with
    the GTK_CONTAINER macro (this is essentially an explicit cast):


    ```

    GTK_CONTAINER(window);

    ```


    GTK+ supplies similar macros for all widgets and objects in the hierarchy.


    **No object methods.** C does not support encapsulating behavior within objects,
    so you can''t invoke a window.add() method. Instead, you need to call a function
    (gtk_container_add) that takes a container and a widget as an argument:


    ```

    gtk_container_add(GTK_CONTAINER(window), label);

    ```


    Namespaces. C does not support the notion of namespaces. For example, in a language
    like Perl, you might create a new Window with:


    ```

    $window = new Gtk::Window();

    ```


    In C, however, you must say:


    ```

    window = gtk_window_new();

    ```


    In Perl, the :: functioned as a qualifier that separates namespaces: the new()
    method resides in the Gtk namespace. In C, the _ replaces the ::, and separates
    identifiers—there is no implication that a method called new() exists in a separate
    package. All identifiers live in the same namespace, and the gtk_window component
    of the name is an attempt to ensure that the function name is completely unique.'
  merge: -1
  pgno: 408
