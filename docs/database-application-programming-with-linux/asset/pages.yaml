  md: '# Automatic Startup and Shutdown


    How do you configure Linux so that it starts the database when the computer boots
    and shuts the database down when you shut down the computer? Some database systems
    make the necessary changes to your operating system files, but we''ll review these
    changes.


    Modern versions of Linux, such as RedHat, Debian, and others, use an initialization
    scheme inherited from Unix System V. Under this scheme, the system has up to seven
    runlevels, and as we like to think of them, states of consciousness:


    +   Runlevel 0. Halting. Nothing is happening, no programs are running.


    +   Runlevel 1. Single-user mode. This is useful for performing system maintenance
    that requires root to be the only user logged on.


    +   Runlevel 2. Multiuser mode, with no NFS.


    +   Runlevel 3. Full multiuser mode.


    +   Runlevel 4. Unused.


    +   Runlevel 5. Boot up and start the X Windows System.


    +   Runlevel 6. When the system enters this mode, it reboots.


    When the system boots up, it enters the default runlevel specified in /etc/initab
    (that you can imagine why you might not want to specify 0 or 6). As it enters
    a runlevel, the system looks in a directory that corresponds to the new runlevel
    (rc0.d, rc1.d, rc2.d, rc3.d, rc4.d, rc5.d, or rc6.d). For RedHat systems, these
    directories are found in /etc/rc.d. For Debian systems, these are found in /etc.


    The rc.d directories contain a whole bunch of scripts whose names follow the format
    SnnName or KnName, where nn is a number from 00 to 99. The S prefix indicates
    that the operating system should run script with the argument start, and the K
    prefix indicates that the operating system should run the script with the argument
    stop.


    K scripts run first, followed by the S scripts. As you can imagine, there are
    generally more K scripts in rc0.d and rc6.d than there are in the other directories.
    The scripts are usually symbolic links from files in the /etc/init.d (Debian)
    or /etc/rc.d/init.d (RedHat) directories (the init.d directory should contain
    all the scripts needed to stop and start processes). Here is an example'
  merge: -1
  pgno: 279
- img_proc: true
  md: "```\n#!/bin/sh\n\ncase \"$1\" in\n  start)\n    echo Hello!\n    ;\n  stop)\n\
    \    echo Goodbye!\n    ;\n  *)\n    echo \"Usage: $0 {start|stop}\"\n    exit\
    \ 1\nesac\n\nexit 0\n```\n\nIf you created a symbolic link from /etc/init.d/hellogoodbye\
    \ to /etc/rc3.d/S99hellogoodbye, then, the system is coming up:\n\n+   - The system\
    \ will invoke this with the command S99hellogoodbye.\n- The script will say \"\
    Hello!\"\n\nIf you created a symbolic link from /etc/init.d/hellogoodbye to /etc/rc0.d/K01hellogoodbye,\
    \ then, as the system is shutting down:\n\n+   - The system will invoke this with\
    \ the command K01hellogoodbye.\n- The script will say \"Goodbye!\"\n\n# RedHat\
    \ Users\n\nRedHat systems use the /var/lock/ directory to keep track of which\
    \ processes have been started. It is vitally important that you use this feature\
    \ correctly. If you do not, your processes will be started but not stopped. If\
    \ you bring the system down to single-user mode or reboot without stopping the\
    \ database processes, they may die an abrupt death, leaving your database in a\
    \ corrupt state.\n\nTo use this feature, you need to do two things:\n\n+   - When\
    \ the script is started, touch /var/lock/subsys/script_name.\n- When the script\
    \ is ended, remove /var/lock/subsys/script_name."
