  md: '# Binary Packages


    See the GNOME-DB home page for binary packages and installation instructions.


    # Source Code Snapshots


    Although GNOME-DB was in prerelease form when this chapter was written, the source
    code snapshots are relatively stable, since the source code snapshots are released
    when various milestones are reached in development. The source code archives should
    be available on the www.gnome.org/gnome-db/download.html page, but check the GNOME-DB
    home page for links.


    # GNOME-DB CVS Archive


    If you are on the cutting edge, you might want to get the latest version of GNOME-DB
    out of the CVS archive. If you do, you should subscribe to the GNOME-DB mailing
    list, and try to keep your CVS archive up to date. During the preparation of this
    book, we kept our local copy of the repository up to date on a daily basis, but
    we only did complete builds of GNOME-DB once a week, or when a major feature was
    added. We knew about new features we because we kept an eye on the GNOME-DB mailing
    list.


    Instructions on subscribing to the mailing list can be found at www.gnome.org/gnome-db/mailing_lists.html
    or www.gnome.org/mailing-lists/index.html.


    To get GNOME-DB out of CVS (this procedure may vary), visit the GNOME-DB home
    page for complete details:


    +   1. Start up a shell by logging in, or starting a terminal (as xterm) under
    the X Window System environment variable to :server:anonymous@anoncvs.gnome.org/:cvs/

    2. Set the CVS out of CVS

    3. Log in to the repository with the command `cvs login` when prompted for the
    password, press the Enter key, since the password is blank.

    4. Use cd to change the directory you want to copy the repository to.

    5. Issue the command `cvs -z3 checkout gnome-db` This copies the repository to
    your machine, using compression to save bandwidth (don''t use an argument greater
    than 3 to -z, it puts stress on the server''s CPU).

    6. The GNOME-DB repository will be created in a directory called gnome-db.'
