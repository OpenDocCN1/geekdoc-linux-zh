    Each database uses a different syntax for the outer join:


    MySQL MySQL supports the SQL 92 standard LEFT OUTER JOIN syntax. In this SELECT
    statement, book is on the left side of the outer join, and publisher is on the
    right. Notice that publisher is not specified in the FROM clause and that no WHERE
    clause is needed, since this is all specified in the LEFT OUTER JOIN clause:


    ```

    SELECT book.title, publisher.publisher_name

    FROM

    LEFT OUTER JOIN publisher

    ON book.publisher_code = publisher.publisher_code

    ```


    Sybase. To construct an outer join in Sybase, an asterisk (*) to the left or right
    of the equal sign in the join. To make the leftmost term the outer component,
    the asterisk should point to the leftmost term, as in *= To make the rightmost
    term the outer component, the asterisk should point to the rightmost term, as
    in *= There is a left outer join in Sybase that serves all the data in the book
    table, even if the publisher_code is NULL:


    ```

    SELECT book.title, publisher.publisher_name

    FROM book, publisher

    WHERE book.publisher_code *= publisher.publisher_code

    ```


    Oracle. Oracle does things slightly differently. Instead of marking the outer
    component, you mark the inner component. Further, the marking appears to the right
    of the component as a (+), as shown here:


    ```

    SELECT book.title, publisher.publisher_name

    FROM book, publisher

    WHERE book.publisher_code = publisher.publisher_code (*)

    ```'
