  md: '# Patterns for Object-Oriented Design


    In the previous chapter, we used contracts to get a sense of the responsibilities
    that a system will need to fulfill. The next step is to identify how those responsibilities
    are assigned.


    Patterns, which were first defined in Christopher Alexander''s Pattern Language
    (Oxford University Press, 1977), are solutions to recurring architectural problems.
    In the 1980s, Kent Beck and Ward Cunningham applied Alexander''s concepts to object-oriented
    design, and presented their results to the world. Patterns were highly popularized
    by Gamma, Helm, Johnson, and Vlissides'' Design Patterns: Elements of Reusable
    Object-Oriented Software (Addison Wesley-Morgan, 1995).


    The primary function of a pattern is to pass on knowledge from experts to their
    fellow practitioners. Patterns distill experience into a form that can be easily
    applied to new instances of familiar problems.


    Although patterns have been written to solve many problems, including how the
    design process itself should be carried out, we will look at a specific type of
    pattern in this chapter, design patterns. Design patterns are immensely helpful
    when you need to decide how responsibilities are assigned (Larman, 1998). Design
    patterns are not algorithms, reusable code, or data structures. They are descriptions
    of objects and collaborations that you can apply in a specific context.


    # Elements of a Pattern


    A minimalist description of a pattern consists of:


    +   **Name.** This is a descriptive name that should communicate a lot of information
    about the pattern. The idea is to increase your vocabulary with words that communicate
    complex concepts quickly. The problem describes the context in which the pattern
    should be applied.


    +   **Solution.** The solution describes the objects, relationships, responsibilities,
    and collaborations that are part of the pattern. It is essentially an abstract
    template that can be applied to the problem in context. You can superimpose the
    solution on your problem to light the way toward an implementation.


    There are numerous variations on this formalized description.


    # Observer


    Suppose you are building a system to handle auctions. In any given auction, you
    have one object to represent the Item, and any number of objects to represent
    the'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'Bidders. When the price of the auction changes, how do you notify each Bidder

    of the new price without coupling the Bidders too closely to the Items?


    The Observer pattern (Gamma) can be applied in a situation such as this.

    This pattern can be applied where you want changes in one object (the sub-

    ject) to result in notifications sent to other objects (the observers).


    In the Observer pattern, you have one subject and many observers. A typical

    way to handle this is to define a Subject and Observer class, and let your

    implementations inherit from those classes.


    The following is a more formal description of the Observer pattern.


    # Problem


    How do we define one-to-many relationship between objects in such a way

    that changes in one object result in notification to the others (without unnec-

    essarily increasing coupling)?


    # Solution


    The Subject. The Subject class should define something similar to the follow-

    ing methods:


    | METHOD | PURPOSE |

    |---|---|n| addObserver(Observer) | Attach an observer |

    | removeObserver(Observer) | Remove an observer |

    | notify() | For each observer, send subjectChanged() message |


    You can define a class, such as Item, to be a subclass of Subject. This way,

    Item inherits the methods just described. Through polymorphism (see

    Chapter 5, "Object-Oriented Programming"), we can say that an Item is

    also a Subject.


    The Observer. The Observer class only needs a subjectChanged() method.

    One way to implement this is to define a class, such as Bidder, as a subclass

    of Observer.


    It''s up to you to define how the Bidder (or any Observer) will respond to the

    subjectChanged() message. More likely than not, the Observer will invoke

    one of the subject''s methods, such as getPrice().


    What''s the point of all of this observing? The Observer pattern decreases cou-\pling:
    The Observer (Bidder) needs to know about the Subject (Item), but the'
