- img_proc: true
  md: '# Why Have a Process?


    “I hate to say this . . but this place is getting to me. I think I''m getting
    the Fear.”


    "Nonsense,” I said. . . now that we''re right in the vortex, now want to quit.”
    I grabbed his bicep and squeezed. “You must realize that we''ve found the main
    nerve.


    "I know,” he said. “That''s what gives me the Fear.”


    > Hunter S. Thompson, “Fear and Loathing in Las Vegas”


    Writing heaps of notation without a beneficial process becomes an annoying activity
    that is performed just to add to the mounds of paper in PHB''s (Pointy Haired
    Boss, of Dilbert) office. By beneficial process, we mean a process that helps
    something or someone. In the case of processes that go hand in hand with UML,
    that something is your system, and that someone is you (and your fellow programmers
    and successors). If you use UML within a beneficial analysis and design process,
    you could write better code, shorter days, and significantly reduce maintenance
    costs.


    The importance of UML is that it lets us model things. The UML User Guide by Booch,
    Jacobson, and Rumbaugh (Addison-Wesley,1998) starts out by exploring the reasons
    that engineers must model things before they build them. Hopefully, discussion
    will reassure developers who have been burned by too many documentation efforts
    whose artifacts gather dust on a shelf. Some, UML diagrams look like flowcharts
    from age of big iron, and they are understandably suspicious.


    In fact, UML is significantly different from other notations such as flowcharts.
    UML diagram can show the relationships between classes, and how those classes
    interact. When you use patterns (which we will discuss in the following chapter),
    you''ll organize your classes in ways that are instantly familiar to other developers
    who are familiar with common design patterns. UML succeeds (in combination with
    patterns) by communicating vast quantities of information at a glance.


    Many systems have sections of code that may as well marked with “here are dragons”
    and “abandon all hope, ye enter here.” These are the sections that the people
    who joined the team toward the end of development (or at the beginning of support)
    never had to learn about. These are the sections that strike fear into the hearts
    of the people who support the system. These people will never learn about that
    part of the system, because there''s this dude, you see, who works in France or
    something now, but we can call'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'him any time (sure it costs the company $250 an hour), and he''ll fix a bug
    in that part of the system. Well, I''ve got news for you, Sonny Jim! Your man
    in France just finished clown college and has joined a travelling circus! He''ll
    never fix a bug in that code again!


    In this chapter, we''ll look at concepts and techniques that can be used with
    UML to circumvent many of the problems associated with complex software projects.
    One of the most amazing results is that you''ll be able to communicate many things
    about the system to programmers who are unfamiliar with it.


    This is not your great-grandmother''s flowchart!


    # Terminology


    Instead of using jargon and terminology that is fully compliant with a particular
    version of a process or notation, we''ll use terms that are appropriate for an
    introductory discussion, in the hopes that they will communicate the basic information
    to you. This should not suggest that there is no reason to pursue and widely accepted
    terms. If you think of this chapter as an introduction to the wider world of software
    engineering processes and notations, you will learn more, and become more familiar
    with accepted terminology as you make use of standard references in this area.


    In this chapter, we''ll perform an analysis of a problem that is stated in a set
    of formal requirements. We''ll use UML to produce artifacts (diagrams and associated
    documents) that communicate this analysis.


    First, we''ll look at the analysis phase of the process, a phase that enhances
    your understanding of the problem. In the next chapter, we''ll look at some ideas
    that will help bridge the gap between analysis and design, and move on to the
    design phase of the lightweight process. When we have completed analysis and design,
    we will discuss how to develop code with UML artifacts as a guide.


    # Using UML in Object-Oriented Analysis


    The analysis phase of the process is concerned with enhancing your understanding
    of the problem domain (the area or realm that the problem affects). To that end,
    analysis seeks to model the problems from the viewpoint of a domain expert, someone
    who understands everything about the problem (usually someone from your user community).'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Each part of the process will be presented by example, and the key points will
    be summarized at the end. Within the analysis phase of the process, we will look
    at how to generate the following artifacts:


    **Use cases.** Narrative descriptions of interactions involving the system that
    illustrate and expound upon the requirements.


    **Conceptual model.** A static diagram that shows the relationships between concepts
    within the problem domain.


    **System sequence diagrams.** A visual representation of individual use cases
    that define the operations the system must supply.


    **Contracts.** A textual description of the responsibilities of each operation
    in the system.


    One purpose of these artifacts is to enhance your understanding of the problem,
    so you can build the right system (see Chapter 1, “Requirements\”). This understanding
    will be used in the design stage to assign responsibilities to objects and determine
    the relationships between objects.


    Figure 7.1 shows the relationships between the artifacts we will examine in this
    chapter.


    In this chapter, we''ll base all the examples on the requirements found in Chapter
    2, “Database Design.\”. If you did not read Chapter 2, you should take the time
    now to read the requirements, which can be found in the section titled Use the
    Requirements.


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_164_0.png)


    Figure 7.1 Relationships between design artifacts.'
