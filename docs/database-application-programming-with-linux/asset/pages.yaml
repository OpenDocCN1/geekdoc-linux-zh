  md: '```

    1 CREATE OR REPLACE TRIGGER line_item_check

    2 BEFORE DELETE ON invoice

    3 FOR EACH ROW

    4 BEGIN

    5 DELETE FROM line_item

    6 WHERE line_item.inv_no = :old.inv_no;

    7 END;

    ```


    **Line 1.** CREATE OR REPLACE TRIGGER creates a trigger with the specified name.
    If a trigger with the same name already exists, it is replaced (overwritten).


    **Line 2.** This specifies that this trigger must execute before the delete occurs.

    **Line 3.** This specifies that this trigger should be fired for each row that
    is deleted (one SQL delete statement may affect many rows).


    **Lines 4 and 7.** The BEGIN and END signal the start and finish of the trigger
    itself.


    **Lines 5 and 6.** This is a DELETE statement that removes the line items. *old*
    is the name of the pseudo-table that contains the row being deleted from invoice.
    In this example, we use it as a table name or alias, using the SQL syntax table.column
    (.old.inv_no).


    This assumes that you don''t have a referential integrity constraint such as the
    one shown in the previous section. Now, when you delete an invoice, all of its
    line items are deleted.


    # NOTE


    Cascading deletes with caution (or not at all), since a cascading delete can ripple
    through a parent-child hierarchy, deleting lots of data!


    # Cascading Deletes with Sybase Triggers


    Sybase''s implementation of triggers is very similar to the Oracle implementation
    shown earlier. However, where you could simply refer to a row in the old table
    with tablename under Oracle, you need to be more explicit under Sybase. Sybase
    creates a temporary table called *deleted* that contains all the rows that are
    about to be deleted from.


    So, instead of using: DELETE FROM child WHERE child_table.foreign_key = :old.primary_key,
    you need to include the deleted table in the FROM clause of a query. An easy way
    to do this is to use a subquery with the IN keyword:


    ```

    1 CREATE TRIGGER line_item_check ON invoice FOR DELETE

    2 AS

    3 DELETE FROM line_item

    4 WHERE line_item.inv_no IN (SELECT inv_no FROM deleted)

    ```'
