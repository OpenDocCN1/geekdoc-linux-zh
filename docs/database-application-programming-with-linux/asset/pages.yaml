  md: '# DBI and Perl 367


    related tables from the invoice schema, we''ll create a level for each table,
    as

    shown in this description of the basic algorithm:


    +   For each company:

    - Add a node to the tree labeled with the company name.

    - For each invoice for that company:

    - Add a node labeled with the invoice number.

    - For each line item of that invoice:

    - Add a node labeled with the line detail.


    For maximum portability, it''s best to avoid opening multiple statement at the

    time. Because of this, we are going to finish each statement before we

    issue the next. This more detailed explanation of the algorithm is shown here:


    +   Create a statement to get all the rows from company.

    - Store all the results in an array (fetchall_arrayref).

    - Finish the statement.

    - For each company:


    +   - Add a node to the tree labeled with the company name.

    - Create a statement to get all the Invoices for that company.

    - Store all the results in an array (fetchall_arrayref).

    - Finish the statement.

    - For each invoice for that company:


    +   - Add a node labeled with the invoice number.

    - Create a statement to get all the line items for that invoice.

    - Store all the results in an array (fetchall_arrayref).

    - Finish the statement.

    - For each line item of that invoice:

    - Add a node labeled with the line item detail.


    To work with Tk::Tree, we''ll need to introduce some delimiters into the data.

    When you add a node for a company, you can use its name as the raw node id:


    ```

    $tree->add("FrobCo", -text => "FrobCo")

    ```


    But when you add an invoice for that company, you''ll need to introduce the

    dimiter:


    ```

    $tree->add("FrobCo/001-C", -text => "Invoice 001-C");

    ```


    The same goes for a line item:


    ```

    $tree->add("FrobCo/001-C/Widget", -text => "Widget (24)");

    ```'
