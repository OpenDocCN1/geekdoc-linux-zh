  md: '# Object-Oriented Development to the Rescue?


    Object-oriented analysis and design, which is discussed in Chapters 7 and 8, address
    these concerns very well. UML diagrams, interfaces, and abstract classes reduce
    the communication costs from designers to programmers as well as between programmers.
    Inheritance ensures that changes to a base class will be reflected in all subclasses,
    reducing the amount of code that must be maintained. Using interfaces dramatically
    reduces regression testing requirements, because you only have to test the interface,
    rather than every piece of code that uses the interface. Component Object models
    (such as GNOME’s Bonobo or KParts) allow a standard set of routines to be used
    by all programmers on a project. And by allocating base classes to more productive
    programmers and subclasses to less productive programmers, you can raise the production
    rates of the entire team.


    These techniques should enable software engineers to produce more, higher quality
    code in time for a lower cost. Unfortunately, despite the wide-adoption of object-oriented
    approaches in the 1990s, software still took a long time to develop, had bugs,
    was difficult to maintain, and cost a lot of money. Does the fact that the fundamental
    problems of software engineering remain, despite demonstrably better tools and
    approaches, mean OO is invalid? But perhaps it suggests that modern applications
    are more complex, and in some cases, OO is not being applied correctly.


    # Is Bigger Better?


    Software delivered today, albeit late, buggy, and over-budget, is much more complex,
    functional, and easy to use software delivered, late, buggy, and over-budget 10
    years ago. In the early 1980s I spent several months writing a program to allow
    users to draw geometric shapes on a screen by typing a long string of obscure
    commands. Today, you could render the shapes in 3D, choosing whatever shape you
    want, and it still take a couple of months to write. My skill as a programmer,
    quadratic equations, and software engineering have not changed, what has changed
    the requirements for what a graphing package should do, and my ability to reuse
    the huge libraries of code already developed.


    In some ways, software is a victim of its own success. A good piece of software
    just raises the bar for what is considered acceptable in that category, and makes
    users of software in other categories wonder why their program doesn’t have those
    types of features. While this is not a bad problem to have, it is still a problem,
    and in order to meet the next generation of software com-'
