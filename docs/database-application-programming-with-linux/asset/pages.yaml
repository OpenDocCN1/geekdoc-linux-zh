  md: '# Algorithm Design Strategies


    Skiena offers a great deal of insight for people who need to develop an algorithm.
    The book is liberally peppered with Skiena''s war stories, narratives that describe
    how certain real-world algorithms were discovered, developed, and incrementally
    improved. Skiena provides an explicit method for designing certain classes of
    algorithms in Chapter 3, "User Interface Design." In this chapter, he describes
    two strategies: dynamic programming, and divide and conquer. These strategies
    teach you how to start with a definition of what problem the algorithm is to solve,
    and how work your way to an algorithm which you can be confident.


    One of the most important lessons we learn from Skiena is that we must be able
    to discern between a problem itself and an instance of the problem. If you''re
    asked to sort a list of customer names, you''re dealing with an instance of the
    problem, the problem itself, which is sorting a list of string values. You should
    think about what you''re trying to do, and boil it down to the problem itself.
    Otherwise, you may not recognize the problem as something that''s solved before,
    and you will end up reinventing the wheel!


    # Dealing with Recursion


    Understanding recursive algorithms is one of the first issues novice computer
    programmer struggles with. When you experience this struggle, one of two things
    will happen: Either complete understanding will come to you in a flash, or you
    will accept recursion (the property exhibited by recursive algorithms) as a spooky
    phenomenon. If you follow the latter course, you will probably try hard to avoid
    recursion in the future, fazem it when necessary.


    A recursive algorithm is an algorithm that is self-referential. At some point
    in the algorithm, the algorithm invokes itself. A child could use a recursive
    algorithm to climb a tree by climbing the first branch that looks sturdy, moving
    on to successive branches:


    ```

    Climb(branch):

    Climb to the branch

    For the first sturdy adjacent branch I reach from the branch I''m on:

    Climb(adjacent branch)

    ```


    It ends at some point, you need a terminal, or base case. When climbing a tree,
    you should probably stop when you can''t find any sturdy branches. Otherwise,
    the child might hang on the last sturdy branch, looking repeatedly at the remaining
    branches. This is an infinite regress, and it must be avoided by any practical
    recursive algorithm. Here is one possible solution to the child''s infinite regress:'
  merge: -1
