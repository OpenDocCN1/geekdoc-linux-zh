  md: '# CHAPTER 8


    ![](img/be9d6408fd1e74bd8b833ec2a75bea98_213_0.png)


    Figure 8.14 The class diagram, now with associations.


    **Diagram dependencies.** We''ll use dependencies (lightly dashed lines) to capture
    temporary dependencies between objects. These include situations where one class
    needs to know about another, but not through an attribute. Table 8.3 lists the
    corresponding dependencies.


    **Diagram visibility.** At one end or another (or both) of an association or dependency,
    an arrow indicates the direction of visibility. This tells us which object knows
    about the other, and can be derived through the associations and dependencies.
    Since a LoanHandler knows about a Loan, there will be an arrow along the dependency
    pointing at Loan. The reverse is *not* true: The Loan does not and should not
    know about the LoanHandler (otherwise, Loan would be coupled to LoanHandler, and
    it''s in our interests to keep coupling to a minimum).'
