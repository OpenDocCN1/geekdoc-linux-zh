    may take out many books, and many different patrons can take the same book out
    over time.


    However, no two patrons may take out the same book at the same time. This may
    be obvious to a human, but not so obvious to a computer system. As a result, it
    is a constraint that must be noted. Using the paper and pencil techniques outlined
    in this chapter, such constraints cannot be handled at design level, but will
    have to be handled somewhere, programmatically. Computer Aided Software Engineering
    (CASE) tools allow you to specify this sort of constraint at design time.


