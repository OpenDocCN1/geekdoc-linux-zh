    requirements as a single requirement).


    To avoid these problems, we need to put the raw requirements into a more formal
    statement. The level of formality will depend on the complexity of your project
    and your own style. Aside from the format presented here, Som-merville discusses
    alternative formats, including Program Design Language (PDL), a structured pseudocode
    notation used to design programs. We dis-cuss PDL in Chapter 4, “Construction."


    The raw requirements we have discussed so far include only functional requirements,
    which are the requirements directly related to the purpose of the system. Another
    class of requirements is nonfunctional requirements. These are usually constraints,
    such as choice of operating system, development lan-guage, response time, and
    so forth.


    In the formalized requirement that follows, I have used three guidelines, inspired
    byerville:


    Each requirement should express only one system task. Do not express multiple
    requirements as a single requirement.


    Use a stylized notation. For example, the key points of a requirement are shown
    in bold, and a numbered outline system is used to group related requirements.


    Justify each requirement. Notice that each requirement is accompanied by a rationale.


