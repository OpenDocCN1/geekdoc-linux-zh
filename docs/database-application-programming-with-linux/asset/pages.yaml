  md: "# Glade Meets GNOME-DB\n\nLet's take a look at an example program that combines\
    \ Glade with GNOME-DB. In this example, we'll use the Glade custom object to display\
    \ a GDA combo (pop-up, editable menu) and a GDA grid. This example was developed\
    \ using the Glade GUI builder, but instead of generating the application from\
    \ within, we're going to use libglade to load the user interface at runtime.\n\
    \n# The Glade UI Definition\n\nThis application uses the db_gui.glade file, which\
    \ describes the user interface in Figure 13.20. Let's look at each important widget\
    \ in the file.\n\n**The app GnomeApp widget.** This is the top-level window. It\
    \ is similar to the GtkWindow objects we saw in earlier examples, but it is an\
    \ instance of GnomeApp, which is a top-level container for GNOME applications.\
    \ Here is some of the relevant XML from the Glade file (as you can see, it has\
    \ one signal handler associated with it, which handles the deletion of the window)\n\
    \n```\n<widget>\n  <class>GnomeApp</class>\n  <name>app</name>\n  <signal>\n \
    \   <name>delete_event</name>\n    <handler>on_app_delete_event</handler>\n  </signal>\n\
    \  <title>GNOME-DB Example</title>\n  <type>GTK_WINDOW_TOPLEVEL</type>\n  <position>GTK_WINDOW_POS_NONE</position>\n\
    \  <!-- all the child widgets not shown --\n</widget>\n```\n\n![](img/be9d6408fd1e74bd8b833ec2a75bea98_448_0.png)\n\
    \n**Figure 13.20** Our GNOME-DB application window, with important widgets labeled."
