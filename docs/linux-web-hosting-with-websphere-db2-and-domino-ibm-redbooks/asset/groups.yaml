    \ and other Domino messages.\n\nTo stop the Domino server from the server console,\
    \ issue the quit command.\nThe Domino server will shutdown after 10 seconds.\n\
    \nIn order to be able to start Domino automatically, we develop a start_domino.sh\
    \ script. The complete listing of the script is provided in Appendix E.1, \"start_domino.sh\"\
    \ on page 209. The script performs the following sequence of tasks:\n\n- 1. Ensure\
    \ log on using the notes userid.\n- 2. Ensure the Domino server is not running.\n\
