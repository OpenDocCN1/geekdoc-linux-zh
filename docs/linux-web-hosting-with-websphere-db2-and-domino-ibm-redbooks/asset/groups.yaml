- md: "\nThe bean is later accessed in the inline Java code from the JSP. For more\
    \ discussion on beans, see Section 3.7, “Accessing data through a Java bean” on\
    \ page 103.\n\n## 3.6.2 Implementation of JSP in our Web application.\n\nThis\
    \ section describes the way in which we implemented JSP in our Web application.\n\
    \nWe opted to use a request to servlet response via the JSP approach. This is\
    \ illustrated in Figure 76.\n\n![](img/fa6240c5500d6e5eed673bb325a11d43_110_0.png)\n\
    \n### 3.6.2.1 Invoking a servlet\n\nInvoking a servlet from within JSP is achieved\
    \ by creating a URL that calls the servlet. It has the following general form:\n\
    \n```\nhttp://hostname:port/servlet/servlet_name\n```\n\nWe called our servlets\
    \ from within an HTML form and called them as follows:\n\n```\n<FORM action=http://hostname/servlet/servlet_name\
    \ METHOD=POST>\n```\n\nFigure 77 shows how we implemented this process as an HTML\
    \ form.\n\n```\n<FORM NAME=\"login\" ACTION=\"http://bdtest1/servlet/AccessUserstuf\
    \ METHOD=POST\">\n<INPUT TYPE=HIDDEN NAME=\"action\" VALUE=\"login\">\n<TABLE\
    \ CELLPADDING=0 CELLSPACING=0 B=0 WIDTH=363>\n</TABLE>\n```\n\nFigure 77. Invoking\
    \ a servlet that will process a form\n\nIn our servlet, called AccessUserstuf,\
    \ we indicate what action is to be taken by adding a hidden parameter in the form.\
    \ In Figure 77, this parameter is called action and indicates that this form will\
    \ be processed as a login, update, registration, or other action. This code allows\
    \ us to code only one servlet to perform various functions.\n\n### 3.6.2.2 Generating\
    \ dynamic HTML\n\nAccessUserstuf, with the hidden parameter set to login, verifies\
    \ that the user is valid. If an error occurs during this validation, the servlet\
    \ has to be able to communicate the error back to the calling JSP. We chose to\
    \ implement HttpSession objects to enable maintaining the connection information\
    \ (see Section 3.5.2, \"Maintaining state in HTTP\" on page 81). The servlet puts\
    \ the information into the HttpSession object and calls a JSP file. The JSP file\
    \ retrieves this information as follows:\n\n- Create the session using HttpSession\n\
    - Use getValue() method to access information\n\nFigure 78 illustrates this method\n\
    \n```\n</HEAD>\n<% HttpSession session=request.getSession(true);\nif (session.getValue(\"\
    error\") !=null) {\n  % <B ALIGN=CENTER><FONT SIZE=\"+2\">ERROR:</FONT></B></%\n\
    \  out.println(session.getValue(\"error\"));\n}\n\nsession.removeValue(\"error\"\
    );\n\n%>\n```\n\nFigure 78. Implementing the session in a JSP.\n\nIf the session.getValue()\
    \ returns a null string, the error and an explanation is then printed to the client\
    \ browser using out.println(). The error keyword is then removed from the session\
    \ information.\n\nIn general, all the information that is passed to our JSP files\
    \ has been implemented using the HttpSession object. Figure 79 illustrates how\
    \ this was achieved in our home page.\n\n```\n% if (session.get(\"as400\")!=null)\
    \ { %%\n<TD WIDTH=\"15\"><A HREF=\"/servlet/VBDList10?as400-item1\">AS/400</A>\n\
    % }%\n</TD>\n```\n\nFigure 79. Retrieving information from the session object\n\
    \nIn 79, we used the information contained in the HttpServlet to dynamically generate\
    \ a link to a new servlet. If the \"value\" returned by session.getValue() contains\
    \ a null string, the link to /servlet/VBDList10?as400-item1 would not be displayed\
    \ on the home page.\n\n## 3.7 Accessing data through a Java bean\n\nJava beans\
    \ are components designed to be on client systems. They are Java classes that\
    \ conform to certain coding standards. They can be described in terms of their\
    \ properties, methods, and events. Java beans may be packaged with a special descriptor\
    \ class called a BeanInfo and special property editor classes in a JAR file. Java\
    \ beans may or not be visual components. For more information, see the Java bean\
    \ documentation at:\n\nhttp://www.javascript.com/beans/docs\n\nA bean was chosen\
    \ for one instance where the database was queried for information pertaining to\
    \ previous orders. We create the following coding to construct access to the bean\
    \ for the list of orders:\n\n- A bean is called from within a JSP using the <BEAN\
    \ .../></BEAN> tags. The JSP can then access the values contained within the bean\
    \ request object. Figure 80 on page 104 illustrates how we accomplished this.\n\
    \n```\n<bean\nname=\"orders\"\ntype=\"penguins.access.db2.Orders\"\n>\n</bean>\n\
    ```\n\n**Figure 80.** Bean tag in the listordersPage.jsp\n\nThe JSP page, listordersPage.jsp,\
    \ picks up the bean name of orders and finds the instance of penguins.access.db2.Orders\
    \ from the Request object., the information contained in bean, is accessible via\
    \ the public methods. See Section 3.7.0.1, \"AccessUserstuf action=listorders\"\
    \ on page 104, where we discuss the Orders bean.\n\n- We use the bean to print\
    \ the previous orders in a table. This is accomplished by iterating through all\
    \ the orders contained in the bean with the following code:\n\n```\nfor(Enumeration\
    \ e=bean.orderIDs(); e.hasMoreElements(); {\n    String key=(String) e.nextElement();\n\
    \    // ... process order\n}\n```\n\nThe complete listordersPage.jsp is provided\
    \ in Appendix D.\n\n"
  mdcn: "\n\n该 bean 随后会在 JSP 的内联 Java 代码中访问。关于 beans 的更多讨论，请参见第 103 页第 3.7 节“通过 Java\
    \ bean 访问数据”。\n\n## 3.6.2 在我们的 Web 应用中实现 JSP\n\n本节描述了我们在 Web 应用中实现 JSP 的方式。\n\n\
    我们选择通过 JSP 方法请求 servlet 响应。这如图 76 所示。\n\n![](img/fa6240c5500d6e5eed673bb325a11d43_110_0.png)\n\
    \n### 3.6.2.1 调用 servlet\n\n在 JSP 内部调用 servlet是通过创建一个调用该 servlet 的 URL 实现。它具有以下通用格式：\n\
    \n```\nhttp://hostname:port/servlet/servlet_name\n```\n\n我们在 HTML 表单内部调用 servlet，并如下所示调用：\n\
    \n```\n<FORM action=http://hostname/servlet/servlet_name METHOD=POST>\n```\n\n\
    图 77 显示了我们如何作为 HTML 表单实现这一过程。\n\n```\n<FORM NAME=\"login\" ACTION=\"http://bdtest1/servlet/AccessUserstuf\
    \ METHOD=POST\">\n<INPUT TYPE=HIDDEN NAME=\"action\" VALUE=\"login\">\n<TABLE\
    \ CELLPADDING=0 CELLSPACING=0 B=0 WIDTH=363>\n</TABLE>\n```\n\n图 77. 调用将处理表单的\
    \ servlet\n\n在我们名为 AccessUserstuf 的 servlet 中，我们通过在表单中添加隐藏参数来指示要执行的操作。在图 77 中，该参数称为\
    \ action，并指示此表单将作为登录、更新、注册或其他操作进行处理。此代码允许我们只编写一个 servlet 来执行各种功能。\n\n### 3.6.2.2\
    \ 生成动态 HTML\n\n当 AccessUserstuf 的隐藏参数设置为 login 时，它会验证用户是否有效。如果在验证过程中发生错误，servlet\
    \ 必须能够将错误传回给调用的 JSP。我们选择实现 HttpSession 对象以能够维护连接信息（请参见第 81 页第 3.5.2 节“在 HTTP 中维护状态”）。servlet\
    \ 将信息放入 HttpSession 对象并调用 JSP 文件。JSP 文件按如下方式检索这些信息：\n\n- 使用 HttpSession 创建会\n\
    - 使用 `getValue()` 方法访问信息\n\n图 78 阐了这种方法\n\n```\n</HEAD>\n<% HttpSession session=request.getSession(true);\n\
    if (session.getValue(\"error\") !=null) {\n  % <B ALIGN=CENTER><FONT SIZE=\"+2\"\
    >ERROR:</FONT></B></%\n  out.println(session.getValue(\"error\"));\n}\n\nsession.removeValue(\"\
    error\");\n\n%>\n```\n\n图 78. 在 JSP 中实现会话。\n\n如果 `session.getValue()` 返回空字符串，则将使用\
    \ `out.println()` 将错误和说明打印到客户端浏览器。随后将从会话信息中移除错误关键字。\n\n通常情况下，传递到我们 JSP 文件的所有信息都是使用\
    \ HttpSession 对象实现的。图 79 展示了我们如何在主页中实现这一点的。\n\n```\n% if (session.get(\"as400\"\
    )!=null) { %%\n<TD WIDTH=\"15\"><A HREF=\"/servlet/VBDList10?as400-item1\">AS/400</A>\n\
    % }%\n</TD>\n```\n\n图 79. 从会话对象中检索信息\n\n在图 79 中，我们使用 HttpServlet 中包含的信息来动态生成指向新\
    \ servlet 的链接。如果 `session.getValue()` 返回空字符串，则指向 /servlet/VBDList10?as400-item1\
    \ 的链接将不会显示在主页上。\n\n## 3.7 通过 Java bean 访问数据\n\nJava beans 是设计在客户端系统上的组件。它们是符合特定编码标准的\
    \ Java 类。可以根据它们的属性、方法和事件进行描述。Java beans 可能会与一个名为 BeanInfo 的特殊描述符类以及特殊的属性编辑器类一起打包在\
    \ JAR文件中。Java beans 可能是也可能不是视觉组件。更多信息请参阅 Java bean 文档：\n\nhttp://www.javascript.com/beans/docs\n\
    \n在其中一个实例选择了一个 bean，用于查询数据库获取有关之前订单的信息。我们创建了以下代码构建对订单列表 bean 的访问：\n\n- 在 JSP 内部使用\
    \ `<BEAN .../></BEAN>` 标签调用 bean。然后 JSP 就可以访问包含在 bean 请求对象中的值。第 104 页的图 80 展示了我们如何实现这一目标。\n\
    \n```\n<bean\nname=\"orders\"\ntype=\"penguins.access.db2.Orders\"\n>\n</bean>\n\
    ```\n\n**图 80.** listordersPage.jsp 中的 bean 标签\n\nJSP 页面 listordersPage.jsp 获取名为\
    \ orders 的 bean，并从 Request 对象中找到 `penguins.access.db2.Orders` 的实例。bean 中包含的信息可以通过公共方法访问。请参见第\
    \ 104 页第 3.7.0.1 节“AccessUserstuf action=listorders”，我们在其中讨论了 Orders bean。\n\n\
    - 我们使用该 bean 在表格中打印之前的订单。这是通过以下代码遍历 bean 中包含的所有订单来实现的：\n\n```\nfor(Enumeration\
    \ e=bean.orderIDs(); e.hasMoreElements(); {\n    String key=(String) e.nextElement();\n\
    \    // ... process order\n}\n```\n\n完整的 listordersPage.jsp 见附录 D。\n\n"
