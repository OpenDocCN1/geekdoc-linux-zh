    ## 4.2.3 Statistics and events


    The statistic and events facility allows us to configure, create, and report information
    about the Domino server. The statistic and the event display is shown in the Domino
    administrator by:


    - 1. Selecting the Configuration tab

    - 2. Expanding the Statistic & Event category.


    The statistic parameters for the Domino server are shown in Figure 101 on page
    128.


    ![](img/fa6240c5500d6e5eed673bb325a11d43_137_0.png)


    Figure 101. Statistics and events


    Statistics and events are controlled by two server tasks, event and collect. By
    default, statistics are collected every hour. The information captured is stored
    in the following Domino databases:


    - statrep.nsf, where statistical information is logged

    - events4.nsf, where event handling and statistic monitoring are configured.


    From the statistic and events, we can also create monitors to track server resources
    and network activity. Each monitor has an associated threshold. When the threshold
    is reached, the monitor generates an event.


    The monitor tools available use the Statistics & Events category. Figure 102 on
    page 229 displays a screenshot of the monitor tool for file activity.


