    \    echo \"无法访问 notes 目录\"\n    exit 1\nfi\nNOTES_RUNNING=$(ps -fu notes | awk\
    \ '{print $2}' | grep /opt/lotus | \\\ngrep -v grep | cut -d\"-\" -f1,2,3,4 |\
    \ head -n1)\nif ! \"$NOTES_RUNNING\"; then\n    echo \"Domino 服务器已经在运行\"\n   \
    \ exit 1\nfi\ncd $NOTES_DATA\nrm -f *.notes 2>&1\nmems=$(ipcs -m | grep $NOTES_USER\
    \ | awk '{ print $2 }')\nsems=$(ipcs -s | grep $NOTES_USER | awk '{ print $2 }')\n\
