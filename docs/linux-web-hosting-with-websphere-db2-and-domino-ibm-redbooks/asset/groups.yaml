    \n```bash\n#!/bin/bash\n\nNOTES_USER=notes # Notes 用户\nNOTES_PATH=/home/notes\
    \ # 目录\nNOTES_DATA=/opt/notesdata/ # Domino 目录\nSERVER=/opt/lotus # Domino 位置\n\
