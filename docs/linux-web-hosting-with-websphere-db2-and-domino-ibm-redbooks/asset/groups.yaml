    ## 1.2 Pattern for e-business


    The patterns for e-business aim to provide a readily available design pattern
    on building an e-business system, including the system architecture and guidelines.
    These patterns are cataloged in the following schemes:


    - User-to-business

    - User-to-online buying

    - Business-to-business

    - User-to-data

    - User-to-user

    - Application integration


    For more information on these patterns for e-business, see the IBM developerWorks
    Web site at: http://www.ibm.com/software/developer/web/patterns


    We have chosen to implement the most common subset of the patterns, the user-to-online
    buying, which is a subset of the user-to-business pattern. The application topology
    that we choose is a Web-ub approach, meaning that we create the application from
    scratch in the Web server with no backend integration. Figure 1 on page 3 shows
    the ideal run-time topology for this pattern.


    In Figure 1 on page 3, the e-business system for an enterprise spans from the
    demilitarized zone (DMZ) to the enterprise''s internal network. The following
    components comprises the e-business solution for the user-to-online buying pattern:


    - The protocol firewall filters unwanted and unnecessary protocol packages. It
    only allows incoming requests to certain machines and certain ports.

    - The request dispatch acts as the load balancing for multiple Web server systems.
    It routes the requests to a certain Web server to facilitate a balanced overall
    load, thus enhancing the overall throughput.

    - The Commerce server is the Web server with its application server, which processes
    HTTP requests from the Internet.

    - The domain firewall protects the internal network by only allowing certain machines
    in the DMZ to send packages to the internal network.

    - The DB server provides the database support for the Web application. The data
    in the database is considered secure, as it is protected by both the protocol
    firewall and domain firewall.


    | Outside world | Demilitarized Zone (DMZ) | Internal network |

    | :--- | :--- | :--- |

    | Online completion of orders is not done by shoppers | Web server | Application
    node |

    | Retail customer Internet | Commerce server node | Application node |

    | | Web server functions to backends (optional) | Application node |

    | | DB server node | databases |

    | | static pages - promotions | Content management node |


    Figure 1. Run-time topology for user-to-online buying


    The pattern for e-business also includes product selection. However, there is
    currently no option in the product selection; so, we have to define the product
    selection ourselves. We implement IBM HTTP server and WebSphere Application Server
    in the commerce node; whereas on the DB server, we put IBM DB2 and Lotus Domino.
    For simplicity, we do not implement the dispatcher.


    For in-depth discussion on user-to-business and user-to-online buying patterns
    and their guidelines, refer to Patterns for e-business: Topology 1 and 2 using
    WebSphere Advanced Edition.


    ## Chapter 1. Project introduction


    ## 1.3 On the Web


    This redbook is produced from a project in Austin. The redbook is aimed at showing
    the ability to provide an advanced platform for generic Web hosting and e-business
    using Linux as the operating system. The approach that we have taken is to actually
    build a Web server that provides sample e-business functionality on Linux. The
    Linux distributions that we use are RedHat Version 6.2 and CalderaDesktop Version
    2.4. The software utilize:


    - IBM WebSphere Version 2.0

    - IBM server Version 1.3

    - IBM Database2 Version 6.1

    - Lotus Domino Version 5.0


    The project is expanded further to provide some consideration on operating the
    Linux server. The consideration spans from daily Linux operation to specific tasks
    that may need to be performed in administering the Web server. The sample application
    that we choose to provide is a customized Web site. The Web application that we
    built consists of the following:


    - Dynamic user management using IBM DB2

    - Dynamic page using Servlet, Java Server Page (JSP), and Java beans

    - Servlet and beans management using WebSphere Application server

    - Access to the Lotus Domino database


    Putting all the above functions together shows a lot of the interoperability issues
    that we experienced. There are several other books that also discuss integration
    with Linux, but building a working solution is another task in itself.


    ## 1.4 Document organization


    This redbook is aimed at providing usage and administration information for Web
    administrators using the Linux server with IBM products. We will not cover the
    basic installation of products. It is assumed that the reader has basic HTML skill,
    Java programming, and Linux administration knowledge. This document has the following
    chapters:


    - Chapter 1, "Project introduction" on page 1, provides some background information
    on the overall project.

    - Chapter 2, "Setup and configuration" on page 7 provides an overview of the installation
    process and procedure that we performed on our system. The installation process
    is mostly described briefly except for some specific tasks that are required to
    make the product work.

    - Chapter 3, "Building the Web server" on page 53 discusses the steps that we
    took on building our Web server. This chapter discusses the programming structure
    that we used and the code that we built. The coding techniques that we cover include:

    - Access to DB2 using JDBC

    - Access to Domino using JDBC

    - Generic session access

    - Java Server Page implementation

    - Java beans programming

    - Chapter 4, "Operational considerations" on page 107 shows some basic operational
    tasks that may need to be performed to ensure the operation of the Web server.
    The operation that is discussed here is the basic starting and stopping of the
    facilities, routine maintenance that must be performed and some monitoring and
    troubleshooting tips.

    - Chapter 5, "Extending the case study" on page 139 discusses some things that
    can be achieved but is not currently implemented in this project because of time
    limitations or product limitations.


    The appendices that we provide contains various source code and HTML files that
    we used throughout the projects. We also provide a CD-ROM for all the source codes
    of the Java files, scripts, HTML files, and JSP files that we used. Refer to Appendix
    F, "Using the additional material" on page 211 for directions on using the CD-ROM.


    ## Chapter 2. Setup and configuration


    This chapter contains the basic setup and configuration tasks that we performed
    for the implementation of the scenario. The items we discuss here consists:

    - Section 2.1, "System configuration" on page 7 shows the system configuration
    that we used in our environment.

    - Section 2.2, "Installation overview" on page 8 provides an overview of the overall
    setup and configuration tasks.

    - Section 2.3, "Linux setup" on page 11 discusses the issues involved in setting
    up the Linux systems, including the hardware requirement, disk partitioning scheme,
    and actual consideration on RedHat and Caldera

    - Section 2.4, "Application installation" on page 14 shows the installation and
    configuration of the IBM software that is used in this project.

