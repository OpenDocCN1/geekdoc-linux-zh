    \n### E.2 cleanup_domino.sh\n\n```bash\n#!/bin/bash\nNOTES_USER=notes\nNOTES_PATH=/local/notes\n\
    PATH=$NOTES_PATH:/opt/lotus/bin:$HOME:$PATH\n\ncount=0\nNOTES_RUNNING='ps -fu\
    \ $NOTES_USER | grep /opt/lotus | grep -v grep | grep -v bash'\nwhile [[ -n $NOTES_RUNNING\
    \ ]]; do\n  sleep 10\n  count=$((count + 1))\n  echo \"...等待 $count 秒\"\n  if\
    \ [ $count -eq 12 ]; then\n    echo \"2 分钟后 Domino 服务器仍在运行\"\n    echo \"现在将其杀死\"\
