    # 5.3 Servlet programs


    In our project, we utilize a lot of servlets to provide business logic and programming
    capability to our Web server. These servlets access the DB2 database, Domino database,
    HTTP session information and Java bean object. In this section, we discuss mostly
    the behavior of our servlet and how we code the servlets to perform what we want.
    The discussion in this section is separated into:


    +   - Section 3.5.1, "Servlets" on page 79, which discusses an overview of servlet
    and gives the list of servlets that we use in the project.


    +   - Section 3.5.2, "Maintaining state in HTTP" on page 81, which shows the way
    the servlet handles session attributes.


