    \ WebSphere, DB2, and Domino\n\n## Appendix E. Sample scripts\n\nThis appendix\
    \ provides the script listings for Notes operation.\n\n### E.1 start_domino.sh\n\
    \n```bash\n#!/bin/bash\n\nNOTES_USER=notes # Notes userid\nNOTES_PATH=/home/notes\
    \ # Home directory\nNOTES_DATA=/opt/notesdata/ # Domino directory\nSERVER=/opt/lotus\
    \ # Domino location\nSERVER_NAME=${SERVER##*/} # Domino server name\nOUTPUT_LOG=/var/log/$SERVER_NAME.log\
    \ # Where will put the log\nPATH=/opt/lotus/bin:$HOME:$PATH\nif [ \"$USER\" =\
    \ \"root\" ]; then\n    echo \"Don't use root for server\"\n    su notes\nfi\n\
    if [ ! -x $NOTES_SERVER/bin/server ]; then\n    echo \"Cannot found the server\
    \ command\"\n    exit 1\nfi\nif [ ! -d $NOTES_DATA ]; then\n    echo \"Cannot\
    \ access notes directory\"\n    exit 1\nfi\nNOTES_RUNNING=$(ps -fu notes | awk\
    \ '{print $2}' | grep /opt/lotus | \\\ngrep -v grep | cut -d\"-\" -f1,2,3,4 |\
    \ head -n1)\nif ! \"$NOTES_RUNNING\"; then\n    echo \"Domino Server is already\
    \ running\"\n    exit 1\nfi\ncd $NOTES_DATA\nrm -f *.notes 2>&1\nmems=$(ipcs -m\
    \ | grep $NOTES_USER | awk '{ print $2 }')\nsems=$(ipcs -s | grep $NOTES_USER\
    \ | awk '{ print $2 }')\nfor j in $sems; do [ -n \"$j\" ]; then ipcrm $j>tmp.lck;\
    \ done\nfor j in $sems; do [ -n \"$j\" ]; then ipcrm $j>tmp.lck; done\nrm -f tmp.lck\n\
    \necho \"Running Domino for Linux\"\n```\n\n### E.2 cleanup_domino.sh\n\n```bash\n\
    #!/bin/bash\nNOTES_USER=notes\nNOTES_PATH=/local/notes\nPATH=$NOTES_PATH:/opt/lotus/bin:$HOME:$PATH\n\
    \ncount=0\nNOTES_RUNNING='ps -fu $NOTES_USER | grep /opt/lotus | grep -v grep\
    \ | grep -v bash'\nwhile [[ -n $NOTES_RUNNING ]]; do\n  sleep 10\n  count=$((count\
    \ + 1))\n  echo \"...waiting for $count seconds\"\n  if [ $count -eq 1 ]; then\n\
    \    echo \"Domino server is still running after 2 minutes\"\n    echo \"Now it\
    \ will die\"\n    for i in $(ps -m | grep $NOTES_USER | grep /opt/lotus|grep -v\
    \ grep|grep -v awk '{print $2}'); do\n      kill -9 $i\n    done\n    seps=$(ps\
    \ -m | grep $NOTES_USER | awk '{print $2 }')\n    sems=$(ipcs -s | grep $NOTES_USER\
    \ | awk '{print $2 }')\n    for j in $seps; do [ -n \"$j\" ]; then ipcrm $j>tmp.lck;\
    \ done\n    for j in $sems; do [ -n \"$j\" ]; then ipcrm $j>tmp.lck; done\n  \
    \  rm -f tmp.lck\n    exit\n  fi\n  NOTES_RUNNING='ps -fu $NOTES_USER | grep /opt/lotus\
    \ | grep -v grep '\ndone\nrm -f $NOTES_PATH/notes.lck\necho \"Domino shutdown\
    \ completed\"\n```\n\n## Appendix F. Using the additional material\n\nThis redbook\
    \ also contains additional material in CD-ROM. See the appropriate section below\
    \ for instructions on using or downloading the CD-ROM material.\n\n### F.1 Using\
    \ the CD-ROM\n\nThe CD-ROM that accompanies this redbook contains the following:\n\
    \n| File name or directory | Description |\n| --- | --- |\n| SG246007.html | Main\
    \ HTML file Automatic run for Window based systems |\n| AUTORUN.* | Various HTML\
    \ files |\n| *.html | Various images used in the HTML files |\n| *.avi | Directory\
    \ for the Camera videos |\n| Java/ | Directory for the source code of Java programs\
    \ |\n| htdocs/ | Directory for the HTML and JSP files |\n| script/ | Directory\
    \ for the various script files |\n| sample/Redbooks.nsf | Sample redbook Lotus\
    \ Domino database |\n\n### F.1.1 System requirements for using the CD-ROM\n\n\
    The following software configuration is recommended for optimal use of the CD-ROM.\n\
    \n| Web browser | Description |\n| --- | --- |\n| | Such as Internet Explorer\
    \ or NetScape Navigator |\n| Adobe Acrobat Reader | For reading the PDF format\
    \ of the redbook |\n| Windows video/AVI player | For running the Camera videos\
    \ |\n\n### F.1.2 How to use the CD-ROM\n\nThe CD-ROM should automatically open\
    \ a Web browser window. Should you need to manually open the CD-ROM, you can access\
    \ the contents of the CD-ROM or diskette by pointing your Web browser at the file,\
    \ SG246007.html, in the CD-ROM root directory and following the links found.\n\
    \n### F.2 Locating the additional material on the Internet\n\nThe CD-ROM, diskette,\
    \ or Web material associated with this redbook is also available in softcopy on\
    \ the Internet from the IBM Redbooks Web server. Point your Web browser to:\n\n\
    ```\nftp://www.redbooks.ibm.com/redbooks/S9324607\n```\n\nAlternatively, you can\
    \ go to the IBM Redbooks Web site at:\n\n```\nhttp://www.redbooks.ibm.com/\n```\n\
    \nSelect the Additional materials and open the directory that corresponds with\
    \ the redbook form number.\n\n## Appendix G. Special notices\n\nThis publication\
