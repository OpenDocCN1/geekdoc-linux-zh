    \nFigure 84. Administration Server Getting Started screen\n\nTo change the basic\
    \ setting of the Web server, complete the following:\n\n- 1. Click on Basic Settings\n\
    - 2. Click on Core Setting\n"
  mdcn: "\n\n## 第 4 章 运行考虑\n\n本章讨论了运行 Linux Web 服务器的运行方面。此处的讨论旨在维护构成正在运行应用程序的产品，这些产品分为：\n\
    \n- IBM HTTP 服务器\n- IBM WebSphere Application Server\n- IBM Database 2\n- Lotus\
    \ Domino Enterprise Server\n\n讨论分为以下部分：\n\n- 第 107 页第 4.1 节，“设施管理”\n- 第 123 页第\
