    \ Internet host name.\n  - Test the new configuration using a Web browser.\n\n\
    ## 2.2.2 Installation of front-end server\n\nThe front-end server installation\
    \ steps are:\n\n- 1. Prepare the hardware and ensure that it satisfies all the\
    \ required configuration for all the software that will be used.\n- 2. Install\
    \ the chosen Linux distribution.\n  - Add the admin name as a normal user.\n \
    \ - Become familiarized with the preferred X-Window environment: KDE or GNOME.\n\
    - 3. To install Java, we used IBM JDK118.\n  - To install Java, log in as the\
    \ root user.\n  - For Calder installation, remove old Java versions.\n  - After\
    \ installation, export the JAVA_HOME environment variable.\n- 4. Install IBM HTTP\
    \ Server 1.3.6\n  - To install the IBM HTTP Server, log in as the root user.\n\
    \  - Remove any other Web installations, for example Apache, and its associated\
    \ dependencies.\n  - After installation, modify the run levels so that the IBM\
    \ HTTP Server will start on reboot. Reboot the server. The IBM HTTP Server daemon\
    \ would now start normally.\n  - Use a Web browser to test the IBM HTTP server.\n\
    - 5. Install WebSphere 2.0.3\n  - To install WebSphere, log in as the root user.\n\
    \  - Ensure the JAVA_HOME environment variable is set.\n  - Install the core and\
    \ Web server specific WebSphere rpm packages.\n  - For JSP to, change ownership\
    \ of the pagecompile directory to user body.\n  - Modify and verify various IBM\
    \ HTTP Server and WebSphere Application configuration files.\n  - Restart IBM\
    \ HTTP Server. This should load and run WebSphere.\n  - Use a Web browser to test\
    \ that WebSphere runs the snoop servlet, and that WebSphere administration in\
    \ localhost for port 9527.\n- 6. Configure access to the backend databases\n \
    \ - Install the DB2 Client Application Enabler (CAE) and create the default DB2\
    \ instance with Java support.\n  - Verify connectivity to the sample database\
    \ on the backend server.\n  - Patch the bootstrap.properties file and the ibmhttpd\
    \ startup script to access DB2.\n  - Restart WebSphere and the IBM HTTP server,\
    \ and then test DB2 connectivity to the sample database.\n  - Copy the NCSO.jar\
    \ file from the backend server.\n  - Patch the WebSphere bootstrap.properties\
    \ file to allow access to the Domino server.\n  - Restart WebSphere and the IBM\
    \ HTTP Server, and then test Domino connectivity to the sample database.\n\nLinux\
    \ Web Hosting with WebSphere, DB2, and Domino\n"
