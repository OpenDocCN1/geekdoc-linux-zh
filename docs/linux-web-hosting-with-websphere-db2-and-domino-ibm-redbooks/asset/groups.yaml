    ### 4.2.3.4 Notes System Diagnostics tool


    The Notes System Diagnostic (NSD) tool is developed by Iris, and it is available
    only on the UNIX platform. NSD is included in the Domino server installation.


    To run NSD, issue the nsd command and use the -help options for explanation of
    the available parameters. NSD will create the file nsd.log<date and time>, where
    the date and time is the date and time the program was invoked. Use any text editor
    to view this file.


