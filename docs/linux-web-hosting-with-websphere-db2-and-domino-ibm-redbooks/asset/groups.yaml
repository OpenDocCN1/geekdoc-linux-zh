    # Chapter 5. Extending the case study


    This chapter discuss some possible extension of our implementation. We explain
    these possibilities without being able to perform them themselves. The discussion
    is divided into:


    +   - Section 5.1, "Utilizing advanced features" on page 139, which discusses
    the available features that we do not use because of the complexity in implementing
    them.

    - Section 5.2, "Product limitations in Linux" on page 142, which discusses the
    features that are not available in the Linux version of the software that we use.


    # 5.1 Utilizing advanced features


    This chapter discusses the advanced features in some of the software products
    that are not exploited because the lack of implementation time. However, these
    feature have already been covered in detail other redbooks, such as Linux for
    WebSphere and DB2 Servers, SG24-5850, and Patterns for e-business: User-to-Business
    Patterns for Topology 1 and 2 using WebSphere Advanced Edition, SG24-5864. Refer
    to these redbooks for more information.


    # 5.1 WebSphere


    The following advanced features of WebSphere are available but are not utilized
    in our project:

    - Section 5.1.1.1, "DB connection pooling" on page 139

    - Section 5.1.1.2, "User profile tracking" on page 140


    # 5.1.1.1 DB connection pooling


    Connecting and disconnecting from a data server causes the inefficient use of
    resources. WebSphere offers a database connection pooling facility that can be
    used by programmers to manage connections to a database. This is an API that contains
    methods for:


    +   - Establishing a pool of open connections to a given database

    - Requesting a connection from the managed pool

    - Returning the connection to the managed pool


    This pool of connections for a given database is managed through the WebSphere
    administration facility.'
  - '[PAGE 149]


    The connection manager allows you to connect and disconnect to a data server more
    efficiently by pooling connections and reusing them. This reduces the overhead
    of connecting and disconnecting. The servlets use the connection pool as follows:


    +   - When a user makes a request over the Web to a servlet, the servlet uses
    an existing connection from the pool, meaning the user request does not incur
    the overhead of a data server connection.

    - When the request is satisfied, the servlet returns the connection to the connection
    manager pool for use by other servlets.


    The user request, therefore, does not incur the overhead of a data server disconnection.


    The connection manager also allows you to control the number of concurrent connections
    to a data server product. This is very useful if the data server agreement limits
    you to a certain number of concurrent users.


    There is a good introduction to connection manager in the WebSphere documentation
    under the IBMWebAS directory. In our ٹرسٹ1 system, it is at URL:


    ```

    http://servlet1/IBMWebAS/doc/whatis/icmgr.html

    ```


    # 5.1.1.2 User profile tracking


    The WebSphere Application Server has an API, called UserProfile, that makes it
    easy to maintain persistent information about your Web site visitors. The UserProfile
    enables you to store the user''s data in a database without coding any SQL.


    The UserProfile contains the interface to store the user''s personal data, such
    as name, postal and e-mail addresses, telephone numbers, and shopping cart information.
    For further information, see the UserProfile API Reference in the WebSphere documentation
    under the IBMWebAS directory. In our ٹرسٹ1 system, it is at URL:


    ```

    http://servlet1/IBMWebAS/doc/apid/Package-com.ibm.servlet.personalization.userprofile.html

    ```


    # 5.1.2 IBM HTTP Server


    The following advanced features of IBM HTTP Server are available but not utilized
    in our project:


    +   - Section 5.1.2.1, "SSL" on page 141

    - Section 5.1.2.2, "Caching and dynamic pages" on page 141'
  - '[PAGE 150]


    # 5.1.2.1 SSL


    The IBM HTTP Server features include easy installation support for SSL secure
    connections.


    Secure Sockets Layer (SSL) is a protocol that provides privacy and integrity between
    two applications using TCPIP. HTTP can use SSL for secure communications.


    The data travelling between the client and server is encrypted by a secret key
    algorithm. A public-key algorithm is used for the exchange of the secret encryption
    key and for encrypting the digital signature in the servers. With the server certificate,
    the client can verify the server''s identity.


    Once your server has a digital certificate, SSL-enabled browsers, such as Netscape
    Navigator and Microsoft Internet Explorer, can communicate securely with your
    server using the SSL protocol. The IBM HTTP Server powered by Apache supports
    client authentication, configurable cipher specifications and session ID caching
    for improving SSL performance on the UNIX platforms. For further info on, refer
    to:


    +   * http://home.netscape.com/eng/ssl/

    * http://www.ibm.com/software/webservers/https/


    # 5.1.2.2 Caching and dynamic pages


    By default, most Web browsers and proxy cache Web pages. In the case of JSP files,
    HTML files, and servlets, these Web pages are dynamically generated and may change
    for each attempted access.


    In order to prevent caching, and thus access the newly generated dynamic data,
    we can add the following code in a Java Server Page or servlet to prevent Web
    browsers from caching JSP/SHTML files and servlets:


    ```

    response.setHeader("Pragma", "no-cache");

    response.setHeader("Expires", "0");

    response.setHeader("Cache-Control", "no-cache");

    ```


    Use the following code to prevent a proxy server from sharing cached pages:


    ```

    response.setHeader("Cache-Control", "private");

    ```


    Both of these headers can be combined to prevent caching.'
  - '[PAGE 151]


    # 5.2 Product limitations in Linux


    The level of WebSphere in Linux is lagging from the available version in other
    platforms (such as Windows NT or AIX). This poses a considerable restriction to
    our ability to utilize several of the new features that make the e-business development
    easier, such as the RequestDispatcher class. See Section 5.2.1, "The RequestDispatcher
    class" on page 142 for a more comprehensive discussion of this class.


    In our project, we use the Lotus Domino database using CORBA. Lotus Domino server
    can also be accessed by JDBC. However, the Lotus Domino Driver for JDBC is only
    available for a number of platforms, and Linux is not among them. See Section
    5.2.2, "JDBC connections for Domino" on page 143 for a more comprehensive discussion
    of this feature from Lotus.


    # 5.2.1 The RequestDispatcher class


    The basic use of RequestDispatcher is to pass the current request to another program
    (servlet or JSP). A Request Dispatcher has two primary methods for including the
    response of another program or forwarding the request of the current program to.


    +   Including the response from another program requires the use of the method:


    ```

    aRequestDispatcher.include(request, response)

    ```


    We would use this if we want to call another servlet from our current servlet,
    then perform processing in the current servlet after calling this other servlet


    +   Forwarding the request to another program requires the use of the method:


    ```

    aRequestDispatcher.forward(request, response)

    ```


    We would use this to forward the request on to another servlet, and then allow
    this new servlet to return the response back to the client directly.


    Unfortunately for us, the RequestDispatcher class is only available in the Java
    SDK 2.1 API for the javax.servlet class (supported and extended in WebSphere 3.02).
    In our servlets, to be run under WebSphere 2.03 (which only supports and extends
    SDK 2.0), we were forced to use the deprecated callPage method in package com.sun.servlet.http.
    This also explains the use of the HttpServletResponse and HttpServletRequest objects
    in Java code in servlet AccessUserstuff.'
