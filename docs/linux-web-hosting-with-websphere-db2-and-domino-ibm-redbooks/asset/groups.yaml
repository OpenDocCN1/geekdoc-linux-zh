    \n## 5.2.2 JDBC connections for Domino\n\nJDBC(TM) is an object interface that\
    \ allows Java applications, applets, and agents to retrieve and manipulate data\
    \ in database management systems using SQL. The JDBC interface allows a single\
    \ application to connect to many different types of databases through a standard\
    \ protocol.\n\nThe Lotus Domino Driver for JDBC implements the JDBC 1.0 specification.\
    \ It can be for the Windows 95, Windows 98, and Windows NT 4 operating systems.\
    \ This is a Type 2 driver, which is comprised of a combination of Java classes\
    \ and non-Java compiled code. It is currently not available for any other platform\
    \ (including Linux).\n\nThe Lotus Domino Driver for JDBC allows Java programmers\
    \ to access Domino/Notes databases using JDBC. Java can work with any JDBC enabling\
    \ reporting tool to access Lotus databases. Java programmers can use any Java\
    \ Database Connectivity (JDBC) standard application tool to access Lotus Domino\
    \ databases as easily as any relational database. When running this JDBC driver\
    \ with Domino R5, Java programmers can create Servlets that access Domino data.\
    \ The Lotus Domino Driver for JDBC makes Domino databases look like another back-end\
    \ source to the SQL tool or application interface by producing result sets that\
    \ mirror the relational model. An application can also perform a SQL Join of data\
    \ from Domino with data from a relational database, such as Oracle, Sybase, or\
    \ DB/2.\n\nProduct features include:\n\n- *Java standard access to Domino 4.5x,\
    \ 4.6x, and R5x databases.*\n- Compatible with Netscape Communicator 4.05 and\
    \ higher.\n- Compatible with Microsoft Internet Explorer 4.01 with service pack\
    \ 1 and higher.\n- Includes an unsigned version for maximum flexibility when creating\
    \ Java applets that use JDBC\n- Year 2000 ready; so, it correctly reads dates\
    \ in two digit year (mm/dd/yy) and four digit year (mm/dd/yyyy) format.\n- Tested\
    \ with IBM's Visual Age for Java Version 2.0, IBM's WebSphere Application Server\
    \ 2.0, Lotus eSuite DevPack 1.5, Borland's JBuilder 3, Professional, Jinfonet\
    \ Software's JReport Professional 1.3, EnterpriseSoft's Enterprise Reports 3.0,\
    \ Symantec's Visual Cafe Database Development Edition Version 3.0, and NetObjects\
    \ BeanBuilder 1.0.\n- Multi-threaded for high performance Web use.\n- Works with\
    \ clustered servers for high application availability via load balancing and fail\
    \ over.\n- Four sample programs (.java files provided with documentation).\n-\
    \ Lotus Domino Driver for JDBC is another step in the JDBC commitment to open\
    \ standards and accessibility to Domino databases and services so that customers\
    \ can integrate Domino into any e-business solution regardless of their enterprise\
    \ configuration or tools selection.\n\nThe JDBC API is included in the Sun JDK\
    \ v1.1 and higher. The Lotus Domino Driver for JDBC (LDJ) are provided when you\
    \ download and install the Lotus Domino Driver for JDBC. The Lotus Domino Driver\
    \ for JDBC requires DLLs to connect to the Domino/Notes database. (This is the\
    \ non-Java compiled code referred to above).\n\n- If your Java program is running\
    \ on a client computer, then the Notes client must be installed.\n- If your Java\
    \ application is running on a server that is not running Domino, then the Notes\
    \ client must be installed and configured to connect to the Domino server.\n-\
    \ If your Java application is running on the Domino server (for example, running\
    \ as a Servlet on R5), then the Notes DLLs and API are already present and do\
    \ not need to be installed.\n\n## Knowledge of Notes API\n\n| |\n|---|---|\n|\
    \ You do not need to know the Notes API. The Lotus Domino Driver for JDBC shields\
    \ you from that and enables you to use the JDBC API to connect to Domino and SQL\
    \ to query, update, and manage Domino data. | |\n\nRefer to the URL http://www.lotus.com\
    \ for more information about the Lotus Domino Driver for JDBC.\n\n144 Linux Web\
    \ Hosting with WebSphere, DB2, and Domino\n\n## Appendix A. SQL scripts for creating\
    \ the USERSTUF tables\n\nThis appendix provides the source file listings for creating\
    \ the DB2 tables in our project.\n\n### A.1 The USERINFO table\n\n```\ncreate\
    \ table userinfo (\n  first_name varchar(20) not null,\n  last_name varchar(20)\
