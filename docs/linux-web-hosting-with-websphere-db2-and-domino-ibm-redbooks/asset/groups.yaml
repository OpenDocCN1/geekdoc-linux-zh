    # 2.3 Linux setup


    This section discusses the issues involved in setting up the Linux operating systems
    on our Netfinity servers. This section is not intended to cover all aspects of
    Linux installation, but merely highlight some actions that we have performed to
    make the Linux system run. Refer to the bibliography for reference to several
    books that have more information on setting up Linux on Netfinity servers.


    This section is divided into:


    +   - Section 2.3.1, "Disk partitioning" on page 11, which discusses our disk
    partitioning strategy


    +   - Section 2.3.2, "RedHat installation" on page 12, which discusses the RedHot
    Version 6.2 installation


    +   - Section 2.3.3, "Caldera EDesktop" on page 13 which discusses the Caldera
    EDesktop Version 2.4 installation


    # 2.3.1 Disk partitioning


    Our disk partitioning was based on the defaults for each Linux distribution. For
    example, output from the df command for the RedHat installation is shown in Figure
    3.


    | Filesystem | 1k-blocks | Used | Available |% | Mounted on |

    | /dev/sda8 | 256667 | 31415 | 212000 | 13% | |

    | /dev/sda1 | 23302 | 2875 | 19224 | 13% | /boot |

    | /dev/sda6 | 3842376 | 20096 | 3645092 | 0% | /home |

    | /dev/sda5 | 3842376 | 440776 | 3206412 | 12% | /usr |

    | /dev/sda7 | 256667 | 6117 | 237298 | 3% | /var |


    Figure 3. Output of the df command


    Specific directories will be used as follows:


    +   - /home will contain the DB2 instance directory.


    +   - /usr will contain the DB2 rpm installation


    +   - Java, IBM HTTP Server, and WebSphere are installed under /opt. For simplicity,
    we make a symbolic link from /opt to /usr/opt rather than re-creating all the
    partitions by hand. Since the Domino installation uses a shell script that allows
    us to specify a directory for installation, we also choose to install Domino in
    /opt.'
  - '[PAGE 21]


    # 2.3.2 RedHat installation


    Installation of RedHat is easy, simply boot off the RedHat 6.2 CD-ROM and choose
    the defaults for most options, with the following exceptions:


    +   - Install type


    We chose Server for our installation type.


    +   - Network Configuration


    Our network was token ring based; hence, we chose to set up the tr0 interface
    for the token ring. This option is available only from a GUI setup, and it is
    not available when installing in text mode.


    +   - Account Configuration


    As previously mentioned in 2.2, “Installation overview” on page 8, we created
    a userID called admin.


    +   - X Configuration


    Since we would also need an X11 server to configure WebSphere using a Web browser,
    we upgraded the Linux installation for the front-end server to include X11. Remember
    to install at least the following for X11:


    +   - XFree86

    - XFree86 SVGA server

    - A XFree86 server specific for the video card (in our case, we used the XFree86
    S3 server)

    - X11R6 Contrib

    - Xconfigurator

    - various XFree86 fonts

    - XFree86 libraries

    - XFree86 xfs


    We found that choosing the combination of IBM G74 and S3 TrioD with 4 MB RAM would
    not pass the X Configuration page’s test-configuration button. The fix was to
    specify a custom monitor as SVGA non-interlaced, 50-90 Hz.


    Once installation was complete, the CD was removed from the CD-ROM drive, and
    the server was rebooted.


    We can now proceed to the application installation phase.'
