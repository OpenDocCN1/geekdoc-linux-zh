    \ Card\n\n# Installation overview\n\nThis section provides a series of global\
    \ steps that were used to install the systems. The steps that are presented in\
    \ this section can serve as either the overview or as a checklist to perform the\
    \ installation. Detailed discussion of each step is provided in the subsequent\
    \ sections.\n\nWe present the steps for the backend server first, ensuring the\
    \ databases are available for access, then the steps for the front-end servers,\
    \ and then verify that the front-end servers can access the backend database.\n\
