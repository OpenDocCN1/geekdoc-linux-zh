    # 4.1.3.2 Starting and stopping the Domino server


    The Domino startup process using a command line is as follows:


    +   1. Log on with userID notes.


    +   2. Change to the Domino data directory. We have the data directory in

    /local/notesdata.


    +   3. Execute the command:


    ```

    /opt/lotus/bin/server

    where the /opt/lotus is the Domino server install path.

    ```


    The server console is started, and it displays the startup status and other

    Domino messages.


    To stop the Domino server from the server console, issue the quit command.

    The Domino server will shutdown after 10 seconds.


    In order to be able to start Domino automatically, we develop a

    start_domino.sh script. The complete listing of the script is provided in

    Appendix E.1, "start_domino.sh" on page 209. The script performs the

    following sequence of tasks:


    +   1. Ensure log on using the notes userid.'
  - '[PAGE 132]


    2. Ensure the Domino server is not running.

    3. Check and remove the IPC shared memory that is owned by userID notes.

    4. Start the Domino server.


    Having created the start_domino.sh script, we can start the Domino server automatically.
    We add an entry in the /etc/initab file as follows:


    ```

    notes:2:once -c /bin/su notes -c /home/notes/start_domino.sh

    ```


    If Domino exits abnormally, the Domino Inter-Process Communication (IPC) resources
    need to be cleaned up before restarting Domino. In order to clean Domino after
    a crash, perform the following steps:


    +   1. Kill all Domino processes of the server that failed from the userID.

    2. Remove the associated Inter-Process Communication (IPC) resources.

    3. List the corrupted shared memory and semaphores using the ipcs command. The
    -m option shows the shared memories, and the -s option shows the semaphores.

    4. Remove any shared memory and semaphores. Use ipcrm $id to remove shared memory,
    and use ipcrm sem $id to remove semaphores.

    5. Remove the -notes.lock file from the Domino directory.


    The cleanup_domino script performs the above steps and is provided in Appendix
    E.2, "cleanup_domino.sh" on page 210.


    # 4.2 Facility monitoring


    This section provides an overview of monitoring the processes for the components
    of the Web solution we built. Various other methods may be employed to ensure
    the availability and performance of the system.


    # 4.2.1 Monitoring WebSphere


    The loaded servlets can be viewed through the Server Execution Analysis screens
    as follows:


    +   1. Log on to the WebSphere administration to get the WebSphere Introduction
    window as shown in Figure 88 on page 115.

    2. Select Server Execution Analysis.

    3. Select Monitors.

    4. Select Loaded Servlets to display the monitor window as shown in Figure 98
    on page 124.'
