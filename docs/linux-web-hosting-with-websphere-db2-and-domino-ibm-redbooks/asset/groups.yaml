    ## 1.2 电子商务模式


    电子商务模式旨在为构建电子商务系统提供一种快速备用的设计模式，包括系统架构和指南。这些模式被归类在以下方案中：


    - 用户到业务

    - 用户到在线购买

    - 业务到业务 (B2B)

    - 用户到数据

    - 用户到用户

    - 应用程序集成


    有关这些电子商务模式的更多信息，请参阅 IBM developerWorks 网站：http://www.ibm.com/software/developer/web/patterns


    我们选择实现这些模式中最常见的子集，即用户到在线购买，它是用户到业务模式的子集。我们选择的应用程序拓扑是 Web-ub 方案，这意味着我们在 Web 服务器中从零创建应用程序，而不进行后端集成。第
    3 页的图 1 显示了该模式的理想运行时拓扑。


    在第 3 页的图 1 中，企业的电子商务系统跨越了非军事化区（DMZ）到企业内部网络。以下组件构成了用户到在线购买模式的电子商务解决方案：


    - 协议防火墙过滤掉不需要的有害协议包。它只允许入请求进入特定机器和特定端口。

    - 请求分发器充当多个 Web 服务器系统的负载均衡。它将请求路由到特定的 Web 服务器以促进整体负载平衡，从而提高整体吞吐量。

    - 商务服务器是带有应用程序服务器的 Web 服务器，处理来自互联网的 HTTP 请求。

    - 域防火墙通过仅允许 DMZ 中的某些机器向内部网络发送数据包来保护内部网络。

    - DB 服务器为 Web 应用程序提供数据库支持。数据库数据被认为是安全的，因为它同时受到协议防火墙和域防火墙的保护。


    | 外部世界 | 非军事化区 (DMZ) | 内部网络 |

    | :--- | :--- | :--- |

    | 购物者不在此完成订单 | Web 服务器 | 应用程序节点 |

    | 零售客户互联网 | 商务服务器节点 | 应用程序节点 |

    | | Web 服务器到后端的（可选） | 应用程序节点 |

    | | DB 服务器节点 | 数据库 |

    | | 静态页面 - 促销 | 内容管理节点 |


    图 1. 用户到在线购买的运行时拓扑


    电子商务模式还包括产品选择。然而，目前产品选择中没有选项；因此，我们必须定义产品选择。我们在商务节点中实现了 IBM HTTP 服务器和 WebSphere
    应用程序服务器；而在 DB 服务器上，我们放置了 IBM DB2 和 Lotus Domino。为了简单起见，我们没有实现分发器。


    关于用户到业务和用户到在线购买模式及其指南的深入，请参考《电子商务模式：使用 WebSphere Advanced 版的拓扑 1 和 2》。


    ## 第 1 章 项目介绍


    ## 1.3 Web Web


    本红书是根据奥斯汀的一个项目制作的。红书旨在展示使用 Linux 作为操作系统为通用 Web 托管和电子商务提供高级平台的能力。我们采取的方法实际上是在 Linux
    上构建一个提供示例电子商务功能的 Web 服务器。我们使用的 Linux 发行版是 RedHat 6.2 版本和 CalderaDesktop 2.4 版本。该项目使用的软件包括：


    - IBM WebSphere 2.0 版本

    - IBM server 1.3 版本

    - IBM Database2 6.1 版本

    - Lotus Domino 5.0 版本


    该项目进一步扩展，以提供有关操作 Linux 服务器的一些考虑。考虑涵盖了从日常 Linux 操作到管理 Web 服务器可能需要执行的特定任务。我们选择提供的示例应用程序是一个自定义的
    Web 网站。我们提供的 Web 应用程序包含：


    - 使用 DB2 的动态管理

    - 使用 Servlet、Java Server Page (JSP) 和 Java beans 的动态页面

    - 使用 WebSphere 应用程序服务器的 Servlet 管理

    - 访问 Lotus Domino 数据库（注：此处原文列表似乎存在对应关系错位，已按原意翻译）

    - 动态用户管理等


    将上述功能整合在一起展示了我们遇到的许多互操作性问题。但构建一个运行的解决方案本身也是一项任务。


    ## 1.4 文档结构


    本红书旨在为使用 Linux 服务器和 IBM 产品的管理员提供使用和管理信息。我们不涵盖产品的基本安装。假设读者具备基础 HTML 技能、Java 编程和
    Linux 管理知识。本文包含以下章节：


    - 第 1 章，“项目介绍”位于第 1 页，提供了项目的背景信息。

    - 第 2 章，“设置与配置”位于第 7 页，提供了我们执行的安装过程概述。安装过程大多是简述的，但产品工作所需的特定任务除外。

    - 第 3 章，“构建 Web 服务器”位于第 53 页，讨论了我们构建 Web 服务器的步骤。本章讨论了我们使用的编程结构和构建的代码。涵盖的技术包括：

    - 使用 JDBC 访问 DB2

    - 使用 JDBC 访问 Domino

    - 通用访问

    - Java Server Page 实现

    - Java beans 编程

    - 第 4 章，“操作考虑”位于第 107 页，展示了确保 Web 服务器运行可能执行的一些基本操作。这里讨论的操作是设施的基本启动和停止、常规维护以及一些监控和故障排除技巧。

    - 第 5 章，“扩展案例”位于第 139 页，讨论了一些可以实现但由于时间或产品限制尚未实现的内容。


    我们提供的附录包含了整个项目中使用的各种源代码和 HTML 文件。我们还提供了一个光盘，包含了所有使用的 Java 文件、脚本、HTML 文件和 JSP 文件的源代码。使用光盘请参考第
    211 页的附录 F，“使用材料”。


