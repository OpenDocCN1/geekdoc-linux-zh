    ## 2.4.3 IBM JDK


    This section discusses the installation procedure for the Java Development Kit
    (JDK) in our project.


    ### 2.4.3.1 Pre-installation of IBM JDK


    Before installing IBM JDK, you should ensure a clean installation of the Java
    environment. This involves removing any existing Java machine and runtime environments,
    unless they are necessary for other applications. For example, we queried the
    Linux distributions with the command:


    ```

    rpm -qa | grep jdk

    ```


    We found that Caldera installs jdk-1.2.2 by default. Hence the default JDK was
    removed with the command:


    ```

    rpm -e jdk-1.2.2

    ```


    ### 2.4.3.2 Installing IBM JDK


    Our target installation is in the /opt directory. The distribution is in tar format
    and gzipped. Logged as the root user, we change the working directory to the target
    installation directory, /opt, then used the tar xzf command to decompress and
    extract this file, ibm-jdk-118-linux-x86.tgz.


    Since we will install IBM HTTP Server and WebSphere after the JDK, we also define
    and export the environment variable JAVA_HOME to indicate where the JDK has been
    installed. Figure 23 shows the results of issuing the tar and export commands
    on our front-end server.


    ```

    [root@test2 /opt]$# tar xzf /mnt/cdrom/Java/ibm-jdk-118-linux-x86.tgz

    [root@test2 /opt]$# export JAVA_HOME=/opt/jdk118/

    ```

    Figure 23. Installing JDK on the front-end server


    ## 2.4.4 IBM HTTP Server


    IBM HTTP Server installation is performed while logged as the root user. We encountered
    some problems using the Apache server that is bundled with RedHat 6.2 and Caldera
    2.4. If WebSphere is installed with the Apache module, and Apache restarted, Apache
    complains about the Apache1.3 API used by the WebSphere module. Figure 24 illustrates
    this error on RedHat 6.2:


    ```

    [root@bdtest conf]# /etc/init.d/httpd start

    Starting httpd: [Fri May 5 23:05] [warn] Loaded /opt/WebAS/plugins/linux/mod_server.so
    uses plain Apache1.3 API, this module might crash! (please recompile it)

    [FAILED]

    ```

    Figure 24. Apache failure loading WebSphere module


    Because of this error, Apache will not start. Hence we had to remove the Apache
    server and install IBM HTTP Server 1.3.6.


    ### 2.4.4.1 Removing Apache server


    The Apache module should be removed, using the rpm -e command, in the following
    order:


    - 1. Remove the mod_perl package with the command:

    ```

    rpm -e mod_perl

    ```

    - 2. Remove the php package with the command:

    ```

    rpm -e php

    ```

    For Caldera, the command is:

    ```

    rpm -e mod_php-3.0.12-5

    ```

    - 3. Remove the Apache package with the command:

    ```

    rpm -e apache

    ```

    The following directories relating to the Apache Web server should be removed
    as follows:


    - For directory /var/log/httpd, use the command:

    ```

    rm -f /var/log/httpd

    ```

    - For directory /home/httpd, use the command:

    ```

    rm -f /home/httpd

    ```

    - For directory /etc/httpd, use the command:

    ```

    rm -f /etc/httpd

    ```


    ### Removing /etc/httpd on Caldera


    On Caldera installations, the /etc/httpd directory is not used. Hence there is
    no requirement to remove this directory (as it does not exist). Figure 25 shows
    the results of issuing these commands on our front-end server with a RedHat installation:


    ```

    [root@dbtest2 /opt#] rpm -e mod_perl

    [root@dbtest2 /opt#] rpm -e php

    [root@dbtest2 /opt#] rpm -e apache

    cannot remove /var/log/httpd - directory empty

    cannot remove /home/http/html - directory empty

    cannot remove /home/httpd - directory empty

    cannot remove /etc/httpd/conf - directory empty

    [root@dbtest2 /opt#] rm -rf /var/log/httpd

    [root@dbtest2 /opt#] rm -rf /home/httpd

    [root@dbtest2 /opt#] rm -rf /etc/httpd

    ```

    Figure 25. Installing Apache Web server


    We can now proceed with installing the IBM HTTP Server.


    ## 2.4.4.2 IBM HTTP Server installation


    The installation steps are as follows:


    - 1. Install the IBM HTTP Server package. In our instance the file is called IBM_HTTP_SERVER-1.3.6.1.i386.rpm.
    See Figure 26 for the results of the rpm -i command.


    ```

    [root@dbtest2 /opt#] rpm -i /mnt/cdrom/ibmhtserver/2.1/IBM_HTTP_Server-1-3.6-1.i386.rpm

    httpd: cannot determine local name.

    Use the ServerName directive to set it manually.

    /opt/IBMHTTServer/bin/apachectl start: httpd could not be started

    execution of script failed

    ```

    Figure 26. rpm installation of IBM HTTP Server


    - 2. Set ServerName directive


    In the /opt/IBMHTTServer/conf directory, we had to edit the httpd.conf, adding
    the ServerName with our hostname. Figure 27 on page 36

