    ### 2.4.2.3 Connecting to Domino


    We can perform many functions using a Web browser, but we still need the Domino
    Administrator and client to perform any tasks. We need to extract the ID file
    before performing any administration on the machine.


    ![](img/fa6240c5500d6e5eed673bb325a11d43_34_0.png)


    1. Open the address book using the URL: http://btest3.itsc.austin.ibm.com/names.nsf

    2. Enter the administrator user ID of Domino and its password as provided in the
    Administration setting window.

    3. Click the People view and open the Person document for the administrator created
    earlier.


    Netscape


    If you are using Netscape, you may have to rename the ID file to USER.ID. To access
    the Domino server with our Domino Administrator or client, follow these steps:


    1. Open Notes Client and switch to the USER.ID file we downloaded earlier.

    2. Click on the Administrator or Designer icon.

    3. For Designer, choose File -> Database -> Open. After entering the server name
    or IP address of the new server, a few seconds, the Notes client displays the
    databases available for the new server.

    For Administrator, choose File -> Open Server and specify the server name or IP
    address of the new server and click Open.


