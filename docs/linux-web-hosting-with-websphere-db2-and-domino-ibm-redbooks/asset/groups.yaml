    - 字段长度（Field length）\n  这代表字段的长度（如果适用）。例如，char 或 varchar 类型需要长度，date、timestamp\
    \ 或 int 类型不需要。\n- 可空性（Nullable condition）\n  最后一个属性，可空性，是为了跟踪该字段是否可以留空、未定义或必须填写。例如，0\
    \ 长度字符串；它不是空字符串。\n\n我们构建的数据库结构由图 54 所示的实体关系图表示。\n\n![](img/fa6240c5500d6e5eed673bb325a11d43_73_0.png)\n\
    \n我们的 DB2 数据库结构实体关系图\n\n## USERVERIFY\n\nUSERVERIFY 表包含用户名和密码。此表的字段如表 1 所示。\n\n\
    表 1. USERVERIFY 数据库表\n\n| 字段名 | 数据类型 | 长度 | 可空 |\n| --- | --- | --- | --- |\n\
    | username | varchar | 20 | no |\n| password | varchar | 20 | no |\n\n用户名字段将是此表的搜索键；因此，我们也将将其分配为表的主键。\n\
    \n用户名和密码都不允许为空。\n\n"
