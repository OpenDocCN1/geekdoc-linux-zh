    #  4.2.2 DB2 server monitoring


    There are two main monitoring tools included with DB2. These are:


    +   * DB2 Performance Monitor


    The Performance Monitor provides information about the state of the DB2 Universal
    Database and the data it controls. It is a graphical utility that can be customized
    for our database environment. We can define thresholds or zones that trigger warnings
    or alarms when the values being collected by the Performance Monitor are not within
    acceptable ranges.

    Use the tool when we need to monitor an existing problem or when we want to observe
    the performance of our system. It allows us to take a snapshot of database activity
    and performance data at a point in time.


    124 Linux Web Hosting with WebSphere, DB2, and Domino'
  - '[PAGE 134]


    These snapshots are used for comparison over time. Each point on the graph represents
    a data value.


    This information can help us identify and analyze potential problems or identify
    exception conditions that are based on thresholds that we set. We use the performance
    tool if we need to know the performance of the database manager and its database
    applications at a single point in time and to look at trends over time. We can
    also use it to get a visual overview of what elements are in a state of alert.
    This helps identify which parameters may need tuning. We can then look closely
    at the parameters that have been set for that element and change them to improve
    performance.


    +   • DB2 event monitors


    In contrast to taking a point in time snapshot the DB2 Performance Monitor, a
    DB2 event monitor collects information on database activities over a period of
    time. This collected information provides a good summary of the activity for a
    particular database event, for example, a database connection or an SQL statement.


    Event monitoring records the state of the database at the time that the specific
    events occur. It allows us to obtain a trace of the activity on the database.
    Event monitor records are stored and analyzed after the data has been captured.
    We use the event monitor when we need to know how a transaction took or, for example,
    how much CPU an SQL statement used. We then use the Event Analyzer to read the
    data from the event monitor.


    Apart from these two tools, we should also regularly back up and analyze the DB2
    diagnostic log file, db2diag.log. See Section 4.4.2, "DB2 diagnostic log file"
    on page 136 for more information on this. Examine this log file for signs of potential
    problems, for example, running out of disk space.


