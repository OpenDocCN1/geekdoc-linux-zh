    \ the product that constitutes the application that is running, which is categorized\
    \ into:\n\n- IBM HTTP server\n- IBM WebSphere Application Server\n- IBM Database\
    \ 2\n- Lotus Domino Enterprise Server\n\nThe discussion is divided into:\n\n-\
