    \n- 第 107 页第 4.1.1 节，“IBM HTTP Server 和 WebSphere 管理”描述了 Web 服务器管理。\n- 第 117 页第\
    \ 4.1.2 节，“DB2 操作”描述了 DB2 运行考虑。\n- 第 119 页第 4.1.3 节，“Domino 操作”描述了 Domino 运行考虑。\n\
    \n### 4.1.1 IBM HTTP Server 和 WebSphere 管理\n\n基本上，IBM HTTP Server 是一个 Apache Web\
    \ 服务器。有几个优秀的 Web 页面讨论了 HTTP 服务器的管理，例如：\n\n- http://www.ibm.com/software/Web servers\n\
    - http://www.apache.org\n\n本节将在后续章节提供 IBM HTTP Server 和 WebSphere 的一些管理概述：\n\n\
    - 第 108 页第 4.1.1.1.1 节，“Web 服务器启动和关闭”显示了 Web 服务器的手动启动和停止。\n- 第 109 页第 4.1.1.1.2\
    \ 节，“IBM HTTP Server 管理服务器”显示了 IBM HTTP Server 管理客户端的概述。\n- 第 113 页第 4.1.1.1.3\
    \ 节，“使用 WebSphere 管理 Servlet”提供了 WebSphere Servlet 管理的概述。\n\n### 4.1.1.1 Web 服务器启动和关闭\n\
    \n正如第 40 页第 2.4.5.2 节“验证 WebSphere 安装”所讨论，WebSphere 作为 IBM HTTP Server 的模块插件运行。因此，WebSphere\
    \ 功能随 IBM HTTP Server 同时启动和停止。\n\nIBM HTTP Server 启动一组 http 进程，而 WebSphere 启动一组\
    \ Java 进程。IBM HTTP Server 的手动命令为：\n\n- 启动 HTTP 服务器：\n  /etc/rc.d/init/ibmhttpd\
    \ start\n- 通过发送 SIGHUP 信号重启 HTTP 服务器：\n  /etc/rc.d/init/ibmhttpd restart\n- 优雅重启\
    \ HTTP 服务器：\n  /etc/rc.d/init/ibmhttpd graceful\n- 停止 HTTP 服务器：\n  /etc/rc.d/init/ibmhttpd\
    \ stop\n\n这些命令的输出如图 82 所示。\n\n```bash\n[root@bdtest1 init.d]# /etc/rc.d/init/ibmhttpd\
    \ stop\n/etc/rc.d/init/ibmhttpd stop: httpd stopped\n[root@bdtest1 init.d]# /etc/rc.d/init/ibmhttpd\
    \ start\n/etc/rc.d/init/ibmhttpd start: httpd started\n[root@bdtest1 init.d]#\
    \ /etc/rc.d/init/ibmhttpd restart\n/etc/rc.d/init/ibmhttpd restart: httpd restarted\n\
    [root@bdtest1 init.d]# /etc/rc.d/init/ibmhttpd graceful\n/etc/rc.d/init/ibmhttpd\
    \ graceful: httpd gracefully restarted\n```\n图 82. httpd 命令的输出\n\n如果需要快速杀死服务器且上述命令失败，服务器会将父进程\
    \ ID 保存在名为 httpd.pid 的文件中。该文件位于 /opt/IBMHTTPServer/logs/。向此进程发送 TERM 信号将优雅地停止服务器。一旦执行了所需的命令，可以通过以下命令检查是否成功：\n\
    \n```bash\nps ax | grep httpd\n```\n\n此命令的输出与图 83 类似。注意，在我们的示例中启动了七个 http 服务器，只需杀死父\
    \ ID 即可停止所有进程。\n\n```bash\n[root@dbtest1]# ps ax | grep httpd\n12571 S 0:00 /opt/IBMHTTPServer/bin/httpd\n\
    13165 S 0:00 /opt/IBMHTTPServer/bin/httpd\n13166 S 0:00 /opt/IBMHTTPServer/bin/httpd\n\
    13167 S 0:00 /opt/IBMHTTPServer/bin/httpd\n13168 S 0:00 /opt/IBMHTTPServer/bin/httpd\n\
    13169 S 0:00 /opt/IBMHTTPServer/bin/httpd\n13180 pts/13 S 0:00 grep httpd\n```\n\
    图 83. ps.ax 输出\n\n在停止 HTTP 服务器之前，使用 killall 命令确保由 WebSphere 启动的 Java 进程也终止。4.1.1.2\
    \ IBM HTTP 服务器管理\n\n本节提供了安装和配置 IBM HTTP 服务器管理的步骤。我们不涉及如何使用控制台安装服务器的细节。步骤如下：\n\n\
