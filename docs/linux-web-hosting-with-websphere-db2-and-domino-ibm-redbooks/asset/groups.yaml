    ## 2.4.2.5 Configure Domino server using a Web browser.


    Now, we will explain how we configured the Domino server in our project. In this
    description, we used a Web browser to configure the Domino server. We can also
    configure the Domino server using the Domino Administration client.


    We configure Domino to use port 8000, for anonymous access using the following
    steps:


    1. 1. Access the Domino web administrator by pointing the Web browser to the appropriate
    URL on our backend server, in this case:

    ```

    http://bdtest3/webadmin.nsf

    ```

    2. The Domino server will ask for the Administrator userid and password.

    3. A successful login to the server will present a screen similar to Figure 19
    on page 28 in the Web browser.


