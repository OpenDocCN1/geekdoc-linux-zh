    a null string, the link to /servlet/VBDList10?as400-item1 would not be displayed
    on the home page.


    # 3.7 Accessing data through a Java bean


    Java beans are components designed to be on client systems. They are Java classes
    that conform to certain coding standards. They can be described in terms of their
    properties, methods, and events. Java beans may be packaged with a special descriptor
    class called a BeanInfo and special property editor classes in a JAR file. Java
    beans may or not be visual components. For more information, see the Java bean
    documentation at:


    http://www.javascript.com/beans/docs


    A bean was chosen for one instance where the database was queried for information
    pertaining to previous orders. We create the following coding to construct access
    to the bean for the list of orders:


    +   A bean is called from within a JSP using the <BEAN .../></BEAN> tags. The
    JSP can then access the values contained within the bean request object. Figure
    80 on page 104 illustrates how we accomplished this.'
  - '[PAGE 113]


    ```

    <bean

    name="orders"

    type="penguins.access.db2.Orders"

    >

    </bean>

    ```


    **Figure 80.** Bean tag in the listordersPage.jsp


    The JSP page, listordersPage.jsp, picks up the bean name of orders and finds the
    instance of penguins.access.db2. Orders from the Request object., the information
    contained in bean, is accessible via the public methods. See Section 3.7.0.1,
    "AccessUserstuf action=listorders" on page 104, where we discuss the Orders bean.


    +   We use the bean to print the previous orders in a table. This is accomplished
    by iterating through all the orders contained in the bean with the following code:


    ```

    for(Enumeration e=orders.orderIDs(); e.hasMoreElements(); {

    String key=(String) e.nextElement();

    out.println("<tr><td>"+key+"+"</td></tr>");

    out.println("<td><td>"+orders.timestamp(key)+""+"</td></tr>");

    out.println("<td><td>"+orders.productID(key)+""+"</td></tr>");

    }

    ```


    The complete list of listordersPage.jsp is provided in Appendix D.19, "Listorderspage.jsp"
    on page 196


    # 3.7.0.1 AccessUserstuf action=listorders


    The following sequence of tasks is performed when the servlet is invoked with
    the action parameter retrieves the value of listorders:


    +   1. The listorders retrieves the username and password from the Session object
    by using the getUsername and getPassword method:


    ```

    String username=getUsername(session);

    String password=getPassword(session);

    ```


    +   2. We verify the username and password pair using the passwdmatch method previously
    defined in Section 3.5.3.4, "AccessUserstuf action=login" on page 89. If successful,
    we proceed to the next step or redirect to an error page regarding the username
    and authentication error.'
  - "[PAGE 114]\n\n3. The orders list for a user can be retrieved as an SQL query\
    \ from the USERORDERS database table. It is a list of order IDs and associated\
    \ timestamps and product IDs. Since we have no idea how long this list can grow\
    \ for a user, we will use a Java bean called Orders to encapsulate this information\
    \ and return the information via the bean through the Session object.\n\nLet us\
    \ define what the Orders bean must be able to do:\n\n+   - Add an order, which\
    \ consists of the elements order_id, timestamp, and product_id\n- List all the\
    \ orders\n- Retrieve the timestamp for a particular order_id\n- Retrieve the product_id\
    \ for a particular order_id\n\nSo the bean class must have at least the following\
    \ interface:\n\n```\npublic class Orders {\n    public void add(String order_id,\
