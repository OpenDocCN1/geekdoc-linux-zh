    Linux 下 Web 服务器开发的快速通道


    Linux 作为一种开源操作系统，被认为是未来电子商务领域的主要关键系统之一。IBM 在 Linux 上提供了一系列电子商务应用程序，使其成为一个先进且稳健的电子商务平台。IBM
    的核心产品包括 WebSphere 应用程序服务器、IBM Database 2 和 Lotus Domino。


    Domino 与 DB2 数据库并肩运行示例


    本书讨论了如何将 Linux 实现为电子商务平台。书中详细提供了关于基于电子商务模式设计系统、软件安装与配置、开发电子商务解决方案以及操作 Web 服务器的详细信息。本书使管理员和程序员能够快速跟上
