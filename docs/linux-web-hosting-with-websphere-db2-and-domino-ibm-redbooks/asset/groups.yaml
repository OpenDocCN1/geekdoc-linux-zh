    • pdksh (public domain Korn shell)

    • glibc 2.07 or higher

    • libstdc++ Version 2.8.0


    For RedHat Version 6.2 and CalderaDesktop Version 2.4, all these requirements
    were met except for the existence of the pdksh package.


