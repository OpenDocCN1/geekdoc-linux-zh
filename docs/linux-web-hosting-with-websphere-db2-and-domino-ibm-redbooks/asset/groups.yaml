    \ following sections:\n\n- Section 4.1.1, \"IBM HTTP Server and WebSphere administration\"\
    \ on page 107 describes Web server administration.\n- Section 4.1.2, \"DB2 operation\"\
    \ on page 117 describes DB2 operational considerations.\n- Section 4.1.3, \"Domino\
    \ operation\" on page 119 describes Domino operational considerations.\n\n###\
    \ 4.1.1 IBM HTTP Server and WebSphere administration\n\nBasically, the IBM HTTP\
    \ Server is an Apache web server. There are several excellent Web pages that discusses\
    \ the administration of the HTTP server, such as:\n\n- http://www.ibm.com/software/Web\
    \ servers\n- http://www.apache.org\n\nThis section provides some administration\
