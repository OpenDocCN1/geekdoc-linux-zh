    \ to a data server product. This is very useful if the data server agreement limits\
    \ you to a certain number of concurrent users.\n\nThere is a good introduction\
    \ to connection manager in the WebSphere documentation under the IBMWebAS directory.\
    \ In our test system, it is at URL:\n\n```\nhttp://servlet1/IBMWebAS/doc/whatis/icmgr.html\n\
    ```\n\n# 5.1.1.2 User profile tracking\n\nThe WebSphere Application Server has\
    \ an API, called UserProfile, that makes it easy to maintain persistent information\
    \ about your Web site visitors. The UserProfile enables you to store the user's\
    \ data in a database without coding any SQL.\n\nThe UserProfile contains the interface\
    \ to store the user's personal data, such as name, postal and e-mail addresses,\
    \ telephone numbers, and shopping cart information. For further information, see\
    \ the UserProfile API Reference in the WebSphere documentation under the IBMWebAS\
    \ directory. In our test system, it is at URL:\n\n```\nhttp://servlet1/IBMWebAS/doc/apid/Package-com.ibm.servlet.personalization.userprofile.html\n\
    ```\n\n# 5.1.2 IBM HTTP Server\n\nThe following advanced features of IBM HTTP\
    \ Server are available but not utilized in our project:\n\n- Section 5.1.2.1,\
    \ \"SSL\" on page 141\n- Section 5.1.2.2, \"Caching and dynamic pages\" on page\
    \ 141\n\n# 5.1.2.1 SSL\n\nThe IBM HTTP Server features include easy installation\
    \ support for SSL secure connections.\n\nSecure Sockets Layer (SSL) is a protocol\
    \ that provides privacy and integrity between two applications using TCPIP. HTTP\
    \ can use SSL for secure communications.\n\nThe data travelling between the client\
    \ and server is encrypted by a secret key algorithm. A public-key algorithm is\
    \ used for the exchange of the secret encryption key and for encrypting the digital\
    \ signature in the servers. With the server certificate, the client can verify\
    \ the server's identity.\n\nOnce your server has a digital certificate, SSL-enabled\
    \ browsers, such as Netscape Navigator and Microsoft Internet Explorer, can communicate\
    \ securely with your server using the SSL protocol. The IBM HTTP Server powered\
    \ by Apache supports client authentication, configurable cipher specifications\
    \ and session ID caching for improving SSL performance on the UNIX platforms.\
    \ For further info on, refer to:\n\n- http://home.netscape.com/eng/ssl/\n- http://www.ibm.com/software/webservers/https/\n\
    \n# 5.1.2.2 Caching and dynamic pages\n\nBy default, most Web browsers and proxy\
    \ cache Web pages. In the case of JSP files, HTML files, and servlets, these Web\
    \ pages are dynamically generated and may change for each attempted access.\n\n\
    In order to prevent caching, and thus access the newly generated dynamic data,\
    \ we can add the following code in a Java Server Page or servlet to prevent Web\
    \ browsers from caching JSP/SHTML files and servlets:\n\n```\nresponse.setHeader(\"\
    Pragma\", \"no-cache\");\nresponse.setHeader(\"Expires\", \"0\");\nresponse.setHeader(\"\
    Cache-Control\", \"no-cache\");\n```\n\nUse the following code to prevent a proxy\
    \ server from sharing cached pages:\n\n```\nresponse.setHeader(\"Cache-Control\"\
    , \"private\");\n```\n\nBoth of these headers can be combined to prevent caching.\n\
    \n# 5.2 Product limitations in Linux\n\nThe level of WebSphere in Linux is lagging\
    \ from the available version in other platforms (such as Windows NT or AIX). This\
    \ poses a considerable restriction to our ability to utilize several of the new\
    \ features that make the e-business development easier, such as the RequestDispatcher\
    \ class. See Section 5.2.1, \"The RequestDispatcher class\" on page 142 for a\
    \ more comprehensive discussion of this class.\n\nIn our project, we use the Lotus\
    \ Domino database using CORBA. Lotus Domino server can also be accessed by JDBC.\
    \ However, the Lotus Domino Driver for JDBC is only available for a number of\
    \ platforms, and Linux is not among them. See Section 5.2.2, \"JDBC connections\
    \ for Domino\" on page 143 for a more comprehensive discussion of this feature\
    \ from Lotus.\n\n# 5.2.1 The RequestDispatcher class\n\nThe basic use of RequestDispatcher\
    \ is to pass the current request to another program (servlet or JSP). A Request\
    \ Dispatcher has two primary methods for including the response of another program\
    \ or forwarding the request of the current program to.\n\nIncluding the response\
    \ from another program requires the use of the method:\n\n```\naRequestDispatcher.include(request,\
    \ response)\n```\n\nWe would use this if we want to call another servlet from\
    \ our current servlet, then perform processing in the current servlet after calling\
    \ this other servlet\n\nForwarding the request to another program requires the\
    \ use of the method:\n\n```\naRequestDispatcher.forward(request, response)\n```\n\
    \nWe would use this to forward the request on to another servlet, and then allow\
    \ this new servlet to return the response back to the client directly.\n\nUnfortunately\
    \ for us, the RequestDispatcher class is only available in the Java SDK 2.1 API\
    \ for the javax.servlet class (supported and extended in WebSphere 3.02). In our\
    \ servlets, to be run under WebSphere 2.03 (which only supports and extends SDK\
    \ 2.0), we were forced to use the deprecated callPage method in package com.sun.servlet.http.\
    \ This also explains the use of the HttpServletResponse and HttpServletRequest\
    \ objects in Java code in servlet AccessUserstuff.\n"
