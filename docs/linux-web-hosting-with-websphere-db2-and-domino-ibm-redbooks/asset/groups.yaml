    The viewname must contain the name of a view or a folder in the Domino database.
    The view or folder name must be specified exactly.


    # Access to documents with ViewNavigator


    ViewNavigator is an object that is created under the View object and selects the
    entries in a selected view and navigates the view to access a specific document
    in the view.


    ViewNavigator can be created through several methods:


    +   * createViewNav


    Creates a view navigator for all the entries in a view, for example:


    ```

    Session s = NotesFactory.createSession("bdest3:8000");

    Database db = s.getDatabase("Redbooks");

    View view = db.getView("platform sorted");

    ViewNavigator viewnav = view.createViewNav();

    ```


    This program will get all entries from the Redbooks database on server bdetest1
    from the view platform sorted. The content of viewnav may have a category or document
    depending on the structure of the database.


    +   * createViewNavFromCategory


    This method will create a view navigator for all the entries in a view under a
    specified category. For example, we use this methods to get all entries in the
    selected category of the Redbooks database:


    ```

    Session s = NotesFactory.createSession("bdest3:8000");

    Database db = s.getDatabase("Redbooks");

    View view = db.getView("platform sorted");

    ViewNavigator viewnav = view.createViewNavFromCategory("AS/400");

    ```


    This program will get all entries from the Redbooks database in server bdetest1
    on the view platform sorted and at the category AS/400.


    +   * createViewNavMaxLevel


    This method will create a view navigator for all entries in a view down to a specified
    level. For example, if we need to get all entries at the top level of view, we
    can use the following code:'
