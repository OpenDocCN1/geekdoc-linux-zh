- md: "\n| Servlet name | Function | Environment |\n| --- | --- | --- |\n| AccessUserstuff\
    \ | Primary interface to DB2. It handles both GET and POST method, and its action\
    \ is determined by a parameter called action. | DB2 and Beans |\n| VBDSearch |\
    \ Performs search to the Redbooks database. The search argument is stored in a\
    \ parameter called search. | Domino |\n| VBDList10 | List 10 latest book of a\
    \ category. The category is indicated by its first argument. | Domino |\n| VBDLatest\
    \ | Provide 10 latest published book from all category in the Redbooks database.\
    \ | Domino |\n| VDBOpen | Access the abstract of a redbook and display it in HTML.\
    \ | Domino |\n\n## 3.5.2 Maintaining state in HTTP\n\nHTTP is a stateless protocol.\
    \ To perform transactional activities, some kind of state must be maintained.\
    \ There are many ways of maintaining state that has been developed: Using cookies,\
    \ URL re-writing, hidden fields in the HTML form, and so on. The Java servlet\
    \ API implements access to state via the HttpSession object.\n\n### 3.5.2.1 Session\
    \ Tracking\n\nHttpSession is a technological implementation that is used to manage\
    \ sessions on the stateless HTTP protocol. It is part of the Java Servlet API,\
    \ and it is accessible in the Java Servlet development kit.\n\nThe HttpSession\
    \ object is the Java programming object that has a dictionary-like interface to\
    \ store user-defined data. Data can be stored in the HttpSession object with any\
    \ keyword, and the data is retrieved with that keyword.\n\nEach of the session\
    \ objects has its own ID. HttpSessions objects are related to the client using\
    \ their session ID. The session tracker uses the session ID to find the user's\
    \ session object. The session object is not sent between the Web client and the\
    \ server. Only the ID is passed back and forth between the Web client and the\
    \ Web server. This means that the session object is suitable to store the user's\
    \ secure data.\n\nSince there are many different ways to represent a session data,\
    \ the HttpSession provides a seamless, uniform way to access session data, uses\
    \ a cookie if the client Web browser supports, or it can also use URL rewriting\
    \ to save the session ID that is associated with the client.\n\nThe data that\
    \ is stored in the HttpSession object is shared across requests from the same\
    \ machine. Therefore, the HttpSession object is also suitable to store individual\
    \ session profile data from the client.\n\nThe HttpSession object is not persistent\
    \ data. It is deleted after a time out or by the invalidate method(). In order\
    \ to store data persistently, WebSphere provides a UserProfile (see Section 5.1.1.2,\
    \ \"User profile tracking\" on page 140).\n\nThe HttpSession description can be\
    \ found at\n\n```\nhttp://java.sun.com/products/servlet/2.1/api/java.servlet.http.HttpSession\n\
    ```\n\nMore information on session tracking can be found at:\n\n```\nhttp://java.sun.com/docs/books/tutorial/servlets/client-state/session-tracking.html\n\
    ```\n\n## 3.5.2 Using the HttpServletSession\n\nTo use these objects, we obtain\
    \ a session object, get or put values to this object, and invalidate it if we\
    \ need to remove the context.\n\n### Obtaining a session object\n\nTo obtain a\
    \ session object associated with the client, we use the getSession method (as\
    \ we assume req is of type HttpServletRequest)\n\n```\nboolean flag=true;\nHttpSession\
    \ session=req.getSession(flag);\n```\n\nThis obtains the current valid session\
    \ associated with this request from the client. The flag indicates whether a session\
    \ object should be created if it is not found.\n\n### Getting values from a session\
    \ object\n\nFor example, to get the username from the session, we use the get\
    \ method associated with the session object as follows:\n\n```\nString username=(String)\
    \ session.getAttribute(\"username\");\n```\n\n### Putting values to a session\
    \ object\n\nWe can also set values in the session using the putAttribute method.\
    \ In the following example, we associated the password key with a value of elephant:\n\
    \n```\nsession.setAttribute(\"password\",\"elephant\");\n```\n\n### Invalidating\
    \ a session object\n\nFinally, to invalidate the session instance, we use the\
    \ invalidate method as follows:\n\n```\nsession.invalidate();\n```\n\nThis may\
    \ be required during logout processing.\n\n## 3.5.3 Accessing DB2 via JDBC\n\n\
    The initial setup for a Java class to access DB2 using JDBC requires importing\
    \ the appropriate package, registering the DB2 driver, and creating the connection\
    \ to the DB2 database. This only needs to be done once.\n\nAfter that, each SQL\
    \ statement to execute requires a statement to be created, executed, and finally\
    \ closed.\n\nLastly, we give an example of what is required to write a Java servlet\
    \ to access DB2 database using JDBC.\n\n### 3.5.3.1 DB2 JDBC Drivers\n\nDB2 JDBC\
    \ main usages are for executing dynamic SQL statements and for supporting upper\
    \ layers, such as SQLJ and IBM DataAccess beans.\n\nDB2 provides two JDBC drivers:\
    \ a native API Type 2 driver and a net protocol Type 3 driver. The Java classes\
    \ for both drivers are found in dbj2.zip.\n\n- The native API driver is for server-side\
    \ applications that run on the application server. The driver consists of Java\
    \ parts and a C native API interface (DB2 CLI). The driver translates JDBC calls\
    \ into DB2 CLI calls. It gives the calls to the DB2 Client component, which passes\
    \ them to the DB2 Server. After that, the driver returns the result back to the\
    \ application. The class name for this JDBC driver is COM.ibm.db2.jdbc.app.DB2Driver.\n\
    - The net protocol driver is for creating an application using the Java applet.\
