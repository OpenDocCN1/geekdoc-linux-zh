    # 2.4.2 Domino Enterprise server


    In our project, we installed the Domino server on the backend server, bdtest3.
    Before beginning the installation of the Domino server, you ensure the following:


    +   * Verify library structure and availability


    Ensure that the kernel version is 2.2.5 or higher, and glibc 2.1.1 or greater
    and libstdc++2.9 or greater was installed on the machine. More importantly, the
    distribution must follow the libstdc++-libc6 naming convention.

    * Stop any unnecessary services on the Linux box.


    We have to make sure that services, such as http server or sendmail may have started
    automatically, stopped.

    * Check terminal size


    Ensure that you have a terminal size of 80 columns by 24 rows, as is required
    by the Domino installation program. You can check your terminal size by using
    the echo COLUMNS and echo LINES commands from the Linux prompt where you will
    perform the installation.


    # 2.4.2.1 Installing Domino


    Use the following steps to start installing Domino on your machine:


    +   1. Log in as user root.

    2. Create the userID for running Domino. We used userID called notes with group
    notes.

    3. Change to the directory of the Domino installation package, have Domino in
    the /home/src/domino503src directory.

    4. Type `../install` from the command prompt. The Domino installation screen appears.


    | Domino installation key usage |

    | In the installation process we have to use the Tab key to continue, the Esc
    key to return to the previous screen, and the Spacebar key to make a choice of
    options. |


    +   5. Read pass license agreement and select Yes to accept the license agreement.

    6. Select the Domino Enterprise Server as the installation package that you want
    to install using Spacebar key.'
  - '[PAGE 29]


    7. Specify the installation target directory. We put the Domino server in the
    /opt/lotus.


    8. If you want to install more than one Domino server in your machine, you can
    choose the option Yes in this screen to let Domino create this additional servers.
    In our project, we choose No because we just want to install one Domino server
    in our machine.


    9. Specify the Domino data files directory. We installed the Domino data files
    in /local/notesdata directory.


    10.Specify the userid and group that will own Domino data files and run the Domino
