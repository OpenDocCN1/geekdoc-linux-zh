    \ | 0 |\n\nFigure 97. Domino character console\n\n## 4.1.3.2 Starting and stopping\
    \ the Domino server\n\nThe Domino startup process using a command line is as follows:\n\
    \n- 1. Log on with userID notes.\n- 2. Change to the Domino data directory. We\
