    \ codes are required when creating a servlet:\n\n+   - Creating a Java servlet\
    \ requires the following imports:\n- The class must extend the HttpServletServlet\
    \ class as follows:\n- We must at least implement the doGet or doPost method.\n\
    \nTherefore, the minimal code required to implement a servlet and service an HTTP\
    \ POST request is shown in Figure 65.\n\n```\nimport javax.servlet.*;\nimport\
    \ javax.servlet.http.*;\npublic class UselessServlet extends HttpServletServlet\
    \ {\n    public void doPost(HttpServletRequest req, HttpServletResponse response)\n\
    \    throws ServletException {\n        // service POST here\n    }\n}\n```\n\n\
    Figure 65. Minimal code for servlet implementing minimum HTTP GET request\n\n\
    As another example, we want to implement both GET and POST operation similarly.\
    \ Since both methods will access the same code base, we accomplish this by implementing\
