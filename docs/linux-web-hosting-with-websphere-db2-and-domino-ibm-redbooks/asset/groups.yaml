    \ Web 页面中表示任意数量动态数据的 Java Beans。\n\n## 3.3 DB2 数据库\n\n本节详细讨论了构建我们所使用的 DB2 数据库所需的步骤。我们执行的步骤讨论如下：\n\
    \n- 第 61 页第 3.3.1 节“数据库建模”，在其中我们提供了开发数据库时面临的设计考量。\n- 第 66 页第 3.3.2 节“创建数据库”，展示了实际的数据库创建。\n\
    \n### 3.3.1 数据库建模\n\n为了实现网站的目标，我们的数据库至少必须对以下实体进行建模：\n\n- 用户（Users）\n  用户是访问 Web\
