    - 4.1.1.1.1, \"Web server startup and shutdown\" on page 108 shows the manual\
    \ starting and stopping of the Web server.\n- 4.1.1.1.2, \"IBM HTTP Server administration\
    \ server\" on page 109 shows an overview of the IBM HTTP Server administration\
    \ client.\n- 4.1.1.1.3, \"Servlet management with WebSphere\" on page 113 provides\
    \ an overview to the WebSphere servlet administration.\n\n### 4.1.1.1 Web server\
    \ startup and shutdown\n\nWebSphere acts as a module plug-in for the IBM HTTP\
    \ Server as discussed in 2.4.5.2, \"Verifying WebSphere installation\" on page\
    \ 40. Therefore, the WebSphere functions are started and stopped together with\
    \ the IBM HTTP Server.\n\nThe IBM HTTP Server starts a set of http processes,\
    \ and WebSphere starts a set of Java processes. The manual commands for IBM HTTP\
    \ Server are:\n\n- Starting the HTTP server:\n  /etc/rc.d/init/ibmhttpd start\n\
    - Restarting the HTTP server by sending the SIGHUP signal:\n  /etc/rc.d/init/ibmhttpd\
    \ restart\n- Gracefully restarting the HTTP server:\n  /etc/rc.d/init/ibmhttpd\
    \ graceful\n- Stopping the HTTP server:\n  /etc/rc.d/init/ibmhttpd stop\n\nThe\
    \ output from these commands is shown in Figure 82.\n\n```bash\n[root@bdtest1\
    \ init.d]# /etc/rc.d/init/ibmhttpd stop\n/etc/rc.d/init/ibmhttpd stop: httpd stopped\n\
    [root@bdtest1 init.d]# /etc/rc.d/init/ibmhttpd start\n/etc/rc.d/init/ibmhttpd\
    \ start: httpd started\n[root@bdtest1 init.d]# /etc/rc.d/init/ibmhttpd restart\n\
    /etc/rc.d/init/ibmhttpd restart: httpd restarted\n[root@bdtest1 init.d]# /etc/rc.d/init/ibmhttpd\
    \ graceful\n/etc/rc.d/init/ibmhttpd graceful: httpd gracefully restarted\n```\n\
    Figure 82. Output of the httpd control commands\n\nIf the server needs to be killed\
    \ quickly, and the above commands fail for reason, the server keeps the parent\
    \ process ID in a file called httpd.pid. This file can be found in /opt/IBMHTTPServer/logs/.\
    \ Sending the TERM signal to this process will stop the server ungracefully.\n\
    \nOnce the required command has been issued, we can check whether it was successful\
    \ by issuing the following command:\n\n```bash\nps ax | grep httpd\n```\n\nOutput\
    \ from this command looks similar to Figure 83. Note that in our example, we have\
    \ started seven http servers, and it is sufficient to kill only the parent ID\
    \ to stop all the processes.\n\n```bash\n[root@dbtest1]# ps ax | grep httpd\n\
    12571 S 0:00 /opt/IBMHTTPServer/bin/httpd\n13165 S 0:00 /opt/IBMHTTPServer/bin/httpd\n\
    13166 S 0:00 /opt/IBMHTTPServer/bin/httpd\n13167 S 0:00 /opt/IBMHTTPServer/bin/httpd\n\
    13168 S 0:00 /opt/IBMHTTPServer/bin/httpd\n13169 S 0:00 /opt/IBMHTTPServer/bin/httpd\n\
    13180 pts/13 S 0:00 grep httpd\n```\nFigure 83. Output of ps.ax\n\nTo ensure that\
    \ Java processes that started by WebSphere is also terminated, use the killall\
    \ command before stopping the HTTP server.\n\n### 4.1.1.2 IBM HTTP Server administration\
    \ server\n\nThis section provides the steps to install and configure the IBM HTTP\
    \ Server administration. We do not go into any detail regarding how we installed\
    \ the server using this console. The steps below describe:\n\n- Install the RPM\
    \ packages:\n  rpm -i IBM_Admin_Server-1.3.6-1386.rpm\n  rpm -i IBM_Admin_Forms-1.3.6-1386.rpm\n\
    - Change to the /opt/IBMHTTPServer directory.\n- Create a group for administrator:\n\
    \  groupadd -g 500 webadmin\n\n### 4.1.1.3 Execute the /setup.admin\n\nThis script\
    \ is interactive, and the execution is given below showing our input: Use a User\
    \ ID to run the Administration Server, a GROUP NAME to run the Administration\
    \ Server, and the Directory containing the files for permissions. Use Wildcards\
    \ (e.g. *) to change file permissions for ALL files in directory.\n\n```text\n\
    ************************************************\nPlease use a User ID to run\
    \ the Administration Server:\n[default] -> httpuser\n************************************************\n\
    Please supply a GROUP NAME to run the Administration Server:\n[default] -> webadmin\n\
    ************************************************\nPlease supply the Directory\
    \ containing the files for permissions:\n[default] -> /opt/IBMHTTPServer/conf\n\
    ************************************************\n```\n\n| Permissions | Owner\
    \ | Group | Size | Date | Name |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | -rw-r-- | root | webadmin | 4137 | Jul 29 | admin.conf.default |\n| -rw-r--\
    \ | root | webadmin | 4137 | Jul 29 | admin.conf |\n| -rw-r-- | root | webadmin\
    \ | 6246 | Jun 24 | admin.passwd |\n| -rw-r-- | root | webadmin | 31405 | May\
    \ 12 | httpd.conf |\n| -rw-r-- | root | webadmin | 31028 | May 12 | httpd.conf.bak\
    \ |\n| -rw-r-- | root | webadmin | 30989 | Jul 29 | httpd.conf.default |\n| -rw-r--\
    \ | root | webadmin | 30989 | Jul 29 | httpd.conf.sample |\n| -rw-r-- | root |\
    \ webadmin | 12441 | Jul 29 | magic.default |\n| -rw-r-- | root | webadmin | 12441\
    \ | Jul 29 | magic.key |\n| -rw-r-- | root | webadmin | 7350 | Jul 29 | mime.types\
    \ |\n| drwxr-xr-x | root | webadmin | 1024 | Oct 18 | /opt/IBMHTTPServer/conf\
    \ |\n| -rw-xr-x | root | webadmin | 46807 | Jul 29 | /opt/IBMHTTPServer/bin/admin\
    \ |\n\nThis is the file for SetUserID for Root:\n\n```text\n************************************************\n\
    CONTINUE - Perform Changes\nQUIT - No Changes\n************************************************\n\
    (default: 2) -> 1\n\nChanges Completed\nConfiguration file: /opt/IBMHTTPServer/conf/admin.conf\n\
    will be saved as /opt/IBMHTTPServer/conf/admin.conf.21:14:42_139\nDo you wish\
    \ to update the Administration Server Configuration file?\nCONTINUE [y]\nEXIT\
    \ [y]\n************************************************\n[default: QUIT - 2] ->\
    \ 1\nUSER DONE\nGroup DONE\nSuccessfully updated configuration file\nOld configuration\
    \ file saved as /opt/IBMHTTPServer/conf/admin.conf.21:14:42_139\n```\n\n## 5.\
    \ Create a password for httpuser:\n\n/passwd -b ../conf/admin.passwd httpuser\
    \ webadmin\n\n## 6. Start the administration server:\n\n/adminctl start\n\n##\
    \ 7. Run a Web browser and point to port 8008 of our Web server. The initial administration\
