    # 4.1.3.1 Domino console


    The Domino console is an important tool if we want to monitor our Domino server.
    We can access the console in several ways:


    +   • Domino Administrator client


    As we described in Section 2.4.2.3, "Connecting a Domino client" on page 25, we
    can use the Domino Administrator client to monitor the Domino server. Currently,
    the Domino Administrator client is not available for Linux, forcing us to use
    the client on other platform, such as Windows NT.


    To get a console from the Domino Administrator client:


    +   a. Select the Server tab.

    b. Select the Status tab.

    c. Click on the Live icon.


    Figure 96 on page 121 shows a screenshot of the Domino Administrator console.'
