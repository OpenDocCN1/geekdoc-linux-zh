    # Linux Web Hosting with WebSphere, DB2, and Domino


    Fast track for Web server development in Linux


    Linux, the open source operating system, is regarded as one of the main key systems
    in the future of e-business. IBM has provided a set of e-business applications
    on Linux to make it an advanced and robust e-business platform. The key offerings
    from IBM are the WebSphere application server, IBM Database 2, and Lotus Domino.


    Domino and DB2 database side-by-side in action


    This book discusses implementing Linux as an e-business platform. Detailed information
    is provided on designing the system based on the e-business Pattern, setting up
    and configuring software, developing the e-business solution, and operating the
    Web server. This book enables administrators and programmers to get up-speed with
    the exploding growth of e-business using Linux platforms and IBM offerings. Examples
    are explained in great detail to ensure complete coverage of the programming tricks.
    This book also includes a CD-ROM that contains the source codes of all the components
    that we developed and used, which serves as an example of the e-business development
    that we perform on Linux.


    JSP and Servlet interaction explained


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by IBM''s International Technical Support Organization.
    Experts from Partners around the world create timely technical information based
    on realistic scenarios and recommendations are provided to help you implement
    IT solutions more effectively in your environment.


    This book is a must for Web administrators and programmers that want to deploy
    Linux based e-business configurations.


    For more information: ibm.com/redbooks


    SG24-6007-00 IBM 073428544

