    \ rpm 软件包更改为 Caldera eServer 2.3 分发的 2.2.14 内核以激活 olympic。\n\n  - b. 编辑 `/etc/sysconfig/network`\
    \ 文件，并如图 4 所示将令牌环接口添加到 `IF_LIST` 中。\n\n```\nNETWORKING=yes\nHOSTNAME=bdtest1.itsc.austin.ibm.com\n\
    IF_LIST=lo eth tr0 sl ppp\n```\n\n图 4. `/etc/sysconfig/network-scripts/ifcfg-eth0`\
