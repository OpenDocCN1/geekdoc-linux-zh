    ### 4.1.1.3 Servlet management with WebSphere


    Using the WebSphere administration in port 9527 of our Web server, we can manage
    the servlet that is in our environment. This section discusses adding, loading,
    and deleting servlets. A more complete coverage of WebSphere administration can
    be found at:


    http://www.ibm.com/servers/index.html


    ### Adding a servlet


    Once the servlet has been written, it needs to be registered with WebSphere before
    use. This requires the following steps:


    - Put a copy of the compiled servlet class in the servlet root directory. By default,
    the server looks for servlet files in the servlet root directory, /opt/IBMAS/servlets.

    - If the servlet belongs to a package, mirror the package structure as subdirectories
    under the servlets directory. For example, our servlet is called penguins.access.db2.Accessstat;
    so the class file Accessstat.class is copied to the following directory: /opt/IBMAS/servlets/penguins/access/db2.


    Chapter 4. Operational considerations


    3. With WebSphere running, log into the administration tool in port 9527 using
    a Web browser. The administration screen looks like the window in Figure 87.


    4. Log in using admin as the username and password. We are now presented with
    the WebSphere introduction screen as shown in Figure 88 on page 115.


    Linux Web Hosting with WebSphere, DB2, and Domino


    Figure 88. WebSphere introduction screen


    5. Click on **Servlets** in the left frame.


    6. Select **Configuration** and the Servlet Configuration window is shown as in
    Figure 89 on page 116.


    7. Click the **Add** button and type the servlet name in the popup box in Figure
    90. It must be a unique name. It is the name that will be used to run the servlet
    from the Web browser.


    8. Fill in the class of the servlet. The classname is the full package name. For
    example, your full Accessstat servlet name is called penguins.access.db2.Accessstat.


    Linux Web Hosting with WebSphere, DB2, and Domino


    9. If the servlet is a bean, fill in this information, select yes, and fill in
    the location of its jar file.


    10. Click **Test** to load the servlet and test it. If all goes well, it will
    be successful.


    11. Click **Add**. The servlet should be loaded automatically. The servlet is
    now registered and can be accessed.


    ### Loading servlet


    To load a servlet, complete the following steps:


    1. Click Servlet -> Configuration in the Servlet Configuration window as shown
    in Figure 89 on page 116.

    2. Select the servlet name from the Servlet Names column.

    3. Click **Load**.


    ### Unloading servlet


    To unload a servlet, complete the following steps:


    1. Click Servlet -> Configuration in the Servlet Configuration window as shown
    in Figure 89 on page 116.

    2. Select the servlet name from the Servlet Names column.

    3. Click **Unload**.


    ### Deleting servlet


    To delete a servlet, follow these steps:


    1. Click Servlet -> Configuration in the Servlet Configuration window as shown
    in Figure 89 on page 116.

    2. Select the servlet from the Servlet Names column.

    3. Click **Unload**.

    4. Click **Yes** to confirm.


    ## 4.1.2 DB2 operation


    This section discusses the manual startup and shutdown processes for a DB2 server.


    ### 4.1.2.1 Starting the DB2 instance


    The DB2 instance is started with the command:


    ```

    db2start

    ```


    This command must be executed by the DB2 instance owner, in our case, db2inst.
    See Figure 91 for an example of the execution.


    Figure 91. Starting the DB2 instance


    ### 4.1.2.2 Stopping the DB2 instance


    The DB2 instance is stopped with the command:


    ```

    db2stop

    ```


    This command must be executed by the DB2 instance owner, in our case, db2inst.
    See Figure 92 for an example of the execution.


    Figure 92. Stopping the DB2 instance


    In some cases, we still choose to stop the database without waiting for all the
    connections to terminate. In this case, we have to use the command:


    ```

    db2stop force

    ```


    The output of this command, if successful, is exactly the same as that shown for
    the db2stop command without any parameters.

