    \ server 59\n\nAs shown in Figure 51 on page 58, the order page can be reached\
    \ from the book abstract page or directly to the order page if you know the form-number.\
    \ A successful order will display an order number and the shipping details. Failures\
    \ will again result in an error message and further instructions being displayed.\n\
    \n## Internal design\n\nOur Web application structure is then developed to be\
    \ able to provide the presentation flow discussed in Section 3.1, \"External functionality\"\
    \ on page 53. As we have decided to use the pattern for e-business user-to-online\
    \ buying topology, the application is then developed to include a Commerce server\
    \ node in the front-end and a Database server node in the backend. The front-end\
    \ runs the Web server and the business logic using WebSphere, while the backend\
    \ contains the data. Figure 53 shows our internal configuration.\n\n![](img/fa6240c5500d6e5eed673bb325a11d43_69_0.png)\n\
    \nThe design is started from the Database server structure. We use two data sources,\
    \ the DB2 database to store the order and user profiles and the Lotus Domino database\
    \ to store the book information. The structure of the DB2 database is given in\
    \ Section 3.3, \"DB2 database\" on page 61. The discussion on the Lotus Domino's\
    \ redbook database is given in Section 3.4, \"Domino database\" on page 69.\n\n\
    The Commerce server node is implemented using RedHat Version 6.2 and Caldera eDesktop\
    \ Version 2.4. The HTML codes that we used are available in Appendix D, \"HTML\
    \ and JSP files listing\" on page 173. We describe, in this redbook, the development\
    \ of some Java related ingredients of the Web server. These discussions are put\
    \ in:\n\n- Section 3.5, \"Servlet programs\" on page 78, which discusses the Servlet\
    \ programs that we develop. The servlets are used primarily to maintain a session,\
    \ to access the DB2 database, and to access the Domino database.\n- Section 3.6,\
    \ \"JSP files\" on page 98, which discusses the Java Server Pages (JSPs) that\
    \ we use. The JSP provides the ability to create a dynamic Web page without having\
    \ to code everything in a servlet.\n- Section 3.7, \"Accessing data through a\
    \ Java bean\" on page 103, which provides an overview of the Java Beans that we\
    \ use in representing an arbitrary amount of dynamic data in a Web page for the\
    \ orders.\n\n## 3.3 DB2 database\n\nThis section discusses, in detail, the steps\
    \ required to build the DB2 database that we use. The steps that we perform are\
    \ discussed in the following:\n\n- Section 3.3.1, \"Modelling the database\" on\
    \ page 61 where we provide the design considerations that we face in developing\
    \ the database\n- Section 3.3.2, \"Creating the database\" on page 66 shows the\
    \ actual database creation.\n\n### 3.3.1 Modelling the database\n\nTo achieve\
    \ the objective of the Web site, our database must, at the very least, model the\
    \ following entities:\n\n- Users\nUsers are the customers who come to the Web\
    \ site to browse, log in with a username and password, register a profile of redbook\
    \ category interests, and redbooks.\n- Orders\nThese entities reflect the order\
    \ of a product by a user. For simplicity's, a user may only order one product\
    \ at a time (that is, there is no shopping basket concept where one or more products\
    \ of differing quantities may be placed before an order is finalized).\n\nWe examine\
    \ each of these entities in more specific detail.\n\n#### 3.3.1.1 Users\n\nThe\
    \ entity users must have the following attributes:\n\n- Username: username is\
    \ considered to be unique. Hence, we validate that a user is registered by verifying\
    \ the combination of the username and password. Each and every time an action\
    \ is to be performed on the database, whether in changing or accessing user passwords,\
    \ information, and profiles, the username and password must be verified.\n\nThe\
    \ username and password information needs to be built separately for performance\
    \ and implementation reasons. For performance reasons, we need to separate the\
    \ access to this information from all others to be able to provide fast and efficient\
    \ access to the data. From an implementation point of view, we would also find\
    \ it more convenient to later change password encryption algorithms and access\
    \ methods.\n\n- User information\nThe user information contains first and last\
    \ names, address, email, and so on. The fields of this table are usually static\
    \ and not changed. We added the date to track when the user is registered.\n\n\
    - Profile information\nThe profile reflects the user's interests in terms of redbooks.\
    \ This list may change often.\n\n#### 3.3.1.2 Orders\n\nOrders have the following\
    \ attributes:\n\n- A username associated with the order\n- The timestamp of the\
    \ order\n- The product that has been ordered\n- A unique order ID\n\nThis order\
    \ ID is required, as we can no longer use username as a identifier (as a user\
    \ can, be able to, order more than product).\n\n### 3.3.1.3 Complete design\n\n\
    Based on the discussions for the user and order items, we will create four database\
    \ tables. Each table has a set of fields, or column names, where each field has\
    \ a data type, length, and a nullable condition.\n\n- The data type\n  There are\
    \ various data types that are available in DB2. We use the following data types\
    \ in our database:\n  - varchar: Provides variable length string type\n  - char:\
    \ Provides fixed length string type\n  - date: Provides a date-only data type\n\
    \  - timestamp: Provides a date and time up to a microsecond\n  - int: Provides\
    \ a whole number type\n- The field length\n  This represents the length of the\
    \ field, if appropriate. For example, a data type of char or varchar requires\
    \ a length, a data type of date, timestamp, or int does not.\n- The nullable condition\n\
    \  This last attribute, the nullable condition, exists for us to track whether\
    \ the field can be left empty or undefined or must be filled in. For example,\
    \ a 0 length string; it is not a null string.\n\nThe structure of the database\
    \ that we built is represented by the Entity Relationship diagram shown in Figure\
    \ 54.\n\n![](img/fa6240c5500d6e5eed673bb325a11d43_73_0.png)\n\nEntity Relationship\
    \ diagram of our DB2 database structure\n\n## USERVERIFY\n\nThe USERVERIFY table\
    \ contains the username and password. The fields of this table are shown in Table\
    \ 1.\n\nTable 1. The USERVERIFY database table\n\n| Field name | Data type | Length\
    \ | Nullable |\n| --- | --- | --- | --- |\n| username | varchar | 20 | no |\n\
    | password | varchar | 20 | no |\n\nThe username field will be the search key\
    \ in this table; hence, we will also allocate it to be the primary key in the\
    \ table.\n\nNeither username nor password are allowed to be empty.\n"
