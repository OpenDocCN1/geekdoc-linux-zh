    ## 4.3.3.1 备份 Domino 文件系统


    备份系统在日常运行中非常重要，因为你永远不知道何时会遇到麻烦。


    在 Domino 中，我们必须执行的最低限备份是在每日备份期间备份所有的 Domino 服务器数据文件，包括数据库、模板文件以及 `notes.ini` 文件和
    ID 文件，其他文件可能需要每周备份一次。


    假设我们的 Domino 服务器运行非常完美，我们现在计划对 Domino 服务器进行备份。我们需要备份以下目录和文件：


    - /opt/lotus 是 Domino 软件目录。在升级或安装新的 Domino 服务器之前，我们对该目录进行备份。如果资源允许，建议将此目录包含在我们的常规备份中。


    - /local/notesdata 这是 Domino 数据目录。在这个目录中，我们将找到数据库、模板、邮件文件等等内容。如果我们的操作产生了大量数据，该目录可能需要每天进行一次或多次每日备份。如果我们想备份操作数据，必须先关闭
    Domino 服务器。


    - notes.ini, *.id 在安全的地方在可拆卸式存储介质上保留这些文件的副本。这些文件存在于 Domino 数据目录 (/local/notesdata)
    中。ID 文件包括：cert.id, server.id, user.id。


    我们可以使用 Linux 中的许多工具进行备份，如 `tar`、`cpio` 等，并选择最适合我们环境的工具。记住，所有备份的目标都是尽可能减少服务器停机时间；因此，在这种情况下，请选择你非常熟悉的解决方案。


    ## 4.3.3.2 其他维护任务


    日常运行需要进行常规维护，以尽可能的减少潜在问题的风险，并确保我们的 Domino 服务器继续可靠地运行。


    红书《A Roadmap for Deploying Domino In The Organization》（SG24-5617）包含了一份我们可以执行的常规维护实用清单。更多信息请参阅此书。


    ## 4.4 故障排除概述


    本节提供了对 Web 服务器某些基本组件进行故障排除的概述。讨论内容分为：


    - 第 4.4.1 节，第 134 页，“IBM HTTP Server 和 WebSphere 日志文件”

    - 第 4.4.2 节，第 136 页，“DB2诊断日志文件”


    ### 4.4.1 IBM HTTP Server 和 WebSphere 日志文件


    以下日志对于在 Web 服务器中查找特定问题以进行确定和解决非常有用。WebSphere 会向其日志文件记录大量信息。如果某些功能运行不正常，应该查看这些日志。所有日志文件都可以在
    /opt/IBMWebAS/logs 中找到。在该目录下，你通常会发现以下一个或多个：


    - jstderr.log

    JVM 标准错误日志可能是所有 WebSphere 日志中最实用的一个。在此日志中，会出现来自主 WebSphere Java 进程的标准错误输出。


    - jstdout.log

    JVM 标准输出日志是 WebSphere 中最实用的。标准输出日志包含了 Java 应用程序使用静态 `java.lang.System.out` 方法写入标准输出的所有输出。此日志的格式取决于应用程序。使用此日志可以检查你的
    Java 应用程序写入 `System.out` 的调试和信息性消息。此日志始终是开启的。


    - apache.log.INFORM.*

    IBM HTTP Server 信息日志包含由随 WebSphere 附带的 IBM HTTP Server 产生的信息消息和错误消息。每当服务器重新初始化时，都会生成一个新的日志，并使用不同的数字作为文件名的最后一部分。这些日志中的每个部分内容是显示
    WebSphere 初始化时属性的消息。Servlet 服务事件日志允许你查看 Servlet 何时加载、何时被调用以及带什么参数被调用。它将包含：


    - 时间戳

    - 引起事件的跟踪器（tracer）名称

    - 引起事件的线程 ID

    - 跟踪器的严重级别

    - 事件生成的任何异常

    - 消息文本

    - servlet/adminservice_access_log

    - servlet/adminservice/error_log

    - servlet/adminservice/event_log


    Servlet 服务错误日志包含 WebSphere 尝试运行 Servlet 时产生的消息。这与 Servlet 相关的错误。Servlet 产生的 `System.out`
    和 `System.err` 输出分别放在标准输出和标准错误中。


    ## 4.4.2 DB2 诊断日志文件


    DB2 保留有一个诊断日志文件，称为 `db2diag.log`。该文件位于实例主目录下的 `sqllib/db2dump` 子目录。在我们的场景中，在后端服务器
    btest3 上，它将位于 /home/db2inst/sqlib/db2dump。该文件会追加诊断信息，或者如果它尚不存在，则创建并追加。


    诊断信息的量由 DB2 数据库管理器配置中的 `DIAGLEVEL` 决定。登录 DB2 实例所有者并使用命令访问数据库管理器配置：


    ```

    db2 get dbm cfg

    ```


