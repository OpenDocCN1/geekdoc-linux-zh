    the same machine. Therefore, the HttpSession object is also suitable to store
    individual session profile data from the client.


    The HttpSession object is not persistent data. It is deleted after a time out
    or by the invalidate method(). In order to store data persistently, WebSphere
    provides a UserProfile (see Section 5.1.1.2, "User profile tracking" on page 140).


    The HttpSession description can be found at


    ```

    http://java.sun.com/products/servlet/2.1/api/java.servlet.http.HttpSession

    ```


    More information on session tracking can be found at:


    ```

    http://java.sun.com/docs/books/tutorial/servlets/client-state/session-tracking.html

    ```


    # 3.5.2 Using the HttpServletSession


    To use these objects, we obtain a session object, get or put values to this object,
    and invalidate it if we need to remove the context.


    # Obtaining a session object


    To obtain a session object associated with the client, we use the getSession method
    (as we assume req is of type HttpServletRequest)


    ```

    boolean flag=true;

    HttpSession session=req.getSession(flag);

    ```


    This obtains the current valid session associated with this request from the client.
    The flag indicates whether a session object should be created if it is not found.


    # Getting values from a session object


    For example, to get the username from the session, we use the get method associated
    with the session object as follows:


    ```

    String username=(String) session.getAttribute("username");

    ```


    # Putting values to a session object


    We can also set values in the session using the putAttribute method. In the following
    example, we associated the password key with a value of elephant:


    ```

    session.setAttribute("password","elephant");

    ```'
  - '[PAGE 92]


    # Invalidating a session object


    Finally, to invalidate the session instance, we use the invalidate method as

    follows:


    ```

    session.invalidate();

    ```


    This may be required during logout processing.


    # 3.5.3 Accessing DB2 via JDBC


    The initial setup for a Java class to access DB2 using JDBC requires

    importing the appropriate package, registering the DB2 driver, and creating

    the connection to the DB2 database. This only needs to be done once.


    After that, each SQL statement to execute requires a statement to be

    created, executed, and finally closed.


    Lastly, we give an example of what is required to write a Java servlet to

    access DB2 database using JDBC.


    # 3.5.3.1 DB2 JDBC Drivers


    DB2 JDBC main usages are for executing dynamic SQL statements and for

    supporting upper layers, such as SQLJ and IBM DataAccess beans.


    DB2 provides two JDBC drivers: a native API Type 2 driver and a net protocol

    Type 3 driver. The Java classes for both drivers are found in

    dbj2.zip.


    +   - The native API driver is for server-side applications that run on the

    application server. The driver consists of Java parts and a C native API

    interface (DB2 CLI). The driver translates JDBC calls into DB2 CLI calls. It

    t gives the calls to the DB2 Client component, which passes them to

    the DB2 Server. After that, the driver returns the result back to the

    application. The class name for this JDBC driver is

    COM.ibm.db2.jdbc.app.DB2Driver.


    +   - The net protocol driver is for creating an application using the Java applet

    model. The driver is a 100 percent Java program that is downloaded when

    with the applet to the client browser. The driver exchanges messages, by

    using the TCP socket protocol, to a JDBC Applet Server in the application

    server machine. The JDBC Applet Server translates applet messages into

    DB2 CLI calls. It sends the calls into the DB2 Client component, which

    passes them to the DB2 Server. Then, the JDBC Applet Server passes the

    results back to the applet. The class name for this JDBC driver is

    COM.ibm.db2.jdbc.net.DB2Driver.'
