    \ declarations:\nDEVICE=tr0\nIPADDR=192.168.1.2\nNETMASK=255.255.255.0\nNETWORK=192.168.1.0\n\
    BROADCAST=192.168.1.255\nGATEWAY=none\nONBOOT=n0\nDYNAMIC=\n#>>>End variable declarations\n\
    ```\n\n图 6. `ifcfg-tr0` 文件的内容\n\n  - e. 执行 `ifup tr0` 命令以启动此网络接口。\n\n- 账户配置\n\n\
    如之前 2.2 节第 8 页的“安装概述”所述，我们创建了一个名为 `admin` 的 userID。\n\n- X 配置\n\nCaldera-Desktop\
    \ Version 2.4 默认安装了 X 服务器。该过程非常顺利，在连接到带有 S3 TRIO 3D、4 Mb 显存卡的 P50 显示器上，分辨率为 1024x768@70Hz，首次运行成功。\n\
    \n安装完成后，从 CD-ROM 驱动器中取出 CD 并重启服务器。\n\n我们现在可以进入应用程序安装阶段\n\n## 2.4 应用程序安装\n\n应用程序安装按以下顺序说明：\n\
