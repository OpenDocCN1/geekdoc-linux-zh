    \ shows all documents sorted by their platform and then by their publishing date\
    \ in each platform's category. The platforms that we have are:\n    - AS/400\n\
    \    - Netinity and Software\n    - Network Computing Framework\n    - Networking\
    \ Hardware\n    - OS/390 and S/390\n    - RS/6000 and AIX\n    - Scalable Parallel\n\
