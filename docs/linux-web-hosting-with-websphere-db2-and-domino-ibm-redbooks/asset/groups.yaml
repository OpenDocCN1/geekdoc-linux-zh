    - Creating the DB2 database

    - Creating the DB2 tables in the database


    We assume DB2 has been installed, and the installation has been verified successfully
    as discussed in Section 2.4.1, "DB2" on page 15.


    ## 3.3.2.1 Creating the DB2 database


    We can create the DB2 database using either the DB2 Center GUI interface or via
    the command line.


    We demonstrate how to create the database via the command line, as follows:


    - 1. On the server, log in as user db2inst (the default DB2 instance owner).

    - 2. Execute the db2 create database command to create the USERSTUF database:


    ```

    db2 create database USERSTUF

    ```


    ### DB2 database names


    DB2 database names in DB2 v6.1 must be eight characters or less in length. Hence,
    we have named our database USERSTUF (instead of USERST)


    Figure 55 on page 67 shows the results of the create database command, creating
    the USERSTUF database with default settings. We verify the database has been created
    by connecting to it with the DB2 connect database command.


    ```

    [db2inst@bdtest1$] db2 create database USERSTUF

    DB2000OI The CREATE database command completed successfully.

    [db2inst@bdtest1$] db2 connect to userstuf

    ```


    ```

    Database server = DB2/LINUX 6.1.0

    SQL authorization ID = DB2INST1

    Local database alias = USERSTUF

    ```


    Figure 55. Creating the USERSTUF database on server bdtest1


    This command creates a database called USERSTUF in the default location, /home/db2inst1.


    ## DB2 database backups


    Always back up a DB2 database using the db2 backup database command. Backing up
    the file system, or database files at a file system level, will NOT accomplish
    the same result. See Chapter 4, “Operational considerations” on page 107 for more
    detail on the DB2 operation.


    ## 3.3.2 Cataloging database USERSTUF on the front-end server


    As be discussed in 3.5.3, "Accessing DB2 via JDBC" on page 83, the front-end server
    will be the DB2 native API type 2 JDBC driver to access the DB2 USERSTUF database.
    For this work, we must catalog the USERSTUF database on our front-end server.


    We logged in as the DB2 instance owner db2inst1 on the front-end server by issuing
    the DB2 catalog tcpip node in the following order:


    ```

    db2 catalog tcpip node dbtest3 remote 9.3.240.221 server 50000

    db2 catalog database userstuf at node dbtest3

    ```


    Verify the connection to the DB2 database with the command:


    ```

    db2 connect to userstuf

    ```


    ## 3.3.2.3 Creating the DB2 tables in the database


    We can create the database tables for the USERSTUF table either using the DB2
    Control Center GUI or via the DB2 command line.


    We demonstrate how to create the tables using the command line interface. We have
    already created four SQL script files to be used for this process (see Appendix
    A, "SQL scripts for creating the USERSTUF tables" on page 145). We demonstrate
    creating the USERINFO table here. The script file is named userinfo.ddl, and the
    contents are shown in Figure 56.


    ```

    create table userinfo (

    first_name varchar(20) not null,

    last_name varchar(20) not null,

    email_address varchar(50) not null,

    date_joined date not null,

    birth_date date not null,

    address varchar(200) not null,

    username varchar(20) not null,

    primary key (username)

    );

    ```


    Figure 56. The userinfo.ddl file


    The steps to create the USERSTUF table are as follows:


    - 1. Log in as the default DB2 instance owner, db2inst1.

    - 2. Connect to the USERSTUF database with the command:


    ```

    db2 connect to userstuf

    ```


    - 3. Run the db2 command with the -tvf options, specifying the USERINFO script
    file userinfo.ddl in the current path as follows:

    db2 -tvf userinfo.ddl


    Figure 57 on page 69 shows the results of the connect and create table commands
    on the server.


    ![](img/fa6240c5500d6e5eed673bb325a11d43_78_0.png)


    Figure 57. The USERINFO table on server dbtest1


    Repeat this step to create the USERSTUF table.


    ## 3.4 database


    In this section, we discuss the database database.


    ### 3.4.1 database concept


    A Domino database is a collection of related information stored in a single file.
    A Domino application uses at least one database. A database holds its design as
    well as data. Domino data is organized as documents. A document is an object containing
    text, graphics, video, or audio, any kind of rich text.


    ### 3.4.1.1 Form


    The form is the skeleton provided to users to enable them to enter data, by typing
    or using other controls. A form can also be thought as an abstract structure of
    a document. It defines all the fields and its type for a document. There is at
    least one form in a database, although a typical business application will have
    many forms, each targeted to the type of information the user wants to save in
    the database.


    The form contains all the design elements: Fields to store the user''s information,
    static text, buttons, sections, images, and subforms that help the user enter
    the data into the database.


    ### 3.4.1.2 View


    A view shows a list of documents stored in a Domino database and can be thought
    of as a table of contents of a database. Views provides a means to organize documents
    in a database to be presented to the users or a program. Each row listed in a
    view represents data from a single document. Each column represents a field or
    a result of a formula from that document.

