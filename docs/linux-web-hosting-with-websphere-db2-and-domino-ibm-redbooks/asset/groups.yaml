    \ can start the Domino server automatically. We add an entry in the /etc/initab\
    \ file as follows:\n\n```\nnotes:2:once -c /bin/su notes -c /home/notes/start_domino.sh\n\
    ```\n\nIf Domino exits abnormally, the Domino Inter-Process Communication (IPC)\
    \ resources need to be cleaned up before restarting Domino. In order to clean\
    \ Domino after a crash, perform the following steps:\n\n- 1. Kill all Domino processes\
    \ of the server that failed from the userID.\n- 2. Remove the associated Inter-Process\
