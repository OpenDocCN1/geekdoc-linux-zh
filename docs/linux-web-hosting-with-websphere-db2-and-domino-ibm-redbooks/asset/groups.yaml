    \n+   1. Prepare the hardware and ensure that it satisfies all the required configuration\
    \ for all the software that will be used.\n2. Install our chosen Linux distribution.\n\
    \   - Add the userID admin as a normal user.\n   - Become familiar with the preferred\
    \ X-Window environment: KDE or GNOME.\n\nLinux Web Hosting with WebSphere, DB2,\
    \ and Domino"
