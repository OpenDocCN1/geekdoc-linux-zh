    \n### 3.5.3.2 Creating a JDBC program\n\nTo create a Java program that accesses\
    \ DB2 via JDBC, we need the following steps:\n\n#### Importing java.sql package\n\
    \n```java\nimport java.sql.*;\n```\n\n#### Registering the driver\n\nWe must register\
    \ the driver. As mentioned in 3.5.3.1 DB2 Drivers on page 83, this can be one\
    \ of two classes:\n\n```java\ntry {\n  Class.forName(\"COM.ibm.db2.jdbc.app.DB2Driver\"\
    );\n} catch (Exception e) {\n  e.printStackTrace();\n}\n```\n\n#### Creating a\
    \ connection\n\nA connection to the useruf database is created with getConnection\
    \ method. For example, to connect to useruf (we assume useruf has been cataloged\
    \ correctly), with the default userid and password, we would use the method as\
    \ follows:\n\n```java\nString url=\"jdbc:db2:useruf\"\n```\n\n```java\nString\
    \ uid=\"db2inst\";\nString pwd=\"db2\";\nConnection con=null;\ntry {\n    con=DriverManager.getConnection(url,\
    \ uid, pwd);\n} catch (SQLException e) {\n    e.printStackTrace();\n}\n```\n\n\
    #### Creating a statement\n\nEach time we need to execute an SQL statement, we\
    \ must create a statement first. This is done with the following code (we assume\
    \ the connection variable con has already been created and assigned):\n\n```java\n\
    Statement stmt=con.createStatement();\n```\n\n#### Executing the statement\n\n\
    With this statement, we can now perform two types of SQL statements:\n\n- Insert/Update/Deletes\n\
    \  SQL inserts, updates, and deletes return the number of rows affected by the\
    \ SQL statement. We would use the executeUpdate method to execute these SQL statements.\
    \ The method returns the number of rows affected by the SQL statement, of type\
    \ integer. Hence, we could code the following to delete all rows from the USERINFO\
    \ table where the username equals \"alistair\" as:\n\n```java\nString sqlType=\"\
    delete from userinfo where username='alistair\";\nint rs=stmt.executeUpdate(sqlType);\n\
    ```\n\n- Queries\n  SQL queries return a set of rows. This is called a result\
    \ set of rows. Use the executeQuery method from the statement, which returns a\
    \ type of ResultSet. We could code a simple SQL query to select all rows from\
    \ the USERINFO table as follows:\n\n```java\nString sqlType=\"select * from USERINFO\"\
    ;\nResultSet rs=stmt.executeQuery(sqlType);\n```\n\nTo obtain each result row,\
    \ we use the next() method. This method returns true if there is a next result\
    \ row, and it is initially positioned before the first result row. For example:\n\
    \n```java\nif (rs.next()) {\n    // process next result row\n}\n```\n"
  mdcn: "\n\n| Servlet 名称 | 功能 | 环境 |\n| --- | --- | --- |\n| AccessUserstuff | 连接\
    \ DB2 的主要接口。处理 GET 和 POST 方法，其操作由一个名为 action 的参数决定。 | DB2 和 Beans |\n| VBDSearch\
    \ | 对 Redbooks 数据库进行搜索。搜索参数存储在名为 search 的参数中。 | Domino |\n| VBDList10 | 列出某个类别的最新的\
    \ 10 本书。该类别由第一个参数指定。 | Domino |\n| VBDLatest | 提供 Redbooks 数据库中所有类别最新发布的 10 本书。\
    \ | Domino |\n| VDBOpen | 访问红书的摘要并以 HTML 格式显示。 | Domino |\n\n## 3.5.2 在 HTTP 中维护状态\n\
    \nHTTP 是一种无状态协议。为了执行事务性活动，必须维护某种状态。目前已经有很多许多维护状态的方法：使用 Cookie、URL 重写、HTML 表单中的隐藏字段等。Java\
    \ Servlet API 通过 `HttpSession` 对象实现了状态访问。\n\n### 3.5.2.1 会话句跟踪 (Session Tracking)\n\
    \n`HttpSession` 是一种技术实现，用于在无状态的 HTTP 协议上管理会话。它是 Java Servlet API 的一部分，可以在 Java\
    \ Servlet 开发工具包中访问。\n\n`HttpSession` 对象是 Java 编程对象，具有类似于字典的接口，用于存储用户定义的数据。可以使用任何关键字在\
    \ `HttpSession` 对象中存储数据，并使用该关键字检索数据。\n\n每个会话对象都有自己的 ID。`HttpSession` 对象通过其会 ID\
    \ 与客户端关联。会话跟踪器使用会 ID 来查找用户的会话对象。会话对象不会在 Web 客户端和服务器之间传输。只有 ID 在 Web 客户端和 Web 服务器之间往返。这意味着会话对象适用于存储用户的安全数据。\n\
    \n由于有许多不同的表示会话数据的方法，`HttpSession` 提供了一种无缝、统一的方法来访问会话数据，如果客户端 Web 浏览器支持，可以使用 Cookie，也可以使用\
    \ URL 重写来保存与客户端关联的会 ID。\n\n存储在 `HttpSession` 对象中的数据在来自同一机器的请求之间共享。因此，`HttpSession`\
    \ 对象也适用于存储客户端的个人会话配置数据。\n\n`HttpSession` 对象不是持久化数据。它会在超时后或通过 `invalidate()` 方法被删除。为了持久化存储数据，WebSphere\
    \ 提供了 `UserProfile`（参见第 140 页第 5.1.1.2 节，“用户配置跟踪”）。\n\n可以在此处找到 `HttpSession` 的描述：\n\
    \n```\nhttp://java.sun.com/products/servlet/2.1/api/java.servlet.http.HttpSession\n\
    ```\n\n会话跟踪的更多信息可以在：\n\n```\nhttp://java.sun.com/docs/books/tutorial/servlets/client-state/session-tracking.html\n\
    ```\n\n## 3.5.2 使用 HttpServletSession\n\n要使用这些对象，我们需要获取会话对象，向对象获取或设置值，并在我们需要移除上下文时将其失效。\n\
    \n### 获取会话对象\n\n要获取与客户端关联的会话对象，我们使用 `getSession` 方法（假设 `req` 的类型为 `HttpServletRequest`）：\n\
    \n```\nboolean flag=true;\nHttpSession session=req.getSession(flag);\n```\n\n\
    这从客户端获取与此请求相关的当前有效会话。`flag` 表示如果未找到会话对象，是否应该创建一个。\n\n### 从会话对象中获取值\n\n例如，要从会话中获取用户名，我们如下使用与会话对象相关的\
    \ `get` 方法：\n\n```\nString username=(String) session.getAttribute(\"username\"\
    );\n```\n\n###向会话对象设置值\n\n我们还可以使用 `setAttribute` 方法在会话中设置值。在下面的示例中，我们将密码 `password`\
    \ 键与值 `elephant` 关联：\n\n```\nsession.setAttribute(\"password\",\"elephant\");\n\
    ```\n\n### 使会话对象失效\n\n最后，要使会话实例失效，我们如下使用 `invalidate` 方法：\n\n```\nsession.invalidate();\n\
    ```\n\n这在注销过程中可能是需要的。\n\n## 3.5.3 通过 JDBC 访问 DB2\n\nJava 类通过 JDBC 访问 DB2 的初始设置需要导入相应的包、注册\
    \ DB2 驱动程序并创建到 DB2 数据库的连接。这只需要执行一次。\n\n之后，执行每个 SQL 语句都需要创建、执行并最终关闭语句。\n\n最后，我们提供一个编写使用\
    \ JDBC 访问 DB2 数据库的 Java Servlet 示例。\n\n### 3.5.3.1 DB2 JDBC 驱动程序\n\nDB2 JDBC 的主要用途是执行动态\
    \ SQL 语句以及支持上层，如 SQLJ 和 IBM DataAccess beans。\n\nDB2 提供两种 JDBC 驱动程序：原生 API Type\
    \ 2 驱动和网络协议 Type 3 驱动。这两个驱动程序的 Java 类均可在 `dbj2.zip` 中。\n\n- 原生 API 驱动用于运行在应用程序服务器上的服务器端应用程序。该驱动程序由\
    \ Java 部分和 C 原生 API 接口（DB2 CLI）组成。驱动程序将 JDBC 调用翻译为 DB2 CLI 调用。它将调用传递给 DB2 Client\
    \ 组件，组件将其传递给 DB2 服务器。之后，驱动程序将结果返回给应用程序。此 JDBC 驱动程序的类名是 `COM.ibm.db2.jdbc.app.DB2Driver`。\n\
    - 网络协议驱动用于使用 Java applet 创建应用程序。（注：原文此处存在大量重复句子，翻译时已按逻辑精简）。\n\n### 3.5.3.2 创建\
    \ JDBC 程序\n\n要创建一个通过 JDBC 访问 DB2 的 Java 程序，我们需要以下步骤：\n\n#### 导入 java.sql 包\n\n\
    ```java\nimport java.sql.*;\n```\n\n#### 注册驱动程序\n\n我们必须注册驱动程序。如第 83 页 3.5.3.1\
    \ 节 DB2 驱动程序所述，这可以是两个类之一：\n\n```java\ntry {\n  Class.forName(\"COM.ibm.db2.jdbc.app.DB2Driver\"\
    );\n} catch (Exception e) {\n  e.printStackTrace();\n}\n```\n\n#### 创建连接\n\n使用\
    \ `getConnection` 方法创建到 `useruf` 数据库的连接。例如，要连接 `useruf`（我们假设 `useruf` 已正确目录），使用默认用户名和密码，我们将如下使用该方法：\n\
    \n```java\nString url=\"jdbc:db2:useruf\"\n```\n\n```java\nString uid=\"db2inst\"\
    ;\nString pwd=\"db2\";\nConnection con=null;\ntry {\n    con=DriverManager.getConnection(url,\
    \ uid, pwd);\n} catch (SQLException e) {\n    e.printStackTrace();\n}\n```\n\n\
    #### 创建语句\n\n每次我们需要执行 SQL 语句时，必须先创建一个语句。通过以下代码完成（假设连接变量 `con` 已创建并赋值）：\n\n```java\n\
    Statement stmt=con.createStatement();\n```\n\n#### 执行语句\n\n使用此语句，我们现在可以执行两种类型的\
    \ SQL 语句：\n\n- 插入/更新/删除\n  SQL 插入、更新和删除返回 SQL 语句影响的行数。我们将使用 `executeUpdate` 方法执行这些\
    \ SQL 语句。该方法返回 SQL 语句影响的行数，类型为整数。因此，我们可以编写代码删除 `USERINFO` 表中用户名等于 \"alistair\"\
    \ 的所有行：\n\n```java\nString sqlType=\"delete from userinfo where username='alistair\"\
    ;\nint rs=stmt.executeUpdate(sqlType);\n```\n\n- 查询\n  SQL 查询返回一组行。这被称为结果集。使用语句的\
    \ `executeQuery` 方法，它返回 `ResultSet` 类型。我们可以编写简单的 SQL 查询从 `USERINFO` 表中的所有行：\n\n\
    ```java\nString sqlType=\"select * from USERINFO\";\nResultSet rs=stmt.executeQuery(sqlType);\n\
    ```\n\n"
