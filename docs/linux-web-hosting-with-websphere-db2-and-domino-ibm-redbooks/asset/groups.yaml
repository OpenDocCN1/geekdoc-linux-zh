    You can use any backup method you choose, such as the tar command, when issued
    from the /opt/IBMTHTTPServer directory, will copy all the IBM HTTP files to a
    backup file, HTTPServer.tar:

    tar cvf /HTTPServer.tar


    +   * The logs contained in the /opt/IBMTHTTPServer/logs directory are important
    source of information on the server; however, they to grow quickly and need to
    be pruned.


    Issue the following commands from the /opt/IBMTHTTPServer/logs directory to prune
    them:


    ```

    mv access_log access_log.old

    kill -1 "httpd.pid"

    ```


    The kill is necessary; otherwise, httpd will keep writing to the previous log
    file.


    # 4.3.2 DB2 routine maintenance


    This section illustrates some of the required tasks to ensure the availability
    and performance of the DB2 server. These tasks are discussed in:


    +   * 4.3.2.1, "Backing up the DB2 database" on page 130, which explains an overview
    of DB2 backup process.


    +   * 4.3.2.2, "DB2 database log files" on page 131, which discusses the DB2 log
    files.


    +   * 4.3.2.3, "Table reorganization" on page 132, which illustrates the table
    reorganization procedure.


    +   * 4.3.2.4, "DB2 statistic" on page 132, which discusses updating DB2 statistics.


    # 4.3.2.1 Backing up the DB2 database


    A DB2 database must be backed up using the db2 backup database command. Using
    a file system backup will not result in a database backup with database integrity
    intact.'
  - '[PAGE 140]


    The DB2 backup command is fairly complex. An online or off-line database backup
    can be taken with several types of backup media (disk, tape, ADSM), using different
    buffer sizes, etc. It is outside of the scope of this section to discuss all these
    various options. Refer to IBM DB2 Universal Database Command Reference, SC09-2844,
    IBM DB2 Universal Database Administration Guide Volume 1, SC09-2839, and IBM DB2
    Universal Database Administration Guide Volume 2, SC09-2840, for more information.


    We present the format of a simple db2 off-line backup database to backing up our
    database USERSTUF to a directory on our server, /backup, as follows:


    ```

    db2 backup database userstuff to /backup

    ```


    # 4.3.2.2 DB2 database log files


    All databases have logs associated with them. These logs keep records of database
    changes. In certain situations, depending on the configuration of the DB2 database
    manger on the backend server, we may need to back up log files (inactive and archived
    log files) and delete them from their default locations.


    > Deleting active log files\Never delete active log files. These files are used
    by the DB2 database manager to keep track of current database transactions. Deleting
    these log would result in a database left in an inconsistent state.


    In our current DB2 instance configuration, the DB2 instance uses default circular
    logging. Hence, we have no requirement to back up and delete log files.


    It is outside of the scope of this section to discuss, in detail, database logs.
    Refer to the IBM DB2 Database Administration Guide Volume 1, SC09-2839, and IBM
    DB2 Universal Database Administration Guide Volume 2, SC09-2840, for more comprehensive
    information about the various types of log archiving (circular, log retain), different
    types of logs (active, archived, off-line archived), log file locations, and so
    on.


    It is also important to prune the DB2 diagnostic log. Discussion on the DB2 diagnostic
    log is provided in Section 4.4.2, "DB2 diagnostic log file" on page 136.'
  - '[PAGE 141]


    # 4.3.2.3 Table reorganization


    Every now and then, DB2 tables need to be reorganize their structure, and,, also
    their performance. The DB2 table is reorganized using the following procedure:


    +   1. Invoke the DB2 command line using the `db2` command from the instance owner,
    db2inst1, in our case.


    +   2. Connect to the database:


    ```

    db2> connect to userstuf

    ```


    +   3. Run reorganization for each table that you are interested in:


    ```

    db2> re table userverify

    db2> re table userinfo

    db2> re table userprofile

    db2> re table userorders

    ```


    See IBM DB2 Universal Database Command Reference, SC09-2844, for more information
    on the commands used.


    # 4.3.2.4 DB2 statistic


    The DB2 statistic needs to be updated regularly to optimize the query running
    against the database. Run the DB2 statistic update against each table and database
    using the following procedure:


    +   1. Invoke the DB2 command line using the `db2` command from the instance owner,
    db2inst1, in our case.


    +   2. Connect to the database:


    ```

    db2> connect to userstuf

    ```


    +   3. Update the statistic of each table that you are interested in:


    ```

    db2> runstats on table userverify

    db2> runstats on table userinfo

    db2> runstats on table userprofile

    db2> runstats on table userorders

    ```


    See IBM DB2 Universal Database Command Reference, SC09-2844, for more information
    on the commands used.


    # 4.3.3 Routine Domino maintenance


    This section provides an overview of the tasks that are needed to be performed
    for the Domino server.'
- md: '

    ## 4.3.3.1 Back up Domino file systems


    The backup system is very important in daily operation because you never know
    when you might get into trouble.


    In Domino, the minimum backup that we have to do is back up all the Domino server
    data files, including databases, template files, and the notes.ini file and ID
    files, during a daily backup, and other files perhaps weekly.


    Assuming that our Domino server was running perfectly, we now plan to make a backup
    of our Domino server. We need to back up the following directories and files:


    - /opt/lotus is the Domino software directory. In this directory we will back
    it up before we upgrade or install the new Domino server. If resources allow,
    it is recommended that we include this directory in our regular backups.


    - /local/notesdata This is the Domino data directory. In this directory we will
    find the database, the templates, the mail files, and others. This directory may
    require one or more daily backups if our operations produce a lot of data. If
    we want to back up our operations, we must shut down the Domino server first.


    - notes.ini, *.id Keep a copy of these files on a removable media storage in a
    secure place. These files are present in the Domino data directory (/local/notesdata).
    The ID files include: cert.id, server.id, user.id.


    We can use many tools to make a backup in Linux as tar, cpio, and so on, and we
    can choose the tool that will best suit our environment. remember that the goal
    of all backups is to minimize server downtime; so, in such cases, choose the solution
    that you are very familiar with.


    ## 4.3.3.2 Other maintenance tasks


    Routine maintenance is needed in our daily operation to minimize the risk of potential
    problems and ensure that our Domino server continues to function reliably.


    The redbook, A Roadmap for Deploying Domino In The Organization, SG24-5617, contains
    a useful checklist of routine maintenance that we can perform. Please refer to
    this book for more information.


    ## 4.4 Troubleshooting overview


    This section provides an overview on troubleshooting some of the basic components
    of our Web server. The discussion is separated into:


    - Section 4.4.1, "IBM HTTP Server and WebSphere log files" on page 134

    - Section 4.4.2, "DB2 diagnostic log file" on page 136


    ### 4.4.1 IBM HTTP Server and WebSphere log files


    The following logs are very useful in finding a specific problem for problem determination
    and resolution in the Web server. WebSphere logs a large amount of information
    to its log files. If something is not functioning correctly, these logs should
    be looked at. We briefly discuss some of these log files. All log files can be
    found in /opt/IBMWebAS/logs. In this directory, you will typically find one or
    more of these:


    - jstderr.log

    The JVM standard error log is probably the most useful log of all the WebSphere
    logs. In this log, the standard error output from the main WebSphere Java process
    appears.


    - jstdout.log

    The JVM standard output log is the most useful one in WebSphere. The standard
    output log contains all of the output written by Java applications to standard
    output using the methods of the static java.lang.System.out. The format of this
    log is application dependent. Use this log to inspect debugging and informational
    messages from your Java applications writing to System.out. This log is always
    enabled.


    - apache.log.INFORM.*

    The IBM HTTP Server information log contains informational and error messages
    generated by the IBM HTTP Server included with WebSphere. Each time the server
    is re-initialized, a new log is generated with a different number used as the
    last component of the file name. The major part of each of these logs is taken
    up with messages showing the properties with which WebSphere is initialized. The
    servlet service event log allows you to see when servlets are loaded, when they
    are called, and with what parameters they are called. It will contain:


    - A timestamp

    - The name of the tracer that caused the event

    - The ID of the thread that caused the event

    - The severity level of the tracer

    - Any exception generated by the event

    - The message text

    - servlet/adminservice_access_log

    - servlet/adminservice/error_log

    - servlet/adminservice/event_log


    The servlet service error log contains messages generated by WebSphere attempting
    to run servlets. This includes errors pertaining to servlets. System.out and System.err
    output that is produced by servlets is placed in standard output and standard
    error, respectively.


    ## 4.4.2 DB2 diagnostic log file


    DB2 keeps a diagnostics log file, called db2diag.log. This file is located in
    the instance home directory under subdirectory sqllib/db2dump directory. In our
    scenario, on our backend server btest3, it would be located in /home/db2inst/sqlib/db2dump.
    This file is appended to, or created and appended to if it does not already exist,
    with diagnostic information.


    The amount of diagnostic information is determined by the DIAGLEVEL found in the
    DB2 database manager configuration. Log in the DB2 instance owner and access the
    database manager configuration using the command:


    ```

    db2 get dbm cfg

    ```

