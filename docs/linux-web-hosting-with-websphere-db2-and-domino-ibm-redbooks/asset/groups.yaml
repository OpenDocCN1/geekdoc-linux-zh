    # ## 2.4.3 IBM JDK 118


    This section discusses the installation procedure for the Java Development Kit
    (JDK) in our project.


    # ### 2.4.3.1 Pre-installation of IBM JDK 118


    To start the pre-installation of IBM JDK 118, log in as the root user.'
  - '[PAGE 42]


    Before installing IBM JDK 118, you should ensure a clean installation of the Java
    environment. This involves removing any existing Java virtual machine and runtime
    environments, unless they are necessary for any other applications.


    For example, we queried the Linux distributions with the command:


    ```

    rpm -qa | grep jdk

    ```


    We found that Caldera eDesktop 2.4 installs JDK 1.2.2-1 by default. Our scenario
    requires IBM JDK 118. Hence, the default JDK was removed with the command:


    ```

    rpm -e jdk-1.2.2-1

    ```


    # 2.4.3.2 Installing IBM JDK 118


    Our target installation is in the /opt directory.


    The JDK 118 distribution is in tar format and gzipped. Logged in as the user root,
    we change the working directory to the target installation directory, /opt, then
    used the tar xzf command to uncompress and extract this file, ibm-jdk-118-linux-x86.tgz.


    Since we will be IBM HTTP Server and WebSphere after installing the JDK, we also
    define and export the environment variable JAVA_HOME to indicate where the JDK
    has been installed.


    Figure 23 shows the results of issuing the tar and export commands on our front-end
    server.


    ```

    [root@test2 /opt]$# tar xzf /mnt/cdrom/Java/ibm-jdk-1118-linux-x86.tgz

    [root@test2 /opt]$# export JAVA_HOME=/opt/jdk118/

    ```


    > Figure 23. Installing JDK 118 on the front-end server


    # 2.4.4 IBM HTTP Server


    IBM HTTP Server installation is performed while logged as the root user.


    We encountered some problems using the Apache Web server that are bundled with
    RedHat 6.2 and Caldera eDesktop 2.4. If WebSphere is installed with the Apache
    Web module, and Apache restarted, Apache complains about the Apache 1.3 API used
    by the WebSphere module. Figure 24 illustrates this error on RedHat 6.2.'
  - '[PAGE 43]


    ```

    [root@bdktest conf]# # /etc/init.d/httpd start

    Starting httpd: [Fri May 5 11:43:05 2000] [warn] Loaded DSO

    /opt/IBMWebAS/plugins/linux/mod_app_server.so uses plain app Apache 1.3

    API, this module might crash under EAPI! (please recompile it with

    -DEAPI)


    [FAILED]

    ```


    Figure 24. Apache failure loading WebSphere module


    Because of this error, Apache will not start. Hence, we had to remove the Apache
    Web server and install IBM HTTP Server 1.3.6.


    # 2.4.4.1 Removing Apache Web server


    The Apache module should be removed, using the rpm -e command, in the following
    order:


    +   1. Remove the mod_perl package with the command:

    ```

    rpm -e mod_perl

    ```n2. Remove the php package with the command:

    ```

    rpm -e php

    ```


    > Removing php package in Caldera

    For Caldera, the command is:

    ```

    rpm -e mod_php3-3.0.12-5

    ```


    +   3. Remove the Apache package with the command:

    ```

    rpm -e apache

    ```

    The following directories relating to the Apache Web server should be removed
    as follows:

    - For directory /var/log/httpd, use the command:

    ```

    rm -f /var/log/httpd

    ```

    - For directory /home/httpd, use the command:

    ```

    rm -f /home/httpd

    ```

    - For directory /etc/httpd, use the command:

    ```

    rm -f /etc/httpd

    ```


