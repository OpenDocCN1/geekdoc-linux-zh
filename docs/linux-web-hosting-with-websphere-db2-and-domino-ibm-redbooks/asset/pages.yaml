  md: 'However, since availability of some of the products is limited, we only tested
    scenarios in RedHat Version 6.2 and CalderaDesktop Version 2.4.


    # 1.2 Pattern for e-business


    The patterns for e-business aim to provide a readily available design pattern
    on building an e-business system, including the system architecture and guidelines.
    These patterns are cataloged in the following schemes:


    +   * User-to-business

    * User-to-online buying

    * Business-to-business

    * User-to-data

    * User-to-user

    * Application integration


    For more information on these patterns for e-business, see the IBM developerWorks
    Web site at: http://www.ibm.com/software/developer/web/patterns


    We have chosen to implement the most common subset of the patterns, the user-to-online
    buying, which is a subset of the user-to-business pattern. The application topology
    that we choose is a Web-ub approach, meaning that we create the application from
    scratch in the Web server with no backend integration. Figure 1 on page 3 shows
    the ideal run-time topology for this pattern.


    In Figure 1 on page 3, the e-business system for an enterprise spans from the
    demilitarized zone (DMZ) to the enterprise''s internal network. The following
    components comprises the e-business solution for the user-to-online buying pattern:


    +   * The protocol firewall filters unwanted and unnecessary protocol packages.
    It only allows incoming requests to certain machines and certain ports.

    * The request dispatch acts as the load balancing for multiple Web server systems.
    It routes the requests to a certain Web server to facilitate a balanced overall
    load, thus enhancing the overall throughput.

    * The Commerce server node is the Web server with its application server, which
    processes HTTP requests from the Internet.

    * The domain firewall protects the internal network by only allowing certain machines
    in the DMZ to send request packages to the internal network.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '• The DB server node provides the database support for the Web application.
    The data in the database is considered secure, as it is protected by both the
    protocol firewall and the domain firewall.


    | Outside world | Demilitarized Zone (DMZ) | Internal network |

    | :--- | :--- | :--- |

    | | | Online completion of orders is not done by shoppers |

    | Retail customer Cookie | | Application node |

    | Internet | Commerce server node | Application node |

    | | - Web server functions commerce application solutions to data connections
    to backends (optional) | Application node |

    | Secure and non-secure protocol | DB server node | databases |

    | | - static pages - promotions | databases work in progress Content creation
    management node |


    Figure 1. Run-time topology for user-to-online buying Pattern for e-business


    The pattern for e-business also includes product selection. However, there is
    currently no Linux option in the product selection; so, we have to define the
    product selection ourselves. We implement the IBM HTTP server and IBM WebSphere
    Application Server in the commerce server node; whereas on the DB server node,
    we put IBM DB2 and the Lotus Domino Enterprise Server. For simplicity, we do not
    implement the firewall or the dispatcher.


    For in-depth discussion on user-to-business and user-to-online buying patterns
    and their guidelines, refer to the Patterns for e-business: User-to-Business Patterns
    for Topology 1 and 2 using WebSphere Advanced Edition, SG24-5864.


    Chapter 1. Project introduction 3'
