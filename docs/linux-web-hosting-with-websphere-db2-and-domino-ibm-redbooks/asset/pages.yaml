  md: '# 3.4.1.3 Documents


    A Domino document is a container for data and is similar to a row in a database
    management system (DBMS). Each document is a collection of fields. A unique identifier
    is given to each document upon its creation and is used by the Domino database
    as a primary key.


    A document''s design is held within a Domino form, which specifies what a document
    can contain in each field, for example, a form number, a date, text, or rich text.


