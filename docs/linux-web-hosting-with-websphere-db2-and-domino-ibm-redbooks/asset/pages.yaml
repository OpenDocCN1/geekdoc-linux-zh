    # 3.3 DB2 database


    This section discusses, in detail, the steps required to build the DB2 database
    that we use. The steps that we perform are discussed in the following:


    +   - Section 3.3.1, "Modelling the database" on page 61 where we provide the
    design considerations that we face in developing the database


    +   - Section 3.3.2, "Creating the database" on page 66 shows the actual database
    creation.


    # 3.3.1 Modelling the database


    To achieve the objective of the Web site, our database must, at the very least,
    model the following entities:


    +   - Users


    Users are the customers who come to the Web site to browse, log in with a username
    and password, register a profile of redbook category interests, and redbooks.


    +   - Orders


    These entities reflect the order of a product by a user. For simplicity''s, a
    user may only order one product at a time (that is, there is no shopping basket
    concept where one or more products of differing quantities may be placed before
    an order is finalized).


    We examine each of these entities in more specific detail.


    # 3.3.1.1 Users


    The entity users must have the following attributes:'
  merge: -1
  pgno: 70
- img_proc: true
  md: '+   • Username username is considered to be unique. Hence, we validate that
    a user is registered by verifying the combination of the username and password.
    Each and every time an action is to be performed on the database, whether in changing
    or accessing user passwords, information, and profiles, the username and password
    must be verified.


    The username and password information needs to be built separately for performance
    and implementation reasons. For performance reasons, we need to separate the access
    to this information from all others to be able to provide fast and efficient access
    to the data. From an implementation point of view, we would also find it more
    convenient to later change password encryption algorithms and access methods.


    +   • User information

    The user information contains information of the user''s first and last names,
    address, email, and so so on. Once a user is registered, this information is usually
    static. These data are not usually changed.


    We added the date joined attribute to track when the user is registered.


    +   • Profile information

    The profile reflects the user''s interests in terms of categories of redbooks.
    This list of categories of interest to the user may change often, depending on
    the user. The list of categories may also change in time.


    Based on the differences of the attributes, we decide to implement these attributes
    in different tables.


    # 3.3.1.2 Orders


    Orders have the following attributes:


    +   • A username associated with the order

    • The timestamp of the order

    • The product that has been ordered

    • A unique order identification number


    This unique order ID is required, as we can no longer use username as a unique
    identifier (as a user can, or be able to, order more than one product).'
