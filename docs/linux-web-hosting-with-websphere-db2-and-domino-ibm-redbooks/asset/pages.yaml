  md: "# 3.3.1.3 Complete design\n\nBased on the discussions for the user and order\
    \ items, we will create four database tables. Each table has a set of fields,\
    \ or column names, where each field has a data type, length, and a nullable condition.\n\
    \n+   * The data type\n  There are various data types that are available in DB2.\
    \ We use the following data types in our database tables:\n  - varchar: Provides\
    \ variable length string type\n  - char: Provides fixed length string type\n \
    \ - date: Provides a date-only data type\n  - timestamp: Provides a date and time\
    \ up to a microsecond\n  - int: Provides a whole number type\n* The field length\n\
    \  This represents the length of the field, if appropriate. For example, a data\
    \ type of char or varchar requires a length, a data type of date, timestamp, or\
    \ int does not.\n* The nullable condition\n  This last attribute, the nullable\
    \ condition, exists for us to track whether the field can be left empty or undefined\
    \ or must be filled in. For example, a 0 length string; it is not a null string.\n\
    \nThe structure of the database that we built is represented by the Entity Relationship\
    \ diagram shown in Figure 54."
