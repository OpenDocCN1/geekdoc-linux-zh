    The pdksh shell is used by the DB2 installer and setup scripts. It is not normally
    installed as part of a server installation of Linux. Here we had to install it
    using the `rpm command. Figure 7 shows the command we used to install the pdksh
    package from the CD-ROM.


    ```

    [root@dbtest3 /root]# rpm -i /mnt/cdrom/RedHat/RPMS/pdksh-5.2.14-2136.rpm

    ```


