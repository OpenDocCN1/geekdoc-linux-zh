  md: "# # Appendix E. Sample Domino scripts\n\nThis appendix provides the script\
    \ file listings for the Notes operation.\n\n# ## E.1 start_domino.sh\n\n```\n\
    ```bash\n#!/bin/bash\n\nNOTES_USER=notes # Notes user id\nNOTES_PATH=/home/notes\
    \ # Home directory of Notes userid\nNOTES_DATA=/opt/notesdata/ # Domino data directory\n\
    SERVER=/opt/lotus # Domino server location\nSERVER_NAME=${SERVER##*/}} # Domino\
    \ server name\nOUTPUT_LOG=/var/log/$SERVER_NAME.log # Where we will put the log\n\
    PATH=/opt/lotus/bin:$HOME/bin:$PATH\nif [ \"$USER\" = notes ];\nthen\n    echo\
    \ \"Don't use root for Domino server \"\n    su notes\nfi\nif [ ! -x $NOTES_SERVER/bin/server\
    \ ];\\ then\n    echo \"Cannot found the server command exiting\"\n    exit 1\n\
    fi\nif [ ! -d $NOTES_DATA ];\nthen\n    echo \"Cannot access notes data directory\
    \ exiting\"\n    exit 1\nfi\nNOTES_RUNNING=$(ps -fu notes | awk '{print $8}' |\
    \ grep /opt/lotus | \\\ngrep -v grep | cut -d\"-\" -f 1,2,3,4 | head -n1)\nif\
    \ ! $NOTES_RUNNING;\nthen\n    echo \"Domino Server is already running exiting\"\
    \n    exit 1\nfi\ncd $NOTES_DATA\nrm -f *.notes.lk 2>&1\nmems=$(ipcs -m | grep\
    \ $NOTES_USER | awk '{ print $2 }')\nsems=$(ipcs -s | grep $NOTES_USER | awk '{\
    \ print $2 }')\nfor j in $mems; do [ -n \"$j\" ]; then ipcrm shm $j > tmp.lck;\
    \ done\nfor j in $sems; do [ -n \"$j\" ]; then ipcrm sem $j > tmp.lck; done\n\
    rm -f tmp.lck\n\necho \"Running Domino for LINUX\"\n```\n```"
