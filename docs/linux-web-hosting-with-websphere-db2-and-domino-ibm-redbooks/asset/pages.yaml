  md: 'Before installing IBM JDK 118, you should ensure a clean installation of the
    Java environment. This involves removing any existing Java virtual machine and
    runtime environments, unless they are necessary for any other applications.


    For example, we queried the Linux distributions with the command:


    ```

    rpm -qa | grep jdk

    ```


    We found that Caldera eDesktop 2.4 installs JDK 1.2.2-1 by default. Our scenario
    requires IBM JDK 118. Hence, the default JDK was removed with the command:


    ```

    rpm -e jdk-1.2.2-1

    ```


    # 2.4.3.2 Installing IBM JDK 118


    Our target installation is in the /opt directory.


    The JDK 118 distribution is in tar format and gzipped. Logged in as the user root,
    we change the working directory to the target installation directory, /opt, then
    used the tar xzf command to uncompress and extract this file, ibm-jdk-118-linux-x86.tgz.


    Since we will be IBM HTTP Server and WebSphere after installing the JDK, we also
    define and export the environment variable JAVA_HOME to indicate where the JDK
    has been installed.


    Figure 23 shows the results of issuing the tar and export commands on our front-end
    server.


    ```

    [root@test2 /opt]$# tar xzf /mnt/cdrom/Java/ibm-jdk-1118-linux-x86.tgz

    [root@test2 /opt]$# export JAVA_HOME=/opt/jdk118/

