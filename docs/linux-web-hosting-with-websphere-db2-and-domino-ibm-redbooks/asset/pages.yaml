  md: '# 2.4.2 Domino Enterprise server


    In our project, we installed the Domino server on the backend server, bdtest3.
    Before beginning the installation of the Domino server, you ensure the following:


    +   * Verify library structure and availability


    Ensure that the kernel version is 2.2.5 or higher, and glibc 2.1.1 or greater
    and libstdc++2.9 or greater was installed on the machine. More importantly, the
    distribution must follow the libstdc++-libc6 naming convention.

    * Stop any unnecessary services on the Linux box.


    We have to make sure that services, such as http server or sendmail may have started
    automatically, stopped.

    * Check terminal size


    Ensure that you have a terminal size of 80 columns by 24 rows, as is required
    by the Domino installation program. You can check your terminal size by using
    the echo COLUMNS and echo LINES commands from the Linux prompt where you will
    perform the installation.


