  md: 'If the server needs to be killed quickly, and the above commands fail for

    reason, the server keeps the parent process ID in a file called httpd.pid. This

    file can be found in /opt/IBMHTTPServer/logs/. Sending the TERM signal to

    this process will stop the server ungracefully.


    Once the required command has been issued, we can check whether it

    was successful by issuing the following command:


    ```

    ps ax | grep httpd

    ```


    Output from this command looks similar to Figure 83. Note that in our

    example, we have started seven http servers, and it is sufficient to kill

    only the parent ID to stop all the processes.


    ```

    [root@dbtest1]# ps ax | grep httpd

    12571 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13165 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13166 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13167 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13168 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13169 S 0:00 /opt/IBMHTTPServer/bin/httpd

    13180 pts/13 S 0:00 grep httpd

    [root@dbtest1]# grep httpdcommand

    ```


    Figure 83. Output of the ps.ax|grep httpd


    To ensure that the Java processes that are started by WebSphere is also

    terminated, use the killall java command before stopping the HTTP

    server.


