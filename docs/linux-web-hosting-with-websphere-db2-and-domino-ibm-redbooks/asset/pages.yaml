- img_proc: true
  md: '# 2.3.2 RedHat installation


    Installation of RedHat is easy, simply boot off the RedHat 6.2 CD-ROM and choose
    the defaults for most options, with the following exceptions:


    +   - Install type


    We chose Server for our installation type.


    +   - Network Configuration


    Our network was token ring based; hence, we chose to set up the tr0 interface
    for the token ring. This option is available only from a GUI setup, and it is
    not available when installing in text mode.


    +   - Account Configuration


    As previously mentioned in 2.2, “Installation overview” on page 8, we created
    a userID called admin.


    +   - X Configuration


    Since we would also need an X11 server to configure WebSphere using a Web browser,
    we upgraded the Linux installation for the front-end server to include X11. Remember
    to install at least the following for X11:


    +   - XFree86

    - XFree86 SVGA server

    - A XFree86 server specific for the video card (in our case, we used the XFree86
    S3 server)

    - X11R6 Contrib

    - Xconfigurator

    - various XFree86 fonts

    - XFree86 libraries

    - XFree86 xfs


    We found that choosing the combination of IBM G74 and S3 TrioD with 4 MB RAM would
    not pass the X Configuration page’s test-configuration button. The fix was to
    specify a custom monitor as SVGA non-interlaced, 50-90 Hz.


    Once installation was complete, the CD was removed from the CD-ROM drive, and
    the server was rebooted.


    We can now proceed to the application installation phase.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 2.3.3 CalderaDesktop installation


    The Caldera version 2.4 installation is easy, simply boot the Caldera Version
    2.4 CD-ROM and choose the defaults for most options, with the following exceptions:


    +   - Network Configuration


    Our network was token ring based; hence, we chose to set up the tr0 interface
    for token ring. Caldera has scripts for ethernet network cards, but not for token
    rings. We modified the ethernet scripts to produce the required token ring interface.
    We used the following steps:


    +   a. Ensure the correct driver for the token ring has been loaded at boot time.
    was the olympic driver for us. it is precompiled to kernel 2.2.14.


    # Token olympic driver


    We had a problem with the olympic driver of the 2.2.14 in Caldera eDesktop 2.4;
    so, we changed the kernel rpm to the 2.2.14 kernel that is distributed for Caldera
    eServer 2.3 to activate the olympic


    +   b. Edit /etc/sysconfig/network file and add a token ring interface to IF_LIST
    as shown in Figure 4.


    ```

    NETWORKING=yes

    HOSTNAME=bdtest1.itsc.austin.ibm.com

    IF_LIST=lo eth tr0 sl ppp

    ```


    Figure 4. /etc/sysconfig/network-scripts/ifcfg-eth0 to /etc/sysconfig/network-scripts/ifcfg-tr0
    as shown in Figure 5.


    +   c. Copy /etc/sysconfig/network-scripts/ifcfg-tr0 to as shown in Figure 5.


    ```

    #bdtest1 network-scripts]# cp ifcfg-eth0 ifcfg-tr0

    ```


    Figure 5. Copy the eth0 script to tr0 script


    +   d. Edit the ifcfg-tr0 script to reflect our token ring network parameters.
    The content of ifcfg-tr0 is shown in Figure 6 on page 14


    Chapter 2. Setup and configuration 13'
