  md: "# 2.2 cleanup_domino.sh\n\n#!/bin/kash\nNOTES_USER=notes\nNOTES_PATH=/local/notesdata\n\
    PATH=$NOTES_PATH:/opt/lotus/bin:$HOME:$PATH\n\n```\ncount=0\nNOTES_RUNNING='-ps\
    \ -fu $NOTES_USER | grep /opt/lotus | grep -v grep | grep -v bash'\nwhile [[ -n\
    \ $NOTES_RUNNING ]]; do\n  sleep 10\n  count=$((count + 1))\n  echo \"...waiting\
    \ for $count seconds\"\n  if [ $count -eq 1 ]; then\n    echo \"Domino server\
    \ is still running after 2 minutes\"\n    echo \"Now ... he will dead\"\n    for\
    \ i in $(ps -m | grep $NOTES_USER | grep /opt/lotus|grep -v grep|grep -v \\|awk\
    \ '{print $2}')'); do\n      kill -9 $i\n    done\n    seps=$(ps -m | grep $NOTES_USER\
    \ | awk '{print $2}')\\n    sems=$(ps -cs | grep $NOTES_USER | awk '{print $2}')\\\
    n    for j in $seps; do if [ -n \"$j\" ]; then ipcmrm shm $j>tmp.lck;fi; done\n\
    \    for j in $sems; do if [ -n \"$j\" ]; then ipcmrm sem $j>tmp.lck;fi; done\n\
    \    rm -f tmp.lck\n    exit\n  fi\nNOTES_RUNNING='-ps -fu $NOTES_USER | grep\
    \ /opt/lotus | grep -v grep '\ndone\nrm -f $NOTES_PATH/~notes.lck\necho Domino\
    \ shutdown now completed\n```"
