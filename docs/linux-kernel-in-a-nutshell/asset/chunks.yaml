    在几乎所有现代 Intel 系统上，都需要 ACPI 才能使机器正常工作。ACPI 是一项标准，允许计算机的 BIOS 与操作系统协作，以间接的方式访问硬件，其目的是用较少的特定操作系统的代码来处理广泛的设备。ACPI
    还提供了一种帮助挂起和恢复机器的机制，并可以控制处理器和风扇的速度。如果您使用的是笔记本电脑，建议启用此选项。


    ### 启用 ACPI


    ```

    Power management options (ACPI, APM)

        ACPI (Advanced Configuration and Power Interface) Support

               [*] ACPI Support

    ```


    许多不同的 ACPI “驱动程序”控制不同类型的 ACPI 设备。您应该启用机器上拥有的特定驱动：


    ```

    Power management options (ACPI, APM)

        ACPI (Advanced Configuration and Power Interface) Support

               [*] ACPI Support

                         AC Adapter

                           Battery

                           Button

