    \n# Chapter 4. Configuring and Building\n\nNow that you have downloaded the source\
    \ for your selected kernel version and installed it into a local directory, it\
    \ is time to build the code. The first step is to configure the kernel with the\
    \ appropriate options; the kernel can then be compiled. Both tasks are done through\
    \ the standard *make* utility.\n\n# Creating a configuration\n\nThe kernel configuration\
    \ is kept in a file called *.config* in the top directory of the kernel source\
    \ tree. If you have just expanded the kernel source code, there will be no *.config*\
    \ file, so it needs to be created. It can be created from scratch, created by\
    \ basing it on the \"default configuration,\" taken from a running kernel version,\
    \ or taken from a distribution kernel release. We will cover the first two methods\
    \ here, and the last two methods in [Chapter 7](#index_split_053.html_filepos196322).\n\
    \n## Configuring from scratch\n\nThe most basic method of configuring a kernel\
    \ is to use the *make config* method:\n\n`$` **`cd linux-2.6.17.10`**\n\n`$` **`make\
    \ config`**\n\n` make config`\n\n`scripts/kconfig/conf arch/i386/Kconfig`\n\n\
    `*`\n\n`* Linux Kernel Configuration`\n\n`*`\n\n`*`\n\n`* Code maturity level\
    \ options`\n\n`*`\n\n`Prompt for development and/or incomplete code/drivers (EXPERIMENTAL)\
    \ [Y/n/?]` **`Y`**\n\n`*`\n\n`* General setup`\n\n`*`\n\n`Local version - append\
    \ to kernel release (LOCALVERSION) []` \n\n`Automatically append version information\
    \ to the version string (LOCALVERSION_AUTO) [Y/n/?]` **`Y`**\n\n`...`\n\nThe kernel\
    \ configuration program will step through every configuration option and ask you\
    \ if you wish to enable this option or not. Typically, your choices for each option\
    \ are shown in the format `[Y/m/n/?]` The capitalized letter is the default, and\
    \ can be selected by just pressing the Enter key. The four choices are:\n\n`y`\n\
    \n> Build directly into the kernel.\n\n`n`\n\n> Leave entirely out of the kernel.\n\
    \n`m`\n\n> Build as a module, to be loaded if needed.\n\n`?`\n\n> Print a brief\
    \ descriptive message and repeat the prompt.\n\nThe kernel contains almost two\
    \ thousand different configuration options, so being asked for every individual\
    \ one will take a very long time. Luckily, there is an easier way to configure\
    \ a kernel: base the configuration on a pre-built configuration.\n\n## Default\
    \ configuration options\n\nEvery kernel version comes with a \"default\" kernel\
    \ configuration. This configuration is loosely based on the defaults that the\
    \ kernel maintainer of that architecture feels are the best options to be used.\
    \ In some cases, it is merely the configuration that is used by the kernel maintainer\
    \ himself for his personal machines. This is true for the i386 architecture, where\
    \ the default kernel configuration matches closely what Linus Torvalds uses for\
    \ his main development machine.\n\nTo create this default configuration, do the\
    \ following:\n\n`$` **`cd linux-2.6.17.10`**\n\n`$` **`make defconfig`**\n\nA\
    \ huge number of configuration options will scroll quickly by the screen, and\
    \ a *.config* file will be written out and placed in the kernel directory. The\
    \ kernel is now successfully configured, but it should be customised to your machine\
    \ in order to make sure it will operate correctly.\n\n# Modifying the configuration\n\
    \nNow that we have a basic configuration file created, it should be modified to\
    \ support the hardware you have present in the system. For details on how to find\
    \ out which configuration options you need to select to achieve this, please see\
    \ [Chapter 7](#index_split_053.html_filepos196322). Here we will show you how\
    \ to select the options you wish to change.\n\nThere are three different interactive\
    \ kernel configuration tools: a terminal-based one called `menuconfig`, a GTK+-based\
    \ graphical one called `gconfig`, and a QT-based graphical one called `xconfig`.\n\
    \n## Console configuration method\n\nThe `menuconfig` way of configuring a kernel\
    \ is a console-based program that offers a way to move around the kernel configuration\
    \ using the arrow keys on the keyboard. To start up this configuration mode, enter:\n\
    \n`$` **`make menuconfig`**\n\nYou will be shown a screen much like [Figure 4-1](#index_split_032.html_filepos127034)."
