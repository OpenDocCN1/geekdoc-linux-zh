  trans: '

    可以在多个设备之间共享单个并行端口，并且将所有相应的驱动程序编译到内核中是安全的。如果您有多个并行端口，并想在加载模块时指定该驱动程序使用哪一个端口和 IRQ，请参阅
    `Documentation/parport.txt`。


    # PNP — 即插用支持


    即插用（PnP）是一种针对外围设备的标准，允许通过软件对其进行配置，例如分配 IRQ 或其他参数。这些卡上不需要跳线帽；相反，这些值将从 BIOS、操作系统或使用用户空间工具提供给这些卡。


    如果您希望 Linux 为您的即插用设备配置，请在此处选择 yes。此时，您还应该对所有需要的协议都选择 yes。或者，您也可以在此处选择 no，并使用 `isapnptools`
    软件包等用户空间工具来配置您的即插用设备。


    # ISAPNP — ISA 即插用支持


    如果您希望支持 ISA 即专用设备，请在此处选择 yes。在 `Documentation/isapnp.txt` 中提供了相关信息。


    如果您有 ISA 即专用设备，请使用位于 [`www.roestock.demon.co.uk/isapnptools`](http://www.roestock.demon.co.uk/isapnptools)
    的 ISA PnP 工具来正确配置它们。


    # PNPBIOS — 即插用 BIOS 支持（实验性）


    Linux 使用“即插用 BIOS 规范版本 1.0A (1994 年 5 月 5 日)”中定义的 PNPBIOS 来自动检测内置主板资源（例如并行端口资源）。


    如果您希望内核检测并为您的主板设备分配资源（在某些系统中，这些由 BIOS 禁用），请在此处选择 yes。PNPBIOS 还可以帮助防止主板设备与其他总线设备之间的资源冲突。


    ACPI 预计将取代 PNPBIOS。目前它们可以良好地共存。如果您拥有支持 ACPI 的非 ISA 系统，您可能不需要 PNPBIOS 支持。


    # IDE — ATA/ATAPI/MFM/RLL 支持


    如果您在此处选择 yes，您的内核将能够管理低成本质存储单元，如 ATA/(E)IDE 和 ATAPI 单元。此类此类设备是 IDE 硬盘和 ATAPI CD-ROM
    驱动器。


    如果您的系统是纯 SCSI 且不使用这些接口，可以在此处选择 no。


    集成磁盘电子（IDE，也称为 ATA-1）是一种用于硬盘等质存储单元的连接标准。它由 Western Digital 和 Compaq Computer 于
    1984 年设计，当时命名为 ST506。许多硬盘使用 IDE 接口。


    AT 附件（ATA）是 IDE 规范的超集。ST506 也称为 ATA-1。


    Fast-IDE 是 ATA-2（也称为 Fast ATA）。


    增强 IDE（EIDE）是 ATA-3。它提供了对磁盘（通过 LBA 标准最高支持 8.4GB）、更多磁盘（4 个而非 2 个）以及磁带和 cdrom 等其他质存储单元的支持。


    UDMA/33（也称为 UltraDMA/33）是 ATA-4。通过使用快速 DMA 控制器，它提供了比之前 ATA/IDE 标准中 PIO（程序控制输入输出）更快的传输模式（对
    CPU 的负载更小）。


    ATA 数据包接口（ATAPI）是一种用于 EIDE 磁带和 CD-ROM 驱动器的协议，许多方面与 SCSI 协议相似。


    SMART IDE（自我监控、分析和报告技术）的设计旨在通过检测预硬件故障状态（热量、访问时间等）防止数据损坏和磁盘崩溃。1995 年 6 月之后制造的硬盘可能遵循此标准。内核本身并不管理此项；但有很多如
    `smart` 等用户程序可以从磁盘驱动器查询 SMART 参数的状态。


    更多信息，请阅读 `Documentation/ide.txt`。


    # BLK_DEV_IDE — 增强 IDE/MFM/RLL 磁盘/光驱/带/软盘支持


    如果您在此处选择 yes，您将使用全功能 IDE 驱动程序控制多达十个 ATA/IDE 接口，每个接口都可以提供一个主”设备和一个“从”设备，总共多达二十个
    ATA/IDE 磁盘/光驱/带/软盘。


    关于大型（540 MB）IDE 硬盘、多接口、如果 ATA/IDE 设备未自动检测该怎么办、声卡 ATA/IDE 端口、模块支持和其他主题的有用信息包含在
    `Documentation/ide.txt` 中。关于硬盘的详细信息，请咨询 Disk-HOWTO 和 Multi-Disk-HOWTO，这些文档可在 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)
    获取。


    为了提高性能微调 ATA/IDE 驱动器/接口参数，请在 ftp://ibiblio.org/pub/Linux/system/hardware 查找 `hdparm`
    包。


    如果根文件系统（包含 `/*` 目录的）位于 IDE 设备上，请勿将此驱动程序编译为模块。


    如果您有一个或多个 IDE 硬盘，请启用此选项。如果您的系统没有 IDE 硬盘，或者内存要求非常紧张，可以在此处选择 no，并选择 `Old hard disk
    driver` 选项以节省内核中约 13 KB 的内存。


    # BLK_DEV_IDEDISK — 包含 IDE/ATA 支持


    这将包含对 MFM/RLL 硬盘的增强支持。如果您有 MFM/RLL 硬盘且没有特殊理由使用旧硬盘驱动程序，请选择 yes。如果您是纯 SCSI 系统，可以在此处选择
    no。


    如果您的根文件系统（包含 `/*` 目录的）位于 IDE 设备上，请勿将此驱动程序编译为模块。


    # BLK_DEV_IDECD — 包含 IDE/ATAPI 光驱支持


    如果您有使用 ATAPI 协议的光驱，请在此处选择 yes。ATAPI 是一种用于 IDE 光驱和磁带驱动器的协议，在许多方面与 SCSI 协议相似。大多数新型光驱使用
    ATAPI，包括 NEC-260、Mitsumi FX400 以及几乎所有双倍或更好的驱动器。


    如果您在此处选择 yes，光驱将在启动时与其他 IDE 设备一起被识别，名称类似于 `hdb` 或 `hdc`。如果这是您的唯一光驱，可以在所有光驱选项上选择
    no，但请确保也启用 `ISO 9660 文件系统支持`。


    注意，旧版本的 LILO（Linux Loader）无法处理 IDE/ATAPI 光驱，请安装更高版本的 LILO，可在 [`lilo.go.dyns.org`](http://lilo.go.dyns.org)
    获取。


    # BLK_DEV_IDEFLOPPY — 包含 IDE/ATAPI 软盘支持


    有一个使用 ATAPI 协议的 IDE 软盘，请回答 yes。ATAPI 是一种用于 IDE 光驱/磁带/软盘驱动器的协议，与 SCSI 协议相似。


    此驱动程序还支持 LS-120 和 IDE/ATAPI Iomega ZIP 硬盘。关于跳线设置以及 ZIP 硬盘何时使用分区表的信息，请参见 [http://www.tueue.nl/~aeb/linux/zip/zip-1.html](http://www.tueue.nl/~aeb/linux/zip/zip-1.html）。（此驱动程序不支持
    ATAPI PD-CD/CDR 驱动器；如果回答 `SCSI 模拟支持` 则可用）。


    如果您在此处选择 yes，软盘将与其他 IDE 设备一起被识别，类似于 `hdb` 或 `hdc`（使用 `mesg` 命令检查启动消息）。


    # SCSI — SCSI 设备支持


    如果您想在 Linux 下使用 SCSI 硬盘、SCSI 磁带机、SCSI 光驱或其他任何 SCSI 设备，请选择 yes，并确保知道 SCSI 主适配器的名称（计算机内部“说”SCSI
    协议的卡，也称为 SCSI 控制器），因为系统会要求它。


    如果您有使用 SCSI 协议的设备，也需要在此处选择 yes。这些设备的示例包括并行端口 IOMEGA ZIP 硬盘、USB 存储设备、光纤、FireWire
    存储以及 IDE-SCSI 模拟驱动程序。


    如果您的根文件系统（包含 `/*` 目录的）位于 SCSI 设备上，请勿将此编译为模块。


    # BLK_DEV_SD — SCSI 磁盘支持

    '
- fmt: '

    If you want to use SCSI hard disks, Fibre Channel disks, USB storage, or the SCSI
    or parallel port version of the IOMEGA ZIP drive, say yes and read the SCSI-HOWTO,
    the Disk-HOWTO, and the Multi-Disk-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).
    This is `not` for SCSI CD-ROMs.


    Do not compile this driver as a module if your root file system (the one containing
    the directory `/*`) is located on a SCSI disk. In this case, do not compile the
    driver for your SCSI host adapter as a module either.


    ## CHR_DEV_ST — SCSI tape support


    If you want to use a SCSI tape drive under Linux, say yes and read the SCSI-HOWTO,
    available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto),
    and `Documentation/scsi/st.txt` in the kernel source. This is `not` for SCSI CD-ROMs.


    ## BLK_DEV_SR — SCSI CDROM support


    If you want to use a SCSI or FireWire CD-ROM under Linux, say yes and read the
    SCSI-HOWTO and the CDROM-HOWTO at [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto)
    for more directions. Also make sure to enable the `ISO 9660 CD-ROM file system
    support` option.


    ## CHR_DEV_SG — SCSI generic support


    If you want to use SCSI scanners, synthesizers, or CD-writers, or just about anything
    having "SCSI" in its name other than hard disks, CD-ROMs, or tapes, say yes here.
    These won''t be supported by the kernel directly, so you need some additional
    software that knows how to talk to these devices using the SCSI protocol:


    For scanners, look at SANE [http://www.sane-project.org](http://www.sane-project.org).
    For CD writer software look at Cdrtools [http://cdrecord.berlios.de/old/private/cdrecord.html](http://cdrecord.berlios.de/old/private/cdrecord.html),
    and for burning a "disk at once," check out CDRDAO [http://cdrdao.sourceforge.net](http://cdrdao.sourceforge.net).
    Cdparanoia is a high quality digital reader of audio CDs ([http://www.xiph.org/paranoia](http://www.xiph.org/paranoia)).
    For other devices, it''s possible that you''ll have to write the driver software
    yourself. Please read the file `Documentation/scsi/scsi-generic.txt` for more
    information.


    ## CHR_DEV_SCH — SCSI media changer support


    This is a driver for SCSI media changers. The most common such devices are tape
    libraries and MOD/CDROM jukeboxes. This option is for real jukeboxes; you don''t
    need it for tiny 6-slot CD-ROM changers. Media changers are listed as "Type: Medium
    Changer" in `*/proc/scsi/scsi`. Check `Documentation/scsi/scsi-changer.txt` for
    details.


    ## SCSI_MULTI_LUN — Probe all LUNs on each SCSI device


    If you have a SCSI device, such as a CD jukebox, that supports more than one LUN
    (Logical Unit Number), and only one LUN is detected, you can say yes here to force
    the SCSI driver to probe for multiple LUNs. A SCSI device with multiple LUNs acts
    logically like multiple SCSI devices. The vast majority of SCSI devices have only
    one LUN, and so most people can say no here. The `max_luns` boot/module parameter
    allows you to override this setting.


    ## SCSI_SATA — Serial ATA (SATA) support


    This driver family supports Serial ATA host controllers and devices.


    ## MD — Multiple devices driver support (RAID and LVM)


    This option supports multiple physical spindles through a single logical device,
    and is required for RAID and logical volume management.


    ## BLK_DEV_MD — RAID support


    This driver lets you combine several hard disk partitions into one logical block
    device. This can be used to simply append one partition to another one or to combine
    several redundant hard disks into a RAID 1, RAID 4, or RAID 5 device to provide
    protection against hard disk failures. This is called `software RAID` because
    the combining of the partitions is done by the kernel. `Hardware RAID` means that
    the combining is done by a dedicated controller; if you have such a controller,
    you do not need to say yes here.


    More information about software RAID on Linux is n the Software RAID mini-HOWTO,
    available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).
    There you will also learn where to get the supporting userspace raidtools utilities.


    ## BLK_DEV_DM — Device mapper support


    Device-mapper is a low level volume manager. It works by allowing people to specify
    mappings for ranges of logical sectors. Various mapping types are available, in
    addition to which people may write their own modules containing custom mappings.


    Higher level volume managers such as LVM2 use this driver.


    ## IEEE1394 — IEEE 1394 (FireWire) support


    IEEE 1394 describes a high performance serial bus, which is also known as FireWire
    or i.Link and is used for connecting all sorts of devices.


    If you have FireWire and want to use it, say yes.


    ## I2O — I/O support


    Intelligent Input/Output (I2O) architecture allows hardware drivers to be split
    into two parts: an OS-specific module called the OSM and hardware-specific module
    called the HDM. This allows the same HDM to be used under different operating
    systems. The I2O card contains a special I/O processor (IOP), allowing high speeds
    because the CPU does not have to deal with I/O. If you have an I2O interface card
    in your computer, say yes.


    ## NETDEVICES — Network device support


    You can say no here if you do not intend to connect your Linux box to any other
    computer. You''ll have to say yes if your computer contains a network card.


    ## NET_ETHERNET — Ethernet (10 or 100Mbit)


    Ethernet (also called IEEE 802.3 or ISO 882-2) is the most common type of Local
    Area Network (LAN) in universities and companies.


    If your Linux machine will be connected to an Ethernet and you have an Ethernet
    network interface card (NIC) installed in your computer, say yes here and read
    the Ethernet-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).
    You will then also have to say yes to the driver for your particular NIC.


    Note that the answer to this question won''t directly affect the kernel: saying
    no will just cause the configurator to skip all the questions about Ethernet network
    cards.


    ## NET_RADIO — Wireless LAN drivers (non-hamradio) and Wireless Extensions


    Support for wireless LANs and everything having to do with packet radio, but not
    with amateur radio or FM broadcasting.

    '
  raw: 'If you want to use SCSI hard disks, Fibre Channel disks, USB storage, or the
    SCSI or parallel port version of the IOMEGA ZIP drive, say yes and read the SCSI-HOWTO,
    the Disk-HOWTO, and the Multi-Disk-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).
    This is *not* for SCSI CD-ROMs.


    Do not compile this driver as a module if your root file system (the one containing
    the directory */*) is located on a SCSI disk. In this case, do not compile the
    driver for your SCSI host adapter as a module either.


    ## Name


    CHR_DEV_ST — SCSI tape support


    If you want to use a SCSI tape drive under Linux, say yes and read the SCSI-HOWTO,
    available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto),
    and *Documentation/scsi/st.txt* in the kernel source. This is *not* for SCSI CD-ROMs.


    ## Name


    BLK_DEV_SR — SCSI CDROM support


    If you want to use a SCSI or FireWire CD-ROM under Linux, say yes and read the
    SCSI-HOWTO and the CDROM-HOWTO at [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto)
    for more directions. Also make sure to enable the `ISO 9660 CD-ROM file system
    support` option.


    ## Name


    CHR_DEV_SG — SCSI generic support


    If you want to use SCSI scanners, synthesizers, or CD-writers, or just about anything
    having "SCSI" in its name other than hard disks, CD-ROMs, or tapes, say yes here.
    These won''t be supported by the kernel directly, so you need some additional
    software that knows how to talk to these devices using the SCSI protocol:


    For scanners, look at SANE [http://www.sane-project.org](http://www.sane-project.org).
    For CD writer software look at Cdrtools [http://cdrecord.berlios.de/old/private/cdrecord.html](http://cdrecord.berlios.de/old/private/cdrecord.html),
    and for burning a "disk at once," check out CDRDAO [http://cdrdao.sourceforge.net](http://cdrdao.sourceforge.net).
    Cdparanoia is a high quality digital reader of audio CDs ([http://www.xiph.org/paranoia](http://www.xiph.org/paranoia)).
    For other devices, it''s possible that you''ll have to write the driver software
    yourself. Please read the file *Documentation/scsi/scsi-generic.txt* for more
    information.


    ## Name


    CHR_DEV_SCH — SCSI media changer support


    This is a driver for SCSI media changers. The most common such devices are tape
    libraries and MOD/CDROM jukeboxes. This option is for real jukeboxes; you don''t
    need it for tiny 6-slot CD-ROM changers. Media changers are listed as "Type: Medium
    Changer" in */proc/scsi/scsi*. Check *Documentation/scsi/scsi-changer.txt* for
    details.


    ## Name


    SCSI_MULTI_LUN — Probe all LUNs on each SCSI device


    If you have a SCSI device, such as a CD jukebox, that supports more than one LUN
    (Logical Unit Number), and only one LUN is detected, you can say yes here to force
    the SCSI driver to probe for multiple LUNs. A SCSI device with multiple LUNs acts
    logically like multiple SCSI devices. The vast majority of SCSI devices have only
    one LUN, and so most people can say no here. The `max_luns` boot/module parameter
    allows you to override this setting.


    ## Name


    SCSI_SATA — Serial ATA (SATA) support


    This driver family supports Serial ATA host controllers and devices.


    ## Name


    MD — Multiple devices driver support (RAID and LVM)


    This option supports multiple physical spindles through a single logical device,
    and is required for RAID and logical volume management.


    ## Name


    BLK_DEV_MD — RAID support


    This driver lets you combine several hard disk partitions into one logical block
    device. This can be used to simply append one partition to another one or to combine
    several redundant hard disks into a RAID 1, RAID 4, or RAID 5 device to provide
    protection against hard disk failures. This is called *software RAID* because
    the combining of the partitions is done by the kernel. *Hardware RAID* means that
    the combining is done by a dedicated controller; if you have such a controller,
    you do not need to say yes here.


    More information about software RAID on Linux is n the Software RAID mini-HOWTO,
    available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).
    There you will also learn where to get the supporting userspace raidtools utilities.


    ## Name


    BLK_DEV_DM — Device mapper support


    Device-mapper is a low level volume manager. It works by allowing people to specify
    mappings for ranges of logical sectors. Various mapping types are available, in
    addition to which people may write their own modules containing custom mappings.


    Higher level volume managers such as LVM2 use this driver.


    ## Name


    IEEE1394 — IEEE 1394 (FireWire) support


    IEEE 1394 describes a high performance serial bus, which is also known as FireWire
    or i.Link and is used for connecting all sorts of devices (most notably, digital
    video cameras) to your computer.


    If you have FireWire hardware and want to use it, say yes here. This is the core
    support only. You will also need to select a driver for your IEEE 1394 adapter.


    ## Name


    I2O — I2O support


    The Intelligent Input/Output (I2O) architecture allows hardware drivers to be
    split into two parts: an operating-system-specific module called the OSM and an
    hardware-specific module called the HDM. The OSM can talk to a whole range of
    HDM''s, and ideally the HDM''s are not OS-dependent. This allows for the same
    HDM driver to be used under different operating systems if the relevant OSM is
    in place. In order for this to work, you need to have an I2O interface adapter
    card in your computer. This card contains a special I/O processor (IOP), allowing
    high speeds because the CPU does not have to deal with I/O.


    If you say yes here, you will get a choice of interface adapter drivers and OSMs
    and will have to enable the correct ones.


    ## Name


    NETDEVICES — Network device support


    You can say no here if you do not intend to connect your Linux box to any other
    computer.


    You''ll have to say yes if your computer contains a network card that you want
    to use under Linux. If you are going to run SLIP or PPP over a telephone line
    or null modem cable you need say yes here. Connecting two machines with parallel
    ports using PLIP needs this, as well as AX.25/KISS for sending Internet traffic
    over amateur radio links.


    See also the *Linux Network Administrator''s Guide* (O''Reilly) available at [http://www.tldp.org/guides.html](http://www.tldp.org/guides.html).


    ## Name


    NET_ETHERNET — Ethernet (10 or 100Mbit)


    Ethernet (also called IEEE 802.3 or ISO 8802-2) is the most common type of Local
    Area Network (LAN) in universities and companies.


    Common varieties of Ethernet are: 10BASE-2 or Thinnet (10 Mbps over coaxial cable,
    linking computers in a chain), 10BASE-T or twisted pair (10 Mbps over twisted
    pair cable, linking computers to central hubs), 10BASE-F (10 Mbps over optical
    fiber links, using hubs), 100BASE-TX (100 Mbps over two twisted pair cables, using
    hubs), 100BASE-T4 (100 Mbps over 4 standard voice-grade twisted pair cables, using
    hubs), 100BASE-FX (100 Mbps over optical fiber links), and Gigabit Ethernet (1
    Gbps over optical fiber or short copper links). The 100BASE varieties are also
    known as Fast Ethernet.


    If your Linux machine will be connected to an Ethernet and you have an Ethernet
    network interface card (NIC) installed in your computer, say yes here and read
    the Ethernet-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).
    You will then also have to say yes to the driver for your particular NIC.


    Note that the answer to this question won''t directly affect the kernel: saying
    no will just cause the configurator to skip all the questions about Ethernet network
    cards.


    ## Name


    NET_RADIO — Wireless LAN drivers (non-hamradio) and Wireless Extensions


    Support for wireless LANs and everything having to do with packet radio, but not
    with amateur radio or FM broadcasting.'
