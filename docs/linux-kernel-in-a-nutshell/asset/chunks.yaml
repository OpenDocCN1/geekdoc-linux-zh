  raw: '2.  Go into the */sys/bus/pci/devices/0000:* *`bus_id`* directory, where *`bus_id`*
    is the PCI bus ID found in the previous step.


    3.  Read the values of the *vendor* and *device* files in the PCI device directory.


    4.  Move back to the kernel source tree and look in *include/linux/pci_ids.h*
    for the PCI vendor and device IDs found in the previous step.


    5.  Search the kernel source tree for references to those values in drivers. Both
    the vendor and device ID should be in a `struct pci_device_id` definition.


    6.  Search the kernel Makefiles for the `CONFIG_` rule that builds this driver
    by using *find* and *grep*:`$` **`find -type f -name Makefile | xargs grep DRIVER_NAME`**


