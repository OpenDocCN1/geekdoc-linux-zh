    \ tightly to his workflow, but the ideas behind them were very powerful. Andreas\
    \ Gruenbacher took those ideas and created the *quilt* tool.\n\nThe basic idea\
    \ behind *quilt* is that you work with a pristine source tree, and add a bunch\
    \ of patches on top of it. You can push and pop different patches off of the source\
    \ tree, and maintain this list of patches in a simple manner.\n\nTo get started,\
    \ create a kernel source tree like always:\n\n`$` **`tar -zxf linux-2.6.19.tar.gz`**\n\
    \n`$` **`ls`**\n\n`linux-2.6.19/`\n\nAnd go into that directory:\n\n`$` **`cd\
    \ linux-2.6.19`**\n\nTo get started, create a directory called *patches* that\
    \ will hold all of our kernel patches:\n\n`$` **`mkdir patches`**\n\nThen tell\
    \ *quilt* to create a new patch called `patch1`:\n\n`$` **`quilt new patch1`**\n\
    \n`Patch patches/patch1 is now on top`\n\n*quilt* needs to be told about all of\
    \ the different files that will be modifed by this new patch. To do this, use\
    \ the *add* command:\n\n`$` **`quilt add Makefile`**\n\n`File Makefile added to\
    \ patch patches/patch1`\n\nEdit the file *Makefile*, modify the `EXTRAVERSION`\
    \ line, and save the change. After you finish, tell *quilt* to refresh the patch:\n\
    \n`$` **`quilt refresh`**\n\n`Refreshed patch patches/patch1`\n\nThe file *patches/patch1*\
    \ will contain a patch with the changes that you have just made:\n\n`$` **`cat\
    \ patches/patch1`**\n\n`Index: linux-2.6.19/Makefile`\n\n`===================================================================`\n\
    \n`--- linux-2.6.19.orig/Makefile`\n\n`+++ linux-2.6.19/Makefile`\n\n`@@ -1,7\
    \ +1,7 @@`\n\n` VERSION = 2`\n\n` PATCHLEVEL = 6`\n\n` SUBLEVEL = 19`\n\n`-EXTRAVERSION\
    \ =`\n\n`+EXTRAVERSION = -dirty`\n\n` NAME=Crazed Snow-Weasel`\n\n` # *DOCUMENTATION*`\n\
    \nYou can continue on, working with this single patch, or create a new one to\
    \ go on top of this patch. As an example, if three different patches had been\
    \ created, *patch1*, *patch2*, and *patch3*, they will be applied one on top of\
    \ one another.\n\nTo see the list of patches that are currently applied:\n\n`$`\
    \ **`quilt series -v`**\n\n`+ patches/patch1`\n\n`+ patches/patch2`\n\n`= patches/patch3`\n\
    \nThis output shows that all three patches are applied, and that the current one\
    \ is *patch3*.\n\nIf a new kernel version is released, and you wish to port your\
    \ changes to the new version, quilt can handle this easily with the following\
    \ steps:\n\n1.  Pop off all of the patches that are currently on the tree:`$`\
    \ **`quilt pop -a`**\n\n    `Removing patch patches/patch3`\n\n    `Restoring\
    \ drivers/usb/Makefile`\n\n    `Removing patch patches/patch2`\n\n    `Restoring\
    \ drivers/Makefile`\n\n    `Removing patch patches/patch1`\n\n    `Restoring Makefile`\n\
    \n    `No patches applied`"
