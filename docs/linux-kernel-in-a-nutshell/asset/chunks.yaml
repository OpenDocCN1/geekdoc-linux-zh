    ## Name


    USB_STORAGE — USB mass storage support


    Say yes here if you want to connect USB mass storage devices to your computer''s
    USB port. This is the driver you need for USB floppy drives, USB hard disks, USB
    tape drives, USB CD-ROMs, USB flash devices, and memory sticks, along with similar
    devices. This driver may also be used for some cameras and card readers.


    This option enables the `SCSI` option, but you probably also need `SCSI device
    support: SCSI disk support` for most USB storage devices to work properly.


    ## Name


    USB_SERIAL — USB serial converter support


    Say yes here if you have a USB device that provides normal serial ports, or acts
    like a serial device, and you want to connect it to your USB bus.


    Please read *Documentation/usb/usb-serial.txt* for more information on the specifics
    of the different devices that are supported, and on how to use them.


    ## Name


    USB_GADGET — Support for USB Gadgets


    USB is a master/slave protocol, organized with one master host (such as a PC)
    controlling up to 127 peripheral devices. The USB hardware is asymmetric, which
    makes it easier to set up: you can''t connect a "to-the-host" connector to a peripheral.


    Linux can run in the host or in the peripheral. In both cases you need a low level
    bus controller driver, and some software that talks to it. Peripheral controllers
    can be either discrete silicon or integrated with the CPU in a microcontroller.
    The more familiar host side controllers have names like such as EHCI, OHCI, or
    UHCI, and are usually integrated into southbridges on PC motherboards.


    Enable this configuration option if you want to run Linux inside a USB peripheral
    device. Configure one hardware driver for your peripheral/device side bus controller,
    and a "gadget driver" for your peripheral protocol. (If you use modular gadget
    drivers, you may configure more than one.)


    If in doubt, say no and don''t enable these drivers; most people don''t have this
    kind of hardware (except maybe inside Linux PDAs).


    For more information, see [http://www.linux-usb.org/gadget](http://www.linux-usb.org/gadget)
    and the kernel DocBook documentation for this API.


    ## Name


    MMC — MMC support


    MMC is the "multi-media card" bus protocol.


    If you want MMC support, you should say yes here and also to the specific driver
    for your MMC interface.


    ## Name


    INFINIBAND — InfiniBand support


    Core support for InfiniBand (IB). Make sure to also select any protocols you wish
    to use as well as drivers for your InfiniBand hardware.


    ## Name


    EDAC — EDAC core system error reporting (experimental)


    EDAC is designed to report errors in the core system. These are low-level errors
    that are reported by the CPU or supporting chipset: memory errors, cache errors,
    PCI errors, thermal throttling, etc.


    If this code is reporting problems on your system, please see the EDAC project
    web pages for more information: [http://bluesmoke.sourceforge.net](http://bluesmoke.sourceforge.net)
    and [http://buttersideup.com/edacwiki](http://buttersideup.com/edacwiki)


    ## Name


    EXT2_FS — Second extended filesystem support


    `ext2` is a standard Linux file system for hard disks. Most systems use the upgrade,
    `ext3`, instead.


    * * *


    ### Note


    Note that the file system of your root partition (the one containing the directory
    */*) cannot be compiled as a module without using a special boot process, so building
    it as a module could be dangerous.


    * * *


    ## Name


    EXT3_FS — Third extended file system support


    This is the journaling version (called `ext3`) of the second extended file system,
    the de facto standard Linux file system for hard disks.


    The journaling code included in this driver means you do not have to run *fsck*
    (file system checker) on your file systems after a crash. The journal keeps track
    of any changes that were being made at the time the system crashed, and can ensure
    that your file system is consistent without the need for a lengthy check.


    Other than adding the journal to the file system, the on-disk format of `ext3`
    is identical to `ext2`. It is possible to freely switch between using the `ext3`
    driver and the `ext2` driver, as long as the file system has been cleanly unmounted,
    or *fsck* is run on the file system before the switch.


    To add a journal on an existing `ext2` file system or change the behavior of `ext3`
    file systems, you can use the *tune2fs* utility. To modify attributes of files
    and directories on `ext3` file systems, use *chattr*. You need `e2fsprogs` version
    1.20 or later in order to create `ext3` journals (available at [http://sourceforge.net/projects/e2fsprogs](http://sourceforge.net/projects/e2fsprogs)).


    ## Name


    REISERFS_FS — ReiserFS support


    This is a journaled filesystem that stores not just filenames but the files themselves
    in a balanced tree. Balanced trees can be more efficient than traditional file
    system architectural foundations.


    In general, ReiserFS is as fast as `ext2`, but is more efficient with large directories
    and small files.


    ## Name


    JFS_FS — JFS filesystem support


    This is a port of IBM''s Journaled Filesystem . More information is available
    in the file *Documentation/filesystems/jfs.txt*.


    ## Name


    XFS_FS — XFS filesystem support


    XFS is a high performance journaling filesystem that originated on the SGI IRIX
    platform. It is completely multi-threaded, can support large files and large filesystems,
    extended attributes, and variable block sizes, is extent based, makes extensive
    use of B-trees, and uses directories, extents, and free space to aid both performance
    and scalability.'
