    ## Name


    memmap — Mark specific memory as ACPI data.


    ## Synopsis


    `memmap=` *`n`*[*`KMG`*]`#` *`start`*[*`KMG`*]


    Marks a specific location and range of memory as ACPI data. *`n`* is the size
    of the memory location and *`start`*is the start location in memory of the range.
