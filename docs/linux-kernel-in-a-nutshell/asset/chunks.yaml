    ## Name


    X86_GENERIC — Generic x86 support


    Instead of just including optimizations for the selected x86 variant (e.g. PII,
    Crusoe or Athlon), include some more generic optimizations as well. This will
    make the kernel perform better on x86 CPUs other than the one selected.


    This is really intended for distributors who need more generic optimizations.


    ## Name


    NR_CPUS — Maximum number of CPUs (2-255)


    This allows you to specify the maximum number of CPUs that this kernel will support.
    The maximum supported value is 255 and the minimum value that makes sense is 2.


    This option is purely to save memory; each supported CPU adds approximately eight
    kilobytes to the kernel image.


    ## Name


    SCHED_SMT — SMT (Hyper-Threading) scheduler support


    SMT scheduler support improves the CPU scheduler''s decision-making on Intel Pentium
    4 chips with Hyper-Threading, at a cost of slightly increased overhead in some
    places.


    ## Name


    PREEMPT_NONE — No forced preemption (server)


    This is the traditional Linux preemption model, geared toward maximizing throughput.
    It still provides good latency most of the time, occasional longer delays are
    possible.


    Select this option if you are building a kernel for a server or scientific/computation
    system, or if you want to maximize the raw processing power of the kernel, irrespective
    of scheduling latencies.


    ## Name


    PREEMPT_VOLUNTARY — Voluntary kernel preemption (desktop)


    This option reduces the latency of the kernel by adding more "explicit preemption
    points" to the kernel code. These new preemption points have been selected to
    reduce the maximum latency of rescheduling, which provides faster response to
    applications at the cost of slighly lower throughput.


    This option speeds up reaction to interactive events by allowing a low-priority
    process to voluntarily preempt itself even if it is in kernel mode executing a
    system call. This allows applications to appear to run more smoothly even when
    the system is under load.


    Select this if you are building a kernel for a desktop system.


    ## Name


    PREEMPT — Preemptible kernel (low-latency desktop)


    This option reduces the latency of the kernel by making all kernel code (except
    code executing in a critical section) preemptible. This allows reaction to interactive
    events by permitting a low priority process to be preempted involuntarily even
    if it is in kernel mode executing a system call and would otherwise not be about
    to reach a natural preemption point. This allows applications to appear to run
    more smoothly even when the system is under load, at the cost of slighly lower
    throughput and a slight runtime overhead to kernel code.


    Select this if you are building a kernel for a desktop or embedded system with
    latency requirements in the milliseconds range.


    ## Name


    PREEMPT_BKL — Preempt the Big Kernel Lock


    This option reduces the latency of the kernel by making the Big Kernel Lock preemptible.


    Say yes here if you are building a kernel for a desktop system.


