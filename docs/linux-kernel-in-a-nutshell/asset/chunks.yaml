    2. Using the official patch from [http://kernel.org](http://kernel.org), move
    the old kernel version forward one release: `$` patch -p1 < ../patch-2.6.20`


    `$` cd ..`


    `$` mv linux-2.6.19 linux-2.6.20`


    3. Now have quilt push all of the patches back on top of the new tree: `$` quilt
    push


    `Applying patch patches/patch1`

    `patching file Makefile`

    `Hunk #1 FAILED at 1.`

    `1 out of 1 hunk FAILED -- rejects in file Makefile`

    `Patch patches/patch1 does not apply (enforce with -f)`


    4. As the first patch doesn''t apply cleanly, force the patch to be applied and
    then fix it up: `$` quilt push -f`


    `Applying patch patches/patch1`

    `patching file Makefile`

    `Hunk #1 FAILED at 1.`

    `1 out of 1 hunk FAILED -- saving rejects to file Makefile.rej`

    `Applied patch patches/patch1 (forced; needs refresh)`

    `$` vim Makefile.rej Makefile`


    5. After the patch is applied by hand, refresh the patch: `$` quilt refresh


    `Refreshed patch patches/patch1`


    6. And continue on pushing the other patches: `$` quilt push


    `Applying patch patches/patch2`

    `patching file drivers/Makefile`

    `Now at patch patches/patch2`

    `$` quilt push`


    `Applying patch patches/patch3`

    `patching file drivers/usb/Makefile`

    `Now at patch patches/patch3`


    `quilt` also has options that will automatically email out all of the patches
    in the series to a group of people or a mailing list, delete specific patches
    in the middle of the series, go up or down the series of patches until a specific
    patch is found, and many more powerful options.


    If you want to do any kind of kernel development, `quilt` is strongly recommended,
    even for tracking a few patches, instead of using the more difficult `diff` and
    `patch` method. It is much simpler and will save you much time and effort.


    On a personal note, I cannot recommend this tool enough, as I use it every day
    to manage hundreds of patches in different development trees. It is also used
    by numerous Linux distributions to maintain their kernel packages, and has an
    involved and responsive development community.


    # git


    `git` is a source code control tool that was originally written by Linus Torvalds
    when the Linux kernel was looking for a new source code control system. It is
    a distributed system, which differs from traditional source code control systems
    such as `cvs` in that it is not required to be connected to a server in order
    to make a commit to the repository.


    `git` is one of the most powerful, flexible, and fast source code control systems
    currently available, and has an active development team working behind it. The
    main web page for `git` can be found at [http://git.or.cz/](http://git.or.cz/).
    It is recommended that any new user of `git` go through the published tutorials
    in order to become familiar with how `git` works, and how to use it properly.


    The Linux kernel is developed using `git`, and the latest `git` kernel tree can
    be found at [http://www.kernel.org/git/](http://www.kernel.org/git/), along with
    a large list of other kernel developer''s `git` repositories.


    It is not necessary to use `git` in order to do Linux kernel development, but
    it is very handy in helping to track down kernel bugs. If you report a bug to
    the Linux kernel developers, they might ask you to use `git bisect` in order to
    find the exact change that caused the bug to happen. If so, follow the directions
    in the `git` documentation for how to use this.


    # ketchup


    `ketchup` is a very handy tool used to update or switch between different versions
    of the Linux kernel source tree. It has the ability to:


    * Find the latest version of the kernel, download it, and uncompress it.

    * Update a currently installed version of the kernel source tree to any other
    version, by patching the tree to the proper version.

    * Handle the different development and stable branches of the kernel tree, including
    the `-mm` and `-stable` trees.

    * Download any patches or tarballs needed to do the update, if they are not present
    on the machine already.

    * Check the GPG signatures of the tarball and patches to verify that it has downloaded
    a correct file.


    `ketchup` can be found at [http://www.selenic.com/ketchup/](http://www.selenic.com/ketchup/)
    and has lots of additional documentation in the wiki at [http://www.selenic.com/ketchup/wiki/](http://www.selenic.com/ketchup/wiki/).
    .


