    ![Initial menuconfig screen](images/00006.png)


    Figure 4-1. Initial menuconfig screen


    The instructions for navigating through the program, and the meanings of the different
    characters, are shown at the top of the screen. The rest of the screen containing
    the different kernel configuration options.


    The kernel configuration is divided up into sections. Each section contains options
    that correspond to a specific topic. Within those sections can be sub-sections
    for various specialized topics. As an example, all kernel device drivers can be
    found under the main menu option `Device Drivers`. To enter that menu, move the
    arrow key down nine times until the line `Device Drivers --->` is highlighted,
    as shown in [Figure 4-2](#index_split_032.html_filepos128352).


    ![Device Drivers option selected](images/00007.png)


    Figure 4-2. Device Drivers option selected


    Then press the `Enter` key. It will move you into the `Device Drivers` submenu
    and show it as illustrated in [Figure 4-3](#index_split_032.html_filepos129062).


    ![Device Drivers submenu](images/00008.png)


    Figure 4-3. Device Drivers submenu


    You can continue to move down through the menu hierarchy the same way. To see
    the `Generic Driver Options` submenu, press `Enter` again, and you will see the
    three options shown in [Figure 4-4](#index_split_032.html_filepos129827).


    ![Generic Driver Options submenu](images/00009.png)


    Figure 4-4. Generic Driver Options submenu


    The first two options have a `[*]` mark by them. That means that this option is
    selected (by virtue of the `*` being in the middle of the `[ ]` characters), and
    that this option is a yes-or-no option. The third option has a `< >` marking,
    showing that this option can be built into the kernel (`Y`), built as a module
    (`M`), or left out altogether (`N`).


    If the option is selected with `Y`, the angle brackets will contian a `*` character.
    If it is selected as a module with a `M`, they will contain an `M` character.
    If it is disabled with `N`, they will show only a blank space.


    So, if we wish to change these three options to select only drivers that do not
    need external firmware at compile time, disable the option to prevent firmware
    from being built, and build the userspace firmware loader as a module, we would
    press `Y` for the first option, `N` for the second option, and `M` for the third,
    making the screen look like [Figure 4-5](#index_split_032.html_filepos131942).


    ![Generic Driver Options submenu changed](images/00010.png)


    Figure 4-5. Generic Driver Options submenu changed


    After you are done with your changes to this screen, press either the `Escape`
    key or the right arrow followed by the `Enter` key to leave this submenu. All
    of the different kernel options can be explored in this manner.


    When you are finished making all of the changes you wish to make to the kernel
    configuration, exit the program by pressing the `Escape` key on the main menu.
    You will be shown the screen in [Figure 4-6](#index_split_032.html_filepos133064),
    asking whether you wish to save your changed kernel configuration.


    ![Saving kernel options](images/00011.png)


    Figure 4-6. Saving kernel options


    Press `Enter` to save the configuration, or if you wish to discard any changes
    made, press the right arrow to move to the `<No>` selection and then press `Enter`.


    ## Graphical configuration methods


    The `gconfig` and `xconfig` methods of configuring a kernel use a graphical program
    to allow you to modify the kernel configuration. The two methods are almost identical,
    the only difference being the different graphical toolkit with which they are
    written. `gconfig` is written using the GTK+ toolkit and has a two-pane screen
    looking like [Figure 4-7](#index_split_033.html_filepos134627).


    ![make gconfig screen](images/00012.png)


    Figure 4-7. make gconfig screen


    The `xconfig` method is written using the QT toolkit and has a three-pane screen
    looking like [Figure 4-8](#index_split_033.html_filepos135302).


    ![make xconfig screen](images/00013.png)


    Figure 4-8. make xconfig screen


    Use the mouse to navigate the submenus and select options. For instance, you can
    use it in [Figure 4-8](#index_split_033.html_filepos135302) to select the `Generic
    Driver Options` submenu of the `Device Drivers` menu. This will change the `xconfig`
    screen to look like [Figure 4-9](#index_split_033.html_filepos136237).


    ![make xconfig Generic Driver Options](images/00014.png)


    Figure 4-9. make xconfig Generic Driver Options


    The corresponding `gconfig` screen is [Figure 4-10](#index_split_033.html_filepos136889).


    ![make gconfig Generic Driver Options](images/00015.png)


    Figure 4-10. make gconfig Driver Options


    Changing this submenu to disable the second option and make the third option built
    as a module causes the screens to look like [Figure 4-11](#index_split_033.html_filepos137678)
    and [Figure 4-12](#index_split_033.html_filepos13813).


    ![make xconfig Driver Options](images/00016.png)


    Figure 4-11. make xconfig Driver Options


    ![make gconfig Driver Options](images/00017.png)


    Figure 4-12. make gconfig Driver Options


    Please note that in the `gconfig` method, a checked box signifies that the option
    is built into the kernel, whereas a line though the box means the option a module.
    In the `xconfig` method, an option built as a module will be shown with a dot.
    Both of these methods will prompt you to save your configuration when exiting,
    and offer the option to write that configuration to a different file.


    ## Building the kernel


    Now that you have created a configuration you wish to use, you need to build the
    kernel. This is as simple as entering a one-word command:


    ```

    make

    ```


    Running `make` will cause the kernel build system to use the configuration you
    have selected to build a kernel and all modules needed to support that configuration.
    While the kernel is building, `make` will display the individual file names of
    what is currently happening, along with any build warnings or errors.


    If the kernel build finished without any errors, you have successfully created
    a kernel image. However, it needs to be installed properly before you try to boot
    from it. See Chapter 5](#index_split_040.html_filepos153143) for how to do this.


    It is very unusual to get any build errors when building a released kernel version.
    If you do, please report them to the Linux kernel developers so they can be fixed.


    * * *


    ^([[5](#index_split_034.html_filepos141394)]) Older kernel versions prior to the
    2.6 release required the additional step of `make modules` to build all needed
    kernel modules. That is no longer required.


    ## Advanced building options

