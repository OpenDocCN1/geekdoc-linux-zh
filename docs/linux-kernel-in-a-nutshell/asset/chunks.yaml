    在选择好 HCD 后，为你将使用的 USB 外设设备选择驱动程序。你可能想查看 `Documentation/usb` 中提供的信息，特别是 `Documentation/usb/usb-help.txt`
    中提供的链接。


    ## USB_EHCI_HCD — EHCI HCD (USB 2.0) 支持


    增强主机控制器接口 (EHCI) 是 USB 2.0 “高速”（480 Mbit/sec, 60 Mbyte/sec）主机控制器硬件的标准。如果你的 USB
    主机控制器支持 USB 2.0，你可能想要配置此主机控制器驱动程序。在本文此时，EHCI 的主要实现来自 NEC 的芯片，广泛用于附加 PCI 卡，但其他厂商（包括
    Intel 和 Philips）也在开发实现。主板支持正在出现。


    EHCI 控制器与“伴侣”主机控制器（`OHCI` 或 `UHCI`）一起封装，用于连接根集线器端口的 USB 1.1 设备。如果设备是高速的，端口将连接到
    EHCI，否则将连接到伴侣控制器。如果你配置了 EHCI，你可能还需要配置 `OHCI`（适用于 NEC 和某些其他厂商）USB 主机控制器驱动程序或 `UHCI`（适用于
    Via 主板）主机控制器驱动程序。


    你可能想阅读 `Documentation/usb/ehci.txt` 获取有关此驱动程序的更多信息。


    ## USB_OHCI_HCD — OHCI HCD 支持


    开放主机控制器接口 (OHCI) 是访问 USB 1.1 主机控制器硬件的标准。它比 Intel 的 `UHCI` 规范功能更多。如果你的 USB 主机控制器遵循
    OHCI ，请选是。在大多数非 x86 系统以及未使用 Intel 或 VIA USB 控制器的 x86 硬件上，这是适当的。如果你的主机控制器不使用 PCI，这可能也是合适的。对于你不确定的
    PCI 系统，`lspci -v` 命令将列出适用于你 USB 控制器的正确 `prog-if`：EHCI、`OHCI` 或 `UHCI`。


    ## USB_UHCI_HCD — UHCI HCD (大多数 Intel 和 VIA) 支持


    通用主机控制器接口是 Intel 创建的一项标准，用于访问 PC 中的 USB 硬件（也称为 USB 主机控制器）。如果你的 USB 主机控制器符合此标准，你可能想要选是。所有带有
    Intel PCI 芯片组的最新主板（如 `intel 430TX`、`440FX`、`440LX`、`440BX`、`i810`、`i820`）都符合此标准。所有
    VIA PCI 芯片组（如 `VIA VP2`、`VP3`、`MVP3`、`Apollo Pro`、`Apollo Pro II` 或 `Apollo Pro
    133`）也使用该标准。


    ## USB_STORAGE — USB 大存储支持


    如果你想将 USB 大存储设备连接到计算机的 USB 端口，在此处选是。你需要 USB 软驱、USB 硬盘、USB 带、USB 光驱、USB 闪存以及类似设备的驱动程序。此驱动程序可能也用于某些相机和读卡器。


    此选项启用 `SCSI` 选项，但为了让大多数 USB 存储设备正常工作，你可能还需要 `SCSI device support: SCSI disk support`。


    ## USB_SERIAL — USB 串口转换器支持


    如果你有一个提供标准串口或像串口设备一样的 USB 设备，并且你想将其连接到 USB 总线，在此处选是。


    请阅读 `Documentation/usb/usb-serial.txt` 了解受支持的不同设备的详细信息以及如何使用它们。


    ## USB_GADGET — USB Gadgets 支持


    USB 是一种主/从协议，由一个主控（如 PC）控制多达 127 个外设设备组成。USB 硬件是非称的，这使得设置变得更容易：你不能将“指向主机”的连接器连接到外设上。


    Linux 可以运行在主机端，也可以运行在外设端。在这两种情况下，你都需要一个底层总线控制器驱动程序以及一些与之通信的软件。外设控制器可以是独立的硅片，也可以集成在微控制
    CPU 中。更熟悉的主机端控制器名称如 `EHCI`、`OHCI` 或 `UHCI`，通常集成在 PC 主板的南桥中。


    如果你想在 USB 外设设备内部运行 Linux，启用此配置选项。为你的外设/设备端总线控制器配置一个硬件驱动程序，并为你的外设协议配置一个“gadget
    驱动”（如果你使用模块化 gadget 驱动，可以配置多个）。


    如果有疑问，请选否不要启用这些驱动程序；大多数人没有这种硬件（可能是在 Linux PDA 内部）。


    更多信息，请参阅 [`www.linux-usb.org/gadget`](http://www.linux-usb.org/gadget) 以及此 API
    的内核 DocBook 文档。


    ## MMC — MMC 支持


    MMC 是“多媒体卡”总线协议。


    如果你想要 MMC 支持，你应该在此处选是，并选择适用于你 MMC 接口的特定驱动程序。


    ## INFINIBAND — InfiniBand 支持


    InfiniBand (IB) 的核心支持。确保也选择了你想要使用的协议以及 InfiniBand 硬件的驱动程序。


    ## EDAC — EDAC 核心系统错误报告（实验性）


    EDAC 设计用于报告核心系统中的错误。这些是由 CPU 或支持芯片组报告的低级错误：内存错误、缓存错误、PCI 错误。


    如果此代码在你的系统上报告了问题，请查看 EDAC 项目网页获取更多信息：[`bluesmoke.sourceforge.net`](http://bluesmoke.sourceforge.net)
    和 [`buttersup.com/edacwiki`](http://buttersup.com/edacwiki)


    ## EXT2_FS — 第二代扩展文件系统支持


    `ext2` 是用于硬盘的标准 Linux 系统。大多数系统现在使用升级版的 `ext3`。


    ### 注意


    请注意，文件系统根分区（包含 `ext2` 的分区）在不使用特殊启动过程的情况下无法编译为模块，因此将其构建为模块可能是危险的。


    ***


    ## EXT3_FS — 第三代扩展系统支持


    这是第二代扩展系统（称为 `ext3`）的日志版本，它是硬盘的事实标准 Linux 系统。


    此驱动程序中包含的日志代码意味着你不需要在崩溃后运行 *fsck*（文件系统检查器）。日志会跟踪系统崩溃时正在进行的任何更改，并可以确保你的文件系统一致性，而无需长时间的检查。


    除了向文件系统添加日志外，`ext3` 的磁盘格式与 `ext2` 相同。只要文件系统已干净卸载或在切换前运行了 *fsck*，就可以在 `ext3` 驱动程序和
    `ext2` 驱动程序之间自由切换。


    要在 `ext2` 文件系统上添加日志或更改 `ext3` 文件系统的行为，可以使用 `tune2fs` 工具。要修改 `ext3` 文件系统的文件和目录属性，请使用
    `chattr`。你需要 1.20 或更高版本的 `e2fsprogs` 来创建 `ext3` 日志（可用 [`sourceforge.net/projects/e2fsprogs`](http://sourceforge.net/projects/e2fsprogs)）。


    ## JFS_FS — JFS 文件系统支持


    这是 IBM 文件系统的移植。更多信息可用文件 `Documentation/filesystems/jfs.txt`。


    ## XFS_FS — XFS 文件系统支持


    XFS 是一种源自 SGI IRIX 平台的高性能日志文件系统。它是完全多线程的，支持大文件和大文件系统、扩展属性以及可变块大小，基于区（extent），大量使用
    B 树，并利用目录、区和空空间来辅助性能和可扩展性。


    '
- fmt: '

    Refer to the documentation at [http://oss.sgi.com/projects/xfs](http://oss.sgi.com/projects/xfs)
    for complete details. This implementation is on-disk compatible with the IRIX
    version of XFS.


    # OCFS2_FS — OCFS2 file system support (experimental)


    OCFS2 is a general-purpose, extent-based, shared-disk cluster file system with
    many similarities to `ext3`. It supports 64 bit inode numbers, and has automatically
    extending metadata groups, which may also make it attractive for non-clustered
    use.


    You''ll want to install the `ocfs2-tools` package in order to at least get the
    `mount.ocfs2` program.


    The project web page is [http://oss.oracle.com/projects/ocfs2](http://oss.oracle.com/projects/ocfs2)
    and the tools web page is [http://oss.oracle.com/projects/ocfs2-tools](http://oss.oracle.com/projects/ocfs2-tools).
    OCFS2 mailing lists can be found at [http://oss.oracle.com/projects/ocfs2/mailman](http://oss.oracle.com/projects/ocfs2/mailman).


    # INOTIFY — inotify file change notification support


    Say yes here to enable inotify support and the associated system calls. inotify
    is a file change notification system and a replacement for `dnotify`. inotify
    fixes numerous shortcomings in `dnotify` and introduces several new features.
    It allows monitoring of both files and directories via a single open `fd` object.
    Other features include multiple file events, one-shot support, and unmount notification.


    For more information, see `Documentation/filesystems/inotify.txt`.


    # QUOTA — Quota support


    If you say yes here, you will be able to set per-user limits for disk usage (also
    called disk quotas). Currently, it works for the `ext2`, `ext3`, and ReiserFS
    file system. `ext3` also supports journalled quotas, for which you don''t need
    to run `quotacheck` after an unclean shutdown. For further details, read the Quota
    mini-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto),
    or the documentation provided with the quota tools. Quota support is probably
    useful only for multi-user systems.


    # AUTFS_FS — Kernel automounter support


    The automounter is a tool that automatically mounts remote file systems on demand.
    This implementation is partially kernel-based to reduce overhead when a system
    is already mounted; this is unlike the BSD automounter (`amd`), which is a pure
    user space daemon.


    To use the automounter, you need the user-space tools from the `autofs` package;
    you can find the location in `Documentation/Changes`. You also want to answer
    yes to the `NFS file system support` option.


    If you want to use the newer version of the automounter with more features, say
    no here and say yes to the `Kernel automounter v4 support` option.


    If you are not a part of a fairly large, distributed network, you probably do
    not need an automounter, and can say no here.


    # FUSE_FS — Filesystem in Userspace support


    With FUSE it is possible to implement a fully functional filesystem in a userspace
    program.


    There''s also companion library named `libfuse`. This library, along with utilities,
    is available from the FUSE homepage: [http://fuse.sourceforge.net](http://fuse.sourceforge.net).


    See `Documentation/filesystems/fuse.txt` for more information. See `Documentation/Changes`
    for library/utility version you need.


    If you want to develop a userspace filesystem, or if you want to use a filesystem
    based on FUSE, answer yes here.


    # SMB_FS — SMB file system support (to mount Windows shares etc.)


    SMB (Server Message Block) is the protocol Windows for Workgroups (WfW), Windows
    95/98, Windows NT and later variants, and OS/2 Lan Manager use to share files
    and printers over local networks. Saying yes here allows you to mount their file
    systems (often called "shares" in this context) and access them just like any
    other Unix directory. Currently, this works only if the Windows machines use TCP/IP
    as the underlying transport protocol, not NetBEUI. For details, read `Documentation/filesystems/smbfs.txt`
    and the SMB-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).


    If you just want your box to act as an SMB server and make files and printing
    services available to Windows clients (which need to have a TCP/IP stack), you
    don''t need to say yes here; you can use the Samba set of daemons and programs
    (available from [ftp://ftp.samba.org/pub/samba](ftp://ftp.samba.org/pub/samba)).


    # CIFS — CIFS support (advanced network filesystem for Samba, Window and other
    CIFS compliant servers)


    This is the client VFS module for the Common Internet File System (CIFS) protocol,
    which is the successor to the Server Message Block (SMB) protocol, the native
    file sharing mechanism for most early PC operating systems. The CIFS protocol
    is fully supported by file servers such as Windows 2000 (including Windows 2003,
    NT 4 and Windows XP) as well by Samba (which provides excellent CIFS server support
    for Linux and many other operating systems). Limited support for Windows ME and
    similar servers is provided as well. You must use the `smbfs` client filesystem
    to access older SMB servers such as OS/2 and DOS.


    The intent of the `cifs` module is to provide an advanced network file system
    client for mounting local filesystems to CIFS compliant servers, including support
    for DFS (hierarchical name space), secure per-user session establishment, safe
    distributed caching (oplock), optional packet signing, Unicode and other internationalization
    improvements, and optional Winbind (nsswitch) integration. You do not need to
    enable `cifs` if you are running only a server (Samba). It is possible to enable
    both `smbfs` and `cifs` (e.g. if you are using CIFS for accessing Windows 2003
    and Samba 3 servers, and `smbfs` for accessing old servers). If you need to mount
    to Samba or Windows from this machine, say yes to this option.


    # PROFILING — Profiling support (experimental)


    Say yes here to enable the extended profiling support mechanisms used by profilers
    such as OProfile.


    # OPROFILE — OProfile system profiling (experimental)


    OProfile is a profiling system capable of profiling the whole system, include
    the kernel, kernel modules, libraries, and applications.


    For more information, and links to the userspace needed to use OProfile properly,
    see the main project page at [http://oprofile.sourceforge.net/news](http://oprofile.sourceforge.net/news).


    # KPROBES — Kprobes (experimental)


    Kprobes allows you to trap the CPU at any kernel address and execute a callback
    function. `register_kprobe()` establishes a probepoint and specifies the callback.
    Kprobes is useful for kernel debugging, non-intrusive instrumentation, and testing.


    # PRINTK_TIME — Show timing information on printks


    Selecting this option causes timing information to be included in `printk` (kernel
    message) output. This allows you to measure the interval between kernel operations,
    including bootup operations. This is useful for identifying long delays in kernel
    startup.


    # MAGIC_SYSRQ — Magic SysRq key


    If you say yes here, you will have some control over the system even if the system
    crashes for example during kernel debugging (e.g., you will be able to flush the
    buffer cache to disk, reboot the system immediately, or dump some status information).
    This is accomplished by pressing various keys while holding down the SysRq (Alt+PrintScreen)
    key. It also works on a serial console (on PC hardware at least), if you send
    a BREAK and then within 5 seconds a command keypress. The keys are documented
    in `Documentation/sysrq.txt`. Don''t say yes unless you really know what this
    hack does.


    # DEBUG_KERNEL — Kernel debugging


    Say yes here if you are developing drivers or trying to debug and identify kernel
    problems.


    On it''s own, this option does not do anything except allow you to chance to select
    other options.


    # DEBUG_FS — Debug filesystem

    '
