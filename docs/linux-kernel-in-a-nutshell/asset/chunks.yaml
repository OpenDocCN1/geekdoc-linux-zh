    # 索引


    ### 关于数字索引


    索引项中的链接显示为该条目所在的章节标题。由于某些章节带有标记，一个条目有多个链接并不罕见。点击任何链接都将直接跳转到文中标记出现的地方。


    # 关于作者


    Greg Kroah-Hartman 从 1996 年开始构建 Linux 内核，并从 1999 年开始编写 Linux 内核驱动。他目前是内核源码树中 USB、PCI、驱动核心和
    sysfs 子系统的维护者，也是 -stable 内核发布团队的一半成员。他创建了 udev 程序并维护着 Linux 热插用户空间项目。他还是 Gentoo
    Linux 开发者，也是《Linux Device Drivers》第三版的合著者以及《Linux Journal》杂志的特约编辑。他还创建并维护了 Linux
    设备驱动工具包。他目前在 SuSE Labs/Novell 工作，从事各种 Linux 内核相关的任务。


