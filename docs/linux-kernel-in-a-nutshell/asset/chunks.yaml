    # 致谢


    首先要感谢我出色的妻子 Shannon 和我可爱的 Madeline 和 Griffin，感谢在我花时间编写这本书期间他们给予的理解与耐心。没有他们的支持和鼓励，这本书永远无法完成。特别感谢
    Shannon，是她最初带我进入了 Linux 内核开发。如果没有她的努力，我可能还在做某些奇怪的嵌入式编程工作，而且永远无法发现这个可以工作的伟大社区。


    我的编辑 Andy Oram 是这本书背后的推动力，他将其塑造为既具有可读性又充满信息量。在截止日期紧随其后之际，他的编辑技巧和耐心对于这本书的创建和完成至关重要。


