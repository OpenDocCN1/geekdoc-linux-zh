    Memory regions that the PnP BIOS subsystem should not use for autoconfiguration.
    Each region is listed by its starting location and size.


    # SELinux options


    These options change some fundamental aspects of SELinux startup.


    ## Name


    checkreqprot — Set the initial checkreqprot flag value.


    ## Synopsis


    `checkreqprot=`[`0`|`1`]


    Set the initial checkreqprot flag value. `0` means that the check protection will
    be applied by the kernel and will include any implied execute protection. `1`
    means that the check protection is requested by the application. The default value
    is set by a kernel configuration option.


    The value can be changed at runtime via the */selinux/checkreqprot* file.


    ## Name


    enforcing — Set the initial enforcing status.


    ## Synopsis


    `enforcing=`[`0`|`1`]


    Specify whether SELinux enforces its rules upon boot. `0` means that SELinux will
    just log policy violations but wil not deny access to anything. `1` means that
    the enforcement will be fully enabled with denials as well as logging. The default
    value is `0`.


    The value can be changed at runtime via the */selinux/enforce* file.


    ## Name


    selinux — Enable or disable SELinux at boot time.


    ## Synopsis


    `selinux=`[`0`|`1`]


    This option allows SELinux to be enabled (`1`) or disabled (`0`) to boot time.
    The default value is set by a kernel configuration option.


    If SELinux is enabled at boot time, the */selinux/disable* file can be used later
    to disable it prior to the initial policy load.


    ## Name


    selinux_compat_net — Set the network control model.


    ## Synopsis


    `selinux_compat_net=`[`0`|`1`]


    Set the initial value for the SELinux network control model. `0` uses the new
    secmark-based packet controls, and `1` uses the legacy packet controls. *`0`*
    is the default and preferred value.


    This value can be changed at runtime via the */selinux/compat_net* file.


    # Network options


    These options control low-level aspects of the networking subsystem.


    ## Name


    netdev — Set various network device parameters.


    ## Synopsis


    `netdev=`[*`irq`*],[*`io`*],[*`mem_start`*],[*`mem_end`*],[*`name`*]


    Specify network device parameters, which are specific to the driver used by the
    network device. Some drivers'' source files document the applicable options. This
    option does not usually apply to PCI, USB, or other plug-and-play network devices.
    It is intented for use only on devices that can not discover their own resource
    assignments.


    ## Name


    rhash_entries — Set the number of route cache hash buckets.


    ## Synopsis


    `dhash_entries=` *`n`*


    This option lets you override the default number of hash buckets for the kernel''s
    route cache. Recommended only for kernel network experts. are doing.


    ## Name


    shapers — Set the maximum number of network shapers.


    ## Synopsis


    `shapers=` *`n`*


    This option lets you set the maximum number of network shapers that the kernel
    can use.


    ## Name


    thash_entries — Set the number of TCP connection hash buckets.


    ## Synopsis


    `thash_entries=` *`n`*


    This option lets you override the default number of hash buckets for the kernel''s
    TCP connection cache.


    # NFS options


    These options control Network File System startup.


    ## Name


    lockd.nlm_grace_period — Assign a grace period to the lock manager.


    ## Synopsis


    `lockd.nlm_grace_period=` *`n`*


    Set the NFS lock manager grace period. *`n`* is measured in seconds.


    ## Name


    lockd.nlm_tcpport — Assign a TCP port to the lock manager.


    ## Synopsis


    `lockd.nlm_tcpport=` *`port`*


    Set the TCP port that the NFS lock manager should use. *`port`* must be a valid
    TCP port value.


    ## Name


    lockd.nlm_timeout — Assign a new timeout value to the lock manager.


    ## Synopsis


    `lockd.nlm_timeout=` *`n`*


    Override the default time value for the NFS lock manager. *`n`* is measured in
    seconds. If this option is not specified the default of 10 seconds will be used.


    ## Name


    lockd.nlm_udpport — Assign a UDP port to the lock manager.


    ## Synopsis


    `lockd.nlm_udpport=` *`port`*


    Set the UDP port that the NFS lock manager should use. *`port`* must be a valid
    UDP port value.


    ## Name


    nfsroot — Specifies the NFS root filesystem.


    ## Synopsis


    `nfsroot=`[*`server-ip`* `:`]*`root-dir`*[,*`nfs-options`*]


    Set the NFS root filesystem for diskless boxes, to enable them to boot properly
    over NFS. If this parameter is not set, the value `/tftpboot/` *`client_ip_address`*
    will be used as the root filesystem with the default NFS options.


    *`server-ip`*


    > IP address of the NFS server to connect to.


    *`root-dir`*


    > Directory on the NFS server to mount as root. If there is a `%s` token in this
    string, it will be replaced with the ASCII representation of the client''s IP
    address.


    *`nfs-options`*


    > The standard NFS options, such as `ro`, separated by commas.'
