  raw: 'As of the 2.6.18 kernel release, the 3.2 version of GCC is the oldest that
    can properly build a working kernel. Be warned that getting the most recent GCC
    version is not always a good idea. Some of the newest GCC releases don''t build
    the kernel properly, so unless you wish to help debug compiler bugs, it is not
    recommended that you try them out.


    To determine which version of `gcc` you have on your system, run the following
    command:


    `$` **`gcc --version`**


    ## Linker


    The C compiler, `gcc`, does not do all of the compiling on its own. It needs an
    additional set of tools known as `binutils` to do the linking and assembling of
    source files. The `binutils` package also contains useful utilities that can manipulate
    object files in lots of useful ways, such as to view the contents of a library.


    `binutils` can usually be found in a distribution package called (not surprisingly)
    `binutils`. If you wish to download and install the package yourself, you can
    find it at [http://www.gnu.org/software/binutils](http://www.gnu.org/software/binutils).


    As of the 2.6.18 kernel release, the 2.12 release of `binutils` is the oldest
    that can successfully link the kernel. To determine which version of `binutils`
    you have on your system, run the following command:


    `$` **`ld -v`**


    ## Make


    `make` is a tool that walks the kernel source tree to determine which files need
    to be compiled, and then calls the compiler and other build tools to do the work
    in building the kernel. The kernel requires the GNU version of `make`, which can
    usually be found in a package called `make` for your distribution.


    If you wish to download and install `make` youself, you can find it at [http://www.gnu.org/software/make](http://www.gnu.org/software/make).


    As of the 2.6.18 kernel release, the 3.79.1 release of `make` is the oldest that
    can properly build the kernel. It is recommended that you install the latest stable
    version of `make`, because newer versions are known to work faster at processing
    the build files.


    To determine which version of `make` you have on your system, run the following
    command:


    `$` **`make --version`**


    # Tools to use the kernel


    While the version of the kernel that is running does not usually affect any user
    application, there are a small number of program for which the kernel version
    is important. This section describes a number of tools that are probably already
    installed on your Linux system. If you upgrade your kernel to a version different
    from the one that came with your distribution, some of these packages may also
    need to be upgraded in order for the system to work properly.


    ## util-linux


    The `util-linux` package is a collection of small utilities that do a wide range
    of different tasks. Most of these utilities handle the mounting and creation of
    disk partitions and manipulation of the hardware clock in the system.


    If you wish to download and install the `util-linux` package yourself, you can
    find it at [http://www.kernel.org/pub/linux/utils/util-linux](http://www.kernel.org/pub/linux/utils/util-linux).


    As of the 2.6.18 kernel release, the 2.10o release of `util-linux` is the oldest
    that works properly . It is recommended that you install the latest version of
    this package, because new version support new features added to the kernel. Bind
    mounts are one example of an option in newer kernels, and a newer version of `util-linux`
    is needed in order to have them work properly.


    To determine which version of the `util-linux` package you have on your system,
    run the following command:


    `$` **`fdformat --version`**


    ## `module-init-tools`


    The `module-init-tools` package is needed if you wish to use Linux kernel modules.
    A kernel module is a loadable chunk of code that can be added to or removed from
    the kernel while the kernel is running. It is useful to compile device drivers
    as modules and then load only the ones that correspond to the hardware present
    in the system. All Linux distributions use modules in order to load only the needed
    drivers and options for the system based on the hardware present, instead of being
    forced to build all possible drivers and options in the kernel in one large chunk.
    By using modules, memory is saved by loading just the code that is needed to control
    the machine properly.


    The kernel module loading process underwent a radical change in the 2.6 kernel
    release. The linker for the module (the code that resolves all symbols and figures
    out how to put the pieces together in memory) is now built into the kernel, which
    makes the userspace tools quite small. Older distributions have a package called
    `modutils` that does not work properly with the 2.6 kernel. The `module-init-tools`
    package is what you need to get the 2.6 kernel to work properly with modules.


    If you wish to download and install the `module-init-tools` package yourself,
    you can find it at [http://www.kernel.org/pub/linux/utils/kernel/module-init-tools](http://www.kernel.org/pub/linux/utils/kernel/module-init-tools).


    As of the 2.6.18 kernel release, the 0.9.10 release of `module-init-tools` is
    the oldest version that works properly . It is recommended that the latest version
    of this package be installed, as new features added to the kernel can be used
    by newer versions of this package. Blacklisting modules to prevent them from being
    automatically loaded by the `udev` package is one such option that is present
    in newer versions of `module-init-tools`, but not older ones.


    To determine which version of the `module-init-tools` package you have on your
    system, run the following command:


    `$` **`depmod -V`**


    ## Filesystem-specific tools


    A wide range of tools specific to particular filesystems are necessary to create,
    format, configure, and fix disk partitions. The `util-linux` package has a few
    of these utilities, but some of the more popular filesystems have separate packages
    that contain the necessary programs.


    ### ext2/ext3/ext4


    The `ext3` and experimental `ext4` filesystems are upgrades of `ext2` and can
    be managed with the same tools; any recent version of an `ext2`-based tool can
    work with the other two filesystems as well.


    To work with any of these filesystems, you must have the `e2fsprogs` package.
    If you wish to download and install this package yourself, you can find it at
    [http://e2fsprogs.sourceforge.net](http://e2fsprogs.sourceforge.net).


    As of the 2.6.18 kernel release, the 1.29 release of `e2fsprogs` is the oldest
    that works properly with the kernel. It is highly recommended that you use the
    newest version in order to take advantage of newer features in the `ext3` and
    `ext4` filesystems.


    To determine which version of `e2fsprogs` you have on your system, run the following
    command:


    `$` **`tune2fs`**


    ### JFS


    To use the JFS filesystem from IBM, you must have the `jfsutils` pacakge. If you
    wish to download and install this package yourself, you can find it at [http://jfs.sourceforge.net](http://jfs.sourceforge.net).


    As of the 2.6.18 kernel release, the 1.1.3 release of `jfsutils` is the oldest
    that works properly with the kernel. To determine which version of `jfsutils`
    you have on your system, run the following command:


    `$` **`fsck.jfs -V`**


    ### ReiserFS


    To use the ReiserFS filesystem, you must have the `reiserfsprogs` package. If
    you wish to download and install this package yourself, you can find it at [http://www.namesys.com/download.html](http://www.namesys.com/download.html).


    As of the 2.6.18 kernel release, the 3.6.3 release of `reiserfsprogs` is the oldest
    that works properly with the kernel. To determine which version of `reiserfsprogs`
    you have on your system, run the following command:


    `$` **`reiserfsck -V`**


    ### XFS


    To use the XFS filesystem from SGI, you must have the `xfsprogs` package. If you
    wish to download and install this package yourself, you can find it at [http://oss.sgi.com/projects/xfs](http://oss.sgi.com/projects/xfs).'
