                                             [*] Netfilter Xtables support (required
    for ip_tables)

    ```


    您想要过滤的不同协议也应该被选择：


    ```

    Networking

        [*] Networking support

                                Networking options

                                    [*] Network packet filtering (replaces ipchains)

