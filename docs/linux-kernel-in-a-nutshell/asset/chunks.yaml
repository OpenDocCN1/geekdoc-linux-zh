    \ saved [51707742/51707742]\n```\n\nTo download it using `curl`:\n\n```\n$ curl\
    \ http://www.kernel.org/pub/linux/kernel/v2.6/linux-2.6.17.8.tar.gz -o linux-2.6.17.8.tar.gz\n\
    ```\n\n```\n  % Total    % Received % Xferd  Average Speed   Time     Time   \
    \  Current\n                                  Dload  Upload  Total   Spent   \
    \ Left  Speed\n100 49.3M  100 49.3M     0         0   50298      0  0:17:08  0:17:08\
    \ --:--:--  100k\n```\n\nFor a quick and easy way to determine the latest kernel\
    \ versions, use the information available at [http://www.kernel.org/kdist/finger_banner](http://www.kernel.org/kdist/finger_banner),\
    \ illustrated by [Figure 3-4](#index_split_025.html_filepos116030).\n\n![Latest\
    \ kernel version](images/00005.png)\n\nFigure 3-4. Latest kernel version\n\n#\
    \ What to do with the source\n\nNow that you have downloaded the proper kernel\
    \ source, where is it supposed to go? We suggest creating a local directory in\
    \ your home directory called `linux/` to hold all of the source.\n\nFirst, create\
    \ the directory:\n```bash\nmkdir ~/linux\n```\n\nThen, move the source into that\
    \ directory:\n```bash\ncd ~/linux\n```\n\nNow decompress the source:\n```bash\n\
    tar -xzvf linux-2.6.17.8.tar.gz\n```\n\nOnce the source is extracted, list the\
    \ files:\n```bash\nls\n```\n\n# Configuring and Building\n\nThe kernel contains\
    \ almost two thousand configuration options, so being asked for every individual\
    \ one will take a long time. Luckily, there is an easier way to configure a kernel:\
    \ base the configuration on a pre-built configuration.\n\n## Creating a configuration\n\
    \nThe kernel configuration is kept in a file called `.config`. The kernel configuration\
    \ program will step through every configuration option and ask you if you wish\
    \ to enable this option or not. Typically, your choices for each option are shown\
    \ in the format `[Y/m/n]`. The capitalized letter is the default, and can be selected\
    \ by just pressing the Enter key. The choices are:\n\n- `y`: Build directly into\
    \ the kernel.\n- `n`: Leave entirely out of the kernel.\n- `m`: Build as module,\
    \ to be loaded if needed.\n- `?`: Print a brief descriptive message and repeat\
    \ the prompt.\n\n## Default configuration\n\nEvery kernel version comes with a\
    \ \"default\" kernel configuration. This configuration is loosely based on the\
    \ defaults that the kernel maintainer of that architecture feels are the best\
    \ options to be used. In some cases, it is merely the configuration that is used\
    \ by the kernel maintainer for his personal machines. This is true for the i386\
    \ architecture, where the default kernel configuration matches closely what Linus\
    \ Torvalds uses for his main development machine.\n\nTo create this default configuration,\
    \ do the following:\n\n```\ncd linux-2.6.17.10\nmake defconfig\n```\n\n# Modifying\
    \ the configuration\n\nNow that we have a basic configuration file created, it\
    \ should be modified to support the hardware you have present in the system. For\
    \ details on how to find out which configuration options you need to select to\
    \ achieve this, please see Chapter 7. Here we will show you how to select the\
    \ options you wish to change.\n\nThere are three different interactive kernel\
    \ configuration tools: a terminal-based one called `menuconfig`, a GTK+-based\
    \ graphical one called `gconfig`, and a QT-based graphical one called `xconfig`.\n\
    \n## Console configuration method\n\nThe `menuconfig` way of configuring a kernel\
    \ is a console-based program that offers a way to move around the kernel configuration\
    \ using the arrow keys on the keyboard. To start up this configuration mode, enter:\n\
    \n```bash\nmake menuconfig\n```\n"
