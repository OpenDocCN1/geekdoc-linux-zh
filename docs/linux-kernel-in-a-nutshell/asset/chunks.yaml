    有很多非常优秀的 Linux 内核编程书籍，但只有少数书籍是关于内核构建和安装的。以下是作者在处理 Linux 内核时认为非常有用的书籍列表。


    ## Linux 通用书籍


    Ellen Siever, Aaron Weber, Stephen Figgins, Robert Love, Arnold Robbins. *Linux
    in a Nutshell, Fifth Edition*. O''Reilly & Associates, 2005


    > 这本书可能拥有最完整、最权威的 Linux 命令参考。它涵盖了你以后可能需要用到的每一个不同命令。


    Yaghmour, Karim. *Building Embedded Systems*. O''Reilly & Associates, 2003.


    > 这本书主要面向嵌入式 Linux 开发者，但它关于如何构建交叉编译器工具链和内核的章节非常出色。对于这部分内容我强烈推荐，此外，书中其他对于想要学习更多如何定制
    Linux 内核及系统的部分也非常有价值。


    ## Linux 内核书籍


    这些书籍大部分面向倾向于学习如何在内核中编程的程序员。它们在技术性上比本书要深，但如果你想学习更多关于控制内核的代码，它们是一个极佳的起点。


    Jonathan Corbet, Alessandro Rubini, and Greg Kroah-Hartman. *Linux Device Drivers,
    Third Edition*. O''Reilly & Associates, 2005.


    > 这本书涵盖了不同的内核设备驱动子系统是如何运作的，并提供了大量运行中的驱动示例。它推荐给任何从事 Linux 内核驱动工作的人。你也可以在网上上免费阅读：[`lwn.net/Kernel/LDD3/`](http://lwn.net/Kernel/LDD3/)。


    Love, Robert. *Linux Kernel Development, Second Edition*. Novell Press Publishing,
    2005.


    > Robert Love 的书涵盖了 Linux 内核几乎的所有领域，展示了所有部分是如何协同工作的。它是学习内核内部不同部分的极佳起点。


    Bovet, Daniel P. and Cesate, Marco. *Understanding the Linux Kernel, Third Edition*.
    O''Reilly & Associates, 2005.


    > 这本书深入探讨了核心 Linux 内核的设计和实现。它是理解内核不同部分所用算法的极佳参考。对于任何想要理解内核工作细节的人来说，这本书都是强烈推荐。


    ## 工具位置


