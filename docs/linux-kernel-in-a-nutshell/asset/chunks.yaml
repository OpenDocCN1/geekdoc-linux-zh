    # Interrupt options


    Interrupts are a complex aspect of kernel behavior. The boot-time options deal
    mostly with the interface between the kernel and the hardware that handles interrupts,
    such as the Intel chip''s Advanced Programmable Interrupt Controller (APIC).


    ## Name


    apic — Change the verbosity of the APIC subsystem when booting.


    ## Synopsis


    `apic=`[*`quiet`*(default)|*`verbose`*|*`debug`*]


    Control how much information the APIC subsystem generates when booting the kernel.


    ## Name


    noapic — Do not use any IOAPICs.


    Prevent the kernel from using any of the IOAPICs that might be present in the
    system.


    ## Name


    lapic — Enable the local APIC.


    Cause the kernel to enable the local APIC even if the BIOS had disabled it.


    ## Name


    nolapic — Do not use the local APIC.


    Tell the kernel not to use the local APIC.


    ## Name


    noirqbalance — Disable kernel IRQ balancing.


    Disable all of the built-in kernel IRQ balancing logic.


    ## Name


    irqfixup — Basic fix to interrupt problems.


    When an interrupt is not handled, search all known interrupt handlers for it.
    This is intended to get systems with badly broken firmware running.


    ## Name


    irqpoll — Extended fix to interrupt problems.


    When an interrupt is not handled, search all known interrupt handlers for it and
    also check all handlers on each timer interrupt. This is intended to get systems
    with badly broken firmware running.


    ## Name


    noirqdebug — Disable unhandled interrupt detection.


    By default, the kernel attempts to detect and disable unhandled interrupt sources
    because they can cause problems with the responsiveness of the rest of the kernel
    if left unchecked. This option will disable this logic.


    # Memory options


    The kernel handles memory in many different chunks and categories for different
    purposes. These options allow you to tweak the sizes and settings.


    ## Name


    highmem — Specify the size of the highmem memory zone.


    ## Synopsis


    `highmem=` *`n`*


    Force the highmem memory zone to have an exact size of *`n`* bytes. This will
    work even on boxes that have no highmem zones by default. It can also reduce the
    size of the highmem zone for machines with a lot of memory.


    ## Name


    hugepages — Set the number of hugetlb pages.


    ## Synopsis


    `hugepages=` *`n`*


    The hugetlb feature lets you configure Linux to use 4MB pages, one thousand times
    the default size. If Linux is configured this way, this options sets the maximum
    number of hugetlb pages to be *`n`*.


    ## Name


    ihash_entries — Set the number of inode hash buckets.


    ## Synopsis


    `ihash_entries=` *`n`*


    Override the default number of hash buckets for the kernel''s inode cache. Recommended
    only for kernel experts.


    ## Name


    max_addr — Ignore memory.


    ## Synopsis


    `max_addr=` *`n`*'
