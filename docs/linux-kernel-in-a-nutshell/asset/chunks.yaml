    from other vendors, including Intel and Philips. Motherboard support is emerging.


    EHCI controllers are packaged with "companion" host controllers (OHCI or UHCI)
    to handle USB 1.1 devices connected to root hub ports. Ports will connect to EHCI
    if the device is high speed, otherwise they connect to a companion controller.
    If you configure EHCI, you should probably configure the OHCI (for NEC and some
    other vendors) USB Host Controller Driver or UHCI (for Via motherboards) Host
    Controller Driver too.


    You may want to read *Documentation/usb/ehci.txt* for more information on this
