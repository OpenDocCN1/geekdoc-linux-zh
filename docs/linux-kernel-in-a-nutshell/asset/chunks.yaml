    # Acknowledgments


    Thanks first go to my wonderful wife Shannon and my beautiful children Madeline
    and Griffin for their understanding and patience while I took the time to work
    on this book. Without their support and prodding, this book would have never been
    completed. Special thanks to Shannon for getting me into Linux kernel development
