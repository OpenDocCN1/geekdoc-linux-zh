    giving me the chance to work on this project and believing that I could complete
    it, despite the first version weighing in at over 1000 pages.


    The technical reviewers for this book were amazing, catching all of the numerous
    mistakes and pointing out ommisions that needed to be filled. The reviewers were
    (in alphabetic order by first name), Christian Benvenuti, Christian Morgner, Golden
    G. Richard III, Jean Delvare, Jerry Cooperstein, Michael Boerner, Rik van Riel,
    and Robert Day. Any remaining problems are due to me, and not their excellent
    skills.


    A special thanks to Randy Dunlap for going over the kernel boot parameters with
    a fine tooth comb and pointing out issues in that chapter. Also to Kay Sievers,
    who helped immensely with all of the chapter on customizing the kernel, and who
    provided the script at the end of that same chapter. Without his `sysfs` help
    and knowledge, that chapter would not have been feasible.


    And a final special thanks to my 6th grade English teacher, Ms. Gruber, for teaching
    me that writing was something that was possible to do, and showing me the enjoyment
    in doing it. Without that start, none of this would have been attainable.


    # Chapter 1. Introduction


    Despite its large code base (over 7 million lines of code), the Linux kernel is
    the most flexible operating system that has ever been created. It can be tuned
    for a wide range of different systems, running on everything from a radio-controlled
    model helicoptor, to a cellphone, to the majority of the largest supercomputers
    in the world. By customizing the kernel for your specific environment, it is possible
    to create something that is both smaller and faster than the kernel provided by
    most Linux distributions. This book will go into how to build and install a custom
    kernel, and provide some hints on how to enable specific options that you will
    probably wish to use for different situations.


    No Linux distribution provides the exact kernel most of its users want. Modern
    distributions have gotten very accommodating, compiling in support for every known
    device, for sound, and even for power conservation. But you will likely have a
    need that''s different from the majority of users (and every distribution has
    to try to meet the needs of the majority). You may just have different hardware.
    And when a new kernel comes out, you may want to start using it without waiting
    for a distribution to be built around it.


    For a host of reasons, you will want during your Linux career to sometimes build
    a kernel, or to tweak the parameters of one you are running. This book gives you
    the information you need to understand the kernel from a user''s point of view,
    and to make the most common changes.


    There are also good reasons to take features out of the kernel, particularly if
    you are running it on an embedded system or one with a small form factor.


    When tweaking, it''s helpful to understand the internals of kernel behavior. These
    are beyond the scope of this book, except for brief summaries that appear with
    certain options. The bibliography includes references to other books and material
    that can give you more background.


    # Using this book


    ***


    ### Warning


    Do not configure or build your kernel with superuser permissions enabled!


    ***


    The previous warning is the most important thing to remember while working through
    the steps in this book. Everything in this book, from downloading the kernel source
    code, uncompressing it, configuring the kernel, and building it should be done
    as a normal user on the machine. Only the two or three commands it takes to install
    a new kernel should be done as the superuser (`root`).


    There have been bugs in the kernel build process in the past, causing some special
    files in the `/dev` directory to be deleted if the user had superuser permissions
    while building the Linux kernel. There are also issues that can easily arise when
    uncompressing the Linux kernel with superuser rights, as some of the files in
    the kernel source package will not end up with the proper permissions and will
    cause build errors later.


    The kernel source code should also never be placed in the `/usr/src/linux/` directory,
    as that is the location of the kernel that the system libraries were built against,
    not your new custom kernel. Do not do any kernel development under the `/usr/src/`
    directory tree at all, but only in a local user directory where nothing bad can
    happen to the system.


    ***


    # Chapter 2. Requirements for building and using the kernel


    This chapter describes the programs you need to configure a kernel, build it,
    and successfully boot it. It''s a smart idea to consult the file `Documentation/Changes`
    to verify the specific version number you should have of each tool described in
    this chapter. This chapter was based on the 2.6.18 kernel, and describes the versions
    of tools that work with that kernel. If you are using a different kernel, please
    verify that you have the required versions as specified in this file, or things
    might not work properly and it can be very hard to determine what went wrong.


    # Tools to build the kernel


    Most Linux distributions offer an installation option to install a range of `Kernel
    Hacking` packages. If your distribution offers this option, it is easiest to install
    this instead of trying to track down all of the individual programs that are needed
    for this task.


    Only three packages that are needed in order to successfully build a kernel: a
    compiler, a linker, and a make utility. This section describes the contents of
    each package.


    ## Compiler


    The Linux kernel is written in the C programming language, with a small amount
    of assembly language in some places. To build the kernel, the GCC C compiler must
    be used. Most Linux distributions have a package entiled `gcc` that should be
    installed. If you wish to download the compiler and build it yourself, you can
    find it at [http://gcc.gnu.org](http://gcc.gnu.org).

