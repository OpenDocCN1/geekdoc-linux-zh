    ## Bluetooth


    Bluetooth is a wireless technology that was created to replace IrDA to talk between
    devices over a very short distance. It is a short-range wireless technology that
    was designed as a replacement for cables and operates within a 10 meter radius
    and is commonly used in mobile phones.


    Bluetooth is a network protocol, so it can be found under the networking main
    menu:


    `Networking`


    `    [*] Networking support`


    `    [*]   Bluetooth subsystem support`'
