    \ 0xa006), .driver_info = DEVICE_ZD1211 },\n    { USB_DEVICE(0x6891, 0xa727),\
    \ .driver_info = DEVICE_ZD1211 },\n    { USB_DEVICE(0x0df6, 0x9071), .driver_info\
