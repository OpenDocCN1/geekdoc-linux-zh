    If you want I2C support, in addition to saying yes here, you must also select
    the specific drivers for your bus adapters.


    ## Name


    SPI — SPI support


    The Serial Peripheral Interface (SPI) is a low level synchronous protocol. Chips
    that support SPI can have data transfer rates up to several tens of Mbps. Chips
    are addressed with a controller and a chipselect. Most SPI slaves don''t support
    dynamic device discovery; some are even write-only or read-only.


    SPI is widely used by microcontrollers to talk with sensors, EEPROM and flash
    memory, codecs and various other controller chips, analog-to-digital and digital-to-analog
    converters, and more. MMC and SD cards can be accessed using SPI protocol; and
    for DataFlash cards used in MMC sockets, SPI must always be used.


    SPI is one of a family of similar protocols using a four-wire interface (select,
    clock, data in, and data out), including Microwire (half duplex), SSP, SSI, and
    PSP. This driver framework should work with most such devices and controllers.


    ## Name


    HWMON — Hardware monitoring support


    Hardware monitoring devices let you monitor the hardware health of a system. Most
    modern motherboards include such a device. It can include temperature sensors,
    voltage sensors, fan speed sensors, and various additional features such as the
    ability to control the speed of the fans. If you want this support you should
    say yes here and also to the specific driver for your sensor chip.


    ## Name


    VIDEO_DEV — Video For Linux


    This option enables support for audio/video capture and overlay devices and FM
    radio cards. The exact capabilities of each device vary.


    The kernel includes support for the new Video for Linux Two API, (V4L2) as well
    as the original system. Drivers and applications need to be rewritten to use V4L2,
    but drivers for popular cards and applications for most video capture functions
    already exist.


    Additional info and docs are available at [http://linuxtv.org](http://linuxtv.org).
    Documentation for V4L2 is also available at [http://bytesex.org/v4l](http://bytesex.org/v4l).


    ## Name


    DVB — DVB For Linux


    This option enables support for Digital Video Broadcasting hardware. Enable this
    if you own a DVB adapter and want to use it or if you are compiling Linux for
    a digital set-top box.


    API specs and user tools are available from [http://www.linuxtv.org](http://www.linuxtv.org).


    ## Name


    FB — Support for frame buffer devices


    The frame buffer device provides an abstraction for the graphics hardware. It
    represents the frame buffer of some video hardware and allows application software
    to access the graphics hardware through a well-defined interface, so the software
    doesn''t need to know anything about the low-level (hardware register) stuff.


    Frame buffer devices work identically across the different architectures supported
    by Linux and make the implementation of application programs easier and more portable;
    at this point, an X server exists which uses the frame buffer device exclusively.
    On several non-X86 architectures, the frame buffer device is the only way to use
    the graphics hardware.


    You need a program called *fbset* to make full use of frame buffer devices. Please
    read *Documentation/fb/framebuffer.txt* and the Framebuffer-HOWTO at [http://www.tldp.org/HOWTO/Framebuffer-HOWTO.html](http://www.tldp.org/HOWTO/Framebuffer-HOWTO.html)
    for more information.


    Say yes here and to the driver for your graphics board if you are compiling a
    kernel for a non-x86 architecture. If you are compiling for the x86 architecture,
    you can say yes if you want to use the frame buffer, but it is not essential.


    Please note that running graphical applications that directly touch the hardware
    (e.g. an accelerated X server) and that are not attuned to the frame buffer device
    may cause unexpected results.


    ## Name


    VGA_CONSOLE — VGA text console


    Saying yes here will allow you to use Linux in text mode through a display that
    complies with the generic VGA standard. Virtually everyone wants that.


    The program SVGATextMode can be used to utilize SVGA video cards to their full
    potential in text mode. Download it from [ftp://ibiblio.org/pub/Linux/utils/console](ftp://ibiblio.org/pub/Linux/utils/console).


    ## Name


    LOGO — Bootup logo


    This option enables the pretty penguin logo at boot time. It will show up on the
    frame buffer while the kernel is booting. The number of penguins shows the number
    of processors that the kernel has found.


    ## Name


    SOUND — Sound card support


    If you have a sound card in your computer, i.e. if it can say more than an isolated
    beep, say yes. Be sure to have all the information about your sound card and its
    configuration down (I/O port, interrupt and DMA channel), because you will be
    asked for it.


    Read the Sound-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).
    General information about the modular sound system is contained in the file *Documentation/sound/oss/Introduction*.
    The file *Documentation/sound/oss/README.OSS* contains some slightly outdated
    but still useful information as well. Newer sound driver documentation can be
    found in files in the *Documentation/sound/alsa* directory.


    If you have a PnP sound card and you want to configure it at boot time using the
    ISA PnP tools (read [http://www.roestock.demon.co.uk/isapnptools](http://www.roestock.demon.co.uk/isapnptools)),
    you need to compile sound card support as a module and load that module after
    the PnP configuration is finished. To do this properly, read *Documentation/sound/oss/README.modules*


    I''m told that even without a sound card, you can make your computer say more
    than an occasional beep by programming the PC speaker. Kernel patches and supporting
    utilities to do that are in the `pcsp` package, available at [ftp://ftp.infradead.org/pub/pcsp](ftp://ftp.infradead.org/pub/pcsp).


    ## Name


    SND — Advanced Linux sound architecture


    Say yes to enable ALSA (Advanced Linux Sound Architecture), the standard Linux
    sound system.


    For more information, see [http://www.alsa-project.org](http://www.alsa-project.org).


    ## Name


    SND_USB_AUDIO — USB Audio/MIDI driver


    Say yes here to include support for USB audio and USB MIDI devices.


    ## Name


    USB — Support for Host-side USB


    Universal Serial Bus (USB) is a specification for a serial bus subsystem that
    offers higher speeds and more features than the traditional PC serial port. The
    bus supplies power to peripherals and allows for hot swapping. Up to 127 USB peripherals
    can be connected to a single USB host in a tree structure.


    The USB host is the root of the tree, the peripherals are the leaves, and the
    inner nodes are special USB devices called hubs. Most PCs now have USB host ports,
    used to connect peripherals such as scanners, keyboards, mice, modems, cameras,
    disks, flash memory, network links, and printers to the PC.


    Say yes here if your computer has a host-side USB port and you want to use USB
    devices. You then need to say yes to at least one of the Host Controller Driver
    (HCD) options that follow. Choose a USB 1.1 controller, such as `UHCI HCD support`
    or `OHCI HCD support`, and `EHCI HCD (USB 2.0) support` except for older systems
    that do not have USB 2.0 support. It does not hurt to select them all if you are
    not certain.


    If your system has a device-side USB port, used in the peripheral side of the
    USB protocol, see the `USB Gadget` option instead.'
