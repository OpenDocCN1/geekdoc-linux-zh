  trans: "\n*   构建系统会将静态内核部分安装到 `/boot` 目录，并根据所构建内核的版本为该可执行文件命名。\n*   任何所需的初始化内存盘（ramdisk）镜像将自动创建，并使用在\
    \ `modules_install` 阶段刚刚安装的模块。\n*   引导加载程序将会被正确通知新内核的存在，并且它会被添加到相应的菜单中，以便用户在下次机器启动时可以选择它。\n\
    \n完成这些操作后，内核已成功安装，你可以安全地重启并尝试你的新内核镜像。请注意，此安装不会覆盖任何旧的内核镜像，因此如果你的新内核镜像出现问题，可以在启动时选择旧的内核。\n\
    \n此规则的显著例外是 Gentoo 和其他“从零开始”类型的发行版，这些发行版要求用户知道如何自行安装内核。这类发行版包含有关如何安装新内核的文档，请查阅该文档以获取所需的精确方法。\n\
    \n# 手动安装\n\n如果你的发行版没有 `installkernel` 命令，或者你希望通过手动操作来理解涉及的步骤，以下是具体步骤。\n\n1.  必须安装模块：`#\
    \ make modules_install`\n2.  必须将静态内核镜像复制到 `/boot` 目录。对于基于 `i386` 的内核，执行以下操作：`#\
    \ make kernelversion`\n\n    ```\n    2.6.17.11\n    ```\n\n    注意，内核版本可能与你的内核不同。请使用此值替换后续所有步骤中的文本\
    \ `KERNEL_VERSION`：`# cp arch/i386/boot/bzImage /boot/bzImage-KERNEL_VERSION`\n\
    \n    ```\n    # cp System.map /boot/System.map-KERNEL_VERSION\n    ```\n3.  修改引导加载程序使其识别新内核。这涉及涉及编辑你正在使用的引导加载程序的配置文件，稍后的\
    \ [为新内核修改引导加载程序] 部分将介绍 GRUB 和 LILO 引导加载器的相关内容。\n\n如果启动过程没有正常运行，通常是因为需要一个初始化内存盘镜像。要正确创建它，请使用本章开头关于自动安装内核的步骤，因为发行版的安装脚本知道如何使用所需的脚本和工具正确创建内存盘。由于每个发行版的处理方式不同，涵盖构建内存盘镜像的所有不同方法超出了本书的范围。\n\
    \n这里有一个实用的脚本，可以自动安装内核，而无需一直输入之前的命令：\n\n```sh\n#!/bin/sh\n#\n# 安装内核\n#\nmake modules_install\n\
    # 确定这是哪个内核版本\nfor TAG in VERSION PATCHLEVEL SUBLEVEL EXTRAVERSION ; do\n    eval\
    \ `sed -ne \"/^$TAG/s/ //gp\" Makefile`\ndone\nSRC_RELEASE=$VERSION.$PATCHLEVEL.$SUBLEVEL$EXTRAVERSION\n\
    # 确定架构\nARCH=`grep \"CONFIG_ARCH \" include/linux/autoconf.h | cut -f 2 -d \"\\\
    \"\"`\n# 复制内核镜像\ncp arch/$ARCH/boot/bzImage /boot/bzImage-\"$SRC_RELEASE\"\n#\
    \ 复制 System.map 文件\ncp System.map /boot/System.map-\"$SRC_RELEASE\"\necho \"Installed\
    \ $SRC_RELEASE for $ARCH\"\n```\n\n# 为新内核修改引导加载程序\n\n有两种常见的 Linux 内引导加载程序：GRUB\
    \ 和 LILO。GRUB 是现代发行版中常用的，某些功能操作比 LILO 容易一些，但 LILO 仍然常见。我们将在本节中涵盖两者。\n\n要确定你的系统使用哪种引导加载程序，请查看\
    \ `/boot/` 目录。如果存在 `grub` 子目录：\n\n```bash\nls -F /boot | grep grub\ngrub/\n```\n\
    \n那么你正在使用 GRUB 程序进行引导。如果不存在此目录，请查找 `/etc/lilo.conf` 文件：\n\n```bash\nls /etc/lilo.conf\n\
    /etc/lilo.conf\n```\n\n如果存在该文件，则你正在使用 LILO 程序进行引导。\n\n向这些程序之一添加新内核的步骤各不相同，请仅遵循对应你所用程序的章节。\n\
    \n## GRUB\n\n要让 GRUB 知道新内核的存在，你只需要修改 `/boot/grub/menu.lst` 文件。有关该文件结构以及所有不同可用选项的完整细节，请参考\
    \ GRUB info 页面：\n\n```bash\ninfo grub\n```\n\n向 `/boot/grub/menu.lst` 文件添加新内核条目的最简单方法是复制现有条目。例如，考虑来自\
    \ Gentoo 系统的 `menu.lst` 文件：\n\n```text\ntimeout 300\ndefault 0\nsplashimage=(hd0,0)/grub/splash.xpm.gz\n\
    title 2.6.16.11\n    root (hd0,0)\n    kernel /bzImage-2.6.16.11 root=/dev/sda2\
    \ vga=0x305\ntitle 2.6.16\n    root (hd0,0)\n    kernel /bzImage-2.6.16 root=/dev/sda2\
    \ vga=0x305\n```\n\n以单词 `title` 开头的行定义了一个新内核条目，因此该文件包含两个条目。只需将从一个 `title` 单词实例的行复制到下一个，如下：\n\
    \n```text\ntitle 2.6.16\n    root (hd0,0)\n    kernel /bzImage-2.6.16 root=/dev/sda2\
    \ vga=0x305\n```\n\n复制到文件末尾，并编辑版本号以包含你刚刚安装的新内核的版本号。标题内容并不重要，只要它是唯一的，但它会显示在启动菜单中，所以你应该让它具有意义。在我们的示例中，我们安装了\
    \ `2.6.17.11` 内核，所以文件的最终副本看起来如下：\n\n```text\ntimeout 300\ndefault 0\nsplashimage=(hd0,0)/grub/splash.xpm.gz\n\
    title 2.6.16.11\n    root (hd0,0)\n    kernel /bzImage-2.6.16.11 root=/dev/sda2\
    \ vga=0x305\ntitle 2.6.16\n    root (hd0,0)\n    kernel /bzImage-2.6.16 root=/dev/sda2\
    \ vga=0x305\n```\n\n保存文件后，重启系统并确保新内核标题出现在启动菜单中。选中它并启动。\n\n## LILO\n\n要让 LILO 知道新内核的存在，你必须修改\
    \ `/etc/lilo.conf` 配置文件，然后运行 `lilo` 命令以应用配置文件的更改。有关配置文件的完整细节，请参 LILO 手册页：\n\n\
    ```bash\nman lilo\n```\n\n向 `/etc/lilo.conf` 添加新内核条目的最简单方法是复制现有条目。例如，考虑来自 Gentoo\
    \ 系统的 LILO 配置文件：\n\n```text\nboot=/dev/hda\nprompt\ntimeout=50\ndefault=2.6.12\n\
    image=/boot/bzImage-2.6.15\n    label=2.6.15\n    read-only\n    root=/dev/sda2\n\
    image=/boot/bzImage-2.6.12\n    label=2.6.12\n    read-only\n    root=/dev/sda2\n\
    ```\n\n以单词 `image=` 开头的行定义了一个新内核条目，因此该文件包含两个条目。只需从一个 `image=` 单词实例的行复制到下一个，如下：\n\
    \n```text\nimage=/boot/bzImage-2.6.15\n    label=2.6.15\n    read-only\n    root=/dev/sda2\n\
    ```\n\n复制到文件末尾，并编辑版本号以包含你刚刚安装的新内核的版本号。标签内容并不重要，只要它是唯一的，但它会显示在启动菜单中，所以你应该让它具有意义。在我们的示例中，我们安装了\
    \ `2.6.17.11` 内核，所以文件的最终副本看起来如下：\n\n```text\nboot=/dev/hda\nprompt\ntimeout=50\n\
    default=2.6.12\nimage=/boot/bzImage-2.6.15\n    label=2.6.15\n    read-only\n\
    \    root=/dev/sda2\nimage=/boot/bzImage-2.6.12\n    label=2.6.12\n    read-only\n\
    \    root=/dev/sda2\nimage=/boot/bzImage-2.6.17\n    label=2.6.17\n    read-only\n\
    \    root=/dev/sda2\n```\n\n保存文件后，运行 `/sbin/lilo` 程序将配置更改写入磁盘的引导区：\n\n```bash\n\
    # /sbin/lilo\n```\n"
