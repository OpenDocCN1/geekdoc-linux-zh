- fmt: '

    | Target | Description |

    | --- | --- |

    | `kernelrelease` | Displays the current kernel version, as determined by the
    build system. |

    | `kernelversion` | Displays the current kernel version, as told by the main Makefile.
    This differs from the `kernelrelease` target in that it doesn''t use any additional
    version based on configuration options or local files. |


    # Cleaning Targets


    These targets simply remove files from previous builds. Their use is highly recommended
    to make sure don''t contaminate new builds with files left over that may have
    been built with different options. They differ in how much they remove; sometimes
    you want to keep around you''ve changed.


    | Target | Description |

    | --- | --- |

    | `clean` | Removes most of the files generated by the kernel build, but keep
    the kernel configuration. |

    | `mrproper` | Removes all of the generated files by the kernel build system,
    including the configuration and some backup files. |

    | `distclean` | Does everything `mrproper` does and removes some editor backup
    files. |


    # Configuration Targets


    These targets allow the kernel to be configured in a wide range of different ways.


    | Target | Description |

    | --- | --- |

    | `config` | Updates the current kernel configuration using a line-oriented program.
    |

    | `menuconfig` | Updates the current kernel configuration using a text based program.
    |

    | `xconfig` | Updates the current kernel configuration using a QT-based graphical
    program. |

    | `gconfig` | Updates the current kernel configuration using a GTK+-based graphical
    program. |

    | `oldconfig` | Updates the current kernel configuration using the current `.config`
    file and prompting for any new options that have been added to the kernel. |

    | `silentoldconfig` | Just like `oldconfig`, but prints nothing to the screen
    except when a question needs to be answered. |

    | `randconfig` | Generates a new kernel configuration with random answers to all
    of the different options. |

    | `defconfig` | Generates a new kernel configuration with the default answer being
    used for all options. The default values are taken from a file located in `arch/$ARCH/defconfig`,
    where `$ARCH` refers to the specific architecture for which the kernel is being
    built. |

    | `allmodconfig` | Generates a new kernel configuration in which modules are enabled
    whenever possible. |

    | `allyesconfig` | Generates a new kernel configuration with all options set to
    `yes`. |

    | `allnoconfig` | Generates a new kernel configuration with all options set to
    `no`. |


    Note that the `allyesconfig`, `allmodconfig`, `allnoconfig`, and `randconfig`
    targets also take advantage of the environment variable `KCONFIG_ALLCONFIG`. If
    that variable points to a file, that file will be used as a list of configuration
    values that you require to be set to a specific value. In other words, the file
    overrides the normal behavior of `make` targets.


    For example, if the file `~/linux/must_be_set` contains the following variables:


    ```

    cat ~/linux/must_be_set

    CONFIG_SWAP=y

    CONFIG_DEBUG_FS=y

    ```


    and you enter `make allnoconfig` with the proper `KCONFIG_ALLCONFIG` environment
    variable in effect:


    ```

    KCONFIG_ALLCONFIG=../must_be_set make allnoconfig

    grep CONFIG_SWAP .config

    ```


    then the results include:


    ```

    grep CONFIG_DEBUG_FS .config

    CONFIG_DEBUG_FS=y

    ```


    This variable would not have normally been set to `y` otherwise.


    If the `KCONFIG_ALLCONFIG` variable is not set, the build system checks for files
    in the top-level build directory named:

    - `allmod.config`

    - `allno.config`

    - `allrandom.config`

    - `allyes.config`


    If any of those files are present, the build uses them as lists of configuration
    values that must be forced to the specified values. If none of those files are
    found, the build system finally looks for a file called `all.config` for a list
    of forced configuration values.


    You can use these different files to set up a known good base configuration that
    will always work. Then the other configuration options can be used to generate
    different testing configurations for the needed situation.


    # Build Targets


    These targets build the kernel itself in a variety of ways.


    | Target | Description |

    | --- | --- |

    | `all` | Builds all of the different targets needed for this kernel to be able
    to be used. This includes both the modules and the static portion of the kernel.
    |

    | `vmlinux` | Builds just the static portion of the kernel, not any loadable modules.
    |

    | `modules` | Builds all of the loadable kernel modules for this configuration.
    |

    | `modules_install` | Installs all of the modules into the specified location.
    If no `INSTALL_MODULE_PATH` is specified, they are installed in the default root.
    |

    | `dir/` | Tells the build system to locate all output files in the `dir` directory,
    including the kernel configuration files. This allows the kernel to be built from
    a read-only filesystem and have the output placed in another location. |

    | `dir/file.ko` | Builds only the specified file. |

    | `tags` | Builds all of the needed tags that common text editors can use while
    editing the code. |

    | `TAGS` | Builds all of the needed tags that common text editors can use while
    editing the code. |

    | `cscope` | Builds a `cscope` image, useful in source tree searches, of the source
    tree specified by the configuration. |


    You can also pass a number of environment variables to `make` that will change
    the build. These can be specified for almost any target.


    | Variable | Value | Description |

    | --- | --- | --- |

    | `V` | `0` | This tells the build system to run in a quiet manner, showing only
    the file that is currently built, and not the entire command that is running in
    order to build that file. This is the default option for the build system. |

    | `V` | `1` | This tells the build system to operate in a verbose way, showing
    the full command that is being used to generate each of the specific files. |

    | `O` | `dir` | This tells the build system to locate all output files in the
    `dir` directory, including the kernel configuration files. This allows for multiple
    builds from the same source. |

    | `C` | `1` | This checks all C files that are about to be built with the `sparse`
    tool, which detects common programming errors in the kernel source files. `sparse`
    can be downloaded using `git` from `git://git.kernel.org/pub/scm/devel/sparse.git`.
    Nightly snapshots can be found at [http://www.codemonkey.org.uk/projects/git-snapshots/sparse/](http://www.codemonkey.org.uk/projects/git-snapshots/sparse/).
    More information on how to use `sparse` can be found in the `Documentation/sparse.txt`
    file in the kernel source tree. |

    | `C` | `2` | This forces all C files to be checked with the `sparse` tool, even
    if they did not need to be built. |


    # Packaging Targets


    These targets package up a built kernel into a stand-alone package that can be
    installed on a wide range of different machines.


    | Target | Description |

    | --- | --- |

    | `rpm` | Builds the kernel first and then packages it up as a RPM package that
    can be installed. |

    | `rpm-pkg` | Builds a source RPM package containing the base kernel. |

