  trans: '


    如果你想使用 SCSI 硬盘、光纤通道磁盘、USB 存储器，或者 IOMEGA ZIP 驱动器的 SCSI 或并行端口版本，请选择 yes 并阅读 SCSI-HOWTO、Disk-HOWTO
    以及 Multi-Disk-HOWTO，这些文档可以在 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)
    获取。此项`不`用于 SCSI CD-ROM 设备。


    如果你的根文件系统（包含目录 `/*` 的系统）位于 SCSI 磁盘上，请勿将此驱动程序编译为模块。在这种情况下，也不要为你的 SCSI 主机适配器编译模块化驱动。


    ## CHR_DEV_ST — SCSI 磁带支持


    如果你想在 Linux 下使用 SCSI 磁带，请选择 yes 并阅读从 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)
    获取的 SCSI-HOWTO，以及内核源码中的 `Documentation/scsi/st.txt`。此项`不`用于 SCSI CD-ROM 设备。


    ## BLK_DEV_SR — SCSI CD-ROM 支持


    如果你想在 Linux 下使用 SCSI 或火线（FireWire）CD-ROM，请选择 yes 并阅读 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)
    中的 SCSI-HOWTO 和 CDROM-HOWTO 以获取更多指导。同时，请确保启用 `ISO 9660 CD-ROM file system support`
    选项。


    ## CHR_DEV_SG — SCSI 通用支持


    如果你想使用 SCSI 扫描仪、合成器或 CD 刻录机，或者除了硬盘、CD-ROM 或磁带之外任何名称中带有“SCSI”的设备，请在此选择 yes。内核不会直接支持这些设备，因此你需要一些额外的软件，能够通过
    SCSI 协议与这些设备通信：


    对于扫描仪，请查看 SANE [`www.sane-project.org`](http://www.sane-project.org)。对于 CD 刻录软件，请查看
    Cdrtools [`cdrecord.berlios.de/old/private/cdrecord.html`](http://cdrecord.berlios.de/old/private/cdrecord.html)，对于“一次性刻录光盘”，请查看
    CDRDAO [`cdrdao.sourceforge.net`](http://cdrdao.sourceforge.net)。Cdparanoia 是一种高质量的音频
    CD 数字读取器 ([`www.xiph.org/paranoia`](http://www.xiph.org/paranoia))。对于其他设备，你可能需要自己编写驱动软件。请阅读
    `Documentation/scsi/scsi-generic.txt` 文件获取更多信息。


    ## CHR_DEV_SCH — SCSI 媒体更换器支持


    这是一个用于 SCSI 媒体更换器的驱动程序。此类此类设备是磁带库和 MOD/CD-ROM 自动存储机（jukeboxes）。此选项用于真正的自动存储机；对于小型
    6 槽 CD-ROM 切换器，你不需要它。媒体更换器在 `*/proc/scsi/scsi` 中列为“Type: Medium Changer”。详情请查看
    `Documentation/scsi/scsi-changer.txt`。


    ## SCSI_MULTI_LUN — 探测每个 SCSI 设备上的所有 LUN


    如果你有一个支持多个 LUN（逻辑单元号）的 SCSI 设备（例如 CD 自动存储机），但只检测到一个 LUN，你可以在此处选择 yes 以强制 SCSI
    驱动探测多个 LUN。具有多个 LUN 的 SCSI 设备在逻辑上表现为多个 SCSI 设备。大多数 SCSI 设备只有一个 LUN，因此大多数人可以在此处选择
    no。`max_luns` 启动/模块参数允许你覆盖此设置。


    ## SCSI_SATA — 串行 ATA (SATA) 支持


    该驱动系列支持串行 ATA 主控制器设备。


    ## MD — 多设备驱动支持 (RAID 和 LVM)


    此选项通过单个逻辑设备支持多个物理磁盘柱，是 RAID 和逻辑卷管理必需的。


    ## BLK_DEV_MD — RAID 支持


    此驱动程序允许将多个硬盘分区合并为一个逻辑块设备。这可以简单地将一个分区附加另一个分区，或者将多个冗余硬盘合并为 RAID 1、RAID 4 或 RAID
    5 设备，以提供硬盘故障的保护。这被称为 `软件 RAID`，因为分区的合并是由内核完成的。`硬件 RAID` 意味着合并由专用的控制器完成；如果你有这样的控制器，则无需在此选择
    yes。


    关于 Linux 软件 RAID 的更多信息可以在 Software RAID mini-HOWTO 中找到，获取地址为 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)。在那里你也将了解到从何处获取的用户态
    raid 工具程序。


    ## BLK_DEV_DM — 设备映射 (Device mapper) 支持


    Device-mapper 是一个低级卷管理器。它通过允许用户指定逻辑扇区范围的映射来工作。除了多种映射类型，人们还可以编写包含自定义映射的模块。


    LVM2 等高层卷管理器使用此驱动程序。


    ## IEEE1394 — IEEE 1394 (火线) 支持


    IEEE 1394 描述了一种高性能串行总线，也称为 FireWire 或 i-Link，用于连接各种设备。


    如果你有火线接口并想使用它，请选择 yes。


    ## I2O — I/O 支持


    智能输入输出 (I2O) 架构允许硬件驱动程序被分为两个部分：特定系统的模块 (OSM) 和特定硬件模块 (HDM)。这使得同一个 HDM 可以在不同的操作系统下使用。I2O
    卡包含一个特殊的 I/O 处理器 (IOP)，由于 CPU 不需要处理 I/O，从而实现了高速度。如果你的电脑中有 I2O 接口卡，请选择 yes。


    ## NETDEVICES — 网络设备支持


    如果你不打算将 Linux Linux 连接到任何其他计算机，可以在此处选择 no。如果电脑包含网卡，则必须选择 yes。


    ## NET_ETHERNET — 以太网 (10 或 100Mbit)


    以太网（也称为 IEEE 802.3 或 ISO 882-2）是大学和公司中最常见的局域网 (LAN) 类型。


    如果你的 Linux 机器将连接到以太网且电脑中安装了以太网网卡 (NIC)，请在此选择 yes 并阅读 Ethernet-HOWTO，该文档可以在 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)
    获取。随后你还需要为你的特定 NIC 驱动程序选择 yes。


    注意，此问题的答案不会直接影响内核：选择 no 只会导致配置程序跳过所有关于以太网网卡的问题。


    ## NET_RADIO — 无线局域网驱动 (非业余无线) 和无线扩展


    支持无线局域网以及与数据包无线电的一切内容，但不包括业余无线或 FM 广播。


    '
- fmt: '

    Saying yes here also enables the Wireless Extensions, creating `*/proc/net/wireless`
    and enabling `iwconfig` access). The Wireless Extensions are a generic API that
    allows a driver to expose configuration and statistics for common wireless LANs
    to userspace. Wireless Extensions provide a single set of tools that can support
    all the variations of wireless LANs, regardless of their type (as long as the
    driver supports Wireless Extensions). Another advantage is that these parameters
    may be changed on the fly without restarting the driver or operating system. If
    you wish to use Wireless Extensions with wireless PCMCIA cards (PC-cards), you
    need to say yes here. You can fetch the tools from [http://www.hpl.hp.com/personal/Jean_Tourrilhes/Linux/Tools.html](http://www.hpl.hp.com/personal/Jean_Tourrilhes/Linux/Tools.html).


    ## PPP — PPP (point-to-point protocol) support


    PPP (Point to Point Protocol) sends Internet traffic over telephone (and other
    serial) lines. Ask your access provider if they support it, because otherwise
    you can''t use it. An older protocol with the same purpose is called SLIP. Most
    Internet access providers these days support PPP rather than SLIP.


    To use PPP, you need an additional program called `pppd` as described in the PPP-HOWTO,
    available at [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).
    Make sure that you have the version of `pppd` recommended in `Documentation/Changes`.
    The PPP option enlarges your kernel by about 16 KB.


    There are actually two versions of PPP: the traditional PPP for asynchronous lines,
    such as regular analog phone lines, and synchronous PPP, which can be used over
    digital ISDN lines for example. If you want to use PPP over phone lines or other
    asynchronous serial lines, you need to enable the `PPP support for async serial
    ports` option.


    ## PPPOE — PPP over Ethernet (experimental)


    Support for PPP over Ethernet.


    This driver requires the latest version of `pppd` from the CVS repository at `cvs.samba.org`.
    Alternatively, see the RoaringPenguin package [http://www.roaringpenguin.com/pppoe](http://www.roaringpenguin.com/pppoe),
    which contains instruction on hows to use this driver under the heading "Kernel
    mode PPPoE."


    ## ISDN — ISDN support


    ISDN ("Integrated Services Digital Networks", called RNIS in France) is a special
    type of fully digital telephone service; it''s mostly used to connect to your
    Internet service provider (with SLIP or PPP). The main advantage of ISDN is that
    the speed is higher than ordinary modem/telephone connections, and that you can
    have voice conversations while downloading stuff. It works only if your computer
    is equipped with an ISDN card and both you and your service provider purchased
    an ISDN line from the phone company. For details, read [http://www.alumni.caltech.edu/~dank/isdn](http://www.alumni.caltech.edu/~dank/isdn).


    Select this option if you want your kernel to support ISDN.


    ## PHONE — Linux telephony support


    Say yes here if you have a telephony card, which for example allows you to use
    a regular phone for voice-over-IP applications.


    ***


    ### Note


    This option has nothing to do with modems. You do not need to say yes here in
    order to be able to use a modem under Linux.


    ***


    ## INPUT — Generic input layer (needed for keyboard, mouse, ...)


    Say yes here if you have any input device (mouse, keyboard, tablet, joystick,
    steering wheel ...) connected to your system and want it to be available to applications.
    This includes a standard PS/2 keyboard and mouse.


    Say no here if you have a headless (no monitor, no keyboard) system.


    More information is available in the file `Documentation/input/input.txt`.


    ## VT — Virtual terminal


    Say yes here to get support for terminal devices with display and keyboard devices.
    These are called "virtual" because you can run several virtual terminals (also
    called virtual consoles) on one physical terminal.


    You need at least one virtual terminal device in order to make use of your keyboard
    and monitor. Therefore, only people configuring an embedded system would want
    to say no here in order to save some memory; the only way to log into such a system
    is then via a serial or network connection.


    Virtual terminals are useful because, for example, one virtual terminal can display
    system messages and warnings, another one can be used for a text-mode user session,
    and a third could run an X session, all in parallel. Switching between virtual
    terminals is done with certain key combinations, usually Alt-function key.


    If you are unsure, say yes, or else you won''t be able to do much with your Linux
    system.


    ## VT_CONSOLE — Support for console on virtual terminal


    The system console is the device that receives all kernel messages and warnings
    and allows logins in single user mode. If you answer yes here, a virtual terminal
    (the device used to interact with a physical terminal) can be used as system console.
    This is the most common mode of operations, so you should say yes unless you want
    the kernel messages be output only to a serial port (in which case you should
    also enable the `Console on 8250/16550 and compatible serial port` option).


    If you say yes here, by default, the currently visible virtual terminal (`*/dev/tty0`)
    will be used as system console. You can change that with a kernel command line
    option such as `console=tty3`, which specified the third virtual terminal as the
    system console. (See Chapter 9 for details about how to pass options to the kernel
    at boot time, and what options available.)


    ## SERIAL_8250 — 8250/16550 and compatible serial support


    This selects whether you want to include the driver for the standard serial ports.
    The standard answer is yes. People who might say no here are those setting up
    dedicated Ethernet/FTP servers, or users that have bus mice instead of a serial
    mouse and don''t intend to use their machine''s serial port for anything. In addition,
    the Cyclades and Stallion multi port drivers do not need this driver.


    ***


    ### Note


    Do not compile this driver as a module if you are using non-standard serial ports,
    because the configuration information will be lost when the driver is unloaded.
    This limitation may be lifted in the future.


    ***


    Most people will say yes here, so that they can use serial mice, modems, and similar
    devices connected to the standard serial ports.


    ## AGP — /dev/agart (AGP Support)


    AGP (Accelerated Graphics Port) is a bus system used mainly to connect graphics
    cards to the rest of the system.


    If you have an AGP system and you say yes here, it will be possible to use the
    AGP features of your 3D rendering video card. This code acts as a sort of "AGP
    driver" for the motherboard''s chipset.


    If you need more texture memory than you can get with the AGP GART (theoretically
    up to 256 MB, but in practice 64 or 128 MB due to kernel allocation issues), you
    could use PCI accesses and have up to a couple gigs of texture space.


    Note that this is the only way to have X and GLX use write-combining with MTRR
    support on the AGP bus. Without this option, OpenGL direct rendering will be a
    lot slower, but still faster than PIO.


    You should say yes here if you want to use GLX or DRI.


    ## DRM — Direct Rendering Manager (XFree66 4.1.0 and higher DRI support)


    Kernel-level support for the Direct Rendering Infrastructure (DRI) was introduced
    in XFree66 4.0. If you say yes here, you need to select the module that''s right
    for your graphics card from the list. These modules provide support for synchronization,
    security, and DMA transfers. Please see [http://dri.sourceforge.net](http://dri.sourceforge.net)
    for details. You should also select and configure AGP (`*/dev/agpgart*) support.


    ## I2C — I2C support

