  trans: '


    如果机器的物理内存在 1 到 4 GB 之间，请在此处填写 `4GB`。


    如果使用超过 4 GB，请在此处填写 `64GB`。此选项将开启 Intel PAE（物理地址扩展）模式。PAE 在 IA32 处理器上实现三级分页。Linux
    完全支持 PAE，并且在所有近期的 Intel 处理器（Pentium Pro 及更新型号）上都实现了 PAE 模式。


    ### 注意

    如果你在此处填写 `64GB`，那么内核将无法不支持 PAE 的 CPU 上启动！


    总物理内存的实际数量将自动检测，也可以通过使用内核命令行选项（如 `mem=256M`）强制指定。（详情请参见第 9 章，了解了解如何在启动时向内核传递选项以及有哪些可用选项。）


    如果不确定，请填写 `off`。


    ## HIGHMEM4G — 4GB


    如果你拥有 32 位处理器且拥有 1 到 4 GB 之间的物理内存，请选择此项。


    ## HIGHMEM64G — 64GB


    如果你拥有 32 位处理器且拥有超过 4 GB 的物理内存，请选择此项。


    ## FLATMEM_MANUAL — 平面内存


    此选项允许你更改 Linux 管理内部内存的一些方式。大多数用户在此处只会看到一个选项：`FLATMEM`。这是一个正常且正确的选项。


    某些使用高级功能（如 NUMA 和内存热插拔）的用户在此处可能会有不同的选项。`DISCONTIGMEM` 是一个更成熟、测试更好的系统，但它与内存热插拔兼容，且性能可能低于
    `SPARSEMEM`。如果你在 `Sparse Memory`（稀疏内存）和 `Discontiguous Memory`（不连续内存）之间犹豫，请选择
    `Discontiguous Memory`。


    如果不确定，请选择此选项，`Flat Memory`。


    ## DISCONTIGMEM_MANUAL — 不连续内存


    此选项为不连续内存系统提供了比平面内存更好的支持。这些系统的物理地址空间存在空隙，此选项可以更高效地处理这些空隙。然而，大多数硬件具有非常平坦的地址空间，可能会因为此选项带来的额外开销而导致性能下降。


    许多 NUMA 配置将此作为唯一选项。


    如果不确定，请选择此选项之外的 `Flat Memory`。


    ## SPARSEMEM_MANUAL — 稀疏内存


    这将是某些系统（包括内存热插拔系统）的唯一选项。


    对于许多其他系统，它是 `Discontiguous Memory` 的替代方案。此选项提供了一些潜在的性能收益，并降低了代码复杂度，但它较新且更具实验性。


    如果不确定，请选择 `Discontiguous Memory` 或 `Flat Memory`。


    ## SECCOMP — 启用 seccomp 以安全计算不可信的字节码


    此内核功能对于可能在执行期间需要计算不可信字节码的数值计算型应用程序非常有用。通过使用支持读/写系统调用的文件描述符提供的进程管道或其他传输方式，可以使用
    seccomp 将这些应用程序隔离在自己的地址空间中。一旦通过 `/proc/pid/seccomp` 启用 seccomp，它就无法被禁用，且任务仅允许执行由每个
    seccomp 模式定义的少数安全系统调用。


    如果不确定，请选择 yes。只有嵌入式系统应该通过回答 no 来构建。


    ## KEXEC — kexec 系统调用（实验性）


    `kexec` 是一个实现关闭当前内核并启动另一个内核的系统调用。它类似于重启，但独立于系统固件。与重启一样，你可以用它启动任何内核，而不只是 Linux。


    该名称源于它与 `exec` 系统调用的相似性。


    如果此代码最初对你不起作用，不要感到惊讶。启用设备热插拔支持可能会有所帮助。截至此时，确切的硬件接口处于剧变中，因此无法给出良好的建议。


    ## HOTPLUG_CPU — 支持热插拔 CPU（实验性）


    在此处回答 yes 以尝试关闭和开启 CPU，并在 SMP 系统上启用挂起功能。CPU 可以 `/sys/devices/system/cpu` 接口进行控制。


    ## PM — 电源管理支持


    电源管理允许计算机的部分组件在不被使用时关闭或进入省电睡眠模式。实现此功能有两种竞争的标准：APM 和 ACPI。如果你想使用其中任何一种，请在此处回答 yes，然后也启用这两个标准之一。


    电源管理对于电池供电的笔记本电脑最为重要；如果你有一台笔记本电脑，请查看 Linux 笔记本主页 [`www.linux-on-laptops.com`](http://www.linux-on-laptops.com)
    或移动计算机上的 Tuxmobil-Linux [`www.tuxmobil.org`](http://www.tuxmobil.org)，以及来自 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)
    的电池供电 Linux mini-HOWTO。


    注意，即使你在此处回答 no，x86 架构上的 Linux 在无运行时也会发出 `hlt` 指令，从而处理器进入睡眠状态并节省能量。


    ## SOFTWARE_SUSPEND — 软件挂起


    启用机器挂起。


    当机器挂起时，镜像将保存在你的活动交换分区中。下次启动时，传递 `resume=/dev/swappartition`。


    ## ACPI — ACPI 支持


    Linux 的高级配置和电源接口 (ACPI) 支持需要符合 ACPI 标准的硬件和固件，并假设存在操作系统引导配置和电源管理 (OSPM) 软件。此选项将使内核增大
    70 KB。


    Linux ACPI 为多个旧的配置和电源管理接口提供了健壮的替代方案，包括插即用 BIOS 规范 (PnP BIOS)、多处理器规范 (MPS) 和高级电源管理
    (APM) 规范。如果同时配置了 ACPI 和 APM，将使用先加载的。


    ACPI SourceForge 项目 [`sourceforge.net/projects/acpi`](http://sourceforge.net/projects/acpi)
    包含了源代码、文档、工具、邮件列表订阅和其他信息。


    Linux 对 ACPI 的支持基于 Intel 的 ACPI 组件架构 (ACPI CA)。更多信息请参阅 [`developer.intel.com/technology/iapc/acpi`](http://developer.intel.com/technology/iapc/acpi)。


    ACPI 是由 Compaq、Intel、微软、Phoenix 和东京共同开发的开放行业标准。该规范可以在 http://www.acpi.info](http://www.acpi.info
    获取。


    ## CPU_FREQ — CPU 频率调整


    CPU 频率调整允许你动态更改 CPU 的频率。这可以节能，因为 CPU 频率越低，CPU 消耗的电越少。


    注意，此驱动程序不会自动更改 CPU 频率；你需要在启动后启用动态 CPUFreq 策略器（后文所述）或使用用户态工具。


    详情请参阅 *Documentation/cpu-freq*。


    '
- fmt: '

    Use the CPUFreq `userspace` governor. This allows you to set the CPU frequency
    manually, and allows a userspace program to set the CPU dynamically without requiring
    you to first enable the userspace governor manually.


    ### CPU_FREQ_GOV_PERFORMANCE — "Performance" CPUFreq policy governor


    This CPUFreq policy governor sets the frequency statically to the highest available
    CPU frequency.


    ### CPU_FREQ_GOV_POWERSAVE — "Powersave" CPUFreq policy governor


    This sets the frequency statically to the lowest available CPU frequency.


    ### CPU_FREQ_GOV_USERSPACE — "Userspace" CPUFreq policy governor


    Enable this CPUFreq policy governor either when you want to set the CPU frequency
    manually or when a userspace program should be able to set the CPU dynamically,
    as on LART ([http://www.lartmaker.nl](http://www.lartmaker.nl)).


    For details, take a look at `Documentation/cpu-freq`.


    ### CPU_FREQ_GOV_ONDEMAND — "Ondemand" CPUFreq policy governor


    This driver adds a dynamic CPUFreq policy governor. The governor polls the CPU
    and changes its frequency based on CPU utilization. Support for this governor
    depends on the CPU''s ability to do fast frequency switching (i.e, very low latency
    frequency transitions).


    For details, take a look at `Documentation/cpu-freq`.


    ### CPU_FREQ_GOV_CONSERVATIVE — "Conservative" CPUFreq policy governor


    This driver is similar to the Ondemand governor both in its source code and its
    purpose. The difference is that the Conservative governor is optimiaed for a battery-powered
    system. The frequency is gracefully increased and decreased rather than jumping
    to 100% when speed is required.


    If you are using a laptop, a PDA, or an AMD64-based computer (due to the unacceptable
    step-by-step latency issues between the minimum and maximum frequency transitions
    in the CPU) you will probably want to use this governor. If you have a desktop
    machine, consider the Ondemand governor instead.


    For details, take a look at `Documentation/cpu-freq`.


    ### PCI — PCI support


    PCI is a bus system used by the processor to talk to internal devices and add-on
    cards. It is extremely common and found in almost all modern computers.


    Say yes to this option unless you have a special reason not to.


    ### PCCARD — PCCard (PCMCIA/CardBus) support


    Say yes here if you want to attach PCMCIA- or PC-cards to your Linux computer.
    These are credit-card size devices such as network cards, modems, or hard drives
    often used with laptops computers. There are actually two varieties of these cards:
    16-bit PCMCIA and 32-bit CardBus cards.


    ### PCMCIA — 16-bit PCMCIA support


    This option enables support for 16-bit PCMCIA cards. Most older PC-cards are such
    16-bit PCMCIA cards, so unless you know you''re only using 32-bit CardBus cards,
    say yes here.


    To use 16-bit PCMCIA cards, you will need supporting software in most cases. See
    the file `Documentation/Changes` for location and details.


    ### CARDBUS — 32-bit CardBus support


    CardBus is a bus mastering architecture for PC-cards, which allows for 32-bit
    PC-cards (the original PCMCIA standard specifies only a 16-bit wide bus). Many
    newer PC-cards are actually CardBus cards.


    To use 32-bit PC-cards, you also need a CardBus compatible host bridge. Virtually
    all modern PCMCIA bridges do this, and most of them are "yenta-compatible," so
    enable that option too.


    ### HOTPLUG_PCI — Support for PCI Hotplug (experimental)


    Say yes here if you have a motherboard with a PCI Hotplug controller. This allows
    you to add and remove PCI cards while the machine is powered up and running.


    ### NET — Networking support


    Say yes here unless you are an expert with a really good reason not o. The reason
    is that some programs need kernel networking support even when running on a stand-alone
    machine that isn''t connected to any other computer.


    If you are upgrading from an older kernel, you should consider updating your networking
    tools too, because changes in the kernel and the tools often go hand in hand.
    The tools are contained in the `net-tools` package, the location and version number
    of which are given in `Documentation/Changes`.


    For a general introduction to Linux networking, it is highly recommended that
    you read the NET-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).


    ### UNIX — Unix domain sockets


    If you say yes here, you will include support for Unix domain sockets; sockets
    are the standard Unix mechanism for establishing and accessing network connections.
    Many commonly used programs such as the X Window System, syslog, and udev use
    these sockets even if your machine is not connected to any network. Unless you
    are working on an embedded system or something similar, you therefore definitely
    want to say yes here.


    ### INET — TCP/IP networking


    These are the protocols used on the Internet and on most local Ethernets. It is
    highly recommended that you say yes here, since some programs (e.g. the X Window
    System) use TCP/IP even if your machine is not connected to any other computer.
    They use the so-called `loopback device`, which this option sets up. It will enlarge
    your kernel by about 144 KB.


    For an excellent introduction to Linux networking, please read the Linux HOWTO,
    available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).


    ### IP_ADVANCED_ROUTER — IP: advanced router


    If you intend to run your Linux box mostly as a router, i.e. as a computer that
    forwards and redistributes network packets, say yes here. You will then be presented
    with several options that allow more precise control about the routing.


    The answer to this question won''t directly affect the kernel: answering no will
    just cause the configurator to skip all the questions about advanced.


    Note that your box can act as a router only if you enable IP forwarding in your
    kernel; you can do that by saying yes to the `/proc file system support` and `Sysctl
    support` options and executing the line:


    ```

    echo "1" > /proc/sys/ipv4/ip_forward

    ```


    at boot time after the `/proc` file system has been mounted.


    If you turn on IP forwarding, you will also get the rp_filter, which automatically
    rejects incoming packets if the routing table entry for their source address doesn''t
    match the interface they''re arriving on. This has security advantages because
    it prevents IP spoofing; however, it can pose problems if you use asymmetric routing
    (packets from you to a host take a different path from packets that go from that
    host to you) or if you operate a non-routing host that has several IP addresses
    on different interfaces. To turn rp_filter off, enter:


    ```

    echo 0 > /proc/sys/ipv4/conf/device/rp_filter

    ```


    or


    ```

    echo 0 > /proc/sys/ipv4/conf/all/rp_filter

    ```


    ### NETFILTER — Network packet filtering


    Netfilter is a framework for filtering and mangling network packets that pass
    through your Linux box.


    The most common use of packet filtering is to run your Linux box as a firewall
    protecting a local network from the Internet. The type of firewall provided by
    this kernel support is called a `packet filter`, which means that it can reject
    individual network packets based on type, source, destination etc. The other kind
    of firewall, a `proxy-based` one, is more secure but more intrusive and more bothersome
    to set up; it inspects the network traffic much more closely, modifies it, and
    has knowledge about the higher level protocols, which a packet filter lacks. Moreover,
    proxy-based firewalls often require changes to the programs running on the local
    clients. Proxy-based firewalls don''t need support by the kernel, but they are
    often combined with a packet filter, which works only if you say yes here.

    '
