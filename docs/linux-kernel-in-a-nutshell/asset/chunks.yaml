    `binrpm-pkg`: 构建一个包含编译后的内核和模块的 RPM 包。


    `deb-pkg`: 构建一个包含编译后的内核和模块的 Debian 包。


    `tar-pkg`: 构建一个包含编译后的内核和模块的 tar 包。


    `targz-pkg`: 构建一个经过 `gzip` 压缩的、包含编译后的内核和模块的 tar 包。


    `tarbz2-pkg`: 构建一个经过 `bzip2` 压缩的、包含编译后的内核和模块的 tar 包。


    #文档目标


    这些目标以多种格式构建内核内部文档。


    表 10-7. 文档目标


    | 目标 | 描述 |

    | :--- | :--- |

    | `xmldocs` | 以 XML DocBook 文件构建内核文档。 |

    | `psdocs` | 以 PostScript 文件构建内核文档。 |

    | `pdfdocs` | 以 PDF 文件构建内核文档。 |

    | `htmldocs` | 以 HTML 文件构建内核文档。 |

    | `mandocs` | 以一组帮助页（man pages）构建内核文档，随后可以使用 `installmandocs` 目标进行安装。 |


    # 架构特定目标


    每个内核架构都有一组独特的特定目标。32 位 Intel 架构提供了以下目标。


    表 10-8. 32 位 Intel 架构特定目标


    | 目标 | 描述 |

    | :--- | :--- |

    | `bzImage` | 创建一个压缩的内核镜像并将其放置在 `arch/i386/boot/bzImage` 文件。这是 i386 内核构建的默认目标。
    |

    | `install` | 使用特定发行版的 `/sbin/installkernel` 程序安装内核镜像。注意，这不会安装内核模块；模块必须使用 `modules_install`
    目标完成。 |

    | `bzdisk` | 创建一个启动软盘镜像并将其写入 `/dev/fd0` 设备。 |

    | `fdimage` | 创建一个启动软盘镜像并将其放置在文件 `arch/i386/boot/fdimage` 中。系统中必须存在 `mtools` 包才能正常工作。
    |

    | `isoimage` | 创建一个 CD-ROM 启动镜像并将其放置在文件 `arch/i396/boot/image.iso` 中。系统中必须存在 `syslinux`
    包才能正常工作。 |


    # 分析目标


    这些目标有助于尝试寻找内核中的问题代码。在创建新代码时，创建一个栈空间列表是一个好主意，以确定你的更改没有占用过多的内核栈空间。`namespacecheck`
    目标用于判断你的更改是否可以安全地将其符号添加到内核的全局命名空间。


    表 10-9. 分析目标


    | 目标 | 描述 |

    | :--- | :--- |

    | `checkstack` | 生成一个使用最多内核栈空间的函数列表。 |

    | `namespacecheck` | 生成所有内核符号及其命名空间的列表。这将是一份巨大的列表。 |


    # 第 11 章. 内核配置选项参考


    本章列出了运行 `make config` 或其任一图形界面时提供的最重要的配置选项。该章节的大部分内容基于内核内部关于不同内核配置选项的文档，这些文档由内核开发者编写并在
    GPL 下发布。


    ## 名称


    EXPERIMENTAL — 提示开发和/或不完整的代码/驱动程序


    Linux 支持的许多功能中（如网络驱动程序、文件系统、网络协议等）可能处于开发状态，其功能、稳定性或测试水平尚未高到可以通用的程度。在开发者之间通常被称为“alpha
    测试”阶段。如果某个功能目前处于 alpha 测试阶段，开发者通常会阻止普通用户在不知情的情况下广泛使用该功能，以避免收到“为什么这不起用？”的邮件。然而，欢迎对这些系统进行积极测试和使用。只需注意，它可能无法达到正常的可靠性水平，或在某些特殊情况下失效。开发者通常欢迎熟悉内核内部原理的人提供详细错误报告。（在提交错误报告之前，请阅读内核源码中的
    `README`、`MAINTAINERS`、`REPORTING-BUGS`、`Documentation/BUG-HUNTING` 和 `Documentation/oops-tracing.txt`
    文档）。


    此选项还会提供过时的驱动程序。这些驱动程序已被其他内容取代，并/或计划在未来的内核版本中移除。


    除非你打算帮助测试和开发属于此类类别的功能或驱动程序，或者你处于需要使用这些功能的情况，否则你应该说“否”，这将导致配置程序呈现更选项。如果你在这里说“是”，你将获得使用目前认为处于
    alpha 测试阶段的功能或驱动程序的选择。该选项本身除了允许你选择选项外，什么都不做。


    ## 名称


    LOCALVERSION — 本地版本 -- 追加到内核发布版本


    这允许你在内核版本数的末尾附加一个额外的字符串。例如，当你输入 `uname` 命令时它将会显示。你在这里设置的字符串将按顺序附加在对象树和源码树中任何包含
    `localversion` 的文件内容之后。该字符串最大长度为 64 个字符。


    ## 名称


    AUDIT — 审计支持


    启用可以与另一个内核子系统使用的审计基础设施，例如 SELinux（记录 avc 消息需要此功能）。


    ## 名称


    IKCONFIG — 内核 .config 支持


    此选项允许将 Linux 内核 `.config` 文件内容保存在内核中。它记录了运行内核或磁盘内核使用的内核选项。这些信息可以使用 `scripts/extract-ikconfig`
    从内核镜像中提取并作为重建当前内核或构建另一个内核的输入。也可以通过读取文件 `/proc/config.gz` 从运行内核中提取。


    ## 名称


    EMBEDDED — 配置标准内核功能（小型系统）


    此选项允许禁用或调整某些基础内核选项和设置。适用于可以忍受“非标准”内核的特殊环境。仅建议专家使用，因为非常容易更改选项导致内核无法正常启动。


    ## 名称


    MODULES — 启用可加载模块支持


    内核模块是内核插入运行内核的小型编译代码段，而不是永久构建在内核中。如果你选择此选项，内核的许多部分可以作为模块构建（在指示处回答 `M` 而不是 `Y`）：这对于不需要启动的经常使用的选项最有用。更多信息请参见第
    4 章以及 `modprobe`、`lsmod`、`modinfo`、`insmod` 和 `rmmod` 的帮助页。


    如果你在这里说“是”，你需要运行 `make modules_install` 将模块放在 `/lib/modules` 下，以便模块工具找到它们。


    ## 名称


    IOSCHED_NOOP — 无操作 I/O 调度


    no-op I/O 调度器是一个执行基本合并和排序的最小调度器。它的主要用途包括非磁盘的块设备（如内存设备）以及仅需要内核最小帮助的特殊软件或硬件环境。


    ## 名称


    IOSCHED_AS — 预期 I/O 调度


    '
- fmt: '

    The anticipatory I/O scheduler is the default disk scheduler. It is generally
    a good choice for most environments, but is quite large and complex compared to
    the deadline I/O scheduler. It can also be slower in some cases, especially under
    some database loads.


    ### IOSCHED_DEADLINE — Deadline I/O scheduler


    The deadline I/O scheduler is simple and compact. It is often as good as the anticipatory
    I/O scheduler, and under some database workloads even better. In the case of a
    single process performing I/O to a disk at any one time, its behaviour is almost
    identical to the anticipatory I/O scheduler and so is a good choice.


    ### IOSCHED_CFQ — CFQ I/O scheduler


    The CFQ I/O scheduler tries to distribute bandwidth equally among all processes
    in the system. It should provide a fair working environment, suitable for desktop
    systems.


    ### SMP — Symmetric multi-processing support


    This enables support for systems with more than one CPU. If you have a system
    with only one CPU, like most personal computers, say no. If you have a system
    with more than one CPU, say yes.


    If you say no here, the kernel will run on single and multiprocessor machines,
    but will use only one CPU of a multiprocessor machine. If you say yes here, the
    kernel will run on many, but not all, singleprocessor machines. On a singleprocessor
    machine, the kernel will run faster if you say no here.


    Note that if you say yes here and choose architecture `586` or `Pentium` under
    `Processor family`, the kernel will not work on 486 architectures. Similarly,
    multiprocessor kernels for the `PPro` architecture may not work on all Pentium
    based boards.


    See also `Documentation/smp.txt`, `Documentation/i386/IO-APIC.txt`, `Documentation/nmi_watchdog.txt`,
    and the `SMP-HOWTO` available at [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).


    ### M386 — 386


    This is the processor type of your CPU. This information is used for optimization.
    In order to compile a kernel that can run on all x86 CPU types (albeit not optimally
    fast), you can specify `386` here.


    The kernel will not necessarily run on earlier architectures than the one you
    have chosen; e.g., a Pentium optimized kernel will run on a PPro, but not necessarily
    on a i486.


    Here are the settings recommended for greatest speed:


    `386`

    > Choose this if you have a AMD/Cyrix/Intel 386DX/DXL/SL/SLC/SX, Cyrix/TI 486DLC/DLC2,
    UMC 486SX-S and NexGen Nx586 procesor. Only `386` kernels will run on a 386 class
    machine.


    `486`

    > Choose this if you have a AMD/Cyrix/IBM/Intel 486DX/DX2/DX4 or SL/SLC/SLC2/SLC3/SX/SX2
    and UMC U5D or U5S processor.


    `586`

    > Choose this if you have a generic Pentium processor lacking the TSC (time stamp
    counter) register.


    `Pentium-Classic`

    > Choose this if you have an Intel Pentium processor.


    `Pentium-MMX`

    > Choose this if you have an Intel Pentium MMX processor.


    `Pentium-Pro`

    > Choose this if you have an Intel Pentium Pro processor.


    `Pentium-II`

    > Choose this if you have an Intel Pentium II or pre-Coppermine Celeron processor.


    `Pentium-III`

    > Choose this if you have the Intel Pentium III or Coppermine Celeron processor.


    `Pentium-4`

    > Choose this if you have an Intel Pentium 4 or P4-based Celeron processor.


    `K6`

    > Choose this if you have an AMD K6, K6-II or K6-III (aka K6-3D) processor.


    `Athlon`

    > Choose this if you have a AMD K7 family (Athlon/Duron/Thunderbird) processor.


    `Crusoe`

    > Choose this if you have a Transmeta Crusoe series processor.


    `Efficeon`

    > Choose this if you have a Transmeta Efficeon series processor.


    `Winchip-C6`

    > Choose this if you have an original IDT Winchip processor.


    `Winchip-2`

    > Choose this if you have an IDT Winchip 2 processor.


    `Winchip-2`

    > Choose this if you have an IDT Winchip processor with 3dNow! capabilities.


    `GeodeGX1`

    > Choose this if you have a Geode GX1 (Cyrix MediaGX) procssor.


    `Geode GX/LX`

    > Choose this if you have an AMD Geode GX or LX processor.


    `CyrixIII/VIA C3`

    > Choose this if you have a VIA Cyrix III or VIA C3 processor.


    `VIA C3-2`

    > Choose this if you have a VIA C3-2 "Nehemiah" (model 9 and above) processor.


    If you don''t know what to do, choose `386`.


    ### X86_GENERIC — Generic x86 support


    Instead of just including optimizations for the selected x86 variant (e.g. PII,
    Crusoe or Athlon), include some more generic optimizations as well.


    ### NR_CPUS — Maximum number of CPUs (255)


    This allows you to specify the maximum number of CPUs that kernel will support.
    The maximum supported value is 255 and the minimum value that makes sense is 2.


    ### SCHED_SMT — SMT (Hyper-Threading)


    SMT support improves the scheduler''s decision-making on Pentium 4 at a cost of
    slightly increased overhead.


    ### PREEMPT_NONE — No forced preemption (server)


    This is the traditional Linux preemption model, geared toward throughput. It still
    provides good latency most of the time, occasional delays are possible. Select
    this option if you are building a kernel for a server or scientific system.


    ### PREEMPT_VOLUNTARY — Voluntary kernel preemption (desktop)


    This option reduces the latency of the kernel by adding more "explicit preemption
    points" to the kernel. This allows a low-priority process to preempt itself even
    if it is in kernel mode executing a system call. This allows applications to appear
    to run more smoothly even when the system is under load. Select this if you are
    building a kernel for a desktop.


    ### PREEMPT — Preemptible kernel (low-latency desktop)


    This option reduces the latency of the kernel by making all kernel code (except
    code executing in a critical section) preemptible. This allows reaction to interactive
    events by permitting a low priority process to be preempted involuntarily even
    if it is in kernel mode executing a system call and would otherwise not be about
    to reach a natural preemption point. This allows applications to appear to run
    more smoothly even when the system is under load, at the cost of slighly lower
    throughput and a slight runtime overhead to kernel code. Select this if you are
    building a kernel for a desktop or embedded system with latency requirements in
    the milliseconds range.


    ### PREEMPT_BKL — Preempt the Big Kernel Lock


    This option reduces the latency of the kernel by making the Big Kernel Lock preemptible.
    Say yes here if you are building a kernel for a desktop system.


    ### NOHIGHMEM — off


    Linux can use up to 64 Gigabytes of physical memory on x86 systems. However, the
    address space of 32-bit x86 processors is only 4 Gigabytes in size. That means
    that, if you have a large amount of physical memory, not all of it can be permanently
    mapped by the kernel. The physical memory that''s not permanently mapped is called
    high memory.


    If you are compiling a kernel that will never run on a machine with more than
    1 Gigabyte total physical RAM, answer `off` here (the default choice, and suitable
    for most users). This will result in a `3GB/1GB` split: 3GB are mapped so that
    each process sees a 3GB virtual memory space and the remaining part of the 4GB
    virtual memory space is used by the kernel to permanently map as much physical
    memory as possible.

