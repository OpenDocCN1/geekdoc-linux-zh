    2. 使用来自 [`kernel.org`](http://kernel.org) 的官方补丁将旧内核版本向前移动一个版本：`$` patch -p1 <
    ../patch-2.6.20


    `$` cd ..`


    `$` mv linux-2.6.19 linux-2.6.20`


    3. 现在让 `quilt` 将所有补丁推送到新树上：`$` quilt push`


    `Applying patch patches/patch1`

    `patching file Makefile`

    `Hunk #1 FAILED at 1.`

    `1 out of 1 hunk FAILED -- rejects in file Makefile`

    `Patch patches/patch1 does not apply (enforce with -f)`


    4. 由于第一个补丁无法整洁应用，强制应用补丁然后进行修复：`$` quilt push -f`


    `Applying patch patches/patch1`

    `patching file Makefile`

    `Hunk #1 FAILED at 1.`

    `1 out of 1 hunk FAILED -- saving rejects to file Makefile.rej`

    `Applied patch patches/patch1 (forced; needs refresh)`

    `$` vim Makefile.rej Makefile`


    5. 手动应用补丁后，刷新补丁：`$` quilt refresh`


    `Refreshed patch patches/patch1`


    6. 继续推送其他补丁：`$` quilt push`


    `Applying patch patches/patch2`

    `patching file drivers/Makefile`

    `Now at patch patches/patch2`

    `$` quilt push`


    `Applying patch patches/patch3`

    `patching file drivers/usb/Makefile`

    `Now at patch patches/patch3`


    `quilt` 还有其他选项，可以自动将系列中的所有补丁通过发送给一组人员或邮件列表、删除系列中间特定的补丁、向上或向下遍历补丁系列直到找到特定补丁，以及许多其他强大的选项。


    如果你想进行任何类型的内核开发，强烈建议使用 `quilt`，即使只是为了跟踪几个补丁，而不是使用更困难的 `diff` 和 `patch` 方法。它要简单得多，并将为你节省大量的时间和精力。


    从个人角度来说，我怎么推荐这个工具都不为，因为我每天都用它来管理不同开发树中的数百个补丁。许多 Linux 发行版也使用它来维护它们的内核包，并且它有一个活跃且响应迅速的开发社区。


    # git


    `git` 是一个源代码控制工具，最初由 Linus Torvalds 在 Linux 内核寻找新的源码控制系统时编写。它是一个分布式系统，与传统的源码控制系统（如
    `cvs`）不同之处在于，它在向仓库提交代码时不需要连接到服务器。


    `git` 是目前可用的最强大、灵活且快速的源码控制系统之一，并且背后有一个活跃的开发团队在支持。`git` 的主页可以在 [`git.or.cz/`](http://git.or.cz/)
    找到。建议任何 `git` 的新用户都阅读已发布的教程，以熟悉 `git` 的工作原理以及如何正确使用它。


    Linux 内核使用 `git` 开发，最新的 `git` 内核树可以在 [`www.kernel.org/git/`](http://www.kernel.org/git/)
    找到，还有其他内核开发者的 `git` 仓库列表。


    进行 Linux 内核开发并不一定要使用 `git`，但它对于帮助追踪内核漏洞非常有帮助。如果你向 Linux 内核开发人员报告漏洞，他们可能会要求你使用
    `git bisect` 来找到导致漏洞发生的精确更改。如果是这样，请遵循 `git` 文档中的说明来使用。


    # ketchup


    `ketchup` 是一个非常实用的工具，用于更新或切换不同版本的 Linux 内核源码树。它具有以下能力：


    * 查找内核最新版本、下载并解压。

    * 通过将树补丁到正确的版本，将当前安装的内核源码树更新到任何其他版本。

    * 处理内核树的不同开发和稳定分支，包括 `-mm` 和 `-stable` 树。

    * 如果机器上已经不存在，则下载更新所需的任何补丁或 tar 包。

    * 检查 tar 包和补丁的 GPG 签名，以验证下载的是否正确的文件。


    `ketchup` 可以在 [`www.selenic.com/ketchup/`](http://www.selenic.com/ketchup/) 找到，并在
    [`www.selenic.com/ketchup/wiki/`](http://www.selenic.com/ketchup/wiki/) 的 wiki
    中有很多额外的文档。


    以下是一组步骤，展示了如何简单地使用 `ketchup` 下载特定内核版本，然后仅需极少数命令将目录切换到另一个内核版本。


