    > 不要按照 PCI BIOS 提供的顺序对 PCI 设备进行排序。这种排序是为了获得与旧旧内核版本兼容的设备顺序。


    `biosirq`


    > 使用 PCI BIOS 调用获取中断路由表。这些调用在某些机器上已知存在 Bug 并且在使用时会导致机器挂起，但在其他机器上，它们是获取中断路由表的唯一方法。如果内核无法分配
    IRQ 或无法在你的主板上发现二级 PCI 总线，请尝试此选项。


    `rom`


    > 为扩展 ROM 分配地址空间。请谨慎使用此选项，因为某些设备在 ROM 和其他资源之间共享地址解码器。


    `irqmask=0x`nnnn`


    > 设置允许自动分配给 PCI 设备的 IRQ 掩码位图。你可以通过这种方式让内核排除你的 ISA 卡的 IRQ。


    `pirqaddr=0x`n`


    > 如果指定 PIRQ 表的物理地址（通常由 BIOS 生成），如果该地址位于 F00000-100000（十六进制）范围之外。


    `lastbus=`n`


    > 扫描通过总线 `n` 的所有总线。如果内核无法找到你的二级总线且你想显式地告诉它是哪些，则此项非常有用。


    `assign-busses`


    > 始终使用自己的 PCI 总线编号，覆盖固件可能做的任何操作。


    `usepirqmask`


    > 尊重存储在 BIOS $PIR$ 表中可能的 IRQ 掩码。这在某些损坏损坏 的系统中是需要的，特别是某些 HP Pavilion N5400 和 Omnibook
    XE3 笔记本。如果启用了 ACPI IRQ 路由，此设置将无效。


    `noacpi`


    > 不要使用 ACPI 进行 IRQ 路由或 PCI 扫描。


    `routeirq`


    > 为所有 PCI 设备进行 IRQ 路由。这通常在 `pci_enable_device()` 中完成，因此此选项是对未调用该函数的损坏驱动程序的临时解决方案。


    `firmware`


    > 不要重新枚举总线，而是直接使用启动加载程序的配置。这目前用于 IXP2000 系统，在这些系统中总线必须为辅助 CPU 进行特定的配置。


    # PnP BIOS 选项


    ## Name


    `noisapnp` — 禁用 ISA PnP 子系统。


    如果在内核配置中已启用 ISA PnP 子系统，则将其禁用。


    ## Name


    `pnpbios` — PnP BIOS 设置。


    ## Synopsis


    `pnpbios=[on|`off`|`curr`|`no-curr]`


    设置主 PnP BIOS 设置。`on` 启用 PnP BIOS 子系统。`off` 禁用 PnP BIOS 子系统。`curr` 告诉 PnP BIOS
    子系统使用当前的静态设置，`no-curr` 告诉子系统尽可能探测动态设置。


    ## Name


    `pnp_reserve_irq` — PnP BIOS 预留 IRQ。


    ## Synopsis


    `pnp_reserve_irq=`irq1`[`,`irq2`...]


    PnP BIOS 子系统不应用于自动配置的 IRQ 列表。


    ## Name


    `pnp_reserve_dma` — PnP BIOS 预留 DMA。


    ## Synopsis


    `pnp_reserve_dma=`dma1`[`,`dma2`...]


    PnP BIOS 子系统不应用于自动配置的 DMA 列表。


    ## Name


    `pnp_reserve_io` — PnP BIOS 预留 I/O 端口。


    ## Synopsis


    `pnp_reserve_io=`io1``,`size1`[`,`io2``,`size2`...]


    PnP BIOS 子系统不应用于自动配置的 I/O 端口。每个端口按其起始位置和大小列出。


    ## Name


    `pnp_reserve_mem` — PnP BIOS 预留内存区域。


    ## Synopsis


    `pnp_reserve_mem=`mem1``,`size1`[`,`mem2``,`size2`...]


    PnP BIOS 子系统不应用于自动配置的内存区域。每个区域按其起始位置和大小列出。


    # SELinux 选项


    这些选项更改 SELinux 启动的一些基本方面。


    ## Name


    `checkreqprot` — 设置初始 `checkreqprot` 标志值。


    ## Synopsis


    `checkreqprot=[0|`1]`


    设置初始的 `checkreqprot` 标志值。`0` 表示由内核应用保护检查，并包括任何隐含的执行保护。`1` 表示由应用程序请求保护检查。默认值由内核配置选项设置。


    该值可以在运行时通过 `/selinux/checkreqprot` 文件进行更改。


    ## Name


    `enforcing` — 设置初始的强制状态。


    ## Synopsis


    `enforcing=[0|`1]`


    指定 SELinux 在启动时是否强制执行规则。`0` 表示 SELinux 仅记录策略违反情况，但不会拒绝任何访问。`1` 表示将完全启用强制模式，包括拒绝和记录。默认值为
    `0`。


    该值可以在运行时通过 `/selinux/enforce` 文件进行更改。


    ## Name


    `selinux` — 在启动时启用或禁用 SELinux。


    ## Synopsis


    `selinux=[0|`1]`


    此选项允许在启动时启用 (`1`) 或禁用 (`0`) SELinux。默认值由内核配置选项设置。


    ## Name


    `selinux_compat_net` — 设置网络控制。


    ## Synopsis


    `selinux_compat_net=[0|`1]`


    设置网络控制。`0` 使用新模型，`1` 使用旧留模型。该值可以在运行时通过 `/selinux/enforce` 文件进行更改。


    # 网络选项


    这些选项控制低级方面。


    ## Name


    `netdev` — 设置网络设备。


    ## Synopsis


    `netdev=[irq`][`io`][`mem_start`][`mem_end`][`name`]


    指定特定的网络参数。


    ## Name


    `rhash_entries` — 设置哈桶数量。


    ## Synopsis


    `rhash_entries=`n`


    此选项覆盖内核的哈桶数量。


    ## Name


    `shapers` — 设置整形器数量。


    ## Synopsis


    `shapers=`n`


    设置内核可以使用的最大整形器数量。


    ## Name


    `thash_entries` — 设置 TCP 哈桶数量。


    ## Synopsis


    `thash_entries=`n`


    此选项覆盖内核的哈桶数量。


    # NFS 选项


    这些选项控制网络文件启动。


    ## Name


    `lockd.nlm_grace_period` — 为锁管理器分配宽限。


    ## Synopsis


    `lockd.nlm_grace_period=`n`


    设置 NFS 锁管理器宽限。`n` 以秒为单位。


    ## Name


    `lockd.nlm_tcpport` — 为锁管理器分配 TCP 端口。


    ## Synopsis


    `lockd.nlm_tcpport=`port`


    设置锁管理器使用的 TCP 端口。`port` 必须是有效的 TCP 端口值。


    ## Name


    `lockd.nlm_timeout` — 为锁管理器分配新的超时值。


    ## Synopsis


    `lockd.nlm_timeout=`n`


    覆盖锁管理器的默认时间。`n` 以秒为单位。如果未指定此选项，将使用默认的 10 秒。


    ## Name


    `lockd.nlm_udpport` — 为锁管理器分配 UDP 端口。


    ## Synopsis


    `lockd.nlm_udpport=`port`


    设置锁管理器使用的 UDP 端口。`port` 必须是有效的 UDP 端口值。


    ## Name


    `nfsroot` — 指定 NFS 根文件系统。


    ## Synopsis


    `nfsroot=[server-ip` `:`]`root-dir`[,`nfs-options]`


    为无盘节点设置 NFS 根文件系统，以便其通过 NFS 启动。如果未设置此参数，将使用 `/tftpboot/``client_ip_address`` 作为根文件系统并使用默认的
    NFS 选项。


    '
- fmt: '

    ## Name


    `nfs.callback_tcpport` — Set the NFSv4 TCP port for the callback channel.


    ## Synopsis


    `nfs.callback_tcpport=`port`


    Specify the TCP port that the NFSv4 callback channel should listen on. `port`
    must be a valid TCP port value.


    ## Name


    `nfs.idmap_cache_timeout` — Set the maximum lifetime for idmapper cache entries.


    ## Synopsis


    `nfs.idmap_cache_timeout=`n`


    Specify the maximum lifetime for idmapper cache entries. `n` is measured in seconds.


    # Hardware specific options


    These options specify different parameters, depending on the hardware present
    in the system.


    ## Name


    `nousb` — Disable the USB subsystem.


    If this option is present, the USB subsystem will not be initialized.


    ## Name


    `lp` — Parallel port and its mode.


    ## Synopsis


    `lp=[0`|`port`[,`port`...]|`reset`|`auto]`


    Specify the parallel port to use. The `lp=port1,port2...` format associates a
    sequence of parallel ports to devices, starting with `lp0`. An example is `lp=none,parport0`,
    which would suppress configuration of the `lp0` device and cause the `lp1` device
    to use the first parallel port.


    `lp=0` disables the printer driver.


    `lp=reset` causes the attached printers to be reset. This option can be combined
    with the port specifications.


    `lp=auto` causes the kernel to examine the device ID from each port to determine
    whether a IEEE 1284-compatible printer is attached. If so, the kernel will manage
    that printer.


    ## Name


    `parport` — Specify the parallel port parameters.


    ## Synopsis


    `parport=[setting`[,`setting`...]


    Specify specific settings for parallel port drivers. Parallel ports are assigned
    in the order they are specified on the command line, starting with `parport0`.


    `auto` forces the driver to use any IRQ/DMA settings detected (the default is
    to ignore detected IRQ/DMA settings because of possible conflicts). You can also
    specify the base address, IRQ, and DMA settings in the format `0xnnnn`[,`irq`[,`dma`]].
    `irq` and `DMA` can be numbers, `auto` to use detected settings on that particular
    port, or `nofifo` to avoid using a FIFO even if it is detected.


    ## Name


    `parport_init_mode` — Parallel port initialization mode.


    ## Synopsis


    `parport_init_mode=[spp`|`ps2`|`epp`|`ecp`|`ecpepp]`


    Specifies the mode that the parallel port should be operated in. This is necessary
    on the Pegasos computer where the firmware has no options for setting up the parallel
    port mode. This option works for parallel port chips of type 686a and 8231.


    ## Name


    `nr_uarts` — Maximum number of UARTs to be registered.


    ## Synopsis


    `nr_uarts=`n`


    Specifies the maximum number of different UARTs that can be registered in the
    kernel.


    # Timer specific options


    These options override default kernel behavior to fix problems with certain chips.


    ## Name


    `enable_timer_pin_1` — Enable pin 1 of the APIC timer.


    Enable pin 1 of the APIC timer. This option can be useful to work around chipset
    bugs (on some ATI chipsets in particular.) The kernel tries to set a reasonable
    default, but sometimes this option is necessary to override it.


    ## Name


    `disable_timer_pin_1` — Disable pin 1 of the APIC timer.


    Disable pin 1 of the APIC timer. Useful for the same reasons as `enable_timer_pin_1`.


    ## Name


    `enable_8254_timer` — Enable interrupt 0 timer routing over the 8254 chip.


    Enable interrupt 0 timer routing over the 8254 chip in addition to routing over
    the IO-APIC. The kernel tries to set a reasonable default but sometimes this option
    is necessary to override it.


    ## Name


    `disable_8254_timer` — Disable interrupt 0 timer routing over the 8254 chip.


    Disable interrupt 0 timer routing over the 8254 chip in addition to routing over
    the IO-APIC. The kernel tries to set a reasonable default but sometimes this option
    is necessary to override it.


    ## Name


    `hpet` — Disable HPET and use PIT instead.


    ## Synopsis


    `hpet=disable`


    Disable the HPET timer source and tell the kernel to use the PIT timer source
    instead.


    ## Name


    `clocksource` — Set the specific clocksource.


    ## Synopsis


    `clocksource=[hpet`|`pit`|`tsc`|`acpi_pm`|`cyclone`|`scx200_hrt]`


    Override the default kernel clocksource and use the clocksource with the specified
    name instead.


    # Miscellaneous options


    These options should always be available, and don''t depend on any specific subsystem
    or hardware being present in the system in order to work properly.


    ## Name


    `dhash_entries` — Set the number of dentry hash buckets.


    ## Synopsis


    `dhash_entries=`n`


    This option lets you override the default number of hash buckets for the kernel''s
    dentry cache. Recommended only for kernel experts.


    ## Name


    `elevator` — Set the default I/O scheduler elevator.


    ## Synopsis


    `elevator=[anticipatory`|`cfq`|`deadline`|`noop]`


    Specify the I/O scheduler. See [IOSCHulers](#index_split13.html_filepos5762) for
    a list of the different schedulers, and what they do.


    ## Name


    `hashdist` — Distribute large hashes across NUMA nodes.


    ## Synopsis


    `hashdist=[0`|`1]`


    Large hashes that are allocated during the boot process are, by default, distributed
    across NUMA nodes. This option lets the user turn this on or off.


    ## Name


    `combined_mode` — Specify IDE usage.


    ## Synopsis


    `combined_mode=[ide`|`libata]`


    Control which driver uses the ports. Note that using ide or libata may affect
    your device naming (e.g., `hdc`).


    ## Name


    `max_loop` — Maximum number of loopback devices.


    ## Synopsis


    `max_loop=`n`


    Specify the maximum number of loopback devices that can be mounted at the same
    time. `n` is an integer from 1 to 256.


    ## Name


    `panic` — Time to wait after panic before rebooting.


    ## Synopsis


    `panic=`n`


    Specify the ammount of time in seconds that the kernel should wait after panic.
    If this is set to `0` (the default value) the kernel will not reboot after panicking;
    it will simply halt.


    ## Name


    `pause_on_oops` — Delay between kernel oopses.


    ## Synopsis


    `pause_on_oops=`n`


    Tell the kernel to halt all CPUs after the first oops for `n` seconds before continuing.
    This is useful if oopses keep scrolling off the screen before you can write them
    down or take a picture of them.


    ## Name


    `profile` — Control the kernel profiling.


    ## Synopsis


    `profile=[schedule,n]`


    This affects how the profiler is calculated. If `schedule` is specified, the schedule
    points are affected by the value set in `n`. If `schedule` is not specified, `n`
    is the step size as a power of two for statistical time-based profiling in the
    kernel.


    The most common use of this option is `profile=2`


    # Chapter 10. Kernel build command line reference


    As discussed in [Chapter 4](#index_split_027.html_filepos18695), the tool that
    ties together kernel builds is the *make* program, to which you pass a target
    that specifies what you want to build. [Chapter 4](#index_split_027.html_filepos18695)
    went over the basic targets needed to build the kernel, but the kernel build system
    also has a wide range of other targets. This chapter details these targets, and
    what they can be used for.


    All of these targets are passed to the make* program on the command line, and
    a number of them can be grouped together if desired. For example:


    ```

    make mrproper xconfig

    ```


    The targets are broken down into different types in the following sections.


    You can get a summary of most of these targets by running, within the build directory:


    ```bash

    make help

    ```


    This target prints out a lot of the common make* targets that are described in
    the rest of this chapter.


    # Informational Targets


    These targets print the kernel version, based on a number of different options.
    They are commonly used by scripts to determine the version of the kernel being
    built.


    Table 10-1. Informational targets


    | Target | Description |

    | --- | --- |

