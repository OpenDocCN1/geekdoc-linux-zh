    ## Wireless


    Wireless networking is very popular, with almost all modern laptops having a built-in
    wireless network device. Linux supports a wide range of wireless drivers, with
    more being added every week. To determine whether you have a PCI wireless device
    on the system, and what type it is, run the following command:


    `$` **`/usr/sbin/lspci | grep -i wireless`**


    `06:05.0 Network controller: Intel Corporation PRO/Wireless 2915ABG MiniPCI Adapter
    (rev 05)`


    Note that your response will probably not be identical; what is important is that
    the command shows some PCI Wireless devices.


    To enable wireless support in Linux, the IEEE 802.11 network configuration option
    must be enabled (802.11 is the number of the wireless specification that all these
    devices follow.)


    `Networking`


    `    [*] Networking support`


    `    [*]   Generic IEEE 802.11 Networking Stack`


    Also enable the different 802.11 protocol options, and the "Software MAC" option
    to provide full support for all different types of wireless devices in Linux:


    `Networking`


    `    [*] Networking support`


    `    [*]   Generic IEEE 802.11 Networking Stack`


    `    [*]     IEEE 802.11 WEP encryption (802.1x)`


    `    [M]     IEEE 802.11i CCMP support`


    `    [M]     IEEE 802.11i TKIP encryption`


    `    [M]     Software MAC add-on to the IEEE 802.11 networking stack`


    Support for the different PCI types of wireless network devices is found under
    the Network driver section of the configuration:


    `Device Drivers`


    `    Network device support`


    `        Wireless LAN (non-hamradio)`


    `            [*] Wireless LAN drivers (non-hamradio) & Wireless Extensions`


    `            [*]   Wireless Extension API over RtNetlink`


    There is a wide range of different PCI drivers in this section. Select the proper
    one depending on the device you have.


    The USB wireless networking device drivers are in a different section of the configuration:


    `Device Drivers`


    `    USB Support`


    `        USB Network Adapters`


    # Filesystems


    Linux supports a wide range of traditional file system types and a number of different
    types of filesystems (volume managers, clustered filesystems, etc.). The traditional
    file system types (normal or journaled) can be selected from the main File System
    configuration menu:


    `File systems`


    `    [*] Second extended fs support`


    `    [*] Ext3 journalling file system support`


    `    [ ] Reiserfs support`


    `    [ ] JFS filesystem support`


    `    [ ] XFS filesystem support`


    This section will show a few of the non-traditional file system types that Linux
    supports, and how to enable them.


    ## RAID


    RAID offers the option of combining numerous disks together so that they look
    like one logical disk. This can help in providing ways of providing redundancy,
    or speed by spreading the data across different disk platters. Linux supports
    both hardware and software RAID. Hardware RAID is handled by the disk controller,
    without any help needed from the kernel.


    Software RAID is controlled by the kernel, and can be selected as a build option:


    `Device Drivers`


    `    Multi-device support (RAID and LVM)`


    `        [*] Multiple devices driver support (RAID and LVM)`


    `        [*]   RAID support`


    There are many different types of RAID configurations. At least one needs to be
    selected in order for RAID to work properly:


    `Device Drivers`


    `    Multi-device support (RAID and LVM)`


    `        [*] Multiple devices driver support (RAID and LVM)`


    `        [*]   RAID support`


    `        [*]     Linear (append) mode`


    `        [*]     RAID-0 (striping) mode`


    `        [*]     RAID-1 (mirroring) mode`


    `        [*]     RAID-10 (mirrored striping) mode (EXPERIMENTAL)`


    `        [*]     RAID-4/RAID-5 mode`


    `        [*]     RAID-6 mode`


    ## Logical Volume Manager and Device Mapper


    Much like RAID, LVM (Logical Volume Manager) allows the user to combine different
    block devices to look like one logical device. However it does not work on a device
    level like RAID, but through a block and sector mapping mechanism. It allows different
    portions of different disks to be combined together to look like one large block
    device to the user. To do this, the kernel uses something called Device Mapper
    (DM).


    To enable Device Mapper support in the kernel:


    `Device Drivers`


    `    Multi-device support (RAID and LVM)`


    `        [*] Multiple devices driver support (RAID and LVM)`


    `        [*]   Device mapper support`


    There are a number of helper modules that work with Device Mapper to provide additional
    functionality. You should enable them if you wish to encrypt your devices, or
    allow snapshot functionality:


    `Device Drivers`


    `    Multi-device support (RAID and LVM)`


    `        [*] Multiple devices driver support (RAID and LVM)`


    `        [*]   Device mapper support`


    `        [*]     Crypt target support`


    `        [*]     Snapshot target (EXPERIMENTAL)`


    `        [*]     Mirror target (EXPERIMENTAL)`


    `        [*]     Zero target (EXPERIMENTAL)`


    `        [*]     Multipath target (EXPERIMENTAL)`


    ## Filesharing with Windows


    Samba is a program that allows Linux users to access Windows machines natively
    across the network, providing a way to share drives and devices in a transparent
    manner. It also allows Linux to work as a Windows server, allowing Windows clients
    to connect to it thinking that it is a real Windows machine.


    Two different filesystems that allow a Linux machine to connect with a Windows
    machine: the SMB filesystem and the CIFS filesystem. For the ability to connect
    to older Windows for Workgroups or Windows 95 or 98 machines, select the SMB filesystem:


    `File systems`


    `    Network File Systems`


    `        [*] SMB file system support (to mount Windows shares etc.)`


    For the ability to connect to newer Windows machines, the CIFS filesystem is recommended
    instead:


    `File systems`


    `    Network File Systems`


    `        [*] CIFS support`


    For more details on the differences between these two filesystems, and when one
    should be used instead of the other, please see [SMB_FS](#index_split_749.html_filepos729816)
    and [CIFS](#index_split_751.html_filepos731483).


    ## OCFS2


    OCFS2 is a cluster filesystem from Oracle that works for large network installations
    and small local systems at the same time. This filesystem is recommended when
    using large databases, such as Oracle or DB2, because it can be moved over time
    to different backing disks across the network quite easily as more storage is
    needed.


    To enable the filesystem:


    `File systems`


    `    [*] OCFS2 file system support`


    # Security'
