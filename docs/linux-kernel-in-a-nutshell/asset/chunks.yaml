    # # IEEE 1394 (FireWire)


    IEEE 1394 is commonly known by the name FireWire, the name by which Apple Computer
    publicized it. IEEE 1394 is a high-speed bus that connects external devices, much
    as USB does.


    To determine whether your machine has a FireWire controller, and which type is
    is, run the following command:


    ```

    $ /usr/sbin/lspci | grep FireWire

    ```


    `06:0c.0 FireWire (IEEE 1394): Texas Instruments TSB43AB22/A IEEE-1394a-2000 Controller
    (PHY/Link)`

    `06:0d.2 FireWire (IEEE 1394): Creative Labs SB Audigy FireWire Port (rev 04)`


    Note that your response will probably not be identical; what is important is that
    the command shows some FireWire controllers.


    Enable PCI support for the kernel:


    `Bus options (PCI, PCMCIA, EISA, MCA, ISA)`

    `    [*] PCI Support`


    Enable IEEE 1394 support for the kernel:


    `Device Drivers`

    `    IEEE 1394 (FireWire) support`

    `        [*] IEEE 1394 (FireWire) support`


    Enable the specific type of Firewire host controller you have:


