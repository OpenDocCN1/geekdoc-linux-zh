  trans: "\n\n蓝牙有两种主要的协议选择。为了与所有类型的蓝牙设备配合，这两者都应该启用：\n\n```\nNetworking\n    [*] Networking\
    \ support\n        --- Bluetooth subsystem support\n        [*]   L2CAP protocol\
    \ support\n        [*]   SCO links support\n```\n\n可用的单个蓝牙设备驱动程序较少，因为几乎所有这些设备都遵循详细说明设备运行方式的蓝牙规范。必须选择列表中标记的驱动程序，蓝牙才能与设备正常工作：\n\
    \n```\nNetworking\n    [*] Networking support\n        --- Bluetooth subsystem\
    \ support\n            Bluetooth device drivers\n              [M] HCI USB driver\n\
    \              [*]   SCO (voice) support\n              [ ] HCI UART driver\n\
    \              [M] HCI BCM203x USB driver\n              [M] HCI BPA10x USB driver\n\
    \              [ ] HCI BlueFRITZ! USB driver\n              [ ] HCI DTL1 (PC Card)\
    \ driver\n              [ ] HCI BT3C (PC Card) driver\n              [ ] HCI BlueCard\
    \ (PC Card) driver\n              [ ] HCI UART (PC Card) device driver\n     \
    \         [ ] HCI VHCI (Virtual HCI device) driver\n```\n\n## 无线 (Wireless)\n\n\
    无线网络非常流行，几乎所有现代笔记本电脑都内置了无线网络设备。Linux 支持广泛的无线驱动程序，每周都会添加新的驱动。要确定系统中是否存在 PCI 无线设备以及它是什么类型，请运行以下命令：\n\
    \n```bash\n$ /usr/sbin/lspci | grep -i wireless\n```\n\n```\n06:05.0 Network controller:\
    \ Intel Corporation PRO/Wireless 2915ABG MiniPCI Adapter (rev 05)\n```\n\n请注意，你的响应可能与上述不相同；重要的是该命令显示了某些\
    \ PCI 无线设备。\n\n要在 Linux 中启用无线支持，必须启用 IEEE 802.11 网络配置选项（802.11 是所有这些设备遵循的无线规范编号）。\n\
    \n```\nNetworking\n    [*] Networking support\n    [*]   Generic IEEE 802.11 Networking\
    \ Stack\n```\n\n同时，启用不同的 802.11 协议选项以及“Software MAC”选项，以为 Linux 中的所有不同类型的无线设备提供完整支持：\n\
    \n```\nNetworking\n    [*] Networking support\n    [*]   Generic IEEE 802.11 Networking\
    \ Stack\n    [*]   IEEE 802.11 WEP encryption (802.1x)\n    [M]    IEEE 802.11i\
    \ CCMP support\n    [M]    IEEE 802.11i TKIP encryption\n    [M]    Software MAC\
    \ add-on to the IEEE 802.11 networking stack\n```\n\n不同 PCI 类型的无线网络设备支持可以在配置的网络驱动程序（Network\
    \ driver）部分找到：\n\n```\nDevice Drivers\n    Network device support\n        Wireless\
    \ LAN (non-hamradio)\n            [*] Wireless LAN drivers (non-hamradio) & Wireless\
    \ Extensions\n            [*]   Wireless Extension API over RtNetlink\n```\n\n\
    此部分包含许多不同的 PCI 驱动程序。请根据你的设备选择正确的程序。\n\nUSB 无线网络设备驱动程序位于配置的另一个部分：\n\n```\nDevice\
    \ Drivers\n    USB Support\n    Network Adapters\n```\n\n## 文件系统 (Filesystems)\n\
    \nLinux 支持广泛的传统文件系统以及不同类型的文件系统（卷管理器、集群文件系统等）。传统的文件系统类型（普通或日志记录）可以从主文件系统（File System）配置中选择：\n\
    \n```\nFile systems\n    [*] Second fs support\n    [*] Ext3 journalling file\
    \ support\n    [ ] Reiserfs support\n    [ ] JFS support\n    [ ] XFS support\n\
    ```\n\n此部分将显示 Linux 支持的几种非传统文件类型，以及如何启用它们。\n\n## RAID\n\nRAID 提供了将许多磁盘组合在一起使其看起来像一块磁盘的选项。这可以通过将数据分布在不同的盘片上来帮助提供冗余或速度。Linux\
    \ 同时支持硬件 RAID 和软件 RAID。硬件 RAID 由磁盘控制器处理，不需要内核的帮助。\n\n软件 RAID 由内核控制，并作为构建选项选择：\n\
    \n```\nDevice Drivers\n    Multi-device support (RAID and LVM)\n    [*]   Multiple\
    \ devices driver support (RAID and LVM)\n    [*]   RAID support\n```\n\n有许多不同类型的\
    \ RAID 配置。为了让 RAID 工作，至少需要选择其中一种：\n\n```\nDevice Drivers\n    Multi-device support\
    \ (RAID and LVM)\n    [*]   Multiple devices driver support (RAID and LVM)\n \
    \   [*]   RAID support\n    [*]   Linear (append) mode\n    [*]   RAID-0 (striping)\
    \ mode\n    [*]   RAID-1 (mirroring) mode\n    [*]   RAID-10 (mirrored striping)\
    \ mode (EXPERIMENTAL)\n    [*]   RAID-4/RAID-5 mode\n    [*]   RAID-6 mode\n```\n\
    \n## 逻辑卷管理器与设备映射 (Logical Volume Manager and Device Mapper)\n\n与 RAID ，LVM（逻辑卷管理器）允许用户将不同的块设备组合成一个逻辑设备。然而，它不像\
    \ RAID 那样在设备级别工作，而是通过块和扇区的映射机制工作。它允许将不同磁盘的部分组合在一起，对用户来说是一个块设备。为了实现这一点，内核使用了所谓的\
    \ `DM`。\n\n要在内核中启用 Device Mapper 支持：\n\n```\nDevice Drivers\n    Multi-device\
    \ support (RAID and LVM)\n    [*]   Multiple devices driver support (RAID and\
    \ LVM)\n    [*]   Device mapper support\n```\n\n有许多辅助模块与 Device Mapper 配合以提供额外功能。如果你希望加密设备或允许快照功能，应该启用它们：\n\
    \n```\nDevice Drivers\n    Multi-device support (RAID and LVM)\n    [*]   Multiple\
    \ devices driver support (RAID and LVM)\n    [*]   Device mapper support\n   \
    \ [*]   Crypt target support\n    [*]   Snapshot target (EXPERIMENTAL)\n    [*]\
    \   Mirror target (EXPERIMENTAL)\n    [*]   Zero target (EXPERIMENTAL)\n    [*]\
    \   Multipath target (EXPERIMENTAL)\n```\n\n## 与 Windows 文件共享 (Filesharing with\
    \ Windows)\n\nSamba 是一种允许 Linux 用户通过网络原生访问 Windows 机器程序，提供了一种透明共享驱动器和设备的方法。它允许\
    \ Linux 作为 Windows 服务器工作，让 Windows 客户端连接时认为它是一个真实的 Windows 设备。\n\n有两种不同的文件系统允许\
    \ Linux 与 Windows 连接：SMB 文件系统和 CIFS 文件系统。对于连接旧的 Windows 工作组或 Windows 95 或 98 设备，请选择\
    \ SMB 文件系统：\n\n```\nFile systems\n    Network File Systems\n    [*] SMB file system\
    \ support (to mount Windows shares etc.)\n```\n\n对于连接较新的 Windows 设备，建议使用 CIFS\
    \ 文件系统：\n\n```\nFile systems\n    Network File Systems\n    [*] CIFS support\n\
    ```\n\n## OCFS2\n\nOCFS2 是 Oracle 的一种集群文件系统，同时适用于大型网络安装和小型本地系统。当在使用大型数据库（如 Oracle\
    \ 或 DB2）时，推荐使用此文件系统，因为随着存储需求的增加，可以很方便地将其移动到网络中不同的底层磁盘上。\n\n启用该文件系统：\n\n```\nFile\
    \ systems\n    [*] OCFS2 file system support\n```\n\n"
