    \n7. 在内核配置系统中搜索该配置值，并跳转到菜单中指定的 location，以启用该驱动程序的构建。\n\n## USB 设备\n\n为 USB 设备查找特定的驱动程序与上一节描述的查找\
    \ PCI 设备驱动程序非常相似，仅在查找总线 ID 值方面略有不同。\n\n在本示例中，让我们找到 USB 无线设备所需的驱动程序。与 PCI 设备示例一样，本示例中的细节将与你的情况不同，但涉及的步骤对于任何你想要查找可用驱动程序的\
    \ USB 设备类型都是相关的。\n\n与 PCI 设备一样，必须找到你想要查找驱动程序的 USB 设备的总线 ID。要做到这一点，你可以使用 `usbutils`\
    \ 包提供的 `lsusb` 程序。\n\n`lsusb` 程序显示所有连接到系统的 USB 设备。由于你不知道正在寻找的特定设备名称，请从查看所有设备开始：\n\
    \n```\n/usr/sbin/lsusb\n```\nBus 002 Device 003: ID 045e:0023 Microsoft Corp.\
    \ Trackball Optical\nBus 002 Device 001: ID 0000:0000  \nBus 005 Device 003: ID\
    \ 0409:0058 NEC Corp. HighSpeed Hub\nBus 005 Device 001: ID 0000:0000  \nBus 004\
