  trans: '

    如果你打算将你的 Linux 设备作为没有全局有效 IP 地址的本地机器网络的 Internet 网关，那么你也应该在此处选择 yes。这被称为 `masquerading`（地址伪装）。如果本地网络上的某台计算机想要向外部发送内容，你的设备可以“伪装”那台计算机，即它将流量转发到预期的外部目标，但会修改数据包使其看起来像是来自防火墙设备本身。伪装是双向的：如果外部主机进行回复，Linux
    设备将静地将流量转发给正确的本地计算机。通过这种方式，本地局域网上的计算机对外部世界是完全不可见的，尽管它们可以访问外部并接收回复。甚至可以使用一种名为端口转发（port
    forwarding）的机制，在伪装的本地网络内部运行全局可见的服务器。伪装通常也被称为 `NAT`（网络地址转换）。其他操作系统通常将此术称为 `PAT`（端口地址转换）。


    `Netfilter` 的另一个用途是透明代理：如果本地网络上的机器尝试连接到外部主机，你的 Linux 设备可以透明地将流量转发到本地服务器（通常是缓存代理服务器）。


    `Netfilter` 的另一个用途是构建桥接防火墙。使用启用网络包过滤的桥接器可以让 `iptables` “看到”桥接流量。对于对底层网络和跨桥接的以太网协议进行过滤，请使用
    `ebtables`（位于桥接 Netfilter 配置下）。


    存在多个 `Netfilter` 模块，它们替换了之前的伪装（`ipmasqadm`）、包过滤（`ipchains`）、透明代理和端口转发机制。请查看 `iptables`
    下的 `Documentation/Changes` 以获取这些包的位置。


    如果你编译一个将作为路由器运行的内核，可能在此处选 yes；对于普通主机则选 no。


    ## 名称: NET_SCHED — QoS 和/或公平队列


    当内核有多个数据包要通过网络设备发送时，必须决定先发送哪些、延迟哪些以及丢弃哪些。这是队列规范的任务。目前已经提出了几种如何“公平”地执行此操作算法。


    如果你在此处选 no，你将获得标准的包调度器，它是一个 `FIFO`（先来先行）调度器。如果你在此处选 yes，你将从几个备选算法中选择，这些算法可以附加到不同的网络设备上。这非常有用，例如，如果你的某些网络设备是需要特定最小数据流速率的实时设备，如果你需要限制匹配指定标准流量的最大数据流速率。


    要管理这些调度器，你需要来自 `iproute2+tc` 软件包的用户级工具，地址位于 [`linux-net.osdl.org/index.php/Iproute2`](http://linux-net.osdl.org/index.php/Iproute2)。


    如果你也对相应的选项选 yes，那么此服务质量（QoS）支持将允许你在 Linux 路由器上使用差异服务（`diffserv`）和资源预留协议（RSVP`）。文档和软件位于
    [`diffserv.sourceforge.net`](http://diffserv.sourceforge.net)。


    ## 名称: IRDA — IrDA（红外）子系统支持


    如果你想构建对 `IrDA` 协议的支持，请在此处选 yes。红外数据协会规定了无线红外通信的标准，大多数笔记本电脑和 PDA 都支持它。


    要使用 Linux 对 `IrDA` 协议的支持，你还需要一些用户空间工具，如 `irattach`。更多信息请参阅文件 `Documentation/networking/irda.txt`。你还想阅读
    IR-HOWTO，地址位于 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)。


    如果你想与 PDA 交换数据位（`vCal`、`vCard`），你需要安装一个 OBEX 应用，例如来自 [`sourceforge.net/projects/openobex`](http://sourceforge.net/projects/openobex)
    的 OpenObex。


    ## 名称: IRLAN — IrLAN 协议


    如果你想构建对 `IrLAN` 协议的支持，请在此处选 yes。`IrLAN` 仿真以太网，可以使用红外线建立无线局域网。


    `IrLAN` 协议可以与红外接入点（如 HP NetbeamIR 或 ESI JetEye NET）通信。你也可以连接到运行 `IrLAN` 协议的另一
    Linux 以进行自联网。


    ## 名称: IRNET — IrNET 协议


    如果你想构建对 `IrNET` 协议的支持，请在此处选 yes。`IrNET` 是 PPP 驱动程序，因此你还需要一个工作的 PPP 子系统（驱动程序、守护进程和配置）。


    `IrNET` 是通过 `IrDA` 传输 TCP/IP 流量的替代方法。它在一组点对 `IrDA` socket 上使用同步 PPP。你可以在 Linux
    机器之间或与 Windows 一起使用它。


    ## 名称: IRCOMM — IrCOMM 协议


    如果你想构建对 `IrCOMM` 协议的支持，请在此处选 yes。`IrCOMM` 实现串口仿真，并允许所有理解 `ttys` 的现有应用程序通过红外链路。因此，你应该能够使用如
    `PPP` 和 `minicom` 等应用程序。


    ## 名称: IRDA_ULTRA — Ultra（无连接）协议


    在此处选 yes 支持无连接的 Ultra IRDA 协议。`Ultra` 允许通过非常简单的设备（手表、信标）交换数据，而没有 `IrDA` 协议的开销（无握手、无管理帧、简单的固定头）。`Ultra`
    作为特殊 socket 提供：

    ```

    socket(AF_IRDA, SOCK_DGRAM, 1);

    ```


    ## 名称: BT — 蓝牙子系统支持


    蓝牙是一种低成本、低功耗、短距离无线技术。它被设计为电缆和其他短距离技术（如 `IrDA`）的替代品。蓝牙的工作范围通常延伸到 10 米。关于蓝牙的更多信息可以在
    [`www.bluetooth.com`](http://www.bluetooth.com)找到。


    Linux 蓝牙子系统由几层组成：


    蓝牙核心 > HCI 设备和连接管理器

    HCI 设备驱动 > 硬件接口

    SCO 模块 > SCO 音频

    L2CAP 模块 > 逻辑链路控制和适配协议

    RFCOMM 模块 > RFCOMM 协议

    BNEP 模块 > 蓝牙网络封装协议

    CMTP 模块 > CAPI 消息传输协议

    HIDP 模块 > 人机接口设备协议


    要使用蓝牙子系统，你需要几个用户空间工具，如 `hciconfig` 和 `hcid`。这些工具和蓝牙内核模块的更新由 [`www.bluez.org`](http://www.bluez.org)。


    ## 名称: IEEE80211 — 通用 IEEE 80211 网络栈


    此选项启用了硬件无关的 IEEE 802.11 网络栈。


    ## 名称: MTD — 存储技术设备 (MTD) 支持


    存储技术设备是闪存、RAM 和类似的芯片，通常用于嵌入式设备上的固态文件系统。此选项提供了通用支持，允许 MTD 驱动程序向内核注册，并允许潜在 MTD 设备的用户枚举存在的设备并获取句柄。它还允许你为特定的硬件和
    MTD 用户选择单独的驱动程序。


    ## 名称: PARPORT — 并行端口支持


    如果你想使用连接到计算机并行端口（25 个孔的连接器）的设备，例如打印机、ZIP 驱动器或并行线路网络协议 (PLIP)，你需要在此处选 yes。


    更多信息请阅读 `Documentation/parport.txt` 和 `drivers/parport/BUGS-parport`。关于连接并行端口的许多驱动程序的详细信息，请参见
    [`www.torque.net/linux-pp.html`](http://www.torque.net/linux-pp.html)。


    '
- fmt: "\nIt is possible to share a single parallel port among several devices and\
    \ it is safe to compile all the corresponding drivers into the kernel. If you\
    \ have more than one parallel port and want to specify which port and IRQ will\
    \ be used by this driver at module load time, take a look at `Documentation/parport.txt`.\n\
    \n# PNP — Plug and Play support\n\nPlug and Play (PnP) is a standard for peripherals\
    \ that allows them to be configured by software, e.g. to assign IRQs or other\
    \ parameters. No jumpers on the cards are needed; instead, the values are provided\
    \ to the cards from the BIOS, from the operating system, or using a user-space\
    \ utility.\n\nSay yes here if you would like Linux to configure your Plug and\
    \ Play devices. You should then also say yes to all of the protocols needed. Alternatively,\
    \ you can say no here and configure your Plug and Play devices using user space\
    \ utilities such as the `isapnptools` package. \n\n# ISAPNP — ISA Plug and Play\
    \ support\n\nSay yes here if you would like support for ISA Plug and Play devices.\
    \ Some information is available in `Documentation/isapnp.txt`.\n\nIf you use have\
    \ ISA Plug and Play devices, please use the ISA PnP tools found at [http://www.roestock.demon.co.uk/isapnptools](http://www.roestock.demon.co.uk/isapnptools)\
    \ to configure them properly.\n\n# PNPBIOS — Plug and Play BIOS support (experimental)\n\
    \nLinux uses the PNPBIOS defined in \"Plug and Play BIOS Specification Version\
    \ 1.0A May 5, 1994\" to autodetect built-in mainboard resources (e.g. parallel\
    \ port resources).\n\nIf you would like the kernel to detect and allocate resources\
    \ to your mainboard devices (on some systems they are disabled by the BIOS) say\
    \ yes here. The PNPBIOS can also help prevent resource conflicts between mainboard\
    \ devices and other bus devices.\n\nACPI is expected to supersede PNPBIOS some\
    \ day. Currently they co-exist nicely. If you have a non-ISA system that supports\
    \ ACPI, you probably don't need PNPBIOS support.\n\n# IDE — ATA/ATAPI/MFM/RLL\
    \ support\n\nIf you say yes here, your kernel will be able to manage low cost\
    \ mass storage units such as ATA/(E)IDE and ATAPI units. The most common such\
    \ devices are IDE hard drives and ATAPI CD-ROM drives.\n\nIf your system is pure\
    \ SCSI and doesn't use these interfaces, you can say no here.\n\nIntegrated Disk\
    \ Electronics (IDE, also known as ATA-1) is a connecting standard for mass storage\
    \ units such as hard disks. It was designed by Western Digital and Compaq Computer\
    \ in 1984. It was then named ST506. Quite a number of disks use the IDE interface.\n\
    \nAT Attachment (ATA) is the superset of the IDE specifications. ST506. is also\
    \ called ATA-1.\n\nFast-IDE is ATA-2 (also named Fast ATA).\n\nEnhanced IDE (EIDE)\
    \ is ATA-3. It provides support for larger disks (up to 8.4GB by means of the\
    \ LBA standard), more disks (4 instead of 2) and for other mass storage units\
    \ such as tapes and cdrom.\n\nUDMA/33 (also known as UltraDMA/33) is ATA-4. By\
    \ using fast DMA controllers, It provides faster transfer modes (with less load\
    \ on the CPU) than previous PIO (Programmed processor Input/Output) from previous\
    \ ATA/IDE standards.\n\nATA Packet Interface (ATAPI) is a protocol used by EIDE\
    \ tape and CD-ROM drives, similar in many respects to the SCSI protocol.\n\nSMART\
    \ IDE (self-monitoring, analysis, and reporting technology) was designed in order\
    \ to prevent data corruption and disk crashes by detecting pre hardware failure\
    \ conditions (heat, access time, and the like). Disks built after June 1995 may\
    \ follow this standard. The kernel itself doesn't manage this; however there are\
    \ quite a number of user programs such as `smart` that can query the status of\
    \ SMART parameters from disk drives.\n\nFor further information, please read `Documentation/ide.txt`.\n\
    \n# BLK_DEV_IDE — Enhanced IDE/MFM/RLL disk/cdrom/tape/floppy support\n\nIf you\
    \ say yes here, you will use the full-featured IDE driver to control up to ten\
    \ ATA/IDE interfaces, each one able to serve a \"master\" and a \"slave\" device,\
    \ for a total of up to twenty ATA/IDE disk/cdrom/tape/floppy drives.\n\nUseful\
    \ information about large (540 MB) IDE disks, multiple interfaces, what to do\
    \ if ATA/IDE devices are not automatically detected, sound card ATA/IDE ports,\
    \ module support, and other topics, is contained in `Documentation/ide.txt`. For\
    \ detailed information about hard drives, consult the Disk-HOWTO and the Multi-Disk-HOWTO,\
    \ available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).\n\
    \nTo fine-tune ATA/IDE drive/interface parameters for improved performance, look\
    \ for the `hdparm` package at [ftp://ibiblio.org/pub/Linux/system/hardware](ftp://ibiblio.org/pub/Linux/system/hardware).\n\
    \nDo not compile this driver as a module if your root file system (the one containing\
    \ the directory `/*`) is located on an IDE device.\n\nIf you have one or more\
    \ IDE drives, enable this option. If your system has no IDE drives, or if memory\
    \ requirements are really tight, you could say no here, and select the `Old hard\
    \ disk driver` option instead to save about 13 KB of memory in the kernel.\n\n\
    # BLK_DEV_IDEDISK — Include IDE/ATA-2 DISK support\n\nThis will include enhanced\
    \ support for MFM/RLL/IDE hard disks. If you have a MFM/RLL/IDE disk, and there\
    \ is no special reason to use the old hard disk driver instead, say yes. If you\
    \ have a SCSI-only system, you can say no here.\n\nDo not compile this driver\
    \ as a module if your root file system (the one containing the directory `/*`)\
    \ is located on the IDE disk.\n\n# BLK_DEV_IDECD — Include IDE/ATAPI CDROM support\n\
    \nIf you have a CD-ROM drive using the ATAPI protocol, say yes here. ATAPI is\
    \ a newer protocol used by IDE CD-ROM and TAPE drives, similar to the SCSI protocol.\
    \ Most new CD-ROM drives use ATAPI, including the NEC-260, Mitsumi FX400, Sony\
    \ 55E, and just about all non-SCSI double(2X) or better speed drives.\n\nIf you\
    \ say yes here, the CD-ROM drive will be identified at boot time along with other\
    \ IDE devices, as something as `hdb` or `hdc`. If this is your only CD-ROM drive,\
    \ you can say no to all other CD-ROM options, but be sure to also enable `ISO\
    \ 9660 CD-ROM file system support`. \n\nNote that older versions of LILO (LInux\
    \ LOader) cannot properly deal with IDE/ATAPI CD-ROMs, so install LILO 16 or higher,\
    \ available from [http://lilo.go.dyndns.org](http://lilo.go.dyndns.org).\n\n#\
    \ BLK_DEV_IDEFLOPPY — Include IDE/ATAPI FLOPPY support\n\nIf you have an IDE floppy\
    \ drive that uses the ATAPI protocol, answer yes. ATAPI is a newer protocol used\
    \ by IDE CD-ROM/tape/floppy drives, similar to the SCSI protocol.\n\nThe LS-120\
    \ and the IDE/ATAPI Iomega ZIP drive are also supported by this driver. For information\
    \ about jumper settings and the question of when a ZIP drive uses a partition\
    \ table, see [http://www.tueue.nl/~aeb/linux/zip/zip-1.html](http://www.tueue.nl/~aeb/linux/zip/zip-1.html).\
    \ (ATAPI PD-CD/CDR drives are not supported by this driver; support for PD-CD/CDR\
    \ drives is available if you answer yes to `SCSI emulation support`).\n\nIf you\
    \ say yes here, the FLOPPY drive will be identified along with other IDE devices,\
    \ with a name such as `hdb` or `hdc` (check the boot messages using the `mesg`\
    \ command).\n\n# SCSI — SCSI device support\n\nIf you want to use a SCSI hard\
    \ disk, SCSI tape drive, SCSI CD-ROM, or any other SCSI device under Linux, say\
    \ yes and make sure that you know the name of your SCSI host adapter (the card\
    \ inside your computer that \"speaks\" the SCSI protocol, also called SCSI controller),\
    \ because you will be asked for it.\n\nYou also need to say yes here if you have\
    \ a device that speaks the SCSI protocol. Examples of these include the parallel\
    \ port version of the IOMEGA ZIP drive, USB storage devices, Fibre Channel, FireWire\
    \ storage, and the IDE-SCSI emulation driver.\n\nDo not compile this as a module\
    \ if your root file system (the one containing the directory `/*`) is located\
    \ on a SCSI device.\n\n# BLK_DEV_SD — SCSI disk support\n"
  raw: 'It is possible to share a single parallel port among several devices and it
    is safe to compile all the corresponding drivers into the kernel. If you have
    more than one parallel port and want to specify which port and IRQ will be used
    by this driver at module load time, take a look at *Documentation/parport.txt*.


    ## Name


    PNP — Plug and Play support


    Plug and Play (PnP) is a standard for peripherals that allows them to be configured
    by software, e.g. to assign IRQs or other parameters. No jumpers on the cards
    are needed; instead, the values are provided to the cards from the BIOS, from
    the operating system, or using a user-space utility.


    Say yes here if you would like Linux to configure your Plug and Play devices.
    You should then also say yes to all of the protocols needed. Alternatively, you
    can say no here and configure your Plug and Play devices using user space utilities
    such as the *isapnptools* package.


    ## Name


    ISAPNP — ISA Plug and Play support


    Say yes here if you would like support for ISA Plug and Play devices. Some information
    is available in *Documentation/isapnp.txt*.


    If you use have ISA Plug and Play devices, please use the ISA PnP tools found
    at [http://www.roestock.demon.co.uk/isapnptools](http://www.roestock.demon.co.uk/isapnptools)
    to configure them properly.


    ## Name


    PNPBIOS — Plug and Play BIOS support (experimental)


    Linux uses the PNPBIOS defined in "Plug and Play BIOS Specification Version 1.0A
    May 5, 1994" to autodetect built-in mainboard resources (e.g., parallel port resources).


    If you would like the kernel to detect and allocate resources to your mainboard
    devices (on some systems they are disabled by the BIOS) say yes here. The PNPBIOS
    can also help prevent resource conflicts between mainboard devices and other bus
    devices.


    ACPI is expected to supersede PNPBIOS some day. Currently they co-exist nicely.
    If you have a non-ISA system that supports ACPI, you probably don''t need PNPBIOS
    support.


    ## Name


    IDE — ATA/ATAPI/MFM/RLL support


    If you say yes here, your kernel will be able to manage low cost mass storage
    units such as ATA/(E)IDE and ATAPI units. The most common such devices are IDE
    hard drives and ATAPI CD-ROM drives.


    If your system is pure SCSI and doesn''t use these interfaces, you can say no
    here.


    Integrated Disk Electronics (IDE, also known as ATA-1) is a connecting standard
    for mass storage units such as hard disks. It was designed by Western Digital
    and Compaq Computer in 1984\. It was then named ST506\. Quite a number of disks
    use the IDE interface.


    AT Attachment (ATA) is the superset of the IDE specifications. ST506 is also called
    ATA-1.


    Fast-IDE is ATA-2 (also named Fast ATA).


    Enhanced IDE (EIDE) is ATA-3\. It provides support for larger disks (up to 8.4GB
    by means of the LBA standard), more disks (4 instead of 2) and for other mass
    storage units such as tapes and cdrom.


    UDMA/33 (also known as UltraDMA/33) is ATA-4\. By using fast DMA controllers,
    It provides faster transfer modes (with less load on the CPU) than previous PIO
    (Programmed processor Input/Output) from previous ATA/IDE standards.


    ATA Packet Interface (ATAPI) is a protocol used by EIDE tape and CD-ROM drives,
    similar in many respects to the SCSI protocol.


    SMART IDE (self-monitoring, analysis, and reporting technology) was designed in
    order to prevent data corruption and disk crashes by detecting pre hardware failure
    conditions (heat, access time, and the like). Disks built after June 1995 may
    follow this standard. The kernel itself doesn''t manage this; however there are
    quite a number of user programs such as *smart* that can query the status of SMART
    parameters from disk drives.


    For further information, please read *Documentation/ide.txt*.


    ## Name


    BLK_DEV_IDE — Enhanced IDE/MFM/RLL disk/cdrom/tape/floppy support


    If you say yes here, you will use the full-featured IDE driver to control up to
    ten ATA/IDE interfaces, each one able to serve a "master" and a "slave" device,
    for a total of up to twenty ATA/IDE disk/cdrom/tape/floppy drives.


    Useful information about large (540 MB) IDE disks, multiple interfaces, what to
    do if ATA/IDE devices are not automatically detected, sound card ATA/IDE ports,
    module support, and other topics, is contained in *Documentation/ide.txt*. For
    detailed information about hard drives, consult the Disk-HOWTO and the Multi-Disk-HOWTO,
    available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).


    To fine-tune ATA/IDE drive/interface parameters for improved performance, look
    for the `hdparm` package at [ftp://ibiblio.org/pub/Linux/system/hardware](ftp://ibiblio.org/pub/Linux/system/hardware).


    Do not compile this driver as a module if your root file system (the one containing
    the directory */*) is located on an IDE device.


    If you have one or more IDE drives, enable this option. If your system has no
    IDE drives, or if memory requirements are really tight, you could say no here,
    and select the `Old hard disk driver` option instead to save about 13 KB of memory
    in the kernel.


    ## Name


    BLK_DEV_IDEDISK — Include IDE/ATA-2 DISK support


    This will include enhanced support for MFM/RLL/IDE hard disks. If you have a MFM/RLL/IDE
    disk, and there is no special reason to use the old hard disk driver instead,
    say yes. If you have an SCSI-only system, you can say no here.


    Do not compile this driver as a module if your root file system (the one containing
    the directory */*) is located on the IDE disk.


    ## Name


    BLK_DEV_IDECD — Include IDE/ATAPI CDROM support


    If you have a CD-ROM drive using the ATAPI protocol, say yes here. ATAPI is a
    newer protocol used by IDE CD-ROM and TAPE drives, similar to the SCSI protocol.
    Most new CD-ROM drives use ATAPI, including the NEC-260, Mitsumi FX400, Sony 55E,
    and just about all non-SCSI double(2X) or better speed drives.


    If you say yes here, the CD-ROM drive will be identified at boot time along with
    other IDE devices, as something such as `hdb` or `hdc` (check the boot messages
    using the *dmesg* command). If this is your only CD-ROM drive, you can say no
    to all other CD-ROM options, but be sure to also enable the `ISO 9660 CD-ROM file
    system support` option.


    Note that older versions of LILO (LInux LOader) cannot properly deal with IDE/ATAPI
    CD-ROMs, so install LILO 16 or higher, available from [http://lilo.go.dyndns.org](http://lilo.go.dyndns.org).


    ## Name


    BLK_DEV_IDEFLOPPY — Include IDE/ATAPI FLOPPY support


    If you have an IDE floppy drive that uses the ATAPI protocol, answer yes. ATAPI
    is a newer protocol used by IDE CD-ROM/tape/floppy drives, similar to the SCSI
    protocol.


    The LS-120 and the IDE/ATAPI Iomega ZIP drive are also supported by this driver.
    For information about jumper settings and the question of when a ZIP drive uses
    a partition table, see [http://www.win.tue.nl/~aeb/linux/zip/zip-1.html](http://www.win.tue.nl/~aeb/linux/zip/zip-1.html).
    (ATAPI PD-CD/CDR drives are not supported by this driver; support for PD-CD/CDR
    drives is available if you answer yes to `SCSI emulation support`).


    If you say yes here, the FLOPPY drive will be identified along with other IDE
    devices, with a name such as `hdb` or `hdc` (check the boot messages using the
    *dmesg* command).


    ## Name


    SCSI — SCSI device support


    If you want to use a SCSI hard disk, SCSI tape drive, SCSI CD-ROM, or any other
    SCSI device under Linux, say yes and make sure that you know the name of your
    SCSI host adapter (the card inside your computer that "speaks" the SCSI protocol,
    also called SCSI controller), because you will be asked for it.


    You also need to say yes here if you have a device that speaks the SCSI protocol.
    Examples of these include the parallel port version of the IOMEGA ZIP drive, USB
    storage devices, Fibre Channel, FireWire storage, and the IDE-SCSI emulation driver.


    Do not compile this as a module if your root file system (the one containing the
    directory */*) is located on a SCSI device.


    ## Name


    BLK_DEV_SD — SCSI disk support'
