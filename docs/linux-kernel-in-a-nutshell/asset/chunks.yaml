- fmt: '

    Incorrect values can severely degrade scheduler performance, so this option should
    be used only for scheduler development, never for production environments.


    ## Name

    `migration_debug` — Verbosity of migration cost auto-detection.


    ## Synopsis

    `migration_debug=`0`|`1`|`2`]


    Set the migration cost debug level. If `0` is specified, no extra messages will
    be printed to the kernel log. This is the default value. `1` prints some information
    on how the matrix is determined. `2` is very verbose and is useful only if you
    use a serial console, as the amount of information will overflow the kernel log
    buffer.


    ## Name

    `migration_factor` — Multiply or divide the migration costs.


    ## Synopsis

    `migration_factor=`percentage`


    Modify the default migration costs by the specified `percentage`. This is a debugging
    option that can be used to proportionally increase or decrease the auto-detected
    migration costs for all entries of the migration matrix. For example, `migration_factor=150`
    increases migration costs by 50%, so the scheduler will be less eager to migrate
    cache-hot tasks. `migration_factor=80` decreases migration costs by 20%, thus
    making the scheduler will be more eager to migrate tasks.


    ### Warning

    Incorrect values can severely degrade scheduler performance, so this option should
    be used only for scheduler development, never for production environments.


    # Ramdisk options

    These options control how the storage of information in memory to imitate disks
    (Ramdisks) is done, including init ramdisks that hold information necessary at
    some stages of booting.


    ## Name

    `initrd` — Location of initial ramdisk.


    ## Synopsis

    `initrd=`filename`


    Specify where the initial ramdisk for the kernel boot is located.


    ## Name

    `load_ramdisk` — Load a kernel ramdisk from a floppy.


    ## Synopsis

    `load_ramdisk=`n`


    If `n` is set to `1`, a ramdisk is loaded by the kernel at boot time from the
    floppy drive.


    ## Name

    `noinitrd` — Do not use any initrd.


    Do not load any initial ramdisk, even if it is configured in other options passed
    to the kernel.


    ## Name

    `prompt_ramdisk` — Prompt for the list of ramdisks.


    ## Synopsis

    `prompt_ramdisk=1`


    Prompt the user for the initial ramdisk before attempting to read it from the
    floppy drive.


    ## Name

    `ramdisk_blocksize` — Blocksize of the ramdisk.


    ## Synopsis

    `ramdisk_blocksize=`n`


    Tell the ramdisk driver how many bytes to use per block. The default size is 1024.


    ## Name

    `ramdisk_size` — Size of the ramdisk.


    ## Synopsis

    `ramdisk_size=`n`


    Specify the size of the initial RAM disk in kilobytes. The default size is 4096
    (4 MB). This option should be used instead of the older `ramdisk` command-line
    option.


    # Root disk options

    These options control how the kernel finds and handles the filesystem that contains
    the root filesystem.


    ## Name

    `ro` — Mount the root device read-only on boot.


    The default for the kernel is to mount the root device as read-only at boot time.
    This option ensures that this is the mode the kernel uses. It overrides the `rw`
    command-line option, if it had been specified earlier on the boot command line.


    ## Name

    `root` — Specify the root filesystem to boot from.


    ## Synopsis

    `root=`device`


    Tell the kernel which disk device the root filesystem image is on. `device` can
    be specified in one of the following ways:


    * `nnnn`

    > A device number in hexadecimal represents the major and minor number of the
    device in the internal format that the kernel expects. This method is not recommended
    unless you have access to kernel internals.


    * `/dev/nfs`

    > Use the NFS disk specified by the `nfsroot` boot option as the root disk.


    * `/dev/<diskname>`

    > Use the kernel disk name specified by `<diskname>` as the root disk.


    * `/dev/<diskname><decimal>`

    > Use the kernel disk name specified by `<diskname>` and the partition specified
    by `<decimal>` as the root disk.


    * `/dev/<diskname>p<decimal>`

    > Use the kernel disk name specified by `<diskname>` and the partition specified
    by `<decimal>` as the root disk. This is the same as above, but is needed when
    `<diskname>` ends with a digit.


    ## Name

    `rootdelay` — Time to delay before attempting to mount the root filesystem.


    ## Synopsis

    `rootdelay=`n`


    Wait `n` seconds before trying to mount the root filesystem. This can be useful
    if the root filesystem is on a USB or Firewire device, as those disk devices take
    a bit longer to be discovered by the kernel.


    ## Name

    `rootflags` — The root filesystem mount options.


    ## Synopsis

    `rootflags=`options`


    Mount options that the kernel should use in mounting the root filesystem. The
    `options` value depend on the filesystem type; see the documentation for the individual
    types for details on what is valid.


    ## Name

    `rootfstype` — The root filesystem type.


    ## Synopsis

    `rootfstype=`type`


    Try to mount the root filesystem as this type of filesystem. For instance, `rootfstype=ext3`.


    ## Name

    `rw` — Mount the root device read-write on boot.


    The default for the kernel is to mount the root device as read-only at boot time.
    This option mounts the root device as read-write instead.


    # Init options

    The `init` process is the first to be started by the kernel and is the ancestor
    of all other processes. These options control which program is run and how it
    is run.


    ## Name

    `init` — Program to run at init time.


    ## Synopsis

    `init=`filename`


    Run the specified binary as the `init` process instead of the default `/sbin/init`
    program.


    ## Name

    `rdinit` — Run the `init` process from the ramdisk.


    ## Synopsis

    `rdinit=`full_path_name`


    Run the program specified by `full_path_name` as the `init` process. This file
    must be on the kernel ramdisk instead of on the root filesystem.


    ## Name

    `S` — Run `init` in single-user mode.


    The default for the kernel is to run `init` in multi-user mode. This option runs
    `init` in single-user mode instead.


    # kexec options

    The kexec subsystem is a specialized rebooting feature that allows a fast reboot
    and is usually combined with the kdump facility that enables the previous kernel''s
    memory to be dumped to a safe place for analysis at a later time. These options
    modify the kexec subsystem''s parameters.


    ## Name

    `crashkernel` — Reserve a portion of physical memory for kexec to use.


    ## Synopsis

    `crashkernel=`n`[`KMG`]@`start`[`KMG`]


    The kexec subsystem likes to have a portion of physical memory reserved for it.
    This option reserves that memory from the rest of the kernel and will switch to
    it if the kernel panics. `n` specifies the amount of memory to reserve, and `start`
    specifies the location for this memory chunk. Both are measured in units of kilobytes
    (`K`), megabytes (`M`), or gigabytes (`G`).


    ## Name

    `elfcorehdr` — Start of the kernel core image ELF header.


    ## Synopsis

    `elfcorhdr=`n`


    The kernel, like every Linux executable, is stored in ELF format. This option
    specifies the physical address where the kernel core image''s ELF header starts.
    This is used by kexec to find the kernel when booting the secondary kernel image.


    # RCU options

    Read Copy Update (RCU) is a portion of the kernel that handles mutual exclusion
    for a variety of subsystems in a lock-less manner. There are a number of options
    that can be used to tune RCU in different ways:


    ## Name

    `rcu.blimit` — RCU batch limit.


    ## Synopsis

    `rcu.blimit=`n`


    Set the maximum number of finished RCU callbacks to process in one batch.


    ## Name

    `rcu.qhimark` — RCU queue high level.


    ## Synopsis

    `rcu.qhimark=`n`


    Batch limiting is disabled when the number of queued RCU callbacks rises above
    `n`.


    ## Name

    `rcu.qlowmark` — RCU queue low level.


    ## Synopsis

    `rcu.qlowmark=`n`


    Batch limiting is re-enabled when the number of queued RCU callbacks falls below
    `n`.


    ## Name

    `rcu.rsinterval` — RCU callback queue length.


    ## Synopsis

    `rcu.rsinterval=`n`

