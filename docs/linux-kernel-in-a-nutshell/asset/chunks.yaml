  trans: '

    预取 I/O 调度器（anticipatory I/O scheduler）是默认磁盘调度器。对于大多数环境，这是一个良好的选择，但与 deadline I/O
    调度器相比非常庞大且复杂。在某些情况下它可能更慢，特别是在某些数据库负载下。


    ### IOSCHED_DEADLINE — Deadline I/O 调度器


    deadline I/O 调度器简单且紧凑。它通常与预取 I/O 调度器一样，在某些数据库工作负载下甚至更好。对于单进程向磁盘执行 I/O 的情况，它的行为几乎与预取
    I/O 调度器相同，因此很好的选择。


    ### IOSCHED_CFQ — CFQ I/O 调度器


    CFQ I/O 调度器尝试在系统中所有进程之间平均分配带宽。它应该提供一个公平的工作环境，适用于桌面系统。


    ### SMP — 对称多处理支持


    这使得支持具有多个 CPU 的系统。如果你只有一个 CPU 的系统（如大多数个人电脑），请选“否”。如果你有多个 CPU 的系统，请选“是”。


    如果你在这里选“否”，内核将运行在单处理器和多处理器机器上，但只会使用多处理器机器上的一个 CPU。如果你在这里选“是”，内核将运行在许多但并非所有的单处理器机器上。在单处理器机器上，如果你在这里选“否”，内核运行得更快。


    请注意，如果你在这里选“是”并在“Processor family”（处理器家族）下选择了 `586` 或 `Pentium`，内核将无法在 486 架构上运行。同样，`PPro`
    架构的多处理器内核可能无法运行在所有基于 Pentium 的板上。


    另见 `Documentation/smp.txt`、`Documentation/i386/IO-APIC.txt`、`Documentation/nmi_watchdog.txt`
    以及位于 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto) 的 `SMP-HOWTO`。


    ### M386 — 386


    这是你 CPU 的处理器类型。此信息用于优化。为了编译一个可以在所有 x86 CPU 类型上运行的内核（尽管速度不是最优的），你可以在这里指定 `386`。


    内核不一定运行在你选择的架构更早的架构上；例如，针对 Pentium 优化的内核将运行在 PPro 上，但不一定运行在 i486 上。


    以下是为了最高速度的推荐设置：


    `386`

    > 如果你拥有 AMD/Cyrix/Intel 386DX/DXL/SL/SLC/SX，Cyrix/TI 486DLC/DLC2，UMC 486SX-S 和
    NexGen Nx586 处理器，请选择此。只有 `386` 内核会运行在 386 类机器上。


    `486`

    > 如果你拥有 AMD/Cyrix/IBM/Intel 486DX/DX2/DX4 或 SL/SLC/SLC2/SLC3/SX/SX2 以及 UMC U5D
    或 U5S 处理器，请选择此。


    `586`

    > 如果你拥有缺少 TSC（时间戳器）寄存器的通用 Pentium 处理器，请选择此。


    `Pentium-Classic`

    > 如果你拥有 Intel Pentium 处理器，请选择此。


    `Pentium-MMX`

    > 如果你拥有 Intel Pentium MMX 处理器，请选择此。


    `Pentium-Pro`

    > 如果你拥有 Intel Pentium Pro 处理器，请选择此。


    `Pentium-II`

    > 如果你拥有 Intel Pentium II 或预-Coppermine Celeron 处理器，请选择此。


    `Pentium-III`

    > 如果你拥有 Intel Pentium III 或 Coppermine Celeron 处理器，请选择此。


    `Pentium-4`

    > 如果你拥有 Intel Pentium 4 或基于 P4 的 Celeron 处理器，请选择此。


    `K6`

    > 如果你拥有 AMD K6、K6-II 或 K6-III（又名 K6-3D）处理器，请选择此。


    `Athlon`

    > 如果你拥有 AMD K7 家族（Athlon/Duron/Thunderbird）处理器，请选择此。


    `Crusoe`

    > 如果你拥有 Transmeta Crusoe 系列处理器，请选择此。


    `Efficeon`

    > 如果你拥有 Transmeta Efficeon 系列处理器，请选择此。


    `Winchip-C6`

    > 如果你拥有原始的 IDT Winchip 处理器，请选择此。


    `Winchip-2`

    > 如果你拥有 IDT Winchip 2 处理器，请选择此。


    `Winchip-2`

    > 如果你拥有具有 3dNow! 功能的 IDT Winchip 处理器，请选择此。


    `GeodeGX1`

    > 如果你拥有 Geode GX1 (Cyrix MediaGX) 处理器，请选择此。


    `Geode GX/LX`

    > 如果你拥有 AMD Geode GX 或 LX 处理器，请选择此。


    `CyrixIII/VIA C3`

    > 如果你拥有 VIA Cyrix III 或 VIA C3 处理器，请选择此。


    `VIA C3-2`

    > 如果你拥有 VIA C3-2 "Nehemiah"型号 9 及以上）处理器，请选择此。


    如果你不知道该做什么，选择 `386`。


    ### X86_GENERIC — 通用 x86 支持


    不仅包含所选 x86 变体（例如 PII、Crusoe 或 Athlon）的优化，还包含一些更通用的优化。


    ### NR_CPUS — CPU 最大数量 (255)


    这允许你指定内核支持的最大 CPU 数量。最大值为 255，有意义的最小值为 2。


    ### SCHED_SMT — SMT（超线程）


    SMT 支持在 Pentium 4 上改进调度器的决策，但代价是略微增加的开销。


    ### PREEMPT_NONE — 无强制抢占（服务器）


    这是传统的 Linux 抢占模型，倾向于吞吐量。它在大多数情况下提供良好的延迟，但可能会出现延迟。如果你在为服务器编译内核，请选择此选项。


    ### PREEMPT_VOLUNTARY — 自愿内核抢占（桌面）


    此选项通过在内核添加更多“显式抢占点”来减少延迟。这允许低优先级进程即使在内核模式下执行系统调用也能主动抢占。这使得应用程序在系统负载很大时运行得更流畅。如果你在为桌面编译内核，请选择此选项。


    ### PREEMPT — 可抢占内核（低延迟桌面）


    此选项通过使所有内核代码（执行临界区域的代码除）变为可抢占来减少内核延迟。这允许对交互事件做出反应，因为允许低优先级进程即使在内核模式下执行系统调用且本未到达自然抢占点也能被强制抢占。这使得应用程序在系统负载很大时运行得更流畅，代价是吞吐量略有下降以及内核代码略微运行时开销。如果你在为具有毫秒级延迟要求的桌面或嵌入式系统编译内核，请选择此。


    ### PREEMPT_BKL — 抢占大内核锁


    此选项通过使大内核锁可抢占来减少内核延迟。如果你在为桌面系统编译内核，请在这里选是。


    ### NOHIGHMEM — off


    Linux 在 x86 系统可以使用高达 64GB 的内存。然而，32 位 x86 处理器的地址空间仅为 4GB。这意味着，如果你有大量的物理内存，并不是所有内存都能被内核永久映射。未被永久映射的物理内存被称为高内存（high
    memory）。


    如果你编译的内核永远运行在总物理内存不超过 1GB 的机器上，请在此回答 `off`（默认选择，适用于大多数用户）。这将产生 `3GB/1GB` 的划分：3GB
    被映射，以便每个进程都能看到 3GB 的虚拟内存空间，而 4GB 虚拟内存空间的剩余部分被内核用于尽可能多地永久映射物理内存。

    '
- fmt: '

    If the machine has between 1 and 4 Gigabytes physical RAM, then answer `4GB` here.


    If more than 4 Gigabytes is used, answer `64GB` here. This selection turns Intel
    PAE (Physical Address Extension) mode on. PAE implements 3-level paging on IA32
    processors. PAE is fully supported by Linux, and PAE mode is implemented on all
    recent Intel processors (Pentium Pro and better).


    ### Note

    If you say `64GB` here, then the kernel will not boot on CPUs that don''t support
    PAE!


    The actual amount of total physical memory will either be autodetected or can
    be forced by using a kernel command line option such as `mem=256M`. (See [Chapter
    9](#index_split_101.html_filepos352657) for details about how to pass options
    to the kernel at boot time, and what options available.)


    If unsure, say `off`.


    ## HIGHMEM4G — 4GB


    Select this if you have a 32-bit processor and between 1 and 4 gigabytes of physical
    RAM.


    ## HIGHMEM64G — 64GB


    Select this if you have a 32-bit processor and more than 4 gigabytes of physical
    RAM.


    ## FLATMEM_MANUAL — Flat memory


    This option allows you to change some of the ways that Linux manages its memory
    internally. Most users will see only have one option here: `FLATMEM`. This is
    normal and a correct option.


    Some users of more advanced features, such as NUMA and memory hotplug, may have
    different options here. `DISCONTIGMEM` is a more mature, better tested system,
    but is incompatible with memory hotplug and may suffer decreased performance over
    `SPARSEMEM`. If unsure between `Sparse Memory` and `Discontiguous Memory`, choose
    `Discontiguous Memory`.


    If unsure, choose this option, `Flat Memory`.


    ## DISCONTIGMEM_MANUAL — Discontiguous memory


    This option provides better support than flat memory for discontiguous memory
    systems. These systems have holes in their physical address spaces, and this option
    handles the holes more efficiently. However, the vast majority of hardware has
    quite flat address spaces, and can experience degraded performance from the extra
    overhead this option imposes.


    Many NUMA configurations will have this as the only option.


    If unsure, choose `Flat Memory` over this option.


    ## SPARSEMEM_MANUAL — Sparse memory


    This will be the only option for some systems, including memory hotplug systems.


    For many other systems, this will be an alternative to `Discontiguous Memory`.
    This option provides some potential performance benefits, along with decreased
    code complexity, but it is newer and more experimental.


    If you are unsure, choose `Discontiguous Memory` or `Flat Memory`.


    ## SECCOMP — Enable seccomp to safely compute untrusted bytecode


    This kernel feature is useful for number-crunching applications that may need
    to compute untrusted bytecode during their execution. By using pipes or other
    transports made available to the process as file descriptors supporting the read/write
    syscalls, it''s possible to isolate those applications in their own address space
    using seccomp. Once seccomp is enabled via `/proc/pid/seccomp`, it cannot be disabled
    and the task is allowed to execute only a few safe syscalls defined by each seccomp
    mode.


    If you are unsure, say yes. Only embedded systems should be built by answering
    no.


    ## KEXEC — kexec system call (experimental)


    `kexec` is a system call that implements the ability to shut down your current
    kernel and start up another. It is like a reboot, but is indepedent of the system
    firmware. And like a reboot, you can start any kernel with it, not just Linux.


    The name comes from the similiarity to the `exec` system call.


    Do not be surprised if this code does not initially work for you. It may help
    to enable device hotplugging support. As of this writing, the exact hardware interface
    is strongly in flux, so no good recommendation can be made.


    ## HOTPLUG_CPU — Support for hot-pluggable CPUs (experimental)


    Say yes here to experiment with turning CPUs off and on, and to enable suspend
    on SMP systems. CPUs can be controlled through the `/sys/devices/system/cpu` interface.


    ## PM — Power Management support


    Power Management allows parts of your computer to shut off or be put into a power-conserving
    sleep mode if they are not being used. There are two competing standards for doing
    this: APM and ACPI. If you want to use either one, say yes here and then also
    enable one of those two standards.


    Power Management is most important for battery-powered laptop computers; if you
    have a laptop, check out the Linux Laptop home page at [http://www.linux-on-laptops.com](http://www.linux-on-laptops.com)
    or Tuxmobil-Linux on Mobile Computers at [http://www.tuxmobil.org](http://www.tuxmobil.org),
    and the Battery Powered Linux mini-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).


    Note that, even if you say no here, Linux on the x86 architecture will issue the
    `hlt` instruction if nothing is being done, thereby sending the processor to sleep
    and saving power.


    ## SOFTWARE_SUSPEND — Software suspend


    Enable machine suspension.


    When the machine is suspended, an image is saved in your active swap. Upon next
    boot, pass the `resume=/dev/swappartition`.


    ## ACPI — ACPI Support


    Advanced Configuration and Power Interface (ACPI) support for Linux requires ACPI-compliant
    hardware and firmware, and assumes the presence of OS-directed configuration and
    power management (OSPM) software. This option will enlarge your kernel by 70 KB.


    Linux ACPI provides a robust functional replacement for several legacy configuration
    and power management interfaces, including the Plug-and-Play BIOS specification
    (PnP BIOS), the MultiProcessor Specification (MPS), and the Advanced Power Management
    (APM) specification. If both ACPI and APM support are configured, whichever is
    loaded first will be used.


    The ACPI SourceForge project at [http://sourceforge.net/projects/acpi](http://sourceforge.net/projects/acpi)
    contains the latest source code, documentation, tools, mailing list subscription,
    and other information.


    Linux support for ACPI is based on Intel Corporation''s ACPI Component Architecture
    (ACPI CA). For more information, see [http://developer.intel.com/technology/iapc/acpi](http://developer.intel.com/technology/iapc/acpi).


    ACPI is an open industry specification co-developed by Compaq, Intel, Microsoft,
    Phoenix, and Toshiba. The specification is available at [http://www.acpi.info](http://www.acpi.info).


    ## CPU_FREQ — CPU frequency scaling


    CPU frequency scaling allows you to change the clock speed of CPUs on the fly.
    This can save power, because the lower the CPU clock speed, the less power the
    CPU consumes.


    Note that this driver doesn''t automatically change the CPU clock speed; you need
    to either enable a dynamic CPUFreq policy governor (described later) after booting
    or use a userspace tool.


    For details, take a look at *Documentation/cpu-freq*.

    '
  raw: 'If the machine has between 1 and 4 Gigabytes physical RAM, then answer `4GB`
    here.


    If more than 4 Gigabytes is used, answer `64GB` here. This selection turns Intel
    PAE (Physical Address Extension) mode on. PAE implements 3-level paging on IA32
    processors. PAE is fully supported by Linux, and PAE mode is implemented on all
    recent Intel processors (Pentium Pro and better).


    * * *


    ### Note


    If you say `64GB` here, then the kernel will not boot on CPUs that don''t support
    PAE!


    * * *


    The actual amount of total physical memory will either be autodetected or can
    be forced by using a kernel command line option such as `mem=256M`. (See [Chapter 9](#index_split_101.html_filepos352657)
    for details about how to pass options to the kernel at boot time, and what options
    available.)


    If unsure, say `off`.


    ## Name


    HIGHMEM4G — 4GB


    Select this if you have a 32-bit processor and between 1 and 4 gigabytes of physical
    RAM.


    ## Name


    HIGHMEM64G — 64GB


    Select this if you have a 32-bit processor and more than 4 gigabytes of physical
    RAM.


    ## Name


    FLATMEM_MANUAL — Flat memory


    This option allows you to change some of the ways that Linux manages its memory
    internally. Most users will see only have one option here: `FLATMEM`. This is
    normal and a correct option.


    Some users of more advanced features, such as NUMA and memory hotplug, may have
    different options here. `DISCONTIGMEM` is a more mature, better tested system,
    but is incompatible with memory hotplug and may suffer decreased performance over
    `SPARSEMEM`. If unsure between `Sparse Memory` and `Discontiguous Memory`, choose
    `Discontiguous Memory`.


    If unsure, choose this option, `Flat Memory`.


    ## Name


    DISCONTIGMEM_MANUAL — Discontiguous memory


    This option provides better support than flat memory for discontiguous memory
    systems. These systems have holes in their physical address spaces, and this option
    handles the holes more efficiently. However, the vast majority of hardware has
    quite flat address spaces, and can experience degraded performance from the extra
    overhead this option imposes.


    Many NUMA configurations will have this as the only option.


    If unsure, choose `Flat Memory` over this option.


    ## Name


    SPARSEMEM_MANUAL — Sparse memory


    This will be the only option for some systems, including memory hotplug systems.


    For many other systems, this will be an alternative to `Discontiguous Memory`.
    This option provides some potential performance benefits, along with decreased
    code complexity, but it is newer and more experimental.


    If you are unsure, choose `Discontiguous Memory` or `Flat Memory`.


    ## Name


    SECCOMP — Enable seccomp to safely compute untrusted bytecode


    This kernel feature is useful for number-crunching applications that may need
    to compute untrusted bytecode during their execution. By using pipes or other
    transports made available to the process as file descriptors supporting the read/write
    syscalls, it''s possible to isolate those applications in their own address space
    using seccomp. Once seccomp is enabled via */proc/pid/seccomp*, it cannot be disabled
    and the task is allowed to execute only a few safe syscalls defined by each seccomp
    mode.


    If you are unsure, say yes. Only embedded systems should be built by answering
    no.


    ## Name


    KEXEC — kexec system call (experimental)


    kexec is a system call that implements the ability to shut down your current kernel
    and start up another. It is like a reboot, but is indepedent of the system firmware.
    And like a reboot, you can start any kernel with it, not just Linux.


    The name comes from the similiarity to the exec system call.


    Do not be surprised if this code does not initially work for you. It may help
    to enable device hotplugging support. As of this writing, the exact hardware interface
    is strongly in flux, so no good recommendation can be made.


    ## Name


    HOTPLUG_CPU — Support for hot-pluggable CPUs (experimental)


    Say yes here to experiment with turning CPUs off and on, and to enable suspend
    on SMP systems. CPUs can be controlled through the */sys/devices/system/cpu* interface.


    ## Name


    PM — Power Management support


    Power Management allows parts of your computer to shut off or be put into a power-conserving
    sleep mode if they are not being used. There are two competing standards for doing
    this: APM and ACPI. If you want to use either one, say yes here and then also
    enable one of those two standards.


    Power Management is most important for battery-powered laptop computers; if you
    have a laptop, check out the Linux Laptop home page at [http://www.linux-on-laptops.com](http://www.linux-on-laptops.com)
    or Tuxmobil-Linux on Mobile Computers at [http://www.tuxmobil.org](http://www.tuxmobil.org),
    and the Battery Powered Linux mini-HOWTO, available from [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).


    Note that, even if you say no here, Linux on the x86 architecture will issue the
    `hlt` instruction if nothing is being done, thereby sending the processor to sleep
    and saving power.


    ## Name


    SOFTWARE_SUSPEND — Software suspend


    Enable machine suspension.


    When the machine is suspended, an image is saved in your active swap. Upon next
    boot, pass the `resume=/dev/swappartition` argument to the kernel to have it detect
    the saved image, restore memory state from it, and continue to run as before.
    If you do not want the previous state to be reloaded, use the `noresume` kernel
    argument. However, note that your partitions will be *fsck*''d and you must issue
    *mkswap* on your swap partitions again. The procedure does not work with swap
    files.


    Right now you may boot without resuming and then resume later, but in the meantime
    you cannot use those swap partitions/files which were involved in suspending.
    In this case, also, there is a risk that buffers on disk won''t match with saved
    ones.


    For more information take a look at *Documentation/power/swsusp.txt*.


    ## Name


    ACPI — ACPI Support


    Advanced Configuration and Power Interface (ACPI) support for Linux requires ACPI-compliant
    hardware and firmware, and assumes the presence of OS-directed configuration and
    power management (OSPM) software. This option will enlarge your kernel by about
    70 KB.


    Linux ACPI provides a robust functional replacement for several legacy configuration
    and power management interfaces, including the Plug-and-Play BIOS specification
    (PnP BIOS), the MultiProcessor Specification (MPS), and the Advanced Power Management
    (APM) specification. If both ACPI and APM support are configured, whichever is
    loaded first will be used.


    The ACPI SourceForge project at [http://sourceforge.net/projects/acpi](http://sourceforge.net/projects/acpi)
    contains the latest source code, documentation, tools, mailing list subscription,
    and other information.


    Linux support for ACPI is based on Intel Corporation''s ACPI Component Architecture
    (ACPI CA). For more information, see [http://developer.intel.com/technology/iapc/acpi](http://developer.intel.com/technology/iapc/acpi).


    ACPI is an open industry specification co-developed by Compaq, Intel, Microsoft,
    Phoenix, and Toshiba. The specification is available at [http://www.acpi.info](http://www.acpi.info).


    ## Name


    CPU_FREQ — CPU frequency scaling


    CPU frequency scaling allows you to change the clock speed of CPUs on the fly.
    This can save power, because the lower the CPU clock speed, the less power the
    CPU consumes.


    Note that this driver doesn''t automatically change the CPU clock speed; you need
    to either enable a dynamic CPUFreq policy governor (described later) after booting
    or use a userspace tool.


    For details, take a look at *Documentation/cpu-freq*.


    ## Name


    CPU_FREQ_DEFAULT_GOV_PERFORMANCE — performance


    Use the CPUFreq `performance` governor. This sets the frequency statically to
    the highest frequency supported by the CPU.


    ## Name


    CPU_FREQ_DEFAULT_GOV_USERSPACE — userspace'
