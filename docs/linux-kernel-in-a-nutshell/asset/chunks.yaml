                             [� ]   Toshiba Laptop Extras

    ```


    # 网络 (Networking)


    如今，几乎所有机器都需要网络功能，Linux 支持几乎所有可用的网络选项。在这里，我们仅展示众多选项中的少数几个。


    对于所有网络选项（包括不同的驱动程序），必须启用主网络配置选项：


    ```

    Networking

        [*] Networking support

    ```


    还应该选择 TCP/IP 选项，以便机器能够与互联网上的其他机器通信：


    ```

    Networking

        [*] Networking support

                          Networking options

                                  [*]* TCP/IP networking

    ```


    ## Netfilter


    Linux 内核的 Netfilter 部分是一个用于过滤和处理通过机器的所有网络包的框架。如果您希望在机器上启用防火墙以保护免受互联网上不同系统的攻击，或将机器作为网络上其他机器的代理，通常可以使用它。有关
    Netfilter 用途的更多细节，请参见 NETFILTER。


    ### 启用主 Netfilter 选项


    ```

    Networking

        [*] Networking support

                          Networking options

                                  [*]* Network packet filtering (replaces ipchains)

    ```


    在使用 netlink 时，建议启用 Netfilter netlink 接口和 Xtables 支持：


    ```

    Networking

        [*] Networking support

                                   �

    � options

    �                         packet packet filtering (replaces ipre)

    ) chains�                                   Core Netfilter Configuration

