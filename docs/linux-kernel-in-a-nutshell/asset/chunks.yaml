    截至 2.6.18 内核发布版本，`GCC` 的 3.2 版本是能够正确构建运行内核的最旧版本。请注意，获取最新的 `GCC` 版本并不总是一个好主意。一些最新发布的
    `GCC` 版本无法正确构建内核，因此，除非你想帮助调试编译器错误，否则不建议你尝试它们。


    要确定你系统中安装的是哪个版本的 `gcc`，请运行以下命令：


    ```

    gcc --version

    ```


    ## 链接器 (Linker)


    C 编译器 `gcc` 并不独自独立完成所有的编译工作。它需要一组名为 `binutils` 的额外工具来对源文件进行链接和汇装。`binutils` 包还包含一些实用的程序，可以以多种有用方式操作对象文件，例如查看库的内容。


    `binutils` 通常可以在一个（意不意外地）名为 `binutils` 的发行包中找到。如果你想自己下载并安装该包，可以在 [`www.gnu.org/software/binutils`](http://www.gnu.org/software/binutils)
    找到。


    截至 2.6.18 内核发布版本，`binutils` 的 2.12 版本是能够成功链接内核的最旧版本。要确定你系统中安装的是哪个版本的 `binutils`，请运行以下命令：


    ```

    ld -v

    ```


    ## Make


    `make` 是一个遍历内核源码树以确定哪些文件需要编译的工具，然后调用编译器和其他构建工具来完成内核构建工作。内核需要 GNU 版本的 `make`，它通常可以在你发行版的一个名为
    `make` 的包中找到。


    如果你想自己下载并安装 `make`，可以在 [`www.gnu.org/software/make`](http://www.gnu.org/software/make)
    找到。


    截至 2.6.18 内核发布版本，`make` 的 3.79.1 版本是能够正确构建内核的最旧版本。建议你安装最新稳定版本的 `make`，因为已知更高版本在处理构建文件时运行速度更快。


    要确定你系统中安装的是哪个版本的 `make`，请运行以下命令：


    ```

    make --version

    ```


    # 使用内核的工具


    虽然运行的内核版本通常不会影响任何用户应用程序，但有少数程序对内核版本非常重要。本节描述了你的 Linux 系统上可能已经安装的一些工具。如果你将内核升级到与发行版附带版本不同的版本，这些包中的某些可能也需要升级，以确保系统正常工作。


    ## util-linux


    `util-linux` 包是一系列执行各种不同任务的小型实用程序（utilities）。这些实用程序中，大多数负责处理磁盘分区的挂载和创建，以及对系统硬件时钟的操作。


    如果你想自己下载并安装 `util-linux` 包，可以在 [`www.kernel.org/pub/linux/utils/util-linux`](http://www.kernel.org/pub/linux/utils/util-linux)
    找到。


    截至 2.6.18 内核发布版本，`util-linux` 的 2.10o 版本是正常工作的最旧版本。建议你安装该包的最新版本，因为新版本支持内核中添加的新功能。绑定挂载（Bind
    mounts）是较新内核中的一个选项，需要较新版本的 `util-linux` 才能让它们正常工作。


    要确定你系统中安装的是哪个版本的 `util-linux` 包，请运行以下命令：


    ```

    fdformat --version

    ```


    ## module-init-tools


    如果你想使用 Linux 内核模块，则需要 `module-init-tools` 包。内核模块是一个可加载的代码块，可以在内核运行期间被添加到内核或从内核中移除。将设备驱动程序编译为模块是有用的，然后只加载与系统中所存在硬件对应的模块。所有
    Linux 发行版都使用模块来根据存在的硬件仅为系统加载所需的驱动程序和选项，而不是被迫在内核中一次性批量构建所有可能的驱动程序和选项。通过使用模块，可以通过只加载控制机器所需的代码来节省内存。


    内核模块加载过程在 2.6 内核发布版本中发生了剧变。模块的链接器（解析所有符号并确定如何在内存中组合这些部分的代码）现在被构建在内核中，这使得用户空间的工具变得非常小。较旧的发行版有一个名为
    `modutils` 的包，它无法与 2.6 内核正常工作。`module-init-tools` 包是你让 2.6 内核与模块正常工作所需的工具。


    如果你想自己下载并安装 `module-init-tools` 包，可以在 [`www.kernel.org/pub/linux/utils/kernel/module-init-tools`](http://www.kernel.org/pub/linux/utils/kernel/module-init-tools)
    找到。


    截至 2.6.18 内核发布版本，`module-init-tools` 的 0.9.10 版本是正常工作的最旧版本。建议安装该包的最新版本，因为内核添加的新功能可以被该包的更高版本使用。黑名单模块以防止它们被
    `udev` 自动加载就是其中一个选项。


    要确定你系统中安装的是哪个版本的 `module-init-tools`，请运行以下命令：


    ```

    depmod

    ```


    ## 文件系统特定工具


    针对特定文件系统的工具用于创建、格式化和修复磁盘分区。


    ### ext2/ext3/ext4


    `ext3` 和 `ext4` 文件系统是 `ext2` 的升级版。`util-linux` 包包含此类工具。要处理这些文件系统，你必须拥有 `e2sprogs`
    包。如果你想自己下载并安装该包，可以在 [`e2sprogs.sourceforge.net`](http://e2sprogs.sourceforge.net)
    找到。


    截至 2.6.18 内核发布版本，`e2sprogs` 的 1.29 版本是与内核正常工作的旧版本。强烈建议使用最新版本以利用 `ext3` 和 `ext4`
    文件系统的新功能。


    要确定你系统中安装的是哪个版本的 `e2sprogs`，请运行以下命令：


    ```

    tune2fs

    ```


    ### JFS


    要使用 IBM 的 JFS 文件系统，你必须拥有 `jfsutils` 包。如果你想自己下载并安装该包，可以在 [`jfs.sourceforge.net`](http://jfs.sourceforge.net)
    找到。


    截至 2.6.18 内核发布版本，`jfsutils` 的 1.1.3 版本是正常工作的最旧版本。要确定你系统中安装的是哪个版本的 `jfsutils`，请运行以下命令：


    ```

    fsck.jfs -V

    ```


    ### ReiserFS


    要使用 ReiserFS 文件系统，你必须拥有 `reiserfsprogs` 包。如果你想自己下载并安装该包，可以在 [`www.namesys.com/download.html`](http://www.namesys.com/download.html)
    找到。


    截至 2.6.18 内核发布版本，`reiserfsprogs` 的 3.6.3 版本是正常工作的最旧版本。要确定你系统中安装的是哪个版本的 `reiserfsprogs`，请运行以下命令：


    ```

    reiserfsck -V

    ```


    ### XFS


    要使用 SGI 的 XFS 文件系统，你必须拥有 `xfsprogs` 包。如果你想自己下载并安装该包，可以在 [`oss.sgi.com/projects/xfs`](http://oss.sgi.com/projects/xfs)
    找到。


    '
