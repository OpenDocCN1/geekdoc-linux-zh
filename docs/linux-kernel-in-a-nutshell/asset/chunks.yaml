  trans: "\n请记住将本示例中使用的 `e1000` 替换为你想要查找的模块名称。\n\n在上一个 `find` 命令的输出中，需要查找的重点是任何包含\
    \ `CONFIG_` 术的行。这就是内核在构建模块时需要启用的配置选项。在上面的示例中，`CONFIG_E1000` 选项就是你正在寻找的配置选项。\n\n\
    现在你已经有了配置内核所需的信息。运行菜单配置工具：\n\n```\n$ make menuconfig\n```\n\n然后按下 `/` 键（启动搜索）并输入配置选项名称，去掉字符串中的\
    \ `CONFIG_` 部分。此过程如图图 7-1 所示。\n\n![在 menuconfig 中搜索](img/00020.png)\n\n图 7-1.\
    \ 在 menuconfig 中搜索\n\n内核配置系统随后会准确告诉你在哪里选择该选项来启用此模块。请参见 图 7-2。\n\n![在 menuconfig\
    \ 中搜索的结果](img/00021.png)\n\n图 7-2. 在 menuconfig 中搜索的结果\n\n显示中的第一项与你搜索的内容完全匹配。显示的位置信息告诉你，要将模块\
    \ `e1000` 构建内核，必须启用以下配置选项：\n\n```\nDevice Drivers\n    Network device support\n\
    \      [*] Network device support\n          Ethernet (1000 Mbit)\n    [*] Intel(R)\
    \ PRO/1000 Gigabit Ethernet support\n```\n\n这些步骤适用于内核中激活的任何类型的设备。\n\n### 示例：USB\
    \ 设备\n\n作为另一个示例，让我们看看示例系统中存在的一个 USB 转串口转换器。它目前连接到 `/dev/ttyUSB0` 端口，因此你需要在 `sysfs`\
    \ 的 tty 部分进行查找：\n\n```\n$ ls /sys/class/tty/ | grep USB\n```\n\n`ttyUSB0`\n\n\
    你可以追溯该设备的 `sysfs` 以找到控制它的模块，如上一节所示：\n\n```\n$ basename readlink /sys/class/tty/ttyUSB0/device/driver/module\n\
    ```\n\n`pl2303`\n\n然后搜索内核源码树以找到你需要启用的配置选项：\n\n```\n$ cd ~/linux/linux-2.6.17.8\n\
    $ find -type f -name Makefile | xargs grep pl2303\n```\n\n```\n./drivers/usb/serial/Makefile:obj-$(CONFIG_USB_SERIAL_PL2303)\
    \ += pl2303.o\n```\n\n使用内核配置工具（如图图 7-3 所示）来找到合适的选项以设置 `CONFIG_USB_SERIAL_PL2303`\
    \ 选项。\n\n![搜索 USB_SERIAL_PL2303](img/00022.png)\n\n图 7-3. 搜索 `USB_SERIAL_PL2303`\n\
    \n在我们案例中，这将显示如图 7-4 所示的屏幕。\n\n![搜索 USB_SERIAL_PL2303 的结果](img/00023.png)\n\n图\
    \ 7-4. 搜索 `USB_SERIAL_PL2303` 的结果\n\n这准确地显示了在哪里找到正确控制该设备所需的 `USB Prolific 2303\
    \ Single Port Serial Driver` 。\n\n### 设备发现总结\n\n总结来说，对于已经绑定了工作驱动程序的设备，查找驱动程序需要以下步骤：\n\
    \n1. 找到设备绑定的正确 `sysfs` 类设备。网络设备列在 `/sys/class/net` 中，tty 设备列在 `/sys/class/tty/`\
    \ 中。其他类型的设备列在 `/sys/class` 下的其他目录中，取决于设备类型。\n\n2. 追溯 `sysfs` 树找到控制该设备的模块名称。它位于\
    \ `/sys/class/class_name/device_name/device/driver/module`，并可以使用 `readlink` 和\
    \ `basename` 程序显示：\n\n```\n$ basename readlink /sys/class/class_name/device_name\
    \ /device/driver/module\n```\n\n3. 使用 `find` 和 `grep` 搜索内核 Makefile，查找构建该模块名称的\
    \ `CONFIG_` 规则：\n\n```\n$ find -type f -name Makefile | xargs grep module_name\n\
    ```\n\n4. 在内核配置系统中搜索该配置值，并转到菜单中指定的位置以启用该驱动的构建。\n\n### 让内核告诉我们我们需要什么\n\n既然我们已经尝试了探测内核的所有步骤，这里有一个非常实用的脚本：\n\
    \n```bash\n#!/bin/bash\n# find_all_modules\nfor i in `find /sys/ -name modalias\
    \ -exec cat {} \\`; do modprobe --show $i done | rev | sort -u\n```\n\n此脚本遍历 `sysfs`\
    \ 并找到所有告诉内核应该采取哪个 `modprobe` 命令的 `alias`。如果找到匹配项，它将输出模块列表。\n\n"
- fmt: "\nThe steps involved in matching the driver to the device differ depending\
    \ on the type of device that you are working with. We will discuss the two most\
    \ common forms of devices in this chapter: PCI and USB devices. The methods described\
    \ here will also work with other types of devices.\n\nAlso, it is very important\
    \ for the kernel to be able to find all of the filesystems in the system, the\
    \ most important one being the root filesystem. We will go into how to do this\
    \ toward the end of the chapter in [Root Filesystem](#index_split_060.html_filepos252324).\n\
    \n## PCI devices\n\nPCI devices are distinguished by vendor ID and device ID;\
    \ each combination of vendor and device ID could require a unique driver. This\
    \ is the basis for the research this section shows you how to do.\n\nFor this\
    \ example, let us use a PCI network card that is not working with the currently\
    \ running kernel version. This example will be different from your situation,\
    \ with different PCI device and bus ID values, but the steps involved should be\
    \ relevant to any type of PCI device you wish to find a working driver for.\n\n\
    First, find the PCI device in the system that is not working. To get a list of\
    \ all PCI devices, use the `lspci` program. Because we care only about Ethernet\
    \ PCI devices, we will narrow our search of the PCI devices by searching only\
    \ for strings containing the term `Ethernet` (case-insensitive):\n\n```bash\n\
    $ /usr/sbin/lspci | grep -i ethernet\n```\n\n```\n06:04.0 Ethernet controller:\
    \ Realtek Semiconductor Co., Ltd.  RTL-8139/8139C/8139C+ (rev 10)\n```\n\nThis\
    \ is the device we wish to get working.\n\n### Note\n\nAlmost all distributions\
    \ place the `lspci` program in the `/usr/sbin/` directory, but some place it in\
    \ other locations. To find out where it is located, enter:\n\n```bash\n$ which\
    \ lspci\n```\n\n`/usr/sbin/lspci`\n\nIf you are using a distribution that puts\
    \ it somewhere else, please use that path whenever we discuss using `lspci`.\n\
    \nThe first few bits of the `lspci` output show the PCI bus id for this device,\
    \ `06:04.0`. That is the value we will use when looking through `sysfs` in order\
    \ to find out more information about this device.\n\nGo into `sysfs` where all\
    \ of the different PCI devices are listed, and look at their names:\n\n```bash\n\
    $ cd /sys/bus/pci/devices/\n$ ls\n```\n\n```\n0000:00:00.0  0000:00:1d.0  0000:00:1e.0\
    \  0000:00:1f.3  0000:06:03.3\n0000:00:02.0  0000:00:1d.1  0000:00:1f.0  0000:06:03.0\
    \  0000:06:03.4\n0000:00:02.1  0000:00:1d.2  0000:00:1f.1  0000:06:03.1  0000:06:04.0\n\
    0000:00:1b.0  0000:00:1d.7  0000:00:1f.2  0000:06:03.2  0000:06:05.0\n```\n\n\
    The kernel numbers PCI devices with a leading `0000:` that does not show up in\
    \ the output of the `lspci` program. So add the leading `0000:` onto the number\
    \ that you found using `lspci` and go into that directory:\n\n```bash\n$ cd 0000:06:04.0\n\
    ```\n\nIn this directory, you want to know the values of the `vendor` and `device`\
    \ filenames:\n\n```bash\n$ cat vendor\n```\n\n```\n0x10ec\n```\n\n```bash\n$ cat\
    \ device\n```\n\n```\n0x8139\n```\n\nThese are the vendor and device IDs for this\
    \ PCI device. The kernel uses these values to match a driver to a device properly.\
    \ PCI drivers tell the kernel which vendor and device IDs they will support so\
    \ that the kernel knows how to bind the driver to the proper device. Write them\
    \ down somewhere, as we will refer to them later.\n\nNow that we know the vendor\
    \ and product ID for this PCI device, we need to find the proper kernel driver\
    \ that advertises that it supports this device. Go back to the kernel source directory:\n\
    \n```bash\n$ cd ~/linux/linux-2.6.17.8/\n```\n\nThe monst common location for\
    \ PCI IDs in the kernel source tree is `include/linux/pci_ids.h`. Search that\
    \ file for our vendor product number:\n\n```bash\n$ grep -i 0x10ec include/linux/pci_ids.h\n\
    ```\n\n```\n#define PCI_VENDOR_ID_REALTEK  0x10ec\n```\n\nThe defined value here,\
    \ `PCI_VENDOR_ID_REALTEK` is what will be used in any kernel driver that purports\
    \ to support devices from this. To be safe, also look in this file for our device\
    \ ID, as it is sometimes described there:\n\n```bash\n$ grep -i 0x8139 include/linux/pci_ids.h\n\
    ```\n\n```\n#define PCI_DEVICE_ID_REALTEK_8139  0x8139\n```\n\nThat definition\
    \ will be useful. Now look for driver source files referring to this vendor:\n\
    \n```bash\n$ grep -Rl PCI_VENDOR_ID_REALTEK *\n```\n\n```\ninclude/linux/pci_ids.h\n\
    drivers/net/r8169.c\ndrivers/net/8139too.c\ndrivers/net/8139cp.c\n```\n\nThe first\
    \ file listed here, `pci_ids.h` does not need to be looked at, as that is where\
    \ we found the original. But the files `r8169.c`, `8139too.c`, and `8139cp.c`\
    \ in the `drivers/net/` subdirectory should be examined closely.\n\nOpen one of\
    \ these files in an editor and search for `PCI_VENDOR_ID_REALTEK`. In the file\
    \ `drivers/net/r8169.c`, it shows up in this section of code:\n\n```c\nstatic\
    \ struct pci_device_id rtl8169_pci_tbl[] = {\n    { PCI_DEVICE(PCI_VENDOR_ID_REALTEK,\
    \ 0x8169), },\n    { PCI_DEVICE(PCI_VENDOR_ID_REALTEK, 0x8129), },\n    { PCI_DEVICE(PCI_VENDOR_ID_DLINK,\
    \ 0x4300), },\n    { PCI_DEVICE(0x16ec, 0x0116), },\n    { PCI_DEVICE(PCI_VENDOR_ID_LINKS,\
    \ 0x1032, PCI_ANY_ID, 0x0024 }, },\n    { },\n};\n```\n\nAll PCI drivers contain\
    \ a list of the different devices they support. That list is contained in a structure\
    \ of `struct pci_device_id` values, just like this one. That is what we need to\
    \ look at in order to determine whether our device is supported by this driver.\
    \ The vendor value matches here, but the second value after the vendor is the\
    \ device value. Our device has the value `0x8139`, while this driver supports\
    \ the device values of `0x8169` and `0x8129` for devices with the vendor ID of\
    \ `PCI_VENDOR_ID_REALTEK`. So this driver will not support our device.\n\nMoving\
    \ on to the next file `drivers/net/8139too.c`, we find the string `PCI_VENDOR_ID_REALTEK`\
    \ in the following bit of code:\n\n```c\nif (pdev->vendor == PCI_VENDOR_ID_REALTEK\
    \ &&\n    pdev->device == PCI_DEVICE_ID_REALTEK_8139 && pci_rev >= 0x20) {\n \
    \   dev_info(pdev->dev,\n        \"This (id %04x:%04x rev %02x) is an enhanced\
    \ 8139C+ chip\\n\",\n        pdev->vendor, pdev->device, pci_rev);\n    dev_info(pdev->dev,\n\
    \        \"Use the \\\"8139cp\\\" driver for improved performance and stability.\\\
    n\");\n}\n```\n\nThe use of the `PCI_VENDOR_ID_REALTEK` value here also corresponds\
    \ with the code that checks whether the PCI device id matches the `PCI_DEVICE_ID_REALTEK_8139`\
    \ value. If it does, the driver is to print out a message that says: “ Use the\
    \ 8139cp driver for improved performance and stability. ” Perhaps we should look\
    \ at that driver next. Even if we did not have such a visible clue, the `8139too.c`\
    \ driver does not have the vendor and device ID pair that we are looking for in\
    \ a `struct pci_device_id` variable, so that gives us the clue that it will not\
    \ support our device.\n\nFinally, look at the `drivers/net/8139cp.c` file. It\
    \ uses the `PCI_VENDOR_ID_REALTEK` definition in the following code segment:\n\
    \n```c\nstatic struct pci_device_id cp_pci_tbl[] = {\n    { PCI_DEVICE(PCI_VENDOR_ID_REALTEK,\
    \ PCI_DEVICE_ID_REALTEK_8139), },\n    { PCI_DEVICE(PCI_VENDOR_ID_TTTECH, PCI_DEVICE_ID_TTTECH_MC322),\
    \ },\n    { PCI_DEVICE(PCI_ANY_ID, PCI_ANY_ID, 0, 0), },\n    { },\n};\n\nMODULE_DEVICE_TABLE(pci,\
    \ cp_pci_tbl);\n```\n\nHere is a use of both our vendor and device ID values in\
    \ a `struct pci_device_id` variable. This driver should support our device.\n\n\
    Now that we have the driver name, we can work backward, as shown in the first\
    \ section in this chapter to find the proper kernel configuration value that should\
    \ be enabled to build this driver.\n\nIn summary, here are the steps needed in\
    \ order to find which PCI driver can control a specific PCI device:\n\n1.  Find\
    \ the PCI bus ID of the device for which you want to find the driver, using `lspci`.\n"
  raw: 'The steps involved in matching the driver to the device differ depending on
    the type of device that you are working with. We will discuss the two most common
    forms of devices in this chapter: PCI and USB devices. The methods described here
    will also work with other types of devices.


    Also, it is very important for the kernel to be able to find all of the filesystems
    in the system, the most important one being the root filesystem. We will go into
    how to do this toward the end of the chapter in [Root Filesystem](#index_split_060.html_filepos252324).


    ## PCI devices


    PCI devices are distinguished by vendor ID and device ID; each combination of
    vendor and device ID could require a unique driver. This is the basis for the
    research this section shows you how to do.


    For this example, let us use a PCI network card that is not working with the currently
    running kernel version. This example will be different from your situation, with
    different PCI device and bus ID values, but the steps involved should be relevant
    to any type of PCI device you wish to find a working driver for.


    First, find the PCI device in the system that is not working. To get a list of
    all PCI devices, use the *lspci* program. Because we care only about Ethernet
    PCI devices, we will narrow our search of the PCI devices by searching only for
    strings containing the term `Ethernet` (case-insensitive):


    `$` **`/usr/sbin/lspci | grep -i ethernet`**


    `06:04.0 Ethernet controller: Realtek Semiconductor Co., Ltd.  RTL-8139/8139C/8139C+
    (rev 10)`


    This is the device we wish to get working. ^([[10](#index_split_061.html_filepos265683)])


    * * *


    ### Note


    Almost all distributions place the *lspci* program in the */usr/sbin/* directory,
    but some place it in other locations. To find out where it is located, enter:


    `$` **`which lspci`**


    `/usr/sbin/lspci`


    If you are using a distribution that puts it somewhere else, please use that path
    whenever we discuss using *lspci*


    * * *


    The first few bits of the *lspci* output show the PCI bus id for this device,
    `06:04.0`. That is the value we will use when looking through `sysfs` in order
    to find out more information about this device.


    Go into `sysfs` where all of the different PCI devices are listed, and look at
    their names:


    `$` **`cd /sys/bus/pci/devices/`**


    `$` **`ls`**


    `0000:00:00.0  0000:00:1d.0  0000:00:1e.0  0000:00:1f.3  0000:06:03.3`


    `0000:00:02.0  0000:00:1d.1  0000:00:1f.0  0000:06:03.0  0000:06:03.4`


    `0000:00:02.1  0000:00:1d.2  0000:00:1f.1  0000:06:03.1  0000:06:04.0`


    `0000:00:1b.0  0000:00:1d.7  0000:00:1f.2  0000:06:03.2  0000:06:05.0`


    The kernel numbers PCI devices with a leading `0000:` that does not show up in
    the output of the *lspci* program. ^([[11](#index_split_061.html_filepos266244)])
    So add the leading `0000:` onto the number that you found using `lspci` and go
    into that directory:


    `$` **`cd 0000:06:04.0`**


    In this directory, you want to know the values of the *vendor* and *device* filenames:


    `$` **`cat vendor`**


    `0x10ec`


    `$` **`cat device`**


    `0x8139`


    These are the vendor and device IDs for this PCI device. The kernel uses these
    values to match a driver to a device properly. PCI drivers tell the kernel which
    vendor and device IDs they will support so that the kernel knows how to bind the
    driver to the proper device. Write them down somewhere, as we will refer to them
    later.


    Now that we know the vendor and product ID for this PCI device, we need to find
    the proper kernel driver that advertises that it supports this device. Go back
    to the kernel source directory:


    `$` **`cd ~/linux/linux-2.6.17.8/`**


    The monst common location for PCI IDs in the kernel source tree is *include/linux/pci_ids.h*.
    Search that file for our vendor product number:


    `$` **`grep -i 0x10ec include/linux/pci_ids.h`**


    `#define PCI_VENDOR_ID_REALTEK           0x10ec`


    The defined value here, `PCI_VENDOR_ID_REALTEK` is what will probably be used
    in any kernel driver that purports to support devices from this manufacturer.


    To be safe, also look in this file for our device ID, as it is also sometimes
    described there:


    `$` **`grep -i 0x8139 include/linux/pci_ids.h`**


    `#define PCI_DEVICE_ID_REALTEK_8139      0x8139`


    That definition will be useful later.


    Now look for driver source files referring to this vendor definition:


    `$` **`grep -Rl PCI_VENDOR_ID_REALTEK *`**


    `include/linux/pci_ids.h`


    `drivers/net/r8169.c`


    `drivers/net/8139too.c`


    `drivers/net/8139cp.c`


    The first file listed here, *pci_ids.h* does not need to be looked at, as that
    is where we found the original definition. But the files *r8139.c*, *8139too.c*,
    and *8169cp.c* in the *drivers/net/* subdirectory should be examined more closely.


    Open one of these files in an editor and search for `PCI_VENDOR_ID_REALTEK`. In
    the file *drivers/net/r8169.c*, it shows up in this section of code:


    `static struct pci_device_id rtl8169_pci_tbl[] = {`


    `        { PCI_DEVICE(PCI_VENDOR_ID_REALTEK, 0x8169), },`


    `        { PCI_DEVICE(PCI_VENDOR_ID_REALTEK, 0x8129), },`


    `        { PCI_DEVICE(PCI_VENDOR_ID_DLINK,   0x4300), },`


    `        { PCI_DEVICE(0x16ec,                0x0116), },`


    `        { PCI_VENDOR_ID_LINKSYS,            0x1032, PCI_ANY_ID, 0x0024, },`


    `        {0,},`


    `};`


    All PCI drivers contain a list of the different devices that they support. That
    list is contained in a structure of `struct pci_device_id` values, just like this
    one. That is what we need to look at in order to determine whether our device
    is supported by this driver. The vendor value matches here, but the second value
    after the vendor is the device value. Our device has the value `0x8139`, while
    this driver supports the device values of `0x8169` and `0x8129` for devices with
    the vendor ID of `PCI_VENDOR_ID_REALTEK`. So this driver will not support our
    device.


    Moving on to the next file *drivers/net/8139too.c*, we find the string `PCI_VENDOR_ID_REALTEK`
    in the following bit of code:


    `if (pdev->vendor == PCI_VENDOR_ID_REALTEK &&`


    `    pdev->device == PCI_DEVICE_ID_REALTEK_8139 && pci_rev >= 0x20) {`


    `    dev_info(&pdev->dev,`


    `          "This (id %04x:%04x rev %02x) is an enhanced 8139C+ chip\n",`


    `          pdev->vendor, pdev->device, pci_rev);`


    `    dev_info(&pdev->dev,`


    `          "Use the \"8139cp\" driver for improved performance and stability.\n");`


    `}`


    The use of the `PCI_VENDOR_ID_REALTEK` value here also corresponds with the code
    that checks whether the PCI device id matches the `PCI_DEVICE_ID_REALTEK_8139`
    value. If it does, the driver is to print out a message that says: “ Use the 8139cp
    driver for improved performance and stability. ” Perhaps we should look at that
    driver next. Even if we did not have such a visible clue, the *8139too.c* driver
    does not have the vendor and device ID pair that we are looking for in a `struct
    pci_device_id` variable, so that gives us the clue that it will not support our
    device.


    Finally, look at the *drivers/net/8139cp.c* file. It uses the `PCI_VENDOR_ID_REALTEK`
    definition in the following code segment:


    `static struct pci_device_id cp_pci_tbl[] = {`


    `        { PCI_VENDOR_ID_REALTEK, PCI_DEVICE_ID_REALTEK_8139,`


    `          PCI_ANY_ID, PCI_ANY_ID, 0, 0, },`


    `        { PCI_VENDOR_ID_TTTECH, PCI_DEVICE_ID_TTTECH_MC322,`


    `          PCI_ANY_ID, PCI_ANY_ID, 0, 0, },`


    `        { },`


    `};`


    `MODULE_DEVICE_TABLE(pci, cp_pci_tbl);`


    Here is a use of both our vendor and device ID values in a `struct pci_device_id`
    variable. This driver should support our device.


    Now that we have the driver name, we can work backward, as shown in the first
    section in this chapter to find the proper kernel configuration value that should
    be enabled to build this driver.


    In summary, here are the steps needed in order to find which PCI driver can control
    a specific PCI device:


    1.  Find the PCI bus ID of the device for which you want to find the driver, using
    *lspci*.'
