    We are interested in the type of the filesystem, which is shown after the word\
    \ `type`. In this example, it is `ext3`. This is the type of filesystem that the\
    \ root partition is using. Go into the kernel configuration system and make sure\
    \ that this filesystem type is enabled as described in [Filesystems](#index_split_088.html_filepos333828).\n\
    \n### Disk controller\n\nIn the output of the `mount` command shown earlier, the\
    \ first portion of the line shows which block device the root filesystem is mounted\
    \ on. In this example, it's `/dev/sda2`. Now that the filesystem is configured\
