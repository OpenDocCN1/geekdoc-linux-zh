  trans: '

    导致内核忽略所有大于或等于物理地址 `n` 的物理内存。


    ## 名称

    `mem` — 强制指定内存使用。


    ## 概览

    `mem=`n`*[`KMG`*]`


    设置内核使用的特定内存量。与 `memmap=` 选项配合使用时可以避免物理地址空间冲突。如果不使用 `memmap=` 选项，此选项可能会导致 PCI 设备被放置在未使用
    RAM 的地址上。`n` 指定强制使用的内存数量，单位为千（`K`）、兆字节（`M`）或字节（`G`）。


    ## 名称

    `mem` — 禁用内核内存对 4MB 页的使用。


    ## 概览

    `mem=nopentium`


    禁用内核内存对大页（4MB）的使用。


    ## 名称

    `memmap` — 启用设置确切的 E820 内存映射。


    ## 概览

    `memmap=`exactmap`


    使用特定的内存映射。`exactmap` 行可以根据 BIOS 输出或其他需求构建。


    ## 名称

    `memmap` — 强制使用特定内存。


    ## 概览

    `memmap=`n`*[`KMG`*]`@`start`*[`KMG`*]`


    强制内核使用特定的内存区域。`n` 是内存区域的大小，`start` 是该范围在内存中的起始位置。单位为千（`K`）、兆字节（`M`）或字节（`G`）。


    ## 名称

    `noexec` — 启用或禁用非执行映射。


    ## 概览

    `noexec=`[`(`on`|(`off`]`


    启用或禁用内核将内存段映射为非执行的能力。默认情况下，映射已启用（`on`）。


    ## 名称

    `reserve` — 留某些 I/O 内存。


    ## 概览

    `reserve=`n`*[`KMG`*]`


    强制内核忽略某些 I/O 内存区域。


    ## 名称

    `vmalloc` — 强制 vmalloc 区域具有特定大小。


    ## 概览

    `vmalloc=`n`*[`KMG`*]`


    强制 vmalloc 具有 `n` 指定的确切大小。这可以增加 vmalloc 区域的最小大小（在 x86 处理器上为 128 MB）。它也可以用于减小大小并为直接映射的内核
    RAM 留出空间。


    ## 名称

    `norandmaps` — 不使用地址空间随机。


    默认情况下，内核在所有程序启动时对其地址空间随机化。此选项禁用此功能。它等同于向文件 `/proc/sys/kernel/randomize_va_space`
    写入 `0`。


    ## 名称

    `vdso` — 启用或禁用 VDSO 映射。


    ## 概览

    `vdso=`[`0`|`1`]


    禁用 (0) 或启用 (1) VDSO（虚拟动态共享对象）映射。默认启用。


    # 挂起选项


    这些选项更改了内核为了节电目的处理挂起的方式。


    ## 名称

    `resume` — 指定挂起镜像的分区设备。


    ## 概览

    `resume=`suspend_device`


    告诉内核哪个磁盘设备包含挂起的内核镜像。如果镜像上的数据是由软件挂起子系统创建的有效内核镜像，它将被加载到内存中，内核将运行而不是继续正常的启动过程。`suspend_device`
    是内核设备名称，可能与用户空间认为的设备名称不同，因此请谨慎地使用此选项。


    ## 名称

    `noresume` — 禁用恢复。


    禁用内核的恢复功能。任何用于存放内核可以恢复的系统镜像的交换分区将恢复为可用的交换空间。


    # CPU 选项


    这些选项控制关于计时、多处理器系统中的处理器使用以及其他处理器问题的广泛行为。


    ## 名称

    `cachesize` — 覆盖 2 级 CPU 缓存大小检测。


    ## 概览

    `cachesize=`n`


    有时 CPU 硬件缺陷会导致它们报告错误的缓存大小。内核会尝试回避并修复大多数 CPU 的已知问题，但对于某些 CPU，无法确定正确的大小应该是多少。此选项为这些情况提供了覆盖支持。`n`
    的单位为字节。


    ## 名称

    `lpj` — 设置每个 jiffy 的循环次数。


    ## 概览

    `lpg=`n`


    指定内核应使用的每个 jiffy 的循环次数，从而让内核避免耗时的启动时自动检测此值。如果 `n` 为 `0`，则将像常一样自动检测。


    * * *


    ### 警告

    在 SMP 系统上，此值将设置到所有 CPU 上，如果不同的 CPU 需要不同的设置，可能会导致问题。错误的值将导致内核出现错误的延迟，可能导致不可预测的
    I/O 错误和其他损坏。虽然可能不大，但在极端情况下这可能会损坏您的硬件。


    * * *


    ## 名称

    `nmi_watchdog` — 设置 NMI 监视狗值。


    ## 概览

    `nmi_watchdog=`[`0`|`1`|`2`|`3`]


    这是一个调试功能，允许用户覆盖默认的非掩码中断（NMI）监视狗值。`0` 指定不使用 NMI 监视狗。`1` 指定如果存在则使用 APIC。`2` 指定如果存在使用本地
    APIC。`3` 表示监视狗无效。


    ## 名称

    `no387` — 始终使用 387。


    ## 概览

    `no387=`n


    即使存在协处理器，也始终使用 387 仿真库。


    ## 名称

    `nofxsr` — 禁用浮点寄存器的保存和恢复。


    ## 概览

    `nofxsr=`n`


    禁用扩展寄存器的保存和恢复。内核将在任务切换时执行浮点操作。


    ## 名称

    `nofhlt` — 不使用 HLT 指令。


    ## 概览

    `nofhlt=`n


    由于 `HLT` 指令在某些处理器上无法正常，提供了此选项。


    ## 名称

    `mce` — 启用机器检查异常。


    ## 概览

    `mce=`n


    某些处理器可以检查机器错误（通常是硬件错误）。如果已编译进内核，此选项开启该子系统。


    ## 名称

    `nomce` — 禁用机器检查异常。


    ## 概览

    `nomce`


    此选项关闭该子系统。


    ## 名称

    `nosep` — 禁用 x86 SYSENTER/SEXIT 支持。


    ## 概览

    `nosep=`n


    禁用内核中的 SYSENTER/SEXIT 支持。这会导致某些系统调用耗时长。


    ## 名称

    `nosmp` — 以单处理器运行。


    ## 概览

    `nosmp=`n`


    即使在多处理器机器上也让 SMP 内核作为单处理器内核运行。


    ## 名称

    `notsc` — 禁用时间计数器。


    ## 概览

    `notsc=`n`


    如果存在，则禁用时间计数器硬件。


    ## 名称

    `max_cpus` — 最大 CPU 数量。


    ## 概览

    `maxcpus=`n`


    指定 SMP 内核应使用的最大处理器数量，即使存在更多。


    # 调度选项


    这些选项微调用于做出调度决策的参数。大多数选项取决于对调度原理的深入理解。


    ## 名称

    `isolcpus` — 从内核调度器中隔离 CPU。


    ## 概览

    `isolcpus=`cpu_number`[`,` `cpu_number`...]


    将指定的 `cpu_number` CPU 从通用内核 SMP 算法中移除。将进程移动到或离开“隔离”CPU 的唯一方法是通过 CPU 亲和性调用。`cpu_number`
    从 0 开始，因此最大值比 CPU 数量少 1。


    此选项是隔离 CPU 的首选方法。另一种方法手动设置所有任务的 CPU 掩码会导致问题并导致负载均衡器性能下降。


    ## 名称

    `migration_cost` — 覆盖默认的调度迁移成本。


    ## 概览

    `migration_cost=`level-1-useconds`*[`level-2-useconds`...]


    这是一个调试选项，覆盖默认的调度迁移成本矩阵。`level-N-useconds` 指定的数字由“CPU 域距离”索引，单位为微秒。


    SMT NUMA 机器的一个选项示例是 `migration_cost=1000,2000,3000`。它设置了核内迁移成本为 1 毫秒，另一个核间迁移成本为
    2 毫秒，另一个节点间迁移成本为 3 毫秒。


