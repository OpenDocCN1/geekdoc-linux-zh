  raw: 'We are interested in the type of the filesystem, which is shown after the
    word `type`. In this example, it is `ext3`. This is the type of filesystem that
    the root partition is using. Go into the kernel configuration system and make
    sure that this filesystem type is enabled as described in [Filesystems](#index_split_088.html_filepos333828).


    ### Disk controller


    In the output of the *mount* command shown earlier, the first portion of the line
    shows which block device the root filesystem is mounted on. In this example, it''s
    `/dev/sda2`. Now that the filesystem is configured properly in your kernel, you
    must also make sure that this block device will also work correctly. To find out
    which drivers are needed for this, you need to look at `sysfs` again.


    All block devices show up in `sysfs` in either */sys/block/* or in */sys/class/block/*,
    depending on the version of the kernel you are using. In either location, the
    block devices are a tree, with the different partitions being children of the
    main device:


    `$` **`tree -d /sys/block/ | egrep "hd|sd"`**


    `|-- hdc`


    `|-- hdd`


    `` `-- sda ``


    `    |-- sda1`


    `    |-- sda2`


    `    |-- sda3`


    Given the information in the *mount* command, you need to ensure that the `sda2`
    device is configured properly. Because this is a partition (disk partitions are
    numbered, while main block devices are not), the whole `sda` device must be configured.
    (Without the main block device, there is no way to access the individual partitions
    on that device.)


    The `sda` block device is represented just like the network device we looked at
    earlier in this chapter. There is a symlink in the device''s directory called
    *device* that points to the logical device that controls this block device:


    `$` **`ls -l /sys/block/sda`**


    `  ...`


    `device -> ../../devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0:0`


    `  ...`


    Now you need to start walking up the chain of devices in `sysfs` to find out which
    driver is controlling this device:


    `$` **`ls -l /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0:0`**


    `  ...`


    `driver -> ../../../../../../bus/scsi/drivers/sd`


    `  ...`


    Here we see that the SCSI disk controller driver is responsible for making this
    device work. So we know we need to configure SCSI disk support into our kernel
    configuration.


    Continuing up the directory chain in `sysfs`, try to find where the driver is
    that controls the hardware:


    `$` **`ls -l /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0`**


    `  ...`


    There is no link called *driver* in this directory, so go back up one more level:


    `$` **`ls -l /sys/devices/pci0000:00/0000:00:1f.2/host0`**


    `  ...`


    Again, no driver here. Continuing on up one more level:


    `$` **`ls -l /sys/devices/pci0000:00/0000:00:1f.2`**


    `  ...`


    `driver -> ../../../bus/pci/drivers/ata_piix`


    `  ...`


    There! This is the disk controller we need to ensure is in our kernel configuration.


    So for this root filesystem, we need to enable the `ext3`, `sd`, and `ata_piix`
    drivers in our kernel configuration so that we will be able to successfully boot
    our kernel on this hardware.


    ## Helper Script


    As mentioned near the beginning of this chapter, files and directories within
    `sysfs` change from one release of the kernel to another. Here is a script that
    is handy in determining the needed kernel driver and module module name for any
    device node in the system. It has been developed with the kernel developers responsible
    for `sysfs` and should successfully work on all future versions of the 2.6 kernel.


    For instance, it makes short work of the previous example, when you had to get
    all of the proper drivers for the `sda` block device:


    `$` **`get-driver.sh sda`**


    `looking at sysfs device: /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0:0`


    `found driver: sd`


    `found driver: ata_piix`


    I can also find all of the proper drivers needed for complex things such as USB-to-serial
    devices:


    `$` **`get-driver.sh ttyUSB0`**


    `looking at sysfs device: /sys/devices/pci0000:00/0000:00:1d.3/usb4/4-2/4-2.3/4-2.3:1.0/ttyUSB0`


    `found driver: pl2303 from module: pl2303`


    `found driver: pl2303 from module: pl2303`


    `found driver: usb from module: usbcore`


    `found driver: usb from module: usbcore`


    `found driver: usb from module: usbcore`


    `found driver: uhci_hcd from module: uhci_hcd`


    The script follows.


    `#!/bin/sh`


    `#`


    `# Find all modules and drivers for a given class device.`


    `#`


    `if [ $# != "1" ] ; then`


    `    echo`


    `    echo "Script to display the drivers and modules for a specified sysfs class
    device"`


    `    echo "usage: $0 <CLASS_NAME>"`


    `    echo`


    `    echo "example usage:"`


    `    echo "      $0 sda"`


    `    echo "Will show all drivers and modules for the sda block device."`


    `    echo`


    `    exit 1`


    `fi`


    `DEV=$1`


    `if test -e "$1"; then`


    `    DEVPATH=$1`


    `else`


    `    # find sysfs device directory for device`


    `    DEVPATH=$(find /sys/class -name "$1" | head -1)`


    `    test -z "$DEVPATH" && DEVPATH=$(find /sys/block -name "$1" | head -1)`


    `    test -z "$DEVPATH" && DEVPATH=$(find /sys/bus -name "$1" | head -1)`


    `    if ! test -e "$DEVPATH"; then`


    `        echo "no device found"`


    `        exit 1`


    `    fi`


    `fi`


    `echo "looking at sysfs device: $DEVPATH"`


    `if test -L "$DEVPATH"; then`


    `    # resolve class device link to device directory`


    `    DEVPATH=$(readlink -f $DEVPATH)`


    `    echo "resolve link to: $DEVPATH"`


    `fi`


    `if test -d "$DEVPATH"; then`


    `    # resolve old-style "device" link to the parent device`


    `    PARENT="$DEVPATH";`


    `    while test "$PARENT" != "/"; do`


    `        if test -L "$PARENT/device"; then`


    `            DEVPATH=$(readlink -f $PARENT/device)`


    `            echo "follow ''device'' link to parent: $DEVPATH"`


    `            break`


    `        fi`


    `        PARENT=$(dirname $PARENT)`


    `    done`


    `fi`


    `while test "$DEVPATH" != "/"; do`


    `    DRIVERPATH=`


    `    DRIVER=`


    `    MODULEPATH=`


    `    MODULE=`


    `    if test -e $DEVPATH/driver; then`


    `        DRIVERPATH=$(readlink -f $DEVPATH/driver)`


    `        DRIVER=$(basename $DRIVERPATH)`


    `        echo -n "found driver: $DRIVER"`


    `        if test -e $DRIVERPATH/module; then`


    `            MODULEPATH=$(readlink -f $DRIVERPATH/module)`


    `            MODULE=$(basename $MODULEPATH)`


    `            echo -n " from module: $MODULE"`


    `        fi`


    `        echo`


    `    fi`


    `    DEVPATH=$(dirname $DEVPATH)`


    `done`


    * * *


