    1 Gigabyte total physical RAM, answer `off` here (the default choice, and suitable
    for most users). This will result in a `3GB/1GB` split: 3GB are mapped so that
    each process sees a 3GB virtual memory space and the remaining part of the 4GB
    virtual memory space is used by the kernel to permanently map as much physical
    memory as possible.'
