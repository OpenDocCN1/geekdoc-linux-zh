  trans: "\n\n只有当你的机器是前列表中其他类型之一时，才应该选择 `PC-compatible`（PC 兼容）以外的选项。然而，如果你创建一个可以在所有所示类型的机器上运行的内核，请选择\
    \ `Generic architecture`（通用架构）选项。如果你没有选择 `Symmetric multi-processing support`（对称多处理支持），上述的某些选项可能不会出现。\n\
    \n选择处理器族类型。只有在之前的选项中选择了 `PC-compatible`，才能显示此子菜单：\n\n```\nProcessor type and features\n\
    \     Processor family\n          ( ) 386\n          ( ) 486\n          ( ) 586/K5/5x86/6x86/6x86MX\n\
    \          ( ) Pentium-Classic\n          ( ) Pentium-MMX\n          ( ) Pentium-Pro\n\
    \          ( ) Pentium-II/Celeron(pre-Coppermine)\n          ( ) Pentium-III/Celeron(Coppermine)/Pentium-III\
    \ Xeon\n          ( ) Pentium M\n          (X) Pentium-4/Celeron(P4-based)/Pentium-4\
    \ M/Xeon\n          ( ) K6/K6-II/K6-III\n          ( ) Athlon/Duron/K7\n     \
    \     ( ) Opteron/Athlon64/Hammer/K8\n          ( ) Crusoe\n          ( ) Efficeon\n\
    \          ( ) Winchip-C6\n          ( ) Winchip-2\n          ( ) Winchip-2A/Winchip-3\n\
    \          ( ) GeodeGX1\n          ( ) Geode GX/LX\n          ( ) CyrixIII/VIA-C3\n\
    \          ( ) VIA C3-2 (Nehemiah)\n          ( ) Generic x86 support\n```\n\n\
    关于此配置项的更多细节，请参考 M386，其中详细描述了如何根据你拥有的处理器以及你希望内核运行的机器范围来选择合适的处理器类型。\n\n## SMP\n\
    如果你的系统包含多个 CPU，或者是一个超线程或双核 CPU，你应该为 Linux 内核选择多处理器选项，以利用额外的处理器。如果不这样做，你将因为完全不使用其他处理器而浪费它们。\n\
    \n启用多处理器处理：\n\n```\nProcessor type and features\n     [*] Symmetric multi-processing\
    \ support\n```\n\n## Preemption\n作为服务器运行的系统其工作负载需求与用于视频和音频应用程序的桌面系统非常不同。内核允许不同的“抢占”（preemption）模式来处理这些不同的工作负载。抢占是指内核在执行其他任务时中断自身的能力，以便处理具有更高优先级的任务，例如更新音频或视频程序。\n\
    \n若要切换到不同的抢占模型，请使用此菜单：\n\n```\nProcessor type and features\n     Preemption Model\n\
    \          (X) No Forced Preemption (Server)\n     ( ) Voluntary Kernel Preemption\
    \ (Desktop)\n     ( ) Preemptible Kernel (Low-Latency Desktop)\n```\n\n如果你希望内核比通用抢占选项对高优先级任务的响应更快，你还可以允许对一个主要的内部内核锁之一进行中断：\n\
    \n```\nProcessor type and features\n     [*] Preempt The Big Kernel Lock\n```\n\
    \n只有在你已经选择了 `Preemptible Kernel`（可抢占内核）或 `Symmetric multi-processing support`选项后，才能选择此选项。\n\
    \n## Suspend\nLinux 内核具有将其挂起到磁盘的能力，允许你断开电源，然后在稍后时间开电，并从机器挂起时的位置准确恢复。此功能对于运行 Linux\
    \ 的笔记本电脑非常有用。\n\n通过选择以下项启用它：\n\n```\nPower management options (ACPI, APM)\n  \
    \   [*] Software Suspend\n```\n\n内核需要知道将挂起的内核镜像保存在哪里，以及以后从哪里恢复。该位置通常是磁盘上的内核交换分区。要指定该项应该是哪个分区：\n\
    \n```\nPower management options (ACPI, APM)\n     (/dev/hda3) Default resume partition\n\
    ```\n\n### Note\n确保你指定了用于挂起机器的正确分区，不要使用系统正在用于存储数据的分区。通过运行以下命令可以找到正确的分区名称：\n\n\
    ```bash\n/sbin/swapon -s | grep dev | cut -f 1 ' ' /dev/hda3\n```\n\n在内核内核选项中使用前一个命令的输出，并在指定内核应恢复位置的内核启动命令行中使用它。在机器挂起后，为了让其正常恢复，请向内核命令行传递\
    \ `resume=/dev/sda3` 以便使用正确的镜像。如果你不想恢复挂起的镜像，请使用 `noresume` 命令行。\n\n## CPU Frequency\
    \ Scaling\n大多数现代处理器都可以降低处理器的内部时钟以节省电量和电池寿命。Linux 支持这种能力并提供了多种调度器（governors）。不同的调度器实现不同的启发式算法，根据系统负载和其他变量来改变处理器速度。\n\
    \n启用基础频率缩放：\n\n```\nPower management options (ACPI, APM)\n     [*] Frequency scaling\n\
    ```\n\n选择你希望使用的不同类型的频率调度器：\n\n```\nPower management options (ACPI, APM)\n    \
    \ [*] Frequency scaling\n     [*] 'performance' governor\n     [*] 'powersave'\
    \ governor\n     [*] 'userspace' governor for userspace scaling\n     [*] 'ondemand'\
    \ cpufreq governor\n     [*] 'conservative' cpufreq governor\n```\n\n关于不同调度器作用的更多信息，请参\
    \ CPU_FREQ。\n\n选择你希望在机器启动时运行的默认调度器：\n\n```\nPower management options (ACPI, APM)\n\
    \     [*] Frequency scaling\n     Default CPUFreq governor\n```\n\n选择机器特定的处理器类型。关于如何确定机器的处理器类型，请参见\
    \ Processor Types。\n\n```\nPower management options (ACPI, APM)\n     [*] Frequency\
    \ scaling\n     --- CPUFreq drivers\n     [ ] ACPI Processor-States driver\n \
    \    [ ] AMD Mobile K6-2/K6-3 PowerNow!\n     [ ] AMD Mobile Athlon/Duron PowerNow!\n\
    \     [ ] AMD Opteron/Athlon64 PowerNow!\n     [ ] Cyrix MediaGX/NatSemi Geode\
    \ Suspend Modulation\n     [*] Enhanced SpeedStep\n     [*] Use ACPI tables to\
    \ decode valid frequency/voltage pairs\n     [*] Built-in tables for Banias CPUs\n\
    \     [ ] Intel Speedstep on ICH-M chipsets (ioport interface)\n     [ ] Intel\
    \ Speedstep on 440BX/ZX/MX chipsets (SMI interface)\n     [ ] Intel Pentium 4\
    \ clock modulation\n     [ ] nvidia nForce2 FSB changing\n     [ ] Transmeta LongRun\n\
    ```\n\n## Different Memory Models\n32 位 Intel 硬件上的 Linux 可以访问高达 64GB 的内存，但 32\
    \ 位处理器的地址空间只有 4GB。为了规避这一限制，Linux 可以将额外的内存映射到另一个区域，并在其他任务需要时切换过去。但如果你的机器内存较小，让\
    \ Linux 不必担心处理这些较大的区域会更容易，因此告诉内核你希望它支持的内存大小是有益的。关于此选项的更详细描述，请参见 NOHIGHMEM。\n\n\
    Linux 对 32 位 Intel 处理器支持三种不同的内存模型，取决于可用内存的大小：\n\n* 少于 1GB 的物理内存\n* 1GB 到 4GB 之间的物理内存。\n\
    * 大于 4GB 的物理内存。\n\n选择内存大小：\n\n```\nProcessor type and features\n     High Memory\
    \ Support\n          (X) off\n          ( ) 4GB\n          ( ) 64GB\n```\n\n"
