    using. You may want to check out the information provided in *Documentation/usb*
    and especially the links given in *Documentation/usb/usb-help.txt*.


    ## Name


    USB_EHCI_HCD — EHCI HCD (USB 2.0) support


    The Enhanced Host Controller Interface (EHCI) is standard for USB 2.0 "high speed"
    (480 Mbit/sec, 60 Mbyte/sec) host controller hardware. If your USB host controller
    supports USB 2.0, you will likely want to configure this Host Controller Driver.
