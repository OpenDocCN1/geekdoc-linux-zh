  trans: "\n\n`debugfs` 是一个虚拟文件系统，内核开发者将调试文件存放在其中。启用此选项可以对这些文件进行读写。\n\n## 名称\n\n`SECURITY`\
    \ — 启用不同的安全模型\n\n这允许你向内核中配置不同的安全模块。\n\n如果未选择此选项，将将使用默认的 Linux 安全模型。\n\n## 名称\n\
    \n`SECURITY_SELINUX` — NSA SELinux 支持\n\n此选项用于选择 NSA 安全增强型 Linux (SELinux)。你还需要策略配置和一个标记了标签的文件系统。你可以从\
    \ [`www.nsa.gov/selinux`](http://www.nsa.gov/selinux) 获取策略编译器（`checkpolicy`）、标记文件系统的工具（`setfiles`）以及示例策略配置。\n\
    \n# 附录 A. 有用的工具\n\n如本书所示，获取、构建、更新和维护 Linux 内核源码树树涉及许多不同的步骤。由于开发者天生是懒惰的生物，他们创建了一些程序来帮助他们完成各种例行任务。在这里，我们描述其中一些实用的工具以及使用它们的基础知识。\n\
    \nLinux 内核开发在许多方面都与传统的软件开发不同。对内核程序员的某些特殊要求包括：\n\n*   不断将你的更改应用于快速的内核开发发布计划这一移动目标中。\n\
    *   解决你所做的更改与他人更改之间的任何合并冲突。\n*   以其他格式导出你的更改，以便他人轻松合并和使用它。\n\n# patch 和 diff\n\
    \n进行内核工作最常用的方法之一是使用 `patch` 和 `diff` 程序。要使用这些工具，必须使用两个不同的目录树：一个“干净”的树和一个“工作”树。干净树是已发布的内核版本，而工作树基于相同的版本但包含了你的修改。然后，你可以使用\
    \ `patch` 和 `diff` 提取你的更改并将其向前迁移到新的内核发布版本。\n\n例如，按照第 3 章 中的描述，创建两个包含最新内核版本的目录：\n\
    \n```\n$ tar -zxf linux-2.6.19.tar.gz\n$ mv linux-2.6.19 linux-2.6.19-dirty\n\
    $ tar -zxf linux-2.6.19.tar.gz\n$ ls\n```\n\n`linux-2.6.19/`\n\n`linux-2.6.19-dirty/`\n\
    \n现在，在 `-dirty` 目录中进行你想要的所有不同更改，并保持干净的原始内核目录不变。完成更改后，你应该创建一个补丁（patch）将其发送给其他人：\n\
    \n```\n$ diff -Naur -X linux-2.6.19/Documentation/dontdiff linux-2.6.19/ linux-2.6.19-dirty/\
    \ > my_patch\n```\n\n这将创建一个名为 `my_patch` 的文件，其中包含你的工作与干净的 2.6.19 内核树之间的差异。然后，该补丁可以通过电子邮件发送给其他人。\n\
    \n## 新内核版本\n\n如果发布了新的内核版本，并且你想将你的更改迁移到新版本，你需要尝试将生成的补丁应用到干净的内核版本上。可以通过以下步骤完成：\n\
    \n1. 像上一个例子一样生成你的原始补丁。\n2. 使用来自 `kernel.org` 的官方补丁，将旧内核版本向前移动一个发布：\n   ```\n \
    \  $ cd linux-2.6.19\n   $ patch -p1 < ../patch-2.6.20\n   $ cd ..\n   $ mv linux-2.6.19\
    \ linux-2.6.19-dirty\n   ```\n   现在在 `-dirty` 目录中进行你想要的所有不同更改，并保持干净的原始内核目录不变。等等，我之前的一下：\n\
    \   ```\n   $ cd linux-2.6.19\n   $ patch -p1 < ../patch-2.6.20\n   $ cd ..\n\
    \   $ mv linux-2.6.19 linux-2.6.19-dirty\n   ```\n   使用来自 `kernel.org` 的官方补丁，将旧内核版本向前移动一个发布：\n\
    3. ..........\n\n..将将生成的补丁应用到干净的内核\n   ```\n   $\n linux-2.6.19-dirty\n   $ patch\
    \ -p1 < ../my_patch\n   ```\n   这将创建一个名为 `my_patch` 的文件，其中包含你的工作与干净的 2.6.19 内核树之间的差异。然后，该补丁可以通过电子邮件发送给其他人。\n\
