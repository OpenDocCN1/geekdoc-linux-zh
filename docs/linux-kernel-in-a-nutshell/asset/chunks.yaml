  trans: '

    在此选择 yes 将同时启用无线扩展（Wireless Extensions）（创建 `*/proc/net/wireless` 并启用 `iwconfig`
    访问）。无线扩展是一个通用的 API，允许驱动程序向用户空间暴露常见无线局域网的配置和统计数据。无线扩展提供了一套工具，可以支持所有变种无线局域网，无论其类型如何（只要驱动程序支持无线扩展）。另一个优势是，这些参数可以在不重启驱动程序或操作系统的情况下进行更改。如果你希望在无线
    PCMCIA 卡（PC-卡）上使用无线扩展，则需要在此处选择 yes。你可以从 [`www.hpl.hp.com/personal/Jean_Tourrilhes/Linux/Tools.html`](http://www.hpl.hp.com/personal/Jean_Tourrilhes/Linux/Tools.html)
    获取这些工具。


    ## PPP — PPP（点对点协议）支持


    PPP（点对点协议）通过电话（以及其他串口）线路发送互联网流量。请询问你的接入提供商他们是否支持它，否则你将无法使用。具有相同目的的旧协议称为 SLIP。如今大多数互联网接入提供商都支持
    PPP 而非 SLIP。


    要使用 PPP，你需要一个名为 `pppd` 的额外程序，如 PPP-HOWTO 所示，该程序可以在 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)。确保你拥有
    `Documentation/Changes` 中推荐的 `pppd` 版本。PPP 选项会将你的内核增大约 16 KB。


    实际上有两个版本的 PPP：用于异步线路（例如普通模拟电话线）的传统 PPP，以及同步 PPP（例如可用于数字 ISDN 线路）。如果你想通过电话线或其他异步串口使用
    PPP，则需要启用 `PPP support for async serial ports` 选项。


    ## PPPOE — 基于以太网的 PPP（实验性）


    对基于以太网的 PPP 支持。


    此驱动程序需要来自 `cvs.samba.org` CVS 仓库的最新版本 `pppd`。或者，参见 RoaringPenguin 包 [`www.roaringpenguin.com/pppoe`](http://www.roaringpenguin.com/pppoe)，它在“Kernel
    mode PPPoE”标题下包含了如何使用此驱动程序的说明。


    ## ISDN — ISDN 支持


    ISDN（“集成业务数字网络”，在法国被称为 RNIS）是一种特殊的全数字电话服务；它主要用于连接到你的互联网服务提供商（使用 SLIP 或 PPP）。ISDN
    的主要优势是速度比普通调制解调器/电话连接更快，并且可以在下载内容的同时进行语音通话。只有当你的电脑配备 ISDN 卡，且你和服务提供商都从电话公司购买了
    ISDN 线路时，它才能工作。详情请阅读 [`www.alumni.caltech.edu/~dank/isdn`](http://www.alumni.caltech.edu/~dank/isdn)。


    如果你希望内核支持 ISDN，请选择此选项。


    ## PHONE — Linux 电话支持


    如果你有电话卡（例如允许你使用普通电话进行 IP 语音应用），请在此处选择 yes。


    ***


    ### 注意


    此选项与调制解调器无关。你不需要为了在 Linux 下使用调制解调器在此处选择 yes。


    ***


    ## INPUT — 通用输入层（键盘、鼠标等所需）


    如果你的系统连接了任何输入设备（鼠标、键盘、平板板、摇杆、方向盘等）并希望应用程序可以使用它们，请在此处选择 yes。这包括标准的 PS/2 键盘和鼠标。


    如果你是无头系统（无显示器、无键盘），请在此处选择 no。


    更多信息请参见 `Documentation/input/input.txt` 文件。


    ## VT — 虚拟终端


    在此处选择 yes 以获得带有显示器和键盘设备的终端设备支持。这些被称为“虚拟”终端，因为你可以在一个物理终端上运行多个虚拟终端（也称为虚拟控制台）。


    至少一个虚拟终端设备才能使用你的键盘和显示器。因此，只有配置嵌入式系统的人才会想要在此处选择 no 以节省某些内存；此时登录此类系统的唯一方法是通过串口连接或网络连接。


    虚拟终端非常有用，例如，一个虚拟终端可以显示系统消息和警告，另一个可以用于文本模式的用户会话，第三个可以运行 X 会话，所有这些都可以并行运行。虚拟终端之间的切换通过某些组合键对（通常是
    Alt-功能键）完成。


    如果你不确定，请选择 yes，否则你将无法对 Linux 系统做很多操作。


    ## VT_CONSOLE — 虚拟终端控制台支持


    系统控制台是接收所有内核消息和警告并允许单用户模式登录的设备。如果你在此处回答 yes，虚拟终端（用于与物理终端交互的设备）可以作为系统控制台。这是最常见的运行模式，因此你应该说
    yes，除非你希望内核消息仅输出到串口（在这种情况下你还应该启用 `Console on 8250/16550 and compatible serial
    port` 选项）。


    如果你在此处说 yes，默认情况下当前可见的虚拟终端（*/dev/tty0`）将作为系统控制台。你可以使用内核命令行选项如 `console=tty3` 来更改它，该选项指定第三个虚拟终端为系统控制台。（有关如何在启动时向内核传递选项以及可用选项的详情，请参见第
    9 章。）


    ## SERIAL_8250 — 8250/16550 及兼容串口


    此选项选择你是否要包含标准串口驱动程序。标准答案是 yes。可能选择 no 的人是那些设置专用以太网/FTP 服务器的人，或者使用总线鼠标而非串口鼠标的用户。此外，Cyclades
    和 Stallion 多端口驱动程序不需要此驱动程序。


    ***


    ### 注意


    如果你在使用非标准串口，不要将此驱动编译为模块，因为配置信息会在驱动卸载时丢失。此限制未来可能会解除。


    ***


    大多数人会在此处选择 yes，以便使用连接到标准串口的鼠标、调制解调器和其他设备。


    ## AGP — /dev/agart AGP 支持


    AGP（加速图形接口）是一种用于将显卡连接到系统的总线系统。


    如果你有 AGP 系统并在此处选择 yes，就可以使用 3D 渲染显卡的 AGP 功能。此代码作为主板芯片组的“AGP 驱动程序”。


    如果你需要的纹理内存超过 AGP GART 能提供的（理论上高达 256 MB，但由于内核分配问题，实际上较少），你可以使用 PCI 访问并获得数 GB 的纹理空间。


    注意，这是 X 和 GLX 在 AGP 总线上使用带有 MTRR 支持的写入合并的唯一方法。如果没有此选项，OpenGL 直接渲染将慢得多，但仍比 PIO
    快。


    如果你想使用 GLX 或 DRI，你应该在此处选择 yes。


    ## DRM — 直接渲染管理器（支持 XFree66 4.1.0 及更高版本的 DRI）


    内核级对直接渲染基础设施（DRI）的支持在 XFree66 4.0 中引入。如果你在此处选择 yes，你需要从列表中选择适用于你显卡的模块。这些模块提供了同步、安全和
    DMA 传输的支持。详情请参见 [`dri.sourceforge.net`](http://dri.sourceforge.net)。你还应该选择并配置
    AGP (`*/dev/agpgart*) 支持。


    ## I2C — I2C 支持

