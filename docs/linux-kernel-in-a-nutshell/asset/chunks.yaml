  trans: '


    使用 CPUFreq `userspace` 用户空间调度器。这允许你手动设置 CPU 频率，并允许用户空间程序动态设置 CPU 频率，而无需你先手动启用用户空间调度器。


    ### CPU_FREQ_GOV_PERFORMANCE — “性能”模式 CPUFreq 策略调度器


    此 CPUFreq 策略调度器将频率静态设置为可用的最高 CPU 频率。


    ### CPU_FREQ_GOV_POWERSAVE — “省电”模式 CPUFreq 策略调度器


    此将频率静态设置为可用的最低 频率。


    ### CPU_FREQ_GOV_USERSPACE — “用户空间”模式 CPUFreq 策略调度器


    当你想要手动设置 CPU 频率，或者用户空间程序能够动态设置 CPU 频率时（例如 LART ([`www.lartmaker.nl`](http://www.lartmaker.nl))），请启用此
    CPUFreq 策略调度器。


    更多细节，请参阅 `Documentation/cpu-freq`。


    ### CPU_FREQ_GOV_ONDEMAND — “按需”模式 CPUFreq 策略调度器


    此驱动程序添加了一个动态 CPUFreq 策略调度器。调度器会轮询 CPU 并根据 CPU 利用率更改其频率。该调度器的支持取决于 CPU 进行快速频率切换的能力（即极低延迟的频率转换）。


    更多细节，请参阅 `Documentation/cpu-freq`。


    ### CPU_FREQ_GOV_CONSERVATIVE — “保守”模式 CPUFreq 策略调度器


    此驱动程序在源代码和目的上与 Ondemand 调度器相似。不同在于，Conservative 调度器针对电池供电的系统进行了优化。当需要速度时，频率会平滑地增加和减少，而不是直接跳跃到
    100%。


    如果你正在使用笔记本电脑、PDA 或基于 AMD64 的计算机（由于 CPU 在最小频率和最大频率转换之间存在不可接受的步进式延迟问题），你可能想要使用此调度器。如果你是台式机，请考虑使用
    Ondemand 调度器。


    更多细节，请参阅 `Documentation/cpu-freq`。


    ### PCI — PCI 支持


    PCI 是一种处理器用于与内部设备和扩展卡通信的总线系统。它非常常见，几乎于所有现代计算机中。


    除非你有特殊理由，否则请对此选项选择 yes。


    ### PCCARD — PCCard (PCMCIA/CardBus) 支持


    如果你想为 Linux 计算机连接 PCMCIA 卡或 PC 卡，请在此处选择 yes。这些是信用卡大小的设备，如网卡、调制解调器或硬盘，通常用于笔记本电脑。这些卡实际上有两种类型：16
    位 PCMCIA 卡和 32 位 CardBus 卡。


    ### PCMCIA — 16 位 PCMCIA 支持


    此选项启用对 16 位 PCMCIA 卡的支持。大多数较旧的 PC 卡都是这种 16 位的 PCMCIA 卡，所以除非你确定自己只在使用 32 位 CardBus
    卡，否则请在此处选择 yes。


    在大多数情况下，使用 16 位 PCMCIA 卡需要支持的软件。请查看文件 `Documentation/Changes` 获取位置和细节。


    ### CARDBUS — 32 位 CardBus 支持


    CardBus 是一种用于 PC 卡的总线主架构，允许支持 32 位 PC 卡（原始 PCMCIA 标准仅规定了 16 位宽总线）。许多较新的 PC 卡实际上是
    CardBus 卡。


    要使用 32 位 PC 卡，你还需要一个兼容 CardBus 的主机桥。几乎所有现代 PCMCIA 桥都支持这一点，且大多数它们都是“yenta 兼容”的，因此也启用该选项。


    ### HOTPLUG_PCI — 支持 PCI 热插拔（实验性）


    如果你的主板带有 PCI 热插拔控制器，请在此处选择 yes。这允许你在机器通电运行时添加和移除 PCI 卡。


    ### NET — 网络支持


    除非你有特殊理由，否则请在此处选择 yes。


    ### UNIX — Unix 域接字


    如果你在此处选择 yes，将包含 Unix 域接字的支持；域接字是建立网络连接的标准机制。


    ### INET — TCP/IP 网络


    这些是在互联网上使用的协议。强烈建议你在此处选择 yes，因为某些程序（即使机器没有连接到其他计算机）也会使用 TCP/IP。这会设置 `loopback`
    设备，内核内核约 144 KB。


    ### IP_ADVANCED_ROUTER — IP：高级路由


    如果你打算将 Linux 盒子作为路由器（即作为转发和分发数据包的计算机），请在此处选择 yes。你将获得关于路由的更精确控制选项。


    此此问题的答案不会直接影响内核：回答 no 只会导致跳过所有高级问题。


    注意，你的盒子只有在内核中启用 IP 转发后才能作为路由器；你可以通过对 /proc 文件系统支持和 Sysctl 支持选择 yes，并执行以下行：


    ```

    echo "1" > /proc/sys/ipv4/ip_forward

    ```


    在启动时挂载 /proc 文件系统后。如果你开启了 IP 转发，你还将获得 rp_filter，如果源地址的路由表项与其所在的接口不匹配，它会自动拒绝入包。这在安全方面具有优势，它可以防止
    IP 欺骗；但如果你使用不对称路由（你到主机的数据包与从主机到你的数据包路径不同）或者你运行一个在不同接口具有多个 IP 地址的非路由主机，可能会出现问题。要关闭
    rp_filter，请输入：


    ```

    echo 0 > /proc/sys/ipv4/conf/device/rp_filter

    ```


    或者


    ```

    echo 0 > /proc/sys/ipv4/conf/all/rp_filter

    ```


    ### NETFILTER — 网络包过滤


    Netfilter 是一个用于对通过你 Linux 盒子的网络包进行过滤和改写的框架。


    包过滤最常用的用法是运行 Linux 盒子作为防火墙，保护本地网络免受互联网的影响。此内核支持提供的防火墙类型被称为“包过滤器”，这意味着它可以根据类型、源、目的等拒绝单个网络包。另一种类型的防火墙是“基于代理的”的，它更安全但更具侵入性且设置更麻烦；它更仔细地检查网络流量，对其进行修改，并了解高层协议，而包过滤器缺乏这些。此外，代理防火墙通常需要对本地客户端运行的程序进行更改。代理防火墙不需要内核支持，但它们通常与包过滤器结合使用，而后者只有在你在此处选择
    yes 时才工作。


    '
- fmt: '

    You should also say yes here if you intend to use your Linux box as the gateway
    to the Internet for a local network of machines without globally valid IP addresses.
    This is called `masquerading`. If one of the computers on your local network wants
    to send something to the outside, your box can "masquerade" as that computer,
    i.e., it forwards the traffic to the intended outside destination, but modifies
    the packets to make it look like they came from the firewall box itself. Masquerading
    works both ways: if the outside host replies, the Linux box will silently forward
    the traffic to the correct local computer. This way, the computers on your local
    net are completely invisible to the outside world, even though they can reach
    the outside and can receive replies. It is even possible to run globally visible
    servers from within a masqueraded local network using a mechanism called port
    forwarding. Masquerading is also often called `NAT` (Network Address Translation).
    Other operating systems often call this term `PAT` (Port Address Translation).


    Another use of `Netfilter` is in transparent proxying: if a machine on the local
    network tries to connect to an outside host, your Linux box can transparently
    forward the traffic to a local server, typically a caching proxy server.


    Yet another use of `Netfilter` is building a bridging firewall. Using a bridge
    with Network packet filtering enabled makes `iptables` "see" the bridged traffic.
    For filtering on the lower network and Ethernet protocols over the bridge, use
    `ebtables` (located under bridge Netfilter configuration).


    Various modules exist for `Netfilter` that replace the previous masquerading (`ipmasqadm`),
    packet filtering (`ipchains`), transparent proxying, and portforwarding mechanisms.
    Please see `Documentation/Changes` under `iptables` for the location of these
    packages.


    Chances are that you should say yes here if you compile a kernel which will run
    as a router and no for regular hosts.


    ## Name: NET_SCHED — QoS and/or fair queueing


    When the kernel has several packets to send out over a network device, it has
    to decide which ones to send first, which ones to delay, and which ones to drop.
    This is the job of queueing disciplines. Several different algorithms for how
    to do this "fairly" have been proposed.


    If you say no here, you will get the standard packet scheduler, which is a `FIFO`
    (first come, first served) scheduler. If you say yes here, you will be able to
    choose from among several alternative algorithms that can then be attached to
    different network devices. This is useful, for example, if some of your network
    devices are real-time devices that need a certain minimum data flow rate, or if
    you need to limit the maximum data flow rate for traffic that matches specified
    criteria.


    To administer these schedulers, you''ll need the user-level utilities from the
    package `iproute2+tc` at [http://linux-net.osdl.org/index.php/Iproute2](http://linux-net.osdl.org/index.php/Iproute2).


    This Quality of Service (QoS) support will enable you to use Differentiated Services
    (`diffserv`) and Resource Reservation Protocol (`RSVP`) on your Linux router if
    you also say yes to the corresponding options. Documentation and software is at
    [http://diffserv.sourceforge.net](http://diffserv.sourceforge.net).


    ## Name: IRDA — IrDA (infrared) subsystem support


    Say yes here if you want to build support for the `IrDA` protocols. The Infrared
    Data Association specifies standards for wireless infrared communication and is
    supported by most laptops and PDAs.


    To use Linux support for the `IrDA` protocols, you will also need some user-space
    utilities such as `irattach`. For more information, see the file `Documentation/networking/irda.txt`.
    You also want to read the IR-HOWTO, available at [http://www.tldp.org/docs.html#howto](http://www.tldp.org/docs.html#howto).


    If you want to exchange bits of data (`vCal`, `vCard`) with a PDA, you will need
    to install an OBEX application, such as OpenObex from [http://sourceforge.net/projects/openobex](http://sourceforge.net/projects/openobex).


    ## Name: IRLAN — IrLAN protocol


    Say yes here if you want to build support for the `IrLAN` protocol. `IrLAN` emulates
    an Ethernet and makes it possible to put up a wireless LAN using infrared beams.


    The `IrLAN` protocol can be used to talk with infrared access points such as the
    HP NetbeamIR, or the ESI JetEye NET. You can also connect to another Linux machine
    running the `IrLAN` protocol for ad-hoc networking.


    ## Name: IRNET — IrNET protocol


    Say yes here if you want to build support for the `IrNET` protocol. `IrNET` is
    a PPP driver, so you will also need a working PPP subsystem (driver, daemon, and
    configuration).


    `IrNET` is an alternate way to transfer TCP/IP traffic over `IrDA`. It uses synchronous
    PPP over a set of point to point `IrDA` sockets. You can use it between Linux
    machines or with Windows.


    ## Name: IRCOMM — IrCOMM protocol


    Say yes here if you want to build support for the `IrCOMM` protocol. `IrCOMM`
    implements serial port emulation, and makes it possible to use all existing applications
    that understand `ttys` with infrared links. Thus, you should be able to use applications
    such as `PPP` and `minicom`.


    ## Name: IRDA_ULTRA — Ultra (connectionless) protocol


    Say yes here to support the connectionless Ultra IRDA protocol. `Ultra` allows
    to exchange data over `IrDA` with really simple devices (watch, beacon) without
    the overhead of the `IrDA` protocol (no handshaking, no management frames, simple
    fixed header). `Ultra` is available as a special socket:

    ```

    socket(AF_IRDA, SOCK_DGRAM, 1);

    ```


    ## Name: BT — Bluetooth subsystem support


    Bluetooth is low-cost, low-power, short-range wireless technology. It was designed
    as a replacement for cables and other short-range technologies such as `IrDA`.
    Bluetooth operates in personal area range typically extends up to 10 meters. More
    information about Bluetooth can be found at [http://www.bluetooth.com](http://www.bluetooth.com).


    The Linux Bluetooth subsystem consist of several layers:


    Bluetooth Core > HCI device and connection manager

    HCI Device drivers > Interface to the hardware

    SCO Module > SCO audio

    L2CAP Module > Logical Link Control and Adaptation Protocol

    RFCOMM Module > RFCOMM Protocol

    BNEP Module > Bluetooth Network Encapsulation Protocol

    CMTP Module > CAPI Message Transport Protocol

    HIDP Module > Human Interface Device Protocol


    To use the Bluetooth subsystem, you will need several user-space utilities such
    as `hciconfig` and `hcid`. These utilities and updates to Bluetooth kernel modules
    are provided in the BlueZ packages at [http://www.bluez.org](http://www.bluez.org).


    ## Name: IEEE80211 — Generic IEEE 802.11 Networking Stack


    This option enables the hardware-independent IEEE 802.11 networking stack.


    ## Name: MTD — Memory Technology Device (MTD) support


    Memory Technology Devices are flash, RAM, and similar chips, often used for solid-state
    file systems on embedded devices. This option provides the generic support for
    MTD drivers to register themselves with the kernel and for potential users of
    MTD devices to enumerate the devices present and obtain a handle on them. It also
    allows you to select individual drivers for particular hardware and users of MTD
    devices.


    ## Name: PARPORT — Parallel port support


    If you want to use devices connected to your machine''s parallel port (the connector
    at the computer with 25 holes), e.g. a printer, ZIP drive, or Parallel Line Internet
    Protocol (PLIP) link, you need to say yes here.


    Please read `Documentation/parport.txt` and `drivers/parport/BUGS-parport` for
    more information. For extensive information about drivers for many devices attaching
    to the parallel port, see [http://www.torque.net/linux-pp.html](http://www.torque.net/linux-pp.html).

    '
