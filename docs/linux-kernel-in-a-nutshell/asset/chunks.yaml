- fmt: "\nIf you wish to just use the latest kernel for your work, it is recommended\
    \ that you use the stable kernel releases. If you wish to help the kernel developers\
    \ test the features of the next kernel release and give them feedback, use the\
    \ development kernel release. For the purpose of this chapter, we will assume\
    \ that you are using a stable kernel release.\n\n# Where to find the kernel source\n\
    \nAll of the source code for the Linux kernel can be found on one of the `kernel.org`\
    \ sites, a worldwide network of servers that mirror the Linux source code, enabling\
    \ everyone to find a local server close to him. This allows the main kernel servers\
    \ to be responsive to the mirror sites, and lets users download the needed files\
    \ as quickly as possible.\n\nThe main [http://www.kernel.org](http://www.kernel.org)\
    \ site shows all of the current kernel versions for the various different kernel\
    \ trees, as shown in [Figure 3-2](#index_split_025.html_filepos112094).\n\n![The\
    \ main kernel.org web site](images/00003.png)\n\nFigure 3-2. The main kernel.org\
    \ web site\n\nTo download the latest stable kernel version, click on the `F` character\
    \ on the line for the kernel version. This will download the full source tree.\
    \ Or you can navigate to the proper subdirectory for all of the 2.6 kernel versions,\
    \ [http://www.us.kernel.org/pub/linux/kernel/v2.6/](http://www.us.kernel.org/pub/linux/kernel/v2.6/),\
    \ shown in [Figure 3-3](#index_split_025.html_filepos113109).\n\n![The 2.6 kernel\
    \ source directory](images/00004.png)\n\nFigure 3-3. The 2.6 kernel source directory\n\
    \nIt is also possible to download the kernel source from the command line, using\
    \ the `wget` or `curl` utilities, both of which should come with your Linux distribution.\n\
    \nTo download the 2.6.17.8 kernel version using `wget`, enter:\n\n```\n$ wget\
    \ http://www.kernel.org/pub/linux/kernel/v2.6/linux-2.6.17.8.tar.gz\n```\n\n```\n\
    --17:44:55  http://www.kernel.org/pub/linux/kernel/v2.6/linux-2.6.17.8.tar.gz\n\
    ```\n\n```\n          => linux-2.6.17.8.tar.gz'\n```\n\n```\nResolving www.kernel.org...\
    \ 204.152.191.5, 204.152.191.37\n```\n\n```\nConnecting to www.kernel.org|204.152.191.5|:80...\
    \ connected.\n```\n\n```\nHTTP request sent, awaiting response... 200 OK\n```\n\
    \n```\nLength: 51,707,742 (49M) [application/x-gzip]\n```\n\n```\n100%[=============================================>]\
