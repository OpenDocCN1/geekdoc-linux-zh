  trans: '

    Linux 内核通过提供钩子（hooks）并允许你构建自定义的模型来支持不同的安全模型。目前，只有少数模型带有默认内核源码树中，但新模型的开发者正在努力使其获得更广泛的认可。


    ## 默认 Linux 能力 (Capabilities)


    Linux 的标准安全模型是“能力”（capability）模型。除非你出于某些原因真的想运行不安全的内核，否则你应该始终选择此选项。


    要启用它：


    `Security options`

    `  [*] Enable different security models`

    `  [*]   Default Linux Capabilities`


    ## SELinux


    一种非常流行的安全模型被称为 SELinux。许多不同的 Linux 发行版都支持此模型。


    SELinux 要求必须启用网络选项。请参阅网络设置 来启用此项。


    SELinux 还要求在内核配置中启用审计（audit）。要执行此操作：


    `General setup`

    `  [*] Auditing support`


    此外，必须启用网络安全选项：


    `Security options`

    `  [*] Enable different security models`

    `  [*]   Socket and Networking Security Hooks`


    现在可以选择 SELinux 选项了：


    `Security options`

    `  [*] Enable different security models`

    `  [*]   NSA SELinux Support`


    还有许多你可能想要启用的单个 SELinux 选项。请参阅各个不同项目的帮助信息，以获取关于其功能的更多描述。


    `Security options`

    `  [*] Enable different security models`

    `  [*]   NSA SELinux Support`

    `  [ ]   NSA SELinux boot parameter`

    `  [ ]   NSA SELinux runtime disable`

    `  [*]   NSA SELinux Development Support`

    `  [*]   NSA SELinux AVC Statistics`

    `  (1)   NSA SELinux checkreqprot default value`


    # 内核调试 (Kernel debugging)


    各种不同的内核选项可以帮助调试内核内部发生的情况。以下是一些常用的选项列表，它们可能有助于发现关于内核工作原理的新知识，或帮助发现当前内核源码中的潜在问题。


    ### 内核日志时间戳


    内核向其日志文件输出大量范围的消息。可以通过查看系统日志文件（通常位于 `/var/log/messages`）或运行 `dmesg` 命令来查看这些消息。


    有时，确切知道这些消息何时创建的很有用。然而，`dmesg` 不会对其显示的事件添加任何时间戳，且 `/var/log/messages` 的时间分辨率仅到秒。你可以配置内核为每条消息分配一个时间戳，其精确度可以达到最小的可测量内核时间值（通常在微秒级）。


    要在内核消息上启用时间戳选项：


    `Kernel hacking``

    `  [*] Show timing information on printks`


    ### 魔术 SysRq 键 (Magic SysRq keys)


    键盘上的 `SysRq` 键可以在内核运行期间或崩溃后通过多种不同方式控制内核。


    要启用此选项：


    `Kernel hacking`

    `  [*] Magic SysRq key`


    有关由此选项触发的不同操作的完整描述，请参阅内核源码树中的 `Documentation/sysrq.txt` 文件。


    ### 调试文件系统 (Debug Filesystem)


    基于内存的文件系统可以输出许多不同的调试信息。该文件系统被称为 `debugfs`，可以通过以下方式启用：


    `Kernel hacking`

    `  [*] Debug filesystem`


    启用此选项并启动重新编译的内核后，它会创建目录 `/sys/kernel/debug`，作为用户挂载 `debugfs` 文件系统的位置。手动执行操作：


    ```bash

    mount -t debugfs none /sys/kernel/debug

    ```


    或通过向 `/etc/fstab` 文件中添加以下行，在启动时自动挂载文件系统：


    ```bash

    debugfs /sys/kernel/debug debugfs 0 0

    ```


    挂载 `debugfs` 后，`/sys/kernel/debug/` 目录下将出现大量不同的目录和文件。这些都是由内核动态生成的虚拟文件，类似于 `procfs`
    或 `sysfs` 中的文件。这些文件可以用于帮助调试不同的内核子系统，或者仅仅为了查阅以查看系统在运行时发生了什么。


    ### 通用内核调试 (General Kernel Debugging)


    这里有一些其他良好的内核配置选项，如果你想帮助内核开发者调试不同问题，或者只是通过查看这些选项打印的消息来了解更多关于内核原理的知识，你可能会启用它们。请注意，如果你启用了几乎任何这些选项，内核都会略微变，因此如果你注意到任何性能下降，你可能希望禁用这些选项。


    `Kernel hacking`

    `  [*] Kernel debugging`

    `  [*]   Detect Soft Lockups`

    `  [ ]   Collect scheduler statistics`

    `  [*]   Debug slab memory allocations`

    `  [*]   Memory leak debugging`

    `  [*]   Mutex detection`

    `  [*]   Spinlock debugging`

    `  [*]   Sleep-inside checking`

    `[ ]   kobject debugging`

    `[ ]   Highmem debugging`

    `[ ]   Compile the kernel with debug info


    # 内核启动命令行参数 (Kernel boot line parameters)


    有三种方法向内核传递选项并控制其行为：


    1. 在构建内核时。本书大部分内容都在讨论这些选项。

    2. 在启动内核时。通常参数是从 GRUB 或 LILO 配置等文件传递的。

    3. 在运行时，通过向 */proc* 和 */sys* 目录中的文件写入。


    本章描述了第二种方法。本章将启动选项划分为不同的逻辑部分。许多特定于架构的驱动选项未在此列出。要获取已知选项的完整列表，请查看 *Documentation/kernel-parameters.txt*。


    并非所有列出的选项都可用。大多数与子系统相关，只有当内核编译了这些子系统时才会起作用。它们也取决于与之相关的硬件。


    所有这些参数都是区分大小写的。


    # 模块特定选项 (Module-specific options)


    除了本章列出的选项外，编译进内核的模块参数可以通过命令行传递。（当然，动态加载的模块在内核启动时不在内存中，因此无法在启动时传递参数。）传递参数的语法为模块名后跟一个点（`.`）和参数。


    例如，`usbcore` 模块接受 `blinkenlights` 参数在所有支持 USB 2.0 集线器上闪烁灯（别说内核开发者没有幽默）。在动态加载模块时设置此参数，你可以输入：


    ```bash

    modprobe usbcore blinkenlights=1

    ```


    但如果 `usbcore` 模块是编译进内核的，你通过在调用内核时以下选项来实现相同的效果：


    ```bash

    usbcore.blinkenlights=1

    ```


    大多数编译进内核的模块选项也可以通过向 */sys/module/* 模块子目录下写入文件在运行时更改。因此，`blinkenlights` 由文件 */sys/module/usbcore/blinkenlights*
    表示。


    # 控制台选项 (Console options)


    这些选项处理控制台或内核日志，内核调试和错误信息在此显示。


    ## Name


    console — 输出控制台设备和选项。


    ## Synopsis


    `console=`


    ## Options


    `tty`*`n`*

    '
- fmt: '

    > Use the virtual console device `n`.


    `ttySn`[,`options`]` `ttyUSB0[,`options`]`


    > Use the specified serial port. The options are of the form `bbbbpnf`, where
    `bbbb` is the baud rate, `p` is parity (`n`, `o`, or `e`), `n` is number of bits,
    and `f` is flow control (`r` for RTS or omitted). Default is `9600n8`.See the
    file `Documentation/serial-console.txt` for more information on how to use a serial
    console. If you wish to have access to the kernel console information and do not
    have a serial port, see the `netconsole` command-line option.


    `uart,io,`addr`[,`options`]` `uart,mmio,`addr`[,`options`]`


    > Start an early, polled-mode console on the 8250/16550 UART at the specified
    I/O port or MMIO address, switching to the specified ttyS device later. The options
    are the same as for ttyS shown earlier.


    ## Name

    netconsole — Output console data across the network.


    ## Synopsis

    `netconsole=`[`src-port`]`@`[`src-ip`]``/`[`dev`]`,`[`target-port`]`@ `target-ip`
    `/`[`target-mac-address`]`


    Send kernel console data across the network using UDP packets to another machine.
    Options are:


    *`src-port`


    > Source port for the UDP packets. The default value is 6665.


    *`src-ip`


    > Source IP address of the interface to use.


    *`dev`


    > Network interface to use. `eth0` is an example. The network interface can also
    run normal network traffic, because the netconsole data is not intrusive and should
    cause no slowdown in other network operations.


    *`target-port`


    > Port that the logging agent will use. The default value is 6666.


    *`target-ip`


    > IP address for the logging agent.


    *`target-mac-address`


    > Ethernet MAC address for the logging agent.


    To listen to this data, the remote machine can use the `syslogd` program, or run
    the `netcat` program as follows:


    ```

    netcat -u -l -p

    ```


    *`port`


    For more background on how to use this option, see the file `Documentation/networking/netconsole.txt`.


    ## Name

    debug — Enable kernel debugging.


    Cause the kernel log level to be set to the debug level, so that all debug messages
    will be printed to the console at boot time.


    ## Name

    quiet — Disable all log messages.


    ## Synopsis

    `quiet`


    Set the default kernel log level to `KERN_WARNING` (4), which suppresses all messages
    during boot except extremely serious ones. (Log levels are defined under the `loglevel`
    parameter.)


    ## Name

    earlyprintk — Show early boot messages.


    ## Synopsis

    `earlyprintk=`[`vga`|`serial`][,`ttyS` `n`[,`baudrate`]][,`keep]`


    Show kernel log messages that precede the initialization of the traditional console.
    These messages are typically never seen on the console unless you use this option.
    Enabling this can be very useful for tracking down hardware issues. Currently,
    the option can specify either the VGA device or the serial port, but not both
    at the same time. Also, only the `ttyS0` or `ttyS1` serial devices will work.
    Interaction with the standard serial driver is not very good, and the VGA output
    will eventually be overwritten by the real console.


    Append `,keep` in order not to disable the messages shown by this option when
    the real kernel console is initialized and takes over the system.


    ## Name

    loglevel — Set the default console log level.


    ## Synopsis

    `loglevel=` `level`


    Specify the initial console log level. Any log messages with levels less than
    this (that is, of higher priority) will be printed to the console, whereas any
    messages with levels equal to or greater than this will not be displayed.


    The console log level can also be changed by the `klogd` program, or by writing
    the specified level to the `/proc/sys/kernel/printk` file.


    The kernel log levels are:


    `0 (KERN_EMERG)`


    > The system is unusable.


    `1 (KERN_ALERT)`


    > Actions that must be taken of of immediately.


    `2 (KERN_CRIT)`


    > Critical conditions.


    `3 (KERN_ERR)`


    > Non-critical error conditions.


    `4 (KERN_WARNING)`


    > Warning conditions that should be taken care of.


    `5 (KERN_NOTICE)`


    > Normal, but significant events.


    `6 (KERN_INFO)`


    > Informational messages that require no action.


    `7 (KERN_DEBUG)`


    > Kernel debugging messages, output by the kernel if the developer enabled debugging
    at compile time.


    ## Name

    log_buf_len — Set the size of the kernel log buffer.


    ## Synopsis

    `log_buf_len=` `n`[`KMG`]`


    Set the size of the kernel''s internal log buffer. `n` must be a power of 2, if
    not, it will be rounded up to a power of two. This value can be changed by `CONFIG_LOG_BUF_SHIFT`.


    ## Name

    initcall_debug — Debug the initcall functions.


    Cause the kernel to trace all functions called during initialization. This option
    is useful for identifying slow boots.


    ## Name

    kstack — How many words of the stack print.


    ## Synopsis

    `kstack=` `n`


    Specify how many words from the stack should be printed in oops.


    ## Name

    time — Show timing data on every kernel message.


    ## Synopsis

    `time`


    Cause the kernel to prefix every log message with a timestamp.


    ## Name

    apic — Change the verbosity of APIC subsystem.


    ## Synopsis

    `apic=`[`quiet`|`verbose`|`debug`]


    Control how much information the APIC generates when booting.


    ## Name

    noapic — Do not use any IOAPICs.


    Prevent the kernel from using IOAPICs that might be present.


    ## Name

    lapic — Enable the local APIC.


    Cause the kernel to enable the local APIC even if the BIOS had disabled it.


    ## Name

    nolapic — Do not use the local APIC.


    Tell the kernel not to use the local APIC.


    ## Name

    noirqbalance — Disable kernel IRQ balancing.


    Disable all of the built-in IRQ balancing logic.


    ## Name

    irqfixup — Basic fix to interrupt problems.


    When an interrupt is not handled, search all interrupt handlers for it. This is
    intended to get systems with badly firmware running.


    ## Name

    irqpoll — Extended fix to interrupt problems.


    When an interrupt is not handled, search all interrupt handlers for it and also
    check all handlers on timer interrupt.


    ## Name

    noirqdebug — Disable unhandled interrupt detection.


    By default, the kernel attempts to detect and disable unhandled interrupt sources
    because they can cause problems with the responsiveness of the rest of the kernel
    if left unchecked. This option will disable this logic.


    ## Name

    highmem — Specify the size of the highmem zone.


    ## Synopsis

    `highmem=` `n`


    Force the highmem memory zone to have an exact size of `n` bytes. This will work
    even on boxes that have no highmem zones by default. It can also reduce the size
    of the highmem zone for machines with a lot of memory.


    ## Name

    hugepages — Set the number of hugetlb pages.


    ## Synopsis

    `hugepages=` `n`


    The hugetlb feature lets you configure Linux to use 4MB pages, one thousand times
    the default size. If Linux is configured this way, this options sets the maximum
    number of hugetlb pages.


    ## Name

    ihash_entries — Set the number of inode hash buckets.


    ## Synopsis

    `ihash_entries=` `n`


    Override the default number of hash buckets for the kernel''s inode cache. Recommended
    only for kernel experts.


    ## Name

    max_addr — Ignore memory.


    ## Synopsis

    `max_addr=` `n`

