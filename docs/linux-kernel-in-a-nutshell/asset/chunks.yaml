  trans: "\n我们关注文件系统的类型，它显示在 `type` 单词之后。在示例中，它是 `ext3`。这是根分区正在使用的文件系统类型。进入内核配置系统，并按照文件系统中的描述启用此文件系统类型。\n\
    \n### 磁盘控制器\n\n在之前显示的 `mount` 命令的输出中，行的第一部分显示了根文件系统挂载在哪个设备上。在示例中，它是 `/dev/sda2`。现在文件系统已经在你的内核中经过正确配置，你还必须确保此块设备也能正常工作。要找出需要哪些驱动，你需要再次查看\
    \ `sysfs`。\n\n所有的块设备都出现在 `sysfs` 的 `/sys/block/` 或 `/sys/class/block/` 中，取决于你使用的内核版本。在任何一个位置，块设备都是树结构，不同的分区是主设备的子节点：\n\
    \n```bash\n$ tree -d /sys/block/ | egrep \"hd|sd\"\n|-- hdc\n|-- hdd\n|-- sda\n\
    \     |-- sda1\n     |-- sda2\n     |-- sda3\n```\n\n根据 `mount` 命令中的信息，你需要确保 `sda2`\
    \ 设备已正确配置。因为这是一个分区（磁盘分区是有编号的，而主块设备没有），因此必须对整个 `sda` 设备进行配置。（如果没有主块设备，就无法访问该设备上的各个分区。）\n\
    \n`sda` 块设备的表示方式与我们在本节早些看到的网络设备相同。在设备目录中有一个名为 `device` 的符号链接，它指向控制此块设备的逻辑设备：\n\
    \n```bash\n$ ls -l /sys/block/sda\n...\ndevice -> ../../../devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0:0\n\
    ...\n```\n\n现在，你需要开始在 `sysfs` 的设备链中向上查找，以确定是哪个驱动程序在控制此设备：\n\n```bash\n$ ls -l\
    \ /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0\n...\ndriver ->\
    \ ../../../../../../bus/scsi/drivers/sd\n...\n```\n\n在这里我们看到 SCSI 磁盘控制器驱动程序负责使此设备工作。因此我们知道需要在内核配置中配置\
    \ SCSI 磁盘支持。\n\n继续在 `sysfs` 目录链中向上查找，寻找控制硬件的驱动程序所在：\n\n```bash\n$ ls -l /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0\n\
    ...\n```\n此目录下没有名为 `driver` 的链接，所以再向上跳一级：\n\n```bash\n$ ls -l /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0\n\
    ...\n```\n同样，没有驱动程序。继续向上跳一级：\n\n```bash\n$ ls -l /sys/devices/pci0000:00/0000:00:1f.2\n\
    ...\ndriver -> ../../../bus/pci/drivers/ata_piix\n```\n这就是我们需要确保在内核配置中的磁盘控制器。我们需要在内核配置中启用\
    \ `ext3`、`sd` 和 `ata_piix` 驱动，以便我们能够启动硬件。\n\n### 辅助脚本\n\n正如本章开头提到的，`sysfs` 内部的文件和目录会随内核版本的发布而变化。这里有一个脚本，用于确定系统中任何设备所需的驱动程序和模块名称。它是与\
    \ `sysfs` 的内核开发者共同开发的，应该适用于 2.6 内核的所有后续版本。例如，它可以完成之前示例的工作，即当你需要为 `sda` 块设备获取所有正确的驱动时：\n\
    \n```bash\n$ get-driver.sh sda\nlooking at sysfs device: /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0\n\
    found driver: sd\nfound driver: ata_piix\n```\n\n我还可以为像 USB 转串口设备这样的复杂设备找到所有正确的驱动程序：\n\
    \n```bash\n$ get-driver.sh ttyUSB0\nlooking at sysfs device: /sys/devices/pci0000:00/0000:00:1d.3/usb/4-2/4-2.3/4-2.3:1.0/ttyUSB0\n\
    found driver: pl2303 from module: pl2303\nfound driver: pl2303 from module: pl2303\n\
    found driver: usb from module: usbcore\nfound driver: usb from module: usbcore\n\
    found driver: usb from module: usbcore\nfound driver: uhci_hcd from module: uhci_hcd\n\
    ```\n\n```sh\n#!/bin/sh\n#\n# 为给定设备查找所有模块和驱动。\n#\nif [ $# != \"1\" ] then\n  \
    \  echo\n    echo \"显示指定 sysfs 类设备驱动程序和模块的脚本\"\n    echo \"usage: $0 <CLASS_NAME>\"\
    \n    echo\n    echo \"示例用法:\"\n    echo \"    sda\"\n    echo \"将显示 sda 块设备的所有驱动和模块。\"\
    \n    echo\n    exit 1\nfi\nDEV=$1\nif test -e \"$1\"; then\n    DEVPATH=$1\n\
    else\n    # 查找设备的 sysfs 设备目录\n    DEVPATH=$(find /sys/class -name \"$1\" | head\
    \ -1)\n    test -z \"$DEVPATH\" && DEVPATH=$(find /sys/block -name \"$1\" | head\
    \ -1)\n    test -z \"$DEVPATH\" && DEVPATH=$(find /sys/bus -name \"$1\" | head\
    \ -1)\n    if ! test -e \"$DEVPATH\"; then\n        echo \"未找到设备\"\n        exit\
    \ 1\n    fi\nfi\necho \"looking at sysfs device: $DEVPATH\"\nif test -L \"$DEVPATH\"\
    ; then\n    # 解析类设备链接到设备目录\n    DEVPATH=$(readlink -f $DEVPATH)\n    echo \"resolve\
    \ link to: $DEVPATH\"\nfi\nif test -d \"$DEVPATH\"; then\n    # 将旧式的 \"device\"\
    \ 链接解析到父设备\n    PARENT=\"$DEVPATH\";\n    while test \"$PARENT\" != \"/\"; do\n\
    \        if test -L \"$PARENT/device\"; then\n            DEVPATH=$(readlink -f\
    \ $PARENT/device)\n            echo \"follow 'device' link to parent: $DEVPATH\"\
    \n            break\n        fi\n        PARENT=$(dirname $PARENT)\n    done\n\
    fi\n# (等待，提示中提供的脚本被截断/弄乱了，我将重新格式化提供的文本逻辑)\n```\n"
- fmt: "\nTo use a USB storage device (commonly referred to as USB \"flash\" device,\
    \ or an external USB disk drive) USB support must be first working properly. Refer\
    \ to the recipe in [USB](#index_split_069.html_filepos281663) for how to do this.\n\
    \nA USB storage device can be identified by using the `lsusb` program. If the\
    \ following command sequence produces the results shown, a USB storage device\
    \ is present on the system:\n\n```\n$ /usr/sbin/lsusb -v | grep Storage\n    \
    \  bInterfaceClass         8 Mass Storage\n```\n\nEnable it as follows.\n\n1.\
    \ A USB Storage device is in reality a USB SCSI device that talks over a USB connection.\
    \ Because of this, the SCSI subsystem must be enabled: `Device Drivers`\n   ```\n\
    \      SCSI Device Support\n          [*] SCSI Device Support\n   ```\n\n2. Also\
    \ in the SCSI system, the \"SCSI disk support\" must be enabled in order for the\
    \ device to be mounted properly: `Device Drivers`\n   ```\n    SCSI Device Support\n\
    \        [*] SCSI disk support\n   ```\n\n3. Enable USB Storage support: `Device\
    \ Drivers`\n   ```\n    USB Support\n    [M] USB Mass Storage support\n   ```\n\
    \nA number of specific USB storage devices are listed as separate configuration\
    \ items, as they do not follow the standard USB specification and require special\
    \ code. If you have one of these devices, please enable support for them.\n\n\
    ## IDE Disks\n\nIDE disks are the most common type of PC disks. The device that\
    \ enables them to work properly is an IDE disk controller. To determine if you\
    \ have a IDE disk controller on the system, use the `lspci` command in the following\
    \ manner:\n\n```\n$ /usr/sbin/lspci | grep IDE\n00:1f.1 IDE interface: Intel Corporation\
    \ 82801EB/ER (ICH5/ICH5R) IDE Controller (rev 02)\n00:1f.2 IDE interface: Intel\
    \ Corporation 82801EB (ICH5) SATA Controller (rev 02)\n```\n\nNote that your response\
    \ will probably not be identical; what is important is that the command shows\
    \ some an IDE Controller (the first device in the previous example.) If you find\
    \ only SATA controllers, please see [Serial ATA (SATA)](#index_split_066.html_filepos274218).\n\
    \nEnable PCI support for the kernel:\n\n```\nBus options (PCI, PCMCIA, EISA, MCA,\
    \ ISA)\n    [*] PCI Support\n```\n\nEnable the IDE subsystem, and IDE support:\n\
    \n```\nDevice Drivers\n    [*] ATA/ATAPI/MFM/RLL support\n    [*]   Enhanced IDE/MFM/RLL\
    \ disk/cdrom/tape/floppy support\n```\n\nIn the ATA system, the specific type\
    \ of IDE controller that you have must be enabled in order for it to work properly.\
    \ To provide a good backup in case choose the wrong type, select the \"generic\"\
    \ IDE controller:\n\n```\nDevice Drivers\n    ATA/ATAPI/MFM/RLL support\n    \
    \    [*] generic/default chipset support\n```\n\nEnable the different PCI controllers:\n\
    \n```\nDevice Drivers\n    ATA/ATAPI/MFM/RLL support\n        [*] IDE chipset\
    \ support\n```\n\nThis opens up a lengthy submenu of the different IDE controller.\
    \ Select the proper one based on the name of device found in `lspci`.\n\n## Serial\
    \ ATA (SATA)\n\nSATA is a type of disk controller that is the successor to the\
    \ IDE disk controller. To determine if you have a SATA disk controller on the\
    \ system, run the following command:\n\n```\n$ /usr/sbin/lspci | grep SATA\n00:1f.2\
    \ IDE interface: Intel Corporation 82801EB (ICH5) SATA Controller (rev 02)\n```\n\
    \nNote that your response will probably not be identical; what is important that\
    \ the command shows some SATA. SATA disks use kernel library called `libata` that\
    \ handles most of the SATA-specific functionality. That library uses the SCSI\
    \ layer to talk to block layer, so many different kernel options need be enabled\
    \ in order for SATA disks to work properly. Enable PCI support for the kernel:\n\
    \n```\nBus options (PCI, PCMCIA, EISA, MCA, ISA)\n    [*] PCI Support\n```\n\n\
    Enable the SCSI subsystem:\n\n```\nDevice Drivers\n    SCSI Device Support\n \
    \   [*] SCSI Device Support\n```\n\nAlso in the SCSI system, the \"SCSI disk support\"\
    \ must be enabled in order for the device to mounted properly:\n\n```\nDevice\
    \ Drivers\n    SCSI Device Support\n    [*] SCSI disk support\n```\n\nThe SATA\
    \ options are under the \"SCSI low-level drivers\" section:\n\n```\nDevice Drivers\n\
    \    SCSI Device Support\n    SCSI low-level drivers\n    [*] Serial ATA (SATA)\
    \ support\n```\n\nIn that section, enable the specific SATA controller type that\
    \ you have. Look at the output of the previously mentioned `lspci` command for\
    \ a list of the types of SATA controllers that are present on your system. For\
    \ example, most motherboards from Intel require the PIIX/ICH SATA driver (as the\
    \ previous example.)\n\n```\nDevice Drivers\n    SCSI Device Support\n    SCSI\
    \ low-level drivers\n        [*] Serial ATA (SATA) support\n        [*] Intel\
    \ PIIX/ICH SATA support\n```\n\n## Burning a CD-ROM\n\nBurning a CD-ROM is very\
    \ simple on Linux. If your kernel can support reading from a CD-ROM, it can also\
    \ support burning a CD-ROM. There are two ways to enable CD-ROM support in Linux,\
    \ one for IDE drives and one for SCSI and SATA drives.\n\n### IDE CD-ROM drives\n\
    \nIDE CD-ROM drives are controlled by the same IDE controller as your main IDE\
    \ disk drives. Make sure the IDE controller is properly supported as described\
    \ in [IDE Disks](#index_split_065.html_filepos27132). If it is properly supported,\
    \ then only other configuration item need be selected:\n\n```\nDevice Drivers\n\
    \    [*] ATA/ATAPI/MFM/RLL support\n    [*]   Enhanced IDE/MFM/RLL disk/cdrom/tape/floppy\
    \ support\n    [M]   Include IDE/ATAPI CDROM support\n```\n\n### SCSI and SATA\
    \ CD-ROM drives\n\nSATA and SCSI CD-ROM drives are controlled by the same controller\
    \ as your main disk drives. Make sure the SATA or SCSI controller is properly\
    \ supported. For SATA disks, see [Serial ATA (SATA)](#index_split_066.html_filepos274218).\n\
    \nTo support SATA or SCSI CD-ROM drives, the SCSI CD-ROM driver must be enabled:\n\
    \n```\nDevice Drivers\n    SCSI Device Support\n        [*] SCSI CDROM support\n\
    ```\n\nOnce that is enabled, the SATA or SCSI CD-ROM drive should work properly.\n\
    \n***\n\nAlmost all distributions place the `lspci` program in the `/usr/sbin/`\
    \ directory, but some place it in other locations. To find out where it is located,\
    \ do:\n\n```\n$ which lspci\n/usr/sbin/lspci\n```\n\nIf you are using a distribution\
    \ that puts it somewhere else, please use that path for whenever we discuss using\
    \ `lspci`\n\n# Devices\n\nLinux supports a vast range of different types of devices\
    \ (more than any other operating system ever has). This section shows how to enable\
    \ some of the more common types.\n\n## USB\n\nLinux supports many different types\
    \ of USB devices. To enable USB support, you must first enable support for a USB\
    \ controller, which drives the USB connection on the machine.\n\nTo determine\
    \ if machine has a USB controller, and which type it is, run the following command:\n\
    \n```\n$ /usr/sbin/lspci | grep USB\n00:1d.0 USB Controller: Intel Corporation\
    \ 82801EB/ER (ICH5/ICH5R) UHCI Controller #1 (rev 02)\n00:1d.1 USB Controller:\
    \ Intel Corporation 82801EB/ER (ICH5/ICH5R) UHCI Controller #2 (rev 02)\n00:1d.2\
    \ USB Controller: Intel Corporation 82801EB/ER (ICH5/ICH5R) UHCI Controller #3\
    \ (rev 02)\n00:1d.3 USB Controller: Intel Corporation 82801EB/ER (ICH5/ICH5R)\
    \ UHCI Controller #4 (rev 02)\n00:1d.7 USB Controller: Intel Corporation 82801EB/ER\
    \ (ICH5/ICH5R) USB2 EHCI Controller (rev 02)\n```\n\nNote that your response will\
    \ probably not be identical; what is important that the command shows some USB\
    \ controllers.\n\nEnable PCI support for the kernel:\n\n```\nBus options (PCI,\
    \ PCMCIA, EISA, MCA, ISA)\n    [*] PCI Support\n```\n\nEnable USB support for\
    \ the kernel:\n\n```\nDevice Drivers\n    USB Support\n    [M] Support for Host-side\
    \ USB\n```\n\nEnable the specific USB Host controllers for your machine (it is\
    \ safe to enable them all if you do not know which you have):\n\n```\nDevice Drivers\n\
    \    USB Support\n    ---  USB Host Controller Drivers\n    [M]  EHCI HCD (USB\
    \ 2.0) support\n```\n"
  raw: "To use a USB storage device (commonly referred to as USB \"flash\" device,\
    \ or an external USB disk drive) USB support must be first working properly. Refer\
    \ to the recipe in [USB](#index_split_069.html_filepos281663) for how to do this.\n\
    \nA USB storage device can be identified by using the *lsusb* program. If the\
    \ following command sequence produces the results shown, a USB storage device\
    \ is present on the system:\n\n`$` **`/usr/sbin/lsusb -v | grep Storage`**\n\n\
    `      bInterfaceClass         8 Mass Storage`\n\nEnable it as follows.\n\n1.\
    \  A USB Storage device is in reality a USB SCSI device that talks over a USB\
    \ connection. Because of this, the SCSI subsystem must be enabled:`Device Drivers`\n\
    \n    `    SCSI Device Support`\n\n    `        [*] SCSI Device Support`\n\n2.\
    \  Also in the SCSI system, the \"SCSI disk support\" must be enabled in order\
    \ for the device to be mounted properly:`Device Drivers`\n\n    `    SCSI Device\
    \ Support`\n\n    `        [*] SCSI disk support`\n\n3.  Enable USB Storage support:`Device\
    \ Drivers`\n\n    `    USB Support`\n\n    `    [M] USB Mass Storage support`\n\
    \nA number of specific USB storage devices are listed as separate configuration\
    \ items, as they do not follow the standard USB specification and require special\
    \ code. If you have one of these devices, please enable support for them.\n\n\
    ## IDE Disks\n\nIDE disks are the most common type of PC disks. The device that\
    \ enables them to work properly is an IDE disk controller. To determine if you\
    \ have a IDE disk controller on the system, use the *lspci* command in the following\
    \ manner: ^([[13](#index_split_067.html_filepos280208)])\n\n`$` **`/usr/sbin/lspci\
    \ | grep IDE`**\n\n`00:1f.1 IDE interface: Intel Corporation 82801EB/ER (ICH5/ICH5R)\
    \ IDE Controller (rev 02)`\n\n`00:1f.2 IDE interface: Intel Corporation 82801EB\
    \ (ICH5) SATA Controller (rev 02)`\n\nNote that your response will probably not\
    \ be identical; what is important is that the command shows some an IDE Controller\
    \ (the first device in the previous example.) If you find only SATA controllers,\
    \ please see [Serial ATA (SATA)](#index_split_066.html_filepos274218).\n\nEnable\
    \ PCI support for the kernel:\n\n`Bus options (PCI, PCMCIA, EISA, MCA, ISA)`\n\
    \n`    [*] PCI Support`\n\nEnable the IDE subsystem, and IDE support:\n\n`Device\
    \ Drivers`\n\n`    [*] ATA/ATAPI/MFM/RLL support`\n\n`    [*]   Enhanced IDE/MFM/RLL\
    \ disk/cdrom/tape/floppy support`\n\nIn the ATA system, the specific type of IDE\
    \ controller that you have must be enabled in order for it to work properly. To\
    \ provide a good backup in case you choose the wrong type, select the \"generic\"\
    \ IDE controller:\n\n`Device Drivers`\n\n`    ATA/ATAPI/MFM/RLL support`\n\n`  \
    \      [*]     generic/default IDE chipset support`\n\nEnable the different PCI\
    \ IDE controllers:\n\n`Device Drivers`\n\n`    ATA/ATAPI/MFM/RLL support`\n\n\
    `        [*]     PCI IDE chipset support`\n\nThis opens up a lengthy submenu of\
    \ the different IDE controller types. Select the proper one based on the name\
    \ of the device you found in the lspci step.\n\n## Serial ATA (SATA)\n\nSATA is\
    \ a type of disk controller that is the successor to the IDE disk controller.\
    \ To determine if you have a SATA disk controller on the system, run the following\
    \ command:\n\n`$` **`/usr/sbin/lspci | grep SATA`**\n\n`00:1f.2 IDE interface:\
    \ Intel Corporation 82801EB (ICH5) SATA Controller (rev 02)`\n\nNote that your\
    \ response will probably not be identical; what is important is that the command\
    \ shows some SATA devices.\n\nSATA disks use a kernel library called *libata*\
    \ that handles most of the SATA-specific functionality. That library uses the\
    \ SCSI layer to talk to the block layer, so many different kernel options need\
    \ to be enabled in order for SATA disks to work properly. Enable PCI support for\
    \ the kernel:\n\n`Bus options (PCI, PCMCIA, EISA, MCA, ISA)`\n\n`    [*] PCI Support`\n\
    \nEnable the SCSI subsystem:\n\n`Device Drivers`\n\n`    SCSI Device Support`\n\
    \n`        [*] SCSI Device Support`\n\nAlso in the SCSI system, the \"SCSI disk\
    \ support\" option must be enabled in order for the device to be mounted properly:\n\
    \n`Device Drivers`\n\n`    SCSI Device Support`\n\n`        [*] SCSI disk support`\n\
    \nThe SATA options are under the \"SCSI low-level drivers\" section:\n\n`Device\
    \ Drivers`\n\n`    SCSI Device Support`\n\n`        SCSI low-level drivers`\n\n\
    `            [*] Serial ATA (SATA) support`\n\nIn that section, enable the specific\
    \ SATA controller type that you have. Look at the output of the previously mentioned\
    \ *lspci* command for a list of the types of SATA controllers that are present\
    \ on your system. For example, most motherboards from Intel require the PIIX/ICH\
    \ SATA driver (as the previous example showed.)\n\n`Device Drivers`\n\n`    SCSI\
    \ Device Support`\n\n`        SCSI low-level drivers`\n\n`            [*] Serial\
    \ ATA (SATA) support`\n\n`            [*]   Intel PIIX/ICH SATA support`\n\n##\
    \ Burning a CD-ROM\n\nBurning a CD-ROM is very simple on Linux. If your kernel\
    \ can support reading from a CD-ROM, it can also support burning a CD-ROM. There\
    \ are two ways to enable CD-ROM support in Linux, one for IDE drives and one for\
    \ SCSI and SATA drives.\n\n### IDE CD-ROM drives\n\nIDE CD-ROM drives are controlled\
    \ by the same IDE controller as your main IDE disk drives. Make sure the IDE controller\
    \ is properly supported as described in [IDE Disks](#index_split_065.html_filepos271132).\
    \ If it is properly supported, then only one other configuration item need to\
    \ be selected:\n\n`Device Drivers`\n\n`    [*] ATA/ATAPI/MFM/RLL support`\n\n\
    `    [*]   Enhanced IDE/MFM/RLL disk/cdrom/tape/floppy support`\n\n`    [M]  \
    \   Include IDE/ATAPI CDROM support`\n\n### SCSI and SATA CD-ROM drives\n\nSATA\
    \ and SCSI CD-ROM drives are controlled by the same controller as your main disk\
    \ drives. Make sure the SATA or SCSI controller is properly supported. For SATA\
    \ disks, see [Serial ATA (SATA)](#index_split_066.html_filepos274218).\n\nTo support\
    \ SATA or SCSI CD-ROM drives, the SCSI CD-ROM driver must be enabled:\n\n`Device\
    \ Drivers`\n\n`    SCSI Device Support`\n\n`        [*] SCSI CDROM support`\n\n\
    Once that is enabled, the SATA or SCSI CD-ROM drive should work properly.\n\n\
    * * *\n\n^([[13](#index_split_065.html_filepos271560)]) Almost all distributions\
    \ place the *lspci* program in the */usr/sbin/* directory, but some place it in\
