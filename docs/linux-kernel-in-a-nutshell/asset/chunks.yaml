    # Linux Kernel in a Nutshell


    ### Greg Kroah-Hartman


    #### Editor

    ### Andy Oram


    Copyright © 2009 Greg Kroah-Hartman


    ![](images/00001.png)


    O''Reilly Media


    # SPECIAL OFFER: Upgrade this ebook with O’Reilly


