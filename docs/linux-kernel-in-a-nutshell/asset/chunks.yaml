  trans: "\n\n将此配置文件拷贝到你的内核目录并将其重命名为 `.config`。然后使用它作为内核配置的基础，按照第 4 章中的描述构建内核。\n\n\
    使用此配置文件应该始终能为你的机器生成一个可工作的内核镜像。该内核镜像的缺点是，你将构建了内核源码树中存在的每一个内核模块和驱动程序。对于单台机器来说，这几乎是不需要的，因此你可以开始关闭不需要的不同驱动程序和选项。建议只禁用你确定不需要的选项，因为系统的某些部分可能依赖启用特定的选项才能运行。\n\
    \n## 查找需要的模块\n\n来自发行版的配置文件构建需要很长时间，因为构建了所有不同的驱动程序。如果你只想构建你需要的驱动程序，这可以节省时间，并在某些架构上让系统运行得更快，同时节省一些内存。为了减少驱动程序，你需要确定哪些驱动程序控制哪些硬件。\n\
    \n系统中的几个位置存储了确定哪些设备绑定到哪些驱动程序的有用信息。最重要的位置是名为 `sysfs` 的虚拟文件系统。`sysfs` 总是挂载在 `/sys`\
    \ 目录下。它提供了关于内核不同部分如何连接在一起的概览。\n\n在接下来的所有示例中，显示了真实的 `sysfs` 路径和类型。你的机器可能会不同，但 `sysfs`\
    \ 文件中的相对位置将是相同的。不要惊讶，这是预料之中的。此外，`sysfs` 的内部结构不断变化，由于内核开发者对如何显示设备进行思考，由于这一点，本文之前提到的某些链接可能不存在。\n\
    \n### 示例：确定驱动程序\n\n系统中最常见且重要的设备之一是网卡。要确定哪个驱动程序控制此设备并使其网络正常工作，首先，从网络连接反向查找。要这样做，请查看不同的网络名称：\n\
    \n```\n$ ls /sys/class/net/\n```\n\n```\neth0 eth1 eth2 lo\n```\n\n`lo` 目录表示环回设备，没有连接任何网络设备。你应该关注\
    \ `eth0`、`eth1` 和 `eth2` 目录，因为它们代表真实的网络设备。\n\n为了进一步查看这些网络设备，使用 `ifconfig` 工具：\n\
    \n```\n$ /sbin/ifconfig -a\n```\neth0      Link encap:Ethernet  HWaddr 00:12:3F:65:7D:C2\
    \  \n           inet addr:192.168.0.13  Bcast:192.168.0.255  Mask:255.255.255.0\n\
    \           UP BROADCAST RUNNING MULTICAST  MTU:1500  Metric:1\n           RX\
    \ packets:2720792 errors:0 dropped:0 overruns:0 frame:0\n           TX packets:1815488\
    \ errors:0 dropped:0 overruns:0 carrier:0\n           collisions:0 txqueuelen:100\n\
    \           RX bytes:3103826486 (2960.0 Mb)  TX bytes:371424066 (354.2 Mb)\n \
    \          Base address:0xdcc0 Memory:dfee0000-dff0000\neth1      Link encap:UNSPEC\
    \  HWaddr 80-65-00-12-7D-C2-3F-00-00-00-00-00-00-00-00-00-00\n           BROADCAST\
    \ MULTICAST  MTU:1500  Metric:1\n           RX packets:0 errors:0 dropped:0 overruns:0\
    \ frame:0\n           TX packets:0 errors:0 dropped:0 overruns:0 carrier:0\n \
    \          collisions:0 txqueuelen:1000\n           RX bytes:0 (0.0 b)  TX bytes:0\
    \ (0.0 b)\neth2      Link encap:UNSPEC  HWaddr 00-02-3C-04-11-09-D2-BA-00-00-00-00\n\
    \           BROADCAST MULTICAST  MTU:1500  Metric:1\n           RX packets:0 errors:0\
    \ dropped:0 overruns:0 frame:0\n           TX packets:0 errors:0 dropped:0 overruns:0\
    \ carrier:0\n           collisions:0 txqueuelen:1000\n           RX bytes:0 (0.0\
    \ b)  TX bytes:0 (0.0 b)\nlo       Link encap:Localback  \n           inet addr:127.0.0.1\
    \  Mask:255.0.0.0\n           UP LOOPBACK RUNNING  MTU:16436  Metric:1\n     \
    \      RX packets:60 errors:0 dropped:0 overruns:0 frame:0\n           TX packets:60\
    \ errors:0 dropped:0 overruns:0 carrier:0\n           collisions:0 txqueuelen:0\n\
    \           RX bytes:13409 (13.0 Kb)  TX bytes:13409 (13.0 Kb)\n```\n\n从这个列表中，你可以看出\
    \ `eth0` 设备是活跃且正在工作的网络设备。\n\n"
- fmt: "\nRemember to replace the `e1000` used for this example with the name of the\
    \ module that you are looking to find.\n\nThe important thing to look for in the\
    \ output of the previous `find` command is any line that has the term `CONFIG_`\
    \ in it. That is the configuration option that the kernel needs to have enabled\
    \ in order to build the module. In the above example, the option `CONFIG_E1000`\
    \ is the configuration option that you are looking for.\n\nNow you have the information\
    \ you need to configure the kernel. Run the menu configuration tool:\n\n```\n\
    $ make menuconfig\n```\n\nThen press the `/` key (which initiates a search) and\
    \ type in the configuration option, minus the `CONFIG_` portion of the string.\
    \ This process is shown in [Figure 7-1](#index_split_056.html_filepos213882).\n\
    \n![Searching in menuconfig](images/00020.png)\n\nFigure 7-1. Searching in menuconfig\n\
    \nThe kernel configuration system will then tell you exactly where to select the\
    \ option to enable this module. See [Figure 7-2](#index_split_056.html_filepos214551).\n\
    \n![Result of searching in menuconfig](images/00021.png)\n\nFigure 7-2. Result\
    \ of searching in menuconfig\n\nThe first item in the display exactly matches\
    \ what you searched for. The location information in the display tells you that\
    \ to build the module `e1000` into the, kernel the following configuration option\
    \ must be enabled:\n\n```\nDevice Drivers\n    Network device support\n      [*]\
    \ Network device support\n          Ethernet (1000 Mbit)\n    [*] Intel(R) PRO/1000\
    \ Gigabit Ethernet support\n```\n\nThese steps will work for any type of device\
    \ active in the kernel.\n\n### Example: a USB device\n\nAs another example, let\
    \ us look at a USB-to-serial converter that is present in our example system.\
    \ It is currently connected to the `/dev/ttyUSB0` port, so you need to look in\
    \ the `sysfs` tty section:\n\n```\n$ ls /sys/class/tty/ | grep USB\n```\n\n`ttyUSB0`\n\
    \nYou can trace through `sysfs` for this device to find the controlling module,\
    \ as shown in the previous section:\n\n```\n$ basename readlink /sys/class/tty/ttyUSB0/device/driver/module\n\
    ```\n\n`pl2303`\n\nThen search the kernel source tree to find the configuration\
    \ option that you need to enable:\n\n```\n$ cd ~/linux/linux-2.6.17.8\n$ find\
    \ -type f -name Makefile | xargs grep pl2303\n```\n\n```\n./drivers/usb/serial/Makefile:obj-$(CONFIG_USB_SERIAL_PL2303)\
    \ += pl2303.o\n```\n\nUse the kernel configuration tool, as shown in [Figure 7-3](#index_split_056.html_filepos217866),\
    \ to find the proper option to enable in order to set the `CONFIG_USB_SERIAL_PL2303`\
    \ option.\n\n![Searching for USB_SERIAL_PL2303](images/00022.png)\n\nFigure 7-3.\
    \ Searching for `USB_SERIAL_PL2303`\n\nIn our case, this displays the screen shown\
    \ in [Figure 7-4](#index_split_056.html_filepos218520).\n\n![Result of searching\
    \ for USB_SERIAL_PL2303](images/00023.png)\n\nFigure 7-4. Result of searching\
    \ for `USB_SERIAL_PL2303`\n\nThis shows exactly where to find the `USB Prolific\
    \ 2303 Single Port Serial Driver` option that is needed to control this device\
    \ properly.\n\n### Summary of device discovery\n\nIn summary, here are the steps\
    \ needed to find the driver for a device that has a working driver already bound\
    \ to it:\n\n1. Find the proper `sysfs` class device that the device is bound to.\
    \ Network devices are listed in `/sys/class/net` and tty devices in `/sys/class/tty/`.\
    \ Other types of devices are listed in other directories in `/sys/class`, depending\
    \ on the type of device.\n\n2. Trace through the `sysfs` tree to find the module\
    \ name that controls this device. It will be found in `/sys/class/class_name/device_name/device/driver/module`,\
    \ and can be displayed using the `readlink` and `basename` applications:\n\n```\n\
    $ basename readlink /sys/class/class_name/device_name /device/driver/module\n\
    ```\n\n3. Search the kernel Makefiles for the `CONFIG_` rule that builds this\
    \ module name by using `find` and `grep`:\n\n```\n$ find -type f -name Makefile\
    \ | xargs grep module_name\n```\n\n4. Search in the kernel configuration system\
    \ for that configuration value and go to the location in the menu that it specifies\
    \ to enable that driver to be built.\n\n### Let the kernel tell us what we need\n\
    \nNow that we have gone through all of the steps of poking the kernel, here is\
    \ a very simple script that will work:\n\n```bash\n#!/bin/bash\n# find_all_modules\n\
    for i in `find /sys/ -name modalias -exec cat {} \\`; do modprobe --show $i done\
    \ | rev | sort -u\n```\n\nThis script goes through `sysfs` and finds all `alias`\
    \ that tells the kernel which `modprobe` command should take. If it finds a match,\
    \ it will then output the list of modules that are needed to control the hardware.\
    \ This is how `modprobe` works.\n\nThe script will also probably print out some\
    \ error messages that look like:\n\n```\nFATAL: Module pci:v0008086d0002592sv000010CFsd00012E2bc03sc00i00\
    \ not found.\nFATAL: Module serio:ty01pr00id00ex00 not found.\n```\n\nWhich means\
    \ that it could not find a module that can control that device. Do not be concerned\
    \ about this, as some devices do not have kernel drivers that will work for them.\
    \ This is a list of all of the modules:\n\n```\n8139cp.ko\n8139too.ko\nehci-hcd.ko\n\
    firmware_class.ko\ni2c-i01.ko\nieee8011.ko\nieee8011_crypt.ko\nipw2200.ko\nmii.ko\n\
    mmc_core.ko\npcmcia_core.ko\nrsrc_nonstatic.ko\nsdhci.ko\nsnd-hda-codec.ko\nsnd-hda-intel.ko\n\
    snd-page-alloc.ko\nsnd-pcm.ko\nsnd-timer.ko\nsnd.ko\nsoundcore.ko\nuhci-hcd.ko\n\
    usbcore.ko\nyenta_socket.ko\n```\n\n# Determining the Correct Module From Scratch\n\
    \nSometimes you do not have the option of getting a distribution kernel working\
    \ on a machine in order to determine what kernel modules are needed to drive the\
    \ hardware. Or you have added new hardware to your system, and you need to figure\
    \ out what kernel configuration option needs to be enabled to get it to work properly.\
    \ This section will help you determine how to find that configuration option to\
    \ get the hardware up and running.\n\nThe easiest way to figure out which driver\
    \ controls a new device is to build all of the different drivers of that type\
    \ in the kernel source tree as modules, and let the `udev` startup process match\
    \ the driver to the device. Once this happens, you should be able to work backwards\
    \ using the steps just discussed to determine the proper driver needed, and then\
    \ go back and enable just that driver in the kernel configuration.\n\nBut if you\
    \ do not want to build all drivers, or this does not work for some reason, it\
    \ will require a bit more work to determine the proper driver that is needed.\
    \ The following steps are complex and require digging in the kernel source code\
    \ at times. Do not be afraid of this, it will only help you understand your hardware\
    \ and the kernel source better.\n"
  raw: "Remember to replace the `e1000` used for this example with the name of the\
    \ module that you are looking to find.\n\nThe important thing to look for in the\
    \ output of the previous *find* command is any line that has the term `CONFIG_`\
    \ in it. That is the configuration option that the kernel needs to have enabled\
    \ in order to build the module. In the above example, the option `CONFIG_E1000`\
    \ is the configuration option that you are looking for.\n\nNow you have the information\
    \ you need to configure the kernel. Run the menu configuration tool:\n\n`$` **`make\
    \ menuconfig`**\n\nThen press the `/` key (which initiates a search) and type\
    \ in the configuration option, minus the `CONFIG_` portion of the string. This\
    \ process is shown in [Figure 7-1](#index_split_056.html_filepos213882).\n\n![Searching\
    \ in menuconfig](images/00020.png)\n\nFigure 7-1. Searching in menuconfig\n\n\
    The kernel configuration system will then tell you exactly where to select the\
    \ option to enable this module. See [Figure 7-2](#index_split_056.html_filepos214551).\n\
    \n![Result of searching in menuconfig](images/00021.png)\n\nFigure 7-2. Result\
    \ of searching in menuconfig\n\nThe first item in the display exactly matches\
    \ what you searched for. The location information in the display tells you that\
    \ to build the module `e1000` into the, kernel the following configuration option\
    \ must be enabled:\n\n`Device Drivers`\n\n`    Network device support`\n\n`  \
    \      [*] Network device support`\n\n`            Ethernet (1000 Mbit)`\n\n` \
    \      [*] Intel(R) PRO/1000 Gigabit Ethernet support`\n\nThese steps will work\
    \ for any type of device active in the kernel.\n\n### Example: a USB device\n\n\
    As another example, let us look at a USB-to-serial converter that is present in\
    \ our example system. It is currently connected to the `/dev/ttyUSB0` port, so\
    \ you need to look in the `sysfs` tty section:\n\n`$` **`ls /sys/class/tty/ |\
    \ grep USB`**\n\n`ttyUSB0`\n\nYou can trace through `sysfs` for this device to\
    \ find the controlling module, as shown in the previous section:\n\n`$` **`` basename\
    \ `readlink /sys/class/tty/ttyUSB0/device/driver/module` ``**\n\n`pl2303`\n\n\
    Then search the kernel source tree to find the configuration option that you need\
    \ to enable:\n\n`$` **`cd ~/linux/linux-2.6.17.8`**\n\n`$` **`find -type f -name\
    \ Makefile | xargs grep pl2303`**\n\n`./drivers/usb/serial/Makefile:obj-$(CONFIG_USB_SERIAL_PL2303)\
    \ += pl2303.o`\n\nUse the kernel configuration tool, as shown in [Figure 7-3](#index_split_056.html_filepos217866),\
    \ to find the proper option to enable in order to set the `CONFIG_USB_SERIAL_PL2303`\
    \ option.\n\n![Searching for USB_SERIAL_PL2303](images/00022.png)\n\nFigure 7-3. Searching\
    \ for `USB_SERIAL_PL2303`\n\nIn our case, this displays the screen shown in [Figure 7-4](#index_split_056.html_filepos218520).\n\
    \n![Result of searching for USB_SERIAL_PL2303](images/00023.png)\n\nFigure 7-4. Result\
    \ of searching for `USB_SERIAL_PL2303`\n\nThis shows exactly where to find the\
    \ `USB Prolific 2303 Single Port Serial Driver` option that is needed to control\
    \ this device properly.\n\n### Summary of device discovery\n\nIn summary, here\
    \ are the steps needed to find the driver for a device that has a working driver\
    \ already bound to it:\n\n1.  Find the proper `sysfs` class device that the device\
    \ is bound to. Network devices are listed in */sys/class/net* and tty devices\
    \ in */sys/class/tty*. Other types of devices are listed in other directories\
    \ in `/sys/class`, depending on the type of device.\n\n2.  Trace through the `sysfs`\
    \ tree to find the module name that controls this device. It will be found in\
    \ the */sys/class/* *`class_name/device_name`* */device/driver/module*, and can\
    \ be displayed using the *readlink* and *basename* applications:`$` **``basename\
    \ `readlink /sys/class/``*`class_name/device_name`*`` /device/driver/module` ``**\n\
    \n3.  Search the kernel Makefiles for the `CONFIG_` rule that builds this module\
    \ name by using *find* and *grep*:`$` **`find -type f -name Makefile | xargs grep`\
    \ *`module_name`*** \n\n4.  Search in the kernel configuration system for that\
    \ configuration value and go to the location in the menu that it specifies to\
    \ enable that driver to be built.\n\n### Let the kernel tell us what we need\n\
    \nNow that we have gone through all of the steps of poking around in `sysfs` and\
    \ following symlinks to module names, here is a very simple script that will do\
    \ all of that work, in a different way:\n\n`#!/bin/bash`\n\n`#`\n\n`# find_all_modules.sh`\n\
    \n`#`\n\n``for i in `find /sys/ -name modalias -exec cat {} \\;`; do``\n\n`  \
    \  /sbin/modprobe --config /dev/null --show-depends $i ;`\n\n`done | rev | cut\
    \ -f 1 -d '/' | rev | sort -u`\n\nThis script goes through `sysfs` and finds all\
    \ files called *modalias*. The *modalias* file contains the module alias that\
    \ tells the *modprobe* command which module should be loaded to control this device.\
    \ The module alias is made up of a combination of device manufacturer, ID, class\
    \ type, and other unique identifiers for that specific type of device. All kernel\
    \ driver modules have an internal list of devices that they support that is generated\
    \ automatically by the list of devices the driver tells the kernel it supports.\
    \ The *modprobe* looks through this list of devices by all drivers and tries to\
    \ match it up with the alias it has. If it finds a match, it will then load the\
    \ module (this procedure is how the automatic driver loading functionalty in Linux\
    \ works.)\n\nThe script has the *modprobe* program stop before actually loading\
    \ the module, and just print out what actions it would take. This gives us a list\
    \ of all of the modules that are needed to control all devices in the system.\
    \ A little cleaning up of the list, by sorting it and finding the proper field\
    \ to display, results in this output:\n\n`$` **`find_all_modules.sh`**\n\n`8139cp.ko`\n\
    \n`8139too.ko`\n\n`ehci-hcd.ko`\n\n`firmware_class.ko`\n\n`i2c-i801.ko`\n\n`ieee80211.ko`\n\
    \n`ieee80211_crypt.ko`\n\n`ipw2200.ko`\n\n`mii.ko`\n\n`mmc_core.ko`\n\n`pcmcia_core.ko`\n\
    \n`rsrc_nonstatic.ko`\n\n`sdhci.ko`\n\n`snd-hda-codec.ko`\n\n`snd-hda-intel.ko`\n\
    \n`snd-page-alloc.ko`\n\n`snd-pcm.ko`\n\n`snd-timer.ko`\n\n`snd.ko`\n\n`soundcore.ko`\n\
    \n`uhci-hcd.ko`\n\n`usbcore.ko`\n\n`yenta_socket.ko`\n\nThis is a list of all\
    \ of the modules that are needed to control the hardware in the machine.\n\nThe\
    \ script will also probably print out some error messages that look like:\n\n\
    `FATAL: Module pci:v00008086d00002592sv000010CFsd000012E2bc03sc00i00 not found.`\n\
    \n`FATAL: Module serio:ty01pr00id00ex00 not found.`\n\nWhich means that it could\
    \ not find a module that can control that device. Do not be concerned about this,\
    \ as some devices do not have kernel drivers that will work for them.\n\n# Determining\
    \ the Correct Module From Scratch\n\nSometimes you do not have the option of getting\
    \ a distribution kernel working on a machine in order to determine what kernel\
    \ modules are needed to drive the hardware. Or you have added new hardware to\
    \ your system, and you need to figure out what kernel configuration option needs\
    \ to be enabled to get it to work properly. This section will help you determine\
    \ how to find that configuration option to get the hardware up and running.\n\n\
    The easiest way to figure out which driver controls a new device is to build all\
    \ of the different drivers of that type in the kernel source tree as modules,\
    \ and let the `udev` startup process match the driver to the device. Once this\
    \ happens, you should be able to work backwards using the steps just discussed\
    \ to determine the proper driver needed, and then go back and enable just that\
    \ driver in the kernel configuration.\n\nBut if you do not want to build all drivers,\
    \ or this does not work for some reason, it will require a bit more work to determine\
    \ the proper driver that is needed. The following steps are complex and require\
    \ digging in the kernel source code at times. Do not be afraid of this, it will\
    \ only help you understand your hardware and the kernel source better."
