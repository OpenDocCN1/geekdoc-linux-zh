    # Chapter 8. Kernel Configuration Recipes


    Previous chapters taught the mechanics of reconfiguring the kernel; the payoff
    comes in this chapter where you can find all the most common kinds of changes
    people need to make to their kernels, with specific instructions on how to do
    so.


    # Disks


    The Linux kernel supports a wide range of different disk types. This section shows
    how to configure the kernel so that it supports most of the more common types
    of disk controllers.


    ## USB storage'
