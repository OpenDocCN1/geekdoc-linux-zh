    ## USB devices


    Finding the specific driver for a USB device is much like finding the driver for
    a PCI device as described in the previous section, with only minor differences
    in finding the bus ID values.


    In this example, let us find the driver that is needed for a USB wireless device.
    As with the PCI device example, the details in this example will be different
    from your situation, but the steps involved should be relevant to any type of
    USB device for which you wish to find a working driver.


    As with the PCI device, the bus ID must be found for the USB device you wish to
    find the driver for. To do this, you can use the *lsusb* program that comes in
    the `usbutils` package.


    The *lsusb* program shows all USB devices attached to the system. As willou do
    not know what the specific device your are looking for is called, start by looking
    at all devices:


    `$` **`/usr/sbin/lsusb`**


    `Bus 002 Device 003: ID 045e:0023 Microsoft Corp. Trackball Optical`


    `Bus 002 Device 001: ID 0000:0000  `


    `Bus 005 Device 003: ID 0409:0058 NEC Corp. HighSpeed Hub`


    `Bus 005 Device 001: ID 0000:0000  `


    `Bus 004 Device 003: ID 157e:300d  `


    `Bus 004 Device 002: ID 045e:001c Microsoft Corp.`


    `Bus 004 Device 001: ID 0000:0000  `


    `Bus 003 Device 001: ID 0000:0000  `


    `Bus 001 Device 001: ID 0000:0000`


    The devices with an ID of `0000:0000` can be ignored, as they are USB host controllers
    that drive the bus itself. Filtering them away leaves us with four devices:


    `$` **`/usr/sbin/lsusb | grep -v 0000:0000`**


    `Bus 002 Device 003: ID 045e:0023 Microsoft Corp. Trackball Optical`


    `Bus 005 Device 003: ID 0409:0058 NEC Corp. HighSpeed Hub`


    `Bus 004 Device 003: ID 157e:300d  `


    `Bus 004 Device 002: ID 045e:001c Microsoft Corp.`


    Because USB devices are easy to remove, unplug the device you want to find the
    driver for and run `lsusb` again:


    `$` **`/usr/sbin/lsusb | grep -v 0000:0000`**


    `Bus 002 Device 003: ID 045e:0023 Microsoft Corp. Trackball Optical`


    `Bus 005 Device 003: ID 0409:0058 NEC Corp. HighSpeed Hub`


    `Bus 004 Device 002: ID 045e:001c Microsoft Corp.`


    The third device is now missing, which means the device shown as:


    `Bus 004 Device 003: ID 157e:300d`


    is the device you want to find the driver for.


    If you replace the device and look at the output of *lsusb* again, the device
    number will have changed:


    `$` **`/usr/sbin/lsusb | grep 157e`**


    `Bus 004 Device 004: ID 157e:300d`


    This is because the USB device numbers are not unique, but change every time they
    are plugged in. What is stable is the vendor and product ID, shown here by *lsusb*
    as two four-digit values with a `:` between them. For this device, the vendor
    ID is `157e` and the product ID is `300d`. Write down the values you find, as
    you will use them in future steps.


    As with the PCI device, we will search the kernel source code for the USB vendor
    and product IDs in order to find the proper driver to control this device. Unfortunately,
    no single file contains all of the USB vendor IDs, as PCI has. So a search of
    the whole kernel source tree is necessary:


    `$` **`grep -i -R  -l 157e drivers/*`**


    `drivers/atm/pca200e.data`


    `drivers/atm/pca200e_ecd.data`


    `drivers/atm/sba200e_ecd.data`


    `drivers/net/wireless/zd1211rw/zd_usb.c`


    `drivers/scsi/ql1040_fw.h`


    `drivers/scsi/ql1280_fw.h`


    `drivers/scsi/qlogicpti_asm.c`


    We know this is a USB wireless device, and not an ATM or SCSI device, so we can
    safely ignore the files found in the *atm* and *scsi* directories. That leaves
    the *drivers/net/wireless/zd1211rw/zd_usb.c* filename to investigate.


    *zd_usb.c* shows the string `157e` in the following chunk of code:


    `static struct usb_device_id usb_ids[] = {`


    `        /* ZD1211 */`


    `        { USB_DEVICE(0x0ace, 0x1211), .driver_info = DEVICE_ZD1211 },`


    `        { USB_DEVICE(0x07b8, 0x6001), .driver_info = DEVICE_ZD1211 },`


    `        { USB_DEVICE(0x126f, 0xa006), .driver_info = DEVICE_ZD1211 },`


    `        { USB_DEVICE(0x6891, 0xa727), .driver_info = DEVICE_ZD1211 },`


    `        { USB_DEVICE(0x0df6, 0x9071), .driver_info = DEVICE_ZD1211 },`


    `        { USB_DEVICE(0x157e, 0x300b), .driver_info = DEVICE_ZD1211 },`


    `        /* ZD1211B */`


    `        { USB_DEVICE(0x0ace, 0x1215), .driver_info = DEVICE_ZD1211B },`


    `        { USB_DEVICE(0x157e, 0x300d), .driver_info = DEVICE_ZD1211B },`


    `        {}`


    `};`


    Like PCI drivers, USB drivers tell the kernel what devices they support in order
    for the kernel to bind the driver to the device. This is done by using a `struct
    usb_device_id` variable, as shown here. This is a list of the different vendor
    and product IDs that are supported by this driver. The line:


    `        { USB_DEVICE(0x157e, 0x300b), .driver_info = DEVICE_ZD1211 },`


    shows that our vendor and product IDs are supported by this driver.


    Once you have the driver name that is necessary to control this device, work backward
    through the kernel Makefiles, as described earlier in the chapter, to determine
    how to enable this driver to be built properly.


    In summary, the steps needed in order to find which USB driver will control a
    specific USB device are:


    1.  Find the USB vendor and product ID of device for which you want to find the
    driver, using *lsusb* after adding and then removing the device to see what changes
    in the list.


    2.  Search the kernel source tree for the vendor and product ID of the USB device.
    Both the vendor and product ID should be in a `struct usb_device_id` definition.


    3.  Search the kernel Makefiles for the `CONFIG_` rule that builds this driver
    by using *find* and *grep*:`$` **`find -type f -name Makefile | xargs grep DRIVER_NAME`**


    4.  Search in the kernel configuration system for that configuration value and
    go to the location in the menu that it specifies to enable that driver to be built.


    ## Root Filesystem


    The root filesystem is the filesystem that the kernel boots the main portion of
    the running system. It contains all of the initial programs that start up the
    distro, and also usually contains the entire system configuration for the machine.
    In short, it is very important, and must be able to be found by the kernel at
    boot time in order for things to work properly.


    If your newly configured kernel dies at boot time with an error such as:


    `VFS: Cannot open root device hda2 (03:02)`


    `Please append a correct "root=" boot option`


    `Kernal panic: VFS: Unable to mount root fs on 03:02`


    then the root filesystem wasn''t found. If you are not using a ramdisk image at
    boot time, it is usually recommended that you build both the filesystem that you
    use for your root partition, and the disk controller for that disk, into the kernel,
    instead of having it as a module. If you use a ramdisk at boot time, then you
    should be safe building these portions as modules. ^([[12](#index_split_061.html_filepos266680)])


    The following subsections show how to let the kernel find the root filesystem
    during boot.


    ### Filesystem type


    First, the type of filesystem that the root partition is using needs to be determined.
    To do that, look in the output of the *mount* command:


    `$` **`mount | grep " / "`**


    `/dev/sda2 on / type ext3 (rw,noatime)`'
