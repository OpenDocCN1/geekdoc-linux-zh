    ## 节点

    netconsole — 跨网络输出控制台数据。


    ## 概要

    `netconsole=`[`src-port`]`@`[`src-ip`]``/`[`dev`]`,`[`target-port`]`@ `target-ip`
    `/`[`target-mac-address`]`


    使用 UDP 数据包跨网络向另一机器发送内核控制台数据。选项如下：


    *`src-port`


    > UDP 数据包的源端口。默认值为 6665。


    *`src-ip`


    > 使用的接口源 IP 地址。


    *`dev`


    > 使用的网络接口。`eth0` 是一个示例。网络接口也可以运行正常的网络流量，因为 netconsole 数据是非侵入性的，不应导致其他网络操作变慢。


    *`target-port`


    > 日志代理使用的端口。默认值为 6666。


    *`target-ip`


    > 日志代理的 IP 地址。


    *`target-mac-address`


    > 日志代理的以太网 MAC 地址。


    要监听这些数据，远程机器可以使用 `syslogd` 程序，或按如下方式运行 `netcat` 程序：


    ```

    netcat -u -l -p

    ```


    *`port`


    关于如何使用此选项的更多背景，请参见 `Documentation/networking/netconsole.txt` 文件。


    ## 节点

    debug — 启用内核调试。


    使内核日志级别被设置为调试级别，以便所有调试消息在启动时都会打印到控制台。


    ## 节点

    quiet — 禁用所有日志消息。


    ## 概要

    `quiet`


    将默认内核日志级别设置为 `KERN_WARNING` (4)，这会在启动期间抑制除极严重消息以外的所有消息。（日志级别在 `loglevel` 参数下定义。）


    ## 节点

    earlyprintk — 显示早期启动消息。


    ## 概要

    `earlyprintk=`[`vga`|`serial`][,`ttyS` `n`[,`baudrate`]][,`keep]`


    显示在传统控制台初始化之前输出的内核日志消息。除非使用此选项，否则这些消息通常在控制台上是不可见的。启用此项对于追踪硬件问题非常有用。目前，该选项可以指定
    VGA 设备或串口，但不能同时指定。此外，只有 `ttyS0` 或 `ttyS1` 串口设备有效。与标准串口驱动的交互并不理想，且 VGA 输出最终会被真实的控制台覆盖。


    添加 `,keep` 以便在真实内核控制台初始化并接管系统时不禁用此选项所显示的消息。


    ## 节点

    loglevel — 设置默认控制台日志级别。


    ## 概要

    `loglevel=` `level`


    指定初始控制台日志级别。任何级别小于此级别（即优先级更高）的日志消息将打印到控制台，而任何级别等于或大于此级别的消息将不会显示。


    控制台日志级别也可以通过 `klogd` 程序更改，或通过将指定的级别写入 `/proc/sys/kernel/printk` 文件来。


    内核日志级别为：


    `0 (KERN_EMERG)`


    > 系统不可用。


    `1 (KERN_ALERT)`


    > 必须立即采取的操作。


    `2 (KERN_CRIT)`


    > 关键情况。


    `3 (KERN_ERR)`


    > 非关键错误情况。


    `4 (KERN_WARNING)`


    > 应该处理的警告情况。


    `5 (KERN_NOTICE)`


    > 正常但重要的事件。


    `6 (KERN_INFO)`


    > 不需要操作的信息性消息。


    `7 (KERN_DEBUG)`


    > 内核调试消息，如果开发者在编译时启用了调试，内核将输出这些消息。


    ## 节点

    log_buf_len — 设置内核日志缓冲区的大小。


    ## 概要

    `log_buf_len=` `n`[`KMG`]`


    设置内核内部日志缓冲区的大小。`n` 必须是 2 的幂，否则它将向向上取整到 2 的幂。此值可以通过 `CONFIG_LOG_BUF_SHIFT` 更改。


    ## 节点

    initcall_debug — 调试 initcall 函数。


    使内核跟踪初始化期间调用的所有函数。此选项对于识别启动慢的情况有用。


    ## 节点

    kstack — 打印栈的字数。


    ## 概要

    `kstack=` `n`


    指定在 oops 中从栈中打印多少个字。


    ## 节点

    time — 在消息中显示时间数据。


    ## 概要

    `time`


    使内核在每条消息前加上时间戳。


    ## 节点

    apic — 修改 APIC 的详细程度。


    ## 概要

    `apic=`[`quiet`|`verbose`|`debug`]


    控制启动时 APIC 生成的信息量。


    ## 节点

    noapic — 不使用 APIC。


    阻止内核使用可能存在的 APIC。


    ## 节点

    lapic — 启用本地 APIC。


    即使 BIOS 禁用了它，也强制启用本地 APIC。


    ## 节点

    nolapic — 不使用本地 APIC。


    告诉内核不要使用本地 APIC。


    ## 节点

    noirbalance — 禁用内核平衡。


    禁用所有内置的平衡逻辑。


    ## 节点

    irqfixup — 解决问题的基本方法。


    当中断未被处理时，搜索所有中断处理程序。这旨在让固件的系统运行。


    ## 节点

    irqpoll — 解决问题的扩展方法。


    当中断未被处理时，搜索所有中断处理程序并检查所有定时中断。


    ## 节点

    noirqdebug — 禁用处理中断检测。


    默认情况下，内核尝试检测并禁用未处理的中断源，如果不禁用，它们会导致内核其他部分的响应能力出现问题。此选项将禁用此逻辑。


    ## 节点

    highmem — 指定高内存区域的大小。


    ## 概要

    `highmem=` `n`


    强制高内存区域的大小恰好为 `n` 字节。即使在默认没有高内存区域的机器上也有效。它也可以减少内存机器高内存区域的大小。


    ## 节点

    hugepages — 设置 hugetlb 页的数量。


    ## 概要

    `hugepages=` `n`


    hugetlb 功能允许你配置 Linux 使用 4MB 页，是默认大小的千倍。如果 Linux 这样配置，此选项设置 hugetlb 内存的最大数量。


    ## 节点

    ihash_entries — 设置 inode 哈希桶的数量。


    ## 概要

    `ihash_entries=` `n`


    覆盖内核 inode 缓存的默认哈希桶数量。仅建议内核专家使用。


    '
- fmt: '

    Cause the kernel to ignore all physical memory greater than or equal to the physical
    address `n`.


    ## Name

    `mem` — Force memory usage.


    ## Synopsis

    `mem=`n`*[`KMG`*`]


    Set the specific ammount of memory used by the kernel. When used with the `memmap=`
    option, physical address space collisions can be avoided. Without the `memmap=`
    option, this option could cause PCI devices to be placed at addresses that belong
    to unused RAM. `n` specifies the amount of memory to force and is measured in
    units of kilobytes (`K`), megabytes (`M`), or gigabytes (`G`).


    ## Name

    `mem` — Disable the use of 4MB pages for kernel memory.


    ## Synopsis

    `mem=nopentium`


    Disable the use of huge (4MB) pages for kernel memory.


    ## Name

    `memmap` — Enable setting of an exact E820 memory map.


    ## Synopsis

    `memmap=`exactmap`


    Use a specific memory map. The `exactmap` lines can be constructed based on BIOS
    output or other requirements.


    ## Name

    `memmap` — Force specific memory to be used.


    ## Synopsis

    `memmap=`n`*[`KMG`*]`@`start`*[`KMG`*]`


    Force the kernel to use a specific memory region. `n` is the size of the memory
    location and `start` is the start location in memory of the range. Units can be
    kilobytes (`K`), megabytes (`M`), or gigabytes (`G`).


    ## Name

    `noexec` — Enable or disable non-executable mappings.


    ## Synopsis

    `noexec=`[`(`on`|(`off`]`


    Enable or disable the kernel''s ability to map sections of memory as non-executable.
    By default, the mapping is enabled (`on`).


    ## Name

    `reserve` — Reserve some I/O memory.


    ## Synopsis

    `reserve=`n`*[`KMG`*`]


    Force the kernel to ignore some of the I/O memory areas.


    ## Name

    `vmalloc` — Force the vmalloc area to have a specific size.


    ## Synopsis

    `vmalloc=`n`*[`KMG`*`]


    Force vmalloc to have the exact size specified by `n`. This can be used to increase
    the minimum size of the vmalloc area (which is 128 MB on the x86 processor). It
    can also be used to decrease the size and leave more room for directly mapped
    kernel RAM.


    ## Name

    `norandmaps` — Do not use address space randomization.


    By default, the kernel randomizes the address space of all programs when they
    are started. This option disables this feature. It is equivalent to writing `0`
    to the file `/proc/sys/kernel/randomize_va_space`.


    ## Name

    `vdso` — Enable or disable the VDSO mapping.


    ## Synopsis

    `vdso=`[`0`|`1`]


    Disable (0) or enable (1) the VDSO (Virtual Dynamic Shared Object) mapping option.
    By default, it is enabled.


    # Suspend options


    These options change the way the kernel handles suspension for power-saving purposes.


    ## Name

    `resume` — Specify the partition device for the suspend image.


    ## Synopsis

    `resume=`suspend_device`


    Tell the kernel which disk device contains the suspended kernel image. If the
    data on the image is a valid kernel image created by the software suspend subsystem,
    it will be loaded into memory and the kernel will run it instead of continuing
    on with the normal boot process. `suspend_device` is the kernel device name, which
    might be different from what userspace thinks the device name is, so be careful
    with this option.


    ## Name

    `noresume` — Disable resume.


    Disable the resume functionality of the kernel. Any swap partitions that were
    being used to hold system images to which the kernel could be restored will revert
    back to available swap space.


    # CPU options


    These options control a wide range of behavior regarding timing, processor use
    in multi-processor systems, and other processor issues.


    ## Name

    `cachesize` — Override level 2 CPU cache size detection.


    ## Synopsis

    `cachesize=`n`


    Sometimes CPU hardware bugs make them report the cache size incorrectly. The kernel
    will attempt to work around and fix known problems with most CPUs, but for some
    CPUs it is not possible to determine what the correct size should be. This option
    provides an override for these situations. `n` is measured in units of bytes.


    ## Name

    `lpj` — Set the loops per jiffy.


    ## Synopsis

    `lpg=`n`


    Specify the loops per jiffy that should be used by the kernel, and thus have the
    kernel avoid the time-consuming boot-time autodetection of this value. If `n`
    is `0`, the value will be autodetected as usual.


    * * *


    ### Warning

    On SMP systems, this value will be set on all CPUs, which might cause problems
    if the different CPUs need different settings. An incorrect value will cause incorrect
    delays in the kernel, which can lead to unpredictable I/O errors and other breakage.
    Although unlikely, in the extreme case this might damage your hardware.


    * * *


    ## Name

    `nmi_watchdog` — Set the NMI watchdog value.


    ## Synopsis

    `nmi_watchdog=`[`0`|`1`|`2`|`3`]


    This is a debugging feature that allows the user to override the default non-maskable
    interrupt (NMI) watchdog value. `0` specifies that no NMI watchdog should be used.
    `1` specifies that the APIC should be used if present. `2` specifies that the
    local APIC should be used if present. `3` means the watchdog is invalid.


    ## Name

    `no387` — Always use 387 emulation library.


    ## Synopsis

    `no387=`n


    Always use the 387 emulation library, even if a coprocessor is present.


    ## Name

    `nofxsr` — Disable floating-point save and restore.


    ## Synopsis

    `nofxsr=`n


    Disable the x86 extended register save and restore. The kernel will save legacy
    floating-point on task switch.


    ## Name

    `nofhlt` — Do not use the HLT instruction.


    ## Synopsis

    `nofhlt=`n


    This option is available because the `HLT` instruction does not work correctly
    for some x86 processors.


    ## Name

    `mce` — Enable machine check exception.


    ## Synopsis

    `mce=`n


    Some processors can check for machine errors (usually errors in the hardware).
    This option turns the subsystem on, if it has been built into the kernel.


    ## Name

    `nomce` — Disable the machine check exception.


    ## Synopsis

    `nomce`


    This option turns the subsystem off.


    ## Name

    `nosep` — Disable x86 SYSENTER/SEXIT support.


    ## Synopsis

    `nosep=`n


    Disable x86 SYSENTER/SEXIT support in the kernel. This can cause some system calls
    to take longer.


    ## Name

    `nosmp` — Run as a single processor.


    ## Synopsis

    `nosmp=`n


    Tell an SMP kernel to act as a uniprocessor kernel, even on a multiprocessor machine.


    ## Name

    `notsc` — Disable the time stamp counter.


    ## Synopsis

    `notsc=`n


    Disable the time stamp counter hardware, if present.


    ## Name

    `max_cpus` — Maximum number of CPUs to use.


    ## Synopsis

    `maxcpus=`n


    Specify the maximum number of processors that a SMP kernel should use, even if
    there are more present.


    # Scheduler options


    These options tweak the parameters used to make scheduling decisions. Most depend
    on an intimate understanding of how scheduling works.


    ## Name

    `isolcpus` — Isolate CPUs from the kernel scheduler.


    ## Synopsis

    `isolcpus=`cpu_number`[`,` `cpu_number`...]


    Remove the specified CPUs, as defined by the `cpu_number` values, from the general
    kernel SMP and and algorithms. The only way to move a process onto or off an "isolated"
    CPU is via the CPU affinity syscalls. `cpu_number` begins at `0`, so the maximum
    value is 1 less than the number of CPUs on the system.


    This option is the preferred way to isolate CPUs. The alternative, manually setting
    the CPU mask of all tasks in the system, can cause problems and suboptimal load
    balancer performance.


    ## Name

    `migration_cost` — Override the default scheduler migration costs.


    ## Synopsis

    `migration_cost=`level-1-useconds`*[`level-2-useconds`...]


    This is a debugging option that overrides the default scheduler migration cost
    matrix. The numbers specified by `level-N-useconds` are indexed by the "CPU domain
    distance" and are measured in microseconds.


    An example of this option is `migration_cost=1000,2000,3000` for a SMT NUMA machine.
    It sets up an intra-core migration cost of 1 ms, another inter-core migration
    cost of 2 ms, and another internode migration cost of 3 ms.

