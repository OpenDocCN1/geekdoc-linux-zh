    \ USB UHCI Controller #1 (rev 02)`\n\n`00:1d.1 USB Controller: Intel Corporation\
    \ 82801EB/ER (ICH5/ICH5R) USB UHCI Controller #2 (rev 02)`\n\n`00:1d.2 USB Controller:\
    \ Intel Corporation 82801EB/ER (ICH5/ICH5R) USB UHCI Controller #3 (rev 02)`\n\
    \n`00:1d.3 USB Controller: Intel Corporation 82801EB/ER (ICH5/ICH5R) USB UHCI\
    \ Controller #4 (rev 02)`\n\n`00:1d.7 USB Controller: Intel Corporation 82801EB/ER\
    \ (ICH5/ICH5R) USB2 EHCI Controller (rev 02)`\n\nNote that your response will\
