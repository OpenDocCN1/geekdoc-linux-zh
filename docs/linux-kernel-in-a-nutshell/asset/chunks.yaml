    \ file in the kernel source tree.\n\n |\n\n|  \n\n`C`\n\n |  \n\n`2`\n\n |  \n\
    \nThis forces all C files to be checked with the `sparse` tool, even if they did\
    \ not need to be built.\n\n |\n\n# Packaging Targets\n\nThese targets package\
    \ up a built kernel into a stand-alone package that can be installed on a wide\
    \ range of different machines.\n\nTable 10-6. Packaging targets\n\n|  \n\nTarget\n\
    \n |  \n\nDescription\n\n |\n\n| --- | --- |\n\n|  \n\n`rpm`\n\n |  \n\nBuilds\
