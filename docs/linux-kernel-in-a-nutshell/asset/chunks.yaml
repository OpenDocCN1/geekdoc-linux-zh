    ## SMP


    If your system contains more than one CPU, or a Hyperthreaded or Dual Core CPU,
    you should select the multiprocessor option for the Linux kernel in order to take
    advantage of the additional processors. Unless you do, you will be wasting the
    other processors by not using them at all.


    Enable multiprocessing:


    `Processor type and features`


    `    [*] Symmetric multi-processing support`


    ## Preemption


    Systems running as servers have very different workload requirements from those
    being used as a desktop for video and audio applications. The kernel allows different
    modes of "preemption" in order to handle these different workloads. Preemption
    is the ability of the kernel to interrupt itself while it is doing something else,
    in order to work on something with a higher priority, such as updating a sound
    or video program.


    To change to a different preemption model, use this menu:


    `Processor type and features`


    `    Preemption Model`


    `        (X) No Forced Preemption (Server)`


    `    ( ) Voluntary Kernel Preemption (Desktop)`


    `    ( ) Preemptible Kernel (Low-Latency Desktop)`


    If you wish to make the kernel even more responsive to higher priority tasks than
    the general preemption option provides, you can also allow interruptions to one
    of the main internal kernel locks:


    `Processor type and features`


    `    [*] Preempt The Big Kernel Lock`


    This option is able to be selected only if you have already selected either the
    `Preemptible Kernel` or `Symmetric multi-processing support` options.


    ## Suspend


    The Linux kernel has the ability to suspend itself to disk, allowing you to disconnect
    the power, and then at a later time, power up and resume exactly where the machine
    was when it was suspended. This functionality is very useful on laptops that run
    Linux.


    Enable this by selecting:


    `Power management options (ACPI, APM)`


    `    [*] Software Suspend`


    The kernel needs to know where to save the suspended kernel image to, and then
    later where to resume it from. This location is usually a kernel swap partition
    on the disk. To specify which partition this should be:


    `Power management options (ACPI, APM)`


    `    (/dev/hda3) Default resume partition`


    * * *


    ### Note


    Make sure you specify the proper partition to suspend the machine to, and do not
    use a partition that is being used by the system for data. The proper partition
    name can be found by running the following command:


    `$` **`/sbin/swapon -s | grep dev | cut -f 1 -d '' ''`**


    `/dev/hda3`


    Use the output of the preceding command in this kernel configuration option, and
    on the kernel boot line where it specifies where the kernel should be resumed
    from. After the machine has been suspended, to have it resume properly, pass the
    `resume=/dev/swappartition` argument to the kernel command line to have it use
    the proper image. If you do not want to have the suspended image restored, use
    the `noresume` kernel command line argument.


    * * *


    ## CPU Frequency Scaling


    Most modern processors can slow down the internal clock of the processor to conserve
    power and battery life. Linux supports this ability and offers a variety of power
    "governors." Different governors implement different heuristics in order to determine
    how to vary the processor speed depending on the system load and other variables.


    Enable the basic frequency scaling functionality:


    `Power management options (ACPI, APM)`


    `    [*] CPU Frequency scaling`


    Select the different type of frequency governors you wish to use:


    `Power management options (ACPI, APM)`


    `    [*] CPU Frequency scaling`


    `    [*]   ''performance'' governor`


    `    [*]   ''powersave'' governor`


    `    [*]   ''userspace'' governor for userspace frequency scaling`


    `    [*]   ''ondemand'' cpufreq policy governor`


    `    [*]   ''conservative'' cpufreq governor`


    For more information on what the different governors do, see [CPU_FREQ](#index_split_563.html_filepos610418).


    Select the default governor you wish to have running when the maching boots:


    `Power management options (ACPI, APM)`


    `    [*] CPU Frequency scaling`


    `          Default CPUFreq governor (performance)`


    Select the specific processor type on the machine. For details on how to determine
    the processor type of the machine, see [Processor Types](#index_split_075.html_filepos297525).


    `Power management options (ACPI, APM)`


    `    [*] CPU Frequency scaling`


    `    ---   CPUFreq processor drivers`


    `    [ ]   ACPI Processor P-States driver`


    `    [ ]   AMD Mobile K6-2/K6-3 PowerNow!`


    `    [ ]   AMD Mobile Athlon/Duron PowerNow!`


    `    [ ]   AMD Opteron/Athlon64 PowerNow!`


    `    [ ]   Cyrix MediaGX/NatSemi Geode Suspend Modulation`


    `    [*]   Intel Enhanced SpeedStep`


    `    [*]     Use ACPI tables to decode valid frequency/voltage pairs`


    `    [*]     Built-in tables for Banias CPUs`


    `    [ ]   Intel Speedstep on ICH-M chipsets (ioport interface)`


    `    [ ]   Intel SpeedStep on 440BX/ZX/MX chipsets (SMI interface)`


    `    [ ]   Intel Pentium 4 clock modulation`


    `    [ ]   nVidia nForce2 FSB changing`


    `    [ ]   Transmeta LongRun`


    ## Different Memory Models


    Linux on 32-bit Intel hardware can access up to 64 Gigabytes of memory, but the
    address space of the 32-bit processor is only 4 Gigabytes. To work around this
    limitation, Linux can map the additional memory into another area and then switch
    to it when other tasks need it. But if your machine has a smaller amount of memory,
    it is easier for Linux not to have to worry about handling the bigger areas, so
    it is beneficial to tell the kernel how much memory you want it to support. For
    a more detailed description of this option, please see [NOHIGHMEM](#index_split_539.html_filepos593999).


    Linux supports three different memory models for 32-bit Intel processors, depending
    on the memory available:


    *   Under 1 Gigabyte of physical memory


    *   Between 1 and 4 Gigabytes of physical memory.


    *   Greater than 4 Gigabytes of physical memory.


    To select the amount of memory:


    `Processor type and features`


    `    High Memory Support`


    `        (X) off`


    `        ( ) 4GB`


    `        ( ) 64GB`


