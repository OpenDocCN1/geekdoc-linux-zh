  trans: '


    I2C（读作 "I-square-C"）是一种由 Philips 开发的光速串行总线协议，用于许多微控制器应用。SMBus 或系统管理总线是 I2C 协议的一个子集。更多信息请参见
    `Documentation/i2c` 目录，特别是其中的 `summary` 文件。


    此选项支持 I2C 和 SMBus。如果你需要硬件传感器支持和 Video For Linux 支持，则需要它。


    如果你想要 I2C 支持，除了在此处选择 yes 之外，还必须为你的总线适配器选择特定的驱动程序。


    # SPI — SPI 支持


    串行外接口 (`SPI`) 是一种低层同步协议。支持 `SPI` 的芯片数据传输速率可达数十 Mbps。芯片通过控制器和片选选择器进行寻址。大多数 `SPI`
    从机不支持动态设备发现；某些甚至是只写或只读的。


    `SPI` 被微控制器广泛用于与传感器、EEPROM 和闪存器、编解码器以及各种控制器芯片、模数转换器和数模转换器等通信。可以使用 `SPI` 协议访问 MMC
    和 SD 卡；对于用于 MMC 插槽的 DataFlash 卡，必须始终使用 `SPI`。


    `SPI` 是一组使用四线接口（选择、时钟、数据输入和数据输出）的相似协议之一，包括 Microwire（半双工）、SSP、SSI 和 PSP。此驱动框架适用于大多数此类设备和控制器。


    # HWMON — 硬件监控支持


    硬件监控设备允许你监控系统的硬件健康。大多数现代主板包含此类设备。它可以包括温度传感器、电压传感器、风扇速度传感器以及各种附加功能（例如控制风扇速度）。如果你需要此支持，应该在此处选择
    yes，并对你的传感器芯片选择特定的驱动程序。


    # VIDEO_DEV — Video For Linux


    此选项启用对音频/视频采集和叠加设备以及 FM 收音卡的支持。每个设备的具体能力有所不同。


    内核包含了对新的 Video for Linux Two API (`V4L2`) 以及原始系统的支持。驱动程序和应用程序需要重写以使用 `V4L2`，但流行卡的驱动程序和大多数视频捕获功能的应用程序已经存在。


    更多信息和文档可以在 [`linuxtv.org`](http://linuxtv.org) 获取。`V4L2` 的文档也可以在 [`bytesex.org/v4l`](http://bytesex.org/v4l)
    获取。


    # DVB — DVB For Linux


    此选项启用对数字视频广播硬件的支持。如果你拥有 `DVB` 适配器并想使用它，或者你正在为数字顶盒编译 Linux，请启用此项。


    API 规范和用户工具可以在 [`www.linuxtv.org`](http://www.linuxtv.org) 获取。


    # FB — 帧缓冲设备支持


    帧缓冲设备为图形硬件提供了一种抽象。它代表某些视频硬件的帧缓冲区，允许应用程序软件通过定义良好的接口访问图形硬件，因此软件不需要了解任何底层（硬件寄存器）的内容。


    帧缓冲设备在 Linux 支持的所有不同架构上工作方式相同，使得应用程序的实现更加简单且具有可移植性；目前已存在一个 X server 专门使用帧缓冲设备。在多个非
    x86 架构上，帧缓冲设备是使用图形硬件的唯一方法。


    你需要一个名为 `fbset` 的程序来充分利用帧缓冲设备。请阅读 `Documentation/fb/framebuffer.txt` 以及位于 [`www.tldp.org/HOWTO/Framebuffer-HOWTO.html`](http://www.tldp.org/HOWTO/Framebuffer-HOWTO.html)
    的 Framebuffer-HOWTO 获取更多信息。


    如果你正在为非 x86 架构编译内核，请在此处以及你的显卡驱动处选择 yes。如果你是为 x86 架构编译，如果你想使用帧缓冲区，可以选择 yes，但这不是必须的。


    请注意，运行直接接触硬件（例如加速 X server）且未针对帧缓冲设备调过的图形可能会可能会意外的结果。


    # VGA_CONSOLE — VGA 文本控制台


    在此处选择 yes 将允许你通过符合通用 VGA 标准的显示器文本模式使用 Linux。几乎每个人都希望如此。


    可以使用 `SVGATextMode` 程序在文本模式下充分利用 SVGA 显卡的潜力。可以从 ftp://ibiblio.org/pub/Linux/utils/console
    下载它。


    # LOGO — 启动 Logo


    此选项启用启动时的精美企鹅 Logo。它会在内核启动时显示在帧缓冲区上。企鹅的数量显示了内核发现的处理器数量。


    # SOUND — 声卡支持


    如果你的电脑里有声卡，即它可以能发出比孤立蜂鸣声更多的声音，请选择 yes。确保你拥有关于你的声卡及其配置（I/O 端口、中断和 DMA 通道）的所有信息，因为会被要求提供这些信息。


    读取 Sound-HOWTO，可以在 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)。关于模块化音频系统的通用信息包含在
    `Documentation/sound/oss/Introduction` 文件中。以及 `Documentation/sound/oss/README.OSS`。


    如果你有一个 PnP 声卡并想在启动时使用 PnP 工具进行配置（阅读 [`www.roestock.co.uk/isapntools`](http://www.roestock.co.uk/isapntools)），你需要将声卡支持编译为模块，并在
    PnP 配置完成后加载该模块。要正确执行此，请阅读 `Documentation/sound/oss/README.modules`。


    我听说即使没有声卡，你也可以通过编程 PC 扬声器让你的电脑发出比偶尔蜂鸣声更多的声音。用于此的内核补丁和支持工具位于 `pcsp` 包中，可以在 ftp://ftp.infrad.org/pub/pcsp
    获取。


    # SND — 高级 Linux 架构


    选择 yes 以启用 ALSA (Advanced Linux Sound Architecture)，这是标准的 Linux 音频系统。


    更多信息请参见 [`www.alsa-project.org`](http://www.alsa-project.org)。


    # SND_USB_AUDIO — USB Audio/MIDI 驱动


    在此处选择 yes 以包含对 USB 音频和 USB MIDI 设备的支持。


    # USB — 主机 USB 支持


    通用串行总线 (`USB`) 是一种串行总线系统的规范，比传统的 PC 串口提供更高的速度和功能。总线为外设供电并允许热插拔。最多 127 个 USB 外设可以连接到一个
    USB 主机。


    USB 主机是树的根，外设是叶子，内部节点是被称为集线器的特殊 USB 设备。大多数电脑现在现在有 USB 主机端口，用于将扫描仪、键盘、鼠标、调制解调器、摄像头、磁盘、闪存、网络链路和打印机连接到
    PC。


    如果你的电脑有主机 USB 端口并且你想使用 USB 设备，在此处选择 yes。然后你需要对后续的主机控制器驱动 (HCD) 至少选择一个。选择一个 USB
    1.1 控制器，例如 `UHCI HCD support` 或 `OHCI HCD support`，以及对于不支持 USB 2.0 的旧系统的 `EHCI
    HCD (USB 2.0) support`。如果你不确定，全选也没有害。


    如果你的系统有 USB 设备端口（用于 USB 协议的外设侧），请改看 `USB Gadget` 选项。


    '
- fmt: '

    After choosing your HCD, select drivers for the USB peripherals you''ll be using.
    You may want to check out the information provided in `Documentation/usb` and
    especially the links given in `Documentation/usb/usb-help.txt`.


    ## USB_EHCI_HCD — EHCI HCD (USB 2.0) support


    The Enhanced Host Controller Interface (EHCI) is standard for USB 2.0 "high speed"
    (480 Mbit/sec, 60 Mbyte/sec) host controller hardware. If your USB host controller
    supports USB 2.0, you will likely want to configure this Host Controller Driver.
    At the time of this writing, the primary implementation of EHCI is a chip from
    NEC, widely available in add-on PCI cards, but implementations are in the works
    from other vendors, including Intel and Philips. Motherboard support is emerging.


    EHCI controllers are packaged with "companion" host controllers (`OHCI` or `UHCI`)
    to handle USB 1.1 devices connected to root hub ports. Ports will connect to EHCI
    if the device is high speed, otherwise they connect to a companion controller.
    If you configure EHCI, you should probably configure the `OHCI` (for NEC and some
    other vendors) USB Host Controller Driver or `UHCI` (for Via motherboards) Host
    Controller Driver too.


    You may want to read `Documentation/usb/ehci.txt` for more information on this
    driver.


    ## USB_OHCI_HCD — OHCI HCD support


    The Open Host Controller Interface (OHCI) is a standard for accessing USB 1.1
    host controller hardware. It does more in hardware than Intel''s `UHCI` specification.
    If your USB host controller follows the OHCI spec, say yes. On most non-x86 systems,
    and on x86 hardware that''s not using a USB controller from Intel or VIA, this
    is appropriate. If your host controller doesn''t use PCI, this is probably appropriate.
    For a PCI based system where you''re not sure, the `lspci -v` command will list
    the right `prog-if` for your USB controller(s): EHCI, `OHCI`, or `UHCI`.


    ## USB_UHCI_HCD — UHCI HCD (most Intel and VIA) support


    The Universal Host Controller Interface is a standard created by Intel for accessing
    the USB hardware in the PC (which is also called the USB host controller). If
    your USB host controller conforms to this standard, you may want to say yes. All
    recent boards with Intel PCI chipsets (such as `intel 430TX`, `440FX`, `440LX`,
    `440BX`, `i810`, `i820`) conform to this standard. All VIA PCI chipsets (like
    `VIA VP2`, `VP3`, `MVP3`, `Apollo Pro`, `Apollo Pro II` or `Apollo Pro 133`) also
    use the standard.


    ## USB_STORAGE — USB mass storage support


    Say yes here if you want to connect USB mass storage devices to your computer''s
    USB port. This is the driver you need for USB floppy drives, USB hard disks, USB
    tape drives, USB CD-ROMs, USB flash devices, and memory sticks, along with similar
    devices. This driver may also be used for some cameras and card readers.


    This option enables the `SCSI` option, but you probably also need `SCSI device
    support: SCSI disk support` for most USB storage devices to work properly.


    ## USB_SERIAL — USB serial converter support


    Say yes here if you have a USB device that provides normal serial ports, or acts
    like a serial device, and you want to connect it to your USB bus.


    Please read `Documentation/usb/usb-serial.txt` for more information on the specifics
    of the different devices that are supported, and on how to use them.


    ## USB_GADGET — Support for USB Gadgets


    USB is a master/slave protocol, organized with one master host (such as a PC)
    controlling up to 127 peripheral devices. The USB hardware is asymmetric, which
    makes it easier to set up: you can''t connect a "to-the-host" connector to a peripheral.


    Linux can run in the host or in the peripheral. In both cases you need a low level
    bus controller driver, and some software that talks to it. Peripheral controllers
    can be either discrete silicon or integrated with the CPU in a microcontroller.
    The more familiar host side controllers have names like such `EHCI`, `OHCI`, or
    `UHCI`, and are usually integrated into southbridges on PC motherboards.


    Enable this configuration option if you want to run Linux inside a USB peripheral
    device. Configure one hardware driver for your peripheral/device side bus controller,
    and a "gadget driver" for your peripheral protocol. (If you use modular gadget
    drivers, you may configure more than one.)


    If in doubt, say no and don''t enable these drivers; most people don''t have this
    kind of hardware (except maybe inside Linux PDAs).


    For more information, see [http://www.linux-usb.org/gadget](http://www.linux-usb.org/gadget)
    and the kernel DocBook documentation for this API.


    ## MMC — MMC support


    MMC is the "multi-media card" bus protocol.


    If you want MMC support, you should say yes here and also to the specific driver
    for your MMC interface.


    ## INFINIBAND — InfiniBand support


    Core support for InfiniBand (IB). Make sure to also select any protocols you wish
    to use as well as drivers for your InfiniBand hardware.


    ## EDAC — EDAC core system error reporting (experimental)


    EDAC is designed to report errors in the core system. These are low-level errors
    that are reported by the CPU or supporting chipset: memory errors, cache errors,
    PCI errors.


    If this code is reporting problems on your system, please see the EDAC project
    web pages for more information: [http://bluesmoke.sourceforge.net](http://bluesmoke.sourceforge.net)
    and [http://buttersup.com/edacwiki](http://buttersup.com/edacwiki)


    ## EXT2_FS — Second extended filesystem support


    `ext2` is a standard Linux system for hard disks. Most systems use the upgrade,
    `ext3`, instead.


    ### Note


    Note that the file system root partition (the one containing `ext2`) cannot be
    compiled as a module without using a special boot process, so building it as a
    module could be dangerous.


    ***


    ## EXT3_FS — Third extended system support


    This is the journaling version (called `ext3`) of the second extended system,
    the de facto standard Linux system for hard disks.


    The journaling code included in this driver means you do not have to run *fsck*
    (file system checker) after a crash. The journal keeps track of any changes that
    were being made at the time the system crashed, and can ensure that your file
    system is consistent without the need for a lengthy check.


    Other than adding the journal to the file system, the on-disk format of `ext3`
    is identical to `ext2`. It is possible to freely switch between using the `ext3`
    driver and the `ext2` driver, as long as the file system has been cleanly unmounted,
    or *fsck* is run on the file system before the switch.


    To add a journal on an existing `ext2` file system or change the behavior of `ext3`
    file systems, you can use the `tune2fs` utility. To modify attributes of files
    and directories on `ext3` file systems, use `chattr`. You need `e2fsprogs` version
    1.20 or later in order to create `ext3` journals (available at [http://sourceforge.net/projects/e2fsprogs](http://sourceforge.net/projects/e2fsprogs)).


    ## REISERFS_FS — ReiserFS support


    This is a journaled filesystem that stores not just filenames but the files themselves
    in a balanced tree. Balanced trees can be more efficient than traditional file
    system architectural foundations.


    In general, ReiserFS is as fast as `ext2`, but is more efficient with large directories
    and small files.


    ## JFS_FS — JFS filesystem support


    This is a port of IBM''s Journaled Filesystem. More information is available in
    the file `Documentation/filesystems/jfs.txt`.


    ## XFS_FS — XFS filesystem support


    XFS is a high performance journaling filesystem that originated on the SGI IRIX
    platform. It is completely multi-threaded, can support large files and large filesystems,
    extended attributes, and variable block sizes, is extent based, makes extensive
    use of B-trees, and uses directories, extents, and free space to aid both performance
    and scalability.

    '
