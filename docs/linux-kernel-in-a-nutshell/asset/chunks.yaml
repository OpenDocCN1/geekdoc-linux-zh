- fmt: "\nCopy this configuration file into your kernel directory and rename it to\
    \ `.config`. Then use it as the basis of the kernel configuration to build the\
    \ kernel as described in [Chapter 4](#index_split_027.html_filepos118695).\n\n\
    Using this configuration file should always generate a working kernel image for\
    \ your machine. The disadvantage of this kernel image is that you will have built\
    \ almost every kernel module and driver that is present in the kernel source tree.\
    \ This is almost never needed for a single machine, so you can start to turn off\
    \ different drivers and options that are not needed. It is recommended that you\
    \ disable only those options that you are sure you do not need, as there might\
    \ be parts of the system that rely on specific options to be enabled.\n\n## Finding\
    \ Which Module Is Needed\n\nA configuration file that comes from a distribution\
    \ takes a very long time to build, because of all of the different drivers being\
    \ built. You want to build only the drivers for the hardware that you have, which\
    \ will save time on building the kernel, and allows you to build some or all of\
    \ the drivers into the kernel itself, possibly saving a bit of memory, and on\
    \ some architectures, making for a faster running system. To cut your drivers\
    \ down, you need to determine which modules are needed to drive your hardware.\
    \ We will walk though two examples of how to find out what driver is needed to\
    \ control what piece of hardware.\n\nSeveral locations on your system store useful\
    \ information for determining which devices are bound to which drivers in a running\
    \ kernel. The most important location is a virtual filesystem called `sysfs`.\
    \ `sysfs` should always be mounted at the `/sys` location in your filesystem by\
    \ the initialization scripts of your Linux distribution. `sysfs` provides a glimpse\
    \ into how the different portions of the kernel are hooked together, with many\
    \ different symlinks pointing all around the filesystem.\n\nIn all of the following\
    \ examples, real `sysfs` paths and hardware types are shown. Your machine will\
    \ be different, but the relative locations of information will be the same. Do\
    \ not be alarmed if the file names in `sysfs` are different from your machine;\
    \ it is to be expected.\n\nAdditional, the internal structure of the `sysfs` filesystem\
    \ constantly changes around, due to the re-organization of devices and rethinking\
    \ by the kernel developers about how to best display internal kernel structures\
    \ to userspace. Because of this, over time, some of the symlinks previously mentioned\
    \ in this chapter might not be present. However the information is all still there,\
    \ just moved around a little bit.\n\n### Example: determining the network driver\n\
    \nOne of the most common and important devices in the system is the network interface\
    \ card. It is imperative to figure out which driver is controlling this device\
    \ and enable it in your kernel configuration so that networking works properly.\n\
    \nFirst, work backward from the network connection name to find out which PCI\
    \ device is controlling it. To do this, look at the different network names:\n\
    \n```\n$ ls /sys/class/net/\n```\n\n```\neth0 eth1 eth2 lo\n```\n\nThe `lo` directory\
    \ represents the network loopback device, and is not attached to any real network\
    \ device. The `eth0`, `eth1`, and `eth2` directories are what you should pay attention\
    \ to, as they represent real network devices.\n\nTo look further at these network\
    \ devices in order to figure out which you care about, use the `ifconfig` utility:\n\
    \n```\n$ /sbin/ifconfig -a\n```\neth0      Link encap:Ethernet  HWaddr 00:12:3F:65:7D:C2\
    \  \n           inet addr:192.168.0.13  Bcast:192.168.0.255  Mask:255.255.255.0\n\
    \           UP BROADCAST NOTRAILERS RUNNING MULTICAST  MTU:1500  Metric:1\n  \
    \         RX packets:2720792 errors:0 dropped:0 overruns:0 frame:0\n         \
    \  TX packets:1815488 errors:0 dropped:0 overruns:0 carrier:0\n           collisions:0\
    \ txqueuelen:100\n           RX bytes:3103826486 (2960.0 Mb)  TX bytes:371424066\
    \ (354.2 Mb)\n           Base address:0xdcc0 Memory:dfee0000-dff00000\neth1  \
    \    Link encap:UNSPEC  HWaddr 80-65-00-12-7D-C2-3F-00-00-00-00-00-00-00-00-00-00\
    \  \n           BROADCAST MULTICAST  MTU:1500  Metric:1\n           RX packets:0\
    \ errors:0 dropped:0 overruns:0 frame:0\n           TX packets:0 errors:0 dropped:0\
    \ overruns:0 carrier:0\n           collisions:0 txqueuelen:1000\n           RX\
    \ bytes:0 (0.0 b)  TX bytes:0 (0.0 b)\neth2      Link encap:UNSPEC  HWaddr 00-02-3C-04-11-09-D2-BA-00-00-00-00\n\
    \           BROADCAST MULTICAST  MTU:1500  Metric:1\n           RX packets:0 errors:0\
    \ dropped:0 overruns:0 frame:0\n           TX packets:0 errors:0 dropped:0 overruns:0\
    \ carrier:0\n           collisions:0 txqueuelen:1000\n           RX bytes:0 (0.0\
    \ b)  TX bytes:0 (0.0 b)\nlo       Link encap:Localback  \n           inet addr:127.0.0.1\
    \  Mask:255.0.0.0\n           UP LOOPBACK RUNNING  MTU:16436  Metric:1\n     \
    \      RX packets:60 errors:0 dropped:0 overruns:0 frame:0\n           TX packets:60\
    \ errors:0 dropped:0 overruns:0 carrier:0\n           collisions:0 txqueuelen:0\n\
    \           RX bytes:13409 (13.0 Kb)  TX bytes:13409 (13.0 Kb)\n```\n\nFrom this\
    \ list, you can tell that the `eth0` device is the network device that is active\
    \ and working, as can be seen by the lines:\n\n```\neth0      Link encap:Ethernet\
    \  HWaddr 00:12:3F:65:7D:C2  \n           inet addr:192.168.0.13  Bcast:192.168.0.255\
    \  Mask:255.255.255.0\n```\n\nThese show this is an Ethernet device with valid\
    \ `inet` address assigned to it.\n\nNow that we have determined that we want to\
    \ make sure the `eth0` device will be working in our new kernel, we need to find\
    \ which driver is controlling it. This is simply a matter of walking the different\
    \ links in the `sysfs` filesystem, which can be done in a one-line command:\n\n\
    ```\n$ basename `readlink /sys/class/net/eth0/device/driver/module`\ne1000\n```\n\
    \nThis shows that the module named `e1000` is controlling the `eth0` network device.\
    \ The `basename` command shown compresses the following steps into a single command\
    \ line:\n\n1. Follow the `/sys/class/net/eth0/device` symlink into the directory\
    \ within the `/sys/device/` tree that contains the information for the device\
    \ that controls `eth0`. Note that the `/sys/class/net/eth0` directory might also\
    \ be a symlink on the newer versions of the kernel.\n2. Within the directory that\
    \ describes the device in `sysfs`, there is a symlink to the driver bound to this\
    \ device. That symlink is called `driver`, so we follow that link.\n3. Within\
    \ the directory that describes the driver in `sysfs`, there is a symlink to the\
    \ module that this driver is contained within. That symlink is called `module`.\
    \ We want the target of that symlink. To get the target, we use the `readlink`\
    \ command, which produces output such as:\n```\n$ readlink /sys/class/net/eth0/device/driver/module\n\
    ../../../../module/e1000\n```\n4. As we care only about the name of the module,\
    \ we want to strip the rest of the path off the output of the `readlink` command,\
    \ and only save the rightmost portion. That is what the `basename` command does.\
    \ Executed directly on a pathname, it would produce:\n```\n$ basename ../../../../module/e1000\n\
    e1000\n```\n\nSo we put the output of the long symlink traversal to the `readlink`\
    \ location into the `basename` program, enabling the whole process to be done\
    \ in one line.\n\nNow that we have the module name, we need to find the kernel\
    \ configuration option that controls it. You can look through the different network\
    \ device configuration menus or search the kernel source code itself to make sure\
    \ you have the right option:\n\n```\n$ cd ~/linux/linux-2.6.17.8\n```\n\n```\n\
    $ find -type f -name Makefile | xargs grep e1000\n```\n\n```\n./drivers/net/Makefile:obj-$(CONFIG_E1000)\
    \ += e1000/\n```\n\n```\n./drivers/net/e1000/Makefile:obj-$(CONFIG_E1000) += e1000.o\n\
    ```\n\n```\n./drivers/net/e1000/Makefile:e1000-objs := e1000_main.o e1000_hw.o\
    \ e1000_ethtool.o e1000_param.o\n```\n"
  raw: "Copy this configuration file into your kernel directory and rename it to *.config*.\
    \ Then use it as the basis of the kernel configuration to build the kernel as\
    \ described in [Chapter 4](#index_split_027.html_filepos118695).\n\nUsing this\
    \ configuration file should always generate a working kernel image for your machine.\
    \ The disadvantage of this kernel image is that you will have built almost every\
    \ kernel module and driver that is present in the kernel source tree. This is\
    \ almost never needed for a single machine, so you can start to turn off different\
    \ drivers and options that are not needed. It is recommended that you disable\
    \ only those options that you are sure you do not need, as there might be parts\
    \ of the system that rely on specific options to be enabled.\n\n## Finding Which\
    \ Module Is Needed\n\nA configuration file that comes from a distribution takes\
    \ a very long time to build, because of all of the different drivers being built.\
    \ You want to build only the drivers for the hardware that you have, which will\
    \ save time on building the kernel, and allows you to build some or all of the\
    \ drivers into the kernel itself, possibly saving a bit of memory, and on some\
    \ architectures, making for a faster running system. To cut your drivers down,\
    \ you need to determine which modules are needed to drive your hardware. We will\
    \ walk though two examples of how to find out what driver is needed to control\
    \ what piece of hardware.\n\nSeveral locations on your system store useful information\
    \ for determining which devices are bound to which drivers in a running kernel.\
    \ The most important location is a virtual filesystem called `sysfs`. `sysfs`\
    \ should always be mounted at the */sys* location in your filesystem by the initialization\
    \ scripts of your Linux distribution. `sysfs` provides a glimpse into how the\
    \ different portions of the kernel are hooked together, with many different symlinks\
    \ pointing all around the filesystem.\n\nIn all of the following examples, real\
    \ `sysfs` paths and hardware types are shown. Your machine will be different,\
    \ but the relative locations of information will be the same. Do not be alarmed\
    \ if the file names in `sysfs` are different from your machine; it is to be expected.\n\
    \nAdditional, the internal structure of the `sysfs` filesystem constantly changes\
    \ around, due to the re-organization of devices and rethinking by the kernel developers\
    \ about how to best display internal kernel structures to userspace. Because of\
    \ this, over time, some of the symlinks previously mentioned in this chapter might\
    \ not be present. However the information is all still there, just moved around\
    \ a little bit.\n\n### Example: determining the network driver\n\nOne of the most\
    \ common and important devices in the system is the network interface card. It\
    \ is imperative to figure out which driver is controlling this device and enable\
    \ it in your kernel configuration so that networking works properly.\n\nFirst,\
    \ work backward from the network connection name to find out which PCI device\
    \ is controlling it. To do this, look at the different network names:\n\n`$` **`ls\
    \ /sys/class/net/`**\n\n`eth0  eth1  eth2  lo`\n\nThe `lo` directory represents\
    \ the network loopback device, and is not attached to any real network device.\
    \ The `eth0`, `eth1`, and `eth2` directories are what you should pay attention\
    \ to, as they represent real network devices.\n\nTo look further at these network\
    \ devices in order to figure out which you care about, use the `ifconfig` utility:\n\
    \n`$` **`/sbin/ifconfig -a`**\n\n`eth0      Link encap:Ethernet  HWaddr 00:12:3F:65:7D:C2\
    \  `\n\n`          inet addr:192.168.0.13  Bcast:192.168.0.255  Mask:255.255.255.0`\n\
    \n`          UP BROADCAST NOTRAILERS RUNNING MULTICAST  MTU:1500  Metric:1`\n\n\
    `          RX packets:2720792 errors:0 dropped:0 overruns:0 frame:0`\n\n`    \
    \      TX packets:1815488 errors:0 dropped:0 overruns:0 carrier:0`\n\n`      \
    \    collisions:0 txqueuelen:100`\n\n`          RX bytes:3103826486 (2960.0 Mb)\
    \  TX bytes:371424066 (354.2 Mb)`\n\n`          Base address:0xdcc0 Memory:dfee0000-dff00000`\n\
    \n`eth1      Link encap:UNSPEC  HWaddr 80-65-00-12-7D-C2-3F-00-00-00-00-00-00-00-00-00\
    \  `\n\n`          BROADCAST MULTICAST  MTU:1500  Metric:1`\n\n`          RX packets:0\
    \ errors:0 dropped:0 overruns:0 frame:0`\n\n`          TX packets:0 errors:0 dropped:0\
    \ overruns:0 carrier:0`\n\n`          collisions:0 txqueuelen:1000`\n\n`      \
    \    RX bytes:0 (0.0 b)  TX bytes:0 (0.0 b)`\n\n`eth2      Link encap:UNSPEC  HWaddr\
    \ 00-02-3C-04-11-09-D2-BA-00-00-00-00-00-00-00-00  `\n\n`          BROADCAST MULTICAST\
    \  MTU:1500  Metric:1`\n\n`          RX packets:0 errors:0 dropped:0 overruns:0\
    \ frame:0`\n\n`          TX packets:0 errors:0 dropped:0 overruns:0 carrier:0`\n\
    \n`          collisions:0 txqueuelen:1000`\n\n`          RX bytes:0 (0.0 b)  TX\
    \ bytes:0 (0.0 b)`\n\n`lo        Link encap:Local Loopback  `\n\n`          inet\
    \ addr:127.0.0.1  Mask:255.0.0.0`\n\n`          UP LOOPBACK RUNNING  MTU:16436\
    \  Metric:1`\n\n`          RX packets:60 errors:0 dropped:0 overruns:0 frame:0`\n\
    \n`          TX packets:60 errors:0 dropped:0 overruns:0 carrier:0`\n\n`      \
    \    collisions:0 txqueuelen:0`\n\n`          RX bytes:13409 (13.0 Kb)  TX bytes:13409\
    \ (13.0 Kb)`\n\nFrom this list, you can tell that the `eth0` device is the network\
    \ device that is active and working, as can be seen by the lines:\n\n`eth0    \
    \  Link encap:Ethernet  HWaddr 00:12:3F:65:7D:C2  `\n\n`          inet addr:192.168.0.13\
    \  Bcast:192.168.0.255  Mask:255.255.255.0`\n\nThese show this is an Ethernet\
    \ device with valid IP (`inet`) address assigned to it.\n\nNow that we have determined\
    \ that we want to make sure the `eth0` device will be working in our new kernel,\
    \ we need to find which driver is controlling it. This is simply a matter of walking\
    \ the different links in the `sysfs` filesystem, which can be done in a one-line\
    \ command:\n\n`$` **`` basename `readlink /sys/class/net/eth0/device/driver/module`\
    \ ``**\n\n`e1000`\n\nThis shows that the module named `e1000` is controlling the\
    \ `eth0` network device. The *basename...* command shown compresses the following\
    \ steps into a single command line:\n\n1.  Follow the */sys/class/net/eth0/device*\
    \ symlink into the directory within the */sys/device/* tree that contains the\
    \ information for the device that controls `eth0`. Note that the */sys/class/net/eth0*\
    \ directory might also be a symlink on the newer versions of the kernel.\n\n2.\
    \  Within the directory that describes the device in `sysfs`, there is a symlink\
    \ to the driver bound to this device. That symlink is called *driver*, so we follow\
    \ that link.\n\n3.  Within the directory that describes the driver in `sysfs`,\
    \ there is a symlink to the module that this driver is contained within. That\
    \ symlink is called *module*. We want the target of that symlink. To get the target,\
    \ we use the *readlink* command, which produces output such as:`$` **`readlink\
    \ /sys/class/net/eth0/device/driver/module`**\n\n    `../../../../module/e1000`\n\
    \n4.  As we care only about the name of the module, we want to strip the rest\
    \ of the path off the output of the *readlink* command, and only save the rightmost\
    \ portion. That is what the *basename* command does. Executed directly on a pathname,\
    \ it would produce:`$` **`basename ../../../../module/e1000`**\n\n    `e1000`\n\
    \nSo we put the output of the long symlink traversal to the *readlink* location\
    \ into the *basename* program, enabling the whole process to be done in one line.\n\
    \nNow that we have the module name, we need to find the kernel configuration option\
    \ that controls it. You can look through the different network device configuration\
    \ menus or search the kernel source code itself to make sure you have the right\
    \ option:\n\n`$` **`cd ~/linux/linux-2.6.17.8`**\n\n`$` **`find -type f -name\
    \ Makefile | xargs grep e1000`**\n\n`./drivers/net/Makefile:obj-$(CONFIG_E1000)\
    \ += e1000/`\n\n`./drivers/net/e1000/Makefile:obj-$(CONFIG_E1000) += e1000.o`\n\
    \n`./drivers/net/e1000/Makefile:e1000-objs := e1000_main.o e1000_hw.o e1000_ethtool.o\
    \ e1000_param.o`"
