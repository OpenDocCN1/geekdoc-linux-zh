    list of kernels that are available at boot time. Use the down arrow to highlight
    the new kernel version, and press Enter to boot the new kernel image.


    # Chapter 6. Upgrading a kernel


    Inevitably it happens, you have a custom built kernel, working just wonderfully
    except for one little thing that you know is fixed in the latest release from
    the kernel developers. Or a security problem is found, and a new stable kernel
    release is made public. Either way, you are faced with the issue of upgrading
    the kernel and you do not want to lose all the time and effort that went into
    making that perfect kernel configuration.


    This chapter is going to show how easy it is to update a kernel from an older
    versions, while still retaining all of the configuration options from the previous
    one.


    First off, please back up the `.config` file in the kernel source directory. You
    have spent some time and effort into creating it, and it should be saved in case
    something goes wrong when trying to upgrade.


    ```bash

    $ cd ~/linux/linux-2.6.17.11

    $ cp .config ../good_config

    ```


    There are only five simple steps that are needed to upgrade a kernel from a previously
    built one:


    1. Get the new source code.

    2. Apply the changes to the old source tree to bring it up to the newer level.

    3. Reconfigure the kernel based on the previous kernel configuration.

    4. Build the new kernel.

    5. Install the new kernel.


    The last two steps work the same as described before, so we will only discuss
    the first three steps in this chapter.


    In this chapter, we are going to assume that you have built a successful 2.6.17.9
    kernel release, and want to upgrade to the 2.6.17.11 release.


    # Download the new source


    The Linux kernel developers realize that all users do not wish to download the
    entire source code to the kernel for every update. That would be a waste of bandwidth
    and time. Because of this, they offer a patch that can upgrade an older kernel
    release, to a newer one.


    On the main `kernel.org` website, you will remember that it contained a list of
    the current kernel versions that are available for download:


    ![The main kernel.org web site](images/00018.png)

    Figure 6-1. The main kernel.org web site


    Previously, you used the link pointed to you by the `F` to download the entire
    source code for the kernel. However, if you click on the name of the kernel release,
    it will download a patch file instead:


    ![Downloading a patch from kernel.org](images/00019.png)


    Figure 6-2. Downloading a patch from kernel.org


    This is what we want to do when upgrading. But we need to figure out what patch
    to download.


    ## Which patch applies to which release?


    A kernel patch file only will upgrade the source code from one specific release
    to another specific release. Here is how the different patch files can be applied:


    * Stable kernel patches apply to the base kernel version. This means that the
    2.6.17.10 patch will only apply to the 2.6.17 kernel release. The 2.6.17.10 kernel
    patch will not apply to the 2.6.17.9 kernel or any other release.

    * Base kernel release patches only apply to the previous base kernel version.
    This means that the 2.6.18 patch will only apply to the 2.6.17 kernel release.
    It will not apply to the last 2.6.17.y kernel release, or any other release.

    * Incremental patches upgrade from a specific release to the next release. This
    allows developers to not have to downgrade their kernel and then upgrade it, just
    to switch from the latest stable release to the next stable release (remember
    that the stable release patches are only against the base kernel, not the previous
    stable release.) Whenever possible, it is recommended that you use the incremental
    patches to make your life easier.


    # Finding the patch


    As we want to go from the 2.6.17.9 kernel release, to the 2.6.17.11 release, we
    will need to download two different patches. We will need a patch from the 2.6.17.9
    release to the 2.6.17.10 release, and then from the 2.6.17.10 release to the 2.6.17.11
    release.


    The stable and base kernel patches are located in the same directory structure
    as the main source trees. All incremental patches can be found one level lower,
    in the `incr` subdirectory. So, to find the patch that goes from 2.6.17.9 to 2.6.17.10,
    we look in the `/pub/linux/kernel/v2.6/incr` directory to find the files we need:


    ```bash

    $ cd ~/linux

    $ lftp ftp.kernel.org/pub/linux/kernel/v2.6/incr

    cd ok, cwd=/pub/linux/kernel/v2.6/incr

    lftp ftp.kernel.org:/pub/linux/kernel/v2.6/incr> ls *2.6.17.9*.bz2

    -rw-rw-r-- 1 536 536 Aug 22 19:23 patch-2.6.17.9-10.bz2

    lftp ftp.kernel.org:/pub/linux/kernel/v2.6/incr> get patch-2.6.17.9-10

    2872 bytes transferred

    lftp ftp.kernel.org:/pub/linux/kernel/v2.6/incr> get patch-2.6.17.10-11

    7901 bytes transferred

    lftp ftp.kernel.org:/pub/linux/kernel/v2.6/incr> exit

    $ ls -F

    good_config linux-2.6.17.9/ patch-2.6.17.10-11 patch-2.6.17.9-10

    ```


    It is called `patch` because the `patch` program takes the file and applies it
    to the original tree, creating the new tree. The patch file contains a representation
    of the changes that are necessary to reconstruct the new files, based on the old
    ones. Patch files are readable, and contain a list of the lines to be removed
    and the lines to be added, with some context within the file showing where the
    changes should be made. If you need to upgrade more than two versions, it is recommended
    as a way to save steps, to go backwards, and then upgrade forward. In this case,
    we could go backward from 2.6.17.9 to 2.6.17 and then forward from 2.6.17 to 2.6.11.
    In this example, we use the very `lftp` FTP program to download the patch files.
    Any ftp program or a web browser can be used to download the same files. The important
    thing here is to show where the files are located.


    # Applying the patch


    As the patches we have downloaded are compressed, the first thing to do is uncompress
    them with the `bzip2` command:


    ```bash

    $ bzip2 -dv patch-2.6.17.9-10.bz2

    patch-2.6.17.9-10.bz2: done

    $ bzip2 -dv patch-2.6.17.10-11.bz2

    patch-2.6.17.10-11.bz2: done

    $ ls -F

    good_config linux-2.6.17.9/ patch-2.6.17.10-11 patch-2.6.17.9-10

    ```


    Now we need to apply the patch files to the kernel directory. Go into the directory:


    ```bash

    $ cd linux-2.6.17.9

    ```


    and run the `patch` program to apply the first patch moving the source tree from
    the 2.6.17.9 to 2.6.17.10 release:


    ```bash

    $ patch -p1 < ../patch-2.6.17.9-10

    patching file Makefile

    patching file block/elevator.c

    patching file fs/udf/super.c

    patching file fs/udf/truncate.c

    patching file include/net/sctp/sctp.h

    patching file include/net/sctp/sm.h

    patching file net/sctp/sm_make_chunk.c

    patching file net/sctp/sm_statefuns.c

    patching file net/sctp/socket.c

    ```


    Verify that the patch really did work properly and that there are no errors or
    warnings in the output of the patch program. It is also a good idea to look at
    the `Makefile` of the kernel to see the kernel version:


    ```bash

    $ head -n 5 Makefile

    VERSION = 2

    PATCHLEVEL = 6

    SUBLEVEL = 17

    EXTRAVERSION = .10

    NAME=Crazed Snow-Weasel

    ```


    Now that the kernel is at the 2.6.17.10 release level, do the same thing as before
    and apply the patch to bring it up to the 2.6.17.11 level:


    ```bash

    $ patch -p1 < ../patch-2.6.17.10-11

    patching file Makefile

    patching file arch/ia64/kernel/sys_ia64.c

    patching file arch/sparc/kernel/sys_sparc.c

    patching file arch/sparc64/kernel/sys_sparc.c

    patching file drivers/char/tpm/tpm_tis.c

    ```

