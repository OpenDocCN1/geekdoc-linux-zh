  trans: "\n\n- `EXPERIMENTAL`: 用于开发和/或不完整代码/驱动的提示\n- `LOCALVERSION`: 本地版本 -- 追加到内核版本\n\
    - `AUDIT`: 审计支持\n- `IKCONFIG`: 内核 `*.config` 支持\n- `EMBEDDED`: 配置标准内核功能（用于小型系统）\n\
    - `MODULES`: 启用可加载模块支持\n- `IOSCHED_NOOP`: No-op I/O 调度器\n- `IOSCHED_AS`: Anticipatory\
    \ I/O 调度器\n- `IOSCHED_DEADLINE`: Deadline I/O 调度器\n- `IOSCHED_CFQ`: CFQ I/O 调度器\n\
    - `SMP`: 对称多处理支持\n- `M386`: 386\n- `X86_GENERIC`: 通用 x86 支持\n- `NR_CPUS`: 最大 CPU\
    \ 数量 (2-255)\n- `SCHED_SMT`: SMT (超线程)调度\n- `PREEMPT_NONE`: 无强制抢占（服务器）\n- `PREEMPT_VOLUNTARY`:\
    \ 愿内核抢占（桌面级）\n- `PREEMPT`: 可抢占内核（低延迟桌面）\n- `PREEMPT_BKL`: 抢占大内核锁 (Big Kernel Lock)\n\
    - `NOHIGHMEM`: 关闭\n- `HIGHMEM4G`: 4GB\n- `HIGHMEM64G`: 64GB\n- `FLATMEM_MANUAL`:\
    \ 直接内存\n- `DISCONTIGMEM_MANUAL`: 不连续内存\n- `SPARSEMEM_MANUAL`: 稀疏内存\n- `SECCOMP`:\
    \ 启用 seccomp 安全计算不可信字节码\n- `KEXEC`: `kexec` 系统调用（实验性）\n- `HOTPLUG_CPU`: 支持热插 CPU（实验性）\n\
    - `PM`: 电源管理支持\n- `SOFTWARE_SUSPEND`: 挂起\n- `ACPI`: ACPI 支持\n- `CPU_FREQ`: CPU\
    \ 缩放\n- `CPU_FREQ_DEFAULT_GOV_PERFORMANCE`: 性能模式\n- `CPU_FREQ_DEFAULT_GOV_USERSPACE`:\
    \ 用户空间模式\n- `CPU_FREQ_GOV_PERFORMANCE`: \"Performance\" CPUFreq 策略调度器\n- `CPU_FREQ_GOV_POWERSAVE`:\
    \ \"Powersave\" CPUFreq 策略调度器\n- `CPU_FREQ_GOV_USERSPACE`: \"Userspace\" CPUFreq\
    \ 策略调度器\n- `CPU_FREQ_GOV_ONDEMAND`: \"Ondemand\" CPUFreq 策略调度器\n- `CPU_FREQ_GOV_CONSERVATIVE`:\
    \ \"Conservative\" CPUFreq 调度器\n- `PCI`: PCI 支持\n- `PCCARD`: PCCard (PCMCIA/CardBus)\n\
    - `PCMCIA`: 16 位 PCMCIA\n- `CARDBUS`: 32 位 CardBus\n- `HOTPLUG_PCI`: 支持 PCI 热插拔（实验性）\n\
    - `NET`: 网络支持\n- `UNIX`: Unix 套接字\n- `INET`: TCP/IP 网络\n- `IP_ADVANCED_ROUTER`:\
    \ IP: 高级路由器\n- `NETFILTER`: 网络数据包过滤\n- `NET_SCHED`: QoS 或公平队列\n- `IRDA`: IrDA（红外）子系统\n\
    - `IRLAN`: IrLAN 协议\n- `IRNET`: IrNET 协议\n- `IRCOMM`: IrCOMM 协议\n- `IRDA_ULTRA`:\
    \ Ultra（无连接）协议\n- `BT`: 蓝牙子系统\n- `IEEE80211`: 通用 IEEE 802.11 网络\n- `MTD`: 内存技术设备\
    \ (MTD) 支持\n- `PARPORT`: 并口支持\n- `PNP`: 即插即用支持\n- `ISAPNP`: ISA 即插即用支持\n- `PNPBIOS`:\
    \ 即插即用 BIOS（实验性）\n- `IDE`: ATA/ATAPI/MFM/RLL 支持\n- `BLK_DEV_IDE`: 增强 IDE/MFM/RLL\
    \ 磁盘/光驱/软盘支持\n- `BLK_DEV_IDEDISK`:  IDE/ATA-2 磁盘支持\n- `BLK_DEV_IDECD`:  IDE/ATAPI\
    \ 光驱支持\n- `BLK_DEV_IDEFLOPPY`:  IDE/ATAPI 软盘支持\n- `SCSI`: SCSI 设备支持\n- `BLK_DEV_SD`:\
    \ SCSI 磁盘支持\n- `CHR_DEV_ST`: SCSI 磁带支持\n- `BLK_DEV_SR`: SCSI 光驱支持\n- `CHR_DEV_SG`:\
    \ SCSI 通用支持\n- `CHR_DEV_SCH`: SCSI 质质器支持\n- `SCSI_MULTI_LUN`: 探测每个 SCSI 设备上的所有\
