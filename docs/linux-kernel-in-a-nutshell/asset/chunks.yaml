    The Linux kernel supports different security models by providing hooks and letting
    you build in your choice of model. At the moment, only a few models come with
    the default kernel source tree, but developers of new models are working on getting
    more accepted.


    ## Default Linux Capabilities


    The standard type of security model for Linux is the "capability" model. You should
    always select this option unless you really want to run an insecure kernel for
    some reason.


    To enable it:


    `Security options`

    `  [*] Enable different security models`

    `  [*]   Default Linux Capabilities`


    ## SELinux


    A very popular security model is called SELinux. This model is supported by a
    number of different Linux distributions.


    SELinux requires that the networking option be enabled. See [Networking](#index_split_082.html_filepos315179)
    to enable this.


    SELinux also requires that audit be enabled in the kernel configuration. To do
    this:


    `General setup`

    `  [*] Auditing support`


    Also, the networking security option must be enabled:


    `Security options`

    `  [*] Enable different security models`

    `  [*]   Socket and Networking Security Hooks`


    Now it is possible to select the SELinux option:


    `Security options`

    `  [*] Enable different security models`

    `  [*]   NSA SELinux Support`


    There are also a number of individual SELinux options that you might wish to enable.
    Please see the help for the individual different items for more descriptions on
    what they do in.


    `Security options`

    `  [*] Enable different security models`

    `  [*]   NSA SELinux Support`

    `  [ ]   NSA SELinux boot parameter`

    `  [ ]   NSA SELinux runtime disable`

    `  [*]   NSA SELinux Development Support`

    `  [*]   NSA SELinux AVC Statistics`

    `  (1)   NSA SELinux checkreqprot default value`


    # Kernel debugging


    A wide range of different kernel options can help in debugging what is going on
    within the kernel. Following is a list of some of the more common ones that can
    be useful for discovering new things about how the kernel works, or help find
    potential problems within the current kernel source code.


    ### Kernel log timestamps


    The kernel outputs a wide range of messages to its log file. These messages can
    be seen by looking at the system log file (usually located in `/var/log/messages`),
    or by running the `dmesg` command.


    Sometimes it is useful to see exactly when those messages were created. `dmesg`,
    however, does not put any timestamps on the events it shows, and the time resolution
    of `/var/log/messages` is only to the nearest second. You can configure the kernel
    to assign each message a timestamp that is accurate down to the smallest measurable
    kernel time value (usually in the microsecond range.)


    To enable timestamp options on kernel messages:


    `Kernel hacking`

    `  [*] Show timing information on printks`


    ### Magic SysRq keys


    The `SysRq` key on the keyboard can be used to control the kernel in a number
    of different ways while the kernel is running, or after it has crashed.


    To enable this option:


    `Kernel hacking`

    `  [*] Magic SysRq key`


    For a full description of the different actions that can be triggered by this
    option, please see the file `Documentation/sysrq.txt` in the kernel source tree.


    ### Debug Filesystem


    A RAM-based filesystem can be used to output a lot of different debugging information.
    This filesystem is called `debugfs` and can be enabled by:


    `Kernel hacking`

    `  [*] Debug filesystem`


    After you enable this option and boot the rebuilt kernel, it creates the directory
    `/sys/kernel/debug` as a location for the user to mount the `debugfs` filesystem.
    Do this manually by:


    ```bash

    mount -t debugfs none /sys/kernel/debug

    ```


    or have the filesystem mounted automatically at boot time by adding the following
    line to the `/etc/fstab` file:


    ```bash

    debugfs /sys/kernel/debug debugfs 0 0

    ```


    After you mount `debugfs`, a large number of different directories and files will
    turn up in the `/sys/kernel/debug/` directory. These are all virtual and dynamically
    generated by the kernel, like the files in `procfs` or `sysfs`. The files can
    be used to help debug different kernel subsystems, or just perused to see what
    is happening to the system as it runs.


    ### General Kernel Debugging


    Here are a range of other good kernel configuration options that you might wish
    to enable if you want to help kernel developers debug different problems, or just
    learn more about how the kernel works by looking at the messages that these options
    print out. Note that if you enable almost any of these options, the kernel will
    slow down a small amount, so if you notice any decrease in performance, you might
    wish to disable the options.


    `Kernel hacking`

    `  [*] Kernel debugging`

    `  [*]   Detect Soft Lockups`

    `  [ ]   Collect scheduler statistics`

    `  [*]   Debug slab memory allocations`

    `  [*]   Memory leak debugging`

    `  [*]   Mutex detection`

    `  [*]   Spinlock debugging`

    `  [*]   Sleep-inside checking`

    `[ ]   kobject debugging`

    `[ ]   Highmem debugging`

    `[ ]   Compile the kernel with debug info


    # Kernel boot line parameters


    There are three ways to pass options to the kernel and thus control its behavior:


    1. When building the kernel. Most of this book discusses these options.

    2. When starting the kernel. Usually, parameters are passed from a file such as
    the GRUB or LILO configuration.

    3. At run-time, by writing to files in */proc* and */sys* directories.


    This chapter describes the second method. The chapter breaks the boot-time options
    into different logical sections. A number of architecture-specific and individual
    driver options are not listed here. For a complete list of all known options,
    please see the *Documentation/kernel-parameters.txt* in the source tree.


    Not all of the listed options are always available. Most are associated with subsystems,
    and work only if the kernel is configured with those subsystems built in. They
    also depend on the presence of the hardware with which they are associated.


    All of these parameters are case-sensitive.


    # Module-specific options


    In addition to the options listed in this chapter, parameters for modules that
    are built into the kernel can also be passed on the command line. (Dynamically
    loaded modules, of course, are not in memory when the kernel boots and therefore
    cannot be passed parameters at boot time.) The syntax for passing parameters consisting
    of the module name followed by a dot (`.`) and the parameter.


    For example, the `usbcore` module accepts the parameter `blinkenlights` to display
    flashing lights on all supported USB 2.0 hubs (don''t ever say the kernel developers
    don''t have a sense of humor). To set this parameter when loading the module dynamically,
    you would enter:


    ```bash

    modprobe usbcore blinkenlights=1

    ```


    But if the `usbcore` module is built into the kernel, you achieve the same effect
    by invoking the kernel with the following option:


    ```bash

    usbcore.blinkenlights=1

    ```


    Most module options for modules that are built into the kernel can also be changed
    at run time by writing to files in the subdirectory named after the module under
    the */sys/module/* directory. Thus, the `blinkenlights` option is represented
    by the file */sys/module/usbcore/blinkenlights*.


    # Console options


    These options deal with the console or kernel log, where kernel debugging and
    error information are displayed.


    ## Name


    console — Output console device and options.


    ## Synopsis


    `console=`


    ## Options


    `tty`*`n`*

