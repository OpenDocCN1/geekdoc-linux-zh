    在对所有 CPU 强制重新调度之前，设置应当队列的额外 RCU 回调数量。


    # ACPI 选项


    这些选项控制了高级配置和电源接口 (ACPI) 子系统可以使用的参数。


    ## 名称

    `acpi` — ACPI 子系统选项。


    ## 提览

    `acpi=`[`force`|`off`|`noirq`|`ht`|`strict`]`


    这是高级配置和电源接口 (ACPI) 的主选项。取值如下：


    `force`

    > 强制启用 ACPI。可用于覆盖禁用了它的内核配置选项。


    `off`

    > 禁用 ACPI。可用于覆盖启用了它的内核配置选项。


    `noirq`

    > 防止 ACPI 用于中端请求（IRQ）路由。


    `ht`

    > 仅运行足够多数量的 ACPI 层，以在支持该功能的处理器上启用超线程（HyperThreading）。


    `strict`

    > 使 ACPI 层对不完全符合 ACPI 规范的平台忍度降低。


    ## 名称

    `acpi_sleep` — ACPI 睡眠选项。


    ## 提览

    `acpi_sleep=`[`s3_bios`],[`s3_mode`]`


    在 S3 恢复期间（在机器挂起到内存后发生），硬件需要被正确地初始化。对于大多数设备，这是简单的，但视频卡除外，视频卡通常由 BIOS 初始化。内核没有足够的信息来恢复视频设备，因为这些信息在
    BIOS 中且完全无法访问。此选项允许内核尝试使用 ACPI 子系统以两种不同的方式恢复显卡。


    请查看文件 `Documentation/power/video.txt` 以获取更多关于该选项的信息，以及如何为你的硬件类型找到正确的值。


    ## 名称

    `acpi_sci` — ACPI 系统控制中断的触发模式。


    ## 提览

    `acpi_sci=`[`level`|`edge`|`high`|`low]`


    设置 ACPI 系统控制中断的触发模式。


    ## 名称

    `acpi_irq_balance` — 启用 ACPI IRQ 平衡。


    使 ACPI 平衡活跃的 IRQ。这是在 APIC 模式下运行时默认选项。


    ## 名称

    `acpi_irq_nobalance` — 禁用 ACPI IRQ 平衡。


    使 ACPI 不移动活跃的 IRQ。这是在 PIC 模式下运行时默认选项。


    ## 名称

    `acpi_irq_isa` — 将列出的 IRQ 标记为 ISA 使用。


    ## 提览

    `acpi_irq_isa=``irq`[``,`irq`...]


    如果启用了 IRQ 平衡选项，将列出的 IRQ 标记为 ISA 子系统使用。


    ## 名称

    `acpi_irq_pci` — 将列出的 IRQ 标记为 PCI 使用。


    ## 提览

    `acpi_irq_pci=``irq`[``,[`irq`...]


    如果启用了 IRQ 平衡选项，将列出的 IRQ 标记为 PCI 子系统使用。


    ## 名称

    `acpi_os_name` — 向 ACPI 伪造操作系统名称。


    ## 提览

    `acpi_os_name=``name`


    告诉 ACPI BIOS 运行的操作系统名称为 `name`。这可以欺骗 BIOS 让其认为运行的是 Windows 而不是 Linux，从而帮助解决旧版
    BIOS 的某些 ACPI 问题。例如，使用字符串 `Microsoft 2001` 来欺骗 BIOS 认为机器上运行的是 Windows 2001。


    ## 名称

    `acpi_osi` — 禁用 OSI ACPI 方法。


    ## 提览

    `acpi_osi=`[`n`]`


    尽管这是一个整数值，但实际上是一个二进制选项。如果 `n` 不存在，ACPI 将禁用 OSI 方法。如果 `n` 存在，则不会禁用 OSI。


    ## 名称

    `acpi_serialize` — 强制 AML 方法序列化。


    强制 ACPI 机器语言（AML）方法的序列化。


    ## 名称

    `acpi_skip_timer_override` — 跳过中断覆盖问题。


    允许 ACPI 层识别并忽略损坏 nForce2 BIOS 的 IRQ0/pin2 中断覆盖问题，这些问题会导致 XT-PIC 定时器异常。


    ## 名称

    `acpi_dbg_layer` — ACPI 调试层。


    ## 提览

    `acpi_dbg_layer=``n`


    设置 ACPI 调试层。`n` 是一个整数，每一位表示一个不同的 ACPI 调试层。系统启动后，可以通过 `/proc/acpi/debug_layer`
    文件设置调试层。


    ## 名称

    `acpi_fake_ecdt` — ECDT 规避方案。


    如果存在，这允许 ACPI 在缺少嵌入控制器描述表（ECDT）时规避 BIOS 故障。


    ## 名称

    `acpi_generic_hotkey` — 使用通用 ACPI 热键驱动程序。


    这允许 ACPI 整合通用热键驱动程序在存在特定平台驱动程序时对其进行覆盖。


    ## 名称

    `acpi_pm_good` — 覆盖 pmtimer 错误检测。


    强制内核假设机器的 pmtimer 锁定了其值并始终返回良好的值。


    ## 名称

    `ec_intr` — ACPI 嵌入控制器中断模式。


    ## 提览

    `ec_intr=``n`


    指定 ACPI 嵌入控制器中断模式。如果 `n` 为 `0`，将使用轮询模式，否则使用中断模式。中断模式是默认模式。


    ## 名称

    `memmap` — 将特定内存标记为 ACPI 数据。


    ## 提览

    `memmap=``n`[`K]`


    将特定内存标记为 ACPI 数据。


    ## 名称

    `memmap` — 将特定内存标记为保留。


    ## 提览

    `memmap=``n`[`KMG]`


    将内存标记为保留。`n` 以千字节（K）、兆字节（M）或吉字节（G）为单位。


    ## 名称

    `pnpacpi` — 关闭 PnP ACPI。


    ## 提览

    `pnpacpi=off`


    禁用 PnP 功能。


    ## 名称

    `processor.max_cstate` — 限制处理器的 Cstate。


    ## 提览

    `processor.max_cstate=``n`


    无论 ACPI 表如何都进行限制。


    # SCSI 选项


    这些选项指定了 SCSI 子系统可以使用的参数。还有许多 SCSI 驱动特定的选项；请查看内核目录 `Documentation/scsi/` 获取详情。


    ## 名称

    `max_luns` — 扫描的 SCSI LUN 最大数量。


    ## 提览

    `max_luns=``n`


    指定系统扫描的最大 LUN 数量。`n` 是 1 到 4294967295 之间的整数。


    ## 名称

    `max_report_luns` — 接收的 SCSI LUN 最大数量。


    ## 提览

    `max_report_luns=``n`


    指定系统接收的最大 LUN 数量。`n` 是 1 到 16384 之间的整数。


    ## 名称

    `scsi_dev_flags` — 黑白列表。


    ## 提览

    `scsi_dev_flags=``vendor`:``model`:``flags`


    此选项允许用户为特定厂商和型号的设备向黑白列表添加条目。


    # PCI 选项


    这些选项指定了 PCI 子系统可以使用的参数。


    ## 名称

    ## 提览

    `pci=``option`[``,``option`*...]`


    每个 `option` 可以：


    `off`

    > 不探测 PCI 线。


    `bios`

    > 通过不直接访问硬件强制使用 PCI BIOS。这意味着内核应该信任 BIOS，这并不是标准做法（因为 BIOS 撒谎的情况比可靠的情况要多）。仅当你的机器具有非标准
    PCI 主桥且正常启动方法无法正常工作时，才使用此项。


    `nobios`

    > 不使用 PCI BIOS，而是直接访问硬件。这是所有 2.6.13 之后内核探测 PCI 设备的默认方法。


    `conf1`

    > 强制使用 PCI 配置机制 1（i386 机器上访问 内存的方法）。


    `conf2`

    > 强制使用 PCI 配置机制 2（i386 机器上访问 内存的方法）。


    `nommconf`

    > 禁止使用 ACPI MMCONFIG 表进行 PCI 配置。


    `nomsi`

    > 如果启用了内核配置参数 `PCI_MSI`，此内核启动选项用于全局禁用 MSI 中断的使用。


    `nosort`


    '
- fmt: '

    > Do not sort PCI devices according to order given by the PCI BIOS. This sorting
    is done to get a device order compatible with much older kernel versions.


    `biosirq`


    > Use PCI BIOS calls to get the interrupt routing table. These calls are known
    to be buggy on several machines and hang these machine when used, but on other
    machines they are the only way to get the interrupt routing table. Try this option
    if the kernel is unable to allocate IRQs or discover secondary PCI buses on your
    motherboard.


    `rom`


    > Assign address space to expansion ROMs. Use this with caution as certain devices
    share address decoders between ROMs and other resources.


    `irqmask=0x`nnnn`


    > Set a bit mask of IRQs allowed to be assigned automatically to PCI devices.
    You can make the kernel exclude IRQs of your ISA cards this way.


    `pirqaddr=0x`n`


    > Specify the physical address of the PIRQ table (normally generated by the BIOS)
    if it is outside the F00000-100000 (hexadecimal) range.


    `lastbus=`n`


    > Scan all buses through bus `n`. Can be useful if the kernel is unable to find
    your secondary buses and you want to tell it explicitly which ones they are.


    `assign-busses`


    > Always use your own PCI bus numbers, overriding whatever the firmware may have
    done.


    `usepirqmask`


    > Honor the possible IRQ mask stored in the BIOS $PIR$ table. This is needed on
    some systems with broken BIOSes, notably some HP Pavilion N5400 and Omnibook XE3
    notebooks. This will have no effect if ACPI IRQ routing is enabled.


    `noacpi`


    > Do not use ACPI for IRQ routing or for PCI scanning.


    `routeirq`


    > Do IRQ routing for all PCI devices. This is normally done in `pci_enable_device()`,
    so this option is a temporary workaround for broken drivers that don''t call it.


    `firmware`


    > Do not re-enumerate the bus, but instead just use the configuration from the
    bootloader. This is currently used on IXP2000 systems where the bus has to be
    configured a certain way for adjunct CPUs.


    # PnP BIOS options


    ## Name


    `noisapnp` — Disable the ISA PnP subsystem.


    Disable the ISA PnP subsystem, if it has been enabled in the kernel configuration.


    ## Name


    `pnpbios` — PnP BIOS settings.


    ## Synopsis


    `pnpbios=[on|`off`|`curr`|`no-curr]`


    Set the main PnP BIOS settings. `on` enables the PnP BIOS subsystem. `off` disables
    the PnP BIOS subsystem. `curr` tells the PnP BIOS subsystem to use the current
    static settings and `no-curr` tells the subsystem to probe for dynamic settings
    if possible.


    ## Name


    `pnp_reserve_irq` — PnP BIOS reserved IRQs.


    ## Synopsis


    `pnp_reserve_irq=`irq1`[`,`irq2`...]


    List of the IRQs that the PnP BIOS subsystem should not use for autoconfiguration.


    ## Name


    `pnp_reserve_dma` — PnP BIOS reserved DMAs.


    ## Synopsis


    `pnp_reserve_dma=`dma1`[`,`dma2`...]


    List of the DMAs that the PnP BIOS subsystem should not use for autoconfiguration.


    ## Name


    `pnp_reserve_io` — PnP BIOS reserved I/O ports.


    ## Synopsis


    `pnp_reserve_io=`io1``,`size1`[`,`io2``,`size2`...]


    I/O ports that the PnP BIOS subsystem should not use for autoconfiguration. Each
    port is listed by its starting location and size.


    ## Name


    `pnp_reserve_mem` — PnP BIOS reserved memory regions.


    ## Synopsis


    `pnp_reserve_mem=`mem1``,`size1`[`,`mem2``,`size2`...]


    Memory regions that the PnP BIOS subsystem should not use for autoconfiguration.
    Each region is listed by its starting location and size.


    # SELinux options


    These options change some fundamental aspects of SELinux startup.


    ## Name


    `checkreqprot` — Set the initial `checkreqprot` flag value.


    ## Synopsis


    `checkreqprot=[0|`1]`


    Set the initial `checkreqprot` flag value. `0` means that the check protection
    will be applied by the kernel and will include any implied execute protection.
    `1` means that the check protection is requested by the application. The default
    value is set by a kernel configuration option.


    The value can be changed at runtime via the `/selinux/checkreqprot` file.


    ## Name


    `enforcing` — Set the initial enforcing status.


    ## Synopsis


    `enforcing=[0|`1]`


    Specify whether SELinux enforces its rules upon boot. `0` means that SELinux will
    just log policy violations but wil not deny access to anything. `1` means that
    the enforcement will be fully enabled with denials as well as logging. The default
    value is `0`.


    The value can be changed at runtime via the `/selinux/enforce` file.


    ## Name


    `selinux` — Enable or disable SELinux at boot time.


    ## Synopsis


    `selinux=[0|`1]`


    This option allows SELinux to be enabled (`1`) or disabled (`0`) to boot time.
    The default value is set by a kernel configuration option.


    ## Name


    `selinux_compat_net` — Set the network control.


    ## Synopsis


    `selinux_compat_net=[0|`1]`


    Set the network control. `0` uses the new model, `1` uses the legacy model. The
    value can be changed at runtime via the `/selinux/enforce` file.


    # Network options


    These options control low-level aspects.


    ## Name


    `netdev` — Set network device parameters.


    ## Synopsis


    `netdev=[irq`][`io`][`mem_start`][`mem_end`][`name`]


    Specify the network parameters, which are specific to the device.


    ## Name


    `rhash_entries` — Set the number of route hash buckets.


    ## Synopsis


    `rhash_entries=`n`


    This option overrides the default number of hash buckets for the kernel.


    ## Name


    `shapers` — Set the maximum number of shapers.


    ## Synopsis


    `shapers=`n`


    Set the maximum number of shapers that the kernel can use.


    ## Name


    `thash_entries` — Set the number of TCP hash buckets.


    ## Synopsis


    `thash_entries=`n`


    This option overrides the default number of hash buckets for the kernel.


    # NFS options


    These options control Network File System startup.


    ## Name


    `lockd.nlm_grace_period` — Assign a grace period to the lock manager.


    ## Synopsis


    `lockd.nlm_grace_period=`n`


    Set the NFS lock manager grace period. `n` is measured in seconds.


    ## Name


    `lockd.nlm_tcpport` — Assign a TCP port to the lock manager.


    ## Synopsis


    `lockd.nlm_tcpport=`port`


    Set the TCP port that the lock manager should use. `port` must be a valid TCP
    port value.


    ## Name


    `lockd.nlm_timeout` — Assign a new timeout value to the lock manager.


    ## Synopsis


    `lockd.nlm_timeout=`n`


    Override the default time value for the lock manager. `n` is measured in seconds.
    If this option is not specified the default of 10 seconds will be used.


    ## Name


    `lockd.nlm_udpport` — Assign a UDP port to the lock manager.


    ## Synopsis


    `lockd.nlm_udpport=`port`


    Set the UDP port that the lock manager should use. `port` must be a valid UDP
    port value.


    ## Name


    `nfsroot` — Specifies the NFS root filesystem.


    ## Synopsis


    `nfsroot=[server-ip` `:`]`root-dir`[,`nfs-options]`


    Set the NFS root filesystem for diskless boxes, to enable them to boot properly
    over NFS. If this parameter is not set, the value `/tftpboot/``client_ip_address`
    will be used as the root filesystem with the default NFS options.

