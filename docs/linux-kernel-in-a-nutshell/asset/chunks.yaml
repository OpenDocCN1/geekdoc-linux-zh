    On almost all modern Intel-based systems, ACPI is required in order for the machine
    to work properly. ACPI is a standard that allows the BIOS of the computer to work
    with the operating system in order to access the hardware in an indirect manner,
    in the hope of handling a wide range of devices with relatively little code specific
    to each operating system. ACPI also provides a facility to help suspend and resume
    a machine and control the speed of the processor and fans. If you have a laptop,
    it is recommended that you enable this option.


    ### To enable ACPI


    ```

    Power management options (ACPI, APM)

        ACPI (Advanced Configuration and Power Interface) Support

             [*] ACPI Support

    ```


    There are a wide range of different ACPI "drivers" that control different types
    of ACPI devices. You should enable the specific ones that you have on your machine:


    ```

    Power management options (ACPI, APM)

        ACPI (Advanced Configuration and Power Interface) Support

             [*] ACPI Support

                   [*]   AC Adapter

                   [*]   Battery

                   [*]   Button

                   [*]   Video

                   [*]   Generic Hotkey (EXPERIMENTAL)

                   [*]   Fan

                   [*]   Processor

                   [*]     Thermal Zone

                     [ ]   ASUS/Medion Laptop Extras

                      [ ]   IBM ThinkPad Laptop Extras

                      [ ]   Toshiba Laptop Extras

    ```


    # Networking


    Networking is required for almost all machines today, and Linux supports almost
    every networking option available. Here we are going to show only a few of the
    wide variety that are present.


    For all networking options, including different drivers, the main network configuration
    option must be enabled:


    ```

    Networking

        [*] Networking support

    ```


    The TCP/IP option should also be selected so that the machine can talk to other
    machines on the Internet:


    ```

    Networking

        [*] Networking support

                      Networking options

                          [*] TCP/IP networking

    ```


    ## Netfilter


    The Netfilter portion of the Linux kernel is a framework for filtering and manipulating
    all network packets that pass through the machine. It is commonly used if you
    wish to enable a firewall on the machine to protect it from different systems
    on the Internet, or to use the machine as a proxy for other machines on the network.
    For more details on what Netfilter is good for, please see [NETFILTER](#index_split_597.html_filepos627937).


    ### To enable the main Netfilter option


    ```

    Networking

        [*] Networking support

                      Networking options

                          [*] Network packet filtering (replaces ipchains)

    ```


    It is recommended that you enable the Netfilter netlink interface and Xtables
    support when using netlink:


    ```

    Networking

        [*] Networking support

                           �

    � options

    �                              packet packet filtering (replaces ipre)

    ) chains�                                     Core Netfilter Configuration

    �                                           �  [*] Netfilter netlink interface

                                                     [*] Netfilter Xtables support
    (required for ip_tables)

    ```

    ```


    The different protocols that you wish to filter should also be selected:


    ```

    Networking

        [*] Networking support

                          Networking options

                                 [*] Network packet filtering (replaces ipchains)

                          IP: Netfilter Configuration

                               [M] Connection tracking (required for masq/NAT)

                               [ ]   Connection tracking flow accounting

                               [ ]   Connection mark tracking support

                               [ ]   Connection tracking events (EXPERIMENTAL)

                               [ ]   SCTP protocol connection tracking support (EXPERIMENTAL)

                               [M]   FTP support

                               [ ]   IRC support

                               [ ]   NetBIOS service protocol (EXPERIMENTAL)

                               [M]   TFTP support

                               [ ]   Amanda backup support

                               [ ]   PPTP support

                               [ ]   H.323 support (EXPERIMENTAL)

    ```


    ## Network Drivers


    Linux supports a wide array of different network devices. The most common one
    is a PCI network device, into which an Ethernet cable can be plugged. To determine
    whether you have a PCI network device on the system, and what type it is, run
    the following command:


    ```

    /usr/sbin/lspci | grep Ethernet

    03:0c.0 Ethernet: D-Link System RTL8139 (rev 10)

    03:0e.0 Ethernet: Intel Corporation 82545 Gigabit Controller (rev 04)

    ```


    Note that your response will probably not be identical; what is important is that
    the command shows some PCI devices. Enable PCI support for the kernel:


    ```

    Bus options (PCI, PCMCIA, EISA, ISA)

    PCI Support

    ```


    Enable basic device support:


    ```

    Device Drivers

    Network support

    [*] Network support

    ```


    Then comes the task of finding the specific device for your hardware. The most
    common place to find Ethernet devices for modern hardware is the gigabit section
    of the driver:


    ```

    Device Drivers

    Network support

    [*] Network support

    Ethernet (1000 Mbit)

    ```


    Some older devices will be found in the 10- and 100-Mbit section:


    ```

    Device Drivers

    Network support

    [*] Network support

    Ethernet (10 or 100Mbit)

    ```


    Look through those sections to find the proper driver for your devices.


    ## IrDA


    IrDA is an infrared protocol used by a number of laptops and PDAs to communicate
    over very short distances. It is prevalent on older hardware, with newer hardware
    using Bluetooth to communicate. See [Bluetooth](#index_split_086.html_filepos327361)
    for configuring Bluetooth.


    IrDA is a network protocol, so it can be found under the networking main menu:


    ```

    Networking

    [*] Networking support

    [*] IrDA (infrared) subsystem support

    ```


    A number of different IrDA protocols can be selected, depending on the type of
    device you wish to communicate with and the program used to do the communication:


    ```

    Networking

    [*] Networking support

    --- IrDA (infrared) subsystem support

    --- IrDA protocols

    [*] IrLAN protocol (NEW)

    [*] IrCOMM protocol (NEW)

    [*] Ultra (connectionless) protocol (NEW)

    ```


    There are a wide range of different types of IrDA devices, some serial, some PCI,
    and others based on USB. To select the specific type of IrDA device you have,
    choose it under the driver submenu for IrDA:


    ```

    Networking

    [*] Networking support

    --- IrDA (infrared) subsystem support

    Infrared-port device drivers

    --- SIR device drivers

    [ ] IrTTY (uses Linux serial driver)

    --- Dongle support

    --- Old SIR device drivers

    --- Old Serial dongle support

    --- FIR device drivers

    [ ] IrDA USB dongles

    [ ] SigmaTel STIr4200 bridge (EXPERIMENTAL)

    [ ] NSC PC87108/PC87338

    [ ] Winbond W83977AF (IR)

    [ ] Toshiba Type-O IR Port

    [ ] SMSC IrCC (EXPERIMENTAL)

    [ ] ALi M5123 FIR (EXPERIMENTAL)

    [ ] VLSI 82C147 SIR/MIR/FIR (EXPERIMENTAL)

    [ ] VIA VT8231/VT1211 SIR/MIR/FIR

    ```


    ## Bluetooth


    Bluetooth is a wireless technology that was created to replace IrDA to talk between
    devices over a very short distance. It is a short-range wireless technology that
    was designed as a replacement for cables and operates within a 10 meter radius
    and is commonly used in mobile phones.

