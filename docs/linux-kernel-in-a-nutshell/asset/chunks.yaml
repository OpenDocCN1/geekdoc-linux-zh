  trans: "\n\n要使用 USB 存储设备（通常称为 USB“闪存”设备或外部 USB 磁盘驱动器），必须首先确保 USB 支持正常工作。请参考 USB\
    \ 中的配方了解如何操作。\n\n可以使用 `lsusb` 程序识别 USB 存储设备。如果执行以下命令序列产生了如所示的结果，则系统上存在 USB 存储设备：\n\
    \n```\n$ /usr/sbin/lsusb -v | grep Storage\n      bInterfaceClass         8 Mass\
    \ Storage\n```\n\n按照以下方式启用它：\n\n1.  USB 存储设备实际上是通过 USB 连接通信的 USB SCSI 设备。因此，必须启用\
    \ SCSI 子系统：`Device Drivers`\n   ```\n      SCSI Device Support\n          [*]\
    \ SCSI Device Support\n   ```\n\n2.  同样在 SCSI 系统中，必须启用“SCSI disk support”以便设备能够正确挂载：`Device\
    \ Drivers`\n   ```\n    SCSI Device Support\n        [*] SCSI disk support\n \
    \  ```\n\n3.  启用 USB 存储支持：`Device Drivers`\n   ```\n    USB Support\n    [M] USB\
    \ Mass Storage support\n   ```\n\n一些特定的 USB 存储设备被列为单独的配置项，因为它们没有遵循标准的 USB 规范并需要特殊代码。如果你有这些设备之一，请启用对它们的支持。\n\
    \n## IDE 磁盘\n\nIDE 磁盘是 PC 最常见的磁盘类型。使其正常工作的设备是 IDE 磁盘控制器。要确定系统上是否有 IDE 磁盘控制器，请按以下方式使用\
    \ `lspci` 命令：\n\n```\n$ /usr/sbin/lspci | grep IDE\n00:1f.1 IDE interface: Intel\
    \ Corporation 82801EB/ER (ICH5/ICH5R) IDE Controller (rev 02)\n00:1f.2 IDE interface:\
    \ Intel Corporation 82801EB (ICH5) SATA Controller (rev 02)\n```\n\n注意，你的响应可能与上述不相同；重要的是命令显示了某些\
    \ IDE Controller（上一个示例中的第一个设备）。如果你只发现了 SATA 控制器，请查看 Serial ATA (SATA)。\n\n为内核启用\
    \ PCI 支持：\n\n```\nBus options (PCI, PCMCIA, EISA, MCA, ISA)\n    [*] PCI Support\n\
    ```\n\n启用 IDE 子系统和 IDE 支持：\n\n```\nDevice Drivers\n    [*] ATA/ATAPI/MFM/RLL support\n\
    \    [*]   Enhanced IDE/MFM/RLL disk/cdrom/tape/floppy support\n```\n\n在 ATA 系统中，必须启用你拥有的特定\
    \ IDE 控制器类型才能正常工作。为了在选错类型时提供良好的备份，请选择“generic”型 IDE 控制器：\n\n```\nDevice Drivers\n\
    \    ATA/ATAPI/MFM/RLL support\n        [*] generic/default chipset support\n\
    ```\n\n启用不同的 PCI 控制器：\n\n```\nDevice Drivers\n    ATA/ATAPI/MFM/RLL support\n\
    \        [*] IDE chipset support\n```\n\n这会打开一个包含不同 IDE 控制器的长子菜单。请根据 `lspci` 找到设备名称选择相应的项。\n\
    \n## 传输 ATA (SATA)\n\nSATA 是一种磁盘控制器，是 IDE 磁盘控制器的继者。要确定系统上是否有 SATA 磁盘控制器，请运行以下命令：\n\
    \n```\n$ /usr/sbin/lspci | grep SATA\n00:1f.2 IDE interface: Intel Corporation\
    \ 82801EB (ICH5) SATA Controller (rev 02)\n```\n\n注意，你的响应可能与上述不相同；重要的是命令显示了某些\
    \ SATA。SATA 磁盘使用名为 `libata` 的内核库，该库处理大部分 SATA 特有的功能。该库使用 SCSI 层与块层通信，因此需要启用许多内核选项才能使\
    \ SATA 磁盘正常工作。为内核启用 PCI 支持：\n\n```\nBus options (PCI, PCMCIA, EISA, MCA, ISA)\n\
    \    [*] PCI Support\n```\n\n启用 SCSI 子系统：\n\n```\nDevice Drivers\n    SCSI Device\
    \ Support\n    [*] SCSI Device Support\n```\n\n同样在 SCSI 系统中，必须启用“SCSI disk support”以便设备能够正确挂载：\n\
    \n```\nDevice Drivers\n    SCSI Device Support\n    [*] SCSI disk support\n```\n\
    \nSATA 选项位于“SCSI low-level drivers”部分：\n\n```\nDevice Drivers\n    SCSI Device\
    \ Support\n    SCSI low-level drivers\n    [*] Serial ATA (SATA) support\n```\n\
    \n在该部分中，启用你拥有的特定 SATA 控制器类型。查看前述 `lspci` 命令的输出，以获取系统中存在的 SATA 控制器类型列表。例如，大多数 Intel\
    \ 主板需要 PIIX/ICH SATA 驱动程序（如上一个示例）。\n\n```\nDevice Drivers\n    SCSI Device Support\n\
    \    SCSI low-level drivers\n        [*] Serial ATA (SATA) support\n        [*]\
    \ Intel PIIX/ICH SATA support\n```\n\n## 刻录 CD-ROM\n\n在 Linux 上刻录 CD-ROM 非常简单。如果你的内核能够支持从\
    \ CD-ROM 读取，它也可以支持刻录 CD-ROM。在 Linux 中有两种启用 CD-ROM 支持的方法：适用于 IDE 驱动器，另一种适用于 SCSI\
    \ 和 SATA 驱动器。\n\n### IDE CD-ROM 驱动器\n\nIDE CD-ROM 驱动器由与主 IDE 磁盘相同的 IDE 控制器控制。确保已如\
    \ IDE Disks 所示正确支持 IDE 控制器。如果支持正常，只需选择其他配置项：\n\n```\nDevice Drivers\n    [*] ATA/ATAPI/MFM/RLL\
    \ support\n    [*]   Enhanced IDE/MFM/RLL disk/cdrom/tape/floppy support\n   \
    \ [M]   Include IDE/ATAPI CDROM support\n```\n\n### SCSI 和 SATA CD-ROM 驱动器\n\n\
    SATA 和 SCSI CD-ROM 驱动器由与主磁盘相同的控制器控制。确保已正确支持 SATA 或 SCSI 控制器。对于 SATA 磁盘，请参 Serial\
    \ ATA (SATA)。\n\n要支持 SATA 或 SCSI CD-ROM 驱动器，必须启用 SCSI CDROM 驱动程序：\n\n```\nDevice\
    \ Drivers\n    SCSI Device Support\n        [*] SCSI CDROM support\n```\n\n一旦启用，SATA\
    \ 或 SCSI CD-ROM 驱动器即可正常工作。\n\n***\n\n几乎所有的发行版将 `lspci` 程序放在 `/usr/sbin/` 目录下，但某些将其放在其他位置。要找到它的位置，请执行：\n\
    \n```\n$ which lspci\n/usr/sbin/lspci\n```\n\n如果你使用的发行版将其放在其他地方，每当我们讨论使用 `lspci`\
    \ 时请使用该路径。\n\n# 设备\n\nLinux 支持各种不同类型的设备（比以往任何操作系统支持的都多）。本节显示了如何启用一些更常见的类型。\n\n\
    ## USB\n\nLinux 支持许多不同类型的 USB 设备。要启用 USB 支持，你必须首先启用 USB 控制器，它驱动机器上的 USB 连接。\n\n\
    要确定机器是否有 USB 控制器以及它是哪种类型，运行以下命令：\n\n```\n$ /usr/sbin/lspci | grep USB\n00:1d.0\
    \ USB Controller: Intel Corporation 82801EB/ER (ICH5/ICH5R) UHCI Controller #1\
    \ (rev 02)\n00:1d.1 USB Controller: Intel Corporation 82801EB/ER (ICH5/ICH5R)\
    \ UHCI Controller #2 (rev 02)\n00:1d.2 USB Controller: Intel Corporation 82801EB/ER\
    \ (ICH5/ICH5R) UHCI Controller #3 (rev 02)\n00:1d.3 USB Controller: Intel Corporation\
    \ 82801EB/ER (ICH5/ICH5R) UHCI Controller #4 (rev 02)\n00:1d.7 USB Controller:\
    \ Intel Corporation 82801EB/ER (ICH5/ICH5R) USB2 EHCI Controller (rev 02)\n```\n\
    \n注意，你的响应可能与上述不相同；重要的是命令显示了某些 USB 控制器。\n\n为内核启用 PCI 支持：\n\n```\nBus options (PCI,\
    \ PCMCIA, EISA, MCA, ISA)\n    [*] PCI Support\n```\n\n为内核启用 USB 支持：\n\n```\n\
    Device Drivers\n    USB Support\n    [M] Support for Host-side USB\n```\n\n为你的机器启用特定的\
    \ USB 主控制器（如果你不知道拥有的是哪种，全部启用它们是安全的）：\n\n```\nDevice Drivers\n    USB Support\n\
    \    ---  USB Host Controller Drivers\n    [M]  EHCI HCD (USB 2.0) support\n```\n\
    \n"
