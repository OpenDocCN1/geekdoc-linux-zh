    # ACPI options


    These options control parameters that the Advanced Configuration and Power Interface
    (ACPI) subsystem can use.


    ## Name

    `acpi` — ACPI subsystem options.


    ## Synopsis

    `acpi=`[`force`|`off`|`noirq`|`ht`|`strict`]`


    This is the main option for the Advanced Configuration and Power Interface (ACPI).
    Values are:


    `force`

    > Force ACPI to be enabled. Can be used to override the kernel configuration option
    that disabled it.


    `off`

    > Disable ACPI. Can be used to override the kernel configuration option that enabled
    it.


    `noirq`

    > Prevent ACPI from being used for IRQ routing.


    `ht`

    > run only enough of the ACPI layer to enable HyperThreading on processors that
    are capable of it.


    `strict`

    > Make the ACPI layer be less tolerant of platforms that are not fully compliant
    with the ACPI specification.


    ## Name

    `acpi_sleep` — ACPI sleep options.


    ## Synopsis

    `acpi_sleep=`[`s3_bios`],[`s3_mode`]`


    During S3 resume (which happens after the machine has been suspended to RAM),
    hardware needs to be reinitialized properly. For most devices this is simple,
    except for video cards, which are normally initialized by the BIOS. The kernel
    does not have enough information to restore the video device, because that information
    is in the BIOS and not accessable at all. This option lets the kernel try to use
    the ACPI subsystem to restore the video card in two different ways.


    See the file `Documentation/power/video.txt` for more information on this option
    and how to find the proper value for your type of hardware.


    ## Name

    `acpi_sci` — ACPI System Control Interrupt trigger mode.


    ## Synopsis

    `acpi_sci=`[`level`|`edge`|`high`|`low]`


    Set the ACPI System Control Interrupt trigger mode.


    ## Name

    `acpi_irq_balance` — Enable ACPI IRQ balance.


    Cause ACPI to balance the active IRQs. This is the default option when operating
    in APIC mode.


    ## Name

    `acpi_irq_nobalance` — Disable ACPI IRQ balance.


    Cause ACPI not to move the active IRQs. This is the default option when operating
    in PIC mode.


    ## Name

    `acpi_irq_isa` — Mark the listed IRQs as used by ISA.


    ## Synopsis

    `acpi_irq_isa=``irq`[``,`irq`...]


    If the IRQ balance option is enabled, mark the listed IRQs as used by the ISA
    subsystem.


    ## Name

    `acpi_irq_pci` — Mark the listed IRQs as used by PCI.


    ## Synopsis

    `acpi_irq_pci=``irq`[``,`[`irq`...]


    If the IRQ balance option is enabled, mark the listed IRQs as used by the PCI
    subsystem.


    ## Name

    `acpi_os_name` — Fake the operating system name to ACPI.


    ## Synopsis

    `acpi_os_name=``name`


    Tell the ACPI BIOS that the name of the running operating system is `name`. This
    can be useful to spoof the BIOS into thinking that Windows is running instead
    of Linux, which can help solve some ACPI issues for older BIOSes. As an example,
    use the string `Microsoft 2001` to spoof the BIOS into thinking that Windows 2001
    is running on the machine.


    ## Name

    `acpi_osi` — Disable the OSI ACPI method.


    ## Synopsis

    `acpi_osi=`[`n`]`


    This is actually a binary option despite the integer value. If `n` is absent,
    ACPI will disable the OSI method. If `n` is present, OSI will not be disabled.


    ## Name

    `acpi_serialize` — Force serialization of AML methods.


    Force the serialization of ACPI Machine Language methods.


    ## Name

    `acpi_skip_timer_override` — Skip interrupt override issues.


    Allow the ACPI layer to recognize and ignore IRQ0/pin2 Interrupt Override issues
    for broken nForce2 BIOSes that result in the XT-PIC timer acting up.


    ## Name

    `acpi_dbg_layer` — ACPI debug layer.


    ## Synopsis

    `acpi_dbg_layer=``n`


    Set the ACPI debug layers. `n` is an integer in which each bit indicates a different
    ACPI debug layer. After the system has booted, the debug layers can be set via
    the `/proc/acpi/debug_layer` file.


    ## Name

    `acpi_fake_ecdt` — ECDT workaround.


    If present, this allows ACPI to workaround BIOS failures when it lacks an Embedded
    Controller Description Table.


    ## Name

    `acpi_generic_hotkey` — Use generic ACPI hotkey driver.


    This allows the ACPI consolidated generic hotkey driver to override the platform-specific
    driver if one is present.


    ## Name

    `acpi_pm_good` — Override pmtimer bug detection.


    Force the kernel to assume that the machine''s pmtimer latches its value and always
    returns good values.


    ## Name

    `ec_intr` — ACPI Embedded Controller interrupt mode.


    ## Synopsis

    `ec_intr=``n`


    Specify the ACPI embedded controller interrupt mode. If `n` is `0`, polling mode
    will be used, otherwise interrupt mode will be used. Interrupt mode is the default.


    ## Name

    `memmap` — Mark specific memory as ACPI data.


    ## Synopsis

    `memmap=``n`[`KMG`]`


    Mark specific memory as ACPI data.


    ## Name

    `memmap` — Mark specific memory as reserved.


    ## Synopsis

    `memmap=``n`[`KMG`]`


    Mark specific memory as reserved. `n`* is measured in units of kilobytes (`K`),
    megabytes (`M`), or gigabytes (`G`).


    ## Name

    `pnpacpi` — Turn PnP ACPI off.


    ## Synopsis

    `pnpacpi=off`


    Disable PnP functionality.


    ## Name

    `processor.max_cstate` — Limit the processor to a maximum Cstate.


    ## Synopsis

    `processor.max_cstate=``n`


    Limit the processor to a maximum Cstate, no matter what the ACPI tables say. Value
    of `9`.


    # SCSI options


    These options specify different parameters the SCSI subsystem can use. A number
    of SCSI driver-specific options are also available; please see the different documentation
    files in the kernel directory `Documentation/scsi/` for details.


    ## Name

    `max_luns` — Maximum number of SCSI LUNs to probe.


    ## Synopsis

    `max_luns=``n`


    Specify the maximum number of LUNs that the system should probe. `n` is an integer
    from 1 to 4294967295.


    ## Name

    `max_report_luns` — Maximum number of SCSI LUNs received.


    ## Synopsis

    `max_report_luns=``n`


    Specify the maximum number of LUNs the system can receive. `n` is an integer from
    1 to 16384.


    ## Name

    `scsi_dev_flags` — SCSI black/white list.


    ## Synopsis

    `scsi_dev_flags=``vendor`:``model`:``flags`


    This option lets the user add entries to the SCSI black/white list for a specific
    vendor and model of device.


    # PCI options


    These options specify different parameters the PCI subsystem can use.


    ## Name

    ## Synopsis

    `pci=``option`[``,``option`*...]`


    Each `option` can be one of the following:


    `off`

    > Do not probe for the PCI bus.


    `bios`

    > Force the use of the PCI BIOS by not accessing the hardware directly. This means
    that the kernel should trust the BIOS, which is not the standard thing to do (as
    BIOSes are known to lie more than they are known to be valid.) Use this only if
    your machine has a non-standard PCI host bridge and the normal boot method is
    not working properly.


    `nobios`

    > Do not use the PCI BIOS, but access the hardware directly instead. This is the
    default method of probing for PCI devices in all kernels after 2.6.13.


    `conf1`

    > Force use of PCI Configuration Mechanism 1 (a way to access PCI memory on i386
    machines.)


    `conf2`

    > Force use of PCI Configuration Mechanism 2 (a way to access PCI memory on i386
    machines.)


    `nommconf`

    > Disable use of the ACPI MMCONFIG table for PCI configuration.


    `nomsi`

    > If the `PCI_MSI` kernel config parameter is enabled, this kernel boot option
    can be used to disable the use of MSI interrupts system-wide.


