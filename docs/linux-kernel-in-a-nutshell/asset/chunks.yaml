- fmt: '

    `binrpm-pkg`: Builds a RPM package that contains a compiled kernel and modules.


    `deb-pkg`: Builds a Debian package that contains the compiled kernel and modules.


    `tar-pkg`: Builds a tarball that contains the compiled kernel and modules.


    `targz-pkg`: Builds a `gzip`-compressed tarball that contains the compiled kernel
    and modules.


    `tarbz2-pkg`: Builds a `bzip2`-compressed tarball that contains the compiled kernel
    and modules.


    # Documentation Targets


    These targets build the internal kernel documentation in a variety of different
    formats.


    Table 10-7. Documentation targets


    | Target | Description |

    | :--- | :--- |

    | `xmldocs` | Builds the kernel documentation as XML DocBook files. |

    | `psdocs` | Builds the kernel documentation as PostScript files. |

    | `pdfdocs` | Builds the kernel documentation as PDF files. |

    | `htmldocs` | Builds the kernel documentation as HTML files. |

    | `mandocs` | Builds the kernel documentation as a set of man pages, which can
    then be installed with the `installmandocs` target. |


    # Architecture-Specific Targets


    Each kernel architecture has a set of specific targets unique to it. The 32-bit
    Intel architecture has the following targets available.


    Table 10-8. 32-bit Intel Architecture-Specific Targets


    | Target | Description |

    | :--- | :--- |

    | `bzImage` | Creates a compressed kernel image and places it in the `arch/i386/boot/bzImage`
    file. This is the default target for the i386 kernel build. |

    | `install` | Installs the kernel image using the distribution-specific `/sbin/installkernel`
    program. Note that this does not install the kernel modules; that must be done
    with the `modules_install` target. |

    | `bzdisk` | Creates a boot floppy image and writes it to the `/dev/fd0` device.
    |

    | `fdimage` | Creates a boot floppy image and places it in the file `arch/i386/boot/fdimage`.
    The `mtools` package must be present on your system in order for this to work
    properly. |

    | `isoimage` | Creates a CD-ROM boot image and places it in the file `arch/i396/boot/image.iso`.
    The `syslinux` package must be present on your system in order for this to work
    properly. |


    # Analysis Targets


    These targets are good for trying to find problem code in the kernel. It''s a
    good idea to create a stack space list when creating new code to determine that
    your changes are not taking up too much kernel stack space. The `namespacecheck`
    target is useful for determining whether your changes can safely add its symbols
    to the kernel''s global namespace.


    Table 10-9. Analysis targets


    | Target | Description |

    | :--- | :--- |

    | `checkstack` | Generate a list of the functions that use the most of the kernel
    stack space. |

    | `namespacecheck` | Generate a list of all of the kernel symbols and their namespaces.
    This will be a large list. |


    # Chapter 11. Kernel Configuration Option Reference


    This chapter lists the most important configuration options offered when you run
    `make config` or one of its graphical interfaces. The majority of the chapter
    is based on the in-kernel documentation for the different kernel configuration
    options, which were written by the kernel developers and released under the GPL.


    ## Name


    EXPERIMENTAL — Prompt for development and/or incomplete code/drivers


    Some of the many things that Linux supports (such as network drivers, file systems,
    network protocols, etc.) can be in a state of development where the functionality,
    stability, or the level of testing is not yet high enough for general use. This
    is usually known as the "alpha-test" phase among developers. If a feature is currently
    in alpha-test, the developers usually discourage uninformed widespread use of
    this feature by the general public to avoid "Why doesn''t this work?" mail messages.
    However, active testing and use of these systems is welcomed. Just be aware that
    it may not meet the normal level of reliability or may fail to work in some special
    cases. Detailed bug reports from people familiar with the kernel internals are
    usually welcomed by the developers. (But before submitting bug reports, please
    read the documents `README`, `MAINTAINERS`, `REPORTING-BUGS`, `Documentation/BUG-HUNTING`,
    and `Documentation/oops-tracing.txt` in the kernel source).


    This option also makes obsoleted drivers available. These are drivers that have
    been replaced by something else, and/or are scheduled to be removed in a future
    kernel release.


    Unless you intend to help test and develop a feature or driver that falls into
    this category, or you have a situation that requires using these features, you
    should probably say no, which will cause the configurator to present fewer choices.
    If you say yes here, you will be offered the choice of using features or drivers
    that are currently considered to be in alpha-test. On it''s own, this option does
    not do anything except allow you to select options.


    ## Name


    LOCALVERSION — Local version -- append to kernel release


    This allows you to append an extra string to the end of your kernel version. This
    will show up when you enter `uname` command, for example. The string you set here
    will be appended after the contents of any files with `localversion` in your object
    and source tree, in that order. The string can be a maximum of 64 characters.


    ## Name


    AUDIT — Auditing support


    Enable an auditing infrastructure that can be used with another kernel subsystem,
    such as SELinux (which requires this for logging of avc messages).


    ## Name


    IKCONFIG — Kernel .config support


    This option enables the complete Linux kernel `.config` file contents to be saved
    in the kernel. It documents which kernel options are used in a running kernel
    or an on-disk kernel. This information can be extracted from the kernel image
    with the `scripts/extract-ikconfig` and used as input to rebuild the current kernel
    or build another kernel. It can also be extracted from a running kernel by reading
    the file `/proc/config.gz`.


    ## Name


    EMBEDDED — Configure standard kernel features (for small systems)


    This option allows certain base kernel options and settings to be disabled or
    tweaked. This is for specialized environments that can tolerate a "non-standard"
    kernel. This is recommend only for experts, as it is very easy to change the options
    to create a kernel that will not boot properly.


    ## Name


    MODULES — Enable loadable module support


    Kernel modules are small pieces of compiled code that can be inserted in the running
    kernel, rather than being permanently built into the kernel. If you select this
    option, many parts of the kernel can be built as modules (by answering `M` instead
    of `Y` where indicated): this is most useful for infrequently used options that
    are not required for booting. For more information, see Chapter 4 and the manpages
    for `modprobe`, `lsmod`, `modinfo`, `insmod`, and `rmmod`.


    If you say yes here, you will need to run `make modules_install` to put the modules
    under `/lib/modules` where the module tools can find them.


    ## Name


    IOSCHED_NOOP — No-op I/O scheduler


    The no-op I/O scheduler is a minimal scheduler that does basic merging and sorting.
    Its main uses include non-disk based block devices such as memory devices and
    specialised software or hardware environments that do their own scheduling and
    require only minimal assistance from the kernel.


    ## Name


    IOSCHED_AS — Anticipatory I/O scheduler

