    [http://www.kernel.org/pub/linux/utils/kernel/hotplug/udev.html](http://www.kernel.org/pub/linux/utils/kernel/hotplug/udev.html).


    As of the 2.6.18 kernel release, the 081 release of `udev` is the oldest that
    works properly with the kernel. It is recommended that you use the latest version
    of `udev`, because it will work better with newer kernels, due to changes in how
    `udev` and the kernel communicate.


    To determine which version of `udev` you have on your system, run the following
    command:


    `$` **`udevinfo -V`**


    ### Process tools


    The package `procps` includes the commonly used tools `ps` and `top`, as well
    as many other handy tools for managing and monitoring processes running on the
    system.


    If you wish to download and install this package yourself, you can find it at
    [http://procps.sourceforge.net](http://procps.sourceforge.net).


    As of the 2.6.18 kernel release, the 3.2.0 release of `procps` is the oldest that
    works properly with the kernel. To determine which version of `procps` you have
    on your system, run the following command:


    `$` **`ps --version`**


    ### PCMCIA tools


    In order to properly use PCMCIA devices with Linux, a userspace helper program
    must be used to set up the devices. For older kernel versions, this program was
    called `pcmcia-cs`, but that has been replaced with a much simpler system called
    `pcmciautils`. If you wish to use PCMCIA devices, you must have this package installed
    for them to work properly.


    If you wish to download and install this package yourself, you can find it at
    [ftp://ftp.kernel.org/pub/linux/utils/kernel/pcmcia](ftp://ftp.kernel.org/pub/linux/utils/kernel/pcmcia).


    As of the 2.6.18 kernel release, the 004 release of `pcmciautils` is the oldest
    that works properly with the kernel. But the latest version is recommended in
    order to take advantage of newer features in the PCMCIA subsystem, such as automatic
    driver loading when new devices are found.


    To determine which version of `pcmciautils` you have on your system, run the following
    command:


    `$` **`pccardctl -V`**


    * * *


    ^([[3](#index_split_021.html_filepos96496)]) Some distributions, notably Debian,
    call this package `quota` instead of `quota-tools`.


    ^([[4](#index_split_021.html_filepos98046)]) Some distributions, notably Debian,
    call this package `nfs-common` instead of `nfs-utils`.


    # Chapter 3. Retrieving the kernel source


    When you''re building your own kernel, you want the latest stable release. Many
    distributions provide their own packages of kernel sources, but these are rarely
    the most cutting-enge, recent versions. The distribution packages have the advantage
    of being built to be compatible with the compiler and other tools provided by
    the distribution ([Chapter 2](#index_split_013.html_filepos77498) explains the
    importance of their being compatible) but they may not end up providing the functionality
    or performance you want. If you can create your own environment with the latest
    kernel, compiler, and other tools, you will be able to build exactly what you
    want. This chapter focuses on determining which kernel sources to download, and
    how to obtain them.


    # What tree to use


    In the past, the Linux kernel was split into only two trees, the "development"
    branch and the "stable" branch. The development branch was denoted by an odd number
    for the second release number, while the stable branch used even numbers. So,
    as an example, the 2.5.25 release was a development kernel, while the 2.4.25 release
    is a stable release.


    But after the 2.6 series was created, the kernel developers decided to abandon
    this method of having two separate trees, and declared that all 2.6 kernel releases
    would be considered "stable", no matter how quickly development was happening.
    The few months between the major 2.6 releases would allow kernel developers the
    time to add new features and then stabilize them in time for the next release.
    Combined with this, a "-stable" kernel branch has been created that releases bugfixes
    and security updates for the past kernel release, before the next major 2.6 release
    happens.


    This is all best explained with some examples, illustrated in [Figure 3-1](#index_split_024.html_filepos109852).
    The kernel team released the 2.6.17 kernel as a stable release. Then the developers
    started working on new features and started releasing the `-rc` versions as development
    kernels so that people could help test and debug the changes. After everyone agreed
    that the development release was stable enough, it was released as the 2.6.18
    kernel. This whole cycle usually takes about two to three months, depending on
    a variety of factors.


    ![Kernel development release cycle](images/00002.png)


    Figure 3-1. Kernel development release cycle


    While the development of the new features was happening, the 2.6.17.1, 2.6.17.2,
    and other stable kernel versions were released, containing bug fixes and security
    updates.'
