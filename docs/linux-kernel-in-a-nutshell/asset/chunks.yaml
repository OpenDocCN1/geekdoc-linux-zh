    截至 2.6.18 内核发布版本，`xfsprogs` 的 2.6.0 版本是与内核正常工作的的最旧版本。要确定你系统上的 `xfsprogs` 版本，请运行以下命令：


    ```

    $ xfs_db -V

    ```


    ## 配额 (Quotas)


    要使用内核的配额功能，你必须安装 `quota-tools` 软件包。该包包含了一些程序，允许你为用户设置配额，提供不同用户配额使用量的统计信息，并在用户接近用尽可用文件系统配额时发出警告。


    如果你想自己下载并安装此包，可以在 [`sourceforge.net/projects/linuxquota`](http://sourceforge.net/projects/linuxquota)
    找到。


    截至 2.6.18 内核发布版本，`quota-tools` 的 3.09 版本是与内核正常工作的的最旧版本。要确定你系统上的 `quota-tools`
    版本，请运行以下命令：


    ```

    $ quota -V

    ```


    ## NFS


    要正确使用 NFS 文件系统，你必须安装 `nfs-utils` 软件包。该包包含了一些程序，允许你作为客户端挂载 NFS 分区，并运行 NFS 服务器。


    如果你想自己下载并安装此包，可以在 [`nfs.sf.net`](http://nfs.sf.net) 找到。


    截至 2.6.18 内核发布版本，`nfs-utils` 的 1.0.5 版本是与内核正常工作的的最旧版本。要确定你系统上的 `nfs-utils` 版本，请运行以下命令：


    ```

    $ showmount --version

    ```


    ## 其他工具


    还有几个与内核版本紧密相关的其他程序。这些程序通常不是内核正常工作所必需的，但它们能够访问不同类型的硬件和功能。


    ### udev


    `udev` 是一个让 Linux 能够在 `/dev` 目录中提供持久设备命名系统的程序。它还提供了一个动态的 `/dev`，类似于旧版（现已移除）`devfs`
    文件系统所提供的。几乎所有的 Linux 发行版都使用 `udev` 来管理 `/dev` 目录，因此它是正常启动机器所需的。


    遗憾的是，`udev` 依赖于 `/sys` 的结构，而众周知该结构会随着内核的发布而发生变化。过去这些某些变化已知会破坏 `udev`，导致你的机器无法正常启动。如果你使用的是内核推荐的最新版本
    `udev`，但在其正常工作方面遇到问题，请通过 linux-hotplug-devel@lists.sourceforge.net 上的邮件列表联系 `udev`
    开发者。


    强烈建议你使用 Linux 发行版附带的 `udev` 版本，因为它与特定发行版的启动过程紧密结合在一起。但如果你想自己升级 `udev`，可以在 [`www.kernel.org/pub/linux/utils/kernel/hotplug/udev.html`](http://www.kernel.org/pub/linux/utils/kernel/hotplug/udev.html)
    找到。


    截至 2.6.18 内核发布版本，`udev` 的 081 版本是与内核正常工作的的最旧版本。建议使用最新版本的 `udev`，因为由于 `udev` 和内核通信方式的变化，新版本与新内核的配合得会更好。


    要确定你系统上的 `udev` 版本，请运行以下命令：


    ```

    $ udevinfo -V

    ```


    ### 进程工具 (Process tools)


    `procps` 包包含了常用的工具 `ps` 和 `top`，以及许多用于管理和监控系统中运行进程的其他方便工具。


    如果你想自己下载并安装此包，可以在 [`procps.sourceforge.net`](http://procps.sourceforge.net) 找到。


    截至 2.6.18 内核发布版本，`procps` 的 3.2.0 版本是与内核正常工作的的最旧版本。要确定你系统上的 `procps` 版本，请运行以下命令：


    ```

    $ ps --version

    ```


    ### PCMCIA 工具


    为了在 Linux 中正确使用 PCMCIA 设备，必须使用用户态辅助程序来设置设备。对于旧版本的内核，该程序被称为 `pcmcia-cs`，但它已被一个更简单、名为
    `pcmciautils` 的系统所取代。如果你想使用 PCMCIA 设备，必须安装此包才能使其正常工作。


    如果你想自己下载并安装此包，可以在 ftp://ftp.kernel.org/pub/linux/utils/kernel/pcmcia 找到。


    截至 2.6.18 内核发布版本，`pcmciautils` 的 004 版本是与内核正常工作的的最旧版本。但建议使用最新版本，以便利用 PCMCIA 子系统中的新功能，例如发现新设备时自动加载驱动程序。


    要确定你系统上的 `pcmciautils` 版本，请运行以下命令：


    ```

    $ pccard -V

    ```

