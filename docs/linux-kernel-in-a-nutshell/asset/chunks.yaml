- fmt: "\nOnly if your machine is one of the other types in the preceding list should\
    \ you select anything other than the `PC-compatible` option. However, if you wish\
    \ to create a single kernel that will run on all of the types of machines shown,\
    \ select the `Generic architecture` option. Some of the above options might not\
    \ be present if you have not also selected the `Symmetric multi-processing support`\
    \ option.\n\nSelect the processor family type. The `PC-compatible` option needs\
    \ to be selected from the previous options for this submenu to be displayed:\n\
    \n```\nProcessor type and features\n     Processor family\n          ( ) 386\n\
    \          ( ) 486\n          ( ) 586/K5/5x86/6x86/6x86MX\n          ( ) Pentium-Classic\n\
    \          ( ) Pentium-MMX\n          ( ) Pentium-Pro\n          ( ) Pentium-II/Celeron(pre-Coppermine)\n\
    \          ( ) Pentium-III/Celeron(Coppermine)/Pentium-III Xeon\n          ( )\
    \ Pentium M\n          (X) Pentium-4/Celeron(P4-based)/Pentium-4 M/Xeon\n    \
    \      ( ) K6/K6-II/K6-III\n          ( ) Athlon/Duron/K7\n          ( ) Opteron/Athlon64/Hammer/K8\n\
    \          ( ) Crusoe\n          ( ) Efficeon\n          ( ) Winchip-C6\n    \
    \      ( ) Winchip-2\n          ( ) Winchip-2A/Winchip-3\n          ( ) GeodeGX1\n\
    \          ( ) Geode GX/LX\n          ( ) CyrixIII/VIA-C3\n          ( ) VIA C3-2\
    \ (Nehemiah)\n          ( ) Generic x86 support\n```\n\nFor more details on this\
    \ configuration item, please refer to [M386](#index_split_523.html_filepos581375)\
    \ for a full description of how to pick the proper processor type depending on\
    \ what processor you have, and what range of machines you wish the kernel to run\
    \ on.\n\n## SMP\nIf your system contains more than one CPU, or a Hyperthreaded\
    \ or Dual Core CPU, you should select the multiprocessor option for the Linux\
    \ kernel in order to take advantage of the additional processors. Unless you do,\
    \ you will be wasting the other processors by not using them at all.\n\nEnable\
    \ multiprocessing:\n\n```\nProcessor type and features\n     [*] Symmetric multi-processing\
    \ support\n```\n\n## Preemption\nSystems running as servers have very different\
    \ workload requirements from those being used as a desktop for video and audio\
    \ applications. The kernel allows different modes of \"preemption\" in order to\
    \ handle these different workloads. Preemption is the ability of the kernel to\
    \ interrupt itself while it is doing something else, in order to work on something\
    \ with a higher priority, such as updating a sound or video program.\n\nTo change\
    \ to a different preemption model, use this menu:\n\n```\nProcessor type and features\n\
    \     Preemption Model\n          (X) No Forced Preemption (Server)\n     ( )\
    \ Voluntary Kernel Preemption (Desktop)\n     ( ) Preemptible Kernel (Low-Latency\
    \ Desktop)\n```\n\nIf you wish to make the kernel even more responsive to higher\
    \ priority tasks than the general preemption option provides, you can also allow\
    \ interruptions to one of the main internal kernel locks:\n\n```\nProcessor type\
    \ and features\n     [*] Preempt The Big Kernel Lock\n```\n\nThis option is able\
    \ to be selected only if you have already selected either the `Preemptible Kernel`\
    \ or `Symmetric multi-processing support` options.\n\n## Suspend\nThe Linux kernel\
    \ has the ability to suspend itself to disk, allowing you to disconnect the power,\
    \ and then at a later time, power up and resume exactly where the machine was\
    \ when it was suspended. This functionality is very useful on laptops that run\
    \ Linux.\n\nEnable this by selecting:\n\n```\nPower management options (ACPI,\
    \ APM)\n     [*] Software Suspend\n```\n\nThe kernel needs to know where to save\
    \ the suspended kernel image, and later where to resume it. This location is usually\
    \ a kernel swap on the disk. To specify which partition this should be:\n\n```\n\
    Power management options (ACPI, APM)\n     (/dev/hda3) Default resume partition\n\
    ```\n\n### Note\nMake sure you specify the proper partition to suspend the machine\
    \ to, and do not use a partition is being used by the system for data. The proper\
    \ partition name can be found by running the following command:\n\n```bash\n/sbin/swapon\
    \ -s | grep dev | cut -f 1 ' ' /dev/hda3\n```\n\nUse the output of the preceding\
    \ command in this kernel option, and on the kernel boot line where it specifies\
    \ where the kernel should be resumed. After the machine has been suspended, to\
    \ have it resume properly, pass `resume=/dev/sda3` to the kernel line to have\
    \ it use the proper image. If you do not want to have the suspended image restored,\
    \ use the `noresume` command line.\n\n## CPU Frequency Scaling\nMost modern processors\
    \ can slow down the internal clock of the processor to conserve power and battery\
    \ life. Linux supports this ability and offers a variety of governors. Different\
    \ governors implement different heuristics in order to vary the processor speed\
    \ depending on the system load and other variables.\n\nEnable the basic frequency\
    \ scaling:\n\n```\nPower management options (ACPI, APM)\n     [*] Frequency scaling\n\
    ```\n\nSelect the different type of frequency governors you wish to use:\n\n```\n\
    Power management options (ACPI, APM)\n     [*] Frequency scaling\n     [*] 'performance'\
    \ governor\n     [*] 'powersave' governor\n     [*] 'userspace' governor for userspace\
    \ scaling\n     [*] 'ondemand' cpufreq governor\n     [*] 'conservative' cpufreq\
    \ governor\n```\n\nFor more information on what the different governors do, see\
    \ [CPU_FREQ](#index_split_563.html_filepos10418).\n\nSelect the default governor\
    \ you wish to have running when the machine boots:\n\n```\nPower management options\
    \ (ACPI, APM)\n     [*] Frequency scaling\n     Default CPUFreq governor (performance)\n\
    ```\n\nSelect the specific processor type on the machine. For details on how to\
    \ determine the processor type of the machine, see [Processor Types](#index_split_075.html_filepos29725).\n\
    \n```\nPower management options (ACPI, APM)\n     [*] Frequency scaling\n    \
    \ --- CPUFreq drivers\n     [ ] ACPI Processor-States driver\n     [ ] AMD Mobile\
    \ K6-2/K6-3 PowerNow!\n     [ ] AMD Mobile Athlon/Duron PowerNow!\n     [ ] AMD\
    \ Opteron/Athlon64 PowerNow!\n     [ ] Cyrix MediaGX/NatSemi Geode Suspend Modulation\n\
    \     [*] Enhanced SpeedStep\n     [*] Use ACPI tables to decode valid frequency/voltage\
    \ pairs\n     [*] Built-in tables for Banias CPUs\n     [ ] Intel Speedstep on\
    \ ICH-M chipsets (ioport interface)\n     [ ] Intel Speedstep on 440BX/ZX/MX chipsets\
    \ (SMI interface)\n     [ ] Intel Pentium 4 clock modulation\n     [ ] nvidia\
    \ nForce2 FSB changing\n     [ ] Transmeta LongRun\n```\n\n## Different Memory\
    \ Models\nLinux on 32-bit Intel hardware can access up to 64 Gigabytes of memory,\
    \ but the address space of the 32-bit processor is only 4 Gigabytes. To work around\
    \ this limitation, Linux can map the additional memory into another area and then\
    \ switch to it when other tasks need it. But if your machine has a smaller amount\
    \ of memory, it is easier for Linux not to have to worry about handling the bigger\
    \ areas, it is beneficial to tell the kernel how much memory you want it to support.\
    \ For a more detailed description of this option, please see [NOHIGHMEM](#index_split_539.html_filepos593999).\n\
    \nLinux supports three different memory models for 32-bit Intel processors, depending\
    \ on the memory available:\n\n* Under 1 Gigabyte of physical memory\n* Between\
    \ 1 and 4 Gigabytes of physical memory.\n* Greater than 4 Gigabytes of physical\
    \ memory.\n\nTo select the amount of memory:\n\n```\nProcessor type and features\n\
    \     High Memory Support\n          (X) off\n          ( ) 4GB\n          ( )\
    \ 64GB\n```\n"
