    Bus 004 Device 001: ID 0000:0000  \nBus 003 Device 001: ID 0000:0000  \nBus 001\
    \ Device 001: ID 0000:0000\n\nID 为 `0000:0000` 的设备可以忽略，因为它们是驱动总线本身的 USB 主控制器。过滤掉它们后，剩下四个设备：\n\
    \n```\n/usr/sbin/lsusb | grep -v 0000:0000\n```\nBus 002 Device 003: ID 045e:0023\
    \ Microsoft Corp. Trackball Optical\nBus 005 Device 003: ID 0409:0058 NEC Corp.\
    \ HighSpeed Hub\nBus 004 Device 003: ID 157e:300d  \nBus 004 Device 002: ID 045e:001c\
    \ Microsoft Corp.\n\n因为 USB 设备很容易拆卸，拔掉你想要查找驱动程序的设备并再次运行 `lsusb`：\n\n```\n/usr/sbin/lsusb\
    \ | grep -v 0000:0000\n```\nBus 002 Device 003: ID 045e:0023 Microsoft Corp. Trackball\
    \ Optical\nBus 005 Device 003: ID 0409:0058 NEC Corp. HighSpeed Hub\nBus 004 Device\
    \ 002: ID 045e:001c Microsoft Corp.\n\n现在第三个设备消失了，这意味着显示为：\n`Bus 004 Device 003:\
    \ ID 157e:300d`\n的设备是你想要查找驱动程序的设备。\n\n如果你更换设备并再次查看 `lsusb` 的输出，设备编号将会发生变化：\n\n\
    ```\n/usr/sbin/lsusb | grep 157e\n```\nBus 004 Device 004: ID 157e:300d\n\n这是因为\
    \ USB 设备编号不是唯一的，每次插入时都会变化。稳定的是厂商 ID 和产品 ID，`lsusb` 在此处将其显示为两个之间用 `:` 分隔的四位数值。对于此设备，厂商\
    \ ID 是 `157e`，产品 ID 是 `300d`。记下你找到的值，因为你将在后续步骤中使用它们。\n\n与 PCI 设备一样，我们将在内核源码中搜索\
    \ USB 厂商 ID 和产品 ID，以便找到控制该设备的正确驱动程序。遗憾的是，没有一个单一文件包含所有的 USB ID（像 PCI 那样）。因此有必要对整个内核树进行搜索：\n\
    \n```\ngrep -i -R -l 157e drivers/*\n```\ndrivers/atm/pca200e.data\ndrivers/atm/ba200e.data\n\
    drivers/atm/ba200e.data\ndrivers/net/wireless/zd_usb.c\ndrivers/scsi/logic_fw.h\n\
    drivers/scsi/logic_fw.h\ndrivers/scsi/qlogic_asm.c\n\n我们知道这是一个 USB 设备，而不是 PCI\
    \ 或 SCSI 设备，因此可以查看 `net/wireless/zd_usb.c`。在 `zd_usb.c` 的以下代码中显示了支持的驱动：\n\n```c\n\
    static struct usb_device_id usb_ids[] = {\n    /* ... */\n    { USB_DEVICE(0x045e,\
    \ 0x0023) },\n    { USB_DEVICE(0x0409, 0x0058) },\n    { USB_DEVICE(0x157e, 0x300d)\
    \ },\n    { USB_DEVICE(0x045e, 0x001c) },\n    /* ... */\n};\n```\n\n根文件系统（Root\
    \ Filesystem）\n\n根文件系统是内核启动运行系统所在的系统。它包含了启动发行版所需的初始程序，通常还包含整个系统的配置。简而言之，它是重要的，且内核在启动时必须找到它以确保正常工作。\n\
    \n如果你新配置的内核在启动时发生崩溃并出现如下错误：\n```\nVFS: Cannot open root device hda2 (03:02)\n\
    Please append a correct \"root=\" boot option\nKernel panic: VFS: Unable to mount\
    \ root fs on 03:02\n```\n说明根文件系统没有被找到。如果你在启动时没有使用内存磁盘（ramdisk），通常建议将用于根分区的文件系统以及驱动该磁盘的控制器直接编译到内核中，而不是作为模块。如果你在启动时使用内存磁盘，那么将这些部分编译为模块是安全的。\n\
    \n下面的章节将介绍如何让内核在启动时找到根文件系统。\n\n### 文件系统类型\n\n首先，需要确定根分区使用的文件系统类型。可以通过查看 `mount`\
    \ 命令的输出来实现：\n\n```\nmount | grep \" / \"\n```\n/dev/sda2 on / type ext3 (rw,noatime)\n\
    ```\n"
- fmt: "\nWe are interested in the type of the filesystem, which is shown after the\
    \ word `type`. In this example, it is `ext3`. This is the type of filesystem that\
    \ the root partition is using. Go into the kernel configuration system and make\
    \ sure that this filesystem type is enabled as described in [Filesystems](#index_split_088.html_filepos333828).\n\
    \n### Disk controller\n\nIn the output of the `mount` command shown earlier, the\
    \ first portion of the line shows which block device the root filesystem is mounted\
    \ on. In this example, it's `/dev/sda2`. Now that the filesystem is configured\
    \ properly in your kernel, you must also make sure that this block device will\
    \ also work correctly. To find out which drivers are needed for this, you need\
    \ to look at `sysfs` again.\n\nAll block devices show up in `sysfs` in either\
    \ `/sys/block/` or in `/sys/class/block/`, depending on the version of the kernel\
    \ you are using. In either location, the block devices are a tree, with the different\
    \ partitions being children of the main device:\n\n```bash\n$ tree -d /sys/block/\
    \ | egrep \"hd|sd\"\n|-- hdc\n|-- hdd\n|-- sda\n     |-- sda1\n     |-- sda2\n\
    \     |-- sda3\n```\n\nGiven the information in the `mount` command, you need\
    \ to ensure that the `sda2` device is configured properly. Because this is a partition\
    \ (disk partitions are numbered, while main block devices are not), the whole\
    \ `sda` device must be configured. (Without the main block device, there is no\
    \ way to access the individual partitions on that device.)\n\nThe `sda` block\
    \ device is represented just like the network device we looked at earlier in this\
    \ chapter. There is a symlink in the device's directory called `device` that points\
    \ to the logical device that controls this block device:\n\n```bash\n$ ls -l /sys/block/sda\n\
    ...\ndevice -> ../../../devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0:0\n\
    ...\n```\n\nNow you need to start walking up the chain of devices in `sysfs` to\
    \ find out which driver is controlling this device:\n\n```bash\n$ ls -l /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0:0\n\
    ...\ndriver -> ../../../../../../bus/scsi/drivers/sd\n...\n```\n\nHere we see\
    \ that the SCSI disk controller driver is responsible for making this device work.\
    \ So we know we need to configure SCSI disk support into our kernel configuration.\n\
    \nContinuing up the directory chain in `sysfs`, try to find where the driver is\
    \ that controls the hardware:\n\n```bash\n$ ls -l /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0:0\n\
    ...\n```\nThere is no link called `driver` in this directory, so go back one more\
    \ level:\n\n```bash\n$ ls -l /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0\n\
    ...\n```\nAgain, no driver. Continuing up one more level:\n\n```bash\n$ ls -l\
    \ /sys/devices/pci0000:00/0000:00:1f.2\n...\ndriver -> ../../../bus/pci/drivers/ata_piix\n\
    ```\nThis is the disk controller we need to ensure is in our kernel configuration.\
    \ we need to enable the `ext3`, `sd`, and `ata_piix` drivers in our kernel configuration\
    \ so that we will be able to boot our hardware.\n\n### Helper Script\n\nAs mentioned\
    \ near the beginning of this chapter, files and directories within `sysfs` change\
    \ from one release of the kernel to another. Here is a script that is handy in\
    \ determining the needed driver and module name for any device in the system.\
    \ It has been developed with the kernel developers for `sysfs` and should work\
    \ on all future versions of the 2.6 kernel. For instance, it makes work of the\
    \ previous example, when you had to get all the proper drivers for the `sda` block\
    \ device:\n\n```bash\n$ get-driver.sh sda\nlooking at sysfs device: /sys/devices/pci0000:00/0000:00:1f.2/host0/target0:0:0/0:0:0\n\
    found driver: sd\nfound driver: ata_piix\n```\n\nI can also find all the proper\
    \ drivers for complex things as USB-to-serial devices:\n\n```bash\n$ get-driver.sh\
    \ ttyUSB0\nlooking at sysfs device: /sys/devices/pci0000:00/0000:00:1d.3/usb/4-2/4-2.3/4-2.3:1.0/ttyUSB0\n\
    found driver: pl2303 from module: pl2303\nfound driver: pl2303 from module: pl2303\n\
    found driver: usb from module: usbcore\nfound driver: usb from module: usbcore\n\
    found driver: usb from module: usbcore\nfound driver: uhci_hcd from module: uhci_hcd\n\
    ```\n\n```sh\n#!/bin/sh\n#\n# Find all modules and drivers for a given device.\n\
