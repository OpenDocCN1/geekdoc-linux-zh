    更多详细信息请参阅 [`oss.sgi.com/projects/xfs`](http://oss.sgi.com/projects/xfs) 文档。该实现在磁盘上兼容
    IRIX 版本的 XFS。


    # OCFS2_FS — OCFS2 文件系统支持（实验性）


    OCFS2 是一种通用的、基于范围的共享磁盘集群文件系统，与 `ext3` 有许多相似之处。它支持 64 位 inode 号，并具有自动扩展的元数据组，这可能也使其对非集群用途也具有吸引力。


    你需要安装 `ocfs2-tools` 包以至少获取 `mount.ocfs2` 程序。


    项目主页位于 [`oss.oracle.com/projects/ocfs2`](http://oss.oracle.com/projects/ocfs2)，工具页面位于
    [`oss.oracle.com/projects/ocfs2-tools`](http://oss.oracle.com/projects/ocfs2-tools)。OCFS2
    邮件列表可以在 [`oss.oracle.com/projects/ocfs2/mailman`](http://oss.oracle.com/projects/ocfs2/mailman)
    找到。


    # INOTIFY — inotify 文件变化通知支持


    在此选择 yes 以启用 inotify 支持以及相关的系统调用。inotify 是一种文件变化通知系统，是 `dnotify` 的替代品。inotify
    修复了 `dnotify` 的许多缺陷，并引入了若干新功能。它允许通过单个打开的 `fd` 对象监控文件和目录。其他功能还包括多个文件事件、单次（one-shot）支持和卸载通知。


    更多信息，请参阅 `Documentation/filesystems/inotify.txt`。


    # QUOTA — 配额支持


    如果你在此选择 yes，你将能够为用户设置磁盘使用限制（也称为磁盘配额）。目前，它适用于 `ext2`、`ext3` 和 ReiserFS 文件系统。`ext3`
    还支持日志配额，对于你不需要在非正常关机后运行 `quotacheck`。更多详细信息，请阅读 Quota mini-HOWTO，该文档可在 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)
    获取，或查看配额工具提供的文档。配额支持可能对多用户系统有用。


    # AUTFS_FS — 内核自动挂载支持


    自动挂载器是一个根据需要自动挂载远程文件系统的工具。此实现部分基于内核，以减少系统已挂载时的开销；这与 BSD 自动挂载器 (`amd`) 不同，后者是一个纯的用户空间守护进程。


    要使用自动挂载器，你需要 `autofs` 包中的用户态工具；你可以在 `Documentation/Changes` 中找到位置。你还需要对 `NFS file
    system support` 选项回答 yes。


    如果你想使用具有更多功能的新版本自动挂载器，在此选 no 并在 `Kernel automounter v4 support` 选项上选 yes。


    如果你不是大型分布式网络的一部分，你可能不需要自动挂载器，可以在此处选 no。


    # FUSE_FS — 用户态文件系统支持


    通过 FUSE，可以在用户态程序中实现功能完备的文件系统。


    还有一个名为 `libfuse` 的辅助库。该库以及工具可以从 FUSE 主页获取：[`fuse.sourceforge.net`](http://fuse.sourceforge.net)。


    更多信息请参阅 `Documentation/filesystems/fuse.txt`。所需的库/工具版本请查看 `Documentation/Changes`。


    如果你想开发用户态文件系统，或者你想使用基于 FUSE 的文件系统，请在此选 yes。


    # SMB_FS — SMB 文件系统支持（挂载 Windows 共享等）


    SMB（服务器消息块）是 Windows for Workgroups (WfW)、Windows 95/98、Windows NT 及后续版本以及 OS/2
    Lan Manager 用于在本地网络上共享文件和打印机的协议。在此选 yes 允许你挂载它们的文件系统（在此文中通常被称为“共享”）并像访问任何其他 Unix
    目录一样访问它们。目前，仅当 Windows 使用 TCP/IP 作为底层传输协议而非 NetBEUI 时才才有效。详细信息，请阅读 `Documentation/filesystems/smbfs.txt`
    和 SMB-HOWTO，该文档可在 [`www.tldp.org/docs.html#howto`](http://www.tldp.org/docs.html#howto)
    获取。


    如果你只是想让你的机器作为 SMB 服务器，并为 Windows 客户端（需要具有 TCP/IP 栈）提供文件和打印服务，你不需要在此选 yes；你可以使用
    Samba 系列守护进程和程序（可在 ftp://ftp.samba.org/pub/samba 获取）。


    # CIFS — CIFS 支持（用于 Samba、Windows 和其他 CIFS 兼容服务器的高级网络文件系统）


    这是通用互联网文件系统（CIFS）协议的客户端 VFS 模块，它是服务器消息块（SMB）协议的继承者，大多数早期 PC 操作系统的原生文件共享机制。CIFS
    协议被 Windows 2000（包括 Windows 2003、NT 4 和 Windows XP）以及 Samba（为 Linux 和许多其他操作系统提供了极好的
    CIFS 服务器支持）完全支持。还对 Windows ME 和类似的服务器提供了有限支持。你必须使用此模块来访问 OS/2 和 DOS。cifs 模块的意图是提供用于
    Samba 服务器的包括 DFS 分层次命名空间、安全用户会话建立、可选的封包签名、Unicode 以及其他国际化改进和可选的 Winbind (nsswitch)
    集成。如果你只运行服务器（Samba），则不需要启用 cifs。如果你需要从此机器挂载 Windows 2003 和 Samba，请在此选 yes。


    # PROFILING — 性能分析支持（实验性）


    在此选 yes 以启用性能分析器等使用的扩展性能分析支持。


    # OPROFILE — OProfile 系统性能分析（实验性）


    OProfile 是一个能够对整个系统进行性能分析的系统，包括内核、模块、库和应用程序。


    更多信息以及正确使用 OProfile 需要的用户态，请查看主页 [`oprofile.sourceforge.net/news`](http://oprofile.sourceforge.net/news)。


    # KPROBES — Kprobes


    Kprobes 允许你在任何内核地址处拦截 CPU 并执行回调函数。`register_kprobe()` 建立探测点并指定回调。Kprobes 对于内核调试、非侵入性测量和测试有用。


    # PRINTK_TIME — 在 printk 中显示时间信息


    选择此选项会将时间信息包含在 `printk`（内核消息）输出中。这允许你测量内核操作之间的间隔，包括启动操作。这对于识别内核启动中的延迟非常有用。


    # MAGIC_SYSRQ — Magic SysRq 键


    如果你在此选 yes，即使系统崩溃（例如在内核调试期间），你对系统系统的控制权（例如，你可以将缓冲区刷新到磁盘、立即重启系统或转储某些状态信息）。这是通过按住
    SysRq（Alt+PrintScreen）键按下各种键来实现。它在串口控制（至少在 PC 硬件上）上也有效，如果你发送 BREAK 并在 5 秒内按下命令键。这些键见
    `Documentation/sysrq.txt`。除非你真的知道这个黑科技在做什么，否则不要选 yes。


    # DEBUG_KERNEL — 内核调试


    如果你正在开发驱动或尝试调试并识别内核问题，请在此选 yes。


    此选项本身不执行任何操作，只是让你有机会有机会选择其他选项。


    # DEBUG_FS — 调试文件系统


