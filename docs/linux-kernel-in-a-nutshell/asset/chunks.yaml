    As of the 2.6.18 kernel release, the 2.6.0 release of `xfsprogs` is the oldest
    that works properly with the kernel. To determine which version of `xfsprogs`
    you have on your system, run the following command:


    ```

    $ xfs_db -V

    ```


    ## Quotas


    To use the quota functionality of the kernel, you must have the `quota-tools`
    package. This package includes programs that let you set quotas on users, provide
    statistics on the amount of quota being used by different users, and issue warnings
    when people get too close to using up their available filesystem quota.


    If you wish to download and install this package yourself, you can find it at
    [http://sourceforge.net/projects/linuxquota](http://sourceforge.net/projects/linuxquota).


    As of the 2.6.18 kernel release, the 3.09 release of `quota-tools` is the oldest
    that works properly with the kernel. To determine which version of `quota-tools`
    you have on your system, run the following command:


    ```

    $ quota -V

    ```


    ## NFS


    To use the NFS filesystem properly, you must have the `nfs-utils` package. This
    package includes programs that let you mount NFS partitions as a client, and run
    an NFS server.


    If you wish to download and install this package yourself, you can find it at
    [http://nfs.sf.net](http://nfs.sf.net).


    As of the 2.6.18 kernel release, the 1.0.5 release of `nfs-utils` is the oldest
    that works properly with the kernel. To determine which version of `nfs-utils`
    you have on your system, run the following command:


    ```

    $ showmount --version

    ```


    ## Other tools


    There are a few other important programs that are closely tied to the kernel version.
    These programs are not usually required in order for the kernel to work properly,
    but they enable access to different types of hardware and functions.


    ### udev


    `udev` is a program that enables Linux to provide a persistent device naming system
    in the `/dev` directory. It also provides a dynamic `/dev`, much like the one
    provided by the older (and now removed) `devfs` filesystem. Almost all Linux distributions
    use `udev` to manage the `/dev` directory, so it is required in order to properly
    boot the machine.


    Unfortunately, `udev` relies on the structure of `/sys`, which has been known
    to change from time to time with kernel releases. Some of these changes in the
    past have been known to break `udev`, so that your machine will not boot properly.
    If you have the latest version of `udev` recommended by your kernel kernel, and
    have problems with it working properly, please contact the `udev` developers on
    the mailing list available at [linux-hotplug-devel@lists.sourceforge.net](mailto:linux-hotplug-devel@lists.sourceforge.net).


    It is highly recommended that you use the version of `udev` that comes with your
    Linux distribution, as it is tied into the distribution specific boot process
    very tightly. But if you wish to upgrade `udev` on your own, you can find it at
    [http://www.kernel.org/pub/linux/utils/kernel/hotplug/udev.html](http://www.kernel.org/pub/linux/utils/kernel/hotplug/udev.html).


    As of the 2.6.18 kernel release, the 081 release of `udev` is the oldest that
    works properly with the kernel. It is recommended that you use the latest version
    of `udev`, because it will work better with newer kernels, due to changes in how
    `udev` and the kernel communicate.


    To determine which version of `udev` you have on your system, run the following
    command:


    ```

    $ udevinfo -V

    ```


    ### Process tools


    The package `procps` includes the commonly used tools `ps` and `top`, as well
    as many other handy tools for managing and monitoring processes running on the
    system.


    If you wish to download and install this package yourself, you can find it at
    [http://procps.sourceforge.net](http://procps.sourceforge.net).


    As of the 2.6.18 kernel release, the 3.2.0 release of `procps` is the oldest that
    works properly with the kernel. To determine which version of `procps` you have
    on your system, run the following command:


    ```

    $ ps --version

    ```


    ### PCMCIA tools


    In order to properly use PCMCIA devices with Linux, a userspace helper program
    must be used to set up the devices. For older kernel versions, this program was
    called `pcmcia-cs`, but that has been replaced with a much simpler system called
    `pcmciautils`. If you wish to use PCMCIA devices, you must have this package installed
    for them to work properly.


    If you wish to download and install this package yourself, you can find it at
    [ftp://ftp.kernel.org/pub/linux/utils/kernel/pcmcia](ftp://ftp.kernel.org/pub/linux/utils/kernel/pcmcia).


    As of the 2.6.18 kernel release, the 004 release of `pcmciautils` is the oldest
    that works properly with the kernel. But the latest version is recommended in
    order to take advantage of newer features in the PCMCIA subsystem, such as automatic
    driver loading when new devices are found.


    To determine which version of `pcmciautils` you have on your system, run the following
    command:


    ```

    $ pccard -V

    ```

