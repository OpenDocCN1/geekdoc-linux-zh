- fmt: "\n*   The build system will install the static kernel portion into the `/boot`\
    \ directory and name this executable file based on the kernel version of the built\
    \ kernel.\n*   Any needed initial ramdisk images will be automatically created,\
    \ using the modules that have just been installed during the `modules_install`\
    \ phase.\n*   The bootloader program will be properly notified that a new kernel\
    \ is present, and it will be added to the appropriate menu so the user can select\
    \ it the next the machine is booted.\n\nAfter this is finished, the kernel is\
    \ successfully installed, and you can safely reboot and try out your new kernel\
    \ image. Note that this installation does not overwrite any older kernel images,\
    \ so if there is a problem with your new kernel image, the old kernel can be selected\
    \ at boot time.\n\nNotable exceptions to this rule are Gentoo and other \"from\
    \ scratch\" types distributions, which expect users to know how to install kernels\
    \ on their own. These types of distributions include documentation on how to install\
    \ a new kernel, so consult it for the exact method required.\n\n# Installing By\
    \ Hand\n\nIf your distributtion does not have an `installkernel` command, or you\
    \ wish to just do the work by hand to understand the steps involved, here are\
    \ the steps involved.\n\n1.  The modules must be installed: `# make modules_install`\n\
    2.  The static kernel image must be copied into the `/boot` directory. For an\
    \ `i386`-based kernel, do the following: `# make kernelversion`\n\n    ```\n \
    \   2.6.17.11\n    ```\n\n    Note that the kernel version will probably be different\
    \ for your kernel. Use this value in place of the text `KERNEL_VERSION` in all\
    \ of the following steps: `# cp arch/i386/boot/bzImage /boot/bzImage-KERNEL_VERSION`\n\
    \n    ```\n    # cp System.map /boot/System.map-KERNEL_VERSION\n    ```\n3.  Modify\
    \ the bootloader so it knows about the new kernel. This involves editing a configuration\
    \ file for the bootloader you use, and is covered later in [Modifying the Bootloader\
    \ For the New Kernel] for the GRUB and LILO bootloaders.\n\nIf the boot process\
    \ does not work properly, it's usually because an initial ramdisk image is needed.\
    \ To create this properly, use the steps in the beginning of this chapter for\
    \ installing a kernel automatically, because the distribution install scripts\
    \ know how to properly create the ramdisk using the needed scripts and tools.\
    \ Because each distribution does this differently, it is beyond the scope of this\
    \ book to cover all of the different methods of building the ramdisk image.\n\n\
    Here is a handy script that can be used to install the kernel automatically instead\
    \ of having to type the previous commands all the time:\n\n```sh\n#!/bin/sh\n\
    #\n# installs a kernel\n#\nmake modules_install\n# find out what kernel version\
    \ this is\nfor TAG in VERSION PATCHLEVEL SUBLEVEL EXTRAVERSION ; do\n    eval\
    \ `sed -ne \"/^$TAG/s/ //gp\" Makefile`\ndone\nSRC_RELEASE=$VERSION.$PATCHLEVEL.$SUBLEVEL$EXTRAVERSION\n\
    # figure out the architecture\nARCH=`grep \"CONFIG_ARCH \" include/linux/autoconf.h\
    \ | cut -f 2 -d \"\\\"\"`\n# copy the kernel image\ncp arch/$ARCH/boot/bzImage\
    \ /boot/bzImage-\"$SRC_RELEASE\"\n# copy the System.map file\ncp System.map /boot/System.map-\"\
    $SRC_RELEASE\"\necho \"Installed $SRC_RELEASE for $ARCH\"\n```\n\n# Modifying\
    \ the Bootloader For the New Kernel\n\nThere are two common Linux kernel bootloaders:\
    \ GRUB and LILO. GRUB is the one more commonly used in modern distributions, and\
    \ does some things a little more easily than LILO, but LILO is still seen as well.\
    \ We'll cover both in this section.\n\nTo determine which bootloader your system\
    \ uses, look in the `/boot/` directory. If there is a `grub` subdirectory:\n\n\
    ```bash\nls -F /boot | grep grub\ngrub/\n```\n\nthen you are using the GRUB program\
    \ to boot with. If this directory is not present, look for the presence of the\
    \ `/etc/lilo.conf` file:\n\n```bash\nls /etc/lilo.conf\n/etc/lilo.conf\n```\n\n\
    If this is present, you are using the LILO program to boot with.\n\nThe steps\
    \ involved in adding a new kernel to each of these programs are different, so\
    \ follow only the section that corrisponds to the program you are using.\n\n##\
    \ GRUB\n\nTo let GRUB know that a new kernel is present, all you need to do is\
    \ modify the `/boot/grub/menu.lst` file. For full details on the structure of\
    \ this file, and all of the different options available, please see the GRUB info\
    \ pages:\n\n```bash\ninfo grub\n```\n\nThe easiest way to add a new kernel entry\
    \ to the `/boot/grub/menu.lst` file is to copy an existing entry. For example,\
    \ consider the following `menu.lst` file from a Gentoo system:\n\n```text\ntimeout\
    \ 300\ndefault 0\nsplashimage=(hd0,0)/grub/splash.xpm.gz\ntitle 2.6.16.11\n  \
    \  root (hd0,0)\n    kernel /bzImage-2.6.16.11 root=/dev/sda2 vga=0x305\ntitle\
    \ 2.6.16\n    root (hd0,0)\n    kernel /bzImage-2.6.16 root=/dev/sda2 vga=0x305\n\
    ```\n\nThe line starting with the word `title` defines a new kernel entry, so\
    \ this file contains two entries. Simply copy the lines from one instance of the\
    \ `title` word to the next one, such as:\n\n```text\ntitle 2.6.16\n    root (hd0,0)\n\
    \    kernel /bzImage-2.6.16 root=/dev/sda2 vga=0x305\n```\n\nto the end of the\
    \ file, and edit the version number to contain the version number of the new kernel\
    \ you just installed. The title does not matter, so long as it is unique, but\
    \ it is displayed in the boot menu, so you should make it meaningful. In our example,\
    \ we installed the `2.6.17.11` kernel, so the final copy of the file looks like:\n\
    \n```text\ntimeout 300\ndefault 0\nsplashimage=(hd0,0)/grub/splash.xpm.gz\ntitle\
    \ 2.6.16.11\n    root (hd0,0)\n    kernel /bzImage-2.6.16.11 root=/dev/sda2 vga=0x305\n\
    title 2.6.16\n    root (hd0,0)\n    kernel /bzImage-2.6.16 root=/dev/sda2 vga=0x305\n\
    title 2.6.17.11\n    root (hd0,0)\n    kernel /bzImage-2.6.17.11 root=/dev/sda2\
    \ vga=0x305\n```\n\nAfter you save the file, reboot the system and ensure that\
    \ the new kernel image's title comes up in the boot menu. Use the down arrow to\
    \ highlight the new kernel version, and press Enter to boot the new kernel image.\n\
    \n## LILO\n\nTo let LILO know that a new kernel is present, you must modify the\
    \ `/etc/lilo.conf` configuration file and then run the `lilo` command to apply\
    \ the changes made to the configuration file. For full details on the structure\
    \ of the LILO configuration file, please see the LILO man page:\n\n```bash\nman\
    \ lilo\n```\n\nThe easiest way to add a new kernel entry to the `/etc/lilo.conf`\
    \ file is to copy an existing entry. For example, consider the following LILO\
    \ configuration file from a Gentoo system:\n\n```text\nboot=/dev/hda\nprompt\n\
    timeout=50\ndefault=2.6.12\nimage=/boot/bzImage-2.6.15\n    label=2.6.15\n   \
    \ read-only\n    root=/dev/hda2\nimage=/boot/bzImage-2.6.12\n    label=2.6.12\n\
    \    read-only\n    root=/dev/hda2\n```\n\nThe line starting with the word `image=`\
    \ defines a new kernel entry, so this file contains two entries. Simply copy the\
    \ lines from one instance of the `image=` word to the next one, such as:\n\n```text\n\
    image=/boot/bzImage-2.6.15\n    label=2.6.15\n    read-only\n    root=/dev/hda2\n\
    ```\n\nto the end of the file, and edit the version number to contain the version\
    \ number of the new kernel you just installed. The label does not matter, so long\
    \ as it is unique, but it is displayed in the boot menu, so you should make it\
    \ meaningful. In our example, we installed the `2.6.17.11` kernel, so the final\
    \ copy of the file looks like:\n\n```text\nboot=/dev/hda\nprompt\ntimeout=50\n\
    default=2.6.12\nimage=/boot/bzImage-2.6.15\n    label=2.6.15\n    read-only\n\
    \    root=/dev/hda2\nimage=/boot/bzImage-2.6.12\n    label=2.6.12\n    read-only\n\
    \    root=/dev/hda2\nimage=/boot/bzImage-2.6.17\n    label=2.6.17\n    read-only\n\
    \    root=/dev/hda2\n```\n\nAfter you save the file, run the `/sbin/lilo` program\
    \ to write the configuration changes out to the boot section of the disk:\n\n\
    ```bash\n# /sbin/lilo\n```\n"
