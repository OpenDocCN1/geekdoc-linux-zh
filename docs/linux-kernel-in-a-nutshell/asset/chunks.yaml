    # 第 1 章 引言


    尽管代码库巨大（超过 700 万行代码），但 Linux 内核是迄今创建的最灵活的操作系统。它可以针对各种不同的系统进行调整，运行从遥控模型直升机、手机，一直到世界上大多数最大的超级计算机的任何设备上。通过为你的特定环境自定义内核，可以创建一个比大多数
    Linux 发行版提供的内核更小、更快的内核。此本书将详细介绍如何构建和安装自定义内核，并就如何启用你可能在不同情况下想要使用的特定选项提供一些提示。


    没有任何 Linux 发行版能提供大多数用户都想要的确切内核。现代发行版已经变得非常随和，编译了对所有已知设备、声音甚至电源节电的支持。但你可能有与大多数用户不同的需求（而且每个发行版都必须尝试满足大多数人的需求）。你可能只是不同的硬件。而且当新内核发布时，你可能想要开始使用它，而不想等待发行版围绕它进行构建。


    出于许多原因，在你的 Linux 职业生涯中，你可能想要构建内核，或者调整你正在运行的内核参数。这本书提供了你所需的信息，让你从用户的角度理解内核并进行最常见的更改。


    从内核中移除某些功能也有很好的理由，特别是如果你在嵌入式系统或小外形系统上运行它时。


    在进行调时，理解内核行为的内部机制是有帮助的。这些超出了本书的范围，但在某些选项中出现的简要摘要除外。参考文献包含了其他书籍和材料的引用，可以为你提供更多背景知识。


    # 使用本书


    ***


    ### 警告


    不要在启用超级用户权限的情况下配置或构建你的内核！


    ***


    在执行本书中的步骤时，之前的警告是最需要记住的一点。此书中的所有内容，从下载内核源码、解压、配置内核到构建内核，都应该在机器上作为普通用户完成。只有安装新内核所需的二三个命令应该以超级用户（`root`）身份执行。


    过去在内核构建过程中出现过错误，如果用户在构建 Linux 内核时拥有超级用户权限，会导致 `/dev` 目录中的某些特殊文件被删除。在使用超级用户权限解压
    Linux 内核时也容易出现问题，因为内核源码包中的某些文件将无法获得正确的权限，并导致后续的构建错误。


    内核源代码也绝不应该放在 `/usr/src/linux/` 目录下，因为那是构建系统库时所使用的内核位置，而不是你新的自定义内核。切不要在 `/usr/src/`
    树下进行任何内核开发，而要在本地用户目录中进行，在那里不会对系统发生任何坏事。


    ***


    # 第 2 章 构建和使用内核的要求


    本章描述了配置内核、构建内核并成功启动它所需的程序。查阅 `Documentation/Changes` 文件以核实本章描述的每个工具应具有的具体版本号是一个明智的主意。本章基于
    2.6.18 内核，描述了与该内核兼容的工具版本。如果你在使用不同的内核，请核实你是否拥有该文件指定的所需的版本，否则事情可能无法正常工作，且很难判断问题出在哪里。


    # 构建内核的工具


    大多数 Linux 发行版都提供安装选项来安装一系列 `Kernel Hacking` 软件包。如果你的发行版提供此选项，那么安装这些包比尝试寻找完成任务所需的所有单独程序要简单得多。


    成功构建内核只需要三个包：编译器、链接器和 make 工具。本节描述了每个包的内容。


    ## 编译器


    Linux 内核是用 C 语言语言编写的，在某些地方有少量的汇编语言。要构建内核，必须使用 GCC C 编译器。大多数 Linux 发行版都有一个名为 `gcc`
    的包应该被安装。如果你想下载编译器并自己构建，你可以在 [`gcc.gnu.org`](http://gcc.gnu.org) 找到它。


