  trans: "\n将驱动程序匹配到设备的步骤取决于你正在处理的设备类型。在本章中，我们将讨论两种常见的设备类型：PCI 和 USB 设备。这里描述的方法适用于其他类型的设备。\n\
    \n此外，内核能够找到系统中的所有文件系统也非常重要，其中最重要的是根文件系统。我们将在本章末尾的根文件系统中介绍如何实现这一点。\n\n## PCI 设备\n\
    \nPCI 设备通过厂商 ID（vendor ID）和设备 ID（device ID）来区分；每个厂商 ID 和设备 ID 的组合都可能需要唯一的驱动程序。这就是本节向你展示的研究的基础。\n\
    \n对于这个示例，让我们使用一个与当前运行内核版本不兼容的 PCI 网卡。这个示例与你的情况不同，具有不同的 PCI 设备和总线 ID 值，但涉及的步骤对于你想要找到可用驱动程序的任何\
    \ PCI 设备类型都是相关的。\n\n首先，在系统中找到无法工作的 PCI 设备。要获取所有 PCI 设备的列表，请使用 `lspci` 程序。因为我们只关心以网\
    \ PCI 设备，我们将通过只搜索包含 `Ethernet` 字符串（不区分大小写）来缩小 PCI 设备的搜索范围：\n\n```bash\n$ /usr/sbin/lspci\
    \ | grep -i ethernet\n```\n\n```\n06:04.0 Ethernet controller: Realtek Semiconductor\
    \ Co., Ltd.  RTL-8139/8139C/8139C+ (rev 10)\n```\n\n这就是我们希望使其工作的设备。\n\n### 注意\n\
    \n几乎所有的发行版都将 `lspci` 程序放在 `/usr/sbin/` 目录下，但某些放在其他位置。要查找它的位置，请输入：\n\n```bash\n\
    $ which lspci\n```\n\n`/usr/sbin/lspci`\n\n如果你使用的发行版将其放在了其他处，那么每当我们讨论使用 `lspci`\
    \ 时，请使用该路径。\n\n`lspci` 输出的前几位显示了该设备的 PCI 总线 ID，即 `06:04.0`。这就是我们在遍历 `sysfs` 以获取有关该设备的更多信息时将使用的值。\n\
    \n进入 `sysfs`，那里列出了所有不同的 PCI 设备，并查看它们的名称：\n\n```bash\n$ cd /sys/bus/pci/devices/\n\
    $ ls\n```\n\n```\n0000:00:00.0  0000:00:1d.0  0000:00:1e.0  0000:00:1f.3  0000:06:03.3\n\
    0000:00:02.0  0000:00:1d.1  0000:00:1f.0  0000:06:03.0  0000:06:03.4\n0000:00:02.1\
    \  0000:00:1d.2  0000:00:1f.1  0000:06:03.1  0000:06:04.0\n0000:00:1b.0  0000:00:1d.7\
    \  0000:00:1f.2  0000:06:03.2  0000:06:05.0\n```\n\n内核对 PCI 设备编号带有前缀 `0000:`，这在\
    \ `lspci` 程序的输出中并不显示。因此，在你通过 `lspci` 找到数字的基础上加上 `0000:`，进入该目录：\n\n```bash\n$ cd\
    \ 0000:06:04.0\n```\n\n在此目录下，你想知道 `vendor` 和 `device` 的值：\n\n```bash\n$ cat vendor\n\
    ```\n\n```\n0x1ec\n```\n\n```bash\n$ cat device\n```\n\n```\n0x8139\n```\n\n这些是\
    \ PCI 设备的 ID。内核使用这些值将驱动程序匹配到设备。PCI 驱动程序告诉内核它们支持哪些厂商和设备 ID，以便内核知道如何将驱动程序绑定到设备。将它们记录下来，稍后会用到。\n\
    \n现在我们知道了该 PCI 设备的厂商产品 ID，需要找到宣传该设备的正确内核驱动。回到内核源码目录：\n\n```bash\n$ cd ~/linux-2.6.17/\n\
    ```\n\n内核源码中 PCI ID 最常见的位置是 `include/linux/pci_ids.h`。搜索该文件查找我们的厂商：\n\n```bash\n\
    $ grep -i 0x1ec include/linux/pci_ids.h\n```\n\n```\n#define PCI_VENDOR_ID_REALTEK\
    \  0x1ec\n```\n\n这里定义的 `PCI_VENDOR_ID_REALTEK` 将被任何声称支持它的内核驱动使用。为了安全起见，也在该文件中查找设备\
    \ ID，因为它有时会在那里描述：\n\n```bash\n$ grep -i 0x8139 include/linux/pci_ids.h\n```\n\n\
    ```\n#define PCI_DEVICE_ID_REALTEK_8139  0x8139\n```\n\n这个定义很有用。现在查找引用该厂商的驱动源文件：\n\
    \n```bash\n$ grep -Rl PCI_VENDOR_ID_REALTEK *\n```\n\n```\ninclude/linux/pci_ids.h\n\
    drivers/net/r8169.c\ndrivers/net/8139too.c\ndrivers/net/8139cp.c\n```\n\n列出的第一个文件\
    \ `pci_ids.h` 不需要查看，因为它是发现原始的地方。但 `drivers/net/` 子目录下的 `r8169.c`、`8139too.c` 和\
    \ `8139cp.c` 应该仔细检查。\n\n用编辑器打开这些文件之一并搜索 `PCI_VENDOR_ID_REALTEK`。在 `drivers/net/r8169.c`\
    \ 文件中，它出现在这段代码部分：\n\n```c\nstatic struct pci_device_id rtl8169_pci_tbl[] = {\n\
    \    { PCI_DEVICE(PCI_VENDOR_ID_REALTEK, 0x8169), },\n    { PCI_DEVICE(PCI_VENDOR_ID_REALTEK,\
    \ 0x8129), },\n    { PCI_DEVICE(PCI_VENDOR_ID_DLINK, 0x4300), },\n    { PCI_DEVICE(0x16ec,\
    \ 0x0116), },\n    { PCI_DEVICE(PCI_VENDOR_ID_LINKS, 0x1032, PCI_ANY_ID, 0x0024\
    \ }, },\n    { },\n};\n```\n\n所有 PCI 驱动程序都包含它们支持的不同设备列表。该列表包含在 `struct pci_device_id`\
    \ 结构中，就像这一个。我们需要查看它来判断我们的设备是否由该驱动支持。这里的厂商值匹配，但厂商后的第二个值是设备值。我们的设备值为 `0x8139`，而此驱动程序对于厂商\
    \ ID 为 `PCI_VENDOR_ID_REALTEK` 的设备支持值为 `0x8169` 和 `0x8129`。因此此驱动程序不支持我们的设备。\n\n\
    继续下一个文件 `drivers/net/8139too.c`，我们在以下代码段找到了字符串 `PCI_VENDOR_ID_REALTEK`：\n\n```c\n\
    if (pdev->vendor == PCI_VENDOR_ID_REALTEK &&\n    pdev->device == PCI_DEVICE_ID_REALTEK_8139\
    \ && pci_rev >= 0x20) {\n    dev_info(pdev->dev,\n        \"This (id %04x:%04x\
    \ rev %02x) is an enhanced 8139C+ chip\\n\",\n        pdev->vendor, pdev->device,\
    \ pci_rev);\n    dev_info(pdev->dev,\n        \"Use the \\\"8139cp\\\" driver\
    \ for improved performance and stability.\\n\");\n}\n```\n\n这里 `PCI_VENDOR_ID_REALTEK`\
    \ 值的使用也与检查 PCI 设备 ID 是否匹配 `PCI_DEVICE_ID_REALTEK_8139` 值的代码对应。如果是，驱动程序将打印出显示“使用\
    \ 8139cp 驱动以提高性能和稳定性”的消息。也许我们应该下一个查看那个驱动程序。即使我们没有这样一个明显的线索，`8139too.c` 驱动在 `struct\
    \ pci_device_id` 变量中也没有我们寻找的厂商和设备 ID 对，所以这给了我们它不支持设备的线索。\n\n最后，查看 `drivers/net/8139cp.c`\
    \ 文件。它在以下代码部分使用了 `PCI_VENDOR_ID_REALTEK`：\n\n```c\nstatic struct pci_device_id\
    \ cp_pci_tbl[] = {\n    { PCI_DEVICE(PCI_VENDOR_ID_REALTEK, PCI_DEVICE_ID_REALTEK_8139),\
    \ },\n    { PCI_DEVICE(PCI_VENDOR_ID_TTTECH, PCI_DEVICE_ID_TTTECH_MC322), },\n\
    \    { PCI_DEVICE(PCI_ANY_ID, PCI_ANY_ID, 0, 0), },\n    { },\n};\n\nMODULE_DEVICE_TABLE(pci,\
    \ cp_pci_tbl);\n```\n\n这里在 `struct pci_device_id` 变量中使用了我们的厂商和设备 ID。该驱动程序应该支持我们的设备。\n\
    \n现在我们有了驱动程序名称，就可以像本章第一节所示，反向查找编译此驱动程序时应开启的正确内核配置值。\n\n总结来说，找到哪个 PCI 驱动程序可以控制特定\
    \ PCI 设备的步骤如下：\n\n1. 使用 `lspci` 查找所需设备的 PCI 总线 ID。\n\n"
- fmt: "\n2. Go into the `/sys/bus/pci/devices/0000:*bus_id` directory, where `bus_id`\
    \ is the PCI bus ID found in the previous step.\n\n3. Read the values of the `vendor`\
    \ and `device` files in the PCI device directory.\n\n4. Move back to the kernel\
    \ source tree and look in `include/linux/pci_ids.h` for the PCI vendor and device\
    \ IDs found in the previous step.\n\n5. Search the kernel source tree for references\
    \ to those values in drivers. Both the vendor and device ID should be in a `struct\
    \ pci_device_id` definition.\n\n6. Search the kernel Makefiles for the `CONFIG_`\
    \ rule that builds this driver by using `find` and `grep`:\n```\nfind -type f\
    \ -name Makefile | xargs grep DRIVER_NAME\n```\n\n7. Search in the kernel configuration\
    \ system for that configuration value and go to the location in the menu that\
    \ it specifies to enable that driver to be built.\n\n## USB devices\n\nFinding\
    \ the specific driver for a USB device is much like finding the driver for a PCI\
    \ device as described in the previous section, with only minor differences in\
    \ finding the bus ID values.\n\nIn this example, let us find the driver that is\
    \ needed for a USB wireless device. As with the PCI device example, the details\
    \ in this example will be different from your situation, but the steps involved\
    \ should be relevant to any type of USB device for which you wish to find a working\
    \ driver.\n\nAs with the PCI device, the bus ID must be found for the USB device\
    \ you wish to find the driver for. To do this, you can use the `lsusb` program\
    \ that comes in the `usbutils` package.\n\nThe `lsusb` program shows all USB devices\
    \ attached to the system. As you do not know what the specific device your are\
    \ looking for is called, start by looking at all devices:\n\n```\n/usr/sbin/lsusb\n\
    ```\nBus 002 Device 003: ID 045e:0023 Microsoft Corp. Trackball Optical\nBus 002\
    \ Device 001: ID 0000:0000  \nBus 005 Device 003: ID 0409:0058 NEC Corp. HighSpeed\
    \ Hub\nBus 005 Device 001: ID 0000:0000  \nBus 004 Device 003: ID 157e:300d  \n\
    Bus 004 Device 002: ID 045e:001c Microsoft Corp.\nBus 004 Device 001: ID 0000:0000\
    \  \nBus 003 Device 001: ID 0000:0000  \nBus 001 Device 001: ID 0000:0000\n\n\
    The devices with an ID of `0000:0000` can be ignored, as they are USB host controllers\
    \ that drive the bus itself. Filtering them away leaves us with four devices:\n\
    \n```\n/usr/sbin/lsusb | grep -v 0000:0000\n```\nBus 002 Device 003: ID 045e:0023\
    \ Microsoft Corp. Trackball Optical\nBus 005 Device 003: ID 0409:0058 NEC Corp.\
    \ HighSpeed Hub\nBus 004 Device 003: ID 157e:300d  \nBus 004 Device 002: ID 045e:001c\
    \ Microsoft Corp.\n\nBecause USB devices are easy to remove, unplug the device\
    \ you want to find the driver for and run `lsusb` again:\n\n```\n/usr/sbin/lsusb\
    \ | grep -v 0000:0000\n```\nBus 002 Device 003: ID 045e:0023 Microsoft Corp. Trackball\
    \ Optical\nBus 005 Device 003: ID 0409:0058 NEC Corp. HighSpeed Hub\nBus 004 Device\
    \ 002: ID 045e:001c Microsoft Corp.\n\nThe third device is now missing, which\
    \ means the device shown as:\n`Bus 004 Device 003: ID 157e:300d`\nis the device\
    \ you want to find the driver for.\n\nIf you replace the device and look at the\
    \ output of `lsusb` again, the device number will have changed:\n\n```\n/usr/sbin/lsusb\
    \ | grep 157e\n```\nBus 004 Device 004: ID 157e:300d\n\nThis is because the USB\
    \ device numbers are not unique, but change every time they are plugged in. What\
    \ is stable is the vendor and product ID, shown here by `lsusb` as two four-digit\
    \ values with a `:` between them. For this device, the vendor ID is `157e` and\
    \ the product ID is `300d`. Write down the values you find, as you will use them\
    \ in future steps.\n\nAs with the PCI device, we will search the kernel source\
    \ code for the USB vendor and product IDs in order to find the proper driver to\
    \ control this device. Unfortunately, no single file contains all of the USB IDs,\
    \ as PCI has. So a search of the whole kernel tree is necessary:\n\n```\ngrep\
    \ -i -R -l 157e drivers/*\n```\ndrivers/atm/pca200e.data\ndrivers/atm/pca200e_ecd.data\n\
    drivers/atm/ba200e_ecd.data\ndrivers/net/wireless/zd1211rw/zd_usb.c\ndrivers/scsi/ql1040_fw.h\n\
    drivers/scsi/ql1280_fw.h\ndrivers/scsi/qlogic_asm.c\n\nWe know this is a USB device,\
    \ and not an ATM or SCSI device, so we can safely ignore the files found in the\
