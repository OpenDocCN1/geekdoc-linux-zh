- fmt: "\n`debugfs` is a virtual file system where kernel developers put debugging\
    \ files. Enable this option to be able to read and write to these files.\n\n##\
    \ Name\n\n`SECURITY` — Enable different security models\n\nThis allows you to\
    \ configure different security modules into your kernel.\n\nIf this option is\
    \ not selected, the default Linux security model will be used.\n\n## Name\n\n\
    `SECURITY_SELINUX` — NSA SELinux Support\n\nThis selects NSA Security-Enhanced\
    \ Linux (SELinux). You will also need a policy configuration and a labeled filesystem.\
    \ You can obtain the policy compiler (`checkpolicy`), the utility for labeling\
    \ filesystems (`setfiles`), and an example policy configuration from [http://www.nsa.gov/selinux](http://www.nsa.gov/selinux).\n\
    \n# Appendix A. Helpful Utilities\n\nRetrieving, building, updating, and maintaining\
    \ a Linux kernel source tree involves a lot of different steps, as this book has\
    \ shown. Developers being naturally lazy creatures, they have created some programs\
    \ to help with the various routine tasks. Here we describe a few of these useful\
    \ tools and the basics on how to use them.\n\nLinux kernel development differs\
    \ in many ways from traditional software development. Some of the special demands\
    \ on kernel programmers include:\n\n* Constantly applying your changes to the\
    \ moving target of a fast-based kernel development release schedule.\n* Resolving\
    \ any merge conflicts between changes you have made and changes made by other\
    \ people.\n* Exporting your changes in a format that lets others incorporate and\
    \ work with it easily.\n\n# patch and diff\n\nOne of the most common methods of\
    \ doing kernel work is to use the `patch` and `diff` programs. To use these tools,\
    \ two different directory trees: a \"clean\" one and a \"working\" one must be\
    \ used. The clean tree is a released kernel version, while the working one is\
    \ based on the same version but contains your modifications. Then you can use\
    \ `patch` and `diff` to extract your changes and port them forward to a new kernel\
    \ release.\n\nFor an example, create two directories containing the latest kernel\
    \ version as described in [Chapter 3](#index_split_023.html_filepos106625):\n\n\
    ```\n$ tar -zxf linux-2.6.19.tar.gz\n$ mv linux-2.6.19 linux-2.6.19-dirty\n$ tar\
    \ -zxf linux-2.6.19.tar.gz\n$ ls\n```\n\n`linux-2.6.19/`\n\n`linux-2.6.19-dirty/`\n\
    \nNow make all of the different changes you wish to do in the `-dirty` directory\
    \ and leave the clean, original kernel directory alone. After finishing making\
    \ changes, you should create a patch to send it to other people:\n\n```\n$ diff\
    \ -Naur -X linux-2.6.19/Documentation/dontdiff linux-2.6.19/ linux-2.6.19-dirty/\
    \ > my_patch\n```\n\nThis will create a file called `my_patch` that contains the\
    \ difference between your work and a clean 2.6.19 kernel tree. This patch then\
    \ can be sent to other people via e-mail.\n\n## New Kernel Versions\n\nIf a new\
    \ kernel version is released, and you wish to port your changes to the new version,\
    \ you need to try to apply your generated patch onto a clean kernel version. This\
    \ can be done in the following steps:\n\n1. Generate your original patch, as in\
    \ the previous example.\n2. Using the official patch from `kernel.org`, move the\
    \ old kernel version forward one release:\n   ```\n   $ cd linux-2.6.19\n   $\
    \ patch -p1 < ../patch-2.6.20\n   $ cd ..\n   $ mv linux-2.6.19 linux-2.6.20\n\
    \   ```\n3. Move your working directory forward one release by removing your patch,\
    \ then apply the new update:\n   ```\n   $ cd linux-2.6.19-dirty\n   $ patch -p1\
    \ -R < ../my_patch\n   $ patch -p1 < ../patch-2.6.20\n   $ cd ..\n   $ mv linux-2.4.19-dirty\
    \ linux-2.6.20-dirty\n   ```\n4. Try to apply your patch on top of the new update:\n\
    \   ```\n   $ cd linux-2.6.20-dirty\n   $ patch -p1 < ../my_patch\n   ```\n\n\
    If your patch does not apply cleanly, resolve all of the conflicts that are created\
    \ (the `patch` command will tell you about these, leaving behind `*.rej` and `*.orig`\
    \ files for you to compare and fix up manually using your favorite editor). This\
    \ merge process can be the most difficult part if you have made changes to portions\
    \ of the source tree that have been changed by other people.\n\nIf you use this\
    \ development process, I highly recommend getting the excellent `patchutils` set\
    \ of programs (found at [http://cyberelk.net/tim/patchutils](http://cyberelk.net/tim/patchutils)).\
    \ These programs enable you to manipulate text patches easily in all sorts of\
    \ useful ways, and have saved kernel developers many hours of tedious work.\n\n\
    ***\n\n# Managing Your Patches With quilt\n\nKernel development using `patch`\
    \ and `diff` generally works well. But after a while, most people grow tired of\
    \ it and look for a way that does not involve so tedious patching. Luckily, a\
    \ few developers came up with a program called `quilt`.\n\nTo get started, create\
    \ a kernel source tree like this:\n\n```\n$ tar -zxf linux-2.6.19.tar.gz\n$ ls\n\
    ```\n\n`linux-2.6.19/`\n\nAnd go into that directory:\n\n```\n$cd linux-2.6.19\n\
    ```\n\nTo get started, create a directory called `patches` that will hold all\
    \ our patches:\n\n```\n$ mkdir patches\n```\n\nThen tell `quilt` to create a new\
    \ patch called `patch1`:\n\n```\n$ quilt new patch1\n```\n\n`Patch patches/patch1\
    \ is now on top`\n\n`quilt` needs to be told about all the files that will be\
    \ modified by this new patch. To do this, use the `add` command:\n\n```\n$ quilt\
    \ add Makefile\n```\n\n`File Makefile added to patches/patch1`\n\nThe idea behind\
    \ `quilt` is that you work with a pristine source tree, and add a number of patches\
    \ on top of it.\n\nEdit the `Makefile`, modify the `EXTRAVERSION` line, and save\
    \ the change. After you finish, tell `quilt` to refresh the patch:\n\n```\n$ quilt\
    \ refresh\n```\n\n`Refreshed patch patches/patch1`\n\nThe file `patches/patch1`\
    \ will contain a patch with the changes you have just made:\n\n```\n$ cat patches/patch1\n\
    ```\n\n`Index: linux-2.6.19/Makefile`\n`===================================================`\n\
    `--- linux-2.6.19.orig/Makefile`\n`+++ linux-2.6.19/Makefile`\n`@@ -1,7 +1,7 @@`\n\
    ` VERSION = 2`\n` PATCHLEVEL = 6`\n` SUBLEVEL = 19`\n`-EXTRAVERSION =`\n`+EXTRAVERSION\
    \ = -dirty`\n` NAME=Crazed Snow-Weasel`\n` # *DOCUMENTATION*`\n\n\n\nYou can continue\
    \ on, working with this single patch, or create a new one to go on top of this\
    \ patch. As an example, if three different patches had been created, *patch1*,\
    \ *patch2*, and *patch3*, they will be applied one on top of another.\n\nTo see\
    \ the list of patches that are currently applied:\n\n```\n$ quilt series -v\n\
    ```\n\n`+ patches/patch1`\n\n`+ patches/patch2`\n\n`= patches/patch3`\n\nThis\
    \ output shows that all three patches are applied, and that the current one is\
    \ *patch3*.\n\nIf a new kernel version is released, and you wish to port your\
    \ changes to the new version, quilt can handle this easily with the following\
    \ steps:\n\n1.  Pop off all of the patches that are currently on the tree:\n \
    \  ```\n   $ quilt pop -a\n   ```\n\n`Removing patch patches/patch3`\n\n`Restoring\
    \ drivers/usb/Makefile`\n\n`Removing patch patches/patch2`\n\n`Restoring drivers/Makefile`\n\
    \n`Removing patch patches/patch1`\n\n`Restoring Makefile`\n\n`No patches applied`\n"
