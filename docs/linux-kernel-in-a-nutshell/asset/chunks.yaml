    `        [M]  Raw IEEE1394 I/O support`


    # # PCI hotplug


    PCI hotplug systems are becoming more popular with the use of ExpressCard and
    laptop docking stations.


    To determine whether your machine has an ExpressCard controller, look at the hardware
    to see whether an ExpressCard card can be plugged into it.


    Enable PCI support for the kernel:


    `Bus options (PCI, PCMCIA, EISA, MCA, ISA)`

    `    [*] PCI Support`


    Enable PCI Hotplug support for the kernel:


    `Bus options (PCI, PCMCIA, EISA, MCA, ISA)`

    `    [*] PCI Support`

    `    PCI Hotplug Support`

    `        [M] Support for PCI Hotplug (EXPERIMENTAL)`


    There is a wide range of different types of PCI Hotplug controllers. For most
    laptops and for ExpressCard support, enable the ACPI controller:


    `Bus options (PCI, PCMCIA, EISA, MCA, ISA)`

    `    [*] PCI Support`

    `    PCI Hotplug Support`

    `        [M] Support for PCI Hotplug (EXPERIMENTAL)`

    `        [M] ACPI Hotplug driver`


    as well as the PCI Express controller:


    `Bus options (PCI, PCMCIA, EISA, MCA, ISA)`

    `    [*] PCI Support`

    `    [*] PCI Express Support`

    `    [M] PCI Expressplug driver`


    # # PCMCIA / CardBus


    PCMCIA and CardBus support is in every laptop manufactured. Newer laptops, however,
    are switching to the ExpressCard format (see [PCI hotplug](#index_split_07.html_filepos28896)).


    To determine whether your machine has a PCMCIA controller, look at the hardware
    to see whether a PCMCIA card can be plugged into it.


    Enable PCI support for the kernel:


    `Bus options (PCI, PCMCIA, EISA, MCA, ISA)`

    `    [*] PCI Support`


    Enable PCCARD support for the kernel:


    `Bus options (PCI, PCMCIA, EISA, MCA, ISA)`

    `    PCCARD (PCMCIA/CardBus) support`

    `    [M] PCCard (PCMCIA/CardBus) support`


    Enable both PCMCIA and CardBus support to cover the widest range of devices:


    `Bus options (PCI, PCMCIA, EISA, MCA, ISA)`

    `    PCCARD (PCMCIA/CardBus) support`

    `    [M] PCCard (PCMCIA/CardBus) support`

    `    [M] 16-bit PCMCIA support`

    `    [*] 32-bit CardBus support`


    Enable the card bridge for your laptop. The most common one is the "yenta-like"
    controller:


    `Bus options (PCI, PCMCIA, EISA, MCA, ISA)`

    `    PCCARD (PCMCIA/CardBus) support`

    `    [M] PCCard (PCMCIA/CardBus) support`

    `    [M] CardBus yenta-compatible bridge`

    `    [ ] Cirrus PD6729 compatible bridge`

    `    [ ] i82092 compatible bridge`

    `    [ ] i82365 compatible bridge`

    `    [ ] Databook TC host bridge`


    # # Sound (ALSA)


    ALSA (Advanced Linux Sound Architecture) is the current sound system for the Linux
    kernel. An earlier sound system (OSS) has been deprecated, and almost all of the
    older drivers have been removed from the kernel source tree.


    To determine which type of sound controller is present in your machine, and what
    type it is, run the following command:


    ```

    $ /usr/sbin/lspci grep -i audio

    ```


    `00:1f.5 Multimedia audio controller: Intel Corporation 8280EB/ER (ICH5/ICH5R)
    AC''97 Audio Controller (rev 02)`

    `06:0d.0 Multimedia audio controller: Creative Labs SB Audigy (rev 04)`


    Note that your response will probably not be identical; what is important is that
    the command shows some Audio controllers.


    Enable basic sound support:


    `Device Drivers`

    `    Sound`

    `    [M] Sound Card Support`


    Enable ALSA:


    `Device Drivers`

    `    Sound`

    `    [M] Sound Card Support`

    `        [M] Advanced Linux Sound Architecture`


    There are a number of different base ALSA options, such as support for the older
    `OSS` sound protocol. If you have older applications, you should enable the related
    options:


    `Device Drivers`

    `    Sound`

    `    [M] Sound Card Support`

    `        [M] Advanced Linux Sound Architecture`

    `            [M] OSS Mixer API`

    `            [M] OSS PCM (digital audio) API`

    `            [ ]     OSS PCM (digital audio) API - Include plugin system`


    Enable the specific type of sound device that you have. PCI sound cards are under
    the PCI submenu:


    `Device Drivers`

    `    Sound`

    `    [M] Sound Card Support`

    `        [M] Advanced Linux Sound Architecture`

    `            PCI Devices`


    # # CPU


    If you wish to have the Linux kernel run as fast as possible for your specific
    processor and hardware, there are a few options that you can set to get the last
    bit of performance out of the hardware. This section will show some of the different
    processor-specific options you can tune for.


    ## Processor Types


    A wide range of specific processor options are available to be changed in the
    Linux kernel. The most important one for our purpose specifies the exact type
    of CPU you are using. To determine the type of processor you are using, run the
    following command:


    ```

    $ cat /proc/cpuinfo | grep "model name"

    ```


    `model name : Intel(R) Xeon(TM) CPU 3.20GHz`


    Note that your response will probably not be identical; what is important is that
    the command shows the model name of the processor present on the system.


    Select the subarchitecture type of the processor:


    `Processor type and features`

    `    Subarchitecture Type`

    `    (X) PC-compatible`

    `    ( ) AMD Elan`

    `    ( ) Voyager (NCR)`

    `    ( ) NUMAQ (IBM/Sequent)`

    `    ( ) Summit/EXA (IBM x440)`

    `    ( ) Support for other sub-arch SMP systems with more than 8 CPUs`

    `    ( ) SGI 320/540 (Visual Workstation)`

    `    ( ) Generic architecture (Summit, bigsmp, ES7000, default)`

    `    ( ) Support for Unisys ES7000 IA32 series`

