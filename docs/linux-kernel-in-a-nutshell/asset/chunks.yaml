    ^([[12](#index_split_060.html_filepos253662)]) How can you determine whether you
    are using a ramdisk at boot time? In [Chapter 5](#index_split_040.html_filepos153143)
    we mention using the distribution installation script to install the kernel versus
    doing the installation on your own. If you are using the distribution installation
    script, you are probably using a ramdisk. If you are installing it on your own,
