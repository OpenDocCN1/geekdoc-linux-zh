  trans: "\n\n如果你只想在工作中使用最新的内核，建议你使用稳定版内核（stable kernel releases）。如果你想帮助内核开发者测试下一个内核版本的特性并向他们反馈，请使用开发版内核（development\
    \ kernel release）。在本章中，我们将假设你正在使用稳定版内核。\n\n# 在哪里寻找内核源码\n\nLinux 内核的所有源代码都可以在 `kernel.org`\
    \ 站点之一找到，这是一个全球性的服务器网络，用于镜像 Linux 源码，让每个人都能找到距离最近的本地服务器。这使得主内核服务器能够对镜像站点做出响应，并让用户能够尽可能快地下载所需的文件。\n\
    \n主 [`www.kernel.org`](http://www.kernel.org) 站点显示了不同内核树的所有当前内核版本，如图图 3-2 所示。\n\
    \n![kernel.org 主网站](img/00003.png)\n\n图 3-2. kernel.org 主网站\n\n要下载最新的稳定版内核版本，请点击内核版本行上的\
    \ `F` 字符。这将下载整个源码树。或者，你可以进入所有 2.6 内核版本的相应子目录 [`www.us.kernel.org/pub/linux/kernel/v2.6/`](http://www.us.kernel.org/pub/linux/kernel/v2.6/)，如图图\
    \ 3-3 所示。\n\n![2.6 内核源码目录](img/00004.png)\n\n图 3-3. 2.6 内核源码目录\n\n也可以从命令行下载内核源码，使用\
    \ `wget` 或 `curl` 工具，这两个工具通常都带在你的 Linux 发行版中。\n\n使用 `wget` 下载 2.6.17.8 内核版本，输入：\n\
    \n```\n$ wget http://www.kernel.org/pub/linux/kernel/v2.6/linux-2.6.17.8.tar.gz\n\
    ```\n\n```\n--17:44:55  http://www.kernel.org/pub/linux/kernel/v2.6/linux-2.6.17.8.tar.gz\n\
    ```\n\n```\n          => linux-2.6.17.8.tar.gz'\n```\n\n```\nResolving www.kernel.org...\
    \ 204.152.191.5, 204.152.191.37\n```\n\n```\nConnecting to www.kernel.org|204.152.191.5|:80...\
    \ connected.\n```\n\n```\nHTTP request sent, awaiting response... 200 OK\n```\n\
    \n```\nLength: 51,707,742 (49M) [application/x-gzip]\n```\n\n```\n100%[=============================================>]\
    \ 51,707,742    35.25K/s    ETA 00:00\n```\n\n```\n18:02:48 (47.12 KB/s) - linux-2.6.17.8.tar.gz'\
    \ saved [51707742/51707742]\n```\n\n使用 `curl` 下载：\n\n```\n$ curl http://www.kernel.org/pub/linux/kernel/v2.6/linux-2.6.17.8.tar.gz\
    \ -o linux-2.6.17.8.tar.gz\n```\n\n```\n  % Total    % Received % Xferd  Average\
    \ Speed   Time     Time     Current\n                                  Dload \
    \ Upload  Total   Spent    Left  Speed\n100 49.3M  100 49.3M     0         0 \
    \  50298      0  0:17:08  0:17:08 --:--:--  100k\n```\n\n要快速方便地确定最新的内核版本，可以使用\
    \ [`www.kernel.org/kdist/finger_banner`](http://www.kernel.org/kdist/finger_banner)\
    \ 上的信息，如图图 3-4 所示。\n\n![最新内核版本](img/00005.png)\n\n图 3-4. 最新内核版本\n\n# 如何处理源码\n\n\
    现在你已经下载了正确的内核源码，它应该被存放在哪里呢？我们建议在你的主目录下创建一个名为 `linux/` 的本地目录来存放所有源码。\n\n首先，创建目录：\n\
    ```bash\nmkdir ~/linux\n```\n\n然后，将源码移动到该目录：\n```bash\ncd ~/linux\n```\n\n现在解压源码：\n\
    ```bash\ntar -xzvf linux-2.6.17.8.tar.gz\n```\n\n一旦提取出源码，列出文件：\n```bash\nls\n\
    ```\n\n# 配置与编译\n\n内核包含了近两千个配置选项，因此如果要求询问每一个单独的选项，将花费很长时间。幸运的是，有一种更简单的方法来配置内核：基于预构建的配置进行配置。\n\
    \n## 创建配置\n\n内核配置存储在一个名为 `.config` 的文件中。内核配置程序将逐一遍历配置选项，并询问你是否启用该选项。通常，每个选项的显示格式为\
    \ `[Y/m/n]`。大写字母是默认值，可以直接按回车键选择。选项有：\n\n- `y`: 直接编译到内核中。\n- `n`: 完全排除在内核。\n- `m`:\
    \ 编译为模块，需要时加载。\n- `?`: 打印简短描述信息并重复提示。\n\n## 默认配置\n\n每个内核版本都带有一个“默认”内核配置。该配置大致基于该架构的内核维护者认为的最佳选项。在某些情况下，它仅仅是内核维护者在其个人机器使用的配置。i386\
    \ 架构就是如此，默认内核配置与 Linus Torvalds 用于其主开发机的配置非常匹配。\n\n要创建此默认配置，请执行操作：\n\n```\ncd\
    \ linux-2.6.17.10\nmake defconfig\n```\n\n# 修改配置\n\n现在我们创建了基础配置文件，应该对其进行修改以支持系统中的硬件。有关如何确定需要选择哪些配置选项来实现这一目标，请参阅第\
    \ 7 章。在这里我们将展示如何选择想要更改的选项。\n\n有三种不同的交互式内核配置工具：基于终端的 `menuconfig`、基于 GTK+ 的图形化\
    \ `gconfig`，以及基于 QT 的图形化 `xconfig`。\n\n## 控制台配置方法\n\n`menuconfig` 配置内核方法是一种基于控制台的程序，它提供了一种使用键盘方向键在内核配置中移动的方法。要启动此配置模式，输入：\n\
    \n```bash\nmake menuconfig\n```\n\n"
