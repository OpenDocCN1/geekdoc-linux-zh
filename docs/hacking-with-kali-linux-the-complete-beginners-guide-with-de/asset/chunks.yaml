    Michael Gallo 和 William Hancock 编写的第二版《Networking Explained》。本解释将为用户提供对基础系统部分的理解。


    网络基础


    系统管理可以被视为电脑之间电子街道的序列。这些街道可以是物理的，最常见的是 5 类或 6 类（`CAT 5` 或 `CAT 6`）链路或光纤链路。远程系统管理利用独特的无线发射器和接收器来引导物理系统之间的各种基础任务。无论介质如何，物理或远程系统管理都有相似的基础部分。首先至少有两个设备将通信，例如，Adam
    的电脑将与 Bill 的电脑通信。为了实现这一点，他们需要正确的介质上工作的交换设备。对于这个模型，Adam 将连接与 Bill 连接的相同的物理 `CAT5`
    基系统。如果设置正确，只要双方的协议和设置正确，Bill 可以使用远程系统卡而 Adam 可以使用有线系统卡。为了让此准确运行，Adam 和 Bill 都应该通过像远程交换机这样的设备连接相同的系统部分，该设备会将有线和无线不同的物理介质类型关联。


    许多部分构成了一个现代网络，完全解释系统管理远超本书的范围。将披露的小系统部分将足以描述如何配置系统卡。这个小系统只是 Adam 和 Bill 使用的两台电脑、一个连接到链路调制解调器的有线交换机以及将一切连接的链路（在本模型中全是
    `CAT5`）。交换机的内部互联网协议（`IP`）地址为 `192.168.1.1`，这对于小型办公（SOHO）和家庭系统的默认设置非常常见。这个小交换机通过其外部连接连接互联网，使用由互联网服务提供商分配的
    IP 地址，这将允许 Adam 和 Bill 在有效配置其系统卡后浏览网页。在这个模型中，交换机还提供了动态主机配置协议（`DHCP`）、关键的防火墙功能和域名管理（`DNS`），这些每一个都将在稍后详细讨论。该系统在图
    4.3 中所示，并将作为后续所有部分的基础系统。


    私有地址


    交换机的内部接口（或系统卡）的 IP 地址为 `192.168.1.1`；这是所谓的私有位置，因为它不能在互联网上使用。对于图中黑盒所说的内部系统扬点，这与
    `DHCP` 给出的地址是类似的，例如给 Adam 和 Bill 电脑提供的 IP 地址。表格记录了可以用于内部或私有系统的正常私有 IP，但不能在互联网上使用。为了访问互联网，交换机执行称为网络地址转换（`NAT`）的魔法，将
    Adam 和 Bill 使用的 IP 转换为可以在互联网上使用的地址。这通常是数字供应商提供给交换机的地址。


    默认网关


    交换机隔离了这两个系统（内部和外部），并提供了一些基本功能，类似于简单的防火墙。此外，交换机提供了网络出口。因此，交换机的内部接口 IP 地址为 `192.168.1.1`，即为默认网关。这将在以后设计系统卡时使用。理解默认网关的一种良好方法是将其视为离开城镇的唯一街道。任何离开城镇的人都需要知道这条街道在哪里。


    名称服务器


    电脑使用数字相互通信，而人类对单词更敏感。为了让这有效工作，电脑使用名称服务器（`DNS`）。本书将更详细涵盖 DNS。从根本上，名称服务器将人类名称（如
    `www.google.com`）解释为电脑更好地处理的 IP 地址。


    DHCP


    对于未标记的系统功能，没有什么比得上 `DHCP`。对于一台设置了 DHCP 的电脑，客户端只需连接到工作的链路即可。这是在电脑重启系统时通过向向服务器发送请求完成。服务器响应并为客户端分配
    IP 地址。这还包括默认网关、名称服务器和其他设置。


    关键子网划分


    子网划分是一个让许多人困惑的主题，因此在书中子网划分可能会被描述为设计网络的最佳方法。这通过将子网掩码应用于 IP 地址的一部分来实现。例如，如果 IP 地址是
    `192.168.1.77` 且子网掩码是 `255.255.255.0`，前三个字节代表网络，最后一个字节代表主机。`255.255.255.0` 子网掩码将有效，而较大的系统将需要为系统指定的替代子网掩码。


    Kali Linux 默认设置


    如之前澄清的，大多数入门工程师和白帽程序员不需要他们的系统卡在连接时报告其在系统上的本质。这正是 Kali Linux 在配置并与系统连接时将执行的操作。在引导渗透时要小心，在连接之前禁用系统卡以避免这种不必要的通信。


