    ### 理解网络流量 (Understanding Network Traffic)

    网络流量对某些人可能是困惑的；在任何情况下，都需要对这个主题的基本理解以便在测试阶段获得最大的收益。网络流量是通过各种策略关联系统之间的电子通信。今天最著名的系统管理方法是有线和无线以太网。理解通信的标准至关重要。此部分将探索端口和防火墙、IP
    协议包括传输控制协议 (TCP)、用户数据协议 (UDP) 和互联网控制管理协议 (ICMP)。


    ### 获取端口和防火墙 (Getting Ports and Firewalls)

    保护系统的最重要的策略之一是在内部公司网络与其余世界（如互联网）之间建立防火墙。防火墙只是带有至少两个网卡的注册设备，充当系统的守护者。访问控制记录仔细筛选出站流量（离开）和入站流量（进入）。只有符合访问控制标准的流量允许通过，而其余被防火墙丢弃。它通过打开或关闭端口来允许或拒绝流量。端口是用于计算机到计算机通信的独特通道。有
    65535 个 TCP 端口和另外 65535 个 UDP 端口可以用于通信。这些端口中的少数被分配给特定原因，但不限于此用途。例如，TCP 端口 80 通常用于使用超文本传输协议
    (HTTP) 的典型互联网网页流量，但其他流量可以通过端口 80 传输而互联网流量通过不同的端口发送。一种方法是将端口视为一个通往各种房间的大型公司。这些房间中的每一个都有一个办公室工作人员制作特定的显示并管理各种功能。80
    号的办公室处理进入的网页请求。网络部门可以移动到另一个办公室，例如 8080 号的办公室，继续执行类似的功能，在那里处理网页请求。另一个小组可以进入 80
    号房间，该房间与网页请求无关，或者该房间可以基本上关闭、锁上并闲置。试图寻找网络小组的人需要知道网络小组目前位于 8080 号而不再 80 号。


