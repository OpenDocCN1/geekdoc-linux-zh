    刚开始学习 Google 搜索可以从位于 [`www.google.com/advanced_search`](http://www.google.com/advanced_search)
    的 Google 高级搜索开始。此页面将帮助新手搜索者完成基本的操作。页面的顶部部分将通过包含和排除单词及数字来帮助查找网页。页面的底部部分将帮助利用 Google
    的运算符来筛选结果。搜索者可以使用此页面上的任何字段组合来构建将要使用的查询字符串。使用多个字段将产生一个越发不可预测、但也越精确的查询字符串。


    ### 包含所有这些词 (Every One of These Words)

    此字段可用于查找包含对话框中输入的单词的页面，而不忽略这些单词在网页上的位置。这些单词不需要在请求中组合或相邻，只需出现在页面的某个地方即可。要进行此类搜索，在对话框中输入不同的术语并点击“高级搜索”按钮。通过这样做，开发页面中输入的单词被转换为查询字符串，然后发送给
    Google，就像直接在 Google 主页的搜索框中输入它们的一样。


    ### 确切的单词或短语 (This Exact Word or Phrase)

    在此选项左侧的字段中输入查询词，会导致 Google 网页搜索工具发现与精确请求完全相同的单词或短语。与“包含所有这些词”搜索不同，只有在精确请求中且相邻包含该短语或单词的网页才会被纳入结果集。这种查询通过在语句内设置搜索术语来实现。


    ### 包含这些词中的任何一个 (Any of These Words)

    使用此字段时，Google 搜索将发现包含这些单词中任一单词的页面。与“包含所有这些词”字段完全不同，返回的页面并不包含所输入的所有单词。这种搜索通过在查询框中的术语之间放置
    OR（或）连接符来实现。


    ###不包含这些词中的 (None of These Words)

    在此内容框中输入的单词将用于在后续 Google 搜索中排除页面。任何包含输入单词的页面都将从结果集中剔除。这种搜索通过在结果集中你不需要的单词或术语前加上一个减号来实现。


    ### 数字范围从 (Numbers Ranging from)

    通过使用这里的两个内容字段，搜索将发现包含输入范围范围内数字的页面。这种搜索可以通过包含单位来增强，例如，磅 (lb)、英里或毫米 (mm) 或像 $ 这样的货币。这种查询可以通过在数字之间设置两个点在主搜索框中进行。


    ### 语言 (Language)

    通过下拉选择器选择一种语言，后续页面大部分将使用所选语言。此查询限制器对于将结果限制在以目标所在地主要使用的语言编写的页面非常有用。例如，通过专注于德国网站，正在对德国公司进行渗透测试的小组可以更有可能寻找与此特定任务相关的信息。


    ### 地区 (Locale)

    通过下拉选择器选择地区，后续页面将来自分布在所选区域的站点页面。如果未使用语言下拉菜单生成选项，则使用所选区域的搜索结果将包含分布在该地区的页面，而不考虑其使用的首要语言。通过同时选择语言和地区，可以引导越发精确的搜索。


    ### 最后更新时间 (Last Updated)

    通过在下拉菜单中选择时间限制，只有在所选时间范围内更新的页面会被记录。这将确保旧页面被排除在结果之外，并可用于确保后续页面是在关键事件之后。例如，如果渗透测试关注的协会近期与另一协会完成了合并或收到了另一项创新，搜索可以限制在事件发生以来，以确保查询结果具有更高的相关性。


    ### 站点或域名 (Site or Domain)

    此内容框在缩小目标列表项时可能是最有帮助的。例如，寻找一个管理协会可能通过将结果限制在仅 .gov 空间而获益，而寻找 Foo 公司可能通过将结果限制在 foo.com
    区域而获益。这种限制也可以在基础 Google 搜索内容框中实现，使用搜索限制器 site，后跟结果集中应返回区域或空间。例如，使用 `site:foo.com`
    将结果限制为仅来自 foo.com 区域的页面。


    ### 出现的词 (Terms Appearing)

    通过此下拉列表，可以将查询聚焦在页面的特定部分。明确选择“页面任意位置”将在整个互联网目标页面上运行搜索，对查询问题关注的位置没有实际限制。


    使用“在页面标题中 (in title of the page)”进行搜索将仅关注网页的标题。具体来说，页面标题是显示在浏览器浏览器标签页中的网页部分。这种查询也可以通过在搜索框中使用
    `intitle:administrator` 在 Google 主页上进行。


    使用限制器“在页面内容中 (in the content of the page)”将搜索限制为仅限页面内容。它将禁止图片、记录和像标题之类的页面结构。如果这些内容写在页面内容中，查询将在结果中恢复这些内容。例如，如果页面内容中引用了图片，该图片将出现在索引列表中；这对内容中的图片标记和链接同样有效。在
    Google 搜索框中使用 `intext:administrator` 等同于从下拉列表中选择此选项。


    使用“在页面 URL 中 (in URL of the page)”将搜索限制为页面统一资源定位符 (URL)。URL 是显示在互联网浏览器地址框中的站点页面位置。最后，使用“与页面的链接
    (in connections to the page)”将发现链接到查询准的页面。这种搜索可以通过使用 `inurl:administrator` 在主
    Google 搜索框中引导。


    ### 安全搜索 (Safe Search)

    安全搜索有两个变体：“显示最相关结果”和“显示明确内容”。严格表达式设置可以显式地过滤索引列表中的不良记录和图片。选择“显示最相关结果”不会对结果进行明确过滤。


    ### 理解水平 (Understanding Level)

    阅读水平选项将根据搜索返回的网页内容的多方面性来过滤结果。“不显示阅读水平”将执行无阅读水平的搜索。选择“用理解水平解释结果”将显示所有结果；并将显示每个页面的阅读水平。Google
    的计算不如其他评估水平那样逻辑化或细致。然而，它在将结果分为这三类（中级和高级）方面非常有效。这在引导渗透测试时，将结果专注于目标的阅读水平是非常有利的。尝试三个水平中的每一个可能有助于查看索引列表和从阅读理解水平中获取的重要数据。


    ### 记录类型 (Record Type)

    记录类型可以是渗透分析师可以使用最重要的搜索之一。此设置将列表项限制为特定记录类型，例如 Microsoft Word 文档的 `.doc` 和 `.docx`，Adobe
    归档的 `.pdf`。通常客户端会使用不同的记录类型处理各种数据。常见的客户端名称、密码和不同类型的记录将存储在 `.xls` 或 `.xlsx` 电子表格中。下拉列表提供了最广知的记录类型，可以通过
    `filetype:xls` 在 Google 搜索中使用任何扩展名。


    ### 使用权限 (Utilization Rights)

    权限根据版权和其他重用许可限制查询结果的使用能力。通过选择“允许使用、共享或更改”，返回的结果将是可以重用的内容。例如，在大多数情况下内容不能被更改。“允许使用、提供或调整”将返回可以在许可范围内进行更改的列表项。然而，带有“商业”一词的选项返回的是可以工业使用的结果。


    ### 聚合 Google 高级搜索 (Aggregating an Advanced Google Search)

