    再次，或者清除所有可能的敏感数据痕迹。从框架中清理应用程序将一次性彻底根除应用程序包和所有相关的设置记录。在使用 `cleanse` 工作时要小心，不要太粗大意；当使用不当或在不适当的程序上时，它是危险的，因为所有相关的记录都将从框架中驱逐。


    `cleanse` 可以配合以下语言结构使用：`well-suited get cleanse {package_name}`。`CleanBundles`
    会从源头下载到框架、解包，然后引入。这些包将留在框架中，直到另有通知。在应用程序建立后，这些包不再是基础的。一段时间后，这些包可能会占用磁盘空间并应该被清理。


    可以使用随后的语言结构来启动完美能力：`able get spotlessAutoclean`。`Autocleaning` 还会作为完美能力沿着这些线路额外清理框架。它应该用于维护和向框架的升级，因为
    `autoclean` 能力将清除被新包取代的旧包。


    例如，假设应用程序 `Y form 1` 已引入框架，在向框架升级后，应用程序 `Y v1` 被应用程序 `Y v2` 取代。`autoclean` 能力将清理
    `form 1`，而完美能力将驱逐这两个版本的应用程序包。接的语言结构将启动 `autoclean` 工作：`adept get autocleanAssembling`。


    ### 组织

    包的组织与更高效的工作密切相关。以下是客户端可以使用的相关指令，以确保所有可能的修复、包和更新都是前瞻性的且准备就绪的：


    1. `well-suited get update && adept get redesign && well-suited get dist-overhaul`

    2. `well-suited get autoremove && adept get autoclean`


    命令行行上的 `&&` 路径考虑了连续运行多个指令。


    ### Debian 软件包管理器

    Linux 的主要版本（或发行版）拥有独特的应用程序包框架。Kali Linux 基于 `Debian 7.0` 基础工作框架，并可能需要外部应用程序，例如
    Tenable 的 `Nessus`。`Nessus` 是一个漏洞检查应用程序，可以从适用于 `Debian Package Manager` 的预包文档中引入。`Nessus`
    的使用将在检查章节中探讨。在下载此类程序时，请寻找文件名结尾的 `.deb` 扩展。


    使用 `Debian Package Manager` 相比 `APT` 并没有优势。`aptget` 程序专门为管理 Debian 包而编写。必须从供应商购买的外部程序无法免费访问，且
    `well-suited gets sources` 将无法找到下载和安装包。Kali Linux 在不引入额外产品的情况下无法处理 `RPM`（Red Hat
    包），且不建议在基于 Debian 的框架上使用 `RPMs`。


    #### 引入

    在下载 `.deb` 包后，应使用 `dpkg` 指令来引入包。大多数 `.deb` 包都是清晰的，并包含了应用程序有效运行所需的全部条件。在某些情况下，特别是对于管理授权软件，供应商可能在安装之前需要额外的步骤，并通常会有关于在框架上适当安装的指南。在开始安装之前务必检查卖者的文档：


    ```

    dpkg - I {package_name.deb}/{target_directory}

    ```


    #### 驱逐

    驱逐包（`- r`）或清理包（`- P`）的工作方式与 `APT` 通常相同，并遵循处理包的类似示例：

    ```

    dpkg - r {package_name.deb}

    ```

    使用 Debian 包管理器清理包与 `evac` 能力类似，并可以通过随后的指令启动：

    ```

    dpkg - p {package_name.deb}

    ```


    #### 检查已安装的包

    `APT` 相比 `Debian Package Manager` 的一个超能力是解析已引入或驱逐程序的当前状态的能力。在使用 `dpkg` 内部的 `rundown`
    工作时，输出将在行开头显示几个字符代码表明包的当前安装状态。当针对 `Leaf cushion` 应用程序包运行时，如下所示显示该包已被驱逐，但配置文档仍然可用。


    运行指令 `dpkg - P leafpad` 后，该包的配置文档也被驱逐。图 3.2 显示了 Leafpad 应用程序包从框架中完全清理后的对比输出。要搜索已引入或驱逐程序的状态，请使用此语言结构：

    ```

    dpkg - l {package_name}

    ```


    ### TAR 包

    Tar 始于 Unix 框架的早期时代，其名称源于它的功能，最初是为了将多个文档组合到磁带存档 (`TAR`)。并不是每个人都需要将各种记录移动到磁带的能力。然而，他们可能需要
    `tar` 程序的特性功能，即产生一个容纳不同文档的容器文档。这使得文档传输更加简单。此外，这些文档可以使用 `gunzip (gzip)` 压缩以减小它们的总体大小。来自外部或开源活动的某些包可以
    tarball 格式下载，并通过 `.tar` 扩展名或压缩 tar 包的 `.tar.gz` 有效区分。


    在渗透测试期间，会捕捉大量的过滤存档、屏幕截图、重做内容和客户文档。使用 `Tarball` 框架考虑了更简单的分类、归档和支付，一切都是平等的。特别建议将所有渗透测试的记录在受保护区域保留
    5 年，或者执行工作所在地法律时限规定的日期。客户可能还对维护要求有规定，这些规定应在渗透测试的承诺规则 (ROE) 中说明。`ROE` 将将在章节中探讨。如果一个组织或合同工人在渗透测试方面非常活跃，文档量可能会迅速积累并很快变得失控。`Tarball`
    特尤其是压缩后，提供了一种控制安排，可以保持记录分离并考虑了更简单的维护和管理。


    #### Tar 包的形成

    创建一个 tar 包记录可以是简单的也可以是复杂的。记住，`tar` 指令最初的功能旨在将记录发送到 `TAR`。对于 tarball 框架的现代用法，请查看
    tarball 的手册页 (`man tarball`)。本书仅将包含 tarball 记录的基本形成；尽管如此，这些信息是有用的并可以推广到几乎任何基于
    Linux 的平台。以下提供了客户端可以创建一个示例 tarball 所需的步骤概述。


    1. 为你的文档创建一个索引。在这种情况下，正在使用 `mkdir` 指令创建 `tar-demo1` 目录：

    ```

    mkdir tar-demo1

    ```

    2. 接下来在这个索引中创建各种用于描述 `tar` 指令的记录。在这种情况下，将使用正确的胡萝卜（`.`）来创建一个内容为 "Hi world." 的记录。该文档将命名为
    `record 1`，可以通过更改数字以类似的方式创建若干记录。像这样创建记录也将把你的文档移动到指定的注册中，在此情况下为 `tar-demo1`：

    ```

    echo "Hi World". tar-demo1/file1

    echo "Hi World". tar-demo1/record 2

    ```

    3. 进入你想要创建 tarball 的注册。

    ```

    cd tar-demo1

    ```

    4. 在该注册中创建一个包含所有文件的 tarball。在此情况下，星号（`*`）将指示注册表中的所有内容：

    ```

    tar -cf tarball.demo *

    ```

    5. 使用随后的指令列出已创建的 tarball 的内容：

    ```

    tar - tf tarball.demo

    ```

