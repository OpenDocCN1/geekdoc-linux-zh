    \ of Publishers Association）和美国律师协会（American Bar Association）均认为有效且公平，且在美国应被视为具有法律约束力。\n\
    \n对本文包含的任何内容（包括任何特定或扩展信息）的复制、传输和复制，无论这些信息最终去向何处都属于非法行为。这包括物理、数字和音频格式的作品复制版本，除非事先获得出版者的明确同意。保留所有其他权利。\n\
    \n此外，下文所述页面中可以找到的信息在叙述事实时应被认为是准确且真实的。因此，对提供信息的任何使用（无论正确错误）都将使出版者对其直接管理范围之外所采取的行为不负责。无论如何，在任何情况下，原作者或出版者都不会因本文讨论的任何信息可能导致的任何损害或困难而承担任何形式的责任。此外，后续页面中的信息仅供参考，因此应被视为通用的。根据其性质，这些信息的呈现不对其长期有效性或中间质量提供保证。文中提到的商标均未经书面许可，不能以任何方式被视为商标持有者的背书。\n\
    \n# 目录 \n\n*   演示/介绍 自己的* KALI 历史\n*   硬盘安装\n*   实用的包处理工具 自己的* TAR 包\n*   安装 NESSUS\
    \ 的实用指南\n*   包含软件源\n*   METASPLOITABLE\n*   从目标自己的网站开始\n*   扫描\n\n# 演示/介绍 \n\n\
    Kali Linux 是全球知名的渗透测试平台，被安全专家广泛应用于各个领域，包括渗透测试、犯罪现场调查、侦测和漏洞评估。它是长期完善的结晶，是平台持续开发的成果，从\
    \ `WHoppiX` 到 `WHAX`，再到 `Back Track`，现在是一个利用 `Debian GNU/Linux` 许多特性以及全球动态开源网络的全面渗透测试框架。Kali\
    \ Linux 的创建并不是为了成为一个基础工具集，而是一个让专业渗透分析师、安全爱好者、学生和新手可以修改以适应其特定需求的灵活框架。\n\n## 为什么选择这本书？\n\
    \nKali Linux 不仅仅是基于标准 `Debian` 基础之上引入并预先配置以便让你立即上手的不同数据安全工具集合。要充分利用 Kali，关键在于深入理解其强大的\
    \ `Debian GNU/Linux` 底层（这些底层支持那每一项卓越工具）并弄清楚如何部署它们来为你服务。尽管 Kali 显然是多用途的，但它基本上是为了辅助渗透测试设计的。\n\
    \n本书的目的不是为了让你在使用用 Kali Linux 时感到自在。而是为了帮助提高你的理解并简化你的体验，以便当你忙于渗透测试且时间紧迫时，你不必为为浪费宝贵的分钟去安装新程序或启用另一个系统管理功能而感到压力。在书中，我们将首先让你熟悉\
    \ `Linux`。之后，我们将进一步深入，带你熟悉 Kali 的细节。通过 `Linux` 让你确切知道引擎内部发生了什么。拥有这些信息非常重要，特别是当你试图在紧迫的时间限制下工作时。在设置环境、调查问题、努力让某个工具听你调遣、解析设备输出或在更大规模的状况中使用\
    \ Kali 时，需要这些信息并不是什么不寻常的。\n\n## 这本书适合你吗？\n\n如果你渴望进入智力丰富且极具趣味的数据安全领域，并合合理地选择了 Kali\
    \ Linux 作为一项核心平台，那么这本书将在你的旅程中提供帮助。它是为首次使用 `Linux` 的用户以及试图加深对 Kali 底层理解的 Kali 用户编写的。它也是为那些已经使用\
    \ Kali 很长时间，但希望规范自己的学习、增加对 Kali 的利用并弥补知识漏洞的人而准备的。此外，这本书对于寻求 Kali Linux 认证专业人员认证的人来说，可以作为指南、专门参考和学习帮助。\n\
    \n# 术语 \n\n在审查渗透测试时，经常会用到各种基础术语。不同的职业、特定的声誉甚至来自同一小组的人对该领域使用的术语理解可能略有不同。因此，书中将使用以下术语及相关定义。\n\
    \n### 渗透测试，Pentesting\n\n渗透测试是分析师在特定且经过许可的规则内采用的方法、程序和技术，试图绕过数据框架防护，包括克服该框架的协调安全特性。这种测试与评估框架的技术、法规和操作设置及控制有关。定期的渗透测试仅评估数据框架本身的安全性。目标系统的管理员和工作人员可能会意识到正在进行渗透测试。\n\
    \n### 红队，Red Teaming\n\n红队在程序和方法上模拟潜在的敌人。这些小组通常比渗透测试小组更大，拥有更丰富的经验。渗透测试本身通常是红队演习（Red\
    \ Team Exercise）的一个子部分，但这些活动测试的是组织安全防御的不同要素。红队经常通过技术、社交和物理方法攻击组织。他们经常使用与黑客（Black\
    \ Hat Hackers）类似的程序，以测试组织或数据框架防御这些敌对角色的能力。除了渗透测试外，红队还将执行社会工程攻击，包括网络钓鱼、鱼叉式钓鱼以及物理攻击（如翻垃圾桶和开锁），以获取数据和访问权限。总的来说，目标组织的员工不会意识到正在进行红队演习。\n\
    \n### 道德黑客\n\n道德黑客是专业的渗透分析师，为了框架所有者或拥有数据框架的利益而攻击框架。对于本书的目的来说，道德破解与渗透测试同义。\n\n\
    ### 白帽\n\n白帽（White Hat）是道德黑客或电脑安全专业人士的俚语，他们相信能够提高数据框架安全的哲学。\n\n### 黑帽\n\n黑帽是一个区分那些利用特殊方法在未经许可的情况下绕过框架安全以实施不道德行为的术语。渗透测试人员和红队人员经常利用黑帽使用的策略，在执行授权的活动或测试时模拟这些人。黑帽在未经授权和非法的情况下进行其活动。黑帽指的是一个处于白帽和黑帽界限之间的特殊大师。这些人经常尝试在未经许可的情况下绕过数据框架的安全特性，不是为了利益而是为了让框架管理员意识到发现的缺陷。黑帽通常没有权限测试框架，但通常并不追逐金钱奖励。\n\
    \n### 漏洞分析，Vulnerability Analysis\n\n漏洞分析被用于评估数据框架的安全设置。此类评估包括对应用在框架中以及框架中缺失的安全补丁进行评估。漏洞分析团队（`VAT`）可以位于数据框架之外，也可以是框架支持人员的一部分。\n\
    \n### 安全控制评估\n\n安全控制评估衡量数据框架与特定法律或行政要求的一致性。这些要求的示例包括但不限于联邦信息安全管理法案（`FISMA`）、支付卡行业（`PCI`）和健康保险流通与责任法案（`HIPAA`）。安全控制评估被用作组织批准数据框架在生成环境中运行的证据（BOEE\
    \ 的一部分。某些框架要求渗透测试作为安全控制评估的一个方面。\n\n### 恶意用户测试，Malicious User Testing\n\n在恶意用户测试中，评估者接受充当具有恶意的内部人员、怀有恶意的客户或滥用者的工作。在这些测试中，评估者被赋予已批准的普通用户或经理客户的身份，通常作为测试账户。评估者将利用这些凭证尝试绕过安全限制，回想起看到过的框架未获批准的文档和设置，更改不应更改的设置，并将自己的权限提升到框架本应有的水平。恶意客户测试重现了叛徒内部人员的活动。\n\
    \n### 社会工程学\n\n社会工程攻击通常对数据框架或客户是有害的。社会工程师利用个人帮助他人的天然需求来获取利益。\n\n"
