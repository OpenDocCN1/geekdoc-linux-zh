    #### 零成本构建实验室

    在虚拟化时代之前，信息（IT）专家、安全专业人员和学生同样拥有车库、地下室和其他堆满电脑设备的房间。有时，这些电脑和系统管理硬件会从地板堆到天花板，电费贵得惊人。拥有大堆设备是一种折磨；如果你需要搬家，想象一下带走它们有多困难。庆幸现在不是这种情况。


    无论你的电脑运行的是 Windows、Mac 还是 Linux 工作框架，处理家庭虚拟化都有两种基本方法。这两个项目都不需要额外费用，并且适用于大多数运行
    32 位或 64 位架构的设计工作框架。


    ##### VMWare Player

    **优点**

    * 虚拟机 (VMs) 构建在用于 NAT 的虚拟交换机上。许多虚拟机将具有相互通信的能力，并且可以从主机进行访问。

    * 默认引入了 `DHCP`，所有虚拟机都可以获得 IP 地址。

    * 对 `Xen`、`XenServer`、`vSphere` 和其他主流虚拟机管理程序的高级支持。


    **缺点**

    * 不支持 Mac、Solaris 或 FreeBSD 工作框架。

    * 不考虑现有虚拟机的快或克隆。

    * 与某些 Wi-Fi 组织连接存在困难。


    ##### VirtualBox

    **优点**

    * 适用于 Windows、Linux、Mac、Solaris 和 FreeBSD。

    * 提供可克隆虚拟机的功能（节省时间）。

    * 支持日益增虚拟磁盘映像类型。这在运行下载和预构建的虚拟机时特别有用。


    **缺点**

    * 除非在主机上启用了端口转发，否则虚拟机之间相互隔离。

    * 不支持 `Xen`、`XenServer`、`vSphere` 或其他类型管理程序所需的嵌套虚拟化。

    * 如果虚拟机崩溃，整个虚拟机损坏的概率更高。


    本指南专门针对在 Microsoft Windows 7 专业版上引入的 Oracle `VirtualBox` 版本 `4.2.16`。选择使用 `VirtualBox`
    而不是 `VMWare Player` 是因为在互联网上有更多资源可以帮助解决出现的问题；尽管如此，它需要额外的配置。


    记住，在选择虚拟化框架时，最好的测试是你自己的研究。关于哪个是最好的有过很多讨论，最终选择了一个。

