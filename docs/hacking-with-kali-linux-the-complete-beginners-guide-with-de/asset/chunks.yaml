    最近表征的分区表。选择 `YES` 并点击 `Continue` 继续完成安装程序。在向导分区区域的最后一个简要说明中点击 `Continue` 后，硬盘分区将开始。图
    A 显示当前正在进行实际安装。根据你所拥有的设备，此过程可能只需要几分钟，也可能一小时或更长时间。


    ## 配置软件包管理器

    软件包管理器是工作框架配置中至关重要的一部分。软件包管理器指的是 `Kali Linux` 获取更新和安全补丁的存储库。建议使用随 `Kali Linux`
    ISO 提供的系统镜像，因为这将是软件包执行程序的最新源。图中显示将选择“`YES`”。点击 `Continue` 按钮继续完成安装程序。如果使用中间代理，请根据向导中的以下后续简要说明输入相应的配置数据，或将其留空。点击
    `Continue`。


    ## 引入 GRUB 加载程序

    大统一引导加载程序 (`GRUB`) 是每次 PC 启动时将显示的主屏幕。这允许在启动时检查特定设置、进行实时更改，并在工作框架加载之前修改设置。虽然 `GRUB`
    对于某些驱动的客户端并非必需，但对于大多数安装类型都强烈建议使用。点击“`YES`”以引入 `GRUB`，然后点击 Continue。


    ## 完成安装

    现在从 PC 上移除光盘并重启。当出现提示时，请执行相应操作，然后点击 `Continue` 按钮完成安装。重启后，将显示欢迎屏幕。使用安装过程中早早定义的预密码以
    `root` 用户身份登录。欢迎使用 `Kali Linux`！


    ## 优盘安装

    USB 内存设备（通常称为优盘）是通过 `USB` 接口连接到 PC 的简单容量设备。本书建议使用具有至少 8GB 空间的 `USB` 设备，理想情况下空间更大。新
    PC 可以从 `USB` 设备启动。如果选择此选项，请确保所使用的 PC 支持从 `USB` 设备启动。


    后续章节将介绍如何在 Microsoft Windows PC 或 Linux 阶段在 USB 盘上安装 `Kali Linux`。请务必检查 Kali Linux
    官方登录页上提供的文档，以获取此程序的更新。


    关于将优盘作为启动设备使用，有两个关键术语非常：`持久性 (persistence)` 和 `非持久性 (non-persistence)`。`持久性` 指你的设备在关机后保留任何已写入或修改记录的能力。`非持久性`
    指设备在重启或关机后丢失所有设置、自定义内容和记录。特别对于本书而言，从 Windows 阶段安装的 `Kali Linux` 优盘将是非持久性的，而从 Linux
    阶段安装将是持久性的。


    ### Windows（非持久性）

    所需应用程序——`Win32 Disk Imager`：http://sourceforge.net/ventures/win32diskimager/


    在下载 `Kali Linux ISO` 之前，将优盘插入 PC 并等待 Windows 识别它，观察分配的驱动器号。接下来打开 `Win32 Disk Imager`。点击信封图标浏览并选择
    `Kali ISO` 文件，然后点击“确定”按钮。从设备下拉菜单中选择正确的驱动器号。最后点击“Start”按钮。


    当 `Win32 Disk Imager` 完成写入 ISO 后，重启 PC 并在 BIOS POST 菜单中选择优盘。大多数制造商都有从 USB 设备启动的各种策略；请务必检查
    PC 制造商的文档。


    ### Linux（持久性）

    在构建持久性优盘时，再次强调大小确实很重要！优盘容量越大越好。此外，取决于你组装此 USB 设备的 Linux 版本，确保已安装应用程序 `GParted`。如果你在安装
    `GParted` 时遇到问题，请检查工作框架的文档。如果未安装 `GParted`，以下技术之一可能对你的 Linux 安装有效：

    - sudo apt install gparted

    - yum install gparted

    - `yum` install gparted


    下载 `Kali Linux ISO` 后，插入你的优盘。打开终端窗口并确认 USB 设备位于以下路径。


    ```bash

    mount | grep -I udisks | awk ''{print $1}''

    ```

    显示命令输出为 `/dev/sdb1`。USB 设备的输出可能根据 PC 设置和设计而异。按顺序，将 "sdb" 替换为正确的标识符并删除结尾的数字。使用
    `dd` 命令将 Kali ISO 镜像移动到 USB 设备。


    ```bash

    dd if=kali_linux_image.iso of=/dev/sdb bs=4K status=progress

    ```

    现在启动 `Gparted`。`gparted /dev/sdb`。该驱动器现在应该有一个刚刚写入的 Kali 镜像的分区。


    通过在“File”菜单栏中点击“Partition”菜单并选择“New”，为 USB 添加另一个分区。不同设备制造商的输出略有不同。总之，方法如下：

    - 点击灰色的“unallocated”（未分配）空间。

    - 从 Partition 下拉菜单点击“New”。

    - 使用滑块或物理确定驱动器大小。

    - 将文件系统设置为 `ext4`。

    - 点击“Add”。

    - 在主窗口中，从“Edit”下拉菜单选择“Apply All Operations”。

    - 提示时点击“OK”。这可能需要一些时间。


    要包含持久功能，请使用以下命令。


    ```bash

    mkdir /mnt/usb

    mount /dev/sdb2 /mnt/usb

    echo "/persistence.." > /mnt/usb/persistence.conf

    umount /mnt/usb

    ```

    LiveUSB 的创建现已完成。重启 PC 并从优盘启动。


    ### SD 卡安装

    微型设备，例如 Raspberry Pi 和 Google 的 Chrome Notebook，适用于 SD 卡上运行。这些小型设备可以用于许多用途；受限于个人的想象力。这些设备（例如
    Raspberry Pi）的优点是它们价格廉 way，并且在开源社区中非常受欢迎，使各地的爱好者能够快速获得资源。


    在 ARM 设备上引入 Kali Linux 有一个缺点；镜是定制的，必须为每种硬件进行说明。

    ARM 设备的镜像可以在 Kali 官方下载页面上找到：[`www.kali.org/downloads/`](http://www.kali.org/downloads/)。检查你的设备是否有可下载的支持的镜像。


    以下是向良好的 ARM 工程型设备引入 Kali Linux 的简要指南：

    1. 从 Kali 官方网站下载合适的镜像 ([`www.kali.org/downloads/`](http://www.kali.org/downloads/))。

    2. 插入空白 SD 卡。使用以下命令确认挂载区域。

    ```bash

    mount | grep -I vfat (假设后续阶段为 /dev/sdb)

    ```

    3. 将 `kali.img` 文件移动到 SD 卡。

    ```bash

    dd if=kali.img of=/dev/sdb bs=4K status=progress

    ```

    4. 在提取设备之前，卸载并同步任何写入任务。

    ```bash

    umount /dev/sdb sync

    ```

    5. 拔出 SD 卡。

    6. 将包含 Kali Linux 镜像的 SD 卡插入你的 ARM 工程计算设备并从 SD 卡启动。


    在本节中，涵盖的主题允许用户将 Kali Linux 引入大多数 PC、工作站、优盘和小型计算设备。引入 Kali Linux 就像骑自行车；做一次，你以后通常永远不会忘记如何引入
    Kali。查看 Kali 官方网站上的文档和网络消息公告，以获取安全网络中开发的最新更新、版本和进展。与其他安全专家、专家和程序员建立联系并协作，可以并且能够扩展视野，帮助你更深入地探索新任务，并在可能时帮助解答问题。


