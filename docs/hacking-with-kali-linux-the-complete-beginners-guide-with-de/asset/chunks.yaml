    在安装之前。在编写本书时，可以从 [`www.kali.org/downloads/`](http://www.kali.org/downloads/) 下载
    Kali Linux。尖端任务、设计和特殊用例的也可以在 Kali 的官方网站 [`www.kali.org/official-documentation/`](http://www.kali.org/official-documentation/)
    上找到。同样，还有一个庞大且活跃的网络，用户可以在那里发布问题并帮助他人应对挑战。建议在该网站注册以访问由 Kali Linux 创建者 Hostile Security
    管理的社区公告。Hostile Security 还会发布有关更新和网络数据的消息。


    请确保选择正确的版本（`i386 5 32-bit`、`amd64 5 64-bit`）。Kali Linux 的受信任镜像不在本书的涵盖范围内。如果你想熟悉
    Kali，或者需要一个用于深度控制的沙盒域，那么 `VMware` 下载是这些情况的理想选择。点击合适的下载链接继续。


    对于 Microsoft Windows 7 用户，双击下载好的文件，将弹出 `Burn ISO Wizard`。按照提示完成从 ISO 镜像到可用于安装的
    DVD 的转换。Linux 用户应使用适当的光盘刻录程序打开 ISO，例如 `K3b`。


    # 硬盘安装


    后续章节将提供一个易于操作的文本和图形化安装向。为了有效地将 Kali 引入系统硬盘，甚至从实时光盘系统启动，将基本输入输出系统 (`BIOS`）设置为从光驱启动至关重要。要开始安装，将
    `CD` 放入电脑的 `CD` 驱动器并引导电脑进入光盘。熟悉虚拟化技术的客户端（例如 `VMware''s Player` 或 `Oracle''s Virtual
