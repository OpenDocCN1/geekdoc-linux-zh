  trans: "\nMetasploitable2 是一个预先配置好且易于使用的虚拟机。考虑到本节后续讨论的许多应用程序都可以在 `Metasploitable2`\
    \ 虚拟机上运行，因此它也是构建虚拟化实验室的一个非常好的入门阶段。\n\n## 介绍 Metasploitable2\n\n打开浏览器并访问：`http://sourceforge.net/`。使用搜索栏查找\
    \ `Metasploitable`。在搜索结果中，点击 `Metasploitable2` 的链接。点击 `Download`（下载）获取虚拟机。\n\n\
    将下载内容保存到会被回收区域。如果无法正常打开，请启动 `VirtualBox`。点击 `New`（新建）按钮创建一个虚拟机。\n\n1. 将虚拟机命名为\
    \ `Metasploitable2`，并将 `Type`（类型）设置为：`Linux`。将 `Version`（版本）设置为 `Ubuntu`，点击 `Next`（下一步）。\n\
    2. （在向导之外）将 `Metasploitable2.zip` 文件夹的内容提取到：`C:/clients/%USERNAME%/VirtualBoxVMs/Metasploitable2/`。\n\
    3. （回到 VirtualBox 向导）为虚拟机设置内存大小。点击 `Next` 继续。`512 MB` 的 `RAM` 应该足够了；如有必要可以更改大小。\n\
    \n选择“使用现有的虚拟硬盘文件”（Utilize a current virtual hard drive document）。使用 `Browse`（浏览）选择：`c:/clients/%USERNAME%/VirtualBox\
    \ VMs/Metasploitable2/Metasploitable.vmdk` 文件。点击 `Create`（创建）继续；**不要**现在启动虚拟机。\n\
    \n选择该虚拟机，点击 `Settings`（设置）按钮。从左侧菜单中点击 `General`（通用）。然后选择 `Advanced`（高级）选项卡。将 `Shared\
    \ Clipboard`（共享贴板）设置为：`Bidirectional`（双向），并将 `Drag'n'Drop`（拖放）设置为：`Bidirectional`（双向）。从左侧菜单中选择\
    \ `Network`（网络）按钮，并将 `Attached to`（连接到）更改为`Host-only`（仅主机模式）。点击 `OK` 保存更改。\n\n\
    选择 `Metasploitable2` 虚拟机，点击顶部的 `Start`（启动）按钮。使用默认凭据登录 `Metasploitable2`：\n- **Username**：`msfadmin`\n\
    - **Secret phrase**：`msfadmin`\n\n首先要注意的是，它没有图形界面（GUI）。`Metasploitable` 并不是设计用于攻击阶段。目前登录\
    \ `Metasploitable` 的目的是确认其可用性并确定其 IP 地址，以便以后可以使用 `Kali Linux` 进行攻击。\n\n检查分配给虚拟机的\
    \ IP 地址：\na. 输入：`ifconfig`\nb. 通常情况下 `VirtualBox` 的 `DHCP` 服务器分配的 IP 以 `192.168.56.x`\
    \ 开始。假设为 `192.168.56.101`。\n\n启动之前创建的 `Kali-Linux-LiveDisc` 虚拟机。登录 `Kali` 后，打开\
    \ `IceWeasel`（Kali 默认浏览器）并访问 `Metasploitable2` 机的 IP 地址。\n\n## 扩展你的实验室\n\n通过 `Metasploitable2`\
    \ 项目，学习者获得的不仅仅是一个可以攻击的无用机器，而是一个通往不同准备领域的门户。虚拟机本身通常无法防御远程和本地攻击；`Metasploitable`\
    \ 附带了 Web 管理器。\n\n1. **phpMyAdmin**——通过 Web 界面管理 `SQL` 并不简单，但 `phpMyAdmin` 是一个用\
    \ `PHP` 编写的免费 Web 应用程序，改进了与 Web 服务器相关的 `MySQL` 数据库的管理。可以通过 `phpMyAdmin` 直接访问 `MySQL`\
    \ 数据库，这对于渗透测试人员和程序员来说是一个极人的目标。\n   更多信息：`http://www.phpmyadmin.net/`\n\n2. **Mutillidae**（读作\
    \ mut-till-I-day）是 `OWASP` 的一个开源项目，旨在帮助安全专家和学生建立 Web 应用攻击技能。`Mutillidae` 是一个非常有用的准备工具，拥有庞大的网络支持并不断更新。它自然出现在\
    \ `Metasploitable2`、`SamuraiWTF` 和 `OWASP Broken Web Apps (BWA)` 中。\nJeremy Drunin（在安全社区又被称为\
    \ `webpwnized`）在 YouTube 上上传了许多关于 `Mutillidae` 的教程视频。随 `Metasploitable` 自带的版本已经过时，且缺乏更具挑战性的内容。从\
    \ `Sourceforge` 项目页面下载最新版本的 `Mutillidae` 并将其传输到 `Metasploitable2` 的 `/var/www`\
    \ 目录以获取更新。\n   更多信息：`http://sourceforge.net/ventures/mutillidae/` ; `http://www.youtube.com/client/webpwnized`\n\
    \n3. **WebDAV**——网站管理员和主席可能需要更改网站内容。`WebDAV` 是 `HTTP` 协议族的扩展，允许远程更改网站。`WebDAV`\
    \ 使用用户名和密码组合管理账户访问。如果没有验证 `WebDAV` 设置，攻击者可能会破坏网站、传输恶意文件，并将 Web 服务器用于其他恶意目的。\n\
    \   更多信息：`http://www.webdav.org/`\n\n4. **DVWA**——`Damn Vulnerable Web App` 是另一个供安全专家、教育者、学生和分析师学习\
    \ Web 应用安全的准备阶段，正如其名，它极其毫无防备。\n   更多信息：`http://www.dvwa.co.uk` | `http://sourceforge.net/ventures/dvwa`\n\
    \n5. **Tiki**——一个项目级的 Web 2.0 应用 wiki 和协作 Web 前端。`Tiki` 非常强大，已经出现了许多比 `Metasploitable`\
    \ 中更多的版本。`Metasploitable` 自带版本中的漏洞数量令人惊叹。`Tiki` 将为渗透测试人员提供关于攻击 Web 2.0 应用方法的更重要视角。`Tiki`\
    \ 的当前版本已被 `Yahoo!`、`Nokia` 和 `Disney` 等企业巨头使用。\n   更多信息：`http://twiki.org`\n\n\
    上述所有应用运行在 `Apache` Web 服务器上。任何放入 `/var/www` 的组织或网站都可以通过 `Metasploitable2` 虚拟机的\
    \ Web 界面访问。有很多像 `Mutillidae` 和 `DVWA` 这样的准备包，有助于完善和练习渗透测试者的技能范围。此外，这些准备程序仍在更新；`Metasploitable`\
    \ 从未打算在重大发布之间进行更新。将包添加到 `Metasploitable` 虚拟机需要时间，尽管存在困难，但努力是值得的。作为一个可重复的模型，请执行以下步骤向虚拟机的\
    \ Web 服务器添加包。\n\n## 魔法代码彩虹\n\nDan Crowley 是数据安全爱好者和 `Trustwave` 的自由科学家，他构建并生成了著名的准备套件。他的准备程序易于探索，并配有不同的测试级别。他最大的作品是将\
    \ Web 教程整合为一个高级剧本：`The Magical Code Rainbow (MCIR)`。`MCIR` 包含：\n\n- `SQLol`——一个\
    \ SQL 注入准备阶段，专注于空白字符和序列的自定义，基于测试的阶段来准备和破坏 SQL 攻击。\n- `XMLmao`——与 `SQLol` 类似，`XMLmao`\
    \ 是可配置的 XML 注入准备环境。\n- `Shellol`——用于命令注入的可配置框架准备环境。\n- `XSSmh`——跨站脚本准备设备。\n- `CryptOMG`——与\
    \ `Andrew` 合作开发，是一个可配置的捕捉风格 Web 应用，旨在滥用加密中的基本漏洞。更多信息：`https://github.com/SpiderLabs/MCIR`\n\
    \n## MCIR 的建立\n\n打开 `VirtualBox`，选择 `Metasploitable2` 虚拟机，点击菜单栏上的 `Settings` 按钮（即使在机器运行时也可以这样做）。选择左侧的\
