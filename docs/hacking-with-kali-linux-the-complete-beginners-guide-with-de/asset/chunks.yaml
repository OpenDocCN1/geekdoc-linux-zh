    ### Google 黑客 (Google Hacking)

    Google 黑客是一种由 Johnny Long 发起的方法，它利用互联网搜索中特定的 Google 运算符和术语，通过 Google 爬虫返回重要数据。该策略专注于利用专门的表述来在
    Google 数据库中搜索有关个人和组织的信息。此过程对 Google 搜索进行了表示并增强了其结果。Google 黑客利用引导的运算符和连接选项创建可以在
    Google 爬虫中运行的针对性问题。已经写了一些优秀的书籍完全解释了 Google 黑客，最著名的是 Johnny Long 编写由 Syngress 出版的《Google
    Hacking for Penetration Testers》。


    ### Google 黑客数据库 (Google Hacking Database)

    大量的 Google 黑客查询字符串已汇集到 Google 黑客数据库 (GHDB)。第一个数据库位于 `http://www.hackersfor.org/ghdb/`，Offensive
    Security 同样在 `http://www.offensive-security.com/network/google-hacking-database/`
    拥有 GHDB，开发了第一个数据库，并产生了“Googorks”这一名称。由 Offensive Security 维护的 GHDB 包含超过 3350 个
    Google Hacks。超过 160 个这些查询字符串对于发现包含密码的文档非常有用。在编写时，可以使用以下命令来尝试发现密码：


    ```

    "password" -intext:the

    ```

    运行此搜索返回了近百万结果。考虑到返回结果中的部分可能包含真实密码，这些查询字符串对于发现包含密码的文档非常有用。


