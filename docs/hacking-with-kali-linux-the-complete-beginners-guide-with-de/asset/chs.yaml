- "# Kali Linux 攻击：初学者指南，通过无线网络攻击与渗透测试的详细实践示例，全面理解计算机网络安全基础\n\n\n\n\n\n为了全面理解计算机网络安全的基础，请深度学习黑客技术\n\
  \n\n\n\n\n\n\n\n\n# 演示/介绍 \n\nKali Linux 是全球知名的渗透测试平台，被安全专家广泛应用于各个领域，包括渗透测试、犯罪现场调查、侦测和漏洞评估。它是长期完善的结晶，是平台持续开发的成果，从\
  \ `WHoppiX` 到 `WHAX`，再到 `Back Track`，现在是一个利用 `Debian GNU/Linux` 许多特性以及全球动态开源网络的全面渗透测试框架。Kali\
  \ Linux 的创建并不是为了成为一个基础工具集，而是一个让专业渗透分析师、安全爱好者、学生和新手可以修改以适应其特定需求的灵活框架。\n\n## 为什么选择这本书？\n\
  \nKali Linux 不仅仅是基于标准 `Debian` 基础之上引入并预先配置以便让你立即上手的不同数据安全工具集合。要充分利用 Kali，关键在于深入理解其强大的\
  \ `Debian GNU/Linux` 底层（这些底层支持那每一项卓越工具）并弄清楚如何部署它们来为你服务。尽管 Kali 显然是多用途的，但它基本上是为了辅助渗透测试设计的。\n\
  \n本书的目的不是为了让你在使用用 Kali Linux 时感到自在。而是为了帮助提高你的理解并简化你的体验，以便当你忙于渗透测试且时间紧迫时，你不必为为浪费宝贵的分钟去安装新程序或启用另一个系统管理功能而感到压力。在书中，我们将首先让你熟悉\
  \ `Linux`。之后，我们将进一步深入，带你熟悉 Kali 的细节。通过 `Linux` 让你确切知道引擎内部发生了什么。拥有这些信息非常重要，特别是当你试图在紧迫的时间限制下工作时。在设置环境、调查问题、努力让某个工具听你调遣、解析设备输出或在更大规模的状况中使用\
  \ Kali 时，需要这些信息并不是什么不寻常的。\n\n## 这本书适合你吗？\n\n如果你渴望进入智力丰富且极具趣味的数据安全领域，并合合理地选择了 Kali\
  \ Linux 作为一项核心平台，那么这本书将在你的旅程中提供帮助。它是为首次使用 `Linux` 的用户以及试图加深对 Kali 底层理解的 Kali 用户编写的。它也是为那些已经使用\
  \ Kali 很长时间，但希望规范自己的学习、增加对 Kali 的利用并弥补知识漏洞的人而准备的。此外，这本书对于寻求 Kali Linux 认证专业人员认证的人来说，可以作为指南、专门参考和学习帮助。\n\
  \n# 术语 \n\n在审查渗透测试时，经常会用到各种基础术语。不同的职业、特定的声誉甚至来自同一小组的人对该领域使用的术语理解可能略有不同。因此，书中将使用以下术语及相关定义。\n\
  \n## 渗透测试，Pentesting\n\n渗透测试是分析师在特定且经过许可的规则内采用的方法、程序和技术，试图绕过数据框架防护，包括克服该框架的协调安全特性。这种测试与评估框架的技术、法规和操作设置及控制有关。定期的渗透测试仅评估数据框架本身的安全性。目标系统的管理员和工作人员可能会意识到正在进行渗透测试。\n\
  \n## 红队，Red Teaming\n\n红队在程序和方法上模拟潜在的敌人。这些小组通常比渗透测试小组更大，拥有更丰富的经验。渗透测试本身通常是红队演习（Red\
  \ Team Exercise）的一个子部分，但这些活动测试的是组织安全防御的不同要素。红队经常通过技术、社交和物理方法攻击组织。他们经常使用与黑客（Black\
  \ Hat Hackers）类似的程序，以测试组织或数据框架防御这些敌对角色的能力。除了渗透测试外，红队还将执行社会工程攻击，包括网络钓鱼、鱼叉式钓鱼以及物理攻击（如翻垃圾桶和开锁），以获取数据和访问权限。总的来说，目标组织的员工不会意识到正在进行红队演习。\n\
  \n## 道德黑客\n\n道德黑客是专业的渗透分析师，为了框架所有者或拥有数据框架的利益而攻击框架。对于本书的目的来说，道德破解与渗透测试同义。\n\n## 白帽\n\
  \n白帽（White Hat）是道德黑客或电脑安全专业人士的俚语，他们相信能够提高数据框架安全的哲学。\n\n## 黑帽\n\n黑帽是一个区分那些利用特殊方法在未经许可的情况下绕过框架安全以实施不道德行为的术语。渗透测试人员和红队人员经常利用黑帽使用的策略，在执行授权的活动或测试时模拟这些人。黑帽在未经授权和非法的情况下进行其活动。黑帽指的是一个处于白帽和黑帽界限之间的特殊大师。这些人经常尝试在未经许可的情况下绕过数据框架的安全特性，不是为了利益而是为了让框架管理员意识到发现的缺陷。黑帽通常没有权限测试框架，但通常并不追逐金钱奖励。\n\
  \n## 漏洞分析，Vulnerability Analysis\n\n漏洞分析被用于评估数据框架的安全设置。此类评估包括对应用在框架中以及框架中缺失的安全补丁进行评估。漏洞分析团队（`VAT`）可以位于数据框架之外，也可以是框架支持人员的一部分。\n\
  \n## 安全控制评估\n\n安全控制评估衡量数据框架与特定法律或行政要求的一致性。这些要求的示例包括但不限于联邦信息安全管理法案（`FISMA`）、支付卡行业（`PCI`）和健康保险流通与责任法案（`HIPAA`）。安全控制评估被用作组织批准数据框架在生成环境中运行的证据（BOEE\
  \ 的一部分。某些框架要求渗透测试作为安全控制评估的一个方面。\n\n## 恶意用户测试，Malicious User Testing\n\n在恶意用户测试中，评估者接受充当具有恶意的内部人员、怀有恶意的客户或滥用者的工作。在这些测试中，评估者被赋予已批准的普通用户或经理客户的身份，通常作为测试账户。评估者将利用这些凭证尝试绕过安全限制，回想起看到过的框架未获批准的文档和设置，更改不应更改的设置，并将自己的权限提升到框架本应有的水平。恶意客户测试重现了叛徒内部人员的活动。\n\
  \n## 社会工程学\n\n社会工程攻击通常对数据框架或客户是有害的。社会工程师利用个人帮助他人的天然需求来获取利益。\n\n\n\n\n在安装之前。在编写本书时，可以从\
  \ [`www.kali.org/downloads/`](http://www.kali.org/downloads/) 下载 Kali Linux。尖端任务、设计和特殊用例的也可以在\
  \ Kali 的官方网站 [`www.kali.org/official-documentation/`](http://www.kali.org/official-documentation/)\
  \ 上找到。同样，还有一个庞大且活跃的网络，用户可以在那里发布问题并帮助他人应对挑战。建议在该网站注册以访问由 Kali Linux 创建者 Hostile Security\
  \ 管理的社区公告。Hostile Security 还会发布有关更新和网络数据的消息。\n\n请确保选择正确的版本（`i386 5 32-bit`、`amd64\
  \ 5 64-bit`）。Kali Linux 的受信任镜像不在本书的涵盖范围内。如果你想熟悉 Kali，或者需要一个用于深度控制的沙盒域，那么 `VMware`\
  \ 下载是这些情况的理想选择。点击合适的下载链接继续。\n\n对于 Microsoft Windows 7 用户，双击下载好的文件，将弹出 `Burn ISO\
  \ Wizard`。按照提示完成从 ISO 镜像到可用于安装的 DVD 的转换。Linux 用户应使用适当的光盘刻录程序打开 ISO，例如 `K3b`。\n\n\
  # 硬盘安装\n\n后续章节将提供一个易于操作的文本和图形化安装向。为了有效地将 Kali 引入系统硬盘，甚至从实时光盘系统启动，将基本输入输出系统 (`BIOS`）设置为从光驱启动至关重要。要开始安装，将\
  \ `CD` 放入电脑的 `CD` 驱动器并引导电脑进入光盘。熟悉虚拟化技术的客户端（例如 `VMware's Player` 或 `Oracle's Virtual\
  \ box`）也将直接支持并引导本指南创建 Kali Linux 的虚拟版本。\n\n使用引导到 Kali Linux 光盘的电脑启动 Kali，将显示一个如图所示的屏幕。本指南使用的\
  \ Kali Linux 版本为 `1.0.5 64-Bit`；不同时期下载的版本可能略有不同；尽管如此，图形化安装的本质是非常相似的。每个版本的 Kali Linux\
  \ 的更新指南可以在 [`www.kali.org/`](http://www.kali.org/) 找到，强烈建议在安装前或如有疑问访问该网站获取你版本的最新文档。\n\
  \nKali Linux 以“Live CD”（也称为 Live ISO）的形式发布，这意味着操作系统可以在不安装到硬盘的情况下直接从光盘运行。从实时光盘运行\
  \ Kali 可以确保系统正常运行且所有工具都将执行；然而，显示的操作系统是非持久的。*非持久*意味着一旦关闭电脑，任何内存、保存的设置、文件以及可能重要的工作或研究成果都可能会丢失。在非持久状态下运行\
  \ Kali 需要非凡的关注、熟练的操作以及良好的理解。\n\n## 安装—设置默认值\n\n后续屏幕将允许选择操作系统的默认语言、区域和控制台语言。选择合适的设置并继续。当电脑开始准备\
  \ Kali 的安装时，屏幕上会出现不同的进度条。对于大多数屏幕，选择默认设置是合适的。\n\n## 安装—初始网络设置\n\n图中显示了基本接口的底层布局和基础设置。通过在框中输入主机名并点击继续。主机名应该是唯一的，因为与具有相似系统的电脑连接可能会导致系统之间产生冲突。对于本指南，FQDN（完全限定域名）被特意留空，可以通过点击继续按钮来跳过。\n\
  \n## 密码\n\n向导的后续提示将要求输入根用户密码。无论如何，必须选择另一个包含以下所有内容的密钥：大写字母、小写字母、数字和符号。密码对用户来说应该是不可识别的且不易被破解的。建议密码至少为\
  \ 10 个字符。例如，如果用户曾经打过中学足球，就不建议使用 `soccer22` 这样的密码。可以使用各种基本表达式生成密码进行检查。以下是几个强密码的示例：\n\
  \n`St0n(3)b@tt73` (石之大战)\n`P@p3r0kCur5#` (纸、石、诅咒)\n`m!gh7yP@jjjama% h` (强力睡裤)\n\n\
  在输入密码时，它将以圆点形式显示。这是正常现象，可以防止密码显示在电脑屏幕上。在两次输入相同的强密码后，点击继续继续进入程序。\n\n## 设置系统时钟\n\n\
  设置系统时钟会显示选择时区的提示。点击合适的时区和继续按钮。\n\n## 分配磁盘\n\n在设置 Linux 操作系统时，分配分区的方法多到可以就这个主题写一本书。本指南将专注于最核心的安装：引导式分区。一些图片显示了最初介绍默认设置。在出现特定的图表之前将没有可供选择。现在，可以通过点击“继续”来加速安装，直到分配完成。审阅安装向导的每一步都是明智的。一些图片显示了安装期间划分硬盘的不同选项。`LVM`（逻辑卷管理）不建议用于工作站、优盘或\
  \ SD 卡的安装。`LVM` 用于多个硬盘，并专门推荐给高级用户使用。应选择“引导—使用整个磁盘”。点击\n\n\n\n\n\n点击 `Continue` 继续执行安装程序。图中显示了为安装而选择的硬盘。根据你的设备和\
  \ Kali Linux 的类型，安装体验可能会略有不同。\n\n将选择该硬盘；如果需要，请点击 `Continue` 按钮继续执行安装程序。\n\n由于本书是为\
  \ Kali Linux 发行版的新用户设计的：“All records in a single parcel（建议新用户使用）”是最佳选择并应当选择此项。点击\
  \ `Continue` 按钮继续执行安装程序。\n\n在安装向导的这一步，分区设置已完成并显示出来供您查阅。一个包含整个框架、客户端和脚本文档的核心分区将被合并为一个段。随后的一个段将用于交换空间（swap\
  \ space）。\n\n交换区是虚拟内存，它在 PC 的中央处理单元（`CPU`）和随机访问存储器（`RAM`）之间进行记录交换。所有 Linux 框架都建议设置交换分区，通常做法是将交换分区的大小设置为与\
  \ PC 物理 RAM 等等或其一点五倍。\n\n如图所示，系统将为你选择“Get done with parceling and compose changes\
  \ to circle”。点击 `Continue` 继续执行安装程序。\n\n某些图表是在提交硬盘配置之前对分区的最后检查。如果需要，以后可以通过方法更改分区估值，但如果操作不准确，可能会对你的工作框架造成巨大损害。向导中的这段简要提示是提醒你将将信息写入预定义的硬盘中\n\
  \n\n\n\n最近表征的分区表。选择 `YES` 并点击 `Continue` 继续完成安装程序。在向导分区区域的最后一个简要说明中点击 `Continue`\
  \ 后，硬盘分区将开始。图 A 显示当前正在进行实际安装。根据你所拥有的设备，此过程可能只需要几分钟，也可能一小时或更长时间。\n\n## 配置软件包管理器\n\
  软件包管理器是工作框架配置中至关重要的一部分。软件包管理器指的是 `Kali Linux` 获取更新和安全补丁的存储库。建议使用随 `Kali Linux` ISO\
  \ 提供的系统镜像，因为这将是软件包执行程序的最新源。图中显示将选择“`YES`”。点击 `Continue` 按钮继续完成安装程序。如果使用中间代理，请根据向导中的以下后续简要说明输入相应的配置数据，或将其留空。点击\
  \ `Continue`。\n\n## 引入 GRUB 加载程序\n大统一引导加载程序 (`GRUB`) 是每次 PC 启动时将显示的主屏幕。这允许在启动时检查特定设置、进行实时更改，并在工作框架加载之前修改设置。虽然\
  \ `GRUB` 对于某些驱动的客户端并非必需，但对于大多数安装类型都强烈建议使用。点击“`YES`”以引入 `GRUB`，然后点击 Continue。\n\n\
  ## 完成安装\n现在从 PC 上移除光盘并重启。当出现提示时，请执行相应操作，然后点击 `Continue` 按钮完成安装。重启后，将显示欢迎屏幕。使用安装过程中早早定义的预密码以\
  \ `root` 用户身份登录。欢迎使用 `Kali Linux`！\n\n## 优盘安装\nUSB 内存设备（通常称为优盘）是通过 `USB` 接口连接到 PC\
  \ 的简单容量设备。本书建议使用具有至少 8GB 空间的 `USB` 设备，理想情况下空间更大。新 PC 可以从 `USB` 设备启动。如果选择此选项，请确保所使用的\
  \ PC 支持从 `USB` 设备启动。\n\n后续章节将介绍如何在 Microsoft Windows PC 或 Linux 阶段在 USB 盘上安装 `Kali\
  \ Linux`。请务必检查 Kali Linux 官方登录页上提供的文档，以获取此程序的更新。\n\n关于将优盘作为启动设备使用，有两个关键术语非常：`持久性\
  \ (persistence)` 和 `非持久性 (non-persistence)`。`持久性` 指你的设备在关机后保留任何已写入或修改记录的能力。`非持久性`\
  \ 指设备在重启或关机后丢失所有设置、自定义内容和记录。特别对于本书而言，从 Windows 阶段安装的 `Kali Linux` 优盘将是非持久性的，而从 Linux\
  \ 阶段安装将是持久性的。\n\n### Windows（非持久性）\n所需应用程序——`Win32 Disk Imager`：http://sourceforge.net/ventures/win32diskimager/\n\
  \n在下载 `Kali Linux ISO` 之前，将优盘插入 PC 并等待 Windows 识别它，观察分配的驱动器号。接下来打开 `Win32 Disk Imager`。点击信封图标浏览并选择\
  \ `Kali ISO` 文件，然后点击“确定”按钮。从设备下拉菜单中选择正确的驱动器号。最后点击“Start”按钮。\n\n当 `Win32 Disk Imager`\
  \ 完成写入 ISO 后，重启 PC 并在 BIOS POST 菜单中选择优盘。大多数制造商都有从 USB 设备启动的各种策略；请务必检查 PC 制造商的文档。\n\
  \n### Linux（持久性）\n在构建持久性优盘时，再次强调大小确实很重要！优盘容量越大越好。此外，取决于你组装此 USB 设备的 Linux 版本，确保已安装应用程序\
  \ `GParted`。如果你在安装 `GParted` 时遇到问题，请检查工作框架的文档。如果未安装 `GParted`，以下技术之一可能对你的 Linux\
  \ 安装有效：\n- sudo apt install gparted\n- yum install gparted\n- `yum` install gparted\n\
  \n下载 `Kali Linux ISO` 后，插入你的优盘。打开终端窗口并确认 USB 设备位于以下路径。\n\n```bash\nmount | grep\
  \ -I udisks | awk '{print $1}'\n```\n显示命令输出为 `/dev/sdb1`。USB 设备的输出可能根据 PC 设置和设计而异。按顺序，将\
  \ \"sdb\" 替换为正确的标识符并删除结尾的数字。使用 `dd` 命令将 Kali ISO 镜像移动到 USB 设备。\n\n```bash\ndd if=kali_linux_image.iso\
  \ of=/dev/sdb bs=4K status=progress\n```\n现在启动 `Gparted`。`gparted /dev/sdb`。该驱动器现在应该有一个刚刚写入的\
  \ Kali 镜像的分区。\n\n通过在“File”菜单栏中点击“Partition”菜单并选择“New”，为 USB 添加另一个分区。不同设备制造商的输出略有不同。总之，方法如下：\n\
  - 点击灰色的“unallocated”（未分配）空间。\n- 从 Partition 下拉菜单点击“New”。\n- 使用滑块或物理确定驱动器大小。\n- 将文件系统设置为\
  \ `ext4`。\n- 点击“Add”。\n- 在主窗口中，从“Edit”下拉菜单选择“Apply All Operations”。\n- 提示时点击“OK”。这可能需要一些时间。\n\
  \n要包含持久功能，请使用以下命令。\n\n```bash\nmkdir /mnt/usb\nmount /dev/sdb2 /mnt/usb\necho \"\
  /persistence..\" > /mnt/usb/persistence.conf\numount /mnt/usb\n```\nLiveUSB 的创建现已完成。重启\
  \ PC 并从优盘启动。\n\n### SD 卡安装\n微型设备，例如 Raspberry Pi 和 Google 的 Chrome Notebook，适用于\
  \ SD 卡上运行。这些小型设备可以用于许多用途；受限于个人的想象力。这些设备（例如 Raspberry Pi）的优点是它们价格廉 way，并且在开源社区中非常受欢迎，使各地的爱好者能够快速获得资源。\n\
  \n在 ARM 设备上引入 Kali Linux 有一个缺点；镜是定制的，必须为每种硬件进行说明。\nARM 设备的镜像可以在 Kali 官方下载页面上找到：[`www.kali.org/downloads/`](http://www.kali.org/downloads/)。检查你的设备是否有可下载的支持的镜像。\n\
  \n以下是向良好的 ARM 工程型设备引入 Kali Linux 的简要指南：\n1. 从 Kali 官方网站下载合适的镜像 ([`www.kali.org/downloads/`](http://www.kali.org/downloads/))。\n\
  2. 插入空白 SD 卡。使用以下命令确认挂载区域。\n```bash\nmount | grep -I vfat (假设后续阶段为 /dev/sdb)\n```\n\
  3. 将 `kali.img` 文件移动到 SD 卡。\n```bash\ndd if=kali.img of=/dev/sdb bs=4K status=progress\n\
  ```\n4. 在提取设备之前，卸载并同步任何写入任务。\n```bash\numount /dev/sdb sync\n```\n5. 拔出 SD 卡。\n\
  6. 将包含 Kali Linux 镜像的 SD 卡插入你的 ARM 工程计算设备并从 SD 卡启动。\n\n在本节中，涵盖的主题允许用户将 Kali Linux\
  \ 引入大多数 PC、工作站、优盘和小型计算设备。引入 Kali Linux 就像骑自行车；做一次，你以后通常永远不会忘记如何引入 Kali。查看 Kali 官方网站上的文档和网络消息公告，以获取安全网络中开发的最新更新、版本和进展。与其他安全专家、专家和程序员建立联系并协作，可以并且能够扩展视野，帮助你更深入地探索新任务，并在可能时帮助解答问题。\n\
  \n## 编程、补丁与升级\n本章包含内容：\n- APT 软件包处理工具\n- Debian 软件包管理器\n- Tar 包 (Tar-balls)\n- 安装\
  \ Nessus 实用指南\n\n章节概述和核心学习要点 - 这部分将探索用于查看的重要程序\n\n### APT 软件包处理工具\nAPT 软件包处理工具（称为\
  \ `apt-get`）是一个命令行工具，用于从基于 Debian 的系统中安装、配置和删除软件包。它是 Kali Linux 工具库中最强大的工具之一。\n\n\
  ### Debian 软件包管理器\nDebian 软件包管理器 `dpkg` 是用于安装 `.deb` 文件的低级工具。它被 `apt` 使用，但提供了更细粒度的控制。\n\
  \n### Tar 包\nTar 包包含一个或多个文件和目录的归档文件。它们通常用于在 Linux 环境中分发软件。\n\n### 安装 Nessus 实用指南\n\
  本节提供了安装 Nessus 漏洞扫描器的详细指南。\n\n\n\n将应用恢复到清晰状态并开始\n\n\n\n\n再次，或者清除所有可能的敏感数据痕迹。从框架中清理应用程序将一次性彻底根除应用程序包和所有相关的设置记录。在使用\
  \ `cleanse` 工作时要小心，不要太粗大意；当使用不当或在不适当的程序上时，它是危险的，因为所有相关的记录都将从框架中驱逐。\n\n`cleanse`\
  \ 可以配合以下语言结构使用：`well-suited get cleanse {package_name}`。`CleanBundles` 会从源头下载到框架、解包，然后引入。这些包将留在框架中，直到另有通知。在应用程序建立后，这些包不再是基础的。一段时间后，这些包可能会占用磁盘空间并应该被清理。\n\
  \n可以使用随后的语言结构来启动完美能力：`able get spotlessAutoclean`。`Autocleaning` 还会作为完美能力沿着这些线路额外清理框架。它应该用于维护和向框架的升级，因为\
  \ `autoclean` 能力将清除被新包取代的旧包。\n\n例如，假设应用程序 `Y form 1` 已引入框架，在向框架升级后，应用程序 `Y v1` 被应用程序\
  \ `Y v2` 取代。`autoclean` 能力将清理 `form 1`，而完美能力将驱逐这两个版本的应用程序包。接的语言结构将启动 `autoclean`\
  \ 工作：`adept get autocleanAssembling`。\n\n### 组织\n包的组织与更高效的工作密切相关。以下是客户端可以使用的相关指令，以确保所有可能的修复、包和更新都是前瞻性的且准备就绪的：\n\
  \n1. `well-suited get update && adept get redesign && well-suited get dist-overhaul`\n\
  2. `well-suited get autoremove && adept get autoclean`\n\n命令行行上的 `&&` 路径考虑了连续运行多个指令。\n\
  \n### Debian 软件包管理器\nLinux 的主要版本（或发行版）拥有独特的应用程序包框架。Kali Linux 基于 `Debian 7.0` 基础工作框架，并可能需要外部应用程序，例如\
  \ Tenable 的 `Nessus`。`Nessus` 是一个漏洞检查应用程序，可以从适用于 `Debian Package Manager` 的预包文档中引入。`Nessus`\
  \ 的使用将在检查章节中探讨。在下载此类程序时，请寻找文件名结尾的 `.deb` 扩展。\n\n使用 `Debian Package Manager` 相比 `APT`\
  \ 并没有优势。`aptget` 程序专门为管理 Debian 包而编写。必须从供应商购买的外部程序无法免费访问，且 `well-suited gets sources`\
  \ 将无法找到下载和安装包。Kali Linux 在不引入额外产品的情况下无法处理 `RPM`（Red Hat 包），且不建议在基于 Debian 的框架上使用\
  \ `RPMs`。\n\n#### 引入\n在下载 `.deb` 包后，应使用 `dpkg` 指令来引入包。大多数 `.deb` 包都是清晰的，并包含了应用程序有效运行所需的全部条件。在某些情况下，特别是对于管理授权软件，供应商可能在安装之前需要额外的步骤，并通常会有关于在框架上适当安装的指南。在开始安装之前务必检查卖者的文档：\n\
  \n```\ndpkg - I {package_name.deb}/{target_directory}\n```\n\n#### 驱逐\n驱逐包（`- r`）或清理包（`-\
  \ P`）的工作方式与 `APT` 通常相同，并遵循处理包的类似示例：\n```\ndpkg - r {package_name.deb}\n```\n使用 Debian\
  \ 包管理器清理包与 `evac` 能力类似，并可以通过随后的指令启动：\n```\ndpkg - p {package_name.deb}\n```\n\n\
  #### 检查已安装的包\n`APT` 相比 `Debian Package Manager` 的一个超能力是解析已引入或驱逐程序的当前状态的能力。在使用 `dpkg`\
  \ 内部的 `rundown` 工作时，输出将在行开头显示几个字符代码表明包的当前安装状态。当针对 `Leaf cushion` 应用程序包运行时，如下所示显示该包已被驱逐，但配置文档仍然可用。\n\
  \n运行指令 `dpkg - P leafpad` 后，该包的配置文档也被驱逐。图 3.2 显示了 Leafpad 应用程序包从框架中完全清理后的对比输出。要搜索已引入或驱逐程序的状态，请使用此语言结构：\n\
  ```\ndpkg - l {package_name}\n```\n\n### TAR 包\nTar 始于 Unix 框架的早期时代，其名称源于它的功能，最初是为了将多个文档组合到磁带存档\
  \ (`TAR`)。并不是每个人都需要将各种记录移动到磁带的能力。然而，他们可能需要 `tar` 程序的特性功能，即产生一个容纳不同文档的容器文档。这使得文档传输更加简单。此外，这些文档可以使用\
  \ `gunzip (gzip)` 压缩以减小它们的总体大小。来自外部或开源活动的某些包可以 tarball 格式下载，并通过 `.tar` 扩展名或压缩 tar\
  \ 包的 `.tar.gz` 有效区分。\n\n在渗透测试期间，会捕捉大量的过滤存档、屏幕截图、重做内容和客户文档。使用 `Tarball` 框架考虑了更简单的分类、归档和支付，一切都是平等的。特别建议将所有渗透测试的记录在受保护区域保留\
  \ 5 年，或者执行工作所在地法律时限规定的日期。客户可能还对维护要求有规定，这些规定应在渗透测试的承诺规则 (ROE) 中说明。`ROE` 将将在章节中探讨。如果一个组织或合同工人在渗透测试方面非常活跃，文档量可能会迅速积累并很快变得失控。`Tarball`\
  \ 特尤其是压缩后，提供了一种控制安排，可以保持记录分离并考虑了更简单的维护和管理。\n\n#### Tar 包的形成\n创建一个 tar 包记录可以是简单的也可以是复杂的。记住，`tar`\
  \ 指令最初的功能旨在将记录发送到 `TAR`。对于 tarball 框架的现代用法，请查看 tarball 的手册页 (`man tarball`)。本书仅将包含\
  \ tarball 记录的基本形成；尽管如此，这些信息是有用的并可以推广到几乎任何基于 Linux 的平台。以下提供了客户端可以创建一个示例 tarball 所需的步骤概述。\n\
  \n1. 为你的文档创建一个索引。在这种情况下，正在使用 `mkdir` 指令创建 `tar-demo1` 目录：\n```\nmkdir tar-demo1\n\
  ```\n2. 接下来在这个索引中创建各种用于描述 `tar` 指令的记录。在这种情况下，将使用正确的胡萝卜（`.`）来创建一个内容为 \"Hi world.\"\
  \ 的记录。该文档将命名为 `record 1`，可以通过更改数字以类似的方式创建若干记录。像这样创建记录也将把你的文档移动到指定的注册中，在此情况下为 `tar-demo1`：\n\
  ```\necho \"Hi World\". tar-demo1/file1\necho \"Hi World\". tar-demo1/record 2\n\
  ```\n3. 进入你想要创建 tarball 的注册。\n```\ncd tar-demo1\n```\n4. 在该注册中创建一个包含所有文件的 tarball。在此情况下，星号（`*`）将指示注册表中的所有内容：\n\
  ```\ntar -cf tarball.demo *\n```\n5. 使用随后的指令列出已创建的 tarball 的内容：\n```\ntar - tf tarball.demo\n\
  ```\n\n\n\n\n```bash\ntar - xf {tarball_file.tar.gz} -C {directory_for_files}\n\
  ```\n\n# NESSUS 安装实用指南\n\nViable 是安全网络领域一个备受推崇的名字，它推出了一款名为 Nessus 的惊人防御过滤应用程序。该应用程序有两个版本，提供不同程度的实用性和支持。它们分别是\
  \ Nessus Professional（专业版）和 Nessus Home（家庭版）。专业版在合规性检查、SCADA 和配置检查方面提供了多得多的模块，非常适合团队使用。对于本书来说，我们将使用带有家庭版馈源建立的\
  \ Nessus 漏洞扫描器。Nessus 将在过滤部分进行详细介绍，但现在介绍 Nessus 将巩固本节的知识。\n\n## 在安装 Nessus 之前刷新并清理系统\n\
  \n在 windows 终端类型中输入以下指令：\n\n```bash\nwell-suited get update && well-suited get redesign\
  \ && able get dist-overhaul able get autoremove && well-suited get autoclean\n```\n\
  \n## 介绍和配置 Nessus\n\n从 [`www.nessus.org/download`](http://www.nessus.org/download)\
  \ 下载 Nessus 5.0 或更高版本。根据 32 位或 64 位工作框架选择 Debian 包。阅读会员协议并点击“同意”（Agree）按钮。如果不接受协议，Nessus\
  \ 将无法工作。请注意文档下载的位置，因为它在完成安装时需要用到。\n\n从终端窗口输入以下内容：\n\n```bash\ndpkg - I B/{Download_Location}/Nessus-{version}.deb\n\
  ```\n\n在附录中可以找到更深入的配置指南，其中介绍了如何使用 Tribal Chicken 建立渗透测试域结构。本节结束时，确保已掌握在 Kali Linux\
  \ 框架上管理软件包执行程序的重要基本技能。APT 是一个创新的命令行工具，实现了软件包管理、更新和修复的自动化。Debian 软件包管理器（`dpkg`）是\
  \ APT 用于软件包执行程序的基础性框架。通过对这些工具的基本理解和通用熟悉，任何人都可以跟上最新的应用程序。\n\n如需本节中工具的高级用法，请在终端窗口内部或通过各自的官方网站查阅手册页。这些工具可以为任何个人产生完美的域名，也可以在没有任何简报或后悔的情况下摧毁整个框架。在用户熟练使用这些工具之前，在不同的框架或虚拟域中进行实操训练是一个非常好的主意。\n\
  \n# 设计 Kali Linux\n\n### 本章数据\n\n使用默认的 Kali Linux 设置对于适应环境有所帮助，但调整关键设置以提高此阶段的利用率通常很重要。\n\
  \n### 部分概述和关键学习点\n\n本部分将澄清：\n* 系统管理的要点\n* 使用图形化 UI 配置组织接口\n* 使用命令行配置组织接口\n* 使用图形化\
  \ UI 配置远程卡\n* 使用命令行配置远程卡\n*  启动、停止和重启 Apache 服务器\n* 引入 FTP 服务器\n* 启动、停止和重启 SSH 服务器\n\
  * 挂载外部媒体\n* 刷新 Kali\n* 重新配置 Kali\n* 包含 Debian 存储\n\n### 关于本章 - 网络\n\n网络是电脑和其他现代电子设备相互通信的方式。这可以被视为设备之间带有规则和要求（协议）的街道、交通规则（规则集和配置）、支持小组（组织管理）、执法部门（组织安全）以及私有街道（防火墙端口和协议限制——同样也是安全的一部分）。在接下来的内容中，将描述系统管理的要素，以及在\
  \ Kali 中正确设计网络应采取的措施。\n\n系统管理是一个复杂的点，本部分仅开始揭示网络。这里引入的解释仅用于概述和披露有效配置 Kali Linux 系统组件所需的各个。要对系统管理有更详尽的理解，请参考\
  \ Michael Gallo 和 William Hancock 编写的第二版《Networking Explained》。本解释将为用户提供对基础系统部分的理解。\n\
  \n## 网络基础\n\n系统管理可以被视为电脑之间电子街道的序列。这些街道可以是物理的，最常见的是 5 类或 6 类铜（`CAT 5` 或 `CAT 6`）链路或光纤链路。远程系统管理利用独特的无线发射器和接收器来引导物理系统之间的各种基础任务。无论介质如何，物理或远程系统管理都有相似的基础部分。首先至少有两个设备将通信，例如，Adam\
  \ 的电脑将与 Bill 的电脑通信。为了实现这一点，他们正确的介质上工作的交换设备。对于这个模型，Adam 将连接与 Bill 连接的相同的物理 `CAT5`\
  \ 基系统。如果设置正确，只要双方的协议和设置正确，Bill 可以使用远程系统卡而 Adam 可以使用有线系统卡。为了让此准确运行，Adam 和 Bill 都应该通过像远程交换机这样的设备连接相同的系统部分，该设备会将有线和无线不同的物理介质类型关联。\n\
  \n由许多部分构成了一个现代网络，完全解释系统管理远超本书的范围。将披露的小系统部分将足以描述如何配置系统卡。这个小系统只是 Adam 和 Bill 使用的两台电脑、一个连接到链路调制解调器的有线交换机以及将一切连接的链路（在本模型中全是\
  \ `CAT5`）。交换机的内部互联网协议（`IP`）地址为 `192.168.1.1`，这对于小型办公（SOHO）和家庭系统的默认设置非常常见。这个小交换机通过其外部连接连接互联网，使用由互联网服务提供商分配的\
  \ IP 地址，这将允许 Adam 和 Bill 在有效配置其系统卡后浏览网页。在这个模型中，交换机还提供了动态主机配置协议（`DHCP`）、关键的防火墙功能和域名管理（`DNS`），这些每一个都将在稍后详细讨论。该系统在图\
  \ 4.3 中所示，并将作为后续所有部分的基础系统。\n\n### 私有地址\n\n交换机的内部接口（或系统卡）的 IP 地址为 `192.168.1.1`；这是所谓的私有位置，因为它不能在互联网上使用。对于图中黑盒所说的内部系统扬点，这与\
  \ `DHCP` 给出的地址是类似的，例如给 Adam 和 Bill 电脑提供的 IP 地址。表格记录了可以用于内部或私有系统的正常私有 IP，但不能在互联网上使用。为了访问互联网，交换机执行称为网络地址转换（`NAT`）的魔法，将\
  \ Adam 和 Bill 使用的 IP 转换为可以在互联网上使用的地址。这通常是数字供应商提供给交换机的地址。\n\n### 默认网关\n\n交换机隔离了这两个系统（内部和外部），并提供了一些基本功能，类似于简单的防火墙。此外，交换机提供了网络出口。因此，交换机的内部接口\
  \ IP 地址为 `192.168.1.1`，即为默认网关。这将在以后设计系统卡时使用。理解默认网关的一种良好方法是将其视为离开城镇的唯一街道。任何离开城镇的人都需要知道这条街道在哪里。\n\
  \n### 名称服务器\n\n电脑使用数字相互通信，而人类对单词更敏感。为了让这有效工作，电脑使用名称服务器（`DNS`）。本书将更详细涵盖 DNS。从根本上，名称服务器将人类名称（如\
  \ `www.google.com`）解释为电脑更好地处理的 IP 地址。\n\n### DHCP\n\n对于未标记的系统功能，没有什么比得上 `DHCP`。对于一台设置了\
  \ DHCP 的电脑，客户端只需连接到工作的链路即可。这是在电脑重启系统时通过，通过向服务器发送请求完成。服务器响应并为客户端分配 IP 地址。这还包括默认网关、名称服务器和其他设置。\n\
  \n### 关键子网划分\n\n子网划分是一个让许多人困惑的主题，因此在书中子网划分可能会被描述为设计网络的最佳方法。通过将子网掩码应用于 IP 地址的一部分来实现。例如，如果\
  \ IP 地址是 `192.168.1.77` 且子网掩码是 `255.255.255.0`，前三个字节代表网络，最后一个字节代表主机。`255.255.255.0`\
  \ 子网掩码将有效，而较大的系统将需要为系统指定的替代子网掩码。\n\n### Kali Linux 默认设置\n\n如之前澄清的，大多数入门工程师和白帽程序员不需要他们的系统卡在连接时报告其在系统上的本质。这正是\
  \ Kali Linux 在配置并与系统连接时将执行的操作。在引导渗透时要小心，在连接之前禁用系统卡以避免这种不必要的通信。\n\n### 本部分将澄清：\n\
  * 系统管理的技术要点\n* 使用图形化 UI 配置组织接口\n* 使用命令行配置组织接口\n* 使用图形化 UI 配置远程卡\n* 使用命令行配置远程卡\n\
  * 启动、停止和重启 Apache 服务器\n* 引入 FTP 服务器\n* 启动、停止和重启 SSH 服务器\n* 挂载外部媒体\n* 刷新 Kali\n*\
  \ 重新配置 Kali\n* 包含 Debian 存储\n\n关于本章 - 网络\n\n网络是电脑和其他现代电子设备相互通信的方式。这可以被视为设备之间带有规则和要求（协议）的街道、交通规则（规则集和配置）、支持小组（组织管理）、执法部门（组织安全）、私有街道（防火墙端口和协议限制——同样也是安全的一部分）。在后续内容中，将描述系统管理的要素，以及在\
  \ Kali 中正确设计网络应采取的措施。\n\n系统管理是一个复杂的点，本部分仅开始揭示网络。这里引入的解释仅用于概述和披露有效配置 Kali Linux 系统组件所需的各个。要对系统管理有更详尽的理解，请参考\
  \ Michael Gallo 和 William Hancock 编写的第二版《Networking Explained》。本解释将为用户提供对基础系统部分的理解。\n\
  \n网络基础\n\n系统管理可以被视为电脑之间电子街道的序列。这些街道可以是物理的，最常见的是 5 类或 6 类（`CAT 5` 或 `CAT 6`）链路或光纤链路。远程系统管理利用独特的无线发射器和接收器来引导物理系统之间的各种基础任务。无论介质如何，物理或远程系统管理都有相似的基础部分。首先至少有两个设备将通信，例如，Adam\
  \ 的电脑将与 Bill 的电脑通信。为了实现这一点，他们需要正确的介质上工作的交换设备。对于这个模型，Adam 将连接与 Bill 连接的相同的物理 `CAT5`\
  \ 基系统。如果设置正确，只要双方的协议和设置正确，Bill 可以使用远程系统卡而 Adam 可以使用有线系统卡。为了让此准确运行，Adam 和 Bill 都应该通过像远程交换机这样的设备连接相同的系统部分，该设备会将有线和无线不同的物理介质类型关联。\n\
  \n许多部分构成了一个现代网络，完全解释系统管理远超本书的范围。将披露的小系统部分将足以描述如何配置系统卡。这个小系统只是 Adam 和 Bill 使用的两台电脑、一个连接到链路调制解调器的有线交换机以及将一切连接的链路（在本模型中全是\
  \ `CAT5`）。交换机的内部互联网协议（`IP`）地址为 `192.168.1.1`，这对于小型办公（SOHO）和家庭系统的默认设置非常常见。这个小交换机通过其外部连接连接互联网，使用由互联网服务提供商分配的\
  \ IP 地址，这将允许 Adam 和 Bill 在有效配置其系统卡后浏览网页。在这个模型中，交换机还提供了动态主机配置协议（`DHCP`）、关键的防火墙功能和域名管理（`DNS`），这些每一个都将在稍后详细讨论。该系统在图\
  \ 4.3 中所示，并将作为后续所有部分的基础系统。\n\n私有地址\n\n交换机的内部接口（或系统卡）的 IP 地址为 `192.168.1.1`；这是所谓的私有位置，因为它不能在互联网上使用。对于图中黑盒所说的内部系统扬点，这与\
  \ `DHCP` 给出的地址是类似的，例如给 Adam 和 Bill 电脑提供的 IP 地址。表格记录了可以用于内部或私有系统的正常私有 IP，但不能在互联网上使用。为了访问互联网，交换机执行称为网络地址转换（`NAT`）的魔法，将\
  \ Adam 和 Bill 使用的 IP 转换为可以在互联网上使用的地址。这通常是数字供应商提供给交换机的地址。\n\n默认网关\n\n交换机隔离了这两个系统（内部和外部），并提供了一些基本功能，类似于简单的防火墙。此外，交换机提供了网络出口。因此，交换机的内部接口\
  \ IP 地址为 `192.168.1.1`，即为默认网关。这将在以后设计系统卡时使用。理解默认网关的一种良好方法是将其视为离开城镇的唯一街道。任何离开城镇的人都需要知道这条街道在哪里。\n\
  \n名称服务器\n\n电脑使用数字相互通信，而人类对单词更敏感。为了让这有效工作，电脑使用名称服务器（`DNS`）。本书将更详细涵盖 DNS。从根本上，名称服务器将人类名称（如\
  \ `www.google.com`）解释为电脑更好地处理的 IP 地址。\n\nDHCP\n\n对于未标记的系统功能，没有什么比得上 `DHCP`。对于一台设置了\
  \ DHCP 的电脑，客户端只需连接到工作的链路即可。这是在电脑重启系统时通过向向服务器发送请求完成。服务器响应并为客户端分配 IP 地址。这还包括默认网关、名称服务器和其他设置。\n\
  \n关键子网划分\n\n子网划分是一个让许多人困惑的主题，因此在书中子网划分可能会被描述为设计网络的最佳方法。这通过将子网掩码应用于 IP 地址的一部分来实现。例如，如果\
  \ IP 地址是 `192.168.1.77` 且子网掩码是 `255.255.255.0`，前三个字节代表网络，最后一个字节代表主机。`255.255.255.0`\
  \ 子网掩码将有效，而较大的系统将需要为系统指定的替代子网掩码。\n\nKali Linux 默认设置\n\n如之前澄清的，大多数入门工程师和白帽程序员不需要他们的系统卡在连接时报告其在系统上的本质。这正是\
  \ Kali Linux 在配置并与系统连接时将执行的操作。在引导渗透时要小心，在连接之前禁用系统卡以避免这种不必要的通信。\n\n\n\n\n\n### 获取更新并重新设计\
  \ KaliLike\n\n通过命令行使用 `able get` 工具，对 Kali 进行焕新和重新设计也是可能的。全面重构。\n\n\n\n\n通常是对应用程序或工作框架本身的重大修改。重构提供了新的功能，并且比更新要大得多，通常需要在框架驱动器上有额外的空间——作为所当然，它包含一个源码仓库。Kali\
  \ 会定期检查存储在自身仓库中的更新和重新设计。这非常有帮助，因为某些更新或重构可能会破坏 Kali 的功能。因此，Offensive Security 的 Kali\
  \ 工程师会在将其添加到官方 Kali 商店之前对其进行测试和重新设计。虽然这通常是值得感谢的，但在使用默认 Kali 应用程序焦点时，某些应用程序是无法使用的。可能会包含额外的仓库；在这种模型下，将包含\
  \ Debian 存档。使用 `nano` 或其他内容管理器打开 `/etc/apt/sources.list.nano` 或 `/etc/apt/sources.list`。打开后，在文件末尾添加以下注释和两行。\n\
  \n# Debian 7 principle\n\n#debian 7 principle（这只是一个注释）\ndeb http://http.us.debian.org/debianstable\
  \ principle contrib without nondeb-srch\ndeb http://http.us.debian.org/debianstable\
  \ principle contrib without non\n\n现在保存文档。在 `nano` 中，通过按住 `Control` 和 `\"O\"` 键来保存记录。按\
  \ `Enter` 键以相同的文档名称保存，然后使用 `Control` 和 `\"X\"` 键退出。这将基础 Debian 库添加到 Kali 用于检查更新或重构的库列表中，并将用于查找要引入的应用程序或包。要完成此更改，使用新存档更新\
  \ Kali。\n\nKali 是一项强大的资产，作为所当然引入了大量设备。对于某些客户来说，使用大量设备并不熟悉，因此这部分确保了成功使用此工具以及许多其他\
  \ Linux 发行版的大量要点。从安排系统界面到添加 FTP 服务器，再到包含另一个仓库以及更新工作框架和应用程序，本节确保了有效使用此工具包必须练习的大量基本任务。维护\
  \ Kali 与其他某些工作框架一样重要，并且应该定期进行，以确保其设备、应用程序和工作框架本身都是最新状态。\n\n## 构建渗透测试实验室\n\n### 本章内容\n\
  * 构建实验室\n* Metasploitable2\n* 扩展你的实验室\n* 魔法的代码注入彩虹\n\n### 章节概述与核心学习点\n本部分将逐步说明如何利用虚拟化来创建渗透测试实验室环境的配置，以及在实验室环境中使用\
  \ VirtualBox 创建 Metasploitable2 阶段。\n\n#### 在阅读本章之前：构建实验室\n个人如何获得机会练习、检查并熟悉滥用程序？建立一个实验室并投入其中吧！\n\
  \n个人如何获得机会练习、检查并熟悉滥用程序？建立一个实验室并投入其中吧！既然互联网随处可用，为什么要制造实验室呢？这是一个基础的问题，答案非常简单，因为没有人需要去监狱。想象测试一个不属于你的系统的后果。攻击政府或金融系统（如银行）可能导致\
  \ 20 年或长时间监。对法律（无论是政府还是州法律）的无知不能作为数字犯罪的理由。要谨慎、要机敏、建立实验室。本节中的活动基于免费获取的学习应用程序和编程。在进入下一部分之前构建实验室是非常明智的。\n\
  \n#### 零成本构建实验室\n在虚拟化时代之前，信息（IT）专家、安全专业人员和学生同样拥有车库、地下室和其他堆满电脑设备的房间。有时，这些电脑和系统管理硬件会从地板堆到天花板，电费贵得惊人。拥有大堆设备是一种折磨；如果你需要搬家，想象一下带走它们有多困难。庆幸现在不是这种情况。\n\
  \n无论你的电脑运行的是 Windows、Mac 还是 Linux 工作框架，处理家庭虚拟化都有两种基本方法。这两个项目都不需要额外费用，并且适用于大多数运行\
  \ 32 位或 64 位架构的设计工作框架。\n\n##### VMWare Player\n**优点**\n* 虚拟机 (VMs) 构建在用于 NAT 的虚拟交换机上。许多虚拟机将具有相互通信的能力，并且可以从主机进行访问。\n\
  * 默认引入了 `DHCP`，所有虚拟机都可以获得 IP 地址。\n* 对 `Xen`、`XenServer`、`vSphere` 和其他主流虚拟机管理程序的高级支持。\n\
  \n**缺点**\n* 不支持 Mac、Solaris 或 FreeBSD 工作框架。\n* 不考虑现有虚拟机的快或克隆。\n* 与某些 Wi-Fi 组织连接存在困难。\n\
  \n##### VirtualBox\n**优点**\n* 适用于 Windows、Linux、Mac、Solaris 和 FreeBSD。\n* 提供可克隆虚拟机的功能（节省时间）。\n\
  * 支持日益增虚拟磁盘映像类型。这在运行下载和预构建的虚拟机时特别有用。\n\n**缺点**\n* 除非在主机上启用了端口转发，否则虚拟机之间相互隔离。\n*\
  \ 不支持 `Xen`、`XenServer`、`vSphere` 或其他类型管理程序所需的嵌套虚拟化。\n* 如果虚拟机崩溃，整个虚拟机损坏的概率更高。\n\n\
  本指南专门针对在 Microsoft Windows 7 专业版上引入的 Oracle `VirtualBox` 版本 `4.2.16`。选择使用 `VirtualBox`\
  \ 而不是 `VMWare Player` 是因为在互联网上有更多资源可以帮助解决出现的问题；尽管如此，它需要额外的配置。\n\n记住，在选择虚拟化框架时，最好的测试是你自己的研究。关于哪个是最好的有过很多讨论，最终选择了一个。\n\
  \n\n\nMetasploitable2 是一个预先配置好且易于使用的虚拟机。考虑到本节后续讨论的许多应用程序都可以在 `Metasploitable2` 虚拟机上运行，因此它也是构建虚拟化实验室的一个非常好的入门阶段。\n\
  \n## 介绍 Metasploitable2\n\n打开浏览器并访问：`http://sourceforge.net/`。使用搜索栏查找 `Metasploitable`。在搜索结果中，点击\
  \ `Metasploitable2` 的链接。点击 `Download`（下载）获取虚拟机。\n\n将下载内容保存到会被回收区域。如果无法正常打开，请启动 `VirtualBox`。点击\
  \ `New`（新建）按钮创建一个虚拟机。\n\n1. 将虚拟机命名为 `Metasploitable2`，并将 `Type`（类型）设置为：`Linux`。将\
  \ `Version`（版本）设置为 `Ubuntu`，点击 `Next`（下一步）。\n2. （在向导之外）将 `Metasploitable2.zip` 文件夹的内容提取到：`C:/clients/%USERNAME%/VirtualBoxVMs/Metasploitable2/`。\n\
  3. （回到 VirtualBox 向导）为虚拟机设置内存大小。点击 `Next` 继续。`512 MB` 的 `RAM` 应该足够了；如有必要可以更改大小。\n\
  \n选择“使用现有的虚拟硬盘文件”（Utilize a current virtual hard drive document）。使用 `Browse`（浏览）选择：`c:/clients/%USERNAME%/VirtualBox\
  \ VMs/Metasploitable2/Metasploitable.vmdk` 文件。点击 `Create`（创建）继续；**不要**现在启动虚拟机。\n\
  \n选择该虚拟机，点击 `Settings`（设置）按钮。从左侧菜单中点击 `General`（通用）。然后选择 `Advanced`（高级）选项卡。将 `Shared\
  \ Clipboard`（共享贴板）设置为：`Bidirectional`（双向），并将 `Drag'n'Drop`（拖放）设置为：`Bidirectional`（双向）。从左侧菜单中选择\
  \ `Network`（网络）按钮，并将 `Attached to`（连接到）更改为`Host-only`（仅主机模式）。点击 `OK` 保存更改。\n\n选择\
  \ `Metasploitable2` 虚拟机，点击顶部的 `Start`（启动）按钮。使用默认凭据登录 `Metasploitable2`：\n- **Username**：`msfadmin`\n\
  - **Secret phrase**：`msfadmin`\n\n首先要注意的是，它没有图形界面（GUI）。`Metasploitable` 并不是设计用于攻击阶段。目前登录\
  \ `Metasploitable` 的目的是确认其可用性并确定其 IP 地址，以便以后可以使用 `Kali Linux` 进行攻击。\n\n检查分配给虚拟机的\
  \ IP 地址：\na. 输入：`ifconfig`\nb. 通常情况下 `VirtualBox` 的 `DHCP` 服务器分配的 IP 以 `192.168.56.x`\
  \ 开始。假设为 `192.168.56.101`。\n\n启动之前创建的 `Kali-Linux-LiveDisc` 虚拟机。登录 `Kali` 后，打开 `IceWeasel`（Kali\
  \ 默认浏览器）并访问 `Metasploitable2` 机的 IP 地址。\n\n## 扩展你的实验室\n\n通过 `Metasploitable2` 项目，学习者获得的不仅仅是一个可以攻击的无用机器，而是一个通往不同准备领域的门户。虚拟机本身通常无法防御远程和本地攻击；`Metasploitable`\
  \ 附带了 Web 管理器。\n\n1. **phpMyAdmin**——通过 Web 界面管理 `SQL` 并不简单，但 `phpMyAdmin` 是一个用\
  \ `PHP` 编写的免费 Web 应用程序，改进了与 Web 服务器相关的 `MySQL` 数据库的管理。可以通过 `phpMyAdmin` 直接访问 `MySQL`\
  \ 数据库，这对于渗透测试人员和程序员来说是一个极人的目标。\n   更多信息：`http://www.phpmyadmin.net/`\n\n2. **Mutillidae**（读作\
  \ mut-till-I-day）是 `OWASP` 的一个开源项目，旨在帮助安全专家和学生建立 Web 应用攻击技能。`Mutillidae` 是一个非常有用的准备工具，拥有庞大的网络支持并不断更新。它自然出现在\
  \ `Metasploitable2`、`SamuraiWTF` 和 `OWASP Broken Web Apps (BWA)` 中。\nJeremy Drunin（在安全社区又被称为\
  \ `webpwnized`）在 YouTube 上上传了许多关于 `Mutillidae` 的教程视频。随 `Metasploitable` 自带的版本已经过时，且缺乏更具挑战性的内容。从\
  \ `Sourceforge` 项目页面下载最新版本的 `Mutillidae` 并将其传输到 `Metasploitable2` 的 `/var/www` 目录以获取更新。\n\
  \   更多信息：`http://sourceforge.net/ventures/mutillidae/` ; `http://www.youtube.com/client/webpwnized`\n\
  \n3. **WebDAV**——网站管理员和主席可能需要更改网站内容。`WebDAV` 是 `HTTP` 协议族的扩展，允许远程更改网站。`WebDAV` 使用用户名和密码组合管理账户访问。如果没有验证\
  \ `WebDAV` 设置，攻击者可能会破坏网站、传输恶意文件，并将 Web 服务器用于其他恶意目的。\n   更多信息：`http://www.webdav.org/`\n\
  \n4. **DVWA**——`Damn Vulnerable Web App` 是另一个供安全专家、教育者、学生和分析师学习 Web 应用安全的准备阶段，正如其名，它极其毫无防备。\n\
  \   更多信息：`http://www.dvwa.co.uk` | `http://sourceforge.net/ventures/dvwa`\n\n5.\
  \ **Tiki**——一个项目级的 Web 2.0 应用 wiki 和协作 Web 前端。`Tiki` 非常强大，已经出现了许多比 `Metasploitable`\
  \ 中更多的版本。`Metasploitable` 自带版本中的漏洞数量令人惊叹。`Tiki` 将为渗透测试人员提供关于攻击 Web 2.0 应用方法的更重要视角。`Tiki`\
  \ 的当前版本已被 `Yahoo!`、`Nokia` 和 `Disney` 等企业巨头使用。\n   更多信息：`http://twiki.org`\n\n上述所有应用运行在\
  \ `Apache` Web 服务器上。任何放入 `/var/www` 的组织或网站都可以通过 `Metasploitable2` 虚拟机的 Web 界面访问。有很多像\
  \ `Mutillidae` 和 `DVWA` 这样的准备包，有助于完善和练习渗透测试者的技能范围。此外，这些准备程序仍在更新；`Metasploitable`\
  \ 从未打算在重大发布之间进行更新。将包添加到 `Metasploitable` 虚拟机需要时间，尽管存在困难，但努力是值得的。作为一个可重复的模型，请执行以下步骤向虚拟机的\
  \ Web 服务器添加包。\n\n## 魔法代码彩虹\n\nDan Crowley 是数据安全爱好者和 `Trustwave` 的自由科学家，他构建并生成了著名的准备套件。他的准备程序易于探索，并配有不同的测试级别。他最大的作品是将\
  \ Web 教程整合为一个高级剧本：`The Magical Code Rainbow (MCIR)`。`MCIR` 包含：\n\n- `SQLol`——一个\
  \ SQL 注入准备阶段，专注于空白字符和序列的自定义，基于测试的阶段来准备和破坏 SQL 攻击。\n- `XMLmao`——与 `SQLol` 类似，`XMLmao`\
  \ 是可配置的 XML 注入准备环境。\n- `Shellol`——用于命令注入的可配置框架准备环境。\n- `XSSmh`——跨站脚本准备设备。\n- `CryptOMG`——与\
  \ `Andrew` 合作开发，是一个可配置的捕捉风格 Web 应用，旨在滥用加密中的基本漏洞。更多信息：`https://github.com/SpiderLabs/MCIR`\n\
  \n## MCIR 的建立\n\n打开 `VirtualBox`，选择 `Metasploitable2` 虚拟机，点击菜单栏上的 `Settings` 按钮（即使在机器运行时也可以这样做）。选择左侧的\
  \ `Network` 按钮，并将 `Attached to` 更改为：`Bridged Adapter`。Name 设置是虚拟网卡要附加的系统网卡。结果可能有所不同。点击\
  \ `OK` 按钮提交并关闭窗口。如果尚未执行，启动 `Metasploitable2` 虚拟机并以 `msfadmin` 客户端登录。重置系统接口：\n\n\
  ```bash\nsudo ifdown eth0\nsudo ifup eth0\n```\n\n检查确保新的 IP 地址已设置：\n```bash\nifconfig\
  \ eth0\n```\n\n更改 `/etc/resolve.conf` 中的名称服务器：\n```bash\nsudo nano /etc/resolve.conf\n\
  ```\n\n更改指向网关的名称服务器 IP 地址；按 `CTRL+X` 退出并保存文件。测试可用性：\n```bash\nnslookup google.com\n\
  ```\n\n启动之前创建的 `Kali-Linux-LiveDisc` 虚拟机。登录 `Kali` 后，打开 `IceWeasel`（Kali 默认浏览器）并访问\
  \ `Metasploitable2` 虚拟机的 IP 地址。\n\n\n\n\n刚开始学习 Google 搜索可以从位于 [`www.google.com/advanced_search`](http://www.google.com/advanced_search)\
  \ 的 Google 高级搜索开始。此页面将帮助新手搜索者完成基本的操作。页面的顶部部分将通过包含和排除单词及数字来帮助查找网页。页面的底部部分将帮助利用 Google\
  \ 的运算符来筛选结果。搜索者可以使用此页面上的任何字段组合来构建将要使用的查询字符串。使用多个字段将产生一个越发不可预测、但也越精确的查询字符串。\n\n###\
  \ 包含所有这些词 (Every One of These Words)\n此字段可用于查找包含对话框中输入的单词的页面，而不忽略这些单词在网页上的位置。这些单词不需要在请求中组合或相邻，只需出现在页面的某个地方即可。要进行此类搜索，在对话框中输入不同的术语并点击“高级搜索”按钮。通过这样做，开发页面中输入的单词被转换为查询字符串，然后发送给\
  \ Google，就像直接在 Google 主页的搜索框中输入它们的一样。\n\n### 确切的单词或短语 (This Exact Word or Phrase)\n\
  在此选项左侧的字段中输入查询词，会导致 Google 网页搜索工具发现与精确请求完全相同的单词或短语。与“包含所有这些词”搜索不同，只有在精确请求中且相邻包含该短语或单词的网页才会被纳入结果集。这种查询通过在语句内设置搜索术语来实现。\n\
  \n### 包含这些词中的任何一个 (Any of These Words)\n使用此字段时，Google 搜索将发现包含这些单词中任一单词的页面。与“包含所有这些词”字段完全不同，返回的页面并不包含所输入的所有单词。这种搜索通过在查询框中的术语之间放置\
  \ OR（或）连接符来实现。\n\n###不包含这些词中的 (None of These Words)\n在此内容框中输入的单词将用于在后续 Google 搜索中排除页面。任何包含输入单词的页面都将从结果集中剔除。这种搜索通过在结果集中你不需要的单词或术语前加上一个减号来实现。\n\
  \n### 数字范围从 (Numbers Ranging from)\n通过使用这里的两个内容字段，搜索将发现包含输入范围范围内数字的页面。这种搜索可以通过包含单位来增强，例如，磅\
  \ (lb)、英里或毫米 (mm) 或像 $ 这样的货币。这种查询可以通过在数字之间设置两个点在主搜索框中进行。\n\n### 语言 (Language)\n\
  通过下拉选择器选择一种语言，后续页面大部分将使用所选语言。此查询限制器对于将结果限制在以目标所在地主要使用的语言编写的页面非常有用。例如，通过专注于德国网站，正在对德国公司进行渗透测试的小组可以更有可能寻找与此特定任务相关的信息。\n\
  \n### 地区 (Locale)\n通过下拉选择器选择地区，后续页面将来自分布在所选区域的站点页面。如果未使用语言下拉菜单生成选项，则使用所选区域的搜索结果将包含分布在该地区的页面，而不考虑其使用的首要语言。通过同时选择语言和地区，可以引导越发精确的搜索。\n\
  \n### 最后更新时间 (Last Updated)\n通过在下拉菜单中选择时间限制，只有在所选时间范围内更新的页面会被记录。这将确保旧页面被排除在结果之外，并可用于确保后续页面是在关键事件之后。例如，如果渗透测试关注的协会近期与另一协会完成了合并或收到了另一项创新，搜索可以限制在事件发生以来，以确保查询结果具有更高的相关性。\n\
  \n### 站点或域名 (Site or Domain)\n此内容框在缩小目标列表项时可能是最有帮助的。例如，寻找一个管理协会可能通过将结果限制在仅 .gov\
  \ 空间而获益，而寻找 Foo 公司可能通过将结果限制在 foo.com 区域而获益。这种限制也可以在基础 Google 搜索内容框中实现，使用搜索限制器 site，后跟结果集中应返回区域或空间。例如，使用\
  \ `site:foo.com` 将结果限制为仅来自 foo.com 区域的页面。\n\n### 出现的词 (Terms Appearing)\n通过此下拉列表，可以将查询聚焦在页面的特定部分。明确选择“页面任意位置”将在整个互联网目标页面上运行搜索，对查询问题关注的位置没有实际限制。\n\
  \n使用“在页面标题中 (in title of the page)”进行搜索将仅关注网页的标题。具体来说，页面标题是显示在浏览器浏览器标签页中的网页部分。这种查询也可以通过在搜索框中使用\
  \ `intitle:administrator` 在 Google 主页上进行。\n\n使用限制器“在页面内容中 (in the content of the\
  \ page)”将搜索限制为仅限页面内容。它将禁止图片、记录和像标题之类的页面结构。如果这些内容写在页面内容中，查询将在结果中恢复这些内容。例如，如果页面内容中引用了图片，该图片将出现在索引列表中；这对内容中的图片标记和链接同样有效。在\
  \ Google 搜索框中使用 `intext:administrator` 等同于从下拉列表中选择此选项。\n\n使用“在页面 URL 中 (in URL of\
  \ the page)”将搜索限制为页面统一资源定位符 (URL)。URL 是显示在互联网浏览器地址框中的站点页面位置。最后，使用“与页面的链接 (in connections\
  \ to the page)”将发现链接到查询准的页面。这种搜索可以通过使用 `inurl:administrator` 在主 Google 搜索框中引导。\n\
  \n### 安全搜索 (Safe Search)\n安全搜索有两个变体：“显示最相关结果”和“显示明确内容”。严格表达式设置可以显式地过滤索引列表中的不良记录和图片。选择“显示最相关结果”不会对结果进行明确过滤。\n\
  \n### 理解水平 (Understanding Level)\n阅读水平选项将根据搜索返回的网页内容的多方面性来过滤结果。“不显示阅读水平”将执行无阅读水平的搜索。选择“用理解水平解释结果”将显示所有结果；并将显示每个页面的阅读水平。Google\
  \ 的计算不如其他评估水平那样逻辑化或细致。然而，它在将结果分为这三类（中级和高级）方面非常有效。这在引导渗透测试时，将结果专注于目标的阅读水平是非常有利的。尝试三个水平中的每一个可能有助于查看索引列表和从阅读理解水平中获取的重要数据。\n\
  \n### 记录类型 (Record Type)\n记录类型可以是渗透分析师可以使用最重要的搜索之一。此设置将列表项限制为特定记录类型，例如 Microsoft\
  \ Word 文档的 `.doc` 和 `.docx`，Adobe 归档的 `.pdf`。通常客户端会使用不同的记录类型处理各种数据。常见的客户端名称、密码和不同类型的记录将存储在\
  \ `.xls` 或 `.xlsx` 电子表格中。下拉列表提供了最广知的记录类型，可以通过 `filetype:xls` 在 Google 搜索中使用任何扩展名。\n\
  \n### 使用权限 (Utilization Rights)\n权限根据版权和其他重用许可限制查询结果的使用能力。通过选择“允许使用、共享或更改”，返回的结果将是可以重用的内容。例如，在大多数情况下内容不能被更改。“允许使用、提供或调整”将返回可以在许可范围内进行更改的列表项。然而，带有“商业”一词的选项返回的是可以工业使用的结果。\n\
  \n### 聚合 Google 高级搜索 (Aggregating an Advanced Google Search)\n仅使用 Google 页面上的字段会恢复某些索引列表，但一起使用许多此类字段将提高进入分析师发现数据的方式。例如，假设\
  \ Foo International（一家美国公司）在一个月前与另一个组织合并，并提到了你小组的进入测试。在这样的进展过程中，创建了许多文档来帮助每个组织的人员进行转换；可能代表在公司网站上展示了层级图。一个潜在的搜索可以使用以下字段和\
  \ `language:English-district:UnitedStates-last update:past months-site or space:foo.com-document\
  \ type:pdf`。结果随后可以通过包含或排除搜索字段或更改选项来进一步精炼。例如，将记录类型更改为 PowerPoint (`.ppt`) 或删除文档类型可能会恢复所需的结果。\n\
  \n### Google 黑客 (Google Hacking)\nGoogle 黑客是一种由 Johnny Long 发起的方法，它利用互联网搜索中特定的 Google\
  \ 运算符和术语，通过 Google 爬虫返回重要数据。该策略专注于利用专门的表述来在 Google 数据库中搜索有关个人和组织的信息。此过程对 Google\
  \ 搜索进行了表示并增强了其结果。Google 黑客利用引导的运算符和连接选项创建可以在 Google 爬虫中运行的针对性问题。已经写了一些优秀的书籍完全解释了\
  \ Google 黑客，最著名的是 Johnny Long 编写由 Syngress 出版的《Google Hacking for Penetration Testers》。\n\
  \n### Google 黑客数据库 (Google Hacking Database)\n大量的 Google 黑客查询字符串已汇集到 Google 黑客数据库\
  \ (GHDB)。第一个数据库位于 `http://www.hackersfor.org/ghdb/`，Offensive Security 同样在 `http://www.offensive-security.com/network/google-hacking-database/`\
  \ 拥有 GHDB，开发了第一个数据库，并产生了“Googorks”这一名称。由 Offensive Security 维护的 GHDB 包含超过 3350 个\
  \ Google Hacks。超过 160 个这些查询字符串对于发现包含密码的文档非常有用。在编写时，可以使用以下命令来尝试发现密码：\n\n```\n\"password\"\
  \ -intext:the\n```\n运行此搜索返回了近百万结果。考虑到返回结果中的部分可能包含真实密码，这些查询字符串对于发现包含密码的文档非常有用。\n\n\
  ### 基于网络的生活 (Web Based Life)\n基于网络的生活已成为许多人的生活组成部分。这一现实使得通过互联网网络进行社交成为可能。通过使用 Facebook、Instagram、Twitter\
  \ 等社交媒体，基于网络的生活可以被创建。使用以下命令来显示 IP 地址。在 Kali Linux 终端中输入以下命令即可：\n\n```\nnslookup\n\
  ```\n这会带来关于服务器的关于，即使电子邮件地址在 LinkedIn 上没有公开显示。发现曾为协会工作的人员是良好的来源。\n\n### DNS 和 DNS\
  \ 攻击 (DNS and DNS Attacks)\n域名服务（Name Services，或 DNS）提供了对互联网的帮助。通过 `Google.com`\
  \ 以及 `173.194.46.19` 等更简单的名称，DNS 允许我们记住 IP 地址。DNS 服务器被设置为指向顶级域名 (TLD) 服务器，如 `.com`,\
  \ `.gov`, `.edu` 以及其他。DNS 传输传输数据，使用 `nslookup` 同样可以返回结果。\n\n### DNS 查询服务器 (DNS Query\
  \ a Name Server)\nDNS 查询一个服务器。根据总体计划，大多数服务器都是可用的。通过以下命令显示服务器：\n\n```\nnslookup server\n\
  ```\n这会显示服务器。\n\n### 区域传输 (Zone Transfer)\n区域传输实际上是转储服务器的所有数据。这种过程对于未经授权的服务器是有害。配置错误的服务器允许区域传输进行传输。\n\
  \n### 域名 (Domain)\nInternet (DIG) 是一个用于区域传输的程序。使用以下命令：@[name server] axfr 显示域名记录。如果服务器成功，可以使用数据。例如：\n\
  \n```\ndig axfr foo.com\n```\n这将显示域名记录。\n\n### 扫描 (Scanning)\n渗透测试完成后，他们将进入测试阶段。在此阶段，渗透分析师可以获取关于员工、临时员工和框架的数据。此阶段的基本点是决定目标类型（工作区域、服务器、设备或可配置阶段）。所有这些部分将专注于最著名的工具，包括\
  \ Nmap、Hping 和 Nessus。此阶段的目标是拥有关于渗透的关注，使用以下命令：\n\n### 创建一个替身 (Make a Doppleganger)\n\
  在旧故事中，替身是人的复制。通常做法是在观察之前建立一个替身。这是可能的。如果替身没有保留数据，或通常被放置，它会询问下一个服务器。如果它知道数据，将立即返回。直到请求到达顶级域名\
  \ (TLD) 服务器，在这种情况下，替身服务器为`.com`。\n\n### 创建替身服务器 (Make the name server)\n替身服务器，例如，即使电子邮件地址在\
  \ LinkedIn 上没有公开显示。发现曾为协会工作的人员是良好的来源。系统。\n\n### 理解网络流量 (Understanding Network Traffic)\n\
  网络流量对某些人可能是困惑的；在任何情况下，都需要对这个主题的基本理解以便在测试阶段获得最大的收益。网络流量是通过各种策略关联系统之间的电子通信。今天最著名的系统管理方法是有线和无线以太网。理解通信的标准至关重要。此部分将探索端口和防火墙、IP\
  \ 协议包括传输控制协议 (TCP)、用户数据协议 (UDP) 和互联网控制管理协议 (ICMP)。\n\n### 获取端口和防火墙 (Getting Ports\
  \ and Firewalls)\n保护系统的最重要的策略之一是在内部公司网络与其余世界（如互联网）之间建立防火墙。防火墙只是带有至少两个网卡的注册设备，充当系统的守护者。访问控制记录仔细筛选出站流量（离开）和入站流量（进入）。只有符合访问控制标准的流量允许通过，而其余被防火墙丢弃。它通过打开或关闭端口来允许或拒绝流量。端口是用于计算机到计算机通信的独特通道。有\
  \ 65535 个 TCP 端口和另外 65535 个 UDP 端口可以用于通信。这些端口中的少数被分配给特定原因，但不限于此用途。例如，TCP 端口 80 通常用于使用超文本传输协议\
  \ (HTTP) 的典型互联网网页流量，但其他流量可以通过端口 80 传输而互联网流量通过不同的端口发送。一种方法是将端口视为一个通往各种房间的大型公司。这些房间中的每一个都有一个办公室工作人员制作特定的显示并管理各种功能。80\
  \ 号的办公室处理进入的网页请求。网络部门可以移动到另一个办公室，例如 8080 号的办公室，继续执行类似的功能，在那里处理网页请求。另一个小组可以进入 80\
  \ 号房间，该房间与网页请求无关，或者该房间可以基本上关闭、锁上并闲置。试图寻找网络小组的人需要知道网络小组目前位于 8080 号而不再 80 号。\n\n###\
  \ 区域传输 (Zone Transfer)\n虽然可能使用 `nslookup` 等程序进行区域传输，但区域传输实际上是转储服务器的所有数据。配置错误的服务器允许区域传输进行。\n\
  \n### 域名 (Domain)\nInternet (DIG) 是一个用于区域传输的程序。使用以下命令：\n\n```\ndig @[name server]\
  \ [domain] axfr\n```\n这将显示域名记录。如果服务器成功，可以使用数据。例如，使用以下命令显示：\n\n```\nnslookup set\
  \ type=MX google.com\n```\n这将显示邮件服务器。正如之前提到的，`nslookup` 可以返回其他数据。例如\n\n```\netc/resolv.conf\n\
  ```\n在 Kali Linux 中描述的 `etc/resolv.conf`。服务器可以被 `nslookup` 更改为目标区域。\n"
