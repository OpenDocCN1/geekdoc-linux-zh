    # Terms


    **Quoting** Quoting literally encloses selected text within some type of quotation
    marks. When applied to shell commands, quoting means to disable shell interpretation
    of special characters by enclosing the characters with single or double quotes
    or by escaping the characters.


    **Escaping** Escaping a character means to put a backslash (\ just before that
    character. Escaping can either remove the special meaning of a character in a
    shell command, or it can add special meaning as we saw with \n in the echo command.
    The character following the backslash is called an escaped character.


    **Special characters, metacharacters, wildcards** All these terms indicate characters
    that are not at face value. These characters have an extra meaning or cause action
    to be taken by the shell or other UNIX commands.


    **Literal characters** These characters have no special meaning and cause no extra
    action to be taken. Quoting causes the shell to treat a wildcard as a literal
    character.


    **Newline character** This is literally the linefeed character whose ASCII value
    is 10. In general, the newline character is a special shell character that indicates
    a complete command line has been entered and can now be executed.'
