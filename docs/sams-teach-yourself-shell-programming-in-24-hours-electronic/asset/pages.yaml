  md: 'As you can see, no directory named backup exists in the /mnt/jaz directory,
    so mv reports an error. The same error is reported if backup was a file in the
    /mnt/jaz directory.


    The third case occurs when you try to move a directory from one file system to
    another. For the purposes of this book, you can think of a file system as either
    a hard drive or a hard drive partition.


    assume that /home and /tmp are on separate partitions. In this case, the command


    ```

    $ mv /tmp/ch01 /home/ranga/docs

    ```


    returns error output


    ```

    mv: cannot move ''/tmp/ch01'' across filesystems: Not a regular file

    ```


    The most common workaround to this is to use the cp -r to copy the directory and
    then remove the original with rm:


    ```

    $ cp -r /tmp/ch01 /home/ranga

    $ rm -r /tmp/ch01

    ```


    I cover the -r option of moving later in this chapter.


    Sometimes, you might use the tar (as tape archive) command instead of cp:


    ```

    $ cd /tmp ; tar -cvpf - ch01 ; ( cd /home/ranga ; tar -xvpf - )

    $ rm -rf /tmp/ch01

    ```


    I explain the tar version of moving directories in Chapter 22, "Problem Solving
    with Shell Scripts."


    # Removing Directories


    You can use two commands to remove directories:


    +   - rmdir

    - rm -r


    Use the first command to remove empty directories. It is considered "safe" because
    in the worst case, you can accidentally lose an empty directory. which you can
    quickly recreate with mkdir.


    The second command removes directories along with their contents. It is considered
    "unsafe" because in the worst case of rm -r, you could lose your entire system.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_84_0.png)'
  merge: -1
