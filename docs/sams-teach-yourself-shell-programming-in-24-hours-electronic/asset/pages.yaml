  md: 'awk The awk command is a power pattern matching language that allows you to
    modify input lines by manipulating the fields they contain.


    background Processes usually running at a lower priority and with their input-disconnected
    from the interactive session. Any input and output are usually directed to a file
    or other process.


    background process An autonomous process that runs under UNIX without requiring
    user interaction.


    bash Stands for GNU Bourne Again shell and is based on the Bourne shell, sh, she
    the original command interpreter.


    block special file Provides a mechanism for communicating with device drivers
    via the file system. These files are called devices because they transfer large
    blocks of data at a time. This type of file typically represents hard drives and
    removable media.


    body The set of commands executed by a loop is called the body of the loop.


    Bourne shell The original standard user interface to UNIX that supported limited-programming
    capability.


    BSD Berkeley Software Distribution.


    BSD UNIX Version of UNIX developed by Berkeley Software Distribution and written
    at the University of California, Berkeley.


    built in A command whose code is part of the shell as opposed to a utility that
    exists in a separate disk file, which must be read into memory before executing
    the command.


    C shell A user interface for UNIX written by Bill Joy at Berkeley. It features
    C-programming-like syntax.


    cat The command used to view the contents of a file.


    cd The command used to change directories.


    character special file Character special files provide a mechanism for communicating
    with a device one character at a time.


    child process See subprocess.


    child shell See subshell.


    chown The command used to change the owner of a file or directory.


    command The name of a program and any arguments you specify to that program to
    cause its behavior to change. You might see the term command used instead of the
    term utility for simple commands, where only the program name to execute is given.'
