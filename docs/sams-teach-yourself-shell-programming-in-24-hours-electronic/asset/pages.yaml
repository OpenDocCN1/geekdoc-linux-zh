  md: "# Miscellaneous Tools\n\n# The : Command\n\nThe character is actually a complete\
    \ shell command that does nothing but return a zero completion code, which indicates\
    \ the command has completed successfully. It can be used as a no-op, which is\
    \ a command that does nothing and can be safely inserted anywhere a command is\
    \ needed for purely syntactical reasons:\n\n```\nif [ -x $CMD ];\nthen\n  else\n\
    \    echo Error: $CMD is not executable >&2\nfi\n```\n\nIn this example, assume\
    \ you are not ready to write the code to follow the then statement. The shell\
    \ fairly a syntax error if you leave that code out, so you insert the : command\
    \ as a temporary no-op command that can be replaced by the desired code later.\n\
    \nBecause : always returns a successful result, it is sometimes used to create\
    \ an infinite loop:\n\n```\nwhile :\n  do\n    echo \"Enter some input: \\c\"\n\
    \    read INPUT\n    [ \"$INPUT\" = stop ] && break\ndone\n```\n\nBecause : always\
    \ returns a successful or true result, the while loop will continue forever until\
    \ a break is executed within the loop. Sometimes you might find that while used\
    \ in place of while : using the : is more efficient because it is a built-in command,\
    \ whereas true is a command that must be read from a disk file, if you are in\
    \ the Bourne shell.\n\nYou might find the : used as the first line of a shell\
    \ script. You sometimes find this in other scripts written when programmers use\
    \ the C shell but wrote scripts for the Bourne shell. If you start a script from\
    \ the C shell and the first character of the script is a # sign, it assumes that\
    \ this script uses C shell syntax, not Bourne shell syntax. Thus it was important\
    \ to start Bourne shell scripts with something other than a # sign, and\n\nAnother\
    \ use of the : takes advantage of the fact that the shell evaluates arguments\
    \ to it. It is a useful way to invoke variable substitution as covered in Chapter\
    \ 8:\n\n```\n${(LINES:=24) ${TERM:?\"TERM not set\"}\n```\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_306_0.png)"
