  md: '# HOUR 1


    # Shell Basics


    My father has a tool chest that holds all his woodworking tools, from screwdrivers
    and chisels to power sanders and power drills. He has used these tools to build
    several desks, a shed, a bridge, and many toys. By applying the same tools, he
    has been able to build all the different elements required for his projects.


    Shell scripting is similar to a woodworking project. To build something out of
    wood, you need to use the right tools. In UNIX, the tools you use are called utilities
    or commands. There are simple commands like ls and cd, and there are power tools
    like awk, sed, and the shell.


    One of the biggest problems in woodworking is using the wrong tool or technique.
    Knowing which tool to use comes from experience. In this book, you will learn
    how to use the UNIX tools via examples and exercises.


    The simple tools are easy to learn. You probably already know how to use many
    of them. The power tools take longer to learn, but when you get the hang of them,
    you''ll be able to tackle any problem. This book teaches you how to use both the
    simple tools and the power tools. The main focus is on the most powerful tool
    in UNIX, the shell.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_28_0.png)'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Before you can build things using the shell, you need to learn some basics.
    This chapter looks at the following topics:


    +   * Commands

    * The shell


    It''s time to get started.


    # What Is a Command?


    In UNIX, a command is a program that you can run. In other operating systems,
    such as Mac OS or Windows, you point to the program you want to run and click
    it. To run a command in UNIX, you type its name and press Enter.


    For example:


    ```

    $ date [ENTER]

    Wed Dec 9 08:49:13 PST 1998

    $

    ```


    Here, the date command has been entered. This command displays the current date,
    date, and year. After the current date appears, notice that the $ character is
    displayed.


    In this book, I use the $ character to indicate the prompt. Wherever you see a
    prompt, you can type the name of a command and press Enter. This executes the
    command that you type. While a command executes, the prompt is not displayed.
    When the command finishes executing, the prompt is displayed again.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_29_0.png)


    The $ character is a prompt for you to enter a command. It is not part of the
    command itself. For example, to execute the date command, you type the word date
    at the prompt, $. Don''t type $ date. Depending on your version of UNIX, an error
    message might be displayed if you type $ date instead of date at the prompt.


    Now look at another example of running a command:


    ```

    $ who

    vathsa tty1 Dec 6 19:36

    sveerara tty2 Dec 6 19:38

    ranga tty0 Dec 9 09:23

    $

    ```'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Shell Basics


    Here, I entered the command who at the prompt. This command displays a list of
    all the people, or users, who are currently using the UNIX.


    The first column of the output lists the usernames of the people who are logged
    in. On my system, you can see that there are three users, vatsa, sweerara, and
    ranga. The second column lists the terminals they are logged in to, and the final
    column lists the time they logged in.


    The output varies from system to system. Try it on your system to see who is logged
    in.


    For those readers who are not familiar with the process of logging in to a UNIX
    system, the details are discussed in Chapter 2, "Script Basics."


    # Simple Commands


    The who and date commands are examples of simple commands. A simple command is
    one that you can execute by just giving its name at the prompt:


    ```

    $ command

    ```


    Here, command is the name of the command you want to execute. Simple commands
    in UNIX can be small commands like who and date, or can be large commands like
    a Web browser or a spreadsheet program. You can execute most commands in UNIX
    as simple commands.


    # Complex Commands


    You can use the who to gather information about yourself when you execute it as
    follows:


    ```

    $ who am i ranga pts/0 Dec 9 08:49

    ```


    This tells me the following information:


    +   - My username is ranga.

    - I am logged in to the terminal pts/0.

    - I logged in at 8:49 on Dec 9.


    This command also introduces the concept of a complex command, which is a command
    that consists of a command name and a list of arguments.


    Arguments are command modifiers that change the behavior of a command. In this
    case, the command name is who, and the arguments are am and i.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'NEW TERM When the who command runs as a simple command, it displays information
    about everyone who is logged in to a UNIX system. The output that is generated
    when a command runs as a simple command is called the default behavior of that
    command.


    The arguments am and i change the behavior of the who to list information about
    you only. In UNIX, most commands accept arguments that modify their behavior.


    The formal syntax for a complex command is:


    ```

    $ commandargument1 argument2 argument3 ... argumentN

    ```


    Here, command is the name of the command you want to execute, and argument1 through
    argument are the arguments you want to give command.


    # Compound Commands


    One of the most powerful features of UNIX is the capability to combine simple
    and complex commands to obtain compound commands.


    NEW TERM A compound command consists of a list of simple and complex commands
    separated by the semicolon character (;). An example of a complex command is


    ```

    $ date ; who am i ;

    Wed Dec 9 10:10:10 PST 1998

    ranga pts/0         Dec 9 08:49

    $

    ```


    Here, the compound command consists of the simple command date and the complex
    command who am i. As you can see from the output, the date command executes first,
    followed by the who am i command. When you give a compound command, each of the
    individual commands that compose it execute in order.


    In this example, the complex command behaves as if you typed the commands in the
    following order:


    ```

    $ date

    Wed Dec 9 10:25:34 PST 1998

    $ who am i

    ranga pts/0         Dec 9 08:49

    $

    ```


    The main difference between executing commands in this fashion and using a complex
    command is that in a complex command you do not get the prompt back between the
    two commands.


    The formal syntax for a complex command is:


    ```

    $ command1; command2; command3 ; ... ; commandN ;

    ```'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Shell Basics


    Here, command1 through commandN are either simple or complex commands. The order
    of execution is command1, followed by command2, followed by command3, and so on.
    When commandN finishes executing, the prompt returns.


    # Command Separators


    The semicolon character (;) is treated as a command separator, which indicates
    where one command ends and another begins.


    If you don''t use it to separate each of the individual commands in a complex
    command, the computer will not be able to tell where one ends and the next command
    starts. If you execute the previous example without the first semicolon


    ```

    $ date who am i

    ```


    an error message similar to the following will be produced:


    ```

    date: bad conversion

    ```


    Here, the date command thinks that is being run as a complex command with the
    arguments who, am, and i. The date command is confused by these arguments and
    displays an error message. When using complex commands, remember to use the semicolon
    character.


    You can also terminate simple and complex commands using the semicolon character.
    For example, the commands


    ```

    $ date ;

    ```


    produce the same output due to the order in which commands execute.


    In the first case, the simple command executes, and the prompt returns.


    In the second case, the computer thinks that a complex command is executing. It
    begins by executing the first command in the complex command. In this case, it
    is the datecommand. When this command finishes, the computer tries to execute
    the next command. Because no other commands are left to execute, the prompt returns.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_32_0.png)


    > You will frequently see the semicolon used to terminate simple and complex commands
    in scripts. Because the semicolon is required to terminate commands in other languages,
    such as C, Perl, and Java, many script programmers use the same way in scripts.
    No extra overhead is incurred by using the semicolon in this manner.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# What Is the Shell?


    In the preceding section, I explained that when you type the command


    $ date


    the computer executes the date command and displays the result.


    But how does the computer know that you wanted to run the command?


    The computer uses a special program called the shell to figure this out. The shell
    provides you with an interface to the UNIX system. It gathers input from you and
    executes programs based on that input. When a program finishes executing, it displays
    your program''s output.


    For this reason, the shell is often referred to as the UNIX system''s command
    interpreter. For users familiar with Windows, the UNIX shell is similar to the
    DOS shell, COMMAND.COM.


    The real power of the UNIX shell lies in the fact that it is much more than a
    command interpreter. It is also a powerful programming language, complete with
    conditional statements, loops, and functions.


    If you are familiar with these types of statements from other programming languages,
    great. You''ll pick up shell programming quickly. If you haven''t seen these before,
    don''t fret. By the time you finish this book, you''ll know how to use each of
    these statements.


    # The Shell Prompt


    The prompt, $, which was discussed in the beginning of this chapter, is issued
    by the shell.


    While the prompt is displayed, you can type a command. The shell reads your input
    after you press Enter. It determines the command you executed by looking at the
    first word of your input. A word is an unbroken set of characters. Spaces and
    tabs separate words.


    To the shell, your input looks like the following:


    $ word1 word2 word3 ... wordN


    The shell always picks word1 as the name of the command you want executed. If
    there is only one word


    $ date'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Shell Basics


    the shell''s job is easy. It executes the command. If there are more words


    $ who am i


    the shell passes the extra words as arguments to the command specified by word.


    # Different Types of Shells


    You might notice that your prompt looks slightly different than the $ prompt I
    am using.

    The actual prompt that is displayed depends on the type of shell you are using.


    In UNIX there are two major types of shells:


    +   - The Bourne shell (includes sh, ksh, and bash)

    - The C shell (includes csh and tesh)


    If you are using a Bourne-type shell, the default prompt is the $ character. If
    you are

    using a C-type shell, the default prompt is the % character. This book covers
    only Bournetype shells because the C-type shells are not powerful enough for shell
    programming.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_34_0.png)


    > In UNIX there are two types of accounts, regular user accounts and the root

    account. Normal users are given regular user accounts. The root account is

    an account with special privileges the administrator of a UNIX system (called

    sysad/min) uses to perform maintenance and upgrades.


    If you are using the root account, both the Bourne and C shells display the #

    character as a prompt. Be extremely careful when executing commands as

    t root account because your commands affect the whole system.


    None of the examples in this book require that you have access to the root

    account to execute them.


    The different Bourne-type shells follow:


    +   - Bourne shell (sh)

    - Korn shell (ksh)

    - Bourne Again shell (bash)

    - POSIX shell (sh)


    The different C-type shells follow:


    +   - C shell (csh)

    - TENEX/TOPS C shell (tesh)


    Unless explicitly noted, the examples and exercise answers in this book will work
    with

    ay Bourne-type shell.'
  merge: -1
