  md: '# Input/Output


    The power of printf comes from its capability to perform complicated formatting
    by using format specifications. The basic syntax for this is

    printf format arguments


    Here, format is a string that contains one or more of the formatting sequences,
    and arguments are strings that correspond to the formatting sequences specified
    in format. For those who are familiar with the C language printf function, the
    formatting sequences supported by the printf command are identical.


    The formatting sequences have their form:


    %[-]m.nx


    Here x starts the formatting sequence and x identifies the formatting sequences
    type.

    Table 13.2 gives possible values of x.


    ### TABLE 13.2 FORMATTING SEQUENCE TYPES

    | Letter | Description |

    |---|---|

    | s | String |

    | c | Character |

    | d | Decimal (integer) number |

    | x | Hexadecimal number |

    | o | Octal number |

    | e | Exponential floating-point number |

    | f | Fixed floating-point number |

    | g | Compact floating-point number |


    Depending on the value of x, the integers m and n are interpreted differently.
    Usually m is the minimum length of a field, and n is the maximum length of a field.
    If you specify a real number format, n is treated as the precision that should
    be used.


    The hyphen (-) left justifies a field. By default, all fields are right justified.


    Look at a few examples to see how to use printf in practice.


    Consider the following shell script written with only echo commands:


    ```

    #!/bin/sh

    echo "File Name\tType"

    for i in *;

    do

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_214_0.png)'
