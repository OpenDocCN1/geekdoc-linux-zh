  md: '# HOUR 9


    # Quoting


    By Frank Watson


    In the preceding chapter, you looked at shell substitution, which occurs automatically
    whenever you enter a command containing a wildcard character or a $ parameter.
    The way the shell interprets these and other special characters is generally useful,
    but sometimes it is necessary to turn off shell substitution and let each character
    stand for itself. Turning off the special meaning of a character is called quoting,
    and it can be done three ways:


    +   - Using the backslash (\)

    - Using the single quote ('')

    - Using the double quote (")


    Quoting can be a very complex issue, even for experienced UNIX programmers. In
    this chapter you look at each of these forms of quoting and how to use them. You
    learn a series of simple rules to help you understand when quoting is needed and
    how to do it correctly.'
  merge: -1
