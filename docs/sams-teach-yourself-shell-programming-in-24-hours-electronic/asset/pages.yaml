  md: '# Variables


    NEW TERM A shell variable is a special variable that is set by the shell and is
    required by the shell in order to function correctly. Some of these variables
    are environment variables whereas others are local variables.


    Table 7.1 gives a summary of the different types of variables discussed in this
    section. This table compares local variables set by the user, environment variables
    set by the user, and shell variables set by the shell.


    # Table 7.1 A Comparison of Local, Environment, and Shell Variables


    | Attribute | Local | Environment | Shell |

    | --- | --- | --- | --- |

    | Accessible by child processes | No | Yes | Yes |

    | Set by users | Yes | Yes | No |

    | Set by the shell | No | No | Yes |

    | User modifiable | Yes | Yes | No |

    | Required by the shell | No | No | Yes |


    # Exporting Environment Variables


    NEW TERM You place variables in the environment by exporting them. Exporting can
    be done as follows:


    ```

    export name

    ```


    This command marks the variable with the specified name for export. This is the
    only form supported by sh, thus it is the most commonly encountered form. The
    standard shell idiom for exporting environment variables is


    ame=value ; export name


    An example of this is

    PATH=/sbin/:bin ; export PATH


    Here you set the value of the variable PATH and then export it. Usually the assignment
    statement of an environment variable and the corresponding export statement are
    written on one line to clarify that the variable is an environment variable. This
    helps the next programmer who has to maintain the script quickly grasp the use
    of certain variables.


    You can also use the export command to export more than one variable to the environment.
    For example,


    ![](img/21edd8d7854fe7f0c0d03baba9111541_132_0.png)'
