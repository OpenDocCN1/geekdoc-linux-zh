- img_proc: true
  md: '# Glossary


    **command separator** Indicates where one command ends and another begins. The
    most common command separator is the semicolon character; ;.


    **command substitution** The process by which the shell executes a command and
    substitutes in the output of the command.


    **comment** A statement that is embedded in a shell script but should not be executed
    by the shell.


    **complex command** A command that consists of a command name and a list of arguments.


    **compound command** A list of simple and complex commands separated by the semicolon
    character; ;.


    **compound expression** Consists of one or more expressions.


    **conditional execution** Alters the execution of a script, based on the system
    type. A script that uses conditional execution usually consists of an *if* statement
    at the beginning that variables indicate the commands that should be used on a
    particular platform.


    **cp** The command used to copy files.


    **daemon** A system-related background process that often runs with the permissions
    of root and services requests from other processes.


    **debugging hook** A function or set of commands that executes only when a shell
    script executes with a special argument. Debugging hooks provide a convenient
    method for tracing the execution of a script in order to fix problems.


    **default behavior** The output that is generated when a command runs as a simple
    command is called the default behavior of command.


    **directory** A type of file used to store other files. For users familiar with
    Windows Mac OS, UNIX directories are equivalent to folders.


    **directory tree** UNIX uses a hierarchical structure for organizing files and
    directories. This structure is often referred to as a *directory tree*. The tree
    has a single root node, the slash (/), and all other directories are contained
    below it.


    **environment variable** A variable that is available to any program that is started
    by the shell.


    **escape sequence** A special sequence of characters that represents another character.


    **escaping** Escaping a character means to put a backslash (\) just before that
    character. Escaping can either remove the special meaning of a character in a
    shell command or add special meaning as we saw with *\* in the echo command. The
    character follow-ing the backslash is called an escaped character.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_444_0.png)'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# Appendix B


    **execute permission** in UNIX, only those files that have execute permission
    enabled run.


    **exporting** a variable is placed in the environment by *exporting* it using
    the export command.


    **expression** a piece of code that are evaluated to produce a numeric result,
    such as 0 or 1. Some expressions that involve mathematical operations can produce
    results.


    **field** a set of characters that are separated by one or more field separator
    characters. The default field separator characters are Tab and Space.


    **field separator** controls the manner in which an input line is broken into
    fields. In the shell, the field separator is stored in the variable IFS. In awk
    the field separator is stored in the awk FS. Both the shell and awk use the default
    value of Space and Tab for the field separator.


    **file descriptor** an integer that is associated with a file. Allows you to read
    and write from a file using the integer of the filename.


    **filesystem** a directory structure contained within a disk or disk area. The
    total available disk space can be composed of one or more filesystems. A filesystem
    must be mounted before it can be accessed. To mount a filesystem, you must specify
    a directory to act as the mount point. Once mounted, any access to the mount point
    directory or its subdirectories will access the separate filesystem.


    **hard link** a directory entry which maps a filename to an inode number. A file
    may have multiple names or hard links. The link count gives the number of names
    by which a file is accessible. Hard links do not allow multiple names for directories
    and do not allow multiple names in different filesystems.


    **home directory** your home directory is the directory you start in after you
    log in.


    **infinite loop** a loop that executes without terminating.


    **inode** a table within a filesystem that contains file information such as the
    owner, group, permissions, last modification date/time, last access date/time,
    and the block list of the actual file data. There is one inode for each file.
    The inodes are numbered sequentially. The inode does not contain the filename.
    The inode is a table that maps inode to numbers.


    **input redirection** in UNIX, the process of sending input to a command from
    a file.'
  merge: -1
