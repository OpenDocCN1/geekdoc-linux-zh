- img_proc: true
  md: 'There is no change in the output of the script because comments are ignored.
    Also comments do not slow down a script because the shell can easily skip them.


    You can also add comments to lines that contain commands by adding the # character
    after the commands. For example, you can add a comment to the line date ; who
    ; as follows:


    date ; who ; # execute the date and who commands


    When you are writing a script, make sure to use comments to explain what you are
    doing in case someone has to look at your script. You might find that this helps
    you figure out what your own scripts are doing, months after you write them.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_50_0.png)


    # Getting Help


    As you read through this book, you will want to get more information about the
    commands and features I discuss. This information is available by using the online
    help feature of UNIX.


    Every version of UNIX comes with an extensive collection of online help pages
    called manual pages. These are often referred to as man pages. The man pages are
    the authoritative source about your UNIX system. They contain complete information
    about both the kernel and all the utilities.


    # Using the man Command


    To access a man page you need to use the man (man as in manual) command as follows:


    ```

    man command

    ```


    Here command is the name of a command that you want more information about. As
    an example,


    ```

    $ uptime

    ```


    displays the following on a Solaris machine:


    ```

    uptime(1)

    ```


    User Commands


    NAME


    ```

    uptime - show how long the system has been up

    ```


    SYNOPSIS


    ```

    uptime

    ```'
