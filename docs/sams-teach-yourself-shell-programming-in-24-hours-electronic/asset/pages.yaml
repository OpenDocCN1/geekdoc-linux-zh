  md: '# find: -size Option


    The `find -size` option enables us to locate files based on the number of blocks
    the file:


    find / -size +2000 -print


    This command prints the names of all files that contain more than 2,000 blocks.
    It is useful when you want to find the largest files that are consuming space.


    Following -size, you must specify an integer number:


    | +n Finds only files that contain more than n blocks |

    |  n Finds only files that contain exactly n blocks |

    | -n Finds only files that contain fewer than n blocks |


    ![](img/21edd8d7854fe7f0c0d03baba9111541_313_0.png)


    > It is a very rare occasion when you need to search for files that contain an
    exact number of blocks. Usually you look for files that contain more than n blocks
    or fewer than n blocks. UNIX neophytes often forget the plus or minus sign for
    these types of find options and then wonder why find did not locate the expected
    files.


    # find: Combining Options


    If you specify more than one option, the file must match all options to be displayed:


    ```

    find / -name alpha -size +50 -mtime -3 -print

    ```


    Here find displays files only when all the following are true:


    +   * The name is alpha

    * The size is greater than 50 blocks

    * The file was last modified fewer than 3 days ago


    You can use a logical "or" condition using -o:


    ```

    find / \ -size +50 -o -mtime -3 \ -print

    ```


    Notice the use of parentheses to group the "either" and "or" options. This finds
    files that have either size greater than 50 blocks or were last modified fewer
    than 3 days ago.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# find: Negating Options


    You can use the ! sign to select files that do not match the given option:


    ```

    find /dev \( -type b -o type c -o type d \)-print

    ```


    This locates all files in the /dev directory and subdirectories that are not block
    special device files, character special device files, or directories. This is
    a useful command to locate device names that users have missed, which leaves a
    regular file in /dev that can waste a large amount of disk space.


    # find -print Action


    -print is an action that tells find to display the pathnames of all files that
    match the options given before -print. If you put the -print action before other
    options in the command line, others are not used in the selection process:


    ```

    find / -size -20 -print -mtime +30

    ```


    This command prints all that contain fewer than 20 blocks. The -mtime is ignored
    because it comes after the -print action on the command line.


    If no action is specified on the command line, -print is usually done by default.
    On older versions of UNIX, however, you must remember to include -print specifically,
    or no output is generated.


    # find -exec Action


    -exec is an action that lets you specify a UNIX command to run on each of the
    files that match the options given:


    ```

    find / -name alpha -exec chmod a+r {};

    ```


    Following -exec, you should specify a UNIX command and put {} where the filename
    will be inserted. Add \; at the end of the command to complete the required syntax.
    In the previous example, chmod runs on every file named alpha so that everyone
    can read the file.


    ```

    find / -name core -exec rm -f {}

    ```


    This example finds all files on the system name and executes the rm command to
    delete them. The -f option to rm is specified so that rm does not ask for confirmation
    if you don''t own the file and do not write permission to the file. This is a
    useful command for root to run periodically because, if a process abort, it might
    leave a debugging file name in the current directory. After a while, these core
    files, which are not small, can collectively consume an unreasonable amount of
    disk space. This command restores disk space by finding and deleting those core
    files.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_314_0.png)'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# xargs


    xargs is a command that accepts a list of words from standard input and provides
    words as arguments to a given command:


    ```

    cat filelist | xargs rm

    ```


    You cannot pipe the output of cat directly to rm because rm does not look for
    filenames on standard input. xargs reads the files being passed by cat and builds
    a command line beginning with rm and ending with the filenames. If there are a
    large number of files, xargs runs the rm command multiple times, deleting some
    of the files each time. You can specify how many arguments from standard input
    to build up on the command line with the -n option:


    ```

    cat filelist | xargs -n 20 rm

    ```


    -n 20 says to put only 20 arguments on each command line, so you delete only 20
    files at a time. Here is a different example to give you more insight into how
    xargs works:


    ```

    $ ls

    acme

    report16

    report3

    report34

    report527

    $ ls | xargs -n 2 echo ===

    === acme report16

    === report334

    === report527

    $

    ```


    The first command shows us that there are only five files in the current directory.(These
    five can be regular files or directories; it does not matter for this example.)
    Next you pipe the output of ls to xargs, which composes and executes this command
    (the first of several):


    ```

    echo === report16

    ```


    > If you have thousands of files to process, xargs (covered in the next section)
    is more efficient than -exec. For example,

    find / -name core -print | xargs rm -f

    This command also deletes all core much more quickly and with less overhead than
    the -exec option, which calls rm once for each file.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_315_0.png)'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'The command begins with echo === because these are the arguments given to the
    xargs command. The command then contains two filenames read from standard input.
    -n 2 tells xargs to add only two words from standard input to each echo command.
    I added === as the first echo argument so you can visually find the output from
    each separate echo command. You can see that xargs called echo three times to
    process all the standard input.


    xargs can be used to solve this problem:


    ```

    $ rm abc*

    rm: arg list too long

    ```


    The current directory contains too many filenames starting with abc, and the command
    buffer overflowed, an error message was printed, and none of the files were deleted.
    xargs can solve this buffer overflow problem:


    ```

    ls | grep ''*abc*'' xargs -n 20 rm

    ```


    Here you use grep (covered in Chapter 15,"Text Filters") and regular expressions
    (covered in Chapter 16, "Text Using Regular Expressions") to filter the output
    of ls passing only filenames that begin with abc. xargs allows rm to operate on
    those files and delete them, no matter how many there are.


    # The expr Command


    The expr command performs simple integer arithmetic:


    ```

    $ expr 8 / 3

    2

    $

    ```


    Notice that any fractional result is ignored. The general syntax is


    expr integer1 operand integer2


    Possible operands are given in Table 18.3.


    | Table 18.3 expr OPERANDS |

    | Operand | Description |

    | + | Addition |

    | - | Subtraction |

    | \* | Multiplication |

    | / | Integer division (any fraction in the result is dropped) |

    | % | Remainder from a division operation (also called the modulus function) |


    ![](img/21edd8d7854fe7f0c0d03baba9111541_316_0.png)'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'Notice that the * sign must be quoted to prevent shell expansion (see Chapter
    9), but the spaces around the * sign must not be quoted:


    ```

    $ expr \* 5

    15

    $

    ```


    # New Term The remainder or modulus function is what remains after a division
    operation:


    ```

    $ expr 19 % 7

    5

    $

    ```


    In this operation, 7 goes into 19 times with a remainder of 5. The modulus function
    is often called mod for short. You can say that 19 mod 7 equals 5.

    expr require separate arguments, each separated by a space, or you will not see
    the calculated result:


    ```

    $ expr 3+2

    3+2

    $

    ```


    expr is often used within backquotes in shell programming to increment a variable:

    CNT=`expr CNT + 1`

    expr adds to the current value in variable CNT, and the backquotes use command
    substitution to allow the new value to be assigned back to the variable CNT. (See
    section "Command and Arithmetic Substitution" in Chapter 8.).


    expr can also return the number of characters matched by a regular expression
    (see Chapter 16):


    ```

    $ expr ABC : ''.*''

    7

    $

    ```


    *.* is a regular expression pattern indicating all characters, so all characters
    of variable $ABC are counted. In this case, expr shows that it contains 7 characters.


    ```

    $ expr ABC : ''[0-9]*''

    4

    $

    ```


    [0-9]* is a regular expression pattern that matches any group of digits. In this
    example, expr counts the number of the digits that occur at the start of the string.
    Looking at the previous example, you know that there are four digits at the start
    of variable ABC.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Miscellaneous Tools 299


    Because you knew there were seven characters total in ABC, you now know that the
    fifth character is not a digit.


    If part of the regular expression pattern is grouped in escaped parentheses, expr
    returns the portion of the pattern indicated by the parentheses:


    ```

    $ expr abcdef = ''\(..)\''

    cd $

    ```


    Each period is a regular expression wildcard that enclosed in escaped parentheses,
    so those two characters, cd, are output. This example also illustrates that the
    string following expr can be a literal string of characters, but it is more common
    in scripts for the string to be generated by variable or command substitution
    (see Chapter 8).


    # The bc Command


    bc is an arithmetic utility limited to integers:


    ```

    $ bc

    scale=4

    8/3

    2.6666

    2.5 * 4.1/6.9

    1.4855

    quit $

    ```


    In this example, you invoke bc and set scale to 4, meaning that you want it to
    calculate any fraction to four decimal places. You ask it to calculate 8/3, which
    gives 2.6666 and then a more complex calculation. Note that spaces are optional.
    Finally you enter quit to return to the shell prompt. bc can handle addition (+),
    subtraction (-), division (/), remainder modulo (%), and integer exponentiation
    (^). bc can accurately compute numbers of any size:


    ```

    9238472938472937 * 29384729347293847

    2714702688730233964784462089224

    ```


    bc can be used in variable assignment to assign calculated values to variables:


    ```

    AVERAGE=`echo "scale=4; $PRICE/$UNITS" | bc`

    ```


    The echo command is used here to print directives that are piped to bc. The first
    directive sets the scale to 4; the second is a division operation. These directives
    are piped to bc, which does the calculations and returns the result. The backquotes
    allow the result from bc to be stored in the variable AVERAGE.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_318_0.png)'
  merge: -1
