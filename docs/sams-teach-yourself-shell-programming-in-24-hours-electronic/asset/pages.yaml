    # How can I check whether a command was successful?


    A command is successful if it exits with a status of zero. A nonzero exit code
    indicates

    that an error has occurred.


    To check the exit code of the most recent command you executed, use the variable
    $?.

    For example:


    ```

    grep root /etc/passwd > /dev/null 2>&1

    if [ $? -ne 0 ]; then echo "No one is in charge! ; fi

    ```


    Here you execute a grep command and then check the exit status of this command
    using

    the value stored in $?


    # How do I determine whether the shell can find a particular

    command?


    You can check to make sure that the shell can find a command or shell function
    by using

    type command covered in Chapter 18, "Miscellaneous Tools":


    ```

    type name > /dev/null 2>&1 ; if [ $? -ne 0 ]; then list ; fi

    ```


    Here name is the name of the command you want to check for, and list is the list
    of com-

    mands to execute if the shell does not know about name. Usually list is used to
    deter-

    mine fallback command.


    The type command is a builtin in sh and bash. In ksh, it is usually, whence -v.'
