  md: 'name awk comes from the last names of its creators Alfred Aho, Peter Weinberg,
    Brian Kernigan. It has been a part of UNIX since 1978, when it was added to UNIX
    Version 7.


    Currently three main versions are available:


    +   - The original awk

    - A newer version nauk

    - The POSIX/GNU version gawk


    The original awk has remained almost the same since its first introduction to
    UNIX in 1978. Originally it was intended to be a small programming language for
    filtering text and producing reports.


    By the mid-1980s, people were using awk for large programs, as in 1985 its authors
    decided to extend it. This version, called nauk (as in new awk), was released
    to the public in 1987 and became a part of SunOS 4.1.x. Its developers intended
    for nauk to replace awk eventually. This has yet to happen. Most commercial UNIX
    versions like HP-UX and Solaris ship with both awk and nauk.


    In 1992 the Institute of Electrical and Electronics Engineers (IEEE) standardized
    awk as part of its Portable Operating Systems Interface standard (POSIX). gawk,
    the GNU version of awk, is based on this standard. All Linux systems ship with
    gawk.


    The examples in this chapter work with any version of awk.


    # Basic Syntax


    The basic syntax of an awk command is


    ```

    awk ''script'' files

    ```


    Here files is a list of one or more files, and script is one or more commands
    of the form:


    ```

    /pattern/ actions }

    ```


    Here pattern is a regular expression, and actions is one or more of the commands
    that are covered later in this chapter. If pattern is omitted, awk performs the
    specified actions for each input line.


    Look at the simplest task in awk, displaying the input lines from a file. In this
    case you used a modified version of the file_prices.txt from the previous chapter:


    ```

    $ awk ''{ print ; } fruit_prices.txt

    ```


    | Fruit Price/lbs Quantity |

    | Banana $0.89 100 |'
