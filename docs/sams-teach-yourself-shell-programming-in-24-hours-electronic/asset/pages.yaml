  md: '# Number of Words


    To count the number of words in a file, use the -w (w in words) option. For example,
    the command


    ```

    $ wc -w .rosts

    ```


    produces the output


    ```

    14 .rosts

    ```


    which is what you expected.


    # Number of Characters


    To count the number of characters, use either the -m option or the -c option.
    As the -m option should be used on Solaris and HP-UX. The -c option should be
    used on Linux systems.


    For example, the command


    ```

    $ wc -m .profile

    ```


    produces the output


    ```

    2908 .profile

    ```


    In Linux or GNU, the equivalent command is


    ```

    $ wc -c .profile

    ```


    # Combining Options


    Like the ls -l command, the options to wc can be grouped together and given in
    any order. For example, if you wanted a count of the number of words and characters
    in the file test_results you can use any of the following commands:


    ```

    $ wc -w -m test_results

    $ wc -wm test_results

    $ wc -mw test_results

    ```


    The output from each of these commands is identical:


    ```

    606 3768 test_results

    ```


    The output lists the words in the files first, the number of characters in the
    file, and the name of the file.


    In this case, there are 606 words and 3,768 characters in the file test_results.'
