    Here you use the awk command to print each line of the input. When the print command
    is given without arguments, it prints the input line exactly as it was read.


    Notice that there is a semicolon (;) the print command. This semicolon is required
    to let awk know that the command has concluded. Strictly speaking, some older
    versions of awk do not require this, but it is good practice to include any.


    # Field Editing


    One of the nicest features available in awk is that it automatically divides input
    lines into *fields*. A field is a set of characters that are separated by one
    or more field characters. The default field separator characters are tab and space.


    When a line is read, awk places the fields that it has parsed into variable 1
    for the first field, 2 for the second field, and so on. To access a field, use
    the field operator, $. Thus, the first field is $1.


    > The use of the $ in awk is slightly different than in the shell. The $ is required
    only when accessing the value of a field variable; it is not required when accessing
    the values of other variables. I will explain creating and using variables in
    awk in depth later in this chapter.


    As an example of using fields, you can print only the name of a fruit and its
    quantity using the following command:


    ```

    $ awk ''{ print $1 $3 }'' fruit_prices.txt

    ```


    Here you use awk to print two fields from every input line:


    +   - The first field, which contains the fruit name

    - The third field, which contains the quantity


    The output looks like the following:


    FruitQuantity

    Banana100

    Peach65

    Kiwi22

    Pineapple35

    Apple78'
