- img_proc: true
  md: "When examining the arguments passed to a script, two special variables are\
    \ available for inspection, $ and $$.\nThe main difference between these two is\
    \ how they expand arguments. When $ is used, it simply expands each argument without\
    \ preserving quoting. This can sometimes cause a problem. If your script is given\
    \ a filename containing spaces as an argument,\ntar -t \"my tar file.tar\"\nusing\
    \ $# would mean that the for loop call tar three times for files named my, tar,\
    \ and file, instead of for the file you requested: my tar.file.\nBy using $$,\
    \ you avoid this problem because it expands each argument as it was quoted in\
    \ the command line.\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_201_0.png)\n\n\
    # Some Minor Issues\n\nYou should deal with a few minor issues. Looking closely,\
    \ you see that all the arguments given to the script, including the first argument,\
    \ $1, are considered as files. Because you are using the first argument as the\
    \ flag to indicate the mode in which the script runs, you should not consider\
    \ it.\n\nNot only does this reduce the number of times the for loop runs, but\
    \ it also prevents the script from accidentally trying to run tar on a file with\
    \ the name -t. To remove the first argument from the list of arguments, use the\
    \ shift command. A similar change to the mode of the script is also required.\n\
    \nAnother issue is what the script should do when an operation fails. In the case\
    \ of the listing operation, if the tar cannot list the contents of a file, skipping\
    \ the file and printing an error would be a reasonable operation. Because the\
    \ shell sets the variable $ to the exit status of the most recent command, you\
    \ can use that to determine whether a tar operation failed.\n\nResolving the previous\
    \ issues, your script is as follows:\n\n```\n#/bin/sh\n\nUSAGE=Usage: basename\
    \ $0 [-c|-t] [files|directories]\n\nif [ $# -lt 2 ]; then\n  echo \"$USAGE\"\n\
    \  exit 1\nfi\n\ncase \"$1\" in\n  -t) shift; TARGS=\"-tvf\";\n```"
  merge: -1
  pgno: 201
- img_proc: true
  md: "# Parameters\n\n```\nfor i in \"@\"; do\n  if [ -f \"$i\" ]; then\n    FILES*=tar\
    \ STARGS=\"$i\" 2>/dev/null\n    if [ $? -eq 0 ]; then\n      echo \"$i\"; echo\
    \ \"$FILES\"\n    else\n      echo \"ERROR: $i not a tar file.\"\n    fi\n  else\n\
    \    echo \"ERROR: $i not a file.\"\n  fi\n  -c) shift; TARGS=\"-cvf\";\n  tar\
    \ STARGS archive.tar \"$@\"\n  *) echo \"$USAGE\"\n    exit 0\nsac\n\n```\n\n\
    esac\nexit ?\n\n# Option Parsing in Shell Scripts\n\nYou have two common ways\
    \ to handle the parsing of options passed to a shell script. In the first method,\
    \ you can manually deal with the parsing of options using a case statement. This\
    \ method was used in the mytar script presented earlier in the chapter. The second\
    \ method discussed in this section, is to use the getopts command.\n\nThe syntax\
    \ of the getopts command is\n\n```\ngetopts option-string variable\n```\n\nHere\
    \ option-string is a string consisting of all the single character options getopts\
    \ should consider, and variable is the name of the variable that the option should\
    \ be set to. Usually, the variable used is named OPTION.\n\nThe process by which\
    \ getopts parses the options given on the command line is\n\n+   1. The getopts\
    \ examines all the command line arguments, looking for arguments starting with\
    \ the - character.\n2. When an argument starting with the - character is found,\
    \ it compares the characters following the - to the characters in the option-string.\n\
    3. If a match is found, the specified variable is set to the option: otherwise,\
    \ variable is set to the ? character.\n4. Steps 1 through 3 are repeated until\
    \ all the options have been considered.\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_202_0.png)"
  merge: -1
  pgno: 202
- img_proc: true
  md: '5. When parsing has finished, getopts returns a nonzero exit code. This allows
    it to be easily used in loops. Also, when getopts has finished, it sets the variable
    OPTIND to the index of the last argument.


    Another feature of getopts is the capability to indicate options requiring an
    additional parameter. You can accomplish this by the option with a : character
    in the option-string. In this case, after an option is parsed, the additional
    parameter is set to the value of the variable named OPTARG.


    # Using getopts


    To get a feeling for how getopts works and how to deal with options, write a script
    that simplifies the task of uencoding a file.


    For readers who are not familiar with uuencode, it is a program that was originally
    used to encode binary files (executable files) into ASCII text so that they can
    be emailed or transferred via FTP. Today, MIME encoding has taken the place of
    uencoding for email attachments, but it is still used for posting binaries to
    newsgroups and transferring them via modem.


    You''ll first examine the interface of this script, which makes it easier to understand
    the implementation.


    This script should be able to accept the following options:


    +   - f to indicate the input filename

    - o to indicate the output filename

    - v to indicate the script should be verbose


    The getopts command to implement these requirements is


    ```

    getopts e=:o:v OPTION

    ```


    This indicates that all options expect for -v to require an additional parameter.
    The variables you require in order to support this are


    +   - VERBOSE, which stores the value of the verbose flag. By default this is
    false.

    - INFILE, which stores the name of the input file.

    - OUTFILE, which stores the name of the output filename. If this value is unset,
    uuencode uses the name of the supplied input file and uencoding uses the name
    of the supplied input file and append to it .uu extension.


    The loop to implement the preceding requirements is as follows:


    ```

    VERBOSE=false

    ```'
  merge: -1
