- img_proc: true
  md: "# if POPD is a directory cd to it, otherwise issue\n# an error message\n\n\
    ```\nif [ -d \"$POPD\" ]; then\n    cd \"$POPD\" /dev/null 2>&1\n    if [ $? -ne\
    \ 0 ]; then\n        echo \"ERROR: Could not cd to $POPD.\" >&2\n    fi\n    pwd\n\
    else\n    echo \"ERROR: $POPD is not a directory.\" >&2\nfi\n\nexport _DIR_STACK\n\
    unset POPD\n```\n\nThis function expects the directory stack to be given to it\
    \ as arguments, by the first thing that it checks is whether $1, the first argument,\
    \ has any value. By setting the variable POPD equal to $1 and then checking the\
    \ contents of POPD.\n\nIf the directory stack is empty, otherwise; shorten the\
    \ stack by using shift. At this point, you have taken care of the first operation.\n\
    \nNow, you have to check see whether the directory stack is empty. Because the\
    \ individual items in the stack are arguments to this function, you need to check\
    \ whether $1, the new argument, has any content. If it does, reinitialize the\
    \ directory stack with this new value and proceed to add all the remaining values\
    \ back onto the stack. At this point, you have taken care of the second operation.\n\
    \nThe last two operations are fairly trivial, and the last if statement takes\
    \ care of them.\n\n# The Wrapper Function\n\nNow that you know the helper function\
    \ expects all the directories on the stack to be given to it as arguments, you\
    \ can write the wrapper function that translates the value of _DIR_STACK into\
    \ separate arguments.\n\nThis process is fairly easy, thanks to the IFS trick.\
    \ The popd() function is the following:\n\n```\npopd() {\n    OLDIFS=\"$IFS\"\n\
    \    IFS=:\n    popd_helper $_DIR_STACK\n    IFS=\"$OLDIFS\"\n}\n```"
