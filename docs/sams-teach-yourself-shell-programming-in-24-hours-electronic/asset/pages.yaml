  md: "As you can see, the function is quite simple. It first checks to see whether\
    \ it was given an argument. If no argument was given, it displays an error message\
    \ and returns. Otherwise, it runs the df -k command and displays the number stored\
    \ in the fourth column. You use the awk expression\n\nNR != 1\n\nto skip the first\
    \ line that contains the header. For more information on awk, please look at Chapter\
    \ 17, \"Filtering Text with awk.\"\n\nAs an example of using this function, the\
    \ command\n\ngetSpaceFree /usr/local\n\ndisplays the following value on my system:\n\
    \n2335788\n\nThe number returned is in kilobytes, which means I have about 2.3GB\
    \ free in the directory /usr/local.\n\nFrequently you might want to compare the\
    \ output of this function to some value. For example, if the if statement checks\
    \ to see whether more than 20,000KB are available in the directory /usr/local:\n\
    \n```\nif [ \"getSpaceFree /usr/local\"` -gt 20000 ]; then\n  echo \"Enough space\"\
    \nfi\n```\n\n# Determining Space Used\n\nYou have looked at determining the amount\
    \ of disk space available in a directory, but sometimes you need to know how much\
    \ disk space a directory uses. For example, you might have a public directory\
    \ that needs to be cleaned up when it exceeds a certain size.\n\nTo perform this\
    \ task, you need to use the du (as disk usage) command. Because you want the output\
    \ for an entire directory and its contents, you need to specify the -s (as in\
    \ sum) option. You also need to specify the -k (as in kilobyte) option for a consistent\
    \ output on all versions of UNIX.\n\nThe output of the du -sk command looks like\
    \ the following:\n\n```\n$ du -sk /home/range/pub\n4922 /home/range/pub\n```\n\
    \nThe size of the directory in kilobytes is listed in the first column. Your function\
    \ uses awk to obtain this number.\n\n############################################################\n\
    # Name: getSpaceUsed"
