- img_proc: true
  md: '# HOUR 6


    # Processes


    By David B. Horvath, CCP


    In this chapter you learn the concepts of processes and jobs. In UNIX every program
    runs as a process. I explain background and foreground processes and how to start
    a process. You are introduced to the commands that list and kill processes. Finally,
    the concept of parent and child processes are explained.


    In this chapter you look at the four major topics involving processes provided
    with the shell:


    +   - Starting processes

    - Listing running processes

    - Killing processes

    - Parent and child processes'
