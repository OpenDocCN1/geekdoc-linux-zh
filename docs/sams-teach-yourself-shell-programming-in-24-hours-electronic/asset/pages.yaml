  md: "# Obtaining the Process ID by Name\n\nOne of the difficulties with the ps command\
    \ is that it is hard to obtain the process ID of a command by specifying only\
    \ its name. In shell scripts that have to start and stop processes, the capability\
    \ to look through the output of ps and retrieve a list of process IDs by a command's\
    \ name is essential.\n\nIn this section, I will present a function that displays\
    \ a list of process IDs (pids) based on a string supplied by the user.\n\n###########################################################n#\
    \ Name: getPID\n# Desc: outputs a list of process id matching $1\n# Args: $1 ->\
    \ the command name to look for\n###########################################################\n\
    \n```\ngetPID() {\n  if [ $# -lt 1 ]; then\n    printERROR \"Insufficient Arguments.\"\
    \n    return 1\n  }\n```\n\n```\nPSOPTS=\"-ef\"\n/bin/ps $PSOPTS | grep \"$1\"\
    \ | grep -v grep | awk '{ print $2; }'\n```\n\nAs you can see, this function is\
    \ a set of filters on top of the command /bin/ps -ef. The first grep command looks\
    \ for all lines that match the first argument. As an example, cutting this on\
    \ the command line produces output similar to the following:\n\n```\n$ /bin/ps\
    \ -ef | grep sshd\n```\n\nHere you are looking for all the lines that contain\
    \ the word ssh. The output should look similar to the following:\n\n| root 1449\
    \ 1 12:23:06 ? 0:02 /opt/bin/sshd |\nranga 1451 944 5 12:23:00 pts/t0 0:00 grep\
    \ sshd |\n\nAs you can see, the output contains two lines. The first one contains\
    \ the process ID of the commands that you are looking for, but the second contains\
    \ the process ID of the grep command that just executed. In order to get rid of\
    \ such lines, add the grep -v to the pipeline.\n\nBecause the process ID is stored\
    \ in the second column, this function displays each process ID.\n\nIf more than\
    \ one line matches, the function displays each process ID."
