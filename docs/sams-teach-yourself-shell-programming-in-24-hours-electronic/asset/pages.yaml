  md: '# Sam''s Teach Yourself Shell Programming in 24 Hours


    Each chapter in this book includes complete syntax descriptions for the various
    commands along with several examples to illustrate the use of commands. The examples
    are designed to show you how to apply the commands to solve real problems. At
    the end of each chapter are a few questions that you can use to check your progress.
    Some of the questions are short answer while others require you to write scripts.


    After Chapter 24, three appendixes are available for your reference:


    +   - Appendix A, "Command Quick Reference," provides you with a complete command
    reference.

    - Appendix B, "Glossary," contains the terms used in this book.

    - Appendix C, "Quiz Answers," contains the answers to all the questions in the
    book.


    # About the Examples


    As you work through the chapters, try typing in the examples to get a better feeling
    of how the computer responds and how each command works. After you get an example
    working, try experimenting with the example by changing commands. Don''t be afraid
    to experiment. Experiments (both successes and failures) teach you important things
    about UNIX and the shell.


    Many of the examples and the answers to the questions are available for downloading
    from the following URL:


    ```

    http://www.csua.berkeley.edu/-ranga/downloads/typs1.tar.Z

    ```


    After you have downloaded this file, change to the directory where the file was
    saved and execute the following commands:


    ```

    $ uncompress typs1.tar.Z

    $ tar -xvf typs1.tar

    ```


    This creates a directory named typs1 that contains the examples from this book.


    There is no warranty of any kind on the examples in this book. I have tried to
    make the examples as portable as possible, and to this end I have tested each
    example on the following versions of UNIX:


    +   - Sun Solaris versions 2.5.1, 2.6, 2.7

    - Hewlett-Packard HP-UX versions 10.10, 10.20, 11.0

    - Red Hat versions 4.2, 5.1, 5.2

    - FreeBSD version 2.2.6'
