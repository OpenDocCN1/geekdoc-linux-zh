    # Viewing the Content of a File


    The ability to list files is very important, but shell scripts also need to be
    able to view the contents of a file.


    # cat


    NEW TERM To view the content of a file, use the cat (short for *concatenate*)
    command. Its syntax is as follows:


    cat files


    Here files are the names of the files that you want to view. For example,


    ```

    $ cat hosts

    ```


    prints out the contents of a file called hosts:


    ```

    127.0.0.1     localhost loopback

    10.8.11.2     kanchi.bosland.us kanchi

    10.8.11.9     kashi.bosland.us kashi

    128.32.43.52   soda.berkeley.edu soda

    ```


    You can specify more than one file as:


    ```

    $ hosts users

    ```


    If the users contains a list of users, this produces the following output:


    ```

    127.0.0.1     localhost loopback

    10.8.11.2     kanchi.bosland.us kanchi

    10.8.11.9     kashi.bosland.us kashi

    128.32.43.52   soda.berkeley.edu soda

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_60_0.png)'
