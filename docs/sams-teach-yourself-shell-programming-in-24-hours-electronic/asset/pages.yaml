  md: "# Parameters 179\n\nFor example, in the following\n\n```\n$ ls -af fruit\n\
    ```\n\nthe command is ls, and its arguments are -af and fruit. The options to\
    \ the ls com-mand are -af.\n\n# Dealing with Arguments, an Example\n\nTo illustrate\
    \ the use of options, change the mytar script to use its first argument, $1, as\
    \ the mode argument and $2 as the tar file to read or create.\n\nTo implement\
    \ this, change the case statement as follows:\n\n```\nUSAGE=Usage: $0 [-c|-t]\
    \ [file|directory]*\ncase $1$ in\n  -t) TARS=-cvf $2;;\n  -c) TARS=-cvf $2.tar\
    \ $2;;\n  *) echo \"USAGE\"\n    exit 0\nesac\n```\n\nThe three major changes\n\
    \n+   - All references to $1 have been changed to $2 because the second argument\
    \ is now the filename.\n- listtar has been replaced by -t.\n- maketar has been\
    \ replaced by -c.\n\nNow running mytar produces the correct output:\n\n```\nUsage:\
    \ ./mytar [-c|-t] [file|directory]\n```\n\nTo create a tar file of directory fruits\
    \ with this version, use the command\n\n```\n$mytar -c fruits\n```\n\nTo list\
    \ the contents of the resulting tar file, fruits.tar, use the command\n\n```\n\
    $mytar -t fruits\n```\n\n# Using basename\n\nCurrently, the message displays the\
    \ entire path with which the shell script was invoked, but what is really required\
    \ is the name of the shell script. You can correct this by using the basename\
    \ command.\n\nThe basename command takes an absolute or relative path and returns\
    \ the file or directory name. Its basic syntax is\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_198_0.png)"
