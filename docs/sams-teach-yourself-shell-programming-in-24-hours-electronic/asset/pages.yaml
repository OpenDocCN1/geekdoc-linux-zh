  md: 'You could use this in a user''s .profile to make sure that the prompt is always
    correct. This form of variable substitution does not affect the value of the variable.
    It performs variable substitution only when the variable is unset.


    # Assigning a Default Value


    To set a value, the second form of variable substitution must be used. This form
    is formally described as:


    ```

    ${parameter:=word}

    ```


    Here, parameter is the name of the variable, and word is the default value to
    set the variable if it is unset. Appending the previous example, you have


    ```

    PS1=${HOST:=`uname -n`} ; export PS1 HOST

    ```


    After the execution of this statement, both HOST and PS1 are set. This example
    also demonstrates the fact that the default string does not have to be a fixed
    string but this substitution did not exist in the shell, the same line would be
    written as


    ```

    if -z "$HOST" ; then HOST=`uname -n` ; fi; PS1="$HOSTS " ;

    export PS1 HOST

    ```


    As you can see, the variable substitution form is shorter and clearer than the
    explicit form.


    # Aborting Due to Variable Errors


    Sometimes substituting default values can hide problems, thus sh supports a third
    form of variable substitution that enables a message to be written to standard
    error when a variable is unset. This form is formally described as


    ```

    ${parameter:?=message}

    ```


    A common use of this is in shell scripts and shell functions requiring certain
    variables to be set for proper execution. For example, the following command exits
    if the variable HOME is unset:


    ```

    : ${HOME:="Your home directory is undefined.\}

    ```


    In addition to using the variable substitution form described previously, you
    are also making use of the no-op (no-op in no operation) command, :, which simply
    evaluates the arguments passed to it. Here you are checking to see whether the
    variable HOME is defined. If it is not defined, an error message prints.'
