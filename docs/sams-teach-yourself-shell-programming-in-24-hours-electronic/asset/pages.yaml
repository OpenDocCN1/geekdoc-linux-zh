  md: '# Techniques for Increasing Portability


    Shell scripts that run on multiple versions of UNIX often include code that is
    version-specific. For example, you might need to use a different command on Linux
    than Solaris to obtain some system information.


    There are two common techniques to increase the portability of a shell script
    between different versions of UNIX:


    +   - Conditional execution

    - Abstraction


    Conditional execution alters the execution of a script based on the system type,
    whereas abstraction retains the same basic basic flow of the script by placing
    the conditional statements within functions.


    # Conditional Execution


    A script that uses conditional execution for portability contains an if statement
    at the beginning. The if statement sets several variables indicating the set of
    commands to use on a particular platform.


    In this section, you look at two common cases of conditional execution:


    +   - Determining the remote shell command

    - Determining the proper method of using the echo command in prompts


    The first case illustrates setting a variable based on the operating system type.
    The second case illustrates setting variables based on the behavior of a command
    (echo) on a particular system.


    # Executing Remote Commands


    A common use of conditional execution is in scripts that need to execute commands
    on remote systems. On most versions of UNIX, you can use the rsh (remote shell)
    command to execute commands on a remote system. Unfortunately, you cannot use
    this command on all versions of UNIX.


    On HP-UX, rsh is available, but it is not the remote shell program—it is the restricted
    shell program. On HP-UX, you need to use the command remsh to execute commands
    on a remote system.


    A script that needs to execute commands on a remote system might have an if statement
    of the following form at its beginning:'
  merge: -1
  pgno: 406
- img_proc: true
  md: '```

    if SystemIS HPUX ; then

    RCMD=remsh

    else

    RCMD=rsh

    fi

    ```


    After the variable `RCMD` is set, remote commands can execute as follows:


    `RCMD` host is the hostname of the remote system, and `command` is the command
    to execute.


    # Problems with the echo Command in Prompts


    Most programs need to prompt the user to be able to print a prompt that is not
    terminated by a newline. In Chapter 13, "Input/Output," there were several problems
    with using the \c escape sequence of the echo command to do. The workaround is
    to use the `/bin/echo` command.


    Although this works for UNIX versions based on System V, on some BSD-based systems
    this does not work. You need to specify the -n option to echo instead. By the
    following shell script, you can create a shell function, `echo_prompt`, to display
    a prompt reliably across all versions of echo:


    +   -ECHO=/bin/echo

    -N=""

    -C="\c"

    CHOUT="$ECHO echo "hello $C"

    if [ "$ECHOUT" = "hello \c" ]; then

    -N="-n"

    -C=""


    ```

    export _ECHO _N _C

    echo_prompt() { $_ECHO $_N \$_C "$1"; };

    ```


    This script fragment implements the `/bin/echo` workaround by using it as the
    base from which to construct the correct echo command. It checks the output of
    an echo command to see whether the \c sequence is treated correctly. If it is,
    you do not need to use the -n option.


    After this has been determined, the function echo_prompt is created using the
    correct variables. This function enables us to reliably output prompts, as in
    the following example:


    ```

    $ echo_prompt "Do you want to play a game"; read response

    Do you want to play a game?

    ```'
  merge: -1
