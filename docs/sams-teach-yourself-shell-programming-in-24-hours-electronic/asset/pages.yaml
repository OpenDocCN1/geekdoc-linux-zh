  md: '# Shell Basics


    **Complex Commands** A complex command is a command that consists of a command
    name and a list of arguments.


    **Arguments** Arguments are command modifiers that change the behavior of a command.


    **Compound Commands** A compound command consists of a list of simple and complex
    commands separated by the semicolon character (;).


    **Command Separators** A command separator indicates where one command ends and
    another begins. The most common command separator is the semicolon character (;).


    **Shell** The shell provides you with an interface to the UNIX system. It gathers
    input from you and executes programs based on that input. When a program has finished
    executing, it displays program’s output. The shell is sometimes called a command
    interpreter.


    **Words** A word is an unbroken set of characters. The shell uses spaces and tabs
    to separate words.


