    # Terms


    **no-op** A command that does nothing and thus can be used as a dummy command
    or placeholder where syntax requires a command.


    **built-in** A command whose code is part of the shell as opposed to a utility
    which exists in a separate disk file which must be read into memory before it
    is executed.


    **reserved word** A unquoted word that is used in grouping commands or selectively
    executing them, such as: if, then, else, elif, fi, case, esac, for, while, until,
    do, or done.


    **modulus function** See remainder function.


    **remainder function** The remainder of a division operation, which is the amount
    that is left over when the amounts are not evenly divisible.


    **inode** A table entry within a file system that contains file information such
    as the owner, group, permissions, last modification date or time, last access
    date or time, and the block list of the actual file data. There is one inode for
    each. The inodes are numbered sequentially. The inode does not contain the filename.
    A directory is a table that maps filenames to inode numbers.'
