  md: '# HOUR 8 Substitution


    The shell performs substitution when it encounters an expression that contains
    one or more special characters.


    **NEW TERM** In the last chapter, you learned how to access a variable''s value
    using the $ character. The process of retrieving the value of a variable is called
    *variable substitution*. In addition to this type of substitution, the shell can
    perform several other types of substitutions:


    +   - Filename substitution (called globbing)

    - Value-based variable substitution

    - Command substitution

    - Arithmetic substitution


    In this chapter, you look at each of these types of substitution in detail.


    # Filename Substitution (Globbing)


    **NEW TERM** The most common type of substitution is filename substitution. It
    is sometimes referred to as *globbing*.'
  merge: -1
