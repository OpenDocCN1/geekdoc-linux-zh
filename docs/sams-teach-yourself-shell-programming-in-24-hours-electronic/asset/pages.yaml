    # Adding a Person


    One of the most important things about any address book is the capability to add
    information to it easily. If you need to edit the address book manually add information,
    you''re bound to make errors such as forgetting adding a colon to separate fields.
    By using a script, you can avoid such errors.


    In this section I will look at a script, addperson, that enables you to add entries
    into the address book in two ways:


    +   * Interactively

    * Using command line options


    The script enters interactive mode when no options are given. If the noninteractive
    mode is being used, it tries to obtain information from the command line options.


    In both modes you put the user-provided information into the following variables:


    +   * NAME, stores the name given by the user

    * EMAIL, stores the email address given by the user

    * ADDR, stores the postal address given by the user

    * PHONE, stores the phone number given by the user


    In interactive mode, you can prompt for the information in each record as follows:


    ```

    printf "-%10s "Name:""; ; read NAME

    printf "-%10s "Email:""; ; read EMAIL

    printf "-%10s "Address:""; ; read ADDR

    printf "-%10s "Phone:""; ; read PHONE

    ```


    After each prompt, you read and store the user''s input, including spaces and
    special characters inside the appropriate variable.'
