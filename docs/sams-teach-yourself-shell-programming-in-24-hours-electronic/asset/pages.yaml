  md: 'next command tells you to skip all remaining patterns and expressions and instead
    read the next input line and start from the first pattern or expression.


    Change your script to use it:


    ```

    #!/bin/sh

    $3 <= 75 { printf "%s\t%s\n",$0,"REORDER"; next; }

    $3 > 75 { print $0; }

    fruit_prices.txt

    ```


    Now the execution of the script is as follows:


    +   1. Checks whether the value of the third column, 22, is less than 75. Because
    the value is less than 75, the script proceeds to step 2.

    2. Prints the input line followed by REORDER.

    3. Reads the next input line and starts over with the first pattern.


    As you can see, the second comparison ($3 > 75) is never performed for this input
    line.


    # Using STDIN as Input


    Recall the basic form of an awk command is


    ```

    awk ''script'' files

    ```


    If files, the list of files, is omitted, awk reads its input from STDIN. This
    enables us to use it to filter the output of other commands. For example, the
    command


    ```

    $ ls -1

