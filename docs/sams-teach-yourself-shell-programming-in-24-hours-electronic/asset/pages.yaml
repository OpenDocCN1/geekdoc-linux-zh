    index.html


    To retrieve a list of the five most recently accessed files, I can pipe the output
    of the ls command into a head command:


    ```

    ls -ut /home/ranga/public_html | head -5

    ```


    This produces the following list:


    +   - index.html

    - RCS

    humor

    misc

    downloads


    # The tail Command


    The basic syntax for the tail command is similar to that of the head command:

    tail [-n lines] files


    Here files is the list of the files the tail command should process. Without the
    -n option, the tail command shows the last 10 lines of its standard input. With
    this option it shows the specified number of lines instead.


    To illustrate the use of the tail command, consider the problem of generating
    a list of the five oldest mail spools on my system.


    I can start with ls -lt command again, but this time I will use the -t (sort by
    last modified time) option:


    ```

    $ ls -1t /var/spool/mail

    ```


    To get the bottom five, I''ll use tail instead of head:


    ```

    $ ls -1t /var/spool/mail | tail -5

    ```


    On my system the following list is generated:


    +   - anna

    root

    amma

    vathsa

    ranga'
