- img_proc: true
  md: '# HOUR 5

    Manipulating File Attributes


    In addition to working with files and directories, shell scripts are often called
    on to manipulate the attributes of a file. In this chapter, you learn how to manipulate
    the following file attributes:


    +   * Permissions

    * Owners

    * Groups


    You will examine the different types of files available on UNIX systems and how
    to identify them.


    # File Types


    UNIX supports several different types of files. Files can contain important data,
    such as files from a word processor or graphics package, or they represent devices,
    directories, or symbolic links. In this section, you will look at the different
    types of files available under UNIX.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Determining a File''s Type


    To determine a file''s type, specify the -l option to the ls. When this option
    is specified,

    ls lists the file type for the specified files. For example, the command


    ```

    $ ls -l /home/ranga/.profile

    ```


    produces the following output:


    ```

    -rwr-xr-x 1 ranga 2368 Jul 11 15:57 .profile*

    ```


    Here, you see that the very first character is a hyphen (-). This indicates that
    the file is

    aregular file. For special files, the first character will be one of the letters
    given in Table

    5.1.


    To obtain file type information about a directory, you must specify the -d option
    along

    with the -l option


    ```

    $ ls -ld /home/ranga

    ```


    produces the following output:


    ```

    drwxr-xr-x 27 ranga 2048 Jul 23 23:49 /home/ranga/

    ```


    # Table 5.1 SPECIAL CHARACTERS FOR DIFFERENT FILE TYPES


    | Character | File Type |

    | - | Regular file |

    | 1 | Symbolic link |

    | c | Character special |

    | b | Block special |

    | p | Named pipe |

    | s | Socket |

    | d | Directory file |


    I will provide the actual descriptions of each of these file types in the following
    sections


    # Regular Files


    Regular files are the most common type of files you will encounter. These files

    store any kind of data. This data can be stored as plain text, an application-

    specific format, or a special binary format that the system can execute.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Manipulating File Attributes


    UNIX does not have to understand the data contained in a regular file. A regular
    file can store any form of raw data because UNIX does not interpret the data that
    is in the file.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_90_0.png)


    Often simply determining that a file is a regular file tells you very little about
    it itself. Usually you need to know whether a particular file is a binary program,
    a shell script, or a library. In these instances, the file program is very useful.


    It is invoked as follows:


    ```

    file filename

    ```


    Here, filename is the name of the file you want to examine. As an example, on
    my system, the command


    ```

    $ /sbin/sh

    ```


    produces the following output:


    ```

    /bin/sh: ELF 32-bit MSB executable SPARC Version 1,

    - statically linked, stripped

    ```


    Here you see that the file, /sbin/sh, is an executable program. Try it out on
    a few files to get an idea of the kind of information it can give you.


    # Symbolic Links


    A symbolic link is a special file that points to another file on the system. When
    you access one of these files, it has a pathname stored inside it. Use this path-name
    to advance to the file or directory on the system represented by the name stored
    in the symbolic link.


    For readers who are familiar with Windows or Mac OS, a symbolic link is similar
    to a shortcut or an alias.


    You can use symbolic links to make a file appear as though it is located in many
    different places or has different names in the file system. Symbolic links can
    point to any type of file or directory.


    The ls -l output for a symbolic link looks like this:


    ```

    lrwxwxr-wx 1 root root 9 Oct 23 13:58 /bin/ -> /usr/bin/

    ```


    The output indicates that the directory /bin is really linked to the directory
    . /usr/bin.


    The relative path in the output is not relative to your current working directory:
    it is rela-tive to the directory where the link resides. In this case, the link
    /bin resides in the directory, thus .usr/bin indicates that /bin is a link to
    the directory /usr/bin.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_90_1.png)'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Creating Symbolic Links


    Create symbolic links using the `ln` command with the `-s` option. The syntax
    is as follows:


    ```

    $ln -s source destination

    ```


    Here, `source` is either the absolute or relative path to the original version
    of the file, and `destination` is the name you want the link to have.


    For example, the following command


    ```

    $ ln -s /home/httpd/html/users/ranga /home/ranga/public_html

    ```


    creates a link in my home directory to my Web files. If you encounter an error
    creating a link, `ln` will display an error message. Otherwise, it displays no
    output.


    In this example, you used absolute paths. In practice, relative paths are preferred
    for the source and the destination. For example, the actual commands I used to
    create a link to my Web files are the following:


    ```

    $ cd

    $ ln -s ../httpd/html/users/ranga ../public_html

    ```


    You can see the relative path using `ls -l` /public_html


    ```

    lrwxrwxrwx 1 ranga users 26 Nov 9 1997 public_html -> ../httpd/

    html/users/ranga

    ```


    This output indicates that the file is a link and also shows the file or directory
    the link points to.


    # Common Errors


    The two most common errors encountered when creating symbolic links happen when


    +   - The destination already exists.

    - The destination is a directory.


    If the specified destination is a file, it does not create the requested link.
    For example, if the file .exrc exists in my home directory, the command


    ```

    $ ln -s /etc/exrc .exrc

    ```


    produces the following error message:


    ```

    in: cannot create .exrc: File exists

    ```'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Manipulating File Attributes


    If the specified destination is a directory, ln creates a link in that directory
    with the same name as the source. For example, if the directory pub exists in
    the current directory, the following command


    ```

    $ ln -s /home/ftp/pub/ranga pub

    ```


    creates the link pub/ranga rather than complaining that the destination is a directory.
    I mention this behavior of ln as a common error for forgetting about that fact
    is a a common shell script bug.


    # Device Files


    You can access UNIX devices through reading and writing to device files. These
    device files are access points to the device within the file systems.


    Usually, device files are located under the /dev directory. The two main types
    of device files are


    +   - Character special files

    - Block special files


    # Character Special Files


    Character special files provide a mechanism for communicating with a device one
    character at a time. Usually character devices represent a "raw" device. The output
    of is on a character special file looks like the following:


    ```

    crw------ 1 ranga users 4, 0 Feb 7 13:47 /dev/tty0

    ```


    The first letter in the output is c, therefore you know that this particular file
    is a character special file, but you also see two numbers before the date. The
    first number is called the major number and the second number is called the minor
    number. UNIX uses these two numbers to identify the device driver that file communicates
    with.


    # Block Special Files


    Block special files also provide a mechanism for communicating with device drivers
    via the file system. These files are called block devices because they transfer
    large blocks of data at a time. This type of file typically represents hard drives
    and removable media.


    Look at the ls -1 output for a typical block device. For example, /dev/sda:


    ```

    brw----- 1 root disk 8, 0 Feb 7 13:47 /dev/sda

    ```'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'The first character is b, indicating that this file is a block special file.
    Just like the character special files, these files also have a major and a minor
    number.


    # # Named Pipes


    One of the greatest features of UNIX is that you can redirect the output of one
    program to the input of another program with very little work. For example, the
    command | grep range takes the output of the command and makes it the input to
    the grep command. This is called piping the output of one command into another.
    You will examine input and output redirection in great detail in Chapter 13, "Input/Output":


    On the command line, temporary anonymous pipes are used, but sometimes more is
    needed than the command line provides. For such instances, UNIX provides a way
    to create a named pipe, so that two or more process communicate with each other
    via a file that acts like a pipe. Because these files allow process to communicate
    with one another, they are one of the most popular forms of interprocess communication
    (IPC for short) available under UNIX.


    # # Sockets


    Socket files are another form of interprocess communication, but sockets can pass
    data and information between two processes that are not running on the same machine.
    Socket files are created when communication to a process on another machine located
    on a network is required. Internet tools used in today, such as Web browsers,
    use sockets to make a connection to the Web server.


    # # Owners, Groups, and Permissions


    File ownership is an important component of UNIX that provides a secure method
    for storing files. Every file in UNIX has the following attributes:


    +   - Owner permissions

    - Group permissions

    - Other (world) permissions


    The owner''s permissions determine what actions the owner file can perform on
    the file. The group''s permissions determine what actions a user, who is a member
    of the group that file belongs to, can perform on the file. The permissions for
    others indicate what action all other users can perform on the file.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Manipulating File Attributes


    You can perform the following actions on a file:


    +   * Read

    * Write

    * Execute


    If a user has read permissions, that person can view the contents of a file. A
    user with write permissions can change the contents of a file, whereas a user
    with execute permissions can run a file as a program.


    # Viewing Permissions


    You can display the permissions of a file using the ls -1 command. For example,
    the following command


    ```

    $ ls -1 /home/ranga/.profile

    ```


    produces the following output:


    -rwxrxr-x  1 ranga  2368 Jul 11 15:57 .profile*


    Because the first character is a hyphen (-), you know that this is a regular file.
    Several characters appear after this hyphen. The first three characters indicate
    the permissions for the owner of the file, the next three characters indicate
    the permissions for the group and the last three characters indicate the permissions
    for all other users.


    The permission block for this file indicates that the user has read, write, and
    execute permissions, whereas members of the group users and all other users have
    only read and execute permissions.


    Three basic permissions that can be granted or denied on a file are read, write,
    and execute. These permissions are defined in Table 5.2.


    After the permissions block, the owner and the group are listed. For this file,
    the owner is ranga and the group is users.


    # Table 5.2 BASIC PERMISSIONS


    | Letter | Permission | Definition |

    | --- | --- | --- |

    | r | Read | The user can view the contents of the file. |

    | w | Write | The user can alter the contents of the file. |

    | x | Execute | The user can run the file, which is likely a program. For directories,
    the execute permission must be set in order for users to access the directory.
    |'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Directory Permissions


    The x bit on a directory grants access to the directory. The read and write permissions
    have no effect if the access bit is not set.


    The read permission on a directory enables users to use the ls command to view
    files and their attributes that are located in the directory.


    The write permission on a directory is the permission to watch out for because
    it lets a user add and also remove files from the directory.


    A directory that grants a user only execute permission will not enable the user
    to view the contents of the directory or add or delete any files from the directory,
    but it will let the user run executable files located in the directory.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_95_0.png)


    > To ensure that your files are secure, check both the file permissions and the
    permissions of the directory where the file is located.


    If a file has write permission for owner, group, and other, the file is insecure.
    Inversely, if a file is in a directory that has write and execute permissions
    for owner, group, and other, all files located in the directory are insecure,
    no matter what the permissions on the files themselves are.


    # SUID SGID File Permission


    Often when a command is executed, it will have to be executed with special privileges
    to accomplish its task.


    As an example, when you change your password with the passwd command, your new
    password is stored in the file /etc/shadow. As a regular user, you do not read
    or write access to this file for security reasons, but when you change your password,
    you need to have write permission to this file. This means that the passwd program
    has to give you additional permissions so that you can write to the file /etc/shadow.


    Additional permissions are given to programs via a mechanism known as the Set
    User ID (SUID) and Set Group ID (SGID) bits. When you execute a program that has
    the SUID bit enabled, you inherit the permissions of program''s owner. Programs
    that do not have the SUID bit set are run with the permissions of the user who
    started the program.


    This is true for SGID as well. Normally programs execute with your group permissions,
    but instead your group will be changed just for this program to the group owner
    of the program.'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'As an example, the passwd command, used to change your password, is owned by
    the root and has the SUID bit enabled. When you execute it, you effectively become
    the root while the command runs.


    The SUID and SGID bits will appear as the letter "s" if the permission is available.
    The SUID "s" bit will be located in the permission bits where the owners execute
    permission would normally be. For example, the command


    ```

    $ ls -l /usr/bin/passwd

    ```


    produces the following:


    ```

    -rsr-xr-x 1 root 19031 Feb 7 13:47 /usr/bin/passwd*

    ```


    which shows that the SUID bit is set and the command is owned by the root. A capital
    letter S in the execute position instead of a lowercase s that indicates the execute
    bit is not set.


    The UID or sticky bit imposes extra file removal permissions on a directory. A
    directory with write permissions enabled for a user enables that to add and delete
    any files from this directory. If the sticky bit is enabled on the directory,
    files can only be removed if you are one of the following users:


    +   - The owner of the sticky directory

    - The owner the file being removed

    - The super user, root


    You should consider enabling the sticky bit for any directories that nonprivileged
    users can write. Examples of such directories would include temporary directories
    and public upload sites.


    Directories can also take advantage of the SGID bit. If a directory has the SGID
    bit set, any new files added to the directory automatically inherit that directories
    group, instead of the group of the user writing the file.


    # Changing File and Directory Permissions


    You can change file and directory permissions with the chmod command. The basic
    syntax is as follows:


    ```

    chmod expression files

    ```'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'NEW TERM Here, *expression* is a statement of how to change the permissions.
    This expression can be of the following types:


    +   * Symbolic

    * Octal


    The symbolic expression method uses letters to alter the permissions, and the
    octal expression method uses numbers. The numbers in the octal method are base-8
    (octal) numbers ranging from 0 to 7.


    # Symbolic Method


    The symbolic expression has the syntax of

    (who) (action) (permissions)


    Table 5.3 shows the possible values for *who*, Table 5.4 shows the possible *actions*,
    and Table 5.5 shows the possible *permissions* settings. Using these three reference
    tables, you can build an expression.


    TABLE 5.3 who

    | Letter | Represents |

    |---|---|

    | u | Owner |

    | g | Group |

    | o | Other |

    | a | All |


    TABLE 5.4 actions

    | Symbol | Represents |

    |---|---|

    | + | Adding permissions to the file |

    | - | Removing permission from the file |

    | = | Explicitly set the file permissions |


    TABLE 5.5 permissions

    | Letter | Represents |

    |---|---|

    | r | Read |

    | w | Write |

    | x | Execute |

    | s | SUID or SGID |'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Manipulating File Attributes


    Now look at a few examples of using chmod.


    To give the "world" read access to all files in a directory, you can use one of
    the following commands:


    +   $ chmod a=r *


    or


    +   $ chmod gu=r *


    If the command is successful, it produces no output.


    To stop anyone except the owner of the file .profile from writing to it, try this:


    +   $ chmod go-w .profile


    To deny access to the files in your home directory, you can try the following:


    +   $ cd ; chmod go= *


    or


    +   $ cd ; chmod go-rwx *


    > If you do this, be warned because some users will call you a file miser.


    When specifying the users part or the permissions part, the order in which you
    give the letters is irrelevant. Thus these commands are equivalent:


    +   $ chmod gu+rx *


    +   $ chmod ug+xr *


    If you need to apply more than one set of permissions changes to a file or files,
    use a comma separated list: For example


    +   $ chmod go-w,a+x .out


    removes the groups and "world" write permission on a .out and adds the execute
    permission for everyone.


    To set the SUID and SGID bits for your home directory, try the following:


    +   $ cd ; chmod ug+s .'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'So far, the examples you have examined involve changing the permissions for
    files in a directory, chmod also enables you to change the permissions for every
    file in a directory including the files in subdirectories. You can accomplish
    this by specifying the -R option.


    For example, if the directory pub contains the following:


    ```

    $ ls -l pub

    ./  README  fags/  src/

    ```


    you can change the permission read permissions of the file README along with the
    files contained in the directories faqs and src with the following:


    ```

    $ chmod -R o+ pub

    ```


    Be careful when doing this to large subtrees because you can change the permissions
    of a file in a way that you did not intend.


    # Octal Method


    By changing permissions with an octal expression, you can only explicitly set
    file permissions. This method uses a single number to assign the desired permission
    to each of the three categories of users (owner, group, and other).


    The values of the individual permissions are the following:


    +   - Read permission has a value of 4

    - Write permission has a value of 2

    - Execute permission has a value of 1


    The value of the permissions that you want to grant give you a number between
    0 and 7. This number will be used to specify the permissions for the owner, and
    find the other category.


    Setting SUID and SGID using the octal method places these bits out in front of
    the standard permissions. The permissions SUID SGID take on the values 4 and 2,
    respectively.


    Go through some of the examples covered in the previous section to get an idea
    of how to use the octal method of changing permissions.


    In order to set the “world” read access to all files in a directory, do this:


    ```

    chmod 0444 *

    ```


    To stop anyone except owner of the file .profile from writing to it, do this:


    ```

    chmod 0600 .profile

    ```'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Manipulating File Attributes


    # Common Errors


    Many new users find the octal specification of file permissions confusing. The
    most important thing to keep in mind is that the octal method sets or assigns
    permissions to a file, but it does not add or delete them.


    This means that the octal mode does not have an equivalent


    ```

    chmod u+rw .profile

    ```


    The closest possible octal version would be


    ```

    chmod 0600 .profile

    ```


    But this removes permissions for everyone except the user. It can also reduce
    the user''s permissions by removing that person''s execute permission.


    Just keep in mind that the octal mode sets the permissions of files not to modify
    them, and you will not run into any problems.


    # Changing Owners and Groups


    Two commands are available to change the owner and the group of files:


    +   - chown

    - chgrp


    The chown command stands for "change owner" and is used to change the owner of
    a file.


    The chgrp command stands for "change group" and is used to change the group of
    a file. On some older systems, the chgrp command might not be available, and the
    chmod command must be used instead. You will learn how to use both chown and chgrp
    to change the group of a file. For maximum portability, you should stick to using
    chown to change both the owner and the group of a file.


    # Changing Ownership


    The chown command changes the ownership of a file. The basic syntax is as follows:


    ```

    chown options user:group files

    ```


    Here, options can be one or more of the options listed in the man page for chown.
    Because considerable variation exists in the available options, please consult
    the man page on your system for a complete list.'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'The value of user can be either the name of a user on the system or the user
    id (uid) of a user on the system. The value of group can be the name of a group
    on the system or the group ID (GID) of a group on the system. To just change the
    owner, you can omit the group value.


    As an example


    ```

    chown ranga: /home/httpd/html/users/ranga

    ```


    changes the owner of the given directory to the user ranga.


    # Restrictions


    The super root, has the unrestricted capability to change the ownership of a file,
    but some restrictions occur for normal users.


    Normal users can change only the owner of the files they own. This means that
    if you give another user ownership of a file, you will not be able to regain ownership
    of that file. Only the new owner of the file or the super user can return the
    ownership to you.


    On some systems, the chown command will be disabled for normal user use. Generally
    happens if the system is running disk quotas. A disk quota system, users might
    be allowed to store only 100MB of files, but if they change the ownership of some
    files, their free available disk space increases, and they still have access to
    their files.


    The chown command will recursively change the ownership of all files when the
    -R option is included. For example, the command


    ```

    chown -R ranga: /home/httpd/html/users/ranga

    ```


    changes the owner of all files and subdirectories located under the given directory
    to be the user ranga.


    # Changing Group Ownership


    You can change group ownership of a file with the chgrp command. Its basic syntax
    is as follows:


    ```

    chgrp options group files

    ```


    Here, options is one or more of the options listed in the man page for chgrp.
    The value of group can be either the name of a group or the GID of a group on
    the system. As an example


    ```

    chgrp authors /home/ranga/docs/ch5.doc

    ```


    changes the group of the given file to be the group authors. Just like chown,
    all versions of chgrp understand the -R option also.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Manipulating File Attributes


    On systems without this command, you can use chown to change the group of a file.
    For

    example, the command

    chown authors /home/ranga/docs/ch5.doc

    changes the group of the given file to the group authors.


    # # Summary


    In this chapter, I covered several important topics relating to files and file
    permissions.

    Specifically, I covered the following tasks:


    +   - Determining a file''s type

    - Changing file and directory permissions using symbolic and octal notation

    - Enabling SUID and SGID permissions for files and directories

    - Changing the owner of a file or directory

    - Changing the group of a file or directory


    As you will see in subsequent chapters, each of these tasks is important in shell
    scripts.


    # # Questions


    For the three questions, refer to the following ls -1 output:


    ```

    crw-r---- 1 bin sys 188 0x001000 Oct 13 03:31 /dev/

    -rw-r--r-- 1 root 418 Oct 13 16:25 /etc/passwd

    drwxr-xr-x 10 bin 1024 Oct 15 20:27 /usr/local/

    -sr-xr-xr 1 root bin 28672 Nov 6 1997 /usr/sbin/ping

    ```


    +   1. Identify the file type of each of the files given above.

    2. Identify the owner and group of each of the files given above.

    3. Describe the permissions for the owner, group, and all "other" users for each
    of the files given above.'
