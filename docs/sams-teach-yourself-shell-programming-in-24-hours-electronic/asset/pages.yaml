  md: '# Shell Programming FAQs


    You are using the mv -i command here in order to avoid overwriting files. For
    example, if the files APPLE and apple both exist in a directory you do not want
    to rename the file APPLE.


    # How do I eliminate carriage returns (^M) in my files?


    If you transfer text from a DOS machine to a UNIX machine, you might see a ^M
    before the end of each line. This character corresponds to a carriage return.


    In DOS a newline is represented by the character sequence \r, where \r is the
    carriage return and \n is newline. In UNIX a newline is represented by \n. When
    files created on a DOS system are used on UNIX, the \r is displayed as ^M.


    You can strip these carriage returns out using the tr command as follows:


    ```

    tr -d \015 < file > newfile

    ```


    Here file is the name of the file that contains the carriage returns, and newfile
    is the name you want to give the file after the carriage returns have been deleted.


    Here you are using the octal representation \015 for carriage return, because
    the escape sequence \r will not be correctly interpreted by all versions of tr.


