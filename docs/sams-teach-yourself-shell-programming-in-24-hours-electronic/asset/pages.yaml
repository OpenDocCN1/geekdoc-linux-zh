- img_proc: true
  md: 'Built-in tools run slightly more efficiently than external programs because
    they do not need to read from the disk. Unless you are looping thousands of times,
    you usually do not need to be concerned if the tool you use is built in or external.


    # # The eval Command


    The eval command can be used when you want the shell to reprocess the command
    line a second time. The basic syntax is


    ```

    eval any-UNIX-command

    ```


    Insert the eval command at the start of any UNIX shell command. This is needed
    when special characters are inserted via variable substitution or command substitution
    (refer to Chapter 8, "Substitution"). For example,


    ```

    OUTPUT-> out.file

    echo hello $OUTPUT

    ```


    The OUTPUT variable contains the > to redirect standard output to a file called
    out.file. However, when you try to use the OUTPUT variable in the echo statement,
    you find there a problem. This is what appears on the screen when you run this
    code:


    ```

    hello > out.file

    ```


    The output went to the screen, but not to the file because the > sign was not
    present when the shell first looked like in the original command line. You can
    fix this problem by inserting the eval command at the start of the echo command:


    ```

    OUTPUT-> out.file

    echo hello $OUTPUT

    ```


    Now when you run this code, it simply returns to the shell prompt without displaying
    any text on the screen. It creates a file called out.file that contains the word
    hello and this is the desired result. You might ask: Why is this useful? The answer
    is that later you can change the initial definition of OUTPUT, and it affects
    all later lines that start with eval and end with $OUTPUT. For example,


    ```

    OUTPUT>> out.file

    ```


    appends to out.file instead of overwriting it.


    OUTPUT= causes output to go to the screen instead of a file.


    The eval command is not used frequently in script writing. It is useful for those
    occasions where you want to compose a shell command line using shell special characters
    that are contained in variables or produced by command substitution. (Shell characters
    were discussed in Chapter 9, "Quoting.")'
