  md: "# Shell and Command Questions\n\nIn this section I will cover some of the common\
    \ questions that arise in regard to the shell itself. Also included are a few\
    \ questions regarding the execution of commands.\n\n# Why does !/bin/sh have to\
    \ be the first line of my scripts?\n\nIn Chapter 2, \"Script Basics,\" I stated\
    \ that /bin/sh must be the first line in your script to ensure that the correct\
    \ shell is used to execute your script. This line must be the first line in your\
    \ shell script because of the underlying mechanism used by a shell to execute\
    \ commands.\n\nWhen you ask a shell to execute the $ date, the shell uses the\
    \ exec call the UNIX kernel to execute the command you requested. For those who\
    \ are not familiar with the term system call, a system call is a C language function\
    \ built into the UNIX kernel that enables you to access features of the kernel.\n\
    \nThe shell passes the name of the command that should be executed by the exec\
    \ system command. This system call reads the first two characters in a file to\
    \ determine how to execute the command. In case of shell scripts, the first two\
    \ characters are #!, indicating that the script needs to be interpreted by another\
    \ program instead of executed directly. The rest of the line is treated as the\
    \ name of the interpreter to use.\n\nUsually the interpreter is /bin/sh, but you\
    \ can also specify options such as -x or -nv are specified to enable debugging.\
    \ This enables you to write scripts tuned for a particular shell such as ksh or\
    \ bash by using /bin/ksh or /bin/bash instead of /bin/sh.\n\n# How can I access\
    \ the name of the current shell in my initialization scripts?\n\nIn your shell\
    \ initialization scripts, the name of the current shell is stored in the variable\
    \ $0.\n\nUsers who have a single .profile is shared by sh, ksh, and bash use this\
    \ variable in conjunction with a case statement near the end of this file to execute\
    \ additional specific script.\n\nFor example, I use the following case statement\
    \ near the end of my .profile to set up the prompt, PS1, depending on the shell\
    \ I am using:\n\n```\ncase $0 in\n  *bash) PS1=\"-t \\n \\$ \" *;\n  *ksh) PS1=\"\
    uname -n' \" *;\n  *sh) PS1=\"uname -n$ \" *;\n```"
  merge: -1
