- img_proc: true
  md: '# Processes


    The first line is the background process information, and the second shows the
    prompt for the next command and the output from 1ls—the error message. I get the
    same error message if I run 1ls as a foreground process.


    If you have process and job monitoring enabled, pressing Enter again results in
    the following-appearing on your screen:


    +   [1] + Done(2) 1ls no_such_file &


    The 1ls command returns a nonzero status. That value (2) is shown after the Done
    message to inform you that it did not run successfully. Of course, the dollar
    sign ($) on the next line is the command prompt.


    # Background Processes That Require Input


    If you run a background process that requires input and do not redirect it to
    read a file instead of the keyboard, the process stops. If you have process and
    job monitoring enabled, pressing Enter at an empty command prompt or starting
    a command returns a message. The following is an example of running a command
    in the background that needs input (using a simple program I created that is not
    part of UNIX):


    ```

    $ i_need_input &

    ```


    Because this command does not produce any output until you give it, all you see
    is the command prompt. Press Entering results in a message as follows:


    +   [1] + Stopped (SIGTIN) i_need_input &


    On some systems the message looks like the following:


    +   [1] + Stopped (tty input) i_need_input &


    SIGTIN (in the first example) is a signal (SIO) that tells me the program is waiting
    for terminal (TT) input (IN). See Chapter 19, "Dealing with Signals," for more
    information on signals.


    If you get a message like this, you have two choices. You can kill the process
    and rerun it with input redirect, or can bring the process to the foreground,
    give it the input needs, and let it continue as a foreground or background process.
    This chapter explains how to handle either of these choices.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_108_0.png)'
  merge: -1
  pgno: 108
- img_proc: true
  md: "# Background Processes That Write Output\n\nSome processes force their output\
    \ to the screen and go into a stop state if they run in the background and want\
    \ to write output. These processes display a message like:\n\n+   [1] + Stopped\
    \ (SIGTTO) i_write & \nOn systems the message may display as follows:\n[1] + Stopped\
    \ (tty output) i_write &\n\nSIGTTO (seen in the first example) is a signal (SIG)\
    \ that tells me the program wants to write output (OU) to the terminal (TT) but\
    \ is in the background. See Chapter 19 for more information on signals.\nIf you\
    \ get a message like this, you have two choices. You can kill the process and\
    \ rerun it with output redirected, or you can bring the process to the foreground\
    \ where it writes its output and let it continue as a foreground or background\
    \ process. This chapter explains how to handle either of these choices.\n\n# Moving\
    \ a Foreground Process to the Background\n\nIn addition to running a process in\
    \ the background using &, you can move a foreground process into the background.\
    \ While a foreground process runs, the shell does not process any new commands.\
    \ Before you can enter any commands, you have to suspend the foreground-process\
    \ to get a command prompt. The suspend key on UNIX systems is Ctrl+Z.\n\nYou can\
    \ determine which key performs which function by using the stty command. By entering\
    \ $ -a\n\n```\nintr = 'C; quit = '\\; erase = 'H; kill = 'U';\neof = ^D; eol =\
    \ ^#\nel2 = 'D; start = ^0; stop = 'S; susp = 'Z';\ndsusup = 'Y; reprint = 'R\n\
    discard = '0; wasere = ^W; lnext = ^V\n```\n\nWhen a foreground process is suspended,\
    \ a command prompt enables you to enter more commands; the original process is\
    \ still in memory but is not getting any CPU time."
  merge: -1
