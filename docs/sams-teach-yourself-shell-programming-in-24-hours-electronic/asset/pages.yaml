  md: '# Input/Output


    Here *n* is an integer, and *file* is the name of the file you want to open for
    writing. The first form overwrites the specified *file* if it exists. The second
    form appends to the specified *file*. For example, the following command


    ```

    $ exec 4>fd4.out

    ```


    associates the file *fd4.out* with the file descriptor 4.

    To open a file for reading, you use the following form:


    ```

    exec nfile

    ```


    Here *n* is an integer, and *file* is the name of the file you want to open for
    reading.


    # General Input/Output Redirection


    You can perform general output redirection by combining a file descriptor and
    an output redirection operator. The general forms are


    ```

    command n> file

    command n>> file

    ```


    Here *command* is the name of a command, as *ls*, *n* is a file descriptor (integer),
    and *file* is the name of the file. The first form redirects the output of *command*
    to the specified *file*, the second form appends the output of *command* to the
    specified *file*.


    For example, you can write the standard output redirection forms in the general
    form as


    ```

    command 1> file

    command 1>> file

    ```


    Here the 1 states that STDOUT is being redirected into the given file.


    General input redirection is similar to general output redirection. It is performed
    as follows:


    ```

    command n<file

    ```


    Here *command* is the name of a command, as *ls*, *n* is a file descriptor (integer),
    and *file* is the name of the file. For example, the standard input redirection
    forms can be written in the general form as


    ```

    command 0<file

    ```


    # Redirecting STDOUT and STDERR to Separate Files


    One of the most common uses of file descriptors is to redirect STDOUT and STDERR
    to separate files. The basic syntax is


    ```

    command 1> file1 2> file2

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_224_0.png)'
