  md: "# Miscellaneous Tools\n\n# find: -mtime, -atime, -ctime\n\nThe find -mtime\
    \ option enables us to locate files that were last modified recently\nhave not\
    \ been modified in a long time:\n\nfind / -mtime -5 -print\n\n-mtime takes an\
    \ integer argument that is measured in days. This find command locates\nfiles\
    \ that were last modified fewer than five days ago. This is a useful option when\n\
    are you sure you modified a file recently but can't remember its name or directory.\n\
    \nFollowing -mtime you must specify an integer value:\n\n+   +n Find only files\
    \ modified more than n days ago\n- Find only files modified exactly n days ago\n\
    -n Find only files modified fewer than n days ago\n\nTo find files that have not\
    \ been modified in the last n days, look for files that were last\nmodified more\
    \ than n days ago:\n\nfind / -mtime +90 -print\n\nThis shows all files that were\
    \ last modified more than 90 days ago: that is, files that have\nnot modified\
    \ in the last 90 days.\n\nThere are three forms of date checking and each takes\
    \ +n, n, or -n as an argument:\n\n+   -mtime Finds files modified more than, exactly,\
    \ or fewer than n days ago\n-atime Finds files last accessed more than, exactly,\
    \ or fewer than n days ago\n-ctime Finds files whose inode was changed more than,\
    \ exactly, or fewer\nthan n days ago. An inode is an entry in a disk table that\
    \ contains informa-\nabout a file as its owner, size, and last access date. The\
    \ inode is\nchanged when the file is first created and also later if the user,\
    \ group,\npermissions are changed.\n\n> -atime Is Often Deft By Nightly Backups\n\
    \nIn theory, find's -atime option is useful if you are short of disk space and\
    \ want to find files\nthat have not been accessed in a long time so you can archive\
    \ them and delete them.\nHowever some backup programs, such as tar, prevent -atime\
    \ from being useful because all\nfiles are accessed nightly during the system\
    \ backup. cpio provides an -a option that remem-\bers each file's last access\
    \ time and restores it after the file has been backed up so that\nfind's -atime\
    \ option is still useful.\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_312_0.png)"
