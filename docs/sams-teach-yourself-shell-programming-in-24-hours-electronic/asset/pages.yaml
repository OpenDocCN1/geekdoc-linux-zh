  md: "# Hour 24\n\nHere you generate a list of all the files in the current directory\
    \ that end with the value of the variable OLDSFFIX. Then you use sed to modify\
    \ the name of each file by removing the value of OLDSFFIX from the filename and\
    \ replacing it with the value of NEWSUFFIX. You use the $ character in your sed\
    \ expression to anchor the suffix in OLDSFFIX to the end of the line. You do this\
    \ to make sure the pattern that is replaced is a reliable suffix.\n\nAfter you\
    \ have a new name, you rename the file from its original name, stored in FILE,\
    \ to the new name, stored in NEWNAME.\n\nTo prevent a potential loss of data,\
    \ you might need to modify this list to use the -i option to the mv command. For\
    \ example, if the files 1.aaa and 1.bbb exist before executing this loop, after\
    \ the loop exits the original version of 1.aaa will be overwritten when 1.bbb\
    \ is renamed as 1.aaa. If mv -i is used, you will be prompted before 1.bbb is\
    \ renamed:\n\n```\nmv: overwrite 1.aaa (yes/no)?\n```\n\nYou can answer no to\
    \ avoid losing the information in this file. The actual prompt produced by mv\
    \ might be different on your version of UNIX.\n\n# What command can I use to rename\
    \ all aaa* files to bbb?\n\nThe technique used in the last question can be used\
    \ to solve this problem as well. In case you use the variables OLDPREFIX to hold\
    \ the prefix a file currently has and NEWPREFIX to hold the prefix you want the\
    \ file to have.\n\nAs an example, you can use the following to rename all files\
    \ that start with aaa bbb instead:\n\n```\nOLDPREFIX=aaa\nNEWPREFIX=bbb\nfor FILE\
    \ in \"$OLDPREFIX*\"; do\n  NEWNAME=$(echo \"$FILE\" | sed -e \"s/${OLDPREFIX}/${NEWPREFIX}/\"\
    )\n  mv \"$FILE\" \"$NEWNAME\"\ndone\n```\n\n# How can I set my filenames to lowercase?\n\
    \nWhen you transfer a file from a Windows or DOS system to a UNIX system, the\
    \ file name ends up in all capital letters. You can rename these files to lowercase\
    \ using the following command:\n\n```\nfor FILE in *\\ do\n  mv -i \"$FILE\" `echo\
    \ \"$FILE\" | tr '[A-Z]' '[a-z]'` /dev/null\ndone\n```"
