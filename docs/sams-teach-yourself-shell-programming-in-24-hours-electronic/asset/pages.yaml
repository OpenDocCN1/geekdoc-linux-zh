- img_proc: true
  md: "# Parameters\n\n```\nwhile getops f:ov OPTION;\ndo\n  case \"$OPTION\" in\n\
    \    f) INFILE=\"$OPTARG\"; ;\n    o) OUTPUT=\"$OPTARG\"; ;\n    v) VERBOSE=true;\
    \ ;\n    ?) echo \"USAGE\";\n      exit 1\n  esac\ndone\n```\n\nNow that you have\
    \ dealt with option parsing, you need to deal with still other error conditions.\
    \ For example, what should your script do if the input file is not specified?\n\
    \nThe simplest answer would be to exit with an error, but with a little more work,\
    \ you can make the script much more user-friendly. If you use the getopts sets\
    \ the variable OPTIND to the value of the last option that it scanned, you can\
    \ have the script assume that the first argument after this is the input filename.\
    \ If no additional arguments remain, you should exit. Your error checking consists\
    \ of the following lines:\n\n```\nshift $((OPTIND - 1));\nif [ -z \"$1\" - -z\
    \ \"$INFILE\" ]; then\n  echo \"ERROR: Input file was not specified.\"\n  exit\
    \ 1\nfi\nif [ -z \"$INFILE\" ]; then INFILE=\"$1\"; fi\n```\n\nHere you use the\
    \ shift command to discard the arguments given to the script by one minus the\
    \ last argument processed by getopts. The exact number of arguments to shift is\
    \ calculated by the command, which is a command line calculator. Its usage is\
    \ explained in detail in Chapter 18, \"Miscellaneous Tools.\"\n\nStrictly speaking,\
    \ you do not have to shift the arguments. It simplifies the if statement.\n\n\
    After shifting the arguments, check whether the new $1 contains some value. If\
    \ it does not, print and exit. Otherwise, set INFILE to the filename specified\
    \ by $1.\n\nYou also need to set the output filename, in case the -o option was\
    \ not specified. You can use variable substitution to accomplish this:\n\n```\n\
    : ${OUTFILE=${INFILE}.uu}\n```\n\nHere the name of the output file is to set to\
    \ the input file plus the .uu extension, if an output file is not given. Note\
    \ that you use the : command to prevent the shell from trying to execute the result\
    \ of the variable substitution.\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_204_0.png)"
