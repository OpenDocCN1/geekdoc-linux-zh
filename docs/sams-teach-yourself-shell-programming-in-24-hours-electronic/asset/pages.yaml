    \ a program in the background and wait for it to finish. If the program finishes,\
    \ it is launched again. The script exits when it receives an INT, QUIT, or TERM\
    \ signal.\n\n# ## Ignoring Signals\n\nSometimes there is no intelligent or easy\
    \ way to clean up a signal is received. In these cases, it is better to ignore\
    \ signals than to deal with them. There are two methods of ignoring signals:\n\
    \nHere signals is a list of signals to ignore. The only difference between these\
    \ two forms is that the first form passes a special argument, '' or null, to the\
    \ trap command and the second uses the command. The form to use is largely based\
    \ on programmer style because both forms produce the same result.\n\nIf you simply\
    \ wanted the uu script from Chapter 12 to ignore all signals, instead of cleaning\
    \ up when it received a signal, you could add the following to the beginning of\
    \ the script:\n\n```\ntrap '' 1 2 3 15\n```\n\n# ## Ignoring Signals During Critical\
    \ Operations\n\nWhen this command is given in a script, the script ignores all\
    \ signals until it exits. From a programmer's perspective, this might be a good\
    \ idea, but from a user's perspective, it is not. A better idea is to have only\
