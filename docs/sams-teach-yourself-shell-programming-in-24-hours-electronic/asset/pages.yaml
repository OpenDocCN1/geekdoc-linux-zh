  md: "# Using sed\n\nsed is a stream editor that you can use as a filter. It reads\
    \ each line of input and then performs a set of requested actions. The basic syntax\
    \ of a sed command is\n\nsed 'script' files\n\nHere files is a list of one or\
    \ more files, and script is one or more commands of the form:\n\n/pattern| action\n\
    \nHere, pattern is a regular expression, and action is one of the commands given\
    \ in Table 16.4. If pattern is omitted, action is performed for every line.\n\n\
    TABLE 16.4 SOME OF THE ACTIONS AVAILABLE IN sed\n| Action | Description |\n|---|---|\n\
    \ p | Prints the line |\n| d | Deletes the line |\n| s/pattern1/pattern2/ | Substitutes\
    \ the first occurrence of pattern1 with pattern2. |\n\n# Printing Lines\n\nStart\
    \ with the simplest feature available in sed—printing a line that matches a pattern.\n\
    Consider the price for a small fruit market. The list is stored in the file fruit_prices.txt:\n\
    \n```\n$ cat fruit_prices.txt\nFruit Price/lbs\nBanana 0.89\nPaech 0.79\nKiwi\
    \ 1.50\nPineapple 1.29\nApple 0.99\nMango 2.20\n```\n\nHere you list the name\
    \ of a fruit and its price per pound.\nSay you want to print out a list of those\
    \ fruits that cost less than $1 per pound. You need to use the sed command p (p\
    \ as in print):\n\n```\n/pattern/p\n```\n\nHere pattern is a regular expression."
  merge: -1
