  md: "# Processes 97\n\n# TABLE 6.2 MORE BSD PS COMMAND OPTIONS.\n\n| Column Heading\
    \ | Description |\n|---|---|\n ps -a | Shows information about all users |\n ps\
    \ -x | Shows information about processes without terminals (daemons and jobs running\
    \ nohup) |\n ps -u | Shows additional information (like the System V ps -f)|\n\
    \nUse the man ps command for an explanation of all the available options. If you\
    \ are ever in doubt about a command or option, use the man command to obtain information\
    \ about command. For the ps command, man ps gets you the manual page.\n\n# Killing\
    \ a Process (kill Command)\n\nAnother handy command to use with jobs and processes\
    \ is the kill command. As the name implies, the kill command kills, or ends, a\
    \ process.\n\nJust like the fg and bg commands, the job number is prefixed with\
    \ a percent sign. To kill job number 1 in the earlier example regarding waiting\
    \ for keyboard input, I use the following:\n\n```\n$ kill %1\n[1] - Terminated\
    \ third_one &\\ $\n```\n\nYou can also kill a specific process by specifying the\
