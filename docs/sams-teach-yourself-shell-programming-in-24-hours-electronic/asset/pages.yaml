- img_proc: true
  md: '# Script Basics


    You need to enter your username at this prompt. After you enter your username,
    another prompt is presented:

    login: ranga

    Password:


    You need to enter your password at this prompt.


    These two prompts are presented by a program called getty. These are its tasks:


    +   1. Display the prompt login.

    2. Wait for a user to type a username.

    3. After a username has been entered, display the password prompt.

    4. Wait for a user to enter a password.

    5. Give the username and password entered by the user to the login command and
    exit.


    After login receives your username and password, it looks through the file /etc/passwd
    for an entry matching the information you provided. If it finds a match, login
    executes a shell and exits.


    As an example, on my system the matching entry for my username, ranga. in file

    etc/passwd is:


    ```

    ranga:x:500:Sriranga Vearagarajan:/home/ranga:/bin/bash

    ```


    As you progress through the book, I will explain the information stored here.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_44_0.png)


    | For those readers who are not familiar with UNIX files or filenames such as
    /etc/passwd, this topic is covered extensively in Chapters 3, "Working with Files,"
    and 4, "Working with Directories."

    | I will discuss files briefly in this chapter. A general idea from other operating
    systems of what files are enough to understand these examples. |


    If no match is found, the login program issues an error message and exits. At
    this point the getty program takes over and displays a new login prompt.


    The shell that login executes is specified in the file /etc/passwd. Usually this
    is one of the shells that I covered in the previous chapter.


    In this book I assume the shell started by the login program is /bin/sh. Depending
    on the version of UNIX you are running, this might or might not be the Bourne
    shell:'
