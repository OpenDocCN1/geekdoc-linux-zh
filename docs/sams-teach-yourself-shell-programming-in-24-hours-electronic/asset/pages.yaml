    \ a file before doing this command,\nso actual body is\n\n```\nif [ -f \"SFILE\"\
    \ ]; then uuencode $SFILE $SFILE > SOUTFILE; fi\n```\n\nAt this point the script\
    \ is fully functional, but you still need to add the verbose reporting.\nThis\
