  md: '# Counting Words


    Counting words is an essential capability in shell scripts. There are many ways
    to do it, with the easiest being the wc command. Unfortunately, it displays only
    the number of characters, words, or lines.


    What about when you need to count the number of occurrences of word in a file?
    The wc command fails short. In this section, you will solve this problem using
    the following commands:


    +   - tr

    - sort

    - uniq


    The tr (tr for transliterate) changes all the characters in one set into characters
    in a second set. Sometimes it deletes sets of characters.


    The sort command sorts the lines in an input file. If you don''t specify an input
    file, it sorts the lines given on STDIN.


    The uniq command (uniq for print) prints all the unique lines in a file. If a
    line occurs multiple times, only one copy of the line is printed out. It can also
    list the number of times a particular line was duplicated.


    I will use the text of this chapter, ch15.doc, as the input file for this example.


    # The tr command


    First, you need to eliminate all the punctuation and delimiters in the input file
    because the word end, and the word are are the same. You accomplish this task
    using the tr command. Its basic syntax is


    ```

    tr ''set1'' ''set2''

    ```


    Here tr takes all the characters in set1 and translates them to the characters
    in set2. Usually, the characters themselves are used, but the standard language
    escape sequences also work.


    To accomplish my first task, I used the following command:


    ```

    $ tr ''!?:;\[]{},()'' '' '' /home/ranga/docs/ch15.doc

    ```


    Here I specified set2 as the space character separated by the characters in set1
    need to remain separate after the punctuation is removed.


    Notice that the characters [ and ] are given as \[ and \. As you will see later
    in this chapter, these two characters have a special meaning in tr and need to
    be escaped using the backslash character (\) in order to be handled correctly.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_250_0.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'At this point the words are separated by spaces, but some of the words are
    separated by tabs and newlines. To get an accurate count, all the words should
    be separated by spaces, so you need to covert all tabs and newlines to spaces:


    ```

    $ tr ''!'':;\{\{\},\.\t'' < /home/ranga/docs/ch15.doc

    ```


    The next step is to transliterate capitalized versions of words to a lowercase
    version because the words To and, The the, and Files and files are the same word.
    To do this, you tell tr to change all the characters ''A-Z'' to lowercase characters
    ''a-z'' as follows:


    ```

    $ tr ''!'':\{\{\},\,\t'' < /home/ranga/docs/ch15.doc |

    tr ''A-Z'' ''a-z''

    ```


    I broke the command into two lines, with the pipe character as the last character
    in the first line so that the shell does the right thing and uses the next line
    as the command to pipe. This makes it easier to read and cut and paste, also.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_251_0.png)


    # Differences between tr versions


    In this example, you are using a single space for set2. Most versions of tr interpret
    this to mean transliterating all the characters in set to space. Some versions
    of tr do not do this.


    You determine whether your tr works in this manner using the test code:


    ```

    $ echo "Hello, my dear!" | tr '' ''

    ```


    Most versions of tr produce the following output:

    Hello my dear

    Some versions produce the following output instead:

    Hello my dear!


    To obtain the desired behavior from these versions of tr, make sure that set1
    and set2 have the same number of characters. In this case, set2 needs to contain
    two spaces:


    ```

    $ echo "Hello, my dear!" | tr '' '' '' ''

    ```


    In the case of the sample problem, set2 would need to contain 15 spaces.


    # Squeezing Out Spaces


    At this point, several of the lines have multiple spaces separating the words.
    You need to reduce or squeeze these multiple spaces into single spaces to avoid
    problems counting later in this example. To do this, you need to use the -s (s
    as in squeeze) option to the tr command. The basic syntax is'
