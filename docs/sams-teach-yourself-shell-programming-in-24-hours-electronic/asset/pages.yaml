  md: 'In the first example, the output of the date command becomes the value for
    the variable DATE. In the second example, the output of the pipeline becomes the
    value of the variable USERS. In the last example, the output of the list becomes
    the value of the variable UP.


    You can also use command substitution to provide arguments for other commands.


    ```

    grep `id -un` /etc/passwd

    ```


    looks through the file /etc/passwd for the output of the command:


    ```

    -un

    ```


    In my case, the command substitution results in the string ranga, and thus grep
    returns the entry in the passwd file for my user name.


    # Arithmetic Substitution


    In sh and bash, the shell enables integer arithmetic to be performed. This avoids
    having to run an extra program as exp or bc to do math in a shell script. This
    feature is not available in sh.


    Arithmetic substitution is performed when the following form of command is given:


    ```

    $((expression))

    ```


    Expressions are evaluated according to standard mathematical conventions. Table
    8.3 provides the available operators. The operators are listed in order of precedence.


    TABLE 8.3 ARITHMETIC SUBSTITUTION OPERATORS


    | Operator | Description |

    | / | The division operator. Divides two numbers and returns the result |

    | * | The multiplication operator. Multiplies two numbers and returns the result
    |

    | - | The subtraction operator. Subtracts two numbers and returns the result |

    | + | The addition operator. Adds two numbers and returns the result |

    | () | The parentheses clarify which expressions should be evaluated before others.
    |


    You use the following command as an illustration of the operators and their precedence:


    ```

    foo=$(( (( 5 + 3*2 ) - 4 ) / 2 ))

    ```


    After this command executes the value of foo to 3. Because this is integer arithmetic,
    the value is not 3.5, and because of operator precedence the value is not 6.'
