  md: "# Flow Control and Loop Syntax\n\n+   - The **if** statement:\n  if list1;\
    \ then list2; elif list3; then list4 else list5 fi\n- The **case** statement:\n\
    \  case expression in\n    pattern1) list1;;\n    patternN) listN;\n  esac\n-\
    \ The **while** loop:\n  while expression; do list; done\n- The **for** loop:\n\
    \  for var in word1 ... wordN; do list; done\n- The **select** loop:\n  select\
    \ var in word1 ... wordN; do list; done\n\n# Variable Substitution\n\n**VARIABLE\
    \ SUBSTITUTION.**\n\n| COMMAND | DESCRIPTION |\n| --- | --- |\n| {name} | Substitutes\
    \ the value of name. |\n| {name:=word} | Substitutes the value of name. If it\
    \ is undefined, word is substituted. |\n| {name:=word} | Substitutes the value\
    \ of name. If it is undefined, word is assigned as the value of name. |\n| {name?msg}\
    \ | Substitutes the value of name. If it is undefined, the error message msg is\
    \ displayed. |\n| {name:+word} | Substitutes word only if name is defined. |\n\
    \n# Redirection\n\nThe three main file descriptors and their corresponding numbers\
    \ are standard input (STDIN - 0), standard output (STDOUT - 1), and standard error\
    \ (STDERR - 2).\n\n| REDIRECTION | DESCRIPTION |\n| --- | --- |\n| > file or 1>\
    \ file | save STDOUT in file |\n| >> file or 1>> file | append STDOUT to file\
    \ |\n| 2> file | save STDERR in file |\n| 2>> file | append STDERR in file |\n\
    | < file or 0< file | read STDIN from file instead of keyboard |\n| cmd1 | cmd2\
    \ | pipe STDOUT of file to STDIN of file |\n| 2>&1 | redirect STDERR into STDOUT\
    \ |\n| >22: 1&2 | redirect STDOUT to STDERR |"
