  md: "# Debugging\n\nthe correct fix for this problem is to track down the reason\
    \ why the variable RESPONSE is not set. This variable is set by the function YesNo:\n\
    \n```\nYesNo() {\n  echo \"S1 (y/n)? \\c\"\n  read RESPONSE\n  case $RESPONSE\
    \ in\n    [yY]|[Yy][Ee][Ss]) RESPONSE=y ;;\n    [nN]|[Nn][Oo]) RESPONSE=n ;;\n\
    \  esac\n}\n```\n\nThere are two problems with this script. The first is that\
    \ the read command\nread RESPONSE\n\ndoes not set a value for RESPONSE if the\
    \ user presses Enter without typing some input. Because you cannot change the\
    \ read command, you need to look for some other method of solving this problem.\n\
    \nThis leads to a logical problem—the case statement is not validating the user\
    \ input. A simple fix is the following:\n\n```\nYesNo() {\n  echo \"S1 (y/n)?\
    \ \\c\"\n  read RESPONSE\n  case $RESPONSE in\n    [yY]|[Yy][Ee][Ss]) RESPONSE=y\
    \ ;;\n    *) RESPONSE=n ;;\n  }\n```\n\nHere you treat all responses other than\
    \ \"yes\" responses as negative responses, including no response at all.\n\n#\
    \ Using Debugging Hooks\n\nIn the previous examples, you were able to deduce the\
    \ location of a bug by using shell tracing for the entire script or for part of\
    \ the script. In the case of enabling tracing for part of a script, you had to\
    \ edit the script to insert the debug command:\n\n```\nset -x\n```\n\nIn larger\
    \ scripts, a common practice is to embed debugging hooks. Debugging hooks are\
    \ functions that enable shell tracing during functions or critical code sections.\
    \ They are activated in one of two ways:\n\n+   - The script is run with a particular\
    \ command line option (commonly -d or -x).\n- The script is run with an environment\
    \ variable set to true (commonly DEBUG=TRACE=true).\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_348_0.png)"
