    # Pipelines


    Most commands in UNIX that are designed to work with files can also read input
    from STDIN. This enables you to use one program to filter the output of another.
    This is one of the most common tasks in shell scripting: having one program manipulate
    the output of another program.


    You can redirect the output of one command to the input of another command using
    a pipeline, which connects several commands together with pipes as follows:


    ```

    command1 | command2 | ...

    ```


    The pipe character, |, connects the standard output of command1 to the standard
    input of command2, and so on. The commands can be as simple or complex as are
    required.


    Here are some examples of pipeline commands:


    ```

    tail -f /var/adm/messages | more

    ps -ael | grep "SUID" | more

    ```


    In the first example, the standard output of the tail command is piped into the
    standard input of the more command, which enables the output to be viewed one
    screen at a time.


    In the second example, the standard output of ps is connected to the standard
    input of grep, and the standard output of grep is connected to the standard input
    of more, so that the output of grep can be viewed one screen at a time. For now,
    simply be aware of this technique of redirection. I show you how to use it to
    filter text in Chapters 16, 17, and 18.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_222_0.png)'
