  md: '# Loops


    4. Validate the response.

    5. If the response is invalid the variable''s value is set to null. This enables
    the while loop to repeat.

    6. If the response is valid, the variable''s value is not changed. It continues
    to hold the user''s response. Because the variable''s value is not null, the while
    loop exits.


    In the following example, use the commands


    +   - echo to display a string

    - read to read in the user''s response


    I have not formally introduced these commands, but you might be familiar with
    them.

    For readers who are not familiar with these commands, I''ll cover them in Chapter
    13,

