  md: '$${parameter?:message} substitutes the contents of the *parameter*, but if
    it is empty or undefined, alters the script and gives the *message* as a final
    error. Message might contain unquoted spaces.


    $${parameter:word} if *parameter* is not empty, it substitutes the *word*; otherwise
    it substitutes nothing.


    # Parameter Substitution Only in Korn/Bash


    $${parameter} substitutes the number of characters in the contents of *parameter*.


    $${array[*]} substitutes the number of elements in *array*.


    $${#pattern} if the regular expression pattern given is found at start of the
    contents of *parameter*, it deletes the matching characters and substitutes the
    remainder. The smallest possible match is deleted.


    $${parameter##pattern} same as above but deletes the largest possible match at
    the end of *parameter*.


    $${parameter%pattern} same as above but deletes the smallest match at the end
    of *parameter*.


    $${parameter%%pattern} same as above but deletes the largest match at the end
    of *parameter*.


    # Pattern Matching


    Rules for filename expansion:


    +   * Any word on the command line containing a wildcard is expanded to a list
    of files which matches the pattern word.

    * If no filename matches are found, the pattern word is not substituted.

    * Wildcards cannot match a leading period or a slash.


    # Pattern Wildcards Available in Bourne/Korn/Bash


    +   * matches 0 or more of any character

    * ? matches exactly 1 of any character

    * [list] matches exactly 1 of any character in list

    * [!list] matches exactly 1 of any character not in list'
