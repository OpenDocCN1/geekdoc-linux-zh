- img_proc: true
  md: '# Glossary


    **prompt** When you see a prompt, you can type the name of a command and press
    Enter. In this book, we will use the $ character to indicate the *prompt*.


    **PS2 variable** A shell verbose content is usually the > character. The contents
    of the PS2 variable is displayed by the shell as a secondary prompt that indicates
    the previous command was not complete and the current command line is a continuation
    of that command line.


    **pwd** The pwd command prints the absolute path of the command directory.


    **quoting** Literally, to enclose selected text within some type of quotation
    marks. When applied to shell commands, *quoting* means to disable interpretation
    of special characters by enclosing the character with single or double quotes
    or by escaping the character.


    **read permission** The read permission of a file or directory determines which
    users can view the contents of that file or directory.


    **regular expression** A string that can describe several sequences of characters
    you will encounter. These files store any kind of data. This data may be stored
    in plain text, an application-specific format, or a special binary format that
    the system can execute.


    **relative path** Relative pathnames let you access files and directories by specifying
    a path to that file or directory relative to your current directory.


    **remainder function** The remainder of a division operation, which is the amount
    that is left over and thus not evenly divisible.


    **reserved word** A unquoted word that is used in grouping commands or selectively
    executing them, such as: if, then, else, elif, fi, case, esac, for, while, until,
    do, or done.


    **rm** The command to remove files.


    **scalar variable** A *scalar variable* can hold only one value at a time.


    **sed** The sed command is a stream editor that allows you to modify input lines
    using regular expressions.


    **set group ID (SGID)** The SGID permission causes a script to run with its group
    set to the group of the script, rather than the group of the user who started
    it.


    **set user ID (SUID)** The SUID permission causes a script to run as the user
    who is the owner of the script, rather than the user who started it.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_448_0.png)'
  merge: -1
  pgno: 448
- img_proc: true
  md: 'shell Provides you with an interface to the UNIX system. It gathers input from
    you and executes programs based on that input. After a program has finished executing,
    the shell displays program''s output. The shell is sometimes called a command
    interpreter. See also bash, Bourne shell, C shell, Korn shell, and rsh.


    shell After a shell is started undergoes a phase initialization to set up some
    important parameters. This is usually a two step process that involves the shell
    reading the files /etc/profile and .profile.


    shell or command prompt The single character or set of characters that the UNIX
    displays for which user can enter a command or set of commands.


    shell preprocessing This describes actions taken by the shell to manipulate the
    command line before executing it. This is when filename, variable, command, and
    arithmetic substitution occurs (as covered in Chapter 8, "Substitution")


    shell script A program written using a programming language like those supported
    by Bourne, Korn, or C shells. In general, a script contains a list of commands
    that are executed noninteractively by the shell.


    shell variable A special variable that is set by the shell and is required by
    the shell in order function correctly.


    signal Software interrupts sent to a program to indicate that an event has occurred.
    The events can vary from user requests to illegal memory access errors. Some signals,
    the interrupt signal, indicate that a user has asked the program to do something
    that is not in the usual flow of control.


    signal handler A function that executes when a signal is received by a shell script.
    Usually signal handlers clean up temporary files and then exit.


    simple command A simple command is a command that can execute just by its name
    at the prompt.


    socket file A special file for interacting with the network via the UNIX file
    system.


    STDERR Standard error. A special type of output used for error messages. The file
    descriptor for STDERR is 2.


    STDIN Standard input. User input is read from STDIN. The file descriptor for STDIN
    is 0.


    STDOUT Standard output. The output of scripts is usually to STDOUT. The file descriptor
    for STDOUT is 1.


    subdirectory A directory that is contained within another directory.'
  merge: -1
  pgno: 449
- img_proc: true
  md: '**subprocess** Process running under the control of another, often referred
    to as the parent process. See *process*.


    **subshell** Shell running under the control of another, often referred to as
    the parent shell (typically the login shell). See *shell*.


    **symbolic link or soft link** A special filetype which is a smaller pointer file
    allowing multiple names for the same file. Unlike hard links, symbolic links can
    be made for directories and can be made across filesystems. Commands that access
    the file being pointed to are said to follow the symbolic link. Commands that
    access the link itself do not follow the symbolic link.


    **system call** A C language function that is used to request services from the
    UNIX kernel.


    **tcsh** A C shell-like user interface featuring command-line editing.


    **uninitialized shell** When a shell is started it is uninitialized. This means
    that important parameters required by the shell to function correctly are not
    defined.


    **usage statement** A statement issued by a shell script when one or more of its
    arguments are improperly specified.


    **utility** Utilities are programs, such as who and date, you can run or execute.


    **variable substitution** The process used by the shell to substitute the value
    of a variable, when the variable''s name is specified.


    **wc** The command used to count the words, lines and characters in a file.


    **word** An unbroken set of characters. The shell uses spaces and tabs to separate
    words.


    **write permission** Controls the users who can modify a file.


