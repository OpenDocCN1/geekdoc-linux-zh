  md: '+   - On Solaris and FreeBSD, it is the Bourne shell.

    - On HP-UX, it is the POSIX shell.

    - On Linux, it is the Bourne Again shell.


    # # Shell Initialization


    When the login program executes a shell, that shell is uninitialized. When a shell
    is uninitialized, important parameters required by the shell to function correctly
    are not defined.


    The shell undergoes a phase called initialization to set up these parameters.
    This is usually a two step process that involves the shell reading the following
    files:


    +   - /etc/profile

    - profile


    The process is as follows:


    +   1. The shell checks to see whether the file /etc/profile exists.

    2. If it exists, the shell reads it. Otherwise, this file is skipped. No error
    message is displayed.

    3. The shell checks to see whether the file .profile exists in your home directory.
    Your home directory is the directory that you start out in after you log in.

    4. If it exists, the shell reads it; otherwise, the shell skips it. No error message
    is displayed.


    As soon as both of these files have been read, the shell displays a prompt:


    ```

    $

    ```


    This is the prompt where you can enter commands in order to have them execute.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_45_0.png)


    > The shell initialization process detailed here applies to all Bourne type shells,
    but some additional files are used by bash and ksh.

    You can obtain more information about this process for a particular shell using
    the man command explained later in this chapter.'
