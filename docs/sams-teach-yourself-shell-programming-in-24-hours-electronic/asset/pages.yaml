    # Escaping Metacharacters


    Many times you need to match strings such as

    Peaches $0.89/lbs

    Oil $15.10/barrel


    This string contains three characters with special meanings in regular expressions:


    +   - The dollar character, $

    - The decimal point character, .

    - The per character, /


    If you use an ordinary expression such as the following

    /$[0-9]\.[0-9]*[a-zA-Z]*/

    you are unable to match any string because the expression is garbled. The two
    main

    problems are:


    +   - The first character in this expression is the $ character. Because the $
    matches thenend of the line, this expression tries to look for characters after
    the end of the line.

    This is an impossible pattern to match.

    - There are three slashes. The first two slashes are used as the delimiters for
    the pat-

    tern. The {a-zA-Z]*/ that occurs after this pattern confuses awk and sed.'
