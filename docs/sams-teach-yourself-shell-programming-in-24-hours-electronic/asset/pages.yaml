  md: '# HOUR 2


    # Script Basics


    In Chapter 1, “Shell Basics,” I introduced the concept of a shell and commands.
    I showed you how the shell reads your input and executes the command you requested.


    In this chapter I will explain in detail what the shell is and how it works. You
    will learn how the shell is started during the login process and what happens
    when you log out.


    After I explain this behavior, I will show you how to group commands that are
    normally executed interactively into a file to create a script. Scripts are the
    power behind the shell because they enable you to group commands together to create
    new commands.


    # The UNIX System


    The UNIX system consists of two components:


    +   - Utilities

    - The kernel


    ![](img/21edd8d7854fe7f0c0d03baba9111541_42_0.png)'
  merge: -1
