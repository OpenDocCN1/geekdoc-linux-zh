- img_proc: true
  md: 'I can see from the first line of output that the process runs in the background.
    The output is directed to my screen. If the ls command wants any input (which
    it does not), it goes into a stop state until I move it into the foreground and
    give it the data from the keyboard.


    That first line contains information about the background process—the job number
    and process ID. You need to know the job number to manipulate between background
    and foreground.


    If you run this command yourself, you might notice that you do not get a prompt
    back after the last line of the directory listing. That''s because the prompt
    actually appears immediately after the job/pid line, next to ch0-1.doc. You are
    able to enter a command immediately instead of waiting for ls to finish.


    If you press the Enter key now, you see the following:


    ```

    [1] + Done ls ch0*.doc &


    ```


    The first line tells you that the ls command background process finishes successfully.
    The second is a prompt for another command.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_107_0.png)


    > If you try this command and do not see the completion messages, it might be
    because your shell has been told not to show it to you. When enabled, those messages
    are part of process or job monitoring. You can enable monitoring with the following:


    set -o monitor

    to disable the monitoring messages, you use +o:

    set +o monitor

    You can also check all the shell options with the following:


    set -o


    You see a different completion message if an error occurs. There is no file with
    the name no_such_file in my directory, so if I try to list it with ls, I get an
    error. The command is


    ```

    $ ls no_such_file &

    ```


    resulting in output that looks like


    ```

    [1] 25389

    $ no_such_file: No such file or directory

