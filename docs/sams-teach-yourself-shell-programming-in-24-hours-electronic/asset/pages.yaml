  md: 'Here the input to the Mail command, which becomes the body of the mail message,
    is the file Final_Exam_Answers. In this particular example, a professor might
    perform this function, and the file might contain the answer to a current exam.


    # Here Documents


    An additional use of input redirection in the creation of here documents. A common
    use of here documents is in the generation of email messages within scripts and
    in the generation of files containing the values of all the variables in the script.
    Also, here documents store temporary information. Say you need to send a list
    of phone numbers or URLs to the printer. By using a here document, you can enter
    the information that you want to send to the printer into the here document and
    then send that document to the printer. This is much simpler than using a temporary
    file, which needs to be created and then deleted.


    The general form for a here document is


    ```

    command << delimiter

    document

    delimiter

    ```


    Here the shell interprets the << operator as an instruction to read input until
    it finds a line containing the specified delimiter. All the inputs up to the line
    containing the delimiter are then fed into the standard input of the command.


    The delimiter tells the shell that the here document has completed. Without it,
    the shell continues to read input forever. The delimiter must be a single word
    that does not contain spaces or tabs.


    For example, to print a quick list of URLs, you could use the following here document:


    ```

    lpr << MYURLS

    http://www.csua.berkeley.edu/-ranga/

    http://www.cisco.com/

    http://www.marathon.org/story/

    http://www.gnu.org/

    MYURLS

    ```


    To strip the tabs in this example, you can give the << operator a option.


    You can also combine here documents with output redirection as follows:


    ```

    command > file << delimiter

    document

    delimiter

    ```


    If used in this form, the output of command is redirected to the specified file,
    and the input of command becomes the here document.'
