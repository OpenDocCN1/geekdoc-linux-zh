- img_proc: true
  md: '# The Directory Tree


    To explain the origin and advantages of the directory tree, consider a project
    that requires organization, such as writing a book.


    When you start out, it is easiest to put all the documents related to the book
    in one location. As you work on the book, you might find it hard to locate the
    material related to a particular chapter.


    If you are writing the book with pen and paper, the easiest solution to this problem
    is to take all the pages related to the first chapter and put them into a folder
    labeled "Chapter 1. U." As you write more chapters, you can put the material related
    to these chapters into separate folders.


    In this method, when you finish the book, you will have separate folders. You
    might put all the folders into a box and label that box with the name of the book.
    (Then you can stack the boxes in your closet.)


    By grouping the material for the different chapters into folders and grouping
    the folders into boxes, the multitude of pages required to write a book becomes
    organized and easily accessible. When you want to see Chapter 5 from a particular
    book, you can grab that box from your closet and look only at the folder pertaining
    to Chapter 5.


    You can carry this method over to a project on your computer. When you start out,
    all the files for the book might be in your home directory, but as you write more
    chapters, you can create directories to store the material relating to a particular
    chapter.


    Finally, you can group all the directories for the book into a directory named
    after the book.


    As you can possibly see, this arrangement creates an upside-down tree with the
    root at the top and the directories branching from the root. The files stored
    in the directories can be thought of as leaves.


    This brings upon notion of parent directories and child or subdirectories. For
    example, consider two directories A and B, where directory A contains directory
    B. In this case, A is called the parent of B, and B is called a child of A.


    The depth of the directory tree is limited only by the fact that the absolute
    path to a file cannot have more than 1024 characters. I cover absolute paths later
    in the chapter.


    # Filenames


    In UNIX, every file and directory has a name associated with it. It is referred
    to as the file or directory''s filename.'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'In addition to their filenames, every file and directory is associated with
    the name of its parent directory. When a filename is combined with the parent
    directory''s name, the result is called a pathname. Two examples of pathnames
    are

    /home/ranga/docs/book/ch5.doc

    /usr/local/bin/


    As you can see, each of these filenames consists of several “words” separated
    by the slash (/) character. In UNIX, the slash separates directories, whereas
    the individual words are the names of files or directories. The sum of all the
    words and the / characters makes up the pathname.


    The last set of characters in a pathname is the actual name of the file or directory
    being referred to: The rest of the characters represent its parent directories.
    In the first example, the filename is ch5.doc.


    The name of a file can be up to 255 characters long and can contain any ASCII
    character except /. Generally, the characters used in pathnames are the alphanumeric
    characters (a to Z, A to 9) along with periods (.), hyphens (-), and underscores
    (_).


    Other characters, especially the space, are usually avoided because many programs
    cannot deal with them properly. For example, consider a file with the following
    name:


    # A Farewell To Arms


    Most programs treat this four separate files named A, Farewell, To, and Arms,
    instead of one file. You look at a workaround to this problem in Chapter 9, “Quoting.”


    One thing to keep in mind about filenames is that two files in the same directory
    cannot have the same name. Thus both of the following filenames


    ```

    /home/ranga/docs/ch5.doc

    /home/ranga/docs/ch5.doc

    ```


    refer to the same file, but the following filenames


    ```

    /home/ranga/docs/ch5.doc

    /home/ranga/docs/books/ch5.doc

    ```


    refer to different files because they are located in different directories. In
    addition, because UNIX is case-sensitive, you can have two files in the same directory
    whose names differ only by case. UNIX considers the following


    ```

    /home/ranga/docs/ch5.doc

    /home/ranga/docs/CH5.doc

    ```


    to be different. This often confuses users coming from the Windows or DOS environments.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_72_0.png)'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Pathnames


    In order to access a file or directory, its pathname must be specified. As you
    have seen, a pathname consists of two parts: the name of the directory and the
    names of its parents. UNIX offers two ways to specify the names of the parent
    directory. This leads to two types of pathnames:


    +   - Absolute

    - Relative


    > AN ANALOGY FOR PATHNAMES

    The following statements illustrate a good analogy for the difference between
    absolute and relative pathnames:

    "I live in San Jose."

    "I live in San Jose, California, USA."

    The first statement gives only the city in which I live. It does not give any
    more information, thus the location of my house is relative. It could be located
    in any state or country containing a city called San Jose. The second statement
    fully qualifies the location of my house, thus it is an absolute location.


    # Absolute Pathnames


    An absolute pathname represents the location of a file or directory starting from
    the root directory and listing all the directories between the root and the file
    or directory of interest.


    Absolute pathnames list the path from the root directory, they always start with
    the slash (/) character. Regardless of where the current directory is, an absolute
    path points to any location of file or directory. The following is an example
    of an absolute pathname:


    ```

    /home/ranga/work/bugs.txt

    ```


    This absolute path tells you that the file bugs.txt is located in the directory
    work, which is located in the directory ranga, which in turn is located in the
    directory home. The slash at the beginning of the path tells you that the directory
    home is located in the root directory.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Working with Directories


    # Pathnames


    A relative pathname enables you to access files and directories by specifying
    a path to that file or directory within your current directory. When your current
    directory changes, the relative pathname to a file can also change.


    To find out what the current directory is, use the pwd (print working directory)
    command, which prints the name of the directory in which you are currently located.
    For example


    ```

    $ pwd

    /home/ranga/pub

    ```


    When you''re specifying a relative pathname, the slash character is not present
    at the beginning of the pathname. This indicates that a relative pathname is being
    used instead of an absolute pathname. The relative pathname is a list of the directories
    located between your current directory and the file or directory you are representing.


    If you are pointing to a directory in your pathname that is below your current
    one, you can access it by specifying its name. For example, the directory name:


    docs/

    refers to the directory does located in the current directory.


    In order to access the current directory''s parent directory or other directories
    at a higher level in the tree than the current level, use the special name of
    two dots (..).


    The UNIX file system uses two dots (..) to represent the directory above you in
    the tree, and a single dot (.) to represent your current directory.


    Look at an example that illustrates how relative pathnames are used. Assume that
    the current directory is


    ```

    /home/ranga/work

    ```


    Then the relative pathname


    ```

    ../docs/ch5.doc

    ```


    represents the file


    ```

    /home/ranga/docs/ch5.doc

    ```


    whereas


    ```

    ./docs/ch5.doc

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_74_0.png)'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'represents the file

    /home/ranga/work/docs/ch5.doc


    You can also refer to this file using the following relative path:

    docs/ch5.doc


    As mentioned previously, you do not have to append the . / to the beginning of
    path-names that refer to files or directories located within the current directory
    or one of its subdirectories.


    # Switching Directories


    Now that you have covered the basics of the directory tree, look at moving around
    the tree using the cd (change directory) command.


    # Home Directories


    First print the working directory:


    ```

    $ pwd

    /home/ranga

    ```


    This indicates that I am in my home directory. Your home directory is the initial
    directory where you start when you log in to a UNIX machine. Most systems use
    either /home or /users as directories under which HOME directories are stored.
    On my system I use /home.


    The easiest way to determine the location of your home directory is to do the
    following:


    ```

    $ cd

    $ pwd

    /home/ranga

    ```


    When you use the cd command without arguments, it changes the current directory
    to your home directory. Therefore, after the cd command completes, the pwd command
    prints the working directory that is your home directory.


    # Changing Directories


    You can use the cd command to do more than change to a home directory: You can
    use it to change to any directory by specifying a valid absolute or relative path.
    The syntax is as follows:


    ```

    cd directory

    ```'
