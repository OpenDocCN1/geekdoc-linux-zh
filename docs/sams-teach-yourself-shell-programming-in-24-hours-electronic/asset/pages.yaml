  md: '# Filtering Text Using Regular Expressions


    Try the following sed command:


    ```

    $ sed /0\.[0-9]$$/p fruit_prices.txt

    ```


    Here you tell sed to print all the lines that match the pattern:


    ```

    /0\.[0-9][0-9]$/

    ```


    This means that lines that end in prices as 0.89 and 0.99 should be printed.

    Don''t want lines that end in prices such as 2.20 to be printed.


    Now, look at the output:


    | Fruit | Price/lbs |

    | Banana | 0.89 |

    | Banana | 0.89 |

    | Paech | 0.79 |

    | Paech | 0.79 |

    | Kiwi | 1.50 |

    | Pineapple | 1.29 |

    | Apple | 0.99 |

    | Apple | 0.99 |

    | Mango | 2.20 |


    You find the lines for fruit with prices less than a dollar printed twice, whereas

    lines for fruit with prices greater than a dollar are printed only once.


    This demonstrates the default behavior of sed—it prints every input line to the
    output.

    To avoid this, you can specify the -n option to sed as follows:


    ```

    $ sed -n ''/0\.[0-9][0-9]$$/p fruit_prices.txt

    ```


    This changes the output as follows:


    | Banana | 0.89 |

    | Paech | 0.79 |

    | Apple | 0.99 |


    # Deleting Lines


    Say that you run out of mangos and you need to delete them from the list. To accomplish

    this task, you need to use the sed command d (d as in delete):


    ```

    /pattern/d

    ```


    Here pattern is a regular expression.


    In this case you can use the following sed command:


    ```

    $ sed ''/[Mm]ango/d'' fruit_prices.txt

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_270_0.png)'
