    # # Hidden Files


    So far you used ls to list visible files and directories, but ls can also list

    invisible or hidden files and directories. An invisible file is one whose first
    char-

    acter is the dot or period character (.). UNIX programs (including the shell)
    use most of

    these files to store configuration information. Some examples of hidden files

    include the files


    +   - .profile, the Bourne shell (sh) initialization script

    - .kshrc, the Korn shell (ksh) initialization script

    - .cshrc, the C shell (csh) initialization script

    - .hosts, the remote shell configuration file


    All files that do not start with the . character are considered visible.


    To list invisible files, specify the -a option to ls:


    ```

    $ ls -a

    ```


    The directory listing now looks like this:


    | .profile | docs | test_results |

    | --- | --- | --- |

    | .hosts | hosts | users |

    | .emacs | bin | work |

    | .exrc | ch07 | lib res.01 |

    | .kshrc | ch07.bak | hw1 hw2 res.03 |'
