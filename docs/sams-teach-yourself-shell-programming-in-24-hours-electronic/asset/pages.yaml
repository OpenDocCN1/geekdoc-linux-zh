  md: '# The Special Patterns: BEGIN and END


    In the awk command

    awk ''/ ^*$/ { x=x+1; print x ; } ''


    you print out the value of x each time it is incremented. Thus the output looks
    like this:


    ```

    urls.txt

    1

    2

    3

    4

    ```


    It would be much nicer if you could print the total number of empty lines. You
    can do this by using the special patterns BEGIN and END.


    As I stated before, the general syntax of a command in an awk script is

    /pattern/ { actions }


    Usually pattern is a regular expression, but pattern can also be one of the special
    patterns BEGIN and END. When these patterns are used, the general form of an awk
    command becomes


    ```

    awk

    BEGIN { actions }

    /pattern/ { actions }

    /pattern/ { actions }

    END { actions }

    files

    ```


    The BEGIN pattern must be the first pattern that is specified, and the END pattern
    must be the last pattern that is specified. Between the BEGIN and END patterns
    you can have any number of the following pairs:


    ```

    /pattern/ { action }

    ```


    Both the BEGIN and the END pattern are optional, so


    +   - When the BEGIN pattern is specified, awk executes its actions before reading
    any input.

    - When the END pattern is specified, awk executes its actions before it exits.


    If a program consists of only a BEGIN pattern, awk does not read any lines before
    exiting.


    When these patterns are given the execution of an awk, the script is as follows:


    +   1. If a BEGIN pattern is present, the script executes the actions it specifies

    2. Reads an input line and parses it into fields'
