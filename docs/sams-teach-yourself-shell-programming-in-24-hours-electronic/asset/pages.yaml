  md: '# Quoting


    command arguments, so the command running never sees the quoting character. Here
    is a different example where quoting is needed:


    echo You owe $1250


    This seems like a simple echo statement, but notice that the output is not what
    you wanted because $1 is a special shell variable:


    You owe 250


    The $ sign is one of the metacharacters, so it must be quoted to avoid special
    handling of the shell:


    echo You owe \1250


    Now you get the desired output:


    You owe $1250


    Notice the \ quoting character is not present in the output.


    # Using Single Quotes


    Here is an echo command that must be modified because it contains many special
    characters:


    echo <-$1250.\*\*; (update?) [y|n]


    Putting a backslash in front of each special character is tedious and makes the
    line difficult to read:


    echo \-$1250.\*\*|\> \(update?\) \[y|\\]


    There is an easy way to quote a large group of characters. Put a single quote
    ('''') at the beginning and at the end of the string:


    echo ''\-$1250.\*\*; (update?) [y|n]


    Any characters within single quotes are quoted just as if a backslash is in front
    of each character. So now this echo command displays properly.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_150_0.png)


    > Quoting regular characters is harmless. In the previous example, you put single
    quotes around a whole string, quoting both the special characters and the regular
    letters that need no quoting. It does not hurt to quote regular characters because
    quoting takes away any special meaning from a character and does not mind if that
    character had no special meaning to begin with. This is true for the backslash,
    single quotes, and double quotes.'
