    # Exporting Variables in ksh and bash


    A second form for exporting variables is supported by ksh and bash

    export name=value

    In this form, the variable specified by name is assigned the given value. Then
    that variable is marked for export. In this form, you can write the previous example
    as

    export PATH=/sbin:/bin

    In bash and ksh, any combination of name or name=value pairs can be given to the
    export command. For example, the command

    export FMHOME=/usr/frame CLEARHOME=/usr/atria PATH

    assigns the values to the variables FMHOME and CLEARHOME and exports the variables
    FMHOME, CLEARHOME, and PATH.


