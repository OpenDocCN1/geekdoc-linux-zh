    # How can I forward all the arguments given to my script to another command?


    A common task for shell programmers is writing a wrapper script for command. A
    wrapper script might need to define a set of variables or change the environment
    in some way before a particular command starts executing.


    When writing wrapper scripts, you will need to forward all the arguments given
    to your script to a command. Usually the following is sufficient:


    ```

    command $@

    ```


    Here command is the name of the command if no arguments are you want to execute.


    The one problem with the shell will is that if arguments were specified to your
    script, some versions of the shell will expand "$@" to "*". If no arguments were
    specified, you want to execute command, not command "*. To avoid this problem,
    use the form:


    ```

    command $@:+"$@"

    ```


    Here you are using one of the forms of variable substitution discussed in Chapter
    8, "Substitution". In this case you check to whether variable $@ has a value.
    If it does, you substitute the value "$@ for it. If your script was not given
    any command line arguments, $@ will be null; thus no value will be substituted.


    # How do I use the value of a shell variable in a sed command?


    The simplest method to use variables in a sed command is to enclose the sed command
    in double quotes instead of single quotes (''''). Because the shell performs substitution
    on double-quoted strings, the shell will substitute the value of any variables
    you specify before sed executes.


    For example, the command


    ```

    sed /DEL/d file1 > file2

    ```


    deletes all the lines in file1 that contain the value stored in the variable DEL.'
