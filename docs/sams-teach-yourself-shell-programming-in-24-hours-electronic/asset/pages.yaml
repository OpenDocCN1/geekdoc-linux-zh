  md: '# Dealing with Signals


    Here you are sending the kill signal to the program running with process ID 1001.
    In this case you are using the numeric value of the signal, instead of the name
    of the kill signal. By convention, the numeric value of the kill signal, 9, is
    always used for it.


    The kill signal has the special property that it cannot be caught, thus any process
    receiving this signal terminates immediately “with extreme prejudice.” This means
    that a process cannot cleanly exit and leave leave data that it was using in a
    corrupted state. You should only use this signal to terminate a process when all
    the other signals fail to do.


    # Dealing with Signals


    A program or script can handle a signal in three different ways:


    +   - Do nothing and let the default action occur. This is the simplest method
    for a script to deal with a signal.

    - Ignore the signal and continue executing. This method is not the same as doing
    nothing, ignoring a signal requires the script to have some code that explicitly
    ignores signals.

    - Catch the signal and perform some signal-specific commands. In this method the
    script has a special routine that executes when a signal is received. This is
    the most complex and powerful method of dealing with signals.


    The first method for dealing with a signal requires no additional code in your
    shell script. This is the default behavior for all shell scripts that do not explicitly
    handle signals. All the scripts that you have looked at so far handle signals
    using this method.


    In this section you will look at the second and third methods of dealing with
    signals.


    # The trap Command


    The trap command sets and unsets the actions taken when a signal is received.
    Its syntax is


    trap name signals


    Here name is a list of commands or the name of a shell function to execute when
    a signal in the list of specified signals is received. If name is not given, trap
    resets the action for the given signals to be the default action.


    There are three common uses for trap in shell scripts:


    +   - Clean up temporary files

    - Always ignore signals

    - Ignore signals only during critical operations


    ![](img/21edd8d7854fe7f0c0d03baba9111541_328_0.png)'
