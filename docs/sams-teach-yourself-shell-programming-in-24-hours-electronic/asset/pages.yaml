  md: '# Appending to a File


    Overwriting a file by redirecting output to it is often undesirable. Fortunately,
    the shell provides a second form of output redirection with the >> operator, which
    appends the output to a file. The basic syntax is


    ```

    command >> file

    list >> file

    ```


    In these forms, output is appended to the end of the specified file, or the specified
    file is created if it does not exist. For example, you can prevent the loss of
    data from the file mylog each time a data is added, by using the following command:


    ```

    { date; uptime; who; } >> mylog

    ```


    If you view the contents of 14:48, now you find that it contains the output of
    both lists:


    ```

    11:15am up 79 days, 14:48, 5 users, load average: 0.00, 0.00, 0.00

    ranga tty1 Aug 26 14:12

    ranga tty2 Aug 26 14:13 (::0)

    ranga tty0 Oct 27 19:42 (::0)

    amma tty3 Oct 30 08:20 (localhost)

    ranga tty4 Nov 14 11:13 (rishi.bosland.u)

    Sat Nov 14 11:15:54 PST 1998

    11:16am up 79 days, 14:48, 5 users, load average: 0.00, 0.00, 0.00

    ranga tty1 Aug 26 14:12

    ranga tty2 Aug 26 14:13 (::0)

    ranga tty0 Oct 27 19:42 (::0)

    amma tty3 Oct 30 08:20 (localhost)

    ranga tty4 Nov 14 11:13 (rishi.bosland.u)

    ```


    # Redirecting Output to a File and the Screen


    In certain instances, you may need to redirect the output of a script to a file
    and onto the terminal. An example of this is shell scripts that are required to
    produce a log file of their activities. For interactive scripts, the log file
    cannot just contain the script''s output redirected to a file.


    To redirect output to a file and the screen, use the tee command. The basic syntax
    is as follows:


    ```

    command | tee file

    ```


    Here command is the name of a command, such as ls, and file is the name of the
    file where you want the output. For example, the command:


    ```

    $ date; tee now

    ```


    produces the following output on the terminal:


    ![](img/21edd8d7854fe7f0c0d03baba9111541_218_0.png)'
