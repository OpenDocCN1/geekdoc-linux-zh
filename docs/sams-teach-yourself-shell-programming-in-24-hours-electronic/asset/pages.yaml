  md: 'You can manually set FS to any other characters in order to influence awk breaks
    up an input line. Usually, this character is changed when you look through system
    data-bases, such as /etc/passwd. The two mechanisms available for changing FS
    are


    +   - Manually resetting FS in a BEGIN pattern

    - Specifying the -F option to awk


    As an example, set FS to a colon (:). You can use the following BEGIN


    ```

    BEGIN { FS=":" }

    ```


    or the following awk invocation:


    ```

    awk -F:''{ ... }''

    ```


    The major difference between the two is that the -F option enables you to use
    a shell variable to specify the field separator dynamically as follows


    ```

    $ MYFS=; export MYFS; awk -F$MYFS ''{ ... }''

    ```


    whereas the BEGIN block forces you to hard code the value of the field separator.


    A simple example that demonstrates the use of changing FS is the following:


    ```

    $ awk ''BEGIN {FS=":" } { print $1, $6; }'' /etc/passwd

    ```


    This command prints each user''s username and home directory. It can also be written
    as follows:


    ```

    $ awk -F: ''{ print $1, $6; }'' /etc/passwd

    ```


    A short excerpt of the output on my system is as follows:


    ```

    root /

    daemon /

    bin /usr/bin

    sys /

    adm /var/adm

    ranga /home/ranga

    ```


    # Allowing awk to Use Shell Variables


    Most versions of awk have no direct way of accessing the values of environment
    variables that are set in the shell. In order for awk to use these variables,
    you have to convert them to awk variables on the command line.


    The basic syntax for setting variables on the command line is


    ```

    awk ''script'' awkvar1=value awkvar2=value files

    ```'
