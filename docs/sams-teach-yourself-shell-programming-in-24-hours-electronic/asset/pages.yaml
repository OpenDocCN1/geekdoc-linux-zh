    # Maintaining an Address Book


    I often get business cards or email messages from people I need to keep in touch
    with. Sometimes I lose these email messages or business cards, leading to problems
    when I need to contact someone important.


    A nice solution to this problem would be to store all the contact information
    on my computer so that I can access and manipulate it easily. In this section,
    I will look at developing a set of scripts that work together to maintain a simple
    address book.


    The address book will store the following information:


    +   * Name

    * Email address

    * Postal address

    * Phone number


    Each of these pieces of information can contain almost any character including
    spaces or other characters such as the dash (-), period (.), or single quote ('').
    Thus you need to hold the information in a format that allows for these characters.
    A commonly used format is to separate each piece of information using the colon
    (:) character. For example, the following information:


    Sriranga Veeraraghavan

    ranga@soda.berkeley.edu

    1136 Wunderlich Dr. San Jose CA 95129

    408-444-4444


    can be stored as:


    Sriranga Veeraraghavan:ranga@soda.berkeley.edu:1136 Wunderlich Dr.

    San Jose CA 95129:408-444-4444


    Here any special character, except the colon, can be used. Also this format enables
    you to make any field optional. For example,


    ```

    :vathsa@kanchi.bosland.us::408-444-4444

    ```


    could indicate that only the email address and phone number were known for a particular
    person.'
