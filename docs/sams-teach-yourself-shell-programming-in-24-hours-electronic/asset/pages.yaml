    You might have noticed that the tenth most common word in this chapter is the
    single quote character. You might be wondering what''s going on because I said
    you took care of the punctuation with the very first tr command.


    Well, I lied (sort of of). You took care of all the characters that would fit
    between quotes, and a single quote won''t fit.


    So why not backlash escape escape that sucker? Well, not all versions of the shell
    handle that properly.


    So what''s the solution?


    The solution is to use the predefined character sets in tr. The tr command knows
    several character classes, and the punctuation class is one of them. Table 15.1
    gives a complete list of the character class names.


    # Table 15.1 CHARACTER CLASSES UNDERSTOOD BY THE TR COMMAND


    | Class | Description |

    | --- | --- |

    | alphan | Letters and digits |

    | alpha | Letters |

    | blank | Horizontal whitespace |

    | cntrl | Control characters |

    | digit | Digits |

    | graph | Printable characters, not including spaces |

    | lower | Lowercase letters |

    | print | Printable characters, including spaces |

    | punct | Punctuation |

    | space | Horizontal or vertical whitespace |

    | upper | Uppercase letters |

    | xdigit | Hexadecimal digits |


    The way to invoke tr with one of these character classes is


    ```

    tr ''[:classname:]'' ''set2''

    ```'
