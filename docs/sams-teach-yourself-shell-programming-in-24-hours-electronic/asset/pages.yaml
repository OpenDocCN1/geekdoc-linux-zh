- img_proc: true
  md: "This loop would continue to display numbers forever. A loop that executes ever\
    \ without terminating executes an infinite number of times. For this reason, such\
    \ loops are called infinite loops.\n\nIn most cases infinite looping is not desired\
    \ and stems from programming errors, but in certain instances it can be useful.\
    \ For example, say that you need to wait for a particular event, such as someone\
    \ logging on to a system, to occur.\n\nYou can use an infinite loop to check every\
    \ few seconds whether the event has occurred. Because you don't know how many\
    \ times you need to execute the loop, when the event occurs, you can exit the\
    \ infinite loop using the break command.\n\nIn sh, you can create infinite loops\
    \ using the while loop. Because a while loop executes list while command is true,\
    \ specifying command as either or /bin/true causes the loop to execute.\n\nThe\
    \ basic syntax of the infinite while loop is\n\n```\nwhile :\ndo\n  list\ndone\n\
    ```\n\nIn infinite loops, the while loop usually exits from within list via the\
    \ break command, which enables you to exit any loop immediately.\n\nConsider the\
    \ following interactive script that reads and executes commands:\n\n```\nwhile\
    \ :\ndo\n  read CMD\n  case $CMD in\n    [qQ]|[qQ][UU][iI][tT]) break;\n    *\
    \ process $CMD;\nesac\n```\n\nIn this loop you read a command at a beginning of\
    \ each iteration. If that command is either q or Quit, the loop exits; otherwise,\
    \ the loop tries to process the command.\n\n# Breaking Out of Nested Loops\n\n\
    The break command also accepts as an argument an integer, greater or equal to\
    \ 1, indicating the number of levels to break out of. This feature is useful when\
    \ nested loops are being used. Consider the following nested loops:\n\n```\nfor\
    \ i in 1 2 3 4 5\ndo\n  mkdir -p /mnt/backup/docs/$ch0{}\n```"
  merge: -1
  pgno: 189
