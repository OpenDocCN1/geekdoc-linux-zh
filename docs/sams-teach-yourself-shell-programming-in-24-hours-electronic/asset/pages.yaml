  md: "# Processes\n\nThis tells me that my terminal session is being handled by in.telnetd\
    \ (the telnet da-mon) that owns, or is the parent of, my Korn shell command interpreter.\n\
    \nThere is a parent-child relationship between processes. in.telnetd is the parent\
    \ of ksh, which is the child of in.telnetd but the parent of ps and grep.\n\n\
    When a child is forked, or created from, it receives a copy of the parent's envi-ronment,\
    \ including environment variables. The child can change its own environment, but\
    \ those changes do not reflect in the parent and go away when the child exits.\n\
    \n# Job ID Versus Process ID\n\nBackground and suspended processes are usually\
    \ managed via job number (job ID). This number is different from the process ID\
    \ and is used because it is shorter. In add-tion, a job can consist of multiple\
    \ processes running in series or at the same time, in par-allel, using the job\
    \ ID is easier than tracking the individual processes.\n\n# Subshells\n\nWhenever\
    \ you run a shell script, in addition to any commands in the script, another copy\
    \ of the shell interpreter is created. This new shell is known as a subshell,\
    \ just as a direc-tory contained in one or another known as a subdirectory.\n\n\
    The best way to show this is with an example. I created a script known as psit\
    \ and gave it execute permissions. This script runs ps and exits in the following\
