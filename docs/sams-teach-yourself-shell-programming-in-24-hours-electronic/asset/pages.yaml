- img_proc: true
  md: 'Table 6.1 shows the meaning of each of these columns.


    # TABLE 6.1 PS -F COLUMNS


    | Column Heading | Description |

    | --- | --- |

    | UID | User ID that this process belongs to (the person running it). |

    | PID | Process ID. |

    | PPID | Parent process ID (the ID of the process that started it). |

    | C | CPU utilization of process. |

    | unlabeled | Nice value—used in calculating process priority. |

    | STIME | Process start time (when it began). |

    | CMD | The command that started this process. with -f is different from CMD without
    it; it shows any command line options and arguments |


    Note that the PPID of all my commands is 3662, who is the pid of ksh. Everything
    I runs under ksh.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_115_0.png)


    > You might be wondering why TIME changed for third_one. Between the time I entered
    the ps and the ps -f commands, third_one used some CPU time—two seconds. On larger
    UNIX servers, a lot of work can be done with very little CPU time. That''s why
    the ps command itself is showing with zero CPU time; it used time, but not enough
    to round to one second.


    Two more common options are -e (for every) and -u (for user). The -e option is
    handy if you want to see whether the database is running or who is playing Zork
    (an old text-based computer game). Because many processes run on a busy system,
    it is common to pipe the output of ps -e to a text filter like grep (see Chapter
    15, “Text Filters”). The -u option is handy if you want to see what a specific
    user is doing—are they busy or do they have time to chat; is your boss busy or
    checking to make sure you''re playing Zork? With -u, you specify the user you
    want to list after the -u.


    You can combine the -f option with -e or -u, but you can combine -e with -u.

    Table 6.2 shows more BSD ps command options.'
