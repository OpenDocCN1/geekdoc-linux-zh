  md: '# HOUR 15


    # Text Filters


    Shell scripts are often called on to manipulate and reformat the output from commands
    that they execute. Sometimes this task is as simple as displaying only part of
    the output by filtering out certain lines. In most instances, the processing required
    is much more sophisticated.


    In this chapter, you will look at several commands that are used heavily as text
    filters in shell scripts. These commands include


    +   * head

    * tail

    * grep

    * uniq

    * tr


    I will also show you how to combine these commands to filter text in extremely
    powerful ways.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_242_0.png)'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# The head and tail Commands


    In Chapter 3, "Working with Files," you looked at viewing the contents of a file
    using the cat command. This command enables you to view an entire file, but often
    you need more control over lines that are displayed. The head and tail commands
    provide some of this control.


    # The head Command


    The basic syntax for the head command is


    ```

    head [-n lines] files

    ```


    Here files is the list of the files you want the head command to process. Without
    the -n lines option, the head command shows the first 10 lines of its standard
    input. This option shows the specified number of lines instead.


    Although this command is useful for viewing the tops of large README files, its
    real power happens in daily applications. Consider the following problem. I need
    to generate a list of the five most recently accessed files in my public HTML
    files directory. What is the easiest solution?


    It''s easy to devise a solution by breaking the problem down. First, I generate
    a list of my public HTML files using the following command:


    ```

    $ ls -1 /home/ranga/public_html

    ```


    In my case, this generates the following list of files and directories:


    ```

    RCS

    cgi-bin

    downloads

    humor

    images

    index.html

    misc

    projects

    school

    ```


    Next, I need to sort the list by the date of the last access. I can do this by
    specifying -ut (sort by last accessed time) option to the ls command:


    ```

    $ ls -1ut /home/ranga/public_html

    ```


    The output now changes as follows:


    ```

    RCS

    humor

    misc

    ```'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'downloads

    images

