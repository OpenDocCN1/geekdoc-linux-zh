- img_proc: true
  md: "This command achieves the same result because mkdir executes only if test returns\
    \ true. test returns true only if the directory $HOME/bin does not exist.\n\n\
    # The case Statement\n\nThe case statement is the other major form of flow control\
    \ available in the shell. In this section 1 I explain its usage.\n\nThe basic\
    \ syntax is\n\n```\ncase word in\n  pattern1)\n    list1\n    ;;\n  pattern2)\n\
    \    list2\n    ;;\nesac\n```\n\nHere the strong word is compared against every\
    \ pattern until a match is found. The list following the matching pattern executes.\
    \ If no matches are found, the case statement exits without performing any action.\
    \ There is no maximum number of patterns, but the minimum is one.\n\nWhen a list\
    \ executes, the command ;; indicates that program flow should jump to the end\
    \ of the entire case statement. This is similar to break in the C programming\
    \ language.\n\nSome programmers prefer to use the form\n\n```\ncase word in\n\
    \  pattern1) list1 ;;\n  pattern2) list2 ;;\nesac\n```\n\nThis form should be\
    \ used only if the list of commands to be executed is short.\n\n# A case Statement\
    \ Example\n\nConsider the variable declaration and case statement:\n\n```\nFRUIT=kiwi\n\
    case \"FRUIT\" in\n  apple) echo \"Apple pie is quite tasty.\" ;;\n  banana) echo\
    \ \"I like banana nut bread.\" ;;\n  kiwi) echo \"New Zealand is famous for kiwi.\"\
    \ ;;\nesac\n```"
  merge: -1
  pgno: 175
- img_proc: true
  md: "# Flow Control\n\nThe execution of the case statement is as follows:\n\n+ \
    \  1. The string contained in the variable FRUIT is expanded to kiwi.\n2. The\
    \ string kiwi is compared against the first pattern, apple. Because they don't\
    \ match, you go to the next pattern.\n3. The string kiwi is compared against the\
    \ next pattern, banana. Because they don't match, you go to the next pattern.\n\
    4. The string kiwi is compared against the final pattern, kiwi. Because they match,\
    \ the following message is produced:\n   New Zealand is famous for kiwi.\n\n#\
    \ Using Patterns\n\nIn the previous example, you used fixed strings as the pattern.\
    \ If used in this fashion the case statement degenerates into an if statement.\
    \ For example, the statement\n\n```\nif [ \"FRUIT\" = apple ]; then\n    echo\
    \ \"Apple pie is quite tasty\"\nelif [ \"FRUIT\" = banana ]; then\n    echo \"\
    I like banana nut bread.\"\nelif [ \"FRUIT\" = kiwi ]; then\n    echo \"New Zealand\
    \ is famous for kiwi.\"\n```\n\nfi is verbose, but the real power of the case\
    \ statement does not lie in simplifying statements. The power lies in the fact\
    \ that it patterns to perform matching.\n\nA pattern is a string that consists\
    \ of regular characters and special wildcard characters. The pattern determines\
    \ whether matter matches.\n\nThe patterns can use the same special characters\
    \ as patterns for pathname expansion covered in Chapter 8, \"Substitution,\" along\
    \ with the operator, †. Some default actions can be performed by giving the *\
    \ pattern, which matches anything.\n\nAn example of a simple case statement that\
    \ uses patterns\n\n```\ncase \"TERM\" in\n    *term)\n        TERM=xterm;\n  \
    \      network=dialup|unknown|vt[0-9][0-9];\n        TERM=vt100\nesac\n```\n\n\
    Here the string contained in TERM is assigned the value xterm. If this string\
    \ ends with the string, TERM is assigned the value xterm. Otherwise, TERM is compared\
    \ against the strings network, dialup, unknown, and vXXX, where XXX is three digit\
    \ number, such as 102. If one of these strings matches, TERM is set to vt100.\n\
    \n![](img/21edd8d7854fe7f0c0d03baba9111541_176_0.png)"
