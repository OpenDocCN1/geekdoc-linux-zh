- img_proc: true
  md: 'Utilities are programs you can run or execute. The programs who and date that
    you saw in the previous chapter are examples of utilities. Almost every program
    that you know is considered a utility.


    Commands are slightly different than utilities. The term utility refers to the
    name of a program, whereas the term *command* refers to the program and arguments
    you specify to that program to change its behavior. You might see the term *command*
    used instead of the term *utility* for simple commands, where only the program
    name to execute is given.


    The kernel is the heart of the UNIX system. It provides utilities with a means
    of accessing a machine''s hardware. It also handles the scheduling and execution
    of commands.


    When a machine is turned off, both the kernel and the utilities are stored on
    the machine''s hard disks. But when the computer is booted, the kernel is loaded
    from disk into memory. The kernel remains in memory until the machine is turned
    off.


    Utilities, on the other hand, are stored on disk and loaded into memory when they
    are executed. For example, when you execute the command


    $ who


    the kernel loads the who command from the machine''s hard disk, places it in memory
    and executes it. When the program finishes executing, it remains in the machine''s
    memory for a short period of time before it is removed. This enables frequently
    used commands to execute faster. Consider what happens when you execute the date
    command three times:


    ```

    $ date

    Sun Dec 27 09:42:37 PST 1998

    $ date

    Sun Dec 27 09:42:38 PST 1998

    $ date

    Sun Dec 27 09:42:39 PST 1998

    ```


    The first time the date command can be loaded from the machine''s hard disk, but
    the second and third time the date command usually remains in the machine''s memory
    allowing it to execute faster.


    The shell is a program similar to the who command. The main difference is that
    the shell is loaded into memory when you log in.


    # Logging In


    When you first connect to a UNIX system, you usually see a prompt such as the
    following:


    login:'
