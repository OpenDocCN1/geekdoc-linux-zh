  md: '![](img/21edd8d7854fe7f0c0d03baba9111541_230_0.png)


    # # HOUR 14


    # # Functions


    Shell functions provide a way of mapping a name to a list of commands. Shell functions
    are similar to subroutines, procedures, and functions in other programming languages.


    Think of them as miniature shell scripts that enable a name to be associated with
    a set of commands. The main difference is that a new instance of the shell begins
    in order to run a shell script, whereas functions run in the current shell.


    # # Creating and Using Functions


    The formal definition of a shell function is as follows:


    ```

    name () { list ; }

    ```


    A function binds a *name* to the *list* of commands that composes the body of
    the function. The ( and ) ) characters are required at the function definition.

    The following examples illustrate valid and invalid function definitions:


    ```

    ls() { ls -1 ; } # valid

    ls { ls -1 ; } # invalid

    ```'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'In this example, the first definition is valid but the second one is not because
    it omits the parentheses around the string ls1.


    This example also demonstrates a common use of functions. Because the original
    shell, sh, did not have the alias keyword common to more recent shells, all aliases
    were defined in terms of shell functions. A frequently encountered example of
    this is the source command. The sh equivalent is the . command. Many converts
    from c use the following command to simulate the source command:


    ```

    source() { . "$"; }

    ```


    As this shows, shell functions have a separate set of arguments than the shell
    script to which they belong. You explore this feature later in the chapter.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_231_0.png)


    An important feature of shell functions is that you can use them to replace binaries
    or shell built-ins of the same name.

    An example of this is

    cd ( chdir $1:$HOME ); PS1=\$pwd\$ * ; export PS1 ; )

    This function replaces the cd command with a function that changes directories
    but also sets the primary shell prompt, PS1, to include the current directory.


    # Invoking a Function


    To invoke a function, only its name is required, thus typing


    $ ls1


    on the command line executes the ls1() function, but typing


    $ ls1()


    does not work because sh interprets this as a redefinition of the function by
    the name ls1. In most versions of the shell, typing ls1() results in a prompt
    similar to the following-


    >


    This is a prompt produced by the shell when it expects you to provide more input.
    Here the input it expects it is the body of the function ls1.


    # Function Examples


    In this section you will look at two examples of how functions are used to gain
    a better understanding of their role in shell scripting.'
  merge: -1
  pgno: 231
- img_proc: true
  md: "# Listing Your Path\n\nA simple task that is well-suited to a function is listing\
    \ the current value of your PATH, with each dictionary listed on a single line.\
    \ The basic shell code is\n\n```\nOLIFS=\"$IFS\"\nIFS=\nfor DIR in $PATH ; do\
    \ echo $DIR ; done\nIFS=\"$OLIFS\"\n```\n\nHere you use the value of IFS in the\
    \ variable OLDFS and then set IFS to : Because IFS is the Internal Field Separator\
    \ for the shell, you can use the for loop cycle through the individual entries\
    \ in PATH. When you are finished, restore the value of IFS.\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_232_0.png)\n\
    \n> The shell uses the value of the variable IFS to split a string into separate\
    \ words. Normally it is set to the space and tab character, enabling the shell\
    \ to figure out that the following string\n\nthis is a string\n\ncontains four\
    \ words. The shell uses the value of IFS to determine how many options are supplied\
    \ to a command, script, or function and how many items are specified for a loop.\n\
    \nIn the previous example, you set the value of IFS to be the colon character.\
    \ This means that the shell sees four words in the following string:\n\nthis:is:a:string\n\
    \nTo wrap this up in a function, insert the function name and the brackets as\
    \ follows:\n\n```\nlpath() {\n  OLIFS=\"$IFS\"\n  IFS=\n  for DIR in $PATH ; do\
    \ echo $DIR ; done\n  IFS=\"$OLIFS\"\n}\n```\n\nNow you can run the function as\
    \ follows:\n\n$ lpath\n\nOn my system the output is\n\n```\n/sbin\n/bin\n/usr/bin\n\
    /usr/sbin\n/opt/bin\n/usr/ucb\n/usr/ccs/bin\n/usr/openwin/bin\n```\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_232_1.png)"
  merge: -1
  pgno: 232
- img_proc: true
  md: "One of the main uses of this function is to check whether a particular directory\
    \ is in your PATH. For example, to check whether /usr/dt/bin is in my path, I\
    \ can do the following:\n\n```\n$ lpath | grep \"/usr/dt/bin\"\n```\n\n# Tailoring\
    \ Your Path\n\nAt many companies and schools, a user's home directory is accessible\
    \ from many machines running different versions of UNIX. A problem that I face\
    \ every day is using my shell initialization script .profile, on Linux, Solaris,\
    \ FreeBSD, and HP-UX machines.\n\nAlthough many issues arise cross-platform initialization\
    \ scripts, one of the largest issues is getting your PATH variable set correctly.\
    \ Because each UNIX platform stores commands in different directories, your initialization\
    \ script must be able to tailor the value of the PATH variable. This problem has\
    \ four possible solutions:\n\n+   - Maintain UNIX version-specific initialization\
    \ files.\n- Maintain UNIX version-specific sections in your initialization files.\n\
    - Use the same PATH on all versions of UNIX, by including all possible directories\
    \ of interest on all versions. This solution relies on the fact that the shell\
    \ ignores directories in the path that do not exist.\n- Set a different PATH depending\
    \ on the existence of individual directories.\n\nThe first two solutions are difficult\
    \ to maintain. Each change or new UNIX version that you have to work with means\
    \ that you have to create either a new initialization file or a new section on\
    \ your initialization file. The complexity of your shell initialization process\
    \ increases drastically with either of these approaches.\n\nThe third option is\
    \ easy to implement and maintain, but it results in a PATH that is extremely long\
    \ and hard to restore. If you have more than one or two machines, PATH can grow\
    \ to contain dozens of entries.\n\nThe fourth option is the easiest to maintain\
    \ and extend, so how do you implement it?\n\nThe simplest way is to have a for\
    \ loop that checks each directory and includes it if it exists:\n\n```\nPATH=\n\
    for DIR in /bin /sbin /usr/bin /usr/sbin /usr/bin /usr/ucb ;\n  if [ -d \"$DIR\"\
    \ ]; then PATH=\"$PATH:$DIR\"; fi\ndone\nexport PATH\n```"
  merge: -1
  pgno: 233
- img_proc: true
  md: "# Functions 215\n\nAt this point you might wonder why I am discussing this\
    \ problem in this chapter and not in a previous chapter. The reason is that the\
    \ complete problem is more than simply tailing PATH on a per-UNIX-version basis.\
    \ The complete problem requires you to tailor PATH for both interactive shells\
    \ and for different user IDs.\n\nYou can solve these problems by including several\
    \ case statements with different loops in them, or you can write one function\
    \ and reuse it. Because this chapter covers functions, I will show you how to\
    \ do the latter.\n\nThe function that you need is quite simple. Rewrite the for\
    \ loop to use the functions' arguments rather than a list of directories:\n\n\
    ```\nSetPath() {\n  _DIR in \"$\"\n  do\n    if [ -d \"$_DIR\" ]; then PATH=\"\
    $SPATH\":\"$_DIR\"; fi\n  done\n  export PATH\n  unset _DIR\n}\n```\n\nThis function\
    \ has three important points:\n\n+   - This function exports the PATH variable\
    \ to ensure that the child process started by the shell can access the value of\
    \ the variable.\n- This function unsets its internal variable _DIR. It is a good\
    \ habit to unset variables that should not be exported. In some languages, this\
    \ is not an issue because local variables disappear after execution leaves the\
    \ scope of the function. In other languages, variables can be marked for local\
    \ scope only, but in shell all variables are of global scope. This means the programmer\
    \ must take care in managing variables.\n- The local variable, _DIR, starts with\
    \ the underscore character. You do this to avoid name conflicts with variables\
    \ set by other functions. It is not required, but it is good practice to name\
    \ your local functions بمعنى than global variables.\n\nThere is only one additional\
    \ to add to this function, and that is to check whether PATH is set. Without this\
    \ check, you could potentially end up with a PATH set to\n\n```\nPATH=/usr/bin:/usr/sbin:/usr/local/bin\n\
    ```\n\nThe problem here is that the first entry in the variable PATH appears to\
    \ be a null string. Some versions of the shell cannot deal with this entry, so\
    \ you need to prevent this from happening.\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_234_0.png)"
  merge: -1
  pgno: 234
- img_proc: true
  md: "You can do this check using variable substitution. The complete function is\n\
    \n```\nSetPath() {\n  PATH=${PATH:-/sbin/bin};\\n  for _DIR in \"$@\"\n  do\n\
    \    if [ -d \"$DIR\" ]; then PATH=\"$SPATH\":\"$DIR\" ; fi\n  done\n  export\
    \ PATH\n  unset _DIR\n}\n```\n\nHere you set PATH to /sbin/bin if it is unset.\
    \ You can invoke this function as follows:\n\nSetPath /sbin /usr/sbin /bin /usr/bin\
    \ /usr/bin/bin\n\nIt checks whether each of its arguments is a directory, and\
    \ if a directory exists, it is added to PATH.\n\n# # Sharing Data Between Functions,\
    \ an Example\n\nThe functions seen so far operate independently of one another,\
    \ but in most shell scripts functions either depend on or share data with other\
    \ functions.\n\nIn this section you will look at an example where three functions\
    \ work together and share data.\n\n# # Moving Around the File System\n\nThe C\
    \ shell, csh, provides three commands for quickly moving around in the UNIX file\
    \ system:\n\n+   - popd\n- pushd\n- dirs\n\nThese commands maintain a stack of\
    \ directories internally and enable the user to add and remove directories from\
    \ the stack and list the contents of the stack.\n\nFor readers who are not familiar\
    \ with the programming concept of a stack, you can think of it as a stack of plates:\
    \ you can add or remove a plate only at the top of the stack. You can access only\
    \ the top plate, not any of the middle plates in the stack. A stack in programming\
    \ terms is similar. You can add or remove an item only at the top of the stack."
  merge: -1
  pgno: 235
- img_proc: true
  md: "In csh, the stack is maintained within the shell, but in your shell function-based\
    \ implementation you have to maintain the stack as an exported environment variable\
    \ so that all three functions have access to it.\n\nUse the variable DIR_STACK\
    \ to store the directory stack. Each entry in the stack is separated by the :\
    \ character similar to the PATH variable. By using this character rather than\
    \ a space or tab, you increase the flexibility of the directory names that you\
    \ can handle.\n\n# Implementing dirs\n\nNow you'll look at the simplest of the\
    \ three functions, the dirs() function, which lists the directory stack:\n\n```\n\
    dirs() {\n# save IFS, then set it to : to access the\n# the items in _DIR_STACK\
    \ individually.\n\nOLDIFS=\"$IFS\"\nIFS=\n\n# print each directory followed by\
    \ a space\n\nfor i in $_DIR_STACK\ndo\n    echo \"si \\c\"\ndone\n\n# add a new\
    \ line after all entries in _DIR_STACK\n# have been printed\n\necho\n\n# restore\
    \ IFS\n\nIFS=$OLDIFS\n}\n```\n\nHere you use the same trick as you used in the\
    \ lpath() function: save IFS and then set it to : enabling you to list each of\
    \ the items individually. The final echo is required to add a new line after all\
    \ the entries are printed. Finally you restore IFS.\n\n# Implementing pushd\n\n\
    The pushd function is slightly more complicated than the dirs function. It needs\
    \ to change to a requested directory and add that directory to the top of the\
    \ stack.\n\nYour implementation is as follows:\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_236_0.png)"
