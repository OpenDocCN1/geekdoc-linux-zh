    Here you store the user''s response in the variable RESPONSE. Initially this variable
    is set to null, enabling the while loop to begin execution.

    When the while loop first executes, the user is prompted as follows:

    Enter the name of a directory where your files are located:

    The user can type the name of a directory at this prompt. When the user finishes
    typing and presses Enter, the read command puts the user''s input into the variable
    RESPONSE.

    You then check to make sure the input is a directory. If the input is not a directory,
    issue an error message and the loop repeats. The error message is produced so
    that the user knows what was wrong with the input.


    If the user does not enter any value, the variable RESPONSE is still set to null.
