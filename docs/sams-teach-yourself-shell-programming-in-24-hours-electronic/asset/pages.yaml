  md: "# Flow Control\n\nSome programmers prefer the version that uses the conditional\
    \ operators because the individual tests are isolated. Other programmers prefer\
    \ the second form because it invokes the test command only and might be marginally\
    \ more efficient on older hardware or for large numbers of tests.\n\nIf you are\
    \ interested in maximum portability to older systems, you should use conditional\
    \ operators. On modern shells both work well, thus you can use either.\n\nIn this\
    \ example you used only two expressions. You are not limited to two. In fact any\
    \ number of expressions can be combined into one compound expression.\n\n# Negating\
    \ type of Expression\n\nThe final type of compound expression consists of negating\
    \ an expression. Negation reverses the result of an expression. True expressions\
    \ are treated as false expressions and vice versa.\n\nThe basic syntax of the\
    \ negation operator\n\n```\ntest ! expr\nor\n[ ! expr ]\n```\n\nHere expr is any\
    \ valid test expression.\nA simple example is the following command:\n\n```\n\
    $ if [ ! -d $HOME/bin ]; then mkdir $HOME/bin ; fi\n```\n\nHere make you the directory\
    \ $HOME/bin if it does not exist. The execution is as follows:\n\n+   1. First\
    \ the test\n   -d $HOME/bin is performed.\n2. The result of the test is negated\
    \ because of the ! operator. If the directory $HOME/bin exists, the return value\
    \ of the compound expression is false (1): otherwise, the return value is true\
    \ (0).\n3. If the result of the previous step is true, the directory $HOME/bin\
    \ is created; otherwise, the if statement finishes.\n\nA shorter form of the same\
    \ command is the following:\n\n```\n$ test ! -d $HOME/bin && mkdir $HOME/bin\n\
    ```\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_174_0.png)"
  merge: -1
