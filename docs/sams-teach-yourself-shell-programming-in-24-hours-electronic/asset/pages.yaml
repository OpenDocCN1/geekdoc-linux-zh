    # Negating a Set


    Consider a situation where you need a list of all files except those that contain
    the letter a. You have two approaches to solving this problem:


    +   1. Specify all the characters you want a filename to contain.

    2. Specify that the filename should not include the letter a.


    If you choose the first approach, you need to construct a set of all the characters
    your filename can contain. You can start with:


    ```

    [b-aA-Z0-9]

    ```


    This set does not include the special characters that are allowed in filenames.
    Attempting to include all these characters creates a huge set that requires complicated
    quoting. An approximation of this set is


    ```

    [b-aA-Z0-9_\-\+\=\!*\{\}\}]

    ```


    Compared to this, the second approach is much better because you only need to
    specify the list of characters that you don''t want.


    The [ wildcard provides you the capability to match all characters except those
    that are specified as the set. This is called negating the set, which you can
    accomplish by specifying the ! operator as the first character in a set. The syntax
    is


    ```

    command [characters]

    ```'
