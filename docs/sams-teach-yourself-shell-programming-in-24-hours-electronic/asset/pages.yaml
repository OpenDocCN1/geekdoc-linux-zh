  md: '# Hour 16


    > In the context of filename substitution, I referred to metacharacters as wild-cards.
    You might see these two terms used interchangeably in books and reference materials.


    # TABLE 16.1 METACHARACTERS USED IN REGULAR EXPRESSIONS


    | Character | Description |

    |--- | --- |

    | . | Matches any single character except a newline. |

    | * | Matches zero or more occurrences of the character immediately preced-ing.
    |

    | [chars] | Matches any one of the characters given in chars, where chars is a
    sequence of characters. You can use the - character to indicate a range of characters.
    If the * character is the first character in chars, one occurrence of any character
    that is not specified by chars is matched. |

    | $ | Matches the end of a line. |

    | \ | Treats the character that immediately follows the \ literally. This is used
    to specify patterns that contain one of the preceding wildcards. |


    # Regular Expression Examples


    As I stated before, a regular expression is a string that can represent many sequences
    of characters. The simplest regular expression is one that exactly represents
    the sequence of characters that you need to match. For example, the following
    expression


    /peach/ matches the string peach exactly. If this expression was used in awk or
    sed, any line that contains the string peach is selected by this expression. This
    includes lines such as the following:





    We have a peach tree in the backyard

    I prefer peaches to plums


    Matching Characters Look at a few more expressions to demonstrate the use of the
    metacharacters. For example, the following pattern


    /a.c/'
