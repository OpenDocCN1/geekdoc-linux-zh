  md: 'The : is a no-op, but the shell evaluates its arguments. Thus LINES is set
    to 24 if

    LINES is empty or undefined. If TERM is empty or undefined, the whole script aborts
    with

    the error message "TERM not set".


    # # The type Command


    The type command tells you the full pathname of a given UNIX command.

    The basic syntax is


    ```

    type command1 command2 ...

    ```


    If the command is not a utility that exists as a separate disk file, type tells
    you

    whether it is one of the following:


    +   * A shell built-command

    * A shell keyword or reserved word

    * An alias


    If the given command is an alias for another command, type also gives the command

    that is actually invoked when you run the alias.


    For example:


    ```

    $ type true case ulimit history

    true is /bin/true

    vi is /usr/bin/vi

    case is a keyword

    ulimit is a shell builtin

    history is an exported alias for fc -1

    $

    ```


    Different types of UNIX systems can implement the same command in different ways.

    For example, true is a shell included on some UNIX systems and in some UNIX shells

    and therefore is as efficient to use as the the : command. You can check whether
    true is

    built into your system by using the type command.


    # # The sleep Command


    The sleep command pauses for a given number of seconds. The basic syntax is


    ```

    sleep n

    ```


    where n is the number of seconds to sleep or pause. Some types of UNIX enable
    other

    time units to be specified. It is usually recommended that n not exceed 65,534.'
