  md: '# Using Multiple sed Commands


    As you can see from the last example, you were able to update the prices, but
    Paech is still misspelled. Say that you need to update fruit_prices.txt with both
    changes. This means that you need to perform more than one sed command on the
    file. You can do this in two ways:


    +   - Perform the first change and update the file. Perform the second change
    command and then update the file.

    - Perform both changes using a single sed command and then update the file once.


    As you can guess, the second method is much more efficient and less prone to error
    because the file is updated only once. You can perform both changes using a single
    sed command as follows:


    ```

    sed -e ''command1'' -e ''command2'' ... -e ''commandN'' files

    ```


    Here command1 through commandN are sed commands of the type discussed previously.
    These commands are applied to all of the lines in the list of files given by files.


    In this case you can perform both updates using either of the following commands:


    ```

    $ sed -e ''s/Paech/Peach/'' -e ''s/ *[0-9]*\.[0-9][0-9]S$/\S&''

    ->fruit_prices.txt

    ```


    | Fruit | Price/lbs |

    | Banana | $0.89 |

    | Peach | $0.79 |

    | Kiwi | $1.50 |

    | Pineapple | $1.29 |

    | Apple | $0.99 |


    To update the file use the same procedure as before:


    ```

    $ mv fruit_prices.txt fruit_pieces.txt $\$

    $ sed -e ''s/Paech/Peach/'' -e ''s/ *[0-9]*\.[0-9][0-9]S$/\S&''


    ->fruit_prices.txt $

    ```


    | Fruit | Price/lbs |

    | Banana | $0.89 |

    | Peach | $0.79 |

    | Kiwi | $1.50 |

    | Pineapple | $1.29 |

    | Apple | $0.99 |


