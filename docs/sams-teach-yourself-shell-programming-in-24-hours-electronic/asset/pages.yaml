- img_proc: true
  md: "# Problem Solving with Functions\n\nBecause the function printERROR always\
    \ prefixes the message you want to display with the word ERROR and redirects the\
    \ output to STDERR, you don't have to worry about forgetting these things when\
    \ displaying an error message.\n\nThe third function, printUSAGE, displays a message\
    \ and exits. It informs the user that the script was invoked incorrectly. This\
    \ type of message was discussed in Chapter 12.\n\n# Asking a Question\n\nIn interactive\
    \ shell scripts, you need to obtain input from the user. Sometimes this involves\
    \ asking yes or no questions. In other instances, you need to ask the user a question\
