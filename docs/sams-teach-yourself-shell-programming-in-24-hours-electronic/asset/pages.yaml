- img_proc: true
  md: 'Filename substitution is the process by which the shell expands a string containing
    wildcards into a list of filenames. Table 8.1 provides the wildcards the shell
    understands.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_137_0.png)


    Any command or script that operates on files can take advantage of filename substitution.
    The examples in this section use the ls command so that the results of the filename
    substitution are clear. You can use any command in place of the ls command.


    # TABLE 8.1 WILCARDS USED IN FILENAME SUBSTITUTION


    | Wildcard | Description |

    | --- | --- |

    | * | Matches zero or more occurrences of any character |

    | ? | Matches one occurrence of any character |

    | [characters] | Matches one occurrence of any of the given characters |


    # Using the * Wildcard


    The simplest form of filename substitution is the * character. The * tells the
    shell to match zero or more occurrences of any character. If given by itself,
    it matches all filenames. For example, the command


    ```

    $ ls *

    ```


    lists every file and the contents of every directory in the current directory.
    If there are any invisible files or directories, they are not listed. You need
    to specify the -a option to ls, as described in Chapter 3, “Working with Files."


    Using the * character by itself is required in many cases, but its strength lies
    in the fact that you can use it to match file suffixes, prefixes, or both.


    # Matching a File Prefix


    To match a file prefix, use the * character as follows:


    ```

    command ls*

    ```


    Here, command is the name of a command, such as ls, and prefix is the filename
    prefix you want to match. For example, the command


    ```

    $ ls ch*

    ```'
