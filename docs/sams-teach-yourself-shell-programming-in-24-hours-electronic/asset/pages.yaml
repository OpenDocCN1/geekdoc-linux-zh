  md: '# # HOUR 7 Variables


    **NEW TERM** Variables are “words” that hold a *value*. The shell enables you
    to create, assign, and delete variables. Although the shell manages some variables,
    it is mostly up to the programmer to manage variables in shell scripts.


    This chapter shows you how to


    +   - Create variables

    - Delete variables


    This chapter also explains how environment variables are and how to use them properly.
    By using variables, you are able to make your scripts flexible and maintainable.


    # ## Defining Variables


    Variables are defined as follows:


    ```

    name=value

    ```


    In this example, *name* is the name of the variable, and *value* is the value
    it should hold. For example.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_124_0.png)'
