  md: "# Filtering Text with awk\n\nThe basic syntax of the for is\n\n```\nfor (initialize_counter;\
    \ test_counter; increment_counter) {\n  action\n}\n```\n\nHere initialize_counter\
    \ initializes the counter variable, test_counter is an expression that tests the\
    \ counter's value, and increment_counter increments the value of the counter.\
    \ The parentheses surrounding the expression used by the for loop are required.\n\
    \nThe actions that should be performed, action, are any sequence of valid awk\
    \ commands. The braces surrounding the action are required only for actions containing\
    \ more than one statement, but I recommend that you always use them for the sake\
    \ of clarity and maintainability.\n\nA common use of the for is to iterate through\
    \ the fields in a record and output them, possibly modifying each record in the\
    \ process. The following for loop prints each field in a record separated by two\
    \ spaces:\n\n```\n#!/bin/sh\nawk {\n  for (x=1;x<=NF;x+=1) {\n    printf \"%%s\
    \ \\ $x;\n  }\n  printf \"\\n\"\n}' fruit_prices.txt\n```\n\nHere you use NF to\
    \ access the number of fields in the current record. You also use the field access\
    \ operator, S, in conjunction with the variable x to access the value stored at\
    \ a particular field.\n\n# Summary\n\nIn this chapter I have introduced programming\
    \ in awk. It is one of the most powerful filtering tools available in UNIX. By\
    \ using awk, you can often modify and transform text in ways that are difficult\
    \ or impossible using only the shell.\n\nSome of the important topics that I have\
    \ covered are\n\n+   - Field editing\n- Pattern specific actions\n- Using STDIN\
    \ in input\n- Variables"
