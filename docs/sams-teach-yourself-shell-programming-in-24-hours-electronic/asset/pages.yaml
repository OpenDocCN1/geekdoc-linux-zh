    First check to see whether an argument was given by setting REQ to the value of
    $1. If no argument was given, assume that the user means the current directory.


    Then to check whether the requested directory is really a directory. If it is,
    change to that directory and then update the directory stack with the full path
    of the new directory. You cannot use the value in $REQ because it could be a relative
    path.


    Finally print the contents of the stack by calling the dirs function. By doing
    this, the function does not have to know how to print the stack. You have to know
    how dirs prints the stack.


    This enables you to change the implementation of a function, such as dirs, without
    affecting the other functions. The one thing to keep in mind is that if you change
    the arguments that a function, such as dirs, expects to receive, you must change
    all the other functions that use it. Otherwise, you might encounter strange errors
    and bugs.


    The three important points here are


    +   - Setting a default value if an expected argument is not given.

    - Using other functions to perform your tasks.'
