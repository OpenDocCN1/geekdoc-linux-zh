  md: 'This executes the compound command and displays its output.


    **NEW TERM** This is the first example of a shell script. Basically, a shell script
    is a list of commands stored in a file that the shell executes noninteractively.


    # Initialization File Contents


    Usually the shell initialization files are quite short. They are designed to provide
    a complete working environment with as little overhead as possible for both interactive
    and noninteractive shells.


    The file /etc/profile is maintained by the system administrator of UNIX machine
    and contains shell initialization information required by all users on a system.


    The file .profile is under your control. You can add as much shell customization
    information as you want to this file. The minimum set of information that you
    need to configure includes


    +   * The type of terminal you are using

    * A list of directories in which to locate commands

    * A list of directories in which to locate manual pages for commands


    # Setting the Terminal Type


    Usually the type of terminal you are using is automatically configured by either
    the login or getty programs. Sometimes, the autfiguration process guesses your
    terminal incorrectly. This can occur when you are using a dial-up or modem connection.


    If your terminal is set incorrectly, the output of commands might look strange,
    or you might not be able to interact with the shell properly. Make sure that this
    is not the case, most users set their terminal to the lowest common denominator
    as follows:


    ```

    TERM=vt100

    ```


    When I introduce the case statement in Chapter 10, "Flow Control," you will see
    a more advanced method of setting the terminal type that enables access to advanced
    terminal features.


    # Setting the PATH


    When you type the command


    $ date


    the shell has to locate the command date before it can be executed. The PATH specifies
    the locations in which the shell should look for commands. Usually it is set as
    follows:


    ```

    PATH=/bin:/usr/bin

    ```'
