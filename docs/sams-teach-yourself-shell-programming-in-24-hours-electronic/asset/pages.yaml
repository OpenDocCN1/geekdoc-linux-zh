    # Terms


    **Scalar Variable** A scalar variable can hold only one value at a time.


    **Array Variable** An array variable is a mechanism available in bash and ksh
    for grouping scalar variables together. The scalar variables stored in an array
    are accessed using a single name in conjunction with a number. This number is
    referred to as an index.


    **Local Variable** A local variable is a variable that is present within the current
    instance of the shell. It is not available to programs that are started by the
    shell.


    **Environment Variable** An environment variable is a variable that is available
    to any program that is started by the shell.


    **Shell Variable** A shell variable is a special variable that is set by the shell
    and is required by the shell in order to function correctly.


    **Exporting** A variable is placed in the environment by exporting it using the
    export command.'
