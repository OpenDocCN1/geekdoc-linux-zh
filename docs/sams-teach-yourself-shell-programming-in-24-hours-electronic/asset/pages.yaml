- img_proc: true
  md: '# Using the set command


    In one of the invocation debugging modes, the default behavior is for that debugging
    mode to take effect at the first line of your script and remain in effect until
    the last line. Sometimes you just need to debug a particular function or section
    of your script. In these cases, enabling debugging for the entire script is overkill.


    As you see later in this chapter, the debugging output is quite extensive, and
    it is often hard to sort out the real errors from the noise. Address this problem
    with the set command to enable the debugging modes.


    By using the set command, you can enable and disable debugging at any point in
    your shell script.


    # Enabling Debugging Using set


    The basic syntax follows:


    ```

    set option

    ```


    Here option is one of the options given in Table 20.1.


    You can use the set command anywhere in your shell script, and many scripts use
    it to change the debugging flags as part of the normal execution of the script.
    Because these debugging modes are activated only when the shell programmer uses
    the set command, they are sometimes referred to as "programmer activated" modes.


    Consider the following excerpt from a shell script (the line numbers are provided
    for your reference):


    ```

    1 #!/bin/sh

    2 set -x

    3 if [ -z "$1" ] ; then

    4 echo "ERROR: Insufficient Args."

    5 exit 1

    6 fi

    ```


    Here the shell programmer is requesting shell tracing (the -x option) be activated
    with the command from line 2:


    ```

    set -x

    ```


    Because this command occurs before the if statement (lines 3 through 6), shell
    tracing will be active while the if statement executes. Unless it is explicitly
    disabled later in the script, shell tracing remains in effect until the shell
    exits. You will learn about the effect that shell tracing has on the output of
    a script in the "Shell Tracing" section of this chapter.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_338_0.png)'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Disabling Debugging Using set


    In addition to enabling debugging modes, you can use the set command to disable
    debugging modes as follows:


    ```

    set +option

    ```


    Here option is the letter corresponding to one of the options given in Table 20.1.
    For example, the command


    ```

    $ set +x

    ```


    disables the shell tracing debugging mode.


    All the debugging modes that are enabled for a script can be deactivated using
    the following command:


    ```

    $ set -

    ```


    # Enabling Debugging for a Single Function


    One of the most uses of the set command is to enable a particular debugging mode
    before a function executes and then disable debugging when the function finishes.


    For example, if you have a function called BuggyFunction() and you only want to
    enable the shell tracing debugging mode while that function executes, use the
    following command:


    ```

    set -x ; BuggyFunction; set +x ;

    ```


    Here the debugging mode is enabled just before the function is called and disabled
    when the function completes. This method is favored over explicitly using the
    set command inside a function to enable debugging because it allows the implementation
    of the function to remain unchanged.


    # Syntax Checking


    When dealing with any shell script, check the syntax of the script before trying
    to execute it. This enables you to fix most problems.


    To enable syntax checking, use the -n option as follows:


    ```

    /bin/sh -n script arg1 arg2 ... argN

    ```


    Here script is the name of a script and arg1 through argN are the arguments for
    that script. This command generates output only if errors occur in the specified
    script.


    Check the syntax of the following script (the line numbers are included for your
    reference):'
