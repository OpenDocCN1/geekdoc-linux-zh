- img_proc: true
  md: '# Miscellaneous Tools


    If you specify a relative pathname to find,

    cd /reports

    find /.1998 -name alpha -print


    all the files are displayed relative to the starting directory. For example,

    ./1998/alpha

    ./1998/region2/alpha


    To search the whole system, specify / as the starting directory. This indicates
    the system root directory that includes all other files and directories:


    ```

    find / -name alpha -print

    ```


    To search the entire system and still display all found files as relative pathnames,
    use the following:


    ```

    cd

    find . -name alpha -print

    ```


    Sample output:

    ./reports/1998/alpha

    ./reports/1998/region2/alpha


    This point about relative versus absolute pathnames is important if you are using
    find to generate a list of files to be backed up. It is better to back up using
    relative pathnames that enable it to be restored to a temporary directory.


    Some versions of UNIX let you search multiple directories with one command:

    find dir2 -name alpha -print


    Refer to the man page about find on your UNIX system to see whether it enables
    multi-ple directories.


    # find:-name Option


    The -name option enables you to specify either an exact or partial filename for
    find to match. find checks for a match only in the filename and not in the directory
    portion of the pathname.


    ```

    find / -name alpha -print

    ```


    /tmp/alpha has a matching filename and would be displayed by this command.

    /reports/alpha/file2 would not be displayed because find ignores the directory
    por-tion of the pathname.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_310_0.png)'
