- img_proc: true
  md: '# FRUIT=peach


    defines the variable FRUIT and assigns it the value peach.


    Variables of this type are called scalar variables. A scalar variable can hold
    only one value at a time. Later in this chapter, you look at a different type
    of variable called an array variable that can hold multiple values.


    Scalar variables are also referred to as name value pairs, because a variable''s
    name and its value can be thought of as a pair.


    # Variable Names


    The name of a variable can contain only letters (a to z or A to Z), numbers (0
    to 9) or the underscore (_). In addition, a variable''s name can start only with
    a letter or an underscore.


    The following examples are valid variable names:


    +   _FRUIT

    FRUIT_BASKET

    TRUST_NO_1

    TWO_TIMES_2


    but


    +   2_TIMES_2_EQUALS_4


    is not a valid variable name. To make this a valid name, add an underscore at
    the beginning of its name:


    +   _2_TIMES_2


    Variable names, such as 1, 2 or 11, that start with numbers are reserved for use
    by the shell. You can use the value stored in these variables, but you cannot
    set the variable value.


    The reason you cannot use other characters as !, *, or - is that these characters
    have a special meaning for the shell. If you try to make a variable name with
    one of these special characters it confuses the shell. For example, the variable
    names


    +   FRUIT_BASKET

    -2*2

    TRUST_NO_1!


    are invalid names. The error message generated by one of these variable name something
    like the following:


    ```

    $ FRUIT-BASKET=apple

    /bin/sh: FRUIT-BASKET=apple: not found.

    ```'
