  md: '# Flow Control


    # Compound Expressions


    So far you have seen individual expressions, but many times you need to combine
    expressions in order to satisfy a particular expression. When two or more expressions
    are combined, the result is called a compound expression.


    You can create compound expressions using the test command''s built-in operators,
    or you can use the conditional execution operators, && and ||.


    Also you can create a compound expression that is the negation of another expression
    by using the ! operator.


    Table 10.4 gives a summary of these operators.


    | Operator | Description |

    | --- | --- |

    | ! expr | True if expr is false. The expr can be any valid test command. |

    | expr1 -a expr2 | True if both expr1 and expr2 are true. |

    | expr1 -o expr2 | True if either expr1 or expr2 is true. |


    # Using the Built-In Operators


    The syntax for creating compound expressions using the built-in operators is


    ```

    test expr1 operator expr2

    ```


    or


    ```

    [ expr1 operator expr2 ]

    ```


    Here expr1 and expr2 are any valid test expression, and operator is -a (as in
    and) or -o (o as in).


    If the -a operator is used, both expr1 and expr2 must be true (evaluate to Ø)
    in order for the compound expression to be true.


    If the -o operator is used, either expr1 or expr2 must be true (evaluate to Ø)
    in order for the compound expression to be true.


    # Using the Conditional Operators


    The syntax for creating compound expressions using the conditional operators is


    ```

    test expr1 operator test expr1

    ```


    or


    ```

    [ expr1 ] operator ( expr2 ]

    ```'
