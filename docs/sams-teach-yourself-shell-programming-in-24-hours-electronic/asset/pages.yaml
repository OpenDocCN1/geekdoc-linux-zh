  md: "# Shell Programming FAQs\n\n# How do I determine whether job control is available\
    \ in the shell?\n\nJob control, covered in Chapter 6, “Processes,” is the shell\
    \ feature that enables you to control background processes based on a job ID.\
    \ This feature is not available in the Bourne shell, sh. It is available in bash\
    \ and ash.\n\nA common method used to check whether job control is enabled to\
    \ check whether the jobs command is defined:\n\n```\nif type jobs > /dev/null\
