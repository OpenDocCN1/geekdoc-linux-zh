    # HOUR 20


    # # Debugging


    In this book you have looked at scripts that are quite short. Thus, the issue
    of debugging them has boiled down to looking at their output and making sure it
    is correct.


    For larger shell scripts, especially the kind that change system configurations,
    trying to deduce the source of a problem from a script''s output is insufficient.
    Often, by the time you get the output, it is too late—the script will have made
    incorrect modifications or changes. Another common scenario is adding features
    to a large script that someone else developed. In such cases you need to make
    sure your changes don''t affect the rest of the script. Fortunately, the shell
    provides several built-in commands for enabling different modes of debugging support.


    In this chapter you learn how to enable debugging, and then you will look at how
    to use the following debugging modes:


    +   - Syntax checking

    - Shell tracing'
