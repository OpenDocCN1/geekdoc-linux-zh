  md: "# Loops\n\n```\nif [ $ -eq 0 ]; then\n  for j in doc ch m pl sh\n  do\n   \
    \ cp $HOME/docs/ch0${i}.*${j} /mnt/backup/docs/ch0${i}\n    if [ $ -ne 0 ]; then\
    \ break 2 ; fi\n  done\nelse\n  echo \"Could not make backup directory.\"\nfi\n\
    done\n```\n\nIn this loop, I'm making a backup of several important files from\
    \ my home directory to the backup directory. The outer loop takes care of creating\
    \ the backup directory, whereas the inner loop copies the important files based\
    \ on the extension.\n\nIn the inner loop, you have a break command with the argument\
    \ 2. This indicates that if an error occurs while copying you you should break\
    \ out of both loops, and not just the inner loop.\n\n# The continue Command\n\n\
    The continue command is similar to the break command, except that it causes the\
    \ current iteration of the loop to exit, rather than the entire loop. This command\
    \ is useful when an error has occurred but you want to try to execute the next\
    \ iteration of the loop.\n\nAs an example, the following loop doesn't exit if\
    \ one of the input files is bad:\n\n```\nfor FILE in $FILES\ndo\n  if [ ! -f $FILE\
    \ ]; then\n    echo \"ERROR: $FILE is not a file.\"\n    continue\n  fi\n  # process\
    \ the file\ndone\n```\n\nIf one of the filenames in $FILES is not a file, this\
    \ loop skips it, rather than exiting.\n\n# Summary\n\nLoops are a powerful programming\
    \ tool that enable you to execute a set of commands repeatedly. In this chapter,\
    \ you have examined the following types of loops available to shell programmers:\n\
    \n+   - while\n- until"
