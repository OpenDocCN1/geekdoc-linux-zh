  md: '# HOUR 11


    # Loops


    In this chapter, you''ll learn how to set up and use loops in your shell scripts.
    Loops enable you to execute a series of commands multiple times. Two main types
    of loops are


    +   - The while loop

    - The for loop


    The while loop enables you to execute a set of commands repeatedly until some
    condition occurs. It is usually used when you need to manipulate the value of
    a variable repeatedly.


    The for loop enables you to execute a set of commands repeatedly for each item
    in a list. One of its most common uses is in performing the same set of commands
    for a large number of files.


    In addition to these two types of loops, ksh and bash support an additional type
    of loop called the select loop. It frequently presents a menu of choices to a
    shell scripts user.


    The first section of this chapter explains the while loop and its uses. The second
    section of this chapter shows you how to use the for and select loops.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_178_0.png)'
