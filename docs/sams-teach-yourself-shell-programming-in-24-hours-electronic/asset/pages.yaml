  md: 'Here expr1 and expr2 are any valid test expression, and operator is either
    && (and) or || (or).


    If the && operator is used, both expr1 and expr2 must be true (evaluate to 0)
    in order for the compound expression to be true.


    If the || operator is used, either expr1 or expr2 must be true (evaluate to 0)
    in order for the compound expression to be true.


    # A Compound Expression Example Here are two equivalent examples that demonstrate
    how to create a compound expression:


    ```

    if [ -z "$DTHOME" && [ -d /usr/dt ]; then DHOME=/usr/dt ; fi

    ```


    ```

    if [ -z "$DTHOME" -a -d /usr/dt ]; then DHOME=/usr/dt ; fi

    ```


    The first version is executed as follows:


    +   1. First the test [ -z "$DTHOME" ] is performed.


    +   2. If this test returns 0, the second test [ -d /usr/dt ] is performed. Otherwise
    the if statement finishes.


    +   3. If the second test returns 0, the variable assignment DHOME=/usr/dt is
    performed. Otherwise the if statement finishes.


    Execution of the second version is similar:


    +   1. First the expression -z "$DTHOME" is evaluated.


    +   2. If this expression evaluates to 0, the expression -d /usr/dt is evaluated.
    Otherwise the if statement finishes.


    +   3. If the second expression evaluates to 0, the variable assignment DHOME=/usr/dt
    is performed. Otherwise the if statement finishes.'
