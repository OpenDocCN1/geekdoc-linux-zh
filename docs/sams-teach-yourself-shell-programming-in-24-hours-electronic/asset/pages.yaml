- img_proc: true
  md: '# rmdir


    To remove an empty directory, you can use the rmdir command. Its syntax is rmdir
    directories


    Here, directories includes the names of the directories you want to remove. For
    example, the command


    ```

    $ rmdir ch01 ch02 ch03

    ```


    removes the directories ch01, ch02, and ch03 if they are empty. The rmdir command
    produces no output if it is successful.


    # Common Errors


    You might encounter two common error messages from rmdir. These occur when you


    +   - Try to remove a directory that is not empty

    - Try to remove files with rmdir


    For the first case, you need to know how to determine whether a directory is empty.
    You can do this by using the -A option of the ls command. An empty directory produces
    no output. If there is some output, the directory you specified is not empty.


    For example, if the directory bar is empty, the following command


    ```

    $ ls -A

    ```


    returns nothing.


    Now say that the directory docs is not empty. The following command


    ```

    $ rmdir docs

    ```


    produces an error message


    rmdir: docs: Directory not empty


    To illustrate the second error, assume that names is a file. The following command


    ```

    $ rmdir names

    ```'
