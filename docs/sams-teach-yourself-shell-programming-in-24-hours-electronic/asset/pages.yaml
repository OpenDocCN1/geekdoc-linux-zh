  md: 'interactive mode In interactive mode, the shell reads input from you and executes
    the commands that you specify. This mode is called interactive because the shell
    is interacting with a user.


    invisible or hidden file A file name starts with the . character. By default the
    1s command does not list these files. You can list them by specifying the - option
    to 1s.


    iteration A single execution of the body of a loop.


    kernel The heart of the UNIX system. It provides utilities with a means of accessing
    a machine''s hardware. It also handles the scheduling and execution of commands.


    Korn shell A user interface for UNIX with extensive scripting (programming) support.
    Written by David G. Korn. The shell features command-line editing and will also
    accept scripts written for the Bourne


    library A file that contains only functions. Usually libraries contain no main
    code.


    literal character A character with no special meaning and which causes extra action
    to be taken. Quoting quotes the shell to treat a wildcard as a literal character.


    local variable A variable that is present within the current instance of the shell.
    It is not available to programs that are started by the shell.


    loop Enables you to execute a series of commands multiple times. Two main types
    of loops are the while and for loops.


    1s The command used to list the files in a directory.


    main code Consists of all the commands in a shell script that are not contained
    within functions.


    major number UNIX uses this to associate a block special file or a character special
    file with a device driver.


    man page Every version of UNIX comes with an extensive collection of online help
    pages man (short for manual pages). The man pages are the authoritative source
    about your UNIX system. They contain complete information about both the kernel
    and all the utilities.


    metacharacter In a regular expressions, a metacharacter is a special character
    that is expanded to match patterns.


    minor number UNIX uses this to associate a block special file with a device driver.


    modulus function See remainder function.'
