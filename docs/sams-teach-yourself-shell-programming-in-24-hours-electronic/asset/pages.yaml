  md: '# Parameters


    ```

    *listtar TARGS="-tvf $1" ;;

    *maketar) TARGS="-cvf $1.tar $1" ;;

    esac

    tar TARGS

    ```


    You can use this script to list the contents of a tar file (t as in tape and as
    in archive, a common format for distributing files in UNIX) or to create a tar
    file based on the name with which the script is invoked. The tar file to read
    or create is specified as the first argument, $1.


    I called this script mytar and made two symbolic links to it called listtar and
    maketar as follows:


    +   - $ ln -s mytar listtar

    - $ ln -s mytar maketar


    If the script is invoked with the name maketar and is given a directory or filename,
    a tar file is created. If you had a directory called fruits with the following
    contents


    +   $ ls fruits

    apple banana mango peach pear


    you can invoke the script as maketar to obtain a tar file fruit.tar containing
    this directory, by issuing the following command:


    ```

    ./maketar fruits

    ```


    If you want to list the contents of this tar file, you can invoke the script as:


    ```

    ./listtar fruits.tar

    ```


    This gives us the output:


    ```

    rwXR-xr-x 500/100  0 Nov 17 08:48 1998 fruits/

    rw-r--r-- 500/100  0 Nov 17 08:48 1998 fruits/banana

    rw-r--r-- 500/100  0 Nov 17 08:48 1998 fruits/mango

    rw-r--r-- 500/100  0 Nov 17 08:48 1998 fruits/pear

    rw-r--r-- 500/100  0 Nov 17 08:48 1998 fruits/pear

    rw-r--r-- 500/100  0 Nov 17 08:48 1998 fruits/peach

    ```


    For this example, the output you encounter depends on the version of tar that
    is installed on your machine. Some versions include more detail in the output
    than are shown here.


    # Usage Statements


    Another common use for $0 is in the usage statement for a script, which is a short
    message informing the user how to invoke the script properly. All scripts used
    by more than one user should include such a message.


    In general, the usage statement is something like the following:


    ```

    echo "Usage: $0 [options][files]"

    ```'
