    # Matching Sets of Characters


    Two potential problems with the ? and * wildcards


    +   - They match any character, including special characters such as hyphens (-)
    or underscores (_).

    - You have no way to indicate that you want to match only letters or only numbers
    of these operators.


    Sometimes you need more control over the exact characters that you match. Consider
    the situation where you want to match filenames of the form chX, where X is a
    number between 0 and 9. Neither the * or the operator is cut out for this job.


    Fortunately, the shell provides you with the capability to match sets of characters
    using the { wildcard. The syntax for using this wildcard is


    ```

    command [characters]

    ```


    Here command is the name of a command, such as ls, and characters represents the
    characters you want to match. For example, the following command fulfills the
    previous requirements:


    ```

    $ ls ch0[0123456789].doc

    ch01.doc ch02.doc ch03.doc ch04.doc ch05.doc ch06.doc

    ```


    One thing you might have noticed is that you had to list all the characters that
    you wanted matched. The shell provides a mechanism to shorten the list. For example,
    the command


    ```

    $ ls ch0[0-9].doc

    ```'
