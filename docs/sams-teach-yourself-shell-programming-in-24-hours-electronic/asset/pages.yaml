    # Deleting a Person


    Occasionally, you will need to delete a person from the address book. In this
    section, I will look at a script called delจะต้อง that deletes people from the
    address book.


    Deleting a person from the address book is a harder task because you have to make
    sure that those people you really want to delete are deleted. The two main tasks
    you need to perform are


    +   1. Make a list of the lines in the address book that match the specified name.

    2. Based on user feedback, delete the appropriate entries from the address book.


    Because the delete operation can potentially remove information from the address
    book, you have to be extra careful about making backups and working on copies
    of the original address book.


    To simplify prompting and printing error messages, this script uses the shell
    function libByTYSP.sh that was introduced in Chapter 21.


    The basic flow of the script is


    +   1. Make a copy of the address book and use the copy for all modifications.

    2. Get a list of all matching lines from this copy and store them in a deletion
    file.

    3. For each line in the deletion file, print it out formatted and ask the user
    whether the line should be deleted.

    4. If the user wants the line deleted, remove the line from the copy of the address
    book.

    5. After all the deletions are performed, make a backup of the original address
    book.

    6. Make the edited copy the address book.

    7. Clean up temporary files and exit.'
