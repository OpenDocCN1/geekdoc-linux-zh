  md: 'Now you need to tell sort on the second column, and you cannot simply use the
    -r and -n options. You need to use the -k (as in key) option also.


    The sort command constructs a key for each line in the file, and it arranges these
    keys into sorted order. By default, the key spans the entire line. The -k option
    gives you the flexibility of telling sort where the key should begin and where
    it should end, in terms of columns.


    The number of columns in a line is the number of individual words on that line.
    For example, the following line contains three columns:


    files 80 100


    The basic syntax of the -k option is


    sort -k start,end files


    Here start is the starting column for the key, and end is the ending column for
    the key. The first column is 1, the second column is 2, and so on.


    For the switched.txt file, start and end are both 2 because there are only two
    columns and you want to sort on the second one. The command you use is


    ```

    $ sort -rn -k 2,2 switched.txt

    389

    to 164

    of 127

    is 115

    and 115

    a 111

    files 80

    file 70

    in 69

    ''65

    ```


    Because there are only two columns, you can omit the ending column as follows:


    ```

    $ sort -rn -k 2 switched.txt

    ```


    # Using Classes with tr


    Take a look at the output of the command:


    ```

    $ tr ''"?;!\{\}\}(),..\n'' < ''/home/ranga/docs/ch15.doc |

    tr ''A-Z'' ''a-z'' | tr -s | tr '' ''\n'' | sort | uniq -c |

    sort -rn | head

    389

    164

    to

    127

    of

    115 is

    ```'
