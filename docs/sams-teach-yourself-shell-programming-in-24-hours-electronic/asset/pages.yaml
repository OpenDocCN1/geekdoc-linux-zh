  md: '# HOUR 17


    # Filtering Text with awk


    In Chapter 16, “Filtering Text Using Regular Expressions,” you looked at the sed
    command and used regular expressions to filter text. In this chapter you will
    look at another powerful text filtering command called awk.


    The awk command is a complete programming language that enables you to search
    many files for patterns and conditionally modify files without having to worry
    about opening files, reading lines, or closing files. It’s found on all UNIX systems
    and is quite fast, easy to learn, and extremely flexible.


    This chapter concentrates on the awk elements that are most commonly used in shell
    scripts. Specifically these features are


    +   - Field editing

    - Variables

    - Flow control statements


    # What is awk?


    The awk command is a programming language that enables you to search through files
    and modify records with these files based on patterns. The'
