  md: 'I will demonstrate sed''s usage in this manner by using it to solve the problem
    of deter-mining the user''s numeric ID (uid).


    On all UNIX systems the /usr/bin/id command prints the current users uid and gid
    information. In my case, the output of id looks like the following:


    ```

    $ /usr/bin/id

    uid=500(ranga) gid=100(users)

    ```


    As you can tell from the output, my numeric uid is 500. You need to modify this
    output so that only this number is printed. Using sed makes this task quite easy.


    First you need to eliminate everything following the first parenthesis. You can
    do that as follows:


    ```

    $ /usr/bin/id | sed ''s/(.*)////''

    ```


    Now the output looks like the following:


    ```

    uid=500

    ```


    If you eliminate the uid= portion at the beginning of the line, you are finished.
    You can do this as follows:


    ```

    $ /usr/bin/id | sed -e ''s/(.*).*'' -e ''s/uid=//''

    ```


    Now the output is


    ```

    500

    ```


    This is what you want. Notice that when you added the second s command, you changed
    from the single command form to the multiple command form that uses the -e option.


