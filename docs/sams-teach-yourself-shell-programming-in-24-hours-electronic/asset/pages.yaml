    # Common Errors


    A common error with the s command is forgetting one or more of the / characters.
    For example, say you were to ie issue the command

    $ sed ''s/Paech/Peach/'' fruit_prices.txt


    An error message similar to the following is produced:

    sed: command garbled: s/Paech/Peach


    This is the standard style of sed error messages:

    sed: command garbled: command


    Here sed could not understand the command. No additional error messages or information
    are produced. You have determine what went wrong yourself.


