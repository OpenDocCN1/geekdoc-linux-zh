  md: '# File Descriptors


    When you issue any command, three files are opened and associated with that command.
    In the shell, each of these files is represented by a small integer called a file
    descriptor. A file descriptor is a mechanism by which you can associate a number
    with a filename and use that number to read and write from the file. Sometimes
    file descriptors are called file handles.


    The three files following each of command with their corresponding descriptors
    are


    +   - Standard Input (STDIN),

    - Standard Output (STDOUT), 1

    - Standard Error (STDERR), 2


    The integer following each of these files is its file descriptor. Usually, these
    files are associated with the user''s terminal, but they can be redirected into
    other files.


    In the previous examples in this chapter, you have used input and output redirection
    using the default file descriptors. This section introduces the general form of
    input and output redirection.


    First you examine associating files with a file descriptor.


    # Associating Files with a File Descriptor


    By default, the shell provides you with three standard file descriptors for every
    command. With it, you can also associate any file with file descriptors using
    the exec command.


    Associating a file with a file description is useful when you need to redirect
    output or input to a file many times but you don''t want to repeat the filename
    several times.


    To open a file for writing, use one of the following forms:


    ```

    exec >file

    exec >>file

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_223_0.png)'
