    I will shortly cover the elements of the find command in detail. Files can be
    selected not only by name but by size, last date, last access date, and so on.
    First let me give you a more complex example with brief explanation of each part
    of the example, so you get a sense of what options and actions look like:


    ```

    find /reports/1998 -name alpha -type f -print -exec lp {} \

    ```


    Table 18.1 provides a breakdown of these elements.


    # Table 18.1 A Sample find Command


    | Command Element | Description |

    | /reports/1998 | The starting directory, find looks only in this directory and
    its subdirectories for files that match the criteria. |

    | -name alpha | An option that says you are looking only for files whose name
    is alpha—/reports/1998/region2/alpha, for example. find does not check any words
    in the directory portion of a filename for alpha. It checks only the filename
    itself, which is also called the filename. |

    | -type f | An option that says you are looking only for files of type f, which
    means regular or normal files, and not directories, device files, and so on. Any
    files selected match both conditions: they must have the name alpha and they must
    be a regular file. |

    | -print | An action that says to display output the pathname for files that match
    the criteria given by the options. |

    | -exec lp () \ | An action that says to use the lp command to print a hard copy
    of any files that match the criteria. Multiple actions can be specified. |


    # find: Starting Directory


    A UNIX system can contain a huge number of files, often so many that find can
    take several minutes or more to complete. For this reason, find enables specifying
    a directory to narrow down the number of files it has to search. Only files in
    this directory and all its subdirectories are checked. find enables either an
    absolute or relative pathname for the starting directory. If you specify an absolute
    pathname such as /reports/


    ```

    find /reports -name alpha -print

    ```


    then all the files found are specified as absolute pathnames, in this sample output:


    ```

    /reports/1998/alpha

    /reports/1998/region2/alpha

    ```'
