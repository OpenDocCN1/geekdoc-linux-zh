    \ 0 08:10:53 pts/6 0:00 -ksh\ndhorvath 9832 9830 0 13:58:42 pts/6 0:00 grep dhorvath\n\
    $\n```\n\nThe subshell running as process 3662, the original ksh shell. ps\n grep\
    \ are the children of process 9830 (ksh psit). When the psit script is done and\
