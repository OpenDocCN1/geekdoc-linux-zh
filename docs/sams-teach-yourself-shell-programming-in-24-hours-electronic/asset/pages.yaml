- img_proc: true
  md: 'To specify a partial pathname, use filename wildcards (refer to Chapter 8).

    For instance,


    ```

    find / -name ''*alpha*'' -print

    ```


    This displays all files that contain alpha anywhere within the filename. Here
    is some

    sample output:


    +   - /reports/1998/alpha

    - /reports/1998/alpha2

    - /reports/1998/old-alpha

    - /reports/1998/region2/alpha

    - /tmp/alpha

    - /usr/fredp/ralphams


    All the wildcards covered in Chapter 8 can be used:


    +   * ? [characters]


    You must enclose the filename containing these wildcards within single quotes
    (see

    Chapter 9); otherwise, your find command does not always give you the desired
    results.


    # find: -type Option


    The -type d enables us to specify the type of file to search for, as in this example:


    ```

    find / -type d -print

    ```


    -type d indicates directories, so only files that are directories are displayed.
    In this

    example, all directories in the whole system are displayed. Notice that no -name
    option

    has been given, so you display all directories regardless of their names. Table
    18.2 lists

    other types that are available.


    # TABLE 18.2 TYPES AVAILABLE FOR THE FIND COMMAND


    | Type | Description |

    |---|---|

    | f | Regular or normal file |

    | d | Directory |

    | b | Block special device file |

    | c | Character special device file (raw) |

    | 1 | Symbolic link |

    | p | Named pipe |'
