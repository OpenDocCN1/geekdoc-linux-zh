    # # Using awk Features


    You have seen some of the basics of using awk, and you''ll now look at some of
    the more powerful features that it provides. The main topics are


    +   * Variables

    * Flow control

    * Loops


    These features let you fully exploit the power of awk.


    # # Variables


    Variables in awk are similar to variables in the shell: They are words that refer
    to a value. The basic syntax of defining a variable is


    ```

    name=value

    ```


    Here name is the name of the variable, and value is the value of that variable.
    For example, the following awk command


    ```

    fruit="peach"

    ```


    creates the variable and assigns it the value peach. There is no need to initialize
    a variable: the first time you use it, it is initialized.


    Like the shell, a variable can contain only letters, numbers, and underscores.
    A variable''s name cannot start with a number.


    You can assign both numeric and string values to a variable in the same script.
    For example, consider the following awk commands:


    ```

    fruit="peach"

    fruit=100

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_286_0.png)'
