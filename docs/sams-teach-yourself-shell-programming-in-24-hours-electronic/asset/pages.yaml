    \ \\c escape sequence correctly.\n\n# printf\n\nThe printf command is similar\
    \ to the echo command, in that it enables you to print\nmessages to STDOUT. In\
    \ its most basic form, its usage is identical to echo. for example,\nthe following\
    \ echo command:\n\n$ echo \"Is that a mango?\"\n\nis identical to the printf command:\n\
    \n$ printf \"Is that a mango?\\n\"\n\nThe only major difference is that the string\
    \ specified to printf explicitly requires the \\n\nescape sequence at the end\
    \ of a string, in order for a newline to print. The echo com-\nmand prints the\
    \ newline automatically.\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_213_1.png)\n\
    \nThe printf command is located in the directory /usr/bin on Linux, Solaris,\n\
    and HP-UX machines. In addition, the printf command is a built-in\ncommand in\
    \ bash."
