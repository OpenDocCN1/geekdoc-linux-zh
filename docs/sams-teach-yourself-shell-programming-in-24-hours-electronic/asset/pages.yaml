    # Terms


    **Commands** A command is a program you can run. To run a command, type its name
    and press Enter.


    **Prompts** When you see a prompt, type the name of a command and press Enter.
    In this book, the $ character is used to indicate the prompt.


    **Simple Commands** A simple command is a command that you can execute by giving
    its name at the prompt.


    **Default Behavior** The output that is generated when a command runs as a simple
    command is called the default behavior of that command.'
