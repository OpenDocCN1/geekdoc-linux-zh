    \ ]; then\n  if [ \"VERBOSE\" = \"true\" ]; then\n    echo \"uencoding $SFILE\
    \ to $SOUTFILE...\"\n  fi\n  uuencode $SFILE $SOUTFILE; RET=$?\n  if [ \"VERBOSE\"\
    \ = \"true\" ]; then\n    MSG=\"Failed\"\n  if [ $RET -eq 0 ]; then MSG=\"Done.\"\
    ; fi\n  echo $MSG\n```\n\nfi\n\nYou could simplify the verbose reporting to print\
    \ a statement after the uuencode com-\nletes, by issuing two statements, one before\
