  md: '# File Tests


    File test expressions test whether a file fits some particular criteria. The general
    syntax for a file test is


    ```

    test option file

    ```


    or


    ```

    [ option file ]

    ```


    Here option is one of the options given in Table 10.1 and file is the name of
    a file or directory.


    Look at a few examples of if statements that use the test command to perform file
    tests.


    Consider the following if statement:


    ```

    $ if [ -d /home/ranga/bin ]; then PATH=$PATH:/home/ranga/bin; fi

    ```


    Here you are testing whether the directory /home/ranga/bin exists. If it does,
    append it to the variable PATH. Similar statements are often encountered in shell
    initialization scripts as .profile or .bashrc.


    Say you want to execute commands stored in the file $HOME/.bash_aliai if it exists.
    You can use the command


    ```

    $ if [ -f $HOME/.bash_aliai ]; then $HOME/.bash_aliai; fi

    ```


    An improvement on this would be to test whether the file has any content, and
    if so, run the commands stored in it. You can change the command to use the -s
    option instead of the -f option to achieve this result:


    ```

    if [ -s $HOME/.bash_aliai ]; then $HOME/.bash_aliai; fi

    ```


    Now the commands stored in the file $HOME/.bash_aliai execute if that file exists
    and has some content.


    # TABLE 10.1 FILE TEST OPTIONS FOR THE TEST COMMAND


    | Option | Description |

    |---|---|

    | -b file | True if file exists and is a block special file. |

    | -c file | True if file exists and is a character special file. |

    | -d file | True if file exists and is a directory. |

    | -e file | True if file exists. |

    | -f file | True if file exists and is a regular file. |'
