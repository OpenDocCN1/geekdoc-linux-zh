- img_proc: true
  md: 'mv The command to rename files.


    nested loop When a loop is located inside the body of another loop it is said
    to be nested within another loop.


    newline character Literally the linefeed character whose ASCII value is 10. In
    general, the newline character is a special shell character that indicates a complete
    command line has been entered and it may be executed.


    no-op A command that does nothing and thus can be used as a dummy command or placeholder
    where syntax requires a command.


    noninteractive mode In noninteractive mode, the shell does not interact with you,
    rather it reads commands stored in a file and executes them. When it reaches the
    end of the file, the shell exits.


    numeric expression A command to add, multiply, subtract, and divide two numbers.
    Numeric expressions are constructed using the numeric operators—+ (add), (subtract),
    * (multiply), and / (divide).


    ordinary file A file on the system that contains data, text, or program instructions.


    output redirection IN UNIX of capturing the output of a command and storing it
    in a file is called output redirection, because it redirects the output of a command
    into a file instead of the screen.


    parent process Process that controls another often referred to as the child process
    or subprocess.


    parent process identifier Shown in the heading of the ps command as PPID. The
    process identifier of the parent process. See also parent process.


    parent shell Shell (typically the login shell) that controls another, often referred
    to as the child shell or subshell. Shell.


    piping The process to redirect the output of one command into the input of another
    command. Piping is accomplished with the pipe character, |.


    process A discrete running program under UNIX. The user''s interactive session
    is a process. A process can invoke (run) and control another program that is then
    referred to as a subprocess. Ultimately, everything is a subprocess of the operating
    system.


    process identifier Shown in the heading of the ps command as pid. The unique number
    assigned to every process running in the system.'
