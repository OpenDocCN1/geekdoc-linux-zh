- img_proc: true
  md: 'If the variable FRUIT is undefined the error would be


    sh: =apple: not found


    Remember that when the dollar sign ($) character precedes a variable name, the
    value of the variable is substituted. For more information on the types of variable
    substitution available in sh, please consult the section, "Variable Substitution,"
    in Chapter 8,

    "Substitution."


    # Array Variables


    The Bourne shell, sh, supports only scalar variables, which are the type of variables
    that have seen so far. The Korn shell, ksh, extends this to include array variables.
    Version 2.0 and later of the Bourne Again shell, bash, also support array variables.
    The examples in the following section assume that you are using either ksh or
    bash 2.x.


    Arrays provide a method of grouping a set of variables. Instead of creating a
    new name for each variable that is required, you can use a single array variable
    that stores all the other variables.


    The difference between an array variable and a scalar variable can be explained
    as follows. Say that you are trying to represent the chapters in this book as
    a set of variables. Each of the individual variables is a scalar variable.


    Some of these variables might be


    +   CH01

    CH02

    CH15

    CH07


    Here is a format for each of the variable names: the letters CH followed by the
    chapter number. This format serves as a way of grouping these variables together.
    An array variable formalizes this grouping by using an array name in conjunction
    with a number that is called an index.


    The simplest method of creating an array variable is to assign a value to one
    of its indices. This is expressed as follows:


    ```

    name[index]=value

    ```


    Here name is the name of the array, index is the index of the item in the array
    that you want to set, and value is the value you want to set for that item.


    As an example, the following commands


    ```

    $ FRUIT[0]=apple

    $ FRUIT[1]=banana

    ```'
