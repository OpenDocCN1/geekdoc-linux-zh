    You can specify a combination of files and directories as follows:


    ```

    $ rm -r ch01/test1.txt ch01-old.txt ch02/

    ```


    In order to make rm safer, you can combine the -r and -i options.


    # Common Errors


    Usually the only error reported by rm is that a requested file or directory cannot
    be removed. If the file or directory midterm_answers does not exist, rm reports
    an error:


    ```

    $ rm -r midterm_answers

    rm: midterm_answers: No such file or directory

    ```


    # Summary


    In this chapter, you have looked at working with directories. Specifically, you
    covered the following topics:


    +   * Working with filenames and pathnames

    * Switching directories

    * Listing files and directories

    * Creating directories

    * Copying and moving directories

    * Removing directories


    You reviewed each of these topics because it is important to know how to perform
    these functions when writing shell scripts. As you progress further into this
    book, you will see common directory manipulations occur in shell scripts.'
  merge: -1
