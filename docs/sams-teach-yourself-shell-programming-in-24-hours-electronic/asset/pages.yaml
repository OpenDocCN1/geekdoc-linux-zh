    \ is Solaris or SunOS.\n\nIn many cases, you need to tailor the options of a command,\
    \ such as ps or df, so that the command can generate the desired output. In such\
    \ cases, you need the capability to \"ask\" whether the operating system is of\
    \ a certain type. A shell function that performs this task follows:\n\n```\nisOS(){\n\
    \ if [ $# -lt 1 ]; then\n  echo \"ERROR: Insufficient Aruments.\" >&2\n  return\
    \ 1\n\n```\n\n```\nREQ=echo $1 | tr '[A-Z]' '[a-z]'\nif [ \"$REQ\" = \"*getOSName*\"\
    \ ]; then return 0; fi\nreturn 1\n}\n```\n\nThis function compares its first argument\
    \ to the output of the function getOSName and returns 0 (true) if they are the\
    \ same; otherwise, it returns 1 (false). Using this function, you write it of\
    \ the following type:\n\n```\nisOS hpux; then\n  # HP-UX specific commands here\n\
    elif isOS solaris; then\n  # Solaris specific commands here\nelse\n  # generic\
    \ unix commands here\n\n```\n\nThe reason that you do not directly check the value\
    \ of $1 but instead use the variable REQ, is that this enables a greater flexibility\
    \ on the part of the function's user. For example, you can use either of the following\
    \ to check whether a system is Linux:\n\n```\nisOS LINUX\nisOS linux\n```"
