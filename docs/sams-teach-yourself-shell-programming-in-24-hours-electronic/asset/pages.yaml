    # Making a Shell Script Executable


    One of the most important tasks in writing shell scripts is making the shell script
    executable and making sure the correct shell is invoked on the script.


    In a previous example, you created the logins script that executes the following
    command:


    ```

    date ; who

    ```


    If you wanted to run the script by typing its name, you need to do two things:


    +   - Make it executable.

    - Make sure that the right shell is used when the script is run.


    To make this script executable, do the following:


    ```

    chmod a+x ./logins

    ```


