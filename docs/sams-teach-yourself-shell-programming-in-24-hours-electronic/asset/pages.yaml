  md: '# Text Filters


    ```

    tr -s ''set1''

    ```


    When tr encounters multiple consecutive occurrences of a character in set1, it
    replaces these with only one occurrence of the character. For example,


    ```

    $ echo "feed me" | tr -s ''e''

    ```


    produces the output


    ```

    fed me

    ```


    Here the two e''s in feed were reduced to a single e,


    If you specify more than one character in set1, the replacement is character specific.
    For example:


    ```

    $ echo "Shell Programming" | tr -s ''lm''

    ```


    produces the output:


    ```

    Shel Programming

    ```


    As you can see the l''s in Shell were reduced to a single l. Also, the two m''s
    in Programming were reduced to a single m.


    Now you can squeeze multiple spaces in the output into single spaces using the
    command:


    ```

    $ tr ''?":;{\{\},\t\n'' < /home/ranga/docs/ch15.doc ;\ntr ''A-Z'' ''a-z'' | tr
    -s '' '' | tr '''' ''\n''

    ```


    # The Sort Command


    To get a count of how many times each word is used, you need to sort the file
    using the sort command. In its simplest form, the sort command sorts each of its
    input lines. Thus you need to have only one word per line. You can do this changing
    all the spaces into new lines as follows:


    ```

    $ tr ''?":;{\{\},\t\n'' < /home/ranga/docs/ch15.doc ;\ntr ''A-Z'' ''a-z'' | tr
    -s '' '' | tr '''' ''\n''

    ```


    Now you can sort the output, by adding the sort command:


    ```

    $ tr ''?":;{\{\},\t\n'' < /home/ranga/docs/ch15.doc ;\ntr ''A-Z'' ''a-z'' | tr
    -s '' '' | tr '''' ''\n'' | sort

    ```


    # The uniq Command


    At this point, you can eliminate all the repeated words by using the -u (as in
    unique) option of the sort command. Because you need a count of the number of
    times a word is


