    ```

    $ echo ${FRUIT[*]}

    ```


    produces the following output:


    apple banana orange


    If any of the array items hold values with spaces, this form of array access will
    not work and will need to use the second form. The second form quotes all the
    array entries so that embedded spaces are preserved.


    For example, define the following array item:


    ```

    FRUIT[3]="passion fruit"

    ```


    Assuming that FRUIT is defined as given previously, accessing the entire array
    using the following command


    ```

    $ echo ${FRUIT[*]}

    ```


    results in five items, not four:


    apple banana orange passion fruit


    Commands accessing FRUIT using this form of array access get five values, with
    passion and fruit treated as separate items.


    To get only four items, you have to use the following form:


    ```

    $ echo ${FRUIT[@]}

    ```


    The output from this command looks similar to the previous commands:


    apple banana orange passion fruit


    but the commands see only four items because the shell quotes the last item as
    passion fruit.


    # Read-only Variables


    The shell provides a way to mark variables as read-only by using the readonly
    command. After a variable is marked read-only, its value cannot be changed.


    Consider the following commands:


    ```

    $ FRUIT=kiwi

    $ readonly FRUIT

    $ echo FRUIT

    kiwi

    $ FRUIT=cantaloupe

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_130_0.png)'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'The last command results in an error message:

    /bin/sh: FRUIT: This variable is read only.


    As you can see, the echo command can read the value of the variable FRUIT, but
    the shell did not enable us to overwrite the value stored in the variable FRUIT.


    This feature is often used in scripts to make sure that critical variables are
    not overwritten accidentally.


    In ksh and bash, the readonly command can be used to mark array and scalar variables
    as read-only.


    # Unsetting Variables


    Unsetting a variable tells the shell to remove the variable from the list of variables
    it tracks. This is like asking the shell to forget a piece of information because
    it is no longer required.


    Both scalar and array variables are unset using the unset command:


    ```

    unset name

    ```


    Here name is the name of the variable to unset. For example:


    ```

    unset FRUIT

    ```


    unsets the variable FRUIT.


    You cannot use the unset command to unset variables that are marked readonly.


    # Environment Variables


    When a shell is running, three main types of variables are present:


    +   - Local Variables

    - Environment Variables

    - Shell Variables


    A local variable is a variable that is present within the current instance of
    the shell. It is not available to programs that are started by the shell. The
    variables you looked at previously have all been local variables.


    An environment variable is a variable that is available to any child process of
    the shell. Some programs need environment variables in order to function correctly.


    Usually a shell script defines only those environment variables that are needed
    by the programs that it runs.'
