  md: 'Here is an example of using sets. The following expression matches the string
    The and the:

    /[tT]he/


    Table 16.2 shows some frequently used sets of characters.


    # Table 16.2 COMMON CHARS SETS


    | Set | Description |

    | [a-z] | Matches a single lowercase letter |

    | [A-Z] | Matches a single uppercase letter |

    | [a-zA-Z] | Matches a single letter |

    | [0-9] | Matches a single number |

    | [a-zA-Z-0-9] | Matches a single letter or number |


    Sometimes it is hard to determine the exact set of characters that you need to
    match. Say you needed to match every character except the letter T. In this case,
    constructing a set of characters that includes every character except the letter
    T is error prone. You might forget a space or a punctuation character while trying
    to construct the set.


    Fortunately, you can specify a set that is the negation of the set that matches
    T as follows:


    [^T]


    Here the ^ character precedes the letter T. When the ^ character is the first
    character in the set, any character not given in the set is matched. This is called
    reversing or negating a set. Any set, including those in Table 16.2, can be reversed
    or negated if you give ^ as the first character. For example, the following pattern


    ```

    /ch[^0-9]/

    ```


    matches the beginnings of the strings chapter and chocolate, but not the strings
    ch01 or ch02.


    You can combine the sets with the * character to extend their functionality. For
    example, the following expression


    ```

    /ch[0-9]*doc/

    ```


    matches the strings ch01.doc and ch02.doc but not the strings chdoc or changedoc.'
