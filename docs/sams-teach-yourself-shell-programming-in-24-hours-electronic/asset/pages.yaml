    # Getting a User''s Numeric User ID


    Some shell scripts need to determine whether a user has sufficient permissions
    to execute commands. For example, an install script might need to run as root
    (UID 0) to modify system files correctly. In other instances, a script might need
    to detect whether a user has too many privileges.


    To check the user''s ID, you can use the id command, which can be run in two forms.
    The first form specifies a username whose ID should be returned. For example,
    the com-


    ```

    $ id vathsa

    uid=501(vathsa) gid=100(users) groups=100(users)

    ```


    returns the UID for the user vathsa. The second form omits the user ID. In this
    form, the current user''s information is returned.


    ```

    $ id

    uid=500(ranga) gid=100(users) groups=100(users),101(ftpadmin)

    ```


    Your function supports both.


    ```

    ######################################################

    # Name: getUID

    # Desc: outputs a numeric user id

    # Args: $1 -> a user name (optional)

    ######################################################

    ```


