    # Sorting Numbers in a Different Column


    In the preceding output, you used the sort -rn command to sort the output by numbers
    because the numbers occurred in the first column instead of the second column.
    If the numbers occurred in any other column, this would not be possible.


    Suppose the output looked like the following:


    ```

    $ cat switched.txt

    files 80

