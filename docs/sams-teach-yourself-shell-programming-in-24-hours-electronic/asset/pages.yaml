  md: '# HOUR 3


    # Working with Files


    In UNIX there are three basic types of files:


    +   * Ordinary Files

    * Directories

    * Special Files


    An ordinary file is a file on the system that contains data, text, or program
    instructions. In this chapter, you look at working with ordinary files.


    Directories, covered in Chapter 4, “Working with Directories,” store both special
    and ordinary files. For users familiar with Windows and Mac OS, UNIX directories
    are equivalent to folders.


    Special files are covered in Chapter 5, “Manipulating File Attributes.” Some special
    files provide access to hardware such as hard drives, CD-ROM drives, modems, and
    Ethernet adapters. Other special files are similar to aliases or shortcuts and
    enable you to access a single file using different names.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_56_0.png)'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Listing Files


    First, list the files and directories stored in the current directory. Use the
    following command:


    ```

    $ ls

    ```


    Here''s a sample directory listing:


    ```

    bin hosts lib res.03

    ch07 hw1 pub test_results

    ch07.bak hw2 res.01 users

    docs hw3 res.02 work

    ```


    This output indicates that several items are in the current directory, but this
    output does not tell us whether these items are files or directories. To find
    out which of the items are files and which are directories, specify the -F option
    to ls:


    ```

    $ ls -F

    ```


    Now the output for the directory is slightly different:


    ```

    bin/ hosts lib/ res.03

    ch07/ hw1 pub/ test_results

    ch07.bak hw2 res.01 users

    docs/ hw3 res.02 work/

    ```


    As you can see, some of the items now have a / at the end: each of these items
    is a directory. The other items, such as hw1, have no character appended to them.
    This indicates that they are ordinary files.


    When the -F option is specified to ls, it appends a character indicating the file
    type of each of the items. The exact character depends on your version of ls.
    For ordinary files, no character is appended. For special files, a character such
    as !, @ or # is appended to the filename.


    For more information on the exact characters your version of ls appends to the
    end of a filename when the -F option is specified, please check the UNIX manual
    page for the ls command. You can do this as follows:


    ```

    $ man ls

    ```


    So far, you have seen ls list more than one file on a line. Although this is fine
    for humans reading the output, it is hard to manipulate in a shell script. Shell
    scripts are geared toward dealing with lines of text, not the individual words
    on a line. Without using external tools, such as the awk language covered in Chapter
    17, “Filtering Text Using awk,” it is hard to deal with words on a line.'
  merge: -1
  pgno: 57
- img_proc: true
