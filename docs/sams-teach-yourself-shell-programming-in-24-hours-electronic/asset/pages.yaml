  md: '# Shell Programming FAQs 395


    esac

    export PS1


    I have specified the shells as *bash, *ksh, and *sh, because some versions of
    UNIX

    place the - character in front of login shells, but not in front of other shells.


    # How do I tell whether the current shell is interactive or noninteractive?


    Some scripts need the capability to determine whether they are running in an inter-active
    shell or noninteractive shell.


    Usually this is restricted to your shell initialization scripts because you don''t
    want to perform a full-blown initialization every time these scripts execute.
    Some examples include scripts that can run from the at or cron commands.


    Common methods can determine whether a shell is interactive:


    +   - test -or [ - ]

    - tty -s


    Both commands exit with zero status if STDIN is connected to a terminal. For example,

    the commands


    ```

    $ if [ -t ]; then echo interactive ; fi

    ```


    and


    ```

    $ tty -s ; then echo interactive ; fi

    ```


    produce the same result if the current shell is interactive:

    interactive


    On modern versions of UNIX both forms work equally. On some older versions of\UNIX
    the test -t command was not available, so the tty -s command had to be used.


    # How do I discard the output of a command?


    Sometimes you will need to execute a command, but you don''t want the output displayed

    to screen. In these cases you can discard the output by redirecting it to the
    file

    dev/null:


    ```

    command > /dev/null

    ```


    Here command is the name of the command you want to execute. The file is a special
    file

    (called the bit bucket) that automatically discards all its input.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_414_0.png)'
  merge: -1
