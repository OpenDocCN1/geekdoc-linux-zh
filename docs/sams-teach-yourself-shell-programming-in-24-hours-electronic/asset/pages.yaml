  md: '# HOUR 12


    # Parameters


    As you saw in previous chapters, the general format for the invocation of programs
    in UNIX is


    command options files


    Here command is the command name, options is any option that you need to specify,
    and files is an optional list of files on which the command should operate. Consider
    the following example:


    ```

    $ ls -l *.doc

    ```


    Here ls is the command, -l is the only option, and *.doc is the list of files
    for ls to operate on.


    Because UNIX users are familiar with this interface, you should adhere to this
    format in shell scripts. This means that scripts that can have options specified
    must be able to read and interpret them correctly.


    You have two common methods for the handling options passed to a shell script:


    +   * Handle options manually using a case statement

    * Handle options using the getopts command'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'For scripts that support only one or two options, the first method is easy
    to implement and works quite well, but many scripts allow any combination of options
    to be given. For such scripts, getopts command is very useful because it affords
    the maximum flexibility in parsing options.


    This chapter looks at both methods but it first covers the topic of special variables.


    # Special Variables


    The shell defines several special variables that are relevant to option parsing.
    In addition to these, a few variables give the status of commands that the script
    executes. Table 12.1 describes all of the special variables defined by the shell.


    In this section you construct a simple yet useful script that illustrates the
    use of these variables.


    | Variable | Description |

    | :--- | :--- |

    | $0 | The name of the command being executed. For shell scripts, this is the
    path with which it was invoked. |

    | $n | These variables correspond to the arguments with which a script was invoked.
    *n* is a positive decimal number corresponding to the position of an argument
    (the first argument is $1$, the second argument is $2$, and so on). |

    | $# | The number of arguments supplied to a script. |

    | $* | All the arguments are double quoted. If a script receives two arguments,
    $*$ is equivalent to $1$ $2$. |

    | $@ | All the arguments are individually double quoted. If a script receives
    two arguments, $@$ is equivalent to $1$ $2$. |

    | $? | The exit status of the last command executed. |

    | $$ | The process number of the current shell. For shell scripts, this is the
    process ID under which they are executing. |

    | $! | The process number of the last background command. |


    # Using $0


    Start by looking at $0$. This variable is commonly used to determine the behavior
    of scripts that can be invoked with more than one name. Consider the following
    script:


    ```

    #!/bin/sh

    case $0 in

    ```'
