  md: '# # SAMS Teach Yourself Shell Programming in 24 Hours


    # # Get Started Now!


    24 proven one-hour lessons


    # Find your answer to...


    In just 24 sessions of one hour or less, you will be programming shells with ease.
    Using a straightforward, step-by-step approach, each lesson builds upon the previous
    one, allowing you to learn the essentials of Shell programming from the ground
    up.


    +   - Programming in the Bourne Shell (sh), the Korn Shell (ksh), and the Bourne-Again
    Shell (bash)


    > > Tips point out shortcuts and solutions


    +   - The basics of file, directory, and process manipulation in shell scripts


    > > Notes clarify concepts and procedures in a straightforward manner


    +   - Learning advanced features like option parsing, input/output handling, and
    functions in your shell scripts


    > > Cautions help you avoid common pitfalls


    +   - Manipulating text using filters like grep, tr, sort, awk, and sed


    +   - Understanding signals and debugging in shell scripts


    Sriranga Veeraraghavan works with the Network Management group at Cisco Systems.
    He has years of experience developing software in C, Java*, Perl, and Shell and
    has been a contributing for several books, including UNIX Unleashed and Special
    Edition Using UNIX. Sriranga graduated from the University of California at Berkeley
    in 1997 with a degree in engineering and is currently pursuing further studies
    at Stanford University.


    Category: Operating Systems

    Covers: Shell Programming

    User Level: Beginner


    $19.99 USA / $29.95 CAN / £17.75 Net UK


    +   - Learning how the library of shell functions and scripts will reduce the
    time required to develop powerful and robust shell scripts


