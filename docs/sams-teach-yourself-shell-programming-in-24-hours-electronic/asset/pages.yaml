- img_proc: true
  md: "# Loops\n\nIf a valid selection is made, the select loop executes a case statement\
    \ contained in its body. This case statement performs the correct action based\
    \ on the user's input. Here the correct action is either calling a command named\
    \ CompConf, exiting the loop, or display- an error message.\n\n# Changing the\
    \ Prompt\n\nYou can change the prompt displayed by the select loop by altering\
    \ the variable PS3. If PS3 is not set, the default prompt, ?, is displayed. Otherwise\
    \ the value of PS3 is used as the prompt to display. For example, the commands\n\
    \n```\n$ PS3=\"Please make a selection -> \" ; export PS3\n```\n\nchange the menu\
    \ displayed in the previous example to the following:\n\n+   1) comp1\n2) comp2\n\
    3) comp3\n4) all\n5) none\nPlease make a selection =>\n\nNotice that the value\
    \ of PS3 that you used has a space as its last character so user input does not\
    \ run into the prompt. You do this in order to make the menu user-friendly.\n\n\
    ![](img/21edd8d7854fe7f0c0d03baba9111541_188_0.png)\n\n# Loop Control\n\nSo far\
    \ you have looked at creating loops and working with loops to accomplish different\
    \ tasks. Sometimes you need to stop a loop or skip iterations of the loop. In\
    \ this section you'll look at the commands used to control loops:\n\n+   - break\n\
    - continue\n\n# Infinite Loops and the break Command\n\nWhen you looked at the\
    \ while loop earlier in this chapter, it terminated when a particular condition\
    \ was met. This happened when the task of the while loop completed.\n\nIf you\
    \ make a mistake in specifying the termination condition of a while loop, it can\
    \ continue forever. For example, you forget forgot to specify the $ before the\
    \ x in the test expression:\n\n```\nx=0\nwhile [ x -lt 10 ]\ndo\n  echo $x\n \
    \ x=$(echo \"$x + 1\" bc)\ndone\n```"
