  md: '# Filtering Text Using Regular Expressions


    The third problem is related to the .. Because this metacharacter matches a single
    occurrence of any character, it can match the following strings in addition to
    the strings you want:


    ```

    0x00

    12345

    ```


    You can solve all these problems using the backslash metacharacter (\). The character
    immediately following the backslash is always treated literally. When an ordinary
    character is preceded by a backslash, it has no effect. For example, \a and a
    are both treated as a lowercase a. When the backslash precedes a metacharacter,
    the special meaning of that metacharacter is "deactivated".


    The process of using the backslash to deactivate a metacharacter is called escaping.
    For example:


    ```

    $

    ```


    matches the end of a line, but


    ```

    \$

    ```


    matches the dollar sign ($) literally.


    By using escaping, you can use the following expression to solve your problems:

    /\$[0-9]*\\.[0-9]*\//[a-zA-Z]*\*/


    If you need to match the literally, you can match it by escaping it itself, \\.


    Sometimes the process of escaping a metacharacter with the backslash is called
    backslash escaping.


    Useful Regular Expressions Table 16.3 provides some useful regular expressions.


    # TABLE 16.3 SOME USEFUL REGULAR EXPRESSIONS


    | String Type | Expression |

    | Blank lines | /^\$ |

    | An entire line | /\.*$ |

    | One or more spaces | /\+ |

    | HTML (or XML) Tags | /<[^>]*\/ |

    | Valid URLs | /:[a-zA-Z0-9]*:[a-zA-Z0-9]*\/[a-zA-Z0-9]*\..*\ |

    | Formatted amounts | /\$[0-9]*\.[0-9]*\/ |'
