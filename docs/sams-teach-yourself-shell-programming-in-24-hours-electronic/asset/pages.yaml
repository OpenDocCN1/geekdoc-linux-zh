    \n# Manipulating a Set of Files\n\nSay that you need to copy a bunch of files\
    \ from one directory to another and change the permissions on the copy. You could\
    \ do this by copying each file and changing the permissions manually.\n\nA better\
    \ solution would be to determine the commands you need to execute in order to\
    \ copy a file and change its permissions and then have the computer do this for\
    \ every file you were interested in. In fact this is one of the most common uses\
    \ of the for loop—iterating over a set of file names and performing some operations\
    \ on those files."
