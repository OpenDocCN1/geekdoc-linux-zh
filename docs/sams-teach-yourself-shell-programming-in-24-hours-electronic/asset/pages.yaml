- img_proc: true
  md: '# Shell Programming FAQs


    # How do I check to see whether a variable has a value?


    There are several methods for determining this. The simplest is the `if` statement:


    ```

    if [ -z `$VAR` ]; then list ; fi

    ```


    Here VAR is the name of the variable, and `list` is the command to execute if
    `VAR` does not contain a value. Usually `list` initializes `VAR` to some default
    value.


    You can initialize variables more succinctly using variable substitution. For
    example, the previous `if` statement can be written as


    ```

    : ${VAR:=default}

    ```


    Here `default` is the default that should be assigned to `VAR`, if `VAR` does
    not have a value.


    If you need to execute a set of commands to obtain a default value, use command
    substitution with the backquote (`) operator to obtain the value that should be
    substituted:


    ```

    : ${VAR=`default`}

    ```


    Here `default` is a list of commands to execute. If `VAR` does not have a value,
    all of these commands will be assigned to it.


    # File and Directory Questions


    In this section, I will look at some questions about files and directories. These
    questions include issues with specific commands and examples that illustrate the
    usage of commands to solve particular problems.


    # How do I determine the full pathname of a directory?


    Shell scripts that work with directories often need to determine the full pathname
    of a directory to perform the correct operations on these directories.


    You can determine the full pathname of a directory by using the `cd` and `pwd`
    commands:


    ```

    FULLPATH=`cd dir ; pwd`

    ```


    Here `dir` is the name of a directory. This command changes directories to the
    specified directory, `dir`, and then displays the full pathname of the directory
    using the pwd command. Because command substitution is used, the full pathname
    is assigned to the variable `FULLPATH`.


    The `cd` command changes the working directory of the current shell, you execute
    it in a subshell. Thus the working directory of the shell script is unchanged.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_418_0.png)'
  merge: -1
  pgno: 418
- img_proc: true
  md: '# How do I determine the full pathname of a file?


    Determining the full pathname of a file is slightly harder than determining the
    full path-name of a directory. You need to use the dirname and basename commands
    in conj-with the cd and pwd commands to determine the full pathname of a file:


    ```

    CURDIR=$pwd

    cd ''dirname file''

    FULLPATH=$pwd/basename file

    cd $CURDIR

    ```


    Here file is the name of a file whose full pathname you want to determine. First
    you save the current path of the current directory in the variable CURDIR. Next
    you change to the directory containing the specified file, file.


    Then you join the output of the pwd command and the name of the file determined
    using the basename command to get the full pathname. This value gets stored in
    the vari-able FULLPATH. Finally you change back to the original directory.


    # How can locate a particular file?


    The structure of the UNIX directory tree sometimes makes locating files and commands
    difficult. To locate a file, often you need to search through a directory and
    all its subdi-ories. The easiest way to do this is to use the find command:


    ```

    find -name file -print

    ```


    Here dir is the name of a directory where find should start its search, and file
    is the name of the file it should look for.


    The name option of the find command also works with the standard filename substitu-tion
    operators covered in Chapter 8. For example, the command


    ```

    find -name "txt" -print

    ```


    displays a list of all the files in the directory dir and all its subdirectories
    that end with the string txt.


    # How can I grep for a string in every file in a directory?


    When you work on a large project involving many files, remembering the contents
    of the individual files becomes difficult. It is much easier to look through all
    the files for a par-ticular piece of information.


    You can use the find command in conjunction with the xargs command to look for
    a particular string in every file contained within a directory and all its subdirectories:


    ```

    dir -type f -print | xargs grep "string"

    ```'
  merge: -1
  pgno: 419
- img_proc: true
  md: "# Shell Programming FAQs\n\nHere dir is the name of a directory in which to\
    \ start searching, and string is the string to look for. Here you specify the\
    \ -type option to the find command so that only regular files are searched for\
    \ the string.\n\n# How do I remove all the files in a directory matching a particular\
    \ name?\n\nSome editors and programs create large numbers of temporary files.\
    \ Often you need to clean up after these programs, to prevent your hard drive\
    \ from filling up.\n\nTo generate the list of files to delete, you can use the\
    \ find command. Most of the time you can combine the find command with the xargs\
    \ command, but in this case the filenames can contain one or more spaces. Spaces\
    \ can confuse the xargs command, so you may need to use a for loop:\n\n```\nOLDSIFS=\"\
    IFS\"\nIFS=''\nfor FILE in $(find . -type f -name \"string*\" -print)\ndo\n  rm\
    \ \"FILE\"\ndone\nIFS=$OLDSIFS\n```\n\nHere string is a string that should be\
    \ part of the name of each file you want to delete. So that the for loop is set\
    \ to the correct value of FILE in each iteration, IFS needs to be set to the newline\
    \ character.\n\nIf you do not change IFS, filenames that contain spaces will be\
    \ interpreted as multiple files instead of a single file.\n\n# What command can\
    \ I use to rename all *.aaa files to *.bbb files?\n\nIn DOS and Windows, you can\
    \ rename all *.aaa files in a directory to *.bbb by using the rename command as:\n\
    \n```\nrename *.aaa *.bbb\n```\n\nIn UNIX you can use the mv command to rename\
    \ files, but you cannot use it to rename more than one file at the same time.\
    \ You need to use a for loop:\n\n```\nOLDSUFFIX=aaa\nNEWSUFFIX=bbb\nfor FILE in\
    \ \\*.\"$OLDSUFFIX\"\ndo\n  NEWNAME=$(echo \"$FILE\" | sed -e \"s/${OLDSUFFIX\\\
    /$NEWSUFFIX/\")\n  mv \"$FILE\" \"$NEWNAME\"\ndone\n```\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_420_0.png)"
