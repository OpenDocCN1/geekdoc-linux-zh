    # HOUR 18


    # Miscellaneous Tools


    by Frank Watson


    NEW TERM In this chapter, you will look at several miscellaneous UNIX commands
    that you often encounter in shell scripts and can use in your own programs. The
    first of these tools includes built-in shell commands, which means that the shell
    can execute them without reading a separate utility from disk:


    +   * eval

    * :

    * type


    Then you will cover several external commands that exist as binary programs on
    disk:


    +   * sleep

    * find and xargs

    * bc and expr

    * remsh (sometimes called rsh, rcmd, or remote)'
