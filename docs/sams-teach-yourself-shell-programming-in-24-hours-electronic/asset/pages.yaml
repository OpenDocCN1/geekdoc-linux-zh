  md: '# HOUR 13


    # Input/Output


    Until now you have been looking at commands that print out messages. When a command
    prints a message, the message is called output. In this chapter, you will look
    at the different types of output available to shell scripts. This chapter also
    introduces the mechanisms used to obtain input from users.


    Specifically, the areas that you will cover are


    +   - Output to the screen

    - Output to a file

    - Input from a file

    - Input from users


    # Output


    As you have seen in previous chapters, most commands produce output. For example,
    the command


    ```

    $ date

    ```


    produces the current date in the terminal window:


    Thu Nov 12 16:32:35 PST 1998


    ![](img/21edd8d7854fe7f0c0d03baba9111541_208_0.png)'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'When a command produces output that is written to the terminal, we say that
    the program has printed its output to the Standard Output, or STDOUT. When you
    run the date command, it prints the date to STDOUT.


    You might also see commands produce error messages, such as:

    $ ln -s ch01.doc ch01-01.doc

    ln: cannot create ch01-1.doc: File Exists


    Error messages are not written to STDOUT, but instead they are written to a special
    type of output called Standard Error or STDERR, which is reserved for error messages.
    Most commands use STDERR for error messages and STDOUT for informational messages.


    You will look at STDERR later in this chapter. In this section you will look at
    how shell scripts use STDOUT to output messages to each of the following:


    +   * The Terminal (STDOUT)

    * A file

    * The terminal and a file


    # Output to the Terminal


    Two common commands print messages to the terminal (STDOUT):


    +   * echo

    * printf


    The echo command is mostly used for printing strings that require simple formatting.
    The printf command is the shell version of the C language function printf. It
    provides a high degree of flexibility in formatting output.


    You first look at echo and then printf.


    # echo


    The most common command used to output messages to the terminal is the echo command.
    Its syntax is


    ```

    echo string

    ```


    Here string is the string you wanted. For example, the command


    ```

    $ echo Hi

    ```


    produces the following output:


    ```

    Hi

    ```'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Input/Output


    You can also embed spaces in the output as follows:


    ```

    $ echo Safeway has fresh fruit

    Safeway has fresh fruit

    ```


    In addition to spaces, you can embed each of the following in the string:


    +   - Punctuation marks

    - Variable substitutions

    - Formatting escape sequences


    **Embedding Punctuation Marks** Punctuation marks are used when you need to ask
    the user a question, complete a sentence, or issue a warning. For example the
    following echo statement in an install script:

    echo Do you want to install?


    Usually, significant error messages are terminated with the exclamation point.
    For example, the echo command

    echo ERROR: Could not find required libraries! Exiting.


    might be found in a script that configures a program for execution.

    You can also use any combination of the punctuation marks. For example, the following
    command uses the comma (,), question mark (?), and exclamation point(!) marks:


    ```

    $ echo Eliza, where the devil are my slippers??

    Eliza, where the devil are my slippers?!

    ```


    **Embedding Variable Substitution** Chapters 7, "Variables," and 8, "Substitution,"
    variable substitution, which is the process that the shell uses to substitute
    in the value of a variable where that variable''s name occurs. Often variable
    substitution is embedded in an echo command, where part or all of the text of
    the message that is depends on the value of a variable.


    ```

    A common use of this technique is in the display of pathnames:

    echo Your home directory is $HOME

    Your home directory is /home/ranga

    ```


    In this example, you used the simplest form of variable substitution, the $ character,
    but you can use any form of variable substitution.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_210_0.png)'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Formatting with Escape Sequences


    In the previous examples, the output consisted of single lines with words separated
    by spaces. Frequently, output needs to be formatted into columns or multiple lines.
    By using escape sequences you can format the output of echo. An escape sequence
    is a special sequence of characters that represents another character. When the
    shell encounters an escape sequence, it substitutes the escape sequence with a
    different character. The echo command understands several formatting escape sequences,
    the most common of which are given in Table 13.1.


    # Table 13.1 ESCAPE SEQUENCES FOR THE ECHO COMMAND


    | Escape Sequence | Description |

    |---|---|

    | \n | Prints a newline character |

    | \t | Prints a tab character |

    | \c | Prints a string without a default newline |


    The \n escape sequence is usually used when you want to generate more than one
    line of output using a single echo command. You usually use this when you want
    to print a list preceded by a description of the list. For example, the command


    ```

    $ FRUIT_BASKET="orange pear"

    $ echo "Your fruit basket contains:\n$FRUIT_BASKET"

    Your fruit basket contains:

    apple pear

    ```


    generates a list of fruit preceded by a description of the using escape sequences:


    This example illustrates two important aspects of escape sequences:


    +   * The entire string is quoted.

    * The escape sequence appears in the middle of the string and is not separated
    by spaces.


    Whenever an escape sequence is used in the input string of an echo command, the
    string must be quoted to prevent the shell from expanding the escape sequence
    on the command line.


    Also, when an escape sequence is used in the input string of an echo command,
    the string is a specification of how the output should look. Spaces should not
    be used to separate the escape sequences unless that is how the output needs to
    be formatted.


    You can always write any echo command that uses the \n escape sequence as several
    echo commands. For example, you can generate the same output as in the previous
    example using the echo command:


    ```

    $ echo "Your fruit basket contains:"

    $ echo FRUIT_BASKET

    ```'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Input/Output


    Another commonly used escape sequence is the \t sequence, which generates a tab
    in the output. Usually it is used when you need to make a small table or generate
    tabular output that is only a few lines long. As an example, the following echo
    command generates a small table of two users and their usernames:


    ```

    $ echo "Name \tUser Name\nSriranga\trranga\nSrivathsa\tvvathsa"

    Name            User Name

    Sriranga        ranga

    Srivathsa      vathsa

    ```


    As you can see, the heading User Name is not centered over its column. You can
    change this by adding another tab:


    ```

    $ echo "Name \tUser Name\nSriranga\tranga\nSrivathsa\tvathsa"

    Name            User Name

    Sriranga        ranga

    Srivathsa      vathsa

    ```


    For generating large tables, the printf command, covered in the next section,
    is preferred because it provides a greater degree of control over the size of
    each column in the table.


    Another commonly used escape sequence is the \c sequence, which is frequently
    used in shell scripts to generate user prompts or diagnostic output.


    As you have seen in the previous example, the default behavior of echo is to add
    a newline at the end of its output. When you are generating a prompt, this is
    not the most user-friendly behavior. When the \c escape sequence is used, echo
    does not output a newline when it finishes printing its input string.


    As an example of its use, this excerpt from a shell script


    ```

    echo "Making directories, please wait...\tc"

    for i in ($DIRS_TO_MAKE); do mkdir -p $i; done

    echo "Done."

    ```


    produces diagnostic output that looks like the following:


    Making directories, please wait...            Done.


    Without the \c escape at the end of the first echo statement, the output looks
    like the following:


    Making directories, please wait...

    Done.


    As you can see, the previous version of the output is more user-friendly, especially
    if you have several such lines in sequence.


    Another possible use is shown in the following example:


    ![](img/21edd8d7854fe7f0c0d03baba9111541_212_0.png)'
