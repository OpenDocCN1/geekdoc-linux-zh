- img_proc: true
  md: '# Starting a Process


    Whenever you issue a command in UNIX, it creates, or starts, a new process. When
    you tried out the 1s command to list directory contents in Chapter 4, “Working
    with Directories,” you started a process (the 1s command).


    The operating system tracks processes through a five digit ID number known as
    the pid or process ID. Each process in the system has a unique pid. Pids eventually
    repeat because all possible numbers are used up and the next pid rolls or starts
    over. At any one time, no two processes with the same pid exist in the system
    because it is the pid that UNIX uses rolls over at the 16-bit signed boundary.
    The highest it gets before rolling over is 32,767.


    You can use the ps command to see what processes are running and all processes
    on the system. The ps command is described in the “Listing Running Processes”
    section of this chapter.


    When you start a process (run a command), there are two ways you can run it—in
    the foreground or background. The difference is how the process interacts with
    you at the terminal.


    # Foreground Processes


    By default, every process you start runs in the foreground. It gets its input
    from the keyboard and sends its output to the screen. You can redirect process
    input and output (see Chapter 13, “Input/Output”), but by default, input and output
    are connected to your terminal.


    You can see this with the 1s command. If I want to list all the files in my current
    directory (various chapters that start with a zero), I can use the following command:


    ```

    $ 1s ch*.doc

    ```


    On my screen, I see the following output:


    ```

    ch01-1.doc  ch10.doc   ch03-2.doc  ch04-1.doc

    ch04.doc    ch05.doc    ch06-2.doc

    ch01-2.doc  ch02-1.doc  ch20.doc   ch03.doc    ch04-2.doc

    ch05-1.doc  ch05.doc    ch06.doc

    ch01.doc     ch02-2.doc  ch03-1.doc  ch03.doc   ch04.doc

    ch05-2.doc  ch06-1.doc  ch06-0.doc

    ```


    The process runs in the foreground, the output is directed to my screen, and if
    the 1s command wants any input (which it does not), it waits for it from the keyboard.'
  merge: -1
  pgno: 105
- img_proc: true
  md: "While this command is running, I cannot run any other commands (start any other\
    \ processes). I can enter commands, but no prompt appears and nothing happens\
    \ until one completes because UNIX buffers keystrokes. For the ls command, which\
    \ usually runs very quickly, this is not a problem. But if I have something that\
    \ runs for a long time—such as a large complex, database query, program that calculated\
    \ pi, or a server—my terminal will be tied up.\n\nFortunately, I do not have to\
    \ wait for one process to complete before I can start another. UNIX provides facilities\
    \ for starting processes in the background, suspending foreground processes, and\
    \ moving processes between the foreground and background.\n\n> When you log off\
    \ or are disconnected from the system by a communication problem, your processes\
    \ are terminated. If you have a long running process that you do not want terminated,\
    \ you need to use the nohup command. nohup stands for HUP (Hang Up). The nohup\
    \ command is described later, in the section \"Keeping Background Processes Around\
    \ (nohup Command)\".\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_106_0.png)\n\n\
    # Background Processes\n\nA background process runs without being connected to\
    \ your keyboard. If the background process requires any keyboard input, it waits.\n\
    \nThe advantage of running a process in the background is that you can run other\
    \ commands; you do not have to wait until it completes to start another!\n\nThe\
    \ simplest way to start a background process is to add an ampersand (&) at the\
    \ end of the command.\n\nRunning the same ls command in the background example,\
    \ I use the following:\n\n$ ls ch*. & \nOn the screen, I see the following:\n\n\
    ```\n[1] 28757\n$ ch01-1.doc ch10.doc ch02.doc ch03-2.doc ch04-1.doc\n→ch04.doc\
