  md: '# TABLE 2.3 THE UNIX SYSTEM MANUALS


    | Manual Section | Description |

    | --- | --- |

    | 1 | Covers commands. |

    | 2 | Covers UNIX system calls. *System calls* are used inside a program, such
    as date, to ask the kernel for a service. |

    | 3 | Covers libraries. Libraries are used to store non-kernel-related functions
    used by C programmers. |

    | 4 | Covers file formats. This manual specifies the format of files such as `/etc/passwd`.
    |

    | 5 | Also covers file formats. |

    | 6 | Includes the instructions for playing the games that came with UNIX. |

    | 7 | Covers device drivers. |

    | 8 | Covers system maintenance. |


    Unlike the printed version, where you had to know the section where you needed
    to look for a particular manual page, the man command looks in all the sections
    for the information you requested. This makes it much easier to get help using
    the man pages.


    # # Summary


    In this chapter, I explained in greater detail what the shell is and how it works.
    You saw how the login process works and what the `login` command does to start
    a shell. From this you were able to look at the two modes in which the shell can
    run:


    +   * Interactively

    * Noninteractively


    In shell programming, the noninteractive use of the shell should interest you
    the most. This mode enables you to specify commands inside a file and then have
    the shell execute the commands within that file. You also saw how to make a file
    containing commands executable. This enables you to treat shell scripts as new
    commands.


    You also looked at some details of shell initialization and getting help using
    the man command.


    The next chapter formally introduces the concept of files by showing you how to
    list files, view the contents of files, and manipulate files.'
