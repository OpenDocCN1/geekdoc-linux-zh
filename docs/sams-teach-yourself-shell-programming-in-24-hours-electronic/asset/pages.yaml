  md: '# HOUR 4


    # Working With Directories


    **NEW TERM** UNIX uses a hierarchical structure for organizing files and directories.
    This structure is often referred to as a directory tree. The tree has a single
    root node, the slash character (/), and all other directories are contained below.


    You can use every directory, including /, to store both files and other directories.
    Every file is stored in a directory, and every directory / is stored in another
    directory.


    This is slightly different from the multroot hierarchical structure used by Windows
    and Mac OS. In those operating systems, all devices (floppy disk drives, CD-ROMs,
    hard drives, and so on) are mounted at the highest directory level. The UNIX model
    is slightly different, but after a short time most users find it extremely convenient.


    This chapter introduces the directory tree and shows you how to manipulate its
    building blocks: directories.'
