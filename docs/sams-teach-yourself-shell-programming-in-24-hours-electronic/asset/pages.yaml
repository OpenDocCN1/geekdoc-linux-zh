  md: "# Parameters\n\nthe number of given arguments, $#, matches the number of required\
    \ arguments. Add this check to the script:\n\n#!/bin/sh\n\n```\nUSAGE=\"Usage:\
    \ basename $0 [-c|-t] [file]directory\"\n\nif [ $# -lt 2 ]; then\n  echo \"USAGE\"\
    \n  exit 1\nfi\n\ncase \"$1\" in\n  -t) TARGS=\"tvf $2\";;\n  -c) TARGS=\"cvf\
    \ $2.tar $2\";;\n  *) echo \"USAGE\"\n    exit 0\nnesac\n```\n\ntar STARGS\n\n\
    # Handling Additional Files\n\nThis mytar script is mostly finished, but you can\
    \ still make a few improvements. For example, it only deals with the first file\
    \ that is given as an argument, and it does not check to see whether the file\
    \ argument is really a file.\n\nYou can add the processing of all file arguments\
    \ by using the special shell variable $$. Start with the -t (list contents) option.\
    \ The case statement now becomes\n\n```\ncase \"$1\" in\n  -t) TARGS=\"tvf\";\
    \ do\n    for i in \"$@\"; do\n      if [ -f \"$i\" ]; then tar TARGS \"$i\";\
    \ fi\n    done\n  ;\nn  -c) TARGS=\"cvf $2.tar $2\";\n    tar STARGS\n  ;\n  *)\
    \ echo \"USAGE\"\n    exit 0\nnesac\n```\n\nThe main change is that the -t case\
    \ now includes a for loop that cycles through the arguments and checks to see\
    \ whether each one is a file. If an argument is a file, tar is invoked on that\
    \ file.\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_200_0.png)"
