  md: '# # SAMS Teach Yourself

    # SHELL PROGRAMMING in 24 Hours


    To...


    | HOUR | TITLE | CONTENT |

    |---|---|---|

    | 1 | Shell Basics | UNIX shells (sh, khan, and bash) and a comparison. |

    | 2 | Script Bases | Create and run a script. |

    | 3 | Working with Files | List, copy, rename, remove files, and use their content.
    |

    | 4 | Working with Directories | Create and delete directories, list their contents,
    and copy and move files between them. |

    | 5 | Manipulating File Attributes | Identify files found on UNIX systems. Determine
    and change permissions. Learn about ownership and group membership. |

    | 6 | Processes | Background, foreground, and child processes. Start, list, and
    kill a process. |

    | 7 | Variables | Define variables, access their values, and use environment variables.
    |

    | 8 | Substitution | Filename, arithmetic, and command substitution. |

    | 9 | Quoting | The three forms of quoting; differences, when each is used. |

    | 10 | Flow Control | The if-then-else form of control and the case form of control.
    |

    | 11 | Loops | The while and for loops. The select loop of shell and bash. |

    | 12 | Parameters | How to pass parameters to scripts or functions; the commands
    to process parameters. |

    | 13 | Input/Output | How output works, getting input from users and using file
    descriptors. |

    | 14 | Functions | Create, use, and share data between functions and standalone
    functions. |

    | 15 | Text Filters | Commands used as filters. |

    | 16 | Using Regular Expressions | The similarities between awk and sed. Using
    them in shell scripts. |

    | 17 with awk | The filtering command used to search files for patterns and modify
    files. |

    | Miscellaneous Tools | UNIX commands encountered in shell scripts, including
    built-in and external commands. |

    | 19 | Dealing with Signals | Deliver signals to a process. Methods to deal with
    signals. |

    | 20 | Debugging | Debugging, syntax checking, and shell tracing. |

    | 21 | Problem Solving with Functions | A library of shell functions used to perform
    common UNIX tasks. |

    | 22 | Problem Solving with Shell Scripts | Using shell scripts to solve everyday
    problems. |

    | 23 | Scripting for Portability | Adapt your scripts to work in different versions
    of UNIX. |

    | 24 | Shell Programming FAQs | Common shell programming questions. |


    +   - ASSIGN THE OUTPUT OF A COMMAND TO VARIABLE 125

    - CATCH A SIGNAL 309

    - CHANGE OWNERSHIP 81

    - CHANGE PERMISSIONS 77

