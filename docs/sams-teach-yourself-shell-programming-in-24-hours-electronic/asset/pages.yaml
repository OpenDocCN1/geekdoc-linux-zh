    # Renaming Files (mv)


    To change the name of a file use the mv command. Its basic syntax is


    ```

    mv source destination

    ```


    Here source is the original name of the file and destination is the new name of
    the file. As an example,


    ```

    $ mv test_result test_result.orig

    ```


    changes the name of the file test to test_result.orig. A new file called test_result.orig
    is not produced in cp; only the name of the file is changed. There is no output
    from mv if the different name change is successful.


    If the source does not exist, as in the following example,


    ```

    $ mv test_reslut test_result.orig

    ```


    an error similar to the following is reported:


    ```

    mv: test_reslut: cannot access: No such file or directory

    ```


    # Interactive Mode


    Like cp, mv does not report an error if the destination already exists; it simply
    overwrites the file. to avoid this problem you can specify the -i option.


    For example, if the file ch07.bak already exists, the following command


    ```

    $ mv -i ch07 ch07.bak

    ```


    results in a confirmation prompt:


    ```

    remove ch07.bak? (n/y)

    ```


    If you choose n (no), the destination file is not touched. If you choose y (yes),
    the destination file is removed and the source file is renamed.


    The actual prompt varies between the different versions of UNIX.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_66_0.png)'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Removing Files (rm)


    **NEW TERM** To remove files use the rm command. The syntax is


    ```

    rm files

    ```


    Here files is a list of one or more files to remove. For example, the command


    ```

    $ rm res.01 res.02

    ```


    removes the files res.01 and res.02.


    # Common Errors


    The two most common errors using rm are


    +   - One of the specified files does not exist

    - One of the specified files is a directory


    As an example of the first case, the command


    ```

    $ rm res.01 res.02 res.03

    ```


    produces an error message if the file res.02 does not exist:


    ```

    rm: res.02 non-existent

    ```


    The two other files are removed.


    An example of the second case is the command


    ```

    $ rm res.01 res.03 work/

    ```


    This command produces another error message:


    ```

    rm: work directory

    ```


    The two files are removed.


    # Interactive Mode


    Because there is no way to recover a file that has been deleted using rm, you
    can specify the -i option. In interactive mode, rm prompts you for every file
    that is requested for deletion.


    For example, the command


    ```

    $ rm -i hw1 hw2 hw3

    ```


    produces confirmation prompts similar to the following:


    ```

    hw1: ? (n/y) y

    hw2: ? (n/y) n

    hw3: ? (n/y) y

    ```'
