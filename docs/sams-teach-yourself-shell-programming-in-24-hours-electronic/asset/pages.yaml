- img_proc: true
  md: '# Processes


    resume the foreground process, you have two choices—background and foreground.
    The bg command enables you to resume the suspended process in the background;
    the fg command returns it to the foreground. fg is covered in the next section.


    For example, you start a long running process. I''m using long_running_process
    for the following example:


    ```

    $ long_running_process

    ```


    While it is running, you decide that it should run in the background so your terminal
    is not tied up. To do that, you press the Ctrl+Z key and see the following (~Z
    is your Ctrl+Z key being echod):


    ```

    ^[1] + Stopped (SIGTSTP)

    long_running_process

    $

    ```


    You tell the job number (1) and that the process is Stopped. Then you get a prompt.
    Resume the job in the background, you enter the bg command as follows:


    ```

    $ bg

    [1] long_running_process &\n$

    ```


    As a result, the process runs in the background. Look at the last character on
    the second line, the ampersand (&). As a reminder, the shell displays the ampersand
    to remind you that the job is running in the background. It behaves just like
    a command where you type the ampersand at the end of the line.


    By default, the bg command moves the most recently suspended process to the background.
    You can have multiple processes suspended at one time. To differentiate them,
    put the job number prefixed with a percent (%) on the command line.


    In this example, I start two long running processes, suspend both of them, and
    put the first one into the background. The next few lines show starting and suspending
    two processes:


    ```

    $ long_running_process

    ^[1] + Stopped (SIGTSTP)

    long_running_process

    $ long_running_process2

    ^[2] + Stopped (SIGTSTP)

    long_running_process2

    ```


    Move the first one to the background, I use the following:


    ```

    $ bg %1

    [1] long_running_process &

    $

    ```


    The second process is still suspended and can be moved to the background as follows:


    ```

    $ bg %2

    [2] long_running_process2 &

    $

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_110_0.png)'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'The capability to specify which job to perform an action (move to foreground
    or background for instance) shows the importance of having job numbers assigned
    to background-processes.


    # Moving a Background Process to the Foreground (fg Command)


    When you have a process that is in the background or suspended, you can move it
    to the foreground with the fg command. By default, the process most recently suspended
    or moved to the background moves to the foreground. You can also specify which
    job, using its job number, you want to make foreground.


    > If you''re ever in doubt about which job will be moved to the background or
    foreground, don''t guess. Put the job number on the bg or fg command, prefixed
    with a percent sign.


    Using the long running process in the previous section, a foreground process is
    suspended and moved into the background in the following example:


    ```

    $ long_running_process

    Z[1] + Stopped ($SIGTSTP) long_running_process

    $ bg

    [1] long_running_process &\$

    ```


    You can move it back to the foreground as follows:


    ```

    $ fg %1

    long_running_process

    ```


    The second line shows which command you moved back to the foreground. The same
    thing would have happened if it was moved back to the foreground after being suspended.


    # Keeping Background Processes Around (nohup Command)


    You can prevent a background process from terminating, which is the default action.
    when you sign off or are disconnected. The nohup command prevents your process
    from getting the HUP (Hang UP) signal and enables it to continue processing.


    The nohup command is simple to use—just add before the command you actually want
    to run. Because nohup is designed to run when there is no terminal attached, it
    wants you to redirect output to a file. If you do not, nohup redirects automatically
    to a file known as nohup.out.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Processes


    Running a process in the background with nohup looks like the following:


    ```

    $ nohup ls &

    [1] 6695

    $ Sending output to nohup.out

    ```


    Because I do not redirect the output from nohup, it does it for me. If I redirect
    the output (nohup ls > results &), I do not see the completion message.


    After waiting a few moments and pressing Enter, I see the following:


    ```

    [1] + Done nohup ls &

    $

    ```


    You can look at the file nohup.out using cat, more, pg, vi, view or your preferred
    tool to see the results.


    # Waiting for Background Processes to Finish (wait Command)


    There are two ways to wait for a background process to finish before doing something
    else. You can press the Enter key every few minutes until the completion message,
    or you can use the wait command.


    There are three ways to use the wait command—with no options (the default), with
    a process ID, or with a job number prefixed with a percent sign. The command will
    wait for the completion of the job or process you specify.


    If you do not specify a job or process (the default setting), the wait command
    waits for all background jobs to finish. Using wait without any options is useful
    in a shell script that starts a series of background jobs. When they are all done,
    it can continue process-ing.


    With the ls command from the previous example running, I can force a wait with
    the following:


    ```

    $ wait %1

    ```


    I can not enter another command until job number 1 finishes. If I use wait, I
    do not get the completion message (Done).


    ![](img/21edd8d7854fe7f0c0d03baba9111541_112_0.png)


    # Running Processes


    You can start processes in the foreground and background, suspend them, and move
    them between the foreground and background, but how do you know what is running?
    There are two commands to help you find out—jobs and ps.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# jobs Command


    The jobs command shows you the processes you have suspended and the ones running
    in the background. Because the jobs command is a foreground process, it cannot
    show your active foreground processes.


    In the following example, I have three jobs. The first one (job 3) is running,
    the second (job 2) is suspended (a foreground process after I used Ctrl+Z), and
    the third (job 1) is stopped in the background to wait for keyboard input:


    ```

    $ jobs

    [3] + Running first_one &\n[2] - Stopped (SIGSTP) second_one

    [1] Stopped (SIGTIN) third_one &

    ```


    I can manipulate these jobs with the fg and bg commands. The most recent job is
    job number 3 (shown with a plus sign); this is the one that bg or fg act on if
    no job number is supplied. The most recent job before that is job number 2 (with
    a minus sign).


    ![](img/21edd8d7854fe7f0c0d03baba9111541_113_0.png)


    > The reason for the plus and minus symbols on the jobs listing is that job numbers
    are reassigned when one completes and another starts. In the previous example,
    if job number 2 finishes and you start another job, it is assigned job number
    2 and a plus sign because it is the most recent job.


    # ps Command


    Another command that shows all processes is the ps (Process Status) command. By
    default, it shows those that you are running. It also accepts many different options,
    a few of which are shown here.


    There are different flavors, or versions, of UNIX. ps is one command where the
    differences are very obvious. The examples in this chapter are based on System
    V, a UNIX standard developed by UNIX Systems Labs (USL) when it was part of AT&T.
    If you are using a version of UNIX based on Berkeley Systems Division (BSD), like
    Linux, your output will be different.


    The simplest example (with the same three jobs running as the previous example)
    is the ps command alone:


    ```

    $ ps

    PID TTY TIME CMD

    6738 pts/6 0:00 first_one

    ```'
  merge: -1
  pgno: 113
- img_proc: true
  md: "# Processes\n\n```\n6739 pts/6    0:00 second_one\n3662 pts/6    0:00 ksh\n\
