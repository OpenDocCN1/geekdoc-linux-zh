  md: '# # Teach Yourself in 24 Hours Shell Programming


    Sams Teach Yourself in 24 Hours provide quick and easy answers in a proven step-by-step
    approach that works for you. In just 24 sessions of one hour or less, you will
    tackle every task you need to get the results you want. Let our experienced authors
    present the most accurate information to get you reliable answers—fast!


    The tear-out card is a quick reference for you. It covers the major commands and
    the syntax of the programming constructs available in the shell.


    Here is a brief description some of the built-in commands and their availability
    in the different shells, sh, ksh, and bash.


    Table 1 BUILT-IN COMMANDS AND THEIR AVAILABILITY.


    | COMMAND | SHELLS | DESCRIPTION | COMMAND | SHELLS | DESCRIPTION |

    | --- | --- | --- | --- | --- | --- |

    | alias | ksh & bash | creates a shorthand for a command | pwd | all | prints
    the current directory |

    | bg | ksh & bash | backgrounds a job | return | all | returns from a function
    |

    | cd | all | changes the directory | set | all | changes shell options |

    | exec | all | replaces the current process with a new process | shift | all |
    removes the first argument and shifts up the others |

    | exit | all | exits the shell with status n | trap | all | used to specify the
    code needed to deal with a signal |

    | export | all | puts variables into the environment | type | all | displays the
    path to a command |

    | fg | ksh & bash | puts a job in the foreground | unalias | ksh & bash | removes
    an alias |

    | jobs | ksh & bash | lists the background and suspended jobs | unset | all |
    undefines variables |

    | kill | all | used to send a signal to a process | | |


    * Note*'
