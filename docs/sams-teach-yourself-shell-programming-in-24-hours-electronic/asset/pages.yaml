    \ variable is required to maintain a list of all the child processes of the script,\
    \ because the possible child process are\n\n+   - The timer\n- The program\n\n\
    # AlarmHandler\n\nThe first thing that you do is to install a handler for the\
    \ ALARM signal. This handler is the function AlarmHandler:\n\n```\nAlarmHandler()\
    \ {\n    echo \"Got SIGALARM, cmd took too long.\"\n    KillSubProcs\n    exit\
    \ 14\n}\n```\n\nThis is a simple function that prints a message to the screen,\
    \ calls the function KillSubProcs, and then exits with an exit code of 14 to indicate\
    \ that the alarm was triggered.\n\nKillSubProcs function is a simple function\
    \ that kills all the child processes of script as stored in the variable CHPROCIDS:\n\
    \n```\nKillSubProcs() {\n    kill ${CHPROCIDS:$!}\n    if [ $7 -eq 0 ]; then\n\
    \        echo \"Sub-processes killed.\"\n    fi\n}\n```\n\n# SetTimer\n\nThe next\
    \ task that you perform is to set the timer using the SetTimer function:\n\n```\n\
    SetTimer() {\n    DEF_TOUT=${1:-10}\n    if [ $DEF_TOUT -ne 0 ]; then\n      \
    \  sleep $DEF_TOUT && kill -s 14 $$\n        CHPROCIDS=\"$CHPROCIDS \\$!\"\n \
    \       TIMERPROC=$!\n    fi\n}\n```"
