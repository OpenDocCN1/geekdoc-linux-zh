- img_proc: true
  md: '# # Enabling Debugging


    By now, you are quite familiar with the basic syntax for executing a shell script:


    $ script arg1 arg2 ... argN


    Here *script* is the name of the script, and *arg1* through *argN* are the arguments
    to the script. A frequently used alternative method to execute a shell script
    is


    $ /bin/sh arg1 arg2 ... argN


    Here you explicitly specify the shell, in this case /bin/sh, that you used to
    execute the script. The advantage of this method is that you can enable a debugging
    mode by supplying arguments to the shell.


    Using this method of script invocation, the basic syntax for enabling a debugging
    mode is


    $ /bin/sh option script arg1 arg2 ... argN


    Here *option* is one of the debugging options covered in Table 20.1.

    A third way of enabling debugging is to change the first line of the *script*.
    Usually, the first line of a script is


    #!/bin/sh


    UNIX uses this line to determine the shell you can use to execute a script. This
    indicates that the shell /bin/sh should be used to execute the script. Modify
    this line to specify a debugging option as follows:


    #!/bin/sh option


    Here *option* is one of the debugging options listed in Table 20.1.

    Because the previously mentioned methods for enabling debugging modes take effect
    when a script is invoked, they are sometimes referred to as *invocation activated
    debugging modes.


    Table 20.1 DEBUGGING OPTIONS FOR SHELL SCRIPTS


    | Option | Description |

    | - | - |

    | -n | Reads all commands, but does not execute them. |

    | -v | Displays all lines as they are read. |

    | -x | Displays all commands and their arguments as they execute. This option
    is often referred to as the *shell tracing* option. |'
  merge: -1
