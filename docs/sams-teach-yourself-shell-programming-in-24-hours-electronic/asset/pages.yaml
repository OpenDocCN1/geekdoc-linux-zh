- img_proc: true
  md: 'DESCRIPTION

    The uptime command prints the current time, the length of time the system has
    been up, and the average number of jobs in the run queue over the last 1, 5 and
    15 minutes. It is, essentially, the first line of a w(1) command.


    EXAMPLE

    Below is an example of the output uptime provides:

    example% uptime

    10:47am up 27 day(s), 50 mins, 1 user,

    --load average: 0.18, 0.26, 0.20


    SEE ALSO

    w(1), who(1), whodo(1M), attributes(5)


    NOTES

    who -b gives the time the system was last booted.


    As you can see this page is divided into several sections. These sections are
    described in Table 2.1.


    # TABLE 2.1 SECTIONS IN A MAN PAGE


    | Section | Description |

    | NAME | This section gives the name of the command along with a short description
    of the command. |

    | SYNOPSIS | This section describes all the different modes in which the command
    can run. If a command accepts arguments they are shown in this section. |

    | DESCRIPTION | This section includes a verbose description of the command. If
    a command accepts arguments, each argument will be fully explained in this section
    |

    | EXAMPLE | This section usually shows you how to execute a command, along with
    some sample output |

    | SEE ALSO | This section lists other commands that are related to this command.
    |

    | NOTES | This section usually lists some additional information about the command.
    Sometimes it lists known bugs with a particular command. |


    Most man pages include all the sections given in Table 2.1 and might include one
    or two optional sections described in Table 2.2.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# TABLE 2.2 OPTIONAL SECTIONS FOUND IN MAN PAGES


    | Section | Description |

    | AVAILABILITY | This section describes the versions of UNIX that include support
    for a given command. Sometimes it lists the optional software packages to purchase
    from the vendor to gain extra functionality from a command. |

    | KNOWN BUGS | This section usually lists one or more known problems with a command.
    If you encounter a problem that is not included in this section, you should report
    it to your UNIX vendor. |

    | FILES | This section lists the files that are required for a command to function
    correctly. It might also list the files that can be used to configure a command.
    |

    | AUTHORS OR CONTACTS | These sections list the command''s authors or provide
    some contact information regarding a command. |

    | STANDARDS COMPLIANCE | Some commands behave that is specified by a standards
    organization such as ISO (International Standards Organization), IEEE (Institute
    of Electrical and Electronic Engineers), or ANSI (American National Standards
    Institute). This section lists the standards with which a particular command complies.|


    Using the man command to get more information on some of the commands I have discussed
    in this chapter.


    If the man command cannot find a page corresponding to the command requested,
    it issues an error message. For example, the command


    ```

    $ man apple

    ```


    produces an error message similar to the following on my system:


    No manual entry for apple


    The exact error message depends on your version of UNIX.


    # Manual Sections


    The term manual page comes from the original versions of UNIX, when the online
    pages were available as large bound manuals. In all, there were eight different
    manuals covering the main topics of the UNIX system. These manuals are described
    in Table 2.3.'
