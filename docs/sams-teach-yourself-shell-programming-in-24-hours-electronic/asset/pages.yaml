    # Variable Substitution


    Variable substitution enables the programmer to manipulate the value of a variable
    based on its state. Variable substitution falls into two categories:


    +   - Actions when a variable has a value

    - Actions taken when a variable does not have a value


    The actions range from one time value to four forms of variable substitution.
    You can use variable substitutions as shorthand forms of expressions that would
    have to be written as explicit *if-then-else* statements, covered in Chapter 10,
    “Flow Control.” Table 8.2 provides a summary of all variable substitution methods.


    Table 8.2 VARIABLE SUBSTITUTION

    | Form | Description |

    | --- | --- |

    | $(parameter:word) | If *parameter* is null or unset, *word* is substituted for
    *parameter*. The value of *parameter* does not change. |

    | $(parameter:word) | If *parameter* is null or unset, *parameter* is set to value
    of *word*. |

    | $(parameter?:message) | If *parameter* is null or unset, *message* is printed
    to standard error. This checks that variables are set correctly. |

    | $(parameter::word) | If *parameter* is set, *word* is substituted for *parameter*.
    The value of *parameter* does not change. |


    # Substituting a Default Value


    The first form enables a default value to be substituted when a variable is unset
    or null. This is formally described as


    ```

    $(parameter:-word)

    ```


    Here *parameter* is the name of the variable, and *word* is the default value.
    A simple example of it is


    ```

    PS1=${HOST:-localhost}" $ ; export PS1 ;

    ```'
