  md: '# Filtering Text with awk 263


    The main problem here is that the lines you wanted to flag with the * are no longer
    formatted in the same manner as the other lines. You could solve this using printf,
    but a much nicer and simpler solution is to use the $0 field. The variable $0
    is used by awk to store the entire input line as it was read. Change the script
    as follows:


    ```

    #!/bin/sh

    awk ''/$[1-9][0-9]*\.[0-9][0-9]*/ { print $0,"" *"; }

    awk ''/$0.[0-9][0-9]*/ { print ; }''

    '' fruit_prices.txt

    ```


    This changes the output so that all the lines are formatted identically:


    +   - Banana $0.89 100

    - Peach $0.79 65

    - Kiwi $1.50 2 *

    - Pineapple $1.29 35 *

    - Apple $0.99 78


    # Comparison Operators


    Say that you have to all the fruit whose quantity is less than 75 for reorder
    by appending the string to the end of their line. In this case you have to check
    whether the third field, which holds the quantity, is less than or equal to 75.


    To solve this problem, you need to use a comparison operator. In awk, comparison
    operators compare the values of numbers and strings. Their behavior is similar
    to operators found in the C language or the shell.


    When you use a comparison operator, the syntax of an awk command changes to the
    following:


    ```

    expression { actions; }

    ```


    Here expression is constructed using one of the comparison operators given in
    Table 17.1


    # Table 17.1 COMPARISON OPERATORS IN AWK


    | Operator | Description |

    | --- | --- |

    | < | Less than |

    | > | Greater than |

    | <= | Less than or equal to |

    | >= | Greater than or equal to |

    | == | Equal to |


    continues'
