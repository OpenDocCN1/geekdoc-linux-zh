  md: '# Sorting Numbers


    At this point the output is sorted alphabetically. Although this output is useful,
    it is much easier to determine the most frequently used words if the list is sorted
    by the number of times a word occurs.


    To obtain such a list, you need sort to sort by numeric value instead of string
    comparison. It would be nice if the largest number was printed first. By default,
    sort prints the largest number last. To satisfy both of these requirements, you
    specify the -n (as in numeric) and -r (r as in reverse) options to sort the command:


    ```

    $ tr ''!!?"?:;{{}}{}(),_\t'' ''\n'' < /home/ranga/docs/ch15.doc

    sort ''A-Z'' ''a-z'' tr -s tr '' ''\n'' sort uniq -c

    sort -rn

    ```


    By piping the output to head, you can get an idea of what the ten most repeated
    words are:


    ```

    $ tr ''!!?"?:;{{}}{}(),_\t'' ''\n'' < /home/ranga/docs/ch15.doc

    sort ''A-Z'' ''a-z'' tr -s tr '' ''\n'' sort uniq -c

    sort -rn head

