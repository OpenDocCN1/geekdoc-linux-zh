    # A Walkthrough of mvdir.sh


    I''ll walk through the script and highlight some of the important points.


    The first thing this script does is set the PATH variable (line 7). You do this
    to ensure that all the commands you use come from one of two directories that
    you specified. When you write a script that can be run by many users, you have
    to take into account that users might have modified their PATH that the commands
    you are using are inaccessible or replaced by other versions. By setting the PATH
    variable explicitly, you avoid this problem.


    The next script defines a few utility functions (lines 11 and 15) used to print
    error messages. You can easily modify the script to replace these functions with
    the versions I gave you in Chapter 21.'
