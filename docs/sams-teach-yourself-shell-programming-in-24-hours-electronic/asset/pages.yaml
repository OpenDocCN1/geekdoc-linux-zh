  md: '# Appendix A


    exec n> file redirect output of file descriptor n to (overwrite) file. This applies
    to subsequent UNIX commands.


    exec n>> file same as above but append to file instead of overwriting redirect
    STDERR from UNIX command to wherever STDOUT is currently going. This is useful
    when you want to save output and errors in a file or pipe them to another command,
    for example: cmd > file 2>&1 This saves STDERR and STDOUT in file. 2>&1 must come
