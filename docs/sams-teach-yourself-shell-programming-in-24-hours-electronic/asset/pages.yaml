  md: '# Manipulating Files


    In the preceding sections, you looked at listing files and viewing their content.
    In this section you look at the following methods of manipulating files:


    +   * Copying files

    * Renaming files

    * Removing files


    # Copying Files (cp)


    To make a copy of a file use the cp command. The basic syntax of the command


    ```

    cp source destination

    ```


    Here source is the name of the file that is copied and destination is the name
    of the copy. For example, the following command makes a copy of the file test_results
    and places the copy in a file named test_results.org:


    ```

    $ cp test_results test_results.org

    ```


    # Common Errors


    There is no output from the cp command, unless it encounters an error. Two common
    errors occur when


    +   * The source is a directory

    * The source does not exists


    An example of the first case is the command


    ```

    $ cp work docs

    ```


    This causes an error message similar to the following:


    ```

    cp: work: is a directory

    ```


    An example of the second case is the command


    ```

    $ cp test_relsuts test_results.org

    ```


    Here I have mistyped the filename test_results as test_relsuts and cp gives the
    following error:


    ```

    cp: cannot access test_relsuts: No such file or directory

    ```'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Interactive Mode


    **NEW TERM** No error message is generated if the destination already exists.
    In this case, the destination file is automatically overwritten. This can lead
    to serious problems.


    To avoid this behavior you can specify the -i (as in interactive) options to cp.


    If the file test_results.orig exists, the command


    ```

    $ cp -i test_results.orig test_results.orig

    ```


    results in a prompt something like the following:


    ```

    overwrite test_results.orig? (y/n)

    ```


    If you choose y (yes), the file is overwritten. If you choose n (no), the file
    test_results.orig isn''t changed.


    # Copying Files to a Different Directory


    If the destination is a directory, the copy has the same name as the source but
    is located in the destination directory. For example, the command


    ```

    $ cp test_results work/

    ```


    places a copy of the file test_results in the directory work.


    # Multiple Inputs


    If more than two inputs are given, cp treats the last argument as the destination
    and the other files as sources. This only works if the sources are files and the
    destination is a directory, as in the following example:


    ```

    $ cp res.01 res.02 res.03 work/

    ```


    If one or more of the sources are directories the following error message is produced.
    For example, the command


    ```

    $ cp res.01 work/ docs/ pub/

    ```


    produces the following error:


    ```

    cp: work: is a directory

    cp: docs: is a directory

    ```


    Although cp reports errors, the source file, in this case res.01, is correctly
    copied to the directory pub.


    If the destination is a file, but multiple inputs are given, as in the following
    example:


    ```

    $ cp hw1 hw2 hw3

    ```'
  merge: -1
