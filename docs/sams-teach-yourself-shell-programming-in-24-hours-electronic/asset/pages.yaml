  md: '```

    kill pid

    kill -s SIGTERM pid

    ```


    are equivalent.


    Now look at a few examples of using the kill command to deliver other signals.


    # HUP


    The following command


    ```

    $ kill -s SIGHUP 1001

    ```


    sends the HUP or hang-up signal to the program that is running with process ID
    1001. You can also use the numeric value of the signal as follows:


    ```

    $ kill -1 1001

    ```


    This command also sends the hang-up signal to the program that is running with
    process ID 1001. Although the default action for this signal calls for the process
    to terminate, many UNIX programs use the HUP signal as an indication that they
    should reinitialize themselves. For this reason, you should use a different signal
    if you are trying to terminate or kill a process.


    # QUIT AND INT


    If the default command cannot terminate a process, you can try to send the a QUIT
    or an INT (interrupt) signal as follows:


    ```

    $ kill -s SIGQUIT 1001

    ```


    or


    ```

    $ kill -s SIGINT 1001

    ```


    One of these signals should terminate a process, either by asking it to quit (the
    QUIT signal) or by asking it to interrupt its processing (the INT signal).


    # kill


    Some programs and shell scripts have special functions called signal handlers
    that can ignore or discard these signals. To terminate such a program, use the
    kill signal:


    ```

    $ kill -9 1001

    ```'
