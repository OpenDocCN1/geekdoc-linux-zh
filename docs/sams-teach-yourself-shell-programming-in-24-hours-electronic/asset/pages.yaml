    matches lines that contain strings such as a+c, a-c, abc, match, and a3c, whereas
    the

    pattern


    /a*c/


    matches the same strings along with strings such as ace, yacc, and arctic. It
    also

    matches the following line:


    close the window


    Notice that there is no letter a in this sentence. The * metacharacter matches
    zero or

    more occurrences of the character immediately preceding it. In this case it matched
    zero

    occurrences of the letter a.


    Another important thing to note about the * is that it tries to make the longest
    possible

    match. For example, consider the pattern


    /a*a/


    and the following line


    able was I, ere I saw elba


    Here you have asked to match lines that contain a string that starts with the
    letter a and

    ends with the letter a. In the sample line, there are several possibilities:


    able wa

    able was I, ere I sa

    able was I, ere I saw elba


    Because you used the * metacharacter, the last possibility is selected.


    You can combine the * and the * metacharacters to obtain behavior equivalent to
    the *

    filename expansion wildcard. For example, the following expression


    /ch.*doc/


    matches the strings ch1.doc, ch2.doc, and chdoc. The shell''s * wildcard matches
    files

    by the same names.


    # Specifying Sets of Characters


    One of the major limitations with the . operator is that it does not enable you
    to specify

    which characters you want to match. It matches all characters. To specify a particular
    set

    of characters in a regular expression, use the bracket characters, ( ( and ),
    as follows:


    /[chars]/


    Here a single character in the set given by chars is matched. The use of sets
    in regular

    expression is almost identical to the shell''s use of sets in filename substitution.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_264_0.png)'
