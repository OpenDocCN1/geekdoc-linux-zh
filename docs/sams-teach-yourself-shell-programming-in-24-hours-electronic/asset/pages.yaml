- img_proc: true
  md: '# The Bourne Again Shell


    The Bourne Again shell, bash, was developed as part of the GNU project and has
    replaced the Bourne shell, sh, for GNU-based systems like Linux. All major Linux
    distributions, including Red Hat, Slackware, and Caldera, ship with bash as their
    sh replacement.


    Although it includes C shell (csh and tcsh) and Korn shell (ksh) features, bash
    retains syntax compatibility with the Bourne shell, enabling it to run Bourne
    shell scripts.


    bash was written by Brian Fox (bfox@gnu.ai.mit.edu) of the Free Software Foundation
    and is currently maintained by Chester Ramey (chet@cwru.edu) of Case Western University.


    bash is available for anonymous FTP from any of the GNU archive sites, including
    the main GNU archive site:


    ```

    ftp://prep.ai.mit.edu/pub/gnu/

    ```


    As of this writing, the most recent release version of bash is 2.02.1.


    Because bash is an implementation of the IEEE POSIX 1003.2/ISO 9945.2 Shell and
    Tools specification, it is extremely portable and can be built on most UNIX systems.
    It has also been ported to QNX, Minix, OS/2, and Windows 95/NT.


    Currently, only Linux ships ship with the Bourne Again shell. It is installed
    as /bin/bash. On most Linux systems, it is also installed as /bin/sh.


    Some features that bash includes in addition to those of the Korn shell are


    +   - Name completion for variable names, usernames, host names, commands, and
    filenames

    - Spelling correction for pathnames in the cd command

    - Arrays of unlimited size

    - Integer arithmetic in any base between 2 and 64'
