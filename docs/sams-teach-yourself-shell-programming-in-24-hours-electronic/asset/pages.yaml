  md: '# Problem Solving with Functions


    Some of the functions you will look at


    +   * printERROR

    * printWARNING

    * printUSAGE

    * promptYESNO

    * promptRESPONSE

    * getSpaceFree

    * getSpaceUsed

    * getPID

