- img_proc: true
  md: 'Here you are using the chmod command. For a complete discussion of how to use
    this command, please see Chapter 5, "Manipulating File Attributes."


    To ensure that the correct shell is used to run the script, you must add the "magic"
    line to the beginning of the script:


    ```

    #!/bin/sh

    ```


    Your script then has two lines:


    ```

    #!/bin/sh

    date ;

    ```


    The magic line causes a new shell (in this case, /bin/sh) to be called to execute
    the script. Without the magic line, the current shell is always used to evaluate
    the script, regardless of which shell the script was written for. For example,
    without a magic line, csh and tsh users might not be able to get a Bourne (sh)
    script to run correctly.


    The Magic Of #!/bin/sh

    The #!/bin/sh must be the first line of a shell script in order for sh to be used
    to run the script. If this appears on any other line, it is treated as a comment
    and ignored by all shells.


    # Comments


    The magic first line #!/bin/sh introduces the topic of comments. A comment is
    a statement that is embedded in a shell script but should not be executed by the
    shell.


    In shell scripts, comments start with the # character. Everything between the
    # and the end of the line are considered part of the comment and are ignored by
    the shell.


    Adding comments to a script is quite simple: Open the script using an editor and
    add lines that start with the # character. For example, to add the following line
    to the logins script:


    ```

    # print out the date and who''s logged on

    ```


    I opened the file logs with my editor and inserted this line as the second line
    in the file. The shell script is now as follows:


    ```

    #!/bin/sh

    # print out the date and who''s logged on

    date ; who;

    ```'
