  md: '# HOUR 10


    # Flow Control


    The order in which commands execute in a shell script is called the flow of the
    script. In the scripts that you have looked at so far, the flow is always the
    same because the same set of commands executes every time.


    In most scripts, you need to change the commands that execute depending on some
    condition provided by the user or detected by the script itself. When you change
    the commands that execute based on a condition, you change the flow of the script.
    For this reason, the commands discussed in this chapter are called flow control
    commands. You might also see them referred to as conditional flow control commands
    because they change the flow of a script based on some condition.


    Two powerful flow control mechanics are available in the shell:


    +   * The if statement

    * The case statement


    The if statement is normally used for the conditional execution of commands, whereas
    the case statement enables any number of command


    ![](img/21edd8d7854fe7f0c0d03baba9111541_162_0.png)'
