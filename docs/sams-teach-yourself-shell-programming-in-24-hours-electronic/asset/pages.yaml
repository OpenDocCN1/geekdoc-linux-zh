  md: "# Functions 219\n\n+   * Producing error messages when something goes wrong.\
    \ If your script does not tell users what went wrong, they will be extremely confused\
    \ and might not use your script again.\n\n# Implementing popd\n\nThe popd() function\
    \ is far more complicated than the other two. First look at the operations that\
    \ it performs:\n\n+   1. Removes the first entry from the directory stack variable\n\
    2. Updates the directory stack to reflect the removal\n3. Changes to the directory\
    \ indicated by the entry that was removed from the stack\n4. Displays the full\
    \ path of the current directory\n\nIn order to make the second operations easy,\
    \ implement a helper function for popd() called _popd_helper(). This function\
    \ performs all the work; popd() is simply a wrapper around it. Frequently, you\
    \ need to write functions in this manner: one function that simplifies the interface\
    \ and one that performs the work.\n\n# The Helper Function\n\nLook at _popd_helper\
    \ first to see how the directory stack is manipulated:\n_popd_helper() {\n\n```\n\
    # set the directory to pop to the first argument, if\n# this directory is empty,\
    \ issue an error and return 1\n# otherwise get rid of POPD from the arguments\n\
    \nPOPD=\"$1\"\nif [ -z \"SOPPD\" ]; then\n\techo \"ERROR: The directory stack\
    \ is empty.\" >&2\n\treturn 1\nfi\nshift\n\n# if any arguments remain, reinitialize\
    \ the directory\n# stack, and then update it with the remaining items,\n# otherwise\
    \ set the directory stack to null\n\nif [ -n \"$1\" ]; then\n\tdIR_STACK=\"$1\"\
    ;\n\tshift;\n\tfor i in $0; do _DIR_STACK=\"$DIR_STACK:$i\"; done\nelse\n\t_DIR_STACK=\n\
    ```\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_238_0.png)"
  merge: -1
