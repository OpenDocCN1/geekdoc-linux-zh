  md: 'To format numbers, specify a number formatting sequence, such as %f, %e, or
    %g, instead of the string formatting sequence, %s. One of the questions at the
    end of this chapter familiarizes you with using number formats.


    # Output Redirection


    In the process of developing a shell script, you often need to capture the output
    of a command and store it in a file. When the output is in a file, you can edit
    and modify it easily.


    In UNIX, the process of capturing the output of a command and storing it in a
    file is called *output redirection* because it redirects the output of a command
    into a file instead of STDOUT. To redirect the output of a command or a script
    to a file, instead of STDOUT, use the output redirection operator, >, as follows:


    NEW TERM To redirect the output of a command or a script to a file, instead of
    STDOUT, use the output redirection operator, >, as follows:


    ```

    command > file

    list > file

    ```


    The first command redirects the output of the specified *command* to a specified
    *file*, whereas the second redirects the output of a specified *list* to a specified
    *file*. If *file* exists, its contents are overwritten; if *file* does not exist,
    it is created.


    For example, the command


    ```

    date > now

    ```


    redirects the output of the date command into the file now. The output does not
    appear on the terminal, but it is placed in the file instead. If you view the
    file now, you find the output of the date command:


    ```

    $ cat now

    Sat Nov 14 11:14:01 PST 1998

    ```


    You can redirect the output of lists as follows:


    ```

    { date; uptime; who; } > mylog

    ```


    Here out the output of the commands date, uptime, and who is redirected into the
    file mylog.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_217_0.png)


    > When you redirect output to a file using the output redirection operator, the
    shell overwrites the data in that file with the output of the command you specified.
    For example, the command


    $ date > now


    overwrites all the data in the file now with the output of the date command. For
    this reason, you should take extra care and make sure the file you specified does
    not contain important information.'
