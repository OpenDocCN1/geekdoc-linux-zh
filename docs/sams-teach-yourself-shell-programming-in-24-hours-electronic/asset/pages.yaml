  md: "The basic syntax of the if statement is\n\n```\nif (expression1) {\n  action1\n\
    } else if (expression2) {\n  action2\n} else {\n  action3\n}\n```\n\nHere expression1\
    \ and expression2 are expressions created using the conditional operators. They\
    \ are identical to expressions you looked at earlier in the chapter. The surrounding\
    \ expression1 and expression2 are required.\n\nThe actions—action1, action2, and\
    \ action3—can be any sequence of wild awk commands. The braces surrounding these\
    \ actions are required only when an action contains more than one statement, but\
    \ I recommend that you always use them for the sake of clarity and maintainability.\n\
    \nBoth the if and the else statements are optional. There is no limit on the number\
    \ of else if statements that can be given.\n\nThe execution is as follows:\n\n\
    +   1. Evaluate expression1 (if).\n2. If expression1 is true, execute action1\
    \ and exit the if statement.\n3. If expression1 is false, evaluate expression2\
    \ (else if).\n4. If expression2 is true, execute action2 and exit the if statement.\n\
    5. If expression2 is false, execute action3 and exit the if statement (else).\n\
    \nAs a simple example, write a script that prints a list of fruit in fruit_prices.txt\
    \ highlighting the following facts:\n\n+   * Whether an item costs more than a\
    \ dollar\n* Whether you need to reorder the item\n\nFruit that costs more than\
    \ a dollar is highlighted with the * character. Fruit that needs to be reordered\
    \ because its quantity is less than 75 is highlighted with the string REORDER.\n\
    \nUsing the if statement, the script becomes\n\n```\n#!/bin/sh\nawk '\n  printf\
    \ \"%s\\t\",$0;\n```"
