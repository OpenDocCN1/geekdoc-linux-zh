  md: '# Dealing with Signals


    As an illustration, say you a shell script with a shell function called DoImportantStuff().
    This routine should not be interrupted. In order to ensure this, you can install
    the signal handler before the function is called and reset it after the call.


    ```

    trap '''' 1 2 3 15

    DoImportantStuff

    trap 1 2 3 15

    ```


    The second call to trap has only signal arguments. This causes trap to reset the
    handler for each of the signals to the default. By doing this, you enable the
    user to still terminate the script and ensure that critical operations are performed
    without interruption.


    # Setting Up a Timer


    In many scripts, there are critical sections where commands that require a large
    amount of time to complete are executed. On rare occasions, these commands might
    not finish processing. In order to deal with this situation, you need to set up
    a timer within the script. When the timer expires, you should terminate the program
    and inform the user about the abnormal exit.


    In this section you will walk through a simple script that demonstrates the major
    aspects of setting up a timer using the ALARM signal and a signal handler.


    The main body of this script needs to perform the following actions:


    +   1. Set a handler for the ALARM signal.

    2. Set the timer.

    3. Execute the program.

    4. Wait for the program to finish executing.

    5. Unset the timer.


    If the timer expires before the program finishes executing, the handler for the
    ALARM signal needs to terminate the program.


    The main body looks like the following:


    ```

    # main()

    trap AlarmHandler 14


    SetTimer 15


    $PROG &

    CHPROIDS="$CHPROCS $!"

    wait $!

    ```


    ![](img/21edd8d7854fe7f0c0d03baba9111541_332_0.png)'
