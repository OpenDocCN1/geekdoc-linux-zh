    # Validating User Input


    Say that you need to write a script that needs to ask the user for the name of
    a directory. You can use the following steps to get information from the users:


    +   1. Ask the user a question.

    2. Read the user''s response.

    3. Check to whether the user responded with the name of a directory.


    What should you do when the user gives you a response that is not a directory?

    The simplest choice would be to do nothing, but this is not very user friendly.
    Your script can be much more user friendly by informing the user of the error
    and asking for the name of the directory again.


    The while loop is perfect for doing this. In fact, one of the most common uses
    for the while loop is to check whether user input has been gathered correctly.
    Usually a strategy similar to the following is employed:


    +   1. Set a variable''s value to null.

    2. Start a while loop that exits when the variable''s value is not null.

    3. In the while loop, ask the user a question and read in the users response.'
