  md: '# Loops


    The procedure to do this follows:


    +   1. Create a loop with a variable named file or FILE. Other favored names include
    i, j, and k. Usually the name of the variable is singular.\n2. Create a list of
    files to manipulate. This is frequently accomplished using the file-name substitution
    technique I discussed in Chapter 8, "Substitution."

    3. Manipulate the files in the body of the loop.


    An example of this is the following for loop:


    ```

    for FILE in $HOME/.bash

    do

    cp $FILE ${HOME}/public_html

    chmod +r ${HOME}/public_html/${FILE}

    done

    ```


    In this loop I use filename substitution to obtain a list of files in my home
    directory that start with .bash. In the body of the loop, I copy each of these
    files to my public_html directory, and then I make them readable by everyone.
    This way people stopping by my Web page can see the scripts.


    Notice that you are using the NAME for the variable. This is because each time
    you are dealing with a single file from a list of files. The rationale behind
    making the for loop''s variable singular, such as FILE instead of FILES, is that
    you are dealing with only one item from a set of items each time the loop executes.


    # The select Loop


    The select loop provides an easy way to create a numbered menu from which users
    select options. It is useful when you need to ask the user to choose one or more
    items from a list of choices.


    This loop was introduced in ksh and has been adapted into bash. It is not available
    in sh.


    The basic syntax of the select loop is


    ```

    select name in word1 word2 ... wordN

    do

    list

    ```


    Here name is the name of a variable and word1 to wordN are sequences of characters
    separated by spaces (words). The set of commands to execute after the user has
    made a selection is specified by list.'
