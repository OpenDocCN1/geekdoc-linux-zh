  md: "You will look at a future use, setting up a timer, later in this chapter.\n\
    \n# Cleaning Temporary Files\n\nMost scripts that create temporary files use a\
    \ trap command similar to the follow-ing:\n\n```\ntrap \"rm -f TMPF; exit 2\"\
    \ 1 2 3 15\n```\n\nHere you remove the file stored in TMPF and then exit with\
    \ a return code of 2 indicating that exit was abnormal, when a HUP, INT, QUIT,\
    \ or TERM signal is received. Usually when a script runs normally its exit code\
    \ is 0. If anything abnormal happens, the exit code should be nonzero.\n\nSometimes\
    \ when more complicated cleanup is required, a shell function can be used. In\
    \ order to make the script (described in Chapter 12, \"Parameters\") signal safe,\
    \ you would add something similar to the following at the beginning of the script:\n\
    \n```\nCleanUp() {\n    if [ -f \"$OUTFILE\" ]; then\n        printf \"Cleaning\
    \ Up...\"\n        rm -f \"$OUTFILE\" > /dev/null\n        echo \"Done.\"\n  \
    \  fi}\ntrap Cleanup 1 2 3 15\n```\n\nHere the function Cleanup is invoked whenever\
    \ the script receives a HUP, INT, QUIT, or TERM signal. This function removes\
    \ the output file of the script, if that file exists. By cleaning up when a signal\
    \ is received, partially encoded files are not left around to confuse users.\n\
    \n![](img/21edd8d7854fe7f0c0d03baba9111541_329_0.png)\n\n| The main reason to\
    \ use functions to handle signals is that it is nicer to have a shell function\
    \ invoked when a signal is received rather than write in the appropriate code\
    \ inline.\nAlso, the commands that should be executed when a signal is received\
    \ might be different depending on which point in the script the signal was received.\
    \ In many cases it is difficult to capture that logic in a few commands, thus\
    \ it is necessary to use a shell function as the signal handling routine. |"
