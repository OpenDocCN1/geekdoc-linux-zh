  md: "# Problem Solving with Functions\n\ndirectory uses. For example, you don't\
    \ want a single user to hog all the disk space for extended periods.\n\nThe information\
    \ about disk usage is also important to installation scripts because they need\
    \ to warn a user when an installation is attempted in a directory that does not\
    \ contain enough space.\n\nIn this section, I will present two functions that\
    \ can help you determine disk space usage:\n\n+   - getSpaceFree\n- getSpaceUsed\n\
    \n# Determining Free Space\n\nTo determine the free space in a directory, you\
    \ use the df -k (k as in KB) command. Its output looks like the following:\n\n\
    | Filesystem | Used | Available | Capacity | Mounted on |\n| /dev/hda1 | 1190014\
    \ | 644661 | 463867 | 59% | |\n| /dev/hdd1 | 4128240 | 1578873 | 2335788 | 40%\
    \ | /internal |\n| /dev/db1 | 1521567 | 682186 | 760759 | 47% | /store |\n| /dev/hda3\
    \ | 320086 | 72521 | 231034 | 24% | /tmp |\n\nWhen run on a single directory or\
    \ file, the output looks like the following:\n\n| Filesystem | Used | Available\
    \ | Capacity | Mounted on |\n| /dev/hda1 | 1190014 | 644661 | 463867 | 59% | |\n\
    \nThe output contains a header line and information about the hard drive or hard\
    \ drive partition that the directory or file is located on. In this output, the\
    \ amount of free space is stored in the fourth column. Your function uses awk\
    \ to get this value.\n\n############################################################\n\
    # Name: getSpaceFree\n# Desc: output the space avail for a directory\n# Args:\
    \ $1 -> The directory to check\n############################################################\n\
    \n```\ngetSpaceFree() {\n\n    if [ $# -lt 1 ]; then\n      printERROR \"Insufficient\
    \ Arguments\"\n      return 1\n    fi\n\n    df -k \"$1\" | awk 'NR != 1 { print\
    \ $4 }'\n}\n```\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_364_0.png)"
