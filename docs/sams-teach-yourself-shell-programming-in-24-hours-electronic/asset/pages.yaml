- img_proc: true
  md: '# Hour 6


    Be very careful when specifying process to kill, especially if you are using kill
    -9, because you can end a job by accident or even log yourself off. My command
    interpreter has the process ID of 3662, and I can try to kill it as it follows:


    ```

    $ ps -f

    UID PID PPID C STIME TTY CMD

    billing 3662 3657 0 08:10:53 pts/6 0:01 -ksh

    $ kill -9

    $ ps -f

    UID PID PPID C STIME TTY CMD

    billing 3662 3657 0 08:10:53 pts/6 0:01 -ksh

    ```


    ksh ignores a regular kill but not a kill -9, as follows:

    $ kill -3662


    There is no command prompt after this command. I was disconnected from the system.

    If your UNIX version does not support ps -f, you can use ps -ux.


    # Parent and Child Processes


    In the ps -f example in the ps command section, each process has two ID numbers
    assigned to it: process ID (pid) and parent process ID (ppid). Each user process
    in the system has a parent. Most commands that you run have the shell as their
    parent. The parent of your shell is usually the operating system or the terminal
    communications process (in telnet for telnet connections).


    I recreated this earlier example to demonstrate the ppid of all my commands is
    3662, the pid of ksh, as follows:


    ```

    $ ps -f

    UID PID PPID C STIME TTY CMD

    dhorvath 6738 3662 0 10:23:03 pts/6 0:00 first_one

    dhorvath 6739 3662 0 10:28:54 pts/6 0:00 second_one

    dhorvath 3662 3657 0 08:10:53 pts/6 0:00 -ksh

    dhorvath 6892 3662 4 10:51:50 pts/6 0:00 ps -f

    dhorvath 6770 3662 2 10:35:45 pts/6 0:03 third_one

    ```


    The ppid of ksh is 3657. Using ps -ef (or ps -ax on some systems) and grep to
    find that, I see the following:


    ```

    $ ps -ef | grep 3667

    dhorvath 9778 3662 4 10:52:50 pts/6 0:00 ps -f

