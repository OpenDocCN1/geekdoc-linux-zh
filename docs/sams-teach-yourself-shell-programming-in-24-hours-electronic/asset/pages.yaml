    # Summary


    In this chapter, you looked at the four major topics involving processes provided
    with the shell:


    +   - Starting a process

    - Listing running processes

    - Killing a process (kill command)

    - Parent and child processes


    As you write scripts and use the shell, knowing how to work with processes improves
    your productivity.


    # Questions


    +   1. How do you run a command in the background?

    2. How do you determine what processes you are running?

    3. How do you change a foreground process into a background process?


    # Terms


    Background—Background describes processes usually running at a lower priority
    and with your input disconnected from the interactive session. Input and output
    are usually directed to a file or other process.


    Background Processes—Background processes are autonomous processes that run under
    UNIX requiring user interaction.


    bash—bash stands for the GNU Again Shell and is based on the Bourne Again Shell,
    sh, the original command interpreter.


    Bourne Shell—This shell is the original standard user interface to UNIX that supported
    limited programming capability.


    BSD—BSD is an acronym for Berkeley Software Distribution.


    BSD UNIX—This version of UNIX was developed by Berkeley Software Distribution
    and written at University of California, Berkeley.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_120_0.png)'
