  md: 'exit status of a command and perform different actions when a command is successful

    and when a command is unsuccessful.


    For example, consider the following command:


    ```

    ln -s /home/ranga/bin/bash /usr/contrib/bin

    ```


    If you execute this command on the command line, you can see any error messages
    and

    intervene to fix the problem. In a shell script, the error message is ignored
    and the script

    continues to execute. For this reason, it is necessary to check whether a program
    exited

    successfully.


    As you saw with the test command, an exit status of 0 is successful, whereas nonzero

    values indicate some type of failure. The exit status of the last command is stored
    in the

    variable $?, so you can check whether a command was successful as follows:


    ```

    if [ $?-eq 0 ]; then

    echo "Command was successful."

    else

    echo "An error was encountered."

    fi

    ```


    If the command exits with an exit code of 0, issue the "good" message; otherwise,
    issue

    an error message and then exit. This can be simplified as follows:


    ```

    if [ $?-ne 0 ]; then

    echo "An error was encountered."

    fi

    echo "Command was successful."

    ```


    Here you check to see whether the command failed. If so, you echo an error message
    and

    exit: otherwise, if that statement completes and the "good" message is issued.
    This is

    slightly more efficient than using an else clause.


