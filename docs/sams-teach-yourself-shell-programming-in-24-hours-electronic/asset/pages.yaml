    # Parameter Substitution


    # Parameter Substitution in Bourne/Korn/Bash


    ${parameter} substitutes the contents of the parameter, which can be a variable
    name or digit indicating a positional parameter.


    ${parameter:-word} substitutes the contents of the parameter but if it is empty
    or undefined, it substitutes the word, which might contain unquoted spaces.


    ${parameter=word} substitutes the contents of the parameter but if it is empty
    or undefined, it sets parameter equal to the word and substitutes word.


