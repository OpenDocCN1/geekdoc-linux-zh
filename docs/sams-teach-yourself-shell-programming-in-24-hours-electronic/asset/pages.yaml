    # Process Permissions


    By default, a process runs with the permissions of the user running it. In most
    cases, this makes sense, enabling you to run a command or utility only on your
    files. There are times, when users need to access files that they do not own.
    A good example of this is the password command, which is usually stored as /usr/bin/password.
    It is used to change passwords and modify /etc/passwd and the shadow password
    file, if the system is equipped.


    It does not make sense for general users to have write access to the password
    files; they could create users on the fly. The program itself has these permissions.
    If you look at the file ls, use the letter x which normally appears in the owner
    and group permissions. The owner of /usr/bin/password is root, and it belongs
    to the sys group. No matter who runs it, it has the permissions of the root user.


    # Overlaying the Current Process (exec Command)


    In addition to creating (forking) child processes, you can overlay the current
    process with another. The exec command replaces the current process with the new
    one. This exec command only works with great caution. If you use exec in your
    primary (login) shell interpreter, that shell interpreter (ksh with pid 3662 in
    the previous examples) is replaced with the new process.


    Using the command exec ls at your login shell prompt gives you a directory listing
    and disconnects you from the system. Because exec overlays your shell (ksh, for
    example), there are no programs to handle commands for when ls 1 finishes and
    exits.


    You can use exec to change your shell interpreter completely without creating
    a subshell. To convert ksh to csh, you use the following:


    ```

    $ exec csh

    ps -f

    ```


