- img_proc: true
  md: 'bc allows conversion between different number bases:


    ```

    $ bc

    obase=16

    base=8

    400

    100

    77

    3f

    10*3

    18

    quit

    ```


    $obase=16 sets the output base to hexadecimal; ibase=8 sets the input base to
    octal. It is important to set the output base first. You enter octal 400. It shows
    an octal 400 is a hex 100. You enter 77. It shows an octal 77 is a hex 3f. Then
    you multiply 10 and 3, which equals 24 because 10 octal is 8 and 8*3 is 24. However,
    because the output base is hex, it converts 24 to hex, which gives 18 as the reported
    result.


    # remsh/rsh/rcmd/remote (Remote Shell)


    If you have several UNIX systems connected over a network, it is possible to invoke
    a remote shell to run a command on the remote system and return the output of
    that command to your screen:


    ```

    remsh acron who

    ```


    This shows us who is logged into the remote system called acron. The basic syntax
    is:


    ```

    remsh remote-sys unix-command

    ```


    remote-sys is the name of the remote system where the given unix-command runs.
    You can pipe text to remsh, which is passed to the unix-command being run on the
    remote system. Any standard output from unix-command on the remote system is passed
    to standard output on your system where it can be redirected if desired.


    Different types of UNIX systems have different names for this command including
    remsh, rsh, rcmd, or remote.


    Check the man pages on your system to see which command is correct. Be careful
    to avoid confusion with the restricted shell command rsh, which is sometimes invoked
    as /usr/lib/rsh if rsh invokes the remote shell.


    Using the remote shell requires setting up /etc/hosts.equiv, which indicates a
    trust relationship between the two systems. The simplest trusting setup is to
    put each'
