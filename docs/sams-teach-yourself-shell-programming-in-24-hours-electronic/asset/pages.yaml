- img_proc: true
  md: '# # Quoting with Backslashes


    First, use the echo command to see what a special character is. The echo command
    is covered in more detail in Chapter 13, "Input/Output," but it is a simple command
    that just displays the arguments it has been given on the command line. For example,


    ```

    echo Hello world

    ```


    displays the following message on your screen:


    ```

    Hello world

    ```


    Here is a list of most of the shell special characters (also called *metacharacters*):


    +   * ? [ ] '' ` $ ; & ( ) ^ < > new-line space tab


    Watch what happens if you add one of them to the echo command:


    ```

    echo Hello; world

    ```


    It now gives this error result:


    ```

    Hello

    sh: world: Command not found

    ```


    The semicolon (;) tells the shell that it has reached the end of one command and
    what follows is a new command. This character enables multiple commands on one
    line. Because world is not a valid command, you get the error shown.


    You can resolve the problem by putting a backslash (\) in front of the ; character
    to take away its special meaning, enabling you to display it as a literal:


    ```

    echo Hello\; world

    ```


    The backslash causes the ; character to be handled as any other normal character.
    The resulting output is


    ```

    Hello; world

    ```


    To display any shell character reliably from echo, you must escape it, that is,
    pre-cede it by a backslash. Using the backslash quotes the character that follows
    it, using it as a literal. Each of the shell characters previously listed causes
    a different problem symptom if you try to echo it without quoting it. This need
    to quote special characters occurring in many other UNIX commands as you see later.


    Notice in the previous example that the quoting character, the backslash, is not
    displayed in the output. The shell preprocesses the command line, performing variable
    substitution, command substitution, and filename substitution, unless the special
    character that would normally invoke substitution is quoted. The quoting character
    is removed from the'
  merge: -1
