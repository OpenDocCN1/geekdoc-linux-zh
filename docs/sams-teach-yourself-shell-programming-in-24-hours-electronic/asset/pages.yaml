- img_proc: true
  md: "The execution process for a select loop is as follows:\n\n+   1. Each item\
    \ in *list1* is displayed along with a number.\n2. A prompt, usually #?, is displayed.\n\
    3. When the user enters a value, $REPLY is set to that value.\n4. If $REPLY contains\
    \ a number of a displayed item, the variable specified by *name* is set to the\
    \ item in *list1* that was selected. Otherwise, the items in *list1* are displayed\
    \ again.\n5. When a valid selection is made, *list2* executes.\n6. If *list2*\
    \ does not exit the select loop using one the loop control mechanisms such as\
    \ break, the process starts over at step l.\n\nIf the user enters more than one\
    \ value, $REPLY contains all the user's choices. In this case, the variable specified\
    \ by *name* is not set.\n\n# An Example of the select Loop\n\nOne use of the select\
    \ loop is in scripts that configure software. The following example is a simplified\
    \ version of one script. The actual configuration commands have been omitted because\
    \ they are not relevant in this discussion.\n\n```\nselect COMPONENT in comp1\
    \ comp2 comp3 all none\ndo\n  case COMPONENT in\n    comp1|comp2|comp3) CompConf\
    \ $COMPONENT;\n      all) CompConf comp1\n      CompConf comp2\n      CompConf\
    \ comp3\n      ;;\n    none) break;\n    echo \"ERROR: Invalid selection, $REPLY.\"\
    ;\nnesac\n```\n\nThe menu presented by the select loop looks like the following:\n\
    \n+   1) comp1\n2) comp2\n3) comp3\n4) all\n5) none\n#?\n\nYou will see that each\
    \ of the items in the list\n\ncomp1 comp2 comp3 all none\nare displayed with a\
    \ number preceding them. The user can enter one of these numbers to select a particular\
    \ component."
