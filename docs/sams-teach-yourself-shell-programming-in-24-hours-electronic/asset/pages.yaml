- img_proc: true
  md: "# SIMPLIFYING SCRIPT MAINTENANCE\n\nUsing $0 as I've illustrated is encountered\
    \ in the install and the uninstall scripts of some software packages.\n these\
    \ scripts share many of the same routines and global variables, it is desirable,\
    \ for ease of maintenance, to merge them into a single script having different\
    \ behavior depending on the name with which it is invoked.\nIf you are writing\
    \ scripts that need to share main routines, consider using such a scheme to simplify\
    \ maintenance.\n\nIf you consider the mytar script given previously, a usage statement\
    \ would be a helpful addition, in case the script was called with some name other\
    \ than the two names it knows. To implement this, change the case statement as\
    \ follows:\n\n```\ncase $0 in\n    listtar TARGS=-.tvf $1 ;;\n    maketar TARGS=-.cvf\
    \ $1.tar $1 ;;\n    echo \"Usage: $0 [file;directory]\"\n    exit 0\nesac\n```\n\
    \nThus, if the script is invoked as mytar, you see the following message:\nUsage:\
    \ mytar [file;directory]\n\nAlthough this message describes the usage of the script\
    \ correctly, it does not inform us that the script's name was given incorrectly.\
    \ There are two possible methods for rectifying this:\n\n+   - Hard coding the\
    \ valid names in the \"usage statement\"\n- Changing the script to use its arguments\
    \ to decide in which mode it should run\n\nTo demonstrate the use of options,\
    \ the next section uses the latter method.\n\n# Options and Arguments\n\nOptions\
    \ are given on the command line to change the behavior of a script or program.\
    \ For example, the -a option of the ls command changes the behavior of the ls\
    \ command from listing all visible files. This section shows how to use options\
    \ to change the behavior of scripts.\n\nOften you will see or hear options arguments.\
    \ The difference between the two is subtle. A command's arguments are all of the\
    \ separate strings or words that appear on the command line after the command\
    \ name, whereas options are only those arguments that change the behavior of the\
    \ command."
