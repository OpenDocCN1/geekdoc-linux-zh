    - root

    - anna


    # The follow Option


    An extremely useful feature of the tail command is the -f (f as in follow) option:


    ```

    tail -f file

    ```


    Specifying the -f option enables you to examine the specified file while programs
    are writing to it.


    Often I have to watch the log files generated by programs that I am debugging,
    but I don''t want to wait for the program to finish, so I can start the program
    and use tail -f for the log file.


    Some Web administrators use a command such as the following to watch the HTTP
    requests made for their system:


    ```

    $ tail -f /var/log/httpd/access_log

    ```


    # Using grep


    The grep command lets you to locate the lines in a file that contain a particular
    word or a phrase. The word grep stands for globally regular expression print.
    The command is derived from a feature of the original UNIX text editor, ed. To
    find a word in ed, ed, the following command was used:


    ```

    g/word/p

    ```


    Here word is a regular expression. For those who are not familiar with regular
    expressions, Chapter 16, “Filtering Text Using Regular Expressions,” discusses
    them in detail.


    This particular ed command was used widely in shell scripts, thus it was factored
    into its own command called grep. In this section, you will look at the grep command
    and some of its most commonly used options.'
