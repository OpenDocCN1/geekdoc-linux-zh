  md: "```\n# Args: $0 -> message to print\n#############################################################\n\
    printERROR() {\n    echo \"ERROR:\" $0 >&2\n}\n\n#############################################################\n\
    # Name: printWARNING\n# Desc: prints a message to STDERR\n# Args: $0 -> message\
    \ to print\n#############################################################\n\n\
    printWARNING() {\n    echo \"WARNING:\" $0 >&2\n}\n\n#############################################################\n\
    # Name: printUSAGE\n# Desc: prints a USAGE message and then exits\n# Args: $0\
    \ -> message to print\n#############################################################\n\
    \nprintUSAGE() {\n    echo \"USAGE:\" $0\n    exit\n}\n```\n\nAll these commands\
    \ work by calling the echo command and passing it two arguments:\n\n* The message\
    \ prefix, either ERROR, WARNING, or USAGE.\n* The arguments are specified to these\
    \ functions by the user. The arguments are stored in $0, as explained in Chapter\
    \ 12. \"Parameters.\".\n\nThe two functions, printERROR and printWARNING, display\
    \ error and warning messages. Both messages indicate to a something that has gone\
    \ wrong. Thus they redirect the output to STDERR, which is reserved for error\
    \ reporting.\n\nUsually an error indicates the occurrence of something unexpected\
    \ that is difficult to recover from, such as a command failure. A warning message\
    \ usually indicates that something unexpected occurred, but the script was able\
    \ to recover from this.\n\nThe advantage of using these functions is that they\
    \ provide a standard output format for errors and warning throughout your script.\
    \ As an example, the following error message\n\n```\necho \"ERROR: File $MYFILE\
    \ was not found.\" >&2\n```\n\ncan be written\n\n```\nprintERROR \"File $MYFILE\
    \ was not found.\",\n```"
