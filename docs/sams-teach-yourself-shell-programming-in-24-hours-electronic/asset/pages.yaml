    # # Quoting Rules and Situations


    Now that you know the basics, you can learn some additional rules to help you
    use quoting. You can also look at various UNIX commands and apply quoting to other
    situations.


    # ## Quoting Ignores Word Boundaries


    In English, you are used to quote whole words or sentences. In programming, the
    special characters must be quoted, but it does not matter whether the regular
    characters are quoted in the same word, as follows:


    ```

    echo "Hello; "world"

    ```


    You can move the quotes off word boundaries as long as any special characters
    remain quoted. This command produces the same output as the preceding one:


    ```

    echo HelLo; "world"

    ```


    Of course, it is easier to read the line if the quotes are on word boundaries.
    I present this point here to help you understand quoting and because you need
    this knowledge for more complex quoting situations.


    # ## Combining Quoting in Commands


    You can freely switch from one type of quoting to another within the same command.
    This example contains single quotes, a backslash, and then double quotes:


    ```

    echo ''$USER'' variable contains this value > "!$USER!"

    ```


    Here is the output of this command if fred is the current content of USER:


    ```

    The $USER variable contains this value > |fred|

    ```


