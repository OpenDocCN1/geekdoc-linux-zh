  md: '# HOUR 24


    # Shell Programming FAQs


    Each of the previous chapters has focused on an individual topic in shell programming,
    such as variables, loops, or debugging. As you progressed through the book, you
    worked on problems that required knowledge from previous chapters. In this chapter,
    I''m taking a slightly different approach. I will try to answer some common shell
    programming questions that frequently arise. Specifically I will cover questions
    from three main areas of shell programming:


    +   - The shell and commands

    - Variables and arguments

    - Files and directories


    Each section includes several common questions (along with answers) that occur
    in shell programming. These questions are designed to help you solve or avoid
    problems while programming the shell.


    Some of the questions provide deeper background information about UNIX, whereas
    others illustrate concepts covered in previous chapters.'
