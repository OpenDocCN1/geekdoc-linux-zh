  md: '# Working with Files


    produces the following output for my .hosts file:


    7 14 179 .hosts


    The first number, in this case 7, is the number of lines in the file. The second
    number, in this case 14, is the number of words in the file. The third number,
    in this case 179, is the number of characters in the file. Finally, the filename
    is listed. The filename is important if more than one file is specified.


    If you specify more than one file, wc gives the individual counts along with a
    total. For example, the command


    ```

    $ wc .hosts .profile

    ```


    produces the following output:


    ```

    7 14 179 .hosts

    133 405 2908 .profile

    140 419 3087 total

    ```


    You can use wc to get the individual counts as shown in the next sections. The
    options covered in these sections are given in Table 3.1.


    | Option | Description |

    |---|---|

    | -1 | Counts the number of lines |

    | -w | Counts the number of words |

    | -m or -c | Counts the number of characters |


    The -m option is available on Solaris and HP-UX. It is not available on Linux.
    On Linux systems, you need to use the -c option instead.


    # Number of Lines


    To count the number of lines, use the -1 (as in lines) option. For example, the
    command


    ```

    $ wc -l .profile

    ```


    produces the output


    ```

    133 .profile

    ```'
