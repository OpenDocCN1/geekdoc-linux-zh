  md: "Here is a simple example of the while loop that counts from one to five:\n\n\
    ```\n$ awk 'BEGIN{x=0; while (x < 5) { x+=1; print x ; } }'\n```\n\nThe output\
    \ looks like the following:\n\n+   1\n2\n3\n4\n5\n\n# The do Statement A variation\
    \ of the while statement is the do statement. It also performs some actions while\
    \ an expression is true.\n\nThe basic syntax is\n\n```\ndo {\n  actions\n} while\
    \ (expression)\n```\n\nHere expression is an expression created using the conditional\
    \ operators. It is identical to expressions you looked at earlier in the chapter.\
    \ The parentheses surrounding expression are required.\n\nThe actions that should\
    \ be performed, actions, are any sequence of awk commands. The braces surrounding\
    \ the actions are required only for actions containing more than one statement,\
    \ but I recommend that you always use them for the sake of clarity and maintainability.\n\
    \nThe main difference is that the do statement executes at least once, whereas\
    \ the while statement might not execute at all. For example, you can write the\
    \ loop in the previous example as the do:\n\n```\n$ awk 'BEGIN { x=0; do { x+=1;\
    \ print x ; } while (x < 5) } '\n```\n\nThere are slight variations between nawk,\
    \ gawk, and awk with regard to this statement. If you want to use the statement,\
    \ you should stick to nawk or gawk because older versions of awk might have trouble\
    \ with it. If you are concerned with portability to older versions of UNIX, should\
    \ avoid using the do statement.\n\n# The for Statement\n\nThe for statement enables\
    \ you to repeat commands a certain number of times. The for loop in awk is similar\
    \ to the for loop in the C language.\n\nThe idea behind for loop is that you keep\
    \ a counter and that you test in each iteration of the loop. Every time the loop\
    \ executes, the counter is incremented. This is quite different from the for loop\
    \ in the shell, which executes a set of commands for each item in a list."
