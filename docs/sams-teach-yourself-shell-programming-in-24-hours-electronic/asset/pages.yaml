  md: '# Listing Directories


    To list the files in a directory you can use the following syntax:


    ```

    ls directory

    ```


    Here, directory is the absolute or relative pathname of the directory whose contents
    you wanted.


    For example, both of the following command list the contents of the directory
    /usr/local (assuming the working directory is /home/ranga):


    ```

    $ ls /usr/local

    $ ls ../../usr/local

    ```


    On my system the listing looks like


    X11 bin gimp jikes sbin

    ace doc include lib share

    atalk etc info man

    turboj-1.1.0


    The listing on your system might look quite different.:


    You can use any of the options you chose in Chapter 3 to change the output. For
    example, the command


    ```

    $ ls -aF /usr/local

    ```


    produces the following output


    ```

    ./ gimp/ lib/ turboj-1.1.0/

    ../ bin/ man/

    X11 doc/ info/ sbin/

    ace/ etc jikes share/

    ```


    You can specify more than one directory as an argument. For example


    ```

    $ ls /home /usr/local

    ```


    produces the following output on my system:


    ```

    /home:

    amma http ranga vathsa

    ```


    ```

    /usr/local:

    X11 gimp jikes sbin

    ace doc include lib share

    atalk etc info man turboj-1.1.0

    ```


    A blank line separates the contents of each directory.


    ![](img/21edd8d7854fe7f0c0d03baba9111541_78_0.png)'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Listing Files


    If you specify the name of a file instead of a directory, ls lists only that one
    file. For example


    ```

    $ ls .profile

    .profile

    ```


    You can intermix files and directories as arguments to ls:


    ```

    $ ls .profile docs/ /usr/local /bin/sh

    ```


    This produces a listing of the specified files and the contents of the directories.


    If you don''t want the contents of the directory listed, specify the -d option
    to ls. This forces ls to display only the name of the directory, not contents


    ```

    $ ls -d /home/ranga

    home/ranga

    ```


    You can combine the -d option with any of the other ls you have covered. An example
    of this is


    ```

    $ ls -aFd /usr/local /home/ranga /bin/sh

    bin/sh* /home/ranga/ /usr/local/

    ```


    # Common Errors


    If the file or directory does not exist, ls reports an error. For example


    ```

    $ ls tomrows_stock_prices.txt

    tomrows_stock_prices.txt: No such file or directory

    ```


    If you specify several arguments instead of one, ls reports errors only for those
    files or directories that do not exist. It correctly lists the others. For example


    ```

    $ ls tomrows_stock_prices.txt /usr/local .profile

    produ an error message

    ```


    ```

    tomrows_stock_prices.txt: No such file or directory

    usr/local:

    ```


    ```

    X11 bin gimp jikes

    ace doc include share

    doc lib lib

    talk etc info man turboj-1.1.0

    ```


    ```

    .profile

    ```'
