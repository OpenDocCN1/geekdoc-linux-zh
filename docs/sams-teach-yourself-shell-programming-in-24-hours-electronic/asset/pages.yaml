    # # Numbering Lines


    The cat command also understands several options. One of these is the -n option,
    which numbers the output lines. You can use it as follows:


    ```

    $ cat -n hosts

    ```


    This produces the output


    | 1 | 127.0.0.1 | localhost loopback |

    | 2 | 10.8.11.2 | kanchi.bosland.us kanchi |

    | 3 | 10.8.11.9 | kashi.bosland.us kashi |

    | 4 | 128.32.43.52 | soda.berkeley.edu soda |


    The numbered output shows us that the last line in this file is blank. You can
    ask to skip numbering blank lines using the -b option:


    ```

    $ cat -b hosts

    ```


    In this case the output looks like the following:


    | 1 | 127.0.0.1 | localhost loopback |

    | 2 | 10.8.11.2 | kanchi.bosland.us kanchi |

    | 3 | 10.8.11.9 | kashi.bosland.us kashi |

    | 4 | 128.32.43.52 | soda.berkeley.edu soda |


    Although the blank line is still there, it is no longer numbered.


    # # Counting Words (wc)


    Now that you know how to view the contents of a file, look at how to get some
    information about the contents.


    You can use the wc command to get a count of the total number of lines, words,
    and characters contained in a file. The basic syntax of this command is


    ```

    wc [options] files

    ```


    Here options are one or more of the options given in Table 3.1 and files are the
    files you examined.


    If no options are specified, the output contains a summary of the number of lines,
    and characters. For example, the command


    ```

    $ wc .hosts

    ```'
