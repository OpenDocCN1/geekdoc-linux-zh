  md: "# Miscellaneous Tools\n\nsleep can be used to give a user time to read an output\
    \ message before clearing the screen. It can also be used when you want to give\
    \ a series of beeps:\n\n```\necho -e \"A value must be input!\\a\"\nsleep 1\n\
    echo -ne \"\\a\"\nsleep 1\necho -ne \"\\a\"\n```\n\n\\a causes out an audible\
    \ beep. -e is required on some UNIX systems for \\a to sound a beep. -n suppresses\
    \ the newline that echo normally prints. The sleep command is used in the previous\
    \ example to give a sequence of beeps, spaced one second apart.\n\nsleep can be\
    \ used in a loop to repeat a job periodically:\n\n```\nwhile :\ndo\n  date\n \
    \ who\n  sleep 300\ndone >> logfile\n```\n\nThis code enables a list of who is\
    \ logged into the system to be appended to logfile every 5 minutes (300 seconds).\n\
    \n> If you want to leave this code running all the time, you must clear logfile\
    \ periodically so that it does not eat up your disk space.\n\n![](img/21edd8d7854fe7f0c0d03baba9111541_308_0.png)\n\
    \n# The find Command\n\nThe find command is a very powerful, flexible way to create\
