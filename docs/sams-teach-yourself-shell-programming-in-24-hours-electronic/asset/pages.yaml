    # Command and Arithmetic Substitution


    Two additional forms of substitution provided by the shell


    +   - Command substitution

    - Arithmetic substitution


    Command substitution enables you to capture the output of a command and sub-

    stitute it in another command, whereas arithmetic substitution enables you to
    per-

    form integer mathematics using the shell.


    # Command Substitution


    Command substitution is the mechanism by which the shell performs a given set
    of com-

    mands and then substitutes their output in the place of the commands. Command
    substi-

    tion is performed when a command is given as


    ```

    `command`

    ```


    Here command, can be a simple command, a pipeline, or a list.


    > Make sure that you are using the backquote, not the single quote character,

    when performing command substitution. Command substitution is per-

    formed by the shell only when the backquote, or backtick, '' is

    given. Using the single quote instead of the back quote is a common error

    in shell scripts leading to many find bugs.


    Command substitution is generally used to assign the output of a command to a
    variable.

    Each of the following examples demonstrate command substitution:


    ```

    DATE=''date''

    USERS=$(who | wc -l)

    UP=date | uptime

    ```'
