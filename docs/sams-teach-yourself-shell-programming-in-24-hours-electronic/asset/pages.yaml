    In the following sections, I will first present a brief description of each function
    or group of functions, followed by the implementation of the functions. At the
    end of each section is a discussion of the function''s implementation along caveats
    regarding its use.


    Some of these functions need to be modified to work properly on all versions of
    UNIX. In this chapter, I will note the differences. In Chapter 23, "Scripting
    for Portability," I will show you how to modify these functions to account for
    the differences between different versions of UNIX.


    # Displaying Messages


    Most of the messages that shell scripts display do not need special handling,
    as fixing the message with a description or having the output redirected to STDERR.
    The exceptions are error, warning, and usage messages. These messages require
    some extra handling. The following functions take care of this for you:


    ##################################################################


    # Name: printERROR

    # Desc: prints an message to STDERR


    ![](img/21edd8d7854fe7f0c0d03baba9111541_356_0.png)'
