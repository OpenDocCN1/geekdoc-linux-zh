- img_proc: true
  md: '# 5.3 A history lesson


    In the early 1980s these products began the metamorphosis that would eventually
    lead them to become the first CRM applications. This metamorphosis began in response
    to two major trends: the PC computing revolution and the establishment of a number
    of private but academically influenced industries, including fast-moving consumer
    goods and pharmaceuticals.


    As Apple first introduced the personal computer and IBM standardized it, three
    important effects occurred in the statistical analysis software industry:


    +   1. Physical cards were no longer necessary for data entry.


    +   2. There was a resulting demand for more portable statistical analysis solutions.


    +   3. This demand caused a number of competitors (e.g., Minitab, MYSTAT, and
    STRGRAPHICS) to emerge. Incumbents responded by releasing PC versions of their
    products as well.


    As an interesting aside in relation to Apple Computer that is marginally relevant
    to this chapter, rumor has that the company was named and its logo created in
    honor of Alan Turing. Turing committed suicide by consuming an apple injected
    with cyanide.


    An equally important, interdependent trend also started from a business consideration.
    During the 1970s academics who pioneered the use of analytical software (and,
    of course, those assistants who were doing most of the work anyway) migrated from
    their cloistered hallways to private industry. They pioneered the use of the software
    in a number of diverse industries, including market research, pharmaceutical companies,
    and economic tanks. They took their knowledge of statistics and analysis tools
    that they had familiarized themselves with academia. When combined with the lower
    cost of computing that the PC enabled relative to a mainframe, statistical analysis
    solutions were able to migrate with them.


    These solutions were used in myriad industries; however, the roots of the software
    industry were still evident. Data collection tended to follow a method, a scientific
    method to be exact. There are five discrete steps to traditional data measurement:
    design, implementation, analysis, conclusion, and revision. Each step is discrete,
    and the scientific method is cyclic (rather than perpetual). As a rule, data sources
    and conclusions tended to remain within the data-collection model. Then two new,
    major trends swept the computing world: Bar codes became the predominant means
    of controlling retail inventory and client/server architectures expanded the capabilities
    of statistical solutions.'
