  md: '# 3.3 CRM roots


    The last type of “analyst” is both the most common and the often forgotten in
    terms of its importance to IT market development. Through predictions in both
    financial markets and company stock ratings, stock analysts influence a great
    deal of the public''s psyche with respect to IT sectors. They are not only public
    influencers, but most analysts are also very well informed about the sectors and
    companies that they cover, understanding not only the underlying technology but
    also the companies from a cost accounting standpoint.


    It is important to note that all of the major groups of influencers mentioned
    have been influenced by and have their beginnings in academia. In fact, Materials
    Resource Planning (MRP), which was invented within the halls of academia, was
    the first enterprise-class software package to be implemented within major corporations.
    It sparked the need not only for mainstream analysts, but for management consultants
    as well. Similarly, marketing research continued to draw from the academic field.
    If not all of the techniques used in this field were first created in marketing
    departments throughout the world''s major universities. So, academics have influenced
    the development of CRM.


    In fact, CRM had a varying beginning. While Siebel and Brock Control Systems would
    each have the world believe that they invented the industry, the concept of “putting
    the customer first” predates the advent of the software industry. The roots of
    CRM as a term and as an application category are varied.


    # 3.3 CRM roots


    Have you ever wondered where the term “CRM” actually came from? After all, on
    one level, the idea that one can manage a relationship is a bit obtuse. When I''m
    in serious trouble with my wife, I bring her flowers. If I were to describe this
    as relationship management, I might find myself on the way to the florist once
    again.


    Regardless of one’s personal feelings about the term, there be an industry analyst
    somewhere who is very proud of coining the phrase—or is there? In fact, the term
    itself has a somewhat murky history. According to the Aberdeen Group, Hugh Bishop
    “created the concept of CRM, which describes a new class of software designed
    to enhance the competitive position of forward-looking organizations by forging
    more effective customer-supplier'
