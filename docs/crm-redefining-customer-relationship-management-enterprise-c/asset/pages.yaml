    with suppression lists—for example, lists of customers who have dubious histories
    or are in dispute. Much of this is common practice in organizations that engage
    in direct marketing, but the processes for CRM need to be more tightly defined
    and more intricate and must be constantly updated in the light of ongoing customer
    engagement.


    Too often, the role of analytics in a CRM implementation is insufficiently defined.
    CRM tools may be used to develop campaigns or mine databases on the basis of specified
    parameters. Analytics have a key role to play ensuring that poor performance is
    identified. Analytical CRM needs to perform a monitoring and control function.


    Monitoring and control in this context means that analytics need to run constantly—checking
    for aberrations in the database, running deduping routines, highlighting data
    gaps, and alerting for inactive or sleeping customers. Analytical tools have myriad
    tasks to perform. They can be used to generate daily “birthday” runs, highlight
    change of address details, and perform similar actions. In addition, they can
    be primed to perform quality performance measures and act almost as an expert
    system, ensuring that customer data are constantly being reassessed.


