    much greater access to information. Customers and prospects can conduct a considerable
    amount of information gathering themselves. In a similar way, within companies,
    boundaries between departmental functions are blurring as information flows break
    down traditional demarcations. Marketing, sales, and customer support are all
    simple facets of the same function—engaging and retaining the customer. Indeed,
    it could be argued that one consequence of implementing a CRM strategy is that
    departments become different “flavors” of customer engagement. (Subsequently,
    I make the point that the marketing function is, as yet, relatively underserved
    by CRM technology, which has traditionally been primarily focused on support functions.)


    The shift of power to customers means that marketing departments must be nimble
