- img_proc: true
  md: 'company and for customers. By contrast, most reports are used for data aggregation
    and performance reporting.


    It should also be noted that this proactive offering is not possible without a
    customer data warehouse to identify the demographics of inbound customers. In
    fact, this points to the type of “one-to-one” marketing that data warehousing
    makes possible. Rather than focusing exclusively on product upgrading and cross-selling
    (although let’s maintain no illusions as to whether these forms of “marketing”
