  md: '# Portals (again)


    Coincident with the development of MRM, we''re also seeing the emergence of corporate
    portals and Web services. Customer knowledge workers will become more and more
    dependent on aggregation of customer data. Information about customers may pervade
    the organization. The marketing database will be required to poll disparate databases.
    Meanwhile, third-party data sources will become more and more important, such
    as news feeds and content from product marketing teams, account management staff,
    and the contact center. The front-office portal will provide customer knowledge
    workers with fingertip control of these resources and allow opportunities to be
    constructed using all the necessary information sources. All personnel required
    to interface with the customer or to make decisions about the customer relationship
    will use such a portal.


    The key to remember is that the front-office portal is operational, not informational.
    Where in the past CRM applications were used simply by certain nominated groups,
    the front-office portal, MRM system, or marketing CRM system, whatever we choose
    to call it, will drive the business. MRM systems will arrive at the point of sale,
    should the point of sale be in a retail establishment or on the Web. As well as
    supporting a variety of sales channels, it will support a variety of communications
    channels and myriad personnel types within the organization, which may be required,
    in some guise, to support the customer.


    If this sounds like overkill, let me assure you that it is not. Centralized systems,
    accessible by all in the organization who need to access them via a browser interface,
    make sense. Why build disparate customer systems and be faced with myriad integration
    concerns? Instead, we will see the Internet used as an integration and informational
    conduit, uniting the customer with all key constituencies within the vendor organization.


    Therefore, both customers and vendors will become more dependent on portals. Portals
    will be the operational and informational tools for vendors to understand and
    communicate with customers and prospects. Customers will also access these same
    portals, to define their own information needs or to initiate dialog. The views
    will be different, but the data sets will be identical.


    The key functions performed by the portal would include the following:


    +   - Two-way interaction: outbound and response


    +   - Outbound communication planning'
