  md: '# CRM practitioner views versus customer

    views: The data


    Current conventional wisdom is that the essence of customer retention is to develop
    a relationship and manage it with the aid of technology. What do new technologies
    promise those responsible for crafting profitable and fulfilling customer relationships?


    The data presented here are based on interviews with large commercial organizations,
    with dot-com firms, with financial institutions, with the proponents of next-generation
    technology, and with consumers. These data show how companies are adopting both
    technologies today and for the future and analyze the dynamics of the B2C relationship,
    the primary focus of this book.


    Although companies recognize the pitfalls and difficulties involved in creating
    a unified customer management process, these companies are nonetheless busy taking
    the steps they will help them to achieve just. Why do they believe this unity
    to so important? Well, during the next two years, customer service heads expect
    all major direction channels to increase in use. And just as the growth of the
    road network led to gridlock, so will these anticipated increases lead to customer
    frustration and deforestation unless companies find a way to link these "stovepipes"
    and get the so-called 360-degree view of the customer (although this is a much
    overused term in CRM circles that has become somewhat meaningless). Even if a
    high proportion of these extra interactions are to be managed automatically, companies
    will be ready with the sophisticated customer process systems they believe essential?


    Corporations in consumer-facing sectors have assimilated recent new channels.
    The telephone call-center, the Web site, and e-mail are all and parcel of what''s
    needed to do business these days. The next leap forward is data communication
    on the move, affording wireless consumers the "anytime, anywhere" experience.
    To reinforce the bullish views already quoted, a recent survey by U.K. research
    consultancy Vanson Bourne for CRM specialists London Bridge Software showed that
    92 percent of e-business and customer service directors said they would make every
    channel available to customers, whatever it might be.


    In a recent survey of telecommunications managers conducted on behalf of CSC,
    Vanson Bourne found that only a third of large commercial companies have a mobile
    communications strategy in place. So, although e-business'
