  md: '# 5.2 Data aggregation


    Typically, when an analyst, press article, or CRM guru begins talking about CRM,
    the conversation turns to the use of customer information to improve the customer''s
    experience at a tactical revenue-generation level. Perhaps or he talks about personalization,
    perhaps the focus is on marketing, or at times, service. In the end, however,
    we hear some variation of the following story:


    Anthony Robinson is interested in buying a laptop computer. He goes to XYZ Computer''s
    Web site, where he is able to configure a basic machine. He chooses a LAN connection
    over a built-in modem and a touch-pad over mouse. At the end of the configuration,
    Anthony is happy with his laptop and begins to check out. The site recognizes
    that Anthony purchased neither a carrying case nor memory upgrade for the laptop
    and recommends both. Anthony instantly recognizes that he failed to purchase a
    carrying case and adds it to his shopping cart. He is less about the memory upgrade
    and selects the link providing Anthony with additional information. By selecting
    the link, Anthony sees that the product is available at a “sale price” and elects
    to purchase the memory upgrade as well.


    In this "analytical CRM" example, the company has increased the revenue with the
    sale of a laptop computer by several hundred dollars by applying the knowledge
    that purchases of laptop computers are frequently correlated with purchases of
    both memory upgrades and laptop accessories. From a computational standpoint,
    what has happened is moderately complex. Using archived data, analytical techniques
    such as regression analysis have been run to identify products that are typically
    sold. When a trigger event (e.g., the purchase of a laptop) occurs, the correlations
    are invoked to make a proactive recommendation regarding additional products that
    may be made.


    Without question, this type of analysis adds discernible value to the company.
    Using a price of $2,000 for the laptop and $300 for the accessories, revenues
    from this transaction were boosted 15 percent. If we project this incremental
    revenue across all transactions and the relatively low overhead of this analysis,
    it is easy to accept the real return on investment of this analytical CRM example.
    Upon further reflection, it is also easy to see that, from an interpersonal perspective,
    he is the online equivalent of a McDonald''s counterperson asking a customer if
    he or she wants fries for the Big Mac. In short, what passes for analytical CRM
    does not deduce or help with human reasoning; rather, it''s simply a ploy to enhance
    tactical revenue opportunities—hardly cipher.'
