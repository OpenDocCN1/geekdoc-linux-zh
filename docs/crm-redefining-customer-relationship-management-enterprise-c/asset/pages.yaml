  md: '# Glossary of CRM-Related Terms


    CRM applications built as standalone applications have less flexibility and scalability.
    Individual services within the application cannot be replicated to ensure high
    levels of fault tolerance or redundancy.


    Enterprise applications, however, are increasingly being built in all-Java environments
    using so-called J2EE—Java 2 Enterprise Edition. CORBA “servers” are being replaced
    by Enterprise Java Beans (EJBs).


    # Contact center


    Contact centers are what will ultimately replace call-centers. These are customer
    support or sales centers that are able to handle a variety of types of customer
    interaction across a series of touch-points or channels. Increasingly, best practice
    argues that contact centers should be connected to key resources within the organization
    so that contact staff can gain access to customer-supporting knowledge wherever
    it resides within the organization.


    # CRM


    Customer relationship management (CRM) is about understanding the nature of the
    exchange between customer and supplier and managing it appropriately. The exchange
    contains monetary consideration between supplier and customer—but also communication.
    The challenge to all supplier organizations is to optimize communications between
    parties to ensure profitable long-term relationships. CRM is a key for many organizations
    now as a shift away from customer acquisition toward customer-retention and churn-reduction
    strategies dictates a need for best-practice CRM processes.


    # CTI


    Computer and telephone integration. CTI applications are what drive call-centers.
    Typically, a CTI application sits “on top” of ACD and IVR systems, allowing contact
    center agents to answer customer queries and gain access to relevant customer-oriented
    data resources. CTI systems prompt agents and allow them to record and archive
    customer interactions.'
