    While it is a bit flippant, this example does highlight two important myths:


    +   Myth 1: Analysis has to be complex. What Ms. Sheltonton did was a very simple
    set of analyses by predetermined demographic segments. Although care must be taken
    to determine how these segments are defined, it is not an algorithm-intensive
    process. What does require is a good bit of common sense and some business knowledge.
    Nevertheless, through very analysis Ms. Sheltonton was able to identify important
    information that would earn the company additional revenue.


    +   Myth 2: Analysis and reporting are the same thing. Based on a series of analyses,
    Ms. Sheltonton recommended a targeted marketing campaign. In essence, she is recommending
    that the analysis she completed be captured and used on a pro forma basis to make
    targeted offers to inbound potential customers. What differentiates this from
    the simple reporting that companies were conducting in Wave 1 is that analysis
    is used in an ongoing basis to continue to create value for the'
  merge: -1
