- img_proc: true
  md: '# 6.8 And DCM?


    For CRM to succeed it has to embrace all parts of the organization and all business
    processes. Integration is utterly key. But demand chain management is not all
    that CRM has to focus its attention on. It is very possible for an organization
    to have sustained and relevant demand to satisfy demand, but it still can fail.
    Why Because it employs customer-facing staff who are insufficiently responsive
    to customer needs to ensure that demand is satisfied in an appropriate and timely
    manner.


    Implicit in the DCM definition, however, is something I much like. It''s the point
    relating to sustainability of demand. As we know, it tends to be very tricky and
    expensive to acquire new customers through traditional mass marketing. Implicit
    in DCM definitions is this idea of sustaining demand by ensuring that customers
    stick around and continue the relationship. Perhaps CRM, as an acronym, is a bit
    wo in the respect that it fails to make overt reference to the need to sustain
    demand. Unquestionably, therefore, demand chain management is a key requirement
    of any set of implemented CRM processes.


    Elsewhere in this book we talk about introducing processes that allow CRM practitioners
    to have unique insight into the customer base, allowing the creation of so-called
    customer nests. The creation of these customer nests (Chapter 10) will allow much
    greater predictability in terms of customer churn (it''ll be low) and the impact
    of other nests in the company portfolio. For very large companies, keeping customer
    relationships granular in this manner makes the process of customer tracking through
    the organization much earlier.


    In fact, demand chain management is, to some extent, simply another way of describing
    the process of adding brand adherence measures into the CRM mix. Again, this is
    discussed in later chapters.


    Chapter 6'
