    This chapter briefly discusses the role that these various analysts perform and
    examines a few CRM areas on which the analyst community has recently focused.
    It is not intended to be an exhaustive critique of how analysts define or frame
    CRM. Rather it takes the view that analysts have a positive role to play in the
    CRM debate. Sometimes they get on hobbyhorses and refuse to get off. Other times
    they get it very nearly right.


    # 3.2 Give me your watch, I''ll tell you the time


    The IT analyst and research companies are the ones that we traditionally think
    of market analysts. Major firms within this area include well-known names such
    as Gartner, Meta Group, and Aberdeen Group. Within these organizations, researchers
    investigate and analyze pundits about the major categories of software (CRM, ERP,
    etc.) and interpret the impact technology can have on their clients'' operations.


    Analyst gather their knowledge about software in a number of ways. They experienced
    practitioners from vendors and end users (although some of the newer "Internet-savvy"
    analysts may could choose a little wisely). Vendors give frequent briefings (which
    the analysts are often reluctant to agree to unless the vendor has signed up for
    the services of the analyst firm in advance) to ensure that analysts understand
    current offerings. Market analysts frequently interview companies about their
    experiences and desires. Many analyst firms also conduct primary research through
    separate divisions of their companies.'
