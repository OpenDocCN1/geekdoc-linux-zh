    one has ever heard before. They become high on data sheet speaks and they keep
    getting appeased by their pet market analyst for making the right decisions and
    sticking on it, despite all the flak they are getting from the front line.


    Not all take this approach, and I am exaggerating to make a point. However, the
    point is worth noting that many, CRM systems have been implemented without reference
    to the optimum requirements of the organization. Worse, they have been implemented
    without due regard to two fundamental customer performance metrics: satisfaction
    and brand engagement (these concepts are discussed in much more detail in Chapter
    6 and the chapters following).


    CRM is not about technology; it’s about developing appropriate relationships with
    customers through appropriate communications to create long-term profit. Therefore,
