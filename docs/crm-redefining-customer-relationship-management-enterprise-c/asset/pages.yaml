  md: '# The New Customer Challenge


    # I.I Change is happening


    Customers are changing. They’re becoming more slippery—more difficult to catch
    and hold onto. They are slippery because they have access to more and more information
    about goods and services and choose to communicate in new ways. And communication—effective
    communication across all customer touch-points—is what, increasingly, customer
    relationship management (CRM) is all about. Customers also want to choose the
    nature of the relationship. They are becoming more arrogant, more educated in
    the marketing process. They don’t want to be sold to. Rather, they are more, and
    more, choosing brands that associate with excellent, nonpatronizing, communication
    processes.


    Customer relationship management is the reaction to the more slippery customer.
    CRM history is not good, however. Many CRM implementations have paid only lip
    service to good customer communication practice. According to Gartner Group and
    other industry analysts, CRM implementations fail. This book seeks to redefine
    what CRM is truly about—a corporate attitude toward customers that embraces what
    used to be called marketing, customer support, and even sales. CRM is an attitude.
    Unless vendors are able to see and hear their customers, they will never get to
    know or understand them. As channels of communication have developed, many customers
    still remained practically invisible. Their e-mails have been ignored and their
    requests for information dumped. This eyes-and-ears-closed approach to CRM no
    longer works.


    Throughout this book we refer to the vendor. This term refers to an organization
    (it may be a government agency) that seeks to do business or provide a service
    to a customer. We refer largely to business-to-consumer'
  merge: -1
  pgno: 7
- img_proc: true
  md: '(B2C) relationships, but many of the same principles apply to business-to-

    business (B2B) relationships as well.


    This first chapter discusses CRM is all about—as well as what it

    isn’t—and proposes a new definition based on the customer''s perspective.

    We propose this approach because we assert that traditional definitions of

    customer relationship management have been defined from the vendor''s per-

    spective, a perspective that assumes that customers behave the way vendors

    expect them.


    # I.2 A technology focus?


    Although much of the content of this book focuses on CRM technology, our

    definition does not. CRM as an acronym has come into common use and

    means different things to different people. What we try to do in this book is

    to frame our discussions within a wider definition of what we believe CRM

    to be, including several influences from the areas of customer satisfaction

    and brand development. We discuss whether CRM technology solutions

    they are constituted enabling companies to have better CRM

    processes. Along the way we discuss analysts'' definitions of CRM and what

    key CRM processes need to be considered, with a particular focus on analyti-\cal
    processes and customer interaction management.


    We also focus on how marketing and CRM processes ultimately overlap.

    We further on how research—brand research in particular—must play

    extremely important role in defining how the customer should be engaged

    and nurtured over. This chapter sets the scene by making use of some

    empirical market research. Asking customers what they think is a key CRM

    process, which is often totally overlooked in the pursuit of installing a CRM

    software suite.


    Ironically, our definition implicitly assumes that, in certain circum-\stances,
    may choose not to want a relationship, or certainly not a

    long-term relationship. Therefore, our definition of CRM is to be all-

    encompassing the extent that in certain situations, a customer may want

    CRM (insofar as a customer has any interest in CRM) to mean a simple

    exchange of goods, in the most matter-of-fact manner, without any need for

    further interchange between parties. Put another way, certain customers, in

    purchasing certain types of goods or services, behave more like econ-

    mists call “rational man.” To an extent, however, this book assumes that its

    users have customer bases in which the customers do want to engage over

    an extended period with their organizations.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Further in this chapter we''ll show, through the use of market research data,
    that customers have a greater propensity to demand richer and fuller relationships
    with certain types of organizations than others. By "richer and fuller" we mean
    relationships with more complex communication systems and general involvement
    from both parties. However, this does not necessarily mean that those organizations
    with customers want a more complex relationship need to worry about CRM. Rather,
    all organizations have to consider what factor of CRM systems they install and
    how information technology has to be involved. They also need to consider not
    just their product or service proposition but the nature of the customer they
    want to service—relationships that will produce rewards for both parties.


    # What''s it all about?


    CRM, in my view, is about people on both sides of an exchange understanding other.
    In economics-speak, it is also about deriving some form of utility or satisfaction
    from that exchange. The challenge for any supplier organization is to maximize
    the utility derived by the customer, if utility is maximized, the customer is
    more likely to repeat purchase. (However, certain caveats have to be applied.
    Making value judgments about the customer is implicit in any CRM process.)


    Utility maximization may depend on subtlety of approach, knowing when to cease
    a dialog or not to enter a dialog in the first phase. However, it may also depend
    on the ability of a supplier organization to embrace a host of communication channels,
    being open all hours and always initiating contact. Or it might be between these
    two extremes. At initiating it would probably be appropriate to introduce a definition.
    It may also be helpful for the reader if we were to highlight the key words in
    our definition and to argue the case for including them.


    Customer relationship management (CRM) is about understanding the nature of the
    exchange between customer and supplier and managing it appropriately. The exchange
    contains not only monetary consideration between supplier and customer but also
    communication. The challenge to all supplier organizations is to optimize communication
    between parties to ensure profit-term relationships.


    Given the importance of brand-related issues (expounded at length in later chapters)
    readers may be surprised that brand, and loyalty, do not enter into the definition.
    However, understanding the brand in its context and the nature of the relationship
    that the customer has with the brand, help'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# 1.3 What''s it all about?


    to define the nature of the communication exchange. At an organic level, however,
    CRM is about communication with customers, and it should be a pervasive ethos
    throughout the organization.


    Let''s examine each of the key words in our definition and explore it a little
    more. First, let''s consider the exchange between buyer (customer) and supplier.
    As our definition makes clear, the exchange contains monetary consideration and
    communication. However, monetary consideration is not merely the price the customer
    agrees to pay. Salespeople often overlook the fact that the accounts receivable
    department may not like some of its best customers. A good customer to one person
    in the organization (the sales-person) may be the customer who always pays undiscounted
    rate. However, a bad customer to someone else (the credit controller) may be the
    customer who consistently pays 10 days past. But both customers may be one and
    the same. The challenge to any organization is to have a consistent method of
    rating the customer as “good” or “bad”. There has to be a recognition that such
    a rating may depend on a series of interacting metrics. Chapter 10 discusses in
    much detail various methods for determining how these metrics can be employed
    to define brand strategy and identify optimal customers.


    The desirable or (optimal) customer may merit more communication exchange as well.
    Because communications with customers can be costly, the extent to which any organization
    involves itself in communication—solicited or unsolicited—depends on the perceived
    value of the customer. The value rating associated with a customer is obviously
    dependent on the establishment of a relationship of sorts. In the early stage
    of a relationship, making these calls—and appropriately pitching the communication—is
    more difficult. As a result, appropriately defined and structured data are essential
    in establishing the customer value rating and the nature of customer communication.
    These concepts are discussed in more detail elsewhere in this book.


    The reference to managing the exchange between parties requires two aspects of
    exchange to be coordinated: consideration and communication. Remember, consideration
    embraces not just monetary payments but also other issues related to the price
    paid for goods, such as creditworthiness and speed of payment. Communication,
    similarly, encompasses a variety of different communication channels and, possibly,
    communications that derive from various parts of the supplier organization. Getting
    communications right depends to a large extent on having complete information
    about customers in all parts of the organization.'
  merge: -1
  pgno: 10
