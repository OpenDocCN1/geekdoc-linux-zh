  md: '# A Researched Approach to CRM


    # 10.1 Effective and coordinated research


    There have been significant hints dropped throughout the course of this book that
    research has an important part to play in defining and refining CRM strategy.
    This chapter makes some recommendations about the form of the research process.
    It is my opinion that successfully putting in place a CRM culture in an organization
    depends on having an effective and coordinated research approach.


    In the same manner that marketing processes need to be embraced by CRM as a discipline,
    something that was discussed in earlier chapters, customer research is a core
    discipline that should be embraced by CRM processes. Needless to say, I do not
    believe that the form this research should take is simply to manage “satisfaction.”
    Satisfaction is only a very small part of the complex relationship (or lack of
    relationship) a customer or potential customer with a brand. In this chapter I''d
    like to focus in more detail on research at the aggregate and microlevels. The
    former is used to define strategy. The latter reduces the likelihood of customer
    churn and ensures customer relationships remain long and profitable.


    The problem is, however, that survey research is simply not well enough to help.
    Some professional customer survey firms tend to have a mycop view of looking at
    the world. They tend to perceive customer satisfaction research as something they
    conduct for an entirely different department and often from a budget separate
    from brand research. In my view, customer and brand research have to be inextricably
    linked. There is also a growing awareness within survey research firms that research
    has an important part to play in defining CRM strategy.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# 10.2 The churn debate


    I''d like to structure this chapter by looking at the research process from a
    number of different perspectives: brand equity, defining a method of measuring
    customer lifetime value, making brand metrics for purpose, identifying service
    gaps and taking remedial action, and defining an appropriate role for analytics.


    This may appear to be an odd ordering of things (although what follows is not
    strictly in that order). One reason is because it is impossible to determine what
    is important from a monitoring and control point of view if we do not fully understand
    what it is we are trying to achieve in terms of brand. I introduced the concept
    of brand adherence earlier and to some extent we need to look for research techniques
    that attempt to measure adherence or loyalty in some manner. These techniques
    may prove to be useful in defining metrics.


    Another difficulty we have, however, is that many research techniques—and this
    is particularly the case in brand research—have been defined for certain types
    of businesses. Brand measurement emanated from the packaged goods industry. However,
    measuring brand adherence for a bank brand is a very different proposition. Decision-making
    processes are very different. I can easily switch between when shopping at the
    supermarket, and the decision-making "theater" presents itself often. However,
    in terms of my main retail banking relationship, the decision-making theater presents
    itself infrequently (depending, of course, on the nature of the relationship with
    my incumbent bank).


    However, understanding the nature of decision-making, brand switching scenarios,
    and how they present themselves to customers is, in itself, a useful discipline.


    In Chapter 7 I introduced the concept of best-practice CRM working at the level
    of ensuring that churn was unacceptable. I discussed the idea of qualitative metrics
    being used rather than quantitative to determine the success or failure of direct
    marketing, for example. Therefore, brand equity needs to operate at this qualitative
    or emotional level as well. Brand equity measures that attempt to make assertions
    about the brand based simply on share of shopping baskets or on the basis of aggregated
    attitudinal scores are fundamentally flawed.'
