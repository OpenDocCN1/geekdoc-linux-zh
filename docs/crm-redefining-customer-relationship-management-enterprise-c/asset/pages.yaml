  md: '# CRM: Call center, right?


    Of course, not all CRM systems are implemented for the sake of technology rather
    than the sake of customers. And I am not suggesting that all companies that have
    implemented Siebel solutions have not seen positive gain results. I''m sure that
    many have, but I believe there is a better way. Let''s focus on another issue
    in relation to CRM technology. For many organizations, I would assert, CRM is
    about implementing call-center applications. Even Siebel would object to that
    one (there’s more to life than the call-center—lots of other modules to implement)!
    . However, for many, CRM starts and stops at the call-center.


    Why not? The call-center is the hub of customer-facing operations for many companies.
    The call-center is where the customer is engaged.


    But let''s take a look at the call-center and consider a few things. First, the
    call-center is typically located miles from where the customer is located. There
    is little possibility that the call-center operative will have any day-to-day
    relationship with the customer. Even if the customer were to call daily, it is
    highly unlikely that the customer would speak to the same call-center agent. Even
    if, by some strange set of bizarre circumstances, the customer were to know a
    call-center agent through regular contact, the likelihood is that the agent would
    leave for another job at that point. Pay is typically very low—often state minimum
    wage. Call-centers are viewed as stopgaps by employees. See a career in a call-center.


    In all many organizations, the call-center is exactly just that—a center into
    which, or of which, people call. Calling, answering and logging are the activities
    that are performed. And whatever a smart systems salesperson says, a call-center
    is a call-center. Call-centers are defined as good or bad by the degree of interest
    an agent shows when answering the phone. The degree of interest is entirely dependent
    on the quality of people employed, the degree of training they receive, and how
    much they are paid and motivated. Motivated and fairly treated people develop
    good relationships with customers. Poorly paid and unmotivated call-center incentive
