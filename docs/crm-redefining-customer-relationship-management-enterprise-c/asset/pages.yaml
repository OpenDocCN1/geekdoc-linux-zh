    In fact, the following definition of CRM from Meta Group makes the point well:


    CRM (customer relationship management)—the automation of horizontally integrated
    business processes involving "front-office" customer touch-points—sales (contact
    management, product configuration), marketing (campaign management, marketing),
    and customer service (call-center, field service)—via multiple, connected delivery
    channels (telephony, e-mail, Web, direct interaction). The CRM application architecture
    must combine both operational (transaction-oriented business process management)
    technologies as well as analytical (data mart-centered business performance management)
    technologies.


    Such ambitions can be met only with a varying set of technologies. For many CIOs,
    the simplest way forward facing a requirement to implement an infrastructure is
    to install a suite of software to do everything. This is one of the key reasons
    for the massive success of Siebel Systems. In the manner that large global organizations
