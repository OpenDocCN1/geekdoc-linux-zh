  md: 'What enables this second wave to take place is customer data, once stored in
    multiple locations and systems, is in the beginning stages of amalgamation. Just
    as bar codes facilitated the first wave of data mining, the addition of real-time
    customer interactions via the Web is fueling the scene. While the terms that govern
    this new data repository vary from customer data warehouse to CRM data marts,
    leading CRM vendors have recognized that domination of the CRM marketplace is
    predicated by control over customer data. Companies such as Siebel, Kanas, and
    Oracle want to "own" the customer files in order to control this strategically
    resource. It should be noted, however that it is unclear whether a few CRM vendors
    will come to dominate this area or if customer data be revolutionized by indexed
    data mining solutions such as IBM Data Miner, SAS, or SPSS. What is certain is
    that customer data allows analytical conclusions to be reached "just in time"
    with operational processes.


    So what is this customer data warehouse? Simply, the customer data warehouse is
    an area where existing customer transactions, customer service incidents, demographics,
    and macroanalysis can be accessed, cleaned and coordinated to ensure relevant,
    timely, and appropriate customer communications that in some way may enhance the
    customer experience. Much of the information stored within it will likely come
    from internal sources, and it is also likely that this information will be combined
    with external information as well (e.g., credit reports, credit card data).


    Let''s not take this customer data warehouse as a replacement for existing customer
    data. As data mining specialists and their applications have evolved, they become
    adept at putting information from disparate systems. Not only will this trend
    continue, but since Internet media channels are being added alongside traditional
    ones, integration will continue to be pursued. As we outlined in Chapter 3, there
    are several ways that integration can be undertaken. Middleware integration, which
    is currently the cleanest and least labor-intensive way to connect disparate areas
    and legacy systems, clearly play a more prominent role during the next several
    years. It is likely, however, as standards emerge for the customer data warehouse,
    CRM applications of all sorts will run to integrate as tightly as possible. This
    warehouse-will, in fact, become a backbone of sorts.


    The most direct effect that this customer data warehouse has on customer interactions
    with companies is that it enables more sophisticated techniques to be employed
    for analyzing customer data, interactions, and behavior. It is possible to combine
    information about Web site interactions with financial'
  merge: -1
