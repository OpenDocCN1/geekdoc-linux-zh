    In respects it can be argued that marketing research planted some of the earliest
    seeds for the CRM movement. Customer satisfaction studies have been conducted
    by marketing researchers since the late 1970s—indeed, probably long before (except
    they weren’t called customer satisfaction surveys). Built, once again, on the
    “customer is always right” premise, represent the first efforts to systematically
    measure customer experience; consequently, they began uncovering the deficiencies
    of some of the largest corporations. Today, these studies have grown in use to
    the point that they are the top-selling category of marketing research that researchers
    sell. And many research firms have developed analytical models (often built on
    CRM analytics) that allow client companies to, in effect, outsource large chunks
