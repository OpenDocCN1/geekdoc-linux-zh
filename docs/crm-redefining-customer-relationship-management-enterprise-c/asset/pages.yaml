  md: '# 5.3 A history lesson


    Up to this point, we''ve talked a lot about the various types of CRM, but at the
    core, I hope one thing is evident. CRM should be all about analytical and heuristic
    techniques to better serve customers through more, focused, and more personal
    communications. In some cases this might mean providing companies with the ability
    to quickly and respond to electronic inquiries. In other cases, it might mean
    personalizing the Internet experience in order to improve “brand stickiness” (a
    marketing research/management consulting term to describe a consumer’s propensity
    to continue purchasing from a particular company as a result of brand loyalty).


    # 5.3 A history lesson


    For another bit of history. As we indicated in Chapter 3, many CRM concepts have
    their roots in academia. Where is nowhere more true than in analytical CRM. It
    can be argued that analytical CRM goes back to a time when there was no World
    Wide Web, no e-mail, no call-center applications, and in fact, no PCs. In the
    late 1960s, Norman H. Nie, C. Hadlai (Tex) Hull, and Dale Bent, three Stanford
    University graduate students, developed a software system at Stanford University.
    In 1968, they incorporated a company called SPSS, Inc., and analytical CRM was
    born. To be certain, knew nothing of CRM. As an area of concentration, customer
    relationship management was decades away.


    SPSS (which originally stood for “statistical package for the social sciences”)
    was, as its name implied, an application designed to conduct statistical analysis
    for the social sciences. Economics, psychology, and sociology research benefited
    enormously as researchers (or, more likely, research assistants) kept data on
    mainframe cards (to this day, “cards” is still a term frequently used in marketing
    research to describe the total number of columns in a data set) and used mainframes
    to analyze the data. Academic institutions across the world began installing the
    software.


    In 1976, SPSS received its first major competition, SAS (which originally stood
    for “statistical analysis system”). SAS, like SPSS, was used for scientific and
    medical research. Also like SPSS, it was a card-based, mainframe solution. By
    the early 1980s there were few universities that didn’t have one or both products
    installed.


    +   I. SPSS Web site, www.spss.com.


    Chapter 5'
