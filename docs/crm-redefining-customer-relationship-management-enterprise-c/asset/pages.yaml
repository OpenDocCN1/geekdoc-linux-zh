- img_proc: true
  md: 'demographics and geographic information. That said, we should not mistake complex
    analysis for good analysis. Take the following example:


    A company notices that there is a high drop-off rate in shopping carts and decides
    to launch a "point of sale" promotion to encourage shopping-cart conversion. The
    company is considering several gifts as part of this promotion: a minidisk player,
