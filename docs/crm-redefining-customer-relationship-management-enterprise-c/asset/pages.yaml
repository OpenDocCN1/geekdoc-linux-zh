    # 6.7 Technology consequences?


    What are the technology consequences of this all-encapsulating CRM likely to be?
    And how will large companies redefine themselves to cope?


    The first consequence will be the end of the function known as “customer support.”
    CRM is overly focused on communications with customers and securing maximum lifetime
    value from those once they are secured. Therefore, supporting the customer and
    ensuring highly levels of customer experience is a key requirement for customer
    retention (and CRM). Consequently, support functions cannot inhabit an island
    separated from other key disciplines of the business. Similarly, marketing messages
    aimed at retained customers cannot be generated in isolation and without knowledge
    of the customer’s current status or satisfaction and loyalty level (I’ll come
    back to the distinction between satisfaction and loyalty in a moment). Messaging
    and timing of marketing messages must be appropriate. Cross-selling ancillary
    goods or services may be perceived as an element of customer support processes;
    after all, no party should be in doubt that the relationship exists only that
    money can change hands—resulting in utility for both parties. An effective CRM
    strategy, in other words, requires customer orientation across across business
    disciplines and a holistic approach to customer management.


    But let’s return to the concept of customer satisfaction and discuss the role
    it, and the measurement of it, plays in best-practice CRM. Customer satisfaction
    studies conducted by market research agencies often produce results'
