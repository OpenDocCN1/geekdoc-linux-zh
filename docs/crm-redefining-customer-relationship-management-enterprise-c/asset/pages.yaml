    CRM implementations are not about improving the customer experience but more about
    paying lip service to customer-centric processes. That''s the conclusion I have
    come to give the shoddy standards I encounter when I am contacted or make contact
    with a call-center, or for example. I am not alone in drawing these conclusions.


    Big-blast CRM, invariably wrapped around an implementation of a CRM ''suite,''
