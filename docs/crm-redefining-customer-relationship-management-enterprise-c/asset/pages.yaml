  md: '# 6.5 A move from mass marketing?


    The Gartner Group has undertaken some interesting work in this area; describes
    a general move by large corporations away from mass marketing toward direct marketing
    and, ultimately, toward processes that heavily overlap with CRM processes. And
    there lies the irony. The vain attempts by a broad swath of dot-coms to use mass
    media to strengthen in their services was symptomatic of the demise of mass media.
    Large companies are making less and less use of marketing, and more and more use
    of media that encourage customer interaction. Therefore, processes that foster
