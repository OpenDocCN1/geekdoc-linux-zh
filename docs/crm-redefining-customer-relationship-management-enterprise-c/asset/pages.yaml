  md: '# 3.5 Integration needs for customer systems


    them proliferate, an organization ends up with an unmanageable jumble of code
    holding the business system together.${12}


    The next level of integration is middleware integration, which uses products such
    as IBM MQSeries and BEA Tuxedo to create pipelines that pass data between applications
    (see Figure 3.2). In essence, it creates a common data highway. All that applications
    need to travel along the road is an on ramp and some sense of the final destination.
    It is important to note that middleware has been widely adopted so that legacy
    systems (running on 25-year-old mainframes) can talk to newer applications. While
    imperfect in many ways, it allows CRM applications to interface more closely (and
    more quickly) with myriad legacy data. At this point, few CRM applications have
    embedded middleware integration in their core offerings, although there are notable
    exceptions in this-the best-of-breed world.


    In analysis, Ovum recommends enterprise application integration (EAI) as the next
    logical step in integration technology. EAI allows not only the data-level integration
    found in middleware but facilitates object-level integration and process-level
    integration as well.${13} In essence, it approaches the veritable grail of CRM
    integration: the universal backbone. A number of vendors are currently developing
    applications that answer a part of this need (e.g., Vitria, Active); however,
    the universal backbone argument has always been easier to conceptualize than utilize.
    If improvements in this architecture are made, there is little doubt that there
    will be applications for the infrastructure. However, these applications must
    include legacy data and meet the current needs of middleware users to be successful.


    One of the more interesting integration solutions that the analyst community seems
    to be focusing on the use of a so-called portal environment as a means of gluing
    disparate CRM systems together at the agent''s desktop. Portal applications had
    their beginnings around 1998, when the major search engines of the time, such
    as Yahoo anding, began to offer content as a means of improving the customer experience,
    resulting in better retention. Soon, these publishing portals were joined by e-commerce
    portals (e.g., Amazon), and corporate portals emerged, as did personal portals.
    What they all had in common was that they provided individuals with a single point
    of access to personalized information across the Internet/intranet.


