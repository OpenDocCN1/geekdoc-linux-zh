  md: '# 9.4.1 Knowledge


    At a local level, knowledge of customers is relatively easy. Customers are relatively
    few in number, and relationships can be built up over time. There is an element
    of trial and error; the vendor is constantly reappraising the nature of the relationship—how
    cross-selling opportunities are pinched, for how the sales relationship can be
    stretched before it is damaged. In short, for businesses customer knowledge is
    built on nothing short of everyday interpersonal relationship building.


    Processes designed to replicate such interpersonal relationship building depend
    in large part on information systems approximating this iterative relationship
    building process. Knowing the customer starts with the basics—with dialog made
    context sensitive.


    It is widely appreciated now that knowledge management processes must extend into
    all aspects of the CRM mix. However, knowledge systems do not stop or start with
    any single facet of customer engagement. Some vendors seem to believe that knowledge
    systems are merely to develop personalization applications or to act as an assistant
    to technical support centers.


    Increasing, however, aspects of knowledge management need to be contained in workflow
    applications. Workflow systems ensure that processes are adhered to as when a
    customer engages, or that the consequence of the engagement (particularly if it
    is transactional in nature) ripples throughout all relevant systems. However,
    in the same way that a transaction results in inventory systems being updated,
    customer engagements that supplement knowledge of the customer need to be reflected
    in updated customer records and customer profiles.


    In short, knowledge processes are two-way. They are not simply informational;
    they do not merely tell, but they listen as well. They improve understanding of
    the customer at the individual level and of customers at the aggregate level.


    # 9.4.2 Reciprocity


    In small communities a supplier often cannot afford to damage a customer relationship
    because news travels fast. Where the customer base is larger, one poor customer
    experience has less impact on the entire base. In numerous instances I have called
    to close a credit card account and the'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'account was closed in a very perfunctory manner with no request on the part

    of the call-center operative as to why I was closing it.


    It costs 12 times more to obtain a new customer than to retain an existing

    one, according to the Gartner Group. Yet every day, hundreds of thousands of

    customers credit card accounts, or bank accounts, or relationships with

    tilities or phone companies. Their actions go almost unnoticed by the

    organizations with they used to do business. Rarely are they contacted

    post hoc. Almost never are they persuaded to stay.


    A core CRM process is managing consequence of failure. In the first

    place, this means minimizing performance to the extent that customer

    churn among profitable customers is almost zero. In addition, it means ensure-

    thing is done, within reason, to ascertain the reason for churn;

    to learn from the experience; and to minimize reciprocal.


    Because it costs 12 times more to keep an existing customer to gain

    a new one, it means that even a low churn rate requires considerable

    marketing expense to maintain annual revenue. For every customer, the

    positive impact on the cost base is considerable. Yet, invariably we reward peo-

    ple acquiring customers but rarely reward for retaining existing

    custom.


    Reciprocity “processes” in the context of a local business amount to “say-

    things.” In the context of a large organization, reciprocity is about making

    it very worthwhile for the customer to expand his or her relationship by offer-

    inginducements. In other words, “If you do this for me, what will I do

    for you.


    Let me provide a banking example. Let''s say I have a credit account,

    and I''ve had it for five years. I generally have a credit card balance of $1,000

    per month, and I pay interest of 19.5 percent annual percentage rate. Then I

    start receiving offers from other credit card companies (or perhaps even we)

    ow offering me a credit card with 0 percent on retail purchases for six

    months and 12.5 percent annual percentage rate from then on. I can also

    transfer my current credit card balance and pay only 4.9 percent for six

    months. The likelihood is that I''ll switch.


    Now let''s assume that my credit card sent me, without my

    requesting it, a letter saying that because I have been a good customer they

    decided to offer me, as a thank-you, an interest holiday for six months.

    They are offering me 3.9 percent on my balance and all retail purchases for'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'that period. The likelihood is that I stay with them to avoid the hassle of
    changing. They would keep me as a customer, get some paid for six months, and
    get me back up to standard interest rate in just six months. Therefore, my potential
    lifetime value will have been enhanced considerably.


    Proactivity of this nature depends on analytics identifying “at risk” customers
    in this way—customers who have been loyal and may consider that they are being
    ripped off by continuing an existing relationship. Therefore, paying due regard
    to reciprocity is a key consideration when establishing analytics-based marketing
    communications processes. Analytics are discussed later in this chapter and at
    length in Chapter 5.


    # 9.4.3 Easy communications


    Communications are made much easier if buyer and seller are in tune, can read
    each other''s body language, and have developed a sense of what will work and
    what won''t. This ease of communications is made more difficult if parties are
    more distant or separated by technology.


    However, multiple communications channels—rather the customer''s use of multifarious
    channels (even simultaneously)—can make the process of communication more like
    the real thing (i.e., direct human contact). The other point to remember is part
