  md: '# 7.7 The human touch


    The more sophisticated such systems are, the more they make content specific to
    the customer and tailor content to specified customer requests. The more they
    encourage direct customer interaction, the better they serve the customer''s and
    the vendor''s needs. However, for many organizations, making content relevant,
    valuable, and personal is a significant challenge.


    Such systems work well when the vendor fully understands the nature of the target
    audience and specific members of the target audience. This allows customer records
    to be highly structured and highly relevant. Both parties will value dialog opportunities.
    Where dialog is perceived by the customer to be both irrelevant and untimely,
    such systems are of little benefit to anyone.


    In addition, supporting all communications channels—ensuring that that loop is
    entirely closed—is a considerable challenge. Customers are likely to call even
    if they have received an e-mail. Or they may e-mail when they have been called.
    Ensuring access to the marketing database is available to all relevant staff is
    a challenge.


    Figure 7.3 shows how adopting a portal environment for creating dialog opportunities
    and feeding appropriate content to customers can enhance the system shown in Figure
    7.2. In time, we will see the front office or marketing CRM portal becoming more
    and more important as the primary means by which “customer knowledge workers”
    will communicate with customers. Gartner Group goes a step further by stating
    that we will see the emergence of a new category of software that straddles some
    of the functionality of marketing systems and CRM systems. Such software will
    not only have the ability to engage customers in dialog but will also act as a
    strategic planning and management tool. Gartner refers to this type of software
    as marketing resource management (MRM).


    ![](img/c2cab6cd95c1b2569aa5220991578b1b_118_0.png)


    Chapter 7'
