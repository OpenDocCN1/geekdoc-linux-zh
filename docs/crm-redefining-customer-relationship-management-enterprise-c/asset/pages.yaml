  merge: -1
  pgno: 87
- img_proc: true
  md: 'In addition to the advanced analytics mentioned previously, it should be noted
    that there will be an increasing need for specific analytical applications that
    drive parts of the overall CRM effort. There are, however, a couple of important
    distinctions between the two. Primarily, embedded intelligence will need to function
    in an almost invisible fashion. The advanced heuristics and techniques are designed
    to ease the burden on the implementing companies; thus, we will continue development
    of applications that are powerful but easy-to-use training tools and user interfaces.
    This will be doubly important, because statistics and data mining professionals
    are likely to be in high demand in the coming years. It takes very sophisticated
    knowledge to generate useful analysis.


    To be truly adept at data mining, a professional needs skills in a number of areas.
    Not only does he or she need to be familiar with statistical techniques and tools,
    but the data miner must be to apply industry logic, business acumen, and a healthy
    dose of common sense to the analysis we face. Incidentally, this array of knowledge
    is difficult to maintain in one individual, it is extremely valuable if this person
    is a skilled communicator. While the other skills might be easy enough to come
    by, it can often be a challenge to find professionals who meet the common-sense
    criterion; therefore, it is easy enough to recognize those with this confluence
    of skills will be in great demand as the second wave continues forward.


    It should also be noted that during this second wave, personalization is evolving
    from data filters and profiling to include preference matching as we. For preference
    matching, an individual''s preferences are recorded. These collections of preferences
    can then be compared with other individuals'' preferences. Suggestions and recommendations
    can be better than forth.


    For a great example of this personalization technique, go to Amazon.com. Amazon
    gives books and record purchasers the ability to enter their collection of books
    and/or CDs and then rate them. As a result, the company suggests titles that others
    rated your book or CD faced as well. In it gives Amazon customers the ability
