    First, we''ll discuss the distinction between “synchronous” and “asynchronous”
    communications. By synchronous we carried these transactions out in real time,
    as opposed to asynchronous communications (e.g., e-mail) where a message may be
    sent but the response is typically received at a later and often indeterminate
    time. How do these forms differ from the customer''s perspective?


    A call to a call-center is an example of synchronous communication. Customers
    are willing to invest their own time waiting in queue for a call-center agent
    on the basis that their request will be handled in real time once connected.


    In contrast, asynchronous communication (as e-mail, letter, or fax) is ideal for
    requests of lesser urgency (although no urgency), where the upfront investment
    in developing the request can be minimal, but the expectation of time is nonimmediate
    (the period extends to days for a postal item). What is the expected response
