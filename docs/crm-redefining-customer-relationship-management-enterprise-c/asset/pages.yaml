  md: '# 3.4 The analyst''s viewpoint on CRM


    This quote is particularly apropos for two reasons. It correctly identifies one
    of the problems with a suite-based approach (“immmaturity of front-office suites”).
    But by indicating that CRM vendors can gain the depth within their products by
    2004, Gartner also reveals its bias towards this approach. And why not? After
    all it worked for ERP, right?


    Well yes and no. Without question, the backbone of ERP systems was a suite-based
    approach. That said, a lot of companies sold best-of-breed solutions alongside
    these implementations. PeopleSoft, for example, had an ERP solution of its own;
    however, a sizable portion of the company’s revenues came from implementation
    and integration of their human resource solution sold alongside SAP implementations.
    Similarly, Manugistics and I2 were best-of-breed supply chain companies. Although
    ERP systems initially tried to offer competitive products, they lacked the core
    expertise to compete in the supply chain


    CRM is ever more difficult to manage than one. There are exponentially more customers
    relative to suppliers; the separate processes that surround these customers (data
    mining and analytical CRM, sales automation, customer interaction management,
    etc.) require highly specialized expertise and generally more touchpoints to be
    supported as well. For a suite-based approach to be truly viable we are asking
    an IT vendor to be analogous to an individual who has Ph.D.s in statistics, physics,
    chemistry, and English literature—possible, perhaps, improbable.


    In addition, the concept that suite-based CRM packages offer integration is specious.
    In order to ramp up functionality in disparate areas, many CRM vendors have increased
    their capabilities primarily through acquisition. For example, recognizing that
    their application had poor analytics, Kara merged with Broadbase, which, in turn,
    poor e-service capabilities. These companies are forced to integrate their products
    at the database level. While the products may have a similar look and feel, the
    primary means of integration are the same as those available to best-of-breed
    vendors.


    With the advent of portals and Web service applications as the primary means of
    interaction to multiple applications, it is also likely that the look-and-feel
    argument will become less important. As agent and employee portals become increasingly
    common, the application integration work will become a de facto backbone, one
    that CRM vendors will be able to plug into. The universal backbone, perhaps the
    holy grail of the IT world, might be attainable through open integration technologies
    such as XML. This topic is discussed in greater detail in Chapter 4.'
