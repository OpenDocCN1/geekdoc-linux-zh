  md: '# 5.4 Wave analytical CRM


    Perhaps you can recall when it first happened. You were at the grocery store,
    and instead of punching with the prices for your milk and eggs, checkout operated
    with a bar-code scanner to ring up your purchase. You probably guessed the data
    revolution that was going behind the scenes. The use of barcodes in the retail
    environment was dramatically driven to reduce the overhead associated with inventory
    management. By electronic tracking inbound inventory and outbound sales, retailers
    were able to realize several key benefits (e.g., lower stock levels, releasing
    working capital, and reducing administrative overhead associated with inventory
    management). When automated reordering procedures were added, benefits were further
    enhanced. In addition, there was a remarkable side effect. Vast quantities of
    information began to be collected. Not only did this information pertain to products,
    but for information about time of day was recorded as well.


    Meanwhile, client/server architectures further extended the computing power of
    PCs. Computationally expensive tasks could now be relegated to servers while enhanced
    interfaces provided PCs made software easy to work with. Statistical packages
    benefited greatly. By analyzing the stores of data, leading-edge companies were
    able to draw inferences about customers’ behavior. They began combining this information
    with outside information (e.g., weather, product placement) to create “data warehouses”
    and analyzed them with the analysis analysis. The results were clothing selections
    that reflected the demographic makeup of the surrounding community, store product
    placements that reflected the weather forecasts, and products whose purchase rates
    were highly correlated being placed close together.


    # 5.4 Wave analytical CRM


    Of course, the most recent computing revolution—namely, the advent of the Internet—has
    profoundly affected how we view customers. New sources of data have deluge companies’
    data repositories. Information about click patterns, shopping cart abandonment,
    page views, and unique visitors are commonly available, and companies are straining
    under the burden. According to Jupiter Media Metrix’s Executive Survey, 45 percent
    of all companies currently collect more information than they can process effectively.
    The Gartner Group identifies the number-one reason that CRM fails as “are


