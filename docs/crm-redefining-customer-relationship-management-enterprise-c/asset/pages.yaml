  md: 'nications. New software players that focus on Internet Protocol–based CIM approaches
    are displacing traditional call-center software vendors. In certain markets–such
    as the mobile telephone sector (which will eventually be all-IP–based networks
    and customer bases) all-IP–based CIM applications are already in use.


    Interesting technologies in customer interaction management include the so-called
    universal queue, by which all sorts of messaging, regardless of channel or origin,
    be routed by the application to a resource best to deal with the customer query.


    # Closed-loop marketing


    As marketing processes become absorbed by CRM, there is an increasing need to
    ensure that marketing processes are closed loop (i.e., that a communication with
    a customer is communicated with, and the customer responds or fails to respond,
    the customer database, or data warehouse, is updated. This allows analytical tools
    to identify nonresponding customers, highly involved customers, or customers that
    may require some special treatment. In many organizations there is a total disconnect
    between customer and prospect communications and customer support/management processes.


    # Collaborative CRM


    Another term favored by certain market analysis firms. Definitions of collaborative
    CRM from firm to firm, and there would appear to be an overlap between definitions
    of collaborative CRM and operational CRM. However, collaborative CRM refers to
    processes that involve the customer in some degree of collaboration with the vendor
    organization—perhaps self-help applications or some type of Web tools to obtain
    tailored or personalized information.


    # CORBA


    The common object request broker architecture, created by OMG, allows applications
    to communicate with each other regardless of location. CRM applications are often
    built as a series of separate “servers” that are interconnected across a CORBA
    backbone. These servers may themselves be built in JAVA, but the CORBA architecture
    provides connectivity between them.'
