  md: '# 3.2 Give me your watch, I''ll tell you the time


    Typically, these analyst firms offer a combination of advisory services to vendors
    and end-user companies, a tricky situation to manage. In addition, they play an
    instrumental role in vendor selection by citing individual companies in “long-lists”
    of vendors that are suitable for a particular company’s implementation project.


    Management consulting companies offer a number of the same services for their
    clients. Not only are they often contracted for vendor selection, but many of
    these companies are pioneers in their practice areas. Accenture, for example,
    led the way in “best-practice” consulting in the 1990s. Many of these consultancies
    have primary research abilities, whereas in-house or outsourced, through research
    consulting companies. The two primary points of delineation between these companies
    and their analyst brethren are that most management consulting companies also
    implement the technologies and the bulk of management consulting revenue is derived
    from project implementation. Because of these two facts, the general perception
    is that vendor analysis made by these companies is biased toward the expertise
    that they have.


    On the other hand, we should not underestimate the amount of influence that these
    “analysts” have had on the development of the CRM market. Many had developed ERP
    practices in the mid-1990s and had tremendous capabilities for integration work.
    In 1998, with Y2000 just around the corner, it became clear that ERP’s growing
    IT sector were coming to an abrupt halt. In order to stay profitable, these companies
    needed the ability to focus on other institutional software implementations. With
    CRM emerging as this new sector, these management consulting companies latched
    onto the largest, suite-based companies as replacements to their SAP, Baan, JD
    Edwards, and Oracle Manufacturing practices. ERP was suite-centric, why not CRM?


    Research consulting companies can, broadly divided into two subsegments: market
    trend analysis companies such as Media Metrix or Dataquest, and traditional marketing
    research companies, such as Gallup, NFO, and Harris Black. The former provide
    information about companies’ individuals’ purchasing behavior and performance
    characteristics and provide insight into future trends. It should be noted that
    many of these firms have merged in recent years with mainstream analyst companies
    (e.g., Dataquest with Gartner Group and Media Metrix with Jupiter Communications).
    Typically the data services are still offered outside of the mainstream services.


