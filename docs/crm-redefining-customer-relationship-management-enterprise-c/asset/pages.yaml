  md: 'As CRM systems strive to add functionality through analytics, the interoperability
    of applications will continue to provide value-added functionality for customers.
    During the early stages of CRM, integration focused primarily on side-to-side
    integration (of disparate CRM systems and legacy systems), value-added customer
    experience is also driven by front-to-back integration. This front-to-back integration
    links these same CRM systems to ERP, supply chain, and workflow systems.


    Imagine ordering a book from Amazon. Currently, you find the book you want, the
    site gives a status for the book (e.g., “this book is usually in stock”), and
    upon completion of the order you receive somewhat amorphous service-level parameter
    regarding delivery time (“this book usually ships in seven to ten days”). Front-to-back
    integration will tighten transactions of this sort from the customer’s perspective.
    Instead of approximating the inventory, supply chain and inventory systems will
    report the book’s status in real time (“this book is due to be in stock in two
    days”). Instead of setting a broad parameter, logistics systems will state delivery
    times (“this book will be delivered on Tuesday, October 31”).


    One thing is quite clear—analytical CRM is in its infancy. Too little data integration
    is currently available today for it to be of practical use to either vendors or,
    more important, their customers. While vendors are addressing these shortcomings,
    there is still a long way to go. Only when the concept of analytics is seen as
    an enabling and embedded technology rather than an end and of itself will CRM
    as a whole achieve its true potential.'
