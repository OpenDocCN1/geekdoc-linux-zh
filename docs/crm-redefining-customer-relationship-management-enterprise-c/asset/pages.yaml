  md: '# # The Application Revolution and Its Implications for CRM


    # ## 4.1 Background


    Several years ago I was undertaking a research project for a business-to-business
    client and interviewed a very senior business strategist for a major electronics
    firm as part of the data-gathering effort. One of the points I made was that in
    the future, the most successful companies would be those concentrated on developing
    processes designed to enhance their brands. He saw such processes as the only
    core competency he felt his company should be interested in.


    The concept of business processes being inextricably linked to brand development
    is not one that trips off the tongue of most brand managers. However, it''s a
    very interesting concept. Later in this book I introduce brand-related aspects
    of CRM. Indeed, ultimately, CRM will steal significant ground from the marketing
    discipline.


    This chapter discusses some relatively new technologies that will potentially
    change CRM applications are delivered to users. However, it suggests that the
    integration of disparate applications to create new CRM applications, exactly
    fit for purpose for different communities, is what CRM practitioners need to focus
    on.


    This chapter also predicts the development of new types of operational front-office
    systems built into portal environments. Such portals will give customer-facing
    knowledge workers increasing access to information that will ensure that customers
    obtain better experiences when contacting organizations with which they may seek
    to do business.'
