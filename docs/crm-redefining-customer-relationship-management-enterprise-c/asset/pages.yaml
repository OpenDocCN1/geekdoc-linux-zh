  md: '# Preface


    Customer relationship management (CRM), according to some cynics, is simply yet
    another acronym that represents yet another set of technologies that represents
    a huge technology market for hardware and software vendors. Just about every software
    vendor is jumping on the CRM bandwagon. Every component technology is being pushed
    as a must-have CRM "solution.\ From call-center headsets to esoteric strategic
    consultancy and everything in between, it''s all CRM! However, despite this, CRM
    is beginning to stand, as a discipline, on its own feet.


    This book attempts to provide a new way of looking at CRM. It draws on my own
    experience at the CRM front lines, in market research, consultancy, and, most
    recently, with a CRM software vendor. Therefore, it presents a personal view of
    what CRM should be. The book will be successful if it encourages those responsible
    for implementing CRM solutions to consider how technology should be applied in
    order to achieve an overriding corporate ambition: to create an organization that
    has a customer base of brand champions.


    Few organizations achieve this goal. All too often lip service is paid to good
    CRM practices.


    We are all consumers. We all know, instantly, what is good service and what is
    bad. We all know what will make us engage with a business that hopes to sell us
    something, and we all know what will turn us away and ensure that we never return.
    All of us have an implicit understanding of what works and what doesn''t.


    We call the shots. We approach only the organizations that interest us. Often
    unsolicited cold calls repel us. Increasingly, we''re fed up with junk mail'
  merge: -1
  pgno: 0
- img_proc: true
  md: 'and we watch TV ads for entertainment value only. We know all the market-ing
    jargon. We can read through the hype.


    We all get a strange sense of satisfaction after having the experience of bad
    service, poor quality, or awful delivery when, despite the vendor''s promises,
    we refuse to remain a customer. We enjoy taking our business-where. And if there
    are barriers to moving our business, we seethe with resentment and get back by
    bad-mouthing and carping.


    We are more likely to engage in dialog with organizations we know and trust and
    have had good experiences in the past or with those that have been recommended
    to us.


    So what a relief it is, even though it happens infrequently, when we find an organization
    does things differently—one that listens to us, owns our problems, and provides
    a solution exactly suited to our needs. It then checks back to ensure we stay
    happy. Then, after building up a relationship with us, it will contact us and
    suggest ways of saving money or doing things better. Or more likely, we may contact
    such organizations ourselves—fully expecting they will know of previous communications
    or transactions and will give us extra service as a result. What an utter relief,
    so rarely does it happen.


    Indeed, I can think of few organizations that I do business with that have truly
    exceptional customer-care processes. One is called First Direct Bank. I have heard
    so many presenters make reference to First Direct Bank that I find it almost embarrassing
    to mention here: surely I could come up with, say, Bolivian insurance company
    that has cracked CRM. But no, it''s that First Direct example again! In the United
    Kingdom, First Direct almost defined the model for direct banking and many other
    banks have copied them and achieved achievable standards of customer care. In
    the United States, several direct (telephone) banks have also achieved higher
    standards of customer care and customer engagement processes those associated
    with traditional banks with branch networks.


    Organizations that do CRM well are easy to spot. Look for consistent and understanding
    branding, articulate communications, grab of telephone and Internet technology
    and customer engagement processes. Customer care and marketing processes are one
    and the same in companies.


    This book suggests that CRM, as a technology and corporate concept, is changing.
    Customers, increasingly, define the nature of the relationship. Therefore, CMR
    (for “customer managed relationships”) would be a better'
