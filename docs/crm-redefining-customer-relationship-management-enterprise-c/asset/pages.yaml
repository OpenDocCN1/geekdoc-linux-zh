    # 4.13 Web services and CRM


    Much of the previous discussion has focused on how integration is increasing about
    the use of component technologies. IBM WebSphere represents a middleware platform
    that contains business objects or components that can be reassembled to create
    new applications appropriate for different communities of interest. Web services
    extend this model outside of the enterprise and allow Web applications to be turned
    into business objects that can be reused.


    Chapter 9 discusses the adoption of processes designed to embrace Web services.
    Such processes may eventually replace current processes or workflows that depend
    on internally developed applications or services—internal and external. Over time,
    we will see the development of amalgams of services—internal and external. Web
    services will play a greater part but will not replace the need for integration
    technologies and hardwired applications.


