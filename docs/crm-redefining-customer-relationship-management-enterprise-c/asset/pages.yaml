    However, it is in the area of loyalty measurement that things need to change fundamentally.
    What we have discussed so far are tried and tested research processes that can
    help us understand and track the performance of our brand. Within the organization
    "owns" these processes can be subject to debate. There, there is no question that
    brand performance has to be of interest to managers responsible for CRM strategy.
    Increasingly, there is an appreciation that means everyone in the organization.


    Loyalty measurement, according to Rory Morgan, the "holy grail" of consumer-buying
    behavior. I would differ with him. I believe loyalty measurement is the holy grail
    for effective CRM processes. If an organization is unable to take a view of how
    well it is in terms of perceived loyalty within its customer base, it has not
    put in place effective CRM processes.


    Loyalty measurement is the most fundamental and core CRM process. If we have no
    processes for loyalty measurement, we cannot say with any degree of confidence
    how well the business (associated with the brand) is doing.


    As Morgan puts it, understanding loyalty is about understanding why consumers
    switch brands. If, as part of CRM processes, we put in a place of loyalty dimension
    to our customer data, we need to alter this definition of loyalty a little. Just
    a reminder—my apologies for repeating this—loyalty is not about customer satisfaction
    or the measurement of it.


    Creating unique loyalty scores for customers has to be an amalgam of a variety
    of attributes (survey research can be very blunt here because survey firms do
    not have the advantage of historical customer data). Perceptual data, purchasing
    history, interaction patterns, and proximity to decision points all have a part
    to play in describing the customer’s brand involvement and loyalty score. The
    mix and methodology will vary for each brand and sub-brand—and the nature of product
    or service (and the degree of intermediation). Let’s look at each of these in
    turn.


    # 10.5.1 Perceptual data


    Rarely are customer-facing staff asked to proffered an opinion as to the state
