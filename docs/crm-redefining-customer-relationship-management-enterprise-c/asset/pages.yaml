    claims his use of the term “relationship management” in his book The Sales Automation
    Survival Guide won a contest at a DCI show in 1988;³ and the people at Innovative
    Systems, who have ostensibly been using the term for ten years⁴ While many experts
    lay claim to the phrase, one of the earliest and most credible references to it
    is attributed to Professor Jagdish N. Sheth of Emory University, who began using
    the phrase in the early 1980s.⁵ Why is there so much ambiguity about the source
    of the term? Fred Berkamp of Intelligent Corporation states it best:


    While the CRM term is fairly recent, it grew from a combination of terms help
    desk, customer support, ERP, data mining. It evolved because none of the previous
    terms could cover the topic well enough and some of the term (ERP) have grown
    to be with a great deal of distaste in the mouths of the business world. I have
    read and heard conflicting stories concerning who was the first person to wrap
    the phrase relationship management into its present form and make it sound appealing.
    I am not sure that we know who was first. I can say that the term has been derived
