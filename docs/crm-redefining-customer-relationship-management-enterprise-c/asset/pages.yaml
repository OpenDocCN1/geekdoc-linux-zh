  md: '# DCM


    Demand management. This is a logical extension of CRM “upstream”. It ensures that
    as when customers demand a good or service, the ability to service that demand
    is in place. DCM is, in effect, the bridge between supply chain management and
    CRM.


    # Disintermediation


    This rather ugly, word describes the process whereby intermediaries or agents
    are taken out to make way for direct relationships between vendors and customers.
    The Internet—or rather the Web—has allowed many organizations to have direct contact
    with end customers, something would have been much more difficult in the past.
    However, one effect of disintermediation is an explosion in the volume of transactions
    and interactions from customers. Therefore, a key requirement for any organization
    seeking to do such direct business with customers is an effective method of communicating.
    In the past the call-center was the preferred method. However, self-help and e-channel
    communications processes are growing in importance.


    # EAI


    Enterprise application integration. A variety of technologies are coalescing,
    offering hope that EAI may become a reality. In the past true EAI was a mere pipe
    dream. However with a move to open standards; more modular, component-based software
    design; and the emergence of standard integration platforms, EAI is achievable.


    EAI vendors are largely embracing the Web services approach to EAI and many players
    in the portals market are now active in EAI. Indeed, it''s probably true that
    the development of corporate portals has been a major impetus behind new EAI initiatives.


    # E-channel


    E-channel, or electronic channel, is the generic name given to any electronic
    channel of communication between customer and vendor or between vendor and supplier
    partner. However, at another level e-channel is a play on words. With disintermediation
    (i.e the removal of multiple tiers distribution channel), the e-channel is also
    seen as a new way of doing direct business'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'and bypassing intermediaries (in the same way that the phone channel and the
    call center kicked off the first moves moves towards disintermediation in the
    1980s). Therefore, supporting e-channel communications is becoming more important
    as companies aim to develop direct relationships with their customer bases. See
    also ERMS


    # Embedded analytics


    See Analytical CRM


    # ERMS


    Electronic response management systems. These are systems that manage a multiplicity
    of customer communications across electronic channels (see E-channel). E-mail
    management applications are now widening to become more fully functioned response
    management resources, managing voice, chat, Web and mobile text interaction. Many
    CRM suites embrace ERMS functionality as well as rarely have the depth of functionality
    offered by best-of-breed vendors. See also E-channel.


    # Integration adapter


    Integration adapters are proprietary interfaces between applications (e.g., legacy
    applications or SAP) and integration backbones provided by firms such as Tibco
    or webMethods.


    The argument goes that over time the requirement for these adapters will diminish
    as Web services models are adopted. However, there will always be a role for adapter
    technology as long as legacy data remains.


    # IVR


    Interactive voice response. IVR systems work in conjunction with ACD technology
    to manage customer calls. IVR systems can accept voice or key-pad responses from
    customers to provide value-added services or (with ACD functionality) to route
    calls to call-center operatives based on skills-based routing tables.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Java


    Java is increasingly the programming language of choice for enterprise applications.
    One of the key attractions of Java is that it is platform independent so that
    applications written (say) for a Sun/UNIX environment can work equally well in
    IBM/AIX environment. However, the language is often criticized for being slow
    and therefore unsuitable to the needs of developers writing mission-critical applications.
    However, it is increasingly the case that CRM application vendors are rewriting
    their code base in Java as more and more application functionality starts to reside
    on the Internet.


    # J2EE


    Sun''s Java 2 Platform Enterprise Edition allows enterprise-class applications
    to be created using modular components that can spread across the enterprise and
    be interconnected. J2EE comes with a series of "services" that allow components
    to inter-work. J2EE also defines a security layer for applications built in J2EE.


    Microsoft''s .NET architecture is a competitive architecture to J2EE. Microsoft
    is keen to win in the Web services and enterprise application development arena.
    However, Sun is a powerful incumbent.


    # J2ME


    Java 2 Micro Edition. GPRS and 3G mobile telephone services are rolled out, different
    operating systems will compete for space in the mobile handset market. However,
    in the more advanced "mobile" economies, such as Japan, penetration of Java-enabled
    handsets is increasing. Java enabled handsets will be to run Java-based applications
    that can be downloaded from the network, or the handsets can be run as "thin clients",
    accessing powerful network-based applications such as m-commerce and consumer
    games. Sun is keen to propagate the idea that just as J2EE permeates the enterprise
    space, J2ME is the logical extension of this architecture into consumer devices—particularly
    connected consumer devices such as mobile phones and digital set-top boxes.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Glossary of CRM-Related Terms


    # .NET


    It remains to be seen, however, whether Microsoft will be capable of lodging Sun
    from its increasingly strong position in the enterprise application development
    space with J2EE.


    # OLAP


    On-line analytical processing. So-called OLAP tools (e.g., those from SAS and
    Business Objects), allow users or applications to make decisions in real time.
    OLAP tools are sometimes referred to as decision support tools and are used widely
    in analytical CRM arenas.


    # Operational CRM


    Operational CRM is a term used by several firms of market analysts to describe
    those ongoing, day-to-day processes of customer support and engagement. Typically,
    operational CRM describes those services provided by the call center.


    # Portal


    The precise meaning of the term “portal” in a CRM context has changed over recent
    years. In the Internet world a portal used to denote a Web site that is a single
    point of entry to multiple data sources. For example, Yahoo is a portal in that
    a rich variety of information and information feeds is contained within the Yahoo
    site itself, obviating the need to leave the portal. However, the term “portal”
    is now used in a wider sense to describe any set of consolidated services accessible
    via a Web browser. These may be internal (intranet-based)'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'services or external (Internet-based) or both. Moreover, the term “services”
    embraces both data and application components.


    Therefore, “portal” in common Internet parlance now means simply a browser-based
    consolidation environment in which customers, employees, or partner organizations
    get access to key data and services. Such communications may use a variety of
    portal flavors—but all drawing from common data or application sources.


    # Self-help


    Customers can gain access to information or corporate knowledge or even personal-account-based
    information using self-help systems. Self-help can be accommodated by IVR technologies
    or using self-help functionality on a Web site or extranet. Increasingly, portal
    technologies are being utilized to allow customers to access corporate applications
    directly.


    # Skills-based routing


    Skills-based routing allows both traditional voice interactions (using IVR/ACD)
    and text messaging (using text analysis) to be routed to appropriate resources,
    such as contact center agents. Agents each has associated skills profiles and
    customer queries will be mapped to agents on the basis of call or message categorization.


    In large consumer organizations, categorization schema and skills profiles can
    be highly complex, particularly if the organization has many divisions or brands,
    each with their own categorization schema. Therefore, if customer response management
    happens centrally, there may be a requirement to have a hierarchical schema based
    on company division, language, or other factors.


    # SLA


    Service level agreement. Often customer-facing organizations define service levels
    that they (internally) agree should define the minimum standards of service given
    to the customer. Increasingly, organizations are setting SLAs for the number of
    times a phone should ring before a customer call is answered or the average amount
    of “hold” time that a customer should be expected to tolerate before being able
    to speak to a call-center operative. Increasingly, customer-facing organizations
    are extending SLAs into such areas as e-mail'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Glossary of CRM-Related Terms


    responsiveness. SLAs that are set on the basis of customer need are particularly
    appropriate. For example, a service organization may define an average hold time
    of 10 minutes as a worthy objective. However, the reality for the customer perspective
    is that a 10-minute average performance may translate into a 40-minute wait period,
    on average, during peak calling periods, which is utterly unacceptable.


    # SMS


    Short message service (or often referred-to simply as mobile text messaging).
    Text messaging across the mobile network has taken off in Europe particularly,
    resulting in significant percentages of mobile phone operator revenue being accounted
    for by data services. SMS is a potential CRM vehicle allowing customers to access
    their account histories or to obtain alerts via the SMS service. Many European
    banks now offer access to bank account data using outbound SMS alerts.


    # SOAP


    SOAP is a so-called lightweight protocol for the exchange of information in a
    decentralized, distributed environment (i.e., across the Internet or across a
    widely distributed corporate intranet). It is an XML-based protocol that consists
    of three parts: an envelope that defines a framework for describing what is in
    a message and how to process it, a set of rules for expressing instances of application-defined
    datatypes, and a convention for representing procedure calls and responses. SOAP
    is emerging as the standard protocol for the Web services model (see also UDDI
    and Web Services).


    # Synchronous communications


    See Asynchronous communications


    # Trouble ticketing


    CRM and support initiatives can be impacted if, in a service organisation (such
    as a telecommunications service company), customer-facing staff are not made aware
    of service faults. Trouble ticketing can help by allowing cus'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'tomer service staff to get status reports on service faults and information
    regarding affected customers.


    # UDDI


    Here is the definition from the UDDI Community, the body that runs UDDI.org and
    is developing a set of open standards for a service registry (www.UDDI.org).


    The Universal Description, Discovery and Integration (UDDI) project is a sweeping
    industry initiative. The project creates a platform-independent, open framework
    for describing services, discovering businesses, and integrating business services
    using the Internet, as well as an operational registry that is available today.


    UDDI is the first truly cross-industry effort by all major platform and software
    providers, as well as marketplace operators and e-business leaders. This technology
    and business peers are acting as the catalysts to quickly develop UDDI and related
    technologies.


    The UDDI project takes advantage of WorldWide Web Consortium (W3C) and Internet
    Engineering Task Force (IETF) standards such as Extensible Markup Language (XML),
    and HTTP and Domain Name System (DNS) protocols. Additionally, cross platform
    programming features are addressed by adopting early versions of the proposed
    Simple Object Access Protocol (SOAP) known as XML Protocol messaging specifications
    found at the W3C Web site. The UDDI protocol is the building block that will enable
    businesses to quickly, easily and dynamically find and transact with one another
    using their preferred applications. Over 220 companies are members of the UDDI
    community.


    # VoIP


    Voice over IP (i.e., synchronous voice communications over the Internet). The
    majority of voice calls are currently carried over non-IP-based phone networks.
    VoIP denotes synchronous voice calls conducted over the Internet using the Internet
    protocol. Over time, more and more Internet devices will allow interpersonal voice
    communications to be conducted on the Internet, certainly as more and more mobile
    devices adopt IP-based GPRS and 3G technologies. Therefore, it''s likely that
    in a CRM context we will see the'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Glossary of CRM-Related Terms


    emergence of contact centers supporting voice and text IP-based communications
    channels.


    # Web service


    A Web service is an application that resides on the Internet and can be called
    as an object or component in a Web-based application. Standards are emerging for
    Web services, describing the method by which Web services are carried over the
    Internet and can be found using directory services. Many analysts believe that
    the Web services model will ultimately replace so-called “hardwired” applications
    as the standard means of providing enterprise-class CRM services in the future.
    See also UDDI.


    # WML


    Wireless markup language—the equivalent of HTML in the mobile phone world. WML
    allows Internet-based information to be received by a WAP (wireless application
    protocol based) mobile phone.


    # WSDL


    Here’s the Ariba/IBM/Microsoft definition. “WSDL is an XML format for describing
    network services as a set of endpoints operating on messages containing either
    document-oriented or procedure-oriented information. The operations and messages
    are described abstractly, and then bound to a concrete network protocol and message
    format to define an endpoint. Related endpoints are combined into abstract endpoints
    (services). WSDL is extensible to allow description of endpoints and their messages
    regardless of what message formats or network protocols are used to communicate.”


    # XML


    This is Norman Walsh’s definition from XML.com


    +   - XML is a markup language for documents containing structured information.


    Structured information contains both content (words, pictures, etc.) and some
    indication of what role that content plays (for example, content in a'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'section heading has a different meaning from content in a footnote, which means
    something different than content in a figure caption or content in a database
    table, etc.). Almost all documents have some structure.


    A markup language is a mechanism to identify structures in a document. The XML
    specification defines a standard way to add markup to documents.


    XML, or rather SOAP (a subset of XML) is the backbone or defining protocol for
    emerging Web services standards. Many CRM software vendors are developing applications
    based on Web services compliant components.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Vendor Directory


    This directory is presented here to provide readers with an overview of some of
    the more interesting software players that fall into the CRM market space. It
    is not intended to be exhaustive or complete, but it does attempt to list companies
    that have developed interesting technologies or have blazed into certain CRM market
    segments. I am aware that there are many experts expertise but could only provide
    readers of certain vertical markets. I have hundreds of software vendors that
    could have made it onto this list. My only defense is that I may not heard of
    them or I considered their solutions too “niche” to be of interest to a reader
    looking for a broad overview of CRM technologies and vendors.


    I have also deliberately excluded companies that claim to have overt CRM solutions
    expertise but could only be regarded as systems integrators or experts in implementing
    CRM solutions in certain vertical markets. I have also excluded companies that
    claim to have products designed to support relationship management but in fact
    only database platforms or design tools. I have, however, included a number of
    players whose solutions could be described as marketing solutions as well as a
    few others that are oriented as middleware or knowledge management players. I
    am convinced companies that have developed products more designed for customer
    support environments will embrace such technology in due course.


    Amacis (www.amic.com)


    Amacis has succeeded in developing a new segment in the CRM market for mission-critical
    high-end e-channel management solutions in large center environments. Its customer
    interaction management architecture (Amacis Visibility) was designed with the
    needs of larger organizations in mind. Some commentators have noted that the Amacis
    Visibility solution'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'may have been announced somewhat too early (i.e., before there was a perceived
    need on the part of larger companies to manage electronic communications. In many
    large companies there is a reluctance to open the floodgates of electronic communications).
    Some have failed to crack the nut of seamlessly managing voice communications
    by customers and integrating front-end applications with legacy applications.
    Therefore, the Amasic solution, provides seamless connectivity to back-end systems
    using IBM MQ Series out of the box is somewhat novel.


    The challenge Amasic faces is similar to that faced by other software vendors
    who have developed what are perceived as category killers. They simply do not
    have the marketing might to convince customers to invest in solutions that have
    not been branded Stibel. Despite this, Amasic has been successful in signing up
    such companies as HSBC Bank for multi-country licensing arrangements.


    # Amdocs (www.amdocs.com)


    Amdocs completed its acquisition of Clarify from Nortel Networks in November 2001.
    Clarify had, itself, built up a strong set of functionality in the customer interaction
    management space. Prior to the acquisition, Amdocs was associated with CRM solutions
    overly aimed at fixed-line and mobile telephone operators. However, this vertical
    orientation makes sense for the company to have a fully integrated customer interaction
    solution provided by Clarify. Telephone services companies have been slow, often,
    to integrate order management, provisioning, and billing systems. Amdocs, with
    its vertically oriented offering, combined with Clarify, now has a persuasive
    line-up of product for the telecommunications segment—one that will become increasingly
    important within the CRM market.


    # ATG (www.atg.com)


    Like Blue Martini, ATG has seen some revenue declines and has witnessed volatility
    in its share price in financial markets. While ATG has been a trailblazer in developing
    “portal” products, it has focused its technology on web retailers rather than
    the more lucrative enterprise portal market. ATG, however, is repositioning its
    products by adopting more of an enterprise-class platform orientation and has
    forged BEA and IBM (Webphere) technology partnerships. However, ATG is going to
    find it tough to keep up with the heavyweights.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Avaya (www.avaya.com)


    Avaya is the world leader in automatic call distribution ACD and interactive voice
    response IVR systems and was spun-off from Lucent—itself an AT&T spin-off. With
    its acquisition of Quintus, Avaya is now a serious player in the multi-channel
    customer interaction management space. Quintus was one of the early players in
    the e-mail management category. However, it is seen as a pure-play call-center—focused
    firm and may find its market slipping away from unless it is able to move swiftly.


    # BEA Systems (www.bea.com)


    BEA is, and will continue to be, a leading player in integration products that
    will define CRM processes in the future. The BEA Weblogic architecture allows
    companies to build enterprise-class applications and embrace the Web services
    model. However, BEA''s focus has always on larger organizations with more distributed
    applications. Therefore, the company''s focus is on delivering middleware solutions
    to larger corporations that want to embrace the Web services model and to expose
    these new hybrid applications to legacy systems.


    # Blue Martini (www.bluemartini.com)


    Blue Martini has been having its troubles of late, failing to sustain revenue
    growth. Its products allow Web retailers to maximize sales, using analytics and
    cross-sell/upsell techniques. The company was relentless throughout the course
    of 2001 in forging and announcing reseller and technology partnerships. However,
    its revenues were bound to take a major knock when plugs started to get pulled
    on Internet retailing investments.


    Blue Martini''s single-dimensional sales can be maximized using automated analytics
    does not resonate with organizations that are spending most on CRM—namely service
    organizations with complex and multidimensional customer relationships. The category
    of product represented by Blue Martini has a part to play in maximizing sales
    via the e-channel but it needs to be harnessed and tamed—made softer. Customer
    relations, often, are not enhanced if the only end game is tactical revenue maximiaztion.
    Customers are not that simple.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Bowstreet (www.bowstreet.com)


    Bowstreet, is an unashamed Web services company, and claims that companies that
    adopt its Web application development model will substantially reduce time to
    market.


    Bowstreet provides an application development infrastructure that allows services
    to be assembled “just in time” via Web delivery protocols. The services do not
    have to exist “out there.” Rather, they can be provided by in-house Web services,
    legacy applications, or third parties. The key thing is that the model that Bowstreet
    advocates is a Web services; it is an evangelist for this application development
    approach.


    As such, Bowstreet will certainly be a key player in the development of CRM applications
    in the future. The company recently struck a deal with Sun where Bowstreet would
    port its application development platform to the Sun ONE platform, allowing Java
    developers to build Web services. Microsoft has soft a similar deal with Avinon
    to develop Web services using Microsoft’s .NET application server.


    Bowstreet got to a good start with significant VC funding and has helped trail-blaze
    the concept of Web services. Take-up continues to be slow, but few doubted that
    the Web services model will ultimately have a significant impact on the development
    of CRM applications in particular.


    # Business Objects (www.businessobjects.com)


    Business Objects wrote the book on Business Intelligence, literally. Its CEO,
    Bernard Liautaud, has written a best-selling book e-Business Intelligence: Turning
    Information Into Knowledge Profit. The company was the first French company to
    list on the U. Nasdaq exchange, and its financial performance has been exemplary.


    Business Objects has maintained focus since its inception. Its analytical tools
    and applications allow companies to specialized ERP information in predefined
    ways based on business experience and using relatively easy to implement tool-sets.
    This data are then delivered to staff and customers in order to enhance the customer
    experience (or, put another way, if the customer asks about his own account status
    he gets an answer).


    Zurich Insurance has used Business Objects technology to enhance relationships
    with customers such as Starbucks. Through use of an extranet facility, Starbucks
    is able to get access to critical insurance information about'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'its properties in real time. This facility has helped Zurich reduce churn within
    its corporate customer base. Business Objects is also developing mobile phone
    versions of its client applications to allow mobile workers to interrogate corporate
    databases when they are in the field.


    There is something reassuring commonsense about the Business approach to business,
    and it does appear to be reflected in the company''s own financial performance.
    While Epiphany, for example, stresses how it can bring self-learning functionality
    to its analytical engines, Business Objects get sooner in allowing business managers
    to call the shots in defining analytical processes—and giving them the tool-kits
    to do it.


    # Chordiant (www.chordiant.com)


    Chordiant, like Business Objects, has also been doing rather well and has made
    some sensible acquisition decisions, thereby enhancing the company''s product
    portfolio over customer interaction management. It also appears to have selected
    acquisition targets that have operated in hot segments of the CRM spectrum—for
    example, e-marketing, with the acquisition of Prime Response. Its current buzz
    term is "dynamically driven" CRM—what ever means.


    The fact is, however, that Chordiant does have a coherent and sensible product
    strategy. The company has addressed the needs of larger companies and the latest
    version of its suite is paying more than lip service to integration. The product
    is developed using J2EE and the company claims extensive use is made of XML and
    SOAP interfaces.


    Such an approach is laudable. Chordiant wants to be the outstanding CRM architecture
    player and recognizes that a legacy exists and SOAP is likely to be a defining
    services integration standard.


    # Documentum (www.documentum.com)


    As the importance of content grows in the context of CRM, the beneficiaries will
    be companies such as Documentum—companies that allow the distribution and management
    of large volumes of content across the Web. Such solutions will grow in importance
    as organizations aim to provide highly relevant and personalized information just
    in time via contact centers and self-help portals. The next wave of consolidation
    in CRM is likely to happen when knowledge management and content management functionality
    is'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'embraced. Therefore, Documentum''s financial performance is likely to continue
    beating forecast until analysts realize that content management is now another
    extension of CRM.


    # Egain (www.epiphany.com)


    Egain was another early player in the e-channel management space. Like Kana, it
    was one of the first e-mail management companies to make an IPO. In terms of market
    capitalization it has fallen from grace to a degree but has been recovering well
    of late and has succeeded in supplementing its product portfolio. However, the
    market''s perception of the company is likely to be that it is a point-product-e-mail
    management vendor.


    Companies can succeed if they are deemed to be of breed in their market spaces.
    Egain, however, has never been successful in building a reputation for being “high-end”
    or an ideal platform for enterprise players. Rather, it has been more successful
    selling hosted solutions to smaller companies, including dot-comps.


    For such a business model, of course there are issues relating to scalability
    and the ease with which customers can migrate from low-end offerings to being
    more of an enterprise-class solution. For these and other reasons,Egain has been
    a casualty of the downturn in CRM stock performance.


    # e.Piphany (www.epiphany.com)


    e.Piphany is also aiming at the CRM suite space but comes from an analytical rather
    than a customer interaction background. It has, however, added customer interaction
    features to its suite through acquisition. Products, the company claims, are now
    largely “Web native”—developed in J2EEwith interfaces to pocket PCs, WAP phones,
    and the like.e.Piphany also claims to have a complete CRM footprint covering marketing
    marketing, predictive tools, knowledge management, intelligent sales, and analytics,
    using OLAP tools.


    Compared to Siebel and Peoplesoft, however, e.Piphany has been having difficulties
    maintaining its revenues and is almost constantly losing bids to these formidable
    opponents.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# Eretel (www.eyretel.com)


    European based Eretel is a London Stock Exchange-listed company that is active
    in the digital voice recording subset of the call center application segment of
    the CRM market. The company received a minority investment from Cisco few years
    back; as a result of this, it has invested heavily in VoIP research and development
    efforts. Already strong in the voice recording market, Eretel will have a key
    role to play in future all-IP contact centers where there is a requirement to
    archive customer interactions across all voice channels—synchronous voice, chat,
    voice messaging, and so on.


    Eretel customers include many of the large banks, brokerage houses, insurance
    and technology companies.


    Eretel’s revenue performance has been good, and the company has traditionally
    been viewed favorably by the investment analyst community.


    # Genesys


    Genesys is a wholly owned subsidiary of Alcatel, and like Avaya, is a leader in
    ACD and CTI technology. Genesys acquired IBM’s Callpath technology in May 2001,
    causing further consolidation in the CTI market place.


    Genesys is also a leader in so-called universal queue technology. This allows
    all customer interaction, regardless of the nature of interaction or channel chosen,
    to be routed through a universal queue of interactions to the most appropriate
    contact center resource.


    While fine as an objective, universal queue technology fails at a marketing level
    by not offering optimized routing for each channel. This may explain why adoption
    is lower than might be expected. Most organizations that have embraced e-channel
    management have opted for standalone e-channel management solutions working alongside
    a CTI application—perhaps with messaging-based integration between the two.


    The adoption of portal-based contact center front ends likely to dampen enthusiasm
    for universal queue technology. Portals will allow optimized channel routing enabled
    by best-of-breed components united by the portal and integration adapters. Moreover,
    over time, all-IP contact centers will grow in importance.


    Therefore the importance of the traditional CTI players, like Genesys, is likely
    to decline unless these companies adapt.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# IBM Webphere (www.ibm.com)


    IBM''s Webphere family of products—middleware, database platforms and application
    components—is listed here because IBM is an important player in the application
    integration and portal markets—markets that are, increasingly, driving the CRM
    market. Worthy of mention here is IBM MQSeries, IBM''s messaging and queuing architecture,
    which is used extensively in certain vertical markets as a primary integration
    layer, particularly in financial services.


    # Kana Communications (www.kana.com)


    Kana was another early starter in the e-channel management space and is now, with
    eGain, synonymous with e-mail management solutions. However, it has added other
    software widgets to its line of products over the years, largely as a result of
    acquisitions by Broadbase and Silknet. Kana''s acquisition of Silknet advised
    Siebel so much that the two parties partnered (prior to the Silknet acquisition
    Kana was a Siebel partner). However, IBM announced a strategic partnership with
    the company in 2001, and IBM is also a strategic partner with Siebel. The world
    of CRM software is a small world indeed.


    Kana''s cash outlay had a good number of the financial analysts in a spin after
    acquiring a bundle of cash with the Broadbase acquisition, the company seems to
    have stabilized and is becoming more coherent from a marketing point of view.
    It has made a good few marketing noises about adopting a portal-central approach
    to CRM application suite development, thereby pitching itself against Siebel.
    Long-term, however, it will continue to wrestle with some major integration issues.
    Downsizing and turnover in its senior management ranks along with an apparent
    lack of overall direction have also plagued it. Who knows, though, It might do
    a Peoplesoft and surprise us all.


    # Oracle


    Oracle offers CRM solutions through its eBusiness Suite. In true arrogant style
    it also has a Siebel/Clarify migration package.


    Oracle argues that its suites beats Siebel by being a full-process CRM suite out
    of the box, automating all customer-touching processes—for example, by integrating
    invoicing and credit control and by incorporating its own campaign analytics.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'Vendor Directory


    195


    However, Oracle has been less successful in the CRM space simply because of a
    lack of marketing focus. Its product portfolio is wide, and its functionality
    in terms of its CRM offering is simply not featured in comparison charts with
    best-of-breed point solutions or other suites.


    Oracle''s aggressive marketing and pricing will ensure that the company has a
    position in the CRM suite space. However, its CRM vision appears to be lacking,
    and it is unlikely to reach critical mass (or thought leadership) in the long
    term.


    # Pegasus (www.pegasystems.com)


    Systems operates in the business rules engine marketplace aims its solutions squarely
    at the CRM area. As Web services grow in importance so too will the requirement
    to have business rules defining component processes. Pegasus has successfully
    defined a series of vertically oriented solutions for defining rules in such businesses
    as healthcare and retail banking, among others. In time, enterprises wishing to
    implement an all-encompassing CRM ecosystem are likely to make their first step
    at Pegasus and fill in the gaps with other best-of-breed solutions.


    # Peoplesoft (www.peoplesoft.com)


    Peoplesoft appears very determined to put together a compelling alternative to
    Siebel CRM solutions. Its recent acquisition of Annuncio—a leading player in the
    e-marketing segment—comes hot on the heels of an announcement of Peoplesoft CRM
    8. This latest version of its CRM suite was greeted by market analysts as being
    ahead of the game in terms of functionality and architecture. The Internet product
    requires no client code, which means that it can easily be distributed and personalized
    for different communities. With the addition of Annuncio''s e-marketing functionality
    Peoplesoft is becoming a highly credible Siebel opponent. The Annuncio acquisition
    addresses a big flaw in its product offering—namely weakening marketing functionality.


    # Plumtree (www.plumtree.com)


    Plumtree is a very important player in the portal market and has recently started
    focusing heavily on the Web services infrastructure market as the one it wants
    to. Given this positioning is head-to-head with Bowstreet.'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'However, given its impressive installed base (in the portal market) it promises
    to be more often head-to-head with SAP for major Web services-based CRM implementation
    bids.


    As the company puts it to, "The business desktop of the future will come from
    the Web, integrating applications, documents and Web services into an experience
    simple enough for everybody to use, anywhere. Plumtree developed what we call
    a corporate portal to power this Internet business desktop. With over 300 customers
    and five million widely licensed users, the Plumtree Corporate Portal is the most
    scalable, widely deployed portal software on the market.


    Therefore, there is no question that Plumtree intends to use a large chunk of
    the portal and emerging Web services market. Ironically, SAP''s very public launch
    into the portal space, Cadbury Schweppes recently implemented a Plumtree-based
    portal solution to give employees access to SAP ERP data corporationewide.


    # Primus (www.primus.com)


    Primus focuses on the call center market for its so-called knowledge management
    solutions. When integrated with front-office applications, Primus products can
    give technical support staff or customer support operatives access to critical
    customer information just in time. Such products, when sitting alongside customer
    interaction management solutions, can actively enhance the customer experience
    and empower contact center operatives.


    Primus solutions can also be implemented where customers themselves need access
    to information—on self help portals or in kiosk environments. Indeed, the knowledge
    management dimension of CRM is often overlooked.


    # Remedy (www.remedy.com)


    Remedy was recently acquired by Peregrine Systems. Remedy''s CRM applications
    are now embraced by Peregrine''s enterprise e-business suite. Remedy was strong
    in customer support areas, and this represents an attempt by Peregrine to round
    out its overall enterprise offerings. However, the markets appear to have taken
    the view that Peregrine is somewhat of a second-tier player in the enterprise
    space and fully integrating Remedy''s products is likely to be somewhat of a challenge.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Responsys (www.responsys.com)


    Responsys describes itself as a leader in interactive CRM solutions—implying that
    most other CRM solutions are not interactive. However, the company may have a
    point.


    I have a fondness for the Responsys corporate vision (even if it is somewhat cheesy).
    Whether Responsys is the only company required to achieve this vision is debatable.
    But the vision is laudable.


    > “[Responsys] aims to become the leading provider of interactive Customer Relationship
    Management (iCRM) solutions—providing Global 2000 businesses with the standard
    platform for personalized experiences with their customers.


    [Responsys wants] to help our clients out the Customer Profile at the center of
    their business, so they can automate personalized and relevant online dialogues
    with their customers.


    We are convinced these dialogues will result in greater loyalty, profits, and
    ROI for our customers.


    We believe that opt-in is sacred.


    That everybody deserves to be communicated with as an individual.


    And that in the 21st Century, brand isn''t image. It isn''t messaging. And it
    isn''t position.


    In today''s marketplace, Brand is Technology.


    And it''s our vision to be the platform that creates the winning brands of tomorrow."


    # Market Tools (www.markettools.com)


    Over time, CRM and e-marketing suites will grow to embrace market research tools.
    Market Tools is a market leader in on-line research technology and a pioneer in
    the area. While still privately held, the company has received considerable VC
    and partner funding. WPP Group and General Mills'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'recently became equity backers. The company also has a partnership with

    SAS.


    # Outsourcers


    Outsourcers is not a company as such. Rather it is a number of players, but

    worth mentioning in this context. The past few years have seen the establish-nment
    and growth of a handful of outsourcers who have committed themselves to providing
    better customer management processes to companies that

    embrace multiple communications channels for customer dialog.


    A few of these companies have been start-ups ever established to manage multiple
    channels, using new-breed contact centersoftware from such companies as Kana and
    Amacis. Others were more "traditional”-sourced call center operations that moved
    into the call center space. In this latter category I would include companies
    as Stream International (now part of Selectron) and Vertex in the United Kingdom.
    Typical kinds of new block—companies that perhaps focus more on electronic customer
    engagement—include GEM (www.the-gem.com), based in Northern Ireland and having
    Amazon and Microsoft within its client base, and Brigade (bri-gage.com) in the
    United States whose client list includes Compaqq.


    # SAP (www.sap.com)


    SAP is a leading player in the ERP market and has every intention of stealing
    the lion''s share of the enterprise CRM market. With its mySAP CRM suite and emerging
    portal products solution, SAP is a potentially huge player in the CRM market for
    several reasons.


    SAP has recognized that integration middleware, portal functionality, and enterprise-class
    applications, when brought together could potentially spill disaster for hard-wired
    CRM applications. SAP''s acquisition of Top Tier, an Israel-based portal software
    company, has given it rich, techn-leading software. With its huge installed base
    of ERP, its access to a considerable portfolio of “portlet” applications, and
    its considerable global people resources, there is little doubt that SAP will
    make the enterprise-ware market its own.


    However, it has taken risks in making public its avid belief in portals. There
    is still a reluctance on the part of CIOs to take the leap into developing fully
    integrated enterprise applications. Therefore, SAP is facing consider-'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'able market development challenge. If any software company is positioned to
    achieve this, however, SAP is.


    # SAS (www.sas.com)


    SAS, or SAS Institute as it used to be known, is a leader in analytical software.
    Given the fondness for analytics in CRM circles, the company has repositioned
    itself to be seen as more than an e-business company than a back-office expert
    tool.


    SAS likes data warehouses. Its analysis tools allow large customer sets to be
    analyzed to support lots of transactional decision-making. For example, SAS software
    is used to assess credit risk by Wells Fargo Bank''s mortgage risk division.


    SAS is the world''s largest privately held software company and has a considerable
    pedigree in the industry. Its alliance partnerships spread far and wide, and the
    depth of its analytical offerings are significant.


    # Siebel Systems (www.siebel.com)


    Siebel is to CRM what Hoover is to vacuum cleaners. The fact is, however, that
    these days a vacuum cleaner from Dyson is much better than a Hoover. Siebel has
    attempted to mandate its component products on its corporate customer base by
    taking a dim view of best-of-breed products interworking using XML based integration
    methodologies. While charging technology partners hundreds of thousands of dollars
    to be associated with the Siebel brand, it has hesitation in recommending an in-house
    component over an out-of-house component from a so-called partner company.


    Despite what I think, Siebel continues to forge ahead, particularly in the sales
    force automation and contact center spaces, and its revenue numbers continue to
    confound Wall Street. However, companies such as BEA continue to improve middleware
    offerings and open standards—and portal-based applications become more and more
    like hard-wired applications in look and feel—Siebel has its work cut out to stay
    on top of the CRM application market.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Tibco (www.tibco.com)


    Like Plumtree and Top Tier (now SAP), Tibco is a portal company that is rapidly
    transforming itself into a Web services infrastructure player and is actively
    targeting customer-facing areas as a growth segment.


    Tibco''s product range includes adapters into legacy applications, enterprise
    backbone solutions, and portal technology. This allows all key parties to customer
    transactions and communications within an organization to have up-to-date operational
    information. Tibco also has powerful integration management applications that
    police workflow and extend the portal outside the enterprise using EDI, XML, and
    other data integration technologies.


    Tibco is not a CRM player so much as an extremely important technology for CRM
    implementations. Over time we will see a growth in "softer" CRM applications being
    built using a Tibco architecture. The company''s revenue and profit performance
    has been impressive and it has weathered the downturn well.


    # webMethods (www.webmethods.com)


    webMethods is another enterprise integration company that has been perhaps less
    successful than Tibco in developing an all-encompassing enterprise integration
    platform. Because webMethods comes from an application integration background
    and is less associated with portal technology, its offerings, in some corners,
    may be seen as less comprehensive.


    However, webMethods has a considerable reputation for application integration,
    and its adapter technology makes it an integration software leader. It has also
    developed a close working partnership with Siebel that is very valuable from an
    installed-base marketing point of view.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# About the Author


    Jeffrey Peel runs his own CRM and marketing consultancy practice, Quadriga Consulting
    (www.quadrigaconsulting.com), based in the United Kingdom. He has had a varied
    career in CRM, marketing research, and technology marketing. He was VP of global
    marketing for a European CRM software startup (Amacis Ltd.) and was head of marketing
    communications for a division of 3Com Corp. He has also held senior IT research
    roles in Roper Starch in Princeton, New Jersey (now part of NOP), and Research
    International in London (part of marketing services giant WPP Group). He is married
    to Liz and has two children, Jessica and James.'
