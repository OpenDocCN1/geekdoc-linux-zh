  md: '# 8.4 The enterprise suite-based approach


    interworking between parties and an interaction audit trail. Although other vendors
    (Siebel, for instance) provide limited functionality in terms of workflow, they
    lack the functional depth of these best-of-breed players and the institutional
    knowledge of the vertical market. A company that needs capabilities in this area
    will, therefore, be better served by the deeper solution than a generic one. In
    short, companies should think process, brand, and fitness for purpose first and
    then select the software.


    +   1. The enterprise has given foresight to all the CRM pieces will integrate
    with one another.


    +   2. The enterprise has also made plans to integrate legacy data where necessary.


    +   3. The software selections are made to meet the needs of the entire division.
    While consideration might be given to a particular region or department, it is
    not the overriding concern.


    +   4. The software solution is capable of growing with the enterprise (it is
    scalable and distributable with the proper failover routines).


    # 8.4 The enterprise suite-based approach


    One of the important caveats relating to a fit-for-purpose approach is that there
    are instances in which a suite-based software solution is appropriate. What is,
    once again, of importance is that the enterprise has a solid understanding of
    its customer-facing processes. If that investigation reveals that the company''s
    customer objectives require broad, low-level enablement rather than functional
    depth, suite-based solutions will be appropriate to achieve them. In addition,
    all suite-based solutions available today came from a best-of-breed legacy or,
    in SAP''s case, have best-of-breed added components (e.g., Siebel''s sales force
    automation solution or SAP''s portal functionality) remain strong and are worthy
    of consideration as individual components—but not necessarily strong enough to
    provide the infrastructure for all customer-focused systems.


    The primary suite-based CRM solutions available today come from Siebel, Oracle,
    SAP, and PeopleSoft. In addition, there are several vendors that focus on the
    “e” side of CRM but still take a suite-based approach to that space as well. These
    vendors include Kana and e:Piphany. For a brief and admittedly


