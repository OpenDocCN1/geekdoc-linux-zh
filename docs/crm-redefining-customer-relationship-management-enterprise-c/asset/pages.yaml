  md: '# Selecting Vendor Solutions


    # 8.1 The process conundrum


    This chapter looks in greater detail at CRM processes and how processes designed
    to enhance customer communications play such an important part in developing brand
    affinity. This chapter looks at the CRM software offerings and reaches some conclusions
    about the types of solutions best suited to CRM practice. It also discusses some
    of the broad categories of CRM software.


    A focus on processes is important because, at its core, CRM is not about software;
    it is about processes, some of which can be enhanced by judicious use of appropriate
    tools. Software that is implemented as a Band-Aid to speed up ineffective processes
    will have the effect of aggravating customers and causing dissatisfaction. Rather,
    best-practice CRM is an opportunity to implement processes that result in substantial
    and radical change within the organization. Software needs to be implemented to
    support appropriate process selection.


    Process orientation does not focus on particular departments. Even though the
    marketing department, the customer service department, and the sales organization
    are political realities, thinking about processes as the exclusive domain of a
    particular department is counterproductive to understanding the enterprise''s
    needs (never mind the customer''s).


    The result of internal process analysis should focus the company on customer experience.
    The company sets among its corporate objectives a goal—for example, to improve
    existing customer experience (most likely stated through a customer satisfaction/brand
    adherence metric). Metrics are established to track customer experience, and analysts
    are given the task of measuring experience. Analysts are, hopefully, enabled by
    a series of tools that'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'track behavioral patterns, customer engagement, and profitability. Remedial
    action is taken, of course, by communicating—communicating appropriately to enhance
    relationships. Communication, we must never forget, is central to our CRM definition.


    Utopia, from a CRM perspective, is something like this. While investigating customer
    data, an analyst notes that satisfaction and bonding are typically much higher
    when the customers are relatively early in their life cycles versus later in the
    life cycle. A bell goes off in the analyst''s head. She decides to look at the
    customer data mart to check the switch rates of well-established customers with
    low propensities to interact. She notes that the switch rate within this group
    is particularly high. She contacts her colleague in marketing.


    Her colleague in marketing recognizes the problem and notes that its resolution
    is in line with his objectives. He crafts a marketing campaign that targets the
    group identified by the analyst, offering these customers a “thankyou” service
    bundle. With rapid appeals, the campaign is launched, reduction of the switch
    rate in this group is achieved, and both valuation and lifetime valuation of the
    customer group are increased.


    Great story, right? Now let''s imagine the same scenario, but let''s take away
    the analytical tools that our analyst had at her disposal. In other words, we''ll
    move the CRM scenario back to the approximate point where most companies are today.
    Any company can have objectives, but the analyst may not have the necessary systems
    to ascertain performance against objectives. The issue, here, is not the lack
    of analytical tools. Rather it the lack of appropriate processes to allow analytical
    tools to identify the problem—and a lack of processes to make the tools available
    to the analyst in the first place.


    This focus on software tools, by necessity, looks at some of the offerings and
    presents a biased view. However, it should present the reader with a useful background
    critique of a variety of CRM offerings in a series of different categories. By
    selecting key tools, organizations can create a kind of CRM unto—or an unmitigated,
    underperforming CRM disaster. The purpose of the following is to suggest further
    investigation of certain types of CRM tools that we either consider to be helpful
    in defining CRM strategy or to be treated with caution. Further, the CRM software
    market is changing at a dramatic pace. The reader is recommended to seek out the
    latest information about all the companies and products mentioned here.'
  merge: -1
