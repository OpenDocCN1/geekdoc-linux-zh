  md: '# Glossary of CRM-Related Terms


    # ACD


    Automatic call distribution. ACD systems are used to route voice calls through
    a call-center to a resource able to deal with the customer query. They are used
    in conjunction with IVR systems. ACD systems often receive a lot of criticism
    because they are perceived to be in the way of interpersonal communications. For
    organizations that have under-resourced centers, ACDs provide a method of routing
    calls to low-cost response resources such as recorded voice announcements or voice-mail.


    However, when properly implemented, ACD can be a valuable tool. When customer
    calls are more accurately routed, customers are put in contact with a resource
    that genuinely answers the customer''s query. When an ACD is used to route calls
    to agents on the basis of agent skills (skills-based routing) can reduce the amount
    of time spent by the customer in explaining the nature of the call. Calls can,
    in effect, be prescreened, resulting in greater efficiency and less frustration
    on the part of agent and caller.


    Companies such as Genesys and Avaya offer ACD systems.


    With the widespread adoption of ERMS tools in larger companies, skills-based routing
    schema should be consistent across channels.


    # Analytical CRM


    Analytical CRM is a set of CRM processes that allow CRM practitioners to have
    a better understanding of customer needs, or customer behavior. At one level,
    analytical CRM can be used on an ad hoc basis to identify opportunity or potential
    churn within a customer base. At another level, analytical'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Glossary of CRM-Related Terms


    processes can be preprogrammed to ensure appropriate and timely communications.
    Increasingly analytical processes are embedded so that certain customer-initiated
    “events” result in an appropriate response.


    # API


    Application program interface. This is the interface used by an application program
    (such as a CRM application) to access the operating system and other services.
    An API can also provide an interface between a programming language and lower-level
    utilities and services that were written without consideration for the conventions
    supported by compiled languages.


    Application vendors with “open APIs” allow other applications or services to integrate
    or share information with their applications. In some cases, application vendors
    may go further and write simple integration tools that obviate the need to integrate
    at the level of the API.


    # Asynchronous communications


    Asynchronous communications describe those forms of communication in which there
    is a time delay between iterations of a dialog. E-mail is probably the most commonly
    used form of asynchronous communication. Indeed most forms of communication could
    be placed in a continuum where between synchronous communication and asynchronous.
    Voice calls to a call center are the most synchronous; web forms typically the
    most asynchronous.


    In a CRM context, there is a growing customer expectation that asynchronous communications
    will become more synchronous (e.g., that email messages are responded to). As
    a result we see the emergence of tools that allow some of the principles of CRM
    in the synchronous world to be applied to asynchronous communications—for example,
    skills-based routing technologies and case management.


    # Case management


    Case management allows customer interaction “cases” to be audit trailed, appropriately
    archived, and associated in some way with customer interaction histories. Case
    management is often used in a call-center context where a cus-'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Glossary of CRM-Related Terms


    tomer call—or at least a synopsis of the call or call outcome—is archived and
    numbered in a consistent way for retrieval purposes.


    However, as more electronic customer interactions are passing through multi-channel
    contact centers there is a greater need to provide case management tools to ERMS
    (or e-channel management) applications.


    # Categorization


    Customers typically make contact with a customer center if they have a particular
    type of problem or a certain information need. Over time, the nature of customer
    queries can be categorized. In the case of a retail bank, customer queries would
    typically fall into one or more of 400 categories. Often a customer will make
    contact with multiple queries (e.g., “I need my bank balance” and “I want information
    on your highest-interest savings account.”) Categorizing voice calls is relatively
    easy in that ACD menus should allow the customer call to be categorized and routed.
    However, most categorization engines fail because they cannot cope with multiple
    authorizations. In this text based categorization is potentially more powerful.
    A customer can type multiple queries into a dialog, and the text categorizer can
    apply multiple categories to the customer query, each of which will have to be
    resolved before the case can be closed.


    # Churn


    Churn is simply the term for customer turnover or attrition during the course
    of a year. A churn rate of 5 percent implies that 5 percent of the total customer
    base leaves during the course of a year. Minimizing customer churn is a key objective
    for many CRM implementations. However, it has to recognize that a degree of natural
    churn is to be expected (e.g., customers die or leave the country). However, defection
    of high-value customers needs to be minimized. Analytical tools can determine
    the nature of customer churn, and primary research can be very useful in determining
    likely causes for churn and pointers towards churnreduction strategies.


    # CIM


    Customer Interaction Management. CIM strategies are, increasingly, about embracing
    traditional voice interactions by customers and e-channel commu.'
