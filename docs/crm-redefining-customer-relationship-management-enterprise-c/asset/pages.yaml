  md: '# Data aggregation


    many organizations. Even today, with the existence of zillions of megabytes of
    processing power in many corporations, is it commonplace to receive a letter from
    an insurance company wishing you a happy birthday or from one''s bank suggesting
    a low-interest overdraft facility to cover these monthly presalary payment worries?


    Proactive, personal, one-to-one communication for many companies seems like just
    too much work. It is the essence of effective relationship building, however.
    Effective one-to-one communication needs to be more proactive and is wholly based
    on outcome prediction. Customers love proactivity. It makes them feel special.
    And we can be unless unless customers have a problem or need, they will seldom
    instigate communication themselves—although that should be an objective of CRM.


    Another point is that outcomes from communication may not result in short-term
    revenue maximization, but they will almost certainly result in a lifetime relationship
    with a customer. The keys to success are analytics and applied imagination—tricky
    stuff.


    During War II a team was created in Bletchley Park in Hertfordshire, England,
    and assigned the task of breaking German ciphers in communications between the
    German armed forces and Command HQ (or between Hitler and his field generals).
    The brilliant British mathematician Alan Turing applied concepts that had been
    developing in peacetime to this task. Specifically, he developed a machine that,
    rather than being hardwired for one task, could be applied to several different
    tasks—computing outcomes as a result of being gave computational instructions.
    These early machines allowed the mathematicians to test assumptions very rapidly
    by altering the instructions provided to these early computational machines.


    Analytics, in short, allow us to guess better. We can, for example, guess what
    groups of consumers are in common and test the degree of sameness between them
    using statistical techniques. We can also make assumptions about behavior and
    determine whether this behavior repeats or is common in a multiplicity of subjects.
    At one level, analytics are deductive and can disprove things suspected.


    They can then go further. In a CRM context they can allow us to identify specific
    individuals who are likely to behave in ways that are common with other, higher-spending
    customers. They can be used to define campaigns. They can be used to enhance specific
    one-to-one communications between vendor and customer. They can positively alter
    customer satisfaction levels if used at a proactive rather than a reactive level.'
