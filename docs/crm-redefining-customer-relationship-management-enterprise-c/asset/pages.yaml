    it provides a unique opportunity for organizations to constantly define and refine
    services to make the process of doing business immensely easy, seamless, and highly
    value added.


    The provision of value-added Web services demands that processes be defined so
    that all services can be glued together. In a presentation at the W3C workshop
    on Web services, Hewlett-Packard''s position paper on business composition makes
    the point very succinctly:


    The effectiveness and efficiency of business processes impact directly the profitability
    of a company. It is in the best interest of e-service providers as well as e-service
