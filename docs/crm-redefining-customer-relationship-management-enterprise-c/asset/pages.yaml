    # 2.3.4 Sales force


    In many organizations the call-center coexists with a sales force. High-spending
    customers may have their own account managers, or sales staff may be the means
    by which demand is generated and orders placed through the call-center. However,
    often the contact center is entirely separated from the sales process. In the
    same way that product managers ignore front-line staff, contact-center operators
    may have no passing along customer queries except through a supervisor who may
    have no formal method of communicating with sales staff.


    I have been using the term "contact center" interchangeably with "call center"
    throughout the course of this chapter so far. However, it is also a fact of life
    that in many organizations the call center is not in fact a center at all. Rather,
    it is a segregated and demarcated center—critical to the business but cut off
    from it. Moreover, where it attempts to manage new communications it does so in
    a piecemeal way. If call-center applications are isolated from other key operational
    systems, it can be pretty much guaranteed that operations detailed to look after
    e-mails or chat sessions will be under-resourced to an even greater degree.


    I present a bleak picture here. But the fact remains: If CRM is about customer
    communications, in many organizations there have been a scant amount of attention
