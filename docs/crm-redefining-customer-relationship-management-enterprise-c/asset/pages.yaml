  md: 'XML is the Extensible Markup Language. It is designed to improve the functionality
    of the Web by providing more flexible and adaptive information identification.


    It is called extensible because it is not a fixed format like HTML (a single,
    predefined markup language). Instead, XML is actually a "metanguage”—a language
    for describing other languages—which lets you design your own customized markup
    languages for limitless types of documents. XML can do this because it is written
    in SGML, the international standard metanguage for text markup systems (ISO 8879).


    Implicit in this definition is the fact that XML has a wide brief. It is not overtly
    de facto standard for application interoperability; rather, it is a Web-focused
    markup language.


    SOAP is an XML-based protocol that allows procedures to be sent across the Internet
    in the serial format required by the Internet. These procedures can exist in a
    Web-based service and behave in a manner identical to a local service. The key
    thing about SOAP is that the procedures can be interpreted by the Web service
    regardless of the platform from which they are sent and to which they are sent.


    SOAP messages are XML-based messages. As such, they are ideal for the development
    of Web services applications. The significant thing that SOAP is that the main
    software and platform vendors—Microsoft, IBM, and Sun—have embraced the technology
    and have released SOAP-based toolkits designed to simplify the process of building
    WSAs.


    SOAP’s transport protocol (the means by which remote procedure calls are sent
    across the Internet) is HTTP, which is currently used for Web sites to Web servers.
    So the technology is already proven and working. SOAP simply uses the same protocol
    to invoke a procedure from a remote application by way of a standard URL. Just
    as I can browse a Web site and request (by clicking a link) a new page of information,
    SOAP will request that a procedure be performed in a remote application to support
    a Web-based application. The round-trip time for SOAP messages/responses is similar
    to that for populating a dynamic Web page.


    Over time, SOAP messages will also be carried over to other transport protocols,
    including IBM MQSeries, the most ubiquitous messaging standard used in large corporations.'
