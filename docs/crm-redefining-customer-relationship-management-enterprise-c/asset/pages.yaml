    postal code and, therefore, displays my local weather forecast). Once, while these
    were important steps toward analytical CRM, they were not advanced in terms of
    the analytical applications embedded within them. That would begin in Wave 2.


    # Wave 2 analytical CRM


    As brick-and-mortar companies increased their use and presence on the Internet
    during the past several years, they have brought with them the knowledge of data
    mining and customer profiling. Not surprisingly, therefore, the demand on analytical
    CRM vendors has become greater. The use of the "analytical" qualifier is a bit
    amorphous as analytics have become more embedded in all CRM applications. In fact,
    with time, it is clear that analytical CRM will become less a category of CRM
    software and more a set of embedded processes. This will be examined subsequently
    (when we discuss Wave 3).'
