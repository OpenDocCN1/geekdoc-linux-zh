  pgno: 101
- img_proc: true
  md: '# 6.7 Technology consequences?


    that indicate across the sample of customers only a small percent-age—maybe 4
    or 5 percent—is dissatisfied. However, customer churn rates are often much higher
    than this. When the base of customers is presented with a need to buy at some
    date in the future, 20 or 30 percent may decide to take their business elsewhere.


    The conclusion we can make is that customer satisfaction (or dissatisfaction)
    is a relatively blunt instrument for determining customer loyalty to a brand.


    According to market research agency Millward Brand, it is often the case that
    the so-called correlation between customer satisfaction and brand loyalty is false.
    Brand loyalty, rather, has more to do with the nature and intensity of the relationship
    itself. Unilvolved, distant customers will be involved and less loyal than those
    who feel that the relationship is close and tangible.


    Millward Brand uses the concept of customers “bonding” with the brand (often referred
    to as brand equity). Therefore, in attempting to measure the strength of a customer
    base, it’s also important to consider the nature of the relationship and the nature
    of the brand itself. Such concepts, too, CRM’s domain move closer and closer to
    the traditional roles of brand and marketing management.


    By measuring two key factors—satisfaction and the strength of a brand’s equity
    with a customer—a fuller picture can be built regarding the status of the customer
    base. I would argue that such metrics need to be considered and monitored in the
    development of CRM systems. (It also takes back to the title of this chapter.)
    This concept is discussed at much greater length in Chapter 10.


    Dot-coms, most of them, did not have established brands and, therefore, had negligible
    brand equity. Consequently, the CRM processes that they demanded that were developed
    for them operated merely at the level of customer satisfaction. Large companies,
    on the other hand, do have brands and need to consider the nature of them and
    the role they play in customer loyalty.


    How, therefore, do we set about putting brand-related customer attributes into
    CRM systems? A place to start is consider customer segmentation on the basis of
    customer relationship with the brand. And it’s all about creating customers who
    are anything but passive—it’s about creating brand champions.'
