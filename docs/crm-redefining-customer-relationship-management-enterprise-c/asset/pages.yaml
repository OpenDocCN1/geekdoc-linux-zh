    +   4. Today''s CRM suite-based solutions began as a best-of-breed solution within
    a particular application and expanded into new areas.


    # 3.4 The analyst''s viewpoint on CRM


    As mentioned previously, analysts come from a wide variety of backgrounds. When
    combined with their somewhat opinionated nature, this makes for a number of different
    viewpoints on CRM. However, there is agreement on definitions and descriptions
    of CRM as it relates to technology.


    Perhaps the most overriding issue in CRM today is the debate whether a suite-based
    approach or a best-of-breed approach is preferable in CRM. In a suite-based approach,
    a single vendor''s system is installed to solve the total of the implementing
    company''s CRM-specific business requirements. By contrast, in a best-of-breed
    approach, multiple applications from multiple vendors are used to better fit the
    business requirements. Such applications could include call-center applications,
    sales force automation, and analytics. As the discussion of this issue continues,
    it is important once again to recognize the influence that the ERP revolution
    has on the analyst community.


    The underlying assumption of the ERP revolution was that having a single, fully
    integrated system could manage most, not all, of a company''s accounting and purchasing
    processes would result in net cost savings as a result of reduced inventory levels,
    lower overhead costs, and faster cycle times. To a certain extent the approach
    worked. Despite astronomical costs for implementation, many large corporations
    such as Fujifilm and Chevron reported net savings from the implementation of ERP
    systems.


    It also made for lucrative and interesting work for analyst firms. Companies that
    were founded on MRP strategies, such as AMR Research, suddenly found the movement
    toward ERP generating a lot of business. Let''s not take this for a disparaging
    remark, however. This was indeed an IT revolution.'
