    # The middleware piece


    Although much of this material was covered in Chapter 3 relative to the analyst''s
    view of CRM, a bit of recap is in order relative to middleware integration. Given
    that we suppose a best-of-breed approach to get the most out of CRM initiatives,
    the largest problem that a company is likely to be the face of the integration
    of myriad parts. Most CRM software supports APIs and a limited number of preset
    integration points, usually to large CRM vendors such as Siebel or a major call-center
    such as Nortel or Avaya. This sort of integration is standard, companies increasingly
    looking for an additional layer of integration to make the integration effort
    easier—and less requirement for complex programming.


    Middleware allows disparate legacy and CRM systems to communicate with one another.
    In essence, middleware creates a common communications layer for data between
    these disparate systems. The prominence and importance of much of the data stored
    in mainframe-based and server-based legacy systems, middleware is an important
    standard in brick-and-mortar companies. IBM''s MQ Series and BEA''s MessageQ (which,
    in turn, has been upgraded to its Tuxedo application), dominate the market.


    Companies such as Vitria and Active are attempting to elevate middleware applications
    to include object-level integration in addition to data-level integration, thus
    elevating middleware into a facto backbone. Moving from data orientation to object
    orientation might have some intrinsic benefits, many of the pieces that currently
    require integration are not of an object nature. In other words, data-level integration
    still works.'
