    than 48 hours after their initial request. As indicated in Chapter 1 in the banking
    case study, this expectation is not fully fulfilled.


    Another factor to be considered is the quality of the response in each case. Synchronous
    communication provides the ability to iterate toward the correct definition of
    the customer problem and then toward the ultimate solution. For asynchronous communication,
    unless the associated answer is right the first time, the customer’s satisfaction
    rating will likely take a significant plunge when he or she realizes that at least
    one cycle is required. This is particularly so if the enterprise has failed to
    deliver on the 24-hour response test.


    Nearly every customer has been touched by the reality of poor e-mail response.
