    And, of course, they analyze respondent data because, typically, they have to
    sample customer populations in order to obtain the necessary data required to
    feed into the analysis model. It’s unlikely to exist in a customer database and
    would be too difficult and costly to collect from the entire customer base.


    Indeed, in most developed countries, professional market researchers operate according
    to strict professional guidelines—sometimes self-imposed, sometimes imposed by
    data privacy laws. These guidelines state that survey respondent data should not
    be associated with individual respondents and should not be disclosed to the client.
    Furthermore, researchers are only able to describe types, not individual consumers.
    In an analytical CRM context what we later call Wave 1 analytical CRM tools operate
    only at this aggregate level. Moreover, this aggregate mindset still exists, but
    it’s only a tiny part of what analytical CRM is about. And many of the current
    best-of-breed analytical software tools should be able to make the transition.


    The chapter also discusses the emergence of analytical components that may not
    be directly identifiable as analytical CRM. Rather, these components will perform
    background analytical tasks that work to enhance customer experiences.


