  md: '# 8.2 Departmental and suite-based solutions


    Under the auspices of purchasing a “departmental solution,” many corporations
    purchase software solutions to speed up rather than change internal processes.
    On the surface, this approach to CRM has a great deal of appeal. The departmental
    scale tends to create the illusion that the ticket price is lower for what we
    see are tactical, fix-it-now solutions. With time, the cost of purchasing solutions
    using I''ll term “the departmental method” becomes quite high. The net result
    will be that an enterprise maintains a multitude of solutions that are disparate,
    often difficult to integrate, and possibly underserved.


    Let''s be clear about one point. As much as I for an idealistic world in which
    all software selection is made not only with a company''s strategic objectives
    in mind, but with improvements in brand equity the overriding goal, the current
    tight economy imposes certain realities. As my friends within the analyst community
    have been quick to point out, the economic downturn has caused companies to focus
    increasingly on financial measures—return on investment (ROI), in particular.
    Line managers need quick, financial justification for their purchasing decisions
    and look for low price points and operational cost savings to justify these purchases.
    In some respects this approach favors the departmental method. The individual
    price points for solutions are typically lower; thus, financial justification
    is easier to find.


    Seeking ROI is a reality, however. It can also be a good exercise done correctly;
    still; we must also remember that brand has economic value as well. Senior management
    should insist that all ROI demonstrate an improvement in brand engagement can
    be measured empirically. How does the line manager do this? Or she she ties the
    performance improvements to customer engagement or value. In general, meeting
    or exceeding customer expectations should always be the goal of CRM. It is the
    only thing that will add value to the company and make CRM work.


    Vendors of suite-based solutions such as Siebel, Oracle, and ePiphany have recently
    taken advantage of this argument to push their prospects towards their solutions,
    saying that although the solutions are more expensive to implement initially,
    with time the cost savings that result from ease of integration point components
    will offset the initial cost outlay. It is a seductive argument to be certain
    but one that should be viewed as specious closer investigation.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'The first major problem that some companies run into when using a suite-based
    approach is that the purchase is often mandated as the solution by senior management.
    To be fair, the team is typically reacting to a perceived need for a slab of CRM;
    however, the focus should be on processes, not softare. Suite-based solutions
    that are implemented without the necessary work either speed up poor processes
    or, more likely, don''t actually fit the needs of the implementing organization.
    Consequently, the soft costs associated with making the monolith fit the specific
    needs of the organization tend to outweigh any potential integration savings.
    I have also heard analysts indicate that as many as one in ten suite solutions
    are purchased but not implemented for just this reason.


    The second major problem that companies run into is that the functionality does
    not run deep enough at an individual module level for the company''s needs. To
    go back to our earlier example, if the analytical tools were not deep enough to
    uncover the switching problem within the affluent, incumbent customer group, the
    opportunity to proactively address the problem with a marketing campaign would
    have been lost.


    The final problem is actually a bit ironic: Ease of functional modules is often
    a key selling point. While integration savings can certainly be realized over
    poorly cobbled departmental solutions or point products, the implementing company
    often faces a huge challenge in terms of integrating with legacy applications.
    As I''ve indicated throughout the book, so-called operational legacy systems are
    generally the lifeblood of large enterprises. Given that most organizations are
    unable and unwilling to replace them, effective CRM requires knowledge of historical
    transactions and total customer value, among other things. In short, a suite-based
    solution is incapable of becoming a total CRM backbone.


    # 8.3 Fit-for-purpose approach


    If, we aren''t selecting departmental solutions and we aren''t selecting suite-based
    solutions, what do we select? In general, the enterprise—particularly if it is
    large and distributed—will get the best value from enterprise-class, best-of-breed
    solutions. These solutions are those that excel in the functional benefits they
    provide within their class. For instance, Pegasus provides an excellent, rules-based
    workflow tool which can, where appropriate, provide great benefit to an organization
    that needs to automate complicated customerfocused processes (e.g., insurance
    claims). Similarly, RiskClick has a robust collaborative tool for insurance intermediaries,
    ensuring seamless'
