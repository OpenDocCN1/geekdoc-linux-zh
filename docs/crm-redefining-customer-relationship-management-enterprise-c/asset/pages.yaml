  md: '# 6.8 And DCM?


    The latest acronym to do the rounds and attempt to topple CRM''s position at the
    top of the list of annoying three letter acronyms is DCM (demand chain management).
    While the acronym is irritating, it is unlikely to catch on, which is some relief
    at least. However, I believe the concept is worth mentioning in the context of
    this chapter because it pays due regard to the importance of integration.


    One of the reasons that CRM, as an acronym and discipline is being challenged
    relates to the fact that CRM has, in many organizations, failed to deliver. This
    was discussed earlier in the book.


    Demand chain management (DCM) has been defined by companies such as Pivotal and
    market pundits such as Gary Lemke''¹ analogous to supply chain management. What
    does this mean?


    Supply chain management (SCM) is about organizing the flow of product, or components,
    embracing areas such as materials control, inventory, and logistics. SCM systems
    and processes have been put in place to reduce waste and increase corporate efficiency.
    For most organizations that have pursued SCM, the results have been good. Best
    practice in terms of supply chain management is well understood, and many manufacturing
    companies have reaped the rewards.


    It is well recognized that getting supply and inventory right is only if sustained
    demand for products is in place. Therefore, it follows that putting in place processes
    to ensure sustained and relevant demand will result in substantial improvements
    in corporate performance.


    As Gary Lemke puts it, “So what is the difference between DCM and CRM²” Personally,
    I like the term demand chain management because it highlights two elements that
    CRM underplays: integration with the overall business (back office/front office),
    and a broader and more business-oriented emphasis on customer demand. I must say,
    I agree. I am not sure that the new acronym helps or that CRM should not be all
    that he proposes DCM


    +   1. G. Lemke, "Demand Chain Management, The New CRM," Customer Support Management
    Magazine, September 2001.'
