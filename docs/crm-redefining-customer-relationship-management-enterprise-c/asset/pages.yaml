    # 2.4 Connected contact center?


    Later in the book I discuss the importance of integration—and the potential that
    Web services, portal technology, and middleware present that need to get disparate
    data to key CRM knowledge workers. However, in the context of this discussion
    the key point is that CRM technology has paid insufficient attention to facilitating
    communication between customers and vendors because it has paid lip service to
    the sharing of information within the organization. Why should this be?


    Some of the reasons I have alluded to—the transitory nature of call-center staff
    and their relatively low status—account for this. However, there are other reasons.
