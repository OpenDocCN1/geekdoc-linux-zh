  md: '# Preface xiii


    acronym. However, because CRM is the choice of vendors, consultants, and analysts,
    it''s the one that will be used throughout this book.


    The change that''s happening in CRM is coming about for a variety of reasons,
    all of which will be articulated in the chapters that follow. Large companies
    are driving CRM in new directions, making central systems support ubiquitous systems
    such as Web sites and distributed customer support operations. Now, more open,
    standards for connecting applications make best-of-breed CRM tools much more attractive.
    Marketing concepts are being embraced by CRM as mass marketing and direct marketing
    lose their grip on marketing budgets. And CRM, as a discipline, extends its influence
    beyond customer care and into front-office and backoffice.


    More important than all of these trends is a growing realization that technologies
    could ostensibly be described as CRM in the past just don''t cut it any longer.
    Automatic Call Distribution (ACD) technology that simply gets in the way of interpersonal
    communications is not acceptable. This change has come about of a desire to turn
    tried and trusted principles of customer care that used to be followed before
    centralization caused businesses with local community resources to get rid of
    them in the name of progress.


    As our society has moved away from local communities to global brands and centralized
    services, we have, at the same time, lost the very structures that used to stand
    for excellence of service. Think back, not so far. It used to be that local people
    from the community provided business services. Bank managers made decisions on
    lending. Insurance reps used to call door to door. Households of life''s essentials
    used to be much more commonplace before car ownership became ubiquitous.


    Early efforts at CRM attempted to put in place what got lost. Costs were reduced,
    but so was any sense of involvement. Therefore, customer loyalty diminished.


    Community-focused business was based on four key tenets: knowledge, reciprocity,
    easy communications, and local context. Early attempts at CRM didn''t ever come
    close. Let''s have a closer look at these four tenets.


    +   1. Community-focused businesses had a unique wealth of local knowledge. This
    knowledge was tacit, meaning that it was difficult for outsiders to tap into.
    However, tacit knowledge was typically passed on in family-run businesses. Traditional
    on-the-job'
  merge: -1
  pgno: 2
- img_proc: true
  md: 'training systems also ensured that knowledge (along with standards of customer
    care) was shared. Customers benefited in terms of more approachable, dependable
    local services delivered by people who were known within the local community.


    +   2. Reciprocity. It''s a simple fact that in small communities a supplier often
    cannot afford to damage a customer relationship, because news travels fast. In
    addition, customers may themselves be influencers of other customer relationships.
    Therefore, the concept of unscrupulous supplier does not hold in a small community,
    because the consequences, in terms of reciprocal action, will be rapid and severe.
    Road rage is unknown in rural villages but is common in urban metropolises.


    +   3. Easy communications. Where two parties to a complex transaction are close
    at hand and know each other, the likelihood that both will be in tune rapidly.
    Deals can be suggested and concluded almost immediately. When parties are distant
    and unknown to each other, third parties as lawyers and agents may have to be
    involved, adding cost, complexity, and excuses for disaffection.


    +   4. Local context. Local suppliers have a better view of what the local community
    might need. Village stores are quite competent at putting out the most appropriate
    merchandise at the most appropriate time of the year. Appropriateness of offering
    depends on local, community-focused knowledge.


    Modern customer service organizations are rarely part of the local community in
    terms of serving that community''s needs (even if they are local employers). Rather,
    we tend to assume that if we need any type of customer service, we will be involved
    in an arm''s-length transaction.


    Modern service organizations realize this, of course. Phrases from CRM bab very
    obviously pertain to this lost community focus. We, as practitioners, talk about
    restoring customer intimacy. How can a customer relationship be intimate when
    the customer is one of a million and whose method of engaging is via a telephone
    or a Web browser? This book discusses CRM concepts and debates whether current
    received wisdom in CRM is appropriate.


    Before launching the reader into Chapter 1, where a revised definition of CRM
    is offered (recognizing the central importance of effective communication in creating
    profitable relationships between both parties to a relationship), it may be worth
    revisiting the four tenets outlined previously. Would it'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'be appropriate in developing CRM processes, procedures, and information systems
    to reestablish those four tenets? I hope this book is successful in presenting
    a case for responding with a simple, unfaltering, and resounding “yes.”


    Herein lies a unifying theory of CRM. Central to this unifying theory is the simple
    concept of service and brand coming together. This is discussed in much greater
    detail in later chapters of the book. However, I can understand why such an idea
    could make typical IT managers and others responsible for defining CRM processes
    a little uncomfortable.


    Potentially, it also makes other groups within the corporate body a little uncomfortable
    too. If a brand falls within the scope of CRM, then the shake-up required in terms
    of typical business functions is radical, even revolutionary. In front, customer
    support, sales, marketing, and all of those so-called front-office functions need
    to coalesce. There cannot be demarcations between disciplines any, because the
    divisions and demarcations political structures mitigate against effective CRM
    processes.


    The obverse of this, is the fact that the CRM function itself becomes one superfunction
    with multiple facets. Some facets will be marketing-like, others support-like.
    But the more CRM provides unifying glue, the more appropriate customer processes
    will become.


    From a technology point of view there are two main consequences. On the one hand,
    so-called CRM suites will diminish in importance because they do not provide the
    unifying approach that is required. At this time, no single software vendor can
    provide all the key CRM components. Nor will any vendor be able to. In large companies,
    in particular, legacy data are critical. As we move forward, the provision of
    just-in-time applications or information will cause monolithic and internalized
    CRM strategies to be born. CRM intermediaries—process outsourcers—will grow in
    importance. Relationship aggregators—channels to market that know how to develop
    strong, lasting customer relationships.


    The unifying glue will increasingly be provided through the Web services model,
    although traditional operational systems will continue to play a role in a manner
    that only the Web services model can allow. In Chapter 4, an argument is put forward
    for this. Integration is the new mantra. Increasingly, hard-coded applications
    will be replaced by unifying CRM connectivity. From a technology perspective,
    XML and other open connectivity architectures and toolkits will grow in importance
    in the'
