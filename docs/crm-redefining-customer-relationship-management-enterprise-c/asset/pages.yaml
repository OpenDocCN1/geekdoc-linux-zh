  md: '# 1.3 What''s all about?


    An example can explain this better. Many professional bodies and charities offer
    "affinity" credit cards. The credit cards are issued by a variety of banks that
    print the cards with the branding and color scheme of the charity. The charities
    are paid a small percentage of each transaction incurred by charities (or people
    who just want to feel good about themselves, regardless of their motives) who
    obtain these affinity cards. However, it soon becomes clear to affinity cardholders
    that their relationship with the issuing bank is limited. The bank supplies the
    monthly statements and receives payments from the cardholders.


    Separately, the bank may direct-mail a low-interest credit card offer to the customer
    who holds an affinity card with the bank. This low-cost card may look like a more
    attractive proposition to the affinity cardholder, who may choose to close the
    affinity card account in favor of a low-interest credit card from the same bank.
    The charity loses. The bank loses because it treated customer communications and
    marketing as exclusively activities. But, ironically, the customer gains at a
    personal level but not at an ethical level. The degree of engagement and bonding
    with the brand will also have been weakened, the bank has persuaded the customer
    to switch cards on the basis of cost saving than for higher-order brand values.
    The customer may be more satisfied, with the customer potential lifetime value
    with the brand will have diminished. This concept of brand engagement is also
    discussed at length in Chapters 6 through 10.


    Understanding the interplay between customer-facing communications and various
    departments within an organization is one of the greatest challenges in modern
    business. It is at the heart of customer relationship management and unites a
    variety of CRM disciplines. The process is discussed in considerable detail in
    this book. However, getting the process of communication and exchange appropriately
    pitched for the customer is what makes the relationship with the customer profitable—the
    final element of our definition. Why? Because the intention is to make communication
    relevant, informative, and appropriate in a manner that adds value to the relationship.
    Inappropriate communication is waste that results in no value. In a best-practice
    CRM environment, all communication is appropriately pitched and relevant because
    CRM is about closing the loop—constantly checking that the nature of engagement
    is appropriate and that the customer continues to connect with the brand. It is
    also about ensuring that disconnection with the brand is anticipated.'
  merge: -1
