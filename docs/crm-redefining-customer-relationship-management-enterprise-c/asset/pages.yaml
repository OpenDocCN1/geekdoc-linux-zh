    # 2.3.1 The contact center and product marketing


    The relationship between product marketing and the contact center is one that
    is invariably overlooked. Most product marketing staff in many comp-anie have
    never visited the contact center—never having a synergistic relationship with
    it. Or rather with them, the contact-center staff. These people have day-to-day
    customer contact and know at first hand the defi-ciencies of the product portfolio,
    errors in technical documentation, or prod-features that need to be amended. In
    few companies are formal methods for the product marketing staff to update contact-center
    staff on new product releases or to elicit feature requests or product changes
    from such.


    # 2.3.2 External experts


    Contact center staff are often the last to receive critical information about
    the company. Even if this information is provided, however, there will often be
    instances where outside experts (i.e., outside the contact center) need to be
    involved to answer a customer query. However, mechanisms for eliciting help from
    external experts are often absent. Often, call-center staff are not even enabled
    with e-mail so that they can poll other employees. It is remarkable that the front-line
    staff in an organization—people who deal with customer queries constantly—typically
    have no means of directly engaging with fellow employees who can address customer
    issues.


    # 2.3.3 Customer data


    It''s a fact. Often, the call-center is an island, cut off from all key sources
    of customer information. As a result, contact-center staff cannot retrieve the
    key information required to deal with a customer query.


    Many organizations establish standardized middleware platforms for the exchange
    of corporate information, but the middleware mysteriously stops at the door to
    the contact center. After all, who give some student''s'
