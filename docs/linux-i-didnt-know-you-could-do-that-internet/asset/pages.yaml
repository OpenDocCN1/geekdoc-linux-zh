    Save your updated /etc/xittab file and exit your text editor. That''s all

    there is to it. Next time you restart Linux, you will go directly to run level
    5

    and the graphical login.


    A simpler way to configure the graphical login screen is if you''re running Red

    Hat 6 is to use the LinuxConf utility (under System on the Gnome main

    menu). Within LinuxConf, choose the Configuration ➤ boot mode ➤ Mode

    section to view a dialog where you can select a graphical mode or text mode.


    If you''re using KDE as your desktop, you can also use the KDE version of\xdm,
    called kdm. This program is configured graphically within a section of

    KDE Control Center (under the Applications tab).


    By setting the Linux run level to graphical mode as described in this section,

    all users on the system start automatically in graphical mode. If you

    just want to have the graphical mode launched automatically after you log

    in a text-mode prompt, you can add the start command to one of your

    initialization scripts (such as .profile in your home directory), as

    described in the next section.'
