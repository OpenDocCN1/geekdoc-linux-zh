  md: '# Sniff Out At-Risk Passwords Using hardcrack


    > NOTE Many password-cracking programs are available on the Internet. The hardcrack
    program described here is just one example of the tools available to those seeking
    to break into your system.


    A single valid login account to your system can provide a gateway for a cracker
    (a malicious hacker) to exploit other security holes and gain additional access.
    As a system administrator, you can use hardcrack to see if users on your system
    are using short or easily guessed passwords, then warn them to update their passwords.


    Many sources recommend using special characters in passwords, such as numbers
    and punctuation marks. These make it harder to guess the password right off, but
    they do not make it more difficult for a password-cracking program like hardcrack.
    Length is the real key to password security.


    The author of hardcrack recommends using at least seven letters in a password.
    The README file shows that it takes the following amount of time to crack a password
    of various lengths on a slow (100MHz) Pentium system.


    | 3 letters | 1 minute |

    | 4 letters | 1 hour |

    | 5 letters | 3 days |

    | 6 letters | 190 days |

    | 7 letters | 30 years |

    | 8 letters | Hundreds of years |


    Of course, much faster machines are standard these days, so the time needed to
    discover each of the above password lengths is usually less.


    The hardcrack program is located on the CD in Binaries/System Tools/hardcrack.
    It works by default on the /etc/passwd file of your system. If you want to check
    the password of a given user account, use that account name like this:


    ```

    # hardcrack -1 username

    ```'
