  md: '# Automate Your Entire System


    Remember the old days of using DOS AUTOEXEC, BAT files and Windows folders? This
    section describes how to do the same sort of thing with Linux. You can automatically
    start in graphics mode, run programs, set system variables, or do anything else
    you choose.


    Some additional functionality for automatically running programs is dependent
    on your graphical environment (such as KDE or Gnome). Those features aren''t discussed
    in this section.


    # 15 Start Automatically in Graphics Mode


    The latest Linux products make it so easy to configure the graphical Window System
    that you might never see a character console again (unless you choose to).


    For older systems where you have to log in and then start the graphical system,
    Linux provides a simple way to jump right to a graphical log in screen, so you
    never have to log in character mode. Avoiding character mode can be a benefit
    for several reasons, as such:


    +   * If you always log in and start the X Windows System, going to X automatically
    saves you some time when you boot your system.


    +   * If you install or manage Linux systems for users who are nervous about entering
    character-mode commands, you can configure Linux so they never see character mode
    again.


    Linux has several modes of operation, called run levels. The standard character
    mode that Linux starts with level 3. By switching Linux to run level 5, you always
    stay in graphics mode. Typical run levels in Linux are shown in the following
    table (some Linux distributions may use variations of this numbering, but the
    arrangement shown here is fairly standard and applies to Red Hat 6).'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# START AUTOMATICALLY IN GRAPHICS MODE


    | RUN LEVEL | DESCRIPTION |

    |---|---|

    | 0 | System is halted. |

    | 1 | Single-user mode, used by the system administrator for maintenance. |

    | 2 | Multiserver mode without networking. Not often used. |

    | 3 | Standard multiuser mode with networking active. |

    | 4 | Not defined. |

    | 5 | Like run level 3 uses the graphical X Window System interface. |

    | 6 | Reboots the system (shuts down all system services). |


    Before you can run level 5, you must have the XWindow System working already.
    If you use KDE, Gnome, fwwm, or other graphical window managers or desktops, you''re
    ready to run level 5.


    Switching to run level 5 is easy. Just execute this command while logged in as
    root:


    ```

    # init 5

    ```


    After a few seconds, the xdm graphical login prompt appears, and you can enter
    your username and password to start using your session. When you log out of your
    XWindow graphical session, you return to the graphical login screen; you never
    return to the character-mode unless you execute this command within a graphical
    terminal window:


    ```

    # init 3

    ```


    Having tested run level 5 with the init command, you can now make it the default
    on your system so every time you start Linux, it begins with a graphical login
    prompt. To run level 5 the default, you must edit the text file /etc/initab while
    logged in as root.


    In the /etc/initab file, you should locate a line that looks like this one (usually
    one of the first noncomment lines in the file):


    ```

    id:3:initdefault:

    ```


    ![](img/ba933c244f3be8993f8191427d25c74c_70_0.png)'
  merge: -1
