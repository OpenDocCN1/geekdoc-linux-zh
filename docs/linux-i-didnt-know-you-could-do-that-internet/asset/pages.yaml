    # 23 Run Your Windows Applications on Linux


    If the native Linux applications described so far in this part don''t meet all
    your needs, try running your existing Windows applications on Linux using some
    of the tools described in this section. The results are not optimal, but they
    can fill a gap between running on a Windows machine and getting the native Linux
    applications that you need.


    # Run Old Windows Apps with Wabi


    Years ago, before Java arrived, SunSoft created a Windows emulator called Wabi.
    It was available for Solaris and other UNIX platforms. Eventually, Caldera purchased
    rights to Wabi and ported it to Linux. With Wabi, Caldera was able to run all
    the popular Windows applications, including Lotus, MS Office, WordPerfect, Quicken,
    and so forth.


    Unfortunately, this was in the days of Windows 3.1. When Java arrived, Sun lost
    interest in Wabi, and without support for 32-bit applications, so did everyone
    else. Caldera stopped selling the product and cannot release it because Sun still
    owns it.


    The upshot of all is that if you need to run 16-bit Windows applications on Linux,
    Wabi is a great solution, if you can find a copy of it somewhere. Asking around
    Linux newsgroups or checking with long-time Linux resellers are two good options
    to try.


    # Run New Windows Apps with WINE


    Although Wabi was a great commercial effort in its time, the WINE project continues
    to develop Windows compatibility code for 32-bit applications.


