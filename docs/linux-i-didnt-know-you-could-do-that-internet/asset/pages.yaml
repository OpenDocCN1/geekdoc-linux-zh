    # # 49 Add Redundant Disk Arrays to Linux


    One of the best ways to protect against disk failures on critical systems is to
    use an array of redundant hard disks. The common term for this is RAID—Redundant
    Arrays of Inexpensive Disks. The inexpensive term is relative. Compared to mainframe-style
    hardware, anything you use for your PC is expensive. If a system is worth protecting
    with a RAID disk system, however, don''t take needless risks by using low quality
    hard disks and cables when you set it up.


    Linux can easily support hardware RAID devices that make an array of disks appear
    as a single device to the operating system. For Linux, would be a single physical
    device, such as /dev/sd0, the first SCSI drive. Such hardware RAID systems often
    provide hot-swapping, allowing you to remove and replace a defective disk with
    a new one, never shutting the power off the subsystem (or to your Linux system).


    The problem with these dedicated RAID systems is that they can be prohibitively
    expensive. With the latest releases of Linux, software-based RAID is supported.
    By using Software-RAID, you can configure your RAID disks in just the way you
    want them, giving you a lot of flexibility and saving a lot of money. The catch
    is that you must learn more about your disks and the Linux system in order to
    make it all work (and especially to take care of any problems that arise).


    This section describes in general terms how Software-RAID works on Linux. When
    you''re ready to learn more, visit the RAID home Web page for the latest information:
    http://linux.org/raid.html. Software RAID support in Linux is difficult to use;
    the documentation states that "is best attempted by experienced system administrators."
    I mention it here because it''s getting easier all the the time and it''s a very
    powerful feature of Linux that few people seem to know about.'
  merge: -1
