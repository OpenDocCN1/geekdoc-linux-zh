  md: '# Host Multiple Web Sites on One Server


    Apache has the ability to serve multiple domains (or hosts) as if they were coming
    from separate Web servers. For example, you might have one copy of Apache responding
    to requests for http://www.booksahoy.com and http://www.childdrensorner.com, or
    whatever domain names your Web sites are using. Apache can serve documents for
    as many of these virtual hosts as you can keep track of.


    Two types of virtual hosting are possible:


    +   - IP-based, in which your computer has more than one IP address assigned to
    it (using IP aliasing or multiple network cards). Each domain name is associated
    with one IP address.


    +   - Name-based, in which all domain names come to your single IP address but
    are interpreted by Apache httpd.conf (the main Apache configuration file, located
    in the /etc/httpd/conf directory on Red Hat 6) apply to the default Web site,
    or the one that is associated with the hostname of your Linux server itself.


    You can configure your name server (using DNS) to send requests for several domains
    to your Linux system. Just have the administrator of your DNS server set up another
    domain name that points to your IP address.


    When a browser connects to your Web server, it does so on your IP address. The
    information that the browser sends to the Web server, however, includes a line
    stating what domain name is requested. If you''re using name-based virtual hosting
    and the browser doesn''t include this information, Apache can''t tell which virtual
    host to use, since the IP address alone doesn''t contain this information. In
    these cases, Apache usually uses either the default (nonvirtual host) document
    root or the first virtual host.


    Once you have your DNS server set up so that requests for multiple domains arrive
    at your Linux Web server, set up a virtual host in your'
