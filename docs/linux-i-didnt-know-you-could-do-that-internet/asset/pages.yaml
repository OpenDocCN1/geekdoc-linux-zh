    Sniff.0.3.5 is up and running.... (192.168.100.3)

    Packet ID (from_IP:port-to_IP:port): 192.168.100.3-80-

    192.168.100.2.2793


    Throughout the books are scattered Notes, which are generally as about the subject
    at hand, and Warnings, which caution you when you need to be extra careful about
    performing an action.'
