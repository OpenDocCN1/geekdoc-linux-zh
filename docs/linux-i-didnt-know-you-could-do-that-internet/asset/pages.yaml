  md: 'Depending on how you have your CD mounted, you may need to copy a binary file
    to your hard disk before you can run it. Check the options in your /etc/fstab
    for information. Once you''ve copied the hard disk, be sure it has the execute
    bit set use the chmod a+x filename if needed.


    If you are having trouble getting a package to work, the best course of action
    is to contact the author of the individual software program. An e-mail address
    and Web page are generally provided in the README file for an individual package.


    # System Requirements


    The software on the CD has been tested on Red Hat 6 Linux but will run on other
    systems (in many cases the source code must be recompiled to programs on non-Red
    Hat systems). Software packages generally require few resources require from 50KB
    to 10+MB of hard disk space. Many (but not all) require a graphical system such
    as Gnome, KDE, or another Linux graphical window manager. A few specialized tools
    interface with a PalmPilot or special audio hardware. These are noted in the text.


