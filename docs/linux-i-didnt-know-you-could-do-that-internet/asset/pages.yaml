  md: '# INTRODUCTION xiii


    For detailed information about a package, browse the documentation that comes
    with that package. A long README file on the CD includes a list of all packages
    on the CD with a short description. A few technical may help help along the way:


    +   - The packages on the CD were tested with a Red Hat 6 installation. The rpm-list.txt
    file on the CD shows what was installed on your test system.


    +   - Depending on how you have your CD mounted, you may need to copy a binary
    file to your hard disk before you can run it. Check the options in /etc/stab for
    information. Once you copied the file to your hard disk, be sure it has the execute
    bit set (the command chmod +x filename if needed).


    +   - The binary files (executables) may not work on other Linux systems like
    Calder OpenLinux. Slackware, or Suse because each system is configured differently.
    To use the CD programs on other Linux systems, you will probably need to compile
    the source code. Instructions are included in the main README file on the CD,
    with specifics included in each program archive, but basically it amounts to using
    these three commands:

    ```

    ./configure

    make

    make install

    ```


    +   - If you need to work with source code, you''ll need some additional packages
    installed on your Linux system from your original Linux CD. These packages provide
    programming tools. They include the word devel. For example, you probably have
    the qt package installed already. If you want to compile source code, you need
    the qt-devel as well.


    +   - I cant get all these packages working on your particular system. Too many
    variables exist, and it would be impossible for me to know the source code for
    the many programs included to be able to diagnose problems. If you''re having
    trouble, the best course of action is to contact the author of the individual
    software program. An e-mail address and Web page are generally provided in the
    README file for each package.'
  merge: -1
  pgno: 14
