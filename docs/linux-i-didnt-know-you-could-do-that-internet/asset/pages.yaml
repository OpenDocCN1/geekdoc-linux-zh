    boots and uses the LILO boot manager, you could make changes that will prevent
    Linux from booting.


    The KLILO utility is located at /Binaries/Desktop/klilo on the CD. Although this
    program does not include configuration of all possible LILO features (such as
    passwords, boot parameters, and message text), it is easy to review and update
