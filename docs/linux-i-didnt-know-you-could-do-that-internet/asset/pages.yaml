  md: '# Turn Linux into a Web Server


    One of the most popular uses of Linux is as a Web server. In fact, almost any
    Linux product you will install and run a copy of Apache automatically. And Apache
    is the most popular Web server in the world, with nearly 50 percent of the market
    (if we can call it a market, when Apache is free). For details on the strength
    of Apache and survey statistics, visit NetCraft at http://www.netcraft.com.


    Having a Web server installed and running, however, is not the same as having
    all the power of the Web at your fingertips. Apache can do many things that are
    not part of a default configuration. This part describes some of the software
    you can add to Apache itself or use on your Web server to enhance Apache''s functionality,
    gather additional statistical information, or prepare Apache to be used for high-traffic
    and high-security Web sites.


    In case you don''t have the latest version of Apache on your system, the source
    code for version 1.3.6 is included on the CD at /Source/apache/server.


    To learn more about Apache, visit the Web site of the Apache Project at http://www.apache.org,
    or take a look at the magazine Apache Week, which includes many useful articles
    and a searchable database of issues, at http://www.apacheweek.com.


    ![](img/ba933c244f3be8993f8191427d25c74c_165_0.png)


    # 30 Extend Apache with Modules


    One of the most important developments in Web server software was creating a CGI
    script to use modules in Apache. When a Web page runs a script to process a form
    or prepare a custom HTML page, the Linux system requires some overhead (CPU time
    and memory) to start and manage that script as a separate program. In addition,
