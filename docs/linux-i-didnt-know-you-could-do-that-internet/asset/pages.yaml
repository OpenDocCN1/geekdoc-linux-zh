  md: '# Disaster-Proof Your System


    I don''t want to be a pessimist, but the saying goes that there are two types
    of people: those who have had a hard disk failure and those who will have a hard
    disk failure. Now that your Linux system is loaded down with new toys and utilities,
    you should think about how to protect it from the inevitable disaster that will
    strike your PC.


    This part describes some tools and procedures you can use to safeguard the valuable
    information on your Linux system, and it covers some basics about backing up your
    system and creating a rescue disk. But it also describes some of the more advanced
    disaster-proofing tools, such as how to set up RAID (redundant hard disks) and
    connect an uninter-ruptible power supply to your Linux system.


    If you''re an experienced system administrator, you may note the folly of the
    term disaster-proof. Even so, the more preparations you make, the more trouble
    you can withstand and still come off the hero instead of the scapegoat.


    # Back Up Critical Files


    Backing up a computer system is like buying insurance: no one wants to do it,
    but everyone eventually regrets it if they don''t. Many full-featured backup utilities
    are included with Linux distributions or available from third-party software vendors.


    The best backup utilities let you do things like


    +   * Back up multiple remote systems from a single location

    * Back up data to devices (such as CD writers or tape drives) anywhere on your
    network

    * Configure incremental backups (on only new or modified files) and full backups
    at specific time intervals

    * Help you track the physical backup media in case you need to restore something

    * Allow you to restore only certain files, based on multiple criteria

    * Do all this in an intuitive (perhaps graphical) environment'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# BACK UP CRITICAL FILES 249


    Be certain to check the hardware compatibility list on your Linux vendor''s Web
    site before purchasing a backup device such as a tape drive or writeable CD. Not
    all devices are supported by Linux—Universal Serial Bus (USB) devices and Winmodems
    cannot be used with Linux. Once you get a backup device configured, some of the
    commercial backup tools you can use on Linux


    +   - ARKEIA, a centralized backup/restore/archiving solution for heterogeneous
    networks (see http://www.knox-software.com/)

    - BRU Backup and Restore Utility (see http://www.estinc.com)

    - Ctar, a powerful commercial backup program (see http://www.unitrends.com)

    - Lone-Tar, a tape backup software package from Lone Star (see http://www.cactus.com)


    A complete backup solution is often included with Linux products. An example is
    the BRU package that is included with Caldera OpenLinux integrated with the default
    KDE Application menu (see Figure 46.1).


    Figure 46.1 BRU is a commercial backup utility included with some versions of
    Linux.


    ![](img/ba933c244f3be8993f8191427d25c74c_264_0.png)'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Use tar for Simple Backups


    Linux has the inherent networking power to make many of these backup features
    easy to implement. In fact, once you become familiar with basic Linux utilities,
    you can do a lot of quality system backup without resorting to additional third-party
    programs.


    The tar utility is a simple way to archive files to a separate device, such as
    a tape backup or floppy disk, or to another file (which should be located on a
    separate or remote hard disk).


    You have probably been using tar throughout this book to unpack the archives stored
    on the CD. It''s very easy to use tar to create your own archives.


    For example, suppose you want to back up all the files in your /home-directory.
    This would include the home directories for all users on your system. (You must
    be logged in root to access these files to perform a backup). Using the tar command,
    all of the files in /home are stored in a compressed file called home_archive.tgz
    (TGZ is a standard extension for a compressed archive).


    ```

    # tar cvfz home_archive.tgz /home

    ```


    Each of the options in this example is described in the following table:


    | TAR OPTION | DESCRIPTION |

    | --- | --- |

    | c | Creates a new archive |

    | v | Verbose mode |

    | f | Indicates the name of the archive file to operate on |

    | z | Compresses the tar archive using gzip |


    Note that the options used with tar don''t have to include the hyphen that precedes
    options used with most Linux commands.


    Other options allow flexibility of where tar stores your archive file. For example,
    if you use the name of a device instead of a filename, you can store the archive
    directly to a floppy disk, tape drive, or writable CD-ROM drive:


    ```

    # tar cvfz /dev/fd0 /home

    ```'
  merge: -1
  pgno: 265
- img_proc: true
  md: '```

    # tar cvfz /dev/tape /home

    ```


    ```

    # tar cvfz /dev/cdrom /home

    ```


    If your /home directory is a little large to fit on a single floppy disk, use
    the M option to scan multiple volumes. The tar command will prompt you to insert
    another disk as each is filled. (You might check the size of the /home directory
    with the du command to see if you have enough disks—and patience—for this operation.)


    ```

    # tar cvfzM /dev/fd0 /home

    ```


    When using tar to create an archive file, the last part of the command indicates
    what to include in the archive. If you just want to combine three large files
    for convenient storage and they''ve already been compressed into a tar archive,
    use this command (note the absence of the z option because the files have already
    been compressed in this example):


    ```

    # tar cvf bigarchive.tar file1.gz file2.gz file3.gz

    ```


    This design of tar allows to use convenient methods of backing up your data.


    Suppose that you''ve backed up your server hard disk. A lot of work has been done
    then, but only a fraction of the files on the disk have changed. First, you can
    use the command to see a list of all the files that have changed (based on the
    last modified date field for the file) in the previous seven days:


    ```

    # find -mtime -7 -type f -print

    ```


    The list of files is printed on your screen. Because these files have been recently
    modified, they are the ones you want to back up. By combining the list from the
    find command with the tar command, you can create an archive that includes only
    the modified files. Two methods for here:


    ```

    # tar cvfz update06-07-99.tgz ''find -mtime -7 -type f -print''

    # find -mtime -7 -type f >filelist; tar cvfz update0607-99.tgz ''cat filename''

    ```


    Both of these commands make use of a feature of the Linux shell (command line).
    By placing a command between single back quotes, that command is executed, and
    the output of it is placed at that point in the command line.


    The first command executes the find command. The file list that find produces
    is located in the last position of the tar command, so those files are


    ![](img/ba933c244f3be8993f8191427d25c74c_266_0.png)'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'archived. In the second command example, the find command is executed and the
    results are written to a file calledA. A second command on the same line, separated
    by a semicolon; uses the single back quote to cat (dump) the contents of the file
    list at the correct location tar to use the list of files.


    Either method will work—use whichever you feel comfortable with. By using other
    options of the find command, you can back up files that a certain user has created
    or that have other characteristics. You can also use the file list generated by
    the find command as part of other Linux commands.


    # Back Up System Configuration Data


    In case of a system crash, you may want to access some of the more critical system
    configuration data before worrying about restoring users'' directories and other
    daily working files.


    Most of the configuration data for a Linux system is stored in the /etc directory.
    Information in this directory can be critical when you''re trying to rebuild your
    system because it includes things as


    +   - The inittab file, which is used by the core in startup process

    - The startup scripts (in the rc.d subdirectory) that control what varies to start
    at boot time

    - The user database and password files

    - Information about kernel modules used on the system (such as the conf.modules
    file on Red Hat 6 or the modules directory on other distributions)

    - The lilo.conf file, which may control how your system boots (and show you how
    different partitions are used)

    - The sysconfig and network-scripts subdirectories, which contain your networking
    configuration

    - The X configuration file

    - Configuration information for other key services such as Samba, HTTP, and FTP
    servers'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'If your Linux server is acting as a DNS server, Web server, or something similar,
    additional configuration files for those servers are stored in locations such
    as /var/named or /usr/httpd, but these additional files are not critical to getting
    your system up and running.


    To back up your /etc directory, use this command:


    +   - tar cvfz etc_backup.tgz /etc


    Then store the etc_backup.tgz file on a separate system or floppy disk. Remember,
    that the /etc directory contains highly sensitive security information, such as
    encrypted passwords for all users. Be careful where you store the backup file.


    You can use the procedure in the section below. "Restoring Files from a tar Archive,"
    to extract a single file from the /etc archive if necessary or to restore the
    entire directory after reinstalling your Linux system.


    # # Automate Backups


    Earlier in this book, Number 17, "Run Any Program Any Time," we discussed using
    the cron command for repetitive tasks. Backing up your system is the perfect example
    of why to use cron. Once you determine the commands (and related find or other
    commands) that you need to successfully implement a backup policy, you can use
    cron to execute those commands while you''re away from the office.


    For example, if you create a text file with these lines in it and hand it over
    to cron as described in Number 17, your entire system will be backed every Sunday
    morning at 3 A.M. An incremental backup will also be done every night at 11:30.
    The list of files backed up is stored to an index file for your review next morning.


    +   - 0 0 * * * tar cvfz weekly echo $DATE.tgz > /root/nightly_index.txt


    +   - 30 11 * * * tar cvfz update echo $DATE.tgz > find -mtime -7 -type f -print
    > /root/nightly_index.txt


    # # Restoring Files From a tar Archive


    The critical part of having backed up your files is restoring them when the system
    has a crisis. The easy way to do this with tar is to unpack the entire archive
    in the current directory using this command:


    +   - tar xvfz update03-05-99.tgz'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'If you have your archive stored on a device such as a tape drive, the command-
    would be something like


    ```

    # tar xvfz /dev/tape

    ```


    To see a list of files in the archive without extracting them, use a t instead
    of an x:


    ```

    # tar tvfz update03-05-99.tgz

    ```


    With the list of files included in the tar archive, you can extract a single file
    that has become corrupted or lost. Use the extract command, x, with the full path
    name of the file you want to extract. For example, if the output of the t option
    shows a file named etc/initab, you can use this command to extract only that file
    into the /etc directory:


    ```

    # tar xvfz etc_backup.tgz /initab

    ```


    If you don''t use the full path name, the file will not be located in the tar
    archive.


    # 47 Boot Linux in Emergencies


    The more or serious problems you can have with Linux is not being able to boot
    your system. This can happen because of a hard disk crash, problems installing
    a new version of Linux or the LILO boot loader, or even a minute corruption of
    key areas of your disk.


    In these cases, you need to boot your system into Linux so you can diagnose and
    correct the problem.


    Most distributions have a rescue disk image that you can copy from your CD or
    Web site. Using this disk, you can boot your system, access your Linux partition,
    and use a basic set of utilities to fix whatever problems have occurred.


    As an example, the Red Hat 6 CD includes images for a boot disk and a rescue disk.
    You can''t rescue mode directly from the bootable Red Hat CD, but you can create
    a set of boot and rescue disks before problems'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# BOOT LINUX IN EMERGENCIES 255


    occur, keep them in a safe place, and use them if a hardware problem or misconfiguration
    makes your system unusable.


    To create these disks, follow these steps, using two blank formatted 3½ inch disks.
    You''ll probably need to be logged in as root to use this procedure.


    +   1. Mount your Red Hat 6 Linux CD number 1.


    ```

    # mount /mnt/cdrom

    ```


    +   2. Insert a blank, formatted disk in your floppy drive.


    +   3. Change to the directory where images are stored on the Red Hat CD.


    ```

    # cd /mnt/cdrom/images

    ```


    +   4. Use the dd command to dump the boot disk image to the floppy (this command
    takes several minutes to reformat and write to the floppy disk):


    ```

    # dd if=boot.img of=/dev/fd0 bs=72k

    ```


    +   5. Remove the boot disk and label it appropriately.


    +   6. Insert a second blank formatted disk.


    +   7. Use the dd command again to dump the rescue disk image to the floppy:


    ```

    # dd if=rescue.img of=/dev/fd0 bs=72k

    ```


    +   8. Remove the rescue disk and label it.


    If a problem occurs, boot your system from the boot disk and then use the rescue
    disk when prompted to enter rescue mode. Remember, the time to make these disks
    is before your system has a problem and you are unable to make them!


    Other Linux distributions have similar features. Check the documentation for your
    Linux package to learn more.


