    Every operating system has strengths and weaknesses; hence, you choose different
    tools for different tasks. More and more, however, I seem to be choosing Linux
    for just about everything. In this part, you''ll learn how to use features that
    come with Linux that allow it to connect to your NetWare and Windows NT servers
