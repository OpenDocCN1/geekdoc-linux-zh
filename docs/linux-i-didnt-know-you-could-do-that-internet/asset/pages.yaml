  md: '# 104


    WINE is a large, complex program, and not all Windows programs will start up in
    WINE, much less run correctly. However, a growing number of applications function
    passably, and WINE developers continue to work at improving WINE so that it can
    run additional applications. Despite the complexity of the package, WINE is as
    easy to compile and run as any other Linux application. Once compiled, running
    a Windows program in Linux is as easy as using a command like this:


    ```

    $ wine sol.exe

    ```


    To learn about the WINE project, visit their Web site at http://www.winehq.com.


    # Run Linux and Windows with VMware


    Beyond tools that attempt to emulate Windows functionality as a Linux process
    like Wabi and WINE, you can use a virtual machine emulator to actually run native
    Windows on Linux, including Windows 98 or Windows NT.


    The program that provides this functionality is VMware, a commercial product for
    Linux. You can download a 30-day trial of VMware from http://www.vmware.com. This
    impressive program lets you run multiple operating systems at the same time on
    a single computer, using native applications from each operating system.'
