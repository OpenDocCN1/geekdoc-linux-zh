    or NT server, your Linux system will appear just like another Windows client,


    # 38 Clone a Windows NT Server on Linux


    The ability to have your Linux server appear to others on your network as if it
    were a Windows NT server can make it much easier for others to accept that you
    are using Linux—because they won''t know that you are.


    Using the Samba server and its associated utilities, Linux will appear to other
    Windows systems (95, 98, 2000, and NT) as if it were just another Windows system.
    Your Linux computer appears in the Windows Network Neighborhood windows, you can
    share files and printers, maintain user password security, define shares, and
    so.


    The Samba server is a project aimed at making the SMB protocol that is used by
    Windows available on many other systems so they can all share resources. Currently
    Samba is available on dozens of Unix systems in addition to Linux. All of these
    systems can share files and printers with each other and with "real" Windows systems.
    You can learn more about the Samba project and read more detailed documentation
    about the information in this section by visiting the Samba organization''s Web
    site at http://www.samba.org Mirror sites are located worldwide.


    Running a Samba server on Linux has a distinct advantage over using a real Windows
    NT server: Linux rarely crashes. Others on your network may not know that the
    Windows NT server that provides file and print sharing is'
