  md: '# Use Linux as a Business Server


    When you set up a Linux system in an office environment, you may need a special
    set of tools to make it into a business server. These might include things like
    financial tools, virus scanners for incoming e-mail, and software to create a
    fax server on Linux. This part describes these Linux tools, of which are are free
