  md: '# 92 MAKE YOUR LINUX SYSTEM A DESKTOP OS


    +   * A basic (nonrelational) database

    * StarBasic programming to customize all parts of the system


    A special tool called an Autopilot helps you create new documents in areas, and
    access to Internet resources is tightly integrated into the other features. For
    example, when you view a Web page with a browser, you can immediately save that
    page and begin to edit it as you would any other StarOffice document. (See Figure
    21.2).


    FIGURE 21.2 StarOffice includes many integrated features, accessible from a single
