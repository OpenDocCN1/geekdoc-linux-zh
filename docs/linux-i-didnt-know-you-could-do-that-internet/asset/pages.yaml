  md: '# Make Apache a Proxy Server


    A proxy server provides security for Web requests leaving your network. Rather
    than having every person on your local network actually connect to Web servers
    all over the world, they can connect to a proxy server, which receives their requests
    and forwards each one as if it came from the proxy server. When a response arrives,
    the proxy server returns the information to the client browser.


    Using a proxy server provides several advantages over having everyone on your
    network connect directly to outside Web sites:


    +   * The proxy server can cache frequently accessed pages, saving network bandwidth
    when many people access the same sites.


    +   * The proxy server can be configured to block access to external sites or
    restrict access by certain users on the local network. All access can be blocked
    at certain times without adjusting each person''s PC configuration.


    +   * Users inside your network have a harder time creating inadvertent security
    holes because they are connecting to an internal server—rather than an external
    Web server.


    +   * Outgoing network bandwidth is managed from a single location.


    With all of these advantages, many organizations use a proxy server to allow employees
    to browse the Web. One of the most popular proxy server programs is called Squid.


    The Squid proxy is highly configurable. Because it provides services for outgoing
    Web requests, it is sometimes run on a separate computer from the Apache server
    that handles incoming requests. This isn''t necessary, but it can make security
    a little easier to manage. Squid is included in the CD at /Source/Apache/server.


    Apache itself, however, can also be used as a full-featured proxy server. While
    it may seem strange at first, Apache can serve Web pages for your organization
    at the same time it retrieves Web pages for browsers on your network. How does
    this work?


    ![](img/ba933c244f3be8993f8191427d25c74c_175_0.png)'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# MAKE APACHE A PROXY SERVER 161


    If you use a feature of Apache called mod_proxy, you can configure browsers in
    your organization to point to the Apache server as a proxy for HTTP requests.
    When a request arrives at the Apache server that is marked as proxy; Apache forwards
    the request to another server (after checking that your configuration allows access).
    When the reply comes back from the remote Web server, Apache returns the document
    to the browser as if it came from the internal Web server.


    mod_proxy is not installed by default when you use Apache, but it is included
    with the standard package of Apache source code, so you can recompile Apache and
    begin using mod_proxy immediately. (The Apache source code package is located
    on the CD at /Source/apache/).


    Why use a combined Web server and proxy server with Apache? A few good reasons


    +   - When you are confident about your skills in setting up Apache configuration,
    it''s much easier to maintain one program than two.

    - Security concerns are reduced by only needing to track updates for one program.

    - Squid is popular and proven, but Apache still has a larger user base testing
    it and more developers working on it, and it''s probably a more stable program.


    Once you have mod_proxy set up on your Apache server, you can enable it with a
    single Apache configuration directive in httpd.conf:


    If you use some of the other features of the Apache proxy module, read about these
    additional directives in your Apache documentation (or visit a site like http://www.apacheweek.org
    and search for articles on "proxy"). Each directive in the following table is
    shown as an example with a description of what the example will accomplish. Complete
    syntax information provided on the Apache Web site at http://www.apache.org/docs/mod/mod_proxy.html.
    Other configuration options are available (besides those listed here—see the Apache
    Web site) to help make your Apache proxy server efficient, reliable, and secure.


    | PROXY DIRECTIVE EXAMPLE | DESCRIPTION OF RESULTS |

    |---|---|

    | ProxyBlock espn | Blocks access from your network to any Web site with the string
    "espn" in the URL. (Isn''t that cruel?) |


    ![](img/ba933c244f3be8993f8191427d25c74c_176_0.png)'
