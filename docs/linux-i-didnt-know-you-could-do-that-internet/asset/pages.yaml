- img_proc: true
  md: '# 76 SPICE YOUR DESKTOP


    FIGURE 19.1 Kfstab helps you set up your file system table with all the appropriate
    options.


    ![](img/ba933c244f3be8993f8191427d25c74c_91_0.png)


    You can alter the configuration for how your file system will be mounted on your
    system by changing any of the fields in the main Kfstab window. When you want
    to define a new file system, change all of the fields, starting with the device
    name and mount point, click the Add button.


    The Kfstab utility is simply acting as an editor for the /etc/fstab file, it makes
    it easier to see all the available options (click Preferences next to the Options
    field) and so forth. When you have made needed changes, click the Save button
    to update your /etc/fstab configuration file. Remember that the file systems are
    not accessed directly via the Kfstab program: this utility just helps you define
    the file system table that other programs use to automount devices such as floppies,
    CDs, and even remote NFS servers.


    If you have the kdu or kdf utilities installed on your KDE system, they are made
    available via the Tools menu. These utilities can be used to see the free space
    and disk devices mounted on your system, as well as the space used by a directory.


