    # Play Chess


    The ultimate strategy game is chess. Linux has supported the gnuchess basic engine
    chess from the beginning, but now a graphical interface is available to make that
    powerful program more interesting on your desktop.


    To play a graphical game in Linux, you need two packages: gnuchess, which is the
    engine for the game, and xboard, which provides the interface. These packages
    are often included in standard Linux distributions. In case you don''t have them,
    both packages are included (in rpm format) in the directory /Binaries/Games/chess
    over the CD. Use these commands to install them:


    ```

    # rpm -Uvh /cdrom/mnt/Binaries/Games/chess/xboard-4.0.03

    .1386.rpm

    # rpm -Uvh /cdrom/mnt/Binaries/Games/chess/gnuchess-4.0.p1793

    .1386.rpm

    ```


    After installing these packages, start a game of chess with this command:


    ```

    $ xboard

    ```


    The chessboard appears, as shown in Figure 25.1, which depicts a very sorry game
    of chess.


    By default, the computer plays black, so you get the first move. Don''t be fooled,
    however. The computer will win more often than not unless you''re a very good
    player (or you make the computer dumb).


    To make a move, click and drag your mouse on one of the white chess pieces and
    drop it on a new square. The computer responds immediately for the first couple
    of moves, then more slowly as the game progresses. A timer above the board counts
    down for the player whose turn it is. features:


    +   - Illegal moves are not allowed (see the message box below the timers) unless
    you choose Options  ➤ Test Legality and uncheck this feature.


    +   - Standard chess notation is used to show moves in the message window.


    ![](img/ba933c244f3be8993f8191427d25c74c_133_0.png)'
  merge: -1
