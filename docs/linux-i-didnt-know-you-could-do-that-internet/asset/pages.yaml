    Capturing traffic generates a lot of data. If you want to store that data to a
    file, called savedavata in this example, use a redirection symbol:


    ```

    # sniffit -d 192.168.100.103 > savedavata

    ```


    To see packets coming from this IP address but only those that specify a certain
    TCP port (normally associated with a protocol, such as 80 for the web), use this
    command:


    ```

    # sniffit -d p 80 -s 192.168.100.103 > savedavata

    ```


    Changing from d to a changes the numeric (hex) dump to ASCII, so you can actually
    see the data flowing across the network:


    ```

    # sniffit -a p 80 -s 192.168.100.103 > savedavata

