  md: '# 45 Share Information


    Computers provide many methods of communication, though the most common for most
    people is e-mail. An Internet system that can be very useful for person-to-person
    communication is the Talk protocol. Talk is like an IRC chat room. When you know
    that a person is logged in to the network, you initiate a talk session by requesting
    a connection. After the connection is established, "talk" by typing in messages
    that are communicated in real-time to the other person.


    Several programs for using Talk are available for Linux. Gtalk and Ktalk (for
    KDE, as you''ve probably guessed) are both included on the CD at /Source/Business.


    Ktalk is a graphical program that features


    +   - An address book


    +   - A command to test how fast the connection is


    +   - Buffered output to avoid blocking other activity when you have a slow network
    connection


    +   - Text manipulation, including word-wrap as you type, and copy/paste from
    other windows


    +   - The ability to transfer a file to the person you are talking with by-dragging
    an icon from a file manager (kfm) window


    Talk can use the Talk1kd daemon to establish connections or the standard talkd
    daemon that Linux always includes. If you use Talk1kd, a message dialog box appears
    when you are receiving a message (that is, someone is trying to contact you).
    You can answer the message to establish a connection or ignore the dialog box.


    Another "talking" utility is Speakfree. This program enables you to hold a voice
    conversation over the Internet, just like Internet Phone products that are now
    for sale around the world. The quality of the voice and the speed that you can
    talk is determined by how much throughput your connection provides, but if your
    connection isn''t fast enough for a regular conversation, several forms of data
    compression are available to help out. Encryption using DES, IDEA or PGP is also
    supported.


    ![](img/ba933c244f3be8993f8191427d25c74c_257_0.png)'
  merge: -1
