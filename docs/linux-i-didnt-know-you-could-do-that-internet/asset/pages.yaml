    # Download a Cross-Platform Office Clone: StarOffice


    Another complete commercial office suite for StarOffice, created by StarDivision
    in Hamburg, Germany, which was recently purchased by Sun Microsystems. StarOffice
    is an attempt to clone Microsoft Office in functionality, look, and feel, then
    to go beyond it to add additional features and Internet integration.


    StarOffice can be downloaded for free on the Internet for personal use, though
    we are not permitted to include it on the CD. Visit http://www.stardivision.com
    to register yourself and download the StarOffice package.


    The real power of StarOffice lies in two elements: First, it is a cross-platform
    solution. You can run an identical version of StarOffice on Windows, Linux, Solaris,
    OS/2, and other platforms. Second, StarOffice integrates all sorts of features
    into a common “desktop” from which you can start new documents, embed and share
    files, and access all types of Internet resources.


    The features of the latest release of StarOffice include the following, all accessible
    from a single window:


    +   * Text documents (word processing)

    * Spreadsheet

    * HTML document creation

    * Web page browsing on the Internet

    * E-mail (creating and receiving)

    * Presentation graphics

    * Vector-based drawing

    * Bitmapped drawing

    * A daily planner/organizer (similar to Outlook)

    * Access to FTP and newsgroup sites


