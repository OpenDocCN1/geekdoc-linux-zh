  md: '# Spice Up Your Desktop


    With the growing sophistication of KDE and Gnome desktops, users of Linux are
    becoming accustomed to the power of a full-featured GUI. Still, the desktop you
    download or install by default on Linux doesn''t include all the tools and toys
    that you want.


    This part describes some slick add-ons for KDE and Gnome that you can integrate
    with your desktop, such as attractive tools and practical utilities. The focus
    in this part isn''t on system administration, however—it''s on adding features
    to your desktop that you didn''t know were possible to add.


    If you don''t have a copy of KDE or Gnome installed on your Linux system, look
    on the CD under /Binaries/KDE1.1 or /Binaries/Gnome and get the software you need.
    It are provided in several formats and for several Linux distributions. If you''re
    running Red Hat 6 you can choose to install KDE as part of the Gnome desktop used
    by Red Hat. When you do this, a menu item labeled KDE includes most of the standard-kde
    options.


    To switch to the KDE desktop completely within Red Hat 6 so that you aren''t using
    Gnome at all, run the program swichtdesk-kde. If you decide to build some of the
    programs described in this part from source code (though that''s rarely necessary),
    you should also install the qt-devel package from your Red Hat 6 CD.


    # 18 Personal Productivity Tools and Toys


    This section describes specialized programs to help you get the job done. Serious
    productivity programs like financial managers, special databases, and Internet
    searching tools have been slow in coming to Linux, but there are some really impressive
    ones here.


    Also included in this section are productivity applications that enable you to
    appear busy while you''re actually doing something that isn''t in your job description,
    such as checking the weather or cataloging your video collection.


    ![](img/ba933c244f3be8993f8191427d25c74c_81_0.png)'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Manage Your Finances and Track Your Stock Portfolio


    Several tools are available for Linux to help you manage all those stocks you
    bought last year. Stock tracking and management, personal finance (checkout tracker),
    and other financial tools are all available.


    The Gnome portfolio manager uses the Yahoo! stock quote service to help you track
    a selected portfolio of stocks. You use the Update button to update all the stock
    prices, then use the Chart button to see a graphical display of how your portfolio
    is performing. Features include multiple-portfolio support and symbol lookup.
    The program was designed to replace the Java-based portfolio manager provided
    by Yahoo! Finance.


    The Gnome portfolio manager (gnome-pm) is located at /Binaries/Desktop/gnome-pm
    on the CD. You must have Gnome installed to use it.


    If you use Quicken to maintain your check, you should look at Gnofin, a Gnome-based
