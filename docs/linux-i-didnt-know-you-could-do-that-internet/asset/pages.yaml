    * Viewing a NetWare print queue

    * Deleting a job from a print queue


    Note that all of these functions are client-oriented. A complete set of server-side
    server utilities is included with the NetWare for Linux server product.


    To get the NetWare client, go to the Caldera Systems Web page at http://www.calderasystems.com/products/
    and begin to download the NetWare for Linux server. Part of that package is the
    NetWare client. After registering, you can choose to download only the NetWare
    client portion.


    ![](img/ba933c244f3be8993f8191427d25c74c_239_0.png)


    As with the NetWare server, a free version of the NetWare client is available.
