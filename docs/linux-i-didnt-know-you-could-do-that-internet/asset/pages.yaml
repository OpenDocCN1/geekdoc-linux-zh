  md: '# MONITOR SYSTEM LOGS FOR TROUBLE 257


    The Log Scanner program is in the best Unix and Linux tradition: it can do wonderful
    things... if you can set up the text configuration file and know a little Perl
    programming.


    The Log Scanner is a Perl script that works with the TCP wrappers package (a tool
    that checks network connections are allowed based on their service, location,
    etc.). Using Log Scanner, a system administrator can define anomalies to what
    is in the system log file. A contact person is also defined so that when an anomaly
    is detected, an e-mail can be sent as notification.


    A configuration file, Rules.cfg, is stored in the /etc/lscan directory. (As a
    starting point, you can copy the default Rules.cfg file from the lscan subdirectory
    where you have unpacked the logscanner archive.) The configuration file can be
    edited and extended to define what to look for in system log files. Though I''ve
    implied that the configuration format is cryptic, a quick look at the sample rules
    provided with Log Scanner demonstrates how useful it can be in watching for problems
    with your network and Linux system:


    ```

    #:badsu:"month/day time Bad su ... source tried to become

    ^user on host many times.

    #:rootnetlen:"month/day time Somebody from source tried to

    telnet to "host as root.\n#:rootftp:"month/day time Somebody from source tried
    to ftp

    to "host as root.\n#:badtelnets:"month/day time User from source had too many

    failed telnets into "user)."

    #:badftps:"month/day time User from source had too many

    failed fps into "host (user)."

    ```


    The Log Scanner is included in the /Binaries/Business directory on the CD.

    A similar program to the Log Scanner is Log Watch. This program also lets you
    configure items to watch for in your log files, Log Watch is a C program rather
    than a Perl script. Detailed configuration information is stored in the /etc/log_directory.
    Sample configuration files, documentation, man pages, and so forth are all included
    with the Log Watch program.


    Log Watch is on the CD at /Binaries/Business. It is in rpm format and can be installed
    using this command:


    ```

    # rpm -Uhv /mnt/cdrom/Binaries/Business/logwatch-1_6_4-1_noarch.rpm

    ```


