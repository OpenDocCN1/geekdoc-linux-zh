  md: '# SUPPLY UNINTERRUPTED POWER TO LINUX 261


    Because a device that provides even a few minutes of battery-powered power can
    cost several hundred dollars, most businesses don''t choose to go far beyond this
    measure of power backup.


    When you use a UPS on your Linux system, you can use the utilities described in
    this section to control your Linux system based on signals from your UPS device.


    Modern UPS devices are connected to both your wall socket and the serial port
    of your computer. When the UPS detects that the power has been cut, a signal is
    sent to the serial port on your PC. By using a program that intercepts the signal
    and controls your Linux system, you can leave Linux unattended and gracefully
    shut down the system in the event of a power failure. Three standard signals are
    sent to the serial port by a UPS (this list converts the signals to English):


    +   - The power has failed, begin a graceful shutdown.


    +   - The power has failed and I''m about out of battery life, shut down quickly.


    +   - The power has been restored, there''s no need to shut down.


    To use a UPS on Linux, you need a program to receive and act on these serial port
    UPS signals and a configuration that instructs your PC how to behave. Before you
    buy a UPS, try to determine from the manufacturer whether or not it includes Linux
    support (or they''ve used it on a Linux system). Generally speaking, if you can
    get the specifications for which pins on the serial cable are used to indicate
    a power failure, you can easily configure the Linux software to act on the UPS
    signals.


    The init process is the program that starts all other programs when your Linux
    system is booted. A configuration file called /etc/initabb is used to control
    its actions. Part of that file looks like this:


    ```

    pf::power:/sbin/shutdown -h +5 "Power Failure; System

    Shutting Down"


    # If battery is fading fast -- we hurry...

    p1::powerfailnow:/sbin/shutdown -c 2 >/dev/null

    p2::powerfailnow:/sbin/shutdown -h now "Battery Low...",


    # If power was restored before the shutdown kicked in,

    cancel it.

    ```


    ![](img/ba933c244f3be8993f8191427d25c74c_276_0.png)'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'po:12345:powerokwait:/sbin/shutdown -c ''Power Restored;

    Shutdown Cancelled''


    You can edit these lines in /etc/inittab to change what happens when the UPS detects
    a power failure. You can even write a script that performs many different tasks
    and launch that script from the initab file.


    Several daemons are available that can manage the signals received by the UPS
    and issue the signals that the init program uses to start a system shutdown. Some
    of these daemons are


    +   - power

    - bpower

    - upsd


    The more commonly used daemons, powerd and bpower, are included on the CD at /Source/System
    Tools.


    One of the most popular brands of UPS devices is APC. A comprehensive Web page
    with instructions for making an APC UPS device work Linux is available at http://www.brisse.dk/site/apcupsd/.
    The APC device uses the apcupsd daemon, which is included on the CD at /Source/System
    Tools.


    APC power devices can also use the apcmwitch utility (located at /Source/System
    Tools). This utility allows you to set individual usernames and passwords for
    each outlet on an APC MasterSwitch via a CGI interface.


    Another source for commercial UPS support on Linux is the LaneSafe III UPS Power
    Management package from Exide Electronics (see http://www.exide.com).


