  md: '# Integrate SMB into Your Linux File System


    Although graphical tools can make it easier to access files on an SMB server,
    you can also use other Samba utilities to completely integrate the SMB file server
    with your Linux system.


    If you''ve used the mount command before, you know that you might access a remote
    file system behave like part of your root file system. For example, when you use
    this command


    ```

    # mount /mnt/cdrom

    ```


    you can go to the /mnt/cdrom directory and access the contents of your CD-ROM
    drive as if they were just another of your file system.


    More complete mount are sometimes required, depending on how your system is set
    up. For example, you might access remote NFS file server using a command like
    this:


    ```

    # -t nfs sundance:/home/nwells /mnt/sundance

    ```


    This command indicates the type of remote file system, the server and path, and
    the locate path to use as a mount point (an access point). Of course, you must
    have permission to access the sundance server via NFS.


    NFS works well for sharing files across Unix systems; with the Samba suite available
    on many platforms, SMB is a good solution for almost all file sharing across platforms.
    The Samba suite of utilities includes a package called smbfs, for the SMB file
    system. Using this package, you can mount remote SMB file systems just as you
    do remote NFS file systems or local file devices


    To use the smbfs features, you must have this package included on your system
    (it is usually included when you prepare the Samba server). You must also have
    support for the SMB file system loaded into your kernel. Support may be built
    in, or it may be included as a loadable module. If smbfs support is included as
    a loadable module, the following command


    ```

    $ lsmod | grep smbfs

    sbfs60

    ```


    If you''re not certain that support for SMB file systems is available on your
    Linux system, enter the following command to attempt to load support into your
    kernel as a module.


    ```

    $ insmod smbfs

    ```'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# ACCESS WINDOWS NT SERVERS FROM LINUX 219


    Now you''re ready to use the special mounting command to integrate an SMB file
    system into your Linux directory structure. The command is very similar to the
    smbclient command, but it may require additional parameters.


    ```

    $ smbount //sundance/c /mnt/sundance -U nwells

    Password:

    ```


    As with smbclient, enter the password for your account on the SMB server. If this
    command is successful, you can use the cd command to go to the mount point that
    you found (/mnt/sundance in the example) and begin accessing the remote SMB file
    system as if it were part of your local file system.


    In some cases, additional parameters may be required to make smbount (or even
    smbclient) function properly. For example, you may see a message that states "my
    hostname too long as netbios name." In this case, you can add your client''s hostname
    to the command like this:


    ```

    $ smbount //sundance/c /mnt/sundance -U nwells brighten

    ```


    The pages for smbclient and smbount are included with the Samba package you install
    from the CD.


    Once you have used the smbount command successfully, you can use all of the standard
    Linux tools to work with the files on the SMB server (as long as you have permission
    to perform the operation you want to perform). Figure 39.2 shows a standard KDE
    file window open to a Windows 98 file system that was mounted using smbount.


    Figure 39.2 SMB file servers can be accessed via Linux utilities after mounting
    with smbount.


