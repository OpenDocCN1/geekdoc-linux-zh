    # Try the OpenSoundSystem


    If you''re really interested in using sound features on Linux, consider trying
    the OpenSoundSystem. This is a commercial sound-driver package for Linux that
    includes an easy-to-use menu-based configuration utility and support for many
    different sound devices.


    You can download an evaluation copy of this product from the 4Front Technologies
    Web site at http://www.opensound.com. The download is free after you enter some
    personal information. This project and very supportive of Linux—new drivers are
    released for Linux. The company also sponsors the xmms project, which is described
    in Number 29, "Create a Linux-Based Music Studio."


    # 27 Make Linux Your Personal Video Player


