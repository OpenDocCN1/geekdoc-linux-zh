    # 37 Enhance Your Network Security


    In the first few parts of this book, you learned about tools to show how your
    network is being used. In this part, you''ll discover some tools to monitor and
    enhance your network security. Most network security revolves around a few basic
    concepts. The trouble is that system administrators prefer to hope that no one
    will bother their systems. More often than not, this is a vain hope. By learning
    a few concepts and implementing one or two security measures, you can greatly
    increase the security of your network.


    You''re probably familiar with IP addresses and domain names. To reach a distant
    computer on the Internet (or even a local IP-based network), your computer sends
    a data packet with the IP address of your system and the IP address of the system
    you want to communicate with. Routers may pass the packet to other networks to
    reach its final destination.


    Before these IP addresses can be used for the network packet, the domain name
    that you normally enter (as www.yahoo.com) must be converted to an IP address
    either by using a static file on your Linux system or by querying a domain name
    services computer (a DNS server). Converting the domain name to an IP address
    is a separate operation from contacting the server you really want to, but in
    most cases you can''t do the latter without contacting the DNS server first.


    ![](img/ba933c244f3be8993f8191427d25c74c_204_1.png)'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# 190 TURN YOUR SYSTEM INTO A SUPER-SERVER


    The other part of the networking packet that you should know about is the port
    number. Each service on the Internet uses a port number to listen and respond
    to queries. The data packet that contains the IP address of your system and the
    destination system includes the port that your system is connecting from (which
    is chosen from any port available and isn''t important) and the port that you
    want to connect to. The port you connect to the server is where the security concerns
    arise.


    Here are the major steps that occur when you use a Web server—in this example,
    the Sysex server. (This is a bit simplified because several connections may occur
    at the same time, authentication and cookies may come into play, and so forth,
    it illustrates the point well.)


    +   Enter a URL in your browser:


    ```

    http://www.sysex.com/catalog/index.html

    ```


    +   Your browser takes the server name that you entered and sends a request to
    the DNS server that you have configured on your LAN or ISP. You can think of the
    request as something like this


    > "What''s the IP address of www.sysex.com"


    +   With the IP address from the DNS server, your browser establishes a connection
    using a network packet that includes information such as


    +   * Your IP address


    +   * A port number on your system (a fairly random number—whatever is available)


    +   * The IP address of www.sysex.com (which is 206.100.29.83)


    +   * Port 80 (the default for Web servers)


    +   If the Sysex server allows your browser to establish a connection on port
    80, your browser sends this HTTP command over the connection:


    ```

    HTTP/1.1 GET /catalog/index.html

    ```


    +   The Web server responds with the data in the index.html document.'
