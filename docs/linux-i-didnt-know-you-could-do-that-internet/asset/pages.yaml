    # Scan for Network Intruders


    One method that potential intruders use to access your network is attempting to
    connect using different port numbers, hoping that they can discover an access
    point.


    By using the portsentry utility, you can scan the network packets addressed to
    your computer to determine if someone is trying to scan for a connection.


    ![](img/ba933c244f3be8993f8191427d25c74c_206_1.png)


    Portsentry has many useful features, including the ability to automatically blocking
    traffic from someone who appears to be scanning for a security hole. One potential
    disadvantage of portsentry is that you must do a lot of configuration before you
