  md: '# Connect Linux to Your PalmPilot


    With the popularity of the PalmPilot, it was inevitable that someone would decide
    to connect one to their Linux system. Several packages now support a PalmPilot
    connection to Linux. You''ll need to do a little work with the source code to
    get these working, however.


    The first of these packages is pilot-link, a collection of libraries for uploading
    and downloading files between your Linux PC and a PalmPilot. Pilot-link is located
    at /Source/desktop on the CD.


    Once you have pilot-link installed, you can access your PalmPilot via your desktop.
    To synchronize to your PalmPilot from Gnome, try Gnome-Pilot. The interface to
    Gnome-Pilot is shown in Figure 20.1. An administration tool is also under development
    for Gnome to PalmPilot connectivity.


