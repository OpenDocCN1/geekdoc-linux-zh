    If you''re running KDE on a laptop, you need to use the kcmlplot package to control
    your laptop functions directly from KDE. You must have the Advanced Power Management
    (APM) options set in your Linux kernel (so the kernel can access the appropriate
    laptop hardware) to use kcmlplot. For most systems (including Red Hat 6), this
    requires you recompile your Linux kernel. See your Linux documentation for details
    or review the documentation on the CD at /Doc/A11-HOWTO-Docs/Kernel-1-HOWTO.html.


    The kcmlplot package acts as a control panel to manage your battery power and
    configure power-saving features of your laptop.


    The source package (which may be needed for some Linux systems) is located at
    /Source/Desktop on the CD. Kcmlplot requires KDE 1.1 or a later version.'
