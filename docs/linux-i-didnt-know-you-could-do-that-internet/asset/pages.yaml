    | SAMBA UTILITY | DESCRIPTION |

    |---|---|n| addtomcat | Adds a username to the smbpasswd file (follow this by
    using the smbpasswd command to set this password for the user). |

    | nmblookup | Queries for information about a server name using the NetBIOS protocol.
    |

    | smbadduser | Creates an association between a Linux user and a user listed in
    the smbpasswd file (an SMB user); this utility affects the SMB files and is for
    use with name mapping features. |

    | smbprint | Submits a print job to a print queue located on an SMB server. |

    | smbtar | Similar to Linux tar; backs up and restores Windows directories to
    a Linux file (or tape archive). |

    | smtestparm | Examines the contents of the smb.conf configuration file, providing
    messages for any erroneous or potentially error-causing configuration items. |

    | smbstatus | Shows all SMB client connections (when the Linux system is acting
    as an SMB server).


    # 40 Run a NetWare Server on Linux


    In addition to the many Windows servers that you might want to connect from Linux,
    thousands of NetWare servers are used around the world,'
