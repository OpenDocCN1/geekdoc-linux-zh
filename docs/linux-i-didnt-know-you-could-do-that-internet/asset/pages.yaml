  md: '# 34 MANAGE YOUR FILES LIKE A PRO


    special area for deleted files like the Macintosh Trash Can or Windows Recycle
    Bin.


    The good news is that several tools will help you save yourself from disaster
    when you''ve deleted a file that you want to use again.


    # Plan for the Future with safedelete


    If you''d like to play safe when you delete files on Linux, install the safedelete
    package and get in the habit of using it.


    When you use the safedelete command, safedelete automatically compresses the files
    you delete and moves them to a special hidden directory,


    If you discover that you''ve deleted a file that you need to retrieve, you can
    use the undelete command (part of the safedelete package) to retrieve the deleted
    file.


    The safedelete program keeps a log of files that you delete so the undelete command
    can correctly locate them. The files are completely reconstructed because they
    were never actually deleted, just compressed and moved out of your way.


    Because using safedelete regularly will fill your disk with discarded, compressed
    files, safedelete automatically permanently deletes files after a certain number
    of days. You can set up a configuration in your home directory (the file is named
    .safedeleterc) to specify how long files of different types should be saved before
    permanently deleting them.


    The safedelete package is located in Binaries/Disk Tools/safedelete on the CD.
    This package is different than many of the binary packages in the Disk Tools subdirectory.
    No source code is included for safedelete, but when you unpack the archive file,
    a complete set of binary programs (based on the latest Linux library functions:
    glibc) are installed on your Linux system, along documentation and man pages.
    The binaries included:


    +   - safedelete, the main program to safely delete files

    - undelete, which you can use to retrieve deleted files

    - savedelchk, which you can use to check the log and status of all the compressed,
    safely deleted files


    ![](img/ba933c244f3be8993f8191427d25c74c_49_0.png)'
