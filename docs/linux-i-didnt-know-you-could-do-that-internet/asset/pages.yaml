    # View Your Word Files in Linux


    Despite all this talk about alternative office suites and word processors, the
    most-used word processor at the moment remains Microsoft Word, which isn''t available
    for Linux. Many of the word processors described in this part can read and write
    Word files, but this section describes an easier way to access those files.


    Suppose you have received a Word97 file from a colleague. Rather than open a suite
    like StarOffice or ApplisWare, a faster and easier solution is to use the mwordview
    utility to immediately convert the file to HTML so you can view it in your browser.


    Mwordview includes what the author calls "ridiculous number of options" that let
    you customize how fonts are used, interpreted, how graphics are embedded in the
    HTML output, and so forth. Mwordview should be able to handle virtually anything
    that Microsoft creates.


    Although mwordview includes numerous command-line options and supports a complex
    configuration file, none of what is needed to begin using the program. Simply
    use this command:


    ```

    $ mwordview wordfile.doc

    ```


    An HTML file of the same name (wordfile.doc.html, in this example) is created
    instantly. You don''t see any other feedback, but you can open the resulting HTML
    file in your browser.'
