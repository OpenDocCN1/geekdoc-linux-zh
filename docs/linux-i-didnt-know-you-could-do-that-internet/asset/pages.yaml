  md: '# RUN A NETWARE SERVER ON LINUX


    most often for file and print sharing. You can connect to these with Linux

    as well.


    # Use NetWare for Linux


    Years ago, Novell had a product called NetWare for Unix. This product was

    licensed to the major Unix vendors such as IBM, Hewlett-Packard, Digital,

    and so forth, that they could provide a NetWare server on their Unix sys-

    tems. In this environment, the NetWare server ran as a standard Unix pro-\cess,
    though it required some special handling to provide a NetWare file

    system on top of a Unix file system.


    Caldera Systems recently licensed NetWare 4.1 from Novell and ported it to

    Linux. Now you can run a real NetWare server on Linux—and none of the

    clients on your network will be able to tell that it''s not a standard Net 4

    server. Features of NetWare for Linux include


    ![](img/ba933c244f3be8993f8191427d25c74c_236_0.png)


    +   - NetWare 4.10b-compatible file services

    - Seamless access from Windows 95, Windows 3.1, DOS, Linux,

    Macintosh, and UnixWare clients

    - The ability to forward NetWare print jobs to Linux-hosted printers

    (requires the client program discussed in the next section)

    - Fully capable NDS server (version 611)

    - Streams updates to the Linux kernel


    The NetWare for Linux product is commercial software, licensed from

    Novell, so it''s not included on the CD. You can, however, download a free

    copy from the Caldera Systems Web at http://www.calderasystems

    .products/. You must provide some information about yourself to

    complete the download. The download version is complete, including sev-

    eral thousands pages of Novell documentation, updated to reflect the Linux

    platform. The only catch is that the product only supports three users

    (unless you purchase additional licenses).


    If you like using NetWare for Linux, you can purchase (online, if you wish)

    additional user licenses to extend your copy of NetWare for Linux. A CD-ROM

    can also be ordered if you don''t want to download the large program files.


    NetWare for Linux is a fully-featured server product, but like NetWare

    Unix, it doesn''t allow you to load NetWare NLMs. File system performance'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 222 CLONE WINDOWS NT


    will also be reduced compared to a native NetWare server running on the same hardware
    because of the emulation used within the Linux file system.

    nThe major benefits of using NetWare for Linux include the following:


    +   * Only one computer is needed to act as a file and print server as well as
    an application server.

    * Integration of Linux-based Internet connectivity with NetWare clients is seamless
    because NetWare for Linux uses native IP/SPX protocols.

    * Linux poses no reduction in stability compared to a native NetWare server.

    * In a network with existing NetWare servers, NetWare for Linux makes it easier
    to integrate Linux into the existing environment.

    * In future releases of Novell products, adding NDS to Linux will make system
    administration of a Linux PC possible through the distributed NDS resource database.


    All of these benefits assume, course, that you''re not trying to learn how administer
    both NetWare and Linux from scratch. If you only know one of these two powerful
    complex systems, you should probably stick with that.


    # Use a Free NCP Server


    NetWare for Linux is a commercial product. A free version of an NCP file and print
    server is also available. This program is called mars-nwe.

    Although mars-nwe is intended to be a Linux replacement for a NetWare file server,
    it falls a bit short. In particular, unlike the NetWare for Linux product, mars-nwe
    is a bindery-only product—no NDS support is provided.

    Overall, the mars-nwe project does not seem to have the momentum behind it many
    of the more impressive developments (such as Apache, WINE, and the KDE and Gnome
    desktops).


    The mars-nwe server source is included in /Source/NetWare; I recommend, however,
    that you download the NetWare for Linux product and give that a try instead.


    ![](img/ba933c244f3be8993f8191427d25c74c_237_0.png)'
