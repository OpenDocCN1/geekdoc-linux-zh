  md: '# Fine-Tune Your Apache Configuration


    The copy of Apache that comes installed by default on your Linux system is probably
    great for viewing online documentation and serving a few personal or Web pages,
    but Apache is capable of much more. However, the default configuration used by
    most Linux vendors isn''t designed to support the next amazon.com site. This section
    lists tips for tuning Apache for better performance.


    # Support Massive Web Traffic


    Apache running on a fast system can easily fill 10MB of outgoing bandwidth (see
    http://www.minecraft.com for a few survey details.), but this isn''t enough for
    many busy Web servers. In these cases, you can use multiple parallel servers,
    but you also want to get the most performance you can out of each server.


    Limits on Apache can be related to either the operating system that an Apache
    is running on, or to the configuration of Apache and its modules. Some keys to
    improving the performance of your Web site are provided in this section.


    When you start Apache, that process begins receiving Web requests on the network,
    but it doesn''t respond to them itself. Instead, it starts other copies of Apache
    responding to the requests, each of Apache being controlled by the master copy
    that was started first.


    In order to handle thousands or millions of requests in a day, you can adjust
    the following directives to control how many copies of Apache are used and how
    they behave. To use the higher values suggested in this list, you should have
    a powerful server (dual-Pentium II 450 with 256MB is a good starting place).


    MinSparseServers is the number of copies of Apache that is always running. Set
    this number higher if your Web traffic is irregular ("spiky") so that spare servers
    are always available to handle sudden'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 164 TURN LINUX INTO A WEB SERVER


    bursts of traffic. A default value of 5 might be increased to 25 for a busy server.


    MaxSparseServer This is the maximum number of copies of Apache that will be started
    on your system. This imposes a limit on the resources used by Apache as it tries
    to handle all incoming requests. Each additional server uses about 1MB of memory.
    A busy server may have this directive set to 100.


    MaxClients This is the maximum number of distinct clients that can connect to
    the Web server (to all copies of Apache). Each client can have multiple simultaneous
    requests, but once this limit is reached, each client requesting a document will
    be put on hold until Apache has finished handling requests for one of the current
    clients. The value of this directive may be set to 256 or 368. You should also
    check the HD_SERVER_LIMIT in the httpd.conf file to update how much traffic Apache
    will allow. This prevents Apache from crashing your system when it runs out of
    resources.


    MaxRequestsPerChild This is the maximum number of requests that a copy of Apache
    will handle before closing and another copy of Apache is started to replace it.
    This is done to prevent a long-running copy of Apache from causing problems because
    of system memory leaks. On Linux, where memory leaks are not a problem, set this
    directive to 0 to avoid the overhead of killing and restarting processes on a
    busy server.


    SendBufferSize This is the size of the TCP buffer used for sending data. If you
    have a fast connection to the Internet (such as a T3 line), setting this value
    higher than the default will improve your Web server.


    HostnameLookups By setting this directive to Off, Apache will log the IP address
    of incoming requests rather than the domain. This saves a lot of time for each
    request. Apache includes tools to update log files by looking up hostnames "offline"
    so you''re not using your Web server capacity.


    With few fine-tuned directives, the most time-consuming part of servicing a Web
    request is running the scripts and server-side programs that are needed to prepare
    a dynamic HTML page. To increase your throughput, try these techniques:


    +   * If your scripts are written in Perl, Python, or tcl, one of the modules
    mentioned in the last section (especially mod_per_1) that builds a'
