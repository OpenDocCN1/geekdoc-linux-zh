  md: '# 166 TURN LINUX INTO A WEB SERVER


    # 33 Track Your Web Site Traffic


    Each time browser accesses your Web site, an event is logged to the Apache access
    log. On Red Hat 6 systems, this file is /etc/httpd/logs/access_log. The location
    may vary on other Linux systems but the filename is generally consistent. The
    information in the access log includes the IP address of the client browser, the
    date and time of the request, and the HTTP command (which includes the filename
    requested).


    Even on a site without much traffic, the access log has a lot of data. On larger
    sites, it must be rotated regularly (daily or weekly) to avoid filling the hard
    disk with a record of Web pages accesses. A few lines from the access log might
    look like this:


    ```

    192.168.100.4 - [25/Mar/1999:15:16:53 -0700] GET

    / HTTP/1.0 - 200 1879

    192.168.100.4 - [25/Mar/1999:15:16:55 -0700] GET

    /head.gif HTTP/1.0 - 200 17446

    192.168.100.4 - [25/Mar/1999:15:16:55 -0700] GET

    /mmback.gif HTTP/1.0 - 404 204

    192.168.100.3 - [25/Mar/1999:15:17:06 -0700] GET

    / HTTP/1.0 - 200 1879

    192.168.100.2 - [01/Jun/1999:21:06:03 -0600] GET

    /01.html HTTP/1.0 - 200 11254

    192.168.100.2 - [01/Jun/1999:21:06:18 -0600] GET

    /02.chm.html HTTP/1.0 - 200 187091

    ```


    The contents of the Apache log can be configured using the CustomLog and LogFormat
    directives, but the previous lines show the Common Log Format (CLF), which is
    used by default on Apache and most other web servers. Several Apache modules let
    you log other information as well.


    Having all this information recorded is valuable for several reasons, such as
    tracking who is accessing your site and which pages are most popular. The information
    isn''t easy to use in its raw format as shown here, but many tools are available
    to process this data and report about it in summary form'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# TRACK YOUR WEB SITE TRAFFIC 167


