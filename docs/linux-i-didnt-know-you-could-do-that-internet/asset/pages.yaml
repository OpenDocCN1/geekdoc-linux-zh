  md: '# # 11 Keep Your Disk Resources in Constant View


    When you have a large or busy Linux system, disk space can disappear rapidly.
    A common way to display your available disk space is to use the df utility. The
    results of df would look something like this:


    | Filesystem Used Available Capacity Mounted |

    | /dev/hda4 | 956173 | 80414 | 102670 | 89% | / |

    | /dev/hda3 | 1018329 | 644689 | 321028 | 67% | /mnt/redhat5.9 |

