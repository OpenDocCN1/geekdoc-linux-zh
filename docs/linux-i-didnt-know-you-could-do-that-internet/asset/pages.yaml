  md: '# Enjoy Your Tinkering!


    I wish you lot of fun exploring all the great programs for Linux that so many
    talented people have created. If you want to look for more of them (or check for
    updates on the ones''ve described) check out the Internet resources at the back
    of the book. Let me know what you think! I''m at nwells@xmission.com.


    # Conventions Used


    The following typographical conventions are used in this book:


    Program names, commands. and directories within a paragraph are shown in a program
    font like: this.


    Commands that you enter are shown on separate lines like these.


    ```

    $ make install

    # rpm -Uvh qt-devel-1.44-i1386.rpm

    ```


    The first character is the Linux command line prompt, which which you should not
    enter. I''ve used the "$" as a standard prompt, or the "#" when I think you may
    need to be logged in as root to complete the commands (some-times a note in the
    text explains that as well).


    For some sections, the output of commands is shown in the same style, but without
