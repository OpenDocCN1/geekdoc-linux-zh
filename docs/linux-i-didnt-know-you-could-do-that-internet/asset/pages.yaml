    | //sundance/d | 307033 | 735168 | 2335168 | 24% | /mnt/sundance_d |


    This section describes two utilities that provide the same information in different
    ways.


    # ## Graphically View Your Disk Space


    Xddiskinfo command provides a graphical method of viewing your available disk
    space. xdiskinfo is a T/Tk script that uses the wish interpreter.


    xdiskinfo is located in /Binaries/Disk Tools/xdiskinfo on the CD. To run xdiskinfo,
    use a command like this within a graphical command line:


    ```

    $ xdiskinfo &

    ```


    A dialog box appears like the one in Figure 11.1. This dialog box shows you how
    much space is used and how much is free on your root disk partition. The text
    lines above the pie chart show you the exact numbers represented by more than
    one partition mounted on your Linux system,


    If more than one partition mounted on your Linux system, as I do, a button appears
    at the top of the dialog box for each of the different file systems. Click a button
    to see a chart of free space for that system.


    When you have finished looking at the chart, click the OK button to end xdiskinfo.


    ![](img/ba933c244f3be8993f8191427d25c74c_54_0.png)'
