  md: '# Make Your System Entertaining


    Those who strive to use Linux as their desktop system for all their work may think
    that giving up Windows means giving up all multimedia capabilities with it. Admittedly,
    Linux isn''t as tightly integrated with a set of auto-launching accessories for
    every new sound format that appears.


    A surprising number of Linux developers are heavily into music and video. The
    result is a full set of audio and video programs that run on Linux. This part
    describes some of the best ones available. A few are standard fare on Linux systems;
    others are new or unexpected. Programs that require KDE, Gnome, or their libraries
    (Qt or GTK+) are noted in each section.


    # 26 Make Sound Work in Linux


    Running video clips in Linux (described in the next section) relies on the Window
    System. Most users have X already installed and configured, so this isn''t a problem.


    Playing any type of sound file, however, involves a connection to special sound
    hardware. This isn''t very difficult, but it isn''t often done automatically when
    you install Linux.


    # Set Up Your Sound Card in Linux


    To make a sound card function in Linux, the kernel modules must be added to your
    system. At least one of these modules must indicate how to access your sound card.
    Although many sound cards are supported on Linux, the SoundBlaster is the most
    popular sound card in PCs, so I''ll describe how to make it function in Linux.
    Other sound cards will probably use a procedure very similar to this:


    +   1. Log in as root.

    2. Enter this command to load basic sound support:


    ```

    # modprobe sb io=0x220 dma=1 mpu_io=0x330 irq=5

    ```'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'Loads the SoundBlaster module and all the modules that go with it. If you see
    a warning about the sound module already being loaded, you can safely ignore it.
    If, however, you see an error message about the interrupt number, use the command
    cat/proc/interrupts to examine the interrupts being using your Linux system and
    check the documentation for your sound card. Then try the above command again
    with appropriate parameters.


    +   3. Red Hat G users can also try running sndconfig utility that comes with
    Red Hat systems. This program is text-based but includes an easy-to-use interface.
    You can start it from any command line:


    ```

    $ sndconfig

    ```


    For additional information about configuring sound cards, consult the Sound-HOWTO
    document by pointing your browser to /Doc/Sound-HOWTO.html on the CD.


    The easiest way to test that your sound works is to play a music CD. Both KDE
    and Gnome (and many other Linux window managers) include at least a basic CD-playing
    application.


    In both KDE and Gnome, you can choose CD Player from the Multimedia menu. The
    KDE window is shown here.


    ![](img/ba933c244f3be8993f8191427d25c74c_150_0.png)


    Of course, if you don''t hear any sound, several other things could be wrong.
    If you use a dual boot system and sound works fine in Windows, try using a different
    kernel module or parameters and read the Sound-HOWTO document. If sound does not
    work in Windows either, check the following before fiddling with Linux commands:


    +   * Is the sound card installed tightly into the slot on your system board?

    * Are the speakers plugged into the correct jack (not the microphone) on the sound
    card?

    * Is the power connected to the speakers (many require an AC adapter or batteries)?

    * Are the speakers turned on?


    ![](img/ba933c244f3be8993f8191427d25c74c_150_1.png)'
