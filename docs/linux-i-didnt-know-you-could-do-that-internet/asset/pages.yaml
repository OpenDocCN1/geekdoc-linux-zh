  md: '# Introduction


    With all the noise about Linux being perfect for tasks such as running a Web server
    or acting as a router, you may be wondering what else you can do with this newly
    popular operating system. This book is about some of the other really handy Linux
    things you can do that you didn''t know about—things like graphically setting
    up a firewall or Apache server, all sorts of sound and video tools, increasing
    your system security; playing with programs to balance your checkbox, managing
    your business contacts, cataloging your videotapes, and checking the weather.
    This book covers dozens of gee-whiz Linux programs and features that will make
    you go, "Wow! That''s just what I need"


    # Is This Book for Me?


    The pages that follow don''t assume that you know much about Linux. If you''ve
    installed Linux and can open a command line window and follow directions, you
    can use nearly everything in this book. A few of the advanced topics will apply
    more to system administrators. If you know a little about compiling Linux programs,
    that''s helpful, but I''ve tried to walk through the steps. Again, some packages
    may require a programmer to get them to run if you''re not using a Red Hat Linux
    system.


    The packages on the CD have been tested on Red Hat 6. If you''re not using a Red
    Hat Linux system, many of the prebuilt binaries on the CD will still work for
    you: others will need to be compiled from source code. Each package includes a
    README file to guide you through that process, but you may have better luck if
    you''re a little more experienced with Linux.


    > NOTE The section titled "The CD" below and the README file on the CD itself
    provide helpful guidelines.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# What Will I Get out of This Book and How Is It Organized?


    Two types of information are included in this book. Some provide instructions
    on using parts of Linux that you might not know about yet, like using a RAID system
    or working with the vi editor and tar backup command to help you optimize your
    system. Most of the book is about additional free software packages that you can
    install on your Linux system for added functionality. These packages are included
    on the book''s.


    NOTE See the section titled ''The CD'' for more information.


    This book is divided into 12 parts that highlight different aspects of what you
    can do with Linux:


    +   1. Do it Faster, Easier, and Better: How to make a few Linux tasks like entering
    commands go more smoothly and require less effort on your part. Also, an introduction
    to the venerable vi editor and instructions on tracking system and network usage.


    +   2. Manage Your Files Like a Pro: Tools for checking your hard disk status,
    recovering files, and generally doing advanced stuff with your Linux files.


    +   3. Automate Your Entire System: How to use Linux features to run programs
    at any time, making a message pop up in 30 minutes to running a script every morning
    at 2 A.M.


    +   4. Spice Up Your Desktop: A variety of add-ons for Gnome and KDE desktops,
    implementing system administration and personal productivity just for fun.


    +   5. Make Your Linux System a Desktop OS: Run numerous word processors, spreadsheets,
    and full office suites on Linux, or run Windows programs on Linux.


    +   6. Turn Linux into the Ultimate Gamer: Run all of great games on Linux, from
    chess and NetHack to fast-paced games like flight simulators and arcade favorites.
    You can even play Minesweeper and solitaire.


    ![](img/ba933c244f3be8993f8191427d25c74c_12_0.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# INTRODUCTION


    7. Make Your System Entertaining: Play video clips, audio CDs, and even watch
    TV on your Linux desktop. Learn about audio mixing studios and digital synthesizers
    for Linux.


    8. Turn Your System into a Web Server: Use the Apache Web server to its fullest,
    with configuration hints for high performance, information about dozens of add-modules,
    and a graphical configuration tool.


    9. Turn Your System into a Super-Server: Use Linux features to connect multiple
    systems through one Internet connection, multiple addresses on one server, and
    manage server security with browser-based tools. Add a firewall with graphical
    configuration tools.


    10. Clone Windows NT: Use Linux add-ons to share data with Windows NT and NetWare
    servers on your network. Or replace an NT server with the Linux Samba tools. Learn
    about NetWare for Linux server product.


    11. Use Linux as a Business Server: Check your files for viruses (including files
    on a Linux e-mail server), send and receive faxes, and learn about Linux conferencing
    software.


    12. Disaster-Proof Your System: Learn about Linux backup utilities and add-on
    programs, plus how to use a Linux-controlled UPS (uninterruptible power supply),
    a battery-based power supply.


    # The CD


    The CD includes dozens of applications and files including helpful utilities,
    entertaining games, and even a full office suite. Most of the programs on the
    CD include complete source code as well as a binary executable file.


    A note of warning: some of the add-on packages are easier to use than others.
    I''ve included a lot of tools that you can run right off the CD; others require
    that you work with the source code a little, especially if you''re not running
    a standard Red Hat distribution, which is what all the packages were tested on.
    If you''re not a programmer, don''t worry. I''m confident that you''ll still find
    all sorts of useful tips and tools in this book. If some that you want to try
    are harder to use, consider that as incentive to learn about the inner workings
    of Linux.'
  merge: -1
  pgno: 13
