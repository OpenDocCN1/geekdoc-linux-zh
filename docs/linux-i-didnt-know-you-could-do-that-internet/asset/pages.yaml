    # Securely Share One Internet Connection


    It''s fairly easy to use Linux as a gateway to the Internet for your LAN, even

    over a modem. Just configure both network interfaces (such as eth0 and

    ppp for a LAN to modem gateway) and update the kernel routes using the

    route command (this requires that IP forwarding be enabled in your Linux

    kernel, of course). For information on IP forwarding, see this document

    nt the CD: /Doc/A11-HOWTO-Docs/NET-3-HOWTO.html) Two potential

    problems with this solution are


    +   * Your ISP notices that you''re connecting 50 people to the Internet with

    y single $15 per month connection and they are not pleased.

    * You are concerned that you face a security risk because everyone on

    the Internet can see the IP addresses of every computer on your LAN.


    True, your ISP shouldn''t care what you do, so long as you are estab-

    lished time and bandwidth policies. And the simplest of blanket firewalls

    will prevent anyone from reaching the computers on your LAN.


    But a more elegant solution, which provides more flexibility for your

    internal users and better security in both directions, is to use a Network


