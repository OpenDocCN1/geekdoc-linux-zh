    # Capture Data Directly from the Network


    When people talk about the dangers of the Internet for electronic commerce, they
    mention how someone can "sniff" information directly from the Internet. Information
    that isn''t encrypted can then be easily read.


    The sniffit utility shows how easy it is to do this. It also provides a useful
    tool for network administrators trying to debug very challenging problems on their
    network.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 26 DO FASTER, EASIER, AND BETTER


    > TIP By using the sniffit utility, you will see how important it is to use secure
    communication over the Internet and your internal networks. You will also become
    more aware of how easy it is for malicious users to gather information using these
    basic tools.


    Tools like IP-Traf, described in the previous section, are used to manage network
    load bal based on traffic levels of different protocols. The sniffit program is
    different. Rather than providing statistical information based on protocols, it
    stores individual packets as they are sent over your network.


    > NOTE Many issues affect which network packets are received at your computer''s
    network card. Unless you are working at a server, much of the traffic is never
    seen by your system.


    You can use sniffit in several ways, including setting up configuration files
    to determine how network packets are tracked and stored. The sniffit program can
    also use plug-ins to support various functions and has an Interactive mode where
    you can control network traffic is analyzed as the program works.


    The sniffit program is located on the CD at /Binaries/System Tools/sniffit. A
    few simple command line examples follow. Remember that sniffit can only track
    network packets that pass through your network card. If you are on a local network,
    most of the traffic won''t be seen on your network card. (If you don''t have setting
    up on your computer, run sniffit.)


    Each packet on your network has fields that define the IP address that the packet
    originates from (the source) and the IP address that the packet is headed for
    (the target).


    If you want to see packets that are coming from IP address 192.168.100.3, regardless
    of protocol or target (destination), use this command (you must be logged in as
    root to use sniffit):


    ```

    # sniffit -d s 192.168.100.103

    ```'
