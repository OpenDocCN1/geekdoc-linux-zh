    # 42 Check E-mails for Viruses


    Sadly, e-mail viruses are in the news more and more. Linux is not adversely affected
    by most of these because the viruses propagate themselves as DOS/Windows programs
    or macros to popular Windows applications. If users were careful not to open attachments
    that looked suspicious in any way or were from unknown persons, the growth of
    viruses would decrease dramatically. However, that seems likely to happen. While
    Linux itself is rarely affected by viruses, many times viruses are stored on a
    Linux e-mail server before being downloaded to an unsuspecting client.


    The tools in this section can help you check e-mail attachments on your local
    system or at the e-mail server before they are downloaded and infect a client
    system. All three of these packages are included on the CD, but have different
    licenses, which is each as described.


    The AntiVir program comes from the German company H+BEDV Detenchnik GmbH. It is
    easy to use and can be run as part of a script to check e-mail attachments for
    all users on a Linux mail server.


    The program is in binary format. Two files are included on the CD, both located
    at /Binaries/Business. The archive av1glibc uses the latest C libraries for Red
    Hat 6, OpenLinux 2.2. Use 6, and so forth, for older versions running version
    5 of the C libraries (for Linux 1.2, Red Hat releases before 5, and so forth),
    use the archive av11lib5. After unpacking the program archive, run the install.sh
    script to prepare the binary program:


    ```

    # ./install.sh

    ```


    ![](img/ba933c244f3be8993f8191427d25c74c_241_0.png)'
