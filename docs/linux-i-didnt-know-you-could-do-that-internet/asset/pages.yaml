  md: '# Play Audio Files on Linux


    Audio CDs have been around on Linux for years, and they seem to be getting better
    all the time. In addition to the default players included with KDE and Gnome,
    other CD players let you enjoy your audio CDs while working within any Linux graphical
    environment.


    Two CD players for Linux are xmcd and xfreed, both located on the CD in /Source/Audio.
    An rpm binary package for xfreed is also included in /Binaries/Audio. (The xfreed
    binary is installed in /usr/local/bin by default.)


    But CDs are not the only way to collect digital music. Web sites like www.mp3
    and many others provide sample tracks or let you create and download personalized
    music collections. Most of these are likely to be in MPEG3 audio (.mp3 files).
    Linux supports these and many other audio formats including:


    +   - MPEG3 (.mp3 files)

    - WAV

    - au files

    - MIDI (.mid files)


    One important distinction to know in digital music is that MIDI format is a description
    of musical properties, while WAV and MPEG formats are digital recordings (compressed,
    of course). Another way to explain the difference between these formats is that
    MIDI is like Postscript, while WAV and MPEG are PCX bitmap images.


    It''s important to know the difference between these formats because a MIDI player
    (such as the one included with KDE) must be able to interpret the "instruments"
    described in the MIDI file to create sound waves, while playing other formats
    requires (in the broadest sense) dumping the audio data to the soundcard. Different
    utilities may have very different capabilities with various audio formats.


    If you want to play one of your MPEG3 audio files without even being in X, you
    can use the mpg123 command line program to start a file playing in the background
    as you work:


    ```

    $ mpg123 chopin5.mp3

    ```'
  merge: -1
