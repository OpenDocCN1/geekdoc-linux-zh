    **Figure 43.3** The HP-67 emulator includes many functions in a simple calculator-mode
    interface.


    ![](img/ba933c244f3be8993f8191427d25c74c_248_0.png)


    To begin using the calculator, type in a number and press Enter. The number moves
    to a line above. Then type a second number and press Enter. This number also moves
    up one line, and the first number scrolls up. To add these two numbers together,
    press the “+ key. The two numbers are added and placed in the lower line.


    If you think of each line as a register, the function of the plus sign can be
    stated as "add together the contents of the X and Y registers and place the result
    in register X." This method gives you a lot of flexibility when completing overlapping
    or complex calculations. It also makes it easier to track of exactly what numbers
    are part of the calculation (once you become familiar with it).'
