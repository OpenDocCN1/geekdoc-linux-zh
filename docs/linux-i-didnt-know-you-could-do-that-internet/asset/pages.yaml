    # Set Up a Samba Server


    The Samba server suite is included with most distributions of Linux. If you didn''t
    include the Samba package when you installed Red Hat 6 (check by using the command
    rmp -q samba), you can add it to your system from the Red Hat CD using this command:


    ![](img/ba933c244f3be8993f8191427d25c74c_218_0.png)


    ```

    rpm -Uvh /mnt/cdrom/RedHat/Rms/samba-2.0.3-8.i386.rpm

    ```


    In addition, the /Binaries/samba directory contains rmp-format archives for various
    systems you can install on your copy of Linux. Source archives are also included
    at /Source/Samba on the CD.


    Depending on your Linux distribution, you may be able to set up Samba to begin
    working using a tool like LinuxConf (Red Hat), YAST (Suse), or COAS (Caldera OpenLinux).
    Once the Samba package has been installed, the Samba server normally starts each
    time you boost your system.


    The catch is when Samba runs, if it doesn''t find a valid configuration file,
    it stops running. You can tell whether the Samba server is running by using the
    following command, which searches the list of processes running on your system
    for that includes the letters bd:


    ```

    $ ps aux | grep .mbnd

    root 556 0 2.1 1312 652 ? S 13:46 smbd -D

    root 558 0 1.9 1104 608 ? S 13:46 0:00 mbnd -D

    ```


    The two lines show that the Samba server are those ending with smbd and mbnd.
    These are the SMB server daemon and the NetBIOS daemon (which the SMB uses).


    If these programs are not yet running on your system, follow the configuration
    steps in this section. After the configuration is set up, restart the Samba server
    using the steps shown and run the ps command above to check that the server is
    running.


    The configuration file for Samba is located in /etc/samba.d (for Open-Linux),
    in /etc (for Red Hat), or in a similar location, depending on your Linux distribution.
    When you install the binary files that match your'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 204 CLONE WINDOWS NT


    distribution name from the CD, they will look in the correct location for your
    version of Linux.


    The file smb.conf or smb.conf.sample is normally installed as part of the Samba
    package. You can begin using Samba once you have set up this file. A basic configuration
    may be set up already (as on Red Hat 6), but you should check the configuration
    as described here before using Samba.


    The Samba configuration file (smb.conf or smb.conf.sample) includes a configuration
    line for almost every possible Samba option—and there are many options. Some of
    the tasks that you can perform with a Samba server include:


    +   - Restrict connections to your server to a certain set of IP addresses

    - Define printers on Linux that can be accessed from Windows systems

    - Set up the Linux Samba server announces itself to other SMB systems (such as
    Windows on your network)

    - Use WINS for name resolution on your network

    - Have the Linux Samba server act as a Primary Domain Controller for your network
    (this feature is still experimental, however)


    Fortunately, a comment is included with each of the possible commands in the smb.conf
    file. (Comments are the lines that begin with "#" or ";") You can read the descriptions
    and uncomment any features that you want to try. A basic configuration for Samba
    includes information about how to authenticate users and what parts of your Linux
    system to share with clients.


    In the following listing, I have pulled out all the uncomment lines from a very
    basic smb.conf file so you can see what it contains without all the comments.
    Your best option is to use the default configuration file that is installed with
    Samba on your Linux distribution. If you want to try this example directly, it''s
    included on the CD as /Binaries/Samba/smb.conf.sample. The configuration file
    that follows for printer sharing, per-user home directory sharing, and a public
    area that all users can access (features that are probably part of your default
    setting, such as the one in Red Hat 6):


    ```

    [global]

    workgroup = WELLS

    server string = Toshiba-Caldera-Linux-Samba Server

    ```


    ![](img/ba933c244f3be8993f8191427d25c74c_219_0.png)'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# CLONE A WINDOWS NT SERVER ON LINUX 205


    ```

    printcap name = /etc/printcap

    load printers = yes

    printing = lprng

    ```


    ```

    security = user

    encrypt passwords = yes

    smb passwd file = /etc/samba.d/smbpasswd

    ```


    ```

    socket options = TCP_NODELAY

    dns proxy = no

    ```


    +   [homes]

    comment = Home Directories

    path = %H/Public

    browseable = yes

    writable = yes

    create mask = 0750


    ![](img/ba933c244f3be8993f8191427d25c74c_220_0.png)


    +   [printers]

    comment = All Printers

    path = /var/spool/samba

    browseable = no

    guest ok = no

    writable = no

    printable = yes

    create mask = 0700


    +   [public]

    comment = Public Stuff

    path = /home/public

    browseable = yes

    public = yes

    writable = yes

    printable = no

    write list = @users


    A few additional steps must be performed with other Samba-related files before
    you can run to your Windows systems to have a look. Notice that the [homes] and
    [public] section define subdirectories on your Linux system.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 206 CLONE WINDOWS NT


    These subdirectories must exist, or a connection intended for that resource will
    fail. To prepare my system to use this configuration file, I had to create the
    two directories that the configuration file refers to: /home/public and /home/r1/public.
    You may need to go on as root to create, but ensure that the Public directory
    is owned by the person whose home directory is in.


    Now, look at the [global] section to see how few key settings there operate. The
    /etc/printcap file is named as the source for printers. This setting makes all
    printers on your Linux available to Windows users. You can also specify a Linux
    printer definition as the only one available for Windows users. (This is a good
    idea, because it allows you to manage print jobs from Windows systems independently).


    Set the group line to match the Windows group that you want your system to be
    part of. It should normally be in all capitals. Set the server line to a descriptive
    string about this server. I like noting the machine type and that its a Linux
    server, but you can leave out if you prefer (Set the string to "Windows NT Server"
    if you would like to hide the fact that people are using Linux).


    The only troublesome part that remains is to configure the security for your Samba
    server. Because the SMB protocol is used by systems from Windows 95 to Windows
    2000, differences in how passwords were implemented can cause headaches when you
    connect machines of many different types to your Samba server. Using encrypted
    passwords is always a good idea, but you may have to make a change in the Registry
    of some clients to enable them to use encrypted passwords. If all of your clients
    use unencrypted passwords, you can choose not to use them on the Samba server.


    Set up the passwords so that Windows users can access the server, you must prepare
    an smbpasswd file, as defined in the smbpasswd file line:


    ```

    smbpasswd file = /etc/smbpasswd

    ```


    If you are running Hat 6, uncomment this line in your /etc/smb.conf file.


    One way to set up the Samba password file is by using a few of the Samba utilities
    to copy your Linux user database (/etc/smbpasswd) to the file. The command to
    do this is either mksmbpasswdpassword or convert_smbpassword, depending on your
    version of Samba.'
  merge: -1
