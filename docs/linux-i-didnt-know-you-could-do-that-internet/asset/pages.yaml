  md: '# Try the Free KOOffice Suite


    Part of the KDE project is the development of a complete office suite that is
    integrated with all the features of KDE. The KOOffice suite isn''t yet completed,
    but it already includes the following components that are ready to use:


    +   * A word processor (KWord)

    * An Outlook-like task organizer and daily planner (KOrganizer)

    * A vector-based drawing program (KIllustrator)

    * A presentations package (KPresenter)


    Additional tools will include:


    +   * Bitmap drawing tools (KImage)

    * A spreadsheet (KSpread)

    * A database with graphical interaction (Katabase)

    * A formula designer (KFormula)


    Because KOOffice isn''t finished yet installing it can be a challenge. You must
    have the latest version of the Qt graphical libraries, compiler tools, KDE, and
    so forth. For detailed information, visit the KOOffice Web site at http://koffice.kde.org.


    All of the KOOffice components use a shared object system called Kparts that allows
    all documents to be embedded in each other something like OLE or an Object Request
    Broker (ORB). For example, a KSpread spreadsheet can be embedded live in a KWord
    document.


    The KWord word processor is similar to FrameMaker in that it is frame oriented
    rather than page oriented. It includes auto-correction features, a collection
    of templates, and powerful table features. Figure 21.3 shows KWord.


