  md: '# Run Any Program Any Time


    Running programs automatically when you log in is a great feature, but even DOS
    can do that. Linux also lets you set specific times and dates to run any program
    you choose. As long as your computer is on, the program will run unattended and
    e-mail you the results.


    Running programs automatically is great for all sorts of administrative tasks
    and little electronic "errands" such as:


    +   - Sending yourself reminder messages about other things you need to take care
    of


    +   - Backing up your system in the middle of the night


    +   - Automatically checking system logs with log analysis programs


    +   - Downloading large files while you sleep


    +   - Querying a stock price every 10 minutes and compiling a graph


    All of these can be done easily in Linux using the cron and at commands. The root
    user on your system can set up files to allow or deny rights to run automatic
    programs using cronab and at. This is by setting up a text file named /etc/cron.allow
    or /etc/cron.deny including usernames in one of these files. If neither of these
    files is present (which is the default on most Linux systems), all users can run
    automatic programs using cronab and at.


    # Setting Up a One-Time Task


    The commands cronab and at are used a little differently: cronab is for recurring
    tasks; at is for single tasks that are scheduled for a later time but are not
    necessarily recurring. However, using either program is often referred to as setting
    up a "cron job."


    To use at to schedule a one-time task for automatic execution, follow these steps:


    +   1. Run the at command with the date or time when you want your commands executed.
    A prompt for entering the at command appears.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# RUN ANY PROGRAM ANY TIME 61


    $ at 19:30

    at>


    The methods of specifying dates and time for at can be very complex if you need
    them to be. The following table shows some examples of how to format the date
    and time. The man page for at describes specifics about execution times.


    | at 19:30 | 7:30 P.M. tonight (or tomorrow if it''s past that time already) |

    | at now+10 minutes | 10 minutes from when you press Enter |

    | at Jun 3 6:00 | 6:00 A.M. on June 3 |

    | at 11/10/99 | Right after midnight on November 10, 1999 |


    ![](img/ba933c244f3be8993f8191427d25c74c_76_0.png)


    2. At the at> prompt, enter the commands that you want to execute as you were
    entering them on a regular command line.

    at>ps


    3. After entering all of the commands you need to execute, press Ctrl+D. The at
    command responds with the job number and date and time that the job will be executed.
    For example:

    Job 5 at 1999-11-01 19:02


    > NOTE The programs that process at and crontab commands check for something to
    do each minute, so you can''t be more precise than using these commands.


    +   * If you need to see when you have tasks (jobs) scheduled using at, the atq
    command:

    $ atq


    ```

    6 1999-11-01 19:14a

    8 1999-11-02 00:05 a

    ```


    +   * If you want to cancel the execution of a job that you scheduled with, use
    the atmrm command with the job number (if you don''t know the job number, you
    can find it using atq).

    $ atmrm 6'
