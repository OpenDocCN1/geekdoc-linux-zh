    # Manage Multiple File Downloads


    When you''re busy working on your computer, managing large or multiple downloads
    can really interrupt your workflow. Transfer Manager can take care of you. By
    using Transfer Manager, you can download multiple files without opening a separate
    browser window for each one and without returning to a browser window repeatedly
    to click on the next file in a series that you want to download.


    To use the Gnome Transfer Manager, specify the URL you want to download (Web,
    FTP, etc.) and the directory where the file to download should be placed.


    The Transfer Manager starts the download. The window is refreshed once per second
    (you can set the refresh rate). As the download progresses, the fields shown for
    each file include:


    +   * The status of the download (active, stalled, etc.)

    * The number of bytes retrieved and the total size of the download

    * The amount of time used so far and the estimated time to the download

    * The session speed


    ![](img/ba933c244f3be8993f8191427d25c74c_86_0.png)


    The interface to Transfer Manager is shown in Figure 18.5. The program is located
    at /Binaries/Desktop/transfermanager on the CD. It can be started with this command:


    ```

    $ /gtm

    ```


    Transfer Manager includes a Preferences dialog box where you can select network
    interface to use for downloads (such as the modem, cua0, or the Ethernet card,
    eth0). You can also specify a default directory for all downloads (though each
    download can have a different directory specified) and use a proxy server for
    both HTTP and FTP downloads.


    ![](img/ba933c244f3be8993f8191427d25c74c_86_1.png)'
