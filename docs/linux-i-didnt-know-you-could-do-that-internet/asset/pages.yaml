  md: '# 214 CLONE WINDOWS NT


    Using these features, you can use Windows NT as a shared file server, access shares
    on any Windows client (that you''ve been granted access), print (aWindows printer,
    and so forth. These features also apply to any other system running a Samba server.
    For example, one Linux system can act as a client to another Linux system running
    as a Samba server.


    As setting up a Samba server, the surest method of accessing other SMB systems
    such as Windows NT is on the command line, as explained in the following sections.
    Graphical utilities to assist with the process are shown afterwards (see Figure
    39.1).


    # Connect to an SMB File Server


    To connect to an SMB server, including a Samba server running on any platform,
    use the smclient utility. This command line has an interface that combines commands
    from the command line FTP client and a standard Linux shell. Table 39.1 shows
    several of the most-used commands.


    TABLE 39.1 Most Used Commands for the smclient Utility


    | smclient Command | Description |

    |---|---||

    | help | Prints a list of all smclient commands. |

    | is | Lists the files in the current directory to the remote server. |

    | get filename | Downloads a file from the remote server, copying it to your local
    working directory. |

    | put filename | Uploads a file to the current remote directory (this requires
    permission to write files on the remote server). |

    | !command | Executes a Linux command while still in the smclient interface (for
    example, use ipwd to see your Linux working directory). |

    | exit | Closes the smclient utility. |'
