    +   - If you have static HTML pages that are requested, use the mod_mmap_static
    module (part of the standard Apache code, though it''s included by default). This
    module keeps HTML pages loaded into memory so they can be returned to a client
    without reading the hard disk.


    +   - Use a separate database server on your local network to spread the processing
    load of database lookups. Be certain you have a very fast internal network, however,
    or this may cause a bottleneck between the Web and database servers.


    If you''re working with the Apache source code, additional performance improvements
    are available by tweaking the system for a higher load. Detailed instruction for
    doing this are found at http://www.apache.org/misc/perf-tuning.html. This document
    is included on the CD at /Source/Apache/server, but check the URL for the latest
    version.


    If you''ve checked all of these things, see if a network analyzer indicates that
    you still have unused bandwidth and incoming Web browser requests that could use
    it (meaning that the Apache server is the bottleneck on the system). The suggestions
    given in the following list may allow Linux to handle more web traffic:


    +   - Adjust the number of processes allowed by Linux. Sometimes the number of
    Apache processes needed to service Web requests outstrips the preset limit in
    Linux. You can change this value in the Linux source code and recompile your Linux
    kernel.


    +   - Adjust the number of file handles that Linux allows. Each copy of Apache
    uses a couple of file handles. If they''re all used up, Apache can''t do anything
    until some are released by another copy of the program.


    More hints for tuning Linux performance are available at http://www.linux.com.
    Specific hints for working with different parts of the system (kernel, file systems,
    etc.) are provided on this site.'
