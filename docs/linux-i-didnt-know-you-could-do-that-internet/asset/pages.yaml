  md: 'You''ve used all the standard Linux utilities for copying and deleting files
    (cp, rm), managing your directory structure (cp, pwd, mkdir), and so forth. This
    part describes a few of the tools you wish had all along. Now you can use them
    to manage your files like a pro.


    ![](img/ba933c244f3be8993f8191427d25c74c_45_0.png)


    > WARNING Some of the tools showcased in this section require quite a bit of knowledge
    about how your hard disk is set up. Read the documentation carefully if you need
    to learn about the more technical details before using these special utilities.


    # # Optimize Your Linux Hard Disk


    With some operating systems, you need to optimize, or defragment, your hard disk
    regularly to prevent serious performance problems. This is because the pieces
    of a single file are scattered (fragmented) over the entire area of your hard
    disk.


    Linux doesn''t suffer from this problem to any serious degree because the design
    of the Linux native file system (called ext2, for extended file system, version
    2) allocates space for files in a way that allows files to grow in size without
    becoming fragmented.


    Still, on a Linux system with a lot of disk activity (or one where the hard disks
    are quite full) you can increase your disk performance by 5 to 25 percent by defragmenting
    your Linux file system.


    The defrag package enables you to quickly defragment your Linux file system to
    improve performance. The binary package is located on the CD in the /bin/Disk
    Tools/defrag directory; the source code is at /Source/Disk Tools/defrag-0_70_tar.gz.
    (The source code is for a slightly older version of the program.)


    ![](img/ba933c244f3be8993f8191427d25c74c_45_1.png)'
