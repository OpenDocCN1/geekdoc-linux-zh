    # 12 Fine-Tune Your Hard Disk Format


    The standard Linux hard disk format provides very good performance for most users.
    The Linux file system can be fine-tuned, however, to add a few improvements for
    those who know specifically what they need from their hard disks.


    # Fine-Tune the Optimum File Size for Your System


    The default block size for a Linux file system is 1,024 bytes. For most users.
    But if your Linux system is chock of files that are less than 512 bytes (such
    as icon graphics files), then you could improve your disk performance by changing
    your block size to 512. (The disadvantage of using a smaller block size is that
    larger files will have slightly reduced performance.)'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'Similarly, if your system is mostly larger files (for example, huge database
    tables), you could change your block size to 2,048 or 4,096 bytes. Because Linux
    reads from disk drives one block at a time, you could see performance improvements
    by doing this.


    Of course, if you make the block size larger, you would have to contend with two
    downsides:


    +   - Potentially reduced performance when reading numerous files that are very
    small

    - Wasted space for all the files that are far below the block size (because the
    block size is the minimum allocation of space on the hard disk)


    The problem with using a nonstandard block size is that you must select the block
    size when you format your hard disk. You can''t change it later without reformatting
    your disk. But if reformatting doesn''t bother you (perhaps you''re starting with
    a new system), use the mke2fs command with the -b option to specify the block
    size.


    A sample hard disk formatting command would look like:


    ```

    # mk2fs -b 4096 /dev/hdb2

    ```


    Be careful about using this command. If you use a device name incorrectly, you
    might wipe out a partition that you didn''t intend to format. Also, remember that
    any unmounted partitions should be formatted. Formatting a mounted partition will
    give unpredictable results.


    > NOTE Many other options can be included with the mke2fs command, because they
    can be set using the tune2fs fs command after formatting, they are discussed in
    the next section.


    # Tune-Up Your File System Without Reformating


    mke2fs command lets you define many options for your Linux file systems at the
    time you create (format) them. By using the tune2fs command, you can change many
    of those options without reformatting your hard disk.


    ![](img/ba933c244f3be8993f8191427d25c74c_56_0.png)'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# 42 MANAGE YOUR FILES LIKE A PRO


    The tune2fs command is a default part of standard Linux distributions.


    > > WARNING Never use tune2fs on a file system that is mounted. If you need to
    update your root file system, start your computer from a floppy disk so your regular
    root partition isn''t being used.


    The following table lists items that can be updated using the tune2fs command:


    | OPTION | DESCRIPTION | EXAMPLE |

    | --- | --- | --- |

    | -c | Maximum number of times the file system can be mounted between automatic
    integrity checks (using the fsck program). | tune2fs -c 5 |

    | -i | Maximum amount of time the file system can go between automatic integrity
    checks (using the fsck program). Days (d), weeks (w), or months (m) can be specified.
    Days is the default if no letter is included. | tune2fs -i 1w |

    | -m | Reserves a percentage of the file system for files owned by the superuser
    (root) or other specific users. This allows the superuser to still use the system
    when all the "normal" space is used. This could be set to zero on something like
    a /home partition. A certain number of blocks can be specified rather than a percentage
    (use the -r option). | tune2fs -m 5 |

    | -u, -g | Defines a user or group (by name or ID number) who can use the reserved
    blocks. | tune2fs -g wheel |

    | -L | Defines a label for the file system. | tune2fs -L usenet |'
  merge: -1
