    any version of Linux that uses the Window System. It supports the following video
    formats, with MPEG being the most popular at the moment for Web-based video clips.


    +   - MPEG video

    - Quicktime animations (MOV file)

    - AVI animations

    - FLI and FLC animations

    - IFF animations'
