  md: '# Play Flight Simulator on Linux


    The Sabre flight simulator provides a very realistic and impressive flying experience
    in Linux. You can select from many different scenes and air-planes and you can
    use a demo mode to watch the simulator fly around.


    A site dedicated to the development of Sabre is located at http://sabre.cobite.com/
    and provides a user''s guide and updates for the software and game play. The Web
    site states that at the moment, the Sabre team is working on Korean War-era fighter
    aircraft, such as the F-86 Sabrejet and the MiG-15. The F-84 Thunderlet and the
    F-51 Mustang are also available from the Sabre menu. You can enjoy fly with a
    squadron if you prefer.


    Sabre is located at /Source/Games/Arc on the CD. Sabre is not an X Window program.
    It uses the underlying graphical tools (the svg libraries) to create something
    similar in look and feel to a DOS-based game. You''ll need to compile Sabre before
    using it. The basic commands are shown here, though many scenes of text appear
    after some of these commands. You may also want to run the INSTALL file in the
    Sabre-directory after unpacking the archive.


    ![](img/ba933c244f3be8993f8191427d25c74c_125_0.png)


    ```

    $ cp /mnt/cdrom/Source/Games/Arcade/sabre-0_2_4.tar.gz /home nwellis/part6

    $ cd /home/wells/part6

    $ tar xvzf sabre-0_2_4_tar.gz

    $ cd sabre-0.2.4

    $ ./configure

    $ make

    $ make install

    $ /usr/local/bin/sabre

    ```


    You may need to be logged in as root to make the install command. Once you have
    Sabre compiled and running, the results are impressive (see Figure 24.4).


    Another flight simulator worth trying is FlightGear. This project includes a separate
    package full of scenery and other graphics, plus a documentation package.


    FlightGear requires a 3D graphics card. The complete source packages to build
    it are located on the CD at /Source/Games/FlightGear.


