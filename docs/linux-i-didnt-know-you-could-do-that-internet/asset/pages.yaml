    multiple windows, it''s helpful to have access to a list that shows which programs
    were started from within a particular environment. For example, if you start a
    graphical program from within a command-line window and then close the command-line
    window, the graphical program will end as well. The kpstree utility helps you
    avoiding the wrong'
