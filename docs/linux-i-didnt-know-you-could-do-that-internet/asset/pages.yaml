  md: '# What''s on the CD


    The CD-ROM contains most of the software packages that are described in the text
    of the book. (A few items described are commercial software and cannot be included
    here.) Highlights include


    +   * The AppliWare Office Suite

    * Players for video clips, MP3 audio files, and audio CDs

    * The best arcade and strategy games for Linux

    * Virus scanners

    * Personal finance tools

    * Security add-ons

    * Windows and NetWare integration tools

    * Apache Web server add-on modules


    You deserve some warning about these add-on packages: Some of them are easier
    to use than others. I''ve included a lot of tools that you can run off the CD;
    others require that you work with the source code a little, especially if you''re
    not running a standard Red Hat Linux distribution, which is what all the packages
    were tested on. If you''re not a programmer, I''m confident that you will still
    find all useful tips and tools in this book. If that you want to try are harder
    to use, consider that as incentive to learn more about the inner workings of Linux.


    +   * All of the packages have been tested on a default Red Hat 6 Linux installation.

    * The README file on the CD and the Introduction to the book provide additional
    guidelines on working with the source code files (if necessary for your Linux
    system).

    * Some packages are only included as source code and must be compiled on your
    system before use. These packages are indicated in the text of the book.

    * Some packages require additional preparation to your Linux system or additional
    hardware, as described in the text of the book.

    * The rpm_list.txt file on the CD shows you what was installed on the test system.'
  merge: -1
