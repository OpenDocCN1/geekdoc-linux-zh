  md: '# SYSTEM ADMIN TOOLS 79


    Using KLILO, you can add a configuration for additional operating systems or Linux
    kernels on your computer by clicking the Add button. Once a system is added, you
    can use the Edit button to set up the hard disk device, select which kernel to
    run, and so far. The overall configuration options at the top of the dialog box
    let you where to install LILO and determine the delay before starting up the default
    operating system (the first listed in the Operating Systems list).


    After configuring your lilo.conf file using KLILO, press the Install button to
    run the lilo command and copy this configuration to the boot sector, Master Boot
    Record, or a floppy diskette (you must be logged in as root to install LILO).


    # Manage All Your Passwords


    The more you use the Internet, the more accounts you have set up around the world.
    Before you just had an ISP account, now you''re likely to have a separate username
    and password to access your online bank, ClickRewards account, Amazon.com, Consumerreports.org,
    a mutual funds company, and a few others as well. Using the same username on all
    these accounts is usually not possible; using the same password on all of them
    is downright foolish.


    The Gpasman utility provides a simple solution. It stores all your usernames and
    passwords for various accounts that you maintain. The passwords are shown in cleartext
    (readable) on screen so that you can refresh your memory when you need to access
    an account. The data, however, is stored on disk in an encrypted form, so that
    others who may have access to the hard disk cannot see the passwords in your Gpasman
    file.


    Use the Gpasman utility (located at /Binaries/Desktop/gpasman on the CD), use
    this command:


    +   $ gpasman


    The interface is shown in Figure 19.4.


    Of course, you could also use Gpasman to record the passwords or ID numbers for
    your ATM card, your car entry code, and so forth, but it is dangerous enough to
    have all your Internet passwords stored in one place!


    ![](img/ba933c244f3be8993f8191427d25c74c_94_0.png)'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# SPICE UP YOUR DESKTOP


