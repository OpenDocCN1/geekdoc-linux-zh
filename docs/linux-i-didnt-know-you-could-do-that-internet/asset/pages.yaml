    # Analyze Your Stocks


    If you find all this discussion of mortgage calculations a little boring, you
    should try the tsinvest package to do some serius financial analysis of your stock
    portfolio.


    Tsinvest runs a simulation to determine the optimal gains that you can achieve
    from a portfolio of multiple equity investments. The program determines which
    equities to invest in a set that you provide by calculating the instantaneous
    Shannon probability and statistics for all of the equities. A statistical estimation
    technique is then used to estimate the accuracy of the calculated statistics for
    the equities.


    This is serious work. You may want to consult the tsinvest home page at http://www.inow.com/~conover/ntropix
    for more information. The README file included with the package is also a good
    source of information (though it assumes you are familiar with some stock trading
    terms and techniques). Tsinvest is located on the CD at /Source/Business.


    Information about the stocks that you want to analyze is stored in the stock files
    in the tsinvest directory. A set of old stock data is included in the source code
    package as a sample for analysis. The format of the stock information is described
