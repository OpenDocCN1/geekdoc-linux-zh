    # 19 System Admin Tools


    Both Gnome and KDE include a full suite of system administration tools. However,
    there are a few tools that are new, specialized, or still relatively unknown.
    This section tells you how to take advantage of some very useful tools that aren''t
    included in the default desktop distributions.


    # Manage File Systems Graphically


    If you need to access multiple file systems either locally (on hard drives attached
    to your PC) or remotely (using the NFS mounting protocol), you''re probably familiar
    with the mount command and the /etc/fstab file. The Kfstab utility gives a graphical
    interface through which you can review and add mounted files.


    Kfstab is located at /Binaries/Desktop/kfstab on the CD. When you start the program,
    you see the window in Figure 19.1. From this window, you can add to or remove
    any of the available or mounted file systems.


    ![](img/ba933c244f3be8993f8191427d25c74c_90_2.png)


    ![](img/ba933c244f3be8993f8191427d25c74c_90_3.png)'
  merge: -1
