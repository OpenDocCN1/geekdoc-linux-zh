    # # 39 Access Windows NT Servers from Linux


    Samba gives you a powerful way to use Linux as a file and print server that

    all of your Windows clients can access, but many networks already make

    extensive use of Windows NT servers. Samba lets you connect to these

    Windows NT servers and other Windows systems as a client.'
