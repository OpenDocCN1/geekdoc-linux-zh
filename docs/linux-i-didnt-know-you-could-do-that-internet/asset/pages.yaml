    ![](img/ba933c244f3be8993f8191427d25c74c_166_0.png)


    # Add Modules to Your Apache Web


    Because Apache is freely distributed as source code, most serious Web-masters
    will download Apache and compile their own copy. This allows the Webmaster to
    control the exact features that are included in Apache and to use the latest version
    (and so have available possible security fixes and program enhancements).


    By default, Apache doesn''t include all the possible modules that are included
    with the source code. For example, if you want to learn writing your own module,
    you should add a module called mod_example. You can add a module to Apache as
    you compile the source code by adding a configuration option when you make the
    binary program.


    Modules can be added directly to the source code, or they can be added to Apache
    on-the-fly as a Dynamic Shared Object (DSO), which is sort of like a Windows DLL
    or UNIX shared library. This means that new program functionality can be added
    to Apache without touching the source code or doing any programming. Just follow
    the steps below to insert new functionality into your Web server.


    Either method (using source code or dynamic loading of a prebuilt module) makes
    the module available to all of the browser requests that Apache processes. By
    using a DSO you can experiment with a new module, loading and unloading to see
    how it affects your Web server, without the need to recompile the server to try
    new things.


    To make a DSO module part of Apache, just include this line in the configuration
    file httpd.conf (located in the /etc/httpd/conf directory on Red Hat 6):


    ```

    LoadModule module_name module_filename

    ```


    Many modules will already be precompiled on your Linux system, so you can use
    the LoadModule directive without recompiling Apache. For others, you''ll need
    to create the DSO file.'
