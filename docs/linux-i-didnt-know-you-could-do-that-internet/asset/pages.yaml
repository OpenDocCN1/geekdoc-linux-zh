  md: 'DISASTER-PROOF YOUR SYSTEM


    # 48 Monitor System Logs for Trouble


    Most of the important activity on your Linux system is logged to the system log
    This file—/var/log/messages on most Linux systems—contains messages that nearly
    every important Linux program has written to the system. The system log includes
    information such as


    +   * Each kernel module that is loaded

    * Each attempt to log in as root

    * Connections made via FTP or certain other protocols

    * Failed login attempts

    * Warnings about system resource limits

    * Networking daemons starting and stopping


    You can configure which types of events are logged to the messages file by reviewing
    and editing the /etc/syslog.conf file This is rarely needed unless youre running
    a large Linux server or have specific security concerns, however.


    Because the system log file can be a good way to see potential trouble before
    it causes real problems, several programs have been developed to help you watch
    the system log file for warning signs. Examples of these warnings are needed


    +   * Repeated failed log in attempts in the middle of the night by a user that
    is supposedly on vacation

    * Network services being stopped and restarted when the system administrator is
    not aware of it

    * Programs having trouble allocating sufficient memory to execute properly


    Warning signs can pertain to both system maintenance—keeping your Linux system
    running smoothly and efficiently for all users—and to security issues.'
