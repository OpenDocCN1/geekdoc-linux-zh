  md: '# # Finding More Linux Stuff


    The following Internet resources are great places to look for updates and new
    programs for Linux.


    | Internet Site | Description |

    | :--- | :--- |

    | http://www.linuxberg.com/ | A huge site (mirrored worldwide) with categories
    and ratings for each Linux package. Intended for those desired, most stable programs.
    |

    | http://www.freshmeat.net/ | The place where all Linux-oriented developers announce
    new releases of their programs. Use the search function to find a specific package.
    Best for the latest release, which is not always the most stable (though you can
    usually find those well). |

    | ftp://sunsite.unc.edu/ or http://metalab.unc.edu/ | Probably the largest FTP
    site in the world, with many mirrors. Start with the /pub/linux directory. |

    | http://www.redhat.com/mirrors.html | A list of sites that mirror the Red Hat
    archives, which are too busy to be accessed directly. The core Red Hat files,
    updates, and contributed files are listed separately. |

    | http://www.kde.org/ | Use the Applications link on the KDE Web to see tables
    of the latest KDE applications with links to the downloadable packages. |

    | http://www.gnome.org/ | Use the Software Map link to learn about Gnome software.
    The list is organized by category with icons to indicate Stable, Core product,
    Screenshot, etc.'
