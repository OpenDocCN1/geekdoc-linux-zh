  pgno: 241
- img_proc: true
  md: '# CHECK E-MAILS FOR VIRUSES


    Answer Y to the query to create a symbolic link; this creates a link in the /usr/bin
    directory where the AntiVir program can be executed from any command line.


    Once the AntiVir program is installed, it can be run from a command line, specifying
    the directory to check for viruses. Because the standard storage area on a Linux
    server for incoming e-mail messages is /var/spool/mail you might use this command
    to check e-mail on your Linux server:


    ```

    # antivirus /var/spool/* -s

    ```


    The quotation marks are important. By using them, the wildcard "*" is passed to
    the AntiVir program rather than being expanded by the shell starting AntiVir.


    Output from AntiVir is shown on the console. You can redirect to a file using
    standard Unix redirections (the >


    |). AntiVir can be used free of charge for use. Some of the features of the program,
