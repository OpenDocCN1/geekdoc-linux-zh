  pgno: 120
- img_proc: true
  md: '# Turn Linux into the Ultimate Gamer


    For a long time, games were the missing piece on Linux systems. But with encouragement
    from Linus Torvalds (creator of Linux) and a host of entertainment-hungry developers,
    Linux now has hundreds of terrific games available. Many commercial game vendors
    are porting popular titles to Linux. The games described in this section, however,
    are all free—and they''re all included in CD.


    This part describes games that you can play on any Linux platform. Some of the
    games are character-based; most are graphical. Some require the KDE or Gnome environment;
    others can be run in any Linux system. For game enthusiasts who want additional
    games and information, consult the Web site http://www.linux.com.


    The standard game packages for KDE and Gnome, which are mentioned several times
    in this part, are located on the CD at /Binary/KDE and /Binary/Games/Gnome. Other
    KDE and Gnome-based games are located in specific subdirectories according to
    the name of each game.


    As you work with the files in the /Binary/Games directories, be aware that some
    games may require a full install from source in order to have the necessary graphics
    and libraries to run the program. In these cases, build your own binary from the
    package in the corresponding /Source/Games subdirectories.


