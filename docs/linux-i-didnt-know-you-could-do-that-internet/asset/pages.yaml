  md: '# AUTOMATE YOUR ENTIRE SYSTEM


    4. The job numbers are specific to your user account. Each user has a separate
    queue of tasks that have been submitted using at.


    What happens to the output generated by commands that at? It is automatically
    e-mailed to your user account. This allows you to review the output whenever you
    choose to (a helpful feature when running programs at 2:00 A.M.).


    # Setting Up Recurring Automatic Programs


    The program is great for single tasks, but if you want to run a program at regular
    intervals, such as once per week or once per hour, the crontab program can set
    you a regularly scheduled task for you.


    Using crontab is a little more complicated than using because the time formats
    are more complex, and you must create a text file containing the information about
    your task.


    To crontab, create a small text file containing the commands you want to execute.
    An example is shown here, taken from the crontab man page:


    ```

    # /bin/sh to run commands, no matter what /etc/paswd says

    SHELL=/bin/sh

    # mail any output to ''paul'', no matter what crontab is

    MAILTO=paul

    # * * * * five minutes after midnight, every day

    5 0 * * * $HOME/bin/daily.job $HOME/tmp/out 2>&1

    # * * * 2:15pm on the first of every month -- output to mailed

    paul

    15 14 1 * * $HOME/bin/monthly

    # run at 10 pm on weekdays, annoy Joe

    0 22 * * * 1-5 -s ''It''s 10pm'' Joe%Joe,Where are your kids?

    23 0-23/2 * * * echo ''run 23 minutes after mid, 2am, 4am ...

    everday''

    5 4 * * * echo ''run at 5 after 4 every sunday''

    ```


    Each line of the text file contains a description of when to run that command
    the command itself. Lines can also contain environment variables such as MAILTO=paul,
