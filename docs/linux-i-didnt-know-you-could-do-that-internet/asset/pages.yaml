  md: '# 184 TURN YOUR SYSTEM INTO A SUPER-SERVER


    The DHCP server package is included in every Linux distribution; it is also part
    of the package included in the /Source/System Tools/ directory on the CD.


    For example, to install the DHCP server daemon on Red Hat 6, use these commands
    after mounting the Red Hat CD in your CD-ROM drive:


    ```

    # cd /mnt/cdrom/Redhat/RPMS

    # rpm -Uvh dhcp2-0.0b1ip6-6.i386

    ```


    After installing the DHCP server program, a few configuration steps are required
    before the server will respond to DHCP client requests. These steps to configure
    the DHCP server:


    +   1. Execute the route command, checking to make sure a route of 255.255.255
    is included. This may have been set by the command that installed your DHCP server.
    (If you have Windows clients using DHCP on the same network as your Linux system,
    the 255.255.255 route must be included in Linux to prevent errors on the Windows
    systems.)


    ```

    # /sbin/route table

    ```


    | Destination Gateway Genmask Flags Metric Ref Use Iface |

    | 127.0.0.0 | | 255.255.0.0 U | 0 0 lo |


    +   2. If necessary, use one of the following commands to add the 255.255.255.255
    route to your system. Try the first command; if it gives an error, try the second.


    ```

    route add -host 255.255.255.255 dev eth0

    route add -net 255.255.255.0 dev eth0

    ```


    +   3. Configure the /etc/dhcp.conf configuration file. A sample file is shown
    here:


    ```

    default-lease-time 600;

    max-lease-time 7200;

    option subnet-mask 255.255.255.0;

    option broadcast-address 192.168.1.255;

    option routers 192.168.1.254;

    option domain-name-servers 192.168.1.1, 192.168.1.2;

    option domain-name ''mydomain.org'';

    ```


    ![](img/ba933c244f3be8993f8191427d25c74c_199_0.png)'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# CONNECT IN NEW WAYS 185


    subnet 192.168.1.0 netmask 255.255.255.0 (

    range 192.168.1.10 192.168.1.100;

    range 192.168.1.150 192.168.1.200;

    )


    This sample file uses the DHCP server to assign IP addresses from the range 192.168.1.10
    to 192.168.1.100 or from 192.168.1.150 to 192.168.1.200. Each client IP address
    is valid for 600 seconds (or the time the client requests, to a maximum of 7200
    seconds). After that time, the DHCP server also provides information for the client''s
    subnet mask, broadcast address, router/gateway settings, and DNS server.


    If you need to assign a specific IP address to a certain client (based on the
    hardware MAC address of the client''s Ethernet card), add lines such as:


    ```

    host haagen

    hardware ethernet 08:00:2b:4c:59:23;

    fixed-address 192.168.1.222;


    ```


    For more information about DHCP, consult the DHCP HOW document at /Doc/DHCP.html
    on the CD. This document includes additional configuration ideas and troubleshooting
    tips. The DHCP protocol is found in the Internet document RFC 2131, which you
