  md: 'Your basic system is designed to be all things to all people. It includes a
    nice graphical desktop, it functions as an Internet server, and it includes software
    development tools. Unfortunately, all things people can mean mediocre results
    for everyone.


    This section is full of shortcuts and tricks to help you do a myriad of tasks
    faster and easier and to fine-tune your Linux system so it better suits your personal
    style. You''ll learn how to configure and check system information that''s not
    always easy to see.


    # # Use Your DOS Know-How to Save Time


    If you''re new to Linux, you may have more experience with DOS and Windows. By
    using aliases in Linux, you can put all that DOS experience to work without having
    to relearn everything in Linux.


    # ## Using DOS Commands in Linux


    An alias is a text substitution: When you type one command, the command replaces
    it with another command, according to the alias that


    Example, if you''re accustomed to typing


    ```

    DIR

    ```


    To see a directory listing in DOS, you can make Linux use it the same way. Just
    enter this command at your Linux shell prompt (use quotation marks around the
    right side because it includes spaces):


    ```

    $ alias dir=''ls -la --color''

    ```


    Now enter dir at the Linux prompt and you''ll see a directory listing, just as
    you would in DOS.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# USE YOUR DOS KNOW-HOW TO SAVE TIME


    You can use as many aliases as you like. To see the aliases that are currently

    in effect, enter alias with nothing after it:


    $ alias


    Every user can have a separate set of aliases. Table 1.1 shows a list of some

    common commands and their Linux equivalents. Remember to

    watch for each space, hyphen, and period. (And don''t try entering all of

    these until you learn the trick in the next section!)


    ![](img/ba933c244f3be8993f8191427d25c74c_18_0.png)


    WARNING Linux commands are always case-sensitive and are almost

    always lowercase. You''ll probably want to make all your DOS aliases lowercase

    as well; leave the Caps Lock key turned off.


    ![](img/ba933c244f3be8993f8191427d25c74c_18_1.png)


    # Table 1.1 DOS Commands and Their Linux Equivalents


    | DOS Command | Linux Equivalent |

    |---|---|

    | DIR | -la |

    | DIR /P | -la | less |

    | CD.. | cd .. |

    | COPY | cp -i |

    | REN | mv |

    | DEL | rm -i |

    | TYPE | cat |


    Aliases substitute text even in the middle of a command. If you use this

    alias:


    $ alias copy=*cp -i*


    and then enter this command:


    $ copy file file2'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# DO IT FASTER, EASIER, AND BETTER


    The shell will substitute the alias text so that the command executed is really:


    ```

    $ cp -i file file2

    ```


    > NOTE Some of the Linux equivalent commands in Table 1.1 include safety features
    that will help you avoid overwriting or deleting files in Linux. For example,
    removing a file with rm -i (for "interactive") is always safer than just removing
    a file with rm.


    # Make Your New Commands Permanent


    If you play with the alias command, you''ll find that the next time you log in
    all your aliases have disappeared (enter alias without any parameters to see what
    aliases are in).


    Because every user and every login session can have a different set of aliases
    (a different environment), you need to set up your aliases to be executed each
    time you log in.


    If you''re the system administrator, you can set these up in the system-wide startup
    script, /etc/bashrc, which applies to all users. You can also place the alias
    commands in the startup script in a user''s home directory: .bashrc. This will
    make the commands effective only for that user. Follow these steps to set up permanent
    aliases yourself:


    +   1. From your home directory, open the .bashrc file in a text editor.


    You can use vi, as described later in this section, or any of the easy-to-use
    graphical text editors that are included with Linux (kedit, emacs, crisp, etc.).


    > NOTE Notice that .bashrc has a period at the beginning of the filename. This
    makes it a hidden file.


    +   2. Go to the end of the .bashrc file'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# HOW TO TYPE LESS AND DO MORE


    3. Add lines for each of the aliases that you want to have in each effect time
    you log in. For example, the last few lines of your file look like this:


    ```

    alias dir=''ls -la''

    alias cd..=''cd ..''

    alias copy=''cp -i''

    alias del=''rm -i''

    ```


    4. Save and exit the text editor.


    Now, every time you log, the commands in .bashrc are executed, including the aliases
    that you added.


    One final point. As useful aliases can be as you transition to Linux, they can
    also be a crutch. Using an alias hides the true command from you and may prevent
    you from learning the full command suite of Linux and using the many additional
    options that Linux commands provide. Don''t be afraid to move away from aliases
    as you learn more Linux commands (except perhaps for the safety-related aliases
    that save you from overwriting and deleting files).


    ![](img/ba933c244f3be8993f8191427d25c74c_20_0.png)


    # 2 How to Type Less Do More


    The more you work at a command line, the better your typing becomes. Least, that
    it''s supposed to work. For the rest of us, Linux provides some easy ways to avoid
    typing lengthy filenames and commands. Read on some tips on how to do this.


    # Reuse Commands without Retyping


    When you type a lengthy utility name or complex expression on the command line,
    wouldn''t it be nice to use the same command again without retyping it? DOS had
    a feature like this—you could press F3 to bring up the last command. Or, if you
    used the DOS program in DOS, you could use the up arrow to view the last few commands.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# DO IT FASTER, EASIER, AND BETTER


    The standard command line interface in Linux (the Bash shell) goes a lot further
    in making it easy to use previous commands that you''ve entered. By using the
    history feature of the default shell, you can quickly access the full range of
    previously entered commands, editing them شئ needed.


    Over 100 commands are stored by the shell for each user. To see them listed, use
    this command:


    ```

    $ history | less

    ```


    Or, to see a shorter list, include the number of commands you want to see. The
    most recently used command is listed last:


    ```

    $ history 10

    125 cd shells

    126 ls bashrc

    127 more bashrc

    128 cd /etc

    129 ls -b

    130 more profile

    131 history | less

    132 df

    133 cat /etc/passwd

    134 history 10

    ```


    To execute any of the commands in the history list, type an exclamation point,
    then the number of the command. For example, if I wanted to execute the df command,
    I''d enter:


    ```

    $ 1132 df

    ```


    In this example, the df command is shorter to type. But when you use a very long
    command, using the history number is much easier than retyping the entire command.
    For example, if I had entered this command:


    ```

    $ ps aux | grep httpd /mnt/sundance/pidlogs/http/current

    ```


    An easier way to access recent commands is with the up arrow. When you press the
    up arrow in Linux, the command line changes to show each of your recent commands—and
    you can continue to press the up arrow to list over 100 commands in all.


    Once you use the command that you want to use, you can use the left and right
    arrow keys to move the cursor over it and edit the command as'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# HOW TO TYPE LESS AND DO MORE


    needed to fit your current situation. Press Enter when you''re ready to execute
    the command.


    > NOTE The cursor doesn''t need to be at the end of the line before you press
    Enter.


    You can control the number of history entries that are saved for your account
    by setting the HISTSIZE environment variable. This variable will normally be set
    to something like 100, so 100 commands will be saved. If you''d like to save more
    commands, enter something like this:


    ```

    $ export HISTSIZE=500

    ```


    If you want to set a larger history size permanently, you should include this
    line in the .bashrc script in your home directory.


    Of course, when you have 100 previous commands saved, it might be hard to find
    the one you want. Here''s a workaround to that problem.


    Suppose you entered the long command example given above (ps aux...). To locate
    that command again in a list of hundreds of history commands, use a search command,
    choosing a few characters that you know are of the command you need to locate
    (httpd in this case). So, for example:


    ```

    $ history | grep httpd

    43 ps aux | grep httpd > mnt/sundance/pidlogs/httpd/current

    135 history | grep httpd

    ```


    With this information, you can immediately execute the previous command you need
    to with this statement:


    ```

    $ 143

    ```


