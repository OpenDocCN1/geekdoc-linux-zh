  md: '# 188 TURN YOUR SYSTEM INTO A SUPER-SERVER


    Address Translation system (NAT) to make all of your traffic to the Internet appear
    as if it came from a single IP address. On Linux, this is commonly called IP masquerading.


    Some vendors sell little black boxes that are nothing but NAT systems to allow
    an entire LAN to connect to the Internet through a single modem. Many of these
    boxes, of course, are running Linux.


    Using IP masquerading is conceptually similar to using a Web proxy, but it''s
    done at the IP address level. This means that hosts within your LAN can connect
    to anything on the Internet (that is, anything that you can through the firewall
    that you have surely set up now). The following steps show the process at a simplified
    level.


    +   1. A packet of data destined for the Internet arrives at within your LAN.
    The packet contains a field with the IP address of the host on your LAN.


    +   2. The IP masquerading code in the Linux kernel makes a note of the request
    ID and changes the IP address of the host on the LAN to the IP address of the
    Linux gateway.


    +   3. The packet is forwarded to the Internet normally (as if originating from
    the gateway, however).


    +   4. When a response packet arrives at the Linux gateway from the remote host,
    the IP masquerading code sees that the packet is a response to a request from
    a Linux host.


    +   5. The destination IP address is changed from the Linux gateway to the host
    on your LAN, and the packet is routed within the LAN so that it reaches the request
    that originated.


    In this scenario, the host on your LAN isn''t set up to use IP masquerading and
    in fact can''t tell that the request was handled in this way. In addition, the
    remote host on the Internet doesn''t know anything about the "real” host making
    the request. Everything appears to come from the Linux gateway.


    Since it''s easier to protect one machine (the Linux gateway) than each machine
    on your LAN, this system is inherently more secure. By configuring a strong firewall
    on the Linux gateway and adding a Web and FTP proxy server, your Linux system
    acts as a powerful virtual traffic cop for all the traffic that goes to and from
    the Internet within your LAN.'
