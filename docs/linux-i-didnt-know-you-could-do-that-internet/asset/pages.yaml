  md: '# Turn Your System into a Super-Server


    Networking computers together is a very big topic. Entire books (much larger than
    this one) have been written on the subject. Once you have your basic network up
    and running, however you may not think about how to rearrange it to improve performance,
    increase security, or make it easier to maintain from day to day.


    This part describes how to enhance what your Linux network can do. Many of the
    features described are part of your standard Linux product—you just didn''t know
    all the tricks it could do until now.


    # 36 Connect in New Ways


    Whether you''re using a single desktop Linux system or running a complete Linux-based
    network, once you have your network connection established, you probably don''t
    think much about it. In this section, you''ll see several ways that Linux can
    connect to a network. One might be the one you''re using—or the one you should
    consider using.


    # Connect without Managing IP Addresses


    The bane of running a LAN with Internet connectivity is managing the IP addresses
    of numerous clients. Anytime a configuration change is required, the TCP/IP information
    on each host must be laboriously and individually updated.


    By using the Dynamic Host Configuration Protocol (DHCP), clients are assigned
    an IP address each time they connect to the network. If IP configurations must
    be changed, they can be changed on the DHCP server—one time—and the results are
    propagated to all clients automatically.


    Linux can act as a DHCP client, receiving an assigned IP address from a DHCP server.
    Linux can also act as a DHCP server, assigning IP addresses to clients on your
    network based on a pool of addresses and configuration information you provide.
    Check with your system administrator about the availability of a DHCP server on
    your network.'
  merge: -1
  pgno: 197
- img_proc: true
