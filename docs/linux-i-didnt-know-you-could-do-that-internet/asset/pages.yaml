- img_proc: true
  md: '# Run a Program Automatically Time You Start Linux


    Linux follows a standard process each time you start the system and each time
    you log in using your username and password. Part of the process on both occasions
    is running any startup commands that are found in certain files (I''ll call these
    startup scripts).


    You can add lines to these startup scripts to start programs that you need each
    time you begin using Linux or to set configuration information.


    A script is simple text file containing lines with commands as they would be executed
    from any command line. Linux scripts are similar to DOS batch files, but Linux
    provides much more programming functionality, such as control structures and complex
    conditional tests. You can learn more about that from the bash page.


    Each time you start Linux, the following script is executed.


    ```

    /etc/rc.d/rc.local

    ```


    Actually, many other system configuration scripts are executed as well, but rc.local
    is a good place to add commands that you want to have once for the entire system
    each time you turn on your Linux computer.


    Each time you log in, other scripts are executed (if they exist):


    +   - /etc/profile (for every user on the system)

    - .profile (in your home directory, executed only when you log in)


    Each time you start a new bash shell (such as by logging in or opening an xterm
    window), your working environment is set up by Linux. To do this, the following
    scripts are executed:


    +   - /etc/bashrc (if it exists)

    - .bashrc in your home directory


    On Red Hat 6 Linux, another script named .bash_profile is part of your home directory
    and is executed as well as those listed here. The Bash shell


    ![](img/ba933c244f3be8993f8191427d25c74c_72_0.png)'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'is the default for all Linux systems. If you''ve selected another shell as
    your working environment, such as the C Or Korn shell, a corresponding script
    is executed each time you open a new shell, for example, the .csh or .ksh scripts
    in your home directory.


    Another set of scripts is run each time you start the X Window System. These scripts
    are more complex than the others just mentioned; don''t alter the existing lines
    in these files unless you know what you''re doing. The scripts that are for X
    may also depend on which version of Linux you are running and which graphical
    tools you use (such as KDE, Gnome, fwm, or CDE). The basic scripts to be run include:


    +   * .xinitrc in your home directory

    * .Xclients in your home directory

    * .Xsession in your home directory

    * /etc/X11/xinit/xinitrc

    * /etc/X11/xinit/xclients


    Because these files are used to determine which graphical window manager and desktop
    to start for you, they are executed in the order shown above. For example, if
    you have a file named .xinitrc in your home directory it can specify which desktop
    to start for you when you enter the startx.


    Programs that you want to start when you start X are normally listed at the end
    of the .Xclients file in your home directory. The system-wide Xclients file in
    /etc/X11/xinit might contain the names of programs that will be started for all
    users when they run startx, for example, a desktop pager or clock program.


