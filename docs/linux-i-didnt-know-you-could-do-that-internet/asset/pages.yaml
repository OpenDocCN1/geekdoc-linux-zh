    # Perform Scientific Calculations


    Some programs for Linux focus on imitating popular handheld calculators, such
    as the old Hewlett-Packard HP-67 or TI-30. Others branch out with their own designs.
    These calculator programs are programmatically very simple; most can be prepared
    from the source code with the single command:


    ```

    $ make

    ```


    Binary files are also provided on the CD for the most of these programs, as noted
    in each description that follows.


    Several of the programs described in this section use the Reverse Polish Notation
    (RPN) system. This system is likely familiar to you if you''ve used any of the
    popular HP calculators (other than the business-oriented models). If you''ve never
    seen one, an RPN calculator is: it has no "=" button. Instead, you use Enter to
    "push" numbers into a series of registers, then perform operations keys (like
    "+" or "1/x") to perform actions on the numbers in the registers. One of the registers
    is the display. I''ll walk through a couple of sample calculations with an RPN
    calculator to demonstrate.'
  merge: -1
  pgno: 247
