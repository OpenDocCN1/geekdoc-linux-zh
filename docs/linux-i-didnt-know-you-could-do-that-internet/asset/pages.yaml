- img_proc: true
  md: '# Access NetWare Servers from Linux


    You may not need to create a NetWare file server running on Linux, but if you
    already have NetWare servers on your network, you can still access them from Linux.


    Caldera Systems created a NetWare client for Linux as part of their NetWare development.
    This client allows you to connect to a native NetWare server to share files and
    printers. Some of the features of this client software are as follows:


    +   - It''s based on IPX/SPX, the native NetWare server sees Linux as a regular
    DOS client. Nothing needs to be added to the NetWare.


    +   - The NetWare client integrates into the Linux system. Just go to the /NetWare
    directory to automatically see servers and NDS trees on your network.


    +   - The client is fully NDS-aware.


    Utilities are provided for file and print sharing, allowing you to print directly
    to a NetWare print queue (bindery or NDS-based) and access Net-Ware volumes.


    Utilities are also provided to let you administer a NetWare server from Linux.
    These utilities are both command line and graphical. One advantage of the command
    line utilities is that you can write scripts to perform NetWare administration
    tasks and schedule the scripts to run at any time. For example, you could automatically
    check your file system at 2 A.M. each morning. Or, you could create a set of new
    user accounts after everyone leaves the office for the day (including you).


    These utilities include the following:


    +   - Changing a password


    +   - Viewing or setting file rights


    +   - Viewing or setting object or property rights


    +   - Viewing or changing properties of a bindery or NDS object


