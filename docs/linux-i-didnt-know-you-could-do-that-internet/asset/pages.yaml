- img_proc: true
  md: '# ADD REDUNDANT DISK ARRAYS TO LINUX 259


    One of the first things that you need to know about RAID is the oft-misunderstood
    numbering of RAID devices. For example, you may hear that a device "supports RAID-5".
    RAID-1 and RAID-5 are the most used levels. All of them are explained here:


    +   * RAID-0, or RAID-linear, is the grouping of multiple physical disk partitions
    into a single logical partition. This provides no fault tolerance, but it allows
    a single local file system to grow beyond the bounds of a single physical disk.
    In some cases, striping (normally associated with RAID-0) is used to improve performance.
    Conceptually, striping splits blocks of data and writes them across two or more
    hard disks to increase the chance that both disks can read or write data simultaneously.
    Striping is used a lot in higher RAID levels.


    +   * RAID-4 is like RAID-0, but it adds a separate partition that is used to
    store parity information. This means that if you have, for example, five disks,
    only four are storing data. The fifth is used by the RAID drivers to store a parity
    check of the other four partitions. This parity information degrades performances
    a bit, especially when writing to the disk, but it creates a system where one
    disk can fail and the data can be reconstructed based on the parity partition.


    +   * RAID-5 avoids the bottlenecks of RAID-4 while still providing fault tolerance
    based on parity information that is stored across all of the partitions in the
    disk array.


    Selecting which RAID system to use and deciding how to configure your hard drives
    is part of the flexibility (and potential headache) of SoftwareRAID. You can even
    combine some levels. Linux, for instance, supports laying mirroring (RAID-1) over
    a multipartition logical device (RAID-0).


    Software-RAID in Linux is implemented by selecting a set of kernel options (this
    requires recompiling your Linux kernel). These options are part of the "multiple
    devices driver support" and are shown in Figure 49.1 as part of the block devices
    configuration of the kernel (this figure shows the makeconfig method of setting
    up the kernel).


    ![](img/ba933c244f3be8993f8191427d25c74c_274_0.png)'
