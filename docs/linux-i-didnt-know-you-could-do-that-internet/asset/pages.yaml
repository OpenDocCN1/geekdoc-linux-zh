    For a sensitive network, all access can be denied with only a few small exceptions
    for individual situations (this is sometimes called punching a hole in the firewall
    to allow a person special access). For more general-purpose networks, a looser
    firewall can be set up that lets traffic pass through but is ready to be tightened
    if problems arise from inside or outside the network.


    Why not use the most restrictive rules on every firewall? With security, the more
    secure a system is, the more difficult it is to administer it and the more hassle
    it causes to those who are authorized to use it.


    Linux includes all the firewall features you''re likely to need. In fact, if you
    spend the time to set up a strong Linux firewall file, most users won''t need
    to purchase commercial firewall software. Unfortunately, setting up a Linux firewall
    file is not an easy task; it is certainly not one that can be covered in this
    book.


    Because the IP networking functions of Linux are a core part of the kernel, Linux
    makes both a secure and a fast firewall. In versions of the Linux kernel before
    2.2, the Linux firewall features were configured using a command called iptables.
    This cryptic but powerful command allowed you to set up rules within the kernel.
    These rules determined which packets were passed for normal processing and which
    were dropped without further action.'
