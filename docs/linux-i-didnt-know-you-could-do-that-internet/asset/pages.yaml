    # # 44 Create a Linux Fax Server


    One of the most useful devices in your office is probably your fax machine. By
    using some simple software and your modem, Linux can act as a fax server, replacing
    or augmenting the capabilities and capacity of your cur-rent machine.


    Depending on the features of your model, a Linux server can receive faxes for
    multiple users on your system, delivering them to each individual. It can also
    allow anyone on your network to fax a document through a single modem connected
    to your Linux computer.


    In addition to fax software, which controls your modem and may be able to manage
    incoming and outgoing faxes for multiple users, separate fax viewing utilities
    are available. These permit users to view a file in the fax graphics on screen,
    printing the document only when needed or saving the file for future reference.


    Most of the freely available fax server programs (and some of the commer-cial)
    are based on the HylaFax package. This package is powerful but not especially
    easy to use; hence, many developers have used it as a base but attempted to build
    an easy-to-use interface on top of it.


    The HylaFax package is included as source code on the CD at /Source/Business.
    Two binary packages are also included: a Red Hat package in rpm format (you can
    try it on other platforms as well) and a generic Linux binary in tar.gz format.
    These are located at /Binaries/Business. The easiest way to get HylaFax installed
    if you''re using Red Hat 6 or another


