  md: '# The Powerful WordPerfect for Linux


    Corel Corporation, which owns WordPerfect, has made a strong commitment to Linux.
    The WordPerfect 8 word processor is available for Linux now; other Corel suite
    packages are promised for the future.


    As with other commercial packages, WordPerfect cannot be included on the CD here,
    but you can download it for free from the Corel site at http://linux.corel.com
    by registering your name and e-mail address.


    In addition to the download version of WordPerfect for Linux, you can choose a
    personal or server version of the product. These versions add features such as:


    +   * A library of several thousand clip art images

    * Printed documentation

    * A character-based version of WordPerfect for use in host environments

    * Server license management


    All three versions (including the free download) include the following:


    +   * Cross-platform compatibility (the same file format used on WordPerfect for
    all platforms)

    * Document management and revision control

    * Complex tables with 90 built-in spreadsheet functions

    * Internet publishing

    * Charting and drawing tools

    * Comprehensive grammar and spelling tools


