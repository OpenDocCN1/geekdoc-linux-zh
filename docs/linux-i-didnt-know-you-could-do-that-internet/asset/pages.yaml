  md: '# Access Linux Files from DOS or Windows


    Most of us use several operating systems regularly—or at least we have friends
    who do and we often need to share information with them. The tools described in
    this section show you how to share information between DOS or Windows and your
    Linux system.


    # Access DOS Floppies without Mounting


    Linux systems (including Red Hat 6) install the mtools package by default. This
    package provides easy access to DOS-format diskettes using DOS-style commands
    with drive letters. For example, if you have mtools installed on your Linux system,
    you can copy a file from a DOS diskette with this command:


    ```

    $ copy A:report /home/nwells

    ```


    The mtools package is included in /Source/Disk Tools on the CD. Binaries aren''t
    prebuilt on the CD most distributions include this package already installed or
    available. Mtools includes a full set of "DOS-like" utilities. The most used utilities
    are listed in the following table:


    | MTOOLS COMMAND DESCRIPTION |

    | mdir | mdir A: | Shows the contents of the floppy drive named |

    | mcopy | mcopy A:report /home/nwells | Copies a file to or from a floppy drive
    |

    | mread | mcopy report.ps A: / mread A:report /home/nwells | Copies a file from
    a floppy drive to the Linux hard disk |'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# 44 MANAGE YOUR FILES LIKE A PRO


    | COMMAND | EXAMPLE | DESCRIPTION |

    | --- | --- | --- |

    | mwrite | mcopy report.ps A: | Copies a file from the Linux hard disk to a floppy
    drive |

    | mformat | mformat A: | Formats a floppy (DOS-format) |


    Remember that you use an mtools utility, you don''t have to mount the floppy disk
    drive first. These utilities are about the only time you''ll see the old DOS drive
    letters used in Linux.


    > NOTE If you have mounted a floppy drive using the mount command or an automounter
    program (including something like the Desktop icons in KDE or Gnome), the mtools
    utilities may have trouble accessing your floppy drive.


    # Access Windows Partitions within Linux


    If your Linux system dual boots between Linux and Windows, you probably need to
    access the data on your Windows partition from time to time while you''re running
    Linux.

    Instead of rebooting and copying data to a floppy disk, you can use the standard
    mount command in Linux to access other partition types (such as DOS or Windows
    98) as if they were part of your file system. You can view, copy, and create files
    on the Windows partition. Any new files you create will also appear within Windows.
    Long filenames are supported as well for FAT32 systems.

    To access your Windows partition within Linux, you need to know the hard disk
    and partition number that Windows is using. For example, if you have three partitions
    on your first hard disk, Windows might be stored on /dev/hda3, the third partition
    of the first hard disk. You can use fsk to carefully look at your partition information.


    +   - Create a directory to use as a mount point for accessing Windows.


    ```

    # mkdir /mnt/win

    ```'
