    # Hide Password Files with Shadow Passwords


    The hardcrack program and others like it assume that a potential intruder can
    get a copy of your password file (/etc/shadow) or at least one encrypted password
    from it.


    The shadow password method is used on many Linux systems today, including Red
    Hat 6 (if you left the installation defaults as they were set). This method uses
    password utilities to access a file that can only be read by the root user. In
    contrast, the /etc/shadow file can be read by any user, giving everyone access
    to the encrypted passwords.


    By using shadow passwords, you can also enforce security features like minimum
    password length and maximum time between updates.


    Shadow password information is stored in /etc/shadow on your Linux system. To
    learn more about shadow passwords, see the man pages for the shadow file, the
    passwd utility, and the usermod utility, which are included with all recent Linux
    distributions. These man pages should also be installed on your Linux system.
    For further reference, point your browser to this document: /Doc/Shadow-Password-HOWTO.html.


    ![](img/ba933c244f3be8993f8191427d25c74c_32_1.png)


    # Use Nonpassword Authentication


    If all this talk about passwords is making you nervous about the security of your
    system (as it should), consider using Pluggable Authentication Modules (PAM) to
    avoid standard passwords altogether.


    ![](img/ba933c244f3be8993f8191427d25c74c_32_2.png)'
  merge: -1
