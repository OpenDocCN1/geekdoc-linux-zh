- img_proc: true
  md: 'Once you have unpacked the archive, run the install-uvscan script for the version
    you choose to run (a.out or ELF) to install the Linux virus-scanning program:


    ```

    # /install-uvscan

    ```


    The uvscan binary file is installed in the /usr/local/bin directory. This is the
    program file that actually scans for viruses. To execute it, simply include the
    file name you wish to scan (or a wildcard to check all files in a directory).
    Uvscan can check both Linux and Windows files for viruses:


    ```

    # /usrlocal/bin/uvscan

    ```


    Some of the command line options available with uvscan include


    +   * Clean infected files, if possible

    * Delete infected files

    * Check files based on their file extension

    * Ignore compressed files

    * Descend into subdirectories

    * Look for macro viruses with varying levels of sensitivity


    You can see all of the options by using this command:


    ```

    # uvscan --help | less

    ```


    One of the more interesting options is --virus-list. This option causes uvscan
    to print the list of virus variants that it search for. I counted 12,478 items
    in the list (many are simple numeric codes, but you''ll recognize the size of
    the names).


