    # 50 Supply Uninterrupted Power to Linux


    It''s actually very easy to supply uninterrupted power to Linux. Simply plug your
    PC, monitor, and other peripherals into a diesel generator and keep filling it
    with gas until the main power comes back. Battery-based backup systems are cleaner
    and quieter, but they don''t last forever. In fact, most uninterruptible power
    supply (UPS) devices are designed to allow you a few minutes to save your files
    and gracefully shut down your system. This prevents file system corruption and
    gives you a chance to let any networked users know about the system going down.'
