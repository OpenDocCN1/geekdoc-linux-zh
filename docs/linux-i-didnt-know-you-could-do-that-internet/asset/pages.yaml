- img_proc: true
  md: '# Make Your Linux System a Desktop OS


    With the growing sophistication of KDE and Gnome desktops, new users are becoming
    accustomed to the power of a full-featured GUI. Still, the desktop you download
    or install by default on Linux doesn''t include all the tools and toys that these
    other fancy desktops have available.


    This part adds-ons for KDE and Gnome that you can integrate with your desktop.
    These add-ons include attractive graphical toys and practical utilities that are
    integrated with the desktop. The focus in this part is not on system administration,
    however—it''s on adding features to your desktop that you didn''t know were possible
    to add.


    If you don''t have a copy of KDE or Gnome on your Linux system, check on the CD
    under /Binaries/KDE.1 or /Binaries/Gnome to get the software you need. Packages
    are provided in several formats and for several distributions.


    When you install Red Hat 6, you can select KDE as an option. If you do, the KDE
    menus are included as a submenu of the Gnome desktop. If you prefer to work in
    Red Hat only in KDE (leaving Gnome), launch the switchdesk application from the
    Gnome desktop.


    Because Gnome is the default Red Hat interface and was developed in cooperation
    with Red Hat, you''re unlikely to need the packages in the /Binaries/Gnome directory
    unless you need to add an application that wasn''t installed by default. For other
    distributions, follow the instructions in the Gnome directory to begin working
    with Gnome as your desktop.


    Additional versions of the Gnome and KDE packages are available on the Internet
    sites for these desktops. If you are using a Linux version that does not use rpm
    (such as Debian or Slack), you should download the packages built specifically
    for your system. The place to begin is either http://www.gnome.org or http://www.kde.org.
    If you decide that you prefer to use KDE as your desktop on Red Hat 6, just run
    the program switchdesk-kde and select KDE as your desktop in the dialog box that
    appears. You can run the utility again to switch back to Gnome. (Delete the file
    .Xclients in your home directory if the switching back doesn''t seem to work smoothly).


    ![](img/ba933c244f3be8993f8191427d25c74c_103_0.png)'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Run Office Suites on Linux


    The rumor is that Microsoft has a team working on Microsoft Office for Linux.
    While we''re waiting for that to materialize, however, Linux has a col-lection
    of good office suites that are available today. Some are commercial, some are
    free. Most even include the ability to exchange files with Microsoft Office packages.


    # Use a UNIX Standard: AppliWare


    The AppliWare suite has been around in the UNIX world for years. Now it''s available
    for Linux and provides a very stable and complete commercial office suite. The
    creator of AppliWare, Appix, Inc. (see http://www.applix .com) recently announced
    a separate Linux division.


    AppliWare includes the following components, all available from a single master
    window on your graphical desktop (any graphical desktop):


    +   * Word processor

    * Spreadsheet

    * Presentation graphics

    * Vector graphics

    * E-mail Client

    * HTML authoring tool

    * Database client

    * Application builder (development toolkit)


    ![](img/ba933c244f3be8993f8191427d25c74c_104_0.png)


    The AppliWare word processor includes a complete set of input filters, allowing
    you to work with files from FrameMaker, Word 97, WordPerfect 7, and many other
    formats. Similar filters are provided with the other AppliWare components.'
  merge: -1
