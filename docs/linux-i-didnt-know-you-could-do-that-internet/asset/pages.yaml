- img_proc: true
  md: '# CLONE A WINDOWS NT SERVER ON LINUX 207


    To add individual users to the Samba password file, use the smbdduser command
    with a username from your Linux system. For example, I already have a user named
    nwells on Linux, so I can add that user to the smbpasswd file using this command:


    ```

    # smbdduser nwells:nwells

    ```


    The name after the colon (also nwells in this example) is the user account for
    Windows systems, which may differ from the Linux username. After you enter this
    command, you are prompted to enter a password (twice) for Samba access for this
    user (coming from a remote client).


    For any user that part of the smbpasswd file, you can use the smbpasswd command
    (the command and the file have the same name) to change the password for a user.


    ![](img/ba933c244f3be8993f8191427d25c74c_222_0.png)


    ```

    # smbpasswd nwells

    New SMB password:

    ```


    You must enter the password twice to confirm it. The password is in the smbpasswd
    file.

    The important part of setting up these users is that matching username and password
    exist on both the Linux Samba server (in smbpasswd) and on the Windows client
    that attempts to connect to the server. Don''t bother with the smusers file that
    you see in the same directory: It''s intended to map Linux users to Windows users,
    but it isn''t used in this example configuration.

    Your configuration is now complete. To make it take effect (and to start the Samba
    server if it didn''t start because of a missing configuration file), use this
    command for Red Hat Linux:


    ```

    # /etc/rc.d/init.d/samba restart

    ```


    Or, for OpenLinux, use these commands:


    ```

    # /etc/rc.d/init.d/samba stop

    # /etc/rc.d/init.d/samba start

    ```


    Similar commands should apply to all Linux systems. Go to the /etc/rc.init.d directory
    on your Linux system and look for a script named smb or samba. Scripts in this
    directory are used to stop and start system services.


    Finally, run the ps command given previously to see if the smbd and mbnd processes
    are running.'
