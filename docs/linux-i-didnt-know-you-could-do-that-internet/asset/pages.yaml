- img_proc: true
  md: '# RUN ANY PROGRAM ANY TIME 63


    NOTE As with the at command, output from any commands you run crontab is mailed
    to you. If you don''t include a MAILTO setting as in this example file, the e-mail
    will come to whomever submitted the command file using crontab.


    Figuring out the definition of when to execute the command is the challenge with
    crontab files. Each of the five fields are described in the following table, from
    left to right as they appear on each command line of the sample file above.


    | Minute | 0–59 |

    | Hour of the day | 0–23 |

    | Day of the month | 0–31 |

    | Month | 0–12 (or names, using the first three letters, upper- or lowercase)
    |

    | Day of the week | 0–7 (or 7 is Sunday); names can also be used, with months)
    |


    If a field contains an asterisk, all possible values are used for that field.
    For example, if an asterisk is in the Month field, the command is executed every
    month; if an asterisk is in the Hour field, the command is executed every hour.
    Looking more closely at the example file, the following line will run the command
    portion (starting with $HOME/bin/daily.job) every date of the year five minutes
    after midnight (midnight:0):


    ```

    $ run five minutes after midnight, every day

    5 * * * * $HOME/bin/daily.job >> $HOME/tmp/out 2>&1

    ```


    The output from the daily.job script will be directed to the end of the out file
    (the /tmp/out path within your home directory) because of the >> operator. Any
    errors that occur are also sent to the file as regular output (the 2>&1 does this).


    To change this to run only on Mondays, the first five fields would change like
    this:


    ```

    5 * * * 1 $HOME/bin/daily.job >> $HOME/tmp/out 2>&1

    ```'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'To run on the 1st, 10th, and 20th of every month, they would be:


    ```

    5 0 1,10,20 * * $HOME/bin/daily.job >> $HOME/tmp/out 2>&1

    ```


    When you use a list or range of times like this (1.10,20), don''t use a space
    between the commas. A space is only used to separate the five fields.


    Once you have a file set up with your commands and their times and days of execution,
    you simply submit that file to the system using the crontab


    ```

    $ crontab my_cron_file

    ```


    That''s the only step. All the commands in the file are stored internally. The
    cron process checks once each minute as long as your system is turned on. Any
    commands that are scheduled for execution are run and the output is e-mailed to
    you.'
