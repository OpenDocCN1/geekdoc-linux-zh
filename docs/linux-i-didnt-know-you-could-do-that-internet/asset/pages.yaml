  md: '# Retrieve Files When You Didn’t Plan Ahead


    Even if you didn''t use a tool like safedelete to store deleted files, e2recover
    utility can attempt to recover your files and sometimes a good job of it, depending
    on how much your hard disk has been used since you deleted the files.


    Linux allows space for files via a series of pointers on the hard disk. The pointers
    have been deleted, the original location and contents of a file may be very hard
    to put back together.


    The e2recover operates using information provided by the debugfs utility, which
    is a part of most Linux distributions.


    To use e2recover, you don''t specify the filename you want to undelete. Instead,
    you specify a directory where all the recovered files will be placed. The binary
    for e2recover is located on the CD at /Binaries/Disk Tools/


    Part of the e2recover package is the fsgrab utility. This program grabs raw blocks
    of data from a device like your hard disk. E2recover uses fsgrab to gather blocks
    of data from deleted files and assemble them into regular files.


    To use the fsgrab utility, you specify a device, the number of blocks to skip
    before reading, and the regular file to write the blocks into. Additional options
    are possible, but these will usually do the job.


    For example, you might have an fsgrab command like to read five blocks from the
    device /dev/hda3, starting at block 147, and write those blocks to the file restored.
    file:


    ```

    # fsgrab -d /dev/hda3 -s 147 -c 5 -o restored.

    ```


    Learn more about fsgrab, use the following command or read the page in the Binaries
    directory on the CD:


    ```

    # fsgrab -help

    ```


    > NOTE The fsgrab command can be useful in its own right, but you don''t use it
    explicitly to recover deleted files. The e2recover command will do it for you.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# 9 Completely Destroy Sensitive Files


    Although it''s nice to have an undelete command with e2recover, sometimes the
    last thing you want is for someone to be able to recover a file that you deleted.
    Financial data and other personal or business files sometimes need to be obliterated
    from your system for security reasons.


    The shred utility is just the right tool to erase a file so that it cannot be
    reconstructed or undeleted. When you use shred, the contents of a file are actually
    overwritten six times, ending with random data. The file is then deleted normally
    so the filename no longer appears on your system.


    The shred utility is located in /Binaries/Disk Tools/shred on the CD. To use this
    utility, simply include the filename that you want to permanently erase from your
    system:


    ```

    $ shred filename

    ```


    > WARNING Remember that when you use shred to delete a file, the file cannot be
    recovered. Be especially careful when using shred with any wildcard characters.
    Avoid running shred when you are logged in as root.


    # 10 Completely Destroy an Entire Hard Disk


    Using the shred utility is a great way to protect sensitive data files from prying
    eyes that might try to undelete them. Occasionally, you may need to destroy the
    data on an entire hard disk or disk partition as well.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# 38 MANAGE YOUR FILES LIKE A PRO


    This might be useful when you rent or borrow a computer and need to erase your
    data before returning it, for example, or if you are changing to a new department
    at work and must leave your old PC behind.


    The diskerase utility can be used to erase all of your data in situations like
    these. The program can be used in two ways:


    +   - To erase all partitions on a hard disk

    - To erase all information on a single partition of a hard disk


    This utility is located at /Binaries/disk Tools/diskerase on the CD. Several optional
    parameters are available when you use diskerase. The most useful your hard disk
    with a string of characters that you choose.


    To use diskerase to erase an entire hard disk (all of the partitions and partitioning
    information on the hard disk), use a command like this:


    ```

    # diskerase /dev/hdb

    ```


    In this example, /dev/hdb is the second IDE hard disk. You can use any Linux hard
    disk designation as the device name. To fill the hard disk with a repeated string,
    such as "Sybex," use -s "Sybex"


    ```

    # diskerase /dev/hdb -s ''Sybex''

    ```


    If you don''t specify an -s option, the disk is filled with zeros.


    To use diskerase to erase a single partition on your hard disk, use a command
    like this:


    ```

    # diskerase /dev/hda3

    ```


    This example wipes the contents of the third partition on the first IDE hard disk.
    The other partitions on the hard disk and the partitioning information itself
    is not touched by this command. The -s option can also be used to fill a partition
    with a repeating string.


    ![](img/ba933c244f3be8993f8191427d25c74c_53_0.png)


    WARNING Don''t forget the partition number on the device name, or your entire
    hard disk will be erased. Be certain that you know which partition needs to be
    erased!'
