    ## End of Chapter Conclusions & Recommendations


    - It is important to limit the usage of setuid to only required binaries to reduce
    the security threat.

    - A regular check for the binaries and directories that are created on the system
    with setuid activated on them must be checked to identify the unusual ones.

    - Configuring the firewall properly by eliminating the unused ports and services
    is important to reduce the security threat.

    - Sensitive files and directories on the system must be immunized to secure them
    from deletion and removal.

    - Dealing with the secure version of transferring files and directories like scp
    and sftp ensures that the communication is secured and not sniffed easily by attackers.

    - Centralizing the storage in companies and institutions is considered to be convenient
    and can be accomplished easily using the mount command.


    ## Chapter IV


    # Advanced Linux Tools


    ## Chapter Objectives


    - To test and explore the logging system in Linux and the provided options.

    - To tune and modify the system logging configuration file according to the requirements.

    - To use the log rotation functionality in Linux to rotate log files.

    - To explore the vulnerabilities in old GRUB versions and modify the settings
    to secure the host.

    - To investigate and explore HIDS and files integration utilities in Linux.


    ## Needed Tools


    - Fedora 24 Workstation image.

    - Fedora 18 Workstation image.

    - Oracle VirtualBox.

    - Syslog package.

    - Logrotate package.

    - Apache http server.

    - Tripwire package.

    - Syslog-ng package.


    ## Chapter Overview


    Security should be one of the first considerations at all stages of setting up
    Linux. Securing Linux machine is a primary responsibility and maintaining a secure
    environment become one of the main priorities when dealing with Log files. The
    first subsection is titled with **Syslog Basics** in which test in logging for
    multiple facilities and priorities were implemented and their log files were viewed.
    **Fine Tuning the Defaults** subsection a modification was implemented to syslog
    configuration to add an extra facility to be logged

