    # Password files


    Recently most linux distributions stores the information about the users in three
    main files /etc/group, /etc/passwd, /etc/shadow files. /etc/group includes information
    about the groups and users that are created on the system while /etc/passwd includes
    a list for all the users displayed with the following details: Login name, Password
    field, User ID, Group ID, Home directory, Login shell. The /etc/shadow file has
    a hashed version of the passwords that cannot be accessed by any user other than
    the root. The content of /etc/passwd was viewed using the more command as shown
    in Figure 2.6. It is always more convenient to retrieve the information for the
