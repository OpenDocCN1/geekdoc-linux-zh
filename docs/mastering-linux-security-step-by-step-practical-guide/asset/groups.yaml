    - Linux 是一个稳定且去中心化的操作系统，提供了各种实用的工具。

    - 使用开源操作系统为维护系统提供了灵活性。

    - 建议在物理机上安装 Linux 以获得更好的性能。

    - Linux 内置了一个名为 `man` 的命令，用于显示系统内任何命令的说明书和使用指南。

    - 始终建议在需要时使用 `su`，而不是直接以 root 身份登录。

    - Linux 操作系统分配了多个变量，如 SHELL、PATH、USER 等，这些变量可以与命令有效配合。

    - 建议用户终止任何未使用的进程，以提高系统性能并减少被黑客攻击的机会。

    - 保持操作系统更新到最新补丁，以确保安装了最新的安全更新。


    ## 第二章


    ## 探索各种安全工具


    ## 本章目标


    - 理解并使用高级 Linux 工具。

    - 探索并实现软件包的安装与分析。

    - 练习各种命令以加固系统，并在系统上或通过网络跟踪用户活动。

    - 通过对控制服务实施良好实践，保护控制台不受拒绝服务攻击。

    - 消除对系统的直接远程连接并对未经授权的活动发出警告。


    ## 所需工具


    - Fedora 24 Workstation 镜像。

    - Oracle VirtualBox

    - Wireshark


    ## 本章概述


    Linux 操作系统提供了一组实用的预装工具，允许用户轻松完成所需任务，它还提供了多个可以安装以用于不同目的的应用程序和包。在没有限制和约束的情况下使用这些工具将导致许多本可以通过应用简单安全标准防止防止突破。攻击者可能通过远程连接到系统并利用控制台提供的弱权限运行某些控制台应用，导致拒绝服务攻击。敏感文件或目录的权限配置不当会导致其暴露给黑客，黑客可以对其执行未经授权的操作。此外，根据安全要求为每个用户设置权限是防止受所有操作影响的重要问题，“任务与步骤”部分详细解释了如何根据截图执行本章的六部分中的每一部分。报告每个部分的目标如下：


    第 0 部分的目标是测试并验证 Linux 是否允许用户使用 `halt`、`reboot`、`shutdown`、`power off` 或 `eject`
    等多个命令重启或关闭服务器，这可能会导致服务器遭受拒绝服务攻击。


    第 1 部分的目标是使用 `umask` 命令通过三位八进制数确定新创建文件的权限，并根据 `umask` 命令更改默认权限集。


    第 2 部分的目标是发现存储在 "/etc/passwd" 中的账户信息，并查看当前登录用户的详情。


    第 3 部分的目标是允许非 root 用户像 root 一样执行特定命令，以便能够访问 `sudo` 文件并将用户添加到指定的命令中。此外，查看审计日志并确定发生了哪些特定操作。


    第 4 部分的目标是探索允许用户安装、管理和更新软件包的各种工具。还包括从各种网站下载包并通过 `rpm` 和 `yum` 工具处理它们。


    第 5 部分的目标是探索如何通过使用 `xlock` 命令在离开运行机器运行时锁定来加固系统，能够禁用应用程序以防止拒绝服务攻击，能够通过修改禁用 ssh
    和 telnet 禁用的直接 root 远程登录，最后从登录界面隐藏所有相关信息，并显示 `motd` 和 `issue` 文件中的警告消息。


    第 6 部分的目标是安装 Wireshark 软件包作为网络包嗅探工具，探索用于活动追踪的不同接口选项，能够使用 Wireshark 嗅探 HTTP 网站输入的用户名和密码。


    ## 任务与步骤


    ## 风险是什么


    远程连接用户拥有执行和运行某些控制台应用的权限可能会引发各种安全风险；其中一个主要风险是，如果攻击者对系统执行 `halt`、`shutdown` 或 `reboot`，可能会导致拒绝服务攻击。


    在本节中，在 VirtualBox 上安装了两个 Fedora 工作站。其中一台机器被配置为托管 ssh 服务，而另一台通过 ssh 与其通信。通过建立的
    ssh 连接，应用 `halt` 命令来测试对另一台机器的影响。图 2.1 显示了处于活动 ssh 连接状态客户端和服务器机器。如图 2.2 所示，远程用户能够通过
    `halt` 命令停止另一台机器。


    ![](img/7be05572b414927ff78ba38f31a7ecfc_59_0.png)


    图 2.1：在安装在 VirtualBox 上的两个工作站之间建立了 ssh 会话。


    ![](img/7be05572b414927ff78ba38f31a7ecfc_59_1.png)


    图 2.2：使用 ssh 远程连接对另一台 Fedora 机器应用 `halt` 命令，导致机器停止。


    ## 默认文件权限


    处理每个新创建的文件或目录的权限并非易事，同时，敏感文件或目录的权限配置不当会导致其暴露给黑客，黑客可以修改或删除它们。


    在本节中，在同一个终端窗口和新终端窗口中应用 `umask` 命令之前，检查了分配给新创建文件的默认权限。使用 `touch` 命令创建了一个新文件，赋予给该创建文件的默认权限如下：**所有者
    (Owner)**：读与写，**组 (Group)**：读与写，**其他 (Others)**：仅读，如图 2.3 所示。使用 `umask` 命令赋予所有者完全访问权限，并移除组和和其他的所有权限，完成此任务使用的值值为
    077。从图 2.4 可以看出，即使所有者应该拥有执行权限，但也仅分配了读写权限，因为使用 `umask` 命令设置的文件的最大权限只有读和写。图 2.5
    显示打开了一个新终端并创建了一个文件，该文件的权限采用了默认权限，之前应用的 `umask` 在新终端未生效。当启动新会话时，终端将从 `/etc/bashrc`
    或 `/etc/profile` 文件获取默认权限，所有新创建文件的 `umask` 默认值为 002，这就是为什么切换到新终端后 `umask` 会发生变化。


    ![](img/7be05572b414927ff78ba38f31a7ecfc_60_0.png)


    图 2.3：使用 `touch` 命令创建了新文件 "testfile"，默认权限为 664。


    ![](img/7be00572b414927ff78ba38f31a7ecfc_60_1.png)


    图 2.4：即使将 `umask` 修改为 077，新创建的文件只有读权限。


    ## 密码文件


    最近大多数 Linux 发行版在三个主要文件中存储用户信息：/etc/group、/etc/passwd 和 /etc/shadow。etc/group 包含了系统中创建的组和用户信息，而
    /etc/passwd 包含了所有用户列表，并显示以下详情：登录名、密码字段、用户 ID、组 ID、主目录、登录 shell。etc/shadow 文件拥有密码的哈希版本，root
    用户之外的任何人无法访问。使用 `more` 命令查看了 /etc/passwd 的内容，如图 2.6 所示。通过将 `cat` 的输出通过到 `grep`
    来获取感兴趣用户的信息总是更方便的，如图 2.7 所示。


    ![](img/7be05572b414927ff78ba38f31a7ecfc_61_0.png)


    ![](img/7be05572b414927ff78ba38f31a7ecfc_61_1.png)


