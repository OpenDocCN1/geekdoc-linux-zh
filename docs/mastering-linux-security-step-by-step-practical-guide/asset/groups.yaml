    # Chapter II


    # Exploring Various Security Tools'
  - '[PAGE 57]


    # Chapter Objectives


    +   - To understand and use advanced Linux tools.

    - To explore and implement the installation and analysis of software packages.

    - To practice various commands to secure the system and trace user activity on
    the system or through the network.

    - To secure the console from a denial of service attack activities by implementing
    good practices to console services.

    - To eliminate direct remote connection to the system and warring unauthorized
    activities.


    # Needed Tools


    +   - Fedora 24 Workstation image.

    - Oracle VirtualBox

    - Wireshark


    # Chapter Overview


    Linux OS provides a useful set of preinstalled utilities that allows the user
    to perform the required tasks easily, it also provides multiple applications and
    packages that can be installed to be used for different purposes. Using these
    utilities without limitations and restrictions would allow many of the breakthroughs
    that can be prevented by applying simple security standards. An attacker may cause
    a denial of service attack by running some of the console apps by remotely connected
    to the system using the weak permissions provided to the console. The misconfiguration
    of the permissions of a sensitive file or directory will result in exposing it
    to hackers that can perform unauthorized actions to it. Also setting the permissions
    for each user according to the security requirements is an important issue to
    be protected from all actions, the Tasks and Procedures section explains thoroughly
    how each of the sixth'
  - '[PAGE 58]


    parts of the chapter was performed in accordance with the screenshots. The aim
    for each part of the report is as follows.


    The aim of part 0 to test and verify that Linux allows users to reboot or shutdown
    the server using multiple commands such as halt, reboot, shutdown, power off,
    or eject which could cause a denial of service to the server.


    The aim of part 1 to determine the file permissions for newly created files using
    three-digit octal number with a umask command, and to change the default set of
    permissions based on the umask command.


    The aim of part 2 to discover user account information stored in "/etc/passwd",
    and view the details of the current logged in user.


    The aim of part 3 to allow non-root users to execute particular commands as if
    they were the root, to be able to access the sudo file and add a user to the determined
    commands. Also to view the audit log and determine particular actions occurred.


    The aim of part 4 to explore various tools that allows the users to install, manage
    and updates software packages. Also to download packages from various sites and
    handle them through rpm and yum tools.


    The aim of part 5 to explore how to secure the system by locking when we leave
    the machine running using xlock command, to be able to disable applications to
    avoid denial of service attack, to be able to disable the direct root remote login
    through ssh and telnet a modification and finally to hide all related information
    from the login screen and display a warning messages motd and issue files.


    The aim of part 6 to install Wireshark software package as tools for sniffing
