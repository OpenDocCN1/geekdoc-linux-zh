    # 第一章

    # Linux 操作系统入门


    # 本章目标


    - 熟悉 Linux 操作系统环境。

    - 使用 Linux 终端执行各种任务。

    - 探索和使用 Linux 工具和命令。


    # 所需工具


    - Fedora 24 工作站镜像。

    - Oracle VirtualBox


    # 本章概述


    Linux 是一个开源操作系统，提供了许多帮助专业人士高效、简单地完成任务的工具。Linux 在行业内被认为是最稳定的操作系统之一。普通用户可能不倾向于使用
    Linux 操作系统，因为它最初的设计是为了通过命令行界面供专业用户使用。本章主要目的是介绍 Linux 操作系统并执行多个任务并在上面实现和测试各种命令。“实验与练习”部分详细解释了本章的各个部分是如何根据截图执行的。报告每个部分的目的是如下：


    第 1 部分的目标是练习基础 Linux 命令，并发现列出文件及其显示属性和权限的不同命令，显示 Shell 和用户信息，以及如何利用 `man` 命令的帮助阅读任何命令手册及其属性。


    第 2 部分的目标是使用 `mkdir` 命令在不同位置创建目录，并使用 `rmdir` 删除目录（如果目录为空），使用 `rm -rf` 是删除包含所有内容的目录的最佳选项。


    第 3 部分的目标是探索不同的输出重定向命令，以覆盖文件内容或向现有文件添加内容，同时使用 `cat` 命令查看文件内容并确认文件发生了更改。


