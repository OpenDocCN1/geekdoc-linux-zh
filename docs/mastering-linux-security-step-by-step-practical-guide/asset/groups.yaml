  - '[PAGE 9]


    The aim of part 4 to manipulate the files by renaming the files names, moving
    the files from one directory to other directories, copying the files to different
    directories and finally removing files and directories with all its content.


    The aim of part 5 is to allow the owners of the files to set permissions of the
    files and directories. chmod command used to allow or restrict access of files
    & directories created by you or others. Permission changed regularly based on
    files importance.


    The aim of part 6 to create a soft (symbolic) link using Ln -s command to an existing
    file, then practice different scenarios of the linked files by updating and deleting
    the original file and discover the changes occurred over the linked files.


    The aim of part 7 to learn how to install packages using yum command and run the
    processes in foreground and background notice the differences, also as a second
    goal is to list the processes that are running in the background and use the kill
    command to terminate it.


    The aim of part 8 be to play with root user and running tasks through cronlab,
    also to be able to define certain users from cron utility by adding a list of
    denied users in cron.deny file, finally to be familiar of creating new users using
    graphical tools.


    The aim of part 9 to use ssh command to be able to login to Linux server, to use
    different Linux commands to see who is on the server, accessing others'' files
    and read them and updating their files and see what they are doing.


    The aim of part 10 to be able to install KALI Linux through VirtualBox or VMware
    workstation.


    # Basic Linux Commands


    The task started by installing and accessing fedora Linux at the virtual machine
    and starting a new terminal window. Several basic commands have been applied to
    experiment their effects, these commands are as follows:


    +   - date command to print the current date and time. (Figure 1.3)

    - cal command to present the calendar for the current month. (Figure 1.4)

    - ls command to list the known files not starting with ".". (Figure 1.5)

    - ls -a command to list all files and folder, including hidden ones. (Figure 1.6)

    - ls -l command to list the files and folders with permission and ownership information.
    (Figure 1.7)

    - clear command to clear the screen and start with an empty shell. (Figure 1.8)

    - cat .bash_profile to display startup file which is bash_profile. (Figure 1.9)'
