  mdcn: "\n\n## 成为超级用户\n\nLinux 的多用户属性为系统提供了额外的保护和安全性；所有用户将拥有一有限的权限，而 root 用户将拥有最高权限的系统完全访问权限。在此部分中，实验涵盖了创建新用户，并通过\
    \ `cron` 命令作为测试用例修改了当前用户的权限和访问级别。\n\n```\nituser@MB8007225:~\nFile Edit View Search\
    \ Terminal Help\n[ituser@MB8007225 -$ whoami\nituser\n[ituser@MB8007225 -$]#\n\
    ```\n\n图 1.76：whoami 命令结果显示当前登录的用户是 Ituser\n\n```\nituser@MB8007225:/home/ituser\n\
