    \ touch ituser\nroot@z10150# ls\nDocuments Downloads Music Pictures salimIsHere\
    \ Templates Videos\nroot@z10150#\n```\n\nFigure 1.95: listing the files of ituser\
    \ ls commands\n\n## root@z10150/ituser\n\n```\nroot@z10150# ls\nAdministrator\
    \ Downloads Music Pictures salimIsHere Videos\nsalimIsHere Public Template ZAYEDIsHere\n\
    root@z10150# cd Documents\nroot@z10150# cd Documents\nroot@z10150# cd Downloads\n\
    root@z10150# cd Downloads\nroot@z10150# cd Music\nroot@z10150# cd Music\nroot@z10150#\
    \ cd Public\nroot@z10150# cd Public\nroot@z10150#\n```\n\nFigure 1.96: creating\
    \ a file in ituser home directory using touch command\n\nFigure 1.97: accessing\
    \ ituser directories and view them.\n\n## Using VirtualBox and Kali Linux\n\n\
    Linux is having a great number of flavors and distributions on the internet, and\
