    12.3 for x86_64 |

    | xlock-5.3-9.1.1506.i664 | Screen Saver and Lock for the X Window | OpenSUSE
    12.2 for x86_64 |

    | xlock-5.3-7.2.1586.i686 | Screen Saver and Lock for the X Window | OpenSUSE
    12.1 for x86 |

    | xlock-5.3-7.2.1586.i664 | Screen Saver and Lock for the X Window | OpenSUSE
    12.1 for x86_64 |

    | xlock-5.3.4.2.1506.i686 | Screen Saver and Lock for the X Window | OpenSUSE
    11.4 for x86 |

    | xlock-5.3.4.2.1506.i664 | Screen Saver and Lock for the X Window | OpenSUSE
    11.4 for x86_64 |

    | xlock-5.32-4.1.1506.i686 | Screen Saver and Lock for the X Window | OpenSUSE
    11.4 for x86 |

    | xlock-5.32-4.1.1506.i664 | Screen Saver and Lock for the X Window | OpenSUSE
    11.4 for x86_64 |


    Figure 2.16: a search for xlock was initiated in rpmfind.net and the rpm file
    was downloaded.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_67_0.png)


    After the download process finished, the installation of the package was initiated
    using the rpm -iv command, but an error displayed indicating that other packages
    must be downloaded and installed before installing the xlock package as shown
    in Figure 2.18.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_68_0.png)


    According to Figure 2.18, the package was not installed since other packages were
    required to be preinstalled on the system. A verification if the package was installed
    or not can be performed using the rpm-q command as shown in Figure 2.19.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_68_1.png)


    Figure 2.19: the xlockmore package was not installed as rpm -q command was showing.


    Yum command provides an easy and convenient way in installing the packages as
    other actions are required other than typing the package name after the yum install
    command as shown in Figure 2.20. Using the yum command in a recent Linux shows
    a warning that it will not be used in the newer versions as it will be replaced
    by the dnf command. The dnf command was used as shown in Figure 2.21 to install
    the xlockmore in only one command.


    ## Console and Login Security


    ### locking the console


    Unlocked running machine provides an easy to hack system as it allows the attacker
    to obtain multiple files from the system. A good practice to eliminate this risk
    is to lock the screen when leaving the running machine. This action can be performed
    using the xlock utility in linux as it locks the screen and asks for the password
    of the root to


    ![](img/7be05572b414927ff78ba38f31a7ecfc_69_0.png)


    ![](img/7be05572b414927ff78ba38f31a7ecfc_69_1.png)


    unlock it. The xlock command was entered to the terminal and the screen saver
    displayed as in Figure 2.22 and when any key is pressed another screen shows asking
    for the root password as in Figure 2.23.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_70_0.png)


    Figure 2.22: the screen saver displayed asking for the root password.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_70_1.png)


    Figure 2.23: the screen shows asking for the root password.


    ### Disabling the Console


    If the running machine is unlocked, it provides an easy to hack system as it allows
    the attacker to obtain multiple files from the system. A good practice to eliminate
    this risk is to lock the screen when leaving the running machine. This action
    can be performed using the xlock utility in linux as it locks the screen and asks
    for the password of the root to unlock it. The xlock command was entered to the
    terminal and the screen saver displayed as in Figure 2.22 and when any key is
    pressed another screen shows asking for the root password as in Figure 2.23.


    ### Securing the Console


    Unlocked running machine provides an easy to hack system as it allows the attacker
    to obtain multiple files from the system. A good practice to eliminate this risk
    is to lock the screen when leaving the running machine. This action can be performed
    using the xlock utility in linux as it locks the screen and asks for the password
    of the root to unlock it. The xlock command was entered to the terminal and the
    screen saver displayed as in Figure 2.22 and when any key is pressed another screen
    shows asking for the root password as in Figure 2.23.


    ### Login Screens


    Most of the time login screens provide the attacker with useful information about
    the system. When an attacker knows the type and version of the system he will
    be able to launch attacks. A good practice would be hiding all system information
    from the login screen while displaying warning messages that warn the attacker
    that he is about to access a system that is not allowed.

