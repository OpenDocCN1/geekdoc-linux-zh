- md: "\n## Becoming a super-user\n\nThe multi-user property of Linux provides extra\
    \ protections and security to the system; all users will be having a limited set\
    \ of permissions while the root user will be having a full access to the system\
    \ with maximum permissions. In this part and experiments were done in creating\
    \ new users and modifying the permissions and access levels to the current users\
    \ through the cron command as a test case.\n\n```\nituser@MB8007225:~\nFile Edit\
    \ View Search Terminal Help\n[ituser@MB8007225 -$ whoami\nituser\n[ituser@MB8007225\
    \ -$]#\n```\n\nFigure 1.76: whoami command result shows the currently logged in\
    \ user is Ituser\n\n```\nituser@MB8007225:/home/ituser\nFile Edit View Search\
    \ Terminal Help\n[ituser@MB8007225 -$] su\nPassword:\n[root@MB8007225 user]#\n\
    ```\n\nFigure 1.77: accessing the shell as root user\n\n```\nituser@MB8007225:/home/ituser\n\
    File Edit View Search Terminal Help\n[root@MB8007225 user]# whoami\nroot\n[root@MB8007225\
    \ user]#\n```\n\nFigure 1.78: whoami command result shows the currently logged\
    \ in user is root root\n\nWhoami command at part \"a\" showed the user as the\
    \ user who is controlling the shell and limited permissions were assigned to his\
    \ files but at part \"c\" the command Whoami displayed the user as root and he\
    \ has full permissions.\n\n## Ituser@M8000725:/home/ituser\n\n```\nFile Edit View\
    \ Search Terminal Help\n[root@M8000725 ituser]# # touch /etc/cron.deny\n[root@M8000725\
    \ ituser]# #\n```\n\nFigure 1.79: create a new file at /etc/cron.deny\n\n## Ituser@M8000725:/home/ituser\n\
    \n```\nFile Edit View Search Terminal Help                               Modified\n\
    GNU nano 2.5.3                               File: /etc/cron.deny\nituser    \
    \                                                                          \n\n\
    \nRead 0 lines\n-Get Help Write Out Where Is Exec Next Justify\n-M Read File Replace\
    \ Uncut Text To Spell\n-Exit Go To Line\n```\n\nFigure 1.80: ituser entry added\
    \ to the denied file\n\n## ituser@M8000725:~\n\n```\nFile Edit View Search Terminal\
    \ Help\n[root@M8000725#]# exit\n[ituser@M8000725~ -] #\n```\n\nFigure 1.81: Log\
    \ out from the root\n\n## ituser@M8000725:~\n\n```\n[root@M8000725 it]# exit\n\
    (ituser) are not allowed to use this program (crontab)\nSee crontab(1) for more\
    \ information\n[ituser@M8000725~ -] #\n```\n\nFigure 1.82: running crontab command\
    \ from cron utility rule is not allowed\n\nSince the file was blocked using the\
    \ cron utility at \"d\", then the shell will not allow the ituser to run the crontab\
    \ command.\n\n## ituser@M8000725:~\n\n```\nFile Edit View Search Terminal Help\n\
    [ituser@M8000725~ -]# rm /etc/cron.deny\nrm: remove write-protected regular file\
    \ '/etc/cron.deny'? ? y\nrm: remove '/etc/cron.deny': Permission denied\n[ituser@M8000725~\
    \ -] #\n```\n\nFigure 1.83: failure to remove the file (/etc/cron.deny) due to\
    \ blocked permission of ituser using cron utility\n\n## Ituser@M80007225:/home/ituser\n\
    \n```\nFile Edit View Search Terminal Help\n[root@M80007225 ~]$ su\nPassword:\n\
    [root@M80007225 #] /etc/cron.deny\nrm: remove regular file '/etc/cron.deny'? y\n\
    [root@M80007225 ituser]# #\n```\n\nFigure 1.84: The file (/etc/cron.deny) removed\
    \ using root user\n\nSince the (/etc/cron.deny) file was created by the root user\
    \ then any modifications to ituser will not be utilized by other users, and the\
    \ only user that will be able to delete it is the root user.\n\nA new account\
    \ was created and tested using the graphical user interface provided an easy user-friendly\
    \ utility.\n\n![](img/7be05572b414927ff78ba38f31a7ecfc_34_0.png)\n\nFigure 1.85:\
    \ Creating shahrazad user through the graphical tools\n\n![](img/7be05572b414927ff78ba38f31a7ecfc_34_1.png)\n\
    \nFigure 1.86: sign in as the shahrazad user\n\n![](img/7be05572b414927ff78ba38f31a7ecfc_35_0.png)\n\
    \nSince the required password by the question was \"qw\" and fedora workstation\
    \ password length policy states it should be at minimum 8 characters, we added\
    \ two extra digits at the end to the specified password to create the account\
    \ otherwise it will not be possible through the graphical interface.\n\n![](img/7be05572b414927ff78ba38f31a7ecfc_35_1.png)\n\
    \n## Using ssh to connect to another\n\nMost servers are configured and accessed\
    \ remotely, and ssh provides a secure and reliable way of performing this task.\
    \ In this ssh session was initiated to a server with ip and address of 172.18.64.31\
    \ and multiple commands were performed to get statistics about the server itself\
    \ if like \"who\", \"finger\", and \"w\". furthermore, a navigation and modifications\
    \ to the directories in the server were performed and tested. The following screenshots\
    \ shows in the details tasks for this part of the chapter.\n\n![](img/7be05572b414927ff78ba38f31a7ecfc_36_0.png)\n\
    \n```\nroot@z10150~~[root@z10150~]$ # ssh 172.18.64.31\nThe authenticity of host\
