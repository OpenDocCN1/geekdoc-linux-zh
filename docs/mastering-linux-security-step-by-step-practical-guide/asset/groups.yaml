    ## 使用 TripWire 进行文件完整性检查


    TripWire 是一种基于主机的入侵检测系统（IDS），它从主机文件系统和配置中收集数据，这些收集到的数据将在后续阶段进行检查和验证，以识别系统的良好和不良状态。根据规范，如果系统被入侵，TripWire
    还可以通知管理员。在安装 TripWire 后，必须初始化数据库，一种良好的做法是修改 TripWire 的策略文件以匹配需求，从而减少误报。可以将 TripWire
    配置为每天运行，并向管理员发送电子邮件通知，以便即使他不在位也能保持所有信息的最新状态。


    ## Syslog-ng


    Syslog-ng 是一个开源软件包，它通过基于内容的过滤、丰富的过滤能力和灵活的配置选项扩展了 syslog。Syslog-ng 为 syslog 增加了许多外的的功能和特性，例如使用
    TCP 进行传输。


    ## 本章总结与建议


    -   日志文件为系统管理员提供了有用的数据，用于分析入侵和失败情况。

    -   维护和组织日志文件的良好做法是使用日志轮转工具。

    -   大多数应用程序默认情况下都带有一个日志系统，用于记录所有事件和错误。

    -   必须使用用户名和密码对 Grub 进行安全保护，防止攻击者登录并执行恶意操作。

    -   可以使用如 TripWire 等实用工具检查文件完整性并检测系统中的入侵。

    -   为了扩展原始 rsyslog 的功能，可以使用 syslog-ng 工具。


