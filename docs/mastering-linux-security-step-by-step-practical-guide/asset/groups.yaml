    # Firewall


    Firewall is considered one of the most important defense line in computer systems.
    Configuring it properly by eliminating and closing all ports that are not important
    and allowing the specific machines or domain reduces the chance of being compromised.
    Linux provide various utilities to perform this task, iptables command that can
    be used through the terminal is considered the most common one which can be found
    in all Linux distributions. Fedora provides a user-friendly graphical user interface
    for configuring the firewall. In this task, we used the graphical utility to enable
    and disable the ssh connectivity to the machine and testing from other machines.
    The steps for performing this task are shown in Figure 3.4s–31.


