    Grub 时需要的用户名。为了强制更新 Grub 配置文件，执行如 4.41 所示的 `grub2-mkconfig -o /boot/grub/grub.cfg`
    命令。当系统重启时，grub 会提示输入用户名和密码以进行身份验证，并允许登录，如图 4.42 所示，这表明 Fedora 24 中已经存在一种高级安全阶段。


