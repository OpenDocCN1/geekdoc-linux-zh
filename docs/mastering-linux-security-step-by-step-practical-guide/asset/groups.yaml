    [root@M0007225 home]#\n```\n\nFigure 1.20: shows the new file generated by touch\
    \ command\n\n```bash\nzbalbahaith@Fedora24:/home\n[root@M0007225 home]# touch\
    \ myfile\n[root@M0007225 home]# ls -l\nmyfile\ttzbalbahaith\n-rw-r--r-- 1 root\
    \ 0 Oct 14 17:42 myfile\n[root@M0007225 home]#\n```\n\nFigure 1.21: applying touch\
    \ command on an existing file\n\nUsing touch command on an existing file will\
    \ not show anything on the screen and will not overwrite the content of the file;\
    \ the only effect will be shown on the last modified date when using the command\
    \ -l to show the long format of the file, it is noticeable that the time changed\
    \ based on the last touch command on an existing file.\n\nLinux manual entry has\
