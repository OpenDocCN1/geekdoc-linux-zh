    ## Chapter II


    ## Exploring Various Security Tools


    ## Chapter Objectives


    - To understand and use advanced Linux tools.

    - To explore and implement the installation and analysis of software packages.

    - To practice various commands to secure the system and trace user activity on
    the system or through the network.

    - To secure the console from a denial of service attack activities by implementing
    good practices to console services.

    - To eliminate direct remote connection to the system and warning unauthorized
    activities.


    ## Needed Tools


    - Fedora 24 Workstation image.

    - Oracle VirtualBox

    - Wireshark


    ## Chapter Overview


    Linux OS provides a useful set of preinstalled utilities that allows the user
    to perform the required tasks easily, it also provides multiple applications and
    packages that can be installed to be used for different purposes. Using these
    utilities without limitations and restrictions would allow many of the breakthroughs
    that can be prevented by applying simple security standards. An attacker may cause
    a denial of service attack by running some of the console apps by remotely connected
    to the system using the weak permissions provided to the console. The misconfiguration
    of the permissions of a sensitive file or directory will result in exposing it
    to hackers that can perform unauthorized actions to it. Also setting the permissions
    for each user according to the security requirements is an important issue to
    be protected from all actions, the Tasks and Procedures section explains thoroughly
    how each of the sixth parts of the chapter was performed in accordance with the
    screenshots. The aim for each part of the report is as follows.


    The aim of part 0 to test and verify that Linux allows users to reboot or shutdown
    the server using multiple commands such as halt, reboot, shutdown, power off,
    or eject which could cause a denial of service to the server.


    The aim of part 1 to determine the file permissions for newly created files using
    three-digit octal number with a umask command, and to change the default set of
    permissions based on the umask command.


    The aim of part 2 to discover user account information stored in "/etc/passwd",
    and view the details of the current logged in user.


    The aim of part 3 to allow non-root users to execute particular commands as if
    they were the root, to be able to access the sudo file and add a user to the determined
    commands. Also to view the audit log and determine particular actions occurred.


    The aim of part 4 to explore various tools that allows the users to install, manage
    and updates software packages. Also to download packages from various sites and
    handle them through rpm and yum tools.


    The aim of part 5 to explore how to secure the system by locking when we leave
    the machine running using xlock command, to be able to disable applications to
    avoid denial of service attack, to be able to disable the direct root remote login
    through ssh and telnet a modification and finally to hide all related information
    from the login screen and display a warning messages motd and issue files.


    The aim of part 6 to install Wireshark software package as tools for sniffing
    network packets, to explore different options for interface for activity tracing,
    to be able to use Wireshark to sniff the entered username and password in http
    websites.


    ## Tasks & Procedures


    ## What are the risks


    Remotely connected users the permission to perform and run some of the console
    apps may rise various security risks; one of the major risks is that if an attacker
    performed halt, shutdown, or reboot to the system which may cause a denial of
    service attack.


    In this section two Fedora workstations were installed on VirtualBox. One of the
    machines was configured to be hosting ssh service while the other was communicating
    with it ssh. Through the established ssh connection halt command applied to test
    the effect on the other machine. Figure 2.1 shows the client and server machines
    while having an active ssh connection. As shown in Figure 2.2 that the remote
    user was able to stop the other machine through halt command.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_59_0.png)


    Figure 2.1: An ssh session was established between two workstations that were
    installed on VirtualBox.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_59_1.png)


    Figure 2.2: Using ssh remote connection, halt command was applied to the other
    Fedora machine that caused the machine to stop.


    ## Default File Permissions


    Taking care of the permissions for each newly created file or directory is not
    an easy task, and at the same time the misconfiguration of a sensitive file or
    directory will result in exposing it to hackers who can modify it or delete it.


    In this section the default permissions assigned to a newly created file were
    examined before and applying umask command within the same and new terminal window.
    A new file was created using touch command, and the default permissions given
    to the created file were as follow: **Owner**: Read & Write, **Group**: Read &
    Write, **Others**: Read only as shown in Figure 2.3. The umask command was used
    to give the owner full access and remove all the permissions from the group and
    others, the value used to accomplish this task was 077. As noticed from Figure
    2.4 that even the owner was supposed to have execute permission, only read and
    write permissions were assigned to him since the maximum permissions that can
    be set for a file using the umask command are read and write only. Figure 2.5
    shows that a new terminal was opened a new file was created, the permissions for
    the file took the default permissions and the umask which was applied previously
    did not take effect on the new terminal. When a new session is initiated, the
    terminal will take the default permissions from the file in /etc/bashrc or /etc/profile
    and the default permissions of the umask will be 002 for all newly created files,
    this is the reason for why the umask changes after switching to a new terminal.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_60_0.png)


    Figure 2.3: A new file "testfile" was created using touch command and the default
    permissions are 664.


    ![](img/7be00572b414927ff78ba38f31a7ecfc_60_1.png)


    Figure 2.4: Even after changing the umask to 077, the new created files will be
    having at maximum read permissions.


    ## Password files


    Recently most linux distributions stores the information about the users in three
    main files /etc/group, /etc/passwd, /etc/shadow files. /etc/group includes information
    about the groups and users that are created on the system while /etc/passwd includes
    a list for all the users displayed with the following details: Login name, Password
    field, User ID, Group ID, Home directory, Login shell. The /etc/shadow file has
    a hashed version of the passwords that cannot be accessed by any user other than
    the root. The content of /etc/passwd was viewed using the more command as shown
    in Figure 2.6. It is always more convenient to retrieve the information for the
    user of interest by piping the output of cat to grep as shown in Figure 2.7.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_61_0.png)


    ![](img/7be05572b414927ff78ba38f31a7ecfc_61_1.png)

