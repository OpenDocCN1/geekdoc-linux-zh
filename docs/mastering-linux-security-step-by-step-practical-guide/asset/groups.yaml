    # Examining Linux Commands


    1. Execute the following command and explain what it does:


    ```bash

    find / -print

    ```


    This command searches for all the files and directories that are in the root directory
    and accessible by the current user then print on the terminal screen, Figure 1.101
    shows the output generated by the command.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_39_0.png)


    35


    ## 2. What commands would you dire to accomplish the following: create the file
    “sayhi” in your HOME directory and write the following in the file “echo hi there
    and how you are doing today”. Save the file and then run it.


    The following commands will be used to navigate to the home directory and create
    the file then allow the execution of it then you run:


    ```bash

    cd ~

    cat > sayhi

    echo hi there and how you are doing today

    chmod 764 sayhi

    ```


    /sayhi


    ![](img/7be05572b414927ff78ba38f31a7ecfc_40_0.png)


    Figure 1.02: creating a file containing “echo” command then running it.


    ## 3. Use the touch command to create a new file. What is the default permission
    on that file?


    Depending on the specified UMASK the default permissions will be assigned to the
    newly created files. On this machine the UMASK was not modified, which will lead
    to a read and write permissions for the owner and the group having only read permission
    for others. The commands used to perform this task are shown below as well as
    in Figure 1.103.


    ```bash

    touch newfile

    ls -l

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_41_0.png)


    Figure 1.103 : Creating a new file viewing its default permissions assignment


    ## 4. Print the value of each of the environment variables HOME, SHELL, PATH.


    As shown in Figure 1.104 for the specified variables can be displayed with the
    echo command either one time


    ```bash

    echo HOME=$HOME SHELL=$SHELL PATH=$PATH

    ```


    Or one by one separately


    ```bash

    echo $HOME

    echo $SHELL

    echo $PATH

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_42_0.png)


    Figure 1.104: Displaying the value of multiple variables.


    ## 5. Remove the directory “class” (from your HOME directory) and all of its contents
    in just one command.


    A directory that has content can be deleted using the command shown below and
    in Figure 1.105.


    ```bash

    rm ~/class -r

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_43_0.png)


    Figure 1.105 : Removing a directory that has a content


    39


    ## 6. Change the permission mode on the file "output" to be readable and writable
    by you (the owner of the file), and no read/write/execute for people in the same
    group and others.


    To perform the requested task permission of 600 must be assigned as shown below
    and in Figure 1.106.


    ```bash

    chmod 600 output

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_44_0.png)


    Figure 1.106: Changing the permissions assigned to a file.


    ## 7. Change the permission mode on a "public_html" (assume it exists) directory
    so that the owner could read/write/execute, and users in the same group and others
    should be able to view (using a Web browser) the html pages contained in that
    directory.


    Changing the permissions for a directory to be described in the question is performed
    as shown in Figure 1.107 with the command below


    ```bash

    chmod 744 public_html

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_45_0.png)


    Figure 1.107: Changing the permissions for a directory


    ## 8. Run the xclock command in the background. Use the “ps” command to list the
    running processes, and the “kill” command to send a signal to xclock to terminate
    it. Give the exact sequence of commands along with any arguments.


    To run a command in the background "&" character must be added to the end of the
    word, using “ps" the running process will be displayed with their PID that can
    be used with the “kill" command to terminate any process as shown in the commands
    below and in Figure 1.8.


    ```bash

    xclock&

    ps

    kill 3949

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_46_0.png)


    Figure 1.108 : Running a process in a background then terminating it


    42


    ## 9. Use the find command to locate the file “passwd”.


    A search for passwd in the root directory can be performed as shown in Figure
    1.109.


    ```bash

    find / -name passwd

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_47_0.png)


    Figure 1.109: Locating a file named passwd


    ## 10. Use the find command to locate all files that are owned by you.


    To find all files that are owned by the current user the -user flag can be used
    as shown below.


    ```bash

    find / -user $(whoami)

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_48_0.png)


    Figure 1.110 : Finding files owned by the current user


    ## 11. Use the grep command to find all lines that do not contain username.


    In our case the -v flag can be added to the grep utility as shown below.


    ```bash

    grep -v "username" /etc/passwd

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_49_0.png)


    Figure 1.111: Searching for lines not containing username


    ## 12. Where do each of the following commands reside: ls, cd?


    The where command can be used to find the location of commands as shown below.


    ```bash

    where ls

    where cd

    ```


    ![](img/7be05572b414927ff78ba38f31a7ecfc_50_0.png)


    Figure 1.112: Locating the location of commands


    ## 13. Use the tar command to create an archive of all files in your home directory.


    The tar command can be used to create an archive for the home directory as shown
