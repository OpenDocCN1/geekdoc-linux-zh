    # End of Chapter Conclusions & Recommendations


    - Restricting the permissions for the remotely connected users for accessing the
    console apps is an important issue to consider, and it can be configured easily
    by Linux.

    - Linux provide a convenient way to deal with the permissions for the newly created
    files or directories to eliminate the risk of misconfiguration of the permissions
    of a newly created files or directories.

    - Most Linux distributions stores the information about the users in three main
    files: /etc/group, /etc/password, and /etc/shadow files to reduce the risk by
    separating the users as if they were the root, setting the permissions for each
    user according as and store the password as MD5 hashes.

    - Linux affords functions that allow selected non-root users to execute particular
    commands as if they were the root, setting the permissions for each user according
    to the security requirements is an important issue.

    - Linux produces various tools that permit the users to install, manage, and update
    software packages, also recognizing if the package requires extra other packages
    it will be installed separately.

    - Console in Linux is considered the main link that control and configure the
    system. It also provides a way for hiding all system related information from
    the login screen and displaying a warning messages to warn the attacker for increasing
    the security.

    - Linux provides a ways to sniff the data posted on the network by installing
    tools for sniffing network packets to trace user activity.


    ## Chapter III

    ## Digging Deeper into Linux


    ### Chapter Objectives


    - To test and explore the setuid and setgid functionalities of Linux.

    - To use the graphical version of Linux firewall to enable and disable remote
    connections.

    - To test immunizing the files and directories and securing them.

    - To be able to forward the graphical packages through ssh remote connection.

    - To test and evaluate various techniques in managing, transferring, and mounting
    files and directories locally and over the network.


    ### Needed Tools


    - Fedora 24 Workstation image.

    - Oracle VirtualBox


    ### Chapter Overview


    Securing Linux machine is an important task and the security issue become one
    of the main priorities when dealing with the machine as a server. In this chapter
    multiple tasks have been accomplished and performed through the subsections of
    the Questions and Answers section. The first and second sub-sections targeted
    testing and verifying the options that will be set when configuring a file or
    directory with setuid on them and the vulnerabilities when activating this option.
    In the third sub-section the graphical version of Linux firewall was tested by
    enabling and disabling the communication over ssh. The immunization functionality
    that is available in Linux to secure files and directories was tested and evaluated
    in the fourth sub-section. In the fifth sub-section the process of forwarding
    the execution of graphical packages over ssh was accomplished successfully. Transferring
    files and directories over the network using both scp and sftp commands was tested
    and implemented in the sixth subsection. In the last subsection of Questions and
    Answers section a test for mounting files and directories locally and over the
    network was accomplished successfully.


    ## SUID and SGID


    Linux OS permissions system provide the ability to set certain files or directories
    with SUID andor SGID. Setting SUID will let the user access the file as if he
    the owner of it, setting SGID will let the user access the file as if he was a
    part of the group''s owning the file. In this section a test was performed to
    check the effect of activating and deactivating the SUID on password file and
    some other files. First task required changing ituser password and it was done
    using passwd ituser command. Then the location of password checked with the "which"
    and the result was /usr/bin/passwd. The set-uid program for the password file
    removed using the chmod u-s, in Figure 3.4 clearly shows the s removed from the
    file permission, which mean the normal user will not be able to run as root and
    permission denied error or other error will be shown when tried to execute passwd
    command. Figure 3.5 demonstrated the error message shown when trying to change
    ituser password. The file turned into a set-uid program to give the normal user
    the chmod u+s command password is set with SUID to give the owner permissions
    so that he can update /etc/passwd.


