    # 本章总结与建议


    - 限制远程连接用户访问控制台程序的权限是一个需要考虑的重要问题，Linux 可以轻松地进行配置。

    - Linux 提供了一种方便的方法来处理新创建的文件或目录的权限，从而消除新创建的文件或目录权限配置错误的风险。

    - 大多数 Linux 发行版通过三个主要文件存储用户信息：`/etc/group`、`/etc/password` 和 `/etc/shadow` 文件，通过将用户与
    root 分离开（分离）来降低风险，根据需求为每个用户设置权限，并以 MD5 哈希值的形式存储密码。

    - Linux 提供了函数，允许选定的非 root 用户以 root 用户的身份执行特定命令，根据安全需求为每个用户设置权限是一项重要任务。

    - Linux 生成了各种工具，允许用户安装、管理和更新软件包，同时还能识别该包是否需要其他额外的包并进行单独安装。

    - Linux 中的控制台（Console）被认为是控制和配置系统的主要链接。它还提供了一种从登录界面隐藏所有系统相关信息的方法，并通过显示警告信息来警告攻击者，从而增强安全性。

    - Linux 通过安装网络包嗅探工具来提供嗅探网络发布数据的方法，以追踪用户活动。


    ## 第三章

    ## 深入研究 Linux


    ### 本章目标


    - 测试并探索 Linux 的 `setuid` 和 `setgid` 功能。

    - 使用图形化 Linux 防火墙启用和禁用远程连接。

    - 测试文件和目录的免疫保护。

    - 能够通过 ssh 远程连接转发图形包。

    - 测试并评估在本地和网络上管理、传输和挂载文件及目录的各种技术。


    ### 需要工具


    - Fedora 24 Workstation 镜像。

    - Oracle VirtualBox


    ### 本章概述


    保护 Linux 是一项重要任务，当将其作为服务器时，安全问题成为首要任务之一。在本章中，通过问答部分的多个小节完成了多项任务。第一、二小节旨在测试和验证在配置文件或目录并设置
    `setuid` 时将设置的选项，以及激活此选项时的漏洞。第三小节中，通过启用和禁用 ssh 通信测试了图形化 Linux 防火墙。第四小节测试并评估了 Linux
    中用于保护文件和目录的免疫功能。第五小节节成功完成了通过 ssh 转发图形包执行的过程。第六小节测试并实现了同时使用 `scp` 和 `sftp` 命令在网络上传输文件和目录。在问答部分的最后一个小节中，成功完成了本地和网络上挂载文件及目录的测试。


    ## SUID 和 SGID


    Linux 操作系统权限系统提供了为某些文件或目录设置 `SUID` 和 `SGID` 的能力。设置 `SUID` 将允许用户以所有者的身份访问文件，设置
    `SGID` 将允许用户以所有文件组的身份访问文件。在本节中，进行了一项测试以检查在密码文件和其他文件中激活和取消 `SUID` 的效果。第一个任务是更改
    `ituser` 密码，通过 `passwd ituser` 命令完成。然后使用 `which` 检查密码位置，结果为 `/usr/bin/passwd`。使用
    `chmod u-s` 移除了密码文件的 `set-uid` 程序，图 3.4 清晰地显示文件权限中移除了 `s`，这意味着普通用户将无法以 root 身份运行，尝试执行
    `passwd` 命令时将显示权限被拒绝或其他错误。图 3.5 展示了尝试更改 `ituser` 密码时显示的错误信息。将文件变为 `set-uid` 程序以赋予普通用户
    `chmod u+s` 命令，密码设置了 `SUID` 以赋予所有者权限，以便其更新 `/etc/passwd`。


