  mdcn: "\n第 4 部分的目标是通过重命名文件名、将文件从一个目录移动到其他目录、将文件复制到不同的目录，最后删除文件及其所有内容。\n\n第 5 部分的目标是允许文件所有者设置文件和目录的权限。`chmod`\
    \ 命令用于允许或限制你创建或他人创建的文件和目录的访问。根据文件的重要性定期更改权限。\n\n第 6 部分的目标是使用 `ln -s` 命令为现有文件创建软链接（符号链接），然后通过更新和删除原始文件练习链接文件的不同场景，并发现链接文件上发生的变化。\n\
    \n第 7 部分的目标是学习如何使用 `yum` 命令安装包并在前台和后台运行进程以注意它们的差异；另一个目标是列出后台运行的进程并使用 `kill` 命令终止它们。\n\
    \n第 8 部分的目标是操作 root 用户并通过 `crontab` 运行任务，还要通过在 `cron.deny` 文件中添加拒绝用户列表来从 cron\
    \ 工具中定义特定用户，最后熟悉使用图形化工具创建新用户。\n\n第 9 部分的目标是使用 `ssh` 命令登录 Linux 服务器，使用不同的 Linux\
    \ 命令查看服务器上有哪些用户，访问并读取他人的文件，更新他们的文件并查看他们在做什么。\n\n第 10 部分的目标是能够通过 VirtualBox 或 VMware\
    \ workstation 安装 KALI Linux。\n\n## 基础 Linux 命令\n\n任务从在虚拟机上安装并访问 Fedora Linux 并启动一个新的终端窗口开始。已经应用了一些基础命令来实验它们的副作用，这些命令如下：\n\
