- md: '

    ## Installing Software Packages RPM and YUM


    Linux provides various tools that allow the users to install, manage, and update
    software packages. Fedora has two main tools that are rpm and yum; in rpm the
    user most likely searches for the package of interest, downloads it, and installs
    it, knowing that if the package requires extra other packages they must be searched
    for and downloaded then installed separately. Yum command provides the same functionality
    but it performs most of the work automatically from searching for the package
    on the internet, then downloading and installing it with all required other packages
    installed automatically.


    Test both rpm and yum; a trial for installing the xlockmore package was performed.
    The package was found in the rpmfind.net website as shown in Figure 2.16. Then
    the link was obtained and downloaded using the wget command to the Downloads directory
    as shown in Figure 2.17.


    ## RPM Found 10 for xlock


    | Package | Summary | Distribution |

