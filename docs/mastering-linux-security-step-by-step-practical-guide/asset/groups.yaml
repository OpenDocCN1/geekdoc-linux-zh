    root 用户也对其重命名、删除或创建硬链接。在本节中，将使用 `chattr +i` 命令对 `/etc/services` 文件进行免疫，该文件包含了重要信息，攻击者可能会修改这些信息以通过为他们打开有用端口来简化破解系统的过程。执行此任务的步骤如图
