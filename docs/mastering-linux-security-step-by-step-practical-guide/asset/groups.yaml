    \ 12 21:29 (172.18.64.24)\nroot pts/1 Oct 12 20:34 (172.18.64.21)\nroot pts/2\
    \ Oct 12 20:35 (172.18.64.111)\nroot pts/3 Oct 12 20:36 (172.18.64.111)\nroot\
    \ pts/4 Oct 12 20:36 (172.18.64.25)\n```\n\nFigure 1.91: Using finger command\
    \ to find more details about users. (Wait, text says 1.92) Figure 1.92: Using\
    \ finger command to find more details about users.\n\n```\nroot@z10150-# w\n20:41:07\
    \ 3.13, 6 users, load average: 0.13, 0.09, 0.06\nUSER LOGIN IDLE JCPU MEM\ntuser\
    \ tty22 20:34 0.05s 0.09s /usr/lib/libexec/gsd-print\nroot pts/1 20:35 1.08s 0.16s\
    \ ssh in 172.18.64.111\nroot pts/2 20:35 1.08s 0.07s -bash\nroot pts/3 20:36 0.02s\
    \ -bash\nroot pts/4 20:36 2.08s 0.00s -bash\nroot@z10150-#\n```\n\nFigure 1.93:\
    \ Using w to find what other students are doing\n\n## root@z10150/home/ituser\n\
    \n```\nroot@z10150# cd home\nroot@z10150# ls\nroot@z10150 home# cd ituser\nroot@z10150#\
    \ ls\nDocuments Downloads Music Pictures salimIsHere Templates Videos\nroot@z10150#\n\
