    \ `.` 开头的已知文件。（图 1.5）\n- `ls -a` 命令：列出所有文件和文件夹，包括隐藏文件。（图 1.6）\n- `ls -l` 命令：列出带有权限和所有权信息的文件和文件夹。（图\
