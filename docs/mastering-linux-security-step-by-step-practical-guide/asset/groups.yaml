    unlock the screen


    # Disabling Console Applications


    If an attacker gained a remote access to a system, then he will be able to use
    all tools specified by the /etc/security/console.apps. These tools give the functionality
    of shutting down or rebooting the system which could cause a denial of service
    attack to an important running server. A good practice can be performed to remove
    the console.apps or change the permissions to it as has been done in Figure 2.24.'
  - '[PAGE 71]


    ![](img/7be05572b414927ff78ba38f31a7ecfc_71_0.png)


    Figure 2.24: The permissions for the /etc/security/console.apps were not allowed
    to shut down or reboot the system.


    # Securing the Console


    Console in Linux is considered the main link that control and configure the system.
    Securing the console must be assigned with high priority, one of the common practices
    in securing the console is to limit the login to a single root terminal and can
    be done through /etc/security. The console can be controlled remotely over the
    network through various ways such as ssh and telnet. From some of remote access
    tools like telnet the username and password of the authentication in a plain text
    creates a big security risk. A precaution to reduce the risk can be accomplished
    by not allowing the direct connection to the system through the root user, which
    means that the user can access the system through a non-root user and use or sudo
    command when needed.


    To disable the direct root login through ssh and a modification to the /etc/ssh/sshd_config
    must be done to change the PermitRootLogin to no as shown in Figure 2.25.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_71_1.png)


    Figure 2.25: Root login for ssh was disabled through the /etc/ssh/sshd_config.'
  - '[PAGE 72]


    After modifying PermitRootLogin to no, a test to connect to the ssh server through
    the root user was performed and permission denied message was displayed as shown
    in Figure 2.26.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_72_0.png)


    Figure 2.26: The ssh permission was denied when trying to ssh as root even though
    the entered password was correct.


    # Login Screens


    Most of the time login screens provide the attacker with useful information about
    the system and the used services. When an attacker knows the type and version
    of the system that is running he will be able to lunch a specified attacks towards
    the system with the published an well-known vulnerabilities. A good practice would
    be hiding all system related information from the login screen while displaying
    warning messages that warn the attacker that he is about to access a system that
    is not allowed to which will make him guilty in the court if a case was initiated
    about him. Both motd and issue can be used for this purpose.


    Displaying a warning message using motd can be accomplished by editing the /etc/motd
    file and adding the warning text as shown in Figure 2.27. When a user tries to
    login to the system through the ssh the entered warning will be displayed to him
    as shown in Figure 2.28.'
