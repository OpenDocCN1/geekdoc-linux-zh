    # Immutable Files


    Linux deals with everything ever connected devices as files, which raise the need
    of finding an advanced way for securing these files. Linux provide a utility that
    can be launched on a file through chatter +i command which will immunize any file
    by preventing the ever root user from renaming, deleting or creating hard link
    to it. In this section the chatter +i command will be used to immunize the /etc/services
    file that includes important information that attackers may modify to ease the
    process of compromising the system by opening useful ports for them. The steps
    followed in performing this task are shown in Figure 3.2-36.


