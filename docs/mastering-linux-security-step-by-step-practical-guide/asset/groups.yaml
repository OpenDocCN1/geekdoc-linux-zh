    # Console and Login Security


    locking the console


    Unlocked running machine provides an easy to hack system as it allows the attacker
    to obtain multiple files from the system. A good practice to eliminate this risk
    is to lock the screen when leaving the running machine. This action can be performed
    using the xlock utility in linux as it locks the screen and asks for the password
    of the root to


