    解决 setuid 程序的建议方案如下：


    - 限制 setuid 的使用以降低风险。

    - 必须对创建了 setuid 激活的二进制文件和目录进行定期检查，以识别出异常项。

    - 从 ssh 中移除 setuid 位，这可以防止攻击进入系统。

    - 使用 `kernel-utils` 软件包，该工具包有助于纠正错误设置的用户 uid 并修复 setuid 漏洞。

    - 禁用用户从其目录运行脚本命令，必须使用 root 权限。


    # 防火墙


    防火墙被认为是计算机系统中最重要的防线之一。通过消除和关闭所有不重要的端口并允许特定的机器或域来正确配置，可以减少被攻击的概率。Linux 提供了各种实用程序来执行此任务，可以通过终端使用的
    `iptables` 命令被认为是最常用的，在所有 Linux 发行版中都能找到。Fedora 提供了一个用户友好的图形用户界面来配置防火墙。在任务中，我们使用图形化工具启用和禁用对机器的
    ssh 连接，并从其他机器进行测试。执行此任务的步骤如图 3.4s–31 所示。


