    # Fine Tuning the Defaults


    The rslog daemon receives its configuration information from rslog.conf file,
    the file is placed under the /etc directory. Typically, the rslog.conf file tells
    the rslog daemon where to save its log messages. The file consists of instruction
    comes from a series of two-part lines which are selector and action. The selector
    section defines the source of the log message and the action section what to do
    with the message.


    In this task the default configuration file for rslog was edited and the rslog
    daemon has been restarted. Before starting editing rslog configuration file, the
    command applied to make a copy for the default configuration file to be able to
    recover the content after editing it from the copied version as shown in Figure
