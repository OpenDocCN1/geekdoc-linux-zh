    # Dmesg


    Dmesg (Display message or driver message) is a command which will display Kernel
    ring buffers. These messages contain worthy information about device drivers loaded
    into the kernel at the time of booting, also provide us with specifications about
    hardware drivers connected to, disconnected from a machine and any errors when
    hardware driver is loaded into the kernel. These messages are helpful in diagnosing
    and debugging hardware and device driver issues. Figure 4.11 shows the result
    after running dmesg command in fedora 24.


