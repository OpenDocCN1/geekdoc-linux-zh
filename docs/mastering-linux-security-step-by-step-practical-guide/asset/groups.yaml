    ## 7.2 Password Protecting the Boot Loader


    At this point an encrypted password for grub will be generated by providing a
    long alphanumeric code, `grub-mkpasswd-pbkdf2` used to encrypt “zayedu” password
    and the generated encrypted text highlighted as shown in Figure 4.39. Nano editor
    used to edit the content of the /etc/grub.d/00_header file as shown in Figure
    4.40. The addition on the file was to place the hashed password and a username
    to be required for logging in to the Grub. To enforce the Grub configuration file
    to be updated a `grub2-mkconfig -o /boot/grub/grub.cfg` command as shown in 4.41.
    When the system restarted, grub asked for a username and password to authenticate
    and allow the login as shown in Figure 4.42, which indicate an advanced security
    stage has been present in Fedora 24.


