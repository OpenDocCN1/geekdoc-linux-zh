    # Log Rotation


    logrotate is designed to facilitate the performance of systems that generate large
    numbers of log files. It allows automatic rotation, compression, removal, and
    mailing of log files. Each log file may be handled daily, weekly, monthly, or
    when it grows too large. Additionally, it''s difficult to view a particular event
    if there are million log entries, so it''s a good idea to keep log files down
    to manageable size. Figure 4.12 shows the content of the log rotate configuration
    file, its clearly presented on the file that are rotated weekly and logs rotated
    four times before they are deleted. A search for the logrotate word started to
    find the word on the whole system files. Logrotate was started in debug mode and
