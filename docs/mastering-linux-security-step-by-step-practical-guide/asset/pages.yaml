    # Listing Open Files


    Lsof is a command based utility which is used to list information about the files
    that are opened by various processes. In Linux, everything is a file, ( pipes,
    sockets, directories, devices, etc.). So by using lsof, we can get the information
    about opened files. Different lsof options have been shown in table 1:


    | command | Result |

    ---|---|---|n| lsof | Lists open files belonging to all processes | Figure 4.25
    |

    | lsof -p 1 | List all files currently opened by process with PID 1 | Figure 4.26
    |

    | lsof -u ituser | List all files currently being accessed by ituser | Figure
    4.27 |

    | lsof /bin/bash | Find the PID of processes who have /bin/bash opened | Figure
    4.28 |

    | lsof -i TCP | Display a listing of all Internet files of type TCP | Figure 4.29
    |


