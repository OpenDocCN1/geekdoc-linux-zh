  md: '# End of Chapter Conclusions & Recommendations


    +   - Restricting the permissions for the remotely connected users for accessing
    the console apps is an important issue to consider, and it can be configured easily
    by Linux.


    +   - Linux provide a convenient way to deal with the permissions for the newly
    created files or directories to eliminate the risk of misconfiguration of the
    permissions of a newly created files or directories.


    +   - Most Linux distributions stores the information about the users in three
    main files /etc/group, /etc/password, and /etc/shadow files to reduce the risk
    by separating the users as if they were the root, setting the permissions for
    each user according as and store the password as MD5 hashes.


    +   - Linux affords functions that allow selected non-root users to execute particular
    commands as if they were the root, setting the permissions for each user according
    to the security requirements is an important issue.


    +   - Linux produces various tools that permit the users to install, manage, and
    update software packages, also recognizing if the package requires extra other
    packages it will be installed separately.


    +   - Console in Linux is considered the main link that control and configure
    the system. It''s also provides a way for hiding all system related information
    from the login screen and displaying a warning messages to warn the attacker for
    increasing the security.


    +   - Linux provides a ways to sniff the data posted on the network by installing
    tools for sniffing network packets to trace user activity.'
