    # Default File Permissions


    Taking care of the permissions for each newly created file or directory is not
    an easy task, and at the same time the misconfiguration of a sensitive file or
    directory will result in exposing it to hackers who can modify it or delete it.


    In this section the default permissions assigned to a newly created file were
    examined before and applying umask command within the same and new terminal window.
    A new file was created using touch command, and the default permissions given
    to the created file were as follow: **Owner**: Read & Write, **Group**: Read &
    Write, **Others**: Read only as shown in Figure 2.3. The umask command was used
    to give the owner full access and remove all the permissions from the group and
    others, the value used to accomplish this task was 077. As noticed from Figure
    2.4 that even the owner was supposed to have execute permission, only read and
    write permissions were assigned to him since the maximum permissions that can
    be set for a file using the umask command are read and write only. Figure 2.5
    shows that a new terminal was'
