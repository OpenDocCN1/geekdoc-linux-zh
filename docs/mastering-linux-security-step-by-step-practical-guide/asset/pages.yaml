  md: 'opened a new file was created, the permissions for the file took the default
    permissions and the umask which was applied previously did not take effect on
    the new terminal. When a new session is initiated, the terminal will take the
    default permissions from the file in /etc/bashrc or /etc/profile and the default
    permissions of the umask will be 002 for all newly created files, this is the
    reason for why the umask changes after switching to a new terminal.


    ![](img/7be05572b414927ff78ba38f31a7ecfc_60_0.png)


