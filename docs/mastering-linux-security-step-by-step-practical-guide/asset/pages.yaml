- img_proc: true
  md: 'parts of the chapter was performed in accordance with the screenshots. The
    aim for each part of the report is as follows.


    The aim of part 0 to test and verify that Linux allows users to reboot or shutdown
    the server using multiple commands such as halt, reboot, shutdown, power off,
    or eject which could cause a denial of service to the server.


    The aim of part 1 to determine the file permissions for newly created files using
    three-digit octal number with a umask command, and to change the default set of
    permissions based on the umask command.


    The aim of part 2 to discover user account information stored in "/etc/passwd",
    and view the details of the current logged in user.


    The aim of part 3 to allow non-root users to execute particular commands as if
    they were the root, to be able to access the sudo file and add a user to the determined
    commands. Also to view the audit log and determine particular actions occurred.


    The aim of part 4 to explore various tools that allows the users to install, manage
    and updates software packages. Also to download packages from various sites and
    handle them through rpm and yum tools.


    The aim of part 5 to explore how to secure the system by locking when we leave
    the machine running using xlock command, to be able to disable applications to
    avoid denial of service attack, to be able to disable the direct root remote login
    through ssh and telnet a modification and finally to hide all related information
    from the login screen and display a warning messages motd and issue files.


    The aim of part 6 to install Wireshark software package as tools for sniffing
    network packets, to explore different options for interface for activity tracing,
    to be able to use Wireshark to sniff the entered username and password in http
    websites.


    # Tasks & Procedures


    # What are the risks


    Remotely connected users the permission to perform and run some of the console
    apps may rise various security risks; one of the major risks is that if an attacker
    performed halt, shutdown, or reboot to the system which may cause a denial of
    service attack.


    In this section two Fedora workstations were installed on VirtualBox. One of the
    machines was configured to be hosting ssh service while the other was communicating
    with it ssh. Through the established ssh connection halt command applied to test
    the effect on the other machine. Figure 2.1 shows the client and server machines'
