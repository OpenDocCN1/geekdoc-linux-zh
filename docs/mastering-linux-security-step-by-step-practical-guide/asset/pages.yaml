    # File Integrity Check with TripWire


    TripWire is a host-based ID that collects data from the host filesystem and configurations,
    these collected data to be checked and verified at later stage to identify the
    good and bad states of the system. TripWire can also notify the administrator
    if his system was compromised based on the specifications. After installing TripWire
    the database must be initialized and a good practice to that is to modify the
    policy file of TripWire to be matching with the requirements to reduce the false
    positives. TripWire can be configured to be running every day and sending email
    notifications to the administrator to keep him updated with all information even
    if he was away.


    # Syslog-ng


    Syslog-ng is an open source package that extends syslog with content-based filtering,
    rich filtering capabilities, flexible configuration options. Syslog-ng adds extra
    features and functionalities to syslog such as using TCP for transport.'
