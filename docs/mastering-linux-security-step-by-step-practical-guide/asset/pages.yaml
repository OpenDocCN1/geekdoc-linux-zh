    # SUID and SGID


    Linux OS permissions system provide the ability to set certain files or directories
    with SUID andor SGID. Setting SUID will let the user access the file as if he
    the owner of it setting SGID will let the user access the file as if he was a
    part of the group''s owning the file. In this section a test was performed to
    check the effect of activating and deactivating the SUID on password file and
    some other files. First task required changing ituser password and it was done
    using passwd ituser command. Then the location of password checked with the "which"
    and the result was /usr/bin/passwd.The set-uid program for the password file removed
    using the chmod u-s, in Figure 3.4 clearly shows the s removed from the file permission,
    which mean the normal user will not be able to run as root and permission denied
    error or other error will be shown when tried to execute passwd command. Figure
    3.5 demonstrated the error message shown when trying to change ituser password.
    The file turned into a set-uid program to give the normal user the chmod u+s command
    password is set with SUID to give the owner permissions so that he can update
