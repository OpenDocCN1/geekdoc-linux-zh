- pgno: 120
  md: 'This chapter explains how to install Red Hat Linux 7.0 without creating Linux
    partitions on your system.


    # Please Note


    Although this is a great way to explore the world of Red Hat Linux without having
    to put Linux partitions on your system, please note that you will still have to
    perform a full Red Hat Linux installation as outlined in this manual.


    # Please Note


    You must currently have a formatted DOS (FAT) filesystem in order to perform this
    type of installation. Users who have Win95/98 should have no problems with this
    type of installation. Users who have NTFS partitions (such as those using Windows
    NT) will have to create and format a DOS (FAT) filesystem before this installation
    can be performed. This installation will not work unless the DOS (FAT) filesystem
    has been formatted prior starting the Red Hat Linux installation.


    # B.1 The Ups and Downs of a Partitionless Installation


    There may be reasons why you might want to perform a partitionless installation,
    but there also are some drawbacks (depending on how you look at them). We’ll discuss
    these potential drawbacks below.


    Here we will cover the basics of what will happen, both during an installation
    and as a result of this type of installation, and how your system will be affected.


    Basic Installation'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'You will perform a basic Red Hat Linux installation. However, instead of adding
    Linux partitions to your system, you will edit an existing, formatted DOS (FAT)
    partition (that must have enough free space) to be named root (/).


    Unlike a typical Red Hat Linux installation, you will not need to format any partitions,
    since you will not be adding any partitions to your system.


    # LILO (Linux Loader) and Boot Disk


    In a partitionless installation, you will not configure LILO (the Linux Loader).
    In a typical installation, you are able to choose where you would like LILO to
    be installed -- either on the master boot record (MBR) or on the first sector
    of your root partition -- or you can choose not to install LILO at all.


    You must create a boot disk in order to access Red Hat Linux with a partitionless
    installation, and you will be prompted to create a boot disk at the end of the
    installation.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '121


    # Please Note


    In order to boot Red Hat Linux in a partitionless installation using the boot
    disk, you must have your BIOS configured correctly. Your BIOS must be set to boot
    from the floppy drive (A) in order for it to use the boot disk.


    To change your BIOS settings, you will need to take note of the instructions given
    when your computer first begins to boot. Often you will see a line of text telling
    you to press the [Del] or [F1] key to enter the BIOS settings.


    Next, you must find the section that allows you to alter your boot sequence. The
    default is often C, A or A, C (depending if you boot from your hard drive [C]
    or a floppy drive [A]). Change this sequence so that the floppy drive (A) is first
    in your boot order and that your hard drive (C) is second. This instructs the
    computer to first look at the floppy drive for bootable media, if it cannot be
    found there, it will look at your hard drive next.


    Make sure to save your changes before exiting the BIOS. For more information please
    refer to the documentation that came with your system.


    # Performance Implications


    Red Hat Linux will perform slower than it would if it had its own dedicated partitions.
    However, for those of you unconcerned with speed, a partitionless installation
    is a great way of seeing what Red Hat Linux has to offer without having to deal
    with partitioning your system.


    # B.2 Performing a Partitionless Installation


    If you have a DOS (FAT) filesystem you must first make sure you have a DOS (FAT)
    partition with enough free space to dedicate to this installation.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# B.2.1 How Much Space Do I Need?


    Like a typical installation, you will need to have enough available space in order
    to install Red Hat Linux on your system. To give you an idea, below is a list
    of installation methods and their *minimum* space requirements.


    For more information about these installation classes, see Section 3.6, *Step
    6 - Is a Workstation-Class Installation Best For You?*


    +   - Workstation - 900MB

    +   - Server - 1.7GB

    +   - Custom (choosing *Everything*) - 1.7GB


    # B.2.2 Using Disk Druid


    Since you will not be adding partitions or creating new partitions, there is relatively
    little that you actually need to do with **Disk Druid** (a GUI partitioning tool).


    What you should see when **Disk Druid''s** main screen appears is a list of your
    DOS (FAT) partitions (see Figure B-1, *Choosing DOS (FAT) Partition to Define
    as /*). Choose a DOS (FAT) partition with enough available free space to install
    your choice of installation classes. Highlight the partition by clicking on it
    with your mouse or by using the [Tab], [Up] and [Down] keys.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Figure B-1  Choosing DOS (FAT) Partition to Define as /


    ![](img/f097eb927132822630978994ad35bce4_124_0.png)


    Once the desired partition is highlighted, choose **Edit**. A new window will
    appear allowing you to name this partition (see Figure B-2, *Editing a DOS (FAT)
    Partition*). In the **mount point** field, label this partition as / (known as
    root) and click **Enter**.


    A confirmation window (see Figure B-3, *Confirmation*) will appear next asking
    you to confirm that you do want to continue with this installation. It also explains
    that you cannot have any Linux partitions on your system other than the / labeled
    DOS partition that you have just created. Click **Yes** to continue.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Figure B-2 Editing a DOS (FAT) Partition


    ![](img/f097eb927132822630978994ad35bce4_125_0.png)


    Next, you will be able to determine the root filesystem size and the swap size
    of this `/` partition.


    The installation program will determine the maximum size for the root filesystem
    (Figure B-4, *Configuration of Filesystem*). You can make the root filesystem
    anything you would like, as long as it does not exceed the maximum size recommendation.


    The size you create for the root filesystem is the amount of disk space available
    for the entire filesystem (this means that you need to keep in mind the size of
    the installation class as well as allow you space to write and save data to).


    Swap space acts like virtual memory. In other words, data is written to a swap
    partition when there is not enough RAM to store the data your system is processing.
    The installation program will set swap to 32MB as a default. You can choose to
    increase the swap size if desired, but there is no need to create a swap space
    larger than 256MB.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Figure B-3  Confirmation


    ![](img/f097eb927132822630978994ad35bce4_126_0.png)


    From here, you can continue following the main installation chapter (see Section
    5.12, *Network Configuration*) for further installation instructions. The only
    difference you will see from this point is a screen prompting you to create a
    boot disk. Once you make the boot disk and follow the other instructions, your
    installation will be complete.


    To access Red Hat Linux, make sure the boot disk that you created during the installation
    is in your floppy drive. When you reboot your system it will enter into Red Hat
    Linux rather than your other OS. To access your other OS, remove the boot disk
    and reboot your system.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Figure B–4  Configuration of Filesystem


    ![](img/f097eb927132822630978994ad35bce4_127_0.png)


    # B.2.3  How to Remove a Partitionless Installation From Your System


    To remove this partitionless installation, you will need to delete the following
    files from your DOS/Windows partition:


    ```

    redhat.img

    rh-swap.img

    ```


    These files can be found in the partition''s root directory (known as \ under
    DOS/Windows.) Once these files have been removed, Red Hat Linux will no longer
    boot on your system. Your system will return to its previous state and you will
    be able to access the space used by Red Hat Linux as you normally would.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# C Removing Red Hat Linux


    To uninstall Red Hat Linux from your system, you will need to remove the LILO
    information from your Master Boot Record (MBR).


    There are several methods to removing LILO from the master boot record of the
    machine. Inside of Linux, you can replace the MBR with an earlier saved version
    of the MBR using the /sbin/lilo command:


    ```

    /sbin/lilo -u

    ```


    In DOS, NT, and Windows 95 you can use fdisk to create a new MBR with the "undocumented"
    flag /mbr. This will ONLY rewrite the MBR to boot the primary DOS partition. The
    command should look like:


    ```

    fdisk /mbr

    ```


    If you need to remove Linux from a hard drive, and have attempted to do this with
    the default DOS fdisk, you will experience the "Partitions exist but they don''t
    exist" problem. The best way to remove non-DOS partitions is with a tool that
    understands partitions other than DOS.


    You can perform this with the installation floppy by typing "linux expert" (without
    the quotes) at the boot: prompt.


    ```

    boot: linux expert

    ```


    Select install (versus upgrade) and when it comes to partitioning the drive, choose
    fdisk. In fdisk type [p] to print out the partition numbers, and remove the Linux
    partitions with the [d] command. When you''re satisfied with the changes you have
    made, you can quit with a [w] and the changes will be saved to disk. If you deleted
    too much, type [q] and no changes will occur.


    Once you have removed the Linux partitions, you can reboot your computer by pressing
    [Control]+[Alt]+[Delete] instead of continuing with the install.'
  merge: -1
  img_proc: true
