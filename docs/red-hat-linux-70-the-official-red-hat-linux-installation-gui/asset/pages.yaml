    # ## D.7 Support Frequently Asked Questions (FAQ)


    # ### D.7.1 Q: E-Mail Messages to support@redhat.com Bounce


    I send e-mail to support@redhat.com but my messages bounce back to me. What is
    the problem?


    # ### D.7.2 A: support@redhat.com Is Not Used at This Time


    To better serve our customers, Red Hat is re-engineering our e-mail support process.
    At this time, the support@redhat.com address is not functional. In the meantime,
    please use support via the Web or by telephone.


    # ### D.7.3 Q: System Won''t Allow Login


    I know that I have already signed up, but the system will not let me log in.


    # ### D.7.4 A: Old Logins and Passwords Won''t Work


    You could be trying to use an old login and password, or simply mistyping your
    login or password.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# E Troubleshooting Your Installation of Red Hat Linux


    This appendix discusses some common installation problems you could encounter
    and solutions to those problems.


    # E.1 Trouble Booting Red Hat Linux


    # E.1.1 Trouble Booting from the CD-ROM?


    If you cannot boot from your Red Hat Linux CD-ROM, you have two options:


    +   1.  You can change your BIOS so that booting from CD-ROM is recognized first,
    or

    +   2.  Boot from the boot diskette included in the boxed set.


    To change your BIOS, you should refer to your system manual for the correct keyboard
    combination that will allow you to access your BIOS, or you can read the key sequence
    needed while the system begins to boot.


    To boot from the boxed set Red Hat Linux boot disk, insert the diskette into your
    floppy drive and then boot/reboot your computer.


    # E.1.2 Trouble Booting from the Red Hat Linux Boot Disk?


    If you are experiencing difficulties in getting the Red Hat Linux boot disk to
    boot your system correctly, you may need an updated boot disk.


    Check the online errata for updated diskette images and follow the instructions
    provided to make a new boot disk for your system.


    # E.1.3 Trouble Booting from a PCMCIA Boot Disk?


    If you are experiencing difficulties in getting the PCMCIA boot disk you made
    to boot your system correctly, you may need an updated boot disk.


    Check the online errata for updated diskette images and follow the instructions
    provided to make a new boot disk for your system.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# E.1.4 Trouble Booting from a Network Boot Disk?


    If you are experiencing difficulties in getting the network boot disk you made
    to boot your system correctly, you may need an updated boot disk.


    Check the online errata for updated diskette images and follow the instructions
    provided to make a new boot disk for your system.


    # E.2 Trouble Beginning the Installation


    # E.2.1 Trouble Using Options Needed with a PCMCIA Boot Disk?


    If you booted using a PCMCIA boot disk and want to install via FTP (or NFS or
    HTTP), but do not see these installation options, you may have a problem with
    your network card.


    If the network card is not initialized during the boot process, the Red Hat Linux
    installation program will *not* enable you to configure your system for networking
    (either at boot time or during the installation itself).


    Check the hardware compatibility list (http://www.redhat.com/support/hardware)
    to see if your network card is compatible and/or supported. If your card is not
    listed, chances are it is not compatible with Red Hat Linux.


    # E.3 Trouble During the Installation


    # E.3.1 Trouble Getting the Automatic Partitioning Screen?


    If the **Automatic Partitioning** screen does not appear during your installation,
    you probably do not have enough free space in which to install Red Hat Linux.


    If you do not want to partition manually, you should exit out of the installation,
    which can be done by rebooting your system once you have removed any diskettes
    or CD-ROMs, and then you can reallocate space for your installation.


    # E.3.2 Trouble Creating Partitions?


    If you are having trouble creating a partition, for instance a root (\ /) partition,
    there are a couple of things you should be aware of.


    Make sure you are setting it as a Linux Native partition type.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Unless your BIOS supports otherwise, make sure you are not exceeding 1023 cylinders,
    otherwise you will not be able to create a /boot or a / partition. Some new systems
    will allow you to exceed the 1023 limit (with the new LILO version that is available),
    but most machines with older BIOS will not.


    # E.3.3 Trouble Completing Partitions?


    If you are using Disk Druid to create partitions, but cannot move to the next
    screen, you probably have not created all the partitions necessary for Disk Druid''s
    dependencies to be satisfied.


    You must have the following partitions as a bare minimum:


    +   - / (root) partition, Linux native type

    +   - <swap> partition, Linux swap type


    ![](img/f097eb927132822630978994ad35bce4_138_0.png)


    If your system will be a dual-boot system using LILO, then you also must create:


    +   - /boot partition, Linux native type


    # E.3.4 Trouble Installing Packages?


    If you are having trouble installing packages (for example the installation program
    stalls while reading the packages or you get error messages), you may have a disk
    or drive problem.


    # E.4 Trouble After the Installation


    # E.4.1 Trouble With the Graphical LILO Screen?


    If for some reason you need to disable the graphical boot screen, you can do so
    by editing the lilo.conf file and then rerunning LILO.


    To do this, comment out (or delete) the line which reads message=/boot/message
    in the lilo.conf file. Once you have done this, rerun LILO. The next time you
    boot, you will see the text LILO: prompt, as is seen in previous Red Hat Linux
    releases.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'You may also re-enable the graphical boot screen by adding the above line back
    into the `lilo.conf` file and rerunning LILO.


    # E.4.2 Trouble With Server Installations and X?


    If you performed a server installation and you are having trouble getting X to
    start it is because the X Window System is not installed during a server-class
    installation.


    You can have the X Window System interface running with a server class installation
    by selecting to do an upgrade after the install. During the upgrade, select the
    X Window System packages, and choose GNOME or KDE (or both).


    # E.4.3 Trouble Logging In?


    If you did not create a user account during the installation you will need to
    log in as *root* and use the password you assigned to root.


    If you cannot remember your root password, you will need to boot your system as
    `linux single` at the LILO `boot:` prompt. Then at the `#` prompt, you will need
    to type `passwd root`, which will allow you to enter in a new password for root.
    At this point you can type `shutdown -r now` and the system will reboot with your
    new password.


    If you cannot remember your user account password, you must become root, then,
    type `passwd <username>`. This allows you to enter a new password for the specified
    user account.


    If you selected either the custom- or workstation-class installation and do not
    find the graphical login screen, check your hardware for compatibility issues.
    The hardware compatibility list can be found at http://www.redhat.com/support.'
  merge: -1
  img_proc: true
