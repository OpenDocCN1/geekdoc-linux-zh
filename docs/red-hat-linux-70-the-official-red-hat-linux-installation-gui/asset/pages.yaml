    \ and covers installation on a single computer. This assistance is intended to\
    \ help customers successfully install Red Hat Linux. Assistance with installation\
    \ is offered via telephone and the Web.\n\nRed Hat Support will attempt to answer\
    \ any questions you may have before the installation process is initiated. This\
