    # A.4  Selecting Packages to Upgrade


    Here, you are given the opportunity to choose which packages you would like to
    upgrade (see Figure A-3, Individual Package Selection).


    On the left side of the screen you will see a directory listing of various package
    groups. When you expand this list (double-click to select it) and double-click
    on a single directory, the list of packages available for installation will appear
    on the right.


    To select an individual package, double-click on it, or click on it once to highlight
    it and click on the Select Package For Installation button below. A red check
    mark will appear on any of the packages you have selected for installation.


    To read information about a particular package before choosing it for installation,
    left-click on it once to highlight it, and the information will appear at the
    bottom of the screen along with the name and size of the package.'
  merge: -1
