- pgno: 108
  md: '# # A Upgrading Your Current System


    This appendix walks you through a typical Red Hat Linux 7.0 upgrade.


    # ## A.1 What it Means to Upgrade


    The installation process for Red Hat Linux 7.0 includes the ability to upgrade
    from prior versions of Red Hat Linux (version 3.0.3 and later) which are based
    on RPM technology.


    Upgrading your system installs the modular 2.2.x kernel as well as updated versions
    of the packages which are currently installed on your system.


    The upgrade process preserves existing configuration files by renaming them using
    an `.rpm-save extension` (e.g. `sendmail.cf.rpm save`) and leaves a log of the
    actions it took in `/tmp/upgrade.log`. As software evolves, configuration file
    formats can change, so you should carefully compare your original configuration
    files to the new files before integrating your changes.


    > > **Please Note**

    > >

    > > Some upgraded packages may require that other packages are also installed
    for proper operation. If you choose to customize your packages to upgrade, you
    may be required to resolve any *dependency* problems. Otherwise, the upgrade procedure
    takes care of these dependencies, but it may need to install additional packages
    which are not on your existing system.


    # ## A.2 Upgrading Your System


    At this point, you should have chosen **Upgrade** as your preferred installation
    type (see Figure A–1, *Choosing to Upgrade*).'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/f097eb927132822630978994ad35bce4_109_0.png)


    ![](img/f097eb927132822630978994ad35bce4_109_1.png)


    # A.3 Customizing Your Upgrade


    Do you want to choose your packages to be upgraded or let the installation program
    perform an automated installation (see Figure A-2, *Upgrade Customization*)?


    To let the installation program begin the upgrade process for you, make sure the
    **Customize packages to upgrade** is *not* selected and click **Next** (see Section
    A.6, *Upgrading Packages*).


    To customize your upgrade packages, select this option and then click **Next**.'
  merge: -1
  img_proc: true
