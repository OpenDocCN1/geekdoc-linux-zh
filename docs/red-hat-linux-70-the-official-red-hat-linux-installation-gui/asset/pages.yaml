- pgno: 106
  md: 'Do whatever is appropriate to boot Red Hat Linux. You should see one or more
    screens of messages scroll by. Eventually, you should see a login: prompt or a
    GUI login screen (if you installed the X Window System and chose to start X automatically).


    # Tip


    If for some reason you need to disable the graphical boot screen, you can do so
    by editing the lilo.conf file and then rerunning LILO.


    To do this, comment out (or delete) the line which reads message=/boot/message
    in the lilo.conf file. To comment a line out, insert the [#] character at the
    beginning of the line. Once you have done this, rerun LILO. The next time you
    boot, you will see the text LILO: prompt, as is seen in previous Red Hat Linux
    releases.


    You may also re-enable the graphical boot screen by adding the above line back
    into the lilo.conf file and rerunning LILO.


    # Tip


    If you''re not sure what to do next, we suggest you begin with the Official Red
    Hat Linux Getting Started Guide, which covers topics relating to the basics of
    your system, as an introduction to using Red Hat Linux.


    If you are a more experienced user looking for information on system configuration
    or administration topics, you may find the Official Red Hat Linux Reference Guide
    on the Documentation CD to be more helpful.'
  merge: -1
