    displayed on **Disk Druid''s** main screen (though you may have to scroll through
    the "Partitions" section to see them).


    To fix an unallocated requested partition, you must move the partition to another
    drive which has the available space, resize the partition to fit on the current
    drive, or delete the partition entirely. Make changes using the Edit button or
    by double clicking on the partition.


