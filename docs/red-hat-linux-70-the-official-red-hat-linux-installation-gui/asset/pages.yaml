    GNOME and KDE are both graphical **desktop environments**³ that handle the overall
    look and feel of your system. You must choose one of these to have a default graphical
    setup, but you can also install both to determine for yourself which you prefer.


    If you do not have unlimited space (at least 1.7G) to install both, the following
    section will help make the choice a little easier for you.


    > ³ A desktop environment in Linux is similar to the environment you might see
    in other operating systems. However, environments differ in their look and feel
    and are easily customized for your individual needs.'
