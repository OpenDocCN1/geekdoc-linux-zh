- pgno: 50
  md: 'Notice the two tabs at the top of the screen (see Figure 5-11, Configuring
    Time Zone). The first tab offers you the ability to configure by location. With
    this option, you can choose your view. In choosing view, your options are: **World**,
    **North America**, **South America**, **Pacific Rim**, **Europe**, **Africa**,
    and **Asia**.


    From the interactive map, you can also click on a specific city, as indicated
    by the yellow dots; a red **X** will appear indicating your selection. You can
    also scroll through a list and choose your desired time zone.


    The second tab offers you the ability to use the UTC offset. UTC presents you
    with a list of offsets to choose from, as well as an option to set daylight saving
    time.


    For both tabs, there is the option of selecting **System Clock uses UTC**. Please
    select this if you know that your system is set to UTC.


    # Tip


    If you wish to change your time zone configuration after you have booted your
    Red Hat Linux system, become root and use the */usr/sbin/timeconfig* command.


    # 5.14 Account Configuration


    The **Account Configuration** screen allows you to set your root password. Additionally,
    you can set up user accounts for you to log into once the installation is complete
    (see Figure 5-12, *Account Creation*).


    # 5.14.1 Setting the Root Password


    The installation program will prompt you to set a **root password** for your system.
    Entering a root password is required. The installation program will not let you
    proceed to the next section without entering a root password.


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice; if the two passwords
    do not match, the installation program will ask you to enter them again.


    A root password is the administrative password for your Red Hat Linux system.
    You should only log in as root when needed for system maintenance. Changes that
    are made when logged in as root will affect the the system and all users created
    on the system.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'You should make the root password something you can remember, but not something
    that is easy for someone else to guess. Your name, your phone number, **qwerty,
    password, root, 123456**, and **ant eater** are all examples of poor passwords.
    Good passwords mix numerals with upper and lower case letters and do not contain
    dictionary words: **Aard387vark** or **429BkIIKT**, for example. Remember that
    the password is case-sensitive. Write down this password and keep it in a secure
    place.


    # Please Note


    Do not use one of the example passwords offered in this manual. Using one of these
    passwords could be considered a security risk.


    # Figure 5-12 Account Creation


    ![](img/f097eb927132822630978994ad35bce4_51_0.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/f097eb927132822630978994ad35bce4_52_0.png)


    > The **root** user (also known as the **superuser**) has complete access to the
    entire system; for this reason, logging in as the root user is best done *only*
    to perform system maintenance or administration.


    # 5.14.2 Setting Up User Accounts


    A user account allows you to safely and easily log into your computer without
    having to be root to create other accounts.


    Enter an account name. Then enter and confirm a password for that user account.
    Enter the full name of the account user and press [Enter]. Your account information
    will be added to the account list, clearing the user account fields so you can
    add another user.


    You can also choose **New** to add a new user. Enter the user’s information and
    use the **Add** button to add the user to the account list.


    You can also **Edit** or **Delete** the user accounts you have created or no longer
    want.


    # 5.15 Selecting Package Groups


    Although a workstation-class installation will automatically choose most of the
    packages for you, you must select either GNOME or KDE (or both). You can also
    choose whether to install the **Games** package.


    Additionally, if you would like to select individual packages, check **Select
    Individual Packages** and click **Next**.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Figure 5–13 Package Selection


