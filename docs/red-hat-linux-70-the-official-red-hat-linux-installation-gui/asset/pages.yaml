- pgno: 77
  md: "# **Please Note**\n\nIf you have not yet planned how you will set up your partitions,\
    \ refer to the partitioning appendix in the *Official Red Hat Linux Reference\
    \ Guide* on the Documentation CD. As a bare minimum, you’ll need an appropriately-sized¹\
    \ root partition, and a swap partition of at least 16 MB.\n\nThe partitioning\
    \ tool used in Red Hat Linux 7.0 is *Disk Druid*. With the exception of certain\
    \ esoteric situations, Disk Druid can handle the partitioning requirements for\
    \ a typical Red Hat Linux installation.\n\nUnless you have a reason for doing\
    \ otherwise, we recommend that you create the following partitions:\n\n+   - A\
    \ swap partition (at least 16MB) -- Swap partitions are used to support **virtual\
    \ memory**. In other words, data is written to a swap partition when there is\
    \ not enough RAM to store the data your system is processing. If your computer\
    \ has 16MB of RAM or less, you *must* create a swap partition. Even if you have\
    \ more memory, a swap partition is still recommended. The minimum size of your\
    \ swap partition should be equal to your computer’s RAM, or 16MB (whichever is\
    \ larger). In Disk Druid, the partition field for swap should look similar to:\n\
    +   \n+   \t`<swap> hda2 125M 125M Linux swap`\n\n+   - A /boot partition (16MB,\
    \ maximum) -- The partition mounted on /boot contains the operating system kernel\
    \ (which allows your system to boot Red Hat Linux), along with files used during\
    \ the bootstrap process. Due to the limitations of most PC BIOSes, creating a\
    \ small partition to hold these files is a good idea. This partition should be\
    \ no larger than 16MB. In Disk Druid, the partition field for /boot should look\
    \ similar to:\n+   \n+   \t`/boot hda1 16M 19M Linux native`\n\n+   - A root partition\
    \ (900MB-1.7GB) -- This is where \"/\" (the root directory) resides. In this setup,\
    \ all files (except those stored in /boot) reside on the root partition. A 850MB\n\
    \n¹ Appropriately-sized is best defined by the amount of available space you have\
    \ to dedicate to Red Hat Linux, the size of the installation you are preparing\
    \ for, and the space you will physically dedicate to Red Hat Linux. We recommend\
    \ 900M for a minimum root partition size."
  merge: -1
  img_proc: true
- pgno: 78
  md: 'root partition will permit the equivalent of a workstation-class installation
