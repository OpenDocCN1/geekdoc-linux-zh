- pgno: 14
  md: '# ## 3 Seven Steps to Get You Started


    There are seven steps you should perform prior to installing Red Hat Linux:


    # ### 3.1 Step 1 - Do You Have the Right Red Hat Linux Components?


    If you''ve purchased the Official Red Hat Linux boxed set, you''re ready to go!
    However, mistakes occasionally happen, so now is a good time to double-check the
    contents of your boxed set.


    In your Red Hat Linux box, there is a red and white **Registration Card**. On
    the back of that card is a list of the contents of your boxed set version. Please
    read over this list and check to make sure that you have all the diskettes and
    manuals that are available with your version.


    If you''ve purchased the Official Red Hat Linux boxed set from Red Hat, Inc. (or
    one of its distributors), and you''re missing one or more of the items listed,
    please let us know! Contact information is also available on the Registration
    Card.


    *How to identify our official boxed set:* The bottom of our box has an ISBN number
    next to one of the bar codes. That ISBN number should be in this form:


    ```

    1-58569-xx-y

    ```


    (The xx and y will be unique numbers.)


    Red Hat partners with companies (international and domestic) so that we can make
    Red Hat Linux available to you in the most convenient form. Because of these partnerships,
    you might find that your Red Hat Linux boxed set may not have been actually produced
    by Red Hat.


    If your box has a different ISBN number (or none at all), you''ll need to contact
    the company that produced your boxed set. Normally, third-party producers will
    include their logo and/or contact information on the outside of the box; an official
    Red Hat Linux boxed set lists only our name and contact information.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 3.1.1 Why You Should Register Your Red Hat Linux Boxed Set


    If you have purchased an official Red Hat Linux 7.0 boxed set, you should register
    your prod-uct. Registration offers you many useful services, such as installation
    help support, priority FTP access, and more.


    To register your product, go to http://www.redhat.com/now. You’ll find your Personal
    Prod-uct ID on the red and white registration card in your Official Red Hat Linux
    boxed set. Once registered, you will be able to partake of all the extras Red
    Hat provides to its registered users.


    For more information on registering and the scope of Red Hat’s technical support
    offerings, see Appendix D, Getting Technical Support.


    # 3.1.2 No Boxed Set? No Problem!


    Of course, not everyone purchases a Red Hat Linux boxed set. It’s entirely possible
    to install Red Hat Linux using a CD created by another company, or even via FTP.
    In these cases, you may need to create one or more diskettes to get started.


    For information on downloading and installing Red Hat Linux via FTP, refer to
    http://www.redhat.com/download/howto\_download.html.


    For people installing Red Hat Linux from a CD-ROM not from Red Hat, you may need
    a boot disk, or if using a PCMCIA device during the installation (such as a laptop),
    a PCMCIA boot disk. It may also be possible to start the installation directly
    from the CD. We’ll discuss this in more detail when we outline the various installation
    methods.


    For information on making diskettes, see Section 3.5.2, Making Installation Diskettes.


    # 3.2 Step 2 - Is Your Hardware Compatible?


    Hardware compatibility is particularly important if you have an older system or
    a system that you may have built yourself. Red Hat Linux 7.0 should be compatible
    with most hard-ware in systems that were factory built within the last two years.
    However, with hardware specifications changing almost daily, it’s hard to guarantee
    that your hardware will be 100% compatible.


    First, gather all the system hardware information you can; the Official Red Hat
    Linux Refer-ence Guide on the Documentation CD has instructions in the Installation-Related
    Reference'
  merge: -1
  img_proc: true
- pgno: 16
  md: '(including instructions for Windows users) which may assist you. In Chapter
    4, *System Requirements Table*, a table is available for you to fill out and reference
    during the installation.


    Second, use Red Hat''s online resources to make sure your hardware is compatible
    and/or supported. The hardware compatibility list is located at: `http://www.redhat.com/hardware`.


    # ## 3.3 Step 3 - Do You Need Errata?


    Occasionally, we find that the installation may fail, and that a revised diskette
    image is needed for the installation to work properly. In these cases, we make
    special images available via the Red Hat Linux errata listing. Since this is relatively
    rare, you will save time if you try to use the standard diskette images first.
    Review the errata only if you experience problems completing the installation.


    Although most of the time it''s not necessary to check for errata before the installation,
    it is also not a bad idea, either.


    Red Hat offers updated diskette images, documentation and other errata downloads
    for your convenience.


    There are two ways to review the errata:


    +   1.  Online -- `http://www.redhat.com/support/errata`; supplies errata you
    can read online, and you can download diskette images easily.

    +   2.  E-mail -- By sending an empty mail message to `errata@redhat.com`, you
    will receive an e-mail containing a text listing of the complete errata of the
    installation program and related software (if errata exist at that time). Also
    included are URLs to each updated package and diskette image in the errata. Using
    these URLs, you can download any necessary diskette images. Please note: use binary
    mode when transferring a diskette image.


    If you experience problems, focus on entries that include new diskette images
    (the filenames always end in `.img`). If you find an entry that applies to your
    problem, get a copy of the diskette images, and create them using the instructions
    in Section 3.5.2, *Making Installation Diskettes*.


    Also available are documentation errata. When significant changes are made to
    the manuals, we make sure to update these online as well. Documentation updates
    can be found at `http://www.redhat.com/support/errata/doc_errata`.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 3.4 Step 4 - Do You Have Enough Disk Space?


    Nearly every modern-day operating system uses disk partitions, and Red Hat Linux
    is no exception. When installing Red Hat Linux, it may be necessary to work with
    disk partitions. If you have not worked with disk partitions before (or would
    like a quick review of the basic concepts) please read An Introduction to Disk
    Partitions in the appendix of the Official Red Hat Linux Reference Guide on the
    Documentation CD before proceeding.


    If Red Hat Linux will share your system with another OS, you will need to make
    sure you have enough available disk space on your hard drive(s) for this installation.


    This disk space must be separate from the disk space used by other OSes you may
    have installed on your system, such as Windows, OS/2, or even a different version
    of Linux. This is done by dedicating one or more partitions to Red Hat Linux.


    Before you start the installation process, one of the following conditions must
    be met:


    +   - Your computer must have enough unpartitioned disk space.

    +   - You must have one or more partitions that may be deleted, thereby freeing
    up enough disk space to install Red Hat Linux.

    +   - You must have a preexisting, formatted FAT (DOS) partition with sufficient
    disk space, and install using the partitionless installation method (Appendix
    B, Installing Without Partitioning).


    > > **Please Note**

    > > To perform a partitionless installation, you also must choose the class of
    installation you want to perform. However, unlike a typical installation, you
    will not have to worry about losing any information on your system. A partitionless
    installation will not remove existing partitions. For more information, turn to
    Appendix B, Installing Without Partitioning.


    A workstation-class installation requires at least 900MB of free space. This installation
    size requirement is the same for partitionless installations.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '**Please Note**


    To use the automatic partitioning feature of Red Hat Linux you must have enough
    free disk space available (900MB or more), otherwise this option will not appear
    during your installation.


    If you are not sure that you meet these conditions or want to know how to free
    up more space for your Red Hat Linux installation, please refer to the partitioning
    appendix in the Official *Red Hat Linux Reference Guide* on the Documentation
    CD.


    # 3.5 Step 5 - Can You Install Using the Red Hat Linux CD-ROM?


    Although there are several methods that can be used to install Red Hat Linux,
    this manual only focuses on installing from the CD-ROM. For instructions on alternative
    installation methods, refer to the Official Red Hat Linux Reference Guide on the
    Documentation CD.


    Installing from a CD requires that you have purchased a Red Hat Linux 7.0 boxed
    set (or have a Red Hat Linux CD-ROM) and have a CD-ROM drive. Most new computers
    will allow booting from the CD-ROM. With this method, you can easily use the Red
    Hat Linux CD-ROM to boot the installation program and perform a local CD-ROM installation.


    # 3.5.1 Alternative Boot Methods


    There are alternative boot methods available, if you cannot boot from the CD-ROM
    drive.


    # Local Boot Disk


    +   • You may need a **local boot disk** or a **PCMCIA boot disk**, if you cannot
    boot from the CD-ROM drive.


    +   • Included in your Official Red Hat Linux 7.0 boxed set is a local boot disk.
    However, if you do not have a local boot disk (for example, you downloaded Red
    Hat Linux rather than purchasing an official boxed set) you can make one. Refer
    to Section 3.5.2, *Making Installation Diskettes* for those instructions.


    # PCMCIA Boot Disk'
  merge: -1
  img_proc: true
- pgno: 19
  md: "You may need a PCMCIA boot disk if you are using a PCMCIA device to install\
    \ Red Hat Linux. If you need a PCMCIA boot disk, you must create one. Refer to\
    \ Section 3.5.2, *Making Installation Diskettes* for those instructions.\n\nHere’s\
    \ a checklist to help you determine if you’ll need to create a PCMCIA boot disk:\n\
    \n+   • You will install Red Hat Linux from a CD-ROM, and your CD-ROM drive is\
    \ attached to your computer through a PCMCIA card.\n+   • You will use a PCMCIA\
    \ network adapter during the installation.\n\nThe PCMCIA boot disk image file\
    \ is **pcmcia.img**, and is located in the **images** directory on your Red Hat\
    \ Linux/Intel CD. Refer to Section 3.5.2, *Making Installation Diskettes* for\
    \ more information.\n\n> **Please Note**\n> \n> Although not required to boot\
    \ your installation, you may occasionally find that a driver disk is needed for\
    \ you to continue with the installation. The **Driver Disks** appendix in the\
    \ **Official Red Hat Linux Reference Guide** (on the Documentation CD) explains\
    \ why a driver disk may be necessary for your installation, and how to obtain\
    \ one if needed.\n\n# 3.5.2 Making Installation Diskettes\n\nIt is sometimes necessary\
    \ to create a diskette from an **image file**; for example, you may need to use\
    \ updated image images obtained from the Red Hat Linux errata page or you may\
    \ need to create a boot disk.\n\nAn image file contains an exact copy (or image)\
    \ of a diskette’s contents. Since a diskette contains filesystem information in\
    \ addition to the data contained in files, the image file is not usable until\
    \ it has been written to a diskette.\n\nTo start, you’ll need a blank, formatted,\
    \ high-density (1.44MB), 3.5-inch diskette. You’ll need access to a computer with\
    \ a 3.5-inch diskette drive, and capable of running an MS-DOS program, or the\
    \ **dd** utility found on most Linux-based operating systems.\n\nThe **images**\
    \ directory on your Red Hat Linux CD contains the boot images for Red Hat Linux/Intel.\
    \ Once you’ve selected the proper image, transfer the image file onto a diskette."
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Section 3.5:Step 5 - Can You Install Using the Red Hat Linux CD-ROM?


    # Making a Diskette Under MS-DOS


    To make a diskette under MS-DOS, use the `rawrite` utility included on the Red
    Hat Linux CD in the `dosutils` directory. First, label a blank, formatted 3.5-inch
    diskette appropriately (such as "Boot Disk" or "Updates Disk"). Insert it into
    the diskette drive. Then, use the following commands (assuming your CD is drive
    d:):


    ```

    ```

    C:\> d:

    D:\> cd \dosutils

    D:\dosutils> rawrite

    Enter disk image source file name: ..\images\boot.img

    Enter target diskette drive: a:

    Please insert a formatted diskette into drive A: and

    press --ENTER-- : [Enter]

    D:\dosutils>```


    ```


    First, `rawrite` asks you for the `filename` of a diskette image; enter the directory
    and name of the image you wish to write (for example, `..\images\boot.img`). Then
    `rawrite` asks for a diskette drive to write the image to; enter `a:`. Finally,
    `rawrite` asks for confirmation that a formatted diskette is in the drive you''ve
    selected. After pressing [Enter] to confirm, `rawrite` copies the image file onto
    the diskette. If you need to make another diskette, label that diskette, and run
    `rawrite` again, specifying the appropriate image file.


    # Making a Diskette Under a Linux-Like OS


    To make a diskette under Linux (or any other Linux-like operating system), you
    must have permission to write to the device representing a 3.5-inch diskette drive
    (known as `/dev/fd0` under Linux).


    First, label a blank, formatted diskette appropriately (such as "Boot Disk" or
    "Updates Disk"). Insert it into the diskette drive (but don''t issue a `mount`
    command). After mounting the Red Hat Linux CD, change directory to the directory
    containing the desired image file, and use the following command (changing the
    name of the image file and diskette device as appropriate):


    ```

    ```

    # dd if=boot.img of=/dev/fd0 bs=1440k

    ```

    ```


    To make another diskette, label that diskette, and run `dd` again, specifying
    the appropriate image file.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# ## 3.6 Step 6 - Is a Workstation-Class Installation Best For You?


    Although Red Hat Linux includes four different classes, or types of installations,
    this manual only discusses workstation-class installations.


    # ### 3.6.1 What a Workstation-Class Installation Will Do


    In choosing automatic partitioning, a workstation-class installation removes all
    Linux-related partitions on all installed hard drives (and uses all free unpartitioned
    disk space) to create the following partitions:


    +   - A 64MB swap partition.

    +   - A variable-sized root partition (mounted as /) in which all other files
    are stored (the exact size of this partition is dependent on your available disk
    space).

    +   - A 16MB partition (mounted as /boot) in which the Linux kernel and related
    files reside.


    > **Please Note**

    > You''ll need at least 900MB of free disk space in order to perform a workstation-class
    installation.


    This installation will remove *all* existing Linux partitions on *all* hard drives
    in your system; non-Linux partitions will not be removed.


    A workstation-class installation will install your choice of a GNOME or KDE (or
    both) desktop environment, and the X Window System.


    # ### 3.6.2 What a Workstation-Class Installation Will Not Do


    A workstation-class installation will not erase your Windows 3.1/95/98 configuration.
    Instead, it will automatically configure your system to dual-boot using LILO (the
    Linux Loader).


    A workstation-class installation will not allow you to customize your group package
    selection. If you do not want the installation program to select packages for
    you, please choose a custom-class installation and refer to the *Official Red
    Hat Linux Reference Guide* on the Documentation CD.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/f097eb927132822630978994ad35bce4_22_0.png)


    A workstation-class installation will not install correctly if you plan to create
    a dual-boot system with Windows NT as the second OS. If you''re sharing a system
    with Windows NT, you will be unable to boot Windows NT. LILO will write over NT''s
    boot loader and you will be unable to boot NT. You must perform a custom-class
    installation and configure LILO so that it is not installed on the Master Boot
    Record (MBR).


    # Please Note


    Unlike earlier workstation-class installations, performing a Red Hat Linux 7.0
    workstation-class installation will not install the network daemon xinetd (inet
    services). Withholding xinetd results in a more secure installation; however,
    in-bound¹, network-related services such as finger, telnet, talk, and FTP will
    not work. If you require these types of services, choose a server- or a custom-class
    installation.


    ¹ In-bound services mean that you can telnet, for instance, out to other systems,
    but that other systems cannot telnet into your system.'
  merge: -1
  img_proc: true
