- pgno: 28
  md: '# # 5 Installing Red Hat Linux From Start to Finish


    This chapter discusses all steps of a Red Hat Linux workstation-class installation.
    We''ll cover the following areas:


    +   - Getting familiar with the installation program''s user interface

    +   - Starting the installation program

    +   - Selecting an installation method

    +   - Configuration steps during the installation (language, keyboard, mouse,
    etc.)

    +   - Finishing the installation


    By the end of this chapter, you will have Red Hat Linux 7.0 installed on your
    system.


    # ## 5.1 The Installation Program User Interface


    If you''ve used a **graphical user interface (GUI)** before, you''ll be familiar
    with this process. If not, simply use your mouse to navigate the screens, "click"
    buttons or enter text fields. You can also navigate through the installation using
    the [Tab] and [Enter] keys.


    If you do not wish to use the GUI installation program, the text mode installation
    program is also available. To enter text mode, enter the following boot command:


    ```

    boot: text

    ```


    # ### 5.1.1 Mouse Not Detected?


    If the **Mouse Not Detected** screen (see Figure 5-1, *Mouse Not Detected*) appears,
    then the installation program was not able to identify your mouse correctly.


    You can choose to continue with the GUI installation or use the text mode installation,
    which does not require using a mouse. If you choose to continue with the GUI installation,
    you will need to provide the installation program with your mouse configuration
    information (see Figure 5-4, *Mouse Configuration*).'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# **Figure 5–1 Mouse Not Detected**


    ![](img/f097eb927132822630978994ad35bce4_29_0.png)


    For text mode workstation-class installation instructions, please refer to Chapter
    6, *Text Mode Installations at a Glance*.


    For text mode custom installation instructions, please refer to the *Official
    Red Hat Linux Reference Guide* on the Documentation CD.


    # **5.1.2 A Note About Virtual Consoles**


    The Red Hat Linux installation program offers more than the dialog boxes of the
    installation process. Several types of diagnostic messages are available to you,
    and you’re additionally provided a way to enter commands from a shell prompt.
    This information is presented on five **virtual consoles**, among which you can
    switch using a single keystroke.


    These virtual consoles are helpful if you encounter a problem while installing
    Red Hat Linux. Messages displayed on the installation or system consoles can help
    pinpoint a problem. Please see Table 5–1, *Console, Keystrokes, and Contents*
    for a listing of the virtual consoles, keystrokes to switch to them, and their
    contents.'
  merge: -1
  img_proc: true
- pgno: 30
  md: "Generally, there’s no reason to leave the default console (virtual console\
    \ #7) unless you are attempting to diagnose installation problems. But if you\
    \ get curious, feel free to look around.\n\n# Table 5–1 Console, Keystrokes, and\
    \ Contents\n\n| Console | Keystrokes | Contents |\n| :--- | :--- | :--- |\n| 1\
    \ | [Ctrl]+[Alt]+[F1] | installation dialog |\n| 2 | [Ctrl]+[Alt]+[F2] | shell\
    \ prompt |\n| 3 | [Ctrl]+[Alt]+[F3] | install log (messages from installation\
    \ program) |\n| 4 | [Ctrl]+[Alt]+[F4] | system-related messages |\n| 5 | [Ctrl]+[Alt]+[F5]\
    \ | other messages |\n| 7 | [Ctrl]+[Alt]+[F7] | X graphical display |\n\n# 5.2\
    \ Starting the Installation Program\n\nNow it’s time to begin installing Red Hat\
    \ Linux. To start the installation, you must first boot the installation program.\
    \ Please make sure you have all the resources you’ll need for the installation.\
    \ If you’ve already read through Chapter 3, *Seven Steps to Get You Started*,\
    \ and followed the instructions, you should be ready to begin.\n\n> **Please Note**\n\
    > \n> Occasionally, some hardware components require a **driver disk** during\
    \ the installation. The driver disk could be produced by Red Hat, it could be\
    \ a disk made by you, or it could be a disk that a hardware vendor includes with\
    \ a piece of hardware. Another source for finding driver disks is http://www.redhat.com/support/errata/.\n\
    > \n> If a screen appears prompting you to insert a driver disk, please do so.\
    \ For more information about driver disks, refer to *Appendix C, Driver Disks*\
    \ in the *Official Red Hat Linux Reference Guide* on the Documentation CD."
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 5.2.1 Booting the Installation Program


    **Please Note**


    If you need to create a boot disk, please refer to Section 3.5.2, *Making Installation
    Disquettes*.


    Insert the boot disk into your computer''s first diskette drive and reboot (or
    boot using the CD-ROM, if your computer supports this).


    Your BIOS settings may need to be changed to allow you to boot from the diskette
    or CD-ROM.


    **Tip**


    To change your BIOS, take note of the instructions given when your computer first
    begins to boot. Often you will see a line of text telling you to press the [Del]
    or [F1] key to enter the BIOS settings.


    Next, find the section where you can alter your boot sequence. The default is
    often C, A or A, C (depending on whether you boot from your hard drive [C] or
    a floppy drive [A]). Change this sequence so that the CD-ROM is first in your
    boot order and that C or A (whichever is your typical boot default) is second.
    This instructs the computer to first look at the CD-ROM drive for bootable media;
    if it cannot be found there, it will look at your hard drive or floppy next.


    Save your changes before exiting the BIOS. For more information please refer to
    the documentation that came with your system.


    There are three possible workstation-class boot methods:


    +   - *Bootable CD-ROM* -- your machine supports a bootable CD-ROM drive and you
    want to perform a local CD-ROM installation.

    +   - *Local boot disk* -- your machine will not support a bootable CD-ROM and
    you want to install from a local CD-ROM or a hard drive.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   *   *PCMCIA boot disk* -- use in cases where you need PCMCIA support, but
    your machine does not support booting from the CD-ROM drive *or* if you need PCMCIA
    support in order to make use of the CD-ROM drive on your system. This boot disk
    offers you all installation methods (CD-ROM, hard disk, NFS, FTP, and HTTP).


    After a short delay, a screen containing the *boot :* prompt should appear. The
    screen contains information on a variety of boot options. Each boot option also
    has one or more help screens associated with it. To access a help screen, press
    the appropriate function key as listed in the line at the bottom of the screen.


    You should keep two things in mind:


    +   *   The initial screen will automatically start the installation program if
    you take no action within the first minute. To disable this feature, press one
    of the help screen function keys.

    +   *   If you press a help screen function key, there will be a slight delay
    while the help screen is read from the installation media.


    Normally, you''ll only need to press `Enter` to boot. Watch the boot messages
    to see whether the *Linux* kernel detects your hardware. If it does not properly
    detect your hardware, you may need to restart the installation in "expert" mode.
    If your hardware is properly detected, please continue to the next section. For
    more information about "expert" mode, refer to section *Starting the Installation
    Program* in the chapter *Installing Red Hat Linux via the GUI* in the *Official
    Red Hat Linux Reference Guide* on the Documentation CD.


    # Booting without diskettes


    Another way to start the installation without using a boot disk depends on whether
    you have *MS-DOS* on your system. The following method is specific to Intel-based
    computers only.


    Assuming your CD-ROM is drive *a*:*, use the following commands:


    ```

    C:\>  *a*:

    D:\>  *cd \dosutiles*

    D:\dosutiles> *autoboot.bat*

    ```


    This method will not work if run in a DOS window -- the *autoboot.bat* file must
    be executed with DOS as the only operating system. In other words, you should
    reboot your system and choose to "restart in MS-DOS mode."


    If your computer can''t boot directly from CD-ROM (and you can''t use a DOS-based
    auto-boot), you''ll have to use a boot diskette to get things started.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 5.3 Selecting an Installation Method


    Next, you will be asked what type of installation method you wish to use. For
    our purposes, choose **CD-ROM**. However, you can install Red Hat Linux via any
    of the following basic methods:


    +   - **CD-ROM**

    +     - If you have a CD-ROM drive and the Red Hat Linux CD-ROM. Requires a boot
    disk, a bootable CD-ROM or a PCMCIA boot disk. Refer to Section *5.4, Beginning
    the Installation* for further instructions.


    +   - **Hard Drive**

    +     - If you copied the Red Hat Linux files to a local hard drive. Refer to
    the *Official Red Hat Linux Reference Guide* on the Documentation CD for hard
    drive installation instructions. Requires a boot disk or a PCMCIA boot disk.


    +   - **NFS Image**

    +     - If you are installing from an NFS Image server which is exporting the
    Red Hat Linux CD-ROM or a mirror image of Red Hat Linux. Requires a network or
    PCMCIA boot disk. Refer to the *Official Red Hat Linux Reference Guide* on the
    Documentation CD for network installation instructions. Please note: NFS installations
    may also be performed in GUI mode.


    +   - **FTP**

    +     - If you are installing directly from an FTP server. Requires a network
    or PCMCIA boot disk. Refer to the *Official Red Hat Linux Reference Guide* on
    the Documentation CD for FTP installation instructions.


    +   - **HTTP**

    +     - If you are installing directly from an HTTP Web server. Requires a network
    or PCMCIA boot disk. Refer to the *Official Red Hat Linux Reference Guide* on
    the Documentation CD for HTTP installation instructions.


    # 5.4 Beginning the Installation


    If you are planning to install via CD-ROM using the graphical interface, please
    read on.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Please Note


    If you''d rather perform a text mode custom-class installation, reboot your system
    and at the **boot** : prompt, type **text**. Refer to the *Official Red Hat Linux
    Reference Guide on the Documentation CD* for further instructions. Text mode workstaion-class
    installation instructions can be found at Chapter 6, *Text Mode Installations
    at a Glance*.


    # ## 5.4.1 Installing from CD-ROM


    To install Red Hat Linux from CD-ROM, choose **CD-ROM** and select **OK**. When
    prompted, insert the Red Hat Linux CD into your CD-ROM drive (if you did not boot
    from the CD-ROM). Select **OK**, and press [Enter].


    The installation program will then probe your system and attempt to identify your
    CD-ROM drive. It will start by looking for an IDE (also known as ATAPI) CD-ROM
    drive. If found, you will continue to the next stage of the installation process
    (see Section 5.5, *Language Selection* ).


    If a drive is not detected, you''ll be asked what type of CD-ROM drive you have.
    Choose from the following types:


    +   SCSI

    +   Select this if your CD-ROM drive is attached to a supported SCSI adapter;
    the installation program will then ask you to choose a SCSI driver. Choose the
    driver that most closely reassembles your adapter. You may specify options for
    the driver if necessary; however, most drivers will detect your SCSI adapter automatically.


    +   Other

    +   If your CD-ROM drive is neither an IDE nor a SCSI, it''s an "other." Sound
    cards with proprietary CD-ROM interfaces are good examples of this CD-ROM type.
    The installation program presents a list of drivers for supported CD-ROM drives
    -- choose a driver and, if necessary, specify any driver options.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/f097eb927132822630978994ad35bce4_35_0.png)


    A partial list of optional parameters for CD-ROM drives can be found in the Official
    Red Hat Linux Reference Guide, in the General Parameters and Modules appendix.


    # What If the IDE CD-ROM Was Not Found?


    If the installation program fails to find your IDE (ATAPI) CD-ROM (it asks you
    what type of CD-ROM drive you have), restart the installation, and at the boot:
    prompt enter 1linux hdx=c d r o m. Replace the x with one of the following letters,
    depending on the interface the unit is connected to, and whether it is configured
    as master or slave:


    +   • a - First IDE controller, master

    +   • b - First IDE controller, slave

    +   • c - Second IDE controller, master

    +   • d - Second IDE controller, slave


    (If you have a third and/or fourth controller, simply continue assigning letters
    in alphabetical order, going from controller to controller, and master to slave.)


    Once identified, you will be asked to insert the Red Hat Linux CD into your CD-ROM
    drive. Select OK when you have done so. After a short delay, the next dialog box
    will appear.


    ![](img/f097eb927132822630978994ad35bce4_35_1.png)


    To abort the installation process at this time, reboot your machine and eject
    the boot disk or CD-ROM. You can safely abort the installation at any point before
    the About to Install screen (see Section 5.17, Preparing to Install).


    # 5.5 Language Selection


    Using your mouse, select the language you would prefer to use for the installation
    and as the system default (see Figure 5-2, Language Selection).'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Selecting the appropriate language will also help target your time zone configuration
    later in the installation. The installation program will try to define the appropriate
    time zone based on your specification.


    # Figure 5–2 Language Selection


    ![](img/f097eb927132822630978994ad35bce4_36_0.png)


    # 5.6 Keyboard Configuration


    Choose the model that best fits your system (see Figure 5–3, *Keyboard Configuration*).
    If you cannot find an exact match, choose the best **Generic** match for your
    keyboard type (for example, **Generic 101-key PC**).


    Next, choose the correct layout type for your keyboard (for example, U.S. English).


    Creating special characters with multiple keystrokes (such as N, Ö, and Ç) is
    done using "dead keys" (also known as compose key sequences). Dead keys are enabled
    by default. If you do not wish to use them, select **Disable dead keys**.


    To test your keyboard configuration, use the blank text field at the bottom of
    the screen to enter text.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Tip


    To change your keyboard type post-installation, become root and use the /usr/sbin/kbdconfig
    command, or you can type setup at the root prompt (seen as [root@localhost root]#).


    To become root, type su at the shell prompt in a terminal window and then press
    [Enter]. Then, enter the root password and press [Enter].


    # Figure 5–3 Keyboard Configuration


    ![](img/f097eb927132822630978994ad35bce4_37_0.png)


    # 5.7 Mouse Configuration


    Choose the correct mouse type for your system. If an exact match cannot be found,
    choose a mouse type that you are sure is compatible with your system (see Figure
    5–4, Mouse Configuration).'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'To determine your mouse’s interface, follow the mouse cable back to where it
    plugs into your system. If the connector at the end of the mouse cable plugs into
    a rectangular connector, you have a serial mouse; if the connector is round, you
    have a PS/2 mouse. If you are installing Red Hat Linux on a laptop computer, in
    most cases the pointing device will be PS/2 compatible.


    If you cannot find a mouse that you are sure is compatible with your system, select
    one of the *Generic* entries, based on your mouse’s number of buttons, and its
    interface.


    # Figure 5—4 Mouse Configuration


    ![](img/f097eb927132822630978994ad35bce4_38_0.png)


    If you have a PS/2 or a Bus mouse, you do not need to pick a port and device.
    If you have a serial mouse, you should choose the correct port and device that
    your serial mouse is on.


    The *Emulate 3 Buttons* check box allows you to use a two-button mouse as if it
    had three buttons. If you select this check box, you can emulate a third, “middle”
    button by pressing both mouse buttons simultaneously. Generally, it’s easiest
    to use the X Window System if you have a three-button mouse.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Tip


    To change your mouse configuration post-installation, become root. You can then
    use the /usr/sbin/mouseconfig command from the shell prompt.


    To configure your mouse as a left-handed mouse, you can reset the order of the
    mouse buttons. This can be done after you have booted your Red Hat Linux system,
    by becoming root and typing gpm -B 321 at the shell prompt.


    # 5.8 Welcome to Red Hat Linux


    The Welcome screen (see Figure 5-5, *Welcome to Red Hat Linux*) does not prompt
    you for any installation input. Please read over the help text in the left panel
    for additional instructions and information.


    # Figure 5-5 Welcome to Red Hat Linux


    ![](img/f097eb927132822630978994ad35bce4_39_0.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'The **help screen** is open by default, but if you do not want to view the
    help information, click on the **Hide Help** button to minimize the screen.


    Click on the **Next** button to continue.


    # ## 5.9 Install Options


    > **Please Note**

    > Feature: Red Hat Linux 7.0 has a installation method known as a "partitionless"
    installation. If your system has a FAT (DOS/Windows) partition with sufficient
    free space, you can install Red Hat Linux without repartitioning your hard drive.
    This method is perfect for people who are new to Linux, and would like to try
    Red Hat Linux with a minimum of disruption to their computer. To learn more about
    this method, refer to Appendix B, *Installing Without Partitioning*.


    Red Hat Linux allows you to choose the installation type that best fits your needs.
    Your options include: **Workstation**, **Server**, **Custom**, or **Upgrade**.


    > **WARNING**

    > Installing Red Hat Linux over another installation of Linux (including Red Hat
    Linux) does *not* preserve any information (files or data) from a prior installation.
    Make sure you save any important files! If you are worried about saving the current
    data on your existing system (without making a backup on your own), you should
    consider performing an upgrade instead (see Appendix A, *Upgrading Your Current
    System*).'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Figure 5-6 Choosing Install or Upgrade


    ![](img/f097eb927132822630978994ad35bce4_41_0.png)


    Choosing your specific installation type also determines where you should go for
    documentation on that choice.


    +   * Graphical Workstation Installation -- Official Red Hat Linux Installation
    Guide, (this chapter, please continue reading)

    +   * Graphical Server Installation -- Official Red Hat Linux Reference Guide
    on the Documentation CD; Chapter: *Installing Red Hat Linux via the GUI*

    +   * Graphical Custom Installation -- Official Red Hat Linux Reference Guide
    on the Documentation CD; Chapter: *Installing Red Hat Linux via the GUI*

    +   * Text Mode Workstation Installation -- Official Red Hat Linux Installation
    Guide; Chapter *Installing in Text Mode*

    +   * Text Mode Server Installation -- Official Red Hat Linux Reference Guide
    on the Documentation CD; Chapter: *Installing Red Hat Linux via Text Mode*

    +   * Text Mode Custom Installation -- Official Red Hat Linux Reference Guide
    on the Documentation CD; Chapter: *Installing Red Hat Linux via Text Mode*'
  merge: -1
  img_proc: true
- pgno: 42
  md: "# 5.9.1 Choosing a Workstation Installation\n\n> **WARNING**\n> \n> A workstation-class\
    \ installation will erase *all information in all Linux-related partitions from\
    \ every one of your computer's hard drive(s).*\n\nYou usually install Red Hat\
    \ Linux on a clean disk partition or set of partitions, or over another installation\
    \ of Linux.\n\n> **WARNING**\n> \n> Do not choose a workstation-class installation\
    \ if you're sharing a disk with Windows NT; if you do, you will be unable to boot\
    \ Windows NT. LILO will write over NT's boot loader and you will be unable to\
    \ boot NT. You must perform a custom-class installation and configure LILO so\
    \ that it is not installed on the Master Boot Record (MBR).\n> \n> To create a\
    \ dual-boot environment on a system that currently has NT, you must install LILO\
    \ on the first sector of the root partition, not the MBR. Please be sure to create\
    \ a boot disk. In a case such as this, you will either need to use the boot disk,\
    \ or configure the NT system loader to boot LILO from the first sector of the\
    \ root partition. Be sure to check out http://www.linux-doc.org/HOWTO/mini/Linux+NT-Loader.html\
    \ for more information on setting up LILO and NT.\n\n# 5.10 Automatic Partitioning\n\
    \nAutomatic partitioning allows you to perform an installation without having\
    \ to partition your drive(s) yourself. If you feel uncomfortable about manually\
    \ partitioning your system, choosing automatic partitioning is the best solution\
    \ for you."
  merge: -1
  img_proc: true
- pgno: 43
  md: 'The **Automatic Partitioning** screen is only seen when performing a workstation-
    or server-class installation.


    If you choose to manually partition, refer to the *Official Red Hat Linux Reference
    Guide* on the Documentation CD; see the Chapter *Installing Red Hat Linux via
    the GUI*.


    # ## Please Note


    If the **Automatic Partitioning** screen does not appear, then you do not have
    enough free space available for this installation option. You can either exit
    out of the installation program and then make space available, or you can partition
    manually.


    # ### Figure 5-7 Automatic Partitioning


    ![](img/f097eb927132822630978994ad35bce4_43_0.png)


    In this screen, you can choose to continue with this installation, to partition
    **manually** using **Disk Druid**, to partition manually using **fdisk**, or use
    the **Back** button to choose a different installation method (see *Figure 5-7,
    Automatic Partitioning*).'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Please Note


    Manual partitioning using Disk Druid or fdisk is outside the scope of this manual.
    Although Disk Druid will be briefly discussed, detailed information on both Disk
    Druid and fdisk is available in the *Official Red Hat Linux Reference Guide* on
    the Documentation CD.


    Automatic partitioning in a workstation-class installation will create / (“root”),
    <swap>, and /boot partitions for you in the free space available on your hard
    drive.

    If you do *not* want to lose some or all of your data, you should either choose
    to partition manually or choose a different installation class.


    # CAUTION


    *A workstation-class installation will remove all data on all currently existing
    Linux partitions.*


    If you do not want Red Hat Linux to be installed on your master boot record (MBR)
    or if you want to use a boot manager other than LILO, do not choose this installation
    method.


    If you are unsure how you want your system to be partitioned, please read the
    chapter on partitioning in the *Official Red Hat Linux Reference Guide*, on the
    Documentation CD.


    # 5.11  Manually Partitioning Your System


    If you chose *Automatic Partitioning*, please skip to Section 5.12, *Network Configuration*.

    For information concerning fdisk, refer to the *Official Red Hat Linux Reference
    Guide* on the Documentation CD.

    Now it’s necessary to let the installation program know where it should install
    Red Hat Linux. This is done by defining *mount points*¹ for one or more disk partitions
