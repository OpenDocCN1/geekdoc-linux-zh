- pgno: 131
  md: '+   - Getting any supported hardware recognized by the Red Hat Linux operating
    system

    +   - Assistance with drive partitioning

    +   - Configuring Red Hat Linux and up to one other operating system (on Intel
    platforms only) to dual-boot using the Linux boot loader LILO. Please note that
    third party boot loaders and partitioning software are not supported.


    We can also help you with basic post-installation tasks, such as:


    +   - Successfully configuring the X Window System using XF86Setup or Xconfigurator

    +   - Configuring a local parallel port printer to print text

    +   - Configuring a mouse


    Our installation assistance service is designed to get you up and running with
    Red Hat Linux as quickly and as easily as possible. However, there are many other
    things that you may want to do with your Red Hat Linux system (from compiling
    a custom kernel to setting up a Web server) which are not covered.


    For assistance with these tasks, there is a wealth of on-line information available
    in the form of HOWTO documents, Linux-related websites, and commercial publications.
    The Red Hat Linux operating system includes the various Linux HOWTO documents
    on the installation CD in the `/doc/HOWTO` directory as plain text files that
    can easily be read from within Red Hat Linux and other operating systems.


    A large number of Linux-related websites are available. The best starting point
    for finding information on Red Hat Linux is the Red Hat, Inc. website at:


    `http://www.redhat.com/`


    Many Linux-related books are available. If you''re new to Linux, a book that covers
    Linux basics will be invaluable. We can recommend several titles: Using Linux,
    by Bill Ball; Linux Clearly Explained, by Bryan Pfaffenberger; Linux for Dummies,
    by Jon "maddog" Hall; and A Practical Guide to Linux, by Mark G. Sobell.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# **D.3 Scope of Red Hat Support**


    Red Hat, Inc. can only provide installation assistance to customers who have purchased
    an Official Red Hat Linux boxed set. If you have obtained Linux from any other
    company, you must contact that company for support. Examples of such companies
    are as follows:


    +   - Macmillan

    +   - Sams/Que

    +   - Linux Systems Labs (LSL)

    +   - Mandrake

    +   - CheapBytes


    Additionally, Red Hat Linux obtained via any of the following methods does not
    qualify for support from Red Hat:


    +   - Red Hat Linux PowerTools Archive

    +   - Downloaded via FTP on the Internet

    +   - Included in a package such as Motif or Applixware

    +   - Copied or installed from another user''s CD


    # **D.4 The Red Hat Support System**


    As of October 1999, Red Hat, Inc. has implemented a new technical support system.
    If you signed up for technical support in the past with Red Hat, it may be necessary
    for you to sign up again. The new system will implement a unified login and password
    that will work across the entire Red Hat website. The support system will also
    automatically route and track service requests.


    If you haven''t signed up yet, then you should. Instructions for how to sign up
    are provided next, in Section D.5. *How to Get Technical Support*.


    # **D.5 How to Get Technical Support**


    In order to receive technical support for your Official Red Hat product, you first
    have to sign up.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Every Official Red Hat product comes with a Personal Product Identification
