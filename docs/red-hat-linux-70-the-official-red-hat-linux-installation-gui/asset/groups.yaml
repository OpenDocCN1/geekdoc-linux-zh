    \ **HTTP**\n  - 如果您正在直接从 HTTP Web 服务器安装。需要网络或 PCMCIA 启动盘。有关 HTTP 安装说明，请参阅文档 CD\
    \ 上的《*官方 Red Hat Linux 参考指南*》。\n\n### 5.4 开始安装\n\n如果您计划通过图形界面使用 CD-ROM 进行安装，请继续阅读。\n\
    \n**请注意**\n\n如果您更喜欢执行文本模式自定义类安装，请重新启动系统，并在 **boot** : 提示符处键入 **text**。有关进一步说明，请参阅文档\
    \ CD 上的《*官方 Red Hat Linux 参考指南*》。文本模式工作站类安装说明可在第 6 章*文本模式安装概览*中找到。\n\n#### 5.4.1\
    \ 从 CD-ROM 安装\n\n要从 CD-ROM 安装 Red Hat Linux，请选择 **CD-ROM** 并选择 **确定**。当提示时，将 Red\
    \ Hat Linux CD 插入您的 CD-ROM 驱动器（如果您没有从 CD-ROM 启动）。选择 **确定**，然后按 [Enter]。\n\n安装程序随后将探测您的系统并尝试识别您的\
