    \ and associated mirror sites.\n\n- **Some commercial bootloaders**\n\n  For example,\
    \ System Commander and Partition Magic, which are able to boot Linux (but still\
    \ require LILO to be installed in your Linux root partition).\n\n### A.5.3 SMP\
    \ Motherboards and LILO\n\nThis section is specific to SMP motherboards only.\
    \ If the installer detects a SMP motherboard on your system, it will automatically\
    \ create two `lilo.conf` entries, rather than the usual single entry.\n\nOne entry\
    \ will be called `linux` and the other will be called `linux-up`. The `linux`\
    \ will boot by default. However, if you have trouble with the SMP kernel, you\
    \ can elect to boot the `linux-up` entry instead. You will retain all the functionality\
    \ as before, but you will only be operating with a single processor.\n\n## A.6\
    \ Upgrading Packages\n\nAt this point there's nothing left for you to do until\
    \ all the packages have been upgraded or installed (see Figure A–6, *Installing\
    \ Packages*).\n\n### Figure A–6 Installing Packages\n\n![](img/f097eb927132822630978994ad35bce4_117_0.png)\n\
    \n## A.7 Upgrade Complete\n\nCongratulations! Your Red Hat Linux 7.0 upgrade is\
    \ now complete!\n\nYou will now be prompted to prepare your system for reboot.\
    \ Don't forget to remove any diskette in the floppy drive or CD in the CD-ROM\
    \ drive. If you do not have LILO installed, you'll need to use your boot disk\
    \ now.\n\n#### Tip\n\nIf you need a quick review of some of the basic concepts\
    \ of Red Hat Linux refer to the *Official Red Hat Linux Getting Started Guide*.\n\
    \nFor information dealing with system configuration and administration, refer\
    \ to the *Official Red Hat Linux Reference Guide* on the documentation CD-ROM.\n\
    \n### Figure A-7 Upgrade Complete\n\n![](img/f097eb927132822630978994ad35bce4_118_0.png)\n"
