    Section 3.5:Step 5 - Can You Install Using the Red Hat Linux CD-ROM?


    # Making a Diskette Under MS-DOS


    To make a diskette under MS-DOS, use the `rawrite` utility included on the Red
    Hat Linux CD in the `dosutils` directory. First, label a blank, formatted 3.5-inch
    diskette appropriately (such as "Boot Disk" or "Updates Disk"). Insert it into
    the diskette drive. Then, use the following commands (assuming your CD is drive
    d:):


    ```

    ```

    C:\> d:

    D:\> cd \dosutils

    D:\dosutils> rawrite

    Enter disk image source file name: ..\images\boot.img

    Enter target diskette drive: a:

    Please insert a formatted diskette into drive A: and

    press --ENTER-- : [Enter]

    D:\dosutils>```


    ```


    First, `rawrite` asks you for the `filename` of a diskette image; enter the directory
    and name of the image you wish to write (for example, `..\images\boot.img`). Then
    `rawrite` asks for a diskette drive to write the image to; enter `a:`. Finally,
    `rawrite` asks for confirmation that a formatted diskette is in the drive you''ve
    selected. After pressing [Enter] to confirm, `rawrite` copies the image file onto
    the diskette. If you need to make another diskette, label that diskette, and run
    `rawrite` again, specifying the appropriate image file.


    # Making a Diskette Under a Linux-Like OS


    To make a diskette under Linux (or any other Linux-like operating system), you
    must have permission to write to the device representing a 3.5-inch diskette drive
    (known as `/dev/fd0` under Linux).


    First, label a blank, formatted diskette appropriately (such as "Boot Disk" or
    "Updates Disk"). Insert it into the diskette drive (but don''t issue a `mount`
    command). After mounting the Red Hat Linux CD, change directory to the directory
    containing the desired image file, and use the following command (changing the
    name of the image file and diskette device as appropriate):


    ```

    ```

    # dd if=boot.img of=/dev/fd0 bs=1440k

    ```

    ```


    To make another diskette, label that diskette, and run `dd` again, specifying
    the appropriate image file.'
