    在屏幕上的每个小部件之间向前或向后循环切换。在大多数屏幕的底部，会显示可用光标定位键的摘要。


    要“按下”按钮，将光标定位在按钮上（例如使用 [Tab]）并按下 [Space] 或 [Enter]。要从列表中选择一项，将光标移动到你希望选择的项并按下
