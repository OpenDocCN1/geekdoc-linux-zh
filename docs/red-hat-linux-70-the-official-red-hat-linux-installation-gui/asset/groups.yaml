    \ is written to a swap partition when there is not enough RAM to store the data\
    \ your system is processing. If your computer has 16MB of RAM or less, you *must\
    \ create* a swap partition. Even if you have more memory, a swap partition is\
    \ still recommended. The minimum size of your swap partition should be equal to\
    \ the amount of RAM in your system or 16MB (whichever is larger). In Disk Druid,\
    \ the partition field for *swap* should look similar to: ` <Swap>  hda2  125M\
    \  125M  Linux  swap`\n- A */boot* partition (16MB, maximum) -- The partition\
    \ mounted on */boot* contains the operating system kernel (which allows your system\
    \ to boot Red Hat Linux), along with files used during the bootstrap process.\
    \ Due to the limitations of most PC BIOSes, creating a small partition to hold\
    \ these files is a good idea. This partition should be no larger than 16MB. In\
    \ Disk Druid, the partition field for */boot* should look similar to: ` /boot\
    \  hda1  16M  19M  Linux  native`\n- A root partition (900MB-1.7GB) -- This is\
    \ where \"/\" (the root directory) resides. In this setup, all files (except those\
    \ stored in */boot*) reside on the root partition. A 900MB root partition will\
    \ permit the equivalent of a workstation-class installation (with very little\
    \ free space), while a 1.7GB root partition will let you install every package\
    \ in Red Hat Linux. In Disk Druid, the partition field for */* should look similar\
    \ to: ` /  hda2  900M  3669M  Linux  native`\n\n#### 5.11.1 Problems When Adding\
    \ a Partition\n\nIf you attempt to add a partition and Disk Druid can't carry\
    \ out your request, you'll see a dialog box listing partitions that are currently\
    \ **unallocated**, along with the reason they could not be allocated. Unallocated\
    \ partitions(s) are also displayed on Disk Druid's main screen (though you may\
    \ have to scroll through the \"Partitions\" section to see them).\n\nTo fix an\
    \ unallocated requested partition, you must move the partition to another drive\
    \ which has the available space, resize the partition to fit on the current drive,\
    \ or delete the partition entirely. Make changes by selecting a partition and\
    \ using the **Edit** button or by double-clicking on the partition.\n\n#### 5.11.2\
    \ Choose Partitions to Format\n\nChoose partitions that you would like to format.\
    \ All newly created partitions should be formatted. Any existing partitions that\
    \ contain data you no longer need should also be formatted (see Figure 5–9, *Choosing\
    \ Partitions to Format*).\n\n## Figure 5–9 Choosing Partitions to Format\n\n![](img/f097eb927132822630978994ad35bce4_47_0.png)\n\
    \nChecking for bad blocks can help prevent data loss by locating the bad blocks\
    \ on a drive and making a list of them to prevent their future use. If you wish\
    \ to check for bad blocks while formatting each filesystem, please make sure to\
    \ select the **check for bad blocks** option.\n\n## Please Note\n\n> Selecting\
    \ **check for bad blocks** may dramatically increase your total installation time.\
    \ Since most newer hard drives are quite large in size, checking for bad blocks\
    \ may take a while depending on the size of your hard drive.\n\n### 5.12 Network\
    \ Configuration\n\nIf you do not have a network card then you will not see this\
    \ screen. Please skip ahead to the next section, Section 5.13, Time Zone Configuration.\n\
    \nIf you have a network card, you now have the opportunity to configure networking\
    \ (as shown in Figure 5–10, Network Configuration).\n\nChoose your device type\
    \ and whether you would like to configure using DHCP (Dynamic Host Configuration\
    \ Protocol). If you have multiple Ethernet devices, each device will keep the\
    \ information you have provided. You may switch between devices, for example eth0\
    \ and eth1, and the information you give will be specific to each device. If you\
    \ select **Activate on boot**, your network interface will be started when you\
    \ boot. If you do not have DHCP client access or are unsure of the proper configuration,\
    \ please contact your network administrator.\n\nNext enter, where applicable,\
    \ the **IP Address**, **Netmask**, **Network**, and **Broadcast** addresses. If\
    \ you are unsure about any of these, please contact your network administrator.\n\
    \n## Figure 5–10  Network Configuration\n\n![](img/f097eb927132822630978994ad35bce4_48_0.png)\n\
    \nIf you have a network card, enter a fully qualified domain name in this format:\
    \ *host-name.domain.name*\n\n> **Tip**\n> \n> Even if your computer is not part\
    \ of a network, you can enter a hostname for your system. Take this opportunity\
    \ to enter in a *name*; if you do not, your system will be known as `localhost`.\n\
    \nFinally, enter the **Gateway** and **Primary DNS** (and if applicable the **Secondary\
    \ DNS** and **Ternary DNS**) addresses.\n\n### 5.13 Time Zone Configuration\n\n\
    You can set your time zone either by selecting your computer's physical location,\
    \ or by your time zone's offset from Universal Coordinated Time (also known as\
    \ UTC).\n\n## Figure 5-11 Configuring Time Zone\n\n![](img/f097eb927132822630978994ad35bce4_49_0.png)\n\
    \nNotice the two tabs at the top of the screen (see Figure 5-11, Configuring Time\
    \ Zone). The first tab offers you the ability to configure by location. With this\
    \ option, you can choose your view. In choosing view, your options are: **World**,\
    \ **North America**, **South America**, **Pacific Rim**, **Europe**, **Africa**,\
    \ and **Asia**.\n\nFrom the interactive map, you can also click on a specific\
    \ city, as indicated by the yellow dots; a red **X** will appear indicating your\
    \ selection. You can also scroll through a list and choose your desired time zone.\n\
    \nThe second tab offers you the ability to use the UTC offset. UTC presents you\
    \ with a list of offsets to choose from, as well as an option to set daylight\
    \ saving time.\n\nFor both tabs, there is the option of selecting **System Clock\
    \ uses UTC**. Please select this if you know that your system is set to UTC.\n\
    \n## Tip\n\nIf you wish to change your time zone configuration after you have\
    \ booted your Red Hat Linux system, become root and use the */usr/sbin/timeconfig*\
    \ command.\n\n### 5.14 Account Configuration\n\nThe **Account Configuration**\
    \ screen allows you to set your root password. Additionally, you can set up user\
    \ accounts for you to log into once the installation is complete (see Figure 5-12,\
    \ *Account Creation*).\n\n#### 5.14.1 Setting the Root Password\n\nThe installation\
    \ program will prompt you to set a **root password** for your system. Entering\
    \ a root password is required. The installation program will not let you proceed\
    \ to the next section without entering a root password.\n\nThe root password must\
    \ be at least six characters long; the password you type is not echoed to the\
    \ screen. You must enter the password twice; if the two passwords do not match,\
    \ the installation program will ask you to enter them again.\n\nA root password\
    \ is the administrative password for your Red Hat Linux system. You should only\
    \ log in as root when needed for system maintenance. Changes that are made when\
    \ logged in as root will affect the system and all users created on the system.\n\
    \nYou should make the root password something you can remember, but not something\
    \ that is easy for someone else to guess. Your name, your phone number, **qwerty,\
    \ password, root, 123456**, and **ant eater** are all examples of poor passwords.\
    \ Good passwords mix numerals with upper and lower case letters and do not contain\
    \ dictionary words: **Aard387vark** or **429BkIIKT**, for example. Remember that\
    \ the password is case-sensitive. Write down this password and keep it in a secure\
    \ place.\n\n## Please Note\n\nDo not use one of the example passwords offered\
    \ in this manual. Using one of these passwords could be considered a security\
    \ risk.\n\n## Figure 5-12 Account Creation\n\n![](img/f097eb927132822630978994ad35bce4_51_0.png)\n"
  mdcn: "\n将安装 Linux。此时您可能还需要创建和/或删除分区（参见图 5–8，使用 Disk Druid 进行分区）。\n\n## 请注意\n\n\
    如果您尚未规划好如何设置分区，请参阅《*红帽 Linux 官方参考指南*》中的分区附录。至少需要 900M 的根分区和 16 MB 的交换分区。\n\n##\
    \ 图 5–8 使用 Disk Druid 进行分区\n\n![](img/f097eb927132822630978994ad35bce4_45_0.png)\n\
    \nRed Hat Linux 7.0 中使用的分区工具是 Disk Druid。除了某些特殊的情况外，Disk Druid 可以处理典型 Red Hat\
    \ Linux 安装的分区需求。\n\n除非您有特定的理由，否则我们建议您创建以下分区：\n\n### 第 5.11 节：手动对系统进行分区\n\n- 交换分区（至少\
    \ 16MB）—— 交换分区用于支持虚拟内存。换句话说，当 RAM 不足以存储系统正在处理的数据时，数据会被写入交换分区。如果您的计算机拥有 16MB 或更少的\
    \ RAM，您*必须创建*交换分区。即使您拥有更多的内存，仍建议使用交换分区。您的交换分区的最小尺寸应等于系统中的 RAM 量或 16MB（取两者中较大的值）。在\
    \ Disk Druid 中，*swap* 的分区字段应类似于：` <Swap>  hda2  125M  125M  Linux  swap`\n- */boot*\
    \ 分区（最大 16MB）—— 挂载在 */boot* 上的分区包含操作系统内核（允许系统启动 Red Hat Linux），以及引导过程中使用的文件。由于大多数\
    \ PC BIOS 的限制，创建一个小分区来容纳这些文件是个好主意。该分区不应超过 16MB。在 Disk Druid 中，*/boot* 的分区字段应类似于：`\
    \ /boot  hda1  16M  19M  Linux  native`\n- 根分区（900MB-1.7GB）—— 这是 \"/\"（根目录）所在的位置。在此配置中，除了存储在\
    \ */boot* 中的文件外，所有文件都位于根分区上。900MB 的根分区将允许进行工作站级别的安装（剩余空间极少），而 1.7GB 的根分区则允许您安装\
    \ Red Hat Linux 中的每个软件包。在 Disk Druid 中，*/ 的分区字段应类似于：` /  hda2  900M  3669M  Linux\
    \  native`\n\n#### 5.11.1 添加分区时的问题\n\n如果您尝试添加分区，但 Disk Druid 无法执行您的请求，您将看到一个对话框，列出了当前**未分配**的分区以及无法分配的原因。未分配的分区也会显示在\
    \ Disk Druid 的主屏幕上（您可能需要滚动浏览“分区”部分才能看到它们）。\n\n要修复请求中未分配的分区，您必须将该分区移动到另一个有空闲空间的驱动器，调整分区大小以适应当前驱动器，或完全删除该分区。通过选择某个分区并使用**编辑**按钮或双击该分区来进行更改。\n\
    \n#### 5.11.2 选择要格式化的分区\n\n选择您想要格式化的分区。所有新创建的分区都应进行格式化。包含您不再需要的数据的现有分区也应进行格式化（参见图\
    \ 5–9，*选择要格式化的分区*）。\n\n## 图 5–9 选择要格式化的分区\n\n![](img/f097eb927132822630978994ad35bce4_47_0.png)\n\
    \n检查坏块可以通过定位驱动器上的坏块并列出它们以防止将来使用，从而帮助防止数据丢失。如果您希望在格式化每个文件系统时检查坏块，请务必选中**检查坏块**选项。\n\
    \n## 请注意\n\n> 选中**检查坏块**可能会显著增加您的总安装时间。由于大多数较新的硬盘体积相当大，根据硬盘的大小，检查坏块可能需要一些时间。\n\
    \n### 5.12 网络配置\n\n如果没有网卡，您将看不到此屏幕。请跳至下一节，第 5.13 节，时区配置。\n\n如果您有网卡，现在您可以配置网络（如图\
    \ 5–10，网络配置所示）。\n\n选择您的设备类型以及是否希望使用 DHCP（动态主机配置协议）进行配置。如果您有多个以太网设备，每个设备将保留您提供的信息。您可以在设备之间切换，例如\
    \ eth0 和 eth1，您提供的信息将特定于每个设备。如果您选中**开机时激活**，您的网络接口将在启动时启动。如果您没有 DHCP 客户端访问权限或不确定正确的配置，请联系您的网络管理员。\n\
    \n接下来，在适用的情况下，输入**IP 地址**、**子网掩码**、**网络**和**广播**地址。如果您对其中任何一项不确定，请联系您的网络管理员。\n\
    \n## 图 5–10 网络配置\n\n![](img/f097eb927132822630978994ad35bce4_48_0.png)\n\n如果您有网卡，请按照以下格式输入完全限定域名：*host-name.domain.name*\n\
    \n> **提示**\n> \n> 即使您的计算机不是网络的一部分，您也可以为系统输入一个主机名。利用这个机会输入一个*名称*；如果您没有输入，您的系统将被称为\
    \ `localhost`。\n\n最后，输入**网关**和**主 DNS**（以及如果适用的**辅助 DNS**和**第三 DNS**）地址。\n\n###\
    \ 5.13 时区配置\n\n您可以通过选择计算机的物理位置，或根据时区相对于协调世界时（也称为 UTC）的偏移来设置时区。\n\n## 图 5-11 配置时区\n\
    \n![](img/f097eb927132822630978994ad35bce4_49_0.png)\n\n注意屏幕顶部的两个选项卡（见图 5-11，配置时区）。第一个选项卡允许您按位置进行配置。使用此选项，您可以选择您的视图。在选择视图时，您的选项有：**世界**、**北美**、**南美**、**太平洋沿岸**、**欧洲**、**非洲**和**亚洲**。\n\
    \n从交互式地图中，您还可以单击特定城市，如黄色点所示；红色的**X**将出现以表示您的选择。您也可以滚动浏览列表并选择您想要的时区。\n\n第二个选项卡允许您使用\
    \ UTC 偏移。UTC 为您提供偏移列表供选择，以及设置夏令时的选项。\n\n对于两个选项卡，都有选择**系统时钟使用 UTC**的选项。如果您知道您的系统已设置为\
    \ UTC，请选择此项。\n\n## 提示\n\n如果您希望在启动 Red Hat Linux 系统后更改时区配置，请成为 root 并使用 */usr/sbin/timeconfig*\
    \ 命令。\n\n### 5.14 账户配置\n\n**账户配置**屏幕允许您设置 root 密码。此外，安装完成后，您可以设置用户账户以便登录（见图 5-12，*创建账户*）。\n\
    \n#### 5.14.1 设置 root 密码\n\n安装程序将提示您为系统设置**root 密码**。输入 root 密码是必需的。如果不输入 root\
    \ 密码，安装程序将不允许您继续到下一节。\n\nroot 密码必须至少六个字符长；您输入的密码不会在屏幕上回显。您必须两次输入密码；如果两个密码不匹配，安装程序将要求您重新输入。\n\
    \nroot 密码是您的 Red Hat Linux 系统的管理密码。您应该只在需要系统维护时以 root 身份登录。以 root 身份登录时所做的更改将影响系统以及在系统上创建的所有用户。\n\
    \n您应该将 root 密码设置为您能记住但别人不易猜到的内容。您的姓名、电话号码、**qwerty, password, root, 123456**以及**ant\
    \ eater**都是糟糕的密码示例。好的密码混合了数字和大写字母与小写字母，并且不包含词典中的单词：例如 **Aard387vark** 或 **429BkIIKT**。请记住密码区分大小写。写下此密码并将其保存在安全的地方。\n\
    \n## 请注意\n\n不要使用本手册中提供的示例密码。使用这些密码中的任何一个可能被视为安全风险。\n\n## 图 5-12 创建账户\n\n![](img/f097eb927132822630978994ad35bce4_51_0.png)\n"
