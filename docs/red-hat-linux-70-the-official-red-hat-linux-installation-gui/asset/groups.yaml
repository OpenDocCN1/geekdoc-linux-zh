    \ For systems with Win95/98, you also should install LILO to the MBR so that LILO\
    \ can boot both operating systems.\n\nIf you have Windows NT (and you want to\
    \ install LILO) you should choose to install LILO on the first sector of the root\
    \ partition, not the MBR. Please be sure to create a boot disk. In a case such\
    \ as this, you will either need to use the boot disk, or configure the NT system\
    \ loader to boot LILO from the first sector of the root partition. Be sure to\
    \ check out <http://www.linuxdoc.org/HOWTO/mini/Linux+NT-Loader.html> for more\
    \ information on setting up LILO and NT.\n\n#### CAUTION\n\nIf you choose not\
    \ to install LILO for any reason, you will not be able to boot your Red Hat Linux\
    \ system directly, and will need to use another boot method (such as a boot diskette).\
    \ Use this option only if you are sure you have another way of booting your Red\
    \ Hat Linux system!\n\nThe `Use linear mode` button is selected by default. In\
    \ most cases, linear mode should be enabled; if your computer cannot use linear\
    \ mode to access your hard drives, deselect this option.\n\nIf you wish to add\
    \ default options to the LILO boot command, enter them into the `kernel parameters`\
    \ field. Any options you enter will be passed to the Linux kernel every time it\
    \ boots.\n\n**Bootable Partition** -- Every bootable partition is listed, including\
    \ partitions used by other operating systems. The \"Boot label\" column will be\
    \ filled in with the word `linux` on the partition holding your Red Hat Linux\
    \ system's root filesystem. Other partitions may also have boot labels. If you\
