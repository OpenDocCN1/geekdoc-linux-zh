    本章介绍如何在不创建 Linux 分区的情况下安装 Red Hat Linux 7.0。


    ### 请注意


    虽然这是在无需在系统上创建 Linux 分区的情况下探索 Red Hat Linux 世界的一种绝佳方式，但请注意，您仍需要按照本手册中的说明执行完整的 Red
    Hat Linux 安装。


    ### 请注意


    要执行此类型的安装，您必须当前拥有一个格式化的 DOS (FAT) 文件系统。使用 Win95/98 的用户在使用此类型安装时不应有任何问题。拥有 NTFS
    分区（例如使用 Windows NT 的用户）的用户在此安装之前必须创建并格式化一个 DOS (FAT) 文件系统。除非在开始 Red Hat Linux
    安装之前已格式化 DOS (FAT) 文件系统，否则此安装将无法工作。


    ## B.1 无分区安装的优缺点


    您可能有一些理由想要执行无分区安装，但也存在一些缺点（取决于您的看法）。我们将在下文讨论这些潜在缺点。


    在这里，我们将介绍此类安装期间及安装结果将发生的基本事件，以及您的系统将受到的影响。


    ### 基本安装


    您将执行基本的 Red Hat Linux 安装。但是，您不会向系统添加 Linux 分区，而是会编辑一个现有的、已格式化的 DOS (FAT) 分区（该分区必须有足够的可用空间）并将其命名为根
    (/)。


    与典型的 Red Hat Linux 安装不同，您无需格式化任何分区，因为您不会向系统添加任何分区。


    ### LILO (Linux 加载程序) 和启动盘


    在无分区安装中，您将不会配置 LILO（Linux 加载程序）。在典型安装中，您可以选择将 LILO 安装在哪里——要么在主引导记录 (MBR) 上，要么在根分区的第一扇区上——或者您可以选择完全不安装
    LILO。


    为了访问无分区安装的 Red Hat Linux，您必须创建一个启动盘，并且在安装结束时，系统会提示您创建启动盘。


    ### 请注意


    为了使用启动盘从无分区安装中启动 Red Hat Linux，您必须正确配置 BIOS。BIOS 必须设置为从软盘驱动器 (A) 启动，才能使用启动盘。


    要更改 BIOS 设置，您需要记下计算机首次启动时给出的说明。通常您会看到一行文字，告诉您按 [Del] 或 [F1] 键进入 BIOS 设置。


    接下来，您必须找到允许更改启动顺序的部分。默认设置通常是 C, A 或 A, C（取决于您是使用硬盘驱动器 [C] 还是软盘驱动器 [A] 启动）。请更改此顺序，使软盘驱动器
    (A) 排在启动顺序的第一位，而硬盘驱动器 (C) 排在第二位。这指示计算机首先查找软盘驱动器中的可启动介质，如果找不到，则接着查找硬盘驱动器。


    务必在退出 BIOS 之前保存您的更改。更多信息请参阅随系统提供的文档。


    ### 性能影响


    Red Hat Linux 的性能将比拥有专用分区时更慢。但是，对于那些不关心速度的人来说，无分区安装是查看 Red Hat Linux 能提供什么的一种绝佳方式，而无需处理系统分区。


    ## B.2 执行无分区安装


    如果您拥有 DOS (FAT) 文件系统，您必须首先确保拥有一个具有足够可用空间专门用于此安装的 DOS (FAT) 分区。


    ### B.2.1 我需要多少空间？


    与典型安装一样，您需要有足够的可用空间才能在系统上安装 Red Hat Linux。为了给您一个概念，以下是安装方法及其*最低*空间要求的列表。


    有关这些安装类的更多信息，请参见第 3.6 节，*步骤 6 - 工作站类安装是否最适合您？*


    - 工作站 - 900MB

    - 服务器 - 1.7GB

    - 自定义（选择*所有*） - 1.7GB


    ### B.2.2 使用 Disk Druid


    由于您不会添加分区或创建新分区，实际上您需要使用 **Disk Druid**（一种 GUI 分区工具）操作的内容相对较少。


    当 **Disk Druid** 主屏幕出现时，您应该会看到您的 DOS (FAT) 分区列表（参见图 B-1，*选择要定义为 / 的 DOS (FAT)
    分区*）。选择一个具有足够可用空间来安装您选择的安装类的 DOS (FAT) 分区。通过用鼠标单击分区或使用 [Tab]、[Up] 和 [Down] 键来突出显示该分区。


    #### 图 B-1 选择要定义为 / 的 DOS (FAT) 分区


    ![](img/f097eb927132822630978994ad35bce4_124_0.png)


    突出显示所需分区后，选择**编辑**。将出现一个新窗口，允许您为该分区命名（参见图 B-2，*编辑 DOS (FAT) 分区*）。在**挂载点**字段中，将该分区标记为
    /（即根），并单击**输入**。


    接下来将出现一个确认窗口（参见图 B-3，*确认*），询问您是否确认要继续此安装。它还解释了您不能在任何 DOS 分区（标记为 /）之外的系统上拥有任何 Linux
    分区。单击**是**以继续。


    #### 图 B-2 编辑 DOS (FAT) 分区


    ![](img/f097eb927132822630978994ad35bce4_125_0.png)


    接下来，您将能够确定此 `/` 分区的根文件系统大小和交换空间大小。


    安装程序将确定根文件系统的最大大小（图 B-4，*文件系统配置*）。只要不超过建议的最大大小，您可以将根文件系统设置为您喜欢的任何大小。


    您为根文件系统创建的大小即为整个文件系统可用的磁盘空间（这意味着您不仅需要考虑安装类的大小，还需要考虑用于写入和保存数据的空间）。


    交换空间就像虚拟内存。换句话说，当没有足够的 RAM 来存储系统正在处理的数据时，数据会被写入交换分区。安装程序将交换空间默认设置为 32MB。如果您愿意，可以选择增加交换大小，但没有必要创建大于
    256MB 的交换空间。


    #### 图 B-3 确认


    ![](img/f097eb927132822630978994ad35bce4_126_0.png)


    从这里开始，您可以继续按照主安装章节（参见第 5.12 节，*网络配置*）进行进一步安装说明。您从这一点开始看到的唯一不同是一个提示您创建启动盘的屏幕。一旦您制作了启动盘并遵循其他说明，您的安装就完成了。


    为了访问 Red Hat Linux，请确保您在安装期间创建的启动盘在您的软盘驱动器中。当您重新启动系统时，它将进入 Red Hat Linux 而不是您的其他操作系统。为了访问您的其他操作系统，请取出启动盘并重新启动系统。


    #### 图 B–4 文件系统配置


    ![](img/f097eb927132822630978994ad35bce4_127_0.png)


    ### B.2.3 如何从系统中删除无分区安装


    要删除此无分区安装，您需要从 DOS/Windows 分区中删除以下文件：


    ```

    redhat.img

    rh-swap.img

    ```


    这些文件可以在分区根目录中找到（在 DOS/Windows 中已知为 \）。一旦删除了这些文件，Red Hat Linux 将不再在您的系统上启动。您的系统将恢复到以前的状态，您将能够像往常一样访问
    Red Hat Linux 使用的空间。


    ## C 卸载 Red Hat Linux


    要从系统中卸载 Red Hat Linux，您需要从主引导记录 (MBR) 中删除 LILO 信息。


    有几种方法可以从机器的主引导记录中删除 LILO。在 Linux 内部，您可以使用 /sbin/lilo 命令用先前保存的 MBR 版本替换 MBR：


    ```

