    ### 图 5-6 选择安装或升级


    ![](img/f097eb927132822630978994ad35bce4_41_0.png)


    选择特定的安装类型也决定了您应该去哪里查找关于该选择的文档。


    - * 图形工作站安装 -- 官方 Red Hat Linux 安装指南（本章，请继续阅读）

    - * 图形服务器安装 -- 文档 CD 上的官方 Red Hat Linux 参考指南；章节：*通过 GUI 安装 Red Hat Linux*

    - * 图形自定义安装 -- 文档 CD 上的官方 Red Hat Linux 参考指南；章节：*通过 GUI 安装 Red Hat Linux*

    - * 文本模式工作站安装 -- 官方 Red Hat Linux 安装指南；章节 *以文本模式安装*

    - * 文本模式服务器安装 -- 文档 CD 上的官方 Red Hat Linux 参考指南；章节：*通过文本模式安装 Red Hat Linux*

    - * 文本模式自定义安装 -- 文档 CD 上的官方 Red Hat Linux 参考指南；章节：*通过文本模式安装 Red Hat Linux*


    ### 5.9.1 选择工作站安装


    > **警告**

    >

    > 工作站类安装将擦除 *您计算机所有硬盘中所有 Linux 相关分区中的所有信息*。


    您通常将 Red Hat Linux 安装在干净的磁盘分区或分区组上，或者覆盖在另一个 Linux 安装之上。


    > **警告**

    >

    > 如果您与 Windows NT 共享磁盘，请勿选择工作站类安装；如果这样做，您将无法引导 Windows NT。LILO 会覆盖 NT 的引导加载程序，您将无法引导
    NT。您必须执行自定义类安装，并配置 LILO，使其不安装在主引导记录（MBR）上。

    >

    > 要在当前装有 NT 的系统上创建双引导环境，您必须将 LILO 安装在根分区的第一扇区，而不是 MBR。请务必创建一张启动磁盘。在这种情况下，您要么使用启动磁盘，要么配置
    NT 系统加载程序从根分区的第一扇区引导 LILO。请务必查阅 http://www.linux-doc.org/HOWTO/mini/Linux+NT-Loader.html
    以获取更多关于设置 LILO 和 NT 的信息。


    ### 5.10 自动分区


    自动分区允许您在不自行分区硬盘的情况下执行安装。如果您对于手动分区系统感到不舒服，选择自动分区是最佳解决方案。


    **自动分区** 屏幕仅在执行工作站或服务器类安装时才会显示。


    如果您选择手动分区，请参阅文档 CD 上的 *官方 Red Hat Linux 参考指南*；参见章节 *通过 GUI 安装 Red Hat Linux*。


    ### 请注意


    如果未出现 **自动分区** 屏幕，则说明此安装选项没有足够的可用空间。您可以退出安装程序以腾出空间，或者手动分区。


    ### 图 5-7 自动分区


    ![](img/f097eb927132822630978994ad35bce4_43_0.png)


    在此屏幕上，您可以选择继续此安装，使用 **Disk Druid** 进行**手动**分区，使用 **fdisk** 进行手动分区，或者使用 **Back**（后退）按钮选择其他安装方法（见
