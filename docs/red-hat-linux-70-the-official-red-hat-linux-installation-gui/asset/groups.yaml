  - '[PAGE 120]


    This chapter explains how to install Red Hat Linux 7.0 without creating Linux
    partitions on your system.


    # Please Note


    Although this is a great way to explore the world of Red Hat Linux without having
    to put Linux partitions on your system, please note that you will still have to
    perform a full Red Hat Linux installation as outlined in this manual.


    # Please Note


    You must currently have a formatted DOS (FAT) filesystem in order to perform this
    type of installation. Users who have Win95/98 should have no problems with this
    type of installation. Users who have NTFS partitions (such as those using Windows
    NT) will have to create and format a DOS (FAT) filesystem before this installation
    can be performed. This installation will not work unless the DOS (FAT) filesystem
    has been formatted prior starting the Red Hat Linux installation.


    # B.1 The Ups and Downs of a Partitionless Installation


    There may be reasons why you might want to perform a partitionless installation,
    but there also are some drawbacks (depending on how you look at them). We’ll discuss
    these potential drawbacks below.


    Here we will cover the basics of what will happen, both during an installation
    and as a result of this type of installation, and how your system will be affected.


    Basic Installation'
  - '[PAGE 121]


    You will perform a basic Red Hat Linux installation. However, instead of adding
    Linux partitions to your system, you will edit an existing, formatted DOS (FAT)
    partition (that must have enough free space) to be named root (/).


    Unlike a typical Red Hat Linux installation, you will not need to format any partitions,
    since you will not be adding any partitions to your system.


    # LILO (Linux Loader) and Boot Disk


    In a partitionless installation, you will not configure LILO (the Linux Loader).
