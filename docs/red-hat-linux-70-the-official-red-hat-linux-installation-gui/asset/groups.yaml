    an `.rpm-save extension` (e.g. `sendmail.cf.rpm save`) and leaves a log of the
    actions it took in `/tmp/upgrade.log`. As software evolves, configuration file
    formats can change, so you should carefully compare your original configuration
    files to the new files before integrating your changes.


