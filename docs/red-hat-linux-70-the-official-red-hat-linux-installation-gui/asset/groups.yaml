    ## 6 文本模式安装概览


    本章介绍了 CD-ROM 文本模式工作站级安装的基础知识。如果由于某种原因你无法启动 GUI 安装程序，或者你更喜欢基于文本模式的安装，这些说明旨在作为快速参考，帮助你完成基本的工作站级安装。


    ### 请注意


    服务器级和自定义级安装不在本章范围内。有关这些说明，请参阅包含《*官方 Red Hat Linux 参考指南*》的文档 CD。本章仅是对安装程序的快速回顾，可能不包含你所需的所有信息。强烈建议你在执行
    Red Hat Linux 的文本模式安装之前阅读本章以及文档 CD 上的内容。


    ### 6.1 使用键盘导航


