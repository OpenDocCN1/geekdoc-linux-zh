    \ 6.12 节，*网络配置*。\n\n> **请注意**\n>\n> 手动分区不在本章讨论范围内。虽然会对 **Disk Druid** 进行简要介绍，但不会讨论\
    \ `fdisk`。有关使用 **Disk Druid** 或 `fdisk` 的完整说明，请参阅文档 CD 上的 *Red Hat Linux 官方参考指南*。\n\
    \n在此时，有必要让安装程序知道应将 Red Hat Linux 安装在哪里。这是通过为将安装 Red Hat Linux 的一个或多个磁盘分区定义挂载点来实现的。您可能还需要在此时创建和/或删除分区（参见图\
    \ 6–7，*使用 Disk Druid 进行分区*）。\n\n### 图 6–7 **使用 Disk Druid 进行分区**\n\n![](img/f097eb927132822630978994ad35bce4_76_0.png)\n\
    \n> **请注意**\n>\n> 如果您尚未规划如何设置分区，请参阅文档 CD 上 *Red Hat Linux 官方参考指南* 中的分区附录。至少，您需要一个大小适当的¹根分区，以及至少\
    \ 16 MB 的交换分区。\n\nRed Hat Linux 7.0 中使用的分区工具是 *Disk Druid*。除了某些罕见情况外，Disk Druid\
    \ 可以处理典型 Red Hat Linux 安装的分区需求。\n\n除非您有其他原因，否则我们建议您创建以下分区：\n\n- 交换分区（至少 16MB）--\
    \ 交换分区用于支持 **虚拟内存**。换句话说，当系统正在处理的数据无法容纳在 RAM 中时，数据会被写入交换分区。如果您的计算机 RAM 为 16MB\
    \ 或更少，您 *必须* 创建一个交换分区。即使您拥有更多内存，仍然建议创建交换分区。交换分区的最小大小应等于您计算机的 RAM，或者 16MB（取两者中较大的值）。在\
    \ Disk Druid 中，交换分区的字段应类似于：\n\n  `<swap> hda2 125M 125M Linux swap`\n\n- /boot\
    \ 分区（最大 16MB）-- 挂载在 /boot 上的分区包含操作系统内核（允许您的系统启动 Red Hat Linux），以及引导过程中使用的文件。由于大多数\
    \ PC BIOS 的限制，创建一个小的分区来容纳这些文件是一个好主意。此分区不应超过 16MB。在 Disk Druid 中，/boot 分区的字段应类似于：\n\
    \n  `/boot hda1 16M 19M Linux native`\n\n- 根分区（900MB-1.7GB）-- 这是 \"/\"（根目录）所在的位置。在此配置中，所有文件（除存储在\
    \ /boot 中的文件外）都位于根分区上。850MB 的根分区允许进行相当于工作站级别的安装（剩余空间很少），而 1.7GB 的根分区则允许您安装所有软件包。在\
    \ **Disk Druid** 中，/ 分区的字段应类似于：\n\n  `/ hda2 900M 3669M Linux native`\n\n### 6.10.1\
    \ 添加分区时的问题\n\n如果您尝试添加一个分区而 **Disk Druid** 无法执行您的请求，您将看到一个对话框，列出了当前未分配的分区，以及它们无法分配的原因。未分配的分区也会显示在\
    \ **Disk Druid** 的主屏幕上（您可能需要滚动查看“分区”部分才能看到它们）。\n\n要修复请求但未分配的分区，您必须将该分区移动到具有可用空间的其他驱动器上，调整该分区的大小以适应当前驱动器，或者完全删除该分区。使用“编辑”按钮或双击该分区来进行更改。\n\
    \n### 6.10.2 格式化分区\n\n接下来，选择您要格式化的分区（见图 6–8，格式化分区）。您必须格式化所有新创建的分区。包含您希望保留的数据（如\
    \ /home 或 /usr）的分区不应被格式化。\n\n### 图 6–8 格式化分区\n\n![](img/f097eb927132822630978994ad35bce4_79_0.png)\n\
    \n选择好要格式化的分区后，按 [Space] 键。如果您希望在格式化每个文件系统时检查 **坏块**（推荐用于较旧的磁盘驱动器），请选择“格式化时检查坏块”。选择“确定”，然后按\
    \ [Space] 键。\n\n> **请注意**\n> 选择检查坏块可能会大幅增加您的总安装时间。由于大多数新型硬盘容量较大，检查坏块可能需要一段时间，具体取决于您硬盘的大小。\n\
    \n## 6.11 主机名配置\n\n如果您的计算机中有网卡，请在此处输入一个 *完全合格的域名*，格式为：`hostname.domain.name`\n\
    \n### 图 6–9 输入主机名\n\n![](img/f097eb927132822630978994ad35bce4_80_0.png)\n\n如果您的计算机不是网络的一部分，您可以为系统输入一个主机名。请借此机会输入一个名称；如果不输入，您的系统将被称为\
    \ localhost。\n\n## 6.12 网络配置\n\n如果您从 CD-ROM 安装且已安装网卡，现在可以配置您的网络信息了。\n\n### 图 6–10\
    \ 输入网络信息\n\n![](img/f097eb927132822630978994ad35bce4_81_0.png)\n\n在此对话框中您有两个选择（见图\
    \ 6–10，输入网络信息）：\n\n- 选择使用 bootp/dhcp。在这种情况下，您局域网中现有的服务器将在连接时动态提供将系统添加到网络所需的网络相关信息。（请注意，如果您这样做，此对话框中其余的字段将被禁用，因为\
    \ DHCP 和 BOOTP 基本上会为您“填空”。）\n- 在提供的字段中输入静态网络信息。在这种情况下，您提供的网络信息将被分配给此系统。\n\n##\
    \ 6.13 鼠标配置\n\n接下来，安装程序将探测鼠标。使用 [Up] 和 [Down] 方向键根据需要确认或更改选择。\n\n[^1]: “大小适当”最好由您专门用于\
    \ Red Hat Linux 的可用空间量、您准备进行的安装大小以及您物理上专门用于 Red Hat Linux 的空间来定义。我们建议最小的根分区大小为\
    \ 900M。\n\n"
