  - '[PAGE 12]


    # 2 New Features of Red Hat Linux 7.0


    This chapter describes installation features new to Red Hat Linux 7.0. To learn
    about non-installation-related new features, please refer to the *Official Red
    Hat Linux Reference Guide* on the Documentation CD or online at http://www.redhat.com/support/manuals.


    # 2.1 Installation-Related Enhancements


    Improvements to Red Hat Linux 7.0 which will make installation even easier include:


    New Multi-CD Install


    As the installation program continues to grow, Red Hat has developed an installation
    program capable of installing Red Hat Linux from multiple CD-ROMs.


    XFree 4.0


    Configuration of your X Window System during the installation has never been more
    thorough. From choosing your monitor and its correct settings, to video card probing,
    to testing your desired X setup, Xconfigurator will help you set everything just
    right.


    USB Support


    Red Hat Linux 7.0 now supports USB devices (mice and keyboards). With USB support,
    there is no need to reboot when a new device is added -- just attach the device
    and go.


    Help Text Available in Text Mode Installation


    Help text has been added to the text mode installation program to further assist
    you during your installation of Red Hat Linux 7.0. By pressing [F1], you can enable
    help text for that specific screen. Press [Enter] to close the help text screen.


    New GNOME Default Window Manager


    The Sawfish window manager has been added as the new default manager for the GNOME
    desktop interface.


    LDAP and Kerberos Configuration


    Network security has been enhanced with the addition of LDAP and Kerberos to Red
    Hat Linux 7.0. For more information on these programs, refer to the *Official
    Red Hat Linux Reference Guide*.'
