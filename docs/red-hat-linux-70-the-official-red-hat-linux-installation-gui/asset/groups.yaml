    \ you’ll need for the installation. If you’ve already read through Chapter 3,\
    \ *Seven Steps to Get You Started*, and followed the instructions, you should\
    \ be ready to begin.\n\n> **Please Note**\n> \n> Occasionally, some hardware components\
    \ require a **driver disk** during the installation. The driver disk could be\
    \ produced by Red Hat, it could be a disk made by you, or it could be a disk that\
    \ a hardware vendor includes with a piece of hardware. Another source for finding\
    \ driver disks is http://www.redhat.com/support/errata/.\n> \n> If a screen appears\
    \ prompting you to insert a driver disk, please do so. For more information about\
    \ driver disks, refer to *Appendix C, Driver Disks* in the *Official Red Hat Linux\
    \ Reference Guide* on the Documentation CD.\n\n### 5.2.1 Booting the Installation\
    \ Program\n\n**Please Note**\n\nIf you need to create a boot disk, please refer\
    \ to Section 3.5.2, *Making Installation Disquettes*.\n\nInsert the boot disk\
    \ into your computer's first diskette drive and reboot (or boot using the CD-ROM,\
    \ if your computer supports this).\n\nYour BIOS settings may need to be changed\
    \ to allow you to boot from the diskette or CD-ROM.\n\n**Tip**\n\nTo change your\
    \ BIOS, take note of the instructions given when your computer first begins to\
    \ boot. Often you will see a line of text telling you to press the [Del] or [F1]\
    \ key to enter the BIOS settings.\n\nNext, find the section where you can alter\
    \ your boot sequence. The default is often C, A or A, C (depending on whether\
    \ you boot from your hard drive [C] or a floppy drive [A]). Change this sequence\
    \ so that the CD-ROM is first in your boot order and that C or A (whichever is\
    \ your typical boot default) is second. This instructs the computer to first look\
    \ at the CD-ROM drive for bootable media; if it cannot be found there, it will\
    \ look at your hard drive or floppy next.\n\nSave your changes before exiting\
    \ the BIOS. For more information please refer to the documentation that came with\
    \ your system.\n\nThere are three possible workstation-class boot methods:\n\n\
    - *Bootable CD-ROM* -- your machine supports a bootable CD-ROM drive and you want\
    \ to perform a local CD-ROM installation.\n- *Local boot disk* -- your machine\
    \ will not support a bootable CD-ROM and you want to install from a local CD-ROM\
    \ or a hard drive.\n"
  mdcn: "\n如果您计划创建以 Windows NT 为第二操作系统的双启动系统，则工作站级别的安装无法正确完成。如果您与 Windows NT 共享系统，您将无法启动\
    \ Windows NT。LILO 会覆盖 NT 的引导加载程序，导致您无法启动 NT。您必须执行自定义级别安装，并配置 LILO，使其不安装到主引导记录（MBR）上。\n\
    \n## 请注意\n\n与早期工作站级别的安装不同，执行 Red Hat Linux 7.0 工作站级别的安装时，不会安装网络守护进程 xinetd（inet\
    \ 服务）。保留 xinetd 可获得更安全的安装；但是，入站¹与网络相关的服务，如 finger、telnet、talk 和 FTP 将无法正常工作。如果您需要这些类型的服务，请选择服务器级别或自定义级别安装。\n\
    \n¹ 入站服务意味着，例如，您可以 telnet 到其他系统，但其他系统无法 telnet 到您的系统。\n\n请使用提供的空间填写您的系统设置和需求。这将有助于您记录当前系统信息，并使安装过程更加顺利。\n\
    \n| 项目 | 描述 | 编号 |\n| :--- | :--- | :--- |\n| 硬盘：类型、标签、大小；例如：IDE hda=1.2G | |\
    \ 1) |\n| 分区：分区图和挂载点；例如：/dev/hda1= /home, /dev/hda2= /（在您知道它们位于何处后填写此项）。 | | 2)\
    \ |\n| 内存：系统中安装的 RAM 数量；例如：64MB, 128MB | | 3) |\n| CD-ROM：接口类型；例如：SCSI, IDE (ATAPI)\
    \ | | 4) |\n| SCSI 适配器：如果存在，制造商和型号；例如：BusLogic SCSI 适配器, Adaptec 2940UW | | 5)\
    \ |\n| 网卡：如果存在，制造商和型号；例如：Tulip, 3COM 3C590 | | 6) |\n| *鼠标：* 类型、协议和按钮数量；例如：通用\
    \ 3 键 PS/2 鼠标，MouseMan 2 键串口鼠标 | | 7) |\n| *显示器：* 制造商、型号和规格；例如：Optiquest Q53,\
    \ ViewSonic G773 | | 8) |\n| *显卡：* 制造商、型号和 VRAM 大小；例如：Creative Labs Graphics Blaster\
    \ 3D, 8MB | | 9) |\n| *声卡：* 制造商、芯片组和型号；例如：S3 SonicVibes, Sound Blaster 32/64 AWE\
    \ | | 10) |\n| *IP、DHCP 和 BOOTP 地址：* 四个由点分隔的数字；例如：10.0.2.15 *（请联系您的网络管理员寻求帮助）*\
    \ | | 11) |\n| *子网掩码：* 通常是四个由点分隔的数字；例如：255.255.248.0 *（请联系您的网络管理员寻求帮助）* | | 12)\
    \ |\n| 网关 IP 地址：四个由点分隔的数字；例如：10.0.2.245（请联系您的网络管理员寻求帮助） | | 13) |\n| 一个或多个名称服务器\
    \ IP 地址（DNS）：通常是一个或多个由点分隔的数字组；例如：10.0.2.1（请联系您的网络管理员寻求帮助） | | 14) |\n| 域名：分配给贵组织的名称；例如：Red\
    \ Hat 的域名是 redhat.com（请联系您的网络管理员寻求帮助） | | 15) |\n| 主机名：您的计算机名称；您个人选择的名称，例如：cookie,\
    \ southpark（请联系您的网络管理员寻求帮助） | | 16) |\n\n# 5 从头到尾安装 Red Hat Linux\n\n本章讨论了 Red\
    \ Hat Linux 工作站级别安装的所有步骤。我们将涵盖以下领域：\n\n- 熟悉安装程序的图形用户界面\n- 启动安装程序\n- 选择安装方法\n-\
    \ 安装过程中的配置步骤（语言、键盘、鼠标等）\n- 完成安装\n\n到本章结束时，您的系统上将安装好 Red Hat Linux 7.0。\n\n## 5.1\
    \ 安装程序图形用户界面\n\n如果您之前使用过**图形用户界面 (GUI)**，您就会熟悉这个过程。如果没有，只需使用鼠标导航屏幕，“点击”按钮或输入文本字段。您也可以使用\
    \ [Tab] 键和 [Enter] 键在安装过程中进行导航。\n\n如果您不希望使用 GUI 安装程序，也可以使用文本模式安装程序。要进入文本模式，请输入以下引导命令：\n\
    \n```\nboot: text\n```\n\n### 5.1.1 未检测到鼠标？\n\n如果出现 **Mouse Not Detected**（未检测到鼠标）屏幕（见图\
    \ 5-1，*未检测到鼠标*），则说明安装程序无法正确识别您的鼠标。\n\n![](img/f097eb927132822630978994ad35bce4_29_0.png)\n\
    \n*图 5–1 未检测到鼠标*\n\n您可以选择继续 GUI 安装或使用文本模式安装，后者不需要使用鼠标。如果您选择继续 GUI 安装，您将需要提供安装程序您的鼠标配置信息（见图\
    \ 5-4，*鼠标配置*）。\n\n有关文本模式工作站级别安装的说明，请参阅第 6 章 *文本模式安装一览*。\n\n有关文本模式自定义安装的说明，请参阅文档光盘上的《*Red\
    \ Hat Linux 官方参考指南*》。\n\n### 5.1.2 关于虚拟控制台的说明\n\nRed Hat Linux 安装程序提供的不仅仅是安装过程的对话框。您可以获取多种类型的诊断消息，此外，我们还为您提供了一种从\
    \ shell 提示符输入命令的方式。此信息在五个**虚拟控制台**上显示，您可以通过单个按键在它们之间切换。\n\n如果在安装 Red Hat Linux\
    \ 时遇到问题，这些虚拟控制台非常有用。在安装控制台或系统控制台上显示的消息可以帮助定位问题。请参阅表 5–1 *控制台、按键和内容*，查看虚拟控制台、切换到它们的按键及其内容的列表。\n\
    \n通常，除非您正在尝试诊断安装问题，否则没有理由离开默认控制台（虚拟控制台 #7）。但如果您感到好奇，请随意查看。\n\n### 表 5–1 控制台、按键和内容\n\
    \n| 控制台 | 按键 | 内容 |\n| :--- | :--- | :--- |\n| 1 | [Ctrl]+[Alt]+[F1] | 安装对话框 |\n\
    | 2 | [Ctrl]+[Alt]+[F2] | shell 提示符 |\n| 3 | [Ctrl]+[Alt]+[F3] | 安装日志（来自安装程序的消息）\
    \ |\n| 4 | [Ctrl]+[Alt]+[F4] | 系统相关消息 |\n| 5 | [Ctrl]+[Alt]+[F5] | 其他消息 |\n| 7\
    \ | [Ctrl]+[Alt]+[F7] | X 图形显示 |\n\n## 5.2 启动安装程序\n\n现在是时候开始安装 Red Hat Linux 了。要启动安装，您必须先引导安装程序。请确保您拥有安装所需的所有资源。如果您已经阅读过第\
    \ 3 章 *七步快速入门* 并按照说明操作，您应该已准备就绪。\n\n> **请注意**\n> \n> 偶尔，某些硬件组件在安装期间需要**驱动磁盘**。驱动磁盘可以由\
    \ Red Hat 制作，也可以是您自己制作的磁盘，或者是硬件供应商随硬件附带的磁盘。查找驱动磁盘的另一个来源是 http://www.redhat.com/support/errata/。\n\
    > \n> 如果出现提示您插入驱动磁盘的屏幕，请照做。有关驱动磁盘的更多信息，请参阅文档光盘上的《*Red Hat Linux 官方参考指南*》中的 *附录\
    \ C，驱动磁盘*。\n\n### 5.2.1 引导安装程序\n\n**请注意**\n\n如果您需要制作启动磁盘，请参阅 3.5.2 节 *制作安装软盘*。\n\
    \n将启动磁盘插入计算机的第一个软盘驱动器并重新启动（如果您的计算机支持此功能，也可以从 CD-ROM 启动）。\n\n您可能需要更改 BIOS 设置，以允许您从软盘或\
    \ CD-ROM 启动。\n\n**提示**\n\n要更改 BIOS，请注意计算机首次开始启动时给出的说明。通常您会看到一行文字，告诉您要按 [Del] 键或\
    \ [F1] 键进入 BIOS 设置。\n\n接下来，找到可以更改启动顺序的部分。默认值通常是 C, A 或 A, C（具体取决于您是从硬盘 [C] 还是软盘驱动器\
    \ [A] 启动）。更改此顺序，使 CD-ROM 成为启动顺序中的第一项，而 C 或 A（无论是您的典型启动默认值）成为第二项。这将指示计算机首先查找 CD-ROM\
    \ 驱动器中的可启动介质；如果在那里找不到，它将接下来查找您的硬盘或软盘。\n\n退出 BIOS 前请保存您的更改。有关更多信息，请参阅随系统提供的文档。\n\
    \n工作站级别的启动方法有三种：\n\n- *可启动 CD-ROM* -- 您的机器支持可启动 CD-ROM 驱动器，并且您希望执行本地 CD-ROM 安装。\n\
    - *本地启动磁盘* -- 您的机器不支持可启动 CD-ROM，并且您希望从本地 CD-ROM 或硬盘安装。\n\n"
