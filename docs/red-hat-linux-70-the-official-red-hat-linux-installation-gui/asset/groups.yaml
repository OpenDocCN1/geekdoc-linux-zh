    not be able to respond to every message sent to us, but you can be sure that we''ll
    be reading them all!


    If you have a support question (for example, if you need help configuring X, or
    if you aren''t sure how to partition you hard drive[s]), please register your
    product at www.redhat.com/how and use the online support system for those type
    of requests.'
