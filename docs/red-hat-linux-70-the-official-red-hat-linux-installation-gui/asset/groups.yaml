  mdcn: "\n\n> **提示**\n> 有关安装前、安装过程中或安装后可能遇到的问题及故障的解答，请参阅**红帽常见问题解答（FAQ）**。您可以在以下网址在线找到该\
    \ FAQ：www.redhat.com/support/docs/faqs/rhl_general_faq/FAQ.html\n\n### 1.1.1 我们需要反馈！\n\
    \n如果您在安装指南中发现错别字，或者想到了让本手册变得更好的方法，我们非常乐意听取您的意见！请务必提及手册的标识符：\n\n```\nInst (EN)-7.0-Print-RHL\
    \ (2000-07-18T15:39-0400)\n```\n\n这样我们就能确切知道您持有的是哪一版本的指南。\n\n请致信至：docs@redhat.com\n\
    \n如果您有改善文档的建议，在描述时请尽量具体。如果您发现了错误，请包含章节编号和部分周边文本，以便我们轻松定位。我们可能无法回复每一封来信，但请放心，我们一定会阅读所有来信！\n\
    \n如果您有技术支持方面的问题（例如，您需要帮助配置 X，或者不确定如何分区硬盘[盘]），请在 www.redhat.com/how 注册您的产品，并使用在线支持系统提出此类请求。\n\
    \n## 2 Red Hat Linux 7.0 的新功能\n\n本章介绍 Red Hat Linux 7.0 中新增的安装功能。要了解与安装无关的新功能，请参阅文档光盘或在线（http://www.redhat.com/support/manuals）上的*《Red\
    \ Hat Linux 官方参考指南》*。\n\n### 2.1 安装相关增强功能\n\n使安装过程更加简便的 Red Hat Linux 7.0 改进包括：\n\
    \n- **新的多光盘安装**\n  随着安装程序不断扩展，红帽开发了一种能够从多张光盘安装 Red Hat Linux 的安装程序。\n\n- **XFree\
    \ 4.0**\n  在安装期间配置 X 窗口系统从未如此全面。从选择监视器及其正确设置，到视频卡探测，再到测试您期望的 X 设置，Xconfigurator\
    \ 将帮助您将所有设置调整至最佳状态。\n\n- **USB 支持**\n  Red Hat Linux 7.0 现在支持 USB 设备（鼠标和键盘）。有了\
    \ USB 支持，当添加新设备时无需重新启动——只需连接设备即可使用。\n\n- **文本模式安装中可用的帮助文本**\n  在文本模式安装程序中增加了帮助文本，以进一步协助您安装\
    \ Red Hat Linux 7.0。按[F1]即可启用该特定屏幕的帮助文本。按[Enter]关闭帮助文本屏幕。\n\n- **新的 GNOME 默认窗口管理器**\n\
    \  Sawfish 窗口管理器已被添加为 GNOME 桌面界面的新默认管理器。\n\n- **LDAP 和 Kerberos 配置**\n  通过在 Red\
    \ Hat Linux 7.0 中增加 LDAP 和 Kerberos，网络安全得到了增强。有关这些程序的更多信息，请参阅*《Red Hat Linux 官方参考指南》*。\n\
    \n## 3 起步的七个步骤\n\n在安装 Red Hat Linux 之前，您应执行以下七个步骤：\n\n### 3.1 步骤 1 - 您是否拥有正确的\
