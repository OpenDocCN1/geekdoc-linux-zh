    - **硬盘**\n  - 如果您已将 Red Hat Linux 文件复制到本地硬盘。有关硬盘安装说明，请参阅文档 CD 上的《*官方 Red Hat Linux\
    \ 参考指南*》。需要启动盘或 PCMCIA 启动盘。\n- **NFS 映像**\n  - 如果您正在从导出 Red Hat Linux CD-ROM 或\
