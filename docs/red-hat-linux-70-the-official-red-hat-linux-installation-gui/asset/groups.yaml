    \ Red Hat Linux 安装。此时可以使用启动磁盘来启动 Red Hat Linux，以便重新安装 LILO。\n    -   **不安装 LILO**\
    \ -- 如果您的系统上安装了 Windows NT，您可能不想安装 LILO。如果您因此选择不安装 LILO，请确保您已选择创建启动磁盘；否则您将无法启动\
    \ Linux。如果您不想将 LILO 写入硬盘，也可以选择不安装 LILO。\n\n#### 提示\n\n要在救援模式下使用启动磁盘，您有几种选择：\n\n\
    -   使用 CD-ROM 启动时，在 `boot:` 提示符下输入 `linux rescue`。\n-   使用网络启动磁盘时，在 `boot:` 提示符下输入\
    \ `linux rescue`。然后您将被提示从网络拉取救援映像。\n-   使用 Red Hat Linux 盒装附带的启动磁盘时，在 `boot:`\
    \ 提示符下输入 `linux rescue`。然后选择一种安装方法，并选择一个有效的安装树来加载。\n\n有关救援模式的更多信息，请参阅《官方 Red Hat\
    \ Linux 参考指南》中的系统管理章节。\n\n### A.5.2 LILO 的替代方案\n\n如果您不希望使用 LILO 来启动您的 Red Hat\
    \ Linux 系统，有几种替代方案：\n\n-   **启动磁盘**\n\n    如前所述，您可以使用安装程序创建的启动磁盘（如果您选择创建了一个）。\n\
    \n-   **LOADLIN**\n\n    您可以从 MS-DOS 加载 Linux。不幸的是，这要求 Linux 内核（如果有 SCSI 适配器，还需要初始\
    \ RAM 磁盘）在 MS-DOS 分区上可用。实现这一点的唯一方法是使用其他方式（例如从软盘上的 LILO）启动您的 Red Hat Linux 系统，然后将内核复制到\
    \ MS-DOS 分区。LOADLIN 可从 ftp://metalab.unc.edu/pub/Linux/system/boot/dualboot/ 及相关镜像站点获取。\n\
    \n-   **SYSLINUX**\n\n    一个与 LOADLIN 非常类似的 MS-DOS 程序。它也可从 ftp://metalab.unc.edu/pub/Linux/system/boot/loaders/\
    \ 及相关镜像站点获取。\n\n-   **一些商业引导加载器**\n\n    例如 System Commander 和 Partition Magic，它们能够启动\
    \ Linux（但仍需要在您的 Linux 根分区中安装 LILO）。\n\n### A.5.3 SMP 主板与 LILO\n\n本节仅适用于 SMP 主板。如果安装程序检测到您的系统上有\
    \ SMP 主板，它将自动创建两个 `lilo.conf` 条目，而不是通常的单个条目。\n\n一个条目将称为 `linux`，另一个将称为 `linux-up`。默认情况下将启动\
    \ `linux`。但是，如果您遇到 SMP 内核的问题，可以选择改为启动 `linux-up` 条目。您将保留之前所有的功能，但将仅使用单个处理器运行。\n\
    \n## A.6 升级软件包\n\n此时，在所有软件包升级或安装完成之前，您无需执行任何其他操作（参见图 A-6，*安装软件包*）。\n\n### 图 A-6\
    \ 安装软件包\n\n![](img/f097eb927132822630978994ad35bce4_117_0.png)\n\n## A.7 升级完成\n\
    \n恭喜！您的 Red Hat Linux 7.0 升级现已完成！\n\n接下来系统将提示您为重启做准备。请记得取出软盘驱动器中的软盘或 CD-ROM 驱动器中的光盘。如果您没有安装\
    \ LILO，现在将需要使用您的启动磁盘。\n\n#### 提示\n\n如果您需要快速回顾 Red Hat Linux 的一些基本概念，请参阅 *《官方 Red\
    \ Hat Linux 快速入门指南》*。\n\n有关系统配置和管理的详细信息，请参阅文档 CD-ROM 上的 *《官方 Red Hat Linux 参考指南》*。\n\
    \n### 图 A-7 升级完成\n\n![](img/f097eb927132822630978994ad35bce4_118_0.png)\n"
