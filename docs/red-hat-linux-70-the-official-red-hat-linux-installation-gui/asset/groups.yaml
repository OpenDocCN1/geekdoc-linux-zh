    if not included as part of your boxed set), which covers topics relating to the
    basics of your system, as an introduction to using Red Hat Linux.


    If you are a more experienced user looking for information on system configuration
    or administration topics, you may find the *Official Red Hat Linux Reference Guide*
    on the Documentation CD to be more helpful.


    ## 6 Text Mode Installations at a Glance


    This chapter covers the basics of a CD-ROM text mode, workstation-class installation.
    If for some reason you are not able to boot into the GUI installation program,
    or prefer the text mode based installation, these instructions are designed as
    a quick reference to get you through a basic workstation-class installation.


    ### Please Note


    Server- and custom-class installations are not covered in this chapter. For those
    instructions, please refer to the Documentation CD which contains the *Official
    Red Hat Linux Reference Guide*. This chapter is only a quick review of the installation
    program and may not contain all the information you need. It is strongly recommended
    that you read this chapter as well as the content on the Documentation CD prior
    to performing a text mode installation of Red Hat Linux.


    ### 6.1 Using the Keyboard to Navigate


    Navigation through the installation dialogs is performed through a simple set
    of keystrokes. To move the cursor, use [Left], [Right], [Up], and [Down] arrow
    keys. Use [Tab], and [Alt]-[Tab] to cycle forward or backward through each widget
    on the screen. Along the bottom, most screens display a summary of available cursor
    positioning keys.


    To “press” a button, position the cursor over the button (using [Tab], for instance)
    and press [Space] or [Enter]. To select an item from a list of items, move the
    cursor to the item you wish to select and press [Enter]. To select an item with
    a check box, move the cursor to the check box and press [Space] to select an item.
    To deselect, press [Space] a second time.


    Pressing [F12] accepts the current values and proceeds to the next dialog; it
    is equivalent to selecting the OK button.


    ### 6.2 Text Mode Boot Options


    To start the text mode installation program explained here, before pressing [Enter]
    at the boot prompt, type:


    ```

    boot: text

    ```


    If the installation program does not properly detect your hardware, you may need
    to restart the installation in "expert" mode. To start an expert mode installation,
    type:


    ```

    boot: text expert

    ```


    Expert mode disables most hardware probing, and gives you the option of entering
    options for the drivers loaded during the installation.


    > **Please Note**

    >

    > The initial boot messages will not contain any references to SCSI or network
    cards. This is normal; these devices are supported by modules that are loaded
    during the installation process.


    Note that the command to start a serial installation has changed. If you must
    perform the installation in serial mode, type:


    ```

    boot: linux console=<device>

    ```


    Where `<device>` should be the device you are using (such as ttyS0 or ttyS1).


