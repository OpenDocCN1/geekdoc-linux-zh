    Although a workstation-class installation will automatically choose most of the
    packages for you, you must select either GNOME or KDE (or both). You can also
    choose whether to install the **Games** package.


    Additionally, if you would like to select individual packages, check **Select
    Individual Packages** and click **Next**.'
