  - '[PAGE 14]


    # ## 3 Seven Steps to Get You Started


    There are seven steps you should perform prior to installing Red Hat Linux:


    # ### 3.1 Step 1 - Do You Have the Right Red Hat Linux Components?


    If you''ve purchased the Official Red Hat Linux boxed set, you''re ready to go!
    However, mistakes occasionally happen, so now is a good time to double-check the
    contents of your boxed set.


    In your Red Hat Linux box, there is a red and white **Registration Card**. On
    the back of that card is a list of the contents of your boxed set version. Please
    read over this list and check to make sure that you have all the diskettes and
    manuals that are available with your version.


    If you''ve purchased the Official Red Hat Linux boxed set from Red Hat, Inc. (or
    one of its distributors), and you''re missing one or more of the items listed,
    please let us know! Contact information is also available on the Registration
    Card.


    *How to identify our official boxed set:* The bottom of our box has an ISBN number
    next to one of the bar codes. That ISBN number should be in this form:


    ```

    1-58569-xx-y

    ```


    (The xx and y will be unique numbers.)


    Red Hat partners with companies (international and domestic) so that we can make
    Red Hat Linux available to you in the most convenient form. Because of these partnerships,
    you might find that your Red Hat Linux boxed set may not have been actually produced
    by Red Hat.


    If your box has a different ISBN number (or none at all), you''ll need to contact
    the company that produced your boxed set. Normally, third-party producers will
    include their logo and/or contact information on the outside of the box; an official
    Red Hat Linux boxed set lists only our name and contact information.'
  - '[PAGE 15]


    # 3.1.1 Why You Should Register Your Red Hat Linux Boxed Set


    If you have purchased an official Red Hat Linux 7.0 boxed set, you should register
    your prod-uct. Registration offers you many useful services, such as installation
    help support, priority FTP access, and more.


    To register your product, go to http://www.redhat.com/now. You’ll find your Personal
    Prod-uct ID on the red and white registration card in your Official Red Hat Linux
    boxed set. Once registered, you will be able to partake of all the extras Red
    Hat provides to its registered users.


    For more information on registering and the scope of Red Hat’s technical support
    offerings, see Appendix D, Getting Technical Support.


    # 3.1.2 No Boxed Set? No Problem!


    Of course, not everyone purchases a Red Hat Linux boxed set. It’s entirely possible
    to install Red Hat Linux using a CD created by another company, or even via FTP.
    In these cases, you may need to create one or more diskettes to get started.


    For information on downloading and installing Red Hat Linux via FTP, refer to
    http://www.redhat.com/download/howto\_download.html.


    For people installing Red Hat Linux from a CD-ROM not from Red Hat, you may need
    a boot disk, or if using a PCMCIA device during the installation (such as a laptop),
    a PCMCIA boot disk. It may also be possible to start the installation directly
    from the CD. We’ll discuss this in more detail when we outline the various installation
    methods.


    For information on making diskettes, see Section 3.5.2, Making Installation Diskettes.


    # 3.2 Step 2 - Is Your Hardware Compatible?


    Hardware compatibility is particularly important if you have an older system or
    a system that you may have built yourself. Red Hat Linux 7.0 should be compatible
    with most hard-ware in systems that were factory built within the last two years.
    However, with hardware specifications changing almost daily, it’s hard to guarantee
    that your hardware will be 100% compatible.


    First, gather all the system hardware information you can; the Official Red Hat
    Linux Refer-ence Guide on the Documentation CD has instructions in the Installation-Related
    Reference'
  - '[PAGE 16]


    (including instructions for Windows users) which may assist you. In Chapter 4,
    *System Requirements Table*, a table is available for you to fill out and reference
    during the installation.


    Second, use Red Hat''s online resources to make sure your hardware is compatible
    and/or supported. The hardware compatibility list is located at: `http://www.redhat.com/hardware`.


    # ## 3.3 Step 3 - Do You Need Errata?


    Occasionally, we find that the installation may fail, and that a revised diskette
    image is needed for the installation to work properly. In these cases, we make
    special images available via the Red Hat Linux errata listing. Since this is relatively
    rare, you will save time if you try to use the standard diskette images first.
    Review the errata only if you experience problems completing the installation.


    Although most of the time it''s not necessary to check for errata before the installation,
    it is also not a bad idea, either.


    Red Hat offers updated diskette images, documentation and other errata downloads
    for your convenience.


    There are two ways to review the errata:


    +   1.  Online -- `http://www.redhat.com/support/errata`; supplies errata you
    can read online, and you can download diskette images easily.

    +   2.  E-mail -- By sending an empty mail message to `errata@redhat.com`, you
    will receive an e-mail containing a text listing of the complete errata of the
    installation program and related software (if errata exist at that time). Also
    included are URLs to each updated package and diskette image in the errata. Using
    these URLs, you can download any necessary diskette images. Please note: use binary
    mode when transferring a diskette image.


    If you experience problems, focus on entries that include new diskette images
    (the filenames always end in `.img`). If you find an entry that applies to your
    problem, get a copy of the diskette images, and create them using the instructions
    in Section 3.5.2, *Making Installation Diskettes*.


    Also available are documentation errata. When significant changes are made to
    the manuals, we make sure to update these online as well. Documentation updates
    can be found at `http://www.redhat.com/support/errata/doc_errata`.'
