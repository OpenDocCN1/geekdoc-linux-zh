    \n如果未检测到驱动器，系统会询问您拥有哪种类型的 CD-ROM 驱动器。从以下类型中选择：\n\n- SCSI\n  - 如果您的 CD-ROM 驱动器连接到受支持的\
    \ SCSI 适配器，请选择此项；安装程序随后将要求您选择一个 SCSI 驱动器。选择与您的适配器最相似的驱动器。如有必要，您可以指定驱动器的选项；然而，大多数驱动器会自动检测您的\
    \ SCSI 适配器。\n- 其他\n  - 如果您的 CD-ROM 驱动器既不是 IDE 也不是 SCSI，那么它是“其他”。具有专有 CD-ROM 接口的声卡是这种\
    \ CD-ROM 类型的良好示例。安装程序会列出受支持的 CD-ROM 驱动器的驱动器列表——选择驱动器并，如有必要，指定任何驱动器选项。\n\n![](img/f097eb927132822630978994ad35bce4_35_0.png)\n\
    \nCD-ROM 驱动器的可选参数部分列表可在《官方 Red Hat Linux 参考指南》的通用参数和模块附录中找到。\n\n### 如果未找到 IDE\
    \ CD-ROM 怎么办？\n\n如果安装程序未能找到您的 IDE（ATAPI）CD-ROM（它会询问您拥有哪种类型的 CD-ROM 驱动器），请重新启动安装，并在\
    \ boot: 提示符处输入 `linux hdx=cdrom`。根据单元连接的接口以及它是配置为主设备还是从设备，用以下字母之一替换 x：\n\n- a\
    \ - 第一个 IDE 控制器，主设备\n- b - 第一个 IDE 控制器，从设备\n- c - 第二个 IDE 控制器，主设备\n- d - 第二个 IDE\
    \ 控制器，从设备\n\n（如果您有第三和/或第四个控制器，只需继续按字母顺序分配字母，从控制器到控制器，从主设备到从设备。）\n\n一旦识别出来，系统将要求您将\
    \ Red Hat Linux CD 插入您的 CD-ROM 驱动器。完成后选择确定。短暂延迟后，下一个对话框将出现。\n\n![](img/f097eb927132822630978994ad35bce4_35_1.png)\n\
    \n如果要在此时中止安装过程，请重新启动机器并弹出启动盘或 CD-ROM。您可以在“即将安装”屏幕（参见第 5.17 节，准备安装）之前的任何安全点中止安装。\n\
    \n### 5.5 语言选择\n\n使用鼠标选择您希望在安装过程中使用的语言以及系统默认语言（参见图 5-2，*语言选择*）。\n\n选择合适的语言还有助于稍后在安装过程中定位您的时区配置。安装程序将尝试根据您的指定定义适当的时区。\n\
    \n**图 5–2 语言选择**\n\n![](img/f097eb927132822630978994ad35bce4_36_0.png)\n\n###\
    \ 5.6 键盘配置\n\n选择最适合您系统的模型（参见图 5–3，*键盘配置*）。如果您找不到完全匹配项，请选择适合您的键盘类型的最佳 **通用** 匹配项（例如，**通用\
    \ 101 键 PC**）。\n\n接下来，选择您键盘的正确布局类型（例如，美国英语）。\n\n使用多击按键创建特殊字符（如 N, Ö, 和 Ç）是通过“死键”（也称为组合键序列）完成的。死键默认启用。如果您不希望使用它们，请选择\
    \ **禁用死键**。\n\n要测试您的键盘配置，请使用屏幕底部的空白文本字段输入文本。\n\n"
