    # ## 1 Introduction


    Welcome to the *Official Red Hat Linux Installation Guide*. This manual will walk
    you through a typical workstation-class¹ installation of Red Hat Linux. Once you
    have completed the installation as outlined in this manual, you will have a fully
    functioning Red Hat Linux desktop system.


    Throughout this manual, you will find the following symbols:


    **Tip**


    Suggestions for installation options and post installation configurations.


    **Please Note**


    Additional information that you may find to be helpful during your installation.


    CAUTION


    Notes that certain choices or configurations could cause problems with your system
    setup. Please read the text carefully before continuing with the installation.


    ¹ A workstation-class installation is the perfect solution for a home or desktop
    machine. It will present you with a graphical environment to work in and all the
    basic applications you will need to get started.'
  - '[PAGE 9]


    ![](img/f097eb927132822630978994ad35bce4_9_0.png)


    Explains that changes will occur to your current system, such as the removal of
    existing data. Read carefully to determine if the choice you are making is in
    your best interest.


    # 1.1 How to Use This Manual


    This manual, focusing on a workstation-class installation, is ideal for users
    new to Red Hat Linux and for those who want a quick and simple installation solution.
    It will help you prepare your system for the installation, walk you through the
    installation, and assist you in the configuration of your Red Hat Linux system.


    For those of you who need to perform a *server* -2 or a *custom-class*3 installation,
    refer to the *Official Red Hat Linux Reference Guide* on the Documentation CD.


    ![](img/f097eb927132822630978994ad35bce4_9_1.png)


    If you currently use Red Hat Linux 3.0.3 (or greater), you can perform an upgrade.
    Skim Chapter 3, *Seven Steps to Get You Started* to review the basics, then read
    Chapter 5, *Installing Red Hat Linux From Start to Finish*, following the directions
    as you go. Once you have chosen to perform an upgrade in the installation program,
    refer to Appendix A, *Upgrading Your Current System*.


    If you are an experienced user who wants to perform a workstation-class installation,
    but do not need a review of the basics, you can skip ahead to Chapter 5, *Installing
    Red Hat Linux From Start to Finish* to begin the installation process.


    2 A server-class installation sets up a typical server environment. Please note,
    no graphical environment is installed during a server-class installation.


    3 A custom-class installation allows you to choose and configure every option
    for your system. While this does allow for the most flexible installation, it
    is not recommended that a new user attempt this installation type.'
