  md: "\n## Figure A-4 Unresolved Dependencies\n\n![](img/f097eb927132822630978994ad35bce4_112_0.png)\n\
    \n### A.5 Installing LILO\n\nIn order to be able to boot your Red Hat Linux system,\
    \ you usually need to install LILO (the Linux LOader). You may install LILO in\
    \ one of two places:\n\n- The master boot record (MBR)\n\n  The recommended place\
    \ to install LILO, unless the MBR already starts another operating system loader,\
    \ such as System Commander or OS/2’s Boot Manager. The master boot record is a\
    \ special area on your hard drive that is automatically loaded by your computer’s\
    \ BIOS, and is the earliest point at which LILO can take control of the boot process.\
    \ If you install LILO in the MBR, when your machine boots, LILO will present a\
    \ `boot:` prompt. You can then boot Red Hat Linux or any other operating system\
    \ you configure LILO to boot.\n\n- The first sector of your root partition\n\n\
    \  Recommended if you are already using another boot loader on your system (such\
    \ as OS/2's Boot Manager). In this case, your other boot loader will take control\
    \ first. You can then configure that boot loader to start LILO (which will then\
    \ boot Red Hat Linux).\n\n### Figure A–5 LILO Configuration\n\n![](img/f097eb927132822630978994ad35bce4_113_0.png)\n\
    \nIf you choose to install LILO, please select where you would like LILO to be\
