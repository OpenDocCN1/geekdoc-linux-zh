    ## 6.13 Mouse Configuration


    ![](img/f097eb927132822630978994ad35bce4_82_0.png)


    Check *Emulate 3 Buttons* to emulate a three-button mouse if your mouse only has
    two buttons.


    ## 6.14 Time Zone


    Select your appropriate time zone as seen in the **Time Zone** configuration screen
    (Figure 6–12, *Time Zone Configuration*).


    If you wish to set the hardware (CMOS) clock to GMT (Greenwich Mean Time, also
    known as UTC, or Universal Coordinated Time), select **Hardware clock set to GMT**.
    Setting it to GMT means your system will properly handle daylight-saving time,
    if your time zone uses it.


    ![](img/f097eb927132822630978994ad35bce4_83_0.png)


    ## 6.15 Root Password


    Enter a root password. The password must be at least six characters long; the
    password you type is not echoed to the screen. You must enter the password twice;
    if the two passwords do not match, the installation program will prompt you to
    enter them again.


    ![](img/f097eb927132822630978994ad35bce4_84_0.png)


    ## 6.16 Creating User Accounts


    Next, create a user account for yourself which is for your everyday use. A user
    account allows you to safely and easily log into your computer without having
    to be root. The password you enter must be at least six characters long and is
    not echoed to the screen. Enter the password twice; if the two passwords do not
    match, the installation program will prompt you to enter them again.


    ![](img/f097eb927132822630978994ad35bce4_85_0.png)


    ### 6.16.1 Creating Additional User Accounts


    To create additional user accounts, select **Add** in the **User Account Setup**
    dialog (see Figure 6–15, *Entering Additional User Account*), or **OK** to continue
    with the installation.


    ![](img/f097eb927132822630978994ad35bce4_86_0.png)


    ## 6.17 Package Selection


    Select the desktop environment (GNOME, KDE or both) you wish to install. You can
    also choose whether to install games on your system. All other necessary packages
    are installed automatically by performing a workstation-class installation.


    ![](img/f097eb927132822630978994ad35bce4_87_0.png)


    If you are not sure which desktop environment you would like to install, please
    read Section 5.15, *Selecting Package Groups* for more information.


    Check the **Select individual packages** check box to select individual packages.


    ### 6.17.1 Individual Package Selection


    ![](img/f097eb927132822630978994ad35bce4_88_0.png)


    To see the list of packages, use the arrow keys to select the group and press
    [Enter] or [Space]. When a list is selected, the **+** sign (closed) changes to
    a - sign (open) and a list of packages in that category appears. An *** appears
    beside currently selected packages. Press the [Enter] or [Space] keys to select
    or deselect packages.


    To see a description of a particular package, make sure that package is highlighted
    and press [F1].


    ### 6.17.2 Unresolved Dependencies


    If any package requires another package which you have not selected to install,
    the program presents a list of these **unresolved dependencies** and gives you
    the opportunity to resolve them. If you simply press **OK**, the program will
    resolve them automatically by adding all required packages to the list of selected
    packages.


    ![](img/f097eb927132822630978994ad35bce4_89_0.png)


    ## 6.18 Configuring Your Video Adapter


    The installation program then probes for your video card. If your card is detected,
    click **OK** to continue.


    ![](img/f097eb927132822630978994ad35bce4_90_0.png)


    If the installation program cannot detect your video adapter, you''ll see a card
    list, as in Figure 6–20, *Video Card Selection Dialog*. Select your video card
    from the list using the arrow keys and [Space]. If your card is not listed, choose
    **Unlisted Card** and press [Space].


    ![](img/f097eb927132822630978994ad35bce4_91_0.png)


    ## 6.19 Package Installation


    A dialog similar to Figure 6-21, **Installation to Begin Dialog** appears when
    the installation program is ready to format partitions and load software packages.
    The installation program names the log file */tmp/install.log* for this Red Hat
    Linux installation. Select **OK** and press [Space] to continue.


    ![](img/f097eb927132822630978994ad35bce4_92_0.png)


    While software packages are being installed, a progress screen like Figure 6–22,
    *Package Installation Status Dialog* appears.


    ![](img/f097eb927132822630978994ad35bce4_93_0.png)


    ## 6.20 Boot Disk


    After package installation, you will be prompted to create a **boot disk**.


    If you want to create a boot disk, select **Yes** and press [Space]. If not, select
    **Skip** and press [Space].


    ![](img/f097eb927132822630978994ad35bce4_94_0.png)


    If you selected **Yes**, insert a blank, formatted diskette when prompted. Select
    **OK** and press [Space] when ready.


    After a short delay, your boot disk will be created; remove it from your floppy
    drive and label it clearly. Note that if you would like to create a boot disk
    after the installation, you’ll be able to do so. For more information, please
    see the `mkbootdisk` man page, by typing `man mkbootdisk` at a shell prompt.


    ## 6.21 Configuring the X Window System


    The `Xconfigurator` utility gives you the opportunity to configure the X server
    for your system.


    First, `Xconfigurator` presents a list of monitors (see Figure 6-24, *Monitor
    Setup Dialog*). If your monitor is listed, select it and press [Enter]. Otherwise,
    select **Custom**.


    ![](img/f097eb927132822630978994ad35bce4_95_0.png)


    If you select a monitor from the list, you will next enter your video memory,
    see Figure 6–29, *Video Memory*.


    If you select Custom, Xconfigurator prompts you to select the horizontal sync
    range and vertical sync range of your monitor (these values are usually available
    in the documentation which accompanies your monitor, or from your monitor’s vendor
    or manufacturer).


    ![](img/f097eb927132822630978994ad35bce4_96_0.png)


    > **WARNING**

    >

    > Do not select any range that exceeds the capacity of your monitor. If you do
    this, it is possible you may overclock your monitor and damage or destroy it.


    Choose a horizontal sync range for your monitor (see Figure 6–26, *Custom Monitor
    Setup - Horizontal Sync*). Be sure not to choose a range outside of your monitor''s
    capacity. For custom settings, refer to Figure 6–28, *Custom Monitor Information*.


    ![](img/f097eb927132822630978994ad35bce4_97_0.png)


    Next, choose a vertical sync range.


    ![](img/f097eb927132822630978994ad35bce4_98_0.png)


    If you chose to enter custom monitor settings, please enter both the horizontal
    and vertical sync ranges for your monitor (see Figure 6-28, *Custom Monitor Information*).


    ![](img/f097eb927132822630978994ad35bce4_99_0.png)


    After you''ve selected your monitor (and its settings), you must choose the amount
    of memory present on your video card (see Figure 6-29, *Video Memory*).


    ![](img/f097eb927132822630978994ad35bce4_100_0.png)


    If you are not sure how much memory your card has, consult the documentation accompanying
    your video card. Choosing more memory than is present in your card will not damage
    it, but may cause the XFree86 server to start incorrectly.


    Next, choose a clockchip setting if your video card supports it (if it has one).
    The recommended choice, for most video cards, is No Clockchip Setting, since XFree86
    can automatically detect the proper clockchip in most cases.

    '
