    \n### A.5 安装 LILO\n\n为了能够启动您的 Red Hat Linux 系统，通常需要安装 LILO（Linux LOader，Linux\
    \ 加载器）。您可以将 LILO 安装到以下两个位置之一：\n\n-   主引导记录（MBR）\n\n    这是推荐将 LILO 安装到的位置，除非 MBR\
