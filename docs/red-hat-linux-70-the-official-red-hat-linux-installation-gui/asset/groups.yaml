    \ the boot label.\n\n#### Please Note\n\nThe \"Boot label\" column lists what\
    \ you must enter at LILO's `boot:` prompt in order to boot the desired operating\
    \ system. However, if you forget the boot labels defined on your system, you can\
    \ always press [Tab] at LILO's `boot:` prompt to display a list of defined boot\
    \ labels.\n\n### A.5.1 Configuring LILO\n\n- **Create boot disk** -- The **Create\
    \ boot disk** option is checked by default. If you do not want to create a boot\
    \ disk, you should deselect this option. However, we strongly urge you to create\
    \ a boot disk. A boot disk can be handy for a number of reasons:\n  - **Use It\
    \ Instead of LILO** -- You can use a boot disk instead of LILO. This is handy\
    \ if you’re trying Red Hat Linux for the first time, and you’d feel more comfortable\
    \ if the boot process for your other operating system is left unchanged. With\
    \ a boot disk, going back to your other operating system is as easy as removing\
    \ the boot disk and rebooting. If you would rather use a boot disk instead of\
    \ LILO, make sure you enable the Do not install LILO option.\n  - **Use It If\
    \ Another Operating System Overwrites LILO** -- Other operating systems may not\
    \ be as flexible as Red Hat Linux when it comes to supported boot methods. Quite\
    \ often, installing or updating another operating system can cause the master\
    \ boot record (originally containing LILO) to be overwritten, making it impossible\
    \ to boot your Red Hat Linux installation. The boot disk can then be used to boot\
    \ Red Hat Linux so you can reinstall LILO.\n  - **Do not install LILO** -- If\
    \ you have Windows NT installed on your system, you may not want to install LILO.\
    \ If you choose not to install LILO for this reason, make sure that you have chosen\
    \ to create a boot disk; otherwise you will not be able to boot Linux. You can\
    \ also choose to skip LILO if you do not want to write LILO to your hard drive.\n\
    \n#### Tip\n\nTo use the boot disk with rescue mode, you have several options:\n\
    \n- Using the CD-ROM to boot, type `linux rescue` at the `boot:` prompt.\n- Using\
    \ the network boot disk, type `linux rescue` at the `boot:` prompt. You will then\
    \ be prompted to pull the rescue image from the network.\n- Using the boot disk\
    \ included with the Red Hat Linux boxed set, type `linux rescue` at the `boot:`\
    \ prompt. You then pick an installation method and choose a valid installation\
    \ tree to load from.\n\nFor more information regarding rescue mode, refer to the\
    \ System Administration chapter of the Official Red Hat Linux Reference Guide.\n\
    \n### A.5.2 Alternatives to LILO\n\nIf you do not wish to use LILO to boot your\
    \ Red Hat Linux system, there are several alternatives:\n\n- **Boot Disk**\n\n\
    \  As previously stated, you can use the boot disk created by the installation\
    \ program (if you elected to create one).\n\n- **LOADLIN**\n\n  You can load Linux\
    \ from MS-DOS. Unfortunately, it requires a copy of the Linux kernel (and an initial\
    \ RAM disk, if you have a SCSI adapter) to be available on an MS-DOS partition.\
    \ The only way to accomplish this is to boot your Red Hat Linux system using some\
    \ other method (e.g., from LILO on a diskette) and then copy the kernel to an\
    \ MS-DOS partition. LOADLIN is available from ftp://metalab.unc.edu/pub/Linux/system/boot/dualboot/\
