    ### 图 5-5 欢迎使用 Red Hat Linux


    ![](img/f097eb927132822630978994ad35bce4_39_0.png)


    **帮助屏幕** 默认是打开的，但如果您不想查看帮助信息，请点击 **Hide Help**（隐藏帮助）按钮以最小化该屏幕。


    点击 **Next**（下一步）按钮以继续。


    ### 5.9 安装选项


    > **请注意**

    > 功能：Red Hat Linux 7.0 具有一种称为“无分区”的安装方法。如果您的系统有一个具有足够可用空间的 FAT (DOS/Windows) 分区，您可以在不重新分区硬盘的情况下安装
    Red Hat Linux。这种方法非常适合 Linux 初学者，他们希望以最小的干扰来尝试 Red Hat Linux。要了解有关此方法的更多信息，请参阅附录
    B，*无分区安装*。


    Red Hat Linux 允许您选择最适合您需求的安装类型。您的选项包括：**工作站**、**服务器**、**自定义** 或 **升级**。


