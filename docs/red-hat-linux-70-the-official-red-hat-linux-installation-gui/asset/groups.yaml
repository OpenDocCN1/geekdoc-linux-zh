    graphical prompt, at which point you can do any of the following things:


    - Press [Enter] -- Causes LILO’s default boot entry (whichever OS is listed as
    default) to be booted.

    - Choose a boot label, followed by [Enter] -- Causes LILO to boot the operating
    system corresponding to the boot label. (Press [?] at the LILO text boot: for
    a list of valid boot labels.)

    - Do nothing -- After LILO’s timeout period, (which, by default, is five seconds)
    LILO will automatically boot the default boot entry.


    Do whatever is appropriate to boot Red Hat Linux. You should see one or more screens
    of messages scroll by. Eventually, you should see a `login:` prompt or a GUI login
    screen (if you installed the X Window System and chose to start X automatically).


    **Tip**


    If for some reason you need to disable the graphical boot screen, you can do so
    by editing the `lilo.conf` file and then rerunning LILO.


    To do this, comment out (or delete) the line which reads `message=/boot/message`
    in the `lilo.conf` file. To comment a line out, insert the `#` character at the
    beginning of the line. Once you have done this, rerun LILO. To rerun LILO, type
    `/sbin/lilo -v` which will also save changes you make. The next time you boot,
    you will see the text `LILO:` prompt, as is seen in previous Red Hat Linux releases.


    You may also re-enable the graphical boot screen by adding the above line back
    into the `lilo.conf` file and rerunning LILO.


