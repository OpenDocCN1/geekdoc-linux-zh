  mdcn: "\n电话支持服务合同，您需要拨打的电话号码将在注册过程中提供给您。\n\n## D.7 支持常见问题（FAQ）\n\n### D.7.1 问：发送至\
    \ support@redhat.com 的电子邮件被退回\n\n我发送电子邮件至 support@redhat.com，但邮件被退回给我。这是什么问题？\n\
    \n### D.7.2 答：当前不再使用 support@redhat.com\n\n为了更好地服务客户，红帽正在重新构建我们的电子邮件支持流程。目前，support@redhat.com\
    \ 地址不可用。在此期间，请通过 Web 或电话获取支持。\n\n### D.7.3 问：系统不允许登录\n\n我知道我已经注册了，但系统不让我登录。\n\n\
    ### D.7.4 答：旧的用户名和密码无法使用\n\n您可能正在尝试使用旧的用户名和密码，或者只是输错了用户名或密码。\n\n## E 排查 Red Hat\
    \ Linux 安装故障\n\n本附录讨论了一些您可能遇到的常见安装问题及其解决方案。\n\n### E.1 Red Hat Linux 启动故障\n\n\
    #### E.1.1 从 CD-ROM 启动遇到问题？\n\n如果您无法从 Red Hat Linux CD-ROM 启动，您有两个选择：\n\n1.  您可以修改\
    \ BIOS 设置，使系统优先从 CD-ROM 启动，或者\n2.  从盒装套装中附带的启动软盘启动。\n\n要修改 BIOS，请参考您的系统手册以找到正确的键盘组合键来访问\
    \ BIOS，或者在系统开始启动时阅读所需的按键序列。\n\n要从盒装套装中的 Red Hat Linux 启动盘启动，请将软盘插入软驱，然后启动/重启您的计算机。\n\
    \n#### E.1.2 从 Red Hat Linux 启动盘启动遇到问题？\n\n如果您在使 Red Hat Linux 启动盘正确启动系统时遇到困难，您可能需要一个更新版本的启动盘。\n\
    \n请检查在线勘误表以获取更新的软盘映像，并按照提供的说明为系统制作一个新的启动盘。\n\n#### E.1.3 从 PCMCIA 启动盘启动遇到问题？\n\
    \n如果您在使您制作的 PCMCIA 启动盘正确启动系统时遇到困难，您可能需要一个更新版本的启动盘。\n\n请检查在线勘误表以获取更新的软盘映像，并按照提供的说明为系统制作一个新的启动盘。\n\
    \n#### E.1.4 从网络启动盘启动遇到问题？\n\n如果您在使您制作网络启动盘正确启动系统时遇到困难，您可能需要一个更新版本的启动盘。\n\n请检查在线勘误表以获取更新的软盘映像，并按照提供的说明为系统制作一个新的启动盘。\n\
    \n### E.2 开始安装时遇到问题\n\n#### E.2.1 使用 PCMCIA 启动盘所需的选项遇到问题？\n\n如果您使用 PCMCIA 启动盘启动并希望通过\
    \ FTP（或 NFS 或 HTTP）进行安装，但看不到这些安装选项，则您的网卡可能存在问题。\n\n如果网卡在启动过程中未初始化，Red Hat Linux\
    \ 安装程序将*不会*允许您配置系统的网络（无论是在启动时还是在安装过程中）。\n\n请检查硬件兼容列表（http://www.redhat.com/support/hardware），查看您的网卡是否兼容和/或受支持。如果您的网卡未列出，那么它很可能与\
    \ Red Hat Linux 不兼容。\n\n### E.3 安装过程中遇到问题\n\n#### E.3.1 无法进入自动分区屏幕？\n\n如果在安装过程中未出现**自动分区**屏幕，您可能没有足够的可用空间来安装\
    \ Red Hat Linux。\n\n如果您不想手动分区，应该退出安装。您可以通过在移除所有软盘或 CD-ROM 后重启系统来完成此操作，然后您可以重新分配空间以进行安装。\n\
    \n#### E.3.2 创建分区遇到问题？\n\n如果您在创建分区（例如根分区 (/)）时遇到困难，有几件事您应该注意。\n\n请确保您将其设置为 Linux\
    \ 原生分区类型。\n\n除非您的 BIOS 支持其他设置，否则请确保您不超过 1023 个柱面，否则您将无法创建 /boot 或 / 分区。一些新系统允许您超过\
    \ 1023 的限制（使用可用的新版 LILO），但大多数使用旧 BIOS 的机器则不允许。\n\n#### E.3.3 完成分区遇到问题？\n\n如果您使用\
    \ Disk Druid 创建分区，但无法进入下一个屏幕，您可能尚未创建满足 Disk Druid 依赖关系所需的所有分区。\n\n您至少必须拥有以下分区：\n\
    \n- / (根) 分区，Linux 原生类型\n- <swap> 分区，Linux 交换类型\n\n![](img/f097eb927132822630978994ad35bce4_138_0.png)\n\
    \n如果您的系统将是使用 LILO 的双启动系统，那么您还必须创建：\n\n- /boot 分区，Linux 原生类型\n\n#### E.3.4 安装包遇到问题？\n\
    \n如果您在安装包时遇到困难（例如安装程序在读取包时停滞或您收到错误消息），您可能存在磁盘或驱动器问题。\n\n### E.4 安装后遇到问题\n\n####\
    \ E.4.1 图形化 LILO 屏幕遇到问题？\n\n如果由于某种原因您需要禁用图形化启动屏幕，您可以通过编辑 lilo.conf 文件并重新运行 LILO\
    \ 来实现。\n\n要做到这一点，请注释掉（或删除）lilo.conf 文件中读取为 message=/boot/message 的那一行。完成此操作后，重新运行\
    \ LILO。下次启动时，您将看到文本 LILO: 提示符，这与之前 Red Hat Linux 版本中看到的相同。\n\n您也可以将上述行重新添加回 `lilo.conf`\
    \ 文件并重新运行 LILO，从而重新启用图形化启动屏幕。\n\n#### E.4.2 服务器安装和 X 遇到问题？\n\n如果您执行了服务器安装并且遇到困难无法启动\
    \ X，这是因为在服务器类安装期间未安装 X 窗口系统。\n\n您可以通过在选择安装后进行升级时选择升级选项来在服务器类安装中运行 X 窗口系统接口。在升级过程中，选择\
    \ X 窗口系统软件包，并选择 GNOME 或 KDE（或两者都选）。\n\n#### E.4.3 登录遇到问题？\n\n如果您在安装期间未创建用户帐户，您需要以\
    \ *root* 身份登录并使用分配给 root 的密码。\n\n如果您不记得 root 密码，您需要以 `linux single` 模式在 LILO `boot:`\
    \ 提示符处启动您的系统。然后在 `#` 提示符处，您需要输入 `passwd root`，这将允许您为 root 输入一个新密码。此时，您可以输入 `shutdown\
    \ -r now`，系统将使用新密码重启。\n\n如果您不记得用户帐户密码，您必须先成为 root，然后输入 `passwd <username>`。这允许您为指定的用户帐户输入一个新密码。\n\
    \n如果您选择了自定义类或工作站类安装，并且找不到图形化登录屏幕，请检查您的硬件是否存在兼容性问题。硬件兼容列表可在 http://www.redhat.com/support\
    \ 找到。\n\n## 索引\n\nA\n自动启动 . . . . . . . . . . . . . . . . . . . . . . . . . .\
