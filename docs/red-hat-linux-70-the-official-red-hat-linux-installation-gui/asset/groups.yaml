    \ server. Requires a network or PCMCIA boot disk. Refer to the *Official Red Hat\
    \ Linux Reference Guide* on the Documentation CD for HTTP installation instructions.\n\
    \n### 5.4 Beginning the Installation\n\nIf you are planning to install via CD-ROM\
    \ using the graphical interface, please read on.\n\n**Please Note**\n\nIf you'd\
    \ rather perform a text mode custom-class installation, reboot your system and\
    \ at the **boot** : prompt, type **text**. Refer to the *Official Red Hat Linux\
    \ Reference Guide on the Documentation CD* for further instructions. Text mode\
    \ workstation-class installation instructions can be found at Chapter 6, *Text\
    \ Mode Installations at a Glance*.\n\n#### 5.4.1 Installing from CD-ROM\n\nTo\
    \ install Red Hat Linux from CD-ROM, choose **CD-ROM** and select **OK**. When\
    \ prompted, insert the Red Hat Linux CD into your CD-ROM drive (if you did not\
    \ boot from the CD-ROM). Select **OK**, and press [Enter].\n\nThe installation\
    \ program will then probe your system and attempt to identify your CD-ROM drive.\
    \ It will start by looking for an IDE (also known as ATAPI) CD-ROM drive. If found,\
    \ you will continue to the next stage of the installation process (see Section\
    \ 5.5, *Language Selection*).\n\nIf a drive is not detected, you'll be asked what\
    \ type of CD-ROM drive you have. Choose from the following types:\n\n- SCSI\n\
    \  - Select this if your CD-ROM drive is attached to a supported SCSI adapter;\
    \ the installation program will then ask you to choose a SCSI driver. Choose the\
    \ driver that most closely resembles your adapter. You may specify options for\
    \ the driver if necessary; however, most drivers will detect your SCSI adapter\
    \ automatically.\n- Other\n  - If your CD-ROM drive is neither an IDE nor a SCSI,\
    \ it's an \"other.\" Sound cards with proprietary CD-ROM interfaces are good examples\
    \ of this CD-ROM type. The installation program presents a list of drivers for\
    \ supported CD-ROM drives -- choose a driver and, if necessary, specify any driver\
    \ options.\n\n![](img/f097eb927132822630978994ad35bce4_35_0.png)\n\nA partial\
    \ list of optional parameters for CD-ROM drives can be found in the Official Red\
    \ Hat Linux Reference Guide, in the General Parameters and Modules appendix.\n\
    \n### What If the IDE CD-ROM Was Not Found?\n\nIf the installation program fails\
    \ to find your IDE (ATAPI) CD-ROM (it asks you what type of CD-ROM drive you have),\
    \ restart the installation, and at the boot: prompt enter `linux hdx=cdrom`. Replace\
    \ the x with one of the following letters, depending on the interface the unit\
    \ is connected to, and whether it is configured as master or slave:\n\n- a - First\
    \ IDE controller, master\n- b - First IDE controller, slave\n- c - Second IDE\
    \ controller, master\n- d - Second IDE controller, slave\n\n(If you have a third\
    \ and/or fourth controller, simply continue assigning letters in alphabetical\
    \ order, going from controller to controller, and master to slave.)\n\nOnce identified,\
    \ you will be asked to insert the Red Hat Linux CD into your CD-ROM drive. Select\
    \ OK when you have done so. After a short delay, the next dialog box will appear.\n\
    \n![](img/f097eb927132822630978994ad35bce4_35_1.png)\n\nTo abort the installation\
    \ process at this time, reboot your machine and eject the boot disk or CD-ROM.\
    \ You can safely abort the installation at any point before the About to Install\
    \ screen (see Section 5.17, Preparing to Install).\n\n### 5.5 Language Selection\n\
    \nUsing your mouse, select the language you would prefer to use for the installation\
    \ and as the system default (see Figure 5-2, Language Selection).\n\nSelecting\
    \ the appropriate language will also help target your time zone configuration\
    \ later in the installation. The installation program will try to define the appropriate\
    \ time zone based on your specification.\n\n**Figure 5–2 Language Selection**\n\
    \n![](img/f097eb927132822630978994ad35bce4_36_0.png)\n\n### 5.6 Keyboard Configuration\n\
    \nChoose the model that best fits your system (see Figure 5–3, *Keyboard Configuration*).\
    \ If you cannot find an exact match, choose the best **Generic** match for your\
    \ keyboard type (for example, **Generic 101-key PC**).\n\nNext, choose the correct\
    \ layout type for your keyboard (for example, U.S. English).\n\nCreating special\
    \ characters with multiple keystrokes (such as N, Ö, and Ç) is done using \"dead\
    \ keys\" (also known as compose key sequences). Dead keys are enabled by default.\
    \ If you do not wish to use them, select **Disable dead keys**.\n\nTo test your\
    \ keyboard configuration, use the blank text field at the bottom of the screen\
    \ to enter text.\n"
  mdcn: "\n## PCMCIA 启动盘\n在您需要 PCMCIA 支持，但您的机器不支持从 CD-ROM 驱动器启动，*或者*您需要在系统中使用 PCMCIA\
    \ 支持才能使用 CD-ROM 驱动器的情况下使用。此启动盘提供所有安装方法（CD-ROM、硬盘、NFS、FTP 和 HTTP）。\n\n短暂的延迟后，屏幕上应会出现\
