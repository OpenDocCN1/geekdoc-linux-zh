    ```


    在 DOS、NT 和 Windows 95 中，您可以使用 fdisk 和“未记录的”标志 /mbr 创建新的 MBR。这将**仅**重写 MBR 以引导主
    DOS 分区。该命令应如下所示：


    ```

    fdisk /mbr

    ```


    如果您需要从硬盘驱动器中删除 Linux，并尝试使用默认的 DOS fdisk 来执行此操作，您会遇到“分区存在但它们不存在”的问题。删除非 DOS 分区的最佳方法是使用理解除
    DOS 以外其他分区的工具。


    您可以通过在 boot: 提示符下输入 "linux expert"（不包括引号）来使用安装软盘执行此操作。


    ```

    boot: linux expert

    ```


    选择安装（而非升级），当到达分区驱动器时，选择 fdisk。在 fdisk 中输入 [p] 以打印分区号，并使用 [d] 命令删除 Linux 分区。当您对所做的更改感到满意时，您可以按
    [w] 退出，更改将保存到磁盘。如果您删除了太多内容，请输入 [q]，则不会发生任何更改。


    一旦您删除了 Linux 分区，您可以通过按 [Control]+[Alt]+[Delete] 来重新启动计算机，而不是继续安装。


    '
