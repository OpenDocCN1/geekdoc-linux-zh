    \n**可启动分区** -- 列出了每个可启动分区，包括由其他操作系统使用的分区。“Boot label”（启动标签）列将在持有您的 Red Hat Linux\
    \ 系统根文件系统的分区中填充为 `linux`。其他分区也可能具有启动标签。如果您希望为其他分区添加启动标签（或更改现有的启动标签），单击一次该分区以将其选中。选中后，您可以更改启动标签。\n\
